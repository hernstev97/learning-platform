<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta name="description" content="Private Lernplattform für Kotlin & Android, Rust, Linux, Python, Automation und Git – vom Verstehen zum Können." />
    <link rel="icon" type="image/svg+xml" href="/icons/learnkiumu-logo.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-extrabold.woff2" as="font" type="font/woff2" crossorigin />
    <title>learn.kiumu.app</title>
    <script>
      // Set the theme before the first paint; src/ui/theme.ts takes over after load.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('learn:theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161614');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Aktiviere JavaScript, um die Lernplattform zu nutzen.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
