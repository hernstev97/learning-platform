  question: "Der Absturz passiert doch bei aufgaben[i]. Wieso ist das nicht die Zeile?"
  focus: >-
    Geklickt ist die Zeile, in der die Exception fliegt, nicht ihre Ursache: Der Bereich `0..aufgaben.size` in
