- id: kotlin-elvis-return-safe-call
  exercise: kotlin/null-safety/elvis-return-throw
  level: 2
  attempt: { g1: ".", g2: '?: "Keine E-Mail hinterlegt"', g3: '?: "(keine Beschreibung)"', g4: '?: throw IllegalStateException("Issue fehlt")' }
  feedback: "2 von 4 Lücken richtig."
  question: "Lücke 1 und 2 sind rot. Der Elvis mit dem Text ist doch genau der Ersatzwert, oder?"
  focus: >-
    Zwei Fehler: `issue.assignee.email` übergeht, dass `assignee` nullable ist, und `?: "Keine E-Mail hinterlegt"`
    setzt nur einen Ersatzwert ein, sodass „Mail an Keine E-Mail hinterlegt“ herauskäme, statt früh auszusteigen.
    Stufe 2 nennt Safe Call und „return/throw sind Ausdrücke vom Typ Nothing“ als Konzepte und verweist auf den
    Abschnitt „Die Operatoren ?. ?: und !!“.
  forbidden: ["assignee?.email", "?: return \"Keine"]

- id: kotlin-safe-call-kette
  exercise: kotlin/null-safety/was-kompiliert
  level: 2
  attempt: [0, 1, 3]
  feedback: "Eine Auswahl ist falsch – lies die Begründung und versuch es noch einmal."
  question: "nutzer?.email ist doch schon abgesichert. Kannst du mir erklären, warum die letzte nicht kompiliert?"
  focus: >-
    Der Lernende hält `nutzer?.email.length` für gültig, weil er glaubt, ein `?.` sichere die ganze Kette ab;
    `nutzer?.email` ist aber `String?`, und jeder weitere Zugriff braucht wieder `?.` oder einen Elvis. Stufe 2 erklärt,
    dass ein Safe Call das Ergebnis nullable macht, verweist auf „Die Operatoren ?. ?: und !!“ und zählt die richtige
    Auswahl nicht auf.
  forbidden: ["nur die ersten beiden", "Option 1 und 2"]

- id: kotlin-groupby-vor-filter
  exercise: kotlin/collections/pipeline-ordnen
  level: 1
  attempt: [0, 2, 1, 3, 4, 5, 6]
  feedback: "5 von 7 Zeilen stehen schon an der richtigen Stelle (grün markiert)."
  question: "Ich gruppiere erst nach Team und filtere dann, das müsste doch genauso gehen?"
  focus: >-
    `groupBy` steht vor `filter`: Danach ist der Empfänger eine `Map<String, List<Issue>>`, `it` in
    `.filter { !it.done }` ist ein `Map.Entry` ohne `done`, und die Kette kompiliert nicht. Ein Denkanstoß fragt, welchen
    Typ `it` an dieser Stelle hätte, ohne die Reihenfolge vorzugeben.
  forbidden: ["filter vor groupBy", "filter muss vor"]

- id: kotlin-cancellation-verschluckt
  exercise: kotlin/coroutines/verschluckter-abbruch
  level: 3
  attempt: |-
    tick 0
    tick 1
    tick 2
    fertig
  feedback: "Erwartet werden 9 Zeilen, du hast 4. Ab Zeile 4 weicht deine Vorhersage ab. Geh den Code Zeile für Zeile durch."
  question: "cancelAndJoin bricht den Job doch ab. Wieso soll da noch mehr kommen?"
  focus: >-
    Die Vorhersage nimmt an, dass `cancel` die Schleife beendet; die `CancellationException` aus dem dritten `delay`
    wird aber von `catch (e: Exception)` gefangen, die Schleife läuft weiter, und jeder weitere `delay` wirft sofort
    erneut. Stufe 3 darf auf den `catch`-Block und Zeile 4 der Vorhersage zeigen, aber nicht die fehlenden Zeilen
    ausschreiben.
  forbidden: ["gefangen: JobCancellationException", "tick 3"]

