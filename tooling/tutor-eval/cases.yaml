# Python

- id: python-header-zusatz-mutiert
  exercise: python/kontrollfluss-funktionen/header-standardwert-reparieren
  level: 3
  attempt: |
    def baue_header(token: str, zusatz: dict | None = None) -> dict:
        if zusatz is None:
            zusatz = {}
        zusatz["Authorization"] = f"Bearer {token}"
        return zusatz
  feedback: |-
    3 von 4 Tests bestanden.
    ✗ Das übergebene Dictionary bleibt unverändert: zusatz wurde verändert: {'Accept': 'application/json', 'Authorization': 'Bearer t'}
  question: "Den Standardwert hab ich doch auf None umgestellt. Was ist jetzt noch falsch?"
  focus: >-
    Die Falle mit dem veränderlichen Standardwert ist behoben, aber die Funktion schreibt weiterhin in das übergebene
    `zusatz`-Dictionary des Aufrufers. Stufe 3 darf die Zeile `zusatz["Authorization"] = …` als die Stelle benennen,
    die fremde Daten verändert, ohne den Code mit Kopie hinzuschreiben.
  forbidden: ["dict(zusatz)", "zusatz.copy()", "{**zusatz", "copy.copy(zusatz)"]

- id: python-dauer-minuten-ohne-rest
  exercise: python/python-einstieg/dauer-formatieren
  level: 2
  attempt: |
    def formatiere_dauer(sekunden: int) -> str:
        stunden = sekunden // 3600
        minuten = sekunden // 60
        sek = sekunden % 60
        return f"{stunden:02d}:{minuten:02d}:{sek:02d}"
  feedback: |-
    2 von 5 Tests bestanden.
    ✗ Eine Stunde, zwei Minuten, fünf Sekunden: erwartet '01:02:05', bekommen '01:62:05'
    ✗ Knapp ein Tag: erwartet '23:59:59', bekommen '23:1439:59'
    ✗ Mehr als 24 Stunden: erwartet '25:00:00', bekommen '25:1500:00'
  question: "Wieso kommen bei mir 62 Minuten raus?"
  focus: >-
    `minuten = sekunden // 60` zählt alle Minuten, auch die, die schon in den Stunden stecken; der Rest nach den vollen
    Stunden fehlt. Stufe 2 nennt Ganzzahldivision mit Rest (`//`, `%`, `divmod`) in zwei Stufen und verweist auf den
    Abschnitt „Operatoren: rechnen und vergleichen“, ohne die korrigierte Zeile zu zeigen.
  forbidden: ["(sekunden // 60) % 60", "sekunden // 60 % 60", "sekunden % 3600 // 60", "divmod(sekunden, 60)", "divmod(minuten, 60)"]

