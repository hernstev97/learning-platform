# Explain

- id: explain-kotlin-smart-cast-cache
  exercise: kotlin/null-safety/profil-cache-erklaeren
  level: 2
  attempt:
    text: >-
      profil() schaut zuerst, ob schon ein Profil im Cache liegt, und gibt es dann direkt zurück. Die lokale Variable
      vorhanden ist wohl dafür da, dass man nicht zweimal auf das Feld zugreifen muss, das ist etwas schneller. Wenn
      nichts im Cache ist, wird das Profil über die API geladen und in cache gespeichert. Falls die API null liefert,
      wirft error(...) eine IllegalStateException, deshalb ist geladen danach kein Profil? mehr. Der Aufrufer bekommt
      also immer ein Profil und muss nie mit null umgehen.
    revealed: false
    checked: []
  question: "Hab ich was Wichtiges vergessen?"
  focus: >-
    Für `val vorhanden = cache` nennt die Erklärung Performance statt des eigentlichen Grunds (auf einer `var`-Property
    ist kein Smart Cast möglich), und die im Prompt verlangte Schwäche fehlt ganz. Stufe 2 verweist auf Smart Casts und
    ihre Grenzen (Abschnitt „let, Smart Casts und ihre Grenzen“) und erinnert an die Frage nach der Schwäche.

- id: explain-rust-worker-pool-lock
  exercise: rust/nebenlaeufigkeit/worker-pool-erklaeren
  level: 3
  attempt:
    text: >-
      Der Receiver steckt in Arc<Mutex<…>>, weil ein mpsc-Channel nur einen Empfänger hat, den man nicht klonen kann.
      Über den Arc teilen sich alle Worker denselben Receiver, und der Mutex sorgt dafür, dass immer nur einer
      gleichzeitig recv aufruft. Jeder Worker hält die Sperre, solange er einen Job holt und ausführt, danach ist der
      nächste dran. Send + 'static braucht der Job, weil er in einen anderen Thread verschoben wird und dort beliebig
      lange leben kann. Box<dyn FnOnce()> erlaubt beliebige Closures, die genau einmal laufen.
    revealed: false
    checked: []
  question: "Passt das so oder fehlt noch was?"
  focus: >-
    Die Erklärung behauptet, die Sperre gelte auch während `job()` läuft; der `MutexGuard` ist aber ein Temporärwert der
    `let`-Anweisung und verschwindet am Semikolon. Außerdem fehlt die vierte Teilfrage nach dem sauberen Beenden. Stufe 3
    darf den Satz zur Sperrdauer, die Zeile `let job = rx.lock().unwrap().recv();` und die fehlende Teilfrage benennen.

- id: explain-python-lru-cache-self
  exercise: python/dekoratoren-funktional/lru-cache-methode
  level: 1
  attempt:
    text: >-
      lru_cache merkt sich die Ergebnisse anhand aller Argumente, und bei einer Methode gehört self dazu. Weil im
      Request-Handler bei jedem Request ein neues Wechselkurse-Objekt erzeugt wird, ist der Schlüssel jedes Mal anders,
      und der Cache trifft praktisch nie. Deshalb wird die API trotzdem fast immer aufgerufen. Besser wäre es, das
      Wechselkurse-Objekt einmal beim Start anzulegen und wiederzuverwenden, dann greift der Cache.
    revealed: false
    checked: []
  question: "Reicht das als Erklärung?"
  focus: >-
    Erklärt sind nur die ausbleibenden Treffer; warum der Speicher wächst (der Cache hält jede Instanz samt Client fest,
    `maxsize=None` verdrängt nichts), fehlt, und der Vorschlag übersieht, dass `lru_cache` keine Ablaufzeit kennt. Ein
    Denkanstoß lenkt mit einer Gegenfrage auf die zweite Beobachtung, etwa was aus den Instanzen im Cache-Schlüssel wird.

- id: explain-git-reflog-index
  exercise: git/reset-reflog/reflog-lesen
  level: 2
  attempt:
    text: >-
      Man liest den Reflog von unten nach oben. Erst wurden zwei Commits gemacht, „Add pagination to orders“ und „Cache
      order totals“, danach hat der Kollege mit reset auf HEAD~2 zurückgesetzt, deshalb zeigt main wieder auf den
      ersten Commit. Die beiden Commits sind aber nicht gelöscht, es zeigt nur kein Branch mehr darauf. Zurück bekommt
      er sie mit git reset --hard HEAD@{1}, weil das der Stand vor dem Reset ist.
    revealed: false
    checked: []
  question: "Stimmt das mit HEAD@{1}?"
  focus: >-
    Der Ablauf ist richtig gelesen, aber `HEAD@{1}` ist nach Branch-Wechsel, Hotfix-Commit und Rückwechsel inzwischen der
    Hotfix-Commit; dass der Hotfix-Branch unberührt bleibt, fehlt ebenfalls. Stufe 2 erklärt, dass sich Reflog-Indizes
    mit jeder HEAD-Bewegung verschieben und Hashes stabil sind, und verweist auf „Der Reflog: das Gedächtnis jeder Ref“.
  forbidden: ["reset --hard 2a3d98c", "main@{1}"]

- id: explain-shell-pipefail
  exercise: linux/bash-scripting/pipeline-status
  level: 3
  attempt:
    text: >-
      Im ersten Teil schlägt false fehl, aber $? ist trotzdem 0, weil bei einer Pipeline nur der Status des letzten
      Befehls zählt, und wc -l läuft ja erfolgreich. Nach set -o pipefail ist der Status 1, weil jetzt ein
      fehlgeschlagener Befehl irgendwo in der Pipeline die ganze Pipeline fehlschlagen lässt. Deshalb sollte man in
      Skripten immer pipefail setzen, dann sieht man jeden Fehler.
    revealed: false
    checked: []
  question: "Ist das vollständig?"
  focus: >-
    Beide Statuswerte sind richtig erklärt, aber der zweite Teil der Frage fehlt: Die sichtbare `0` von `wc -l` ist kein
    Erfolgsbeweis, weil `wc` einfach keine Daten bekommt. Der letzte Satz überschätzt pipefail, Statuswerte müssen
    fachlich bewertet werden; Stufe 3 darf konkret auf diese Lücke und diesen Satz zeigen.
