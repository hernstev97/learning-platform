# Eval cases for the LRN-6 tutor (see tooling/tutor-eval.ts). Attempts are typical wrong answers.

# Kotlin

- id: kotlin-int-division-prozent
  exercise: kotlin/kotlin-grundlagen/ganzzahl-division
  level: 1
  attempt: |-
    75
    75
    75.0
    1
  feedback: "Ab Zeile 1 weicht deine Vorhersage ab. Geh den Code Zeile für Zeile durch."
  question: "Warum ist die erste Zeile falsch? 3 von 4 sind doch 75 Prozent."
  focus: >-
    Die erste Zeile ist mathematisch statt nach Kotlin-Regeln gerechnet: `erledigt / gesamt` teilt zwei `Int`, das
    Zwischenergebnis ist schon vor dem `* 100` abgeschnitten. Ein Denkanstoß fragt nach dem Typ bzw. Wert von
    `erledigt / gesamt` allein, ohne die richtige Zahl zu nennen.
  forbidden: ["3 / 4 = 0", "3 / 4 ergibt 0", "3 / 4 ist 0"]

- id: kotlin-off-by-one-range
  exercise: kotlin/kotlin-grundlagen/liste-off-by-one
  level: 3
  attempt: { selected: [3], found: false, fixes: {} }
