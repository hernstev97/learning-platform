cards:
  - id: gil
    q: Was ist der GIL?
    a: |
      Der **Global Interpreter Lock** erlaubt in CPython nur einem Thread gleichzeitig, Python-Bytecode auszuführen.
    tags: [nebenläufigkeit]
    level: 2
  - id: def
    module: alle-typen
    q: Womit beginnt in Python die Definition einer Funktion?
    a: |
      Mit dem Schlüsselwort `def`, gefolgt von Name, Parameterliste und Doppelpunkt: `def verdoppeln(x):`.
    tags: [grundlagen]
    level: 1
