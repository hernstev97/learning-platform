projects:
  - id: todo-cli
    title: Todo-CLI
    level: 1
    hours: 6
    summary: Eine Kommandozeilen-App für Aufgaben.
    brief: |
      Baue eine Todo-Verwaltung mit Speicherung in JSON.
    skills: [argparse, json, pathlib]
    steps:
      - title: Datenmodell entwerfen
        detail: Eine Aufgabe hat Titel, Status und Datum.
      - title: Speichern und Laden
      - title: Befehle add, list, done
    stretch:
      - Fälligkeitsdaten
    portfolio: Zeige das README mit Beispielen.
  - id: abschluss
    title: Abschlussprojekt
    capstone: true
    level: 3
    hours: 30
    summary: Ein realistisches Projekt wie eine Take-Home-Aufgabe.
    brief: |
      Ein Kunde braucht …
    skills: [alles]
    steps:
      - title: Anforderungen klären
      - title: Architektur skizzieren
      - title: Umsetzen
    acceptance:
      - Tests laufen in CI.
      - README erklärt Installation und Nutzung.
      - Fehlerfälle werden sauber gemeldet.
      - Code ist formatiert und gelintet.
      - Eine Demo ist aufgezeichnet.
    portfolio: So präsentierst du es.
