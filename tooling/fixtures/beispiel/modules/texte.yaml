id: texte
title: Übungen mit Fließtext
level: 1
minutes: 15
summary: Übungsarten mit Fließtext für Kurse ohne Code, in einem Modul, das unterwegs geht.
place: unterwegs
goals:
  - Du erkennst, wie Übungen mit Fließtext aussehen und geprüft werden.
resources:
  - title: Goethe, „Erlkönig“ (Wikisource)
    url: https://de.wikisource.org/wiki/Erlk%C3%B6nig_(Goethe)
lesson: |
  ## Fließtext statt Code

  Mit `lang: prose` brechen Zeilen um, statt seitlich zu scrollen. Lücken ignorieren Groß- und Kleinschreibung und Satzzeichen. Eine `practice`-Übung mit Prosa braucht keine Musterlösung.
exercises:
  - id: wer-spricht
    type: choice
    title: Wer spricht?
    prompt: Wer spricht in den ersten zwei Versen?
    lang: prose
    code: |
      Wer reitet so spät durch Nacht und Wind?
      Es ist der Vater mit seinem Kind;
    options:
      - text: Ein Erzähler, der fragt und antwortet
        correct: true
        why: Frage und Antwort stehen außerhalb der Figuren.
      - text: Der Vater
        correct: false
        why: Der Vater spricht erst später in wörtlicher Rede.
    explanation: Die erste Strophe ist Erzählerrede.
  - id: begriff
    type: gap
    title: Ein Begriff fehlt
    prompt: Ergänze den Begriff.
    lang: prose
    code: |
      Wer in einer Szene sieht und wahrnimmt, bestimmt die ⟦Perspektive⟧.
    gaps:
      - label: Begriff
        hint: Fängt mit P an.
    explanation: Die Perspektive legt fest, wessen Wahrnehmung der Text zeigt.
  - id: reihenfolge
    type: order
    title: Die Strophe ordnen
    prompt: Bring die Verse in die Reihenfolge des Gedichts.
    lang: prose
    lines: |
      Wer reitet so spät durch Nacht und Wind?
      Es ist der Vater mit seinem Kind;
      Er hat den Knaben wohl in dem Arm,
      Er faßt ihn sicher, er hält ihn warm.
    explanation: Frage, Antwort, dann zwei Verse zum Halten.
  - id: zeile-finden
    type: bug
    title: Wer weiß hier zu viel?
    prompt: In diese Strophe ist eine Zeile eingefügt, die mehr verrät, als ein Beobachter von außen wissen kann. Finde sie.
    lang: prose
    code: |
      Wer reitet so spät durch Nacht und Wind?
      Es ist der Vater mit seinem Kind;
      Der Vater ahnt nicht, dass das Kind schon fiebert.
      Er hat den Knaben wohl in dem Arm,
    lines: [3]
    explanation: Zeile 3 ist eingefügt und blickt in den Vater hinein.
  - id: wirkung
    type: explain
    title: Was bewirkt die Frage?
    prompt: Beschreibe, was die Frage am Anfang mit dir als Leser macht.
    lang: prose
    code: |
      Wer reitet so spät durch Nacht und Wind?
    points:
      - Die Frage zieht dich in die Szene, bevor du weißt, wer dort ist.
      - Die Antwort folgt sofort im nächsten Vers.
    explanation: Die Frage erzeugt Spannung und wird direkt beantwortet.
  - id: eigener-text
    type: practice
    title: Drei eigene Sätze
    prompt: Schreib drei Sätze über einen Ort, den du gut kennst. Nenn kein Gefühl beim Namen.
    lang: prose
    checklist:
      - Drei Sätze, kein Gefühlswort.
      - Mindestens ein Detail, das man hören, riechen oder fühlen kann.
    explanation: Gefühle entstehen beim Leser aus Details, nicht aus Behauptungen.
