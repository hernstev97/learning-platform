id: alle-typen
title: Alle Übungsarten
level: 1
minutes: 20
summary: Jede Übungsart einmal, mit echter Prüfung.
goals:
  - Du erkennst, wie jede Übungsart geprüft wird.
resources:
  - title: Python-Tutorial
    url: https://docs.python.org/3/tutorial/
lesson: |
  ## Einstieg

  Ein kurzer Absatz mit `Inline-Code`, **Betonung** und einem [Link](https://docs.python.org/3/).

  ```python run
  namen = ["Ada", "Linus", "Grace"]
  for name in namen:
      print(f"Hallo, {name}!")
  ```

  > [!TIP] Ausführbare Blöcke
  > Mit `python run` wird ein Block im Browser ausführbar und editierbar.

  ## Rust im Playground

  ```rust
  fn main() {
      let summe: i32 = (1..=4).sum();
      println!("{summe}");
  }
  ```

  > [!INTERVIEW]
  > So sieht ein Hinweis für Bewerbungsgespräche aus.

  | Befehl | Wirkung |
  | --- | --- |
  | `ls -la` | Alle Dateien ausführlich |

  ## SQL im Browser

  ```sql run
  CREATE TABLE bestellungen (region TEXT, betrag REAL);
  INSERT INTO bestellungen VALUES ('Nord', 120.5), ('Süd', 80), ('Nord', 40);
  SELECT region, SUM(betrag) AS umsatz FROM bestellungen GROUP BY region ORDER BY region;
  ```

  ```excel
  =SUMMEWENNS(Umsatz[Betrag];Umsatz[Region];"Nord")
  ```
exercises:
  - id: lueckentext
    type: gap
    title: Eine Funktion ergänzen
    prompt: Ergänze das Schlüsselwort und den Rückgabewert.
    lang: python
    code: |
      ⟦def⟧ doppelt(x):
          return ⟦x * 2⟧
    gaps:
      - label: Funktionsdefinition
        hint: Funktionen beginnen mit einem Schlüsselwort aus drei Buchstaben.
      - label: Rückgabe
        hint: Multipliziere den Parameter.
        accept: ["2 * x"]
    explanation: |
      `def` definiert eine Funktion. `x * 2` und `2 * x` sind gleichwertig.
    wiki:
      title: Funktionen in Python
      body: Eine Funktion bündelt Anweisungen unter einem Namen.
  - id: auswahl
    type: choice
    title: Was ist unveränderlich?
    prompt: Welche dieser Typen sind in Python unveränderlich (immutable)?
    options:
      - text: "`tuple`"
        correct: true
        why: Ein Tupel kann nach dem Erzeugen nicht verändert werden.
      - text: "`list`"
        correct: false
        why: Listen lassen sich verändern, etwa mit `append`.
      - text: "`str`"
        correct: true
        why: Stringmethoden liefern immer neue Strings.
    explanation: Unveränderliche Objekte kann man gefahrlos teilen und als Dictionary-Schlüssel nutzen.
    hints:
      - Denk an Methoden wie `append`.
  - id: reihenfolge
    type: order
    title: Datei zeilenweise lesen
    prompt: Bring die Zeilen in die richtige Reihenfolge.
    lang: python
    lines: |
      from pathlib import Path
      pfad = Path("notizen.txt")
      with pfad.open(encoding="utf-8") as datei:
          for zeile in datei:
              print(zeile.rstrip())
    explanation: Erst importieren, dann den Pfad bauen, dann mit `with` öffnen und iterieren.
  - id: ausgabe
    type: output
    title: Was wird ausgegeben?
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      werte = [3, 1, 2]
      print(sorted(werte))
      print(werte)
    expected: |
      [1, 2, 3]
      [3, 1, 2]
    explanation: "`sorted` liefert eine neue Liste; die ursprüngliche bleibt unverändert."
  - id: rust-ausgabe
    type: output
    title: Shadowing
    prompt: Was gibt das Programm aus?
    lang: rust
    code: |
      fn main() {
          let x = 5;
          let x = x * 2;
          println!("{x}");
      }
    expected: "10"
    explanation: Das zweite `let` erzeugt eine neue Variable, die die erste verdeckt.
  - id: terminal
    type: command
    title: Alle Dateien anzeigen
    prompt: Zeige **alle** Dateien im aktuellen Verzeichnis ausführlich an, auch versteckte.
    context: Du bist in `~/projekt`.
    answers: ["ls -la", "ls -lA"]
    output: |
      drwxr-xr-x 3 steven steven 4096 Sep 28 10:00 .
      -rw-r--r-- 1 steven steven  220 Sep 28 10:00 .env
    explanation: "`-l` zeigt Details, `-a` auch Einträge, die mit einem Punkt beginnen."
  - id: python-code
    type: code
    title: Wörter zählen
    prompt: Schreibe `zaehle_woerter(text)`, die die Anzahl der Wörter zurückgibt.
    lang: python
    starter: |
      def zaehle_woerter(text: str) -> int:
          ...
    solution: |
      def zaehle_woerter(text: str) -> int:
          return len(text.split())
    tests:
      - name: Zwei Wörter
        code: assert zaehle_woerter("Hallo Welt") == 2
      - name: Mehrere Leerzeichen
        code: assert zaehle_woerter("  a   b  c ") == 3
      - name: Leerer Text
        code: assert zaehle_woerter("") == 0
    explanation: "`str.split()` ohne Argument trennt an beliebigem Leerraum und ignoriert Ränder."
  - id: praxis
    type: practice
    title: FizzBuzz in Rust
    prompt: Schreibe FizzBuzz von 1 bis 15.
    lang: rust
    starter: |
      fn main() {
          // Dein Code
      }
    solution: |
      fn main() {
          for n in 1..=15 {
              match (n % 3, n % 5) {
                  (0, 0) => println!("FizzBuzz"),
                  (0, _) => println!("Fizz"),
                  (_, 0) => println!("Buzz"),
                  _ => println!("{n}"),
              }
          }
      }
    checklist:
      - Du nutzt `match` auf einem Tupel.
      - Die Reihenfolge der Arme ist korrekt.
    explanation: Ein Tupel-Match macht alle vier Fälle explizit.
  - id: fehler-finden
    type: bug
    title: Die Summe stimmt nicht
    prompt: |
      `summe_bis(n)` soll alle Zahlen von 1 bis einschließlich `n` addieren. Für `summe_bis(3)` kommt aber `3` statt `6` heraus. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      def summe_bis(n):
          total = 0
          for i in range(n):
              total += i
          return total
    lines: [3]
    fix:
      - line: 3
        answers: ["for i in range(n + 1):", "for i in range(1, n + 1):"]
    explanation: |
      `range(n)` endet **vor** `n`. Mit `range(1, n + 1)` oder `range(n + 1)` ist `n` enthalten.
  - id: erklaeren
    type: explain
    title: Was macht dieser Cache?
    prompt: Erkläre in eigenen Worten, was `@lru_cache` hier bewirkt und warum die Funktion dadurch schnell wird.
    lang: python
    code: |
      from functools import lru_cache

      @lru_cache(maxsize=None)
      def fib(n: int) -> int:
          return n if n < 2 else fib(n - 1) + fib(n - 2)
    points:
      - Ergebnisse werden pro Argument gespeichert (Memoization).
      - Jeder Wert von `fib` wird nur einmal berechnet.
      - Laufzeit sinkt von exponentiell auf linear.
    explanation: |
      `lru_cache` merkt sich für jedes Argument das Ergebnis. Die naive Rekursion berechnet dieselben Teilprobleme exponentiell oft; mit Cache wird jedes `fib(k)` genau einmal berechnet.
  - id: sql-abfrage
    type: sql
    title: Umsatz je Region
    prompt: Berechne den Umsatz je Region. Spalten `region` und `umsatz`, größter Umsatz zuerst.
    schema: |
      CREATE TABLE bestellungen (id INTEGER PRIMARY KEY, region TEXT, betrag REAL);
      INSERT INTO bestellungen (region, betrag) VALUES ('Nord', 120.5), ('Süd', 80), ('Nord', 40), ('West', NULL);
    starter: |
      SELECT region, betrag
      FROM bestellungen;
    solution: |
      SELECT region, SUM(betrag) AS umsatz
      FROM bestellungen
      GROUP BY region
      ORDER BY umsatz DESC;
    ordered: true
    explanation: "`GROUP BY` bildet eine Zeile je Region, `SUM` ignoriert `NULL`. Eine Region nur mit `NULL`-Beträgen bekommt `NULL` als Summe und landet bei absteigender Sortierung in SQLite am Ende."
  - id: excel-formel
    type: gap
    title: Bedingte Summe
    prompt: Summiere die Beträge der Region „Nord“. Deutsche und englische Funktionsnamen werden beide akzeptiert.
    lang: excel
    code: |
      =⟦SUMMEWENNS⟧(Umsatz[Betrag];Umsatz[Region];⟦"Nord"⟧)
    gaps:
      - label: Funktion
        hint: Summe mit einer oder mehreren Bedingungen.
      - label: Kriterium
        hint: Text steht in Anführungszeichen.
    explanation: "`SUMMEWENNS` (englisch `SUMIFS`) nimmt zuerst den Summenbereich, dann Paare aus Kriterienbereich und Kriterium."
  - id: linux-szenario
    type: scenario
    title: Eine Datei anlegen
    prompt: Lege im Home-Verzeichnis die Datei `hallo.txt` an, die genau die Zeile `hallo` enthält.
    setup: rm -f /home/ops/hallo.txt
    checks:
      - name: hallo.txt enthält genau „hallo“
        run: grep -qx hallo /home/ops/hallo.txt
    solution: echo hallo > ~/hallo.txt
    hints:
      - "`echo` schreibt eine Zeile, `>` lenkt sie in eine Datei."
    explanation: "`>` legt die Datei an oder überschreibt sie."
