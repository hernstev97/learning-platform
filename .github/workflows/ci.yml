name: CI

# Pull requests and main: check, verify, e2e, convex (and vm when Linux/VM files change).
# Nightly 02:17 UTC: the same on main. Monday 02:43 UTC: only the external link check.
# Branch protection needs just one required check: ci-ok.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
    - cron: '43 2 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      vm: ${{ steps.filter.outputs.vm }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "vm=true" >> "$GITHUB_OUTPUT"; echo "ci=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "$files"
          vm=false; ci=false
          if grep -qE '^(content/linux/|src/vm/|tooling/vm/|tooling/fixtures/|tooling/content\.ts|src/content/types\.ts|src/engine/highlight\.ts|vendor/vm/|patches/|pnpm-lock\.yaml|\.github/)' <<< "$files"; then vm=true; fi
          if grep -qE '^\.github/' <<< "$files"; then ci=true; fi
          echo "vm=$vm" >> "$GITHUB_OUTPUT"; echo "ci=$ci" >> "$GITHUB_OUTPUT"

  check:
    if: ${{ github.event.schedule != '43 2 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm content:check
      - run: pnpm bear:check
      - run: pnpm build

  verify:
    if: ${{ github.event.schedule != '43 2 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: ./.github/actions/setup
      - run: rustc --version && python3 --version && uv --version
      - run: pnpm verify

  e2e:
    if: ${{ github.event.schedule != '43 2 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:pwa:e2e
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-e2e
          path: |
            playwright-report
            test-results
          retention-days: 7

  convex:
    if: ${{ github.event.schedule != '43 2 * * 1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: tooling/ci/convex-e2e.sh
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-convex
          path: |
            ${{ runner.temp }}/convex-backend/convex-dev.log
            test-results
          retention-days: 7

  vm:
    needs: changes
    if: ${{ github.event.schedule != '43 2 * * 1' && needs.changes.outputs.vm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm vm:verify --shard ${{ matrix.shard }}/8

  links:
    needs: changes
    if: ${{ github.event.schedule == '43 2 * * 1' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.ci == 'true' }}
    # Never blocks: on pull requests it is a hint, on the weekly run a red mark and a mail.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm links

  ci-ok:
    if: ${{ always() }}
    needs: [changes, check, verify, e2e, convex, vm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = true ]; then
            echo "A required job failed."; exit 1
          fi
