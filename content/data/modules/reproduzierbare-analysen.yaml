id: reproduzierbare-analysen
title: Reproduzierbare Analyse-Workflows
level: 3
minutes: 180
summary: Rohdaten unverändert, eine Pipeline aus reinen Funktionen, Parameter statt fest verdrahteter Werte, festgehaltene Umgebung und Tests – damit der Monatsbericht mit einem Befehl entsteht und jede Zahl nachvollziehbar bleibt.
goals:
  - Du erklärst ein Analyseergebnis als Funktion von Rohdaten, Code, Parametern und Umgebung und hältst jeden dieser Eingänge fest.
  - Du legst ein Analyseprojekt mit `data/raw`, `data/processed`, `src`, `tests` und `reports` an und entscheidest, was in Git gehört.
  - Du schreibst Bereinigung, Prüfung und Auswertung als reine Funktionen mit dem Stichtag als Parameter und machst Ergebnisse unabhängig von Zeilenreihenfolge und Zeitzone.
  - Du sicherst Rohdaten mit SHA-256-Prüfsummen und beschreibst sie in einem Datenwörterbuch.
  - Du hältst die Umgebung mit `pyproject.toml` und `uv.lock` fest und prüfst Transformationen mit Tests, die einen echten Fehler fangen.
