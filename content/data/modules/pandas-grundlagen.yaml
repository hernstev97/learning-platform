        url: https://pandas.pydata.org/docs/user_guide/io.html#csv-text-files

  - id: staedte-vereinheitlichen
    type: code
    title: Ein Köln statt vier
    prompt: |
      In der Kundenliste steht Köln als „ köln“, „KÖLN “ und „Köln“, dazu „bergisch  gladbach“ mit doppeltem Leerzeichen. Schreibe `vereinheitliche_stadt(stadt)`, die eine Series mit Stadtnamen bekommt und eine neue Series zurückgibt:

      - Leerzeichen am Rand entfernen und mehrere Leerzeichen im Namen auf eines reduzieren (wie `GLÄTTEN` in Excel).
      - Stimmt der Name ohne Rücksicht auf Groß- und Kleinschreibung mit einem Eintrag aus `STAEDTE` überein, die Schreibweise aus `STAEDTE` verwenden.
      - Andere Namen nur bereinigt übernehmen, fehlende Werte bleiben fehlend.
      - Index und Eingabe bleiben unverändert.
    lang: python
    starter: |
      import pandas as pd

      STAEDTE = ["Köln", "Bergisch Gladbach", "Mülheim an der Ruhr", "Düsseldorf"]


      def vereinheitliche_stadt(stadt: pd.Series) -> pd.Series:
          return stadt.str.strip()
    solution: |
      import pandas as pd

      STAEDTE = ["Köln", "Bergisch Gladbach", "Mülheim an der Ruhr", "Düsseldorf"]


      def vereinheitliche_stadt(stadt: pd.Series) -> pd.Series:
          sauber = stadt.str.strip().str.replace(r"\s+", " ", regex=True)
          kanonisch = {name.casefold(): name for name in STAEDTE}
          return sauber.str.casefold().map(kanonisch).fillna(sauber)
    tests:
      - name: Varianten von Köln
        code: |
          import pandas as pd
          ergebnis = vereinheitliche_stadt(pd.Series([" köln", "KÖLN ", "Köln"])).tolist()
          assert ergebnis == ["Köln", "Köln", "Köln"], f"bekommen {ergebnis}"
      - name: Leerzeichen im Namen und Schreibweise aus der Liste
        code: |
          import pandas as pd
          ergebnis = vereinheitliche_stadt(pd.Series(["bergisch  gladbach", "MÜLHEIM AN DER RUHR"])).tolist()
          assert ergebnis == ["Bergisch Gladbach", "Mülheim an der Ruhr"], f"bekommen {ergebnis}"
      - name: Unbekannte Städte werden nur bereinigt
        code: |
          import pandas as pd
          ergebnis = vereinheitliche_stadt(pd.Series(["  Frechen ", "Hürth   Mitte"])).tolist()
          assert ergebnis == ["Frechen", "Hürth Mitte"], f"bekommen {ergebnis}"
      - name: Fehlende Werte bleiben fehlend
        code: |
          import pandas as pd
          ergebnis = vereinheitliche_stadt(pd.Series(["Köln", None]))
          assert len(ergebnis) == 2 and pd.isna(ergebnis.iloc[1]), f"bekommen {ergebnis.tolist()}"
      - name: Index und Eingabe bleiben erhalten
        code: |
          import pandas as pd
          eingabe = pd.Series([" köln", "düsseldorf"], index=[7, 9])
          ergebnis = vereinheitliche_stadt(eingabe)
          assert ergebnis.index.tolist() == [7, 9], f"Index ist {ergebnis.index.tolist()}"
          assert eingabe.tolist() == [" köln", "düsseldorf"], "die Eingabe wurde verändert"
    hints:
      - "`str.strip()` entfernt nur die Ränder. Für mehrere Leerzeichen im Text hilft `str.replace` mit einem regulären Ausdruck."
      - Baue aus `STAEDTE` ein Dictionary von der kleingeschriebenen Form (`casefold()`) zur richtigen Schreibweise.
      - "`Series.map(dictionary)` liefert `NaN` für Namen, die nicht im Dictionary stehen. `fillna(sauber)` setzt dort den bereinigten Namen ein."
    explanation: |
      Die Lösung trennt zwei Schritte: Erst wird jeder Name technisch bereinigt, dann über einen Vergleichsschlüssel (`casefold()`) auf die gültige Schreibweise abgebildet. `map` mit einem Dictionary ist der pandas-Weg für einen Nachschlage-Schritt wie `XVERWEIS`; nicht gefundene Namen werden `NaN`, und `fillna` setzt dort den bereinigten Originalwert ein. `str.title()` wäre kürzer, macht aber aus „Mülheim an der Ruhr“ „Mülheim An Der Ruhr“. Eine gepflegte Liste gültiger Schreibweisen ist in der Praxis auch deshalb besser, weil unbekannte Namen danach mit `~isin(STAEDTE)` gezielt auffallen.
    resources:
      - title: pandas · Working with text data
        url: https://pandas.pydata.org/docs/user_guide/text.html
      - title: pandas · Series.str.strip
        url: https://pandas.pydata.org/docs/reference/api/pandas.Series.str.strip.html

  - id: grosse-b2b-positionen
    type: code
    title: Die großen B2B-Positionen
    prompt: |
      Der Vertrieb will wissen, welche bezahlten B2B-Positionen einen hohen Nettowert haben. Schreibe `grosse_b2b_positionen(positionen, ab)`:

      - Nettowert `netto = menge * einzelpreis * (1 - rabatt)`, auf zwei Stellen gerundet.
      - Nur Zeilen mit `kanal == "B2B"`, `status == "bezahlt"` und `netto >= ab`.
      - Ergebnis: Spalten `bestellung_id`, `produkt`, `netto` in dieser Reihenfolge, größter Nettowert zuerst, Index `0, 1, 2, …`.
      - Die Eingabe bleibt unverändert.

      Die Tabelle `positionen` steht zum Ausprobieren bereit:

      | bestellung_id | produkt | kanal | status | menge | einzelpreis | rabatt |
      | --- | --- | --- | --- | --- | --- | --- |
      | 2001 | Espresso Classico 1 kg | B2B | bezahlt | 20 | 13.40 | 0.10 |
      | 2002 | Espresso Classico 1 kg | Shop | bezahlt | 2 | 14.90 | 0.00 |
      | 2003 | Espresso Classico 1 kg | B2B | storniert | 30 | 13.40 | 0.10 |
      | 2004 | Filter Äthiopien 1 kg | B2B | bezahlt | 10 | 12.50 | 0.05 |
      | 2005 | Handmühle | B2B | bezahlt | 6 | 39.00 | 0.00 |
      | 2006 | Espresso Classico 1 kg | Shop | bezahlt | 12 | 13.40 | 0.00 |
      | 2007 | Filter Kolumbien 1 kg | B2B | retourniert | 8 | 14.90 | 0.10 |
    lang: python
    setup: |
      import pandas as pd

      positionen = pd.DataFrame({
          "bestellung_id": [2001, 2002, 2003, 2004, 2005, 2006, 2007],
          "produkt": ["Espresso Classico 1 kg", "Espresso Classico 1 kg", "Espresso Classico 1 kg", "Filter Äthiopien 1 kg", "Handmühle", "Espresso Classico 1 kg", "Filter Kolumbien 1 kg"],
          "kanal": ["B2B", "Shop", "B2B", "B2B", "B2B", "Shop", "B2B"],
          "status": ["bezahlt", "bezahlt", "storniert", "bezahlt", "bezahlt", "bezahlt", "retourniert"],
          "menge": [20, 2, 30, 10, 6, 12, 8],
          "einzelpreis": [13.40, 14.90, 13.40, 12.50, 39.00, 13.40, 14.90],
          "rabatt": [0.10, 0.00, 0.10, 0.05, 0.00, 0.00, 0.10],
      })
    starter: |
      import pandas as pd


      def grosse_b2b_positionen(positionen: pd.DataFrame, ab: float) -> pd.DataFrame:
          maske = positionen["kanal"] == "B2B"
          return positionen[maske]
    solution: |
      import pandas as pd


      def grosse_b2b_positionen(positionen: pd.DataFrame, ab: float) -> pd.DataFrame:
          mit_netto = positionen.assign(
              netto=lambda d: (d["menge"] * d["einzelpreis"] * (1 - d["rabatt"])).round(2)
          )
          maske = (
              (mit_netto["kanal"] == "B2B")
              & (mit_netto["status"] == "bezahlt")
              & (mit_netto["netto"] >= ab)
          )
          return (
              mit_netto.loc[maske, ["bestellung_id", "produkt", "netto"]]
              .sort_values("netto", ascending=False)
              .reset_index(drop=True)
          )
    tests:
      - name: Zwei Positionen ab 150 Euro
        code: |
          ergebnis = grosse_b2b_positionen(positionen, 150)
          assert list(ergebnis.columns) == ["bestellung_id", "produkt", "netto"], f"Spalten sind {list(ergebnis.columns)}"
          assert ergebnis["bestellung_id"].tolist() == [2001, 2005], f"bestellung_id ist {ergebnis['bestellung_id'].tolist()}"
          assert ergebnis["netto"].tolist() == [241.2, 234.0], f"netto ist {ergebnis['netto'].tolist()}"
      - name: Die Grenze gehört dazu
        code: |
          ergebnis = grosse_b2b_positionen(positionen, 118.75)
          assert ergebnis["bestellung_id"].tolist() == [2001, 2005, 2004], f"bestellung_id ist {ergebnis['bestellung_id'].tolist()} – gilt >= ?"
      - name: Storniert, retourniert und Shop fehlen
        code: |
          ergebnis = grosse_b2b_positionen(positionen, 0)
          assert sorted(ergebnis["bestellung_id"].tolist()) == [2001, 2004, 2005], f"bestellung_id ist {ergebnis['bestellung_id'].tolist()}"
      - name: Index beginnt bei 0
        code: |
          ergebnis = grosse_b2b_positionen(positionen, 0)
          assert ergebnis.index.tolist() == [0, 1, 2], f"Index ist {ergebnis.index.tolist()} – reset_index vergessen?"
      - name: Keine Treffer und unveränderte Eingabe
        code: |
          ergebnis = grosse_b2b_positionen(positionen, 1000)
          assert len(ergebnis) == 0 and list(ergebnis.columns) == ["bestellung_id", "produkt", "netto"], "leeres Ergebnis soll trotzdem die drei Spalten haben"
          assert "netto" not in positionen.columns, "die Eingabe wurde verändert"
    hints:
      - Lege `netto` mit `assign` an; so bleibt `positionen` unverändert.
      - Drei Bedingungen, jede in Klammern, verknüpft mit `&`.
      - "Danach `loc[maske, [spalten]]`, `sort_values(\"netto\", ascending=False)` und `reset_index(drop=True)`."
    explanation: |
      `assign` legt die berechnete Spalte in einem neuen DataFrame an, die Eingabe bleibt unverändert. Die Maske verknüpft drei Bedingungen mit `&`; ohne Klammern würde `&` zuerst ausgewertet und einen `TypeError` auslösen. `loc` wählt Zeilen und Spalten in einem Schritt, `reset_index(drop=True)` ersetzt die alten Zeilennummern durch `0, 1, 2`. In SQL wäre das ein `SELECT … WHERE kanal = 'B2B' AND status = 'bezahlt' AND netto >= 150 ORDER BY netto DESC`, in Excel ein `FILTER` über eine Tabelle mit berechneter Spalte.
    resources:
      - title: pandas · Boolean indexing
        url: https://pandas.pydata.org/docs/user_guide/indexing.html#boolean-indexing
      - title: pandas · DataFrame.assign
        url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.assign.html

  - id: stornos-ohne-versand
    type: bug
    title: Die Versandkosten bleiben stehen
    prompt: |
      Für stornierte Bestellungen sollen die Versandkosten auf 0 gesetzt werden. Nach dem Aufruf stehen bei allen stornierten Bestellungen aber weiterhin 4,90 Euro, und in der Ausgabe erscheint `ChainedAssignmentError: A value is being set on a copy of a DataFrame or Series through chained assignment.` Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      import pandas as pd

      def versand_bereinigen(bestellungen: pd.DataFrame) -> pd.DataFrame:
          ergebnis = bestellungen.copy()
          ergebnis[ergebnis["status"] == "storniert"]["versandkosten"] = 0.0
          return ergebnis
    lines: [5]
    fix:
      - line: 5
        answers:
          - ergebnis.loc[ergebnis["status"] == "storniert", "versandkosten"] = 0.0
          - ergebnis.loc[ergebnis["status"] == "storniert", "versandkosten"] = 0
          - ergebnis.loc[ergebnis.status == "storniert", "versandkosten"] = 0.0
          - ergebnis.loc[ergebnis.status == "storniert", "versandkosten"] = 0
          - ergebnis.loc[ergebnis["status"].eq("storniert"), "versandkosten"] = 0.0
          - ergebnis["versandkosten"] = ergebnis["versandkosten"].mask(ergebnis["status"] == "storniert", 0.0)
          - ergebnis["versandkosten"] = ergebnis["versandkosten"].where(ergebnis["status"] != "storniert", 0.0)
    hints:
      - Zähle die eckigen Klammern auf der linken Seite der Zuweisung. Wie viele Zwischenobjekte entstehen?
      - Seit pandas 3 verhält sich das Ergebnis von `ergebnis[maske]` wie eine Kopie.
    explanation: |
      `ergebnis[maske]` erzeugt ein neues Objekt, und `["versandkosten"] = 0.0` schreibt in dieses Zwischenobjekt, das danach verworfen wird. Unter Copy-on-Write (Standard seit pandas 3.0) wirkt eine solche verkettete Zuweisung **nie**; pandas warnt deshalb mit `ChainedAssignmentError`. `ergebnis.loc[maske, "versandkosten"] = 0.0` wählt Zeilen und Spalte in einem einzigen Zugriff und schreibt direkt in `ergebnis`. Das `copy()` in Zeile 4 ist richtig: Ohne diese Kopie würde `loc` den DataFrame des Aufrufers verändern.
    resources:
      - title: pandas · Copy-on-Write · Chained assignment
        url: https://pandas.pydata.org/docs/user_guide/copy_on_write.html#chained-assignment
      - title: pandas · ChainedAssignmentError
        url: https://pandas.pydata.org/docs/reference/api/pandas.errors.ChainedAssignmentError.html

  - id: letzter-stand
    type: code
    title: Repariere den letzten Stand je Bestellung
    prompt: |
      Der Shop exportiert jede Statusänderung als neue Zeile mit Zeitstempel `geaendert_am`, und die Datei ist nicht zeitlich sortiert. `letzter_stand(export)` soll je `bestellung_id` genau die Zeile mit dem jüngsten `geaendert_am` behalten, sortiert nach `bestellung_id`, mit Index `0, 1, 2, …`. Die aktuelle Fassung meldet Bestellung 1003 aber als `bezahlt`, obwohl sie später storniert wurde. Repariere die Funktion.

      Die Tabelle `export` steht zum Ausprobieren bereit:

      | bestellung_id | status | geaendert_am |
      | --- | --- | --- |
      | 1003 | bezahlt | 2026-03-04 09:15 |
      | 1001 | bezahlt | 2026-03-03 10:00 |
      | 1004 | retourniert | 2026-03-10 12:00 |
      | 1002 | bezahlt | 2026-03-03 11:30 |
      | 1003 | storniert | 2026-03-06 14:05 |
      | 1001 | retourniert | 2026-03-09 08:40 |
      | 1004 | bezahlt | 2026-03-05 16:20 |
    lang: python
    setup: |
      import pandas as pd

      export = pd.DataFrame({
          "bestellung_id": [1003, 1001, 1004, 1002, 1003, 1001, 1004],
          "status": ["bezahlt", "bezahlt", "retourniert", "bezahlt", "storniert", "retourniert", "bezahlt"],
          "geaendert_am": pd.to_datetime([
              "2026-03-04 09:15", "2026-03-03 10:00", "2026-03-10 12:00", "2026-03-03 11:30",
              "2026-03-06 14:05", "2026-03-09 08:40", "2026-03-05 16:20",
          ]),
      })
    starter: |
      import pandas as pd


      def letzter_stand(export: pd.DataFrame) -> pd.DataFrame:
          return export.drop_duplicates(subset="bestellung_id")
    solution: |
      import pandas as pd


      def letzter_stand(export: pd.DataFrame) -> pd.DataFrame:
          return (
              export.sort_values("geaendert_am")
              .drop_duplicates(subset="bestellung_id", keep="last")
              .sort_values("bestellung_id")
              .reset_index(drop=True)
          )
    tests:
      - name: Eine Zeile je Bestellung, nach ID sortiert
        code: |
          ergebnis = letzter_stand(export)
          assert ergebnis["bestellung_id"].tolist() == [1001, 1002, 1003, 1004], f"bestellung_id ist {ergebnis['bestellung_id'].tolist()}"
      - name: Der jüngste Status gewinnt
        code: |
          ergebnis = letzter_stand(export)
          stand = dict(zip(ergebnis["bestellung_id"], ergebnis["status"]))
          assert stand[1003] == "storniert", f"1003 ist {stand[1003]!r}, zuletzt wurde sie storniert"
          assert stand[1001] == "retourniert", f"1001 ist {stand[1001]!r}, zuletzt wurde sie retourniert"
      - name: Auch wenn die jüngste Zeile weiter oben steht
        code: |
          ergebnis = letzter_stand(export)
          stand = dict(zip(ergebnis["bestellung_id"], ergebnis["status"]))
          assert stand[1004] == "retourniert", f"1004 ist {stand[1004]!r} – 'letzte Zeile der Datei' ist nicht 'jüngster Zeitstempel'"
      - name: Index beginnt bei 0
        code: |
          ergebnis = letzter_stand(export)
          assert ergebnis.index.tolist() == [0, 1, 2, 3], f"Index ist {ergebnis.index.tolist()}"
      - name: Eingabe bleibt unverändert
        code: |
          letzter_stand(export)
          assert len(export) == 7 and export["bestellung_id"].tolist() == [1003, 1001, 1004, 1002, 1003, 1001, 1004], "die Eingabe wurde verändert"
    hints:
      - "`drop_duplicates` behält standardmäßig die **erste** Zeile je Schlüssel in der aktuellen Reihenfolge."
      - Mit `keep="last"` allein reicht es nicht, weil die Datei nicht nach Zeit sortiert ist.
      - "Erst `sort_values(\"geaendert_am\")`, dann `drop_duplicates(subset=\"bestellung_id\", keep=\"last\")`, dann nach ID sortieren und `reset_index(drop=True)`."
    explanation: |
      `drop_duplicates` entscheidet nach der Position in der aktuellen Reihenfolge, nicht nach dem Inhalt. Die Frage „welcher Stand gilt?“ beantwortest du deshalb zuerst mit einer Sortierung nach dem Zeitstempel; danach ist die letzte Zeile je Bestellung die jüngste, und `keep="last"` behält genau sie. Der Test mit Bestellung 1004 fängt die halbe Reparatur ab, bei der nur `keep="last"` ergänzt wird. Gleichwertig ist `export.loc[export.groupby("bestellung_id")["geaendert_am"].idxmax()].reset_index(drop=True)`. In SQL löst du dieselbe Aufgabe mit `ROW_NUMBER() OVER (PARTITION BY bestellung_id ORDER BY geaendert_am DESC)` ([Fensterfunktionen](/data/sql-fensterfunktionen)).
    resources:
      - title: pandas · DataFrame.drop_duplicates
        url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.drop_duplicates.html
      - title: pandas · DataFrame.sort_values
        url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.sort_values.html

  - id: kundenimport-erklaeren
    type: explain
    title: Ein Kundenimport im Review
    prompt: |
      Ein Kollege hat den Import der Kundenstammdaten geschrieben und bittet dich um ein Review. Erkläre, was die Funktion Schritt für Schritt tut und **warum** die einzelnen Entscheidungen sinnvoll sind. Wo steckt eine Annahme, die man kennen muss?
    lang: python
    code: |
      REGIONEN = pd.CategoricalDtype(["Nord", "Süd", "West", "Ost"])

      def lade_kunden(pfad):
          kunden = pd.read_csv(
              pfad,
              sep=";",
              dtype={"kunde_id": "Int64", "plz": "str"},
              na_values=["-", "n/a"],
              parse_dates=["angelegt_am"],
              date_format="%d.%m.%Y",
          )
          unbekannt = kunden["region"].notna() & ~kunden["region"].isin(REGIONEN.categories)
          if unbekannt.any():
              raise ValueError(f"Unbekannte Regionen: {sorted(kunden.loc[unbekannt, 'region'].unique())}")
          return kunden.assign(
              stadt=kunden["stadt"].str.strip().str.replace(r"\s+", " ", regex=True),
              region=kunden["region"].astype(REGIONEN),
          ).drop_duplicates(subset="kunde_id", keep="last")
    points:
      - "`Int64` hält `kunde_id` ganzzahlig, auch wenn eine ID fehlt; `plz` als `str` behält führende Nullen."
      - "`na_values` macht `-` und `n/a` zu fehlenden Werten, `date_format` liest deutsche Daten eindeutig statt zu raten."
      - Die Regionsprüfung bricht bei Tippfehlern laut ab, bevor `astype` sie still zu `NaN` machen würde; die Kategorien legen die fachliche Reihenfolge Nord, Süd, West, Ost fest.
      - "`assign` liefert einen neuen DataFrame; die Stadtbereinigung wirkt wie `GLÄTTEN` (Rand und doppelte Leerzeichen)."
      - "`drop_duplicates(keep=\"last\")` nimmt an, dass die Datei chronologisch sortiert ist – sonst muss vorher nach einem Änderungszeitpunkt sortiert werden."
    explanation: |
      Die Funktion liest die Datei mit einem ausdrücklichen Vertrag: `kunde_id` wird `Int64`, damit eine fehlende ID nicht die ganze Spalte zu Kommazahlen macht, und `plz` bleibt Text, damit `01067` nicht zu `1067` wird. `na_values` erklärt `-` und `n/a` zu fehlenden Werten, `date_format` verhindert, dass `04.03.2026` als 3. April gelesen wird. Vor der Umwandlung in `category` prüft sie die Regionen, denn sonst würde `astype` einen Tippfehler wie „Nrod“ mit bloßer `Pandas4Warning` in `NaN` verwandeln, und der Kunde fiele aus jeder Regionsauswertung. `assign` baut einen neuen DataFrame mit bereinigter Stadt und typisierter Region. Die Annahme steckt am Ende: `keep="last"` behält die letzte Zeile je Kunde **in Dateireihenfolge**, und das ist nur dann der aktuelle Stand, wenn das Quellsystem chronologisch exportiert. Das gehört als Kommentar in den Code oder wird durch eine Sortierung nach einem Änderungsdatum ersetzt.
    resources:
      - title: pandas · Categorical data
        url: https://pandas.pydata.org/docs/user_guide/categorical.html
      - title: pandas · Nullable integer data type
        url: https://pandas.pydata.org/docs/user_guide/integer_na.html

  - id: wochenimport-lokal
    type: practice
    title: Den Wochenimport lokal einrichten
    prompt: |
      Richte den Montagsimport für Bohnenwerk auf deinem Rechner ein. Lege dazu die Datei `bestellungen_KW12.csv` aus der Übung „Den Wochenexport laden“ in Windows-1252 unter `daten/roh/` ab und füge vor der Summenzeile eine exakte Kopie der Zeile von Bestellung 1102 ein – so sieht ein doppelt gestarteter Export aus.

      Schreibe ein Skript `bereinige_export.py`, das du mit `uv run bereinige_export.py daten/roh/bestellungen_KW12.csv` startest. Es soll:

      1. den Export mit den richtigen `read_csv`-Argumenten lesen, ohne die Rohdatei zu verändern,
      2. Stadtnamen bereinigen und doppelte Bestellungen entfernen,
      3. Zeilen ohne Datum nicht still verwerfen, sondern nach `daten/quarantaene/` schreiben,
      4. die bereinigten Zeilen nach `daten/bereinigt/` schreiben (UTF-8 mit BOM, Semikolon, Dezimalkomma),
      5. ein Protokoll ausgeben: gelesene Zeilen, entfernte Duplikate, Zeilen in Quarantäne und ob die Umsatzsumme zur Summenzeile des Exports passt.
    lang: python
    solution: |
      # /// script
      # dependencies = ["pandas>=3"]
      # ///
      import sys
      from pathlib import Path

      import pandas as pd

      LESEN = dict(sep=";", encoding="cp1252", decimal=",", thousands=".", dtype={"PLZ": "str"}, na_values=["n/a", "-"])
      SCHREIBEN = dict(sep=";", decimal=",", date_format="%d.%m.%Y", index=False, encoding="utf-8-sig")


      def main(roh: Path) -> None:
          daten = pd.read_csv(roh, parse_dates=["Datum"], date_format="%d.%m.%Y", skipfooter=1, engine="python", **LESEN)
          summenzeile = pd.read_csv(roh, **LESEN).iloc[-1]

          gelesen = len(daten)
          daten = daten.assign(Stadt=daten["Stadt"].str.strip().str.replace(r"\s+", " ", regex=True))
          eindeutig = daten.drop_duplicates()
          ohne_datum = eindeutig["Datum"].isna()

          for ordner, teil in [("bereinigt", eindeutig[~ohne_datum]), ("quarantaene", eindeutig[ohne_datum])]:
              ziel = Path("daten") / ordner / roh.name
              ziel.parent.mkdir(parents=True, exist_ok=True)
              teil.to_csv(ziel, **SCHREIBEN)

          umsatz = round(eindeutig["Umsatz"].sum(), 2)
          erwartet = round(float(summenzeile["Umsatz"]), 2)
          print(f"Gelesen: {gelesen} Zeilen")
          print(f"Duplikate entfernt: {gelesen - len(eindeutig)}")
          print(f"Quarantäne (ohne Datum): {ohne_datum.sum()}")
          print(f"Umsatz {umsatz:.2f} / Summenzeile {erwartet:.2f}: {'OK' if umsatz == erwartet else 'ABWEICHUNG'}")


      if __name__ == "__main__":
          main(Path(sys.argv[1]))
    checklist:
      - "`uv run bereinige_export.py daten/roh/bestellungen_KW12.csv` läuft ohne Fehler und ohne `ParserWarning` durch."
      - "`sha256sum daten/roh/bestellungen_KW12.csv` liefert vor und nach dem Lauf denselben Wert."
      - Das Protokoll meldet 6 gelesene Zeilen, 1 entferntes Duplikat und 1 Zeile in Quarantäne (Bestellung 1103 ohne Datum).
      - Der Umsatzabgleich meldet `OK`, weil die doppelte Bestellung 1102 vor dem Summieren entfernt wurde.
      - Die bereinigte Datei öffnet sich in Excel per Doppelklick mit korrekten Umlauten, Beträgen mit Komma und PLZ mit führender Null.
      - Ein zweiter Lauf erzeugt exakt dieselben Ausgabedateien.
    hints:
      - Die Summenzeile brauchst du zweimal – einmal weglassen (`skipfooter`), einmal lesen, um sie mit deiner Summe zu vergleichen.
      - "Die Quarantäne ist eine Maske: `eindeutig[\"Datum\"].isna()`. Beide Teile schreibst du mit denselben `to_csv`-Argumenten."
    explanation: |
      Das Skript trennt Rohdaten, Ergebnis und Ausschuss: Die Rohdatei wird nur gelesen, die bereinigten Zeilen und die Quarantäne landen in eigenen Ordnern, und das Protokoll macht jede Veränderung zählbar. Der Abgleich mit der Summenzeile ist die einfachste Kontrolle gegen das Quellsystem – stimmt die Summe nicht, stimmt etwas mit Import oder Deduplizierung nicht. Das Duplikat ist hier eine exakt gleiche Zeile, deshalb reicht `drop_duplicates()` ohne `subset`. Weil das Skript keine Uhrzeit, keinen Zufall und keine manuellen Schritte enthält, liefert es bei gleicher Eingabe dieselbe Ausgabe. Mehr zu Projektstruktur und Reproduzierbarkeit folgt in [Reproduzierbare Analyse-Workflows](/data/reproduzierbare-analysen).
