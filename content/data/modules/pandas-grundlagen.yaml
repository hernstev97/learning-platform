        url: https://pandas.pydata.org/docs/user_guide/io.html#na-values

  - id: import-reihenfolge
    type: order
    title: Erst laden, dann aufräumen
    prompt: |
      Bring die Zeilen des Importskripts in die richtige Reihenfolge. Der Export enthält am Ende eine Summenzeile ohne Bestellnummer, und nach einem abgebrochenen Export stehen manche Bestellungen doppelt darin – gültig ist jeweils die zuletzt exportierte Zeile.
    lang: python
    lines: |
      import pandas as pd
      roh = pd.read_csv("export.csv", sep=";", decimal=",", thousands=".", encoding="cp1252")
      ohne_summe = roh[roh["Bestellnr"].notna()]
      bereinigt = ohne_summe.assign(Stadt=ohne_summe["Stadt"].str.strip())
      sortiert = bereinigt.sort_values("Exportzeit")
      eindeutig = sortiert.drop_duplicates(subset="Bestellnr", keep="last")
      print(len(roh), len(eindeutig))
    hints:
      - Jede Zeile arbeitet mit dem Ergebnis der vorigen. Welche Variable braucht welche?
      - "`keep=\"last\"` behält die letzte Zeile je Bestellnummer. Damit „letzte“ „jüngste“ bedeutet, muss vorher etwas passieren."
    explanation: |
      Die Summenzeile muss zuerst weg, weil sie keine Bestellung ist und jede spätere Zählung verfälscht. Die Bereinigung der Stadtnamen kann vor oder nach dem Deduplizieren stehen, hier baut sie auf `ohne_summe` auf. Entscheidend ist die Reihenfolge von `sort_values` und `drop_duplicates`: `keep="last"` behält die letzte Zeile **in der aktuellen Reihenfolge**. Nur nach dem Sortieren nach `Exportzeit` ist das die jüngste. Der Vergleich von `len(roh)` und `len(eindeutig)` gehört ins Protokoll, damit auffällt, wenn plötzlich viele Zeilen wegfallen.
    resources:
      - title: pandas · DataFrame.drop_duplicates
        url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.drop_duplicates.html

  - id: luecken-und-typen
    type: output
    title: Lücken verändern Typen
    prompt: Was gibt das Programm aus? Achte auf Typen und darauf, wie fehlende Werte gezählt werden.
    lang: python
    code: |
      import pandas as pd

      stadt = pd.Series(["Köln ", None, "Bonn"])
      menge = pd.Series([3, None, 5])
      print(stadt.dtype, menge.dtype)
      print(stadt.str.strip().str.len().tolist())
      print(menge.sum(), menge.count(), len(menge))
      print(menge.astype("Int64").tolist())
    expected: |
      str float64
      [4.0, nan, 4.0]
      8.0 2 3
      [3, <NA>, 5]
    hints:
      - "`None` wird in einer Textspalte zu `NaN`, in einer Zahlenspalte ebenfalls. Welcher Zahlentyp kann `NaN` speichern?"
      - "`sum` überspringt fehlende Werte, `count` zählt nur vorhandene, `len` zählt alle Zeilen."
    explanation: |
      Text ist in pandas 3 `str`; der fehlende Wert bleibt `NaN`, und `str.len()` gibt für ihn ebenfalls `NaN` zurück. Weil `NaN` eine Kommazahl ist, wird die ganze Längen-Series `float64` – daher `4.0`. Aus demselben Grund ist `menge` `float64` statt `int64`. `sum` überspringt `NaN` (wie `SUM` in SQL), `count` zählt nur vorhandene Werte (wie `COUNT(menge)`), `len` alle Zeilen (wie `COUNT(*)`). `Int64` mit großem I bleibt ganzzahlig und zeigt die Lücke als `<NA>`.
    resources:
      - title: pandas · Nullable integer data type
        url: https://pandas.pydata.org/docs/user_guide/integer_na.html
      - title: pandas · Migration guide for the new string data type
        url: https://pandas.pydata.org/docs/user_guide/migration-3-strings.html#the-missing-value-sentinel-is-now-always-nan

  - id: tausenderpunkt-im-datum
    type: output
    title: Ein Datum wird zur Zahl
    prompt: Was gibt das Programm aus?
    lang: python
    code: |
      import io
      import pandas as pd

      text = "Datum;Umsatz\n03.03.2026;1.250,40\n04.03.2026;38,50\n"
      df = pd.read_csv(io.StringIO(text), sep=";", decimal=",", thousands=".")
      print(df["Datum"].tolist())
      print(df["Umsatz"].tolist())
    expected: |
      [3032026, 4032026]
      [1250.4, 38.5]
    hints:
      - "`thousands=\".\"` gilt für jede Spalte, die pandas als Zahl zu lesen versucht."
      - Die Spalte `Datum` steht nicht in `parse_dates`. Was bleibt von `03.03.2026` übrig, wenn man alle Punkte entfernt?
    explanation: |
      `thousands="."` erklärt jeden Punkt zum Tausendertrennzeichen – auch in der Datumsspalte, die pandas mangels `parse_dates` als Zahl zu lesen versucht. Aus `03.03.2026` wird `3032026`, ohne Warnung. Beim Umsatz passiert das Richtige: `1.250,40` wird `1250.4`. Die Lösung ist `parse_dates=["Datum"]` mit `date_format="%d.%m.%Y"`; dann liest pandas die Spalte als Datum, bevor die Zahlenerkennung greift. Solche stillen Fehlinterpretationen findest du nur, wenn du nach dem Import `dtypes` und ein paar Werte ansiehst.
    resources:
      - title: pandas · IO tools · Thousand separators
        url: https://pandas.pydata.org/docs/user_guide/io.html#thousand-separators
      - title: pandas · IO tools · Date handling
        url: https://pandas.pydata.org/docs/user_guide/io.html#date-handling

  - id: loc-oder-iloc
    type: output
    title: Beschriftung oder Position
    prompt: Was gibt das Programm aus?
    lang: python
    code: |
      import pandas as pd

      menge = pd.Series([5, 2, 8, 1], index=[10, 20, 30, 40])
      print(menge.loc[10:30].tolist())
      print(menge.iloc[0:2].tolist())
      print(menge.loc[menge > 2].index.tolist())
    expected: |
      [5, 2, 8]
      [5, 2]
      [10, 30]
    hints:
      - "`loc` arbeitet mit den Indexwerten 10, 20, 30, 40, `iloc` mit den Positionen 0 bis 3."
      - Bei `loc` gehört das Ende eines Bereichs dazu, bei `iloc` nicht.
    explanation: |
      `loc[10:30]` wählt nach Beschriftung und schließt das Ende ein: die Einträge mit Index 10, 20 und 30. `iloc[0:2]` wählt nach Position wie eine Python-Liste und schließt das Ende aus: die ersten zwei Einträge. Die Maske `menge > 2` ist eine Series aus `True` und `False`; `loc` behält die Zeilen mit `True`, und `.index` zeigt deren Beschriftungen. Die Verwechslung fällt oft erst auf, wenn der Index nach einem Filter nicht mehr `0, 1, 2, …` ist.
    resources:
      - title: pandas · Selection by label
        url: https://pandas.pydata.org/docs/user_guide/indexing.html#selection-by-label
      - title: pandas · Selection by position
        url: https://pandas.pydata.org/docs/user_guide/indexing.html#selection-by-position

