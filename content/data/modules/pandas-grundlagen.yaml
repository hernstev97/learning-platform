lesson: |
  Jeden Montag lädt Svenja aus dem Vertriebsinnendienst von Bohnenwerk den Bestellexport der Vorwoche aus dem Webshop. Die Datei ist in Windows-1252 kodiert, trennt Felder mit Semikolon, schreibt Beträge als `1.250,40` und Daten als `14.03.2026` und hängt unten eine Summenzeile an. Danach beginnt die Handarbeit in Excel: Summenzeile löschen, „köln“ und „Köln “ angleichen, doppelte Zeilen aus einem abgebrochenen Export suchen, Postleitzahlen reparieren, denen Excel die führende Null genommen hat. Das kostet jede Woche rund 40 Minuten, und jede Woche passiert ein anderer kleiner Fehler.

  Im Modul [CSV-Import und Datenbereinigung](/data/csv-import) hast du dieselben Probleme mit `csv`, `decimal` und `datetime` gelöst: Zeile für Zeile, mit Schleifen und eigenen Umwandlungsfunktionen. **pandas** nimmt dir diese Schleifen ab. Ein Aufruf von `read_csv` mit den richtigen Argumenten ersetzt den Parser, eine Handvoll Spaltenoperationen die Bereinigung. Heraus kommt ein Skript von etwa zwanzig Zeilen, das in Sekunden läuft und jede Woche exakt dasselbe tut. Dieses Modul behandelt Laden und Bereinigen; Gruppieren, Verknüpfen und Umformen folgen in [pandas: gruppieren, verknüpfen, umformen](/data/pandas-auswertung).

  Die ausführbaren Beispiele laufen hier im Browser mit pandas 3.0; beim ersten Start lädt die Seite pandas einmalig nach (etwa 8 MB).

  ## Series, DataFrame und Index: das Denkmodell

  Ein **DataFrame** ist eine Tabelle aus Spalten. Jede Spalte ist eine **Series**: eine Folge von Werten mit einem Namen und genau **einem Datentyp**. Alle Spalten teilen sich einen **Index**, die Zeilenbeschriftung links ([Intro to data structures](https://pandas.pydata.org/docs/user_guide/dsintro.html)). Darin unterscheidet sich pandas grundlegend von einem Excel-Blatt. Dort hat jede Zelle ihren eigenen Typ; in B7 darf Text stehen und in B8 eine Zahl. In pandas hat die Spalte `menge` einen Typ für alle Zeilen, wie eine Spalte in einer Datenbanktabelle.

  ```python run
  import pandas as pd

  positionen = pd.DataFrame({
      "bestellung_id": [1001, 1001, 1002, 1003],
      "produkt": ["Espresso Classico", "Filter Äthiopien", "Espresso Classico", "Handmühle"],
      "menge": [2, 1, 5, 1],
      "einzelpreis": [14.90, 12.50, 13.40, 39.00],
  })
  print(positionen)
  print(positionen.dtypes)
  print(positionen.shape)
  print((positionen["menge"] * positionen["einzelpreis"]).tolist())
  ```

  `dtypes` meldet für Text `str`, für ganze Zahlen `int64` und für Kommazahlen `float64`. `shape` ist `(4, 4)`: vier Zeilen, vier Spalten. Die Multiplikation zweier Spalten liefert ohne Schleife eine neue Series. pandas rechnet **vektorisiert**, also elementweise über die ganze Spalte. Das entspricht einer berechneten Spalte in einer intelligenten Excel-Tabelle (`=[@Menge]*[@Einzelpreis]`) oder dem Ausdruck `menge * einzelpreis` in einem SQL-`SELECT`.

  Der Index (hier `0` bis `3`) ist eine Beschriftung, kein Primärschlüssel, und darf Duplikate enthalten. Wichtig wird er, wenn zwei Series zusammentreffen. pandas richtet sie nach Indexbeschriftung aus, nicht nach Position. Wer Zeilen filtert und danach mit einer ungefilterten Series rechnet, bekommt `NaN` an den Stellen, deren Beschriftung auf einer Seite fehlt.

  > [!MERKE]
  > Ein DataFrame ist eine Sammlung von Series mit gemeinsamem Index. Jede Spalte hat genau einen Datentyp, Operationen wirken auf ganze Spalten. Steht in einer Zahlenspalte ein einziger Text wie `Summe` oder `n/a`, wird die ganze Spalte zu Text.

  ## read_csv: den Shop-Export in einem Aufruf einlesen

  So sieht der Export aus:

  ```csv
  Bestellnr;Kunde;PLZ;Stadt;Datum;Kanal;Status;Versand;Umsatz
  1001;Café Rösterei Nord;01067;Dresden;03.03.2026;B2B;bezahlt;0,00;1.250,40
  1002;Lena Schmitz;50667;Köln ;04.03.2026;Shop;bezahlt;4,90;38,50
  1003;Büro Hansen KG;20095;hamburg;n/a;B2B;storniert;0,00;-
  1004;Jonas Weber;50667;köln;05.03.2026;Shop;bezahlt;4,90;23,90
  ;;;;;;;Summe;1.312,80
  ```

  Mit Standardwerten scheitert der Import, denn pandas erwartet UTF-8 und Kommas. Mit richtigem Encoding und Trennzeichen läuft er durch, liefert aber falsche Typen:

  ```python run
  from pathlib import Path
  import pandas as pd

  text = (
      "Bestellnr;Kunde;PLZ;Stadt;Datum;Kanal;Status;Versand;Umsatz\n"
      "1001;Café Rösterei Nord;01067;Dresden;03.03.2026;B2B;bezahlt;0,00;1.250,40\n"
      "1002;Lena Schmitz;50667;Köln ;04.03.2026;Shop;bezahlt;4,90;38,50\n"
      "1003;Büro Hansen KG;20095;hamburg;n/a;B2B;storniert;0,00;-\n"
      "1004;Jonas Weber;50667;köln;05.03.2026;Shop;bezahlt;4,90;23,90\n"
      ";;;;;;;Summe;1.312,80\n"
  )
  Path("export.csv").write_bytes(text.encode("cp1252"))

  try:
      pd.read_csv("export.csv")
  except UnicodeDecodeError as fehler:
      print("UnicodeDecodeError:", fehler.reason)

  naiv = pd.read_csv("export.csv", sep=";", encoding="cp1252")
  print(naiv.dtypes)
  print(naiv["PLZ"].tolist())
  ```

  `Bestellnr` ist `float64`, weil die Summenzeile dort leer ist und ein fehlender Wert in pandas als Kommazahl `NaN` gespeichert wird. `PLZ` hat die führende Null verloren. `Versand` und `Umsatz` sind Text, weil `0,00`, `-` und `Summe` keine Zahlen in englischer Schreibweise sind, und `Datum` ist ebenfalls Text. Der richtige Aufruf beschreibt die Datei vollständig:

  ```python run
  from pathlib import Path
  import pandas as pd

  text = (
      "Bestellnr;Kunde;PLZ;Stadt;Datum;Kanal;Status;Versand;Umsatz\n"
      "1001;Café Rösterei Nord;01067;Dresden;03.03.2026;B2B;bezahlt;0,00;1.250,40\n"
      "1002;Lena Schmitz;50667;Köln ;04.03.2026;Shop;bezahlt;4,90;38,50\n"
      "1003;Büro Hansen KG;20095;hamburg;n/a;B2B;storniert;0,00;-\n"
      "1004;Jonas Weber;50667;köln;05.03.2026;Shop;bezahlt;4,90;23,90\n"
      ";;;;;;;Summe;1.312,80\n"
  )
  Path("export.csv").write_bytes(text.encode("cp1252"))

  bestellungen = pd.read_csv(
      "export.csv",
      sep=";",                  # Trennzeichen
      encoding="cp1252",        # Windows-1252
      decimal=",",              # Dezimalkomma
      thousands=".",            # Tausenderpunkt
      dtype={"PLZ": "str"},     # führende Nullen behalten
      parse_dates=["Datum"],
      date_format="%d.%m.%Y",   # 14.03.2026
      na_values=["n/a", "-"],   # weitere Schreibweisen für „fehlt“
      skipfooter=1,             # Summenzeile am Ende weglassen
      engine="python",          # skipfooter gibt es nur in der Python-Engine
  )
  print(bestellungen.dtypes)
  print(bestellungen[["PLZ", "Datum", "Umsatz"]])
  ```

  Jedes Argument beantwortet eine Frage, die du in Excel im Dialog „Daten › Aus Text/CSV“ und im Power-Query-Editor mit Klicks beantwortest ([Textdateien importieren](https://support.microsoft.com/de-de/office/importieren-oder-exportieren-von-text-txt-oder-csv-dateien-5250ac4c-663c-47ce-937b-339e391393ba)). Der Unterschied: In pandas steht die Antwort im Code und gilt nächste Woche wieder.

  | Frage an die Datei | `read_csv` | Excel und Power Query |
  | --- | --- | --- |
  | Welche Zeichenkodierung? | `encoding="cp1252"`, `"utf-8"` | Dateiursprung |
  | Welches Trennzeichen? | `sep=";"` | Trennzeichen |
  | Wie sehen Zahlen aus? | `decimal=","`, `thousands="."` | Typ ändern › Mit Gebietsschema |
  | Was ist Text, obwohl es wie eine Zahl aussieht? | `dtype={"PLZ": "str"}` | Datentyp „Text“ |
  | Welche Spalten sind Datumswerte, in welchem Format? | `parse_dates`, `date_format` | Datentyp „Datum“ mit Gebietsschema |
  | Was bedeutet „fehlt“? | `na_values=["n/a", "-"]` | Werte ersetzen |
  | Welche Zeilen gehören nicht zu den Daten? | `skipfooter`, `skiprows` | Untere bzw. obere Zeilen entfernen |
  | Welche Spalten brauchst du überhaupt? | `usecols=[…]` | Spalten entfernen |

  Alle Parameter stehen in der [read_csv-Referenz](https://pandas.pydata.org/docs/reference/api/pandas.read_csv.html), Hintergründe im Abschnitt [CSV & text files](https://pandas.pydata.org/docs/user_guide/io.html#csv-text-files) des User Guide. Encoding-Namen sind die von Python, etwa `cp1252`, `utf-8` und `utf-8-sig`. Ein UTF-8-BOM am Dateianfang entfernt `read_csv` anders als das `csv`-Modul selbst. `skipfooter` funktioniert nur mit `engine="python"`; die ist langsamer, was bei Wochenexporten mit ein paar tausend Zeilen keine Rolle spielt.

  > [!WARNING] Deutsche Datumsangaben ohne Format
  > Ohne `date_format` rät pandas das Format aus dem ersten Wert und nimmt bei mehrdeutigen Werten den Monat zuerst. Aus `04.03.2026` wird dann still der 3. April. Passt ein späterer Wert nicht ins geratene Muster (`14.04.2026`), bleibt die ganze Spalte ohne Meldung Text. Und wer mit `thousands="."` liest und die Datumsspalte in `parse_dates` vergisst, bekommt aus `03.03.2026` die Zahl `3032026`. Prüfe deshalb nach jedem Import `df.dtypes`.

  ## Datentypen in pandas 3: str, Int64, category und datetime64

  Der Datentyp einer Spalte entscheidet, was du mit ihr tun kannst: rechnen, Textmethoden oder Datumsfunktionen. Für Geschäftsdaten brauchst du diese Typen:

  | Typ | Wofür | Fehlender Wert |
  | --- | --- | --- |
  | `int64` | ganze Zahlen ohne Lücken | nicht möglich – eine Lücke macht `float64` daraus |
  | `Int64` | ganze Zahlen mit Lücken (Mengen, IDs) | `<NA>` |
  | `float64` | Beträge, Anteile | `NaN` |
  | `str` | Text | `NaN` |
  | `category` | wenige wiederkehrende Werte (Region, Status) | `NaN` |
  | `datetime64[us]` | Datum und Uhrzeit | `NaT` |
  | `bool` | ja/nein | nicht möglich |

  **Text ist in pandas 3 `str`.** Bis pandas 2 landete Text im Allzwecktyp `object`, der beliebige Python-Objekte aufnimmt. Seit pandas 3.0 ist der Standard ein eigener String-Typ, der als `str` angezeigt wird und nur Text und fehlende Werte (`NaN`) enthält ([Migration guide for the new string data type](https://pandas.pydata.org/docs/user_guide/migration-3-strings.html)). Eine Zahl in eine `str`-Spalte zu schreiben ist jetzt ein `TypeError`. Code aus älteren Tutorials, der `dtype == object` prüft, liefert `False`; frage stattdessen `pd.api.types.is_string_dtype`.

  **Ganze Zahlen mit Lücken brauchen `Int64`.** `NaN` ist technisch eine Kommazahl. Fehlt in einer Mengenspalte ein Wert, macht pandas aus `3` deshalb `3.0`. Der Typ `Int64` mit großem I kennt einen eigenen fehlenden Wert `<NA>` und bleibt ganzzahlig. In `read_csv` schreibst du dafür `dtype={"menge": "Int64"}`.

  **`category`** speichert jeden Wert einmal und in den Zeilen nur einen Verweis ([Categorical data](https://pandas.pydata.org/docs/user_guide/categorical.html)). Für Region oder Status spart das Speicher und legt eine fachliche Reihenfolge fest. Werte, die nicht zu den Kategorien gehören, werden bei der Umwandlung zu `NaN`. pandas 3 warnt dabei mit `Pandas4Warning`, eine künftige Version wirft einen Fehler. Prüfe unbekannte Werte deshalb vorher mit `isin`.

  **Datumswerte** sind `datetime64`. Aus Text entsteht in pandas 3 `datetime64[us]` (Mikrosekunden), früher war es immer `datetime64[ns]`; für Auswertungen ändert sich nur die Anzeige.

  ```python run
  import pandas as pd

  menge = pd.Series([3, None, 5])
  print(menge.dtype, menge.tolist())
  print(menge.astype("Int64").tolist())

  region = pd.Series(["Nord", "Süd", "Nord", "West"])
  print(region.dtype, pd.api.types.is_string_dtype(region), region.dtype == object)
  reihenfolge = pd.CategoricalDtype(["Nord", "Süd", "West", "Ost"])
  print(region.astype(reihenfolge).value_counts(sort=False).to_dict())

  try:
      region[0] = 7
  except TypeError as fehler:
      print("TypeError:", fehler)
  ```

  Spalten, die als Text angekommen sind, wandelst du nachträglich mit `pd.to_numeric(spalte, errors="coerce")` oder `pd.to_datetime(spalte, format="%d.%m.%Y", errors="coerce")` um. `errors="coerce"` macht aus nicht lesbaren Werten `NaN` bzw. `NaT` statt einen Fehler zu werfen. Das ist bequem und gefährlich zugleich: Zähle vorher und nachher die fehlenden Werte, sonst verschwinden ungültige Einträge still (mehr dazu in [Datenqualität messen und sichern](/data/datenqualitaet)).

  ## Zeilen und Spalten auswählen: loc, iloc, Masken und query

  `df["Umsatz"]` liefert eine Series, `df[["Kunde", "Umsatz"]]` mit doppelten Klammern einen DataFrame mit zwei Spalten. Für alles Weitere gibt es zwei Zugriffe ([Indexing and selecting data](https://pandas.pydata.org/docs/user_guide/indexing.html#boolean-indexing)):

  - `df.loc[zeilen, spalten]` wählt nach **Beschriftung**: Indexwerte und Spaltennamen. Ein Bereich wie `loc[1002:1004]` schließt das Ende ein.
  - `df.iloc[zeilen, spalten]` wählt nach **Position**, wie bei Python-Listen. `iloc[0:2]` sind die ersten zwei Zeilen, das Ende ist ausgeschlossen.

  Filtern funktioniert mit einer **booleschen Maske**: einer Series aus `True` und `False`, genauso lang wie der DataFrame. `df[maske]` oder `df.loc[maske, spalten]` behält die Zeilen mit `True`. Bedingungen verknüpfst du mit `&` (und), `|` (oder) und `~` (nicht), und jede Bedingung steht in Klammern, weil `&` stärker bindet als `==`. Pythons `and` und `or` funktionieren hier nicht; sie enden in `ValueError: The truth value of a Series is ambiguous`. `query` nimmt die Bedingung als Text, erlaubt darin `and` und `or` und greift mit `@name` auf Python-Variablen zu.

  ```python run
  import pandas as pd

  bestellungen = pd.DataFrame({
      "Bestellnr": [1001, 1002, 1003, 1004, 1005],
      "Kanal": ["B2B", "Shop", "B2B", "Shop", "B2B"],
      "Status": ["bezahlt", "bezahlt", "storniert", "bezahlt", "bezahlt"],
      "Umsatz": [1250.40, 38.50, 610.00, 23.90, 480.00],
  }).set_index("Bestellnr")

  print(bestellungen.loc[1002:1004, "Umsatz"].tolist())
  print(bestellungen.iloc[0:2]["Kanal"].tolist())

  gross_b2b = (bestellungen["Kanal"] == "B2B") & (bestellungen["Umsatz"] >= 500)
  print(bestellungen.loc[gross_b2b].index.tolist())

  grenze = 500
  print(bestellungen.query("Kanal == 'B2B' and Status == 'bezahlt' and Umsatz >= @grenze").index.tolist())
  print(bestellungen.loc[bestellungen["Status"].isin(["storniert", "retourniert"])].index.tolist())
  ```

  Dieselbe Frage in den anderen Werkzeugen: In SQL steht die Bedingung im `WHERE`, in Excel im AutoFilter oder in der Funktion `FILTER` (Microsoft 365; ältere Excel-Versionen haben sie nicht). Die Multiplikation zweier Bedingungen ist dort das logische Und:

  ```excel
  =FILTER(Bestellungen;(Bestellungen[Kanal]="B2B")*(Bestellungen[Umsatz]>=500))
  ```

  | Aufgabe | Excel | SQL | pandas |
  | --- | --- | --- | --- |
  | Zeilen filtern | AutoFilter, `FILTER` | `WHERE` | Maske oder `query` |
  | Spalten wählen | Spalten ausblenden | `SELECT kunde, umsatz` | `df[["Kunde", "Umsatz"]]` |
  | Werteliste | Häkchen im Filter | `IN ('storniert', 'retourniert')` | `isin([…])` |

  ## Neue Spalten mit assign und die Regeln von Copy-on-Write

  `df.assign(neu=…)` liefert einen **neuen** DataFrame mit zusätzlicher oder ersetzter Spalte. Übergibst du eine Funktion (`lambda d: …`), bekommt sie den DataFrame im aktuellen Zustand – praktisch in Ketten, in denen es keinen Variablennamen gibt. `df["neu"] = …` ändert dagegen den DataFrame selbst. Beides ist richtig; in Funktionen und Ketten ist `assign` die sicherere Wahl, weil die Eingabe unberührt bleibt. Werte nur in bestimmten Zeilen setzt du mit `df.loc[maske, "Spalte"] = wert`.

  Seit pandas 3.0 gilt **Copy-on-Write** ([Copy-on-Write](https://pandas.pydata.org/docs/user_guide/copy_on_write.html#chained-assignment)). Die Regel: Jedes Objekt, das du aus einem DataFrame ableitest – Filterergebnis, ausgewählte Spalte, Ergebnis einer Methode –, verhält sich wie eine unabhängige Kopie. Kopiert wird erst beim Schreiben, daher der Name und der geringe Speicherbedarf. Daraus folgen vier Dinge:

  1. Änderst du ein Filterergebnis, bleibt das Original unverändert. Ein vorsorgliches `.copy()` nach dem Filtern ist nicht mehr nötig.
  2. **Verkettete Zuweisung** wirkt nie: `df[maske]["Versand"] = 0` schreibt in ein Zwischenobjekt, das sofort wieder verschwindet. pandas warnt mit `ChainedAssignmentError`. Richtig ist ein Schritt mit `loc`.
  3. Die `SettingWithCopyWarning` älterer Versionen gibt es nicht mehr. Antworten im Netz dazu beschreiben pandas 2 und älter.
  4. Copy-on-Write schützt abgeleitete Objekte, nicht das Objekt selbst. Eine Funktion, die `df.loc[…] = …` auf ihrem Parameter ausführt, ändert den DataFrame des Aufrufers. Gib deshalb neue DataFrames zurück.

  ```python run
  import pandas as pd

  bestellungen = pd.DataFrame({
      "Status": ["bezahlt", "storniert", "bezahlt"],
      "Versand": [4.90, 4.90, 0.00],
      "Umsatz": [38.50, 23.90, 1250.40],
  })

  # Verkettete Zuweisung: schreibt in eine Kopie, pandas warnt
  bestellungen[bestellungen["Status"] == "storniert"]["Versand"] = 0.0
  print(bestellungen["Versand"].tolist())

  # Ein Schritt mit loc: wirkt
  bestellungen.loc[bestellungen["Status"] == "storniert", "Versand"] = 0.0
  print(bestellungen["Versand"].tolist())

  # Abgeleitete Objekte sind unabhängig
  bezahlt = bestellungen[bestellungen["Status"] == "bezahlt"]
  bezahlt.loc[:, "Umsatz"] = 0.0
  print(bestellungen["Umsatz"].tolist())

  # assign liefert einen neuen DataFrame, das Original bleibt
  mit_gesamt = bestellungen.assign(Gesamt=lambda d: d["Umsatz"] + d["Versand"])
  print(list(bestellungen.columns))
  print(list(mit_gesamt.columns))
  ```

  > [!INTERVIEW] „Was hat sich mit pandas 3 geändert, und worauf achtest du bei altem Code?“
  > Zwei Dinge fallen sofort auf. Copy-on-Write ist Standard: Jedes abgeleitete Objekt verhält sich wie eine Kopie, verkettete Zuweisungen wie `df[maske]["x"] = 1` wirken nie, und die `SettingWithCopyWarning` gibt es nicht mehr – ich schreibe mit `df.loc[maske, "x"] = 1` in einem Schritt oder baue neue Spalten mit `assign`. Und Text hat den eigenen Typ `str` statt `object`, fehlende Werte sind dort `NaN`. In altem Code suche ich deshalb nach verketteten Zuweisungen, nach Prüfungen auf `dtype == object` und nach entfernten Frequenzkürzeln wie `resample("M")`.

  ## Text, Datum, Lücken und Duplikate bereinigen

  Über `.str` erreichst du Stringmethoden für eine ganze Spalte, über `.dt` die Bestandteile von Datumswerten ([Working with text data](https://pandas.pydata.org/docs/user_guide/text.html)). Fehlende Werte bleiben dabei fehlend, statt einen Fehler auszulösen. Excel-Nutzer kennen `GLÄTTEN` (englisch `TRIM`): Die Funktion entfernt Leerzeichen am Rand **und** reduziert mehrere Leerzeichen im Text auf eines ([GLÄTTEN](https://support.microsoft.com/de-de/office/gl%C3%A4tten-funktion-410388fa-c5df-49c6-b16c-9e5630b479f9)). `str.strip()` entfernt nur die Ränder; für das Innere brauchst du zusätzlich `str.replace(r"\s+", " ", regex=True)`.

  ```python run
  import pandas as pd

  kunden = pd.DataFrame({
      "kunde_id": [17, 18, 18, 19, 20, 21],
      "stadt": ["Köln ", "köln", "köln", "Bergisch  Gladbach", None, "KÖLN"],
      "rabatt": [0.10, None, None, 0.05, 0.0, None],
  })
  print(kunden["stadt"].value_counts(dropna=False).to_dict())

  stadt = kunden["stadt"].str.strip().str.replace(r"\s+", " ", regex=True).str.title()
  kunden = kunden.assign(stadt=stadt)
  print(kunden["stadt"].value_counts(dropna=False).to_dict())

  print(kunden.isna().sum().to_dict())
  print(round(kunden["rabatt"].mean(), 3), kunden["rabatt"].count(), len(kunden))

  print(kunden.duplicated().sum(), kunden.duplicated(subset="kunde_id").sum())
  kunden = kunden.drop_duplicates().fillna({"rabatt": 0.0})
  print(len(kunden), kunden["rabatt"].tolist())

  datum = pd.to_datetime(pd.Series(["14.03.2026", "31.04.2026"]), format="%d.%m.%Y", errors="coerce")
  print(datum.tolist())
  print(datum.dt.isocalendar().week.tolist(), datum.dt.month.tolist())
  ```

  `value_counts` vor und nach der Bereinigung ist der schnellste Test, ob Schreibvarianten zusammengefallen sind. `str.title()` reicht hier, macht aber aus „Mülheim an der Ruhr“ „Mülheim An Der Ruhr“. Für Stammdaten ist ein Abgleich mit einer Liste gültiger Schreibweisen robuster; das übst du unten.

  **Fehlende Werte** behandelst du nach einer Regel, die du benennen kannst ([Working with missing data](https://pandas.pydata.org/docs/user_guide/missing_data.html)):

  - **Behalten.** `sum` und `mean` überspringen `NaN`, `count` zählt nur vorhandene Werte – wie `SUM`, `AVG` und `COUNT(spalte)` in SQL. Der Mittelwert oben bezieht sich deshalb auf drei Zeilen, nicht auf sechs.
  - **Füllen**, wenn eine Geschäftsregel sagt, was „fehlt“ bedeutet. Bei Bohnenwerk heißt ein leeres Rabattfeld „kein Rabatt“, also `fillna({"rabatt": 0.0})`. Ein fehlendes Bestelldatum hat keine solche Regel.
  - **Aussortieren** mit `dropna(subset=["Datum"])`, wenn die Zeile für die Frage unbrauchbar ist – aber gezählt und protokolliert, nicht still.

  **Duplikate** gibt es in zwei Sorten. `duplicated()` findet exakt gleiche Zeilen, typischerweise aus einem doppelt gestarteten Export; die darfst du entfernen. `duplicated(subset="kunde_id")` findet gleiche Schlüssel mit womöglich unterschiedlichem Inhalt. Hier musst du entscheiden, welche Zeile gilt – meist die mit dem jüngsten Änderungszeitpunkt: erst `sort_values`, dann `drop_duplicates(subset=…, keep="last")`. Mit `keep=False` markierst du alle Kopien, um sie dir vorher anzusehen.

  **Datumsbestandteile** liefert `.dt`: `dt.year`, `dt.month`, `dt.isocalendar().week` (die ISO-Kalenderwoche wie `ISOKALENDERWOCHE` in Excel) und `dt.to_period("M")` für Monatsauswertungen im nächsten Modul.

  > [!PRAXIS] Vom Montagsritual zum Skript
  > Bei Bohnenwerk liegt der Export jetzt unverändert in `daten/roh/`. Das Skript unten liest ihn, bereinigt ihn, schreibt eine Datei nach `daten/bereinigt/` und druckt ein Protokoll mit gelesenen Zeilen, entfernten Duplikaten und fehlenden Daten. Svenja startet es mit `uv run bereinige_export.py daten/roh/bestellungen_KW12.csv`; `uv` installiert pandas dabei aus dem Kopfkommentar ([Running scripts](https://docs.astral.sh/uv/guides/scripts/#declaring-script-dependencies)). Aus 40 Minuten werden zwei, und die gehen ins Lesen des Protokolls. Fällt eine Zahl aus dem Rahmen, sieht sie es am Montag und nicht erst im Monatsbericht.

  ```python title=bereinige_export.py
  # /// script
  # dependencies = ["pandas>=3"]
  # ///
  import sys
  from pathlib import Path

  import pandas as pd

  roh = Path(sys.argv[1])
  ziel = Path("daten/bereinigt") / roh.name

  df = pd.read_csv(
      roh, sep=";", encoding="cp1252", decimal=",", thousands=".",
      dtype={"PLZ": "str"}, parse_dates=["Datum"], date_format="%d.%m.%Y",
      na_values=["n/a", "-"], skipfooter=1, engine="python",
  )
  gelesen = len(df)
  df = df.assign(Stadt=df["Stadt"].str.strip().str.replace(r"\s+", " ", regex=True))
  df = df.drop_duplicates(subset="Bestellnr", keep="last")
  ohne_datum = df["Datum"].isna().sum()

  ziel.parent.mkdir(parents=True, exist_ok=True)
  df.to_csv(ziel, sep=";", decimal=",", date_format="%d.%m.%Y", index=False, encoding="utf-8-sig")
  print(f"{gelesen} Zeilen gelesen, {gelesen - len(df)} Duplikate entfernt, {ohne_datum} ohne Datum -> {ziel}")
  ```

  Die Ausgabedatei ist UTF-8 mit BOM, Semikolon und Dezimalkomma, damit ein deutsches Excel sie per Doppelklick richtig öffnet. Die Rohdatei bleibt unverändert.

  ## Häufige Fehler

  - **`UnicodeDecodeError: 'utf-8' codec can't decode byte …`** Die Datei ist nicht UTF-8. Für Exporte aus deutschen Windows-Programmen ist `encoding="cp1252"` fast immer richtig. `encoding_errors="replace"` ist keine Lösung: Es macht aus „Café“ still „Caf�“.
  - **Alles steht in einer Spalte.** Das Trennzeichen fehlt. `df.shape` zeigt dann `(n, 1)`; `sep=";"` behebt es.
  - **Beträge sind `str`.** `decimal` und `thousands` fehlen, oder ein Text wie `-`, `n/a` oder `Summe` steht in der Spalte. `na_values` und `skipfooter` helfen, `df.dtypes` direkt nach dem Import zeigt das Problem.
  - **Postleitzahl `1067` statt `01067`.** Spalten mit führenden Nullen bekommen `dtype={"PLZ": "str"}`. Ein nachträgliches `str.zfill(5)` repariert nur, was du kennst.
  - **Datum als Zahl `3032026`, als Text oder mit vertauschtem Tag und Monat.** `parse_dates` vergessen oder `date_format` weggelassen.
  - **`ValueError: The truth value of a Series is ambiguous`.** In einer Maske stehen `and` oder `or` statt `&` und `|`. Jede Bedingung kommt in Klammern.
  - **`ChainedAssignmentError`, und nichts ändert sich.** Verkettete Zuweisung. Schreibe mit `df.loc[maske, "Spalte"] = wert` in einem Schritt.
  - **„Köln“ steht dreimal in `value_counts`.** Leerzeichen und Groß- und Kleinschreibung. Vor dem Zählen bereinigen und danach noch einmal zählen.

  ## Zusammenfassung

  - Ein DataFrame besteht aus Series mit gemeinsamem Index. Jede Spalte hat genau einen Datentyp, Operationen wirken spaltenweise.
  - `read_csv` beschreibt die Datei vollständig: `sep`, `encoding`, `decimal`, `thousands`, `dtype`, `parse_dates` mit `date_format`, `na_values`, `usecols`, `skipfooter`. Danach prüfst du `df.dtypes` und `df.shape`.
  - In pandas 3 ist Text `str` mit `NaN` als fehlendem Wert. Ganze Zahlen mit Lücken brauchen `Int64`, wiederkehrende Werte passen zu `category`, Datumswerte sind `datetime64[us]`.
  - `loc` wählt nach Beschriftung (Ende eingeschlossen), `iloc` nach Position (Ende ausgeschlossen). Masken verknüpfst du mit `&`, `|`, `~` und Klammern.
  - Copy-on-Write: Abgeleitete Objekte sind unabhängig, verkettete Zuweisungen wirken nie. Geschrieben wird mit `loc` in einem Schritt oder mit `assign`.
  - `.str` und `.dt` bereinigen ganze Spalten. `value_counts` vorher und nachher zeigt, ob Schreibvarianten verschwunden sind.
  - Fehlende Werte und Duplikate behandelst du nach einer benannten Regel und zählst vorher und nachher.
exercises:
  - id: spalte-wird-text
    type: choice
    title: Warum sind die Beträge Text?
    prompt: |
      Du liest den Shop-Export mit `pd.read_csv("export.csv", sep=";", encoding="cp1252")`. `df.dtypes` meldet für die Spalte `Umsatz` den Typ `str`, obwohl dort Beträge wie `1.250,40` und `38,50` stehen. Welche Ursachen kommen dafür in Frage?
    options:
      - text: Ohne `decimal=","` und `thousands="."` erkennt pandas `38,50` und `1.250,40` nicht als Zahl.
        correct: true
        why: pandas liest Zahlen standardmäßig in englischer Schreibweise. Ein Wert, der sich nicht als Zahl lesen lässt, macht die ganze Spalte zu Text.
      - text: In der Spalte steht mindestens ein Eintrag wie `-`, `n/a` oder `Summe`, der nicht in `na_values` steht und nicht per `skipfooter` wegfällt.
        correct: true
        why: Eine Spalte hat genau einen Typ. Schon ein einziger Text wie `Summe` in der letzten Zeile zwingt die ganze Spalte auf `str`.
      - text: "`cp1252` ist das falsche Encoding; mit UTF-8 würde pandas die Zahlen erkennen."
        correct: false
        why: Das Encoding entscheidet, wie Bytes zu Zeichen werden, nicht wie Zahlen gelesen werden. Ein falsches Encoding führt zu `UnicodeDecodeError` oder zu verstümmelten Umlauten.
      - text: pandas 3 liest grundsätzlich jede Spalte als `str`, bis man sie mit `astype` umwandelt.
        correct: false
        why: pandas erkennt Zahlen und (mit `parse_dates`) Datumswerte weiterhin selbst. `str` ist nur der neue Standardtyp für Spalten, die Text enthalten.
    explanation: |
      Eine Spalte wird nur dann numerisch, wenn sich **jeder** Wert als Zahl lesen lässt. Deutsche Schreibweise braucht deshalb `decimal=","` und `thousands="."`, und alle Platzhalter für „fehlt“ gehören in `na_values`. Die Summenzeile am Ende lässt du mit `skipfooter=1` weg. Die Diagnose ist immer dieselbe: direkt nach dem Import `df.dtypes` ansehen und bei einer verdächtigen Textspalte `df[spalte].unique()` prüfen.
