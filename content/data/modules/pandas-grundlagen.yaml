    solution: |
      import pandas as pd


      def lade_export(pfad):
          return pd.read_csv(
              pfad,
              sep=";",
              encoding="cp1252",
              decimal=",",
              thousands=".",
              dtype={"PLZ": "str"},
              parse_dates=["Datum"],
              date_format="%d.%m.%Y",
              na_values=["n/a", "-"],
              skipfooter=1,
              engine="python",
          )
    tests:
      - name: Fünf Bestellungen, keine Summenzeile
        code: |
          import pandas as pd
          df = lade_export("bestellungen_KW12.csv")
          assert len(df) == 5, f"erwartet 5 Zeilen, bekommen {len(df)} – steht die Summenzeile noch drin?"
          assert pd.api.types.is_integer_dtype(df["Bestellnr"]), f"Bestellnr soll ganzzahlig sein, ist aber {df['Bestellnr'].dtype}"
          assert df["Bestellnr"].tolist() == [1101, 1102, 1103, 1104, 1105]
      - name: Umlaute und Postleitzahlen bleiben erhalten
        code: |
          df = lade_export("bestellungen_KW12.csv")
          assert df.loc[1, "Kunde"] == "Petra Öztürk", f"Kunde in Zeile 1 ist {df.loc[1, 'Kunde']!r}"
          assert df["PLZ"].tolist() == ["21073", "04109", "50679", "01309", "53111"], f"PLZ sind {df['PLZ'].tolist()} – führende Nullen verloren?"
      - name: Beträge sind Zahlen, Striche fehlen
        code: |
          import pandas as pd
          df = lade_export("bestellungen_KW12.csv")
          assert df["Umsatz"].dtype == "float64", f"Umsatz hat den Typ {df['Umsatz'].dtype}, erwartet float64"
          assert df["Versand"].dtype == "float64", f"Versand hat den Typ {df['Versand'].dtype}, erwartet float64"
          assert df.loc[0, "Umsatz"] == 2480.0 and df.loc[4, "Umsatz"] == 1095.5, "Tausenderpunkt oder Dezimalkomma falsch gelesen"
          assert pd.isna(df.loc[2, "Umsatz"]) and pd.isna(df.loc[2, "Versand"]), "'-' soll als fehlender Wert gelten"
      - name: Datum ist ein Datum
        code: |
          import pandas as pd
          df = lade_export("bestellungen_KW12.csv")
          assert pd.api.types.is_datetime64_any_dtype(df["Datum"]), f"Datum hat den Typ {df['Datum'].dtype}"
          assert df.loc[1, "Datum"] == pd.Timestamp(2026, 3, 10), f"Zeile 1 hat das Datum {df.loc[1, 'Datum']} – Tag und Monat vertauscht?"
          assert pd.isna(df.loc[2, "Datum"]), "'n/a' im Datum soll fehlen (NaT)"
    hints:
      - Der erste Fehler kommt vom Encoding. Wie heißt Windows-1252 in Python?
      - Für die Zahlen brauchst du `decimal` und `thousands`, für fehlende Werte `na_values`, für die PLZ `dtype`.
      - "Die Summenzeile entfernt `skipfooter=1`; das verlangt `engine=\"python\"`. Das Datum liest `parse_dates=[\"Datum\"]` mit `date_format=\"%d.%m.%Y\"`."
    explanation: |
      Jedes Argument beantwortet eine Frage an die Datei: `encoding` die Zeichenkodierung, `sep` das Trennzeichen, `decimal` und `thousands` die Zahlenschreibweise, `dtype` die Spalten, die trotz Ziffern Text bleiben, `parse_dates` mit `date_format` das Datum und `na_values` die Platzhalter für „fehlt“. Die Summenzeile entfernst du beim Lesen, sonst macht sie `Bestellnr` zu `float64` und `Versand` zu Text. Gleichwertig wäre, erst alles zu lesen, dann die Zeilen ohne Bestellnummer zu filtern und die Typen nachträglich umzuwandeln – das sind aber mehr Schritte, die schiefgehen können.
    resources:
