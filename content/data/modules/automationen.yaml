id: automationen
title: Kleine Automationen für Analysen
level: 2
minutes: 180
summary: Wiederkehrende Auswertungen einmal sauber bauen – Monatsdateien idempotent zusammenführen, neue und geänderte Dateien erkennen, einen Kennzahlenbericht erzeugen und für jede Aufgabe das passende Werkzeug zwischen Power Query, SQL, Python und Office Scripts wählen.
goals:
  - Du wählst für eine wiederkehrende Aufgabe begründet zwischen Excel mit Power Query, SQL, Python und Office Scripts oder VBA.
  - Du führst Monatsexporte aus einem Ordner so zusammen, dass ein zweiter Lauf keine Duplikate erzeugt und der jüngste Stand einer Bestellung gewinnt.
  - Du erkennst neue und geänderte Dateien über ein Manifest mit Prüfsummen und aktualisierst es erst nach erfolgreicher Verarbeitung.
  - Du erzeugst aus dem Bestand einen Kennzahlenbericht als Text mit deutschem Zahlenformat und als Excel-Datei.
  - Du baust Protokoll, Trockenlauf und Exit-Codes ein und weißt, wie der Job zeitgesteuert läuft.
