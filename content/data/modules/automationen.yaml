  - id: monatslauf-ablauf
    type: order
    title: Der Monatslauf in der richtigen Reihenfolge
    prompt: |
      Bring die Zeilen des Monatslaufs in die richtige Reihenfolge. Regeln: Der Trockenlauf liest nur und zeigt den Plan. Geprüft wird vor jedem Schreiben. Das Manifest wird als Letztes gespeichert, damit ein Abbruch keine Datei als erledigt markiert. Bestand und Bericht dürfen in beliebiger Reihenfolge geschrieben werden.
    lang: python
    lines: |
      def monatslauf(eingang: Path, arbeit: Path, monat: str, dry_run: bool) -> int:
          manifest = lade_manifest(arbeit / "manifest.json")
          plan = plane(eingang, manifest)
          if dry_run:
              return zeige(plan)
          bestand = baue_bestand_neu(eingang)
          pruefe(bestand)
          schreibe_atomar(bestand, arbeit / "bestand.csv")
          schreibe_bericht(bestand, monat, arbeit / f"monatsbericht_{monat}.xlsx")
          speichere_manifest(arbeit / "manifest.json", plan)
          return 0
    alternatives:
      - [1, 2, 3, 4, 5, 6, 7, 9, 8, 10, 11]
    hints:
      - Der Plan braucht das Manifest, der Trockenlauf braucht den Plan.
      - "`pruefe` wirft bei Fehlern eine Ausnahme – alles, was danach kommt, passiert nur mit geprüften Daten."
    explanation: |
      Ohne Manifest kein Plan, ohne Plan kein Trockenlauf – und der Trockenlauf endet, bevor irgendetwas gebaut oder geschrieben wird. Danach wird der Bestand aus allen Rohdateien neu aufgebaut und geprüft, bevor eine Datei entsteht. Bestand und Bericht sind voneinander unabhängig; ihre Reihenfolge ist frei. Das Manifest kommt zuletzt: Bricht der Lauf beim Schreiben ab, gelten die Dateien beim nächsten Lauf weiter als neu, und nichts geht verloren.
    resources:
      - title: Python · os.replace
        url: https://docs.python.org/3/library/os.html#os.replace

  - id: datum-wird-zahl
    type: output
    title: Ein Datum mit Tausenderpunkt
    prompt: Was gibt das Programm aus?
    lang: python
    code: |
      import io
      import pandas as pd

      export = io.StringIO(
          "bestellung_id;bestelldatum;warenwert\n"
          "10231;02.03.2026;1.240,00\n"
          "10232;14.03.2026;48,90\n"
      )
      df = pd.read_csv(export, sep=";", decimal=",", thousands=".")
      print(df["warenwert"].tolist())
      print(df["bestelldatum"].tolist())
      print(df["bestelldatum"].dtype)
    expected: |
      [1240.0, 48.9]
      [2032026, 14032026]
      int64
    hints:
      - "`thousands` gilt nicht nur für die Spalte `warenwert`."
      - Was bleibt von `02.03.2026` übrig, wenn man alle Tausenderpunkte entfernt?
    explanation: |
      `thousands="."` erlaubt pandas, Punkte in jeder Spalte als Tausendertrennzeichen zu überspringen, die es als Zahl lesen kann. `02.03.2026` wird so zu `02032026` und damit zur Ganzzahl 2032026, die Spalte bekommt den Typ `int64` – ohne Warnung. Die Beträge sind dagegen richtig. Lies Datumsspalten deshalb ausdrücklich mit `parse_dates=["bestelldatum"]` und `date_format="%d.%m.%Y"` oder zunächst als Text mit `dtype={"bestelldatum": "str"}`.
    resources:
      - title: pandas · read_csv
        url: https://pandas.pydata.org/docs/reference/api/pandas.read_csv.html

  - id: zweimal-angehaengt
    type: output
    title: Zweimal derselbe Monat
    prompt: Was gibt das Programm aus?
    lang: python
    code: |
      import pandas as pd

      def upsert(bestand: pd.DataFrame, neu: pd.DataFrame) -> pd.DataFrame:
          return (pd.concat([bestand, neu], ignore_index=True)
                    .drop_duplicates(subset="bestellung_id", keep="last")
                    .reset_index(drop=True))

      bestand = pd.DataFrame({"bestellung_id": [10231, 10232], "warenwert": [50.0, 1240.0]})
      neu = pd.DataFrame({"bestellung_id": [10232, 10301], "warenwert": [1250.0, 20.0]})

      einmal = upsert(bestand, neu)
      zweimal = upsert(einmal, neu)
      print(len(pd.concat([bestand, neu, neu])))
      print(len(einmal), len(zweimal))
      print(zweimal["warenwert"].tolist())
    expected: |
      6
      3 3
      [50.0, 1250.0, 20.0]
    explanation: |
      Reines Anhängen (`concat`) zählt jede Zeile, auch doppelt gelieferte: 2 + 2 + 2 = 6. `upsert` behält je `bestellung_id` nur die letzte Zeile. Beim ersten Lauf ersetzt die neue Zeile 10232 die alte (1240 → 1250), 10301 kommt dazu – drei Zeilen. Der zweite Lauf mit denselben Daten ändert nichts mehr: Das ist Idempotenz. `keep="last"` funktioniert aber nur, weil `neu` hinter `bestand` steht; die Reihenfolge der Teile entscheidet, welcher Stand gewinnt.
    resources:
      - title: pandas · DataFrame.drop_duplicates
        url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.drop_duplicates.html
      - title: pandas · concat
        url: https://pandas.pydata.org/docs/reference/api/pandas.concat.html

  - id: pruefsumme-vergleichen
    type: output
    title: Gleiche Daten, andere Bytes
    prompt: Was gibt das Programm aus?
    lang: python
    code: |
      import hashlib
      from pathlib import Path

      def pruefsumme(pfad: Path) -> str:
          with pfad.open("rb") as datei:
              return hashlib.file_digest(datei, "sha256").hexdigest()

      datei = Path("bestellungen_2026-03.csv")
      datei.write_text("bestellung_id;warenwert\n10231;48,90\n", encoding="utf-8")
      manifest = {datei.name: pruefsumme(datei)}

      datei.write_text("bestellung_id;warenwert\n10231;48,90\n", encoding="utf-8")        # erneut heruntergeladen
      print(pruefsumme(datei) == manifest[datei.name])
      datei.write_bytes("bestellung_id;warenwert\r\n10231;48,90\r\n".encode("utf-8"))    # Windows-Zeilenenden
      print(pruefsumme(datei) == manifest[datei.name])
      datei.write_text("bestellung_id;warenwert\n10231;48,90\n", encoding="utf-8-sig")    # mit BOM
      print(pruefsumme(datei) == manifest[datei.name])
      print(len(manifest[datei.name]))
    expected: |
      True
      False
      False
      64
    explanation: |
      Die Prüfsumme hängt nur an den Bytes. Dieselben Bytes, neu geschrieben, ergeben dieselbe Summe – egal, wie sich die Änderungszeit verschoben hat. Windows-Zeilenenden (`\r\n`) und ein BOM ändern die Bytes und damit die Summe, obwohl die Daten gleich bleiben. Für einen Monatsjob ist das ein harmloser Fehlalarm: Die Datei wird noch einmal verarbeitet, und weil die Verarbeitung idempotent ist, bleibt der Bestand gleich. Ein SHA-256-Wert als Hexadezimaltext ist immer 64 Zeichen lang.
    resources:
      - title: Python · hashlib.file_digest
        url: https://docs.python.org/3/library/hashlib.html#hashlib.file_digest

  - id: manifest-schreiben
    type: gap
    title: Prüfsumme und Manifest
    prompt: |
      Ergänze die beiden Hilfsfunktionen. `pruefsumme` berechnet SHA-256 über die Bytes der Datei. `speichere_manifest` schreibt das Manifest so, dass ein Absturz mitten im Schreiben nie eine halbe `manifest.json` hinterlässt.
    lang: python
    code: |
      import hashlib
      import json
      from pathlib import Path

      def pruefsumme(pfad: Path) -> str:
          with pfad.open(⟦"rb"⟧) as datei:
              return hashlib.⟦file_digest⟧(datei, "sha256").hexdigest()

      def speichere_manifest(pfad: Path, manifest: dict[str, str]) -> None:
          tmp = pfad.with_suffix(".tmp")
          tmp.write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding="utf-8")
          ⟦tmp.replace(pfad)⟧
    gaps:
      - label: Dateimodus
        hint: Eine Prüfsumme wird über Bytes berechnet, nicht über Text.
      - label: Funktion aus hashlib
        hint: Seit Python 3.11 berechnet eine Funktion den Hash direkt aus einem Dateiobjekt.
      - label: Atomar ersetzen
        hint: Die temporäre Datei soll die alte ersetzen – mit einer Methode von `Path` oder einer Funktion aus `os`.
        accept: ["os.replace(tmp, pfad)"]
    explanation: |
      `"rb"` öffnet die Datei binär; eine Prüfsumme über dekodierten Text würde von Encoding und Zeilenenden abhängen. `hashlib.file_digest` liest die Datei in Blöcken und liefert ein Hash-Objekt, `hexdigest()` den Text für das Manifest. `tmp.replace(pfad)` entspricht `os.replace`: Innerhalb eines Dateisystems ersetzt es die Zieldatei atomar – wer sie liest, sieht entweder das alte oder das neue Manifest. `sort_keys=True` sorgt für eine stabile Reihenfolge, sodass ein Diff nur echte Änderungen zeigt. Unter Linux und macOS ersetzt auch `rename` atomar; unter Windows scheitert es, wenn das Ziel schon existiert, deshalb ist `replace` die portable Wahl.
    resources:
      - title: Python · hashlib.file_digest
        url: https://docs.python.org/3/library/hashlib.html#hashlib.file_digest
      - title: Python · os.replace
        url: https://docs.python.org/3/library/os.html#os.replace

  - id: trockenlauf-schalter
    type: gap
    title: Ein Schalter für den Trockenlauf
    prompt: |
      Ergänze den Anfang von `main`. `--dry-run` ist ein Schalter ohne Wert. Das Protokoll soll Meldungen ab der Stufe INFO in die Datei schreiben. Im Trockenlauf wird nur der Plan protokolliert.
    lang: python
    code: |
      def main(argv: list[str]) -> int:
          parser = argparse.ArgumentParser(prog="monatsbericht")
          parser.add_argument("--monat", required=True, help="Berichtsmonat JJJJ-MM")
          parser.add_argument("--dry-run", action=⟦"store_true"⟧, help="nur anzeigen, nichts schreiben")
          args = parser.parse_args(argv)
          logging.basicConfig(filename="logs/monatsbericht.log", encoding="utf-8", level=⟦logging.INFO⟧,
                              format="%(asctime)s %(levelname)s %(message)s")
          plan = plane(EINGANG, lade_manifest(MANIFEST))
          log.info("Monat %s: neu=%s geaendert=%s", args.monat, plan["neu"], plan["geaendert"])
          if ⟦args.dry_run⟧:
              return 0
    gaps:
      - label: Schalter ohne Wert
        hint: Die Aktion speichert `True`, wenn die Option angegeben ist.
      - label: Protokollstufe
        hint: Die Stufe für normale Ablaufmeldungen, als Konstante aus `logging`.
        accept: ['"INFO"', "20"]
      - label: Wert des Schalters
        hint: argparse macht aus Bindestrichen im Optionsnamen Unterstriche.
    explanation: |
      `action="store_true"` macht aus `--dry-run` einen Schalter: angegeben `True`, sonst `False`. argparse legt das Attribut als `args.dry_run` an, weil Bindestriche in Attributnamen nicht erlaubt sind. `level=logging.INFO` (gleichwertig `"INFO"` oder `20`) lässt INFO, WARNING, ERROR und CRITICAL ins Protokoll, DEBUG nicht. Der Trockenlauf protokolliert den Plan und endet, bevor irgendetwas geschrieben wird – so lässt sich ein neuer Monat gefahrlos ansehen.
    resources:
      - title: Python · argparse (action)
        url: https://docs.python.org/3/library/argparse.html#action
      - title: Python · logging.basicConfig
        url: https://docs.python.org/3/library/logging.html#logging.basicConfig

  - id: neue-dateien-erkennen
    type: code
    title: Was ist neu im Eingangsordner?
    prompt: |
      Schreibe `plane(eingang: Path, manifest: dict[str, str]) -> dict[str, list[str]]`.

      - Berücksichtigt werden nur Dateien direkt in `eingang`, deren Name **genau** dem Muster `bestellungen_JJJJ-MM.csv` entspricht, etwa `bestellungen_2026-03.csv`. Alles andere wird ignoriert.
      - `"neu"`: Name steht nicht im Manifest. `"geaendert"`: Name steht im Manifest, aber die SHA-256-Prüfsumme des Inhalts weicht ab. `"unveraendert"`: Prüfsumme stimmt.
      - `"fehlend"`: Namen aus dem Manifest, zu denen es keine Datei mehr gibt – ein Monat ist aus dem Ordner verschwunden.
      - Jede Liste ist alphabetisch sortiert. Die Funktion verändert keine Dateien.

      `pruefsumme(pfad)` ist schon vorhanden. Im Ordner `eingang` liegen: `bestellungen_2026-01.csv`, `bestellungen_2026-02.csv`, `bestellungen_2026-03.csv`, `bestellungen_2026-03 (1).csv`, `bestellungen_2026-4.csv`, `notizen.txt` und ein Unterordner `archiv`.
    lang: python
    setup: |
      from pathlib import Path
      eingang = Path("eingang")
      (eingang / "archiv").mkdir(parents=True)
      kopf = "bestellung_id;kunde_id;bestelldatum;kanal;status;warenwert\n"
      inhalte = {
          "bestellungen_2026-01.csv": "10001;17;05.01.2026;Shop;bezahlt;48,90\n",
          "bestellungen_2026-02.csv": "10003;8;02.02.2026;Shop;storniert;21,50\n",
          "bestellungen_2026-03.csv": "10231;23;02.03.2026;B2B;bezahlt;1.240,00\n",
          "bestellungen_2026-03 (1).csv": "10231;23;02.03.2026;B2B;bezahlt;1.240,00\n",
          "bestellungen_2026-4.csv": "10301;41;01.04.2026;Shop;bezahlt;19,90\n",
          "archiv/bestellungen_2025-12.csv": "9990;17;15.12.2025;Shop;bezahlt;30,00\n",
      }
      for name, zeilen in inhalte.items():
          (eingang / name).write_text(kopf + zeilen, encoding="utf-8")
      (eingang / "notizen.txt").write_text("Rückfragen an den Shop\n", encoding="utf-8")
    starter: |
      import hashlib
      from pathlib import Path

      def pruefsumme(pfad: Path) -> str:
          with pfad.open("rb") as datei:
              return hashlib.file_digest(datei, "sha256").hexdigest()

      def plane(eingang: Path, manifest: dict[str, str]) -> dict[str, list[str]]:
          plan = {"neu": [], "geaendert": [], "unveraendert": [], "fehlend": []}
          for pfad in eingang.glob("*.csv"):
              plan["neu"].append(pfad.name)
          return plan
    solution: |
      import hashlib
      import re
      from pathlib import Path

      MUSTER = re.compile(r"bestellungen_\d{4}-\d{2}\.csv")

      def pruefsumme(pfad: Path) -> str:
          with pfad.open("rb") as datei:
              return hashlib.file_digest(datei, "sha256").hexdigest()

      def plane(eingang: Path, manifest: dict[str, str]) -> dict[str, list[str]]:
          plan = {"neu": [], "geaendert": [], "unveraendert": [], "fehlend": []}
          vorhanden = set()
          for pfad in sorted(eingang.iterdir()):
              if not pfad.is_file() or not MUSTER.fullmatch(pfad.name):
                  continue
              vorhanden.add(pfad.name)
              if pfad.name not in manifest:
                  plan["neu"].append(pfad.name)
              elif manifest[pfad.name] != pruefsumme(pfad):
                  plan["geaendert"].append(pfad.name)
              else:
                  plan["unveraendert"].append(pfad.name)
          plan["fehlend"] = sorted(set(manifest) - vorhanden)
          return plan
    tests:
      - name: Leeres Manifest – alle gültigen Dateien sind neu
        code: |
          plan = plane(Path("eingang"), {})
          assert plan["neu"] == ["bestellungen_2026-01.csv", "bestellungen_2026-02.csv", "bestellungen_2026-03.csv"], f"neu ist {plan['neu']!r}"
          assert plan["geaendert"] == [] and plan["unveraendert"] == [] and plan["fehlend"] == [], f"bekommen: {plan!r}"
      - name: Doppelte Downloads, falsche Namen und Unterordner werden ignoriert
        code: |
          plan = plane(Path("eingang"), {})
          alle = [name for namen in plan.values() for name in namen]
          for fremd in ["bestellungen_2026-03 (1).csv", "bestellungen_2026-4.csv", "notizen.txt", "archiv", "bestellungen_2025-12.csv"]:
              assert fremd not in alle, f"{fremd} gehört in keine Liste – nur Namen wie bestellungen_2026-03.csv direkt im Ordner zählen"
      - name: Unveränderte und geänderte Dateien
        code: |
          januar = Path("eingang/bestellungen_2026-01.csv")
          manifest = {"bestellungen_2026-01.csv": pruefsumme(januar), "bestellungen_2026-02.csv": "0" * 64}
          plan = plane(Path("eingang"), manifest)
          assert plan["unveraendert"] == ["bestellungen_2026-01.csv"], f"unveraendert ist {plan['unveraendert']!r}"
          assert plan["geaendert"] == ["bestellungen_2026-02.csv"], f"geaendert ist {plan['geaendert']!r} – vergleiche die SHA-256-Prüfsumme"
          assert plan["neu"] == ["bestellungen_2026-03.csv"], f"neu ist {plan['neu']!r}"
      - name: Verschwundene Monate werden gemeldet
        code: |
          manifest = {"bestellungen_2025-11.csv": "a" * 64, "bestellungen_2025-10.csv": "b" * 64}
          plan = plane(Path("eingang"), manifest)
          assert plan["fehlend"] == ["bestellungen_2025-10.csv", "bestellungen_2025-11.csv"], f"fehlend ist {plan['fehlend']!r}"
      - name: Leerer Ordner, keine Nebenwirkungen
        code: |
          vorher = sorted(p.name for p in Path("eingang").iterdir())
          Path("leer").mkdir(exist_ok=True)
          plan = plane(Path("leer"), {})
          assert plan == {"neu": [], "geaendert": [], "unveraendert": [], "fehlend": []}, f"bekommen: {plan!r}"
          assert sorted(p.name for p in Path("eingang").iterdir()) == vorher, "plane darf keine Dateien anlegen, verschieben oder löschen"
    hints:
      - Ein regulärer Ausdruck mit `fullmatch` prüft den ganzen Namen, `glob("*.csv")` lässt zu viel durch.
      - "`sorted(eingang.iterdir())` liefert eine feste Reihenfolge; Unterordner erkennst du mit `pfad.is_file()`."
      - "Für `fehlend`: Mengen helfen – `set(manifest) - vorhanden`."
    explanation: |
      Das Namensmuster ist der Vertrag mit dem Exportsystem: `bestellungen_\d{4}-\d{2}\.csv` mit `fullmatch` lässt weder doppelte Downloads noch Tippfehler wie `2026-4` durch, und `iterdir` schaut nicht in Unterordner. Die Prüfsumme vergleicht den Inhalt statt der Änderungszeit, deshalb erkennt der Plan einen korrigierten Export auch dann, wenn Name und Größe gleich bleiben. `fehlend` ist die Gegenrichtung: Verschwindet ein Monat aus dem Ordner, würde ein Neuaufbau ihn stillschweigend aus dem Bestand entfernen – das soll ein Mensch vorher sehen. Weil `plane` nichts verändert, ist sie zugleich der Trockenlauf.
    resources:
      - title: Python · pathlib.Path.iterdir
        url: https://docs.python.org/3/library/pathlib.html#pathlib.Path.iterdir
      - title: Python · re.fullmatch
        url: https://docs.python.org/3/library/re.html#re.fullmatch

  - id: monat-laden
    type: code
    title: Ein Shop-Export, sauber geladen
    prompt: |
      Schreibe `lade_monat(pfad: Path) -> pd.DataFrame` für einen Shop-Export von Bohnenwerk. Die Datei ist UTF-8 mit BOM, Trennzeichen `;`, Dezimalkomma, Tausenderpunkt, Datum `TT.MM.JJJJ`. Manche Exporte enden mit einer Summenzeile, deren `bestellung_id` `Summe` lautet, und in `kanal` stehen gelegentlich Leerzeichen am Rand.

      Ergebnis:

      - keine Summenzeile;
      - `bestellung_id` und `kunde_id` als Ganzzahlen, `bestelldatum` als Datum (`datetime64`), `warenwert` als Kommazahl;
      - `kanal` ohne Leerzeichen am Rand;
      - eine zusätzliche Spalte `quelle` mit dem Dateinamen.

      Im Arbeitsverzeichnis liegen `bestellungen_2026-03.csv` (mit Summenzeile) und `bestellungen_2026-04.csv` (ohne).
    lang: python
    setup: |
      from pathlib import Path
      kopf = "bestellung_id;kunde_id;bestelldatum;kanal;status;warenwert\n"
      Path("bestellungen_2026-03.csv").write_text(
          kopf
          + "10231;17;02.03.2026;Shop ;bezahlt;48,90\n"
          + "10232;23;02.03.2026;B2B;bezahlt;1.240,00\n"
          + "10233;8;14.03.2026; Shop;storniert;21,50\n"
          + "10234;41;31.03.2026;Shop;bezahlt;64,20\n"
          + "Summe;;;;;1.374,60\n",
          encoding="utf-8-sig")
      Path("bestellungen_2026-04.csv").write_text(
          kopf + "10301;17;01.04.2026;Shop;bezahlt;19,90\n", encoding="utf-8-sig")
    starter: |
      from pathlib import Path
      import pandas as pd

      def lade_monat(pfad: Path) -> pd.DataFrame:
          return pd.read_csv(pfad, sep=";")
    solution: |
      from pathlib import Path
      import pandas as pd

      def lade_monat(pfad: Path) -> pd.DataFrame:
          df = pd.read_csv(pfad, sep=";", decimal=",", thousands=".", encoding="utf-8-sig",
                           dtype={"bestellung_id": "str"},
                           parse_dates=["bestelldatum"], date_format="%d.%m.%Y")
          df = df[df["bestellung_id"] != "Summe"]
          return df.astype({"bestellung_id": "int64", "kunde_id": "int64"}).assign(
              kanal=df["kanal"].str.strip(),
              quelle=pfad.name,
          ).reset_index(drop=True)
    tests:
      - name: Summenzeile entfernt, IDs als Ganzzahl
        code: |
          df = lade_monat(Path("bestellungen_2026-03.csv"))
          assert len(df) == 4, f"erwartet 4 Bestellungen, bekommen {len(df)} – ist die Summenzeile noch drin?"
          assert pd.api.types.is_integer_dtype(df["bestellung_id"]), f"bestellung_id hat den Typ {df['bestellung_id'].dtype}"
          assert pd.api.types.is_integer_dtype(df["kunde_id"]), f"kunde_id hat den Typ {df['kunde_id'].dtype}"
          assert df["bestellung_id"].tolist() == [10231, 10232, 10233, 10234], f"bestellung_id: {df['bestellung_id'].tolist()!r}"
      - name: Beträge mit Dezimalkomma und Tausenderpunkt
        code: |
          df = lade_monat(Path("bestellungen_2026-03.csv"))
          werte = [round(float(w), 2) for w in df["warenwert"]]
          assert werte == [48.9, 1240.0, 21.5, 64.2], f"warenwert: {werte!r}"
      - name: Datum als Datum, nicht als Zahl
        code: |
          df = lade_monat(Path("bestellungen_2026-03.csv"))
          assert pd.api.types.is_datetime64_any_dtype(df["bestelldatum"]), f"bestelldatum hat den Typ {df['bestelldatum'].dtype} – Vorsicht mit thousands='.'"
          assert df["bestelldatum"].dt.day.tolist() == [2, 2, 14, 31], f"Tage: {df['bestelldatum'].dt.day.tolist()!r}"
          assert set(df["bestelldatum"].dt.month) == {3}, "alle Bestellungen stammen aus dem März"
      - name: Kanal bereinigt, Herkunft vermerkt
        code: |
          df = lade_monat(Path("bestellungen_2026-03.csv"))
          assert df["kanal"].tolist() == ["Shop", "B2B", "Shop", "Shop"], f"kanal: {df['kanal'].tolist()!r}"
          assert df["quelle"].tolist() == ["bestellungen_2026-03.csv"] * 4, f"quelle: {df['quelle'].tolist()!r}"
      - name: Export ohne Summenzeile
        code: |
          df = lade_monat(Path("bestellungen_2026-04.csv"))
          assert len(df) == 1 and df["bestellung_id"].tolist() == [10301], f"bekommen: {df.to_dict('records')!r}"
          assert df["quelle"].tolist() == ["bestellungen_2026-04.csv"]
    hints:
      - "`read_csv` kennt `sep`, `decimal`, `thousands` und `encoding`. `utf-8-sig` entfernt das BOM."
      - "Mit `thousands=\".\"` wird ein Datum wie `02.03.2026` zur Zahl, wenn du es nicht ausdrücklich als Datum liest: `parse_dates=[…]` und `date_format=\"%d.%m.%Y\"`."
      - Lies `bestellung_id` zuerst als Text, filtere `Summe` heraus und wandle danach mit `astype` in `int64` um.
    explanation: |
      Die Summenzeile macht `bestellung_id` zu einer Textspalte und `kunde_id` wegen der leeren Zelle zu einer Kommazahl. Deshalb liest die Lösung die ID zuerst als Text, entfernt die Summenzeile über eine Bedingung und wandelt erst danach in Ganzzahlen um. `parse_dates` mit `date_format` schützt das Datum vor `thousands="."`, das sonst `02.03.2026` in 2032026 verwandeln würde. `str.strip()` vereinheitlicht `"Shop "` und `" Shop"`, sonst zählt eine Gruppierung nach Kanal vier statt zwei Kanäle. `quelle` hält fest, aus welcher Datei jede Zeile stammt – beim Zusammenführen vieler Monate die wichtigste Spur, wenn eine Zahl nicht stimmt.
    resources:
      - title: pandas · read_csv
        url: https://pandas.pydata.org/docs/reference/api/pandas.read_csv.html
      - title: pandas · DataFrame.astype
        url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.astype.html

  - id: idempotent-zusammenfuehren
    type: code
    title: Repariere den Monatsimport, der doppelt zählt
    prompt: |
      `aktualisiere_bestand(eingang: Path, bestand: Path) -> int` soll die Monatsdateien aus `eingang` zu einem Bestand zusammenführen, ihn als CSV (Komma als Trennzeichen, ohne Index) nach `bestand` schreiben und die Zahl der Bestellungen im Bestand zurückgeben. Der Startcode hängt bei jedem Lauf an – nach dem zweiten Lauf ist jeder Umsatz doppelt. Repariere die Funktion:

      - Nur Dateien, deren Name genau `bestellungen_JJJJ-MM.csv` lautet. Sie haben die Spalten `bestellung_id;status;warenwert` mit Dezimalkomma.
      - Ein zweiter Lauf mit denselben Dateien erzeugt exakt denselben Bestand.
      - Kommt eine `bestellung_id` in mehreren Monaten vor (Statusänderung), gilt die Zeile aus dem jüngsten Monat.
      - Der Bestand ist nach `bestellung_id` sortiert.
      - Gibt es keine einzige Monatsdatei, wirf einen `ValueError` und lass `bestand` unangetastet.
    lang: python
    setup: |
      from pathlib import Path
      eingang = Path("eingang")
      eingang.mkdir()
      kopf = "bestellung_id;status;warenwert\n"
      (eingang / "bestellungen_2026-02.csv").write_text(kopf + "10003;storniert;21,50\n10004;bezahlt;64,20\n", encoding="utf-8")
      (eingang / "bestellungen_2026-03.csv").write_text(kopf + "10231;bezahlt;48,90\n10232;bezahlt;1240,00\n", encoding="utf-8")
      (eingang / "bestellungen_2026-03 (1).csv").write_text(kopf + "10231;bezahlt;48,90\n99999;bezahlt;1,00\n", encoding="utf-8")
    starter: |
      from pathlib import Path
      import pandas as pd

      def aktualisiere_bestand(eingang: Path, bestand: Path) -> int:
          for pfad in eingang.glob("bestellungen_*.csv"):
              monat = pd.read_csv(pfad, sep=";", decimal=",")
              monat.to_csv(bestand, mode="a", header=not bestand.exists(), index=False)
          return len(pd.read_csv(bestand))
    solution: |
      import re
      from pathlib import Path
      import pandas as pd

      MUSTER = re.compile(r"bestellungen_\d{4}-\d{2}\.csv")

      def aktualisiere_bestand(eingang: Path, bestand: Path) -> int:
          dateien = sorted(p for p in eingang.iterdir() if MUSTER.fullmatch(p.name))
          if not dateien:
              raise ValueError(f"keine Monatsdateien in {eingang}")
          teile = [pd.read_csv(p, sep=";", decimal=",") for p in dateien]
          gesamt = (pd.concat(teile, ignore_index=True)
                      .drop_duplicates(subset="bestellung_id", keep="last")
                      .sort_values("bestellung_id"))
          tmp = bestand.with_name(bestand.name + ".tmp")
          gesamt.to_csv(tmp, index=False)
          tmp.replace(bestand)
          return len(gesamt)
    tests:
      - name: Erster Lauf
        code: |
          n = aktualisiere_bestand(Path("eingang"), Path("bestand.csv"))
          ids = pd.read_csv("bestand.csv")["bestellung_id"].tolist()
          assert ids == [10003, 10004, 10231, 10232], f"Bestand enthält {ids!r}"
          assert n == 4, f"Rückgabe {n!r}, erwartet 4"
      - name: Zweiter Lauf ändert nichts
        code: |
          vorher = Path("bestand.csv").read_text(encoding="utf-8")
          n = aktualisiere_bestand(Path("eingang"), Path("bestand.csv"))
          assert n == 4, f"nach dem zweiten Lauf {n} Bestellungen – der Import zählt doppelt"
          assert Path("bestand.csv").read_text(encoding="utf-8") == vorher, "der zweite Lauf hat bestand.csv verändert"
      - name: Doppelter Download fließt nicht ein
        code: |
          ids = pd.read_csv("bestand.csv")["bestellung_id"].tolist()
          assert 99999 not in ids, "bestellungen_2026-03 (1).csv ist kein gültiger Monatsexport"
      - name: Neuer Monat mit Statusänderung
        code: |
          Path("eingang/bestellungen_2026-04.csv").write_text(
              "bestellung_id;status;warenwert\n10232;retourniert;1240,00\n10301;bezahlt;19,90\n", encoding="utf-8")
          n = aktualisiere_bestand(Path("eingang"), Path("bestand.csv"))
          df = pd.read_csv("bestand.csv")
          assert n == 5 and len(df) == 5, f"erwartet 5 Bestellungen, bekommen {len(df)}"
          status = df.set_index("bestellung_id")["status"].to_dict()
          assert status[10232] == "retourniert", f"10232 hat Status {status[10232]!r} – der jüngste Monat muss gewinnen"
          assert df["bestellung_id"].tolist() == sorted(df["bestellung_id"]), "Bestand ist nicht nach bestellung_id sortiert"
      - name: Leerer Ordner
        code: |
          Path("leer").mkdir(exist_ok=True)
          try:
              aktualisiere_bestand(Path("leer"), Path("leer_bestand.csv"))
          except ValueError:
              pass
          else:
              raise AssertionError("ohne Monatsdatei wird ein ValueError erwartet")
          assert not Path("leer_bestand.csv").exists(), "ohne Monatsdatei darf kein Bestand entstehen"
    hints:
      - Statt anzuhängen, baue den Bestand bei jedem Lauf aus allen Monatsdateien neu auf und überschreibe die Datei.
      - "`drop_duplicates(subset=\"bestellung_id\", keep=\"last\")` behält die zuletzt gelesene Zeile – lies die Dateien deshalb sortiert, ältester Monat zuerst."
      - "Den Dateinamen prüfst du mit `re.compile(r\"bestellungen_\\d{4}-\\d{2}\\.csv\").fullmatch(name)`."
    explanation: |
      Der Startcode beschreibt eine Aktion („hänge an“) und ist deshalb nicht idempotent; außerdem lässt `glob("bestellungen_*.csv")` den doppelten Download durch. Die Lösung beschreibt den Zielzustand: Bei jedem Lauf entsteht der Bestand vollständig neu aus den gültigen Rohdateien, jede Bestellung genau einmal, im Stand des jüngsten Monats. Dafür müssen die Dateien sortiert gelesen werden – `iterdir` garantiert keine Reihenfolge, und `keep="last"` nimmt die zuletzt gelesene Zeile. Das Schreiben über eine temporäre Datei mit `replace` sorgt dafür, dass ein Abbruch nie einen halben Bestand hinterlässt.
    resources:
      - title: pandas · DataFrame.drop_duplicates
        url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.drop_duplicates.html
      - title: Python · pathlib.Path.glob
        url: https://docs.python.org/3/library/pathlib.html#pathlib.Path.glob

  - id: kennzahlen-bericht
    type: code
    title: Vier Zeilen für die Geschäftsführung
    prompt: |
      Schreibe `bericht(df: pd.DataFrame, monat: str) -> str`. `df` hat die Spalten `monat` (Text `JJJJ-MM`), `status` und `warenwert`. Gib genau vier Zeilen zurück, verbunden mit `\n`, ohne Zeilenumbruch am Ende:

      ```text
      Monatsbericht 2026-03
      Warenwert bezahlt: 1.466,60 EUR (+13,8 % zum Vormonat)
      Bezahlte Bestellungen: 3
      Stornoquote: 25,0 %
      ```

      - **Warenwert bezahlt:** Summe von `warenwert` über `status == "bezahlt"` im Monat; deutsches Format mit Tausenderpunkt und zwei Nachkommastellen.
      - **Vergleich:** Veränderung zum Warenwert bezahlt des Kalender-Vormonats (für `2026-01` ist das `2025-12`) in Prozent, eine Nachkommastelle, immer mit Vorzeichen. Ist der Vormonatswert 0 oder gibt es ihn nicht, steht dort `(kein Vormonat)`.
      - **Stornoquote:** Anteil der Bestellungen mit `status == "storniert"` an allen Bestellungen des Monats, eine Nachkommastelle. Hat der Monat keine Bestellungen, steht dort `–` (Gedankenstrich).
    lang: python
    setup: |
      import pandas as pd
      daten = pd.DataFrame({
          "monat":     ["2026-02"] * 3 + ["2026-03"] * 4,
          "status":    ["bezahlt", "bezahlt", "storniert", "bezahlt", "bezahlt", "storniert", "bezahlt"],
          "warenwert": [48.90, 1240.00, 21.50, 64.20, 1310.00, 17.80, 92.40],
      })
    starter: |
      import pandas as pd

      def bericht(df: pd.DataFrame, monat: str) -> str:
          m = df[df["monat"] == monat]
          umsatz = m["warenwert"].sum()
          return f"Monatsbericht {monat}\nWarenwert bezahlt: {umsatz:.2f} EUR"
    solution: |
      import pandas as pd

      def zahl(wert: float, stellen: int = 2, vorzeichen: bool = False) -> str:
          text = f"{wert:{'+' if vorzeichen else ''},.{stellen}f}"
          return text.translate(str.maketrans(",.", ".,"))

      def bericht(df: pd.DataFrame, monat: str) -> str:
          vormonat = str(pd.Period(monat, freq="M") - 1)

          def bezahlt(m: str) -> float:
              auswahl = df[(df["monat"] == m) & (df["status"] == "bezahlt")]
              return float(auswahl["warenwert"].sum())

          diesen = df[df["monat"] == monat]
          umsatz, umsatz_vorher = bezahlt(monat), bezahlt(vormonat)
          anzahl = int((diesen["status"] == "bezahlt").sum())
          if umsatz_vorher:
              vergleich = f"{zahl((umsatz / umsatz_vorher - 1) * 100, 1, True)} % zum Vormonat"
          else:
              vergleich = "kein Vormonat"
          if len(diesen):
              quote = f"{zahl((diesen['status'] == 'storniert').mean() * 100, 1)} %"
          else:
              quote = "–"
          return "\n".join([
              f"Monatsbericht {monat}",
              f"Warenwert bezahlt: {zahl(umsatz)} EUR ({vergleich})",
              f"Bezahlte Bestellungen: {anzahl}",
              f"Stornoquote: {quote}",
          ])
    tests:
      - name: Normalfall März
        code: |
          erwartet = "Monatsbericht 2026-03\nWarenwert bezahlt: 1.466,60 EUR (+13,8 % zum Vormonat)\nBezahlte Bestellungen: 3\nStornoquote: 25,0 %"
          bekommen = bericht(daten, "2026-03")
          assert bekommen == erwartet, f"erwartet:\n{erwartet}\nbekommen:\n{bekommen}"
      - name: Ohne Vormonat
        code: |
          bekommen = bericht(daten, "2026-02").splitlines()
          assert bekommen[1] == "Warenwert bezahlt: 1.288,90 EUR (kein Vormonat)", f"Zeile 2: {bekommen[1]!r}"
          assert bekommen[3] == "Stornoquote: 33,3 %", f"Zeile 4: {bekommen[3]!r}"
      - name: Jahreswechsel und negatives Vorzeichen
        code: |
          jw = pd.DataFrame({"monat": ["2025-12", "2026-01", "2026-01"], "status": ["bezahlt", "bezahlt", "retourniert"], "warenwert": [2500.0, 2250.0, 80.0]})
          bekommen = bericht(jw, "2026-01").splitlines()
          assert bekommen[1] == "Warenwert bezahlt: 2.250,00 EUR (-10,0 % zum Vormonat)", f"Zeile 2: {bekommen[1]!r} – Vormonat von 2026-01 ist 2025-12"
          assert bekommen[3] == "Stornoquote: 0,0 %", f"Zeile 4: {bekommen[3]!r}"
      - name: Große Beträge
        code: |
          gross = pd.DataFrame({"monat": ["2026-06"], "status": ["bezahlt"], "warenwert": [1234567.891]})
          bekommen = bericht(gross, "2026-06").splitlines()
          assert bekommen[1] == "Warenwert bezahlt: 1.234.567,89 EUR (kein Vormonat)", f"Zeile 2: {bekommen[1]!r}"
      - name: Monat ohne Bestellungen
        code: |
          erwartet = "Monatsbericht 2026-04\nWarenwert bezahlt: 0,00 EUR (-100,0 % zum Vormonat)\nBezahlte Bestellungen: 0\nStornoquote: –"
          bekommen = bericht(daten, "2026-04")
          assert bekommen == erwartet, f"erwartet:\n{erwartet}\nbekommen:\n{bekommen}"
    hints:
      - "`f\"{1466.6:,.2f}\"` ergibt `1,466.60`. Tausche danach Komma und Punkt, etwa mit `str.maketrans(\",.\", \".,\")`."
      - "Das Pluszeichen erzwingt das Formatfeld `+`: `f\"{13.787:+.1f}\"` ergibt `+13.8`."
      - "Den Vormonat liefert `pd.Period(\"2026-01\", freq=\"M\") - 1` – als Text `2025-12`."
    explanation: |
      Die Formatierung hängt nicht von den Spracheinstellungen des Rechners ab: Python schreibt mit `,` als Tausender- und `.` als Dezimaltrennzeichen, `translate` tauscht beide in einem Schritt. `pd.Period` rechnet mit Kalendermonaten und erledigt den Jahreswechsel, den ein selbst gebautes `monat - 1` auf Text nicht kann. Die Sonderfälle sind fachliche Entscheidungen: Ohne Vormonatsumsatz gibt es keine sinnvolle prozentuale Veränderung, und ohne Bestellungen keine Quote – eine Division durch null würde `nan` oder einen Fehler liefern. Weil die Funktion einen String zurückgibt und nichts verschickt, lässt sie sich testen; der Versand ist ein eigener Schritt.
    resources:
      - title: Python · Format Specification Mini-Language
        url: https://docs.python.org/3/library/string.html#format-specification-mini-language
      - title: pandas · Period
        url: https://pandas.pydata.org/docs/reference/api/pandas.Period.html

  - id: reihenfolge-der-dateien
    type: bug
    title: Laptop sagt retourniert, Server sagt bezahlt
    prompt: |
      Bestellung 10232 wurde im März bezahlt und im April retourniert; der April-Export enthält sie deshalb noch einmal mit Status `retourniert`. Merle führt `baue_bestand_neu` auf ihrem Laptop aus und sieht `retourniert`. Auf dem Büroserver liefert dieselbe Funktion mit demselben Ordnerinhalt `bezahlt`. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      MUSTER = re.compile(r"bestellungen_\d{4}-\d{2}\.csv")

      def baue_bestand_neu(eingang: Path) -> pd.DataFrame:
          dateien = [p for p in eingang.iterdir() if MUSTER.fullmatch(p.name)]
          teile = [pd.read_csv(p, sep=";", decimal=",") for p in dateien]
          alle = pd.concat(teile, ignore_index=True)
          return alle.drop_duplicates(subset="bestellung_id", keep="last")
    lines: [4]
    fix:
      - line: 4
        answers:
          - "dateien = sorted(p for p in eingang.iterdir() if MUSTER.fullmatch(p.name))"
          - "dateien = sorted([p for p in eingang.iterdir() if MUSTER.fullmatch(p.name)])"
          - "dateien = sorted((p for p in eingang.iterdir() if MUSTER.fullmatch(p.name)), key=lambda p: p.name)"
          - "dateien = sorted([p for p in eingang.iterdir() if MUSTER.fullmatch(p.name)], key=lambda p: p.name)"
    hints:
      - "`keep=\"last\"` nimmt die Zeile, die zuletzt gelesen wurde. Wovon hängt ab, welche das ist?"
      - Die Python-Dokumentation sagt über `iterdir`, dass die Einträge in beliebiger Reihenfolge kommen.
    explanation: |
      `Path.iterdir` liefert die Einträge in beliebiger Reihenfolge; welche das ist, hängt vom Dateisystem ab. Auf dem Laptop kam der April zufällig nach dem März, auf dem Server davor – und `keep="last"` behält die zuletzt gelesene Zeile. Weil die Dateinamen das Datum als `JJJJ-MM` enthalten, sortiert `sorted` sie chronologisch, und der jüngste Monat gewinnt auf jedem Rechner. Solche Fehler fallen in Tests auf einem einzigen Rechner oft nie auf; deshalb gehört jede Reihenfolge, von der ein Ergebnis abhängt, ausdrücklich in den Code.
