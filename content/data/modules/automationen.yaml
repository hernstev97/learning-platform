  - id: monatsjob-erklaeren
    type: explain
    title: Warum man diesen Job zweimal starten darf
    prompt: Eine Kollegin übernimmt den Monatsjob während Merles Urlaub und fragt, ob sie ihn nach einem korrigierten Export einfach noch einmal starten darf und was passiert, wenn er mittendrin abbricht. Erkläre ihr anhand des Codes, welche Entscheidungen den Job sicher machen.
    lang: python
    code: |
      def monatslauf(eingang: Path, arbeit: Path, monat: str, dry_run: bool = False) -> int:
          manifest_pfad = arbeit / "manifest.json"
          manifest = json.loads(manifest_pfad.read_text(encoding="utf-8")) if manifest_pfad.exists() else {}
          dateien = gueltige_dateien(eingang)                 # sortiert, nur bestellungen_JJJJ-MM.csv
          plan = plane(dateien, manifest)
          log.info("Monat %s: neu=%s geaendert=%s", monat, plan["neu"], plan["geaendert"])
          if dry_run or not (plan["neu"] or plan["geaendert"]):
              return 0
          alle = pd.concat([lade_monat(p) for p in dateien], ignore_index=True)
          fehler = pruefe(alle)
          if fehler:
              log.error("Bericht nicht erstellt: %s", "; ".join(fehler))
              return 1
          bestand = alle.drop_duplicates(subset="bestellung_id", keep="last").sort_values("bestellung_id")
          schreibe_atomar(bestand, arbeit / "bestand.csv")
          schreibe_bericht(bestand, monat, arbeit / f"monatsbericht_{monat}.xlsx")
          speichere_manifest(manifest_pfad, {p.name: pruefsumme(p) for p in dateien})
          return 0
    points:
      - Der Bestand wird bei jedem Lauf vollständig aus allen gültigen Rohdateien neu aufgebaut; ein zweiter Lauf erzeugt denselben Bestand, nichts wird doppelt angehängt.
      - Das Manifest entscheidet nur, ob sich ein Lauf lohnt; ein korrigierter Export ändert die Prüfsumme und löst einen neuen Lauf aus.
      - Geprüft wird vor jedem Schreiben; bei Fehlern entsteht kein Bericht, der Job endet mit Exit-Code 1 und protokolliert den Grund.
      - Bestand und Bericht werden atomar ersetzt, der Bericht heißt nach dem Berichtsmonat – eine Wiederholung überschreibt dieselben Dateien.
      - Das Manifest wird zuletzt gespeichert; bricht der Lauf vorher ab, gelten die Dateien beim nächsten Lauf weiter als neu oder geändert, und nichts geht verloren.
    explanation: |
      Ja, sie darf ihn jederzeit neu starten. Der Job hängt nichts an: Er liest bei jedem Lauf alle gültigen Monatsdateien – sortiert, damit der jüngste Stand gewinnt – und baut den Bestand komplett neu. Das Manifest mit den Prüfsummen sagt nur, ob sich seit dem letzten Lauf etwas geändert hat; ein korrigierter Export hat eine andere Prüfsumme und löst deshalb einen neuen Lauf aus. Bevor irgendetwas geschrieben wird, prüft der Job die Daten. Findet er Fehler, schreibt er keinen Bericht, protokolliert den Grund und endet mit Exit-Code 1, damit der Zeitplaner oder die Fehlermail anschlägt. Bestand und Bericht werden über temporäre Dateien atomar ersetzt, und der Bericht heißt nach dem Berichtsmonat, also überschreibt eine Wiederholung dieselbe Datei. Das Manifest kommt ganz zum Schluss: Bricht der Lauf vorher ab, sieht der nächste Lauf dieselben Dateien wieder als neu oder geändert und holt alles nach. Mit `dry_run=True` sieht sie vorher, was passieren würde.
    resources:
      - title: Python · os.replace
        url: https://docs.python.org/3/library/os.html#os.replace

  - id: monatsjob-lokal
    type: practice
    title: Der Monatsjob als echtes Werkzeug
    prompt: |
      Baue den Monatsjob von Bohnenwerk lokal als Kommandozeilenprogramm und plane ihn ein.

      1. Lege ein Projekt an (`uv init monatsbericht`, dann `uv add pandas openpyxl`) mit den Ordnern `eingang`, `arbeit` und einem Skript `monatsbericht.py`.
      2. Das Skript nimmt `--eingang`, `--arbeit`, `--monat JJJJ-MM` und `--dry-run` entgegen und protokolliert nach `arbeit/monatsbericht.log` und auf die Konsole.
      3. Es verarbeitet nur Dateien `bestellungen_JJJJ-MM.csv` in sortierter Reihenfolge, protokolliert ignorierte Dateien als Warnung und führt ein Manifest mit SHA-256-Prüfsummen. Fehlt eine Datei, die schon verarbeitet wurde, bricht es ab.
      4. Es baut den Bestand vollständig neu auf, prüft ihn (Beträge lesbar, bekannter Status, keine doppelte `bestellung_id` innerhalb einer Datei) und bricht bei Fehlern mit Exit-Code 1 ab, ohne etwas zu schreiben.
      5. Es schreibt `bestand.csv`, `monatsbericht_JJJJ-MM.xlsx` mit den Blättern „Kennzahlen“ und „Kanäle“ und `mail_JJJJ-MM.txt` mit den Kennzahlen – alles atomar und zuletzt das Manifest.
      6. Richte einen Zeitplan ein: crontab oder systemd-Timer unter Linux, Aufgabenplanung unter Windows.

      Teste mit drei Monatsdateien wie im Modul, einem doppelten Download und einer Datei mit `n/a` als Warenwert.
    lang: python
    solution: |
      """Monatsbericht Bohnenwerk: Monatsexporte zusammenführen, prüfen, berichten."""
      import argparse
      import hashlib
      import json
      import logging
      import re
      import sys
      from pathlib import Path

      import pandas as pd

      MUSTER = re.compile(r"bestellungen_\d{4}-\d{2}\.csv")
      STATUS = {"bezahlt", "storniert", "retourniert"}
      log = logging.getLogger("monatsbericht")


      def pruefsumme(pfad: Path) -> str:
          with pfad.open("rb") as datei:
              return hashlib.file_digest(datei, "sha256").hexdigest()


      def gueltige_dateien(eingang: Path) -> list[Path]:
          dateien = []
          for pfad in sorted(eingang.iterdir()):
              if pfad.is_file() and MUSTER.fullmatch(pfad.name):
                  dateien.append(pfad)
              else:
                  log.warning("Ignoriert: %s", pfad.name)
          return dateien


      def plane(dateien: list[Path], manifest: dict[str, str]) -> dict[str, list[str]]:
          plan = {"neu": [], "geaendert": [], "fehlend": sorted(set(manifest) - {p.name for p in dateien})}
          for pfad in dateien:
              if pfad.name not in manifest:
                  plan["neu"].append(pfad.name)
              elif manifest[pfad.name] != pruefsumme(pfad):
                  plan["geaendert"].append(pfad.name)
          return plan


      def lade_monat(pfad: Path) -> pd.DataFrame:
          df = pd.read_csv(pfad, sep=";", decimal=",", thousands=".", encoding="utf-8-sig",
                           dtype={"bestellung_id": "str"},
                           parse_dates=["bestelldatum"], date_format="%d.%m.%Y")
          df = df[df["bestellung_id"] != "Summe"]
          log.info("%s: %d Zeilen", pfad.name, len(df))
          return df.astype({"bestellung_id": "int64"}).assign(kanal=df["kanal"].str.strip(), quelle=pfad.name)


      def pruefe(alle: pd.DataFrame) -> list[str]:
          fehler = []
          if not pd.api.types.is_numeric_dtype(alle["warenwert"]) or alle["warenwert"].isna().any():
              fehler.append("warenwert ist nicht in jeder Zeile eine Zahl")
          if alle["bestelldatum"].isna().any():
              fehler.append("bestelldatum fehlt oder ist nicht lesbar")
          unbekannt = set(alle["status"]) - STATUS
          if unbekannt:
              fehler.append(f"unbekannter Status: {sorted(unbekannt)}")
          doppelt = alle[alle.duplicated(subset=["quelle", "bestellung_id"])]
          if len(doppelt):
              fehler.append(f"doppelte bestellung_id in einer Datei: {sorted(set(doppelt['bestellung_id']))}")
          return fehler


      def zahl(wert: float, stellen: int = 2, vorzeichen: bool = False) -> str:
          text = f"{wert:{'+' if vorzeichen else ''},.{stellen}f}"
          return text.translate(str.maketrans(",.", ".,"))


      def schreibe_bericht(bestand: pd.DataFrame, monat: str, arbeit: Path) -> None:
          m = bestand[bestand["bestelldatum"].dt.strftime("%Y-%m") == monat]
          bezahlt = m[m["status"] == "bezahlt"]
          quote = (m["status"] == "storniert").mean() if len(m) else float("nan")
          kennzahlen = pd.DataFrame({
              "kennzahl": ["Warenwert bezahlt (EUR)", "Bezahlte Bestellungen", "Stornoquote"],
              "wert": [round(bezahlt["warenwert"].sum(), 2), len(bezahlt), round(quote, 4)],
          })
          je_kanal = bezahlt.groupby("kanal", as_index=False)["warenwert"].sum()
          ziel = arbeit / f"monatsbericht_{monat}.xlsx"
          tmp = ziel.with_name(ziel.name + ".tmp")
          with pd.ExcelWriter(tmp, engine="openpyxl") as writer:
              kennzahlen.to_excel(writer, sheet_name="Kennzahlen", index=False)
              je_kanal.to_excel(writer, sheet_name="Kanäle", index=False)
          tmp.replace(ziel)
          text = "\n".join([
              f"Monatsbericht {monat}",
              f"Warenwert bezahlt: {zahl(bezahlt['warenwert'].sum())} EUR",
              f"Bezahlte Bestellungen: {len(bezahlt)}",
              f"Stornoquote: {zahl(quote * 100, 1) + ' %' if len(m) else '–'}",
          ])
          schreibe_text(arbeit / f"mail_{monat}.txt", text + "\n")


      def schreibe_text(ziel: Path, inhalt: str) -> None:
          tmp = ziel.with_name(ziel.name + ".tmp")
          tmp.write_text(inhalt, encoding="utf-8")
          tmp.replace(ziel)


      def main(argv: list[str] | None = None) -> int:
          parser = argparse.ArgumentParser(prog="monatsbericht", description="Monatsbericht Bohnenwerk")
          parser.add_argument("--eingang", type=Path, required=True)
          parser.add_argument("--arbeit", type=Path, required=True)
          parser.add_argument("--monat", required=True, help="Berichtsmonat JJJJ-MM")
          parser.add_argument("--dry-run", action="store_true", help="nur anzeigen, nichts schreiben")
          args = parser.parse_args(argv)
          args.arbeit.mkdir(parents=True, exist_ok=True)
          logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s",
                              handlers=[logging.FileHandler(args.arbeit / "monatsbericht.log", encoding="utf-8"),
                                        logging.StreamHandler()])

          manifest_pfad = args.arbeit / "manifest.json"
          manifest = json.loads(manifest_pfad.read_text(encoding="utf-8")) if manifest_pfad.exists() else {}
          dateien = gueltige_dateien(args.eingang)
          plan = plane(dateien, manifest)
          log.info("Monat %s: neu=%s geaendert=%s fehlend=%s", args.monat, plan["neu"], plan["geaendert"], plan["fehlend"])
          for name in plan["geaendert"]:
              log.warning("Bereits verarbeitete Datei hat sich geändert: %s", name)
          if plan["fehlend"]:
              # Ein Neuaufbau ohne diese Dateien würde ihre Monate still aus dem Bestand löschen.
              log.error("Bereits verarbeitete Monatsdateien fehlen: %s", ", ".join(plan["fehlend"]))
              return 1
          if args.dry_run:
              log.info("Trockenlauf: nichts geschrieben")
              return 0
          if not dateien:
              log.error("Keine Monatsdateien in %s", args.eingang)
              return 1
          if not (plan["neu"] or plan["geaendert"]):
              log.info("Keine neuen oder geänderten Dateien – nichts zu tun")
              return 0

          alle = pd.concat([lade_monat(p) for p in dateien], ignore_index=True)
          fehler = pruefe(alle)
          if fehler:
              for meldung in fehler:
                  log.error(meldung)
              log.error("Bericht nicht erstellt")
              return 1
          bestand = alle.drop_duplicates(subset="bestellung_id", keep="last").sort_values("bestellung_id")
          tmp = args.arbeit / "bestand.csv.tmp"
          bestand.to_csv(tmp, index=False)
          tmp.replace(args.arbeit / "bestand.csv")
          schreibe_bericht(bestand, args.monat, args.arbeit)
          schreibe_text(manifest_pfad, json.dumps({p.name: pruefsumme(p) for p in dateien}, indent=2, sort_keys=True))
          log.info("Fertig: %d Bestellungen im Bestand", len(bestand))
          return 0


      if __name__ == "__main__":
          sys.exit(main())
    checklist:
      - "`uv run monatsbericht.py --eingang eingang --arbeit arbeit --monat 2026-03 --dry-run` protokolliert neue und geänderte Dateien und legt keine Datei außer dem Protokoll an."
      - Ein zweiter Lauf ohne neue Dateien meldet „nichts zu tun“, endet mit Exit-Code 0, und `sha256sum arbeit/bestand.csv` ist unverändert.
      - Eine Datei `bestellungen_2026-03 (1).csv` im Eingang erscheint als Warnung „Ignoriert“ und verändert den Bestand nicht.
      - Verschiebst du eine bereits verarbeitete Monatsdatei aus dem Eingang, nennt das Protokoll sie als fehlend, der Lauf endet mit Exit-Code 1, und `bestand.csv` bleibt unverändert.
      - Eine neue Monatsdatei mit `n/a` als Warenwert führt zu Exit-Code 1 (`echo $?` bzw. `echo %ERRORLEVEL%`), es entsteht kein neuer Bericht, und `manifest.json` bleibt unverändert.
      - Nach dem Korrigieren meldet der nächste Lauf dieselbe Datei weiterhin als neu – das Manifest kennt sie noch nicht – und erzeugt `monatsbericht_JJJJ-MM.xlsx` mit den Blättern „Kennzahlen“ und „Kanäle“.
      - Der Zeitplan ist eingerichtet (`crontab -l`, `systemctl list-timers` oder die Aufgabenplanung zeigt den Eintrag), und ein geplanter Lauf steht im Protokoll.
    hints:
      - Beginne mit `plane` und dem Trockenlauf; erst wenn der Plan stimmt, kommen Laden, Prüfen und Schreiben dazu.
      - Teste Exit-Codes, indem du `main([...])` in einer kleinen Testdatei aufrufst und das Ergebnis mit `assert` prüfst.
    explanation: |
      Die Musterlösung setzt die Entscheidungen des Moduls um: ein Namensvertrag mit sortierter Verarbeitung, ein Manifest mit Prüfsummen, ein Bestand, der bei jedem Lauf vollständig neu entsteht – und deshalb der Abbruch, wenn eine bereits verarbeitete Datei fehlt, sonst verschwände ihr Monat still aus dem Bestand –, Prüfungen vor dem Schreiben, atomare Ausgaben und das Manifest als letzter Schritt. Der Exit-Code ist die Schnittstelle zum Zeitplaner – nur so erfährt cron, systemd oder die Aufgabenplanung, dass etwas schiefging, und nur so kann eine Fehlermail anschlagen. Die Kennzahlen stehen als Werte im Excel-Blatt und als formatierter Text in der Mail-Datei; den Versand selbst übernimmt ein eigener Schritt, wie in [Benachrichtigungen ohne Nachrichtenflut](/automation/benachrichtigungen) beschrieben. Für das Einplanen gelten die Regeln aus [Jobs zeitgesteuert ausführen](/automation/zeitsteuerung), etwa zu verpassten Läufen und Überschneidungen.
    resources:
      - title: uv · Projekte anlegen
        url: https://docs.astral.sh/uv/concepts/projects/init/
      - title: pandas · ExcelWriter
        url: https://pandas.pydata.org/docs/reference/api/pandas.ExcelWriter.html
      - title: schtasks create
        url: https://learn.microsoft.com/de-de/windows-server/administration/windows-commands/schtasks-create
