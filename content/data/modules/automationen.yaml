lesson: |
  Mit Power Query ist der Monatsimport bei Bohnenwerk wiederholbar geworden (siehe [Power Query: Importe wiederholbar machen](/data/power-query)). Aus drei Stunden Kopieren wurden fünf Minuten. Trotzdem muss am zweiten Arbeitstag jemand Excel öffnen, auf **Alle aktualisieren** klicken, die Prüfblätter ansehen und die Kennzahlen in eine Mail an die Geschäftsführung tippen. Ist Merle im Urlaub, kommt der Bericht eine Woche später. Und wenn ein Export korrigiert nachgeliefert wird, weiß niemand genau, ob der verschickte Bericht noch stimmt.

  Dieses Modul schließt den Kreis zur Prozessautomatisierung. Du entscheidest zuerst, welches Werkzeug eine wiederkehrende Aufgabe tragen soll. Dann baust du in Python einen kleinen Monatsjob: Er führt die Exporte aus einem Ordner zusammen, erkennt neue und geänderte Dateien, prüft die Daten, schreibt Bestand und Bericht und protokolliert, was er getan hat. Ein zweiter Lauf richtet keinen Schaden an. Die allgemeinen Grundlagen – Idempotenz, Trockenlauf, Zeitsteuerung, Benachrichtigungen – stehen im Bereich Automation, etwa in [Automatisieren mit Verstand](/automation/automatisieren-denken). Hier geht es um das, was bei Analysen dazukommt: Daten, die sich wiederholen, nachträglich korrigiert werden und am Ende eine Summe ergeben müssen, der die Geschäftsführung glaubt.

  ## Welches Werkzeug für welche Aufgabe?

  Für wiederkehrende Auswertungen gibt es vier naheliegende Werkzeuge. Keines ist immer richtig; entscheidend ist, wo die Daten liegen, wer den Lauf auslöst und ob er ohne Menschen funktionieren muss.

  | | Excel mit Power Query | SQL | Python mit pandas | Office Scripts / VBA |
  | --- | --- | --- | --- | --- |
  | Stärke | Import und Umformung für Menschen, die in Excel arbeiten; Ergebnis direkt als Tabelle oder PivotTable | Große Datenmengen dort filtern, verknüpfen und aggregieren, wo sie liegen | Beliebige Quellen, Prüfungen, Dateien erzeugen und verschieben, Mails, Tests | Die Arbeitsmappe selbst verändern: Blätter, Formate, Schaltflächen |
  | Wer startet den Lauf? | ein Mensch mit **Alle aktualisieren** | Datenbank, BI-Werkzeug oder ein Skript | ein Zeitplaner (cron, systemd, Aufgabenplanung, CI) | ein Mensch per Schaltfläche; Office Scripts auch ein Power Automate-Flow |
  | Läuft ohne geöffnetes Excel | nein | ja | ja | Office Scripts über Power Automate ja, VBA nein |
  | Versionieren und testen | kaum | ja, Abfragen als Dateien | ja, mit Git und Tests | eingeschränkt |
  | Typische Grenze | Aktualisieren braucht Excel und Zugriff auf die Quelle | braucht eine Datenbank | braucht eine gepflegte Laufzeitumgebung | VBA nur auf dem Desktop; Office Scripts können in Power Automate keine Power Query-Abfragen aktualisieren |

  Daraus folgen vier Faustregeln:

  1. **Das Ergebnis lebt in Excel und jemand öffnet die Datei ohnehin?** Power Query. Der Import ist dokumentiert, und niemand muss Python installieren.
  2. **Die Daten liegen in einer Datenbank?** Rechne mit SQL dort, wo sie liegen, etwa als View, und hole nur das Ergebnis nach Excel oder Python.
  3. **Der Lauf soll ohne Menschen stattfinden, Dateien prüfen und erzeugen oder eine Mail schicken?** Python mit einem Zeitplaner.
  4. **Die Arbeitsmappe selbst soll sich verändern** – Blätter anlegen, formatieren, eine Schaltfläche für Kolleginnen? Office Scripts in Excel für das Web oder VBA auf dem Desktop ([Unterschiede zwischen Office-Skripts und VBA-Makros](https://learn.microsoft.com/de-de/office/dev/scripts/resources/vba-differences)).

  Kombinationen sind der Normalfall. Eine SQL-View liefert Monatssummen, Power Query holt sie in die Arbeitsmappe der Geschäftsführung. Ein Python-Job schreibt eine bereinigte CSV in einen Ordner, und eine PivotTable liest sie über Power Query. Die Daten fließen dorthin, wo Menschen arbeiten; die Logik steht dort, wo sie sich prüfen lässt.

  > [!INTERVIEW] „Wann nimmst du Python statt Power Query?“
  > Wenn der Ablauf ohne Menschen laufen soll, wenn er Dateien prüfen, verschieben oder erzeugen muss oder wenn ich ihn versionieren und testen will. Power Query ist stark, solange jemand in Excel arbeitet und auf **Alle aktualisieren** klickt. Sobald der Bericht um sieben Uhr in der Mail liegen soll, brauche ich einen Zeitplaner und damit ein Skript. Oft kombiniere ich beides: Python bereitet die Daten auf, Excel zeigt sie.

  ## Ein Ordner voller Monatsdateien: zusammenführen ohne Doppelzählung

  Der Shop legt jeden Monat eine Datei `bestellungen_JJJJ-MM.csv` in den Ordner `eingang`: Semikolon, Dezimalkomma, Datum als `TT.MM.JJJJ`, UTF-8 mit BOM, manchmal eine Summenzeile. Ein fester Dateiname je Monat ist die erste Automatisierungsentscheidung, denn er macht aus „irgendwelche Dateien“ einen prüfbaren Vertrag. Der Block liest alle gültigen Monatsdateien und merkt sich in `quelle`, woher jede Zeile stammt:

  ```python run
  from pathlib import Path
  import pandas as pd

  eingang = Path("eingang")
  eingang.mkdir()
  kopf = "bestellung_id;kunde_id;bestelldatum;kanal;status;warenwert\n"
  (eingang / "bestellungen_2026-01.csv").write_text(
      kopf + "10001;17;05.01.2026;Shop;bezahlt;48,90\n10002;23;12.01.2026;B2B;bezahlt;1.240,00\n",
      encoding="utf-8-sig")
  (eingang / "bestellungen_2026-02.csv").write_text(
      kopf + "10003;8;02.02.2026;Shop;storniert;21,50\n10004;41;09.02.2026;Shop;bezahlt;64,20\n"
      "Summe;;;;;85,70\n", encoding="utf-8-sig")
  (eingang / "notizen.txt").write_text("Rückfragen an den Shop\n", encoding="utf-8")

  def lade_monat(pfad: Path) -> pd.DataFrame:
      df = pd.read_csv(pfad, sep=";", decimal=",", thousands=".", encoding="utf-8-sig",
                       dtype={"bestellung_id": "str"},
                       parse_dates=["bestelldatum"], date_format="%d.%m.%Y")
      df = df[df["bestellung_id"] != "Summe"]              # Summenzeile per Bedingung entfernen
      return df.astype({"bestellung_id": "int64", "kunde_id": "int64"}).assign(quelle=pfad.name)

  dateien = sorted(eingang.glob("bestellungen_*.csv"))
  alle = pd.concat([lade_monat(p) for p in dateien], ignore_index=True)
  print([p.name for p in dateien])
  print(alle.shape)
  print(alle.groupby("quelle")["warenwert"].sum().to_dict())
  ```

  Das `sorted` ist kein Schmuck. `Path.glob` und `Path.iterdir` liefern Dateien in keiner festgelegten Reihenfolge ([pathlib · Path.glob](https://docs.python.org/3/library/pathlib.html#pathlib.Path.glob)); auf dem Laptop und auf dem Server kann sie verschieden sein. Sobald „der jüngste Stand gewinnt“, hängt das Ergebnis an dieser Reihenfolge.

  > [!WARNING] Tausenderpunkt trifft Datum
  > `thousands="."` gilt für jede Spalte, die pandas als Zahl lesen kann – auch für `02.03.2026`. Ohne `parse_dates` oder `dtype` wird daraus die Ganzzahl 2032026, ohne Fehlermeldung ([pandas · read_csv](https://pandas.pydata.org/docs/reference/api/pandas.read_csv.html)). Lies Datumsspalten deshalb ausdrücklich als Datum oder als Text.

  Jetzt zum eigentlichen Problem. Läuft der Monatsjob zweimal – nach einem Abbruch, weil der Zeitplaner doppelt startet oder weil jemand ihn von Hand noch einmal anstößt –, darf der Bestand nicht wachsen. Eine Operation ist **idempotent**, wenn ein zweiter Lauf denselben Zustand ergibt wie der erste. Für Datenbestände gibt es drei Strategien:

  1. **Vollständig neu aufbauen.** Jeder Lauf liest alle Rohdateien und schreibt den Bestand komplett neu. Idempotent ohne jede Buchführung; für einige hundert Monatsdateien schnell genug. Das ist der Standard, bis er zu langsam wird.
  2. **Upsert über einen fachlichen Schlüssel.** Alter Bestand und neue Zeilen werden vereint, und je `bestellung_id` bleibt die jüngste Zeile ([pandas · drop_duplicates](https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.drop_duplicates.html)). Nötig, wenn Rohdaten nach der Verarbeitung archiviert oder gelöscht werden.
  3. **Inkrementell mit Manifest.** Nur neue Dateien werden verarbeitet und angehängt; ein Manifest merkt sich, was schon drin ist. Am schnellsten, aber am fehleranfälligsten.

  Der Unterschied zwischen Anhängen und Zielzustand in zehn Zeilen:

  ```python run
  from pathlib import Path
  import pandas as pd

  def anhaengen(ziel: Path, neu: pd.DataFrame) -> None:          # Aktion – nicht idempotent
      neu.to_csv(ziel, mode="a", header=not ziel.exists(), index=False)

  def aktualisieren(ziel: Path, neu: pd.DataFrame) -> None:      # Zielzustand – idempotent
      gesamt = pd.concat([pd.read_csv(ziel), neu]) if ziel.exists() else neu
      gesamt = gesamt.drop_duplicates(subset="bestellung_id", keep="last").sort_values("bestellung_id")
      tmp = ziel.with_suffix(".tmp")
      gesamt.to_csv(tmp, index=False)
      tmp.replace(ziel)                                          # erst jetzt wird der Bestand ersetzt

  maerz = pd.DataFrame({"bestellung_id": [10231, 10232], "status": ["bezahlt", "bezahlt"]})
  for lauf in range(2):                                          # zweiter Lauf, etwa nach einem Abbruch
      anhaengen(Path("naiv.csv"), maerz)
      aktualisieren(Path("bestand.csv"), maerz)
  print(len(pd.read_csv("naiv.csv")), len(pd.read_csv("bestand.csv")))

  # Der April-Export enthält eine Statusänderung zu einer Märzbestellung
  april = pd.DataFrame({"bestellung_id": [10232, 10301], "status": ["retourniert", "bezahlt"]})
  aktualisieren(Path("bestand.csv"), april)
  print(pd.read_csv("bestand.csv").to_dict("records"))
  ```

  `aktualisieren` schreibt zuerst in eine temporäre Datei und ersetzt den Bestand dann mit `Path.replace`. Das entspricht [`os.replace`](https://docs.python.org/3/library/os.html#os.replace): Innerhalb eines Dateisystems ist der Austausch atomar, ein Absturz mitten im Schreiben hinterlässt also nie einen halben Bestand. Mehr dazu steht in [Dateien und Ordner automatisieren](/automation/dateien-ordner).

  > [!MERKE]
  > Ein Monatslauf ist idempotent, wenn ein zweiter Lauf mit denselben Dateien denselben Bestand und denselben Bericht erzeugt. Beschreibe den Zielzustand („jede Bestellung genau einmal, im jüngsten Stand“), nicht die Aktion („hänge die neuen Zeilen an“).

  ## Neue und geänderte Dateien erkennen

  Auch beim vollständigen Neuaufbau willst du wissen, was sich seit dem letzten Lauf geändert hat: Nur dann lohnt ein neuer Bericht, und ein korrigierter Export eines schon berichteten Monats braucht einen Hinweis an die Empfänger. Dafür führt der Job ein **Manifest**, eine kleine JSON-Datei mit Dateiname und Prüfsumme je verarbeiteter Datei.

  Die Änderungszeit taugt dafür nicht. Kopieren oder erneutes Herunterladen ändert sie, ohne dass sich Daten ändern, und ein Werkzeug kann eine Datei überschreiben und die alte Zeit übernehmen. Eine Prüfsumme über den Inhalt vergleicht dagegen die Bytes. [`hashlib.file_digest`](https://docs.python.org/3/library/hashlib.html#hashlib.file_digest) berechnet sie seit Python 3.11 direkt aus einer geöffneten Datei:

  ```python run
  import hashlib
  import re
  from pathlib import Path

  MUSTER = re.compile(r"bestellungen_\d{4}-\d{2}\.csv")

  def pruefsumme(pfad: Path) -> str:
      with pfad.open("rb") as datei:
          return hashlib.file_digest(datei, "sha256").hexdigest()

  def plane(eingang: Path, manifest: dict[str, str]) -> dict[str, list[str]]:
      plan = {"neu": [], "geaendert": [], "unveraendert": [], "ignoriert": []}
      for pfad in sorted(eingang.iterdir()):
          if not MUSTER.fullmatch(pfad.name):
              plan["ignoriert"].append(pfad.name)
          elif pfad.name not in manifest:
              plan["neu"].append(pfad.name)
          elif manifest[pfad.name] != pruefsumme(pfad):
              plan["geaendert"].append(pfad.name)
          else:
              plan["unveraendert"].append(pfad.name)
      return plan

  eingang = Path("eingang")
  eingang.mkdir()
  kopf = "bestellung_id;warenwert\n"
  (eingang / "bestellungen_2026-01.csv").write_text(kopf + "10001;48,90\n", encoding="utf-8")
  (eingang / "bestellungen_2026-02.csv").write_text(kopf + "10003;21,50\n", encoding="utf-8")
  manifest = {p.name: pruefsumme(p) for p in eingang.iterdir()}      # Stand nach dem Februarlauf

  # Anfang April: Februar kommt korrigiert, März ist neu, dazu ein doppelter Download
  (eingang / "bestellungen_2026-02.csv").write_text(kopf + "10003;12,50\n", encoding="utf-8")
  (eingang / "bestellungen_2026-03.csv").write_text(kopf + "10231;64,20\n", encoding="utf-8")
  (eingang / "bestellungen_2026-03 (1).csv").write_text(kopf + "10231;64,20\n", encoding="utf-8")
  for art, namen in plane(eingang, manifest).items():
      print(f"{art:<13} {namen}")
  ```

  Drei Regeln machen daraus einen verlässlichen Ablauf:

  - **Der Name ist ein Vertrag.** `fullmatch` lässt `bestellungen_2026-03 (1).csv` nicht durch. Ein `glob("*.csv")` hätte den März doppelt gezählt. Ignorierte Dateien kommen ins Protokoll, damit jemand den doppelten Download aufräumt.
  - **Das Manifest wird zuletzt geschrieben**, erst wenn Bestand und Bericht fertig sind. Bricht der Lauf vorher ab, gelten die Dateien beim nächsten Lauf weiter als neu und werden noch einmal verarbeitet. Umgekehrt wären sie als erledigt markiert, obwohl ihre Daten fehlen.
  - **Fehlalarme sind harmlos, verpasste Änderungen nicht.** Ein erneuter Export mit Windows-Zeilenenden ändert die Prüfsumme, obwohl die Daten gleich sind. Weil die Verarbeitung idempotent ist, kostet so ein Fehlalarm nur einen überflüssigen Lauf.

  ## Vom Bestand zum Bericht: Kennzahlen als Text und als Excel-Datei

  Der Monatsbericht für die Geschäftsführung braucht wenige Zahlen: Warenwert der bezahlten Bestellungen, ihre Anzahl, die Stornoquote und den Vergleich zum Vormonat. Formatiere sie so, wie sie in einer deutschen Mail stehen sollen. Das `locale`-Modul hilft dabei wenig, weil es von den Spracheinstellungen des Rechners abhängt, auf dem der Job läuft. Robuster ist das Formatieren mit Tausenderkomma und das anschließende Tauschen von Komma und Punkt ([Format Specification Mini-Language](https://docs.python.org/3/library/string.html#format-specification-mini-language)):

  ```python run
  import pandas as pd

  def zahl(wert: float, stellen: int = 2, vorzeichen: bool = False) -> str:
      text = f"{wert:{'+' if vorzeichen else ''},.{stellen}f}"      # 1,466.60
      return text.translate(str.maketrans(",.", ".,"))               # 1.466,60

  bestellungen = pd.DataFrame({
      "monat":     ["2026-02"] * 3 + ["2026-03"] * 4,
      "status":    ["bezahlt", "bezahlt", "storniert", "bezahlt", "bezahlt", "storniert", "bezahlt"],
      "warenwert": [48.90, 1240.00, 21.50, 64.20, 1310.00, 17.80, 92.40],
  })

  def kennzahlen(df: pd.DataFrame, monat: str) -> dict:
      m = df[df["monat"] == monat]
      bezahlt = m[m["status"] == "bezahlt"]
      return {"umsatz": bezahlt["warenwert"].sum(), "anzahl": len(bezahlt),
              "stornoquote": (m["status"] == "storniert").mean()}

  jetzt, vorher = kennzahlen(bestellungen, "2026-03"), kennzahlen(bestellungen, "2026-02")
  veraenderung = (jetzt["umsatz"] / vorher["umsatz"] - 1) * 100
  punkte = (jetzt["stornoquote"] - vorher["stornoquote"]) * 100
  print("Monatsbericht 2026-03")
  print(f"Warenwert bezahlt: {zahl(jetzt['umsatz'])} EUR ({zahl(veraenderung, 1, True)} % zum Vormonat)")
  print(f"Bezahlte Bestellungen: {jetzt['anzahl']}")
  print(f"Stornoquote: {zahl(jetzt['stornoquote'] * 100, 1)} % ({zahl(punkte, 1, True)} Prozentpunkte)")
  ```

  Die Stornoquote sinkt von 33,3 % auf 25,0 %: um 8,3 **Prozentpunkte**, nicht um 8,3 Prozent. Der Unterschied gehört in jeden Bericht mit Quoten (siehe [Deskriptive Statistik](/data/deskriptive-statistik)). Den Text schickt der Job als Mail. Wie man eine `EmailMessage` baut und den Versand robust macht, zeigt [Benachrichtigungen ohne Nachrichtenflut](/automation/benachrichtigungen).

  Für die Excel-Fassung schreibt pandas mehrere Blätter in eine Datei. [`DataFrame.to_excel`](https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.to_excel.html) braucht dafür das Paket `openpyxl`. Im Browser gibt es das nicht, deshalb läuft dieser Block nur lokal (`uv add pandas openpyxl`):

  ```python
  ziel = Path("berichte") / f"monatsbericht_{monat}.xlsx"      # Name nach Berichtsmonat, nicht nach Laufdatum
  tmp = ziel.with_name(ziel.name + ".tmp")
  with pd.ExcelWriter(tmp, engine="openpyxl") as writer:
      kennzahlen_tabelle.to_excel(writer, sheet_name="Kennzahlen", index=False)
      je_kanal.to_excel(writer, sheet_name="Kanäle", index=False)
  tmp.replace(ziel)
  ```

  Zwei Details machen den Bericht wiederholbar. Der Dateiname enthält den **Berichtsmonat**, nicht das Laufdatum; ein zweiter Lauf überschreibt denselben Bericht, statt einen zweiten danebenzulegen. Und pandas schreibt Werte, keine Formeln – die Datei ist ein Ergebnis, keine Rechenvorlage. Soll die Geschäftsführung in Excel weiterfiltern, schreibe den Bestand als CSV in einen Ordner, den eine Power Query-Arbeitsmappe liest.

  ## Excel selbst automatisieren: Alle aktualisieren, VBA und Office Scripts

  Manchmal soll die Excel-Arbeitsmappe der Mittelpunkt bleiben. Dann gibt es drei Stufen. **Daten › Alle aktualisieren** (Strg+Alt+F5) aktualisiert alle Abfragen und PivotTables. In den Eigenschaften einer Abfrage (**Daten › Abfragen & Verbindungen**, Rechtsklick › **Eigenschaften**) stellst du ein, dass sie beim Öffnen der Datei oder alle n Minuten aktualisiert wird ([Aktualisieren einer externen Datenverbindung](https://support.microsoft.com/de-de/office/aktualisieren-einer-externen-datenverbindung-in-excel-1524175f-777a-48fc-8fc7-c8514b984440)). Beides setzt ein geöffnetes Excel voraus.

  Ein VBA-Makro in einer `.xlsm`-Datei kann dieselbe Aktualisierung per Schaltfläche auslösen und danach speichern. [`Workbook.RefreshAll`](https://learn.microsoft.com/de-de/office/vba/api/excel.workbook.refreshall) aktualisiert alle externen Datenbereiche und PivotTables der Arbeitsmappe:

  ```vba
  Sub MonatsberichtAktualisieren()
      ThisWorkbook.RefreshAll
      ThisWorkbook.Save
  End Sub
  ```

  Laufen Abfragen im Hintergrund, kehrt `RefreshAll` zurück, bevor alle Daten geladen sind, und das Makro speichert womöglich einen halben Stand. Schalte die Hintergrundaktualisierung in den Eigenschaften der Abfragen deshalb aus, wenn ein Makro nach dem Aktualisieren weiterarbeitet. VBA läuft nur in den Desktop-Versionen von Excel, nicht in Excel für das Web.

  Office Scripts sind das Gegenstück für die Cloud: TypeScript, das in Excel für das Web, unter Windows und auf dem Mac läuft und sich aus einem Power Automate-Flow nach Zeitplan starten lässt:

  ```typescript
  function main(workbook: ExcelScript.Workbook) {
    workbook.refreshAllDataConnections();
    const blatt = workbook.getWorksheet("Bericht");
    blatt.getRange("A1").setValue("Stand: automatisch aktualisiert");
  }
  ```

  > [!NOTE] Die Grenze von Office Scripts in Power Automate
  > Aus einem Power Automate-Flow heraus aktualisieren Office Scripts die meisten Daten nicht: `refreshAllDataConnections` wirkt dort nur auf Power BI-Quellen, `PivotTable.refresh` tut nichts – beide melden trotzdem Erfolg ([Problembehandlung für Power Automate mit Office-Skripts](https://learn.microsoft.com/de-de/office/dev/scripts/testing/power-automate-troubleshooting)). Eine Power Query-Abfrage auf einen Ordner lässt sich so nicht nach Zeitplan aktualisieren. Für den unbeaufsichtigten Lauf ist ein Skript mit Zeitplaner der verlässlichere Weg.

  ## Protokoll, Trockenlauf und Zeitplan

  Ein Job, der nachts läuft, muss morgens erklären können, was er getan hat. Protokolliere mit dem Modul `logging` ([logging.basicConfig](https://docs.python.org/3/library/logging.html#logging.basicConfig)) die gefundenen Dateien, die Zeilen je Datei, die Summen, die geschriebenen Dateien und jede Warnung – aber keine ganzen Datensätze mit Kundennamen. Ein **Trockenlauf** zeigt den Plan, ohne etwas zu schreiben. Und der **Exit-Code** sagt dem Zeitplaner, ob es geklappt hat: `0` für Erfolg, alles andere für Fehler.

  ```python run
  import argparse
  import logging
  import sys

  log = logging.getLogger("monatsbericht")

  def main(argv: list[str]) -> int:
      parser = argparse.ArgumentParser(prog="monatsbericht", description="Monatsbericht Bohnenwerk")
      parser.add_argument("--monat", required=True, help="Berichtsmonat, z. B. 2026-03")
      parser.add_argument("--dry-run", action="store_true", help="nur anzeigen, nichts schreiben")
      args = parser.parse_args(argv)
      logging.basicConfig(stream=sys.stdout, level=logging.INFO, format="%(levelname)s %(message)s", force=True)

      plan = {"neu": ["bestellungen_2026-03.csv"], "geaendert": ["bestellungen_2026-02.csv"]}  # sonst: plane(…)
      log.info("Berichtsmonat %s: %d neu, %d geändert", args.monat, len(plan["neu"]), len(plan["geaendert"]))
      if plan["geaendert"]:
          log.warning("Bereits berichtete Monate haben sich geändert: %s", ", ".join(plan["geaendert"]))
      if args.dry_run:
          log.info("Trockenlauf – würde schreiben: berichte/monatsbericht_%s.xlsx", args.monat)
          return 0
      # laden, prüfen, Bestand neu aufbauen, Bericht schreiben, Manifest speichern
      return 0

  print("Exit-Code:", main(["--monat", "2026-03", "--dry-run"]))
  ```

  Im echten Skript schreibt `logging` zusätzlich in eine Datei wie `logs/monatsbericht.log`, am besten mit Zeitstempel im Format (`%(asctime)s`). Das Muster „erst planen, dann handeln“ stammt aus [Automatisieren mit Verstand](/automation/automatisieren-denken); dort steht auch, wie du Planen und Ausführen sauber trennst.

  Für den Zeitplan wiederholt dieses Modul nichts, was im Bereich Automation schon steht: cron und systemd-Timer mit verpassten Läufen und Überschneidungsschutz erklärt [Jobs zeitgesteuert ausführen](/automation/zeitsteuerung), geplante Läufe in GitHub Actions [Deployment & Continuous Integration](/automation/deployment-ci). Für Bohnenwerk reicht ein Eintrag, der am 2. jedes Monats um 6:15 Uhr startet – auf dem Linux-Server als crontab-Zeile:

  ```text title=crontab
  15 6 2 * * cd /srv/bohnenwerk && /usr/local/bin/uv run monatsbericht.py --monat "$(date -d 'last month' +\%Y-\%m)" >> logs/cron.log 2>&1
  ```

  Auf einem Windows-Rechner übernimmt die Aufgabenplanung diese Rolle, eingerichtet über die Oberfläche oder mit [`schtasks /create`](https://learn.microsoft.com/de-de/windows-server/administration/windows-commands/schtasks-create):

  ```text title=Eingabeaufforderung
  schtasks /create /tn "Bohnenwerk Monatsbericht" /tr "C:\Bohnenwerk\monatsbericht.cmd" /sc monthly /d 2 /st 06:15
  ```

  Beide Zeitpläne starten den Job einmal. Weil der Job idempotent ist, darfst du ihn jederzeit von Hand wiederholen – etwa nachdem der Shop einen korrigierten Export geliefert hat.

  > [!PRAXIS]
  > Der Monatsjob von Bohnenwerk läuft am 2. um 6:15 Uhr auf dem Büroserver. Er liest den Exportordner, baut den Bestand neu auf, prüft Status, Beträge und doppelte Bestellnummern und schreibt `monatsbericht_2026-03.xlsx` sowie eine Mail mit vier Kennzahlen. Findet er einen Fehler, schreibt er keinen Bericht, endet mit Exit-Code 1 und schickt stattdessen „Bericht nicht erstellt“ mit dem Grund. Merle liest um acht die Mail, statt selbst zu aktualisieren und Kennzahlen abzutippen. Kommt ein korrigierter Februar-Export, meldet der nächste Lauf „geändert: bestellungen_2026-02.csv“, und der Bericht wird als korrigierte Fassung neu verschickt.

  ## Häufige Fehler

  - **Anhängen ohne Schlüssel.** Der zweite Lauf verdoppelt Umsätze. Lösung: Bestand neu aufbauen oder per `drop_duplicates(subset=…, keep="last")` auf den fachlichen Schlüssel reduzieren.
  - **Dateien unsortiert verarbeitet.** „Der jüngste Stand gewinnt“ hängt dann von der Reihenfolge des Dateisystems ab, und zwei Rechner rechnen verschieden. Lösung: `sorted(…)` über Namen mit sortierbarem Datum `JJJJ-MM`.
  - **`glob("*.csv")` statt Namensvertrag.** Doppelte Downloads und Testdateien fließen ein. Lösung: `re.fullmatch` mit festem Muster, Rest ins Protokoll.
  - **Manifest vor der Verarbeitung gespeichert.** Nach einem Abbruch gilt eine Datei als erledigt, ihre Daten fehlen. Lösung: Manifest als letzten Schritt schreiben.
  - **Änderungszeit statt Inhalt.** Kopierte Dateien gelten als neu, überschriebene mit alter Zeit als unverändert. Lösung: SHA-256 über den Inhalt.
  - **`thousands="."` ohne Datumstyp.** Datumswerte werden zu großen Ganzzahlen. Lösung: `parse_dates` mit `date_format` oder `dtype`.
  - **Bericht nach Laufdatum benannt.** Der Märzbericht heißt `…_2026-04.xlsx`, Wiederholungen erzeugen neue Dateien. Lösung: Berichtsmonat im Namen.
  - **Stilles Scheitern.** Ein `except Exception: pass` oder ein Job ohne Protokoll und Exit-Code fällt erst auf, wenn der Bericht fehlt. Lösung: Fehler protokollieren, Exit-Code ungleich 0, Benachrichtigung.
  - **Office Script soll Power Query nach Zeitplan aktualisieren.** In Power Automate passiert dabei nichts, der Flow meldet trotzdem Erfolg. Lösung: Aktualisieren beim Öffnen oder ein Skript außerhalb von Excel.

  ## Zusammenfassung

  - Werkzeugwahl nach drei Fragen: Wo liegen die Daten, wer startet den Lauf, muss er ohne Menschen funktionieren? Power Query für Excel-Nutzer, SQL in der Datenbank, Python für unbeaufsichtigte Jobs, Office Scripts oder VBA für die Arbeitsmappe selbst.
  - Ein Monatslauf ist idempotent, wenn ein zweiter Lauf denselben Bestand und Bericht erzeugt. Vollständiger Neuaufbau ist der einfachste Weg, Upsert über den fachlichen Schlüssel der zweite.
  - Dateien sortiert und über ein festes Namensmuster verarbeiten; `glob` und `iterdir` garantieren keine Reihenfolge.
  - Ein Manifest mit SHA-256-Prüfsummen erkennt neue und geänderte Dateien. Es wird erst nach erfolgreichem Schreiben aktualisiert; Bestand und Bericht werden atomar ersetzt.
  - Kennzahlen im deutschen Format ohne `locale`, Quoten mit Prozentpunkten vergleichen, Berichte nach Berichtsmonat benennen. Excel-Ausgabe braucht `openpyxl`.
  - Protokoll, Trockenlauf und Exit-Code machen einen nächtlichen Job überprüfbar; Zeitplan und Mailversand stehen im Bereich Automation.
exercises:
  - id: werkzeug-waehlen
    type: choice
    title: Montag, sieben Uhr, Kennzahlen im Postfach
    prompt: |
      Die Geschäftsführung von Bohnenwerk will jeden Montag um 7 Uhr eine Mail mit den Kennzahlen der Vorwoche. Die Bestellexporte liegen als CSV auf einem Netzlaufwerk; eine Excel-Arbeitsmappe mit Power Query-Abfragen auf diesen Ordner gibt es schon. Am Montagmorgen ist niemand im Büro. Welche Lösung trägt?
    options:
      - text: Ein Python-Skript, das die CSV-Dateien liest, die Kennzahlen berechnet und die Mail verschickt, gestartet von der Aufgabenplanung oder cron auf einem Rechner mit Zugriff auf das Netzlaufwerk.
        correct: true
        why: Das Skript braucht weder Excel noch einen Menschen, protokolliert seinen Lauf und meldet Fehler über den Exit-Code. Die bestehende Arbeitsmappe kann für die interaktive Analyse bleiben.
      - text: Ein Office Script, das ein Power Automate-Flow montags startet; es ruft `refreshAllDataConnections()` auf und schickt danach die Werte aus der Arbeitsmappe per Mail.
        correct: false
        why: In Power Automate aktualisiert `refreshAllDataConnections` nur Power BI-Quellen. Die Power Query-Abfrage auf den Ordner bleibt auf dem alten Stand, und der Flow meldet trotzdem Erfolg.
      - text: In den Abfrageeigenschaften „Aktualisierung alle 60 Minuten“ einstellen.
        correct: false
        why: Die Aktualisierung läuft nur, solange die Arbeitsmappe in einem Excel geöffnet ist, und sie verschickt keine Mail.
      - text: Ein VBA-Makro in `Workbook_Open`, das `ThisWorkbook.RefreshAll` aufruft und die Mail über Outlook sendet.
        correct: false
        why: Das Makro läuft erst, wenn jemand die Datei in Excel für den Desktop öffnet. Am Montagmorgen ist niemand da, der das tut.
    explanation: |
      Die entscheidende Anforderung ist „ohne Menschen zu einer festen Zeit“. Power Query und VBA brauchen ein geöffnetes Excel, und Office Scripts können in Power Automate keine Power Query-Verbindungen aktualisieren. Ein Skript mit Zeitplaner erfüllt die Anforderung und bleibt überprüfbar: Protokoll, Exit-Code und eine Fehlermail, wenn etwas nicht stimmt. Die Excel-Arbeitsmappe wird dadurch nicht überflüssig – sie bleibt das Werkzeug für Rückfragen und Detailanalysen.
