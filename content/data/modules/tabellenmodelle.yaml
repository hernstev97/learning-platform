id: tabellenmodelle
title: Saubere Tabellen und Datenmodelle
level: 1
minutes: 150
summary: Was eine Zeile bedeutet, wozu Schlüssel da sind und wie Fakten und Dimensionen zusammenspielen – das Fundament, auf dem jede Auswertung in Excel, SQL und pandas steht.
goals:
  - Du beschreibst den Analyse-Workflow von der Frage bis zur Aussage und ordnest Bereinigen und Prüfen richtig ein.
  - Du bestimmst die Granularität einer Tabelle und erkennst Kennzahlen, die auf einer feineren Ebene mehrfach gezählt werden.
  - Du wählst Primär-, Fremd- und zusammengesetzte Schlüssel und prüfst sie in SQL und Python auf Eindeutigkeit.
  - Du trennst Fakten- von Dimensionstabellen und formst breite Monatslisten in das lange Format um.
  - Du erkennst Excel-Antipatterns wie verbundene Zellen, Zwischensummen und Farbe als Information und schneidest die Liste neu.
