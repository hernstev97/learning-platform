lesson: |
  Jeden Monatsanfang öffnet Lea aus dem Vertriebsinnendienst der Bohnenwerk GmbH die Datei `Vertrieb_2026_final_v3.xlsx`. Die Kaffeerösterei in Köln verkauft über ihren Webshop an Privatkunden und direkt an Büros und Cafés. Die Liste ist über Jahre gewachsen: Regionen in verbundenen Zellen, nach jeder Region eine Summenzeile, Kunden mit Rahmenvertrag grün markiert, für jeden Monat eine neue Spalte. Bevor die Geschäftsführung ihren Monatsbericht bekommt, hebt Lea Zellverbünde auf, löscht Summenzeilen, kopiert Werte in eine zweite Mappe und prüft von Hand, ob alles aufgeht. Das dauert jeden Monat rund drei Stunden.

  Das Problem sind nicht fehlende Formelkenntnisse, sondern die Form der Tabelle. Eine Tabelle, die für das Auge gebaut ist, lässt sich schlecht auswerten; eine Tabelle, die für die Auswertung gebaut ist, lässt sich mit einem Klick in jede Ansicht bringen. Dieses Modul legt das Fundament für den ganzen Bereich: saubere Tabellen, Granularität, Schlüssel, Fakten und Dimensionen. Die Module zu Excel, SQL und pandas bauen auf diesen Begriffen und auf dem Beispiel Bohnenwerk auf.

  ## Der Analyse-Workflow: von der Frage zur Aussage

  Datenanalyse beginnt mit einer Frage, nicht mit einer Formel. Der Ablauf ist in Excel, SQL und Python derselbe:

  1. **Frage klären.** „Welche Region hatte im März 2026 den höchsten Nettoumsatz mit Büros?“ ist beantwortbar, „Wie läuft der Vertrieb?“ nicht. Die Frage legt fest, welche Daten du brauchst und wie fein sie sein müssen.
  2. **Daten beschaffen.** Exporte aus Shopsystem, Buchhaltung oder Ticketsystem – mit Quelle, Stand und Filter notiert.
  3. **Bereinigen.** Encoding, Trennzeichen, Datumsformate, Schreibweisen, Dubletten: Thema von [CSV-Import und Datenbereinigung](/data/csv-import).
  4. **Prüfen.** Stimmen Zeilenzahl und Summen mit dem Quellsystem? Sind Schlüssel eindeutig? Mehr im Modul [Datenqualität](/data/datenqualitaet).
  5. **Auswerten.** Gruppieren, verknüpfen, vergleichen – mit einer PivotTable (einer Auswertungstabelle, die Excel per Mausklick nach Zeilen und Spalten gruppiert und summiert), mit SQL oder mit pandas.
  6. **Kommunizieren.** Eine Aussage mit Zahl und Kontext („West liegt 12 % über dem Vorjahresmonat, getragen von drei Cafés“), kein Tabellenblatt voller Zahlen.

  Bereinigen und Prüfen kosten in der Praxis die meiste Zeit. Wie viel, hängt fast vollständig davon ab, wie die Daten geschnitten sind.

  ## Saubere Tabellen und die typischen Excel-Antipatterns

  Eine Tabelle ist **sauber** (englisch *tidy*), wenn drei Regeln gelten: Jede **Variable** hat eine eigene Spalte, jede **Beobachtung** eine eigene Zeile, jede **Beobachtungseinheit** eine eigene Tabelle. Eine Variable ist eine Eigenschaft wie Bestelldatum, Menge oder Region. Eine Beobachtung ist ein einzelner Fall, etwa eine Bestellposition. Die dritte Regel trennt Arten von Fällen: Kunden sind etwas anderes als Verkäufe, also stehen sie in einer anderen Tabelle.

  So sieht Leas Liste aus, wenn man sie als CSV speichert:

  ```csv
  Vertrieb 2026 – Großkunden;;;;
  Region;Kunde;Produkte Januar;Umsatz;
  ;;;Jan;Feb
  Nord;Kanzlei Berger & Partner;Espresso (60), Filter (32);1.842,00 €;1.974,00 €
  ;Hafenbüro Schulte;Espresso (25);547,50 €;438,00 €
  Summe Nord;;;2.389,50 €;2.412,00 €
  ;;;;
  West;Café Luna;Espresso (40);876,00 €;876,00 €
  ```

  Jede Regel ist verletzt, und jede Verletzung ist ein bekanntes Antipattern:

  | Muster | Was kaputtgeht | Besser |
  | --- | --- | --- |
  | Verbundene Zellen („Nord“ über mehrere Zeilen) | Nur die erste Zelle enthält den Wert; das Hafenbüro hat im Export keine Region. Sortieren verweigert Excel bei unterschiedlich großen Verbünden. | Wert in jede Zeile schreiben |
  | Zwischensummen in den Daten | `SUMME` (englisch `SUM`) über die Spalte zählt doppelt, eine PivotTable addiert „Summe Nord“ wie eine Region. | Summen in der Auswertung erzeugen |
  | Farbe als Information (grün = Rahmenvertrag) | Formeln, PivotTables, SQL und CSV sehen keine Farbe. | Spalte `rahmenvertrag` mit 0/1 |
  | Mehrere Werte in einer Zelle („Espresso (60), Filter (32)“) | Zwei Variablen und zwei Produkte in einem Feld – nicht zählbar, nicht verknüpfbar. | Eine Zeile je Produkt |
  | Leerzeilen zur Optik | Excel erkennt den Datenbereich nur bis zur Lücke. | Keine Leerzeilen |
  | Titel und Überschriften über mehrere Zeilen | Keine eindeutige Kopfzeile, der Monat steckt in Spaltennamen. | Genau eine Kopfzeile |
  | Einheiten in Zahlenfeldern („1.842,00 €“) | Der Wert ist Text, nicht Zahl. | Einheit in den Spaltennamen |

  Dieselben Umsätze als saubere Tabelle, eine Zeile je Kunde, Produkt und Monat:

  ```csv
  kunde_id;produkt_id;monat;menge;umsatz
  2;10;2026-01;60;1314.00
  2;11;2026-01;32;528.00
  5;10;2026-01;25;547.50
  2;10;2026-02;60;1314.00
  2;11;2026-02;40;660.00
  5;10;2026-02;20;438.00
  ```

  Name, Region und Rahmenvertrag stehen einmal in einer Tabelle `kunden` mit einer Zeile je Kunde. Die neue Tabelle ist länger und weniger elegant, aber jede Auswertung funktioniert ohne Handarbeit: Summe je Region per PivotTable, Filter auf Februar, Sortierung nach Umsatz. Beim Verbinden behält Excel nur den Wert der oberen linken Zelle; hebst du den Verbund später auf, steht der Wert nur in der ersten Zeile ([Verbinden von Zellen und Aufheben des Zellverbunds](https://support.microsoft.com/de-de/office/verbinden-von-zellen-und-aufheben-des-zellverbunds-5cbd15d5-9375-4540-907f-c673a93fcedf)). Eine vorhandene Liste rettest du in Power Query mit Transformieren › Ausfüllen › Nach unten und einem Filter auf Summenzeilen; billiger ist es, sie gleich richtig zu schneiden.

  > [!MERKE]
  > Trenne Daten und Darstellung. Die Datentabelle ist schmal, lang und schlicht. Summen, Farben und Monatsspalten gehören in die Auswertung, die daraus entsteht.

  ## Granularität und Schlüssel: Was ist eine Zeile?

  Die wichtigste Frage an jede Tabelle lautet: *Was genau ist eine Zeile?* Diese Eigenschaft heißt **Granularität** (auch Körnung oder Detailgrad). Schreib sie als Satz auf, bevor du eine Tabelle anlegst oder auswertest. Für die Bohnenwerk-Tabellen, die dir in allen weiteren Modulen begegnen:

  | Tabelle | Eine Zeile ist … |
  | --- | --- |
  | `kunden` | … ein Kunde (Privat, Büro oder Café). |
  | `produkte` | … ein Produkt im Sortiment. |
  | `bestellungen` | … eine Bestellung: der Kopf mit Datum, Kanal, Status und Versandkosten. |
  | `positionen` | … ein Produkt innerhalb einer Bestellung, mit Menge, Einzelpreis und Rabatt. |
  | `tickets` | … eine Supportanfrage. |

  Eine Bestellung mit drei Produkten erzeugt eine Zeile in `bestellungen` und drei in `positionen`. Versandkosten fallen einmal je Bestellung an und stehen deshalb im Kopf. Der Nettoumsatz einer Position ist `menge * einzelpreis * (1 - rabatt)`.

  ### Kennzahlen auf der falschen Ebene

  Probleme entstehen, wenn Werte verschiedener Granularität zusammenkommen. Viele Shop-Exporte liefern eine Zeile je Position und wiederholen die Versandkosten der Bestellung in jeder Zeile. Dasselbe passiert, wenn du Bestellungen und Positionen verknüpfst – in SQL mit einem **Join**, der Zeilen zweier Tabellen über einen gemeinsamen Schlüssel zusammenführt:

  ```sql run
  CREATE TABLE bestellungen (bestellung_id INTEGER PRIMARY KEY, kunde_id INTEGER, versandkosten REAL);
  INSERT INTO bestellungen VALUES (1001, 1, 0.0), (1002, 3, 4.5), (1003, 2, 6.0);
  CREATE TABLE positionen (bestellung_id INTEGER, position INTEGER, produkt_id INTEGER, menge INTEGER);
  INSERT INTO positionen VALUES (1001, 1, 10, 5), (1001, 2, 11, 4), (1002, 1, 10, 1),
    (1002, 2, 12, 1), (1002, 3, 11, 2), (1003, 1, 11, 10);
  -- richtig: jede Bestellung genau einmal
  SELECT COUNT(*) AS zeilen, SUM(versandkosten) AS versand FROM bestellungen;
  -- falsch: nach dem Join steht jede Bestellung so oft da, wie sie Positionen hat
  SELECT COUNT(*) AS zeilen, SUM(b.versandkosten) AS versand
  FROM bestellungen AS b
  JOIN positionen AS p ON p.bestellung_id = b.bestellung_id;
  ```

  Der Join bringt das Ergebnis auf die feinere Ebene der Positionen, und die 4,50 € der Bestellung 1002 stehen danach dreimal da. Wie du das in SQL sauber löst, zeigt [Joins und Datenmodelle abfragen](/data/sql-joins). Die Regel dahinter:

  > [!MERKE]
  > Attribute einer gröberen Ebene darfst du auf eine feinere herunterkopieren (das Bestelldatum an jede Position). Kennzahlen einer gröberen Ebene (die Versandkosten) darfst du auf der feineren nicht summieren.

  ### Primärschlüssel, Fremdschlüssel, zusammengesetzte Schlüssel

  Ein **Primärschlüssel** identifiziert jede Zeile eindeutig; er ist nie leer und wiederholt sich nie. In `kunden` ist das `kunde_id`. Ein Name taugt nicht: Es gibt ein Café Luna in Köln und eins in Bonn, und „Kanzlei Berger“ heißt seit Januar „Kanzlei Berger & Partner“. Die Kundennummer bleibt.

  In `positionen` wiederholen sich `bestellung_id` (mehrere Positionen je Bestellung) und `position` (jede Bestellung hat eine Position 1). Erst die Kombination `(bestellung_id, position)` ist eindeutig – ein **zusammengesetzter Schlüssel**. Er ist die Granularität in Spaltenform. Ein **Fremdschlüssel** verweist auf den Primärschlüssel einer anderen Tabelle: `bestellungen.kunde_id` auf `kunden.kunde_id`. Über diese Paare kommen Tabellen später zusammen – mit `XVERWEIS` in Excel, `JOIN` in SQL, `merge` in pandas. Eine Datenbank erzwingt alle drei ([CREATE TABLE · PRIMARY KEY](https://www.sqlite.org/lang_createtable.html#primkeyconst)):

  ```sql run
  PRAGMA foreign_keys = ON;
  CREATE TABLE kunden (
    kunde_id INTEGER PRIMARY KEY,
    name TEXT NOT NULL,
    region TEXT NOT NULL CHECK (region IN ('Nord', 'Süd', 'West', 'Ost'))
  );
  CREATE TABLE bestellungen (
    bestellung_id INTEGER PRIMARY KEY,
    kunde_id INTEGER NOT NULL REFERENCES kunden (kunde_id),
    bestelldatum TEXT NOT NULL
  );
  CREATE TABLE positionen (
    bestellung_id INTEGER NOT NULL REFERENCES bestellungen (bestellung_id),
    position INTEGER NOT NULL,
    produkt_id INTEGER NOT NULL,
    menge INTEGER NOT NULL CHECK (menge > 0),
    PRIMARY KEY (bestellung_id, position)
  );
  INSERT INTO kunden VALUES (1, 'Café Luna', 'West');
  INSERT INTO bestellungen VALUES (1001, 1, '2026-03-02');
  INSERT INTO positionen VALUES (1001, 1, 10, 5), (1001, 2, 11, 4);
  SELECT * FROM positionen;
  ```

  Eine Bestellung für einen unbekannten Kunden lehnt die Datenbank ab, statt sie still zu speichern; eine doppelte Position ebenso:

  ```sql run fails
  PRAGMA foreign_keys = ON;
  CREATE TABLE kunden (kunde_id INTEGER PRIMARY KEY, name TEXT NOT NULL);
  CREATE TABLE bestellungen (
    bestellung_id INTEGER PRIMARY KEY,
    kunde_id INTEGER NOT NULL REFERENCES kunden (kunde_id)
  );
  INSERT INTO kunden VALUES (1, 'Café Luna');
  INSERT INTO bestellungen VALUES (1001, 1);
  INSERT INTO bestellungen VALUES (1002, 99); -- Kunde 99 gibt es nicht
  ```

  > [!WARNING] Zwei SQLite-Eigenheiten
  > SQLite prüft Fremdschlüssel nur mit `PRAGMA foreign_keys = ON`; ohne diese Zeile ist die Prüfung aus ([Enabling Foreign Key Support](https://www.sqlite.org/foreignkeys.html#fk_enable)). Und ein `PRIMARY KEY`, der nicht `INTEGER PRIMARY KEY` ist, lässt in SQLite aus historischen Gründen `NULL` zu – schreib `NOT NULL` dazu. PostgreSQL erzwingt beides ohne Zusatz ([Constraints](https://www.postgresql.org/docs/current/ddl-constraints.html#DDL-CONSTRAINTS-PRIMARY-KEYS)).

  ### Schlüssel prüfen, bevor du auswertest

  Excel erzwingt keine Schlüssel, Exporte auch nicht. Der Test ist einfach: Anzahl Zeilen gegen Anzahl verschiedener Schlüssel. In Python zählt `collections.Counter` jeden Schlüssel:

  ```python run
  from collections import Counter

  positionen = [
      {"bestellung_id": 1001, "position": 1, "produkt_id": 10},
      {"bestellung_id": 1001, "position": 2, "produkt_id": 11},
      {"bestellung_id": 1002, "position": 1, "produkt_id": 10},
      {"bestellung_id": 1001, "position": 2, "produkt_id": 11},
  ]
  anzahl = Counter((p["bestellung_id"], p["position"]) for p in positionen)
  print(len(positionen), "Zeilen,", len(anzahl), "verschiedene Schlüssel")
  print("doppelt:", [schluessel for schluessel, n in anzahl.items() if n > 1])
  ```

  In SQL gruppierst du nach dem Schlüssel und behältst mit `HAVING` nur Gruppen mit mehr als einer Zeile, hier für einen Kundenexport:

  ```sql run
  CREATE TABLE kunden_import (kunde_id INTEGER, name TEXT, stadt TEXT);
  INSERT INTO kunden_import VALUES (1, 'Café Luna', 'Köln'), (2, 'Kanzlei Berger & Partner', 'Hamburg'),
    (3, 'Jana Wolff', 'Leipzig'), (2, 'Kanzlei Berger', 'Hamburg');
  SELECT kunde_id, COUNT(*) AS anzahl
  FROM kunden_import
  GROUP BY kunde_id
  HAVING COUNT(*) > 1;
  ```

  > [!INTERVIEW] „Du bekommst eine neue Tabelle für eine Analyse. Was machst du zuerst?“
  > Ich kläre die Granularität: Was ist eine Zeile, welche Spalten bilden den Schlüssel? Dann vergleiche ich Zeilen mit verschiedenen Schlüsseln und schaue mir Datentypen und fehlende Werte an. Bevor ich eine Kennzahl summiere, frage ich, auf welcher Ebene sie lebt – Versandkosten pro Bestellung summiere ich nicht über Positionen. Zum Schluss gleiche ich Zeilenzahl und Summen mit dem Quellsystem ab.

  ## Fakten und Dimensionen: das Sternschema

  In den Bohnenwerk-Tabellen stecken zwei Sorten. **Faktentabellen** speichern Ereignisse mit Zahlen, die man summiert: Bestellungen, Positionen, Tickets. Sie wachsen täglich. **Dimensionstabellen** beschreiben, wonach du filterst und gruppierst: Kunden, Produkte, Kalendertage. Sie sind klein und ändern sich selten. Weil die Dimensionen wie Zacken um die Faktentabelle liegen, heißt das Muster **Sternschema** ([Sternschema und Power BI](https://learn.microsoft.com/de-de/power-bi/guidance/star-schema)):

  ```text
                         kunden
                      (Dimension)
                        kunde_id
                           │
    produkte ───────── verkaeufe ───────── kalender
   (Dimension)          (Fakten)          (Dimension)
    produkt_id       eine Zeile je           datum
                    Bestellposition
  ```

  Die Faktentabelle `verkaeufe` hat die Granularität der Positionen, mit Fremdschlüsseln (`kunde_id`, `produkt_id`, `bestelldatum`) und Kennzahlen (`menge`, `nettoumsatz`). Datum und Kundennummer stammen aus dem Bestellkopf – erlaubt, weil jede Position zu genau einer Bestellung gehört. Alles Beschreibende steht einmal in der Dimension: Wechselt ein Kunde die Region, änderst du eine Zeile in `kunden` statt 400 Zeilen in den Verkäufen.

  In Excel legst du je Tabelle eine formatierte Tabelle an (Start › Als Tabelle formatieren) und holst Attribute über den Schlüssel dazu. `XVERWEIS` (englisch `XLOOKUP`) sucht den Schlüssel in der Dimension und liefert die gewünschte Spalte ([XVERWEIS](https://support.microsoft.com/de-de/excel/functions/xlookup-function)), hier als berechnete Spalte `region` in `Verkaeufe`:

  ```excel
  =XVERWEIS([@kunde_id];Kunden[kunde_id];Kunden[region])
  ```

  `XVERWEIS` gibt es ab Excel 2021 und in Microsoft 365; ältere Versionen nutzen `INDEX` mit `VERGLEICH` (englisch `MATCH`, siehe [Excel-Formeln](/data/excel-formeln)). Findet die Formel einen Schlüssel nicht, zeigt sie `#NV`. Das ist gewollt: Ein Fremdschlüssel ohne Partner soll auffallen, nicht verschwinden.

  > [!PRAXIS] Drei Tabellen statt einer gewachsenen Liste
  > Lea schreibt die Vertriebsliste nicht mehr von Hand fort. Das Shopsystem liefert Bestellungen und Positionen, daraus entsteht die lange Tabelle `Verkaeufe` mit einer Zeile je Position; Kunden und Produkte liegen je einmal in eigenen Tabellen. Der Monatsbericht ist eine PivotTable auf `Verkaeufe`: Daten › Alle aktualisieren. Summen je Region, Monatsvergleich und Top-Kunden entstehen aus denselben Daten, ohne gelöschte Zeilen und aufgehobene Zellverbünde. Mit [Power Query](/data/power-query) wird auch das Anhängen des neuen Monats zu einem Klick.

  ## Breit oder lang: Monate gehören in Zeilen

  Leas Liste hat eine Spalte je Monat. Dieses **breite Format** ist für einen Bericht lesbar, für die Auswertung hinderlich: Jeder neue Monat ändert die Struktur, Formeln wie `=SUMME(D4:E4)` müssen nachgezogen werden. Im **langen Format** ist der Monat eine Variable mit eigener Spalte, ein neuer Monat bringt neue Zeilen statt neuer Spalten. Filter, PivotTables, `GROUP BY` und pandas arbeiten alle auf diesem Format ([pandas · Reshape the layout of tables](https://pandas.pydata.org/docs/getting_started/intro_tutorials/07_reshape_table_layout.html)).

  Das Umformen von breit nach lang heißt **Entpivotieren** (englisch *unpivot*). In SQL stapelst du je Monatsspalte eine Abfrage mit `UNION ALL` untereinander ([Compound Select](https://www.sqlite.org/lang_select.html#compound)):

  ```sql run
  CREATE TABLE umsatz_breit (produkt TEXT, jan REAL, feb REAL, mrz REAL);
  INSERT INTO umsatz_breit VALUES ('Espresso Classico', 1250.0, 1310.5, 1402.0),
    ('Filter Hausmischung', 830.0, 790.0, 905.5);
  SELECT produkt, '2026-01' AS monat, jan AS umsatz FROM umsatz_breit
  UNION ALL
  SELECT produkt, '2026-02', feb FROM umsatz_breit
  UNION ALL
  SELECT produkt, '2026-03', mrz FROM umsatz_breit
  ORDER BY produkt, monat;
  ```

  In Excel erledigt das Power Query: Daten › Aus Tabelle/Bereich, Spalte `produkt` markieren, Transformieren › Spalten entpivotieren › Andere Spalten entpivotieren ([Entpivotieren von Spalten](https://learn.microsoft.com/de-de/power-query/unpivot-column)). Der Editor erzeugt diesen M-Code:

  ```powerquery
  let
      Quelle = Excel.CurrentWorkbook(){[Name = "UmsatzBreit"]}[Content],
      #"Entpivotierte andere Spalten" = Table.UnpivotOtherColumns(Quelle, {"produkt"}, "Attribut", "Wert")
  in
      #"Entpivotierte andere Spalten"
  ```

  „Andere Spalten entpivotieren“ ist robuster als „Nur ausgewählte Spalten entpivotieren“: Kommt im April eine Spalte dazu, wird sie automatisch mit umgeformt. Die Gegenrichtung, von lang nach breit, ist genau das, was eine PivotTable tut. Breit ist ein Format für Berichte, lang eins für Daten.

  ## Datentypen: Zahl, Text, Datum – und was dazwischen schiefgeht

  Jede Spalte hat genau einen Datentyp, und der richtet sich nach der Bedeutung, nicht nach dem Aussehen:

  | Spalte | Typ | Warum |
  | --- | --- | --- |
  | `kunde_id`, `bestellung_id` | Ganzzahl | Kennung, mit der niemand rechnet; mit führenden Nullen Text. |
  | PLZ, Telefonnummer, Artikelnummer | Text | `01067` ist eine Dresdner PLZ, `1067` nicht. |
  | `bestelldatum` | Datum, als Text im ISO-Format `2026-03-14` | Sortiert auch als Text richtig. |
  | `menge` | Ganzzahl | Stückzahlen. |
  | `einzelpreis`, `versandkosten` | Dezimalzahl, EUR netto | Die Einheit steht im Datenwörterbuch, nicht als „€“ in der Zelle. |
  | `aktiv` | 0 oder 1 | Nicht „ja“, „x“ und leer gemischt. |

  Ein fehlender Wert ist keine Null. Versandkosten `0` heißen „kostenloser Versand“, ein leeres Feld „unbekannt“. Wer Lücken mit 0 füllt, senkt jeden Durchschnitt.

  Jedes Werkzeug behandelt Typen anders. Excel speichert ein Datum als fortlaufende Zahl – der 14.03.2026 ist intern `46095` – und formatiert sie nur als Datum ([Datumssysteme in Excel](https://support.microsoft.com/de-de/office/datumssysteme-in-excel-e7fe7167-48a9-4b96-bb53-5612a800b487)). SQLite hat keinen Datumstyp; seine Datumsfunktionen verstehen ISO-Text wie `2026-03-14`, aber kein `14.03.2026`. Außerdem wandelt SQLite Werte beim Speichern je nach **Typaffinität** der Spalte um ([Type Affinity](https://www.sqlite.org/datatype3.html#type_affinity)):

  ```sql run
  CREATE TABLE kunden_import (kunde_nr INTEGER, plz_zahl INTEGER, plz_text TEXT, datum TEXT);
  INSERT INTO kunden_import VALUES ('00042', '01067', '01067', '14.03.2026');
  SELECT kunde_nr, plz_zahl, plz_text, typeof(plz_zahl) AS typ FROM kunden_import;
  SELECT date(datum) AS datum_de, date('2026-03-14', '+1 month') AS iso_plus_monat FROM kunden_import;
  ```

  Die `INTEGER`-Spalten machen aus `'00042'` die Zahl `42` und aus `'01067'` die `1067` – die führenden Nullen sind weg. Die Datumsfunktion liefert für `14.03.2026` `NULL` und rechnet mit dem ISO-Datum korrekt einen Monat weiter. PostgreSQL hat echte Typen wie `date` und `numeric` und lehnt unpassende Werte beim Einfügen mit einem Fehler ab, statt sie umzuwandeln.

  ## Häufige Fehler

  - **Granularität nicht geklärt.** Summen sind zu hoch, weil Versandkosten je Position wiederholt wurden. Frag vor jeder Summe: Auf welcher Ebene lebt diese Zahl?
  - **Name als Schlüssel.** Zwei Kunden gleichen Namens verschmelzen, eine Umbenennung bricht jeden Verweis. Nimm eine Kennung.
  - **Schlüssel nicht geprüft.** Steht ein Kunde doppelt in `kunden`, verdoppelt ein SQL-Join seine Bestellungen, und `XVERWEIS` nimmt still den ersten Treffer.
  - **Zusammengesetzten Schlüssel halbiert.** Wer in `positionen` nur `bestellung_id` als Schlüssel nimmt, verliert beim Import die zweite Position oder meldet korrekte Bestellungen als Dubletten.
  - **Kennungen als Zahl.** PLZ und Artikelnummern verlieren führende Nullen. Führe sie als Text.
  - **Monate als Spalten in der Datenbasis.** Jede Formel und Abfrage muss nächsten Monat angepasst werden.
  - **Leer und 0 verwechselt.** Ein unbekannter Wert ist keine Null; wer auffüllt, verfälscht Durchschnitte.

  ## Zusammenfassung

  - Analyse folgt dem Ablauf Frage → Daten → Bereinigen → Prüfen → Auswerten → Kommunizieren. Die Form der Daten entscheidet, wie teuer Bereinigen und Prüfen sind.
  - Saubere Tabellen: jede Variable eine Spalte, jede Beobachtung eine Zeile, jede Beobachtungseinheit eine Tabelle.
  - Verbundene Zellen, Zwischensummen, Farbe als Information, Mehrfachwerte, Leerzeilen und mehrzeilige Überschriften erzeugen jeden Monat Handarbeit.
  - Die Granularität beantwortet „Was ist eine Zeile?“. Kennzahlen einer gröberen Ebene werden auf einer feineren nicht summiert.
  - Primärschlüssel identifizieren Zeilen, Fremdschlüssel verbinden Tabellen, zusammengesetzte Schlüssel wie `(bestellung_id, position)` bilden die Granularität ab.
  - Faktentabellen speichern Ereignisse und Kennzahlen, Dimensionstabellen beschreiben Kunden, Produkte und Tage – zusammen ein Sternschema.
  - Lang ist das Format für Daten, breit das für Berichte. Entpivotieren geht mit `UNION ALL` oder Power Query.
  - Datentypen folgen der Bedeutung: Kennungen und PLZ als Text, Datum im ISO-Format, Beträge ohne Einheit, leer ist nicht 0.
exercises:
  - id: granularitaet-bestimmen
    type: choice
    title: Was ist hier eine Zeile?
    prompt: |
      Das Shopsystem von Bohnenwerk liefert diesen Export:

      | bestellung_id | position | bestelldatum | kunde_id | produkt_id | menge | versandkosten |
      | --- | --- | --- | --- | --- | --- | --- |
      | 1001 | 1 | 2026-03-02 | 1 | 10 | 5 | 0,00 |
      | 1001 | 2 | 2026-03-02 | 1 | 11 | 4 | 0,00 |
      | 1002 | 1 | 2026-03-05 | 3 | 10 | 1 | 4,90 |
      | 1002 | 2 | 2026-03-05 | 3 | 12 | 1 | 4,90 |
      | 1003 | 1 | 2026-03-09 | 2 | 11 | 10 | 6,50 |

      Welcher Satz beschreibt die Granularität dieser Tabelle, und welcher Schlüssel passt dazu?
    options:
      - text: Eine Zeile ist ein Produkt innerhalb einer Bestellung; Schlüssel ist `(bestellung_id, position)`.
        correct: true
        why: Jede Kombination aus Bestellung und Position kommt genau einmal vor, und jede Zeile beschreibt genau ein Produkt einer Bestellung.
      - text: Eine Zeile ist eine Bestellung; Schlüssel ist `bestellung_id`.
        correct: false
        why: Die Bestellungen 1001 und 1002 stehen je zweimal da. `bestellung_id` allein ist hier nicht eindeutig.
      - text: Eine Zeile ist ein Produkt; Schlüssel ist `produkt_id`.
        correct: false
        why: Produkt 10 kommt in zwei Bestellungen vor. Eine Produkttabelle hätte eine Zeile je Produkt und keine Bestellnummern.
      - text: Eine Zeile ist ein Einkauf eines Kunden an einem Tag; Schlüssel ist `(kunde_id, bestelldatum)`.
        correct: false
        why: Kunde 1 hat am 2. März zwei Zeilen. Außerdem könnte ein Kunde an einem Tag zweimal bestellen – die Kombination ist fachlich kein Schlüssel.
    explanation: |
      Die Granularität liest du am Schlüssel ab: Erst `bestellung_id` und `position` zusammen machen eine Zeile eindeutig, also ist eine Zeile eine Bestellposition. Die Spalte `versandkosten` gehört aber zur gröberen Ebene der Bestellung und wird je Position wiederholt. Wer sie summiert, zählt die 4,90 € der Bestellung 1002 doppelt. Das Bestelldatum ist dagegen ein Attribut, das gefahrlos an jeder Position stehen darf.
    hints:
      - Welche Spalte oder Spaltenkombination wiederholt sich in keiner Zeile?
      - Prüfe `bestellung_id` allein – kommt ein Wert mehrfach vor?
    resources:
      - title: Microsoft Learn · Faktentabellen und Granularität
        url: https://learn.microsoft.com/de-de/power-bi/guidance/star-schema

  - id: analyse-workflow
    type: order
    title: Von der Frage zur Mail an den Vertriebsleiter
    prompt: Der Vertriebsleiter will wissen, welche Region im März 2026 den höchsten Nettoumsatz mit Büros hatte. Bring die Arbeitsschritte in die Reihenfolge des Analyse-Workflows.
    lang: text
    lines: |
      Klären, ob Nettoumsatz ohne Versandkosten und nur bezahlte Bestellungen gemeint sind
      Bestellungen, Positionen und Kunden für März aus dem Shopsystem exportieren
      Encoding, Dezimalkomma und uneinheitliche Regionsnamen im Export korrigieren
      Zeilenzahl und Umsatzsumme mit dem Monatsabschluss des Shopsystems abgleichen
      Nettoumsatz je Region für das Segment Büro berechnen und vergleichen
      Ergebnis als Aussage mit Zahl und Vergleich an den Vertriebsleiter schicken
    explanation: |
      Die Schritte heißen Frage klären, Daten beschaffen, Bereinigen, Prüfen, Auswerten und Kommunizieren. Die Frage kommt zuerst, weil sie festlegt, welche Daten in welcher Granularität gebraucht werden – ohne Klärung von „Nettoumsatz“ rechnest du vielleicht Versandkosten oder Stornos mit. Geprüft wird nach dem Bereinigen, denn erst die bereinigten Daten sollen mit dem Quellsystem übereinstimmen. Und erst geprüfte Daten sind es wert, ausgewertet und verschickt zu werden.
    hints:
      - Was muss feststehen, bevor du weißt, welche Daten du exportierst?
      - Den Abgleich mit dem Quellsystem machst du mit den Daten, die du auch auswerten willst.

  - id: tidy-verstoesse
    type: choice
    title: Welche Tabelle ist nicht sauber?
    prompt: Welche dieser Tabellen verletzen die Regeln sauberer Tabellen (jede Variable eine Spalte, jede Beobachtung eine Zeile, jede Beobachtungseinheit eine Tabelle)?
    options:
      - text: Eine Kundenliste mit der Spalte `produkte`, in der „Espresso Classico, Handfilter Keramik“ steht.
        correct: true
        why: Mehrere Werte in einer Zelle. Man kann weder zählen, wie viele Kunden Handfilter kaufen, noch die Produkte mit der Produkttabelle verknüpfen.
      - text: Eine Umsatztabelle mit den Spalten `produkt`, `jan`, `feb`, `mrz`.
        correct: true
        why: Die Variable „Monat“ steckt in den Spaltennamen. Für einen Bericht ist das in Ordnung, als Datenbasis braucht es eine Spalte `monat`.
      - text: Eine Bestellliste, in der stornierte Bestellungen rot markiert sind; eine Statusspalte gibt es nicht.
        correct: true
        why: Die Information steckt nur in der Formatierung. Formeln, PivotTables und jeder Export verlieren sie.
      - text: Eine Tabelle `kunden`, in der die Region „West“ in vielen Zeilen wiederholt wird.
        correct: false
        why: Jeder Kunde ist eine Beobachtung, die Region eine Variable. Dass derselbe Wert oft vorkommt, ist normal und kein Grund, Zellen zu verbinden.
      - text: Eine Tabelle `positionen` mit `bestellung_id`, `position`, `produkt_id`, `menge`, `einzelpreis` und `rabatt`.
        correct: false
        why: Eine Zeile ist eine Bestellposition, jede Spalte eine Variable dieser Position. Das ist die saubere Form.
    explanation: |
      Saubere Tabellen verlangen eine Variable je Spalte, eine Beobachtung je Zeile und eine Beobachtungseinheit je Tabelle. Mehrfachwerte, Variablen in Spaltennamen und Informationen in Farben brechen diese Regeln und machen jede Auswertung zur Handarbeit. Wiederholte Werte in einer Spalte sind dagegen kein Problem – sie sind der Preis dafür, dass jede Zeile für sich vollständig ist.
    resources:
      - title: pandas · How to reshape the layout of tables
        url: https://pandas.pydata.org/docs/getting_started/intro_tutorials/07_reshape_table_layout.html
      - title: Microsoft Support · Übersicht zu Excel-Tabellen
        url: https://support.microsoft.com/de-de/excel/overview-of-excel-tables

  - id: versandkosten-doppelt
    type: output
    title: Wie viel Versand steckt im Join?
    prompt: |
      Was gibt dieses SQL aus? Erwartet ist die Ausgabe der `sqlite3`-Kommandozeile: je Ergebniszeile eine Zeile, Werte durch `|` getrennt, keine Kopfzeile, Kommazahlen mit Punkt (`3.0`, `12.5`).
    lang: sql
    code: |
      CREATE TABLE bestellungen (bestellung_id INTEGER PRIMARY KEY, versandkosten REAL);
      INSERT INTO bestellungen VALUES (2001, 4.5), (2002, 0.0), (2003, 6.0), (2004, 4.5);
      CREATE TABLE positionen (bestellung_id INTEGER, position INTEGER, menge INTEGER,
        PRIMARY KEY (bestellung_id, position));
      INSERT INTO positionen VALUES (2001, 1, 2), (2001, 2, 1), (2002, 1, 12), (2002, 2, 6),
        (2002, 3, 6), (2003, 1, 1), (2004, 1, 3), (2004, 2, 1);
      SELECT COUNT(*), SUM(versandkosten) FROM bestellungen;
      SELECT COUNT(*), SUM(b.versandkosten), SUM(p.menge)
      FROM bestellungen AS b
      JOIN positionen AS p ON p.bestellung_id = b.bestellung_id;
    expected: |
      4|15.0
      8|24.0|32
    explanation: |
      Die erste Abfrage arbeitet auf der Ebene der Bestellungen: vier Zeilen, Versandkosten 4,50 + 0 + 6 + 4,50 = 15 €. Nach dem Join hat das Ergebnis die Granularität der Positionen, also acht Zeilen. Jede Bestellung steht so oft da, wie sie Positionen hat: 2001 und 2004 je zweimal (je 9 €), 2002 dreimal (0 €), 2003 einmal (6 €) – zusammen 24 €. Die Menge lebt auf Positionsebene, deshalb ist ihre Summe 32 richtig. Genau diese Mischung aus einer richtigen und einer falschen Summe macht den Fehler im Alltag so schwer sichtbar.
    hints:
      - Wie viele Positionen hat jede Bestellung?
      - Jede Zeile des Joins trägt die Versandkosten ihrer Bestellung.
    resources:
      - title: SQLite · SELECT (Joins)
        url: https://www.sqlite.org/lang_select.html#fromclause
      - title: SQLite · sum()
        url: https://www.sqlite.org/lang_aggfunc.html#sumunc

  - id: typaffinitaet
    type: output
    title: Was SQLite beim Import aus Werten macht
    prompt: |
      Ein Artikelexport wird in eine SQLite-Tabelle geladen. Alle Werte kommen als Text an. Was gibt das SQL aus? Format wie in der `sqlite3`-Kommandozeile: Werte durch `|` getrennt, keine Kopfzeile, `NULL` als leerer Wert, Kommazahlen mit Punkt.
    lang: sql
    code: |
      CREATE TABLE import (artikel_nr TEXT, menge INTEGER, preis REAL);
      INSERT INTO import VALUES ('0012', '3', '4,90');
      SELECT artikel_nr, menge, typeof(menge), preis, typeof(preis) FROM import;
      SELECT menge * 2, preis * 2 FROM import;
    expected: |
      0012|3|integer|4,90|text
      6|8
    explanation: |
      Jede Spalte hat eine Typaffinität. `artikel_nr` ist `TEXT` und behält die führenden Nullen. `menge` hat Affinität `INTEGER`, der Text `'3'` sieht wie eine Zahl aus und wird als Ganzzahl gespeichert. `'4,90'` ist wegen des Kommas keine gültige Zahl, also bleibt der Wert in der `REAL`-Spalte Text. Beim Rechnen liest SQLite aus dem Text den längsten Anfang, der wie eine Zahl aussieht – `4` – und liefert `8` statt `9.8`, ohne Fehler. Deshalb wird das Dezimalkomma vor dem Laden umgewandelt, nicht danach.
    hints:
      - Welche der drei Werte sehen für SQLite wie eine Zahl aus?
      - "`typeof` zeigt den gespeicherten Typ des Werts, nicht den deklarierten Typ der Spalte."
    resources:
      - title: SQLite · Type Affinity
        url: https://www.sqlite.org/datatype3.html#type_affinity

  - id: schluessel-anlegen
    type: gap
    title: Schlüssel, die die Datenbank prüft
    prompt: |
      Ergänze das Schema so, dass SQLite Fremdschlüssel prüft, `kunde_id` die Kunden eindeutig identifiziert und jede Bestellung auf einen existierenden Kunden verweisen muss.
    lang: sql
    code: |
      PRAGMA ⟦foreign_keys⟧ = ON;

      CREATE TABLE kunden (
        kunde_id INTEGER ⟦PRIMARY KEY⟧,
        name TEXT NOT NULL,
        region TEXT NOT NULL CHECK (region IN ('Nord', 'Süd', 'West', 'Ost'))
      );

      CREATE TABLE bestellungen (
        bestellung_id INTEGER PRIMARY KEY,
        kunde_id INTEGER NOT NULL ⟦REFERENCES kunden (kunde_id)⟧,
        bestelldatum TEXT NOT NULL
      );
    gaps:
      - label: Pragma
        hint: Der Name der Einstellung, die in SQLite standardmäßig aus ist.
      - label: Kunden-Schlüssel
        hint: Zwei Schlüsselwörter, die „eindeutig und nie leer“ bedeuten.
      - label: Verweis
        hint: Schlüsselwort, Tabelle und in Klammern die Spalte, auf die verwiesen wird.
        accept: ["REFERENCES kunden"]
    explanation: |
      `PRAGMA foreign_keys = ON` schaltet in SQLite die Prüfung der Fremdschlüssel ein; ohne diese Zeile würde `REFERENCES` still ignoriert. `kunde_id INTEGER PRIMARY KEY` macht die Kundennummer zum Primärschlüssel. `REFERENCES kunden (kunde_id)` verlangt, dass jede `kunde_id` in `bestellungen` in `kunden` existiert. Lässt du die Spalte weg, verweist SQLite automatisch auf den Primärschlüssel der Zieltabelle. Der Kunde ist die gröbere Ebene: Ein Kunde hat viele Bestellungen, deshalb steht der Fremdschlüssel in `bestellungen`.
    resources:
      - title: SQLite · Enabling Foreign Key Support
        url: https://www.sqlite.org/foreignkeys.html#fk_enable
      - title: SQLite · PRIMARY KEY constraints
        url: https://www.sqlite.org/lang_createtable.html#primkeyconst

  - id: region-nachschlagen
    type: gap
    title: Die Region aus der Dimension holen
    prompt: |
      In Excel liegen zwei formatierte Tabellen: `Verkaeufe` (eine Zeile je Bestellposition, mit Spalte `kunde_id`) und `Kunden` (eine Zeile je Kunde, mit `kunde_id` und `region`). Ergänze die berechnete Spalte `region` in `Verkaeufe` mit `XVERWEIS` (englisch `XLOOKUP`). Deutsche und englische Schreibweise werden beide akzeptiert.
    lang: excel
    code: |
      =XVERWEIS(⟦[@kunde_id]⟧;⟦Kunden[kunde_id]⟧;⟦Kunden[region]⟧)
    gaps:
      - label: Suchkriterium
        hint: Der Fremdschlüssel in der aktuellen Zeile von `Verkaeufe` – strukturierter Verweis mit `@`.
        accept: ["[@[kunde_id]]", "Verkaeufe[@kunde_id]", "Verkaeufe[@[kunde_id]]"]
      - label: Suchmatrix
        hint: Die Schlüsselspalte der Dimensionstabelle.
      - label: Rückgabematrix
        hint: Die Spalte der Dimension, deren Wert du willst.
    explanation: |
      `XVERWEIS` sucht das Suchkriterium in der Suchmatrix und gibt den Wert derselben Zeile aus der Rückgabematrix zurück. Gesucht wird der Fremdschlüssel der aktuellen Zeile (`[@kunde_id]`) im Primärschlüssel der Dimension (`Kunden[kunde_id]`). Weil `kunde_id` in `Kunden` eindeutig ist, gibt es genau einen Treffer – bei Dubletten nähme `XVERWEIS` still den ersten. Fehlt ein Kunde, erscheint `#NV`: ein Hinweis auf einen Fremdschlüssel ohne Partner, den du nicht mit `WENNFEHLER` (englisch `IFERROR`) verstecken solltest.
    resources:
      - title: Microsoft Support · XVERWEIS (Funktion)
        url: https://support.microsoft.com/de-de/excel/functions/xlookup-function
      - title: Microsoft Support · Strukturierte Verweise in Excel-Tabellen
        url: https://support.microsoft.com/de-de/office/verwenden-von-strukturierten-verweisen-f%C3%BCr-excel-tabellen-f5ed2452-2337-4f71-bed3-c8ae6d2b276e

  - id: doppelte-schluessel
    type: sql
    title: Doppelte Positionen im Import finden
    prompt: |
      Der Positionsexport für März wurde in `positionen_import` geladen, ohne dass die Datenbank Schlüssel prüft. Finde jede Kombination aus `bestellung_id` und `position`, die mehr als einmal vorkommt.

      Spalten: `bestellung_id`, `position`, `anzahl` (wie oft die Kombination vorkommt). Jede doppelte Kombination erscheint genau einmal; die Reihenfolge der Zeilen ist egal.
    schema: |
      CREATE TABLE positionen_import (
        bestellung_id INTEGER, position INTEGER, produkt_id INTEGER,
        menge INTEGER, einzelpreis REAL, rabatt REAL
      );
      INSERT INTO positionen_import VALUES
        (1001, 1, 10, 5, 21.90, 0.1),
        (1001, 2, 11, 4, 16.50, 0.1),
        (1002, 1, 10, 1, 21.90, 0),
        (1002, 2, 12, 1, 18.00, 0),
        (1002, 2, 12, 1, 18.00, 0),
        (1003, 1, 11, 10, 16.50, 0.05),
        (1004, 1, 10, 2, 21.90, 0),
        (1004, 1, 10, 3, 21.90, 0),
        (1005, 1, 13, 1, 24.50, 0);
    starter: |
      SELECT bestellung_id, position
      FROM positionen_import;
    solution: |
      SELECT bestellung_id, position, COUNT(*) AS anzahl
      FROM positionen_import
      GROUP BY bestellung_id, position
      HAVING COUNT(*) > 1;
    explanation: |
      Der Schlüssel der Positionen ist zusammengesetzt, also wird nach beiden Spalten gruppiert. Wer nur nach `bestellung_id` gruppiert, meldet auch 1001 – eine völlig korrekte Bestellung mit zwei Positionen. `HAVING` filtert nach der Gruppierung, `WHERE` könnte `COUNT(*)` noch gar nicht kennen. Die beiden Treffer sind verschieden: 1002/2 ist eine exakte Dublette (der Export lief doppelt), 1004/1 hat zwei verschiedene Mengen – hier muss jemand fachlich klären, welche Zeile stimmt.
    hints:
      - Welche Spalten bilden zusammen den Schlüssel einer Position?
      - "`GROUP BY` nach beiden Schlüsselspalten, dann `COUNT(*)`."
      - "Gruppen filterst du mit `HAVING COUNT(*) > 1`."
    resources:
      - title: SQLite · SELECT · GROUP BY und HAVING
        url: https://www.sqlite.org/lang_select.html#resultset

  - id: monate-entpivotieren
    type: sql
    title: Aus Monatsspalten werden Zeilen
    prompt: |
      Die Produktmanagerin pflegt die Monatsumsätze im breiten Format: eine Spalte je Monat. Die Cold-Brew-Mischung gibt es erst seit Februar; im Januar steht dort `NULL`.

      Forme die Tabelle in das lange Format um. Spalten: `produkt`, `monat` (Text `'2026-01'`, `'2026-02'`, `'2026-03'`) und `umsatz`. Monate ohne Wert (`NULL`) lässt du weg – sie sind kein Umsatz von 0, sondern gar keiner. Die Reihenfolge der Zeilen ist egal.
    schema: |
      CREATE TABLE umsatz_breit (produkt TEXT PRIMARY KEY, jan REAL, feb REAL, mrz REAL);
      INSERT INTO umsatz_breit VALUES
        ('Espresso Classico', 1250.0, 1310.5, 1402.0),
        ('Filter Hausmischung', 830.0, 790.0, 905.5),
        ('Cold Brew Mischung', NULL, 215.0, 380.0);
    starter: |
      SELECT produkt, '2026-01' AS monat, jan AS umsatz
      FROM umsatz_breit;
    solution: |
      SELECT produkt, '2026-01' AS monat, jan AS umsatz FROM umsatz_breit WHERE jan IS NOT NULL
      UNION ALL
      SELECT produkt, '2026-02', feb FROM umsatz_breit WHERE feb IS NOT NULL
      UNION ALL
      SELECT produkt, '2026-03', mrz FROM umsatz_breit WHERE mrz IS NOT NULL;
    explanation: |
      Jede Monatsspalte wird zu einer eigenen Abfrage mit einem festen Text für `monat`, und `UNION ALL` stapelt die Ergebnisse untereinander. Die Spaltennamen des Ergebnisses kommen aus der ersten Abfrage. `UNION` ohne `ALL` würde zusätzlich identische Zeilen entfernen – beim Umformen willst du aber keine Zeile verlieren. Der Filter auf `IS NOT NULL` hält die Unterscheidung zwischen „kein Wert“ und „0“ aufrecht; ein `COALESCE(jan, 0)` hätte der Cold-Brew-Mischung einen Januarumsatz von 0 angedichtet und jeden Monatsdurchschnitt verfälscht.
    hints:
      - Schreib für jeden Monat eine eigene `SELECT`-Abfrage mit einem festen Text als `monat`.
      - "Verbinde die drei Abfragen mit `UNION ALL`."
      - "Jede Teilabfrage bekommt `WHERE <monatsspalte> IS NOT NULL`."
    resources:
      - title: SQLite · Compound SELECT (UNION ALL)
        url: https://www.sqlite.org/lang_select.html#compound
      - title: Microsoft Learn · Entpivotieren von Spalten
        url: https://learn.microsoft.com/de-de/power-query/unpivot-column

  - id: zwischensummen-ignorieren
    type: sql
    title: Die Summenzeilen im Import
    prompt: |
      Leas alte Vertriebsliste wurde als Tabelle `vertrieb_export` geladen. Sie enthält, was in Excel stand: Datenzeilen, Teilergebniszeilen wie „Nord Ergebnis“, eine Leerzeile und das „Gesamtergebnis“. In den Ergebnis- und Leerzeilen ist `kunde` leer (`NULL`).

      Berechne den Umsatz je Region nur aus den Datenzeilen. Spalten: `region` und `umsatz` (auf zwei Nachkommastellen gerundet), größter Umsatz zuerst.
    schema: |
      CREATE TABLE vertrieb_export (zeile INTEGER PRIMARY KEY, region TEXT, kunde TEXT, umsatz REAL);
      INSERT INTO vertrieb_export VALUES
        (1, 'Nord', 'Kanzlei Berger & Partner', 1842.00),
        (2, 'Nord', 'Hafenbüro Schulte', 547.50),
        (3, 'Nord Ergebnis', NULL, 2389.50),
        (4, NULL, NULL, NULL),
        (5, 'West', 'Café Luna', 876.00),
        (6, 'West', 'Café Kranz', 1195.40),
        (7, 'West', 'Tim Albers', 89.90),
        (8, 'West Ergebnis', NULL, 2161.30),
        (9, 'Süd', 'Büro Hofmann', 640.00),
        (10, 'Süd Ergebnis', NULL, 640.00),
        (11, 'Gesamtergebnis', NULL, 5190.80);
    starter: |
      SELECT region, SUM(umsatz) AS umsatz
      FROM vertrieb_export
      GROUP BY region
      ORDER BY umsatz DESC;
    solution: |
      SELECT region, ROUND(SUM(umsatz), 2) AS umsatz
      FROM vertrieb_export
      WHERE kunde IS NOT NULL
      GROUP BY region
      ORDER BY umsatz DESC;
    ordered: true
    explanation: |
      Teilergebnisse sind Ergebnisse, keine Beobachtungen. Solange sie in den Daten stehen, liefert jede Gruppierung zusätzliche Zeilen wie „Gesamtergebnis“, und eine Gesamtsumme über die Spalte wäre dreimal so hoch wie der echte Umsatz. Der Filter `kunde IS NOT NULL` behält genau die Datenzeilen; `region NOT LIKE '%Ergebnis' AND region IS NOT NULL` führt hier zum selben Ergebnis, hängt aber an der Beschriftung. `ROUND` gleicht das Rundungsrauschen der Kommazahlen aus. Dauerhaft löst du das Problem an der Quelle: Summen gehören in die Auswertung, nicht in die Liste.
    hints:
      - Woran erkennst du eine Datenzeile – was haben Ergebnis- und Leerzeilen gemeinsam?
      - "Filtere mit `WHERE kunde IS NOT NULL`, bevor du gruppierst."
    resources:
      - title: Microsoft Support · Teilergebnisse einfügen
        url: https://support.microsoft.com/de-de/office/einf%C3%BCgen-von-teilergebnissen-in-eine-liste-von-daten-auf-einem-arbeitsblatt-7881d256-b4fa-4f81-b71e-b0a3d4a52b3a
      - title: SQLite · Aggregate Functions
        url: https://www.sqlite.org/lang_aggfunc.html

  - id: positionen-schluessel
    type: bug
    title: Die zweite Position kommt nicht an
    prompt: |
      Mit diesem Schema importiert ein Skript jede Nacht die Positionen aus dem Shop. Seit der Umstellung bricht der Import bei der zweiten Position der ersten Bestellung ab:

      ```text
      sqlite3.IntegrityError: UNIQUE constraint failed: positionen.bestellung_id
      ```

      Bestellungen mit nur einer Position kommen problemlos an. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: sql
    code: |
      CREATE TABLE positionen (
        bestellung_id INTEGER NOT NULL REFERENCES bestellungen (bestellung_id),
        position INTEGER NOT NULL,
        produkt_id INTEGER NOT NULL REFERENCES produkte (produkt_id),
        menge INTEGER NOT NULL CHECK (menge > 0),
        einzelpreis REAL NOT NULL,
        rabatt REAL NOT NULL DEFAULT 0 CHECK (rabatt BETWEEN 0 AND 0.2),
        PRIMARY KEY (bestellung_id)
      );
    lines: [8]
    fix:
      - line: 8
        answers:
          - PRIMARY KEY (bestellung_id, position)
          - PRIMARY KEY (position, bestellung_id)
    explanation: |
      Der Primärschlüssel bildet die Granularität der Tabelle ab. Eine Zeile ist ein Produkt innerhalb einer Bestellung, also braucht der Schlüssel beide Spalten. Mit `PRIMARY KEY (bestellung_id)` behauptet das Schema, jede Bestellung habe nur eine Position – die Datenbank setzt genau das durch und lehnt die zweite ab. Bequeme Abhilfen wie `INSERT OR IGNORE` würden die Fehlermeldung beseitigen und stattdessen still Umsatz verlieren.
    hints:
      - Welche Spalten machen eine Position eindeutig?
      - Die Fehlermeldung nennt genau die Spalte, die der Schlüssel prüft.
    resources:
      - title: SQLite · PRIMARY KEY constraints
        url: https://www.sqlite.org/lang_createtable.html#primkeyconst

  - id: vertriebsliste-erklaeren
    type: explain
    title: Warum die Pivot an dieser Liste scheitert
    prompt: |
      Lea fragt dich, warum ihre PivotTable auf dieser Liste falsche Summen und leere Regionen zeigt – „die Daten stehen doch alle drin“. Erkläre ihr, was an der Liste das Auswerten verhindert und wie du sie neu schneiden würdest. So sieht die Liste als CSV aus; Café Luna war grün markiert (Rahmenvertrag).
    lang: csv
    code: |
      Vertrieb 2026 – Großkunden;;;;
      Region;Kunde;Produkte Januar;Umsatz;
      ;;;Jan;Feb
      Nord;Kanzlei Berger & Partner;Espresso (60), Filter (32);1.842,00 €;1.974,00 €
      ;Hafenbüro Schulte;Espresso (25);547,50 €;438,00 €
      Summe Nord;;;2.389,50 €;2.412,00 €
      ;;;;
      West;Café Luna;Espresso (40);876,00 €;876,00 €
    points:
      - Titelzeile und zweizeilige Überschrift verhindern eine eindeutige Kopfzeile; Excel erkennt die Spalten nicht sauber.
      - Die Region steht wegen verbundener Zellen nur in der ersten Zeile, die übrigen Zeilen haben keine Region.
      - Summen- und Leerzeilen stehen zwischen den Daten – die PivotTable zählt die Summen mit, der Datenbereich endet an der Leerzeile.
      - Mehrere Werte in einer Zelle, Einheiten in Zahlenfeldern und Farbe als Information lassen sich nicht auswerten.
      - "Neuer Schnitt: eine Tabelle `kunden` (Region, Rahmenvertrag) und eine lange Tabelle mit einer Zeile je Kunde, Produkt und Monat; Summen entstehen in der PivotTable."
    explanation: |
      Die Liste ist für das Auge gebaut. Es gibt keine einzelne Kopfzeile, sondern einen Titel und zwei Zeilen Überschrift, und die Monate stecken in Spaltennamen. Das Hafenbüro hat keine Region, weil der Wert nur in der ersten Zelle des Verbunds stand. Die Summenzeile „Summe Nord“ ist für die PivotTable eine Region wie jede andere und wird mitaddiert; an der Leerzeile endet der Bereich, den Excel automatisch erkennt. „Espresso (60), Filter (32)“ mischt zwei Produkte und ihre Mengen in einer Zelle, „1.842,00 €“ ist Text statt Zahl, und der Rahmenvertrag existiert nur als Farbe.

      Ich würde zwei Tabellen daraus machen: `kunden` mit einer Zeile je Kunde (Kundennummer, Name, Region, Rahmenvertrag als 0/1) und `absatz` mit einer Zeile je Kunde, Produkt und Monat (Menge, Umsatz als Zahl). Dann ist die alte Liste nur noch eine Ansicht: eine PivotTable mit Regionen in den Zeilen, Monaten in den Spalten und Teilergebnissen, die sich beim Aktualisieren selbst rechnen.
    resources:
      - title: Microsoft Support · Verbinden von Zellen und Aufheben des Zellverbunds
        url: https://support.microsoft.com/de-de/office/verbinden-von-zellen-und-aufheben-des-zellverbunds-5cbd15d5-9375-4540-907f-c673a93fcedf
      - title: Microsoft Support · Übersicht zu Excel-Tabellen
        url: https://support.microsoft.com/de-de/excel/overview-of-excel-tables

  - id: schluessel-pruefen
    type: code
    title: Repariere die Schlüsselprüfung
    prompt: |
      Ein Kollege hat `doppelte_schluessel(zeilen, spalten)` geschrieben, um Exporte vor dem Laden zu prüfen. `zeilen` ist eine Liste von Dictionaries, `spalten` eine Liste der Spaltennamen, die zusammen den Schlüssel bilden. Seine Version schaut nur auf die erste Schlüsselspalte. Korrigiere die Funktion:

      - Der Schlüssel einer Zeile ist das Tupel aller Schlüsselspalten, etwa `(1001, 2)` für `["bestellung_id", "position"]`.
      - Rückgabe: jeder Schlüssel, der mehr als einmal vorkommt, genau einmal, aufsteigend sortiert. Ohne Dubletten eine leere Liste.
      - Fehlt ein Schlüsselteil (Spalte fehlt, `None` oder Text, der nur aus Leerraum besteht), löst die Funktion `ValueError` aus. Die Meldung nennt die Zeilennummer, gezählt ab 1 („Zeile 2“).
    lang: python
    starter: |
      def doppelte_schluessel(zeilen: list[dict], spalten: list[str]) -> list[tuple]:
          gesehen = set()
          doppelt = []
          for zeile in zeilen:
              schluessel = zeile[spalten[0]]
              if schluessel in gesehen:
                  doppelt.append(schluessel)
              gesehen.add(schluessel)
          return doppelt
    solution: |
      from collections import Counter


      def doppelte_schluessel(zeilen: list[dict], spalten: list[str]) -> list[tuple]:
          anzahl = Counter()
          for nummer, zeile in enumerate(zeilen, start=1):
              schluessel = tuple(zeile.get(spalte) for spalte in spalten)
              for teil in schluessel:
                  if teil is None or (isinstance(teil, str) and not teil.strip()):
                      raise ValueError(f"Zeile {nummer}: Schlüssel {spalten} ist unvollständig")
              anzahl[schluessel] += 1
          return sorted(schluessel for schluessel, n in anzahl.items() if n > 1)
    tests:
      - name: Eindeutiger einfacher Schlüssel
        code: |
          kunden = [{"kunde_id": 1}, {"kunde_id": 2}, {"kunde_id": 3}]
          ergebnis = doppelte_schluessel(kunden, ["kunde_id"])
          assert ergebnis == [], f"erwartet [], bekommen {ergebnis!r}"
      - name: Jede Dublette genau einmal, als Tupel
        code: |
          kunden = [{"kunde_id": 1}, {"kunde_id": 3}, {"kunde_id": 3}, {"kunde_id": 3}]
          ergebnis = doppelte_schluessel(kunden, ["kunde_id"])
          assert ergebnis == [(3,)], f"erwartet [(3,)] – jeder Schlüssel einmal, als Tupel; bekommen {ergebnis!r}"
      - name: Zusammengesetzter Schlüssel ohne Dubletten
        code: |
          positionen = [
              {"bestellung_id": 1001, "position": 1},
              {"bestellung_id": 1001, "position": 2},
              {"bestellung_id": 1002, "position": 1},
          ]
          ergebnis = doppelte_schluessel(positionen, ["bestellung_id", "position"])
          assert ergebnis == [], f"1001/1 und 1001/2 sind verschiedene Positionen – erwartet [], bekommen {ergebnis!r}"
      - name: Zusammengesetzter Schlüssel mit Dubletten, sortiert
        code: |
          positionen = [
              {"bestellung_id": 1002, "position": 1},
              {"bestellung_id": 1001, "position": 2},
              {"bestellung_id": 1001, "position": 1},
              {"bestellung_id": 1001, "position": 2},
              {"bestellung_id": 1002, "position": 1},
              {"bestellung_id": 1002, "position": 1},
          ]
          ergebnis = doppelte_schluessel(positionen, ["bestellung_id", "position"])
          assert ergebnis == [(1001, 2), (1002, 1)], f"erwartet [(1001, 2), (1002, 1)], bekommen {ergebnis!r}"
      - name: Unvollständiger Schlüssel ist ein Fehler
        code: |
          for kaputt in [None, "", "  "]:
              zeilen = [{"bestellung_id": 1001, "position": 1}, {"bestellung_id": kaputt, "position": 2}]
              try:
                  doppelte_schluessel(zeilen, ["bestellung_id", "position"])
              except ValueError as fehler:
                  assert "Zeile 2" in str(fehler), f"Die Meldung soll die Zeile nennen, bekommen: {fehler}"
              else:
                  assert False, f"bestellung_id={kaputt!r} muss einen ValueError auslösen"
          try:
              doppelte_schluessel([{"position": 1}], ["bestellung_id", "position"])
          except ValueError:
              pass
          else:
              assert False, "Eine fehlende Schlüsselspalte muss einen ValueError auslösen"
      - name: Leerer Export
        code: |
          assert doppelte_schluessel([], ["kunde_id"]) == [], "Ohne Zeilen gibt es keine Dubletten"
    explanation: |
      Der Schlüssel einer Zeile ist das Tupel aller Schlüsselspalten; nur so bleiben 1001/1 und 1001/2 verschiedene Positionen. `Counter` zählt jeden Schlüssel, danach bleiben die mit mehr als einem Vorkommen – so erscheint eine dreifache Dublette nur einmal. Ein leerer Schlüsselteil ist kein Sonderfall, den man überspringt, sondern ein Fehler: Ein Primärschlüssel darf nie leer sein, und still übergangene Zeilen fehlen später in jeder Summe. `zeile.get` statt `zeile[...]` macht aus einer fehlenden Spalte ebenfalls `None` und damit einen verständlichen `ValueError` statt eines `KeyError`.
    hints:
      - Bilde den Schlüssel mit `tuple(zeile.get(spalte) for spalte in spalten)`.
      - "`collections.Counter` zählt Schlüssel; danach filterst du auf `n > 1` und sortierst."
      - "`enumerate(zeilen, start=1)` liefert die Zeilennummer für die Fehlermeldung."
    resources:
      - title: Python · collections.Counter
        url: https://docs.python.org/3/library/collections.html#collections.Counter

  - id: grosskundenliste-umbauen
    type: practice
    title: Die Großkundenliste neu schneiden
    prompt: |
      Lea gibt dir die Mengenliste ihrer Großkunden. In Excel sieht sie so aus: „Nord“ und „West“ stehen in verbundenen Zellen über ihren Kunden, der Kundenname steht nur in der ersten Zeile seiner Produkte, Kunden mit Rahmenvertrag sind grün markiert (Kanzlei Berger & Partner, Café Luna), und nach jeder Region folgt eine Summenzeile.

      | Region | Kunde | Produkt | Jan | Feb |
      | --- | --- | --- | --- | --- |
      | Nord | Kanzlei Berger & Partner | Espresso Classico | 60 | 60 |
      | | | Filter Hausmischung | 32 | 40 |
      | | Hafenbüro Schulte | Espresso Classico | 25 | 20 |
      | Summe Nord | | | 117 | 120 |
      | West | Café Luna | Espresso Classico | 40 | 40 |
      | | | Handfilter Keramik | 6 | 0 |
      | Summe West | | | 46 | 40 |

      Entwirf in SQLite ein sauberes Modell: Tabellen mit Granularitätssatz als Kommentar, Primär- und Fremdschlüsseln und passenden Typen. Lade die Daten und schreib eine Abfrage, die die Summenzeilen der alten Liste (Menge je Region und Monat) aus den Daten berechnet. Probiere dein Skript in der [SQLite-Shell](https://www.sqlite.org/cli.html) oder in einem der SQL-Blöcke der Lektion aus.
    lang: sql
    starter: |
      PRAGMA foreign_keys = ON;

      -- kunden: eine Zeile ist …
      -- produkte: eine Zeile ist …
      -- absatz: eine Zeile ist …
    solution: |
      PRAGMA foreign_keys = ON;

      -- kunden: eine Zeile ist ein Kunde
      CREATE TABLE kunden (
        kunde_id INTEGER PRIMARY KEY,
        name TEXT NOT NULL,
        region TEXT NOT NULL CHECK (region IN ('Nord', 'Süd', 'West', 'Ost')),
        rahmenvertrag INTEGER NOT NULL CHECK (rahmenvertrag IN (0, 1))
      );

      -- produkte: eine Zeile ist ein Produkt im Sortiment
      CREATE TABLE produkte (
        produkt_id INTEGER PRIMARY KEY,
        name TEXT NOT NULL UNIQUE
      );

      -- absatz: eine Zeile ist ein Produkt, das ein Kunde in einem Monat gekauft hat
      CREATE TABLE absatz (
        kunde_id INTEGER NOT NULL REFERENCES kunden (kunde_id),
        produkt_id INTEGER NOT NULL REFERENCES produkte (produkt_id),
        monat TEXT NOT NULL,                       -- ISO-Monat, z. B. '2026-01'
        menge INTEGER NOT NULL CHECK (menge > 0),  -- keine Zeile für Monate ohne Kauf
        PRIMARY KEY (kunde_id, produkt_id, monat)
      );

      INSERT INTO kunden VALUES
        (2, 'Kanzlei Berger & Partner', 'Nord', 1),
        (5, 'Hafenbüro Schulte', 'Nord', 0),
        (1, 'Café Luna', 'West', 1);
      INSERT INTO produkte VALUES
        (10, 'Espresso Classico'), (11, 'Filter Hausmischung'), (12, 'Handfilter Keramik');
      INSERT INTO absatz VALUES
        (2, 10, '2026-01', 60), (2, 10, '2026-02', 60),
        (2, 11, '2026-01', 32), (2, 11, '2026-02', 40),
        (5, 10, '2026-01', 25), (5, 10, '2026-02', 20),
        (1, 10, '2026-01', 40), (1, 10, '2026-02', 40),
        (1, 12, '2026-01', 6);

      -- die früheren Summenzeilen, jetzt berechnet
      SELECT k.region, a.monat, SUM(a.menge) AS menge
      FROM absatz AS a
      JOIN kunden AS k ON k.kunde_id = a.kunde_id
      GROUP BY k.region, a.monat
      ORDER BY k.region, a.monat;
    checklist:
      - Über jeder Tabelle steht ein Granularitätssatz („Eine Zeile ist …“).
      - "`kunden` enthält Region und Rahmenvertrag (vorher Zellverbund und Farbe) genau einmal je Kunde; Primärschlüssel ist eine Kundennummer, nicht der Name."
      - "Die Absatztabelle ist lang: Der Monat ist eine Spalte mit ISO-Text wie `'2026-01'`, und der Primärschlüssel umfasst Kunde, Produkt und Monat."
      - Die Tabellen enthalten keine Summenzeilen, keine leeren Regionen und keine Einheiten in Zahlenfeldern.
      - "Deine Abfrage liefert die alten Summen: Nord 117 und 120, West 46 und 40."
      - Du hast entschieden und begründet, ob die 0 beim Handfilter im Februar eine eigene Zeile wird.
    explanation: |
      Die Farbe und die verbundenen Zellen beschreiben Eigenschaften der Kunden, also landen Region und Rahmenvertrag in der Dimension `kunden` – je Kunde einmal. Die Mengen sind Fakten mit der Granularität „Kunde, Produkt, Monat“, genau das ist der zusammengesetzte Primärschlüssel. Die Monate wandern aus den Spaltennamen in eine Spalte `monat`; im März kommen neue Zeilen dazu, das Schema bleibt. Die 0 beim Handfilter im Februar kann man als Zeile speichern oder weglassen; die Musterlösung lässt sie weg, weil ein nicht stattgefundener Kauf keine Beobachtung ist, und sichert das mit `CHECK (menge > 0)` ab. Wichtig ist, dass die Entscheidung dokumentiert ist. Die Summenzeilen sind jetzt eine Abfrage und stimmen nach jeder Änderung automatisch.
    resources:
      - title: Microsoft Learn · Sternschema
        url: https://learn.microsoft.com/de-de/power-bi/guidance/star-schema
      - title: SQLite · CREATE TABLE
        url: https://www.sqlite.org/lang_createtable.html
