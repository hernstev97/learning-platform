lesson: |
  Am ersten Arbeitstag jedes Monats schickt das Controlling von Bohnenwerk den Monatsbericht an die Geschäftsführung. Bisher heißt das: PivotTable aktualisieren, Diagramm kopieren, Farben neu setzen, die Achse korrigieren, die Excel wieder „optimiert“ hat, Titel tippen, alles in die Präsentation einfügen. Das dauert rund 45 Minuten, und in der Besprechung fragt trotzdem jemand, was die Grafik eigentlich zeigen soll. Die Geschäftsführung schaut jede Folie vielleicht eine halbe Minute an. In dieser Zeit muss ein Diagramm eine Frage beantworten – und zwar so, dass die Antwort den Zahlen standhält.

  Dieses Modul behandelt zwei Seiten. Erstens Regeln, mit denen ein Diagramm überzeugt, weil es die Daten nicht verzerrt: Diagrammart nach Frage, ehrliche Achsen, sparsame Farbe, Beschriftung und Titel als Aussage. Zweitens den Weg dorthin als wiederholbaren Prozess: Die Daten werden mit pandas oder Excel-Formeln diagrammfertig vorbereitet, das Diagramm selbst ist eine Vorlage, die nur noch aktualisiert wird. matplotlib, die übliche Zeichenbibliothek für Python, läuft im Browser nicht. Plot-Code steht deshalb als Beispiel zum lokalen Ausführen da. Ausführbar ist alles, was vor dem Zeichnen passiert – und dort entstehen die meisten Fehler.

  ## Die Frage bestimmt das Diagramm

  Ein Diagramm übersetzt Zahlen in sichtbare Merkmale: Position, Länge, Winkel, Fläche, Farbe. Menschen lesen diese Merkmale unterschiedlich genau. Die Statistiker William Cleveland und Robert McGill haben das 1984 in Experimenten gemessen: Positionen auf einer gemeinsamen Skala werden am genauesten verglichen, danach folgen Längen und Winkel, deutlich schlechter Flächen – das Material von Blasendiagrammen –, am schlechtesten Farbabstufungen. In ihren Versuchen schnitten Positionsvergleiche wie im Balkendiagramm klar besser ab als Winkelvergleiche im Kreisdiagramm. Daraus folgt die wichtigste Regel dieses Moduls: **Das, was die Frage vergleicht, gehört auf die genaueste Kodierung** – meist Position oder Länge. Erst die Frage, dann das Diagramm.

  | Frage | Beispiel bei Bohnenwerk | Diagramm | Warum |
  | --- | --- | --- | --- |
  | Vergleich | Welche Kategorie setzt am meisten um? | Balken, sortiert; horizontal bei langen Namen | Längen ab gemeinsamer Nulllinie |
  | Verlauf | Wie entwickelt sich der Shop-Umsatz seit Januar? | Linie, Zeit auf der x-Achse | Steigung zeigt Veränderung |
  | Verteilung | Gibt es viele kleine und wenige große Bestellungen? | Histogramm, Boxplot | zeigt Form, Streuung, Ausreißer |
  | Zusammenhang | Bestellen Kunden mit vielen Tickets weniger? | Streudiagramm | jede Beobachtung ist ein Punkt |
  | Anteil | Wie verteilt sich der B2B-Umsatz auf Büros und Cafés? | 100-%-gestapelte Balken, bei zwei bis drei Teilen auch Kreis | Teile eines Ganzen |

  Ein Kreisdiagramm kodiert über Winkel und Fläche. Mit zwei oder drei deutlich verschiedenen Teilen funktioniert das. Mit acht Produkten oder beim Vergleich mehrerer Kreise nebeneinander rät das Auge. Dann sind sortierte Balken besser. Für die Verteilung genügt ein Durchschnitt nicht: Ein mittlerer Bestellwert von 85 € kann aus lauter 85-€-Bestellungen entstehen oder aus vielen 20-€-Bestellungen und wenigen Großaufträgen ([Deskriptive Statistik](/data/deskriptive-statistik)). Und manchmal ist gar kein Diagramm die beste Wahl: Zwei Zahlen schreibst du besser als Satz. Die Microsoft-Übersicht [Verfügbare Diagrammtypen in Office](https://support.microsoft.com/de-de/office/verf%C3%BCgbare-diagrammtypen-in-office-a6187218-807e-4103-9e0a-27cdb19afb90) zeigt, wie die Daten für jeden Excel-Diagrammtyp angeordnet sein müssen.

  ## Balken beginnen bei null

  Ein Balken kodiert seinen Wert durch seine **Länge**. Beginnt die Achse bei 95 000 €, zeigt die Länge nicht mehr den Umsatz, sondern den Umsatz minus 95 000 €. Kleine Unterschiede wirken dann riesig:

  ```python run
  nord, sued = 102_000, 98_000   # Umsatz Q3 2026 in EUR netto
  achse_ab = 95_000              # Achse beginnt hier statt bei 0

  echt = nord / sued
  sichtbar = (nord - achse_ab) / (sued - achse_ab)
  print(f"Nord liegt {echt - 1:.0%} vor Süd.")
  print(f"Der Nord-Balken ist {sichtbar:.1f}-mal so lang wie der Süd-Balken.")
  ```

  Der Unterschied von 4 % erscheint als Balken, der mehr als doppelt so lang ist. Niemand hat gelogen – die Achse hat es getan. Excel legt Minimum und Maximum der Größenachse standardmäßig selbst fest und beginnt bei eng beieinanderliegenden Werten nicht immer bei null. Prüfe deshalb jedes Säulen- und Balkendiagramm: Rechtsklick auf die Größenachse › Achse formatieren › Achsenoptionen, Feld „Minimum“ auf `0` ([Ändern der Skalierung der vertikalen Achse](https://support.microsoft.com/de-de/office/%C3%A4ndern-der-skalierung-der-vertikalen-achse-gr%C3%B6%C3%9Fenachse-in-einem-diagramm-05973661-e56a-4486-a9f3-f9ce41df0021)).

  Linien funktionieren anders. Sie kodieren über Position und Steigung, nicht über Länge. Eine Linie für die tägliche Ticketzahl darf auf den Bereich 40 bis 90 zoomen, wenn es um Schwankungen geht – die Achse muss dann aber gut sichtbar beschriftet sein. Flächendiagramme sind wieder Längen und brauchen die Nulllinie.

  > [!MERKE]
  > Balken, Säulen und Flächen beginnen bei null, weil ihre Länge der Wert ist. Linien dürfen einen Ausschnitt zeigen, wenn die Achse deutlich beschriftet ist. Wer einen Unterschied betonen will, zeigt die Differenz als eigenes Diagramm, statt die Achse abzuschneiden.

  Zwei weitere Verzerrungen folgen derselben Logik. **Doppelachsen** – Umsatz links, Tickets rechts, wie im [Verbunddiagramm](https://support.microsoft.com/de-de/office/erstellen-eines-verbunddiagramms-cf2c969a-b11e-4a62-bb8f-da021177452f) mit Sekundärachse – haben zwei frei gewählte Skalen. Wo sich die Linien kreuzen oder wie parallel sie laufen, bestimmt der Mensch, der die Achsen eingestellt hat, nicht die Daten. **Flächen** wie Blasen oder Symbole müssen mit ihrer Fläche proportional zum Wert wachsen. Wer den Radius proportional wählt, vervierfacht die Fläche bei doppeltem Wert.

  ## Farbe, Beschriftung und Titel lenken die Aussage

  **Farbe sparsam.** Grau ist die Standardfarbe, eine kräftige Akzentfarbe markiert das, worüber der Titel spricht. Jede zusätzliche Farbe ist eine Frage an den Leser: „Was bedeutet Blau?“ Mehr als etwa fünf Kategorienfarben lassen sich kaum noch sicher auseinanderhalten; dann hilft Gruppieren oder „Sonstige“. Für geordnete Werte (Umsatz niedrig bis hoch) passt eine sequenzielle Palette in Helligkeitsstufen, für Abweichungen um einen Mittelpunkt (Plan–Ist) eine divergierende. Die matplotlib-Dokumentation erklärt diese Palettentypen und warum wahrnehmungsgleichmäßige Paletten wie `viridis` Helligkeit gleichmäßig steigern ([Choosing Colormaps](https://matplotlib.org/stable/users/explain/colors/colormaps.html)).

  **Barrierearm.** Rot-Grün-Sehschwäche ist die häufigste Farbfehlsichtigkeit, und „Nord rot, Süd grün“ ist für Betroffene eine Farbe. Unterscheide deshalb auch über Helligkeit, beschrifte Linien und Balken direkt und verlass dich nie auf Farbe allein. Microsoft empfiehlt für Excel zusätzlich Alternativtext für Diagramme und kontrastreiche Farben ([Barrierefreie Excel-Dokumente](https://support.microsoft.com/de-de/topic/gestalten-barrierefreier-excel-dokumente-f%C3%BCr-personen-mit-behinderungen-6cc05fc5-1314-48b5-8eb3-683e49b3e593)).

  **Direkt beschriften statt Legende.** Eine Legende zwingt das Auge, zwischen Linie und Erklärung hin- und herzuspringen. Schreib den Namen ans Ende der Linie oder den Wert an den Balken. Sortiere Balken nach Wert, außer die Kategorien haben eine natürliche Reihenfolge wie Monate oder Größenklassen. Einheit, Zeitraum und Quelle gehören in Untertitel oder Fußzeile.

  **Titel als Aussage.** „Umsatz nach Kategorie, September 2026“ beschreibt die Achsen. „Espresso trägt mehr als die Hälfte des Umsatzes“ sagt, was man sehen soll – und ist überprüfbar. Im Monatsprozess darf so ein Titel nicht von Hand getippt werden, sonst stimmt er im Oktober nicht mehr. In Excel verknüpfst du den Diagrammtitel mit einer Zelle: Titel anklicken, in der Bearbeitungsleiste `=` eingeben, die Zelle anklicken, Eingabetaste ([Titel mit einer Zelle verknüpfen](https://support.microsoft.com/de-de/office/edit-titles-or-data-labels-in-a-chart)). Die Zelle berechnet die Aussage aus den Daten:

  ```excel
  =LET(
    sortiert; SORTIEREN(Kategorien; 2; -1);
    spitze; INDEX(sortiert; 1; 1);
    anteil; INDEX(sortiert; 1; 2) / SUMME(Kategorien[Umsatz]);
    spitze & " trägt " & TEXT(anteil; "0 %") & " des Umsatzes"
  )
  ```

  `SORTIEREN` (englisch `SORT`) ordnet die Tabelle `Kategorien` nach der zweiten Spalte absteigend, `LET` gibt Zwischenergebnissen Namen. `SUMME` heißt englisch `SUM`; `INDEX`, `TEXT` und `LET` heißen in beiden Sprachen gleich. Wechselt im nächsten Monat die stärkste Kategorie, wechselt der Titel mit. `SORTIEREN` und `LET` gibt es ab Excel 2021, `ÜBERNEHMEN`, `WEGLASSEN` und `VSTAPELN` ab Excel 2024, `GRUPPIERENNACH` nur in Microsoft 365. Excel 2019 kennt keine davon.

  In matplotlib sehen dieselben Regeln so aus – grau mit einer Akzentfarbe, sortiert, Werte an den Balken statt Gitterlinien, Titel als Aussage ([Axes.bar_label](https://matplotlib.org/stable/api/_as_gen/matplotlib.axes.Axes.bar_label.html)):

  ```python
  import matplotlib.pyplot as plt

  kategorien = ["Espresso", "Filter", "Zubehör"]          # absteigend sortiert
  umsatz = [61_300, 48_900, 9_200]                        # September 2026, EUR netto
  farben = ["#1f5f8b", "#b0b0b0", "#b0b0b0"]              # Akzent nur für die Aussage

  fig, ax = plt.subplots(figsize=(7, 2.8))
  balken = ax.barh(kategorien[::-1], umsatz[::-1], color=farben[::-1])  # größter oben
  ax.bar_label(balken, labels=[f"{w:,.0f} €".replace(",", ".") for w in umsatz[::-1]], padding=4)
  ax.set_xlim(left=0)
  ax.xaxis.set_visible(False)
  ax.spines[["top", "right", "bottom"]].set_visible(False)
  ax.set_title("Espresso trägt mehr als die Hälfte des Umsatzes", loc="left")
  fig.text(0.01, -0.02, "Nettoumsatz September 2026 · Quelle: Webshop und B2B-Rechnungen", fontsize=8)
  fig.savefig("reports/2026-09_kategorien.png", dpi=200, bbox_inches="tight")
  ```

  > [!INTERVIEW] „Wie würdest du dieses Diagramm verbessern?“
  > Ich frage zuerst, welche Frage es beantworten soll, und prüfe dann, ob die Diagrammart dazu passt. Danach die Verzerrungen: Beginnen Balken bei null, gibt es eine zweite Achse, sind Flächen richtig skaliert? Dann Lesbarkeit: sortieren, direkt beschriften statt Legende, Farbe nur für die Aussage, Einheit und Zeitraum nennen. Zum Schluss formuliere ich den Titel als Aussage, die man an den Daten überprüfen kann.

  ## Daten diagrammfertig machen mit pandas

  Die meisten Diagrammprobleme entstehen vor dem Zeichnen: zu viele Kategorien, eine breite Tabelle mit Monaten als Spalten, Reihen in völlig verschiedenen Größenordnungen. Drei Vorbereitungen lösen die häufigsten Fälle. Alle laufen hier im Browser mit pandas; wie `groupby`, `merge` und `melt` im Detail funktionieren, zeigt [pandas: gruppieren, verknüpfen, umformen](/data/pandas-auswertung).

  **Top 5 plus „Sonstige“.** Acht Produkte in acht Farben sind unlesbar. Die fünf größten bleiben einzeln, der Rest wird zu einer Zeile zusammengefasst. „Sonstige“ steht immer am Ende, auch wenn es größer ist als Platz 5 – sonst würde die Sortierung eine Kategorie vortäuschen, die es nicht gibt. Die Summe bleibt dieselbe; das ist die Kontrolle.

  ```python run
  import pandas as pd

  umsatz = pd.Series({
      "Espresso Napoli": 18400.0, "Filter Hausmischung": 15200.0, "Espresso Decaf": 4100.0,
      "Filter Äthiopien": 9800.0, "Handmühle": 2600.0, "Espresso Crema": 12100.0,
      "Filterpapier": 900.0, "Filter Kolumbien": 7300.0,
  })
  sortiert = umsatz.sort_values(ascending=False)
  diagramm = pd.concat([sortiert.head(5), pd.Series({"Sonstige": sortiert.iloc[5:].sum()})])
  print(diagramm)
  print("Summe unverändert:", diagramm.sum() == umsatz.sum())
  ```

  **Lange Form.** Aus Excel kommen Tabellen oft breit: eine Zeile je Region, eine Spalte je Monat. Zeichenbibliotheken, PivotCharts und Small Multiples brauchen dagegen eine Zeile je Datenpunkt und eine Spalte, die Farbe oder Teilbild bestimmt. [`DataFrame.melt`](https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.melt.html) dreht die Monatsspalten in Zeilen:

  ```python run
  import pandas as pd

  breit = pd.DataFrame({
      "region": ["Nord", "Süd", "West"],
      "2026-07": [11200.0, 9400.0, 14100.0],
      "2026-08": [10300.0, 9900.0, 13800.0],
      "2026-09": [12800.0, 10100.0, 15200.0],
  })
  lang = breit.melt(id_vars="region", var_name="monat", value_name="umsatz")
  print(lang.shape)
  print(lang.head(4))
  ```

  **Indexierung auf 100.** Der Shop setzt monatlich rund 8 000 € um, das B2B-Geschäft über 40 000 €. Auf einer gemeinsamen Achse ist die Shop-Linie flach, obwohl sie um 25 % gewachsen ist. Teilst du jede Reihe durch ihren Wert im Basismonat und multiplizierst mit 100, starten alle bei 100 und zeigen relative Entwicklung. Wichtig: `transform("first")` nimmt die erste Zeile **in der aktuellen Reihenfolge** – ohne Sortierung wäre die Basis zufällig ([GroupBy · Transformation](https://pandas.pydata.org/docs/user_guide/groupby.html#transformation)).

  ```python run
  import pandas as pd

  kanaele = pd.DataFrame({
      "monat": ["2026-03", "2026-01", "2026-02", "2026-02", "2026-01", "2026-03"],
      "kanal": ["Shop", "Shop", "Shop", "B2B", "B2B", "B2B"],
      "umsatz": [10000.0, 8000.0, 8800.0, 42500.0, 42000.0, 43700.0],
  })
  kanaele = kanaele.sort_values(["kanal", "monat"])
  basis = kanaele.groupby("kanal")["umsatz"].transform("first")
  kanaele["index"] = (kanaele["umsatz"] / basis * 100).round(1)
  print(kanaele)
  ```

  Excel kann dieselbe Top-5-Vorbereitung als eine Formel mit Überlauf liefern. `ProduktUmsatz` ist ein zweispaltiger Bereich aus Produkt und Umsatz, etwa das Ergebnis von `GRUPPIERENNACH` (englisch `GROUPBY`). Das Ergebnis hat immer sechs Zeilen, also bleibt der Datenbereich des Diagramms jeden Monat gleich groß:

  ```excel
  =LET(
    sortiert; SORTIEREN(ProduktUmsatz; 2; -1);
    top; ÜBERNEHMEN(sortiert; 5);
    rest; SUMME(WEGLASSEN(SPALTENWAHL(sortiert; 2); 5));
    VSTAPELN(top; HSTAPELN("Sonstige"; rest))
  )
  ```

  `ÜBERNEHMEN` (englisch `TAKE`) liefert die ersten fünf Zeilen, `WEGLASSEN` (`DROP`) alle außer den ersten fünf, `SPALTENWAHL` (`CHOOSECOLS`) die Umsatzspalte, `VSTAPELN` und `HSTAPELN` (`VSTACK`, `HSTACK`) setzen das Ergebnis zusammen.

  ## Small Multiples und Dashboards

  Vier Regionen als vier Linien in einem Diagramm ergeben ein Knäuel, in dem jede Linie die anderen kreuzt. **Small Multiples** zeigen dasselbe kleine Diagramm einmal je Region, nebeneinander und mit **derselben y-Achse**. Der Vergleich läuft wieder über Position, und jede Region bleibt lesbar. Die gemeinsame Achse ist der Kern: Mit eigener Achse je Teilbild sieht die kleinste Region so groß aus wie die größte. In matplotlib erledigt das `sharey=True` ([pyplot.subplots](https://matplotlib.org/stable/api/_as_gen/matplotlib.pyplot.subplots.html)); die Daten kommen in langer Form aus dem `melt`-Beispiel.

  ```python
  import matplotlib.pyplot as plt

  regionen = sorted(lang["region"].unique())
  fig, axes = plt.subplots(1, len(regionen), figsize=(10, 2.8), sharex=True, sharey=True)
  for ax, region in zip(axes, regionen):
      teil = lang[lang["region"] == region]
      ax.plot(teil["monat"], teil["umsatz"], color="#1f5f8b")
      ax.set_title(region, loc="left")
      ax.spines[["top", "right"]].set_visible(False)
  axes[0].set_ylim(bottom=0)
  fig.suptitle("Alle Regionen legen im September zu, Nord am stärksten", x=0.01, ha="left")
  fig.savefig("reports/2026-09_regionen.png", dpi=200, bbox_inches="tight")
  ```

  Ein **Dashboard** ist keine Sammlung aller verfügbaren Diagramme, sondern die Antwort auf die Fragen, die jeden Monat wiederkehren. Jede Kennzahl braucht drei Dinge: den **Wert**, den **Kontext** (Verlauf der letzten zwölf Monate, etwa als Sparkline) und einen **Vergleich** (Vormonat, Vorjahresmonat oder Plan). „48 300 €“ allein sagt nichts. „48 300 € · +6,2 % zum Vormonat · 97 % vom Plan“ mit einer kleinen Linie daneben sagt, ob Handlungsbedarf besteht. Excel bietet dafür Sparklines, Minidiagramme in einer Zelle ([Sparklines](https://support.microsoft.com/de-de/office/verwenden-von-sparklines-zum-anzeigen-von-datentrends-1474e169-008c-4783-926b-5c60e620f5ca)). Halte die Anordnung jeden Monat gleich, damit das Auge Kennzahlen an derselben Stelle findet.

  > [!WARNING] Falsche Vergleiche
  > Der Vormonat ist der **Kalendermonat** davor, nicht die vorherige Zeile. Fehlt der August in den Daten, darf September nicht mit Juli verglichen werden. Und ein laufender Monat ist unvollständig: Ein Diagramm mit Stichtag 15. September zeigt einen scheinbaren Einbruch, der keiner ist. Zeig nur abgeschlossene Monate oder kennzeichne den laufenden deutlich.

  ## Vom Handbau zur Vorlage: der Monatsbericht in fünf Minuten

  Die 45 Minuten Handarbeit bei Bohnenwerk entstehen, weil jedes Diagramm jeden Monat neu gebaut wird. Der wiederholbare Weg trennt Daten und Darstellung:

  1. Die Daten kommen per Power Query oder pandas in eine feste Form ([Power Query](/data/power-query)). In Excel liegen sie in einer intelligenten Tabelle, damit ein Diagramm darauf neue Zeilen automatisch übernimmt.
  2. Die Diagrammquelle ist eine Formel, eine PivotTable ([Tabellen und PivotTables](/data/tabellen-pivot)) oder eine pandas-Ausgabe mit fester Form – Top 5 plus „Sonstige“ hat immer sechs Zeilen.
  3. Der Titel hängt an einer Zelle, die die Aussage berechnet.
  4. Das fertig formatierte Diagramm speicherst du per Rechtsklick › Als Vorlage speichern als `.crtx` und wendest es auf neue Diagramme über Diagrammtyp ändern › Vorlagen an ([Diagramm als Vorlage speichern](https://support.microsoft.com/de-de/excel/save-a-custom-chart-as-a-template)).
  5. Die Monatsroutine heißt dann: neue Exporte ablegen, Daten › Alle aktualisieren, Titel und Achsen gegenlesen, exportieren.

  Mit Python ist es dasselbe Prinzip: Eine Funktion bereitet die Daten vor, eine zweite zeichnet mit festem Stil und fester Größe und schreibt PNG-Dateien nach `reports/`. Wie du daraus eine Pipeline machst, die mit demselben Stichtag jederzeit dieselben Bilder erzeugt, zeigt [Reproduzierbare Analyse-Workflows](/data/reproduzierbare-analysen). pandas hat mit `DataFrame.plot` eine Abkürzung zu matplotlib, die für schnelle Blicke während der Analyse reicht; für den Bericht lohnt sich die volle Kontrolle.

  > [!PRAXIS]
  > Bei Bohnenwerk sinkt die Diagrammarbeit im Monatsbericht von 45 auf rund 5 Minuten, und die Diskussion in der Besprechung ändert sich: Statt „Stimmt die Achse?“ geht es um „Warum wächst West?“. Der Nebeneffekt ist wichtiger als die Zeit – ein Diagramm, das nicht mehr von Hand angefasst wird, kann auch nicht versehentlich mit abgeschnittener Achse oder dem Titel vom Vormonat verschickt werden.

  ## Häufige Fehler

  - **Säulen mit abgeschnittener Achse.** Symptom: Kleine Unterschiede wirken dramatisch. Achsenminimum auf 0 setzen oder die Differenz als eigenes Diagramm zeigen.
  - **Kreisdiagramm mit acht Stücken oder in 3D.** Winkel und perspektivisch verzerrte Flächen lassen sich nicht vergleichen. Sortierte Balken, bei Bedarf Top 5 plus „Sonstige“.
  - **Doppelachse suggeriert Zusammenhang.** Zwei Linien laufen „parallel“, weil jemand die Skalen so gewählt hat. Zwei Teilbilder mit gemeinsamer x-Achse oder beide Reihen auf 100 indexieren.
  - **Blasen nach Radius skaliert.** Doppelter Wert erscheint als vierfache Fläche. Die Fläche muss proportional zum Wert sein.
  - **Farbe ohne Bedeutung.** Jede Kategorie in einer anderen Regenbogenfarbe, Rot und Grün nebeneinander. Grau plus eine Akzentfarbe, direkte Beschriftung.
  - **Titel beschreibt nur die Achsen.** „Umsatz nach Monat“ lässt den Leser allein. Die Aussage in den Titel, Einheit und Zeitraum in den Untertitel.
  - **Unvollständiger letzter Monat.** Der laufende Monat sieht wie ein Einbruch aus. Nur abgeschlossene Monate zeigen oder den laufenden deutlich kennzeichnen.
  - **Vergleich mit der falschen Vorperiode.** Vorherige Zeile statt Vormonat, wenn ein Monat fehlt. Den Vergleichsmonat aus dem Kalender berechnen.

  ## Zusammenfassung

  - Erst die Frage, dann das Diagramm: Vergleich → Balken, Verlauf → Linie, Verteilung → Histogramm, Zusammenhang → Streudiagramm, Anteil → gestapelte Balken.
  - Position und Länge werden am genauesten gelesen, Winkel, Flächen und Farbtöne ungenauer.
  - Balken und Flächen beginnen bei null; Doppelachsen und falsch skalierte Flächen verzerren.
  - Grau als Standard, eine Akzentfarbe für die Aussage, nie Farbe allein; direkt beschriften statt Legende.
  - Der Titel ist eine überprüfbare Aussage und wird im Monatsprozess aus den Daten berechnet.
  - Top 5 plus „Sonstige“, lange Form und Indexierung auf 100 sind die häufigsten Vorbereitungen – mit pandas oder Excel-Formeln.
  - Small Multiples teilen die y-Achse; Kennzahlen im Dashboard haben Wert, Kontext und Vergleich.
  - Diagramme im Monatsbericht sind Vorlagen, die aktualisiert werden, nicht Handarbeit.
exercises:
  - id: frage-bestimmt-diagramm
    type: choice
    title: Viele kleine, wenige große?
    prompt: |
      Die Vertriebsleitung von Bohnenwerk fragt: „Wie verteilen sich die Bestellwerte unserer B2B-Kunden im dritten Quartal – gibt es viele kleine und nur wenige große Bestellungen?“ Dir liegen 1 240 Bestellungen mit Bestellwert vor. Welches Diagramm beantwortet die Frage am direktesten?
    options:
      - text: Ein Histogramm der Bestellwerte mit Klassen von 50 €
        correct: true
        why: Die Frage fragt nach der Form einer Verteilung. Das Histogramm zeigt, wie viele Bestellungen in jede Wertklasse fallen, und macht eine rechtsschiefe Verteilung mit langem Schwanz sofort sichtbar.
      - text: Ein Kreisdiagramm mit dem Umsatzanteil je Kunde
        correct: false
        why: Das zeigt Anteile von Kunden am Umsatz, nicht die Verteilung einzelner Bestellwerte. Bei vielen Kunden wird der Kreis außerdem unlesbar.
      - text: Eine Linie mit dem durchschnittlichen Bestellwert je Woche
        correct: false
        why: Ein Durchschnitt fasst die Verteilung zu einer Zahl zusammen. Ob er aus vielen gleich großen oder aus vielen kleinen und wenigen großen Bestellungen entsteht, ist nicht mehr zu sehen.
      - text: Ein Streudiagramm mit Bestelldatum auf der x-Achse und Bestellwert auf der y-Achse
        correct: false
        why: Das zeigt den zeitlichen Verlauf einzelner Punkte. Bei 1 240 Punkten überlagern sich die meisten, und die Häufigkeit je Wertbereich lässt sich nur schätzen.
    explanation: |
      Die Diagrammart folgt aus der Art der Frage. „Viele kleine, wenige große“ ist eine Frage nach der **Verteilung**, und dafür gibt es Histogramm und Boxplot. Kennzahlen wie der Mittelwert verstecken genau das, was die Vertriebsleitung wissen will: Bei rechtsschiefen Verteilungen liegt der Mittelwert deutlich über dem typischen Wert.
    resources:
      - title: Microsoft Support · Verfügbare Diagrammtypen in Office
        url: https://support.microsoft.com/de-de/office/verf%C3%BCgbare-diagrammtypen-in-office-a6187218-807e-4103-9e0a-27cdb19afb90

  - id: farbe-barrierearm
    type: choice
    title: Rot, Grün – und ein Kollege sieht beides gleich
    prompt: |
      Ein Liniendiagramm zeigt den Monatsumsatz der Regionen Nord (rot) und Süd (grün) mit einer Legende rechts oben. Ein Kollege mit Rot-Grün-Sehschwäche kann die Linien nicht unterscheiden. Welche Änderungen machen das Diagramm für ihn lesbar?
    options:
      - text: Den Regionsnamen direkt ans Ende jeder Linie schreiben und die Legende entfernen
        correct: true
        why: Die Zuordnung hängt dann nicht mehr an der Farbe. Direkte Beschriftung hilft allen Lesern, weil der Blick nicht zwischen Linie und Legende springen muss.
      - text: Die Linie, um die es im Titel geht, dunkelblau und kräftig zeichnen, die andere hellgrau
        correct: true
        why: Der Unterschied liegt jetzt in der Helligkeit, nicht nur im Farbton. Helligkeitsunterschiede bleiben bei Farbfehlsichtigkeit erhalten.
      - text: Rot und Grün kräftiger sättigen, damit der Unterschied größer wird
        correct: false
        why: Wer Rot und Grün verwechselt, sieht auch gesättigtes Rot und Grün ähnlich. Der Farbton bleibt das Problem.
      - text: Eine dritte Farbe für den Gesamtumsatz ergänzen, damit das Diagramm klarer wird
        correct: false
        why: Eine weitere Farbe löst die Verwechslung von Nord und Süd nicht und fügt eine weitere Legendenzuordnung hinzu.
    explanation: |
      Barrierearm heißt: Information darf nie **nur** über den Farbton laufen. Direkte Beschriftung und Helligkeitsunterschiede funktionieren unabhängig vom Farbsehen und machen das Diagramm auch in Schwarz-Weiß-Ausdrucken lesbar. Die Kombination „grau für Kontext, eine dunkle Akzentfarbe für die Aussage“ ist deshalb nicht nur übersichtlicher, sondern auch zugänglicher.
    resources:
      - title: Microsoft Support · Barrierefreie Excel-Dokumente
        url: https://support.microsoft.com/de-de/topic/gestalten-barrierefreier-excel-dokumente-f%C3%BCr-personen-mit-behinderungen-6cc05fc5-1314-48b5-8eb3-683e49b3e593
      - title: matplotlib · Choosing Colormaps
        url: https://matplotlib.org/stable/users/explain/colors/colormaps.html

  - id: top5-reihenfolge
    type: order
    title: Von den Positionen zum Top-5-Diagramm
    prompt: |
      `positionen` enthält die Spalten `produkt`, `menge`, `einzelpreis` und `rabatt` aller Bestellpositionen im September. Bring die Zeilen in eine Reihenfolge, die die Datei für ein Diagramm „Top 5 plus Sonstige“ erzeugt.
    lang: python
    lines: |
      positionen = positionen.assign(umsatz=positionen["menge"] * positionen["einzelpreis"] * (1 - positionen["rabatt"]))
      je_produkt = positionen.groupby("produkt")["umsatz"].sum()
      sortiert = je_produkt.sort_values(ascending=False)
      top = sortiert.head(5)
      sonstige = pd.Series({"Sonstige": sortiert.iloc[5:].sum()})
      diagramm = pd.concat([top, sonstige])
      diagramm.round(2).to_csv("reports/2026-09_top5.csv", sep=";", decimal=",")
    alternatives:
      - [1, 2, 3, 5, 4, 6, 7]
    explanation: |
      Erst entsteht der Umsatz je Position, dann je Produkt. Die Sortierung muss vor `head(5)` und `iloc[5:]` stehen, sonst sind „Top 5“ die ersten fünf Produkte im Alphabet. `top` und `sonstige` hängen beide nur von `sortiert` ab und dürfen in beliebiger Reihenfolge entstehen. `pd.concat` hängt „Sonstige“ ans Ende an – dort gehört es hin, auch wenn es größer ist als Platz 5.
    resources:
      - title: pandas · Series.sort_values
        url: https://pandas.pydata.org/docs/reference/api/pandas.Series.sort_values.html
      - title: pandas · concat
        url: https://pandas.pydata.org/docs/reference/api/pandas.concat.html

  - id: sichtbare-balkenlaenge
    type: output
    title: Wie lang ist der Balken wirklich?
    prompt: |
      Ein Säulendiagramm zeigt den Umsatz von West und Ost. Die Größenachse beginnt bei 95 000 €. Was gibt das Programm aus?
    lang: python
    code: |
      west, ost = 104_000, 96_500
      achse_ab = 95_000
      print(round(west / ost, 2))
      print(round((west - achse_ab) / (ost - achse_ab), 2))
    expected: |
      1.08
      6.0
    explanation: |
      West setzt 8 % mehr um als Ost (104 000 / 96 500 ≈ 1,08). Sichtbar sind aber nur die Längen oberhalb von 95 000 €: 9 000 gegen 1 500, also sechsmal so lang. Genau dieses Verhältnis nimmt das Auge wahr, weil ein Balken seinen Wert über die Länge kodiert. Deshalb beginnen Balken bei null.
    resources:
      - title: Microsoft Support · Ändern der Skalierung der vertikalen Achse
        url: https://support.microsoft.com/de-de/office/%C3%A4ndern-der-skalierung-der-vertikalen-achse-gr%C3%B6%C3%9Fenachse-in-einem-diagramm-05973661-e56a-4486-a9f3-f9ce41df0021

  - id: index-auf-100
    type: output
    title: Alle starten bei 100
    prompt: Was gibt das Programm aus?
    lang: python
    code: |
      import pandas as pd

      umsatz = pd.Series(
          [8000.0, 8800.0, 10000.0, 9200.0],
          index=["2026-06", "2026-07", "2026-08", "2026-09"],
      )
      index = umsatz / umsatz.iloc[0] * 100
      print(index.round(1).tolist())
      print(index.idxmax())
    expected: |
      [100.0, 110.0, 125.0, 115.0]
      2026-08
    explanation: |
      Jeder Wert wird durch den Wert des Basismonats Juni (8 000) geteilt und mal 100 genommen: 8 800 wird zu 110, 10 000 zu 125, 9 200 zu 115. Ein Indexwert von 115 heißt „15 % über dem Basismonat“, nicht „15 % über dem Vormonat“ – gegenüber August ist September gefallen. `idxmax` liefert das Label des größten Werts, nicht seine Position.
    resources:
      - title: pandas · Series.idxmax
        url: https://pandas.pydata.org/docs/reference/api/pandas.Series.idxmax.html

  - id: breit-zu-lang
    type: code
    title: Monate aus den Spalten holen
    prompt: |
      Schreibe `breit_zu_lang(breit)`. `breit` hat eine Spalte `region` und je Monat eine Spalte (`"2026-07"`, `"2026-08"`, …) mit dem Umsatz. Gib einen **neuen** DataFrame in langer Form zurück:

      - Spalten genau `region`, `monat`, `umsatz` in dieser Reihenfolge
      - leere Zellen (`NaN`) fallen weg – ein fehlender Monat ist kein Umsatz von 0
      - sortiert nach `region`, dann `monat`, mit fortlaufendem Index ab 0
    lang: python
    starter: |
      import pandas as pd

      def breit_zu_lang(breit: pd.DataFrame) -> pd.DataFrame:
          lang = breit.melt(id_vars="region")
          return lang
    solution: |
      import pandas as pd

      def breit_zu_lang(breit: pd.DataFrame) -> pd.DataFrame:
          lang = breit.melt(id_vars="region", var_name="monat", value_name="umsatz")
          return (
              lang.dropna(subset=["umsatz"])
              .sort_values(["region", "monat"])
              .reset_index(drop=True)
          )
    tests:
      - name: Spalten heißen region, monat, umsatz
        code: |
          import pandas as pd
          breit = pd.DataFrame({"region": ["Nord"], "2026-07": [11200.0], "2026-08": [10300.0]})
          ergebnis = breit_zu_lang(breit)
          assert list(ergebnis.columns) == ["region", "monat", "umsatz"], f"Spalten sind {list(ergebnis.columns)}"
      - name: Eine Zeile je Region und Monat
        code: |
          import pandas as pd
          breit = pd.DataFrame({
              "region": ["West", "Nord", "Süd"],
              "2026-07": [14100.0, 11200.0, 9400.0],
              "2026-08": [13800.0, 10300.0, 9900.0],
          })
          ergebnis = breit_zu_lang(breit)
          assert len(ergebnis) == 6, f"erwartet 6 Zeilen, bekommen {len(ergebnis)}"
          wert = ergebnis.loc[(ergebnis["region"] == "Süd") & (ergebnis["monat"] == "2026-08"), "umsatz"].tolist()
          assert wert == [9900.0], f"Süd im August sollte 9900.0 sein, gefunden {wert}"
      - name: Sortiert nach Region und Monat, Index ab 0
        code: |
          import pandas as pd
          breit = pd.DataFrame({
              "region": ["West", "Nord"],
              "2026-08": [13800.0, 10300.0],
              "2026-07": [14100.0, 11200.0],
          })
          ergebnis = breit_zu_lang(breit)
          assert ergebnis["region"].tolist() == ["Nord", "Nord", "West", "West"], f"Regionen: {ergebnis['region'].tolist()}"
          assert ergebnis["monat"].tolist() == ["2026-07", "2026-08", "2026-07", "2026-08"], f"Monate: {ergebnis['monat'].tolist()}"
          assert ergebnis.index.tolist() == [0, 1, 2, 3], f"Index: {ergebnis.index.tolist()} – denk an reset_index(drop=True)"
      - name: Leere Zellen fallen weg
        code: |
          import pandas as pd
          breit = pd.DataFrame({"region": ["Nord", "Süd"], "2026-07": [11200.0, 9400.0], "2026-08": [None, 9900.0]})
          ergebnis = breit_zu_lang(breit)
          assert len(ergebnis) == 3, f"erwartet 3 Zeilen ohne den fehlenden Nord-August, bekommen {len(ergebnis)}"
          assert not ergebnis["umsatz"].isna().any(), "Es sind noch NaN-Werte im Ergebnis."
      - name: Eingabe bleibt unverändert
        code: |
          import pandas as pd
          breit = pd.DataFrame({"region": ["Nord"], "2026-07": [11200.0], "2026-08": [10300.0]})
          vorher = breit.copy()
          breit_zu_lang(breit)
          pd.testing.assert_frame_equal(breit, vorher)
    hints:
      - "`melt` kennt Parameter für die Namen der neuen Spalten: `var_name` und `value_name`."
      - "Danach: `dropna(subset=[\"umsatz\"])`, `sort_values([\"region\", \"monat\"])` und `reset_index(drop=True)`."
    explanation: |
      `melt` behält die `id_vars` und macht aus jeder anderen Spalte ein Paar aus Spaltenname und Wert. Ohne `var_name` und `value_name` heißen die neuen Spalten `variable` und `value`. Das Entfernen der `NaN`-Zeilen ist eine fachliche Entscheidung: Ein fehlender Wert würde sonst als Lücke gezeichnet oder, schlimmer, von manchen Werkzeugen als 0 behandelt. Die feste Sortierung macht die Ausgabe unabhängig von der Zeilenreihenfolge im Export – dieselben Daten ergeben immer dieselbe Datei.
    resources:
      - title: pandas · DataFrame.melt
        url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.melt.html
      - title: pandas · Reshaping · melt and wide_to_long
        url: https://pandas.pydata.org/docs/user_guide/reshaping.html#melt-and-wide-to-long

  - id: index-je-kanal
    type: code
    title: Shop und B2B auf eine Skala bringen
    prompt: |
      Schreibe `index_je_kanal(df, basis)`. `df` hat die Spalten `monat` (Text wie `"2026-01"`), `kanal` und `umsatz`, in beliebiger Zeilenreihenfolge. Gib einen **neuen** DataFrame mit allen Zeilen und Spalten von `df` plus einer Spalte `index` zurück: Umsatz geteilt durch den Umsatz desselben Kanals im Monat `basis`, mal 100, auf eine Nachkommastelle gerundet.

      Fehlt für einen Kanal der Basismonat, wirf einen `ValueError`, der den Kanal nennt. `df` selbst darf nicht verändert werden.
    lang: python
    starter: |
      import pandas as pd

      def index_je_kanal(df: pd.DataFrame, basis: str) -> pd.DataFrame:
          erster = df.groupby("kanal")["umsatz"].transform("first")
          df["index"] = (df["umsatz"] / erster * 100).round(1)
          return df
    solution: |
      import pandas as pd

      def index_je_kanal(df: pd.DataFrame, basis: str) -> pd.DataFrame:
          basiswerte = df.loc[df["monat"] == basis].set_index("kanal")["umsatz"]
          fehlend = sorted(set(df["kanal"]) - set(basiswerte.index))
          if fehlend:
              raise ValueError(f"Basismonat {basis} fehlt für: {', '.join(fehlend)}")
          return df.assign(index=(df["umsatz"] / df["kanal"].map(basiswerte) * 100).round(1))
    tests:
      - name: Basismonat ergibt 100
        code: |
          import pandas as pd
          df = pd.DataFrame({"monat": ["2026-01", "2026-02"], "kanal": ["Shop", "Shop"], "umsatz": [8000.0, 8800.0]})
          ergebnis = index_je_kanal(df, "2026-01")
          assert ergebnis["index"].tolist() == [100.0, 110.0], f"bekommen {ergebnis['index'].tolist()}"
      - name: Jeder Kanal mit eigener Basis, unsortierte Zeilen
        code: |
          import pandas as pd
          df = pd.DataFrame({
              "monat": ["2026-03", "2026-01", "2026-02", "2026-02", "2026-01", "2026-03"],
              "kanal": ["Shop", "Shop", "Shop", "B2B", "B2B", "B2B"],
              "umsatz": [10000.0, 8000.0, 8800.0, 42500.0, 42000.0, 43700.0],
          })
          ergebnis = index_je_kanal(df, "2026-01")
          assert ergebnis["index"].tolist() == [125.0, 100.0, 110.0, 101.2, 100.0, 104.0], (
              f"bekommen {ergebnis['index'].tolist()} – ist die Basis wirklich der Januar jedes Kanals?"
          )
      - name: Andere Basis
        code: |
          import pandas as pd
          df = pd.DataFrame({"monat": ["2026-01", "2026-02"], "kanal": ["B2B", "B2B"], "umsatz": [42000.0, 42500.0]})
          ergebnis = index_je_kanal(df, "2026-02")
          assert ergebnis["index"].tolist() == [98.8, 100.0], f"bekommen {ergebnis['index'].tolist()}"
      - name: Fehlender Basismonat wird gemeldet
        code: |
          import pandas as pd
          df = pd.DataFrame({"monat": ["2026-01", "2026-02", "2026-02"], "kanal": ["Shop", "Shop", "B2B"], "umsatz": [8000.0, 8800.0, 42500.0]})
          try:
              index_je_kanal(df, "2026-01")
          except ValueError as fehler:
              assert "B2B" in str(fehler), f"Die Meldung sollte den Kanal nennen: {fehler}"
          else:
              assert False, "Für B2B fehlt der Januar – erwartet ist ein ValueError."
      - name: Eingabe bleibt unverändert
        code: |
          import pandas as pd
          df = pd.DataFrame({"monat": ["2026-01", "2026-02"], "kanal": ["Shop", "Shop"], "umsatz": [8000.0, 8800.0]})
          index_je_kanal(df, "2026-01")
          assert list(df.columns) == ["monat", "kanal", "umsatz"], f"df wurde verändert: {list(df.columns)}"
    hints:
      - Hol dir zuerst die Basiswerte je Kanal als Series mit dem Kanal als Index.
      - "`df.loc[df[\"monat\"] == basis].set_index(\"kanal\")[\"umsatz\"]` – danach ordnet `df[\"kanal\"].map(basiswerte)` jeder Zeile ihre Basis zu."
      - Vergleiche die Menge der Kanäle in `df` mit dem Index der Basiswerte, um fehlende Kanäle zu finden. `assign` gibt einen neuen DataFrame zurück.
    explanation: |
      Der Startcode hat zwei Fehler. `transform("first")` nimmt die erste Zeile je Kanal **in der aktuellen Reihenfolge** – bei unsortierten Daten ist das irgendein Monat, und der Index wird still falsch. Und `df["index"] = …` verändert den übergebenen DataFrame, sodass der Aufrufer plötzlich eine zusätzliche Spalte hat. Die Lösung sucht die Basis ausdrücklich über den Monat und ordnet sie mit `map` zu; `assign` liefert eine neue Tabelle. Ein fehlender Basismonat muss laut scheitern, denn eine Division durch `NaN` ergibt sonst eine unsichtbar leere Linie im Diagramm.
    resources:
      - title: pandas · Series.map
        url: https://pandas.pydata.org/docs/reference/api/pandas.Series.map.html
      - title: pandas · DataFrame.assign
        url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.assign.html

  - id: anteile-je-region
    type: code
    title: Zahlen für 100-%-gestapelte Balken
    prompt: |
      Für ein Diagramm „Kundenmix je Region“ brauchst du Anteile. Schreibe `anteile_je_region(df)`. `df` hat die Spalten `region`, `segment` (`"Büro"`, `"Café"`, `"Privat"`) und `umsatz`, mehrere Zeilen je Kombination sind möglich.

      Gib einen DataFrame zurück mit einer Zeile je Region (Index `region`, alphabetisch), einer Spalte je Segment (alphabetisch) und dem Anteil des Segments am Umsatz **der Region** in Prozent, auf eine Nachkommastelle gerundet. Kombinationen ohne Umsatz haben den Anteil `0.0`.
    lang: python
    starter: |
      import pandas as pd

      def anteile_je_region(df: pd.DataFrame) -> pd.DataFrame:
          tabelle = df.pivot_table(index="region", columns="segment", values="umsatz", aggfunc="sum")
          return (tabelle / df["umsatz"].sum() * 100).round(1)
    solution: |
      import pandas as pd

      def anteile_je_region(df: pd.DataFrame) -> pd.DataFrame:
          anteile = pd.crosstab(
              df["region"], df["segment"],
              values=df["umsatz"], aggfunc="sum", normalize="index",
          )
          return (anteile * 100).round(1)
    tests:
      - name: Anteile innerhalb einer Region
        code: |
          import pandas as pd
          df = pd.DataFrame({"region": ["Nord", "Nord", "Nord"], "segment": ["Büro", "Café", "Privat"], "umsatz": [3000.0, 2000.0, 1000.0]})
          ergebnis = anteile_je_region(df)
          assert ergebnis.loc["Nord", "Büro"] == 50.0, f"Büro in Nord: {ergebnis.loc['Nord', 'Büro']}"
          assert ergebnis.loc["Nord", "Privat"] == 16.7, f"Privat in Nord: {ergebnis.loc['Nord', 'Privat']}"
      - name: Jede Region summiert sich auf 100
        code: |
          import pandas as pd
          df = pd.DataFrame({
              "region": ["Nord", "Nord", "Süd", "Süd", "West", "West"],
              "segment": ["Büro", "Café", "Café", "Privat", "Büro", "Privat"],
              "umsatz": [3000.0, 1000.0, 2400.0, 1600.0, 3000.0, 1000.0],
          })
          summen = anteile_je_region(df).sum(axis=1).tolist()
          assert all(abs(s - 100) <= 0.2 for s in summen), (
              f"Zeilensummen {summen} – teilst du durch den Umsatz der Region oder durch den Gesamtumsatz?"
          )
      - name: Mehrere Zeilen je Kombination werden addiert
        code: |
          import pandas as pd
          df = pd.DataFrame({"region": ["West", "West", "West"], "segment": ["Büro", "Büro", "Privat"], "umsatz": [2000.0, 1000.0, 1000.0]})
          assert anteile_je_region(df).loc["West", "Büro"] == 75.0
      - name: Fehlende Kombination ist 0.0
        code: |
          import pandas as pd
          df = pd.DataFrame({"region": ["Nord", "Süd"], "segment": ["Büro", "Café"], "umsatz": [100.0, 200.0]})
          ergebnis = anteile_je_region(df)
          wert = ergebnis.loc["Süd", "Büro"]
          assert wert == 0.0, f"Süd hat keinen Büro-Umsatz, erwartet 0.0, bekommen {wert}"
      - name: Regionen und Segmente alphabetisch
        code: |
          import pandas as pd
          df = pd.DataFrame({"region": ["West", "Nord"], "segment": ["Privat", "Büro"], "umsatz": [1.0, 1.0]})
          ergebnis = anteile_je_region(df)
          assert list(ergebnis.index) == ["Nord", "West"], f"Index: {list(ergebnis.index)}"
          assert list(ergebnis.columns) == ["Büro", "Privat"], f"Spalten: {list(ergebnis.columns)}"
    hints:
      - Der Nenner ist der Umsatz der jeweiligen Region, nicht der Gesamtumsatz.
      - "`pd.crosstab` kann mit `values=`, `aggfunc=\"sum\"` und `normalize=\"index\"` direkt Zeilenanteile berechnen."
      - "Alternative: `pivot_table(…, fill_value=0)` und dann `tabelle.div(tabelle.sum(axis=1), axis=0)`."
    explanation: |
      Ein 100-%-gestapelter Balken vergleicht die **Zusammensetzung** jeder Region, deshalb ist der Nenner die Summe der Zeile. Der Startcode teilt durch den Gesamtumsatz – dann summieren sich die Zeilen nicht zu 100 und das Diagramm vermischt Größe und Mix. `normalize="index"` in `crosstab` teilt jede Zeile durch ihre Summe; fehlende Kombinationen werden 0. Mit `pivot_table` brauchst du dafür `fill_value=0`, sonst bleibt ein `NaN`, und die Lücke im Balken sieht wie ein Darstellungsfehler aus.
    resources:
      - title: pandas · crosstab
        url: https://pandas.pydata.org/docs/reference/api/pandas.crosstab.html
      - title: pandas · Reshaping · Normalization
        url: https://pandas.pydata.org/docs/user_guide/reshaping.html#normalization

  - id: kennzahl-mit-vergleich
    type: code
    title: Eine Kennzahl mit Vormonat
    prompt: |
      Für die Dashboard-Kachel schreibst du `kennzahl(umsatz_je_monat, monat)`. `umsatz_je_monat` ist eine Series mit Monaten als Index (`"2026-08"`) und Umsätzen als Werten; Monate können fehlen. Gib ein Dictionary mit diesen Schlüsseln zurück:

      - `"monat"`: der übergebene Monat
      - `"wert"`: Umsatz dieses Monats als `float`
      - `"vormonat"`: Umsatz des **Kalendermonats davor** als `float`, oder `None`, wenn er fehlt oder 0 ist
      - `"veraenderung_prozent"`: `(wert / vormonat - 1) * 100`, auf eine Nachkommastelle gerundet, oder `None`, wenn es keinen Vormonat gibt

      Gibt es für `monat` keinen Umsatz, wirf einen `ValueError`.
    lang: python
    starter: |
      import pandas as pd

      def kennzahl(umsatz_je_monat: pd.Series, monat: str) -> dict:
          position = list(umsatz_je_monat.index).index(monat)
          wert = float(umsatz_je_monat.iloc[position])
          vormonat = float(umsatz_je_monat.iloc[position - 1])
          return {
              "monat": monat,
              "wert": wert,
              "vormonat": vormonat,
              "veraenderung_prozent": round((wert / vormonat - 1) * 100, 1),
          }
    solution: |
      import pandas as pd

      def kennzahl(umsatz_je_monat: pd.Series, monat: str) -> dict:
          if monat not in umsatz_je_monat.index:
              raise ValueError(f"Für {monat} gibt es keinen Umsatz")
          wert = float(umsatz_je_monat[monat])
          vormonat = str(pd.Period(monat, freq="M") - 1)
          vorwert = umsatz_je_monat.get(vormonat)
          if vorwert is None or pd.isna(vorwert) or vorwert == 0:
              return {"monat": monat, "wert": wert, "vormonat": None, "veraenderung_prozent": None}
          return {
              "monat": monat,
              "wert": wert,
              "vormonat": float(vorwert),
              "veraenderung_prozent": round((wert / float(vorwert) - 1) * 100, 1),
          }
    tests:
      - name: Normalfall
        code: |
          import pandas as pd
          umsatz = pd.Series({"2026-07": 45100.0, "2026-08": 45500.0, "2026-09": 48300.0})
          ergebnis = kennzahl(umsatz, "2026-09")
          assert ergebnis == {"monat": "2026-09", "wert": 48300.0, "vormonat": 45500.0, "veraenderung_prozent": 6.2}, f"bekommen {ergebnis}"
      - name: Erster Monat hat keinen Vormonat
        code: |
          import pandas as pd
          umsatz = pd.Series({"2026-07": 45100.0, "2026-08": 45500.0})
          ergebnis = kennzahl(umsatz, "2026-07")
          assert ergebnis["vormonat"] is None and ergebnis["veraenderung_prozent"] is None, (
              f"bekommen {ergebnis} – Juli hat hier keinen Vormonat, auch nicht den letzten Eintrag der Series"
          )
      - name: Lücke in den Daten
        code: |
          import pandas as pd
          umsatz = pd.Series({"2026-07": 45100.0, "2026-09": 48300.0})
          ergebnis = kennzahl(umsatz, "2026-09")
          assert ergebnis["vormonat"] is None, f"August fehlt, September darf nicht mit Juli verglichen werden: {ergebnis}"
      - name: Jahreswechsel
        code: |
          import pandas as pd
          umsatz = pd.Series({"2025-12": 52000.0, "2026-01": 39000.0})
          ergebnis = kennzahl(umsatz, "2026-01")
          assert ergebnis["vormonat"] == 52000.0 and ergebnis["veraenderung_prozent"] == -25.0, f"bekommen {ergebnis}"
      - name: Vormonat 0 ergibt keinen Prozentwert
        code: |
          import pandas as pd
          ergebnis = kennzahl(pd.Series({"2026-01": 0.0, "2026-02": 1200.0}), "2026-02")
          assert ergebnis["veraenderung_prozent"] is None, f"Division durch 0 vermeiden: {ergebnis}"
      - name: Unbekannter Monat
        code: |
          import pandas as pd
          try:
              kennzahl(pd.Series({"2026-08": 45500.0}), "2026-10")
          except ValueError:
              pass
          else:
              assert False, "Für 2026-10 gibt es keinen Umsatz – erwartet ist ein ValueError."
    hints:
      - Der Vormonat ergibt sich aus dem Kalender, nicht aus der Position in der Series.
      - "`pd.Period(\"2026-01\", freq=\"M\") - 1` ist der Dezember 2025; `str(...)` macht daraus `\"2025-12\"`."
      - "`umsatz_je_monat.get(schluessel)` liefert `None`, wenn der Schlüssel fehlt."
    explanation: |
      Der Startcode vergleicht mit der **vorherigen Zeile**. Fehlt ein Monat, wird September mit Juli verglichen, und beim ersten Monat liefert `iloc[-1]` sogar den letzten Eintrag der Series – ein Vergleich mit der Zukunft. `pd.Period` rechnet in Kalendermonaten, auch über den Jahreswechsel. Ein Vormonat mit 0 € ergibt keine sinnvolle Prozentangabe; `None` zwingt die Kachel, „kein Vergleich“ anzuzeigen, statt `inf %` oder einer erfundenen Zahl.
    resources:
      - title: pandas · Period
        url: https://pandas.pydata.org/docs/reference/api/pandas.Period.html
      - title: pandas · Series.get
        url: https://pandas.pydata.org/docs/reference/api/pandas.Series.get.html

  - id: excel-top5-quelle
    type: gap
    title: Eine Diagrammquelle mit fester Form
    prompt: |
      `ProduktUmsatz` ist ein zweispaltiger Bereich (Produkt, Umsatz). Die Formel soll die fünf umsatzstärksten Produkte absteigend liefern und darunter eine Zeile „Sonstige“ mit der Summe aller übrigen. Deutsche und englische Funktionsnamen werden akzeptiert.
    lang: excel
    code: |
      =LET(
        sortiert; ⟦SORTIEREN⟧(ProduktUmsatz; 2; ⟦-1⟧);
        top; ⟦ÜBERNEHMEN⟧(sortiert; 5);
        rest; SUMME(⟦WEGLASSEN⟧(SPALTENWAHL(sortiert; 2); 5));
        ⟦VSTAPELN⟧(top; HSTAPELN("Sonstige"; rest))
      )
    gaps:
      - label: Sortieren
        hint: Die Funktion für dynamische Arrays, die eine Matrix nach einer Spalte ordnet (englisch `SORT`).
      - label: Reihenfolge
        hint: "`1` steht für aufsteigend. Was steht für absteigend?"
      - label: Die ersten Zeilen
        hint: Liefert die ersten n Zeilen einer Matrix (englisch `TAKE`).
      - label: Alle außer den ersten
        hint: Das Gegenstück zu `ÜBERNEHMEN` (englisch `DROP`).
      - label: Untereinander setzen
        hint: Stapelt Matrizen vertikal (englisch `VSTACK`).
    explanation: |
      `SORTIEREN(Matrix; 2; -1)` ordnet nach der zweiten Spalte absteigend. `ÜBERNEHMEN(sortiert; 5)` behält die ersten fünf Zeilen, `WEGLASSEN(…; 5)` alle danach – so kann kein Produkt doppelt oder gar nicht gezählt werden. `VSTAPELN` hängt die Zeile „Sonstige“ unten an. Weil das Ergebnis immer sechs Zeilen hat, bleibt der Datenbereich des Diagramms Monat für Monat gleich; nur die Werte ändern sich. Die Funktionen gibt es in Microsoft 365.
    resources:
      - title: Microsoft Support · Verfügbare Diagrammtypen in Office
        url: https://support.microsoft.com/de-de/office/verf%C3%BCgbare-diagrammtypen-in-office-a6187218-807e-4103-9e0a-27cdb19afb90

  - id: achse-abgeschnitten
    type: bug
    title: „Der Westen verkauft sechsmal so viel?“
    prompt: |
      Das Skript erzeugt das Säulendiagramm für den Quartalsbericht. In der Besprechung fragt die Geschäftsführung, warum der Westen „ungefähr sechsmal so viel“ umsetzt wie der Osten. Laut Tabelle liegen West und Ost nur 8 % auseinander. Finde die Zeile, die das Diagramm verzerrt, und korrigiere sie so, dass die Säulen bei null beginnen.
    lang: python
    code: |
      import matplotlib.pyplot as plt

      regionen = ["West", "Nord", "Süd", "Ost"]
      umsatz = [104000, 102000, 98000, 96500]
      fig, ax = plt.subplots(figsize=(6, 3.5))
      ax.bar(regionen, umsatz, color="#9e9e9e")
      ax.set_ylim(95000, 105000)
      ax.set_title("Umsatz je Region, Q3 2026 (EUR netto)")
      fig.savefig("reports/q3_regionen.png", dpi=200)
    lines: [7]
    fix:
      - line: 7
        answers:
          - ax.set_ylim(0, 105000)
          - ax.set_ylim(bottom=0)
          - ax.set_ylim(0)
          - ax.set_ylim(0, 110000)
          - ax.set_ylim(0, 105_000)
          - ax.set_ylim(0, 110_000)
          - ax.set_ylim(bottom=0, top=105000)
          - ax.set_ylim(ymin=0)
    explanation: |
      Eine Säule kodiert ihren Wert über die Länge. Mit `set_ylim(95000, 105000)` sind nur die Stücke oberhalb von 95 000 sichtbar: 9 000 für West, 1 500 für Ost – das Sechsfache, obwohl die Umsätze nur 8 % auseinanderliegen. Mit der Untergrenze 0 ist die Länge wieder proportional zum Wert. Ohne die Zeile wäre das Diagramm übrigens auch korrekt: matplotlib bezieht bei Balken die Null automatisch in die Achse ein. In Excel ist es umgekehrt – dort musst du das Minimum der Größenachse prüfen.
    resources:
      - title: matplotlib · Axes.set_ylim
        url: https://matplotlib.org/stable/api/_as_gen/matplotlib.axes.Axes.set_ylim.html
      - title: Microsoft Support · Ändern der Skalierung der vertikalen Achse
        url: https://support.microsoft.com/de-de/office/%C3%A4ndern-der-skalierung-der-vertikalen-achse-gr%C3%B6%C3%9Fenachse-in-einem-diagramm-05973661-e56a-4486-a9f3-f9ce41df0021

  - id: blasen-flaeche
    type: bug
    title: Doppelt so viel Umsatz, viermal so groß
    prompt: |
      Das Streudiagramm zeigt B2B-Kunden: Bestellungen auf der x-Achse, Marge auf der y-Achse, die Kreisfläche soll proportional zum Umsatz sein. Café Kranz (80 000 €) erscheint aber viermal so groß wie Büro Lindner (40 000 €). Der größte Kunde soll weiterhin eine Markerfläche von 1 600 Punkt² bekommen. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      import matplotlib.pyplot as plt

      # kunden: DataFrame mit bestellungen, marge_prozent, umsatz (2026, EUR netto)
      anteil = kunden["umsatz"] / kunden["umsatz"].max()
      fig, ax = plt.subplots(figsize=(6, 4))
      ax.scatter(kunden["bestellungen"], kunden["marge_prozent"], s=(anteil * 40) ** 2, alpha=0.6)
      ax.set_xlabel("Bestellungen 2026")
      ax.set_ylabel("Marge in %")
      ax.set_title("Große Kunden bestellen oft – aber nicht mit der höchsten Marge", loc="left")
    lines: [6]
    fix:
      - line: 6
        answers:
          - ax.scatter(kunden["bestellungen"], kunden["marge_prozent"], s=anteil * 1600, alpha=0.6)
          - ax.scatter(kunden["bestellungen"], kunden["marge_prozent"], s=1600 * anteil, alpha=0.6)
          - ax.scatter(kunden["bestellungen"], kunden["marge_prozent"], s=anteil * 1600)
          - ax.scatter(kunden["bestellungen"], kunden["marge_prozent"], s=1600 * anteil)
          - ax.scatter(kunden["bestellungen"], kunden["marge_prozent"], alpha=0.6, s=anteil * 1600)
          - ax.scatter(kunden["bestellungen"], kunden["marge_prozent"], s=anteil * 40 ** 2, alpha=0.6)
    hints:
      - Lies in der matplotlib-Dokumentation nach, welche Größe der Parameter `s` von `scatter` angibt.
      - "`s` ist bereits eine Fläche (Punkt²). Was passiert mit einem Wert, den du vorher quadrierst?"
    explanation: |
      `s` ist in matplotlib die **Markerfläche** in Punkt². Wer `(anteil * 40) ** 2` übergibt, denkt in Radien: Der Radius wächst proportional zum Umsatz, die Fläche also mit dem Quadrat. Doppelter Umsatz ergibt vierfache Fläche, und das Auge vergleicht Flächen. `s=anteil * 1600` macht die Fläche proportional zum Umsatz; der größte Kunde behält 1 600 Punkt², weil sein Anteil 1 ist. Dieselbe Falle gibt es bei Blasendiagrammen in Excel, wenn die Blasengröße nach Breite statt Fläche eingestellt ist.
    resources:
      - title: matplotlib · Axes.scatter
        url: https://matplotlib.org/stable/api/_as_gen/matplotlib.axes.Axes.scatter.html

  - id: doppelachse-erklaeren
    type: explain
    title: Mehr Umsatz, mehr Tickets?
    prompt: |
      Eine Kollegin hat für die Vertriebsrunde dieses Diagramm gebaut. Die Linien laufen fast deckungsgleich, der Titel lautet „Mehr Umsatz, mehr Tickets“. Erkläre ihr, warum das Diagramm diese Aussage nicht trägt und wie sie es besser machen kann.
    lang: python
    code: |
      fig, ax_umsatz = plt.subplots(figsize=(7, 3.5))
      ax_umsatz.plot(monate, umsatz, color="#1f5f8b")
      ax_umsatz.set_ylim(30_000, 60_000)
      ax_umsatz.set_ylabel("Umsatz in EUR")

      ax_tickets = ax_umsatz.twinx()
      ax_tickets.plot(monate, tickets, color="#c0392b")
      ax_tickets.set_ylim(40, 90)
      ax_tickets.set_ylabel("Support-Tickets")

      ax_umsatz.set_title("Mehr Umsatz, mehr Tickets")
    points:
      - "`twinx` erzeugt eine zweite y-Achse mit eigener, frei gewählter Skala; wie parallel die Linien laufen und wo sie sich kreuzen, bestimmen die beiden `set_ylim`-Aufrufe, nicht die Daten."
      - Beide Achsen sind zusätzlich abgeschnitten (30 000 bzw. 40 statt null), was jede Schwankung vergrößert.
      - Der Titel behauptet einen Zusammenhang, womöglich sogar eine Ursache; ein gemeinsamer Verlauf zweier Reihen ist höchstens eine Korrelation, etwa weil beide von der Zahl der Bestellungen abhängen.
      - "Besser: zwei Teilbilder untereinander mit gemeinsamer x-Achse, beide Reihen auf 100 indexieren oder direkt die Kennzahl zeigen, um die es geht (Tickets je 100 Bestellungen)."
    explanation: |
      Das Diagramm hat zwei Skalen, die jemand von Hand gesetzt hat. Mit `set_ylim(30_000, 60_000)` und `set_ylim(40, 90)` lässt sich fast jede Deckung erzeugen – ändere eine der Grenzen, und die Linien laufen auseinander. Beide Achsen beginnen außerdem weit über null, sodass kleine Bewegungen groß wirken. Selbst wenn beide Reihen wirklich gemeinsam steigen, folgt daraus keine Ursache: Mehr Bestellungen erzeugen mehr Umsatz und mehr Tickets. Die ehrliche Frage lautet „Steigt der Anteil der Bestellungen mit Ticket?“ – dafür zeigst du Tickets je 100 Bestellungen als eine Linie. Wer beide Reihen sehen will, setzt zwei Teilbilder mit `plt.subplots(2, 1, sharex=True)` untereinander oder indexiert beide auf 100 und zeichnet sie auf eine gemeinsame Achse.
    resources:
      - title: matplotlib · Axes.twinx
        url: https://matplotlib.org/stable/api/_as_gen/matplotlib.axes.Axes.twinx.html
      - title: Microsoft Support · Erstellen eines Verbunddiagramms
        url: https://support.microsoft.com/de-de/office/erstellen-eines-verbunddiagramms-cf2c969a-b11e-4a62-bb8f-da021177452f

  - id: monatsgrafik-skript
    type: practice
    title: Die Monatsgrafik als Skript
    prompt: |
      Baue lokal ein Skript `monatsgrafik.py`, das aus einer CSV-Datei `data/processed/umsatz_je_monat.csv` (Spalten `monat`, `kanal`, `umsatz`; Semikolon, Dezimalkomma) zwei Diagramme für den Monatsbericht erzeugt:

      1. „Entwicklung je Kanal“: Shop und B2B auf 100 indexiert (Basis: Januar 2026) als Linien, direkt am Linienende beschriftet, die Linie des stärker wachsenden Kanals als Akzent, die andere grau.
      2. „Umsatz im Stichtagsmonat je Kanal“ als horizontale Balken mit Werten am Balken.

      Der Stichtag (`--stichtag 2026-09-30`) kommt als Parameter. Beide Titel werden aus den Daten berechnet und sind Aussagen. Die Diagramme landen als PNG in `reports/`. Du brauchst eine lokale Umgebung mit pandas und matplotlib, zum Beispiel `uv add pandas matplotlib`.
    lang: python
    starter: |
      import argparse
      from datetime import date
      from pathlib import Path

      import matplotlib.pyplot as plt
      import pandas as pd


      def lies_daten(pfad: Path) -> pd.DataFrame:
          ...


      def zeichne_entwicklung(df: pd.DataFrame, bis: str, ziel: Path) -> None:
          ...


      def zeichne_monat(df: pd.DataFrame, monat: str, ziel: Path) -> None:
          ...


      def main() -> None:
          parser = argparse.ArgumentParser()
          parser.add_argument("--stichtag", type=date.fromisoformat, required=True)
          args = parser.parse_args()
          ...


      if __name__ == "__main__":
          main()
    solution: |
      import argparse
      from datetime import date
      from pathlib import Path

      import matplotlib.pyplot as plt
      import pandas as pd

      AKZENT, GRAU = "#1f5f8b", "#9e9e9e"


      def lies_daten(pfad: Path) -> pd.DataFrame:
          df = pd.read_csv(pfad, sep=";", decimal=",", dtype={"monat": "str"})
          return df.sort_values(["kanal", "monat"]).reset_index(drop=True)


      def indexiere(df: pd.DataFrame, basis: str) -> pd.DataFrame:
          basiswerte = df.loc[df["monat"] == basis].set_index("kanal")["umsatz"]
          return df.assign(index=df["umsatz"] / df["kanal"].map(basiswerte) * 100)


      def zeichne_entwicklung(df: pd.DataFrame, bis: str, ziel: Path) -> None:
          daten = indexiere(df[df["monat"] <= bis], "2026-01")
          letzte = daten[daten["monat"] == bis].set_index("kanal")["index"]
          sieger = letzte.idxmax()
          fig, ax = plt.subplots(figsize=(7, 3.5))
          for kanal, teil in daten.groupby("kanal"):
              farbe = AKZENT if kanal == sieger else GRAU
              ax.plot(teil["monat"], teil["index"], color=farbe, linewidth=2.5 if kanal == sieger else 1.5)
              ax.annotate(f"{kanal} {teil['index'].iloc[-1]:.0f}", (teil["monat"].iloc[-1], teil["index"].iloc[-1]),
                          xytext=(6, 0), textcoords="offset points", va="center", color=farbe)
          plus = letzte[sieger] - 100
          ax.set_title(f"{sieger} wächst seit Januar um {plus:.0f} %", loc="left")
          ax.axhline(100, color=GRAU, linewidth=0.8, linestyle=":")
          ax.spines[["top", "right"]].set_visible(False)
          ax.set_ylabel("Index (Januar 2026 = 100)")
          fig.savefig(ziel, dpi=200, bbox_inches="tight")
          plt.close(fig)


      def zeichne_monat(df: pd.DataFrame, monat: str, ziel: Path) -> None:
          werte = df[df["monat"] == monat].set_index("kanal")["umsatz"].sort_values()
          anteil = werte.max() / werte.sum()
          farben = [AKZENT if k == werte.idxmax() else GRAU for k in werte.index]
          fig, ax = plt.subplots(figsize=(7, 2.2))
          balken = ax.barh(werte.index, werte.values, color=farben)
          ax.bar_label(balken, labels=[f"{w:,.0f} €".replace(",", ".") for w in werte.values], padding=4)
          ax.set_xlim(left=0)
          ax.xaxis.set_visible(False)
          ax.spines[["top", "right", "bottom"]].set_visible(False)
          ax.set_title(f"{werte.idxmax()} bringt {anteil * 100:.0f} % des Umsatzes", loc="left")
          fig.text(0.01, -0.05, f"Nettoumsatz {monat} in EUR · Quelle: Webshop und B2B-Rechnungen", fontsize=8)
          fig.savefig(ziel, dpi=200, bbox_inches="tight")
          plt.close(fig)


      def main() -> None:
          parser = argparse.ArgumentParser()
          parser.add_argument("--stichtag", type=date.fromisoformat, required=True)
          args = parser.parse_args()
          monat = args.stichtag.strftime("%Y-%m")
          df = lies_daten(Path("data/processed/umsatz_je_monat.csv"))
          Path("reports").mkdir(exist_ok=True)
          zeichne_entwicklung(df, monat, Path(f"reports/{monat}_entwicklung.png"))
          zeichne_monat(df, monat, Path(f"reports/{monat}_kanaele.png"))


      if __name__ == "__main__":
          main()
    checklist:
      - "`uv run python monatsgrafik.py --stichtag 2026-09-30` erzeugt zwei PNG-Dateien in `reports/`, deren Namen den Monat enthalten."
      - Die Indexlinien starten im Januar bei 100; die Basis wird über den Monat gesucht, nicht über die erste Zeile.
      - Beide Linien sind am Ende direkt beschriftet, es gibt keine Legende; genau eine Linie ist farbig, die andere grau.
      - Die Balken beginnen bei null (`set_xlim(left=0)`) und tragen ihre Werte als Beschriftung.
      - Beide Titel sind Aussagen, die aus den Daten berechnet werden – ändere eine Zahl in der CSV und prüfe, dass sich der Titel mitändert.
      - Mit `--stichtag 2026-08-31` entstehen die Diagramme für August, ohne dass du Code änderst.
    explanation: |
      Das Skript trennt Datenvorbereitung und Zeichnen, und der einzige Parameter ist der Stichtag. Dadurch wird aus der monatlichen Handarbeit ein Befehl: Der Titel rechnet seine Aussage selbst aus, die Akzentfarbe folgt dem Kanal, über den der Titel spricht, und die Achsen folgen festen Regeln statt dem Zufall der Automatik. `plt.close(fig)` gibt den Speicher frei, wenn das Skript viele Diagramme nacheinander erzeugt. Im nächsten Modul wird daraus eine vollständige Pipeline mit Tests und festgehaltener Umgebung.
    resources:
      - title: matplotlib · Axes.annotate
        url: https://matplotlib.org/stable/api/_as_gen/matplotlib.axes.Axes.annotate.html
      - title: matplotlib · Axes.bar_label
        url: https://matplotlib.org/stable/api/_as_gen/matplotlib.axes.Axes.bar_label.html
