id: visualisierung
title: Visualisierung, die überzeugt
level: 2
minutes: 160
summary: Diagramme nach der Frage wählen, ehrlich skalieren, sparsam färben und mit einer Aussage betiteln – und die Daten dafür mit pandas oder Excel so vorbereiten, dass der Monatsbericht sich selbst aktualisiert.
goals:
  - Du wählst zu einer Frage (Vergleich, Verlauf, Verteilung, Zusammenhang, Anteil) die passende Diagrammart und begründest die Wahl mit der Wahrnehmungsgenauigkeit.
  - Du erkennst abgeschnittene Achsen, Doppelachsen und falsch skalierte Flächen als Verzerrung und korrigierst sie.
  - Du setzt Farbe sparsam und barrierearm ein, beschriftest direkt und formulierst Titel als überprüfbare Aussage.
  - Du bereitest Daten mit pandas diagrammfertig vor – Top 5 plus „Sonstige“, lange Form, Anteile und Indexierung auf 100.
  - Du baust Diagramme im Monatsbericht als Vorlage, die mit neuen Daten aktualisiert wird, statt sie jeden Monat von Hand nachzubauen.
