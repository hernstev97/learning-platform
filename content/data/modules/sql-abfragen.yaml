id: sql-abfragen
title: SQL-Abfragen für Analysen
level: 1
minutes: 150
summary: Mit SELECT, WHERE, GROUP BY und HAVING Fragen an eine Tabelle stellen – mit sicherem Umgang mit NULL, Datumswerten und den Typregeln von SQLite, damit der Monatsbericht jedes Mal nach denselben Regeln rechnet.
goals:
  - Du schreibst Abfragen mit `SELECT`, `WHERE`, `ORDER BY` und `LIMIT` und erklärst ihre logische Auswertungsreihenfolge.
  - Du rechnest mit Ausdrücken, Aliasen und `CASE` und umgehst die Integer-Division.
  - Du sagst voraus, wie sich `NULL` in Vergleichen, `CASE` und Aggregatfunktionen verhält, und unterscheidest `COUNT(*)` von `COUNT(spalte)`.
  - Du gruppierst mit `GROUP BY` und filterst an der richtigen Stelle – Zeilen mit `WHERE`, Gruppen mit `HAVING`.
  - Du wertest ISO-Datumswerte mit `strftime` und `date` nach Monaten aus und erkennst Zahlen, die als Text gespeichert sind.
