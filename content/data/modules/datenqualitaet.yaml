id: datenqualitaet
title: Datenqualität messen und sichern
level: 2
minutes: 190
summary: Datenqualität als messbare Eigenschaft – Prüfregeln als Code, Abgleich mit dem Quellsystem, Quarantäne und Qualitätsbericht, damit Fehler vor dem Monatsbericht auffallen und nicht danach.
goals:
  - Du ordnest Datenfehler den sechs Qualitätsdimensionen zu und machst aus jeder eine Kennzahl.
  - Du schreibst Prüfregeln als Python-Funktionen und als SQL-Abfragen – für Pflichtfelder, Wertebereiche, Duplikate und Waisen.
  - Du gleichst einen Export über Zeilenzahlen und Summen pro Tag mit dem Quellsystem ab und rechnest dabei exakt.
  - Du leitest fehlerhafte Zeilen mit allen Gründen in eine Quarantäne, statt sie still zu verwerfen, und fasst das Ergebnis in einem Qualitätsbericht zusammen.
  - Du setzt Excel-Datenüberprüfung und Prüfspalten dort ein, wo Daten entstehen, und kennst ihre Grenzen.
