lesson: |
  Erster Werktag im April bei Bohnenwerk. Um 9 Uhr geht der Monatsbericht März an die Geschäftsführung: 1 240 Webshop-Bestellungen, 47 386,20 EUR Nettoumsatz. Um 11 Uhr ruft der Vertriebsleiter an: Das Shop-Backend zeigt 1 262 Bestellungen und 48 212,90 EUR. Die Suche dauert bis zum Nachmittag. Der Export lief am 31. März um 18 Uhr, 23 Bestellungen fehlen, eine steht doppelt drin. Gerechnet hat niemand falsch. Die Daten waren unvollständig, und niemand hat es gemessen.

  Datenqualität ist kein Eindruck („sieht plausibel aus“), sondern eine Eigenschaft, die du misst: mit Regeln für jede Zeile, einem Abgleich gegen das Quellsystem und einem Bericht, der sagt, was nicht stimmt. In diesem Modul baust du diese Prüfungen so, dass sie bei jedem Import automatisch laufen. Aus der Fehlersuche nach dem Beschwerdeanruf wird ein Prozessschritt von Sekunden, der anschlägt, bevor jemand den Bericht liest. Das technische Einlesen behandelt [CSV-Import und Datenbereinigung](/data/csv-import); hier geht es um die Frage danach: Stimmen die eingelesenen Daten?

  ## Sechs Dimensionen: Was „gute Daten“ messbar macht

  Ob Daten gut sind, hängt vom Zweck ab. Für den Monatsumsatz ist eine fehlende Telefonnummer egal, eine fehlende Bestellung nicht. Qualität heißt deshalb „geeignet für den Zweck“. Damit du sie messen kannst, zerlegst du sie in Dimensionen:

  | Dimension | Frage | Beispiel bei Bohnenwerk | Kennzahl |
  | --- | --- | --- | --- |
  | Vollständigkeit | Sind alle Zeilen und Pflichtwerte da? | `kunde_id` leer; Bestellungen vom 31.03. fehlen | Anteil gefüllter Pflichtfelder, Zeilen gegen Quelle |
  | Eindeutigkeit | Gibt es jede Einheit genau einmal? | Bestellung 10431 steht zweimal im Export | Zeilen minus verschiedene Schlüssel |
  | Gültigkeit | Halten Werte Typ, Format und Wertebereich ein? | `rabatt` = 0,35; Datum `2026-02-30`; Status `Bezahlt ` | Anteil Zeilen, die die Regel erfüllen |
  | Konsistenz | Passen zusammengehörige Werte zueinander? | Bestellung vor Anlage des Kunden; Position ohne Bestellung | Anteil widerspruchsfreier Zeilen |
  | Genauigkeit | Stimmt der Wert mit der Wirklichkeit überein? | Café bestellt 12 kg, erfasst sind 21 kg | Abweichungen in einer Stichprobe gegen Belege |
  | Aktualität | Ist der Stand neu genug für den Zweck? | Export von 18 Uhr für einen Bericht „bis Monatsende“ | jüngster Datensatz gegen Stichtag |

  Zwei Unterscheidungen tragen den Rest des Moduls. Erstens: **Gültig heißt nicht richtig.** `menge = 21` besteht jede Regel und ist trotzdem falsch. Eine Regel prüft, ob ein Wert möglich ist; ob er stimmt, zeigt nur eine unabhängige Quelle wie Lieferschein oder führendes System. Zweitens: **Vollständigkeit hat zwei Ebenen.** Ein leeres Feld findest du in den Daten. Eine Zeile, die ganz fehlt, hinterlässt in der Datei keine Spur – dafür brauchst du den Abgleich mit der Quelle.

  Aus jeder Dimension wird eine Kennzahl, die du Monat für Monat verfolgst. Der erste Schritt ist ein Profil der Tabelle. `COUNT(*)` zählt Zeilen, `COUNT(spalte)` nur Werte ungleich `NULL` ([SQLite · count](https://sqlite.org/lang_aggfunc.html#count)):

  ```sql run
  CREATE TABLE kunden (kunde_id INTEGER, name TEXT, email TEXT, plz TEXT);
  INSERT INTO kunden VALUES
    (1, 'Café Kranich', 'info@cafe-kranich.de', '50667'),
    (2, 'Büro Lindner', 'einkauf@lindner-buero.de', '50823'),
    (3, 'Jana Pohl', NULL, '51103'),
    (4, 'Café Kranich GmbH', 'Info@Cafe-Kranich.de ', ''),
    (5, 'Tim Okafor', 'tim.okafor@posteo.de', NULL),
    (5, 'Tim Okafor', 'tim.okafor@posteo.de', NULL);

  SELECT COUNT(*) AS zeilen,
         COUNT(DISTINCT kunde_id) AS kunden,
         COUNT(email) AS mit_email,
         COUNT(DISTINCT LOWER(TRIM(email))) AS verschiedene_emails,
         ROUND(100.0 * COUNT(NULLIF(plz, '')) / COUNT(*), 1) AS plz_quote
  FROM kunden;
  ```

  Sechs Zeilen, aber nur fünf Kundennummern: Kunde 5 steht doppelt. Fünf E-Mail-Adressen, aber nur drei verschiedene, wenn du Schreibweise und Leerzeichen ignorierst: Kunde 4 ist dasselbe Café wie Kunde 1 unter neuer Nummer. Eindeutigkeit betrifft also auch die Sache hinter dem Schlüssel. Die PLZ-Quote liegt bei 50 %, weil ein leerer Text kein `NULL` ist, bis `NULLIF` ihn dazu macht. Das `100.0` verhindert die Ganzzahldivision: `3 / 6` ergibt in SQLite `0`.

  ## Prüfregeln als Code: ein Regelkatalog statt Bauchgefühl

  Eine Prüfregel ist eine benannte Bedingung, die jede Zeile erfüllen muss. Als Code läuft sie bei jedem Import gleich, ist testbar, und der Katalog dokumentiert für die Fachabteilung, was geprüft wird. Jede Regel bekommt eine ID, eine Schwere und eine Prüfung:

  ```python run
  from datetime import date

  STATUS = {"bezahlt", "storniert", "retourniert"}

  def ist_datum(text):
      try:
          date.fromisoformat(text)
      except (TypeError, ValueError):
          return False
      return True

  # (ID, Schwere, Prüfung) – die Prüfung liefert True, wenn die Zeile in Ordnung ist
  REGELN = [
      ("PFLICHT_KUNDE", "Fehler", lambda z: z["kunde_id"] is not None),
      ("STATUS_GUELTIG", "Fehler", lambda z: z["status"] in STATUS),
      ("DATUM_GUELTIG", "Fehler", lambda z: ist_datum(z["bestelldatum"])),
      ("RABATT_BEREICH", "Fehler", lambda z: 0 <= z["rabatt"] <= 0.2),
      ("MENGE_PLAUSIBEL", "Warnung", lambda z: z["menge"] <= 50),
  ]

  zeile = {"bestellung_id": 10431, "kunde_id": 17, "status": "bezahlt ",
           "bestelldatum": "2026-02-30", "menge": 120, "rabatt": 0.1}
  for regel_id, schwere, pruefung in REGELN:
      if not pruefung(zeile):
          print(f"{schwere:8} {regel_id}")
  ```

  `date.fromisoformat` lehnt den 30. Februar ab ([datetime.date.fromisoformat](https://docs.python.org/3/library/datetime.html#datetime.date.fromisoformat)); ein regulärer Ausdruck wie `\d{4}-\d{2}-\d{2}` hätte ihn durchgelassen. `"bezahlt "` mit Leerzeichen fällt durch. Ob du Leerzeichen vorher entfernst, ist eine Bereinigungsregel des Imports – bekannt, dokumentiert, für alle Zeilen gleich. Was danach noch ungültig ist, wird gemeldet, nicht erraten.

  Die Schwere trennt zwei Arten von Regeln:

  - **Gültigkeitsregeln** beschreiben, was unmöglich ist: ein Rabatt über 20 %, ein Datum, das es nicht gibt, ein Status außerhalb der Liste. Ein Verstoß ist ein Fehler; die Zeile gehört nicht in den Bericht.
  - **Plausibilitätsregeln** beschreiben, was ungewöhnlich ist: 120 kg in einer Position, ein Einzelpreis 40 % unter Listenpreis. Ein Verstoß ist eine Warnung; die Zeile wird geladen, aber jemand sieht sie sich an.

  Wird Plausibilität zum Fehler, lehnt die Prüfung genau die echte Großbestellung einer Hotelkette ab. Ist Gültigkeit nur eine Warnung, landen unmögliche Werte im Bericht. Die Grenze einer Plausibilitätsregel leitest du aus den Daten ab, zum Beispiel aus Quantilen (siehe [Deskriptive Statistik](/data/deskriptive-statistik)).

  > [!TIP] Stichtag als Parameter
  > Übergib den Stichtag, statt `date.today()` aufzurufen. Die Regel „Bestelldatum nicht in der Zukunft“ liefert sonst morgen ein anderes Ergebnis für dieselbe Datei, und du kannst den Lauf vom 1. April nicht mehr nachvollziehen.

  ## SQL-Checks: Duplikate, Waisen und Widersprüche

  Liegen die Daten in einer Datenbank oder in einer Staging-Tabelle (einer Zwischentabelle, in die der Import roh geladen wird), formulierst du Regeln als Abfragen. Jede Abfrage liefert die **verletzenden** Zeilen: Ein leeres Ergebnis heißt „in Ordnung“, die Zeilenzahl ist die Anzahl der Befunde.

  ```sql run
  CREATE TABLE kunden (kunde_id INTEGER PRIMARY KEY, name TEXT, angelegt_am TEXT);
  INSERT INTO kunden VALUES (1, 'Café Kranich', '2025-11-04'), (2, 'Büro Lindner', '2026-03-05');
  CREATE TABLE bestellungen (bestellung_id INTEGER, kunde_id INTEGER, bestelldatum TEXT, status TEXT);
  INSERT INTO bestellungen VALUES
    (10430, 1, '2026-03-02', 'bezahlt'),
    (10431, 2, '2026-03-02', 'bezahlt'),
    (10431, 2, '2026-03-02', 'bezahlt'),
    (10432, 9, '2026-03-03', 'storniert'),
    (10433, NULL, '2026-03-03', 'bezahlt');

  -- Eindeutigkeit: Schlüssel, die mehr als einmal vorkommen
  SELECT bestellung_id, COUNT(*) AS anzahl
  FROM bestellungen
  GROUP BY bestellung_id
  HAVING COUNT(*) > 1;

  -- Referentielle Integrität: Bestellungen ohne passenden Kunden (Waisen)
  SELECT b.bestellung_id, b.kunde_id
  FROM bestellungen AS b
  LEFT JOIN kunden AS k ON k.kunde_id = b.kunde_id
  WHERE k.kunde_id IS NULL;

  -- Konsistenz: Bestellung vor Anlage des Kunden
  SELECT b.bestellung_id, b.bestelldatum, k.angelegt_am
  FROM bestellungen AS b
  JOIN kunden AS k ON k.kunde_id = b.kunde_id
  WHERE b.bestelldatum < k.angelegt_am;
  ```

  Die Waisenprüfung ist ein **Anti-Join**: Der `LEFT JOIN` behält jede Bestellung; findet er keinen Kunden, sind die Spalten von `k` `NULL`, und genau diese Zeilen lässt `WHERE k.kunde_id IS NULL` übrig. 10432 verweist auf den unbekannten Kunden 9, 10433 hat gar keinen. Die Konsistenzprüfung meldet 10431 zweimal: Ein Duplikat vervielfacht jeden späteren Befund, deshalb prüfst du Eindeutigkeit zuerst. Der Textvergleich der Daten funktioniert nur im ISO-Format `JJJJ-MM-TT` ([SQLite · Datumsfunktionen](https://sqlite.org/lang_datefunc.html)).

  > [!WARNING] NOT IN und NULL
  > `WHERE kunde_id NOT IN (SELECT kunde_id FROM bestellungen)` sucht Kunden ohne Bestellung – und liefert **nichts**, sobald die Unterabfrage ein einziges `NULL` enthält. `3 NOT IN (1, 2, NULL)` ist nicht wahr, sondern unbekannt ([SQLite · IN und NOT IN](https://sqlite.org/lang_expr.html#the_in_and_not_in_operators)). Für Waisenprüfungen nimmst du `LEFT JOIN … IS NULL` oder `NOT EXISTS`.

  Besser als jede nachträgliche Prüfung ist eine Regel, die fehlerhafte Daten gar nicht erst hineinlässt. Datenbanken erzwingen Schlüssel, Pflichtfelder und Wertebereiche mit Constraints ([SQLite · CHECK-Constraints](https://sqlite.org/lang_createtable.html#ckconst)):

  ```sql run fails
  CREATE TABLE positionen (
    bestellung_id INTEGER NOT NULL,
    position INTEGER NOT NULL,
    menge INTEGER NOT NULL CHECK (menge > 0),
    rabatt REAL NOT NULL CHECK (rabatt BETWEEN 0 AND 0.2),
    PRIMARY KEY (bestellung_id, position)
  );
  INSERT INTO positionen VALUES (10430, 1, 2, 0.1);
  INSERT INTO positionen VALUES (10430, 2, 1, 0.35);
  ```

  Die zweite Zeile scheitert mit `CHECK constraint failed`. Fremdschlüssel prüft SQLite nur, wenn die Verbindung `PRAGMA foreign_keys = ON` setzt; ohne das ist `REFERENCES` Dekoration ([SQLite · Foreign Keys aktivieren](https://sqlite.org/foreignkeys.html#fk_enable)). PostgreSQL erzwingt deklarierte Fremdschlüssel immer. Als Analyst bekommst du meist nur Exporte – also prüfst du nach dem Import selbst und meldest der IT, welche Constraints in der Quelle fehlen.

  ## Abgleich mit dem Quellsystem: Zeilen und Summen

  Regeln prüfen jede Zeile für sich. Was nicht da ist, sehen sie nicht. Genau das war das Problem im April: Jede der 1 240 Zeilen war gültig. Der **Abgleich** (englisch *Reconciliation*) vergleicht deshalb Kontrollsummen aus dem Quellsystem mit denselben Kennzahlen über deine Daten: Zeilenzahl und Anzahl verschiedener Schlüssel, Summe eines Betrags, frühestes und spätestes Datum.

  Die Zahlen der Quelle liefert das System selbst, etwa die Bestellübersicht im Shop-Backend. Vergleiche auf der feinsten Ebene, die die Quelle anbietet – pro Tag statt pro Monat. Dann zeigt eine Abweichung sofort, wo du suchen musst.

  ```python run
  from decimal import Decimal

  # Kontrollsummen aus dem Shop-Backend: Tag -> (Bestellungen, Nettoumsatz)
  quelle = {
      "2026-03-30": (41, Decimal("1873.40")),
      "2026-03-31": (38, Decimal("1650.10")),
  }
  # dieselben Kennzahlen, berechnet aus dem Export
  export = {
      "2026-03-30": (41, Decimal("1873.40")),
      "2026-03-31": (15, Decimal("702.35")),
  }
  for tag in sorted(quelle.keys() | export.keys()):
      soll = quelle.get(tag, (0, Decimal("0")))
      ist = export.get(tag, (0, Decimal("0")))
      if soll != ist:
          print(f"{tag}: {ist[0]} statt {soll[0]} Bestellungen, "
                f"es fehlen {soll[1] - ist[1]} EUR")
  ```

  Drei Details machen den Abgleich belastbar. **Beide Richtungen:** Der Code läuft über die Tage aus Quelle *und* Export (`|` vereinigt die Schlüsselmengen). Ein Tag, der nur im Export steht, ist ebenso ein Befund – typisch bei Zeitzonen: 0:30 Uhr am 1. April deutscher Sommerzeit ist in UTC noch der 31. März. **Exakt rechnen:** Mit `float` ergibt `19.9 + 4.2 + 8.1` den Wert `32.199999999999996`, und der Abgleich meldet Phantomabweichungen. [`Decimal`](https://docs.python.org/3/library/decimal.html) rechnet mit Dezimalstellen wie die Buchhaltung; runden Quelle und Export verschieden, legst du eine Toleranz fest und nennst sie im Bericht. **Zeilenbilanz:** Jeder Schritt protokolliert, wie viele Zeilen hinein- und hinausgehen. Es muss gelten: eingelesen = geladen + Quarantäne + bewusst gefiltert. Sonst hat ein Schritt Zeilen still verloren.

  In Excel baust du denselben Abgleich als kleines Kontrollblatt. Die Werte der Quelle trägst du in Spalte B ein, Spalte C rechnet aus der Tabelle `Bestellungen`, und in Zeile 3 steht der Vergleich des Umsatzes:

  ```excel
  =ZEILEN(Bestellungen)
  =SUMME(Bestellungen[netto])
  =WENN(ABS(B3-C3)<=0,01;"ok";"Abweichung")
  ```

  `ZEILEN` (englisch `ROWS`) zählt die Datenzeilen, `SUMME` (`SUM`) summiert, `WENN` (`IF`) vergleicht mit einem Cent Toleranz. Eine bedingte Formatierung färbt „Abweichung“ rot ([Bedingte Formatierung verwenden](https://support.microsoft.com/de-de/office/verwenden-der-bedingten-formatierung-zum-hervorheben-von-informationen-e09711a3-48df-4bcb-b82c-9d8b8b22463d)).

  > [!MERKE]
  > Eine Regel prüft, ob ein Wert möglich ist. Ob er stimmt und ob alle Zeilen da sind, sagt dir nur der Abgleich mit der Quelle.

  ## Quarantäne statt stilles Verwerfen

  Wohin mit einer Zeile, die eine Fehlerregel verletzt? Drei Möglichkeiten:

  1. **Still verwerfen** (`continue`, ein Filter, `dropna()`): Der Bericht ist zu niedrig, und niemand weiß es. Die schlechteste Wahl: Sie sieht aus wie eine funktionierende Prüfung.
  2. **Den ganzen Import abbrechen:** Eine einzige falsche Zeile blockiert den Monatsbericht für alle.
  3. **Quarantäne:** Die Zeile wandert mit ihren Gründen in eine eigene Tabelle oder Datei, der Rest wird geladen, und der Bericht nennt die Lücke: „3 Bestellungen mit 412,80 EUR in Quarantäne“. Die Zeilen werden an der Quelle korrigiert und kommen mit dem nächsten Import zurück.

  ```python run
  def trenne(zeilen, regeln):
      gueltig, quarantaene = [], []
      for nr, zeile in enumerate(zeilen, start=2):  # Zeile 1 ist die Kopfzeile
          gruende = [regel_id for regel_id, pruefung in regeln if not pruefung(zeile)]
          if gruende:
              quarantaene.append({"zeile": nr, "gruende": gruende, "daten": zeile})
          else:
              gueltig.append(zeile)
      return gueltig, quarantaene

  regeln = [
      ("MENGE_POSITIV", lambda z: z["menge"] > 0),
      ("RABATT_BEREICH", lambda z: 0 <= z["rabatt"] <= 0.2),
  ]
  zeilen = [
      {"bestellung_id": 10430, "menge": 2, "rabatt": 0.0},
      {"bestellung_id": 10431, "menge": 0, "rabatt": 0.35},
      {"bestellung_id": 10432, "menge": 5, "rabatt": 0.1},
  ]
  gueltig, quarantaene = trenne(zeilen, regeln)
  assert len(gueltig) + len(quarantaene) == len(zeilen), "Zeilenbilanz stimmt nicht"
  print(len(gueltig), "geladen,", len(quarantaene), "in Quarantäne")
  for eintrag in quarantaene:
      print(eintrag["zeile"], eintrag["daten"]["bestellung_id"], ", ".join(eintrag["gruende"]))
  ```

  Eine gute Quarantäne erfüllt vier Bedingungen. Die Originalzeile bleibt unverändert, damit jemand in der Quelle nachsehen kann. Alle verletzten Regeln stehen darin, nicht nur die erste – sonst korrigiert jemand den Rabatt und scheitert beim nächsten Lauf an der Menge. Die Herkunft ist nachvollziehbar (Datei, Zeilennummer). Und die Zeilenbilanz geht auf. Landet ein großer Teil der Datei in der Quarantäne, ist der Fehler systematisch: neues Exportformat, verrutschte Spalte. Dann bricht ein **Quality Gate** (eine Schwelle, ab der nichts weiterläuft) den Lauf ab, statt einen halben Bericht zu verschicken.

  In pandas formulierst du dieselben Regeln als boolesche Masken und trennst mit `df[ok]` und `df[~ok]` ([pandas · Boolean indexing](https://pandas.pydata.org/docs/user_guide/indexing.html#boolean-indexing)). Das Prinzip bleibt gleich; mehr dazu in [pandas: Daten laden und bereinigen](/data/pandas-grundlagen).

  ## Qualitätsbericht und Excel-Datenüberprüfung

  Der Qualitätsbericht richtet sich an die Fachabteilung, nicht an dich. Er ist kurz, sieht jeden Monat gleich aus und beantwortet drei Fragen: Stimmt der Abgleich? Was ist in der Quarantäne? Wird es besser oder schlechter?

  ```text
  Qualitätsbericht Bestellungen März 2026
  Quelle: shop_export_2026-03.csv, Stand 01.04.2026 06:00
  Abgleich Shop-Backend: 1 262 Bestellungen, 48 212,90 EUR – übereinstimmend
  Positionen: 3 418 eingelesen, 3 409 geladen, 9 in Quarantäne

  Regel            Schwere  verletzt  Quote   Vormonat  Beispiele
  PFLICHT_KUNDE    Fehler          4  0,12 %  0,31 %    10877, 10912
  RABATT_BEREICH   Fehler          5  0,15 %  0,00 %    11020, 11021
  MENGE_PLAUSIBEL  Warnung         2  0,06 %  0,09 %    10733, 11102
  ```

  Die Spalte „Vormonat“ macht den Bericht zum Werkzeug für den Prozess. `RABATT_BEREICH` springt von 0 auf 5 Befunde: Im Shop wurde eine Aktion mit 25 % Rabatt angelegt, ohne dass das Controlling davon wusste. Ob die Aktion falsch eingerichtet oder die Regel veraltet ist, entscheidet die Fachabteilung, nicht das Skript. Jede Regel braucht deshalb eine verantwortliche Person, und wiederkehrende Ursachen werden dort behoben, wo sie entstehen: ein Pflichtfeld im Shop, eine Auswahlliste statt Freitext.

  Wo Menschen Daten in Excel erfassen, setzt du die Regel an der Eingabe an – bei Bohnenwerk in der Erfassungsliste für telefonische B2B-Bestellungen. **Daten › Datentools › Datenüberprüfung** ([Anwenden der Datenüberprüfung auf Zellen](https://support.microsoft.com/de-de/office/anwenden-der-datenüberprüfung-auf-zellen-29fecbcc-d1b9-42c1-9d76-eff3ce5f7249)) erlaubt unter „Zulassen“ ganze Zahlen, Dezimalzahlen, Datumsbereiche, eine Liste (Dropdown statt Freitext für `status`) oder eine benutzerdefinierte Formel. Die Formel schreibst du für die erste Zelle des markierten Bereichs; Excel verschiebt relative Bezüge für jede weitere Zelle. Für eindeutige Bestellnummern in A2:A500:

  ```excel
  =ZÄHLENWENN($A$2:$A$500;A2)=1
  ```

  `ZÄHLENWENN` (englisch `COUNTIF`) zählt, wie oft der Wert der geprüften Zelle im Bereich vorkommt ([ZÄHLENWENN](https://support.microsoft.com/de-de/office/zählenwenn-funktion-e0de10c6-f885-4e71-abb4-1f464816df34)). Der Bereich muss absolut sein (`$A$2:$A$500`), die geprüfte Zelle relativ (`A2`). Unter „Fehlermeldung“ wählst du den Typ: „Stopp“ verhindert die Eingabe (für Gültigkeitsregeln), „Warnung“ und „Information“ lassen sie nach Rückfrage zu (für Plausibilität).

  In einer Tabelle, die du auswertest, prüfst du mit Formelspalten. Eine Spalte `waise` in `Bestellungen` zeigt `WAHR`, wenn die Kundennummer in `Kunden` fehlt:

  ```excel
  =ZÄHLENWENN(Kunden[kunde_id];[@kunde_id])=0
  ```

  > [!WARNING] Grenzen der Datenüberprüfung
  > Excel prüft nur, was jemand in eine Zelle **tippt**. Kopierte oder per Ausfüllen erzeugte Werte lösen keine Meldung aus ([Weitere Informationen zur Datenüberprüfung](https://support.microsoft.com/de-de/office/weitere-informationen-zur-datenüberprüfung-f38dee73-9900-4ca6-9301-8a5f6e1f0c4c)), und normales Einfügen ersetzt sogar die Regel der Zielzelle durch die Eigenschaften der Quelle. Vorhandene Verstöße markiert **Daten › Datenüberprüfung › Ungültige Daten einkreisen**. Die Prüfung beim Import bleibt trotzdem nötig.

  > [!PRAXIS] Bohnenwerk: vom Beschwerdeanruf zum Prüfprotokoll
  > Der Monatslauf holt den Export am ersten Werktag um 6 Uhr, nach Monatsende. Ein Skript gleicht Zeilen und Umsatz pro Tag mit dem Shop-Backend ab, prüft 14 Regeln und schreibt Quarantäne und Qualitätsbericht. Nur wenn der Abgleich stimmt und die Quarantäne unter 1 % bleibt, geht der Monatsbericht raus – mit „Abgleich mit Shop-Backend: übereinstimmend“ im Kopf. Die Prüfung dauert Sekunden. Früher kostete jede Rückfrage des Vertriebs einen halben Tag Suche, und sie kam erst, nachdem die Geschäftsführung falsche Zahlen gesehen hatte.

  ## Häufige Fehler

  - **Fehlerhafte Zeilen still verwerfen.** Summen sind zu niedrig, niemand merkt es. Quarantäne mit Gründen und eine Zeilenbilanz, die aufgehen muss.
  - **Nur Regeln, kein Abgleich.** Jede Zeile ist gültig, aber 23 fehlen. Zeilenzahl und Summe pro Tag gegen die Quelle prüfen.
  - **Plausibilität als harte Regel.** Die echte Großbestellung landet in der Quarantäne. Ungewöhnliches ist eine Warnung, Unmögliches ein Fehler.
  - **`NOT IN` mit `NULL` in der Unterabfrage.** Die Waisenprüfung meldet 0 Befunde. `LEFT JOIN … IS NULL` oder `NOT EXISTS` verwenden.
  - **Quoten mit Ganzzahldivision.** `COUNT(email) / COUNT(*)` ergibt in SQLite 0. Mit `100.0 *` beginnen.
  - **Prüfungen, die bei kaputten Werten abstürzen.** `int("1,5")` wirft `ValueError`, und der ganze Lauf steht. Eine Regel fängt den Fehler ab und meldet einen Verstoß.
  - **Relative Bereiche in der Datenüberprüfung.** `=ZÄHLENWENN(A2:A500;A2)=1` verschiebt den Bereich mit jeder Zeile und findet Duplikate nur noch weiter unten.

  > [!INTERVIEW] „Wie stellst du sicher, dass die Zahlen in deinem Bericht stimmen?“
  > In drei Schichten. Erstens Regeln pro Zeile – Pflichtfelder, Wertebereiche, Duplikate, Waisen – als Code, der bei jedem Import läuft. Zweitens der Abgleich mit dem Quellsystem über Zeilenzahl und Summen pro Tag, weil Regeln fehlende Zeilen nicht sehen. Drittens Quarantäne statt stillem Verwerfen und ein Qualitätsbericht mit Trend. So fällt ein Export ohne die Bestellungen des letzten Abends auf, bevor der Bericht rausgeht.

  ## Zusammenfassung

  - Datenqualität ist messbar: Vollständigkeit, Eindeutigkeit, Gültigkeit, Konsistenz, Genauigkeit und Aktualität werden zu Kennzahlen mit Verlauf.
  - Gültig heißt nicht richtig. Regeln prüfen, ob ein Wert möglich ist; Genauigkeit und fehlende Zeilen zeigt nur der Vergleich mit einer unabhängigen Quelle.
  - Prüfregeln stehen als Code in einem Katalog mit ID und Schwere: Gültigkeit ist ein Fehler, Plausibilität eine Warnung.
  - SQL-Checks liefern die verletzenden Zeilen: `GROUP BY … HAVING COUNT(*) > 1` für Duplikate, `LEFT JOIN … IS NULL` für Waisen, nie `NOT IN` über Spalten mit `NULL`.
  - Der Abgleich vergleicht Zeilenzahlen und Summen pro Tag mit dem Quellsystem – in beide Richtungen und exakt mit `Decimal`.
  - Fehlerhafte Zeilen gehen mit allen Gründen in die Quarantäne; eingelesen = geladen + Quarantäne.
  - Der Qualitätsbericht zeigt Abgleich, Befunde und Trend; Excel-Datenüberprüfung verbessert die Erfassung, prüft aber nur getippte Werte.
exercises:
  - id: dimension-erkennen
    type: choice
    title: Alle Regeln grün – und trotzdem falsch
    prompt: |
      Café Kranich hat laut Lieferschein und Telefonnotiz 12 kg „Domstadt Espresso“ bestellt. Im Export steht bei dieser Position `menge = 21`. Alle Prüfregeln – Pflichtfelder, Wertebereiche, Duplikate, Waisen – laufen ohne Befund. Welche Qualitätsdimension ist verletzt?
    options:
      - text: Genauigkeit
        correct: true
        why: 21 ist ein möglicher Wert, nur nicht der wahre. Genauigkeit misst die Übereinstimmung mit der Wirklichkeit – hier mit dem Lieferschein.
      - text: Gültigkeit
        correct: false
        why: 21 ist eine positive ganze Zahl im erlaubten Bereich. Gültigkeit fragt nur, ob ein Wert möglich ist.
      - text: Konsistenz
        correct: false
        why: Innerhalb der Daten widerspricht nichts der 21 – Bestellung, Kunde und Produkt passen zusammen. Der Widerspruch entsteht erst mit einem Beleg außerhalb der Daten.
      - text: Vollständigkeit
        correct: false
        why: Die Position ist vorhanden und alle Felder sind gefüllt.
    explanation: |
      Regeln sehen nur die Daten selbst und können deshalb Genauigkeit nicht beweisen. Einen Zahlendreher von 12 zu 21 findest du nur mit einer unabhängigen Quelle: einer Stichprobe gegen Lieferscheine oder einem Abgleich gegen ein führendes System, etwa die Rechnungssumme. Eine Plausibilitätsregel („Menge weit über der üblichen Bestellmenge dieses Kunden“) kann grobe Ausreißer als Warnung melden, einen kleinen Dreher aber nicht. Deshalb gehört eine regelmäßige Stichprobe zum Qualitätsprozess.
    hints:
      - Frag dich bei jeder Dimension, womit du sie prüfen würdest – mit den Daten allein oder mit etwas außerhalb.

  - id: nur-abgleich
    type: choice
    title: Was keine Regel sehen kann
    prompt: |
      Welche dieser Probleme im März-Export findest du **nur** mit einem Abgleich gegen das Shop-Backend (Zeilenzahl und Umsatz pro Tag), nicht mit Regeln auf den Zeilen des Exports?
    options:
      - text: Der Export lief am 31. März um 18 Uhr; die Bestellungen des Abends fehlen.
        correct: true
        why: Fehlende Zeilen hinterlassen keine Spur in der Datei. Erst der Vergleich „15 statt 38 Bestellungen am 31.03.“ zeigt sie.
      - text: Beim Export war im Shop-Backend der Filter „nur bezahlt“ aktiv; stornierte Bestellungen fehlen.
        correct: true
        why: Jede exportierte Zeile ist gültig, und keine Regel verlangt, dass es Stornos gibt. Die Zeilenzahl der Quelle über alle Status deckt die Lücke auf.
      - text: Bestellung 10431 steht zweimal im Export.
        correct: false
        why: "`GROUP BY bestellung_id HAVING COUNT(*) > 1` findet das in den Daten selbst."
      - text: Eine Position hat `rabatt = 0.35`.
        correct: false
        why: Das verletzt eine Gültigkeitsregel für den Wertebereich 0 bis 0,2.
      - text: Bestellung 10432 verweist auf `kunde_id = 9`, die es in `kunden` nicht gibt.
        correct: false
        why: Das findet die Waisenprüfung per `LEFT JOIN … IS NULL` innerhalb der Daten.
    explanation: |
      Regeln prüfen, was da ist. Fehlende Zeilen – durch einen zu frühen Export, einen gesetzten Filter oder einen abgebrochenen Download – findest du nur, wenn du Zeilenzahl und Summen mit einer unabhängigen Zählung vergleichst. Duplikate, ungültige Werte und Waisen dagegen zeigen sich in den Daten selbst. Deshalb brauchst du beides: Regeln für die Zeilen und den Abgleich für die Menge.
    resources:
      - title: SQLite · count
        url: https://sqlite.org/lang_aggfunc.html#count

  - id: befunde-zaehlen
    type: output
    title: Befunde oder betroffene Zeilen?
    prompt: Was gibt das Programm aus?
    lang: python
    code: |
      zeilen = [
          {"id": 1, "menge": 2, "rabatt": 0.1},
          {"id": 2, "menge": 0, "rabatt": 0.0},
          {"id": 3, "menge": 5, "rabatt": 0.25},
          {"id": 4, "menge": -1, "rabatt": 0.3},
      ]
      regeln = {
          "MENGE_POSITIV": lambda z: z["menge"] > 0,
          "RABATT_BEREICH": lambda z: 0 <= z["rabatt"] <= 0.2,
      }
      befunde = []
      for regel_id, pruefung in regeln.items():
          for z in zeilen:
              if not pruefung(z):
                  befunde.append((regel_id, z["id"]))
      print(len(befunde))
      print(sorted({zeilen_id for _, zeilen_id in befunde}))
      print(befunde[0])
    expected: |
      4
      [2, 3, 4]
      ('MENGE_POSITIV', 2)
    explanation: |
      `MENGE_POSITIV` scheitert an Zeile 2 (Menge 0) und Zeile 4, `RABATT_BEREICH` an Zeile 3 und Zeile 4 – vier Befunde. Betroffen sind aber nur drei Zeilen, weil Zeile 4 zwei Regeln verletzt; die Mengenschreibweise `{…}` entfernt die doppelte 4. Im Qualitätsbericht sind beide Zahlen wichtig: Befunde pro Regel zeigen, *was* schiefgeht, betroffene Zeilen zeigen, *wie viel* in die Quarantäne geht. Die äußere Schleife läuft über die Regeln, deshalb ist der erste Befund der von `MENGE_POSITIV`.
    resources:
      - title: Python · Mengen (set)
        url: https://docs.python.org/3/tutorial/datastructures.html#sets

  - id: not-in-falle
    type: output
    title: Drei Prüfungen, drei Zahlen
    prompt: |
      Was gibt das Skript aus? Schreib die Ausgabe wie die `sqlite3`-Kommandozeile im Standardmodus: eine Zeile pro Ergebniszeile, keine Kopfzeile.
    lang: sql
    code: |
      CREATE TABLE kunden (kunde_id INTEGER PRIMARY KEY, name TEXT);
      INSERT INTO kunden VALUES (1, 'Café Kranich'), (2, 'Büro Lindner'), (3, 'Jana Pohl'), (4, 'Tim Okafor');
      CREATE TABLE bestellungen (bestellung_id INTEGER, kunde_id INTEGER);
      INSERT INTO bestellungen VALUES (10430, 1), (10431, 1), (10432, 2), (10433, NULL);

      SELECT COUNT(*) FROM kunden
      WHERE kunde_id NOT IN (SELECT kunde_id FROM bestellungen);

      SELECT COUNT(*) FROM kunden AS k
      LEFT JOIN bestellungen AS b ON b.kunde_id = k.kunde_id
      WHERE b.bestellung_id IS NULL;

      SELECT COUNT(*) FROM bestellungen AS b
      LEFT JOIN kunden AS k ON k.kunde_id = b.kunde_id
      WHERE k.kunde_id IS NULL;
    expected: |
      0
      2
      1
    explanation: |
      Die Unterabfrage liefert `1, 1, 2, NULL`. Für Kunde 3 heißt die Bedingung `3 NOT IN (1, 1, 2, NULL)`, also `3 <> 1 AND 3 <> 2 AND 3 <> NULL` – der letzte Vergleich ist unbekannt, damit ist das Ganze nie wahr, und die erste Abfrage zählt 0. Der Anti-Join mit `LEFT JOIN … IS NULL` findet die beiden Kunden 3 und 4 ohne Bestellung. Die dritte Abfrage prüft die Gegenrichtung: Bestellung 10433 hat keine `kunde_id` und findet deshalb keinen Kunden – eine Waise, die in keinem Bericht einem Kunden zugeordnet wird.
    resources:
      - title: SQLite · IN und NOT IN
        url: https://sqlite.org/lang_expr.html#the_in_and_not_in_operators
      - title: SQLite · NULL-Behandlung
        url: https://sqlite.org/nulls.html

  - id: doppelte-bestellungen
    type: sql
    title: Doppelt oder verwechselt?
    prompt: |
      Der Shop-Export landet zuerst in der Staging-Tabelle `import_bestellungen`; `zeile` ist die Zeilennummer in der CSV-Datei. Finde jede Bestellnummer, die mehr als einmal vorkommt.

      Spalten:
      - `bestellung_id`
      - `anzahl` – wie viele Zeilen diese Nummer haben
      - `betraege` – wie viele **verschiedene** Beträge unter dieser Nummer stehen

      Zeilen ohne Bestellnummer gehören nicht dazu; dafür gibt es eine eigene Vollständigkeitsregel. Sortiere nach `bestellung_id`.
    schema: |
      CREATE TABLE import_bestellungen (zeile INTEGER, bestellung_id INTEGER, kunde_id INTEGER, bestelldatum TEXT, betrag REAL);
      INSERT INTO import_bestellungen VALUES
        (2, 10430, 1, '2026-03-02', 48.90),
        (3, 10431, 2, '2026-03-02', 312.00),
        (4, 10432, 5, '2026-03-03', 27.50),
        (5, 10431, 2, '2026-03-02', 312.00),
        (6, 10433, 3, '2026-03-03', 64.20),
        (7, NULL, 4, '2026-03-04', 19.90),
        (8, 10434, 1, '2026-03-04', 55.00),
        (9, 10434, 6, '2026-03-04', 129.40),
        (10, NULL, 2, '2026-03-05', 88.00),
        (11, 10435, 3, '2026-03-05', 42.10),
        (12, 10431, 2, '2026-03-02', 312.00);
    starter: |
      SELECT bestellung_id, COUNT(*) AS anzahl
      FROM import_bestellungen
      GROUP BY bestellung_id;
    solution: |
      SELECT bestellung_id,
             COUNT(*) AS anzahl,
             COUNT(DISTINCT betrag) AS betraege
      FROM import_bestellungen
      WHERE bestellung_id IS NOT NULL
      GROUP BY bestellung_id
      HAVING COUNT(*) > 1
      ORDER BY bestellung_id;
    ordered: true
    hints:
      - Gruppen filterst du mit `HAVING`, einzelne Zeilen vorher mit `WHERE`.
      - "`GROUP BY` fasst alle `NULL`-Werte zu **einer** Gruppe zusammen – ohne Filter erscheint sie mit `anzahl` 2."
      - "`COUNT(DISTINCT betrag)` zählt verschiedene Beträge. Dazu `WHERE bestellung_id IS NOT NULL`, `HAVING COUNT(*) > 1` und `ORDER BY bestellung_id`."
    explanation: |
      `WHERE` wirft die Zeilen ohne Nummer vor dem Gruppieren hinaus; sonst bildet `GROUP BY` aus beiden `NULL`-Zeilen eine Gruppe, die wie ein Duplikat aussieht. `HAVING COUNT(*) > 1` behält nur Gruppen mit mehreren Zeilen. Die Spalte `betraege` trennt zwei Fälle, die verschieden behandelt werden: 10431 steht dreimal mit identischem Inhalt da – ein technisches Duplikat aus dem Export, das du nach einer dokumentierten Regel entfernen darfst. Unter 10434 stehen zwei verschiedene Bestellungen verschiedener Kunden – ein Schlüsselkonflikt, der in der Quelle geklärt werden muss und nie automatisch dedupliziert wird.
    resources:
      - title: SQLite · SELECT (GROUP BY und HAVING)
        url: https://sqlite.org/lang_select.html#resultset
      - title: SQLite · count(DISTINCT …)
        url: https://sqlite.org/lang_aggfunc.html#count

  - id: waisen-finden
    type: sql
    title: Positionen ohne Zuhause
    prompt: |
      Die Tabelle `positionen` kommt aus dem Import. Finde alle Positionen, deren Bestellung **oder** deren Produkt in den Stammtabellen fehlt. Auch Positionen ohne Bestellnummer gelten als Waisen.

      Spalten: `bestellung_id`, `position`, `bestellung_fehlt` und `produkt_fehlt` (jeweils `1` für fehlt, sonst `0`). Die Reihenfolge der Zeilen ist egal.
    schema: |
      CREATE TABLE bestellungen (bestellung_id INTEGER PRIMARY KEY, kunde_id INTEGER, bestelldatum TEXT);
      INSERT INTO bestellungen VALUES (10430, 1, '2026-03-02'), (10431, 2, '2026-03-02'), (10432, 5, '2026-03-03'), (10433, 3, '2026-03-03');
      CREATE TABLE produkte (produkt_id INTEGER PRIMARY KEY, name TEXT, kategorie TEXT);
      INSERT INTO produkte VALUES (101, 'Domstadt Espresso 1 kg', 'Espresso'), (102, 'Rheinufer Filter 500 g', 'Filter'), (201, 'Handfilter Porzellan', 'Zubehör');
      CREATE TABLE positionen (bestellung_id INTEGER, position INTEGER, produkt_id INTEGER, menge INTEGER);
      INSERT INTO positionen VALUES
        (10430, 1, 101, 2),
        (10430, 2, 201, 1),
        (10431, 1, 102, 6),
        (10431, 2, 105, 1),
        (10432, 1, 101, 1),
        (10436, 1, 102, 3),
        (10436, 2, 101, 1),
        (NULL, 1, 102, 2),
        (10433, 1, 101, 4),
        (10437, 1, 999, 1);
    starter: |
      SELECT p.bestellung_id, p.position
      FROM positionen AS p
      JOIN bestellungen AS b ON b.bestellung_id = p.bestellung_id;
    solution: |
      SELECT p.bestellung_id,
             p.position,
             b.bestellung_id IS NULL AS bestellung_fehlt,
             pr.produkt_id IS NULL AS produkt_fehlt
      FROM positionen AS p
      LEFT JOIN bestellungen AS b ON b.bestellung_id = p.bestellung_id
      LEFT JOIN produkte AS pr ON pr.produkt_id = p.produkt_id
      WHERE b.bestellung_id IS NULL OR pr.produkt_id IS NULL;
    hints:
      - Ein `JOIN` wirft genau die Zeilen weg, die du suchst. Du brauchst zwei `LEFT JOIN`s – einen zu `bestellungen`, einen zu `produkte`.
      - Fehlt der Partner, ist dessen Schlüsselspalte nach dem `LEFT JOIN` `NULL`. `ausdruck IS NULL` liefert in SQLite direkt `1` oder `0`.
      - "`WHERE b.bestellung_id IS NULL OR pr.produkt_id IS NULL` – und in der Auswahl dieselben Ausdrücke mit den Aliasen `bestellung_fehlt` und `produkt_fehlt`."
    explanation: |
      Jeder `LEFT JOIN` behält alle Positionen und füllt fehlende Partner mit `NULL` auf. Die `WHERE`-Bedingung behält die Zeilen, bei denen mindestens einer fehlt; die beiden Flags sagen, welcher. Die Position ohne Bestellnummer findet ebenfalls keinen Partner, weil `NULL = NULL` nicht wahr ist – sie erscheint mit `bestellung_fehlt = 1`. Mit `bestellung_id NOT IN (SELECT bestellung_id FROM bestellungen)` wäre genau diese Zeile verloren gegangen: `NULL NOT IN (…)` ist unbekannt. Position 10437/1 fehlt beides – deshalb liefern Flags mehr Information als eine Zeile pro Regel.
    resources:
      - title: SQLite · SELECT (Joins)
        url: https://sqlite.org/lang_select.html
      - title: SQLite · NULL-Behandlung
        url: https://sqlite.org/nulls.html

  - id: zeile-pruefen
    type: code
    title: Eine Bestellzeile prüfen
    prompt: |
      Schreibe `pruefe(zeile, stichtag)`. `zeile` ist ein Dictionary aus `csv.DictReader` – alle Werte sind Strings, Leerzeichen am Rand und Dezimalkommas hat der Import schon bereinigt. `stichtag` ist ein `date`. Die Funktion gibt die IDs aller verletzten Regeln als Liste zurück, **in dieser Reihenfolge**:

      | ID | Regel |
      | --- | --- |
      | `PFLICHT_KUNDE` | `kunde_id` ist nicht leer (auch nicht nur Leerzeichen) |
      | `DATUM_GUELTIG` | `bestelldatum` ist ein gültiges ISO-Datum und liegt nicht nach dem Stichtag |
      | `STATUS_GUELTIG` | `status` ist genau `bezahlt`, `storniert` oder `retourniert` |
      | `MENGE_GUELTIG` | `menge` ist eine ganze Zahl größer als 0 |
      | `RABATT_BEREICH` | `rabatt` ist eine Zahl von 0 bis einschließlich 0.2 |

      Unsinnige Werte wie `"zwei"` oder `""` sind Verstöße – die Funktion darf dabei keine Exception werfen.
    lang: python
    starter: |
      from datetime import date

      STATUS = {"bezahlt", "storniert", "retourniert"}


      def pruefe(zeile, stichtag):
          verstoesse = []
          if not zeile["kunde_id"]:
              verstoesse.append("PFLICHT_KUNDE")
          if zeile["status"] not in STATUS:
              verstoesse.append("STATUS_GUELTIG")
          # TODO: DATUM_GUELTIG, MENGE_GUELTIG, RABATT_BEREICH
          return verstoesse
    solution: |
      from datetime import date
      from decimal import Decimal, InvalidOperation

      STATUS = {"bezahlt", "storniert", "retourniert"}


      def als_datum(text):
          try:
              return date.fromisoformat(text)
          except ValueError:
              return None


      def als_ganzzahl(text):
          try:
              return int(text)
          except ValueError:
              return None


      def als_dezimal(text):
          try:
              wert = Decimal(text)
          except InvalidOperation:
              return None
          return wert if wert.is_finite() else None


      def pruefe(zeile, stichtag):
          verstoesse = []
          if not zeile["kunde_id"].strip():
              verstoesse.append("PFLICHT_KUNDE")
          datum = als_datum(zeile["bestelldatum"])
          if datum is None or datum > stichtag:
              verstoesse.append("DATUM_GUELTIG")
          if zeile["status"] not in STATUS:
              verstoesse.append("STATUS_GUELTIG")
          menge = als_ganzzahl(zeile["menge"])
          if menge is None or menge <= 0:
              verstoesse.append("MENGE_GUELTIG")
          rabatt = als_dezimal(zeile["rabatt"])
          if rabatt is None or not 0 <= rabatt <= Decimal("0.2"):
              verstoesse.append("RABATT_BEREICH")
          return verstoesse
    tests:
      - name: Gültige Zeile ergibt eine leere Liste
        code: |
          from datetime import date
          zeile = {"bestellung_id": "10430", "kunde_id": "17", "bestelldatum": "2026-03-14",
                   "status": "bezahlt", "menge": "2", "rabatt": "0.1"}
          ergebnis = pruefe(zeile, date(2026, 3, 31))
          assert ergebnis == [], f"erwartet [], bekommen {ergebnis!r}"
      - name: Mehrere Verstöße in Katalogreihenfolge
        code: |
          from datetime import date
          zeile = {"bestellung_id": "10431", "kunde_id": "   ", "bestelldatum": "2026-03-14",
                   "status": "Bezahlt", "menge": "2", "rabatt": "0.25"}
          ergebnis = pruefe(zeile, date(2026, 3, 31))
          erwartet = ["PFLICHT_KUNDE", "STATUS_GUELTIG", "RABATT_BEREICH"]
          assert ergebnis == erwartet, f"erwartet {erwartet!r}, bekommen {ergebnis!r} – zählen nur Leerzeichen als leer?"
      - name: Unmögliches Datum, falsches Format und Datum nach dem Stichtag
        code: |
          from datetime import date
          basis = {"bestellung_id": "1", "kunde_id": "17", "status": "bezahlt", "menge": "1", "rabatt": "0"}
          for datum in ["2026-02-30", "2026-04-01", "14.03.2026", ""]:
              ergebnis = pruefe({**basis, "bestelldatum": datum}, date(2026, 3, 31))
              assert ergebnis == ["DATUM_GUELTIG"], f"bestelldatum={datum!r}: bekommen {ergebnis!r}"
          ergebnis = pruefe({**basis, "bestelldatum": "2026-03-31"}, date(2026, 3, 31))
          assert ergebnis == [], f"Der Stichtag selbst ist erlaubt, bekommen {ergebnis!r}"
      - name: Menge – Verstoß statt Exception
        code: |
          from datetime import date
          basis = {"bestellung_id": "1", "kunde_id": "17", "bestelldatum": "2026-03-02", "status": "bezahlt", "rabatt": "0"}
          for menge in ["0", "-3", "1.5", "zwei", ""]:
              ergebnis = pruefe({**basis, "menge": menge}, date(2026, 3, 31))
              assert ergebnis == ["MENGE_GUELTIG"], f"menge={menge!r}: bekommen {ergebnis!r}"
      - name: Rabattgrenzen und nicht lesbare Werte
        code: |
          from datetime import date
          basis = {"bestellung_id": "1", "kunde_id": "17", "bestelldatum": "2026-03-02", "status": "bezahlt", "menge": "1"}
          for rabatt in ["0", "0.2"]:
              ergebnis = pruefe({**basis, "rabatt": rabatt}, date(2026, 3, 31))
              assert ergebnis == [], f"rabatt={rabatt!r} ist erlaubt, bekommen {ergebnis!r}"
          for rabatt in ["0.21", "-0.05", "0,1", ""]:
              ergebnis = pruefe({**basis, "rabatt": rabatt}, date(2026, 3, 31))
              assert ergebnis == ["RABATT_BEREICH"], f"rabatt={rabatt!r}: bekommen {ergebnis!r}"
    hints:
      - "`date.fromisoformat` wirft `ValueError` für den 30. Februar und für `14.03.2026`. Fang die Exception in einer kleinen Hilfsfunktion ab, die dann `None` liefert."
      - "`int(\"1.5\")` und `int(\"zwei\")` werfen ebenfalls `ValueError`. Für den Rabatt eignet sich `Decimal(text)`; es wirft bei Unsinn `decimal.InvalidOperation`."
      - "Reihenfolge: Kunde, Datum, Status, Menge, Rabatt. `\"   \".strip()` ist leer und damit falsy."
    explanation: |
      Jede Regel wandelt den Text zuerst in einen Typ um und prüft dann den Wertebereich. Die Umwandlung steckt in kleinen Hilfsfunktionen, die bei Unsinn `None` liefern – so wird ein kaputter Wert zum Verstoß, statt den ganzen Lauf mit einer Exception anzuhalten. `date.fromisoformat` prüft auch den Kalender, `Decimal` vergleicht `0.2` exakt ohne Binärrundung. Der Stichtag kommt als Parameter, damit derselbe Export morgen dasselbe Ergebnis liefert. Die feste Reihenfolge macht die Ausgabe testbar und den Qualitätsbericht vergleichbar.
    resources:
      - title: Python · datetime.date.fromisoformat
        url: https://docs.python.org/3/library/datetime.html#datetime.date.fromisoformat
      - title: Python · decimal – Quick-start
        url: https://docs.python.org/3/library/decimal.html#quick-start-tutorial

  - id: quarantaene-bauen
    type: code
    title: Nichts verwerfen, alles begründen
    prompt: |
      Die bisherige Funktion `trenne` wirft fehlerhafte Zeilen still weg. Schreibe sie so um, dass sie `(gueltig, quarantaene)` zurückgibt:

      - `gueltig` enthält die Zeilen, die alle Regeln erfüllen, in der ursprünglichen Reihenfolge.
      - `quarantaene` enthält für jede andere Zeile ein Dictionary `{"zeile": nr, "gruende": [...], "daten": zeile}`. `nr` ist die Zeilennummer in der CSV-Datei: Die erste Datenzeile ist Zeile 2, weil Zeile 1 die Kopfzeile ist. `gruende` listet **alle** verletzten Regel-IDs in der Reihenfolge von `regeln`.
      - Wirft eine Prüfung eine Exception, zählt das als Verstoß gegen diese Regel.
      - Die Eingabe-Dictionaries bleiben unverändert.

      `regeln` ist eine Liste von Paaren `(regel_id, pruefung)`; `pruefung(zeile)` liefert `True`, wenn die Zeile in Ordnung ist.
    lang: python
    starter: |
      def trenne(zeilen, regeln):
          gueltig = []
          for zeile in zeilen:
              if all(pruefung(zeile) for _, pruefung in regeln):
                  gueltig.append(zeile)
          return gueltig, []
    solution: |
      def trenne(zeilen, regeln):
          gueltig, quarantaene = [], []
          for nr, zeile in enumerate(zeilen, start=2):
              gruende = []
              for regel_id, pruefung in regeln:
                  try:
                      ok = pruefung(zeile)
                  except Exception:
                      ok = False
                  if not ok:
                      gruende.append(regel_id)
              if gruende:
                  quarantaene.append({"zeile": nr, "gruende": gruende, "daten": zeile})
              else:
                  gueltig.append(zeile)
          return gueltig, quarantaene
    tests:
      - name: Die Zeilenbilanz geht auf
        code: |
          regeln = [("MENGE_POSITIV", lambda z: z["menge"] > 0),
                    ("RABATT_BEREICH", lambda z: 0 <= z["rabatt"] <= 0.2)]
          zeilen = [{"id": 10430, "menge": 2, "rabatt": 0.0}, {"id": 10431, "menge": 0, "rabatt": 0.1},
                    {"id": 10432, "menge": 5, "rabatt": 0.1}, {"id": 10433, "menge": 1, "rabatt": 0.5}]
          gueltig, quarantaene = trenne(zeilen, regeln)
          assert len(gueltig) + len(quarantaene) == 4, f"{len(gueltig)} gültig + {len(quarantaene)} Quarantäne ergibt nicht 4 – Zeilen verloren"
          assert [z["id"] for z in gueltig] == [10430, 10432], f"gültig: {[z['id'] for z in gueltig]}"
      - name: Zeilennummer und alle Gründe
        code: |
          regeln = [("MENGE_POSITIV", lambda z: z["menge"] > 0),
                    ("RABATT_BEREICH", lambda z: 0 <= z["rabatt"] <= 0.2)]
          zeilen = [{"id": 10430, "menge": 2, "rabatt": 0.0}, {"id": 10431, "menge": 0, "rabatt": 0.35}]
          _, quarantaene = trenne(zeilen, regeln)
          assert len(quarantaene) == 1, f"erwartet 1 Eintrag, bekommen {len(quarantaene)}"
          eintrag = quarantaene[0]
          assert eintrag["zeile"] == 3, f"zweite Datenzeile ist CSV-Zeile 3, bekommen {eintrag['zeile']!r}"
          assert eintrag["gruende"] == ["MENGE_POSITIV", "RABATT_BEREICH"], f"gruende: {eintrag['gruende']!r}"
          assert eintrag["daten"] == {"id": 10431, "menge": 0, "rabatt": 0.35}, "daten muss die Originalzeile enthalten"
      - name: Eine abstürzende Prüfung ist ein Verstoß
        code: |
          regeln = [("MENGE_POSITIV", lambda z: z["menge"] > 0)]
          zeilen = [{"id": 10430, "menge": None}, {"id": 10431, "menge": 3}]
          gueltig, quarantaene = trenne(zeilen, regeln)
          assert [z["id"] for z in gueltig] == [10431], "Zeile 10431 ist gültig"
          assert [q["gruende"] for q in quarantaene] == [["MENGE_POSITIV"]], f"bekommen {[q['gruende'] for q in quarantaene]!r}"
      - name: Eingabe bleibt unverändert
        code: |
          import copy
          regeln = [("MENGE_POSITIV", lambda z: z["menge"] > 0)]
          zeilen = [{"id": 1, "menge": 0}, {"id": 2, "menge": 4}]
          vorher = copy.deepcopy(zeilen)
          trenne(zeilen, regeln)
          assert zeilen == vorher, f"Die Eingabe wurde verändert: {zeilen!r}"
      - name: Leere Eingabe
        code: |
          assert trenne([], [("X", lambda z: True)]) == ([], []), "Keine Zeilen – keine Ergebnisse"
    hints:
      - "`enumerate(zeilen, start=2)` liefert die CSV-Zeilennummer gleich mit."
      - Sammle für jede Zeile erst alle Gründe in einer Liste und entscheide danach, wohin die Zeile gehört.
      - Umschließe den Aufruf `pruefung(zeile)` mit `try`/`except Exception` und setze im Fehlerfall `ok = False`. Schreib nichts in `zeile` hinein.
    explanation: |
      Die Quarantäne macht aus einem stillen Verlust einen sichtbaren Befund: Jede Zeile landet genau in einer der beiden Listen, deshalb gilt immer `len(gueltig) + len(quarantaene) == len(zeilen)`. Alle Gründe auf einmal zu sammeln spart Korrekturrunden an der Quelle. Eine Prüfung, die bei `None` abstürzt, darf nicht den ganzen Lauf beenden – der kaputte Wert ist selbst der Befund. Die Originalzeile bleibt unverändert, damit die Rückfrage an die Quelle genau das zeigt, was angekommen ist; ein zusätzlicher Schlüssel wie `grund` in der Zeile würde außerdem beim späteren Schreiben der gültigen Daten stören.
    resources:
      - title: Python · enumerate
        url: https://docs.python.org/3/library/functions.html#enumerate
      - title: Python · Ausnahmen behandeln
        url: https://docs.python.org/3/tutorial/errors.html#handling-exceptions

  - id: abgleich-je-tag
    type: sql
    title: Welche Tage passen nicht?
    prompt: |
      Die Tabelle `kontrolle` enthält die Bestellübersicht aus dem Shop-Backend: pro Tag Anzahl und Umsatz. `import_bestellungen` ist dein Export. Liste alle Tage auf, an denen Anzahl **oder** Umsatz nicht übereinstimmen.

      Spalten:
      - `tag`
      - `soll_anzahl` – Anzahl laut Kontrolle
      - `ist_anzahl` – Anzahl im Import (0, wenn der Tag im Import fehlt)
      - `differenz` – Umsatz laut Kontrolle minus Umsatz im Import, auf zwei Nachkommastellen gerundet

      Differenzen unter einem Cent zählen nicht als Abweichung. Sortiere nach `tag`.
    schema: |
      CREATE TABLE kontrolle (tag TEXT PRIMARY KEY, bestellungen INTEGER, umsatz REAL);
      INSERT INTO kontrolle VALUES
        ('2026-03-27', 2, 110.00),
        ('2026-03-28', 3, 187.30),
        ('2026-03-29', 3, 32.20),
        ('2026-03-30', 4, 512.75),
        ('2026-03-31', 3, 233.10);
      CREATE TABLE import_bestellungen (bestellung_id INTEGER, bestelldatum TEXT, betrag REAL);
      INSERT INTO import_bestellungen VALUES
        (11199, '2026-03-27', 55.00),
        (11200, '2026-03-27', 55.00),
        (11200, '2026-03-27', 55.00),
        (11201, '2026-03-28', 48.90),
        (11202, '2026-03-28', 74.50),
        (11203, '2026-03-28', 63.90),
        (11204, '2026-03-29', 19.90),
        (11205, '2026-03-29', 4.20),
        (11206, '2026-03-29', 8.10),
        (11207, '2026-03-30', 312.00),
        (11208, '2026-03-30', 88.25),
        (11209, '2026-03-30', 64.20),
        (11210, '2026-03-30', 45.30);
    starter: |
      SELECT bestelldatum AS tag, COUNT(*) AS ist_anzahl, SUM(betrag) AS umsatz
      FROM import_bestellungen
      GROUP BY bestelldatum;
    solution: |
      WITH ist AS (
        SELECT bestelldatum AS tag, COUNT(*) AS anzahl, SUM(betrag) AS umsatz
        FROM import_bestellungen
        GROUP BY bestelldatum
      )
      SELECT k.tag,
             k.bestellungen AS soll_anzahl,
             COALESCE(i.anzahl, 0) AS ist_anzahl,
             ROUND(k.umsatz - COALESCE(i.umsatz, 0), 2) AS differenz
      FROM kontrolle AS k
      LEFT JOIN ist AS i ON i.tag = k.tag
      WHERE k.bestellungen <> COALESCE(i.anzahl, 0)
         OR ROUND(k.umsatz - COALESCE(i.umsatz, 0), 2) <> 0
      ORDER BY k.tag;
    ordered: true
    hints:
      - Verdichte den Import zuerst auf eine Zeile pro Tag (die Startabfrage) und verbinde erst dann mit `kontrolle`. Ein Join auf Einzelzeilen würde die Kontrollwerte vervielfachen.
      - Der 31. März fehlt im Import ganz. Nur ein `LEFT JOIN` von `kontrolle` aus behält ihn; `COALESCE(…, 0)` macht aus `NULL` eine 0.
      - "Vergleiche den Umsatz gerundet: `19.90 + 4.20 + 8.10` ergibt als Gleitkommazahl `32.199999999999996`. Die Startabfrage passt in eine CTE `WITH ist AS (…)` oder in eine Unterabfrage im `FROM`."
    explanation: |
      Der Abgleich verdichtet zuerst den Import auf die Ebene der Kontrolle – eine Zeile pro Tag – und verbindet dann per `LEFT JOIN` von der Kontrollseite aus, sodass der 31. März sichtbar bleibt, obwohl er im Import fehlt. Am 27. März stimmt die Summe nicht, weil 11200 doppelt steht; am 30. März stimmt die Anzahl, aber ein Betrag weicht um 3 EUR ab – deshalb prüfst du immer Anzahl *und* Summe. Der 29. März ist korrekt, würde mit `k.umsatz <> i.umsatz` aber als Phantomabweichung auftauchen, weil die Gleitkommasumme nicht genau 32.2 ist. Tage, die nur im Import stehen, findet diese Abfrage nicht; dafür bräuchtest du die Gegenrichtung oder einen `FULL JOIN`.
    resources:
      - title: SQLite · WITH (Common Table Expressions)
        url: https://sqlite.org/lang_with.html
      - title: SQLite · Aggregatfunktionen
        url: https://sqlite.org/lang_aggfunc.html

  - id: pruefspalten-excel
    type: gap
    title: Prüfspalten in der Bestelltabelle
    prompt: |
      In Excel liegen die Tabellen `Bestellungen` (Spalten `bestellung_id`, `kunde_id`, `bestelldatum`, `status`, `netto`) und `Kunden` (Spalten `kunde_id`, `name`, `angelegt_am`). Ergänze drei berechnete Spalten in `Bestellungen`, die jeweils `WAHR` bei einem Befund zeigen:

      1. `doppelt` – die Bestellnummer kommt in der Tabelle mehr als einmal vor,
      2. `waise` – die Kundennummer fehlt in `Kunden`,
      3. `vor_anlage` – die Bestellung liegt vor dem Anlagedatum des Kunden (Microsoft 365 oder Excel 2021).

      Deutsche und englische Funktionsnamen werden beide akzeptiert.
    lang: excel
    code: |
      =ZÄHLENWENN(⟦[bestellung_id]⟧;[@bestellung_id])>1
      =⟦ZÄHLENWENN(Kunden[kunde_id];[@kunde_id])=0⟧
      =[@bestelldatum]<⟦XVERWEIS⟧([@kunde_id];Kunden[kunde_id];⟦Kunden[angelegt_am]⟧)
    gaps:
      - label: Bereich für die Zählung
        hint: Die ganze Spalte `bestellung_id` derselben Tabelle – als strukturierter Verweis in eckigen Klammern.
        accept: ["Bestellungen[bestellung_id]"]
      - label: Waisenprüfung
        hint: Zähle, wie oft die Kundennummer der aktuellen Zeile in `Kunden[kunde_id]` vorkommt, und vergleiche mit 0.
        accept:
          - ZÄHLENWENN(Kunden[kunde_id];[@kunde_id])<1
          - ZÄHLENWENNS(Kunden[kunde_id];[@kunde_id])=0
          - ISTNV(XVERGLEICH([@kunde_id];Kunden[kunde_id]))
          - ISTNV(VERGLEICH([@kunde_id];Kunden[kunde_id];0))
          - NICHT(ISTZAHL(VERGLEICH([@kunde_id];Kunden[kunde_id];0)))
      - label: Nachschlagen
        hint: Die moderne Suchfunktion, die Suchspalte und Rückgabespalte getrennt nimmt.
      - label: Rückgabespalte
        hint: Welche Spalte von `Kunden` enthält das Datum, mit dem du vergleichst?
    explanation: |
      `[bestellung_id]` meint innerhalb einer Tabelle die ganze Spalte derselben Tabelle, `[@bestellung_id]` den Wert der aktuellen Zeile – `ZÄHLENWENN` (`COUNTIF`) zählt also, wie oft die eigene Nummer vorkommt. Für die Waise reicht dieselbe Funktion gegen die andere Tabelle: 0 Treffer heißt „Kunde unbekannt“. `XVERWEIS` (englisch `XLOOKUP`) holt das Anlagedatum; weil Excel Datumswerte als Zahlen speichert, funktioniert der Vergleich mit `<`. Für einen unbekannten Kunden liefert `XVERWEIS` `#NV` – diesen Fall deckt die Spalte `waise` ab. Ältere Excel-Versionen ohne `XVERWEIS` brauchen `INDEX` und `VERGLEICH`.
    resources:
      - title: Microsoft · ZÄHLENWENN
        url: https://support.microsoft.com/de-de/office/zählenwenn-funktion-e0de10c6-f885-4e71-abb4-1f464816df34
      - title: Microsoft · Verwenden strukturierter Verweise mit Excel-Tabellen
        url: https://support.microsoft.com/de-de/office/verwenden-von-strukturierten-verweisen-mit-excel-tabellen-f5ed2452-2337-4f71-bed3-c8ae6d2b276e

  - id: dubletten-rutschen-durch
    type: bug
    title: Die Dublette, die niemand bemerkt
    prompt: |
      Die Erfassungsliste für telefonische B2B-Bestellungen hat drei benutzerdefinierte Regeln der Datenüberprüfung. Jede wurde für den Bereich ab Zeile 2 bis Zeile 500 angelegt, mit Zeile 2 als aktiver Zelle:

      - Formel 1 für A2:A500 – die Bestellnummer ist eindeutig,
      - Formel 2 für E2:E500 – der Einzelpreis ist eine positive Zahl,
      - Formel 3 für F2:F500 – der Rabatt liegt zwischen 0 und 20 %.

      Beim Test hat Excel eine Nummer in A2 abgelehnt, die schon in A7 stand. Im Alltag tippt der Innendienst aber von oben nach unten – und Excel nimmt in A10 dieselbe Nummer an, die schon in A5 steht. Finde die fehlerhafte Formel und korrigiere sie.
    lang: excel
    code: |
      =ZÄHLENWENN(A2:A500;A2)=1
      =UND(ISTZAHL(E2);E2>0)
      =UND(F2>=0;F2<=0,2)
    lines: [1]
    fix:
      - line: 1
        answers:
          - =ZÄHLENWENN($A$2:$A$500;A2)=1
          - =ZÄHLENWENN(A$2:A$500;A2)=1
          - =ZÄHLENWENN($A$2:$A$500;$A2)=1
          - =ZÄHLENWENN($A$2:$A$500;A2)<2
          - =ZÄHLENWENN($A$2:$A$500;A2)<=1
          - =ZÄHLENWENN($A:$A;A2)=1
          - =ZÄHLENWENN(A:A;A2)=1
    hints:
      - Excel wendet die Formel auf jede Zelle des Bereichs an und verschiebt dabei alle relativen Bezüge. Wie lautet die Formel für A10?
      - Für A10 steht dort `ZÄHLENWENN(A10:A508;A10)`. Welcher Teil muss beim Verschieben fest bleiben?
    explanation: |
      Die Formel gilt für A2 und wird für jede weitere Zelle relativ verschoben: In A10 lautet sie `=ZÄHLENWENN(A10:A508;A10)=1`. Der Bereich beginnt also immer bei der aktuellen Zeile und sieht nur Werte weiter unten. Beim Test in A2 stand die doppelte Nummer darunter, deshalb schlug die Regel an; beim Tippen von oben nach unten steht sie immer darüber. Mit `$A$2:$A$500` bleibt der Bereich fest, nur die geprüfte Zelle wandert mit. `A$2:A$500` oder die ganze Spalte `A:A` funktionieren hier auch, weil die Regel nur in Spalte A liegt.
    resources:
      - title: Microsoft · Anwenden der Datenüberprüfung auf Zellen
        url: https://support.microsoft.com/de-de/office/anwenden-der-datenüberprüfung-auf-zellen-29fecbcc-d1b9-42c1-9d76-eff3ce5f7249
      - title: Microsoft · ZÄHLENWENN
        url: https://support.microsoft.com/de-de/office/zählenwenn-funktion-e0de10c6-f885-4e71-abb4-1f464816df34

  - id: abgleich-reparieren
    type: code
    title: Repariere den Abgleich
    prompt: |
      `abgleich(export, quelle)` soll jeden Tag melden, an dem Anzahl oder Umsatz des Exports nicht zur Bestellübersicht des Shop-Backends passen.

      - `export` ist eine Liste von Dictionaries mit `"tag"` (ISO-Datum) und `"betrag"` (Text wie `"48.90"`).
      - `quelle` ordnet jedem Tag ein Paar `(anzahl, summe)` zu, die Summe als Text.
      - Rückgabe: eine Liste von Tupeln `(tag, soll_anzahl, ist_anzahl, differenz)`, sortiert nach Tag. `differenz` ist Soll-Summe minus Ist-Summe als `Decimal`.
      - Tage, die nur in der Quelle **oder** nur im Export vorkommen, sind Abweichungen.

      Die vorhandene Version meldet Phantomabweichungen und übersieht Tage. Repariere sie.
    lang: python
    starter: |
      def abgleich(export, quelle):
          ist = {}
          for zeile in export:
              anzahl, summe = ist.get(zeile["tag"], (0, 0.0))
              ist[zeile["tag"]] = (anzahl + 1, summe + float(zeile["betrag"]))
          abweichungen = []
          for tag, (soll_anzahl, soll_summe) in quelle.items():
              ist_anzahl, ist_summe = ist.get(tag, (0, 0.0))
              if ist_anzahl != soll_anzahl or ist_summe != float(soll_summe):
                  abweichungen.append((tag, soll_anzahl, ist_anzahl, float(soll_summe) - ist_summe))
          return abweichungen
    solution: |
      from decimal import Decimal


      def abgleich(export, quelle):
          ist = {}
          for zeile in export:
              anzahl, summe = ist.get(zeile["tag"], (0, Decimal("0")))
              ist[zeile["tag"]] = (anzahl + 1, summe + Decimal(zeile["betrag"]))
          abweichungen = []
          for tag in sorted(quelle.keys() | ist.keys()):
              soll_anzahl, soll_text = quelle.get(tag, (0, "0"))
              soll_summe = Decimal(soll_text)
              ist_anzahl, ist_summe = ist.get(tag, (0, Decimal("0")))
              if ist_anzahl != soll_anzahl or ist_summe != soll_summe:
                  abweichungen.append((tag, soll_anzahl, ist_anzahl, soll_summe - ist_summe))
          return abweichungen
    tests:
      - name: Übereinstimmende Tage melden nichts
        code: |
          export = [{"tag": "2026-03-29", "betrag": b} for b in ["19.90", "4.20", "8.10"]]
          ergebnis = abgleich(export, {"2026-03-29": (3, "32.20")})
          assert ergebnis == [], f"Phantomabweichung: {ergebnis!r} – rechnest du mit float?"
      - name: Fehlender Tag im Export
        code: |
          from decimal import Decimal
          export = [{"tag": "2026-03-30", "betrag": "48.90"}]
          quelle = {"2026-03-30": (1, "48.90"), "2026-03-31": (3, "233.10")}
          ergebnis = abgleich(export, quelle)
          assert ergebnis == [("2026-03-31", 3, 0, Decimal("233.10"))], f"bekommen {ergebnis!r}"
      - name: Tag nur im Export
        code: |
          from decimal import Decimal
          export = [{"tag": "2026-03-31", "betrag": "12.00"}, {"tag": "2026-04-01", "betrag": "55.00"}]
          ergebnis = abgleich(export, {"2026-03-31": (1, "12.00")})
          assert ergebnis == [("2026-04-01", 0, 1, Decimal("-55.00"))], f"bekommen {ergebnis!r} – läufst du auch über die Tage des Exports?"
      - name: Differenz exakt als Decimal
        code: |
          from decimal import Decimal
          export = [{"tag": "2026-03-30", "betrag": b} for b in ["312.00", "88.25", "64.20", "45.30"]]
          ergebnis = abgleich(export, {"2026-03-30": (4, "512.75")})
          assert len(ergebnis) == 1, f"erwartet eine Abweichung, bekommen {ergebnis!r}"
          differenz = ergebnis[0][3]
          assert isinstance(differenz, Decimal), f"differenz ist {type(differenz).__name__}, erwartet Decimal"
          assert differenz == Decimal("3.00"), f"differenz: {differenz!r}"
      - name: Sortiert nach Tag
        code: |
          export = [{"tag": "2026-03-31", "betrag": "1.00"}]
          quelle = {"2026-03-31": (2, "2.00"), "2026-03-01": (1, "5.00")}
          tage = [a[0] for a in abgleich(export, quelle)]
          assert tage == ["2026-03-01", "2026-03-31"], f"Reihenfolge: {tage!r}"
    hints:
      - "Zwei Ursachen: Mit `float` ergibt `19.9 + 4.2 + 8.1` nicht genau `32.2`, und die zweite Schleife kennt nur die Tage der Quelle."
      - "Rechne mit `Decimal(zeile[\"betrag\"])` und `Decimal(\"0\")` als Startwert. Die Vereinigung der Tage liefert `quelle.keys() | ist.keys()`."
      - "`for tag in sorted(quelle.keys() | ist.keys()):` und `quelle.get(tag, (0, \"0\"))` für Tage, die nur im Export stehen."
    explanation: |
      Die alte Version hatte zwei Fehler. `float` kann `19.90` nicht exakt darstellen; die Summe dreier Beträge weicht deshalb im Rundungsrauschen von der Kontrollsumme ab, und der Abgleich meldet eine Abweichung, die es nicht gibt. `Decimal` aus dem Text rechnet exakt in Dezimalstellen. Außerdem lief die Schleife nur über die Tage der Quelle – ein Tag, der nur im Export steht (typisch bei Zeitzonen oder falschem Filter), blieb unsichtbar. Die Vereinigung der Schlüsselmengen prüft beide Richtungen, `sorted` macht das Ergebnis stabil.
    resources:
      - title: Python · decimal
        url: https://docs.python.org/3/library/decimal.html
      - title: Python-Tutorial · Gleitkomma-Arithmetik
        url: https://docs.python.org/3/tutorial/floatingpoint.html

  - id: quality-gate-erklaeren
    type: explain
    title: Wann geht der Bericht raus?
    prompt: |
      Diese Funktion entscheidet im Monatslauf von Bohnenwerk, ob der Bericht verschickt wird. Erkläre einer neuen Kollegin im Controlling, was jede Prüfung bewirkt und warum sie in dieser Form da ist. Nenne auch eine Schwachstelle.
    lang: python
    code: |
      def freigabe(eingelesen, geladen, quarantaene, abweichungen, max_quote=0.01):
          if eingelesen != len(geladen) + len(quarantaene):
              raise RuntimeError("Zeilenbilanz stimmt nicht")
          if abweichungen:
              return False, f"Abgleich: {len(abweichungen)} Tage weichen vom Shop-Backend ab"
          quote = len(quarantaene) / eingelesen
          if quote > max_quote:
              return False, f"{quote:.1%} der Zeilen in Quarantäne"
          return True, f"freigegeben, {len(quarantaene)} Zeilen in Quarantäne"
    points:
      - Die Zeilenbilanz stellt sicher, dass keine Zeile verloren ging. Geht sie nicht auf, ist die Verarbeitung selbst fehlerhaft – deshalb eine Exception statt eines normalen Ergebnisses.
      - Jede Abweichung im Abgleich verhindert die Freigabe, egal wie sauber die Zeilen sind, weil Regeln fehlende Zeilen nicht sehen.
      - Die Quarantänequote trennt Einzelfehler von einem systematischen Problem (neues Exportformat, verrutschte Spalte); über der Schwelle wird nichts verschickt.
      - Unter der Schwelle wird freigegeben, aber die Zahl der Zeilen in Quarantäne steht in der Meldung – sie wird nicht versteckt.
      - "Schwachstelle: Bei einem leeren Export ohne Abweichungen (`eingelesen == 0`) bricht die Division mit `ZeroDivisionError` ab."
    explanation: |
      Die Funktion ist ein Quality Gate mit drei Stufen. Zuerst die Zeilenbilanz: Jede eingelesene Zeile muss entweder geladen oder in Quarantäne sein. Stimmt das nicht, hat das Programm Zeilen verloren oder verdoppelt – ein Fehler im Code, kein Datenproblem, deshalb bricht es mit einer Exception ab. Dann der Abgleich: Weicht die Zahl der Bestellungen oder der Umsatz eines Tages vom Shop-Backend ab, fehlen Daten, die keine Regel sehen kann, und der Bericht bleibt liegen. Zuletzt die Quote: Ein paar fehlerhafte Zeilen sind normal und stehen in der Meldung; landet mehr als 1 % in der Quarantäne, stimmt vermutlich etwas Grundsätzliches nicht. Im Review würde ich anmerken, dass ein leerer Export – etwa an einem Monat ohne Bestellungen und ohne Kontrollwerte – mit `ZeroDivisionError` abstürzt; ein `if eingelesen == 0` vorab macht daraus eine klare Meldung.

  - id: monatspruefung
    type: practice
    title: Die Monatsprüfung für den Shop-Export
    prompt: |
      Baue die Prüfung, die bei Bohnenwerk vor jedem Monatsbericht läuft. Lege dafür drei Dateien an (UTF-8, Semikolon, Dezimalkomma, Datum `TT.MM.JJJJ`):

      ```csv title=kunden.csv
      kunde_id;name;segment
      1;Café Kranich;Café
      2;Büro Lindner;Büro
      3;Jana Pohl;Privat
      4;Tim Okafor;Privat
      ```

      ```csv title=shop_export_2026-03.csv
      bestellung_id;kunde_id;bestelldatum;status;betrag
      10436;3;28.03.2026;storniert;abc
      10430;1;30.03.2026;bezahlt;48,90
      10431;3;30.03.2026;bezahlt;27,50
      10432;2;30.03.2026;bezahlt;312,00
      10433;4;31.03.2026;bezahlt;64,20
      10433;4;31.03.2026;bezahlt;64,20
      10434;;31.03.2026;bezahlt;19,90
      10435;9;31.03.2026;Bezahlt;2.480,00
      10438;2;01.04.2026;bezahlt;55,00
      ```

      ```csv title=kontrolle_2026-03.csv
      tag;bestellungen;umsatz
      28.03.2026;1;36,00
      30.03.2026;3;388,40
      31.03.2026;4;2.648,10
      ```

      Anforderungen:

      1. Ein Regelkatalog mit ID und Schwere: Pflichtfeld Kunde, bekannter Kunde, eindeutige Bestellnummer, Datum im Berichtsmonat, gültiger Status, gültiger Betrag (Fehler) sowie ein Betrag über 2 000 EUR als Warnung.
      2. Zeilen mit Fehlern kommen mit Zeilennummer und allen Gründen nach `quarantaene_2026-03.csv`, die übrigen gelten als geladen. Warnungen werden gezählt, die Zeile bleibt geladen.
      3. Ein Abgleich mit der Kontrolldatei vergleicht Anzahl und Umsatz pro Tag in beide Richtungen.
      4. `bericht_2026-03.txt` nennt eingelesen, geladen und Quarantäne, die Abweichungen, die Befunde pro Regel und die Freigabe.
      5. Freigegeben wird nur ohne Abweichung und mit höchstens 1 % Quarantäne; sonst endet das Skript mit Exit-Code 1.
    lang: python
    solution: |
      """Monatsprüfung des Shop-Exports: Abgleich, Regeln, Quarantäne, Bericht."""
      import csv
      import sys
      from collections import Counter
      from datetime import datetime
      from decimal import Decimal, InvalidOperation
      from pathlib import Path

      STATUS = {"bezahlt", "storniert", "retourniert"}
      MAX_QUOTE = Decimal("0.01")


      def lies(pfad):
          with open(pfad, encoding="utf-8", newline="") as datei:
              return list(csv.DictReader(datei, delimiter=";"))


      def als_datum(text):
          try:
              return datetime.strptime(text.strip(), "%d.%m.%Y").date()
          except ValueError:
              return None


      def als_betrag(text):
          try:
              wert = Decimal(text.strip().replace(".", "").replace(",", "."))
          except InvalidOperation:
              return None
          return wert if wert.is_finite() else None


      def regelkatalog(kunden, ids, monat):
          """(ID, Schwere, Prüfung) – True heißt: in Ordnung."""
          return [
              ("PFLICHT_KUNDE", "Fehler", lambda z: z["kunde_id"].strip() != ""),
              ("KUNDE_BEKANNT", "Fehler", lambda z: z["kunde_id"].strip() in kunden),
              ("BESTELLUNG_EINDEUTIG", "Fehler", lambda z: ids[z["bestellung_id"]] == 1),
              ("DATUM_IM_MONAT", "Fehler", lambda z: als_datum(z["bestelldatum"]).strftime("%Y-%m") == monat),
              ("STATUS_GUELTIG", "Fehler", lambda z: z["status"] in STATUS),
              ("BETRAG_GUELTIG", "Fehler", lambda z: als_betrag(z["betrag"]) >= 0),
              ("BETRAG_PLAUSIBEL", "Warnung", lambda z: (als_betrag(z["betrag"]) or 0) <= 2000),
          ]


      def verstoesse(zeile, regeln):
          gefunden = []
          for regel_id, schwere, pruefung in regeln:
              try:
                  ok = pruefung(zeile)
              except Exception:  # kaputter Wert = Verstoß, kein Absturz
                  ok = False
              if not ok:
                  gefunden.append((regel_id, schwere))
          return gefunden


      def kennzahlen(zeilen):
          """Tag -> (Anzahl, Summe); nicht lesbare Beträge fehlen in der Summe und fallen so auf."""
          ergebnis = {}
          for zeile in zeilen:
              datum = als_datum(zeile["bestelldatum"])
              tag = datum.isoformat() if datum else "unlesbar"
              anzahl, summe = ergebnis.get(tag, (0, Decimal("0")))
              ergebnis[tag] = (anzahl + 1, summe + (als_betrag(zeile["betrag"]) or Decimal("0")))
          return ergebnis


      def abgleich(ist, soll):
          abweichungen = []
          for tag in sorted(ist.keys() | soll.keys()):
              s = soll.get(tag, (0, Decimal("0")))
              i = ist.get(tag, (0, Decimal("0")))
              if s != i:
                  abweichungen.append(f"{tag}: {i[0]} Bestellungen (Quelle {s[0]}), Umsatzdifferenz {s[1] - i[1]} EUR")
          return abweichungen


      def pruefe_monat(export, kontrolle, kunden_datei, monat, ziel=Path(".")):
          zeilen = lies(export)
          kunden = {k["kunde_id"] for k in lies(kunden_datei)}
          soll = {als_datum(k["tag"]).isoformat(): (int(k["bestellungen"]), als_betrag(k["umsatz"]))
                  for k in lies(kontrolle)}
          regeln = regelkatalog(kunden, Counter(z["bestellung_id"] for z in zeilen), monat)

          geladen, quarantaene, warnungen = [], [], Counter()
          for nr, zeile in enumerate(zeilen, start=2):
              gefunden = verstoesse(zeile, regeln)
              fehler = [regel for regel, schwere in gefunden if schwere == "Fehler"]
              warnungen.update(regel for regel, schwere in gefunden if schwere == "Warnung")
              if fehler:
                  quarantaene.append({"zeile": nr, "gruende": ",".join(fehler), **zeile})
              else:
                  geladen.append(zeile)
          assert len(geladen) + len(quarantaene) == len(zeilen), "Zeilenbilanz stimmt nicht"

          abweichungen = abgleich(kennzahlen(zeilen), soll)
          quote = Decimal(len(quarantaene)) / len(zeilen) if zeilen else Decimal("0")
          freigabe = not abweichungen and quote <= MAX_QUOTE

          felder = ["zeile", "gruende", *(zeilen[0].keys() if zeilen else [])]
          with open(ziel / f"quarantaene_{monat}.csv", "w", encoding="utf-8", newline="") as datei:
              schreiber = csv.DictWriter(datei, fieldnames=felder, delimiter=";")
              schreiber.writeheader()
              schreiber.writerows(quarantaene)

          befunde = Counter(g for q in quarantaene for g in q["gruende"].split(","))
          bericht = [
              f"Qualitätsbericht Bestellungen {monat} – Quelle {Path(export).name}",
              f"Zeilen: {len(zeilen)} eingelesen, {len(geladen)} geladen, {len(quarantaene)} in Quarantäne",
              "Abgleich Shop-Backend: " + ("übereinstimmend" if not abweichungen else f"{len(abweichungen)} Abweichungen"),
              *[f"  {a}" for a in abweichungen],
              "Befunde (Fehler):",
              *[f"  {regel}: {anzahl}" for regel, anzahl in sorted(befunde.items())],
              "Warnungen:",
              *[f"  {regel}: {anzahl}" for regel, anzahl in sorted(warnungen.items())],
              "Freigabe: " + ("ja" if freigabe else "nein"),
          ]
          (ziel / f"bericht_{monat}.txt").write_text("\n".join(bericht) + "\n", encoding="utf-8")
          return freigabe


      if __name__ == "__main__":
          ok = pruefe_monat("shop_export_2026-03.csv", "kontrolle_2026-03.csv", "kunden.csv", "2026-03")
          sys.exit(0 if ok else 1)
    checklist:
      - Der Berichtsmonat ist ein Parameter; nichts im Skript ruft `date.today()` auf.
      - Die Zeile mit `abc` als Betrag landet in der Quarantäne, statt das Skript mit einer Exception zu beenden.
      - "Beide Zeilen 10433 stehen mit `BESTELLUNG_EINDEUTIG` in der Quarantäne, 10434 mit `PFLICHT_KUNDE` **und** `KUNDE_BEKANNT` – alle Gründe, nicht nur der erste."
      - "Der Bericht zeigt 9 eingelesen, 3 geladen, 6 in Quarantäne – die Summe geht auf."
      - "Der Abgleich meldet drei Tage: 28.03. (Betrag nicht lesbar), 31.03. (gleiche Anzahl, aber 19,80 EUR Differenz) und 01.04. (nur im Export)."
      - "`BETRAG_PLAUSIBEL` meldet 10435 als Warnung, und die Freigabe lautet „nein“ mit Exit-Code 1."
      - Beträge werden mit `Decimal` summiert, nicht mit `float`.
    explanation: |
      Die Musterlösung trennt vier Aufgaben: Einlesen und Umwandeln (`als_datum`, `als_betrag` liefern bei Unsinn `None`), Prüfen gegen einen Katalog mit Schwere, Abgleich der Tageswerte in beide Richtungen und Berichten. Der Abgleich läuft über **alle** eingelesenen Zeilen, weil er die Übertragung prüft, nicht die Qualität einzelner Zeilen. Lehrreich ist der 31. März: Die Anzahl stimmt, weil das Duplikat 10433 die fehlende Bestellung 10437 zahlenmäßig ersetzt – erst die Summe zeigt die Lücke. Deshalb vergleicht ein Abgleich immer Anzahl und Summe. Die Warnung für 10435 ändert nichts an der Freigabe; die Zeile ist wegen des unbekannten Kunden und des Status `Bezahlt` ohnehin in der Quarantäne.
