id: power-query
title: "Power Query: Importe wiederholbar machen"
level: 2
minutes: 170
summary: Aus der monatlichen Copy-&-Paste-Routine wird eine Abfrage – Power Query liest Exporte mit dem richtigen Gebietsschema, formt sie in nachvollziehbaren Schritten um und nimmt mit „Alle aktualisieren“ jeden neuen Monat auf.
goals:
  - Du liest die angewendeten Schritte einer Abfrage als M-Code und erklärst, was `let … in`, `#"…"` und `each` bedeuten.
  - Du importierst deutsche CSV-Exporte mit Dateiursprung, Trennzeichen und Datentypen mit Gebietsschema, sodass Beträge und Datumswerte auf jedem Rechner gleich gelesen werden.
  - Du bringst Rohdaten mit Zeilen entfernen, Kopfzeilen höherstufen, Spalten teilen und Entpivotieren in eine auswertbare lange Tabelle.
  - Du unterscheidest Zusammenführen (Join) von Anfügen, wählst die passende Join-Art und erkennst vervielfachte Zeilen.
  - Du baust einen Ordner-Import, der jede neue Monatsdatei beim Aktualisieren aufnimmt, und machst Fehlerzeilen sichtbar, statt sie still zu verwerfen.
  - Du schätzt Query Folding und die Grenzen von Power Query ein und weißt, wann ein anderes Werkzeug besser passt.
