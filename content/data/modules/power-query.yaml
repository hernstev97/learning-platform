lesson: |
  Am ersten Arbeitstag jedes Monats lädt Merle aus dem Controlling von Bohnenwerk zwei Exporte herunter: die Bestellungen aus dem Webshop und die B2B-Bestellungen aus der Warenwirtschaft. Dann beginnt die Routine. Datei öffnen, die zwei Vorspannzeilen und die Summenzeile löschen, Versandkosten reparieren, die Excel mal als Zahl und mal als Text erkannt hat, die Zeilen unten an die Jahresliste kopieren, per `SVERWEIS` (englisch `VLOOKUP`) die Region des Kunden holen, PivotTable aktualisieren. Das dauert drei Stunden, und jeder Handgriff kann schiefgehen: Ein Monat wird doppelt eingefügt, eine Summenzeile rutscht in die Daten, ein Datum bleibt Text.

  Power Query macht aus dieser Handarbeit ein Rezept. Du zeigst Excel einmal, woher die Daten kommen und wie sie umgeformt werden, und jeder Klick wird als Schritt gespeichert. Im nächsten Monat legst du die neue Datei in den Exportordner und klickst auf **Daten › Alle aktualisieren**. Bei Bohnenwerk schrumpft der Import so von drei Stunden auf fünf Minuten – und diese fünf Minuten sind Prüfen statt Kopieren.

  ## Das Denkmodell: ein Rezept aus angewendeten Schritten

  Power Query ist das ETL-Werkzeug in Excel. ETL steht für *Extract, Transform, Load*: Daten aus einer Quelle holen, umformen und in eine Tabelle laden. Du startest über **Daten › Daten abrufen**, **Daten › Aus Text/CSV** oder **Daten › Aus Tabelle/Bereich**. Danach öffnet sich der Power Query-Editor. Rechts im Bereich **Angewendete Schritte** steht jede Aktion als eigener Schritt. Hinter der Liste steckt Code in der Sprache M, den **Start › Erweiterter Editor** zeigt. Für einen Shop-Export erzeugt der Editor etwa diesen Code:

  ```powerquery
  let
      Quelle = Csv.Document(File.Contents("C:\Bohnenwerk\Export\bestellungen_2026-03.csv"), [Delimiter = ";", Columns = 6, Encoding = 1252]),
      #"Höher gestufte Header" = Table.PromoteHeaders(Quelle, [PromoteAllScalars = true]),
      #"Geänderter Typ" = Table.TransformColumnTypes(#"Höher gestufte Header", {{"bestellung_id", Int64.Type}, {"kunde_id", Int64.Type}, {"bestelldatum", type date}, {"kanal", type text}, {"status", type text}, {"versandkosten", type number}})
  in
      #"Geänderter Typ"
  ```

  Drei Dinge musst du an diesem Code verstehen:

  1. **`let` ist eine Liste benannter Schritte.** Jeder Schritt ist ein Ausdruck, der meist den vorigen Schritt als Eingabe nimmt. Namen mit Leerzeichen oder Sonderzeichen stehen als `#"…"` in Anführungszeichen. Der deutsche Editor erzeugt Namen wie `#"Höher gestufte Header"` und `#"Geänderter Typ"`; selbst geschriebene Schritte darfst du sprechend benennen.
  2. **Hinter `in` steht das Ergebnis.** M wertet einen Schritt nur aus, wenn er gebraucht wird ([Let-Ausdruck](https://learn.microsoft.com/de-de/powerquery-m/m-spec-let)). Ein Schritt, auf den nichts verweist, hat keine Wirkung – auch dann nicht, wenn er im Code steht.
  3. **Die Quelle wird nur gelesen.** Power Query verändert die CSV-Datei nie. Die Rohdaten bleiben unverändert, und jede Umformung ist im Code dokumentiert.

  M ist eine funktionale Sprache und unterscheidet Groß- und Kleinschreibung. `Table.selectrows` gibt es nicht, und die Spalte `Menge` ist eine andere als `menge`. Oft taucht das Schlüsselwort `each` auf: `each [menge] > 0` ist die Kurzform für eine Funktion mit einem Parameter `_`, also `(_) => _[menge] > 0` ([Funktionen in M](https://learn.microsoft.com/de-de/powerquery-m/m-spec-functions)). So bekommt `Table.SelectRows` eine Bedingung, die es für jede Zeile prüft.

  Zum Schluss legt **Start › Schließen & laden** fest, wohin das Ergebnis geht: als Tabelle in ein Arbeitsblatt, ins Datenmodell oder mit „Nur Verbindung erstellen“ als Zwischenstufe für andere Abfragen. Power Query gibt es in Excel für Windows, für Mac und im Web; den größten Funktionsumfang hat Excel für Windows.

  > [!MERKE]
  > Eine Abfrage ist ein Rezept, kein Ergebnis. Die geladene Tabelle ist nur der zuletzt gekochte Stand. Wer dort von Hand korrigiert, verliert die Korrektur beim nächsten Aktualisieren – Korrekturen gehören als Schritt in die Abfrage.

  ## Datentypen mit Gebietsschema: warum 1.234,50 kippen kann

  Eine CSV-Datei enthält nur Text. Erst ein Typ-Schritt macht aus `"4,90"` die Zahl 4,9 und aus `"14.03.2026"` ein Datum. Dafür muss Power Query wissen, wie Zahlen und Datumswerte geschrieben sind: Ist der Punkt Tausendertrennzeichen oder Dezimalzeichen? Steht der Tag vorn oder der Monat? Diese Regeln heißen **Gebietsschema** (englisch *Locale*, in M *Culture*).

  Welches Gebietsschema gilt, folgt einer festen Reihenfolge ([Festlegen eines Gebietsschemas](https://support.microsoft.com/de-de/excel/set-a-locale-or-region-for-data-power-query)): zuerst das Gebietsschema, das ein Typ-Schritt ausdrücklich nennt, dann die Einstellung der Arbeitsmappe unter **Daten › Daten abrufen › Abfrageoptionen › Aktuelle Arbeitsmappe › Regionale Einstellungen**, zuletzt die Region des Betriebssystems. Die Einstellung der Arbeitsmappe wird mit der Datei gespeichert. Sie hilft aber nur, solange alle Quellen gleich formatiert sind. Liefert die Warenwirtschaft `1,234.50` und der Shop `1.234,50`, braucht jede Quelle ihr eigenes Gebietsschema – und das gehört sichtbar in den Code.

  Rechtsklick auf die Spaltenüberschrift › **Typ ändern › Mit Gebietsschema …** öffnet den Dialog „Typ mit Gebietsschema ändern“. Der Editor erzeugt dann einen Schritt, der das Gebietsschema als drittes Argument an `Table.TransformColumnTypes` übergibt:

  ```powerquery
  #"Geänderter Typ mit Gebietsschema" = Table.TransformColumnTypes(
      #"Höher gestufte Header",
      {{"bestellung_id", Int64.Type}, {"bestelldatum", type date}, {"plz", type text}, {"versandkosten", type number}},
      "de-DE"
  )
  ```

  Mit `"de-DE"` gilt `1.234,50` als 1234,5 und `03.04.2026` als 3. April – auf jedem Rechner. Mit einem amerikanischen Gebietsschema wird `14.03.2026` zum Fehler, denn einen 14. Monat gibt es nicht. `03.04.2026` dagegen kann still zum 4. März werden. Der stille Fall ist der gefährliche: Die Abfrage läuft ohne Fehler, nur die Monatswerte stimmen nicht mehr.

  Die Typen im Editor und in M gehören so zusammen: **Text** ist `type text`, **Ganze Zahl** ist `Int64.Type`, **Dezimalzahl** ist `type number`, **Feste Dezimalzahl** (Währung) ist `Currency.Type`, **Datum** ist `type date`.

  Zwei weitere Einstellungen entscheiden beim Import über richtig oder falsch:

  - **Dateiursprung (Encoding).** Power Query leitet den Zeichensatz einer CSV nicht selbst ab; UTF-8 erkennt es nur, wenn die Datei mit einem BOM beginnt ([Text/CSV-Connector](https://learn.microsoft.com/de-de/power-query/connectors/text-csv)). Sonst gilt die Codepage des Systems, auf einem deutschen Windows meist 1252, und aus `Köln` wird `KÃ¶ln`. In M ist das `Encoding` in `Csv.Document`: `65001` für UTF-8, `1252` für Windows-1252. Die Hintergründe stehen in [CSV-Import und Datenbereinigung](/data/csv-import).
  - **Automatische Typerkennung.** Power Query prüft die ersten 200 Zeilen und fügt „Höher gestufte Header“ und „Geänderter Typ“ selbst ein. Für Postleitzahlen und Artikelnummern ist das schädlich: `01067` wird zur Zahl 1067. Ersetze den automatischen Schritt durch einen eigenen mit Gebietsschema und setze IDs, Postleitzahlen und Artikelnummern als Text.

  > [!WARNING] Typ-Schritte ohne Gebietsschema
  > Ein `#"Geänderter Typ"` ohne drittes Argument hängt von einer Einstellung ab, die niemand im Code sieht. Gib bei jeder CSV-Quelle das Gebietsschema der Quelle an – `"de-DE"` für den Shop-Export, `"en-US"` für einen englischen ERP-Export.

  ## Rohdaten in Form bringen: Vorspann, Summenzeile, Schreibweisen, Monatsspalten

  Der Shop-Export von Bohnenwerk sieht aus wie viele Exporte: zwei Zeilen Vorspann, eine Summenzeile am Ende.

  ```csv
  Bestellexport Webshop;;;;;
  Zeitraum: 01.03.2026 - 31.03.2026;;;;;
  bestellung_id;kunde_id;bestelldatum;kanal;status;versandkosten
  10231;17;02.03.2026;Shop;bezahlt;4,90
  10232;23;02.03.2026;Shop;storniert;4,90
  10233;8;03.03.2026;Shop;bezahlt;0,00
  Summe;;;;;9,80
  ```

  Die Abfrage entfernt den Vorspann mit **Start › Zeilen entfernen › Oberste Zeilen entfernen**, stuft die Kopfzeile höher, filtert die Summenzeile heraus und setzt erst dann die Typen:

  ```powerquery
  let
      Quelle = Csv.Document(File.Contents("C:\Bohnenwerk\Export\bestellungen_2026-03.csv"), [Delimiter = ";", Encoding = 65001]),
      #"Entfernte oberste Zeilen" = Table.Skip(Quelle, 2),
      #"Höher gestufte Header" = Table.PromoteHeaders(#"Entfernte oberste Zeilen", [PromoteAllScalars = true]),
      #"Gefilterte Zeilen" = Table.SelectRows(#"Höher gestufte Header", each [bestellung_id] <> "Summe" and [bestellung_id] <> ""),
      #"Geänderter Typ mit Gebietsschema" = Table.TransformColumnTypes(#"Gefilterte Zeilen", {{"bestellung_id", Int64.Type}, {"kunde_id", Int64.Type}, {"bestelldatum", type date}, {"kanal", type text}, {"status", type text}, {"versandkosten", type number}}, "de-DE")
  in
      #"Geänderter Typ mit Gebietsschema"
  ```

  Zwei Entscheidungen stecken darin. Erstens fehlt `Columns = 6`, das der Editor gern einträgt. Mit fester Spaltenzahl ignoriert [`Csv.Document`](https://learn.microsoft.com/de-de/powerquery-m/csv-document) jede zusätzliche Spalte eines späteren Exports still. Zweitens entfernt eine **Bedingung** die Summenzeile, nicht ihre Position. `Table.RemoveLastN(…, 1)` löscht die letzte Zeile auch in einem Monat, in dem der Export keine Summenzeile hat – dann fehlt eine echte Bestellung. Die Bedingung beschreibt, was weg soll, und bleibt richtig, wenn sich der Export ändert. Filtere, solange die Spalte noch Text ist: `"Summe"` würde als Ganzzahl einen Fehler erzeugen.

  Uneinheitliche Schreibweisen in Stammdaten („köln“, „Köln “) räumt `Table.TransformColumns` in einem Schritt auf. `Text.Proper` reicht für einfache Ortsnamen; aus „frankfurt am main“ würde „Frankfurt Am Main“. Für solche Fälle ist eine Zuordnungstabelle sicherer, wie im Modul [CSV-Import und Datenbereinigung](/data/csv-import). Aufteilen geht über **Start › Spalte teilen › Nach Trennzeichen**, zum Beispiel für einen Artikeltext wie `ESP-1000 | Hausmischung Espresso 1 kg`:

  ```powerquery
  #"Stadt vereinheitlicht" = Table.TransformColumns(Kunden, {{"stadt", each Text.Proper(Text.Trim(_)), type text}}),
  #"Spalte nach Trennzeichen teilen" = Table.SplitColumn(Artikel, "artikel", Splitter.SplitTextByDelimiter(" | ", QuoteStyle.Csv), {"artikelnr", "artikelname"})
  ```

  Der Absatzplan liegt dagegen **breit** vor: eine Zeile je Produkt, eine Spalte je Monat. Für PivotTables, `SUMMEWENNS` und Joins brauchst du ihn **lang**: eine Zeile je Produkt und Monat (siehe [Saubere Tabellen und Datenmodelle](/data/tabellenmodelle)). Markiere `produkt_id` und `produkt` und wähle **Transformieren › Spalten entpivotieren › Andere Spalten entpivotieren**:

  ```powerquery
  #"Entpivotierte andere Spalten" = Table.UnpivotOtherColumns(#"Geänderter Typ", {"produkt_id", "produkt"}, "Attribut", "Wert"),
  #"Umbenannte Spalten" = Table.RenameColumns(#"Entpivotierte andere Spalten", {{"Attribut", "monat"}, {"Wert", "menge"}})
  ```

  „Andere Spalten entpivotieren“ nennt die Spalten, die **bleiben**. Kommt im April eine Spalte `Apr` dazu, wird sie beim Aktualisieren automatisch mit entpivotiert. `Table.Unpivot` mit einer festen Liste `{"Jan", "Feb", "Mrz"}` würde den April stehen lassen. Leere Zellen (`null`) erzeugen beim Entpivotieren keine Zeile – für Mengen meist gewünscht, für „Wie viele Monate hat das Produkt geplant?“ ein Stolperstein.

  ## Zusammenführen und Anfügen: Join oder Stapel

  Zwei Befehle unter **Start › Kombinieren** klingen ähnlich und tun Gegensätzliches.

  **Anfügen** (**Abfragen anfügen**, in M `Table.Combine`) stapelt Zeilen gleichartiger Tabellen: Shop-Export und B2B-Export, Januar und Februar. Power Query ordnet die Spalten dabei nach ihrem **Namen**, nicht nach ihrer Position ([Abfragen anfügen](https://learn.microsoft.com/de-de/power-query/append-queries)). Eine Spalte, die nur in einer Tabelle vorkommt, wird in den anderen mit `null` aufgefüllt. Weil M Groß- und Kleinschreibung unterscheidet, landen `Menge` und `menge` in zwei Spalten. SQL arbeitet anders: `UNION ALL` ordnet nach **Position**, die Namen kommen aus der ersten Abfrage.

  **Zusammenführen** (**Abfragen zusammenführen**, in M `Table.NestedJoin`) ist ein Join: Es ergänzt Spalten aus einer zweiten Tabelle über einen Schlüssel – wie `XVERWEIS` (englisch `XLOOKUP`), nur für alle Zeilen auf einmal und mit sichtbarer Join-Art. `Table.NestedJoin` legt zuerst eine Spalte an, die je Zeile die passenden Zeilen der rechten Tabelle als kleine Tabelle enthält; erst `Table.ExpandTableColumn` holt die gewünschten Spalten heraus:

  ```powerquery
  #"Zusammengeführte Abfragen" = Table.NestedJoin(Positionen, {"produkt_id"}, Produkte, {"produkt_id"}, "Produkte", JoinKind.LeftOuter),
  #"Erweiterte Produkte" = Table.ExpandTableColumn(#"Zusammengeführte Abfragen", "Produkte", {"kategorie", "listenpreis"}, {"kategorie", "listenpreis"})
  ```

  Die Join-Art wählst du im Dialog „Zusammenführen“ ([Übersicht über Zusammenführungsabfragen](https://learn.microsoft.com/de-de/power-query/merge-queries-overview)):

  | Join-Art | M | Ergebnis |
  | --- | --- | --- |
  | Linker äußerer (Standard) | `JoinKind.LeftOuter` | alle Zeilen links, passende Werte rechts, sonst `null` |
  | Rechter äußerer | `JoinKind.RightOuter` | alle Zeilen rechts, passende Werte links |
  | Vollständiger äußerer | `JoinKind.FullOuter` | alle Zeilen beider Seiten |
  | Innerer | `JoinKind.Inner` | nur Zeilen mit Treffer auf beiden Seiten |
  | Linker Anti | `JoinKind.LeftAnti` | nur Zeilen links **ohne** Treffer |
  | Rechter Anti | `JoinKind.RightAnti` | nur Zeilen rechts **ohne** Treffer |

  Zwei Fallen kosten regelmäßig Stunden. Die Schlüsselspalten brauchen denselben Datentyp: Eine `produkt_id` als Text `"17"` findet die Zahl 17 nicht. Und ist der Schlüssel rechts nicht eindeutig, vervielfacht das Erweitern die Zeilen. Steht Kunde 8 zweimal in den Stammdaten, erscheint jede seiner Bestellungen doppelt, und jede Summe ist zu hoch.

  Der **linke Anti-Join** ist ein Prüfwerkzeug: Eine Abfrage „Unbekannte Produkte“ mit `JoinKind.LeftAnti` listet Positionen, zu denen es keine Stammdaten gibt. Sie muss leer sein. In SQL stellst du dieselbe Frage mit `LEFT JOIN` und `IS NULL` (mehr dazu in [Joins und Datenmodelle abfragen](/data/sql-joins)):

  ```sql run
  CREATE TABLE produkte (produkt_id INTEGER PRIMARY KEY, name TEXT, kategorie TEXT);
  CREATE TABLE positionen (bestellung_id INTEGER, position INTEGER, produkt_id INTEGER, menge INTEGER);
  INSERT INTO produkte VALUES (1, 'Hausmischung Espresso 1 kg', 'Espresso'), (2, 'Äthiopien Sidamo 500 g', 'Filter'), (3, 'Handmühle Classic', 'Zubehör');
  INSERT INTO positionen VALUES (10231, 1, 1, 2), (10231, 2, 3, 1), (10232, 1, 2, 5), (10233, 1, 9, 1);

  -- Linker äußerer Join: alle Positionen, Kategorie falls vorhanden
  SELECT po.bestellung_id, po.produkt_id, pr.kategorie
  FROM positionen AS po
  LEFT JOIN produkte AS pr ON pr.produkt_id = po.produkt_id;

  -- Linker Anti-Join: Positionen ohne Stammdaten
  SELECT po.bestellung_id, po.produkt_id
  FROM positionen AS po
  LEFT JOIN produkte AS pr ON pr.produkt_id = po.produkt_id
  WHERE pr.produkt_id IS NULL;
  ```

  > [!INTERVIEW] „Was ist der Unterschied zwischen Zusammenführen und Anfügen?“
  > Anfügen stapelt Zeilen gleich aufgebauter Tabellen, etwa zwölf Monatsexporte, und ordnet die Spalten über ihren Namen zu. Zusammenführen ist ein Join: Es ergänzt Spalten aus einer zweiten Tabelle über einen Schlüssel, etwa die Kategorie aus den Produktstammdaten. Beim Zusammenführen prüfe ich, ob der Schlüssel rechts eindeutig ist und beide Schlüsselspalten denselben Typ haben, sonst vervielfachen sich Zeilen oder Treffer fehlen. Mit einem linken Anti-Join finde ich Datensätze ohne Stammdaten.

  ## Alle Monatsdateien aus einem Ordner

  Am meisten spart der Ordner-Import. **Daten › Daten abrufen › Aus Datei › Aus Ordner** ruft `Folder.Files` auf. Das Ergebnis hat eine Zeile je Datei im Ordner **und in allen Unterordnern**, mit Spalten wie `Content` (der Dateiinhalt), `Name`, `Extension` und `Folder Path`. Die Schaltfläche **Kombinieren** legt unter „Hilfsabfragen“ eine Beispielabfrage und eine Funktion an. Jeder Schritt, den du in der Beispielabfrage einträgst, gilt danach für jede Datei ([Übersicht über das Kombinieren von Dateien](https://learn.microsoft.com/de-de/power-query/combine-files-overview)).

  Von Hand geschrieben ist dieselbe Logik kürzer und leichter zu lesen:

  ```powerquery
  let
      Quelle = Folder.Files(Exportordner),
      #"Nur Bestellexporte" = Table.SelectRows(Quelle, each Text.Lower([Extension]) = ".csv"
          and Text.StartsWith([Name], "bestellungen_")
          and [Attributes]?[Hidden]? <> true),
      #"Tabelle je Datei" = Table.AddColumn(#"Nur Bestellexporte", "Daten", each Table.PromoteHeaders(
          Table.Skip(Csv.Document([Content], [Delimiter = ";", Encoding = 65001]), 2),
          [PromoteAllScalars = true])),
      #"Andere entfernte Spalten" = Table.SelectColumns(#"Tabelle je Datei", {"Name", "Daten"}),
      #"Erweiterte Daten" = Table.ExpandTableColumn(#"Andere entfernte Spalten", "Daten",
          {"bestellung_id", "kunde_id", "bestelldatum", "kanal", "status", "versandkosten"}),
      #"Gefilterte Zeilen" = Table.SelectRows(#"Erweiterte Daten", each [bestellung_id] <> "Summe"),
      #"Geänderter Typ mit Gebietsschema" = Table.TransformColumnTypes(#"Gefilterte Zeilen",
          {{"bestellung_id", Int64.Type}, {"kunde_id", Int64.Type}, {"bestelldatum", type date}, {"versandkosten", type number}},
          "de-DE")
  in
      #"Geänderter Typ mit Gebietsschema"
  ```

  Die Abfrage kennt keine Monatsnamen. Sie nimmt jede Datei, die der Filter durchlässt, liest sie mit denselben Regeln und hängt sie an. Die Spalte `Name` bleibt erhalten, damit jede Zeile ihre Herkunftsdatei trägt. Wer lieber `Table.Combine(#"Tabelle je Datei"[Daten])` schreibt, bekommt dasselbe Ergebnis ohne diese Herkunft.

  Damit ist der Ordner der Zustand des Imports. Ein doppelter Download `bestellungen_2026-03 (1).csv` passiert den Filter und verdoppelt den März. Ein Unterordner `archiv` wird mitgelesen, weil `Folder.Files` Unterordner einschließt. Lege deshalb neben der Hauptabfrage eine kleine Prüfabfrage an, die die Zeilen je `Name` zählt und doppelte `bestellung_id` sucht. Archive gehören in einen Ordner außerhalb des Exportordners.

  `Exportordner` ist ein **Parameter**, angelegt über **Start › Parameter verwalten › Neuer Parameter**. Zieht der Ordner auf ein anderes Laufwerk, änderst du eine einzige Stelle. Im Code ist ein Parameter eine eigene Abfrage mit Metadaten:

  ```powerquery
  "C:\Bohnenwerk\Export" meta [IsParameterQuery = true, Type = "Text", IsParameterQueryRequired = true]
  ```

  > [!TIP] Parameter aus einer Zelle
  > Sollen Kolleginnen den Pfad ohne Power Query-Editor ändern, lies ihn aus einer benannten Zelle: `Excel.CurrentWorkbook(){[Name = "Exportordner"]}[Content]{0}[Column1]`. `Excel.CurrentWorkbook` liefert Tabellen und benannte Bereiche der eigenen Arbeitsmappe.

  ### Fehler sichtbar machen statt still verwerfen

  Power Query kennt zwei Arten von Fehlern ([Umgang mit Fehlern](https://learn.microsoft.com/de-de/power-query/dealing-with-errors)). Ein **Fehler auf Schrittebene** stoppt die ganze Abfrage, etwa wenn der Export eine Spalte umbenannt hat: „Die Spalte … der Tabelle wurde nicht gefunden.“ Das ist lästig, aber ehrlich – nichts wird geladen, was falsch sein könnte. Gefährlicher sind **Fehler auf Zellenebene**. Steht im Februar-Export `n/a` statt einer Zahl, wird nur diese Zelle zum Fehler. Die Abfrage lädt trotzdem, die Zelle bleibt im Blatt leer, und im Bereich **Abfragen & Verbindungen** steht nur die Anzahl der Fehler.

  Der naheliegende Klick **Start › Zeilen entfernen › Fehler entfernen** (`Table.RemoveRowsWithErrors`) lässt solche Zeilen verschwinden. Damit fehlt Umsatz, ohne dass es jemand merkt. Besser ist eine **Quarantäne**: Eine Rohabfrage mit „Nur Verbindung erstellen“, eine Abfrage `Bestellungen` ohne Fehlerzeilen und eine Abfrage `Fehlerzeilen`, die genau diese Zeilen auf ein Prüfblatt lädt. Solange `Fehlerzeilen` leer ist, ist alles gut; Bestellungen plus Fehlerzeilen ergeben immer die Zeilen der Rohabfrage. Mehr zu solchen Prüfregeln steht in [Datenqualität messen und sichern](/data/datenqualitaet).

  ```powerquery
  // Abfrage „Fehlerzeilen“: lädt auf das Blatt „Prüfung“ und sollte leer sein
  let
      Quelle = Bestellungen_roh,
      Fehlerzeilen = Table.SelectRowsWithErrors(Quelle, {"bestelldatum", "versandkosten"})
  in
      Fehlerzeilen
  ```

  Für bekannte Sonderfälle gibt es `try … otherwise` – das Gegenstück zu `WENNFEHLER` (englisch `IFERROR`) in Excel-Formeln. Setze es gezielt ein, nicht als Decke über alles:

  ```powerquery
  #"Versandkosten als Zahl" = Table.AddColumn(#"Gefilterte Zeilen", "versandkosten_eur",
      each if [versandkosten] = "n/a" then null else try Number.FromText([versandkosten], "de-DE") otherwise error "Unbekanntes Format: " & [versandkosten],
      type nullable number)
  ```

  Der Schritt macht aus dem bekannten Platzhalter `n/a` bewusst `null` und lässt jede unbekannte Schreibweise als Fehler stehen – sie landet in der Quarantäne statt im Durchschnitt.

  ## Aktualisieren, Query Folding und Grenzen

  **Daten › Alle aktualisieren** (Strg+Alt+F5) aktualisiert alle Abfragen und PivotTables der Arbeitsmappe. In den Eigenschaften einer Abfrage (**Daten › Abfragen & Verbindungen**, Rechtsklick › **Eigenschaften**) kannst du zusätzlich „Daten beim Öffnen der Datei aktualisieren“ oder ein Intervall in Minuten einstellen ([Aktualisieren einer externen Datenverbindung](https://support.microsoft.com/de-de/office/aktualisieren-einer-externen-datenverbindung-in-excel-1524175f-777a-48fc-8fc7-c8514b984440)). Beides setzt voraus, dass Excel geöffnet ist.

  Liest Power Query aus einer Datenbank, versucht es, Schritte wie Filtern, Spalten entfernen und Gruppieren in eine Abfrage der Datenbank zu übersetzen. Die Datenbank rechnet dann, und nur das Ergebnis wird übertragen. Das heißt **Query Folding** (Abfragefaltung, [Übersicht](https://learn.microsoft.com/de-de/power-query/query-folding-basics)). Rechtsklick auf einen Schritt › **Native Abfrage anzeigen** zeigt die erzeugte Abfrage, wenn der Connector das unterstützt. CSV- und Excel-Dateien haben kein Abfragemodul und falten nie: Jeder Schritt läuft in Power Query auf deinem Rechner. Bei Datenbanken filterst du deshalb früh und entfernst unnötige Spalten früh, damit möglichst viel an der Quelle passiert.

  Die Grenzen sind praktischer Natur:

  - Ein Arbeitsblatt fasst 1.048.576 Zeilen ([Spezifikationen und Beschränkungen in Excel](https://support.microsoft.com/de-de/office/spezifikationen-und-beschr%C3%A4nkungen-in-excel-1672b34d-7043-467e-8e27-269d656771c3)). Größere Daten lädst du ins Datenmodell oder aggregierst vorher.
  - Aktualisieren braucht Excel und Zugriff auf die Quelle. Ein Pfad wie `C:\Bohnenwerk\Export` existiert auf dem Rechner der Kollegin vielleicht nicht; ein Netzlaufwerk oder SharePoint-Ordner ist dann die bessere Quelle.
  - Abfragen lassen sich schlecht testen und versionieren, und lange M-Ausdrücke werden schwer lesbar.

  Soll eine Auswertung ohne Menschen laufen, getestet und versioniert werden, sind SQL oder Python die besseren Werkzeuge. Die Entscheidungshilfe dazu steht in [Kleine Automationen für Analysen](/data/automationen).

  > [!PRAXIS]
  > Bei Bohnenwerk liegt die Arbeitsmappe „Monatsbericht“ neben dem Ordner `Export`. Sie enthält die Abfragen `Bestellungen_roh`, `Bestellungen`, `Fehlerzeilen` und `Unbekannte Kunden` (linker Anti-Join), dazu ein Prüfblatt mit Zeilen und Versandkosten je Datei. Merle vergleicht diese Summen mit der Monatssumme, die der Shop selbst anzeigt. Stimmen sie und sind beide Prüfabfragen leer, geht der Bericht raus. Die Schritte der Abfragen sind zugleich die Dokumentation des Imports – wer nachvollziehen will, wie eine Zahl entsteht, liest den Erweiterten Editor statt eine Anleitung.

  ## Häufige Fehler

  - **Typ ohne Gebietsschema.** Symptom: Auf einem anderen Rechner oder bei einer anderen Quelle erscheinen Fehler in Datumsspalten oder um den Faktor 1000 falsche Beträge. Lösung: Typ-Schritt mit `"de-DE"` oder dem Gebietsschema der Quelle.
  - **Automatische Typerkennung für IDs.** Führende Nullen bei Postleitzahlen und Artikelnummern verschwinden. Lösung: automatischen Schritt ersetzen, IDs als Text.
  - **Summenzeile per Position entfernt.** Fehlt sie einmal, fehlt eine echte Zeile. Lösung: Bedingung statt `Table.RemoveLastN`.
  - **`Columns = 6` im Quellschritt.** Eine neue Spalte im Export wird still abgeschnitten. Lösung: Spaltenzahl weglassen und neue Spalten bewusst behandeln.
  - **Entpivotieren mit fester Spaltenliste.** Ein neuer Monat bleibt als Spalte stehen. Lösung: „Andere Spalten entpivotieren“.
  - **Zusammenführen mit doppeltem Schlüssel.** Zeilenzahl steigt nach dem Erweitern, Summen sind zu hoch. Lösung: Stammdaten vorher auf eindeutige Schlüssel prüfen.
  - **Doppelte oder archivierte Dateien im Exportordner.** Ein Monat zählt doppelt. Lösung: strenger Namensfilter, Archiv außerhalb des Ordners, Prüfabfrage je Datei.
  - **„Fehler entfernen“ als Standard.** Zeilen verschwinden still. Lösung: Quarantäne-Abfrage mit `Table.SelectRowsWithErrors`.
  - **`in` zeigt auf einen alten Schritt.** Nach einer Änderung im Erweiterten Editor hat ein neuer Schritt keine Wirkung. Lösung: Hinter `in` steht immer der letzte Schritt.

  ## Zusammenfassung

  - Power Query speichert einen Import als Folge von Schritten in M. `let` benennt die Schritte, `in` bestimmt das Ergebnis, die Quelle bleibt unverändert.
  - Datentypen hängen vom Gebietsschema ab. Der Typ-Schritt mit Gebietsschema hat Vorrang vor Arbeitsmappe und Betriebssystem und gehört zu jeder CSV-Quelle; `Encoding` in `Csv.Document` legt den Zeichensatz fest.
  - Bedingungen statt Positionen: Summenzeilen und Sonderzeilen per Filter entfernen, Monatsspalten mit „Andere Spalten entpivotieren“ in lange Form bringen.
  - Anfügen stapelt Zeilen und ordnet Spalten nach Namen, Zusammenführen ist ein Join über einen Schlüssel. Doppelte Schlüssel vervielfachen Zeilen; der linke Anti-Join findet fehlende Stammdaten.
  - Der Ordner-Import nimmt jede passende Datei auf. Damit ist der Ordner der Zustand: Namensfilter und eine Prüfabfrage je Datei schützen vor Doppelzählung.
  - Fehlerzeilen gehören in eine Quarantäne-Abfrage, nicht in „Fehler entfernen“. `try … otherwise` nur für bekannte Sonderfälle.
  - Dateiquellen falten nicht, Datenbanken schon. Für unbeaufsichtigte, getestete Abläufe sind SQL oder Python die besseren Werkzeuge.
exercises:
  - id: gebietsschema-vorrang
    type: choice
    title: Wessen Gebietsschema gilt?
    prompt: |
      Du hast den Bestellimport auf deinem Rechner mit Windows-Region Deutsch gebaut. Die Steuerberatung öffnet die Arbeitsmappe auf einem Rechner mit Windows-Region Englisch (USA) und klickt auf **Alle aktualisieren**. Der Typ-Schritt lautet wie unten. Wie liest Power Query dort den Text `1.234,50` aus der Spalte `versandkosten`?
    lang: powerquery
    code: |
      #"Geänderter Typ mit Gebietsschema" = Table.TransformColumnTypes(#"Gefilterte Zeilen", {{"versandkosten", type number}}, "de-DE")
    options:
      - text: Als 1234,5 – das Gebietsschema im Schritt gilt auf jedem Rechner.
        correct: true
        why: Ein Gebietsschema, das der Typ-Schritt ausdrücklich nennt, hat Vorrang vor der Einstellung der Arbeitsmappe und vor der Region des Betriebssystems.
      - text: Als Fehler, weil `1.234,50` in der Windows-Region Englisch (USA) keine gültige Zahl ist.
        correct: false
        why: Die Region des Betriebssystems ist nur die letzte Rückfallebene. Sie greift erst, wenn weder der Schritt noch die Arbeitsmappe ein Gebietsschema festlegen.
      - text: Nach der regionalen Einstellung, die in der Arbeitsmappe gespeichert ist.
        correct: false
        why: Die Einstellung der Arbeitsmappe gilt nur für Typ-Schritte ohne eigenes Gebietsschema. Hier steht `"de-DE"` direkt im Schritt.
      - text: Excel übersetzt den M-Code beim Öffnen in die Sprache des Rechners, danach gilt `"en-US"`.
        correct: false
        why: M-Code wird nicht übersetzt. Funktionsnamen, Schrittnamen und Kulturangaben bleiben so, wie sie gespeichert wurden.
    explanation: |
      Microsoft legt eine feste Reihenfolge fest: zuerst das Gebietsschema des Typ-Schritts, dann die Power Query-Einstellung der Arbeitsmappe, zuletzt das Betriebssystem. Ein Schritt mit `"de-DE"` beschreibt damit das Format der **Quelle** und hängt nicht davon ab, wer aktualisiert. Deshalb gehört das Gebietsschema sichtbar in den Code und nicht in eine Einstellung – zumal eine Arbeitsmappe Quellen in verschiedenen Formaten enthalten kann.
    resources:
      - title: Festlegen eines Gebietsschemas oder einer Region für Daten (Power Query)
        url: https://support.microsoft.com/de-de/excel/set-a-locale-or-region-for-data-power-query
      - title: Table.TransformColumnTypes
        url: https://learn.microsoft.com/de-de/powerquery-m/table-transformcolumntypes

  - id: anfuegen-aussagen
    type: choice
    title: Was Anfügen wirklich tut
    prompt: Du fügst mit **Start › Abfragen anfügen** den Shop-Export und den B2B-Export für März zu einer Tabelle zusammen. Welche Aussagen stimmen?
    options:
      - text: Die Spalten werden über ihren Namen zugeordnet, auch wenn sie in den beiden Dateien in unterschiedlicher Reihenfolge stehen.
        correct: true
        why: Power Query fügt nach Spaltennamen an, nicht nach der Position in der Kopfzeile.
      - text: Eine Spalte `rabattcode`, die nur der Shop-Export hat, bleibt erhalten; in den B2B-Zeilen steht dort `null`.
        correct: true
        why: Das Ergebnis enthält alle Spalten aller Tabellen. Wo eine Tabelle eine Spalte nicht hat, füllt Power Query `null` ein.
      - text: Heißt die Spalte im Shop-Export `Versandkosten` und im B2B-Export `versandkosten`, landen beide Werte in derselben Spalte.
        correct: false
        why: M unterscheidet Groß- und Kleinschreibung. Es entstehen zwei Spalten, jede zur Hälfte `null`.
      - text: Anfügen ergänzt jede Bestellung um die Region des Kunden aus der Abfrage `Kunden`.
        correct: false
        why: Spalten aus einer anderen Tabelle über einen Schlüssel ergänzen ist Zusammenführen, also ein Join. Anfügen stapelt nur Zeilen.
    explanation: |
      Anfügen (`Table.Combine`) stapelt Zeilen gleichartiger Tabellen, Zusammenführen (`Table.NestedJoin`) ergänzt Spalten über einen Schlüssel. Beim Anfügen entscheidet der exakte Spaltenname. Weichen Schreibweisen ab, fällt das oft erst an halb leeren Spalten auf. Benenne die Spalten deshalb in jeder Quelle zuerst einheitlich und füge danach an.
    resources:
      - title: Abfragen anfügen
        url: https://learn.microsoft.com/de-de/power-query/append-queries
      - title: Table.Combine
        url: https://learn.microsoft.com/de-de/powerquery-m/table-combine

  - id: ordner-import-ordnen
    type: order
    title: Ein Ordner, viele Monate
    prompt: Bring die Zeilen der Ordnerabfrage in die Reihenfolge, in der der Editor sie anlegt. Jeder Schritt verwendet den Schritt direkt darüber, und hinter `in` steht der letzte Schritt.
    lang: powerquery
    lines: |
      let
          Quelle = Folder.Files(Exportordner),
          #"Nur Bestellexporte" = Table.SelectRows(Quelle, each Text.StartsWith([Name], "bestellungen_") and Text.Lower([Extension]) = ".csv"),
          #"Tabelle je Datei" = Table.AddColumn(#"Nur Bestellexporte", "Daten", each Table.PromoteHeaders(Csv.Document([Content], [Delimiter = ";", Encoding = 65001]), [PromoteAllScalars = true])),
          Kombiniert = Table.Combine(#"Tabelle je Datei"[Daten]),
          #"Geänderter Typ mit Gebietsschema" = Table.TransformColumnTypes(Kombiniert, {{"bestelldatum", type date}, {"versandkosten", type number}}, "de-DE")
      in
          #"Geänderter Typ mit Gebietsschema"
    hints:
      - Suche den Schritt, der auf keinen anderen Schritt verweist.
      - "`#\"Tabelle je Datei\"[Daten]` ist die Liste der Tabellen, die `Table.Combine` stapelt."
    explanation: |
      Jeder Schritt nennt seinen Vorgänger: `Folder.Files` listet die Dateien, der Filter lässt nur Bestellexporte durch, `Table.AddColumn` liest je Datei den Inhalt als Tabelle, `Table.Combine` stapelt die Tabellen, und erst danach werden die Typen gesetzt – einmal für alle Dateien. Technisch dürften die Schritte zwischen `let` und `in` sogar in anderer Reihenfolge stehen, weil M sie über Namen verknüpft und erst bei Bedarf auswertet. Der Editor und jeder Leser erwarten aber die Reihenfolge der Verarbeitung, und nur der letzte Schritt steht ohne Komma vor `in`.
    resources:
      - title: Let-Ausdruck
        url: https://learn.microsoft.com/de-de/powerquery-m/m-spec-let
      - title: Folder.Files
        url: https://learn.microsoft.com/de-de/powerquery-m/folder-files

  - id: join-zeilen-zaehlen
    type: output
    title: Sieben aus fünf
    prompt: |
      Die Abfrage `Bestellungen` hat fünf Zeilen, die Abfrage `Kunden` fünf Zeilen:

      | bestellung_id | kunde_id |
      | --- | --- |
      | 10231 | 17 |
      | 10232 | 23 |
      | 10233 | 8 |
      | 10234 | 8 |
      | 10235 | 41 |

      | kunde_id | name | stadt |
      | --- | --- | --- |
      | 8 | Café Kranz | Köln |
      | 8 | Café Kranz | köln |
      | 17 | Büro Lindner | Bonn |
      | 23 | Kanzlei Voss | Düsseldorf |
      | 52 | Praxis Heller | Aachen |

      Wie viele Zeilen hat das Ergebnis `#"Erweiterte Kunden"`? Und in wie vielen dieser Zeilen ist `stadt` gleich `null`? Antworte mit zwei Zahlen in zwei Zeilen.
    lang: powerquery
    code: |
      let
          #"Zusammengeführte Abfragen" = Table.NestedJoin(Bestellungen, {"kunde_id"}, Kunden, {"kunde_id"}, "Kunden", JoinKind.LeftOuter),
          #"Erweiterte Kunden" = Table.ExpandTableColumn(#"Zusammengeführte Abfragen", "Kunden", {"name", "stadt"})
      in
          #"Erweiterte Kunden"
    expected: |
      7
      1
    hints:
      - Zähle für jede Bestellung, wie viele Kundenzeilen denselben Schlüssel haben.
      - Beim linken äußeren Join bleibt eine Bestellung ohne Treffer als eine Zeile erhalten.
    explanation: |
      Der linke äußere Join behält jede Bestellung. Kunde 8 steht zweimal in den Stammdaten, also erscheinen die Bestellungen 10233 und 10234 je zweimal: 1 + 1 + 2 + 2 = 6 Zeilen. Kunde 41 fehlt in den Stammdaten; seine Bestellung bleibt mit `null` in `name` und `stadt` erhalten – die siebte Zeile. Kunde 52 hat keine Bestellung und taucht nicht auf. Summierst du danach Versandkosten, zählen die Bestellungen von Kunde 8 doppelt. Prüfe Stammdaten deshalb vor dem Zusammenführen auf eindeutige Schlüssel, zum Beispiel mit **Start › Gruppieren nach** und der Anzahl je `kunde_id`.
    resources:
      - title: Table.NestedJoin
        url: https://learn.microsoft.com/de-de/powerquery-m/table-nestedjoin
      - title: Linker äußerer Join
        url: https://learn.microsoft.com/de-de/power-query/merge-queries-left-outer

  - id: anfuegen-nach-namen
    type: output
    title: Datum oder datum?
    prompt: |
      Die Januar-Abfrage hat drei Zeilen mit den Spalten `bestellung_id`, `Datum`, `Menge`. Die Februar-Abfrage hat zwei Zeilen mit den Spalten `bestellung_id`, `Menge`, `datum` – ein neuer Export mit anderer Reihenfolge und kleingeschriebenem Datum. Alle Zellen sind gefüllt.

      Wie viele Spalten hat `Kombiniert`? Und in wie vielen Zeilen ist die Spalte `Datum` (großgeschrieben) `null`? Antworte mit zwei Zahlen in zwei Zeilen.
    lang: powerquery
    code: |
      let
          Kombiniert = Table.Combine({Januar, Februar})
      in
          Kombiniert
    expected: |
      4
      2
    explanation: |
      `Table.Combine` ordnet Spalten über ihren Namen zu, deshalb schadet die andere Reihenfolge von `Menge` nicht. `Datum` und `datum` sind für M aber zwei verschiedene Namen: Das Ergebnis hat die Spalten `bestellung_id`, `Datum`, `Menge` und `datum`. In den zwei Februar-Zeilen ist `Datum` leer, in den drei Januar-Zeilen `datum`. Eine PivotTable nach `Datum` würde den Februar verlieren. Vereinheitliche die Spaltennamen je Quelle mit **Spalten umbenennen**, bevor du anfügst.
    resources:
      - title: Table.Combine
        url: https://learn.microsoft.com/de-de/powerquery-m/table-combine
      - title: Abfragen anfügen
        url: https://learn.microsoft.com/de-de/power-query/append-queries

  - id: union-all-nach-position
    type: output
    title: UNION ALL zählt nicht mit Namen
    prompt: |
      Zum Vergleich dieselbe Idee in SQL: Zwei Monatstabellen haben dieselben Spalten in unterschiedlicher Reihenfolge. Was gibt das Skript aus? Die Ausgabe folgt der `sqlite3`-Kommandozeile: Werte durch `|` getrennt, keine Kopfzeile, Kommazahlen mit Punkt.
    lang: sql
    code: |
      CREATE TABLE maerz (bestellung_id INTEGER, menge INTEGER, einzelpreis REAL);
      CREATE TABLE april (bestellung_id INTEGER, einzelpreis REAL, menge INTEGER);
      INSERT INTO maerz VALUES (10231, 2, 24.9);
      INSERT INTO april VALUES (10301, 12.5, 4);

      SELECT * FROM maerz
      UNION ALL
      SELECT * FROM april
      ORDER BY bestellung_id;

      SELECT SUM(menge) FROM (SELECT * FROM maerz UNION ALL SELECT * FROM april);
    expected: |
      10231|2|24.9
      10301|12.5|4
      14.5
    hints:
      - "`SELECT *` liefert die Spalten in der Reihenfolge, in der die Tabelle sie definiert."
      - Die Spaltennamen des Ergebnisses stammen aus der ersten Abfrage.
    explanation: |
      `UNION ALL` hängt die Zeilen nach **Position** an: Die zweite Spalte des Aprils (`einzelpreis`) landet in der zweiten Spalte des Ergebnisses, die nach dem März `menge` heißt. So wird aus einem Preis von 12,50 eine Menge von 12,5, und `SUM(menge)` ergibt 14,5 statt 6. SQL meldet keinen Fehler, weil die Spaltenzahl stimmt. Power Query würde beim Anfügen nach Namen zuordnen. In SQL nennst du die Spalten deshalb immer ausdrücklich: `SELECT bestellung_id, menge, einzelpreis FROM april`.
    resources:
      - title: SQLite · Compound Select
        url: https://www.sqlite.org/lang_select.html#compound_select_statements

  - id: typen-mit-gebietsschema
    type: gap
    title: Typen, die überall gleich rechnen
    prompt: Ergänze den Typ-Schritt für den Shop-Export. `bestelldatum` steht als `14.03.2026` in der Datei, Postleitzahlen wie `01067` sollen ihre führende Null behalten, und die Beträge folgen dem deutschen Format.
    lang: powerquery
    code: |
      #"Geänderter Typ mit Gebietsschema" = ⟦Table.TransformColumnTypes⟧(
          #"Gefilterte Zeilen",
          {{"bestellung_id", Int64.Type}, {"bestelldatum", ⟦type date⟧}, {"plz", ⟦type text⟧}, {"versandkosten", type number}},
          ⟦"de-DE"⟧
      )
    gaps:
      - label: Funktion
        hint: Die Funktion, die der Editor für „Typ ändern“ erzeugt – mit Tabellen-Präfix.
      - label: Typ für das Datum
        hint: Ein Datum ohne Uhrzeit, geschrieben mit dem Schlüsselwort `type`.
        accept: ["Date.Type"]
      - label: Typ für die Postleitzahl
        hint: Eine Postleitzahl ist eine Kennung, keine Rechengröße.
        accept: ["Text.Type"]
      - label: Gebietsschema
        hint: Sprache und Region als Kulturname in Anführungszeichen, Deutschland.
    explanation: |
      `Table.TransformColumnTypes` nimmt eine Liste aus Paaren `{Spalte, Typ}` und als drittes Argument das Gebietsschema der Quelle. `"de-DE"` sorgt dafür, dass `14.03.2026` als 14. März und `1.234,50` als 1234,5 gelesen werden, egal auf welchem Rechner. Die Postleitzahl als `type text` behält `01067`; als Zahl würde daraus 1067, und Joins mit anderen Tabellen fänden keinen Treffer mehr. `type date` und `Date.Type` sind gleichwertige Schreibweisen.
    resources:
      - title: Table.TransformColumnTypes
        url: https://learn.microsoft.com/de-de/powerquery-m/table-transformcolumntypes
      - title: Datentypen in Power Query
        url: https://learn.microsoft.com/de-de/power-query/data-types

  - id: zusammenfuehren-und-anti
    type: gap
    title: Kategorie holen, Lücken finden
    prompt: |
      Die erste Abfrage ergänzt jede Position um die Kategorie aus `Produkte` und behält dabei **alle** Positionen. Die zweite Abfrage ist eine Prüfabfrage: Sie liefert nur Positionen, deren `produkt_id` in `Produkte` nicht vorkommt. Ergänze Funktionen und Join-Arten.
    lang: powerquery
    code: |
      // Abfrage „Positionen mit Kategorie“
      let
          #"Zusammengeführte Abfragen" = ⟦Table.NestedJoin⟧(Positionen, {"produkt_id"}, Produkte, {"produkt_id"}, "Produkte", ⟦JoinKind.LeftOuter⟧),
          #"Erweiterte Produkte" = ⟦Table.ExpandTableColumn⟧(#"Zusammengeführte Abfragen", "Produkte", {"kategorie"}, {"kategorie"})
      in
          #"Erweiterte Produkte"

      // Abfrage „Unbekannte Produkte“ – muss leer sein
      let
          Unbekannt = Table.NestedJoin(Positionen, {"produkt_id"}, Produkte, {"produkt_id"}, "Produkte", ⟦JoinKind.LeftAnti⟧)
      in
          Unbekannt
    gaps:
      - label: Join-Funktion
        hint: Die Funktion legt eine Spalte mit verschachtelten Tabellen an.
      - label: Alle Positionen behalten
        hint: Alle Zeilen der linken Tabelle, passende der rechten – der Standard im Dialog.
        accept: ["1"]
      - label: Spalten herausholen
        hint: Erweitert eine Spalte, die Tabellen enthält.
      - label: Nur Positionen ohne Treffer
        hint: Die Join-Art heißt im Dialog „Linker Anti“.
        accept: ["4"]
    explanation: |
      `Table.NestedJoin` legt je Position eine kleine Tabelle mit den passenden Produktzeilen an; `Table.ExpandTableColumn` holt daraus die Spalte `kategorie`. `JoinKind.LeftOuter` behält jede Position, auch ohne Treffer – dann steht `null` in `kategorie`. `JoinKind.LeftAnti` liefert genau diese Positionen ohne Treffer und eignet sich deshalb als Prüfabfrage, die leer sein muss. Die Zahlen `1` und `4` sind die Werte hinter den Namen, aber die Namen sagen, was gemeint ist.
    resources:
      - title: Table.NestedJoin
        url: https://learn.microsoft.com/de-de/powerquery-m/table-nestedjoin
      - title: JoinKind.Type
        url: https://learn.microsoft.com/de-de/powerquery-m/joinkind-type
      - title: Linker Anti-Join
        url: https://learn.microsoft.com/de-de/power-query/merge-queries-left-anti

  - id: unbekannte-produkte
    type: sql
    title: Die Prüfabfrage in SQL
    prompt: |
      Die Positionen des Monats sollen um Produktstammdaten ergänzt werden. Vorher prüfst du, welche Positionen eine `produkt_id` haben, die in `produkte` gar nicht vorkommt – das Gegenstück zur Join-Art „Linker Anti“. Inaktive Produkte (`aktiv = 0`) zählen als vorhanden.

      Spalten `bestellung_id`, `position`, `produkt_id`; sortiert nach `bestellung_id`, dann nach `position`.
    schema: |
      CREATE TABLE produkte (produkt_id INTEGER PRIMARY KEY, name TEXT NOT NULL, kategorie TEXT NOT NULL, aktiv INTEGER NOT NULL);
      INSERT INTO produkte VALUES
        (1, 'Hausmischung Espresso 1 kg', 'Espresso', 1),
        (2, 'Äthiopien Sidamo 500 g', 'Filter', 1),
        (3, 'Handmühle Classic', 'Zubehör', 0),
        (4, 'Colombia Huila 500 g', 'Filter', 1);
      CREATE TABLE positionen (bestellung_id INTEGER, position INTEGER, produkt_id INTEGER, menge INTEGER, einzelpreis REAL, rabatt REAL, PRIMARY KEY (bestellung_id, position));
      INSERT INTO positionen VALUES
        (10231, 1, 1, 2, 24.90, 0),
        (10231, 2, 3, 1, 39.00, 0),
        (10232, 1, 7, 1, 12.50, 0),
        (10233, 1, 2, 3, 11.90, 0.1),
        (10233, 2, 12, 2, 8.90, 0),
        (10234, 1, 4, 1, 12.90, 0),
        (10235, 1, 7, 4, 12.50, 0.05);
    starter: |
      SELECT po.bestellung_id, po.position, po.produkt_id
      FROM positionen AS po
      JOIN produkte AS pr ON pr.produkt_id = po.produkt_id
      ORDER BY po.bestellung_id, po.position;
    solution: |
      SELECT po.bestellung_id, po.position, po.produkt_id
      FROM positionen AS po
      LEFT JOIN produkte AS pr ON pr.produkt_id = po.produkt_id
      WHERE pr.produkt_id IS NULL
      ORDER BY po.bestellung_id, po.position;
    ordered: true
    hints:
      - Der Startcode liefert die Positionen **mit** Treffer. Welche Join-Art behält auch die ohne?
      - Nach einem `LEFT JOIN` sind die Spalten der rechten Tabelle bei fehlendem Treffer `NULL`.
      - "`LEFT JOIN produkte … WHERE pr.produkt_id IS NULL` – oder `WHERE NOT EXISTS (…)`."
    explanation: |
      Ein `LEFT JOIN` behält jede Position; wo kein Produkt passt, sind alle Spalten von `produkte` `NULL`. `WHERE pr.produkt_id IS NULL` lässt genau diese Zeilen übrig: zweimal Produkt 7 und einmal Produkt 12. Die Handmühle ist inaktiv, aber vorhanden, und gehört deshalb nicht ins Ergebnis. `NOT EXISTS` mit einer Unterabfrage liefert dasselbe. Als Prüfabfrage neben dem Import muss dieses Ergebnis leer sein, bevor Umsätze je Kategorie berichtet werden.
    resources:
      - title: SQLite · SELECT (Joins)
        url: https://www.sqlite.org/lang_select.html
      - title: Linker Anti-Join
        url: https://learn.microsoft.com/de-de/power-query/merge-queries-left-anti

  - id: fehler-abfangen
    type: gap
    title: Quarantäne statt Papierkorb
    prompt: |
      Im Februar-Export steht bei einigen Bestellungen `n/a` statt Versandkosten. Der erste Schritt soll `n/a` bewusst zu `null` machen und jede andere nicht lesbare Angabe als Fehler stehen lassen. Die Abfrage `Fehlerzeilen` soll genau die Zeilen liefern, in denen `bestelldatum` oder `versandkosten_eur` einen Fehler enthalten. Ergänze die Lücken.
    lang: powerquery
    code: |
      // in der Abfrage „Bestellungen_roh“
      #"Versandkosten als Zahl" = Table.AddColumn(#"Gefilterte Zeilen", "versandkosten_eur",
          each if [versandkosten] = "n/a" then null else ⟦try⟧ Number.FromText([versandkosten], "de-DE") ⟦otherwise⟧ error "Unbekanntes Format: " & [versandkosten],
          type nullable number)

      // Abfrage „Fehlerzeilen“
      let
          Fehlerzeilen = ⟦Table.SelectRowsWithErrors⟧(Bestellungen_roh, {"bestelldatum", "versandkosten_eur"})
      in
          Fehlerzeilen
    gaps:
      - label: Versuch
        hint: Das Schlüsselwort wertet einen Ausdruck aus und fängt dessen Fehler ab.
      - label: Ersatz im Fehlerfall
        hint: Das Gegenstück zum zweiten Argument von `WENNFEHLER`.
      - label: Nur Zeilen mit Fehlern
        hint: Das Gegenteil von `Table.RemoveRowsWithErrors`.
    explanation: |
      `try x otherwise y` liefert `x` oder, wenn `x` einen Fehler erzeugt, `y`. Hier ist `y` selbst ein neuer Fehler mit klarer Meldung – so wird der bekannte Platzhalter `n/a` zu `null`, eine unbekannte Schreibweise wie `4,9O` aber nicht still geschluckt. `Table.SelectRowsWithErrors` sammelt diese Zeilen in einer eigenen Abfrage, die auf ein Prüfblatt geladen wird. `Table.RemoveRowsWithErrors` würde sie dagegen löschen, und der Umsatz wäre ohne Hinweis zu niedrig.
    resources:
      - title: Fehlerbehandlung in Power Query
        url: https://learn.microsoft.com/de-de/power-query/error-handling
      - title: Table.SelectRowsWithErrors
        url: https://learn.microsoft.com/de-de/powerquery-m/table-selectrowswitherrors

  - id: entpivotieren-feste-liste
    type: bug
    title: Der April fehlt im Absatzplan
    prompt: |
      Der Absatzplan ist eine Excel-Tabelle mit den Spalten `produkt_id`, `produkt`, `Jan`, `Feb`, `Mrz`. Die Abfrage bringt ihn in die lange Form für die PivotTable. Im April ergänzt der Vertrieb die Spalte `Apr` und klickt auf **Alle aktualisieren**. Die Abfrage läuft ohne Fehler, aber die PivotTable zeigt keine April-Mengen, und in der geladenen Tabelle steht plötzlich eine Spalte `Apr` neben `monat` und `menge`. Finde die fehlerhafte Zeile und korrigiere sie so, dass auch künftige Monatsspalten erfasst werden. Der Schrittname bleibt gleich.
    lang: powerquery
    code: |
      let
          Quelle = Excel.CurrentWorkbook(){[Name = "Absatzplan"]}[Content],
          #"Geänderter Typ" = Table.TransformColumnTypes(Quelle, {{"produkt_id", Int64.Type}, {"produkt", type text}}),
          #"Entpivotierte Spalten" = Table.Unpivot(#"Geänderter Typ", {"Jan", "Feb", "Mrz"}, "Attribut", "Wert"),
          #"Umbenannte Spalten" = Table.RenameColumns(#"Entpivotierte Spalten", {{"Attribut", "monat"}, {"Wert", "menge"}})
      in
          #"Umbenannte Spalten"
    lines: [4]
    fix:
      - line: 4
        answers:
          - '#"Entpivotierte Spalten" = Table.UnpivotOtherColumns(#"Geänderter Typ", {"produkt_id", "produkt"}, "Attribut", "Wert"),'
          - '#"Entpivotierte Spalten" = Table.UnpivotOtherColumns(#"Geänderter Typ", {"produkt", "produkt_id"}, "Attribut", "Wert"),'
          - '#"Entpivotierte Spalten" = Table.UnpivotOtherColumns(#"Geänderter Typ", {"produkt_id", "produkt"}, "Attribut", "Wert")'
          - '#"Entpivotierte Spalten" = Table.UnpivotOtherColumns(#"Geänderter Typ", {"produkt", "produkt_id"}, "Attribut", "Wert")'
    hints:
      - Welche Spalten stehen fest, welche kommen jeden Monat dazu?
      - Es gibt eine Variante der Funktion, der du die Spalten nennst, die **nicht** entpivotiert werden.
    explanation: |
      `Table.Unpivot` entpivotiert genau die genannten Spalten `Jan`, `Feb` und `Mrz`. Jede neue Monatsspalte bleibt unverändert stehen – ohne Fehlermeldung. `Table.UnpivotOtherColumns` dreht die Logik um: Du nennst die Spalten, die bleiben (`produkt_id`, `produkt`), und alles andere wird entpivotiert, auch `Apr` und alle künftigen Monate. Im Editor entsteht diese Variante über **Andere Spalten entpivotieren**; auch **Spalten entpivotieren** auf markierten Spalten erzeugt sie. Nur **Nur ausgewählte Spalten entpivotieren** schreibt die feste Liste.
    resources:
      - title: Spalten entpivotieren
        url: https://learn.microsoft.com/de-de/power-query/unpivot-column
      - title: Table.UnpivotOtherColumns
        url: https://learn.microsoft.com/de-de/powerquery-m/table-unpivotothercolumns

  - id: in-zeigt-auf-alten-schritt
    type: bug
    title: Der Filter wirkt nicht
    prompt: |
      Du hast im Erweiterten Editor einen Schritt ergänzt, der stornierte Bestellungen herausfiltert. Die Abfrage speichert ohne Fehlermeldung, im Bereich „Angewendete Schritte“ steht `Gefilterte Zeilen` sogar als letzter Schritt. Nach **Schließen & laden** enthält die Tabelle aber weiterhin alle stornierten Bestellungen. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: powerquery
    code: |
      let
          Quelle = Csv.Document(File.Contents(Dateipfad), [Delimiter = ";", Encoding = 65001]),
          #"Höher gestufte Header" = Table.PromoteHeaders(Quelle, [PromoteAllScalars = true]),
          #"Geänderter Typ mit Gebietsschema" = Table.TransformColumnTypes(#"Höher gestufte Header", {{"bestelldatum", type date}, {"versandkosten", type number}}, "de-DE"),
          #"Gefilterte Zeilen" = Table.SelectRows(#"Geänderter Typ mit Gebietsschema", each [status] <> "storniert")
      in
          #"Geänderter Typ mit Gebietsschema"
    lines: [7]
    fix:
      - line: 7
        answers:
          - '#"Gefilterte Zeilen"'
    explanation: |
      Das Ergebnis einer Abfrage ist der Ausdruck hinter `in`. Hier steht dort noch der Typ-Schritt, der vor dem Filter liegt. M wertet Schritte nur aus, wenn jemand sie braucht; auf `#"Gefilterte Zeilen"` verweist nichts, also wird der Filter nie ausgeführt. Nach Änderungen im Erweiterten Editor gilt deshalb: Der letzte Schritt steht ohne Komma da, und hinter `in` steht sein Name.
    resources:
      - title: Let-Ausdruck
        url: https://learn.microsoft.com/de-de/powerquery-m/m-spec-let
      - title: Table.SelectRows
        url: https://learn.microsoft.com/de-de/powerquery-m/table-selectrows

  - id: ordner-abfrage-erklaeren
    type: explain
    title: Warum der neue Monat von selbst kommt
    prompt: Dein Teamleiter fragt, warum der Monatsbericht seit März „einfach aktualisiert“ wird und ob man der Abfrage trauen kann. Erkläre ihm, was diese Abfrage tut, was beim Aktualisieren mit einer neuen Datei `bestellungen_2026-04.csv` passiert und welche Entscheidungen sie robust machen.
    lang: powerquery
    code: |
      let
          Quelle = Folder.Files(Exportordner),
          #"Nur Bestellexporte" = Table.SelectRows(Quelle, each Text.Lower([Extension]) = ".csv"
              and Text.StartsWith([Name], "bestellungen_") and [Attributes]?[Hidden]? <> true),
          #"Tabelle je Datei" = Table.AddColumn(#"Nur Bestellexporte", "Daten", each Table.PromoteHeaders(
              Table.Skip(Csv.Document([Content], [Delimiter = ";", Encoding = 65001]), 2), [PromoteAllScalars = true])),
          #"Andere entfernte Spalten" = Table.SelectColumns(#"Tabelle je Datei", {"Name", "Daten"}),
          #"Erweiterte Daten" = Table.ExpandTableColumn(#"Andere entfernte Spalten", "Daten",
              {"bestellung_id", "kunde_id", "bestelldatum", "kanal", "status", "versandkosten"}),
          #"Gefilterte Zeilen" = Table.SelectRows(#"Erweiterte Daten", each [bestellung_id] <> "Summe"),
          #"Geänderter Typ mit Gebietsschema" = Table.TransformColumnTypes(#"Gefilterte Zeilen",
              {{"bestellung_id", Int64.Type}, {"kunde_id", Int64.Type}, {"bestelldatum", type date}, {"versandkosten", type number}}, "de-DE")
      in
          #"Geänderter Typ mit Gebietsschema"
    points:
      - "`Folder.Files` listet alle Dateien des Parameter-Ordners samt Unterordnern; der Filter lässt nur sichtbare CSV-Dateien mit dem Präfix `bestellungen_` durch, deshalb wird eine neue Monatsdatei beim Aktualisieren automatisch aufgenommen."
      - Jede Datei wird mit denselben Regeln gelesen – Semikolon, UTF-8, zwei Vorspannzeilen überspringen, Kopfzeile höherstufen – und die Tabellen werden über die Spaltennamen gestapelt.
      - Die Spalte `Name` bleibt erhalten, sodass jede Zeile ihre Herkunftsdatei trägt und doppelte oder fehlerhafte Dateien auffallen.
      - Die Summenzeile wird über eine Bedingung entfernt, und die Typen werden mit `"de-DE"` gesetzt – unabhängig von Rechner und Arbeitsmappe.
      - "Grenze: Der Ordner ist der Zustand. Eine doppelte Datei mit passendem Namen würde mitgezählt, deshalb braucht es eine Prüfung der Zeilen je Datei."
    explanation: |
      Die Abfrage liest nicht „die Märzdatei“, sondern alles, was im Exportordner liegt und wie ein Bestellexport heißt. `Folder.Files` liefert eine Zeile je Datei, auch aus Unterordnern; der Filter behält sichtbare CSV-Dateien mit dem Präfix `bestellungen_`. Für jede Datei liest `Csv.Document` den Inhalt mit Semikolon und UTF-8, `Table.Skip` entfernt die zwei Vorspannzeilen, und die Kopfzeile wird zur Spaltenüberschrift. Die Spalte `Name` bleibt stehen, damit man jeder Zeile ansieht, aus welcher Datei sie kommt. Nach dem Erweitern fliegt die Summenzeile über eine Bedingung raus, und die Typen werden mit deutschem Gebietsschema gesetzt – das rechnet auf jedem Rechner gleich. Legt jemand `bestellungen_2026-04.csv` in den Ordner, ist sie beim nächsten **Alle aktualisieren** dabei. Vertrauen kann man dem Ergebnis, wenn zusätzlich eine Prüfabfrage die Zeilen je Datei zählt: Ein versehentlicher zweiter Download mit passendem Namen würde sonst doppelt gezählt.
    resources:
      - title: Übersicht über das Kombinieren von Dateien
        url: https://learn.microsoft.com/de-de/power-query/combine-files-overview
      - title: Folder.Files
        url: https://learn.microsoft.com/de-de/powerquery-m/folder-files

  - id: monatsimport-bauen
    type: practice
    title: Der Monatsimport von Bohnenwerk
    prompt: |
      Baue in Excel den wiederholbaren Import für die Shop-Bestellungen.

      1. Lege einen Ordner `Export` an und darin die drei Dateien unten, gespeichert als **UTF-8** (in einem Texteditor, nicht in Excel).
      2. Lege den Parameter `Exportordner` mit dem Pfad des Ordners an.
      3. Baue die Abfrage `Bestellungen_roh` (nur Verbindung) als Ordner-Import: Namensfilter, Vorspann überspringen, Kopfzeile höherstufen, Summenzeile per Bedingung entfernen, Herkunft `Name` behalten, Typen mit Gebietsschema `de-DE`, zusätzlich eine Spalte `monat` mit dem Monatsersten.
      4. Leite daraus `Bestellungen` (ohne Fehlerzeilen, geladen als Tabelle) und `Fehlerzeilen` (nur Fehlerzeilen, geladen auf ein Blatt `Prüfung`) ab.
      5. Baue auf `Bestellungen` eine PivotTable: Summe der Versandkosten je `monat` und `kanal`.
      6. Lege eine vierte Datei `bestellungen_2026-04.csv` mit zwei Bestellungen an und klicke **Daten › Alle aktualisieren**.

      `bestellungen_2026-01.csv`:

      ```csv
      Bestellexport Webshop;;;;;
      Zeitraum: 01.01.2026 - 31.01.2026;;;;;
      bestellung_id;kunde_id;bestelldatum;kanal;status;versandkosten
      10001;17;05.01.2026;Shop;bezahlt;4,90
      10002;23;12.01.2026;B2B;bezahlt;0,00
      10003;8;28.01.2026;Shop;storniert;4,90
      Summe;;;;;9,80
      ```

      `bestellungen_2026-02.csv`:

      ```csv
      Bestellexport Webshop;;;;;
      Zeitraum: 01.02.2026 - 28.02.2026;;;;;
      bestellung_id;kunde_id;bestelldatum;kanal;status;versandkosten
      10004;41;02.02.2026;Shop;bezahlt;4,90
      10005;17;09.02.2026;Shop;bezahlt;n/a
      10006;23;23.02.2026;B2B;bezahlt;12,50
      Summe;;;;;17,40
      ```

      `bestellungen_2026-03.csv`:

      ```csv
      Bestellexport Webshop;;;;;
      Zeitraum: 01.03.2026 - 31.03.2026;;;;;
      bestellung_id;kunde_id;bestelldatum;kanal;status;versandkosten
      10007;8;02.03.2026;Shop;bezahlt;4,90
      10008;52;03.03.2026;Shop;retourniert;4,90
      10009;17;14.03.2026;B2B;bezahlt;1.234,50
      10010;23;31.03.2026;Shop;bezahlt;0,00
      Summe;;;;;1.244,30
      ```
    lang: powerquery
    solution: |
      // Parameter „Exportordner“
      "C:\Bohnenwerk\Export" meta [IsParameterQuery = true, Type = "Text", IsParameterQueryRequired = true]

      // Abfrage „Bestellungen_roh“ (Nur Verbindung erstellen)
      let
          Quelle = Folder.Files(Exportordner),
          #"Nur Bestellexporte" = Table.SelectRows(Quelle, each Text.Lower([Extension]) = ".csv"
              and Text.StartsWith([Name], "bestellungen_") and [Attributes]?[Hidden]? <> true),
          #"Tabelle je Datei" = Table.AddColumn(#"Nur Bestellexporte", "Daten", each Table.PromoteHeaders(
              Table.Skip(Csv.Document([Content], [Delimiter = ";", Encoding = 65001]), 2), [PromoteAllScalars = true])),
          #"Andere entfernte Spalten" = Table.SelectColumns(#"Tabelle je Datei", {"Name", "Daten"}),
          #"Erweiterte Daten" = Table.ExpandTableColumn(#"Andere entfernte Spalten", "Daten",
              {"bestellung_id", "kunde_id", "bestelldatum", "kanal", "status", "versandkosten"}),
          #"Gefilterte Zeilen" = Table.SelectRows(#"Erweiterte Daten", each [bestellung_id] <> "Summe"),
          #"Geänderter Typ mit Gebietsschema" = Table.TransformColumnTypes(#"Gefilterte Zeilen",
              {{"bestellung_id", Int64.Type}, {"kunde_id", Int64.Type}, {"bestelldatum", type date},
               {"kanal", type text}, {"status", type text}, {"versandkosten", type number}}, "de-DE"),
          #"Monat hinzugefügt" = Table.AddColumn(#"Geänderter Typ mit Gebietsschema", "monat",
              each Date.StartOfMonth([bestelldatum]), type date)
      in
          #"Monat hinzugefügt"

      // Abfrage „Bestellungen“ (als Tabelle laden)
      let
          Quelle = Bestellungen_roh,
          #"Entfernte Fehler" = Table.RemoveRowsWithErrors(Quelle, {"bestelldatum", "versandkosten", "monat"})
      in
          #"Entfernte Fehler"

      // Abfrage „Fehlerzeilen“ (auf das Blatt „Prüfung“ laden)
      let
          Quelle = Bestellungen_roh,
          Fehlerzeilen = Table.SelectRowsWithErrors(Quelle, {"bestelldatum", "versandkosten", "monat"})
      in
          Fehlerzeilen
    checklist:
      - "`Bestellungen_roh` hat 10 Zeilen – die Datenzeilen der drei Dateien, keine Vorspann- und keine Summenzeile."
      - Die Spalte `Name` zeigt je Zeile die Quelldatei.
      - Der Typ-Schritt enthält `"de-DE"` als drittes Argument; Bestellung 10009 hat Versandkosten von 1234,5.
      - "`Fehlerzeilen` enthält genau Bestellung 10005 (`n/a`), `Bestellungen` die übrigen 9 Zeilen."
      - Die PivotTable zeigt Versandkosten je Monat und Kanal, März B2B mit 1234,5.
      - Nach dem Anlegen der April-Datei und **Alle aktualisieren** erscheint der April ohne weitere Änderung an einer Abfrage.
      - Der Ordnerpfad steht an genau einer Stelle, im Parameter `Exportordner`.
    hints:
      - Beginne mit **Daten › Daten abrufen › Aus Datei › Aus Ordner** und wähle **Daten transformieren** statt **Kombinieren**, wenn du die Abfrage selbst aufbauen willst.
      - "`Bestellungen` und `Fehlerzeilen` verweisen beide auf `Bestellungen_roh` – Rechtsklick auf die Abfrage › **Verweis**."
    explanation: |
      Die Aufgabe verbindet alle Bausteine des Moduls: Ein Parameter hält den Pfad, der Ordner-Import liest jede passende Datei mit denselben Regeln, Bedingungen statt Positionen entfernen Sonderzeilen, und das Gebietsschema macht aus `1.234,50` auf jedem Rechner 1234,5. Die Aufteilung in `Bestellungen` und `Fehlerzeilen` sorgt dafür, dass die Zeile mit `n/a` sichtbar bleibt: 9 + 1 = 10 Zeilen, nichts verschwindet. Der Test mit der April-Datei beweist den eigentlichen Nutzen – der nächste Monat kostet keinen Handgriff außer **Alle aktualisieren**.
    resources:
      - title: Kombinieren von CSV-Dateien
        url: https://learn.microsoft.com/de-de/power-query/combine-files-csv
      - title: Parameter in Power Query
        url: https://learn.microsoft.com/de-de/power-query/power-query-query-parameters
