lesson: |
  Jeden Montag um neun will die Vertriebsleitung von Bohnenwerk wissen: Umsatz je Region und Kanal, Anteil der B2B-Kunden, Vergleich zum Vormonat. Bisher filterte das Controlling die Exportliste von Hand nach Region und Kanal, las die Summe unten ab und tippte sie in ein Übersichtsblatt – zwölf Filter, zwölf abgetippte Zahlen, gut eine Stunde. Einmal hatte jemand eine Zwischensummenzeile in die Liste eingefügt, und der Nordumsatz war genau um diese Summe zu hoch.

  Mit zwei Werkzeugen wird daraus ein Ablauf mit drei Handgriffen. Die Daten stehen in einer **Excel-Tabelle**, die neue Exportzeilen aufnimmt, und eine **PivotTable** fasst sie zusammen. Montags heißt es dann: Export unter die Tabelle einfügen, Daten › Alle aktualisieren, Zeitachse auf den neuen Zeitraum stellen. Fünf Minuten statt einer Stunde, und keine Zahl wird mehr abgetippt.

  Das Modul baut auf [Excel-Formeln, die nächsten Monat noch stimmen](/data/excel-formeln) auf und endet mit der Brücke zu SQL: Eine PivotTable ist `GROUP BY` mit bedingter Aggregation.

  ## Als Tabelle formatieren: ein Bereich mit Namen

  Markiere eine Zelle in den Daten und drücke Strg+T, alternativ Start › Als Tabelle formatieren oder Einfügen › Tabelle. Excel fragt nach dem Bereich und ob die Tabelle Überschriften hat. Danach ist der Bereich ein Objekt mit Eigenschaften ([Microsoft: Übersicht zu Excel-Tabellen](https://support.microsoft.com/de-de/excel/overview-of-excel-tables)):

  - Sie hat einen **Namen**. Excel vergibt `Tabelle1`; im Register Tabellenentwurf trägst du unter Tabellenname etwas Sprechendes ein, hier `Umsatz`.
  - Sie **wächst mit**. Zeilen, die du direkt unter der letzten Zeile eingibst oder einfügst, gehören zur Tabelle; eine Überschrift direkt rechts daneben wird zur neuen Spalte.
  - Sie kennt ihre **Spalten**. Die Kopfzeile hat Filterschaltflächen, beim Scrollen ersetzen die Spaltennamen die Buchstaben A, B, C, und Formeln sprechen Spalten mit Namen an.

  Eine Tabelle verlangt, was [Saubere Tabellen und Datenmodelle](/data/tabellenmodelle) ohnehin fordert: genau eine Kopfzeile, eindeutige Spaltennamen, keine Leerzeilen, keine Summenzeilen zwischen den Daten, eine Beobachtung pro Zeile. Verbundene Zellen kann sie nicht enthalten. Die Umwandlung zwingt also zu Daten, die sich auswerten lassen.

  > [!TIP] Objekte sichtbar benennen
  > Viele Teams geben Objekten Präfixe wie `tbl_Umsatz` für Tabellen und `pt_Umsatz` für PivotTables. Tabellen stehen dann in der Formel-AutoVervollständigung und im Namens-Manager geordnet beieinander, PivotTables erkennt man am Namen unter PivotTable-Analyse › PivotTable. In diesem Kurs heißen die Tabellen kurz `Umsatz` und `Produkte`.

  ## Strukturierte Verweise, berechnete Spalten und die Ergebniszeile

  Statt `D2:D1302` schreibst du in Formeln Tabellen- und Spaltennamen. Diese **strukturierten Verweise** passen sich an, wenn Zeilen dazukommen oder Spalten umbenannt werden ([Microsoft: strukturierte Verweise](https://support.microsoft.com/de-de/excel/using-structured-references-with-excel-tables)):

  | Verweis | meint |
  | --- | --- |
  | `Umsatz[netto]` | alle Datenzellen der Spalte `netto`, ohne Kopf- und Ergebniszeile |
  | `[@menge]` | den Wert der Spalte `menge` in derselben Zeile, innerhalb der Tabelle |
  | `Umsatz[[menge]:[rabatt]]` | die Spalten von `menge` bis `rabatt` |
  | `Umsatz[#Kopfzeilen]` | die Kopfzeile |
  | `Umsatz[[#Ergebnisse];[netto]]` | die Zelle der Ergebniszeile unter `netto` |
  | `Umsatz[[#Alle];[netto]]` | die ganze Spalte mit Kopf- und Ergebniszeile |

  Enthält ein Spaltenname Leerzeichen oder Sonderzeichen, setzt Excel ihn in zusätzliche Klammern, etwa `[@[Preis netto]]`.

  **Berechnete Spalten.** Tippst du in die erste Zelle einer neuen Spalte `netto` diese Formel, füllt Excel sie sofort in die ganze Spalte, und jede neue Zeile bekommt sie automatisch ([Microsoft: berechnete Spalten](https://support.microsoft.com/de-de/excel/use-calculated-columns-in-an-excel-table)):

  ```excel
  =[@menge]*[@einzelpreis]*(1-[@rabatt])
  ```

  Es gibt nur noch eine Formel für die ganze Spalte, nicht 1302 Kopien, die auseinanderlaufen können. Überschreibt jemand eine einzelne Zelle mit einem Wert, entsteht eine Ausnahme, die die Fehlerüberprüfung als inkonsistente berechnete Spaltenformel markiert.

  Außerhalb der Tabelle schreibst du den Tabellennamen dazu:

  ```excel
  =SUMMEWENNS(Umsatz[netto];Umsatz[kanal];"B2B";Umsatz[status];"bezahlt")
  ```

  Kopierst du eine solche Formel mit Strg+C und Strg+V, bleiben die Verweise gleich. Ziehst du sie dagegen mit dem Ausfüllkästchen nach rechts, verschiebt Excel die Spaltennamen wie eine Reihe, und aus `Umsatz[netto]` wird die Spalte rechts daneben. Nach unten ausgefüllt bleiben sie gleich.

  **Ergebniszeile.** Im Register Tabellenentwurf schaltet das Kontrollkästchen Ergebniszeile eine Zeile unter der Tabelle ein. Wählst du dort in der Auswahlliste „Summe“, schreibt Excel nicht `SUMME`, sondern die erste der drei Formeln ([Microsoft: Gesamtergebnisse in einer Tabelle](https://support.microsoft.com/de-de/excel/get-started/total-the-data-in-an-excel-table)):

  ```excel
  =TEILERGEBNIS(109;[netto])
  =TEILERGEBNIS(9;[netto])
  =SUMME(Umsatz[netto])
  ```

  `TEILERGEBNIS` (englisch `SUBTOTAL`) wählt die Rechenart über eine Nummer: 9 ist Summe, 1 Mittelwert, 3 die Anzahl nicht leerer Zellen. Zeilen, die ein Filter ausblendet, lässt es **immer** weg. Die Nummern 101 bis 111 lassen zusätzlich Zeilen weg, die du von Hand ausgeblendet hast; 1 bis 11 zählen sie mit. Stehen im Bereich selbst `TEILERGEBNIS`-Formeln, ignoriert es sie, damit nichts doppelt zählt ([Microsoft: TEILERGEBNIS](https://support.microsoft.com/de-de/excel/functions/subtotal-function)). `SUMME` (englisch `SUM`) summiert dagegen alles, was im Bereich steht, auch gefilterte Zeilen. Filterst du die Tabelle auf den Kanal B2B, zeigt die Ergebniszeile den B2B-Umsatz, eine `SUMME` daneben weiter den Gesamtumsatz. Beides ist nützlich, solange du weißt, welches du vor dir hast.

  ## PivotTables: Zeilen, Spalten, Werte, Filter

  Eine PivotTable fasst viele Zeilen zu einer Kreuztabelle zusammen. Klick in die Tabelle `Umsatz` und wähle Einfügen › PivotTable. Als Tabelle/Bereich steht dort `Umsatz` – der Tabellenname, kein fester Zellbereich –, als Ziel wählst du ein neues Arbeitsblatt ([Microsoft: PivotTable erstellen](https://support.microsoft.com/de-de/excel/get-started/create-a-pivottable-to-analyze-worksheet-data)). Im Bereich PivotTable-Felder ziehst du Spalten der Quelle in vier Bereiche:

  - **Zeilen**: Jedes Element des Felds wird eine Zeilenbeschriftung, etwa jede Region eine Zeile.
  - **Spalten**: Jedes Element wird eine Spaltenüberschrift, etwa jeder Kanal eine Spalte.
  - **Werte**: das Feld, das zusammengefasst wird, etwa `netto`.
  - **Filter**: ein Feld, das die Quelle einschränkt, bevor gerechnet wird, etwa `status` = bezahlt.

  Das Denkmodell: Jede Zelle im Inneren der PivotTable ist eine Aggregation über genau die Quellzeilen, die zu ihrer Zeile, ihrer Spalte und allen Filtern passen. Mit den März-Daten aus dem Monatsbericht und dem Filter `status` = bezahlt sieht das so aus:

  ```text
  Summe von netto        Spaltenbeschriftungen
  Zeilenbeschriftungen   B2B        Shop       Gesamtergebnis
  Nord                   156,00     52,00      208,00
  West                   350,55                350,55
  Gesamtergebnis         506,55     52,00      558,55
  ```

  Die Zelle Nord/B2B summiert alle bezahlten Zeilen mit Region Nord und Kanal B2B. West/Shop ist leer, nicht 0: Es gibt keine einzige passende Zeile. Süd fehlt ganz, weil die einzige Süd-Zeile storniert ist und der Filter sie vor dem Gruppieren entfernt.

  **Wertfeldeinstellungen.** Ein Rechtsklick auf einen Wert und Wertfeldeinstellungen öffnen zwei Registerkarten ([Microsoft: Zusammenfassungsfunktion ändern](https://support.microsoft.com/de-de/excel/change-the-summary-function-or-custom-calculation-for-a-field-in-a-pivottable)):

  - **Werte zusammenfassen nach**: Summe, Anzahl, Mittelwert, Max, Min und weitere. Für Zahlen ist Summe der Standard, für Text Anzahl. Interpretiert Excel die Spalte als Text, etwa weil ein `n/a` zwischen den Beträgen steht, fasst es mit Anzahl zusammen, und aus Euro werden kleine ganze Zahlen. „Anzahl“ zählt wie `ANZAHL2` nicht leere Werte, also Zeilen – bei Positionsdaten Positionen, nicht Bestellungen. Verschiedene Bestellungen zählt „Diskrete Anzahl“, die es nur mit dem Datenmodell gibt.
  - **Werte anzeigen als**: rechnet die Zusammenfassung um. „% des Gesamtergebnisses“ teilt jede Zelle durch das Gesamtergebnis rechts unten, „% des Spaltengesamtergebnisses“ durch die Summe ihrer Spalte, „% des Zeilengesamtergebnisses“ durch die Summe ihrer Zeile. „Differenz von“ und „% Differenz von“ vergleichen mit einem Basiselement wie dem Vormonat, „Ergebnis in“ bildet eine laufende Summe ([Microsoft: Werte anzeigen als](https://support.microsoft.com/de-de/excel/show-different-calculations-in-pivottable-value-fields)).

  Ziehst du `netto` zweimal in Werte, zeigt die eine Spalte die Summe und die andere dieselbe Summe als Prozent – Betrag und Anteil nebeneinander.

  ## Datumsgruppen, Datenschnitte und Zeitachsen

  Ziehst du `bestelldatum` in Zeilen oder Spalten, gruppiert Excel die Datumswerte automatisch nach Zeiträumen wie Jahren, Quartalen und Monaten. Selbst steuerst du das per Rechtsklick › Gruppieren: Im Dialog wählst du unter *Nach* etwa Tage, Monate, Quartale oder Jahre ([Microsoft: Gruppieren in PivotTables](https://support.microsoft.com/de-de/excel/get-started/group-or-ungroup-data-in-a-pivottable)). Wähle für Monatsberichte immer **Monate und Jahre** zusammen. Mit Monaten allein landen März 2025 und März 2026 in derselben Gruppe „Mär“, und der Vorjahresvergleich ist eine Summe über zwei Jahre.

  **Datenschnitte** (englisch *slicers*) sind Schaltflächen zum Filtern, die den aktuellen Filter sichtbar machen. Klick in die PivotTable, dann Einfügen › Datenschnitt, und wähle ein Feld wie `kanal` oder `status`; auf Tabellen funktionieren Datenschnitte genauso. Eine **Zeitachse** ist ein Filter für Datumsfelder mit Schieberegler nach Jahren, Quartalen, Monaten oder Tagen, eingefügt über PivotTable-Analyse › Zeitachse einfügen. Über **Berichtsverbindungen** steuert ein Datenschnitt oder eine Zeitachse mehrere PivotTables gleichzeitig, sofern sie dieselbe Datenquelle verwenden ([Microsoft: Datenschnitte](https://support.microsoft.com/de-de/excel/get-started/use-slicers-to-filter-data)).

  > [!PRAXIS] Das Montagsblatt
  > Bei Bohnenwerk liegen auf dem Blatt `Montag` drei PivotTables auf derselben Quelle `Umsatz`: Umsatz je Region und Kanal, Top-Produkte, Umsatz je Woche. Eine Zeitachse und ein Datenschnitt `status` sind über Berichtsverbindungen mit allen dreien verbunden. In der Besprechung klickt die Vertriebsleitung selbst auf „B2B“ oder zieht die Zeitachse auf das Quartal, und niemand muss eine neue Auswertung bauen.

  ## Aktualisieren, Quellbereich und PIVOTDATENZUORDNEN

  Eine PivotTable rechnet nicht auf den Zellen, sondern auf einer Momentaufnahme der Quelle, dem **Pivot-Cache**. Neue oder geänderte Zeilen erscheinen erst nach dem Aktualisieren: PivotTable-Analyse › Aktualisieren (Alt+F5) für eine PivotTable, Daten › Alle aktualisieren (Strg+Alt+F5) für alle PivotTables und Abfragen der Mappe. Unter PivotTable-Analyse › Optionen sorgt auf der Registerkarte Daten das Kontrollkästchen „Daten beim Öffnen der Datei aktualisieren“ dafür, dass niemand einen alten Stand sieht ([Microsoft: PivotTable-Daten aktualisieren](https://support.microsoft.com/de-de/excel/refresh-pivottable-data)). Neuere Versionen von Microsoft 365 aktualisieren PivotTables, deren Quelle in derselben Mappe liegt, auch automatisch. Im Bericht bleibt Alle aktualisieren trotzdem ein fester Schritt, weil das für Abfragen und externe Quellen nicht gilt und ältere Versionen es nicht können.

  Der klassische Fehler steckt in der Quelle. Wurde die PivotTable aus einem normalen Bereich erstellt, steht dort ein fester Bezug wie `Daten!$A$1:$K$1200`. Die April-Zeilen ab Zeile 1201 liegen außerhalb, und Aktualisieren hilft nicht: Die PivotTable liest weiter bis Zeile 1200. Unter PivotTable-Analyse › Datenquelle ändern siehst und korrigierst du die Quelle ([Microsoft: Quelldaten ändern](https://support.microsoft.com/de-de/excel/change-the-source-data-for-a-pivottable)). Trag dort den Tabellennamen `Umsatz` ein, ab dann wächst sie mit.

  > [!WARNING] Ein alter Stand sieht aus wie ein richtiger
  > Eine PivotTable, die nicht aktualisiert wurde oder deren Quelle zu kurz ist, zeigt Zahlen ohne jeden Hinweis. Mach Alle aktualisieren zum festen Schritt der Routine und vergleiche die Pivot-Summe mit einer Kontrollzelle auf der Quelle.

  Die Kontrollzelle holt den Wert aus der PivotTable mit `PIVOTDATENZUORDNEN` (englisch `GETPIVOTDATA`). Tippst du `=` und klickst auf eine Pivotzelle, schreibt Excel nicht `=C5`, sondern eine solche Formel ([Microsoft: PIVOTDATENZUORDNEN](https://support.microsoft.com/de-de/excel/functions/getpivotdata-function)):

  ```excel
  =PIVOTDATENZUORDNEN("netto";Pivot!$A$3;"region";"Nord";"kanal";"B2B")
  =PIVOTDATENZUORDNEN("netto";Pivot!$A$3)-SUMMEWENNS(Umsatz[netto];Umsatz[status];"bezahlt")
  ```

  Das erste Argument ist das Wertfeld – der Quellname `netto` oder die Beschriftung `Summe von netto` –, das zweite irgendeine Zelle der PivotTable, danach folgen Paare aus Feld und Element. Ohne Paare liefert die Funktion das Gesamtergebnis; die zweite Zeile ist deshalb eine Abstimmung, die 0 ergeben muss. Die Formel beschreibt, *welchen* Wert sie will, nicht *wo* er steht. Stellt jemand das Layout um oder kommt eine Region dazu, rutscht Nord/B2B an eine andere Stelle, und `=C5` zeigte still eine andere Zahl. Ist das beschriebene Element gerade nicht sichtbar, etwa weil ein Datenschnitt es ausfiltert, liefert die Funktion `#BEZUG!`. Das automatische Erzeugen schaltest du unter PivotTable-Analyse › Optionen mit „GetPivotData generieren“ ein und aus.

  ## Pivot als Formel und als SQL

  In Microsoft 365 gibt es die PivotTable auch als Formel. `GRUPPIERENNACH` (englisch `GROUPBY`) gruppiert nach Zeilenfeldern, `PIVOTMIT` (englisch `PIVOTBY`) zusätzlich nach Spaltenfeldern ([Microsoft: GRUPPIERENNACH](https://support.microsoft.com/de-de/excel/functions/groupby-function)):

  ```excel
  =GRUPPIERENNACH(Umsatz[region];Umsatz[netto];SUMME)
  =PIVOTMIT(Umsatz[region];Umsatz[kanal];Umsatz[netto];SUMME)
  =GRUPPIERENNACH(Umsatz[region];Umsatz[netto];PROZENTVON;;;;Umsatz[status]="bezahlt")
  ```

  Das dritte beziehungsweise vierte Argument ist die Funktion selbst, ohne Klammern. `PROZENTVON` (englisch `PERCENTOF`) liefert Anteile wie „% des Gesamtergebnisses“, und das siebte Argument von `GRUPPIERENNACH` filtert Zeilen, hier nur bezahlte. Die Ergebnisse laufen über, rechnen bei jeder Änderung neu und brauchen kein Aktualisieren. Dafür fehlen Datenschnitte, Details per Doppelklick und das Umstellen per Ziehen, und Excel-Versionen ohne Microsoft 365 kennen die Funktionen nicht.

  Die Formeln zeigen, was eine PivotTable im Kern tut, und genau das schreibst du in SQL aus: Die Zeilenbeschriftungen sind `GROUP BY`, jede Spalte der Kreuztabelle ist eine bedingte Summe mit `CASE` ([SQLite: CASE](https://www.sqlite.org/lang_expr.html#the_case_expression)), der Filter ist `WHERE`. Der Block läuft direkt hier:

  ```sql run
  CREATE TABLE umsatz (bestellung_id INTEGER, region TEXT, kanal TEXT, status TEXT, netto REAL);
  INSERT INTO umsatz VALUES
    (5001, 'Nord', 'Shop', 'bezahlt', 17.80),
    (5002, 'West', 'B2B', 'bezahlt', 250.80),
    (5002, 'West', 'B2B', 'bezahlt', 99.75),
    (5003, 'Süd', 'Shop', 'storniert', 39.00),
    (5004, 'Nord', 'B2B', 'bezahlt', 156.00),
    (5005, 'Nord', 'Shop', 'bezahlt', 34.20);

  -- lange Form: eine Zeile je Region und Kanal
  SELECT region, kanal, ROUND(SUM(netto), 2) AS umsatz
  FROM umsatz
  WHERE status = 'bezahlt'
  GROUP BY region, kanal
  ORDER BY region, kanal;

  -- breite Form wie in der PivotTable: ein Kanal je Spalte
  SELECT region,
         ROUND(SUM(CASE WHEN kanal = 'B2B' THEN netto END), 2) AS b2b,
         ROUND(SUM(CASE WHEN kanal = 'Shop' THEN netto END), 2) AS shop,
         ROUND(SUM(netto), 2) AS gesamt
  FROM umsatz
  WHERE status = 'bezahlt'
  GROUP BY region
  ORDER BY region;
  ```

  Die erste Abfrage liefert die **lange Form**, eine Zeile je Region und Kanal. Die zweite dreht sie in die **breite Form** der PivotTable. `CASE` ohne `ELSE` ergibt für nicht passende Zeilen `NULL`, und `SUM` über lauter `NULL` bleibt `NULL` – das leere Feld West/Shop wie in der PivotTable. Mit `ELSE 0` stünde dort 0.

  „% des Gesamtergebnisses“ ist in SQL eine Division durch die Gesamtsumme aus einer Unterabfrage. Für bedingte Summen kennen SQLite und PostgreSQL außerdem die Kurzform `SUM(netto) FILTER (WHERE kanal = 'B2B')` ([SQLite: Aggregatfunktionen](https://www.sqlite.org/lang_aggfunc.html), [PostgreSQL: Aggregate Expressions](https://www.postgresql.org/docs/current/sql-expressions.html#SYNTAX-AGGREGATES)):

  ```sql run
  CREATE TABLE umsatz (region TEXT, kanal TEXT, status TEXT, menge INTEGER, netto REAL);
  INSERT INTO umsatz VALUES
    ('Nord', 'Shop', 'bezahlt', 2, 17.80),
    ('West', 'B2B', 'bezahlt', 22, 350.55),
    ('Süd', 'Shop', 'storniert', 1, 39.00),
    ('Nord', 'B2B', 'bezahlt', 20, 156.00),
    ('Nord', 'Shop', 'bezahlt', 3, 34.20);

  SELECT region,
         ROUND(SUM(netto), 2) AS umsatz,
         ROUND(100.0 * SUM(netto) / (SELECT SUM(netto) FROM umsatz WHERE status = 'bezahlt'), 1) AS anteil_prozent,
         SUM(menge) FILTER (WHERE kanal = 'B2B') AS b2b_stueck
  FROM umsatz
  WHERE status = 'bezahlt'
  GROUP BY region
  ORDER BY region;
  ```

  Die `100.0` statt `100` sorgt dafür, dass bei ganzzahligen Spalten wie `menge` nicht ganzzahlig geteilt wird. Ein Unterschied bleibt: Die PivotTable legt ihre Spalten aus den Daten an. Kommt ab Mai der Kanal „Marktplatz“ dazu, erscheint nach dem Aktualisieren eine neue Spalte. Die SQL-Abfrage kennt nur die Spalten, die jemand hingeschrieben hat; Marktplatz steckt dort nur in `gesamt`. Für Berichte mit festem Aufbau ist das ein Vorteil, für explorative Auswertungen ein Nachteil.

  > [!MERKE]
  > PivotTable in SQL: Filter und Datenschnitte sind `WHERE`, das Zeilenfeld ist `GROUP BY`, jedes Element des Spaltenfelds ist eine eigene bedingte Aggregation `SUM(CASE WHEN … THEN wert END)`, und die Aggregatfunktion kommt aus den Wertfeldeinstellungen.

  **Datenmodell.** Steht die Kategorie nicht im Umsatz, sondern in der Tabelle `Produkte`, musst du sie nicht per `XVERWEIS` in jede Zeile holen. Setzt du beim Erstellen der PivotTable das Häkchen „Diese Daten zum Datenmodell hinzufügen“, verbindet Excel mehrere Tabellen über Beziehungen, etwa `Umsatz[produkt_id]` mit `Produkte[produkt_id]`, und die PivotTable nutzt Felder aus beiden – wie ein Join ([Microsoft: Datenmodell erstellen](https://support.microsoft.com/de-de/excel/create-a-data-model-in-excel)). Das Datenmodell schaltet außerdem „Diskrete Anzahl“ frei. Wie Joins funktionieren, zeigt [Joins und Datenmodelle abfragen](/data/sql-joins).

  > [!INTERVIEW] „Die PivotTable zeigt einen anderen Umsatz als die Summe unter der Tabelle. Woran kann das liegen?“
  > Ich prüfe vier Dinge. Ist die PivotTable aktualisiert, und umfasst ihre Quelle alle Zeilen – Tabellenname statt festem Bereich? Welche Filter, Datenschnitte und Zeitachsen sind aktiv, und rechnet die Summe unter der Tabelle mit `SUMME` oder mit `TEILERGEBNIS`, also ohne oder mit Tabellenfilter? Ist das Wertfeld wirklich eine Summe und keine Anzahl? Danach stimme ich mit einer Kontrollzelle ab: `PIVOTDATENZUORDNEN` gegen `SUMMEWENNS` mit denselben Bedingungen, Differenz 0.

  ## Häufige Fehler

  - **Quelle als fester Bereich.** Neue Zeilen fehlen auch nach dem Aktualisieren. Unter Datenquelle ändern den Tabellennamen eintragen.
  - **Nicht aktualisiert.** Die PivotTable zeigt den alten Stand. Alle aktualisieren gehört in die Routine, „Daten beim Öffnen der Datei aktualisieren“ hilft zusätzlich.
  - **Anzahl statt Summe.** Kleine ganze Zahlen statt Euro: In der Wertspalte steckt Text. Daten bereinigen, dann in den Wertfeldeinstellungen auf Summe stellen.
  - **Positionen als Bestellungen gezählt.** „Anzahl“ zählt Zeilen. Für verschiedene Bestellungen „Diskrete Anzahl“ im Datenmodell oder `COUNT(DISTINCT …)` in SQL.
  - **Nur nach Monaten gruppiert.** Mehrere Jahre fallen zusammen. Monate und Jahre gemeinsam gruppieren.
  - **`=C5` statt `PIVOTDATENZUORDNEN`.** Nach einer Layoutänderung zeigt der Bericht eine andere Zelle.
  - **Strukturierten Verweis nach rechts gezogen.** Aus `Umsatz[netto]` wird die Nachbarspalte. Formeln mit Strg+C und Strg+V kopieren statt nach rechts ausfüllen.
  - **Kontrollsumme ohne Filter.** `SUMME` über die ganze Spalte, während die PivotTable nur bezahlte Zeilen zeigt, meldet eine Abweichung, die keine ist. Die Kontrolle braucht dieselben Bedingungen wie die PivotTable.

  ## Zusammenfassung

  - Strg+T macht aus einem Bereich eine Tabelle mit Namen, die mitwächst. Berechnete Spalten haben eine Formel für alle Zeilen.
  - `Umsatz[netto]` meint die Spalte, `[@menge]` den Wert der eigenen Zeile. Kopieren lässt strukturierte Verweise unverändert, Ausfüllen nach rechts verschiebt sie.
  - `TEILERGEBNIS` lässt gefilterte Zeilen weg, `SUMME` nicht. Die Nummern 101 bis 111 ignorieren auch von Hand ausgeblendete Zeilen.
  - Jede Pivotzelle aggregiert die Quellzeilen, die zu Zeile, Spalte und Filtern passen. Leer heißt „keine Zeile“, nicht 0.
  - Wertfeldeinstellungen: zusammenfassen nach (Summe, Anzahl, …) und anzeigen als (% des Gesamtergebnisses, Differenz von, …).
  - Quelle ist der Tabellenname, Aktualisieren gehört zur Routine, eine Kontrollzelle mit `PIVOTDATENZUORDNEN` stimmt ab.
  - `GRUPPIERENNACH` und `PIVOTMIT` sind Pivots als Formel, ohne Aktualisieren, nur in Microsoft 365.
  - In SQL ist eine Pivot `WHERE` + `GROUP BY` + `SUM(CASE WHEN …)` je Spalte. Neue Spaltenelemente muss dort jemand ergänzen.
exercises:
  - id: april-fehlt
    type: choice
    title: Der April fehlt
    prompt: |
      Montagmorgen: Du hast die April-Zeilen aus dem Export unter die bisherigen Daten kopiert, aber die PivotTable zeigt für April nichts. Welche Ursachen kommen in Frage?
    options:
      - text: Die PivotTable wurde seit dem Einfügen nicht aktualisiert.
        correct: true
        why: Die PivotTable rechnet auf ihrem Pivot-Cache. Neue Zeilen kommen erst mit Aktualisieren hinein.
      - text: Die Quelle ist ein fester Bereich wie `Daten!$A$1:$K$1200`, und die April-Zeilen stehen darunter.
        correct: true
        why: Dann hilft auch Aktualisieren nicht. Die Quelle muss auf den Tabellennamen umgestellt werden.
      - text: Eine Zeitachse oder ein Datenschnitt filtert noch auf März.
        correct: true
        why: Filter wirken vor dem Gruppieren. Die April-Zeilen sind da, aber ausgefiltert.
      - text: PivotTables zeigen einen neuen Monat erst, wenn man die Datumsgruppierung aufhebt.
        correct: false
        why: Neue Datumswerte fallen beim Aktualisieren in die bestehenden Gruppen; ein neuer Monat wird ein neues Element.
      - text: Die Quelle ist die Tabelle `Umsatz`, und Tabellen wachsen nicht, wenn man Zeilen direkt darunter einfügt.
        correct: false
        why: Genau das tun Tabellen. Eine Tabelle als Quelle ist die Lösung für die Quellbereich-Falle, nicht ihre Ursache.
    explanation: |
      Zwischen neuen Daten und sichtbarer Zahl liegen drei Stationen: die Quelle (umfasst sie die neuen Zeilen?), der Cache (wurde aktualisiert?) und die Filter (lassen sie April durch?). Jede kann den April verschlucken, ohne dass Excel warnt. Eine Tabelle als Quelle erledigt die erste Station dauerhaft, Alle aktualisieren die zweite, ein Blick auf Datenschnitte und Zeitachse die dritte.
    resources:
      - title: Microsoft Support · PivotTable-Daten aktualisieren
        url: https://support.microsoft.com/de-de/excel/refresh-pivottable-data
      - title: Microsoft Support · Quelldaten einer PivotTable ändern
        url: https://support.microsoft.com/de-de/excel/change-the-source-data-for-a-pivottable

  - id: pivot-rechnet
    type: order
    title: Wie eine PivotTable rechnet
    prompt: |
      Eine PivotTable hat die Zeilen `region`, die Spalten `kanal`, die Werte „Summe von netto“, angezeigt als „% des Gesamtergebnisses“, und einen Datenschnitt `status` = bezahlt. Bring die Schritte in die Reihenfolge, in der sie beim Aktualisieren ihr Ergebnis bildet.
    lang: text
    lines: |
      Excel liest die Quelle Umsatz in den Pivot-Cache.
      Datenschnitte, Zeitachsen und Filter entfernen die Zeilen, die nicht passen.
      Die übrigen Zeilen werden nach den Elementen von Zeilen- und Spaltenfeld gruppiert.
      Je Gruppe wird netto summiert, dazu die Gesamtergebnisse.
      „Werte anzeigen als“ teilt jede Summe durch das Gesamtergebnis.
    explanation: |
      Ohne Cache gibt es nichts zu rechnen, deshalb steht das Lesen der Quelle am Anfang – und deshalb sieht die PivotTable neue Zeilen erst nach dem Aktualisieren. Filter wirken vor dem Gruppieren; in SQL ist das `WHERE`. Danach bildet das Gruppieren nach Zeilen- und Spaltenfeld die Zellen (`GROUP BY` plus je Spaltenelement ein `CASE`), und die Zusammenfassung füllt sie (`SUM`). „Werte anzeigen als“ arbeitet zuletzt auf den fertigen Summen; der Prozentwert bezieht sich deshalb auf das Gesamtergebnis der gefilterten Daten, nicht auf alle Zeilen der Quelle.
    resources:
      - title: Microsoft Support · Verschiedene Berechnungen in PivotTable-Wertfeldern
        url: https://support.microsoft.com/de-de/excel/show-different-calculations-in-pivottable-value-fields

  - id: teilergebnis-filter
    type: output
    title: Was zählt der Filter mit?
    prompt: |
      Die Tabelle `Umsatz`:

      | | A | B | C | D |
      | --- | --- | --- | --- | --- |
      | **1** | region | kanal | status | netto |
      | **2** | Nord | Shop | bezahlt | 42,00 |
      | **3** | Nord | B2B | bezahlt | 310,50 |
      | **4** | Süd | B2B | bezahlt | 205,00 |
      | **5** | West | Shop | bezahlt | 18,00 |
      | **6** | West | B2B | storniert | 96,00 |
      | **7** | Ost | Shop | bezahlt | 25,50 |

      Über die Filterschaltfläche von `kanal` ist nur „B2B“ ausgewählt, die Zeilen 2, 5 und 7 sind also ausgefiltert. Von Hand ist keine Zeile ausgeblendet. Die Formeln stehen auf dem Blatt `Kontrolle`. Was zeigen sie? Eine Zeile je Formel; `G3` ist eine ganze Zahl, alle anderen sind im Format `0,00` formatiert.
    lang: excel
    code: |
      G1: =SUMME(Umsatz[netto])
      G2: =TEILERGEBNIS(109;Umsatz[netto])
      G3: =TEILERGEBNIS(103;Umsatz[region])
      G4: =TEILERGEBNIS(9;Umsatz[netto])
      G5: =SUMMEWENNS(Umsatz[netto];Umsatz[kanal];"B2B";Umsatz[status];"bezahlt")
    expected: |
      697,00
      611,50
      3
      611,50
      515,50
    hints:
      - "`SUMME` kennt keine Filter, `TEILERGEBNIS` lässt ausgefilterte Zeilen immer weg."
      - Und `SUMMEWENNS`? Es prüft nur seine eigenen Bedingungen.
    explanation: |
      `SUMME` addiert alle sechs Beträge, der Filter ist ihr egal: 697,00. `TEILERGEBNIS` lässt ausgefilterte Zeilen immer weg und sieht nur die drei B2B-Zeilen: 310,50 + 205,00 + 96,00 = 611,50, und `103` zählt drei nicht leere Regionen. `9` und `109` unterscheiden sich nur bei Zeilen, die von Hand ausgeblendet sind – hier gibt es keine. `SUMMEWENNS` ignoriert den Filter ebenfalls und prüft stattdessen seine eigenen Bedingungen: Die stornierte West-Zeile fällt heraus, bleiben 515,50. Welche Summe richtig ist, hängt von der Frage ab; eine Kontrollzelle sollte die Bedingungen ausdrücklich nennen, statt vom gerade gesetzten Filter abzuhängen.
    resources:
      - title: Microsoft Support · TEILERGEBNIS
        url: https://support.microsoft.com/de-de/excel/functions/subtotal-function
      - title: Microsoft Support · Gesamtergebnisse in einer Excel-Tabelle
        url: https://support.microsoft.com/de-de/excel/get-started/total-the-data-in-an-excel-table

  - id: werte-anzeigen-als
    type: output
    title: Drei Prozent für dieselbe Zelle
    prompt: |
      Eine PivotTable mit Zeilen `region`, Spalten `kanal` und „Summe von netto“:

      | Summe von netto | B2B | Shop | Gesamtergebnis |
      | --- | --- | --- | --- |
      | Nord | 300,00 | 100,00 | 400,00 |
      | Süd | 100,00 | 100,00 | 200,00 |
      | West | 200,00 | 200,00 | 400,00 |
      | Gesamtergebnis | 600,00 | 400,00 | 1.000,00 |

      Du stellst unter Wertfeldeinstellungen › Werte anzeigen als nacheinander drei Berechnungen ein. Was zeigt jeweils die Zelle **Nord/B2B**?

      1. % des Gesamtergebnisses
      2. % des Spaltengesamtergebnisses
      3. % des Zeilengesamtergebnisses

      Eine Zeile je Einstellung, mit zwei Nachkommastellen und Prozentzeichen wie Excel, etwa `12,34 %`.
    lang: excel
    code: |
      Werte anzeigen als: % des Gesamtergebnisses
      Werte anzeigen als: % des Spaltengesamtergebnisses
      Werte anzeigen als: % des Zeilengesamtergebnisses
    expected: |
      30,00 %
      50,00 %
      75,00 %
    accept:
      - |
        30,00%
        50,00%
        75,00%
    explanation: |
      Alle drei teilen denselben Wert 300,00, nur durch verschiedene Summen. Das Gesamtergebnis rechts unten ist 1.000,00, also 30 %: Nord-B2B ist knapp ein Drittel des ganzen Umsatzes. Das Spaltengesamtergebnis von B2B ist 600,00, also 50 %: Die Hälfte des B2B-Geschäfts kommt aus dem Norden. Das Zeilengesamtergebnis von Nord ist 400,00, also 75 %: Drei Viertel des Nord-Umsatzes sind B2B. Welche Einstellung passt, entscheidet die Frage – „Wer trägt den B2B-Umsatz?“ braucht die Spalte, „Wie B2B-lastig ist der Norden?“ die Zeile.
    resources:
      - title: Microsoft Support · Verschiedene Berechnungen in PivotTable-Wertfeldern
        url: https://support.microsoft.com/de-de/excel/show-different-calculations-in-pivottable-value-fields

  - id: pivot-in-sql-vorhersagen
    type: output
    title: Leere Zelle oder 0?
    prompt: |
      Die Abfrage baut eine kleine Pivot in SQL. Was gibt sie aus? Die Ausgabe entspricht der `sqlite3`-Kommandozeile: Werte durch `|` getrennt, keine Kopfzeile, `NULL` als leerer Wert, Kommazahlen mit Punkt (`3.0`, `12.5`).
    lang: sql
    code: |
      CREATE TABLE umsatz (region TEXT, kanal TEXT, status TEXT, netto REAL);
      INSERT INTO umsatz VALUES
        ('Nord', 'Shop', 'bezahlt', 42.0),
        ('Nord', 'B2B', 'bezahlt', 310.5),
        ('Nord', 'B2B', 'storniert', 120.0),
        ('Süd', 'Shop', 'bezahlt', 18.5),
        ('Süd', 'Shop', 'bezahlt', 30.0),
        ('West', 'B2B', 'bezahlt', 96.0);

      SELECT region,
             SUM(CASE WHEN kanal = 'B2B' THEN netto END) AS b2b,
             SUM(CASE WHEN kanal = 'Shop' THEN netto ELSE 0 END) AS shop,
             COUNT(*) AS positionen
      FROM umsatz
      WHERE status = 'bezahlt'
      GROUP BY region
      ORDER BY region;
    expected: |
      Nord|310.5|42.0|2
      Süd||48.5|2
      West|96.0|0|1
    hints:
      - Was liefert `CASE` ohne `ELSE` für eine Zeile, auf die keine Bedingung passt?
      - "`SUM` über lauter ganzzahlige Nullen ergibt eine ganze Zahl."
    explanation: |
      `WHERE` entfernt die stornierte Nord-Zeile vor dem Gruppieren, deshalb zählt Nord zwei Positionen und B2B nur 310,5. Süd hat keine B2B-Zeile: `CASE` ohne `ELSE` liefert für jede Süd-Zeile `NULL`, und `SUM` über lauter `NULL` bleibt `NULL` – die leere Zelle, wie in einer PivotTable. West hat keine Shop-Zeile, aber `ELSE 0` liefert für die B2B-Zeile eine 0, und die Summe ist 0. Weil `0` eine ganze Zahl ist, zeigt SQLite `0`, während Nord mit `0 + 42.0` bei `42.0` landet. Für Berichte heißt das: Ob „kein Umsatz“ als leer oder als 0 erscheint, entscheidest du mit `ELSE`.
    resources:
      - title: SQLite · The CASE expression
        url: https://www.sqlite.org/lang_expr.html#the_case_expression
      - title: SQLite · Aggregate Functions
        url: https://www.sqlite.org/lang_aggfunc.html

  - id: tabellenformeln
    type: gap
    title: Formeln in und neben der Tabelle
    prompt: |
      Drei Formeln rund um die Tabelle `Umsatz`. Die erste ist die berechnete Spalte `netto`: Menge mal Einzelpreis mal (1 − Rabatt) der aktuellen Zeile. Die zweite steht in der Ergebniszeile unter `netto`, genau so, wie Excel sie erzeugt, wenn du dort „Summe“ auswählst. Die dritte steht auf dem Blatt `Bericht` und summiert den B2B-Umsatz.
    lang: excel
    code: |
      =⟦[@menge]⟧*[@einzelpreis]*(1-[@rabatt])
      =TEILERGEBNIS(⟦109⟧;[netto])
      =SUMMEWENNS(⟦Umsatz[netto]⟧;⟦Umsatz[kanal]⟧;"B2B")
    gaps:
      - label: Menge der aktuellen Zeile
        hint: Innerhalb der Tabelle steht `@` für „diese Zeile“.
        accept: ["[@[menge]]", "Umsatz[@menge]", "Umsatz[@[menge]]", "Umsatz[[#Diese Zeile];[menge]]"]
      - label: Funktionsnummer
        hint: Summe, und von Hand ausgeblendete Zeilen sollen nicht mitzählen.
      - label: Summenbereich
        hint: Außerhalb der Tabelle gehört der Tabellenname vor den Spaltennamen.
      - label: Kriterienbereich
        hint: Die Spalte, in der „B2B“ steht.
    explanation: |
      `[@menge]` meint den Wert derselben Zeile; weil die Formel in einer berechneten Spalte steht, gilt sie für jede Zeile, auch für neue. In der Ergebniszeile erzeugt Excel für „Summe“ `TEILERGEBNIS(109;…)`: 9 steht für Summe, die Hunderterstelle lässt zusätzlich von Hand ausgeblendete Zeilen weg, gefilterte Zeilen fallen ohnehin heraus. Auf einem anderen Blatt muss der Verweis voll qualifiziert sein, also `Umsatz[netto]` und `Umsatz[kanal]`; ein nacktes `[netto]` funktioniert nur innerhalb der Tabelle.
    resources:
      - title: Microsoft Support · Strukturierte Verweise für Excel-Tabellen
        url: https://support.microsoft.com/de-de/excel/using-structured-references-with-excel-tables
      - title: Microsoft Support · Berechnete Spalten in einer Excel-Tabelle
        url: https://support.microsoft.com/de-de/excel/use-calculated-columns-in-an-excel-table

  - id: pivot-formeln
    type: gap
    title: Pivot-Werte per Formel
    prompt: |
      Drei Formeln auf dem Blatt `Bericht`. Die erste holt den B2B-Umsatz der Region Nord aus der PivotTable, die auf dem Blatt `Pivot` in `A3` beginnt – so, dass sie auch nach einer Layoutänderung den richtigen Wert findet. Die zweite liefert den Umsatz je Region als übergelaufene Formel. Die dritte ordnet die Regionen in Zeilen und die Kanäle in Spalten an.
    lang: excel
    code: |
      =⟦PIVOTDATENZUORDNEN⟧("netto";Pivot!$A$3;"region";⟦"Nord"⟧;"kanal";"B2B")
      =GRUPPIERENNACH(Umsatz[region];Umsatz[netto];⟦SUMME⟧)
      =PIVOTMIT(Umsatz[region];⟦Umsatz[kanal]⟧;Umsatz[netto];SUMME)
    gaps:
      - label: Wert aus der PivotTable
        hint: Die Funktion, die Excel erzeugt, wenn du `=` tippst und auf eine Pivotzelle klickst (englisch `GETPIVOTDATA`).
      - label: Element
        hint: Elementnamen, die keine Zahlen oder Datumswerte sind, stehen in Anführungszeichen.
      - label: Aggregation
        hint: Die Funktion selbst, ohne Klammern.
      - label: Spaltenfelder
        hint: Das zweite Argument von `PIVOTMIT` bestimmt die Spalten.
    explanation: |
      `PIVOTDATENZUORDNEN` beschreibt den Wert über Wertfeld und Feld-Element-Paare, nicht über seine Position; deshalb überlebt die Formel ein umgestelltes Layout. Ist Nord gerade ausgefiltert, liefert sie `#BEZUG!`. `GRUPPIERENNACH` und `PIVOTMIT` bekommen die Aggregation als Funktion ohne Klammern, ein sogenanntes eta-reduziertes Lambda; `MITTELWERT` oder `ANZAHL` gingen genauso. Bei `PIVOTMIT` folgen auf die Zeilenfelder die Spaltenfelder und dann die Werte. Beide Funktionen gibt es nur in Microsoft 365.
    resources:
      - title: Microsoft Support · PIVOTDATENZUORDNEN
        url: https://support.microsoft.com/de-de/excel/functions/getpivotdata-function
      - title: Microsoft Support · GRUPPIERENNACH-Funktion
        url: https://support.microsoft.com/de-de/excel/functions/groupby-function
      - title: Microsoft Support · PIVOTMIT-Funktion
        url: https://support.microsoft.com/de-de/excel/functions/pivotby-function

  - id: region-mal-kanal
    type: sql
    title: Die PivotTable in SQL
    prompt: |
      Baue die PivotTable „Nettoumsatz je Region, Kanäle als Spalten“ in SQL nach. Nur Positionen mit `status = 'bezahlt'`; Nettoumsatz einer Position = `menge * einzelpreis * (1 - rabatt)`.

      Spalten: `region`, `shop`, `b2b`, `gesamt`, jeweils auf zwei Nachkommastellen gerundet. Eine Region ohne Umsatz in einem Kanal zeigt dort 0. Sortiert nach `region` aufsteigend.
    schema: &umsatz_schema |
      CREATE TABLE umsatz (
        bestellung_id INTEGER,
        position INTEGER,
        bestelldatum TEXT,
        region TEXT,
        kanal TEXT,
        status TEXT,
        kategorie TEXT,
        menge INTEGER,
        einzelpreis REAL,
        rabatt REAL
      );
      INSERT INTO umsatz VALUES
        (5001, 1, '2026-03-02', 'Nord', 'Shop', 'bezahlt', 'Espresso', 2, 8.90, 0),
        (5002, 1, '2026-03-05', 'West', 'B2B', 'bezahlt', 'Espresso', 12, 22.00, 0.05),
        (5002, 2, '2026-03-05', 'West', 'B2B', 'bezahlt', 'Filter', 10, 10.50, 0.05),
        (5002, 3, '2026-03-05', 'West', 'B2B', 'bezahlt', 'Espresso', 6, 24.50, 0.05),
        (5003, 1, '2026-03-11', 'Süd', 'Shop', 'storniert', 'Zubehör', 1, 39.00, 0),
        (5004, 1, '2026-03-18', 'Nord', 'B2B', 'bezahlt', 'Espresso', 20, 7.80, 0.1),
        (5004, 2, '2026-03-18', 'Nord', 'B2B', 'bezahlt', 'Zubehör', 2, 39.00, 0.1),
        (5004, 3, '2026-03-18', 'Nord', 'B2B', 'bezahlt', 'Espresso', 10, 8.90, 0.1),
        (5005, 1, '2026-03-31', 'Nord', 'Shop', 'bezahlt', 'Filter', 3, 11.40, 0),
        (5006, 1, '2026-03-20', 'Süd', 'Shop', 'bezahlt', 'Espresso', 1, 8.90, 0),
        (5006, 2, '2026-03-20', 'Süd', 'Shop', 'bezahlt', 'Zubehör', 1, 14.90, 0),
        (5007, 1, '2026-03-24', 'Ost', 'B2B', 'storniert', 'Filter', 30, 10.50, 0.1),
        (5008, 1, '2026-03-26', 'West', 'Shop', 'bezahlt', 'Filter', 4, 11.40, 0),
        (5009, 1, '2026-03-27', 'West', 'B2B', 'retourniert', 'Espresso', 5, 22.00, 0.05);
    starter: |
      SELECT region,
             kanal,
             ROUND(SUM(menge * einzelpreis * (1 - rabatt)), 2) AS umsatz
      FROM umsatz
      WHERE status = 'bezahlt'
      GROUP BY region, kanal
      ORDER BY region;
    solution: |
      SELECT region,
             ROUND(SUM(CASE WHEN kanal = 'Shop' THEN menge * einzelpreis * (1 - rabatt) ELSE 0 END), 2) AS shop,
             ROUND(SUM(CASE WHEN kanal = 'B2B' THEN menge * einzelpreis * (1 - rabatt) ELSE 0 END), 2) AS b2b,
             ROUND(SUM(menge * einzelpreis * (1 - rabatt)), 2) AS gesamt
      FROM umsatz
      WHERE status = 'bezahlt'
      GROUP BY region
      ORDER BY region;
    ordered: true
    hints:
      - Der Startcode liefert die lange Form. Gruppiere nur noch nach `region`.
      - Je Kanal eine Spalte mit `SUM(CASE WHEN kanal = '…' THEN … ELSE 0 END)`.
      - "`ELSE 0` macht aus der leeren Pivotzelle eine 0; `ROUND(…, 2)` gehört um jede Summe."
    explanation: |
      Die lange Form hat eine Zeile je Region und Kanal. Für die breite Form gruppierst du nur nach dem Zeilenfeld `region` und baust je Element des Spaltenfelds eine bedingte Summe: `CASE` gibt den Betrag nur für Zeilen des passenden Kanals weiter. `ELSE 0` sorgt dafür, dass Süd im B2B eine 0 statt `NULL` zeigt. `WHERE` wirkt vor dem Gruppieren wie ein Datenschnitt, deshalb erscheint Ost mit seiner einzigen, stornierten Bestellung gar nicht. `gesamt` ist die Summe ohne Bedingung, also die Spalte Gesamtergebnis der PivotTable.
    resources:
      - title: SQLite · The CASE expression
        url: https://www.sqlite.org/lang_expr.html#the_case_expression
      - title: SQLite · Aggregate Functions
        url: https://www.sqlite.org/lang_aggfunc.html

  - id: positionen-oder-bestellungen
    type: sql
    title: Anzahl oder Diskrete Anzahl?
    prompt: |
      Die Vertriebsleitung fragt, wie viele Bestellungen je Kategorie eingegangen sind. Eine PivotTable mit „Anzahl von bestellung_id“ zählt Zeilen, also Positionen. Liefere je `kategorie` für bezahlte Positionen drei Zahlen:

      - `positionen`: Anzahl der Zeilen,
      - `bestellungen`: Anzahl verschiedener `bestellung_id`,
      - `b2b_bestellungen`: Anzahl verschiedener `bestellung_id` im Kanal B2B.

      Spalten `kategorie`, `positionen`, `bestellungen`, `b2b_bestellungen`. Die Reihenfolge der Zeilen ist egal.
    schema: *umsatz_schema
    starter: |
      SELECT kategorie,
             COUNT(*) AS positionen,
             COUNT(bestellung_id) AS bestellungen
      FROM umsatz
      WHERE status = 'bezahlt'
      GROUP BY kategorie;
    solution: |
      SELECT kategorie,
             COUNT(*) AS positionen,
             COUNT(DISTINCT bestellung_id) AS bestellungen,
             COUNT(DISTINCT CASE WHEN kanal = 'B2B' THEN bestellung_id END) AS b2b_bestellungen
      FROM umsatz
      WHERE status = 'bezahlt'
      GROUP BY kategorie;
    hints:
      - "`COUNT(spalte)` zählt nicht leere Werte, `COUNT(DISTINCT spalte)` verschiedene."
      - Für B2B brauchst du eine bedingte Anzahl – ein `CASE` innerhalb von `COUNT(DISTINCT …)`.
      - "Vorsicht mit `ELSE 0`: Die 0 wäre ein zusätzlicher verschiedener Wert."
    explanation: |
      `COUNT(*)` entspricht der Pivot-Funktion „Anzahl“: Bestellung 5002 hat zwei Espresso-Positionen und zählt doppelt. `COUNT(DISTINCT bestellung_id)` entspricht „Diskrete Anzahl“ aus dem Datenmodell. Für die bedingte Variante liefert `CASE` ohne `ELSE` für Shop-Zeilen `NULL`, und `COUNT` ignoriert `NULL`. Mit `ELSE 0` käme die 0 als weitere „Bestellung“ hinzu, sobald die Kategorie auch Shop-Positionen hat – Espresso zeigte dann 3 statt 2 B2B-Bestellungen.
    resources:
      - title: SQLite · count(X) und DISTINCT in Aggregaten
        url: https://www.sqlite.org/lang_aggfunc.html#count
      - title: Microsoft Support · Zusammenfassungsfunktion in PivotTables ändern
        url: https://support.microsoft.com/de-de/excel/change-the-summary-function-or-custom-calculation-for-a-field-in-a-pivottable

  - id: netto-falsch
    type: bug
    title: Der Rabatt wirkt wie ein paar Cent
    prompt: |
      Berechnete Spalten der Tabelle `Umsatz`, von links nach rechts: `vor_rabatt`, `netto`, `kategorie` und `monat`. Seit dem Umbau liegt die Pivot-Summe von `netto` fast genau auf Höhe von `vor_rabatt`. Eine Position mit 10 Paketen zu 12,50 und `rabatt` = 0,1 zeigt in `netto` 124,90 statt 112,50. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: excel
    code: |
      =[@menge]*[@einzelpreis]
      =[@vor_rabatt]*1-[@rabatt]
      =XVERWEIS([@produkt_id];Produkte[produkt_id];Produkte[kategorie];"fehlt")
      =TEXT([@bestelldatum];"JJJJ-MM")
    lines: [2]
    fix:
      - line: 2
        answers:
          - =[@vor_rabatt]*(1-[@rabatt])
          - =(1-[@rabatt])*[@vor_rabatt]
          - =[@vor_rabatt]-[@vor_rabatt]*[@rabatt]
          - =[@menge]*[@einzelpreis]*(1-[@rabatt])
    hints:
      - Rechne 125 × 1 − 0,1 von Hand nach.
      - Punkt vor Strich gilt auch in Excel.
    explanation: |
      Excel rechnet Punkt vor Strich: `[@vor_rabatt]*1-[@rabatt]` ist `125 − 0,1` und zieht den Rabattsatz als Betrag von 0,10 ab. Gemeint ist `125 × (1 − 0,1)`, die Klammer ist Pflicht. Weil die Formel eine berechnete Spalte ist, steckt der Fehler in jeder Zeile – und genauso reicht eine einzige Korrektur für alle Zeilen, auch für künftige. In der PivotTable fällt so ein Fehler nur auf, wenn jemand die Größenordnung prüft; eine Kontrollzelle „Summe `netto` ≤ Summe `vor_rabatt`“ hätte ihn nicht gefunden, eine Stichprobe mit einer bekannten Position schon.
    resources:
      - title: Microsoft Support · Berechnete Spalten in einer Excel-Tabelle
        url: https://support.microsoft.com/de-de/excel/use-calculated-columns-in-an-excel-table

  - id: anteil-reparieren
    type: sql
    title: Repariere den Anteil am Gesamtergebnis
    prompt: |
      Die Abfrage soll wie „% des Gesamtergebnisses“ in einer PivotTable den Anteil jeder Kategorie an den verkauften Paketen zeigen, nur bezahlte Positionen. Sie liefert aber 71, 23 und 4 – zusammen 98 statt rund 100. Repariere sie.

      Spalten `kategorie`, `stueck` (Summe von `menge`) und `anteil` (Prozent, auf eine Nachkommastelle gerundet), sortiert nach `anteil` absteigend.
    schema: *umsatz_schema
    starter: |
      SELECT kategorie,
             SUM(menge) AS stueck,
             SUM(menge) * 100 / (SELECT SUM(menge) FROM umsatz WHERE status = 'bezahlt') AS anteil
      FROM umsatz
      WHERE status = 'bezahlt'
      GROUP BY kategorie
      ORDER BY anteil DESC;
    solution: |
      SELECT kategorie,
             SUM(menge) AS stueck,
             ROUND(100.0 * SUM(menge) / (SELECT SUM(menge) FROM umsatz WHERE status = 'bezahlt'), 1) AS anteil
      FROM umsatz
      WHERE status = 'bezahlt'
      GROUP BY kategorie
      ORDER BY anteil DESC;
    ordered: true
    hints:
      - "`menge` ist `INTEGER`. Was ergibt in SQLite `5100 / 71`?"
      - Mach einen Operanden zur Kommazahl, etwa mit `100.0`, und runde mit `ROUND(…, 1)`.
    explanation: |
      `SUM(menge) * 100` und die Summe aus der Unterabfrage sind beide ganze Zahlen, und SQLite teilt zwei ganze Zahlen ganzzahlig: 5100 / 71 ergibt 71 statt 71,83. Deshalb fehlen in der Summe fast zwei Prozentpunkte. `100.0` macht den Zähler zur Kommazahl, `ROUND(…, 1)` rundet auf eine Stelle. Die Unterabfrage mit derselben `WHERE`-Bedingung ist das Gesamtergebnis – ohne diese Bedingung würden die stornierten Pakete im Nenner mitzählen und alle Anteile zu klein machen. PostgreSQL teilt ganze Zahlen genauso ganzzahlig; Excel und pandas tun es nicht.
    resources:
      - title: SQLite · Datatypes (Type Affinity)
        url: https://www.sqlite.org/datatype3.html
      - title: SQLite · Subquery Expressions
        url: https://www.sqlite.org/lang_expr.html#subquery_expressions

  - id: abstimmung-weicht-ab
    type: bug
    title: Die Abstimmung meldet jeden Montag eine Differenz
    prompt: |
      Das Kontrollblatt zur PivotTable auf dem Blatt `Pivot`, Zeile für Zeile in `B2` bis `B5`: Gesamtergebnis der PivotTable, Summe aus der Quelle, Differenz und Ampel. Die PivotTable ist aktualisiert, ihre Quelle ist die Tabelle `Umsatz`, und ein Datenschnitt steht dauerhaft auf `status` = bezahlt. Trotzdem zeigt `B5` jeden Montag „prüfen“, und die Differenz ist immer genau die Summe der stornierten und retournierten Positionen. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: excel
    code: |
      =PIVOTDATENZUORDNEN("netto";Pivot!$A$3)
      =SUMME(Umsatz[netto])
      =B2-B3
      =WENN(ABS(B4)<0,005;"OK";"prüfen")
    lines: [2]
    fix:
      - line: 2
        answers:
          - =SUMMEWENNS(Umsatz[netto];Umsatz[status];"bezahlt")
          - =SUMMEWENN(Umsatz[status];"bezahlt";Umsatz[netto])
    hints:
      - Welche Zeilen sieht die PivotTable, welche die Summe?
      - Die Kontrolle braucht dieselbe Bedingung wie der Datenschnitt.
    explanation: |
      Die PivotTable summiert nur die Zeilen, die der Datenschnitt durchlässt, `SUMME` dagegen alle Zeilen der Spalte. Die Differenz ist deshalb kein Fehler in den Daten, sondern ein Fehler in der Kontrolle: Sie vergleicht zwei verschiedene Fragen. Mit `SUMMEWENNS` und derselben Bedingung `status` = bezahlt beantworten beide dieselbe Frage, und die Differenz ist 0. Eine Kontrolle, die ständig falschen Alarm meldet, wird nach drei Wochen ignoriert – genau dann, wenn einmal die Quelle wirklich zu kurz ist.
    resources:
      - title: Microsoft Support · PIVOTDATENZUORDNEN
        url: https://support.microsoft.com/de-de/excel/functions/getpivotdata-function
      - title: Microsoft Support · SUMMEWENNS (Funktion)
        url: https://support.microsoft.com/de-de/excel/functions/sumifs-function

  - id: pivot-als-sql-erklaeren
    type: explain
    title: Zeigt die Abfrage dasselbe wie die PivotTable?
    prompt: |
      Deine PivotTable hat die Zeilen `region`, die Spalten `kanal` (B2B und Shop), die Werte „Summe von netto“, einen Datenschnitt `status` = bezahlt und eine Zeitachse auf März 2026. Die IT liefert diese Abfrage als Ersatz für den Montagsbericht. Die Vertriebsleitung fragt: Zeigt sie dasselbe? Und was passiert, wenn ab Mai der Kanal „Marktplatz“ dazukommt? Erkläre es Element für Element.
    lang: sql
    code: |
      SELECT region,
             SUM(CASE WHEN kanal = 'B2B' THEN netto END) AS b2b,
             SUM(CASE WHEN kanal = 'Shop' THEN netto END) AS shop,
             SUM(netto) AS gesamt
      FROM umsatz
      WHERE status = 'bezahlt'
        AND bestelldatum >= '2026-03-01' AND bestelldatum < '2026-04-01'
      GROUP BY region
      ORDER BY region;
    points:
      - "`GROUP BY region` entspricht dem Zeilenfeld: eine Ergebniszeile je Region, die nach dem Filtern noch Zeilen hat."
      - Jede `SUM(CASE WHEN kanal = … THEN netto END)`-Spalte entspricht einem Element des Spaltenfelds. Ohne `ELSE` bleibt eine Zelle ohne passende Zeilen `NULL`, wie die leere Pivotzelle.
      - "`WHERE` entspricht Datenschnitt und Zeitachse. Es wirkt vor dem Gruppieren, das Datumsintervall ist halboffen."
      - "`SUM(netto)` ohne `CASE` ist die Spalte Gesamtergebnis. Die Zeile Gesamtergebnis unten fehlt; sie bräuchte eine zweite Abfrage, etwa mit `UNION ALL`."
      - Ein neuer Kanal erscheint in der PivotTable nach dem Aktualisieren als neue Spalte. In der Abfrage steckt „Marktplatz“ nur in `gesamt`, bis jemand eine weitere `CASE`-Spalte ergänzt.
    explanation: |
      Für März zeigt die Abfrage dieselben Zahlen wie die PivotTable. `WHERE` übernimmt die Rolle von Datenschnitt und Zeitachse: Es entfernt stornierte Zeilen und alles außerhalb des Monats, bevor gruppiert wird; das Intervall `>= '2026-03-01'` und `< '2026-04-01'` erfasst auch Bestellungen vom Abend des 31. `GROUP BY region` bildet die Zeilen, die beiden `CASE`-Spalten bilden die Spalten B2B und Shop, und weil `ELSE` fehlt, bleibt eine Region ohne Shop-Umsatz leer wie in der PivotTable. `gesamt` ist die Spalte Gesamtergebnis; die Summenzeile darunter liefert die Abfrage nicht. Der wichtigste Unterschied zeigt sich im Mai: Die PivotTable legt ihre Spalten aus den Daten an und bekommt nach dem Aktualisieren eine Spalte „Marktplatz“. Die Abfrage hat feste Spalten, der Marktplatz-Umsatz steckt nur in `gesamt`, und `b2b + shop` ergibt nicht mehr `gesamt`. Eine Kontrolle genau dieser Gleichung würde das sofort melden.
    resources:
      - title: SQLite · The CASE expression
        url: https://www.sqlite.org/lang_expr.html#the_case_expression
      - title: Microsoft Support · PIVOTMIT-Funktion
        url: https://support.microsoft.com/de-de/excel/functions/pivotby-function

  - id: montagsbericht
    type: practice
    title: Der Montagsbericht mit PivotTable
    prompt: |
      Baue den Montagsbericht von Bohnenwerk. Nimm die Arbeitsmappe aus der Praxisaufgabe von [Excel-Formeln, die nächsten Monat noch stimmen](/data/excel-formeln) oder übernimm die Daten neu, zunächst **nur die Zeilen bis 5005** (März):

      ```csv title=umsatz.csv
      bestellung_id;bestelldatum;kunde_id;region;kanal;status;produkt_id;menge;einzelpreis;rabatt
      5001;02.03.2026 09:14;101;Nord;Shop;bezahlt;1101;2;8,90;0
      5002;05.03.2026 11:02;205;West;B2B;bezahlt;1102;12;22,00;0,05
      5002;05.03.2026 11:02;205;West;B2B;bezahlt;1105;10;10,50;0,05
      5003;11.03.2026 16:40;118;Süd;Shop;storniert;1107;1;39,00;0
      5004;18.03.2026 08:55;230;Nord;B2B;bezahlt;1108;20;7,80;0
      5005;31.03.2026 18:42;101;Nord;Shop;bezahlt;1105;3;11,40;0
      5006;01.04.2026 07:30;142;Ost;Shop;bezahlt;1101;1;8,90;0
      5007;09.04.2026 13:12;205;West;B2B;bezahlt;1102;15;22,00;0,05
      5008;22.04.2026 10:05;118;Süd;Shop;retourniert;1105;2;11,40;0
      ```

      1. Formatiere die Daten als Tabelle `Umsatz` mit der berechneten Spalte `netto`.
      2. Erstelle auf dem Blatt `Pivot` eine PivotTable aus `Umsatz` mit den Zeilen `region`, den Spalten `kanal` und `netto` zweimal in Werte: einmal als Summe, einmal angezeigt als „% des Gesamtergebnisses“.
      3. Füge einen Datenschnitt für `status` (nur „bezahlt“) und eine Zeitachse für `bestelldatum` (März 2026) ein.
      4. Baue auf dem Blatt `Kontrolle` eine Abstimmung: `PIVOTDATENZUORDNEN` gegen `SUMMEWENNS` mit denselben Bedingungen, gesteuert über den Namen `Berichtsmonat`.
      5. Füge danach die Zeilen 5006 bis 5008 direkt unter der Tabelle ein, wähle Daten › Alle aktualisieren, stell die Zeitachse und `Berichtsmonat` auf April und prüfe erneut.
    lang: excel
    solution: |
      Umsatz[netto]:  =[@menge]*[@einzelpreis]*(1-[@rabatt])

      PivotTable (Blatt Pivot, Quelle: Umsatz)
        Zeilen:   region
        Spalten:  kanal
        Werte:    Summe von netto
                  Summe von netto2 › Werte anzeigen als › % des Gesamtergebnisses
        Datenschnitt: status = bezahlt
        Zeitachse:    bestelldatum, Monate, März 2026

      Kontrolle!B1 (Name Berichtsmonat):  01.03.2026
      Kontrolle!B2:  =PIVOTDATENZUORDNEN("Summe von netto";Pivot!$A$3)
      Kontrolle!B3:  =SUMMEWENNS(Umsatz[netto];Umsatz[status];"bezahlt";Umsatz[bestelldatum];">="&Berichtsmonat;Umsatz[bestelldatum];"<"&EDATUM(Berichtsmonat;1))
      Kontrolle!B4:  =B2-B3
      Kontrolle!B5:  =WENN(ABS(B4)<0,005;"OK";"prüfen")
    checklist:
      - PivotTable-Analyse › Datenquelle ändern zeigt als Quelle `Umsatz`, keinen Zellbereich.
      - "März, bezahlt: Nord/B2B 156,00, Nord/Shop 52,00, West/B2B 350,55, Gesamtergebnis 558,55. West/Shop ist leer, Süd erscheint nicht."
      - Die Prozentspalte zeigt im Gesamtergebnis Nord 37,24 % und West 62,76 %.
      - Die Kontrollzelle zeigt 0 und „OK“.
      - "Nach dem Einfügen der April-Zeilen, Alle aktualisieren und April in Zeitachse und `Berichtsmonat`: Ost/Shop 8,90, West/B2B 313,50, Gesamtergebnis 322,40 und wieder „OK“ – ohne dass du die Quelle angepasst hast."
    hints:
      - Zeigt die PivotTable im April nichts, prüf die Zeitachse, dann Alle aktualisieren, dann die Quelle.
      - "`PIVOTDATENZUORDNEN` ohne Feld-Element-Paare liefert das Gesamtergebnis der gerade gefilterten PivotTable."
    explanation: |
      Die Tabelle als Quelle sorgt dafür, dass die April-Zeilen nach Alle aktualisieren ohne weitere Handgriffe in der PivotTable ankommen. Datenschnitt und Zeitachse filtern vor dem Gruppieren; deshalb fehlt Süd im März, und das leere Feld West/Shop bedeutet „keine Zeile“. Die Prozentspalte teilt jede Summe durch das Gesamtergebnis der gefilterten Daten: 208,00 / 558,55 = 37,24 %. Die Abstimmung beantwortet mit `SUMMEWENNS` dieselbe Frage wie die PivotTable – bezahlt, im Berichtsmonat – und muss deshalb 0 ergeben. Meldet sie „prüfen“, ist entweder die PivotTable nicht aktualisiert, ihre Quelle zu kurz oder ein Filter anders gesetzt als die Kontrolle. So wird aus der Stunde Abtippen ein Ablauf aus Einfügen, Aktualisieren und einem Blick auf „OK“.
    resources:
      - title: Microsoft Support · Datenschnitte zum Filtern verwenden
        url: https://support.microsoft.com/de-de/excel/get-started/use-slicers-to-filter-data
      - title: Microsoft Support · PivotTable-Zeitachse erstellen
        url: https://support.microsoft.com/de-de/excel/create-a-pivottable-timeline-to-filter-dates
