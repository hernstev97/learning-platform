id: tabellen-pivot
title: Intelligente Tabellen und PivotTables
level: 2
minutes: 180
summary: Aus einer Liste wird eine Tabelle, die mitwächst, und aus der Tabelle eine PivotTable, die den Wochenbericht in Minuten liefert – mit strukturierten Verweisen, Ergebniszeile, Wertfeldeinstellungen, Datenschnitten, sicherem Aktualisieren und der Brücke zu SQL, denn eine Pivot ist GROUP BY mit bedingter Aggregation.
goals:
  - Du formatierst Daten als Tabelle, schreibst strukturierte Verweise und berechnete Spalten und unterscheidest `SUMME` und `TEILERGEBNIS` in gefilterten Tabellen.
  - Du baust PivotTables aus Zeilen, Spalten, Werten und Filtern und wählst in den Wertfeldeinstellungen Zusammenfassung und Anzeige bewusst.
  - Du gruppierst Datumswerte, filterst mit Datenschnitten und Zeitachsen und vermeidest die Quellbereich-Falle beim Aktualisieren.
  - Du holst Pivot-Werte stabil mit `PIVOTDATENZUORDNEN` und baust Pivots als Formel mit `GRUPPIERENNACH` und `PIVOTMIT`.
  - Du übersetzt eine PivotTable in SQL mit `GROUP BY` und `SUM(CASE WHEN …)` und erklärst, wo sich beide unterscheiden.
