      `bestellungen` und `kunden` stehen zum Ausprobieren bereit:

      | bestellung_id | kunde_id | bestelldatum |
      | --- | --- | --- |
      | 5001 | 17 | 2026-03-02 |
      | 5002 | 18 | 2026-03-03 |
      | 5003 | 99 | 2026-03-05 |
      | 5004 | 17 | 2026-03-09 |
      | 5005 | 42 | 2026-03-11 |

      | kunde_id | name | segment | region |
