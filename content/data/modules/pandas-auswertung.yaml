  - id: monatsreihe
    type: code
    title: Eine Monatsreihe ohne Lücken
    prompt: |
      Schreibe `monatsreihe(bestellungen)`. Die Eingabe hat die Spalten `bestelldatum` (Datum), `status` und `umsatz`. Gib einen DataFrame mit den Spalten `monat`, `umsatz`, `veraenderung_pct` zurück, Index `0, 1, 2, …`:

      - eine Zeile je Kalendermonat vom ersten bis zum letzten Monat mit bezahlter Bestellung – auch für Monate ohne bezahlte Bestellung,
      - `monat` als Text im Format `2026-01`,
      - `umsatz`: Summe der bezahlten Bestellungen, auf zwei Stellen gerundet, `0.0` für Monate ohne bezahlte Bestellung,
      - `veraenderung_pct`: Veränderung zum Vormonat in Prozent, auf eine Stelle gerundet; fehlend (`NaN`) im ersten Monat und wenn der Vormonat 0 Umsatz hatte.

      | bestelldatum | status | umsatz |
      | --- | --- | --- |
      | 2026-01-05 | bezahlt | 100.0 |
      | 2026-01-20 | bezahlt | 50.0 |
      | 2026-01-28 | storniert | 80.0 |
      | 2026-02-14 | storniert | 40.0 |
      | 2026-03-02 | bezahlt | 90.0 |
      | 2026-03-15 | bezahlt | 60.0 |
      | 2026-04-01 | bezahlt | 120.0 |
      | 2026-04-30 | retourniert | 30.0 |
    lang: python
    setup: |
      import pandas as pd

      bestellungen = pd.DataFrame({
          "bestelldatum": pd.to_datetime([
              "2026-01-05", "2026-01-20", "2026-01-28", "2026-02-14",
              "2026-03-02", "2026-03-15", "2026-04-01", "2026-04-30",
          ]),
          "status": ["bezahlt", "bezahlt", "storniert", "storniert", "bezahlt", "bezahlt", "bezahlt", "retourniert"],
          "umsatz": [100.0, 50.0, 80.0, 40.0, 90.0, 60.0, 120.0, 30.0],
      })
    starter: |
      import pandas as pd


      def monatsreihe(bestellungen: pd.DataFrame) -> pd.DataFrame:
          bezahlt = bestellungen[bestellungen["status"] == "bezahlt"]
          reihe = bezahlt.groupby(bezahlt["bestelldatum"].dt.to_period("M"))["umsatz"].sum()
          return pd.DataFrame({
              "monat": reihe.index.astype(str),
              "umsatz": reihe.to_numpy(),
              "veraenderung_pct": (reihe.pct_change() * 100).round(1).to_numpy(),
          })
    solution: |
      import pandas as pd


      def monatsreihe(bestellungen: pd.DataFrame) -> pd.DataFrame:
          reihe = (
              bestellungen[bestellungen["status"] == "bezahlt"]
              .resample("MS", on="bestelldatum")["umsatz"]
              .sum()
          )
          vormonat = reihe.shift(1)
          veraenderung = ((reihe - vormonat) / vormonat * 100).where(vormonat > 0).round(1)
          return pd.DataFrame({
              "monat": reihe.index.strftime("%Y-%m"),
              "umsatz": reihe.round(2).to_numpy(),
              "veraenderung_pct": veraenderung.to_numpy(),
          })
    tests:
      - name: Alle Monate von Januar bis April
        code: |
          ergebnis = monatsreihe(bestellungen)
          assert list(ergebnis.columns) == ["monat", "umsatz", "veraenderung_pct"], f"Spalten sind {list(ergebnis.columns)}"
          assert ergebnis["monat"].tolist() == ["2026-01", "2026-02", "2026-03", "2026-04"], f"monat ist {ergebnis['monat'].tolist()} – fehlt ein Monat ohne bezahlte Bestellung?"
          assert ergebnis.index.tolist() == [0, 1, 2, 3], f"Index ist {ergebnis.index.tolist()}"
      - name: Nur bezahlte Bestellungen, leere Monate mit 0
        code: |
          ergebnis = monatsreihe(bestellungen)
          assert ergebnis["umsatz"].tolist() == [150.0, 0.0, 150.0, 120.0], f"umsatz ist {ergebnis['umsatz'].tolist()}"
      - name: Veränderung zum Vormonat
        code: |
          werte = monatsreihe(bestellungen)["veraenderung_pct"].tolist()
          assert werte[1] == -100.0 and werte[3] == -20.0, f"veraenderung_pct ist {werte}"
      - name: Kein Wert im ersten Monat und nach einem Nullmonat
        code: |
          import pandas as pd
          werte = monatsreihe(bestellungen)["veraenderung_pct"]
          assert pd.isna(werte.iloc[0]), f"Januar hat keinen Vormonat, bekommen {werte.iloc[0]}"
          assert pd.isna(werte.iloc[2]), f"März folgt auf einen Monat mit 0 Umsatz, bekommen {werte.iloc[2]}"
    hints:
      - Der Startcode gruppiert nach Periode. Welche Monate entstehen dabei gar nicht?
      - "`resample(\"MS\", on=\"bestelldatum\")` legt ein lückenloses Monatsraster an. `\"M\"` gibt es in pandas 3 dafür nicht mehr."
      - "Vormonat mit `shift(1)`. Die Veränderung `(reihe - vormonat) / vormonat * 100` liefert nach einem Nullmonat `inf`; `.where(vormonat > 0)` macht daraus `NaN`."
    explanation: |
      Die Gruppierung nach `to_period("M")` erzeugt nur Monate mit Daten. Im Februar gab es nur eine stornierte Bestellung, also fehlt er, und der März würde mit dem Januar verglichen: 0 % Veränderung statt eines Einbruchs und einer Erholung. `resample("MS")` baut das Kalenderraster und füllt leere Monate mit der Summe 0. `shift(1)` liefert den Vormonat wie `LAG` in SQL. Weil eine prozentuale Veränderung von 0 aus nicht definiert ist (pandas liefert `inf`), setzt `where(vormonat > 0)` diese Fälle auf `NaN`. In SQL brauchst du für dasselbe Ergebnis einen Kalender aus einer rekursiven CTE und einen `LEFT JOIN` ([Fensterfunktionen](/data/sql-fensterfunktionen)).
    resources:
      - title: pandas · Time series · Resampling
        url: https://pandas.pydata.org/docs/user_guide/timeseries.html#resampling
      - title: pandas · Series.shift
        url: https://pandas.pydata.org/docs/reference/api/pandas.Series.shift.html

  - id: kunden-ohne-bestellung-fehlen
    type: bug
    title: Wo sind die Kunden ohne Umsatz?
    prompt: |
      Der Bericht soll **alle** Kunden aus der Kundenliste enthalten, Kunden ohne Bestellung mit Umsatz `0.0`. Die Kundenliste hat 120 Einträge, der Bericht aber nur 97 Zeilen, und keine Zeile hat den Umsatz `0.0` – obwohl `fillna` genau dafür da ist. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      import pandas as pd

      def umsatz_je_kunde(kunden: pd.DataFrame, positionen: pd.DataFrame) -> pd.DataFrame:
          je_kunde = positionen.groupby("kunde_id", as_index=False).agg(umsatz=("umsatz", "sum"))
          bericht = kunden.merge(je_kunde, on="kunde_id", validate="one_to_one")
          return bericht.fillna({"umsatz": 0.0})
    lines: [5]
    fix:
      - line: 5
        answers:
          - bericht = kunden.merge(je_kunde, on="kunde_id", how="left", validate="one_to_one")
          - bericht = kunden.merge(je_kunde, how="left", on="kunde_id", validate="one_to_one")
          - bericht = kunden.merge(je_kunde, on="kunde_id", validate="one_to_one", how="left")
          - bericht = kunden.merge(je_kunde, on="kunde_id", how="left", validate="1:1")
          - bericht = kunden.merge(je_kunde, on="kunde_id", validate="1:1", how="left")
          - bericht = kunden.merge(je_kunde, on="kunde_id", how="left")
          - bericht = kunden.merge(je_kunde, how="left", on="kunde_id")
          - bericht = pd.merge(kunden, je_kunde, on="kunde_id", how="left", validate="one_to_one")
          - bericht = pd.merge(kunden, je_kunde, on="kunde_id", how="left")
    hints:
      - Welche Join-Art verwendet `merge`, wenn du keine angibst?
      - Kunden ohne Bestellung kommen in `je_kunde` nicht vor. Was passiert bei einem Inner Join mit ihnen?
    explanation: |
      `merge` macht ohne `how` einen **Inner Join**: Nur Kunden, die auch in `je_kunde` stehen, bleiben übrig. Kunden ohne Bestellung verschwinden also schon beim Join, und `fillna` findet keine Lücke, die es füllen könnte. Mit `how="left"` bleiben alle Kunden erhalten, die ohne Bestellung bekommen `NaN` als Umsatz, und `fillna` macht daraus `0.0`. Das entspricht `kunden LEFT JOIN … COALESCE(umsatz, 0)` in SQL. `validate="one_to_one"` darf bleiben: Nach der Gruppierung ist `kunde_id` in `je_kunde` eindeutig, und in `kunden` soll sie es auch sein.
    resources:
      - title: pandas · DataFrame.merge
        url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.merge.html
      - title: pandas · Comparison with SQL · LEFT OUTER JOIN
        url: https://pandas.pydata.org/docs/getting_started/comparison/comparison_with_sql.html#left-outer-join

  - id: pivot-bericht-erklaeren
    type: explain
    title: Ein Pivot-Bericht für das Controlling
    prompt: |
      Die Kollegin aus dem Controlling arbeitet mit Excel und SQL, aber nicht mit pandas. Erkläre ihr, was der Code berechnet, wie das Ergebnis aussieht und wie sie dieselbe Tabelle in Excel und in SQL bauen würde.
    lang: python
    code: |
      bericht = (
          positionen
          .query("status == 'bezahlt'")
          .assign(monat=lambda d: d["bestelldatum"].dt.to_period("M"))
          .pivot_table(
              index="region",
              columns="monat",
              values="umsatz",
              aggfunc="sum",
              fill_value=0,
              margins=True,
              margins_name="Gesamt",
          )
      )
    points:
      - Nur bezahlte Positionen zählen; aus dem Bestelldatum wird der Monat gebildet – wie die Datumsgruppierung „Monate“ in der PivotTable oder `strftime('%Y-%m', bestelldatum)` in SQL.
      - "`pivot_table` baut eine Kreuztabelle: Regionen als Zeilen, Monate als Spalten, Summe des Umsatzes als Werte – Zeilen-, Spalten- und Wertebereich einer PivotTable."
      - "`fill_value=0` zeigt Kombinationen ohne Umsatz als 0 statt leer, `margins=True` ergänzt Zeile und Spalte „Gesamt“ wie das Gesamtergebnis."
      - In SQL wäre das `GROUP BY region` mit einer Spalte `SUM(CASE WHEN monat = … THEN umsatz ELSE 0 END)` je Monat; die Monatsspalten muss man dort ausschreiben, pandas erzeugt sie aus den Daten.
      - Das Ergebnis ist ein Bericht in breiter Form; für weitere Berechnungen ist die lange Form (`groupby` nach Region und Monat) besser geeignet.
    explanation: |
      Der Code filtert zuerst auf bezahlte Positionen und leitet aus dem Bestelldatum den Monat ab. `pivot_table` verteilt dann die Umsätze auf eine Kreuztabelle: jede Region eine Zeile, jeder Monat eine Spalte, in den Zellen die Summe. Kombinationen ohne Umsatz stehen dank `fill_value=0` als 0 da, und `margins=True` ergänzt eine Zeile und eine Spalte „Gesamt“. In Excel ist das eine PivotTable mit Region im Zeilenbereich, Bestelldatum (nach Monaten gruppiert) im Spaltenbereich und „Summe von Umsatz“ im Wertebereich, gefiltert auf den Status „bezahlt“. In SQL schreibst du `GROUP BY region` und für jeden Monat eine Spalte mit bedingter Summe; kommt ein neuer Monat dazu, muss die Abfrage angepasst werden, der pandas-Code nicht. Für Weiterrechnungen wie Vormonatsvergleiche nimmt man besser die lange Form und formt erst am Ende in die Berichtsform um.
    resources:
      - title: pandas · Reshaping · Adding margins
        url: https://pandas.pydata.org/docs/user_guide/reshaping.html#adding-margins
      - title: Microsoft Support · PIVOTMIT-Funktion
        url: https://support.microsoft.com/de-de/office/pivotby-funktion-de86516a-90ad-4ced-8522-3a25fac389cf

  - id: monatsbericht-skript
    type: practice
    title: Den Monatsbericht automatisieren
    prompt: |
      Baue auf deinem Rechner das Skript `monatsbericht.py`, das den Bohnenwerk-Monatsbericht aus drei bereinigten Exporten erzeugt. Die Dateien `bestellungen.csv` (`bestellung_id`, `kunde_id`, `bestelldatum`, `kanal`, `status`), `positionen.csv` (`bestellung_id`, `position`, `produkt_id`, `menge`, `einzelpreis`, `rabatt`) und `kunden.csv` (`kunde_id`, `name`, `region`, `segment`) liegen in `daten/bereinigt/` – UTF-8 mit BOM, Semikolon, Dezimalkomma, Datum als `2026-03-14`. Lege dir für den Test ein paar Zeilen je Datei selbst an, darunter eine Bestellung mit unbekannter Kundennummer.

      Aufruf: `uv run monatsbericht.py --monat 2026-03`. Das Skript soll:

      1. die Tabellen mit `validate` verknüpfen und nach jedem Join die Zeilenzahl prüfen,
      2. Bestellungen ohne Kunden zählen und unter der Region „ohne Kunde“ im Bericht behalten,
      3. eine Pivot-Tabelle Region × Kanal mit Gesamtzeile und -spalte für den Monat erzeugen,
      4. je Region Umsatz, Vormonat und Veränderung in Prozent ausweisen,
      5. je Region die drei umsatzstärksten Kunden mit ihrem Anteil am Regionsumsatz auflisten,
      6. alle Tabellen als CSV und zusätzlich als Excel-Mappe nach `berichte/2026-03/` schreiben,
      7. vor dem Schreiben abbrechen, wenn die Gesamtsumme der Pivot-Tabelle nicht der Summe der bezahlten Positionen des Monats entspricht.
    lang: python
    solution: |
      # /// script
      # dependencies = ["pandas>=3", "openpyxl"]
      # ///
      import argparse
      from pathlib import Path

      import pandas as pd

      LESEN = dict(sep=";", decimal=",", encoding="utf-8-sig")
      SCHREIBEN = dict(sep=";", decimal=",", encoding="utf-8-sig")


      def lade(ordner: Path) -> tuple[pd.DataFrame, pd.DataFrame, pd.DataFrame]:
          bestellungen = pd.read_csv(ordner / "bestellungen.csv", parse_dates=["bestelldatum"], date_format="%Y-%m-%d", **LESEN)
          positionen = pd.read_csv(ordner / "positionen.csv", **LESEN)
          kunden = pd.read_csv(ordner / "kunden.csv", **LESEN)
          return bestellungen, positionen, kunden


      def verknuepfe(bestellungen, positionen, kunden) -> tuple[pd.DataFrame, int]:
          mit_kunde = bestellungen.merge(kunden, on="kunde_id", how="left", validate="many_to_one", indicator=True)
          assert len(mit_kunde) == len(bestellungen), "Join mit Kunden hat Bestellungen verändert"
          ohne_kunde = int((mit_kunde["_merge"] == "left_only").sum())
          daten = positionen.merge(mit_kunde.drop(columns="_merge"), on="bestellung_id", how="left", validate="many_to_one")
          assert len(daten) == len(positionen), "Join mit Bestellungen hat Positionen verändert"
          daten = daten.assign(
              region=lambda d: d["region"].fillna("ohne Kunde"),
              umsatz=lambda d: d["menge"] * d["einzelpreis"] * (1 - d["rabatt"]),
              monat=lambda d: d["bestelldatum"].dt.to_period("M"),
          )
          return daten, ohne_kunde


      def bericht(daten: pd.DataFrame, monat: pd.Period) -> dict[str, pd.DataFrame]:
          bezahlt = daten.query("status == 'bezahlt'")
          aktuell = bezahlt[bezahlt["monat"] == monat]

          pivot = aktuell.pivot_table(
              index="region", columns="kanal", values="umsatz", aggfunc="sum",
              fill_value=0, margins=True, margins_name="Gesamt",
          ).round(2)
          if round(pivot.loc["Gesamt", "Gesamt"], 2) != round(aktuell["umsatz"].sum(), 2):
              raise SystemExit("Kontrollsumme stimmt nicht – Bericht wird nicht geschrieben.")

          vergleich = (
              bezahlt.groupby(["region", "monat"])["umsatz"].sum()
              .unstack(fill_value=0)
              .reindex(columns=[monat - 1, monat], fill_value=0)
              .set_axis(["vormonat", "umsatz"], axis=1)
              .assign(veraenderung_pct=lambda d: ((d["umsatz"] - d["vormonat"]) / d["vormonat"] * 100).where(d["vormonat"] > 0))
              .round(2)
          )

          top_kunden = (
              aktuell.groupby(["region", "kunde_id"], as_index=False)["umsatz"].sum()
              .assign(anteil_region=lambda d: d["umsatz"] / d.groupby("region")["umsatz"].transform("sum"))
              .sort_values(["region", "umsatz"], ascending=[True, False])
              .groupby("region")
              .head(3)
              .round({"umsatz": 2, "anteil_region": 3})
              .set_index("region")
          )
          return {"region_kanal": pivot, "vormonat": vergleich, "top_kunden": top_kunden}


      def main() -> None:
          parser = argparse.ArgumentParser()
          parser.add_argument("--monat", required=True, help="z. B. 2026-03")
          parser.add_argument("--daten", default="daten/bereinigt", type=Path)
          args = parser.parse_args()
          monat = pd.Period(args.monat, freq="M")

          daten, ohne_kunde = verknuepfe(*lade(args.daten))
          tabellen = bericht(daten, monat)

          ziel = Path("berichte") / str(monat)
          ziel.mkdir(parents=True, exist_ok=True)
          with pd.ExcelWriter(ziel / f"monatsbericht_{monat}.xlsx") as mappe:
              for name, tabelle in tabellen.items():
                  tabelle.to_csv(ziel / f"{name}.csv", **SCHREIBEN)
                  tabelle.to_excel(mappe, sheet_name=name)
          print(f"{monat}: Umsatz {tabellen['region_kanal'].loc['Gesamt', 'Gesamt']:.2f} EUR, {ohne_kunde} Bestellung(en) ohne Kunden -> {ziel}")


      if __name__ == "__main__":
          main()
    checklist:
      - "`uv run monatsbericht.py --monat 2026-03` läuft ohne Fehler und schreibt drei CSV-Dateien und eine Excel-Mappe nach `berichte/2026-03/`."
      - Beide `merge`-Aufrufe tragen `validate="many_to_one"`, und nach jedem Join wird die Zeilenzahl mit der Eingabe verglichen.
      - Eine doppelte `kunde_id` in `kunden.csv` lässt das Skript mit `MergeError` abbrechen, statt Umsätze zu verdoppeln.
      - Die Bestellung mit unbekannter Kundennummer erscheint unter „ohne Kunde“ und wird im Protokoll gezählt.
      - Die Gesamtsumme der Pivot-Tabelle stimmt mit einer unabhängigen Rechnung überein (SQL-Abfrage oder PivotTable in Excel über dieselben Daten).
      - Ein Monat, dessen Vormonat 0 Umsatz hatte, zeigt bei der Veränderung einen leeren Wert statt `inf`.
      - Die Top-Kunden-Anteile ergeben je Region höchstens 1,0 und stammen aus `transform`, nicht aus einer zweiten Tabelle.
    hints:
      - Schreibe zuerst `verknuepfe` und prüfe die Zeilenzahlen, bevor du irgendetwas summierst.
      - "`pd.Period(\"2026-03\", freq=\"M\") - 1` ist der Vormonat. Mit `reindex(columns=[vormonat, monat], fill_value=0)` hast du beide Spalten sicher, auch wenn ein Monat fehlt."
      - "`to_excel` braucht `openpyxl`. Im Kopfkommentar des Skripts eingetragen, installiert `uv run` es automatisch."
    explanation: |
      Das Skript bildet genau die Schritte ab, die bisher drei Stunden Handarbeit gekostet haben, und ergänzt, was in Excel fehlt: Kontrollen. `validate` und die Zeilenzahlprüfung verhindern Doppelzählungen, die Region „ohne Kunde“ verhindert, dass Umsatz mit fehlenden Stammdaten aus dem Bericht fällt, und die Kontrollsumme stoppt einen falschen Bericht vor dem Versand. Pivot, Vormonatsvergleich und Top-Kunden sind die drei Werkzeuge dieses Moduls: `pivot_table`, `groupby` mit `unstack` und Periodenrechnung sowie `transform`. `openpyxl` gibt es nur lokal, nicht im Browser – deshalb ist dies eine Praxisaufgabe. Wie du den Bericht jeden Monat automatisch startest, zeigt [Kleine Automationen für Analysen](/data/automationen).
