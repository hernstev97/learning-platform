  - id: kunden-zuordnen
    type: code
    title: Bestellungen ihren Kunden zuordnen
    prompt: |
      Schreibe `ordne_kunden_zu(bestellungen, kunden)`, die ein Paar `(zugeordnet, waisen)` zurückgibt:

      - `zugeordnet`: alle Bestellungen in ihrer ursprünglichen Reihenfolge, ergänzt um die Spalten aus `kunden` (`name`, `segment`, `region`). Keine Bestellung darf fehlen oder doppelt vorkommen, und es gibt keine Hilfsspalte `_merge` im Ergebnis.
