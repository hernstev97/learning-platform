lesson: |
  Am ersten Werktag jedes Monats schickt das Controlling von Bohnenwerk den Monatsbericht an die Geschäftsführung: Nettoumsatz je Region und Kanal, Entwicklung zum Vormonat, Anteil der größten Kunden je Region und eine Liste der Bestellungen, die keinem Kunden zugeordnet werden konnten. Bisher entsteht er in Excel. Exporte einfügen, per `XVERWEIS` Region und Segment aus der Kundenliste holen, drei PivotTables aktualisieren, Werte in die Berichtsvorlage kopieren, den Vormonat daneben tippen. Das dauert drei Stunden, wenn nichts schiefgeht. Einmal im Quartal geht etwas schief: Eine Kundennummer steht doppelt in der Stammliste, `XVERWEIS` nimmt still den ersten Treffer, und niemand merkt es.

  Die Operationen dahinter kennst du aus Excel und SQL: gruppieren, verknüpfen, umformen. pandas bietet dieselben, mit zwei Vorteilen. Jeder Schritt steht als Code da und läuft jeden Monat identisch. Und pandas prüft auf Wunsch Annahmen, die Excel nie prüft, etwa „jede Bestellung gehört zu genau einem Kunden“. Aus drei Stunden werden fünf Minuten: Skript starten, Kontrollzahlen lesen, Bericht kommentieren. Voraussetzung ist [pandas: Daten laden und bereinigen](/data/pandas-grundlagen). Die SQL-Seite findest du in [Joins und Datenmodelle abfragen](/data/sql-joins) und [Fensterfunktionen](/data/sql-fensterfunktionen), die Excel-Seite in [Intelligente Tabellen und PivotTables](/data/tabellen-pivot).

  ## groupby: Split-Apply-Combine statt SUMMEWENNS

  Jede Gruppierung folgt demselben Muster, das die pandas-Dokumentation **Split-Apply-Combine** nennt ([Group by](https://pandas.pydata.org/docs/user_guide/groupby.html)). Die Zeilen werden nach einem Schlüssel in Gruppen aufgeteilt (split), auf jede Gruppe wird eine Funktion angewendet, etwa eine Summe (apply), und die Ergebnisse werden zu einer neuen Tabelle zusammengesetzt (combine). Eine PivotTable mit der Region im Zeilenbereich tut genau das, ebenso `GROUP BY region` in SQL.

  ```python run
  import pandas as pd

  positionen = pd.DataFrame({
      "bestellung_id": [1, 1, 2, 3, 4, 4, 5],
      "region": ["Nord", "Nord", "Süd", "Nord", "West", "West", "Süd"],
      "kanal": ["Shop", "Shop", "B2B", "B2B", "B2B", "B2B", "Shop"],
      "umsatz": [29.80, 12.50, 241.20, 118.75, 234.00, 160.80, 44.70],
  })

  print(positionen.groupby("region")["umsatz"].sum().round(2))

  bericht = positionen.groupby(["region", "kanal"], as_index=False).agg(
      umsatz=("umsatz", "sum"),
      positionen=("umsatz", "size"),
      bestellungen=("bestellung_id", "nunique"),
  )
  print(bericht.round(2))
  ```

  `groupby("region")["umsatz"].sum()` liefert eine Series mit der Region als Index. Für Berichte ist die **benannte Aggregation** lesbarer: In `agg` steht links der Name der Ergebnisspalte, rechts ein Paar aus Quellspalte und Funktion. `as_index=False` macht die Gruppenschlüssel zu normalen Spalten statt zu einem (bei zwei Schlüsseln zweistufigen) Index. Achte auf die drei Zählfunktionen: `size` zählt Zeilen wie `COUNT(*)`, `count` nicht fehlende Werte wie `COUNT(spalte)`, `nunique` verschiedene Werte wie `COUNT(DISTINCT spalte)`. Im Beispiel hat West zwei Positionen, aber nur eine Bestellung.

  Dieselbe Auswertung in SQL; auch dieser Block läuft hier im Browser:

  ```sql run
  CREATE TABLE positionen (bestellung_id INTEGER, region TEXT, kanal TEXT, umsatz REAL);
  INSERT INTO positionen VALUES
    (1, 'Nord', 'Shop', 29.80), (1, 'Nord', 'Shop', 12.50), (2, 'Süd', 'B2B', 241.20),
    (3, 'Nord', 'B2B', 118.75), (4, 'West', 'B2B', 234.00), (4, 'West', 'B2B', 160.80),
    (5, 'Süd', 'Shop', 44.70);

  SELECT region, kanal,
         ROUND(SUM(umsatz), 2) AS umsatz,
         COUNT(*) AS positionen,
         COUNT(DISTINCT bestellung_id) AS bestellungen
  FROM positionen
  GROUP BY region, kanal
  ORDER BY region, kanal;
  ```

  In Excel beantwortest du die Frage mit einer PivotTable, für einzelne Zellen mit `SUMMEWENNS` (englisch `SUMIFS`, [SUMMEWENNS](https://support.microsoft.com/de-de/office/summewenns-funktion-c9e748f5-7ea7-455d-9406-611cebce642b)) oder in Microsoft 365 mit `GRUPPIERENNACH` (englisch `GROUPBY`), das ältere Excel-Versionen nicht kennen:

  ```excel
  =SUMMEWENNS(Positionen[Umsatz];Positionen[Region];"Nord";Positionen[Kanal];"Shop")
  =GRUPPIERENNACH(Positionen[[Region]:[Kanal]];Positionen[Umsatz];SUMME)
  ```

  Drei Unterschiede zu SQL und Excel verschieben Summen, wenn man sie nicht kennt:

  - **Fehlende Schlüssel.** `groupby` lässt Zeilen mit `NaN` im Schlüssel standardmäßig weg. SQL bildet für `NULL` eine eigene Gruppe, die PivotTable zeigt „(Leer)“. Mit `groupby(…, dropna=False)` behält pandas diese Zeilen ([NA group handling](https://pandas.pydata.org/docs/user_guide/groupby.html#na-group-handling)).
  - **Summe ohne Werte.** Eine Gruppe, deren Werte alle fehlen, hat in pandas die Summe `0`, in SQL `NULL`. Mit `sum(min_count=1)` bekommst du `NaN`.
  - **Kategorien.** Ist der Schlüssel eine `category`-Spalte, erscheinen seit pandas 3 nur Kategorien mit Daten (`observed=True` ist Standard). Wer auch die Region Ost mit 0 sehen will, schreibt `observed=False`.

  > [!MERKE]
  > `groupby` mit `agg` ist `GROUP BY` mit Aggregatfunktionen – und der Zeilen- und Wertebereich einer PivotTable. Das Ergebnis hat eine Zeile je Gruppe.

  ## transform: Gruppenwerte an jede Zeile zurückschreiben

  `agg` verdichtet auf eine Zeile je Gruppe. Oft brauchst du den Gruppenwert aber **neben** jeder Einzelzeile: für den Anteil eines Kunden am Umsatz seiner Region, die Abweichung vom Regionsdurchschnitt oder eine Rangfolge. Dafür gibt es `transform` ([Transformation](https://pandas.pydata.org/docs/user_guide/groupby.html#transformation)). Es rechnet pro Gruppe und liefert eine Series mit derselben Länge und demselben Index wie die Eingabe.

  ```python run
  import pandas as pd

  kunden_umsatz = pd.DataFrame({
      "kunde_id": [17, 18, 19, 20, 21],
      "region": ["Nord", "Nord", "Nord", "Süd", "Süd"],
      "umsatz": [600.0, 300.0, 100.0, 450.0, 50.0],
  })

  print(kunden_umsatz.groupby("region")["umsatz"].sum().to_dict())

  mit_anteil = kunden_umsatz.assign(
      region_umsatz=lambda d: d.groupby("region")["umsatz"].transform("sum"),
      anteil=lambda d: (d["umsatz"] / d["region_umsatz"]).round(3),
      rang=lambda d: d.groupby("region")["umsatz"].rank(ascending=False).astype(int),
  )
  print(mit_anteil)
  ```

  Die Summe je Region steht jetzt in jeder Zeile, der Anteil ist eine einfache Division. `rank` ist eine weitere Methode, die je Gruppe rechnet und die Zeilenzahl behält. In SQL heißt dieses Muster Fensterfunktion: `SUM(umsatz) OVER (PARTITION BY region)`. In einer Excel-Tabelle schlägt eine berechnete Spalte die Gruppensumme in jeder Zeile nach: `=[@Umsatz]/SUMMEWENNS([Umsatz];[Region];[@Region])`.

  Ein häufiger Irrweg ist, das Ergebnis von `groupby(…).sum()` direkt als neue Spalte zuzuweisen. Diese Series hat die Regionen als Index, der DataFrame die Zeilennummern. pandas richtet nach Index aus, findet keine Übereinstimmung und füllt die ganze Spalte mit `NaN`.

  ## merge: Tabellen verknüpfen, ohne Zeilen zu verlieren oder zu verdoppeln

  `merge` verbindet zwei DataFrames über gemeinsame Schlüsselspalten wie ein SQL-Join ([Merge](https://pandas.pydata.org/docs/user_guide/merging.html#merge)). `how` bestimmt, welche Zeilen bleiben: `"inner"` (Standard) nur Zeilen mit Partner auf beiden Seiten, `"left"` alle Zeilen der linken Tabelle, `"right"` und `"outer"` entsprechend. Für Nachschlagen im Stil von `XVERWEIS` ist fast immer `how="left"` richtig: Jede Bestellung bleibt erhalten, auch wenn ihr Kunde in der Stammliste fehlt.

  Der wichtigste Unterschied zu `XVERWEIS`: `XVERWEIS` liefert einen Treffer, den ersten. `merge` liefert **alle** Treffer und vervielfacht dabei Zeilen. Das ist gewollt, wenn du Bestellungen an ihre Positionen hängst. Es wird zum Fehler, wenn du danach eine Spalte summierst, die zur gröberen Tabelle gehört – der **Fan-out** aus dem SQL-Modul. Zwei Argumente machen Kardinalität und Vollständigkeit prüfbar ([Merge key uniqueness](https://pandas.pydata.org/docs/user_guide/merging.html#merge-key-uniqueness)):

  - `validate="many_to_one"` (kurz `"m:1"`) sagt: Rechts ist der Schlüssel eindeutig. Steht eine Kundennummer doppelt in der Stammliste, bricht `merge` mit `MergeError` ab, statt Bestellungen still zu verdoppeln. Weitere Werte sind `"one_to_one"`, `"one_to_many"` und `"many_to_many"`; der letzte prüft nichts und dokumentiert nur, dass beide Seiten Dubletten haben dürfen.
  - `indicator=True` ergänzt die Spalte `_merge` mit `both`, `left_only` oder `right_only`. Die `left_only`-Zeilen eines Left Join sind die Waisen, also Bestellungen ohne Kunden – der Anti-Join aus SQL.

  ```python run
  import pandas as pd

  bestellungen = pd.DataFrame({
      "bestellung_id": [1, 2, 3],
      "kunde_id": [17, 18, 99],
      "versandkosten": [4.90, 0.00, 4.90],
  })
  positionen = pd.DataFrame({
      "bestellung_id": [1, 1, 1, 2, 3],
      "umsatz": [29.80, 12.50, 14.90, 241.20, 38.50],
  })
  kunden = pd.DataFrame({
      "kunde_id": [17, 18, 18],
      "segment": ["Privat", "Café", "Büro"],
  })

  # Fan-out: eine Zeile je Position, die Versandkosten stehen jetzt mehrfach da
  verknuepft = positionen.merge(bestellungen, on="bestellung_id", how="left", validate="many_to_one")
  print(len(positionen), len(verknuepft))
  print(round(verknuepft["versandkosten"].sum(), 2), round(bestellungen["versandkosten"].sum(), 2))

  # validate stoppt, wenn ein Kunde doppelt in der Stammliste steht
  try:
      bestellungen.merge(kunden, on="kunde_id", how="left", validate="many_to_one")
  except pd.errors.MergeError as fehler:
      print("MergeError:", str(fehler).splitlines()[0])

  # indicator zeigt, welche Bestellung keinen Kunden gefunden hat
  eindeutige_kunden = kunden.drop_duplicates(subset="kunde_id", keep="last")
  geprueft = bestellungen.merge(eindeutige_kunden, on="kunde_id", how="left", validate="many_to_one", indicator=True)
  print(geprueft)
  ```

  Bestellung 1 hat drei Positionen, also stehen ihre Versandkosten nach dem Join dreimal da, und die Summe ergibt 19,60 Euro statt 9,80. Summiere Werte deshalb auf der Ebene, zu der sie gehören – Versandkosten aus `bestellungen`, Umsätze aus `positionen` – und verknüpfe erst die verdichteten Ergebnisse. Heißen Spalten auf beiden Seiten gleich, etwa `name` bei Kunden und Produkten, hängt pandas `_x` und `_y` an; mit `suffixes=("_kunde", "_produkt")` werden die Namen sprechend.

  > [!WARNING] Zeilenzahl vor und nach jedem merge
  > Ein Left Join mit eindeutigem Schlüssel rechts hat genau so viele Zeilen wie die linke Tabelle. Ist das Ergebnis länger, hat der Schlüssel rechts Duplikate; ist es kürzer, war es kein Left Join. `len()` vor und nach dem Join ist die billigste Kontrolle, die es gibt.

  ## Umformen: pivot_table, pivot, melt und crosstab

  Für Analysen liegen Daten am besten in **langer Form** vor: eine Zeile je Beobachtung, eine Spalte je Merkmal ([Saubere Tabellen und Datenmodelle](/data/tabellenmodelle)). Berichte zeigen dagegen die **breite Form** mit Regionen in den Zeilen und Monaten oder Kanälen in den Spalten. pandas hat für beide Richtungen eigene Werkzeuge ([Reshaping and pivot tables](https://pandas.pydata.org/docs/user_guide/reshaping.html)).

  `pivot_table` ist die PivotTable als Funktion. `index` ist der Zeilenbereich, `columns` der Spaltenbereich, `values` mit `aggfunc` der Wertebereich samt Wertfeldeinstellung. `fill_value=0` füllt leere Kombinationen, `margins=True` ergänzt Gesamtzeile und Gesamtspalte. `pivot` formt dagegen nur um, ohne zu aggregieren: Kommt eine Kombination aus Zeile und Spalte mehrfach vor, bricht es mit `ValueError` ab. `pd.crosstab` zählt Häufigkeiten wie eine PivotTable mit der Wertfeldeinstellung „Anzahl“; mit `normalize="index"` werden daraus Zeilenanteile.

  ```python run
  import pandas as pd

  positionen = pd.DataFrame({
      "region": ["Nord", "Nord", "Süd", "West", "Süd", "Nord"],
      "kanal": ["Shop", "B2B", "Shop", "B2B", "Shop", "Shop"],
      "umsatz": [120.0, 800.0, 45.5, 610.0, 80.0, 60.0],
  })

  pivot = positionen.pivot_table(
      index="region", columns="kanal", values="umsatz",
      aggfunc="sum", fill_value=0, margins=True, margins_name="Gesamt",
  )
  print(pivot)
  print(pd.crosstab(positionen["region"], positionen["kanal"]))

  try:
      positionen.pivot(index="region", columns="kanal", values="umsatz")
  except ValueError as fehler:
      print("ValueError:", fehler)
  ```

  SQL hat kein Pivot, das Spalten aus den Daten erzeugt. Du schreibst jede Spalte als bedingte Aggregation aus – genau das generiert `pivot_table` für dich:

  ```sql run
  CREATE TABLE positionen (region TEXT, kanal TEXT, umsatz REAL);
  INSERT INTO positionen VALUES
    ('Nord', 'Shop', 120), ('Nord', 'B2B', 800), ('Süd', 'Shop', 45.5),
    ('West', 'B2B', 610), ('Süd', 'Shop', 80), ('Nord', 'Shop', 60);

  SELECT region,
         SUM(CASE WHEN kanal = 'B2B' THEN umsatz ELSE 0 END) AS b2b,
         SUM(CASE WHEN kanal = 'Shop' THEN umsatz ELSE 0 END) AS shop,
         SUM(umsatz) AS gesamt
  FROM positionen
  GROUP BY region
  ORDER BY region;
  ```

  In Microsoft 365 liefert `=PIVOTMIT(Positionen[Region];Positionen[Kanal];Positionen[Umsatz];SUMME)` dieselbe Tabelle als Formel ([PIVOTMIT](https://support.microsoft.com/de-de/office/pivotby-funktion-de86516a-90ad-4ced-8522-3a25fac389cf), englisch `PIVOTBY`).

  Die Gegenrichtung ist `melt`. Die Planungsdatei des Vertriebs hat eine Spalte je Monat. Für den Vergleich mit den Ist-Zahlen brauchst du eine Zeile je Region und Monat, denn nur so lässt sich die Planung per `merge` neben den Umsatz stellen. In Power Query heißt derselbe Schritt „Andere Spalten entpivotieren“ ([Spalten entpivotieren](https://learn.microsoft.com/de-de/power-query/unpivot-column)).

  ```python run
  import pandas as pd

  plan = pd.DataFrame({
      "region": ["Nord", "Süd", "West"],
      "2026-01": [9000, 7000, 8000],
      "2026-02": [9500, 7200, 8100],
      "2026-03": [9800, 7500, 8600],
  })
  plan_lang = plan.melt(id_vars="region", var_name="monat", value_name="plan")
  print(plan_lang.head(4))
  print(plan_lang.shape)
  print(plan_lang.groupby("monat")["plan"].sum().to_dict())
  ```

  ```powerquery
  = Table.UnpivotOtherColumns(#"Geänderter Typ", {"region"}, "monat", "plan")
  ```

  ## Zeitreihen: Monate bilden, Lücken schließen, mit dem Vormonat vergleichen

  Für Monatsauswertungen gibt es zwei Wege. `dt.to_period("M")` macht aus jedem Datum seinen Monat (`2026-03`), und du gruppierst danach wie nach jeder anderen Spalte. Dabei entstehen aber nur Monate, in denen es Daten gibt. `resample("MS", on="bestelldatum")` legt dagegen ein lückenloses Kalenderraster über die Daten: jeder Monat vom ersten bis zum letzten, leere Monate mit der Summe 0 ([Resampling](https://pandas.pydata.org/docs/user_guide/timeseries.html#resampling)). `MS` beschriftet mit dem Monatsanfang, `ME` mit dem Monatsende. Das früher übliche `"M"` hat pandas 3 für Zeitpunkte entfernt; `resample("M")` endet mit `ValueError` ([Offset aliases](https://pandas.pydata.org/docs/user_guide/timeseries.html#offset-aliases)).

  ```python run
  import pandas as pd

  bestellungen = pd.DataFrame({
      "bestelldatum": pd.to_datetime(["2026-01-05", "2026-01-20", "2026-03-02", "2026-03-15", "2026-04-01"]),
      "umsatz": [100.0, 50.0, 90.0, 60.0, 120.0],
  })

  je_monat = bestellungen.groupby(bestellungen["bestelldatum"].dt.to_period("M"))["umsatz"].sum()
  print(je_monat)

  kalender = bestellungen.resample("MS", on="bestelldatum")["umsatz"].sum()
  vergleich = pd.DataFrame({
      "umsatz": kalender,
      "vormonat": kalender.shift(1),
      "veraenderung_pct": (kalender.pct_change() * 100).round(1),
  })
  print(vergleich)
  ```

  `shift(1)` verschiebt eine Series um eine Zeile, sodass jeder Monat den Wert des Vormonats neben sich hat – das `LAG` aus SQL. `pct_change()` rechnet daraus die relative Veränderung. Die Lücke ist entscheidend: Nach `groupby` über die Periode fehlt der Februar, und der März würde mit dem Januar verglichen. Mit `resample` ist der Februar da, und die Rechnung zeigt ehrlich `-100.0` für den Februar und `inf` für den März, weil vom Nullmonat aus keine prozentuale Veränderung definiert ist. Im Bericht ersetzt du `inf` durch einen leeren Wert, etwa mit `.where(vormonat > 0)`. Und bleib bei Prozent und Prozentpunkten genau ([Deskriptive Statistik](/data/deskriptive-statistik)).

  ## Method Chaining: der Monatsbericht als eine Pipeline

  Jede Methode aus diesem Modul gibt einen neuen DataFrame zurück. Das erlaubt **Method Chaining**: Du schreibst den ganzen Bericht als eine Kette in Klammern, ein Schritt je Zeile, ohne Zwischenvariablen. Gelesen wird sie von oben nach unten, wie die angewendeten Schritte in Power Query oder eine Folge von CTEs in SQL. Eigene Funktionen, etwa eine Prüfung, hängst du mit `.pipe(funktion)` in die Kette.

  ```python run
  import pandas as pd

  bestellungen = pd.DataFrame({
      "bestellung_id": [1, 2, 3, 4, 5, 6],
      "kunde_id": [17, 18, 17, 19, 20, 18],
      "bestelldatum": pd.to_datetime(["2026-02-03", "2026-02-11", "2026-02-25", "2026-03-04", "2026-03-10", "2026-03-28"]),
      "status": ["bezahlt", "bezahlt", "storniert", "bezahlt", "bezahlt", "bezahlt"],
  })
  positionen = pd.DataFrame({
      "bestellung_id": [1, 1, 2, 3, 4, 4, 5, 6],
      "menge": [2, 1, 20, 1, 10, 6, 3, 25],
      "einzelpreis": [14.90, 12.50, 13.40, 39.00, 12.50, 39.00, 14.90, 13.40],
      "rabatt": [0.0, 0.0, 0.1, 0.0, 0.05, 0.0, 0.0, 0.1],
  })
  kunden = pd.DataFrame({"kunde_id": [17, 18, 19, 20], "region": ["Nord", "West", "Süd", "Nord"]})

  bericht = (
      positionen
      .merge(bestellungen, on="bestellung_id", how="left", validate="many_to_one")
      .merge(kunden, on="kunde_id", how="left", validate="many_to_one")
      .query("status == 'bezahlt'")
      .assign(
          umsatz=lambda d: d["menge"] * d["einzelpreis"] * (1 - d["rabatt"]),
          monat=lambda d: d["bestelldatum"].dt.to_period("M"),
      )
      .pivot_table(index="region", columns="monat", values="umsatz", aggfunc="sum", fill_value=0)
      .round(2)
  )
  print(bericht)
  ```

  Zum Debuggen kommentierst du die Kette ab einer Zeile aus und siehst das Zwischenergebnis. Wird eine Kette länger als etwa zehn Schritte, teile sie in benannte Funktionen wie `verknuepfe(…)` und `monatsbericht(…)`, die du einzeln testen kannst. Die Übersicht verbindet die drei Werkzeuge dieses Bereichs ([Comparison with SQL](https://pandas.pydata.org/docs/getting_started/comparison/comparison_with_sql.html)):

  | Aufgabe | Excel | SQL | pandas |
  | --- | --- | --- | --- |
  | Bedingte Summe | `SUMMEWENNS` | `SUM(…)` mit `WHERE` und `GROUP BY` | `groupby(…)[…].sum()` |
  | Mehrere Kennzahlen je Gruppe | PivotTable mit mehreren Wertfeldern, `GRUPPIERENNACH` | `GROUP BY` mit mehreren Aggregaten | `groupby(…).agg(name=(spalte, funktion))` |
  | Anteil an der Gruppe | `=[@Umsatz]/SUMMEWENNS(…)` | `SUM(…) OVER (PARTITION BY …)` | `groupby(…)[…].transform("sum")` |
  | Nachschlagen | `XVERWEIS` (erster Treffer) | `LEFT JOIN` (alle Treffer) | `merge(how="left", validate="many_to_one")` |
  | Kreuztabelle | PivotTable, `PIVOTMIT` | `SUM(CASE WHEN …)` je Spalte | `pivot_table`, `crosstab` |
  | Monatsspalten zu Zeilen | Power Query: Andere Spalten entpivotieren | `UNION ALL` je Monat | `melt` |
  | Vormonat | Bezug auf die Zeile darüber | `LAG(…) OVER (ORDER BY monat)` | `shift(1)`, `pct_change()` |
  | Monate ohne Umsatz | PivotTable: „Elemente ohne Daten anzeigen“ | Kalender per rekursiver CTE und `LEFT JOIN` | `resample("MS")` |

  > [!PRAXIS] Der Monatsbericht in fünf Minuten
  > Bei Bohnenwerk liest ein Skript am Monatsersten die drei Exporte, verknüpft sie mit `validate`, erzeugt Pivot und Vormonatsvergleich und schreibt drei Kontrollzahlen an den Anfang des Berichts: Summe laut Bericht gleich Summe der bezahlten Positionen, Zeilenzahl nach jedem Join gleich Zeilenzahl davor, Anzahl der Bestellungen ohne Kunden. Stimmt eine Kontrollzahl nicht, bricht das Skript ab, statt einen falschen Bericht zu verschicken. Die Controllerin liest nur noch die Kontrollzahlen und schreibt den Kommentar. Aus drei Stunden Kopierarbeit werden fünf Minuten, und die gesparte Zeit geht in die Interpretation.

  > [!INTERVIEW] „Wie verhinderst du Doppelzählungen, wenn du Tabellen verknüpfst?“
  > Ich kläre zuerst die Granularität beider Tabellen: Was ist eine Zeile? Hänge ich Bestellungen an Positionen, wiederholen sich Bestellwerte wie Versandkosten je Position, und eine Summe darüber zählt mehrfach. Deshalb aggregiere ich jeden Wert auf seiner eigenen Ebene und verknüpfe erst die Ergebnisse. Im Code sichere ich die Annahme ab – in pandas mit `merge(…, validate="many_to_one")`, in SQL mit einer Prüfung auf doppelte Schlüssel vor dem Join – und vergleiche Zeilenzahlen und Summen vor und nach dem Join.

  ## Häufige Fehler

  - **Summe zu hoch nach `merge`.** Fan-out: Werte der gröberen Tabelle wiederholen sich je Zeile der feineren. Auf der eigenen Ebene aggregieren und `validate` setzen.
  - **Zeilen fehlen nach `merge`.** Standard ist `how="inner"`. Für Nachschlagen `how="left"` verwenden.
  - **`MergeError: Merge keys are not unique in right dataset`.** Genau dafür ist `validate` da: Die Stammliste hat doppelte Schlüssel. Die Ursache klären, nicht `validate` entfernen.
  - **Gruppensummen ergeben nicht die Gesamtsumme.** Zeilen mit fehlendem Schlüssel fallen aus `groupby` heraus. `dropna=False` setzen oder die Lücken vorher behandeln.
  - **Neue Spalte voller `NaN`.** Das Ergebnis von `groupby(…).sum()` wurde direkt zugewiesen, der Index passt nicht. `transform` verwenden.
  - **`ValueError: Index contains duplicate entries, cannot reshape`.** `pivot` statt `pivot_table` bei mehrfachen Kombinationen.
  - **`ValueError: Invalid frequency: M`.** In pandas 3 heißen die Kürzel für Zeitpunkte `ME` (Monatsende) und `MS` (Monatsanfang).
  - **Der Vormonatsvergleich springt über Monate.** Nach `to_period` gruppiert, Monate ohne Daten fehlen. `resample` verwenden oder auf einen vollständigen Kalender auffüllen.
  - **Unlesbarer zweistufiger Index nach `groupby`.** `as_index=False` oder `reset_index()`.

  ## Zusammenfassung

  - `groupby` folgt Split-Apply-Combine und entspricht `GROUP BY`, `SUMMEWENNS` und dem Zeilenbereich einer PivotTable. Benannte Aggregation (`agg(name=(spalte, funktion))`) liefert berichtsfertige Spalten.
  - `size`, `count` und `nunique` entsprechen `COUNT(*)`, `COUNT(spalte)` und `COUNT(DISTINCT spalte)`. Zeilen mit fehlendem Schlüssel fallen ohne `dropna=False` heraus.
  - `transform` schreibt Gruppenwerte an jede Zeile zurück – das pandas-Gegenstück zu `SUM(…) OVER (PARTITION BY …)`.
  - `merge` liefert alle Treffer, `XVERWEIS` nur den ersten. `how="left"`, `validate="many_to_one"` und `indicator=True` machen Joins überprüfbar.
  - `pivot_table` aggregiert und formt um, `pivot` formt nur um, `melt` macht aus Spalten wieder Zeilen, `crosstab` zählt.
  - `resample("MS")` liefert lückenlose Monatsreihen, `shift` und `pct_change` vergleichen mit dem Vormonat.
  - Ein Bericht als Method Chain liest sich wie die Schritte in Power Query und läuft jeden Monat identisch. Kontrollzahlen gehören dazu.
exercises:
  - id: pivot-in-pandas
    type: choice
    title: Die PivotTable in pandas
    prompt: |
      In Excel hast du eine PivotTable gebaut: `region` im Zeilenbereich, `kanal` im Spaltenbereich, Summe von `umsatz` im Wertebereich. Die Tabelle `positionen` hat je Region und Kanal mehrere Zeilen. Welche Ausdrücke liefern dieselben Zahlen?
    options:
      - text: '`positionen.pivot_table(index="region", columns="kanal", values="umsatz", aggfunc="sum")`'
        correct: true
        why: "`pivot_table` ist die PivotTable als Funktion: Zeilen, Spalten, Werte und Aggregatfunktion."
      - text: '`positionen.groupby(["region", "kanal"])["umsatz"].sum().unstack()`'
        correct: true
        why: Die Gruppierung liefert eine Series mit zweistufigem Index, `unstack` klappt die zweite Stufe in Spalten um. Genau das tut `pivot_table` intern.
      - text: '`positionen.pivot(index="region", columns="kanal", values="umsatz")`'
        correct: false
        why: "`pivot` aggregiert nicht. Weil Kombinationen aus Region und Kanal mehrfach vorkommen, bricht es mit `ValueError: Index contains duplicate entries, cannot reshape` ab."
      - text: '`pd.crosstab(positionen["region"], positionen["kanal"])`'
        correct: false
        why: Ohne `values` und `aggfunc` zählt `crosstab` Zeilen. Das entspricht der Wertfeldeinstellung „Anzahl“, nicht „Summe“.
    explanation: |
      Eine PivotTable gruppiert nach zwei Merkmalen und aggregiert. In pandas leisten das `pivot_table` und `groupby` mit `unstack`; `pivot_table` bringt dazu Komfort wie `fill_value` und `margins` (Gesamtergebnis) mit. `pivot` ist reines Umformen für eindeutige Kombinationen, `crosstab` eine Häufigkeitstabelle. In SQL entspricht die Tabelle einem `GROUP BY region` mit einer Spalte `SUM(CASE WHEN kanal = 'Shop' THEN umsatz ELSE 0 END)` je Kanal.
    resources:
      - title: pandas · pivot_table
        url: https://pandas.pydata.org/docs/reference/api/pandas.pivot_table.html
      - title: pandas · Reshaping · pivot and pivot_table
        url: https://pandas.pydata.org/docs/user_guide/reshaping.html#pivot-table

  - id: monatsbericht-kette
    type: order
    title: Eine Kette, die läuft
    prompt: |
      Bring die Zeilen in eine Reihenfolge, in der die Kette fehlerfrei läuft und den Nettoumsatz der bezahlten Bestellungen je Kanal liefert, größter zuerst. `positionen` hat die Spalten `bestellung_id`, `menge`, `einzelpreis` und `rabatt`; `status` und `kanal` stehen nur in `bestellungen`.
    lang: python
    lines: |
      bericht = (
          positionen
          .merge(bestellungen, on="bestellung_id", how="left", validate="many_to_one")
          .query("status == 'bezahlt'")
          .assign(umsatz=lambda d: d["menge"] * d["einzelpreis"] * (1 - d["rabatt"]))
          .groupby("kanal", as_index=False)
          .agg(umsatz=("umsatz", "sum"))
          .sort_values("umsatz", ascending=False)
      )
    alternatives:
      - [1, 2, 3, 5, 4, 6, 7, 8, 9]
      - [1, 2, 5, 3, 4, 6, 7, 8, 9]
    hints:
      - Welche Spalten braucht `query`, und aus welcher Tabelle kommen sie?
      - "`agg` braucht eine gruppierte Tabelle, und nach `umsatz` sortieren kannst du sinnvoll erst, wenn die Summe je Kanal feststeht."
    explanation: |
      `status` und `kanal` gibt es erst nach dem `merge`, also muss `query` danach stehen. `assign` braucht nur Spalten aus `positionen` und darf deshalb vor oder nach dem Join und vor oder nach dem Filter stehen; alle drei Varianten werden akzeptiert. Früh zu filtern spart Rechenarbeit. `groupby` und `agg` gehören zusammen, und sortiert wird erst das verdichtete Ergebnis – vorher würde die Sortierung durch die Gruppierung wieder verloren gehen. Die Kette entspricht einer SQL-Abfrage mit `JOIN`, `WHERE`, berechneter Spalte, `GROUP BY` und `ORDER BY`.
    resources:
      - title: pandas · DataFrame.pipe und Method Chaining
        url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.pipe.html
      - title: pandas · Comparison with SQL · GROUP BY
        url: https://pandas.pydata.org/docs/getting_started/comparison/comparison_with_sql.html#group-by

  - id: fehlender-schluessel
    type: output
    title: Wo sind die 30 Euro?
    prompt: Was gibt das Programm aus?
    lang: python
    code: |
      import pandas as pd

      df = pd.DataFrame({"region": ["Nord", "Süd", None, "Nord"], "umsatz": [100, 50, 30, 20]})
      je_region = df.groupby("region")["umsatz"].sum()
      print(je_region.to_dict())
      print(je_region.sum(), df["umsatz"].sum())
      print(df.groupby("region", dropna=False)["umsatz"].sum().sum())
    expected: |
      {'Nord': 120, 'Süd': 50}
      170 200
      200
    hints:
      - Was macht `groupby` standardmäßig mit einer Zeile, deren Schlüssel fehlt?
    explanation: |
      `groupby` lässt Zeilen mit fehlendem Schlüssel standardmäßig weg (`dropna=True`). Die 30 Euro ohne Region tauchen deshalb in keiner Gruppe auf, und die Summe der Gruppen ist 170 statt 200. Mit `dropna=False` bildet pandas eine eigene Gruppe für `NaN`, und die Summen stimmen wieder überein. SQL verhält sich wie `dropna=False`: `GROUP BY region` bildet eine Gruppe für `NULL`. Ein Abgleich „Summe der Gruppen = Gesamtsumme“ gehört deshalb in jede Auswertung.
    resources:
      - title: pandas · Group by · NA group handling
        url: https://pandas.pydata.org/docs/user_guide/groupby.html#na-group-handling

  - id: versand-vervielfacht
    type: output
    title: Versandkosten nach dem Join
    prompt: Was gibt das Programm aus?
    lang: python
    code: |
      import pandas as pd

      bestellungen = pd.DataFrame({"bestellung_id": [1, 2], "versandkosten": [5.0, 0.0]})
      positionen = pd.DataFrame({"bestellung_id": [1, 1, 1, 2], "menge": [2, 1, 3, 5]})
      m = positionen.merge(bestellungen, on="bestellung_id")
      print(len(m))
      print(m["versandkosten"].sum(), bestellungen["versandkosten"].sum())
    expected: |
      4
      15.0 5.0
    hints:
      - "`merge` erzeugt eine Zeile je passender Kombination. Wie viele Positionen hat Bestellung 1?"
    explanation: |
      Bestellung 1 hat drei Positionen. `merge` hängt an jede Position die Daten ihrer Bestellung, also stehen die 5 Euro Versandkosten dreimal im Ergebnis. Die Summe verdreifacht sich auf 15.0, obwohl tatsächlich nur 5.0 angefallen sind. Das ist der Fan-out: Ein Wert der gröberen Tabelle (je Bestellung) wird nach dem Join mit der feineren Tabelle (je Position) mehrfach gezählt. Versandkosten summierst du deshalb in `bestellungen`, Umsätze in `positionen`.
    resources:
      - title: pandas · Merge
        url: https://pandas.pydata.org/docs/user_guide/merging.html#merge

  - id: agg-oder-transform
    type: output
    title: Verdichten oder zurückschreiben
    prompt: Was gibt das Programm aus?
    lang: python
    code: |
      import pandas as pd

      df = pd.DataFrame({"region": ["Nord", "Nord", "Süd"], "umsatz": [30, 10, 60]})
      print(df.groupby("region")["umsatz"].sum().tolist())
      print(df.groupby("region")["umsatz"].transform("sum").tolist())
      print((df["umsatz"] / df.groupby("region")["umsatz"].transform("sum")).tolist())
    expected: |
      [40, 60]
      [40, 40, 60]
      [0.75, 0.25, 1.0]
    hints:
      - "`sum()` nach `groupby` liefert eine Zeile je Gruppe, `transform(\"sum\")` eine Zeile je Eingabezeile."
    explanation: |
      `sum()` verdichtet: zwei Regionen, zwei Werte. `transform("sum")` rechnet dieselbe Summe, schreibt sie aber an jede Zeile der Eingabe zurück – beide Nord-Zeilen bekommen 40. Deshalb passt das Ergebnis Zeile für Zeile zu `df["umsatz"]`, und die Division liefert den Anteil jeder Zeile an ihrer Region. Das entspricht `umsatz / SUM(umsatz) OVER (PARTITION BY region)` in SQL.
    resources:
      - title: pandas · Group by · Transformation
        url: https://pandas.pydata.org/docs/user_guide/groupby.html#transformation

  - id: merge-absichern
    type: gap
    title: Ein Join mit Sicherheitsgurt
    prompt: |
      Hänge an jede Bestellung Segment und Region aus der Kundenliste. Dabei soll keine Bestellung verloren gehen, `merge` soll abbrechen, wenn eine `kunde_id` in `kunden` doppelt vorkommt, und erkennbar sein, welche Bestellung keinen Kunden gefunden hat. `waisen` enthält genau diese Bestellungen.
    lang: python
    code: |
      geprueft = bestellungen.merge(
          kunden,
          on="kunde_id",
          how=⟦"left"⟧,
          validate=⟦"many_to_one"⟧,
          indicator=⟦True⟧,
      )
      waisen = geprueft[geprueft["_merge"] == ⟦"left_only"⟧]
    gaps:
      - label: Join-Art
        hint: Alle Zeilen der linken Tabelle bleiben erhalten.
      - label: Kardinalität
        hint: Viele Bestellungen gehören zu einem Kunden; rechts muss der Schlüssel eindeutig sein.
        accept: ['"m:1"']
      - label: Herkunftsspalte
        hint: Ein Wahrheitswert, der die Spalte `_merge` erzeugt.
      - label: Ohne Partner
        hint: Die Zeile kommt nur aus der linken Tabelle.
    explanation: |
      `how="left"` behält jede Bestellung, auch ohne Kunden – wie ein `LEFT JOIN`. `validate="many_to_one"` prüft vor dem Verknüpfen, dass `kunde_id` in `kunden` eindeutig ist, und wirft sonst `MergeError`; ohne diese Prüfung würde eine doppelte Kundennummer Bestellungen still verdoppeln. `indicator=True` ergänzt `_merge`, und `left_only` markiert Bestellungen, deren Kunde fehlt. Das ist der Anti-Join aus SQL (`LEFT JOIN … WHERE kunden.kunde_id IS NULL`).
    resources:
      - title: pandas · DataFrame.merge
        url: https://pandas.pydata.org/docs/reference/api/pandas.DataFrame.merge.html
      - title: pandas · Merge result indicator
        url: https://pandas.pydata.org/docs/user_guide/merging.html#merge-result-indicator

  - id: kennzahlen-je-region
    type: code
    title: Kennzahlen je Region
    prompt: |
      Schreibe `kennzahlen_je_region(positionen)`. Die Positionen sind schon mit Bestellung und Kunde verknüpft. Gesucht ist eine Tabelle mit den Spalten `region`, `umsatz`, `bestellungen`, `bestellwert` in dieser Reihenfolge:

      - Nur Positionen mit `status == "bezahlt"`.
      - `umsatz`: Summe von `menge * einzelpreis * (1 - rabatt)`, auf zwei Stellen gerundet.
      - `bestellungen`: Anzahl **verschiedener** `bestellung_id`.
      - `bestellwert`: `umsatz / bestellungen`, auf zwei Stellen gerundet.
      - Größter Umsatz zuerst, Index `0, 1, 2, …`. Regionen ohne bezahlte Bestellung erscheinen nicht.

      Die Tabelle `positionen` steht zum Ausprobieren bereit:

      | bestellung_id | region | kanal | status | menge | einzelpreis | rabatt |
      | --- | --- | --- | --- | --- | --- | --- |
      | 3001 | Nord | Shop | bezahlt | 2 | 14.90 | 0.00 |
      | 3001 | Nord | Shop | bezahlt | 1 | 12.50 | 0.00 |
      | 3002 | Nord | B2B | bezahlt | 20 | 13.40 | 0.10 |
      | 3003 | Süd | Shop | bezahlt | 3 | 14.90 | 0.00 |
      | 3004 | Süd | B2B | storniert | 50 | 13.40 | 0.10 |
      | 3005 | West | B2B | bezahlt | 10 | 12.50 | 0.05 |
      | 3005 | West | B2B | bezahlt | 2 | 39.00 | 0.00 |
      | 3006 | Ost | Shop | storniert | 1 | 14.90 | 0.00 |
    lang: python
    setup: |
      import pandas as pd

      positionen = pd.DataFrame({
          "bestellung_id": [3001, 3001, 3002, 3003, 3004, 3005, 3005, 3006],
          "region": ["Nord", "Nord", "Nord", "Süd", "Süd", "West", "West", "Ost"],
          "kanal": ["Shop", "Shop", "B2B", "Shop", "B2B", "B2B", "B2B", "Shop"],
          "status": ["bezahlt", "bezahlt", "bezahlt", "bezahlt", "storniert", "bezahlt", "bezahlt", "storniert"],
          "menge": [2, 1, 20, 3, 50, 10, 2, 1],
          "einzelpreis": [14.90, 12.50, 13.40, 14.90, 13.40, 12.50, 39.00, 14.90],
          "rabatt": [0.0, 0.0, 0.10, 0.0, 0.10, 0.05, 0.0, 0.0],
      })
    starter: |
      import pandas as pd


      def kennzahlen_je_region(positionen: pd.DataFrame) -> pd.DataFrame:
          return positionen.groupby("region", as_index=False).agg(
              bestellungen=("bestellung_id", "count"),
          )
    solution: |
      import pandas as pd


      def kennzahlen_je_region(positionen: pd.DataFrame) -> pd.DataFrame:
          return (
              positionen[positionen["status"] == "bezahlt"]
              .assign(netto=lambda d: d["menge"] * d["einzelpreis"] * (1 - d["rabatt"]))
              .groupby("region", as_index=False)
              .agg(umsatz=("netto", "sum"), bestellungen=("bestellung_id", "nunique"))
              .assign(bestellwert=lambda d: d["umsatz"] / d["bestellungen"])
              .round({"umsatz": 2, "bestellwert": 2})
              .sort_values("umsatz", ascending=False)
              .reset_index(drop=True)
          )
    tests:
      - name: Spalten und Reihenfolge der Regionen
        code: |
          ergebnis = kennzahlen_je_region(positionen)
          assert list(ergebnis.columns) == ["region", "umsatz", "bestellungen", "bestellwert"], f"Spalten sind {list(ergebnis.columns)}"
          assert ergebnis["region"].tolist() == ["Nord", "West", "Süd"], f"Regionen sind {ergebnis['region'].tolist()} – nur bezahlte, größter Umsatz zuerst"
      - name: Umsatz nur aus bezahlten Positionen
        code: |
          ergebnis = kennzahlen_je_region(positionen)
          assert ergebnis["umsatz"].tolist() == [283.5, 196.75, 44.7], f"umsatz ist {ergebnis['umsatz'].tolist()}"
      - name: Bestellungen zählen, nicht Positionen
        code: |
          ergebnis = kennzahlen_je_region(positionen)
          assert ergebnis["bestellungen"].tolist() == [2, 1, 1], f"bestellungen ist {ergebnis['bestellungen'].tolist()} – zählst du Positionen statt verschiedener Bestellungen?"
      - name: Durchschnittlicher Bestellwert
        code: |
          ergebnis = kennzahlen_je_region(positionen)
          assert ergebnis["bestellwert"].tolist() == [141.75, 196.75, 44.7], f"bestellwert ist {ergebnis['bestellwert'].tolist()}"
      - name: Index beginnt bei 0, Eingabe bleibt unverändert
        code: |
          ergebnis = kennzahlen_je_region(positionen)
          assert ergebnis.index.tolist() == [0, 1, 2], f"Index ist {ergebnis.index.tolist()}"
          assert list(positionen.columns) == ["bestellung_id", "region", "kanal", "status", "menge", "einzelpreis", "rabatt"], "die Eingabe wurde verändert"
    hints:
      - Erst filtern, dann mit `assign` den Nettowert je Position anlegen, dann gruppieren.
      - "Benannte Aggregation: `agg(umsatz=(\"netto\", \"sum\"), bestellungen=(\"bestellung_id\", \"nunique\"))`."
      - Den Bestellwert rechnest du nach der Aggregation mit einem zweiten `assign`; danach runden, sortieren und `reset_index(drop=True)`.
    explanation: |
      Die Lösung ist eine Kette aus Filtern, berechneter Spalte, Gruppieren, zweiter berechneter Spalte und Sortieren. `nunique` ist entscheidend: Nord hat drei bezahlte Positionen, aber nur zwei Bestellungen, und der Bestellwert soll je Bestellung gelten. Der Bestellwert wird aus den **Summen** gerechnet, nicht als Mittelwert der Positionen – ein Mittelwert von Mittelwerten wäre falsch gewichtet. In SQL lautet die Abfrage `SELECT region, ROUND(SUM(menge * einzelpreis * (1 - rabatt)), 2) AS umsatz, COUNT(DISTINCT bestellung_id) AS bestellungen … WHERE status = 'bezahlt' GROUP BY region ORDER BY umsatz DESC`.
    resources:
      - title: pandas · Group by · Named aggregation
        url: https://pandas.pydata.org/docs/user_guide/groupby.html#named-aggregation
      - title: pandas · Comparison with SQL · GROUP BY
        url: https://pandas.pydata.org/docs/getting_started/comparison/comparison_with_sql.html#group-by

  - id: anteil-je-region
    type: code
    title: Welcher Kunde trägt die Region?
    prompt: |
      Schreibe `mit_anteilen(umsatz_je_kunde)`. Die Eingabe hat die Spalten `kunde_id`, `region` und `umsatz`. Gib einen neuen DataFrame mit zwei zusätzlichen Spalten zurück:

      - `region_umsatz`: der Gesamtumsatz der Region des Kunden,
      - `anteil_region`: `umsatz / region_umsatz`, auf drei Stellen gerundet; hat die Region insgesamt 0 Umsatz, ist der Anteil `0.0`.

      Zeilenzahl, Zeilenreihenfolge und Index bleiben wie in der Eingabe, und die Eingabe selbst bleibt unverändert.

      | kunde_id | region | umsatz |
      | --- | --- | --- |
      | 17 | Nord | 600.0 |
      | 18 | Nord | 300.0 |
      | 19 | Nord | 100.0 |
      | 20 | Süd | 450.0 |
      | 21 | Süd | 50.0 |
      | 22 | Ost | 0.0 |
    lang: python
    setup: |
      import pandas as pd

      umsatz_je_kunde = pd.DataFrame({
          "kunde_id": [17, 18, 19, 20, 21, 22],
          "region": ["Nord", "Nord", "Nord", "Süd", "Süd", "Ost"],
          "umsatz": [600.0, 300.0, 100.0, 450.0, 50.0, 0.0],
      })
    starter: |
      import pandas as pd


      def mit_anteilen(umsatz_je_kunde: pd.DataFrame) -> pd.DataFrame:
          je_region = umsatz_je_kunde.groupby("region")["umsatz"].sum()
          return umsatz_je_kunde.assign(region_umsatz=je_region)
    solution: |
      import pandas as pd


      def mit_anteilen(umsatz_je_kunde: pd.DataFrame) -> pd.DataFrame:
          return umsatz_je_kunde.assign(
              region_umsatz=lambda d: d.groupby("region")["umsatz"].transform("sum"),
              anteil_region=lambda d: (d["umsatz"] / d["region_umsatz"]).fillna(0.0).round(3),
          )
    tests:
      - name: Regionsumsatz an jeder Zeile
        code: |
          ergebnis = mit_anteilen(umsatz_je_kunde)
          assert ergebnis["region_umsatz"].tolist() == [1000.0, 1000.0, 1000.0, 500.0, 500.0, 0.0], f"region_umsatz ist {ergebnis['region_umsatz'].tolist()} – lauter NaN? Dann passt der Index nicht."
      - name: Anteil am Regionsumsatz
        code: |
          ergebnis = mit_anteilen(umsatz_je_kunde)
          assert ergebnis["anteil_region"].tolist()[:5] == [0.6, 0.3, 0.1, 0.9, 0.1], f"anteil_region ist {ergebnis['anteil_region'].tolist()}"
      - name: Region ohne Umsatz ergibt 0.0
        code: |
          ergebnis = mit_anteilen(umsatz_je_kunde)
          assert ergebnis["anteil_region"].tolist()[5] == 0.0, f"Anteil für Region Ost ist {ergebnis['anteil_region'].tolist()[5]} – 0 / 0 ergibt in pandas NaN"
      - name: Zeilen, Index und Eingabe bleiben erhalten
        code: |
          import pandas as pd
          eingabe = pd.DataFrame({"kunde_id": [5, 6], "region": ["Süd", "Nord"], "umsatz": [10.0, 30.0]}, index=[40, 41])
          ergebnis = mit_anteilen(eingabe)
          assert ergebnis.index.tolist() == [40, 41] and ergebnis["kunde_id"].tolist() == [5, 6], "Zeilen oder Index haben sich verändert"
          assert list(eingabe.columns) == ["kunde_id", "region", "umsatz"], "die Eingabe wurde verändert"
    hints:
      - Warum steht im Startcode überall `NaN`? Vergleiche den Index von `je_region` mit dem Index des DataFrames.
      - "`groupby(\"region\")[\"umsatz\"].transform(\"sum\")` liefert eine Series mit derselben Länge und demselben Index wie die Eingabe."
      - "Eine Division 0 / 0 ergibt in pandas `NaN`, keinen Fehler. `fillna(0.0)` fängt diesen Fall ab."
    explanation: |
      Der Startcode weist eine Series zu, deren Index die Regionen sind; der DataFrame hat Zeilennummern als Index. pandas richtet nach Index aus, findet keine Übereinstimmung und schreibt `NaN`. `transform("sum")` löst das, weil es für jede Eingabezeile den Wert ihrer Gruppe liefert. Die Division durch 0 wirft in pandas keine Exception, sondern ergibt `NaN` (bei 0 / 0) oder `inf`; deshalb braucht der Randfall eine ausdrückliche Regel. Das Muster entspricht `umsatz / SUM(umsatz) OVER (PARTITION BY region)` in SQL und `=[@Umsatz]/SUMMEWENNS([Umsatz];[Region];[@Region])` in einer Excel-Tabelle.
