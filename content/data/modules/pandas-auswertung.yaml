      | 18 | Büro Albers & Co. | Büro | Nord |
      | 19 | Petra Öztürk | Privat | Ost |
    lang: python
    setup: |
      import pandas as pd

      bestellungen = pd.DataFrame({
          "bestellung_id": [5001, 5002, 5003, 5004, 5005],
          "kunde_id": [17, 18, 99, 17, 42],
          "bestelldatum": pd.to_datetime(["2026-03-02", "2026-03-03", "2026-03-05", "2026-03-09", "2026-03-11"]),
      })
      kunden = pd.DataFrame({
          "kunde_id": [17, 18, 19],
          "name": ["Café Mühlenberg", "Büro Albers & Co.", "Petra Öztürk"],
          "segment": ["Café", "Büro", "Privat"],
          "region": ["West", "Nord", "Ost"],
      })
    starter: |
      import pandas as pd


      def ordne_kunden_zu(bestellungen: pd.DataFrame, kunden: pd.DataFrame) -> tuple[pd.DataFrame, list[int]]:
          zugeordnet = bestellungen.merge(kunden, on="kunde_id")
          return zugeordnet, []
    solution: |
      import pandas as pd


      def ordne_kunden_zu(bestellungen: pd.DataFrame, kunden: pd.DataFrame) -> tuple[pd.DataFrame, list[int]]:
          geprueft = bestellungen.merge(kunden, on="kunde_id", how="left", validate="many_to_one", indicator=True)
          waisen = sorted(geprueft.loc[geprueft["_merge"] == "left_only", "bestellung_id"].tolist())
          return geprueft.drop(columns="_merge"), waisen
    tests:
      - name: Jede Bestellung genau einmal, in alter Reihenfolge
        code: |
          zugeordnet, waisen = ordne_kunden_zu(bestellungen, kunden)
          assert zugeordnet["bestellung_id"].tolist() == [5001, 5002, 5003, 5004, 5005], f"bestellung_id ist {zugeordnet['bestellung_id'].tolist()} – Bestellungen ohne Kunden verloren?"
      - name: Segment und Region kommen dazu
        code: |
          zugeordnet, waisen = ordne_kunden_zu(bestellungen, kunden)
          segmente = zugeordnet["segment"].fillna("-").tolist()
          assert segmente == ["Café", "Büro", "-", "Café", "-"], f"segment ist {segmente}"
          assert "_merge" not in zugeordnet.columns, "die Hilfsspalte _merge gehört nicht ins Ergebnis"
      - name: Waisen werden gemeldet
        code: |
          zugeordnet, waisen = ordne_kunden_zu(bestellungen, kunden)
          assert list(waisen) == [5003, 5005], f"waisen ist {waisen}"
      - name: Doppelte Kundennummer bricht ab
        code: |
          import pandas as pd
          doppelt = pd.concat([kunden, kunden.iloc[[0]].assign(segment="Büro")], ignore_index=True)
          try:
              ordne_kunden_zu(bestellungen, doppelt)
          except pd.errors.MergeError:
              pass
          else:
              assert False, "kunde_id 17 steht doppelt in der Kundenliste – erwartet ist ein MergeError"
    hints:
      - Welche Join-Art behält alle Bestellungen?
      - "`validate=\"many_to_one\"` wirft den `MergeError` von selbst, `indicator=True` markiert Zeilen ohne Partner."
      - "Waisen sind die Zeilen mit `_merge == \"left_only\"`. Danach die Hilfsspalte mit `drop(columns=\"_merge\")` entfernen."
    explanation: |
      Der Startcode macht einen Inner Join und verliert dadurch still die Bestellungen 5003 und 5005 – im Umsatzbericht fehlt dann Geld, ohne dass es jemand merkt. `how="left"` behält jede Bestellung und entspricht dem `LEFT JOIN`. `validate="many_to_one"` macht die Annahme „ein Kunde je Kundennummer“ prüfbar: Eine doppelte Nummer würde sonst Bestellungen verdoppeln, bei `XVERWEIS` dagegen still den ersten Treffer liefern. `indicator=True` liefert die Waisen ohne zweiten Durchlauf. Die Waisenliste gehört in den Bericht, damit jemand die fehlenden Stammdaten nachpflegt.
