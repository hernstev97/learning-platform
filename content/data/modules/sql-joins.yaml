id: sql-joins
title: Joins und Datenmodelle abfragen
level: 2
minutes: 180
summary: Tabellen über Schlüssel verbinden, ohne Zeilen zu verlieren oder doppelt zu zählen – mit INNER und LEFT JOIN, Anti- und Semi-Joins, CTEs, UNION ALL und Self-Joins über das Datenmodell von Bohnenwerk.
goals:
  - Du sagst vorher, welche und wie viele Zeilen ein `INNER JOIN` oder `LEFT JOIN` liefert, und bestimmst die Granularität des Ergebnisses.
  - Du erkennst Fan-out nach 1:n-Joins und verhinderst doppelt gezählte Beträge, indem du vor dem Join verdichtest.
  - Du setzt Bedingungen bei einem `LEFT JOIN` bewusst ins `ON` oder ins `WHERE`.
  - Du findest Zeilen ohne Partner mit `NOT EXISTS` oder `LEFT JOIN … IS NULL` und erklärst, warum `NOT IN` an `NULL` scheitert.
  - Du baust mehrstufige Auswertungen mit CTEs und kombinierst Ergebnisse mit `UNION ALL` und Self-Joins.
