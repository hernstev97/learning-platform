  - id: ausreisser-finden
    type: code
    title: Auffällige Bestellungen markieren
    prompt: |
      Schreibe `ausreisser(werte, faktor=1.5)`. Die Funktion gibt alle Werte zurück, die **außerhalb** von Q1 − faktor · IQR bis Q3 + faktor · IQR liegen, in ihrer ursprünglichen Reihenfolge. Werte genau auf einer Grenze sind keine Ausreißer. Die Quartile rechnen inklusiv wie Excel `QUARTILE.INKL`.
    lang: python
    starter: |
      import statistics


      def ausreisser(werte, faktor=1.5):
          q1, _, q3 = statistics.quantiles(werte)
          ...
    solution: |
      import statistics


      def ausreisser(werte, faktor=1.5):
          q1, _, q3 = statistics.quantiles(werte, method="inclusive")
          iqr = q3 - q1
          unten, oben = q1 - faktor * iqr, q3 + faktor * iqr
          return [w for w in werte if w < unten or w > oben]
    tests:
      - name: Bestellwerte in Originalreihenfolge
        code: |
          werte = [412.00, 18.40, 22.90, 24.50, 27.00, 29.80, 31.20, 34.60, 38.90, 41.50, 52.30, 74.50]
          ergebnis = ausreisser(werte)
          assert ergebnis == [412.0, 74.5], f"erwartet [412.0, 74.5], bekommen {ergebnis!r} – Quartile inklusiv wie Excel?"
      - name: Größerer Faktor
        code: |
          werte = [18.40, 22.90, 24.50, 27.00, 29.80, 31.20, 34.60, 38.90, 41.50, 52.30, 74.50, 412.00]
          ergebnis = ausreisser(werte, faktor=3)
          assert ergebnis == [412.0], f"Mit faktor=3 ist nur 412.0 auffällig, bekommen {ergebnis!r}"
      - name: Ausreißer nach unten
        code: |
          verlust = [14.2, 15.1, 13.8, 16.0, 14.4, 3.1]
          ergebnis = ausreisser(verlust)
          assert ergebnis == [3.1], f"3.1 liegt unter der unteren Grenze, bekommen {ergebnis!r}"
      - name: Wert genau auf der Grenze
        code: |
          werte = [1, 2, 3, 4, 5, 6, 7, 8, 9, 14.5]
          assert ausreisser(werte) == [], f"14.5 liegt genau auf Q3 + 1,5 · IQR, bekommen {ausreisser(werte)!r}"
          werte = [1, 2, 3, 4, 5, 6, 7, 8, 9, 14.6]
          assert ausreisser(werte) == [14.6], f"14.6 liegt über der Grenze, bekommen {ausreisser(werte)!r}"
      - name: Keine Ausreißer
        code: |
          assert ausreisser([30, 32, 35, 31, 29, 33]) == [], "gleichmäßige Werte haben keine Ausreißer"
    hints:
      - Ohne `method` rechnet `statistics.quantiles` exklusiv. Der erste Test erwartet die Excel-Quartile.
      - Berechne die untere und die obere Grenze und behalte mit einer List Comprehension die Werte außerhalb.
      - "Strikt vergleichen: `w < unten or w > oben`. Iteriere über `werte`, nicht über eine sortierte Kopie."
    explanation: |
      Die Grenzen nach Tukey hängen nur an Q1, Q3 und dem IQR und sind damit robust: Der Ausreißer selbst verschiebt sie kaum. Mit inklusiven Quartilen (Q1 = 26,375, Q3 = 44,2) liegt die obere Grenze bei 70,94 EUR, und 74,50 EUR gilt als auffällig; mit dem Python-Standard läge sie bei 86,31 EUR. Die Rückgabe in Originalreihenfolge erlaubt es, die Werte wieder ihren Bestellungen zuzuordnen – die Funktion markiert, sie löscht nichts. Der Parameter `faktor` macht die Schwelle sichtbar statt versteckt; 3 ist eine übliche Wahl für „extreme“ Ausreißer.
    resources:
      - title: Python · statistics.quantiles
        url: https://docs.python.org/3/library/statistics.html#statistics.quantiles
      - title: pandas · Series.quantile
        url: https://pandas.pydata.org/docs/reference/api/pandas.Series.quantile.html

  - id: quote-vergleichen
    type: code
    title: Prozentpunkte im Monatsbericht
    prompt: |
      Der Monatsbericht erzeugt seine Textbausteine automatisch. Schreibe `vergleiche_quote(alt, neu)`: `alt` und `neu` sind Quoten als Anteile (0.04 für 4 %). Die Funktion gibt die Veränderung als Text zurück – absolut in Prozentpunkten und relativ in Prozent, beide mit Vorzeichen, einer Nachkommastelle und Dezimalkomma:

      ```text
      +1,0 Prozentpunkte (+25,0 %)
      ```

      Ist `alt` gleich 0, ist die relative Änderung nicht definiert; dann lautet die Klammer `(relativ nicht definiert)`.
    lang: python
    starter: |
      def vergleiche_quote(alt, neu):
          veraenderung = (neu - alt) / alt * 100
          return f"{veraenderung:+.1f} %"
    solution: |
      def deutsch(zahl):
          return f"{zahl:+.1f}".replace(".", ",")


      def vergleiche_quote(alt, neu):
          punkte = (neu - alt) * 100
          if alt == 0:
              relativ = "relativ nicht definiert"
          else:
              relativ = f"{deutsch((neu / alt - 1) * 100)} %"
          return f"{deutsch(punkte)} Prozentpunkte ({relativ})"
    tests:
      - name: Anstieg von 4 auf 5 Prozent
        code: |
          ergebnis = vergleiche_quote(0.04, 0.05)
          assert ergebnis == "+1,0 Prozentpunkte (+25,0 %)", f"bekommen {ergebnis!r}"
      - name: Rückgang
        code: |
          ergebnis = vergleiche_quote(0.05, 0.04)
          assert ergebnis == "-1,0 Prozentpunkte (-20,0 %)", f"bekommen {ergebnis!r}"
      - name: Krumme Werte
        code: |
          ergebnis = vergleiche_quote(0.123, 0.1)
          assert ergebnis == "-2,3 Prozentpunkte (-18,7 %)", f"bekommen {ergebnis!r}"
      - name: Ausgangswert 0
        code: |
          ergebnis = vergleiche_quote(0, 0.02)
          assert ergebnis == "+2,0 Prozentpunkte (relativ nicht definiert)", f"bekommen {ergebnis!r} – Division durch 0?"
    hints:
      - Die Differenz zweier Anteile mal 100 ergibt Prozentpunkte, das Verhältnis minus 1 mal 100 die relative Änderung in Prozent.
      - "`f\"{zahl:+.1f}\"` erzwingt das Vorzeichen; `.replace(\".\", \",\")` macht daraus das Dezimalkomma."
      - Prüfe `alt == 0`, bevor du durch `alt` teilst.
    explanation: |
      Die Differenz zweier Prozentwerte ist eine Angabe in Prozentpunkten: 5 % − 4 % = 1 Prozentpunkt. Die relative Änderung setzt die Differenz ins Verhältnis zum Ausgangswert: 1 / 4 = 25 %. Ein Bericht, der nur eine der beiden Zahlen nennt, lädt zu Missverständnissen ein; „+1 %“ wäre falsch. Von 0 aus gibt es keine relative Änderung, deshalb fängt die Funktion den Fall ab, statt mit `ZeroDivisionError` den ganzen Bericht anzuhalten. Die Formatierung liegt in einer eigenen Hilfsfunktion, damit alle Zahlen im Bericht gleich aussehen.
    resources:
      - title: Python · Format Specification Mini-Language
        url: https://docs.python.org/3/library/string.html#format-specification-mini-language

  - id: stabw-wie-excel
    type: bug
    title: Python sagt 0,77, Excel sagt 0,87
    prompt: |
      Der Kennzahlensteckbrief für die neue Röstmaschine verlangt die Standardabweichung als Stichprobe und Quartile wie Excel `QUARTILE.INKL`. Für die Probechargen `[14.2, 15.1, 13.8, 16.0, 14.4]` zeigt das Excel-Blatt Standardabweichung 0,87, Q1 14,2 und Q3 15,1. Die Funktion liefert `(14.7, 0.77, 14.0, 14.4, 15.55)`. Finde die fehlerhaften Zeilen und korrigiere sie.
    lang: python
    code: |
      import statistics

      def roestkennzahlen(verluste):
          mittel = statistics.fmean(verluste)
          streuung = statistics.pstdev(verluste)
          q1, median, q3 = statistics.quantiles(verluste, n=4)
          return round(mittel, 2), round(streuung, 2), q1, median, q3
    lines: [5, 6]
    fix:
      - line: 5
        answers:
          - streuung = statistics.stdev(verluste)
      - line: 6
        answers:
          - q1, median, q3 = statistics.quantiles(verluste, n=4, method="inclusive")
          - q1, median, q3 = statistics.quantiles(verluste, method="inclusive", n=4)
          - q1, median, q3 = statistics.quantiles(verluste, method="inclusive")
    hints:
      - Zwei Abweichungen, zwei Ursachen – eine betrifft die Streuung, eine die Quartile.
      - "`pstdev` steht für die Grundgesamtheit. Und welche Methode nimmt `statistics.quantiles`, wenn du keine angibst?"
    explanation: |
      `pstdev` teilt durch n und beschreibt die fünf Chargen als Grundgesamtheit; der Steckbrief will aber von den Probechargen auf die Maschine schließen, also `stdev` mit n − 1 wie `STABW.S`. Bei fünf Werten macht das 12 % aus: 0,77 gegen 0,87. `statistics.quantiles` rechnet ohne `method` exklusiv (Position p · (n + 1)) und liefert deshalb 14,0 und 15,55; `method="inclusive"` entspricht `QUARTILE.INKL` mit 14,2 und 15,1. Der Median ist bei beiden Methoden gleich, deshalb fiel er nicht auf.
    resources:
      - title: Python · statistics.stdev
        url: https://docs.python.org/3/library/statistics.html#statistics.stdev
      - title: Python · statistics.quantiles
        url: https://docs.python.org/3/library/statistics.html#statistics.quantiles

  - id: simpson-erklaeren
    type: explain
    title: Der Einkauf will wechseln
    prompt: |
      Der Einkauf will wegen der Gesamtquote von Paketblitz zu Rheinkurier wechseln. Erkläre, warum die Tabelle diese Entscheidung nicht trägt und wie du den Vergleich fair machst.
    lang: text
    code: |
      Pünktliche Zustellung, 1. Halbjahr 2026
      Dienstleister  Gebiet  Sendungen  pünktlich  Quote
      Paketblitz     Stadt         100         90   90 %
      Paketblitz     Land          400        300   75 %
      Rheinkurier    Stadt         400        340   85 %
      Rheinkurier    Land          100         70   70 %
      Paketblitz     gesamt        500        390   78 %
      Rheinkurier    gesamt        500        410   82 %
    points:
      - In jedem Gebiet ist Paketblitz pünktlicher als Rheinkurier (Stadt 90 % gegen 85 %, Land 75 % gegen 70 %).
      - Paketblitz fährt 80 % seiner Sendungen aufs Land, wo beide Dienste langsamer sind; Rheinkurier 80 % in die Stadt.
      - Die Gesamtquote ist ein gewichteter Mittelwert mit verschiedenen Gewichten und vergleicht vor allem den Mix der Gebiete (Simpson-Paradoxon).
      - Fair ist der Vergleich je Gebiet oder mit demselben Mix für beide, etwa 50 % Stadt und 50 % Land (82,5 % gegen 77,5 %).
      - Für die Entscheidung zählt, welche Sendungen der neue Dienst übernehmen würde – für Landsendungen spricht die Tabelle für Paketblitz.
    explanation: |
      Die Gesamtquoten vergleichen nicht nur die Leistung, sondern vor allem den Mix. Paketblitz ist in beiden Gebieten pünktlicher, fährt aber vier Fünftel seiner Sendungen aufs Land, wo die Quoten für alle niedriger sind; Rheinkurier fährt vier Fünftel in die Stadt. So kehrt sich der Zusammenhang beim Zusammenfassen um – das Simpson-Paradoxon. Fair wird der Vergleich mit demselben Mix für beide: Bei 50 % Stadt und 50 % Land liegt Paketblitz mit 82,5 % vor Rheinkurier mit 77,5 %. Die eigentliche Frage an den Einkauf lautet deshalb, welche Sendungen der neue Dienst fahren soll. Hat Bohnenwerk viele Landsendungen, wäre der Wechsel eine Verschlechterung.
    resources:
      - title: Python · statistics.fmean (mit Gewichten)
        url: https://docs.python.org/3/library/statistics.html#statistics.fmean

  - id: monatskennzahlen
    type: practice
    title: Monatskennzahlen mit Steckbrief
    prompt: |
      Erstelle die Kennzahlen der Bestellwerte für März – einmal in Python mit `statistics`, einmal in Excel –, sodass beide dieselben Zahlen liefern. Lege dafür diese Datei an (UTF-8, Semikolon, Dezimalkomma):

      ```csv title=bestellwerte_2026-03.csv
      bestellung_id;kanal;status;wert
      11301;Shop;bezahlt;18,40
      11302;Shop;bezahlt;22,90
      11303;Shop;bezahlt;24,50
      11304;Shop;bezahlt;27,00
      11305;Shop;bezahlt;29,80
      11306;Shop;bezahlt;31,20
      11307;Shop;bezahlt;34,60
      11308;Shop;bezahlt;38,90
      11309;Shop;bezahlt;41,50
      11310;Shop;bezahlt;52,30
      11311;Shop;bezahlt;74,50
      11312;Shop;bezahlt;412,00
      11313;Shop;storniert;89,00
      11314;Shop;retourniert;45,60
      11315;B2B;bezahlt;148,00
      11316;B2B;bezahlt;196,80
      11317;B2B;bezahlt;212,40
      11318;B2B;bezahlt;245,00
      11319;B2B;bezahlt;268,60
      11320;B2B;bezahlt;1.180,00
      11321;B2B;storniert;310,00
      ```

      Anforderungen:

      1. Schreib zuerst einen Kennzahlensteckbrief: Grundmenge, Definition jeder Kennzahl, Quantil-Methode, Stichprobe oder Grundgesamtheit, Rundung.
      2. Berechne je Kanal über die bezahlten Bestellungen: Anzahl, Mittelwert, Median, Standardabweichung, Q1, Q3, IQR und die Ausreißer nach Tukey mit Bestellnummer.
      3. Berechne den durchschnittlichen Bestellwert über beide Kanäle korrekt gewichtet.
      4. Die Retourenquote des Shops (retourniert ÷ (bezahlt + retourniert)) lag im Februar bei 6,0 %. Gib die Veränderung in Prozentpunkten und in Prozent an.
      5. Baue dieselben Kennzahlen in Excel nach (Tabelle `Bestellungen`, Filter oder `FILTER`/`WENN` für Kanal und Status) und vergleiche.
    lang: python
    solution: |
      """Monatskennzahlen Bestellwerte nach Kennzahlensteckbrief (Stand März 2026).

      Steckbrief: Grundmenge status = 'bezahlt' je Kanal. Median und Quartile inklusiv
      (Excel QUARTILE.INKL), Standardabweichung als Stichprobe (STABW.S). Ausreißer:
      außerhalb Q1 - 1,5 * IQR bis Q3 + 1,5 * IQR, werden gelistet, nicht entfernt.
      Gerundet wird nur in der Ausgabe.

      Excel-Gegenstück (Tabelle Bestellungen, Hilfsspalte shop_bezahlt mit Werten oder leer):
        =MEDIAN(Bestellungen[shop_bezahlt])
        =STABW.S(Bestellungen[shop_bezahlt])
        =QUARTILE.INKL(Bestellungen[shop_bezahlt];1)
      """
      import csv
      import statistics
      from decimal import Decimal

      QUARTIL_METHODE = "inclusive"


      def lies(pfad):
          with open(pfad, encoding="utf-8", newline="") as datei:
              for zeile in csv.DictReader(datei, delimiter=";"):
                  zeile["wert"] = float(Decimal(zeile["wert"].replace(".", "").replace(",", ".")))
                  yield zeile


      def beschreibe(werte):
          q1, median, q3 = statistics.quantiles(werte, n=4, method=QUARTIL_METHODE)
          return {
              "n": len(werte),
              "summe": sum(werte),
              "mittelwert": statistics.fmean(werte),
              "median": median,
              "stabw_s": statistics.stdev(werte),
              "q1": q1,
              "q3": q3,
              "iqr": q3 - q1,
          }


      def ausreisser(zeilen, k):
          unten = k["q1"] - 1.5 * k["iqr"]
          oben = k["q3"] + 1.5 * k["iqr"]
          return [(z["bestellung_id"], z["wert"]) for z in zeilen if not unten <= z["wert"] <= oben]


      zeilen = list(lies("bestellwerte_2026-03.csv"))
      bezahlt = [z for z in zeilen if z["status"] == "bezahlt"]
      ergebnisse = {}
      for kanal in ["Shop", "B2B"]:
          teil = [z for z in bezahlt if z["kanal"] == kanal]
          k = beschreibe([z["wert"] for z in teil])
          ergebnisse[kanal] = k
          print(kanal, {name: round(wert, 2) for name, wert in k.items()})
          print("  Ausreißer (prüfen, nicht löschen):", ausreisser(teil, k))

      gesamt = sum(k["summe"] for k in ergebnisse.values()) / sum(k["n"] for k in ergebnisse.values())
      mittel_der_mittel = statistics.fmean(k["mittelwert"] for k in ergebnisse.values())
      print(f"Ø Bestellwert gesamt {gesamt:.2f} EUR (nicht {mittel_der_mittel:.2f} EUR)")

      shop = [z for z in zeilen if z["kanal"] == "Shop" and z["status"] in ("bezahlt", "retourniert")]
      maerz = sum(z["status"] == "retourniert" for z in shop) / len(shop)
      februar = 0.06
      print(f"Retourenquote Shop {februar:.1%} -> {maerz:.1%}: "
            f"{(maerz - februar) * 100:+.1f} Prozentpunkte, {maerz / februar - 1:+.1%} relativ")
    checklist:
      - Der Steckbrief nennt Grundmenge (nur bezahlt), Quantil-Methode (inklusiv), Stichprobe (n − 1) und dass erst in der Ausgabe gerundet wird.
      - "Shop: n = 12, Mittelwert 67,30, Median 32,90, Standardabweichung 109,61, Q1 26,38, Q3 44,20, IQR 17,83 – in Python und Excel identisch."
      - "B2B: n = 6, Mittelwert 375,13, Median 228,70, Q1 200,70, Q3 262,70."
      - "Ausreißer: 11311 (74,50) und 11312 (412,00) im Shop, 11320 (1 180,00) bei B2B – gelistet, nicht entfernt."
      - "Gesamt-Ø 169,91 EUR aus Σ Umsatz / Σ Bestellungen, nicht 221,22 EUR als Mittel der Kanal-Mittelwerte."
      - "Retourenquote Shop 6,0 % → 7,7 %: +1,7 Prozentpunkte, +28,2 % relativ."
      - Die stornierten Bestellungen 11313 und 11321 fließen in keine Kennzahl ein.
    explanation: |
      Der Steckbrief kommt zuerst, weil er die Entscheidungen festhält, die sonst im Code oder in einer Excel-Einstellung verschwinden: welche Bestellungen zählen, welche Quantil-Methode gilt, ob Stichprobe oder Grundgesamtheit. Mit `method="inclusive"` und `stdev` stimmen Python und Excel (`QUARTILE.INKL`, `STABW.S`) auf den Cent überein. Beide Kanäle sind rechtsschief, der Mittelwert liegt jeweils weit über dem Median – für „typisch“ gehört der Median in den Bericht, für die Umsatzplanung der Mittelwert. Der Gesamtdurchschnitt entsteht aus Summen: 3 058,40 EUR / 18 Bestellungen. Die Ausreißer bleiben in den Daten und werden im Bericht benannt, damit jemand prüfen kann, ob die 1 180 EUR eine echte Großbestellung oder ein Tippfehler sind.
    resources:
      - title: Python · statistics
        url: https://docs.python.org/3/library/statistics.html
      - title: Microsoft · QUARTILE.INKL
        url: https://support.microsoft.com/de-de/office/quartile-inkl-funktion-1bbacc80-5075-42f1-aed6-47d735c4819d
