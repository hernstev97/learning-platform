lesson: |
  Montagsrunde bei Bohnenwerk. Der Vertrieb schlägt vor, die Versandkostenfreigrenze im Webshop auf 60 EUR zu legen: „knapp unter dem durchschnittlichen Bestellwert von 67,30 EUR, das trifft kaum jemanden“. Der Median derselben zwölf Bestellungen liegt bei 32,90 EUR, und zehn von zwölf liegen unter 60 EUR. Die Grenze träfe also fast alle. Der Durchschnitt ist richtig berechnet, er beantwortet nur eine andere Frage: Eine einzige Büro-Bestellung über 412 EUR zieht ihn nach oben.

  Deskriptive Statistik beschreibt Daten mit wenigen Zahlen: Wo liegt die Mitte, wie stark streuen die Werte, was ist ungewöhnlich, wie hängen zwei Größen zusammen? Jede Kennzahl beantwortet eine bestimmte Frage – und Excel, SQL und Python rechnen manche davon mit unterschiedlichen Voreinstellungen. Dieses Modul zeigt, welche Kennzahl zu welcher Frage passt und wie du sie in allen drei Werkzeugen gleich berechnest. Das ist die Voraussetzung dafür, dass im Monatsbericht niemand mehr fragt, warum das Excel-Blatt eine andere Zahl zeigt als das Python-Skript.

  ## Lagemaße: Mittelwert, Median und Modus

  Lagemaße beantworten die Frage „Wo liegt die Mitte?“. Drei sind üblich:

  - **Mittelwert** (arithmetisches Mittel): Summe geteilt durch Anzahl. Er ist der Schwerpunkt der Daten; jeder Wert zieht an ihm, ein extremer Wert stark.
  - **Median**: der mittlere Wert der sortierten Daten, bei gerader Anzahl der Mittelwert der beiden mittleren. Mindestens die Hälfte der Werte liegt auf oder unter ihm, mindestens die Hälfte auf oder über ihm. Wie weit die Extremwerte entfernt sind, spielt keine Rolle.
  - **Modus**: der häufigste Wert. Sinnvoll für Kategorien und kleine ganze Zahlen wie Mengen, bei Beträgen mit Cent fast nutzlos.

  ```python run
  import statistics

  # Nettowert je Webshop-Bestellung am Montag, 16. März 2026 (EUR)
  werte = [18.40, 22.90, 24.50, 27.00, 29.80, 31.20, 34.60, 38.90, 41.50, 52.30, 74.50, 412.00]

  print(f"Mittelwert {statistics.fmean(werte):.2f}, Median {statistics.median(werte):.2f}")
  ohne = werte[:-1]  # ohne die Büro-Bestellung über 412 EUR
  print(f"Mittelwert {statistics.fmean(ohne):.2f}, Median {statistics.median(ohne):.2f}")

  kategorien = ["Espresso", "Filter", "Espresso", "Zubehör", "Filter"]
  print(statistics.mode(kategorien), statistics.multimode(kategorien))
  ```

  Eine Bestellung verschiebt den Mittelwert von 35,96 auf 67,30 EUR, den Median nur von 31,20 auf 32,90 EUR. Diese Unempfindlichkeit heißt **robust**. `statistics.median` mittelt bei gerader Anzahl die beiden mittleren Werte ([statistics.median](https://docs.python.org/3/library/statistics.html#statistics.median)); `mode` liefert bei Gleichstand den ersten häufigsten Wert, `multimode` alle.

  Welches Maß du nimmst, entscheidet die Frage:

  - „Wie viel Umsatz bringen 1 000 Bestellungen?“ – der **Mittelwert**, denn Mittelwert × Anzahl = Summe. Mit dem Median würdest du den Umsatz hier halbieren.
  - „Was gibt eine typische Kundin aus?“ – der **Median**.

  Liegen beide weit auseinander, nenne beide; der Abstand ist selbst eine Information. Liegt der Mittelwert deutlich über dem Median, deutet das auf eine **rechtsschiefe** Verteilung: viele kleine Werte, ein langer Ausläufer nach oben. So sehen fast alle Beträge, Durchlaufzeiten und Bestellungen pro Kunde aus. Linksschief (Mittelwert unter dem Median) ist seltener, etwa bei Bewertungen nahe der Bestnote.

  ```excel
  =MITTELWERT(Bestellungen[wert])
  =MEDIAN(Bestellungen[wert])
  =MODUS.EINF(Positionen[menge])
  ```

  `MITTELWERT` (englisch `AVERAGE`), `MEDIAN` (gleichnamig) und `MODUS.EINF` (`MODE.SNGL`) ignorieren Text und leere Zellen im Bereich, zählen aber Nullen mit ([MEDIAN](https://support.microsoft.com/de-de/office/median-funktion-d0916313-4753-414c-8537-ce85bdd967d2)). Eine `0` als Platzhalter für „unbekannt“ zieht Mittelwert und Median nach unten – ein Problem aus [Datenqualität messen und sichern](/data/datenqualitaet), das hier zum Statistikfehler wird.

  ## Streuung: Spannweite, Varianz und Standardabweichung

  Zwei Kanäle mit demselben Mittelwert von 40 EUR – im einen liegen alle Bestellungen zwischen 35 und 45 EUR, im anderen zwischen 5 und 400 EUR – brauchen verschiedene Entscheidungen. Streuungsmaße machen den Unterschied sichtbar:

  - **Spannweite** = Maximum − Minimum. Schnell berechnet, hängt aber nur an den zwei extremsten Werten.
  - **Varianz**: mittlere quadrierte Abweichung vom Mittelwert. Das Quadrat macht alle Abweichungen positiv und gewichtet große stärker.
  - **Standardabweichung**: die Wurzel aus der Varianz, wieder in der Einheit der Daten (EUR, Prozent, Tage).

  Für Varianz und Standardabweichung gibt es zwei Formeln:

  | | Grundgesamtheit | Stichprobe |
  | --- | --- | --- |
  | Varianz | σ² = Σ(x − μ)² / N | s² = Σ(x − x̄)² / (n − 1) |
  | Excel | `VAR.P`, `STABW.N` (`STDEV.P`) | `VAR.S`, `STABW.S` (`STDEV.S`) |
  | Python `statistics` | `pvariance`, `pstdev` | `variance`, `stdev` |
  | pandas | `std(ddof=0)` | `std()` |
  | PostgreSQL | `stddev_pop` | `stddev_samp`, `stddev` |

  Welche Formel richtig ist, entscheidet die Frage, nicht die Datei. **Grundgesamtheit (N):** Du beschreibst genau diese Werte und willst nichts darüber hinaus sagen – wie stark schwankten die zwölf Monatsumsätze 2026? **Stichprobe (n − 1):** Die Werte stehen für einen größeren Prozess, über den du etwas aussagen willst – die fünf Probechargen der neuen Röstmaschine sollen zeigen, wie stark die Maschine im Dauerbetrieb streut. In der Analyse ist das der häufigere Fall. Deshalb ist `STABW.S` ([STABW.S](https://support.microsoft.com/de-de/office/stabw-s-funktion-7d69cf97-0c1f-4acf-be27-f3e83904cc23)) in Excel die übliche Wahl und `std()` in pandas der Standard.

  ```python run
  import statistics
  import pandas as pd

  verlust = [14.2, 15.1, 13.8, 16.0, 14.4]  # Röstverlust in % je Probecharge
  print(f"Spannweite     {max(verlust) - min(verlust):.1f}")
  print(f"stdev  (n - 1) {statistics.stdev(verlust):.3f}")
  print(f"pstdev (n)     {statistics.pstdev(verlust):.3f}")
  s = pd.Series(verlust)
  print(f"pandas std()   {s.std():.3f}, std(ddof=0) {s.std(ddof=0):.3f}")
  ```

  Bei fünf Werten liegen die beiden Formeln 12 % auseinander (Faktor √(5/4) ≈ 1,118), bei 1 240 Bestellungen nur noch 0,04 %. Die Wahl zählt also genau dort, wo du die wenigsten Daten hast.

  > [!DEEP] Warum n − 1?
  > Die Abweichungen werden vom Stichprobenmittel x̄ gemessen, nicht vom unbekannten wahren Mittel μ. x̄ ist genau der Punkt, der die Summe der quadrierten Abweichungen dieser Werte am kleinsten macht – die Summe fällt also systematisch zu klein aus. Die Division durch n − 1 gleicht das aus: s² ist ein erwartungstreuer Schätzer der Varianz ([statistics.variance](https://docs.python.org/3/library/statistics.html#statistics.variance)). Die Wurzel s unterschätzt σ im Mittel trotzdem leicht.

  > [!WARNING] pandas und NumPy rechnen verschieden
  > `Series.std()` teilt standardmäßig durch n − 1 ([pandas · Series.std](https://pandas.pydata.org/docs/reference/api/pandas.Series.std.html)), NumPys `np.std()` durch n. Wer eine Spalte mit `.to_numpy()` weiterreicht, bekommt stillschweigend die andere Formel. Schreib `ddof` deshalb immer aus.

  Bei schiefen Daten ist die Standardabweichung korrekt, aber schwer zu deuten. Für die zwölf Bestellungen beträgt sie 109,61 EUR; „Mittelwert ± eine Standardabweichung“ reichte von −42 bis 177 EUR, und negative Bestellwerte gibt es nicht. Faustregeln mit s setzen annähernd symmetrische Daten voraus. Schiefe Beträge beschreibst du besser mit Quantilen.

  ## Quantile und IQR: Warum Excel und Python verschiedene Quartile liefern

  Ein **p-Quantil** ist der Wert, unter dem ein Anteil p der Daten liegt. Die **Quartile** Q1, Q2 und Q3 liegen bei 25 %, 50 % (Median) und 75 %. Der **Interquartilsabstand** IQR = Q3 − Q1 ist die Breite der mittleren Hälfte und so robust wie der Median.

  Liegt die gesuchte Position zwischen zwei Werten, wird interpoliert – nach einer von mehreren Konventionen. Zwei begegnen dir ständig (Position in der sortierten Liste, ab 1 gezählt):

  - **Inklusiv:** Position 1 + p·(n − 1). Minimum und Maximum gelten als 0- und 100-%-Quantil. So rechnen `QUANTIL.INKL` und `QUARTILE.INKL` (englisch `PERCENTILE.INC`, `QUARTILE.INC`) und pandas' `quantile()` ([pandas · Series.quantile](https://pandas.pydata.org/docs/reference/api/pandas.Series.quantile.html)).
  - **Exklusiv:** Position p·(n + 1). Die Daten gelten als Stichprobe, deren wahre Extremwerte außerhalb liegen können. So rechnen `QUANTIL.EXKL` und `QUARTILE.EXKL` – und `statistics.quantiles` **als Standard** ([statistics.quantiles](https://docs.python.org/3/library/statistics.html#statistics.quantiles)).

  ```python run
  import statistics
  import pandas as pd

  daten = [1, 2, 4, 7, 8, 9, 10, 12]  # Beispiel aus der Excel-Hilfe zu QUARTILE.INKL
  print(statistics.quantiles(daten))                      # Standard: exclusive
  print(statistics.quantiles(daten, method="inclusive"))  # wie QUARTILE.INKL
  print(pd.Series(daten).quantile([0.25, 0.5, 0.75]).tolist())
  ```

  Microsoft gibt für `=QUARTILE.INKL(A2:A9;1)` mit diesen Daten 3,5 an ([QUARTILE.INKL](https://support.microsoft.com/de-de/office/quartile-inkl-funktion-1bbacc80-5075-42f1-aed6-47d735c4819d)); Python liefert ohne Parameter 2,5. Beide Zahlen sind richtig, sie folgen verschiedenen Definitionen. Bei großen Datenmengen schrumpft der Unterschied, bei kleinen ist er deutlich.

  > [!MERKE]
  > Leg die Quantil-Methode fest und schreib sie in den Kennzahlensteckbrief. Soll Python mit Excel übereinstimmen, gehört `method="inclusive"` zu `QUARTILE.INKL`.

  **Ausreißer** findest du robust mit den Grenzen nach Tukey: Werte unter Q1 − 1,5 · IQR oder über Q3 + 1,5 · IQR sind Kandidaten. Bei den zwölf Bestellungen hängt das Ergebnis an der Methode:

  ```python run
  import statistics

  werte = [18.40, 22.90, 24.50, 27.00, 29.80, 31.20, 34.60, 38.90, 41.50, 52.30, 74.50, 412.00]
  for methode in ["exclusive", "inclusive"]:
      q1, _, q3 = statistics.quantiles(werte, method=methode)
      oben = q3 + 1.5 * (q3 - q1)
      print(f"{methode:9}  Q1 {q1:.3f}  Q3 {q3:.3f}  Grenze {oben:.3f}",
            [w for w in werte if w > oben])
  ```

  Mit `QUARTILE.INKL` ist die Bestellung über 74,50 EUR auffällig, mit dem Python-Standard nicht. Bevor jemand über „auffällige Bestellungen“ diskutiert, muss die Methode feststehen. Und: Ein Ausreißer ist ein Prüfauftrag, kein Löschauftrag. Die 412 EUR sind eine echte Büro-Bestellung und gehören zum Umsatz. Prüfe den Wert, weise ihn bei Bedarf getrennt aus und nutze robuste Maße – aber lösche ihn nie still.

  ```excel
  =QUARTILE.INKL(Bestellungen[wert];3)-QUARTILE.INKL(Bestellungen[wert];1)
  =QUANTIL.INKL(Bestellungen[wert];0,9)
  ```

  ## Statistik in SQL: Aggregate, Standardabweichung und Median

  SQL bringt `COUNT`, `SUM`, `AVG`, `MIN` und `MAX` mit. `AVG` ignoriert `NULL` und liefert in SQLite immer eine Gleitkommazahl ([SQLite · avg](https://sqlite.org/lang_aggfunc.html#avg)); `SUM(menge) / COUNT(*)` ist bei ganzzahligen Spalten dagegen eine Ganzzahldivision und zählt Zeilen mit `NULL` im Nenner mit. Eine Standardabweichung kennt SQLite nicht, und `median()` gibt es erst seit SQLite 3.51 und nur, wenn es beim Kompilieren aktiviert wurde – im Browser läuft 3.39. Beides baust du aus Bausteinen:

  ```sql run
  CREATE TABLE bestellwerte (bestellung_id INTEGER, kanal TEXT, wert REAL);
  INSERT INTO bestellwerte VALUES
    (11301, 'Shop', 18.40), (11302, 'Shop', 22.90), (11303, 'Shop', 24.50),
    (11304, 'Shop', 27.00), (11305, 'Shop', 29.80), (11306, 'Shop', 31.20),
    (11307, 'Shop', 34.60), (11308, 'Shop', 38.90), (11309, 'Shop', 41.50),
    (11310, 'Shop', 52.30), (11311, 'Shop', 74.50), (11312, 'Shop', 412.00),
    (11315, 'B2B', 148.00), (11316, 'B2B', 196.80), (11317, 'B2B', 212.40),
    (11318, 'B2B', 245.00), (11319, 'B2B', 268.60);

  -- Stichproben-Standardabweichung: erst der Mittelwert je Kanal, dann die Abweichungen
  WITH m AS (
    SELECT kanal, AVG(wert) AS mittel FROM bestellwerte GROUP BY kanal
  )
  SELECT b.kanal,
         COUNT(*) AS n,
         ROUND(m.mittel, 2) AS mittelwert,
         ROUND(SQRT(SUM((b.wert - m.mittel) * (b.wert - m.mittel)) / (COUNT(*) - 1)), 2) AS stabw_s
  FROM bestellwerte AS b
  JOIN m ON m.kanal = b.kanal
  GROUP BY b.kanal, m.mittel;

  -- Median: die mittlere Zeile (oder die beiden mittleren) je Kanal
  WITH geordnet AS (
    SELECT kanal, wert,
           ROW_NUMBER() OVER (PARTITION BY kanal ORDER BY wert) AS rang,
           COUNT(*) OVER (PARTITION BY kanal) AS n
    FROM bestellwerte
  )
  SELECT kanal, AVG(wert) AS median
  FROM geordnet
  WHERE rang IN ((n + 1) / 2, (n + 2) / 2)
  GROUP BY kanal;
  ```

  Der Median nutzt Fensterfunktionen, die in [Fensterfunktionen und Analysemuster](/data/sql-fensterfunktionen) ausführlich vorkommen. Hier reicht: Jede Zeile bekommt ihren Rang im Kanal, übrig bleiben die mittleren Ränge, `AVG` mittelt sie. Die Ganzzahldivision hilft ausnahmsweise: Bei n = 5 ergeben `(n + 1) / 2` und `(n + 2) / 2` beide 3, bei n = 12 sind es 6 und 7. `SQRT` gehört zu den Mathematikfunktionen von SQLite ([SQLite · Mathematische Funktionen](https://sqlite.org/lang_mathfunc.html)). PostgreSQL bringt `stddev_samp` und `percentile_cont(0.5) WITHIN GROUP (ORDER BY wert)` mit; `percentile_cont` interpoliert wie `QUANTIL.INKL`.

  ## Anteile und Durchschnitte richtig zusammenfassen

  Ein Anteil ist Teil durch Ganzes. Schwierig ist der Nenner: Bezieht sich die Retourenquote auf alle Bestellungen, auf bezahlte oder auf versendete? Jede Variante ist vertretbar, aber nur eine gehört in die Definition – sonst vergleicht der Monatsbericht jeden Monat etwas anderes.

  **Prozent und Prozentpunkte.** Steigt die Retourenquote von 4,0 % auf 5,0 %, ist der Unterschied zweier Prozentwerte +1,0 **Prozentpunkte**. Relativ ist sie um 5,0 / 4,0 − 1 = +25 % gestiegen. Beides stimmt; „um 1 % gestiegen“ ist falsch. Prozentänderungen heben sich auch nicht auf: +50 % und danach −50 % machen aus 100 nicht 100, sondern 75.

  **Gewichteter Mittelwert.** Im März hatte der Shop 1 050 Bestellungen mit durchschnittlich 38,20 EUR, der B2B-Kanal 190 mit 245,00 EUR. Der Mittelwert der beiden Durchschnitte (141,60 EUR) tut so, als hätten beide Kanäle gleich viele Bestellungen. Richtig ist Gesamtumsatz durch Gesamtzahl:

  ```python run
  alt, neu = 42 / 1050, 60 / 1200  # Retourenquote Februar und März
  print(f"{alt:.1%} -> {neu:.1%}: {(neu - alt) * 100:+.1f} Prozentpunkte, {neu / alt - 1:+.1%} relativ")

  kanaele = {"Shop": (1050, 38.20), "B2B": (190, 245.00)}  # Bestellungen, Ø Bestellwert
  mittel_der_mittel = sum(d for _, d in kanaele.values()) / len(kanaele)
  umsatz = sum(n * d for n, d in kanaele.values())
  bestellungen = sum(n for n, _ in kanaele.values())
  print(f"Mittel der Mittel {mittel_der_mittel:.2f} EUR, gewichtet {umsatz / bestellungen:.2f} EUR")
  ```

  Die Regel dahinter: Summen und Anzahlen darfst du zusammenzählen, Durchschnitte und Quoten nicht. Du berechnest sie neu aus den Summen – Σ Umsatz / Σ Bestellungen, Σ Retouren / Σ Bestellungen. In Python nimmt `statistics.fmean` dafür seit Version 3.11 den Parameter `weights`, in Excel hilft `SUMMENPRODUKT` (englisch `SUMPRODUCT`) ([SUMMENPRODUKT](https://support.microsoft.com/de-de/office/summenprodukt-funktion-16753e75-9f68-4874-94ac-4d2145a2fd2e)):

  ```excel
  =SUMMENPRODUKT(Kanaele[bestellungen];Kanaele[durchschnitt])/SUMME(Kanaele[bestellungen])
  ```

  > [!PRAXIS] Kennzahlensteckbrief statt Methodenstreit
  > Bei Bohnenwerk rechnete das Controlling in Excel, der Vertriebsinnendienst in Python. Im Monatsmeeting stand für dasselbe Quartil regelmäßig 26,38 gegen 25,12 EUR, und die erste halbe Stunde ging für die Frage drauf, welche Zahl stimmt. Seit jede Kennzahl einen Steckbrief hat, rechnen Excel-Blatt, SQL-Abfrage und Python-Skript gleich, und das Meeting beginnt mit den Zahlen statt mit der Methode.

  ```text
  Kennzahl     Typischer Bestellwert Webshop
  Definition   Median des Nettowerts je Bestellung (Summe der Positionen, ohne Versand)
  Grundmenge   kanal = 'Shop', status = 'bezahlt', Bestelldatum im Berichtsmonat
  Streuung     Q1, Q3 und IQR, inklusiv (Excel QUARTILE.INKL, Python method="inclusive")
  Ausreißer    außerhalb Q1 − 1,5 · IQR bis Q3 + 1,5 · IQR: auflisten, nicht entfernen
  Rundung      zwei Nachkommastellen erst in der Ausgabe
  ```

  ## Zusammenhänge: Korrelation, Kausalität und das Simpson-Paradoxon

  Der Korrelationskoeffizient r nach Pearson misst, wie stark zwei Größen linear zusammenhängen: +1 ist eine perfekt steigende Gerade, −1 eine fallende, 0 kein linearer Zusammenhang. Python rechnet ihn mit [`statistics.correlation`](https://docs.python.org/3/library/statistics.html#statistics.correlation), Excel mit `KORREL` (englisch `CORREL`).

  ```python run
  import statistics

  # B2B-Kunden 2026: Lieferungen, Support-Tickets, Umsatz in Tsd. EUR
  lieferungen = [4, 6, 9, 12, 15, 20, 26, 32]
  tickets = [1, 1, 2, 2, 3, 4, 5, 7]
  umsatz = [2.1, 3.4, 4.8, 6.9, 8.2, 11.5, 14.1, 17.9]

  print(f"r(Tickets, Umsatz)     {statistics.correlation(tickets, umsatz):.2f}")
  quote = [t / l * 10 for t, l in zip(tickets, lieferungen)]  # Tickets je 10 Lieferungen
  print(f"r(Ticketquote, Umsatz) {statistics.correlation(quote, umsatz):.2f}")
  ```

  Tickets und Umsatz korrelieren mit r = 0,99. Bringt Support Umsatz? Nein: Beide hängen an einer dritten Größe, der Zahl der Lieferungen. Jede Lieferung bringt Umsatz und die Chance auf ein Ticket. Bezogen auf die Lieferungen verschwindet der Zusammenhang (r = −0,04). Eine solche gemeinsame Ursache heißt **Störvariable** (englisch *Confounder*). Korrelation zeigt, dass zwei Größen gemeinsam schwanken, nicht warum. Ursachen belegen Experimente wie ein A/B-Test oder Vergleiche innerhalb vergleichbarer Gruppen. Zwei weitere Grenzen: r erfasst nur lineare Zusammenhänge, und ein einzelner Extremwert kann ein hohes r erzeugen. `correlation(…, method="ranked")` rechnet seit Python 3.12 die robustere Rangkorrelation nach Spearman. Schau dir die Punktwolke immer an ([Visualisierung](/data/visualisierung)).

  Das **Simpson-Paradoxon** ist der schärfste Fall: Ein Zusammenhang, der in jeder Gruppe gilt, kehrt sich um, sobald du die Gruppen zusammenfasst. Bohnenwerk vergleicht zwei Paketdienste:

  ```python run
  sendungen = {  # (Dienstleister, Gebiet): (Sendungen, pünktlich)
      ("Paketblitz", "Stadt"): (100, 90),
      ("Paketblitz", "Land"): (400, 300),
      ("Rheinkurier", "Stadt"): (400, 340),
      ("Rheinkurier", "Land"): (100, 70),
  }
  for dienst in ["Paketblitz", "Rheinkurier"]:
      teile = {g: sendungen[(dienst, g)] for g in ["Stadt", "Land"]}
      n = sum(s for s, _ in teile.values())
      p = sum(q for _, q in teile.values())
      einzeln = ", ".join(f"{g} {q / s:.0%}" for g, (s, q) in teile.items())
      print(f"{dienst:12} {einzeln}, gesamt {p / n:.0%}")
  ```

  Paketblitz ist in der Stadt pünktlicher (90 % gegen 85 %) und auf dem Land auch (75 % gegen 70 %) – und insgesamt schlechter (78 % gegen 82 %). Der Grund ist der Mix: Paketblitz fährt 80 % seiner Sendungen aufs Land, wo alle langsamer sind, Rheinkurier 80 % in die Stadt. Die Gesamtquote ist ein gewichteter Mittelwert mit verschiedenen Gewichten und vergleicht vor allem den Mix. Fair vergleichst du je Gebiet oder mit demselben Mix für beide.

  > [!INTERVIEW] „Mittelwert oder Median?“
  > Das hängt von der Frage ab. Für Summen und Planung den Mittelwert, weil Mittelwert mal Anzahl die Summe ergibt. Für „typisch“ bei schiefen Daten wie Bestellwerten oder Durchlaufzeiten den Median, weil einzelne Extremwerte ihn kaum bewegen. Liegen beide weit auseinander, nenne ich beide – der Abstand zeigt die Schiefe. Die Streuung beschreibe ich dann mit Quartilen und IQR und sage dazu, welche Quantil-Methode ich verwende.

  ## Häufige Fehler

  - **Mittelwert als „typisch“ bei schiefen Daten.** Eine Großbestellung verdoppelt den Durchschnitt. Median dazu nennen.
  - **Median mal Anzahl als Umsatz.** Nur der Mittelwert ergibt mit der Anzahl die Summe.
  - **Stichprobe und Grundgesamtheit verwechselt.** `STABW.N` für fünf Probechargen unterschätzt die Streuung um gut 10 %. Und `np.std` rechnet mit n, `Series.std` mit n − 1.
  - **Quantil-Methode nicht festgelegt.** Excel und Python widersprechen sich, und plötzlich ist ein Wert Ausreißer oder nicht. `method="inclusive"` zu `QUARTILE.INKL`.
  - **Durchschnitt von Durchschnitten.** Quoten und Mittelwerte aus Summen neu berechnen, nicht mitteln.
  - **Prozent und Prozentpunkte vermischt.** Von 4 % auf 5 % sind +1 Prozentpunkt oder +25 %, nie „+1 %“.
  - **0 statt leer.** Eine `0` für „unbekannt“ zieht Mittelwert und Median nach unten; ebenso `AVG(COALESCE(x, 0))`.
  - **Ausreißer löschen.** Prüfen, getrennt ausweisen, robuste Maße nutzen.

  ## Zusammenfassung

  - Der Mittelwert ergibt mit der Anzahl die Summe, der Median beschreibt das Typische und ist robust; ihr Abstand zeigt die Schiefe.
  - Standardabweichung mit n − 1 für Stichproben (`STABW.S`, `stdev`, pandas `std()`), mit n für Grundgesamtheiten (`STABW.N`, `pstdev`, `np.std`).
  - Quantile haben mehrere Definitionen: `statistics.quantiles` rechnet standardmäßig exklusiv, Excel `QUARTILE.INKL` und pandas inklusiv.
  - Ausreißer nach Tukey liegen außerhalb Q1 − 1,5 · IQR bis Q3 + 1,5 · IQR – ein Prüfauftrag, kein Löschauftrag.
  - SQLite 3.39 kennt keinen Median und keine Standardabweichung; beides entsteht aus `AVG`, `SQRT` und Fensterfunktionen.
  - Differenzen von Prozentwerten sind Prozentpunkte. Durchschnitte und Quoten fasst du über Summen zusammen, nicht über Mittelwerte.
  - Korrelation ist keine Ursache; Störvariablen und das Simpson-Paradoxon drehen Aussagen um, wenn Gruppen vermischt werden.
exercises:
  - id: mittelwert-median-schief
    type: choice
    title: 33,90 gegen 66,50
    prompt: |
      Für die 1 050 bezahlten Webshop-Bestellungen im März meldet das Skript: Median 33,90 EUR, Mittelwert 66,50 EUR. Welche Aussagen folgen daraus?
    options:
      - text: Mindestens die Hälfte der Bestellungen liegt unter dem Mittelwert.
        correct: true
        why: Mindestens die Hälfte liegt bei höchstens 33,90 EUR und damit unter 66,50 EUR.
      - text: Der Umsatz dieser Bestellungen beträgt 1 050 × 66,50 EUR = 69 825 EUR.
        correct: true
        why: Mittelwert mal Anzahl ergibt immer die Summe – dafür ist der Mittelwert gemacht.
      - text: Die Verteilung ist linksschief.
        correct: false
        why: Der Mittelwert liegt weit über dem Median; ein langer Ausläufer nach oben zieht ihn hoch. Das ist rechtsschief.
      - text: Eine Versandkostenfreigrenze von 60 EUR liegt unter dem typischen Bestellwert.
        correct: false
        why: Typisch ist der Median von 33,90 EUR. Mindestens die Hälfte der Bestellungen liegt unter 60 EUR.
      - text: Fiele die größte Bestellung weg, sänke der Median stärker als der Mittelwert.
        correct: false
        why: Umgekehrt. Der Median verschiebt sich höchstens um einen Rang, der Mittelwert verliert den ganzen Beitrag des Extremwerts.
    explanation: |
      Mittelwert und Median beantworten verschiedene Fragen. Der Mittelwert ist für Summen gebaut: Mal Anzahl ergibt er den Umsatz, deshalb gehört er in die Planung. Der Median beschreibt die typische Bestellung und ist robust gegen einzelne Großbestellungen. Liegt der Mittelwert fast doppelt so hoch wie der Median, ist die Verteilung stark rechtsschief – wenige große Bestellungen, viele kleine. Wer dann „Durchschnitt“ als „typisch“ liest, legt Grenzen und Ziele an der Kundschaft vorbei.
    resources:
      - title: Python · statistics.median
        url: https://docs.python.org/3/library/statistics.html#statistics.median
      - title: Python · statistics.fmean
        url: https://docs.python.org/3/library/statistics.html#statistics.fmean

  - id: stichprobe-oder-grundgesamtheit
    type: choice
    title: n oder n − 1?
    prompt: In welchen Fällen ist die Stichprobenformel (`STABW.S`, `statistics.stdev`, Division durch n − 1) die richtige Wahl?
    options:
      - text: Du hast den Röstverlust von 8 Testchargen gemessen und willst abschätzen, wie stark die neue Maschine im Dauerbetrieb streut.
        correct: true
        why: Die 8 Chargen stehen für alle künftigen Chargen. Du schließt von einer Stichprobe auf den Prozess.
      - text: Du ziehst 200 zufällige Sendungen aus 12 000 und willst die Streuung der Lieferzeit aller Sendungen des Jahres angeben.
        correct: true
        why: Die 200 Sendungen sind eine Stichprobe, die Aussage gilt der Grundgesamtheit von 12 000.
      - text: Du beschreibst nur, wie stark genau die zwölf Monatsumsätze 2026 schwankten, und überträgst nichts auf andere Jahre.
        correct: false
        why: Hier sind die zwölf Werte selbst die Grundgesamtheit deiner Frage. `STABW.N` beschreibt sie exakt.
      - text: Du willst eine möglichst kleine Standardabweichung berichten.
        correct: false
        why: Die Formel folgt der Frage, nicht dem gewünschten Ergebnis. Die Stichprobenformel liefert außerdem den größeren Wert.
    explanation: |
      Entscheidend ist, worüber du etwas aussagen willst. Stehen deine Werte für einen größeren Prozess oder eine größere Menge, schätzt du dessen Streuung, und die Division durch n − 1 gleicht aus, dass die Abweichungen vom Stichprobenmittel systematisch zu klein ausfallen. Beschreibst du genau die vorliegenden Werte und sonst nichts, sind sie die Grundgesamtheit, und du teilst durch N. Bei kleinen n ist der Unterschied erheblich, bei Tausenden von Werten verschwindet er.
    resources:
      - title: Microsoft · STABW.S
        url: https://support.microsoft.com/de-de/office/stabw-s-funktion-7d69cf97-0c1f-4acf-be27-f3e83904cc23
      - title: Microsoft · STABW.N
        url: https://support.microsoft.com/de-de/office/stabw-n-funktion-6e917c05-31a0-496f-ade7-4f4e7462f285

  - id: quantil-methoden
    type: output
    title: Zwei Methoden, zwei Quartile
    prompt: |
      Das Skript beschreibt, wie viele Stunden es dauert, bis ein Support-Ticket geschlossen ist. Was gibt es aus?
    lang: python
    code: |
      import statistics

      stunden = [2, 3, 5, 8, 12, 20]
      print(statistics.quantiles(stunden))
      print(statistics.quantiles(stunden, method="inclusive"))
      print(statistics.median(stunden))
    expected: |
      [2.75, 6.5, 14.0]
      [3.5, 6.5, 11.0]
      6.5
    hints:
      - Ohne `method` rechnet `statistics.quantiles` exklusiv. Die Position des p-Quantils ist dann p · (n + 1), gezählt ab 1.
      - "Exklusiv: Q1 liegt bei Position 1,75, also zwischen 2 und 3. Inklusiv: Position 1 + p · (n − 1) = 2,25, also zwischen 3 und 5."
    explanation: |
      Bei n = 6 liegt Q1 exklusiv an Position 0,25 · 7 = 1,75: drei Viertel des Wegs von 2 nach 3, also 2,75. Q3 an Position 5,25: ein Viertel des Wegs von 12 nach 20, also 14,0. Inklusiv liegen die Positionen bei 1 + 0,25 · 5 = 2,25 (zwischen 3 und 5 → 3,5) und 4,75 (zwischen 8 und 12 → 11,0). Der Median ist bei beiden gleich, (5 + 8) / 2 = 6,5. Der IQR unterscheidet sich deutlich: 11,25 gegen 7,5 Stunden – bei so wenigen Werten verändert die Methode jede Ausreißergrenze.
    resources:
      - title: Python · statistics.quantiles
        url: https://docs.python.org/3/library/statistics.html#statistics.quantiles

  - id: avg-und-null
    type: output
    title: Durchschnitt mit Lücken
    prompt: |
      Kunden können eine Bestellung mit 1 bis 5 Sternen bewerten; wer nicht bewertet, steht mit `NULL` in der Tabelle. Was gibt das Skript aus? Schreib die Ausgabe wie die `sqlite3`-Kommandozeile im Standardmodus: Werte einer Zeile durch `|` getrennt, keine Kopfzeile.
    lang: sql
    code: |
      CREATE TABLE bewertungen (bestellung_id INTEGER, sterne INTEGER);
      INSERT INTO bewertungen VALUES (11401, 5), (11402, 4), (11403, NULL), (11404, 3), (11405, 5);

      SELECT AVG(sterne), SUM(sterne) / COUNT(*), COUNT(*), COUNT(sterne)
      FROM bewertungen;

      SELECT ROUND(AVG(COALESCE(sterne, 0)), 2)
      FROM bewertungen;
    expected: |
      4.25|3|5|4
      3.4
    hints:
      - "`AVG` und `COUNT(sterne)` überspringen `NULL`, `COUNT(*)` zählt jede Zeile."
      - "`SUM` über ganze Zahlen ist eine ganze Zahl – und ganze Zahl durch ganze Zahl bleibt in SQLite eine ganze Zahl."
    explanation: |
      `AVG` teilt die Summe 17 durch die vier vorhandenen Bewertungen: 4.25, als Gleitkommazahl. `SUM(sterne) / COUNT(*)` macht gleich zwei Fehler: Es teilt durch fünf Zeilen, obwohl nur vier bewertet haben, und rechnet `17 / 5` als Ganzzahldivision – heraus kommt 3. Die zweite Abfrage ersetzt die fehlende Bewertung durch 0, als hätte jemand null Sterne vergeben, und drückt den Schnitt auf 3.4. Ob `NULL` fehlt oder 0 bedeutet, ist eine fachliche Entscheidung, keine technische.
    resources:
      - title: SQLite · avg
        url: https://sqlite.org/lang_aggfunc.html#avg
      - title: SQLite · count
        url: https://sqlite.org/lang_aggfunc.html#count

  - id: median-mit-text
    type: output
    title: Was zeigen die Zellen?
    prompt: |
      Ein Export wurde nach Excel kopiert. In Spalte B stehen die Bestellwerte; B4 enthält den Text „n/a“, B5 eine 0, B6 ist leer.

      | | A | B |
      | --- | --- | --- |
      | 1 | bestellung_id | wert |
      | 2 | 11201 | 24 |
      | 3 | 11202 | 31 |
      | 4 | 11203 | n/a |
      | 5 | 11204 | 0 |
      | 6 | 11205 | |
      | 7 | 11206 | 58 |
      | 8 | 11207 | 40 |

      In D2, D3 und D4 stehen die drei Formeln unten. Was zeigen die Zellen D2, D3 und D4 (eine Zeile pro Zelle, Zahlenformat „Standard“)?
    lang: excel
    code: |
      =MEDIAN(B2:B8)
      =MITTELWERT(B2:B8)
      =ANZAHL(B2:B8)
    expected: |
      31
      30,6
      5
    accept:
      - |
        31
        30.6
        5
    hints:
      - Text und leere Zellen in einem Bezug überspringen alle drei Funktionen. Eine 0 ist aber eine Zahl.
      - "Übrig bleiben 24, 31, 0, 58 und 40."
    explanation: |
      `MEDIAN` und `MITTELWERT` (englisch `AVERAGE`) ignorieren in Bezügen Text und leere Zellen, zählen aber Nullen mit; `ANZAHL` (englisch `COUNT`) zählt nur Zahlen. Es bleiben fünf Werte: 0, 24, 31, 40, 58. Der Median ist der dritte, 31, der Mittelwert 153 / 5 = 30,6. Die 0 in B5 ist vermutlich ein Platzhalter für „unbekannt“ – sie drückt den Mittelwert um fast 8 EUR, während „n/a“ spurlos verschwindet. Beides fällt im Ergebnis nicht auf; deshalb gehört die Prüfung der Rohdaten vor jede Kennzahl.
    resources:
      - title: Microsoft · MEDIAN
        url: https://support.microsoft.com/de-de/office/median-funktion-d0916313-4753-414c-8537-ce85bdd967d2
      - title: Microsoft · MITTELWERT
        url: https://support.microsoft.com/de-de/office/mittelwert-funktion-047bac88-d466-426c-a32b-8f33eb960cf6

  - id: kennzahlen-formeln
    type: gap
    title: Das Kennzahlenblatt in Excel
    prompt: |
      Das Kennzahlenblatt soll dieselben Zahlen liefern wie das Python-Skript mit `statistics.stdev` und `method="inclusive"`. Ergänze die Formeln für

      1. den typischen Bestellwert (robust gegen Großbestellungen),
      2. die Standardabweichung als Stichprobe,
      3. den Interquartilsabstand,
      4. den gewichteten Durchschnitt über die Kanäle aus der Tabelle `Kanaele` (Spalten `bestellungen` und `durchschnitt`).

      Deutsche und englische Funktionsnamen werden beide akzeptiert.
    lang: excel
    code: |
      =⟦MEDIAN⟧(Bestellungen[wert])
      =⟦STABW.S⟧(Bestellungen[wert])
      =QUARTILE.INKL(Bestellungen[wert];⟦3⟧)-QUARTILE.INKL(Bestellungen[wert];⟦1⟧)
      =SUMMENPRODUKT(Kanaele[bestellungen];Kanaele[durchschnitt])/⟦SUMME(Kanaele[bestellungen])⟧
    gaps:
      - label: Typischer Wert
        hint: Der mittlere Wert der sortierten Daten; die Funktion heißt auf Deutsch und Englisch gleich.
      - label: Standardabweichung
        hint: Die aktuelle Funktion für eine Stichprobe endet auf `.S`.
      - label: Oberes Quartil
        hint: "`QUARTILE.INKL` nimmt die Nummer des Quartils: 1 für 25 %, 2 für den Median, 3 für 75 %."
      - label: Unteres Quartil
        hint: Das Quartil bei 25 %.
      - label: Nenner
        hint: Wodurch teilst du die Summe aus Bestellungen mal Durchschnitt, damit ein Durchschnitt pro Bestellung herauskommt?
    explanation: |
      `MEDIAN` beschreibt die typische Bestellung. `STABW.S` (englisch `STDEV.S`) teilt durch n − 1 wie `statistics.stdev`. `QUARTILE.INKL` (`QUARTILE.INC`) interpoliert wie `method="inclusive"`; die Differenz von drittem und erstem Quartil ist der IQR. `SUMMENPRODUKT` (`SUMPRODUCT`) multipliziert Bestellungen und Durchschnitt zeilenweise und summiert – das ist der Gesamtumsatz; geteilt durch die Summe der Bestellungen ergibt sich der gewichtete Durchschnitt. `MITTELWERT(Kanaele[durchschnitt])` wäre der Mittelwert der Mittelwerte und würde jeden Kanal gleich gewichten.
    resources:
      - title: Microsoft · QUARTILE.INKL
        url: https://support.microsoft.com/de-de/office/quartile-inkl-funktion-1bbacc80-5075-42f1-aed6-47d735c4819d
      - title: Microsoft · SUMMENPRODUKT
        url: https://support.microsoft.com/de-de/office/summenprodukt-funktion-16753e75-9f68-4874-94ac-4d2145a2fd2e

  - id: kennzahlen-je-kanal
    type: sql
    title: Lage und Streuung je Kanal
    prompt: |
      Berechne für jeden Kanal Kennzahlen über die **bezahlten** Bestellungen. Spalten:

      - `kanal`
      - `anzahl` – Zahl der bezahlten Bestellungen
      - `mittelwert` – Mittelwert von `wert`
      - `spannweite` – größter minus kleinster Wert
      - `stabw` – Standardabweichung als **Stichprobe** (Division durch n − 1)

      `mittelwert`, `spannweite` und `stabw` auf zwei Nachkommastellen gerundet. Sortiere nach `kanal`. SQLite kennt keine Funktion für die Standardabweichung, aber `SQRT`.
    schema: |
      CREATE TABLE bestellungen (bestellung_id INTEGER, kanal TEXT, status TEXT, wert REAL);
      INSERT INTO bestellungen VALUES
        (11401, 'Shop', 'bezahlt', 24.50),
        (11402, 'Shop', 'bezahlt', 31.20),
        (11403, 'B2B', 'bezahlt', 212.40),
        (11404, 'Shop', 'storniert', 310.00),
        (11405, 'Shop', 'bezahlt', 38.90),
        (11406, 'B2B', 'bezahlt', 148.00),
        (11407, 'Shop', 'bezahlt', 27.00),
        (11408, 'B2B', 'retourniert', 96.00),
        (11409, 'B2B', 'bezahlt', 268.90),
        (11410, 'Shop', 'bezahlt', 52.30),
        (11411, 'B2B', 'bezahlt', 245.10),
        (11412, 'Shop', 'retourniert', 18.40);
    starter: |
      SELECT kanal,
             COUNT(*) AS anzahl,
             ROUND(AVG(wert), 2) AS mittelwert
      FROM bestellungen
      GROUP BY kanal
      ORDER BY kanal;
    solution: |
      WITH m AS (
        SELECT kanal, AVG(wert) AS mittel
        FROM bestellungen
        WHERE status = 'bezahlt'
        GROUP BY kanal
      )
      SELECT b.kanal,
             COUNT(*) AS anzahl,
             ROUND(m.mittel, 2) AS mittelwert,
             ROUND(MAX(b.wert) - MIN(b.wert), 2) AS spannweite,
             ROUND(SQRT(SUM((b.wert - m.mittel) * (b.wert - m.mittel)) / (COUNT(*) - 1)), 2) AS stabw
      FROM bestellungen AS b
      JOIN m ON m.kanal = b.kanal
      WHERE b.status = 'bezahlt'
      GROUP BY b.kanal, m.mittel
      ORDER BY b.kanal;
    ordered: true
    hints:
      - Filtere zuerst auf `status = 'bezahlt'` – die Stornierung über 310 EUR verzerrt sonst Mittelwert und Spannweite.
      - Für die Standardabweichung brauchst du in jeder Zeile den Mittelwert ihres Kanals. Berechne ihn in einer CTE (`WITH m AS (…)`) und verbinde sie über `kanal`.
      - "`SQRT(SUM((b.wert - m.mittel) * (b.wert - m.mittel)) / (COUNT(*) - 1))` – auch in der CTE nur bezahlte Bestellungen."
    explanation: |
      Die Stichproben-Standardabweichung ist die Wurzel aus der Summe der quadrierten Abweichungen vom Mittelwert, geteilt durch n − 1. Weil jede Zeile den Mittelwert ihres Kanals braucht, entsteht er zuerst in einer CTE, danach werden die Abweichungen je Kanal summiert. Der Filter auf bezahlte Bestellungen muss an beiden Stellen stehen, sonst rechnet der Mittelwert mit Stornos und die Abweichungen ohne. `m.mittel` steht im `GROUP BY`, damit die Abfrage auch in strengeren Datenbanken wie PostgreSQL gültig ist – dort gäbe es mit `stddev_samp(wert)` allerdings eine fertige Funktion.
    resources:
      - title: SQLite · Mathematische Funktionen
        url: https://sqlite.org/lang_mathfunc.html
      - title: SQLite · WITH (Common Table Expressions)
        url: https://sqlite.org/lang_with.html

  - id: puenktlichkeit-gesamt
    type: sql
    title: Welcher Paketdienst ist pünktlicher?
    prompt: |
      Die Tabelle `lieferstatistik` enthält pro Paketdienst und Gebiet die Zahl der Sendungen und davon pünktlich zugestellte. Berechne die Pünktlichkeitsquote je Paketdienst über **alle** Sendungen.

      Spalten: `dienstleister`, `sendungen` (Summe) und `quote` (pünktliche Sendungen in Prozent, eine Nachkommastelle). Sortiere nach `quote` absteigend.
    schema: |
      CREATE TABLE lieferstatistik (dienstleister TEXT, gebiet TEXT, sendungen INTEGER, puenktlich INTEGER);
      INSERT INTO lieferstatistik VALUES
        ('Paketblitz', 'Stadt', 100, 90),
        ('Paketblitz', 'Land', 400, 300),
        ('Rheinkurier', 'Stadt', 400, 340),
        ('Rheinkurier', 'Land', 100, 70);
    starter: |
      SELECT dienstleister, gebiet,
             ROUND(100.0 * puenktlich / sendungen, 1) AS quote
      FROM lieferstatistik;
    solution: |
      SELECT dienstleister,
             SUM(sendungen) AS sendungen,
             ROUND(100.0 * SUM(puenktlich) / SUM(sendungen), 1) AS quote
      FROM lieferstatistik
      GROUP BY dienstleister
      ORDER BY quote DESC;
    ordered: true
    hints:
      - Eine Quote über mehrere Zeilen entsteht aus Summen, nicht aus dem Durchschnitt der Einzelquoten.
      - "`SUM(puenktlich) / SUM(sendungen)` ist in SQLite eine Ganzzahldivision. Beginne mit `100.0 *`."
    explanation: |
      Die Gesamtquote ist Σ pünktlich / Σ Sendungen: 390 / 500 = 78,0 % für Paketblitz, 410 / 500 = 82,0 % für Rheinkurier. Wer stattdessen `AVG(100.0 * puenktlich / sendungen)` rechnet, mittelt die Gebietsquoten, als hätte jedes Gebiet gleich viele Sendungen: 82,5 % gegen 77,5 % – die Reihenfolge dreht sich um. Richtig ist die Summenrechnung. Aber auch sie sagt nicht, wer besser zustellt: Paketblitz ist in jedem Gebiet pünktlicher und liegt gesamt nur hinten, weil er vor allem aufs Land fährt. Das ist das Simpson-Paradoxon; welche Zahl die Entscheidung trägt, hängt davon ab, welche Sendungen künftig wer übernimmt.
    resources:
      - title: SQLite · Aggregatfunktionen
        url: https://sqlite.org/lang_aggfunc.html
      - title: SQLite · SELECT (GROUP BY)
        url: https://sqlite.org/lang_select.html#resultset

  - id: beschreibe-werte
    type: code
    title: Kennzahlen wie im Steckbrief
    prompt: |
      Schreibe `beschreibe(werte)` für den Kennzahlensteckbrief. `werte` ist eine Liste von Zahlen, in der fehlende Werte als `None` stehen. Die Funktion

      - ignoriert `None` (fehlend heißt nicht 0),
      - wirft `ValueError`, wenn danach weniger als zwei Zahlen übrig sind,
      - verändert die übergebene Liste nicht,
      - gibt ein Dictionary mit den Schlüsseln `n`, `mittelwert`, `median`, `stabw`, `q1`, `q3` und `iqr` zurück.

      `stabw` ist die Standardabweichung einer Stichprobe, die Quartile rechnen inklusiv wie Excel `QUARTILE.INKL`. Runde nicht; die Tests vergleichen mit einer Toleranz.
    lang: python
    starter: |
      import statistics


      def beschreibe(werte):
          zahlen = ...  # None entfernen
          ...
    solution: |
      import statistics


      def beschreibe(werte):
          zahlen = [w for w in werte if w is not None]
          if len(zahlen) < 2:
              raise ValueError("mindestens zwei Werte nötig")
          q1, median, q3 = statistics.quantiles(zahlen, n=4, method="inclusive")
          return {
              "n": len(zahlen),
              "mittelwert": statistics.fmean(zahlen),
              "median": median,
              "stabw": statistics.stdev(zahlen),
              "q1": q1,
              "q3": q3,
              "iqr": q3 - q1,
          }
    tests:
      - name: Zwölf Bestellwerte
        code: |
          import math
          werte = [18.40, 22.90, 24.50, 27.00, 29.80, 31.20, 34.60, 38.90, 41.50, 52.30, 74.50, 412.00]
          k = beschreibe(werte)
          erwartet = {"n": 12, "mittelwert": 67.30, "median": 32.90, "stabw": 109.6127, "q1": 26.375, "q3": 44.20, "iqr": 17.825}
          for name, wert in erwartet.items():
              assert name in k, f"Schlüssel {name!r} fehlt"
              assert math.isclose(k[name], wert, abs_tol=0.001), f"{name}: erwartet {wert}, bekommen {k[name]!r}"
      - name: Quartile wie Excel QUARTILE.INKL
        code: |
          import math
          k = beschreibe([1, 2, 4, 7, 8, 9, 10, 12])
          assert math.isclose(k["q1"], 3.5) and math.isclose(k["q3"], 9.25), f"q1/q3: {k['q1']!r}/{k['q3']!r} – Excel liefert 3,5 und 9,25. Inklusiv gerechnet?"
      - name: Fehlende Werte zählen nicht als 0
        code: |
          import math
          k = beschreibe([None, 10, 20, None, 30])
          assert k["n"] == 3, f"n: erwartet 3, bekommen {k['n']!r}"
          assert math.isclose(k["mittelwert"], 20) and math.isclose(k["stabw"], 10), f"mittelwert/stabw: {k['mittelwert']!r}/{k['stabw']!r} – Stichprobe mit n - 1?"
      - name: Zu wenige Werte
        code: |
          for werte in ([5], [None, 7], []):
              try:
                  beschreibe(werte)
              except ValueError:
                  pass
              else:
                  assert False, f"{werte!r} sollte ValueError auslösen"
      - name: Eingabe bleibt unverändert
        code: |
          werte = [None, 3, 1, 2]
          beschreibe(werte)
          assert werte == [None, 3, 1, 2], f"Die Liste wurde verändert: {werte!r}"
    hints:
      - Eine List Comprehension `[w for w in werte if w is not None]` erzeugt eine neue Liste und lässt die alte in Ruhe.
      - "`statistics.quantiles(zahlen, n=4, method=\"inclusive\")` liefert Q1, Median und Q3 auf einmal."
      - "Stichprobe heißt `statistics.stdev`, nicht `pstdev`. `statistics.StatisticsError` ist eine Unterklasse von `ValueError`, prüfe die Länge aber besser selbst."
    explanation: |
      Die Funktion setzt den Steckbrief in Code um: `None` wird entfernt statt als 0 gezählt, damit fehlende Werte weder Mittelwert noch Median verzerren. `method="inclusive"` macht die Quartile gleich zu Excel `QUARTILE.INKL`; ohne den Parameter liefert Python für die Excel-Beispieldaten 2,5 statt 3,5. `stdev` teilt durch n − 1, wie `STABW.S`. Die eigene Prüfung auf mindestens zwei Werte gibt eine klare Meldung, bevor `statistics` mit einer allgemeineren Fehlermeldung abbricht. Gerundet wird erst in der Ausgabe, damit abgeleitete Werte wie der IQR aus ungerundeten Quartilen entstehen.
