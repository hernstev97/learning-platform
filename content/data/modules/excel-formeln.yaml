lesson: |
  Bei Bohnenwerk entsteht der Vertriebsbericht jeden Monat in derselben Arbeitsmappe. Bis zum Frühjahr lief das so: Export aus dem Shopsystem kopieren und unter die Daten des Vormonats einfügen, in einem Dutzend Formeln `F2:F1187` durch `F2:F1302` ersetzen, die Preisspalte mit `SVERWEIS` (englisch `VLOOKUP`) nach unten ziehen, in `WENNFEHLER` (englisch `IFERROR`) verpackte Nullen übersehen und in den Monatsformeln `"März"` durch `"April"` ersetzen. Drei Stunden Arbeit – und im April standen vier neue Espressosorten mit dem Preis der Handmühle im Bericht, dem letzten Produkt der Liste. Die Nachschlagetabelle endete in Zeile 61, und `SVERWEIS` ohne viertes Argument liefert für eine unbekannte, größere ID still den Wert der letzten Zeile.

  Keine dieser Formeln war falsch. Sie stimmten jeweils genau einen Monat lang. Dieses Modul zeigt, wie du Formeln baust, die neue Zeilen, neue Produkte und einen neuen Berichtsmonat überstehen: feste Bezüge nur dort, wo etwas fest ist, Namen statt Koordinaten, exakte Suche, Bedingungen statt Handfilter und Kontrollen, die Fehler sichtbar machen, statt sie zu verstecken. Am Ende tauschst du jeden Monat nur noch die Daten und eine Parameterzelle aus, und der Bericht ist in zehn Minuten fertig.

  Die Rohdaten liegen in einer Excel-Tabelle namens `Umsatz`, eine Zeile je Bestellposition, mit Spalten wie `bestelldatum`, `region`, `kanal`, `status`, `produkt_id`, `menge` und `netto`. Zwei Schreibweisen reichen für dieses Modul: `Umsatz[netto]` meint alle Datenzellen der Spalte `netto` und wächst mit, wenn Zeilen dazukommen. `[@menge]` steht in einer Formel innerhalb der Tabelle für den Wert derselben Zeile. Wie Tabellen genau funktionieren, zeigt das nächste Modul [Intelligente Tabellen und PivotTables](/data/tabellen-pivot).

  > [!NOTE] Welche Excel-Version?
  > Alle Formeln sind für die deutsche Oberfläche geschrieben: deutsche Funktionsnamen, `;` zwischen Argumenten, Dezimalkomma. `XVERWEIS` (`XLOOKUP`), `LET`, `FILTER`, `EINDEUTIG` (`UNIQUE`) und `SORTIEREN` (`SORT`) gibt es in Microsoft 365 und ab Excel 2021, `TEXTVOR` (`TEXTBEFORE`) und `TEXTTEILEN` (`TEXTSPLIT`) ab Excel 2024. Excel 2016 und 2019 kennen sie nicht. Wo es eine ältere Alternative gibt, steht sie dabei.

  ## Bezüge und Namen: was beim Kopieren passiert

  Eine Formel merkt sich einen Bezug nicht als feste Adresse, sondern als Versatz zur eigenen Zelle. Steht in `D2` die Formel `=B2*C2`, bedeutet das für Excel „zwei Spalten links mal eine Spalte links, gleiche Zeile“. Kopierst du sie nach `D3`, entsteht `=B3*C3`. Das ist der **relative Bezug**, und er ist genau richtig für eine Spalte, die in jeder Zeile dasselbe rechnet ([Microsoft: relative, absolute und gemischte Bezüge](https://support.microsoft.com/de-de/excel/switch-between-relative-absolute-and-mixed-references)).

  Ein `$` friert den Teil ein, vor dem es steht. `$A$1` bleibt beim Kopieren unverändert (**absolut**), `A$1` hält nur die Zeile fest, `$A1` nur die Spalte (**gemischt**). Beim Bearbeiten einer Formel schaltet F4 den markierten Bezug reihum durch die vier Varianten. Verschiebst du eine Formel dagegen mit Ausschneiden und Einfügen, bleiben alle Bezüge gleich; nur Kopieren und Ausfüllen passen relative Bezüge an ([Microsoft: Verschieben oder Kopieren einer Formel](https://support.microsoft.com/de-de/excel/move-or-copy-a-formula-in-excel)).

  Gemischte Bezüge brauchst du, sobald eine Formel in zwei Richtungen kopiert wird. Für B2B-Angebote rechnet Bohnenwerk eine Rabattmatrix: Listenpreise stehen in `A3:A8`, Rabattsätze in `B2:F2`. Die Formel in `B3` wird auf `B3:F8` kopiert:

  ```excel
  =$A3*(1-B$2)
  ```

  `$A3` hält die Spalte fest, denn der Preis steht immer in Spalte A; die Zeile wandert mit. `B$2` hält die Zeile fest, denn der Rabatt steht immer in Zeile 2; die Spalte wandert mit. Ohne `$` stünde in `C4` die Formel `=B4*(1-C3)`: ein berechneter Angebotspreis mal ein anderer berechneter Angebotspreis.

  **Namen** lösen ein zweites Problem. `Parameter!$B$1` verrät nicht, was in der Zelle steht. Gib ihr einen Namen: Zelle markieren, im **Namenfeld** links neben der Bearbeitungsleiste `Berichtsmonat` eintippen, Eingabetaste. Alle Namen verwaltest du unter Formeln › Definierte Namen › Namens-Manager ([Microsoft: Namen in Formeln](https://support.microsoft.com/de-de/excel/get-started/define-and-use-names-in-formulas)). Ein Name wirkt wie ein absoluter Bezug, kopiert sich also ohne `$` richtig, und er erklärt die Formel: `">="&Berichtsmonat` liest sich von selbst. Namen beginnen mit einem Buchstaben, Unterstrich oder umgekehrten Schrägstrich, enthalten keine Leerzeichen und dürfen nicht wie ein Zellbezug aussehen. `KW1` oder `Q1` sind Zellen, keine gültigen Namen.

  > [!PRAXIS] Ein Blatt für alle Stellschrauben
  > Der Bohnenwerk-Bericht hat ein Blatt `Parameter` mit drei benannten Einträgen: `Berichtsmonat` (der Monatserste, etwa 01.03.2026), `Feiertage` (die Feiertage in NRW als Liste) und `Zielmarge`. Keine Formel enthält einen Monatsnamen oder ein festes Datum. Der Monatswechsel ist eine einzige Eingabe, und die Übergabe an eine Urlaubsvertretung ist ein Satz: „Trag den neuen Monat in `Berichtsmonat` ein und prüf die Kontrollzellen.“

  ## Nachschlagen: XVERWEIS statt SVERWEIS

  Die alte Preisspalte im Bericht sah so aus:

  ```excel
  =WENNFEHLER(SVERWEIS([@produkt_id];Produkte!$A$2:$F$61;5);0)
  ```

  Sie enthält vier Annahmen, die nur einen Monat halten:

  1. **Ungefähre Suche.** Ohne viertes Argument sucht `SVERWEIS` mit `Bereich_Verweis` = `WAHR`, also ungefähr: Die erste Spalte muss aufsteigend sortiert sein, und fehlt eine ID, liefert die Funktion den Wert der nächstkleineren ID – ohne Fehlermeldung ([Microsoft: SVERWEIS](https://support.microsoft.com/de-de/excel/functions/vlookup-function)). Exakt sucht sie nur mit `FALSCH` oder `0` als viertem Argument.
  2. **Fester Spaltenindex.** Die `5` heißt „fünfte Spalte des Bereichs“. Fügt jemand in `Produkte` vor dem Listenpreis eine Spalte ein, liefert die Formel still den Wert der Nachbarspalte.
  3. **Fester Bereich.** `$A$2:$F$61` wächst nicht mit. Ein Produkt in Zeile 62 existiert für die Formel nicht.
  4. **Verdeckte Fehler.** `WENNFEHLER` macht aus jedem Fehler eine 0, auch aus einem `#NV`, das gemeldet hätte, dass ein Produkt fehlt.

  `XVERWEIS` trennt Suchspalte und Rückgabespalte: `XVERWEIS(Suchkriterium; Suchmatrix; Rückgabematrix; [wenn_nicht_gefunden]; [Vergleichsmodus]; [Suchmodus])`. Der Vergleichsmodus ist standardmäßig `0`, also exakt ([Microsoft: XVERWEIS](https://support.microsoft.com/de-de/excel/functions/xlookup-function)). Die Rückgabespalte ist ein eigener Bezug; eingefügte Spalten verschieben nichts, und sie darf auch links der Suchspalte liegen.

  ```excel
  =XVERWEIS([@produkt_id];Produkte[produkt_id];Produkte[listenpreis];"fehlt")
  =XVERWEIS([@menge];Staffel[ab_menge];Staffel[rabatt];0;-1)
  ```

  Die erste Formel steht in der Spalte `listenpreis`. Ihr viertes Argument ersetzt `WENNFEHLER` gezielt: Nur wenn die ID fehlt, erscheint „fehlt“. Ein Tippfehler im Funktionsnamen bleibt als `#NAME?` sichtbar.

  Die Näherungssuche ist nicht grundsätzlich falsch, sie ist nur ein schlechter Standard. Für Staffeln ist sie genau richtig, das zeigt die zweite Formel. Bohnenwerk gewährt Büros und Cafés Mengenrabatt: ab 10 Paketen 5 %, ab 50 Paketen 10 %, ab 100 Paketen 15 %. Die Tabelle `Staffel` enthält je Stufe die Untergrenze `ab_menge` (1, 10, 50, 100) und den `rabatt`. Vergleichsmodus `-1` heißt „exakter Treffer oder das nächstkleinere Element“: 64 Pakete finden die Stufe 50 und damit 10 %. Liegt die Menge unter der kleinsten Stufe, greift `wenn_nicht_gefunden` mit 0. Eine sortierte Suchspalte verlangt `XVERWEIS` erst mit Suchmodus `2` oder `-2` (Binärsuche).

  In Excel 2019 und älter leistet die Kombination aus `INDEX` und `VERGLEICH` (englisch `INDEX` und `MATCH`) dasselbe. `VERGLEICH` liefert die Position der ID, `INDEX` holt den Wert an dieser Position:

  ```excel
  =INDEX(Produkte[listenpreis];VERGLEICH([@produkt_id];Produkte[produkt_id];0))
  ```

  Auch hier lauert der Standard: Ohne die `0` als drittes Argument sucht `VERGLEICH` ungefähr und setzt eine aufsteigende Sortierung voraus ([Microsoft: VERGLEICH](https://support.microsoft.com/de-de/excel/functions/match-function)).

  > [!WARNING] Näherungssuche als Standard
  > `SVERWEIS` ohne viertes und `VERGLEICH` ohne drittes Argument suchen ungefähr. Bei unsortierten oder unvollständigen Daten liefern sie plausible, falsche Werte statt `#NV`. Schreib das Argument immer aus: `FALSCH` bzw. `0` für exakt, `WAHR` bzw. `1` nur für echte Staffeln.

  ## Bedingungen: WENNS und SUMMEWENNS

  `WENN` (englisch `IF`) entscheidet zwischen zwei Werten. Sobald mehr Fälle nötig sind, wird Verschachteln unübersichtlich. `WENNS` (englisch `IFS`) prüft Bedingungen der Reihe nach und liefert den Wert der ersten, die zutrifft ([Microsoft: WENNS](https://support.microsoft.com/de-de/excel/functions/ifs-function)). Die Kundenklasse in der Tabelle `Kunden`:

  ```excel
  =WENNS([@umsatz_12m]>=5000;"A";[@umsatz_12m]>=1000;"B";WAHR;"C")
  ```

  Die Reihenfolge ist Teil der Logik: Stünde `>=1000` zuerst, wäre jeder A-Kunde ein B-Kunde. `WENNS` hat keinen Sonst-Zweig; trifft keine Bedingung zu, liefert es `#NV`. Das abschließende `WAHR;"C"` ist deshalb der Standardfall.

  Die meisten Berichtszahlen sind **bedingte Aggregationen**: Summe, Anzahl oder Mittelwert über die Zeilen, die Bedingungen erfüllen. Dafür gibt es `SUMMEWENNS`, `ZÄHLENWENNS` und `MITTELWERTWENNS` (englisch `SUMIFS`, `COUNTIFS`, `AVERAGEIFS`). Alle arbeiten mit Paaren aus Kriterienbereich und Kriterium, und `SUMMEWENNS` und `MITTELWERTWENNS` nehmen als erstes Argument den Bereich, der summiert oder gemittelt wird ([Microsoft: SUMMEWENNS](https://support.microsoft.com/de-de/excel/functions/sumifs-function)):

  ```excel
  =SUMMEWENNS(Umsatz[netto];Umsatz[region];"Nord";Umsatz[status];"bezahlt")
  =ZÄHLENWENNS(Umsatz[kanal];"B2B";Umsatz[status];"<>storniert")
  =MITTELWERTWENNS(Umsatz[netto];Umsatz[kanal];"Shop";Umsatz[status];"bezahlt")
  ```

  Drei Regeln verhindern die meisten Fehler:

  - **Argumentreihenfolge.** Die ältere `SUMMEWENN` (englisch `SUMIF`) mit nur einer Bedingung erwartet den Summenbereich als *drittes* Argument: `SUMMEWENN(Bereich; Suchkriterien; [Summe_Bereich])`. Wer beim Umbauen die Reihenfolge verwechselt, bekommt 0 statt eines Fehlers.
  - **Vergleiche sind Text.** Ein Operator steht mit dem Wert in Anführungszeichen: `">=100"`, `"<>storniert"`. Kommt der Vergleichswert aus einer Zelle oder einem Namen, hängst du ihn mit `&` an: `">="&Berichtsmonat`. Kriterien unterscheiden nicht zwischen Groß- und Kleinschreibung, `"nord"` trifft also auch `Nord`, aber nicht `Nord ` mit Leerzeichen am Ende ([Microsoft: ZÄHLENWENN](https://support.microsoft.com/de-de/excel/get-started/use-the-countif-function-in-microsoft-excel)).
  - **Gleich große Bereiche.** Summenbereich und Kriterienbereiche müssen gleich viele Zeilen haben. Mit Spalten derselben Tabelle ist das automatisch erfüllt.

  `ZÄHLENWENNS` zählt Zeilen. Weil `Umsatz` eine Zeile je Bestellposition hat, zählt die zweite Formel Positionen, nicht Bestellungen. Die Granularität aus [Saubere Tabellen und Datenmodelle](/data/tabellenmodelle) entscheidet, was eine Zahl bedeutet. `MITTELWERTWENNS` liefert `#DIV/0!`, wenn keine Zeile passt.

  ## Text und Datum: bereinigen und rechnen

  Exporte bringen Text mit, der gleich aussieht und nicht gleich ist. `GLÄTTEN` (englisch `TRIM`) entfernt Leerzeichen am Anfang und Ende und reduziert mehrere Leerzeichen zwischen Wörtern auf eines. Das geschützte Leerzeichen mit dem Zeichencode 160, das aus Webseiten und manchen Exporten stammt, entfernt es nicht ([Microsoft: GLÄTTEN](https://support.microsoft.com/de-de/excel/functions/trim-function)). Das erledigt vorher `WECHSELN` (englisch `SUBSTITUTE`) mit `ZEICHEN(160)` (englisch `CHAR`):

  ```excel
  =GLÄTTEN(WECHSELN([@stadt];ZEICHEN(160);" "))
  =TEXTVOR([@artikeltext];" ")
  =TEXTTEILEN(B2;", ")
  ```

  `TEXTVOR` liefert den Text vor dem ersten Trennzeichen: Aus `ESP-250 Espresso Napoli 250 g` wird der Artikelcode `ESP-250`. Fehlt das Trennzeichen, liefert die Funktion `#NV` ([Microsoft: TEXTVOR](https://support.microsoft.com/de-de/excel/functions/textbefore-function)). `TEXTTEILEN` zerlegt `Espresso, Filter` aus `B2` in zwei Zellen nebeneinander und repariert so das Antimuster „mehrere Werte in einer Zelle“. Weil das Ergebnis mehrere Zellen füllt, steht diese Formel außerhalb einer Tabelle; warum, zeigt der Abschnitt über dynamische Arrays.

  `TEXT` formatiert eine Zahl oder ein Datum als Text, etwa `=TEXT([@bestelldatum];"MMMM JJJJ")` für „März 2026“. Das Ergebnis ist Text: Es lässt sich nicht mehr rechnen und sortiert alphabetisch, „April“ vor „März“. Nutze `TEXT` für Beschriftungen, nicht für Schlüssel, nach denen du gruppierst oder filterst. Die Formatcodes hängen außerdem von der Sprache ab: deutsch `TT`, `MM`, `JJJJ`, englisch `dd`, `mm`, `yyyy` ([Microsoft: TEXT](https://support.microsoft.com/de-de/excel/functions/text-function)).

  Ein Datum ist in Excel eine Zahl: der 1. Januar 1900 ist die 1, der 14.03.2026 die 46095. Deshalb kannst du Tage addieren und Datumswerte mit `<` und `>` vergleichen. Vier Funktionen tragen den Monatsbericht:

  - `DATUM(Jahr;Monat;Tag)` (englisch `DATE`) baut ein Datum aus Teilen und rechnet Überläufe weiter: `DATUM(2026;13;1)` ist der 01.01.2027.
  - `MONATSENDE(Ausgangsdatum;Monate)` (englisch `EOMONTH`) liefert den letzten Tag eines Monats, `EDATUM(Ausgangsdatum;Monate)` (englisch `EDATE`) dasselbe Tagesdatum einige Monate später oder früher ([Microsoft: MONATSENDE](https://support.microsoft.com/de-de/excel/functions/eomonth-function)).
  - `NETTOARBEITSTAGE(Ausgangsdatum;Enddatum;[Freie_Tage])` (englisch `NETWORKDAYS`) zählt Montag bis Freitag ohne die übergebenen Feiertage, und zwar **einschließlich** Start- und Endtag ([Microsoft: NETTOARBEITSTAGE](https://support.microsoft.com/de-de/excel/functions/networkdays-function)). Eine Lieferung, die am Montag versendet und am Dienstag zugestellt wird, ergibt 2; die Laufzeit ist `NETTOARBEITSTAGE([@versendet_am];[@zugestellt_am];Feiertage)-1`.
  - `ISOKALENDERWOCHE(Datum)` (englisch `ISOWEEKNUM`) zählt Wochen nach ISO 8601, wie in Deutschland üblich: Montag bis Sonntag, KW 1 ist die Woche mit dem ersten Donnerstag. `KALENDERWOCHE` (englisch `WEEKNUM`) beginnt ohne zweites Argument am Sonntag und zählt die Woche mit dem 1. Januar als KW 1 ([Microsoft: KALENDERWOCHE](https://support.microsoft.com/de-de/excel/functions/weeknum-function)). Für den 01.01.2027 liefert `ISOKALENDERWOCHE` 53, `KALENDERWOCHE` 1.

  Für Monatsfilter ist ein **halboffenes Intervall** am robustesten: ab dem Monatsersten einschließlich bis zum nächsten Monatsersten ausschließlich.

  ```excel
  =SUMMEWENNS(Umsatz[netto];Umsatz[bestelldatum];">="&Berichtsmonat;Umsatz[bestelldatum];"<"&EDATUM(Berichtsmonat;1);Umsatz[status];"bezahlt")
  ```

  Die naheliegende Obergrenze `"<="&MONATSENDE(Berichtsmonat;0)` verliert Bestellungen vom Monatsletzten, sobald `bestelldatum` eine Uhrzeit enthält: 31.03.2026 18:42 ist größer als 31.03.2026 0:00. Das halboffene Intervall funktioniert mit und ohne Uhrzeit, und dasselbe Muster schreibst du später in SQL und pandas.

  > [!MERKE]
  > Zeiträume immer als `>=` Anfang und `<` nächster Anfang filtern. So gibt es keine Lücke am Monatsende und keine Überschneidung zwischen zwei Monaten.

  ## LET und dynamische Arrays: Formeln, die mitwachsen

  Seit Excel 2021 kann eine Formel mehrere Werte liefern. Das Ergebnis **läuft über** in die Nachbarzellen, und Excel passt die Größe des Überlaufbereichs bei jeder Berechnung an ([Microsoft: dynamische Arrayformeln](https://support.microsoft.com/de-de/excel/dynamic-array-formulas-and-spilled-array-behavior)). Die Regionsliste des Berichts pflegt sich damit selbst. Die erste Formel steht in `H2`, die zweite in `I2`:

  ```excel
  =SORTIEREN(EINDEUTIG(Umsatz[region]))
  =SUMMEWENNS(Umsatz[netto];Umsatz[region];H2#;Umsatz[status];"bezahlt")
  ```

  `EINDEUTIG` entfernt Dubletten, `SORTIEREN` sortiert aufsteigend. Kommt eine Region dazu, wird die Liste länger. Der Überlaufoperator `#` in `H2#` meint den ganzen Überlaufbereich von `H2`, egal wie groß er gerade ist ([Microsoft: Operator für übergelaufene Bereiche](https://support.microsoft.com/de-de/excel/spilled-range-operator)). Weil das Kriterium ein Array ist, liefert `SUMMEWENNS` für jede Region eine Summe, ebenfalls übergelaufen.

  `FILTER` holt alle Zeilen, die eine Bedingung erfüllen. Mehrere Bedingungen verknüpfst du mit `*` für UND und `+` für ODER. Das dritte Argument bestimmt, was bei leerem Ergebnis erscheint; ohne es liefert ein leeres Ergebnis `#KALK!` ([Microsoft: FILTER](https://support.microsoft.com/de-de/excel/functions/filter-function)):

  ```excel
  =FILTER(Umsatz[[bestellung_id]:[netto]];(Umsatz[kanal]="B2B")*(Umsatz[status]="storniert");"keine")
  ```

  Überlaufen braucht Platz. Steht im Zielbereich schon etwas, liegen dort verbundene Zellen oder steht die Formel in einer Excel-Tabelle, zeigt sie `#ÜBERLAUF!` ([Microsoft: #ÜBERLAUF! korrigieren](https://support.microsoft.com/de-de/excel/how-to-correct-a-spill-error)). Ein Klick auf die Zelle zeigt den geplanten Bereich gestrichelt, die Fehlerüberprüfung bietet „Blockierende Zellen auswählen“ an. Überlaufende Formeln gehören deshalb auf ein Berichtsblatt neben der Tabelle, nicht hinein.

  Lange Formeln werden mit `LET` lesbar. `LET` vergibt Namen für Zwischenergebnisse, die nur innerhalb der Formel gelten; das letzte Argument ist die Berechnung. Excel berechnet jeden Namen einmal, auch wenn er mehrfach vorkommt ([Microsoft: LET](https://support.microsoft.com/de-de/excel/functions/let-function)). Zeilenumbrüche mit Alt+Eingabe und Einrückungen sind in Formeln erlaubt. Die Veränderung zum Vormonat:

  ```excel
  =LET(
      start; Berichtsmonat;
      ende; EDATUM(start; 1);
      bestellt; Umsatz[bestelldatum];
      aktuell; SUMMEWENNS(Umsatz[netto]; bestellt; ">="&start; bestellt; "<"&ende; Umsatz[status]; "bezahlt");
      vorher; SUMMEWENNS(Umsatz[netto]; bestellt; ">="&EDATUM(start; -1); bestellt; "<"&start; Umsatz[status]; "bezahlt");
      WENN(vorher = 0; "kein Vormonat"; aktuell / vorher - 1)
  )
  ```

  Jede Zeile ist ein Gedanke mit Namen. Wer die Formel in einem Jahr liest, sieht sofort, dass `vorher` den Monat vor `start` meint. Nimm Namen, die nicht wie Funktionen oder Tabellen heißen: `datum` oder `umsatz` wären hier missverständlich.

  ## Fehlerwerte lesen und Formeln prüfen

  Ein Fehlerwert ist eine Nachricht. Wer sie lesen kann, findet die Ursache in Sekunden ([Microsoft: Formelfehler erkennen](https://support.microsoft.com/de-de/excel/detect-formula-errors-in-excel)):

  | Fehlerwert | Englisch | Typische Ursache im Bericht |
  | --- | --- | --- |
  | `#NV` | `#N/A` | Suchwert nicht gefunden: neue Produkt-ID, Zahl als Text gespeichert, Leerzeichen im Schlüssel |
  | `#WERT!` | `#VALUE!` | Falscher Datentyp, etwa Text statt Datum in `NETTOARBEITSTAGE` |
  | `#BEZUG!` | `#REF!` | Bezug zeigt ins Leere, meist nach einer gelöschten Zeile oder Spalte |
  | `#DIV/0!` | `#DIV/0!` | Division durch 0 oder `MITTELWERTWENNS` ohne passende Zeile |
  | `#NAME?` | `#NAME?` | Unbekannter Name: Tippfehler in Funktion oder Name, Text ohne Anführungszeichen |
  | `#ZAHL!` | `#NUM!` | Ungültiger Zahlenwert, etwa ein ungültiges Datum in `MONATSENDE` |
  | `#ÜBERLAUF!` | `#SPILL!` | Überlaufbereich blockiert oder Arrayformel in einer Tabelle |
  | `#KALK!` | `#CALC!` | Leeres Array, etwa `FILTER` ohne Treffer und ohne drittes Argument |
  | `#####` | – | Kein Fehler: Spalte zu schmal oder negatives Datum |

  Daraus folgt die Regel für `WENNFEHLER`. Es fängt `#NV`, `#WERT!`, `#BEZUG!`, `#DIV/0!`, `#ZAHL!`, `#NAME?` und `#NULL!` ab ([Microsoft: WENNFEHLER](https://support.microsoft.com/de-de/excel/functions/iferror-function)), also auch die Fehler, die einen kaputten Bericht melden. Fang nur den Fall ab, den du erwartest: fehlende Treffer mit dem vierten Argument von `XVERWEIS` oder mit `WENNNV` (englisch `IFNA`), das ausschließlich `#NV` abfängt, eine Division durch null mit `WENN`. Und mach Erwartetes zählbar, statt es unsichtbar zu machen. Diese Kontrollzelle mit `ZÄHLENWENN` (englisch `COUNTIF`) steht oben im Bericht:

  ```excel
  =ZÄHLENWENN(Umsatz[listenpreis];"fehlt")
  ```

  Zeigt sie nicht 0, fehlen Produkte in der Produktliste, und der Bericht geht nicht raus, bevor sie ergänzt sind.

  Unter Formeln › Formelüberwachung findest du die Werkzeuge, mit denen du fremde und eigene alte Formeln prüfst ([Microsoft: Beziehungen zwischen Formeln und Zellen](https://support.microsoft.com/de-de/excel/display-the-relationships-between-formulas-and-cells)):

  - **Spur zum Vorgänger** und **Spur zum Nachfolger** zeichnen Pfeile zu den Zellen, aus denen eine Formel liest, und zu den Formeln, die eine Zelle verwenden. Rote Pfeile führen zu Zellen mit Fehlern. **Pfeile entfernen** räumt auf.
  - **Formeln anzeigen** schaltet das Blatt von Ergebnissen auf Formeln um. Eine Zelle, die anders aussieht als ihre Nachbarn, fällt sofort auf; die Fehlerüberprüfung markiert solche inkonsistenten Formeln zusätzlich mit einem kleinen Dreieck in der Zellecke.
  - **Formel auswerten** rechnet eine Formel Schritt für Schritt vor, ideal für verschachtelte Bedingungen ([Microsoft: geschachtelte Formel auswerten](https://support.microsoft.com/de-de/excel/evaluate-a-nested-formula-one-step-at-a-time)).
  - Das **Überwachungsfenster** zeigt ausgewählte Zellen, etwa die Kontrollzellen, während du auf einem anderen Blatt arbeitest.

  > [!INTERVIEW] „Wie stellst du sicher, dass ein Excel-Bericht nächsten Monat noch stimmt?“
  > Ich trenne Daten, Parameter und Berechnung. Die Rohdaten stehen in einer Tabelle, die mitwächst, Stellschrauben wie der Berichtsmonat in benannten Zellen, und die Formeln verwenden nur Spaltenverweise und Namen – keine festen Bereiche, keine Monatsnamen im Formeltext. Nachgeschlagen wird exakt, erwartete Lücken markiere ich sichtbar, statt sie mit `WENNFEHLER` zu verstecken. Dazu kommen Kontrollzellen: Summe der Regionen gleich Gesamtsumme, Anzahl „fehlt“ gleich 0. Vor dem Versand stelle ich den Parameter probeweise auf den nächsten Monat und prüfe, ob alles mitgeht.

  ## Häufige Fehler

  - **`SVERWEIS` ohne `FALSCH`.** Symptom: plausible, aber falsche Werte für neue oder unbekannte IDs. Viertes Argument ergänzen oder `XVERWEIS` nutzen.
  - **Zahl als Text.** Die ID `1101` ist im Export Text, in der Produktliste eine Zahl. Die exakte Suche liefert `#NV`, obwohl die ID sichtbar da ist. Das kleine Dreieck der Fehlerüberprüfung („Als Text gespeicherte Zahl“) verrät es. Den Datentyp legst du beim Import fest ([CSV-Import und Datenbereinigung](/data/csv-import)).
  - **Summenbereich an der falschen Stelle.** Bei `SUMMEWENN` steht er zuletzt, bei `SUMMEWENNS` zuerst. Vertauscht ergibt sich 0, kein Fehler.
  - **Monatsletzter fehlt.** `"<="&MONATSENDE(…)` verliert Zeitpunkte nach 0 Uhr am letzten Tag. Halboffenes Intervall mit `"<"&EDATUM(…;1)` verwenden.
  - **Falsche Kalenderwoche.** `KALENDERWOCHE` ohne zweites Argument zählt ab Sonntag und nicht nach ISO 8601. `ISOKALENDERWOCHE` verwenden.
  - **Parameter relativ verwiesen.** `=B2*(1+F1)` nach unten kopiert liest in Zeile 3 aus `F2`. `$F$1` oder besser ein Name.
  - **`WENNFEHLER` um alles.** Ein `#BEZUG!` nach einer gelöschten Spalte wird 0, und niemand merkt es. Nur `#NV` gezielt abfangen.
  - **`#ÜBERLAUF!` nach einer Umstellung.** Jemand hat in den Überlaufbereich getippt oder die Formel in eine Tabelle verschoben. Blockierende Zellen leeren, Formel außerhalb der Tabelle platzieren.

  ## Zusammenfassung

  - Relative Bezüge sind Versätze, `$` friert Spalte oder Zeile ein. Gemischte Bezüge brauchst du, wenn eine Formel in zwei Richtungen kopiert wird.
  - Parameter bekommen Namen auf einem Parameterblatt. Der Monatswechsel ist eine einzige Eingabe.
  - `XVERWEIS` sucht standardmäßig exakt und meldet Lücken über `wenn_nicht_gefunden`. Die Näherungssuche (`-1`) gehört zu Staffeln. `SVERWEIS` und `VERGLEICH` suchen ohne letztes Argument ungefähr.
  - `SUMMEWENNS`, `ZÄHLENWENNS`, `MITTELWERTWENNS`: Summenbereich zuerst, Operatoren als Text, Werte mit `&` anhängen.
  - Zeiträume als halboffenes Intervall filtern: `>=` Monatsanfang, `<` nächster Monatsanfang.
  - Dynamische Arrays laufen über und wachsen mit. `H2#` meint den ganzen Überlaufbereich, `#ÜBERLAUF!` heißt „kein Platz“.
  - `LET` benennt Zwischenergebnisse und berechnet sie einmal.
  - Fehlerwerte sind Nachrichten. `WENNFEHLER` nur gezielt, Kontrollzellen statt versteckter Nullen, Formelüberwachung zum Prüfen.
exercises:
  - id: bezug-kopieren
    type: choice
    title: Wohin wandert der Bezug?
    prompt: |
      In `C2` steht `=B2*(1+$F$1)`. Du kopierst `C2` mit Strg+C und fügst sie in `D5` ein. Welche Formel steht danach in `D5`?
    options:
      - text: "`=C5*(1+$F$1)`"
        correct: true
        why: Von `C2` nach `D5` sind es eine Spalte nach rechts und drei Zeilen nach unten. Der relative Bezug `B2` wandert genauso mit und wird `C5`, `$F$1` ist absolut und bleibt.
      - text: "`=B5*(1+$F$1)`"
        correct: false
        why: So sähe es aus, wenn die Formel `$B2` enthielte. `B2` ist in Spalte und Zeile relativ, also wandert auch die Spalte mit.
      - text: "`=C5*(1+$G$4)`"
        correct: false
        why: Das `$` vor Spalte und Zeile verhindert genau diese Verschiebung.
      - text: "`=B2*(1+$F$1)`"
        correct: false
        why: So sähe es nach Ausschneiden und Einfügen aus. Beim Verschieben bleiben alle Bezüge gleich, beim Kopieren werden relative Bezüge angepasst.
    explanation: |
      Excel speichert einen relativen Bezug als Versatz zur Formelzelle: „eine Spalte links, gleiche Zeile“. Dieser Versatz bleibt beim Kopieren erhalten, deshalb zeigt die Formel in `D5` auf `C5`. Das `$` macht Spalte und Zeile von `F1` absolut, der Parameter bleibt fest. Kopieren und Ausfüllen passen relative Bezüge an, Verschieben nicht – ein Unterschied, der beim Umbauen von Berichten regelmäßig überrascht.
    resources:
      - title: Microsoft Support · Relative, absolute und gemischte Bezüge
        url: https://support.microsoft.com/de-de/excel/switch-between-relative-absolute-and-mixed-references
      - title: Microsoft Support · Verschieben oder Kopieren einer Formel
        url: https://support.microsoft.com/de-de/excel/move-or-copy-a-formula-in-excel

  - id: sverweis-annahmen
    type: choice
    title: Vier Annahmen in einer Zeile
    prompt: |
      In der Spalte `listenpreis` der Tabelle `Umsatz` steht seit Jahren diese Formel. Das Blatt `Produkte` hat die Spalten A `produkt_id` (aufsteigend sortiert), B `name`, C `kategorie`, D `einkaufspreis`, E `listenpreis` und F `aktiv`, aktuell mit Daten bis Zeile 61. Welche Aussagen stimmen?
    lang: excel
    code: |
      =SVERWEIS([@produkt_id];Produkte!$A$2:$F$61;5)
    options:
      - text: Eine neue Produkt-ID, die größer ist als alle IDs der Liste, bekommt still den Listenpreis des Produkts aus Zeile 61.
        correct: true
        why: Ohne viertes Argument sucht `SVERWEIS` ungefähr und nimmt den größten Wert, der kleiner oder gleich dem Suchkriterium ist. Bei einer sortierten Liste ist das die letzte Zeile.
      - text: Fügt jemand zwischen B und C eine Spalte `sorte` ein, liefert die Formel den Einkaufspreis.
        correct: true
        why: Der Bereich wird zu `$A$2:$G$61`, der feste Spaltenindex 5 zeigt jetzt auf die ehemalige Spalte D.
      - text: Neue Produkte in Zeile 62 findet die Formel, weil der Bereich mit `$` absolut ist.
        correct: false
        why: Absolut heißt nur, dass sich der Bezug beim Kopieren nicht verschiebt. Er wächst nicht mit, Zeile 62 liegt außerhalb.
      - text: Fehlt eine ID mitten in der Liste, erscheint zuverlässig `#NV`.
        correct: false
        why: Das gilt nur für die exakte Suche. Ungefähr liefert `SVERWEIS` den Preis der nächstkleineren ID. `#NV` gibt es hier nur für IDs, die kleiner als die erste sind.
    explanation: |
      Die Formel verlässt sich auf eine vollständige Liste, eine feste Spaltenposition und einen festen Bereich, und sie sucht ungefähr. Jede dieser Annahmen bricht irgendwann, und keiner der Brüche erzeugt eine Fehlermeldung. `=XVERWEIS([@produkt_id];Produkte[produkt_id];Produkte[listenpreis];"fehlt")` beseitigt alle drei: exakte Suche als Standard, eigene Rückgabespalte, Tabellenspalten, die mitwachsen.
    resources:
      - title: Microsoft Support · SVERWEIS (Funktion)
        url: https://support.microsoft.com/de-de/excel/functions/vlookup-function
      - title: Microsoft Support · XVERWEIS (Funktion)
        url: https://support.microsoft.com/de-de/excel/functions/xlookup-function

  - id: let-zeilen-ordnen
    type: order
    title: Eine LET-Formel zusammensetzen
    prompt: |
      Die Formel soll den bezahlten Nettoumsatz des Berichtsmonats liefern. Bring die Zeilen in eine Reihenfolge, die Excel akzeptiert: Ein Name muss definiert sein, bevor ein späterer Wert ihn verwendet, und die Berechnung steht zuletzt.
    lang: excel
    lines: |
      =LET(
          start; Berichtsmonat;
          ende; EDATUM(start; 1);
          bestellt; Umsatz[bestelldatum];
          SUMMEWENNS(Umsatz[netto]; bestellt; ">="&start; bestellt; "<"&ende; Umsatz[status]; "bezahlt")
      )
    alternatives:
      - [1, 2, 4, 3, 5, 6]
      - [1, 4, 2, 3, 5, 6]
    explanation: |
      `LET` liest seine Argumente von links nach rechts: erst Name und Wert, dann der nächste Name, am Ende die Berechnung. `ende` braucht `start`, deshalb muss `start` davor stehen. `bestellt` hängt von keinem anderen Namen ab und darf an jeder Stelle vor der Berechnung stehen. Die Berechnung ist immer das letzte Argument – sie liefert das Ergebnis der ganzen Formel.
    resources:
      - title: Microsoft Support · LET-Funktion
        url: https://support.microsoft.com/de-de/excel/functions/let-function

  - id: sverweis-vorhersagen
    type: output
    title: Was findet die Suche?
    prompt: |
      Das Blatt `Produkte`:

      | | A | B | C |
      | --- | --- | --- | --- |
      | **1** | produkt_id | name | listenpreis |
      | **2** | 1101 | Espresso Napoli 250 g | 8,90 |
      | **3** | 1102 | Espresso Milano 1 kg | 24,50 |
      | **4** | 1105 | Filter Hochland 500 g | 11,40 |
      | **5** | 1107 | Handmühle Nord | 39,00 |

      Die ID 1104 ist eine neue Sorte, die noch nicht angelegt ist. Was zeigen `E2` bis `E5`? Schreib eine Zeile je Zelle, Zahlen im Format `0,00`, Fehlerwerte wie in der deutschen Oberfläche.
    lang: excel
    code: |
      E2: =SVERWEIS(1104;A2:C5;3)
      E3: =SVERWEIS(1104;A2:C5;3;FALSCH)
      E4: =XVERWEIS(1104;A2:A5;C2:C5;"fehlt")
      E5: =XVERWEIS(1104;A2:A5;C2:C5;"fehlt";-1)
    expected: |
      24,50
      #NV
      fehlt
      24,50
    accept:
      - |
        24,50
        #N/A
        fehlt
        24,50
    hints:
      - Welcher Vergleich gilt in `E2`, wenn das vierte Argument fehlt?
      - Ungefähr heißt bei aufsteigend sortierter Liste „größter Wert kleiner oder gleich 1104“.
    explanation: |
      `E2` sucht ungefähr und findet 1102, den größten Wert unter 1104 – der Espresso Milano liefert still 24,50. `E3` sucht exakt und meldet mit `#NV` ehrlich, dass die ID fehlt. `E4` sucht ebenfalls exakt, gibt aber statt `#NV` den vereinbarten Text zurück. `E5` nutzt Vergleichsmodus `-1` („exakt oder nächstkleineres“) und landet wie `E2` bei 1102: Die Näherungssuche ist dieselbe, nur ist sie hier ausdrücklich gewählt. Für Produktpreise ist sie falsch, für Staffeln richtig.
    resources:
      - title: Microsoft Support · SVERWEIS (Funktion)
        url: https://support.microsoft.com/de-de/excel/functions/vlookup-function
      - title: Microsoft Support · XVERWEIS (Funktion)
        url: https://support.microsoft.com/de-de/excel/functions/xlookup-function

  - id: bedingte-summen-vorhersagen
    type: output
    title: Vier Kennzahlen, vier Überraschungen
    prompt: |
      Ein Ausschnitt aus dem Export:

      | | A | B | C | D |
      | --- | --- | --- | --- | --- |
      | **1** | region | kanal | status | netto |
      | **2** | Nord | Shop | bezahlt | 42,00 |
      | **3** | Nord | B2B | bezahlt | 310,50 |
      | **4** | Süd | Shop | storniert | 18,90 |
      | **5** | Nord | B2B | storniert | 120,00 |
      | **6** | West | B2B | bezahlt | 96,00 |
      | **7** | Nord | Shop | retourniert | 24,50 |
      | **8** | Süd | B2B | bezahlt | 205,00 |
      | **9** | nord | Shop | bezahlt | 11,00 |

      Was zeigen `G2` bis `G5`? `G2`, `G4` und `G5` sind im Format `0,00` formatiert, `G3` als ganze Zahl. Schreib eine Zeile je Zelle.
    lang: excel
    code: |
      G2: =SUMMEWENNS(D2:D9;A2:A9;"Nord";C2:C9;"<>storniert")
      G3: =ZÄHLENWENNS(A2:A9;"Nord";B2:B9;"B2B")
      G4: =MITTELWERTWENNS(D2:D9;A2:A9;"Ost")
      G5: =SUMMEWENN(D2:D9;"Nord";A2:A9)
    expected: |
      388,00
      2
      #DIV/0!
      0,00
    hints:
      - Unterscheiden die Kriterien zwischen „Nord“ und „nord“?
      - "`<>storniert` schließt nur einen Status aus. Und bei `SUMMEWENN` steht der Summenbereich an dritter Stelle."
    explanation: |
      `G2` addiert alle Nord-Zeilen außer der stornierten: 42,00 + 310,50 + 24,50 + 11,00 = 388,00. Die retournierte Zeile zählt mit, weil nur `storniert` ausgeschlossen ist, und `nord` zählt mit, weil Kriterien nicht zwischen Groß- und Kleinschreibung unterscheiden. `G3` zählt die Zeilen 3 und 5: Ohne Statusbedingung ist auch die stornierte Bestellung dabei. `G4` findet keine Zeile für „Ost“ und teilt durch null. `G5` hat die Argumente vertauscht: `SUMMEWENN` sucht „Nord“ in den Beträgen, findet nichts und summiert 0 – ohne jede Fehlermeldung.
    resources:
      - title: Microsoft Support · SUMMEWENNS (Funktion)
        url: https://support.microsoft.com/de-de/excel/functions/sumifs-function
      - title: Microsoft Support · MITTELWERTWENNS (Funktion)
        url: https://support.microsoft.com/de-de/excel/functions/averageifs-function
      - title: Microsoft Support · ZÄHLENWENN – Groß- und Kleinschreibung
        url: https://support.microsoft.com/de-de/excel/get-started/use-the-countif-function-in-microsoft-excel

  - id: datumsfunktionen-vorhersagen
    type: output
    title: Monatsende, Arbeitstage, Kalenderwoche
    prompt: |
      `A2` enthält den 14.03.2026 (ein Samstag). Der Name `Feiertage` verweist auf eine Liste mit Karfreitag 03.04.2026 und Ostermontag 06.04.2026. `B2` und `B3` sind im Format `TT.MM.JJJJ` formatiert, `B4` bis `B6` als Zahl. Was zeigen die Zellen? Schreib eine Zeile je Zelle.
    lang: excel
    code: |
      B2: =MONATSENDE(A2;0)
      B3: =EDATUM(A2;1)
      B4: =NETTOARBEITSTAGE(DATUM(2026;3;30);DATUM(2026;4;7);Feiertage)
      B5: =ISOKALENDERWOCHE(DATUM(2027;1;1))
      B6: =KALENDERWOCHE(DATUM(2027;1;1))
    expected: |
      31.03.2026
      14.04.2026
      5
      53
      1
    hints:
      - Der 30.03.2026 ist ein Montag, der 01.01.2027 ein Freitag.
      - "`NETTOARBEITSTAGE` zählt Start- und Endtag mit. Nach ISO gehört ein Freitag zur Woche seines Donnerstags."
    explanation: |
      `MONATSENDE(A2;0)` liefert den letzten Tag des eigenen Monats, `EDATUM(A2;1)` denselben Tag einen Monat später. Vom Montag 30.03. bis Dienstag 07.04. liegen sieben Werktage, beide Enden eingeschlossen; Karfreitag und Ostermontag fallen weg, bleiben 5. Der 01.01.2027 ist ein Freitag: Seine ISO-Woche beginnt am Montag 28.12.2026 und hat ihren Donnerstag noch 2026, sie ist KW 53 des Jahres 2026. `KALENDERWOCHE` ohne zweites Argument zählt dagegen die Woche mit dem 1. Januar als KW 1 – in einem deutschen Bericht die falsche Zahl.
    resources:
      - title: Microsoft Support · NETTOARBEITSTAGE
        url: https://support.microsoft.com/de-de/excel/functions/networkdays-function
      - title: Microsoft Support · ISOKALENDERWOCHE
        url: https://support.microsoft.com/de-de/excel/functions/isoweeknum-function
      - title: Microsoft Support · KALENDERWOCHE
        url: https://support.microsoft.com/de-de/excel/functions/weeknum-function

  - id: monatsgrenze-sql
    type: output
    title: Der Monatsletzte in SQL
    prompt: |
      Dasselbe Monatsende-Problem gibt es in SQL. `bestelldatum` ist ISO-Text mit Uhrzeit, SQLite vergleicht ihn Zeichen für Zeichen. Was gibt das Skript aus? Die Ausgabe entspricht der `sqlite3`-Kommandozeile: eine Zeile je Ergebniszeile, Kommazahlen mit Punkt (`3.0`, `12.5`).
    lang: sql
    code: |
      CREATE TABLE umsatz (bestellung_id INTEGER, bestelldatum TEXT, netto REAL);
      INSERT INTO umsatz VALUES
        (5001, '2026-03-02 09:14', 17.8),
        (5004, '2026-03-18 08:55', 156.0),
        (5005, '2026-03-31 18:42', 34.2),
        (5006, '2026-04-01 07:30', 8.9);

      SELECT SUM(netto) FROM umsatz
      WHERE bestelldatum >= '2026-03-01' AND bestelldatum <= '2026-03-31';

      SELECT SUM(netto) FROM umsatz
      WHERE bestelldatum >= '2026-03-01' AND bestelldatum < '2026-04-01';

      SELECT COUNT(*) FROM umsatz
      WHERE bestelldatum BETWEEN '2026-03-01' AND '2026-03-31';
    expected: |
      173.8
      208.0
      2
    hints:
      - Welcher Text ist größer, `'2026-03-31'` oder `'2026-03-31 18:42'`?
    explanation: |
      Beim Textvergleich ist `'2026-03-31 18:42'` größer als `'2026-03-31'`: Die ersten zehn Zeichen sind gleich, und der längere Text kommt danach. Die erste Abfrage verliert deshalb die Bestellung vom Monatsletzten am Abend und summiert nur 17,8 + 156,0. Die zweite nutzt das halboffene Intervall bis zum nächsten Monatsersten und erwischt alle drei März-Bestellungen. `BETWEEN` schließt beide Grenzen ein und hat dasselbe Problem wie `<=`. Das Muster „`>=` Anfang, `<` nächster Anfang“ funktioniert in Excel, SQL und pandas gleich.
    resources:
      - title: SQLite · Comparison Expressions
        url: https://www.sqlite.org/datatype3.html#comparison_expressions
      - title: SQLite · The BETWEEN Operator
        url: https://www.sqlite.org/lang_expr.html#the_between_operator
      - title: SQLite · Date And Time Functions
        url: https://www.sqlite.org/lang_datefunc.html

  - id: xverweis-staffel
    type: gap
    title: Preis und Staffelrabatt nachschlagen
    prompt: |
      Zwei berechnete Spalten der Tabelle `Umsatz`. Die erste holt den Listenpreis exakt aus der Tabelle `Produkte`; fehlt die ID dort, soll der Text „fehlt“ erscheinen. Die zweite holt den B2B-Rabatt aus der Tabelle `Staffel` mit den Untergrenzen `ab_menge` 1, 10, 50 und 100 und den Rabatten 0; 0,05; 0,1 und 0,15. 64 Pakete sollen 10 % bekommen, Mengen unter 1 den Rabatt 0.
    lang: excel
    code: |
      =⟦XVERWEIS⟧([@produkt_id];Produkte[produkt_id];Produkte[listenpreis];⟦"fehlt"⟧)
      =XVERWEIS([@menge];Staffel[ab_menge];Staffel[rabatt];0;⟦-1⟧)
    gaps:
      - label: Suchfunktion
        hint: Die Funktion, die Such- und Rückgabespalte getrennt nimmt und standardmäßig exakt sucht (englisch `XLOOKUP`).
      - label: Wenn nicht gefunden
        hint: Text steht in Anführungszeichen, genau wie im Auftrag.
      - label: Vergleichsmodus
        hint: Gesucht ist „exakter Treffer oder das nächstkleinere Element“. Die Zahl ist negativ.
    explanation: |
      `XVERWEIS` sucht standardmäßig exakt; das vierte Argument ersetzt nur für den Fall „nicht gefunden“ das `#NV` durch einen sichtbaren Text, den eine Kontrollzelle zählen kann. Für die Staffel ist die exakte Suche falsch, denn 64 steht nicht in der Liste. Vergleichsmodus `-1` nimmt dann das nächstkleinere Element, die Untergrenze 50. Mit `1` bekäme die Bestellung die Stufe 100 und 15 % – ein teurer Unterschied. Das vierte Argument `0` sorgt dafür, dass eine Menge unter der kleinsten Stufe keinen Fehler, sondern 0 % Rabatt bekommt.
    resources:
      - title: Microsoft Support · XVERWEIS (Funktion)
        url: https://support.microsoft.com/de-de/excel/functions/xlookup-function

  - id: monatsumsatz-halboffen
    type: gap
    title: Der ganze Monat, auch am Abend des Letzten
    prompt: |
      Der Name `Berichtsmonat` enthält den Monatsersten, etwa 01.03.2026. `bestelldatum` enthält Datum **und** Uhrzeit, zum Beispiel 31.03.2026 18:42. Ergänze die Formel so, dass sie den Nettoumsatz aller bezahlten Positionen des Berichtsmonats liefert, auch die vom Abend des Monatsletzten. Der Status heißt `bezahlt`.
    lang: excel
    code: |
      =SUMMEWENNS(⟦Umsatz[netto]⟧;Umsatz[bestelldatum];">="&Berichtsmonat;Umsatz[bestelldatum];⟦"<"&EDATUM(Berichtsmonat;1)⟧;Umsatz[status];⟦"bezahlt"⟧)
    gaps:
      - label: Summenbereich
        hint: Bei `SUMMEWENNS` steht zuerst, was addiert wird.
      - label: Obergrenze
        hint: Nicht „kleiner gleich Monatsende“, sondern „kleiner als der nächste Monatserste“. `EDATUM` rechnet Monate weiter.
        accept:
          - '"<"&MONATSENDE(Berichtsmonat;0)+1'
          - '"<"&(MONATSENDE(Berichtsmonat;0)+1)'
          - '"<"&DATUM(JAHR(Berichtsmonat);MONAT(Berichtsmonat)+1;1)'
      - label: Status
        hint: Ein Kriterium ohne Operator prüft auf Gleichheit.
        accept: ['"=bezahlt"']
    explanation: |
      `SUMMEWENNS` nimmt zuerst den Summenbereich, danach Paare aus Kriterienbereich und Kriterium. Die Obergrenze ist der nächste Monatserste mit `<`: `EDATUM(Berichtsmonat;1)` liefert den 01.04.2026 um 0 Uhr, und jede Bestellung vom 31.03. liegt davor, egal zu welcher Uhrzeit. `"<="&MONATSENDE(Berichtsmonat;0)` hätte die Bestellung um 18:42 verloren, weil der Monatsletzte als Zahl für 0 Uhr steht. Weil nur der Name `Berichtsmonat` die Formel steuert, stimmt sie im April ohne Änderung.
    resources:
      - title: Microsoft Support · SUMMEWENNS (Funktion)
        url: https://support.microsoft.com/de-de/excel/functions/sumifs-function
      - title: Microsoft Support · EDATUM (Funktion)
        url: https://support.microsoft.com/de-de/excel/functions/edate-function

  - id: mitwachsende-liste
    type: gap
    title: Ein Bericht, der sich selbst pflegt
    prompt: |
      Das Berichtsblatt soll ohne Handarbeit mitwachsen. `H2` listet jede Region einmal, alphabetisch sortiert. `I2` liefert daneben den bezahlten Umsatz je Region und soll automatisch länger werden, wenn eine Region dazukommt. `K2` listet die `bestellung_id` aller stornierten B2B-Positionen; gibt es keine, erscheint „keine“.
    lang: excel
    code: |
      H2: =⟦SORTIEREN(EINDEUTIG(Umsatz[region]))⟧
      I2: =SUMMEWENNS(Umsatz[netto];Umsatz[region];⟦H2#⟧;Umsatz[status];"bezahlt")
      K2: =FILTER(Umsatz[bestellung_id];(Umsatz[kanal]="B2B")⟦*⟧(Umsatz[status]="storniert");⟦"keine"⟧)
    gaps:
      - label: Eindeutig und sortiert
        hint: Zwei Funktionen ineinander – innen die Dubletten entfernen, außen sortieren.
        accept:
          - EINDEUTIG(SORTIEREN(Umsatz[region]))
          - SORTIEREN(EINDEUTIG(Umsatz[region]);1;1)
          - SORTIEREN(EINDEUTIG(Umsatz[region]);1)
      - label: Ganzer Überlaufbereich
        hint: Die Startzelle der Regionsliste plus der Operator für übergelaufene Bereiche.
      - label: UND-Verknüpfung
        hint: Zwei Arrays aus WAHR und FALSCH werden für UND miteinander …
      - label: Leeres Ergebnis
        hint: Das dritte Argument von `FILTER`, als Text in Anführungszeichen.
    explanation: |
      `EINDEUTIG` entfernt Dubletten, `SORTIEREN` ordnet aufsteigend; ob du erst sortierst oder erst Dubletten entfernst, ändert das Ergebnis nicht. `H2#` meint den ganzen Überlaufbereich der Regionsliste, egal wie lang er ist – mit `H2:H5` wäre eine fünfte Region wieder Handarbeit. `SUMMEWENNS` rechnet mit dem Array als Kriterium eine Summe je Region und läuft selbst über. In `FILTER` ergibt `(…)*(…)` je Zeile 1 nur dann, wenn beide Bedingungen WAHR sind; `+` wäre ODER. Ohne drittes Argument zeigt ein leeres Ergebnis `#KALK!`.
    resources:
      - title: Microsoft Support · Operator für übergelaufene Bereiche
        url: https://support.microsoft.com/de-de/excel/spilled-range-operator
      - title: Microsoft Support · FILTER-Funktion
        url: https://support.microsoft.com/de-de/excel/functions/filter-function
      - title: Microsoft Support · EINDEUTIG-Funktion
        url: https://support.microsoft.com/de-de/excel/functions/unique-function

  - id: abstimmung-b2b-null
    type: bug
    title: Der B2B-Umsatz ist verschwunden
    prompt: |
      Das Kontrollblatt des Monatsberichts, Zeile für Zeile in `B2` bis `B6`: Gesamtumsatz, Anzahl Positionen, B2B-Umsatz, Shop-Umsatz und die Abstimmung, die 0 ergeben muss – es gibt nur die Kanäle B2B und Shop. Seit dem Umbau zeigt `B4` den Wert 0,00, und die Abstimmung in `B6` meldet genau den B2B-Umsatz als Differenz. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: excel
    code: |
      =SUMME(Umsatz[netto])
      =ANZAHL2(Umsatz[bestellung_id])
      =SUMMEWENN(Umsatz[netto];"B2B";Umsatz[kanal])
      =SUMMEWENN(Umsatz[kanal];"Shop";Umsatz[netto])
      =B2-B4-B5
    lines: [3]
    fix:
      - line: 3
        answers:
          - =SUMMEWENN(Umsatz[kanal];"B2B";Umsatz[netto])
          - =SUMMEWENNS(Umsatz[netto];Umsatz[kanal];"B2B")
    hints:
      - Vergleich Zeile 3 mit Zeile 4.
      - "`SUMMEWENN(Bereich; Suchkriterien; [Summe_Bereich])` – wo wird „B2B“ gesucht?"
    explanation: |
      `SUMMEWENN` erwartet zuerst den Bereich, in dem das Kriterium gesucht wird, und zuletzt den Summenbereich. Zeile 3 sucht „B2B“ in den Beträgen, findet keinen Treffer und summiert 0 – ohne Fehlermeldung. Der Fehler entsteht typischerweise beim Umbau von `SUMMEWENNS`, wo der Summenbereich vorne steht. Gefunden hat ihn die Abstimmung: Eine Kontrollzelle, die 0 ergeben muss, ist billiger als jeder nachträgliche Rückruf beim Vertrieb. Wer einheitlich `SUMMEWENNS` verwendet, auch für eine einzige Bedingung, hat nur eine Argumentreihenfolge im Kopf.
    resources:
      - title: Microsoft Support · SUMMEWENN (Funktion)
        url: https://support.microsoft.com/de-de/excel/functions/sumif-function
      - title: Microsoft Support · SUMMEWENNS (Funktion)
        url: https://support.microsoft.com/de-de/excel/functions/sumifs-function

  - id: preis-vom-nachbarn
    type: bug
    title: Ein neues Produkt mit fremdem Preis
    prompt: |
      Berechnete Spalten der Tabelle `Umsatz`, von links nach rechts: `netto`, `listenpreis`, `listenwert` und `nachlass` (Listenwert minus Nettoumsatz). Das Blatt `Produkte` hat die Spalten A `produkt_id` (aufsteigend sortiert) bis F, der Listenpreis steht in Spalte E. Die Sorte 1108 ist neu und noch nicht im Produktblatt angelegt. Trotzdem zeigt ihre Zeile den Listenpreis der Handmühle 1107 (39,00) und einen Nachlass von 624,00 auf eine Bestellung ohne Rabatt. Finde die fehlerhafte Zeile und korrigiere sie so, dass eine fehlende ID nicht mehr still einen fremden Preis bekommt.
    lang: excel
    code: |
      =[@menge]*[@einzelpreis]*(1-[@rabatt])
      =SVERWEIS([@produkt_id];Produkte!$A$2:$F$200;5)
      =[@menge]*[@listenpreis]
      =[@listenwert]-[@netto]
    lines: [2]
    fix:
      - line: 2
        answers:
          - =SVERWEIS([@produkt_id];Produkte!$A$2:$F$200;5;FALSCH)
          - =SVERWEIS([@produkt_id];Produkte!$A$2:$F$200;5;0)
          - =XVERWEIS([@produkt_id];Produkte!$A$2:$A$200;Produkte!$E$2:$E$200)
          - =XVERWEIS([@produkt_id];Produkte!$A$2:$A$200;Produkte!$E$2:$E$200;"fehlt")
    hints:
      - Welche Zeile holt einen Wert aus einer anderen Tabelle?
      - Wie sucht `SVERWEIS`, wenn das vierte Argument fehlt?
    explanation: |
      Ohne viertes Argument sucht `SVERWEIS` ungefähr und nimmt bei einer sortierten Liste den größten Wert, der kleiner oder gleich 1108 ist – die 1107. Alle folgenden Spalten rechnen mit diesem fremden Preis weiter: 20 Pakete × 39,00 ergeben einen Listenwert von 780,00 und einen scheinbaren Nachlass von 624,00. Mit `FALSCH` liefert die Zeile `#NV` und fällt auf. Dauerhaft besser ist `XVERWEIS` auf Tabellenspalten mit „fehlt“ als viertem Argument: Dann verschwinden auch der feste Bereich bis Zeile 200 und der Spaltenindex 5, die beim nächsten Umbau brechen.
    resources:
      - title: Microsoft Support · SVERWEIS – Häufige Probleme
        url: https://support.microsoft.com/de-de/excel/functions/vlookup-function
      - title: Microsoft Support · XVERWEIS (Funktion)
        url: https://support.microsoft.com/de-de/excel/functions/xlookup-function

  - id: top-kunden-erklaeren
    type: explain
    title: Stimmt die Top-5-Liste auch im April?
    prompt: |
      Eine Kollegin hat diese Formel für die „Top 5 Kunden des Monats“ auf das Berichtsblatt gesetzt und fragt, ob sie auch im April noch stimmt. Erkläre Schritt für Schritt, was die Formel tut, wie das Ergebnis aussieht, wann sie einen Fehlerwert zeigt und was dir fachlich auffällt. `HSTAPELN` (englisch `HSTACK`) setzt Arrays nebeneinander, `ÜBERNEHMEN` (englisch `TAKE`) behält die ersten Zeilen; beide gibt es in Microsoft 365 und Excel 2024.
    lang: excel
    code: |
      =LET(
          start; Berichtsmonat;
          ende; EDATUM(start; 1);
          im_monat; (Umsatz[bestelldatum] >= start) * (Umsatz[bestelldatum] < ende);
          kunden; EINDEUTIG(FILTER(Umsatz[kunde_id]; im_monat));
          summen; SUMMEWENNS(Umsatz[netto]; Umsatz[kunde_id]; kunden; Umsatz[bestelldatum]; ">="&start; Umsatz[bestelldatum]; "<"&ende);
          ÜBERNEHMEN(SORTIEREN(HSTAPELN(kunden; summen); 2; -1); 5)
      )
    points:
      - "`start` und `ende` bilden ein halboffenes Intervall um den Berichtsmonat; für April reicht ein neuer Wert in `Berichtsmonat`."
      - "`im_monat` ist je Zeile 1 oder 0, `*` verknüpft die Bedingungen mit UND. `FILTER` behält die passenden `kunde_id`, `EINDEUTIG` macht daraus die Kundenliste."
      - "`SUMMEWENNS` bekommt die Kundenliste als Kriterium und liefert je Kunde eine Summe. `HSTAPELN` setzt ID und Umsatz nebeneinander, `SORTIEREN(…; 2; -1)` sortiert nach Umsatz absteigend, `ÜBERNEHMEN(…; 5)` behält die ersten fünf."
      - "Das Ergebnis läuft in bis zu fünf Zeilen und zwei Spalten über. Ist der Bereich blockiert oder steht die Formel in einer Tabelle, zeigt sie `#ÜBERLAUF!`; ohne Zeilen im Monat liefert `FILTER` ohne drittes Argument `#KALK!`."
      - Der Status wird nicht gefiltert – stornierte und retournierte Positionen zählen mit. Für den Bericht gehört `(Umsatz[status]="bezahlt")` in `im_monat` und das passende Kriterium in `SUMMEWENNS`.
    explanation: |
      Die Formel ist für den Monatswechsel gebaut: `start` kommt aus dem Namen `Berichtsmonat`, `ende` ist der nächste Monatserste, und alle Vergleiche nutzen `>=` und `<`, sodass auch Bestellungen vom Abend des Monatsletzten zählen. `im_monat` ist ein Array aus Einsen und Nullen, `FILTER` holt damit die Kundennummern des Monats, `EINDEUTIG` entfernt die Wiederholungen. `SUMMEWENNS` mit dieser Liste als Kriterium liefert je Kunde eine Summe in derselben Reihenfolge. `HSTAPELN` setzt beide Spalten zusammen, `SORTIEREN` ordnet nach der zweiten Spalte absteigend, `ÜBERNEHMEN` schneidet nach fünf Zeilen ab – bei weniger Kunden bleibt es bei weniger Zeilen. Das Ergebnis braucht freien Platz neben der Tabelle; blockiert etwas, erscheint `#ÜBERLAUF!`, und ein Monat ohne Daten endet in `#KALK!`. Fachlich fehlt der Statusfilter: Ein Café mit einer großen stornierten Bestellung stünde weit oben. Mit `* (Umsatz[status] = "bezahlt")` in `im_monat` und `Umsatz[status]; "bezahlt"` in `SUMMEWENNS` stimmt die Liste auch im April.
    resources:
      - title: Microsoft Support · LET-Funktion
        url: https://support.microsoft.com/de-de/excel/functions/let-function
      - title: Microsoft Support · ÜBERNEHMEN-Funktion
        url: https://support.microsoft.com/de-de/excel/functions/take-function
      - title: Microsoft Support · HSTAPELN-Funktion
        url: https://support.microsoft.com/de-de/excel/functions/hstack-function

  - id: monatsbericht-umbauen
    type: practice
    title: Der Monatsbericht mit einer Stellschraube
    prompt: |
      Baue den Bohnenwerk-Monatsbericht so, dass der Monatswechsel nur eine Eingabe braucht. Lege eine neue Arbeitsmappe an und übernimm die beiden Exporte, am einfachsten über Daten › Aus Text/CSV.

      ```csv title=umsatz.csv
      bestellung_id;bestelldatum;kunde_id;region;kanal;status;produkt_id;menge;einzelpreis;rabatt
      5001;02.03.2026 09:14;101;Nord;Shop;bezahlt;1101;2;8,90;0
      5002;05.03.2026 11:02;205;West;B2B;bezahlt;1102;12;22,00;0,05
      5002;05.03.2026 11:02;205;West;B2B;bezahlt;1105;10;10,50;0,05
      5003;11.03.2026 16:40;118;Süd;Shop;storniert;1107;1;39,00;0
      5004;18.03.2026 08:55;230;Nord;B2B;bezahlt;1108;20;7,80;0
      5005;31.03.2026 18:42;101;Nord;Shop;bezahlt;1105;3;11,40;0
      5006;01.04.2026 07:30;142;Ost;Shop;bezahlt;1101;1;8,90;0
      5007;09.04.2026 13:12;205;West;B2B;bezahlt;1102;15;22,00;0,05
      5008;22.04.2026 10:05;118;Süd;Shop;retourniert;1105;2;11,40;0
      ```

      ```csv title=produkte.csv
      produkt_id;name;kategorie;einkaufspreis;listenpreis;aktiv
      1101;Espresso Napoli 250 g;Espresso;4,10;8,90;1
      1102;Espresso Milano 1 kg;Espresso;12,80;24,50;1
      1105;Filter Hochland 500 g;Filter;5,20;11,40;1
      1107;Handmühle Nord;Zubehör;21,00;39,00;1
      ```

      1. Mach aus beiden Bereichen Tabellen (Strg+T) und nenne sie im Register Tabellenentwurf `Umsatz` und `Produkte`.
      2. Ergänze in `Umsatz` die berechneten Spalten `netto` und `listenpreis`; der Listenpreis kommt per `XVERWEIS` mit „fehlt“ für unbekannte IDs.
      3. Lege ein Blatt `Parameter` mit dem Namen `Berichtsmonat` (01.03.2026) an.
      4. Baue ein Blatt `Bericht` mit dem bezahlten Nettoumsatz des Monats, der Veränderung zum Vormonat, einer übergelaufenen Regionsliste mit Umsatz je Region und zwei Kontrollzellen: Anzahl „fehlt“ und Summe der Regionen minus Monatsumsatz.
      5. Stell `Berichtsmonat` auf den 01.04.2026 und prüfe, ob alles mitgeht.
    lang: excel
    solution: |
      Umsatz[netto]:        =[@menge]*[@einzelpreis]*(1-[@rabatt])
      Umsatz[listenpreis]:  =XVERWEIS([@produkt_id];Produkte[produkt_id];Produkte[listenpreis];"fehlt")

      Bericht!B2 (Monatsumsatz):
      =SUMMEWENNS(Umsatz[netto];Umsatz[bestelldatum];">="&Berichtsmonat;Umsatz[bestelldatum];"<"&EDATUM(Berichtsmonat;1);Umsatz[status];"bezahlt")

      Bericht!B3 (Veränderung zum Vormonat, Format 0,0 %):
      =LET(
          start; Berichtsmonat;
          ende; EDATUM(start; 1);
          bestellt; Umsatz[bestelldatum];
          aktuell; SUMMEWENNS(Umsatz[netto]; bestellt; ">="&start; bestellt; "<"&ende; Umsatz[status]; "bezahlt");
          vorher; SUMMEWENNS(Umsatz[netto]; bestellt; ">="&EDATUM(start; -1); bestellt; "<"&start; Umsatz[status]; "bezahlt");
          WENN(vorher = 0; "kein Vormonat"; aktuell / vorher - 1)
      )

      Bericht!D2 (Regionen):  =SORTIEREN(EINDEUTIG(Umsatz[region]))
      Bericht!E2 (Umsatz):    =SUMMEWENNS(Umsatz[netto];Umsatz[region];D2#;Umsatz[bestelldatum];">="&Berichtsmonat;Umsatz[bestelldatum];"<"&EDATUM(Berichtsmonat;1);Umsatz[status];"bezahlt")

      Bericht!B5 (Kontrolle fehlt):   =ZÄHLENWENN(Umsatz[listenpreis];"fehlt")
      Bericht!B6 (Kontrolle Summe):   =SUMME(E2#)-B2
    checklist:
      - Für März zeigt der Bericht 558,55 bezahlten Nettoumsatz – einschließlich der Bestellung 5005 vom 31.03.2026 um 18:42.
      - "Die Regionsliste läuft über und zeigt Nord 208,00, Ost 0,00, Süd 0,00 und West 350,55; die Kontrollzelle Summe zeigt 0."
      - Die Kontrollzelle „fehlt“ zeigt 1 (Produkt 1108). Nachdem du 1108 in `Produkte` ergänzt hast, zeigt sie 0, ohne dass du eine Formel änderst.
      - Mit `Berichtsmonat` = 01.04.2026 zeigt der Bericht 322,40 und eine Veränderung von −42,3 %, ohne dass du eine Formel änderst.
      - Unter Formeln › Formelüberwachung › Formeln anzeigen enthält keine Berichtsformel einen festen Zeilenbereich wie `$A$2:$A$500`, einen Monatsnamen als Text oder `WENNFEHLER`.
    hints:
      - Wenn der März 524,35 statt 558,55 zeigt, fehlt die Bestellung vom Abend des Monatsletzten. Prüfe die Obergrenze.
      - Steht die Regionsliste in der Tabelle, meldet sie `#ÜBERLAUF!`. Übergelaufene Formeln gehören auf das Berichtsblatt.
    explanation: |
      Der Bericht hat genau eine Stellschraube: `Berichtsmonat`. Alle Kennzahlen filtern mit dem halboffenen Intervall von `Berichtsmonat` bis `EDATUM(Berichtsmonat;1)`, deshalb zählt die Bestellung vom 31.03. um 18:42 mit, und der April braucht keine Formeländerung. Tabellenspalten wachsen mit neuen Exportzeilen, die übergelaufene Regionsliste mit neuen Regionen. Die Kontrollzellen machen die zwei typischen Monatsfehler sichtbar: ein Produkt, das in der Stammliste fehlt, und eine Aufteilung, die nicht zur Gesamtsumme passt. Genau diese Kombination macht aus drei Stunden Nacharbeit zehn Minuten: Daten einfügen, Monat eintragen, Kontrollzellen ansehen.
    resources:
      - title: Microsoft Support · Definieren und Verwenden von Namen in Formeln
        url: https://support.microsoft.com/de-de/excel/get-started/define-and-use-names-in-formulas
      - title: Microsoft Support · Dynamische Arrayformeln
        url: https://support.microsoft.com/de-de/excel/dynamic-array-formulas-and-spilled-array-behavior
