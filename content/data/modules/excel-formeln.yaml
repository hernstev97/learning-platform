id: excel-formeln
title: Excel-Formeln, die nächsten Monat noch stimmen
level: 2
minutes: 180
summary: Formeln, die neue Zeilen, neue Produkte und den nächsten Berichtsmonat ohne Handarbeit überstehen – mit sauberen Bezügen, Namen, XVERWEIS, SUMMEWENNS, Datumslogik, LET und dynamischen Arrays, dazu Fehlerwerte lesen und Formeln prüfen.
goals:
  - Du setzt relative, absolute und gemischte Bezüge gezielt ein und ersetzt feste Parameter durch Namen.
  - Du schlägst mit `XVERWEIS` exakt nach, erkennst die Näherungssuche von `SVERWEIS` als Fehlerquelle und nutzt sie bewusst für Staffeln.
  - Du berechnest bedingte Summen, Anzahlen und Mittelwerte mit `SUMMEWENNS` & Co. über halboffene Datumsintervalle.
  - Du bereinigst Text mit `GLÄTTEN`, `TEXTVOR` und `TEXTTEILEN` und rechnest mit `DATUM`, `MONATSENDE`, `NETTOARBEITSTAGE` und `ISOKALENDERWOCHE`.
  - Du baust mit `LET`, `FILTER`, `EINDEUTIG` und `SORTIEREN` Auswertungen, die mitwachsen, und behebst `#ÜBERLAUF!`.
  - Du liest Fehlerwerte, setzt `WENNFEHLER` sparsam ein und prüfst Formeln mit der Formelüberwachung.
