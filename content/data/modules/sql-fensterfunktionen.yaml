id: sql-fensterfunktionen
title: Fensterfunktionen und Analysemuster
level: 3
minutes: 190
summary: Mit `OVER` rechnest du Rangfolgen, laufende Summen, Periodenvergleiche und Anteile, ohne Zeilen zu verlieren – und löst damit die typischen Aufgaben aus Monatsbericht, Support-Kennzahlen und SQL-Interview.
goals:
  - Du erklärst, worin sich eine Fensterfunktion von `GROUP BY` unterscheidet und warum ihr Ergebnis erst eine Abfrageebene weiter außen gefiltert werden kann.
  - Du wählst zwischen `ROW_NUMBER`, `RANK` und `DENSE_RANK` passend zur fachlichen Regel bei Gleichständen und löst Top-N pro Gruppe.
  - Du baust laufende Summen und gleitende Durchschnitte mit bewusst gewähltem Fensterrahmen und erkennst die Falle des Standardrahmens `RANGE`.
  - Du vergleichst Perioden mit `LAG` und `LEAD` auf einem lückenlosen Kalender aus einer rekursiven CTE.
  - Du löst Analysemuster wie Deduplizieren, Kohorten mit Wiederkaufrate sowie Durchlaufzeit und Backlog aus Ticketdaten.
