  - id: bereinigungs-pipeline
    type: order
    title: Der Weg vom Export zur sauberen Datei
    prompt: Bring die Schritte der monatlichen Bereinigung des Bestellexports in eine Reihenfolge, in der jeder Schritt auf dem vorigen aufbauen kann.
    lang: text
    lines: |
      Rohdatei unverändert archivieren und die Zeilenzahl mit wc -l notieren
      Encoding bestimmen und die Bytes zu Text dekodieren
      Text mit Trennzeichen ; und Quoting in Datensätze zerlegen
      Summenzeile am Dateiende erkennen, entfernen und im Protokoll zählen
      Textfelder trimmen und Schreibweisen über die Zuordnungstabelle vereinheitlichen
      Beträge und Datumswerte aus den getrimmten Feldern in Decimal und date umwandeln
      Exakte Dubletten auf den umgewandelten Werten erkennen und entfernen
      Bereinigte Datei neu schreiben und Protokoll mit allen Zählern ablegen
    alternatives:
      - [1, 2, 3, 5, 4, 6, 7, 8]
    explanation: |
      Zuerst wird die Rohdatei gesichert, damit jeder spätere Schritt wiederholbar ist. Ohne Encoding gibt es keinen Text, ohne Parser keine Felder. Die Summenzeile muss vor der Umwandlung weg, sonst scheitert `strptime` an ihrem leeren Datum; ob du vorher oder nachher trimmst, ist egal. Umgewandelt wird nach dem Trimmen, und Dubletten suchst du erst auf den bereinigten Werten, sonst sind `"Leipzig "` und `"Leipzig"` oder `4,9` und `4,90` verschieden. Zum Schluss entsteht eine neue Datei – die Rohdatei bleibt, wie sie war.
    hints:
      - Welcher Schritt würde an der Summenzeile scheitern?
      - Wann sind zwei Zeilen, die sich nur in Leerzeichen unterscheiden, gleich?
    resources:
      - title: Python · csv
        url: https://docs.python.org/3/library/csv.html

  - id: bytes-und-zeichen
    type: output
    title: Bytes zählen
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      text = "Rösterei Köln"
      utf8 = text.encode("utf-8")
      print(len(text), len(utf8), len(text.encode("cp1252")))
      falsch = utf8.decode("cp1252")
      print(len(falsch), falsch.encode("cp1252").decode("utf-8") == text)
      try:
          text.encode("cp1252").decode("utf-8")
      except UnicodeDecodeError:
          print("UnicodeDecodeError")
    expected: |
      13 15 13
      15 True
      UnicodeDecodeError
    explanation: |
      Der Text hat 13 Zeichen. In UTF-8 braucht jedes „ö“ zwei Bytes, also 15 Bytes; Windows-1252 kodiert jedes Zeichen mit einem Byte, also 13. Liest man die 15 UTF-8-Bytes als Windows-1252, wird jedes Byte ein eigenes Zeichen – 15 Zeichen Mojibake („RÃ¶sterei KÃ¶ln“). Weil dabei nichts verloren ging, lässt sich der Fehler exakt umkehren. Umgekehrt ist das Windows-1252-Byte `F6` gefolgt von „s“ ungültiges UTF-8, und das strenge Dekodieren bricht ab – genau darauf beruht die Rückfallregel.
    resources:
      - title: Python · str.encode und bytes.decode
        url: https://docs.python.org/3/library/stdtypes.html#bytes.decode

  - id: bom-und-quoting
    type: output
    title: Ein Export aus Excel, Feld für Feld
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      import csv
      import io

      roh = '\ufeffkunde;stadt;notiz\n"Café Luna; Ehrenfeld";Köln ;"Tür ""hinten"""\n'.encode("utf-8")
      ohne_sig = next(csv.DictReader(io.StringIO(roh.decode("utf-8"), newline=""), delimiter=";"))
      print("kunde" in ohne_sig)
      zeile = next(csv.DictReader(io.StringIO(roh.decode("utf-8-sig"), newline=""), delimiter=";"))
      print(len(zeile))
      print(zeile["kunde"])
      print(repr(zeile["stadt"]))
      print(zeile["notiz"])
    expected: |
      False
      3
      Café Luna; Ehrenfeld
      'Köln '
      Tür "hinten"
    explanation: |
      Mit `utf-8` bleibt das BOM als `\ufeff` am ersten Spaltennamen hängen; der Schlüssel heißt `"\ufeffkunde"`, deshalb ist `"kunde"` nicht enthalten. `utf-8-sig` entfernt das BOM. Das Semikolon in Anführungszeichen gehört zum Feld, die Zeile hat drei Felder. Der Parser entfernt die umschließenden Anführungszeichen und macht aus `""` ein einzelnes `"`. Leerzeichen am Feldende lässt er stehen – `'Köln '` musst du selbst trimmen.
    resources:
      - title: Python · codecs · utf-8-sig
        url: https://docs.python.org/3/library/codecs.html#module-encodings.utf_8_sig
      - title: Python · csv · Formatting Parameters
        url: https://docs.python.org/3/library/csv.html#csv-fmt-params

  - id: datum-mehrdeutig
    type: output
    title: Welcher Tag ist gemeint?
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      from datetime import date, datetime, timedelta

      text = "03.04.2026"
      print(datetime.strptime(text, "%d.%m.%Y").date())
      print(datetime.strptime(text, "%m.%d.%Y").date())
      print(sorted(["14.03.2026", "02.04.2026", "28.02.2026"])[0])
      print(date(1899, 12, 30) + timedelta(days=46100))
    expected: |
      2026-04-03
      2026-03-04
      02.04.2026
      2026-03-19
    explanation: |
      `strptime` liest den Text nach dem angegebenen Format; ein `date` wird im ISO-Format ausgegeben. `03.04.2026` passt zu beiden Formaten und ergibt einmal den 3. April, einmal den 4. März – ohne Fehler. Als Text sortiert `02.04.2026` vor `14.03.2026` und `28.02.2026`, weil zeichenweise verglichen wird und „0“ vor „1“ und „2“ kommt. Excel-Seriennummer 46100 ist fünf Tage nach 46095, dem 14. März 2026, also der 19. März.
    hints:
      - "`%d` ist der Tag, `%m` der Monat."
      - Textvergleich schaut zuerst auf das erste Zeichen.
    resources:
      - title: Python · strftime() and strptime() Format Codes
        url: https://docs.python.org/3/library/datetime.html#format-codes
      - title: Microsoft Support · Datumssysteme in Excel
        url: https://support.microsoft.com/de-de/office/datumssysteme-in-excel-e7fe7167-48a9-4b96-bb53-5612a800b487

  - id: zeile-umwandeln
    type: gap
    title: Eine Exportzeile typisieren
    prompt: |
      `zeile` kommt aus einem `csv.DictReader` und enthält nur Text, etwa `{"bestellung_id": "1001", "bestelldatum": "02.03.2026", "plz": "01067", "versandkosten": "1.250,50"}`. Ergänze die Umwandlung: Datum im deutschen Format, PLZ mit führender Null, Betrag mit Tausenderpunkt und Dezimalkomma.
    lang: python
    code: |
      from datetime import datetime
      from decimal import Decimal


      def zeile_umwandeln(zeile: dict) -> dict:
          return {
              "bestellung_id": int(zeile["bestellung_id"]),
              "bestelldatum": datetime.⟦strptime⟧(zeile["bestelldatum"], ⟦"%d.%m.%Y"⟧).date(),
              "plz": ⟦zeile["plz"]⟧,
              "versandkosten": Decimal(zeile["versandkosten"].⟦replace(".", "").replace(",", ".")⟧),
          }
    gaps:
      - label: Text in Datum
        hint: Die Methode, die einen Text nach einem Format liest („string parse time“).
      - label: Format
        hint: Tag, Monat und vierstelliges Jahr, getrennt durch Punkte.
      - label: PLZ
        hint: Eine PLZ ist eine Kennung. Wie bleibt die führende Null erhalten?
        accept: ['zeile["plz"].strip()']
      - label: Betrag
        hint: Zwei `replace`-Aufrufe hintereinander – in welcher Reihenfolge?
    explanation: |
      `strptime` braucht das Format der Quelle: `%d.%m.%Y` für `02.03.2026`. Die PLZ wird nicht umgewandelt, weil `int("01067")` die Null verliert – Kennungen bleiben Text. Beim Betrag entfernst du zuerst die Tausenderpunkte und ersetzt dann das Komma; umgekehrt würde aus `1.250,50` erst `1.250.50` und dann `125050`. `Decimal` statt `float` hält den Betrag exakt.
    resources:
      - title: Python · datetime.strptime
        url: https://docs.python.org/3/library/datetime.html#datetime.datetime.strptime
      - title: Python · decimal
        url: https://docs.python.org/3/library/decimal.html

