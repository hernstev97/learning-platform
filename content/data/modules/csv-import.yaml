lesson: |
  Am ersten Werktag jedes Monats exportiert das Shopsystem von Bohnenwerk die Datei `bestellungen_2026-03.csv`. Lea aus dem Vertriebsinnendienst öffnet sie per Doppelklick in Excel – und beginnt zu reparieren. Die Leipziger PLZ `04109` ist zu `4109` geworden, ganz unten steht eine Summenzeile, und „Leipzig“ gibt es in drei Schreibweisen. In der Versandliste aus demselben System wird die Sendungsnummer `00340434161094012345` zu `3,40434E+17`. Ihr Kollege aus dem Controlling liest den Export mit Python ein und bekommt einen `UnicodeDecodeError`. Nach 45 Minuten Handarbeit stimmt die Liste ungefähr. Nächsten Monat beginnt alles von vorn.

  Jede dieser Macken hat eine technische Ursache, und jede lässt sich beim Import einmal richtig lösen, statt sie danach jeden Monat von Hand zu flicken. Dieses Modul zeigt, wie ein deutscher CSV-Export aufgebaut ist, woran du Encoding-Probleme erkennst, wie du Zahlen und Datumswerte verlustfrei einliest und wie du die Bereinigung so festhältst, dass sie wiederholbar und prüfbar ist. Die Grundlagen des Python-Moduls `csv` – `DictReader`, `DictWriter`, `newline=""`, Schreiben mit Quoting – stehen im Modul [Datenformate zuverlässig verarbeiten](/automation/datenformate) und werden hier vorausgesetzt. pandas folgt im Modul [pandas: Daten laden und bereinigen](/data/pandas-grundlagen); hier arbeitest du bewusst ohne, damit du siehst, was `read_csv` später für dich erledigt.

  ## Erst hinschauen: die Datei im Terminal untersuchen

  Bevor ein Programm eine Datei interpretiert, schaust du sie roh an. Vier Befehle genügen:

  ```console
  $ file bestellungen_2026-03.csv
  bestellungen_2026-03.csv: ISO-8859 text, with CRLF line terminators
  $ head -n 3 bestellungen_2026-03.csv
  bestellung_id;kunde_id;bestelldatum;plz;stadt;versandkosten;warenwert
  1001;1;02.03.2026;50667;K�ln;0,00;1.250,50
  1002;3;02.03.2026;04109;Leipzig ;4,90;41,40
  $ tail -n 2 bestellungen_2026-03.csv
  1187;4;31.03.2026;53111;Bonn;4,90;205,93
  Summe;;;;;;48.317,20
  $ wc -l bestellungen_2026-03.csv
  189 bestellungen_2026-03.csv
  ```

  Daraus liest du ab: `file` hat kein UTF-8 gefunden, sondern eine 8-Bit-Kodierung. „ISO-8859“ ist nur eine Vermutung aus den Bytes; ein Export von einem deutschen Windows-System ist fast immer Windows-1252. Das `�` in `head` zeigt dasselbe von der anderen Seite: Das Terminal erwartet UTF-8 und kann das Byte für „ö“ nicht darstellen. Trennzeichen ist das Semikolon, Zahlen haben Dezimalkomma und Tausenderpunkt, Datumswerte das Format `TT.MM.JJJJ`. `Leipzig ` hat ein Leerzeichen am Ende, und die letzte Zeile ist keine Bestellung. `wc -l` zählt 189 Zeilenumbrüche: Kopfzeile, 187 Bestellungen und die Summenzeile. Diese Zahl notierst du, damit du am Ende prüfen kannst, dass keine Zeile verloren ging. Zeilenumbrüche sind aber keine Datensätze – ein Feld mit Umbruch in Anführungszeichen zählt doppelt, eine letzte Zeile ohne Umbruch gar nicht.

  Mit `iconv` wandelst du das Encoding in eine neue Datei um; die Rohdatei bleibt unverändert ([iconv(1)](https://man7.org/linux/man-pages/man1/iconv.1.html)):

  ```console
  $ iconv -f WINDOWS-1252 -t UTF-8 bestellungen_2026-03.csv > bestellungen_2026-03.utf8.csv
  $ file bestellungen_2026-03.utf8.csv
  bestellungen_2026-03.utf8.csv: Unicode text, UTF-8 text, with CRLF line terminators
  ```

  Wie Pipes, `grep` und `awk` beim Untersuchen größerer Dateien helfen, zeigt das Linux-Modul [Textverarbeitung & Pipes](/linux/textverarbeitung).

  ## Encoding und Trennzeichen: wie aus Bytes Felder werden

  Eine Datei enthält Bytes, keine Buchstaben. Erst ein **Encoding** legt fest, welches Byte welches Zeichen bedeutet. Für deutsche Exporte sind zwei wichtig:

  - **UTF-8** kodiert jedes Unicode-Zeichen mit 1 bis 4 Bytes. ASCII-Zeichen brauchen eins, „ö“ zwei (`C3 B6`), „€“ drei. UTF-8 ist heute der Standard.
  - **Windows-1252** (`cp1252`) kennt höchstens 256 Zeichen und kodiert jedes mit einem Byte, „ö“ als `F6`, „€“ als `80`. Ältere Windows-Programme und viele ERP-Exporte schreiben es noch. Das oft verwechselte ISO-8859-1 (Latin-1) unterscheidet sich im Bereich `80`–`9F`: Dort fehlt unter anderem das Euro-Zeichen.

  Liest ein Programm die Bytes mit dem falschen Encoding, entsteht **Mojibake**, Zeichensalat mit Muster:

  ```python run
  text = "Köln"
  print(text.encode("utf-8"), text.encode("cp1252"))
  print(text.encode("utf-8").decode("cp1252"))       # UTF-8 als Windows-1252 gelesen
  print("KÃ¶ln".encode("cp1252").decode("utf-8"))    # rückgängig gemacht
  try:
      text.encode("cp1252").decode("utf-8")           # Windows-1252 als UTF-8 gelesen
  except UnicodeDecodeError as fehler:
      print(fehler)
  ```

  | Du siehst | Ursache |
  | --- | --- |
  | `KÃ¶ln`, `GrÃ¼n` | UTF-8-Bytes wurden als Windows-1252 gelesen. |
  | `K�ln` oder `UnicodeDecodeError` | Windows-1252-Bytes wurden als UTF-8 gelesen. |
  | `ï»¿bestellung_id` in der ersten Spalte | UTF-8 mit BOM wurde als Windows-1252 gelesen. |
  | `KeyError: 'bestellung_id'`, obwohl die Spalte da ist | UTF-8 mit BOM wurde als `utf-8` statt `utf-8-sig` gelesen. |

  Das **BOM** (Byte Order Mark) sind die drei Bytes `EF BB BF` am Dateianfang. Excel schreibt sie, wenn du „CSV UTF-8“ speicherst, als Hinweis „diese Datei ist UTF-8“. Python liest sie mit `utf-8` als unsichtbares Zeichen `\ufeff` mit, das dann am ersten Spaltennamen klebt. Das Encoding `utf-8-sig` entfernt ein vorhandenes BOM und liest Dateien ohne BOM genauso wie `utf-8` ([codecs · utf-8-sig](https://docs.python.org/3/library/codecs.html#module-encodings.utf_8_sig)):

  ```python run
  import csv
  import io

  roh = "\ufeffbestellung_id;stadt\n1001;Köln\n".encode("utf-8")
  for encoding in ["utf-8", "utf-8-sig"]:
      zeile = next(csv.DictReader(io.StringIO(roh.decode(encoding), newline=""), delimiter=";"))
      print(encoding, list(zeile))
  ```

  Welches Encoding eine Datei hat, steht nirgends verbindlich drin. Eine belastbare Regel ergibt sich aus dem Aufbau von UTF-8: Bytes ab `80` dürfen dort nur in bestimmten Folgen auftreten. Ein Windows-1252-„ö“ (`F6`) gefolgt von „l“ ist keine gültige Folge, deshalb scheitert ein strenges UTF-8-Dekodieren an echten Windows-1252-Umlauten fast immer. Umgekehrt beweist ein erfolgreiches Windows-1252-Dekodieren wenig: Es akzeptiert fast jedes Byte, Latin-1 sogar jedes.

  > [!MERKE]
  > Erst streng als UTF-8 (`utf-8-sig`) dekodieren. Scheitert das, ist Windows-1252 die naheliegende Rückfallregel. Nie `errors="ignore"` oder Latin-1 „weil es immer klappt“ – beides wirft keinen Fehler und liefert trotzdem falschen Text. Welche Encodings Python kennt, listet [Standard Encodings](https://docs.python.org/3/library/codecs.html#standard-encodings); Grundlagen zu Unicode und Bytes hat das Modul [Strings, Encodings und Dateien](/python/strings-dateien).

  ### Trennzeichen und Quoting: warum das Semikolon

  CSV heißt „comma-separated values“, doch ein deutsches Excel schreibt Semikolons. Der Grund ist das Dezimalkomma: Wenn `4,90` eine Zahl ist, kann das Komma nicht gleichzeitig Felder trennen. Excel nimmt das Listentrennzeichen aus den Regionaleinstellungen von Windows, in Deutschland das Semikolon. Enthält ein Feld selbst ein Semikolon, einen Zeilenumbruch oder ein Anführungszeichen, steht es in Anführungszeichen; ein Anführungszeichen im Feld wird verdoppelt:

  ```csv
  bestellung_id;kunde;lieferhinweis;warenwert
  1003;"Café Luna; Filiale Ehrenfeld";"Bitte ""vor 10 Uhr"" liefern";318,20
  1004;Kanzlei Berger & Partner;"Empfang
  2. OG";96,00
  ```

  Ein `split(";")` zerlegt das falsch, ein echter CSV-Parser nicht. Das Modul `csv` braucht dafür nur das Trennzeichen ([Dialects and Formatting Parameters](https://docs.python.org/3/library/csv.html#csv-fmt-params)):

  ```python run
  import csv
  import io

  text = ('bestellung_id;kunde;lieferhinweis;warenwert\n'
          '1003;"Café Luna; Filiale Ehrenfeld";"Bitte ""vor 10 Uhr"" liefern";318,20\n'
          '1004;Kanzlei Berger & Partner;"Empfang\n2. OG";96,00\n')
  for zeile in csv.reader(io.StringIO(text, newline=""), delimiter=";"):
      print(len(zeile), zeile)
  ```

  Drei Datensätze mit je vier Feldern, obwohl die Datei vier physische Zeilen hat. `csv.Sniffer` kann Trennzeichen raten; für einen bekannten Export legst du den Dialekt einmal fest und schreibst ihn ins Datenwörterbuch.

  ## Zahlen und Datumswerte aus deutschen Exporten

  Alle Werte aus einer CSV sind zunächst Text. Welche Spalte eine Zahl ist, entscheidest du. `float("4,90")` scheitert am Komma; `"1.250,50"` braucht zwei Schritte: erst den Tausenderpunkt entfernen, dann das Komma durch einen Punkt ersetzen. Die Reihenfolge zählt – umgekehrt wird aus `1.250,50` erst `1.250.50` und dann `125050`. Für Geldbeträge nimmst du [`Decimal`](https://docs.python.org/3/library/decimal.html) statt `float`, weil `float` Dezimalbrüche nur angenähert speichert:

  ```python run
  from decimal import Decimal

  def zahl_de(text: str) -> Decimal:
      return Decimal(text.strip().replace(".", "").replace(",", "."))

  print(zahl_de("1.250,50"))
  print(zahl_de("4,90") * 3)
  print(sum([4.90, 4.90, 4.90]))
  ```

  Diese Minimalversion hat Lücken: An leeren Feldern und `n/a` scheitert sie, und ein englisch formatiertes `4.90` macht sie still zu `490`. Deshalb prüft ein robuster Parser das Format, bevor er umwandelt – das übst du in den Aufgaben.

  > [!WARNING] Das Format hängt an der Quelle, nicht am Wert
  > `1.250` ist in einem deutschen Export 1250, in einem englischen 1,25. Am einzelnen Wert lässt sich das nicht entscheiden. Lege das Zahlenformat je Quelle fest und brich mit einer Fehlermeldung ab, wenn ein Wert nicht dazu passt, statt pro Zeile zu raten.

  Datumswerte liest du mit `datetime.strptime` und einem Formatstring ein ([Format Codes](https://docs.python.org/3/library/datetime.html#format-codes)) und gibst sie im ISO-Format `JJJJ-MM-TT` weiter. Nur dieses Format sortiert auch als Text richtig, und SQLite rechnet nur damit:

  ```python run
  from datetime import date, datetime, timedelta

  text = "03.04.2026"
  print(datetime.strptime(text, "%d.%m.%Y").date())     # deutsch: 3. April
  print(datetime.strptime(text, "%m.%d.%Y").date())     # amerikanisch gelesen: 4. März
  print(sorted(["14.03.2026", "02.04.2026", "28.02.2026"]))
  print(date(1899, 12, 30) + timedelta(days=46095))     # Excel-Seriennummer
  ```

  `03.04.2026` ist in beiden Lesarten gültig; ein falsches Format fällt erst ab dem 13. Tag eines Monats auf. Die letzte Zeile zeigt einen dritten Fall: Wer in Excel Werte statt Datumsformat exportiert, bekommt Seriennummern. Excel zählt Tage ab dem 1.1.1900 als Tag 1 und hält 1900 fälschlich für ein Schaltjahr; deshalb rechnest du für alle Daten ab März 1900 ab dem 30.12.1899 ([Excel und das Jahr 1900](https://learn.microsoft.com/de-de/office/troubleshoot/excel/wrongly-assumes-1900-is-leap-year)).

  ## Excel: Doppelklick oder „Daten › Aus Text/CSV“

  Beim Doppelklick auf eine CSV rät Excel alles selbst. Ohne BOM liest es die Datei in der Codepage des Systems, auf einem deutschen Windows also Windows-1252 – ein UTF-8-Export wird zu „KÃ¶ln“. Dann wandelt es jeden Wert um, der wie eine Zahl oder ein Datum aussieht: `01067` wird `1067`, die Röstcharge `12.3` wird zum 12. März, und Zahlen mit mehr als 15 Stellen verlieren ihre letzten Ziffern, weil Excel nur 15 signifikante Stellen speichert ([Beibehalten führender Nullen und großer Zahlen](https://support.microsoft.com/de-de/excel/keeping-leading-zeros-and-large-numbers)). In Excel für Microsoft 365 lassen sich diese Umwandlungen unter Datei › Optionen › Daten › Automatische Datenkonvertierung abschalten ([Datenimport- und Analyseoptionen](https://support.microsoft.com/de-de/excel/data-import-and-analysis-options-in-excel)). Das hilft aber nur auf dem eigenen Rechner.

  > [!WARNING] Nie die Rohdatei zurückspeichern
  > Wer die per Doppelklick geöffnete CSV wieder als CSV speichert, schreibt die Umwandlungen in die Datei: Die führenden Nullen, die abgeschnittenen Ziffern und das ursprüngliche Datumsformat sind danach für immer weg.

  Der verlässliche Weg ist **Daten › Aus Text/CSV**. Der Dialog zeigt eine Vorschau und drei Einstellungen: **Dateiursprung** (das Encoding, etwa „65001: Unicode (UTF-8)“ oder „1252: Westeuropäisch (Windows)“), **Trennzeichen** und **Datentyperkennung**. Power Query leitet UTF-8 nur ab, wenn die Datei mit einem BOM beginnt ([Text/CSV-Connector](https://learn.microsoft.com/de-de/power-query/connectors/text-csv)); stell den Dateiursprung also selbst ein. Mit **Daten transformieren** landest du im Power Query-Editor. Dort setzt du Kennungen und PLZ auf Text und Beträge und Datumswerte über Rechtsklick › Typ ändern › Mit Gebietsschema… auf „Deutsch (Deutschland)“. Der Editor schreibt jeden Schritt als M-Code mit:

  ```powerquery
  let
      Quelle = Csv.Document(File.Contents("C:\Bohnenwerk\Export\bestellungen_2026-03.csv"), [Delimiter = ";", Encoding = 1252, QuoteStyle = QuoteStyle.Csv]),
      #"Höher gestufte Header" = Table.PromoteHeaders(Quelle, [PromoteAllScalars = true]),
      #"Geänderter Typ mit Gebietsschema" = Table.TransformColumnTypes(
          #"Höher gestufte Header",
          {{"bestelldatum", type date}, {"versandkosten", type number}, {"warenwert", type number}},
          "de-DE"
      ),
      #"Geänderter Typ" = Table.TransformColumnTypes(
          #"Geänderter Typ mit Gebietsschema",
          {{"kunde_id", Int64.Type}, {"plz", type text}, {"stadt", type text}}
      )
  in
      #"Geänderter Typ"
  ```

  `Encoding = 1252` ist der Dateiursprung, `"de-DE"` das Gebietsschema für Dezimalkomma und `TT.MM.JJJJ`. `QuoteStyle.Csv` sorgt dafür, dass ein Zeilenumbruch in Anführungszeichen zum Feld gehört; mit `QuoteStyle.None` beginnt dort eine neue Zeile ([Csv.Document](https://learn.microsoft.com/de-de/powerquery-m/csv-document)). Im nächsten Monat ersetzt Lea nur noch die Datei und klickt auf Aktualisieren. Wie du daraus mit Filtern, Ordner-Import und Parametern eine vollständige Monatsroutine baust, zeigt das Modul [Power Query](/data/power-query).

  ## Text bereinigen: Leerzeichen, Schreibweisen, fehlende Werte, Dubletten

  Nach dem Einlesen sind die Werte typrichtig, aber noch nicht einheitlich. Vier Arten von Bereinigung kommen in fast jedem Export vor.

  **Leerraum.** `"Leipzig "` und `"Leipzig"` sind für jeden Vergleich verschieden. Pythons `str.strip()` entfernt Leerraum am Rand, auch das geschützte Leerzeichen `\xa0`, das beim Kopieren aus Webseiten und PDFs entsteht. Excels `GLÄTTEN` (englisch `TRIM`) entfernt dagegen nur das normale Leerzeichen, nicht Zeichen 160 ([GLÄTTEN](https://support.microsoft.com/de-de/excel/functions/trim-function)).

  **Schreibweisen.** „köln“, „KÖLN“ und „Koeln“ meinen dieselbe Stadt. `.title()` hilft nicht („Frankfurt Am Main“), und Raten ist keine Regel. Vergleiche über einen normalisierten Schlüssel und lege die gültige Schreibweise in einer **Zuordnungstabelle** fest. `casefold()` ist für den Vergleich gründlicher als `lower()` („Straße“ und „STRASSE“ werden gleich). Manche Quellen liefern „ö“ als zwei Zeichen (o plus kombinierendes Trema); `unicodedata.normalize("NFC", …)` vereinheitlicht das:

  ```python run
  import unicodedata

  STAEDTE = {"köln": "Köln", "koeln": "Köln", "leipzig": "Leipzig"}

  def stadt(roh: str) -> str:
      schluessel = unicodedata.normalize("NFC", roh).strip().casefold()
      return STAEDTE.get(schluessel, roh.strip())

  for roh in ["Leipzig ", "\xa0KÖLN", "Koeln", "Ko\u0308ln", "Bonn"]:
      print(repr(roh), "->", stadt(roh))
  ```

  Unbekannte Werte wie „Bonn“ bleiben stehen, wie sie sind. Die Zuordnungstabelle wächst mit jedem Export um die neuen Varianten; sie ist Teil der Dokumentation.

  **Fehlende Werte.** Exporte kennen viele Arten, nichts zu sagen. Entscheidend ist, was jede fachlich bedeutet:

  | Im Export | Bedeutung | Behandlung |
  | --- | --- | --- |
  | leeres Feld | nicht erfasst, unbekannt | fehlend (`None`) |
  | `n/a`, `-`, `k. A.` | ausdrücklich „keine Angabe“ | fehlend, Liste je Quelle festhalten |
  | `0`, `0,00` | ein echter Wert: kostenloser Versand | bleibt 0 |
  | `?`, `xxx`, `9999` | Platzhalter bei der Erfassung | nicht raten: aussortieren und nachfragen |

  Fehlende Werte mit 0 zu füllen ist bequem und falsch: Der Durchschnitt der Versandkosten sinkt, obwohl niemand kostenlos versandt hat.

  **Dubletten.** Eine exakte Dublette – jede Spalte gleich – entsteht, wenn ein Export doppelt lief oder sich Zeiträume überlappen. Sie wird entfernt und gezählt. Prüfe erst nach dem Trimmen und Umwandeln, sonst sind `"Leipzig "` und `"Leipzig"` verschieden. Gleicher Schlüssel mit anderem Inhalt (Bestellung 1044 einmal `bezahlt`, einmal `storniert`) ist dagegen keine Dublette, sondern ein fachlicher Konflikt: Welche Zeile gilt, entscheidet eine dokumentierte Regel, etwa „letzter Stand“. Solche Zeilen gehören in eine Quarantäne, bis die Regel steht – mehr dazu im Modul [Datenqualität](/data/datenqualitaet).

  ## Bereinigung dokumentieren: Rohdaten bleiben unverändert

  Eine Bereinigung ist nur so gut wie ihre Nachvollziehbarkeit. Drei Regeln machen sie prüfbar:

  1. **Rohdaten sind schreibgeschützt.** Die Originaldatei wird archiviert und nie bearbeitet. Jede Korrektur passiert in Code oder in Power-Query-Schritten und schreibt eine neue Datei.
  2. **Jeder Schritt zählt mit.** Wie viele Zeilen wurden gelesen, wie viele als Summenzeile oder Dublette entfernt, wie viele Werte vereinheitlicht oder als fehlend markiert?
  3. **Das Ergebnis wird abgeglichen.** Die Summe der bereinigten Beträge muss zur Summenzeile des Exports passen. Die Summenzeile ist keine Beobachtung, aber ein nützlicher Kontrollwert.

  Am Ende jedes Laufs entsteht ein kurzes Protokoll:

  ```text
  Bereinigungsprotokoll bestellungen_2026-03.csv
  Quelle        Shop-Export vom 2026-04-01, Windows-1252 (UTF-8 schlug fehl)
  Rohdatei      189 Zeilen laut wc -l, unverändert archiviert
  Gelesen       188 Datensätze
  Summenzeile   1 entfernt; warenwert 48.317,20 = Summe der Datensätze
  Dubletten     2 exakte Dubletten entfernt (1071, 1102)
  Stadt         37 Werte über staedte.csv vereinheitlicht
  Versand       3 Werte fehlend (n/a), nicht mit 0 gefüllt
  Behalten      185 Bestellungen
  ```

  > [!PRAXIS] Von 45 Minuten auf wenige Sekunden
  > Bei Bohnenwerk ersetzt ein Python-Skript die monatliche Handarbeit: Es liest den Export mit Rückfallregel für das Encoding, entfernt Summenzeile und Dubletten, vereinheitlicht Städte über die Zuordnungstabelle und schreibt eine UTF-8-Datei plus Protokoll. Weicht die Summe von der Summenzeile ab oder taucht ein unbekanntes Zahlenformat auf, bricht es mit einer klaren Meldung ab. Lea prüft nur noch das Protokoll. Weil jeder Schritt im Code steht, kann auch eine Vertretung den Monatsabschluss machen.

  > [!INTERVIEW] „Woran erkennst du, in welchem Encoding eine Datei vorliegt?“
  > Sicher wissen kann ich es nur von der Quelle, deshalb frage ich zuerst dort nach. Technisch prüfe ich die Bytes: Ein BOM `EF BB BF` spricht für UTF-8, `file` gibt einen Hinweis. Der belastbarste Test ist, streng als UTF-8 zu dekodieren – echte Windows-1252-Umlaute scheitern daran fast immer. Scheitert es, lese ich Windows-1252 und kontrolliere bekannte Werte wie „Köln“ oder das Euro-Zeichen. Latin-1 oder `errors="ignore"` nutze ich nicht als Rettung, weil beides nie einen Fehler wirft und trotzdem falschen Text liefern kann.

  ## Häufige Fehler

  - **Doppelklick und zurückspeichern.** Führende Nullen, lange Nummern und Datumsformate sind danach dauerhaft zerstört. Rohdatei archivieren, über „Daten › Aus Text/CSV“ importieren.
  - **`errors="ignore"` oder Latin-1 als Rettung.** Der Fehler verschwindet, die Umlaute auch. Streng dekodieren, begründet zurückfallen.
  - **`KeyError` beim ersten Spaltennamen.** Ein BOM klebt als `\ufeff` davor. `encoding="utf-8-sig"` verwenden.
  - **`split(";")` statt CSV-Parser.** Semikolons und Zeilenumbrüche in Anführungszeichen zerlegen die Zeile.
  - **Komma vor dem Punkt ersetzt.** Aus `1.250,50` wird `125050`. Erst Tausenderpunkte entfernen, dann das Komma ersetzen – und das Format vorher prüfen.
  - **Kennungen als Zahl eingelesen.** PLZ, Artikelnummern und Kundennummern mit führender Null bleiben Text.
  - **Fehlende Werte mit 0 gefüllt.** Durchschnitte und Anteile stimmen nicht mehr. Fehlend bleibt fehlend, bis die Bedeutung geklärt ist.
  - **Dubletten vor dem Trimmen gesucht.** `"Leipzig "` und `"Leipzig"` gelten als verschieden, die Dublette bleibt.

  ## Zusammenfassung

  - Erst hinschauen: `file`, `head`, `tail` und `wc -l` zeigen Encoding, Trennzeichen, Formate und Summenzeilen, bevor ein Programm etwas interpretiert.
  - Encoding bestimmt, wie Bytes zu Zeichen werden. Streng als `utf-8-sig` lesen, bei Fehler auf Windows-1252 zurückfallen; Mojibake verrät die Richtung des Fehlers.
  - Deutsche Exporte trennen mit `;` und quoten Felder mit `"`. Ein echter CSV-Parser ist Pflicht.
  - Beträge: Format je Quelle festlegen, erst Tausenderpunkt entfernen, dann Komma ersetzen, in `Decimal` rechnen. Datumswerte mit `strptime` lesen und als ISO-Datum weitergeben.
  - Excel „korrigiert“ beim Doppelklick führende Nullen, lange Zahlen und datumsähnliche Werte. „Daten › Aus Text/CSV“ mit Dateiursprung, Typen und Gebietsschema ist wiederholbar.
  - Leerraum trimmen, Schreibweisen über eine Zuordnungstabelle vereinheitlichen, fehlende Werte als fehlend markieren, Dubletten nach dem Umwandeln entfernen.
  - Rohdaten bleiben unverändert; jeder Schritt wird gezählt, protokolliert und gegen die Summenzeile abgeglichen.
exercises:
  - id: mojibake-diagnose
    type: choice
    title: Was ist mit „Köln“ passiert?
    prompt: |
      Nach dem Import eines Kundenexports steht in Excel in der ersten Kopfzelle `ï»¿kunde_id` und in der Spalte `stadt` „KÃ¶ln“ und „DÃ¼sseldorf“. Was ist passiert?
    options:
      - text: Die Datei ist UTF-8 mit BOM und wurde als Windows-1252 gelesen.
        correct: true
        why: "„ö“ besteht in UTF-8 aus den Bytes `C3 B6`, die Windows-1252 als „Ã“ und „¶“ zeigt. Die BOM-Bytes `EF BB BF` erscheinen als „ï»¿“."
      - text: Die Datei ist Windows-1252 und wurde als UTF-8 gelesen.
        correct: false
        why: Dann wäre das einzelne Byte `F6` für „ö“ ungültiges UTF-8. Du sähest ein Ersatzzeichen `�` oder bekämst einen `UnicodeDecodeError`, aber kein „Ã¶“.
      - text: Das Trennzeichen wurde falsch erkannt, deshalb sind die Zeichen verrutscht.
        correct: false
        why: Ein falsches Trennzeichen verteilt Werte falsch auf Spalten, verändert aber keine einzelnen Buchstaben.
      - text: Der Schriftart in Excel fehlen die Umlaute.
        correct: false
        why: Excel zeigt „ö“ an anderen Stellen korrekt. Das Problem liegt in der Übersetzung von Bytes zu Zeichen, nicht in der Darstellung.
    explanation: |
      Mojibake hat ein Muster, aus dem du die Richtung ablesen kannst. Zwei Zeichen wie „Ã¶“ für einen Umlaut heißen: Mehrbyte-UTF-8 wurde als Einbyte-Kodierung gelesen. „ï»¿“ am Anfang ist das BOM, das ein UTF-8-fähiger Leser stillschweigend entfernt hätte. Die Lösung ist, beim Import den Dateiursprung „65001: Unicode (UTF-8)“ zu wählen, nicht „Ã¶“ per Suchen und Ersetzen zu reparieren.
    hints:
      - Wie viele Zeichen stehen im Ergebnis dort, wo ein „ö“ sein sollte?
      - Welche Kodierung braucht für „ö“ zwei Bytes?
