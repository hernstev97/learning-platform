id: csv-import
title: CSV-Import und Datenbereinigung
level: 1
minutes: 170
summary: Encoding, Trennzeichen, Dezimalkomma und Datumsformate deutscher Exporte sicher einlesen, Excels automatische „Korrekturen“ vermeiden und jeden Bereinigungsschritt nachvollziehbar machen.
goals:
  - Du untersuchst einen Export mit `file`, `head`, `tail` und `wc -l`, bevor du ihn öffnest, und wandelst sein Encoding mit `iconv` um.
  - Du erkennst UTF-8, BOM und Windows-1252 an ihren Symptomen und dekodierst mit einer begründeten Rückfallregel.
  - Du wandelst Dezimalkomma, Tausenderpunkt und deutsche Datumsangaben verlustfrei in `Decimal` und `date` um und erhältst führende Nullen.
  - Du erklärst, was Excel beim Doppelklick auf eine CSV umwandelt, und importierst stattdessen über „Daten › Aus Text/CSV“ mit Typen und Gebietsschema.
  - Du bereinigst Leerzeichen, Schreibweisen, fehlende Werte und Dubletten nachvollziehbar und protokollierst jeden Schritt.
