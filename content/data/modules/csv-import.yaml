  - id: dekodieren-mit-fallback
    type: code
    title: Repariere das Dekodieren
    prompt: |
      Der Import von Bohnenwerk bekommt Exporte aus zwei Systemen: der Webshop schreibt UTF-8 (manchmal mit BOM), das ERP Windows-1252. Bisher dekodiert `dekodiere(roh)` alles als Latin-1 – das wirft nie einen Fehler, liefert aber falsche Zeichen. Schreibe die Funktion neu:

      - Erst streng als UTF-8 dekodieren; ein BOM wird dabei entfernt. Rückgabe: `(text, "utf-8")`.
      - Scheitert das, streng als Windows-1252 dekodieren. Rückgabe: `(text, "cp1252")`.
      - Scheitert auch das, `ValueError` auslösen.
    lang: python
    starter: |
      def dekodiere(roh: bytes) -> tuple[str, str]:
          return roh.decode("latin-1"), "latin-1"
    solution: |
      def dekodiere(roh: bytes) -> tuple[str, str]:
          try:
              return roh.decode("utf-8-sig"), "utf-8"
          except UnicodeDecodeError:
              pass
          try:
              return roh.decode("cp1252"), "cp1252"
          except UnicodeDecodeError as fehler:
              raise ValueError("Weder UTF-8 noch Windows-1252") from fehler
    tests:
      - name: UTF-8 ohne BOM
        code: |
          ergebnis = dekodiere("Köln;4,90\n".encode("utf-8"))
          assert ergebnis == ("Köln;4,90\n", "utf-8"), f"erwartet ('Köln;4,90\\n', 'utf-8'), bekommen {ergebnis!r}"
      - name: UTF-8 mit BOM – das BOM verschwindet
        code: |
          text, encoding = dekodiere(b"\xef\xbb\xbfkunde_id;stadt\n1;K\xc3\xb6ln\n")
          assert encoding == "utf-8", f"erwartet 'utf-8', bekommen {encoding!r}"
          assert text == "kunde_id;stadt\n1;Köln\n", f"Das BOM gehört nicht in den Text: {text!r}"
      - name: Windows-1252 mit Umlauten und Euro-Zeichen
        code: |
          ergebnis = dekodiere("Grüße aus Köln;12,50 €\n".encode("cp1252"))
          assert ergebnis == ("Grüße aus Köln;12,50 €\n", "cp1252"), f"bekommen {ergebnis!r}"
      - name: Reines ASCII gilt als UTF-8
        code: |
          assert dekodiere(b"id;menge\n1;2\n") == ("id;menge\n1;2\n", "utf-8")
          assert dekodiere(b"") == ("", "utf-8"), "Eine leere Datei ist gültiges UTF-8"
      - name: Weder UTF-8 noch Windows-1252
        code: |
          try:
              ergebnis = dekodiere(b"K\x81ln")
          except ValueError:
              pass
          else:
              assert False, f"Byte 0x81 ist in beiden Kodierungen ungültig – erwartet ValueError, bekommen {ergebnis!r}"
    explanation: |
      Die Reihenfolge ist der Kern: UTF-8 hat strenge Regeln für Bytes ab `0x80`, Windows-1252-Umlaute verletzen sie fast immer. Deshalb ist ein erfolgreiches strenges UTF-8-Dekodieren ein starkes Indiz, ein erfolgreiches Windows-1252-Dekodieren dagegen kaum eins. `utf-8-sig` entfernt ein vorhandenes BOM und liest Dateien ohne BOM wie `utf-8`. Latin-1 als Rückfall wäre falsch: Es wirft nie einen Fehler und macht aus dem Euro-Zeichen (`0x80`) ein unsichtbares Steuerzeichen. Weil `UnicodeDecodeError` eine Unterklasse von `ValueError` ist, würde auch der unveränderte Fehler den letzten Test bestehen; die eigene Meldung ist für das Protokoll trotzdem hilfreicher.
    hints:
      - Zwei `try`-Blöcke hintereinander, der erste mit `utf-8-sig`.
      - "`bytes.decode` ist ohne `errors`-Argument streng und wirft `UnicodeDecodeError`."
    resources:
      - title: Python · Standard Encodings
        url: https://docs.python.org/3/library/codecs.html#standard-encodings
      - title: Python · codecs · utf-8-sig
        url: https://docs.python.org/3/library/codecs.html#module-encodings.utf_8_sig

  - id: betrag-parsen
    type: code
    title: Beträge aus dem deutschen Export
    prompt: |
      Schreibe `betrag(text)` für die Betragsspalten des Webshop-Exports. Der Export ist deutsch formatiert: Tausenderpunkt, Dezimalkomma, manchmal ein angehängtes `€`, manchmal Leerraum (auch das geschützte Leerzeichen `\xa0`).

      - Rückgabe ist ein `Decimal`, etwa `Decimal("1250.50")` für `"1.250,50 €"`. Negative Beträge (Gutschriften) wie `"-12,50"` sind erlaubt.
      - Leer, `-`, `n/a` und `k. A.` (Groß-/Kleinschreibung egal) bedeuten „fehlend“: Rückgabe `None`. `0` und `0,00` sind echte Nullen.
      - Alles, was nicht zum deutschen Format passt, löst `ValueError` aus – auch ein englisch formatiertes `4.90`.
    lang: python
    starter: |
      from decimal import Decimal


      def betrag(text: str) -> Decimal | None:
          return Decimal(text.replace(",", "."))
    solution: |
      import re
      from decimal import Decimal

      FEHLEND = {"", "-", "n/a", "k. a."}
      DEUTSCH = re.compile(r"-?(\d{1,3}(\.\d{3})+|\d+)(,\d+)?")


      def betrag(text: str) -> Decimal | None:
          sauber = text.strip().removesuffix("€").strip()
          if sauber.casefold() in FEHLEND:
              return None
          if not DEUTSCH.fullmatch(sauber):
              raise ValueError(f"Kein Betrag im deutschen Format: {text!r}")
          return Decimal(sauber.replace(".", "").replace(",", "."))
    tests:
      - name: Dezimalkomma
        code: |
          ergebnis = betrag("4,90")
          assert isinstance(ergebnis, Decimal), f"erwartet Decimal, bekommen {type(ergebnis).__name__}"
          assert ergebnis == Decimal("4.90"), f"erwartet 4.90, bekommen {ergebnis}"
      - name: Tausenderpunkt, Euro-Zeichen und Leerraum
        code: |
          for text in ["1.250,50", "1250,50", "\xa01.250,50 €", "1.250,50€"]:
              assert betrag(text) == Decimal("1250.50"), f"{text!r} ergibt {betrag(text)}, erwartet 1250.50"
          assert betrag("12.345.678,9") == Decimal("12345678.9")
      - name: Gutschrift
        code: |
          assert betrag("-12,50") == Decimal("-12.50"), f"bekommen {betrag('-12,50')}"
      - name: Fehlend ist None, 0 bleibt 0
        code: |
          for text in ["", "  ", "-", "n/a", "N/A", "k. A."]:
              assert betrag(text) is None, f"{text!r} bedeutet fehlend, bekommen {betrag(text)!r}"
          for text in ["0", "0,00"]:
              assert betrag(text) == 0 and betrag(text) is not None, f"{text!r} ist eine echte Null"
      - name: Falsches Format ist ein Fehler
        code: |
          for text in ["4.90", "1.25,00", "12,3,4", "zwölf", "4,90 USD"]:
              try:
                  ergebnis = betrag(text)
              except ValueError:
                  continue
              assert False, f"{text!r} passt nicht zum deutschen Format – erwartet ValueError, bekommen {ergebnis!r}"
    explanation: |
      Die Funktion trennt drei Fälle: fehlend, gültig, ungültig. Fehlende Werte werden `None`, nicht 0 – sonst sinkt jeder Durchschnitt. Gültige Werte prüft ein regulärer Ausdruck gegen das deutsche Format, bevor umgewandelt wird: Tausenderpunkte nur vor Dreiergruppen, höchstens ein Komma. Ohne diese Prüfung würde `4.90` still zu 490 und `1.25,00` zu 125. `Decimal("…")` allein löst bei kaputtem Text `decimal.InvalidOperation` aus, das keine Unterklasse von `ValueError` ist; die eigene Prüfung liefert den erwarteten Fehlertyp und eine Meldung mit dem Originalwert fürs Protokoll.
    hints:
      - Erst Leerraum und `€` entfernen, dann die Fehlend-Werte mit `casefold()` prüfen.
      - "Ein Muster für das deutsche Format: optionales Minus, Ziffern mit Tausenderpunkten oder ohne, optional Komma und Nachkommastellen."
      - "`re.fullmatch(r\"-?(\\d{1,3}(\\.\\d{3})+|\\d+)(,\\d+)?\", text)`, danach Punkte entfernen und das Komma ersetzen."
    resources:
      - title: Python · decimal
        url: https://docs.python.org/3/library/decimal.html
      - title: Python · re.fullmatch
        url: https://docs.python.org/3/library/re.html#re.fullmatch

  - id: bom-keyerror
    type: bug
    title: Die Spalte, die da ist und doch fehlt
    prompt: |
      Die Vertriebsassistenz speichert die Kundenliste neuerdings in Excel als „CSV UTF-8“. Seitdem bricht das Einlesen ab:

      ```text
      KeyError: 'kunde_id'
      ```

      In einem Texteditor beginnt die Datei mit `kunde_id;name;stadt`. Mit den alten Exporten lief derselbe Code fehlerfrei. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      import csv
      from pathlib import Path

      def lies_kunden(pfad: Path) -> list[dict]:
          with pfad.open(encoding="utf-8", newline="") as datei:
              zeilen = list(csv.DictReader(datei, delimiter=";"))
          return [{"kunde_id": int(z["kunde_id"]), "stadt": z["stadt"].strip()} for z in zeilen]
    lines: [5]
    fix:
      - line: 5
        answers:
          - 'with pfad.open(encoding="utf-8-sig", newline="") as datei:'
          - 'with pfad.open(newline="", encoding="utf-8-sig") as datei:'
          - 'with pfad.open(encoding="utf_8_sig", newline="") as datei:'
          - 'with pfad.open(newline="", encoding="utf_8_sig") as datei:'
    explanation: |
      Excel schreibt bei „CSV UTF-8“ ein BOM an den Dateianfang. Mit `encoding="utf-8"` liest Python es als Zeichen `\ufeff` mit, und der erste Spaltenname heißt `"\ufeffkunde_id"` – im Editor unsichtbar, für das Dictionary ein anderer Schlüssel. `utf-8-sig` entfernt ein vorhandenes BOM und liest Dateien ohne BOM unverändert, funktioniert also mit alten und neuen Exporten. `print(reader.fieldnames)` hätte den Fehler mit `repr` sofort gezeigt.
    hints:
      - Lass dir die Spaltennamen mit `repr` ausgeben – was steht vor `kunde_id`?
      - Welches Encoding entfernt ein BOM?
    resources:
      - title: Python · codecs · utf-8-sig
        url: https://docs.python.org/3/library/codecs.html#module-encodings.utf_8_sig

  - id: gebietsschema-falsch
    type: bug
    title: Versand für 490 Euro
    prompt: |
      Ein Kollege hat die Power-Query-Abfrage für den Bestellexport angepasst, damit sie „auf allen Rechnern gleich läuft“. Seitdem zeigt sie Versandkosten von 490 statt 4,90, und bei allen Bestellungen ab dem 13. eines Monats steht in `bestelldatum` ein Fehler. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: powerquery
    code: |
      let
          Quelle = Csv.Document(File.Contents("C:\Bohnenwerk\Export\bestellungen_2026-03.csv"), [Delimiter = ";", Encoding = 1252, QuoteStyle = QuoteStyle.Csv]),
          #"Höher gestufte Header" = Table.PromoteHeaders(Quelle, [PromoteAllScalars = true]),
          #"Geänderter Typ mit Gebietsschema" = Table.TransformColumnTypes(
              #"Höher gestufte Header",
              {{"bestelldatum", type date}, {"versandkosten", type number}, {"warenwert", type number}},
              "en-US"
          ),
          #"Geänderter Typ" = Table.TransformColumnTypes(
              #"Geänderter Typ mit Gebietsschema",
              {{"kunde_id", Int64.Type}, {"plz", type text}}
          )
      in
          #"Geänderter Typ"
    lines: [7]
    fix:
      - line: 7
        answers:
          - '"de-DE"'
    explanation: |
      Das Gebietsschema in `Table.TransformColumnTypes` beschreibt, wie die **Quelle** formatiert ist, nicht wie der Rechner eingestellt ist. Der Export ist deutsch: Dezimalkomma und `TT.MM.JJJJ`. Mit `"en-US"` ist das Komma ein Tausendertrennzeichen, aus `4,90` wird 490, und `14.03.2026` hätte einen 14. Monat. Die Tage 1 bis 12 sind die gefährlicheren Fälle: Sie können still als Monat gelesen werden. Mit `"de-DE"` liefert die Abfrage auf jedem Rechner dasselbe Ergebnis, unabhängig von dessen Spracheinstellung.
    hints:
      - Welche Zeile legt fest, wie Zahlen und Datumswerte gelesen werden?
      - Das Gebietsschema beschreibt die Datei, nicht den Rechner.
    resources:
      - title: Microsoft Learn · Table.TransformColumnTypes
        url: https://learn.microsoft.com/de-de/powerquery-m/table-transformcolumntypes
      - title: Microsoft Learn · Datentypen und Gebietsschema in Power Query
        url: https://learn.microsoft.com/de-de/power-query/data-types#document-or-project-locale

  - id: import-abfrage-erklaeren
    type: explain
    title: Warum diese Abfrage den Doppelklick ersetzt
    prompt: |
      Leas Teamleiter fragt, warum sie für den Monatsexport „so eine komplizierte Abfrage“ braucht, statt die CSV per Doppelklick zu öffnen. Erkläre ihm, was die Schritte tun und was dadurch besser wird.
    lang: powerquery
    code: |
      let
          Quelle = Csv.Document(File.Contents("C:\Bohnenwerk\Export\bestellungen_2026-03.csv"), [Delimiter = ";", Encoding = 1252, QuoteStyle = QuoteStyle.Csv]),
          #"Höher gestufte Header" = Table.PromoteHeaders(Quelle, [PromoteAllScalars = true]),
          #"Gefilterte Zeilen" = Table.SelectRows(#"Höher gestufte Header", each [bestellung_id] <> "Summe"),
          #"Geänderter Typ mit Gebietsschema" = Table.TransformColumnTypes(
              #"Gefilterte Zeilen",
              {{"bestelldatum", type date}, {"versandkosten", type number}, {"warenwert", type number}},
              "de-DE"
          ),
          #"Geänderter Typ" = Table.TransformColumnTypes(
              #"Geänderter Typ mit Gebietsschema",
              {{"bestellung_id", Int64.Type}, {"plz", type text}, {"artikel_nr", type text}}
          )
      in
          #"Geänderter Typ"
    points:
      - Encoding (1252) und Trennzeichen (`;`) sind festgelegt statt geraten; Umlaute und Spalten stimmen auf jedem Rechner.
      - "`QuoteStyle.Csv` behandelt Zeilenumbrüche in Anführungszeichen als Teil des Feldes."
      - Die Summenzeile wird entfernt, bevor Typen gesetzt werden – sonst entstünde eine falsche Bestellung oder eine Fehlerzeile.
      - Beträge und Datum werden mit dem Gebietsschema der Quelle (de-DE) gelesen; PLZ und Artikelnummer bleiben Text und behalten führende Nullen.
      - Die Rohdatei bleibt unverändert, und nächsten Monat genügt Aktualisieren – die Schritte sind zugleich die Dokumentation.
    explanation: |
      Beim Doppelklick rät Excel Encoding, Trennzeichen und Typen, und es rät bei jedem Öffnen neu: PLZ verlieren die Null, lange Nummern Ziffern, ein UTF-8-Export bekommt Mojibake. Die Abfrage legt dagegen alles ausdrücklich fest. `Csv.Document` liest mit Windows-1252, Semikolon und CSV-Quoting, sodass auch ein Lieferhinweis mit Zeilenumbruch in seinem Feld bleibt. Die Kopfzeile wird höher gestuft, dann filtert `Table.SelectRows` die Summenzeile heraus – vor der Typumwandlung, weil „Summe“ keine Bestellnummer ist. Der erste Typ-Schritt liest Datum und Beträge mit dem deutschen Gebietsschema der Quelle; der zweite setzt Kennungen, PLZ und Artikelnummer ausdrücklich auf Text beziehungsweise Ganzzahl.

      Der größte Vorteil ist nicht der einzelne Schritt, sondern die Wiederholbarkeit: Die Rohdatei wird nie verändert, im nächsten Monat wird sie ersetzt und die Abfrage aktualisiert. Jeder Schritt steht sichtbar unter „Angewendete Schritte“, also kann jemand anderes nachvollziehen und prüfen, was mit den Daten passiert ist.
    resources:
      - title: Microsoft Learn · Csv.Document
        url: https://learn.microsoft.com/de-de/powerquery-m/csv-document
      - title: Microsoft Learn · Table.SelectRows
        url: https://learn.microsoft.com/de-de/powerquery-m/table-selectrows

  - id: export-bereinigen
    type: code
    title: Der Monatsexport, bereinigt und protokolliert
    prompt: |
      Schreibe `bereinige(zeilen)`. `zeilen` ist eine Liste von Dictionaries aus einem `csv.DictReader` (alle Werte Text) mit den Spalten `bestellung_id`, `bestelldatum`, `stadt` und `versandkosten`. Die Hilfsfunktionen `betrag` und `datum` und die Zuordnungstabelle `STAEDTE` sind schon da. Die Tests nutzen diesen Export (als Liste `EXPORT` verfügbar):

      | bestellung_id | bestelldatum | stadt | versandkosten |
      | --- | --- | --- | --- |
      | 1001 | 02.03.2026 | Köln | 0,00 |
      | 1002 | 05.03.2026 | `Leipzig␣` | 4,90 |
      | 1003 | 09.03.2026 | `␣köln` | n/a |
      | 1002 | 05.03.2026 | Leipzig | 4,90 |
      | 1004 | 13.03.2026 | `KOELN` + `\xa0` | 6,50 |
      | 1005 | 31.03.2026 | Bonn | 4,30 |
      | Summe | | | 15,70 |

      Regeln:

      - Jeder Wert wird getrimmt. Eine Zeile, deren `bestellung_id` mit „Summe“ beginnt, wird entfernt und gezählt.
      - Jede übrige Zeile wird zu `{"bestellung_id": int, "bestelldatum": date, "stadt": str, "versandkosten": Decimal | None}`. Die Stadt wird über `STAEDTE` (Schlüssel: `casefold()` des getrimmten Werts) vereinheitlicht; unbekannte Städte bleiben getrimmt stehen.
      - Exakte Dubletten – nach der Umwandlung gleiche Zeilen – werden entfernt und gezählt; die erste bleibt, die Reihenfolge bleibt erhalten.
      - Rückgabe: `(saubere_zeilen, protokoll)` mit `protokoll = {"gelesen": …, "summenzeilen": …, "dubletten": …, "behalten": …}`.
      - Die übergebene Liste und ihre Dictionaries bleiben unverändert.
    lang: python
    setup: |
      EXPORT = [
          {"bestellung_id": "1001", "bestelldatum": "02.03.2026", "stadt": "Köln", "versandkosten": "0,00"},
          {"bestellung_id": "1002", "bestelldatum": "05.03.2026", "stadt": "Leipzig ", "versandkosten": "4,90"},
          {"bestellung_id": "1003", "bestelldatum": "09.03.2026", "stadt": " köln", "versandkosten": "n/a"},
          {"bestellung_id": "1002", "bestelldatum": "05.03.2026", "stadt": "Leipzig", "versandkosten": "4,90"},
          {"bestellung_id": "1004", "bestelldatum": "13.03.2026", "stadt": "KOELN\xa0", "versandkosten": "6,50"},
          {"bestellung_id": "1005", "bestelldatum": "31.03.2026", "stadt": "Bonn", "versandkosten": "4,30"},
          {"bestellung_id": "Summe", "bestelldatum": "", "stadt": "", "versandkosten": "15,70"},
      ]
    starter: |
      from datetime import date, datetime
      from decimal import Decimal

      STAEDTE = {"köln": "Köln", "koeln": "Köln", "leipzig": "Leipzig", "hamburg": "Hamburg"}
      FEHLEND = {"", "-", "n/a", "k. a."}


      def betrag(text: str) -> Decimal | None:
          text = text.strip()
          if text.casefold() in FEHLEND:
              return None
          return Decimal(text.replace(".", "").replace(",", "."))


      def datum(text: str) -> date:
          return datetime.strptime(text.strip(), "%d.%m.%Y").date()


      def bereinige(zeilen: list[dict]) -> tuple[list[dict], dict]:
          saubere = []
          protokoll = {"gelesen": len(zeilen), "summenzeilen": 0, "dubletten": 0, "behalten": 0}
          for zeile in zeilen:
              ...
          return saubere, protokoll
    solution: |
      from datetime import date, datetime
      from decimal import Decimal

      STAEDTE = {"köln": "Köln", "koeln": "Köln", "leipzig": "Leipzig", "hamburg": "Hamburg"}
      FEHLEND = {"", "-", "n/a", "k. a."}


      def betrag(text: str) -> Decimal | None:
          text = text.strip()
          if text.casefold() in FEHLEND:
              return None
          return Decimal(text.replace(".", "").replace(",", "."))


      def datum(text: str) -> date:
          return datetime.strptime(text.strip(), "%d.%m.%Y").date()


      def bereinige(zeilen: list[dict]) -> tuple[list[dict], dict]:
          saubere = []
          gesehen = set()
          protokoll = {"gelesen": len(zeilen), "summenzeilen": 0, "dubletten": 0, "behalten": 0}
          for zeile in zeilen:
              werte = {spalte: wert.strip() for spalte, wert in zeile.items()}
              if werte["bestellung_id"].casefold().startswith("summe"):
                  protokoll["summenzeilen"] += 1
                  continue
              sauber = {
                  "bestellung_id": int(werte["bestellung_id"]),
                  "bestelldatum": datum(werte["bestelldatum"]),
                  "stadt": STAEDTE.get(werte["stadt"].casefold(), werte["stadt"]),
                  "versandkosten": betrag(werte["versandkosten"]),
              }
              schluessel = tuple(sauber.values())
              if schluessel in gesehen:
                  protokoll["dubletten"] += 1
                  continue
              gesehen.add(schluessel)
              saubere.append(sauber)
          protokoll["behalten"] = len(saubere)
          return saubere, protokoll
    tests:
      - name: Eine Zeile wird vollständig typisiert
        code: |
          saubere, _ = bereinige(EXPORT)
          assert saubere, "Es kommen keine Zeilen zurück"
          erwartet = {"bestellung_id": 1001, "bestelldatum": date(2026, 3, 2), "stadt": "Köln", "versandkosten": Decimal("0.00")}
          assert saubere[0] == erwartet, f"erwartet {erwartet!r}, bekommen {saubere[0]!r}"
      - name: Städte sind vereinheitlicht
        code: |
          saubere, _ = bereinige(EXPORT)
          staedte = [z["stadt"] for z in saubere]
          assert staedte == ["Köln", "Leipzig", "Köln", "Köln", "Bonn"], f"bekommen {staedte!r}"
      - name: Fehlend bleibt fehlend, 0 bleibt 0
        code: |
          saubere, _ = bereinige(EXPORT)
          nach_id = {z["bestellung_id"]: z for z in saubere}
          assert nach_id[1003]["versandkosten"] is None, f"n/a muss None werden, bekommen {nach_id[1003]['versandkosten']!r}"
          assert nach_id[1001]["versandkosten"] == 0 and nach_id[1001]["versandkosten"] is not None, "0,00 ist ein echter Wert"
      - name: Summenzeile und Dublette entfernt, Protokoll stimmt
        code: |
          saubere, protokoll = bereinige(EXPORT)
          ids = [z["bestellung_id"] for z in saubere]
          assert ids == [1001, 1002, 1003, 1004, 1005], f"erwartet die Bestellungen 1001 bis 1005 in Exportreihenfolge, bekommen {ids!r}"
          erwartet = {"gelesen": 7, "summenzeilen": 1, "dubletten": 1, "behalten": 5}
          assert protokoll == erwartet, f"erwartet {erwartet!r}, bekommen {protokoll!r}"
      - name: Abgleich mit der Summenzeile
        code: |
          saubere, _ = bereinige(EXPORT)
          summe = sum(z["versandkosten"] for z in saubere if z["versandkosten"] is not None)
          assert summe == Decimal("15.70"), f"Die Versandkosten müssen zur Summenzeile 15,70 passen, bekommen {summe}"
      - name: Rohdaten bleiben unverändert
        code: |
          import copy
          vorher = copy.deepcopy(EXPORT)
          bereinige(EXPORT)
          assert EXPORT == vorher, "bereinige darf die übergebenen Zeilen nicht verändern"
    explanation: |
      Die Reihenfolge der Schritte entscheidet: erst trimmen, dann die Summenzeile erkennen (sonst scheitert `datum` an ihrem leeren Feld), dann umwandeln und vereinheitlichen, zuletzt Dubletten auf den **bereinigten** Werten suchen. Nur so ist `"Leipzig "` mit 4,90 dieselbe Bestellung wie `"Leipzig"` mit 4,90. Ein Set aus Tupeln merkt sich, was schon da war, und hält die Exportreihenfolge. Die neuen Dictionaries lassen die Rohdaten unberührt. Der Abgleich mit der Summenzeile zeigt, warum das wichtig ist: Mit der Dublette wären es 20,60 statt 15,70, und das Protokoll erklärt die Differenz, bevor jemand danach fragt.
    hints:
      - "Trimme zuerst alle Werte der Zeile in ein neues Dictionary: `{spalte: wert.strip() for spalte, wert in zeile.items()}`."
      - Prüfe die Summenzeile vor jeder Umwandlung und überspringe sie mit `continue`.
      - "Merke dir bereits gesehene Zeilen als `tuple(sauber.values())` in einem Set."
    resources:
      - title: Python · str.strip
        url: https://docs.python.org/3/library/stdtypes.html#str.strip
      - title: Python · str.casefold
        url: https://docs.python.org/3/library/stdtypes.html#str.casefold

  - id: excel-import-praxis
    type: practice
    title: Doppelklick gegen „Aus Text/CSV“
    prompt: |
      Probiere den Unterschied in Excel selbst aus. Speichere diesen Text mit einem Editor als `bestellungen_test.csv` in UTF-8 ohne BOM (der Windows-Editor tut das beim Speichern als „UTF-8“):

      ```csv
      bestellung_id;bestelldatum;kunde;plz;stadt;artikel_nr;charge;sendungsnummer;versandkosten;warenwert
      1001;02.03.2026;Café Luna;50667;Köln;0012;12.3;00340434161094012345;0,00;1.250,50
      1002;05.03.2026;Jana Wolff;04109;Leipzig ;0107;12.3;00340434161094012352;4,90;41,40
      1003;09.03.2026;Kanzlei Berger & Partner;20095;Hamburg;0012;14.3;00340434161094012369;6,50;318,20
      1004;13.03.2026;Tim Albers;01067;dresden;0215;14.3;00340434161094012376;4,90;89,90
      Summe;;;;;;;;16,30;1.700,00
      ```

      1. Öffne die Datei per Doppelklick und notiere, was mit Umlauten, PLZ, Artikelnummern, Charge und Sendungsnummer passiert. Schließe sie **ohne zu speichern**.
      2. Importiere sie in eine leere Mappe über Daten › Aus Text/CSV mit dem passenden Dateiursprung und Trennzeichen, dann Daten transformieren.
      3. Entferne im Power Query-Editor die Summenzeile, setze die Typen (Kennungen als Text, Datum und Beträge mit Gebietsschema) und kürze die Stadt. Lade das Ergebnis.
      4. Ergänze in der CSV eine Bestellung `1005` und aktualisiere die Abfrage.
    lang: powerquery
    solution: |
      let
          Quelle = Csv.Document(File.Contents("C:\Daten\bestellungen_test.csv"), [Delimiter = ";", Encoding = 65001, QuoteStyle = QuoteStyle.Csv]),
          #"Höher gestufte Header" = Table.PromoteHeaders(Quelle, [PromoteAllScalars = true]),
          #"Gefilterte Zeilen" = Table.SelectRows(#"Höher gestufte Header", each [bestellung_id] <> "Summe"),
          #"Geänderter Typ mit Gebietsschema" = Table.TransformColumnTypes(
              #"Gefilterte Zeilen",
              {{"bestelldatum", type date}, {"versandkosten", type number}, {"warenwert", type number}},
              "de-DE"
          ),
          #"Geänderter Typ" = Table.TransformColumnTypes(
              #"Geänderter Typ mit Gebietsschema",
              {{"bestellung_id", Int64.Type}, {"kunde", type text}, {"plz", type text}, {"stadt", type text},
               {"artikel_nr", type text}, {"charge", type text}, {"sendungsnummer", type text}}
          ),
          #"Gekürzter Text" = Table.TransformColumns(#"Geänderter Typ", {{"stadt", Text.Trim, type text}})
      in
          #"Gekürzter Text"
    checklist:
      - "Beim Doppelklick hast du die Umwandlungen gesehen: „KÃ¶ln“ statt „Köln“, PLZ `1067` und Artikelnummer `12` ohne führende Null, Charge `12.3` als Datum, Sendungsnummer in wissenschaftlicher Notation – und die Datei nicht gespeichert."
      - "Im Importdialog stehen Dateiursprung „65001: Unicode (UTF-8)“ und Trennzeichen Semikolon; die Vorschau zeigt „Köln“ korrekt."
      - "`plz`, `artikel_nr`, `charge` und `sendungsnummer` sind Text und zeigen `01067`, `0012`, `12.3` und alle 20 Ziffern."
      - "`bestelldatum` ist ein Datum (13.03.2026 ist der 13. März), `versandkosten` und `warenwert` sind Zahlen; die Summe von `warenwert` ist 1700 und passt zur entfernten Summenzeile."
      - "„Leipzig “ hat nach dem Kürzen kein Leerzeichen mehr."
      - Nach dem Ergänzen der Bestellung 1005 und Daten › Alle aktualisieren erscheint sie ohne weitere Handgriffe in der Tabelle.
    explanation: |
      Die Datei ist UTF-8 ohne BOM, also rät Excel beim Doppelklick die Systemcodepage und erzeugt Mojibake; danach wandelt es alles um, was wie Zahl oder Datum aussieht. Die 20-stellige Sendungsnummer übersteigt die 15 signifikanten Stellen, die Excel speichert, und verliert Ziffern. Beim Import legst du Encoding, Trennzeichen und Typen selbst fest. Das Gebietsschema „de-DE“ beschreibt das Format der Datei – Dezimalkomma und `TT.MM.JJJJ` –, nicht die Einstellung deines Rechners. Die Summenzeile filterst du vor dem Typwechsel heraus und nutzt sie als Kontrollwert: 1.250,50 + 41,40 + 318,20 + 89,90 = 1.700,00. Dass die neue Bestellung nach dem Aktualisieren von selbst erscheint, ist der eigentliche Gewinn: Aus der monatlichen Handarbeit wird ein Klick.
    resources:
      - title: Microsoft Support · Importieren oder Exportieren von Textdateien
        url: https://support.microsoft.com/de-de/excel/get-started/import-or-export-text-txt-or-csv-files
      - title: Microsoft Support · Beibehalten führender Nullen und großer Zahlen
        url: https://support.microsoft.com/de-de/excel/keeping-leading-zeros-and-large-numbers
      - title: Microsoft Learn · Text.Trim
        url: https://learn.microsoft.com/de-de/powerquery-m/text-trim
