cards:
  # Fundament: Tabellenmodelle
  - id: frage-klaeren
    module: tabellenmodelle
    q: Die Geschäftsführung fragt dich „Wie läuft eigentlich der Shop?“. Was tust du, bevor du die erste Zahl ziehst?
    a: |
      Ich übersetze die Frage in eine Entscheidung und eine Kennzahl. Dafür frage ich zurück: Worum geht es – Werbebudget, Sortiment, Personal im Versand? Welcher Zeitraum, womit vergleichen wir (Vormonat, Vorjahr, Ziel)? Meint „läuft“ Nettoumsatz, Anzahl Bestellungen, Neukunden oder Marge? Am Ende steht ein Satz wie „Nettoumsatz des Shops je Monat 2026 gegen 2025, ohne Stornos und Retouren“.

      Erst danach folgt der übliche Ablauf: Frage → Daten → Bereinigen → Prüfen → Auswerten → Kommunizieren. Die Definition schreibe ich auf und schicke sie kurz zur Bestätigung.

      Das verhindert die teuerste Schleife im Analystenalltag: eine saubere Antwort auf eine Frage, die niemand gestellt hat.
    tags: [workflow, kommunikation]
    level: 1
  - id: granularitaet
    module: tabellenmodelle
    q: Was meinst du mit der Granularität einer Tabelle, und warum klärst du sie zuerst?
    a: |
      Die Granularität sagt, was genau eine Zeile ist. In `bestellungen` ist es eine Bestellung, in `positionen` ein Artikel innerhalb einer Bestellung, eindeutig über `(bestellung_id, position)`. Ich formuliere den Satz „Eine Zeile ist …“ und prüfe ihn, indem ich den Schlüssel auf Eindeutigkeit teste.

      Davon hängt ab, was ich summieren darf. Versandkosten gehören zur Bestellung; stehen sie in einer Positionsliste in jeder Zeile, zählt `SUMME` sie mehrfach. Tabellen unterschiedlicher Granularität verknüpfe ich deshalb erst, nachdem ich die feinere auf die gröbere verdichtet habe.

      Abgrenzung: Gröber machen geht immer, feiner nie. Wer nur Monatssummen speichert, kann später nicht mehr nach Kunde auswerten.
    tags: [datenmodell, granularität]
    level: 1
  - id: breit-vs-lang
    module: tabellenmodelle
    q: Eine Absatzplanung hat die Monate Januar bis Dezember als Spalten. Was ist daran für Auswertungen ungünstig, und was machst du damit?
    a: |
      Das ist das breite Format: Der Monat ist eine Variable, steckt aber in den Spaltenköpfen. Jeder neue Monat bedeutet eine neue Spalte, Formeln und Diagramme müssen nachgezogen werden, und „Summe März bis Mai je Kategorie“ wird Handarbeit.

      Für die Auswertung forme ich ins lange Format um: `produkt`, `monat`, `menge` – eine Beobachtung pro Zeile, eine Variable pro Spalte (Tidy Data). In Power Query mit „Andere Spalten entpivotieren“, in pandas mit `melt`, in SQL notfalls mit `UNION ALL` je Monat.

      Abgrenzung: Zum Lesen ist breit oft besser. Deshalb speichere ich lang und zeige breit – eine PivotTable baut die Kreuztabelle aus den langen Daten jederzeit neu.
    tags: [datenmodell, tidy-data]
    level: 1
  - id: sternschema
    module: tabellenmodelle
    q: Erkläre Fakten- und Dimensionstabellen am Beispiel des Vertriebs von Bohnenwerk.
    a: |
      Eine Faktentabelle speichert Ereignisse mit Messwerten auf einer festen Granularität – bei Bohnenwerk `positionen` mit `menge`, `einzelpreis` und `rabatt`, dazu die Fremdschlüssel. Dimensionstabellen beschreiben die Dinge, nach denen ich auswerte: `kunden` mit Region und Segment, `produkte` mit Kategorie, dazu ein Kalender. Im Sternschema liegen die Fakten in der Mitte, jede Dimension hängt über eine 1:n-Beziehung daran.

      Der Nutzen: Jede Frage „Umsatz nach X“ wird zu Join plus Gruppierung, und Stammdaten ändern sich an genau einer Stelle. Das Datenmodell in Excel und Power BI ist für diese Form gebaut.

      Abgrenzung: Ein flacher Export mit dem Kundennamen in jeder Zeile ist bequem. Zieht aber ein Kunde um, ändert man Tausende Zeilen, und Tippvarianten wie „Café Morgenrot“ und „Cafe Morgenrot“ zerlegen die Gruppierung.
    tags: [datenmodell, sternschema]
    level: 2
  - id: excel-liste-review
    module: tabellenmodelle
    q: Eine Kollegin schickt ihre Umsatzliste – Überschriften über zwei Zeilen, verbundene Zellen für die Region, nach jeder Region eine Zwischensumme, Reklamationen rot markiert. Was sagst du ihr?
    a: |
      Zuerst, dass die Liste zum Lesen gut funktioniert. Für Auswertungen hat sie vier Probleme, und zu jedem schlage ich eine Lösung vor:

      - **Zweizeilige Überschriften** erkennen weder PivotTable noch Power Query als Spaltennamen. Eine Kopfzeile mit eindeutigen Namen.
      - **Verbundene Zellen:** Die Region steht nur in der ersten Zeile, alle anderen sind leer. Beim Sortieren und Filtern geht sie verloren. Die Region gehört in jede Zeile.
      - **Zwischensummen in den Daten** werden mitgezählt; die Gesamtsumme ist dann doppelt so hoch. Summen rechnet die PivotTable.
      - **Farbe als Information** können Formeln, PivotTables und CSV-Exporte nicht lesen. Besser eine Spalte `reklamation` mit ja/nein.

      Mein Vorschlag: ein Datenblatt als intelligente Tabelle, ein getrenntes Berichtsblatt. Das stärkste Argument ist die Monatsroutine – mit der jetzigen Struktur muss jemand jeden Monat von Hand umbauen, bevor gerechnet werden kann.
    tags: [excel, datenmodell, review]
    level: 1

  # Fundament: CSV-Import
  - id: mojibake
    module: csv-import
    q: Nach dem Import steht in der Spalte `stadt` „KÃ¶ln“ statt „Köln“. Was ist passiert, und wie behebst du es?
    a: |
      Die Datei ist UTF-8-codiert, wurde aber als Windows-1252 gelesen. Das „ö“ besteht in UTF-8 aus zwei Bytes, `C3 B6`, und Windows-1252 zeigt jedes davon als eigenes Zeichen: „Ã“ und „¶“. Das nennt man Mojibake.

      Die Lösung liegt beim Import, nicht beim Suchen und Ersetzen: In Excel über „Daten › Aus Text/CSV“ den Dateiursprung „65001: Unicode (UTF-8)“ wählen, in Python `encoding="utf-8"` angeben, bei Dateien mit BOM `"utf-8-sig"`. Mit `file export.csv` oder einem Blick auf die Bytes prüfe ich vorher, was wirklich drinsteht.

      Den umgekehrten Fall – Windows-1252 als UTF-8 gelesen – erkennt man an `�` oder einem `UnicodeDecodeError`. Handkorrekturen im Ergebnis helfen nie lange: Nächsten Monat kommt derselbe Export wieder.
    tags: [csv, encoding]
    level: 1
  - id: csv-doppelklick
    module: csv-import
    q: Warum öffnest du einen CSV-Export nicht per Doppelklick in Excel?
    a: |
      Beim Doppelklick rät Excel die Struktur anhand der Ländereinstellungen und „korrigiert“ still: Postleitzahlen wie `01067` und Artikelnummern verlieren führende Nullen, Codes wie `1-2` oder `3.4` werden zum Datum, lange Nummern erscheinen in wissenschaftlicher Notation und verlieren ab der 16. Stelle Ziffern, weil Excel nur 15 signifikante Stellen speichert. Wer die Datei danach wieder als CSV speichert, hat die Rohdaten zerstört.

      Besser ist „Daten › Aus Text/CSV“: Dort lege ich Dateiursprung, Trennzeichen und je Spalte den Datentyp fest, IDs als Text. Das Ergebnis ist gleich eine Power-Query-Abfrage, also nächsten Monat wiederholbar.

      Abgrenzung: Das Problem ist nicht das CSV-Format, sondern die automatische Typerkennung. Dieselbe Falle gibt es in pandas, wenn man `dtype` für Schlüsselspalten weglässt.
    tags: [csv, excel]
    level: 1
  - id: fehlende-werte
    module: csv-import
    q: In der Spalte `rabatt` stehen leere Zellen, `0`, `n/a` und `-`. Wie gehst du damit um?
    a: |
      Zuerst kläre ich, was jede Schreibweise fachlich bedeutet – das ist keine technische Frage. `0` heißt „kein Rabatt“. Leer kann „nicht erfasst“ heißen, `-` im ERP vielleicht „nicht anwendbar“. Das frage ich beim Verantwortlichen für das Quellsystem nach, statt zu raten.

      Technisch markiere ich `n/a` und `-` beim Import als fehlend (`na_values` in pandas, „Wert ersetzen“ durch `null` in Power Query) und zähle: Wie viele Zeilen, wie viel Umsatz betrifft das? Erst wenn bestätigt ist, dass fehlend „kein Rabatt“ bedeutet, fülle ich mit 0 und schreibe die Regel ins Bereinigungsprotokoll.

      Abgrenzung: Ein pauschales `fillna(0)` verschiebt Durchschnitte und versteckt ein Erfassungsproblem, das gemeldet gehört.
    tags: [bereinigung, fehlende-werte]
    level: 2
  - id: rundung-cent
    module: csv-import
    q: Deine Python-Auswertung weicht um drei Cent von der Excel-Summe ab. Woran kann das liegen?
    a: |
      Meist an zwei Dingen. Erstens an der Rundungsregel: Excel `RUNDEN` rundet kaufmännisch (0,5 von null weg), Pythons `round()` und pandas runden zur geraden Ziffer – `round(2.5)` ergibt `2`. Zweitens am Rundungszeitpunkt: Rundet eine Seite je Position wie auf der Rechnung und die andere erst die Summe, entstehen Cent-Differenzen. Dazu kommt Gleitkomma: `0.1 + 0.2` ist nicht exakt `0.3`.

      Ich lege fest, wo gerundet wird, rechne Geldbeträge in Python mit `decimal.Decimal` und `ROUND_HALF_UP`, wenn es auf den Cent ankommt, und suche die Abweichung auf Zeilenebene statt die Summen anzustarren.

      Abgrenzung: Weicht die Summe um Euro statt Cent ab, ist es keine Rundung – dann fehlt eine Zeile oder ein Wert wurde falsch eingelesen, etwa „1.234,50“ als 1,2345.
    tags: [rundung, abgleich]
    level: 2

  # Fundament: Datenqualität
  - id: abweichung-controlling
    module: datenqualitaet
    q: Deine Umsatzzahl für März weicht von der des Controllings ab. Wie gehst du vor?
    a: |
      Nicht verteidigen, sondern abgleichen – beide Zahlen können stimmen, wenn sie Unterschiedliches messen.

      1. **Definition:** brutto oder netto, mit oder ohne Versandkosten, Stornos und Retouren, Bestell- oder Buchungsdatum, Zeitzone am Monatsende.
      2. **Datenstand:** Wann wurde welcher Export gezogen? Nachträgliche Stornos verändern den März noch im April.
      3. **Von grob nach fein:** Zeilenzahl und Summe je Kanal, dann je Tag, dann je Beleg, bis die Differenz an einzelnen Bestellungen hängt.
      4. **Festhalten:** Ursache dokumentieren und die Definition gemeinsam festlegen, damit es im April nicht wieder passiert.

      Bei Bohnenwerk erklärten zum Beispiel 14 nachträglich stornierte B2B-Bestellungen die komplette Differenz. Ich zeige damit, dass ich eine Abweichung als Prozessproblem behandle, nicht als Schuldfrage.
    tags: [abgleich, kommunikation]
    level: 2
  - id: qualitaetsdimensionen
    module: datenqualitaet
    q: Welche Dimensionen der Datenqualität prüfst du, und wie sieht je eine Regel aus?
    a: |
      - **Vollständigkeit:** `kunde_id` ist in jeder Bestellung gefüllt.
      - **Eindeutigkeit:** `bestellung_id` kommt genau einmal vor.
      - **Gültigkeit:** `status` stammt aus der erlaubten Liste, `rabatt` liegt zwischen 0 und 0,2.
      - **Konsistenz:** `geschlossen_am` liegt nicht vor `erstellt_am`; jede Position gehört zu einer existierenden Bestellung.
      - **Genauigkeit:** Die Werte stimmen mit der Wirklichkeit überein – geprüft per Stichprobe gegen Rechnungen oder per Abgleich mit dem Quellsystem.
      - **Aktualität:** Die jüngste Bestellung ist höchstens einen Tag alt.

      Die Konsistenzregel für Positionen ohne Bestellung ist ein Anti-Join:

      ```sql
      SELECT p.bestellung_id, p.position
      FROM positionen AS p
      LEFT JOIN bestellungen AS b ON b.bestellung_id = p.bestellung_id
      WHERE b.bestellung_id IS NULL;
      ```

      Zu jeder Regel gehören ein Schwellenwert und eine Reaktion: abbrechen, warnen oder in Quarantäne legen.
    tags: [datenqualität, sql]
    level: 1
  - id: quarantaene
    module: datenqualitaet
    q: Ungültige Zeilen beim Import löschen oder in Quarantäne legen?
    a: |
      Quarantäne. Wer still verwirft, lässt Umsatz verschwinden, ohne dass es jemand merkt – und die Summe stimmt nie mehr mit dem Quellsystem überein. In Quarantäne landet die Zeile mit Regel-ID und Grund in einer eigenen Datei oder Tabelle. Der Qualitätsbericht nennt Anzahl und Betrag, und jemand ist zuständig, sie zu klären.

      So bleibt die Rechnung „Eingang = sauber + Quarantäne“ jederzeit nachprüfbar. Ich prüfe sie bei jedem Lauf zusammen mit Zeilenzahl und Summe gegen die Kontrollwerte des Quellsystems, etwa die Summenzeile im ERP-Export.

      Abgrenzung: Fehlt eine Pflichtspalte oder ist es die falsche Datei, breche ich ab. Dann ist die Lieferung kaputt, nicht einzelne Zeilen.
    tags: [datenqualität, pipeline]
    level: 2

  # Fundament: Deskriptive Statistik
  - id: mittelwert-median
    module: deskriptive-statistik
    q: Der durchschnittliche Bestellwert liegt bei 84 €, der Median bei 38 €. Was sagt dir das, und welche Zahl berichtest du?
    a: |
      Die Verteilung ist rechtsschief: Wenige große B2B-Bestellungen ziehen den Mittelwert nach oben, die typische Bestellung liegt bei 38 €. Für die Frage „Was gibt ein typischer Kunde aus?“ nehme ich den Median. Für Planung brauche ich den Mittelwert, weil nur er sich hochrechnen lässt: Umsatz = Mittelwert × Anzahl Bestellungen.

      Am besten nenne ich beide und trenne nach Kanal – Shop und B2B sind zwei verschiedene Verteilungen, die man nicht in einer Zahl zusammenfassen sollte.

      Abgrenzung: Der Median ist robust gegen Ausreißer, aber nicht additiv. Aus den Medianen von Shop und B2B lässt sich der Gesamtmedian nicht berechnen.
    tags: [statistik, lagemaße]
    level: 1
  - id: ausreisser
    module: deskriptive-statistik
    q: Wie erkennst du Ausreißer in den Bestellwerten, und was machst du mit ihnen?
    a: |
      Ich sehe mir zuerst die Verteilung an, als Boxplot oder über Quantile. Werte unterhalb von Q1 − 1,5 · IQR oder oberhalb von Q3 + 1,5 · IQR markiere ich als Kandidaten. Dann prüfe ich jeden fachlich: Tippfehler (Menge 1000 statt 10), Testbestellung, doppelter Import – oder eine echte B2B-Großbestellung?

      Fehler korrigiere ich an der Quelle oder lege sie in Quarantäne. Echte Ausreißer bleiben drin, sie sind Umsatz. Wo eine Kennzahl robust sein soll, berichte ich Median und Quantile statt Mittelwert.

      Abgrenzung: Quartile hängen von der Methode ab. Excel `QUARTILE.INKL` und pandas `quantile()` interpolieren gleich, Pythons `statistics.quantiles` nutzt standardmäßig `method='exclusive'`. Bei kleinen Datenmengen weichen die Grenzen deshalb ab – ich nenne die Methode.
    tags: [statistik, ausreißer]
    level: 2
  - id: stabw-stichprobe
    module: deskriptive-statistik
    q: "`STABW.S` oder `STABW.N` – und warum liefern pandas und NumPy für dieselben Zahlen unterschiedliche Standardabweichungen?"
    a: |
      `STABW.S` teilt durch n − 1 und schätzt die Streuung einer größeren Grundgesamtheit aus einer Stichprobe. `STABW.N` teilt durch n und gilt, wenn die Daten die gesamte Grundgesamtheit sind. In Python entsprechen dem `statistics.stdev` und `statistics.pstdev`.

      pandas rechnet mit `Series.std()` standardmäßig mit `ddof=1`, also wie `STABW.S`. NumPy rechnet mit `np.std` standardmäßig mit `ddof=0`, also wie `STABW.N`. Bei 10 000 Werten ist der Unterschied vernachlässigbar, bei zwölf Monatswerten nicht.

      Im Bericht schreibe ich dazu, welche Variante ich verwende. Wer Excel und Python vergleicht und nicht darauf achtet, sucht lange nach einem Fehler, der keiner ist.
    tags: [statistik, streuung]
    level: 2
  - id: prozentpunkte
    module: deskriptive-statistik
    q: Die Retourenquote steigt von 4 % auf 5 %. Ist das ein Anstieg um 1 % oder um 25 %?
    a: |
      Es ist ein Anstieg um einen Prozentpunkt oder, relativ gesehen, um 25 %. „Um 1 %“ ist falsch. Für Quoten nenne ich die Differenz in Prozentpunkten und die relative Veränderung nur, wenn sie hilft – und immer mit der Basis.

      Die Basis entscheidet, ob die Veränderung überhaupt etwas bedeutet: Bei 100 Bestellungen sind 4 statt 5 Retouren Zufall, bei 10 000 Bestellungen sind 100 zusätzliche Retouren ein Signal.

      Abgrenzung: Dieselbe Verwechslung passiert mit Anteilen am Umsatz. Steigt der B2B-Anteil von 40 % auf 44 %, sind das 4 Prozentpunkte, relativ 10 %.
    tags: [statistik, kommunikation]
    level: 1
  - id: simpson-paradoxon
    module: deskriptive-statistik
    q: Paketdienst A stellt in beiden Regionen pünktlicher zu als B, insgesamt aber unpünktlicher. Wie kann das sein?
    a: |
      Das ist das Simpson-Paradoxon: Die Gruppen sind unterschiedlich zusammengesetzt. Ein Beispiel mit erfundenen Zahlen:

      | Region | A pünktlich | B pünktlich |
      | --- | --- | --- |
      | Nord (leicht) | 19 von 20 = 95 % | 90 von 100 = 90 % |
      | Süd (schwer) | 56 von 80 = 70 % | 6 von 10 = 60 % |
      | Gesamt | 75 von 100 = 75 % | 96 von 110 ≈ 87 % |

      A liefert vor allem in die schwierige Region, B vor allem in die leichte. Die Gesamtquote vergleicht deshalb die Mischung, nicht die Leistung.

      Daraus folgt für Berichte: Bevor ich eine Gesamtquote vergleiche, frage ich nach der Zusammensetzung und weise die Gruppen getrennt aus. Das gilt genauso für Umsatz je Kunde über Segmente oder Marge über Kanäle.
    tags: [statistik, fallen]
    level: 3
  - id: korrelation-kausalitaet
    module: deskriptive-statistik
    q: Kunden mit Newsletter-Abo bestellen doppelt so oft. Sollten wir alle Kunden zum Abo drängen, damit sie mehr bestellen?
    a: |
      Die Daten zeigen einen Zusammenhang, keine Ursache. Naheliegender ist die umgekehrte Richtung: Wer ohnehin gern bei Bohnenwerk bestellt, abonniert eher den Newsletter. Dazu kommen Störgrößen wie Segment oder Kundendauer – langjährige Kunden bestellen öfter und hatten mehr Gelegenheit zum Abo.

      Wenn die Frage wichtig ist, schlage ich ein Experiment vor: einer zufällig gewählten Hälfte der Neukunden den Newsletter anbieten, der anderen nicht, und die Bestellhäufigkeit vergleichen. Ohne Experiment vergleiche ich mindestens ähnliche Gruppen, etwa Kunden desselben Segments und derselben Kundendauer.

      Im Bericht formuliere ich entsprechend: „Abonnenten bestellen häufiger“ statt „Der Newsletter steigert die Bestellungen“.
    tags: [statistik, kommunikation]
    level: 2

  # Excel professionell: Formeln
  - id: sverweis-review
    module: excel-formeln
    q: |
      Code-Review: Was fällt dir an dieser Formel auf?

      ```excel
      =SVERWEIS(A2;Artikel!A:D;3)
      ```
    a: |
      Der vierte Parameter fehlt. Dann gilt `WAHR`, also ungefähre Übereinstimmung: `SVERWEIS` setzt eine sortierte erste Spalte voraus und liefert bei einer fehlenden Artikelnummer still den Preis des nächstkleineren Artikels – falsch und ohne Fehlermeldung. Außerdem bricht der Spaltenindex `3`, sobald jemand eine Spalte einfügt.

      Mein Vorschlag mit `XVERWEIS` (englisch `XLOOKUP`), der standardmäßig exakt sucht:

      ```excel
      =XVERWEIS(A2;Artikel[artikel_nr];Artikel[preis];"fehlt")
      ```

      Die Rückgabespalte ist per Name adressiert, fehlende Artikel sind sichtbar und lassen sich zählen. In Excel 2019 und älter geht `=INDEX(Artikel[preis];VERGLEICH(A2;Artikel[artikel_nr];0))` oder zumindest `SVERWEIS(…;FALSCH)`.

      Abgrenzung: Die Näherungssuche ist richtig für Staffeln wie Rabattstufen – dann bewusst und mit sortierter Tabelle.
    tags: [excel, formeln, review]
    level: 1
  - id: wennfehler-review
    module: excel-formeln
    q: |
      Code-Review: Die Umsatzspalte nutzt diese Formel. Was hältst du davon?

      ```excel
      =WENNFEHLER(XVERWEIS(A2;Artikel[artikel_nr];Artikel[preis])*B2;0)
      ```
    a: |
      `WENNFEHLER` (englisch `IFERROR`) verschluckt jeden Fehler: eine unbekannte Artikelnummer, einen Text in der Mengenspalte, einen kaputten Bezug. Alles wird still zu 0 € Umsatz und fließt in die Summe ein. 0 ist ein gültiger Wert und deshalb der gefährlichste Ersatz, den man wählen kann.

      Besser ist, den Fehler sichtbar zu lassen:

      ```excel
      =XVERWEIS(A2;Artikel[artikel_nr];Artikel[preis])*B2
      ```

      Ein unbekannter Artikel ergibt dann `#NV` und fällt auf, auch in der Summe. Daneben steht eine Kontrollzelle, die solche Zeilen zählt, etwa `=SUMMENPRODUKT(--ISTNV(Umsatz[netto]))`, und die Liste der fehlenden Artikelnummern geht an den Stammdatenpfleger.

      Abgrenzung: Braucht der Bericht wirklich einen Ersatzwert, dann gezielt – `WENNNV` fängt nur `#NV` ab, und ein Text wie „fehlt“ im Argument `wenn_nicht_gefunden` von `XVERWEIS` ist nicht mit einem echten Preis zu verwechseln.
    tags: [excel, formeln, review]
    level: 2
  - id: bezuege-absolut
    module: excel-formeln
    q: Du kopierst `=B2*C1` nach unten, C1 enthält den Rabattsatz. Ab Zeile 3 stimmt nichts mehr. Warum, und wie schreibst du die Formel?
    a: |
      Bezüge sind standardmäßig relativ: Excel merkt sich „eine Spalte rechts, eine Zeile höher“. In Zeile 3 wird daraus `=B3*C2`, der Rabattsatz ist weg. Der Bezug auf den festen Satz muss absolut sein: `=B2*$C$1`. Mit F4 wechselt man zwischen `C1`, `$C$1`, `C$1` und `$C1`.

      Noch besser ist ein Name: Ich benenne C1 als `Rabattsatz` und schreibe `=B2*Rabattsatz`. Das liest sich im Review und bricht nicht, wenn jemand Zeilen einfügt.

      Abgrenzung: Gemischte Bezüge wie `$A2` und `B$1` brauche ich für Kreuztabellen, bei denen eine Formel nach rechts und nach unten kopiert wird.
    tags: [excel, bezüge]
    level: 1
  - id: dynamische-arrays
    module: excel-formeln
    q: Was sind dynamische Arrays in Excel, und was bedeutet `#ÜBERLAUF!`?
    a: |
      Eine Formel wie `=EINDEUTIG(Bestellungen[kanal])` oder `=FILTER(Bestellungen;Bestellungen[status]="storniert")` liefert mehrere Werte und „läuft über“ in die Nachbarzellen. Den ganzen Überlaufbereich spreche ich mit `F2#` an, etwa in `=SORTIEREN(F2#)`. Steht im Zielbereich schon etwas, zeigt die Formel `#ÜBERLAUF!` (englisch `#SPILL!`).

      Der Vorteil: eine Formel statt Hunderter kopierter, und das Ergebnis wächst mit den Daten. Für Berichte, die jeden Monat länger werden, ist das robuster als heruntergezogene Formeln.

      Grenzen: Dynamische Arrays gibt es erst ab Excel 2021 bzw. Microsoft 365, und in einer intelligenten Tabelle kann keine überlaufende Formel stehen. Wer Dateien mit Kollegen auf älteren Versionen teilt, klärt das vorher.
    tags: [excel, dynamische-arrays]
    level: 2

  # Excel professionell: Tabellen und PivotTables
  - id: excel-case
    module: tabellen-pivot
    q: "Excel-Case im Interview: 20 000 Bestellzeilen, gesucht sind Nettoumsatz je Region und Monat und die drei stärksten Produkte. Wie gehst du vor?"
    a: |
      Ich sage laut, was ich tue und annehme.

      1. **Daten prüfen:** Was ist eine Zeile? Sind Datum und Beträge echte Zahlen (rechtsbündig, `ANZAHL` gegen `ANZAHL2`)? Gibt es Stornos, Leerzeilen oder Summenzeilen?
      2. **Als Tabelle formatieren** (Start › Als Tabelle formatieren), damit Formeln und PivotTable mitwachsen.
      3. **Berechnete Spalte** für den Nettoumsatz: `=[@menge]*[@einzelpreis]*(1-[@rabatt])`.
      4. **PivotTable** mit Region in den Zeilen, Bestelldatum nach Monaten gruppiert in den Spalten, Wert „Summe von netto“ – kontrollieren, dass nicht „Anzahl“ dasteht. Status als Filter auf „bezahlt“.
      5. **Top 3:** zweite PivotTable mit Produkt in den Zeilen und Wertefilter „Top 10“ auf 3 gesetzt.
      6. **Plausibilisieren:** Gesamtergebnis gegen `=SUMMEWENNS(Tabelle1[netto];Tabelle1[status];"bezahlt")`.

      Zum Schluss nenne ich, was ich mit mehr Zeit täte: Import per Power Query, damit es nächsten Monat „Alle aktualisieren“ ist.
    tags: [excel, pivot, interview]
    level: 2
  - id: pivot-anzahl
    module: tabellen-pivot
    q: Deine PivotTable zeigt im Wertebereich für den Umsatz lauter kleine ganze Zahlen. Was ist passiert?
    a: |
      Die PivotTable zählt, statt zu summieren. Excel nimmt für Wertfelder standardmäßig die Summe, aber „Anzahl“, sobald es die Spalte als Text interpretiert. Typische Ursache ist ein Import, bei dem Beträge wie „1.234,50“ als Text angekommen sind.

      Ich behebe die Ursache, nicht das Symptom: Beträge beim Import als Zahl einlesen (Power Query mit Gebietsschema oder `ZAHLENWERT`), prüfen mit `=ANZAHL(Tabelle1[betrag])` gegen `=ANZAHL2(Tabelle1[betrag])`, danach PivotTable aktualisieren und in den Wertfeldeinstellungen auf „Summe“ stellen.

      Abgrenzung: Stellt man nur auf „Summe“ um, ohne die Textwerte zu korrigieren, fehlen diese Zeilen still in der Summe.
    tags: [excel, pivot, datentypen]
    level: 1
  - id: pivot-in-sql
    module: tabellen-pivot
    q: Wie baust du eine PivotTable „Nettoumsatz je Region (Zeilen) und Kanal (Spalten)“ in SQL nach?
    a: |
      Zeilenfelder werden zu `GROUP BY`, Spaltenfelder zu bedingter Aggregation mit einer Spalte je Ausprägung, das Wertfeld zur Aggregatfunktion:

      ```sql
      SELECT k.region,
             ROUND(SUM(CASE WHEN b.kanal = 'Shop'
                       THEN p.menge * p.einzelpreis * (1 - p.rabatt) ELSE 0 END), 2) AS shop,
             ROUND(SUM(CASE WHEN b.kanal = 'B2B'
                       THEN p.menge * p.einzelpreis * (1 - p.rabatt) ELSE 0 END), 2) AS b2b
      FROM bestellungen AS b
      JOIN kunden AS k ON k.kunde_id = b.kunde_id
      JOIN positionen AS p ON p.bestellung_id = b.bestellung_id
      WHERE b.status = 'bezahlt'
      GROUP BY k.region
      ORDER BY k.region;
      ```

      Der Unterschied: SQL braucht die Spalten vorab, die PivotTable erzeugt sie aus den Daten. Kommt ein dritter Kanal dazu, fehlt er in der Abfrage still. Deshalb liefere ich aus SQL oft das lange Ergebnis (`GROUP BY region, kanal`) und pivotiere erst in Excel oder pandas.
    tags: [pivot, sql]
    level: 2

  # Excel professionell: Power Query
  - id: power-query-nutzen
    module: power-query
    q: Was ist Power Query, und welches Problem löst es im Monatsbericht?
    a: |
      Power Query ist das ETL-Werkzeug in Excel und Power BI: Daten holen, umformen, laden. Jeder Klick im Editor wird als Schritt in der Sprache M gespeichert. Die Liste der angewendeten Schritte ist damit ein Rezept, das sich auf neue Daten wiederholen lässt.

      Bei Bohnenwerk hieß der Monatsbericht vorher: drei CSV-Dateien öffnen, kopieren, Dezimalkomma reparieren, `SVERWEIS` für die Kategorie, PivotTable neu aufziehen – etwa drei Stunden und jedes Mal andere Fehler. Mit Power Query liegt die neue Datei im Ordner, dann „Daten › Alle aktualisieren“, fertig in Minuten, und jeder Schritt ist nachvollziehbar.

      Abgrenzung: Power Query ist keine Datenbank und kein Ersatz für Tests. Für sehr große Datenmengen oder komplexe Prüflogik mit Tests sind SQL oder Python die bessere Wahl.
    tags: [power-query, prozess]
    level: 1
  - id: gebietsschema
    module: power-query
    q: Deine Power-Query-Abfrage läuft bei dir, beim Kollegen wird aus „1.234,50“ plötzlich 1,2345 oder ein Fehler. Warum?
    a: |
      Die Typumwandlung nutzt ohne Angabe die Ländereinstellung des Rechners. Auf einem deutschen System ist `,` das Dezimalzeichen, auf einem englischen der Punkt – derselbe Text wird verschieden gelesen. Datumsangaben wie `03.04.2026` sind je nach Einstellung der 3. April oder der 4. März.

      Die Lösung ist, das Gebietsschema der Datei ausdrücklich anzugeben: im Editor per Rechtsklick › Typ ändern › Mit Gebietsschema …, im M-Code als drittes Argument:

      ```powerquery
      #"Geänderter Typ mit Gebietsschema" = Table.TransformColumnTypes(
          #"Höher gestufte Header",
          {{"Betrag", type number}, {"Datum", type date}},
          "de-DE")
      ```

      Damit beschreibt die Abfrage die Datei, nicht den Rechner. Kommt ein zweiter Export im englischen Format dazu, bekommt er seinen eigenen Schritt mit `"en-US"`.
    tags: [power-query, gebietsschema]
    level: 2
  - id: zusammenfuehren-anfuegen
    module: power-query
    q: Was ist in Power Query der Unterschied zwischen „Abfragen zusammenführen“ und „Abfragen anfügen“?
    a: |
      Anfügen stapelt Tabellen untereinander – gleiche Spalten, mehr Zeilen. Das brauche ich für Monatsdateien oder für Shop- und B2B-Bestellungen. In M ist es `Table.Combine`, in SQL `UNION ALL`.

      Zusammenführen verknüpft Tabellen nebeneinander über einen Schlüssel – mehr Spalten, etwa die Kategorie aus dem Artikelstamm zu jeder Position. In M ist es `Table.NestedJoin` mit anschließendem Erweitern, in SQL ein Join. Die Join-Art wähle ich bewusst: „Linker äußerer“ behält alle Positionen, auch ohne Treffer.

      Die typische Falle beim Zusammenführen: Steht eine Artikelnummer im Stamm doppelt, verdoppeln sich die passenden Positionen und der Umsatz. Deshalb prüfe ich die Zeilenzahl vor und nach dem Schritt.
    tags: [power-query, joins]
    level: 1
  - id: m-code-review
    module: power-query
    q: |
      Code-Review: Diese Abfrage liefert im April null Zeilen. Was fällt dir auf?

      ```powerquery
      let
          Quelle = Csv.Document(File.Contents("C:\Users\mia\Downloads\export_maerz.csv"), [Delimiter = ";", Encoding = 1252]),
          #"Höher gestufte Header" = Table.PromoteHeaders(Quelle, [PromoteAllScalars = true]),
          #"Geänderter Typ" = Table.TransformColumnTypes(#"Höher gestufte Header", {{"Betrag", type number}}),
          #"Gefilterte Zeilen" = Table.SelectRows(#"Geänderter Typ", each [Status] = "Bezahlt")
      in
          #"Gefilterte Zeilen"
      ```
    a: |
      Drei Dinge:

      - **Groß- und Kleinschreibung:** M vergleicht Text exakt. Steht in den Daten `bezahlt`, trifft `"Bezahlt"` keine Zeile. Entweder den Wert aus den Daten übernehmen oder vorher vereinheitlichen, etwa mit `Text.Lower`.
      - **Fester Pfad auf eine Monatsdatei im Download-Ordner eines Menschen:** Die Abfrage liest im April weiter die Märzdatei oder bricht auf einem anderen Rechner. Besser ist ein Ordner-Import aller Monatsdateien oder ein Parameter für den Pfad.
      - **Typwechsel ohne Gebietsschema:** `Betrag` hängt von der Ländereinstellung des Rechners ab. Das dritte Argument `"de-DE"` macht die Abfrage reproduzierbar.

      Positiv: Die Codierung 1252 ist für einen Windows-Export ausdrücklich angegeben, und die Schrittnamen sind die Standardnamen des Editors, die jeder wiedererkennt.
    tags: [power-query, review]
    level: 2

  # SQL: Abfragen
  - id: logische-reihenfolge
    module: sql-abfragen
    q: In welcher Reihenfolge wertet SQL eine Abfrage aus, und warum ist ein Alias aus `SELECT` in `WHERE` problematisch?
    a: |
      Geschrieben wird `SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY … LIMIT`. Ausgewertet wird logisch in dieser Reihenfolge: `FROM` und Joins, `WHERE`, `GROUP BY`, `HAVING`, `SELECT` samt Fensterfunktionen, `DISTINCT`, `ORDER BY`, `LIMIT`.

      Ein Alias wie `AS netto` entsteht also erst in `SELECT`. `ORDER BY netto` funktioniert überall, `WHERE netto > 100` im Standard nicht, weil `WHERE` vorher läuft. SQLite ist großzügig und akzeptiert es, PostgreSQL lehnt es ab. Ich wiederhole deshalb den Ausdruck oder berechne ihn in einer CTE.

      Aus der Reihenfolge folgt auch, warum man in `WHERE` nicht nach `SUM(…)` filtern kann und warum Fensterfunktionen nicht in `WHERE` stehen dürfen.
    tags: [sql, grundlagen]
    level: 1
  - id: where-having
    module: sql-abfragen
    q: Was ist der Unterschied zwischen `WHERE` und `HAVING`?
    a: |
      `WHERE` filtert Zeilen vor der Gruppierung, `HAVING` filtert Gruppen nach der Aggregation. Beispiel: B2B-Kunden mit mehr als 1000 € Nettoumsatz im März.

      ```sql
      SELECT b.kunde_id, SUM(p.menge * p.einzelpreis * (1 - p.rabatt)) AS netto
      FROM bestellungen AS b
      JOIN positionen AS p ON p.bestellung_id = b.bestellung_id
      WHERE b.kanal = 'B2B'
        AND b.bestelldatum BETWEEN '2026-03-01' AND '2026-03-31'
      GROUP BY b.kunde_id
      HAVING SUM(p.menge * p.einzelpreis * (1 - p.rabatt)) > 1000;
      ```

      Kanal und Zeitraum sind Eigenschaften einzelner Zeilen, gehören also in `WHERE`. Die Umsatzschwelle betrifft die Summe je Kunde und geht erst in `HAVING`.

      Faustregel: Alles, was ohne Aggregat entscheidbar ist, in `WHERE` – das ist klarer und lässt die Datenbank früher filtern.
    tags: [sql, gruppierung]
    level: 1
  - id: count-varianten
    module: sql-abfragen
    q: Was zählen `COUNT(*)`, `COUNT(geschlossen_am)` und `COUNT(DISTINCT kunde_id)` in der Tabelle `tickets`?
    a: |
      `COUNT(*)` zählt alle Zeilen, also alle Tickets. `COUNT(geschlossen_am)` zählt nur Zeilen, in denen die Spalte nicht `NULL` ist – die geschlossenen Tickets. `COUNT(DISTINCT kunde_id)` zählt, wie viele verschiedene Kunden überhaupt ein Ticket haben; `NULL` zählt dabei nicht mit.

      Daraus ergibt sich zum Beispiel die Zahl offener Tickets als `COUNT(*) - COUNT(geschlossen_am)`.

      Die Falle dahinter: Alle Aggregatfunktionen außer `COUNT(*)` ignorieren `NULL`. Eine durchschnittliche Bearbeitungszeit über `AVG(…)` enthält nur die geschlossenen Tickets – gerade die lange offenen fehlen, und die Zahl sieht besser aus, als sie ist. Ich berichte deshalb die offenen Tickets und ihr Alter daneben.
    tags: [sql, null]
    level: 1
  - id: null-review
    module: sql-abfragen
    q: |
      Code-Review: Diese Abfrage soll alle nicht stornierten Bestellungen zählen, liefert aber zu wenig. Warum?

      ```sql
      SELECT COUNT(*) FROM bestellungen WHERE status <> 'storniert';
      ```
    a: |
      SQL rechnet mit dreiwertiger Logik. Für eine Bestellung ohne Status ergibt `NULL <> 'storniert'` weder wahr noch falsch, sondern `NULL`, und `WHERE` behält nur Zeilen, deren Bedingung wahr ist. Bestellungen mit fehlendem Status fallen also still heraus.

      Je nach fachlicher Absicht korrigiere ich zu:

      ```sql
      WHERE status IS NOT 'storniert'               -- SQLite
      WHERE status IS DISTINCT FROM 'storniert'     -- Standard, PostgreSQL, SQLite ab 3.39
      WHERE status <> 'storniert' OR status IS NULL -- überall
      ```

      Wichtiger ist aber die Frage, warum es Bestellungen ohne Status gibt – das ist ein Befund für den Qualitätsbericht. Dieselbe Logik macht `NOT IN (…)` gefährlich: Liefert die Unterabfrage ein `NULL`, kommt gar keine Zeile zurück.
    tags: [sql, null, review]
    level: 2
  - id: integer-division
    module: sql-abfragen
    q: Deine Stornoquote kommt in SQL als 0 heraus, obwohl es Stornos gibt. Warum?
    a: |
      Integer-Division. In SQLite und PostgreSQL ergibt eine Division zweier ganzer Zahlen wieder eine ganze Zahl: `7 / 50` ist `0`. `SUM(status = 'storniert')` und `COUNT(*)` sind beide ganzzahlig.

      Die Lösung ist, vorher eine Kommazahl ins Spiel zu bringen:

      ```sql
      SELECT ROUND(100.0 * SUM(status = 'storniert') / COUNT(*), 1) AS stornoquote_prozent
      FROM bestellungen;
      ```

      Alternativ `CAST(… AS REAL)`. Die Reihenfolge zählt: `100.0 * a / b` rechnet von links, das Ergebnis ist eine Kommazahl.

      Abgrenzung: Dass `status = 'storniert'` als 0 oder 1 summierbar ist, gilt in SQLite und MySQL. In PostgreSQL ist es ein Boolean – dort schreibe ich `COUNT(*) FILTER (WHERE status = 'storniert')` oder `SUM(CASE WHEN … THEN 1 ELSE 0 END)`.
    tags: [sql, datentypen]
    level: 2

  # SQL: Joins
  - id: inner-vs-left
    module: sql-joins
    q: Wann nimmst du einen `INNER JOIN`, wann einen `LEFT JOIN`?
    a: |
      `INNER JOIN` behält nur Zeilen mit Partner auf beiden Seiten. `LEFT JOIN` behält alle Zeilen der linken Tabelle und füllt fehlende Partner mit `NULL`.

      Die Frage entscheidet: „Umsatz je Kunde“ für eine Kundenliste mit allen Kunden, auch denen ohne Bestellung, braucht `LEFT JOIN` von `kunden` aus und `COALESCE(SUM(…), 0)`. „Umsatz je Produktkategorie“ aus Positionen kann `INNER JOIN` auf `produkte` nehmen – aber nur, wenn jede Position ein bekanntes Produkt hat. Genau das prüfe ich vorher, sonst verschwindet Umsatz still.

      Mein Kontrollgriff nach jedem Join: Zeilenzahl vorher und nachher vergleichen. Weniger Zeilen heißt fehlende Partner, mehr Zeilen heißt doppelte Schlüssel auf der anderen Seite.
    tags: [sql, joins]
    level: 1
  - id: fan-out-review
    module: sql-joins
    q: |
      Code-Review: Die Versandkosten je Kanal sind viel zu hoch. Warum?

      ```sql
      SELECT b.kanal,
             SUM(b.versandkosten) AS versand,
             SUM(p.menge * p.einzelpreis * (1 - p.rabatt)) AS umsatz
      FROM bestellungen AS b
      JOIN positionen AS p ON p.bestellung_id = b.bestellung_id
      GROUP BY b.kanal;
      ```
    a: |
      Fan-out: Die Versandkosten stehen einmal je Bestellung, nach dem Join mit `positionen` aber in jeder Positionszeile. Eine Bestellung mit drei Positionen zählt ihre Versandkosten dreimal. Der Umsatz stimmt, weil er auf Positionsebene entsteht.

      Die Lösung ist, die Positionen erst auf die Granularität der Bestellung zu verdichten und dann 1:1 zu verknüpfen:

      ```sql
      WITH je_bestellung AS (
        SELECT bestellung_id, SUM(menge * einzelpreis * (1 - rabatt)) AS umsatz
        FROM positionen
        GROUP BY bestellung_id
      )
      SELECT b.kanal, SUM(b.versandkosten) AS versand, SUM(j.umsatz) AS umsatz
      FROM bestellungen AS b
      JOIN je_bestellung AS j ON j.bestellung_id = b.bestellung_id
      GROUP BY b.kanal;
      ```

      Erkennen lässt sich Fan-out schnell: `COUNT(*)` und `COUNT(DISTINCT b.bestellung_id)` nach dem Join vergleichen.
    tags: [sql, joins, review]
    level: 2
  - id: left-join-where
    module: sql-joins
    q: |
      Code-Review: Kunden ohne bezahlte Bestellung sollen mit 0 erscheinen, fehlen aber. Warum?

      ```sql
      SELECT k.name, COUNT(b.bestellung_id) AS bestellungen
      FROM kunden AS k
      LEFT JOIN bestellungen AS b ON b.kunde_id = k.kunde_id
      WHERE b.status = 'bezahlt'
      GROUP BY k.name;
      ```
    a: |
      Die Bedingung auf die rechte Tabelle steht in `WHERE`. Für Kunden ohne Bestellung ist `b.status` `NULL`, die Bedingung also nicht wahr, und die Zeile fällt heraus. Der `LEFT JOIN` wirkt damit wie ein `INNER JOIN`.

      Die Bedingung gehört in die Join-Bedingung:

      ```sql
      LEFT JOIN bestellungen AS b
        ON b.kunde_id = k.kunde_id AND b.status = 'bezahlt'
      ```

      Dann bleiben alle Kunden erhalten, und `COUNT(b.bestellung_id)` zählt für sie 0.

      Zweiter Befund: `GROUP BY k.name` fasst zwei verschiedene Kunden mit gleichem Namen zusammen. Ich gruppiere nach dem Schlüssel, `GROUP BY k.kunde_id, k.name`.
    tags: [sql, joins, review]
    level: 2
  - id: semi-join-exists
    module: sql-joins
    q: Du suchst alle Kunden, die mindestens einmal Zubehör gekauft haben. Warum nimmst du `EXISTS` statt `JOIN` mit `DISTINCT`?
    a: |
      Ein Join mit Bestellungen und Positionen vervielfacht jeden Kunden um seine Treffer, und `DISTINCT` muss das hinterher wieder einsammeln. `EXISTS` stellt genau die gestellte Frage – gibt es mindestens eine passende Zeile? – und liefert jeden Kunden höchstens einmal:

      ```sql
      SELECT k.kunde_id, k.name
      FROM kunden AS k
      WHERE EXISTS (
        SELECT 1
        FROM bestellungen AS b
        JOIN positionen AS p ON p.bestellung_id = b.bestellung_id
        JOIN produkte AS pr ON pr.produkt_id = p.produkt_id
        WHERE b.kunde_id = k.kunde_id AND pr.kategorie = 'Zubehör'
      );
      ```

      Das nennt man Semi-Join. Das Gegenstück `NOT EXISTS` ist der Anti-Join, etwa für Kunden ohne jede Bestellung – robuster als `NOT IN`, weil `NULL` in der Unterabfrage ihn nicht aushebelt.

      Abgrenzung: Brauche ich zusätzlich Spalten aus den Bestellungen, etwa den Zubehörumsatz, ist ein Join mit Gruppierung richtig.
    tags: [sql, joins]
    level: 2
  - id: cte-lesbarkeit
    module: sql-joins
    q: Warum schreibst du längere Analysen mit CTEs statt mit verschachtelten Unterabfragen?
    a: |
      Eine CTE (`WITH name AS (…)`) gibt jedem Zwischenschritt einen Namen, und die Abfrage liest sich von oben nach unten wie eine Pipeline: bezahlte Bestellungen → Umsatz je Bestellung → je Monat → Vormonatsvergleich. Verschachtelte Unterabfragen liest man von innen nach außen, und Namen fehlen.

      Beim Entwickeln und im Review hilft das doppelt: Ich kann jeden Schritt einzeln prüfen, indem ich die letzte Zeile durch `SELECT * FROM schritt` ersetze, und ein Reviewer sieht an den Namen, was gemeint ist. Eine CTE kann ich außerdem mehrfach referenzieren, statt dieselbe Unterabfrage zweimal zu schreiben.

      Abgrenzung: CTEs sind ein Lesbarkeitswerkzeug, keine Optimierung. PostgreSQL bettet seit Version 12 nicht rekursive CTEs, die nur einmal verwendet werden, standardmäßig in die Hauptabfrage ein; ob etwas schneller wird, zeigt der Ausführungsplan.
    tags: [sql, cte]
    level: 2

  # SQL: Fensterfunktionen
  - id: rank-varianten
    module: sql-fensterfunktionen
    q: Was unterscheidet `ROW_NUMBER`, `RANK` und `DENSE_RANK` bei Gleichständen?
    a: |
      Bei den Umsätzen 500, 500 und 300 vergibt `ROW_NUMBER` 1, 2, 3 – jede Zeile eine eigene Nummer, bei Gleichstand willkürlich. `RANK` vergibt 1, 1, 3 – gleiche Werte teilen den Rang, danach entsteht eine Lücke. `DENSE_RANK` vergibt 1, 1, 2 – ohne Lücke.

      Die Wahl ist eine fachliche Frage: „Genau drei Produkte je Kategorie“ ist `ROW_NUMBER` mit einem eindeutigen Tiebreaker in `ORDER BY`, etwa `ORDER BY umsatz DESC, produkt_id`, sonst ist das Ergebnis nicht reproduzierbar. „Alle Produkte, die auf den ersten drei Plätzen liegen“ ist `RANK`, dann können es auch vier Zeilen sein.

      Im Interview frage ich deshalb zuerst: Wie sollen Gleichstände behandelt werden?
    tags: [sql, fensterfunktionen]
    level: 2
  - id: top-n-je-gruppe
    module: sql-fensterfunktionen
    q: "SQL-Live-Coding: Gib je Kategorie die drei umsatzstärksten Produkte aus."
    a: |
      Erst verdichten, dann innerhalb jeder Kategorie ranken, dann filtern. Filtern muss außen passieren, weil Fensterfunktionen erst nach `WHERE` berechnet werden:

      ```sql
      WITH umsatz_produkt AS (
        SELECT pr.kategorie, pr.produkt_id, pr.name,
               SUM(p.menge * p.einzelpreis * (1 - p.rabatt)) AS umsatz
        FROM positionen AS p
        JOIN bestellungen AS b ON b.bestellung_id = p.bestellung_id
        JOIN produkte AS pr ON pr.produkt_id = p.produkt_id
        WHERE b.status = 'bezahlt'
        GROUP BY pr.kategorie, pr.produkt_id, pr.name
      ),
      gerankt AS (
        SELECT *, ROW_NUMBER() OVER (
                    PARTITION BY kategorie ORDER BY umsatz DESC, produkt_id) AS rang
        FROM umsatz_produkt
      )
      SELECT kategorie, rang, name, ROUND(umsatz, 2) AS umsatz
      FROM gerankt
      WHERE rang <= 3
      ORDER BY kategorie, rang;
      ```

      Dazu sage ich meine Annahmen: nur bezahlte Bestellungen, Gleichstand über `produkt_id` aufgelöst. Einige Datenbanken wie Snowflake oder DuckDB kennen `QUALIFY` für den Filter; SQLite und PostgreSQL nicht.
    tags: [sql, fensterfunktionen, live-coding]
    level: 2
  - id: vormonat-lag
    module: sql-fensterfunktionen
    q: "SQL-Live-Coding: Monatsumsatz mit Vormonat und prozentualer Veränderung."
    a: |
      ```sql
      WITH monat AS (
        SELECT strftime('%Y-%m', b.bestelldatum) AS monat,
               SUM(p.menge * p.einzelpreis * (1 - p.rabatt)) AS umsatz
        FROM bestellungen AS b
        JOIN positionen AS p ON p.bestellung_id = b.bestellung_id
        WHERE b.status = 'bezahlt'
        GROUP BY monat
      )
      SELECT monat,
             ROUND(umsatz, 2) AS umsatz,
             ROUND(LAG(umsatz) OVER w, 2) AS vormonat,
             ROUND(100.0 * (umsatz - LAG(umsatz) OVER w) / LAG(umsatz) OVER w, 1) AS veraenderung_prozent
      FROM monat
      WINDOW w AS (ORDER BY monat)
      ORDER BY monat;
      ```

      Zwei Dinge sage ich dazu. Der erste Monat hat keinen Vormonat, dort steht `NULL` – das ist richtig, nicht 0. Und `LAG` nimmt die vorige *Zeile*, nicht den vorigen Kalendermonat: Fehlt ein Monat ganz, vergleicht die Abfrage mit dem vorletzten. Dagegen hilft ein Kalender per rekursiver CTE, an den ich die Monate per `LEFT JOIN` hänge. In PostgreSQL hieße die Gruppierung `date_trunc('month', bestelldatum)`.
    tags: [sql, fensterfunktionen, live-coding]
    level: 2
  - id: laufende-summe-frame
    module: sql-fensterfunktionen
    q: Deine laufende Summe springt an Tagen mit mehreren Bestellungen um zwei Werte auf einmal. Warum?
    a: |
      Mit `ORDER BY` im Fenster und ohne Rahmenangabe gilt `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`. `RANGE` behandelt alle Zeilen mit gleichem Sortierwert als gleichrangig und nimmt sie gemeinsam auf. Zwei Bestellungen vom 2. Januar zeigen deshalb beide schon die Summe inklusive der jeweils anderen.

      ```sql
      SUM(umsatz) OVER (ORDER BY bestelldatum)                     -- springt bei Gleichstand
      SUM(umsatz) OVER (ORDER BY bestelldatum, bestellung_id
                        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)  -- Zeile für Zeile
      ```

      Was richtig ist, hängt von der Frage ab: Für „kumulierter Umsatz je Tag“ verdichte ich erst auf Tage, dann ist die Sortierung eindeutig. Für eine zeilenweise Summe gebe ich `ROWS` und einen eindeutigen Tiebreaker an. Derselbe Rahmen steuert gleitende Durchschnitte, etwa `ROWS BETWEEN 6 PRECEDING AND CURRENT ROW` für sieben Tage.
    tags: [sql, fensterfunktionen]
    level: 3
  - id: deduplizieren
    module: sql-fensterfunktionen
    q: Das CRM exportiert jede Änderung eines Kunden als neue Zeile. Wie bekommst du den aktuellen Stand je Kunde?
    a: |
      Je Kunde nach Änderungszeitpunkt absteigend nummerieren und die erste Zeile behalten:

      ```sql
      WITH versionen AS (
        SELECT *,
               ROW_NUMBER() OVER (
                 PARTITION BY kunde_id
                 ORDER BY geaendert_am DESC, export_zeile DESC) AS nr
        FROM kunden_export
      )
      SELECT kunde_id, name, stadt, region, segment
      FROM versionen
      WHERE nr = 1;
      ```

      Der zweite Sortierschlüssel ist wichtig: Haben zwei Versionen denselben Zeitstempel, wäre das Ergebnis sonst zufällig und könnte sich zwischen zwei Läufen ändern.

      Abgrenzung: `GROUP BY kunde_id` mit `MAX(geaendert_am)` liefert nur den Zeitpunkt, nicht die übrigen Spalten derselben Zeile. Und bevor ich dedupliziere, zähle ich die Duplikate – eine plötzlich hohe Zahl ist ein Befund über den Export.
    tags: [sql, fensterfunktionen, duplikate]
    level: 2
  - id: wiederkaufrate
    module: sql-fensterfunktionen
    q: Wie misst du, wie viele Neukunden innerhalb von 90 Tagen ein zweites Mal bestellen – je Monat des Erstkaufs?
    a: |
      Das ist eine Kohortenanalyse: Kunden werden nach dem Monat ihrer ersten Bestellung gruppiert. Mit `LEAD` bekomme ich zu jeder Bestellung die nächste desselben Kunden:

      ```sql
      WITH folge AS (
        SELECT kunde_id, bestelldatum,
               ROW_NUMBER() OVER w AS nr,
               LEAD(bestelldatum) OVER w AS naechste
        FROM bestellungen
        WHERE status = 'bezahlt'
        WINDOW w AS (PARTITION BY kunde_id ORDER BY bestelldatum, bestellung_id)
      )
      SELECT strftime('%Y-%m', bestelldatum) AS kohorte,
             COUNT(*) AS neukunden,
             ROUND(100.0 * AVG(CASE WHEN naechste <= date(bestelldatum, '+90 days')
                                    THEN 1 ELSE 0 END), 1) AS wiederkauf_90_tage_prozent
      FROM folge
      WHERE nr = 1
      GROUP BY kohorte
      ORDER BY kohorte;
      ```

      Die Definition spreche ich aus: nur bezahlte Bestellungen, Erstkauf ist die erste Bestellung in den Daten. Und ich weise auf die Zensierung hin: Kohorten, deren Erstkauf keine 90 Tage zurückliegt, hatten noch nicht genug Zeit und gehören nicht in den Vergleich.
    tags: [sql, fensterfunktionen, kohorten]
    level: 3

  # Python & Workflows: pandas-Grundlagen
  - id: read-csv-deutsch
    module: pandas-grundlagen
    q: Wie liest du einen deutschen ERP-Export mit pandas ein – Semikolon, Dezimalkomma, Datum „14.03.2026“, Kundennummern mit führenden Nullen, Summenzeile am Ende?
    a: |
      ```python
      import pandas as pd

      df = pd.read_csv(
          "erp_2026-03.csv",
          sep=";", decimal=",", thousands=".",
          encoding="cp1252",
          dtype={"Kundennummer": "str"},
          parse_dates=["Belegdatum"], date_format="%d.%m.%Y",
          na_values=["n/a", "-"],
          skipfooter=1, engine="python",
      )
      ```

      Jede Option hat einen Grund: Ohne `dtype` wird `000482` zur Zahl 482. Ohne `parse_dates` macht `thousands="."` aus `14.03.2026` die Zahl 14032026. Ohne `skipfooter` landet die Summenzeile in den Daten und macht aus der Belegnummer eine Textspalte. `skipfooter` funktioniert nur mit `engine="python"`.

      Danach kontrolliere ich mit `df.dtypes`, `df.tail()` und der Summe gegen den Kontrollwert aus der Summenzeile. Die Summenzeile lese ich dafür lieber separat, statt sie wegzuwerfen.
    tags: [pandas, csv]
    level: 2
  - id: copy-on-write
    module: pandas-grundlagen
    q: |
      Code-Review: Warum ändert diese Zeile in pandas 3 nichts?

      ```python
      df[df["kanal"] == "B2B"]["rabatt"] = 0.1
      ```
    a: |
      Das ist verkettete Zuweisung. `df[df["kanal"] == "B2B"]` erzeugt ein neues Objekt, und `["rabatt"] = 0.1` ändert dieses Zwischenergebnis, nicht `df`. Seit pandas 3.0 gilt Copy-on-Write: Jedes Ergebnis einer Auswahl verhält sich wie eine Kopie. Die Zeile wirkt deshalb nie, pandas warnt mit `ChainedAssignmentError`. Die alte `SettingWithCopyWarning` gibt es nicht mehr.

      Richtig ist eine einzige Zuweisung mit `loc`:

      ```python
      df.loc[df["kanal"] == "B2B", "rabatt"] = 0.1
      ```

      Oder als neue Spalte im Method Chaining: `df.assign(rabatt=df["rabatt"].mask(df["kanal"] == "B2B", 0.1))`.

      Der Vorteil von Copy-on-Write: Man muss nicht mehr raten, ob eine Auswahl eine Sicht oder eine Kopie ist, und spart sich vorsorgliche `.copy()`-Aufrufe.
    tags: [pandas, copy-on-write, review]
    level: 2
  - id: pandas-datentypen
    module: pandas-grundlagen
    q: Nach dem Import steht `kunde_id` als `1001.0` da. Der Merge mit dem Kundenstamm, in dem die IDs Text sind, bricht ab – und nach `astype(str)` findet er keinen einzigen Treffer. Was ist passiert?
    a: |
      Die Spalte enthält mindestens einen leeren Wert. Der klassische Ganzzahltyp `int64` kann kein `NaN` speichern, also macht pandas daraus `float64`. Einen Merge von `float64` mit einer Textspalte lehnt pandas mit einem `ValueError` ab. `astype(str)` macht daraus `"1001.0"`, und das ist ein anderer Text als `"1001"` – kein Treffer. Führende Nullen wie in `"001001"` wären ohnehin schon beim Einlesen verloren.

      Ich lege Schlüsseltypen beim Import fest, in beiden Dateien gleich: `dtype={"kunde_id": "Int64"}` – mit großem I, der Ganzzahltyp mit Lücken (`<NA>`) – für numerische Schlüssel, `"str"` für Kennungen mit führenden Nullen. Vor dem Merge vergleiche ich `dtypes` beider Seiten.

      In pandas 3 ist Text standardmäßig vom Typ `str` statt `object`; fehlende Werte erscheinen darin als `NaN`. Und die leeren Schlüssel selbst sind ein Befund für die Datenqualität, nicht nur ein Typproblem.
    tags: [pandas, datentypen]
    level: 2

  # Python & Workflows: pandas-Auswertung
  - id: merge-validate
    module: pandas-auswertung
    q: |
      Code-Review: Nach diesem Merge hat `bestellungen` mehr Zeilen als vorher. Was ist los, und wie verhinderst du das künftig?

      ```python
      df = bestellungen.merge(kunden, on="kunde_id", how="left")
      ```
    a: |
      Ein Left-Merge darf die Zeilenzahl nur dann erhöhen, wenn Schlüssel rechts mehrfach vorkommen. In `kunden` steht also mindestens eine `kunde_id` doppelt, und jede Bestellung dieses Kunden wird verdoppelt – mit ihr der Umsatz.

      Ich mache die Erwartung ausdrücklich:

      ```python
      df = bestellungen.merge(
          kunden, on="kunde_id", how="left",
          validate="many_to_one", indicator=True,
      )
      ohne_kunde = df[df["_merge"] == "left_only"]
      ```

      `validate="many_to_one"` bricht mit `MergeError` ab, sobald rechts ein Schlüssel doppelt ist. `indicator=True` zeigt in `_merge`, welche Bestellungen keinen Kunden gefunden haben.

      Die doppelte `kunde_id` selbst kläre ich an der Quelle. Dasselbe Prinzip wie beim SQL-Fan-out: Granularität kennen, nach jedem Join Zeilen zählen.
    tags: [pandas, joins, review]
    level: 2
  - id: agg-vs-transform
    module: pandas-auswertung
    q: Was ist in pandas der Unterschied zwischen `groupby(…).agg(…)` und `groupby(…).transform(…)`?
    a: |
      `agg` verdichtet: eine Zeile je Gruppe. `transform` liefert ein Ergebnis in der Länge des Originals, jede Zeile bekommt den Wert ihrer Gruppe.

      ```python
      je_kunde = df.groupby("kunde_id").agg(
          umsatz=("netto", "sum"),
          bestellungen=("bestellung_id", "nunique"),
      )
      df["anteil_am_kunden"] = df["netto"] / df.groupby("kunde_id")["netto"].transform("sum")
      ```

      Das erste ist eine benannte Aggregation – die Spaltennamen stehen im Code, nicht als `("netto", "sum")` im Kopf. Das zweite entspricht in SQL `netto / SUM(netto) OVER (PARTITION BY kunde_id)`, also einer Fensterfunktion.

      Ich nehme `transform`, wenn ich Zeilen mit ihrer Gruppe vergleichen will: Anteil am Kundenumsatz, Abweichung vom Monatsmittel, Rang innerhalb der Kategorie.
    tags: [pandas, groupby]
    level: 2
  - id: pivot-table-falle
    module: pandas-auswertung
    q: "`df.pivot(…)` wirft einen Fehler, `df.pivot_table(…)` liefert Zahlen, die nicht zur Excel-PivotTable passen. Was steckt dahinter?"
    a: |
      `pivot` formt nur um und aggregiert nicht. Gibt es für eine Kombination aus Index und Spalte mehr als eine Zeile, bricht es mit „Index contains duplicate entries, cannot reshape“ ab – ein Hinweis, dass die Daten feiner sind als gedacht.

      `pivot_table` aggregiert, aber standardmäßig mit `aggfunc="mean"`. Excel summiert Zahlenfelder standardmäßig. Wer den Parameter weglässt, bekommt Durchschnitte statt Umsätzen. Deshalb schreibe ich ihn immer aus:

      ```python
      df.pivot_table(index="region", columns="monat", values="netto",
                     aggfunc="sum", fill_value=0, margins=True)
      ```

      `margins=True` ergänzt die Gesamtzeile und -spalte wie in Excel. Für Diagramme und weitere Verarbeitung bleibe ich meist im langen Format aus `groupby` und pivotiere erst für die Darstellung.
    tags: [pandas, pivot]
    level: 2

  # Python & Workflows: Visualisierung
  - id: diagrammwahl
    module: visualisierung
    q: Nach welchen Kriterien wählst du einen Diagrammtyp?
    a: |
      Nach der Frage, die das Diagramm beantworten soll:

      - **Vergleich** von Kategorien (Umsatz je Region): Balken, sortiert, bei null beginnend.
      - **Verlauf** über die Zeit (Umsatz je Monat): Linie.
      - **Verteilung** (Bestellwerte): Histogramm oder Boxplot.
      - **Zusammenhang** zweier Größen (Rabatt und Menge): Streudiagramm.
      - **Anteil** am Ganzen: gestapelter Balken; ein Kreis höchstens bei zwei, drei Teilen.

      Dann entferne ich alles, was nicht zur Aussage beiträgt: 3D, Rahmen, eine Legende, wenn direkte Beschriftung geht. Farbe nutze ich sparsam, um das Wichtige hervorzuheben, und nicht als einzige Unterscheidung – Rot und Grün sind für viele Menschen schwer zu trennen. Der Titel nennt die Aussage: „B2B wächst seit Februar, der Shop stagniert“ statt „Umsatz nach Kanal“.
    tags: [visualisierung]
    level: 1
  - id: achse-review
    module: visualisierung
    q: Ein Balkendiagramm im Monatsbericht zeigt März und April, die y-Achse beginnt bei 95 000 €. Was sagst du dazu?
    a: |
      Bei Balken codiert die Länge den Wert. Beginnt die Achse bei 95 000 €, wirkt ein Unterschied von 98 000 € zu 101 000 € wie eine Verdopplung – das Diagramm übertreibt, auch wenn jede Zahl stimmt. Balken beginnen deshalb bei null.

      Wenn die Veränderung die Aussage ist, zeige ich sie direkt: als Zahl („+3 % zum Vormonat“) oder als Liniendiagramm über mehrere Monate. Bei Linien codiert die Position, nicht die Länge; eine Achse, die nicht bei null beginnt, ist dort vertretbar, wenn sie deutlich beschriftet ist.

      Im Review sage ich das sachlich und mit Alternative. Meist war es kein Täuschungsversuch, sondern die Standardeinstellung des Werkzeugs.
    tags: [visualisierung, review]
    level: 1
  - id: bericht-praesentieren
    module: visualisierung
    q: Du stellst der Geschäftsführung den Monatsbericht vor. Wie baust du Dashboard und Präsentation auf?
    a: |
      Von der Entscheidung her, nicht von den Daten. Oben stehen drei bis fünf Kennzahlen, jede mit Kontext: Wert, Vergleich (Vormonat, Vorjahr oder Ziel) und die Veränderung. Eine Zahl ohne Vergleich kann niemand bewerten. Darunter folgen die Diagramme, die die Veränderung erklären, etwa Umsatz je Kanal im Verlauf, als Small Multiples mit gleicher Skala.

      Jede Folie und jedes Diagramm hat eine Aussage als Titel. Definitionen und Datenstand stehen sichtbar dabei („Nettoumsatz ohne Stornos, Stand 3. April“), damit keine Diskussion über die Zahl statt über die Sache entsteht.

      In der Präsentation beginne ich mit der Kernaussage und der Empfehlung und habe die Details als Rückfragen parat. Wenn es Unsicherheiten gibt, etwa einen Datenfehler im ERP, nenne ich sie selbst, bevor jemand danach fragt.
    tags: [visualisierung, kommunikation]
    level: 2

  # Python & Workflows: Reproduzierbare Analysen
  - id: rohdaten-pipeline
    module: reproduzierbare-analysen
    q: Wie strukturierst du eine Analyse, damit jemand anderes sie nächsten Monat wiederholen kann?
    a: |
      Die Rohdaten bleiben unverändert in `data/raw/`, mit Prüfsumme, damit auffällt, wenn jemand eine Datei ersetzt. Alles andere entsteht per Code: `data/processed/` für Zwischenstände, `reports/` für Ergebnisse, `src/` für die Pipeline.

      Die Pipeline besteht aus Funktionen mit klaren Schritten – einlesen, bereinigen, prüfen, auswerten, berichten –, und ein Befehl führt sie mit Parametern wie dem Monat aus. Die Umgebung ist festgehalten, etwa mit `uv` in `pyproject.toml` und `uv.lock`. Code liegt in Git, große Daten nicht.

      Abgrenzung zum Notebook: Zum Erkunden ist ein Notebook ideal, aber es kann versteckten Zustand haben, weil Zellen in beliebiger Reihenfolge liefen. Was bleibt, wandert in Funktionen mit Tests. In Excel gilt dasselbe Prinzip: Power-Query-Schritte statt manueller Zwischenschritte.
    tags: [workflow, reproduzierbarkeit]
    level: 2
  - id: stichtag-determinismus
    module: reproduzierbare-analysen
    q: Deine Auswertung liefert heute andere Märzzahlen als letzte Woche, obwohl du nichts geändert hast. Woran kann das liegen, und wie verhinderst du es?
    a: |
      Mögliche Ursachen: Der Code holt „die aktuellen Daten“, und im ERP wurden März-Bestellungen nachträglich storniert. Ein `date.today()` im Code verschiebt Zeiträume. Die Sortierung ist nicht eindeutig, und bei Gleichständen gewinnt jedes Mal eine andere Zeile. Eine Zeitzone fehlt, und Bestellungen um Mitternacht rutschen zwischen Monaten. Oder eine Bibliothek wurde aktualisiert.

      Gegenmittel: Jeder Lauf verarbeitet einen gesicherten Rohdaten-Stand mit Prüfsumme. Stichtag und Monat sind Parameter, nicht `today()`. Jede Sortierung endet auf einem eindeutigen Schlüssel. Zeitstempel werden ausdrücklich in `Europe/Berlin` umgerechnet. Die Umgebung ist per Lockfile fixiert. Und ein Laufprotokoll hält fest, mit welchen Eingaben das Ergebnis entstand.

      Fachlich braucht es zusätzlich einen Buchungsschluss: Ab welchem Tag gilt der März als abgeschlossen?
    tags: [workflow, reproduzierbarkeit]
    level: 2
  - id: fehler-im-bericht
    module: reproduzierbare-analysen
    q: Du entdeckst einen Fehler in einem Bericht, den die Geschäftsführung schon bekommen hat. Was tust du?
    a: |
      Ich melde ihn schnell und selbst, mit Einordnung: Welche Zahl ist falsch, wie groß ist die Abweichung, ändert sie eine Aussage oder Entscheidung? „Der B2B-Umsatz im März war um 2,1 % zu hoch, die Empfehlung bleibt gleich; die korrigierte Fassung kommt heute Nachmittag.“

      Dann reproduziere ich den Lauf mit denselben Eingaben, finde die Ursache, korrigiere sie im Code statt im fertigen Bericht und schreibe einen Test, der genau diesen Fall abdeckt. Die korrigierte Version bekommt einen Vermerk, was sich geändert hat.

      Möglich ist das nur, weil die Analyse reproduzierbar ist. Ein von Hand zusammenkopierter Bericht lässt sich oft gar nicht mehr nachvollziehen. Im Gespräch zeigt die Antwort, dass ich Verantwortung übernehme und aus dem Fehler eine dauerhafte Verbesserung mache.
    tags: [kommunikation, reproduzierbarkeit]
    level: 2

  # Python & Workflows: Automationen
  - id: idempotenz
    module: automationen
    q: Was heißt „idempotent“ bei einem Monatslauf, und wie erreichst du es?
    a: |
      Idempotent heißt: Ein zweiter Lauf mit denselben Eingaben liefert dasselbe Ergebnis – keine doppelten Zeilen, keine doppelt verschickte Mail. Das ist wichtig, weil Läufe abbrechen und wiederholt werden oder jemand aus Versehen zweimal startet.

      Mittel dazu: Ergebnisse je Monat ersetzen statt anhängen, in der Datenbank etwa `DELETE … WHERE monat = ?` und `INSERT` in einer Transaktion oder ein Upsert über den fachlichen Schlüssel. Verarbeitete Dateien mit Name und Prüfsumme protokollieren und beim nächsten Lauf überspringen. Ausgabedateien erst in eine temporäre Datei schreiben und dann umbenennen, damit kein halber Bericht liegen bleibt. Und die Mail nur senden, wenn sie für diesen Monat noch nicht verschickt wurde.

      Prüfen lässt sich das mit einem Test, der den Lauf zweimal ausführt und die Ergebnisse vergleicht.
    tags: [automation, idempotenz]
    level: 2
  - id: werkzeugwahl
    module: automationen
    q: Excel mit Power Query, SQL oder Python – wie entscheidest du, womit du eine wiederkehrende Auswertung baust?
    a: |
      Nach vier Fragen: Wo liegen die Daten, wie groß sind sie, wer pflegt die Lösung, und wie viel Logik und Prüfung steckt darin?

      - **Excel mit Power Query**, wenn die Fachabteilung selbst pflegt, die Daten als Dateien kommen, die Mengen überschaubar sind und das Ergebnis ohnehin in Excel gebraucht wird.
      - **SQL**, wenn die Daten in einer Datenbank liegen: Filtern und Aggregieren dort, wo die Daten sind, und dieselbe Definition für alle Berichte.
      - **Python mit pandas**, wenn viele Quellen, eigene Prüfregeln, Tests, Zeitsteuerung oder Ausgaben wie Mail und mehrere Dateien dazukommen.

      Office Scripts und VBA ordne ich als Automatisierung *innerhalb* von Excel ein: VBA für den Desktop, Office Scripts auch für Excel im Web und mit Power Automate planbar – mit der Grenze, dass ein geplantes Office Script Power-Query-Abfragen nicht aktualisiert. Oft ist die Antwort eine Kombination – bei Bohnenwerk bereitet Python die Daten auf, SQL rechnet die Kennzahlen, und das Controlling liest sie über Power Query in seine gewohnte Excel-Mappe.
    tags: [automation, werkzeuge]
    level: 2
  - id: prozessverbesserung
    module: power-query
    q: Erzähl von einer Prozessverbesserung mit Daten, die du umgesetzt hast.
    a: |
      Ich antworte nach dem Muster Situation, Aufgabe, Handlung, Ergebnis und bleibe bei belegbaren Zahlen. Ein Beispiel aus dem Kursprojekt:

      **Situation:** Der Monatsbericht bei Bohnenwerk entstand aus drei Exporten per Kopieren und Einfügen, dauerte rund drei Stunden und enthielt jeden zweiten Monat einen Fehler, meist doppelt eingefügte Zeilen.
      **Aufgabe:** Den Bericht wiederholbar und prüfbar machen, ohne dass das Controlling seine Excel-Mappe aufgeben muss.
      **Handlung:** Ordner-Import mit Power Query, Typen mit Gebietsschema, Zusammenführen mit dem Artikelstamm, ein Kontrollblatt mit Zeilenzahlen und Summen je Datei, eine kurze Anleitung.
      **Ergebnis:** Neue Datei in den Ordner, „Alle aktualisieren“, rund fünf Minuten. Seitdem keine doppelten Zeilen mehr, weil das Kontrollblatt sie sofort zeigt.

      Wichtig ist Ehrlichkeit: Ich sage, was gemessen und was geschätzt ist und wer außer mir beteiligt war.
    tags: [kommunikation, prozess]
    level: 1
