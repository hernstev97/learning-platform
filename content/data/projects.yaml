projects:
  - id: excel-monatsreport
    title: Excel-Monatsreport mit Power Query und PivotTable
    level: 1
    hours: 8
    summary: Aus der Kopieren-und-Einfügen-Routine im Vertriebsinnendienst wird ein Bericht, der sich mit „Alle aktualisieren“ in Minuten erneuert – mit Kontrollsummen je Datei.
    brief: |
      **Ausgangslage:** Mia Petersen aus dem Vertriebsinnendienst von Bohnenwerk baut jeden Monat den Umsatzbericht für die Vertriebsleitung. Sie öffnet die Shop-Exporte per Doppelklick, kopiert sie in ein Sammelblatt, repariert Beträge, die als Text ankommen, holt per `SVERWEIS` die Kategorie aus dem Artikelstamm und baut die PivotTable neu. Das dauert rund drei Stunden. Zweimal war in diesem Jahr ein Monat doppelt eingefügt, einmal fehlten alle Artikel mit führender Null. Du stellst den Bericht so um, dass er ohne Handarbeit entsteht – reines Excel, damit Mia ihn selbst weiterpflegen kann.

      **Anforderungen:**

      - Alle Monatsexporte liegen in einem Ordner `Exporte/` (`shop_2026-01.csv`, `shop_2026-02.csv`, …): Semikolon, Windows-1252, Dezimalkomma, Datum `14.03.2026`, Artikelnummern mit führenden Nullen, am Ende eine Zeile `Summe;…` mit dem Kontrollbetrag.
      - Eine Power-Query-Abfrage liest den ganzen Ordner, entfernt die Summenzeilen, setzt Datentypen **mit Gebietsschema** Deutsch (Deutschland), behält Artikelnummern als Text und vereinheitlicht die Spalte `stadt` („Köln “, „köln“ → „Köln“).
      - Der Artikelstamm liegt als intelligente Tabelle in der Mappe und wird per „Abfragen zusammenführen“ (Linker äußerer) angebunden. Positionen ohne Stammsatz landen zusätzlich in einer Abfrage „Unbekannte Artikel“, statt zu verschwinden.
      - Nettoumsatz je Position = Menge × Einzelpreis × (1 − Rabatt), als Spalte in Power Query.
      - Bericht: PivotTable mit Nettoumsatz je Monat und Kategorie, Datenschnitte für Kategorie und Stadt, eine Ansicht „% des Gesamtergebnisses“ und ein Diagramm, dessen Titel eine Aussage trifft.
      - Ein Kontrollblatt zeigt je Datei Zeilenzahl, Summe der Positionen, den Betrag aus der Summenzeile und die Differenz.

      **Rahmen:** Excel mit Power Query (Microsoft 365 oder Excel 2021). Keine Makros und kein Handgriff nach „Daten › Alle aktualisieren“ außer dem Blick aufs Kontrollblatt. Testdaten mit erfundenen Kunden erzeugst du selbst: drei Monate mit je 150–300 Zeilen. Grundlagen: [Power Query](/data/power-query), [Tabellen und PivotTables](/data/tabellen-pivot), [Importieren aus einem Ordner](https://support.microsoft.com/de-de/excel/import-data-from-a-folder-with-multiple-files-power-query), [Datentypen in Power Query](https://learn.microsoft.com/de-de/power-query/data-types).
    skills: [power-query, m, pivottable, datenschnitte, strukturierte-verweise, gebietsschema, prozessverbesserung]
    steps:
      - id: ist-aufnahme
        title: Den heutigen Ablauf messen
        detail: Schreibe jeden Handgriff der bisherigen Routine mit Dauer und typischen Fehlern auf – vom Herunterladen bis zum Versand. Diese Liste ist deine Ausgangsmessung für den Vorher-nachher-Vergleich und die Grundlage der Anleitung.
      - id: testdaten
        title: Testdaten mit typischen Fehlern anlegen
        detail: Lege drei Monatsdateien im beschriebenen Format an, gespeichert in Windows-1252. Baue bewusst ein – Artikelnummern mit führender Null, Städte mit Leerzeichen und abweichender Schreibweise, eine Artikelnummer ohne Stammsatz und die Summenzeile am Dateiende. Notiere, was du eingebaut hast, damit du später prüfen kannst, ob die Abfrage es findet.
      - id: ordner-import
        title: Ordner-Import einrichten
        detail: "Daten › Daten abrufen › Aus Datei › Aus Ordner, dann „Kombinieren und transformieren“. Sieh dir die erzeugten Hilfsabfragen an: Alles, was du in der Beispieldatei-Abfrage änderst, gilt für jede Datei. Behalte den Dateinamen als Spalte `datei`, du brauchst ihn für das Kontrollblatt."
      - id: typen-bereinigen
        title: Typen mit Gebietsschema setzen und bereinigen
        detail: Ersetze den automatisch erzeugten Typ-Schritt. Filtere die Summenzeilen heraus, setze Artikelnummern als Text und Beträge und Datum per Rechtsklick › Typ ändern › Mit Gebietsschema … auf Deutsch (Deutschland). Prüfe im erweiterten Editor, dass `Table.TransformColumnTypes` das Argument `"de-DE"` trägt. Vereinheitliche `stadt` mit Kürzen und einer festen Schreibweise.
      - id: artikelstamm
        title: Artikelstamm anbinden, ohne Zeilen zu verlieren
        detail: Führe die Positionen mit dem Artikelstamm zusammen (Linker äußerer) und erweitere Kategorie und Einkaufspreis. Vergleiche die Zeilenzahl vor und nach dem Schritt – mehr Zeilen heißt doppelte Artikelnummern im Stamm. Lege mit der Join-Art „Linker Anti“ die Abfrage „Unbekannte Artikel“ an.
      - id: bericht-pivot
        title: PivotTable, Datenschnitte und Diagramm bauen
        detail: Lade das Ergebnis als Tabelle oder ins Datenmodell und baue darauf die PivotTable. Prüfe in den Wertfeldeinstellungen, dass „Summe“ statt „Anzahl“ gilt. Ergänze Datenschnitte für Kategorie und Stadt und eine zweite PivotTable mit „Werte anzeigen als › % des Gesamtergebnisses“. Das Diagramm bekommt einen Titel wie „Espresso trägt 58 % des Umsatzes“.
      - id: kontrollblatt
        title: Kontrollblatt mit Abgleich je Datei
        detail: Baue eine zweite Abfrage aus demselben Ordner, die nur die Summenzeilen behält. Gruppiere die bereinigten Daten nach `datei` (Zeilen zählen, Betrag summieren), führe beide Abfragen zusammen und berechne die Differenz. Eine bedingte Formatierung markiert jede Differenz ungleich 0.
      - id: anleitung-messung
        title: Anleitung schreiben und Nutzen messen
        detail: Ein Blatt „Anleitung“ beschreibt den Monatsablauf in drei Schritten – Datei in den Ordner, Alle aktualisieren, Kontrollblatt prüfen – und was bei einer Differenz zu tun ist. Lege eine vierte Monatsdatei ab, miss die Zeit bis zum fertigen Bericht und trage Vorher und Nachher ein.
    acceptance:
      - id: alle-aktualisieren
        text: Eine neue Monatsdatei im Ordner und „Daten › Alle aktualisieren“ genügen; PivotTable, Diagramm und Kontrollblatt zeigen den neuen Monat ohne weiteren Handgriff.
      - id: gebietsschema-fest
        text: Alle Zahlen- und Datumsspalten werden im M-Code mit ausdrücklichem Gebietsschema `"de-DE"` umgewandelt; kein Typ-Schritt verlässt sich auf die Ländereinstellung des Rechners.
      - id: kontrolle-null
        text: Das Kontrollblatt zeigt für jede Datei Differenz 0,00 € zwischen der Summe der Positionen und der Summenzeile.
      - id: unbekannte-sichtbar
        text: Die eingebaute unbekannte Artikelnummer erscheint in „Unbekannte Artikel“, und ihr Umsatz ist im Bericht als „(Leer)“ bzw. ohne Kategorie sichtbar statt verschwunden.
      - id: fuehrende-nullen
        text: Artikelnummern mit führender Null bleiben Text und finden ihren Stammsatz.
      - id: zeit-gemessen
        text: Die Anleitung nennt den gemessenen Zeitbedarf vorher und nachher.
    stretch:
      - Baue dieselbe Auswertung zusätzlich als Formel mit `PIVOTMIT` oder `GRUPPIERENNACH` auf der geladenen Tabelle und vergleiche das Ergebnis mit der PivotTable.
      - Lege den Ordnerpfad als Parameter in einer Einstellungstabelle ab, damit die Mappe auf jedem Rechner ohne Änderung am M-Code läuft.
      - Hänge einen zweiten Export mit Retouren per „Abfragen anfügen“ an und weise den Nettoumsatz nach Retouren aus.
      - Rechne die Monatssummen mit SQL oder pandas nach und gleiche sie mit der Mappe ab.
    portfolio: |
      Zeige Vorher und Nachher nebeneinander: die Liste der Handgriffe mit drei Stunden und eine kurze Bildschirmaufnahme, in der eine neue Datei in den Ordner wandert, „Alle aktualisieren“ läuft und das Kontrollblatt grün bleibt. Dazu ein Screenshot der angewendeten Schritte – sie sind die Dokumentation.

      Im Gespräch erklärst du, warum das Gebietsschema in den Typ-Schritt gehört, wie das Kontrollblatt einen doppelt eingefügten Monat sofort zeigt und ab welcher Datenmenge oder Logik du auf SQL oder Python wechseln würdest. Hast du Ähnliches im Job gebaut, erzähl davon mit denselben Zahlen, aber zeige nur diese Mappe mit erfundenen Daten – keine Firmendateien.
  - id: ticket-kennzahlen
    title: Support-Tickets mit SQL auswerten
    level: 2
    hours: 12
    summary: Aus einem Ticket-Export entsteht eine SQLite-Datenbank mit sauber definierten Prozesskennzahlen – Durchlaufzeit, Rückstau, Wiederöffnungen – und eine Empfehlung an die Teamleitung.
    brief: |
      **Ausgangslage:** Jana Okafor leitet den Kundenservice von Bohnenwerk. Sie hat den Eindruck, dass Tickets zu Lieferproblemen zu lange liegen bleiben, besonders seit dem Wechsel des Paketdienstes im April. Zahlen gibt es keine; das Ticketsystem exportiert nur CSV-Dateien. Du lieferst belastbare Prozesskennzahlen und zeigst, wo es hakt.

      **Daten** (selbst erzeugt, Januar bis Juni 2026, rund 2 000 Tickets):

      - `tickets.csv`: `ticket_id`, `kunde_id`, `erstellt_am`, `geschlossen_am` (leer, solange offen), `kategorie` (`Lieferung`, `Qualität`, `Rechnung`), `prioritaet` (`hoch`, `normal`, `niedrig`).
      - `ticket_ereignisse.csv`: `ticket_id`, `zeitpunkt`, `status` (`neu`, `in_arbeit`, `wartet_auf_kunde`, `geschlossen`, `wieder_geoeffnet`).
      - `bestellungen.csv` aus dem Bohnenwerk-Modell, um Tickets je 100 Bestellungen zu berechnen.

      **Anforderungen:**

      - Ein Skript baut aus den CSV-Dateien eine frische SQLite-Datenbank mit Primär- und Fremdschlüsseln; Zeitstempel als ISO-Text.
      - Ein Kennzahlen-Steckbrief legt jede Kennzahl vor der ersten Abfrage fest: Formel, Einheit, Umgang mit offenen und wieder geöffneten Tickets, Zeitbezug.
      - Je Monat und Kategorie mindestens: Eingang, Durchlaufzeit (Median und 90-%-Quantil), Anteil innerhalb von 48 Stunden gelöst, Rückstau am Monatsende, Wiederöffnungsquote, Tickets je 100 Bestellungen.
      - Der Rückstau wird je Kalendertag berechnet, auch für Tage ohne ein einziges Ereignis.
      - Ein Memo von höchstens einer Seite mit drei Befunden, jeweils Zahl, Vergleich und Empfehlung.

      **Rahmen:** SQLite (3.39 oder neuer), Python nur zum Laden und für Tests. SQLite 3.39 hat keine Median-Funktion – Median und Quantil baust du mit Fensterfunktionen. Grundlagen: [SQL-Abfragen](/data/sql-abfragen), [Fensterfunktionen und Analysemuster](/data/sql-fensterfunktionen), [SQLite Window Functions](https://www.sqlite.org/windowfunctions.html), [Datums- und Zeitfunktionen](https://www.sqlite.org/lang_datefunc.html).
    skills: [sqlite, sql, fensterfunktionen, cte, prozesskennzahlen, datenqualität, python, tests]
    steps:
      - id: steckbrief
        title: Kennzahlen-Steckbrief schreiben
        detail: Entscheide vor der ersten Abfrage, was jede Kennzahl bedeutet. Zählt die Durchlaufzeit bis zur ersten oder zur letzten Schließung? Kalender- oder Arbeitsstunden? Wie fließen offene Tickets ein? Ein Steckbrief-Eintrag enthält Name, Frage, Formel, Einheit, Filter und bekannte Grenzen.
      - id: testdaten
        title: Daten mit bekannten Mustern erzeugen
        detail: Ein Generator mit festem Seed erzeugt Tickets und Ereignisse. Baue Muster ein, die du wiederfinden willst – etwa längere Lieferungs-Tickets ab April, einige Wiederöffnungen, offene Tickets am Periodenende – und einige Fehler wie ein Schließdatum vor dem Erstelldatum oder Ereignisse ohne Ticket.
      - id: datenbank-laden
        title: Datenbank aus CSV laden
        detail: Lege das Schema in `schema.sql` mit Schlüsseln und `CHECK`-Constraints ab und lade mit Python (`csv` und `executemany`) oder mit `.import --csv` der sqlite3-Kommandozeile. Aktiviere `PRAGMA foreign_keys = ON`. Vergleiche die Zeilenzahlen jeder Tabelle mit den Dateien.
      - id: qualitaet
        title: Qualitätschecks in SQL
        detail: Prüfe doppelte Ticket-IDs, Ereignisse ohne Ticket (Anti-Join), Schließdatum vor Erstelldatum und geschlossene Tickets ohne Schließereignis. Lege für jeden Befund fest, ob er ausgeschlossen, korrigiert oder nur gemeldet wird, und schreibe das in den Steckbrief.
      - id: durchlaufzeit
        title: Durchlaufzeit mit Median und Quantil
        detail: Rechne Stunden mit `(julianday(geschlossen_am) - julianday(erstellt_am)) * 24`. Den Median bildest du je Gruppe über `ROW_NUMBER()` und `COUNT(*) OVER (PARTITION BY …)`. Lege fest, welche Quantil-Definition du nutzt, und nenne sie im Memo.
      - id: rueckstau
        title: Rückstau je Kalendertag
        detail: Erzeuge den Kalender mit einer rekursiven CTE. Eingänge zählen +1, Schließungen −1; die laufende Summe über alle Tage ist der Rückstau am Tagesende. Tage ohne Ereignis müssen mit dem Vortageswert erscheinen, nicht fehlen.
      - id: quoten-und-normierung
        title: Wiederöffnungen und Tickets je 100 Bestellungen
        detail: Die Wiederöffnungsquote ermittelst du mit `EXISTS` auf die Ereignisse. Für Tickets je 100 Bestellungen verdichtest du Tickets und Bestellungen zuerst getrennt je Monat und verknüpfst dann 1:1 – sonst entsteht ein Fan-out.
      - id: tests
        title: Abfragen gegen einen Mini-Datensatz testen
        detail: Lege acht bis zwölf Tickets an, deren Kennzahlen du von Hand ausrechnest, auch mit offenem Ticket, Gleichstand und Wiederöffnung. Ein Test lädt diesen Datensatz, führt jede `.sql`-Datei aus und vergleicht das Ergebnis mit deinen Werten.
      - id: memo
        title: Memo und README schreiben
        detail: Das Memo beginnt mit der wichtigsten Aussage, etwa „Lieferungs-Tickets brauchen seit April im Median 31 statt 9 Stunden“, belegt jeden Befund mit Zahl und Vergleich und endet mit Empfehlungen und Grenzen der Daten. Das README erklärt Aufbau, Aufruf und Steckbrief.
    acceptance:
      - id: ein-befehl-db
        text: Ein Befehl erzeugt die Datenbank aus den CSV-Dateien neu und führt alle Abfragen aus; zwei Läufe hintereinander liefern identische Ergebnisse.
      - id: steckbrief-vollstaendig
        text: Jede Kennzahl im Memo hat einen Steckbrief-Eintrag mit Formel, Einheit, Umgang mit offenen Tickets und Zeitbezug.
      - id: median-korrekt
        text: Median und 90-%-Quantil der Durchlaufzeit stimmen für den Mini-Datensatz mit den handgerechneten Werten überein.
      - id: kalender-vollstaendig
        text: Der Rückstau enthält jeden Kalendertag des Zeitraums, auch Tage ohne Ereignis.
      - id: kein-fan-out
        text: Ein Test belegt, dass die Zahl der Tickets nach der Verknüpfung mit den Bestellungen unverändert ist.
      - id: memo-belegt
        text: Das Memo nennt drei Befunde mit Zahl, Vergleich und Empfehlung sowie die Grenzen der Daten.
    stretch:
      - Rechne die Durchlaufzeit zusätzlich in Arbeitsstunden (Montag bis Freitag, 8 bis 17 Uhr) und zeige, wie sich die Aussage ändert.
      - Werte Kohorten aus – welcher Anteil der Tickets eines Monats ist nach sieben Tagen noch offen?
      - Lass dieselben Abfragen in PostgreSQL laufen, nutze dort `percentile_cont` und dokumentiere die Dialektunterschiede.
      - Exportiere die Ergebnisse als CSV und baue daraus mit Power Query ein Excel-Dashboard für die Teamleitung.
    portfolio: |
      Das README zeigt das Datenmodell als Skizze, den Kennzahlen-Steckbrief und drei kommentierte Abfragen: Median über Fensterfunktionen, Rückstau über den Kalender und die Normierung je 100 Bestellungen. Das Memo liegt als eigene Datei daneben.

      Im Gespräch sind das starke Themen, weil sie in SQL-Interviews oft vorkommen: Warum ist der Durchschnitt der Durchlaufzeit bei offenen Tickets zu optimistisch? Wie berechnest du einen Median ohne Median-Funktion? Warum fehlen ohne Kalender Tage im Rückstau? Sag offen, dass die Daten simuliert sind, und beschreibe, welche Muster du eingebaut und wiedergefunden hast.
  - id: dq-pruefwerkzeug
    title: Datenqualitäts-Check als Python-Werkzeug
    level: 2
    hours: 14
    summary: Ein Kommandozeilenwerkzeug prüft CSV-Exporte gegen Regeln aus einer TOML-Datei, legt fehlerhafte Zeilen mit Grund in Quarantäne und schreibt einen Qualitätsbericht mit Abgleich gegen Kontrollwerte.
    brief: |
      **Ausgangslage:** Bei Bohnenwerk kommen jeden Monat Exporte aus Webshop, ERP und Ticketsystem. Fehler fallen bisher erst auf, wenn eine Zahl im Bericht seltsam aussieht. Du baust ein Prüfwerkzeug, das jede Lieferung vor der Auswertung gegen fachliche Regeln prüft – und das Kolleginnen ohne Programmierkenntnisse um neue Regeln erweitern können.

      **Anforderungen:**

      - Aufruf `dqcheck regeln/erp.toml daten/erp_2026-03.csv --ausgabe reports/erp_2026-03/`.
      - Die Regeldatei enthält die Einlese-Optionen und die Prüfungen:

        ```toml
        [einlesen]
        trennzeichen = ";"
        codierung = "cp1252"
        dezimalzeichen = ","
        datumsformat = "%d.%m.%Y"

        [[regel]]
        id = "E01"
        art = "eindeutig"
        spalten = ["Belegnummer", "Position"]
        dimension = "Eindeutigkeit"
        schwere = "fehler"

        [[regel]]
        id = "G03"
        art = "bereich"
        spalten = ["Rabatt"]
        min = 0
        max = 0.2
        dimension = "Gültigkeit"
        schwere = "fehler"
        ```

      - Regelarten: `pflicht`, `eindeutig` (auch über mehrere Spalten), `typ` (Ganzzahl, Dezimalzahl, Datum), `bereich`, `erlaubt` (Werteliste), `muster` (regulärer Ausdruck), `referenz` (Wert kommt in einer Spalte einer anderen Datei vor), `vergleich` zwischen zwei Spalten und die Dateiregeln `abgleich` (Zeilenzahl und Summe gegen Kontrollwerte) und `aktualitaet`.
      - Ausgaben: `sauber.csv`, `quarantaene.csv` (Originalzeile, Zeilennummer in der Datei, alle verletzten Regel-IDs mit Grund) und `bericht.md` mit Zusammenfassung je Dimension, Treffern je Regel, Beispielzeilen und Abgleich.
      - Exit-Code 0 ohne Fehler, 1 bei Fehlern in Zeilen, 2 bei Abbruch (Datei oder Pflichtspalte fehlt, Regeldatei ungültig).

      **Rahmen:** Python 3.12 oder neuer mit [`tomllib`](https://docs.python.org/3/library/tomllib.html), `csv` oder pandas und `argparse`; Tests mit `unittest` oder pytest. Regeln sind reine Funktionen, die sich ohne Dateien testen lassen. Beispielzeilen im Bericht zeigen keine Namen oder E-Mail-Adressen im Klartext. Grundlagen: [Datenqualität messen und sichern](/data/datenqualitaet), [pandas: Daten laden und bereinigen](/data/pandas-grundlagen).
    skills: [python, pandas, datenqualität, tomllib, argparse, tests, cli]
    steps:
      - id: regelformat
        title: Regelformat entwerfen
        detail: Schreibe die Regeldatei für den ERP-Export zuerst von Hand, bevor es Code gibt. Entscheide, was Konfiguration ist (Spalten, Grenzen, Schweregrad) und was Code bleibt (die Regelarten). Jede Regel braucht eine stabile ID, eine Dimension und einen Schweregrad.
      - id: robust-einlesen
        title: Robust einlesen
        detail: Lies alle Spalten zuerst als Text und behalte die Zeilennummer der Originaldatei. Die Umwandlung in Zahlen und Datum ist selbst eine Regel (`typ`) – so wird ein ungültiger Betrag zum Befund in der Quarantäne statt zum Absturz. Fehlt eine Pflichtspalte, bricht das Werkzeug mit Exit-Code 2 und klarer Meldung ab.
      - id: regeln-als-funktionen
        title: Regelarten als Funktionen
        detail: Jede Regelart ist eine Funktion, die Daten und Regelparameter bekommt und die Zeilennummern der Verstöße liefert. Ein Verzeichnis ordnet `art` der Funktion zu. Schreibe zu jeder Regelart einen Test mit Verstoß und einen mit sauberen Daten.
      - id: dateiregeln
        title: Abgleich und Aktualität
        detail: "`abgleich` vergleicht Zeilenzahl und Summe einer Spalte mit Kontrollwerten – aus einer Summenzeile, einer Kontrolldatei oder der Kommandozeile. Rechne Beträge mit `Decimal` und lege eine Toleranz fest, die im Bericht steht. `aktualitaet` prüft, dass das jüngste Datum nicht älter als eine konfigurierte Anzahl Tage ist."
      - id: quarantaene-aufteilen
        title: In sauber und Quarantäne aufteilen
        detail: Eine Zeile mit mindestens einem Verstoß der Schwere `fehler` wandert in die Quarantäne, mit allen verletzten Regeln. Warnungen bleiben in den sauberen Daten und erscheinen nur im Bericht. Prüfe die Zeilenbilanz in einem Test – eingelesen = sauber + Quarantäne.
      - id: bericht
        title: Qualitätsbericht schreiben
        detail: Der Bericht beginnt mit Ampel und Zeilenbilanz, zeigt dann Treffer je Dimension und je Regel, bis zu drei Beispielzeilen je Regel (personenbezogene Felder gekürzt) und den Abgleich. Sortiere alles deterministisch, damit zwei Läufe denselben Bericht ergeben.
      - id: cli
        title: Kommandozeile, Exit-Codes und Protokoll
        detail: Baue die Oberfläche mit `argparse` und dokumentiere die Exit-Codes in der Hilfe. Protokolliere Beginn, Regeldatei, Zeilenzahlen und Dauer auf stderr, das Ergebnis in die Dateien.
      - id: anwenden
        title: Auf die Bohnenwerk-Exporte anwenden
        detail: Schreibe Regeldateien für Shop, ERP und Tickets, darunter eine `referenz`-Regel für Positionen gegen Bestellungen und eine `vergleich`-Regel für `geschlossen_am` gegen `erstellt_am`. Baue in Kopien der Exporte gezielt Fehler ein und halte in `erwartete_befunde.csv` fest, welche Regel sie finden muss.
      - id: dokumentation
        title: Regelreferenz und README
        detail: Das README zeigt einen Aufruf mit Ausgabe, erklärt jede Regelart mit Beispiel und beschreibt, wie man eine neue Regel ergänzt – ohne Code und mit Code.
    acceptance:
      - id: regeln-ohne-code
        text: Eine neue Prüfung aus den vorhandenen Regelarten lässt sich allein über die TOML-Datei ergänzen.
      - id: zeilenbilanz
        text: Für jede Eingabe gilt eingelesen = sauber + Quarantäne; ein Test prüft das für alle Beispieldateien.
      - id: regeln-getestet
        text: Jede Regelart hat mindestens einen Test, der einen Verstoß findet, und einen, der saubere Daten durchlässt.
      - id: befunde-vollstaendig
        text: Alle Fehler aus `erwartete_befunde.csv` werden mit der richtigen Regel-ID gemeldet.
      - id: exitcodes
        text: Die Exit-Codes 0, 1 und 2 sind dokumentiert und durch Tests belegt; eine fehlende Pflichtspalte führt zu Code 2 mit verständlicher Meldung.
      - id: bericht-deterministisch
        text: Zwei Läufe auf denselben Daten erzeugen byte-gleiche Berichte.
    stretch:
      - Schreibe den Bericht zusätzlich als HTML mit einer Tabelle je Dimension.
      - Speichere die Trefferzahlen jedes Laufs und zeige im Bericht den Verlauf der letzten sechs Monate je Regel.
      - Ergänze dateiübergreifende Regeln, etwa „Summe der Positionen je Bestellung = Rechnungsbetrag“.
      - Binde das Werkzeug als ersten Schritt in den Monatslauf des Abschlussprojekts ein.
    portfolio: |
      Zeige eine Beispielsitzung: Aufruf, Exit-Code 1, Ausschnitt aus `bericht.md` mit Zeilenbilanz und zwei Befunden, dazu die Regeldatei, die sie gefunden hat. Das macht in einer Minute klar, was das Werkzeug kann.

      Im Gespräch erklärst du die Entwurfsentscheidungen: warum die Typumwandlung eine Regel ist, warum Quarantäne statt Löschen, warum Warnungen und Fehler getrennt sind und wie die Zeilenbilanz verhindert, dass Daten still verschwinden. Wer so über Datenqualität spricht, zeigt, dass er Zahlen nicht nur ausrechnet, sondern für sie geradesteht.
  - id: monatsauswertung
    title: "Abschlussprojekt: Vom Rohdatenexport zur Monatsauswertung"
    capstone: true
    level: 3
    hours: 45
    summary: Für Bohnenwerk entsteht aus drei unterschiedlich formatierten Exporten ein geprüfter, reproduzierbarer Monatslauf – Import, Bereinigung, Qualitätsbericht, SQLite, SQL-Analysen, Diagramme und Bericht mit einem Befehl.
    brief: |
      ## Auftrag

      Katrin Adler leitet das Controlling der Bohnenwerk GmbH in Köln. Der Monatsbericht für die Geschäftsführung entsteht bisher so: Ein Kollege lädt den Bestellexport aus dem Webshop und den Rechnungsexport aus dem B2B-ERP herunter, kopiert beides in eine große Excel-Mappe, gleicht die Artikel per `SVERWEIS` mit dem Produktstamm ab und baut PivotTables. Die Probleme laut Auftraggeberin:

      - Der Bericht kostet zwei Arbeitstage und ist erst am sechsten Arbeitstag fertig.
      - Vertrieb und Controlling nennen für denselben Monat unterschiedliche Umsätze. Niemand kann sicher sagen, welche Zahl stimmt.
      - Fehler fallen spät auf: doppelt eingefügte Tage, Artikel ohne Kategorie, Bestellungen aus der letzten Märznacht, die im April hätten stehen müssen.
      - Ist der Kollege im Urlaub, gibt es keinen Bericht.

      Gesucht ist ein Monatslauf, den jede Person im Controlling mit einem Befehl startet. Er prüft seine Eingaben, erklärt Abweichungen und liefert am zweiten Arbeitstag einen Bericht, dessen Zahlen sich bis zum einzelnen Beleg zurückverfolgen lassen.

      ## Datenquellen

      Weil es keine echten Daten gibt, schreibst du zuerst einen Generator, der Januar bis März 2026 realistisch erzeugt – mit festem Seed und einer Liste absichtlich eingebauter Fehler.

      | Quelle | Datei | Format |
      | --- | --- | --- |
      | Webshop | `shop_bestellungen_2026-03.csv` | UTF-8 mit BOM, Komma als Trennzeichen, Punkt als Dezimalzeichen, Zeitstempel in UTC (`2026-03-31T22:30:00Z`), eine Zeile je Position, Preise **brutto** mit Spalte `mwst_satz` |
      | Webshop | `shop_kontrolle_2026-03.csv` | Tagessummen und Bestellzahlen aus dem Shop-Backend als Kontrollwerte |
      | B2B-ERP | `erp_rechnungen_2026-03.csv` | Windows-1252, Semikolon, Dezimalkomma, Tausenderpunkt, Datum `14.03.2026`, Kundennummern mit führenden Nullen, Gutschriften für Retouren mit negativen Beträgen, Summenzeile am Ende |
      | Produktstamm | `produktstamm.xlsx` | Blatt `Artikel`, Artikelnummer als Text (`00417`), Kategorien in uneinheitlicher Schreibweise, inaktive Artikel, Einkaufspreise |

      Eingebaute Fehler sind zum Beispiel ein doppelt exportierter Tag im Shop, eine Rechnung an einen unbekannten Kunden, ein Artikel ohne Stammsatz, ein Rabatt über 20 %, eine ERP-Datei, deren Summenzeile nicht zur Summe der Zeilen passt, und eine Bestellung kurz nach Mitternacht deutscher Zeit am Monatsende.

      ## Fachliche Anforderungen

      1. **Kennzahlen-Steckbrief** vor dem ersten Code: Nettoumsatz (ohne Umsatzsteuer und Versandkosten, Stornos ausgeschlossen, Retouren abgezogen), Deckungsbeitrag, Anzahl Bestellungen, Bestellwert als Mittelwert und Median, Neukunden und Wiederkaufrate. Die Monatszuordnung folgt der deutschen Ortszeit.
      2. **Import und Bereinigung** beider Exporte und des Produktstamms in das gemeinsame Modell des Kurses (`kunden`, `produkte`, `bestellungen`, `positionen`), einschließlich der Umrechnung brutto → netto für den Shop.
      3. **Qualitätsbericht** je Lauf: Regeln mit ID und Dimension, Quarantäne statt stillem Verwerfen, Zeilenbilanz und Abgleich von Zeilenzahl und Summe je Quelle gegen die Kontrollwerte.
      4. **SQLite-Datenbank** mit Primär- und Fremdschlüsseln, `CHECK`-Constraints und einer Tabelle `laeufe` (Monat, Zeitpunkt, Prüfsummen, Zeilenzahlen).
      5. **SQL-Analysen** als eigene `.sql`-Dateien, darunter mit Fensterfunktionen: Vormonatsvergleich, Top 5 Produkte je Kategorie, kumulierter Umsatz seit Jahresbeginn und Wiederkaufrate je Kohorte.
      6. **Bericht** als Excel-Mappe oder HTML-Seite: Kennzahlen mit Vergleich, höchstens fünf Diagramme mit Aussage im Titel, eine Qualitätsseite, Definitionen und Datenstand.
      7. **Ein Befehl** für den Monatslauf mit dem Monat als Parameter, Trockenlauf, Protokoll und sinnvollen Exit-Codes. Ein zweiter Lauf für denselben Monat erzeugt keine Duplikate.

      ## Technischer Rahmen

      Python 3.12 oder neuer mit pandas für Import und Aufbereitung, `sqlite3` aus der Standardbibliothek, matplotlib für Diagramme und openpyxl für Excel-Dateien. Das Projekt verwaltest du mit [uv](https://docs.astral.sh/uv/guides/projects/) (`pyproject.toml`, `uv.lock`). Struktur: `data/raw/<monat>/` mit `MANIFEST.sha256` (Rohdaten werden nie verändert), `data/processed/`, `src/`, `sql/`, `reports/<monat>/`, `tests/`. In Git liegen Code, Tests, das Manifest und ein kleiner Testdatensatz, keine Monatsdaten.

      Grundlage sind alle Module dieses Bereichs, besonders [Datenqualität](/data/datenqualitaet), [Joins](/data/sql-joins), [Fensterfunktionen](/data/sql-fensterfunktionen), [pandas: gruppieren, verknüpfen, umformen](/data/pandas-auswertung), [Visualisierung](/data/visualisierung), [Reproduzierbare Analyse-Workflows](/data/reproduzierbare-analysen) und [Kleine Automationen](/data/automationen).

      ## Abgabe

      Repository mit Generator, Pipeline, SQL-Dateien, Tests und README; Bericht und Qualitätsbericht für März 2026; Kennzahlen-Steckbrief und Datenwörterbuch; eine Präsentation von zehn Minuten für die Auftraggeberin.
    skills: [pandas, sqlite, sql, fensterfunktionen, datenqualität, csv, encoding, zeitzonen, matplotlib, openpyxl, uv, tests, reproduzierbarkeit, automation]
    steps:
      - id: auftrag-steckbrief
        title: Auftrag, Kennzahlen und Nichtziele klären
        detail: Schreibe den Kennzahlen-Steckbrief und eine Liste offener Fragen an die Auftraggeberin, etwa „Zählt eine Retoure im Monat der Bestellung oder der Gutschrift?“. Beantworte sie mit einer begründeten Annahme. Halte Nichtziele fest (kein Dashboard-Server, keine Echtzeit) und leite aus dem Auftrag die Abnahmekriterien ab.
      - id: generator
        title: Rohdaten-Generator mit bekannten Fehlern
        detail: Der Generator erzeugt alle vier Dateien für drei Monate in ihren echten Formaten, mit festem Seed. Jeder eingebaute Fehler steht mit erwarteter Regel-ID in `tests/erwartete_befunde.csv`. So kannst du später belegen, dass der Qualitätsbericht findet, was er finden soll.
      - id: projektgeruest
        title: Projektgerüst und Rohdaten sichern
        detail: Lege das Projekt mit `uv init` an und die Struktur wie beschrieben. Beim Ablegen eines Monats schreibst du die SHA-256-Prüfsummen ins Manifest. Der Lauf vergleicht sie zu Beginn und bricht bei einer Abweichung ab – eine veränderte Rohdatei ist ein Vorfall, kein Detail.
      - id: einlesen
        title: Die drei Quellen einlesen
        detail: Je Quelle eine Funktion, die einen DataFrame mit festgelegten Datentypen liefert. Denk an BOM und Windows-1252, Dezimalkomma und Tausenderpunkt, Kundennummern als Text, die Summenzeile (getrennt als Kontrollwert lesen) und `read_excel` für den Produktstamm. Shop-Zeitstempel rechnest du mit `tz_convert("Europe/Berlin")` in deutsche Zeit um, bevor du den Monat bestimmst.
      - id: vereinheitlichen
        title: Bereinigen und in das gemeinsame Modell bringen
        detail: Bilde beide Kanäle auf `bestellungen` und `positionen` ab. Rechne Shop-Preise mit dem `mwst_satz` der Zeile in netto um und lege fest, ob je Position oder je Bestellung gerundet wird. Kategorien normalisierst du über eine Zuordnungstabelle, nicht über verstreute Ersetzungen. Gutschriften behandelst du nach der Entscheidung aus dem Steckbrief.
      - id: qualitaet-abgleich
        title: Qualitätsregeln, Quarantäne und Abgleich
        detail: Prüfe Pflichtfelder, Eindeutigkeit, Wertebereiche, Referenzen (Positionen → Produkte, Bestellungen → Kunden) und den Abgleich gegen Summenzeile und Shop-Kontrollwerte je Tag. Fehlerhafte Zeilen gehen mit Regel-ID in die Quarantäne. Der Bericht `qualitaet.md` beginnt mit der Zeilenbilanz eingelesen = geladen + Quarantäne + bewusst gefiltert. Das Prüfwerkzeug aus dem Projekt [Datenqualitäts-Check](/data/projekte/dq-pruefwerkzeug) darfst du wiederverwenden.
      - id: sqlite-laden
        title: Idempotent in SQLite laden
        detail: "`schema.sql` legt Tabellen mit Schlüsseln und `CHECK`-Constraints an; schalte `PRAGMA foreign_keys = ON` ein. Ein Monat wird in einer Transaktion geladen: erst die Zeilen dieses Monats löschen, dann einfügen, dann einen Eintrag in `laeufe` schreiben. Bricht etwas ab, bleibt der vorige Stand erhalten ([Transaktionen](https://www.sqlite.org/lang_transaction.html))."
      - id: sql-analysen
        title: SQL-Analysen mit Fensterfunktionen
        detail: Jede Analyse ist eine `.sql`-Datei mit Kopfkommentar zu Frage, Definition und Granularität des Ergebnisses. Die Ergebnisse liest Python mit `pandas.read_sql_query`. Zu jeder Analyse gehört eine Gegenprobe, etwa „die Summe aller Kategorien ergibt den Gesamtumsatz“ oder „kein Monat fehlt im Vormonatsvergleich“.
      - id: bericht
        title: Diagramme und Bericht erzeugen
        detail: Erzeuge die Diagramme mit matplotlib – Balken ab null, sortiert, Farbe nur zur Hervorhebung, Titel als Aussage. Schreibe den Bericht als Excel-Mappe mit den Blättern Übersicht, Kennzahlen, Qualität und Definitionen oder als HTML-Seite. Datenstand und Laufnummer stehen auf jeder Seite.
      - id: monatslauf
        title: Ein Befehl für den Monatslauf
        detail: "`uv run --locked monatslauf --monat 2026-03` führt alle Schritte aus; `--trockenlauf` liest und prüft nur und schreibt nichts. Das Protokoll nennt je Schritt Zeilen hinein und hinaus und die Dauer. Exit-Codes: 0 in Ordnung, 1 Qualitätsfehler über der Schwelle, 2 Eingaben fehlen oder Prüfsumme weicht ab."
      - id: tests
        title: Tests mit Mini-Datensatz
        detail: Ein Mini-Datensatz mit 10 bis 20 Positionen, dessen Kennzahlen du von Hand ausgerechnet hast, deckt die Randfälle ab – Storno, Retoure, Gleichstand bei den Top-Produkten, die Bestellung um 00:30 Uhr am 1. April. Tests prüfen Einlesen, Regeln, Kennzahlen und einen doppelten Lauf. Gern laufen sie zusätzlich in GitHub Actions.
      - id: uebergabe
        title: Übergabe und Präsentation
        detail: README mit Zweck, Datenfluss-Skizze, Aufruf, Steckbrief, Datenwörterbuch und bekannten Grenzen. Lass eine zweite Person den Märzlauf nur mit dem README ausführen und notiere, wo sie hängen blieb. Bereite zehn Minuten Präsentation vor – Problem, Lösung, eine gefundene Abweichung, Ergebnis in Zahlen.
    acceptance:
      - id: ein-befehl
        text: "`uv run --locked monatslauf --monat 2026-03` erzeugt aus `data/raw/2026-03/` Datenbank, Qualitätsbericht und Bericht ohne manuellen Zwischenschritt; `--trockenlauf` schreibt nichts."
      - id: idempotent
        text: Ein zweiter Lauf für denselben Monat ändert weder Zeilenzahlen noch Kennzahlen; ein automatisierter Test belegt das.
      - id: rohdaten-geschuetzt
        text: Rohdaten werden nie verändert; eine nachträglich veränderte Rohdatei führt anhand von `MANIFEST.sha256` zu einem Abbruch mit verständlicher Meldung.
      - id: abgleich-erklaert
        text: Der Qualitätsbericht weist je Quelle Zeilenzahl und Summe gegen die Kontrollwerte aus; jede Differenz ist 0,00 € oder vollständig durch Quarantäne-Zeilen erklärt.
      - id: befunde-gefunden
        text: Alle Fehler aus `tests/erwartete_befunde.csv` werden mit der passenden Regel-ID gemeldet; die Zeilenbilanz geht auf.
      - id: kennzahlen-belegt
        text: Nettoumsatz, Deckungsbeitrag, Bestellungen, Vormonatsvergleich und Top-Produkte stimmen für den Mini-Datensatz mit den handgerechneten Werten überein.
      - id: zeitzone-korrekt
        text: Eine Shop-Bestellung vom `2026-03-31T22:30:00Z` zählt zum April; ein Test belegt die Monatszuordnung nach deutscher Ortszeit.
      - id: sql-dateien
        text: Mindestens vier Analysen liegen als `.sql`-Dateien vor, drei davon mit Fensterfunktionen, jede mit Kopfkommentar und Gegenprobe.
      - id: bericht-lesbar
        text: Der Bericht enthält Kennzahlen mit Vergleich, höchstens fünf Diagramme mit Aussage im Titel und bei null beginnenden Balken, eine Qualitätsseite, Definitionen und den Datenstand.
      - id: tests-gruen
        text: "`uv run --locked pytest` läuft grün und deckt Einlesen, Regeln, Kennzahlen und Idempotenz ab."
      - id: readme-uebergabe
        text: Das README enthält Zweck, Datenfluss, Aufruf, Kennzahlen-Steckbrief, Datenwörterbuch und bekannte Grenzen; eine zweite Person hat den Lauf allein damit ausgeführt.
    stretch:
      - Baue Import und Bereinigung zusätzlich in Excel mit Power Query nach und gleiche die Summen je Quelle mit der Python-Pipeline ab – zwei unabhängige Wege, die dasselbe ergeben, sind eine starke Prüfung.
      - Plane den Lauf zeitgesteuert und verschicke die Kennzahlen als kurzen Textbericht; die Werkzeuge dafür zeigt der Automation-Bereich unter [Zeitsteuerung](/automation/zeitsteuerung).
      - Ergänze einen Plan-Ist-Vergleich aus einer Planungstabelle mit Monaten als Spalten, die du mit `melt` ins lange Format bringst.
      - Lass die SQL-Analysen zusätzlich gegen PostgreSQL laufen und dokumentiere die Dialektunterschiede, etwa `date_trunc` statt `strftime`.
    portfolio: |
      Beginne mit dem Problem und den Zahlen: zwei Arbeitstage vorher, wenige Minuten Laufzeit nachher, und die Abweichung zwischen Vertrieb und Controlling, die du bis auf einzelne Belege erklärt hast. Zeige dann eine Datenfluss-Skizze, einen Ausschnitt des Qualitätsberichts mit einem gefundenen Fehler, eine der SQL-Analysen mit Fensterfunktion und die erste Berichtsseite. Ein kurzes Video vom Befehl bis zum fertigen Bericht wirkt stärker als jeder Screenshot.

      Im Gespräch zählen deine Abwägungen: Warum SQLite und nicht nur Excel? Warum Quarantäne statt Löschen? Wo rundest du bei brutto → netto und warum? Wie verhinderst du, dass die Märznacht im April landet? Was würdest du bei zehnmal so vielen Daten ändern – eine Datenbank wie PostgreSQL, ein BI-Werkzeug wie Power BI für die Verteilung?

      Sei offen, dass die Daten simuliert sind, und nenne, was bei einem echten Auftraggeber dazukäme: Zugriffsrechte auf die Quellsysteme, Datenschutz für Kundendaten in den Exporten, ein vereinbarter Buchungsschluss. Das README führt in zwei Minuten durch Ausgangslage, Ergebnis in Zahlen, wichtigste Entscheidung und Aufruf.
