id: data
title: Data Analysis mit Excel, SQL und Python
short: Data
tagline: Von Rohdaten zur belastbaren Auswertung – in Excel, SQL und Python.
description: >
  Saubere Tabellen und Datenmodelle, CSV-Import und Bereinigung, Datenqualität und
  deskriptive Statistik. Danach Excel mit Formeln, Tabellen, PivotTables und Power
  Query, SQL für Analysen bis zu Fensterfunktionen und pandas als nächster Schritt.
  Zum Schluss Visualisierung, reproduzierbare Workflows und kleine Automationen.
  SQL-Abfragen und pandas-Code laufen direkt im Browser.
color: "#22D3EE"
order: 7
outcomes:
  - Du baust **saubere Tabellen** mit klarer Granularität und Schlüsseln und erkennst Excel-Listen, die sich nicht auswerten lassen.
  - Du importierst **CSV-Exporte** mit Encoding, Trennzeichen, Dezimalkomma und Datumsformaten korrekt und bereinigst sie nachvollziehbar.
  - Du prüfst **Datenqualität** mit Regeln statt Bauchgefühl und beschreibst Daten mit Lage, Streuung, Quantilen und Ausreißern.
  - Du setzt **Excel professionell** ein – XVERWEIS, SUMMEWENNS, dynamische Arrays, Tabellen, PivotTables und Power Query – und machst Importe mit einem Klick wiederholbar.
  - 'Du schreibst **SQL für Analysen**: Gruppierungen, Joins ohne Doppelzählung, CTEs und Fensterfunktionen für Rangfolgen, laufende Summen und Periodenvergleiche.'
  - Du lädst, bereinigst, verknüpfst und formst Daten mit **pandas** um und wählst Diagramme, die die Frage beantworten.
  - Du baust **reproduzierbare Workflows** vom Rohdatenexport bis zum Bericht und automatisierst wiederkehrende Auswertungen.
tracks:
  - title: Fundament
    description: Tabellen richtig schneiden, Exporte sauber importieren, Qualität prüfen und Daten beschreiben.
    modules: [tabellenmodelle, csv-import, datenqualitaet, deskriptive-statistik]
  - title: Excel professionell
    description: Formeln, die auch nächsten Monat noch stimmen, Tabellen und PivotTables, wiederholbare Importe mit Power Query.
    modules: [excel-formeln, tabellen-pivot, power-query]
  - title: SQL für Analyse
    description: Abfragen, Gruppierung und NULL-Logik, Joins über ein Datenmodell, Fensterfunktionen und typische Analysemuster.
    modules: [sql-abfragen, sql-joins, sql-fensterfunktionen]
  - title: Python & Workflows
    description: pandas als nächster Schritt, Diagramme, die überzeugen, reproduzierbare Pipelines und kleine Automationen.
    modules: [pandas-grundlagen, pandas-auswertung, visualisierung, reproduzierbare-analysen, automationen]
