terms:
  - term: Abgleich
    definition: >-
      Vergleich von Zeilenzahlen, Summen und Schlüsseln einer Auswertung mit den Kontrollwerten des
      Quellsystems, etwa der Summenzeile eines ERP-Exports (englisch *Reconciliation*). Abweichungen
      grenzt man von grob nach fein ein – je Quelle, je Tag, je Beleg –, bis sie erklärt sind.
  - term: Absoluter Bezug
    definition: >-
      Zellbezug mit `$`, der beim Kopieren einer Formel fest bleibt, etwa `$C$1`; gemischte Bezüge wie
      `$A2` oder `A$1` fixieren nur Spalte oder Zeile. Relative Bezüge wie `C1` wandern beim Kopieren mit.
  - term: Analyse-Workflow
    definition: >-
      Die Schrittfolge Frage → Daten → Bereinigen → Prüfen → Auswerten → Kommunizieren. Die meisten
      Fehlanalysen beginnen damit, dass der erste Schritt – eine präzise Frage mit Definition der
      Kennzahl – übersprungen wird.
  - term: Angewendete Schritte
    definition: >-
      Die Liste der Umformungen einer Power-Query-Abfrage in den Abfrageeinstellungen. Jeder Schritt
      ist ein benannter Ausdruck im M-Code, etwa `#"Geänderter Typ mit Gebietsschema"`, und wird beim
      Aktualisieren auf die neuen Daten wiederholt.
  - term: Anti-Join
    definition: >-
      Liefert die Zeilen einer Tabelle, die in einer anderen keinen Partner haben, etwa Kunden ohne
      Bestellung oder Positionen ohne Bestellung. In SQL mit `LEFT JOIN … WHERE rechts.schluessel IS NULL`
      oder `NOT EXISTS`, in Power Query mit der Join-Art „Linker Anti“, in pandas mit
      `merge(…, indicator=True)` und dem Wert `left_only`.
  - term: Ausreißer
    definition: >-
      Wert, der deutlich vom Rest einer Verteilung abweicht; eine übliche Faustregel markiert Werte
      außerhalb von Q1 − 1,5 · IQR und Q3 + 1,5 · IQR. Ob es ein Erfassungsfehler oder eine echte
      Großbestellung ist, entscheidet die fachliche Prüfung, nicht die Formel.
  - term: Backlog
    definition: >-
      Zahl der offenen Vorgänge zu einem Zeitpunkt, etwa offene Support-Tickets am Tagesende (deutsch
      auch Rückstau). Er ergibt sich als laufende Summe aus Eingängen (+1) und Abschlüssen (−1) über
      einen lückenlosen Kalender.
  - term: BOM
    definition: >-
      Byte Order Mark – die unsichtbaren Bytes `EF BB BF` am Anfang mancher UTF-8-Dateien. Wird sie
      nicht erkannt, heißt die erste Spalte plötzlich `ï»¿kunde_id` oder `﻿kunde_id`; Python liest
      solche Dateien mit `encoding="utf-8-sig"` korrekt.
  - term: Copy-on-Write
    definition: >-
      Standardverhalten seit pandas 3.0: Jede Auswahl und jede abgeleitete Tabelle verhält sich wie eine
      Kopie, Änderungen wirken nie auf das Original zurück. Verkettete Zuweisungen wie
      `df[maske]["spalte"] = wert` bleiben deshalb wirkungslos; richtig ist `df.loc[maske, "spalte"] = wert`.
  - term: CSV
    definition: >-
      Textformat mit einem Datensatz je Zeile und Werten, die durch ein Trennzeichen getrennt sind; in
      deutschen Exporten meist das Semikolon, weil das Komma Dezimalzeichen ist. CSV speichert weder
      Datentypen noch Codierung – beides legt man beim Import fest.
  - term: CTE
    definition: >-
      Common Table Expression – eine benannte Zwischenabfrage mit `WITH name AS (…)`, die die folgende
      Abfrage wie eine Tabelle nutzt. CTEs machen Analysen von oben nach unten lesbar; `WITH RECURSIVE`
      erzeugt etwa einen lückenlosen Kalender.
  - term: Dashboard
    definition: >-
      Übersicht, die wenige Kennzahlen mit Kontext – Vergleich zu Vormonat, Vorjahr oder Ziel – und
      erklärende Diagramme auf einer Seite zeigt. Ein gutes Dashboard beantwortet die Fragen einer
      bestimmten Zielgruppe und nennt Definitionen und Datenstand.
  - term: DataFrame
    definition: >-
      Zweidimensionale Tabelle in pandas mit benannten Spalten und einem Index für die Zeilen. Jede
      Spalte ist eine `Series`, eine Folge von Werten eines Datentyps mit demselben Index.
  - term: Datenmodell (Excel)
    definition: >-
      In der Arbeitsmappe gespeicherte Sammlung von Tabellen mit Beziehungen, auf die eine PivotTable
      über mehrere Tabellen hinweg zugreift, ohne `SVERWEIS`-Hilfsspalten. Es ist nicht an die
      Zeilengrenze eines Arbeitsblatts von 1.048.576 Zeilen gebunden.
  - term: Datenqualitätsdimensionen
    definition: >-
      Vollständigkeit, Eindeutigkeit, Gültigkeit, Konsistenz, Genauigkeit und Aktualität. Über
      Prüfregeln wird jede Dimension zu einer Kennzahl, die man Lieferung für Lieferung verfolgt.
  - term: Datenschnitt
    definition: >-
      Filter aus Schaltflächen für PivotTables und intelligente Tabellen in Excel (englisch *Slicer*).
      Ein Datenschnitt kann mehrere PivotTables gleichzeitig filtern; für Datumsfelder gibt es die
      Zeitachse.
  - term: Datenwörterbuch
    definition: >-
      Beschreibung jeder Tabelle und Spalte eines Datensatzes – Bedeutung, Datentyp, Einheit, erlaubte
      Werte, Herkunft und Besonderheiten. Es gehört zur Übergabe einer Analyse wie der Code.
  - term: Dimensionstabelle
    definition: >-
      Tabelle mit beschreibenden Merkmalen, nach denen ausgewertet wird, etwa `kunden` mit Region und
      Segment oder `produkte` mit Kategorie. Sie steht über einen Schlüssel in einer 1:n-Beziehung zur
      Faktentabelle.
  - term: Durchlaufzeit
    definition: >-
      Zeit zwischen Beginn und Ende eines Vorgangs, etwa vom Eingang eines Tickets bis zum Abschluss.
      Offene Vorgänge haben noch keine Durchlaufzeit; ein Durchschnitt nur über abgeschlossene Vorgänge
      fällt deshalb zu günstig aus.
  - term: Dynamisches Array
    definition: >-
      Formelergebnis in Excel, das mehrere Werte liefert und in die Nachbarzellen überläuft, etwa bei
      `EINDEUTIG`, `FILTER` oder `SORTIEREN`; `F2#` meint den ganzen Überlaufbereich, ein blockierter
      Bereich zeigt `#ÜBERLAUF!`. Verfügbar ab Excel 2021 und in Microsoft 365.
  - term: Encoding
    definition: >-
      Zeichencodierung, die festlegt, wie Zeichen als Bytes gespeichert werden. Deutsche Exporte kommen
      meist als UTF-8 oder Windows-1252 (in Python `cp1252`); falsch gelesen entstehen Mojibake oder
      Lesefehler.
  - term: Entpivotieren
    definition: >-
      Umformen vom breiten ins lange Format: Spalten wie `Jan`, `Feb`, `Mrz` werden zu einer Spalte mit
      dem Spaltennamen und einer mit dem Wert. In Power Query „Andere Spalten entpivotieren“
      (`Table.UnpivotOtherColumns`), in pandas `melt`.
  - term: Faktentabelle
    definition: >-
      Tabelle mit Ereignissen oder Messungen auf fester Granularität und Fremdschlüsseln zu den
      Dimensionen, etwa `positionen` mit Menge, Einzelpreis und Rabatt. Ihre Messwerte werden summiert,
      gezählt oder gemittelt.
  - term: Fan-out
    definition: >-
      Vervielfachung von Zeilen durch einen Join, weil ein Schlüssel auf der anderen Seite mehrfach
      vorkommt. Werte der gröberen Tabelle, etwa Versandkosten je Bestellung, werden danach mehrfach
      summiert; Abhilfe ist, vor dem Join auf dieselbe Granularität zu verdichten.
  - term: Fensterfunktion
    definition: >-
      SQL-Funktion mit `OVER (PARTITION BY … ORDER BY …)`, die über verwandte Zeilen rechnet, ohne sie
      zu einer Zeile zu verdichten – anders als `GROUP BY`. Beispiele sind `ROW_NUMBER`, `RANK`, `LAG`
      und `SUM(…) OVER (…)` für laufende Summen und Anteile.
  - term: Fensterrahmen
    definition: >-
      Der Ausschnitt einer Partition, über den eine Fensterfunktion rechnet, etwa
      `ROWS BETWEEN 6 PRECEDING AND CURRENT ROW` für einen gleitenden Durchschnitt. Mit `ORDER BY` und
      ohne Angabe gilt `RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`, das Zeilen mit gleichem
      Sortierwert gemeinsam aufnimmt.
  - term: Fremdschlüssel
    definition: >-
      Spalte, deren Werte auf den Primärschlüssel einer anderen Tabelle verweisen, etwa
      `bestellungen.kunde_id` auf `kunden.kunde_id`. SQLite prüft Fremdschlüssel nur, wenn
      `PRAGMA foreign_keys = ON` gesetzt ist.
  - term: Gebietsschema
    definition: >-
      Regionale Einstellung (englisch *Locale*), die bestimmt, wie Zahlen, Datumswerte und Trennzeichen
      gelesen werden: In Deutsch (Deutschland) ist `1.234,50` eine Zahl und `03.04.2026` der 3. April.
      Power Query nutzt ohne ausdrückliche Angabe die Einstellung des Rechners, deshalb gehört das
      Gebietsschema in den Typ-Schritt.
  - term: Gewichteter Mittelwert
    definition: >-
      Mittelwert, bei dem jeder Wert mit seinem Gewicht zählt, etwa Rabattsätze gewichtet mit dem Umsatz.
      Der ungewichtete Mittelwert von Gruppenmittelwerten – der „Mittelwert der Mittelwerte“ – ist
      falsch, sobald die Gruppen verschieden groß sind.
  - term: Granularität
    definition: >-
      Was genau eine Zeile einer Tabelle darstellt, etwa „eine Position einer Bestellung“. Sie bestimmt,
      welche Spalten man summieren darf und wie Tabellen verknüpft werden müssen.
  - term: Idempotenz
    definition: >-
      Eigenschaft eines Ablaufs, bei wiederholter Ausführung mit denselben Eingaben dasselbe Ergebnis zu
      liefern – ein zweiter Monatslauf erzeugt keine doppelten Zeilen. Erreicht wird sie durch Ersetzen
      statt Anhängen, Schlüssel und ein Protokoll verarbeiteter Dateien.
  - term: Index (pandas)
    definition: >-
      Beschriftung der Zeilen eines DataFrame oder einer Series. pandas richtet Rechnungen zwischen
      Series am Index aus; nach `groupby` enthält er die Gruppenschlüssel, `reset_index()` macht daraus
      wieder Spalten.
  - term: Intelligente Tabelle
    definition: >-
      Mit „Start › Als Tabelle formatieren“ angelegter, benannter Excel-Bereich. Er wächst mit neuen
      Zeilen, erlaubt strukturierte Verweise, berechnete Spalten und eine Ergebniszeile und ist die
      empfohlene Quelle für PivotTables und Power Query.
  - term: Join
    definition: >-
      Verknüpfung zweier Tabellen über einen Schlüssel: `INNER JOIN` behält nur Zeilen mit Partner,
      `LEFT JOIN` alle Zeilen der linken Tabelle. In Power Query heißt das „Abfragen zusammenführen“, in
      pandas `merge`, in Excel-Formeln übernimmt `XVERWEIS` die Rolle.
  - term: Kohorte
    definition: >-
      Gruppe von Kunden mit gemeinsamem Startereignis, etwa dem Monat des Erstkaufs. Kohortenanalysen
      vergleichen, wie sich solche Gruppen über die Zeit verhalten, zum Beispiel die Wiederkaufrate
      innerhalb von 90 Tagen.
  - term: Korrelation
    definition: >-
      Maß für den linearen Zusammenhang zweier Größen zwischen −1 und 1, in Excel `KORREL`, in pandas
      `corr()`. Eine Korrelation belegt keine Ursache – Störgrößen, Selektion oder umgekehrte
      Wirkrichtung können sie erklären.
  - term: Langes Format
    definition: >-
      Tabellenform mit einer Beobachtung pro Zeile, etwa `produkt`, `monat`, `menge`. Das breite Format
      mit Monaten als Spalten ist gut zum Lesen, das lange zum Filtern, Gruppieren und für Diagramme.
  - term: M (Power Query)
    definition: >-
      Die funktionale Formelsprache hinter Power Query. Eine Abfrage ist ein `let … in`-Ausdruck aus
      benannten Schritten, `each` kürzt eine Funktion über die aktuelle Zeile ab; M unterscheidet
      Groß- und Kleinschreibung bei Namen und Textvergleichen.
  - term: Median
    definition: >-
      Der mittlere Wert einer sortierten Reihe, bei gerader Anzahl das Mittel der beiden mittleren. Er
      ist robust gegen Ausreißer und bei schiefen Verteilungen wie Bestellwerten oft aussagekräftiger
      als der Mittelwert.
  - term: Method Chaining
    definition: >-
      Schreibweise in pandas, bei der Umformungen als Kette von Methodenaufrufen stehen, etwa
      `df.query(…).assign(…).groupby(…).agg(…)`. Jeder Schritt liefert ein neues Objekt, die Kette liest
      sich wie eine Pipeline und kommt ohne Zwischenvariablen aus.
  - term: Mojibake
    definition: >-
      Zeichensalat durch eine falsch gewählte Codierung, etwa „KÃ¶ln“, wenn eine UTF-8-Datei als
      Windows-1252 gelesen wird. Behoben wird er beim Import mit der richtigen Codierung, nicht durch
      Ersetzen im Ergebnis.
  - term: "NULL"
    definition: >-
      Markierung für einen fehlenden oder unbekannten Wert in SQL – weder 0 noch leerer Text. Vergleiche
      mit `NULL` ergeben `NULL` (dreiwertige Logik), geprüft wird deshalb mit `IS NULL`; alle
      Aggregatfunktionen außer `COUNT(*)` ignorieren `NULL`.
  - term: PivotTable
    definition: >-
      Excel-Werkzeug, das eine Tabelle nach Zeilen- und Spaltenfeldern gruppiert und Wertfelder
      aggregiert. Es entspricht `GROUP BY` mit bedingter Aggregation in SQL und `pivot_table` in pandas;
      nach Datenänderungen muss es aktualisiert werden.
  - term: Power Query
    definition: >-
      Werkzeug zum Abrufen und Umformen von Daten in Excel und Power BI – Extrahieren, Transformieren,
      Laden (ETL). Die Schritte werden gespeichert und bei „Daten › Alle aktualisieren“ auf neue Daten
      angewendet.
  - term: Primärschlüssel
    definition: >-
      Spalte oder Spaltenkombination, die jede Zeile eindeutig identifiziert, etwa `bestellung_id` oder
      der zusammengesetzte Schlüssel `(bestellung_id, position)`. Er darf weder doppelt noch leer sein.
  - term: Prozentpunkt
    definition: >-
      Einheit für die Differenz zweier Prozentwerte. Steigt eine Quote von 4 % auf 5 %, ist das ein
      Plus von einem Prozentpunkt oder relativ von 25 %.
  - term: Prüfsumme
    definition: >-
      Aus dem Dateiinhalt berechneter Fingerabdruck, etwa SHA-256. Ändert sich ein einziges Byte, ändert
      sich die Prüfsumme – so fällt auf, wenn Rohdaten nachträglich ersetzt oder bearbeitet wurden.
  - term: Quantil
    definition: >-
      Wert, unter dem ein bestimmter Anteil der Daten liegt; Quartile teilen in Viertel, der
      Interquartilsabstand (IQR = Q3 − Q1) misst die Streuung der mittleren Hälfte. Die Methoden
      unterscheiden sich: Excel `QUANTIL.INKL` und pandas `quantile()` interpolieren gleich,
      `statistics.quantiles` nutzt standardmäßig `method='exclusive'`.
  - term: Quarantäne
    definition: >-
      Ablage für Datensätze, die Prüfregeln verletzen, mit Regel-ID und Grund, statt sie still zu
      verwerfen. Der Qualitätsbericht nennt Anzahl und Betrag, und die Zeilen werden an der Quelle
      geklärt.
  - term: Query Folding
    definition: >-
      Übersetzung von Power-Query-Schritten in eine Abfrage der Datenquelle, sodass etwa die Datenbank
      filtert und gruppiert (deutsch Abfragefaltung). CSV- und Excel-Dateien falten nie; dort laufen alle
      Schritte in Power Query selbst.
  - term: Referentielle Integrität
    definition: >-
      Zustand, in dem jeder Fremdschlüssel auf einen existierenden Datensatz zeigt. Verletzungen – Waisen
      wie Positionen ohne Bestellung – findet ein Anti-Join.
  - term: Reproduzierbarkeit
    definition: >-
      Gleiche Eingaben liefern mit demselben Code dasselbe Ergebnis, auch Monate später und auf einem
      anderen Rechner. Dazu gehören unveränderte Rohdaten, Parameter wie der Stichtag statt `today()`,
      eindeutige Sortierung, feste Zeitzonen und eine festgehaltene Umgebung, etwa per `uv.lock`.
  - term: Semi-Join
    definition: >-
      Liefert die Zeilen einer Tabelle, die mindestens einen Partner in einer anderen haben, jede nur
      einmal – etwa Kunden mit mindestens einer Zubehörbestellung. In SQL mit `WHERE EXISTS (…)`.
  - term: Simpson-Paradoxon
    definition: >-
      Ein Zusammenhang, der in jeder Teilgruppe gilt, kehrt sich im Gesamtwert um, weil die Gruppen
      unterschiedlich groß oder zusammengesetzt sind. Gesamtquoten vergleicht man deshalb nur mit Blick
      auf die Zusammensetzung.
  - term: Small Multiples
    definition: >-
      Reihe kleiner Diagramme gleicher Bauart und gleicher Skala, eines je Gruppe, etwa der Monatsumsatz
      je Region. Sie ersetzen ein überladenes Diagramm mit vielen Linien.
  - term: Standardabweichung
    definition: >-
      Maß für die Streuung um den Mittelwert. `STABW.S` und pandas `std()` teilen durch n − 1
      (Stichprobe), `STABW.N` und NumPy `np.std` durch n (Grundgesamtheit).
  - term: Sternschema
    definition: >-
      Datenmodell mit einer Faktentabelle in der Mitte und Dimensionstabellen ringsum, jeweils über
      1:n-Beziehungen verbunden. Es ist die übliche Form für Auswertungen in SQL, im Excel-Datenmodell und
      in Power BI.
  - term: Strukturierter Verweis
    definition: >-
      Bezug auf Teile einer intelligenten Tabelle über Namen statt Zelladressen, etwa `Umsatz[Betrag]`
      für die Spalte oder `[@Menge]` für die aktuelle Zeile. Er passt sich an, wenn die Tabelle wächst.
  - term: Tidy Data
    definition: >-
      Tabellenform, in der jede Variable eine Spalte, jede Beobachtung eine Zeile und jede Art von
      Beobachtungseinheit eine eigene Tabelle ist. In dieser Form funktionieren Filtern, Gruppieren und
      Verknüpfen ohne Umbau.
  - term: Typaffinität
    definition: >-
      In SQLite hat jeder Wert seinen eigenen Speichertyp; der deklarierte Spaltentyp ist nur eine
      Empfehlung. Ein Text wie `'12,5'` bleibt in einer `REAL`-Spalte Text; `STRICT`-Tabellen (seit
      SQLite 3.37) erzwingen die deklarierten Typen.
