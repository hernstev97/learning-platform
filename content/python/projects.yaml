projects:
- id: ausgaben-cli
  title: Ausgaben im Terminal
  level: 1
  hours: 8
  summary: Ein lokales CLI erfasst Ausgaben und erstellt nachvollziehbare Monatsberichte.
  brief: '## Auftrag

    Du möchtest Ausgaben aus Testdaten erfassen, suchen und nach Monat zusammenfassen. Baue ein CLI mit
    den Unterbefehlen `add`, `list` und `report`. Eine Ausgabe hat eine stabile ID, ein Datum, eine Kategorie
    und einen Betrag in Cent. Verwende zunächst eine JSON-Datei; persönliche Finanzdaten brauchst du nicht.


    ## Vertrag

    `add` nimmt nur positive Beträge und gültige Datumswerte an. `list` liefert eine stabile Reihenfolge.
    `report` summiert pro Kategorie und Monat. Fehler gehen auf stderr und setzen einen Fehlercode; stdout
    bleibt für das Ergebnis nutzbar. Ein fehlerhafter Eingabedatensatz darf eine vorhandene Datei nicht
    beschädigen. Fange gezielt die Fehler ab, für die du eine verständliche Meldung anbieten kannst.


    ## Voraussetzungen

    Der Python-Pfad erklärt `argparse` nicht. Arbeite vorher das Modul [CLI-Werkzeuge](/automation/cli-werkzeuge)
    aus dem Automation-Pfad durch: Unterbefehle, `stdout` und `stderr`, Exit-Codes. Für JSON und `pathlib` hilft
    [Strings, Encodings und Dateien](/python/strings-dateien), für die Tests [Testen mit pytest](/python/testen-pytest).


    ## Vor dem Schreiben

    Lege drei Beispielaufrufe samt Ausgabe und zwei Fehlersituationen fest. Entscheide, wie du eine beschädigte
    Datei behandelst: eine klare Fehlermeldung schützt Daten besser als stilles Ersetzen durch eine leere
    Liste.'
  skills:
  - argparse
  - JSON
  - pathlib
  - Fehlerbehandlung
  - pytest
  steps:
  - id: schritt-1
    title: CLI-Vertrag beschreiben
    detail: Schreibe die Hilfe und je einen Erfolgs- und Fehleraufruf pro Unterbefehl. Trenne Präsentation
      und Berechnung. Unterbefehle, Exit-Codes und die Trennung von `stdout` und `stderr` erklärt das Modul
      [CLI-Werkzeuge](/automation/cli-werkzeuge).
  - id: schritt-2
    title: Datenmodell festlegen
    detail: Nutze Ganzzahlen für Cent und parse Datumswerte. Dokumentiere Währung und Rundungsregeln statt
      implizit floats zu addieren.
  - id: schritt-3
    title: Lesen und Validieren
    detail: Lade Testdaten und melde beschädigtes JSON mit Pfad und Ursache. Verändere die Quelldatei
      bei Lesefehlern nicht.
  - id: schritt-4
    title: Sicher speichern
    detail: Schreibe zuerst eine temporäre Datei im Zielverzeichnis und ersetze die Zieldatei nach Erfolg.
      Teste den Fehler vor dem Ersetzen.
  - id: schritt-5
    title: Berichte entwickeln
    detail: Berechne Monats- und Kategoriesummen in reinen Funktionen. Definiere den Bericht für einen
      leeren Monat.
  - id: schritt-6
    title: Grenzen testen und dokumentieren
    detail: Teste ungültiges Datum, leere Daten, mehrere Kategorien und einen wiederholten Aufruf. Dokumentiere
      die Einprozess-Annahme.
  acceptance:
  - id: abnahme-1
    text: Alle Beispieldaten sind erfunden und das Repository enthält keine privaten Ausgaben.
  - id: abnahme-2
    text: Summen werden exakt in Cent berechnet.
  - id: abnahme-3
    text: Bei ungültigem JSON bleibt die Originaldatei unverändert.
  - id: abnahme-4
    text: Ein neuer Checkout kann Tests und Beispielaufrufe anhand der README ausführen.
  stretch:
  - Persistenz durch SQLite ersetzen, ohne die Berichtsfunktion umzuschreiben.
  - CSV-Export mit dokumentiertem Trennzeichen hinzufügen.
  portfolio: Zeige einen kompletten Terminalablauf mit Beispielwerten und erkläre, warum Geld als Cent
    gespeichert wird. Hebe einen Test hervor, der eine beschädigte Datei vor Überschreiben schützt.
  capstone: false
- id: text-abenteuer
  title: Ein kleines Abenteuer als Zustandsmaschine
  level: 1
  hours: 10
  summary: Ein textbasiertes Spiel trainiert Datenmodell, Zustandsübergänge und isolierte Tests.
  brief: '## Auftrag

    Baue ein kleines textbasiertes Abenteuer mit drei Räumen, zwei Gegenständen und einem klaren Ziel.
    Das Terminal nimmt Befehle entgegen; die Spiellogik erhält dagegen nur einen Zustand und einen Befehl.
    So lässt sie sich ohne interaktives `input()` testen.


    ## Fachliche Regeln

    Eine verschlossene Tür lässt sich erst mit dem Schlüssel öffnen. Gegenstände können höchstens einmal
    aufgenommen werden. Unbekannte Befehle liefern eine hilfreiche Meldung und verändern den Zustand nicht.
    Ein gespeicherter Spielstand muss beim Laden auf gültige Räume und Werte geprüft werden. Die Geschichte
    bleibt klein: Der Lernwert liegt in erklärbaren Übergängen, nicht in vielen Dialogen.'
  skills:
  - Dataclasses
  - Enums
  - Komposition
  - Zustandsmodell
  - Tests
  steps:
  - id: schritt-1
    title: Zustandsdiagramm skizzieren
    detail: Notiere Räume, Übergänge und Vorbedingungen. Markiere, welche Ereignisse den Zustand verändern.
  - id: schritt-2
    title: Modell implementieren
    detail: Wähle Dataclasses für Zustand und Ergebnisse. Trenne feste Weltbeschreibung vom Spielstand.
  - id: schritt-3
    title: Befehle parsen
    detail: Übersetze Eingabetext in bekannte Befehle. Der Parser benötigt weder Terminal noch Dateisystem.
  - id: schritt-4
    title: Übergänge implementieren
    detail: Ein zentraler Vertrag liefert Folgezustand und Meldung. Prüfe die Tür-Vorbedingung an einer
      Stelle.
  - id: schritt-5
    title: Speichern und Laden
    detail: Versioniere das Format. Weise ungültige Zustände zurück, statt Attribute beliebig zu übernehmen.
  - id: schritt-6
    title: Szenarien testen
    detail: Spiele Siegpfad, falsche Reihenfolge, doppelte Aufnahme und Laden ungültiger Daten mit automatischen
      Tests durch.
  acceptance:
  - id: abnahme-1
    text: Alle fachlichen Tests laufen ohne Terminaleingabe.
  - id: abnahme-2
    text: Unbekannte Befehle verändern den Zustand nicht.
  - id: abnahme-3
    text: Der vollständige Siegpfad hat einen Regressionstest.
  - id: abnahme-4
    text: README erklärt das Zustandsmodell und zeigt einen reproduzierbaren Ablauf.
  stretch:
  - Eine rückgängig machbare Aktion modellieren.
  - Eine zweite Benutzeroberfläche auf dieselbe Spiellogik setzen.
  portfolio: Erkläre am Türbeispiel, wo eine Invariante geprüft wird. Zeige, wie die Trennung von UI und
    Logik Tests ermöglicht; eine komplexe Klassenhierarchie ist kein Qualitätsziel.
  capstone: false
- id: import-pipeline
  title: Verlässlicher Datenimport
  level: 2
  hours: 18
  summary: Eine Pipeline vereinigt CSV und JSON, validiert Datensätze und erzeugt einen SQLite-Bericht.
  brief: '## Auftrag

    Ein Team erhält Tickets als CSV-Export und JSON-Liste. Baue ein lokales Importwerkzeug, das beide
    Formate in ein gemeinsames Modell überführt und einen Bericht über offene Tickets nach Team und Priorität
    erzeugt. Verwende ausschließlich bereitgestellte Beispieldaten.


    ## Fachliche Regeln

    Jeder Datensatz hat eine externe ID, Quelle, Titel, Status und Zeitstempel. `Quelle + externe ID`
    ist die Identität. Ein erneuter Import derselben Datei erzeugt keine Duplikate. Ungültige Zeilen landen
    mit Fehlergrund in einem Fehlerbericht. Lege fest, ob gültige Zeilen trotz ungültiger Nachbarn importiert
    werden; dokumentiere diesen Vertrag. Gib Importstatistik und Bericht getrennt aus.


    ## Grenzen

    Keine Live-API ist notwendig. Die Datenbank ist eine lokale Datei. Arbeitest du mit Transaktionen,
    entscheide, welche Änderungen zusammengehören und wann ein erneuter Lauf einen vorherigen Fehler fortsetzen
    kann.'
  skills:
  - csv
  - json
  - sqlite3
  - Iteratoren
  - Typisierung
  - Idempotenz
  steps:
  - id: schritt-1
    title: Beispieldaten und Verträge
    detail: Erzeuge Normalfälle, fehlende Felder, doppelte IDs und ungültige Zeitstempel. Lege die Normalform
      fest.
  - id: schritt-2
    title: Adapter trennen
    detail: Je ein Parser liest CSV oder JSON. Nach außen liefern beide denselben typisierten Datensatz
      oder einen Fehler.
  - id: schritt-3
    title: Validierung zentralisieren
    detail: Prüfe Pflichtfelder, Statuswerte und Datumsformat unabhängig vom Eingabeformat.
  - id: schritt-4
    title: Persistenz modellieren
    detail: Definiere einen eindeutigen Schlüssel. Verwende SQL-Parameter und explizite Transaktionsgrenzen.
  - id: schritt-5
    title: Wiederholungen beherrschen
    detail: Importiere dieselbe Datei zweimal. Zähler unterscheiden neu, aktualisiert, unverändert und
      verworfen.
  - id: schritt-6
    title: Bericht aufbauen
    detail: Berichte aus gespeicherten Daten. Definiere Sortierung und Ausgabe bei leerer Datenbank.
  - id: schritt-7
    title: Fehlerfälle prüfen
    detail: Simuliere Abbruch vor Commit und ungültige Quelldaten. Prüfe, dass ein Wiederanlauf den Vertrag
      erhält.
  - id: schritt-8
    title: Betriebsweg dokumentieren
    detail: Beschreibe Import, Bericht, Datensicherung und Wiederherstellung mit erfundenem Beispielbestand.
  acceptance:
  - id: abnahme-1
    text: Wiederholter Import erzeugt keine zusätzlichen Datensätze.
  - id: abnahme-2
    text: Alle SQL-Werte werden parametrisiert.
  - id: abnahme-3
    text: Ungültige Zeilen sind mit Quelle und Fehlergrund nachvollziehbar.
  - id: abnahme-4
    text: Ein Integrationstest nutzt eine isolierte temporäre SQLite-Datei.
  - id: abnahme-5
    text: Der Bericht hat deterministische Reihenfolge und überprüfbare Summen.
  stretch:
  - Streaming-Import für große CSV-Dateien messen.
  - Eine Schemaänderung mit Migration und Test einführen.
  portfolio: Zeige eine fehlerhafte Eingabe und den daraus entstandenen Fehlerbericht. Erkläre den eindeutigen
    Schlüssel, Transaktionsgrenzen und eine gemessene Speicher- oder Laufzeiteigenschaft.
  capstone: false
- id: abschluss-ticket-api
  title: 'Team-Tickets: eine wartbare REST-API'
  level: 3
  hours: 46
  summary: Eine Take-Home-Aufgabe verbindet Datenmodell, HTTP-Vertrag, Persistenz, Tests, Logging und ein installierbares
    Wheel.
  brief: '## Auftrag

    Ein kleines Supportteam verwaltet seine Tickets bislang in einer Tabelle. Du lieferst eine HTTP-API,
    mit der ein interner Client Tickets anlegt, nach Status filtert, paginiert auflistet und abschließt.
    Eine Browseroberfläche ist nicht Teil des Auftrags. Zeige einen wartbaren vertikalen Ablauf, den ein
    anderes Teammitglied anhand deiner README ausführen kann.


    ## Fachliche Anforderungen

    Ein Ticket hat ID, Titel, Beschreibung, Status (`open`, `in_progress`, `done`) und Erstellzeit. Titel
    müssen nach Trimmen 1–120 Zeichen lang sein. Ein erledigtes Ticket kann erneut geöffnet werden; Übergänge
    werden mit Zeitstempel protokolliert. Listen haben stabile Sortierung, Filter und begrenzte Seitengröße.
    Unbekannte IDs liefern 404, ungültige Eingaben verständliche Validierungsfehler. Die API benötigt
    einen konfigurierten API-Schlüssel; verwende in Tests einen ausdrücklich erfundenen Wert.


    ## Technischer Rahmen

    Nutze FastAPI und Pydantic für den HTTP-Vertrag, SQLAlchemy mit SQLite für den ersten Betrieb und
    pytest für Unit- und API-Tests. Lege Abhängigkeiten mit uv fest. ruff und mypy gehören zu den Qualitätsprüfungen.
    Ein Dockerfile und eine CI-Datei machen Installation und Prüfung wiederholbar. Halte HTTP, fachliche
    Übergänge und Datenzugriff getrennt, ohne ein allgemeines Framework daraus zu bauen. Das Modul
    [Web & Datenbanken](/python/web-datenbanken) erklärt FastAPI, Pydantic und SQLAlchemy an genau diesem
    Ticket-Beispiel.


    ## Entscheidungen statt versteckter Annahmen

    Dokumentiere Zeitzonen, Löschverhalten, API-Schlüssel-Verwaltung, Transaktionsgrenzen und die Grenzen
    eines gemeinsamen Team-Schlüssels. Das Projekt simuliert einen internen Dienst, kein fertiges Mehrmandantensystem.
    Nutze Testdaten; Schlüssel gehören nicht ins Repository. Die automatischen API-Tests laufen lokal
    mit TestClient und einer isolierten Datenbank.


    ## Logging und Auslieferung

    Die Anwendung konfiguriert Logging einmal beim Start mit `logging.config.dictConfig`. Bibliothekscode
    holt sich nur `logging.getLogger(__name__)`. Logzeilen zu einem Ticket tragen die Ticket-ID als Kontext
    (`extra`). Der API-Schlüssel steht in keiner Logzeile. Außerdem erzeugt `uv build` ein Wheel, das sich
    in einer frischen virtuellen Umgebung installieren und starten lässt. CI baut es und legt es als Artefakt
    ab.


    ## Vorbereitung im Kurs

    - FastAPI, Pydantic, SQLAlchemy und `TestClient`: [Web & Datenbanken](/python/web-datenbanken)

    - Logging und Modulstruktur: [Fehlerbehandlung, Module & Logging](/python/fehler-module)

    - Lockfile, Wheel und `pyproject.toml`: [Tooling & Packaging](/python/tooling-packaging)

    - Eine Eigenschaft messen statt raten: [Performance](/python/performance)

    - Unit- und API-Tests: [Testen mit pytest](/python/testen-pytest)


    ## Abgabe

    Repository, README, OpenAPI-Schema und ein kurzer Terminal-Screencast reichen. Führe in fünf Minuten
    vom frischen Checkout über einen Fehlerfall bis zum abgeschlossenen Ticket. Beantworte, was du bei
    wachsender Nutzerzahl zuerst messen würdest, und belege eine Eigenschaft mit einer echten Messung.


    Offizielle Grundlagen: [FastAPI](https://fastapi.tiangolo.com/tutorial/), [API-Tests](https://fastapi.tiangolo.com/tutorial/testing/),
    [Pydantic](https://docs.pydantic.dev/latest/concepts/models/), [SQLAlchemy](https://docs.sqlalchemy.org/en/20/tutorial/),
    [uv-Projekte](https://docs.astral.sh/uv/guides/projects/), [Logging Cookbook](https://docs.python.org/3/howto/logging-cookbook.html)
    und [Pakete bauen mit uv](https://docs.astral.sh/uv/guides/package/).'
  skills:
  - FastAPI
  - Pydantic
  - SQLAlchemy
  - SQLite
  - pytest
  - mypy
  - ruff
  - uv
  - CI
  - Logging
  - Wheel
  steps:
  - id: schritt-1
    title: Vertrag als Beispiele
    detail: Schreibe Request-/Response-Beispiele für Anlegen, Listen, Statuswechsel, fehlenden Schlüssel
      und ungültigen Titel. Entscheide Sortierung und Seitengrenzen.
  - id: schritt-2
    title: Projekt reproduzierbar starten
    detail: Lege pyproject.toml, Lockfile, Quelllayout und Teststruktur an. Notiere eine unterstützte
      Python-Version und alle Startbefehle.
  - id: schritt-3
    title: Fachmodell und Übergänge
    detail: Implementiere Statusregeln unabhängig von HTTP. Schreibe Tests für erlaubte und ungültige
      Übergänge, ohne die Implementierung nachzubauen.
  - id: schritt-4
    title: Persistenz und Migration
    detail: Definiere Tabellen und Schlüssel. Füge einen nachvollziehbaren Weg zum Initialisieren und
      späteren Ändern des Schemas hinzu.
  - id: schritt-5
    title: API-Schicht anbinden
    detail: Validiere Eingaben mit klaren Grenzen, trenne Antwortmodelle von internen Daten und übersetze
      fachliche Fehler gezielt in HTTP-Antworten.
  - id: schritt-6
    title: Authentifizierung ergänzen
    detail: Lies den erwarteten API-Schlüssel aus Konfiguration. Prüfe fehlende und falsche Schlüssel,
      vermeide Logging von Headern mit Geheimnissen.
  - id: logging-konfigurieren
    title: Logging einmal konfigurieren
    detail: 'Rufe `logging.config.dictConfig` genau einmal beim Start auf, nicht in Modulen. Jedes Modul
      nutzt `logging.getLogger(__name__)`. Hänge die Ticket-ID mit `extra={"ticket_id": ...}` an Logzeilen
      zum Statuswechsel; ein Filter setzt einen Standardwert, damit das Format auch Zeilen ohne ID ausgeben
      kann. Lege fest, was nie ins Log gehört: der API-Schlüssel und Header. Prüfe mit `caplog`, dass die
      Ticket-ID im Log steht und der Testschlüssel nicht. Grundlagen: [Fehlerbehandlung, Module & Logging](/python/fehler-module)
      und das [Logging Cookbook](https://docs.python.org/3/howto/logging-cookbook.html).'
  - id: schritt-7
    title: Liste und Transaktion prüfen
    detail: Teste Filter, maximale Seitengröße und stabile Sortierung. Statusänderung und Protokolleintrag
      müssen gemeinsam gespeichert werden. Miss eine Eigenschaft der Liste, etwa die Zahl der SQL-Abfragen
      pro Anfrage oder die Laufzeit bei 10 000 Tickets, und halte Zahl und Messweg fest. Das Vorgehen
      zeigt das Modul [Performance](/python/performance).
  - id: schritt-8
    title: Tests und Typprüfung schließen
    detail: Unit-Tests prüfen Regeln, API-Tests den HTTP-Vertrag, Persistenztests Commit/Rollback. Nutze
      Fixtures für Isolation; führe mypy und ruff aus.
  - id: wheel-bauen
    title: Wheel bauen und prüfen
    detail: 'Lege in `pyproject.toml` Name, Version, Beschreibung, `requires-python` und Abhängigkeiten
      fest. `uv build` erzeugt Wheel und Quelldistribution in `dist/`. Öffne das Wheel (es ist ein ZIP-Archiv)
      und prüfe, dass Paketcode, Versionsangabe und Metadaten enthalten sind, aber keine Zugangsdaten. Installiere
      es in einer frischen virtuellen Umgebung außerhalb des Repositorys und starte die App oder importiere
      das Paket dort. Prüfe die Abhängigkeiten außerdem auf bekannte Sicherheitslücken, etwa mit [pip-audit](https://pypi.org/project/pip-audit/).
      Grundlagen: [Tooling & Packaging](/python/tooling-packaging) und [Pakete bauen mit uv](https://docs.astral.sh/uv/guides/package/).'
  - id: schritt-9
    title: CI und Container bauen
    detail: Die Pipeline installiert aus dem Lockfile, führt Prüfungen aus, baut das Wheel mit `uv build`
      und lädt `dist/` als Artefakt hoch. Der Container erhält Konfiguration zur Laufzeit; keine echten Zugangsdaten
      ins Image schreiben.
  - id: schritt-10
    title: Abnahme und Übergabe
    detail: Lass eine andere Person oder ein frisches Verzeichnis nur nach README starten. Ergänze Entscheidungen,
      Grenzen, Backupweg und ein kurzes Betriebsbeispiel.
  acceptance:
  - id: abnahme-1
    text: Ein frischer Checkout lässt sich mit dokumentierten Befehlen installieren, testen und starten.
  - id: abnahme-2
    text: Anlegen, Filtern, Paginieren, Abschließen und Wiederöffnen sind per API getestet.
  - id: abnahme-3
    text: Fehlender/falscher Schlüssel wird abgelehnt; kein echter Schlüssel ist eingecheckt oder geloggt.
  - id: abnahme-4
    text: Ungültige Eingaben liefern verständliche 4xx-Antworten statt interner Tracebacks.
  - id: abnahme-5
    text: Statuswechsel und Protokolleintrag sind atomar und durch einen Fehlerfalltest abgesichert.
  - id: abnahme-6
    text: pytest, ruff und mypy laufen in CI erfolgreich.
  - id: abnahme-7
    text: API-Tests verwenden eine isolierte Datenbank und benötigen keine externen Dienste.
  - id: abnahme-8
    text: OpenAPI, README und Beispielaufrufe stimmen mit dem ausgelieferten Verhalten überein.
  - id: abnahme-9
    text: Containerstart, Datensicherung und Wiederherstellung sind dokumentiert und einmal durchgeführt.
  - id: logging-strukturiert
    text: Die Anwendung konfiguriert Logging einmal per `dictConfig`, Bibliothekscode nutzt `getLogger(__name__)`,
      Logzeilen zu einem Ticket tragen die Ticket-ID per `extra`, und weder API-Schlüssel noch Header stehen
      im Log. Ein Test belegt das mit `caplog`.
  - id: wheel-gebaut
    text: '`uv build` erzeugt Wheel und Quelldistribution. Das Wheel enthält Paketcode, Versionsangabe und
      Metadaten. Es lässt sich in einer frischen virtuellen Umgebung installieren, und Start oder Import funktionieren
      dort. CI baut es und legt es als Artefakt ab.'
  stretch:
  - PostgreSQL als Alternative ergänzen und Unterschiede in Transaktions- und Nebenläufigkeitsverhalten
    testen.
  - Cursor-Paginierung gegen sich ändernde Daten erproben.
  - Individuelle Benutzer und Berechtigungen als getrennte Erweiterung entwerfen.
  portfolio: Präsentiere zuerst den Nutzerablauf und einen abgefangenen Fehler. Erkläre dann zwei Entscheidungen
    mit Alternativen, etwa SQLite vs. PostgreSQL und gemeinsamer Schlüssel vs. Benutzerkonten. Zeige einen
    Test, der einen echten Fehler verhindert hat, eine Logzeile mit Ticket-ID (ohne Schlüssel), das installierte
    Wheel in einer frischen Umgebung und eine gemessene Eigenschaft mit Zahl. Benenne den Umfang eigener Arbeit und verwendete Hilfsmittel
    ehrlich.
  capstone: true
