id: performance
title: Performance – messen, finden, beschleunigen
level: 3
minutes: 180
summary: Python-Code erst messen und dann gezielt beschleunigen. Profile lesen, Speicher untersuchen, teure Muster erkennen und entscheiden, wann NumPy oder eine native Erweiterung den Aufwand wert ist.
goals:
  - Du liest eine `cProfile`-Ausgabe und unterscheidest `tottime` von `cumtime`, `ncalls` und `percall`.
  - Du misst Laufzeiten mit `timeit.repeat`, nimmst das Minimum statt des Mittelwerts und erkennst typische Messfehler.
  - Du findest Speicherfresser mit `tracemalloc`, erklärst, warum `sys.getsizeof` nur die flache Größe zeigt, und beurteilst `__slots__`.
  - Du ersetzt teure Muster durch bessere. Das sind `in` auf Listen, schrittweise Strings, volles Sortieren für Top-k, unnötige Kopien und Listen statt Generatoren.
  - Du entscheidest mit dem Amdahl-Gedanken, ob Vektorisierung, Cython oder Rust-Bindings sich lohnen, und wählst erst danach die Technik.
