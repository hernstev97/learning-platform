- id: erschoepft
  type: output
  title: Einmal durchlaufen
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    werte = iter([3, 7, 9])
    print(next(werte))
    print(list(werte))
    print(list(werte))
  expected: |-
    3
    [7, 9]
    []
  explanation: next nimmt den ersten Wert aus dem Strom. list verbraucht anschließend den Rest; ein zweiter Aufruf
