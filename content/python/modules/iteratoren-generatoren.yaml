- id: yield-zeit
  type: output
  title: Wann läuft der Körper?
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    def liefern():
        print("innen")
        yield 8
    strom = liefern()
    print("außen")
    print(next(strom))
  expected: |-
    außen
    innen
    8
  explanation: Der Generatoraufruf erstellt zunächst das Objekt. Erst next betritt den Funktionskörper und erreicht
    yield.
  resources:
