  type: choice
  title: Wer hält die Position?
  prompt: Welche Aussage stimmt?
  options:
  - text: Eine Liste kann mehrere unabhängige Iteratoren liefern.
    correct: true
    why: Jeder Aufruf von iter(liste) erzeugt einen eigenen Cursor.
  - text: iter(iterator) setzt ihn zurück.
    correct: false
    why: Ein Iterator liefert sich selbst zurück.
  - text: Jeder Generator speichert alle Ergebnisse.
    correct: false
    why: Er berechnet sie erst beim Verbrauch.
  explanation: Iterable und Iterator sind Rollen mit verschiedenen Garantien. Insbesondere gehört Wiederholbarkeit
    nicht zum Iterator-Protokoll.
