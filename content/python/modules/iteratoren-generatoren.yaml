- id: grenze
  type: code
  title: Nur so viel wie nötig
  prompt: Implementiere `erste(werte, n)` mit `itertools.islice`; gib eine Liste mit höchstens `n` Werten zurück.
    Für `n=0` darf die Quelle nicht angerührt werden; n ist nichtnegativ.
  lang: python
  starter: |-
    def erste(werte, n):
        ...
  solution: |-
    from itertools import islice
    def erste(werte, n):
        return list(islice(werte, n))
  tests:
  - name: Zwei
    code: assert erste(iter([4, 5, 6]), 2) == [4, 5]
  - name: Kurze Quelle
    code: assert erste([1], 4) == [1]
  - name: Null liest nichts
    code: |-
      def verboten():
          raise AssertionError("Quelle wurde gelesen")
          yield
      assert erste(verboten(), 0) == []
  - name: Begrenzt
    code: |-
      def begrenzt():
          yield 1
          yield 2
          raise AssertionError("zu weit gelesen")
      assert erste(begrenzt(), 2) == [1, 2]
  explanation: islice beendet das Anfordern genau an der Grenze. Eine vorherige Umwandlung der gesamten Quelle in
    list würde den Streaming-Vertrag verletzen.
  resources:
  - *id001
- id: doppelter-verbrauch
  type: bug
  title: Der zweite Wert fehlt
  prompt: Die Funktion soll dieselben Werte zweimal liefern. Mit iter([1, 2]) ist die zweite Liste leer. Korrigiere
    die Vorbereitung durch einmalige Materialisierung.
  lang: python
  code: |-
    def zweimal(quelle):
        daten = iter(quelle)
        return list(daten), list(daten)
  lines:
  - 2
  fix:
  - line: 2
    answers:
    - daten = list(quelle)
  explanation: Ein Iterator kann nur vorwärts gelesen werden. Hier verlangt der Vertrag Wiederverwendung, also speichern
    wir bewusst die Werte in einer Liste.
  resources:
  - *id001
- id: ressourcen
  type: explain
  title: Wer hält die Datei offen?
  prompt: Erkläre den Lebenszyklus und das Problem bei einem frühen Abbruch.
  lang: python
  code: |-
    def zeilen(pfad):
        with open(pfad, encoding="utf-8") as datei:
            yield from datei
  points:
  - Die Datei wird erst beim ersten Verbrauch geöffnet.
  - Während der Unterbrechung am yield bleibt with aktiv.
  - Vollständiger Verbrauch oder explizites Schließen beendet den Kontext.
  - Ein früh abbrechender Verbraucher braucht eine klare Schließungsstrategie.
  explanation: Die Generatorfunktion besitzt die Datei. Beim yield pausiert sie innerhalb des with-Blocks; ein break
    des Verbrauchers schließt einen weiterhin referenzierten Generator nicht automatisch. Eine explizite Lebensdauer
    mit closing oder ein Verbraucher innerhalb des Dateikontexts vermeidet offene Ressourcen.
  resources:
  - *id001
- id: log-pipeline
  type: practice
  title: Ein begrenzter Fehlerbericht
  prompt: Baue lokal eine Pipeline, die eine UTF-8-Logdatei liest und höchstens zehn ERROR-Zeilen mit Zeilennummer
    ausgibt. Erzeuge zum Prüfen selbst eine kleine Datei.
  lang: python
  solution: |-
    from itertools import islice
    from pathlib import Path

    def fehler(zeilen):
        for nummer, zeile in enumerate(zeilen, 1):
            if zeile.startswith("ERROR"):
                yield nummer, zeile.rstrip()

    with Path("app.log").open(encoding="utf-8") as datei:
        for nummer, text in islice(fehler(datei), 10):
            print(nummer, text)
  checklist:
  - Datei bleibt bis zum Ende des Verbrauchs geöffnet.
  - Filterung geschieht vor der Begrenzung auf zehn Treffer.
  - Keine Liste der ganzen Datei wird aufgebaut.
  - Leere Datei und Datei ohne Fehler erzeugen keine Ausgabe.
  explanation: Die Pipeline verarbeitet nur so viele Zeilen, bis zehn Treffer vorliegen oder die Datei endet. Der
    äußere with-Block macht den Ressourcenbesitz am aufrufenden Code sichtbar.
  resources:
  - *id001
