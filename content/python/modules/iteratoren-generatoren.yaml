- id: positive
  type: code
  title: Nur positive Werte
  prompt: Schreibe den Generator `positive(werte)`. Er liefert positive Zahlen in Eingabereihenfolge und funktioniert
    auch mit einem Iterator.
  lang: python
  starter: |-
    def positive(werte):
        ...
  solution: |-
    def positive(werte):
        for wert in werte:
            if wert > 0:
                yield wert
  tests:
  - name: Mischung
    code: assert list(positive([-2, 0, 3, 1])) == [3, 1]
  - name: Leer
    code: assert list(positive([])) == []
  - name: Iterator
    code: assert list(positive(iter([4, -1, 5]))) == [4, 5]
  - name: Generator
    code: g = positive([1]); assert iter(g) is g
  explanation: yield erzeugt Werte ohne eine Ergebnisliste anzulegen. Die for-Schleife verlangt nur Iterierbarkeit,
    keinen Indexzugriff.
  resources:
  - *id001
- id: bloecke
  type: code
  title: Import in Portionen
  prompt: Schreibe `bloecke(werte, groesse)` als Generator von Listen. Der letzte Block darf kürzer sein. Bei `groesse
    < 1` soll beim Verbrauch `ValueError` entstehen.
  lang: python
  starter: |-
    def bloecke(werte, groesse):
        ...
  solution: |-
    def bloecke(werte, groesse):
        if groesse < 1:
            raise ValueError("groesse muss positiv sein")
        block = []
        for wert in werte:
            block.append(wert)
            if len(block) == groesse:
                yield block
                block = []
        if block:
            yield block
  tests:
  - name: Rest
    code: assert list(bloecke(range(5), 2)) == [[0, 1], [2, 3], [4]]
  - name: Leer
    code: assert list(bloecke([], 3)) == []
  - name: Einzeln
    code: assert list(bloecke(iter([8, 9]), 1)) == [[8], [9]]
  - name: Ungültig
    code: |-
      try:
          list(bloecke([1], 0))
      except ValueError:
          pass
      else:
          assert False, "groesse=0 muss scheitern"
  explanation: Nach yield entsteht eine neue Liste. Würdest du dieselbe Liste mit clear leeren, sähen frühere Verbraucher
    später ebenfalls die geleerten Daten.
  resources:
  - *id001
