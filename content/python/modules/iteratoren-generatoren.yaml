id: iteratoren-generatoren
title: Iteratoren & Generatoren
level: 2
minutes: 150
summary: 'Datenströme schrittweise verarbeiten, ohne sie unnötig zu materialisieren: Iterator-Protokoll, yield,
  Generatorausdrücke und itertools.'
goals:
- Du unterscheidest ein Iterable von einem zustandsbehafteten Iterator.
- Du erklärst verzögerte Auswertung, Erschöpfung und den Zeitpunkt von Fehlern.
- Du schreibst Generatoren und kombinierst sie zu begrenzten Datenpipelines.
- Du wählst itertools-Werkzeuge und erkennst ihren Speicherbedarf.
resources:
- &id001
  title: Python · Iterator types
  url: https://docs.python.org/3/library/stdtypes.html#iterator-types
- title: Python · yield expressions
  url: https://docs.python.org/3/reference/expressions.html#yield-expressions
- title: Python · itertools
  url: https://docs.python.org/3/library/itertools.html
lesson: |
  Ein Import soll eine große Logdatei auswerten. Die Datei erst vollständig lesen, dann alle Zeilen umwandeln und schließlich filtern erzeugt mehrere große Listen. Dabei braucht der Bericht nur die ersten zehn fehlerhaften Einträge. Iteratoren erlauben dir, die Verarbeitung am tatsächlichen Bedarf auszurichten: Der Verbraucher fordert einen Wert an, die Pipeline berechnet genau so viel wie nötig.

  Das spart häufig Speicher, ist aber kein kostenloser Geschwindigkeitsgewinn. Ein Datenstrom trägt Zustand, kann erschöpft sein und kann Fehler erst beim späteren Durchlaufen auslösen. Dieses Modul macht diese Eigenschaften sichtbar, damit du Generatoren gezielt einsetzt und im Review erklären kannst.

  ## Iterable und Iterator sind verschiedene Rollen

  Ein **Iterable** ist ein Objekt, von dem `iter(objekt)` einen Iterator bekommen kann. Ein **Iterator** liefert mit `next(iterator)` den nächsten Wert. Sind keine Werte mehr vorhanden, signalisiert er `StopIteration`. Eine `for`-Schleife übernimmt diesen Ablauf und behandelt das Ende intern. Die Regeln stehen beim [Iterator-Protokoll](https://docs.python.org/3/library/stdtypes.html#iterator-types).

  ```python run
  namen = ["Ada", "Grace", "Linus"]
  erster = iter(namen)
  zweiter = iter(namen)
  print(next(erster))
  print(next(erster))
  print(next(zweiter))
  print(iter(erster) is erster)
  ```

  Die Liste kann mehrere voneinander unabhängige Durchläufe anbieten. `erster` und `zweiter` merken sich jeweils eine Position. Ein Iterator gibt bei `iter(erster)` dagegen sich selbst zurück; er startet nicht von vorn. Eine Funktion, deren Parameter nur „iterierbar“ sein muss, darf daher nicht ohne Vertrag zweimal darüber laufen.

  ```python run
  zahlen = iter([2, 4])
  print(sum(zahlen))
  print(sum(zahlen))
  print(next(zahlen, "fertig"))
  ```

  Der zweite Aufruf liefert null, weil keine Elemente übrig sind. [`next`](https://docs.python.org/3/library/functions.html#next) kann einen Standardwert bekommen, statt am Ende eine Exception auszulösen. Wähle einen eindeutigen Sentinel, wenn auch `None` ein gültiger Datenwert ist. Ein leeres Ergebnis ist sonst schwer von einem fehlenden Wert zu unterscheiden.

  > [!MERKE]
  > Iterierbarkeit verspricht einen Durchlauf, keine Rückspultaste. Ob ein neuer Durchlauf möglich ist, hängt vom konkreten Objekt ab.

  ## Mit yield eine Berechnung anhalten

  Eine Funktion mit `yield` ist eine Generatorfunktion. Ihr Aufruf liefert ein Generatorobjekt. Der Funktionskörper läuft erst, wenn jemand Werte anfordert. Bei jedem `yield` werden lokale Variablen und Ausführungsposition erhalten; der nächste Aufruf setzt dahinter fort. Die [Sprachreferenz](https://docs.python.org/3/reference/expressions.html#yield-expressions) beschreibt diese Unterbrechung.

  ```python run
  def fehlerzeilen(zeilen):
      print("Start")
      for nummer, text in enumerate(zeilen, start=1):
          if "ERROR" in text:
              yield nummer, text.rstrip()
      print("Ende")

  strom = fehlerzeilen(["INFO bereit", "ERROR timeout", "ERROR voll"])
  print("erzeugt")
  print(next(strom))
  print(list(strom))
  ```

  Ein normales `return` beendet den Generator. Es liefert keine weitere Zeile an die Schleife. Wirf in einem Generator nicht selbst `StopIteration`, um ihn zu beenden: Ein unbeabsichtigt entweichendes `StopIteration` wird in diesem Kontext zu `RuntimeError`. Nutze `return` oder lass den Funktionskörper enden.

  Das Aufschieben verändert auch die Fehlerstelle. Eine Prüfung innerhalb eines Generators wird erst beim ersten `next` erreicht. Wenn eine ungültige Konfiguration schon beim Aufruf abgelehnt werden soll, kann eine normale äußere Funktion zuerst prüfen und danach einen inneren Generator zurückgeben. Das ist eine Entscheidung über die öffentliche Schnittstelle, keine Geschmacksfrage.

  ## Ausdrücke und Pipelines

  Eine List Comprehension baut eine Liste. Ein Generatorausdruck mit runden Klammern liefert Werte nach Bedarf. Beide können dieselbe Transformation ausdrücken, aber ihre Lebensdauer und Speicherbelegung unterscheiden sich.

  ```python run
  zeilen = ["  12 ", "", " 7", " 21 "]
  sauber = (zeile.strip() for zeile in zeilen)
  zahlen = (int(text) for text in sauber if text)
  print(sum(zahlen))
  ```

  Hier muss keine Zwischenliste entstehen. `sum` zieht aus `zahlen`, das aus `sauber` zieht. Trotzdem muss die ursprüngliche Liste im Beispiel vorhanden sein. Erst eine passende Quelle wie ein geöffnetes Dateiobjekt macht auch die Eingabeseite schrittweise. In der Praxis prüfst du die gesamte Pipeline auf Materialisierung, etwa `list`, `sorted` oder einen versteckten Cache.

  ```python run
  from pathlib import Path
  Path("log.txt").write_text("INFO start\nERROR timeout\n", encoding="utf-8")
  with Path("log.txt").open(encoding="utf-8") as datei:
      fehler = (zeile.rstrip() for zeile in datei if zeile.startswith("ERROR"))
      print(list(fehler))
  ```

  Der Verbraucher läuft innerhalb von `with`. Ein Generatorausdruck, der aus einem bereits geschlossenen Dateiobjekt liest, scheitert später mit `ValueError`. Halte Ressourcen deshalb so lange offen, wie ein Datenstrom sie benötigt. Ein Generator mit eigenem `with` kann die Verantwortung übernehmen, braucht bei frühzeitigem Abbruch aber ebenfalls einen klaren Schließungsweg. [`contextlib.closing`](https://docs.python.org/3/library/contextlib.html#contextlib.closing) hilft bei einer expliziten Besitzgrenze.

  ## itertools als Werkzeugkasten

  [`itertools`](https://docs.python.org/3/library/itertools.html) kombiniert Datenströme ohne selbst alle Ergebnisse vorab auszurechnen. `islice` begrenzt einen Strom, `chain` verbindet Quellen, `pairwise` liefert benachbarte Paare. Damit formulierst du fachliche Operationen direkt.

  ```python run
  from itertools import chain, islice, pairwise
  print(list(islice((x * x for x in range(1000)), 3)))
  print(list(chain(["a", "b"], ["c"])))
  print(list(pairwise([10, 13, 12, 19])))
  ```

  Für endlose Quellen wie `count` muss eine Begrenzung existieren, bevor du `list` aufrufst. Begrenze möglichst nah am Verbraucher. `islice(strom, 5)` verlangt nur fünf Elemente; eine nachgelagerte Filterung kann dagegen weniger als fünf Treffer ergeben. Vertauschst du Filter und Begrenzung, ändert sich die fachliche Aussage.

  ```python run
  from itertools import count, islice
  positive_gerade = (n for n in count(1) if n % 2 == 0)
  print(list(islice(positive_gerade, 4)))
  ```

  `groupby` bündelt **aufeinanderfolgende** gleiche Schlüssel, nicht alle gleichen Schlüssel irgendwo in der Eingabe. Sortiere zuvor nach demselben Schlüssel, wenn globale Gruppen gemeint sind; die Sortierung braucht allerdings Speicher. Die Gruppen selbst teilen den zugrunde liegenden Iterator und sollten vor dem nächsten Gruppenwechsel verbraucht werden. `tee` erlaubt mehrere Durchläufe, puffert aber den Abstand zwischen den Verbrauchern. Wer einen Zweig vollständig liest und den anderen liegen lässt, kann wieder die gesamte Eingabe im Speicher halten.

  ## Delegieren und eigene Iteratoren

  `yield from quelle` reicht die Werte eines Unteriterators weiter. Für verschachtelte Daten ist das lesbarer als eine weitere innere Schleife. Es ist keine automatische rekursive Abflachung: Welche Ebenen du öffnest, bleibt deine Entscheidung.

  ```python run
  def alle_aufgaben(projekte):
      for projekt in projekte:
          yield from projekt

  print(list(alle_aufgaben([["testen", "bauen"], [], ["ausliefern"]])))
  ```

  Eigene Iterator-Klassen implementieren `__iter__` und `__next__`. Für die meisten sequenziellen Berechnungen ist eine Generatorfunktion weniger fehleranfällig. Eine Klasse passt, wenn zusätzliche benannte Operationen oder ein deutliches Zustandsmodell nötig sind. Eine wiederholt iterierbare Containerklasse kann in `__iter__` jeweils einen neuen Generator erzeugen, statt ihren eigenen Cursor zu verändern.

  > [!INTERVIEW]
  > „Warum Generator statt Liste?“ Antworte mit dem Zugriffsmuster: einmaliger sequenzieller Verbrauch und begrenzter Speicher sprechen für einen Generator; wiederholtes Lesen, Indexzugriff oder Sortieren eher für eine Liste. „Generator ist immer schneller“ wäre keine belastbare Aussage.

  ## Häufige Fehler und Praxis

  Ein leerer zweiter Bericht deutet oft auf einen schon verbrauchten Iterator. Prüfe, ob Logging, `any`, `sum` oder ein früherer Test Werte entnommen hat. Bei einem kleinen, mehrfach benötigten Datensatz ist bewusstes `list(quelle)` oft die klarste Lösung. Bei großen Daten definierst du eine Funktion, die eine frische Quelle öffnet, oder kombinierst mehrere Auswertungen in einem Durchlauf.

  Ein weiterer Fehler ist ein Generator über veränderliche Daten. Er liest Werte später; Änderungen an der Quelle können dadurch sichtbar werden. Dokumentiere, ob die Eingabe während der Verarbeitung stabil sein muss. Tests sollten neben dem Ergebnis auch prüfen, dass ein früher Abbruch nicht unnötig weitere Elemente anfordert.

  > [!PRAXIS]
  > Teste Streaming mit einer Quelle, die nach wenigen erlaubten Werten absichtlich scheitert. Eine Funktion, die nur zwei Ergebnisse liefern soll, darf die spätere Fehlerstelle nicht erreichen. So prüfst du die zugesagte Verzögerung und nicht nur die fertige Liste.

  ## Zusammenfassung

  - Ein Iterable liefert Iteratoren; ein Iterator besitzt einen fortschreitenden Zustand.
  - `yield` unterbricht die Berechnung und erhält lokale Variablen.
  - Generatoren werden beim Verbrauch ausgeführt; auch Fehler entstehen dann.
  - `list` und `sorted` materialisieren Ergebnisse bewusst.
  - Ressourcen müssen während des gesamten Verbrauchs verfügbar bleiben.
  - `islice`, `chain` und `pairwise` lösen häufige Aufgaben ohne Zwischenlisten.
  - Mehrere Verbraucher und `tee` brauchen eine bewusste Speicherentscheidung.
