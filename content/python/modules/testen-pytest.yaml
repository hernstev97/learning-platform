- id: marker-luecken
  type: gap
  title: Den passenden Marker wählen
  prompt: |-
    Setze die drei Marker. Der erste Test soll nur unter Windows übersprungen werden. Der zweite beschreibt einen bekannten Bug: Er darf scheitern, und ein unerwartetes Bestehen soll den Lauf rot machen. Der dritte läuft nie, bis der Export existiert.
  lang: python
  code: |-
    import sys

    import pytest


    @pytest.mark.⟦skipif⟧(sys.platform == "win32", reason="nutzt POSIX-Dateirechte")
    def test_datei_ist_privat(tmp_path): ...


    @pytest.mark.⟦xfail⟧(reason="RAD-231: Rundung halber Cent", ⟦strict=True⟧)
    def test_halber_cent_wird_aufgerundet(): ...


    @pytest.mark.⟦skip⟧(reason="CSV-Export folgt mit RAD-310")
    def test_export_als_csv(): ...
  gaps:
  - label: Bedingt überspringen
    hint: Der Marker nimmt eine Bedingung als erstes Argument.
  - label: Erwarteter Fehler
    hint: Der Name steht für „expected fail“.
  - label: Unerwartetes Bestehen
    hint: Ein Argument mit Wert `True` macht aus XPASS einen Fehler.
  - label: Nie ausführen
    hint: Ohne Bedingung, nur mit Grund.
  explanation: '`skipif` bekommt eine Bedingung, `skip` keine. `xfail` führt den Test aus und wertet ein Scheitern als erwartet. `strict=True` macht ein unerwartetes Bestehen zum Fehler. Jeder Marker trägt einen `reason` mit Ticket, sonst weiß später niemand, warum der Test fehlt.'
  resources:
  - title: pytest · Skip and xfail
    url: https://docs.pytest.org/en/stable/how-to/skipping.html
- id: marker-auswahl
  type: command
  title: Langsame Tests ausschließen
  prompt: Führe mit uv alle Tests aus, die **nicht** mit `@pytest.mark.slow` markiert sind.
  context: Du bist im Projektverzeichnis. Der Marker `slow` ist in der `pyproject.toml` registriert.
  answers:
  - uv run pytest -m "not slow"
  - uv run --locked pytest -m "not slow"
  output: |-
    ..                                                [100%]
    2 passed, 1 deselected in 0.08s
  explanation: '`-m` nimmt einen Ausdruck über Markernamen: `not slow`, `slow or integration` oder `integration and not slow`. Der Ausdruck braucht Anführungszeichen, weil er Leerzeichen enthält. Abgewählte Tests meldet pytest als `deselected`.'
  resources:
  - title: pytest · Registering markers
    url: https://docs.pytest.org/en/stable/how-to/mark.html#registering-marks
- id: hypothesis-luecken
  type: gap
  title: Eine Eigenschaft für Division und Rest
  prompt: |-
    Für alle ganzen Zahlen `a` und `b` mit `b != 0` gilt `(a // b) * b + a % b == a`. Ergänze den Dekorator, die Strategie und das Verwerfen unpassender Beispiele.
  lang: python
  code: |-
    from hypothesis import assume, given, strategies as st


    @⟦given⟧(st.⟦integers⟧(), st.integers())
    def test_division_und_rest(a, b):
        ⟦assume⟧(b != 0)
        assert (a // b) * b + a % b == a
  gaps:
  - label: Eigenschaft
    hint: Der Dekorator macht aus der Testfunktion eine Eigenschaft, die Hypothesis mit Beispielen füttert.
  - label: Strategie
    hint: Die Strategie für beliebige ganze Zahlen heißt wie der Datentyp, im Plural.
  - label: Beispiele verwerfen
    hint: Die Funktion steht schon im Import und verwirft ein Beispiel, wenn die Bedingung falsch ist.
  explanation: '`@given` erzeugt die Eingaben aus den Strategien. `assume(b != 0)` verwirft Beispiele mit Divisor 0, bevor die Division scheitert. Das ist in Ordnung, solange nur wenige Beispiele wegfallen. Sonst gehört die Bedingung in die Strategie, etwa `st.integers().filter(lambda b: b != 0)`.'
  resources:
  - title: Hypothesis · assume
    url: https://hypothesis.readthedocs.io/en/latest/reference/api.html#hypothesis.assume
- id: uhr-injizieren
  type: code
  title: Zeitgrenzen ohne Schlafen
  prompt: Implementiere `abgelaufen(friste, jetzt)`. `jetzt` ist eine parameterlose Funktion; rufe sie genau einmal
    auf und liefere True, wenn ihre Zeit mindestens friste ist.
  lang: python
  starter: |-
    def abgelaufen(friste, jetzt):
        ...
  solution: |-
    def abgelaufen(friste, jetzt):
        return jetzt() >= friste
  tests:
  - name: Vorher
    code: 'assert abgelaufen(10, lambda: 9) is False'
  - name: Grenze
    code: 'assert abgelaufen(10, lambda: 10) is True'
  - name: Ein Aufruf
    code: |-
      from unittest.mock import Mock
      uhr = Mock(return_value=11)
      assert abgelaufen(10, uhr) is True
      uhr.assert_called_once_with()
  explanation: Die Uhr ist eine sichtbare Abhängigkeit. So lassen sich Grenzfälle sofort und reproduzierbar prüfen,
    ohne echte Wartezeiten oder Änderungen der Systemuhr.
  resources:
  - *id001
- id: conftest-teilen
  type: code
  title: Eine Fixture für alle Testdateien
  prompt: |-
    Im Shop-Projekt liegen zwei Testdateien: `test_preise.py` im Wurzelverzeichnis und `versand/test_frei.py` in einem Unterverzeichnis. Beide fordern die Fixture `warenkorb` an. `shop.py` enthält die Klasse `Warenkorb` mit `hinzufuegen(name, preis_cent, menge=1)` und `summe_cent()`.

    Schreibe die `conftest.py`. Die Fixture `warenkorb` liefert einen **neuen** `Warenkorb` mit genau einer Position: `"Buch"` für 1299 Cent. Jeder Test bekommt seinen eigenen Warenkorb.
  lang: python
  setup: |-
    from pathlib import Path

    SHOP = '''
    class Warenkorb:
        def __init__(self):
            self.positionen = []

        def hinzufuegen(self, name, preis_cent, menge=1):
            self.positionen.append((name, preis_cent, menge))

        def summe_cent(self):
            return sum(preis * menge for _, preis, menge in self.positionen)
    '''
    TESTS = {
        "test_preise.py": '''
    def test_ein_buch_kostet_1299_cent(warenkorb):
        assert warenkorb.summe_cent() == 1299


    def test_zweites_buch_verdoppelt_die_summe(warenkorb):
        warenkorb.hinzufuegen("Buch", 1299)
        assert warenkorb.summe_cent() == 2598


    def test_jeder_test_beginnt_mit_einem_buch(warenkorb):
        assert len(warenkorb.positionen) == 1
    ''',
        "versand/test_frei.py": '''
    def test_unterverzeichnis_sieht_dieselbe_fixture(warenkorb):
        assert warenkorb.positionen[0][0] == "Buch"
    ''',
    }
    DATEIEN = {"shop.py": SHOP, **TESTS}
    Path("shop.py").write_text(SHOP, encoding="utf-8")
  starter: |-
    import pytest

    from shop import Warenkorb

    # Definiere hier die Fixture `warenkorb`.
  solution: |-
    import pytest

    from shop import Warenkorb


    @pytest.fixture
    def warenkorb():
        korb = Warenkorb()
        korb.hinzufuegen("Buch", 1299)
        return korb
  tests:
  - name: Testdateien im Wurzelverzeichnis finden die Fixture
    code: |-
      LAUF = run_pytest(DATEIEN, name="conftest.py")
      for name in ("test_ein_buch_kostet_1299_cent", "test_zweites_buch_verdoppelt_die_summe"):
          assert LAUF.outcomes.get(name) == "passed", f"{name}: {LAUF.outcomes.get(name)}\n{LAUF.output}"
  - name: Unterverzeichnisse sehen sie ebenfalls
    code: |-
      ergebnis = LAUF.outcomes.get("test_unterverzeichnis_sieht_dieselbe_fixture")
      assert ergebnis == "passed", f"Der Test in versand/ endet mit {ergebnis}.\n{LAUF.output}"
  - name: Jeder Test bekommt einen frischen Warenkorb
    code: |-
      ergebnis = LAUF.outcomes.get("test_jeder_test_beginnt_mit_einem_buch")
      assert ergebnis == "passed", "Ein Test sieht die Position eines früheren Tests. Welchen Scope hat die Fixture?\n" + LAUF.output
  hints:
  - Eine Fixture ist eine Funktion mit `@pytest.fixture`. Der Name der Funktion ist der Name, den die Tests anfordern.
  - Ohne `scope` gilt `function`. Dann entsteht der Warenkorb für jeden Test neu, solange du ihn in der Funktion erzeugst und nicht auf Modulebene.
  - Der Warenkorb braucht `hinzufuegen("Buch", 1299)`, bevor du ihn zurückgibst.
  explanation: |-
    pytest lädt die `conftest.py` im Wurzelverzeichnis und stellt ihre Fixtures allen Tests darunter bereit, auch denen in `versand/`. Keine der Testdateien importiert etwas. Die Fixture erzeugt den Warenkorb in der Funktion. Weil der Standard-Scope `function` ist, bekommt jeder Test einen neuen, und `test_zweites_buch_verdoppelt_die_summe` verändert nichts für den nächsten. Läge der Warenkorb auf Modulebene oder hätte die Fixture `scope="module"`, sähe `test_jeder_test_beginnt_mit_einem_buch` zwei Positionen.
  resources:
  - title: pytest · conftest.py, Fixtures über mehrere Dateien teilen
    url: https://docs.pytest.org/en/stable/reference/fixtures.html#conftest-py-sharing-fixtures-across-multiple-files
- id: caplog-test
  type: code
  title: Tests für Logeinträge
  prompt: |-
    `fahrten_import.py` enthält `importiere(zeilen)`. Jede Zeile hat die Form `kennung;minuten`:

    - Gültig ist eine Zeile mit genau einem `;`, deren zweiter Teil nur aus Ziffern besteht.
    - Die Funktion gibt die Zahl der gültigen Zeilen zurück.
    - Für jede ungültige Zeile schreibt sie genau einen Eintrag auf Level `WARNING` in den Logger `radwerk.import`. Die Meldung beginnt mit `Zeile <n> übersprungen`, `n` zählt ab 1.
    - Gültige Zeilen erzeugen keinen Logeintrag, auch keinen auf `INFO`.

    Schreibe pytest-Tests mit `caplog`, die gegen diese Fassung grün sind und jede Abweichung vom Vertrag rot werden lassen.
  lang: python
  setup: |-
    from pathlib import Path

    RICHTIG = '''
    import logging

    logger = logging.getLogger("radwerk.import")


    def importiere(zeilen):
        ok = 0
        for nummer, zeile in enumerate(zeilen, start=1):
            teile = zeile.split(";")
            if len(teile) != 2 or not teile[1].isdigit():
                logger.warning("Zeile %d übersprungen: %r", nummer, zeile)
                continue
            ok += 1
        return ok
    '''
    WARNUNG = '            logger.warning("Zeile %d übersprungen: %r", nummer, zeile)\n'
    MUTANTEN = {
        "level": RICHTIG.replace("logger.warning(", "logger.info("),
        "nummer": RICHTIG.replace("start=1", "start=0"),
        "still": RICHTIG.replace(WARNUNG, "            pass\n"),
        "doppelt": RICHTIG.replace(WARNUNG, WARNUNG + WARNUNG),
    }
    assert all(m != RICHTIG for m in MUTANTEN.values()), "Ein Mutant ist identisch mit der richtigen Version."
    Path("fahrten_import.py").write_text(RICHTIG, encoding="utf-8")
  starter: |-
    from fahrten_import import importiere


    def test_gueltige_zeilen_werden_gezaehlt():
        assert importiere(["R-1;12", "R-2;45"]) == 2
  solution: |-
    import logging

    from fahrten_import import importiere


    def test_gueltige_zeilen_werden_gezaehlt():
        assert importiere(["R-1;12", "R-2;45", "R-3;x", "R-4"]) == 2


    def test_ungueltige_zeile_wird_als_warnung_gemeldet(caplog):
        with caplog.at_level(logging.INFO):
            importiere(["R-1;12", "kaputt", "R-2;45"])
        assert len(caplog.records) == 1
        eintrag = caplog.records[0]
        assert eintrag.name == "radwerk.import"
        assert eintrag.levelno == logging.WARNING
        assert eintrag.getMessage().startswith("Zeile 2 übersprungen")


    def test_jede_ungueltige_zeile_wird_einzeln_gemeldet(caplog):
        with caplog.at_level(logging.INFO):
            importiere(["R-1;x", "R-2;45", "R-3"])
        meldungen = [eintrag.getMessage() for eintrag in caplog.records]
        assert len(meldungen) == 2
        assert meldungen[0].startswith("Zeile 1 übersprungen")
        assert meldungen[1].startswith("Zeile 3 übersprungen")


    def test_gueltige_zeilen_bleiben_still(caplog):
        with caplog.at_level(logging.INFO):
            importiere(["R-1;12", "R-2;45"])
        assert caplog.records == []
  tests:
  - name: Grün gegen die richtige Implementierung
    code: |-
      lauf = run_pytest({"fahrten_import.py": RICHTIG})
      assert lauf.ok, lauf.output
  - name: Level der Meldung
    code: |-
      lauf = run_pytest({"fahrten_import.py": MUTANTEN["level"]})
      assert lauf.failed, "Deine Tests bleiben grün, obwohl die Meldung nur noch auf INFO erscheint. Prüfst du den Level des Eintrags?"
  - name: Zeilennummer in der Meldung
    code: |-
      lauf = run_pytest({"fahrten_import.py": MUTANTEN["nummer"]})
      assert lauf.failed, "Deine Tests bleiben grün, obwohl die Zeilen ab 0 statt ab 1 gezählt werden."
  - name: Meldung für ungültige Zeilen
    code: |-
      lauf = run_pytest({"fahrten_import.py": MUTANTEN["still"]})
      assert lauf.failed, "Deine Tests bleiben grün, obwohl ungültige Zeilen gar nicht mehr gemeldet werden."
  - name: Eine Meldung je ungültiger Zeile
    code: |-
      lauf = run_pytest({"fahrten_import.py": MUTANTEN["doppelt"]})
      assert lauf.failed, "Deine Tests bleiben grün, obwohl jede ungültige Zeile doppelt gemeldet wird."
  hints:
  - '`caplog.records` ist eine Liste von Eintragsobjekten mit `levelno`, `name` und `getMessage()`.'
  - Der Root-Logger steht auf `WARNING`. Mit `with caplog.at_level(logging.INFO):` siehst du auch Einträge auf `INFO` und prüfst, dass gültige Zeilen still bleiben.
  - Ein Test, der nur den Rückgabewert prüft, sieht keine der Abweichungen. Prüfe Anzahl, Level und Anfang der Meldung.
  explanation: |-
    Der Rückgabewert allein sagt nichts über das Log. Jede Zusage im Vertrag braucht eine eigene Prüfung: Level `WARNING`, Zeilennummer ab 1, eine Meldung je ungültiger Zeile und keine für gültige. Mit `caplog.at_level(logging.INFO)` erfasst der Test auch Einträge unterhalb von `WARNING`. Ohne diese Zeile bliebe die Fassung grün, die auf `INFO` herabgestuft wurde, oder du sähest nie, ob gültige Zeilen still bleiben. Geprüft wird die Meldung über `getMessage()` und `startswith`, nicht über `caplog.text`, denn der enthält Datei und Zeilennummer des Aufrufs.
  resources:
  - title: pytest · caplog
    url: https://docs.pytest.org/en/stable/how-to/logging.html#caplog-fixture
  - title: Python · logging
    url: https://docs.python.org/3/library/logging.html
- id: xfail-bekannter-bug
  type: code
  title: Einen bekannten Bug dokumentieren
  prompt: |-
    `rabatt.py` enthält `rabatt_cent(preis_cent, prozent)`. Sie soll den Rabatt in Cent berechnen und halbe Cent kaufmännisch nach oben runden. Das Ticket RAD-231 beschreibt den bekannten Fehler: `rabatt_cent(1005, 10)` liefert 100 statt 101, weil `round()` auf die gerade Zahl rundet.

    Schreibe eine Testdatei mit zwei Tests:

    - `rabatt_cent(1000, 10)` ergibt 100. Dieser Test ist normal.
    - `rabatt_cent(1005, 10)` ergibt 101. Markiere diesen Test so, dass die Suite mit dem Bug **grün** bleibt, **rot** wird, sobald jemand den Bug behebt, und der Marker das Ticket als Begründung nennt.
  lang: python
  setup: |-
    from pathlib import Path

    MIT_BUG = '''
    def rabatt_cent(preis_cent, prozent):
        """Rabatt in Cent, kaufmännisch gerundet: halbe Cent nach oben."""
        return round(preis_cent * prozent / 100)
    '''
    BEHOBEN = '''
    def rabatt_cent(preis_cent, prozent):
        """Rabatt in Cent, kaufmännisch gerundet: halbe Cent nach oben."""
        return int(preis_cent * prozent / 100 + 0.5)
    '''
    assert MIT_BUG != BEHOBEN
    Path("rabatt.py").write_text(MIT_BUG, encoding="utf-8")
  starter: |-
    from rabatt import rabatt_cent


    def test_zehn_prozent_auf_1000_cent():
        assert rabatt_cent(1000, 10) == 100
  solution: |-
    import pytest

    from rabatt import rabatt_cent


    def test_zehn_prozent_auf_1000_cent():
        assert rabatt_cent(1000, 10) == 100


    @pytest.mark.xfail(reason="RAD-231: round() rundet halbe Cent zur geraden Zahl", strict=True)
    def test_halbe_cent_werden_aufgerundet():
        assert rabatt_cent(1005, 10) == 101
  tests:
  - name: Mit dem bekannten Bug bleibt die Suite grün
    code: |-
      LAUF = run_pytest({"rabatt.py": MIT_BUG}, args=["-rx"])
      assert LAUF.exit_code == 0, "Die Suite ist rot, obwohl der Fehler bekannt ist:\n" + LAUF.output
      assert "xfailed" in LAUF.outcomes.values(), "Kein Test gilt als erwartet gescheitert. Welcher Marker beschreibt das?"
      assert "passed" in LAUF.outcomes.values(), "Der normale Test fehlt oder besteht nicht."
  - name: Der Marker nennt einen Grund
    code: |-
      import re

      assert re.search(r"XFAIL \S+ - \S", LAUF.output), "Der Marker hat keinen `reason`. Nenne Ticket und Ursache.\n" + LAUF.output
  - name: Nach der Reparatur wird die Suite rot
    code: |-
      lauf = run_pytest({"rabatt.py": BEHOBEN})
      assert not lauf.ok, "Die Suite bleibt grün, obwohl der Bug behoben ist. Ohne strict=True meldet pytest nur xpassed, und der Marker bleibt für immer."
      assert "failed" in lauf.outcomes.values(), lauf.output
  hints:
  - Der Marker für „soll scheitern“ heißt `xfail`. Er steht als Dekorator über dem Test.
  - '`reason="…"` nimmt den Text für den Bericht. Ohne `strict=True` ist ein unerwartet bestandener Test nur eine Meldung.'
  explanation: |-
    `xfail` führt den Test aus und wertet das Scheitern als erwartet, deshalb bleibt die Suite mit dem Bug grün. `strict=True` verwandelt das unerwartete Bestehen nach der Reparatur in einen Fehler: Die Suite zwingt dich, den Marker zu entfernen und den Test zu einem normalen zu machen. `reason` mit Ticket erklärt jedem, warum der Test so markiert ist. Ohne `strict` stünde der Test nach der Reparatur als `xpassed` in einem grünen Lauf, und niemand würde ihn je wieder anfassen.
  resources:
  - title: pytest · xfail
    url: https://docs.pytest.org/en/stable/how-to/skipping.html#xfail-mark-test-functions-as-expected-to-fail
- id: roundtrip-property
  type: code
  title: Eine Hypothesis-Eigenschaft für Query-Strings
  prompt: |-
    `query.py` baut und liest Query-Strings. Der Vertrag:

    - `baue_query(params)` bekommt ein Dictionary mit Text als Schlüssel und Wert und gibt `schluessel=wert`-Paare zurück, mit `&` verbunden, in der Reihenfolge des Dictionaries. Schlüssel und Werte sind prozentkodiert (`urllib.parse.quote(text, safe="")`). Ein leeres Dictionary ergibt `""`.
    - `lese_query(query)` ist die Umkehrung: Sie liefert dasselbe Dictionary zurück.

    Schreibe einen Beispieltest und mindestens eine Hypothesis-Eigenschaft (`@given`). Die Eigenschaft soll gegen die richtige Fassung grün sein und Fehler finden, die du mit Beispielen nicht erwartest.
  lang: python
  setup: |-
    from pathlib import Path

    from hypothesis import Phase, settings

    RICHTIG = '''
    from urllib.parse import quote, unquote


    def baue_query(params):
        return "&".join(f"{quote(k, safe='')}={quote(v, safe='')}" for k, v in params.items())


    def lese_query(query):
        if query == "":
            return {}
        paare = (teil.split("=", 1) for teil in query.split("&"))
        return {unquote(k): unquote(v) for k, v in paare}
    '''
    MUTANTEN = {
        "unkodiert": RICHTIG.replace("{quote(v, safe='')}", "{v}"),
        "wert_roh": RICHTIG.replace("unquote(v)", "v"),
        "leer": RICHTIG.replace('    if query == "":\n        return {}\n', ""),
    }
    assert all(m != RICHTIG for m in MUTANTEN.values()), "Ein Mutant ist identisch mit der richtigen Version."
    Path("query.py").write_text(RICHTIG, encoding="utf-8")
    # Für die Mutanten zählt nur rot oder grün: ohne Shrinking ist die Prüfung schneller fertig.
    settings.register_profile("mutanten", derandomize=True, deadline=None, database=None, phases=[Phase.explicit, Phase.generate], max_examples=200)
    SCHNELL = ["-x", "--hypothesis-profile=mutanten"]
  starter: |-
    from hypothesis import given, strategies as st

    from query import baue_query, lese_query


    def test_beispiel():
        assert baue_query({"q": "a b"}) == "q=a%20b"


    def test_hin_und_zurueck():
        ...
  solution: |-
    from hypothesis import given, strategies as st

    from query import baue_query, lese_query


    def test_beispiel():
        assert baue_query({"q": "a b"}) == "q=a%20b"


    @given(st.dictionaries(st.text(), st.text()))
    def test_hin_und_zurueck(params):
        assert lese_query(baue_query(params)) == params
  tests:
  - name: Mindestens eine Eigenschaft mit @given
    code: |-
      from hypothesis import is_hypothesis_test

      eigenschaften = [n for n, f in dict(globals()).items() if n.startswith("test") and callable(f) and is_hypothesis_test(f)]
      assert eigenschaften, "Schreibe mindestens einen Test mit @given. Gesucht sind Eigenschaften, nicht nur Beispiele."
  - name: Grün gegen die richtige Implementierung
    code: |-
      lauf = run_pytest({"query.py": RICHTIG})
      assert lauf.ok, lauf.output
  - name: Kodierung der Werte
    code: |-
      lauf = run_pytest({"query.py": MUTANTEN["unkodiert"]}, args=SCHNELL + ["-k", "not beispiel"])
      assert lauf.failed, "Deine Eigenschaft bleibt grün, obwohl Werte nicht kodiert werden. Welche Zeichen trennen Paare in einer Query?"
  - name: Dekodierung der Werte
    code: |-
      lauf = run_pytest({"query.py": MUTANTEN["wert_roh"]}, args=SCHNELL + ["-k", "not beispiel"])
      assert lauf.failed, "Deine Eigenschaft bleibt grün, obwohl Werte beim Lesen nicht dekodiert werden."
  - name: Leeres Dictionary
    code: |-
      lauf = run_pytest({"query.py": MUTANTEN["leer"]}, args=SCHNELL + ["-k", "not beispiel"])
      assert lauf.failed, "Deine Eigenschaft bleibt grün, obwohl `lese_query(\"\")` nicht mehr das leere Dictionary liefert."
  hints:
  - 'Ein Roundtrip prüft `lese_query(baue_query(x)) == x` für alle `x`. Du musst kein Ergebnis selbst ausrechnen.'
  - 'Die Strategie für ein Dictionary mit Text als Schlüssel und Wert heißt `st.dictionaries(st.text(), st.text())`.'
  - Die Mutanten laufen ohne `test_beispiel`. Die Eigenschaft allein muss sie finden.
  explanation: |-
    Der Roundtrip `lese_query(baue_query(params)) == params` prüft Hunderte Dictionaries, die du dir nicht ausgedacht hättest: leer, mit `&`, `=`, `%`, Leerzeichen und Umlauten in Schlüsseln und Werten. Die drei Fehler fallen auf unterschiedlichen Wegen auf. Unkodierte Werte mit `&` zerstören die Paartrennung, ein nicht dekodierter Wert kommt verändert zurück, und das leere Dictionary ergibt `""`, das `lese_query` ohne Sonderfall nicht lesen kann. Ein Beispieltest wie `{"q": "a b"}` fängt davon höchstens den ersten Fehler. Beachte die Grenze des Musters: Ein Roundtrip findet nur Fehler, die Hin und Zurück nicht gemeinsam ausgleichen. Würden beide Funktionen dieselbe falsche Kodierung nutzen, bliebe er grün.
  resources:
  - title: Hypothesis · Strategies
    url: https://hypothesis.readthedocs.io/en/latest/reference/strategies.html
  - title: Python · urllib.parse.quote
    url: https://docs.python.org/3/library/urllib.parse.html#urllib.parse.quote
