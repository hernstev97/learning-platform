- id: approx-bug
  type: bug
  title: Rot, obwohl die Rechnung stimmt
  prompt: |-
    `brutto(19.99)` liefert korrekt den Bruttopreis. Der Test meldet trotzdem `assert 23.788099999999996 == 23.7881` und ist rot. Korrigiere die Assertion mit der Standardtoleranz von pytest.
  lang: python
  code: |-
    import pytest

    def brutto(netto):
        return netto * 1.19

    def test_brutto_fuer_19_99():
        assert brutto(19.99) == 23.7881
  lines:
  - 7
  fix:
  - line: 7
    answers:
    - assert brutto(19.99) == pytest.approx(23.7881)
    - assert pytest.approx(23.7881) == brutto(19.99)
  explanation: '`float` speichert 19.99 * 1.19 als 23.788099999999996. Der exakte Vergleich mit `==` scheitert an der letzten Stelle, obwohl die Rechnung stimmt. `pytest.approx` vergleicht mit einer relativen Toleranz von `1e-6`. `import pytest` steht schon im Code, du änderst nur die Assertion.'
