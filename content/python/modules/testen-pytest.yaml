id: testen-pytest
title: Testen mit pytest
level: 3
minutes: 270
summary: 'Verhalten absichern: aussagekräftige Assertions, Parametrisierung, Fixtures, Fehlerfälle und kontrollierte
  Abhängigkeiten.'
goals:
- Du formulierst Tests aus einem fachlichen Vertrag statt aus der Implementierung.
- Du nutzt pytest-Fixtures, Parametrisierung und Exception-Prüfungen.
- Du ersetzt Zeit, Dateien und Netzwerk kontrolliert und erkennst übermäßiges Mocking.
- Du schreibst einen Regressionstest, der eine fehlerhafte Variante tatsächlich erkennt.
- Du teilst Fixtures über `conftest.py` und steuerst Tests mit `skip`, `skipif`, `xfail(strict=True)` und eigenen Markern.
- Du vergleichst Gleitkommazahlen mit `pytest.approx` und prüfst Ausgabe und Logs mit `capsys` und `caplog`.
- Du liest einen Coverage-Bericht mit Zweigen und nennst die Grenzen der Zahl.
- Du schreibst eine erste Hypothesis-Eigenschaft (Roundtrip, Invariante) und liest ein verkleinertes Gegenbeispiel.
