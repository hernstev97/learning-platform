lesson: |
  Ein Rabattrechner funktioniert für den Beispielpreis von 100 Euro. Nach einer Änderung rechnet er aber bei null Artikeln Versandkosten doppelt und akzeptiert negative Mengen. Ein grüner Test für das ursprüngliche Beispiel hätte beide Fehler übersehen. Gute Tests beginnen deshalb nicht bei der Frage „Welche Zeile kann ich aufrufen?“, sondern bei den zugesagten Regeln und ihren Grenzen.

  In diesem Modul lernst du pytest als Werkzeug für diesen Denkprozess kennen. Die ersten Browseraufgaben dieses Moduls verwenden Python-Assertions und Fakes aus der Standardbibliothek. Die `pytest`-Blöcke der Lektion und die späteren Aufgaben laufen mit echtem pytest 9 im Browser: mit Fixture-Auflösung, Markern und Hypothesis. Der Bereich [Testing & Softwarequalität](/testing/unit-tests) vertieft das: Dort laufen deine Tests gegen richtige und absichtlich fehlerhafte Implementierungen.

  ## Ein Test beschreibt beobachtbares Verhalten

  Ein Test hat eine Vorbereitung, eine Aktion und eine Prüfung. Diese Struktur wird oft Arrange, Act, Assert genannt. Halte die Aktion erkennbar, damit ein Fehler klar zu einer Verhaltensaussage gehört. Der [pytest-Einstieg](https://docs.pytest.org/en/stable/getting-started.html) zeigt die automatische Suche nach Testdateien und Funktionen mit passenden Namen.

  ```python
  def gesamtpreis(preis, menge):
      if menge < 0:
          raise ValueError("menge muss nichtnegativ sein")
      return preis * menge

  def test_leerer_warenkorb_kostet_nichts():
      assert gesamtpreis(1299, 0) == 0
  ```

  Geldbeträge sind hier ganze Cent. Der Test benennt eine fachliche Eigenschaft, keine Schleifenstruktur. Ob die Implementierung später Multiplikation oder eine andere interne Darstellung benutzt, ist egal, solange der Vertrag bleibt. Ein Test gegen private Hilfsfunktionen kann berechtigt sein, koppelt die Suite aber enger an die Umsetzung.

  ```console
  $ uv add --dev pytest
  $ uv run pytest
  $ uv run pytest -q
  $ uv run pytest -k warenkorb
  ```

  Ein erfolgreicher Prozessausgang gehört zur Automatisierung. Lies bei einem Fehler zuerst die Assertion und den zugehörigen Vergleich, dann den Traceback. pytest bereitet fehlgeschlagene `assert`-Ausdrücke auf. Vermeide `assert ergebnis` für ein präzises Zahlenresultat: Das prüft nur Wahrheit, nicht den erwarteten Betrag.

  ## Fallauswahl und Parametrisierung

  Teste repräsentative Klassen von Eingaben: leer, ein Element, mehrere, Grenze und ungültig. Zehn fast identische Normalfälle sind oft weniger wert als ein sauberer Grenzfall. [Parametrisierung](https://docs.pytest.org/en/stable/how-to/parametrize.html) trennt solche Fälle von der gemeinsamen Testlogik.

  ```python
  import pytest

  @pytest.mark.parametrize("preis,menge,erwartet", [
      (1299, 0, 0),
      (1299, 1, 1299),
      (1299, 3, 3897),
  ])
  def test_gesamtpreis(preis, menge, erwartet):
      assert gesamtpreis(preis, menge) == erwartet
  ```

  Jeder Parametersatz wird als eigener Fall berichtet. Ein Fehler blockiert also nicht die Auswertung der übrigen Fälle wie bei einer Schleife mit mehreren Assertions innerhalb eines Tests. Für komplexere Werte machen sprechende `ids` die Ausgabe verständlich. Ein Test sollte nicht den erwarteten Wert mit derselben Logik berechnen, die er prüft; sonst reproduziert er unter Umständen denselben Fehler.

  Fehler gehören ebenfalls zum Vertrag. Verwende [`pytest.raises`](https://docs.pytest.org/en/stable/how-to/assert.html#assertions-about-expected-exceptions), wenn eine bestimmte Eingabe eine Exception auslösen soll.

  ```python
  import pytest

  def test_negative_menge_wird_abgelehnt():
      with pytest.raises(ValueError, match="nichtnegativ"):
          gesamtpreis(1299, -1)
  ```

  Der relevante Aufruf steht innerhalb von `with`. Ein zu großer Block kann eine falsche Fehlerquelle abfangen und dadurch einen grünen Test erzeugen. Prüfe den Typ und, wenn es Teil der Schnittstelle ist, einen stabilen Ausschnitt der Nachricht. Exakte Formulierungen sind sonst unnötig spröde.

  ## Fixtures besitzen Ressourcen

  Eine Fixture stellt eine Abhängigkeit bereit und kann sie danach aufräumen. Tests fordern sie über Parameternamen an. Der Standard-Scope ist ein Testaufruf. Ein größerer Scope spart Aufbauzeit, teilt aber Zustand und muss bewusst gewählt werden. Die [Fixture-Dokumentation](https://docs.pytest.org/en/stable/how-to/fixtures.html) erklärt Aufbau, Abhängigkeiten und Aufräumen mit `yield`.

  ```python
  import pytest

  @pytest.fixture
  def konto():
      return {"saldo": 0}

  def test_einzahlung(konto):
      konto["saldo"] += 20
      assert konto["saldo"] == 20

  def test_neues_konto(konto):
      assert konto["saldo"] == 0
  ```

  Die beiden Tests bekommen getrennte Dictionaries. Eine globale Liste oder eine Session-Fixture mit veränderlichem Zustand würde sie dagegen koppeln. Eine Suite, die nur in einer bestimmten Reihenfolge grün ist, weist häufig auf solche versteckten Abhängigkeiten hin.

  [`tmp_path`](https://docs.pytest.org/en/stable/how-to/tmp_path.html) liefert ein temporäres Verzeichnis als `Path`. Damit prüfst du echten Datei-I/O, ohne Dateien im Projekt oder im Home-Verzeichnis zu verändern.

  ```python
  def test_export(tmp_path):
      ziel = tmp_path / "bericht.txt"
      ziel.write_text("bereit\n", encoding="utf-8")
      assert ziel.read_text(encoding="utf-8") == "bereit\n"
  ```

  Für Ressourcen mit einer Schließoperation folgt diese nach `yield`. Baue Fixtures klein, damit klar ist, welche Ressource erfolgreich angelegt wurde und wieder geschlossen werden muss. Netzwerk, Datenbank und Dateisystem erfordern unterschiedliche Isolation; eine Fixture ist kein automatischer Ersatz für eine Testdatenstrategie.

  ## Abhängigkeiten kontrollieren

  Uhrzeit und Netzwerk machen Tests langsam und unvorhersehbar. Übergib schmale Abhängigkeiten als Parameter, wenn das zur Architektur passt. Dann kann ein Test eine kleine Fake-Funktion einsetzen und sowohl Ergebnis als auch Interaktion beobachten.

  ```python run
  def ist_abgelaufen(ablauf, jetzt):
      return jetzt() >= ablauf

  print(ist_abgelaufen(100, lambda: 99))
  print(ist_abgelaufen(100, lambda: 100))
  ```

  Ein Fake implementiert das benötigte Verhalten. Ein Mock kann zusätzlich Aufrufe protokollieren und Erwartungen prüfen. Mit [`unittest.mock`](https://docs.python.org/3/library/unittest.mock.html) erstellst du etwa einen gezielten Ersatz für einen Abrufer.

  ```python run
  from unittest.mock import Mock

  def lade_name(hole, kennung):
      return hole(kennung)["name"]

  hole = Mock(return_value={"name": "Ada"})
  print(lade_name(hole, 7))
  hole.assert_called_once_with(7)
  ```

  Patche einen Namen dort, wo der zu testende Code ihn nachschlägt. Wenn ein Modul `from dienst import hole` verwendet, reicht ein späterer Patch an `dienst.hole` möglicherweise nicht: Das Modul besitzt bereits seine eigene Bindung. Dependency Injection macht diese Grenze oft deutlicher. [`monkeypatch`](https://docs.pytest.org/en/stable/how-to/monkeypatch.html) ist für Umgebungsvariablen und gezielte Attribute praktisch und nimmt Änderungen nach dem Test zurück.

  ## conftest.py: Fixtures für mehrere Testdateien

  Zwei Testdateien brauchen dasselbe Konto. Eine Fixture, die in der einen Datei steht, sieht die andere nicht. Kopierst du sie, laufen die beiden Fassungen irgendwann auseinander. Lege sie stattdessen in eine Datei namens `conftest.py`. pytest lädt diese Datei selbst und stellt ihre Fixtures jedem Test bereit, der im selben Verzeichnis oder darunter liegt ([Sharing fixtures across multiple files](https://docs.pytest.org/en/stable/reference/fixtures.html#conftest-py-sharing-fixtures-across-multiple-files)). Du importierst nichts.

  ```text
  tests/
    conftest.py          # konto: gilt für alles unter tests/
    test_tarif.py
    api/
      conftest.py        # client: gilt nur unter tests/api/
      test_zahlung.py
    cli/
      test_export.py     # sieht konto, aber nicht client
  ```

  ```python
  # tests/conftest.py
  import pytest

  @pytest.fixture
  def konto():
      return {"saldo": 0}
  ```

  Die Sichtbarkeit folgt dem Verzeichnisbaum. Fordert `tests/cli/test_export.py` die Fixture `client` an, endet der Test beim Setup mit `fixture 'client' not found`. Legst du in `tests/api/conftest.py` eine Fixture `konto` an, überschreibt sie die obere für alles unter `tests/api/` ([Override a fixture on a directory level](https://docs.pytest.org/en/stable/how-to/fixtures.html#override-a-fixture-on-a-directory-conftest-level)). Dort startet das Konto dann etwa mit Guthaben, ohne dass sich oben etwas ändert.

  Eine `conftest.py` darf auch Hooks enthalten, etwa `pytest_addoption`. Das sind Eingriffe in pytest selbst und keine Alltagswerkzeuge für Tests. Sie stehen in der [Plugin-Dokumentation](https://docs.pytest.org/en/stable/how-to/writing_plugins.html#conftest-py-local-per-directory-plugins). Eine `conftest.py` mit echter Datenbank-Fixture zeigt [Integrationstests](/testing/integrationstests).

  ## Marker: überspringen, erwartete Fehler, eigene Gruppen

  Ein Marker hängt einem Test eine Eigenschaft an. Drei eingebaute Marker regeln Tests, die gerade nicht laufen können oder sollen ([Skip and xfail](https://docs.pytest.org/en/stable/how-to/skipping.html)):

  | Marker | Wirkung | Typischer Fall |
  | --- | --- | --- |
  | `skip` | Der Test läuft nie. | Die Funktion existiert noch nicht. |
  | `skipif(Bedingung, reason=…)` | Der Test läuft nur, wenn die Bedingung falsch ist. | Betriebssystem, Python-Version, fehlendes Paket. |
  | `xfail` | Der Test läuft und soll scheitern. | Bekannter Bug mit Ticket. |

  Gib immer `reason` an. Ohne Grund weiß in drei Monaten niemand, warum der Test fehlt.

  ```python pytest
  import sys

  import pytest


  def runde_cent(wert):
      return round(wert)


  def test_ganze_cent_bleiben_unveraendert():
      assert runde_cent(7.0) == 7


  @pytest.mark.skip(reason="CSV-Export folgt mit RAD-310")
  def test_export_als_csv():
      raise NotImplementedError


  @pytest.mark.skipif(sys.version_info >= (3, 12), reason="Workaround nur für Python 3.11")
  def test_alter_workaround():
      raise NotImplementedError


  @pytest.mark.xfail(reason="RAD-231: round() rundet halbe Cent zur geraden Zahl", strict=True)
  def test_halber_cent_wird_aufgerundet():
      assert runde_cent(2.5) == 3
  ```

  `SKIPPED` und `XFAIL` brechen den Lauf nicht ab: Der Exit-Code ist 0. Beim `xfail` liegt darin die Falle. Wird der Bug repariert und niemand räumt den Marker auf, besteht der Test unerwartet. pytest meldet das als `XPASS`, der Lauf bleibt grün, und der Marker bleibt für immer. Mit `strict=True` wird derselbe Fall zum Fehler ([strict-Parameter](https://docs.pytest.org/en/stable/how-to/skipping.html#strict-parameter)). Für alle Tests zugleich schaltest du es mit `strict_xfail = true` in der Konfiguration ein.

  ```python pytest fails
  from decimal import ROUND_HALF_UP, Decimal

  import pytest


  def runde_cent(wert):
      return int(Decimal(str(wert)).quantize(Decimal(1), rounding=ROUND_HALF_UP))


  @pytest.mark.xfail(reason="RAD-231: round() rundet halbe Cent zur geraden Zahl", strict=True)
  def test_halber_cent_wird_aufgerundet():
      assert runde_cent(2.5) == 3
  ```

  `runde_cent` ist hier repariert. `[XPASS(strict)]` heißt: Entferne den Marker, der Test ist jetzt ein normaler. Ohne `strict=True` stünde derselbe Test als `xpassed` in einem grünen Bericht. Mit `-rxs` listet pytest am Ende, welche Tests übersprungen wurden oder als erwartet gescheitert gelten, samt `reason`. Mit `raises=ValueError` begrenzt du `xfail` auf einen Fehlertyp; jede andere Exception bleibt rot.

  > [!WARNING] xfail ist kein Parkplatz
  > Ein `xfail` ohne `strict` und ohne Ticket in `reason` versteckt einen Fehler, statt ihn zu verwalten. Wie ein Team mit instabilen Tests umgeht, zeigt [Flaky Tests](/testing/flaky-tests).

  Eigene Marker gruppieren Tests, zum Beispiel `slow` oder `integration`. Du hängst sie wie die eingebauten an und wählst mit `-m` aus. Registriere sie in der Konfiguration ([Registering markers](https://docs.pytest.org/en/stable/how-to/mark.html#registering-marks)):

  ```toml
  [tool.pytest]
  strict_markers = true
  markers = [
      "slow: dauert länger als eine Sekunde",
      "integration: braucht eine laufende Datenbank",
  ]
  ```

  Mit `strict_markers = true` (auf der Kommandozeile `--strict-markers`) bricht pytest beim Sammeln ab, wenn ein Test einen unbekannten Marker trägt. Ohne die Option steht bei einem Tippfehler wie `@pytest.mark.slwo` nur eine `PytestUnknownMarkWarning` im Bericht. Der Test läuft dann in jedem Lauf mit, auch wenn du `slow` ausschließen wolltest. Die Tabelle `[tool.pytest]` nutzt natives TOML und gilt seit pytest 9. Ältere Projekte schreiben `[tool.pytest.ini_options]` ([Konfigurationsdateien](https://docs.pytest.org/en/stable/reference/customize.html#pyproject-toml)).

  ```console
  $ uv run pytest -m "not slow"
  ..                                                [100%]
  2 passed, 1 deselected in 0.08s
  $ uv run pytest -m "slow or integration"
  $ uv run pytest -m "integration and not slow"
  ```

  ## Gleitkommazahlen vergleichen mit pytest.approx

  `0.1 + 0.2 == 0.3` ist in Python falsch, weil `float` Zahlen binär speichert. Dein Code stolpert darüber, sobald er mit Kommazahlen rechnet. Der Test unten scheitert, obwohl `brutto` stimmt:

  ```python pytest fails
  def brutto(netto):
      return netto * 1.19


  def test_brutto_preis():
      assert brutto(19.99) == 23.7881
  ```

  [`pytest.approx`](https://docs.pytest.org/en/stable/reference/reference.html#pytest-approx) vergleicht mit Toleranz. Der Standard ist relativ `1e-6` und absolut `1e-12`. Es arbeitet auch mit Listen und mit den Werten eines Dictionaries:

  ```python pytest
  import pytest


  def brutto(netto):
      return netto * 1.19


  def test_skalar_mit_standardtoleranz():
      assert brutto(19.99) == pytest.approx(23.7881)


  def test_absolute_toleranz_in_cent():
      assert brutto(19.99) == pytest.approx(23.79, abs=0.005)


  def test_liste_elementweise():
      assert [brutto(100), brutto(19.99)] == pytest.approx([119.0, 23.7881])


  def test_dict_vergleicht_werte():
      assert {"netto": 19.99, "brutto": brutto(19.99)} == pytest.approx(
          {"netto": 19.99, "brutto": 23.7881}
      )


  def test_null_braucht_abs():
      assert 1e-10 != pytest.approx(0)
      assert 1e-10 == pytest.approx(0, abs=1e-9)
  ```

  Drei Regeln helfen dir:

  - Gibst du nur `abs` an, gilt keine relative Toleranz mehr. Gibst du beide an, genügt eine von beiden.
  - Gegen `0` zählt nur die absolute Toleranz, denn relativ ist nichts außer `0.0` selbst nah an `0.0`.
  - `approx` vergleicht Zahlen in Reihenfolge. Mengen (`set`) unterstützt es nicht.

  Geldbeträge speicherst du besser als ganze Cent, wie oben bei `gesamtpreis`. Dann brauchst du kein `approx`. Es gehört zu Messwerten, Durchschnitten und Umrechnungen. Weitere Beispiele stehen in [Unit-Tests mit pytest](/testing/unit-tests).

  ## Ausgabe und Logs prüfen: capsys und caplog

  Manche Funktionen geben nichts zurück, sondern schreiben: einen Fortschritt auf stdout, eine Warnung ins Log. Zwei eingebaute Fixtures fangen beides ab.

  - [`capsys`](https://docs.pytest.org/en/stable/how-to/capture-stdout-stderr.html#accessing-captured-output-from-a-test-function) fängt `stdout` und `stderr` ab. `capsys.readouterr()` liefert `out` und `err`: alles, was seit dem letzten Aufruf geschrieben wurde.
  - [`caplog`](https://docs.pytest.org/en/stable/how-to/logging.html#caplog-fixture) sammelt Einträge des `logging`-Moduls. `caplog.records` enthält die Eintragsobjekte mit `levelno` und `name`, `caplog.messages` nur die fertigen Meldungen, `caplog.text` den formatierten Text samt Level und Logger-Name.

  ```python pytest
  import logging

  logger = logging.getLogger("radwerk.import")


  def melde_fortschritt(fertig, gesamt):
      print(f"{fertig}/{gesamt} Fahrten importiert")


  def importiere(zeilen):
      ok = 0
      for nummer, zeile in enumerate(zeilen, start=1):
          if zeile.count(";") != 1:
              logger.warning("Zeile %d übersprungen: %r", nummer, zeile)
              continue
          ok += 1
      return ok


  def test_fortschritt_steht_auf_stdout(capsys):
      melde_fortschritt(3, 4)
      ausgabe = capsys.readouterr()
      assert ausgabe.out == "3/4 Fahrten importiert\n"
      assert ausgabe.err == ""


  def test_kaputte_zeile_wird_gemeldet(caplog):
      with caplog.at_level(logging.WARNING, logger="radwerk.import"):
          assert importiere(["a;1", "kaputt", "b;2"]) == 2
      assert len(caplog.records) == 1
      assert caplog.records[0].levelno == logging.WARNING
      assert caplog.messages == ["Zeile 2 übersprungen: 'kaputt'"]
  ```

  `at_level` setzt den Level nur für den `with`-Block, auf Wunsch für einen bestimmten Logger. Prüfe Level und Meldung, nicht das ganze Format. In `caplog.text` steht neben der Meldung auch der Dateiname mit Zeilennummer, und ein Test gegen den kompletten Text bricht, sobald jemand das Format ändert.

  Ein häufiger Fehler: `logger.info(...)` taucht in `caplog` nicht auf, solange der Level nicht passt. Der Root-Logger steht standardmäßig auf `WARNING`.

  ```python pytest fails
  import logging

  logger = logging.getLogger("radwerk.import")


  def importiere(zeilen):
      logger.info("Import fertig: %d Zeilen", len(zeilen))


  def test_info_ohne_level(caplog):
      importiere(["a;1"])
      assert "Import fertig" in caplog.text
  ```

  Mit `with caplog.at_level(logging.INFO):` um den Aufruf wird der Test grün. `capsys` passt zu Programmausgabe, die ein Nutzer liest (CLI, Berichte). `caplog` passt zu Diagnose, die ein Betreiber liest. Ein Logeintrag gehört nur dann zum Vertrag, wenn sich jemand darauf verlässt, etwa ein Alarm bei `WARNING`.

  ## Coverage: was die Zahl sagt und was nicht

  Coverage misst, welche Zeilen ein Testlauf ausführt. Das Plugin `pytest-cov` verbindet [coverage.py](https://coverage.readthedocs.io/) mit pytest. Es läuft nicht im Browser, probiere es lokal. Als Beispiel dient diese Funktion:

  ```python
  def versandkosten(summe_cent, ausland):
      if summe_cent >= 5000:
          return 0
      kosten = 495
      if ausland:
          kosten += 500
      return kosten
  ```

  Zwei Tests rufen sie nur mit `ausland=False` auf:

  ```console
  $ uv add --dev pytest-cov
  $ uv run pytest --cov=radwerk --cov-branch --cov-report=term-missing --cov-fail-under=90
  Name                      Stmts   Miss Branch BrPart  Cover   Missing
  ---------------------------------------------------------------------
  src/radwerk/versand.py        7      1      4      1    82%   6
  ---------------------------------------------------------------------
  TOTAL                         7      1      4      1    82%
  FAIL Required test coverage of 90% not reached. Total coverage: 81.82%
  ```

  - `--cov=radwerk` misst das Paket `radwerk`.
  - `--cov-branch` misst Zweige zusätzlich zu Zeilen. Ein `if` zählt dann nur voll, wenn beide Wege laufen ([Branch coverage](https://coverage.readthedocs.io/en/latest/branch.html)).
  - `--cov-report=term-missing` listet in der Spalte `Missing` die Zeilen, die nie liefen. Hier ist es Zeile 6, `kosten += 500`.
  - `--cov-fail-under=90` lässt den Lauf scheitern, wenn die Gesamtabdeckung darunter liegt ([pytest-cov · Optionen](https://pytest-cov.readthedocs.io/en/latest/config.html#cmdoption-cov-fail-under)).

  Eine hohe Zahl heißt nicht, dass die Tests etwas prüfen:

  ```python
  def test_versandkosten_laeuft_durch():
      versandkosten(1000, ausland=False)
      versandkosten(1000, ausland=True)
      versandkosten(5000, ausland=False)
  ```

  Dieser Test erreicht 100 % bei Zeilen und Zweigen und hat keine einzige Assertion. Ein falscher Aufschlag `kosten += 5000` bleibt grün. Coverage zeigt, was nie läuft, und nicht, was geprüft wird. Nimm sie als Netz: Eine Untergrenze mit `--cov-fail-under` verhindert, dass neuer Code ganz ohne Test ins Repository kommt. Als Ziel taugt die Prozentzahl nicht, denn sie lockt zu Tests ohne Assertions. Diff-Coverage und Mutation Testing, die Assertions prüfen, lehrt [Regressionsstrategien](/testing/regression-strategien).

  > [!INTERVIEW] „Reichen 100 % Coverage?“
  > Nein. Coverage sagt, welcher Code ausgeführt wurde, nicht ob das Ergebnis geprüft wurde. Ich nutze sie, um nie getesteten Code zu finden, messe Zweige statt nur Zeilen und setze eine Untergrenze als Sicherung. Die Qualität der Assertions prüfe ich im Review, im Zweifel mit einem absichtlich eingebauten Fehler.

  ## Hypothesis: Eigenschaften statt Beispiele

  Ein Beispieltest prüft einen Punkt, den du ausgewählt hast. [Hypothesis](https://hypothesis.readthedocs.io/en/latest/tutorial/introduction.html) dreht das um: Du beschreibst, was für alle Eingaben gelten soll, und die Bibliothek erzeugt die Eingaben. Das Paket ist eigenständig (`uv add --dev hypothesis`) und arbeitet mit pytest zusammen. Im Browser ist es vorinstalliert und nutzt feste Beispiele, damit jeder Lauf dasselbe zeigt.

  `@given` macht aus einer Testfunktion eine Eigenschaft. Die [Strategien](https://hypothesis.readthedocs.io/en/latest/reference/strategies.html) `st.integers()`, `st.lists(...)` und `st.text()` erzeugen die Werte, standardmäßig bis zu 100 Beispiele je Test. Drei Muster reichen für den Anfang:

  - Eine **Invariante** gilt nach jeder Operation: Das Ergebnis ist sortiert und ohne Duplikate.
  - **Idempotenz**: Zweimal anwenden ändert nichts.
  - Ein **Roundtrip** geht hin und zurück und landet beim Ausgangswert: `decode(encode(x)) == x`. Das ist das Muster für Encoder und Parser.

  ```python pytest
  from hypothesis import given, strategies as st


  def bereinige_tags(tags):
      return sorted({t.strip().lower() for t in tags if t.strip()})


  @given(st.lists(st.text()))
  def test_ergebnis_ist_sortiert_und_ohne_duplikate(tags):
      ergebnis = bereinige_tags(tags)
      assert ergebnis == sorted(set(ergebnis))


  @given(st.lists(st.text()))
  def test_zweites_bereinigen_aendert_nichts(tags):
      einmal = bereinige_tags(tags)
      assert bereinige_tags(einmal) == einmal
  ```

  Der nächste Roundtrip scheitert. Hypothesis findet zuerst irgendeine Liste, die nicht zurückkommt, und verkleinert sie dann, bis das kleinste Gegenbeispiel übrig ist (*Shrinking*):

  ```python pytest fails
  from hypothesis import given, strategies as st


  def tags_zu_text(tags):
      return ",".join(tags)


  def text_zu_tags(text):
      return text.split(",")


  @given(st.lists(st.text()))
  def test_hin_und_zurueck(tags):
      assert text_zu_tags(tags_zu_text(tags)) == tags
  ```

  Das Gegenbeispiel ist `tags=[]`: Die leere Liste wird zu `""`, und `"".split(",")` ergibt `[""]`. Ein Beispieltest mit `["a", "b"]` hätte den Fehler nie gezeigt. Ein zweites Gegenbeispiel wäre ein Tag mit Komma.

  Manche Eigenschaften gelten nur für einen Teil der Eingaben. [`assume`](https://hypothesis.readthedocs.io/en/latest/reference/api.html#hypothesis.assume) verwirft Beispiele, die nicht passen:

  ```python pytest
  from hypothesis import assume, given, strategies as st


  @given(st.integers(), st.integers())
  def test_division_und_rest(a, b):
      assume(b != 0)
      assert (a // b) * b + a % b == a
  ```

  Verwirf nur wenig. Wirft `assume` die meisten Beispiele weg, bricht Hypothesis mit einem Health-Check-Fehler ab. Baue die Bedingung dann in die Strategie ein, etwa `st.integers(min_value=1)`. Weitere Muster, Strategien für eigene Datentypen, Zustandsmaschinen und der Einsatz in der CI stehen in [Property-based Testing](/testing/property-based-testing).

  ## Häufige Fehler und der Wert eines roten Tests

  Ein Test, der niemals fehlschlägt, liefert keine Absicherung. Für eine Bugkorrektur reproduzierst du zuerst den Fehler mit der alten Implementierung. Dann reparierst du den Code und beobachtest, dass derselbe Test grün wird. Das ist ein Regressionstest: Die ursprüngliche Fehlersituation bleibt dokumentiert.

  ```python run
  def pruefe_sortierung(sortiere):
      assert sortiere([3, 1, 2]) == [1, 2, 3]
      assert sortiere([]) == []

  pruefe_sortierung(sorted)
  print("Vertrag erfüllt")
  ```

  Coverage zeigt, welche Stellen ausgeführt wurden, nicht ob die Assertions sinnvoll waren. Ein vollständig durchlaufener Parser kann trotzdem falsche Daten akzeptieren. Umgekehrt muss nicht jede triviale Zeile einen isolierten Unit-Test bekommen. Kombiniere schnelle Tests der Fachlogik mit wenigen Integrationstests an wichtigen Grenzen und einem kleinen Smoke-Test des vollständigen Ablaufs.

  > [!PRAXIS]
  > Im Review ist ein gezielter Test mit einem aussagekräftigen Gegenbeispiel überzeugender als viele Tests, die interne Aufrufdetails festschreiben. Prüfe, ob ein naheliegender falscher Algorithmus die Suite überleben würde.

  > [!INTERVIEW]
  > „Was mockst du?“ Nenne unkontrollierbare oder teure Grenzen und erkläre die verbleibende Lücke. Ein Mock beweist die Nutzung deiner angenommenen Schnittstelle; ein Integrationstest prüft zusätzlich, ob diese Annahme zum echten Dienst passt.

  > [!TIP]
  > Mache Fehlerfälle deterministisch. Eine Fake-Uhr ist besser als ein Test, der eine Sekunde schläft und hofft, anschließend die richtige Grenze getroffen zu haben.

  ## Zusammenfassung

  - Tests prüfen einen Vertrag mit beobachtbaren Ergebnissen und Fehlern.
  - Gute Fallauswahl umfasst Normalfälle, Grenzen und ungültige Eingaben.
  - Parametrisierung berichtet jeden Fall getrennt.
  - Fixtures besitzen Aufbau, Lebensdauer und Aufräumen von Ressourcen.
  - Fakes und Mocks kontrollieren Grenzen; sie ersetzen keine vollständige Integration.
  - Ein Regressionstest muss die fehlerhafte Variante erkennen.
  - Coverage ergänzt fachliche Assertions, ersetzt sie aber nicht.
  - `conftest.py` teilt Fixtures nach dem Verzeichnisbaum; Hooks gehören in die Plugin-Dokumentation.
  - `skip`, `skipif` und `xfail` brauchen einen `reason`; `xfail(strict=True)` meldet einen behobenen Bug.
  - Eigene Marker registrierst du und sicherst sie mit `strict_markers = true` ab; `-m` wählt Tests aus.
  - Gleitkommazahlen vergleichst du mit `pytest.approx`, gegen `0` mit `abs`.
  - `capsys` prüft Ausgabe, `caplog` Logeinträge. Prüfe Level und Meldung, nicht das Format.
  - Coverage zeigt nie ausgeführten Code, aber nicht geprüftes Verhalten.
  - Hypothesis erzeugt Eingaben für Eigenschaften (Invariante, Roundtrip) und verkleinert Gegenbeispiele.
exercises:
- id: vertrag
  type: choice
  title: Welcher Test ist aussagekräftig?
  prompt: Eine Funktion soll 0 bis 100 Prozent akzeptieren. Welcher Test ergänzt normale Eingaben am sinnvollsten?
  options:
  - text: Die Werte 0, 100, -1 und 101 prüfen.
    correct: true
    why: Die Grenzen und ihre direkte Umgebung zeigen typische Vergleichsfehler.
  - text: Nur 50 zehnmal prüfen.
    correct: false
    why: Wiederholung erhöht hier die fachliche Abdeckung nicht.
  - text: Prüfen, ob intern eine if-Anweisung vorkommt.
    correct: false
    why: Das bindet den Test an eine Implementierung statt an Verhalten.
  explanation: Die interessante Unterscheidung liegt an den Vertragsgrenzen. Ein Testfall sollte einen plausiblen
    falschen Code ausschließen.
  resources:
  - *id001
- id: rot-gruen
  type: order
  title: Einen Fehler dauerhaft beheben
  prompt: Ordne die Schritte einer Regression. Die Zeilen sind bewusst als kommentierter Arbeitsablauf formuliert.
  lang: python
  lines: |-
    # Fehler mit einer minimalen Eingabe reproduzieren
    # Test für das erwartete Verhalten schreiben
    # Beobachten, dass der Test am bestehenden Bug scheitert
    # Implementierung korrigieren
    # Test und relevante bestehende Suite ausführen
  explanation: Ein zuvor roter Test belegt, dass die Aufgabe den vorhandenen Bug trifft. Danach prüfen neue und
    bestehende Tests gemeinsam die Korrektur.
  resources:
  - *id001
- id: xfail-strict-meldung
  type: choice
  title: Der Bug ist behoben, der Marker nicht
  prompt: Der Bug RAD-231 ist inzwischen behoben, aber der Marker steht noch am Test. Was meldet pytest?
  lang: python
  code: |-
    import pytest

    def runde_cent(wert):
        return int(wert + 0.5)  # repariert: halbe Cent werden aufgerundet

    @pytest.mark.xfail(reason="RAD-231: round() rundet halbe Cent zur geraden Zahl", strict=True)
    def test_halber_cent_wird_aufgerundet():
        assert runde_cent(2.5) == 3
  options:
  - text: Der Test gilt als fehlgeschlagen (`[XPASS(strict)]`), der Lauf endet mit Exit-Code 1.
    correct: true
    why: Mit `strict=True` ist ein unerwartetes Bestehen ein Fehler. Der Lauf wird rot, bis jemand den Marker entfernt.
  - text: "`xpassed`: Der Test zählt als bestanden, und der Lauf bleibt grün."
    correct: false
    why: So verhält sich `xfail` ohne `strict`. Genau dort bleibt der überflüssige Marker unbemerkt stehen.
  - text: "`passed`: pytest ignoriert den Marker, sobald der Test besteht."
    correct: false
    why: pytest wertet den Marker immer aus. Ein bestandener `xfail`-Test heißt `xpassed` und mit `strict=True` `failed`.
  - text: "`skipped`: pytest überspringt Tests, deren Bug behoben ist."
    correct: false
    why: Übersprungen wird nur mit `skip` oder `skipif`. `xfail` führt den Test immer aus.
  explanation: Ein `xfail`-Test läuft. Scheitert er, gilt das als erwartet. Besteht er, ist das bei `strict=True` ein Fehler, damit der Marker verschwindet. Ohne `strict` bliebe der Lauf grün, und der Marker würde für immer stehen.
  resources:
  - title: pytest · xfail strict
    url: https://docs.pytest.org/en/stable/how-to/skipping.html#strict-parameter
- id: assert-wert
  type: output
  title: Wahr ist nicht gleich richtig
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    ergebnis = 2
    print(bool(ergebnis))
    print(ergebnis == 3)
  expected: |-
    True
    False
  explanation: assert ergebnis würde den Wert 2 akzeptieren. Eine Gleichheitsprüfung erkennt dagegen, dass 3 erwartet
    war.
  resources:
  - *id001
- id: fake-aufruf
  type: output
  title: Ein Mock merkt sich Aufrufe
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    from unittest.mock import Mock
    hole = Mock(return_value=7)
    print(hole("a"))
    print(hole.call_count)
    print(hole.call_args.args)
  expected: |-
    7
    1
    ('a',)
  explanation: Ein Mock kann Ergebnis und Interaktionshistorie getrennt anbieten. Das ist sinnvoll, wenn der konkrete
    Aufruf Teil des Vertrags ist.
  resources:
  - *id001
- id: approx-vorhersage
  type: output
  title: Wann ist approx gleich?
  prompt: Welche Ausgabe erzeugt dieses Programm? Die Standardtoleranz von `pytest.approx` ist relativ `1e-6` und absolut `1e-12`.
  lang: python
  code: |-
    import pytest

    print(0.1 + 0.2 == 0.3)
    print(0.1 + 0.2 == pytest.approx(0.3))
    print(1e-10 == pytest.approx(0))
    print(1e-10 == pytest.approx(0, abs=1e-9))
    print(100.0 == pytest.approx(100.4, abs=0.5))
    print([0.1 + 0.2, 1.0] == pytest.approx([0.3, 1.0]))
  expected: |-
    False
    True
    False
    True
    True
    True
  explanation: Die erste Zeile zeigt den Fließkommafehler. `approx` toleriert ihn. Gegen `0` zählt nur die absolute Toleranz, und `1e-10` liegt über `1e-12`. Mit `abs=1e-9` wird der Vergleich wahr. Bei `abs=0.5` ist `100.4` nah genug an `100.0`. Bei Listen vergleicht `approx` jedes Element.
  resources:
  - title: pytest · approx
    url: https://docs.pytest.org/en/stable/reference/reference.html#pytest-approx
- id: grenztest
  type: code
  title: Einen Off-by-one-Test schreiben
  prompt: Schreibe `pruefe(funktion)`. Teste, dass `funktion(18)` True zurückgibt. Eine richtige Volljährigkeitsprüfung
    muss bestehen, eine Implementierung mit `alter > 18` muss durch AssertionError scheitern.
  lang: python
  starter: |-
    def pruefe(funktion):
        ...
  solution: |-
    def pruefe(funktion):
        assert funktion(18) is True
  tests:
  - name: Korrekt
    code: 'pruefe(lambda alter: alter >= 18)'
  - name: Fehler wird erkannt
    code: |-
      try:
          pruefe(lambda alter: alter > 18)
      except AssertionError:
          pass
      else:
          assert False, "Der Grenzfehler blieb unentdeckt"
  - name: Nicht nur Wahrheit
    code: |-
      try:
          pruefe(lambda alter: 1)
      except AssertionError:
          pass
      else:
          assert False, "Es ist ausdrücklich bool True verlangt"
  explanation: Der Wert direkt auf der Grenze unterscheidet >= von >. Die Aufgabe verlangt ausdrücklich einen booleschen
    Rückgabewert und prüft deshalb Identität mit True.
  resources:
  - *id001
- id: leerfall
  type: code
  title: Test gegen falsches Maximum
  prompt: 'Schreibe `pruefe_maximum(fn)`: `fn([])` muss None ergeben, `fn([-7, -2])` muss -2 ergeben und `fn([4])`
    muss 4 ergeben.'
  lang: python
  starter: |-
    def pruefe_maximum(fn):
        ...
  solution: |-
    def pruefe_maximum(fn):
        assert fn([]) is None
        assert fn([-7, -2]) == -2
        assert fn([4]) == 4
  tests:
  - name: Richtig
    code: 'pruefe_maximum(lambda xs: max(xs) if xs else None)'
  - name: Null als Startwert ist falsch
    code: |-
      try:
          pruefe_maximum(lambda xs: max([0] + xs) if xs else None)
      except AssertionError:
          pass
      else:
          assert False, "Negative Werte müssen den Bug zeigen"
  - name: Leere Eingabe
    code: |-
      try:
          pruefe_maximum(lambda xs: max(xs) if xs else 0)
      except AssertionError:
          pass
      else:
          assert False, "None ist nicht 0"
  explanation: Der ausschließlich negative Fall entlarvt einen ungeeigneten Startwert. Der leere Fall ist ein eigener
    Vertrag und darf nicht mit einem echten Zahlenwert vermischt werden.
  resources:
  - *id001
- id: exception-assert
  type: gap
  title: Eine Exception prüfen
  prompt: Ergänze den pytest-Kontextmanager mit dem Fehler-Typ ValueError. Dieser Ausschnitt läuft lokal mit installiertem
    pytest.
  lang: python
  code: |-
    import pytest
    with ⟦pytest.raises(ValueError)⟧:
        int("keine Zahl")
  explanation: raises schlägt sowohl bei ausbleibender als auch bei einer falschen Exception fehl. Der problematische
    Aufruf muss innerhalb des Kontextes stehen.
  resources:
