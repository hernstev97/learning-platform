    url: https://pytest-cov.readthedocs.io/en/latest/config.html#cmdoption-cov-fail-under
- id: pytest-projekt
  type: practice
  title: Eine echte pytest-Suite
  prompt: Lege lokal ein kleines Paket mit einer Prozentvalidierung an. Teste Normalfälle, beide Grenzen und ungültige
    Werte mit pytest. Führe die Suite über uv aus.
  lang: python
  solution: |-
    import pytest

    def prozent(wert):
        if not 0 <= wert <= 100:
            raise ValueError("außerhalb 0..100")
        return wert / 100

    @pytest.mark.parametrize("wert,erwartet", [(0, 0), (50, .5), (100, 1)])
    def test_gueltig(wert, erwartet):
        assert prozent(wert) == erwartet

    @pytest.mark.parametrize("wert", [-1, 101])
    def test_ungueltig(wert):
        with pytest.raises(ValueError):
            prozent(wert)
  checklist:
  - pytest entdeckt alle fünf parametrisierten Fälle.
  - Eine absichtliche Änderung von <= zu < wird erkannt.
  - Kein Test verändert globalen Zustand oder benötigt Netzwerk.
  - Der README-Befehl reproduziert den grünen Lauf.
  explanation: Die lokale Aufgabe prüft die echte pytest-Integration. Die Mutation der Grenzbedingung zeigt zusätzlich,
    ob die ausgewählten Testfälle einen realistischen Defekt entdecken.
  resources:
  - *id001
