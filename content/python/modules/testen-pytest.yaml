- id: coverage-ohne-assert
  type: explain
  title: Hundert Prozent und trotzdem blind
  prompt: Der Coverage-Bericht zeigt für diese Datei 100 % bei Zeilen und Zweigen. Eine Kollegin will `--cov-fail-under=100` zur Pflicht in der CI machen. Erkläre, was die 100 % hier aussagen und was nicht.
  lang: python
  code: |-
    def pfand_cent(flaschen, mehrweg):
        satz = 25
        if mehrweg:
            satz = 8
        return flaschen * satz


    def test_pfand_laeuft_durch():
        pfand_cent(4, mehrweg=True)
        pfand_cent(4, mehrweg=False)
  points:
  - Beide Zweige von `if mehrweg` laufen, deshalb melden Zeilen- und Zweigabdeckung 100 %.
  - Der Test enthält keine Assertion. Ein falscher Satz (80 statt 8) oder vertauschte Zweige bleiben grün.
  - Coverage misst, welcher Code ausgeführt wird, nicht ob das Ergebnis geprüft wird.
  - Eine Untergrenze ist ein Netz gegen ungetesteten Code. Als Ziel von 100 % verführt sie zu Tests ohne Assertions.
  explanation: |-
    Coverage zählt ausgeführte Zeilen und Zweige. Der Test ruft `pfand_cent` mit beiden Werten von `mehrweg` auf, also gilt alles als abgedeckt. Er prüft aber nichts: `pfand_cent` könnte `0` oder `-1` liefern, und der Test bliebe grün. Coverage zeigt, welcher Code nie läuft. Das ist nützlich als Suchwerkzeug und als Untergrenze, damit neuer Code nicht ganz ohne Test hereinkommt. Wer 100 % erzwingt, bekommt schnell Tests, die nur durchlaufen. Ob die Assertions etwas taugen, zeigt ein absichtlich eingebauter Fehler, im Großen Mutation Testing.
