id: algorithmen
title: Algorithmen fürs Coding-Interview
level: 3
minutes: 180
summary: 'Probleme präzisieren, Invarianten finden und Laufzeit erklären: Hash-Tabellen, zwei Zeiger, binäre Suche,
  Queues und dynamische Programmierung.'
goals:
- Du formulierst Annahmen und Randfälle vor der Implementierung.
- Du erklärst Zeit- und Speicherbedarf mit Bezug auf die Eingabegröße.
- Du nutzt passende Datenstrukturen für Suche, Häufigkeiten und Warteschlangen.
- Du implementierst typische Muster und begründest ihre Korrektheit mit Invarianten.
resources:
- &id001
  title: Python · Data structures
  url: https://docs.python.org/3/tutorial/datastructures.html
- title: Python · bisect
  url: https://docs.python.org/3/library/bisect.html
- title: Python · collections
  url: https://docs.python.org/3/library/collections.html
- title: Python · functools.cache
  url: https://docs.python.org/3/library/functools.html#functools.cache
lesson: |
  Im Coding-Interview sollst du selten den raffiniertesten Algorithmus auswendig vortragen. Du sollst ein Problem verstehen, eine korrekte Lösung finden und ihre Kosten erklären. Eine nachvollziehbare Lösung mit sauberen Randfällen ist wertvoller als ein halb erinnerter Trick. Dieselben Fähigkeiten helfen bei echten Importen, Suchfunktionen und Berichten.

  Beginne mit dem Vertrag: Sind Werte sortiert, dürfen sie mehrfach vorkommen, darfst du die Eingabe ändern und was bedeutet eine leere Eingabe? Danach zeichnest du kleine Beispiele durch. Erst wenn Ergebnis und Randfälle klar sind, lohnt sich Optimierung. Dieses Modul verbindet wiederkehrende Muster mit Python-Datenstrukturen.

  ## Kosten anhand der Eingabe erklären

  Mit `n` bezeichnen wir die Zahl der Eingabeelemente. Eine vollständige Schleife über `n` Werte benötigt linear viele Schritte, also `O(n)`. Zwei verschachtelte vollständige Schleifen können `O(n²)` benötigen. Das ist eine Wachstumsbeschreibung, keine exakte Sekundenangabe. Ein schneller Rechner ändert nicht, dass eine quadratische Lösung bei wachsenden Daten unverhältnismäßig teurer wird.

  ```python run
  def paare(werte):
      anzahl = 0
      for i in range(len(werte)):
          for j in range(i + 1, len(werte)):
              anzahl += 1
      return anzahl

  print(paare(list(range(4))))
  print(paare(list(range(8))))
  ```

  Die Zahl der Paare ist `n * (n - 1) / 2`. Der Faktor ein Halb verschwindet in der O-Notation, das quadratische Wachstum bleibt. Berücksichtige auch versteckte Arbeit in Ausdrücken: `x in liste` durchsucht die Liste, und ein Slice erzeugt eine neue Teilsequenz. Eine scheinbar einzelne Zeile kann deshalb linear viel Arbeit oder Speicher benötigen.

  Die [Python-Datenstrukturen](https://docs.python.org/3/tutorial/datastructures.html) liefern verschiedene Fähigkeiten. Mengen und Dictionaries unterstützen schnelle Schlüsselzugriffe im üblichen Fall, Listen direkten Indexzugriff. Diese Eigenschaften machen oft mehr Unterschied als das Kürzen der Syntax. Bei Hash-Tabellen spricht man bei Zugriffen üblicherweise von erwarteter konstanter Zeit; das ist keine Garantie für jeden möglichen Kollisionsfall.

  > [!MERKE]
  > Erkläre immer, was n bedeutet und welcher zusätzliche Speicher entsteht. Eine Ergebnisliste zählt anders als eine unerwartete Kopie der gesamten Eingabe.

  ## Hash-Tabellen machen bereits Gesehenes nutzbar

  Für Duplikate brauchst du keine Suche in allen bisherigen Werten, wenn eine Menge das bereits Gesehene hält. Die Invariante lautet: Vor jeder Iteration enthält `gesehen` genau die Werte aus dem bereits verarbeiteten Präfix.

  ```python run
  def erste_wiederholung(werte):
      gesehen = set()
      for wert in werte:
          if wert in gesehen:
              return wert
          gesehen.add(wert)
      return None

  print(erste_wiederholung([4, 7, 4, 7]))
  print(erste_wiederholung([4, 7]))
  ```

  Jeder Wert wird höchstens einmal aufgenommen. Die erwartete Zeit ist `O(n)`, zusätzlicher Speicher im ungünstigen Fall `O(n)`. Diese Lösung benötigt hashbare Werte. Für Listen als Elemente brauchst du einen passenden Schlüssel oder eine andere Strategie; eine Menge ist kein beliebiger Vergleichsmechanismus.

  Für Häufigkeiten bietet [`Counter`](https://docs.python.org/3/library/collections.html#collections.Counter) ein Dictionary mit Zählsemantik. Eine eigene Schleife ist ebenfalls sinnvoll, wenn du das Muster erklären willst.

  ```python run
  from collections import Counter
  haeufigkeiten = Counter(["api", "db", "api", "cache"])
  print(haeufigkeiten["api"])
  print(haeufigkeiten["fehlt"])
  print(sorted(haeufigkeiten.items()))
  ```

  Das Zwei-Summen-Problem verwendet dieselbe Idee: Für den aktuellen Wert suchst du den benötigten Partner `ziel - wert` unter den bereits gesehenen Werten. Erst danach speicherst du den aktuellen Wert. So verwendest du denselben Index nicht zweimal und behandelst gleiche Werte an verschiedenen Positionen korrekt.

  ## Zwei Zeiger auf sortierten Daten

  Bei sortierten Zahlen kann eine Paar-Summe mit zwei Zeigern gesucht werden. Ist die Summe zu klein, muss der linke Wert wachsen; ist sie zu groß, muss der rechte Wert kleiner werden. Die Sortierung begründet, warum die ausgeschlossenen Kandidaten nicht mehr passen können.

  ```python run
  def hat_paar(zahlen, ziel):
      links, rechts = 0, len(zahlen) - 1
      while links < rechts:
          s = zahlen[links] + zahlen[rechts]
          if s == ziel:
              return True
          if s < ziel:
              links += 1
          else:
              rechts -= 1
      return False

  print(hat_paar([1, 3, 5, 9], 8))
  ```

  Die Zeiger bewegen sich zusammen höchstens `n` Schritte. Die Suche ist `O(n)` mit konstantem Zusatzspeicher, wenn die Daten schon sortiert sind. Musst du zuvor sortieren, gehören Zeit und eventuell eine Kopie in die Gesamtrechnung. Außerdem ändert Sortieren die ursprünglichen Positionen. Bei einer Aufgabe, die Originalindizes verlangt, ist das ein wesentlicher Unterschied.

  Ein verwandtes Muster ist das gleitende Fenster: Ein zusammenhängender Bereich wächst rechts und schrumpft links. Es funktioniert nur, wenn die fachliche Bedingung die Richtung begründet. Bei Summen mit negativen Zahlen gelten manche vertrauten Fensterregeln nicht mehr.

  ## Binäre Suche mit einer klaren Invariante

  Binäre Suche halbiert einen sortierten Suchraum. Nutze ein halboffenes Intervall `[links, rechts)`: links gehört dazu, rechts nicht. Gesucht wird hier die erste Position, an der ein Wert eingefügt werden kann, ohne die Ordnung zu verletzen.

  ```python run
  def einfuegeposition(zahlen, ziel):
      links, rechts = 0, len(zahlen)
      while links < rechts:
          mitte = (links + rechts) // 2
          if zahlen[mitte] < ziel:
              links = mitte + 1
          else:
              rechts = mitte
      return links

  print(einfuegeposition([2, 4, 4, 9], 4))
  print(einfuegeposition([], 4))
  ```

  Alle Positionen vor links enthalten kleinere Werte. Alle Positionen ab rechts gehören nicht mehr zum offenen Suchbereich. Jeder Schritt verkleinert diesen Bereich, daher endet die Schleife. Die Suche benötigt `O(log n)` Vergleiche und `O(1)` zusätzlichen Speicher. Das anschließende Einfügen in eine Python-Liste kann trotzdem `O(n)` kosten, weil Elemente verschoben werden.

  Die Standardbibliothek bietet [`bisect_left`](https://docs.python.org/3/library/bisect.html#bisect.bisect_left) für genau diese Position. Im Produktionscode nutzt du die bewährte Funktion; im Interview sollst du das Prinzip erklären können. Bei mehrfachen gleichen Werten unterscheiden sich linke und rechte Einfügeposition bewusst.

  ## Queue, Graphen und wiederholte Teilprobleme

  Für eine Warteschlange nimmst du [`deque`](https://docs.python.org/3/library/collections.html#collections.deque). `popleft` entfernt vorne, ohne alle verbleibenden Listenelemente verschieben zu müssen. Das passt zur Breitensuche in einem ungewichteten Graphen.

  ```python run
  from collections import deque

  def erreichbar(graph, start):
      queue = deque([start])
      besucht = {start}
      while queue:
          knoten = queue.popleft()
          for nachbar in graph.get(knoten, []):
              if nachbar not in besucht:
                  besucht.add(nachbar)
                  queue.append(nachbar)
      return besucht

  print(sorted(erreichbar({"a": ["b"], "b": ["a", "c"]}, "a")))
  ```

  Markiere einen Knoten beim Einreihen als besucht. Sonst können mehrere Vorgänger denselben Knoten unnötig oft in die Queue legen. Bei Adjazenzlisten ist die typische Laufzeit `O(V + E)` für Knoten und Kanten. Eine kürzeste Weglänge gilt bei Breitensuche für gleich gewichtete Kanten, nicht automatisch für beliebige Reisekosten.

  Wiederholt eine Rekursion dieselben Teilprobleme, hilft Memoisierung. [`functools.cache`](https://docs.python.org/3/library/functools.html#functools.cache) speichert Ergebnisse pro Argument; dafür müssen Argumente hashbar sein. Eine iterative dynamische Programmierung kann oft denselben Effekt mit kleinerem Speicher und ohne Rekursionstiefe erreichen.

  ```python run
  def treppen(n):
      a, b = 1, 1
      for _ in range(n):
          a, b = b, a + b
      return a

  print([treppen(n) for n in range(5)])
  ```

  Hier zählt eine leere Treppe als ein möglicher Weg. Ein anderer Basisfall würde eine andere Folge ergeben; definiere ihn, statt ihn aus Gewohnheit zu übernehmen.

  ## Häufige Fehler und Interviewpraxis

  Off-by-one-Fehler entstehen häufig durch gemischte inklusive und exklusive Grenzen. Schreibe die Intervallbedeutung auf und prüfe leere sowie einelementige Eingaben. Bei Hash-Lösungen sind Duplikate und die Reihenfolge „prüfen, dann speichern“ entscheidend. Bei rekursiven Lösungen fehlen oft ein erreichbarer Basisfall oder eine Schranke für die Tiefe.

  > [!INTERVIEW]
  > Erkläre zuerst eine verständliche Ausgangslösung, dann den Engpass und die verbesserte Datenstruktur. Führe einen Fall von Hand durch und nenne Zeit, Zusatzspeicher und Annahmen. Das zeigt mehr Verständnis als eine kommentarlos hingeschriebene Kurzlösung.

  > [!PRAXIS]
  > Miss erst, wenn eine korrekte Lösung und repräsentative Daten vorliegen. Ein Mikrobenchmark über zehn Elemente rechtfertigt keine komplizierte Architektur für einen seltenen Aufruf.

  ## Zusammenfassung

  - Kläre Vertrag und Randfälle vor der Optimierung.
  - Nenne Eingabegröße, Zeit und zusätzlichen Speicher.
  - Hash-Tabellen nutzen bereits verarbeitete Information.
  - Zwei Zeiger brauchen eine begründete Bewegungsregel.
  - Binäre Suche braucht ein konsistentes Intervall.
  - Queue und besuchte Menge machen Breitensuche robust.
  - Teilprobleme lassen sich cachen oder iterativ zusammenführen.
