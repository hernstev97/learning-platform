- id: invariante
  type: explain
  title: Warum funktioniert die Suche?
  prompt: Erkläre die Invariante dieser Duplikatsuche und ihre Kosten.
  lang: python
  code: |-
    gesehen = set()
    for wert in werte:
        if wert in gesehen:
            return True
        gesehen.add(wert)
    return False
  points:
  - Vor jedem Schritt enthält gesehen genau die bisher gelesenen Werte.
  - Ein Treffer beweist eine frühere Position mit gleichem Wert.
  - Ohne Treffer wird die Invariante durch add erhalten.
  - Erwartete Zeit O(n), zusätzlicher Speicher O(n) im schlechtesten Fall.
  explanation: Die Menge repräsentiert das bereits verarbeitete Präfix. Damit entspricht die Mitgliedschaft genau
    der gesuchten Wiederholung. Ein Durchlauf und üblicherweise konstante Hash-Zugriffe ergeben erwartete lineare
    Zeit.
  resources:
  - *id001
- id: bfs-distanz
  type: practice
  title: Kürzeste Kantenanzahl
  prompt: Implementiere eine Breitensuche, die für einen ungewichteten Graphen die kürzeste Kantenanzahl von start
    zu ziel liefert oder None.
  lang: python
  solution: |-
    from collections import deque

    def distanz(graph, start, ziel):
        queue = deque([(start, 0)])
        besucht = {start}
        while queue:
            knoten, abstand = queue.popleft()
            if knoten == ziel:
                return abstand
            for nachbar in graph.get(knoten, []):
                if nachbar not in besucht:
                    besucht.add(nachbar)
                    queue.append((nachbar, abstand + 1))
        return None
  checklist:
  - start == ziel liefert 0.
  - Ein unerreichbares Ziel liefert None.
  - Ein Zyklus führt nicht zu endlosem Einreihen.
  - Die Erklärung nennt die Voraussetzung gleicher Kantengewichte.
  - Zeit O(V+E) und Speicher O(V) werden begründet.
  explanation: FIFO-Verarbeitung besucht alle Knoten einer Entfernung vor der nächsten Ebene. Deshalb ist die erste
    erreichte Zielentfernung bei ungewichteten Kanten minimal.
  resources:
  - *id001
