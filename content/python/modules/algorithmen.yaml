- id: zwei-summen
  type: code
  title: Zwei verschiedene Positionen
  prompt: Schreibe `zwei_summe(werte, ziel)`. Liefere beim ersten gefundenen Paar `(frueherer_index, aktueller_index)`
    oder None. Prüfe von links nach rechts und behalte bei mehrfachen Werten den frühesten Index.
  lang: python
  starter: |-
    def zwei_summe(werte, ziel):
        ...
  solution: |-
    def zwei_summe(werte, ziel):
        gesehen = {}
        for i, wert in enumerate(werte):
            partner = ziel - wert
            if partner in gesehen:
                return gesehen[partner], i
            gesehen.setdefault(wert, i)
        return None
  tests:
  - name: Normal
    code: assert zwei_summe([2, 7, 11], 9) == (0, 1)
  - name: Doppelte
    code: assert zwei_summe([3, 3], 6) == (0, 1)
  - name: Nicht derselbe Index
    code: assert zwei_summe([3], 6) is None
  - name: Frühester Partner
    code: assert zwei_summe([2, 2, 5], 7) == (0, 2)
  explanation: Die Partnersuche kommt vor dem Speichern. setdefault erhält den ersten Index und macht die geforderte
    Auswahl bei Duplikaten eindeutig.
