- id: einfuegen
  type: code
  title: Linke Einfügeposition
  prompt: Implementiere `position(zahlen, ziel)` ohne bisect. zahlen ist aufsteigend sortiert; liefere die erste
    Position mit Wert >= ziel oder len(zahlen).
  lang: python
  starter: |-
    def position(zahlen, ziel):
        ...
  solution: |-
    def position(zahlen, ziel):
        links, rechts = 0, len(zahlen)
        while links < rechts:
            mitte = (links + rechts) // 2
            if zahlen[mitte] < ziel:
                links = mitte + 1
            else:
                rechts = mitte
        return links
  tests:
  - name: Doppelte
    code: assert position([1, 3, 3, 8], 3) == 1
  - name: Leer
    code: assert position([], 4) == 0
  - name: Rechter Rand
    code: assert position([1, 3], 7) == 2
  - name: Linker Rand
    code: assert position([2, 5], 1) == 0
  explanation: Das halboffene Intervall erlaubt auch die Einfügeposition hinter dem letzten Element. Die Schleife
    halbiert den Suchraum, ohne außerhalb der Liste zu lesen.
