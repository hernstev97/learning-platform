id: datenstrukturen
title: Datenstrukturen
level: 2
minutes: 200
summary: Listen, Tupel, Dictionaries und Mengen gezielt auswählen, sicher kopieren, mit Comprehensions umformen, sortieren – und wissen, was jede Operation kostet.
goals:
  - Du wählst zwischen `list`, `tuple`, `dict` und `set` nach Zugriffsmuster und Laufzeit.
  - Du unterscheidest flache und tiefe Kopien und erkennst Aliasing-Fallen wie `[[0] * 3] * 3`.
  - Du schreibst lesbare List-, Dict- und Set-Comprehensions und weißt, wann eine Schleife besser ist.
  - Du sortierst mit `key`, `reverse` und nutzt die Stabilität der Sortierung für mehrstufige Sortierungen.
  - Du setzt `Counter`, `defaultdict`, `deque` und `namedtuple` passend ein.
