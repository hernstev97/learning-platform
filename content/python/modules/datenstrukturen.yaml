lesson: |
  Du bekommst eine Liste von 50 000 Bestellungen aus einer API. Du sollst Duplikate entfernen, nach Status gruppieren, die zehn häufigsten Produkte finden und prüfen, welche Kunden schon einmal bestellt haben. Mit einer Liste und ein paar verschachtelten Schleifen geht das auch – bis der Job statt zwei Sekunden zwei Stunden läuft oder ein geteiltes Objekt Daten quer durch das Programm verändert.

  Die eingebauten Datenstrukturen sind das wichtigste Werkzeug in Python. Diese Lektion zeigt für jede, **wofür** sie gebaut ist, was ihre Operationen kosten und wo das Objektmodell aus dem Einstieg zuschlägt: bei Kopien und verschachtelten Strukturen.

  ## Listen: geordnet und veränderlich

  Eine [Liste](https://docs.python.org/3/tutorial/datastructures.html#more-on-lists) ist ein dynamisches Array von Referenzen auf Objekte. Zugriff per Index und Anhängen am Ende sind schnell; Einfügen und Löschen am Anfang verschieben alle folgenden Elemente.

  ```python run
  tickets = ["Login-Bug", "Doku"]
  tickets.append("Release")          # ans Ende
  tickets.insert(0, "Hotfix")        # an Position 0 – verschiebt alles
  tickets.extend(["Review", "Test"]) # mehrere anhängen
  letztes = tickets.pop()            # entfernt und liefert das letzte
  tickets.remove("Doku")             # entfernt das erste passende Element
  print(tickets, letztes)
  print(tickets.index("Release"), "Review" in tickets, len(tickets))
  ```

  Achte auf eine Konvention: Methoden, die eine Liste **verändern** (`append`, `sort`, `reverse`, `extend`), geben `None` zurück. `tickets = tickets.sort()` ersetzt deine Liste deshalb durch `None`.

  ### Slicing

  `liste[start:stop:schritt]` liefert eine **neue** Liste ([Common Sequence Operations](https://docs.python.org/3/library/stdtypes.html#common-sequence-operations)). `stop` ist nicht enthalten, negative Indizes zählen vom Ende, weggelassene Grenzen bedeuten „vom Anfang“ bzw. „bis zum Ende“. Slicing funktioniert gleich für Strings und Tupel.

  ```python run
  logs = ["l0", "l1", "l2", "l3", "l4", "l5"]
  print(logs[:3])      # die ersten drei
  print(logs[-2:])     # die letzten zwei
  print(logs[1:5:2])   # jedes zweite von Index 1 bis 4
  print(logs[::-1])    # umgedreht
  print(logs[10:])     # [] – Slices werfen keinen IndexError
  ```

  ### Flache und tiefe Kopien

  `liste[:]`, `liste.copy()` und `list(liste)` erzeugen eine **flache Kopie**: eine neue Liste, deren Elemente aber dieselben Objekte sind. Bei Zahlen und Strings ist das egal, weil sie unveränderlich sind. Bei verschachtelten Listen oder Dictionaries teilen sich Original und Kopie die inneren Objekte. Eine **tiefe Kopie** mit [`copy.deepcopy`](https://docs.python.org/3/library/copy.html) kopiert rekursiv alles.

  ```python run
  import copy

  team = {"name": "api", "mitglieder": ["ada"]}
  flach = team.copy()
  tief = copy.deepcopy(team)

  flach["name"] = "web"                  # Neubindung in der Kopie – Original unberührt
  flach["mitglieder"].append("linus")    # Mutation des GETEILTEN inneren Objekts
  print(team)   # {'name': 'api', 'mitglieder': ['ada', 'linus']}
  print(tief)   # {'name': 'api', 'mitglieder': ['ada']}
  ```

  Die berühmteste Variante dieser Falle ist die „zweidimensionale Liste“ ([FAQ](https://docs.python.org/3/faq/programming.html#how-do-i-create-a-multidimensional-list)):

  ```python run
  raster = [[0] * 3] * 3       # EINE innere Liste, dreimal referenziert
  raster[0][0] = 1
  print(raster)                # [[1, 0, 0], [1, 0, 0], [1, 0, 0]]

  raster = [[0] * 3 for _ in range(3)]   # drei unabhängige innere Listen
  raster[0][0] = 1
  print(raster)                # [[1, 0, 0], [0, 0, 0], [0, 0, 0]]
  ```

  `*` vervielfacht Referenzen, nicht Objekte. `[0] * 3` ist harmlos, weil `0` unveränderlich ist; `[[0] * 3] * 3` enthält dreimal *dieselbe* Liste. Die Comprehension führt `[0] * 3` dagegen dreimal aus.

  ## Tupel: Packing und Unpacking

  Ein [Tupel](https://docs.python.org/3/tutorial/datastructures.html#tuples-and-sequences) ist eine unveränderliche Sequenz. Listen nimmst du für viele gleichartige Elemente, Tupel für einen **Datensatz fester Struktur**: eine Koordinate, ein Paar aus Name und Port, eine Zeile aus einer Datenbank. Das Komma macht das Tupel, nicht die Klammer – `(42,)` ist ein Tupel mit einem Element, `(42)` nur die Zahl.

  ```python run
  server = "db.intern", 5432           # Packing
  host, port = server                  # Unpacking
  print(host, port)

  a, b = 1, 2
  a, b = b, a                          # Tauschen ohne Hilfsvariable
  print(a, b)

  erster, *mitte, letzter = [3, 8, 1, 9, 4]   # Stern sammelt den Rest als Liste
  print(erster, mitte, letzter)

  for name, port in [("api", 8000), ("db", 5432)]:
      print(f"{name}:{port}")
  ```

  Weil Tupel unveränderlich sind, sind sie [hashbar](https://docs.python.org/3/glossary.html#term-hashable) – sofern auch ihre Elemente es sind – und taugen als Dictionary-Schlüssel. Das ist ideal für zusammengesetzte Schlüssel wie `(datum, filiale)`. Ein Tupel, das eine Liste enthält, ist nicht hashbar.

  > [!INTERVIEW] „Liste oder Tupel – was ist der Unterschied?“
  > Technisch: Listen sind veränderlich, Tupel nicht; Tupel sind deshalb hashbar und können Dictionary-Schlüssel sein. Konzeptionell: Eine Liste ist eine Sammlung gleichartiger Dinge variabler Länge, ein Tupel ein Datensatz, bei dem die Position die Bedeutung trägt – wie `(host, port)`. Für benannte Felder nimmt man `namedtuple` oder eine Dataclass.

  ## Dictionaries: Schlüssel auf Werte abbilden

  Ein [Dictionary](https://docs.python.org/3/library/stdtypes.html#mapping-types-dict) ist eine Hashtabelle: Aus dem Hash des Schlüssels berechnet Python, wo der Wert liegt. Nachschlagen, Einfügen und Löschen kosten daher im Mittel konstante Zeit, egal wie groß das Dictionary ist. Schlüssel müssen hashbar sein; Werte dürfen alles sein. Seit Python 3.7 ist garantiert, dass Dictionaries die **Einfügereihenfolge** behalten.

  ```python run
  lager = {"SKU-1": 12, "SKU-2": 0}
  lager["SKU-3"] = 5                     # einfügen oder überschreiben
  print(lager.get("SKU-9", 0))           # 0 statt KeyError
  print("SKU-2" in lager)                # prüft Schlüssel, nicht Werte

  for sku, bestand in lager.items():     # Schlüssel und Wert zusammen
      if bestand == 0:
          print(f"{sku} nachbestellen")

  standard = {"timeout": 30, "retries": 3}
  nutzer = {"timeout": 10}
  print(standard | nutzer)               # rechts gewinnt: {'timeout': 10, 'retries': 3}
  ```

  - `d[k]` wirft `KeyError`, wenn der Schlüssel fehlt; [`d.get(k, standard)`](https://docs.python.org/3/library/stdtypes.html#dict.get) nicht.
  - [`d.setdefault(k, standard)`](https://docs.python.org/3/library/stdtypes.html#dict.setdefault) liefert den Wert und legt ihn vorher an, falls er fehlt – praktisch zum Gruppieren, aber `defaultdict` liest sich meist besser.
  - `|` und `|=` verbinden Dictionaries (seit 3.9, [PEP 584](https://peps.python.org/pep-0584/)); bei gleichen Schlüsseln gewinnt der rechte Operand.
  - `keys()`, `values()` und `items()` liefern [Views](https://docs.python.org/3/library/stdtypes.html#dict-views), die Änderungen am Dictionary widerspiegeln. Während du über ein Dictionary iterierst, darfst du keine Schlüssel hinzufügen oder entfernen – sonst `RuntimeError: dictionary changed size during iteration`.

  > [!DEEP] Warum Schlüssel unveränderlich sein müssen
  > Der Hash bestimmt, in welchem Fach der Hashtabelle ein Eintrag liegt. Würde sich ein Schlüssel nach dem Einfügen ändern, stimmte sein Hash nicht mehr, und der Eintrag wäre unauffindbar. Deshalb sind Listen nicht hashbar. Die FAQ erklärt das unter [„Why must dictionary keys be immutable?“](https://docs.python.org/3/faq/design.html#why-must-dictionary-keys-be-immutable).

  ## Mengen: eindeutig und schnell prüfbar

  Ein [Set](https://docs.python.org/3/library/stdtypes.html#set-types-set-frozenset) ist eine ungeordnete Sammlung eindeutiger, hashbarer Elemente – intern eine Hashtabelle ohne Werte. Es beantwortet zwei Fragen schnell: „Ist x enthalten?“ und „Was haben zwei Mengen gemeinsam?“

  ```python run
  gestern = {"ada", "linus", "grace"}
  heute = {"linus", "grace", "guido"}
  print(sorted(heute - gestern))   # neu dazugekommen
  print(sorted(gestern - heute))   # weggefallen
  print(sorted(heute & gestern))   # in beiden
  print(sorted(heute | gestern))   # alle
  print(sorted(heute ^ gestern))   # in genau einer

  leer = set()                     # {} wäre ein leeres Dictionary!
  emails = ["a@x.de", "b@x.de", "a@x.de"]
  print(len(set(emails)))          # 2 eindeutige Adressen
  print(list(dict.fromkeys(emails)))  # eindeutig UND in Originalreihenfolge
  ```

  Die Reihenfolge der Elemente eines Sets ist nicht festgelegt und kann sich bei Strings sogar von Programmlauf zu Programmlauf ändern. Deshalb stehen oben überall `sorted(…)`. Brauchst du Eindeutigkeit **und** Reihenfolge, nutze `dict.fromkeys`. Die unveränderliche Variante `frozenset` ist hashbar und kann selbst in Sets oder als Schlüssel stehen.

  ## Comprehensions

  [Comprehensions](https://docs.python.org/3/tutorial/datastructures.html#list-comprehensions) bauen eine neue Liste, ein Set oder ein Dictionary aus einem Iterable – in einem Ausdruck statt einer Schleife mit `append`:

  ```python run
  bestellungen = [
      {"id": 1, "status": "bezahlt", "summe": 120},
      {"id": 2, "status": "offen", "summe": 80},
      {"id": 3, "status": "bezahlt", "summe": 45},
  ]

  ids = [b["id"] for b in bestellungen]                           # Liste
  bezahlt = [b["id"] for b in bestellungen if b["status"] == "bezahlt"]   # Filter
  stati = {b["status"] for b in bestellungen}                     # Set
  summe_nach_id = {b["id"]: b["summe"] for b in bestellungen}     # Dict
  labels = ["groß" if b["summe"] > 100 else "klein" for b in bestellungen]  # bedingter Ausdruck
  print(ids, bezahlt, sorted(stati), summe_nach_id, labels, sep="\n")

  matrix = [[1, 2], [3, 4], [5, 6]]
  flach = [zahl for zeile in matrix for zahl in zeile]   # for-Teile wie verschachtelte Schleifen
  print(flach)
  ```

  Zwei Formen nicht verwechseln: Ein `if` **am Ende** filtert Elemente heraus. Ein `a if … else b` **vorne** entscheidet für jedes Element, welcher Wert entsteht. Bei mehreren `for`-Teilen gilt dieselbe Reihenfolge wie bei [verschachtelten Schleifen](https://docs.python.org/3/tutorial/datastructures.html#nested-list-comprehensions): der äußere zuerst.

  Wann lieber keine Comprehension? Wenn sie mehr als zwei `for`-Teile oder Bedingungen braucht, wenn du sie nur wegen Seiteneffekten schreibst (`[print(x) for x in …]`) oder wenn eine Schleife mit gut benannten Zwischenschritten lesbarer ist. Brauchst du das Ergebnis nur einmal, etwa für `sum`, genügt ein Generator-Ausdruck ohne eckige Klammern: `sum(b["summe"] for b in bestellungen)` – mehr dazu im Modul Iteratoren.

  ## Sortieren

  [`sorted(iterable)`](https://docs.python.org/3/library/functions.html#sorted) liefert eine neue Liste und akzeptiert jedes Iterable; [`liste.sort()`](https://docs.python.org/3/library/stdtypes.html#list.sort) sortiert in place und gibt `None` zurück. Beide nehmen `key` – eine Funktion, die für jedes Element den Vergleichswert liefert – und `reverse=True`.

  Wichtig für die Praxis: Pythons Sortierung ist [**stabil**](https://docs.python.org/3/howto/sorting.html#sort-stability-and-complex-sorts). Elemente mit gleichem Schlüssel behalten ihre bisherige Reihenfolge – auch mit `reverse=True`. Damit gibt es zwei Wege zu einer mehrstufigen Sortierung:

  ```python run
  tickets = [
      ("Absturz", 1, "linus"),
      ("Doku", 3, "ada"),
      ("Login", 1, "ada"),
      ("Farbe", 3, "grace"),
  ]

  # 1. Ein Tupel als Schlüssel: erst Priorität, dann Name
  print(sorted(tickets, key=lambda t: (t[1], t[2])))

  # 2. Mehrere stabile Durchläufe: erst nach dem NEBENkriterium, dann nach dem Hauptkriterium
  nach_person = sorted(tickets, key=lambda t: t[2])
  print(sorted(nach_person, key=lambda t: t[1], reverse=True))

  # Absteigend nach Zahl, aufsteigend nach Text: Zahl negieren
  print(sorted(tickets, key=lambda t: (-t[1], t[0])))
  ```

  Das [Sorting HOWTO](https://docs.python.org/3/howto/sorting.html) zeigt außerdem `operator.itemgetter` und `attrgetter` als schnellere Alternative zu einfachen Lambdas.

  ## Das Modul `collections`

  Vier Klassen aus [`collections`](https://docs.python.org/3/library/collections.html) ersetzen viel handgeschriebenen Code:

  ```python run
  from collections import Counter, defaultdict, deque, namedtuple

  # Counter: Häufigkeiten zählen
  status_codes = [200, 404, 200, 500, 200, 404]
  zaehler = Counter(status_codes)
  print(zaehler.most_common(2))        # [(200, 3), (404, 2)]
  print(zaehler[301])                  # 0 – fehlende Schlüssel zählen als 0

  # defaultdict: fehlende Schlüssel automatisch anlegen
  nach_status = defaultdict(list)
  for bestell_id, status in [(1, "offen"), (2, "bezahlt"), (3, "offen")]:
      nach_status[status].append(bestell_id)
  print(dict(nach_status))             # {'offen': [1, 3], 'bezahlt': [2]}

  # deque: schnelle Operationen an beiden Enden, optional mit Maximallänge
  letzte = deque(maxlen=3)
  for zeile in ["a", "b", "c", "d"]:
      letzte.append(zeile)             # das älteste fällt automatisch heraus
  print(list(letzte))                  # ['b', 'c', 'd']

  # namedtuple: Tupel mit benannten Feldern
  Server = namedtuple("Server", ["host", "port"])
  db = Server("db.intern", 5432)
  print(db.host, db.port, db)
  ```

  - [`Counter`](https://docs.python.org/3/library/collections.html#collections.Counter) ist ein Dictionary von Element auf Anzahl. `most_common(n)` liefert die häufigsten; bei Gleichstand in der Reihenfolge des ersten Auftretens.
  - [`defaultdict(fabrik)`](https://docs.python.org/3/library/collections.html#collections.defaultdict) ruft `fabrik()` auf, wenn ein Schlüssel fehlt – `list`, `int` oder `set` sind typisch. Achtung: Schon das *Lesen* eines fehlenden Schlüssels legt ihn an.
  - [`deque`](https://docs.python.org/3/library/collections.html#collections.deque) hat `appendleft` und `popleft` in konstanter Zeit – für Warteschlangen. `liste.pop(0)` muss dagegen alle Elemente verschieben.
  - [`namedtuple`](https://docs.python.org/3/library/collections.html#collections.namedtuple) macht Tupel lesbarer. Für veränderliche Datensätze mit Typangaben sind Dataclasses die modernere Wahl (Modul OOP).

  ## Was kostet welche Operation?

  Die Laufzeit hängt nicht an der Syntax, sondern an der Datenstruktur dahinter. Die [Tabelle im Python-Wiki](https://wiki.python.org/moin/TimeComplexity) listet alles; diese Zeilen solltest du auswendig können:

  | Operation | `list` | `set` / `dict` |
  | --- | --- | --- |
  | `x in sammlung` | O(n) – durchsucht alles | O(1) im Mittel – Hash |
  | Zugriff `a[i]` bzw. `d[k]` | O(1) | O(1) im Mittel |
  | Anhängen am Ende | O(1) amortisiert | O(1) im Mittel |
  | Einfügen/Löschen am Anfang | O(n) | – (`deque`: O(1)) |
  | Sortieren | O(n log n) | – |

  ```python run
  import timeit

  ids_liste = list(range(100_000))
  ids_menge = set(ids_liste)
  liste_zeit = timeit.timeit(lambda: 99_999 in ids_liste, number=200)
  menge_zeit = timeit.timeit(lambda: 99_999 in ids_menge, number=200)
  print(f"Liste: {liste_zeit:.4f} s, Set: {menge_zeit:.6f} s")
  ```

  Der typische Fehler steckt in einer harmlos aussehenden Zeile: `if kunde in bekannte_kunden:` innerhalb einer Schleife. Ist `bekannte_kunden` eine Liste, wird aus O(n) plötzlich O(n · m). Bei 50 000 × 50 000 sind das 2,5 Milliarden Vergleiche. Ein einmal gebautes Set macht daraus rund 100 000 Operationen.

  > [!MERKE]
  > Mitgliedschaftstests in Schleifen gehören auf ein `set` oder `dict`, nie auf eine Liste. Das Set einmal *vor* der Schleife bauen.

  ## Häufige Fehler

  - **`liste = liste.sort()`.** Verändernde Methoden geben `None` zurück. Entweder `liste.sort()` oder `liste = sorted(liste)`.
  - **`[[0] * n] * m`.** Erzeugt `m` Referenzen auf dieselbe Liste. Nimm eine Comprehension.
  - **Flache Kopie bei verschachtelten Daten.** `config.copy()` kopiert nur die äußerste Ebene. Für unabhängige verschachtelte Daten `copy.deepcopy`.
  - **Liste verändern, während du über sie iterierst.** `for t in tickets: tickets.remove(t)` überspringt Elemente. Baue eine neue Liste per Comprehension oder iteriere über eine Kopie.
  - **`{}` für ein leeres Set.** Das ist ein Dictionary. Leeres Set: `set()`.
  - **Liste als Dictionary-Schlüssel.** `TypeError: unhashable type: 'list'`. Nimm ein Tupel.
  - **`d[k]` für optionale Schlüssel.** `KeyError`. Nimm `d.get(k)` oder prüfe mit `in`.

  > [!PRAXIS]
  > In Code-Reviews und Performance-Analysen tauchen dieselben Muster auf: `in` auf Listen in Schleifen, `list.pop(0)` als Warteschlange, handgeschriebene Zähl-Dictionaries statt `Counter` und tief verschachtelte Comprehensions, die niemand mehr lesen kann. Im Coding-Interview ist die erste Optimierung fast immer dieselbe: „Kann ich mit einem Set oder Dictionary eine innere Schleife sparen?“ – das Modul Algorithmen baut darauf auf.

  ## Zusammenfassung

  - `list` für geordnete, veränderliche Sammlungen; `tuple` für feste Datensätze und als hashbare Schlüssel.
  - `dict` bildet Schlüssel auf Werte ab, behält die Einfügereihenfolge und schlägt in O(1) nach. `get`, `setdefault`, `items` und `|` gehören zum Alltag.
  - `set` für Eindeutigkeit, schnelle `in`-Tests und Mengenoperationen. Reihenfolge ist nicht garantiert.
  - Slicing und `copy()` erzeugen flache Kopien; verschachtelte Daten brauchen `deepcopy`. `*` vervielfacht Referenzen.
  - Comprehensions für einfache Umformungen und Filter – bei Komplexität lieber eine Schleife.
  - `sorted` liefert eine neue Liste, `sort` sortiert in place und gibt `None` zurück. Die Sortierung ist stabil.
  - `Counter`, `defaultdict`, `deque` und `namedtuple` ersetzen viel eigenen Code.
exercises:
  - id: hashbar-und-reihenfolge
    type: choice
    title: Was darf Schlüssel sein?
    prompt: Welche Aussagen stimmen?
    options:
      - text: "`{(2026, \"Berlin\"): 12}` ist ein gültiges Dictionary."
        correct: true
        why: Ein Tupel aus unveränderlichen Elementen ist hashbar und damit ein gültiger Schlüssel.
      - text: "`{[2026, \"Berlin\"]: 12}` ist ein gültiges Dictionary."
        correct: false
        why: "Listen sind veränderlich und nicht hashbar: `TypeError: unhashable type: 'list'`."
      - text: "`x = {}` erzeugt ein leeres Set."
        correct: false
        why: "`{}` ist ein leeres Dictionary. Ein leeres Set entsteht nur mit `set()`."
      - text: Ein Dictionary liefert seine Schlüssel beim Iterieren in Einfügereihenfolge.
        correct: true
        why: Das ist seit Python 3.7 Teil der Sprachgarantie, nicht nur ein Implementierungsdetail.
      - text: Ein Set liefert seine Elemente beim Iterieren in Einfügereihenfolge.
        correct: false
        why: Die Reihenfolge eines Sets ist nicht festgelegt. Für Eindeutigkeit mit Reihenfolge nimmst du `dict.fromkeys`.
    explanation: |
      Dictionaries und Sets sind Hashtabellen. Schlüssel bzw. Elemente müssen hashbar sein, damit ihr Platz in der Tabelle stabil bleibt – deshalb Tupel ja, Listen nein. Dictionaries garantieren seit 3.7 die Einfügereihenfolge, Sets nicht.
