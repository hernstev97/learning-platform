lesson: |
  Ein Skript holt Preise von 400 Produktseiten. Jede Anfrage dauert 300 ms, fast nur Warten auf das Netz. Nacheinander sind das zwei Minuten, in denen die CPU sich langweilt. Ein anderes Skript berechnet Prüfsummen für 10 000 Bilder in reinem Python. Hier wartet niemand, die CPU rechnet die ganze Zeit. Beide sollen schneller werden – und die Lösung ist jeweils eine andere.

  Python bietet drei Werkzeuge: Threads, Prozesse und asyncio. Welches passt, hängt an zwei Fragen: Worauf wartet das Programm? Und was darf gleichzeitig passieren? Diese Lektion baut das Denkmodell dafür auf, bevor sie in die APIs geht.

  ## Nebenläufig, parallel, I/O-bound, CPU-bound

  **Nebenläufigkeit** (Concurrency) heißt: Mehrere Aufgaben sind gleichzeitig *in Arbeit* und wechseln sich ab. Ein Koch, der Nudelwasser aufsetzt und währenddessen Gemüse schneidet, arbeitet nebenläufig. **Parallelität** heißt: Mehrere Aufgaben laufen im selben Moment auf mehreren CPU-Kernen – zwei Köche.

  Die zweite Unterscheidung betrifft die Last:

  - **I/O-bound:** Das Programm wartet die meiste Zeit auf Netz, Festplatte oder Datenbank. Mehr Kerne helfen nicht, geschicktes Warten schon. Nebenläufigkeit reicht.
  - **CPU-bound:** Das Programm rechnet. Nur echte Parallelität auf mehreren Kernen macht es schneller.

  Bevor du etwas parallelisierst, miss, wo die Zeit hingeht (etwa mit [`cProfile`](https://docs.python.org/3/library/profile.html)). Oft ist die schnellste Lösung eine Datenbankabfrage statt 400 einzelner.

  ## Threads und der GIL

  Ein [Thread](https://docs.python.org/3/library/threading.html) ist ein eigener Ausführungsstrang im selben Prozess. Alle Threads teilen sich den Speicher – das macht sie billig und gefährlich zugleich.

  ```python
  import threading
  import time

  def lade(url: str) -> None:
      time.sleep(0.3)                  # steht für eine Netzwerkanfrage
      print("fertig:", url)

  threads = [threading.Thread(target=lade, args=(f"https://shop.example/p/{i}",)) for i in range(4)]
  for t in threads:
      t.start()                        # startet den Thread, kehrt sofort zurück
  for t in threads:
      t.join()                         # wartet, bis der Thread fertig ist
  # dauert ~0,3 s statt 1,2 s
  ```

  In der Standard-Implementierung CPython gibt es den **Global Interpreter Lock** (GIL, [Glossar](https://docs.python.org/3/glossary.html#term-global-interpreter-lock)): Zu jedem Zeitpunkt führt nur ein Thread Python-Bytecode aus. Der GIL wird abgegeben, wenn ein Thread blockierend wartet (Socket, Datei, `time.sleep`), und außerdem regelmäßig, damit andere Threads drankommen (alle 5 ms, siehe [`sys.setswitchinterval`](https://docs.python.org/3/library/sys.html#sys.setswitchinterval)). Daraus folgt:

  - Für **I/O-bound** Arbeit helfen Threads, weil während des Wartens andere Threads laufen.
  - Für **CPU-bound** Arbeit in reinem Python helfen Threads im Standard-Build nicht – sie wechseln sich nur ab. Ausnahme: C-Erweiterungen wie `hashlib` oder NumPy, die den GIL während langer Berechnungen freigeben.

  ### Race Conditions: Was der GIL nicht schützt

  Der GIL schützt die internen Datenstrukturen des Interpreters, **nicht deine Logik**. `zaehler += 1` besteht aus Lesen, Addieren und Zurückschreiben. Wechselt der Thread zwischen Lesen und Schreiben, überschreibt er später das Ergebnis des anderen – eine **Race Condition**:

  ```python
  import threading

  class Zaehler:
      def __init__(self) -> None:
          self.wert = 0
          self._lock = threading.Lock()

      def erhoehe_unsicher(self) -> None:
          self.wert += 1               # lesen, addieren, schreiben – unterbrechbar

      def erhoehe(self) -> None:
          with self._lock:             # nur ein Thread gleichzeitig in diesem Block
              self.wert += 1

  z = Zaehler()
  def arbeite() -> None:
      for _ in range(100_000):
          z.erhoehe()

  threads = [threading.Thread(target=arbeite) for _ in range(8)]
  for t in threads: t.start()
  for t in threads: t.join()
  print(z.wert)                        # mit Lock garantiert 800000
  ```

  Mit `erhoehe_unsicher` *kann* weniger herauskommen. Ob und wie oft du das beobachtest, hängt von Python-Version, Build und Timing ab – im Standard-Build von CPython seltener, im free-threaded Build deutlich häufiger. Der Code ist in jedem Fall falsch. Ein Bug, der nur manchmal auftritt, ist schlimmer als einer, der immer auftritt.

  Zwei Werkzeuge lösen die meisten Fälle:

  - Ein [`threading.Lock`](https://docs.python.org/3/library/threading.html#lock-objects) mit `with` schützt einen kritischen Abschnitt. Halte ihn kurz und rufe darin keine langsamen Funktionen auf.
  - Eine [`queue.Queue`](https://docs.python.org/3/library/queue.html#queue.Queue) ist bereits threadsicher. Statt gemeinsamen Zustand zu teilen, schicken Produzenten Aufgaben in die Queue, und Worker holen sie ab. Diese Architektur vermeidet die meisten Locks.

  ### Free-threaded Python (3.13 und 3.14)

  [PEP 703](https://peps.python.org/pep-0703/) macht den GIL optional. Der Stand genau:

  - **Python 3.13** brachte einen separaten, **experimentellen** free-threaded Build (typisch installiert als `python3.13t`).
  - **Python 3.14** hat den Build laut [PEP 779](https://peps.python.org/pep-0779/) **offiziell unterstützt, aber optional** gemacht („Phase II“). Der Standard-Build hat weiterhin einen GIL. Laut [What's New in 3.14](https://docs.python.org/3/whatsnew/3.14.html#whatsnew314-free-threaded-cpython) kostet der free-threaded Modus einfädigen Code etwa 5–10 % Leistung.
  - Ob er irgendwann Standard wird (Phase III), entscheidet ein künftiger PEP.
  - Importierst du eine C-Erweiterung, die nicht als kompatibel markiert ist, kann der Interpreter den GIL wieder einschalten. `sys._is_gil_enabled()` verrät den aktuellen Zustand; die Umgebungsvariable [`PYTHON_GIL`](https://docs.python.org/3/using/cmdline.html#envvar-PYTHON_GIL) erzwingt ihn.

  Für dich heißt das: Im free-threaded Build laufen Threads auch bei CPU-Arbeit parallel. Race Conditions, die bisher selten waren, treten dort öfter auf. Sauber synchronisierter Code funktioniert in beiden Builds. Der [HOWTO](https://docs.python.org/3/howto/free-threading-python.html) beschreibt Details und bekannte Einschränkungen.

  ## Prozesse und concurrent.futures

  Für CPU-bound Arbeit im Standard-Build startest du mehrere **Prozesse**. Jeder hat einen eigenen Interpreter, eigenen Speicher und eigenen GIL. Der Preis:

  - **Start-Overhead.** Einen Prozess zu starten kostet Millisekunden bis zu einer Sekunde.
  - **Kein geteilter Speicher.** Argumente und Ergebnisse werden mit [`pickle`](https://docs.python.org/3/library/pickle.html) serialisiert und zwischen den Prozessen kopiert. Lambdas, lokal definierte Funktionen und offene Verbindungen lassen sich nicht übertragen.
  - **Start-Methode.** Unter Linux ist seit Python 3.14 `forkserver` statt `fork` voreingestellt, unter macOS und Windows `spawn` ([Start-Methoden](https://docs.python.org/3/library/multiprocessing.html#contexts-and-start-methods)). In jedem Fall gehört der Startcode hinter `if __name__ == "__main__":`, weil die Kindprozesse dein Modul importieren.

  Statt `threading` und `multiprocessing` direkt zu benutzen, greifst du meist zu [`concurrent.futures`](https://docs.python.org/3/library/concurrent.futures.html). Es bietet für Threads und Prozesse dieselbe API:

  ```python
  from concurrent.futures import ProcessPoolExecutor, ThreadPoolExecutor, as_completed
  import hashlib
  from pathlib import Path

  def pruefsumme(pfad: Path) -> str:                      # CPU-bound
      return hashlib.sha256(pfad.read_bytes()).hexdigest()

  def lade_seite(url: str) -> str: ...                     # I/O-bound

  if __name__ == "__main__":
      bilder = sorted(Path("bilder").glob("*.jpg"))
      with ProcessPoolExecutor() as pool:                  # ein Prozess pro Kern
          # map: Ergebnisse in Reihenfolge der Eingabe
          for pfad, summe in zip(bilder, pool.map(pruefsumme, bilder, chunksize=64)):
              print(pfad.name, summe[:12])

      urls = [f"https://shop.example/p/{i}" for i in range(400)]
      with ThreadPoolExecutor(max_workers=20) as pool:
          futures = {pool.submit(lade_seite, url): url for url in urls}
          for future in as_completed(futures):             # in Reihenfolge der Fertigstellung
              url = futures[future]
              try:
                  html = future.result()                    # wirft die Exception des Tasks
              except OSError as fehler:
                  print("Fehler bei", url, fehler)
  ```

  Das Denkmodell dahinter: `submit` gibt sofort ein [`Future`](https://docs.python.org/3/library/concurrent.futures.html#future-objects) zurück – ein Versprechen auf ein Ergebnis. `result()` wartet darauf und wirft die Exception, falls der Task gescheitert ist. [`Executor.map`](https://docs.python.org/3/library/concurrent.futures.html#concurrent.futures.Executor.map) liefert die Ergebnisse in Eingabereihenfolge und wirft eine Exception erst, wenn du beim Iterieren an das betroffene Ergebnis kommst. [`as_completed`](https://docs.python.org/3/library/concurrent.futures.html#concurrent.futures.as_completed) liefert Futures, sobald sie fertig sind. `chunksize` bündelt bei Prozessen viele kleine Aufgaben, damit nicht jede einzeln gepickelt und verschickt wird. Seit 3.14 gibt es zusätzlich `InterpreterPoolExecutor`, der mehrere Interpreter in einem Prozess nutzt.

  ## asyncio: ein Thread, eine Event-Loop

  asyncio geht einen anderen Weg: **ein** Thread, in dem eine **Event-Loop** viele Coroutinen abwechselnd ausführt. Eine Coroutine (`async def`) läuft, bis sie an einem `await` auf etwas wartet. Dann gibt sie die Kontrolle an die Loop zurück, und die Loop setzt eine andere Coroutine fort, deren Daten inzwischen da sind. Kein Thread-Wechsel mitten in einer Zeile: Zwischen zwei `await` läuft dein Code ungestört. Das macht viele Race Conditions unmöglich und skaliert auf Tausende gleichzeitige Verbindungen. Wer JavaScript kennt: Es ist dasselbe Modell wie `async`/`await` mit Promises.

  ```python run
  import asyncio
  import time

  async def hole(url: str, dauer: float) -> str:
      await asyncio.sleep(dauer)           # steht für eine Netzwerkanfrage
      return f"{url}: 200"

  async def main() -> None:
      start = time.perf_counter()
      ergebnisse = await asyncio.gather(   # alle drei laufen nebenläufig
          hole("/nutzer", 0.3),
          hole("/bestellungen", 0.2),
          hole("/nachrichten", 0.1),
      )
      print(ergebnisse)                    # Reihenfolge wie die Argumente
      print(f"{time.perf_counter() - start:.1f} s")   # ~0.3 s, nicht 0.6 s

  # In einem Skript: asyncio.run(main())
  # Hier läuft bereits eine Event-Loop, deshalb direkt:
  await main()
  ```

  Drei Regeln, die du aus dem Modell ableiten kannst:

  1. **Ein Aufruf von `hole(...)` führt nichts aus.** Er erzeugt ein Coroutine-Objekt. Erst `await`, `gather` oder ein Task lassen es laufen. Ein vergessenes `await` ist der häufigste asyncio-Fehler (Python warnt mit `RuntimeWarning: coroutine ... was never awaited`).
  2. **In Skripten startet [`asyncio.run(main())`](https://docs.python.org/3/library/asyncio-runner.html#asyncio.run) die Loop**, genau einmal, ganz außen. Innerhalb laufender Loops (Jupyter, FastAPI, hier im Browser) rufst du es nicht auf.
  3. **Nichts Blockierendes in Coroutinen.** `time.sleep(1)`, `requests.get(...)` oder eine lange Berechnung halten die ganze Loop an – alle anderen Coroutinen stehen still. Nimm asynchrone Bibliotheken (`httpx`, `asyncpg`) oder verlagere blockierende Aufrufe mit [`asyncio.to_thread`](https://docs.python.org/3/library/asyncio-task.html#asyncio.to_thread) in einen Thread.

  ### Tasks, TaskGroup, Timeouts, Semaphore

  [`asyncio.create_task(coro)`](https://docs.python.org/3/library/asyncio-task.html#asyncio.create_task) plant eine Coroutine sofort ein und gibt ein `Task`-Objekt zurück. Die Dokumentation verlangt, eine Referenz auf den Task zu behalten, sonst kann er mitten in der Ausführung verschwinden. Seit 3.11 ist eine [`TaskGroup`](https://docs.python.org/3/library/asyncio-task.html#task-groups) der empfohlene Weg: Sie wartet am Ende des `async with`-Blocks auf alle Tasks. Scheitert einer, bricht sie die übrigen ab und wirft eine `ExceptionGroup` – das nennt man **Structured Concurrency**.

  ```python run
  import asyncio

  async def hole_kurs(waehrung: str) -> float:
      await asyncio.sleep(0.05)
      return {"USD": 1.08, "GBP": 0.84}[waehrung]

  async def langsamer_dienst() -> str:
      await asyncio.sleep(5)
      return "zu spät"

  async def main() -> None:
      async with asyncio.TaskGroup() as tg:
          usd = tg.create_task(hole_kurs("USD"))
          gbp = tg.create_task(hole_kurs("GBP"))
      print(usd.result(), gbp.result())            # beide fertig nach dem Block

      try:
          async with asyncio.timeout(0.1):         # seit 3.11
              await langsamer_dienst()
      except TimeoutError:
          print("Timeout – Fallback benutzen")

      limit = asyncio.Semaphore(2)                 # höchstens 2 gleichzeitig
      async def hole_begrenzt(n: int) -> int:
          async with limit:
              await asyncio.sleep(0.05)
              return n * n
      print(await asyncio.gather(*(hole_begrenzt(n) for n in range(5))))

      ergebnisse = await asyncio.gather(hole_kurs("USD"), hole_kurs("JPY"), return_exceptions=True)
      print(ergebnisse)                            # Exception als Wert statt Abbruch

  await main()
  ```

  - [`asyncio.timeout`](https://docs.python.org/3/library/asyncio-task.html#asyncio.timeout) bricht den Block nach der Frist ab und wirft `TimeoutError`. Jeder Netzwerkaufruf in Produktion braucht ein Timeout.
  - Ein [`Semaphore`](https://docs.python.org/3/library/asyncio-sync.html#asyncio.Semaphore) begrenzt, wie viele Coroutinen gleichzeitig einen Abschnitt betreten. 400 Anfragen gleichzeitig an einen fremden Server sind unhöflich und führen zu Rate-Limits; mit `Semaphore(10)` bleiben es zehn.
  - [`gather(..., return_exceptions=True)`](https://docs.python.org/3/library/asyncio-task.html#asyncio.gather) liefert Exceptions als Elemente der Ergebnisliste. Ohne die Option wirft `gather` die erste Exception, die übrigen Coroutinen laufen aber weiter.

  > [!WARNING] Blockierender Code in async
  > Ein `requests.get()` oder `time.sleep()` in einem FastAPI-Endpunkt mit `async def` blockiert den ganzen Worker: Während es wartet, bedient er keinen anderen Request. Entweder asynchrone Bibliotheken benutzen, `await asyncio.to_thread(blockierende_funktion, arg)` schreiben oder den Endpunkt als normales `def` deklarieren (dann führt FastAPI ihn in einem Thread-Pool aus). Der [asyncio-Entwicklerleitfaden](https://docs.python.org/3/library/asyncio-dev.html#running-blocking-code) beschreibt, wie der Debug-Modus solche Stellen findet.

  ## Abbruch in asyncio: Cancellation

  Ein Nutzer schließt den Tab, ein Timeout läuft ab, der Server fährt herunter, ein Geschwister-Task scheitert: In asyncio-Programmen wird ständig abgebrochen. Wer das nicht sauber behandelt, hat Tasks, die nicht enden, oder Aufräumcode, der nie läuft.

  [`task.cancel()`](https://docs.python.org/3/library/asyncio-task.html#asyncio.Task.cancel) bricht nichts sofort ab. Es **bittet** um Abbruch: Beim nächsten Durchlauf der Loop wirft asyncio eine [`CancelledError`](https://docs.python.org/3/library/asyncio-exceptions.html#asyncio.CancelledError) an die Stelle, an der die Coroutine gerade wartet. Danach hat sie die Gelegenheit, aufzuräumen.

  ```python run
  import asyncio

  log = []

  async def job(gestartet: asyncio.Event) -> None:
      log.append("job: start")
      try:
          gestartet.set()
          await asyncio.sleep(3600)              # steht für einen langen Aufruf
      except asyncio.CancelledError:
          log.append("job: Abbruch erhalten")
          raise                                  # immer erneut auslösen
      finally:
          log.append("job: aufgeräumt")

  gestartet = asyncio.Event()
  task = asyncio.create_task(job(gestartet))
  await gestartet.wait()                         # erst abbrechen, wenn der Task im await hängt
  task.cancel()
  try:
      await task                                 # wer den Task abwartet, bekommt die CancelledError
  except asyncio.CancelledError:
      log.append("main: Task abgebrochen")
  print(task.cancelled(), log)
  ```

  Drei Regeln folgen aus dem Mechanismus:

  1. **`CancelledError` ist keine `Exception`.** Die Klasse erbt seit Python 3.8 von `BaseException`. Ein `except Exception` lässt den Abbruch durch, ein nacktes `except:`, `except BaseException` und `except (Exception, asyncio.CancelledError)` fangen ihn.
  2. **Aufräumen ja, verschlucken nein.** Gib Ressourcen in `finally` frei. Fängst du die `CancelledError` doch, löse sie danach mit `raise` erneut aus. Die Dokumentation nennt das Unterdrücken „actively discouraged“; wer es trotzdem tut, muss zusätzlich [`Task.uncancel()`](https://docs.python.org/3/library/asyncio-task.html#asyncio.Task.uncancel) aufrufen.
  3. **Abbruch greift nur an einem `await`.** Eine Schleife ohne `await` läuft weiter, bis sie fertig ist. `cancel()` setzt nur eine Anfrage, das Ergebnis siehst du erst, wenn du den Task abwartest (`task.cancelled()` ist dann `True`).

  > [!WARNING] Verschluckte Abbrüche hängen den Shutdown auf
  > `except (Exception, asyncio.CancelledError): log.exception(...)` in einer Worker-Schleife wirkt wie Robustheit. Tatsächlich ignoriert der Worker jeden `cancel()`. Der Shutdown wartet auf Tasks, die nie enden, `asyncio.timeout` löst keinen `TimeoutError` mehr aus, und eine `TaskGroup` hängt. Fange in Schleifen `Exception`, nie die `CancelledError`.

  Ein Task, der verschluckt, bleibt am Leben:

  ```python run
  import asyncio

  async def sauber(bereit: asyncio.Event) -> None:
      bereit.set()
      await asyncio.sleep(3600)                  # CancelledError fliegt durch

  async def stur(bereit: asyncio.Event) -> str:
      try:
          bereit.set()
          await asyncio.sleep(3600)
      except asyncio.CancelledError:
          pass                                   # verschluckt: der Task läuft normal weiter
      return "weitergemacht"

  async def abbrechen(koro) -> asyncio.Task:
      bereit = asyncio.Event()
      task = asyncio.create_task(koro(bereit))
      await bereit.wait()
      task.cancel()
      await asyncio.wait({task})                 # wartet, ohne die Ausnahme zu werfen
      return task

  print((await abbrechen(sauber)).cancelled())   # True
  t = await abbrechen(stur)
  print(t.cancelled(), t.result())               # False weitergemacht
  ```

  ### shield: der Aufrufer darf weg, die Arbeit nicht

  [`asyncio.shield(task)`](https://docs.python.org/3/library/asyncio-task.html#asyncio.shield) schützt einen Task davor, mit seinem Aufrufer abgebrochen zu werden. Der Aufrufer bekommt trotzdem eine `CancelledError`, der innere Task läuft weiter. Das passt für Schritte, die zu Ende laufen müssen, etwa das Speichern einer bezahlten Bestellung.

  ```python
  async def speichere_bestellung(db, bestellung) -> None:
      schreiben = asyncio.create_task(db.schreibe(bestellung))   # Referenz behalten
      await asyncio.shield(schreiben)    # bricht der Aufrufer ab, läuft das Schreiben weiter
  ```

  Behalte eine Referenz auf den inneren Task, wie es die Dokumentation verlangt. `shield` ist eine Ausnahme, keine Gewohnheit: Ein geschützter Task, der beim Herunterfahren noch läuft, hält den Shutdown auf.

  ### Wenn ein Task in der TaskGroup scheitert

  Die [`TaskGroup`](https://docs.python.org/3/library/asyncio-task.html#task-groups) ist Structured Concurrency: Alle Tasks leben und enden innerhalb des `async with`-Blocks. Scheitert einer mit einer Exception, passiert nach der Dokumentation Folgendes:

  1. Die übrigen Tasks der Gruppe werden abgebrochen.
  2. Der Rumpf des `async with`-Blocks wird ebenfalls abgebrochen, wenn er noch läuft. Die `CancelledError` unterbricht dort ein `await`, tritt aber nicht aus dem Block aus.
  3. Wenn alle Tasks beendet sind, löst die Gruppe die gesammelten Fehler als [`ExceptionGroup`](https://docs.python.org/3/library/exceptions.html#ExceptionGroup) aus.

  Diese Gruppe fängst du mit [`except*`](https://docs.python.org/3/reference/compound_stmts.html#except-star). Jeder `except*`-Zweig bekommt die passenden Fehler als Untergruppe:

  ```python run
  import asyncio

  log = []

  async def pruefe_adresse() -> None:
      await asyncio.sleep(0)
      raise ValueError("Adresse ungültig")

  async def pruefe_lager(nie: asyncio.Event) -> None:
      try:
          await nie.wait()                       # wird nie gesetzt
      finally:
          log.append("lager: abgebrochen")

  async def main() -> None:
      nie = asyncio.Event()
      try:
          async with asyncio.TaskGroup() as tg:
              tg.create_task(pruefe_adresse())
              tg.create_task(pruefe_lager(nie))
              await asyncio.sleep(3600)          # der Rumpf wird ebenfalls abgebrochen
              log.append("unerreichbar")
      except* ValueError as gruppe:
          print("ValueError:", [str(e) for e in gruppe.exceptions])
      print(log)

  await main()
  ```

  Ein einzelner `ValueError` kommt also nicht als `ValueError` an, sondern in einer Gruppe. Ein `except ValueError` ohne Stern fängt ihn nicht.

  ### Timeout ist Cancellation

  [`asyncio.timeout`](https://docs.python.org/3/library/asyncio-task.html#asyncio.timeout) baut auf demselben Mechanismus auf. Läuft die Frist ab, ruft es `cancel()` auf dem aktuellen Task auf. Am Ende des Blocks macht es aus der `CancelledError` einen `TimeoutError`. Dein `finally` läuft dabei wie bei jedem Abbruch. Verschluckt der Code im Block die `CancelledError`, bleibt der `TimeoutError` aus:

  ```python run
  import asyncio

  log = []

  async def lade() -> None:
      try:
          await asyncio.sleep(3600)
      finally:
          log.append("lade: finally")

  async def schluckt() -> None:
      try:
          await asyncio.sleep(3600)
      except asyncio.CancelledError:
          log.append("verschluckt")
      log.append("weiter")

  try:
      async with asyncio.timeout(0.01) as frist:
          await lade()
  except TimeoutError:
      log.append("TimeoutError")
  print(frist.expired(), log)

  log.clear()
  async with asyncio.timeout(0.01) as frist:     # kein TimeoutError, der Block endet normal
      await schluckt()
  print(frist.expired(), log)
  ```

  `frist.expired()` zeigt in beiden Fällen `True`. Im zweiten Fall bemerkt der Aufrufer es trotzdem nicht: Der Block lief einfach weiter. Genau so entstehen Timeouts, die nichts bewirken.

  > [!DEEP] Wie timeout und TaskGroup ihren eigenen Abbruch erkennen
  > Ein Task zählt, wie oft er abgebrochen wurde ([`Task.cancelling()`](https://docs.python.org/3/library/asyncio-task.html#asyncio.Task.cancelling)). `timeout` und `TaskGroup` merken sich den Stand beim Betreten und rufen beim Verlassen `uncancel()` auf. So unterscheiden sie ihren eigenen Abbruch von einem, den jemand von außen angefordert hat, und verwechseln einen äußeren `cancel()` nicht mit dem eigenen Timeout. Im Alltag brauchst du diese Zähler nicht. Sie erklären aber, warum man `CancelledError` weiterreichen muss.

  ## asyncio.Queue: Producer, Consumer und Backpressure

  Ein Importer liest 50 000 Zeilen aus einer CSV-Datei und schreibt sie in eine Datenbank. Alle Zeilen gleichzeitig als Tasks zu starten, sprengt Speicher und Verbindungslimit. Ein `Semaphore` begrenzt die Gleichzeitigkeit, aber die Tasks existieren trotzdem alle. Besser: Ein **Producer** legt Aufträge in eine [`asyncio.Queue`](https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue), eine feste Zahl **Consumer** (Worker) holt sie ab.

  Das Denkmodell hat zwei Zähler: die Länge der Queue und die Zahl der **unfertigen Aufträge**. `put()` erhöht beide. `get()` senkt nur die Länge. Erst [`task_done()`](https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue.task_done) senkt die Zahl der unfertigen Aufträge. [`join()`](https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue.join) wartet, bis sie null ist.

  ```python run
  import asyncio

  async def worker(name: str, queue: asyncio.Queue, ergebnisse: list) -> None:
      while True:
          auftrag = await queue.get()
          try:
              await asyncio.sleep(0.01)                  # steht für Arbeit
              ergebnisse.append((name, auftrag * 2))
          finally:
              queue.task_done()                          # auch bei Fehlern, sonst hängt join()

  async def main() -> None:
      queue: asyncio.Queue[int] = asyncio.Queue(maxsize=4)   # Backpressure
      ergebnisse: list = []
      workers = [asyncio.create_task(worker(f"w{i}", queue, ergebnisse)) for i in range(3)]
      for auftrag in range(10):
          await queue.put(auftrag)                       # wartet, wenn die Queue voll ist
      await queue.join()                                 # jeder Auftrag ist verarbeitet
      for w in workers:
          w.cancel()                                     # die Endlosschleifen beenden
      await asyncio.gather(*workers, return_exceptions=True)
      print(sorted(a for _, a in ergebnisse))

  await main()
  ```

  - **Backpressure:** `maxsize=4` heißt: Ist die Queue voll, wartet `await queue.put(...)`, bis ein Worker Platz schafft. Der Producer läuft so nie weiter voraus, als die Worker verkraften. Ohne `maxsize` (Standard 0) ist die Queue unbegrenzt und wächst, wenn der Producer schneller ist.
  - **`task_done()` genau einmal pro `get()`,** im `finally`. Ein Worker, der bei einem Fehler `task_done()` auslässt, lässt `join()` für immer hängen. Mehr Aufrufe als Aufträge lösen einen `ValueError` aus.
  - **Worker beenden:** Die Worker sind Endlosschleifen. Nach `join()` brichst du sie ab (`cancel()`) und wartest mit `gather(..., return_exceptions=True)`, bis sie weg sind. Die Abbruch-Regeln von oben gelten: Der Worker fängt nur `Exception`.
  - **`put_nowait()` und `get_nowait()`** warten nicht, sondern lösen `QueueFull` beziehungsweise `QueueEmpty` aus.

  ### Ende signalisieren: Sentinel und Queue.shutdown()

  Statt Worker abzubrechen, kannst du ihnen sagen, dass nichts mehr kommt. Der klassische Weg ist ein **Sentinel**: eine Marke wie `None`, die der Producer pro Consumer einmal in die Queue legt. Seit Python 3.13 gibt es [`Queue.shutdown()`](https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue.shutdown). Danach löst `put()` eine [`QueueShutDown`](https://docs.python.org/3/library/asyncio-queue.html#asyncio.QueueShutDown) aus, und `get()` liefert noch die vorhandenen Aufträge. Erst bei leerer Queue löst es `QueueShutDown` aus:

  ```python run
  import asyncio

  async def konsument(queue: asyncio.Queue, log: list) -> None:
      while True:
          try:
              eintrag = await queue.get()
          except asyncio.QueueShutDown:
              log.append("Queue beendet")
              return                                     # normales Ende, keine Abbruch-Logik nötig
          log.append(f"verarbeitet {eintrag}")
          queue.task_done()

  queue: asyncio.Queue[str] = asyncio.Queue()
  log: list[str] = []
  task = asyncio.create_task(konsument(queue, log))
  for zeile in ["a", "b", "c"]:
      queue.put_nowait(zeile)
  queue.shutdown()                                       # der Producer ist fertig
  await task
  print(log)
  ```

  `shutdown(immediate=True)` leert die Queue sofort und verwirft offene Aufträge. Die Dokumentation warnt, dass dadurch `join()` zurückkehrt, obwohl die Arbeit nicht erledigt wurde.

  > [!PRAXIS] Pipeline mit Stufen
  > Crawler, Importer und Webhook-Versender haben oft die Form „lesen → verarbeiten → schreiben“, mit je einer Queue zwischen den Stufen. Jede Queue hat ein `maxsize`, damit die langsamste Stufe das Tempo der vorherigen bremst, statt dass sich der Speicher füllt. Die `asyncio.Queue` ist wie alle asyncio-Primitive [nicht threadsicher](https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue). Zwischen Threads brauchst du `queue.Queue`.

  Wann Queue, wann `gather` mit `Semaphore`? Bei einer festen Liste mit Ergebnissen in Eingabereihenfolge reicht `gather` (siehe die Übung zum begrenzten Abrufen). Die Queue lohnt sich, wenn Aufträge fortlaufend entstehen, wenn Stufen sich gegenseitig bremsen sollen oder wenn die Zahl der Worker fest bleiben soll.

  ## as_completed: Ergebnisse, sobald sie da sind

  `gather` liefert erst, wenn **alle** fertig sind. Oft willst du früher handeln: das erste Ergebnis nehmen (der schnellste von drei Mirror-Servern), einen Fortschrittsbalken füllen oder Ergebnisse streamen. Dafür gibt es [`asyncio.as_completed`](https://docs.python.org/3/library/asyncio-task.html#asyncio.as_completed).

  Seit Python 3.13 liefert es ein Objekt, das du auf zwei Arten durchlaufen kannst:

  ```python run
  import asyncio

  async def hole(name: str, dauer: float) -> str:
      await asyncio.sleep(dauer)
      return name.upper()

  tasks = {
      asyncio.create_task(hole("langsam", 0.06)): "langsam",
      asyncio.create_task(hole("schnell", 0.01)): "schnell",
      asyncio.create_task(hole("mittel", 0.03)): "mittel",
  }
  async for fertig in asyncio.as_completed(tasks):       # liefert die Tasks selbst
      print(tasks[fertig], await fertig)                 # Zuordnung über das Dictionary

  for naechste in asyncio.as_completed([hole("a", 0.03), hole("b", 0.01)]):
      print(await naechste)                              # neue Coroutine pro Schritt
  ```

  - **`async for`** (seit 3.13) liefert die Task-Objekte, die du übergeben hast. Du erkennst so, welcher Task fertig ist, und `await fertig` liefert das Ergebnis oder die Exception.
  - **`for`** (auch vor 3.13) liefert pro Schritt eine neue Coroutine. Ihr `await` ergibt das Ergebnis des nächsten fertigen Tasks, aber du weißt nicht, welcher es war.
  - **`timeout=`** löst einen `TimeoutError` aus, wenn die Frist abläuft, bevor alle fertig sind.

  `as_completed` bricht nichts ab. Verlässt du die Schleife mit `break` oder `return`, oder läuft das Timeout ab, laufen die übrigen Tasks weiter. Das räumst du selbst auf: `cancel()` für die Verlierer und danach auf sie warten. So entsteht das Muster „der Schnellste gewinnt“, das eine Übung unten verlangt.

  | Wenn du … | nimm |
  | --- | --- |
  | alle Ergebnisse in Eingabereihenfolge brauchst | `gather` |
  | alle brauchst und bei einem Fehler alles abbrechen willst | `TaskGroup` |
  | jedes Ergebnis sofort verarbeiten oder das erste nehmen willst | `as_completed` |

  ## Synchronisation: Lock, Event und Condition

  Weil asyncio nur an `await` wechselt, ist `zaehler += 1` ohne `await` dazwischen sicher. Die Race Condition entsteht, sobald zwischen Prüfen und Handeln ein `await` liegt: Dann laufen andere Coroutinen dazwischen und sehen den alten Zustand.

  ```python run
  import asyncio

  class Konto:
      def __init__(self, saldo: int) -> None:
          self.saldo = saldo
          self._lock = asyncio.Lock()

      async def abbuchen_unsicher(self, betrag: int) -> bool:
          if self.saldo >= betrag:             # prüfen ...
              await asyncio.sleep(0)           # ... hier läuft eine andere Coroutine (Betrugsprüfung, DB)
              self.saldo -= betrag             # ... handeln, mit veraltetem Wissen
              return True
          return False

      async def abbuchen(self, betrag: int) -> bool:
          async with self._lock:               # prüfen und abbuchen sind ein Schritt
              if self.saldo >= betrag:
                  await asyncio.sleep(0)
                  self.saldo -= betrag
                  return True
              return False

  unsicher = Konto(100)
  print(await asyncio.gather(unsicher.abbuchen_unsicher(80), unsicher.abbuchen_unsicher(80)), unsicher.saldo)
  sicher = Konto(100)
  print(await asyncio.gather(sicher.abbuchen(80), sicher.abbuchen(80)), sicher.saldo)
  ```

  Die erste Zeile zeigt `[True, True] -60`: Beide Aufrufe sahen 100 Euro. Die zweite zeigt `[True, False] 20`.

  Die Primitive im [asyncio-Modul für Synchronisation](https://docs.python.org/3/library/asyncio-sync.html) lösen verschiedene Probleme:

  - **[`Lock`](https://docs.python.org/3/library/asyncio-sync.html#asyncio.Lock):** exklusiver Zugriff über ein `await` hinweg. Nutze es mit `async with`. Es ist nicht reentrant: Ein zweites `acquire` im selben Task wartet auf sich selbst und endet im Deadlock. Wartende kommen in der Reihenfolge ihres Eintreffens dran.
  - **[`Event`](https://docs.python.org/3/library/asyncio-sync.html#asyncio.Event):** ein Signal „ist passiert“. `wait()` blockiert, bis jemand `set()` aufruft, dann wachen alle Wartenden auf. Typisch für „Cache ist warm“ oder ein Stopp-Signal für Worker.
  - **[`Condition`](https://docs.python.org/3/library/asyncio-sync.html#asyncio.Condition):** Lock plus Wartelisten. Mit `await cond.wait_for(prädikat)` wartest du auf eine Bedingung, ein anderer Task weckt mit `notify_all()`. Du brauchst sie selten, weil Queue oder Event meist reichen.
  - **[`Semaphore`](https://docs.python.org/3/library/asyncio-sync.html#asyncio.Semaphore):** höchstens *n* gleichzeitig, siehe oben.
  - **`Queue`:** Daten von einem Task zum nächsten geben, siehe voriger Abschnitt.

  ```python run
  import asyncio

  bereit = asyncio.Event()
  log = []

  async def warte(name: str) -> None:
      await bereit.wait()
      log.append(name)

  tasks = [asyncio.create_task(warte(n)) for n in "abc"]
  await asyncio.sleep(0)               # die Tasks hängen jetzt in wait()
  log.append("set")
  bereit.set()
  await asyncio.gather(*tasks)
  print(log)                           # ['set', 'a', 'b', 'c']
  ```

  Auch hier gilt: Das sind Primitive für Coroutinen im selben Thread. Für Threads nimmst du `threading.Lock` und `threading.Event` (siehe oben).

  ## async with und async for: Context Manager und Generatoren

  ### async with in Aktion

  Du kennst `async with` schon von `Lock`, `Semaphore`, `TaskGroup` und `timeout`. Der Unterschied zu `with`: [`__aenter__` und `__aexit__`](https://docs.python.org/3/reference/datamodel.html#async-context-managers) sind Coroutinen, dürfen also selbst `await` benutzen. Das braucht man für alles, was beim Betreten oder Verlassen auf das Netz wartet: Verbindung öffnen, `COMMIT`, Sperre freigeben.

  ```python run
  import asyncio

  class FakeDb:
      def __init__(self) -> None:
          self.log: list[str] = []
      async def begin(self) -> None: self.log.append("begin")
      async def commit(self) -> None: self.log.append("commit")
      async def rollback(self) -> None: self.log.append("rollback")
      async def execute(self, sql: str) -> None: self.log.append(sql)

  class Transaktion:
      def __init__(self, db: FakeDb) -> None:
          self.db = db

      async def __aenter__(self) -> FakeDb:
          await self.db.begin()
          return self.db

      async def __aexit__(self, exc_type, exc, tb) -> bool:
          if exc_type is None:
              await self.db.commit()
          else:
              await self.db.rollback()
          return False                  # die Exception nicht unterdrücken

  db = FakeDb()
  async with Transaktion(db) as t:
      await t.execute("INSERT")
  try:
      async with Transaktion(db) as t:
          raise ValueError("kaputt")
  except ValueError:
      pass
  print(db.log)                         # ['begin', 'INSERT', 'commit', 'begin', 'rollback']
  ```

  `__aexit__` bekommt Typ, Wert und Traceback einer Exception aus dem Block, oder dreimal `None`. Gibt `__aexit__` einen wahren Wert zurück, unterdrückt es die Exception. Tu das nur bewusst, so wie `timeout` es mit seiner eigenen `CancelledError` tut. Das Muster ohne Klasse, mit `yield` in einer Funktion, ist [`contextlib.asynccontextmanager`](https://docs.python.org/3/library/contextlib.html#contextlib.asynccontextmanager); es steht im Modul [Dekoratoren & funktionale Werkzeuge](/python/dekoratoren-funktional).

  ### Async-Generatoren und async for

  Eine `async def`-Funktion mit `yield` ist ein [asynchroner Generator](https://docs.python.org/3/reference/expressions.html#asynchronous-generator-functions) ([PEP 525](https://peps.python.org/pep-0525/)). Er liefert Werte einzeln, und zwischen zwei Werten darf er `await` benutzen. Du liest ihn mit [`async for`](https://docs.python.org/3/reference/compound_stmts.html#async-for). Der Klassiker ist eine paginierte API: Seite holen, Einträge ausgeben, nächste Seite holen, aber nur, wenn jemand weiterliest. Wie synchrone Generatoren funktionieren, erklärt [Iteratoren & Generatoren](/python/iteratoren-generatoren).

  ```python run
  import asyncio
  from contextlib import aclosing

  log = []
  DATEN = {1: ["a", "b"], 2: ["c", "d"], 3: ["e"]}

  async def hole_seite(thema: str, seite: int) -> list[str]:
      log.append(f"hole {seite}")
      await asyncio.sleep(0)                    # steht für einen HTTP-Aufruf
      return DATEN.get(seite, [])

  async def eintraege(thema: str):
      seite = 1
      try:
          while True:
              liste = await hole_seite(thema, seite)
              if not liste:
                  return
              for eintrag in liste:
                  yield eintrag
              seite += 1
      finally:
          log.append("Generator beendet")

  alle = [e async for e in eintraege("python")]          # async Comprehension
  print(alle, log)

  log.clear()
  async with aclosing(eintraege("python")) as gen:       # schließt den Generator sicher
      async for e in gen:
          if e == "c":
              break
  print(log)                                             # nur zwei Seiten geholt
  ```

  - **Faul wie sein synchrones Vorbild:** Nach `break` bei `c` wurde Seite 3 nie geholt.
  - **Aufräumen:** Ein abgebrochener Generator steht still, sein `finally` läuft erst bei [`aclose()`](https://docs.python.org/3/reference/expressions.html#agen.aclose). Ohne Aufruf übernimmt das irgendwann der Garbage Collector über die Event-Loop, ohne dass du den Zeitpunkt kennst. [`contextlib.aclosing`](https://docs.python.org/3/library/contextlib.html#contextlib.aclosing) ruft `aclose()` zuverlässig auf. Nutze es, wenn der Generator Ressourcen hält und du früher aussteigen kannst.
  - **Unter der Haube:** `async for` ruft `__aiter__` und wiederholt `__anext__`; das Ende ist `StopAsyncIteration` ([Datenmodell](https://docs.python.org/3/reference/datamodel.html#asynchronous-iterators)).
  - **Async Comprehensions** (`[x async for x in gen()]`, [PEP 530](https://peps.python.org/pep-0530/)) gibt es in Listen, Sets und Dictionaries, aber nur innerhalb von `async def`. In einer normalen Funktion sind `async for` und `await` ein `SyntaxError`.

  > [!WARNING] await in der Comprehension ist nicht nebenläufig
  > `{k: await hole(k) for k in schluessel}` wartet jeden Aufruf nacheinander ab, drei Aufrufe à 20 ms brauchen 60 ms. Für Nebenläufigkeit nimmst du `await asyncio.gather(*(hole(k) for k in schluessel))`.

  > [!INTERVIEW] „Was passiert bei `task.cancel()`?“
  > Es setzt eine Anfrage: Beim nächsten `await` des Tasks wirft asyncio eine `CancelledError`. Der Task räumt in `finally` auf und löst sie erneut aus, dann gilt er als abgebrochen. Schluckt er sie, läuft er weiter, und Timeouts und TaskGroups funktionieren nicht mehr. Nenne dazu `shield` für Arbeit, die den Aufrufer überleben muss, und dass `CancelledError` von `BaseException` erbt.

  ## Entscheidungstabelle

  | Situation | Werkzeug | Warum |
  | --- | --- | --- |
  | Viele Netzwerk-/Datenbankaufrufe, async-Bibliotheken vorhanden | asyncio | Tausende Verbindungen in einem Thread, wenig Overhead |
  | Einige Dutzend I/O-Aufrufe mit synchronen Bibliotheken (`requests`, `boto3`) | `ThreadPoolExecutor` | Kein Umbau nötig, GIL wird beim Warten abgegeben |
  | CPU-lastige Berechnung in reinem Python (Standard-Build) | `ProcessPoolExecutor` | Echte Parallelität, eigener GIL pro Prozess |
  | CPU-lastig mit NumPy, `hashlib`, Kompression | Threads prüfen | Viele C-Erweiterungen geben den GIL frei |
  | Blockierende Funktion in asyncio-Code | `asyncio.to_thread` | Hält die Event-Loop frei |
  | Aufträge entstehen laufend, feste Zahl Worker, langsame Stufe soll bremsen | `asyncio.Queue(maxsize=n)` | Backpressure: `put` wartet bei voller Queue |
  | Ergebnis sofort verarbeiten oder das erste nehmen | `asyncio.as_completed` | Liefert nach Fertigstellung, bricht aber nichts ab |
  | Prüfen und Ändern, dazwischen ein `await` | `asyncio.Lock` | Macht den Abschnitt über das `await` hinweg exklusiv |
  | Hintergrundjobs über Minuten, nach Neustart fortsetzen | Task-Queue (Celery, RQ) | Gehört in einen eigenen Dienst, nicht in den Webprozess |

  > [!INTERVIEW] „Threads, Prozesse oder asyncio – wann was?“
  > Antworte über die Last, nicht über die API. I/O-bound: asyncio, wenn der Stack asynchron ist, sonst ein Thread-Pool. CPU-bound in reinem Python: Prozesse, weil der GIL im Standard-Build nur einen Thread gleichzeitig Bytecode ausführen lässt. Dann die Nuance: Der GIL schützt keine eigene Logik (`+=` braucht trotzdem einen Lock), und seit 3.14 gibt es einen offiziell unterstützten, aber optionalen free-threaded Build. Wer noch „erst messen“ sagt, punktet.

  ## Häufige Fehler

  - **Geteilter Zustand ohne Lock.** Zähler, Listen-Prüfungen („ist noch Platz?“) und Dictionaries mit Check-then-Act-Logik gehen unter Last kaputt – selten und nicht reproduzierbar.
  - **Threads für reine CPU-Arbeit.** Im Standard-Build wird es nicht schneller, oft sogar langsamer.
  - **Prozesse für winzige Aufgaben.** Pickling und Start kosten mehr, als die Parallelität spart. `chunksize` erhöhen oder bei einem Prozess bleiben.
  - **Vergessenes `await`.** Die Coroutine läuft nie; statt des Ergebnisses hast du ein Coroutine-Objekt.
  - **Blockierende Aufrufe in `async def`.** Die Loop steht, alle Anfragen warten.
  - **`asyncio.run` in einer laufenden Loop.** `RuntimeError: asyncio.run() cannot be called from a running event loop`.
  - **Tasks ohne Referenz oder ohne Timeout.** Tasks verschwinden oder hängen für immer; nutze `TaskGroup` und `asyncio.timeout`.
  - **`CancelledError` verschlucken.** `except BaseException`, nacktes `except:` oder `except (Exception, asyncio.CancelledError)` in einer Schleife macht den Task unkündbar. Der Shutdown hängt, `timeout` wirkt nicht.
  - **`task_done()` vergessen.** Scheitert ein Auftrag und der Worker überspringt `task_done()`, wartet `queue.join()` ewig. Setze es in ein `finally`.
  - **Unbegrenzte Queue.** Ohne `maxsize` füllt ein schneller Producer den Speicher, statt auf die Worker zu warten.
  - **Check-then-Act über ein `await`.** Zwischen Prüfung und Änderung laufen andere Coroutinen. `asyncio.Lock` oder die Prüfung nach dem `await` wiederholen.
  - **`except ValueError` um eine TaskGroup.** Die TaskGroup wirft eine `ExceptionGroup`; das passende Gegenstück ist `except*`.
  - **Generator nach `break` nicht schließen.** Das `finally` im async Generator läuft dann zu einem unbestimmten Zeitpunkt. `contextlib.aclosing` löst das.

  > [!PRAXIS] So sieht es in Projekten aus
  > Web-Backends mit FastAPI laufen auf asyncio: Datenbank über `asyncpg` oder SQLAlchemy async, HTTP über `httpx.AsyncClient`, parallele Aufrufe mit `TaskGroup` oder `gather`, begrenzt mit einem `Semaphore`. Datenpipelines und Skripte, die viele Dateien verarbeiten, nutzen `ProcessPoolExecutor`. Im Code-Review wird bei jeder globalen, veränderlichen Variable in Multi-Thread-Code gefragt: Wer schreibt hier gleichzeitig? Und bei jedem `async def`: Steckt irgendwo ein blockierender Aufruf?

  > [!MERKE]
  > I/O-bound → asyncio oder Threads. CPU-bound → Prozesse (oder free-threaded Build). Der GIL schützt den Interpreter, nicht deine Daten.

  ## Zusammenfassung

  - Nebenläufigkeit ist abwechselndes Arbeiten, Parallelität gleichzeitiges Arbeiten auf mehreren Kernen.
  - Im Standard-Build führt wegen des GIL nur ein Thread gleichzeitig Python-Bytecode aus; beim Warten auf I/O gibt er den GIL ab.
  - `+=` auf geteilten Daten ist nicht atomar: `Lock` oder `queue.Queue` benutzen.
  - Python 3.13: free-threaded Build experimentell. Python 3.14: offiziell unterstützt, aber optional; der Standard-Build hat weiter einen GIL.
  - Prozesse umgehen den GIL, kosten aber Start-Zeit und Pickling; Startcode hinter `if __name__ == "__main__":`.
  - `concurrent.futures`: `map` in Eingabereihenfolge, `submit` + `as_completed` in Fertigstellungsreihenfolge.
  - asyncio: eine Event-Loop, Wechsel nur an `await`; `asyncio.run` einmal außen, `TaskGroup`, `timeout`, `Semaphore`, `gather`.
  - Nichts Blockierendes in `async def`; notfalls `asyncio.to_thread`.
  - `task.cancel()` ist eine Anfrage: `CancelledError` kommt am nächsten `await` an, erbt von `BaseException`, räumt in `finally` auf und wird immer erneut ausgelöst.
  - `asyncio.shield` lässt den inneren Task den Abbruch des Aufrufers überleben. Scheitert ein Task in der `TaskGroup`, bricht sie die Geschwister ab und löst eine `ExceptionGroup` aus (`except*`).
  - `asyncio.timeout` ist Cancellation mit Umwandlung in `TimeoutError`. Wer die `CancelledError` verschluckt, entwertet das Timeout.
  - `asyncio.Queue`: `put` wartet bei `maxsize` (Backpressure), `task_done` pro `get`, `join` wartet auf alle, `shutdown()` (seit 3.13) beendet die Consumer.
  - `as_completed` liefert nach Fertigstellung und bricht nichts ab. `asyncio.Lock` schützt Check-then-Act über ein `await`, `Event` signalisiert.
  - `async with` ruft `__aenter__`/`__aexit__` auf, ein Generator mit `async def` und `yield` ist ein async Generator. Schließe ihn bei frühem Ausstieg mit `aclosing`.
exercises:
  - id: werkzeug-waehlen
    type: choice
    title: Welches Werkzeug passt?
    prompt: Du arbeitest mit dem Standard-Build von CPython 3.14 (mit GIL). Welche Zuordnungen sind sinnvoll?
    options:
      - text: 300 PDF-Seiten in reinem Python parsen und auswerten → `ProcessPoolExecutor`
        correct: true
        why: CPU-bound in reinem Python. Nur getrennte Prozesse mit eigenem GIL rechnen parallel.
      - text: 50 REST-Aufrufe mit der synchronen Bibliothek `requests` → `ThreadPoolExecutor`
        correct: true
        why: I/O-bound. Beim Warten auf das Netz geben Threads den GIL ab, und die bestehende Bibliothek bleibt nutzbar.
      - text: Eine Primzahlsuche in reinem Python mit 8 Threads beschleunigen
        correct: false
        why: Im Standard-Build führt nur ein Thread gleichzeitig Bytecode aus; die Threads wechseln sich ab. Das wird nicht schneller, oft langsamer.
      - text: 2 000 gleichzeitige WebSocket-Verbindungen in einem Server → `ProcessPoolExecutor` mit 2 000 Prozessen
        correct: false
        why: Prozesse sind teuer (Speicher, Start). Viele wartende Verbindungen sind der Kernfall für asyncio in einem Thread.
    explanation: |
      Entscheidend ist die Art der Last. I/O-bound Arbeit braucht Nebenläufigkeit (Threads oder asyncio), CPU-bound Arbeit braucht Parallelität, im Standard-Build also Prozesse. Tausende Verbindungen sind I/O-bound mit sehr vielen gleichzeitigen Wartezeiten – dafür ist asyncio gebaut.
    resources:
      - title: Concurrent Execution
        url: https://docs.python.org/3/library/concurrency.html
      - title: Glossar · global interpreter lock
        url: https://docs.python.org/3/glossary.html#term-global-interpreter-lock

  - id: sync-primitiv-waehlen
    type: choice
    title: Lock, Event, Semaphore oder Queue?
    prompt: Alle Aufgaben laufen als Coroutinen in einer Event-Loop. Welche Zuordnungen passen?
    options:
      - text: "Höchstens 5 Datenbankverbindungen gleichzeitig vergeben → `asyncio.Semaphore(5)`"
        correct: true
        why: Ein Semaphore zählt freie Plätze. Die sechste Coroutine wartet am Eingang, bis eine Verbindung frei ist.
      - text: "Worker sollen erst loslegen, wenn die Konfiguration geladen ist → `asyncio.Event`"
        correct: true
        why: Die Worker warten mit `await event.wait()`, der Lader ruft einmal `set()` auf, und alle wachen gemeinsam auf.
      - text: "Zwischen Saldoprüfung und Abbuchung steht ein `await`, und zwei Aufrufe dürfen sich dort nicht überholen → `asyncio.Lock`"
        correct: true
        why: Ohne Sperre sehen beide Aufrufe den alten Saldo. Mit `async with lock` ist Prüfen und Abbuchen ein Schritt, auch über das `await` hinweg.
      - text: "Ein Producer reicht Aufträge an Worker weiter, und es sollen nie mehr als 100 offen sein → `asyncio.Lock`"
        correct: false
        why: Ein Lock gibt keine Daten weiter und zählt nichts. Dafür gibt es `asyncio.Queue(maxsize=100)`.
      - text: "Mehrere Betriebssystem-Threads erhöhen einen gemeinsamen Zähler → `asyncio.Lock`"
        correct: false
        why: asyncio-Primitive sind nicht threadsicher. Zwischen Threads braucht es `threading.Lock`.
    explanation: |
      Jedes Primitiv beantwortet eine eigene Frage. Der Semaphore begrenzt die Zahl gleichzeitiger Teilnehmer, das Event meldet „ist passiert“, der Lock macht einen Abschnitt exklusiv, die Queue gibt Daten weiter und bremst bei Bedarf. Alle vier arbeiten nur zwischen Coroutinen im selben Thread.
    resources:
      - title: asyncio · Synchronization Primitives
        url: https://docs.python.org/3/library/asyncio-sync.html
      - title: asyncio · Queues
        url: https://docs.python.org/3/library/asyncio-queue.html

  - id: taskgroup-ordnen
    type: order
    title: Zwei Anfragen mit TaskGroup
    prompt: |
      Bring die Zeilen in die richtige Reihenfolge: `lade_profilseite` lädt Profil und Bestellungen nebenläufig, mit einem Timeout von zwei Sekunden für beide zusammen, und gibt beide Ergebnisse zurück.
    lang: python
    lines: |
      async def lade_profilseite(nutzer_id: int) -> tuple[dict, list]:
          async with asyncio.timeout(2):
              async with asyncio.TaskGroup() as tg:
                  profil = tg.create_task(api.profil(nutzer_id))
                  bestellungen = tg.create_task(api.bestellungen(nutzer_id))
          return profil.result(), bestellungen.result()
    alternatives:
      - [1, 2, 3, 5, 4, 6]
    hints:
      - Die Ergebnisse sind erst verfügbar, wenn die TaskGroup alle Tasks abgewartet hat.
    explanation: |
      Das `timeout` umschließt die ganze TaskGroup, damit die Frist für beide Anfragen zusammen gilt. Die Tasks laufen ab `create_task` nebenläufig; am Ende des `async with`-Blocks wartet die TaskGroup auf beide. Erst danach ist `.result()` sicher. Die Reihenfolge der beiden `create_task`-Zeilen ist egal.
    resources:
      - title: asyncio · Task Groups
        url: https://docs.python.org/3/library/asyncio-task.html#task-groups
      - title: asyncio.timeout
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.timeout

  - id: executor-map-reihenfolge
    type: output
    title: In welcher Reihenfolge kommen die Ergebnisse?
    prompt: Was gibt dieses Programm aus? Die Wartezeiten sind so gewählt, dass die Aufgabe `3` zuerst fertig wird.
    lang: python
    code: |
      import time
      from concurrent.futures import ThreadPoolExecutor

      def lade(n):
          time.sleep(0.05 * (4 - n))
          return n * 10

      def pruefe(n):
          if n == 2:
              raise ValueError(f"kaputt: {n}")
          return n

      with ThreadPoolExecutor(max_workers=3) as pool:
          print(list(pool.map(lade, [1, 2, 3])))
          try:
              for ergebnis in pool.map(pruefe, [1, 2, 3]):
                  print("ok", ergebnis)
          except ValueError as fehler:
              print("Fehler:", fehler)
    expected: |
      [10, 20, 30]
      ok 1
      Fehler: kaputt: 2
    hints:
      - "`Executor.map` verhält sich nach außen wie das eingebaute `map`."
      - Wann genau taucht die Exception eines Tasks bei `map` auf?
    explanation: |
      `Executor.map` liefert die Ergebnisse in der Reihenfolge der Eingaben, auch wenn spätere Aufgaben früher fertig sind – es wartet beim Iterieren auf das jeweils nächste. Eine Exception im Task wirft `map` erst, wenn die Iteration an diesem Ergebnis ankommt: `ok 1` erscheint, dann fliegt der `ValueError`. Das Ergebnis für `3` wurde zwar berechnet, aber nie abgeholt. Brauchst du Ergebnisse in Fertigstellungsreihenfolge oder Fehler pro Aufgabe, nimm `submit` mit `as_completed`.
    resources:
      - title: concurrent.futures · Executor.map
        url: https://docs.python.org/3/library/concurrent.futures.html#concurrent.futures.Executor.map

  - id: gather-reihenfolge
    type: output
    title: Wer ist zuerst fertig?
    prompt: |
      Was gibt dieses Programm aus? (Es nutzt `await` auf oberster Ebene wie in Jupyter oder `python -m asyncio`; in einem Skript stünde dort `asyncio.run(main())`.)
    lang: python
    code: |
      import asyncio

      async def hole(name, dauer):
          print("start", name)
          await asyncio.sleep(dauer)
          print("fertig", name)
          return name.upper()

      async def main():
          koro = hole("x", 0.01)
          print("noch nichts gestartet")
          ergebnisse = await asyncio.gather(hole("a", 0.06), hole("b", 0.02), hole("c", 0.04))
          print(ergebnisse)
          print(await koro)

      await main()
    expected: |
      noch nichts gestartet
      start a
      start b
      start c
      fertig b
      fertig c
      fertig a
      ['A', 'B', 'C']
      start x
      fertig x
      X
    hints:
      - Ein Aufruf einer `async def`-Funktion erzeugt nur ein Coroutine-Objekt.
      - "`gather` startet die Coroutinen in der Reihenfolge der Argumente; wer zuerst aufwacht, entscheidet die Wartezeit."
    explanation: |
      `hole("x", 0.01)` führt noch keine Zeile aus, es entsteht nur ein Coroutine-Objekt – deshalb kommt `start x` erst ganz am Ende, beim `await koro`. `gather` startet `a`, `b` und `c`; jede läuft bis zu ihrem `await asyncio.sleep` und gibt die Kontrolle ab. Die Loop weckt sie nach Ablauf ihrer Wartezeit: `b`, dann `c`, dann `a`. Die Ergebnisliste von `gather` folgt trotzdem der Reihenfolge der Argumente.
    resources:
      - title: asyncio.gather
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.gather
      - title: asyncio · Coroutines
        url: https://docs.python.org/3/library/asyncio-task.html#coroutines

  - id: cancel-ablauf
    type: output
    title: Was passiert bei cancel()?
    prompt: |
      Was gibt dieses Programm aus? (`await` auf oberster Ebene wie in `python -m asyncio`; im Skript stünde `asyncio.run(main())` darum.)
    lang: python
    code: |
      import asyncio

      async def pumpe(bereit):
          print("pumpe: start")
          try:
              bereit.set()
              await asyncio.sleep(3600)
          except asyncio.CancelledError:
              print("pumpe: Abbruch")
              raise
          finally:
              print("pumpe: finally")
          print("pumpe: Ende")

      async def main():
          bereit = asyncio.Event()
          task = asyncio.create_task(pumpe(bereit))
          await bereit.wait()
          print("cancel:", task.cancel())
          print("fertig vor await:", task.done())
          try:
              await task
          except asyncio.CancelledError:
              print("main: CancelledError")
          print(task.cancelled(), task.done())
          print("zweiter cancel:", task.cancel())

      await main()
    expected: |
      pumpe: start
      cancel: True
      fertig vor await: False
      pumpe: Abbruch
      pumpe: finally
      main: CancelledError
      True True
      zweiter cancel: False
    hints:
      - "`task.cancel()` setzt nur eine Anfrage. Wann läuft der Task weiter?"
      - Erreicht der Task die letzte `print`-Zeile von `pumpe`?
    explanation: |
      `cancel()` liefert `True`, weil die Anfrage angenommen wurde, aber der Task läuft erst weiter, wenn `main` an `await task` abgibt. Deshalb ist er davor noch nicht fertig. Dann wirft die Loop die `CancelledError` an der Stelle von `asyncio.sleep`. Der `except`-Zweig meldet sich, `raise` gibt sie weiter, und `finally` läuft. `"pumpe: Ende"` erscheint nie. `await task` löst die `CancelledError` beim Aufrufer erneut aus, danach ist `task.cancelled()` wahr. Ein zweites `cancel()` auf einem beendeten Task liefert `False`.
    resources:
      - title: asyncio.Task.cancel
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.Task.cancel
      - title: asyncio.CancelledError
        url: https://docs.python.org/3/library/asyncio-exceptions.html#asyncio.CancelledError

  - id: taskgroup-fehler
    type: output
    title: Was bleibt von der TaskGroup übrig?
    prompt: |
      Was gibt dieses Programm aus? Zwei Tasks scheitern, ein dritter wartet. (`await` auf oberster Ebene.)
    lang: python
    code: |
      import asyncio

      async def pruefe_adresse():
          await asyncio.sleep(0)
          raise ValueError("Adresse ungültig")

      async def pruefe_betrag():
          await asyncio.sleep(0)
          raise TypeError("Betrag ist kein Zahlenwert")

      async def pruefe_lager(nie):
          try:
              await nie.wait()
          finally:
              print("lager: abgebrochen")

      async def main():
          nie = asyncio.Event()
          try:
              async with asyncio.TaskGroup() as tg:
                  tg.create_task(pruefe_adresse())
                  tg.create_task(pruefe_betrag())
                  tg.create_task(pruefe_lager(nie))
              print("alle fertig")
          except* ValueError as gruppe:
              print("ValueError:", [str(e) for e in gruppe.exceptions])
          except* TypeError as gruppe:
              print("TypeError:", [str(e) for e in gruppe.exceptions])
          print("danach")

      await main()
    expected: |
      lager: abgebrochen
      ValueError: ['Adresse ungültig']
      TypeError: ['Betrag ist kein Zahlenwert']
      danach
    hints:
      - Was macht die TaskGroup mit dem dritten Task, sobald ein anderer scheitert?
      - "Beide `except*`-Zweige laufen, jeder bekommt nur seine Fehler."
    explanation: |
      Der erste Task, der mit einer Exception endet, bricht die übrigen Tasks der Gruppe ab: `pruefe_lager` bekommt eine `CancelledError`, sein `finally` druckt. `"alle fertig"` fehlt, weil der Block nicht normal endet. Erst wenn alle Tasks beendet sind, löst die Gruppe eine `ExceptionGroup` mit beiden Fehlern aus. Bei `except*` laufen alle passenden Zweige hintereinander, jeder mit der Untergruppe seines Typs. Nach dem letzten Zweig läuft der Code ganz normal weiter. Ein einfaches `except ValueError` hätte die Gruppe nicht gefangen.
    resources:
      - title: asyncio · Task Groups
        url: https://docs.python.org/3/library/asyncio-task.html#task-groups
      - title: Die try-Anweisung (except*)
        url: https://docs.python.org/3/reference/compound_stmts.html#except-star

  - id: queue-backpressure
    type: output
    title: Wann wartet put()?
    prompt: |
      Was gibt dieses Programm aus? `asyncio.sleep(0)` gibt der Event-Loop genau einmal die Chance, andere Tasks laufen zu lassen. (`await` auf oberster Ebene.)
    lang: python
    code: |
      import asyncio

      q = asyncio.Queue(maxsize=2)
      q.put_nowait("a")
      q.put_nowait("b")
      try:
          q.put_nowait("c")
      except asyncio.QueueFull:
          print("voll")
      print(q.full(), q.qsize())

      put = asyncio.create_task(q.put("c"))
      await asyncio.sleep(0)
      print("put fertig:", put.done())
      print("get:", await q.get())
      await put
      print("put fertig:", put.done(), q.qsize())
    expected: |
      voll
      True 2
      put fertig: False
      get: a
      put fertig: True 2
    hints:
      - "`put_nowait` wartet nie, `put` wartet bei voller Queue."
      - Wer macht Platz, damit der wartende `put` weiterkommt?
    explanation: |
      Die Queue fasst zwei Einträge. `put_nowait("c")` wirft sofort `QueueFull`. Der Task mit `q.put("c")` kommt dagegen bis zum Warten und hängt dort, deshalb ist er nach dem `sleep(0)` nicht fertig. Das ist Backpressure: Der Producer wird gebremst. Erst das `get()` entnimmt `"a"` und weckt den Wartenden, der `"c"` einreiht. Danach ist die Queue wieder voll, `qsize()` zeigt 2.
    resources:
      - title: asyncio.Queue
        url: https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue
      - title: asyncio.QueueFull
        url: https://docs.python.org/3/library/asyncio-queue.html#asyncio.QueueFull

  - id: timeout-abbruch-ausgabe
    type: output
    title: Wer bekommt den TimeoutError?
    prompt: |
      Was gibt dieses Programm aus? Beide Blöcke haben eine Frist von 20 ms. (`await` auf oberster Ebene.)
    lang: python
    code: |
      import asyncio

      async def lade(name, dauer):
          try:
              await asyncio.sleep(dauer)
              return f"{name} fertig"
          except asyncio.CancelledError:
              print(f"{name}: abgebrochen")
              raise
          finally:
              print(f"{name}: finally")

      async def tolerant(name, dauer):
          try:
              return await lade(name, dauer)
          except asyncio.CancelledError:
              return f"{name} teilweise"

      async def main():
          try:
              async with asyncio.timeout(0.02):
                  print(await lade("a", 0))
                  print(await lade("b", 3600))
                  print("unerreichbar")
          except TimeoutError:
              print("Timeout")
          async with asyncio.timeout(0.02):
              print(await tolerant("c", 3600))
          print("fertig")

      await main()
    expected: |
      a: finally
      a fertig
      b: abgebrochen
      b: finally
      Timeout
      c: abgebrochen
      c: finally
      c teilweise
      fertig
    hints:
      - "Bei `a` läuft `finally`, bevor der Rückgabewert ankommt."
      - Was passiert mit dem Timeout, wenn `tolerant` die `CancelledError` fängt und normal zurückkehrt?
    explanation: |
      `lade("a", 0)` endet sofort. Sein `finally` läuft, bevor der Aufrufer den Rückgabewert druckt, darum steht `a: finally` vor `a fertig`. Bei `b` bricht die Frist den Task ab: Der `except`-Zweig meldet sich, `raise` gibt die `CancelledError` weiter, `finally` läuft, und `timeout` macht am Blockende einen `TimeoutError` daraus. Im zweiten Block fängt `tolerant` die `CancelledError` und kehrt normal zurück. Der Block endet ohne Ausnahme, und es gibt keinen `TimeoutError`. Wer den Abbruch verschluckt, entwertet das Timeout.
    resources:
      - title: asyncio.timeout
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.timeout
      - title: asyncio.Task.cancel
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.Task.cancel

  - id: lock-ergaenzen
    type: gap
    title: Den Lagerbestand schützen
    prompt: |
      Mehrere Threads reservieren gleichzeitig Artikel. Unter Last wird manchmal mehr reserviert, als im Lager ist. Ergänze die Lücken so, dass Prüfen und Abziehen ein unteilbarer Schritt werden.
    lang: python
    code: |
      import threading

      class Lager:
          def __init__(self, bestand: int) -> None:
              self.bestand = bestand
              self._lock = ⟦threading.Lock()⟧

          def reserviere(self, menge: int) -> bool:
              ⟦with self._lock:⟧
                  if self.bestand >= menge:
                      self.bestand -= menge
                      return True
                  return False
    gaps:
      - label: Lock erzeugen
        hint: Eine Klasse aus `threading`.
        accept: ["threading.RLock()"]
      - label: Kritischer Abschnitt
        hint: Ein Lock ist ein Context Manager.
    explanation: |
      Das Muster „prüfen, dann handeln“ (Check-then-Act) ist nur korrekt, wenn kein anderer Thread zwischen Prüfung und Änderung eingreift. Zwei Threads könnten sonst beide `bestand >= menge` sehen und beide abziehen. `with self._lock:` sorgt dafür, dass immer nur ein Thread im Block ist, und gibt den Lock auch bei `return` oder Exceptions frei. Der GIL hilft hier nicht: Er schützt einzelne Bytecode-Schritte des Interpreters, nicht deine zwei Zeilen Logik.
    resources:
      - title: threading · Lock objects
        url: https://docs.python.org/3/library/threading.html#lock-objects

  - id: queue-shutdown-ergaenzen
    type: gap
    title: Consumer ohne cancel beenden
    prompt: |
      Der Producer ist fertig, und der Konsument soll nach den vorhandenen Einträgen von selbst enden, ohne `cancel()` und ohne Sentinel. Ergänze die Lücken (Python 3.13 oder neuer).
    lang: python
    code: |
      import asyncio

      async def konsument(queue, log):
          while True:
              try:
                  eintrag = ⟦await queue.get()⟧
              except ⟦asyncio.QueueShutDown⟧:
                  return
              log.append(eintrag.upper())
              ⟦queue.task_done()⟧

      async def main():
          queue = asyncio.Queue()
          log = []
          task = asyncio.create_task(konsument(queue, log))
          for zeile in ["a", "b"]:
              await queue.put(zeile)
          queue.⟦shutdown()⟧
          await task
          print(log)

      await main()
    gaps:
      - label: Eintrag holen
        hint: "`get()` ist eine Coroutine."
      - label: Ausnahme beim Ende
        hint: Eine Klasse aus dem Modul `asyncio`, die „Queue“ und „ShutDown“ im Namen trägt.
      - label: Eintrag abschließen
        hint: Pro `get()` ein Aufruf, damit `join()` zählen kann.
      - label: Queue schließen
        hint: Eine Methode ohne Argumente. Sie lässt die vorhandenen Einträge noch abholen.
    explanation: |
      Nach `shutdown()` löst `put()` einen `QueueShutDown` aus, `get()` liefert aber weiter die vorhandenen Einträge. Erst bei leerer Queue löst auch `get()` den `QueueShutDown` aus, und der Konsument beendet sich selbst. Das Ergebnis ist `['A', 'B']`. Vor Python 3.13 brauchte man dafür eine Sentinel-Marke pro Konsument oder `cancel()`. `task_done()` gehört trotzdem dazu: Es meldet der Queue jeden fertigen Eintrag.
    resources:
      - title: asyncio.Queue.shutdown
        url: https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue.shutdown
      - title: asyncio.QueueShutDown
        url: https://docs.python.org/3/library/asyncio-queue.html#asyncio.QueueShutDown

  - id: async-transaktion-ergaenzen
    type: gap
    title: Eine async Transaktion
    prompt: |
      `Transaktion` startet beim Betreten eine Datenbanktransaktion, committet bei Erfolg und rollt bei einer Exception zurück. Die Exception soll weiterfliegen. Ergänze die Lücken.
    lang: python
    code: |
      class Transaktion:
          def __init__(self, db):
              self.db = db

          ⟦async def __aenter__⟧(self):
              await self.db.begin()
              return self.db

          ⟦async def __aexit__⟧(self, exc_type, exc, tb):
              if ⟦exc_type is None⟧:
                  await self.db.commit()
              else:
                  await self.db.⟦rollback()⟧
              return ⟦False⟧

      async def speichere(db, zeilen):
          ⟦async with⟧ Transaktion(db) as t:
              for zeile in zeilen:
                  await t.insert(zeile)
    gaps:
      - label: Methode zum Betreten
        hint: Beide Methoden sind Coroutinen und tragen ein `a` im Namen.
      - label: Methode zum Verlassen
        hint: Sie bekommt Typ, Wert und Traceback einer Exception.
      - label: Erfolgsfall
        hint: Ohne Exception ist der Typ `None`.
        accept: ["exc is None"]
      - label: Zurückrollen
        hint: Das Gegenstück zu `commit()`.
      - label: Exception nicht unterdrücken
        hint: Ein wahrer Rückgabewert würde die Exception verschlucken.
        accept: ["None"]
      - label: Block öffnen
        hint: Der Context Manager ist asynchron.
    explanation: |
      `async with` ruft `__aenter__` und `__aexit__` als Coroutinen auf und wartet sie ab. Deshalb dürfen sie `await`en: `begin`, `commit` und `rollback` sind Netzwerkaufrufe. `__aexit__` bekommt die Exception des Blocks, oder dreimal `None`. Ein falscher Rückgabewert (`False` oder `None`) lässt die Exception weiterfliegen. `return True` würde sie unterdrücken, und der Aufrufer sähe den Fehler nie, obwohl zurückgerollt wurde.
    resources:
      - title: Datenmodell · Asynchronous Context Managers
        url: https://docs.python.org/3/reference/datamodel.html#async-context-managers
      - title: Die async with-Anweisung
        url: https://docs.python.org/3/reference/compound_stmts.html#async-with

  - id: begrenzt-abrufen
    type: code
    title: Höchstens n Anfragen gleichzeitig
    prompt: |
      Schreibe `async def hole_alle(urls, hole, limit)`. Sie ruft für jede URL `await hole(url)` auf – nebenläufig, aber mit höchstens `limit` Aufrufen gleichzeitig – und gibt die Ergebnisse **in der Reihenfolge der URLs** zurück.

      `hole` ist eine async-Funktion, die du als Parameter bekommst (in Tests ein Fake, in Produktion etwa ein `httpx`-Aufruf).
    lang: python
    starter: |
      import asyncio

      async def hole_alle(urls: list[str], hole, limit: int) -> list[str]:
          ergebnisse = []
          for url in urls:
              ergebnisse.append(await hole(url))
          return ergebnisse
    solution: |
      import asyncio

      async def hole_alle(urls: list[str], hole, limit: int) -> list[str]:
          semaphore = asyncio.Semaphore(limit)

          async def begrenzt(url: str) -> str:
              async with semaphore:
                  return await hole(url)

          return await asyncio.gather(*(begrenzt(url) for url in urls))
    setup: |
      import asyncio

      class FakeServer:
          def __init__(self, dauer=0.02):
              self.aktiv = 0
              self.maximal = 0
              self.dauer = dauer
          async def hole(self, url):
              self.aktiv += 1
              self.maximal = max(self.maximal, self.aktiv)
              await asyncio.sleep(self.dauer)
              self.aktiv -= 1
              return f"<html>{url}</html>"
    tests:
      - name: Ergebnisse in Reihenfolge der URLs
        code: |
          server = FakeServer()
          urls = [f"/p/{i}" for i in range(6)]
          ergebnis = await hole_alle(urls, server.hole, limit=3)
          assert ergebnis == [f"<html>/p/{i}</html>" for i in range(6)], ergebnis
      - name: Das Limit wird ausgeschöpft
        code: |
          server = FakeServer()
          await hole_alle([f"/p/{i}" for i in range(10)], server.hole, limit=3)
          assert server.maximal == 3, f"höchstens gleichzeitig: {server.maximal}, erwartet genau 3 – laufen die Aufrufe nebenläufig?"
      - name: Nie mehr als das Limit
        code: |
          server = FakeServer()
          await hole_alle([f"/p/{i}" for i in range(20)], server.hole, limit=5)
          assert server.maximal <= 5, f"{server.maximal} Aufrufe gleichzeitig bei limit=5"
      - name: Limit 1 heißt nacheinander
        code: |
          server = FakeServer(dauer=0.005)
          assert await hole_alle(["/a", "/b"], server.hole, limit=1) == ["<html>/a</html>", "<html>/b</html>"]
          assert server.maximal == 1
      - name: Leere Liste
        code: |
          assert await hole_alle([], FakeServer().hole, limit=3) == []
    hints:
      - "`asyncio.Semaphore(limit)` lässt höchstens `limit` Coroutinen gleichzeitig in einen `async with`-Block."
      - Umhülle `hole` in eine kleine innere Coroutine, die das Semaphore betritt, und übergib alle an `asyncio.gather`.
    explanation: |
      Der Startcode ist korrekt, aber seriell: Jedes `await` wartet, bevor die nächste Anfrage startet. `gather` startet alle Coroutinen nebenläufig und liefert die Ergebnisse in Argumentreihenfolge. Das `Semaphore` begrenzt, wie viele gleichzeitig im `async with`-Block sind; die übrigen warten an dessen Eingang. So bleibt die Last für den fremden Server kontrolliert. Das Semaphore muss innerhalb der Funktion entstehen, damit jeder Aufruf sein eigenes Limit hat.
    resources:
      - title: asyncio.Semaphore
        url: https://docs.python.org/3/library/asyncio-sync.html#asyncio.Semaphore
      - title: asyncio.gather
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.gather

  - id: timeout-fallback
    type: code
    title: Timeout mit Fallback
    prompt: |
      Schreibe `async def hole_mit_timeout(hole, url, sekunden, fallback=None)`:

      - Liefert `await hole(url)`, wenn der Aufruf innerhalb von `sekunden` fertig wird.
      - Liefert `fallback`, wenn die Frist abläuft.
      - Andere Exceptions (etwa `ConnectionError`) fliegen unverändert weiter.

      Nutze `asyncio.timeout` (seit Python 3.11).
    lang: python
    starter: |
      import asyncio

      async def hole_mit_timeout(hole, url, sekunden, fallback=None):
          try:
              return await hole(url)
          except Exception:
              return fallback
    solution: |
      import asyncio

      async def hole_mit_timeout(hole, url, sekunden, fallback=None):
          try:
              async with asyncio.timeout(sekunden):
                  return await hole(url)
          except TimeoutError:
              return fallback
    setup: |
      import asyncio
      import time

      async def schnell(url):
          await asyncio.sleep(0.01)
          return f"ok {url}"

      async def haengt(url):
          await asyncio.sleep(3)
          return "zu spät"

      async def kaputt(url):
          raise ConnectionError("Verbindung abgelehnt")
    tests:
      - name: Schnelle Antwort kommt durch
        code: |
          assert await hole_mit_timeout(schnell, "/status", 0.5) == "ok /status"
      - name: Nach Ablauf der Frist kommt der Fallback
        code: |
          start = time.perf_counter()
          ergebnis = await hole_mit_timeout(haengt, "/status", 0.05, fallback="cache")
          dauer = time.perf_counter() - start
          assert ergebnis == "cache", f"erwartet 'cache', bekommen {ergebnis!r}"
          assert dauer < 1, f"hat {dauer:.2f} s gewartet – bricht das Timeout den Aufruf ab?"
      - name: Standard-Fallback ist None
        code: |
          assert await hole_mit_timeout(haengt, "/status", 0.02) is None
      - name: Andere Fehler fliegen weiter
        code: |
          try:
              await hole_mit_timeout(kaputt, "/status", 0.5, fallback="cache")
          except ConnectionError:
              pass
          else:
              raise AssertionError("ConnectionError darf nicht zum Fallback werden – nur Timeouts.")
    hints:
      - "`async with asyncio.timeout(sekunden):` um das `await`."
      - Fang nur `TimeoutError`, nicht `Exception`.
    explanation: |
      `asyncio.timeout` bricht die wartende Coroutine nach Ablauf der Frist ab (intern mit einer Cancellation) und wandelt das am Ende des Blocks in `TimeoutError` um. Der Startcode hatte zwei Probleme: kein Timeout, also hängt er so lange wie der Server, und `except Exception` macht aus jedem Verbindungsfehler still einen Fallback – Fehler verschwinden aus Logs und Monitoring. Fange nur, was du bewusst behandelst.
    resources:
      - title: asyncio.timeout
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.timeout

  - id: dienste-pruefen
    type: code
    title: Healthcheck mit gather
    prompt: |
      Ein Healthcheck-Endpunkt prüft mehrere Dienste. Schreibe `async def pruefe_dienste(checks)`:

      - `checks` ist ein Dictionary `{name: async_funktion}`; jede Funktion wird ohne Argumente aufgerufen.
      - Alle Checks laufen **nebenläufig**.
      - Ein fehlschlagender Check darf die anderen nicht abbrechen.
      - Rückgabe: ein Dictionary `{name: "ok"}` für erfolgreiche Checks und `{name: "Fehler: <Meldung>"}` für gescheiterte, wobei `<Meldung>` `str(exception)` ist.
    lang: python
    starter: |
      import asyncio

      async def pruefe_dienste(checks):
          ergebnis = {}
          for name, check in checks.items():
              await check()
              ergebnis[name] = "ok"
          return ergebnis
    solution: |
      import asyncio

      async def pruefe_dienste(checks):
          namen = list(checks)
          antworten = await asyncio.gather(*(checks[name]() for name in namen), return_exceptions=True)
          ergebnis = {}
          for name, antwort in zip(namen, antworten):
              if isinstance(antwort, Exception):
                  ergebnis[name] = f"Fehler: {antwort}"
              else:
                  ergebnis[name] = "ok"
          return ergebnis
    setup: |
      import asyncio
      import time

      async def datenbank():
          await asyncio.sleep(0.1)
          return True

      async def cache():
          await asyncio.sleep(0.1)
          return True

      async def mailserver():
          await asyncio.sleep(0.05)
          raise ConnectionError("smtp nicht erreichbar")
    tests:
      - name: Alle gesund
        code: |
          assert await pruefe_dienste({"db": datenbank, "cache": cache}) == {"db": "ok", "cache": "ok"}
      - name: Ein Fehler bricht die anderen nicht ab
        code: |
          ergebnis = await pruefe_dienste({"db": datenbank, "mail": mailserver, "cache": cache})
          assert ergebnis == {"db": "ok", "mail": "Fehler: smtp nicht erreichbar", "cache": "ok"}, ergebnis
      - name: Läuft nebenläufig
        code: |
          start = time.perf_counter()
          await pruefe_dienste({"db": datenbank, "cache": cache, "mail": mailserver})
          dauer = time.perf_counter() - start
          assert dauer < 0.2, f"dauerte {dauer:.2f} s – nacheinander wären es 0,25 s, nebenläufig ~0,1 s"
      - name: Keine Checks
        code: |
          assert await pruefe_dienste({}) == {}
    hints:
      - "`asyncio.gather(*coroutinen, return_exceptions=True)` liefert Exceptions als Elemente der Ergebnisliste."
      - Die Ergebnisliste hat dieselbe Reihenfolge wie die Argumente – merk dir die Namen in derselben Reihenfolge.
    explanation: |
      Der Startcode prüft nacheinander, und der erste Fehler bricht alles ab. `gather` startet alle Checks gleichzeitig; mit `return_exceptions=True` landet eine Exception als Wert in der Ergebnisliste, statt `gather` abzubrechen. Weil `gather` die Reihenfolge der Argumente einhält, kannst du Namen und Ergebnisse mit `zip` zusammenführen. Eine `TaskGroup` wäre hier die falsche Wahl: Sie bricht bei einem Fehler die übrigen Tasks ab.
    resources:
      - title: asyncio.gather
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.gather

  - id: dashboard-reparieren
    type: code
    title: Repariere das langsame Dashboard
    prompt: |
      `lade_dashboard` braucht so lange wie die drei API-Aufrufe zusammen, obwohl sie unabhängig voneinander sind. Repariere die Funktion so, dass die drei Aufrufe **nebenläufig** laufen. Das Ergebnis bleibt gleich, und ein Fehler in einem Aufruf soll weiterhin beim Aufrufer ankommen.
    lang: python
    starter: |
      import asyncio

      async def lade_dashboard(nutzer_id: int, api) -> dict:
          profil = await api.profil(nutzer_id)
          bestellungen = await api.bestellungen(nutzer_id)
          nachrichten = await api.nachrichten(nutzer_id)
          return {"profil": profil, "bestellungen": bestellungen, "nachrichten": nachrichten}
    solution: |
      import asyncio

      async def lade_dashboard(nutzer_id: int, api) -> dict:
          async with asyncio.TaskGroup() as tg:
              profil = tg.create_task(api.profil(nutzer_id))
              bestellungen = tg.create_task(api.bestellungen(nutzer_id))
              nachrichten = tg.create_task(api.nachrichten(nutzer_id))
          return {
              "profil": profil.result(),
              "bestellungen": bestellungen.result(),
              "nachrichten": nachrichten.result(),
          }
    setup: |
      import asyncio

      class FakeApi:
          def __init__(self, kaputt=None):
              self.aktiv = 0
              self.maximal = 0
              self.kaputt = kaputt
          async def _anfrage(self, name, wert):
              self.aktiv += 1
              self.maximal = max(self.maximal, self.aktiv)
              await asyncio.sleep(0.03)
              self.aktiv -= 1
              if name == self.kaputt:
                  raise ValueError(f"{name} fehlgeschlagen")
              return wert
          async def profil(self, nutzer_id):
              return await self._anfrage("profil", {"id": nutzer_id, "name": "Ada"})
          async def bestellungen(self, nutzer_id):
              return await self._anfrage("bestellungen", [101, 102])
          async def nachrichten(self, nutzer_id):
              return await self._anfrage("nachrichten", ["Willkommen"])
    tests:
      - name: Ergebnis bleibt gleich
        code: |
          ergebnis = await lade_dashboard(7, FakeApi())
          assert ergebnis == {"profil": {"id": 7, "name": "Ada"}, "bestellungen": [101, 102], "nachrichten": ["Willkommen"]}, ergebnis
      - name: Die drei Aufrufe laufen gleichzeitig
        code: |
          api = FakeApi()
          await lade_dashboard(7, api)
          assert api.maximal == 3, f"höchstens {api.maximal} Aufrufe gleichzeitig – erwartet 3"
      - name: Fehler kommen beim Aufrufer an
        code: |
          angekommen = False
          try:
              await lade_dashboard(7, FakeApi(kaputt="bestellungen"))
          except* ValueError:
              angekommen = True
          assert angekommen, "Der ValueError aus api.bestellungen muss beim Aufrufer ankommen."
    hints:
      - "`asyncio.TaskGroup` oder `asyncio.gather` starten mehrere Coroutinen nebenläufig."
      - Mit TaskGroup holst du die Ergebnisse nach dem `async with`-Block mit `.result()` ab.
    explanation: |
      Drei `await` hintereinander sind korrekt, aber seriell: Die zweite Anfrage startet erst, wenn die erste fertig ist. Mit einer `TaskGroup` starten alle drei sofort, und der Block endet, wenn alle fertig sind; die Gesamtdauer entspricht dem langsamsten Aufruf. Scheitert einer, bricht die TaskGroup die anderen ab und wirft eine `ExceptionGroup` – deshalb fängt der Test mit `except*`. `asyncio.gather` wäre ebenso richtig; es wirft die erste Exception direkt, lässt die anderen Aufrufe aber weiterlaufen.
    resources:
      - title: asyncio · Task Groups
        url: https://docs.python.org/3/library/asyncio-task.html#task-groups
      - title: Die try-Anweisung (except*)
        url: https://docs.python.org/3/reference/compound_stmts.html#except-star

  - id: queue-pipeline
    type: code
    title: Worker-Pool mit Queue
    prompt: |
      Schreibe `async def verarbeite_alle(jobs, bearbeite, worker)`:

      - `bearbeite` ist eine async-Funktion, `await bearbeite(job)` liefert das Ergebnis eines Jobs.
      - Es arbeiten genau `worker` Worker-Tasks, die ihre Jobs aus einer `asyncio.Queue` holen. Nimm `maxsize=worker`, damit der Producer nicht weit vorausläuft.
      - Rückgabe: die Ergebnisse **in der Reihenfolge der `jobs`**.
      - Wirft `bearbeite(job)` eine `Exception`, steht an dieser Stelle der Ergebnisliste die Exception selbst, und die Verarbeitung der übrigen Jobs läuft weiter.
      - Beim Zurückkehren sind alle Worker-Tasks beendet.
    lang: python
    starter: |
      import asyncio

      async def verarbeite_alle(jobs, bearbeite, worker):
          return [await bearbeite(job) for job in jobs]
    solution: |
      import asyncio

      async def verarbeite_alle(jobs, bearbeite, worker):
          queue = asyncio.Queue(maxsize=worker)
          ergebnisse = [None] * len(jobs)

          async def arbeiter():
              while True:
                  index, job = await queue.get()
                  try:
                      ergebnisse[index] = await bearbeite(job)
                  except Exception as fehler:
                      ergebnisse[index] = fehler
                  finally:
                      queue.task_done()

          tasks = [asyncio.create_task(arbeiter()) for _ in range(worker)]
          try:
              for index, job in enumerate(jobs):
                  await queue.put((index, job))
              await queue.join()
          finally:
              for task in tasks:
                  task.cancel()
              await asyncio.gather(*tasks, return_exceptions=True)
          return ergebnisse
    setup: |
      import asyncio

      class Messer:
          def __init__(self):
              self.aktiv = 0
              self.maximal = 0
          async def doppelt(self, n):
              self.aktiv += 1
              self.maximal = max(self.maximal, self.aktiv)
              await asyncio.sleep(0.03 if n == 0 else 0.01)
              self.aktiv -= 1
              return n * 2

      async def mit_fehler(n):
          await asyncio.sleep(0)
          if n == 2:
              raise ValueError(f"Job {n} kaputt")
          return n * 2
    tests:
      - name: Ergebnisse in der Reihenfolge der Jobs
        code: |
          messer = Messer()
          ergebnis = await verarbeite_alle([0, 1, 2, 3, 4], messer.doppelt, worker=3)
          assert ergebnis == [0, 2, 4, 6, 8], f"erwartet [0, 2, 4, 6, 8], bekommen {ergebnis!r}"
      - name: Es arbeiten genau so viele Worker gleichzeitig wie verlangt
        code: |
          messer = Messer()
          await verarbeite_alle(list(range(12)), messer.doppelt, worker=3)
          assert messer.maximal == 3, f"höchstens {messer.maximal} Jobs gleichzeitig, erwartet genau 3"
      - name: Ein Fehler wird Ergebnis und hält nichts auf
        code: |
          try:
              async with asyncio.timeout(2):
                  ergebnis = await verarbeite_alle([1, 2, 3], mit_fehler, worker=2)
          except TimeoutError:
              raise AssertionError("verarbeite_alle hängt: Wird task_done() auch nach einer Exception aufgerufen?")
          assert ergebnis[0] == 2 and ergebnis[2] == 6, ergebnis
          assert isinstance(ergebnis[1], ValueError), f"an Stelle 1 erwartet ValueError, bekommen {ergebnis[1]!r}"
      - name: Nach der Rückkehr laufen keine Worker mehr
        code: |
          vorher = asyncio.all_tasks()
          await verarbeite_alle([1, 2, 3], Messer().doppelt, worker=2)
          uebrig = asyncio.all_tasks() - vorher
          assert not uebrig, f"{len(uebrig)} Task(s) laufen noch: brich die Worker ab und warte auf sie."
      - name: Leere Jobliste
        code: |
          assert await verarbeite_alle([], Messer().doppelt, worker=2) == []
    hints:
      - "Packe `(index, job)` in die Queue, damit ein Worker sein Ergebnis an die richtige Stelle schreiben kann."
      - "`task_done()` gehört in ein `finally`, sonst wartet `queue.join()` nach einem Fehler ewig."
      - Nach `join()` laufen die Worker noch. Brich sie ab und warte mit `asyncio.gather(*tasks, return_exceptions=True)`.
    explanation: |
      Der Producer legt `(index, job)` in die Queue, die Worker holen sie ab und schreiben das Ergebnis auf den Platz `index`. So bleibt die Eingabereihenfolge erhalten, obwohl die Jobs in beliebiger Reihenfolge fertig werden. `maxsize=worker` lässt `put` warten, wenn alle Worker beschäftigt sind (Backpressure). `queue.task_done()` im `finally` stellt sicher, dass `join()` auch nach einem Fehler zurückkehrt. Die Worker sind Endlosschleifen: Nach `join()` bricht der `finally`-Block sie ab und wartet mit `gather(..., return_exceptions=True)`, bis sie beendet sind. Der Worker fängt nur `Exception`, damit der Abbruch durchkommt.
    resources:
      - title: asyncio.Queue
        url: https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue
      - title: asyncio.Queue.join
        url: https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue.join

  - id: erster-erfolg
    type: code
    title: Der Schnellste gewinnt
    prompt: |
      Schreibe `async def erster_erfolg(quellen)`. `quellen` ist eine Liste von async-Funktionen ohne Argumente (etwa drei Mirror-Server). Alle starten gleichzeitig.

      - Rückgabe: das Ergebnis der Quelle, die **zuerst erfolgreich** fertig wird.
      - Eine Quelle, die eine `Exception` wirft, wird übersprungen.
      - Scheitern alle, löse `RuntimeError("alle Quellen gescheitert")` aus.
      - Beim Zurückkehren sind alle übrigen Quellen abgebrochen und beendet.

      Nutze `asyncio.as_completed` (Python 3.13 oder neuer, mit `async for`).
    lang: python
    starter: |
      import asyncio

      async def erster_erfolg(quellen):
          for quelle in quellen:
              try:
                  return await quelle()
              except Exception:
                  continue
          raise RuntimeError("alle Quellen gescheitert")
    solution: |
      import asyncio

      async def erster_erfolg(quellen):
          tasks = [asyncio.create_task(quelle()) for quelle in quellen]
          try:
              async for fertig in asyncio.as_completed(tasks):
                  try:
                      return await fertig
                  except Exception:
                      continue
              raise RuntimeError("alle Quellen gescheitert")
          finally:
              for task in tasks:
                  task.cancel()
              await asyncio.gather(*tasks, return_exceptions=True)
    setup: |
      import asyncio

      log = []

      def nach(dauer, wert):
          async def quelle():
              await asyncio.sleep(dauer)
              return wert
          return quelle

      async def kaputt():
          raise ConnectionError("Server nicht erreichbar")

      async def haengt():
          try:
              await asyncio.Event().wait()
          except asyncio.CancelledError:
              log.append("haengt: abgebrochen")
              raise
    tests:
      - name: Die schnellere Quelle gewinnt
        code: |
          ergebnis = await erster_erfolg([nach(0.05, "langsam"), nach(0.01, "schnell")])
          assert ergebnis == "schnell", f"erwartet 'schnell', bekommen {ergebnis!r}: starten alle Quellen gleichzeitig?"
      - name: Gescheiterte Quellen werden übersprungen
        code: |
          assert await erster_erfolg([kaputt, nach(0.01, "gut")]) == "gut"
      - name: Verlierer werden abgebrochen und abgewartet
        code: |
          log.clear()
          vorher = asyncio.all_tasks()
          try:
              async with asyncio.timeout(1):
                  ergebnis = await erster_erfolg([haengt, nach(0.01, "schnell")])
          except TimeoutError:
              raise AssertionError("erster_erfolg hängt an der Quelle, die nie fertig wird.")
          assert ergebnis == "schnell"
          assert log == ["haengt: abgebrochen"], f"die hängende Quelle wurde nicht abgebrochen und abgewartet: {log}"
          assert not (asyncio.all_tasks() - vorher), "es laufen noch Tasks"
      - name: Alle scheitern
        code: |
          try:
              await erster_erfolg([kaputt, kaputt])
          except RuntimeError as fehler:
              assert "alle Quellen gescheitert" in str(fehler)
          else:
              raise AssertionError("RuntimeError erwartet, wenn alle Quellen scheitern.")
    hints:
      - "Erzeuge mit `asyncio.create_task` für jede Quelle einen Task und gib die Liste an `asyncio.as_completed`."
      - "`async for fertig in asyncio.as_completed(tasks)` liefert fertige Tasks. `await fertig` gibt das Ergebnis oder wirft die Exception."
      - "`as_completed` bricht nichts ab. Räume in `finally` auf: `cancel()` für alle, dann `gather(..., return_exceptions=True)`."
    explanation: |
      Der Startcode probiert die Quellen nacheinander: Er wartet auf die langsame, obwohl die schnelle längst fertig wäre, und bleibt an einer hängenden Quelle ewig hängen. Mit `as_completed` laufen alle gleichzeitig, und die Schleife liefert die Tasks in der Reihenfolge ihrer Fertigstellung. Eine gescheiterte Quelle (`except Exception`) wird übersprungen, die erste erfolgreiche beendet die Funktion mit `return`. `as_completed` selbst bricht die übrigen Tasks nicht ab. Deshalb ruft das `finally` für alle `cancel()` auf und wartet danach mit `gather`, bis sie beendet sind. Das gilt auch für den Fall, dass alle scheitern.
    resources:
      - title: asyncio.as_completed
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.as_completed
      - title: asyncio.Task.cancel
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.Task.cancel

  - id: konto-sperren
    type: code
    title: Doppelt abgebucht
    prompt: |
      Ein Zahlungsdienst bucht von einem `Konto` ab. Zwischen Prüfung und Abbuchung ruft er eine Betrugsprüfung auf (`await asyncio.sleep(0)` steht dafür). Bei zwei gleichzeitigen Abbuchungen von je 80 Euro auf einem Konto mit 100 Euro gehen beide durch, und der Saldo fällt auf −60.

      Repariere `Konto.abbuchen`: Gibt es genug Saldo, wird abgebucht und `True` zurückgegeben, sonst bleibt der Saldo unverändert und das Ergebnis ist `False`. Das muss auch bei beliebig vielen gleichzeitigen Aufrufen stimmen. Die Betrugsprüfung bleibt zwischen Prüfung und Abbuchung.
    lang: python
    starter: |
      import asyncio

      class Konto:
          def __init__(self, saldo: int) -> None:
              self.saldo = saldo

          async def abbuchen(self, betrag: int) -> bool:
              if self.saldo >= betrag:
                  await asyncio.sleep(0)       # Betrugsprüfung beim Zahlungsdienst
                  self.saldo -= betrag
                  return True
              return False
    solution: |
      import asyncio

      class Konto:
          def __init__(self, saldo: int) -> None:
              self.saldo = saldo
              self._lock = asyncio.Lock()

          async def abbuchen(self, betrag: int) -> bool:
              async with self._lock:
                  if self.saldo >= betrag:
                      await asyncio.sleep(0)   # Betrugsprüfung beim Zahlungsdienst
                      self.saldo -= betrag
                      return True
                  return False
    tests:
      - name: Zwei gleichzeitige Abbuchungen, Geld nur für eine
        code: |
          konto = Konto(100)
          ergebnis = await asyncio.gather(konto.abbuchen(80), konto.abbuchen(80))
          assert sorted(ergebnis) == [False, True], f"erwartet genau eine erfolgreiche Abbuchung, bekommen {ergebnis}"
          assert konto.saldo == 20, f"Saldo {konto.saldo}, erwartet 20"
      - name: Genug Geld für alle
        code: |
          konto = Konto(100)
          ergebnis = await asyncio.gather(*(konto.abbuchen(10) for _ in range(5)))
          assert ergebnis == [True] * 5
          assert konto.saldo == 50
      - name: Zu viele Abbuchungen, der Saldo wird nie negativ
        code: |
          konto = Konto(100)
          ergebnis = await asyncio.gather(*(konto.abbuchen(40) for _ in range(3)))
          assert ergebnis.count(True) == 2, f"erwartet 2 erfolgreiche Abbuchungen, bekommen {ergebnis}"
          assert konto.saldo == 20, f"Saldo {konto.saldo}, erwartet 20"
      - name: Einzelne Abbuchung ohne genug Saldo
        code: |
          konto = Konto(30)
          assert await konto.abbuchen(50) is False
          assert konto.saldo == 30
    hints:
      - "Zwischen der Prüfung und der Abbuchung steht ein `await`: Dort laufen andere Coroutinen."
      - "Ein `asyncio.Lock` in `__init__` und `async with self._lock:` um Prüfen und Abbuchen."
    explanation: |
      asyncio wechselt nur an einem `await`. Hier liegt eines zwischen Prüfung und Abbuchung: Beide Aufrufe sehen 100 Euro, bevor einer von ihnen abbucht, und beide buchen ab. Das ist ein Check-then-Act-Fehler, nur eben mit Coroutinen statt Threads. Der `asyncio.Lock` macht den ganzen Abschnitt exklusiv, auch über das `await` hinweg: Der zweite Aufruf wartet am `async with`, bis der erste fertig ist, und sieht dann den neuen Saldo. Das Lock gehört in `__init__`, damit jedes Konto sein eigenes hat. Alternativ prüfst du nach dem `await` erneut. Das Lock ist aber einfacher zu überblicken.
    resources:
      - title: asyncio.Lock
        url: https://docs.python.org/3/library/asyncio-sync.html#asyncio.Lock

  - id: bestellung-geschuetzt
    type: code
    title: Speichern darf nicht abbrechen
    prompt: |
      Ein Webhandler ruft `speichere_geschuetzt(speichern, daten)` auf. Die Funktion führt `await speichern(daten)` aus und gibt das Ergebnis zurück. Wird der Handler abgebrochen (Client trennt, Timeout), darf das **Speichern selbst nicht abbrechen**: Es läuft zu Ende, auch wenn niemand mehr auf das Ergebnis wartet.

      Der Aufrufer bekommt bei Abbruch trotzdem seine `CancelledError`. Fehler aus `speichern` kommen unverändert beim Aufrufer an.
    lang: python
    starter: |
      import asyncio

      async def speichere_geschuetzt(speichern, daten):
          return await speichern(daten)
    solution: |
      import asyncio

      async def speichere_geschuetzt(speichern, daten):
          schreiben = asyncio.create_task(speichern(daten))     # Referenz behalten
          return await asyncio.shield(schreiben)
    setup: |
      import asyncio

      log = []

      async def speichern_mit_tor(daten, tor):
          log.append("start")
          await tor.wait()
          log.append("fertig")
          return f"gespeichert {daten}"

      async def speichern_kaputt(daten):
          await asyncio.sleep(0)
          raise ConnectionError("Datenbank weg")
    tests:
      - name: Ergebnis kommt beim Aufrufer an
        code: |
          log.clear()
          tor = asyncio.Event()
          tor.set()
          assert await speichere_geschuetzt(lambda d: speichern_mit_tor(d, tor), 7) == "gespeichert 7"
      - name: Der Abbruch des Aufrufers bricht das Speichern nicht ab
        code: |
          log.clear()
          tor = asyncio.Event()
          aufrufer = asyncio.create_task(speichere_geschuetzt(lambda d: speichern_mit_tor(d, tor), 7))
          for _ in range(3):
              await asyncio.sleep(0)
          assert log == ["start"], f"das Speichern sollte hängen und noch nicht fertig sein: {log}"
          aufrufer.cancel()
          try:
              await aufrufer
          except asyncio.CancelledError:
              pass
          assert aufrufer.cancelled(), "der Aufrufer sollte abgebrochen sein"
          tor.set()
          for _ in range(5):
              await asyncio.sleep(0)
          assert log == ["start", "fertig"], f"das Speichern wurde mit abgebrochen: {log}"
      - name: Fehler aus dem Speichern kommen an
        code: |
          try:
              await speichere_geschuetzt(speichern_kaputt, 1)
          except ConnectionError:
              pass
          else:
              raise AssertionError("ConnectionError aus dem Speichern muss beim Aufrufer ankommen.")
    hints:
      - "`asyncio.shield(aufgabe)` hält den Abbruch des Aufrufers vom inneren Task fern."
      - "Erzeuge den inneren Task mit `asyncio.create_task(speichern(daten))` und behalte die Referenz."
    explanation: |
      `await speichern(daten)` läuft im Task des Aufrufers. Wird der abgebrochen, bekommt `speichern` die `CancelledError` mitten im Schreiben. `asyncio.shield` entkoppelt beides: Der innere Task gehört der Event-Loop, und der Abbruch erreicht nur das äußere `await`. Dort löst `shield` weiter eine `CancelledError` aus, der Aufrufer ist also wie verlangt abgebrochen. Das Speichern läuft weiter. Die Dokumentation verlangt eine Referenz auf den inneren Task, sonst kann er mitten in der Ausführung verschwinden. Exceptions aus dem inneren Task kommen über `shield` unverändert an.
    resources:
      - title: asyncio.shield
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.shield

  - id: async-generator-seiten
    type: code
    title: Paginierte API als async Generator
    prompt: |
      Eine API liefert Einträge seitenweise. `await hole_seite(n)` gibt die Einträge der Seite `n` zurück (ab Seite 1); eine **leere Liste** bedeutet: keine weiteren Seiten.

      Schreibe `alle_eintraege(hole_seite)` als **async Generator**, der die Einträge einzeln liefert, Seite für Seite in Reihenfolge. Eine Seite wird erst geholt, wenn der Aufrufer ihre Einträge braucht. Wer nach dem dritten Eintrag aufhört, löst keine weiteren Abrufe aus.
    lang: python
    starter: |
      import asyncio

      async def alle_eintraege(hole_seite):
          ergebnis = []
          seite = 1
          while True:
              eintraege = await hole_seite(seite)
              if not eintraege:
                  break
              ergebnis.extend(eintraege)
              seite += 1
          return ergebnis
    solution: |
      import asyncio

      async def alle_eintraege(hole_seite):
          seite = 1
          while True:
              eintraege = await hole_seite(seite)
              if not eintraege:
                  return
              for eintrag in eintraege:
                  yield eintrag
              seite += 1
    setup: |
      import asyncio
      import inspect

      class FakeApi:
          def __init__(self, seiten):
              self.seiten = seiten
              self.aufrufe = []
          async def hole_seite(self, n):
              self.aufrufe.append(n)
              await asyncio.sleep(0)
              return self.seiten.get(n, [])
    tests:
      - name: Alle Einträge in Reihenfolge
        code: |
          api = FakeApi({1: ["a", "b"], 2: ["c", "d"], 3: ["e"]})
          ergebnis = [e async for e in alle_eintraege(api.hole_seite)]
          assert ergebnis == ["a", "b", "c", "d", "e"], ergebnis
      - name: Es ist ein async Generator
        code: |
          assert inspect.isasyncgenfunction(alle_eintraege), "alle_eintraege soll `async def` mit `yield` sein."
      - name: Seiten werden erst bei Bedarf geholt
        code: |
          api = FakeApi({1: ["a", "b"], 2: ["c", "d"], 3: ["e"]})
          gelesen = []
          async for eintrag in alle_eintraege(api.hole_seite):
              gelesen.append(eintrag)
              if len(gelesen) == 3:
                  break
          assert gelesen == ["a", "b", "c"]
          assert api.aufrufe == [1, 2], f"abgerufene Seiten: {api.aufrufe}, erwartet [1, 2]"
      - name: Leere erste Seite
        code: |
          api = FakeApi({})
          assert [e async for e in alle_eintraege(api.hole_seite)] == []
          assert api.aufrufe == [1]
    hints:
      - "Ein `async def` mit `yield` ist ein async Generator. Er braucht kein `return` mit Wert."
      - "Liefere in einer Schleife `yield eintrag`, und hole die nächste Seite erst danach."
    explanation: |
      Der Startcode holt zuerst alle Seiten und gibt dann eine Liste zurück. Das ist eine gewöhnliche Coroutine: Der Aufrufer kann nicht mit `async for` darüber laufen, und sie lädt alles, auch wenn er nach drei Einträgen aufhört. Ein async Generator liefert mit `yield` einen Wert und pausiert. Zwischen zwei Werten darf er `await` benutzen, etwa für den nächsten Abruf. Die nächste Seite wird deshalb erst geholt, wenn die Schleife des Aufrufers die Einträge der aktuellen verbraucht hat. Nach `break` bleibt der Generator stehen. Hält er Ressourcen, schließt du ihn mit `aclose()` oder `contextlib.aclosing`.
    resources:
      - title: Ausdrücke · Asynchronous generator functions
        url: https://docs.python.org/3/reference/expressions.html#asynchronous-generator-functions
      - title: Die async for-Anweisung
        url: https://docs.python.org/3/reference/compound_stmts.html#async-for

  - id: blockierender-sleep
    type: bug
    title: Der Server hört auf zu antworten
    prompt: |
      Ein async-Webserver ruft `sende_mit_backoff` für fehlgeschlagene Webhooks auf. Sobald ein Webhook wiederholt wird, beantwortet der Server **gar keine** Anfragen mehr, bis die Wartezeit vorbei ist – auch Healthchecks laufen in den Timeout. Finde die Zeile und korrigiere sie.
    lang: python
    code: |
      import asyncio
      import time

      async def sende_mit_backoff(sende, payload: dict, versuche: int = 3) -> bool:
          for versuch in range(versuche):
              if await sende(payload):
                  return True
              time.sleep(2 ** versuch)
          return False
    lines: [8]
    fix:
      - line: 8
        answers: ["await asyncio.sleep(2 ** versuch)"]
    explanation: |
      `time.sleep` blockiert den Thread – und in asyncio gibt es nur einen Thread mit der Event-Loop. Solange er schläft, kann die Loop keine andere Coroutine fortsetzen, also steht der ganze Server. `await asyncio.sleep(...)` gibt die Kontrolle an die Loop zurück und lässt sich nach der Wartezeit wecken. Dasselbe gilt für `requests.get`, synchrone Datenbanktreiber und lange Berechnungen: in async-Code durch asynchrone Varianten oder `asyncio.to_thread` ersetzen.
    resources:
      - title: asyncio · Running blocking code
        url: https://docs.python.org/3/library/asyncio-dev.html#running-blocking-code
      - title: asyncio.sleep
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.sleep

  - id: vergessenes-await
    type: bug
    title: Coroutine statt Kurs
    prompt: |
      Der Aufruf `await preis_in_usd(100)` scheitert mit:

      ```text
      TypeError: unsupported operand type(s) for *: 'int' and 'coroutine'
      RuntimeWarning: coroutine 'hole_kurs' was never awaited
      ```

      Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      import asyncio

      async def hole_kurs(waehrung: str) -> float:
          await asyncio.sleep(0.1)          # steht für einen API-Aufruf
          return {"USD": 1.08}[waehrung]

      async def preis_in_usd(betrag_eur: float) -> float:
          kurs = hole_kurs("USD")
          return round(betrag_eur * kurs, 2)
    lines: [8]
    fix:
      - line: 8
        answers: ["kurs = await hole_kurs(\"USD\")"]
    explanation: |
      Der Aufruf einer `async def`-Funktion führt ihren Körper nicht aus, sondern liefert ein Coroutine-Objekt. Erst `await` lässt die Coroutine laufen und liefert ihren Rückgabewert. Die `RuntimeWarning` ist der verlässliche Hinweis: Eine Coroutine wurde erzeugt und nie ausgeführt. mypy und pyright melden solche Stellen, weil der Typ `Coroutine[..., float]` statt `float` ist – ein Grund mehr für Type Hints in async-Code.
    resources:
      - title: asyncio · Coroutines
        url: https://docs.python.org/3/library/asyncio-task.html#coroutines
      - title: asyncio · Detect never-awaited coroutines
        url: https://docs.python.org/3/library/asyncio-dev.html#detect-never-awaited-coroutines

  - id: worker-schluckt-abbruch
    type: bug
    title: Der Shutdown hängt
    prompt: |
      Ein Service beendet sich mit `for w in workers: w.cancel()` und `await asyncio.gather(*workers)`. Meistens klappt das. Manchmal hängt der Shutdown für immer: Einige Worker laufen nach dem `cancel()` weiter und holen weitere Aufträge. Finde die Zeile und korrigiere sie.
    lang: python
    code: |
      import asyncio
      import logging

      log = logging.getLogger("worker")

      async def worker(queue: asyncio.Queue) -> None:
          while True:
              auftrag = await queue.get()
              try:
                  await verarbeite(auftrag)
              except (Exception, asyncio.CancelledError):
                  log.exception("Auftrag %s fehlgeschlagen", auftrag)
              finally:
                  queue.task_done()
    lines: [11]
    fix:
      - line: 11
        answers: ["except Exception:"]
    explanation: |
      `CancelledError` erbt von `BaseException`. Ein `except Exception` lässt sie durch, die Variante mit `asyncio.CancelledError` in der Liste fängt sie. Wird der Worker mitten in `verarbeite` abgebrochen, loggt er den Abbruch als Fehler und läuft in die nächste Runde. `cancel()` ist damit wirkungslos, und `gather` wartet auf einen Task, der nie endet. Mit `except Exception` bleiben echte Fehler einzelner Aufträge abgefangen, der Abbruch kommt durch, und `finally` ruft trotzdem `task_done()` auf. Willst du bei Abbruch aufräumen, fange `CancelledError` und rufe danach `raise` auf.
    resources:
      - title: asyncio.Task.cancel
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.Task.cancel
      - title: asyncio.CancelledError
        url: https://docs.python.org/3/library/asyncio-exceptions.html#asyncio.CancelledError

  - id: queue-ohne-grenze
    type: bug
    title: Der Import frisst den Arbeitsspeicher
    prompt: |
      Ein Import liest eine 4 GB große CSV-Datei Zeile für Zeile und schreibt sie mit vier Workern in die Datenbank. Der Prozess belegt trotzdem nach wenigen Sekunden mehrere Gigabyte Arbeitsspeicher, und die Datenbank sieht erst dann Last, wenn die Datei gelesen ist. Ops verlangt, dass höchstens 100 Zeilen im Speicher warten. Finde die Zeile und korrigiere sie.
    lang: python
    code: |
      import asyncio

      async def importiere(pfad: str, schreibe_zeile, worker_anzahl: int = 4) -> None:
          queue: asyncio.Queue[str] = asyncio.Queue()

          async def worker() -> None:
              while True:
                  zeile = await queue.get()
                  try:
                      await schreibe_zeile(zeile)
                  finally:
                      queue.task_done()

          tasks = [asyncio.create_task(worker()) for _ in range(worker_anzahl)]
          with open(pfad, encoding="utf-8") as datei:
              for zeile in datei:
                  await queue.put(zeile)
          await queue.join()
          for task in tasks:
              task.cancel()
    lines: [4]
    fix:
      - line: 4
        answers: ["queue: asyncio.Queue[str] = asyncio.Queue(maxsize=100)", "queue = asyncio.Queue(maxsize=100)", "queue: asyncio.Queue[str] = asyncio.Queue(100)", "queue = asyncio.Queue(100)"]
    explanation: |
      Eine `Queue` ohne `maxsize` ist unbegrenzt: `put()` kehrt sofort zurück, ohne der Event-Loop die Kontrolle zu geben. Die Schleife liest deshalb die ganze Datei, bevor ein Worker auch nur eine Zeile bekommt. Alle Zeilen liegen im Speicher. Mit `maxsize=100` wartet `await queue.put(...)`, sobald die Queue voll ist, und die Worker kommen zum Zug. Das ist Backpressure: Die langsamste Stufe gibt das Tempo vor. Der Speicherbedarf bleibt klein, egal wie groß die Datei ist.
    resources:
      - title: asyncio.Queue
        url: https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue
      - title: asyncio.Queue.put
        url: https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue.put

  - id: race-erklaeren
    type: explain
    title: Warum fehlen Seitenaufrufe?
    prompt: |
      Ein Flask-Dienst läuft mit mehreren Threads und zählt Seitenaufrufe im Speicher. Das Monitoring zeigt unter Last weniger Aufrufe als das Log des Load-Balancers. Ein Kollege meint: „Kann nicht sein, Python hat doch den GIL.“ Erkläre, was passiert, warum der GIL nicht hilft und wie du es behebst.
    lang: python
    code: |
      aufrufe: dict[str, int] = {}

      def zaehle(pfad: str) -> None:
          aufrufe[pfad] = aufrufe.get(pfad, 0) + 1
    points:
      - Die Zeile ist ein Lesen-Ändern-Schreiben aus mehreren Schritten (lesen mit `get`, addieren, zurückschreiben), kein atomarer Vorgang.
      - "Wechselt der Thread zwischen Lesen und Schreiben, lesen zwei Threads denselben alten Wert und schreiben beide `alt + 1` – ein Aufruf geht verloren (Lost Update)."
      - Der GIL sorgt nur dafür, dass einzelne Bytecode-Schritte den Interpreter nicht beschädigen; zwischen den Schritten darf er den Thread wechseln. Im free-threaded Build laufen Threads sogar echt parallel.
      - "Behebung: den Abschnitt mit einem `threading.Lock` schützen (`with lock:`), oder den Zähler in einen externen Speicher mit atomarem Inkrement auslagern (z. B. Redis `INCR`), wenn mehrere Prozesse laufen."
    explanation: |
      `aufrufe[pfad] = aufrufe.get(pfad, 0) + 1` sieht aus wie ein Schritt, ist aber drei: den alten Wert lesen, eins addieren, das Ergebnis schreiben. Der Interpreter darf zwischen diesen Schritten den Thread wechseln. Lesen zwei Threads beide `41`, schreiben beide `42` – ein Aufruf ist verloren. Unter Last passiert das häufiger, deshalb die Abweichung im Monitoring.

      Der GIL schützt den Interpreter vor kaputten internen Strukturen, nicht deine Programmlogik vor Unterbrechung. Im free-threaded Build von 3.14 fehlt er sogar ganz. Die Lösung ist ein `threading.Lock` um den Lesen-Ändern-Schreiben-Abschnitt. Läuft der Dienst zusätzlich in mehreren Prozessen (etwa mehreren Gunicorn-Workern), hat jeder Prozess ohnehin sein eigenes Dictionary; dann gehört der Zähler in einen gemeinsamen Speicher wie Redis mit atomarem `INCR`.
    resources:
      - title: threading · Lock objects
        url: https://docs.python.org/3/library/threading.html#lock-objects
      - title: Free-threading HOWTO · Thread safety
        url: https://docs.python.org/3/howto/free-threading-python.html#thread-safety

  - id: prozesspool-erklaeren
    type: explain
    title: Warum ist der Prozess-Pool langsamer?
    prompt: |
      Eine Kollegin will die Validierung von 200 000 kurzen Datensätzen beschleunigen. Version A braucht 0,4 s. Version B braucht 6 s und scheitert, sobald sie `pool.map(lambda d: d["email"].lower(), daten)` probiert, mit `PicklingError`. Erkläre beide Beobachtungen und wie es besser geht.
    lang: python
    code: |
      from concurrent.futures import ProcessPoolExecutor

      def ist_gueltig(datensatz: dict) -> bool:
          return "@" in datensatz.get("email", "") and len(datensatz.get("name", "")) > 1

      def version_a(daten: list[dict]) -> int:
          return sum(map(ist_gueltig, daten))

      def version_b(daten: list[dict]) -> int:
          with ProcessPoolExecutor() as pool:
              return sum(pool.map(ist_gueltig, daten))
    points:
      - Jeder Aufruf von `ist_gueltig` ist winzig (Mikrosekunden); bei Prozessen wird aber jedes Argument und Ergebnis mit pickle serialisiert und zwischen Prozessen kopiert – der Overhead übersteigt die Arbeit.
      - Das Starten der Worker-Prozesse kostet zusätzlich Zeit.
      - Lambdas (und lokal definierte Funktionen) lassen sich nicht pickeln, weil pickle Funktionen über ihren importierbaren Namen überträgt.
      - "Besser: bei so billigen Aufgaben seriell bleiben; wenn überhaupt parallel, mit großem `chunksize` bündeln und eine Funktion auf Modulebene übergeben; Startcode hinter `if __name__ == \"__main__\":`."
    explanation: |
      Prozess-Parallelität hat einen festen Preis: Worker starten und für jeden Aufruf Argumente und Ergebnisse per `pickle` über eine Pipe schicken. Bei 200 000 Aufrufen, die jeweils nur Mikrosekunden rechnen, besteht Version B fast nur aus diesem Overhead. `chunksize=10_000` würde die Nachrichten bündeln und den Abstand verkleinern, aber bei so billiger Arbeit gewinnt die serielle Version fast immer.

      `pickle` überträgt Funktionen nicht als Code, sondern als Verweis „Modul + Name“. Ein Lambda hat keinen importierbaren Namen, deshalb scheitert es. Die Faustregel: Prozesse lohnen sich für wenige, große CPU-lastige Aufgaben (Bilder, Berechnungen im Sekundenbereich), nicht für viele winzige.
    resources:
      - title: ProcessPoolExecutor
        url: https://docs.python.org/3/library/concurrent.futures.html#processpoolexecutor
      - title: pickle · What can be pickled and unpickled?
        url: https://docs.python.org/3/library/pickle.html#what-can-be-pickled-and-unpickled

  - id: pipeline-erklaeren
    type: explain
    title: Wie bremst und endet diese Pipeline?
    prompt: |
      Ein Kollege hat die Importpipeline in drei Stufen geschrieben und fragt im Review: „Warum zwei Queues mit `maxsize`, und woher weiß die letzte Stufe, wann Schluss ist?“ Erkläre, wie die Stufen zusammenspielen, was passiert, wenn `speichere` langsam ist, und wie die Pipeline endet.
    lang: python
    code: |
      async def pipeline(zeilen, parse, speichere):
          roh = asyncio.Queue(maxsize=50)
          fertig = asyncio.Queue(maxsize=50)

          async def lese():
              for zeile in zeilen:
                  await roh.put(zeile)
              roh.shutdown()

          async def wandle():
              while True:
                  try:
                      zeile = await roh.get()
                  except asyncio.QueueShutDown:
                      break
                  await fertig.put(parse(zeile))
              fertig.shutdown()

          async def schreibe():
              while True:
                  try:
                      datensatz = await fertig.get()
                  except asyncio.QueueShutDown:
                      return
                  await speichere(datensatz)

          async with asyncio.TaskGroup() as tg:
              tg.create_task(lese())
              tg.create_task(wandle())
              tg.create_task(schreibe())
    points:
      - "Drei Stufen (lesen, umwandeln, speichern) laufen nebenläufig und sind nur über Queues gekoppelt. Jede Stufe arbeitet in ihrem Tempo."
      - "Ist `speichere` langsam, füllt sich `fertig`. Dann wartet `wandle` an `fertig.put`, danach füllt sich `roh`, und `lese` wartet an `roh.put`. Der Speicherbedarf bleibt durch `maxsize` begrenzt (Backpressure)."
      - "Das Ende pflanzt sich per `shutdown()` fort: `lese` schließt `roh`, `wandle` arbeitet die Reste ab, bekommt dann `QueueShutDown` und schließt `fertig`, `schreibe` leert `fertig` und endet."
      - "Die `TaskGroup` wartet auf alle drei Stufen. Scheitert eine, bricht sie die anderen ab, und die Pipeline hängt nicht an einer Queue, die niemand mehr leert."
    explanation: |
      Die Queues entkoppeln die Stufen: `lese` muss nicht wissen, wie schnell `speichere` ist. Damit der Puffer nicht unbegrenzt wächst, hat jede Queue ein `maxsize`. Ist die letzte Stufe langsam, wandert der Rückstau Queue für Queue nach vorn, bis `lese` an `put` wartet. Im Speicher liegen höchstens etwa hundert Zeilen plus die in Bearbeitung.

      Das Ende ist eine Kettenreaktion: `roh.shutdown()` lässt `wandle` die vorhandenen Einträge abholen und erst dann `QueueShutDown` erhalten. `wandle` schließt `fertig` und der gleiche Ablauf wiederholt sich bei `schreibe`. Ohne `shutdown()` bräuchtest du Sentinel-Werte oder `cancel()`. Die `TaskGroup` sorgt dafür, dass ein Fehler in einer Stufe die anderen nicht für immer an einer Queue hängen lässt. Bei mehreren Workern pro Stufe müsste nur der Letzte von ihnen die nächste Queue schließen.
    resources:
      - title: asyncio.Queue
        url: https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue
      - title: asyncio.Queue.shutdown
        url: https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue.shutdown

  - id: downloader-threads
    type: practice
    title: Paralleler Downloader mit Thread-Pool
    prompt: |
      Schreibe lokal (nicht im Browser – dort gibt es keine Threads) ein Skript `downloader.py`, das eine Liste von URLs mit der Standardbibliothek herunterlädt:

      - `urllib.request.urlopen(url, timeout=10)` für jede URL, höchstens 8 gleichzeitig über `ThreadPoolExecutor`.
      - Ausgabe in Fertigstellungsreihenfolge: URL, HTTP-Status, Anzahl Bytes – oder die Fehlermeldung, ohne dass ein Fehler die anderen Downloads abbricht.
      - Am Ende eine Zusammenfassung: erfolgreich / fehlgeschlagen, Gesamtdauer.
      - Vergleiche die Dauer mit `max_workers=1`.
    lang: python
    starter: |
      import time
      import urllib.request
      from concurrent.futures import ThreadPoolExecutor, as_completed

      URLS = [
          "https://docs.python.org/3/",
          "https://peps.python.org/",
          "https://pypi.org/",
          "https://example.invalid/",   # schlägt absichtlich fehl
      ]

      def lade(url: str) -> tuple[int, int]:
          ...

      def main() -> None:
          ...

      if __name__ == "__main__":
          main()
    solution: |
      import time
      import urllib.request
      from concurrent.futures import ThreadPoolExecutor, as_completed

      URLS = [
          "https://docs.python.org/3/",
          "https://peps.python.org/",
          "https://pypi.org/",
          "https://example.invalid/",   # schlägt absichtlich fehl
      ]

      def lade(url: str) -> tuple[int, int]:
          with urllib.request.urlopen(url, timeout=10) as antwort:
              return antwort.status, len(antwort.read())

      def main(max_workers: int = 8) -> None:
          start = time.perf_counter()
          ok = fehler = 0
          with ThreadPoolExecutor(max_workers=max_workers) as pool:
              futures = {pool.submit(lade, url): url for url in URLS}
              for future in as_completed(futures):
                  url = futures[future]
                  try:
                      status, groesse = future.result()
                  except OSError as exc:
                      fehler += 1
                      print(f"FEHLER {url}: {exc}")
                  else:
                      ok += 1
                      print(f"{status} {url} ({groesse} Bytes)")
          dauer = time.perf_counter() - start
          print(f"{ok} erfolgreich, {fehler} fehlgeschlagen, {dauer:.2f} s")

      if __name__ == "__main__":
          main()
    checklist:
      - "`submit` für jede URL und ein Dictionary `Future → URL`, damit du bei `as_completed` weißt, welche URL fertig ist."
      - "`future.result()` steht in `try`/`except`; ein Fehler bricht die Schleife nicht ab."
      - Jeder Aufruf hat ein Timeout; ohne Timeout kann ein hängender Server den Pool für immer blockieren.
      - Du hast die Laufzeit mit `max_workers=1` und `max_workers=8` gemessen und kannst den Unterschied mit „I/O-bound, GIL wird beim Warten abgegeben“ erklären.
      - Der Startcode steht hinter `if __name__ == "__main__":`.
    explanation: |
      Das Skript ist I/O-bound: Fast die ganze Zeit wartet es auf das Netz, und währenddessen geben die Threads den GIL ab. Deshalb bringt ein Thread-Pool hier echte Beschleunigung, obwohl Python-Bytecode nie parallel läuft. `as_completed` liefert Ergebnisse, sobald sie da sind; das Dictionary ordnet jedes Future seiner URL zu. `urllib.error.URLError` und Timeouts sind Unterklassen von `OSError`, deshalb fängt `except OSError` die typischen Netzwerkfehler. Mit asyncio und `httpx` sähe die Lösung ähnlich aus – `gather` plus `Semaphore` statt Pool.
    resources:
      - title: concurrent.futures · ThreadPoolExecutor Example
        url: https://docs.python.org/3/library/concurrent.futures.html#threadpoolexecutor-example
      - title: urllib.request.urlopen
        url: https://docs.python.org/3/library/urllib.request.html#urllib.request.urlopen
