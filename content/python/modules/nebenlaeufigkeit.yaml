id: nebenlaeufigkeit
title: Nebenläufigkeit – Threads, Prozesse, asyncio
level: 3
minutes: 260
summary: Wann Threads, wann Prozesse, wann asyncio – mit einem klaren Denkmodell für GIL, Event-Loop, Abbruch, Queues und Race Conditions statt Rätselraten.
goals:
  - Du unterscheidest Nebenläufigkeit von Parallelität und I/O-bound von CPU-bound und wählst danach Threads, Prozesse oder asyncio.
  - Du erklärst, was der GIL schützt und was nicht, und wie der Stand der free-threaded Builds in Python 3.13 und 3.14 ist.
  - Du erkennst Race Conditions und behebst sie mit `Lock` oder `queue.Queue`.
  - Du nutzt `concurrent.futures` mit `map`, `submit` und `as_completed` für Thread- und Prozess-Pools.
  - Du schreibst asyncio-Code mit `gather`, `TaskGroup`, `timeout` und `Semaphore` und vermeidest blockierende Aufrufe in Coroutinen.
  - Du brichst Tasks sauber ab (`cancel()`, `CancelledError` erneut auslösen, `shield`) und erklärst, was eine `TaskGroup` bei einem Fehler mit ihren Geschwistern macht.
  - Du baust Producer/Consumer-Pipelines mit `asyncio.Queue` (`task_done`, `join`, `maxsize`, `shutdown()`) und nimmst `as_completed`, wenn Ergebnisse sofort zählen.
  - Du schützt Zustand über ein `await` hinweg mit `asyncio.Lock`, signalisierst mit `Event` und schreibst eigene `async with`-Klassen und async Generatoren.
