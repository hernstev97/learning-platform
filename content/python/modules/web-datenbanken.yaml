- id: dependency-luecken
  type: gap
  title: Session und API-Schlüssel als Abhängigkeiten
  prompt: |
    Jede Anfrage soll eine eigene Session bekommen, die danach geschlossen wird. Ein falscher oder fehlender
    Schlüssel im Header `X-API-Key` antwortet mit `401`. Die Prüfung gilt für die ganze App. Ergänze die Lücken.
  lang: python
  code: |
    import os
    import secrets
    from collections.abc import Iterator
    from typing import Annotated

    from fastapi import Depends, FastAPI, Header, HTTPException
    from sqlalchemy import create_engine
    from sqlalchemy.orm import Session

    engine = create_engine("sqlite:///tickets.db")

    def get_session() -> Iterator[Session]:
        with Session(engine) as session:
            ⟦yield session⟧

    SessionDep = Annotated[Session, ⟦Depends(get_session)⟧]

    def require_api_key(x_api_key: Annotated[str | None, ⟦Header()⟧] = None) -> None:
        erwartet = os.environ.get("TICKET_API_KEY", "")
        if not erwartet or x_api_key is None or not ⟦secrets.compare_digest⟧(x_api_key.encode(), erwartet.encode()):
            raise HTTPException(status_code=⟦401⟧, detail="API-Schlüssel fehlt oder ist falsch")

    app = FastAPI(dependencies=[⟦Depends(require_api_key)⟧])
  gaps:
  - label: Session herausgeben
    hint: Das Schlüsselwort, das aus der Funktion einen Generator mit Aufräumcode macht.
  - label: Abhängigkeit einbinden
    hint: Der Funktionsname steht in `Depends(...)` ohne eigene Aufrufklammern.
  - label: Quelle des Werts
    hint: Der Wert kommt aus einem HTTP-Header.
  - label: Konstantzeit-Vergleich
    hint: Eine Funktion aus `secrets`, die zwei Werte in konstanter Zeit vergleicht.
  - label: Statuscode für fehlende Anmeldedaten
    hint: Der Code für „nicht authentifiziert“.
  - label: Prüfung für die ganze App
    hint: Dieselbe `Depends`-Schreibweise, jetzt mit der Prüffunktion.
  explanation: |
    `yield` macht `get_session` zu einer Abhängigkeit mit Aufräumcode. Der `with`-Block schließt die Session nach
    der Antwort, auch bei einem Fehler. `Depends(get_session)` in `Annotated` ergibt einen Typ, den jeder Endpunkt
    als Parameter nutzen kann. `Header()` sagt FastAPI, dass der Wert aus dem Header `X-API-Key` kommt. Der Vergleich
    mit `secrets.compare_digest` dauert unabhängig davon, wo die Werte abweichen, und die Bytes umgehen den
    `TypeError` bei Nicht-ASCII-Zeichen. `401` heißt, die Anmeldedaten fehlen oder sind falsch. Mit `dependencies=[...]`
    läuft die Prüfung vor jeder Route, ohne dass ein Endpunkt den Wert braucht.
  resources:
  - title: FastAPI · Dependencies with yield
    url: https://fastapi.tiangolo.com/tutorial/dependencies/dependencies-with-yield/
  - title: FastAPI · Global Dependencies
    url: https://fastapi.tiangolo.com/tutorial/dependencies/global-dependencies/
- id: orm-modell-select
  type: gap
  title: Ein ORM-Modell, eine Abfrage, eine Transaktion
  prompt: |
    Ergänze das Modell im SQLAlchemy-2.0-Stil. `id` ist der Primärschlüssel, `note` darf `NULL` sein.
    `offene_tickets` liefert die offenen Tickets als Objekte nach `id` sortiert, `anlegen` speichert ein Ticket
    in einer Transaktion, die bei Erfolg bestätigt wird.
  lang: python
  code: |
    from sqlalchemy import select
    from sqlalchemy.orm import DeclarativeBase, Mapped, Session, mapped_column, sessionmaker

    class Base(⟦DeclarativeBase⟧):
        pass

    class Ticket(Base):
        __tablename__ = "tickets"

        id: Mapped[int] = ⟦mapped_column(primary_key=True)⟧
        title: Mapped[str]
        note: Mapped[⟦str | None⟧]
        status: Mapped[str] = mapped_column(default="open")

    def offene_tickets(session: Session) -> list[Ticket]:
        stmt = ⟦select(Ticket)⟧.where(Ticket.status == "open").order_by(Ticket.id)
        return list(session.⟦scalars⟧(stmt))

    def anlegen(factory: sessionmaker[Session], title: str) -> None:
        with factory.⟦begin()⟧ as session:
            session.add(Ticket(title=title))
  gaps:
  - label: Basisklasse
    hint: Die Basisklasse für den deklarativen 2.0-Stil.
  - label: Primärschlüssel
    hint: Die Funktion, die eine Spalte konfiguriert, mit dem Argument `primary_key`.
  - label: Optionaler Typ
    hint: Ein Typ, der `None` erlaubt, ohne `Optional` zu importieren.
    accept: ["None | str"]
  - label: Abfrage beginnen
    hint: Die Funktion, die eine Abfrage auf der Klasse `Ticket` aufbaut.
  - label: Objekte statt Zeilen
    hint: Die Session-Methode, die die erste Spalte jeder Zeile liefert, hier das Objekt.
  - label: Transaktionsblock
    hint: Die Methode von `sessionmaker`, die Session und Transaktion öffnet und bei Erfolg bestätigt.
  explanation: |
    `DeclarativeBase` ist die Basisklasse im 2.0-Stil, `mapped_column(primary_key=True)` macht `id` zum Primärschlüssel.
    `Mapped[str | None]` erlaubt `NULL`, `Mapped[str]` nicht. `select(Ticket)` baut die Abfrage, und `session.scalars(stmt)`
    liefert die `Ticket`-Objekte statt Zeilen. `order_by` steht drin, weil ohne es keine Reihenfolge zugesichert ist.
    `factory.begin()` öffnet Session und Transaktion: bestätigt bei Erfolg, rollt bei einer Exception zurück und
    schließt die Session.
  resources:
  - title: SQLAlchemy 2.0 · ORM Quick Start
    url: https://docs.sqlalchemy.org/en/20/orm/quickstart.html
  - title: SQLAlchemy 2.0 · Session Basics
    url: https://docs.sqlalchemy.org/en/20/orm/session_basics.html
- id: fake-import
  type: code
  title: Abrufer als Abhängigkeit
  prompt: Schreibe `lade_ids(hole)`. Rufe hole genau einmal ohne Argumente auf; es liefert eine Liste von Dictionaries
    mit id. Liefere die eindeutigen IDs aufsteigend sortiert.
  lang: python
  starter: |-
    def lade_ids(hole):
        ...
  solution: |-
    def lade_ids(hole):
        return sorted({item["id"] for item in hole()})
  tests:
  - name: Doppelte
    code: 'assert lade_ids(lambda: [{"id": 3}, {"id": 1}, {"id": 3}]) == [1, 3]'
  - name: Leer
    code: 'assert lade_ids(lambda: []) == []'
  - name: Ein Abruf
    code: |-
      from unittest.mock import Mock
      hole = Mock(return_value=[{"id": 5}])
      assert lade_ids(hole) == [5]
      hole.assert_called_once_with()
  explanation: Die fachliche Transformation braucht keine Netzwerkbibliothek. Ein Test kann daher Ergebnis und Zahl
    der Abrufe deterministisch prüfen.
  resources:
  - *id001
- id: seite-begrenzen
  type: code
  title: Seitenparameter prüfen und begrenzen
  prompt: |
    Schreibe `seite(limit=None, offset=None)`. Die Funktion liefert das Tupel `(limit, offset)` für eine Listenabfrage.

    - `limit=None` ergibt 20, `offset=None` ergibt 0.
    - Ein `limit` über 100 wird auf 100 gekürzt, kein Fehler.
    - Ein `limit` unter 1 oder ein negativer `offset` löst `ValueError` aus.
    - Werte, die kein `int` sind (etwa `"10"` oder `2.5`), lösen `ValueError` aus.
  lang: python
  starter: |-
    def seite(limit=None, offset=None):
        ...
  solution: |-
    STANDARD_LIMIT = 20
    MAX_LIMIT = 100

    def seite(limit=None, offset=None):
        if limit is None:
            limit = STANDARD_LIMIT
        if offset is None:
            offset = 0
        if not isinstance(limit, int) or not isinstance(offset, int):
            raise ValueError("limit und offset müssen ganze Zahlen sein")
        if limit < 1:
            raise ValueError("limit muss mindestens 1 sein")
        if offset < 0:
            raise ValueError("offset darf nicht negativ sein")
        return min(limit, MAX_LIMIT), offset
  tests:
  - name: Standardwerte
    code: |-
      ergebnis = seite()
      assert ergebnis == (20, 0), f"erwartet (20, 0), bekommen {ergebnis!r}"
  - name: Gültige Werte bleiben unverändert
    code: |-
      assert seite(50, 40) == (50, 40)
      assert seite(1, 0) == (1, 0)
      assert seite(100, 0) == (100, 0)
  - name: Zu großes limit wird gekürzt
    code: |-
      assert seite(101, 5) == (100, 5)
      assert seite(10_000) == (100, 0)
  - name: Ungültiges limit
    code: |-
      for wert in (0, -5, "10", 2.5):
          try:
              seite(limit=wert)
          except ValueError:
              pass
          else:
              assert False, f"limit={wert!r} muss ValueError auslösen"
  - name: Ungültiger offset
    code: |-
      for wert in (-1, "0", 1.5):
          try:
              seite(offset=wert)
          except ValueError:
              pass
          else:
              assert False, f"offset={wert!r} muss ValueError auslösen"
  explanation: |
    Die Regeln stehen in einer reinen Funktion, die weder HTTP noch Datenbank kennt. Dadurch lassen sie sich ohne
    Server testen. Das Kürzen ist eine Entscheidung: FastAPI würde `Query(le=100)` mit `422` ablehnen. Beide Verträge
    sind brauchbar. Wichtig ist, dass die README einen von ihnen beschreibt und ein Test ihn festhält. Ein `limit` ohne
    Obergrenze lässt einen Client die ganze Tabelle in einer Antwort abholen.
  resources:
  - title: FastAPI · Query Parameters and String Validations
    url: https://fastapi.tiangolo.com/tutorial/query-params-str-validations/
- id: sql-injection
  type: bug
  title: Ein Apostroph zerstört den Import
  prompt: Ein Titel mit Apostroph erzeugt einen SQL-Syntaxfehler. Ersetze die unsichere Schreibanweisung durch Parameterbindung.
  lang: python
  code: |-
    def speichern(con, titel):
        con.execute(f"INSERT INTO notes(title) VALUES ('{titel}')")
  lines:
  - 2
  fix:
  - line: 2
    answers:
    - con.execute("INSERT INTO notes(title) VALUES (?)", (titel,))
  explanation: Die Datenbank muss den Titel als Wert erhalten. Das behebt sowohl legitime Sonderzeichen als auch
    die Möglichkeit, zusätzliche SQL-Syntax einzuschleusen.
  resources:
  - *id001
- id: antwort-leckt
  type: bug
  title: Der Hash steht in der Antwort
  prompt: |
    Ein Review verlangt, dass nur `id` und `email` die API verlassen. `GET /users/1` liefert aber
    `{"id": 1, "email": "ada@example.org", "password_hash": "$argon2id$…"}`. Die Datenbankzeile `UserRow` hat
    das Feld, `UserOut` soll es nicht haben. Finde die Zeile, die den Hash herausgibt, und korrigiere sie.
  lang: python
  code: |-
    class UserOut(BaseModel):
        model_config = ConfigDict(from_attributes=True)

        id: int
        email: str


    class UserDb(UserOut):
        password_hash: str


    @app.get("/users/{user_id}", response_model=UserDb)
    def read_user(user_id: int, session: SessionDep) -> UserRow:
        user = session.get(UserRow, user_id)
        if user is None:
            raise HTTPException(status_code=404, detail="Nutzer nicht gefunden")
        return user
  lines:
  - 12
  fix:
  - line: 12
    answers:
    - '@app.get("/users/{user_id}", response_model=UserOut)'
  explanation: FastAPI filtert die Antwort durch das `response_model`. Hier ist das `UserDb`, das den Hash als Feld
    enthält, also gibt FastAPI ihn heraus. Mit `response_model=UserOut` verlassen nur `id` und `email` die API,
    obwohl die Zeile mehr Attribute hat. Besser noch, du legst ein Modell mit dem Hash gar nicht erst in der
    API-Schicht an. Ein Test, der `"password_hash" not in antwort.json()` prüft, hält die Regel fest.
  resources:
  - title: FastAPI · Response Model
    url: https://fastapi.tiangolo.com/tutorial/response-model/
- id: flush-ohne-commit
  type: bug
  title: 201, aber die Zeile fehlt
  prompt: |
    `POST /tickets` antwortet `201` und liefert ein Ticket mit `id` 1. Ein folgender `GET /tickets/1` antwortet
    `404`, und die Tabelle `tickets` ist leer. Finde die fehlerhafte Zeile und korrigiere sie.
  lang: python
  code: |-
    @router.post("", response_model=TicketRead, status_code=201)
    def create_ticket(data: TicketCreate, session: SessionDep) -> Ticket:
        ticket = Ticket(**data.model_dump())
        session.add(ticket)
        session.flush()
        return ticket
  lines:
  - 5
  fix:
  - line: 5
    answers:
    - session.commit()
  explanation: '`flush()` schickt das `INSERT` in die offene Transaktion. Die `id` ist deshalb schon gesetzt, und
    die Antwort entsteht aus dem Objekt in der noch offenen Session. Bestätigt ist aber nichts. Beim Schließen der
    Session ohne `commit()` rollt SQLAlchemy zurück. Mit `session.commit()` landet die Zeile in der Datenbank.
    Ein Test, der nur den Statuscode und die Antwort prüft, merkt das nicht, ein zweiter Zugriff auf die Datenbank
    schon.'
  resources:
  - title: SQLAlchemy 2.0 · Session Basics
    url: https://docs.sqlalchemy.org/en/20/orm/session_basics.html#committing
- id: kontextmanager
  type: explain
  title: Commit ist nicht close
  prompt: Erkläre die zwei Ressourcenregeln in diesem Ausschnitt.
  lang: python
  code: |-
    con = sqlite3.connect("app.db", autocommit=False)
    try:
        with con:
            con.execute("INSERT INTO tasks(title) VALUES (?)", ("Testen",))
    finally:
        con.close()
  points:
  - with con bestätigt bei Erfolg und rollt bei Fehler zurück.
  - close wird vom Connection-Kontextmanager nicht übernommen.
  - finally schließt auch beim Fehler die Verbindung.
  - Die Eingabe wird separat als SQL-Parameter gebunden.
  explanation: Die Transaktion und die Verbindung besitzen verschiedene Lebenszyklen. Der innere Kontext schützt
    die Änderung, der äußere finally-Block beendet die Ressource unabhängig vom Ausgang.
  resources:
  - *id001
- id: test-fixture-erklaeren
  type: explain
  title: Was macht diese Test-Fixture?
  prompt: Erkläre in eigenen Worten, wie diese Fixture die API-Tests von der echten Datenbank trennt und warum sie
    kein `StaticPool` braucht.
  lang: python
  code: |-
    @pytest.fixture
    def client(tmp_path, monkeypatch):
        monkeypatch.setenv("TICKET_API_KEY", "test-key-nur-fuer-tests")
        engine = create_engine(f"sqlite:///{tmp_path / 'test.db'}")
        Base.metadata.create_all(engine)

        def override_session():
            with Session(engine) as session:
                yield session

        app.dependency_overrides[get_session] = override_session
        with TestClient(app, headers={"X-API-Key": "test-key-nur-fuer-tests"}) as client:
            yield client
        app.dependency_overrides.clear()
        engine.dispose()
  points:
  - '`tmp_path` gibt jedem Test eine eigene, leere Datenbankdatei, die Tests teilen keinen Zustand.'
  - '`create_all` legt das Schema in dieser Datei an, bevor die erste Anfrage kommt.'
  - '`dependency_overrides` ersetzt `get_session` im Test, der Produktionscode bleibt unverändert und die echte Datenbank unberührt.'
  - 'Nach dem Test räumt die Fixture auf (`clear()`, `dispose()`), damit der Override nicht in andere Tests ausläuft.'
  - 'Eine Datei sehen alle Verbindungen und Threads, deshalb braucht es weder `StaticPool` noch `check_same_thread=False`.'
  explanation: |
    Die Fixture baut für jeden Test eine frische SQLite-Datei unter `tmp_path` und legt das Schema an. Über
    `app.dependency_overrides` bekommt die App für diesen Test eine Session auf genau diese Datei. Der Produktionscode
    bleibt unverändert, und ein Test kann die Entwicklungsdatenbank nicht erreichen. Nach dem `yield` räumt die Fixture
    auf: Der Override wird entfernt, die Verbindungen werden geschlossen. `monkeypatch.setenv` setzt einen erfundenen
    API-Schlüssel und stellt die Umgebung nach dem Test wieder her. Mit einer In-Memory-Datenbank gäbe es für jeden
    Thread eine eigene leere Datenbank, deshalb bräuchte sie `StaticPool`. Eine Datei sehen alle Threads gleich.
  resources:
  - title: FastAPI · Testing Dependencies with Overrides
    url: https://fastapi.tiangolo.com/advanced/testing-dependencies/
  - title: SQLAlchemy 2.0 · SQLite, Using a Memory Database in Multiple Threads
    url: https://docs.sqlalchemy.org/en/20/dialects/sqlite.html#using-a-memory-database-in-multiple-threads-or-coroutines
- id: atomarer-import
  type: practice
  title: Ein Import mit Rollback
  prompt: Baue lokal einen SQLite-Import für tasks(id PRIMARY KEY, title NOT NULL). Zwei gleiche IDs in einer Charge
    sollen die ganze Charge zurücknehmen.
  lang: python
  solution: |-
    import sqlite3

    def importiere(con, daten):
        with con:
            con.executemany("INSERT INTO tasks VALUES (?, ?)", daten)

    con = sqlite3.connect(":memory:", autocommit=False)
    try:
        con.execute("CREATE TABLE tasks(id INTEGER PRIMARY KEY, title TEXT NOT NULL)")
        con.commit()
        try:
            importiere(con, [(1, "a"), (1, "b")])
        except sqlite3.IntegrityError:
            assert con.execute("SELECT COUNT(*) FROM tasks").fetchone()[0] == 0
    finally:
        con.close()
  checklist:
  - Schema ist vor dem Import bestätigt.
  - Doppelte IDs lösen eine IntegrityError aus.
  - Nach dem Fehler sind null Importzeilen vorhanden.
  - Eine gültige Charge wird vollständig bestätigt.
  - Die Verbindung wird in beiden Fällen geschlossen.
  explanation: Der Test prüft den Zustand nach dem Fehler. Genau das unterscheidet eine nachgewiesene atomare Operation
    vom bloßen Fangen einer Exception.
  resources:
  - *id001
