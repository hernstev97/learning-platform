- id: pydantic-lax
  type: output
  title: Was Pydantic stillschweigend umwandelt
  prompt: Was gibt dieses Programm mit den Standardeinstellungen von Pydantic v2 aus?
  lang: python
  code: |-
    from pydantic import BaseModel

    class Position(BaseModel):
        artikel: str
        menge: int
        rabatt: float = 0.0

    p = Position.model_validate({"artikel": "Kabel", "menge": "5", "farbe": "rot"})
    print(type(p.menge).__name__, p.menge)
    print(p.model_dump())
  expected: |-
    int 5
    {'artikel': 'Kabel', 'menge': 5, 'rabatt': 0.0}
  verify: false
  explanation: Im lax-Modus wandelt Pydantic den String `"5"` in die Zahl `5` um, `menge` ist danach ein `int`. Das
    unbekannte Feld `farbe` gehört nicht zum Modell. Pydantic verwirft es ohne Fehler, weil `extra` standardmäßig
    `'ignore'` ist, und `rabatt` bekommt den Standardwert. Wer eine Umwandlung ablehnen will, nutzt `strict=True`;
    wer unbekannte Felder ablehnen will, `extra='forbid'`.
