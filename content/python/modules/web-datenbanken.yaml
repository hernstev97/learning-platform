- id: endpunkt-modell
  type: gap
  title: Ein Endpunkt mit Modell und Statuscodes
  prompt: |
    Der Endpunkt legt ein Ticket an und liest eines. Der Titel hat 1 bis 120 Zeichen. Ein neues Ticket antwortet
    mit `201` (als Zahl), eine unbekannte ID mit `404`. Ergänze die Lücken.
  lang: python
  code: |
    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel, Field

    class TicketCreate(BaseModel):
        title: str = ⟦Field(min_length=1, max_length=120)⟧

    class TicketRead(BaseModel):
        id: int
        title: str

    app = FastAPI()
    TICKETS: dict[int, TicketRead] = {}

    @app.post("/tickets", response_model=TicketRead, status_code=⟦201⟧)
    def create_ticket(data: ⟦TicketCreate⟧) -> TicketRead:
        ticket = TicketRead(id=len(TICKETS) + 1, title=data.title)
        TICKETS[ticket.id] = ticket
        return ticket

    @app.get("/tickets/{ticket_id}", response_model=TicketRead)
    def read_ticket(ticket_id: int) -> TicketRead:
        if ticket_id not in TICKETS:
            raise HTTPException(status_code=⟦404⟧, detail="Ticket nicht gefunden")
        return TICKETS[ticket_id]
  gaps:
  - label: Längenregel am Feld
    hint: Zwei Constraints an `Field`, Mindest- und Höchstlänge.
    accept: ["Field(max_length=120, min_length=1)"]
  - label: Statuscode für „angelegt“
    hint: Der Code für `Created`.
  - label: Typ des Körpers
    hint: FastAPI liest den JSON-Körper in das Modell, das Eingaben des Clients beschreibt.
  - label: Statuscode für „nicht gefunden“
    hint: Der klassische Code für eine unbekannte Ressource.
  explanation: |
    `Field` trägt die Längenregeln. FastAPI wendet sie an, sobald ein Parameter ein Modell ist: `data: TicketCreate`
    lässt den JSON-Körper gegen das Eingabemodell prüfen, und eine Verletzung antwortet automatisch mit `422`.
    `status_code=201` steht am Dekorator, weil der Erfolgscode zur Route gehört. `404` meldet die unbekannte ID.
    Eine `HTTPException` beendet den Endpunkt sofort.
  resources:
  - title: FastAPI · Response Status Code
    url: https://fastapi.tiangolo.com/tutorial/response-status-code/
  - title: FastAPI · Handling Errors
