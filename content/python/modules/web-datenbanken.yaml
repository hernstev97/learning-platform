id: web-datenbanken
title: Web & Datenbanken
level: 3
minutes: 290
summary: HTTP-Antworten prüfen, API-Grenzen mit FastAPI und Pydantic schneiden und Daten mit SQLite, SQLAlchemy,
  Parametern und Transaktionen verlässlich speichern.
goals:
- Du unterscheidest Transport, HTTP-Status, JSON-Syntax und fachliche Validierung.
- Du benutzt SQL-Parameter statt Stringinterpolation und erklärst Transaktionsgrenzen, Constraints und den
  Lebenszyklus einer Verbindung.
- Du validierst Eingaben mit Pydantic v2 und trennst Eingabe-, Datenbank- und Ausgabemodell.
- Du schreibst FastAPI-Endpunkte mit Statuscodes und `HTTPException` und setzt Session und API-Schlüssel als
  `Depends`-Abhängigkeiten um.
- Du erklärst, wann SQLAlchemy `flush`, `commit` und Rollback ausführt und welche Entscheidungen der ORM dir
  nicht abnimmt.
- Du testest API und Datenzugriff ohne Server und ohne externen Dienst mit `TestClient`, Fakes und einer Test-Datenbank.
