  - title: Pydantic · Strict Mode
    url: https://docs.pydantic.dev/latest/concepts/strict_mode/
- id: titel-pruefen
  type: code
  title: Eine API-Grenze validieren
  prompt: 'Schreibe `titel(daten)`: Liefere den bereinigten, nichtleeren String unter title. Fehlende, leere oder
    nicht-string Werte müssen ValueError auslösen. daten ist ein Dictionary.'
