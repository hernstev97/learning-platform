lesson: |
  Eine Aufgaben-App lädt Datensätze von einer API und speichert sie lokal. Ein erfolgreicher HTTP-Aufruf beweist noch nicht, dass die Antwort zur erwarteten Struktur passt. Eine korrekt geparste Antwort beweist wiederum nicht, dass alle Datensätze erfolgreich gespeichert wurden. Zwischen Netzwerk, Python-Objekten und Datenbank liegen eigene Verträge und Fehlerquellen.

  Dieses Modul verfolgt einen kleinen Import durch diese Grenzen. Danach baut es darauf eine Ticket-API mit FastAPI, Pydantic und SQLAlchemy, wie sie das Abschlussprojekt verlangt. Du lernst zuerst die Mechanismen mit der Standardbibliothek und dann, was die drei Bibliotheken dir abnehmen und was bei dir bleibt. Das ist kein Framework-Tutorial: Die Lektion erklärt das Denkmodell und die Grenzen, die Details stehen in der verlinkten offiziellen Dokumentation.

  Die Browserbeispiele nutzen SQLite im Speicher und injizierte Abrufer. FastAPI, Pydantic und SQLAlchemy sind im Browser nicht installiert, und echte HTTP-Aufrufe gibt es dort nicht. Diese Beispiele sind deshalb ohne `run` gesetzt und laufen lokal, etwa in einem uv-Projekt nach `uv add fastapi sqlalchemy` und `uv add --dev pytest httpx`. Sie wurden mit FastAPI 0.142, Pydantic 2.13 sowie SQLAlchemy 2.0 und 2.1 geprüft.

  ## HTTP liefert mehr als einen JSON-Text

  Ein HTTP-Austausch enthält Methode, URL, Header, Status und optional einen Körper. GET dient dem Lesen, während etwa POST typischerweise eine Aktion oder neue Ressource anfordert. Der genaue Vertrag kommt von der API. Behandle insbesondere ein erneutes POST nach Timeout nicht automatisch wie eine gefahrlose Wiederholung: Der Server könnte die erste Anfrage bereits verarbeitet haben.

  Mit [HTTPX](https://www.python-httpx.org/quickstart/) kannst du Parameter getrennt vom URL-Text übergeben und Statusfehler sichtbar machen. Das folgende Beispiel benötigt lokal das Paket und Netzwerkkonnektivität.

  ```python
  import httpx
  with httpx.Client(timeout=10.0) as client:
      antwort = client.get("https://example.org/api/tasks", params={"limit": 50})
      antwort.raise_for_status()
      daten = antwort.json()
  ```

  Hier passieren drei getrennte Prüfungen: Der Transport muss funktionieren, der Status muss akzeptabel sein und der Körper muss als JSON lesbar sein. Danach fehlt noch die Fachprüfung. Ein `200 OK` mit `{"items": "kaputt"}` ist weiterhin kein gültiger Aufgabenimport. HTTPX unterscheidet außerdem [verschiedene Timeout-Arten](https://www.python-httpx.org/advanced/timeouts/); ein Wert ersetzt nicht zwangsläufig eine übergeordnete Gesamtlaufzeitgrenze.

  ```python run
  import json
  antwort = json.loads('{"items": [{"id": 1, "title": "Testen"}]}')
  if not isinstance(antwort.get("items"), list):
      raise ValueError("items muss eine Liste sein")
  print(antwort["items"][0]["title"])
  ```

  Validiere an der Eingangsgrenze und arbeite danach mit einem klaren internen Modell. Unbekannte Zusatzfelder können erlaubt sein; fehlende oder falsch typisierte Pflichtfelder brauchen eine definierte Reaktion. Logge IDs und Fehlerklassen, keine Authentifizierungsheader oder kompletten personenbezogenen Antworten.

  ## Fachlogik von Transport trennen

  Eine Funktion muss nicht gleichzeitig HTTP ausführen, JSON prüfen und SQL schreiben. Eine kleine Abhängigkeit wie `hole(kennung)` lässt sich im Test kontrollieren. Das ist keine Aufforderung, für jeden Ausdruck eine Klasse zu bauen. Es macht die relevante Grenze sichtbar.

  ```python run
  def titel_laden(kennung, hole):
      daten = hole(kennung)
      titel = daten.get("title")
      if not isinstance(titel, str) or not titel.strip():
          raise ValueError("title fehlt")
      return titel.strip()

  print(titel_laden(7, lambda kennung: {"id": kennung, "title": "  Prüfen  "}))
  ```

  Ein Test kann jetzt Timeout, ungültige Daten und korrekte Antworten ohne Netz erzeugen. Zusätzlich brauchst du später einen kleinen Integrationstest, der die wirkliche API-Schnittstelle prüft. Ein Fake beweist nur, dass dein Code unter den modellierten Annahmen funktioniert.

  Ein Webserver stellt die andere Seite der Grenze bereit. [FastAPI](https://fastapi.tiangolo.com/tutorial/first-steps/) registriert Routen an einem Anwendungsobjekt. Dieses lokale Minimalbeispiel liefert einen festen Gesundheitsstatus.

  ```python
  from fastapi import FastAPI
  app = FastAPI()

  @app.get("/health")
  def health():
      return {"status": "ok"}
  ```

  Ein antwortender Health-Endpunkt beweist nicht automatisch Datenbankzugriff oder alle Fachfunktionen. Definiere, was eine Gesundheitsprüfung tatsächlich prüft. Wie FastAPI Modelle, Statuscodes und Abhängigkeiten behandelt, kommt weiter unten. Deployment und Benutzerverwaltung bleiben eigene Themen; dieser Einstieg macht daraus keine fertige Produktionsarchitektur.

  ## Relationale Daten und sichere Parameter

  Eine SQLite-Datenbank speichert Tabellen mit Zeilen und Spalten. Constraints beschreiben Regeln, die unabhängig vom jeweiligen Aufrufer gelten. Ein Primary Key identifiziert eine Zeile; `NOT NULL` verhindert fehlende Werte. Die [sqlite3-Dokumentation](https://docs.python.org/3/library/sqlite3.html) erklärt Verbindung, Cursor und Parameterbindung.

  ```python run
  import sqlite3
  con = sqlite3.connect(":memory:")
  try:
      con.execute("CREATE TABLE tasks (id INTEGER PRIMARY KEY, title TEXT NOT NULL)")
      con.execute("INSERT INTO tasks (id, title) VALUES (?, ?)", (1, "Testen"))
      print(con.execute("SELECT id, title FROM tasks ORDER BY id").fetchall())
  finally:
      con.close()
  ```

  `?` ist ein Platzhalter für einen **Wert**. Python übergibt Werte separat, und die Datenbank behandelt Anführungszeichen im Titel als Daten. Ein f-String würde Daten mit SQL-Syntax vermischen und kann zu SQL-Injection führen. Auch ein einzelner Parameter muss als Sequenz übergeben werden: `(kennung,)` ist ein Tupel, `(kennung)` lediglich der geklammerte Wert.

  ```python run
  import sqlite3
  con = sqlite3.connect(":memory:")
  try:
      con.execute("CREATE TABLE notes (text TEXT)")
      text = "Ada's Notiz"
      con.execute("INSERT INTO notes VALUES (?)", (text,))
      print(con.execute("SELECT text FROM notes").fetchone()[0])
  finally:
      con.close()
  ```

  Tabellen- und Spaltennamen sind keine normalen Werteparameter. Wenn eine Sortierspalte aus einer Benutzerauswahl kommt, übersetze sie über eine feste erlaubte Zuordnung in SQL. Baue keine beliebigen Namen aus Eingaben zusammen. Ein `ORDER BY` ist außerdem nötig, wenn eine bestimmte Ergebnisreihenfolge zum Vertrag gehört.

  ## Transaktionen halten Änderungen zusammen

  Eine Transaktion gruppiert Änderungen zu einer Einheit. Entweder werden alle bestätigt oder bei einem Fehler zurückgenommen. Das ist beispielsweise wichtig, wenn ein Import mehrere Zeilen schreiben und anschließend einen Importstatus setzen soll. Die SQLite-Dokumentation beschreibt [Transaktionen und Sperren](https://www.sqlite.org/lang_transaction.html).

  Für neuen Python-Code wählst du die [Transaktionssteuerung](https://docs.python.org/3/library/sqlite3.html#transaction-control) ausdrücklich. `autocommit=False` nutzt das von Python dokumentierte DB-API-Verhalten. Der Connection-Kontextmanager bestätigt bei Erfolg und rollt bei einer Exception zurück; er schließt die Verbindung aber nicht.

  ```python run
  import sqlite3
  con = sqlite3.connect(":memory:", autocommit=False)
  try:
      con.execute("CREATE TABLE items (id INTEGER PRIMARY KEY, title TEXT NOT NULL)")
      con.commit()
      try:
          with con:
              con.execute("INSERT INTO items VALUES (?, ?)", (1, "erstes"))
              con.execute("INSERT INTO items VALUES (?, ?)", (1, "doppeltes"))
      except sqlite3.IntegrityError:
          print("zurückgerollt")
      print(con.execute("SELECT COUNT(*) FROM items").fetchone()[0])
  finally:
      con.close()
  ```

  Die Tabelle wurde vor dem Import bestätigt. Daher bleibt sie nach dem Rollback vorhanden, während beide Importzeilen fehlen. Würdest du die Exception innerhalb des `with`-Blocks verschlucken, sähe der Kontextmanager einen normalen Ausgang und könnte Teiländerungen bestätigen. Fehlerbehandlung und Transaktionsgrenze müssen zusammenpassen.

  ## Ergebnisse, Indizes und Ressourcen

  `fetchone` liefert eine Zeile oder `None`; `fetchall` materialisiert alle restlichen Zeilen. Für große Mengen kannst du einen Cursor iterieren. Mit `sqlite3.Row` werden Spaltennamen statt numerischer Positionen verfügbar. Das verbessert Lesbarkeit, ersetzt aber kein Schema und keine Validierung.

  ```python run
  import sqlite3
  con = sqlite3.connect(":memory:")
  try:
      con.row_factory = sqlite3.Row
      row = con.execute("SELECT ? AS title, ? AS done", ("Lernen", 0)).fetchone()
      print(row["title"], row["done"])
  finally:
      con.close()
  ```

  Ein Index kann häufige Filter oder Sortierungen beschleunigen, kostet aber Platz und Arbeit beim Schreiben. Wähle ihn anhand echter Abfragen und prüfe den Plan mit [`EXPLAIN QUERY PLAN`](https://www.sqlite.org/eqp.html). „Auf jede Spalte ein Index“ ist keine allgemeine Optimierung.

  > [!PRAXIS]
  > Teste einen Import mit einem absichtlich ungültigen Datensatz in der Mitte. Prüfe anschließend den Datenbestand, nicht nur die Exception. So zeigt der Test, ob die zugesagte Atomarität wirklich gilt.

  ## Pydantic v2: Eingaben an der Grenze validieren

  Die Übung `titel-pruefen` prüft einen Titel von Hand. [Pydantic](https://docs.pydantic.dev/latest/concepts/models/) schreibt solche Regeln als Typannotationen auf und führt sie aus. Ein `BaseModel` beschreibt die erwartete Form. `model_validate` liefert eine Instanz oder wirft eine `ValidationError`, die jeden Verstoß mit Ort und Fehlertyp nennt. Dieser Abschnitt gilt für Pydantic v2. Ältere Tutorials zeigen noch v1-Namen wie `@validator`, `.dict()` oder `class Config`; die [Migrationsanleitung](https://docs.pydantic.dev/latest/migration/) listet die neuen Namen.

  ```python
  from pydantic import BaseModel, Field, ValidationError, field_validator

  class TicketCreate(BaseModel):
      title: str = Field(min_length=1, max_length=120)
      description: str = ""

      @field_validator("title", mode="before")
      @classmethod
      def titel_trimmen(cls, wert: object) -> object:
          return wert.strip() if isinstance(wert, str) else wert

  try:
      TicketCreate.model_validate({"title": "   "})
  except ValidationError as fehler:
      print(fehler.errors()[0]["loc"], fehler.errors()[0]["type"])
      # ('title',) string_too_short
  ```

  `Field` trägt Constraints wie `min_length`, `max_length`, `ge`, `le` oder `pattern` ([Fields](https://docs.pydantic.dev/latest/concepts/fields/)). Ein [`field_validator`](https://docs.pydantic.dev/latest/concepts/validators/#field-validators) deckt Regeln ab, die kein Constraint ausdrückt. Mit `mode="before"` läuft er vor der Typprüfung. Das Trimmen passiert deshalb vor `min_length`: Ein Titel aus drei Leerzeichen wird zu `""` und fällt durch. Ein `after`-Validator käme zu spät, denn die drei Leerzeichen hätten die Längenprüfung schon bestanden. Für reines Trimmen genügt auch `ConfigDict(str_strip_whitespace=True)` am Modell.

  Pydantic arbeitet standardmäßig im lax-Modus: Es wandelt um, was eindeutig geht. `"5"` wird zu `5`, `True` zu `1`, und unbekannte Felder werden ignoriert. Im strict-Modus lehnt es solche Umwandlungen ab, etwa mit `model_validate(daten, strict=True)` oder `ConfigDict(strict=True)`. Lax passt zu Query- und Formulareingaben. Bei IDs und Geldbeträgen kann es zu großzügig sein. Was lax erlaubt, zeigt die [Konvertierungstabelle](https://docs.pydantic.dev/latest/concepts/conversion_table/); die Optionen beschreibt der [strict mode](https://docs.pydantic.dev/latest/concepts/strict_mode/).

  Pydantic prüft die Form, nicht die Fachlichkeit. Ob die Kategorie existiert oder ein Statusübergang erlaubt ist, entscheidet dein Code, nicht das Modell.

  ## Eingabe-, Datenbank- und Ausgabemodell trennen

  Ein einziges Modell für Anlegen, Speichern und Antworten ist bequem. Es hat zwei Nachteile. Der Client könnte beim Anlegen Felder setzen, die ihm nicht gehören (`id`, `status`). Und die Antwort könnte Felder enthalten, die intern bleiben sollen, etwa einen Passwort-Hash oder eine interne Notiz. Deshalb gibt es meist drei Klassen:

  | Klasse | Aufgabe | Felder im Beispiel |
  | --- | --- | --- |
  | `TicketCreate` (Pydantic) | Was der Client senden darf | `title`, `description` |
  | `Ticket` (SQLAlchemy) | Was gespeichert wird | zusätzlich `id`, `status`, `internal_note`, `created_at` |
  | `TicketRead` (Pydantic) | Was die API zurückgibt | `id`, `title`, `description`, `status`, `created_at` |

  ```python
  from datetime import datetime
  from typing import Literal
  from pydantic import BaseModel, ConfigDict

  Status = Literal["open", "in_progress", "done"]

  class TicketRead(BaseModel):
      model_config = ConfigDict(from_attributes=True)

      id: int
      title: str
      description: str
      status: Status
      created_at: datetime
  ```

  `from_attributes=True` erlaubt Pydantic, ein Objekt mit Attributen zu lesen, etwa eine ORM-Zeile, statt nur ein Dict. `TicketRead.model_validate(zeile)` baut daraus das Ausgabemodell, `model_dump()` macht aus einem Modell wieder ein Dict. Was im Ausgabemodell fehlt, verlässt die API nicht: FastAPI filtert die Antwort durch dieses Modell (siehe unten).

  > [!INTERVIEW]
  > „Warum nicht ein Modell für Ein- und Ausgabe?“ Beide Richtungen haben verschiedene Verträge. Der Client darf `id` und `status` nicht setzen, und die Antwort darf keine internen Felder enthalten. Getrennte Modelle machen das im Code sichtbar und im Review prüfbar. Mit einem Allzweck-Modell oder einer ORM-Zeile als Antwort geht jede neue Spalte automatisch nach außen.

  ## SQLAlchemy 2.0: was der ORM dir abnimmt und was nicht

  Mit `sqlite3` schreibst du das Mapping zwischen Zeile und Objekt selbst:

  ```python run
  import sqlite3
  from dataclasses import dataclass

  @dataclass
  class Ticket:
      id: int
      title: str
      status: str

  con = sqlite3.connect(":memory:")
  try:
      con.row_factory = sqlite3.Row
      con.execute("CREATE TABLE tickets (id INTEGER PRIMARY KEY, title TEXT NOT NULL, status TEXT NOT NULL DEFAULT 'open')")
      con.execute("INSERT INTO tickets (title) VALUES (?)", ("VPN streikt",))
      zeilen = con.execute("SELECT id, title, status FROM tickets WHERE status = ?", ("open",)).fetchall()
      print([Ticket(**dict(zeile)) for zeile in zeilen])
  finally:
      con.close()
  ```

  Bei zwölf Tabellen schreibst du es zwölfmal. Ein ORM wie [SQLAlchemy](https://docs.sqlalchemy.org/en/20/tutorial/index.html) übernimmt es. Die Datenbank ersetzt er nicht: Transaktionen, Constraints und Abfragekosten bleiben deine Entscheidungen. Die Beispiele nutzen den 2.0-Stil mit `select()`, `Mapped` und `mapped_column`. Die ältere `session.query(...)`-Schreibweise gilt seit 2.0 als [Legacy](https://docs.sqlalchemy.org/en/20/orm/queryguide/query.html).

  ```python
  from datetime import UTC, datetime
  from sqlalchemy import CheckConstraint, select
  from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column

  def jetzt() -> datetime:
      return datetime.now(UTC)

  class Base(DeclarativeBase):
      pass

  class Ticket(Base):
      __tablename__ = "tickets"
      __table_args__ = (
          CheckConstraint("status IN ('open', 'in_progress', 'done')", name="ck_tickets_status"),
      )

      id: Mapped[int] = mapped_column(primary_key=True)
      title: Mapped[str]
      description: Mapped[str] = mapped_column(default="")
      status: Mapped[str] = mapped_column(default="open")
      internal_note: Mapped[str | None] = mapped_column(default=None)
      created_at: Mapped[datetime] = mapped_column(default=jetzt)

  stmt = select(Ticket).where(Ticket.status == "open").order_by(Ticket.id).limit(20)
  print(stmt)
  # SELECT tickets.id, tickets.title, … FROM tickets
  # WHERE tickets.status = :status_1 ORDER BY tickets.id
  #  LIMIT :param_1
  ```

  `Mapped[str]` erzeugt eine `NOT NULL`-Spalte, `Mapped[str | None]` erlaubt `NULL` ([Declarative Table](https://docs.sqlalchemy.org/en/20/orm/declarative_tables.html)). Der Wert `"open"` steht nicht im SQL-Text, sondern wird als Parameter gebunden. Das ist dieselbe Regel wie beim `?` in `sqlite3`, nur schreibst du sie nicht mehr selbst. Die Statusregel steht als `CheckConstraint` in der Datenbank. Dort gilt sie auch für ein Skript, das am ORM vorbeischreibt. Die Länge eines Titels gehört dagegen in Pydantic: SQLite erzwingt `VARCHAR(120)` nicht.

  | Der ORM übernimmt | Bei dir bleibt |
  | --- | --- |
  | Werte in `select()`, `insert()` und `update()` als Parameter binden | `text()` mit f-String: Dort gilt wieder jede Regel von oben, Werte gehören als `:name` gebunden |
  | Zeilen in Objekte und zurück abbilden | Wie viele Abfragen entstehen: Lazy Loading erzeugt N+1-Abfragen (siehe unten) |
  | SQL-Dialekt und Verbindungspool | Die Transaktionsgrenze: wann `commit()`, was zusammen bestätigt wird |
  | Tabellen aus den Modellen anlegen (`create_all`) | Constraints, Indizes und Fremdschlüssel ausdrücklich deklarieren, Schemaänderungen als Migration |
  | | `order_by`, wenn die Reihenfolge zum Vertrag gehört |

  ## Session und Transaktion: wer committet?

  Eine `Session` sammelt Änderungen an Objekten und schickt sie als SQL, wenn es nötig ist. Drei Schritte sind zu unterscheiden ([Session Basics](https://docs.sqlalchemy.org/en/20/orm/session_basics.html)):

  - `session.add(objekt)` merkt das Objekt vor. Es entsteht noch kein SQL.
  - `session.flush()` schickt das SQL in die offene Transaktion. Danach hat das Objekt seine `id`, aber nichts ist bestätigt.
  - `session.commit()` bestätigt die Transaktion. `session.rollback()` oder ein Schließen der Session ohne Commit verwirft sie.

  ```python
  from sqlalchemy import create_engine
  from sqlalchemy.orm import sessionmaker

  engine = create_engine("sqlite:///tickets.db")
  Base.metadata.create_all(engine)   # legt fehlende Tabellen an; für Tests und Prototypen
  SessionFactory = sessionmaker(engine)

  with SessionFactory.begin() as session:
      session.add(Ticket(title="VPN streikt"))
  # hier ist bestätigt; bei einer Exception im Block wäre zurückgerollt worden
  ```

  `SessionFactory.begin()` öffnet eine Session und eine Transaktion. Der Block bestätigt bei Erfolg, rollt bei einer Exception zurück und schließt die Session. Das entspricht dem `with con:` aus dem `sqlite3`-Abschnitt, nur verwaltet die Session zusätzlich Objekte. Die Muster stehen im Abschnitt [Framing out a begin / commit / rollback block](https://docs.sqlalchemy.org/en/20/orm/session_basics.html#framing-out-a-begin-commit-rollback-block).

  Zwei Verhaltensweisen überraschen am Anfang. Erstens startet die erste Abfrage einer Session automatisch eine Transaktion. Ein späteres `session.begin()` scheitert dann mit „A transaction is already begun on this Session“. In Endpunkten, die erst lesen und dann schreiben, rufst du deshalb `session.commit()` am Ende auf. Zweitens verfallen die geladenen Attribute nach dem Commit (`expire_on_commit=True`). Der nächste Zugriff lädt neu aus der Datenbank. Ist die Session dann schon geschlossen, wirft das einen `DetachedInstanceError`. Gib ein Objekt also zurück, solange die Session noch offen ist, oder wandle es vorher in ein Ausgabemodell.

  > [!MERKE]
  > `flush` sendet SQL, `commit` bestätigt es. Eine Session, die ohne `commit` schließt, verwirft alles, auch wenn zwischendurch IDs vergeben wurden.

  ## FastAPI: Parameter, Modelle und Statuscodes

  FastAPI liest die Signatur deiner Funktion und leitet daraus Validierung, Serialisierung und das OpenAPI-Schema ab. Woher ein Parameter stammt, entscheidet seine Form ([Pfad](https://fastapi.tiangolo.com/tutorial/path-params/), [Query](https://fastapi.tiangolo.com/tutorial/query-params-str-validations/), [Body](https://fastapi.tiangolo.com/tutorial/body/)):

  | Parameter | Quelle | Beispiel |
  | --- | --- | --- |
  | Name steht im Pfad | URL-Pfad | `ticket_id: int` bei `/tickets/{ticket_id}` |
  | einfacher Typ, nicht im Pfad | Query-String | `limit: int = 20` für `?limit=20` |
  | Pydantic-Modell | JSON-Körper | `data: TicketCreate` |
  | `Header()` | HTTP-Header | `x_api_key` für `X-API-Key` |

  ```python
  from typing import Annotated
  from fastapi import HTTPException, Query, status
  from sqlalchemy import select

  # router und SessionDep: siehe nächster Abschnitt

  @router.post("", response_model=TicketRead, status_code=status.HTTP_201_CREATED)
  def create_ticket(data: TicketCreate, session: SessionDep) -> Ticket:
      ticket = Ticket(**data.model_dump())
      session.add(ticket)
      session.commit()
      return ticket

  @router.get("", response_model=list[TicketRead])
  def list_tickets(
      session: SessionDep,
      status_filter: Annotated[Status | None, Query(alias="status")] = None,
      limit: Annotated[int, Query(ge=1, le=100)] = 20,
      offset: Annotated[int, Query(ge=0)] = 0,
  ) -> list[Ticket]:
      stmt = select(Ticket).order_by(Ticket.id).limit(limit).offset(offset)
      if status_filter is not None:
          stmt = stmt.where(Ticket.status == status_filter)
      return list(session.scalars(stmt))

  @router.get("/{ticket_id}", response_model=TicketRead)
  def read_ticket(ticket_id: int, session: SessionDep) -> Ticket:
      ticket = session.get(Ticket, ticket_id)
      if ticket is None:
          raise HTTPException(status.HTTP_404_NOT_FOUND, "Ticket nicht gefunden")
      return ticket
  ```

  `SessionDep` kommt im nächsten Abschnitt. Drei Dinge passieren hier ohne eigenen Code. Passt der Körper nicht zu `TicketCreate`, antwortet FastAPI mit `422` und einer Liste der Verstöße. `ticket_id=abc` scheitert aus demselben Grund. Und `response_model=TicketRead` filtert die Antwort ([Response Model](https://fastapi.tiangolo.com/tutorial/response-model/)): `internal_note` verlässt die API nicht, obwohl die ORM-Zeile das Feld hat. Steht `response_model` am Dekorator, hat es Vorrang vor der Rückgabeannotation. So kennt der Typchecker den echten Rückgabetyp `Ticket`, und FastAPI nutzt das Ausgabemodell.

  `HTTPException` beendet den Endpunkt sofort und macht aus Statuscode und `detail` die Antwort ([Fehler behandeln](https://fastapi.tiangolo.com/tutorial/handling-errors/)). Welcher Code zu welcher Lage passt, regelt [RFC 9110](https://www.rfc-editor.org/rfc/rfc9110#name-status-codes):

  | Code | Wann im Ticket-Beispiel |
  | --- | --- |
  | `201` | Ticket angelegt (`status_code=201` am Dekorator) |
  | `401` | API-Schlüssel fehlt oder ist falsch |
  | `404` | Ticket-ID unbekannt |
  | `409` | Konflikt mit dem Zustand, etwa ein nicht erlaubter Statusübergang |
  | `422` | Eingabe passt nicht zum Modell (setzt FastAPI selbst) |

  `Query(ge=1, le=100)` lehnt `limit=500` mit `422` ab. Willst du stattdessen auf 100 kürzen, tust du das selbst. Beides ist ein gültiger Vertrag, nur muss er dokumentiert und getestet sein. Die Übung `seite-begrenzen` baut die kürzende Variante als reine Funktion.

  > [!WARNING] Blockierender Code in `async def`
  > FastAPI führt einen Endpunkt mit `def` in einem Thread-Pool aus. Ein Endpunkt mit `async def` läuft direkt in der Event-Loop. Ein synchroner Aufruf darin hält die Loop an, etwa `session.execute(...)`, `httpx.get(...)` oder `time.sleep(...)`. Der Server beantwortet währenddessen keine andere Anfrage, auch nicht `/health`. Mit einer synchronen `Session` schreibst du deshalb `def`. Für `async def` brauchst du `AsyncSession` und einen asynchronen Treiber. Die [Async-Seite der FastAPI-Doku](https://fastapi.tiangolo.com/async/) erklärt die Wahl, das Modul [Nebenläufigkeit](/python/nebenlaeufigkeit) das Denkmodell dahinter.

  ## FastAPI: Abhängigkeiten für Session und API-Schlüssel

  Eine Abhängigkeit ist eine Funktion, deren Ergebnis FastAPI vor dem Endpunkt berechnet und als Parameter einsetzt ([Dependencies](https://fastapi.tiangolo.com/tutorial/dependencies/)). Sie darf selbst Parameter haben, etwa einen Header. Zwei Abhängigkeiten tragen die Ticket-API: die Datenbank-Session und die Prüfung des API-Schlüssels.

  ```python
  import os
  import secrets
  from collections.abc import Iterator
  from typing import Annotated
  from fastapi import APIRouter, Depends, FastAPI, Header, HTTPException, status
  from sqlalchemy import create_engine
  from sqlalchemy.orm import Session

  engine = create_engine(os.environ.get("DATABASE_URL", "sqlite:///tickets.db"))

  def get_session() -> Iterator[Session]:
      with Session(engine) as session:
          yield session

  SessionDep = Annotated[Session, Depends(get_session)]

  def require_api_key(x_api_key: Annotated[str | None, Header()] = None) -> None:
      erwartet = os.environ.get("TICKET_API_KEY", "")
      if (
          not erwartet
          or x_api_key is None
          or not secrets.compare_digest(x_api_key.encode(), erwartet.encode())
      ):
          raise HTTPException(
              status.HTTP_401_UNAUTHORIZED,
              "API-Schlüssel fehlt oder ist falsch",
              headers={"WWW-Authenticate": "APIKey"},
          )

  app = FastAPI(title="Team-Tickets")
  router = APIRouter(prefix="/tickets", dependencies=[Depends(require_api_key)])

  # … Endpunkte aus dem vorigen Abschnitt …

  app.include_router(router)
  ```

  `get_session` ist eine [Abhängigkeit mit `yield`](https://fastapi.tiangolo.com/tutorial/dependencies/dependencies-with-yield/). Der Code vor `yield` läuft vor dem Endpunkt, der Code danach läuft am Ende, auch bei einem Fehler. Jede Anfrage bekommt so eine eigene Session, und `with` schließt sie wieder. Teile eine Session nie zwischen Anfragen.

  `require_api_key` liest den Header `X-API-Key` (FastAPI macht aus `x_api_key` den Headernamen). Den erwarteten Wert liefert die Umgebung, nicht das Repository. `secrets.compare_digest` vergleicht in konstanter Zeit, damit die Antwortzeit nicht verrät, wie viele Zeichen stimmen. Bei `str` verlangt es reines ASCII, deshalb vergleichst du die Bytes. Mit `dependencies=[Depends(...)]` am Router gilt die Prüfung für jeden Endpunkt darin, `/health` bleibt offen. FastAPI bringt außerdem [`APIKeyHeader`](https://fastapi.tiangolo.com/tutorial/security/) mit, das das Schema zusätzlich ins OpenAPI-Dokument einträgt.

  Der Schlüssel erscheint in keinem Log und in keiner Fehlermeldung. Ein gemeinsamer Schlüssel sagt außerdem nur „jemand aus dem Team“. Personen, Rollen und Rechte kennt er nicht. Dafür brauchst du Benutzerkonten, ein eigenes Thema der [FastAPI-Sicherheitsdoku](https://fastapi.tiangolo.com/tutorial/security/).

  ## Tests ohne Server: TestClient und Test-Datenbank

  Der [`TestClient`](https://fastapi.tiangolo.com/tutorial/testing/) ruft die App im selben Prozess auf. Es gibt keinen Port und kein Netzwerk, und die Testfunktionen sind normale `def`. Er braucht einen HTTP-Client als Testabhängigkeit. Die FastAPI-Doku nennt `httpx`; neuere Starlette-Versionen warnen davor und nennen `httpx2`. Richte dich nach dem Hinweis deiner Version. Damit die Tests nicht auf die echte Datenbank zugreifen, tauschst du die Abhängigkeit aus ([Abhängigkeiten im Test überschreiben](https://fastapi.tiangolo.com/advanced/testing-dependencies/)):

  ```python
  # conftest.py
  import pytest
  from fastapi.testclient import TestClient
  from sqlalchemy import create_engine
  from sqlalchemy.orm import Session
  from sqlalchemy.pool import StaticPool

  from ticketapi import Base, app, get_session

  @pytest.fixture
  def engine():
      engine = create_engine(
          "sqlite://",
          connect_args={"check_same_thread": False},
          poolclass=StaticPool,
      )
      Base.metadata.create_all(engine)
      yield engine
      engine.dispose()

  @pytest.fixture
  def client(engine, monkeypatch):
      monkeypatch.setenv("TICKET_API_KEY", "test-key-nur-fuer-tests")

      def test_session():
          with Session(engine) as session:
              yield session

      app.dependency_overrides[get_session] = test_session
      with TestClient(app, headers={"X-API-Key": "test-key-nur-fuer-tests"}) as client:
          yield client
      app.dependency_overrides.clear()
  ```

  Eine In-Memory-SQLite-Datenbank gehört zu genau einer Verbindung. Der Standard-Pool öffnet je Thread eine neue Verbindung, und TestClient und Thread-Pool laufen in anderen Threads als dein Test. Ohne `StaticPool` meldet der erste Aufruf `no such table: tickets`, weil er eine leere Datenbank sieht. `StaticPool` teilt eine einzige Verbindung, `check_same_thread=False` erlaubt das über Threads hinweg ([SQLite-Dialekt](https://docs.sqlalchemy.org/en/20/dialects/sqlite.html#using-a-memory-database-in-multiple-threads-or-coroutines)). Eine Datei unter `tmp_path` geht ebenso und braucht beides nicht.

  ```python
  # test_tickets.py
  from sqlalchemy import select
  from sqlalchemy.orm import Session

  from ticketapi import Ticket

  def test_ticket_anlegen(client, engine):
      antwort = client.post("/tickets", json={"title": "  VPN streikt  "})

      assert antwort.status_code == 201
      assert "internal_note" not in antwort.json()
      with Session(engine) as session:
          assert session.scalars(select(Ticket.title)).all() == ["VPN streikt"]
  ```

  > [!PRAXIS]
  > Prüfe in einem API-Test nach dem `POST` nicht nur den Statuscode. Öffne eine zweite Session auf derselben Test-Datenbank und lies die Zeile. Ein vergessener `commit()` besteht jeden Test, der nur `201` und den Antworttext prüft, denn die Antwort stammt aus der noch offenen Session.

  ## Beziehungen, Fremdschlüssel und Migrationen in Kürze

  Das Abschlussprojekt protokolliert jeden Statuswechsel. Das ist eine zweite Tabelle mit einem Fremdschlüssel auf `tickets` und eine [`relationship`](https://docs.sqlalchemy.org/en/20/orm/basic_relationships.html) zwischen den Klassen:

  ```python
  from sqlalchemy import ForeignKey
  from sqlalchemy.orm import relationship

  class Ticket(Base):
      # … Spalten wie oben …
      events: Mapped[list["TicketEvent"]] = relationship(
          back_populates="ticket", order_by="TicketEvent.id"
      )

  class TicketEvent(Base):
      __tablename__ = "ticket_events"

      id: Mapped[int] = mapped_column(primary_key=True)
      ticket_id: Mapped[int] = mapped_column(ForeignKey("tickets.id"))
      von: Mapped[str]
      nach: Mapped[str]
      created_at: Mapped[datetime] = mapped_column(default=jetzt)
      ticket: Mapped[Ticket] = relationship(back_populates="events")

  ERLAUBT = {"open": {"in_progress", "done"}, "in_progress": {"open", "done"}, "done": {"open"}}

  class UngueltigerUebergang(ValueError):
      pass

  def status_wechseln(session: Session, ticket: Ticket, neu: str) -> None:
      if neu not in ERLAUBT[ticket.status]:
          raise UngueltigerUebergang(f"{ticket.status} -> {neu} ist nicht erlaubt")
      session.add(TicketEvent(ticket=ticket, von=ticket.status, nach=neu))
      ticket.status = neu
  ```

  `status_wechseln` kennt kein HTTP und committet nicht. Der Endpunkt ruft sie auf, übersetzt `UngueltigerUebergang` in `HTTPException(409)` und ruft danach einmal `session.commit()`. Statuswechsel und Protokolleintrag werden so in einer Transaktion bestätigt oder zusammen verworfen.

  SQLite erzwingt Fremdschlüssel nur, wenn du sie je Verbindung einschaltest ([Foreign Key Support](https://docs.sqlalchemy.org/en/20/dialects/sqlite.html#foreign-key-support)). Ohne das speichert es ein Protokoll für ein Ticket, das nicht existiert:

  ```python
  from sqlalchemy import event
  from sqlalchemy.engine import Engine

  @event.listens_for(Engine, "connect")
  def fremdschluessel_an(dbapi_connection, _connection_record):
      cursor = dbapi_connection.cursor()
      cursor.execute("PRAGMA foreign_keys=ON")
      cursor.close()
  ```

  Greifst du in einer Schleife auf `ticket.events` zu, lädt SQLAlchemy die Ereignisse pro Ticket mit einer eigenen Abfrage (Lazy Loading). Bei 100 Tickets sind das 101 Abfragen, das N+1-Problem. `select(Ticket).options(selectinload(Ticket.events))` lädt sie mit einer zusätzlichen Abfrage für alle Tickets der Liste ([Relationship Loading](https://docs.sqlalchemy.org/en/20/orm/queryguide/relationships.html#selectin-eager-loading)). Mit `create_engine(..., echo=True)` siehst du jede Abfrage und zählst nach.

  `Base.metadata.create_all(engine)` legt fehlende Tabellen an und ändert bestehende nie. Für eine Schemaänderung an einer Datenbank mit Daten brauchst du Migrationen. [Alembic](https://alembic.sqlalchemy.org/en/latest/tutorial.html) gehört zum SQLAlchemy-Projekt:

  ```console
  $ uv run alembic init migrations
  $ uv run alembic revision --autogenerate -m "ticket_events"
  $ uv run alembic upgrade head
  ```

  `--autogenerate` vergleicht die Modelle mit der Datenbank und schreibt einen Entwurf. Lies ihn vor dem Anwenden, denn er erkennt nicht alles; eine umbenannte Spalte erscheint zum Beispiel als Löschen plus Anlegen ([Grenzen von Autogenerate](https://alembic.sqlalchemy.org/en/latest/autogenerate.html)). SQLite kann bestehende Tabellen nur eingeschränkt ändern, dafür gibt es den [Batch-Modus](https://alembic.sqlalchemy.org/en/latest/batch.html). Mehr braucht dieses Modul nicht; das Abschlussprojekt verlangt nur einen nachvollziehbaren Weg, das Schema anzulegen und später zu ändern.

  ## Häufige Fehler

  F-Strings in SQL, ein fehlendes Komma im Parametertupel und ungeprüftes `fetchone()[0]` sind häufige Fehler. Prüfe bei leerem Ergebnis zuerst, ob die Zeile fehlen darf. Bei „database is locked“ suche lange Transaktionen oder konkurrierende Schreiber; erhöhe nicht blind nur die Wartezeit. Halte Netzwerkaufrufe möglichst außerhalb kurzer Schreibtransaktionen.

  Mit FastAPI, Pydantic und SQLAlchemy kommen diese Fehler dazu:

  - `session.flush()` statt `session.commit()`: Der Endpunkt antwortet `201` mit einer `id`, aber die Zeile fehlt beim nächsten Aufruf, weil die Session ohne Commit schließt.
  - Das Modell mit internen Feldern als `response_model`: Der Hash oder die interne Notiz erscheint in der Antwort. Ein eigenes Ausgabemodell verhindert das.
  - `async def` mit synchroner `Session` oder `httpx.get`: Der Server reagiert unter Last nicht mehr. Schreibe `def` oder nutze asynchrone Bibliotheken.
  - `no such table` im Test: Eine In-Memory-Datenbank ohne `StaticPool` ist für den Thread des TestClients leer.
  - Pydantic-v1-Code aus alten Tutorials (`@validator`, `.dict()`, `orm_mode`): In v2 heißen sie `field_validator`, `model_dump()` und `from_attributes`.
  - `Mapped[str]` für eine Spalte, die `NULL` enthalten darf: Die Spalte wird `NOT NULL`. Schreibe `Mapped[str | None]`.
  - Das Test-Setup baut die Datenbank nicht pro Test neu auf: Tests hängen dann von der Reihenfolge ab.

  > [!INTERVIEW]
  > „Warum reicht try/except beim Import nicht?“ Weil das Fangen einer Exception keine vorherigen Schreiboperationen zurücknimmt. Erst eine passende Transaktion verbindet den fachlichen Vertrag mit atomarem Datenbankverhalten.

  > [!MERKE]
  > Transporterfolg, gültige Daten und bestätigte Speicherung sind drei verschiedene Erfolgsaussagen.

  ## Zusammenfassung

  - Prüfe Transport, Status, Syntax und Fachschema getrennt.
  - Trenne testbare Logik von externem Transport.
  - Binde SQL-Werte als Parameter.
  - Definiere Constraints und Ergebnisreihenfolge ausdrücklich.
  - Transaktionen schützen zusammengehörige Änderungen.
  - Schließe Verbindungen unabhängig vom Commit-Verhalten.
  - Pydantic prüft die Form an der Grenze; Eingabe-, Datenbank- und Ausgabemodell bleiben getrennt.
  - `response_model` filtert die Antwort. Was dort fehlt, verlässt die API nicht.
  - FastAPI setzt Session und API-Schlüssel-Prüfung per `Depends` ein. Tests überschreiben beide.
  - SQLAlchemy bindet Parameter für dich. Transaktion, Constraints, `order_by` und Abfragezahl bleiben bei dir.
  - `flush` sendet SQL, `commit` bestätigt. Ohne `commit` verwirft die Session alles.
  - Synchrone Sessions gehören in `def`-Endpunkte.
