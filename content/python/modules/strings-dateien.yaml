  - id: json-konfig-ordnen
    type: order
    title: Eine JSON-Konfiguration aktualisieren
    prompt: Bring die Zeilen in eine Reihenfolge, die die Versionsnummer in `config/app.json` um eins erhöht und die Datei zurückschreibt.
    lang: python
    lines: |
      import json
      from pathlib import Path
      pfad = Path("config") / "app.json"
      daten = json.loads(pfad.read_text(encoding="utf-8"))
      daten["version"] += 1
      pfad.write_text(json.dumps(daten, indent=2), encoding="utf-8")
    alternatives:
      - [2, 1, 3, 4, 5, 6]
    explanation: |
      Die Reihenfolge der Imports ist egal, alles andere nicht: erst den Pfad bauen, dann lesen und parsen, dann ändern, dann serialisieren und schreiben. `loads`/`dumps` arbeiten mit Strings, weil `read_text` und `write_text` das Öffnen und Schließen übernehmen.
    resources:
      - title: pathlib.Path.read_text
        url: https://docs.python.org/3/library/pathlib.html#pathlib.Path.read_text
      - title: json.loads
        url: https://docs.python.org/3/library/json.html#json.loads

  - id: stringmethoden-vorhersagen
    type: output
    title: Eine Logzeile zerlegen
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      zeile = "  ERROR;db;Verbindung verloren  "
      teile = zeile.strip().split(";")
      print(teile)
      print(" | ".join(teile[1:]))
      print(zeile.find("WARN"), zeile.strip().startswith(("ERROR", "FATAL")))
      print("key=value=x".partition("="))
      print("a,,b".split(","), " a  b ".split())
      print("v1.2.3".removeprefix("v").replace(".", "-"))
    expected: |
      ['ERROR', 'db', 'Verbindung verloren']
      db | Verbindung verloren
      -1 True
      ('key', '=', 'value=x')
      ['a', '', 'b'] ['a', 'b']
      1-2-3
    explanation: |
      `strip` entfernt nur Leerraum an den Rändern, der Leerraum in „Verbindung verloren“ bleibt. `join` ist eine Methode des Trennzeichens. `find` liefert `-1`, wenn nichts gefunden wird; `startswith` akzeptiert ein Tupel. `partition` trennt nur am **ersten** Vorkommen. `split(",")` erzeugt leere Felder, `split()` ohne Argument nicht. Die Methoden lassen sich verketten, weil jede einen neuen String liefert.
    resources:
      - title: String Methods
        url: https://docs.python.org/3/library/stdtypes.html#string-methods

  - id: format-vorhersagen
    type: output
    title: Format-Spezifikation lesen
    prompt: Was gibt dieses Programm aus? Achte auf jedes Leerzeichen.
    lang: python
    code: |
      preis = 1234.5
      print(f"{preis:.2f}|{preis:,.2f}|{preis:>10.1f}|")
      print(f"{'API':<6}|{'DB':^6}|{42:>4}|{7:03d}")
      print(f"{0.256:.1%} {255:x} {1_000_000:_}")
    expected: |
      1234.50|1,234.50|    1234.5|
      API   |  DB  |  42|007
      25.6% ff 1_000_000
    explanation: |
      `.2f` rundet auf zwei Nachkommastellen, `,` fügt Tausendertrenner ein. `>10.1f` erzeugt `1234.5` (6 Zeichen) und füllt links auf 10 auf. `<6` füllt rechts auf, `^6` verteilt den Leerraum auf beide Seiten. `03d` füllt mit Nullen, `.1%` multipliziert mit 100 und hängt `%` an, `x` ist hexadezimal, `_` trennt Tausender mit Unterstrichen.
    resources:
      - title: Format Specification Mini-Language
        url: https://docs.python.org/3/library/string.html#format-specification-mini-language
      - title: Format examples
        url: https://docs.python.org/3/library/string.html#format-examples

  - id: json-roundtrip-vorhersagen
    type: output
    title: Hin und zurück durch JSON
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      import json

      daten = {"name": "Müller", "punkte": (1, 2), 3: None, "aktiv": True}
      text = json.dumps(daten)
      print(text)
      zurueck = json.loads(text)
      print(zurueck)
      print(zurueck == daten)
      print(json.dumps({"stadt": "Köln"}, ensure_ascii=False))
    expected: |
      {"name": "M\u00fcller", "punkte": [1, 2], "3": null, "aktiv": true}
      {'name': 'Müller', 'punkte': [1, 2], '3': None, 'aktiv': True}
      False
      {"stadt": "Köln"}
    explanation: |
      `ensure_ascii` ist standardmäßig `True`, deshalb wird „ü“ als `\u00fc` geschrieben. JSON kennt keine Tupel und nur String-Schlüssel: Aus `(1, 2)` wird eine Liste, aus `3` der String `"3"`. `None` und `True` werden zu `null` und `true`. Nach dem Zurücklesen unterscheidet sich das Objekt deshalb vom Original – `==` ist `False`.
    resources:
      - title: json · Python-zu-JSON-Tabelle
        url: https://docs.python.org/3/library/json.html#py-to-json-table
      - title: json.dumps
        url: https://docs.python.org/3/library/json.html#json.dumps

  - id: csv-bericht-luecken
    type: gap
    title: Einen CSV-Bericht schreiben
    prompt: |
      Ergänze den Code. Der Ordner `berichte/2026` soll samt Elternordner angelegt werden, ohne Fehler, falls er schon existiert. Die CSV-Datei wird so geöffnet, wie es die `csv`-Doku verlangt, und mit UTF-8 geschrieben. Der Writer arbeitet mit Dictionaries und schreibt zuerst die Kopfzeile.
    lang: python
    code: |
      import csv
      from pathlib import Path

      ausgabe = Path("berichte") / "2026"
      ausgabe.mkdir(⟦parents=True, exist_ok=True⟧)

      with open(ausgabe ⟦/⟧ "umsatz.csv", "w", ⟦newline=""⟧, encoding=⟦"utf-8"⟧) as datei:
          schreiber = csv.⟦DictWriter⟧(datei, fieldnames=["monat", "umsatz"])
          schreiber.⟦writeheader()⟧
          schreiber.writerow({"monat": "Januar", "umsatz": 1200})
    gaps:
      - label: Ordner anlegen
        hint: Zwei Schlüsselwort-Argumente, beide `True`.
        accept:
          - exist_ok=True, parents=True
      - label: Pfad verbinden
        hint: "`pathlib` überlädt einen Rechenoperator."
      - label: Zeilenenden
        hint: Die `csv`-Doku verlangt einen leeren String für diesen Parameter.
      - label: Encoding
        hint: Der Name des Standard-Encodings, als String.
        accept:
          - '"utf8"'
      - label: Writer-Klasse
        hint: Das Gegenstück zu `DictReader`.
      - label: Kopfzeile
        hint: Eine Methode ohne Argumente, die die `fieldnames` schreibt.
    explanation: |
      `mkdir(parents=True, exist_ok=True)` verhält sich wie `mkdir -p`. `/` verbindet einen `Path` mit einem String zu einem neuen `Path`. `newline=""` überlässt dem `csv`-Modul die Zeilenenden – ohne entstehen unter Windows Leerzeilen. `DictWriter` braucht `fieldnames` und schreibt die Kopfzeile erst mit `writeheader()`.
    resources:
