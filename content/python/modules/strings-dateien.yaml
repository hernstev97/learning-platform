    type: choice
    title: Text oder Bytes?
    prompt: Welche Aussagen stimmen?
    options:
      - text: "`len(\"Grüße\".encode(\"utf-8\"))` ist `7`."
        correct: true
        why: "„ü“ und „ß“ brauchen in UTF-8 je zwei Bytes: 3 × 1 + 2 × 2 = 7."
      - text: "`open(\"daten.txt\")` ohne `encoding` liest in Python 3.14 immer UTF-8."
        correct: false
        why: Ohne `encoding` gilt das Systemencoding. UTF-8 wird erst ab Python 3.15 Standard (PEP 686).
      - text: "`b\"id=\" + \"42\"` ergibt `b\"id=42\"`."
        correct: false
        why: "Python mischt `bytes` und `str` nie stillschweigend – das ist ein `TypeError`. Erst `\"42\".encode()` oder `b\"id=\".decode()`."
      - text: Wer UTF-8-Bytes versehentlich als Latin-1 dekodiert, bekommt keinen Fehler, sondern falsche Zeichen.
        correct: true
        why: Latin-1 ordnet jedem der 256 Byte-Werte ein Zeichen zu und kann deshalb nie scheitern. Das Ergebnis ist Mojibake wie „GrÃ¼ÃŸe“.
    explanation: |
      Ein `str` besteht aus Unicode-Zeichen, `bytes` aus Zahlen von 0 bis 255; das Encoding übersetzt zwischen beiden. Python hält die Typen streng getrennt, damit Encoding-Fehler früh auffallen. Die tückischsten Fehler entstehen dort, wo das Encoding still falsch ist – beim Systemstandard und beim Dekodieren mit Latin-1.
