id: strings-dateien
title: Strings, Encodings und Dateien
level: 2
minutes: 190
summary: Text zerlegen und formatieren, Unicode und Bytes auseinanderhalten und Dateien, JSON und CSV so lesen und schreiben, dass es auf jedem System funktioniert.
goals:
  - Du verarbeitest Text mit `split`, `join`, `strip`, `partition`, `replace` und Co. und weißt, dass jede Methode einen neuen String liefert.
  - Du formatierst Zahlen und Tabellen mit der Format-Spezifikation in f-Strings.
  - Du unterscheidest `str` und `bytes`, erklärst Encodings und gibst beim Öffnen immer `encoding="utf-8"` an.
  - Du liest und schreibst Dateien mit `with` und `pathlib` und erklärst, warum `with` wichtig ist.
  - Du liest und schreibst JSON und CSV korrekt, inklusive `ensure_ascii`, `newline=""` und Excel-Eigenheiten.
