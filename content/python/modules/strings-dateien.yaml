lesson: |
  Die Buchhaltung schickt dir einen CSV-Export aus Excel. Du sollst ihn bereinigen und als JSON an eine API liefern. Beim ersten Versuch heißt die erste Spalte plötzlich `\ufeffname`, beim zweiten steht „MÃ¼ller“ statt „Müller“ in der Datenbank, und auf dem Windows-Laptop einer Kollegin hat die CSV-Datei nach jeder Zeile eine Leerzeile. Nichts davon ist exotisch – das ist der Alltag, sobald Text eine Datei oder ein Netzwerk berührt.

  Diese Lektion baut die Grundlagen dafür auf: Strings verarbeiten und formatieren, den Unterschied zwischen Text und Bytes verstehen, Dateien sicher lesen und schreiben und die beiden wichtigsten Austauschformate – JSON und CSV – richtig benutzen.

  ## Strings verarbeiten

  Ein `str` ist eine **unveränderliche** Folge von Unicode-Zeichen. Jede [String-Methode](https://docs.python.org/3/library/stdtypes.html#string-methods) liefert deshalb einen *neuen* String; `name.strip()` allein bewirkt nichts, du musst das Ergebnis zuweisen. Diese Methoden brauchst du ständig:

  ```python run
  zeile = "  2026-09-28 ERROR db: Verbindung verloren  \n"

  sauber = zeile.strip()                      # Leerraum an beiden Enden weg
  datum, level, rest = sauber.split(" ", 2)   # höchstens 2 Trennungen -> 3 Teile
  print(datum, level, rest, sep=" | ")

  quelle, _, nachricht = rest.partition(": ")  # immer genau 3 Teile
  print(quelle, "->", nachricht)

  print(sauber.startswith(("ERROR", "FATAL")), level in ("ERROR", "FATAL"))
  print(sauber.find("WARN"), sauber.find("db"))   # -1, wenn nicht gefunden
  print(sauber.replace("ERROR", "FEHLER"))
  print("v1.4.2".removeprefix("v").split("."))    # seit Python 3.9
  ```

  Die wichtigsten Details, die in Reviews auffallen:

  - [`split()`](https://docs.python.org/3/library/stdtypes.html#str.split) **ohne** Argument trennt an beliebigem Leerraum und ignoriert Ränder: `" a  b ".split()` ist `['a', 'b']`. **Mit** Trennzeichen entstehen leere Felder: `"a,,b".split(",")` ist `['a', '', 'b']`.
  - [`partition(sep)`](https://docs.python.org/3/library/stdtypes.html#str.partition) liefert immer ein 3-Tupel `(vorher, sep, nachher)` – auch wenn `sep` fehlt. Das ist robuster als `split` mit Entpacken, das bei fehlendem Trenner einen `ValueError` wirft.
  - [`strip("xy")`](https://docs.python.org/3/library/stdtypes.html#str.strip) entfernt eine *Menge von Zeichen*, kein Präfix: `"www.wiki.com".strip("w.com")` ergibt `"iki"`. Für Präfixe gibt es `removeprefix` und `removesuffix`.
  - `find` liefert `-1`, `index` wirft `ValueError`. Für „kommt vor?“ nimmst du `in`.
  - `startswith` und `endswith` akzeptieren ein Tupel von Möglichkeiten.
  - `splitlines()` zerlegt Text in Zeilen, ohne die Zeilenumbrüche mitzunehmen.

  ### Zusammensetzen mit `join`

  [`join`](https://docs.python.org/3/library/stdtypes.html#str.join) ist eine Methode des **Trennzeichens**: `", ".join(namen)`. Alle Elemente müssen Strings sein – `", ".join([1, 2])` wirft `TypeError`. Zahlen wandelst du vorher um: `", ".join(str(n) for n in zahlen)`. Einen String in einer Schleife mit `+=` aufzubauen, ist bei vielen Teilen langsamer, weil jedes `+=` einen neuen String erzeugt; sammle die Teile in einer Liste und verbinde sie am Ende.

  ```python run
  spalten = ["id", "name", "stadt"]
  print(";".join(spalten))
  print("\n".join(f"- {s}" for s in spalten))
  ```

  ## Formatieren mit der Format-Spezifikation

  Hinter dem Doppelpunkt in einem f-String steht die [Format-Spezifikation](https://docs.python.org/3/library/string.html#format-specification-mini-language). Ihr Aufbau ist `[[füllzeichen]ausrichtung][vorzeichen][0][breite][,][.genauigkeit][typ]` – alle Teile sind optional.

  ```python run
  umsatz = 1234567.891
  print(f"{umsatz:.2f}")       # 1234567.89 – zwei Nachkommastellen
  print(f"{umsatz:,.2f}")      # 1,234,567.89 – Tausendertrenner
  print(f"{umsatz:_.0f}")      # 1_234_568 – Unterstrich als Trenner
  print(f"[{'API':<8}]")       # linksbündig, Breite 8
  print(f"[{'API':>8}]")       # rechtsbündig
  print(f"[{'API':^8}]")       # zentriert
  print(f"[{'API':*^8}]")      # zentriert, mit * aufgefüllt
  print(f"{42:05d} {255:x} {255:08b} {0.256:.1%} {-3:+d} {3:+d}")
  breite = 10
  print(f"[{'dynamisch':>{breite}}]")   # Breite aus einer Variablen
  ```

  Der Klassiker für Berichte ist eine Tabelle mit festen Spaltenbreiten: Text linksbündig, Zahlen rechtsbündig, damit die Kommas untereinander stehen.

  ```python run
  positionen = [("Tastatur", 2, 49.90), ("Monitor 27 Zoll", 1, 1249.00), ("Kabel", 10, 3.50)]
  print(f"{'Artikel':<18}{'Menge':>6}{'Betrag':>12}")
  for artikel, menge, preis in positionen:
      print(f"{artikel:<18}{menge:>6}{menge * preis:>12,.2f}")
  ```

  Das deutsche Format „1.234,56“ kennt die Format-Spezifikation nicht direkt. Ein pragmatischer Weg für Berichte: `f"{wert:,.2f}".replace(",", "X").replace(".", ",").replace("X", ".")`. Für echte Lokalisierung gibt es das Modul `locale` oder Bibliotheken wie Babel.

  > [!NOTE] t-Strings seit Python 3.14
  > Python 3.14 bringt Template-Strings: `t"Hallo {name}"` liefert keinen fertigen String, sondern ein Template-Objekt, das Text und Werte getrennt hält ([PEP 750](https://peps.python.org/pep-0750/)). Bibliotheken können damit zum Beispiel HTML oder SQL sicher erzeugen. Für normale Ausgaben bleiben f-Strings richtig.

  ## Unicode, Bytes und Encodings

  Das wichtigste Denkmodell dieser Lektion: **Text und Bytes sind verschiedene Dinge.** Ein `str` ist eine Folge von Unicode-Codepoints – abstrakten Zeichen wie „ü“ (U+00FC). Festplatten, Sockets und HTTP kennen aber nur [Bytes](https://docs.python.org/3/library/stdtypes.html#binary-sequence-types-bytes-bytearray-memoryview), Zahlen von 0 bis 255. Ein **Encoding** legt fest, wie Zeichen zu Bytes werden. UTF-8 ist heute der Standard: ASCII-Zeichen brauchen ein Byte, „ü“ zwei, ein Emoji vier.

  ```python run
  text = "Grüße"
  daten = text.encode("utf-8")        # str -> bytes
  print(daten, len(text), len(daten)) # b'Gr\xc3\xbc\xc3\x9fe' 5 7
  print(daten.decode("utf-8"))        # bytes -> str: Grüße

  kaputt = daten.decode("latin-1")    # falsches Encoding: kein Fehler, nur Müll
  print(kaputt)                       # „Mojibake“

  try:
      "Grüße".encode("utf-8").decode("ascii")
  except UnicodeDecodeError as fehler:
      print("Fehler:", fehler)

  print("Grüße".encode("ascii", errors="replace"))
  ```

  Merke dir die Richtung: **en**code macht aus Text Bytes, **de**code aus Bytes Text. Python 3 mischt die beiden nie stillschweigend – `b"abc" + "def"` ist ein `TypeError`. Das ist unbequem, verhindert aber genau die Fehler, die in Python 2 überall steckten. Gefährlich ist das falsche Encoding beim Dekodieren: Latin-1 kann jedes Byte dekodieren und wirft daher nie einen Fehler; du bekommst still „GrÃ¼ÃŸe“. Das [Unicode HOWTO](https://docs.python.org/3/howto/unicode.html) erklärt die Hintergründe.

  > [!WARNING] Immer `encoding="utf-8"` angeben
  > Ohne `encoding` benutzt `open()` das Encoding, das dein Betriebssystem voreinstellt. Unter Linux und macOS ist das meist UTF-8, unter Windows oft nicht. Dein Skript funktioniert also auf deinem Rechner und scheitert beim Kollegen – oder schreibt still falsche Umlaute. Erst ab Python 3.15 wird UTF-8 der Standard ([PEP 686](https://peps.python.org/pep-0686/)). Bis dahin, und für Code, der auf mehreren Versionen läuft: `encoding="utf-8"` bei jedem Öffnen im Textmodus.

  ## Dateien lesen und schreiben

  [`open(pfad, modus, encoding=…)`](https://docs.python.org/3/library/functions.html#open) liefert ein Dateiobjekt. Die Modi:

  | Modus | Bedeutung |
  | --- | --- |
  | `"r"` | lesen (Standard); Fehler, wenn die Datei fehlt |
  | `"w"` | schreiben; **leert** eine vorhandene Datei sofort |
  | `"a"` | anhängen ans Ende |
  | `"x"` | neu anlegen; Fehler, wenn die Datei schon existiert |
  | `"b"` zusätzlich | Binärmodus: liest und schreibt `bytes`, kein Encoding |

  ```python run
  with open("app.log", "w", encoding="utf-8") as datei:
      datei.write("INFO Start\n")               # write hängt KEINEN Zeilenumbruch an
      print("ERROR Platte voll", file=datei)    # print schon

  with open("app.log", "a", encoding="utf-8") as datei:
      datei.write("INFO Ende\n")

  with open("app.log", encoding="utf-8") as datei:
      for nummer, zeile in enumerate(datei, start=1):   # zeilenweise, speichersparend
          print(nummer, zeile.rstrip("\n"))
  ```

  ### Warum `with`?

  Das [`with`-Statement](https://docs.python.org/3/reference/compound_stmts.html#the-with-statement) benutzt die Datei als *Context Manager*: Beim Verlassen des Blocks wird sie **garantiert** geschlossen – auch wenn eine Exception fliegt. Das ist aus drei Gründen wichtig:

  1. **Gepufferte Daten.** `write` landet zuerst in einem Puffer. Erst beim Schließen (oder `flush`) ist sicher, dass alles auf der Platte steht. Ein Skript, das abstürzt, ohne zu schließen, kann eine halbe Datei hinterlassen.
  2. **Begrenzte Ressourcen.** Jedes Betriebssystem erlaubt einem Prozess nur eine begrenzte Zahl offener Dateien. Ein Server, der Dateien öffnet und nicht schließt, scheitert irgendwann mit `Too many open files`.
  3. **Sperren.** Unter Windows lässt sich eine geöffnete Datei oft nicht löschen oder verschieben.

  Ohne `with` bräuchtest du `try`/`finally` mit `datei.close()` – `with` ist die kurze, sichere Form davon. Das Modul Fehler und Module zeigt, wie du eigene Context Manager schreibst.

  ## `pathlib`: Pfade als Objekte

  Pfade als Strings zusammenzubauen (`ordner + "/" + name`) ist fehleranfällig und nicht portabel. [`pathlib`](https://docs.python.org/3/library/pathlib.html) macht Pfade zu Objekten mit Methoden. Der Operator `/` verbindet Pfadteile und benutzt automatisch das richtige Trennzeichen des Betriebssystems.

  ```python run
  from pathlib import Path

  export = Path("exporte") / "2026" / "september"
  export.mkdir(parents=True, exist_ok=True)     # wie mkdir -p

  bericht = export / "umsatz.txt"
  bericht.write_text("Umsatz: 1.234,50 €\n", encoding="utf-8")
  print(bericht.read_text(encoding="utf-8"), end="")
  print(bericht.name, bericht.stem, bericht.suffix, bericht.parent)
  print(bericht.exists(), bericht.is_file(), export.is_dir())
  print(bericht.with_suffix(".csv"))

  (export / "a.csv").write_text("x\n", encoding="utf-8")
  (export / "b.csv").write_text("y\n", encoding="utf-8")
  print(sorted(p.name for p in export.glob("*.csv")))       # Muster im Ordner
  print(sorted(p.name for p in Path("exporte").rglob("*")))  # rekursiv
  ```

  - [`mkdir(parents=True, exist_ok=True)`](https://docs.python.org/3/library/pathlib.html#pathlib.Path.mkdir) legt fehlende Elternordner an und wirft keinen Fehler, wenn der Ordner schon existiert – die Form, die du fast immer willst.
  - [`read_text`](https://docs.python.org/3/library/pathlib.html#pathlib.Path.read_text) und [`write_text`](https://docs.python.org/3/library/pathlib.html#pathlib.Path.write_text) öffnen, lesen bzw. schreiben und schließen in einem Schritt. Auch hier gehört `encoding="utf-8"` dazu.
  - [`iterdir()`](https://docs.python.org/3/library/pathlib.html#pathlib.Path.iterdir) liefert den Inhalt eines Ordners, [`glob`](https://docs.python.org/3/library/pathlib.html#pathlib.Path.glob) und `rglob` filtern mit Mustern. Die Reihenfolge ist nicht festgelegt – sortiere, wenn sie zählt.
  - Alle Funktionen, die Pfade annehmen – `open`, `json`, `csv`, `shutil` –, akzeptieren `Path`-Objekte direkt.

  ## JSON

  JSON ist das Austauschformat von Web-APIs und vielen Konfigurationen. Das Modul [`json`](https://docs.python.org/3/library/json.html) übersetzt zwischen JSON-Text und Python-Objekten. Merkhilfe: Die Funktionen mit **s** (`dumps`, `loads`) arbeiten mit **S**trings, die ohne mit Dateiobjekten.

  ```python run
  import json
  from pathlib import Path

  bestellung = {"id": 42, "kunde": "Müller", "positionen": [("SKU-1", 2)], "bezahlt": False, "notiz": None}

  text = json.dumps(bestellung, ensure_ascii=False, indent=2)
  print(text)

  zurueck = json.loads(text)
  print(zurueck["positionen"])          # [['SKU-1', 2]] – aus dem Tupel wurde eine Liste

  Path("bestellung.json").write_text(text, encoding="utf-8")
  with open("bestellung.json", encoding="utf-8") as datei:
      print(json.load(datei)["kunde"])

  print(json.dumps({1: "eins"}))        # {"1": "eins"} – Schlüssel werden Strings
  ```

  Die [Umwandlungstabelle](https://docs.python.org/3/library/json.html#py-to-json-table) erklärt drei Überraschungen: Tupel werden zu Listen, Dictionary-Schlüssel werden zu Strings, und `None`/`True`/`False` werden zu `null`/`true`/`false`. Ein Round-Trip liefert deshalb nicht immer dasselbe Objekt. Zwei Parameter solltest du kennen:

  - `ensure_ascii=True` ist der Standard und schreibt „ü“ als `\u00fc`. Das ist gültiges JSON, aber schlecht lesbar. Mit `ensure_ascii=False` bleiben Umlaute erhalten – dann muss die Datei aber mit `encoding="utf-8"` geschrieben werden.
  - `indent=2` macht die Ausgabe lesbar und Git-Diffs übersichtlich; für Netzwerkübertragung lässt du es weg.

  Objekte wie `datetime` oder `Decimal` kann `json` nicht serialisieren (`TypeError: Object of type datetime is not JSON serializable`). Wandle sie vorher um, zum Beispiel mit `.isoformat()`, oder übergib `default=str`.

  ## CSV

  CSV sieht einfach aus, ist es aber nicht: Felder können Kommas, Anführungszeichen und Zeilenumbrüche enthalten. `zeile.split(",")` scheitert daran. Das Modul [`csv`](https://docs.python.org/3/library/csv.html) kennt die Regeln. Am bequemsten sind [`DictReader`](https://docs.python.org/3/library/csv.html#csv.DictReader) und [`DictWriter`](https://docs.python.org/3/library/csv.html#csv.DictWriter), die mit der Kopfzeile als Schlüsseln arbeiten.

  ```python run
  import csv
  from pathlib import Path

  kunden = [
      {"name": "Müller GmbH", "stadt": "Köln", "umsatz": 1234.5},
      {"name": "Schmidt, Meyer & Co", "stadt": "Berlin", "umsatz": 99.0},
  ]

  with open("kunden.csv", "w", newline="", encoding="utf-8") as datei:
      schreiber = csv.DictWriter(datei, fieldnames=["name", "stadt", "umsatz"])
      schreiber.writeheader()
      schreiber.writerows(kunden)

  print(Path("kunden.csv").read_text(encoding="utf-8"))   # das Komma im Namen wird gequotet

  with open("kunden.csv", newline="", encoding="utf-8") as datei:
      for zeile in csv.DictReader(datei):
          print(zeile["name"], float(zeile["umsatz"]) * 2)   # alles kommt als str zurück
  ```

  Drei Regeln aus der Doku und der Praxis:

  1. **`newline=""` beim Öffnen.** Die Doku verlangt es für Reader und Writer: Das `csv`-Modul behandelt Zeilenenden selbst. Ohne `newline=""` entstehen unter Windows zusätzliche Leerzeilen, und Zeilenumbrüche innerhalb gequoteter Felder werden falsch gelesen.
  2. **Alles ist ein String.** `DictReader` liefert nur `str`. Zahlen und Datumswerte wandelst du selbst um.
  3. **Excel ist speziell.** Ein deutsches Excel schreibt Semikolons (`delimiter=";"`), Dezimalkommas und oft ein BOM (Byte Order Mark) an den Dateianfang. Mit `encoding="utf-8"` landet das BOM als `\ufeff` im ersten Spaltennamen; das Encoding [`utf-8-sig`](https://docs.python.org/3/library/codecs.html#module-encodings.utf_8_sig) entfernt es beim Lesen.

  > [!INTERVIEW] „Wie liest du eine große Datei, ohne den Speicher zu sprengen?“
  > Zeilenweise iterieren statt `read()`: `for zeile in datei:` hält immer nur eine Zeile im Speicher. Die Datei öffne ich mit `with` und explizitem `encoding="utf-8"`. Bei CSV nehme ich `csv.DictReader`, der ebenfalls zeilenweise liest, und bei riesigen JSON-Dateien ein zeilenbasiertes Format wie JSON Lines, weil `json.load` alles auf einmal lädt.

  ## Häufige Fehler

  - **Ergebnis einer String-Methode nicht zugewiesen.** `name.strip()` allein ändert nichts. `name = name.strip()`.
  - **`open()` ohne `encoding`.** Funktioniert lokal, scheitert unter Windows mit `UnicodeDecodeError` oder erzeugt Mojibake.
  - **`"w"` statt `"a"`.** `"w"` leert die Datei beim Öffnen. Wer in einer Schleife mit `"w"` öffnet, behält nur den letzten Eintrag.
  - **`write` ohne `"\n"`.** Alles landet in einer Zeile.
  - **Zeilenumbrüche vergessen.** Zeilen aus einer Datei enden mit `"\n"`. `zeile == "ende"` ist nie wahr; nimm `zeile.rstrip("\n")` oder `strip()`.
  - **CSV mit `split(",")` parsen.** Scheitert an gequoteten Feldern. Nimm das `csv`-Modul.
  - **`KeyError: 'name'` bei einer CSV aus Excel.** Falsches Trennzeichen oder BOM. Prüfe `reader.fieldnames` und nimm `delimiter=";"` bzw. `encoding="utf-8-sig"`.
  - **`json.dumps` mit Umlauten und `ensure_ascii=False`, aber ohne UTF-8 beim Schreiben.** Dann greift wieder das Systemencoding.

  > [!PRAXIS]
  > In echten Projekten erkennt man robusten Dateicode an wenigen Merkmalen: `pathlib` statt String-Pfaden, `with` bei jedem `open`, `encoding="utf-8"` überall, `newline=""` bei CSV und Tests, die mit Umlauten arbeiten. ruff hat dafür eigene Regeln – etwa `PLW1514` für `open()` ohne Encoding und die `PTH`-Regeln, die `os.path` durch `pathlib` ersetzen. Kritische Dateien wie Konfigurationen schreibt man zuerst in eine temporäre Datei und benennt sie dann um, damit ein Absturz nie eine halbe Datei hinterlässt.

  ## Zusammenfassung

  - Strings sind unveränderlich; jede Methode liefert einen neuen String. `split`, `join`, `strip`, `partition`, `replace`, `startswith` und `removeprefix` decken den Alltag ab.
  - Die Format-Spezifikation (`:.2f`, `:>10`, `:,`, `:05d`, `:.1%`) formatiert Zahlen und Tabellen.
  - `str` ist Text, `bytes` sind Bytes. `encode` macht Bytes, `decode` Text. UTF-8 ist der Standard – gib es beim Öffnen immer an.
  - `with open(…)` schließt garantiert, auch bei Fehlern. `"w"` leert, `"a"` hängt an, `"x"` legt nur neu an.
  - `pathlib.Path` mit `/`, `read_text`, `write_text`, `glob` und `mkdir(parents=True, exist_ok=True)` ersetzt String-Pfade.
  - `json.dumps`/`loads` für Strings, `dump`/`load` für Dateien; `ensure_ascii=False` und `indent=2` für lesbare Dateien.
  - CSV mit `DictReader`/`DictWriter` und `newline=""`; Excel braucht oft `delimiter=";"` und `utf-8-sig`.
