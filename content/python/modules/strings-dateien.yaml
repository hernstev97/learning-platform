  - id: env-datei-parsen
    type: code
    title: Eine .env-Datei lesen
    prompt: |
      Schreibe `parse_env(text)`, die den Inhalt einer `.env`-Datei in ein Dictionary übersetzt:

      - Leere Zeilen und Zeilen, die (nach Leerraum) mit `#` beginnen, werden ignoriert.
      - Getrennt wird am **ersten** `=`; Schlüssel und Wert werden von Leerraum befreit.
      - Ist der Wert in passende Anführungszeichen (`"…"` oder `'…'`) eingeschlossen, werden sie entfernt.
      - Zeilen ohne `=` werden ignoriert.
    lang: python
    starter: |
      def parse_env(text: str) -> dict[str, str]:
          werte = {}
          for zeile in text.splitlines():
              ...
          return werte
    solution: |
      def parse_env(text: str) -> dict[str, str]:
          werte = {}
          for zeile in text.splitlines():
              zeile = zeile.strip()
              if not zeile or zeile.startswith("#"):
                  continue
              schluessel, trenner, wert = zeile.partition("=")
              if not trenner:
                  continue
              wert = wert.strip()
              if len(wert) >= 2 and wert[0] == wert[-1] and wert[0] in "\"'":
                  wert = wert[1:-1]
              werte[schluessel.strip()] = wert
          return werte
    tests:
      - name: Einfache Paare
        code: |
          ergebnis = parse_env("PORT=8000\nDEBUG=true")
          assert ergebnis == {"PORT": "8000", "DEBUG": "true"}, f"bekommen {ergebnis!r}"
      - name: Kommentare und Leerzeilen
        code: |
          text = "# Datenbank\n\n  # eingerückter Kommentar\nDB_HOST=localhost\n"
          ergebnis = parse_env(text)
          assert ergebnis == {"DB_HOST": "localhost"}, f"bekommen {ergebnis!r}"
      - name: Nur am ersten = trennen
        code: |
          ergebnis = parse_env("DATABASE_URL=postgres://app:geheim@db/app?ssl=true")
          assert ergebnis == {"DATABASE_URL": "postgres://app:geheim@db/app?ssl=true"}, f"bekommen {ergebnis!r}"
      - name: Leerraum und Anführungszeichen
        code: |
          ergebnis = parse_env("  NAME = \"Müller GmbH\" \nMOTTO='Hallo Welt'\nLEER=")
          assert ergebnis == {"NAME": "Müller GmbH", "MOTTO": "Hallo Welt", "LEER": ""}, f"bekommen {ergebnis!r}"
      - name: Zeilen ohne = werden ignoriert
        code: |
          ergebnis = parse_env("export\nA=1")
          assert ergebnis == {"A": "1"}, f"bekommen {ergebnis!r}"
    hints:
      - "`zeile.strip()` zuerst, dann `if not zeile or zeile.startswith(\"#\"): continue`."
      - "`partition(\"=\")` trennt am ersten `=` und liefert einen leeren Trenner, wenn keins vorkommt."
      - "Anführungszeichen: prüfe `wert[0] == wert[-1]` und `wert[0] in \"\\\"'\"`, dann `wert[1:-1]`."
    explanation: |
      `partition` ist hier ideal: Es trennt nur am ersten `=` – URLs mit weiteren `=` bleiben intakt – und signalisiert mit einem leeren Trenner, dass keins da war. `split("=")` würde die URL zerschneiden, `split("=", 1)` mit Entpacken bei fehlendem `=` einen `ValueError` werfen. Die Prüfung `len(wert) >= 2` verhindert, dass ein einzelnes `"` zu einem leeren String wird.
    resources:
      - title: str.partition
        url: https://docs.python.org/3/library/stdtypes.html#str.partition
      - title: str.strip
        url: https://docs.python.org/3/library/stdtypes.html#str.strip

  - id: slug-erzeugen
    type: code
    title: URL-Slugs für Blogartikel
    prompt: |
      Ein CMS braucht aus Artikeltiteln URL-Slugs. Schreibe `slugify(titel)`:

      - alles kleinschreiben,
      - `ä`, `ö`, `ü`, `ß` durch `ae`, `oe`, `ue`, `ss` ersetzen,
      - nur `a`–`z` und `0`–`9` behalten; jede Folge anderer Zeichen wird zu **einem** Bindestrich,
      - keine Bindestriche am Anfang oder Ende.

      Beispiel: `"Größe & Gewicht: Über 9000!"` → `"groesse-gewicht-ueber-9000"`
    lang: python
    starter: |
      def slugify(titel: str) -> str:
          ...
    solution: |
      import string

      ERLAUBT = set(string.ascii_lowercase + string.digits)
      ERSATZ = {"ä": "ae", "ö": "oe", "ü": "ue", "ß": "ss"}


      def slugify(titel: str) -> str:
          text = titel.lower()
          for alt, neu in ERSATZ.items():
              text = text.replace(alt, neu)
          zeichen = [z if z in ERLAUBT else "-" for z in text]
          teile = "".join(zeichen).split("-")
          return "-".join(teil for teil in teile if teil)
    tests:
      - name: Beispiel aus der Aufgabe
        code: |
          ergebnis = slugify("Größe & Gewicht: Über 9000!")
          assert ergebnis == "groesse-gewicht-ueber-9000", f"bekommen {ergebnis!r}"
      - name: Versionsnummern und Ränder
        code: |
          ergebnis = slugify("  Python 3.14: Was ist neu?  ")
          assert ergebnis == "python-3-14-was-ist-neu", f"bekommen {ergebnis!r}"
      - name: Straße wird strasse
        code: |
          ergebnis = slugify("Hauptstraße 5")
          assert ergebnis == "hauptstrasse-5", f"bekommen {ergebnis!r}"
      - name: Nur Sonderzeichen
        code: |
          ergebnis = slugify("!!! ---")
          assert ergebnis == "", f"bekommen {ergebnis!r}"
    hints:
      - "Erst `lower()`, dann die Umlaute mit `replace` ersetzen."
      - "`string.ascii_lowercase + string.digits` enthält alle erlaubten Zeichen."
      - "Ersetze jedes andere Zeichen durch `-`, zerlege dann mit `split(\"-\")` und verbinde nur die nicht leeren Teile mit `\"-\".join(…)`."
    explanation: |
      Das Split-und-Join-Muster löst zwei Probleme auf einmal: `split("-")` erzeugt für mehrere Bindestriche hintereinander leere Teile, und wer nur die nicht leeren Teile wieder verbindet, bekommt einfache Bindestriche ohne Ränder. `str.isalnum()` wäre als Filter falsch, weil es auch „é“ oder „ß“ akzeptiert. Die Umlaute müssen vor dem Filtern ersetzt werden, sonst wären sie schon zu `-` geworden.
    resources:
      - title: string.ascii_lowercase
        url: https://docs.python.org/3/library/string.html#string.ascii_lowercase
      - title: str.join
        url: https://docs.python.org/3/library/stdtypes.html#str.join

  - id: rechnung-formatieren
    type: code
    title: Rechnungszeilen ausrichten
    prompt: |
      Schreibe `rechnungszeilen(positionen)`. Jede Position ist ein Tupel `(artikel, menge, einzelpreis)`. Die Funktion gibt eine Liste von Strings zurück:

      - Pro Position eine Zeile: Artikel **linksbündig in 20 Zeichen**, Menge **rechtsbündig in 5 Zeichen**, Betrag (`menge * einzelpreis`) **rechtsbündig in 12 Zeichen** mit Tausendertrenner und zwei Nachkommastellen.
      - Zum Schluss eine Zeile: `Summe` **linksbündig in 25 Zeichen**, dann die Gesamtsumme wie ein Betrag formatiert.
    lang: python
    starter: |
      def rechnungszeilen(positionen: list[tuple[str, int, float]]) -> list[str]:
          zeilen = []
          summe = 0.0
          for artikel, menge, preis in positionen:
              betrag = menge * preis
              summe += betrag
              zeilen.append(f"{artikel} {menge} {betrag}")
          zeilen.append(f"Summe {summe}")
          return zeilen
    solution: |
      def rechnungszeilen(positionen: list[tuple[str, int, float]]) -> list[str]:
          zeilen = []
          summe = 0.0
          for artikel, menge, preis in positionen:
              betrag = menge * preis
              summe += betrag
              zeilen.append(f"{artikel:<20}{menge:>5}{betrag:>12,.2f}")
          zeilen.append(f"{'Summe':<25}{summe:>12,.2f}")
          return zeilen
    tests:
      - name: Eine Position
        code: |
          ergebnis = rechnungszeilen([("Tastatur", 2, 49.9)])
          erwartet = "Tastatur".ljust(20) + "2".rjust(5) + "99.80".rjust(12)
          assert ergebnis[0] == erwartet, f"\nerwartet {erwartet!r}\nbekommen {ergebnis[0]!r}"
      - name: Tausendertrenner
        code: |
          ergebnis = rechnungszeilen([("Monitor 27 Zoll", 1, 1249.0)])
          erwartet = "Monitor 27 Zoll".ljust(20) + "1".rjust(5) + "1,249.00".rjust(12)
          assert ergebnis[0] == erwartet, f"\nerwartet {erwartet!r}\nbekommen {ergebnis[0]!r}"
      - name: Summenzeile
        code: |
          ergebnis = rechnungszeilen([("Tastatur", 2, 49.9), ("Monitor 27 Zoll", 1, 1249.0)])
          assert len(ergebnis) == 3, f"erwartet 3 Zeilen, bekommen {len(ergebnis)}"
          erwartet = "Summe".ljust(25) + "1,348.80".rjust(12)
          assert ergebnis[-1] == erwartet, f"\nerwartet {erwartet!r}\nbekommen {ergebnis[-1]!r}"
      - name: Alle Zeilen gleich breit
        code: |
          ergebnis = rechnungszeilen([("Kabel", 10, 3.5), ("Server", 3, 12500.0)])
          assert {len(z) for z in ergebnis} == {37}, f"Zeilenlängen: {[len(z) for z in ergebnis]}"
      - name: Keine Positionen
        code: |
          ergebnis = rechnungszeilen([])
          assert ergebnis == ["Summe".ljust(25) + "0.00".rjust(12)], f"bekommen {ergebnis!r}"
    hints:
      - "`<20` richtet links in 20 Zeichen aus, `>5` rechts in 5."
      - "Für den Betrag: `>12,.2f` – Breite, Tausendertrenner, Genauigkeit, Typ in dieser Reihenfolge."
      - "Ein String-Literal im f-String: `f\"{'Summe':<25}\"`."
    explanation: |
      Die Format-Spezifikation liest sich von links nach rechts: Ausrichtung, Breite, Tausendertrenner, Genauigkeit, Typ. Weil alle Spalten feste Breiten haben, ist jede Zeile 37 Zeichen lang und die Beträge stehen bündig untereinander. Die Summenzeile nutzt 25 = 20 + 5 Zeichen für den Text, damit ihr Betrag in derselben Spalte steht.
    resources:
      - title: Format Specification Mini-Language
        url: https://docs.python.org/3/library/string.html#format-specification-mini-language

  - id: json-dateien-sammeln
    type: code
    title: JSON-Exporte zusammenführen
    prompt: |
      Im Ordner `eingang` liegen mehrere JSON-Dateien, jede enthält eine Liste von Bestellungen (Dictionaries mit `"id"`). Schreibe `sammle_bestellungen(ordner)`:

      - Lies alle Dateien mit Endung `.json` im Ordner (andere Dateien ignorieren).
      - Schreibe alle Bestellungen **nach `id` sortiert** in `<ordner>/gesamt.json` – mit `indent=2`, lesbaren Umlauten und UTF-8.
      - Eine vorhandene `gesamt.json` darf beim erneuten Aufruf nicht mitgelesen werden.
      - Gib die Anzahl der Bestellungen zurück.
    lang: python
    setup: |
      import json
      from pathlib import Path

      eingang = Path("eingang")
      eingang.mkdir()
      (eingang / "shop-a.json").write_text(json.dumps([{"id": 3, "kunde": "Müller"}]), encoding="utf-8")
      (eingang / "shop-b.json").write_text(json.dumps([{"id": 1, "kunde": "Özdemir"}, {"id": 2, "kunde": "Schmidt"}]), encoding="utf-8")
      (eingang / "notiz.txt").write_text("keine Bestellungen", encoding="utf-8")
    starter: |
      import json
      from pathlib import Path


      def sammle_bestellungen(ordner: str) -> int:
          basis = Path(ordner)
          alle = []
          # alle .json-Dateien lesen, sortieren, gesamt.json schreiben
          return len(alle)
    solution: |
      import json
      from pathlib import Path


      def sammle_bestellungen(ordner: str) -> int:
          basis = Path(ordner)
          alle = []
          for datei in sorted(basis.glob("*.json")):
              if datei.name == "gesamt.json":
                  continue
              alle.extend(json.loads(datei.read_text(encoding="utf-8")))
          alle.sort(key=lambda bestellung: bestellung["id"])
          ziel = basis / "gesamt.json"
          ziel.write_text(json.dumps(alle, ensure_ascii=False, indent=2), encoding="utf-8")
          return len(alle)
    tests:
      - name: Zählt alle Bestellungen
        code: |
          anzahl = sammle_bestellungen("eingang")
          assert anzahl == 3, f"erwartet 3, bekommen {anzahl!r}"
      - name: gesamt.json ist nach id sortiert
        code: |
          import json
          from pathlib import Path
          sammle_bestellungen("eingang")
          ziel = Path("eingang") / "gesamt.json"
          assert ziel.exists(), "eingang/gesamt.json wurde nicht geschrieben"
          daten = json.loads(ziel.read_text(encoding="utf-8"))
          assert [b["id"] for b in daten] == [1, 2, 3], f"ids: {[b['id'] for b in daten]}"
      - name: Umlaute sind lesbar und eingerückt
        code: |
          from pathlib import Path
          sammle_bestellungen("eingang")
          text = (Path("eingang") / "gesamt.json").read_text(encoding="utf-8")
          assert "Müller" in text, "Umlaute stehen als \\u-Escapes in der Datei – ensure_ascii=False fehlt"
          assert "\n  " in text, "die Datei ist nicht mit indent=2 eingerückt"
      - name: Zweiter Aufruf liest gesamt.json nicht mit
        code: |
          sammle_bestellungen("eingang")
          anzahl = sammle_bestellungen("eingang")
          assert anzahl == 3, f"beim zweiten Aufruf {anzahl} statt 3 – gesamt.json wurde mitgelesen"
    hints:
      - "`basis.glob(\"*.json\")` liefert alle JSON-Dateien; `notiz.txt` fällt dabei automatisch heraus."
      - "`liste.extend(…)` hängt alle Elemente einer anderen Liste an."
      - "Beim Schreiben: `json.dumps(alle, ensure_ascii=False, indent=2)` und `write_text(…, encoding=\"utf-8\")`."
    explanation: |
      `glob("*.json")` filtert nach Endung, die Prüfung auf `gesamt.json` verhindert, dass die eigene Ausgabe beim nächsten Lauf wieder Eingabe wird – ein typischer Fehler bei Skripten, die in ihren Eingabeordner schreiben. `sorted` um das `glob` macht die Reihenfolge deterministisch. `ensure_ascii=False` schreibt „Müller“ statt `M\u00fcller` und verlangt deshalb ein ausdrückliches UTF-8 beim Schreiben.
    resources:
      - title: pathlib.Path.glob
        url: https://docs.python.org/3/library/pathlib.html#pathlib.Path.glob
      - title: json.dumps
        url: https://docs.python.org/3/library/json.html#json.dumps

  - id: excel-csv-reparieren
    type: code
    title: Repariere den Excel-Import
    prompt: |
      Die Vertriebsabteilung exportiert Kunden aus einem deutschen Excel nach `kunden.csv`. `lade_kunden` bricht mit `KeyError: 'name'` ab, obwohl die Datei eine Spalte `name` hat. Repariere die Funktion. Sie soll eine Liste von Dictionaries mit `"name"` (str) und `"umsatz"` (float) liefern; `"1.234,50"` wird zu `1234.5`.

      So sieht die Datei im Editor aus (mit unsichtbarem BOM am Anfang):

      ```text
      name;umsatz
      Müller GmbH;1.234,50
      Öztürk AG;99,00
      ```
    lang: python
    setup: |
      from pathlib import Path

      Path("kunden.csv").write_text(
          "name;umsatz\nMüller GmbH;1.234,50\nÖztürk AG;99,00\n",
          encoding="utf-8-sig",
      )
    starter: |
      import csv


      def lade_kunden(pfad: str) -> list[dict]:
          kunden = []
          with open(pfad, newline="", encoding="utf-8") as datei:
              for zeile in csv.DictReader(datei):
                  kunden.append({"name": zeile["name"], "umsatz": float(zeile["umsatz"])})
          return kunden
    solution: |
      import csv


      def lade_kunden(pfad: str) -> list[dict]:
          kunden = []
          with open(pfad, newline="", encoding="utf-8-sig") as datei:
              for zeile in csv.DictReader(datei, delimiter=";"):
                  betrag = zeile["umsatz"].replace(".", "").replace(",", ".")
                  kunden.append({"name": zeile["name"], "umsatz": float(betrag)})
          return kunden
    tests:
      - name: Zwei Kunden geladen
        code: |
          kunden = lade_kunden("kunden.csv")
          assert len(kunden) == 2, f"erwartet 2 Kunden, bekommen {len(kunden)}"
      - name: Namen ohne BOM und mit Umlauten
        code: |
          kunden = lade_kunden("kunden.csv")
          assert [k["name"] for k in kunden] == ["Müller GmbH", "Öztürk AG"], f"bekommen {kunden!r}"
      - name: Umsatz als float mit deutschem Format
        code: |
          kunden = lade_kunden("kunden.csv")
          assert kunden[0]["umsatz"] == 1234.5, f"erwartet 1234.5, bekommen {kunden[0]['umsatz']!r}"
          assert kunden[1]["umsatz"] == 99.0, f"erwartet 99.0, bekommen {kunden[1]['umsatz']!r}"
      - name: Nur die zwei Schlüssel
        code: |
          kunden = lade_kunden("kunden.csv")
          assert list(kunden[0]) == ["name", "umsatz"], f"Schlüssel: {list(kunden[0])!r}"
    hints:
      - "Gib testweise `csv.DictReader(datei).fieldnames` aus. Wie viele Spalten erkennt der Reader – und wie heißt die erste?"
      - "Das Trennzeichen ist ein Semikolon: `delimiter=\";\"`. Das BOM entfernt das Encoding `utf-8-sig`."
      - "Für `1.234,50`: erst den Tausenderpunkt entfernen, dann das Komma durch einen Punkt ersetzen."
    explanation: |
      Drei Excel-Eigenheiten kommen zusammen. Das Semikolon als Trennzeichen macht aus der Kopfzeile eine einzige Spalte `name;umsatz`. Das BOM am Dateianfang landet mit `utf-8` als `\ufeff` im ersten Spaltennamen; `utf-8-sig` entfernt es. Und `float` versteht kein Dezimalkomma, also erst den Tausenderpunkt entfernen, dann das Komma ersetzen – in dieser Reihenfolge. Für Geldbeträge wäre `Decimal` statt `float` in echtem Code die bessere Wahl.
    resources:
      - title: csv.DictReader
        url: https://docs.python.org/3/library/csv.html#csv.DictReader
      - title: codecs · utf-8-sig
        url: https://docs.python.org/3/library/codecs.html#module-encodings.utf_8_sig

  - id: log-nur-letzte-zeile
    type: bug
    title: Das Log enthält nur einen Eintrag
    prompt: |
      `schreibe_log` wird mit zehn Einträgen aufgerufen. Danach steht in der Datei aber nur der **letzte** Eintrag. Einträge aus früheren Aufrufen sollen erhalten bleiben – es ist ein Log. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      def schreibe_log(eintraege: list[str], pfad: str) -> None:
          for eintrag in eintraege:
              with open(pfad, "w", encoding="utf-8") as datei:
                  datei.write(eintrag + "\n")
    lines: [3]
    fix:
      - line: 3
        answers:
          - 'with open(pfad, "a", encoding="utf-8") as datei:'
          - 'with open(pfad, mode="a", encoding="utf-8") as datei:'
          - 'with open(pfad, "a", encoding="utf8") as datei:'
    explanation: |
      Der Modus `"w"` leert die Datei **beim Öffnen**. Weil die Datei in jedem Schleifendurchlauf neu geöffnet wird, überlebt nur der letzte Eintrag. `"a"` hängt ans Ende an und bewahrt auch Einträge früherer Aufrufe. Noch besser wäre, die Datei einmal vor der Schleife zu öffnen – das spart bei vielen Einträgen die wiederholten Systemaufrufe.
    resources:
      - title: Built-in open()
        url: https://docs.python.org/3/library/functions.html#open

  - id: atomar-speichern-erklaeren
    type: explain
    title: Warum so umständlich speichern?
    prompt: Ein Kollege fragt im Review, warum `speichere_konfig` nicht direkt `pfad.write_text(…)` aufruft. Erkläre, was die Funktion Schritt für Schritt tut und welche Probleme sie verhindert.
    lang: python
    code: |
      import json
      from pathlib import Path


      def speichere_konfig(pfad: Path, daten: dict) -> None:
          temp = pfad.with_suffix(".tmp")
          text = json.dumps(daten, ensure_ascii=False, indent=2)
          temp.write_text(text, encoding="utf-8")
          temp.replace(pfad)
    points:
      - Die Daten werden zuerst vollständig in eine temporäre Datei im selben Ordner geschrieben.
      - "`replace` benennt die fertige Datei um; unter POSIX ist das atomar – Leser sehen entweder die alte oder die neue Datei, nie eine halbe."
      - Stürzt das Programm beim Schreiben ab, bleibt die alte Konfiguration unbeschädigt.
      - "`with_suffix` hält die temporäre Datei im selben Ordner und damit auf demselben Dateisystem – Voraussetzung für ein atomares Umbenennen."
      - "`ensure_ascii=False` hält Umlaute lesbar und verlangt deshalb das ausdrückliche `encoding=\"utf-8\"`; `indent=2` macht Diffs lesbar."
    explanation: |
      `write_text` öffnet die Zieldatei mit `"w"` – sie ist ab diesem Moment leer. Stürzt das Programm mitten im Schreiben ab oder ist die Platte voll, bleibt eine halbe oder leere Konfiguration zurück, und der Dienst startet nicht mehr. Deshalb schreibt die Funktion zuerst in `app.tmp` daneben und benennt die fertige Datei mit `replace` um. `os.replace` ist laut Doku unter POSIX atomar, solange Quelle und Ziel auf demselben Dateisystem liegen – das garantiert `with_suffix`, weil die temporäre Datei im selben Ordner liegt. `ensure_ascii=False` schreibt Umlaute direkt und braucht dafür UTF-8; `indent=2` macht die Datei für Menschen und Git-Diffs lesbar.
    resources:
      - title: os.replace
        url: https://docs.python.org/3/library/os.html#os.replace
      - title: pathlib.Path.replace
        url: https://docs.python.org/3/library/pathlib.html#pathlib.Path.replace
