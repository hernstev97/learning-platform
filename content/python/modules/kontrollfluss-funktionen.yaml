id: kontrollfluss-funktionen
title: Kontrollfluss und Funktionen
level: 1
minutes: 180
summary: Bedingungen, Schleifen und `match` sicher einsetzen, Funktionen mit klaren Signaturen schreiben und verstehen, wo Python einen Namen sucht.
goals:
  - Du sagst voraus, welche Werte in Bedingungen als wahr gelten und was `and` und `or` zurückgeben.
  - Du schreibst Schleifen idiomatisch mit `for`, `enumerate`, `break`, `continue` und `else`.
  - Du zerlegst Daten mit `match` und Mustern und kennst die Falle mit nackten Namen.
  - Du entwirfst Signaturen mit Standardwerten, `*args`, `**kwargs`, keyword-only und positional-only Parametern.
  - Du erkennst die Falle mit veränderlichen Standardwerten und erklärst Scope-Fehler mit der LEGB-Regel.
  - Du löst Probleme auf Baumstrukturen rekursiv.
