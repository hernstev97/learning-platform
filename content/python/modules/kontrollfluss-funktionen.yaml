lesson: |
  Ein Deployment-Skript liest eine Konfiguration, prüft ein paar Bedingungen, wiederholt einen Health-Check, bis der Dienst antwortet, und reagiert auf unterschiedliche Antworten unterschiedlich. Das ist Kontrollfluss – und in Python sieht er an einigen Stellen anders aus als in TypeScript oder Kotlin: Leere Listen gelten als falsch, Schleifen haben ein `else`, `match` ist viel mächtiger als ein `switch`, und ein Standardwert wie `=[]` kann Daten zwischen Aufrufen teilen.

  Diese Lektion geht vom Einfachen zum Tückischen: Bedingungen und Wahrheitswerte, Schleifen, `match`, dann Funktionen, ihre Parameterarten und die Frage, wo Python einen Namen sucht. Grundlage bleibt das Denkmodell aus dem Einstieg: Namen zeigen auf Objekte.

  ## Bedingungen und Wahrheitswerte

  [`if`, `elif` und `else`](https://docs.python.org/3/tutorial/controlflow.html#if-statements) funktionieren wie erwartet – mit Doppelpunkt und Einrückung statt Klammern. Interessant ist, was als Bedingung erlaubt ist: **jedes Objekt**. Python fragt das Objekt, ob es als wahr gilt ([Truth Value Testing](https://docs.python.org/3/library/stdtypes.html#truth-value-testing)). Als *falsy* gelten:

  - `None` und `False`
  - Null in jedem Zahlentyp: `0`, `0.0`, `Decimal(0)`
  - leere Sammlungen und Sequenzen: `""`, `[]`, `()`, `{}`, `set()`, `range(0)`

  Alles andere ist *truthy* – auch `"0"`, `"False"`, `[0]` und `-1`. Eigene Klassen können das über `__bool__` oder `__len__` festlegen.

  ```python run
  offene_tickets = []
  if not offene_tickets:          # idiomatisch statt len(offene_tickets) == 0
      print("Alles erledigt")

  for wert in [0, 0.0, "", "0", [], [0], None, -1]:
      print(repr(wert), "->", bool(wert))
  ```

  ### `and` und `or` liefern Operanden, nicht `True`/`False`

  Die [booleschen Operatoren](https://docs.python.org/3/reference/expressions.html#boolean-operations) werten kurzschließend aus und geben einen ihrer Operanden zurück: `x or y` liefert `x`, wenn `x` truthy ist, sonst `y`. `x and y` liefert `x`, wenn `x` falsy ist, sonst `y`. Das wird gern für Standardwerte genutzt – mit einer Falle:

  ```python run
  benutzername = ""
  print(benutzername or "Gast")      # Gast

  timeout_aus_konfig = 0             # 0 heißt hier: kein Timeout
  timeout = timeout_aus_konfig or 30
  print(timeout)                     # 30 – die 0 geht verloren!

  timeout = 30 if timeout_aus_konfig is None else timeout_aus_konfig
  print(timeout)                     # 0 – richtig
  ```

  Die letzte Zeile nutzt den [bedingten Ausdruck](https://docs.python.org/3/reference/expressions.html#conditional-expressions) `a if bedingung else b` – Pythons Gegenstück zu `bedingung ? a : b`.

  > [!MERKE]
  > `x or standard` ersetzt **jeden** falsy Wert, auch `0`, `""` und `[]`. Wenn nur „nicht angegeben“ gemeint ist, prüfe ausdrücklich mit `is None`.

  ## Schleifen

  Pythons [`for`](https://docs.python.org/3/tutorial/controlflow.html#for-statements) ist immer eine *for-each*-Schleife: Sie läuft über die Elemente eines iterierbaren Objekts – Liste, String, Datei, Dictionary, `range`. Eine Zählschleife im C-Stil gibt es nicht. Brauchst du Zahlen, nimmst du [`range(start, stop, schritt)`](https://docs.python.org/3/tutorial/controlflow.html#the-range-function); `stop` ist dabei nie enthalten.

  ```python run
  dienste = ["api", "worker", "db"]

  for dienst in dienste:                           # direkt über die Elemente
      print("prüfe", dienst)

  for nummer, dienst in enumerate(dienste, start=1):   # mit Zähler
      print(f"{nummer}. {dienst}")

  ports = [8000, 8001, 5432]
  for dienst, port in zip(dienste, ports):         # zwei Listen parallel
      print(f"{dienst}:{port}")

  print(list(range(10, 0, -3)))                    # [10, 7, 4, 1]
  ```

  `for i in range(len(dienste))` funktioniert auch, gilt aber als unidiomatisch: [`enumerate`](https://docs.python.org/3/library/functions.html#enumerate) liefert Index und Element zusammen, [`zip`](https://docs.python.org/3/library/functions.html#zip) läuft über mehrere Iterables parallel (mit `strict=True` seit 3.10 auch mit Längenprüfung).

  `while` nimmst du, wenn die Anzahl der Durchläufe vorher nicht feststeht – etwa beim Warten auf einen Dienst oder beim Abarbeiten einer Warteschlange.

  ### `break`, `continue` und `else` an Schleifen

  [`break`](https://docs.python.org/3/tutorial/controlflow.html#break-and-continue-statements) verlässt die innerste Schleife, `continue` springt zum nächsten Durchlauf. Ungewöhnlich ist das [`else` an Schleifen](https://docs.python.org/3/tutorial/controlflow.html#else-clauses-on-loops): Es läuft, wenn die Schleife **ohne `break`** endet. Lies es als „kein Treffer“:

  ```python run
  antworten = [503, 503, 200, 200]

  for versuch, status in enumerate(antworten, start=1):
      if status != 200:
          print(f"Versuch {versuch}: {status}, warte …")
          continue
      print(f"Dienst bereit nach {versuch} Versuchen")
      break
  else:
      print("Dienst nie bereit – Deployment abbrechen")
  ```

  Ändere die Liste auf `[503, 503]` und führe den Block erneut aus: Jetzt läuft der `else`-Zweig. Ohne `else` bräuchtest du eine Hilfsvariable wie `gefunden = False`. Das Muster ist nützlich, aber vielen unbekannt – ein kurzer Kommentar hilft Lesern im Team.

  ## `match`: Daten nach ihrer Form zerlegen

  Seit Python 3.10 gibt es [`match`](https://docs.python.org/3/tutorial/controlflow.html#match-statements) ([PEP 634](https://peps.python.org/pep-0634/), Tutorial in [PEP 636](https://peps.python.org/pep-0636/)). Es sieht aus wie ein `switch`, ist aber *Structural Pattern Matching*: Ein Muster prüft die **Form** eines Werts und bindet dabei Teile an Namen. Die `case`-Zweige werden von oben nach unten geprüft; der erste passende gewinnt.

  ```python run
  def verarbeite(befehl: str) -> str:
      match befehl.split():
          case []:
              return "leere Eingabe"
          case ["hilfe" | "help"]:                  # Oder-Muster
              return "Befehle: deploy <dienst>, logs <dienst> [n]"
          case ["deploy", dienst]:                  # bindet das 2. Element an dienst
              return f"deploye {dienst}"
          case ["logs", dienst, anzahl] if anzahl.isdigit():   # Guard
              return f"zeige {anzahl} Zeilen von {dienst}"
          case ["logs", dienst]:
              return f"zeige 20 Zeilen von {dienst}"
          case [name, *rest]:                       # *rest sammelt den Rest
              return f"unbekannt: {name} (Argumente: {rest})"

  for eingabe in ["", "help", "deploy api", "logs worker 50", "logs db", "restart a b"]:
      print(repr(eingabe), "->", verarbeite(eingabe))
  ```

  Die wichtigsten Mustertypen:

  | Muster | Beispiel | Passt, wenn … |
  | --- | --- | --- |
  | Literal | `case 404:` | der Wert gleich ist (`==`; bei `None`, `True`, `False` mit `is`) |
  | Capture | `case fehler:` | immer – bindet den Wert an `fehler` |
  | Wildcard | `case _:` | immer – bindet nichts |
  | Wert (mit Punkt) | `case HTTPStatus.OK:` | der Wert gleich der Konstanten ist |
  | Oder | `case 301 \| 302:` | eines der Teilmuster passt |
  | Sequenz | `case [x, y, *rest]:` | eine Sequenz (kein `str`) mit passender Länge vorliegt |
  | Mapping | `case {"typ": "push", "ref": ref}:` | die Schlüssel vorhanden sind – weitere Schlüssel sind egal |
  | Klasse | `case Punkt(x=0, y=y):` | `isinstance` passt und die Attribute passen |

  Mapping-Muster sind ideal für JSON-Daten aus APIs oder Webhooks:

  ```python run
  def beschreibe(ereignis: dict) -> str:
      match ereignis:
          case {"typ": "push", "branch": "main", "autor": autor}:
              return f"{autor} hat auf main gepusht – Deployment startet"
          case {"typ": "push", "branch": branch}:
              return f"Push auf {branch}"
          case {"typ": "pull_request", "aktion": "opened" | "reopened" as aktion}:
              return f"PR {aktion}"
          case {"typ": typ}:
              return f"ignoriert: {typ}"
          case _:
              return "ungültiges Ereignis"

  print(beschreibe({"typ": "push", "branch": "main", "autor": "steven", "commits": 3}))
  print(beschreibe({"typ": "push", "branch": "feature/login"}))
  print(beschreibe({"typ": "pull_request", "aktion": "reopened"}))
  print(beschreibe({"typ": "star"}))
  print(beschreibe({"foo": 1}))
  ```

  > [!WARNING] Nackte Namen sind Capture-Muster
  > `case NICHT_GEFUNDEN:` vergleicht **nicht** mit einer Konstanten, sondern bindet jeden Wert an den Namen `NICHT_GEFUNDEN` – das Muster passt immer. Steht danach noch ein `case`, meldet Python einen `SyntaxError` („name capture 'NICHT_GEFUNDEN' makes remaining patterns unreachable“). Steht es als letzter Zweig, passiert es still. Konstanten brauchen einen Punkt im Namen, etwa `HTTPStatus.NOT_FOUND` aus [`http`](https://docs.python.org/3/library/http.html#http.HTTPStatus), oder du schreibst das Literal.

  ```python run fails
  NICHT_GEFUNDEN = 404

  def text(status):
      match status:
          case NICHT_GEFUNDEN:      # fängt alles!
              return "nicht gefunden"
          case _:
              return "anderer Status"
  ```

  `if`/`elif` bleibt richtig für einfache Vergleiche. `match` lohnt sich, sobald du Daten nach ihrer Struktur unterscheidest und dabei Teile herausziehst.

  ## Funktionen und ihre Parameter

  `def` erzeugt ein Funktionsobjekt und bindet es an einen Namen – Funktionen sind Objekte wie alle anderen und lassen sich übergeben und zurückgeben. Ohne `return` liefert eine Funktion `None`. Ist die erste Anweisung ein String, wird er zum [Docstring](https://docs.python.org/3/tutorial/controlflow.html#documentation-strings); `help()` und Editoren zeigen ihn an. [PEP 257](https://peps.python.org/pep-0257/) beschreibt die Konventionen: eine Zusammenfassungszeile im Imperativ, bei Bedarf eine Leerzeile und Details.

  ```python run
  def brutto(netto: float, satz: float = 0.19) -> float:
      """Berechne den Bruttobetrag zu einem Nettobetrag."""
      return round(netto * (1 + satz), 2)

  print(brutto(100))              # Standardwert für satz
  print(brutto(100, 0.07))        # positional
  print(brutto(satz=0.07, netto=100))   # per Schlüsselwort, Reihenfolge egal
  print(brutto.__doc__)
  ```

  ### Die fünf Parameterarten

  Eine Signatur kann alle Arten kombinieren ([Special parameters](https://docs.python.org/3/tutorial/controlflow.html#special-parameters)):

  ```python run
  def anfrage(url, /, methode="GET", *pfade, timeout=10, **header):
      print(f"{url=} {methode=} {pfade=} {timeout=} {header=}")

  anfrage("https://api.example.com")
  anfrage("https://api.example.com", "POST", "users", "42", timeout=3, Accept="application/json")
  ```

  - **Vor `/`: positional-only** (seit 3.8, [PEP 570](https://peps.python.org/pep-0570/)). `url` darf nicht als `url=…` übergeben werden. So kannst du den Parameter später umbenennen, ohne Aufrufer zu brechen.
  - **Normale Parameter** gehen positional oder per Schlüsselwort.
  - **`*args`** (hier `*pfade`) sammelt überzählige positionale Argumente in einem **Tupel**.
  - **Nach `*` oder `*args`: keyword-only** ([PEP 3102](https://peps.python.org/pep-3102/)). `timeout` geht nur als `timeout=3`.
  - **`**kwargs`** (hier `**header`) sammelt überzählige Schlüsselwort-Argumente in einem **Dictionary**.

  Ein nacktes `*` ohne Namen macht alle folgenden Parameter keyword-only, ohne zusätzliche Argumente zu sammeln. Das ist die wichtigste Anwendung im Alltag: `def exportiere(daten, *, ueberschreiben=False)`. Ein Aufruf `exportiere(daten, True)` ist dann verboten – und `exportiere(daten, ueberschreiben=True)` liest sich ohne Blick in die Doku. Beim Aufruf funktioniert der Stern umgekehrt: `f(*liste, **dikt)` verteilt Elemente auf Parameter.

  > [!INTERVIEW] „Was bedeuten `/` und `*` in einer Signatur?“
  > Alles vor `/` ist positional-only, alles nach `*` (oder `*args`) keyword-only. Keyword-only nutze ich für Optionen und besonders für Booleans, damit Aufrufe lesbar bleiben. Positional-only nutzt man, wenn der Parametername kein Teil der API sein soll – viele eingebaute Funktionen wie `len(obj, /)` sind so definiert.

  ### Die Falle mit veränderlichen Standardwerten

  Standardwerte werden **einmal** ausgewertet, wenn `def` ausgeführt wird – nicht bei jedem Aufruf. Das [Tutorial](https://docs.python.org/3/tutorial/controlflow.html#default-argument-values) warnt ausdrücklich davor. Mit dem Denkmodell ist klar, warum: Der Standardwert ist *ein* Objekt, das an der Funktion hängt, und jeder Aufruf ohne Argument bekommt dasselbe.

  ```python run
  def notiere(text, protokoll=[]):          # FALSCH
      protokoll.append(text)
      return protokoll

  print(notiere("start"))    # ['start']
  print(notiere("stopp"))    # ['start', 'stopp'] – dieselbe Liste!

  def notiere_richtig(text, protokoll=None):
      if protokoll is None:
          protokoll = []                    # bei jedem Aufruf neu
      protokoll.append(text)
      return protokoll

  print(notiere_richtig("start"))
  print(notiere_richtig("stopp"))
  ```

  Das `None`-Muster ist der Standard für veränderliche Standardwerte (`[]`, `{}`, `set()`). Die FAQ erklärt es unter [„Why are default values shared between objects?“](https://docs.python.org/3/faq/programming.html#why-are-default-values-shared-between-objects). Unveränderliche Standardwerte wie `0`, `"GET"` oder `None` sind unproblematisch.

  ## Gültigkeitsbereiche: die LEGB-Regel

  Liest eine Funktion einen Namen, sucht Python in dieser Reihenfolge ([Resolution of names](https://docs.python.org/3/reference/executionmodel.html#resolution-of-names)):

  1. **L**ocal – Namen, die in der Funktion gebunden werden (auch Parameter),
  2. **E**nclosing – Namen umschließender Funktionen,
  3. **G**lobal – Namen auf Modulebene,
  4. **B**uilt-in – `len`, `print`, `list` …

  Entscheidend: Ob ein Name lokal ist, legt der Compiler **für die ganze Funktion** fest. Wird ein Name irgendwo in der Funktion zugewiesen, ist er überall in ihr lokal – auch in Zeilen *vor* der Zuweisung. Daher kommt der `UnboundLocalError` ([FAQ](https://docs.python.org/3/faq/programming.html#why-am-i-getting-an-unboundlocalerror-when-the-variable-has-a-value)):

  ```python run fails
  anfragen = 0

  def zaehle_anfrage():
      anfragen += 1        # Zuweisung macht anfragen lokal -> UnboundLocalError
      return anfragen

  zaehle_anfrage()
  ```

  Mit [`global anfragen`](https://docs.python.org/3/reference/simple_stmts.html#the-global-statement) würde die Funktion die Modulvariable ändern – das funktioniert, macht Code aber schwer testbar. [`nonlocal`](https://docs.python.org/3/reference/simple_stmts.html#the-nonlocal-statement) erlaubt dasselbe für eine umschließende Funktion. So entsteht eine **Closure**: eine innere Funktion, die Namen ihrer Umgebung festhält.

  ```python run
  def erzeuge_zaehler():
      stand = 0
      def naechster():
          nonlocal stand       # stand gehört zur umschließenden Funktion
          stand += 1
          return stand
      return naechster

  ticket_nr = erzeuge_zaehler()
  rechnung_nr = erzeuge_zaehler()
  print(ticket_nr(), ticket_nr(), rechnung_nr())   # 1 2 1
  ```

  Jeder Aufruf von `erzeuge_zaehler` erzeugt ein neues `stand`; die beiden Zähler sind unabhängig. Beachte: Closures lesen den Wert eines Namens beim **Aufruf**, nicht beim Erzeugen. Das Modul Dekoratoren baut darauf auf.

  > [!TIP] Eingebaute Namen nicht überschreiben
  > `list = [1, 2]` oder `sum = 0` verdecken die eingebauten Funktionen im ganzen Modul. Der Fehler zeigt sich später als `TypeError: 'list' object is not callable`. Nimm sprechende Namen wie `tickets` oder `gesamt`.

  ## `lambda` und Rekursion

  Ein [`lambda`](https://docs.python.org/3/tutorial/controlflow.html#lambda-expressions) ist eine anonyme Funktion aus genau einem Ausdruck. Sinnvoll ist sie fast nur als kurzes Argument, typischerweise als `key` für [`sorted`](https://docs.python.org/3/library/functions.html#sorted), `min` oder `max`. Einem Namen zuweisen solltest du sie laut PEP 8 nicht – dafür gibt es `def`.

  ```python run
  tickets = [("Login-Bug", 1), ("Doku", 3), ("Absturz", 0)]
  print(sorted(tickets, key=lambda ticket: ticket[1]))   # nach Priorität
  print(max(tickets, key=lambda ticket: len(ticket[0]))) # längster Titel
  ```

  **Rekursion** – eine Funktion ruft sich selbst auf – passt zu Daten, die selbst rekursiv aufgebaut sind: Verzeichnisbäume, verschachteltes JSON, Kommentar-Threads. Jede rekursive Funktion braucht einen **Basisfall**, der ohne Selbstaufruf antwortet, und einen **rekursiven Fall**, der das Problem verkleinert.

  ```python run
  def groesse(eintrag):
      """Summiere Dateigrößen in einem verschachtelten Verzeichnis-Dict."""
      if isinstance(eintrag, int):          # Basisfall: eine Datei
          return eintrag
      gesamt = 0
      for kind in eintrag.values():         # rekursiver Fall: ein Ordner
          gesamt += groesse(kind)
      return gesamt

  projekt = {"src": {"main.py": 1200, "utils": {"io.py": 300}}, "README.md": 450}
  print(groesse(projekt))   # 1950
  ```

  Jeder Aufruf belegt einen eigenen Stack-Frame. CPython begrenzt die Tiefe (Standard: 1000, siehe [`sys.getrecursionlimit`](https://docs.python.org/3/library/sys.html#sys.getrecursionlimit)) und wirft darüber einen `RecursionError`. Eine Optimierung von Endrekursion gibt es nicht. Für Strukturen mit unbekannter, womöglich großer Tiefe – etwa eine lange verkettete Liste – ist eine Schleife deshalb die robustere Wahl.

  ## Häufige Fehler

  - **`x or standard` bei gültigen Nullwerten.** `0`, `""` oder `[]` werden ersetzt. Prüfe mit `is None`.
  - **Veränderlicher Standardwert.** `def f(daten=[])` teilt die Liste zwischen allen Aufrufen. Symptom: Ergebnisse „wachsen“ über Aufrufe hinweg. Lösung: `None` als Standard.
  - **`UnboundLocalError`.** Du liest einen Namen, dem die Funktion weiter unten etwas zuweist. Gib den Wert als Parameter hinein und als Ergebnis zurück, statt globalen Zustand zu ändern.
  - **Nackter Name im `case`.** Er fängt alles. Nimm Literale oder Konstanten mit Punkt.
  - **Liste verändern, während du über sie iterierst.** `for x in liste: liste.remove(x)` überspringt Elemente. Iteriere über eine Kopie oder baue eine neue Liste.
  - **Rekursion ohne erreichbaren Basisfall.** Endet mit `RecursionError: maximum recursion depth exceeded`.

  > [!PRAXIS]
  > In Code-Reviews fallen vor allem drei Dinge auf: veränderliche Standardwerte (ruff meldet sie als Regel B006), Boolean-Parameter ohne `*` – `sende(mail, True, False)` liest niemand ohne Doku – und Funktionen, die globalen Zustand ändern. Gute Python-Funktionen bekommen alles, was sie brauchen, als Parameter und geben ihr Ergebnis zurück. Solche Funktionen lassen sich ohne Aufwand mit pytest testen.

  ## Zusammenfassung

  - Jedes Objekt hat einen Wahrheitswert. Falsy sind `None`, `False`, Null und leere Sammlungen.
  - `and`/`or` liefern einen Operanden. `x or standard` ersetzt jeden falsy Wert.
  - `for` läuft über Elemente; `enumerate` und `zip` ersetzen Index-Schleifen. `else` an Schleifen läuft ohne `break`.
  - `match` (seit 3.10) prüft die Form von Daten und bindet Teile. Nackte Namen sind Capture-Muster.
  - Parameterarten: positional-only vor `/`, keyword-only nach `*`, `*args` als Tupel, `**kwargs` als Dictionary.
  - Standardwerte werden einmal ausgewertet – für Veränderliches `None` nehmen.
  - Namen werden nach LEGB aufgelöst; eine Zuweisung macht einen Namen in der ganzen Funktion lokal.
  - Rekursion braucht einen Basisfall; CPython begrenzt die Tiefe auf etwa 1000.
exercises:
  - id: parameter-aufrufe
    type: choice
    title: Welche Aufrufe sind erlaubt?
    prompt: Welche Aufrufe dieser Funktion laufen ohne `TypeError`?
    lang: python
    code: |
      def exportiere(daten, /, format="csv", *, ueberschreiben=False):
          ...
    options:
      - text: "`exportiere(rows, \"json\", ueberschreiben=True)`"
        correct: true
        why: "`daten` positional, `format` positional, `ueberschreiben` per Schlüsselwort – alles passt."
      - text: "`exportiere(rows, format=\"json\")`"
        correct: true
        why: "`format` steht zwischen `/` und `*` und darf positional oder per Schlüsselwort übergeben werden."
      - text: "`exportiere(daten=rows)`"
        correct: false
        why: "`daten` steht vor `/` und ist positional-only. Als Schlüsselwort gibt es einen `TypeError`."
      - text: "`exportiere(rows, \"json\", True)`"
        correct: false
        why: "`ueberschreiben` steht nach `*` und ist keyword-only. Ein drittes positionales Argument gibt es nicht."
    explanation: |
      `/` trennt die positional-only Parameter ab, `*` leitet die keyword-only Parameter ein. Dazwischen stehen normale Parameter, die beides erlauben. Das `*` erzwingt hier `ueberschreiben=True` – ein nacktes `True` beim Aufruf wäre ohne Blick in die Signatur unverständlich.
    resources:
      - title: Tutorial · Special parameters
        url: https://docs.python.org/3/tutorial/controlflow.html#special-parameters

  - id: passwort-pruefen-ordnen
    type: order
    title: Suchen mit for und else
    prompt: Bring die Zeilen so in Reihenfolge, dass die Funktion das erste verbotene Wort meldet und sonst „ok“ ausgibt. Die Einrückung gehört zur Zeile.
    lang: python
    lines: |
      def pruefe_passwort(passwort, verboten):
          for wort in verboten:
              if wort in passwort.lower():
                  print("enthält verbotenes Wort:", wort)
                  break
          else:
              print("ok")
    explanation: |
      Das `else` gehört zur `for`-Schleife, nicht zum `if` – erkennbar an der gleichen Einrückung wie `for`. Es läuft nur, wenn die Schleife ohne `break` durchläuft, also kein verbotenes Wort gefunden wurde. Das `print` muss vor dem `break` stehen, sonst würde es nie ausgeführt.
    resources:
      - title: Tutorial · else Clauses on Loops
        url: https://docs.python.org/3/tutorial/controlflow.html#else-clauses-on-loops

  - id: wahrheitswerte-vorhersagen
    type: output
    title: Was liefern and und or?
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      print(0 or "leer")
      print("" or None or "Gast")
      print([] and "nie")
      print(3 and 5)
      menge = 0
      print(menge or 10)
      print(bool("0"), bool(0.0), bool([0]))
    expected: |
      leer
      Gast
      []
      5
      10
      True False True
    explanation: |
      `or` liefert den ersten truthy Operanden oder den letzten; `and` den ersten falsy Operanden oder den letzten. Deshalb ergibt `3 and 5` die `5` und `[] and "nie"` die leere Liste. `menge or 10` ersetzt die gültige `0` durch `10` – die klassische Falle. `"0"` und `[0]` sind nicht leer und daher truthy.
    resources:
      - title: Sprachreferenz · Boolean operations
        url: https://docs.python.org/3/reference/expressions.html#boolean-operations
      - title: Truth Value Testing
        url: https://docs.python.org/3/library/stdtypes.html#truth-value-testing

  - id: schleifen-vorhersagen
    type: output
    title: continue, break und else
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      for zahl in [3, 7, 10, 12]:
          if zahl % 2:
              continue
          print("gerade:", zahl)
          if zahl > 9:
              break
      else:
          print("kein break")

      n = 0
      while n < 3:
          n += 1
      else:
          print("while fertig:", n)
    expected: |
      gerade: 10
      while fertig: 3
    explanation: |
      `3` und `7` sind ungerade (`zahl % 2` ist `1`, also truthy) und werden mit `continue` übersprungen. Bei `10` folgt die Ausgabe und dann `break` – deshalb läuft das `else` der `for`-Schleife nicht, und `12` wird nie erreicht. Die `while`-Schleife endet, weil ihre Bedingung falsch wird, nicht durch `break`; ihr `else` läuft also.
    resources:
      - title: Tutorial · break and continue Statements
        url: https://docs.python.org/3/tutorial/controlflow.html#break-and-continue-statements

  - id: standardwert-vorhersagen
    type: output
    title: Ein Standardwert mit Gedächtnis
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      def neuer_eintrag(text, log=[]):
          log.append(text)
          return log

      a = neuer_eintrag("start")
      b = neuer_eintrag("stopp")
      print(a)
      print(a is b)
      print(neuer_eintrag("neu", []))
      print(neuer_eintrag("ende"))
    expected: |
      ['start', 'stopp']
      True
      ['neu']
      ['start', 'stopp', 'ende']
    explanation: |
      Die Liste `[]` im Standardwert entsteht einmal, beim Ausführen von `def`. Beide Aufrufe ohne `log` hängen an dasselbe Objekt an und geben es zurück – `a` und `b` sind dieselbe Liste. Übergibt man eine eigene Liste, wird sie benutzt, der Standardwert bleibt unberührt. Der nächste Aufruf ohne `log` macht mit der alten Liste weiter.
    resources:
      - title: Tutorial · Default Argument Values
        url: https://docs.python.org/3/tutorial/controlflow.html#default-argument-values

  - id: befehle-matchen
    type: gap
    title: Ein kleiner Befehlsparser mit match
    prompt: |
      Ergänze die Muster. `start` und `run` sollen dasselbe tun, `log` braucht genau ein numerisches Argument, eine leere Eingabe hat einen eigenen Zweig, und der letzte Zweig fängt alles andere ab, ohne etwas zu binden.
    lang: python
    code: |
      def verarbeite(befehl: str) -> str:
          match befehl.split():
              case [⟦"start" | "run"⟧]:
                  return "starte"
              case ["log", ⟦anzahl⟧] if ⟦anzahl.isdigit()⟧:
                  return f"zeige {anzahl} Zeilen"
              case ⟦[]⟧:
                  return "leere Eingabe"
              case ⟦_⟧:
                  return f"unbekannt: {befehl}"
    gaps:
      - label: Oder-Muster
        hint: Zwei Literale, getrennt durch einen senkrechten Strich.
        accept:
          - '"run" | "start"'
      - label: Capture
        hint: Ein Name, der im Rumpf und im Guard benutzt wird.
      - label: Guard
        hint: "`str` hat eine Methode, die prüft, ob alle Zeichen Ziffern sind."
        accept:
          - anzahl.isdecimal()
          - anzahl.isnumeric()
      - label: Leere Sequenz
        hint: "`\"\".split()` liefert eine leere Liste."
        accept:
          - ()
      - label: Wildcard
        hint: Das Muster, das immer passt und nichts bindet.
    explanation: |
      `"start" | "run"` ist ein Oder-Muster aus zwei Literalen. `["log", anzahl]` passt auf Listen mit genau zwei Elementen, deren erstes `"log"` ist, und bindet das zweite an `anzahl`; der Guard `if anzahl.isdigit()` wird erst danach geprüft. `[]` passt nur auf leere Sequenzen, `_` auf alles, ohne einen Namen zu binden.
    resources:
      - title: Tutorial · match Statements
        url: https://docs.python.org/3/tutorial/controlflow.html#match-statements
      - title: PEP 636 – Structural Pattern Matching Tutorial
        url: https://peps.python.org/pep-0636/

  - id: signatur-ergaenzen
    type: gap
    title: Signaturen, die Fehler verhindern
    prompt: |
      Ergänze die Signaturen:

      1. `sende_mail`: `cc` und `dringend` dürfen **nur** per Schlüsselwort übergeben werden.
      2. `log`: nimmt beliebig viele Nachrichten positional und beliebig viele Zusatzfelder per Schlüsselwort.
      3. `normalisiere`: `wert` darf **nur** positional übergeben werden.
    lang: python
    code: |
      def sende_mail(empfaenger, betreff, ⟦*⟧, cc=None, dringend=False):
          ...

      def log(⟦*nachrichten⟧, ⟦**felder⟧):
          print(" ".join(nachrichten), felder)

      def normalisiere(wert, ⟦/⟧):
          return wert.strip().lower()

      sende_mail("team@example.com", "Release", dringend=True)
      log("Deploy", "fertig", dienst="api", dauer=42)
      normalisiere("  Hallo ")
    gaps:
      - label: keyword-only
        hint: Ein Zeichen, das alle folgenden Parameter keyword-only macht.
      - label: Positionale Sammlung
        hint: Ein Stern vor dem Namen.
      - label: Schlüsselwort-Sammlung
        hint: Zwei Sterne vor dem Namen.
      - label: positional-only
        hint: Das Zeichen steht **nach** den positional-only Parametern.
    explanation: |
      Ein nacktes `*` macht alle folgenden Parameter keyword-only, ohne Argumente zu sammeln. `*nachrichten` sammelt positionale Argumente als Tupel, `**felder` Schlüsselwort-Argumente als Dictionary. Ein `/` beendet die positional-only Parameter – `normalisiere(wert="x")` wäre dann ein `TypeError`.
    resources:
      - title: Tutorial · Special parameters
        url: https://docs.python.org/3/tutorial/controlflow.html#special-parameters
      - title: Tutorial · Arbitrary Argument Lists
        url: https://docs.python.org/3/tutorial/controlflow.html#arbitrary-argument-lists

  - id: router-mit-match
    type: code
    title: Ein Mini-Router mit match
    prompt: |
      Schreibe `route(methode, pfad)` für eine kleine REST-API. Der Pfad ist schon in Segmente zerlegt (`"/users/42"` → `["users", "42"]`). Benutze `match` auf dem Tupel `(methode, teile)`.

      | Anfrage | Ergebnis |
      | --- | --- |
      | `GET /health` | `"health"` |
      | `GET /users` | `"liste users"` |
      | `POST /users` | `"lege user an"` |
      | `GET /users/<id>` | `"zeige user <id>"` |
      | `DELETE /users/<id>` | `"lösche user <id>"` |
      | alles andere | `"404"` |

      `<id>` muss aus Ziffern bestehen (`str.isdigit()`), sonst `"404"`.
    lang: python
    starter: |
      def route(methode: str, pfad: str) -> str:
          teile = pfad.strip("/").split("/")
          match (methode, teile):
              case ("GET", ["health"]):
                  return "health"
              # weitere Fälle
          return "404"
    solution: |
      def route(methode: str, pfad: str) -> str:
          teile = pfad.strip("/").split("/")
          match (methode, teile):
              case ("GET", ["health"]):
                  return "health"
              case ("GET", ["users"]):
                  return "liste users"
              case ("POST", ["users"]):
                  return "lege user an"
              case ("GET", ["users", user_id]) if user_id.isdigit():
                  return f"zeige user {user_id}"
              case ("DELETE", ["users", user_id]) if user_id.isdigit():
                  return f"lösche user {user_id}"
              case _:
                  return "404"
    tests:
      - name: Health-Check
        code: assert route("GET", "/health") == "health"
      - name: Liste und Anlegen
        code: |
          assert route("GET", "/users") == "liste users", route("GET", "/users")
          assert route("POST", "/users") == "lege user an", route("POST", "/users")
      - name: Einzelner User
        code: |
          ergebnis = route("GET", "/users/42")
          assert ergebnis == "zeige user 42", f"bekommen {ergebnis!r}"
          ergebnis = route("DELETE", "/users/7")
          assert ergebnis == "lösche user 7", f"bekommen {ergebnis!r}"
      - name: Nicht-numerische ID ist 404
        code: |
          ergebnis = route("GET", "/users/abc")
          assert ergebnis == "404", f"bekommen {ergebnis!r}"
      - name: Falsche Methode oder unbekannter Pfad ist 404
        code: |
          assert route("DELETE", "/users") == "404"
          assert route("GET", "/admin") == "404"
          assert route("GET", "/users/1/posts") == "404"
    hints:
      - "Ein Sequenzmuster wie `[\"users\", user_id]` passt nur auf Listen mit genau zwei Elementen."
      - "Mit einem Guard `if user_id.isdigit()` hinter dem Muster prüfst du die ID."
    explanation: |
      Das Tupel `(methode, teile)` erlaubt Muster über beide Werte zugleich. Sequenzmuster prüfen die Länge mit – deshalb landet `/users/1/posts` im Wildcard-Zweig. Der Guard läuft erst, nachdem das Muster gepasst und `user_id` gebunden hat. Genau so arbeiten echte Router intern: Sie vergleichen Pfadsegmente mit Mustern und ziehen Parameter heraus.
    resources:
      - title: Sprachreferenz · The match statement
        url: https://docs.python.org/3/reference/compound_stmts.html#the-match-statement

  - id: header-standardwert-reparieren
    type: code
    title: Repariere den HTTP-Header-Bauer
    prompt: |
      `baue_header` soll für jeden Aufruf ein eigenes Header-Dictionary liefern. Im Betrieb schicken aber zwei Anfragen nacheinander denselben Token – der zweite Aufruf überschreibt den Header des ersten. Außerdem wird das übergebene `zusatz`-Dictionary verändert. Repariere die Funktion: Jeder Aufruf gibt ein neues Dictionary zurück, `zusatz` bleibt unverändert.
    lang: python
    starter: |
      def baue_header(token: str, zusatz: dict = {}) -> dict:
          zusatz["Authorization"] = f"Bearer {token}"
          return zusatz
    solution: |
      def baue_header(token: str, zusatz: dict | None = None) -> dict:
          header = {} if zusatz is None else dict(zusatz)
          header["Authorization"] = f"Bearer {token}"
          return header
    tests:
      - name: Zwei Aufrufe liefern unabhängige Header
        code: |
          h1 = baue_header("token-a")
          h2 = baue_header("token-b")
          assert h1 == {"Authorization": "Bearer token-a"}, f"h1 wurde verändert: {h1!r}"
          assert h1 is not h2, "beide Aufrufe liefern dasselbe Objekt"
      - name: Zusatzfelder werden übernommen
        code: |
          ergebnis = baue_header("t", {"Accept": "application/json"})
          assert ergebnis == {"Accept": "application/json", "Authorization": "Bearer t"}, f"bekommen {ergebnis!r}"
      - name: Das übergebene Dictionary bleibt unverändert
        code: |
          basis = {"Accept": "application/json"}
          baue_header("t", basis)
          assert basis == {"Accept": "application/json"}, f"zusatz wurde verändert: {basis!r}"
      - name: Der Standardwert bleibt leer
        code: |
          baue_header("x")
          ergebnis = baue_header("y")
          assert ergebnis == {"Authorization": "Bearer y"}, f"bekommen {ergebnis!r}"
    hints:
      - "Der Standardwert `{}` entsteht nur einmal, beim `def`."
      - "Nimm `None` als Standardwert und erzeuge im Rumpf ein neues Dictionary."
      - "`dict(zusatz)` erzeugt eine Kopie, die du gefahrlos verändern kannst."
    explanation: |
      Zwei Fehler, eine Ursache: Die Funktion verändert ein Objekt, das ihr nicht gehört. Beim Standardwert ist es das einmal erzeugte `{}`, das zwischen allen Aufrufen geteilt wird; bei übergebenem `zusatz` das Dictionary des Aufrufers. `None` als Standard plus eine Kopie mit `dict(zusatz)` löst beides. Die Prüfung mit `is None` statt `zusatz or {}` ist hier gleichwertig, drückt aber genauer aus, was gemeint ist.
    resources:
      - title: FAQ · Why are default values shared between objects?
        url: https://docs.python.org/3/faq/programming.html#why-are-default-values-shared-between-objects

  - id: zaehler-reparieren
    type: code
    title: Repariere den Ticket-Zähler
    prompt: |
      `erzeuge_zaehler(start)` soll eine Funktion liefern, die bei jedem Aufruf die nächste Ticketnummer zurückgibt: bei `start=100` also `101`, `102`, … Zwei Zähler sollen unabhängig voneinander zählen. Der erste Aufruf endet aber mit `UnboundLocalError`. Repariere den Code, ohne globale Variablen zu benutzen.
    lang: python
    starter: |
      def erzeuge_zaehler(start: int = 0):
          stand = start
          def naechster() -> int:
              stand += 1
              return stand
          return naechster
    solution: |
      def erzeuge_zaehler(start: int = 0):
          stand = start
          def naechster() -> int:
              nonlocal stand
              stand += 1
              return stand
          return naechster
    tests:
      - name: Zählt ab dem Startwert
        code: |
          zaehler = erzeuge_zaehler(100)
          werte = [zaehler(), zaehler(), zaehler()]
          assert werte == [101, 102, 103], f"bekommen {werte!r}"
      - name: Standardstart ist 0
        code: |
          zaehler = erzeuge_zaehler()
          assert zaehler() == 1
      - name: Zwei Zähler sind unabhängig
        code: |
          tickets = erzeuge_zaehler()
          rechnungen = erzeuge_zaehler(500)
          tickets()
          tickets()
          assert rechnungen() == 501, "rechnungen zählt mit tickets mit"
          assert tickets() == 3
    hints:
      - "`stand += 1` ist eine Zuweisung. Was bedeutet das für den Gültigkeitsbereich von `stand` in `naechster`?"
      - Ein Schlüsselwort erklärt einen Namen als zugehörig zur umschließenden Funktion.
    explanation: |
      Weil `naechster` dem Namen `stand` etwas zuweist, behandelt der Compiler ihn als lokal – das Lesen vor der ersten Zuweisung scheitert. `nonlocal stand` sagt: Dieser Name gehört zur umschließenden Funktion. Jeder Aufruf von `erzeuge_zaehler` erzeugt ein eigenes `stand`, deshalb sind die Zähler unabhängig. `global` wäre falsch: Alle Zähler würden sich eine Variable teilen.
    resources:
      - title: Sprachreferenz · The nonlocal statement
        url: https://docs.python.org/3/reference/simple_stmts.html#the-nonlocal-statement
      - title: FAQ · UnboundLocalError
        url: https://docs.python.org/3/faq/programming.html#why-am-i-getting-an-unboundlocalerror-when-the-variable-has-a-value

  - id: ordnergroesse-rekursiv
    type: code
    title: Größe eines Verzeichnisbaums
    prompt: |
      Ein Verzeichnisbaum ist als verschachteltes Dictionary gegeben: Schlüssel sind Namen, Werte sind entweder eine Dateigröße in Byte (`int`) oder ein weiteres Dictionary (ein Unterordner). Schreibe `gesamtgroesse(ordner)`, die rekursiv alle Dateigrößen summiert. Mit `ordner.values()` erhältst du die Werte eines Dictionaries.
    lang: python
    starter: |
      def gesamtgroesse(ordner: dict) -> int:
          ...
    solution: |
      def gesamtgroesse(ordner: dict) -> int:
          summe = 0
          for eintrag in ordner.values():
              if isinstance(eintrag, dict):
                  summe += gesamtgroesse(eintrag)
              else:
                  summe += eintrag
          return summe
    tests:
      - name: Flacher Ordner
        code: |
          assert gesamtgroesse({"a.txt": 10, "b.txt": 32}) == 42
      - name: Verschachtelt
        code: |
          baum = {"src": {"main.py": 1200, "utils": {"io.py": 300}}, "README.md": 450}
          ergebnis = gesamtgroesse(baum)
          assert ergebnis == 1950, f"erwartet 1950, bekommen {ergebnis!r}"
      - name: Leerer Ordner
        code: assert gesamtgroesse({}) == 0
      - name: Nur leere Unterordner
        code: |
          assert gesamtgroesse({"a": {"b": {"c": {}}}}) == 0
    hints:
      - "Basisfall: Ein Eintrag, der ein `int` ist, trägt seine Größe direkt bei."
      - "Rekursiver Fall: Für ein Dictionary rufst du `gesamtgroesse` selbst auf."
      - "`isinstance(eintrag, dict)` unterscheidet Ordner und Dateien."
    explanation: |
      Die Struktur ist rekursiv – ein Ordner enthält Ordner –, also ist es die Lösung auch. Der Basisfall ist die Datei, deren Größe direkt addiert wird. Für einen Unterordner liefert der rekursive Aufruf dessen Gesamtgröße. Ein leeres Dictionary ergibt `0`, weil die Schleife keinen Durchlauf hat. In echtem Code liefert `pathlib` den Baum; das Prinzip bleibt gleich.
    resources:
      - title: Tutorial · Defining Functions
        url: https://docs.python.org/3/tutorial/controlflow.html#defining-functions
      - title: Built-in isinstance()
        url: https://docs.python.org/3/library/functions.html#isinstance

  - id: status-match-bug
    type: bug
    title: Jeder Fehler ist „nicht gefunden“
    prompt: |
      Das Monitoring meldet für einen `500` vom Server „nicht gefunden“, und für `503` genauso. `200`, `201`, `301` und `302` werden richtig beschrieben. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      NICHT_GEFUNDEN = 404

      def beschreibe(status: int) -> str:
          match status:
              case 200 | 201:
                  return "erfolgreich"
              case 301 | 302:
                  return "umgeleitet"
              case NICHT_GEFUNDEN:
                  return "nicht gefunden"
          return "unbekannter Status"
    lines: [9]
    fix:
      - line: 9
        answers:
          - "case 404:"
          - "case HTTPStatus.NOT_FOUND:"
    explanation: |
      Ein nackter Name im `case` ist ein Capture-Muster: Er passt auf jeden Wert und bindet ihn an `NICHT_GEFUNDEN`. Weil der Zweig der letzte ist, meldet Python keinen `SyntaxError` – der Fehler bleibt still. Konstanten brauchen einen Punkt im Namen (`HTTPStatus.NOT_FOUND` nach `from http import HTTPStatus`), oder du schreibst das Literal `404`.
    resources:
      - title: Sprachreferenz · Capture patterns
        url: https://docs.python.org/3/reference/compound_stmts.html#the-match-statement
      - title: http.HTTPStatus
        url: https://docs.python.org/3/library/http.html#http.HTTPStatus

  - id: konfig-signatur-erklaeren
    type: explain
    title: Eine Signatur im Code-Review
    prompt: Du reviewst diese Funktion. Erkläre, was `/`, `*`, der Standardwert `None` und die Prüfung mit `is None` jeweils bewirken und warum sie so gewählt sind.
    lang: python
    code: |
      def lade_konfiguration(pfad, /, *, standardwerte=None, strikt=False):
          """Lies eine Konfigurationsdatei und ergänze fehlende Schlüssel."""
          if standardwerte is None:
              standardwerte = {}
          werte = lies_toml(pfad)
          for schluessel, wert in standardwerte.items():
              if schluessel not in werte:
                  if strikt:
                      raise KeyError(schluessel)
                  werte[schluessel] = wert
          return werte

      konfig = lade_konfiguration("app.toml", strikt=True)
    points:
      - "`/`: `pfad` ist positional-only – der Parametername gehört nicht zur API und kann umbenannt werden."
      - "`*`: `standardwerte` und `strikt` gehen nur per Schlüsselwort, Aufrufe wie `strikt=True` bleiben lesbar."
      - "`None` statt `{}` als Standard, weil Standardwerte einmal beim `def` ausgewertet und sonst zwischen Aufrufen geteilt würden."
      - "`is None` unterscheidet „nicht übergeben“ von einem übergebenen, aber leeren Dictionary."
      - Der Docstring beschreibt die Aufgabe und erscheint in `help()` und im Editor.
    explanation: |
      Das `/` macht `pfad` positional-only: Aufrufer können ihn nicht als `pfad=…` übergeben, also darf ich ihn später umbenennen, ohne jemanden zu brechen. Das `*` macht `standardwerte` und `strikt` keyword-only – `lade_konfiguration("app.toml", None, True)` ist verboten, `strikt=True` erklärt sich selbst. Der Standardwert `None` vermeidet die Falle mit veränderlichen Standardwerten: Ein `{}` in der Signatur entstünde nur einmal. Die Prüfung `is None` greift nur, wenn nichts übergeben wurde; ein bewusst übergebenes leeres Dictionary bleibt unangetastet. Der Docstring im Imperativ folgt PEP 257.
    resources:
      - title: Tutorial · Special parameters
        url: https://docs.python.org/3/tutorial/controlflow.html#special-parameters
      - title: PEP 257 – Docstring Conventions
        url: https://peps.python.org/pep-0257/
