lesson: |
  Du kennst TypeScript und etwas Kotlin. Python wirkt auf den ersten Blick vertraut: keine Semikolons, keine Typangaben, Einrückung statt geschweifter Klammern. Die ersten Stunden gehen schnell. Die ersten echten Bugs kommen trotzdem – und sie haben erstaunlich oft dieselbe Ursache: ein falsches Bild davon, was eine Variable in Python ist. Eine Funktion ändert „aus Versehen“ die Liste des Aufrufers. Ein Vergleich mit `is` funktioniert im Test und scheitert in Produktion. Ein Rechnungsbetrag ist um einen Cent daneben.

  Diese Lektion legt das Fundament: wie Python deinen Code ausführt, wie du ein Projekt sauber aufsetzt und – am wichtigsten – das Denkmodell **Namen zeigen auf Objekte**. Funktionen, Datenstrukturen und Klassen in den nächsten Modulen bauen darauf auf.

  ## Was Python ist: CPython, Bytecode und Typen

  „Python“ ist zuerst eine Sprachbeschreibung, die [Sprachreferenz](https://docs.python.org/3/reference/). Das Programm, das du von python.org oder über deinen Paketmanager installierst, heißt [CPython](https://docs.python.org/3/glossary.html#term-CPython): die in C geschriebene Referenzimplementierung. Wenn du `python3 app.py` startest, passiert Folgendes:

  1. CPython übersetzt den Quelltext in [Bytecode](https://docs.python.org/3/glossary.html#term-bytecode) – Anweisungen für eine virtuelle Maschine, keine Prozessorbefehle.
  2. Die virtuelle Maschine von CPython führt diesen Bytecode Anweisung für Anweisung aus.
  3. Für importierte Module legt CPython den Bytecode als `.pyc`-Datei im Ordner `__pycache__` ab. Beim nächsten Start entfällt die Übersetzung, solange sich die Quelldatei nicht geändert hat.

  Python ist also weder „rein interpretiert“ noch vorab kompiliert wie Kotlin oder Rust. Es gibt einen Übersetzungsschritt, aber er prüft nur die Syntax. Ob `preis * menge` sinnvoll ist, entscheidet sich erst, wenn die Zeile läuft. Mit dem Modul [`dis`](https://docs.python.org/3/library/dis.html) kannst du dir den Bytecode ansehen:

  ```python run
  import dis

  def brutto(netto):
      return netto * 1.19

  dis.dis(brutto)
  ```

  Die Ausgabe unterscheidet sich zwischen Python-Versionen – Bytecode ist ein Implementierungsdetail, kein stabiles Format.

  ### Dynamisch und stark typisiert

  Diese zwei Begriffe werden oft verwechselt, dabei beschreiben sie unabhängige Eigenschaften:

  - **Dynamisch typisiert:** Namen haben keinen Typ, nur Objekte. Derselbe Name darf nacheinander auf eine Zahl und auf einen String zeigen. Typen werden geprüft, wenn eine Operation ausgeführt wird, nicht vorher.
  - **Stark typisiert:** Python wandelt Typen nicht stillschweigend um. In JavaScript ergibt `"1" + 1` den String `"11"`. In Python gibt es einen `TypeError`.

  ```python run fails
  wert = 42        # wert zeigt auf ein int-Objekt
  wert = "42"      # jetzt auf ein str-Objekt – erlaubt, weil dynamisch
  print(type(wert))
  print(wert + 1)  # TypeError, weil stark typisiert
  ```

  Type Hints wie `def brutto(netto: float) -> float` gibt es auch, aber der Interpreter ignoriert sie zur Laufzeit. Geprüft werden sie von Werkzeugen wie mypy – das ist Thema im Modul Typisierung.

  ### Versionen und der Befehl `python3`

  Python erscheint jedes Jahr im Oktober in einer neuen Version; jede Version bekommt etwa fünf Jahre lang Updates ([Übersicht im Devguide](https://devguide.python.org/versions/)). Stand September 2026 ist **Python 3.14** aktuell, 3.15 folgt im Oktober. Viele Sprachmittel hängen an der Version: `match` gibt es seit 3.10, Typangaben wie `int | None` ebenfalls seit 3.10. Prüfe deshalb immer zuerst, welche Version läuft.

  ```console
  $ python3 --version
  Python 3.14.7
  ```

  Unter Linux und macOS heißt der Befehl meist `python3`. Einen Befehl `python` gibt es je nach System gar nicht, oder er zeigt ebenfalls auf Python 3 (etwa auf Arch-basierten Systemen) – [PEP 394](https://peps.python.org/pep-0394/) beschreibt die Regeln. Unter Windows startest du Python über den Launcher `py`. In einer aktivierten virtuellen Umgebung zeigen `python` und `python3` immer auf deren Interpreter.

  ## REPL, Skripte und virtuelle Umgebungen

  Startest du `python3` ohne Argumente, landest du im **REPL** (Read-Eval-Print-Loop, [Tutorial](https://docs.python.org/3/tutorial/interpreter.html)). Er wertet jede Eingabe sofort aus und zeigt das Ergebnis. Seit Python 3.13 hat der REPL [mehrzeiliges Bearbeiten und Farben](https://docs.python.org/3/whatsnew/3.13.html#a-better-interactive-interpreter), seit 3.14 auch Syntax-Highlighting. Nutze ihn, um schnell etwas auszuprobieren: `help(str.split)` zeigt die Dokumentation, `_` enthält das letzte Ergebnis, `exit` oder Strg+D beendet ihn.

  ```pycon
  >>> 7 / 2
  3.5
  >>> _ * 2
  7.0
  >>> type(_)
  <class 'float'>
  ```

  Für alles, was du behalten willst, schreibst du eine Datei und führst sie aus: `python3 bericht.py`. Mit [`python3 -m modulname`](https://docs.python.org/3/using/cmdline.html#cmdoption-m) führst du ein Modul als Programm aus – so rufst du `venv` und `pip` auf.

  ### Warum jedes Projekt eine virtuelle Umgebung braucht

  Projekt A braucht `requests` 2.31, Projekt B eine neuere Version, und das System-Python gehört deinem Betriebssystem, das seine eigenen Pakete darin verwaltet. Eine **virtuelle Umgebung** (venv) ist ein Ordner mit einem eigenen `site-packages`, in dem nur die Pakete dieses Projekts liegen. Viele Linux-Distributionen (Debian, Ubuntu, Arch) verweigern `pip install` außerhalb einer venv sogar mit dem Fehler `externally-managed-environment` ([PEP 668](https://peps.python.org/pep-0668/)).

  ```console
  $ cd ~/projekte/wetter-cli
  $ python3 -m venv .venv
  $ source .venv/bin/activate
  $ which python
  /home/steven/projekte/wetter-cli/.venv/bin/python
  $ python -m pip install requests
  $ deactivate
  ```

  In der fish-Shell aktivierst du mit `source .venv/bin/activate.fish`, unter Windows mit `.venv\Scripts\activate` ([Tabelle in der venv-Doku](https://docs.python.org/3/library/venv.html#how-venvs-work)).

  Was dabei passiert, ist unspektakulär: `.venv/bin/python` verweist auf den Basis-Interpreter, und eine Datei `pyvenv.cfg` sagt ihm, dass er `.venv/lib/.../site-packages` benutzen soll. Das Aktivieren stellt nur `.venv/bin` an den Anfang von `PATH`. Du könntest genauso `.venv/bin/python app.py` aufrufen – die Doku sagt ausdrücklich, dass Aktivieren nicht nötig ist.

  > [!TIP] `python -m pip` statt `pip`
  > `python -m pip install …` installiert garantiert in den Interpreter, den `python` gerade meint. Ein nacktes `pip` kann zu einer anderen Python-Installation gehören – eine klassische Ursache für „ich habe es doch installiert“.

  Eine venv ist ein Wegwerf-Artefakt: Sie kommt nicht in Git (`.venv/` in die `.gitignore`), und du kopierst sie nicht auf andere Rechner – laut [venv-Doku](https://docs.python.org/3/library/venv.html) ist sie weder verschiebbar noch kopierbar, du erzeugst sie am Zielort neu. Welche Pakete ein Projekt braucht, steht in `pyproject.toml` oder `requirements.txt`. In der Praxis übernimmt heute oft [uv](https://docs.astral.sh/uv/) diese Arbeit: Es legt die venv an, installiert Pakete sehr schnell und schreibt eine Lock-Datei. uv bekommt im Modul Tooling einen eigenen Abschnitt. Die Grundlagen hier brauchst du trotzdem – uv erzeugt dieselben venvs.

  ## Das Denkmodell: Namen zeigen auf Objekte

  Jeder Wert in Python ist ein **Objekt**: die Zahl `42`, der String `"Hallo"`, eine Liste, eine Funktion, sogar `None`. Jedes Objekt hat laut [Sprachreferenz](https://docs.python.org/3/reference/datamodel.html#objects-values-and-types) drei Eigenschaften:

  - **Identität** – bleibt während seiner ganzen Lebensdauer gleich. [`id(obj)`](https://docs.python.org/3/library/functions.html#id) liefert sie als Zahl (in CPython die Speicheradresse).
  - **Typ** – legt fest, welche Operationen erlaubt sind. `type(obj)` liefert ihn; er ändert sich nie.
  - **Wert** – bei *veränderlichen* (mutable) Objekten änderbar, bei *unveränderlichen* (immutable) nicht.

  Eine Variable ist deshalb kein Kasten, in dem ein Wert liegt, sondern ein **Name**, der an ein Objekt gebunden ist – wie ein Namensschild an einem Paket. Eine Zuweisung `x = …` kopiert nie etwas: Sie wertet die rechte Seite zu einem Objekt aus und hängt das Schild `x` daran ([Naming and binding](https://docs.python.org/3/reference/executionmodel.html#naming-and-binding)).

  ```python run
  a = ["Brot", "Milch"]
  b = a                # keine Kopie: ein zweites Schild am selben Objekt
  b.append("Eier")
  print(a)             # ['Brot', 'Milch', 'Eier']
  print(a is b)        # True: dieselbe Identität
  print(id(a) == id(b))
  ```

  Wer aus TypeScript kommt, kennt das von Objekten und Arrays. Der Unterschied: In Python ist *alles* ein Objekt, auch Zahlen. Dass sich `int` trotzdem wie ein „Wert“ anfühlt, liegt allein daran, dass `int`-Objekte unveränderlich sind.

  ### `==` oder `is`?

  - `==` vergleicht **Werte**: „Haben beide denselben Inhalt?“ Jeder Typ legt selbst fest, was gleich bedeutet.
  - `is` vergleicht **Identität**: „Ist es dasselbe Objekt?“ ([Identity comparisons](https://docs.python.org/3/reference/expressions.html#is-not))

  ```python run
  bestellung = [1, 2]
  kopie = [1, 2]
  print(bestellung == kopie)   # True: gleicher Inhalt
  print(bestellung is kopie)   # False: zwei verschiedene Listen

  ergebnis = None
  print(ergebnis is None)      # die richtige Art, auf None zu prüfen
  ```

  `is` brauchst du fast nur für Singletons – Objekte, von denen es genau eins gibt, vor allem `None`. [PEP 8](https://peps.python.org/pep-0008/#programming-recommendations) schreibt vor: Vergleiche mit `None` immer mit `is` oder `is not`.

  > [!WARNING] `is` bei Zahlen und Strings
  > CPython hält kleine Ganzzahlen (−5 bis 256) und manche Strings als gemeinsame Objekte vor. Deshalb ist `a is b` für `a = b = 100` scheinbar zuverlässig „wahr“ und für große Zahlen oder Strings aus einer Datei plötzlich nicht mehr. Das ist ein Implementierungsdetail, auf das du dich nie verlassen darfst. Seit Python 3.8 warnt der Compiler mit `SyntaxWarning: "is" with 'int' literal`, wenn du `is` mit einem Literal benutzt.

  ### Veränderlich oder unveränderlich

  | Unveränderlich (immutable) | Veränderlich (mutable) |
  | --- | --- |
  | `int`, `float`, `bool`, `str`, `tuple`, `bytes`, `frozenset`, `None` | `list`, `dict`, `set`, `bytearray`, die meisten eigenen Klassen |

  Bei unveränderlichen Objekten ist geteilter Besitz harmlos: Niemand kann das Objekt ändern. Jede „Änderung“ erzeugt ein neues Objekt und bindet den Namen neu. Bei veränderlichen Objekten sehen alle Namen jede Mutation. Das zeigt sich besonders bei `+=`:

  ```python run
  zaehler = 10
  vorher = id(zaehler)
  zaehler += 1                     # int: neues Objekt, der Name wird neu gebunden
  print(id(zaehler) == vorher)     # False

  tags = ["python"]
  alias = tags
  tags += ["web"]                  # list: += verändert das Objekt selbst
  print(alias)                     # ['python', 'web']

  tags = tags + ["api"]            # + erzeugt eine NEUE Liste
  print(alias)                     # ['python', 'web'] – alias sieht das nicht mehr
  ```

  ### Funktionen bekommen dieselben Objekte

  Beim Aufruf wird der Parameter an dasselbe Objekt gebunden, das der Aufrufer übergibt. Das [Tutorial](https://docs.python.org/3/tutorial/controlflow.html#defining-functions) nennt das „call by value, wobei der Wert immer eine Objektreferenz ist“ – in einer Fußnote schlägt es selbst „call by object reference“ als bessere Beschreibung vor.

  ```python run
  def archiviere(aufgaben):
      aufgaben.append("archiviert")   # Mutation: der Aufrufer sieht sie

  def leere(aufgaben):
      aufgaben = []                   # Neubindung: nur der lokale Name ändert sich

  meine = ["Rechnung schreiben"]
  archiviere(meine)
  leere(meine)
  print(meine)   # ['Rechnung schreiben', 'archiviert']
  ```

  > [!MERKE]
  > Zuweisung kopiert nie. **Mutation** (`append`, `+=` auf Listen, `d[k] = v`) ändert das Objekt – alle Namen, die darauf zeigen, sehen es. **Neubindung** (`x = …`) ändert nur, worauf *dieser eine* Name zeigt.

  Brauchst du eine unabhängige Liste, kopierst du ausdrücklich: `kopie = original.copy()` oder `list(original)`. Das ist eine *flache* Kopie; was das bei verschachtelten Listen heißt, klärt das Modul Datenstrukturen. Die FAQ beantwortet genau diese Frage unter [„Why did changing list y also change list x?“](https://docs.python.org/3/faq/programming.html#why-did-changing-list-y-also-change-list-x).

  > [!INTERVIEW] „Ist Python call by value oder call by reference?“
  > Weder noch im klassischen Sinn. Namen sind an Objekte gebunden, und beim Aufruf wird der Parameter an dasselbe Objekt gebunden – man sagt „call by object reference“ oder „call by sharing“. Verändert die Funktion ein mutables Objekt, sieht der Aufrufer das. Bindet sie ihren Parameter neu, merkt der Aufrufer nichts. Nenne ein Beispiel mit `append` gegenüber `liste = []` – dann ist die Antwort rund.

  ## Die eingebauten Grundtypen

  Die [numerischen Typen](https://docs.python.org/3/library/stdtypes.html#numeric-types-int-float-complex) verhalten sich anders als in TypeScript, wo es nur `number` gibt.

  **`int`** hat beliebige Genauigkeit. Es gibt keinen Überlauf, Python nimmt so viel Speicher wie nötig. Unterstriche machen lange Literale lesbar. Einzige Grenze in der Praxis: Die Umwandlung in einen String ist standardmäßig auf 4300 Ziffern begrenzt ([Integer string conversion length limitation](https://docs.python.org/3/library/stdtypes.html#int-max-str-digits)), als Schutz vor Denial-of-Service.

  ```python run
  print(2 ** 100)
  print(1_000_000 + 1)
  print(type(10), type(10.0), type("10"), type(True), type(None))
  ```

  **`float`** ist eine binäre Gleitkommazahl nach IEEE 754 mit doppelter Genauigkeit. Viele Dezimalbrüche wie 0,1 lassen sich binär nicht exakt darstellen, genauso wenig wie 1/3 dezimal. Das [Tutorial-Kapitel zu Gleitkommazahlen](https://docs.python.org/3/tutorial/floatingpoint.html) erklärt das ausführlich.

  ```python run
  import math
  from decimal import Decimal

  print(0.1 + 0.2)                        # 0.30000000000000004
  print(0.1 + 0.2 == 0.3)                 # False
  print(math.isclose(0.1 + 0.2, 0.3))     # True
  print(Decimal("0.1") + Decimal("0.2"))  # 0.3 – exakte Dezimalrechnung
  print(round(2.675, 2))                  # 2.67 – 2.675 ist intern etwas kleiner
  print(round(0.5), round(1.5), round(2.5))  # 0 2 2
  ```

  Die letzte Zeile überrascht fast alle: [`round`](https://docs.python.org/3/library/functions.html#round) rundet genau in der Mitte zur nächsten *geraden* Zahl („Banker's Rounding“). Für Geldbeträge heißt das: Rechne in Cent als `int` oder mit [`decimal.Decimal`](https://docs.python.org/3/library/decimal.html), und vergleiche Floats mit [`math.isclose`](https://docs.python.org/3/library/math.html#math.isclose) statt mit `==`.

  **`str`** ist eine unveränderliche Folge von Unicode-Zeichen. Methoden wie `upper()` liefern immer einen neuen String. Details folgen im Modul Strings und Dateien.

  **`bool`** ist eine [Unterklasse von `int`](https://docs.python.org/3/library/stdtypes.html#boolean-type-bool): `True` verhält sich wie `1`, `False` wie `0`. Das ist praktisch zum Zählen – `sum([True, False, True])` ergibt `2`.

  **`None`** ist das einzige Objekt vom Typ `NoneType` und steht für „kein Wert“. Eine Funktion ohne `return` gibt `None` zurück.

  ### Umwandlungen

  Weil Python stark typisiert ist, wandelst du ausdrücklich um. Das betrifft vor allem Daten von außen: Eingaben, Umgebungsvariablen, Kommandozeilenargumente und CSV-Felder sind **immer** Strings.

  ```python run
  print(int("42") + 1)      # 43
  print(int(3.99), int(-3.99))   # 3 -3: schneidet Richtung 0 ab
  print(float("1.5e3"))     # 1500.0
  print(int("ff", 16))      # 255
  print(str(8080) + "/tcp") # 8080/tcp
  print(bool(""), bool("False"), bool(0), bool([]))  # False True False False
  ```

  `int("3.7")` wirft dagegen einen `ValueError` – [`int()`](https://docs.python.org/3/library/functions.html#int) nimmt nur Ganzzahl-Strings. Und `bool("False")` ist `True`, weil jeder nicht leere String als wahr gilt. Mehr zu Wahrheitswerten im nächsten Modul.

  ## Operatoren: rechnen und vergleichen

  Die [arithmetischen Operatoren](https://docs.python.org/3/reference/expressions.html#binary-arithmetic-operations) haben ein paar Eigenheiten, die Kotlin- und TypeScript-Entwickler stolpern lassen:

  - `/` liefert **immer** einen `float`: `6 / 3` ist `2.0`.
  - `//` ist **Ganzzahldivision mit Abrunden** Richtung minus unendlich: `-7 // 2` ist `-4`. In Kotlin ergibt `-7 / 2` dagegen `-3`, weil dort Richtung 0 abgeschnitten wird.
  - `%` passt zu `//`: Das Ergebnis hat das Vorzeichen des *Divisors*. Es gilt immer `(a // b) * b + a % b == a`. Deshalb ist `-7 % 2` gleich `1` (in Kotlin und JavaScript `-1`).
  - [`divmod(a, b)`](https://docs.python.org/3/library/functions.html#divmod) liefert beides auf einmal als Tupel.
  - `**` ist die Potenz. Sie bindet [stärker als ein Minus links davon](https://docs.python.org/3/reference/expressions.html#the-power-operator) und wird von rechts nach links ausgewertet: `-2 ** 2` ist `-4`, `2 ** 3 ** 2` ist `2 ** 9`.

  ```python run
  print(7 / 2, 7 // 2, 7 % 2)     # 3.5 3 1
  print(-7 // 2, -7 % 2)          # -4 1
  print(divmod(125, 60))          # (2, 5): 2 Minuten, 5 Sekunden
  print(2 ** 3 ** 2, -2 ** 2)     # 512 -4

  heute = 0                       # 0 = Montag
  print((heute - 1) % 7)          # 6 = Sonntag: % bleibt im Bereich 0..6
  ```

  Die letzte Zeile zeigt, warum Pythons Definition nützlich ist: Mit `%` bleibst du bei Wochentagen, Ringpuffern oder Uhrzeiten immer im gültigen Bereich, auch wenn du rückwärts rechnest.

  **Vergleiche lassen sich verketten** ([Comparisons](https://docs.python.org/3/reference/expressions.html#comparisons)): `18 <= temperatur < 24` bedeutet `18 <= temperatur and temperatur < 24`, wobei `temperatur` nur einmal ausgewertet wird. Die logischen Operatoren heißen `and`, `or` und `not` – `&&` und `||` gibt es nicht.

  ## Ausgabe mit `print` und f-Strings

  [`print`](https://docs.python.org/3/library/functions.html#print) nimmt beliebig viele Argumente, trennt sie mit `sep` (Standard: Leerzeichen) und hängt `end` an (Standard: Zeilenumbruch). Für alles Formatierte nimmst du [f-Strings](https://docs.python.org/3/tutorial/inputoutput.html#formatted-string-literals): In geschweiften Klammern steht ein beliebiger Ausdruck, nach einem Doppelpunkt optional eine Formatangabe.

  ```python run
  name = "Steven"
  offene_tickets = 3
  laufzeit = 3.14159

  print("Hallo", name, "-", offene_tickets, "Tickets")
  print("a", "b", "c", sep=", ", end="!\n")
  print(f"{name} hat {offene_tickets} offene Tickets.")
  print(f"{offene_tickets * 2 = }")   # Ausdruck samt Ergebnis
  print(f"{laufzeit:.2f} s | {7:03d} | {name!r}")
  ```

  Drei Formatangaben reichen für den Anfang: `:.2f` für zwei Nachkommastellen, `:03d` für eine Ganzzahl mit führenden Nullen auf drei Stellen, `!r` für die `repr`-Darstellung. Das Modul Strings und Dateien vertieft die [Format-Mini-Sprache](https://docs.python.org/3/library/string.html#format-specification-mini-language).

  > [!TIP] Debuggen mit `f"{x=}"`
  > Seit Python 3.8 gibt `f"{port=}"` Name und Wert aus, und zwar mit `repr`: `port='8080'`. So siehst du sofort, ob `port` ein String oder eine Zahl ist – `print(port)` zeigt in beiden Fällen nur `8080`. Das spart bei Typfehlern viel Zeit.

  ## Stil: Einrückung, Kommentare und PEP 8

  In Python ist [Einrückung Syntax](https://docs.python.org/3/reference/lexical_analysis.html#indentation): Ein Block beginnt nach einem Doppelpunkt und reicht, solange die Zeilen tiefer eingerückt sind. Üblich sind vier Leerzeichen pro Ebene. Falsche Einrückung führt zu `IndentationError`, gemischte Tabs und Leerzeichen zu `TabError`. Kommentare beginnen mit `#` und erklären das *Warum*, nicht das *Was*.

  [PEP 8](https://peps.python.org/pep-0008/) ist der Stilstandard, den praktisch jedes Team erwartet. Die wichtigsten Regeln:

  - `snake_case` für Variablen und Funktionen, `CapWords` für Klassen, `UPPER_SNAKE_CASE` für Konstanten ([Naming Conventions](https://peps.python.org/pep-0008/#naming-conventions)).
  - Zwei Leerzeilen um Funktionen und Klassen auf oberster Ebene.
  - Zeilen bis 79 Zeichen laut PEP 8; viele Projekte erlauben 88 (Standard von Black und ruff).
  - `if x is None`, nicht `if x == None`.

  ```python run
  MAX_VERSUCHE = 3


  def verbleibende_versuche(fehlversuche):
      # max(), damit nach der Sperre nie eine negative Zahl erscheint
      return max(MAX_VERSUCHE - fehlversuche, 0)


  for fehlversuche in range(5):
      if fehlversuche >= MAX_VERSUCHE:
          print(fehlversuche, "gesperrt")
      else:
          print(fehlversuche, verbleibende_versuche(fehlversuche), "übrig")
  ```

  Niemand formatiert heute noch von Hand: `ruff format` und `ruff check` setzen PEP 8 automatisch durch. Das Modul Tooling zeigt die Einrichtung.

  ## Häufige Fehler

  - **`pip install` scheitert mit `externally-managed-environment`.** Du installierst ins System-Python. Lege eine venv an und aktiviere sie. `--break-system-packages` ist keine Lösung, sondern der Weg zu einem kaputten System.
  - **`ModuleNotFoundError`, obwohl das Paket installiert ist.** Das Skript läuft mit einem anderen Interpreter als dem, in den du installiert hast. Prüfe mit `which python` oder `python -c "import sys; print(sys.executable)"`, und installiere mit `python -m pip`.
  - **`is` statt `==`.** Klappt mit kleinen Zahlen, scheitert mit großen und mit Strings aus Dateien oder Datenbanken. `is` nur für `None`.
  - **Floats mit `==` vergleichen.** `0.1 + 0.2 == 0.3` ist `False`. Nimm `math.isclose`, Cent als `int` oder `Decimal`.
  - **Strings und Zahlen mischen.** `"8080" < 1024` wirft `TypeError: '<' not supported between instances of 'str' and 'int'`. Wandle Daten von außen direkt beim Einlesen um.
  - **Unbeabsichtigtes Aliasing.** `b = a` und danach `b.append(…)` ändert auch `a`. Kopiere ausdrücklich, wenn du eine unabhängige Liste brauchst.

  > [!PRAXIS]
  > In echten Projekten liegt `.venv/` in der `.gitignore`, die Abhängigkeiten stehen in `pyproject.toml`, und die CI baut die Umgebung bei jedem Lauf neu. In Code-Reviews fallen immer wieder dieselben Dinge auf: `== None` (ruff meldet das als Regel E711), `float` für Geldbeträge und Funktionen, die ihre Argumente still verändern. Letzteres ist besonders tückisch, weil der Fehler an einer ganz anderen Stelle sichtbar wird als dort, wo er entsteht.

  ## Zusammenfassung

  - CPython übersetzt Quelltext in Bytecode und führt ihn in einer virtuellen Maschine aus. Typfehler zeigen sich erst zur Laufzeit.
  - Python ist **dynamisch** (Namen haben keinen Typ) und **stark** typisiert (keine stillen Umwandlungen).
  - Jedes Projekt bekommt eine eigene venv: `python3 -m venv .venv`, aktivieren, `python -m pip install …`. Die venv kommt nicht in Git.
  - Namen zeigen auf Objekte. Zuweisung kopiert nie; Mutation sieht jeder, Neubindung betrifft nur einen Namen.
  - `==` vergleicht Werte, `is` Identität. `is` nur für `None` und andere Singletons.
  - `int` hat beliebige Genauigkeit, `float` ist binär und ungenau. Geld in Cent oder mit `Decimal`.
  - `/` liefert immer `float`, `//` rundet ab, `%` hat das Vorzeichen des Divisors, `**` bindet stark und von rechts.
  - f-Strings für Ausgaben, `f"{x=}"` zum Debuggen, PEP 8 für den Stil.
exercises:
  - id: namen-und-objekte
    type: choice
    title: Drei Namen, zwei Listen
    prompt: Welche Aussagen über diesen Code stimmen?
    lang: python
    code: |
      a = ["rot", "grün"]
      b = a
      c = ["rot", "grün"]
    options:
      - text: "`a == c` ist `True`, aber `a is c` ist `False`."
        correct: true
        why: Die Inhalte sind gleich (`==`), es sind aber zwei getrennt erzeugte Listen mit unterschiedlicher Identität.
      - text: "`b = a` erzeugt eine Kopie der Liste."
        correct: false
        why: Eine Zuweisung kopiert nie. `b` ist ein zweiter Name für dasselbe Objekt.
      - text: "`a.append(\"blau\")` verändert auch, was `b` zeigt."
        correct: true
        why: "`a` und `b` zeigen auf dasselbe Listenobjekt. Eine Mutation ist über jeden Namen sichtbar."
      - text: "`a.append(\"blau\")` verändert auch `c`, weil `c` denselben Inhalt hat."
        correct: false
        why: "`c` ist ein eigenes Objekt. Gleicher Inhalt bedeutet nicht gleiche Identität."
    explanation: |
      Eine Liste entsteht hier zweimal: in Zeile 1 und in Zeile 3. `b = a` erzeugt kein drittes Objekt, sondern bindet einen weiteren Namen an das erste. Deshalb gilt `a is b`, aber nicht `a is c`. `==` fragt nach dem Inhalt, `is` nach der Identität.
    resources:
      - title: Sprachreferenz · Objekte, Werte und Typen
        url: https://docs.python.org/3/reference/datamodel.html#objects-values-and-types
      - title: Sprachreferenz · Identity comparisons
        url: https://docs.python.org/3/reference/expressions.html#is-not

  - id: venv-reihenfolge
    type: order
    title: Ein neues Projekt aufsetzen
    prompt: Bring die Befehle in eine Reihenfolge, in der das Projekt sauber entsteht und `requests` in der venv landet – nicht im System-Python.
    lang: bash
    lines: |
      mkdir rechnungs-tool
      cd rechnungs-tool
      python3 -m venv .venv
      source .venv/bin/activate
      python -m pip install requests
      python -m pip freeze > requirements.txt
    explanation: |
      Erst den Ordner anlegen und hineinwechseln, dann die venv erzeugen. Aktivieren muss vor `pip install` passieren – sonst meint `python` das System-Python, und `pip` scheitert (PEP 668) oder installiert an die falsche Stelle. `pip freeze` kann erst etwas festhalten, wenn das Paket installiert ist.
    resources:
      - title: Tutorial · Virtuelle Umgebungen und Pakete
        url: https://docs.python.org/3/tutorial/venv.html

  - id: alias-und-neubindung
    type: output
    title: Wer sieht welche Änderung?
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      einkauf = ["Brot", "Milch"]
      liste = einkauf
      liste.append("Eier")
      liste = ["Kaffee"]
      liste.append("Tee")
      print(einkauf)
      print(liste)
    expected: |
      ['Brot', 'Milch', 'Eier']
      ['Kaffee', 'Tee']
    explanation: |
      Bis Zeile 3 zeigen `einkauf` und `liste` auf dasselbe Objekt; das `append` ist daher über beide Namen sichtbar. Zeile 4 ist eine Neubindung: `liste` zeigt ab jetzt auf eine neue Liste, `einkauf` bleibt, wo es war. Das zweite `append` trifft nur noch die neue Liste.
    hints:
      - Unterscheide Mutation (`append`) und Neubindung (`=`).
    resources:
      - title: FAQ · Why did changing list y also change list x?
        url: https://docs.python.org/3/faq/programming.html#why-did-changing-list-y-also-change-list-x

  - id: plus-gleich
    type: output
    title: "`+=` ist nicht gleich `= … +`"
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      a = [1, 2]
      b = a
      a += [3]
      print(b)
      a = a + [4]
      print(b)
      print(a)

      x = 5
      y = x
      x += 1
      print(y)
    expected: |
      [1, 2, 3]
      [1, 2, 3]
      [1, 2, 3, 4]
      5
    explanation: |
      Bei Listen verändert `+=` das bestehende Objekt (die Methode `__iadd__` arbeitet in place), deshalb sieht `b` die `3`. `a = a + [4]` baut dagegen eine neue Liste und bindet `a` neu – `b` zeigt weiter auf die alte. Bei `int` gibt es kein Verändern: `x += 1` erzeugt ein neues Objekt und bindet nur `x` neu, `y` bleibt `5`.
    hints:
      - "`list` ist veränderlich, `int` nicht."
      - "`+` erzeugt immer ein neues Objekt."
    resources:
      - title: Sprachreferenz · Augmented assignment statements
        url: https://docs.python.org/3/reference/simple_stmts.html#augmented-assignment-statements

  - id: operatoren-vorhersagen
    type: output
    title: Rechnen wie Python
    prompt: Was gibt dieses Programm aus? Achte auf negative Zahlen, Rangfolge und Rundung.
    lang: python
    code: |
      print(7 // 2, -7 // 2)
      print(-7 % 3)
      print(2 ** 3 ** 2)
      print(10 / 5)
      print(True + True)
      print(round(2.5), round(3.5))
      print(0.1 + 0.2 == 0.3)
    expected: |
      3 -4
      2
      512
      2.0
      2
      2 4
      False
    explanation: |
      `//` rundet Richtung minus unendlich, deshalb `-4`. `%` hat das Vorzeichen des Divisors: `-7 == -3 * 3 + 2`. `**` wird von rechts ausgewertet: `2 ** 9 == 512`. `/` liefert immer `float`. `bool` ist eine Unterklasse von `int`, also ist `True + True` gleich `2`. `round` rundet genau in der Mitte zur geraden Zahl. Und `0.1 + 0.2` ist binär nicht exakt `0.3`.
    resources:
      - title: Sprachreferenz · Binary arithmetic operations
        url: https://docs.python.org/3/reference/expressions.html#binary-arithmetic-operations
      - title: Built-in round()
        url: https://docs.python.org/3/library/functions.html#round

  - id: venv-anlegen
    type: command
    title: Eine venv anlegen
    prompt: Lege mit dem Modul `venv` aus der Standardbibliothek eine virtuelle Umgebung im Ordner `.venv` an.
    context: Du bist im Projektordner `~/projekte/rechnungs-tool`. Es ist noch keine venv aktiv.
    answers:
      - python3 -m venv .venv
      - python -m venv .venv
      - python3.14 -m venv .venv
      - python3 -m venv ./.venv
    explanation: |
      `-m venv` führt das Modul `venv` als Programm aus, das Argument ist der Zielordner. Der Name `.venv` ist Konvention: Viele Editoren und Werkzeuge (auch uv) erkennen ihn automatisch, und der Punkt versteckt den Ordner in `ls`. Außerhalb einer venv heißt der Befehl unter Linux meist `python3`.
    resources:
      - title: venv – Creation of virtual environments
        url: https://docs.python.org/3/library/venv.html

  - id: port-pruefen
    type: gap
    title: Port einlesen und prüfen
    prompt: |
      `port` kommt als String aus einer Konfiguration. Wandle ihn um, prüfe den gültigen Bereich 1 bis 65535 mit **einem verketteten Vergleich** und gib die Adresse mit einem f-String aus. Die letzte Zeile soll zum Debuggen `max_verbindungen=100` ausgeben.
    lang: python
    code: |
      host = "localhost"
      port = "8080"
      max_verbindungen = 100

      port_nummer = ⟦int(port)⟧
      if ⟦1 <= port_nummer <= 65535⟧:
          print(⟦f"{host}:{port_nummer}"⟧)
      print(⟦f"{max_verbindungen=}"⟧)
    gaps:
      - label: Umwandlung
        hint: Die eingebaute Funktion für Ganzzahlen heißt wie der Typ.
      - label: Verketteter Vergleich
        hint: "Mathematisch: untere Grenze ≤ Wert ≤ obere Grenze."
        accept:
          - 0 < port_nummer <= 65535
          - 1 <= port_nummer < 65536
          - 0 < port_nummer < 65536
          - 65535 >= port_nummer >= 1
      - label: Adresse
        hint: Zwei Ausdrücke in geschweiften Klammern, dazwischen ein Doppelpunkt.
        accept:
          - f"{host}:{port}"
      - label: Debug-Ausgabe
        hint: Ein Gleichheitszeichen direkt vor der schließenden Klammer.
    explanation: |
      `int(port)` wandelt ausdrücklich um – Python macht das nie von selbst. `1 <= port_nummer <= 65535` ist gleichbedeutend mit `1 <= port_nummer and port_nummer <= 65535`. In f-Strings steht jeder Ausdruck in `{}`; mit `=` am Ende (seit 3.8) erscheinen Ausdruck und `repr` des Werts.
    resources:
      - title: Sprachreferenz · Comparisons
        url: https://docs.python.org/3/reference/expressions.html#comparisons
      - title: Tutorial · Formatted String Literals
        url: https://docs.python.org/3/tutorial/inputoutput.html#formatted-string-literals

  - id: brutto-in-cent
    type: code
    title: Bruttopreis ohne Rundungsfehler
    prompt: |
      Ein Webshop speichert Preise in **Cent als `int`**, um Gleitkommafehler zu vermeiden. Schreibe `brutto_cent(netto_cent, steuersatz_prozent)`, die den Bruttopreis in Cent zurückgibt.

      - Kaufmännisch runden: ab einem halben Cent aufrunden (1188,5 → 1189).
      - Nur Ganzzahlarithmetik: kein `float`, kein `/`, kein `round`. Du brauchst `//`.
      - Das Ergebnis ist ein `int`.
    lang: python
    starter: |
      def brutto_cent(netto_cent: int, steuersatz_prozent: int) -> int:
          ...
    solution: |
      def brutto_cent(netto_cent: int, steuersatz_prozent: int) -> int:
          # netto * (100 + satz) / 100, plus einen halben Cent (50/100) zum Aufrunden
          return (netto_cent * (100 + steuersatz_prozent) + 50) // 100
    tests:
      - name: 10,00 € mit 19 %
        code: |
          ergebnis = brutto_cent(1000, 19)
          assert ergebnis == 1190, f"erwartet 1190, bekommen {ergebnis!r}"
      - name: Rundet auf (1188,81 → 1189)
        code: |
          ergebnis = brutto_cent(999, 19)
          assert ergebnis == 1189, f"erwartet 1189, bekommen {ergebnis!r}"
      - name: Genau ein halber Cent wird aufgerundet (178,5 → 179)
        code: |
          ergebnis = brutto_cent(150, 19)
          assert ergebnis == 179, f"erwartet 179, bekommen {ergebnis!r} – round() und float runden hier falsch"
      - name: 7 % ermäßigt
        code: |
          ergebnis = brutto_cent(1000, 7)
          assert ergebnis == 1070, f"erwartet 1070, bekommen {ergebnis!r}"
      - name: Ergebnis ist ein int
        code: |
          ergebnis = brutto_cent(1234, 19)
          assert type(ergebnis) is int, f"erwartet int, bekommen {type(ergebnis).__name__}"
          assert ergebnis == 1468, f"erwartet 1468, bekommen {ergebnis!r}"
    hints:
      - "Brutto = Netto × (100 + Satz) / 100. Ersetze `/` durch `//`."
      - "`//` rundet ab. Wenn du vorher die Hälfte des Divisors addierst, wird daraus kaufmännisches Runden."
    explanation: |
      `netto * (100 + satz)` ist der Bruttopreis in Hundertstel-Cent und bleibt exakt, weil `int` beliebig genau ist. Addierst du vor dem `// 100` noch `50` (einen halben Cent), wird aus Abrunden ein Aufrunden ab ,5. Mit `float` scheitert der dritte Test: `150 * 1.19` ist intern `178.49999…`, und `round` würde selbst bei exakt `178.5` zur geraden `178` runden.
    resources:
      - title: Tutorial · Floating-Point Arithmetic
        url: https://docs.python.org/3/tutorial/floatingpoint.html
      - title: Sprachreferenz · Binary arithmetic operations
        url: https://docs.python.org/3/reference/expressions.html#binary-arithmetic-operations

  - id: dauer-formatieren
    type: code
    title: Sekunden als Uhrzeit
    prompt: |
      Ein Build-Log soll Laufzeiten lesbar anzeigen. Schreibe `formatiere_dauer(sekunden)`, die eine Anzahl Sekunden als `"HH:MM:SS"` mit führenden Nullen zurückgibt.

      - `3725` → `"01:02:05"`
      - Stunden laufen über 24 hinaus weiter: `90000` → `"25:00:00"`
    lang: python
    starter: |
      def formatiere_dauer(sekunden: int) -> str:
          ...
    solution: |
      def formatiere_dauer(sekunden: int) -> str:
          minuten, sek = divmod(sekunden, 60)
          stunden, minuten = divmod(minuten, 60)
          return f"{stunden:02d}:{minuten:02d}:{sek:02d}"
    tests:
      - name: Eine Stunde, zwei Minuten, fünf Sekunden
        code: |
          ergebnis = formatiere_dauer(3725)
          assert ergebnis == "01:02:05", f"erwartet '01:02:05', bekommen {ergebnis!r}"
      - name: Null Sekunden
        code: |
          ergebnis = formatiere_dauer(0)
          assert ergebnis == "00:00:00", f"erwartet '00:00:00', bekommen {ergebnis!r}"
      - name: Knapp ein Tag
        code: |
          ergebnis = formatiere_dauer(86399)
          assert ergebnis == "23:59:59", f"erwartet '23:59:59', bekommen {ergebnis!r}"
      - name: Mehr als 24 Stunden
        code: |
          ergebnis = formatiere_dauer(90000)
          assert ergebnis == "25:00:00", f"erwartet '25:00:00', bekommen {ergebnis!r}"
      - name: Genau eine Minute
        code: |
          ergebnis = formatiere_dauer(60)
          assert ergebnis == "00:01:00", f"erwartet '00:01:00', bekommen {ergebnis!r}"
    hints:
      - "`divmod(a, b)` liefert `(a // b, a % b)` auf einmal."
      - "Erst Sekunden in Minuten und Rest zerlegen, dann Minuten in Stunden und Rest."
      - "`f\"{n:02d}\"` füllt eine Ganzzahl links mit Nullen auf zwei Stellen auf."
    explanation: |
      `divmod(sekunden, 60)` zerlegt in ganze Minuten und Restsekunden, ein zweites `divmod(minuten, 60)` in Stunden und Restminuten. Die Formatangabe `:02d` sorgt für führende Nullen. Weil die Stunden nicht mehr zerlegt werden, laufen sie über 24 hinaus – genau das will ein Log für lange Builds.
    resources:
      - title: Built-in divmod()
        url: https://docs.python.org/3/library/functions.html#divmod
      - title: Format Specification Mini-Language
        url: https://docs.python.org/3/library/string.html#format-specification-mini-language

  - id: zahlungsabgleich-reparieren
    type: code
    title: Repariere den Zahlungsabgleich
    prompt: |
      Die Buchhaltung meldet: Rechnungen über 0,30 € gelten als offen, obwohl zwei Zahlungen über 0,10 € und 0,20 € eingegangen sind. Auch zehn Zahlungen à 0,10 € begleichen eine Rechnung über 1,00 € angeblich nicht. Repariere `ist_bezahlt`, sodass die Summe mit einer kleinen Toleranz verglichen wird.
    lang: python
    starter: |
      def ist_bezahlt(rechnungsbetrag: float, zahlungen: list[float]) -> bool:
          return sum(zahlungen) == rechnungsbetrag
    solution: |
      import math


      def ist_bezahlt(rechnungsbetrag: float, zahlungen: list[float]) -> bool:
          return math.isclose(sum(zahlungen), rechnungsbetrag)
    tests:
      - name: 0,10 € + 0,20 € begleichen 0,30 €
        code: assert ist_bezahlt(0.3, [0.1, 0.2]) is True, "0.1 + 0.2 sollte als 0.3 gelten"
      - name: Zehn mal 0,10 € begleichen 1,00 €
        code: assert ist_bezahlt(1.0, [0.1] * 10) is True, "sum([0.1] * 10) ist 0.9999999999999999"
      - name: Ein Cent zu wenig ist nicht bezahlt
        code: assert ist_bezahlt(100.0, [50.0, 49.99]) is False, "49,99 + 50,00 ist nicht 100,00"
      - name: Exakte Beträge funktionieren weiter
        code: assert ist_bezahlt(10.0, [2.5, 2.5, 5.0]) is True
    hints:
      - Der Vergleich mit `==` ist das Problem, nicht die Summe.
      - "Das Modul `math` hat eine Funktion für „fast gleich“."
    explanation: |
      `0.1`, `0.2` und `0.3` sind binär nicht exakt darstellbar; die Summe weicht in der 17. Stelle ab, und `==` vergleicht bitgenau. `math.isclose` prüft stattdessen, ob der Unterschied relativ zur Größe der Zahlen winzig ist (Standard: `rel_tol=1e-09`). Die dauerhafte Lösung in echten Systemen ist trotzdem, Geld gar nicht als `float` zu speichern, sondern in Cent als `int` oder als `Decimal`.
    resources:
      - title: math.isclose()
        url: https://docs.python.org/3/library/math.html#math.isclose
      - title: Tutorial · Floating-Point Arithmetic
        url: https://docs.python.org/3/tutorial/floatingpoint.html

  - id: tags-ohne-nebenwirkung
    type: code
    title: Keine Überraschung für den Aufrufer
    prompt: |
      `mit_standard_tag` soll eine Liste zurückgeben, die alle übergebenen Tags und zusätzlich `"python"` enthält. Im Einsatz verändert sie aber die Liste des Aufrufers – nach dem zweiten Aufruf steht `"python"` zweimal in den Projektdaten. Korrigiere die Funktion so, dass die übergebene Liste unverändert bleibt.
    lang: python
    starter: |
      def mit_standard_tag(tags: list[str]) -> list[str]:
          ergebnis = tags
          ergebnis.append("python")
          return ergebnis
    solution: |
      def mit_standard_tag(tags: list[str]) -> list[str]:
          ergebnis = tags.copy()
          ergebnis.append("python")
          return ergebnis
    tests:
      - name: Ergebnis enthält alle Tags und "python"
        code: |
          ergebnis = mit_standard_tag(["web", "api"])
          assert ergebnis == ["web", "api", "python"], f"bekommen {ergebnis!r}"
      - name: Die übergebene Liste bleibt unverändert
        code: |
          projekt_tags = ["web"]
          mit_standard_tag(projekt_tags)
          mit_standard_tag(projekt_tags)
          assert projekt_tags == ["web"], f"die Liste des Aufrufers wurde verändert: {projekt_tags!r}"
      - name: Ergebnis ist ein neues Objekt
        code: |
          projekt_tags = ["web"]
          assert mit_standard_tag(projekt_tags) is not projekt_tags, "die Funktion gibt dasselbe Objekt zurück, das sie bekommen hat"
      - name: Leere Liste
        code: assert mit_standard_tag([]) == ["python"]
    hints:
      - "`ergebnis = tags` erzeugt keine neue Liste."
      - "`tags.copy()`, `list(tags)` oder `tags + [\"python\"]` erzeugen eine neue Liste."
    explanation: |
      `ergebnis = tags` bindet nur einen zweiten Namen an dieselbe Liste, das `append` verändert also das Objekt des Aufrufers. Mit `tags.copy()` (oder `list(tags)`, oder direkt `return tags + ["python"]`) entsteht eine neue Liste. Faustregel für Code-Reviews: Eine Funktion, die etwas zurückgibt, sollte ihre Argumente nicht verändern – sonst erwartet der Aufrufer das eine und bekommt beides.
    resources:
      - title: FAQ · How do I write a function with output parameters?
        url: https://docs.python.org/3/faq/programming.html#how-do-i-write-a-function-with-output-parameters-call-by-reference

  - id: port-aus-umgebung
    type: bug
    title: Der Server startet nicht
    prompt: |
      Beim Start bricht das Programm ab:

      ```text
      TypeError: '<' not supported between instances of 'str' and 'int'
      ```

      Der Traceback zeigt auf Zeile 4, die Ursache liegt aber in einer anderen Zeile. Finde sie und korrigiere sie so, dass `port` im **ganzen** Programm eine Zahl ist.
    lang: python
    code: |
      import os

      port = os.environ.get("PORT", "8000")
      if port < 1024:
          print("Ports unter 1024 brauchen Root-Rechte")
      print(f"Starte Server auf Port {port}")
    lines: [3]
    fix:
      - line: 3
        answers:
          - port = int(os.environ.get("PORT", "8000"))
          - port = int(os.environ.get("PORT", 8000))
          - port = int(os.getenv("PORT", "8000"))
          - port = int(os.getenv("PORT", 8000))
    explanation: |
      Umgebungsvariablen sind immer Strings, und Python wandelt beim Vergleich mit `1024` nicht stillschweigend um – es ist stark typisiert. Der Fehler zeigt sich in Zeile 4, entstanden ist er in Zeile 3. Wandelst du direkt beim Einlesen mit `int(…)` um, ist `port` überall eine Zahl. Ein `int(port)` nur in Zeile 4 würde das Symptom beheben, aber jede spätere Rechnung mit `port` wieder angreifbar lassen.
    resources:
      - title: os.environ
        url: https://docs.python.org/3/library/os.html#os.environ
      - title: Built-in int()
        url: https://docs.python.org/3/library/functions.html#int

  - id: preise-erklaeren
    type: explain
    title: Was passiert mit netto und satz?
    prompt: Das Programm gibt `True 1.19` aus. Erkläre, warum `netto` danach die Bruttopreise enthält, warum `satz` trotz `faktor = 1` unverändert ist und wie du die Funktion umbauen würdest.
    lang: python
    code: |
      def mit_steuer(preise, faktor):
          for i in range(len(preise)):
              preise[i] = preise[i] * faktor
          faktor = 1
          return preise

      netto = [10.0, 20.0]
      satz = 1.19
      brutto = mit_steuer(netto, satz)
      print(netto is brutto, satz)
    points:
      - "`preise` wird an dasselbe Listenobjekt gebunden wie `netto`; es gibt keine Kopie."
      - "`preise[i] = …` verändert das Objekt selbst (Mutation), deshalb sieht der Aufrufer die neuen Werte."
      - "`faktor = 1` bindet nur den lokalen Namen neu; `satz` zeigt weiter auf `1.19`."
      - "Die Funktion gibt dasselbe Objekt zurück, deshalb ist `netto is brutto` wahr."
      - Besser ist eine neue Liste aufzubauen und zurückzugeben, statt die übergebene zu verändern.
    explanation: |
      Beim Aufruf werden `preise` und `faktor` an dieselben Objekte gebunden wie `netto` und `satz`. Die Zuweisung `preise[i] = …` ist eine Mutation der Liste – über `netto` ist sie genauso sichtbar. `faktor = 1` dagegen ist eine Neubindung des lokalen Namens; das `float`-Objekt `1.19` bleibt unberührt, und `satz` zeigt weiter darauf. Weil `return preise` dasselbe Objekt zurückgibt, sind `netto` und `brutto` zwei Namen für eine Liste. Sauberer wäre, eine neue Liste aufzubauen (zum Beispiel mit einer Schleife und `append`) und die Eingabe unverändert zu lassen.
    resources:
      - title: Tutorial · Defining Functions
        url: https://docs.python.org/3/tutorial/controlflow.html#defining-functions

  - id: eigenes-projekt
    type: practice
    title: Dein erstes Projekt auf dem eigenen Rechner
    prompt: |
      Richte auf deinem Rechner ein kleines Projekt `ticket-report` ein und bring ein Skript zum Laufen:

      1. Ordner anlegen, venv erzeugen und aktivieren (in fish: `activate.fish`).
      2. Mit `which python` und `python --version` prüfen, dass die venv aktiv ist.
      3. Das Paket `rich` installieren.
      4. Eine `.gitignore` mit `.venv/` anlegen.
      5. Ein Skript `report.py` schreiben, das für drei Tickets (Titel, Stunden als `float`) die Summe der Stunden mit zwei Nachkommastellen ausgibt und zum Debuggen einmal `f"{summe=}"` benutzt. Mit `from rich import print` wird die Ausgabe farbig.
      6. Das Skript mit dem Python der venv ausführen.
    lang: bash
    solution: |
      mkdir -p ~/projekte/ticket-report
      cd ~/projekte/ticket-report
      python3 -m venv .venv
      source .venv/bin/activate          # fish: source .venv/bin/activate.fish
      which python                       # …/ticket-report/.venv/bin/python
      python --version
      python -m pip install rich
      echo ".venv/" > .gitignore

      cat > report.py <<'EOF'
      from rich import print

      tickets = [("Login-Bug", 1.5), ("API-Doku", 2.25), ("Review", 0.75)]
      summe = 0.0
      for titel, stunden in tickets:
          print(f"{titel:<12} {stunden:>5.2f} h")
          summe += stunden
      print(f"{summe=}")
      print(f"Gesamt: {summe:.2f} h")
      EOF

      python report.py
    checklist:
      - "`which python` zeigt auf `.venv/bin/python` in deinem Projektordner."
      - "`rich` ist mit `python -m pip install` in der venv installiert, nicht global."
      - Die `.gitignore` enthält `.venv/`.
      - Das Skript gibt die Summe mit zwei Nachkommastellen aus und nutzt `f"{summe=}"`.
      - Nach `deactivate` scheitert `python report.py` mit `ModuleNotFoundError` – du weißt, warum.
    explanation: |
      Der letzte Punkt ist der wichtigste: Nach `deactivate` meint `python` wieder das System-Python, in dem `rich` nicht installiert ist. Genau diesen Fehler siehst du in Projekten ständig, wenn Editor, Terminal oder CI einen anderen Interpreter benutzen als gedacht. `which python` und `sys.executable` sind deine ersten Werkzeuge, um das zu klären.
    resources:
      - title: venv · How venvs work
        url: https://docs.python.org/3/library/venv.html#how-venvs-work
      - title: Installing Python Modules
        url: https://docs.python.org/3/installing/index.html
