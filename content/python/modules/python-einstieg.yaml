summary: Wie Python deinen Code ausführt, wie du ein Projekt sauber aufsetzt – und das Denkmodell „Namen zeigen auf Objekte“, auf dem alles Weitere aufbaut.
goals:
  - Du erklärst, was CPython mit deinem Quelltext macht und was „dynamisch und stark typisiert“ bedeutet.
  - Du legst eine virtuelle Umgebung an, aktivierst sie und installierst Pakete darin.
