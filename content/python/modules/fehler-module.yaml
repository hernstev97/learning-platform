id: fehler-module
title: Fehlerbehandlung, Module & Logging
level: 2
minutes: 230
summary: Exceptions gezielt fangen, verketten und als eigene Hierarchie anbieten, verstehen, was `import` wirklich tut, Projekte sauber aufteilen – und mit `logging` statt `print` nachvollziehbar machen, was passiert.
goals:
  - Du erklärst die Ausnahme-Hierarchie (`BaseException` vs. `Exception`) und sagst voraus, wann `except`, `else` und `finally` laufen.
  - Du fängst gezielt, verkettest mit `raise … from …` und entwirfst eine eigene Exception-Hierarchie für eine Bibliothek.
  - Du wählst begründet zwischen EAFP und LBYL und räumst mit `finally` und `with` zuverlässig auf.
  - Du erklärst, dass Module einmal ausgeführt und in `sys.modules` gecacht werden, und löst zirkuläre Importe auf.
  - Du strukturierst ein Projekt mit Paketen, `if __name__ == "__main__":` und src-Layout und loggst mit `getLogger(__name__)`.
  - Du konfigurierst Logging mit `dictConfig`, sagst die Wirkung von Logger-Level, Handler-Level und Propagation voraus und erklärst, warum Bibliotheken nur einen `NullHandler` setzen.
