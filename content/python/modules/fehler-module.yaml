lesson: |
  Ein nächtlicher Import-Job bricht ab. Im Log steht nur `Fehler beim Import`, weil irgendwo ein `except Exception: print("Fehler beim Import")` alles verschluckt hat – den Tippfehler im Code genauso wie die fehlende Datei. Niemand weiß, welche Datei, welche Zeile, welche Ursache. Gute Fehlerbehandlung ist das Gegenteil davon: Sie fängt nur, was sie sinnvoll behandeln kann, erhält die Ursache und meldet den Rest laut.

  Dieses Modul behandelt drei Dinge, die in jedem echten Python-Projekt zusammenspielen: Exceptions, die Aufteilung in Module und Pakete und Logging. Grundlage sind das Tutorial zu [Errors and Exceptions](https://docs.python.org/3/tutorial/errors.html), zu [Modules](https://docs.python.org/3/tutorial/modules.html) und das [Logging HOWTO](https://docs.python.org/3/howto/logging.html).

  ## Die Ausnahme-Hierarchie

  Exceptions sind normale Objekte, ihre Klassen bilden eine [Hierarchie](https://docs.python.org/3/library/exceptions.html#exception-hierarchy). Ein `except` fängt die genannte Klasse **und alle Unterklassen**:

  ```text
  BaseException
   ├── KeyboardInterrupt        ← Strg+C
   ├── SystemExit               ← sys.exit()
   ├── GeneratorExit
   └── Exception                ← alles, was ein Programm normalerweise behandelt
        ├── ArithmeticError → ZeroDivisionError, …
        ├── LookupError → KeyError, IndexError
        ├── OSError → FileNotFoundError, PermissionError, TimeoutError, …
        ├── TypeError, ValueError, AttributeError, …
        └── ExceptionGroup
  ```

  Die Trennung ist Absicht: `KeyboardInterrupt` und `SystemExit` sind keine Fehler, sondern Bitten, das Programm zu beenden. [`Exception`](https://docs.python.org/3/library/exceptions.html#Exception) ist deshalb die Basis für alles Eigene und die breiteste Klasse, die du je fangen solltest. Ein nacktes `except:` fängt dagegen [`BaseException`](https://docs.python.org/3/library/exceptions.html#BaseException) – das Programm lässt sich dann nicht einmal mehr mit Strg+C abbrechen.

  Ein Traceback liest du **von unten nach oben**: Die letzte Zeile nennt Typ und Nachricht, darüber steht die Zeile, in der die Exception entstand, darüber die Aufrufkette bis zum Einstiegspunkt.

  ## `try`, `except`, `else`, `finally`

  ```python run
  import json

  def lade(text: str) -> dict:
      try:
          daten = json.loads(text)              # nur, was fehlschlagen kann
      except json.JSONDecodeError as fehler:
          print(f"  except: kaputtes JSON in Zeile {fehler.lineno}")
          return {}
      else:
          print("  else: nur ohne Exception")
          return daten
      finally:
          print("  finally: immer, auch nach return")

  print(lade('{"port": 8080}'))
  print(lade("{port: 8080}"))
  ```

  Die Regeln aus der [Sprachreferenz zu `try`](https://docs.python.org/3/reference/compound_stmts.html#the-try-statement):

  - `except` läuft, wenn im `try`-Block eine passende Exception auftritt. Mehrere `except`-Klauseln werden von oben nach unten geprüft, die erste passende gewinnt – spezielle Klassen also vor allgemeinen.
  - `else` läuft nur, wenn der `try`-Block **ohne** Exception durchläuft. Code dort ist nicht mehr vom `except` geschützt. So hältst du den `try`-Block klein und fängst nicht aus Versehen Fehler aus Folgecode.
  - `finally` läuft **immer**: nach Erfolg, nach einer behandelten oder unbehandelten Exception und auch, wenn `try` oder `except` mit `return` verlassen wird.

  Mehrere Typen fängst du mit einem Tupel: `except (KeyError, ValueError) as fehler:`. Seit Python 3.14 sind die Klammern ohne `as` optional ([PEP 758](https://peps.python.org/pep-0758/)); mit Klammern ist der Code auch für ältere Versionen gültig.

  > [!WARNING] `return` in `finally`
  > Ein `return`, `break` oder `continue` in `finally` verschluckt eine laufende Exception still. Python 3.14 warnt deshalb mit `SyntaxWarning` ([PEP 765](https://peps.python.org/pep-0765/)). In `finally` gehört nur Aufräumcode.

  ## Ausnahmen auslösen und verketten

  Mit [`raise`](https://docs.python.org/3/reference/simple_stmts.html#the-raise-statement) löst du eine Exception aus. Ein nacktes `raise` in einem `except`-Block wirft die gerade behandelte Exception unverändert weiter – nützlich, wenn du nur loggen oder aufräumen willst.

  Oft übersetzt du einen technischen Fehler in einen fachlichen: Aus `KeyError: 'port'` wird „Konfiguration unvollständig“. Dabei soll die Ursache nicht verloren gehen. Dafür gibt es [Exception Chaining](https://docs.python.org/3/tutorial/errors.html#exception-chaining):

  ```python run
  class KonfigFehler(Exception):
      pass

  def lade_port(konfig: dict) -> int:
      try:
          return int(konfig["port"])
      except KeyError as fehler:
          raise KonfigFehler("Einstellung 'port' fehlt") from fehler

  try:
      lade_port({"host": "db"})
  except KonfigFehler as e:
      print(repr(e))
      print("Ursache:", repr(e.__cause__))
  ```

  | Form | `__cause__` | Traceback zeigt |
  | --- | --- | --- |
  | `raise Neu(...)` im `except`-Block | `None` (aber `__context__` ist gesetzt) | „During handling of the above exception, another exception occurred“ – wirkt wie ein zweiter Fehler |
  | `raise Neu(...) from fehler` | `fehler` | „The above exception was the direct cause of …“ – bewusste Übersetzung |
  | `raise Neu(...) from None` | `None`, Kontext unterdrückt | nur die neue Exception |

  `__context__` setzt Python immer automatisch, wenn während der Behandlung eine neue Exception entsteht. `from` macht die Verbindung explizit, `from None` blendet sie aus – sinnvoll, wenn die Ursache ein Implementierungsdetail ist, das den Aufrufer nur verwirrt ([Exception context](https://docs.python.org/3/library/exceptions.html#exception-context)). Seit 3.11 kannst du einer Exception außerdem mit [`add_note()`](https://docs.python.org/3/library/exceptions.html#BaseException.add_note) Kontext anhängen, bevor du sie mit `raise` weiterwirfst.

  ## Eigene Exceptions für eine Bibliothek

  Eine Bibliothek definiert **eine Basisklasse** und darunter spezifische Fehler. Aufrufer können dann wählen: alles der Bibliothek fangen oder gezielt einen Fall.

  ```python run
  class ZahlungsFehler(Exception):
      """Basis für alle Fehler dieses Pakets."""

  class KarteAbgelehnt(ZahlungsFehler):
      def __init__(self, grund: str) -> None:
          super().__init__(f"Karte abgelehnt: {grund}")
          self.grund = grund

  class AnbieterNichtErreichbar(ZahlungsFehler):
      def __init__(self, versuch_in_s: int) -> None:
          super().__init__(f"Anbieter nicht erreichbar, neuer Versuch in {versuch_in_s} s")
          self.versuch_in_s = versuch_in_s

  for fehler in [KarteAbgelehnt("Limit überschritten"), AnbieterNichtErreichbar(30)]:
      try:
          raise fehler
      except KarteAbgelehnt as e:
          print("Kunde informieren:", e.grund)
      except ZahlungsFehler as e:
          print("Später erneut versuchen:", e)
  ```

  Regeln aus dem Tutorial ([User-defined Exceptions](https://docs.python.org/3/tutorial/errors.html#user-defined-exceptions)): von `Exception` erben, Namen auf `Error` bzw. hier „Fehler“ enden lassen, `super().__init__(nachricht)` aufrufen, damit `str(e)` sinnvoll ist, und Details als Attribute ablegen, damit Aufrufer nicht die Nachricht parsen müssen. Eigene Klassen lohnen sich, wenn Aufrufer **unterschiedlich reagieren** sollen; für „falscher Wert“ reicht oft `ValueError`.

  ## EAFP, LBYL und Aufräumen

  Python bevorzugt [EAFP](https://docs.python.org/3/glossary.html#term-EAFP) – *easier to ask for forgiveness than permission*: einfach versuchen und den Fehlerfall behandeln. Das Gegenteil ist [LBYL](https://docs.python.org/3/glossary.html#term-LBYL) – *look before you leap*: erst prüfen, dann handeln.

  ```python
  # LBYL: zwei Schritte – zwischen Prüfung und Zugriff kann sich die Welt ändern
  if pfad.exists():
      text = pfad.read_text(encoding="utf-8")   # Datei inzwischen gelöscht? → Exception trotzdem

  # EAFP: ein Schritt, der Fehlerfall ist explizit
  try:
      text = pfad.read_text(encoding="utf-8")
  except FileNotFoundError:
      text = ""
  ```

  EAFP vermeidet diese Race Condition (*time of check to time of use*) und doppelte Arbeit. LBYL ist besser, wenn der Fehlerfall **häufig** ist oder der Versuch Nebenwirkungen hätte, die du nicht zurücknehmen kannst. Für einen `dict` mit Standardwert gibt es ohnehin `dict.get()`.

  Aufräumen – Datei schließen, Sperre freigeben, Verbindung zurückgeben – gehört in `finally` oder besser in ein [`with`](https://docs.python.org/3/reference/compound_stmts.html#the-with-statement). Der Context Manager räumt auf, egal wie der Block verlassen wird ([Predefined Clean-up Actions](https://docs.python.org/3/tutorial/errors.html#predefined-clean-up-actions)). Eigene Context Manager schreibst du im Modul „Dekoratoren & funktionale Programmierung“. [`contextlib.suppress`](https://docs.python.org/3/library/contextlib.html#contextlib.suppress) ist die kurze Form von `try`/`except`/`pass` für bewusst ignorierte Fehler.

  ### Mehrere Fehler auf einmal: `ExceptionGroup` und `except*`

  Seit Python 3.11 kann eine [`ExceptionGroup`](https://docs.python.org/3/library/exceptions.html#ExceptionGroup) mehrere unabhängige Exceptions bündeln – etwa alle Validierungsfehler eines Formulars oder die Fehler paralleler Tasks in `asyncio.TaskGroup`. `except*` behandelt jeden passenden Teil der Gruppe ([Tutorial](https://docs.python.org/3/tutorial/errors.html#raising-and-handling-multiple-unrelated-exceptions)):

  ```python run
  def pruefe(nutzer: dict) -> None:
      fehler = []
      if "@" not in nutzer.get("email", ""):
          fehler.append(ValueError("email ungültig"))
      if nutzer.get("alter", 0) < 0:
          fehler.append(ValueError("alter negativ"))
      if "name" not in nutzer:
          fehler.append(KeyError("name"))
      if fehler:
          raise ExceptionGroup("Nutzer ungültig", fehler)

  try:
      pruefe({"email": "ada", "alter": -1})
  except* ValueError as gruppe:
      print("Wertfehler:", [str(e) for e in gruppe.exceptions])
  except* KeyError as gruppe:
      print("Fehlende Felder:", [str(e) for e in gruppe.exceptions])
  ```

  Anders als bei `except` können hier **mehrere** Klauseln laufen. Im Alltag begegnet dir das vor allem bei nebenläufigem Code.

  ## Module und Pakete: was `import` wirklich tut

  Ein **Modul** ist eine `.py`-Datei, ein **Paket** ein Verzeichnis mit Modulen, klassisch mit einer Datei `__init__.py` ([Packages](https://docs.python.org/3/tutorial/modules.html#packages)). Das Denkmodell für `import konfig`:

  1. Python schaut in [`sys.modules`](https://docs.python.org/3/library/sys.html#sys.modules) nach. Ist das Modul dort, ist der Import fertig.
  2. Sonst sucht Python die Datei entlang [`sys.path`](https://docs.python.org/3/library/sys.html#sys.path), legt ein leeres Modulobjekt an, **trägt es in `sys.modules` ein** und führt dann den Code der Datei **einmal von oben nach unten** aus. Jede `def`, `class` und Zuweisung auf oberster Ebene wird dabei zu einem Attribut des Moduls.
  3. Der Name `konfig` wird im importierenden Modul an das Modulobjekt gebunden.

  ```python run
  import os
  import sys
  from pathlib import Path

  sys.modules.pop("einstellungen", None)    # nur damit die Demo wiederholbar ist
  sys.path.insert(0, os.getcwd())
  Path("einstellungen.py").write_text('print("einstellungen wird ausgeführt")\nDEBUG = False\n', encoding="utf-8")

  import einstellungen                      # führt die Datei aus
  import einstellungen as noch_einmal       # nur Nachschlagen in sys.modules
  print(einstellungen is noch_einmal)

  from einstellungen import DEBUG           # kopiert die aktuelle Bindung
  einstellungen.DEBUG = True
  print(DEBUG, einstellungen.DEBUG)
  ```

  Zwei Folgen, die du kennen musst: Code auf oberster Ebene eines Moduls läuft beim **ersten** Import, also teure Arbeit oder Seiteneffekte (Verbindungen, `print`) nicht dorthin. Und `from modul import name` bindet den **aktuellen Wert** an einen neuen Namen; spätere Neuzuweisungen im Modul sieht dieser Name nicht. Details: [The module cache](https://docs.python.org/3/reference/import.html#the-module-cache).

  ### Absolute und relative Importe

  Innerhalb eines Pakets `shop` kannst du absolut (`from shop.preise import netto_zu_brutto`) oder relativ (`from .preise import netto_zu_brutto`, `from ..util import slug`) importieren ([Intra-package References](https://docs.python.org/3/tutorial/modules.html#intra-package-references)). Relative Importe funktionieren nur, wenn das Modul als Teil des Pakets geladen wurde – nicht, wenn du `python shop/cli.py` direkt startest. Deshalb startest du Module in Paketen mit `python -m shop.cli`. [PEP 8](https://peps.python.org/pep-0008/#imports) empfiehlt absolute Importe als Standard.

  ### Zirkuläre Importe

  Importiert `shop/modelle.py` etwas aus `shop/preise.py` und umgekehrt, entsteht ein Kreis. Weil ein Modul **vor** seiner Ausführung in `sys.modules` steht, findet der zweite Import ein halb fertiges Modul:

  ```console
  $ python -c "import shop.modelle"
  Traceback (most recent call last):
    …
    File "/app/shop/preise.py", line 1, in <module>
      from shop.modelle import Artikel
  ImportError: cannot import name 'Artikel' from partially initialized module 'shop.modelle' (most likely due to a circular import)
  ```

  Die saubere Lösung ist fast immer, die Abhängigkeit aufzulösen: Gemeinsames in ein drittes Modul verschieben, sodass die Abhängigkeiten nur in eine Richtung zeigen. Notlösungen sind ein Import innerhalb der Funktion, die ihn braucht, oder `import shop.modelle` statt `from … import`, weil der Attributzugriff dann erst beim Aufruf passiert.

  ### `if __name__ == "__main__":` und das src-Layout

  Jedes Modul hat ein Attribut `__name__`. Beim Import ist es der Modulname (`"shop.cli"`), beim direkten Start (`python datei.py` oder `python -m shop.cli`) ist es `"__main__"` ([`__main__`](https://docs.python.org/3/library/__main__.html#idiomatic-usage)). Damit trennst du „Code, der importiert werden kann“ von „Code, der beim Start läuft“:

  ```python
  def main() -> int:
      ...                    # Argumente lesen, Logging konfigurieren, Arbeit starten
      return 0

  if __name__ == "__main__":
      raise SystemExit(main())
  ```

  Für Projekte, die installiert und getestet werden, empfiehlt der [Packaging User Guide](https://packaging.python.org/en/latest/discussions/src-layout-vs-flat-layout/) das **src-Layout**:

  ```text
  shop-import/
  ├── pyproject.toml
  ├── src/
  │   └── shop/
  │       ├── __init__.py
  │       ├── __main__.py     ← erlaubt python -m shop
  │       ├── modelle.py
  │       └── preise.py
  └── tests/
      └── test_preise.py
  ```

  Weil `src/` nicht automatisch auf `sys.path` liegt, testen die Tests das **installierte** Paket und nicht zufällig die Dateien im Arbeitsverzeichnis. Fehlende Dateien im Paket fallen so früh auf. Wie man das Projekt mit uv installiert, zeigt das Modul „Tooling & Packaging“.

  ## Logging statt `print`

  `print` schreibt alles gleich laut nach stdout, ohne Zeitpunkt, ohne Herkunft, ohne Möglichkeit, es im Betrieb leiser zu stellen. Das Modul [`logging`](https://docs.python.org/3/library/logging.html) trennt drei Fragen: **Wer** meldet (Logger), **wie wichtig** ist es (Level), **wohin** geht es (Handler, konfiguriert an einer Stelle).

  ```python run
  import logging

  logger = logging.getLogger("shop.import")   # in echten Modulen: getLogger(__name__)

  def importiere(zeilen: list[str]) -> int:
      ok = 0
      for nummer, zeile in enumerate(zeilen, start=1):
          try:
              ok += int(zeile) >= 0
          except ValueError:
              logger.warning("Zeile %d übersprungen: %r", nummer, zeile)
      logger.info("%d von %d Zeilen importiert", ok, len(zeilen))
      return ok

  # Nur im Einstiegspunkt: Logging einmal konfigurieren.
  # force=True ersetzt vorhandene Handler – hier nötig, weil der Block mehrfach laufen kann.
  logging.basicConfig(level=logging.INFO, format="%(levelname)s %(name)s: %(message)s", force=True)
  importiere(["12", "x7", "3"])
  logger.debug("unsichtbar: DEBUG liegt unter INFO")
  ```

  Die Regeln aus dem [Logging HOWTO](https://docs.python.org/3/howto/logging.html#when-to-use-logging):

  - **Jedes Modul** holt sich `logger = logging.getLogger(__name__)`. Die Namen bilden eine Hierarchie (`shop` → `shop.import`), sodass du ganze Pakete lauter oder leiser stellen kannst.
  - **Nur der Einstiegspunkt** konfiguriert mit [`basicConfig`](https://docs.python.org/3/library/logging.html#logging.basicConfig) oder `dictConfig`. Eine Bibliothek konfiguriert nie Handler – sonst verdoppelt oder verändert sie die Ausgaben der Anwendung ([Configuring Logging for a Library](https://docs.python.org/3/howto/logging.html#configuring-logging-for-a-library)).
  - **Level:** `DEBUG` (Details für Entwickler), `INFO` (normaler Ablauf), `WARNING` (Unerwartetes, Programm läuft weiter; Standard-Schwelle), `ERROR` (eine Aufgabe ist gescheitert), `CRITICAL` (das Programm kann nicht weiter).
  - **Platzhalter statt f-Strings:** `logger.info("%d Zeilen", n)` formatiert nur, wenn die Meldung wirklich ausgegeben wird.
  - Im `except`-Block schreibt [`logger.exception(...)`](https://docs.python.org/3/library/logging.html#logging.Logger.exception) eine `ERROR`-Meldung **mit Traceback**.

  > [!PRAXIS] So sieht es im Betrieb aus
  > Ein Service läuft in Docker oder Kubernetes; stdout und stderr landen in einem zentralen Log-System. Dort filterst du nach Level und Logger-Namen und suchst nach dem Traceback, den `logger.exception` geschrieben hat. Ein `print("Fehler")` ohne Traceback ist in dieser Welt praktisch unsichtbar. Im Code-Review fällt deshalb jedes `except Exception: pass` und jedes `print` in Bibliothekscode auf.

  > [!INTERVIEW] „Wie gehst du mit Exceptions um?“
  > „Ich fange so spezifisch und so spät wie möglich – dort, wo ich wirklich etwas tun kann: erneut versuchen, einen Standardwert nehmen oder in eine fachliche Exception übersetzen, dann mit `raise … from …`, damit die Ursache erhalten bleibt. Alles andere lasse ich durchlaufen bis zu einer zentralen Stelle, die mit `logger.exception` loggt. Nie ein nacktes `except:`, und für Aufräumarbeit nehme ich `with` oder `finally`.“

  ## Logging konfigurieren: dictConfig, Bibliotheken und Kontext

  `basicConfig` genügt für ein Skript mit einem Handler. Sobald eine Anwendung mehrere Ziele, Formate oder Level pro Paket braucht, beschreibst du die Konfiguration als Daten und lädst sie mit [`logging.config.dictConfig`](https://docs.python.org/3/library/logging.config.html#logging.config.dictConfig). Django ([`LOGGING`](https://docs.djangoproject.com/en/stable/topics/logging/)) und uvicorn ([`--log-config`](https://uvicorn.dev/settings/)) benutzen genau dieses Format. Die Grundregeln, dass nur der Einstiegspunkt konfiguriert und `-v` das Level steuert, stehen im Modul [CLI-Werkzeuge](/automation/cli-werkzeuge). Hier geht es um das, was darüber hinausgeht.

  ### dictConfig: Konfiguration als Dictionary

  ```python run
  import logging
  import logging.config

  KONFIG = {
      "version": 1,
      "disable_existing_loggers": False,
      "formatters": {
          "kurz": {"format": "%(levelname)-7s %(name)s: %(message)s"},
      },
      "handlers": {
          "konsole": {
              "class": "logging.StreamHandler",
              "formatter": "kurz",
              "level": "INFO",
              "stream": "ext://sys.stdout",
          },
      },
      "loggers": {
          "shop": {"level": "DEBUG", "handlers": ["konsole"], "propagate": False},
      },
      "root": {"level": "WARNING", "handlers": ["konsole"]},
  }

  logging.config.dictConfig(KONFIG)             # einmal, beim Programmstart

  log = logging.getLogger("shop.import")
  log.debug("DEBUG: der Handler steht auf INFO")
  log.info("12 Zeilen importiert")
  logging.getLogger("fremd").info("INFO: root steht auf WARNING")
  logging.getLogger("fremd").warning("Warnung einer fremden Bibliothek")
  ```

  Das Dictionary hat feste Schlüssel ([Configuration dictionary schema](https://docs.python.org/3/library/logging.config.html#configuration-dictionary-schema)):

  - `version` ist Pflicht und derzeit immer `1`.
  - `formatters`, `handlers` und `filters` sind Namenstabellen. Ein Handler nennt seine Klasse (`class`), den Formatter, ein Level und weitere Argumente für den Konstruktor. `ext://sys.stdout` löst beim Laden das Objekt `sys.stdout` auf. Statt `class` darf auch `"()"` stehen, eine Factory-Funktion oder Klasse; die Übung unten nutzt das.
  - `loggers` konfiguriert benannte Logger mit Level, Handlern und `propagate`. `root` konfiguriert den Wurzel-Logger.
  - `disable_existing_loggers` ist standardmäßig `True`. Das ist eine Falle, siehe unten.

  Die Struktur ist Daten. Du kannst sie aus einer TOML-, YAML- oder JSON-Datei laden und je nach Umgebung austauschen. Aufgerufen wird `dictConfig` einmal in `main()`, nie auf Modulebene und nie in einer Bibliothek.

  Zwei Eigenheiten gehören zum Denkmodell:

  **Zwei Schranken: Logger-Level und Handler-Level.** Der Logger verwirft Meldungen unter seinem [effektiven Level](https://docs.python.org/3/library/logging.html#logging.Logger.getEffectiveLevel) (das erste gesetzte Level auf dem Weg zur Wurzel). Danach prüft jeder Handler sein eigenes Level. Ein Logger auf `DEBUG` mit einem Handler auf `INFO` zeigt kein `DEBUG`. Im Beispiel verwirft der Handler `konsole` die `DEBUG`-Zeile, obwohl `shop` auf `DEBUG` steht.

  **Propagation übergeht die Level der Vorfahren.** Mit `propagate: True` (Standard) reicht ein Logger die Meldung an die Handler seiner Vorfahren weiter. Deren **Logger**-Level und Filter zählen dann nicht mehr, nur ihre Handler-Level ([Logger-Ablauf im HOWTO](https://docs.python.org/3/howto/logging.html#logging-flow)):

  ```python run
  import logging
  import logging.config

  logging.config.dictConfig({
      "version": 1,
      "disable_existing_loggers": False,
      "handlers": {"h": {"class": "logging.StreamHandler", "stream": "ext://sys.stdout"}},
      "loggers": {
          "kasse": {"level": "INFO", "handlers": ["h"]},
          "kasse.db": {"level": "DEBUG"},
      },
  })
  logging.getLogger("kasse").debug("1 kasse debug")
  logging.getLogger("kasse.db").debug("2 db debug")
  logging.getLogger("kasse.db.pool").info("3 pool info")
  ```

  Zeile 1 verwirft `kasse` selbst (INFO). Zeile 2 kommt durch: `kasse.db` steht auf `DEBUG`, hat keinen eigenen Handler und reicht die Meldung an den Handler von `kasse` weiter, ohne dessen Level `INFO` nochmals zu prüfen. Zeile 3 erbt `DEBUG` von `kasse.db` und gelangt ebenfalls zum Handler. Ohne `propagate: False` bei `shop` im ersten Beispiel würde jede `shop`-Meldung zusätzlich über den `root`-Handler laufen und doppelt erscheinen.

  > [!WARNING] `disable_existing_loggers` ist standardmäßig `True`
  > Ohne `"disable_existing_loggers": False` schaltet `dictConfig` jeden schon angelegten Logger stumm, der nicht in der Konfiguration steht und keinen Vorfahren darin hat (`logger.disabled` ist danach `True`). Typisch: Ein Modul legt beim Import `log = getLogger(__name__)` an, `main()` ruft danach `dictConfig` auf, und die Meldungen dieses Moduls verschwinden ohne Fehler. Setze den Schlüssel in jeder Anwendungskonfiguration auf `False`.

  ### Bibliotheken: nur einen NullHandler

  Eine Bibliothek weiß nicht, wohin eine Anwendung ihre Logs schreibt. Konfiguriert sie selbst Handler oder ruft `basicConfig` auf, greift sie in die Entscheidung der Anwendung ein:

  ```python run
  import logging
  import logging.config
  import sys

  bib = logging.getLogger("geocode")
  bib.handlers.clear()                                  # nur damit der Block wiederholbar bleibt
  bib.addHandler(logging.StreamHandler(sys.stdout))     # FALSCH: Handler in einer Bibliothek

  logging.config.dictConfig({                           # die Anwendung konfiguriert ihr Format
      "version": 1,
      "disable_existing_loggers": False,
      "formatters": {"app": {"format": "APP %(message)s"}},
      "handlers": {"h": {"class": "logging.StreamHandler", "stream": "ext://sys.stdout", "formatter": "app"}},
      "root": {"level": "INFO", "handlers": ["h"]},
  })
  bib.warning("Adresse nicht gefunden")                 # erscheint zweimal, einmal im falschen Format
  ```

  Die Bibliothek gibt die Zeile selbst aus, und dank Propagation gibt sie der Handler der Anwendung ein zweites Mal aus. Die Anwendung kann das Doppel nur beseitigen, indem sie in den Code der Bibliothek greift. Das [Logging HOWTO](https://docs.python.org/3/howto/logging.html#configuring-logging-for-a-library) empfiehlt deshalb: Eine Bibliothek holt sich `getLogger(__name__)`, loggt und hängt höchstens einen `NullHandler` an den obersten Logger ihres Pakets, meist in `__init__.py`:

  ```python
  # meinlib/__init__.py
  import logging

  logging.getLogger(__name__).addHandler(logging.NullHandler())
  ```

  Was der `NullHandler` bewirkt, erklärt der **Handler of last resort**. Findet ein Logger auf dem Weg zur Wurzel keinen einzigen Handler, schreibt Python Meldungen ab `WARNING` über [`logging.lastResort`](https://docs.python.org/3/library/logging.html#logging.lastResort) auf stderr, ohne Zeitstempel und Format. Das ist für ein Skript ohne Logging-Konfiguration ein sinnvoller Standard: Warnungen gehen nicht verloren. Ein `NullHandler` zählt aber als gefundener Handler und tut nichts. Die Bibliothek bleibt damit still, solange die Anwendung nichts konfiguriert, und sobald sie es tut, entscheidet allein die Anwendung über Level, Format und Ziel.

  > [!INTERVIEW] „Warum konfiguriert eine Bibliothek kein Logging?“
  > „Weil Handler, Format und Level Sache der Anwendung sind. Ein Handler in der Bibliothek erzeugt doppelte Zeilen oder ein fremdes Format, und ein `basicConfig` beim Import legt einen Root-Handler an, sodass spätere `basicConfig`-Aufrufe der Anwendung wirkungslos sind. Die Bibliothek nimmt `getLogger(__name__)` und hängt höchstens einen `NullHandler` an den obersten Logger ihres Pakets. Den Rest entscheidet `dictConfig` in `main()`.“

  ### Kontext mit `extra`, `LoggerAdapter` und `contextvars`

  Logs werden erst nützlich, wenn sie sich nach Auftrag, Nutzer oder Request filtern lassen. Das Argument `extra` hängt dem Log-Datensatz zusätzliche Attribute an, die ein Format-String als `%(auftrag_id)s` ausgibt:

  ```python run
  import logging
  import sys

  log = logging.getLogger("versand")
  log.setLevel(logging.INFO)
  log.handlers.clear()                                  # nur damit der Block wiederholbar bleibt
  log.propagate = False
  handler = logging.StreamHandler(sys.stdout)
  handler.setFormatter(logging.Formatter("%(levelname)s [%(auftrag_id)s] %(message)s"))
  log.addHandler(handler)

  log.info("reserviert", extra={"auftrag_id": "A-4711"})

  adapter = logging.LoggerAdapter(log, {"auftrag_id": "A-4712"})    # Kontext einmal festlegen
  adapter.info("versendet")

  try:
      log.info("fertig", extra={"name": "lager-2"})
  except KeyError as fehler:
      print("KeyError:", fehler)
  ```

  Dabei gibt es drei Fallen:

  - **Reservierte Namen.** Ein Schlüssel in `extra` darf kein Attribut von `LogRecord` überschreiben (`name`, `message`, `args`, `levelname`, `msg` und weitere) und nicht `asctime` heißen. Sonst wirft `Logger.info` `KeyError: "Attempt to overwrite 'name' in LogRecord"`. Der Fehler tritt nur bei einer Zeile auf, die das Level wirklich ausgibt. Bei einer `debug`-Zeile fällt er erst auf, wenn jemand in der Produktion auf `DEBUG` stellt. Nimm präfixierte Namen wie `auftrag_id`.
  - **Fehlendes Feld.** Verweist der Formatter auf `%(auftrag_id)s` und eine Meldung kommt ohne `extra`, schreibt `logging` `--- Logging error ---` mit Traceback auf stderr, das Programm läuft weiter, die Zeile geht verloren.
  - **`LoggerAdapter` ersetzt `extra` pro Aufruf.** Standardmäßig überschreibt der Kontext des Adapters ein `extra` am einzelnen Aufruf. Seit Python 3.13 mischt `LoggerAdapter(log, kontext, merge_extra=True)` beide, und der Wert am Aufruf gewinnt ([LoggerAdapter](https://docs.python.org/3/library/logging.html#loggeradapter-objects)).

  Wer den Kontext nicht durch jeden Aufruf reichen will, speichert ihn in einer [`contextvars.ContextVar`](https://docs.python.org/3/library/contextvars.html) und lässt einen Filter ihn in jeden Datensatz schreiben. Ein `ContextVar` gilt pro Thread und pro asyncio-Task, parallele Requests mischen sich also nicht:

  ```python run
  import contextvars
  import logging
  import logging.config

  auftrag_id = contextvars.ContextVar("auftrag_id", default="-")

  class KontextFilter(logging.Filter):
      def filter(self, record: logging.LogRecord) -> bool:
          record.auftrag_id = auftrag_id.get()
          return True

  logging.config.dictConfig({
      "version": 1,
      "disable_existing_loggers": False,
      "filters": {"kontext": {"()": KontextFilter}},
      "formatters": {"mit_id": {"format": "%(levelname)s [%(auftrag_id)s] %(message)s"}},
      "handlers": {
          "h": {"class": "logging.StreamHandler", "stream": "ext://sys.stdout",
                "formatter": "mit_id", "filters": ["kontext"]},
      },
      "loggers": {"lager": {"level": "INFO", "handlers": ["h"], "propagate": False}},
  })

  log = logging.getLogger("lager")
  log.info("Start ohne Kontext")
  auftrag_id.set("A-4711")                  # in einem Web-Framework: einmal pro Request
  log.info("Bestand reserviert")
  ```

  Der Filter hängt am **Handler**, nicht am Logger. Filter eines Loggers gelten nur für Meldungen, die dieser Logger selbst erzeugt, nicht für die seiner Kinder. Der Handler sieht dagegen alle Datensätze, die bei ihm ankommen, und der Filter stellt sicher, dass jeder das Feld `auftrag_id` hat.

  > [!PRAXIS] Konfiguration als Datei, Kontext als Feld
  > Services laden ihre `dictConfig` aus einer Datei der Umgebung (Entwicklung: lesbare Zeilen, Produktion: JSON-Zeilen für das zentrale Log-System). Der Kontext (`request_id`, `nutzer_id`) steht als eigenes Feld in jeder Zeile, damit sich ein Request im Log mit einer Suche verfolgen lässt. Beim Review fallen `basicConfig` in Bibliotheksmodulen und `disable_existing_loggers` ohne `False` auf.

  ## Häufige Fehler

  - **`except:` oder `except Exception: pass`.** Verschluckt Programmierfehler (`NameError`, `AttributeError`) und macht Bugs unsichtbar. Fange die konkrete Klasse; wenn du breit fangen musst, logge mit `logger.exception` und wirf weiter.
  - **`except ValueError or TypeError:`.** `ValueError or TypeError` ist ein Ausdruck und ergibt `ValueError` – `TypeError` wird nicht gefangen. Richtig: `except (ValueError, TypeError):`.
  - **Riesige `try`-Blöcke.** Der `except` fängt dann auch Fehler aus Zeilen, an die du nicht gedacht hast. Nur die riskante Zeile in `try`, den Rest in `else`.
  - **Neue Exception ohne `from`.** Der Traceback sieht aus wie ein zweiter Fehler bei der Fehlerbehandlung.
  - **Zirkuläre Importe.** `ImportError: cannot import name … from partially initialized module`. Gemeinsamen Code herausziehen.
  - **Datei heißt wie ein Modul der Standardbibliothek** (`logging.py`, `json.py`). Dein Modul verdeckt dann das echte, und Importe schlagen seltsam fehl.
  - **`logging.basicConfig` in einem Bibliotheksmodul** oder Logging vor dem Konfigurieren: Der erste Aufruf einer Logging-Funktion ohne Konfiguration kann selbst `basicConfig` auslösen, spätere Aufrufe bleiben dann wirkungslos.
  - **`dictConfig` ohne `"disable_existing_loggers": False`.** Logger, die Module beim Import angelegt haben, werden stumm. Symptom: Meldungen eines Moduls fehlen ohne Fehler.
  - **`extra` mit reserviertem Schlüssel** (`name`, `message`, `args`, `msg`). Symptom: `KeyError: "Attempt to overwrite 'name' in LogRecord"`, aber nur bei Zeilen, die das Level ausgibt.
  - **Eigener Handler in einer Bibliothek.** Symptom: doppelte Zeilen oder ein fremdes Format. Behebung: nur ein `NullHandler`, den Rest konfiguriert die Anwendung.

  ## Zusammenfassung

  - `Exception` ist die Basis für alles Behandelbare; `KeyboardInterrupt` und `SystemExit` hängen direkt unter `BaseException`. Nie nacktes `except:`.
  - `except` bei passender Exception, `else` nur ohne Exception, `finally` immer. Kleine `try`-Blöcke.
  - `raise Neu(...) from fehler` übersetzt und erhält die Ursache; `from None` blendet sie aus; nacktes `raise` wirft weiter.
  - Eigene Bibliotheken: eine Basisklasse, spezifische Unterklassen mit Attributen.
  - EAFP ist der Python-Standard; LBYL, wenn der Fehlerfall häufig oder der Versuch nicht umkehrbar ist. Aufräumen mit `with`/`finally`.
  - Ein Modul wird beim ersten Import ausgeführt und in `sys.modules` gecacht; `from m import x` kopiert die Bindung.
  - `if __name__ == "__main__":` trennt Startcode von importierbarem Code; Module in Paketen startest du mit `python -m`.
  - `getLogger(__name__)` in jedem Modul, Konfiguration nur im Einstiegspunkt, `logger.exception` im `except`-Block.
  - `dictConfig` beschreibt Formatter, Handler und Logger als Daten (`version: 1`, `disable_existing_loggers: False`). Eine Meldung passiert Logger-Level und Handler-Level; bei Propagation zählen für die Vorfahren nur die Handler-Level.
  - Bibliotheken hängen höchstens einen `NullHandler` an den obersten Logger ihres Pakets. Ohne Handler schreibt `logging.lastResort` Warnungen nach stderr.
  - Kontext kommt per `extra`, `LoggerAdapter` oder einem Filter mit `ContextVar` ins Log. `extra` darf kein `LogRecord`-Attribut überschreiben.
exercises:
  - id: was-faengt-exception
    type: choice
    title: Was fängt except Exception?
    prompt: "Welche dieser Exceptions fängt ein `except Exception:`?"
    options:
      - text: "`KeyError`"
        correct: true
        why: "`KeyError` erbt über `LookupError` von `Exception`."
      - text: "`KeyboardInterrupt` (Strg+C)"
        correct: false
        why: Erbt direkt von `BaseException`, damit ein breites `except Exception` den Abbruch durch den Nutzer nicht verhindert.
      - text: "`SystemExit` aus `sys.exit(1)`"
        correct: false
        why: "`sys.exit()` löst `SystemExit` aus, das ebenfalls direkt unter `BaseException` hängt – sonst würde ein breiter Handler das Beenden verhindern."
      - text: "`FileNotFoundError`"
        correct: true
        why: "`FileNotFoundError` ist eine Unterklasse von `OSError`, und die erbt von `Exception`."
      - text: "`ExceptionGroup` mit zwei `ValueError`"
        correct: true
        why: "`ExceptionGroup` erbt von `Exception` (nur `BaseExceptionGroup` nicht)."
    explanation: |
      `except Klasse` fängt die Klasse und alle Unterklassen. Unter `Exception` liegt alles, was ein Programm normalerweise behandeln will. `KeyboardInterrupt`, `SystemExit` und `GeneratorExit` stehen bewusst daneben, direkt unter `BaseException`. Genau deshalb ist `except Exception` die breiteste vertretbare Form und ein nacktes `except:` (fängt `BaseException`) ein Fehler.
    resources:
      - title: Built-in Exceptions · Exception hierarchy
        url: https://docs.python.org/3/library/exceptions.html#exception-hierarchy

  - id: konfig-laden-ordnen
    type: order
    title: Konfiguration robust laden
    prompt: |
      Bring die Zeilen in die richtige Reihenfolge: Fehlt die Datei, wird gewarnt und ein leeres Dictionary zurückgegeben. Nur wenn das Lesen geklappt hat, wird das JSON geparst. Die Debug-Meldung soll in **jedem** Fall erscheinen.
    lang: python
    lines: |
      def lade_konfig(pfad: Path) -> dict:
          try:
              text = pfad.read_text(encoding="utf-8")
          except FileNotFoundError:
              logger.warning("%s fehlt, nutze Standardwerte", pfad)
              return {}
          else:
              return json.loads(text)
          finally:
              logger.debug("lade_konfig(%s) beendet", pfad)
    explanation: |
      Die Reihenfolge der Klauseln ist fest: `try`, dann `except`, dann `else`, dann `finally`. `json.loads` steht im `else`, damit ein `JSONDecodeError` nicht versehentlich vom `except FileNotFoundError` mit behandelt würde und damit der `try`-Block nur die Zeile schützt, die die Datei liest. `finally` läuft auch nach den beiden `return`-Anweisungen.
    resources:
      - title: Tutorial · Handling Exceptions
        url: https://docs.python.org/3/tutorial/errors.html#handling-exceptions

  - id: try-reihenfolge
    type: output
    title: Wer läuft wann?
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      def teile(a, b):
          try:
              ergebnis = a / b
          except ZeroDivisionError:
              print("except")
              return None
          else:
              print("else")
              return ergebnis
          finally:
              print("finally")

      print(teile(6, 3))
      print(teile(1, 0))
    expected: |
      else
      finally
      2.0
      except
      finally
      None
    explanation: |
      Beim ersten Aufruf läuft `try` ohne Fehler, also `else`. Dessen `return` merkt sich den Rückgabewert `2.0`, aber bevor die Funktion ihn zurückgibt, läuft `finally`. Erst danach druckt der Aufrufer `2.0`. Beim zweiten Aufruf springt `ZeroDivisionError` in den `except`-Block; wieder läuft `finally` vor der Rückkehr. `/` liefert in Python 3 immer einen `float`, deshalb `2.0`.
    resources:
      - title: Language Reference · finally clause
        url: https://docs.python.org/3/reference/compound_stmts.html#finally-clause

  - id: verkettung-vorhersagen
    type: output
    title: Ursache und Kontext
    prompt: Was gibt dieses Programm aus? Achte auf `from fehler` und `from None`.
    lang: python
    code: |
      class KonfigFehler(Exception):
          pass

      def port_lesen(konfig):
          try:
              return int(konfig["port"])
          except KeyError as fehler:
              raise KonfigFehler("port fehlt") from fehler
          except ValueError:
              raise KonfigFehler("port ist keine Zahl") from None

      for konfig in [{}, {"port": "acht"}]:
          try:
              port_lesen(konfig)
          except KonfigFehler as e:
              print(e, type(e.__cause__).__name__, type(e.__context__).__name__, e.__suppress_context__)
    expected: |
      port fehlt KeyError KeyError True
      port ist keine Zahl NoneType ValueError True
    explanation: |
      `__context__` setzt Python **immer** automatisch auf die Exception, die gerade behandelt wurde – in beiden Fällen. `from fehler` setzt zusätzlich `__cause__` und `__suppress_context__ = True`; der Traceback zeigt dann „direct cause“ statt „during handling“. `from None` setzt `__cause__` auf `None` und unterdrückt die Anzeige des Kontexts ebenfalls, der `ValueError` bleibt aber in `__context__` erhalten – er wird nur nicht angezeigt.
    resources:
      - title: Built-in Exceptions · Exception context
        url: https://docs.python.org/3/library/exceptions.html#exception-context

  - id: modul-cache-vorhersagen
    type: output
    title: Wie oft läuft ein Modul?
    prompt: |
      Das Programm legt ein Modul `einstellungen.py` an und importiert es mehrfach. Was gibt es aus?
    lang: python
    code: |
      import os
      import sys
      from pathlib import Path

      sys.path.insert(0, os.getcwd())
      Path("einstellungen.py").write_text(
          'print("lade einstellungen")\nDEBUG = False\n', encoding="utf-8"
      )

      import einstellungen
      from einstellungen import DEBUG
      import einstellungen as e2

      einstellungen.DEBUG = True
      print(DEBUG, e2.DEBUG, "einstellungen" in sys.modules)
    expected: |
      lade einstellungen
      False True True
    explanation: |
      Der erste Import führt die Datei aus und legt das Modul in `sys.modules` ab. Alle weiteren Importe – auch `from … import` und `import … as` – finden es dort und führen nichts erneut aus; deshalb erscheint `lade einstellungen` nur einmal. `e2` ist dasselbe Modulobjekt wie `einstellungen`, sieht also die Änderung. `from einstellungen import DEBUG` hat dagegen den damaligen Wert `False` an einen eigenen Namen gebunden; die spätere Neuzuweisung im Modul ändert diesen Namen nicht.
    resources:
      - title: Language Reference · The module cache
        url: https://docs.python.org/3/reference/import.html#the-module-cache
      - title: sys.modules
        url: https://docs.python.org/3/library/sys.html#sys.modules

  - id: log-level-propagation
    type: output
    title: Wer sieht die Meldung?
    prompt: |
      Beide Handler schreiben nach stdout und stellen ihr Kürzel voran. Der Root-Logger hat keine Handler. Was gibt das Programm aus? Prüfe bei jeder Meldung das Level des Loggers, das Level jedes Handlers und `propagate`.
    lang: python
    code: |
      import logging
      import sys

      def handler(kuerzel: str, level: int) -> logging.Handler:
          h = logging.StreamHandler(sys.stdout)
          h.setLevel(level)
          h.setFormatter(logging.Formatter(f"{kuerzel} %(message)s"))
          return h

      app = logging.getLogger("app")
      app.setLevel(logging.WARNING)
      app.addHandler(handler("A", logging.DEBUG))

      db = logging.getLogger("app.db")
      db.setLevel(logging.DEBUG)
      db.addHandler(handler("B", logging.INFO))

      db.debug("d")
      db.info("i")
      app.info("p")
      db.propagate = False
      db.debug("x")
      db.info("y")
    expected: |
      A d
      B i
      A i
      B y
    explanation: |
      `db.debug("d")` passiert das Logger-Level `DEBUG` von `app.db`. Handler `B` verwirft die Meldung (Level `INFO`), danach geht sie an die Handler von `app`. Deren Logger-Level `WARNING` wird dabei **nicht** geprüft, nur das Handler-Level `DEBUG` von `A`: Es erscheint `A d`. `db.info("i")` druckt zuerst `B i` (eigene Handler zuerst), dann `A i`. `app.info("p")` scheitert am Level `WARNING` von `app` selbst, denn hier ist `app` der erzeugende Logger. Nach `db.propagate = False` erreicht nichts mehr `A`. `x` bleibt am Handler `B` hängen, `y` erscheint als `B y`.
    resources:
      - title: Logging HOWTO · Logging flow
        url: https://docs.python.org/3/howto/logging.html#logging-flow
      - title: logging · Logger.propagate
        url: https://docs.python.org/3/library/logging.html#logging.Logger.propagate

  - id: log-extra-reserviert
    type: output
    title: Eine Zeile, die nur manchmal scheitert
    prompt: |
      Was gibt das Programm aus? Python meldet einen Konflikt in `extra` mit `Attempt to overwrite '<schlüssel>' in LogRecord`. Prüfe, welche der vier Logging-Aufrufe überhaupt einen Datensatz erzeugen.
    lang: python
    code: |
      import logging
      import sys

      log = logging.getLogger("versand")
      log.setLevel(logging.INFO)
      log.propagate = False
      handler = logging.StreamHandler(sys.stdout)
      handler.setFormatter(logging.Formatter("%(levelname)s [%(auftrag_id)s] %(message)s"))
      log.addHandler(handler)

      log.info("reserviert", extra={"auftrag_id": "A-1"})
      log.debug("Details", extra={"message": "x"})
      try:
          log.info("versendet", extra={"name": "paketdienst"})
      except KeyError as fehler:
          print("abgelehnt:", fehler.args[0])
      log.info("fertig", extra={"auftrag_id": "A-1"})
    expected: |
      INFO [A-1] reserviert
      abgelehnt: Attempt to overwrite 'name' in LogRecord
      INFO [A-1] fertig
    explanation: |
      Der Logger steht auf `INFO`. `log.debug(...)` erzeugt deshalb gar keinen Datensatz, und der verbotene Schlüssel `message` fällt nicht auf. Dieser Fehler taucht erst auf, wenn jemand `DEBUG` einschaltet. `log.info(..., extra={"name": ...})` erzeugt einen Datensatz und scheitert: `name` ist ein Attribut von `LogRecord`, und `makeRecord` weigert sich, es zu überschreiben, mit einem `KeyError`. Die dritte `info`-Zeile kommt durch, weil `auftrag_id` frei ist. Wähle Schlüssel, die keinem `LogRecord`-Attribut gleichen.
    resources:
      - title: logging · Logger.debug (extra)
        url: https://docs.python.org/3/library/logging.html#logging.Logger.debug
      - title: logging · LogRecord attributes
        url: https://docs.python.org/3/library/logging.html#logrecord-attributes

  - id: luecken-fehler-logging
    type: gap
    title: Ein Modul mit sauberer Fehlerbehandlung
    prompt: |
      Ergänze das Modul: Der Logger soll nach dem Modul benannt sein. `lade_port` fängt fehlende **und** ungültige Werte und übersetzt sie in einen `KonfigFehler`, **ohne die Ursache zu verlieren**. `main()` läuft nur beim direkten Start, nicht beim Import.
    lang: python
    code: |
      import logging

      logger = logging.getLogger(⟦__name__⟧)

      class KonfigFehler(Exception):
          """Basis für alle Konfigurationsfehler."""

      def lade_port(konfig: dict) -> int:
          try:
              return int(konfig["port"])
          except ⟦(KeyError, ValueError)⟧ as fehler:
              raise KonfigFehler("port fehlt oder ist ungültig") ⟦from fehler⟧

      def main() -> None:
          logging.basicConfig(level=logging.INFO)
          try:
              port = lade_port({"port": "8080"})
          except KonfigFehler:
              ⟦logger.exception⟧("Konfiguration unbrauchbar")
              raise
          logger.info("Starte auf Port %d", port)

      if ⟦__name__ == "__main__"⟧:
          main()
    gaps:
      - label: Logger-Name
        hint: Ein Modulattribut, das beim Import den Modulnamen enthält.
      - label: Zwei Exception-Typen
        hint: Mehrere Typen fängst du mit einem Tupel.
        accept: ["(ValueError, KeyError)", "KeyError, ValueError", "ValueError, KeyError"]
      - label: Ursache erhalten
        hint: Explizite Verkettung mit einem Schlüsselwort und dem gefangenen Objekt.
      - label: ERROR mit Traceback
        hint: Eine Logger-Methode, die im `except`-Block den Traceback mitschreibt.
      - label: Nur beim direkten Start
        hint: Beim direkten Start hat `__name__` einen besonderen Wert.
        accept: ["'__main__' == __name__"]
    explanation: |
      `getLogger(__name__)` benennt den Logger nach dem Modul, etwa `shop.konfig`; so lässt sich die Ausgabe pro Paket steuern. Das Tupel fängt beide Fehlerarten; ohne Klammern ist das erst seit Python 3.14 erlaubt. `from fehler` hängt den `KeyError` bzw. `ValueError` als `__cause__` an. `logger.exception` loggt auf `ERROR` samt Traceback, das nackte `raise` wirft danach unverändert weiter. Der `__main__`-Block sorgt dafür, dass ein `import` des Moduls nichts startet und nichts konfiguriert.
    resources:
      - title: Tutorial · Exception Chaining
        url: https://docs.python.org/3/tutorial/errors.html#exception-chaining
      - title: __main__ · Idiomatic usage
        url: https://docs.python.org/3/library/__main__.html#idiomatic-usage

  - id: modul-als-skript
    type: command
    title: Ein Paketmodul starten
    prompt: |
      Du arbeitest im Projekt aus der Lektion (src-Layout, Paket in der aktiven virtuellen Umgebung installiert). Das Modul `shop/cli.py` nutzt relative Importe wie `from .preise import netto_zu_brutto`. Starte es so, dass diese Importe funktionieren.
    context: Du bist in `~/projekte/shop-import`, die virtuelle Umgebung ist aktiviert.
    answers: ["python -m shop.cli", "python3 -m shop.cli"]
    output: |
      INFO shop.cli: 3 von 3 Zeilen importiert
    explanation: |
      `python -m shop.cli` sucht das Modul über `sys.path` und lädt es **als Teil des Pakets `shop`**. `__package__` ist dann gesetzt, relative Importe funktionieren, und `__name__` ist trotzdem `"__main__"`. `python src/shop/cli.py` würde die Datei dagegen als losgelöstes Skript starten; der relative Import scheitert mit `ImportError: attempted relative import with no known parent package`.
    resources:
      - title: Command line · -m
