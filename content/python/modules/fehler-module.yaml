  - id: port-validieren
    type: code
    title: Eine Exception-Hierarchie für Konfiguration
    prompt: |
      Schreibe eine kleine Exception-Hierarchie und die Funktion `lade_port(konfig: dict) -> int`:

      - `KonfigFehler(Exception)` ist die Basis. Darunter `FehlendeEinstellung` und `UngueltigeEinstellung`.
      - `FehlendeEinstellung` bekommt den Schlüssel als Argument, speichert ihn als Attribut `schluessel` und hat die Nachricht `Einstellung 'port' fehlt`.
      - Fehlt `"port"`, wirft `lade_port` `FehlendeEinstellung("port")` – verkettet mit dem `KeyError`.
      - Ist der Wert keine ganze Zahl (`"acht"`), wirft sie `UngueltigeEinstellung` – verkettet mit dem `ValueError`.
      - Liegt die Zahl nicht in 1–65535, wirft sie `UngueltigeEinstellung` (ohne Ursache).
      - Strings wie `"8080"` und Zahlen wie `443` sind gültig.
    lang: python
    starter: |
      class KonfigFehler(Exception):
          pass

      def lade_port(konfig: dict) -> int:
          return int(konfig["port"])
    solution: |
      class KonfigFehler(Exception):
          """Basis für alle Konfigurationsfehler."""

      class FehlendeEinstellung(KonfigFehler):
          def __init__(self, schluessel: str) -> None:
              super().__init__(f"Einstellung {schluessel!r} fehlt")
              self.schluessel = schluessel

      class UngueltigeEinstellung(KonfigFehler):
          pass

      def lade_port(konfig: dict) -> int:
          try:
              roh = konfig["port"]
          except KeyError as fehler:
              raise FehlendeEinstellung("port") from fehler
          try:
              port = int(roh)
          except ValueError as fehler:
              raise UngueltigeEinstellung(f"port ist keine Zahl: {roh!r}") from fehler
          if not 1 <= port <= 65535:
              raise UngueltigeEinstellung(f"port außerhalb von 1–65535: {port}")
          return port
    tests:
      - name: Gültige Werte
        code: |
          assert lade_port({"port": "8080"}) == 8080
          assert lade_port({"port": 443}) == 443
      - name: Fehlender Port
        code: |
          try:
              lade_port({"host": "db"})
          except FehlendeEinstellung as e:
              assert e.schluessel == "port"
              assert str(e) == "Einstellung 'port' fehlt", f"Nachricht: {e}"
              assert isinstance(e.__cause__, KeyError), "Ursache soll der KeyError sein (raise … from …)"
          else:
              raise AssertionError("FehlendeEinstellung erwartet")
      - name: Keine Zahl
        code: |
          try:
              lade_port({"port": "acht"})
          except UngueltigeEinstellung as e:
              assert isinstance(e.__cause__, ValueError), "Ursache soll der ValueError sein"
          else:
              raise AssertionError("UngueltigeEinstellung erwartet")
      - name: Außerhalb des Bereichs
        code: |
          for wert in (0, 70000, -1):
              try:
                  lade_port({"port": wert})
              except UngueltigeEinstellung:
                  pass
              else:
                  raise AssertionError(f"port={wert} muss UngueltigeEinstellung werfen")
      - name: Hierarchie
        code: |
          assert issubclass(FehlendeEinstellung, KonfigFehler)
          assert issubclass(UngueltigeEinstellung, KonfigFehler)
          assert issubclass(KonfigFehler, Exception)
          try:
              lade_port({})
          except KonfigFehler:
              pass
    hints:
      - Zwei kleine `try`-Blöcke sind klarer als einer, der beide Fehler mischt.
      - "`raise FehlendeEinstellung(\"port\") from fehler` im `except KeyError as fehler:`."
      - "Im `__init__` von `FehlendeEinstellung`: `super().__init__(f\"Einstellung {schluessel!r} fehlt\")` und dann `self.schluessel = schluessel`."
    explanation: |
      Aufrufer können jetzt wählen: `except KonfigFehler` für „irgendetwas an der Konfiguration stimmt nicht“ oder gezielt `except FehlendeEinstellung`, um etwa einen Standardwert zu setzen. Das Attribut `schluessel` erspart es ihnen, die Nachricht zu parsen. `from fehler` erhält die technische Ursache im Traceback. Die Bereichsprüfung hat keine Ursache – es gibt keine ursprüngliche Exception, also auch kein `from`. `int(443)` und `int("8080")` funktionieren beide; `int("acht")` wirft `ValueError`.
    resources:
      - title: Tutorial · User-defined Exceptions
        url: https://docs.python.org/3/tutorial/errors.html#user-defined-exceptions
      - title: Language Reference · raise
        url: https://docs.python.org/3/reference/simple_stmts.html#the-raise-statement

  - id: eafp-verschachtelt
    type: code
    title: Tief in JSON greifen – EAFP
    prompt: |
      API-Antworten sind tief verschachtelt, und nicht jedes Feld ist immer da. Schreibe `hole(daten, pfad, standard=None)`: `pfad` ist eine Folge von Schlüsseln und Listenindizes, etwa `("kunde", "adressen", 0, "ort")`. Gibt es den Pfad, liefere den Wert, sonst `standard`.

      Arbeite nach **EAFP**: einfach zugreifen und die passenden Exceptions fangen – nicht vorher mit `in`, `len` oder `isinstance` prüfen.
    lang: python
    starter: |
      def hole(daten, pfad, standard=None):
          for teil in pfad:
              daten = daten[teil]
          return daten
    solution: |
      def hole(daten, pfad, standard=None):
          try:
              for teil in pfad:
                  daten = daten[teil]
          except (KeyError, IndexError, TypeError):
              return standard
          return daten
    tests:
      - name: Vorhandener Pfad
        code: |
          antwort = {"kunde": {"adressen": [{"ort": "Köln"}, {"ort": "Bonn"}]}}
          assert hole(antwort, ("kunde", "adressen", 1, "ort")) == "Bonn"
          assert hole(antwort, ()) is antwort
      - name: Fehlender Schlüssel
        code: |
          assert hole({"kunde": {}}, ("kunde", "adressen", 0, "ort")) is None
      - name: Index außerhalb der Liste
        code: |
          assert hole({"kunde": {"adressen": []}}, ("kunde", "adressen", 0, "ort"), "unbekannt") == "unbekannt"
      - name: Falscher Typ auf dem Weg
        code: |
          # "adressen" ist hier ein String; "abc"["ort"] wirft TypeError, None[0] ebenso
          assert hole({"kunde": {"adressen": "abc"}}, ("kunde", "adressen", "ort"), "?") == "?"
          assert hole({"kunde": None}, ("kunde", 0), "?") == "?"
      - name: Falsy Werte sind echte Werte
        code: |
          assert hole({"rabatt": 0}, ("rabatt",), 10) == 0
          assert hole({"tags": []}, ("tags",), ["x"]) == []
    hints:
      - "`d[\"x\"]` auf einem Dictionary wirft `KeyError`, `liste[5]` wirft `IndexError`, `None[0]` oder `\"abc\"[\"ort\"]` werfen `TypeError`."
      - Umschließe die ganze Schleife mit einem `try` und fange die drei Typen als Tupel.
    explanation: |
      Jeder Zugriff kann auf genau drei Arten scheitern: Schlüssel fehlt (`KeyError`), Index fehlt (`IndexError`) oder der Zwischenwert lässt sich so gar nicht indizieren (`TypeError`). EAFP fängt genau diese drei, statt jeden Fall vorher mit `isinstance`, `in` und `len` abzufragen – kürzer und ohne Lücken. Wichtig ist, **nicht** `Exception` zu fangen: Ein Tippfehler im Code (`NameError`) soll weiterhin laut scheitern. Der Test mit `0` und `[]` zeigt, warum ein `or standard` falsch wäre: Falsy Werte sind gültige Ergebnisse.
    resources:
      - title: Glossary · EAFP
        url: https://docs.python.org/3/glossary.html#term-EAFP
      - title: Glossary · LBYL
        url: https://docs.python.org/3/glossary.html#term-LBYL

  - id: except-or
    type: bug
    title: Der TypeError rutscht durch
    prompt: |
      `als_zahl` soll für alles, was sich nicht in eine Zahl umwandeln lässt, `None` liefern. `als_zahl("abc")` gibt korrekt `None` zurück, aber `als_zahl(None)` bricht mit `TypeError: float() argument must be a string or a real number, not 'NoneType'` ab. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      def als_zahl(wert):
          try:
              return float(wert)
          except ValueError or TypeError:
              return None
    lines: [4]
    fix:
      - line: 4
        answers: ["except (ValueError, TypeError):", "except (TypeError, ValueError):", "except ValueError, TypeError:", "except TypeError, ValueError:"]
    explanation: |
      Hinter `except` steht ein **Ausdruck**. `ValueError or TypeError` wird ausgewertet, bevor irgendetwas gefangen wird: Eine Klasse ist truthy, also ergibt `or` den ersten Operanden, `ValueError`. Gefangen wird nur `ValueError`. Mehrere Typen gibst du als Tupel an: `except (ValueError, TypeError):`. Seit Python 3.14 ist auch die Form ohne Klammern erlaubt (PEP 758), solange kein `as` folgt.
    resources:
      - title: Language Reference · except clause
        url: https://docs.python.org/3/reference/compound_stmts.html#except-clause
      - title: PEP 758 – Allow except and except* expressions without parentheses
        url: https://peps.python.org/pep-0758/

  - id: bibliothek-basicconfig
    type: bug
    title: Die Bibliothek redet der Anwendung dazwischen
    prompt: |
      Eine Anwendung importiert `zahlung` und konfiguriert danach ihr Logging mit `logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")`. Im Betrieb erscheinen trotzdem die `DEBUG`-Zeilen der Bibliothek, und das Format der Anwendung fehlt: Es wirkt, als hätte ihr `basicConfig` nichts getan. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      # zahlung/__init__.py
      import logging

      logging.basicConfig(level=logging.DEBUG)
      log = logging.getLogger(__name__)

      def abbuchen(betrag_cent: int) -> bool:
          log.debug("Sende Abbuchung über %d Cent", betrag_cent)
          return betrag_cent > 0
    lines: [4]
    fix:
      - line: 4
        answers: ["logging.getLogger(__name__).addHandler(logging.NullHandler())", "logging.getLogger('zahlung').addHandler(logging.NullHandler())"]
    explanation: |
      `basicConfig` legt einen Handler am Root-Logger an, wenn dort noch keiner hängt. Läuft es beim Import der Bibliothek, ist der Root-Logger danach belegt, und der spätere Aufruf der Anwendung tut nichts (ohne `force=True`). Die Anwendung bekommt Level `DEBUG` und das Standardformat der Bibliothek. Eine Bibliothek konfiguriert kein Logging, denn Level, Format und Ziel gehören der Anwendung. Sie hängt höchstens einen `NullHandler` an den obersten Logger ihres Pakets: Er tut nichts, verhindert aber die Ausgabe über den Handler of last resort, solange die Anwendung nichts konfiguriert. Der Logger in Zeile 5 und seine `debug`-Aufrufe bleiben unverändert richtig.
    resources:
      - title: Logging HOWTO · Configuring Logging for a Library
        url: https://docs.python.org/3/howto/logging.html#configuring-logging-for-a-library
      - title: logging · basicConfig
        url: https://docs.python.org/3/library/logging.html#logging.basicConfig

  - id: import-reparieren
    type: code
    title: Repariere den Import, der alles verschluckt
    prompt: |
      `summiere(zeilen)` liest Zeilen im Format `"name;betrag_in_cent"`, summiert die Beträge und liefert `(summe, fehlerhafte_zeilennummern)`. Zeilennummern zählen ab 1.

      Der vorhandene Code hat zwei Probleme: Eine kaputte Zeile beendet die ganze Verarbeitung, und ein **Programmierfehler** des Aufrufers (etwa `None` statt eines Strings in der Liste) wird still als „fehlerhafte Zeile“ verbucht, statt laut zu scheitern. Repariere die Funktion: Nur Zeilen mit falschem Format oder falschem Betrag werden übersprungen, alles andere fliegt weiter.
    lang: python
    starter: |
      def summiere(zeilen: list[str]) -> tuple[int, list[int]]:
          summe = 0
          fehlerhaft = []
          try:
              for nummer, zeile in enumerate(zeilen, start=1):
                  name, betrag = zeile.split(";")
                  summe += int(betrag)
          except Exception:
              fehlerhaft.append(nummer)
          return summe, fehlerhaft
    solution: |
      def summiere(zeilen: list[str]) -> tuple[int, list[int]]:
          summe = 0
          fehlerhaft = []
          for nummer, zeile in enumerate(zeilen, start=1):
              try:
                  name, betrag = zeile.split(";")
                  wert = int(betrag)
              except ValueError:
                  fehlerhaft.append(nummer)
              else:
                  summe += wert
          return summe, fehlerhaft
    tests:
      - name: Alles gültig
        code: assert summiere(["Kaffee;450", "Tee;300"]) == (750, [])
      - name: Kaputte Zeile in der Mitte
        code: |
          ergebnis = summiere(["Kaffee;450", "Tee;drei", "Kakao;250"])
          assert ergebnis == (700, [2]), f"bekommen {ergebnis!r} – geht es nach Zeile 2 weiter?"
      - name: Falsches Format
        code: |
          ergebnis = summiere(["ohne Trenner", "a;1;2", "Keks;100"])
          assert ergebnis == (100, [1, 2]), f"bekommen {ergebnis!r}"
      - name: Programmierfehler bleiben sichtbar
        code: |
          try:
              summiere(["Kaffee;450", None])
          except AttributeError:
              pass
          else:
              raise AssertionError("None in der Liste ist ein Programmierfehler und darf nicht verschluckt werden")
    hints:
      - Das `try` muss **in** die Schleife, damit es nach einer kaputten Zeile weitergeht.
      - "Welche Exception werfen `\"a;1;2\".split(\";\")` beim Entpacken in zwei Namen und `int(\"drei\")`? Beide dieselbe."
      - "Fange nur `ValueError`. `None.split` wirft `AttributeError` und soll durchfliegen."
    explanation: |
      Das `try` um die ganze Schleife beendet sie beim ersten Fehler; pro Zeile gehört ein eigenes `try` in die Schleife. Beide erwarteten Datenfehler sind `ValueError`: `int("drei")` und das Entpacken, wenn `split` nicht genau zwei Teile liefert. `except Exception` hätte zusätzlich den `AttributeError` von `None.split` verschluckt – ein Bug beim Aufrufer wäre als „Datenfehler“ getarnt worden. Die Addition steht im `else`, sodass nur die riskanten Zeilen im `try` liegen.
    resources:
      - title: Tutorial · Handling Exceptions
        url: https://docs.python.org/3/tutorial/errors.html#handling-exceptions

  - id: zirkulaer-erklaeren
    type: explain
    title: Warum scheitert dieser Import?
    prompt: |
      `python -c "import shop.modelle"` endet mit:

      ```text
      ImportError: cannot import name 'Artikel' from partially initialized module 'shop.modelle' (most likely due to a circular import)
      ```

      Erkläre Schritt für Schritt, wie es dazu kommt, und schlage eine saubere Lösung vor.
    lang: python
    code: |
      # shop/modelle.py
      from shop.preise import netto_zu_brutto

      class Artikel:
          def __init__(self, name: str, netto: int) -> None:
              self.name = name
              self.brutto = netto_zu_brutto(netto)

      # shop/preise.py
      from shop.modelle import Artikel

      MWST = 0.19

      def netto_zu_brutto(netto: int) -> int:
          return round(netto * (1 + MWST))

      def teuerster(artikel: list[Artikel]) -> Artikel:
          return max(artikel, key=lambda a: a.brutto)
    points:
      - Beim ersten Import legt Python das Modul `shop.modelle` in `sys.modules` an und führt es dann von oben nach unten aus.
      - Zeile 1 von `modelle` startet den Import von `shop.preise`, bevor `Artikel` definiert ist.
      - "`preise` findet `shop.modelle` in `sys.modules`, aber nur teilweise initialisiert – `Artikel` existiert noch nicht, daher der `ImportError`."
      - Lösung – die Abhängigkeit in eine Richtung bringen, etwa `netto_zu_brutto` und `MWST` in ein eigenes Modul verschieben, das nichts aus `modelle` importiert.
      - "Notlösungen – Import in die Funktion verlegen oder das Modul statt des Namens importieren, damit der Zugriff erst zur Laufzeit passiert."
    explanation: |
      `import shop.modelle` erzeugt das Modulobjekt, trägt es in `sys.modules` ein und beginnt, die Datei auszuführen. Schon die erste Zeile importiert `shop.preise`; also wird jetzt `preise.py` ausgeführt. Deren erste Zeile will `Artikel` aus `shop.modelle` holen. Das Modul steht zwar schon in `sys.modules`, ist aber erst bis Zeile 1 ausgeführt – `Artikel` gibt es noch nicht, daher „partially initialized“. Sauber lösen lässt sich das, indem die Preislogik (`MWST`, `netto_zu_brutto`) in ein Modul ohne Rückabhängigkeit wandert, etwa `shop/steuern.py`; `modelle` und `preise` importieren dann beide daraus, und der Kreis ist weg. `teuerster` braucht `Artikel` hier nur für die Typannotation; ein Import innerhalb von `if TYPE_CHECKING:` oder das Verschieben in ein anderes Modul wären weitere Wege.
    resources:
      - title: Language Reference · The module cache
        url: https://docs.python.org/3/reference/import.html#the-module-cache

  - id: dictconfig-lesen
    type: explain
    title: Was bewirkt diese Logging-Konfiguration?
    prompt: |
      Erkläre diese Konfiguration, wie du es im Code-Review tun würdest: Was passiert mit einer `DEBUG`- und einer `INFO`-Meldung von `shop.zahlung`, und was mit einer `INFO`- und einer `WARNING`-Meldung von `fremdlib`? Wozu dienen `disable_existing_loggers: False` und `propagate: False`, und wo darf `dictConfig` aufgerufen werden?
    lang: python
    code: |
      import logging.config

      LOGGING = {
          "version": 1,
          "disable_existing_loggers": False,
          "formatters": {
              "zeile": {"format": "%(asctime)s %(levelname)s %(name)s: %(message)s"},
          },
          "handlers": {
              "stdout": {
                  "class": "logging.StreamHandler",
                  "stream": "ext://sys.stdout",
                  "formatter": "zeile",
                  "level": "INFO",
              },
          },
          "loggers": {
              "shop": {"level": "DEBUG", "handlers": ["stdout"], "propagate": False},
          },
          "root": {"level": "WARNING", "handlers": ["stdout"]},
      }

      def main() -> None:
          logging.config.dictConfig(LOGGING)
          ...
    points:
      - "`shop.zahlung` erbt `DEBUG` von `shop`, aber der Handler steht auf `INFO`: Die `DEBUG`-Meldung verwirft der Handler, die `INFO`-Meldung erscheint auf stdout."
      - "`fremdlib` hat keine eigene Konfiguration und läuft über `root` (`WARNING`): Die Warnung erscheint, die `INFO`-Meldung wird verworfen."
      - "`propagate: False` verhindert, dass `shop`-Meldungen zusätzlich über den Handler von `root` laufen und doppelt erscheinen."
      - "`disable_existing_loggers: False` lässt Logger aktiv, die schon beim Import angelegt wurden. Der Standard `True` würde sie stumm schalten."
      - "`dictConfig` läuft einmal im Einstiegspunkt (`main`), nie auf Modulebene und nie in einer Bibliothek."
    explanation: |
      Meldungen durchlaufen zwei Schranken: das effektive Level des Loggers und das Level jedes Handlers. `shop` lässt ab `DEBUG` durch, der Handler `stdout` zeigt erst ab `INFO`; eine Änderung des Handler-Levels auf `DEBUG` würde in der Entwicklung alle Details sichtbar machen. Logger ohne eigenen Eintrag wie `fremdlib` erben das Level von `root`, hier `WARNING`, und nutzen dessen Handler. Ohne `propagate: False` bekäme jede `shop`-Meldung eine zweite Ausgabe über `root`, weil derselbe Handler dort hängt. `disable_existing_loggers: False` ist wichtig, weil Module ihre Logger beim Import anlegen, also vor dem `dictConfig`-Aufruf. Die Konfiguration gehört in den Einstiegspunkt der Anwendung, weil nur sie weiß, wohin Logs gehen sollen.
    resources:
      - title: logging.config · Configuration dictionary schema
        url: https://docs.python.org/3/library/logging.config.html#configuration-dictionary-schema
      - title: Logging HOWTO · Logging flow
        url: https://docs.python.org/3/howto/logging.html#logging-flow

  - id: wiederholen-mit-logging
    type: code
    title: Wiederholen mit Logging
    prompt: |
      Netzwerkaufrufe scheitern manchmal vorübergehend. Schreibe `mit_wiederholung(aktion, versuche=3, erlaubt=(TimeoutError, ConnectionError))`:

      - Ruft `aktion()` auf und gibt deren Ergebnis zurück.
      - Wirft `aktion` eine Exception aus `erlaubt`, loggt die Funktion über den Logger `"netz"` eine Warnung im Format `Versuch 1/3 fehlgeschlagen: <Nachricht der Exception>` und versucht es erneut.
      - Scheitert auch der letzte Versuch, wird **die letzte Exception unverändert** weitergeworfen.
      - Andere Exceptions (etwa `ValueError`) fliegen sofort weiter, ohne weiteren Versuch.

      Kein `sleep` nötig. Konfiguriere kein Logging in der Funktion.
    lang: python
    starter: |
      import logging

      logger = logging.getLogger("netz")

      def mit_wiederholung(aktion, versuche=3, erlaubt=(TimeoutError, ConnectionError)):
          try:
              return aktion()
          except Exception:
              print("Fehler!")
              return None
    solution: |
      import logging

      logger = logging.getLogger("netz")

      def mit_wiederholung(aktion, versuche=3, erlaubt=(TimeoutError, ConnectionError)):
          for versuch in range(1, versuche + 1):
              try:
                  return aktion()
              except erlaubt as fehler:
                  logger.warning("Versuch %d/%d fehlgeschlagen: %s", versuch, versuche, fehler)
                  if versuch == versuche:
                      raise
    setup: |
      import unittest

      def fake(*ergebnisse):
          """Liefert eine Aktion, die nacheinander die Ergebnisse zurückgibt oder Exceptions wirft."""
          aufrufe = []
          def aktion():
              aufrufe.append(1)
              wert = ergebnisse[len(aufrufe) - 1]
              if isinstance(wert, BaseException):
                  raise wert
              return wert
          aktion.aufrufe = aufrufe
          return aktion

      pruefer = unittest.TestCase()
    tests:
      - name: Erfolg beim ersten Versuch
        code: |
          aktion = fake("ok")
          assert mit_wiederholung(aktion) == "ok"
          assert len(aktion.aufrufe) == 1
      - name: Erfolg nach zwei Timeouts, mit Warnungen
        code: |
          aktion = fake(TimeoutError("zu langsam"), ConnectionError("reset"), "ok")
          with pruefer.assertLogs("netz", level="WARNING") as logs:
              assert mit_wiederholung(aktion) == "ok"
          assert logs.output == [
              "WARNING:netz:Versuch 1/3 fehlgeschlagen: zu langsam",
              "WARNING:netz:Versuch 2/3 fehlgeschlagen: reset",
          ], f"Log: {logs.output}"
      - name: Letzter Fehler wird weitergeworfen
        code: |
          letzter = TimeoutError("dritter")
          aktion = fake(TimeoutError("erster"), TimeoutError("zweiter"), letzter)
          try:
              with pruefer.assertLogs("netz", level="WARNING"):
                  mit_wiederholung(aktion)
          except TimeoutError as e:
              assert e is letzter, "die letzte Exception soll unverändert weiterfliegen"
          else:
              raise AssertionError("nach drei Timeouts muss TimeoutError fliegen")
          assert len(aktion.aufrufe) == 3
      - name: Andere Fehler sofort weiter
        code: |
          aktion = fake(ValueError("kaputte Antwort"), "ok")
          try:
              mit_wiederholung(aktion)
          except ValueError:
              pass
          else:
              raise AssertionError("ValueError soll sofort weiterfliegen")
          assert len(aktion.aufrufe) == 1, "bei ValueError kein zweiter Versuch"
      - name: Anzahl der Versuche ist einstellbar
        code: |
          aktion = fake(ConnectionError("a"), ConnectionError("b"))
          try:
              with pruefer.assertLogs("netz", level="WARNING"):
                  mit_wiederholung(aktion, versuche=2)
          except ConnectionError:
              pass
          assert len(aktion.aufrufe) == 2
    hints:
      - "`except erlaubt as fehler:` funktioniert, weil `erlaubt` ein Tupel von Klassen ist."
      - "Platzhalter statt f-String: `logger.warning(\"Versuch %d/%d fehlgeschlagen: %s\", versuch, versuche, fehler)`."
      - Ein nacktes `raise` im `except`-Block wirft genau die gefangene Exception weiter – samt Traceback.
    explanation: |
      Die Schleife über `range(1, versuche + 1)` zählt die Versuche menschenlesbar. `except erlaubt` fängt nur vorübergehende Fehler; ein `ValueError` wird gar nicht erst gefangen und fliegt sofort weiter. Beim letzten Versuch wirft das nackte `raise` die Original-Exception mit ihrem Traceback weiter – ein neues `raise TimeoutError(...)` würde die Ursache verlieren. Die Funktion loggt nur, sie konfiguriert nichts; ob die Warnungen irgendwo erscheinen, entscheidet die Anwendung. `assertLogs` ist das `unittest`-Gegenstück zu pytests `caplog`. In echtem Code käme zwischen den Versuchen noch eine wachsende Wartezeit (Backoff).
    resources:
      - title: logging · Logger.warning und Logging-Level
        url: https://docs.python.org/3/library/logging.html#logging-levels
      - title: Logging HOWTO · Logging variable data
        url: https://docs.python.org/3/howto/logging.html#logging-variable-data

  - id: log-config-bauen
    type: code
    title: Eine dictConfig-Konfiguration bauen
    prompt: |
      Schreibe `baue_config(level, handler_factory)`. Die Funktion liefert ein Dictionary für `logging.config.dictConfig`:

      - `version` ist `1`, bereits angelegte Logger bleiben aktiv.
      - Ein Formatter `standard` mit dem Format `%(levelname)s %(name)s: %(message)s`.
      - Ein Handler `sammler`: Er wird von `handler_factory` erzeugt (Schlüssel `"()"`), nutzt den Formatter `standard` und lässt alles ab `DEBUG` durch.
      - Ein Logger `shop` mit dem übergebenen `level` (ein String wie `"INFO"`) und dem Handler `sammler`. Seine Meldungen gehen **nicht** zusätzlich an `root`.
      - `root` mit Level `WARNING` und demselben Handler.

      Die Tests laden dein Dictionary mit `dictConfig` und lesen aus, was der Handler gesammelt hat. Rufe `dictConfig` nicht selbst auf.
    lang: python
    starter: |
      def baue_config(level, handler_factory):
          return {
              "version": 1,
              # formatters, handlers, loggers und root fehlen noch
          }
    solution: |
      def baue_config(level, handler_factory):
          return {
              "version": 1,
              "disable_existing_loggers": False,
              "formatters": {
                  "standard": {"format": "%(levelname)s %(name)s: %(message)s"},
              },
              "handlers": {
                  "sammler": {"()": handler_factory, "formatter": "standard", "level": "DEBUG"},
              },
              "loggers": {
                  "shop": {"level": level, "handlers": ["sammler"], "propagate": False},
              },
              "root": {"level": "WARNING", "handlers": ["sammler"]},
          }
    setup: |
      import logging
      import logging.config
      from contextlib import contextmanager

      class ListHandler(logging.Handler):
          """Sammelt formatierte Zeilen in einer Liste, statt sie auszugeben."""

          def __init__(self):
              super().__init__()
              self.zeilen = []

          def emit(self, record):
              self.zeilen.append(self.format(record))

      def _aufraeumen():
          wurzel = logging.getLogger()
          wurzel.handlers.clear()
          wurzel.setLevel(logging.WARNING)
          for name in ("shop", "shop.import", "fremd"):
              logger = logging.getLogger(name)
              logger.handlers.clear()
              logger.setLevel(logging.NOTSET)
              logger.disabled = False
              logger.propagate = True

      @contextmanager
      def geladen(level):
          """Lädt baue_config(level, …) und liefert die Liste der gesammelten Zeilen. Räumt danach auf."""
          erzeugt = []

          def fabrik():
              handler = ListHandler()
              erzeugt.append(handler)
              return handler

          _aufraeumen()
          try:
              logging.config.dictConfig(baue_config(level, fabrik))
              assert erzeugt, "dictConfig hat über handler_factory keinen Handler erzeugt"
              yield erzeugt[0].zeilen
          finally:
              _aufraeumen()
    tests:
      - name: Format und Level des Loggers shop
        code: |
          with geladen("INFO") as zeilen:
              logging.getLogger("shop.import").debug("Details")
              logging.getLogger("shop.import").info("12 Zeilen")
          assert zeilen == ["INFO shop.import: 12 Zeilen"], f"bekommen {zeilen!r}"
      - name: Das Level ist einstellbar
        code: |
          with geladen("DEBUG") as zeilen:
              logging.getLogger("shop").debug("Details")
          assert zeilen == ["DEBUG shop: Details"], f"bekommen {zeilen!r}"
      - name: Jede Meldung erscheint genau einmal
        code: |
          with geladen("INFO") as zeilen:
              logging.getLogger("shop").warning("Achtung")
          assert zeilen == ["WARNING shop: Achtung"], f"bekommen {zeilen!r}; propagate sollte False sein"
      - name: Fremde Logger laufen über root ab WARNING
        code: |
          with geladen("INFO") as zeilen:
              logging.getLogger("fremd").info("leise")
              logging.getLogger("fremd").warning("laut")
          assert zeilen == ["WARNING fremd: laut"], f"bekommen {zeilen!r}"
      - name: Bereits angelegte Logger bleiben aktiv
        code: |
          vorher = logging.getLogger("fremd")
          with geladen("INFO") as zeilen:
              vorher.error("alt aber aktiv")
          assert zeilen == ["ERROR fremd: alt aber aktiv"], f"bekommen {zeilen!r}"
    hints:
      - "Die Schlüssel auf oberster Ebene: `version`, `disable_existing_loggers`, `formatters`, `handlers`, `loggers`, `root`."
      - "Ein Handler mit Factory: `{\"()\": handler_factory, \"formatter\": \"standard\", \"level\": \"DEBUG\"}`. Ein Schlüssel `class` kommt nicht dazu."
      - "`propagate: False` im Logger `shop` verhindert die doppelte Ausgabe über `root`."
    explanation: |
      `dictConfig` baut aus dem Dictionary Formatter, Handler und Logger und verbindet sie über ihre Namen. Mit `"()"` ruft es `handler_factory` auf, statt eine Klasse über ihren Pfad zu importieren; so landet in den Tests ein Handler, der in eine Liste schreibt. `disable_existing_loggers: False` hält `fremd` aktiv, das vor dem Laden entstand. Ohne `propagate: False` im Logger `shop` liefe jede Meldung zusätzlich über den Handler von `root`, und der Handler würde sie zweimal sammeln. Wegen der gemeinsamen Namensräume räumen die Tests den Logging-Zustand nach jedem Lauf auf. In einem echten Programm läuft `dictConfig` einmal in `main()`.
    resources:
      - title: logging.config · dictConfig
        url: https://docs.python.org/3/library/logging.config.html#logging.config.dictConfig
      - title: logging.config · User-defined objects
        url: https://docs.python.org/3/library/logging.config.html#user-defined-objects
