summary: Klassen, die sich wie eingebaute Typen verhalten – mit Properties, Dunder-Methoden, Dataclasses, Enums und klaren Schnittstellen statt tiefer Vererbung.
goals:
  - Du erklärst, was `self`, gebundene Methoden und die Attributsuche (Instanz → Klasse → MRO) bedeuten, und erkennst geteilten Zustand über Klassenattribute.
  - Du setzt `@classmethod` für alternative Konstruktoren und `@property` für Validierung und berechnete Werte ein.
