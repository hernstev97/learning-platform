summary: Klassen, die sich wie eingebaute Typen verhalten – mit Properties, Dunder-Methoden, Dataclasses, Enums und klaren Schnittstellen statt tiefer Vererbung.
goals:
  - Du erklärst, was `self`, gebundene Methoden und die Attributsuche (Instanz → Klasse → MRO) bedeuten, und erkennst geteilten Zustand über Klassenattribute.
  - Du setzt `@classmethod` für alternative Konstruktoren und `@property` für Validierung und berechnete Werte ein.
  - Du implementierst `__repr__`, `__eq__`, `__hash__`, `__len__`, `__iter__`, `__contains__` und `__lt__` passend zum Datenmodell.
  - Du modellierst Werte mit `@dataclass` (`field(default_factory=…)`, `frozen`, `order`, `slots`, `__post_init__`) und Zustände mit `Enum`.
  - Du begründest, wann Komposition besser ist als Vererbung und wann `abc.ABC` oder `typing.Protocol` passt.
  - Du wandelst Dataclasses mit `asdict`, `astuple` und `replace` um, kennst die Falle der rekursiven Tiefenkopie und wählst begründet zwischen `@dataclass`, `NamedTuple`, `TypedDict` und pydantic.
