lesson: |
  Klassen kennst du aus TypeScript und Kotlin. In Python sehen sie ähnlich aus, funktionieren aber anders: Eine Klasse ist selbst ein Objekt, das beim Ausführen der `class`-Anweisung entsteht. Attribute liegen in einem Dictionary, es gibt kein `private`, und fast jede Syntax – `len(x)`, `x == y`, `for a in x`, `print(x)` – ruft eine Methode mit doppeltem Unterstrich auf. Wer dieses Modell verstanden hat, schreibt Klassen, die sich wie eingebaute Typen anfühlen, und erkennt die typischen Fehler im Code-Review sofort.

  Die Lektion geht von der einfachsten Klasse zu den Werkzeugen, die du in echten Codebasen täglich siehst: Properties, Dunder-Methoden, Dataclasses, Enums und Schnittstellen. Grundlage sind das [Klassen-Kapitel des Tutorials](https://docs.python.org/3/tutorial/classes.html) und das [Datenmodell der Sprachreferenz](https://docs.python.org/3/reference/datamodel.html).

  ## Klassen, Instanzen und `self`

  ```python run
  class Konto:
      waehrung = "EUR"                      # Klassenattribut: gehört der Klasse

      def __init__(self, inhaber: str, saldo: int = 0) -> None:
          self.inhaber = inhaber            # Instanzattribute: gehören dem Objekt
          self.saldo = saldo

      def einzahlen(self, betrag: int) -> None:
          if betrag <= 0:
              raise ValueError("Betrag muss positiv sein")
          self.saldo += betrag

  konto = Konto("Ada", 100)
  konto.einzahlen(50)
  Konto.einzahlen(konto, 25)                # dasselbe wie konto.einzahlen(25)
  print(konto.saldo, konto.waehrung)
  print(konto.__dict__)                     # nur die Instanzattribute
  print(konto.einzahlen)                    # gebundene Methode: Funktion + Objekt
  ```

  Was hier passiert:

  - `Konto("Ada", 100)` erzeugt ein neues, leeres Objekt und ruft danach `__init__` mit diesem Objekt als erstem Argument auf. `__init__` ist also kein Konstruktor wie in Kotlin, sondern ein **Initialisierer**: Das Objekt existiert schon ([`object.__init__`](https://docs.python.org/3/reference/datamodel.html#object.__init__)).
  - `self` ist kein Schlüsselwort, sondern nur der übliche Name des ersten Parameters. Python übergibt das Objekt automatisch, weil `konto.einzahlen` eine **gebundene Methode** ist – die Funktion aus der Klasse plus das Objekt ([Method Objects](https://docs.python.org/3/tutorial/classes.html#method-objects)). `konto.einzahlen(50)` ist `Konto.einzahlen(konto, 50)`.
  - **Lesen** von `konto.waehrung` sucht zuerst im Instanz-Dictionary `konto.__dict__`, dann in der Klasse, dann in den Basisklassen. **Zuweisen** mit `konto.x = …` schreibt dagegen immer in das Instanz-Dictionary.

  ### Klassenattribute und geteilter Zustand

  Aus dieser Asymmetrie zwischen Lesen und Schreiben entsteht einer der häufigsten Python-Bugs:

  ```python run
  class Warenkorb:
      artikel = []                          # FALSCH: eine Liste für alle Warenkörbe

      def hinzufuegen(self, name: str) -> None:
          self.artikel.append(name)         # liest das Klassenattribut und verändert es

  a = Warenkorb()
  b = Warenkorb()
  a.hinzufuegen("Kaffee")
  print(b.artikel)                          # ['Kaffee'] – b sieht die Artikel von a
  print(a.artikel is b.artikel is Warenkorb.artikel)
  ```

  `self.artikel.append(...)` **liest** `artikel` (gefunden in der Klasse) und **verändert** dann dieses eine Listenobjekt. Bei `self.anzahl += 1` mit einem Klassenattribut `anzahl = 0` ist es anders: `+=` liest den Wert aus der Klasse und **weist** das Ergebnis der Instanz zu. Das sieht korrekt aus und verschleiert den Fehler. Das Tutorial zeigt genau diese Falle im Abschnitt [Class and Instance Variables](https://docs.python.org/3/tutorial/classes.html#class-and-instance-variables).

  > [!MERKE]
  > Veränderlicher Zustand gehört in `__init__` (`self.artikel = []`). Klassenattribute sind für Konstanten und bewusst geteilte Werte da.

  ## Methoden: Instanz, Klasse, statisch – und Properties

  ### `@classmethod` für alternative Konstruktoren

  Python kennt kein Überladen von Konstruktoren. Stattdessen gibt es benannte **alternative Konstruktoren** als [`classmethod`](https://docs.python.org/3/library/functions.html#classmethod): Sie bekommen die Klasse als `cls` statt einer Instanz. Die Standardbibliothek macht das überall: `date.fromisoformat`, `dict.fromkeys`, `datetime.fromtimestamp`.

  ```python run
  from datetime import date

  class Mitarbeiter:
      def __init__(self, name: str, eintritt: date) -> None:
          self.name = name
          self.eintritt = eintritt

      @classmethod
      def aus_dict(cls, daten: dict) -> "Mitarbeiter":
          return cls(daten["name"], date.fromisoformat(daten["eintritt"]))

      @staticmethod
      def ist_gueltiger_name(name: str) -> bool:
          return bool(name.strip())

  class Werkstudent(Mitarbeiter):
      pass

  m = Werkstudent.aus_dict({"name": "Lin", "eintritt": "2026-04-01"})
  print(type(m).__name__, m.eintritt.year)
  print(Mitarbeiter.ist_gueltiger_name("   "))
  ```

  Weil `aus_dict` `cls(...)` aufruft und nicht `Mitarbeiter(...)`, liefert `Werkstudent.aus_dict` einen `Werkstudent`. Eine [`staticmethod`](https://docs.python.org/3/library/functions.html#staticmethod) bekommt weder `self` noch `cls`; sie ist eine normale Funktion im Namensraum der Klasse. Brauchst du sie nicht als Teil der Klassen-API, ist eine Funktion auf Modulebene meist klarer.

  ### `@property`: erst Attribut, später Logik

  In Java schreibt man Getter und Setter vorsorglich. In Python beginnst du mit einem öffentlichen Attribut. Wird später Validierung nötig, machst du daraus eine [`property`](https://docs.python.org/3/library/functions.html#property) – der aufrufende Code bleibt unverändert, `p.preis_cent = 5` sieht weiter wie eine Zuweisung aus. Das entspricht Kotlins Properties mit eigenem `get()`/`set()`.

  ```python run
  class Produkt:
      def __init__(self, name: str, preis_cent: int) -> None:
          self.name = name
          self.preis_cent = preis_cent      # läuft bereits durch den Setter

      @property
      def preis_cent(self) -> int:
          return self._preis_cent

      @preis_cent.setter
      def preis_cent(self, wert: int) -> None:
          if wert < 0:
              raise ValueError(f"Preis darf nicht negativ sein: {wert}")
          self._preis_cent = wert           # speichern unter anderem Namen!

      @property
      def preis_euro(self) -> str:          # berechnet, ohne Setter: schreibgeschützt
          return f"{self._preis_cent / 100:.2f} €"

  p = Produkt("Tastatur", 4999)
  print(p.preis_euro)
  try:
      p.preis_cent = -1
  except ValueError as fehler:
      print("abgelehnt:", fehler)
  try:
      p.preis_euro = "1 €"
  except AttributeError as fehler:
      print("AttributeError:", fehler)
  ```

  Der Wert liegt in `_preis_cent`. Der einfache Unterstrich ist nur eine **Konvention** für „intern“ – Python schützt nichts. Im Setter muss `self._preis_cent` stehen: `self.preis_cent = wert` würde den Setter erneut aufrufen, bis ein `RecursionError` kommt. Zwei Unterstriche (`self.__preis`) lösen [Name Mangling](https://docs.python.org/3/tutorial/classes.html#private-variables) aus; das verhindert Namenskollisionen in Unterklassen, ist aber ebenfalls kein Zugriffsschutz.

  > [!DEEP] Warum läuft `self.preis_cent = …` in `__init__` durch den Setter?
  > Eine Property ist ein **Data Descriptor** in der Klasse. Bei der Attributsuche gewinnt ein Data Descriptor der Klasse gegen das Instanz-Dictionary – beim Lesen und beim Schreiben. Details: [Descriptor HowTo Guide · Properties](https://docs.python.org/3/howto/descriptor.html#properties).

  ## Vererbung, `super()` und Komposition

  ```python run
  class Benachrichtigung:
      def __init__(self, empfaenger: str) -> None:
          self.empfaenger = empfaenger

      def text(self) -> str:
          return f"An {self.empfaenger}"

  class Email(Benachrichtigung):
      def __init__(self, empfaenger: str, betreff: str) -> None:
          super().__init__(empfaenger)      # sonst fehlt self.empfaenger
          self.betreff = betreff

      def text(self) -> str:                # überschreiben und erweitern
          return f"{super().text()}: {self.betreff}"

  mail = Email("ops@firma.de", "Backup fehlgeschlagen")
  print(mail.text())
  print(isinstance(mail, Benachrichtigung))
  ```

  Python erlaubt **Mehrfachvererbung**. Damit dabei jede Methode eindeutig gefunden wird, berechnet Python für jede Klasse eine lineare Reihenfolge, die [Method Resolution Order](https://docs.python.org/3/glossary.html#term-method-resolution-order) (MRO), sichtbar in `Klasse.__mro__`. Regeln: Jede Klasse steht vor ihren Basisklassen, und die Reihenfolge der Basisklassen in der `class`-Zeile bleibt erhalten.

  Wichtig für das Denkmodell: [`super()`](https://docs.python.org/3/library/functions.html#super) heißt nicht „meine Elternklasse“, sondern „die **nächste** Klasse in der MRO des tatsächlichen Objekts“. Bei Mixins kann das eine Geschwisterklasse sein:

  ```python run
  class Basis:
      def beschreiben(self) -> list[str]:
          return ["Basis"]

  class JsonMixin(Basis):
      def beschreiben(self) -> list[str]:
          return ["JsonMixin"] + super().beschreiben()

  class LogMixin(Basis):
      def beschreiben(self) -> list[str]:
          return ["LogMixin"] + super().beschreiben()

  class Export(JsonMixin, LogMixin):
      pass

  print([k.__name__ for k in Export.__mro__])
  print(Export().beschreiben())     # super() in JsonMixin landet bei LogMixin
  ```

  Das funktioniert nur, wenn **jede** Klasse der Kette `super()` aufruft („kooperative Mehrfachvererbung“). Den Algorithmus dahinter (C3-Linearisierung) beschreibt [The Python 2.3 Method Resolution Order](https://docs.python.org/3/howto/mro.html).

  ### Komposition statt Vererbung

  Vererbung modelliert „ist ein“, Komposition „hat ein“. Vererbung zur Wiederverwendung von Code führt schnell zu Hierarchien wie `EmailMitRetryUndLog` und zu Unterklassen, die bei jeder Änderung der Basisklasse brechen. Häufig ist es besser, das veränderliche Verhalten als Objekt hereinzugeben:

  ```python run
  class ConsoleKanal:
      def senden(self, empfaenger: str, text: str) -> None:
          print(f"[console] {empfaenger}: {text}")

  class Melder:
      """Hat einen Kanal, statt einer zu sein – der Kanal ist austauschbar."""

      def __init__(self, kanal) -> None:
          self.kanal = kanal

      def melden(self, empfaenger: str, text: str) -> None:
          self.kanal.senden(empfaenger, f"[ALARM] {text}")

  Melder(ConsoleKanal()).melden("ops", "Festplatte zu 90 % voll")
  ```

  Im Test übergibst du einen Fake-Kanal, der Nachrichten in einer Liste sammelt; in Produktion einen E-Mail- oder Slack-Kanal. `Melder` ändert sich dafür nicht.

  ## Das Datenmodell: Dunder-Methoden

  Python übersetzt Syntax in Aufrufe von [Special Methods](https://docs.python.org/3/glossary.html#term-special-method) („Dunder-Methoden“, von *double underscore*). Genau genommen sucht Python sie auf dem **Typ**, nicht auf der Instanz ([Special method lookup](https://docs.python.org/3/reference/datamodel.html#special-method-lookup)).

  | Syntax | ruft auf |
  | --- | --- |
  | `repr(x)`, REPL, Container-Ausgabe | `x.__repr__()` |
  | `str(x)`, `print(x)`, `f"{x}"` | `x.__str__()` (Standard: fällt auf `__repr__` zurück) |
  | `x == y` | `x.__eq__(y)` |
  | `hash(x)`, `x` als `dict`-Schlüssel oder in `set` | `x.__hash__()` |
  | `len(x)`, `bool(x)` ohne `__bool__` | `x.__len__()` |
  | `for a in x`, `list(x)` | `x.__iter__()` |
  | `a in x` | `x.__contains__(a)` (sonst Iteration) |
  | `x < y` | `x.__lt__(y)` |

  ### `__repr__` für Entwickler, `__str__` für Menschen

  [`__repr__`](https://docs.python.org/3/reference/datamodel.html#object.__repr__) soll eindeutig sein und möglichst wie gültiger Python-Code aussehen, der das Objekt wieder erzeugt. Es erscheint in der REPL, im Debugger, in Logs und – wichtig – wenn das Objekt **in einem Container** ausgegeben wird: `print([x])` benutzt `repr` für die Elemente. [`__str__`](https://docs.python.org/3/reference/datamodel.html#object.__str__) ist für Endnutzer; fehlt es, nimmt Python `__repr__`. Schreib deshalb immer zuerst `__repr__`.

  ### `__eq__` und `__hash__` gehören zusammen

  Ohne eigenes `__eq__` vergleicht `==` die Identität. Definierst du `__eq__`, setzt Python `__hash__` automatisch auf `None` – die Objekte sind dann **nicht mehr hashbar** und passen weder in ein `set` noch als `dict`-Schlüssel. Die Regel aus [`object.__hash__`](https://docs.python.org/3/reference/datamodel.html#object.__hash__): Gleiche Objekte müssen gleiche Hashes haben. Also bildest du den Hash aus genau den Feldern, die `__eq__` vergleicht – und diese Felder dürfen sich nicht mehr ändern, solange das Objekt in einem Set steckt.

  Bei fremden Typen gibt `__eq__` `NotImplemented` zurück (nicht `False` und keine Exception). Dann fragt Python die andere Seite und fällt am Ende auf den Identitätsvergleich zurück. Für Sortierung genügen `__eq__` und `__lt__`; [`functools.total_ordering`](https://docs.python.org/3/library/functools.html#functools.total_ordering) ergänzt `<=`, `>` und `>=`.

  ```python run
  from functools import total_ordering

  @total_ordering
  class Geld:
      def __init__(self, cent: int, waehrung: str = "EUR") -> None:
          self.cent = cent
          self.waehrung = waehrung

      def __repr__(self) -> str:
          return f"Geld({self.cent!r}, {self.waehrung!r})"

      def __str__(self) -> str:
          return f"{self.cent / 100:.2f} {self.waehrung}"

      def __eq__(self, other: object) -> bool:
          if not isinstance(other, Geld):
              return NotImplemented
          return (self.cent, self.waehrung) == (other.cent, other.waehrung)

      def __hash__(self) -> int:
          return hash((self.cent, self.waehrung))

      def __lt__(self, other: object) -> bool:
          if not isinstance(other, Geld):
              return NotImplemented
          if self.waehrung != other.waehrung:
              raise ValueError("Verschiedene Währungen sind nicht vergleichbar")
          return self.cent < other.cent

  preise = [Geld(1999), Geld(499), Geld(1999)]
  print(preise)                             # repr der Elemente
  print(min(preise), max(preise))           # str
  print(len(set(preise)), Geld(499) >= Geld(100), Geld(1) == "1 Cent")
  ```

  > [!WARNING] Hash aus veränderlichen Feldern
  > `Geld` oben ist noch veränderlich: `g.cent = 5` ändert den Hash eines Objekts, das vielleicht schon in einem Set steckt – es ist danach dort nicht mehr auffindbar. Für Werte-Objekte ist deshalb `@dataclass(frozen=True)` das bessere Werkzeug (nächster Abschnitt).

  ### Container-Protokoll: `__len__`, `__iter__`, `__contains__`

  ```python run
  class Logbuch:
      def __init__(self) -> None:
          self._eintraege: list[str] = []

      def schreiben(self, zeile: str) -> None:
          self._eintraege.append(zeile)

      def __len__(self) -> int:
          return len(self._eintraege)

      def __iter__(self):
          return iter(self._eintraege)

      def __contains__(self, suchtext: str) -> bool:
          return any(suchtext in zeile for zeile in self._eintraege)

  log = Logbuch()
  print(bool(log))                          # kein __bool__ → len(log) == 0 → False
  log.schreiben("ERROR db timeout")
  log.schreiben("INFO retry ok")
  print(len(log), "timeout" in log, [z.split()[0] for z in log])
  ```

  Du bestimmst die Bedeutung: Hier heißt `in` „kommt in einer Zeile vor“. Ohne `__contains__` würde `in` über `__iter__` nach einem **gleichen** Element suchen ([Emulating container types](https://docs.python.org/3/reference/datamodel.html#emulating-container-types)). `__iter__` gibt hier den Iterator der internen Liste zurück; wie Iteratoren funktionieren, zeigt das Modul „Iteratoren & Generatoren“.

  ## Werte modellieren: Dataclasses und Enums

  Für Klassen, die vor allem Daten tragen, schreibt [`@dataclass`](https://docs.python.org/3/library/dataclasses.html) `__init__`, `__repr__` und `__eq__` aus den Typannotationen:

  ```python run
  from dataclasses import dataclass, field, replace

  @dataclass(frozen=True, order=True, slots=True)
  class Geld:
      cent: int
      waehrung: str = "EUR"

      def __post_init__(self) -> None:
          if self.cent < 0:
              raise ValueError(f"negativer Betrag: {self.cent}")

  @dataclass
  class Rechnung:
      nummer: str
      positionen: list[Geld] = field(default_factory=list)

      def summe(self) -> Geld:
          return Geld(sum(p.cent for p in self.positionen))

  r = Rechnung("RE-1")
  r.positionen.append(Geld(1999))
  r.positionen.append(Geld(500))
  print(r)
  print(r.summe(), Geld(500) < Geld(1999), len({Geld(1), Geld(1)}))
  print(replace(Geld(100), cent=250))     # frozen: Änderungen erzeugen ein neues Objekt
  ```

  | Option | Wirkung |
  | --- | --- |
  | `eq=True` (Standard) | `__eq__` vergleicht alle Felder wie ein Tupel |
  | `order=True` | `<`, `<=`, `>`, `>=` vergleichen die Felder **in Definitionsreihenfolge** |
  | `frozen=True` | Zuweisung wirft `FrozenInstanceError`; zusammen mit `eq` entsteht ein `__hash__` |
  | `slots=True` (seit 3.10) | `__slots__` statt `__dict__`: weniger Speicher, Tippfehler bei Attributen fallen als `AttributeError` auf |
  | `kw_only=True` (seit 3.10) | Alle Felder nur als Keyword-Argument |

  Drei Regeln, die in Reviews auffallen:

  - Veränderliche Standardwerte wie `positionen: list = []` lehnt `dataclass` schon beim Definieren der Klasse ab (`ValueError: mutable default … use default_factory`). [`field(default_factory=list)`](https://docs.python.org/3/library/dataclasses.html#mutable-default-values) erzeugt für jedes Objekt eine neue Liste.
  - Validierung gehört in [`__post_init__`](https://docs.python.org/3/library/dataclasses.html#post-init-processing), das der generierte `__init__` am Ende aufruft.
  - Eine nicht eingefrorene Dataclass mit `eq=True` ist nicht hashbar – konsequent nach der Regel aus dem vorigen Abschnitt.

  Eine `@dataclass(frozen=True)` entspricht ungefähr Kotlins `data class` mit `val`-Feldern. Eine normale Klasse nimmst du, wenn Verhalten und Invarianten zwischen Feldern im Vordergrund stehen.

  ### Enums für feste Wertemengen

  Status, Rollen, Umgebungen: Statt loser Strings („offen“, „Offen“, „open“) definierst du eine [`Enum`](https://docs.python.org/3/library/enum.html#enum.Enum). Ihre Mitglieder sind Singletons, lassen sich mit `is` vergleichen und iterieren ([Enum HOWTO](https://docs.python.org/3/howto/enum.html)).

  ```python run
  from enum import Enum, StrEnum, auto

  class Status(Enum):
      OFFEN = "offen"
      IN_ARBEIT = "in_arbeit"
      ERLEDIGT = "erledigt"

  class Umgebung(StrEnum):
      DEV = auto()                          # Wert "dev"
      PROD = auto()

  s = Status("erledigt")                    # Suche über den Wert, etwa aus JSON
  print(s, s.name, s.value, s is Status.ERLEDIGT)
  print(Status["OFFEN"], list(Status)[-1])  # Suche über den Namen, Iteration
  print(Status.OFFEN == "offen", Umgebung.PROD == "prod")

  match s:
      case Status.OFFEN | Status.IN_ARBEIT:
          print("noch zu tun")
      case Status.ERLEDIGT:
          print("fertig")
  ```

  Ein normales `Enum`-Mitglied ist **nicht** gleich seinem Wert: `Status.OFFEN == "offen"` ist `False`. Wer Strings aus einer API vergleichen will, wandelt sie mit `Status(text)` um (unbekannte Werte werfen `ValueError`) oder nimmt [`StrEnum`](https://docs.python.org/3/library/enum.html#enum.StrEnum) (seit 3.11), dessen Mitglieder echte Strings sind.

  ## Schnittstellen: Duck Typing, ABC und Protocol

  Python prüft beim Aufruf keine Typen. Hat ein Objekt eine passende Methode `senden`, funktioniert `kanal.senden(...)` – das ist [Duck Typing](https://docs.python.org/3/glossary.html#term-duck-typing). In größeren Codebasen willst du den Vertrag trotzdem aufschreiben. Dafür gibt es zwei Werkzeuge:

  ```python run
  from abc import ABC, abstractmethod
  from typing import Protocol

  class Speicher(ABC):                      # nominal: Unterklassen müssen erben
      @abstractmethod
      def lesen(self, schluessel: str) -> bytes: ...

      def lesen_text(self, schluessel: str) -> str:   # geteilte Implementierung
          return self.lesen(schluessel).decode("utf-8")

  class Kanal(Protocol):                    # strukturell: wer senden() hat, passt
      def senden(self, empfaenger: str, text: str) -> None: ...

  class SmsKanal:                           # erbt NICHT von Kanal
      def senden(self, empfaenger: str, text: str) -> None:
          print(f"SMS an {empfaenger}: {text}")

  def alarmieren(kanal: Kanal) -> None:
      kanal.senden("+49 170 0000000", "Server down")

  alarmieren(SmsKanal())
  try:
      Speicher()
  except TypeError as fehler:
      print(fehler)
  ```

  - [`abc.ABC`](https://docs.python.org/3/library/abc.html#abc.ABC) mit [`@abstractmethod`](https://docs.python.org/3/library/abc.html#abc.abstractmethod) ist **nominal**: Eine Klasse erfüllt den Vertrag, weil sie erbt. Fehlt eine abstrakte Methode, scheitert schon das Erzeugen des Objekts mit `TypeError`. Eine ABC darf gemeinsame Implementierung mitliefern (`lesen_text`). Das ähnelt einer abstrakten Klasse in Kotlin.
  - [`typing.Protocol`](https://docs.python.org/3/library/typing.html#typing.Protocol) ist **strukturell** wie ein TypeScript-Interface: Jede Klasse mit passenden Methoden erfüllt es, ohne zu erben – auch Klassen aus fremden Bibliotheken. Geprüft wird von einem Type Checker wie mypy oder pyright, **nicht zur Laufzeit**. [`@runtime_checkable`](https://docs.python.org/3/library/typing.html#typing.runtime_checkable) erlaubt `isinstance`, prüft aber nur, ob die Methoden existieren, nicht ihre Signaturen.

  Faustregel: Ein `Protocol` beschreibt, was dein Code **von außen braucht** (Kanal, Uhr, Repository). Eine ABC nimmst du, wenn du eine Basisklasse mit geteilter Logik **anbietest** und Fehler früh beim Instanziieren sehen willst. Protokolle im Detail behandelt das Modul „Typisierung“.

  > [!INTERVIEW] „Was ist der Unterschied zwischen einer ABC und einem Protocol?“
  > „Eine ABC ist nominal: Man muss erben, und fehlende abstrakte Methoden fallen zur Laufzeit beim Instanziieren auf. Ein Protocol ist strukturell: Jede Klasse mit den passenden Methoden erfüllt es, geprüft wird statisch vom Type Checker. Für Abhängigkeiten, die ich injiziere – etwa eine Uhr oder einen Mail-Client –, nehme ich ein Protocol; dann passt im Test jedes einfache Fake-Objekt.“

  ## Häufige Fehler

  - **Veränderliches Klassenattribut als Instanzzustand.** Symptom: Daten „wandern“ zwischen Objekten. Behebung: in `__init__` anlegen oder `field(default_factory=list)`.
  - **`__eq__` ohne `__hash__`.** Symptom: `TypeError: cannot use 'Kunde' as a set element (unhashable type: 'Kunde')` (Wortlaut seit 3.14; ältere Versionen: `unhashable type`). Behebung: `__hash__` aus denselben, unveränderlichen Feldern bilden – oder `@dataclass(frozen=True)`.
  - **`__eq__` greift ungeprüft auf `other` zu.** `kunde == None` wirft dann `AttributeError`. Behebung: `if not isinstance(other, Kunde): return NotImplemented`.
  - **Setter weist sich selbst zu.** `self.email = wert` im Setter von `email` endet in `RecursionError`. Behebung: `self._email = wert`.
  - **`super().__init__()` vergessen.** Symptom: `AttributeError` für ein Attribut der Basisklasse, oft erst viel später.
  - **Enum mit String vergleichen.** `if status == "offen"` ist bei `Enum` immer `False`. Vergleiche mit `Status.OFFEN`.
  - **Getter und Setter im Java-Stil** (`get_name()`, `set_name()`). Nimm öffentliche Attribute und bei Bedarf eine Property.

  > [!PRAXIS] Worauf Reviewer achten
  > In Python-Codebasen sind Klassenhierarchien meist flach. Du siehst viele Dataclasses als Werte- und Transportobjekte, wenige Basisklassen, dafür Komposition und Protokolle an den Rändern (Datenbank, HTTP, Uhr). Typische Review-Kommentare: „Bitte `__repr__` ergänzen, damit die Logs lesbar sind“, „Die Liste ist ein Klassenattribut – das teilen sich alle Instanzen“, „`frozen=True`, damit das Objekt als Schlüssel taugt“, „Status bitte als Enum statt als String“.

  ## Zusammenfassung

  - `obj.methode()` ist `Klasse.methode(obj)`; `self` ist das Objekt. Lesen sucht Instanz → Klasse → MRO, Zuweisen schreibt in die Instanz.
  - Veränderlicher Zustand gehört in `__init__`, nie in ein Klassenattribut.
  - `@classmethod` für alternative Konstruktoren (`cls(...)`), `@property` für Validierung und berechnete Werte, ohne die API zu ändern.
  - `super()` ruft die nächste Klasse in der MRO auf, nicht zwingend die Elternklasse. Komposition schlägt tiefe Vererbung.
  - Schreib `__repr__` zuerst. `__eq__` und `__hash__` gehören zusammen; bei fremden Typen `NotImplemented` zurückgeben.
  - `@dataclass` für Datenobjekte: `default_factory` für veränderliche Standardwerte, `frozen` für hashbare Werte, `order` vergleicht in Feldreihenfolge, `__post_init__` validiert.
  - `Enum` für feste Wertemengen; ein Mitglied ist nicht gleich seinem Wert (außer bei `StrEnum`).
  - ABC = nominal, Laufzeitprüfung beim Instanziieren. Protocol = strukturell, statische Prüfung.
exercises:
  - id: methodenarten
    type: choice
    title: Methoden, Properties, Konventionen
    prompt: Welche Aussagen über Methoden und Attribute in Python stimmen?
    options:
      - text: "`@classmethod` bekommt die Klasse als `cls` und eignet sich für alternative Konstruktoren, die auch in Unterklassen das richtige Objekt erzeugen."
        correct: true
        why: "Weil die Methode `cls(...)` aufruft, liefert `Unterklasse.aus_dict(...)` eine Instanz der Unterklasse."
      - text: "`@staticmethod` bekommt `self` automatisch übergeben, darf es aber ignorieren."
        correct: false
        why: Eine statische Methode bekommt weder `self` noch `cls`. Sie ist eine normale Funktion im Namensraum der Klasse.
      - text: Eine `@property` ohne Setter ist schreibgeschützt; eine Zuweisung wirft `AttributeError`.
        correct: true
        why: Ohne Setter hat die Property keinen Weg, einen Wert zu speichern. Python meldet das mit `AttributeError`.
      - text: "Ein Unterstrich wie in `self._saldo` verhindert den Zugriff von außerhalb der Klasse."
        correct: false
        why: Der Unterstrich ist nur eine Konvention („intern, bitte nicht anfassen“). Python erzwingt nichts.
      - text: "`konto.einzahlen(50)` ist gleichbedeutend mit `Konto.einzahlen(konto, 50)`."
        correct: true
        why: "`konto.einzahlen` ist eine gebundene Methode: die Funktion aus der Klasse mit `konto` als erstem Argument."
    explanation: |
      Python hat keine Zugriffsmodifizierer; Kapselung ist Konvention (`_name`) plus Properties, wo Logik nötig ist. Methoden sind normale Funktionen in der Klasse, die beim Zugriff über eine Instanz an diese gebunden werden. `classmethod` bindet an die Klasse, `staticmethod` an nichts.
    resources:
      - title: Tutorial · Method Objects
        url: https://docs.python.org/3/tutorial/classes.html#method-objects
      - title: Built-in Functions · classmethod
        url: https://docs.python.org/3/library/functions.html#classmethod
      - title: Built-in Functions · property
        url: https://docs.python.org/3/library/functions.html#property

  - id: dataclass-sortierung
    type: order
    title: Aufgaben richtig sortieren
    prompt: |
      Aufgaben sollen mit `sorted()` **zuerst nach `prioritaet`**, bei Gleichstand **nach `frist`** sortiert werden. `titel` und `erledigt` haben Standardwerte und sollen beim Vergleich keine Rolle spielen. Bring die Zeilen in die richtige Reihenfolge.
    lang: python
    lines: |
      from dataclasses import dataclass, field
      @dataclass(order=True)
      class Aufgabe:
          prioritaet: int
          frist: str
          titel: str = field(default="", compare=False)
          erledigt: bool = field(default=False, compare=False)
    alternatives:
      - [1, 2, 3, 4, 5, 7, 6]
    explanation: |
      `order=True` vergleicht die Felder wie ein Tupel **in Definitionsreihenfolge**; deshalb muss `prioritaet` vor `frist` stehen. `compare=False` nimmt ein Feld aus `__eq__` und den Vergleichen heraus. Felder mit Standardwert müssen nach Feldern ohne Standardwert kommen, sonst meldet `dataclass` beim Definieren einen `TypeError` – deshalb stehen `titel` und `erledigt` am Ende (in beliebiger Reihenfolge).
    resources:
      - title: dataclasses · order und field(compare=…)
        url: https://docs.python.org/3/library/dataclasses.html#dataclasses.dataclass

  - id: klassenattribut-zaehler
    type: output
    title: Wer zählt hier mit?
    prompt: Was gibt dieses Programm aus? Achte auf den Unterschied zwischen `+=` auf einer Zahl und `append` auf einer Liste.
    lang: python
    code: |
      class Zaehler:
          anzahl = 0
          verlauf = []

          def erhoehen(self):
              self.anzahl += 1
              self.verlauf.append(self.anzahl)

      a = Zaehler()
      b = Zaehler()
      a.erhoehen()
      a.erhoehen()
      b.erhoehen()
      print(a.anzahl, b.anzahl, Zaehler.anzahl)
      print(Zaehler.verlauf)
    expected: |
      2 1 0
      [1, 2, 1]
    explanation: |
      `self.anzahl += 1` ist `self.anzahl = self.anzahl + 1`: Beim ersten Mal wird `anzahl` aus der Klasse gelesen (0), das Ergebnis aber **in die Instanz** geschrieben. Jede Instanz hat danach ihren eigenen Zähler, `Zaehler.anzahl` bleibt 0. `self.verlauf.append(...)` weist dagegen nichts zu, sondern verändert die eine Liste der Klasse – alle Instanzen schreiben in dieselbe Liste.
    resources:
      - title: Tutorial · Class and Instance Variables
        url: https://docs.python.org/3/tutorial/classes.html#class-and-instance-variables

  - id: repr-und-str
    type: output
    title: Welche Darstellung wann?
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      class Datei:
          def __init__(self, name):
              self.name = name

          def __repr__(self):
              return f"Datei({self.name!r})"

          def __str__(self):
              return self.name

      d = Datei("bericht.pdf")
      print(d)
      print([d])
      print(f"{d} / {d!r}")
    expected: |
      bericht.pdf
      [Datei('bericht.pdf')]
      bericht.pdf / Datei('bericht.pdf')
    explanation: |
      `print(d)` und `f"{d}"` benutzen `str()`, also `__str__`. Eine Liste stellt ihre Elemente aber immer mit `repr()` dar – deshalb erscheint in `[d]` die Entwickler-Darstellung. `!r` im f-String erzwingt `repr()`; `{self.name!r}` setzt dabei die Anführungszeichen um den String.
    resources:
      - title: Data model · object.__repr__
        url: https://docs.python.org/3/reference/datamodel.html#object.__repr__
      - title: Data model · object.__str__
        url: https://docs.python.org/3/reference/datamodel.html#object.__str__

  - id: super-kette
    type: output
    title: Wohin ruft super()?
    prompt: Was gibt dieses Programm aus? Tipp – bestimme zuerst die MRO beider Klassen.
    lang: python
    code: |
      class Basis:
          def speichern(self):
              print("Basis")

      class MitLog(Basis):
          def speichern(self):
              print("MitLog")
              super().speichern()

      class MitCache(Basis):
          def speichern(self):
              print("MitCache")

      class Dienst(MitLog, MitCache):
          pass

      class AndererDienst(MitCache, MitLog):
          pass

      Dienst().speichern()
      print("---")
      AndererDienst().speichern()
    expected: |
      MitLog
      MitCache
      ---
      MitCache
    explanation: |
      Die MRO von `Dienst` ist `Dienst, MitLog, MitCache, Basis, object`. `super()` in `MitLog` ruft die **nächste Klasse in dieser MRO** auf – das ist die Geschwisterklasse `MitCache`, nicht `Basis`. `MitCache` ruft `super()` nicht auf, also endet die Kette dort und `Basis` wird nie erreicht. Bei `AndererDienst` steht `MitCache` vorn; seine Methode gewinnt und bricht sofort ab. Kooperative Mehrfachvererbung funktioniert nur, wenn jede Klasse der Kette `super()` aufruft.
    resources:
      - title: Built-in Functions · super
        url: https://docs.python.org/3/library/functions.html#super
      - title: Glossary · method resolution order
        url: https://docs.python.org/3/glossary.html#term-method-resolution-order

  - id: dataclass-rechnung
    type: gap
    title: Eine Rechnung als Dataclass
    prompt: |
      Ergänze den Code: `Geld` soll unveränderlich und damit hashbar sein. Jede `Rechnung` braucht ihre **eigene** Positionsliste, die Rechnungsnummer wird direkt nach dem Erzeugen geprüft, und `summe_cent` soll wie ein Attribut lesbar sein (`r.summe_cent`, ohne Klammern).
    lang: python
    code: |
      from dataclasses import dataclass, field

      @dataclass(⟦frozen=True⟧)
      class Geld:
          betrag_cent: int
          waehrung: str = "EUR"

      @dataclass
      class Rechnung:
          nummer: str
          positionen: list[Geld] = ⟦field(default_factory=list)⟧

          def ⟦__post_init__⟧(self) -> None:
              if not self.nummer.startswith("RE-"):
                  raise ValueError(f"Ungültige Rechnungsnummer: {self.nummer}")

          @⟦property⟧
          def summe_cent(self) -> int:
              return sum(p.betrag_cent for p in self.positionen)
    gaps:
      - label: Unveränderlich
        hint: Ein Argument für `@dataclass`, das Zuweisungen nach dem Erzeugen verbietet.
      - label: Eigene Liste pro Objekt
        hint: Ein Standardwert `[]` ist verboten. Welche Funktion aus `dataclasses` erzeugt pro Objekt einen neuen Wert?
        accept: ["field(default_factory=lambda: [])"]
      - label: Prüfung nach dem Erzeugen
        hint: Der generierte `__init__` ruft am Ende eine Methode mit festem Namen auf.
      - label: Berechnetes Attribut
        hint: Derselbe Dekorator wie für Getter.
    explanation: |
      `frozen=True` verbietet Zuweisungen und sorgt zusammen mit dem Standard `eq=True` dafür, dass `__hash__` erzeugt wird. `field(default_factory=list)` ruft `list()` für jedes neue Objekt auf; ein direkter Standardwert `[]` würde von allen Instanzen geteilt und wird deshalb mit `ValueError` abgelehnt. `__post_init__` ist der Ort für Validierung, weil du den generierten `__init__` nicht selbst schreibst. `@property` macht aus der Methode ein berechnetes Attribut.
    resources:
      - title: dataclasses · Mutable default values
        url: https://docs.python.org/3/library/dataclasses.html#mutable-default-values
      - title: dataclasses · Post-init processing
        url: https://docs.python.org/3/library/dataclasses.html#post-init-processing

  - id: temperatur-property
    type: code
    title: Temperatur mit Validierung
    prompt: |
      Vervollständige die Klasse `Temperatur`:

      - `celsius` ist eine **Property mit Setter**. Werte unter `ABSOLUTER_NULLPUNKT` (−273,15 °C) werfen `ValueError` – beim Erzeugen **und** bei späterer Zuweisung. Nach einer abgelehnten Zuweisung bleibt der alte Wert erhalten.
      - `fahrenheit` ist eine **berechnete, schreibgeschützte** Property (`celsius * 9 / 5 + 32`).
      - `Temperatur.aus_fahrenheit(f)` ist ein alternativer Konstruktor, der auch in Unterklassen eine Instanz der Unterklasse liefert.
    lang: python
    starter: |
      class Temperatur:
          ABSOLUTER_NULLPUNKT = -273.15

          def __init__(self, celsius: float) -> None:
              self.celsius = celsius

          # celsius als Property mit Validierung
          # fahrenheit als berechnete, schreibgeschützte Property
          # aus_fahrenheit als alternativer Konstruktor
    solution: |
      class Temperatur:
          ABSOLUTER_NULLPUNKT = -273.15

          def __init__(self, celsius: float) -> None:
              self.celsius = celsius            # läuft durch den Setter

          @property
          def celsius(self) -> float:
              return self._celsius

          @celsius.setter
          def celsius(self, wert: float) -> None:
              if wert < self.ABSOLUTER_NULLPUNKT:
                  raise ValueError(f"{wert} °C liegt unter dem absoluten Nullpunkt")
              self._celsius = wert

          @property
          def fahrenheit(self) -> float:
              return self._celsius * 9 / 5 + 32

          @classmethod
          def aus_fahrenheit(cls, fahrenheit: float) -> "Temperatur":
              return cls((fahrenheit - 32) * 5 / 9)
    tests:
      - name: Celsius und Fahrenheit lesen
        code: |
          t = Temperatur(100)
          assert t.celsius == 100
          assert t.fahrenheit == 212, f"erwartet 212, bekommen {t.fahrenheit!r}"
      - name: Ungültiger Wert beim Erzeugen
        code: |
          try:
              Temperatur(-300)
          except ValueError:
              pass
          else:
              raise AssertionError("Temperatur(-300) muss ValueError werfen")
      - name: Ungültige Zuweisung wird abgelehnt, alter Wert bleibt
        code: |
          t = Temperatur(20)
          try:
              t.celsius = -500
          except ValueError:
              pass
          else:
              raise AssertionError("t.celsius = -500 muss ValueError werfen")
          assert t.celsius == 20, f"alter Wert 20 erwartet, bekommen {t.celsius!r}"
      - name: fahrenheit ist schreibgeschützt
        code: |
          t = Temperatur(0)
          try:
              t.fahrenheit = 50
          except AttributeError:
              pass
          else:
              raise AssertionError("Zuweisung an fahrenheit muss AttributeError werfen")
      - name: aus_fahrenheit, auch in Unterklassen
        code: |
          import math
          assert math.isclose(Temperatur.aus_fahrenheit(212).celsius, 100)
          class Messwert(Temperatur):
              pass
          m = Messwert.aus_fahrenheit(32)
          assert type(m) is Messwert, f"erwartet Messwert, bekommen {type(m).__name__}"
          assert math.isclose(m.celsius, 0, abs_tol=1e-9)
    hints:
      - "Der Wert selbst braucht einen anderen Attributnamen als die Property, zum Beispiel `self._celsius`."
      - "Prüfe im Setter **bevor** du zuweist – dann bleibt der alte Wert bei einem Fehler automatisch erhalten."
      - "`@classmethod` mit `return cls(...)` statt `return Temperatur(...)`."
    explanation: |
      Weil `__init__` `self.celsius = celsius` schreibt, läuft auch der Startwert durch den Setter – die Validierung steht an genau einer Stelle. Der Setter speichert in `self._celsius`; würde er `self.celsius` zuweisen, riefe er sich endlos selbst auf. `fahrenheit` hat keinen Setter und wird bei jedem Zugriff aus `_celsius` berechnet, kann also nie veralten. `cls(...)` im alternativen Konstruktor sorgt dafür, dass Unterklassen ihren eigenen Typ zurückbekommen.
    resources:
      - title: Built-in Functions · property
        url: https://docs.python.org/3/library/functions.html#property
      - title: Descriptor HowTo · Properties
        url: https://docs.python.org/3/howto/descriptor.html#properties

  - id: playlist-dunder
    type: code
    title: Eine Playlist wie ein eingebauter Container
    prompt: |
      Ergänze `Playlist` um Dunder-Methoden, damit sie sich wie ein eingebauter Container verhält:

      - `len(p)` liefert die Anzahl der Titel; eine leere Playlist ist falsy.
      - `for titel in p` und `list(p)` liefern die Titel in Reihenfolge.
      - `"Intro" in p` prüft, ob ein Titel enthalten ist.
      - `repr(p)` liefert genau `Playlist('Focus', ['Intro', 'Outro'])`.
      - Zwei Playlists sind gleich, wenn Name und Titel gleich sind. Der Vergleich mit einem anderen Typ liefert `False`, ohne Exception.
    lang: python
    starter: |
      class Playlist:
          def __init__(self, name: str, titel: list[str] | None = None) -> None:
              self.name = name
              self._titel = list(titel) if titel is not None else []

          def hinzufuegen(self, titel: str) -> None:
              self._titel.append(titel)

          # Ergänze hier die Dunder-Methoden
    solution: |
      class Playlist:
          def __init__(self, name: str, titel: list[str] | None = None) -> None:
              self.name = name
              self._titel = list(titel) if titel is not None else []

          def hinzufuegen(self, titel: str) -> None:
              self._titel.append(titel)

          def __len__(self) -> int:
              return len(self._titel)

          def __iter__(self):
              return iter(self._titel)

          def __contains__(self, titel: object) -> bool:
              return titel in self._titel

          def __repr__(self) -> str:
              return f"Playlist({self.name!r}, {self._titel!r})"

          def __eq__(self, other: object) -> bool:
              if not isinstance(other, Playlist):
                  return NotImplemented
              return self.name == other.name and self._titel == other._titel
    tests:
      - name: len und Wahrheitswert
        code: |
          p = Playlist("Focus")
          assert len(p) == 0
          assert not p, "eine leere Playlist soll falsy sein"
          p.hinzufuegen("Intro")
          assert len(p) == 1 and p
      - name: Iteration in Reihenfolge
        code: |
          p = Playlist("Focus", ["Intro", "Deep Work", "Outro"])
          assert list(p) == ["Intro", "Deep Work", "Outro"]
          assert [t.upper() for t in p][0] == "INTRO"
      - name: in-Operator
        code: |
          p = Playlist("Focus", ["Intro"])
          assert "Intro" in p
          assert "Outro" not in p
      - name: repr
        code: |
          p = Playlist("Focus", ["Intro", "Outro"])
          assert repr(p) == "Playlist('Focus', ['Intro', 'Outro'])", f"bekommen: {p!r}"
          assert eval(repr(p)) == p, "repr soll gültiger Python-Code sein, der ein gleiches Objekt erzeugt"
      - name: Gleichheit und fremde Typen
        code: |
          assert Playlist("A", ["x"]) == Playlist("A", ["x"])
          assert Playlist("A", ["x"]) != Playlist("A", ["y"])
          assert Playlist("A", ["x"]) != Playlist("B", ["x"])
          assert (Playlist("A") == "A") is False
    hints:
      - "Delegiere an die interne Liste: `len(self._titel)`, `iter(self._titel)`, `titel in self._titel`."
      - "`bool()` nutzt `__len__`, wenn es kein `__bool__` gibt – dafür brauchst du nichts extra."
      - "`__eq__` beginnt mit `if not isinstance(other, Playlist): return NotImplemented`."
    explanation: |
      Die Methoden delegieren an die interne Liste – das ist das übliche Muster für eigene Container. Ohne `__bool__` nimmt Python `__len__` für den Wahrheitswert. `__iter__` gibt einen **neuen** Iterator der Liste zurück, sodass man mehrfach iterieren kann. `NotImplemented` für fremde Typen lässt Python die Gegenseite fragen und am Ende auf Identität zurückfallen – deshalb ist `Playlist("A") == "A"` einfach `False`. Weil `__eq__` definiert ist und die Playlist veränderlich bleibt, ist sie absichtlich nicht hashbar (`__hash__` ist `None`).
    resources:
      - title: Data model · Emulating container types
        url: https://docs.python.org/3/reference/datamodel.html#emulating-container-types
      - title: Data model · object.__eq__
        url: https://docs.python.org/3/reference/datamodel.html#object.__eq__

  - id: version-dataclass
    type: code
    title: Versionsnummern vergleichen
    prompt: |
      Schreibe `Version` als **Dataclass** mit den Feldern `major`, `minor = 0`, `patch = 0`:

      - Versionen sind unveränderlich und damit in Sets und als Dictionary-Schlüssel nutzbar.
      - `<`, `>`, `sorted()` vergleichen **numerisch**: `1.10.0` ist neuer als `1.9.9`.
      - `Version.parse(text)` versteht `"1.10.2"`, `"v1.4"` (fehlende Teile sind 0) und Leerraum am Rand. In Unterklassen liefert `parse` die Unterklasse.
      - `str(v)` ist `"1.10.2"`; `repr` bleibt das von `dataclass` erzeugte.
    lang: python
    starter: |
      from dataclasses import dataclass

      @dataclass
      class Version:
          major: int
          minor: int = 0
          patch: int = 0

          @classmethod
          def parse(cls, text: str) -> "Version":
              ...

          def __str__(self) -> str:
              ...
    solution: |
      from dataclasses import dataclass

      @dataclass(frozen=True, order=True)
      class Version:
          major: int
          minor: int = 0
          patch: int = 0

          @classmethod
          def parse(cls, text: str) -> "Version":
              teile = text.strip().removeprefix("v").split(".")
              return cls(*(int(teil) for teil in teile))

          def __str__(self) -> str:
              return f"{self.major}.{self.minor}.{self.patch}"
    tests:
      - name: Felder und Standardwerte
        code: |
          v = Version(2)
          assert (v.major, v.minor, v.patch) == (2, 0, 0)
          assert repr(Version(1, 2, 3)) == "Version(major=1, minor=2, patch=3)"
      - name: parse
        code: |
          assert Version.parse("1.10.2") == Version(1, 10, 2)
          assert Version.parse("v1.4") == Version(1, 4, 0), f"bekommen {Version.parse('v1.4')!r}"
          assert Version.parse(" 3.0.1 ") == Version(3, 0, 1)
      - name: Numerisch sortieren, nicht als Text
        code: |
          versionen = [Version.parse(t) for t in ["1.10.0", "1.9.3", "1.2"]]
          assert sorted(versionen) == [Version(1, 2), Version(1, 9, 3), Version(1, 10)]
          assert Version.parse("1.10.0") > Version.parse("1.9.9")
          assert max(versionen) == Version(1, 10, 0)
      - name: str für Menschen
        code: assert str(Version(1, 10, 2)) == "1.10.2"
      - name: Unveränderlich und hashbar
        code: |
          v = Version(1)
          try:
              v.major = 2
          except AttributeError:
              pass
          else:
              raise AssertionError("Version muss unveränderlich sein")
          assert len({Version(1), Version.parse("1.0.0")}) == 1
      - name: parse in Unterklassen
        code: |
          class Beta(Version):
              pass
          assert type(Beta.parse("1.0")) is Beta
    hints:
      - "`@dataclass(frozen=True, order=True)` erledigt Unveränderlichkeit, Hash und Vergleiche."
      - "`order=True` vergleicht `(major, minor, patch)` als Tupel von **Zahlen** – genau deshalb ist `1.10` größer als `1.9`."
      - "`text.strip().removeprefix(\"v\").split(\".\")` und dann `cls(*(int(t) for t in teile))`."
    explanation: |
      `order=True` erzeugt `__lt__` und Co., die die Felder wie ein Tupel in Definitionsreihenfolge vergleichen. Weil die Felder `int` sind, ist `(1, 10, 0) > (1, 9, 9)` – als Strings wäre `"1.10.0" < "1.9.9"`, ein klassischer Bug bei Versionsvergleichen. `frozen=True` verbietet Zuweisungen (`FrozenInstanceError` ist eine Unterklasse von `AttributeError`) und erzeugt zusammen mit `eq=True` einen `__hash__`. `cls(*...)` übergibt so viele Teile, wie vorhanden sind; die übrigen Felder nehmen ihre Standardwerte.
    resources:
      - title: dataclasses · dataclass (order, frozen)
        url: https://docs.python.org/3/library/dataclasses.html#dataclasses.dataclass
      - title: dataclasses · Frozen instances
        url: https://docs.python.org/3/library/dataclasses.html#frozen-instances

  - id: property-rekursion
    type: bug
    title: Der Nutzer lässt sich nicht anlegen
    prompt: |
      `Nutzer("Ada@Example.com")` soll die Adresse kleingeschrieben speichern. Stattdessen bricht das Programm mit `RecursionError: maximum recursion depth exceeded` ab. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      class Nutzer:
          def __init__(self, email: str) -> None:
              self.email = email

          @property
          def email(self) -> str:
              return self._email

          @email.setter
          def email(self, wert: str) -> None:
              if "@" not in wert:
                  raise ValueError(f"Ungültige E-Mail: {wert}")
              self.email = wert.strip().lower()
    lines: [13]
    fix:
      - line: 13
        answers: ["self._email = wert.strip().lower()"]
    explanation: |
      `self.email = …` innerhalb des Setters ruft wieder den Setter von `email` auf – die Property gewinnt bei der Zuweisung gegen das Instanz-Dictionary. Das wiederholt sich, bis Python das Rekursionslimit erreicht. Der Setter muss den Wert unter einem anderen Namen speichern, hier `self._email`, den auch der Getter liest. Zeile 3 ist dagegen richtig: Sie soll bewusst durch den Setter laufen, damit auch der Startwert validiert wird.
    resources:
      - title: Built-in Functions · property
        url: https://docs.python.org/3/library/functions.html#property

  - id: kunde-reparieren
    type: code
    title: Repariere die Kunden-Deduplizierung
    prompt: |
      Ein Import soll doppelte Kunden über `set(kunden)` entfernen: Zwei `Kunde`-Objekte gelten als gleich, wenn ihre `kunden_nr` gleich ist – der Name kann sich unterscheiden (Tippfehler, neue Schreibweise). Der vorhandene Code bricht mit `TypeError: cannot use 'Kunde' as a set element (unhashable type: 'Kunde')` ab, und ein Vergleich wie `kunde == None` wirft `AttributeError`.

      Repariere die Klasse so, dass alle Tests grün werden. Ergänze auch ein `__repr__` im Format `Kunde(1, 'Ada')`.
    lang: python
    starter: |
      class Kunde:
          def __init__(self, kunden_nr: int, name: str) -> None:
              self.kunden_nr = kunden_nr
              self.name = name

          def __eq__(self, other):
              return self.kunden_nr == other.kunden_nr
    solution: |
      class Kunde:
          def __init__(self, kunden_nr: int, name: str) -> None:
              self.kunden_nr = kunden_nr
              self.name = name

          def __eq__(self, other: object) -> bool:
              if not isinstance(other, Kunde):
                  return NotImplemented
              return self.kunden_nr == other.kunden_nr

          def __hash__(self) -> int:
              return hash(self.kunden_nr)

          def __repr__(self) -> str:
              return f"Kunde({self.kunden_nr!r}, {self.name!r})"
    tests:
      - name: Gleichheit über die Kundennummer
        code: |
          assert Kunde(1, "Ada") == Kunde(1, "Ada L.")
          assert Kunde(1, "Ada") != Kunde(2, "Ada")
      - name: Deduplizieren mit set
        code: |
          kunden = [Kunde(1, "Ada"), Kunde(2, "Linus"), Kunde(1, "Ada Lovelace")]
          assert len(set(kunden)) == 2, "doppelte Kundennummern sollen im Set zusammenfallen"
      - name: Als Dictionary-Schlüssel
        code: |
          stufen = {Kunde(1, "Ada"): "Gold"}
          assert stufen[Kunde(1, "Ada Lovelace")] == "Gold"
      - name: Vergleich mit fremden Typen
        code: |
          assert (Kunde(1, "Ada") == None) is False
          assert (Kunde(1, "Ada") == 1) is False
      - name: repr für Logs
        code: |
          assert repr(Kunde(1, "Ada")) == "Kunde(1, 'Ada')", f"bekommen {Kunde(1, 'Ada')!r}"
    hints:
      - "Wer `__eq__` definiert, bekommt `__hash__ = None`. Du musst `__hash__` selbst schreiben."
      - "Gleiche Objekte brauchen gleiche Hashes – bilde ihn also nur aus `kunden_nr`, nicht aus dem Namen."
      - "Für fremde Typen: `return NotImplemented`."
    explanation: |
      Sobald eine Klasse `__eq__` definiert, setzt Python `__hash__` auf `None`, weil der geerbte identitätsbasierte Hash nicht mehr zur Gleichheit passen würde. Der neue Hash muss aus **denselben** Feldern kommen, die `__eq__` vergleicht – hier nur `kunden_nr`. Nähme er den Namen dazu, hätten gleiche Kunden verschiedene Hashes und das Set würde sie nicht zusammenlegen. `NotImplemented` für fremde Typen verhindert den `AttributeError` und lässt `==` sauber `False` liefern.
    resources:
      - title: Data model · object.__hash__
        url: https://docs.python.org/3/reference/datamodel.html#object.__hash__
      - title: Glossary · hashable
        url: https://docs.python.org/3/glossary.html#term-hashable

  - id: protocol-uhr-erklaeren
    type: explain
    title: Warum bekommt der Gutschein eine Uhr?
    prompt: |
      Erkläre in eigenen Worten: Welche Rolle spielt `Uhr`? Warum erben `SystemUhr` und `FesteUhr` nicht davon, und wer prüft, ob sie passen? Welchen Vorteil hat es, dass `Gutschein` die Uhr übergeben bekommt, statt selbst `datetime.now()` aufzurufen?
    lang: python
    code: |
      from datetime import datetime, timezone
      from typing import Protocol

      class Uhr(Protocol):
          def jetzt(self) -> datetime: ...

      class SystemUhr:
          def jetzt(self) -> datetime:
              return datetime.now(timezone.utc)

      class FesteUhr:
          def __init__(self, zeitpunkt: datetime) -> None:
              self.zeitpunkt = zeitpunkt

          def jetzt(self) -> datetime:
              return self.zeitpunkt

      class Gutschein:
          def __init__(self, code: str, gueltig_bis: datetime, uhr: Uhr) -> None:
              self.code = code
              self.gueltig_bis = gueltig_bis
              self._uhr = uhr

          def ist_gueltig(self) -> bool:
              return self._uhr.jetzt() <= self.gueltig_bis
    points:
      - "`Uhr` ist ein Protocol: ein struktureller Typ. Jedes Objekt mit passender Methode `jetzt() -> datetime` erfüllt ihn."
      - Die Klassen müssen nicht erben; ob sie passen, prüft ein statischer Type Checker (mypy, pyright), nicht Python zur Laufzeit.
      - "`Gutschein` bekommt die Uhr per Komposition/Dependency Injection übergeben, statt sie selbst zu erzeugen."
      - Im Test macht `FesteUhr` die Zeit deterministisch – ohne Mocking oder Warten.
      - Eine ABC würde Vererbung erzwingen; ein Protocol passt auch zu fremden Klassen und einfachen Fakes.
    explanation: |
      `Uhr` beschreibt nur, was `Gutschein` braucht: eine Methode `jetzt()`, die ein `datetime` liefert. Weil es ein `Protocol` ist, müssen `SystemUhr` und `FesteUhr` nicht davon erben – sie passen strukturell, so wie ein Objekt in TypeScript zu einem Interface passt. Ob die Signatur stimmt, prüft mypy oder pyright beim Analysieren des Codes; zur Laufzeit passiert keine Prüfung. `Gutschein` hängt damit nicht an der echten Systemzeit: In Produktion bekommt er eine `SystemUhr`, im Test eine `FesteUhr` mit einem festen Zeitpunkt, sodass `ist_gueltig()` reproduzierbar ist. Mit einer ABC ginge das auch, aber jede Uhr müsste erben – bei fremden Klassen unmöglich und bei Fakes unnötiger Aufwand.
    resources:
      - title: typing · Protocol
        url: https://docs.python.org/3/library/typing.html#typing.Protocol
      - title: PEP 544 – Protocols
        url: https://peps.python.org/pep-0544/

  - id: bestellung-status
    type: code
    title: Bestellstatus als Zustandsautomat
    prompt: |
      Modelliere Bestellungen mit `Enum` und `@dataclass`. `Status` und die erlaubten Übergänge `ERLAUBT` sind vorgegeben. Schreibe die Dataclass `Bestellung`:

      - Felder: `nummer: str`, `status` (Standard `Status.NEU`) und `verlauf: list[Status]` – jede Bestellung hat ihren **eigenen** Verlauf, anfangs leer.
      - `wechsle_zu(neu)` akzeptiert ein `Status`-Mitglied **oder** den Wert als String (`"bezahlt"`). Ist der Übergang laut `ERLAUBT` verboten oder der String unbekannt, wirft die Methode `ValueError`, und die Bestellung bleibt unverändert.
      - Bei einem erlaubten Übergang wird der **alte** Status an `verlauf` angehängt und der neue gesetzt.
    lang: python
    starter: |
      from dataclasses import dataclass, field
      from enum import Enum

      class Status(Enum):
          NEU = "neu"
          BEZAHLT = "bezahlt"
          VERSENDET = "versendet"
          STORNIERT = "storniert"

      ERLAUBT = {
          Status.NEU: {Status.BEZAHLT, Status.STORNIERT},
          Status.BEZAHLT: {Status.VERSENDET, Status.STORNIERT},
          Status.VERSENDET: set(),
          Status.STORNIERT: set(),
      }

      @dataclass
      class Bestellung:
          nummer: str

          def wechsle_zu(self, neu) -> None:
              ...
    solution: |
      from dataclasses import dataclass, field
      from enum import Enum

      class Status(Enum):
          NEU = "neu"
          BEZAHLT = "bezahlt"
          VERSENDET = "versendet"
          STORNIERT = "storniert"

      ERLAUBT = {
          Status.NEU: {Status.BEZAHLT, Status.STORNIERT},
          Status.BEZAHLT: {Status.VERSENDET, Status.STORNIERT},
          Status.VERSENDET: set(),
          Status.STORNIERT: set(),
      }

      @dataclass
      class Bestellung:
          nummer: str
          status: Status = Status.NEU
          verlauf: list[Status] = field(default_factory=list)

          def wechsle_zu(self, neu: Status | str) -> None:
              neu = Status(neu)  # Mitglied bleibt Mitglied, "bezahlt" wird Status.BEZAHLT
              if neu not in ERLAUBT[self.status]:
                  raise ValueError(f"Übergang {self.status.value} → {neu.value} ist nicht erlaubt")
              self.verlauf.append(self.status)
              self.status = neu
    tests:
      - name: Neue Bestellung
        code: |
          b = Bestellung("B-1")
          assert b.status is Status.NEU
          assert b.verlauf == []
      - name: Erlaubte Übergänge und Verlauf
        code: |
          b = Bestellung("B-2")
          b.wechsle_zu(Status.BEZAHLT)
          b.wechsle_zu(Status.VERSENDET)
          assert b.status is Status.VERSENDET
          assert b.verlauf == [Status.NEU, Status.BEZAHLT], f"bekommen {b.verlauf!r}"
      - name: Verbotener Übergang ändert nichts
        code: |
          b = Bestellung("B-3")
          try:
              b.wechsle_zu(Status.VERSENDET)
          except ValueError:
              pass
          else:
              raise AssertionError("NEU → VERSENDET muss ValueError werfen")
          assert b.status is Status.NEU and b.verlauf == []
      - name: Status als String
        code: |
          b = Bestellung("B-4")
          b.wechsle_zu("storniert")
          assert b.status is Status.STORNIERT
          try:
              Bestellung("B-5").wechsle_zu("verloren")
          except ValueError:
              pass
          else:
              raise AssertionError("ein unbekannter Status-String muss ValueError werfen")
      - name: Kein geteilter Verlauf
        code: |
          a = Bestellung("A")
          b = Bestellung("B")
          a.wechsle_zu(Status.BEZAHLT)
          assert b.verlauf == [], "jede Bestellung braucht ihre eigene Liste"
    hints:
      - "`verlauf: list[Status] = field(default_factory=list)` – ein direktes `= []` lehnt `dataclass` ab."
      - "`Status(\"bezahlt\")` sucht über den Wert; `Status(Status.BEZAHLT)` liefert das Mitglied selbst. Unbekannte Werte werfen schon hier `ValueError`."
      - Prüfe den Übergang, **bevor** du etwas veränderst.
    explanation: |
      `Status(neu)` normalisiert beide Eingabeformen: Ein Mitglied wird unverändert zurückgegeben, ein String über seinen Wert gesucht, und ein unbekannter Wert wirft `ValueError` – genau das gewünschte Verhalten, ohne eigenen Code. Die Tabelle `ERLAUBT` macht den Zustandsautomaten explizit und lesbar; neue Übergänge sind eine Zeile statt einer weiteren `if`-Kaskade. Weil erst geprüft und dann verändert wird, bleibt eine Bestellung bei einem Fehler konsistent. `field(default_factory=list)` gibt jeder Bestellung eine eigene Liste.
    resources:
      - title: Enum HOWTO · Programmatic access to members
        url: https://docs.python.org/3/howto/enum.html#programmatic-access-to-enumeration-members-and-their-attributes
      - title: dataclasses · field
        url: https://docs.python.org/3/library/dataclasses.html#dataclasses.field
