id: typisierung
title: Typisierung mit Type Hints
level: 2
minutes: 150
summary: Type Hints, Generics mit der Syntax ab 3.12, Protocols und Narrowing – und wie du mypy-Meldungen liest, bevor der Bug in Produktion geht.
goals:
  - Du erklärst, was Type Hints zur Laufzeit bewirken (fast nichts) und wofür Typechecker sie nutzen.
  - Du annotierst Funktionen mit eingebauten Generics, `X | None`, `Literal`, `TypedDict`, `Callable` und abstrakten Typen aus `collections.abc`.
  - Du schreibst generische Funktionen und Klassen mit der Syntax ab Python 3.12 und Typ-Aliase mit `type`.
  - Du unterscheidest `Protocol` von ABCs und `Any` von `object` und begründest die Wahl.
  - 'Du liest mypy-Meldungen, behebst sie durch Narrowing statt `# type: ignore` und führst Typisierung schrittweise in bestehenden Code ein.'
