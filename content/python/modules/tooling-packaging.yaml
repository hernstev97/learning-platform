lesson: |
  „Auf meinem Rechner läuft es“ hilft wenig, wenn ein Kollege eine andere Bibliotheksversion installiert oder die CI versehentlich den falschen Interpreter verwendet. Tooling macht aus einer lose zusammenkopierten Sammlung von Dateien ein Projekt mit nachvollziehbaren Eingaben, Prüfungen und auslieferbaren Ergebnissen.

  Hier geht es um die Verbindung zwischen diesen Teilen. uv verwaltet Umgebung und Abhängigkeiten, Ruff prüft und formatiert Quellcode, `pyproject.toml` beschreibt Projekt und Build. Ein Wheel ist das installierbare Ergebnis. Keines dieser Werkzeuge ersetzt fachliche Tests; gemeinsam schaffen sie aber eine verlässliche Grundlage dafür.

  ## Projekt, Interpreter und Umgebung

  Python-Quellcode wird von einem Interpreter ausgeführt. Importierte Fremdpakete werden aus dessen Suchpfad geladen. Eine virtuelle Umgebung isoliert installierte Pakete für ein Projekt; sie ist weder ein Container noch eine Sicherheitsgrenze. Betriebssystembibliotheken und Zugriffsrechte bleiben Eigenschaften des Rechners.

  Die [uv-Projektanleitung](https://docs.astral.sh/uv/guides/projects/) zeigt einen zusammenhängenden Ablauf. Nutze ihn im eigenen Arbeitsverzeichnis, nicht durch globale Paketinstallation ins System-Python.

  ```console
  $ uv init bericht-cli
  $ cd bericht-cli
  $ uv add httpx
  $ uv add --dev pytest ruff
  $ uv run python --version
  $ uv run pytest
  ```

  `uv run` führt im Projektkontext aus und kann die benötigte Umgebung synchronisieren. Du musst die Umgebung nicht in jeder Shell manuell aktivieren. Die Dateien haben verschiedene Aufgaben: `pyproject.toml` enthält den erklärten Bedarf, `uv.lock` die konkret aufgelösten Abhängigkeiten, `.venv` die lokale Installation. Letztere gehört nicht ins Repository.

  ```python run
  import sys
  print(sys.version_info.major)
  print(sys.version_info.minor >= 11)
  ```

  Dieser Browser zeigt seinen eigenen Interpreter. Er prüft nicht, welche Version lokal von uv gewählt wird. Bei lokalen Problemen vergleiche `uv run python --version` und den Interpreter deiner IDE, bevor du Imports reparierst oder Pakete erneut installierst.

  ## pyproject.toml beschreibt den Vertrag

  Die standardisierte `[project]`-Tabelle beschreibt Metadaten und Laufzeitabhängigkeiten. Werkzeugkonfiguration steht unter `[tool.<name>]`. `[build-system]` erklärt, welcher Build-Backend-Code aus dem Quellprojekt ein Paket baut. Die [Packaging-Anleitung](https://packaging.python.org/en/latest/guides/writing-pyproject-toml/) trennt diese Bereiche.

  ```toml
  [build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"

  [project]
  name = "bericht-cli"
  version = "0.1.0"
  requires-python = ">=3.12"
  dependencies = ["httpx>=0.28,<1"]

  [project.scripts]
  bericht = "bericht_cli.cli:main"

  [tool.ruff]
  line-length = 100
  ```

  Der Distributionsname kann Bindestriche enthalten. Der importierbare Paketname ist hier `bericht_cli` und folgt Python-Bezeichnerregeln. `requires-python` beschreibt, welche Interpreter du unterstützt; es installiert nicht magisch eine passende Runtime für alle Nutzer. Prüfe diese Aussage mit deiner Testmatrix und verwendeten Sprachfeatures.

  Eine Abhängigkeitsgrenze wie `>=0.28,<1` erlaubt einen Versionsbereich. Eine konkrete Lockdatei wählt daraus eine Auflösung für das Projekt. Für eine Bibliothek muss der deklarierte Bereich sinnvoll bleiben, weil ihre Nutzer andere Projekte mit anderen Abhängigkeiten kombinieren. Für eine Anwendung ist die getestete Auflösung der direkte Ausgangspunkt des Betriebs.

  ```python run
  import tomllib
  text = '[project]\nname = "bericht-cli"\nversion = "0.1.0"\n'
  metadaten = tomllib.loads(text)
  print(metadaten["project"]["name"])
  ```

  [`tomllib`](https://docs.python.org/3/library/tomllib.html) liest TOML aus der Standardbibliothek. `loads` bekommt einen String; `load` arbeitet mit einer binär geöffneten Datei. Ein Parser erkennt Syntaxfehler, validiert aber noch nicht, ob deine fachlichen Pflichtfelder vorhanden sind. TOML-Schlüssel zu lesen ist auch kein vollständiger Parser für Versionsanforderungen.

  ## Lockdatei und reproduzierbare Prüfungen

  Eine Lockdatei macht die Auflösung überprüfbar. Aktualisiere sie bewusst, reviewe Paketänderungen und führe danach Tests aus. Committe `uv.lock` für dieses Anwendungsprojekt gemeinsam mit Änderungen am erklärten Bedarf. Die Details zu [Locking und Synchronisierung](https://docs.astral.sh/uv/concepts/projects/sync/) erklären den Unterschied zwischen Prüfen, Auflösen und Installieren.

  ```console
  $ uv lock
  $ uv sync --locked
  $ uv run --locked pytest
  $ uv lock --upgrade-package httpx
  ```

  `--locked` soll scheitern, wenn die Lockdatei nicht zum Projekt passt, statt sie stillschweigend neu aufzulösen. Das macht eine CI-Abweichung sichtbar. Ein Cache beschleunigt Downloads, ist aber keine Quelle der Wahrheit. Löscht du ihn, muss das Projekt weiterhin aus Versionsverwaltung und Paketquellen aufgebaut werden können.

  Reproduzierbarkeit hat Grenzen: Betriebssystem, Architektur, native Bibliotheken und externe Dienste können ebenfalls Einfluss haben. Schreibe daher im README die unterstützte Python-Version, den Installationsbefehl und erforderliche Umgebungsvariablen auf. Reale Zugangsdaten gehören nicht ins Beispiel und nicht ins Paket.

  ## Ruff und Typprüfung erfüllen verschiedene Aufgaben

  [Ruff](https://docs.astral.sh/ruff/tutorial/) vereint Linting und Formatierung. `ruff check` findet ausgewählte Regelverstöße, `ruff format` formatiert. In CI nutzt du einen Prüfmodus, damit ein Lauf unformatierten Code meldet, statt ihn nur im flüchtigen Runner zu verändern.

  ```console
  $ uv run ruff check .
  $ uv run ruff format --check .
  $ uv run ruff check --fix .
  $ uv run ruff format .
  ```

  Die letzten beiden Befehle verändern Dateien; lies anschließend den Diff. Automatische Korrekturen sparen Arbeit, ändern aber nicht die Verantwortung für das Ergebnis. Ein Typchecker wie mypy oder pyright untersucht andere Eigenschaften als Ruff. Ein grüner Linter beweist weder korrekte Typen noch korrektes fachliches Verhalten.

  > [!PRAXIS]
  > Ein kleines Projekt braucht klare Standardbefehle: formatieren, linten, testen, bauen. Dieselben Befehle sollten lokal und in CI funktionieren. Zusätzliche Werkzeuge sind sinnvoll, wenn sie einen konkreten Fehler entdecken, nicht nur weil sie verfügbar sind.

  ## Ein Paket wirklich installierbar machen

  Das [src-Layout](https://packaging.python.org/en/latest/discussions/src-layout-vs-flat-layout/) trennt Quellcode vom Repository-Wurzelverzeichnis. So fällt eher auf, wenn ein Test nur wegen des aktuellen Arbeitsverzeichnisses importieren konnte. Ein minimales Layout sieht so aus:

  ```text
  bericht-cli/
    pyproject.toml
    uv.lock
    src/
      bericht_cli/
        __init__.py
        cli.py
    tests/
      test_cli.py
  ```

  Der Entry Point verweist auf eine aufrufbare Funktion. Diese Funktion liest Argumente oder startet die Anwendung; bloßes Importieren des Pakets sollte keinen Job ausführen.

  ```python
  def main():
      print("Bericht bereit")
      return 0

  if __name__ == "__main__":
      raise SystemExit(main())
  ```

  Mit `uv build` entstehen im üblichen Ablauf ein Wheel und eine Quelldistribution. Das Wheel enthält die installierbaren Dateien; eine Quelldistribution ist Ausgangsmaterial für einen Build. Beide können versehentlich Daten vermissen oder unnötige Dateien enthalten. Prüfe daher nicht nur den Entwicklungsimport, sondern das gebaute Artefakt in einer frischen Umgebung außerhalb des Repos.

  ```console
  $ uv build
  $ uv venv /tmp/bericht-wheel-test
  $ uv pip install --python /tmp/bericht-wheel-test/bin/python dist/bericht_cli-0.1.0-py3-none-any.whl
  $ /tmp/bericht-wheel-test/bin/bericht
  ```

  Der Beispielpfad gehört zu Linux oder macOS. Nutze auf Windows die entsprechende `Scripts`-Struktur. Für eine ausführliche Einführung in Build und Distribution siehe das [Packaging-Tutorial](https://packaging.python.org/en/latest/tutorials/packaging-projects/).

  ## Entwicklungswerkzeuge trennen: dependency-groups

  `pytest` und `ruff` braucht das Team, die Nutzer deines Pakets nicht. Früher landeten sie in einer `requirements-dev.txt`. Heute gibt es dafür einen Standard: [Dependency Groups](https://packaging.python.org/en/latest/specifications/dependency-groups/) (PEP 735), eine eigene Tabelle `[dependency-groups]` neben `[project]`.

  ```toml
  [dependency-groups]
  dev = ["pytest>=9.1.1"]
  lint = ["ruff>=0.16.10"]
  ```

  Du legst Gruppen mit `uv add` an und wählst beim Installieren, welche du brauchst ([Dependency groups in uv](https://docs.astral.sh/uv/concepts/projects/dependencies/#dependency-groups)):

  ```console
  $ uv add --dev pytest
  $ uv add --group lint ruff
  $ uv sync
  $ uv sync --group lint
  $ uv sync --no-dev
  $ uv sync --only-group lint
  ```

  `uv add --dev` schreibt in die Gruppe `dev`. Diese Gruppe ist besonders: uv installiert sie bei `uv sync` und `uv run` standardmäßig ([Default groups](https://docs.astral.sh/uv/concepts/projects/dependencies/#default-groups)). Jede andere Gruppe kommt nur mit `--group name` dazu, alle mit `--all-groups`. `--no-dev` lässt `dev` weg, `--only-group lint` installiert ausschließlich `ruff`, nicht einmal dein Projekt. Das ist ideal für einen Lint-Job in der CI, der keine Abhängigkeiten der Anwendung braucht. `uv sync` stellt die Umgebung exakt her und deinstalliert, was zu keiner gewählten Gruppe gehört.

  Gruppen stehen nicht in den Metadaten des Wheels. Wer dein Paket installiert, bekommt `pytest` nie. Auch pip installiert Gruppen aus einer `pyproject.toml`: `pip install --group lint` gibt es seit pip 25.1 ([Release Notes](https://pip.pypa.io/en/stable/news/)).

  ## Extras: optionale Funktionen für Nutzer

  Manche Funktionen brauchen zusätzliche Pakete, die nicht jeder will. Die farbige Ausgabe deiner CLI zieht `rich` nach, aber nur für Nutzer, die sie wünschen. Das regelt ein Extra in `[project.optional-dependencies]`:

  ```toml
  [project.optional-dependencies]
  cli = ["rich>=13"]
  ```

  ```console
  $ uv add --optional cli "rich>=13"
  $ uv sync --extra cli
  $ uv sync --all-extras
  $ pip install "bericht-cli[cli]"
  ```

  Anders als Gruppen veröffentlicht das Wheel Extras in seinen Metadaten. Die Zeilen `Provides-Extra: cli` und `Requires-Dist: rich>=13; extra == 'cli'` stehen in der `METADATA`. Mit `pip install "bericht-cli[cli]"` bekommen Nutzer `rich` dazu, ohne Extra nicht ([uv · Optional dependencies](https://docs.astral.sh/uv/concepts/projects/dependencies/#optional-dependencies)).

  | | `[dependency-groups]` | `[project.optional-dependencies]` |
  | --- | --- | --- |
  | Zielgruppe | Entwickler des Projekts | Nutzer des Pakets |
  | Im Wheel | nein | ja |
  | Installieren | `uv sync --group lint` | `pip install "paket[extra]"`, `uv sync --extra cli` |
  | Beispiel | `pytest`, `ruff`, `mypy` | `rich` für eine optionale CLI |

  Brauchen nur die Entwickler etwas, nimm eine Gruppe. Soll ein Nutzer eine Funktion zuschalten können, nimm ein Extra. Ältere Projekte führen Testwerkzeuge oft als Extra `test` oder `dev`. Das veröffentlicht sie als installierbare Option. Neue Projekte nehmen Gruppen.

  ## Versionsangaben: Bereich, Untergrenze, exakter Pin

  Eine Versionsangabe ist ein Vertrag mit deinen Nutzern und mit dir selbst. Die Schreibweise legt [PEP 440](https://packaging.python.org/en/latest/specifications/version-specifiers/) fest:

  | Angabe | Erlaubt | Beispiel |
  | --- | --- | --- |
  | `==1.4.2` | genau diese Version | nur 1.4.2 |
  | `>=1.4` | diese und jede neuere | 1.4, 1.9, 2.0 |
  | `>=1.4,<2` | ein Bereich bis vor die nächste Hauptversion | 1.4 bis 1.x |
  | `~=1.4` | kompatibel: `>=1.4, ==1.*` | 1.4, 1.9, nicht 2.0 |
  | `~=1.4.2` | kompatibel: `>=1.4.2, ==1.4.*` | 1.4.2, 1.4.9, nicht 1.5 |

  Das [kompatible Release](https://packaging.python.org/en/latest/specifications/version-specifiers/#compatible-release) `~=` bindet die letzte angegebene Stelle nach oben: Die vorletzte darf nicht steigen.

  Welche Angabe richtig ist, hängt davon ab, wer dein Projekt installiert.

  - **Anwendung** (läuft bei dir oder in deinem Betrieb): In der `pyproject.toml` stehen Untergrenzen, wie `uv add` sie schreibt. Die exakten Versionen hält `uv.lock` fest, und du committest die Datei. Der Pin lebt im Lockfile, nicht in `dependencies`.
  - **Bibliothek** (andere installieren sie in ihre Projekte): Nutze Untergrenzen und keine Obergrenze ohne bekannten Grund. Ein `==` ist fast immer falsch.

  Der Grund liegt im Resolver. Nutzer kombinieren deine Bibliothek mit anderen Paketen. Pinnt `radwerk-client` die Version `httpx==0.27.2`, braucht aber das Projekt des Nutzers `httpx>=0.28`, gibt es keine Lösung, und der Nutzer kann nichts ändern:

  ```console
  $ uv lock
  error: No solution found when resolving dependencies
    cause: Because only radwerk-client==2.3.0 is available and radwerk-client==2.3.0 depends on httpx==0.27.2, we can conclude that all versions of radwerk-client depend on httpx==0.27.2.
           And because your project depends on httpx>=0.28 and radwerk-client, we can conclude that your project's requirements are unsatisfiable.
  ```

  Das Python Packaging User Guide nennt es nicht empfohlen, Abhängigkeiten in `install_requires` auf Versionen festzulegen ([install_requires vs requirements files](https://packaging.python.org/en/latest/discussions/install-requires-vs-requirements/)). Henry Schreiner begründet ausführlich, warum Obergrenzen in Bibliotheken mehr Probleme schaffen als lösen ([Should you use upper bound version constraints?](https://iscinumpy.dev/post/bound-version-constraints/)). Eine Obergrenze brauchst du nur, wenn du eine Inkompatibilität kennst. Schreibe dann den Grund als Kommentar daneben. Das `<1` im Beispiel weiter oben ist so eine bewusste Grenze: Es fängt eine Hauptversion ab, die Brüche bringen darf.

  > [!INTERVIEW] „Pinnst du Abhängigkeiten?“
  > Das hängt davon ab, wer das Projekt installiert. Eine Anwendung hat ein Lockfile mit exakten Versionen und Untergrenzen in der `pyproject.toml`. Eine Bibliothek gibt Bereiche an, ohne Obergrenze, solange ich keine Inkompatibilität kenne. Ein exakter Pin in einer Bibliothek erzeugt Konflikte in den Projekten, die sie nutzen.

  Die Untergrenze sollte die älteste Version sein, gegen die du wirklich testest. `uv add` trägt die aktuelle Version ein. Ob die Untergrenze stimmt, prüfst du mit `uv lock --resolution lowest-direct` und einem Testlauf.

  ## Aktualisieren: Upgrade-Workflow

  Ein Lockfile friert Versionen ein. Aktualisierungen sind deshalb eine bewusste Änderung. Der Ablauf besteht aus fünf Schritten.

  1. **Veraltetes finden.** `uv tree --outdated --depth 1` zeigt hinter jeder direkten Abhängigkeit die neueste Version.
  2. **Gezielt aktualisieren.** `uv lock --upgrade-package httpx` hebt nur `httpx` und das, was es zwingend nachzieht. `uv lock --upgrade` hebt alles, was die Bereiche in `pyproject.toml` erlauben ([Upgrading locked package versions](https://docs.astral.sh/uv/concepts/projects/sync/#upgrading-locked-package-versions)).
  3. **Diff prüfen.** `git diff uv.lock` zeigt, welche Pakete neu, entfernt oder in der Hauptversion gesprungen sind. Ein Lockfile-Diff ist ein Review von Fremdcode.
  4. **Testen.** Voller Testlauf mit der neuen Auflösung.
  5. **Als eigener PR mergen.** So lässt sich ein Fehler später einem Upgrade zuordnen.

  ```console
  $ uv tree --outdated --depth 1
  Resolved 19 packages in 1ms
  bericht-cli v0.1.0
  ├── httpx v0.27.2 (latest: v0.28.1)
  ├── rich v15.0.0 (extra: cli)
  └── pytest v9.1.1 (group: dev)
  $ uv lock --upgrade-package httpx
  Resolved 18 packages in 94ms
  Updated httpx v0.27.2 -> v0.28.1
  Removed sniffio v1.3.1
  $ uv tree --invert --package h11
  Resolved 18 packages in 0.55ms
  h11 v0.16.0
  └── httpcore v1.0.9
      └── httpx v0.28.1
          └── bericht-cli v0.1.0
  ```

  `uv tree --invert --package h11` beantwortet die Frage, warum ein unbekanntes Paket im Lockfile steht: Es kommt über `httpcore` und `httpx` herein.

  In der CI darf niemand das Lockfile still ändern. Dafür gibt es zwei Optionen ([Locking and syncing](https://docs.astral.sh/uv/concepts/projects/sync/)):

  | Option | Verhalten |
  | --- | --- |
  | `--locked` | Scheitert, wenn `uv.lock` nicht zu `pyproject.toml` passt. |
  | `--frozen` | Nimmt `uv.lock` unverändert, ohne zu prüfen, ob es aktuell ist. |

  ```console
  $ uv sync --locked
  error: The lockfile at `uv.lock` needs to be updated, but `--locked` was provided.

  hint: To update the lockfile, run `uv lock`.
  ```

  Nutze in der CI `uv sync --locked` oder `uv run --locked pytest`. `uv lock --check` prüft dasselbe, ohne etwas zu installieren. `--frozen` passt, wenn ein früherer Schritt die Übereinstimmung schon geprüft hat, etwa in einem Docker-Build.

  ## Sicherheitsprüfung: bekannte Schwachstellen in Abhängigkeiten

  Jedes Paket im Lockfile ist Code, den du nicht geschrieben hast. Für viele Versionen sind Schwachstellen veröffentlicht. Ein Audit gleicht dein Lockfile gegen solche Datenbanken ab. Zwei Werkzeuge stehen zur Wahl.

  `uv audit` ist in uv eingebaut und liest `uv.lock`. Es ist in uv 0.12 noch eine Vorschau („experimental“), und sein Verhalten kann sich ändern ([Ankündigung](https://astral.sh/blog/uv-audit), [Referenz](https://docs.astral.sh/uv/reference/cli/#uv-audit)). Es fragt die OSV-Datenbank ab. Bei Funden endet es mit Exit-Code 1.

  ```console
  $ uv audit
  warning: `uv audit` is experimental and may change without warning. Pass `--preview-features audit-command` to disable this warning.
  Resolved 6 packages in 0.54ms
  Found 38 known vulnerabilities and no adverse project statuses in 5 packages

  Vulnerabilities:

  idna 2.7 has 4 known vulnerabilities:

  - GHSA-jjg7-2v4v-x38h: Internationalized Domain Names in Applications (IDNA) vulnerable to denial of service from specially crafted inputs to idna.encode

    Fixed in: 3.7

    Advisory information: https://nvd.nist.gov/vuln/detail/CVE-2024-3651
  …
  ```

  [`pip-audit`](https://pypi.org/project/pip-audit/) gehört zur Python Packaging Authority und ist seit Jahren stabil. Es liest Requirements-Dateien. Exportiere das Lockfile dorthin und starte das Werkzeug ohne Installation mit `uvx`:

  ```console
  $ uv export --no-emit-project -o requirements.txt
  $ uvx pip-audit -r requirements.txt
  Found 37 known vulnerabilities in 3 packages
  Name     Version ID              Fix Versions
  -------- ------- --------------- -------------
  idna     2.7     PYSEC-2024-60   3.7
  idna     2.7     PYSEC-2026-215  3.15
  requests 2.19.0  PYSEC-2018-28   2.20.0
  …
  ```

  `pip-audit -r -` liest nicht von der Standardeingabe, das Werkzeug meldet `invalid requirements input: -` (geprüft mit pip-audit 2.10.1). Schreibe die Datei und gib sie an. Alternativ liest es `pylock.toml`: `uv export --format pylock.toml -o pylock.toml`, dann `uvx pip-audit --locked .`. Die `uv.lock` selbst versteht pip-audit nicht (`no lockfiles found`). Die Zahlen oben sind Beispiele, jeden Tag kommen neue Meldungen dazu.

  Was ein Treffer verlangt, hängt vom Eintrag ab. Die Spalte `Fix Versions` nennt die Version, die den Fehler behebt. Du hebst das Paket an (`uv lock --upgrade-package idna`), testest und mergst. Ist es eine transitive Abhängigkeit, genügt das Lockfile, in `pyproject.toml` ändert sich nichts. Gibt es noch keine Korrektur, entscheidest du bewusst: warten, ersetzen oder die Meldung mit `--ignore-vuln ID` (pip-audit) beziehungsweise `--ignore ID` (uv) ausblenden, aber nur mit Ticket und Frist.

  Grenzen:

  - Beide Werkzeuge kennen nur veröffentlichte Schwachstellen. Eine neue Lücke fehlt, bis jemand sie meldet.
  - Sie prüfen Versionen, nicht deinen Code. Ob du die verwundbare Funktion aufrufst, sagen sie nicht.
  - Neue Meldungen erscheinen für unveränderten Code. Lasse den Audit deshalb zusätzlich nach Zeitplan laufen, etwa wöchentlich, und nicht nur im PR.

  ## Das gebaute Wheel lesen: Inhalt, Metadaten, sdist

  `uv build` legt unter `dist/` zwei Dateien ab. Es baut zuerst eine Quelldistribution (sdist) und daraus das Wheel ([Building distributions](https://docs.astral.sh/uv/concepts/projects/build/#building-distributions)). Mit `--sdist` oder `--wheel` bekommst du nur eine der beiden.

  | | Wheel (`.whl`) | sdist (`.tar.gz`) |
  | --- | --- | --- |
  | Inhalt | genau die Dateien, die bei der Installation kopiert werden | Quellcode samt `pyproject.toml` und `PKG-INFO` |
  | Installation | direkt, ohne Build | braucht erst einen Build |
  | Tests und Doku | gehören nicht hinein | oft dabei |

  Das beschreibt der Leitfaden [Source distributions vs. wheels](https://packaging.python.org/en/latest/discussions/package-formats/). Ein Wheel ist ein ZIP-Archiv. Du liest es, ohne es zu installieren:

  ```console
  $ uv build
  Building source distribution...
  Building wheel from source distribution...
  Successfully built dist/bericht_cli-0.1.0.tar.gz
  Successfully built dist/bericht_cli-0.1.0-py3-none-any.whl
  $ unzip -l dist/bericht_cli-0.1.0-py3-none-any.whl
    Length      Date    Time    Name
  ---------  ---------- -----   ----
         48  2020-02-02 00:00   bericht_cli/__init__.py
          0  2020-02-02 00:00   bericht_cli/py.typed
        264  2020-02-02 00:00   bericht_cli-0.1.0.dist-info/METADATA
         87  2020-02-02 00:00   bericht_cli-0.1.0.dist-info/WHEEL
         45  2020-02-02 00:00   bericht_cli-0.1.0.dist-info/entry_points.txt
        468  2020-02-02 00:00   bericht_cli-0.1.0.dist-info/RECORD
  ---------                     -------
        912                     6 files
  $ unzip -p dist/bericht_cli-0.1.0-py3-none-any.whl '*/METADATA'
  Metadata-Version: 2.5
  Name: bericht-cli
  Version: 0.1.0
  Requires-Python: >=3.12
  Requires-Dist: httpx>=0.28
  Provides-Extra: cli
  Requires-Dist: rich>=13; extra == 'cli'
  ```

  Prüfe vier Dinge. Das Paketverzeichnis `bericht_cli/` mit allen Modulen und Datendateien ist vollständig. `entry_points.txt` enthält deinen Befehl (`bericht = bericht_cli:main`). In `METADATA` stehen deine Abhängigkeiten und Extras, aber keine Gruppen wie `pytest`. Und `tests/`, `.env` und `uv.lock` fehlen, denn ins Wheel gehören sie nicht.

  Der Dateiname `bericht_cli-0.1.0-py3-none-any.whl` besteht aus Paketname, Version und drei Tags: Python-Version, ABI und Plattform. `py3-none-any` heißt: reines Python, überall installierbar ([Dateinamen-Konvention](https://packaging.python.org/en/latest/specifications/binary-distribution-format/#file-name-convention)).

  Die sdist verhält sich anders. Mit dem Build-Backend `hatchling` und dem Projekt aus `uv init` enthält sie auch `tests/`, `.python-version` und `uv.lock`, und die Liste zeigt eine `.env` mit Zugangsdaten:

  ```console
  $ tar tzf dist/bericht_cli-0.1.0.tar.gz | sort
  bericht_cli-0.1.0/.env
  bericht_cli-0.1.0/.gitignore
  bericht_cli-0.1.0/.python-version
  bericht_cli-0.1.0/PKG-INFO
  bericht_cli-0.1.0/README.md
  bericht_cli-0.1.0/pyproject.toml
  bericht_cli-0.1.0/src/bericht_cli/__init__.py
  bericht_cli-0.1.0/src/bericht_cli/py.typed
  bericht_cli-0.1.0/tests/test_cli.py
  bericht_cli-0.1.0/uv.lock
  ```

  Was in eine sdist kommt, entscheidet das Build-Backend, und es nimmt je nach Konfiguration alles, was `.gitignore` nicht ausschließt. Steht `.env` im Archiv, trage sie in `.gitignore` ein oder schließe sie im Backend aus (für hatchling mit `[tool.hatch.build.targets.sdist] exclude`, siehe die [Hatch-Dokumentation](https://hatch.pypa.io/latest/config/build/)). Prüfe das Wheel wie oben, das Archiv mit `tar tzf`, und installiere das Wheel danach in einer frischen Umgebung.

  > [!WARNING] Zugangsdaten in der sdist
  > Eine `.env` mit Tokens im Projektverzeichnis kann in der sdist landen, auch wenn sie nie im Wheel steckt. Wer die sdist hochlädt, veröffentlicht sie. Liste das Archiv vor jedem Upload.

  ## Häufige Fehler und Review

  Ein `ModuleNotFoundError` kann bedeuten, dass das Paket nicht installiert ist, der falsche Interpreter läuft oder der Build Dateien ausgeschlossen hat. Das sind unterschiedliche Ursachen. Starte mit einer frischen Umgebung und einem reproduzierbaren Befehl; vermeide dauerhafte `sys.path`-Manipulationen als Schnellreparatur.

  > [!WARNING]
  > Veröffentliche ein Paket erst, wenn Name, Inhalt und Zielrepository bewusst gewählt sind. Für das Lernen reicht ein lokaler Build mit lokaler Installation; ein Upload ist ein eigener Schritt.

  > [!INTERVIEW]
  > „Was ist der Unterschied zwischen pyproject und Lockdatei?“ Erkläre Bedarf versus konkrete Auflösung. Ergänze, dass ein Wheel das installierbare Ergebnis ist und die virtuelle Umgebung dessen lokale Nutzung ermöglicht.

  ## Zusammenfassung

  - Interpreter und Umgebung müssen zum Projekt passen.
  - `pyproject.toml` beschreibt Metadaten, Abhängigkeiten und Build.
  - Die Lockdatei macht eine konkrete Auflösung reproduzierbar.
  - Ruff, Typchecker und Tests prüfen unterschiedliche Eigenschaften.
  - Ein Entry Point verweist auf eine Funktion im installierten Paket.
  - Prüfe das Wheel auch außerhalb des Quellverzeichnisses.
  - `[dependency-groups]` hält Entwicklungswerkzeuge zurück, Extras in `[project.optional-dependencies]` erscheinen im Wheel.
  - Anwendungen pinnen im Lockfile, Bibliotheken geben Bereiche mit Untergrenze an und kaum Obergrenzen.
  - Upgrades laufen gezielt (`uv lock --upgrade-package`) und mit Diff-Review; die CI nutzt `--locked`.
  - `uv audit` und `pip-audit` finden bekannte Schwachstellen in Versionen, nicht in deinem Code.
  - `unzip -l` zeigt den Inhalt eines Wheels; die sdist kann Dateien wie `.env` enthalten.
exercises:
- id: artefakte
  type: choice
  title: Welche Datei hat welche Rolle?
  prompt: Welche Aussage stimmt?
  options:
  - text: uv.lock hält eine konkrete Abhängigkeitsauflösung fest.
    correct: true
    why: Das ergänzt den in pyproject erklärten Bedarf.
  - text: .venv gehört ins Repository.
    correct: false
    why: Die lokale Installation wird reproduziert und nicht kopiert.
  - text: Ein grüner Linter ersetzt fachliche Tests.
    correct: false
    why: Stilregeln prüfen nicht alle fachlichen Anforderungen.
  explanation: Bedarf, Auflösung und Installation sind getrennte Zustände. Diese Trennung hilft auch beim Debuggen
    von abweichenden Rechnern.
  resources:
  - *id001
- id: locked-oder-frozen
  type: choice
  title: Lockfile in der CI absichern
  prompt: Die CI soll scheitern, wenn jemand `pyproject.toml` ändert, ohne `uv.lock` zu aktualisieren. Welche Option setzt das um?
  options:
  - text: "`uv sync --locked`"
    correct: true
    why: '`--locked` bricht mit einem Fehler ab, wenn `uv.lock` nicht zu `pyproject.toml` passt, und schreibt das Lockfile nicht um.'
  - text: "`uv sync --frozen`"
    correct: false
    why: '`--frozen` nimmt `uv.lock` unverändert und prüft nicht, ob es aktuell ist. Genau die Abweichung bliebe unbemerkt.'
  - text: "`uv lock --upgrade`"
    correct: false
    why: Das hebt alle Pakete an und schreibt das Lockfile um. Es prüft nichts.
  - text: "`uv sync --no-dev`"
    correct: false
    why: Die Option lässt die Gruppe `dev` weg. Mit dem Lockfile hat sie nichts zu tun.
  explanation: '`--locked` macht eine Abweichung zwischen Bedarf und Auflösung sichtbar, statt sie still zu reparieren. `--frozen` passt, wenn ein früherer Schritt die Übereinstimmung schon geprüft hat, etwa in einem Docker-Build. `uv lock --check` prüft dasselbe, ohne etwas zu installieren.'
  resources:
  - title: uv · Locking and syncing
    url: https://docs.astral.sh/uv/concepts/projects/sync/
- id: audit-ausgabe-lesen
  type: choice
  title: Was tun nach einem Audit-Treffer?
  prompt: Der Audit meldet Schwachstellen in `idna`. Dein Projekt hängt `idna` nicht selbst ein, es kommt über `httpx`. Was ist der passende nächste Schritt?
  lang: console
  code: |-
    $ uvx pip-audit -r requirements.txt
    Found 2 known vulnerabilities in 1 package
    Name Version ID             Fix Versions
    ---- ------- -------------- -------------
    idna 2.7     PYSEC-2024-60  3.7
    idna 2.7     PYSEC-2026-215 3.15
  options:
  - text: "`uv lock --upgrade-package idna` ausführen, die Tests laufen lassen und das Lockfile committen."
    correct: true
    why: Version 3.15 behebt beide Meldungen. Weil `idna` nur transitiv vorkommt, ändert sich nur `uv.lock`, die `pyproject.toml` bleibt unberührt.
  - text: "`idna==3.7` in die `pyproject.toml` schreiben."
    correct: false
    why: Version 3.7 behebt nur die erste Meldung, und ein Pin auf ein Fremdpaket engt dein Projekt ohne Not ein.
  - text: Beide IDs mit `--ignore-vuln` ausblenden, weil `idna` nur indirekt vorkommt.
    correct: false
    why: Indirekt installiert heißt trotzdem ausgeführt. Ausblenden ist nur mit Ticket und Frist vertretbar, wenn es keine Korrektur gibt.
  - text: "`uv.lock` löschen und neu erzeugen."
    correct: false
    why: Das hebt alle Pakete auf einmal an. Der Diff ist nicht mehr prüfbar, und ein Fehler lässt sich keinem Upgrade zuordnen.
  explanation: Die Spalte `Fix Versions` nennt, ab welcher Version die Meldung verschwindet. Bei mehreren Treffern zählt die höchste. Das gezielte Upgrade ändert genau das eine Paket, der Diff im PR bleibt lesbar, und ein Testlauf zeigt, ob die neue Version etwas bricht.
  resources:
  - title: pip-audit
    url: https://pypi.org/project/pip-audit/
  - title: uv · Upgrading locked package versions
    url: https://docs.astral.sh/uv/concepts/projects/sync/#upgrading-locked-package-versions
- id: locked-test
  type: command
  title: CI ohne stilles Neuauflösen
  prompt: Führe pytest über uv aus und verlange mit --locked eine passende Lockdatei.
  answers:
  - uv run --locked pytest
  explanation: --locked verhindert eine unbemerkte Aktualisierung der Lockdatei. Ein inkonsistentes Projekt soll
    in CI sichtbar scheitern.
  resources:
  - *id001
- id: gruppe-anlegen
  type: command
  title: Ruff in eine eigene Gruppe legen
  prompt: Füge `ruff` als Abhängigkeit der Gruppe `lint` hinzu, nicht als Laufzeitabhängigkeit des Pakets.
  context: Du bist im Projektverzeichnis von `bericht-cli`.
  answers:
  - uv add --group lint ruff
  - uv add --group=lint ruff
  - uv add ruff --group lint
  output: |-
    Resolved 18 packages in 3ms
    Installed 1 package in 4ms
     + ruff==0.16.10
  explanation: '`--group lint` schreibt `ruff` in die Tabelle `[dependency-groups]` unter dem Schlüssel `lint`. Die Laufzeitabhängigkeiten in `[project]` und die Metadaten des Wheels bleiben unverändert. Nur die Gruppe `dev` installiert uv standardmäßig mit, `lint` kommt erst mit `uv sync --group lint`.'
  resources:
  - title: uv · Dependency groups
    url: https://docs.astral.sh/uv/concepts/projects/dependencies/#dependency-groups
- id: extra-installieren
  type: command
  title: Einen Extra mitinstallieren
  prompt: Das Projekt hat in `[project.optional-dependencies]` den Extra `cli`. Installiere ihn zusätzlich in die Entwicklungsumgebung.
  context: Du bist im Projektverzeichnis von `bericht-cli`.
  answers:
  - uv sync --extra cli
  - uv sync --extra=cli
  output: |-
    Resolved 18 packages in 1ms
    Installed 3 packages in 8ms
     + markdown-it-py==4.2.0
     + mdurl==0.1.2
     + rich==15.0.0
  explanation: '`--extra cli` nimmt genau den einen Extra dazu, `--all-extras` alle. Nutzer des Pakets schreiben dafür `pip install "bericht-cli[cli]"`. Anders als eine Gruppe steht der Extra in den Metadaten des Wheels.'
  resources:
  - title: uv · Optional dependencies
    url: https://docs.astral.sh/uv/concepts/projects/dependencies/#optional-dependencies
- id: paket-upgraden
  type: command
  title: Nur ein Paket aktualisieren
  prompt: Aktualisiere im Lockfile ausschließlich `httpx`. Die übrigen Pakete behalten ihre Version, soweit `httpx` nichts anderes verlangt.
  context: Du bist im Projektverzeichnis von `bericht-cli`.
  answers:
  - uv lock --upgrade-package httpx
  - uv lock -P httpx
  - uv lock --upgrade-package=httpx
  output: |-
    Resolved 18 packages in 94ms
    Updated httpx v0.27.2 -> v0.28.1
    Removed sniffio v1.3.1
  explanation: '`--upgrade-package` (kurz `-P`) hebt ein Paket an, soweit die Bereiche in `pyproject.toml` es erlauben. `uv lock --upgrade` hebt alle an. Der Diff von `uv.lock` zeigt danach, was sich geändert hat. Hier ist `sniffio` weggefallen, weil die neue `httpx`-Version es nicht mehr braucht.'
  resources:
  - title: uv · Upgrading locked package versions
    url: https://docs.astral.sh/uv/concepts/projects/sync/#upgrading-locked-package-versions
- id: toml-projekt
  type: output
  title: Metadaten lesen
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    import tomllib
    d = tomllib.loads('[project]\nname="bericht-cli"\nversion="0.1.0"')
    print(d["project"]["name"])
    print(d["project"]["version"])
  expected: |-
    bericht-cli
    0.1.0
  explanation: TOML-Tabellen werden als Dictionaries gelesen. Die Versionsangabe bleibt ein String und wird nicht
    als Fließkommazahl interpretiert.
  resources:
  - *id001
- id: import-guard
  type: output
  title: Importiert oder gestartet?
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    namensraum = {"__name__": "bericht_cli.cli"}
    exec('print("import")\nif __name__ == "__main__":\n    print("start")', namensraum)
  expected: import
  explanation: Der Hauptblock läuft bei einem normalen Import nicht. Code außerhalb des Blocks läuft dagegen auch
    beim Import.
  resources:
  - *id001
- id: pyproject-struktur-vorhersage
  type: output
  title: Wo stehen Extras und Gruppen?
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    import tomllib

    projekt = tomllib.loads('''
    [project]
    name = "bericht-cli"
    dependencies = ["httpx>=0.28"]

    [project.optional-dependencies]
    cli = ["rich>=13"]

    [dependency-groups]
    dev = ["pytest>=9"]
    lint = ["ruff>=0.16"]
    ''')
    print(projekt["project"]["dependencies"])
    print(sorted(projekt["project"]["optional-dependencies"]))
    print(sorted(projekt["dependency-groups"]))
    print("dependency-groups" in projekt["project"])
  expected: |-
    ['httpx>=0.28']
    ['cli']
    ['dev', 'lint']
    False
  explanation: Extras sind Teil der Tabelle `[project]`, deshalb liegen sie unter `projekt["project"]["optional-dependencies"]`, und das Wheel veröffentlicht sie. `[dependency-groups]` ist eine eigene Tabelle auf oberster Ebene und gehört nicht zu `[project]`. Deshalb erscheinen Gruppen nicht in den Metadaten des Pakets.
  resources:
  - title: Packaging · Dependency Groups
    url: https://packaging.python.org/en/latest/specifications/dependency-groups/
- id: projektname
  type: code
  title: Metadaten gezielt lesen
  prompt: Schreibe `projektname(text)`, die mit tomllib den Namen aus `[project]` zurückgibt. Fehlt die Tabelle
    oder der Name, liefere None.
  lang: python
  starter: |-
    def projektname(text):
        ...
  solution: |-
    import tomllib
    def projektname(text):
        return tomllib.loads(text).get("project", {}).get("name")
  tests:
  - name: Name
    code: assert projektname('[project]\nname="tool"') == "tool"
  - name: Leeres Dokument
    code: assert projektname("") is None
  - name: Andere Metadaten
    code: assert projektname('[project]\nversion="1.0"') is None
  explanation: Der Parser behandelt TOML-Syntax, die Funktion den erwarteten Schlüsselpfad. Fehlende optionale Informationen
    werden explizit durch None dargestellt.
  resources:
  - *id001
- id: entry-point
  type: code
  title: Ein Entry-Point-Verzeichnis
  prompt: Schreibe `skripte(text)`. Lies `[project.scripts]` aus TOML und liefere alphabetisch sortierte Paare `(name,
    ziel)`; fehlt die Tabelle, liefere [].
  lang: python
  starter: |-
    def skripte(text):
        ...
  solution: |-
    import tomllib
    def skripte(text):
        return sorted(tomllib.loads(text).get("project", {}).get("scripts", {}).items())
  tests:
  - name: Zwei Skripte
    code: assert skripte('[project.scripts]\nz="pkg.cli:z"\na="pkg.cli:a"') == [("a", "pkg.cli:a"), ("z", "pkg.cli:z")]
  - name: Leer
    code: assert skripte("") == []
  - name: Kein Skript
    code: assert skripte('[project]\nname="tool"') == []
  explanation: Entry Points sind deklarierte Namen mit Modul-und-Funktions-Ziel. Das Sortieren macht eine Berichtsausgabe
    reproduzierbar, ohne die Konfiguration umzuschreiben.
  resources:
  - *id001
- id: toml-binaer
  type: gap
  title: Datei korrekt öffnen
  prompt: Ergänze den Dateimodus für tomllib.load.
  lang: python
  code: |-
    import tomllib
    with open("pyproject.toml", ⟦"rb"⟧) as datei:
        projekt = tomllib.load(datei)
  explanation: tomllib.load erwartet eine binäre Datei. loads arbeitet dagegen mit bereits dekodiertem Text.
  resources:
  - *id001
  gaps:
  - label: Datei korrekt öffnen
    hint: Die Datei wird lesend und binär geöffnet.
- id: pyproject-gruppen
  type: gap
  title: Extra oder Gruppe?
  prompt: |-
    `rich` soll Nutzer der CLI mit `pip install "bericht-cli[cli]"` zuschalten können. `pytest` und `ruff` brauchen nur die Entwickler und dürfen nicht ins Wheel. Ergänze die beiden Tabellennamen.
  lang: toml
  code: |-
    [project]
    name = "bericht-cli"
    version = "0.1.0"
    requires-python = ">=3.12"
    dependencies = ["httpx>=0.28"]

    [⟦project.optional-dependencies⟧]
    cli = ["rich>=13"]

    [⟦dependency-groups⟧]
    dev = ["pytest>=9"]
    lint = ["ruff>=0.16"]
  gaps:
  - label: Tabelle für Nutzer
    hint: Die Tabelle liegt unter `project` und heißt „optionale Abhängigkeiten“.
  - label: Tabelle für Entwickler
    hint: Sie steht auf oberster Ebene, ohne `project`, und trägt Bindestrich im Namen.
  explanation: |-
    `[project.optional-dependencies]` ist Teil der Projektmetadaten: Das Wheel führt sie als `Provides-Extra: cli` und `Requires-Dist: rich>=13; extra == 'cli'`. `[dependency-groups]` (PEP 735) steht neben `[project]` und bleibt beim Bauen draußen. Ein Entwicklungswerkzeug in einem Extra würde dagegen als installierbare Option veröffentlicht, die Nutzer nie brauchen.
  resources:
  - title: uv · Dependency groups vs. optional dependencies
    url: https://docs.astral.sh/uv/concepts/projects/dependencies/#dependency-groups
- id: versionsangaben-setzen
  type: gap
  title: Versionsangaben einer Bibliothek
  prompt: |-
    `radwerk-client` ist eine Bibliothek. Sie wird mit `httpx` 0.28.1 getestet und soll jede neuere Version zulassen, ohne Obergrenze. `typer` soll ab 0.27.2 bis vor 0.28 erlaubt sein. Nutze dafür den Operator für kompatible Releases.
  lang: toml
  code: |-
    [project]
    name = "radwerk-client"
    version = "2.3.0"
    requires-python = ">=3.12"
    dependencies = [
        "httpx⟦>=0.28.1⟧",
        "typer⟦~=0.27.2⟧",
    ]
  gaps:
  - label: Nur Untergrenze
    hint: Operator „größer oder gleich“, danach die getestete Version.
  - label: Kompatibles Release
    hint: Der Operator besteht aus Tilde und Gleichheitszeichen. Die Version nennt alle drei Stellen.
  explanation: '`>=0.28.1` setzt eine Untergrenze und lässt jede neuere Version zu. Das ist die richtige Wahl für Bibliotheken, weil Nutzer sie mit anderen Paketen kombinieren. `~=0.27.2` bedeutet `>=0.27.2, ==0.27.*`: Die vorletzte Stelle darf nicht steigen, also bleibt 0.28 ausgeschlossen. Die Schreibweise `>=0.27.2,<0.28` meint dasselbe.'
  resources:
  - title: Packaging · Version specifiers
    url: https://packaging.python.org/en/latest/specifications/version-specifiers/#compatible-release
- id: wheel-inhalt
  type: command
  title: Ein Wheel ansehen
  prompt: Liste den Inhalt von `dist/bericht_cli-0.1.0-py3-none-any.whl` auf, ohne das Archiv zu entpacken.
  context: Du hast `uv build` ausgeführt und bist im Projektverzeichnis.
  answers:
  - unzip -l dist/bericht_cli-0.1.0-py3-none-any.whl
  - unzip -l dist/*.whl
  output: |-
    Archive:  dist/bericht_cli-0.1.0-py3-none-any.whl
      Length      Date    Time    Name
    ---------  ---------- -----   ----
           48  2020-02-02 00:00   bericht_cli/__init__.py
            0  2020-02-02 00:00   bericht_cli/py.typed
          264  2020-02-02 00:00   bericht_cli-0.1.0.dist-info/METADATA
           87  2020-02-02 00:00   bericht_cli-0.1.0.dist-info/WHEEL
           45  2020-02-02 00:00   bericht_cli-0.1.0.dist-info/entry_points.txt
          468  2020-02-02 00:00   bericht_cli-0.1.0.dist-info/RECORD
    ---------                     -------
          912                     6 files
  explanation: Ein Wheel ist ein ZIP-Archiv, `unzip -l` listet es auf. Prüfe, ob das Paketverzeichnis vollständig ist, `entry_points.txt` deinen Befehl enthält und `tests/`, `.env` und `uv.lock` fehlen. `unzip -p datei.whl '*/METADATA'` zeigt die Metadaten samt Abhängigkeiten und Extras.
  resources:
  - title: Packaging · Binary distribution format
    url: https://packaging.python.org/en/latest/specifications/binary-distribution-format/
- id: paketdateien
  type: code
  title: Artefaktinhalt sichten
  prompt: Schreibe `auffaellige_dateien(namen)`. Melde sortiert alle Archivpfade, die eine Komponente `.venv` oder
    `__pycache__` haben oder deren letzter Name `.env` ist. Pfade verwenden `/`.
  lang: python
  starter: |-
    def auffaellige_dateien(namen):
        ...
  solution: |-
    from pathlib import PurePosixPath
    def auffaellige_dateien(namen):
        return sorted(n for n in namen if any(p in {".venv", "__pycache__"} for p in PurePosixPath(n).parts) or PurePosixPath(n).name == ".env")
  tests:
  - name: Unerwünschte Daten
    code: assert auffaellige_dateien(["pkg/a.py", "pkg/.env", ".venv/lib/a.py"]) == [".venv/lib/a.py", "pkg/.env"]
  - name: Cache
    code: assert auffaellige_dateien(["pkg/__pycache__/a.pyc"]) == ["pkg/__pycache__/a.pyc"]
  - name: Keine Teiltreffer
    code: assert auffaellige_dateien(["pkg/env.py", "pkg/.env.example", "pkg/venv_notes.txt"]) == []
  explanation: Pfadkomponenten sind präziser als eine beliebige Teilstringsuche. Die Aufgabe ist eine Sichtungshilfe;
    eine vollständige Prüfung des Artefakts umfasst zusätzlich erwartete Paketdateien und Daten.
  resources:
  - *id001
- id: lock-diff-lesen
  type: code
  title: Einen Lockfile-Diff zusammenfassen
  prompt: |-
    Im PR zeigt der Diff von `uv.lock` viele Zeilen. Schreibe `lock_diff(alt, neu)`, die ihn zusammenfasst. Beide Argumente sind Dictionaries `{paketname: version}` mit Versionen wie `"0.27.2"`. Die Funktion gibt ein Dictionary mit vier Listen zurück, jeweils nach Paketname sortiert:

    - `"neu"`: Namen, die nur in `neu` stehen.
    - `"entfernt"`: Namen, die nur in `alt` stehen.
    - `"aktualisiert"`: Tupel `(name, alte_version, neue_version)` für Pakete in beiden, deren Version sich geändert hat.
    - `"hauptversion"`: Namen aus `"aktualisiert"`, deren erste Versionszahl sich geändert hat (`1.10.0` zu `2.0.0`).
  lang: python
  starter: |-
    def lock_diff(alt, neu):
        ...
  solution: |-
    def lock_diff(alt, neu):
        gemeinsam = sorted(alt.keys() & neu.keys())
        aktualisiert = [(name, alt[name], neu[name]) for name in gemeinsam if alt[name] != neu[name]]
        return {
            "neu": sorted(neu.keys() - alt.keys()),
            "entfernt": sorted(alt.keys() - neu.keys()),
            "aktualisiert": aktualisiert,
            "hauptversion": [n for n, a, b in aktualisiert if a.split(".")[0] != b.split(".")[0]],
        }
  tests:
  - name: Neue und entfernte Pakete
    code: |-
      diff = lock_diff({"httpx": "0.27.2", "sniffio": "1.3.1"}, {"httpx": "0.28.1", "h11": "0.16.0"})
      assert diff["neu"] == ["h11"], f"neu: {diff['neu']!r}"
      assert diff["entfernt"] == ["sniffio"], f"entfernt: {diff['entfernt']!r}"
  - name: Aktualisierte Pakete mit alter und neuer Version
    code: |-
      diff = lock_diff({"httpx": "0.27.2", "rich": "13.7.0"}, {"httpx": "0.28.1", "rich": "13.7.0"})
      assert diff["aktualisiert"] == [("httpx", "0.27.2", "0.28.1")], f"aktualisiert: {diff['aktualisiert']!r}"
  - name: Hauptversionssprung
    code: |-
      diff = lock_diff({"rich": "13.7.0", "pydantic": "1.10.0"}, {"rich": "13.9.0", "pydantic": "2.0.0"})
      assert diff["aktualisiert"] == [("pydantic", "1.10.0", "2.0.0"), ("rich", "13.7.0", "13.9.0")], f"aktualisiert: {diff['aktualisiert']!r}"
      assert diff["hauptversion"] == ["pydantic"], f"hauptversion: {diff['hauptversion']!r}"
  - name: Unveränderte Lockfiles
    code: |-
      gleich = {"httpx": "0.28.1", "h11": "0.16.0"}
      assert lock_diff(gleich, dict(gleich)) == {"neu": [], "entfernt": [], "aktualisiert": [], "hauptversion": []}
  hints:
  - Mengenoperationen auf `alt.keys()` und `neu.keys()` liefern neue, entfernte und gemeinsame Namen.
  - Vergleiche für die gemeinsamen Namen `alt[name]` mit `neu[name]`. Erst dann gibt es ein Tupel.
  - '`version.split(".")[0]` ist die erste Versionszahl als Text.'
  explanation: Die Mengenoperationen auf `dict.keys()` trennen neue, entfernte und gemeinsame Pakete. Nur bei den gemeinsamen vergleichst du die Version. Ein Hauptversionssprung ist der Fall, den du im Review zuerst prüfen willst, weil dort Brüche erlaubt sind. Sortierte Listen machen die Ausgabe reproduzierbar.
  resources:
  - title: uv · Upgrading locked package versions
    url: https://docs.astral.sh/uv/concepts/projects/sync/#upgrading-locked-package-versions
- id: einstieg-import
  type: bug
  title: Ein Job startet beim Import
  prompt: Beim Import von cli startet der Bericht bereits. Er soll ausschließlich bei direktem Start des Moduls
    laufen. Korrigiere die Bedingung.
  lang: python
  code: |-
    def main():
        print("Bericht")
    if __name__ != "__main__":
        main()
  lines:
  - 3
  fix:
  - line: 3
    answers:
    - 'if __name__ == "__main__":'
  explanation: Der importierte Modulname ist normalerweise nicht __main__. Die vertauschte Bedingung löst daher
    genau im falschen Lebenszyklus aus.
