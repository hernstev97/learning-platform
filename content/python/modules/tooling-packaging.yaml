id: tooling-packaging
title: Tooling & Packaging
level: 3
minutes: 160
summary: 'Python-Projekte reproduzierbar aufbauen: uv, virtuelle Umgebungen, Ruff, pyproject.toml, src-Layout und
  installierbare Pakete.'
goals:
- Du trennst Interpreter, virtuelle Umgebung, Projektabhängigkeiten und Build-Artefakt.
- Du pflegst pyproject.toml und uv.lock mit bewusstem Versionsvertrag.
- Du formatierst und prüfst Code mit Ruff und führst Werkzeuge reproduzierbar aus.
- Du baust ein Wheel und prüfst seine Installation außerhalb des Quellverzeichnisses.
resources:
- &id001
  title: uv · Projects
  url: https://docs.astral.sh/uv/guides/projects/
- title: Packaging · Writing pyproject.toml
  url: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
- title: Ruff · Tutorial
  url: https://docs.astral.sh/ruff/tutorial/
- title: Packaging · src layout
  url: https://packaging.python.org/en/latest/discussions/src-layout-vs-flat-layout/
lesson: |
  „Auf meinem Rechner läuft es“ hilft wenig, wenn ein Kollege eine andere Bibliotheksversion installiert oder die CI versehentlich den falschen Interpreter verwendet. Tooling macht aus einer lose zusammenkopierten Sammlung von Dateien ein Projekt mit nachvollziehbaren Eingaben, Prüfungen und auslieferbaren Ergebnissen.

  Hier geht es um die Verbindung zwischen diesen Teilen. uv verwaltet Umgebung und Abhängigkeiten, Ruff prüft und formatiert Quellcode, `pyproject.toml` beschreibt Projekt und Build. Ein Wheel ist das installierbare Ergebnis. Keines dieser Werkzeuge ersetzt fachliche Tests; gemeinsam schaffen sie aber eine verlässliche Grundlage dafür.

  ## Projekt, Interpreter und Umgebung

  Python-Quellcode wird von einem Interpreter ausgeführt. Importierte Fremdpakete werden aus dessen Suchpfad geladen. Eine virtuelle Umgebung isoliert installierte Pakete für ein Projekt; sie ist weder ein Container noch eine Sicherheitsgrenze. Betriebssystembibliotheken und Zugriffsrechte bleiben Eigenschaften des Rechners.

  Die [uv-Projektanleitung](https://docs.astral.sh/uv/guides/projects/) zeigt einen zusammenhängenden Ablauf. Nutze ihn im eigenen Arbeitsverzeichnis, nicht durch globale Paketinstallation ins System-Python.

  ```console
  $ uv init bericht-cli
  $ cd bericht-cli
  $ uv add httpx
  $ uv add --dev pytest ruff
  $ uv run python --version
  $ uv run pytest
  ```

  `uv run` führt im Projektkontext aus und kann die benötigte Umgebung synchronisieren. Du musst die Umgebung nicht in jeder Shell manuell aktivieren. Die Dateien haben verschiedene Aufgaben: `pyproject.toml` enthält den erklärten Bedarf, `uv.lock` die konkret aufgelösten Abhängigkeiten, `.venv` die lokale Installation. Letztere gehört nicht ins Repository.

  ```python run
  import sys
  print(sys.version_info.major)
  print(sys.version_info.minor >= 11)
  ```

  Dieser Browser zeigt seinen eigenen Interpreter. Er prüft nicht, welche Version lokal von uv gewählt wird. Bei lokalen Problemen vergleiche `uv run python --version` und den Interpreter deiner IDE, bevor du Imports reparierst oder Pakete erneut installierst.

  ## pyproject.toml beschreibt den Vertrag

  Die standardisierte `[project]`-Tabelle beschreibt Metadaten und Laufzeitabhängigkeiten. Werkzeugkonfiguration steht unter `[tool.<name>]`. `[build-system]` erklärt, welcher Build-Backend-Code aus dem Quellprojekt ein Paket baut. Die [Packaging-Anleitung](https://packaging.python.org/en/latest/guides/writing-pyproject-toml/) trennt diese Bereiche.

  ```toml
  [build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"

  [project]
  name = "bericht-cli"
  version = "0.1.0"
  requires-python = ">=3.12"
  dependencies = ["httpx>=0.28,<1"]

  [project.scripts]
  bericht = "bericht_cli.cli:main"

  [tool.ruff]
  line-length = 100
  ```

  Der Distributionsname kann Bindestriche enthalten. Der importierbare Paketname ist hier `bericht_cli` und folgt Python-Bezeichnerregeln. `requires-python` beschreibt, welche Interpreter du unterstützt; es installiert nicht magisch eine passende Runtime für alle Nutzer. Prüfe diese Aussage mit deiner Testmatrix und verwendeten Sprachfeatures.

  Eine Abhängigkeitsgrenze wie `>=0.28,<1` erlaubt einen Versionsbereich. Eine konkrete Lockdatei wählt daraus eine Auflösung für das Projekt. Für eine Bibliothek muss der deklarierte Bereich sinnvoll bleiben, weil ihre Nutzer andere Projekte mit anderen Abhängigkeiten kombinieren. Für eine Anwendung ist die getestete Auflösung der direkte Ausgangspunkt des Betriebs.

  ```python run
  import tomllib
  text = '[project]\nname = "bericht-cli"\nversion = "0.1.0"\n'
  metadaten = tomllib.loads(text)
  print(metadaten["project"]["name"])
  ```

  [`tomllib`](https://docs.python.org/3/library/tomllib.html) liest TOML aus der Standardbibliothek. `loads` bekommt einen String; `load` arbeitet mit einer binär geöffneten Datei. Ein Parser erkennt Syntaxfehler, validiert aber noch nicht, ob deine fachlichen Pflichtfelder vorhanden sind. TOML-Schlüssel zu lesen ist auch kein vollständiger Parser für Versionsanforderungen.

  ## Lockdatei und reproduzierbare Prüfungen

  Eine Lockdatei macht die Auflösung überprüfbar. Aktualisiere sie bewusst, reviewe Paketänderungen und führe danach Tests aus. Committe `uv.lock` für dieses Anwendungsprojekt gemeinsam mit Änderungen am erklärten Bedarf. Die Details zu [Locking und Synchronisierung](https://docs.astral.sh/uv/concepts/projects/sync/) erklären den Unterschied zwischen Prüfen, Auflösen und Installieren.

  ```console
  $ uv lock
  $ uv sync --locked
  $ uv run --locked pytest
  $ uv lock --upgrade-package httpx
  ```

  `--locked` soll scheitern, wenn die Lockdatei nicht zum Projekt passt, statt sie stillschweigend neu aufzulösen. Das macht eine CI-Abweichung sichtbar. Ein Cache beschleunigt Downloads, ist aber keine Quelle der Wahrheit. Löscht du ihn, muss das Projekt weiterhin aus Versionsverwaltung und Paketquellen aufgebaut werden können.

  Reproduzierbarkeit hat Grenzen: Betriebssystem, Architektur, native Bibliotheken und externe Dienste können ebenfalls Einfluss haben. Schreibe daher im README die unterstützte Python-Version, den Installationsbefehl und erforderliche Umgebungsvariablen auf. Reale Zugangsdaten gehören nicht ins Beispiel und nicht ins Paket.

  ## Ruff und Typprüfung erfüllen verschiedene Aufgaben

  [Ruff](https://docs.astral.sh/ruff/tutorial/) vereint Linting und Formatierung. `ruff check` findet ausgewählte Regelverstöße, `ruff format` formatiert. In CI nutzt du einen Prüfmodus, damit ein Lauf unformatierten Code meldet, statt ihn nur im flüchtigen Runner zu verändern.

  ```console
  $ uv run ruff check .
  $ uv run ruff format --check .
  $ uv run ruff check --fix .
  $ uv run ruff format .
  ```

  Die letzten beiden Befehle verändern Dateien; lies anschließend den Diff. Automatische Korrekturen sparen Arbeit, ändern aber nicht die Verantwortung für das Ergebnis. Ein Typchecker wie mypy oder pyright untersucht andere Eigenschaften als Ruff. Ein grüner Linter beweist weder korrekte Typen noch korrektes fachliches Verhalten.

  > [!PRAXIS]
  > Ein kleines Projekt braucht klare Standardbefehle: formatieren, linten, testen, bauen. Dieselben Befehle sollten lokal und in CI funktionieren. Zusätzliche Werkzeuge sind sinnvoll, wenn sie einen konkreten Fehler entdecken, nicht nur weil sie verfügbar sind.

  ## Ein Paket wirklich installierbar machen

  Das [src-Layout](https://packaging.python.org/en/latest/discussions/src-layout-vs-flat-layout/) trennt Quellcode vom Repository-Wurzelverzeichnis. So fällt eher auf, wenn ein Test nur wegen des aktuellen Arbeitsverzeichnisses importieren konnte. Ein minimales Layout sieht so aus:

  ```text
  bericht-cli/
    pyproject.toml
    uv.lock
    src/
      bericht_cli/
        __init__.py
        cli.py
    tests/
      test_cli.py
  ```

  Der Entry Point verweist auf eine aufrufbare Funktion. Diese Funktion liest Argumente oder startet die Anwendung; bloßes Importieren des Pakets sollte keinen Job ausführen.

  ```python
  def main():
      print("Bericht bereit")
      return 0

  if __name__ == "__main__":
      raise SystemExit(main())
  ```

  Mit `uv build` entstehen im üblichen Ablauf ein Wheel und eine Quelldistribution. Das Wheel enthält die installierbaren Dateien; eine Quelldistribution ist Ausgangsmaterial für einen Build. Beide können versehentlich Daten vermissen oder unnötige Dateien enthalten. Prüfe daher nicht nur den Entwicklungsimport, sondern das gebaute Artefakt in einer frischen Umgebung außerhalb des Repos.

  ```console
  $ uv build
  $ uv venv /tmp/bericht-wheel-test
  $ uv pip install --python /tmp/bericht-wheel-test/bin/python dist/bericht_cli-0.1.0-py3-none-any.whl
  $ /tmp/bericht-wheel-test/bin/bericht
  ```

  Der Beispielpfad gehört zu Linux oder macOS. Nutze auf Windows die entsprechende `Scripts`-Struktur. Für eine ausführliche Einführung in Build und Distribution siehe das [Packaging-Tutorial](https://packaging.python.org/en/latest/tutorials/packaging-projects/).

  ## Häufige Fehler und Review

  Ein `ModuleNotFoundError` kann bedeuten, dass das Paket nicht installiert ist, der falsche Interpreter läuft oder der Build Dateien ausgeschlossen hat. Das sind unterschiedliche Ursachen. Starte mit einer frischen Umgebung und einem reproduzierbaren Befehl; vermeide dauerhafte `sys.path`-Manipulationen als Schnellreparatur.

  > [!WARNING]
  > Veröffentliche ein Paket erst, wenn Name, Inhalt und Zielrepository bewusst gewählt sind. Für das Lernen reicht ein lokaler Build mit lokaler Installation; ein Upload ist ein eigener Schritt.

  > [!INTERVIEW]
  > „Was ist der Unterschied zwischen pyproject und Lockdatei?“ Erkläre Bedarf versus konkrete Auflösung. Ergänze, dass ein Wheel das installierbare Ergebnis ist und die virtuelle Umgebung dessen lokale Nutzung ermöglicht.

  ## Zusammenfassung

  - Interpreter und Umgebung müssen zum Projekt passen.
  - `pyproject.toml` beschreibt Metadaten, Abhängigkeiten und Build.
  - Die Lockdatei macht eine konkrete Auflösung reproduzierbar.
  - Ruff, Typchecker und Tests prüfen unterschiedliche Eigenschaften.
  - Ein Entry Point verweist auf eine Funktion im installierten Paket.
  - Prüfe das Wheel auch außerhalb des Quellverzeichnisses.
exercises:
- id: artefakte
  type: choice
  title: Welche Datei hat welche Rolle?
  prompt: Welche Aussage stimmt?
  options:
  - text: uv.lock hält eine konkrete Abhängigkeitsauflösung fest.
    correct: true
    why: Das ergänzt den in pyproject erklärten Bedarf.
  - text: .venv gehört ins Repository.
    correct: false
    why: Die lokale Installation wird reproduziert und nicht kopiert.
  - text: Ein grüner Linter ersetzt fachliche Tests.
    correct: false
    why: Stilregeln prüfen nicht alle fachlichen Anforderungen.
  explanation: Bedarf, Auflösung und Installation sind getrennte Zustände. Diese Trennung hilft auch beim Debuggen
    von abweichenden Rechnern.
  resources:
  - *id001
- id: locked-test
  type: command
  title: CI ohne stilles Neuauflösen
  prompt: Führe pytest über uv aus und verlange mit --locked eine passende Lockdatei.
  answers:
  - uv run --locked pytest
  explanation: --locked verhindert eine unbemerkte Aktualisierung der Lockdatei. Ein inkonsistentes Projekt soll
    in CI sichtbar scheitern.
  resources:
  - *id001
- id: toml-projekt
  type: output
  title: Metadaten lesen
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    import tomllib
    d = tomllib.loads('[project]\nname="bericht-cli"\nversion="0.1.0"')
    print(d["project"]["name"])
    print(d["project"]["version"])
  expected: |-
    bericht-cli
    0.1.0
  explanation: TOML-Tabellen werden als Dictionaries gelesen. Die Versionsangabe bleibt ein String und wird nicht
    als Fließkommazahl interpretiert.
  resources:
  - *id001
- id: import-guard
  type: output
  title: Importiert oder gestartet?
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    namensraum = {"__name__": "bericht_cli.cli"}
    exec('print("import")\nif __name__ == "__main__":\n    print("start")', namensraum)
  expected: import
  explanation: Der Hauptblock läuft bei einem normalen Import nicht. Code außerhalb des Blocks läuft dagegen auch
    beim Import.
  resources:
  - *id001
- id: projektname
  type: code
  title: Metadaten gezielt lesen
  prompt: Schreibe `projektname(text)`, die mit tomllib den Namen aus `[project]` zurückgibt. Fehlt die Tabelle
    oder der Name, liefere None.
  lang: python
  starter: |-
    def projektname(text):
        ...
  solution: |-
    import tomllib
    def projektname(text):
        return tomllib.loads(text).get("project", {}).get("name")
  tests:
  - name: Name
    code: assert projektname('[project]\nname="tool"') == "tool"
  - name: Leeres Dokument
    code: assert projektname("") is None
  - name: Andere Metadaten
    code: assert projektname('[project]\nversion="1.0"') is None
  explanation: Der Parser behandelt TOML-Syntax, die Funktion den erwarteten Schlüsselpfad. Fehlende optionale Informationen
    werden explizit durch None dargestellt.
  resources:
  - *id001
- id: entry-point
  type: code
  title: Ein Entry-Point-Verzeichnis
  prompt: Schreibe `skripte(text)`. Lies `[project.scripts]` aus TOML und liefere alphabetisch sortierte Paare `(name,
    ziel)`; fehlt die Tabelle, liefere [].
  lang: python
  starter: |-
    def skripte(text):
        ...
  solution: |-
    import tomllib
    def skripte(text):
        return sorted(tomllib.loads(text).get("project", {}).get("scripts", {}).items())
  tests:
  - name: Zwei Skripte
    code: assert skripte('[project.scripts]\nz="pkg.cli:z"\na="pkg.cli:a"') == [("a", "pkg.cli:a"), ("z", "pkg.cli:z")]
  - name: Leer
    code: assert skripte("") == []
  - name: Kein Skript
    code: assert skripte('[project]\nname="tool"') == []
  explanation: Entry Points sind deklarierte Namen mit Modul-und-Funktions-Ziel. Das Sortieren macht eine Berichtsausgabe
    reproduzierbar, ohne die Konfiguration umzuschreiben.
  resources:
  - *id001
- id: toml-binaer
  type: gap
  title: Datei korrekt öffnen
  prompt: Ergänze den Dateimodus für tomllib.load.
  lang: python
  code: |-
    import tomllib
    with open("pyproject.toml", ⟦"rb"⟧) as datei:
        projekt = tomllib.load(datei)
  explanation: tomllib.load erwartet eine binäre Datei. loads arbeitet dagegen mit bereits dekodiertem Text.
  resources:
  - *id001
  gaps:
  - label: Datei korrekt öffnen
    hint: Die Datei wird lesend und binär geöffnet.
- id: paketdateien
  type: code
  title: Artefaktinhalt sichten
  prompt: Schreibe `auffaellige_dateien(namen)`. Melde sortiert alle Archivpfade, die eine Komponente `.venv` oder
    `__pycache__` haben oder deren letzter Name `.env` ist. Pfade verwenden `/`.
  lang: python
  starter: |-
    def auffaellige_dateien(namen):
        ...
  solution: |-
    from pathlib import PurePosixPath
    def auffaellige_dateien(namen):
        return sorted(n for n in namen if any(p in {".venv", "__pycache__"} for p in PurePosixPath(n).parts) or PurePosixPath(n).name == ".env")
  tests:
  - name: Unerwünschte Daten
    code: assert auffaellige_dateien(["pkg/a.py", "pkg/.env", ".venv/lib/a.py"]) == [".venv/lib/a.py", "pkg/.env"]
  - name: Cache
    code: assert auffaellige_dateien(["pkg/__pycache__/a.pyc"]) == ["pkg/__pycache__/a.pyc"]
  - name: Keine Teiltreffer
    code: assert auffaellige_dateien(["pkg/env.py", "pkg/.env.example", "pkg/venv_notes.txt"]) == []
  explanation: Pfadkomponenten sind präziser als eine beliebige Teilstringsuche. Die Aufgabe ist eine Sichtungshilfe;
    eine vollständige Prüfung des Artefakts umfasst zusätzlich erwartete Paketdateien und Daten.
  resources:
  - *id001
- id: einstieg-import
  type: bug
  title: Ein Job startet beim Import
  prompt: Beim Import von cli startet der Bericht bereits. Er soll ausschließlich bei direktem Start des Moduls
    laufen. Korrigiere die Bedingung.
  lang: python
  code: |-
    def main():
        print("Bericht")
    if __name__ != "__main__":
        main()
  lines:
  - 3
  fix:
  - line: 3
    answers:
    - 'if __name__ == "__main__":'
  explanation: Der importierte Modulname ist normalerweise nicht __main__. Die vertauschte Bedingung löst daher
    genau im falschen Lebenszyklus aus.
  resources:
  - *id001
- id: src-import
  type: explain
  title: Weshalb außerhalb testen?
  prompt: Erkläre, welche Lücke ein Wheel-Test außerhalb des Repos schließt.
  lang: python
  code: |-
    from bericht_cli.cli import main
    main()
  points:
  - Ein Entwicklungsimport kann Dateien direkt aus dem Arbeitsbaum finden.
  - Das Wheel kann wegen Build-Konfiguration andere Dateien enthalten.
  - Eine frische Umgebung prüft die installierten Abhängigkeiten.
  - Ein Start außerhalb des Repos vermeidet zufällige lokale Importpfade.
  explanation: Ein erfolgreicher Entwicklungsstart beweist noch nicht, dass das Artefakt vollständig ist. Die isolierte
    Installation testet die tatsächliche Auslieferung und entdeckt fehlende Paketdateien oder Abhängigkeiten.
  resources:
  - *id001
- id: paket-bauen
  type: practice
  title: Eine auslieferbare Berichts-CLI
  prompt: Erstelle lokal ein src-Paket mit einem Entry Point bericht. Baue ein Wheel und starte den installierten
    Befehl aus einem anderen Verzeichnis.
  lang: toml
  solution: |-
    [build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

    [project]
    name = "bericht-cli"
    version = "0.1.0"
    requires-python = ">=3.12"

    [project.scripts]
    bericht = "bericht_cli.cli:main"
  checklist:
  - src/bericht_cli/cli.py enthält eine main-Funktion.
  - pyproject und Lockdatei sind konsistent.
  - Ruff-Prüfung und Tests sind grün.
  - Das Wheel startet in einer frischen Umgebung außerhalb des Repos.
  - Keine Umgebungsdateien oder Zugangsdaten liegen im Artefakt.
  explanation: Das Ergebnis ist erst dann praktisch nutzbar, wenn die installierte CLI funktioniert. Die Konfiguration
    allein beweist weder vollständigen Paketinhalt noch einen korrekten Entry Point.
  resources:
  - *id001
