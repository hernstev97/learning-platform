- id: bibliothek-pinnt-exakt
  type: bug
  title: Die Bibliothek verhindert ein Update
  prompt: |-
    Ein Nutzer meldet: In seinem Projekt, das `radwerk-client` und `httpx>=0.28` braucht, scheitert `uv lock`:

    `Because only radwerk-client==2.3.0 is available and radwerk-client==2.3.0 depends on httpx==0.27.2, we can conclude that all versions of radwerk-client depend on httpx==0.27.2.` Korrigiere die Zeile der Bibliothek. Die Untergrenze bleibt die getestete Version 0.27.2, eine Obergrenze gibt es nicht.
  lang: toml
  code: |-
    [project]
    name = "radwerk-client"
    version = "2.3.0"
    requires-python = ">=3.12"
    dependencies = [
        "httpx==0.27.2",
    ]
  lines:
  - 6
  fix:
  - line: 6
    answers:
    - '"httpx>=0.27.2",'
    - '"httpx>=0.27.2"'
  explanation: Eine Bibliothek, die eine Version mit `==` festlegt, erlaubt im Projekt des Nutzers keine andere. Verlangt irgendein anderes Paket `httpx>=0.28`, findet der Resolver keine Lösung, und der Nutzer kann nichts ändern. Mit `>=0.27.2` gilt die getestete Version als Untergrenze, und Nutzer können neuere nehmen. Den exakten Pin hält das Lockfile der Anwendung fest, nicht die Bibliothek.
  resources:
  - title: Packaging · install_requires vs requirements files
    url: https://packaging.python.org/en/latest/discussions/install-requires-vs-requirements/
- id: src-import
  type: explain
  title: Weshalb außerhalb testen?
  prompt: Erkläre, welche Lücke ein Wheel-Test außerhalb des Repos schließt.
  lang: python
  code: |-
    from bericht_cli.cli import main
    main()
  points:
  - Ein Entwicklungsimport kann Dateien direkt aus dem Arbeitsbaum finden.
  - Das Wheel kann wegen Build-Konfiguration andere Dateien enthalten.
  - Eine frische Umgebung prüft die installierten Abhängigkeiten.
  - Ein Start außerhalb des Repos vermeidet zufällige lokale Importpfade.
  explanation: Ein erfolgreicher Entwicklungsstart beweist noch nicht, dass das Artefakt vollständig ist. Die isolierte
    Installation testet die tatsächliche Auslieferung und entdeckt fehlende Paketdateien oder Abhängigkeiten.
  resources:
  - *id001
- id: bibliothek-vs-anwendung
  type: explain
  title: Bereich oder Pin?
  prompt: Beide Projekte hängen `httpx` ein. Erkläre, warum die Bibliothek nur einen Bereich angibt, die Anwendung zusätzlich ein Lockfile mit exakten Versionen braucht und keines von beiden `==` in `dependencies` schreibt.
  lang: toml
  code: |-
    # radwerk-client/pyproject.toml (Bibliothek, andere Projekte installieren sie)
    [project]
    dependencies = ["httpx>=0.27.2"]

    # radwerk-api/pyproject.toml (Anwendung, läuft im eigenen Container)
    [project]
    dependencies = ["httpx>=0.28.1"]
    # uv.lock ist committet und hält httpx 0.28.1 exakt fest
  points:
  - Die Anwendung kontrolliert ihre Umgebung. Das committete Lockfile macht Builds reproduzierbar, ohne `pyproject.toml` einzuengen.
  - Die Bibliothek landet in fremden Projekten und wird mit anderen Paketen kombiniert. Ein Bereich lässt dem Resolver Spielraum.
  - Ein `==` in einer Bibliothek erzeugt bei Nutzern unlösbare Konflikte, die sie nicht beheben können.
  - Eine Obergrenze setzt du nur bei bekannter Inkompatibilität und erklärst sie in einem Kommentar.
  explanation: |-
    Eine Anwendung läuft in einer Umgebung, die ihr Team selbst baut. Dafür genügt das Lockfile: `uv sync --locked` installiert genau die getesteten Versionen, und `pyproject.toml` bleibt flexibel für Upgrades. Eine Bibliothek kennt die Umgebung ihrer Nutzer nicht. Sie gibt deshalb nur an, was sie braucht, ab welcher Version sie getestet ist und was sie sicher nicht verträgt. Ein exakter Pin würde jedes Projekt blockieren, das dasselbe Paket in einer anderen Version verlangt. Ihr Lockfile gilt nur für die eigene Entwicklung und Tests, Nutzer sehen es nicht.
  resources:
  - title: Packaging · install_requires vs requirements files
    url: https://packaging.python.org/en/latest/discussions/install-requires-vs-requirements/
  - title: Should you use upper bound version constraints?
    url: https://iscinumpy.dev/post/bound-version-constraints/
- id: paket-bauen
  type: practice
  title: Eine auslieferbare Berichts-CLI
  prompt: Erstelle lokal ein src-Paket mit einem Entry Point bericht. Baue ein Wheel und starte den installierten
    Befehl aus einem anderen Verzeichnis.
  lang: toml
  solution: |-
    [build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

    [project]
    name = "bericht-cli"
    version = "0.1.0"
    requires-python = ">=3.12"

    [project.scripts]
    bericht = "bericht_cli.cli:main"
  checklist:
  - src/bericht_cli/cli.py enthält eine main-Funktion.
  - pyproject und Lockdatei sind konsistent.
  - Ruff-Prüfung und Tests sind grün.
  - Das Wheel startet in einer frischen Umgebung außerhalb des Repos.
  - Keine Umgebungsdateien oder Zugangsdaten liegen im Artefakt.
  explanation: Das Ergebnis ist erst dann praktisch nutzbar, wenn die installierte CLI funktioniert. Die Konfiguration
    allein beweist weder vollständigen Paketinhalt noch einen korrekten Entry Point.
  resources:
  - *id001
