cards:
- id: namen
  module: python-einstieg
  q: Was bedeutet „Eine Variable ist ein Name für ein Objekt“?
  a: 'Eine Zuweisung bindet einen Namen an ein Objekt. `a = []` und `b = a` erzeugen keine zwei Listen:
    Beide Namen zeigen auf dieselbe Liste. `b.append(1)` ist daher auch über `a` sichtbar. `b = []` bindet
    dagegen nur `b` neu. Erkläre beim Debuggen, ob ein Objekt verändert oder ein Name neu gebunden wurde.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/introduction.html).'
  tags:
  - grundlagen
  level: 1
- id: identitaet
  module: python-einstieg
  q: Wann verwendest du `is`, wann `==`?
  a: '`is` prüft Objektidentität, `==` den vom Typ definierten Wertvergleich. Zwei getrennt erzeugte Listen
    können gleich sein, ohne dasselbe Objekt zu sein. Für den Singleton `None` ist `value is None` passend.
    Ob kleine Zahlen oder Strings intern wiederverwendet werden, ist keine Grundlage für Geschäftslogik.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/introduction.html).'
  tags:
  - grundlagen
  level: 1
- id: kopien
  module: datenstrukturen
  q: Warum behebt `list(original)` nicht jeden Alias-Bug?
  a: 'Es kopiert die äußere Liste, aber ihre Elemente bleiben dieselben Objekte. Bei verschachtelten Listen
    wirken Änderungen an inneren Listen deshalb weiterhin auf beide äußeren Listen. Wähle eine gezielte
    Kopie des Datenmodells oder `deepcopy`, wenn unabhängige verschachtelte Objekte nötig sind. Tiefes
    Kopieren ist nicht automatisch sinnvoll für Ressourcen wie Dateien.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/introduction.html).'
  tags:
  - grundlagen
  level: 1
- id: defaults
  module: kontrollfluss-funktionen
  q: 'Was ist an `def add(x, items=[]): ...` gefährlich?'
  a: 'Default-Ausdrücke werden beim Definieren der Funktion ausgewertet. Die Liste wird zwischen Aufrufen
    geteilt; ein `append` bleibt für spätere Aufrufe erhalten. Verwende `items=None` und erzeuge bei `None`
    eine neue Liste. Wenn eine übergebene leere Liste erhalten bleiben soll, ist `items or []` dafür die
    falsche Prüfung.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/introduction.html).'
  tags:
  - grundlagen
  level: 1
- id: collections
  module: datenstrukturen
  q: Wie wählst du zwischen Liste, Tupel, Set und Dictionary?
  a: 'Eine Liste ist eine veränderliche Folge, ein Tupel eine unveränderliche Folge von Referenzen. Ein
    Set modelliert eindeutige hashbare Werte und Mengenoperationen. Ein Dictionary bildet hashbare Schlüssel
    auf Werte ab und erhält die Einfügereihenfolge. Die Auswahl folgt Zugriffsart und Datenbedeutung;
    ein Tupel kann trotzdem eine veränderliche Liste enthalten.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/datastructures.html).'
  tags:
  - datenstrukturen
  level: 1
- id: hashbarkeit
  module: datenstrukturen
  q: Warum eignet sich eine Liste nicht als Dictionary-Schlüssel?
  a: 'Hashbasierte Collections brauchen einen während der Verwendung stabilen Hash und einen dazu passenden
    Gleichheitsvergleich. Listen sind veränderlich und unhashbar. Ein Tupel ist nur hashbar, wenn alle
    Elemente hashbar sind. Für einen zusammengesetzten Schlüssel nutze etwa `(user_id, day)` aus unveränderlichen
    Werten.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/datastructures.html).'
  tags:
  - datenstrukturen
  level: 1
- id: komplexitaet
  module: datenstrukturen
  q: Wann verbessert ein Set eine wiederholte Mitgliedschaftsprüfung?
  a: '`x in liste` durchsucht bis zu n Elemente. Ein Set benötigt für typische Hashwerte im Mittel konstante
    Zugriffszeit, aber zusätzlichen Speicher und zunächst linearen Aufbau. Viele Nachfragen rechtfertigen
    den Aufbau oft; bei einer einzigen Nachfrage kann er unnötig sein. Hash-Kollisionen und Worst Cases
    gehören zur Einordnung der Aussage.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/datastructures.html).'
  tags:
  - datenstrukturen
  level: 1
- id: sortieren
  module: datenstrukturen
  q: Warum ist `result = values.sort()` meistens ein Fehler?
  a: '`list.sort()` verändert die Liste und liefert `None`. `sorted(values)` erzeugt eine neue sortierte
    Liste aus einem Iterable. Beide sind stabil: Elemente mit gleichem Sortierschlüssel behalten ihre
    relative Reihenfolge. Nutze `key`, statt eigene Vergleichsschleifen zu schreiben, und entscheide ausdrücklich,
    ob der Aufrufer seine Liste unverändert erwartet.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/datastructures.html).'
  tags:
  - datenstrukturen
  level: 1
- id: comprehension
  module: datenstrukturen
  q: Wann wird eine Comprehension unlesbar?
  a: 'Wenn mehrere verschachtelte Schleifen, Bedingungen oder Seiteneffekte die Transformation verdecken.
    Eine klare Comprehension drückt eine lokale Abbildung oder Filterung aus. Für Validierung mit detaillierten
    Fehlermeldungen ist eine Schleife oft besser. Vergleiche Lesbarkeit am konkreten Datenfluss, statt
    Comprehensions als grundsätzlich schneller oder professioneller darzustellen.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/datastructures.html).'
  tags:
  - datenstrukturen
  level: 1
- id: slicing
  module: datenstrukturen
  q: Was bedeutet `data[start:stop:step]`?
  a: 'Der Start ist inklusive, das Ende exklusive; ein negativer Schritt läuft rückwärts. Bei Listen entsteht
    eine neue flache Liste. `data[::-1]` kehrt die Reihenfolge um, kopiert aber keine verschachtelten
    Objekte. `range` und andere Typen können Slicing anders implementieren; die Kopierkosten hängen vom
    konkreten Typ ab.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/introduction.html).'
  tags:
  - grundlagen
  level: 1
- id: iterator
  module: iteratoren-generatoren
  q: Wie unterscheiden sich Iterable und Iterator?
  a: 'Ein Iterable liefert mit `iter` einen Iterator. Ein Iterator verwaltet seine aktuelle Position,
    liefert mit `next` den nächsten Wert und signalisiert sein Ende mit `StopIteration`. Listen können
    wiederholt neue Iteratoren liefern. Ein bereits verbrauchter Generator liefert beim zweiten Durchlauf
    keine neuen Elemente.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/classes.html).'
  tags:
  - iteratoren
  level: 2
- id: generator
  module: iteratoren-generatoren
  q: Was verändert `yield` an einer Funktion?
  a: 'Ihr Aufruf liefert ein Generatorobjekt; der Funktionskörper läuft erst beim Weiterholen von Werten.
    `yield` gibt einen Wert heraus und erhält den Ausführungszustand für die Fortsetzung. Das ermöglicht
    Pipelines ohne vollständige Zwischenlisten, garantiert aber weder unbegrenzte Geschwindigkeit noch
    mehrere unabhängige Durchläufe.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/classes.html).'
  tags:
  - iteratoren
  level: 2
- id: generator-ressource
  module: iteratoren-generatoren
  q: Ein Generator liest aus einer Datei. Worauf achtest du?
  a: 'Die Datei muss während der Iteration geöffnet bleiben und anschließend zuverlässig geschlossen werden.
    Ein `with` im Generator schließt erst, wenn der Generator endet oder geschlossen wird. Bei vorzeitigem
    Abbruch muss der Aufrufer die Lebensdauer berücksichtigen. Für kurze Dateien kann eine innerhalb von
    `with` fertig gelesene Liste die klarere API sein.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/classes.html).'
  tags:
  - iteratoren
  level: 2
- id: closure
  module: dekoratoren-funktional
  q: Warum liefern Lambdas aus einer Schleife oft alle denselben Wert?
  a: 'Closures greifen auf die Bindung einer freien Variablen zu, nicht automatisch auf ihren damaligen
    Wert. Nach der Schleife enthält diese Bindung oft den letzten Schleifenwert. Binde den aktuellen Wert
    bewusst als Default wie `lambda i=i: i` oder erzeuge pro Durchlauf eine eigene Closure. Prüfe, ob
    frühe oder späte Bindung gewünscht ist.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/functools.html).'
  tags:
  - funktionen
  level: 2
- id: dekorator
  module: dekoratoren-funktional
  q: Wie erklärst du einen Dekorator ohne „Magie“?
  a: '`@decorate` über einer Funktionsdefinition entspricht im Kern `f = decorate(f)`. Ein Wrapper kann
    Verhalten vor oder nach dem Aufruf ergänzen. `functools.wraps` bewahrt nützliche Metadaten. Der Wrapper
    muss Rückgabewerte und Exceptions korrekt weiterreichen; asynchrone Funktionen brauchen passende Behandlung
    ihres Awaitables.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/functools.html).'
  tags:
  - funktionen
  level: 2
- id: context-manager
  module: dekoratoren-funktional
  q: Welches Problem löst ein Context Manager?
  a: 'Er koppelt Betreten und Verlassen eines Gültigkeitsbereichs, etwa Öffnen und Schließen einer Datei.
    `with` führt den Aufräumpfad auch bei Exceptions aus. Ein eigenes `__exit__` darf Fehler nur bewusst
    unterdrücken. Ein Context Manager allein macht externe Nebenwirkungen weder atomar noch rückgängig.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/functools.html).'
  tags:
  - funktionen
  level: 2
- id: dataclass
  module: oop
  q: Was nimmt dir `@dataclass` ab und was nicht?
  a: 'Er erzeugt anhand annotierter Felder unter anderem Konstruktor und Repräsentation sowie standardmäßig
    Wertgleichheit. Er validiert Typen nicht automatisch zur Laufzeit. Veränderliche Defaults brauchen
    eine `default_factory`. `frozen=True` verhindert Feldzuweisungen, macht verschachtelte enthaltene
    Objekte aber nicht automatisch unveränderlich.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/dataclasses.html).'
  tags:
  - oop
  level: 2
- id: komposition
  module: oop
  q: Wann bevorzugst du Komposition gegenüber Vererbung?
  a: 'Wenn ein Objekt eine Fähigkeit verwendet, aber fachlich keine Unterart ihres Anbieters ist. Ein
    Service kann etwa ein Repository erhalten, statt davon zu erben. Das macht Abhängigkeiten austauschbar
    und Tests gezielt. Vererbung passt, wenn Untertypen den Vertrag des Basistyps erhalten und wirklich
    austauschbar sind.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/dataclasses.html).'
  tags:
  - oop
  level: 2
- id: dunder
  module: oop
  q: Warum ist `len(obj)` besser als ein beliebiger eigener Größen-Methodenname?
  a: 'Mit `__len__` nimmt ein Typ am Python-Datenmodell teil. Allgemeine Werkzeuge können dann `len(obj)`
    verwenden, ohne den konkreten Typ zu kennen. Implementiere nur Protokolle, deren Semantik wirklich
    passt; eine teure Netzabfrage als überraschender Längenzugriff wäre eine schlechte Schnittstelle.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/dataclasses.html).'
  tags:
  - oop
  level: 2
- id: exception-scope
  module: fehler-module
  q: Warum sollte ein `try` möglichst eng um die erwartete Fehlerstelle stehen?
  a: 'Ein großes `try` kann einen Fehler aus völlig anderer Ursache als erwarteten Fall missverstehen.
    Fange konkrete Exceptions um die Operation ab, die sie erzeugen darf. Behalte den ursprünglichen Kontext
    etwa mit `raise DomainError(...) from exc`. Schreibe im Fehlerpfad keine Erfolgsmeldung und logge
    denselben Fehler nicht auf jeder Ebene erneut.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/errors.html).'
  tags:
  - fehler
  level: 2
- id: eafp
  module: fehler-module
  q: Was bedeutet EAFP bei Dateizugriffen?
  a: 'Du versuchst den Zugriff und behandelst eine konkrete Exception, statt vorher nur `exists()` zu
    prüfen. Zwischen Existenzprüfung und Öffnen kann sich das Dateisystem ändern. Trotzdem sind Eingabevalidierung
    und verständliche Fehlermeldungen sinnvoll. EAFP heißt nicht, alle Fehler mit `except Exception: pass`
    zu verschlucken.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/tutorial/errors.html).'
  tags:
  - fehler
  level: 2
- id: import
  module: fehler-module
  q: Warum startet ein importiertes Modul manchmal unerwartet Arbeit?
  a: 'Sein Code auf Modulebene wird beim ersten Import ausgeführt. Netzwerkzugriffe, CLI-Parsing oder
    Dateischreiboperationen dort sind daher überraschende Seiteneffekte. Verschiebe den Ablauf in `main()`
    und rufe ihn nur unter dem üblichen `__name__`-Guard auf. Definitionen und notwendige Konstanten bleiben
    beim Import verfügbar.


    [Vertiefen in der Dokumentation](https://docs.astral.sh/uv/guides/projects/).'
  tags:
  - tooling
  level: 2
- id: type-hints
  module: typisierung
  q: 'Verhindert `def double(x: int) -> int` einen String als Argument?'
  a: 'Nein. Die Annotation ist Information für Werkzeuge und Menschen; der Interpreter erzwingt sie nicht
    automatisch. Ein Typechecker findet viele unpassende Aufrufe vorab. An externen Grenzen brauchst du
    trotzdem Laufzeitvalidierung. Tests, statische Prüfung und Validierung beantworten unterschiedliche
    Fragen.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/typing.html).'
  tags:
  - typen
  level: 2
- id: protocol
  module: typisierung
  q: Wann hilft ein `Protocol` beim Testen?
  a: 'Ein Protocol beschreibt die benötigte Struktur, etwa eine Methode `send(message)`. Der Service kann
    einen echten Sender oder einen Fake mit derselben Schnittstelle erhalten, ohne gemeinsame Basisklasse.
    Das hält Tests von Netzwerk und konkreter Bibliothek unabhängig. Laufzeitprüfungen mit Protocols ersetzen
    keine vollständige semantische Validierung.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/typing.html).'
  tags:
  - typen
  level: 2
- id: optional
  module: typisierung
  q: Was sagt `str | None` über ein Argument aus?
  a: 'Der Wert darf String oder `None` sein. Das macht das Argument nicht automatisch optional beim Aufruf;
    dafür braucht es zusätzlich einen Default. Nach einer `is None`-Prüfung kann der Typechecker den verbleibenden
    Typ eingrenzen. Vermeide `Any`, wenn du den erlaubten Wertbereich schon kennst.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/typing.html).'
  tags:
  - typen
  level: 2
- id: async
  module: nebenlaeufigkeit
  q: Warum macht `async def` blockierenden Code nicht nebenläufig?
  a: 'Die Event-Loop kann andere Tasks nur ausführen, wenn Kontrolle zurückgegeben wird, typischerweise
    an geeigneten `await`-Stellen. Ein blockierender synchroner HTTP-Aufruf hält sie weiterhin auf. Nutze
    eine asynchrone Bibliothek oder verlagere geeignete blockierende Arbeit bewusst. CPU-Arbeit braucht
    eine andere Strategie als viele wartende I/O-Aufgaben.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/asyncio-task.html).'
  tags:
  - nebenlaeufigkeit
  level: 2
- id: gil
  module: nebenlaeufigkeit
  q: Wie ordnest du den GIL bei aktuellen Python-Versionen ein?
  a: 'Bei einem üblichen CPython-Build mit aktiviertem GIL führt in einem Prozess nur ein Thread gleichzeitig
    Python-Bytecode aus. I/O und manche native Bibliotheken können den GIL freigeben. Daneben existieren
    optionale free-threaded Builds; Verhalten und Paketkompatibilität müssen am tatsächlichen Interpreter
    geprüft werden. „Python hat keine parallelen Threads“ ist deshalb zu pauschal.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/asyncio-task.html).'
  tags:
  - nebenlaeufigkeit
  level: 2
- id: prozess-thread
  module: nebenlaeufigkeit
  q: 'Threads, Prozesse oder asyncio: Wie entscheidest du?'
  a: 'Nach Arbeitslast und Bibliotheken. Für blockierende I/O können Threads passen; Prozesse ermöglichen
    unabhängige Interpreter für CPU-Arbeit, kosten aber Startzeit, Speicher und Datentransfer. asyncio
    koordiniert viele kooperative I/O-Vorgänge. Miss eine repräsentative Last und begrenze Parallelität,
    statt jede Aufgabe ungeprüft gleichzeitig zu starten.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/asyncio-task.html).'
  tags:
  - nebenlaeufigkeit
  level: 2
- id: cancellation
  module: nebenlaeufigkeit
  q: Warum darfst du Task-Abbruch nicht still verschlucken?
  a: 'Abbruch gehört zur Steuerung strukturierter Nebenläufigkeit. Führe notwendige Aufräumarbeit in `finally`
    aus und lasse `CancelledError` anschließend weiterlaufen. Sonst können Timeouts und TaskGroups länger
    laufen als beabsichtigt. Auch ein abgebrochener HTTP-Aufruf beweist nicht, dass der Server keine Änderung
    ausgeführt hat.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/asyncio-task.html).'
  tags:
  - nebenlaeufigkeit
  level: 2
- id: testgrenzen
  module: testen-pytest
  q: Welche Tests würdest du für eine CSV-Importfunktion zuerst schreiben?
  a: 'Einen normalen Datensatz, leere Eingabe, fehlende Pflichtspalten, ungültige Werte und Duplikate.
    Prüfe beobachtbares Ergebnis und Fehlervertrag. Nutze temporäre Dateien statt persönlicher Daten.
    Ein Integrationstest ergänzt die reine Parserprüfung um echte Persistenz; unkontrollierte Netzaufrufe
    gehören nicht in die Unit-Tests.


    [Vertiefen in der Dokumentation](https://docs.pytest.org/en/stable/).'
  tags:
  - tests
  level: 2
- id: fixture
  module: testen-pytest
  q: Welchen Vorteil haben pytest-Fixtures gegenüber globalen Testdaten?
  a: 'Sie machen Abhängigkeiten und Lebensdauer explizit. Eine Fixture kann pro Test eine frische Datenbank
    erzeugen und über `yield` wieder aufräumen. Zu großer Scope teilt möglicherweise veränderlichen Zustand.
    Wähle Scope nach Isolation und Kosten; ein schneller Test ist wenig wert, wenn er nur in einer bestimmten
    Reihenfolge besteht.


    [Vertiefen in der Dokumentation](https://docs.pytest.org/en/stable/).'
  tags:
  - tests
  level: 2
- id: patch
  module: testen-pytest
  q: Was bedeutet „patch where it is looked up“?
  a: 'Ersetze die Bindung in dem Modul, das sie beim Aufruf nachschlägt. Hat `service` mit `from gateway
    import fetch` importiert, greift es auf `service.fetch` zu. Ein Patch nur auf `gateway.fetch` ändert
    diese bereits importierte Bindung nicht. Eine explizit übergebene Abhängigkeit vermeidet diese Kopplung
    oft ganz.


    [Vertiefen in der Dokumentation](https://docs.pytest.org/en/stable/).'
  tags:
  - tests
  level: 2
- id: parametrize
  module: testen-pytest
  q: Wann nutzt du Parametrisierung?
  a: 'Wenn derselbe Vertrag für mehrere klar benannte Eingaben und erwartete Ergebnisse gilt. So stehen
    Randfälle nebeneinander, ohne den Testablauf zu duplizieren. Unterschiedliche fachliche Abläufe sollten
    getrennte Tests bleiben. Aussagekräftige IDs machen sichtbar, welcher Randfall fehlgeschlagen ist.


    [Vertiefen in der Dokumentation](https://docs.pytest.org/en/stable/).'
  tags:
  - tests
  level: 2
- id: venv
  module: tooling-packaging
  q: Was isoliert eine virtuelle Umgebung und was nicht?
  a: 'Sie trennt Python-Pakete und Interpreterzugriff für ein Projekt von anderen Umgebungen. Sie ist
    keine Sicherheitsgrenze und isoliert weder Netzwerk noch das gesamte Dateisystem. Für Reproduzierbarkeit
    müssen zusätzlich Python-Version, Abhängigkeiten und Installationsweg festgelegt werden.


    [Vertiefen in der Dokumentation](https://docs.astral.sh/uv/guides/projects/).'
  tags:
  - tooling
  level: 2
- id: lockfile
  module: tooling-packaging
  q: Warum reicht `pyproject.toml` allein nicht immer für reproduzierbare Installationen?
  a: 'Es enthält häufig erlaubte Versionsbereiche. Unterschiedliche Installationszeitpunkte können damit
    unterschiedliche transitive Versionen ergeben. Ein passendes Lockfile hält eine konkrete Auflösung
    fest; CI sollte sie kontrolliert verwenden. Aktualisierungen bleiben nötig, werden aber bewusst geprüft
    statt zufällig beim nächsten Build übernommen.


    [Vertiefen in der Dokumentation](https://docs.astral.sh/uv/guides/projects/).'
  tags:
  - tooling
  level: 2
- id: ruff-mypy
  module: tooling-packaging
  q: Welche Fragen beantworten ruff, mypy und pytest?
  a: 'ruff prüft beziehungsweise formatiert Code nach konfigurierten Regeln. mypy untersucht statisch
    Typbeziehungen. pytest führt konkrete Beispiele und Erwartungen aus. Keines beweist allein fachliche
    Korrektheit. Eine Pipeline kombiniert sie, weil Stilprobleme, unpassende Typen und falsches Verhalten
    unterschiedliche Fehlerklassen sind.


    [Vertiefen in der Dokumentation](https://docs.astral.sh/uv/guides/projects/).'
  tags:
  - tooling
  level: 2
- id: http
  module: web-datenbanken
  q: Wie behandelst du einen HTTP-Aufruf robust?
  a: 'Setze Zeitgrenzen, prüfe den Status und validiere den empfangenen Inhalt vor der Verwendung. Ein
    HTTP-200-Status garantiert kein passendes JSON-Schema. Wiederhole nur geeignete Fehler und beachte
    die Semantik der Operation. Ein Timeout bei einem schreibenden Aufruf ist ein ungewisses Ergebnis,
    nicht automatisch ein sicher fehlgeschlagener Vorgang.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/sqlite3.html).'
  tags:
  - web
  level: 2
- id: sql
  module: web-datenbanken
  q: Warum schützt ein SQL-Platzhalter besser als manuelles Escaping?
  a: 'Er übergibt Werte getrennt vom SQL-Ausdruck. Die Datenbank behandelt den Inhalt dadurch als Wert
    statt als SQL-Struktur. Bei sqlite3 lautet ein Beispiel `execute(''SELECT * FROM items WHERE id =
    ?'', (item_id,))`. Tabellen- oder Spaltennamen sind keine gewöhnlichen Werte; dafür brauchst du eine
    feste erlaubte Auswahl.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/sqlite3.html).'
  tags:
  - web
  level: 2
- id: transaktion
  module: web-datenbanken
  q: Wann braucht ein Ablauf eine Transaktion?
  a: 'Wenn mehrere zusammengehörige Änderungen nur gemeinsam sichtbar werden dürfen, etwa Auftrag und
    Positionen. Lege Commit und Rollback bewusst fest und halte die Transaktion möglichst kurz. Eine Datenbanktransaktion
    schließt eine separat versendete E-Mail nicht automatisch ein. Für solche Grenzen brauchst du ein
    eigenes Zustell- und Wiederholungsmodell.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/sqlite3.html).'
  tags:
  - web
  level: 2
- id: pagination
  module: web-datenbanken
  q: Wodurch kann Offset-Paginierung Datensätze überspringen?
  a: 'Ändert sich die sortierte Datenmenge zwischen Abrufen, verschieben sich Positionen. Ein neu eingefügter
    Eintrag kann zu Wiederholungen führen, ein entfernter zu Lücken. Ein stabiler Sortierschlüssel plus
    Cursor kann das entschärfen. Auch dabei musst du Konsistenz, Filter und das Ende der Ergebnismenge
    definieren.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/sqlite3.html).'
  tags:
  - web
  level: 2
- id: algorithmus
  module: algorithmen
  q: Wie gehst du eine Coding-Aufgabe an, bevor du Code schreibst?
  a: 'Kläre Eingaben, Randfälle und erwartete Ausgabe an Beispielen. Beschreibe eine korrekte einfache
    Lösung und ihre Zeit-/Speicherkosten. Suche dann den tatsächlichen Engpass und eine passende Datenstruktur.
    Erkläre eine Invariante und teste sie an leerer, kleiner und ungünstiger Eingabe, bevor du eine Optimierung
    behauptest.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/bisect.html).'
  tags:
  - algorithmen
  level: 3
- id: binaere-suche
  module: algorithmen
  q: Welche Voraussetzung und Invariante braucht binäre Suche?
  a: 'Die Daten müssen bezüglich des Suchschlüssels geordnet sein. Halte ein Suchintervall, in dem ein
    möglicher Treffer noch liegen kann, und verkleinere es in jedem Schritt. Halb offene Intervalle erleichtern
    oft die Randfälle. Bei Duplikaten muss feststehen, ob ein beliebiger, erster oder letzter Treffer
    gesucht ist.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/bisect.html).'
  tags:
  - algorithmen
  level: 3
- id: profiling
  q: Ein Skript wird mit wachsenden Daten langsam. Was tust du zuerst?
  a: 'Ich reproduziere die Last und messe, ob CPU, I/O, Speicher oder externe Wartezeit dominiert. Dann
    profiliere ich den teuren Abschnitt und prüfe etwa wiederholte lineare Suchen oder N+1-Abfragen. Erst
    danach ändere ich Algorithmus oder Parallelität. Derselbe Messfall vor und nach der Änderung belegt
    den Effekt.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/profile.html).'
  tags:
  - praxis
  level: 3
- id: review
  q: Wie erklärst du im Review einen schwer verständlichen Einzeiler?
  a: 'Ich benenne zuerst seinen Vertrag und spiele ein Beispiel durch. Dann schlage ich eine benannte
    Zwischenstufe oder Funktion vor, wenn das Verständnis verbessert. Die Änderung muss bestehendes Verhalten
    und Fehlerfälle erhalten; ein kleiner Test sichert das. Stilgeschmack allein ist ein schwächeres Argument
    als konkrete Wartungs- oder Fehlerrisiken.


    [Vertiefen in der Dokumentation](https://peps.python.org/pep-0008/).'
  tags:
  - praxis
  level: 3
- id: fehlerbericht
  q: Erzähle von einem selbst verursachten Bug. Was gehört in eine gute technische Antwort?
  a: 'Nenne Ausgangslage, deine konkrete Entscheidung, beobachtetes Symptom und den Nachweis der Ursache.
    Beschreibe Korrektur und Regressionstest sowie eine begrenzte Verbesserung des Arbeitsablaufs. Trenne
    eigene Arbeit von Unterstützung. Wenn du noch kein reales Beispiel hast, benutze einen dokumentierten
    Lernprojekt-Bug und sage das offen.


    [Vertiefen in der Dokumentation](https://docs.pytest.org/en/stable/how-to/assert.html).'
  tags:
  - praxis
  level: 3
- id: unbekannte-api
  q: Wie arbeitest du dich unter Zeitdruck in eine unbekannte Bibliothek ein?
  a: 'Ich beginne beim benötigten Anwendungsfall und der offiziellen Dokumentation der eingesetzten Version.
    Ein kleines ausführbares Beispiel prüft den Vertrag. Danach untersuche ich Fehlerverhalten, Lebensdauer
    und Testbarkeit, bevor ich integriere. Unsicherheiten halte ich sichtbar fest, statt fremden Beispielcode
    ungeprüft als Produktionslösung zu übernehmen.


    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/pydoc.html).'
  tags:
  - praxis
  level: 3
- id: tradeoff
  q: Wie begründest du eine einfachere Lösung gegenüber einer aufwendigeren Architektur?
  a: 'Ich verknüpfe die Entscheidung mit aktueller Last, benötigten Garantien und Wartungskosten. Ich
    nenne auch den Punkt, an dem die einfache Lösung nicht mehr reicht, und eine überprüfbare Migrationsbedingung.
    Ein gemessener Engpass oder ein neuer fachlicher Vertrag ist eine bessere Begründung als vorsorgliche
    Komplexität.


    [Vertiefen in der Dokumentation](https://peps.python.org/pep-0020/).'
  tags:
  - praxis
  level: 3
- id: datenstruktur-wahl
  module: oop
  q: Wann nimmst du eine Dataclass, ein NamedTuple, ein TypedDict oder ein pydantic-Modell?
  a: |
    Das hängt davon ab, ob die Daten zur Laufzeit geprüft werden müssen. Nur pydantic validiert und wandelt um (`"7"` wird `7`). Dataclass, `NamedTuple` und `TypedDict` nehmen auch `"abc"` in einem `int`-Feld an, die Annotation ist nur für Editor und Type Checker.

    - Daten von außen (API-Antwort, Konfiguration): pydantic oder eine eigene Prüffunktion an der Grenze.
    - Eigenes Domänenobjekt mit Verhalten: Dataclass, `frozen=True` für Werte.
    - Kurze Zeile mit festen Positionen, die man entpackt (CSV, `(host, port)`): `NamedTuple`.
    - Schon vorhandenes `dict` aus `json.loads`, das der Checker kennen soll: `TypedDict`. Zur Laufzeit bleibt es ein `dict`.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/dataclasses.html).
  tags: [dataclass, typing, validierung]
  level: 2
- id: asdict-tiefenkopie
  module: oop
  q: Was macht dataclasses.asdict, und worauf musst du achten?
  a: |
    `asdict(obj)` macht ein Dictionary aus der Dataclass. Verschachtelte Dataclasses, Listen, Tupel und Dictionaries wandelt es rekursiv um, alle anderen Werte kopiert es mit `copy.deepcopy`. Das Ergebnis teilt also nichts mit dem Original.

    Folgen: Bei großen Objektgraphen kostet das Zeit, nicht kopierbare Werte (etwa ein Lock) lösen einen `TypeError` aus, und `date`, `Decimal` oder `Enum` bleiben unverändert, sodass `json.dumps` scheitert. Dafür gibt es `dict_factory`. `replace()` kopiert dagegen flach: Die veränderlichen Felder der Kopie sind dieselben Objekte wie im Original.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/dataclasses.html#dataclasses.asdict).
  tags: [dataclass, kopie, json]
  level: 2
- id: namedtuple-gleichheit
  module: oop
  q: Worin unterscheidet sich ein NamedTuple von einer Dataclass?
  a: |
    Ein `NamedTuple` ist ein Tupel: unveränderlich, hashbar (wenn die Werte es sind), entpackbar und indizierbar, mit kleinem Speicherbedarf, weil es kein `__dict__` hat. Es vergleicht nur Werte: `Punkt(1, 2) == Groesse(1, 2)` und `Punkt(1, 2) == (1, 2)` sind `True`. Eine Dataclass vergleicht dagegen auch den Typ und ist standardmäßig veränderlich.

    Ich nehme `NamedTuple` für kurzlebige Zeilen und Rückgabewerte mit festen Positionen, die Dataclass für Objekte mit Verhalten und Prüfungen.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/typing.html#typing.NamedTuple).
  tags: [namedtuple, dataclass, tuple]
  level: 2
- id: dataclass-default-geteilt
  module: oop
  q: "Warum lehnt dataclass `liste: list = []` ab, und warum geht `statistik: Statistik = Statistik()` durch?"
  a: |
    Ein Standardwert wird einmal beim Definieren der Klasse ausgewertet und von allen Instanzen geteilt. `dataclass` erkennt veränderliche Defaults nur über die Hashbarkeit (seit 3.11: nicht hashbare Defaults sind verboten, vorher nur `list`, `dict`, `set`). Eine eigene Klasse ohne `__eq__` ist hashbar und wird nicht erkannt.

    Die Behebung ist in beiden Fällen `field(default_factory=...)`, das für jedes Objekt neu aufgerufen wird. Im Review achte ich auf jeden Default, der ein Objekt ist.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/dataclasses.html#mutable-default-values).
  tags: [dataclass, defaults, falle]
  level: 2
- id: logging-dictconfig
  module: fehler-module
  q: Wie konfigurierst du Logging in einer Anwendung, und worauf achtest du bei dictConfig?
  a: |
    Einmal beim Programmstart, im Einstiegspunkt, mit `logging.config.dictConfig`. Das Dictionary beschreibt Formatter, Handler und Logger als Daten (`version: 1` ist Pflicht) und lässt sich pro Umgebung aus einer Datei laden.

    Zwei Dinge prüfe ich immer: `disable_existing_loggers` steht auf `False`, sonst schaltet `dictConfig` Logger stumm, die Module beim Import angelegt haben. Und `propagate: False` bei Loggern, deren Handler auch am Root hängen, sonst erscheinen Zeilen doppelt.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/logging.config.html#logging.config.dictConfig).
  tags: [logging, konfiguration]
  level: 2
- id: logging-bibliothek-nullhandler
  module: fehler-module
  q: Warum konfiguriert eine Bibliothek kein Logging, und wozu dient der NullHandler?
  a: |
    Handler, Format und Level sind Sache der Anwendung. Ein Handler in der Bibliothek erzeugt doppelte Zeilen oder ein fremdes Format. Ein `basicConfig` beim Import belegt den Root-Logger, sodass spätere `basicConfig`-Aufrufe der Anwendung ohne `force=True` nichts tun.

    Die Bibliothek nutzt `getLogger(__name__)` und hängt höchstens `logging.NullHandler()` an den obersten Logger ihres Pakets. Der tut nichts, verhindert aber, dass `logging.lastResort` (stderr, ab `WARNING`, ohne Format) Meldungen ausgibt, solange die Anwendung nichts konfiguriert hat.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/howto/logging.html#configuring-logging-for-a-library).
  tags: [logging, bibliotheken]
  level: 2
- id: logging-level-propagation
  module: fehler-module
  q: Wann erscheint eine Log-Meldung? Erkläre Logger-Level, Handler-Level und Propagation.
  a: |
    Der Logger verwirft Meldungen unter seinem effektiven Level (das erste gesetzte Level Richtung Wurzel). Danach prüft jeder seiner Handler das eigene Level. Mit `propagate=True` geht die Meldung weiter an die Handler der Vorfahren. Dort zählen nur die Handler-Level, die Logger-Level und Filter der Vorfahren werden **nicht** mehr geprüft.

    Folgen: Ein Logger auf `DEBUG` mit einem Handler auf `INFO` zeigt kein `DEBUG`. Ein Kind-Logger mit `DEBUG` erreicht den Handler seines Elternteils, auch wenn der Eltern-Logger auf `WARNING` steht.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/howto/logging.html#logging-flow).
  tags: [logging, level, propagation]
  level: 3
- id: logging-extra-kontext
  module: fehler-module
  q: Wie bringst du Kontext wie eine Request-ID in jede Log-Zeile, und welche Fallen gibt es?
  a: |
    Entweder pro Aufruf mit `extra={"request_id": ...}`, einmal mit einem `LoggerAdapter` oder, ohne den Kontext durchzureichen, mit einer `ContextVar`, die ein Filter am Handler in jeden Datensatz schreibt. Der Formatter gibt das Feld dann mit `%(request_id)s` aus.

    Fallen: Ein Schlüssel in `extra` darf kein `LogRecord`-Attribut überschreiben (`name`, `message`, `args`), sonst gibt es `KeyError: Attempt to overwrite ... in LogRecord`, und zwar nur bei Zeilen, die das Level ausgibt. Fehlt das Feld in einem Datensatz, scheitert das Formatieren. Ein `LoggerAdapter` ersetzt standardmäßig das `extra` des Aufrufs (seit 3.13 mischt `merge_extra=True`).

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/logging.html#loggeradapter-objects).
  tags: [logging, kontext, contextvars]
  level: 3
- id: exitstack-variable-ressourcen
  module: dekoratoren-funktional
  q: Wie öffnest du eine zur Laufzeit bekannte Zahl von Dateien oder Verbindungen und schließt sie sicher?
  a: |
    Mit `contextlib.ExitStack`. Er ist ein Context Manager, der beliebig viele weitere aufnimmt: `with ExitStack() as stack:` und darin `stack.enter_context(open(pfad))` in einer Schleife. Beim Verlassen schließt er alles in umgekehrter Reihenfolge, auch wenn das Öffnen der dritten von fünf Ressourcen scheitert: Dann sind die zwei geöffneten sofort wieder zu. Eine Schleife mit `open` und ein `finally` von Hand bräuchte eine Liste „was ist schon offen“, die `ExitStack` ohnehin führt.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/contextlib.html#supporting-a-variable-number-of-context-managers).
  tags: [context-manager, contextlib]
  level: 2
- id: exitstack-reihenfolge-fehler
  module: dekoratoren-funktional
  q: In welcher Reihenfolge räumt ExitStack auf, und was passiert, wenn ein Aufräumschritt eine Exception wirft?
  a: |
    Last in, first out: Der zuletzt registrierte Schritt läuft zuerst, wie bei verschachtelten `with`-Blöcken. Wirft ein Schritt, laufen die übrigen trotzdem. Die Exception des zuletzt gelaufenen fehlerhaften Schritts fliegt weiter. War schon eine Exception aus dem Block unterwegs, hängt sie als `__context__` daran. Funktionen aus `callback()` bekommen keine Exception übergeben und können keine unterdrücken. Ein `__exit__` aus `enter_context` kann das mit einem wahren Rückgabewert.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/contextlib.html#contextlib.ExitStack).
  tags: [context-manager, contextlib, fehlerbehandlung]
  level: 2
- id: exitstack-pop-all
  module: dekoratoren-funktional
  q: Wozu dient ExitStack.pop_all() und wann rufst du es auf?
  a: |
    `pop_all()` verschiebt alle Aufräumschritte in einen neuen `ExitStack` und lässt den alten leer. Du brauchst es für „alles oder nichts“: Ein Konstruktor oder eine Fabrikfunktion öffnet mehrere Ressourcen. Scheitert ein Schritt, schließt der `with`-Block die bereits geöffneten. Klappt alles, ruft der Code als letzte Zeile im Block `pop_all()` auf und behält den neuen Stack. So bleiben die Ressourcen offen, und der Aufrufer schließt sie später mit `close()`. Alles, was nach `pop_all()` im Block scheitert, räumt niemand mehr auf.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/contextlib.html#contextlib.ExitStack.pop_all).
  tags: [context-manager, contextlib, ressourcen]
  level: 3
- id: asynccontextmanager-aufraeumen
  module: dekoratoren-funktional
  q: Wie schreibst du einen asynchronen Context Manager, und warum gehört das Aufräumen in ein finally?
  a: |
    Mit `@contextlib.asynccontextmanager` über einer `async def` mit genau einem `yield`. Vor `yield` steht das Öffnen, danach das Aufräumen, beides darf `await` nutzen. Das Aufräumen gehört in `finally`, weil eine Exception im `async with`-Block am `yield` ankommt. Das gilt auch für die `CancelledError`, mit der asyncio bei einem Timeout oder einer abgebrochenen `TaskGroup` einen Task beendet. Ohne `finally` bleibt dann die Verbindung offen. Mehrere solche Context Manager verwaltet `AsyncExitStack`.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/contextlib.html#contextlib.asynccontextmanager).
  tags: [async, context-manager, contextlib]
  level: 2
- id: paramspec-dekorator
  module: typisierung
  q: Wie typisierst du einen Dekorator so, dass die Signatur der dekorierten Funktion erhalten bleibt?
  a: |
    Mit `ParamSpec`. Seit Python 3.12 schreibst du `def deco[**P, R](func: Callable[P, R]) -> Callable[P, R]`. Der Wrapper bekommt `*args: P.args, **kwargs: P.kwargs` und gibt `R` zurück. `P` fängt die ganze Parameterliste ein, also Namen, Typen und Defaults. Mit `Callable[..., R]` kennt der Checker nur noch `(*Any, **Any)` und meldet falsche Aufrufe nicht. `Concatenate[Verbindung, P]` beschreibt Dekoratoren, die einen festen ersten Parameter einspeisen und aus der Signatur entfernen.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/typing.html#typing.ParamSpec).
  tags: [typisierung, dekoratoren, generics]
  level: 3
- id: override-dekorator
  module: typisierung
  q: Wozu brauchst du @override, wenn Vererbung auch ohne funktioniert?
  a: |
    Es schützt vor stiller Umbenennung. Benennt jemand in der Basisklasse eine Methode um, ist die gleichnamige Methode der Unterklasse für Python nur noch eine neue Methode, die niemand aufruft. Mit `@override` (`typing.override`, seit 3.12) meldet der Checker `Method "x" is marked as an override, but no base method was found with this name`. Zur Laufzeit setzt der Dekorator nur `__override__ = True`. Die Pflicht lässt sich mit mypys Fehlercode `explicit-override` oder pyrights `reportImplicitOverride` erzwingen.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/typing.html#typing.override).
  tags: [typisierung, vererbung]
  level: 2
- id: self-typ
  module: typisierung
  q: Warum ist Self besser als der Klassenname als Rückgabetyp einer fluent API?
  a: |
    `Self` steht für den Typ, auf dem die Methode aufgerufen wird. Gibt `Abfrage.wo()` den Typ `Abfrage` zurück, kennt der Checker nach `AdminAbfrage().wo(...)` die Methoden der Unterklasse nicht mehr (`"Abfrage" has no attribute ...`). Mit `-> Self` bleibt es `AdminAbfrage`. Dasselbe gilt für Klassenmethoden, die `cls(...)` zurückgeben. `Self` gibt es seit Python 3.11 in `typing`.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/typing.html#typing.Self).
  tags: [typisierung, klassen]
  level: 2
- id: overload-wann
  module: typisierung
  q: Wann setzt du @overload ein, und worauf musst du achten?
  a: |
    Wenn der Rückgabetyp vom Argument abhängt, etwa `lies(pfad, als_text=True)` liefert `str`, sonst `bytes`. Jede Variante bekommt `@overload` und den Rumpf `...`, danach folgt eine Implementierung ohne Dekorator, die alle Varianten abdeckt. Zur Laufzeit gilt nur diese. mypy nimmt die erste passende Variante von oben nach unten: Eine zu breite Variante zuerst macht die folgenden unerreichbar (`overload-cannot-match`). Für Aufrufer mit einem `bool` aus einer Variablen braucht es oft eine zusätzliche Variante. Bei neuem Code sind zwei getrennte Funktionen häufig klarer.

    [Vertiefen in der Dokumentation](https://typing.python.org/en/latest/spec/overload.html#overloads).
  tags: [typisierung, overload]
  level: 3
- id: cancel-ablauf-asyncio
  module: nebenlaeufigkeit
  q: Was passiert genau bei `task.cancel()`, und was gehört in den Worker-Code?
  a: |
    `cancel()` ist eine Anfrage. Beim nächsten Durchlauf der Event-Loop wirft asyncio eine `CancelledError` an die Stelle, an der der Task gerade wartet. Der Task räumt in `finally` auf und löst sie danach erneut aus (`raise`), erst dann gilt er als abgebrochen. `CancelledError` erbt von `BaseException`: Ein `except Exception` lässt sie durch, `except BaseException` oder `except (Exception, asyncio.CancelledError)` verschluckt sie. Ein Task, der das tut, bleibt am Leben, ein `asyncio.timeout` löst keinen `TimeoutError` mehr aus, und der Shutdown hängt.


    [Task.cancel in der Dokumentation](https://docs.python.org/3/library/asyncio-task.html#asyncio.Task.cancel).
  tags: [nebenlaeufigkeit, asyncio]
  level: 2
- id: taskgroup-fehlerverhalten
  module: nebenlaeufigkeit
  q: Was passiert, wenn ein Task in einer `TaskGroup` mit einer Exception scheitert?
  a: |
    Die Gruppe bricht die übrigen Tasks ab und bricht auch den Rumpf des `async with`-Blocks ab, falls er noch läuft. Wenn alle beendet sind, löst sie die gesammelten Fehler als `ExceptionGroup` aus. Du fängst sie mit `except*`; ein einfaches `except ValueError` passt nicht auf eine Gruppe. `CancelledError` zählt dabei nicht als Fehler. `gather` verhält sich anders: Ohne `return_exceptions=True` wirft es die erste Exception, die übrigen Aufgaben laufen weiter.


    [Task Groups in der Dokumentation](https://docs.python.org/3/library/asyncio-task.html#task-groups).
  tags: [nebenlaeufigkeit, asyncio, fehlerbehandlung]
  level: 2
- id: queue-producer-bremsen
  module: nebenlaeufigkeit
  q: Wie bremst du einen Producer, der schneller ist als seine Consumer?
  a: |
    Mit einer begrenzten `asyncio.Queue(maxsize=n)`. Ist sie voll, wartet `await queue.put(...)`, bis ein Consumer Platz schafft. Das ist Backpressure: Die langsamste Stufe bestimmt das Tempo, der Speicherbedarf bleibt begrenzt. Ohne `maxsize` kehrt `put` sofort zurück, und der Producer füllt den Speicher, bevor ein Consumer läuft. Jeder `get()` braucht ein `task_done()`, am besten in `finally`, sonst wartet `queue.join()` ewig. Seit Python 3.13 beendet `queue.shutdown()` die Consumer ohne Sentinel oder `cancel()`.


    [asyncio.Queue in der Dokumentation](https://docs.python.org/3/library/asyncio-queue.html).
  tags: [nebenlaeufigkeit, asyncio]
  level: 2
- id: asyncio-lock-noetig
  module: nebenlaeufigkeit
  q: asyncio läuft in einem Thread. Wann brauchst du trotzdem einen `asyncio.Lock`?
  a: |
    Wenn zwischen Prüfen und Ändern eines gemeinsamen Zustands ein `await` liegt. Die Loop wechselt nur an einem `await`; dort laufen andere Coroutinen und sehen den alten Zustand. Beispiel: Saldo prüfen, Betrugsprüfung abwarten, abbuchen. Zwei gleichzeitige Aufrufe buchen beide ab. Mit `async with lock:` um den ganzen Abschnitt wartet der zweite Aufruf. Ohne `await` im Abschnitt braucht es keinen Lock. Er schützt zudem nicht vor OS-Threads, asyncio-Primitive sind nicht threadsicher.


    [Synchronisation in der Dokumentation](https://docs.python.org/3/library/asyncio-sync.html).
  tags: [nebenlaeufigkeit, asyncio]
  level: 2
- id: as-completed-vs-gather
  module: nebenlaeufigkeit
  q: Wann nimmst du `asyncio.as_completed` statt `gather`?
  a: |
    `gather` wartet auf alle Ergebnisse und liefert sie in Argumentreihenfolge. `as_completed` liefert jedes Ergebnis, sobald es fertig ist: für „der Schnellste gewinnt“, für Fortschrittsanzeigen und zum Streamen. Seit Python 3.13 kannst du mit `async for` die Task-Objekte selbst erhalten und so zuordnen, welcher fertig ist. Beachte: `as_completed` bricht die übrigen Tasks nicht ab, wenn du die Schleife verlässt oder das Timeout abläuft. Das `cancel()` bleibt deine Aufgabe.


    [as_completed in der Dokumentation](https://docs.python.org/3/library/asyncio-task.html#asyncio.as_completed).
  tags: [nebenlaeufigkeit, asyncio]
  level: 2
- id: async-generator-aclose
  module: nebenlaeufigkeit
  q: Warum schließt du async Generatoren bei frühem Ausstieg mit `aclosing`?
  a: |
    Ein async Generator (`async def` mit `yield`) steht nach einem `break` nur still. Sein `finally` und damit die Freigabe von Verbindungen oder Dateien läuft erst bei `aclose()`. Ohne Aufruf übernimmt irgendwann der Garbage Collector über die Event-Loop, zu einem Zeitpunkt, den du nicht kennst. `async with contextlib.aclosing(gen) as g:` ruft `aclose()` zuverlässig auf. Nebenbei: `await` in einer Comprehension läuft nacheinander, nicht nebenläufig, dafür gibt es `gather`.


    [aclosing in der Dokumentation](https://docs.python.org/3/library/contextlib.html#contextlib.aclosing).
  tags: [nebenlaeufigkeit, asyncio, generatoren]
  level: 3
- id: perf-tottime-cumtime
  module: performance
  q: Was ist der Unterschied zwischen `tottime` und `cumtime` in einer cProfile-Ausgabe, und welche Spalte liest du zuerst?
  a: |
    `tottime` ist die Zeit in der Funktion selbst, ohne Unteraufrufe. `cumtime` enthält alle Unteraufrufe. Funktionen wie `main` haben immer eine große `cumtime`, auch wenn sie selbst nichts rechnen. Deshalb sortiere ich zuerst nach `tottime`: Dort wird Rechenzeit verbraucht. Danach lese ich mit `cumtime` und `print_callers` nach, über welchen Pfad die teure Funktion erreicht wird. Ein `ncalls` mit Schrägstrich (`15/1`) zeigt Rekursion: Aufrufe insgesamt und davon primitive.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/profile.html#instant-user-s-manual).
  tags: [performance, profiling]
  level: 2
- id: perf-timeit-minimum
  module: performance
  q: Warum nimmst du bei `timeit.repeat` das Minimum und nicht den Mittelwert?
  a: |
    Der kleinste Wert ist die untere Schranke dafür, wie schnell der Rechner den Code ausführen kann. Höhere Werte entstehen meist durch andere Prozesse, nicht durch Python. Ein Mittelwert rechnet dieses Rauschen in das Ergebnis ein. Dazu gehört: `repeat` liefert die Zeit für `number` Aufrufe, ich teile also durch `number`. `setup` hält den Aufbau aus der Messung heraus, und der gemessene Ausdruck darf seine Eingaben nicht verändern (kein `daten.sort()` in Schleife).

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/timeit.html#timeit.Timer.repeat).
  tags: [performance, timeit]
  level: 2
- id: perf-getsizeof-flach
  module: performance
  q: Warum sagt `sys.getsizeof` bei einer verschachtelten Datenstruktur nicht, wie viel Speicher sie belegt?
  a: |
    `getsizeof` liefert nur die flache Größe des Objekts selbst. Eine Liste enthält Zeiger auf ihre Elemente, und diese Elemente zählt die Funktion nicht mit. Eine Liste mit drei riesigen Listen ist flach so groß wie eine mit drei leeren. Für den Gesamtverbrauch nutze ich `tracemalloc` mit zwei Snapshots und `compare_to`. Das zeigt zusätzlich, in welcher Zeile der Speicher entstand und was seit dem ersten Snapshot hinzukam.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/sys.html#sys.getsizeof).
  tags: [performance, speicher]
  level: 2
- id: perf-string-concat
  module: performance
  q: Ist `s += teil` in einer Schleife in Python immer quadratisch, und was nimmst du stattdessen?
  a: |
    Strings sind unveränderlich, `s += teil` kopiert in der Theorie den ganzen String und wäre quadratisch. CPython optimiert das für lokale Variablen oft an Ort und Stelle, die Doku nennt die Optimierung aber version- und implementierungsabhängig. Auf einem Attribut (`self.text += ...`) greift sie nicht, dort sind 50 000 Anfügungen über hundertmal langsamer als bei `join`. Ich sammle die Teile in einer Liste und rufe `"".join(teile)` auf. Das ist in jeder Implementierung linear.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/stdtypes.html#common-sequence-operations).
  tags: [performance, strings]
  level: 2
- id: perf-vektorisierung-wann
  module: performance
  q: Wann beschleunigt NumPy eine Python-Schleife, und wann nicht?
  a: |
    NumPy führt die Schleife in C über einen zusammenhängenden Speicherblock aus und spart den Python-Aufwand pro Element. Das lohnt bei vielen Zahlen mit derselben Operation (bei 100 000 Punkten etwa Faktor 20). Es hilft nicht bei kleinen Daten, bei Schritten, die vom Vorgänger abhängen, bei Objekten oder Strings (`dtype=object`) und wenn das Umwandeln der Liste in ein Array den Gewinn aufbraucht. NumPy rechnet außerdem mit festen Breiten: `int64` läuft ohne Warnung über. In pandas ist `apply(axis=1)` eine Python-Schleife.

    [Vertiefen in der Dokumentation](https://pandas.pydata.org/docs/user_guide/enhancingperf.html).
  tags: [performance, numpy, pandas]
  level: 3
- id: perf-amdahl
  module: performance
  q: Eine Funktion macht 25 % der Laufzeit. Du machst sie 10-mal schneller. Wie viel schneller ist das Programm?
  a: |
    Nach Amdahl ist der Gewinn `1 / ((1 - p) + p / s)`. Mit `p = 0,25` und `s = 10` ist das etwa 1,29. Selbst eine unendlich schnelle Funktion brächte nur `1 / 0,75 ≈ 1,33`. Ich rechne das vor jedem Umbau, etwa nach Rust oder Cython, und suche zuerst die 75 %, die übrig bleiben.

    [Vertiefen in der Dokumentation](https://docs.python.org/3/library/profile.html).
  tags: [performance, amdahl]
  level: 3
- id: conftest-sichtbarkeit
  module: testen-pytest
  q: Wo legst du Fixtures ab, die mehrere Testdateien brauchen, und wer sieht sie?
  a: |
    In einer `conftest.py` im gemeinsamen Verzeichnis. pytest lädt sie selbst, und ihre Fixtures gelten für jeden Test in diesem Verzeichnis und allen darunter. Eine Fixture mit gleichem Namen in einer tieferen `conftest.py` überschreibt die obere, ein Nachbarverzeichnis sieht sie nicht und meldet `fixture '…' not found`. Importiert wird nichts: Der Test fordert die Fixture über den Parameternamen an. Hooks wie `pytest_addoption` können ebenfalls in der Datei stehen, sie gehören aber zur Plugin-Entwicklung und nicht zu den Alltagstests.


    [conftest.py in der Dokumentation](https://docs.pytest.org/en/stable/reference/fixtures.html#conftest-py-sharing-fixtures-across-multiple-files).
  tags: [tests, pytest]
  level: 2
- id: xfail-strict
  module: testen-pytest
  q: Was ist der Unterschied zwischen `skip` und `xfail`, und wozu dient `strict=True`?
  a: |
    `skip` führt den Test nie aus, `skipif` nur unter einer Bedingung wie Betriebssystem oder Python-Version. `xfail` führt ihn aus und wertet ein Scheitern als erwartet, typischerweise für einen bekannten Bug mit Ticket in `reason`. Ohne `strict` meldet pytest einen unerwartet bestandenen Test nur als `XPASS`, der Lauf bleibt grün, und der Marker bleibt für immer stehen. Mit `strict=True` wird derselbe Fall zum Fehler: Der behobene Bug zwingt dazu, den Marker zu entfernen. `xfail` ist keine Quarantäne für instabile Tests.


    [Skip and xfail in der Dokumentation](https://docs.pytest.org/en/stable/how-to/skipping.html#strict-parameter).
  tags: [tests, pytest]
  level: 2
- id: logs-und-ausgabe-testen
  module: testen-pytest
  q: Wie testest du, dass eine Funktion eine Warnung loggt oder etwas ausgibt?
  a: |
    Für Logs nutze ich `caplog`: `with caplog.at_level(logging.INFO):` um den Aufruf, danach prüfe ich `caplog.records` auf Anzahl, `levelno` und den Anfang von `getMessage()`. Ohne gesetzten Level fehlen Einträge unterhalb von `WARNING`. Gegen das ganze Format von `caplog.text` teste ich nicht, denn darin stehen Datei und Zeilennummer. Für `print` und Berichte nutze ich `capsys.readouterr()` und prüfe `out` und `err` getrennt. Logeinträge gehören nur dann zum Vertrag, wenn jemand sich auf sie verlässt, etwa ein Alarm.


    [caplog in der Dokumentation](https://docs.pytest.org/en/stable/how-to/logging.html#caplog-fixture).
  tags: [tests, pytest, logging]
  level: 1
- id: coverage-grenzen
  module: testen-pytest
  q: Reichen 100 % Coverage, um einem Test zu vertrauen?
  a: |
    Nein. Coverage zeigt, welche Zeilen und Zweige ein Lauf ausgeführt hat, nicht ob ein Test das Ergebnis prüft. Ein Test ohne Assertion kann 100 % erreichen und trotzdem jeden Rechenfehler übersehen. Ich messe mit `--cov-branch`, damit beide Wege eines `if` zählen, und nutze `--cov-fail-under` als Untergrenze, damit neuer Code nicht ganz ohne Test hereinkommt. Als Ziel taugt die Zahl nicht. Die Qualität der Assertions prüfe ich im Review, mit einem absichtlich eingebauten Fehler oder mit Mutation Testing.


    [Branch coverage in der Dokumentation](https://coverage.readthedocs.io/en/latest/branch.html).
  tags: [tests, coverage]
  level: 2
- id: property-statt-beispiel
  module: testen-pytest
  q: Wann schreibst du mit Hypothesis eine Eigenschaft statt eines Beispieltests?
  a: |
    Wenn eine Regel für viele Eingaben gilt und ich die Ergebnisse nicht einzeln ausrechnen will. Typisch sind Roundtrips (`decode(encode(x)) == x`), Invarianten wie „Ergebnis ist sortiert“ und Idempotenz. Hypothesis erzeugt die Eingaben, findet Randfälle wie die leere Liste oder Sonderzeichen und verkleinert ein Gegenbeispiel (Shrinking) auf den kleinsten Fall. Beispieltests bleiben für dokumentierte Fälle stehen. Ein Roundtrip findet keinen Fehler, den Hin und Zurück gemeinsam ausgleichen. `assume` verwirft nur wenige Beispiele, sonst gehört die Bedingung in die Strategie.


    [Hypothesis · Einführung](https://hypothesis.readthedocs.io/en/latest/tutorial/introduction.html).
  tags: [tests, hypothesis]
  level: 2
- id: dependency-groups-vs-extras
  module: tooling-packaging
  q: Was ist der Unterschied zwischen `[dependency-groups]` und `[project.optional-dependencies]`?
  a: |
    Extras sind Teil der Projektmetadaten und stehen im Wheel (`Provides-Extra`). Nutzer schalten sie mit `pip install "paket[extra]"` zu, zum Beispiel `rich` für eine optionale CLI. Dependency Groups (PEP 735) stehen in einer eigenen Tabelle, landen nicht im Wheel und gehören den Entwicklern: `pytest`, `ruff`, Dokumentation. Mit uv installiert `uv sync` die Gruppe `dev` standardmäßig, weitere Gruppen kommen mit `--group`, Extras mit `--extra`. Faustregel: Soll ein Nutzer etwas zuschalten können, ist es ein Extra, sonst eine Gruppe.


    [Dependency groups in uv](https://docs.astral.sh/uv/concepts/projects/dependencies/#dependency-groups).
  tags: [tooling, packaging]
  level: 2
- id: pinning-app-vs-bibliothek
  module: tooling-packaging
  q: Pinnst du Abhängigkeiten, und wie genau?
  a: |
    Das hängt davon ab, wer das Projekt installiert. Eine Anwendung committet ein Lockfile mit exakten Versionen und schreibt in `pyproject.toml` nur Untergrenzen. Die CI installiert mit `--locked`. Eine Bibliothek gibt Bereiche an, mit Untergrenze und ohne Obergrenze, solange ich keine Inkompatibilität kenne. Ein `==` in einer Bibliothek macht Projekte unlösbar, die dasselbe Paket in einer anderen Version brauchen: Der Resolver meldet `No solution found`, und der Nutzer kann nichts ändern. Eine Obergrenze begründe ich in einem Kommentar.


    [install_requires vs requirements files](https://packaging.python.org/en/latest/discussions/install-requires-vs-requirements/).
  tags: [tooling, packaging]
  level: 2
- id: upgrade-workflow
  module: tooling-packaging
  q: Wie aktualisierst du Abhängigkeiten, ohne dass der Build plötzlich bricht?
  a: |
    Bewusst und in eigenen PRs. Ich schaue mit `uv tree --outdated` nach Veraltetem und hebe gezielt an (`uv lock --upgrade-package httpx`), nicht alles auf einmal. Im Diff von `uv.lock` prüfe ich neue und entfernte Pakete sowie Sprünge der Hauptversion, dann laufen die Tests. Die CI nutzt `uv sync --locked`, damit niemand das Lockfile still verändert. `--frozen` überspringt diese Prüfung und passt nur, wenn ein früherer Schritt sie schon gemacht hat.


    [Upgrading locked package versions](https://docs.astral.sh/uv/concepts/projects/sync/#upgrading-locked-package-versions).
  tags: [tooling, ci]
  level: 2
- id: schwachstellen-in-abhaengigkeiten
  module: tooling-packaging
  q: Wie findest du bekannte Schwachstellen in deinen Abhängigkeiten, und was kann das nicht?
  a: |
    Mit `uv audit` (in uv 0.12 noch eine Vorschau) oder `pip-audit`: Ich exportiere das Lockfile mit `uv export --no-emit-project -o requirements.txt` und prüfe es mit `uvx pip-audit -r requirements.txt`. Beide gleichen Versionen mit veröffentlichten Meldungen ab, und die Spalte der Korrekturversion sagt, wohin ich anheben muss. Sie finden keine unbekannten Lücken und sagen nicht, ob mein Code die betroffene Funktion aufruft. Der Audit läuft deshalb auch nach Zeitplan, nicht nur im PR, und ein Ausblenden einer Meldung braucht Ticket und Frist.


    [pip-audit auf PyPI](https://pypi.org/project/pip-audit/).
  tags: [tooling, sicherheit]
  level: 2
- id: wheel-vs-sdist
  module: tooling-packaging
  q: Was ist der Unterschied zwischen Wheel und sdist, und was prüfst du vor einem Upload?
  a: |
    Ein Wheel enthält genau die Dateien, die bei der Installation kopiert werden, und lässt sich ohne Build installieren. Eine sdist ist ein Archiv des Quellcodes mit `pyproject.toml`; Installer müssen daraus erst ein Wheel bauen. `uv build` erzeugt beide, das Wheel aus der sdist. Vor einem Upload liste ich beide Archive (`unzip -l`, `tar tzf`): Fehlen Module oder Datendateien im Wheel, steht der Entry Point in `entry_points.txt`, und liegt etwas in der sdist, das nicht hineingehört, etwa eine `.env`? Danach installiere ich das Wheel in einer frischen Umgebung.


    [Source distributions vs. wheels](https://packaging.python.org/en/latest/discussions/package-formats/).
  tags: [tooling, packaging]
  level: 2
- id: web-ein-ausgabemodell
  module: web-datenbanken
  q: Warum trennst du bei einer API Eingabe-, Datenbank- und Ausgabemodell?
  a: |
    Jede Richtung hat einen eigenen Vertrag. Der Client darf beim Anlegen `title` senden, aber weder `id` noch `status`. Die Antwort enthält `id`, `title` und `status`, aber keine interne Notiz und keinen Passwort-Hash. Die Datenbankklasse kennt alle Spalten.

    In FastAPI filtert `response_model` die Antwort durch das Ausgabemodell. Wer ein Modell mit `password_hash` als `response_model` einsetzt oder eine ORM-Zeile ungefiltert zurückgibt, gibt jede neue Spalte automatisch heraus. Ein Test, der prüft, dass `password_hash` nicht in der Antwort steht, hält die Regel fest.

    [Vertiefen in der Dokumentation](https://fastapi.tiangolo.com/tutorial/response-model/).
  tags: [fastapi, pydantic, api-design]
  level: 2
- id: web-orm-grenzen
  module: web-datenbanken
  q: Was nimmt dir ein ORM wie SQLAlchemy ab, und was bleibt bei dir?
  a: |
    Er bindet Werte als Parameter, bildet Zeilen auf Objekte ab, kennt den SQL-Dialekt und legt Tabellen aus den Modellen an. Bei dir bleiben die Transaktionsgrenze (wann `commit()`), Constraints und Fremdschlüssel, die Reihenfolge (`order_by`), die Zahl der Abfragen und Schemaänderungen per Migration.

    Beispiel: `session.scalars(select(Ticket))` ist parametrisiert und sicher. Greifst du danach in einer Schleife auf `ticket.events` zu, entstehen pro Ticket eine Abfrage, das N+1-Problem. `text()` mit f-String ist wieder SQL-Injection.

    [Vertiefen in der Dokumentation](https://docs.sqlalchemy.org/en/20/orm/quickstart.html).
  tags: [sqlalchemy, orm, sql]
  level: 2
- id: web-flush-commit
  module: web-datenbanken
  q: Was ist der Unterschied zwischen `flush()` und `commit()` in einer SQLAlchemy-Session?
  a: |
    `flush()` schickt das gesammelte SQL in die offene Transaktion. Danach hat ein neues Objekt seine `id`, aber nichts ist bestätigt. `commit()` bestätigt die Transaktion. Schließt die Session ohne `commit()`, rollt sie zurück.

    Typischer Fehler: Ein Endpunkt ruft nur `flush()`, antwortet `201` mit der neuen `id`, und der nächste `GET` findet die Zeile nicht. Ein API-Test, der nur den Statuscode prüft, merkt das nicht. Er muss die Zeile mit einer zweiten Session lesen.

    [Vertiefen in der Dokumentation](https://docs.sqlalchemy.org/en/20/orm/session_basics.html).
  tags: [sqlalchemy, transaktionen]
  level: 2
- id: web-async-blockierend
  module: web-datenbanken
  q: Warum ist ein Endpunkt mit `async def` und synchroner Datenbank-Session ein Problem?
  a: |
    FastAPI führt `async def`-Endpunkte direkt in der Event-Loop aus. Ein synchroner Aufruf darin, etwa `session.execute(...)`, `httpx.get(...)` oder `time.sleep(...)`, hält die Loop an, und der Server beantwortet währenddessen keine andere Anfrage.

    Mit einer synchronen Session schreibst du `def`: Dann läuft der Endpunkt in einem Thread-Pool. Für `async def` brauchst du `AsyncSession` und einen asynchronen Treiber, oder du verlagerst den blockierenden Teil mit `asyncio.to_thread`.

    [Vertiefen in der Dokumentation](https://fastapi.tiangolo.com/async/).
  tags: [fastapi, asyncio, nebenläufigkeit]
  level: 3
- id: web-depends-test
  module: web-datenbanken
  q: Wie testest du einen FastAPI-Endpunkt mit Datenbank, ohne Server und ohne echte Datenbank?
  a: |
    Mit dem `TestClient` ruft der Test die App im selben Prozess auf. Die Datenbank-Session kommt über `Depends` in den Endpunkt. Im Test ersetzt `app.dependency_overrides[get_session]` sie durch eine Session auf einer Test-Datenbank, etwa einer Datei unter `tmp_path` oder SQLite im Speicher.

    Bei SQLite im Speicher brauchst du `StaticPool` und `check_same_thread=False`. Sonst sieht jeder Thread eine eigene, leere Datenbank, und der erste Aufruf scheitert mit „no such table“. Prüfe auch den Datenbestand nach dem Aufruf, nicht nur den Statuscode.

    [Vertiefen in der Dokumentation](https://fastapi.tiangolo.com/advanced/testing-dependencies/).
  tags: [fastapi, testen, sqlalchemy]
  level: 2
- id: web-lax-strict
  module: web-datenbanken
  q: Was bedeutet lax und strict bei der Validierung mit Pydantic?
  a: |
    Standardmäßig validiert Pydantic im lax-Modus: Es wandelt um, was eindeutig geht. `"5"` wird zu `5`, und unbekannte Felder werden ignoriert. Im strict-Modus (`strict=True`) lehnt es solche Umwandlungen ab.

    Lax passt zu Query- und Formulareingaben, wo alles als Text ankommt. Bei IDs und Geldbeträgen willst du oft strikter sein. Mit `extra="forbid"` lehnst du außerdem unbekannte Felder ab. Welcher Modus gilt, gehört in den Vertrag der API.

    [Vertiefen in der Dokumentation](https://docs.pydantic.dev/latest/concepts/strict_mode/).
  tags: [pydantic, validierung]
  level: 2
