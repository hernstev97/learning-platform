terms:
- term: Binding
  definition: Verknüpfung eines Namens mit einem Objekt; eine erneute Zuweisung ändert die Bindung.
- term: Aliasing
  definition: Mehrere Referenzen zeigen auf dasselbe Objekt. Mutationen sind über jede dieser Referenzen
    sichtbar.
- term: Mutability
  definition: Eigenschaft eines Objekts, seinen Zustand ändern zu können. Sie ist vom erneuten Binden
    eines Namens zu unterscheiden.
- term: Identity
  definition: Identität eines konkreten Objekts, verglichen mit `is`.
- term: Equality
  definition: Wertgleichheit gemäß dem Typ, verglichen mit `==`.
- term: Hashability
  definition: Ein stabiler Hashwert und dazu passender Gleichheitsvergleich ermöglichen Verwendung als
    Set-Element oder Dictionary-Schlüssel.
- term: Shallow Copy
  definition: Kopie des äußeren Containers, die seine enthaltenen Objektreferenzen weiterverwendet.
- term: Deep Copy
  definition: Rekursive Kopie geeigneter enthaltener Objekte; nicht jede Ressource lässt sich sinnvoll
    kopieren.
- term: List
  definition: Veränderliche geordnete Folge von Objektreferenzen.
- term: Tuple
  definition: Unveränderliche geordnete Folge; enthaltene Objekte können ihrerseits veränderlich sein.
- term: Set
  definition: Collection eindeutiger hashbarer Werte ohne zugesicherte fachliche Reihenfolge.
- term: Dictionary
  definition: Abbildung hashbarer Schlüssel auf Werte mit erhaltener Einfügereihenfolge.
- term: Comprehension
  definition: Kompakte Syntax zum Erzeugen einer Collection aus Iteration, optionaler Filterung und Transformation.
- term: Slice
  definition: Auswahl mit Start, exklusivem Ende und Schrittweite, etwa `items[1:4]`.
- term: Iterable
  definition: Objekt, aus dem `iter()` einen Iterator beziehen kann.
- term: Iterator
  definition: Objekt mit Positionszustand, das über `next()` Werte liefert und mit `StopIteration` endet.
- term: Generator
  definition: Iterator, dessen Zustand durch eine Funktion mit `yield` oder einen Generatorausdruck erzeugt
    wird.
- term: Lazy Evaluation
  definition: Berechnung erst bei Bedarf statt vollständiger Vorberechnung aller Ergebnisse.
- term: Closure
  definition: Funktion, die Bindungen aus einem umgebenden Gültigkeitsbereich verwendet.
- term: Decorator
  definition: Aufrufbares Objekt, das beim Definieren eine Funktion oder Klasse erhält und ihren Ersatz
    zurückgibt.
- term: Context Manager
  definition: Protokoll zur kontrollierten Verwaltung eines Bereichs über `with`, beispielsweise für Ressourcenfreigabe.
- term: Dataclass
  definition: Klasse, bei der `@dataclass` Standardmethoden aus den Felddefinitionen erzeugt.
- term: Default Factory
  definition: Funktion, die pro Instanz einen neuen Felddefault erzeugt, etwa `field(default_factory=list)`.
- term: Dunder Method
  definition: Spezialmethode mit doppelten Unterstrichen, die ein Python-Protokoll implementiert, etwa
    `__iter__`.
- term: Composition
  definition: Zusammensetzen eines Objekts aus verwendeten Komponenten statt einer Vererbungshierarchie.
- term: Exception
  definition: Objekt zur Signalisierung eines außergewöhnlichen Kontrollflusses oder Fehlers.
- term: Traceback
  definition: Darstellung der Aufrufkette, in der eine Exception entstand und weitergegeben wurde.
- term: EAFP
  definition: Vorgehen, eine Operation zu versuchen und konkrete erwartete Fehler zu behandeln.
- term: Module
  definition: Einheit importierbaren Python-Codes mit eigenem Namensraum.
- term: Package
  definition: Struktur zur Organisation von Modulen unter einem gemeinsamen Importpfad.
- term: Type Hint
  definition: Annotation eines erwarteten Typs; sie wird ohne zusätzliche Werkzeuge nicht automatisch
    erzwungen.
- term: Protocol
  definition: 'Strukturelle Typbeschreibung: Entscheidend sind bereitgestellte Operationen statt expliziter
    Vererbung.'
- term: Generic
  definition: Parametrisierung eines Typs oder einer Funktion über andere Typen.
- term: Any
  definition: Typ, der viele statische Prüfungen an seiner Verwendung aussetzt; kein Ersatz für validierte
    Eingabedaten.
- term: Coroutine
  definition: Pausierbare Berechnung, die typischerweise mit `async def` definiert und über `await` ausgeführt
    wird.
- term: Task
  definition: Von der Event-Loop eingeplante Coroutine mit eigener Ausführung und Ergebniszustand.
- term: Event Loop
  definition: Koordinator, der bereite Tasks und I/O-Ereignisse verarbeitet.
- term: GIL
  definition: Sperre üblicher CPython-Builds, die parallele Python-Bytecode-Ausführung mehrerer Threads
    im selben Interpreter begrenzt.
- term: Race Condition
  definition: Ergebnis hängt von unkontrollierter zeitlicher Verschachtelung mehrerer Abläufe ab.
- term: Fixture
  definition: Explizit bereitgestellte Testumgebung oder Ressource mit bestimmter Lebensdauer.
- term: Mock
  definition: Testersatz, mit dem etwa Aufrufe beobachtet oder Ergebnisse vorgegeben werden können.
- term: Fake
  definition: Vereinfachte funktionsfähige Implementierung einer Abhängigkeit, etwa ein Repository im
    Speicher.
- term: Parametrisierung
  definition: Ausführen desselben Testvertrags für mehrere benannte Eingabefälle.
- term: Virtual Environment
  definition: Projektbezogene Python-Umgebung mit separaten installierten Paketen; keine Sicherheits-Sandbox.
- term: Lockfile
  definition: Datei mit einer konkreten Abhängigkeitsauflösung für wiederholbare Installationen.
- term: Wheel
  definition: Installierbares Distributionsformat für Python-Pakete.
- term: Transaction
  definition: Zusammengehörige Datenbankänderungen, die kontrolliert bestätigt oder zurückgenommen werden.
- term: SQL Injection
  definition: Unbeabsichtigte Interpretation von Eingabedaten als SQL-Struktur; Parameter trennen Werte
    vom Ausdruck.
- term: Pagination
  definition: Aufteilen einer Ergebnismenge in begrenzte, nacheinander abrufbare Seiten.
- term: Big O
  definition: Asymptotische obere Wachstumsabschätzung von Zeit- oder Speicheraufwand als Funktion der
    Eingabegröße.
- term: NamedTuple
  definition: Tupel mit Feldnamen und Typangaben (`typing.NamedTuple`). Unveränderlich, entpackbar und gleich jedem Tupel mit denselben Werten. Die ältere Form ohne Typen ist `collections.namedtuple`.
- term: TypedDict
  definition: Typbeschreibung für ein `dict` mit festen Schlüsseln. Nur der Type Checker prüft sie. Zur Laufzeit ist ein `TypedDict` ein gewöhnliches `dict`.
- term: Pydantic
  definition: Drittpaket, das Daten gegen Typannotationen validiert und umwandelt (`model_validate`). Fehler melden sich als `ValidationError` mit Feldnamen.
- term: asdict
  definition: Funktion aus `dataclasses`, die eine Dataclass rekursiv in ein Dictionary umwandelt und alle anderen Werte tief kopiert. `replace` kopiert dagegen flach.
- term: Validierung an der Grenze
  definition: Daten von außen (HTTP, Dateien, Umgebung) werden einmal beim Eintritt geprüft und umgewandelt. Danach arbeitet der Code mit schlichten, vertrauenswürdigen Typen.
- term: Frozen Dataclass
  definition: Dataclass mit `frozen=True`. Zuweisungen werfen `FrozenInstanceError`, und zusammen mit `eq=True` entsteht ein `__hash__`. Änderungen laufen über `replace`.
- term: dictConfig
  definition: Funktion `logging.config.dictConfig`, die Formatter, Handler und Logger aus einem Dictionary aufbaut. Läuft einmal beim Programmstart und nur in der Anwendung.
- term: NullHandler
  definition: Handler, der nichts tut. Bibliotheken hängen ihn an den obersten Logger ihres Pakets, damit sie nichts ausgeben, solange die Anwendung kein Logging konfiguriert.
- term: Handler of last resort
  definition: Das Objekt `logging.lastResort`. Es schreibt Meldungen ab `WARNING` ohne Format nach stderr, wenn auf dem Weg zur Wurzel kein Handler gefunden wird.
- term: Propagation
  definition: Weitergabe einer Log-Meldung an die Handler der übergeordneten Logger (`propagate=True`). Deren Logger-Level und Filter werden dabei nicht geprüft, nur ihre Handler-Level.
- term: Effektives Level
  definition: Das Level, mit dem ein Logger Meldungen filtert. Ist keins gesetzt, erbt er das des nächsten Vorfahren, am Ende das des Root-Loggers (`WARNING`).
- term: LogRecord
  definition: Objekt, das `logging` pro Meldung erzeugt. Seine Attribute (`name`, `levelname`, `message`, …) nutzt der Formatter. Felder aus `extra` kommen als zusätzliche Attribute dazu.
- term: LoggerAdapter
  definition: Hülle um einen Logger, die jedem Aufruf festen Kontext als `extra` mitgibt, etwa eine Auftrags-ID.
- term: ExitStack
  definition: Context Manager aus `contextlib`, der eine zur Laufzeit bekannte Zahl weiterer Context Manager und Callbacks sammelt und beim Verlassen in umgekehrter Reihenfolge beendet.
- term: pop_all
  definition: Methode von `ExitStack`, die alle Aufräumschritte in einen neuen Stack verschiebt. Damit geht der Besitz an Ressourcen an den Aufrufer, und der ursprüngliche Stack räumt nichts mehr auf.
- term: asynccontextmanager
  definition: Dekorator aus `contextlib`, der aus einem asynchronen Generator mit einem `yield` einen Context Manager für `async with` macht. Öffnen und Aufräumen dürfen `await` nutzen.
- term: ParamSpec
  definition: Typvariable für eine ganze Parameterliste. Mit `Callable[P, R]` und `P.args`/`P.kwargs` erhalten typisierte Dekoratoren die Signatur der dekorierten Funktion. Seit 3.12 geschrieben als `def deco[**P, R]`.
- term: Concatenate
  definition: Typ aus `typing`, der feste Parameter vor einen `ParamSpec` stellt. `Callable[Concatenate[Verbindung, P], R]` beschreibt eine Funktion mit `Verbindung` als erstem Parameter, den ein Dekorator einspeisen kann.
- term: Self
  definition: Typ aus `typing` (seit 3.11) für die Klasse, auf der eine Methode aufgerufen wird. Er hält bei fluent APIs und Klassenmethoden den Typ der Unterklasse fest.
- term: Overload
  definition: Mit `@typing.overload` beschriebene Variante einer Funktion für den Typechecker. Zur Laufzeit gilt nur die Implementierung ohne Dekorator.
- term: "@override"
  definition: Dekorator `typing.override` (seit 3.12). Er sagt dem Typechecker, dass die Methode eine Basisklassenmethode überschreiben muss, und deckt Umbenennungen in der Basisklasse auf.
- term: Cancellation
  definition: Abbruch eines Tasks. `task.cancel()` stellt eine Anfrage; asyncio wirft beim nächsten `await` eine `CancelledError` in die Coroutine, die sie nach dem Aufräumen weiterreichen muss.
- term: Backpressure
  definition: Rückstau, der einen schnellen Producer bremst. In asyncio wartet `queue.put()` bei einer vollen `Queue(maxsize=n)`, bis ein Consumer Platz schafft.
- term: Sentinel
  definition: Marker wie `None` in einer Queue, der Consumern das Ende der Daten meldet. Seit Python 3.13 ersetzt `Queue.shutdown()` ihn in vielen Fällen.
- term: Structured Concurrency
  definition: Nebenläufige Tasks leben und enden innerhalb eines Blocks. Die `TaskGroup` wartet auf alle Tasks und bricht bei einem Fehler die übrigen ab.
- term: ExceptionGroup
  definition: Exception, die mehrere Fehler bündelt, etwa wenn mehrere Tasks einer `TaskGroup` scheitern. Gefangen wird sie mit `except*`.
- term: Async Generator
  definition: Funktion mit `async def` und `yield`. Sie liefert Werte für `async for` und darf zwischen den Werten `await`en. Mit `aclose()` oder `contextlib.aclosing` wird sie geschlossen.
- term: Async Context Manager
  definition: Objekt mit `__aenter__` und `__aexit__` als Coroutinen für `async with`, etwa `Lock`, `Semaphore` oder `TaskGroup`.
- term: Semaphore
  definition: Zähler für freie Plätze. `asyncio.Semaphore(n)` lässt höchstens `n` Coroutinen gleichzeitig in einen `async with`-Block.
- term: Profiler
  definition: Werkzeug, das aufzeichnet, welche Funktionen wie oft laufen und wie viel Zeit sie brauchen. `cProfile` ist ein deterministischer Profiler und zählt jeden Aufruf. Sampling-Profiler wie `py-spy` greifen den Stack in Abständen ab.
- term: tottime
  definition: Spalte der `pstats`-Ausgabe. Zeit in der Funktion selbst, ohne die Zeit in ihren Unteraufrufen (`cumtime` enthält sie).
- term: Hot Path
  definition: Der kleine Teil des Codes, der den größten Teil der Laufzeit verbraucht. Nur dort lohnt sich Optimieren.
- term: Amdahl-Gesetz
  definition: Beschleunigt man einen Teil mit Laufzeitanteil `p` um den Faktor `s`, wächst die Gesamtgeschwindigkeit um `1 / ((1 - p) + p / s)`. Der Gewinn ist durch `1 / (1 - p)` begrenzt.
- term: Vektorisierung
  definition: Eine Operation auf ganzen Arrays statt in einer Python-Schleife über einzelne Elemente. Die Schleife läuft in C, etwa in NumPy oder pandas.
- term: tracemalloc
  definition: Standardmodul, das für jeden Speicherblock die Zeile merkt, in der er angefordert wurde. Zwei Snapshots lassen sich mit `compare_to` vergleichen, um wachsenden Speicher zu finden.
- term: Flache Größe
  definition: Speicher eines Objekts ohne die Objekte, auf die es verweist. `sys.getsizeof` liefert nur sie. Der Gesamtverbrauch einer verschachtelten Struktur ist größer.
- term: __slots__
  definition: Klassenattribut, das die erlaubten Instanzattribute festlegt. Instanzen haben dann kein `__dict__`, das spart Speicher, und neue Attribute sind nicht möglich.
- term: conftest.py
  definition: Datei, die pytest selbst lädt. Ihre Fixtures gelten für alle Tests im selben Verzeichnis und darunter, ohne Import. Eine tiefere `conftest.py` überschreibt Fixtures der oberen.
- term: xfail
  definition: pytest-Marker für einen erwarteten Fehler. Der Test läuft, und ein Scheitern gilt als erwartet. Mit `strict=True` wird ein unerwartetes Bestehen (`XPASS`) zum Fehler.
- term: Branch Coverage
  definition: Abdeckung, die Zweige statt nur Zeilen zählt. Ein `if` ist erst abgedeckt, wenn Bedingung wahr und falsch vorkamen. Aktivierung mit `--cov-branch` oder `branch = true`.
- term: Property-based Testing
  definition: Test einer Regel, die für alle Eingaben gelten soll. Eine Bibliothek wie Hypothesis erzeugt die Eingaben und verkleinert Gegenbeispiele auf den kleinsten Fall (Shrinking).
- term: Dependency Group
  definition: Benannte Gruppe von Abhängigkeiten in `[dependency-groups]` (PEP 735) für Entwickler, etwa `dev` oder `lint`. Sie steht nicht in den Metadaten des Wheels.
- term: Extra
  definition: Optionale Abhängigkeitsgruppe in `[project.optional-dependencies]`, die Nutzer mit `pip install "paket[extra]"` zuschalten. Das Wheel führt sie als `Provides-Extra`.
- term: sdist
  definition: Source Distribution, ein `.tar.gz` mit Quellcode, `pyproject.toml` und `PKG-INFO`. Installer bauen daraus erst ein Wheel. Was hineinkommt, bestimmt das Build-Backend.
- term: Kompatibles Release
  definition: Versionsoperator `~=`. `~=1.4.2` bedeutet `>=1.4.2, ==1.4.*`, `~=1.4` bedeutet `>=1.4, ==1.*`. Die vorletzte angegebene Stelle darf nicht steigen.
- term: Dependency Injection
  definition: Eine Funktion bekommt ihre Abhängigkeiten von außen, statt sie selbst zu erzeugen. FastAPI löst sie mit `Depends` auf, zum Beispiel eine Datenbank-Session. Im Test lassen sie sich über `app.dependency_overrides` ersetzen.
- term: Response Model
  definition: Pydantic-Modell, durch das FastAPI die Antwort eines Endpunkts filtert und serialisiert (`response_model`). Felder, die dort fehlen, verlassen die API nicht.
- term: ORM
  definition: Object-Relational Mapper. Er bildet Tabellenzeilen auf Objekte ab und erzeugt das SQL mit gebundenen Parametern. Transaktionen, Constraints und die Zahl der Abfragen bleiben Sache des Entwicklers.
- term: Session (SQLAlchemy)
  definition: Arbeitseinheit des ORM. Sie merkt Änderungen an Objekten vor und sendet sie in einer Transaktion an die Datenbank. Ohne `commit()` verwirft sie die Änderungen beim Schließen.
- term: Flush
  definition: Die SQLAlchemy-Session schickt vorgemerkte Änderungen als SQL in die offene Transaktion, ohne sie zu bestätigen. Danach sind etwa vergebene IDs gesetzt. Erst `commit()` bestätigt.
- term: N+1-Problem
  definition: Eine Abfrage für die Liste und je eine weitere pro Element, weil Beziehungen einzeln nachgeladen werden (Lazy Loading). `selectinload` lädt sie in einer zusätzlichen Abfrage.
- term: Migration
  definition: Versioniertes Skript, das ein bestehendes Datenbankschema ändert, ohne Daten zu verlieren. Alembic erzeugt und führt sie für SQLAlchemy aus. `create_all` ändert bestehende Tabellen nicht.
- term: Strict Mode
  definition: Pydantic-Modus, der Typumwandlungen ablehnt, die der Standard (lax) erlaubt. Dann bleibt `"5"` für ein `int`-Feld ein Fehler.
