id: python
title: Python
short: Python
tagline: Lesbar, vielseitig, überall – vom Skript bis zum Backend.
description: >
  Die Sprache von Grund auf, Datenstrukturen, Objektorientierung, Iteratoren,
  Dekoratoren, Typisierung, Nebenläufigkeit, Tests mit pytest, modernes Tooling
  mit uv und ruff, Web und Daten – und Algorithmen fürs Coding-Interview.
  Alle Code-Aufgaben laufen direkt im Browser.
color: "#4D8BFF"
order: 4
outcomes:
  - Du schreibst sauberes, idiomatisches Python und kennst die eingebauten Datenstrukturen genau.
  - Du nutzt Klassen, Dataclasses, Protokolle, Generatoren, Dekoratoren und Context Manager.
  - Du typisierst Code mit Type Hints und prüfst ihn mit mypy oder pyright.
  - Du testest mit **pytest**, arbeitest mit uv, ruff und pyproject.toml und paketierst Projekte.
  - Du verstehst Threads, Prozesse und asyncio und wählst das Passende.
  - Du löst typische Coding-Interview-Aufgaben und erklärst ihre Laufzeit.
tracks:
  - title: Die Sprache
    description: Syntax, Kontrollfluss, Datenstrukturen, Strings, Dateien, Klassen und Fehler.
    modules: [python-einstieg, kontrollfluss-funktionen, datenstrukturen, strings-dateien, oop, fehler-module]
  - title: Fortgeschritten
    description: Iteratoren, Generatoren, Dekoratoren, Typisierung und Nebenläufigkeit.
    modules: [iteratoren-generatoren, dekoratoren-funktional, typisierung, nebenlaeufigkeit]
  - title: Profi-Werkzeuge
    description: Tests, Tooling, Web und Daten sowie Algorithmen fürs Interview.
    modules: [testen-pytest, tooling-packaging, web-datenbanken, algorithmen]
