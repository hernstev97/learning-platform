projects:
  - id: projektkarte-demo
    title: Ein fremdes Projekt kartieren
    level: 1
    hours: 5
    summary: Du nimmst ein Godot-Projekt, das du nicht geschrieben hast – die offizielle JRPG-Demo – und zeichnest eine Karte, mit der du dich darin zurechtfindest. Danach änderst du drei Werte und sagst vorher, was passiert. Lesen und Notieren gehen auch unterwegs.
    brief: |
      Ein Projekt, das ein Coding-Agent baut, ist für dich zuerst ein fremdes Projekt. Die Fertigkeit, die du hier übst, ist dieselbe: Du findest heraus, wo was liegt, ohne jede Zeile zu lesen. Als Übungsobjekt dient die Demo [Role Playing Game](https://github.com/godotengine/godot-demo-projects/tree/master/2d/role_playing_game) aus den offiziellen Godot-Demos. Sie ist für Godot 4.7 gepflegt, hat Bewegung auf einem Raster, Dialoge und einen Kampfbildschirm, also genug Szenen, Signale und Ressourcen, um sich darin zu verlaufen.

      Lade das Repository als ZIP oder klone es (`git clone https://github.com/godotengine/godot-demo-projects.git`) und öffne nur den Ordner `2d/role_playing_game` im Projektmanager. Ändere nichts, bevor die Karte steht.

      Grundlage sind [Der Editor als Werkstatt](/godot/editor-anatomie), [Szenenbäume lesen](/godot/szenenbaum), [Instanzen und Ressourcen](/godot/instanzen-ressourcen) und [Ein fremdes Projekt erkunden](/godot/projekt-erkunden).
    skills: [editor, szenenbaum, signale, ressourcen, remote-baum]
    steps:
      - id: einstellungen-lesen
        title: project.godot lesen
        detail: Notiere Hauptszene, Autoloads, Eingabeaktionen, Renderer und Fenstereinstellungen. Lies dafür die Datei selbst, nicht nur die Projekteinstellungen; was dort nicht steht, ist der Standard.
      - id: hauptszene-baum
        title: Den Baum der Hauptszene aufzeichnen
        detail: Zeichne den Baum der Hauptszene bis zur zweiten Ebene ab und markiere, welche Nodes Instanzen anderer Szenen sind und welche ein Skript tragen.
      - id: signale-verfolgen
        title: Drei Signale verfolgen
        detail: Wähle drei Verbindungen im Signale-Dock oder im `[connection]`-Teil der `.tscn` und schreib zu jeder auf, wer sendet, wer empfängt und was danach im Spiel passiert.
      - id: ressourcen-finden
        title: Geteilte Ressourcen finden
        detail: Suche Ressourcen, die mehrere Szenen benutzen (Texturen, `.tres`-Dateien), und notiere, was sich überall ändern würde, wenn du sie bearbeitest.
      - id: laufzeit-baum
        title: Den Baum zur Laufzeit vergleichen
        detail: Starte das Spiel, wechsle im Szene-Dock auf „Remote“ und vergleiche mit deiner Zeichnung. Notiere Nodes, die erst zur Laufzeit entstehen.
      - id: drei-werte
        title: Drei Werte ändern und vorhersagen
        detail: Such drei exportierte Werte oder Ressourcenwerte aus. Schreib vor jeder Änderung auf, was du erwartest, ändere nur diesen einen Wert, beobachte und notiere das Ergebnis. Danach den alten Wert wiederherstellen.
      - id: karte-schreiben
        title: Die Karte schreiben
        detail: Eine Seite `KARTE.md`, mit der eine zweite Person in fünf Minuten die Stelle findet, an der der Dialog startet. Prüfe die Karte, indem du nach einer Pause eine Frage nur mit ihr beantwortest.
    stretch:
      - Dieselbe Karte für die Demo `2d/isometric` anlegen und vergleichen, welche Fragen dort schwerer zu beantworten sind.
      - Einem Coding-Agenten die Karte geben und prüfen, ob er damit eine kleine Änderung ohne Rückfrage an der richtigen Stelle macht.
    portfolio: |
      Eine Projektkarte zeigt, dass du dich in fremdem Code zurechtfindest, und das braucht jedes Team, das an einem gemeinsamen Projekt arbeitet. Zeig die Zeichnung des Baums und die drei Vorhersagen mit Ergebnis, auch die falschen.

  - id: asset-pipeline
    title: Die eigene Asset-Pipeline vom Zeichenprogramm ins Spiel
    level: 2
    hours: 8
    summary: Du legst fest und dokumentierst, wie deine Bilder und Töne vom Zeichenprogramm oder von REAPER ins Testgelände kommen – Export, Ordner, Import-Voreinstellungen, Ursprung, Animation, Bus – und prüfst die Kette mit einem Prüfmuster und einer Änderung am Original.
    brief: |
      Wer Assets von Hand und nach Gefühl importiert, findet nach drei Wochen unscharfe Sprites, verrutschte Füße und Töne auf dem falschen Bus. Eine Pipeline ist eine kurze, aufgeschriebene Abfolge, die jedes Asset gleich durchläuft. Welche Auflösung, welche Rastergröße und welches Zeichenprogramm du verwendest, entscheidest du; dieses Projekt sorgt dafür, dass deine Entscheidungen festgehalten und überprüfbar sind.

      Arbeite im [Testgelände](/godot/projekt-erkunden). Grundlage sind [Pixelraster und Skalierung](/godot/pixelraster), [Eigene Sprites importieren](/godot/sprites-importieren), [Animationen zuordnen](/godot/animationen), [Audio zuordnen](/godot/audio) und [Testversionen exportieren und sichern](/godot/export-sichern).
    skills: [import, pixelart, spritesheet, animation, audio, git]
    steps:
      - id: ordner-festlegen
        title: Ordner und Namen festlegen
        detail: Lege fest, wo Originale (`.aseprite`, `.kra`, `.rpp`) und wo exportierte Dateien liegen, und wie Dateien heißen. Originale gehören nicht in einen Ordner, den Godot importiert.
      - id: pruefmuster
        title: Mit dem Prüfmuster beginnen
        detail: Exportiere einen Testbogen mit Rasterlinien und Frame-Nummern und importiere ihn. Im Spiel müssen alle Linien gleich breit und scharf sein, und jeder Frame zeigt genau seine Nummer.
      - id: import-voreinstellung
        title: Import-Voreinstellung festhalten
        detail: Lege die Import-Einstellungen für Sprites als Standard fest und schreib in `ASSETS.md`, welche Werte du gewählt hast und warum.
      - id: eigenes-sprite
        title: Ein eigenes Sprite mit Ursprung
        detail: Ein eigenes Sprite ersetzt den Platzhalter der Figur. Der Ursprung sitzt dort, wo du ihn für die Y-Sortierung brauchst; prüfe es, indem die Figur hinter und vor der Kiste vorbeiläuft.
      - id: eigene-animation
        title: Eine eigene Animation
        detail: Eine Animation aus deinem Sheet läuft im Spiel. Notiere FPS und Frameanzahl und prüfe, ob die Füße bei der Platzhalter-Geschwindigkeit rutschen.
      - id: eigener-ton
        title: Ein eigener Ton auf einem eigenen Bus
        detail: Ein eigener kurzer Ton spielt beim Einsammeln auf einem Bus, den du angelegt hast, und wird nicht abgeschnitten.
      - id: original-aendern
        title: Die Kette einmal durchlaufen
        detail: Ändere ein Original, exportiere neu und prüfe, dass Godot neu importiert und das Spiel die Änderung zeigt, ohne dass du im Editor etwas einstellen musst.
      - id: pipeline-commit
        title: Pipeline sichern
        detail: Originale, Exporte, `.import`-Dateien und `ASSETS.md` liegen in Git; ein Commit pro Schritt mit sprechender Nachricht.
    stretch:
      - Ein kleines Skript oder einen Exportbefehl deines Zeichenprogramms, das alle Sheets mit denselben Einstellungen exportiert, von einer KI schreiben lassen und prüfen.
      - Die Pipeline einer zweiten Person geben und beobachten, wo sie hängen bleibt.
    portfolio: |
      Eine dokumentierte Pipeline mit Prüfmuster zeigt, dass du Technik und Gestaltung zusammenbringst – die Kernaufgabe von Technical Artists. Zeig `ASSETS.md`, das Prüfmuster im Spiel und einen Commit, in dem eine Änderung am Original ohne Handarbeit im Spiel ankommt.

  - id: level-aus-tiles
    title: Ein kleiner Level aus eigenen Tiles
    level: 2
    hours: 10
    summary: Du baust im Testgelände einen kleinen Level aus eigenen Tiles mit Boden, Wänden und hohen Objekten, mit Kollision und Y-Sortierung, misst Laufwege und exportierst eine Testversion, die jemand anderes spielt.
    brief: |
      Ein Level ist die Stelle, an der Assets, Kollision, Zeichenreihenfolge und Bewegung zusammenkommen. Fehler zeigen sich hier zuerst: eine Wand, durch die man läuft, ein Baum, der über der Figur hängt, Nähte zwischen Tiles. Wie der Level aussieht und wie er sich spielt, entscheidest du. Der Kurs gibt dir keine Vorlage und keine Größe vor.

      Grundlage sind [Kollisionen und Trefferzonen](/godot/kollision-ebenen), [2D-Level aus Tiles](/godot/level-tilemap), [Eingabeaktionen und Parameter](/godot/aktionen-parameter) und [Testversionen exportieren und sichern](/godot/export-sichern).
    skills: [tileset, tilemaplayer, kollision, y-sortierung, export]
    steps:
      - id: tileset-anlegen
        title: TileSet aus eigenen Tiles
        detail: Ein Atlas aus deinem Tile-Sheet mit Tilegröße, Abstand und Rand so, wie du sie exportiert hast. Notiere die Werte.
      - id: ebenen
        title: Ebenen trennen
        detail: Mindestens Boden und Wände als eigene `TileMapLayer`. Schreib auf, warum ein Tile auf welcher Ebene liegt.
      - id: kollision-tiles
        title: Kollision auf Tiles
        detail: Wände haben Kollisionsformen auf einem Physik-Layer, den die Maske der Figur enthält. Prüfe mit *Debuggen → Sichtbare Collision-Shapes*, dass Form und Bild zusammenpassen.
      - id: hohe-objekte
        title: Hohe Objekte mit Y-Sortierung
        detail: Mindestens ein hohes Objekt, hinter und vor dem die Figur vorbeilaufen kann, ohne falsch überdeckt zu werden.
      - id: naehte-pruefen
        title: Auf Nähte prüfen
        detail: Lauf mit der Kamera über den Level und prüfe bei ganzzahliger Skalierung auf Linien zwischen Tiles. Notiere, was du findest und was du dagegen getan hast.
      - id: laufwege-messen
        title: Laufwege messen
        detail: Miss mit dem Log der Figur, wie lange der längste Weg durch den Level bei den Platzhalterwerten dauert. Sag vorher, wie sich die Zeit bei einer anderen Höchstgeschwindigkeit ändert, und prüfe es.
      - id: test-export
        title: Testversion exportieren
        detail: Exportiere eine Testversion für Linux oder Windows und lass eine andere Person spielen. Notiere, wo sie hängen bleibt, ohne einzugreifen.
      - id: level-commit
        title: Stand sichern
        detail: Level, TileSet und Originale der Tiles in Git; die Testversion mit einem Tag markiert.
    stretch:
      - Terrains für Boden und Wände einrichten und vergleichen, wie schnell sich der Level danach ändern lässt.
      - Sammelstücke als Szenen-Tiles setzen.
    portfolio: |
      Ein kleiner, sauber gebauter Level mit Beobachtungsnotizen einer Testperson zeigt, dass du prüfst, was du baust. Zeig ein kurzes Video mit sichtbaren Kollisionsformen und die Notizen der Testperson.

  - id: abschluss-testgelaende
    title: "Abschlussprojekt: Ein KI-Prototyp in deinen Händen"
    capstone: true
    level: 3
    hours: 30
    summary: Ein kleines Studio hat seinen Prototyp mit einem Coding-Agenten gebaut, und niemand im Team traut sich an den Editor. Du übernimmst das Testgelände als Stellvertreter, setzt eigene Assets ein, findest vorbereitete Fehler, stimmst Werte messbar ab und lieferst eine spielbare Testversion mit Einstellungs- und Korrekturprotokoll.
    brief: |
      ## Auftrag

      Ein Studio mit vier Leuten in Köln arbeitet an einem Pixelart-Spiel in der Draufsicht. Die Programmierung hat das Team weitgehend einem Coding-Agenten überlassen. Der Prototyp läuft, aber:

      - Die Zeichnerin bekommt ihre Sprites nicht sauber ins Spiel: Mal sind sie unscharf, mal sitzen die Füße neben dem Schatten.
      - Auf dem Steam Deck sehen die Pixel anders aus als am Monitor, und niemand weiß, warum.
      - Werte wie Tempo und Bremsweg stehen an drei Stellen, und keiner weiß, welche gilt.
      - Fehler werden behoben, aber niemand schreibt auf, was die Ursache war, also kommen sie wieder.

      Gesucht ist jemand, der den Editor beherrscht: Projekte liest, Assets sauber einbindet, Fehler eingrenzt und alles so dokumentiert, dass das Team ohne Rückfrage weiterarbeiten kann. Als Stellvertreter für den Prototyp dient dein [Testgelände](/godot/projekt-erkunden) mit der [Fehlerkiste](/godot/werkstatt-messen).

      ## Was du lieferst

      1. **Eine spielbare Szene** in Godot 4.7 auf Grundlage des Testgeländes: Figur, Boden und Wände aus Tiles, mindestens ein hohes Objekt mit Y-Sortierung, Sammelstücke mit Ton und Animation – alles mit deinen eigenen Assets.
      2. **`EINSTELLUNGEN.md`:** jede Einstellung, die vom Standard abweicht – Projekt, Import, Physik, Audio – mit Ort (Datei oder Dock) und einem Satz Begründung.
      3. **`KORREKTUREN.md`:** jeder gefundene Fehler mit Symptom, Vermutung, Prüfung, Ursache, Korrektur und Beleg (Log, Screenshot oder Commit).
      4. **`MESSUNGEN.md`:** mindestens vier Parameteränderungen mit Vorhersage vor der Änderung, Messung danach und Entscheidung.
      5. **Testversionen** für Linux und Windows, mit Tag im Repository.
      6. **Eine Git-Historie**, in der sich jede Korrektur einzeln nachvollziehen lässt.

      ## Technischer Rahmen

      Godot 4.7, GDScript, Stretch Mode `viewport`, Renderer Compatibility. Auflösung, Rastergröße, Aussehen, Klang und alle Werte entscheidest du; Platzhalter aus dem Kurs, die du übernimmst, kennzeichnest du in `EINSTELLUNGEN.md` als solche. Code und technisches Gerüst darf ein Coding-Agent liefern, auch nach deiner Vorgabe; du prüfst es im Editor und im Log. Das Projekt muss auf einem zweiten Rechner aus dem Repository heraus ohne Nacharbeit starten.

      Grundlage sind alle Module dieses Bereichs.
    skills: [godot, editor, import, tilemap, kollision, audio, debugger, export, git, dokumentation]
    acceptance:
      - id: start-ohne-nacharbeit
        text: Ein frischer Klon des Repositorys öffnet sich in Godot 4.7 ohne Fehler in der Ausgabe und startet die Hauptszene.
      - id: eigene-assets
        text: Figur, Tiles, Sammelstück und Ton stammen von dir; kein Platzhalter-Polygon und kein Platzhalter-Boden mehr im Spiel.
      - id: pixel-sauber
        text: Bei ganzzahliger Skalierung sind alle Pixel gleich groß und scharf, auch bei 1280 × 800; ein Screenshot je Auflösung liegt bei.
      - id: kollision-sichtbar-richtig
        text: Mit *Debuggen → Sichtbare Collision-Shapes* passen alle Formen zu den Bildern, die Figur läuft durch keine Wand und sammelt jedes Sammelstück ein.
      - id: fehler-dokumentiert
        text: Jeder Fehler aus der Fehlerkiste und jeder eigene Fund steht in `KORREKTUREN.md` mit Ursache und Beleg und hat einen eigenen Commit.
      - id: messungen-belegt
        text: "`MESSUNGEN.md` enthält mindestens vier Änderungen, bei denen die Vorhersage vor der Messung notiert ist; Abweichungen sind erklärt."
      - id: einstellungen-vollstaendig
        text: "`EINSTELLUNGEN.md` nennt jede Abweichung vom Standard in `project.godot`, den `.import`-Dateien und im Audio-Layout."
      - id: testversionen
        text: Linux- und Windows-Export starten auf einem Rechner ohne Godot; der Tag im Repository zeigt auf den exportierten Stand.
    steps:
      - id: ausgangslage
        title: Ausgangslage festhalten
        detail: Godot-Version, Stand des Testgeländes und ein erster Commit. Starte das Spiel und schreib in drei Sätzen auf, was du siehst.
      - id: projektkarte
        title: Projektkarte anlegen
        detail: Wo liegen Hauptszene, Figur, Werte, Verbindungen? Die Karte gehört an den Anfang von `EINSTELLUNGEN.md`.
      - id: fehlerkiste
        title: Vorbereitete Fehler finden
        detail: Bau die Fehler aus der Fehlerkiste ein, ohne nachzusehen, welche es sind. Finde jeden über sein Symptom und trag ihn in `KORREKTUREN.md` ein, bevor du ihn behebst.
      - id: pipeline
        title: Asset-Pipeline festlegen
        detail: Ordner, Exporteinstellungen und Import-Voreinstellungen für deine Bilder und Töne, geprüft mit einem Testbogen.
      - id: figur-einbinden
        title: Eigene Figur einbinden
        detail: Sprite mit Ursprung an der richtigen Stelle, Animationen nach Blickrichtung, Kollisionsform passend zum Bild.
      - id: level-bauen
        title: Boden und Wände aus Tiles
        detail: TileSet, Ebenen, Kollision, Y-Sortierung; der Platzhalter-Boden verschwindet.
      - id: ton-einbinden
        title: Ton und Bus
        detail: Eigene Töne auf eigenen Bussen, nichts wird beim Einsammeln abgeschnitten.
      - id: werte-abstimmen
        title: Werte messbar abstimmen
        detail: Vier Änderungen mit Vorhersage, Messung und Entscheidung in `MESSUNGEN.md`. Werte stehen danach an genau einer Stelle.
      - id: aufloesungen-pruefen
        title: Auf drei Auflösungen prüfen
        detail: Fenstergröße für 1920 × 1080, 2560 × 1440 und 1280 × 800 nachstellen, Screenshots ablegen und Ränder erklären.
      - id: exportieren
        title: Testversionen exportieren
        detail: Linux und Windows, mit `--verbose` gestartet, Log ohne Fehler, Tag im Repository.
      - id: frischer-klon
        title: Frischer Klon als Abnahme
        detail: Repository in einen neuen Ordner klonen, in Godot öffnen und alle Abnahmekriterien selbst abhaken.
    stretch:
      - Eine eigene Debug-Anzeige, die Tempo, Blickrichtung und aktuelle Animation zeigt und sich mit einer Taste ausblenden lässt.
      - Einer zweiten Person nur `EINSTELLUNGEN.md` und `KORREKTUREN.md` geben und prüfen, ob sie einen der Fehler wiederfindet, wenn du ihn erneut einbaust.
    portfolio: |
      Zeig dieses Projekt als Probeaufgabe für Technical Art oder Technical Design: ein Video von zwei Minuten mit sichtbaren Kollisionsformen, dazu `KORREKTUREN.md` mit zwei ausgewählten Fehlern von Symptom bis Beleg. Im Gespräch wird gefragt, wie du einen Fehler gefunden hast, den du nicht kanntest, und wie du sicherstellst, dass er nicht wiederkommt. Antworte mit dem Weg, nicht mit der Lösung: Symptom, Vermutung, Prüfung, Ursache.
