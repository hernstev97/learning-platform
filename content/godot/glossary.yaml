terms:
  - term: Node
    definition: Baustein eines Godot-Spiels mit einer Aufgabe, etwa `Polygon2D` zum Zeichnen oder `Camera2D` für den Bildausschnitt. Nodes hängen in einem Baum, jeder hat höchstens einen Elternknoten.
  - term: Szene
    definition: Ein gespeicherter Baum aus Nodes mit genau einer Wurzel, als Datei `.tscn`. Eine Szene lässt sich in andere Szenen einsetzen, ähnlich einer Komponente im Web.
  - term: Instanz
    definition: Eine eingesetzte Szene. Sie übernimmt alles aus ihrer Vorlage und speichert in der Eltern-Szene nur ihre Abweichungen; im Szenen-Dock trägt sie eine Filmklappe.
  - term: Geerbte Szene
    definition: Eine Szene, deren Wurzel eine Instanz einer Basisszene ist, angelegt mit *Szene → Neue geerbte Szene …*. Sie übernimmt Änderungen der Basis und speichert nur ihre eigenen Abweichungen.
  - term: Override
    definition: "Ein Wert, den eine Instanz abweichend von ihrer Vorlage setzt. Er steht als Zeile unter dem Abschnitt der Instanz in der Eltern-Szene, etwa `value = 3`, und der Inspektor zeigt daneben den Zurücksetzen-Pfeil."
  - term: Ressource
    definition: Ein Datenobjekt wie eine Textur, eine Kollisionsform oder eigene Werte (`extends Resource`). Ressourcen werden per Verweis geteilt; eine Kopie entsteht erst mit Einzigartig machen, `resource_local_to_scene` oder `duplicate()`.
  - term: ".tscn"
    definition: Textformat für Szenen. Es enthält Kopf, externe Ressourcen (`[ext_resource]`), eingebettete Ressourcen (`[sub_resource]`), Nodes (`[node]`) und Signalverbindungen (`[connection]`) und speichert nur Werte, die vom Standard abweichen.
  - term: ".tres"
    definition: Textformat für eine einzelne Ressource, etwa `data/player_stats.tres`. Wie in `.tscn` stehen darin nur Werte, die vom Standard des Skripts oder der Klasse abweichen.
  - term: "res://"
    definition: Pfad zum Projektordner, also zum Ordner mit `project.godot`. Im exportierten Spiel ist er nur lesbar.
  - term: "user://"
    definition: Beschreibbarer Ordner für Spielstände, Einstellungen und Protokolle. Unter Linux standardmäßig `~/.local/share/godot/app_userdata/<Projektname>/`.
  - term: Remote-Baum
    definition: Ansicht des Szenen-Docks, während das Spiel läuft (Knopf *Remote*). Sie zeigt alle Nodes des laufenden Spiels; Änderungen im Remote-Inspektor gehen beim Beenden verloren.
  - term: Autoload
    definition: "Ein Skript oder eine Szene, die Godot vor der Hauptszene als Node in den Baum hängt, eingetragen unter `[autoload]` in `project.godot`. Ist die Spalte Enable an, ist der Node im Code über seinen Namen erreichbar."
  - term: Signal
    definition: Ein Ereignis, das ein Node sendet (`collected.emit(total)`) und mit Methoden anderer Nodes verbunden wird, im Code oder als `[connection]` in der Szene. Das Signale-Dock zeigt die Verbindungen des gewählten Nodes.
  - term: Gruppe
    definition: Ein Etikett für Nodes, ähnlich einer CSS-Klasse. Code findet alle Mitglieder mit `get_tree().get_nodes_in_group()`; in der `.tscn` steht die Gruppe als `groups=[…]` in der Kopfzeile des Nodes.
  - term: NodePath
    definition: Pfad von einem Node zu einem anderen, relativ wie `"../HUD/Counter"` oder absolut ab `/root`. `$Counter` ist die Kurzform von `get_node("Counter")`.
  - term: Eindeutiger Name (%)
    definition: Markierung eines Nodes mit „Über einzigartigen Namen zugreifen“. Skripte derselben Szene erreichen ihn dann mit `%Name`, auch wenn sich sein Pfad innerhalb der Szene ändert.
  - term: Spielauflösung
    definition: Die Größe des Bildes, in dem das Spiel rechnet und zeichnet, in Godot `display/window/size/viewport_width` und `viewport_height`. Im Testgelände 320 × 180 als Platzhalter; welche Auflösung ein Spiel bekommt, hängt an seiner Pixelart.
  - term: Stretch Mode
    definition: "Projekteinstellung `display/window/stretch/mode`: wie das Spielbild an die Fenstergröße angepasst wird. `viewport` zeichnet klein und vergrößert das fertige Bild, `canvas_items` zeichnet jeden Node in Fenstergröße, `disabled` skaliert nicht. Neue Projekte starten in Godot 4.7 mit `canvas_items`."
  - term: Ganzzahlige Skalierung
    definition: "Scale Mode `integer`: Godot rundet den Vergrößerungsfaktor ab, damit jedes Spielpixel gleich viele Bildschirmpixel breit ist. Der Rest des Fensters bleibt schwarz, etwa 43 und 24 Pixel bei 320 × 180 auf 1366 × 768."
  - term: Texturfilter
    definition: "Bestimmt, welche Farbe beim Vergrößern zwischen Texturpixeln entsteht: `Nearest` nimmt das nächste Pixel, `Linear` mischt die vier nächsten. Projektweit in `rendering/textures/canvas_textures/default_texture_filter` (0 = Nearest), am Node in `texture_filter` (1 = Nearest, 2 = Linear)."
  - term: Subpixel
    definition: Eine Position zwischen zwei ganzen Pixeln, etwa x = 144,25. Ohne Pixel-Snap im Modus `canvas_items` zeichnet Godot Sprites an solchen Positionen, sie gleiten dann in Bruchteilen eines Spielpixels über das Raster.
  - term: Mixel
    definition: Pixel unterschiedlicher Größe im selben Bild, etwa ein Sprite mit `scale` 2 neben einem mit `scale` 1 oder gedrehte Pixelart, die feiner gerastert ist als ihre Umgebung.
  - term: ".import-Datei"
    definition: Textdatei neben jeder importierten Quelle, etwa `test_sheet.png.import`. Sie hält die Import-Einstellungen und den Pfad zum Ergebnis in `.godot/imported` und gehört ins Repository.
  - term: Spritesheet
    definition: Ein Bild mit mehreren gleich großen Feldern, meist den Frames einer Animation. Ein `Sprite2D` teilt es mit `hframes` und `vframes`, SpriteFrames holt Felder über den Dialog *Frames auswählen*.
  - term: SpriteFrames
    definition: Ressource mit benannten Animationen für `AnimatedSprite2D`. Jede Animation hat Frames, eine Geschwindigkeit in FPS (Standard 5), einen Loop-Modus und je Frame eine relative Dauer.
  - term: AnimatedSprite2D
    definition: Node, der Animationen aus SpriteFrames abspielt. `play()` mit demselben Namen lässt sie weiterlaufen, ein neuer Name beginnt bei Frame 0. Sendet `frame_changed`, `animation_looped` und, ohne Loop, `animation_finished`.
  - term: AnimationPlayer
    definition: Node, der Eigenschaften beliebiger Nodes zu festen Zeiten setzt, Methoden aufruft und Töne startet. Mit `callback_mode_process` auf Physics läuft er im Physik-Takt, nötig für Hitboxen und anderes spielmechanisches Timing.
  - term: Spur (Track)
    definition: Eine Zeile in einer Animation des `AnimationPlayer`, etwa Property Track, Call Method Track oder Audio Playback Track. Die Spurtypen heißen auch im deutschen Editor englisch.
  - term: Audiobus
    definition: Kanal, über den Ton zum Lautsprecher läuft, mit Lautstärkeregler, Effekten und Pegelanzeige im Panel *Audio*. Busse leiten nach links bis `Master`; Player finden ihren Bus über den Namen.
  - term: Dezibel (dB)
    definition: Logarithmisches Verhältnis. Für die Amplitude gilt dB = 20 × log10(Verhältnis); −6 dB halbieren die Amplitude, −20 dB teilen sie durch zehn. Umrechnen mit `linear_to_db()` und `db_to_linear()`.
  - term: AudioStreamPlayer2D
    definition: "Player mit Position, der mit dem Abstand zur Bildschirmmitte leiser wird: Faktor `(1 − Abstand / max_distance) ^ attenuation`, Standard 2000 Pixel und 1,0. Verteilt den Ton nach der Seite auf links und rechts."
  - term: Collision Layer
    definition: |
      Die Ebenen, auf denen ein Kollisionsobjekt liegt (`collision_layer`), 32 Stück. Im Inspektor ab 1 gezählt, in `.tscn` und Code als Bitwert gespeichert: Ebene *n* hat den Wert 2^(*n*−1), Ebene 3 ist also 4.
  - term: Collision Mask
    definition: |
      Die Ebenen, die ein Kollisionsobjekt absucht (`collision_mask`). Erkannt oder blockiert wird nur, wenn die Maske dessen, der sucht, den Layer des anderen enthält. Einzelne Ebenen setzt `set_collision_mask_value(nummer, true)`.
  - term: CharacterBody2D
    definition: |
      Körper, den dein Code bewegt, meist über `velocity` und `move_and_slide()`. Er bleibt an Körpern hängen, deren Layer in seiner Maske liegt; in der Draufsicht steht `motion_mode` auf Floating.
  - term: StaticBody2D
    definition: |
      Körper, den die Physik nicht bewegt, etwa Wände und Kisten. Versetzt ihn Code, springt er an die neue Stelle, ohne andere Körper mitzuschieben; dafür gibt es `AnimatableBody2D`.
  - term: Area2D
    definition: |
      Fläche, die Überlappungen meldet und nichts blockiert, über `body_entered` und `area_entered`. `monitoring` heißt „ich melde“, `monitorable` „andere Areas dürfen mich finden“.
  - term: Aktion (Input Action)
    definition: |
      Benannte Eingabe wie `move_right`, die der Code statt einer Taste abfragt, etwa mit `Input.is_action_just_pressed()`. Welche Tasten und Achsen sie auslösen, legt die Input Map fest.
  - term: Physical Keycode
    definition: |
      Tastenposition auf einer US-QWERTY-Tastatur (`physical_keycode`), laut Doku für Spieleingaben wie WASD gedacht. In der Eingabe-Zuordnung mit „(Physisch)“ markiert; auf QWERTZ liegt das physische Z dort, wo Y aufgedruckt ist.
  - term: "`@export`"
    definition: |
      GDScript-Annotation, die eine Variable im Inspektor zeigt und ihren Wert in Szene oder Ressource speichert. Godot setzt gespeicherte Werte nach `_init()` und vor `_ready()`; Werte gleich dem Standard stehen nicht in der Datei.
  - term: Export-Hint
    definition: |
      Zusatz zu einem Export, der die Anzeige im Inspektor ändert, etwa `@export_range(0, 400, 1, "suffix:px/s")`, `@export_enum`, `@export_group` oder `@export_file`. Hints begrenzen nur die Eingabe im Editor, nicht den Code.
  - term: Eigene Ressource (Custom Resource)
    definition: |
      Skript mit `extends Resource` und `class_name`, dessen exportierte Werte als `.tres` gespeichert werden, im Testgelände `MovementStats` in `player_stats.tres`. Alle Nodes, die dieselbe Datei benutzen, teilen die Werte.
  - term: TileSet
    definition: |
      Ressource, die Tiles beschreibt: Tilegröße, Quellen wie ein Atlas aus einem Bild, Physik-, Terrain- und Navigationsebenen. Als `.tres` gespeichert teilen es mehrere `TileMapLayer` und Level.
  - term: TileMapLayer
    definition: |
      Node, der in jeder Zelle seines Rasters höchstens eine Tile aus einem TileSet zeigt. Seit Godot 4.3 nimmt man je Ebene einen eigenen Layer statt des veralteten `TileMap`; die Zellen stehen binär in `tile_map_data`.
  - term: Terrain
    definition: |
      Zuordnung im TileSet, welche Ecken und Kanten einer Tile zu welchem Untergrund gehören. Damit wählt der TileMap-Editor beim Malen passende Übergänge selbst aus (Autotiling).
  - term: Y-Sortierung
    definition: |
      Zeichenreihenfolge nach der y-Position bei Kindern eines Nodes mit `y_sort_enabled`; weiter unten wird später, also obendrauf gezeichnet. Figuren werden an ihrem Ursprung sortiert, Tiles an Zellenmitte plus `y_sort_origin`.
  - term: Physik-Tick
    definition: |
      Ein Schritt der Simulation im festen Takt, standardmäßig 60 pro Sekunde (`physics/common/physics_ticks_per_second`). Pro Tick ruft Godot `_physics_process` aller Nodes auf und rechnet danach die Physik; wie viele Ticks auf ein gezeichnetes Bild fallen, hängt von der Bildrate ab.
  - term: "`delta`"
    definition: |
      Der Parameter von `_process` und `_physics_process`: die Spielzeit seit dem letzten Aufruf in Sekunden. In `_process` schwankt er mit der Bildrate, in `_physics_process` ist er fest, standardmäßig 1/60. `Engine.time_scale` streckt ihn.
  - term: "`_process`"
    definition: |
      Virtuelle Methode, die Godot einmal pro gezeichnetem Bild aufruft. Für alles, was nur die Darstellung betrifft; Gameplay-Timing hängt dort an der Bildrate. Entspricht grob `requestAnimationFrame` im Browser.
  - term: "`_physics_process`"
    definition: |
      Virtuelle Methode, die Godot in jedem Physik-Tick vor dem Physik-Schritt aufruft. Für Bewegung mit Kollision, Frame-Zähler und alles, was auf jedem Rechner gleich lange dauern muss.
  - term: Physik-Interpolation
    definition: |
      Zeichnet Objekte zwischen den Ständen der letzten beiden Ticks, damit Bewegung bei Bildraten über dem Physik-Takt gleichmäßig wirkt; in 2D seit Godot 4.3. Kostet ein bis zwei Ticks Rückstand und wirkt nur auf Bewegung im Physik-Takt. Nach einem Teleport `reset_physics_interpolation()` aufrufen.
  - term: Frame-Zeit
    definition: |
      Die Zeit für ein gezeichnetes Bild. Das Budget ist 1000 / Bildrate Millisekunden, also 16,67 ms bei 60 und 6,94 ms bei 144 Bildern pro Sekunde. Der Monitor „Prozessierung“ zeigt den längsten Durchlauf der letzten Sekunde, mit VSync einschließlich der Wartezeit auf den Monitor.
  - term: VSync
    definition: |
      Vertikale Synchronisation: Godot wartet mit jedem Bild auf den Monitor, die Bildrate übersteigt dessen Bildwiederholrate nicht. Einstellung *Anzeige → Fenster → V-Sync-Modus* (`display/window/vsync/vsync_mode`), Standard `Enabled`; `--disable-vsync` schaltet sie für einen Lauf ab.
  - term: Haltepunkt
    definition: |
      Stelle im Code, an der das Spiel anhält, damit du Aufrufkette und Variablen im Stacktrace prüfen kannst. Gesetzt per Klick links neben die Zeilennummer oder mit dem Schlüsselwort `breakpoint`, das mit dem Skript gespeichert wird.
  - term: Monitor
    definition: |
      Messwert im Reiter Monitore des Debuggers, etwa FPS, Prozessierung, Nodes oder Verwaiste Nodes, als Graph über die Zeit. Der Editor fragt die Werte einmal pro Sekunde ab. Eigene Monitore legt `Performance.add_custom_monitor()` an.
  - term: Profiler
    definition: |
      Reiter im Debugger, der nach *Start* die Zeit je Funktion und Frame misst. „Gesamt“ zählt aufgerufene Funktionen mit, „Eigen“ nur den eigenen Code. Der Visuelle Profiler misst dagegen nur das Zeichnen auf CPU und GPU.
  - term: Orphan Node
    definition: |
      Deutsch im Editor „verwaister Node“: ein Node, der existiert, aber in keinem Szenenbaum hängt, etwa nach `remove_child()` ohne `queue_free()`. Steigt der Monitor „Verwaiste Nodes“, verliert ein Skript Nodes; `Node.print_orphan_nodes()` listet sie.
  - term: Exportvorlage
    definition: |
      Vorgebautes Godot ohne Editor für eine Zielplattform, das mit der PCK eines Projekts zum Spiel wird. Muss exakt zur Editor-Version passen und liegt unter `export_templates/<version>/` in den Editordaten; installiert über *Editor → Exportvorlagen verwalten …*.
  - term: Export-Preset
    definition: |
      Gespeicherte Export-Einstellung für eine Plattform, etwa „Linux“ oder „Windows Desktop“, mit Exportpfad, Optionen und Ressourcenauswahl. Steht in `export_presets.cfg` im Projektordner und gehört ins Repository; Geheimnisse liegen getrennt in `.godot/export_credentials.cfg`.
  - term: PCK
    definition: |
      Godots Paketformat für die Daten eines exportierten Projekts: Szenen, Ressourcen, vorverarbeitete Skripte. Liegt neben dem Programm oder ist mit *PCK einbetten* in ihm enthalten; fehlt sie, startet das Programm mit „Is the .pck file missing?“ nicht.
  - term: "`.uid`-Datei"
    definition: |
      Datei neben einem Skript oder Shader (seit Godot 4.4) mit einer eindeutigen ID wie `uid://4pgkkb82h0e6`, über die Szenen auf die Datei verweisen, auch wenn sie verschoben wird. Muss ins Repository, sonst brechen die Verweise auf anderen Rechnern.
