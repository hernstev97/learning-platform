id: godot
title: Godot 4 für Gestaltung & 2D-Prototypen
short: Godot
tagline: Ein Projekt, das eine KI gebaut hat, im Editor lesen, mit eigenen Assets füllen und abstimmen.
description: >
  Editor, Szenen, Nodes, Ressourcen und Instanzen, eigene Sprites, Animationen, Tiles und Sounds,
  Kollisionen, Eingabeaktionen und Parameter, Bildrate und Simulation, Debugger, Profiler und Export –
  mit Godot 4.7. Code und technisches Gerüst darf eine KI liefern; du liest es, stellst es ein und
  triffst jede gestalterische Entscheidung selbst. Wo es passt, knüpft der Kurs an deine
  Erfahrung aus der Webentwicklung an. Module mit der Marke „Unterwegs“ gehen ganz am Handy, auch offline, mit Screenshots aus Editor
  und Spiel. „Am PC“ braucht Godot am Rechner; lesen kannst du diese Lektionen auch unterwegs.
color: "#B5E3FF"
order: 12
outcomes:
  - "Du **liest ein fremdes Godot-Projekt**: Hauptszene, Szenenbaum, Instanzen, Ressourcen, Signale und Autoloads, im Editor und zur Laufzeit im Remote-Baum."
  - Du **importierst eigene Pixelart** scharf und im richtigen Raster, zerlegst Spritesheets, setzt Ursprünge und ordnest Animationen und Töne zu.
  - Du erklärst, was zwischen **Spielauflösung und Bildschirm** passiert, und diagnostizierst unscharfe, ungleichmäßige oder zitternde Pixel an Screenshots.
  - Du stellst **Kollisionen, Layer und Masken, Eingabeaktionen und exportierte Parameter** ein und sagst vorher, was eine Änderung bewirkt.
  - Du baust **2D-Level mit TileMapLayer** und Y-Sortierung aus eigenen Tiles.
  - Du **grenzt Probleme ein** – Bildrate oder Simulation, Import, Kollision, Skalierung – mit Debugger, Monitoren und Profiler.
  - Du **exportierst Testversionen** und sicherst Projekt und Originaldateien nachvollziehbar in Git.
tracks:
  - title: Den Editor lesen
    description: Docks und Projektordner, Szenenbäume, Instanzen und Ressourcen. Am PC erkundest du ein Projekt und baust das Testgelände auf, an dem der Kurs arbeitet.
    modules: [editor-anatomie, szenenbaum, instanzen-ressourcen, projekt-erkunden]
  - title: Eigene Assets
    description: Pixelraster und Skalierung verstehen, dann eigene Sprites importieren, Animationen und Töne zuordnen.
    modules: [pixelraster, sprites-importieren, animationen, audio]
  - title: Welt und Systeme abstimmen
    description: Kollisionen und Masken, Eingabeaktionen und Parameter, Level aus Tiles.
    modules: [kollision-ebenen, aktionen-parameter, level-tilemap]
  - title: Messen und ausliefern
    description: Bildrate und Simulation, Fehler eingrenzen mit Debugger und Profiler, Testversionen exportieren und sichern, zum Schluss vorhersagen, ändern und messen im eigenen Testgelände.
    modules: [bildrate-simulation, fehler-eingrenzen, export-sichern, werkstatt-messen]
