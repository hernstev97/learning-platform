cards:
  - id: editor-anatomie-szenen-in-git
    module: editor-anatomie
    q: Warum lassen sich Godot-Projekte gut mit Git versionieren, und was gehört nicht hinein?
    a: |
      Szenen (`.tscn`), Ressourcen (`.tres`), Skripte und `project.godot` sind Textdateien, und Godot speichert darin nur Werte, die vom Standard abweichen. Stellt jemand im Inspektor `max_speed` auf 120, zeigt `git diff` genau eine neue Zeile `max_speed = 120.0`. Die `.uid`-Dateien neben Skripten gehören mit ins Repository, `.godot/` nicht: Das ist ein Cache, den Godot beim Öffnen neu erzeugt.
    tags: [editor, git]
    level: 1
  - id: editor-anatomie-res-user
    module: editor-anatomie
    q: Was ist der Unterschied zwischen `res://` und `user://`?
    a: |
      `res://` ist der Projektordner mit allen Szenen, Skripten und Assets; im exportierten Spiel ist er nur lesbar. `user://` ist ein beschreibbarer Ordner für Spielstände, Einstellungen und Protokolle, unter Linux `~/.local/share/godot/app_userdata/<Projektname>/`. Wer einen Spielstand nach `res://` schreibt, merkt den Fehler erst im exportierten Spiel.
    tags: [editor, dateien]
    level: 1
  - id: editor-anatomie-abweichungen-finden
    module: editor-anatomie
    q: Wie erkennst du in einer fremden Szene, welche Werte jemand bewusst eingestellt hat?
    a: |
      Am Zurücksetzen-Pfeil im Inspektor: Er steht nur neben Werten, die vom Standard abweichen. Standard ist der Wert der Klasse oder des Skripts, bei einer Instanz der Wert aus ihrer Vorlage. Das Werkzeugmenü bietet „Nicht-Default expandieren“, das nur die Abschnitte mit Abweichungen aufklappt. Im Text sehe ich dasselbe: Jede Eigenschaftszeile in der `.tscn` ist eine Abweichung, alles andere ist Standard.
    tags: [editor, inspektor]
    level: 1
  - id: szenenbaum-zeichenreihenfolge
    module: szenenbaum
    q: Wie entscheidet Godot in 2D, was vorn gezeichnet wird?
    a: |
      Grundregel ist die Baumreihenfolge: Spätere Geschwister liegen über früheren, Kinder über ihren Eltern. `z_index` verschiebt Nodes in höhere oder tiefere Ebenen. Ist an einem Node `y_sort_enabled` an, sortiert Godot seine Kinder mit gleichem `z_index` nach der y-Position ihres Ursprungs, so wie es eine Draufsicht braucht. Ein `CanvasLayer` mit höherem `layer` liegt über allem und folgt der Kamera nicht, deshalb kommt das HUD dort hinein.
    tags: [szenenbaum, zeichnen]
    level: 1
  - id: szenenbaum-pfade-brechen
    module: szenenbaum
    q: Ein Kollege benennt einen Node um, und das Spiel meldet „Node not found“. Was ist passiert, und wie verhinderst du das?
    a: |
      Ein Skript greift mit einem festen Pfad wie `$Counter` auf den Node zu, und Godot passt Skripte beim Umbenennen nicht an. Robuster ist ein szeneneindeutiger Name: Der Node wird als „Über einzigartigen Namen zugreifen“ markiert, und das Skript schreibt `%Counter`; der Pfad darf sich dann innerhalb der Szene ändern. Signalverbindungen schreibt der Editor beim Speichern selbst neu, solange man im Szenen-Dock umbaut. Wer die `.tscn` von Hand ändert, verliert sie dagegen ohne Meldung.
    tags: [szenenbaum, fehlersuche]
    level: 2
  - id: szenenbaum-ready-reihenfolge
    module: szenenbaum
    q: In welcher Reihenfolge laufen `_ready()` und `_process()` in einem Szenenbaum?
    a: |
      `_ready()` läuft bei den Kindern zuerst und beim Elternknoten zuletzt, damit der Eltern-Node in `_ready()` auf fertige Kinder zugreifen kann. `_process()` läuft dagegen in Baumreihenfolge von oben nach unten, bei gleicher `process_priority`. Im Testgelände heißt das: `_ready` bei Player, Crate, Objects, HUD, Main, `_process` bei Main, Objects, Player, Crate, HUD.
    tags: [szenenbaum, lebenszyklus]
    level: 2
  - id: instanzen-override-speichern
    module: instanzen-ressourcen
    q: Was speichert Godot, wenn du eine Eigenschaft an einer Instanz änderst, und welcher Wert gilt am Ende?
    a: |
      Die Eltern-Szene bekommt unter dem Abschnitt der Instanz eine Zeile mit der Abweichung, etwa `value = 3`; die Vorlage bleibt unverändert. Es gilt der Standard im Skript, darüber der Wert der Vorlage, darüber der Override der Instanz und zuletzt, was Code zur Laufzeit zuweist. Eine Änderung an der Vorlage erreicht deshalb nur Instanzen ohne eigenen Override für diese Eigenschaft.
    tags: [instanzen, szenen]
    level: 2
  - id: instanzen-geteilte-form
    module: instanzen-ressourcen
    q: Ein Designer macht die Kollisionsform eines Sammelstücks größer, und alle Sammelstücke wachsen mit. Woran liegt das?
    a: |
      Ressourcen werden geteilt, nicht kopiert. Alle Instanzen einer Szene teilen ihre Unter-Ressourcen, und ein duplizierter Node teilt seine Form mit dem Original; der Inspektor zeigt das seit Godot 4.6 mit einem Kettensymbol. Soll nur ein Objekt abweichen, macht man die Form im Editor einzigartig. Ändert Code die Form zur Laufzeit, braucht es `duplicate()` vor der Änderung oder `resource_local_to_scene` an der Ressource.
    tags: [ressourcen, fehlersuche]
    level: 2
  - id: instanzen-varianten-waehlen
    module: instanzen-ressourcen
    q: Wann nimmst du eine geerbte Szene, wann Bearbeitbare Kinder und wann Lokal machen?
    a: |
      Eine geerbte Szene nehme ich für eine Variante, die ich an mehreren Stellen einsetze; sie folgt Änderungen an der Basis weiter. Bearbeitbare Kinder nutze ich, wenn eine einzelne Verwendung an einem Kind etwas anders braucht, auch hier bleibt die Verbindung zur Vorlage. Lokal machen kappt die Verbindung und kopiert alles in die Eltern-Szene; das ist für Einzelstücke, die sich bewusst von der Vorlage lösen sollen. In der `.tscn` erkenne ich die Wege an `instance=` an der Wurzel, an `[editable path=…]` oder an einem Node ohne Instanz.
    tags: [instanzen, szenen]
    level: 2
  - id: projekt-erkunden-erste-stunde
    module: projekt-erkunden
    q: Du übernimmst ein fremdes Godot-Projekt. Was machst du, bevor du den ersten Wert änderst?
    a: |
      Ich lese `project.godot` auf Hauptszene, Autoloads, Eingabeaktionen und Ebenen-Namen, starte das Spiel und beobachte Ausgabe und Debugger. Dann folge ich dem Baum der Hauptszene in die Instanzen, überfliege die Skripte nach `class_name`, `signal` und `@export` und prüfe Verbindungen im Signale-Dock und per `grep` in den Szenen, weil die eingebaute Suche standardmäßig nur Skripte durchsucht. Am Ende schaue ich in den Remote-Baum und schreibe eine Projektkarte.
    tags: [projekt, vorgehen]
    level: 1
  - id: projekt-erkunden-remote
    module: projekt-erkunden
    q: Wofür nutzt du den Remote-Baum und den Remote-Inspektor, und was musst du dabei beachten?
    a: |
      Sie zeigen das laufende Spiel: alle Nodes, auch die in Instanzen, und im Inspektor auch nicht exportierte Variablen wie einen Zähler. Ich prüfe dort, was zur Laufzeit existiert, und probiere Werte aus. Änderungen gehen beim Beenden verloren, also übertrage ich einen guten Wert in den lokalen Inspektor oder die `.tres`. Und weil der Remote-Baum das Spiel laut Editor zum Ruckeln bringen kann, schalte ich vor Messungen zurück auf Lokal.
    tags: [projekt, laufzeit]
    level: 1
  - id: projekt-erkunden-fehlermeldung-lesen
    module: projekt-erkunden
    q: Wie liest du eine Godot-Fehlermeldung mit Backtrace?
    a: |
      Die `ERROR`-Zeile sagt, was schiefging, etwa dass eine Eingabeaktion fehlt. Die `at:`-Zeile zeigt Godots eigenen C++-Quelltext und hilft selten. Der GDScript-Backtrace nennt meine Datei und Zeile; Eintrag `[0]` ist die Stelle des Fehlers, die Einträge darunter zeigen, wer sie aufgerufen hat. „Did you mean“ schlägt einen ähnlichen Namen vor und verrät so oft einen Tippfehler.
    tags: [projekt, fehlersuche]
    level: 1
  - id: pixelraster-viewport-canvas-items
    module: pixelraster
    q: Was ist der Unterschied zwischen den Stretch Modes `viewport` und `canvas_items` für ein Pixelart-Spiel?
    a: |
      `viewport` zeichnet die Szene in der Spielauflösung, etwa 320 × 180, und vergrößert dann das fertige Bild. Jedes Spielpixel wird ein gleich großer Block, nichts liegt zwischen zwei Pixeln. `canvas_items` zeichnet jeden Node direkt in Fenstergröße; dann entscheidet der Texturfilter, ob ein vergrößertes Sprite scharf bleibt, und Figuren können sich in Bruchteilen eines Spielpixels bewegen. Für strenge Pixelart nehme ich `viewport`; `canvas_items` passt, wenn Schrift oder Drehungen in voller Auflösung gewünscht sind. Neue Projekte starten in Godot 4.7 mit `canvas_items`, das stelle ich bewusst um.
    tags: [pixelraster, skalierung]
    level: 1
  - id: pixelraster-faktor-raender
    module: pixelraster
    q: Ein Spiel mit 320 × 180 läuft auf einem Laptop mit 1366 × 768. Was passiert mit ganzzahliger Skalierung?
    a: |
      Godot nimmt die kleinere Division und rundet ab: 1366 / 320 und 768 / 180 sind beide 4,27, also Faktor 4. Das Bild wird 1280 × 720 groß, links und rechts bleiben je 43 Pixel schwarz, oben und unten je 24. Mit `fractional` wäre die Fläche voll, aber die Pixel wären abwechselnd 4 und 5 Bildschirmpixel breit. Den Rand nehme ich für gleich große Pixel in Kauf; `expand` füllt ihn nicht, weil er vom Abrunden kommt, nicht vom Seitenverhältnis.
    tags: [pixelraster, skalierung]
    level: 2
  - id: pixelraster-diagnose
    module: pixelraster
    q: Ein Tester meldet, die Pixelart sehe „komisch“ aus. Wie grenzt du das ein?
    a: |
      Ich lasse mir einen Screenshot mit einem Prüfmuster geben: Schachbrett und Streifen aus einzelnen Pixeln. Grau statt Schwarz und Weiß heißt Filter `Linear` oder ein Sprite, das im Modus `canvas_items` vergrößert wird. Abwechselnd breite und schmale Streifen heißen nicht ganzzahliger Faktor, Kamera-Zoom oder `scale`. Unterschiedlich große Pixel nebeneinander sind Mixels. Danach prüfe ich die passende Stelle in `project.godot` oder in der Szene, statt an allen gleichzeitig zu drehen.
    tags: [pixelraster, fehlersuche]
    level: 2
  - id: pixelraster-kamera-zittern
    module: pixelraster
    q: Warum zittert eine Figur um einen Pixel, wenn die Kamera geglättet folgt?
    a: |
      Mit Pixel-Snap rundet Godot Figur und Kamera getrennt auf ganze Pixel. Folgt die Kamera mit Glättung, ist der Abstand zwischen beiden eine Kommazahl, die sich jedes Bild ändert, und gerundet springt die Figur zwischen zwei Positionen hin und her. Gemessen bei 90 px/s: ohne Glättung steht die Figur bei 154, mit Glättung wechselt sie zwischen 170 und 171. Ob man Glättung will, ist eine Designfrage; beurteilen muss man sie in Bewegung.
    tags: [pixelraster, kamera]
    level: 3
  - id: sprites-import-pipeline
    module: sprites-importieren
    q: Was passiert, wenn du eine PNG in ein Godot-Projekt legst, und was davon gehört ins Repository?
    a: |
      Godot importiert sie: Die PNG bleibt unverändert, daneben entsteht eine `.import`-Datei mit den Einstellungen, und das Ergebnis liegt als `.ctex` im Cache `.godot/imported`. Ändert sich die PNG, importiert Godot neu. Ins Repository gehören PNG und `.import`, der Ordner `.godot/` nicht. Das ist wie bei einem Bundler, nur dass die Konfiguration pro Datei neben der Quelle steht.
    tags: [import, git]
    level: 1
  - id: sprites-pixelart-import
    module: sprites-importieren
    q: Welche Import-Einstellungen verderben Pixelart, und wo stellst du den Filter ein?
    a: |
      VRAM-Kompression verschiebt Farben in Blöcken, eine Größenbeschränkung verkleinert mit kubischer Interpolation und macht das Bild weich, Mipmaps kosten in 2D meist nur Speicher. Für Pixelart bleibt es bei Lossless, ohne Mipmaps, Größenbeschränkung 0. Der Filter ist seit Godot 4 keine Import-Einstellung mehr, sondern eine Zeicheneinstellung: projektweit Nearest und an den Nodes Inherit. Änderungen an `.import`-Dateien sehe ich mir im Diff an, weil sie im Spiel leicht übersehen werden.
    tags: [import, pixelart]
    level: 2
  - id: sprites-ursprung-fuesse
    module: sprites-importieren
    q: Warum gehört der Ursprung einer Figur in der Draufsicht an die Füße?
    a: |
      Y-Sortierung zeichnet Nodes nach ihrer Position: Wer weiter unten steht, wird später gezeichnet. Liegt der Ursprung in der Bildmitte, sortiert Godot nach dem Bauch der Figur, und sie steht mit den Füßen vor einer Kiste, aber halb dahinter. Mit dem Ursprung an den Füßen, etwa per `offset` um die halbe Feldhöhe nach oben, stimmt die Reihenfolge mit dem Boden überein, auf dem die Figur steht.
    tags: [sprites, y-sortierung]
    level: 2
  - id: animationen-sprite-oder-player
    module: animationen
    q: Wann nimmst du `AnimatedSprite2D` und wann einen `AnimationPlayer`?
    a: |
      `AnimatedSprite2D` mit SpriteFrames für reine Bildfolgen wie Laufen und Stehen. Sobald im selben Takt noch etwas anderes passieren muss, eine Hitbox, ein Ton, ein Methodenaufruf, nehme ich einen `AnimationPlayer` mit Spuren für alles. Er kann außerdem im Physik-Takt laufen, was für spielmechanisches Timing zählt; das `AnimatedSprite2D` zählt im Bildtakt. Oft kombiniere ich beides.
    tags: [animation]
    level: 1
  - id: animationen-richtung-360
    module: animationen
    q: Deine Figur läuft analog in 360°, gezeichnet sind vier Richtungen. Wie wählst du die Animation?
    a: |
      Ich nehme den Winkel des letzten Eingabevektors, teile durch 90° und runde; `wrapi` faltet das Ergebnis auf 0 bis 3. Beim Wechsel der Richtung während des Laufens übernehme ich Frame und Fortschritt mit `set_frame_and_progress()`, sonst beginnt der Zyklus neu und die Figur stolpert. Tastatur-Diagonalen liegen genau auf der Sektorgrenze; was dort gilt, lege ich bewusst fest, statt es der Rundung zu überlassen.
    tags: [animation, eingabe]
    level: 2
  - id: animationen-fussrutschen
    module: animationen
    q: Die Füße deiner Figur rutschen beim Laufen. Wie gehst du vor?
    a: |
      Ich rechne nach: Zyklusdauer ist Summe der Frame-Dauern durch FPS, die Strecke pro Zyklus Tempo mal Zyklusdauer. Passt die nicht zum Schrittweg in der Zeichnung, rutscht der Fuß. Bei 90 px/s, vier Frames und 30 Pixeln Schrittweg passen 12 FPS. Ändert sich das Tempo, koppel ich `speed_scale` daran. Ob ein leichtes Gleiten zum Stil passt, entscheide ich danach im Spiel.
    tags: [animation, tempo]
    level: 2
  - id: audio-queue-free
    module: audio
    q: Ein Sammelgeräusch spielt nicht, obwohl `play()` aufgerufen wird. Woran liegt es?
    a: |
      Häufig hängt der Player am Pickup, und das Pickup ruft gleich danach `queue_free()` auf; mit ihm verschwindet der Player, und der Ton bricht ab. Ich lege den Ton auf einen Node, der weiterlebt, und löse ihn über ein Signal aus, oder hänge den Player vor dem Löschen um. Danach prüfe ich den Bus mit Solo und Mute und den Stream selbst, etwa Stille am Anfang oder eine Startposition hinter dem Ende.
    tags: [audio, fehlersuche]
    level: 2
  - id: audio-dezibel-busse
    module: audio
    q: Wie ist die Lautstärke in Godot organisiert, und was heißt −6 dB?
    a: |
      Jeder Player hat `volume_db`, und jeder Ton läuft über einen Bus mit eigenem Regler und Effekten bis zum Master-Bus. Die Lautstärke ist die Summe aller Stufen in Dezibel. −6 dB halbieren die Amplitude, −20 dB teilen sie durch zehn; `linear_to_db()` rechnet um. Busse findet ein Player über den Namen, deshalb bricht das Umbenennen eines Busses die Zuordnung, ohne Fehlermeldung.
    tags: [audio, mischung]
    level: 1
  - id: kollision-ebenen-layer-maske
    module: kollision-ebenen
    q: Was ist der Unterschied zwischen Collision Layer und Collision Mask in Godot?
    a: |
      Der Layer sagt, auf welchen Ebenen ein Objekt liegt, die Maske, welche Ebenen es absucht. Erkannt oder blockiert wird nur, wenn die Maske dessen, der sucht, den Layer des anderen enthält; die Maske des anderen spielt dabei keine Rolle. Ein Sammelstück auf „pickups“ mit Maske „player“ meldet die Figur, auch wenn die Figur selbst nur „world“ sucht. Im Inspektor zählt man Ebenen ab 1, in der `.tscn` steht ein Bitwert: Ebene 3 ist 4.
    tags: [kollision, layer, maske]
    level: 1
  - id: kollision-ebenen-area-oder-koerper
    module: kollision-ebenen
    q: Wann nimmst du eine Area2D und wann einen Körper wie StaticBody2D oder AnimatableBody2D?
    a: |
      Eine `Area2D` meldet Überlappungen über Signale und blockiert nichts, also für Sammelstücke, Trigger und Trefferflächen. Körper blockieren. Eine Wand, die sich nie bewegt, ist ein `StaticBody2D`. Eine Tür, die eine Animation verschiebt und die Figur dabei mitschieben soll, ist ein `AnimatableBody2D`; ein versetzter `StaticBody2D` würde laut Doku nur springen. Die Figur selbst ist ein `CharacterBody2D`, den der Code mit `move_and_slide()` bewegt.
    tags: [kollision, nodes]
    level: 1
  - id: kollision-ebenen-signal-kommt-nicht
    module: kollision-ebenen
    q: Ein Sammelstück liegt sichtbar auf der Figur, aber body_entered kommt nie. Wie gehst du vor?
    a: |
      Ich prüfe von der Seite des Suchenden aus. Hat das Sammelstück eine Form, oder zeigt das Szenen-Dock ein Warndreieck? Ist `monitoring` an? Enthält seine Maske den Layer der Figur? Bei Area gegen Area zusätzlich: Ist beim Ziel `monitorable` an? Dazu starte ich mit sichtbaren Kollisionsformen, damit ich sehe, ob sich die Formen wirklich überlappen und nicht nur die Bilder. Häufigster Fund: Nummer und Bitwert verwechselt, etwa `set_collision_mask_value(4, true)` für Ebene 3.
    tags: [kollision, fehlersuche, szenario]
    level: 2
  - id: kollision-ebenen-fussform
    module: kollision-ebenen
    q: Was bewirkt es, wenn eine Figur in einem Top-down-Spiel nur mit einer flachen Form an den Füßen kollidiert?
    a: |
      Die Figur kann vor und hinter Objekte treten, weil ihr Kopf im Bild über andere Objekte ragen darf, ohne anzustoßen. Mit dem Ursprung an den Füßen zeichnet die Y-Sortierung sie dann richtig davor oder dahinter. Eine Form über die ganze Figur hält sie dagegen schon mit dem Kopf auf; im Testgelände bleibt sie so 10 Pixel früher vor einer Kiste stehen. Welche Variante ein Spiel will, ist eine Designentscheidung. Treffer im Kampf prüfen ohnehin eigene Areas, die anders sitzen können.
    tags: [kollision, top-down]
    level: 2
  - id: aktionen-parameter-aktionen-statt-tasten
    module: aktionen-parameter
    q: Warum fragt Spielcode Aktionen ab statt Tasten, und was bedeutet „physisch“ in der Eingabe-Zuordnung?
    a: |
      Eine Aktion wie `move_right` entkoppelt den Code von der Belegung: Tastatur, Pfeiltasten und Stick hängen an derselben Aktion, und Spieler oder Designer ändern die Belegung, ohne Code anzufassen. Ein physischer Tastencode ist die Position auf einer US-QWERTY-Tastatur; die Doku empfiehlt ihn für Spieleingaben wie WASD. Auf QWERTZ liegt die physische Taste Z dort, wo Y aufgedruckt ist, links neben X. Für Kürzel wie Ctrl+S nimmt man den Tastencode, für Anzeigen das Label.
    tags: [eingabe, input-map]
    level: 1
  - id: aktionen-parameter-just-pressed
    module: aktionen-parameter
    q: Was ist der Unterschied zwischen is_action_pressed und is_action_just_pressed?
    a: |
      `is_action_pressed()` ist in jedem Frame wahr, solange die Aktion gehalten wird, `is_action_just_pressed()` nur im ersten Frame des Drucks. Drei Frames gehalten heißt dreimal wahr gegen einmal. Laufen und Zielen fragen den Zustand ab, Angriff und Ausweichen den Beginn. Wer das verwechselt, bekommt ein Ausweichen, das beim Halten in jedem Frame neu auslöst.
    tags: [eingabe, gdscript]
    level: 1
  - id: aktionen-parameter-wert-ohne-wirkung
    module: aktionen-parameter
    q: Ein Designer ändert einen exportierten Wert im Inspektor, und im Spiel passiert nichts. Woran kann das liegen?
    a: |
      An der Frage, wer den Wert zuletzt setzt. Die Reihenfolge ist: Standard im Skript, Wert in der eigenen Szene, Override an der Instanz in der Elternszene, dann Code in `_ready()`. Eine Zuweisung in `_ready()` schlägt jeden Inspektor-Wert. Außerdem prüfe ich, ob er die richtige Instanz bearbeitet hat, ob der Wert in einer geteilten Ressource liegt, und ob er im Remote-Inspektor des laufenden Spiels geändert hat. Dann zeige ich ihm die Stelle, an der der Wert dauerhaft wirkt.
    tags: [parameter, export, szenario]
    level: 2
  - id: aktionen-parameter-live-tuning
    module: aktionen-parameter
    q: Wie stimmst du Werte im laufenden Spiel ab, ohne sie beim Beenden zu verlieren?
    a: |
      Der Remote-Inspektor ändert nur das laufende Spiel, die Doku sagt ausdrücklich, dass das nach dem Stoppen nicht erhalten bleibt. Zum Ausprobieren ist er gut. Was bleiben soll, ändere ich im Modus Lokal an der Szene oder der `.tres`, während das Spiel läuft; mit „Szenenänderungen synchronisieren“ kommt das sofort im Spiel an. Danach speichere ich und notiere die Änderung, eine Größe pro Runde.
    tags: [parameter, debugger, tuning]
    level: 2
  - id: level-tilemap-tileset-layer
    module: level-tilemap
    q: Was ist der Unterschied zwischen TileSet und TileMapLayer?
    a: |
      Das TileSet ist eine Ressource, die beschreibt, was eine Tile ist: Bildausschnitt, Kollision, Sortierpunkt, Terrain. Der `TileMapLayer` ist ein Node, der in jeder Zelle seines Rasters höchstens eine Tile zeigt. Mehrere Ebenen sind mehrere Layer, seit Godot 4.3 statt des veralteten `TileMap`. Das TileSet speichere ich als `.tres`, damit alle Layer und Level dasselbe benutzen und eine geänderte Kollision überall gilt.
    tags: [tilemap, grundlagen]
    level: 1
  - id: level-tilemap-y-sort
    module: level-tilemap
    q: Wie bringst du eine Figur dazu, vor und hinter hohen Tiles richtig gezeichnet zu werden?
    a: |
      Figur und Tile-Layer hängen unter einem gemeinsamen Node mit Y-Sortierung, und der Tile-Layer hat selbst `y_sort_enabled`. Godot sortiert die Tiles dann an Zellenmitte plus `y_sort_origin`, die Figur an ihrem Ursprung an den Füßen. Den Sortierpunkt einer hohen Tile lege ich auf ihren Fuß; soll die Figur hinter das Objekt treten können, liegt die Kollision nur auf der Grundfläche. Ohne `y_sort_enabled` am Layer sortiert sich der ganze Layer als ein Stück, und die Figur liegt immer davor oder dahinter.
    tags: [tilemap, y-sort, top-down]
    level: 2
  - id: level-tilemap-naehte
    module: level-tilemap
    q: Zwischen deinen Tiles erscheinen dünne farbige Linien, vor allem beim Zoomen. Woher kommen sie?
    a: |
      Der Filter mischt am Rand einer Tile Pixel aus dem Nachbarfeld im Atlas mit, wenn Godot die Tile nicht pixelgenau zeichnet, etwa mit Filter Linear und nicht ganzzahligem Zoom. Texture Padding im Atlas legt einen zusätzlichen Pixel um jede Tile und verhindert das; es ist standardmäßig an. Ich prüfe also Padding, dann Filter und Skalierung, dann ob Abstände, Trennung und Regionsgröße zum Bild passen.
    tags: [tilemap, rendering, fehlersuche]
    level: 2
  - id: level-tilemap-review
    module: level-tilemap
    q: Wie gehst du im Code-Review mit Level-Änderungen in Godot um?
    a: |
      Die gemalten Zellen speichert ein `TileMapLayer` als `tile_map_data`, binär in Base64; ein Diff davon sagt nichts. Ich commite Level-Änderungen deshalb einzeln mit einer Nachricht, die beschreibt, was gemalt wurde, und hänge bei größeren Umbauten einen Screenshot an. Das TileSet als `.tres` ist dagegen lesbar: Kollisionspolygone, Sortierpunkte und Physik-Ebenen sehe ich dort Zeile für Zeile.
    tags: [tilemap, git, praxis]
    level: 2
  - id: bildrate-simulation-zwei-takte
    module: bildrate-simulation
    q: Was ist der Unterschied zwischen _process und _physics_process?
    a: |
      `_process` läuft einmal pro gezeichnetem Bild, mit einem `delta`, das mit der Bildrate schwankt. `_physics_process` läuft in festen Physik-Ticks, standardmäßig 60 pro Sekunde, jeder mit `delta` 1/60. Bei 30 Bildern pro Sekunde laufen vor jedem Bild zwei Ticks, bei 144 mal einer, mal keiner. Bewegung mit Kollision, Frame-Zähler und Eingabepuffer gehören deshalb in `_physics_process`, die Text-Anzeige einer Debug-Ausgabe in `_process`.
    tags: [takt, physik]
    level: 1
  - id: bildrate-simulation-144hz-ruckeln
    module: bildrate-simulation
    q: Auf einem 144-Hz-Monitor wirkt die Bewegung unruhig, auf 60 Hz nicht. Woran liegt das, und was tust du?
    a: |
      Die Physik liefert 60 neue Stände pro Sekunde, der Monitor zeigt 144 Bilder. 84 davon wiederholen die Position, danach springt die Figur. Ich stelle das mit `--fixed-fps 144` nach und zähle die Ticks pro Bild. Physik-Interpolation zeichnet Zwischenstände und glättet das, zeigt aber laut Doku einen Stand ein bis zwei Ticks in der Vergangenheit, und Positionen dürfen dann nur noch im Physik-Takt gesetzt werden. Ob das Spiel sie bekommt, entscheide ich nach einem Test auf dem Zielmonitor.
    tags: [takt, interpolation]
    level: 2
  - id: bildrate-simulation-zeitlupe
    module: bildrate-simulation
    q: Bei einer schweren Szene läuft das ganze Spiel in Zeitlupe, obwohl alle Skripte mit delta rechnen. Warum?
    a: |
      Godot holt pro Bild höchstens `max_physics_steps_per_frame` Ticks nach, standardmäßig 8. Dauert ein Bild länger als 8 Ticks, also 133 ms, fallen Ticks weg, und die Spielzeit läuft langsamer als die Echtzeit. Gemessen mit Godot 4.7.2: Bei 250 ms pro Bild vergingen in 3 Sekunden nur 1,467 Sekunden Spielzeit. Die Ursache liegt also bei der Bildrate, nicht im Bewegungscode.
    tags: [takt, performance]
    level: 2
  - id: bildrate-simulation-time-scale
    module: bildrate-simulation
    q: Taugt Engine.time_scale als Pause oder für Hitstop?
    a: |
      Zum Zusehen ja, zum Anhalten nicht. `time_scale` streckt `delta`, die Zahl der Ticks pro Sekunde bleibt gleich. Code, der Ticks zählt, zählt weiter, und der Ton läuft im normalen Tempo. Bei 0.5 braucht die Figur im Testgelände 18 statt 9 Ticks bis zum Höchsttempo, `velocity` erreicht aber denselben Wert. Für Hitstop hält man gezielt die beteiligten Objekte an, für Einzelbilder nimmt man Pause und Nächster Frame.
    tags: [takt, debugging]
    level: 2
  - id: fehler-eingrenzen-methode
    module: fehler-eingrenzen
    q: Ein Kollege meldet, nach dem letzten Umbau zähle der Zähler nicht mehr. Wie gehst du vor?
    a: |
      Erst reproduzieren: Schritte aufschreiben, bis es jedes Mal passiert. Dann verkleinern, eine Vermutung notieren, genau eine Sache ändern und mit derselben Probe vergleichen. In der Ausgabe lese ich von oben, denn spätere Meldungen sind oft Folgen der ersten. Lief es gestern noch, findet `git bisect` den Commit. Wächter wie `if counter:` lehne ich ab, weil sie die Meldung entfernen, aber nicht die Ursache.
    tags: [debugging, methode]
    level: 1
  - id: fehler-eingrenzen-backtrace
    module: fehler-eingrenzen
    q: Wie liest du eine Godot-Fehlermeldung mit GDScript backtrace?
    a: |
      `[0]` ist die Zeile, an der es scheitert, darunter stehen die Aufrufer. Die Zeile `at:` zeigt in den C++-Quelltext der Engine und hilft selten. Bei „Invalid assignment … on a base object of type 'null instance'“ suche ich, wo die Variable belegt wird, meist ein `@onready`-Pfad; oft nennt eine frühere Meldung wie „Node not found“ genau diese Stelle. Den Backtrace gibt es seit 4.5 im Editor und in Debug-Exporten, in Release-Exporten nur, wenn man ihn einschaltet.
    tags: [debugging, fehlermeldungen]
    level: 2
  - id: fehler-eingrenzen-verwaiste-nodes
    module: fehler-eingrenzen
    q: Der Monitor „Verwaiste Nodes“ steigt während des Spiels. Was bedeutet das?
    a: |
      Es gibt Nodes, die in keinem Baum hängen und nie freigegeben werden, also ein Speicherleck. Typischer Fall: `remove_child()` statt `queue_free()`. Gemessen mit Godot 4.7.2 blieben pro eingesammeltem Pickup drei Nodes übrig, eins pro Node der Szene, und beim Beenden meldete Godot geleakte ObjectDB-Instanzen. `Node.print_orphan_nodes()` listet die betroffenen Nodes, der ObjectDB-Profiler vergleicht Schnappschüsse.
    tags: [debugging, speicher]
    level: 2
  - id: fehler-eingrenzen-profiler-eigen
    module: fehler-eingrenzen
    q: Im Profiler stehen _physics_process und count_tiles beide bei knapp 3 ms. Welche Funktion ist langsam?
    a: |
      Mit der Einstellung „Gesamt“ enthält die Zeit einer Funktion alles, was sie aufruft. `_physics_process` ruft `count_tiles` auf, deshalb stehen beide gleich hoch. Ich schalte auf „Eigen“: Dort fiel `_physics_process` im Test auf 0,00 ms, `count_tiles` blieb bei 2,70 ms. Die Zeit steckt also im Code von `count_tiles`. Vorher und nachher messe ich mit derselben Szene.
    tags: [debugging, profiler]
    level: 2
  - id: export-sichern-vorlagen
    module: export-sichern
    q: Der Export-Dialog meldet, es sei keine Exportvorlage unter dem erwarteten Pfad. Was ist los?
    a: |
      Eine Exportvorlage ist ein vorgebautes Godot ohne Editor, das mit der PCK des Projekts zum Spiel wird. Sie muss exakt zur Editor-Version passen; Godot sucht sie in `export_templates/4.7.2.stable/`, und der Dialog nennt den Pfad. Ich installiere sie unter *Editor → Exportvorlagen verwalten* für die nötigen Plattformen oder aus der TPZ-Datei. Vorlagen einer anderen Version helfen nicht.
    tags: [export]
    level: 1
  - id: export-sichern-debug-release
    module: export-sichern
    q: Welche Testversion schickst du Testern, Debug oder Release?
    a: |
      Meist Debug. Nur dort steht bei einem Skriptfehler der GDScript-Backtrace im Log, also die Zeile im eigenen Code. Der Release-Build meldete im Test denselben Fehler nur mit der Stelle in der Engine. Das Log liegt unter `user://logs/godot.log`, unter Linux in `~/.local/share/godot/app_userdata/<Projekt>/logs/`. Ich bette die PCK ein, damit niemand die zweite Datei vergisst, und notiere den Git-Tag der Version.
    tags: [export, debugging]
    level: 2
  - id: export-sichern-repository
    module: export-sichern
    q: Welche Dateien eines Godot-4-Projekts gehören ins Repository?
    a: |
      Alles, was sich nicht verlustfrei neu erzeugen lässt: `project.godot`, Szenen, Ressourcen, Skripte, die `.import`-Dateien mit den Import-Einstellungen, die `.uid`-Dateien seit 4.4 und `export_presets.cfg`. Nicht hinein gehören `.godot/` mit Cache, Importergebnissen und `export_credentials.cfg` sowie die Exporte. Die `.gitignore` erzeugt Godot selbst unter Projekt → Versionsverwaltung. Große Binärdateien kommen bei Bedarf in Git LFS, eingerichtet vor dem ersten Commit.
    tags: [git, export]
    level: 1
  - id: werkstatt-messen-diff-als-beleg
    module: werkstatt-messen
    q: Du übernimmst einen Prototyp, der sich nach einem Umbau anders verhält. Warum schaust du nicht zuerst in git diff?
    a: |
      Weil der Diff mir die Antwort zeigt, aber nicht, wie ich das Symptom im Editor finde, und bei einem Kunden-Projekt gibt es oft keinen sauberen letzten Stand. Ich beschreibe das Symptom ohne Vermutung, prüfe gezielt die Stellen, an denen es entstehen kann, und bestätige die Ursache erst dann im Diff gegen den letzten guten Commit. Jede Korrektur bekommt einen Eintrag mit Symptom, Ursache und Beleg und einen eigenen Commit.
    tags: [debugging, methode]
    level: 3
