lesson: |
  Du willst eine zweite Fußform für die Figur und duplizierst im Szenen-Dock den Node `Feet`. Dann ziehst du die neue Form breiter, und die alte wird mit breiter. An einem anderen Tag zählt `Pickup2` drei Punkte, obwohl in `pickup.gd` und in `pickup.tscn` etwas anderes steht. Beides folgt aus zwei Regeln. Eine Instanz speichert nur, worin sie von ihrer Vorlage abweicht. Und Ressourcen werden geteilt, nicht kopiert, bis du ausdrücklich eine Kopie verlangst.

  Die Beispiele stammen aus dem Testgelände: `pickup.tscn` ist dreimal in `main.tscn` eingesetzt, `player.tscn` einmal. Wie du Bäume und `.tscn`-Dateien liest, steht in [Szenenbäume lesen](/godot/szenenbaum). Alle Ausgaben stammen aus Läufen mit Godot 4.7.2.

  ## Szene als Vorlage, Instanz als Verwendung

  `pickup.tscn` beschreibt ein Sammelstück: ein `Area2D` mit Skript, einen `Polygon2D` als Körper und eine kreisförmige Kollisionsform. `main.tscn` setzt diese Szene dreimal ein. Jede Verwendung heißt **Instanz**. Änderst du die Vorlage und speicherst, sehen alle Instanzen die Änderung. Änderst du eine Instanz im Inspektor, gilt das nur für sie ([Creating instances](https://docs.godotengine.org/en/stable/getting_started/step_by_step/instancing.html#editing-scenes-and-instances)).

  Aus dem Web kennst du das: Eine Komponente wird einmal definiert und mehrfach verwendet, mit eigenen Props je Verwendung. Der Unterschied: In Godot ist die Abweichung ein gespeicherter Wert in der Eltern-Szene, kein Argument, das zur Laufzeit übergeben wird. Und du kannst mit Bearbeitbare Kinder sogar in die Kinder einer Instanz hineingreifen. In einer Komponentenbibliothek wäre das ein Bruch der Kapselung.

  ## Overrides: nur die Abweichung steht in der Eltern-Szene

  Setzt du im Inspektor `Value` von `Pickup2` auf 3, erscheint daneben der Zurücksetzen-Pfeil:

  ![Inspektor von Pickup2 in main.tscn: Value 3 mit Zurücksetzen-Pfeil, unter Transform die Position −70, 30 ebenfalls mit Pfeil](/media/godot/instanzen-ressourcen/instanz-override@2x.png "Godot 4.7.2, Inspektor der Instanz Pickup2 in main.tscn")

  Bei einer Instanz heißt der Pfeil: Dieser Wert weicht von der Vorlage ab. `Position` trägt ihn auch, denn in `pickup.tscn` steht das Sammelstück bei (0, 0). In `main.tscn` speichert der Editor genau diese zwei Abweichungen, sonst nichts:

  ```ini title=main.tscn
  [node name="Pickup2" parent="Objects" unique_id=969255857 instance=ExtResource("3")]
  position = Vector2(-70, 30)
  value = 3
  ```

  Ein solcher Wert heißt **Override**. Ein Klick auf den Pfeil setzt ihn auf den Wert der Vorlage zurück, und beim Speichern verschwindet die Zeile. Laut Doku überschreibt eine Änderung an der Instanz immer den Wert der Vorlage ([Creating instances](https://docs.godotengine.org/en/stable/getting_started/step_by_step/instancing.html#editing-scenes-and-instances)).

  **Welcher Wert gilt?** Ein Wert kann an drei Stellen gespeichert sein. In diesem Versuch steht in `pickup.gd` `@export var value := 1`, in `pickup.tscn` steht `value = 5` am Wurzel-Node, und `main.tscn` hat für `Pickup2` den Override `value = 3`:

  ```gdscript
  for n in ["Pickup", "Pickup2", "Pickup3"]:
  	print(n, " ", main.get_node("Objects/" + n).value)
  ```

  ```text
  Pickup 5
  Pickup2 3
  Pickup3 5
  ```

  1. **Standard im Skript** (`:= 1`): gilt für alles, was den Wert nirgends speichert.
  2. **Wert in der Vorlage** `pickup.tscn` (`value = 5`): gilt für alle Instanzen ohne eigenen Override.
  3. **Override in `main.tscn`** (`value = 3`): gilt nur für `Pickup2`.
  4. **Zuweisung im Code**, etwa in `_ready()`: gilt ab diesem Moment, nach dem Laden.

  Jede Stufe überschreibt die vorige. Für dich als Abstimmenden heißt das: Änderst du die Vorlage, erreicht die Änderung nur Instanzen ohne eigenen Override für diese Eigenschaft. Willst du wissen, wo ein Wert herkommt, folg den Pfeilen: Instanz, dann Vorlage, dann Skript.

  > [!WARNING] Zeilenreihenfolge
  > Eigenschaften eines Skripts gelten erst, wenn das Skript am Node hängt. Mit 4.7.2 geprüft: Steht in `pickup.tscn` die Zeile `value = 5` über `script = ExtResource("1")`, ignoriert Godot sie ohne Meldung, und alle Sammelstücke zählen 1. Der Editor schreibt `script` immer vor die Skript-Variablen; das Problem entsteht nur, wenn jemand die Datei von Hand bearbeitet.

  ## Bearbeitbare Kinder, Lokal machen und geerbte Szenen

  Ein Rechtsklick auf eine Instanz im Szenen-Dock bietet zwei Wege an, über die Vorlage hinauszugehen: *Bearbeitbare Kinder* und *Lokal machen*. Den dritten, die geerbte Szene, findest du im Menü *Szene*.

  ![Kontextmenü einer Instanz im Szenen-Dock: Branch als Szene speichern, Lokal machen, Bearbeitbare Kinder, Als Platzhalter laden, Node-Pfad kopieren, Über einzigartigen Namen zugreifen, Im Editor öffnen](/media/godot/instanzen-ressourcen/kontextmenue-instanz@2x.png "Godot 4.7.2, Rechtsklick auf Pickup2 im Szenen-Dock")

  **Bearbeitbare Kinder** (Editable Children) klappt die Instanz im Szenen-Dock auf. Ihre Kinder erscheinen hervorgehoben, und du kannst ihre Eigenschaften überschreiben. Die Verbindung zur Vorlage bleibt. In `main.tscn` steht danach am Ende `[editable path="Objects/Pickup2"]`, und jede Änderung an einem Kind als eigener Abschnitt wie `[node name="Area" parent="Objects/Pickup2" index="1"]`.

  ![Szenen-Dock mit aufgeklapptem Pickup2: darunter Body und Area farbig hervorgehoben, Area ist gewählt](/media/godot/instanzen-ressourcen/bearbeitbare-kinder@2x.png "Godot 4.7.2, Pickup2 mit Bearbeitbare Kinder")

  **Lokal machen** (Make Local) löst die Instanz auf. Mit 4.7.2 nachgestellt an `Pickup3`: `main.tscn` enthält danach `Pickup3` als gewöhnliches `Area2D` mit allen Eigenschaften, seine Kinder, eine eigene Kopie der Kreisform als `[sub_resource]` und eine eigene `[connection]` für `body_entered`. Spätere Änderungen an `pickup.tscn` erreichen `Pickup3` nicht mehr.

  **Geerbte Szene** (Inherited Scene): *Szene → Neue geerbte Szene …* (Strg + Umschalt + N) legt eine neue Szene an, deren Wurzel eine Instanz der Basis ist. Das Ergebnis, mit `value = 5` gespeichert als `pickup_big.tscn`:

  ```ini
  [gd_scene format=3 uid="uid://cdm4ofg4ec7r5"]

  [ext_resource type="PackedScene" uid="uid://cjjikuxf00l3x" path="res://pickup.tscn" id="1_3j0kj"]

  [node name="Pickup" unique_id=1372740206 instance=ExtResource("1_3j0kj")]
  value = 5
  ```

  Die Wurzel hat kein `type`, sondern `instance=`. Alles andere erbt sie von `pickup.tscn`, und Änderungen an der Basis kommen weiter an. Das ähnelt einer Unterklasse: Basis plus eigene Abweichungen.

  - **Override an der Instanz**: Die Verbindung zur Vorlage bleibt. Anlass: Eine Verwendung braucht einen anderen Wert.
  - **Bearbeitbare Kinder**: Die Verbindung bleibt. Anlass: Eine Verwendung braucht eine Änderung an einem Kind.
  - **Geerbte Szene**: Die Verbindung bleibt. Anlass: eine Variante, die du an mehreren Stellen einsetzt.
  - **Lokal machen**: Die Verbindung ist weg. Anlass: ein Einzelstück, das sich von der Vorlage lösen soll.

  Welche Varianten dein Spiel braucht, entscheidest du. Wichtig ist, dass du in einer fremden Szene erkennst, welcher Weg gewählt wurde: Override-Zeilen unter `instance=`, `[editable path=…]`, eine Wurzel mit `instance=` oder ein Node ohne Instanz, der aussieht wie eine Kopie.

  ## Ressourcen: Daten, die geteilt werden

  Eine **Ressource** ist ein Datenobjekt: eine Textur, ein Ton, eine Kollisionsform, eine Animation oder eine eigene Klasse wie `MovementStats`. Nodes halten Verweise auf Ressourcen. Lädt Godot eine Ressource von der Festplatte, tut es das nur einmal; jeder weitere `load()` liefert dasselbe Objekt ([Resources](https://docs.godotengine.org/en/stable/tutorials/scripting/resources.html)). Eine Ressource steht entweder in einer eigenen Datei (`.tres`, binär `.res`) oder steckt als `[sub_resource]` in der Szene. Die Kreisform des Sammelstücks steckt in `pickup.tscn`.

  Alle Instanzen einer Szene teilen ihre Unter-Ressourcen. Mit 4.7.2 gemessen, im laufenden Testgelände:

  ```gdscript
  var a: CollisionShape2D = main.get_node("Objects/Pickup/Area")
  var b: CollisionShape2D = main.get_node("Objects/Pickup2/Area")
  print(a.shape == b.shape)
  a.shape.radius = 10.0
  print(b.shape.radius)
  ```

  ```text
  true
  10.0
  ```

  Für JavaScript-Entwickler ist das vertraut: `const b = a; b.radius = 10` ändert auch `a.radius`, weil beide auf dasselbe Objekt zeigen. Eine Kopie verlangst du ausdrücklich, dort etwa mit `{ ...a }`, in Godot mit `duplicate()`. Beide kopieren flach: Was im Objekt steckt, bleibt geteilt.

  **Im Editor** zeigt Godot seit 4.6 ein Kettensymbol vor Ressourcen, die nicht nur diesem Node gehören. Der Tooltip sagt, warum: „… wird in 2 Orten verwendet“ heißt geteilt, „… ist extern für die Szene“ heißt, sie kommt aus einer eigenen Datei oder aus der Vorlage einer Instanz. Duplizierst du einen Node mit einer Form, teilen sich Original und Kopie dieselbe Form; das beschreibt auch die Doku ([Inspector Dock](https://docs.godotengine.org/en/stable/tutorials/editor/inspector_dock.html)). Nachgestellt in `pickup.tscn` mit `Area` und Strg + D:

  ![Inspektor von Area2, der Kopie von Area: Im Feld Shape steht ein Kettensymbol vor „Circle“](/media/godot/instanzen-ressourcen/geteilte-form@2x.png "Godot 4.7.2, Tooltip des Kettensymbols: „CircleShape2D wird in 2 Orten verwendet. Linksklick, um es einzigartig zu machen.“")

  Klappst du dagegen mit Bearbeitbare Kinder die Form einer Instanz auf, gehört sie der Vorlage. Der Inspektor meldet „Dieses Objekt ist nur lesbar.“, der Tooltip des Kettensymbols nennt sie „extern für die Szene“. Ändern kannst du sie erst, wenn du sie für diese Instanz einzigartig machst.

  ## Einzigartig machen, `resource_local_to_scene` und `duplicate()`

  Drei Wege trennen eine geteilte Ressource:

  - **Einzigartig machen** (Make Unique): ein Klick auf das Kettensymbol oder der Eintrag im Menü des Ressourcenfelds. Der Node bekommt eine eigene Kopie, im Editor, beim Bearbeiten. Mit 4.7.2 an `Pickup2/Area` nachgestellt, steht danach in `main.tscn` eine neue `[sub_resource type="CircleShape2D" id="CircleShape2D_1bvp3"]` und ein Abschnitt `[node name="Area" parent="Objects/Pickup2" index="1"]` mit `shape = SubResource("CircleShape2D_1bvp3")`. Das Werkzeugmenü des Inspektors hat dazu *Unter-Ressourcen einzigartig machen* für alle Ressourcen eines Nodes.
  - **`resource_local_to_scene`**: eine Eigenschaft der Ressource, im Inspektor unter *Resource*. Ist sie an, bekommt jede Instanz der Szene beim Erzeugen ihre eigene Kopie ([resource_local_to_scene](https://docs.godotengine.org/en/stable/classes/class_resource.html#class-resource-property-resource-local-to-scene)). In der Datei steht dann `resource_local_to_scene = true` unter der `[sub_resource]`. Mit 4.7.2 geprüft: Die Formen der drei Sammelstücke sind dann drei Objekte, und ein Radius von 10 an `Pickup` lässt `Pickup2` bei 5.
  - **`duplicate()`** im Code, zur Laufzeit: `$Area.shape = $Area.shape.duplicate()` gibt diesem Node eine Kopie, bevor er sie ändert ([Resource.duplicate](https://docs.godotengine.org/en/stable/classes/class_resource.html#class-resource-method-duplicate)).

  > [!DEEP] Tiefe Kopien
  > `duplicate()` kopiert die Ressource, verschachtelte Ressourcen darin bleiben geteilt. `duplicate(true)` kopiert seit Godot 4.5 nur Ressourcen, die in derselben Datei stecken; wer auch verwiesene Dateien kopieren will, nimmt `duplicate_deep(Resource.DEEP_DUPLICATE_ALL)` ([Upgrading to Godot 4.5](https://docs.godotengine.org/en/stable/tutorials/migrating/upgrading_to_godot_4.5.html#core)). Für eine Kollisionsform ohne verschachtelte Ressourcen reicht `duplicate()`.

  Welcher Weg passt, hängt davon ab, wann die Trennung gebraucht wird. Soll eine Instanz dauerhaft anders aussehen, machst du die Ressource im Editor einzigartig. Ändert der Code jede Instanz einzeln zur Laufzeit, passt `resource_local_to_scene` oder `duplicate()` vor der Änderung.

  ## Eigene Ressource als Werte-Container: `MovementStats`

  Geteilte Ressourcen sind kein Unfall, sondern oft genau das Ziel. Das Testgelände legt die Bewegungswerte der Figur in eine eigene Ressourcenklasse, `movement_stats.gd` ([Creating your own resources](https://docs.godotengine.org/en/stable/tutorials/scripting/resources.html#creating-your-own-resources)):

  ```gdscript
  class_name MovementStats
  extends Resource

  ## Bewegungswerte der Figur. Platzhalter: Die echten Werte bestimmst du.

  @export_range(0, 400, 1, "suffix:px/s") var max_speed := 90.0
  @export_range(0, 5000, 10, "suffix:px/s²") var acceleration := 600.0
  @export_range(0, 5000, 10, "suffix:px/s²") var friction := 900.0
  ```

  Die Werte liegen in `data/player_stats.tres`, und `player.tscn` verweist mit `stats = ExtResource("2")` darauf. Mit 4.7.2 geprüft: `stats` der Figur ist dasselbe Objekt, das `load("res://data/player_stats.tres")` liefert. Setzt du später mehrere Figuren desselben Typs ein, teilen sie diese Werte, und eine Änderung im Inspektor gilt für alle. Für einen zweiten Typ legst du eine zweite `.tres` mit demselben Skript an. Willst du zur Laufzeit nur eine Figur verändern, gib ihr vorher mit `duplicate()` eine eigene Kopie.

  Warum eine eigene Ressource statt `@export`-Variablen direkt in `player.gd`? Regler und einzeilige Diffs gäbe es dort auch. Der Unterschied: Die Werte stehen in einer eigenen Datei, getrennt von Code und Szene. Mehrere Szenen können dieselbe Datei nutzen, und eine Szene bekommt andere Werte, ohne dass sich ihr Code ändert: Du ziehst eine zweite `.tres` in das Feld `Stats`. Wie du sie abstimmst, behandelt das [Modul zu Eingabeaktionen und Parametern](/godot/aktionen-parameter), die Methode dazu das [Tuning-Modul im Combat-Kurs](/combat/tuning).

  > [!PRAXIS]
  > Wenn ein Agent einen neuen Gegnertyp anlegt, frag nach der Datenhaltung: Welche Werte teilen alle Gegner dieses Typs (eine `.tres`), welche weichen je Platzierung ab (Override an der Instanz), und welche ändern sich im Spiel (Variable im Skript, keine Ressource)? Prüf danach die Kettensymbole im Inspektor und lies ihre Tooltips: Sie sagen, ob eine Ressource geteilt wird oder aus einer Datei kommt.

  > [!INTERVIEW]
  > „Ein Designer ändert die Lebenspunkte eines einzelnen Gegners im Level, und plötzlich haben alle Gegner im Spiel den neuen Wert. Was ist passiert?“ Gute Antwort: Die Werte liegen in einer Ressource, die alle Gegner teilen, und er hat die Ressource geändert statt der Instanz. Ich zeige ihm das Kettensymbol im Inspektor. Soll nur dieser Gegner abweichen, macht er die Ressource für ihn einzigartig oder setzt einen Override auf eine Eigenschaft der Instanz. Soll sie sich zur Laufzeit je Gegner ändern, braucht der Code `duplicate()` oder `resource_local_to_scene`.

  ## Häufige Fehler

  - **Node dupliziert, Form geteilt.** Original und Kopie ändern sich gemeinsam. Kettensymbol prüfen, Form einzigartig machen.
  - **Geteilte Ressource im Code geändert.** Ein Sammelstück wächst, alle wachsen mit. Erst `duplicate()`, dann ändern.
  - **Vorlage geändert, eine Instanz bleibt anders.** Sie hat einen Override für diese Eigenschaft. Der Pfeil im Inspektor zeigt ihn, ein Klick entfernt ihn.
  - **Standard im Skript geändert, nichts passiert.** Vorlage oder Instanz speichern einen eigenen Wert, der den Standard überschreibt.
  - **Lokal gemacht und vergessen.** Die Kopie folgt der Vorlage nicht mehr. Im Szenen-Dock fehlt die Filmklappe.
  - **Skript-Variable vor `script =` geschrieben.** In von Hand bearbeiteten Szenen wird der Wert ohne Meldung ignoriert.
  - **Gemeinsame `.tres` für zwei Typen.** Die Werte des einen ändern den anderen. Jeder Typ bekommt seine eigene Datei.

  ## Zusammenfassung

  - Eine Szene ist eine Vorlage, jede Verwendung eine Instanz. Änderungen an der Vorlage erreichen alle Instanzen ohne eigenen Override.
  - Die Eltern-Szene speichert nur die Abweichungen einer Instanz. Der Zurücksetzen-Pfeil zeigt sie im Inspektor.
  - Es gilt: Skript-Standard, dann Vorlage, dann Override, dann Code zur Laufzeit.
  - Bearbeitbare Kinder und geerbte Szenen behalten die Verbindung zur Vorlage, Lokal machen kappt sie.
  - Ressourcen sind geteilte Datenobjekte. Alle Instanzen einer Szene teilen ihre Unter-Ressourcen, ein duplizierter Node teilt seine Formen mit dem Original.
  - Getrennt wird mit Einzigartig machen im Editor, `resource_local_to_scene` je Instanz oder `duplicate()` im Code.
  - Eine eigene Ressource wie `MovementStats` bündelt Werte, die mehrere Nodes absichtlich teilen.
exercises:
  - id: wo-steht-der-override
    type: choice
    title: Wo landet die Änderung?
    prompt: |
      Du wählst in `main.tscn` die Instanz `Pickup2` und setzt im Inspektor `Value` von 1 auf 3. Dann speicherst du. Welche Aussagen stimmen?
    options:
      - text: In `main.tscn` steht unter dem Abschnitt von `Pickup2` die Zeile `value = 3`.
        correct: true
        why: Die Eltern-Szene speichert die Abweichungen ihrer Instanzen als Overrides.
      - text: "`pickup.tscn` und `pickup.gd` bleiben unverändert."
        correct: true
        why: Die Änderung gilt nur für diese Instanz, die Vorlage und das Skript fasst der Editor nicht an.
      - text: Auch `Pickup` und `Pickup3` zählen jetzt 3.
        correct: false
        why: Overrides gelten nur für die Instanz, an der sie stehen. Die anderen behalten den Wert der Vorlage.
      - text: Neben `Value` erscheint kein Pfeil, weil 3 ein gültiger Wert ist.
        correct: false
        why: Der Pfeil zeigt jede Abweichung von der Vorlage an, egal ob der Wert gültig ist.
    explanation: |
      Eine Instanz speichert ihre Abweichungen in der Szene, in der sie steht. Deshalb ist `main.tscn` die einzige geänderte Datei, mit einer neuen Zeile unter `Pickup2`. Der Zurücksetzen-Pfeil im Inspektor macht den Override sichtbar, ein Klick darauf entfernt ihn wieder.
    resources:
      - title: Godot Docs · Creating instances · Editing scenes and instances
        url: https://docs.godotengine.org/en/stable/getting_started/step_by_step/instancing.html#editing-scenes-and-instances

  - id: nur-lesbar-deuten
    type: choice
    title: Was sagt dir dieser Inspektor?
    prompt: |
      Du hast an `Pickup2` *Bearbeitbare Kinder* eingeschaltet, `Area` gewählt und die Form angeklickt, um ihren Radius zu ändern. Der Inspektor zeigt das:

      ![Inspektor einer CircleShape2D mit dem Hinweis „Dieses Objekt ist nur lesbar.“; Radius 5.0 px ist ausgegraut](/media/godot/instanzen-ressourcen/nur-lesbar@2x.png "Godot 4.7.2, Form von Pickup2/Area mit Bearbeitbare Kinder")

      Was folgt daraus?
    options:
      - text: Die Form gehört der Vorlage `pickup.tscn`. Um sie nur für `Pickup2` zu ändern, machst du sie zuerst einzigartig.
        correct: true
        why: Der Tooltip des Kettensymbols nennt sie „extern für die Szene“. Einzigartig machen legt eine eigene Kopie in `main.tscn` an.
      - text: Die Form ist kaputt und muss neu angelegt werden.
        correct: false
        why: Sie funktioniert. Sie gehört nur nicht der Szene, die du gerade bearbeitest.
      - text: Du musst `pickup.tscn` als Text bearbeiten, um den Radius nur für `Pickup2` zu ändern.
        correct: false
        why: Eine Änderung in `pickup.tscn` träfe alle drei Sammelstücke, nicht nur `Pickup2`.
    explanation: |
      Die Unter-Ressourcen einer Instanz gehören der Vorlage. Würde der Editor sie hier ändern lassen, träfe es alle Instanzen, und gespeichert würde die Änderung trotzdem nirgends, weil `main.tscn` die Form nicht besitzt. Deshalb sperrt er sie. Einzigartig machen erzeugt eine eigene Form für diese Instanz; danach steht sie als `[sub_resource]` in `main.tscn`. Gesehen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Inspector Dock
        url: https://docs.godotengine.org/en/stable/tutorials/editor/inspector_dock.html

  - id: wer-gewinnt
    type: order
    title: Wer hat das letzte Wort?
    prompt: |
      Ordne die Stellen, an denen `value` eines Sammelstücks gesetzt werden kann, vom schwächsten zum stärksten. Die unterste gewinnt.
    lang: prose
    lines: |
      Standardwert im Skript, `@export var value := 1`
      Wert am Wurzel-Node der Vorlage `pickup.tscn`
      Override an der Instanz in `main.tscn`
      Zuweisung im Code in `_ready()`
    explanation: |
      Beim Laden setzt Godot zuerst den Standard aus dem Skript, dann die Werte der Vorlage, dann die Overrides der Eltern-Szene. Danach läuft `_ready()`, und eine Zuweisung dort überschreibt alles Gespeicherte. Mit 4.7.2 geprüft: Standard 1, Vorlage 5, Override 3 an `Pickup2` und `value = 7` in `_ready()` von `Pickup3` ergeben 5, 3 und 7.
    resources:
      - title: Godot Docs · Creating instances
        url: https://docs.godotengine.org/en/stable/getting_started/step_by_step/instancing.html#editing-scenes-and-instances

  - id: werte-vorhersagen
    type: output
    title: Drei Sammelstücke, drei Quellen
    prompt: |
      `pickup.gd` hat `@export var value := 1`. In `pickup.tscn` steht am Wurzel-Node `value = 6` (nach der `script`-Zeile). In `main.tscn` hat `Pickup` den Override `value = 1` und `Pickup3` den Override `value = 2`; `Pickup2` hat keinen. Was gibt die Schleife aus?
    lang: gdscript
    code: |
      for n in ["Pickup", "Pickup2", "Pickup3"]:
      	print(n, " ", main.get_node("Objects/" + n).value)
    expected: |
      Pickup 1
      Pickup2 6
      Pickup3 2
    hints:
      - Wer keinen eigenen Override hat, nimmt den Wert der Vorlage.
      - Ein Override darf denselben Wert haben wie der Standard im Skript.
    explanation: |
      `Pickup2` hat keinen Override und nimmt die 6 aus der Vorlage; der Standard 1 aus dem Skript kommt nicht zum Zug, weil die Vorlage einen Wert speichert. `Pickup` und `Pickup3` haben Overrides. Der Override 1 an `Pickup` ist gleich dem Skript-Standard und trotzdem nötig: Ohne ihn gälte die 6 der Vorlage. Mit 4.7.2 geprüft, auch dass der Editor diesen Override als `value = 1` in `main.tscn` speichert.
    resources:
      - title: Godot Docs · Creating instances
        url: https://docs.godotengine.org/en/stable/getting_started/step_by_step/instancing.html

  - id: geteilte-form-vorhersagen
    type: output
    title: Ein Radius für alle?
    prompt: |
      Im laufenden Testgelände führt ein Skript diese Zeilen aus. In `pickup.tscn` hat die Kreisform den Radius 5. Was steht in der Ausgabe?
    lang: gdscript
    code: |
      var a: CollisionShape2D = main.get_node("Objects/Pickup/Area")
      var b: CollisionShape2D = main.get_node("Objects/Pickup2/Area")
      var c: CollisionShape2D = main.get_node("Objects/Pickup3/Area")
      a.shape.radius = 10.0
      print(b.shape.radius)
      c.shape = c.shape.duplicate()
      c.shape.radius = 3.0
      print(a.shape.radius, " ", c.shape.radius)
    expected: |
      10.0
      10.0 3.0
    hints:
      - Wie viele Kreisformen gibt es nach dem Laden, eine oder drei?
      - "`duplicate()` gibt nur `c` eine eigene Form."
    explanation: |
      Alle drei Instanzen teilen die eine Kreisform aus `pickup.tscn`. Der Radius 10 an `a` ist deshalb auch der von `b`. Danach bekommt `c` eine eigene Kopie, und ihr Radius 3 ändert nur `c`; `a` und `b` bleiben bei 10. Gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Resource.duplicate
        url: https://docs.godotengine.org/en/stable/classes/class_resource.html#class-resource-method-duplicate

  - id: lokal-zur-szene-vorhersagen
    type: output
    title: Eine Zeile mehr in der Vorlage
    prompt: |
      Jetzt steht in `pickup.tscn` unter der Kreisform `resource_local_to_scene = true`. Was gibt dasselbe Testskript aus?

      ```ini
      [sub_resource type="CircleShape2D" id="area"]
      resource_local_to_scene = true
      radius = 5.0
      ```
    lang: gdscript
    code: |
      var a: CollisionShape2D = main.get_node("Objects/Pickup/Area")
      var b: CollisionShape2D = main.get_node("Objects/Pickup2/Area")
      print(a.shape == b.shape)
      a.shape.radius = 10.0
      print(b.shape.radius)
    expected: |
      false
      5.0
    hints:
      - "`resource_local_to_scene` kopiert die Ressource für jede Instanz beim Erzeugen."
    explanation: |
      Mit `resource_local_to_scene` legt Godot beim Instanziieren für jede Instanz eine eigene Kopie an. Die beiden Formen sind verschiedene Objekte, `==` vergleicht hier die Identität und liefert `false`. Der Radius von `b` bleibt bei 5. Gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Resource.resource_local_to_scene
        url: https://docs.godotengine.org/en/stable/classes/class_resource.html#class-resource-property-resource-local-to-scene

  - id: override-zeilen
    type: gap
    title: Override und bearbeitbare Kinder im Text
    prompt: |
      Ergänze `main.tscn` so, dass `Pickup2` 3 Punkte zählt und seine Kinder im Editor bearbeitbar sind.
    lang: ini
    code: |
      [node name="Pickup2" parent="Objects" instance=ExtResource("3")]
      position = Vector2(-70, 30)
      ⟦value⟧ = ⟦3⟧

      [⟦editable⟧ path="⟦Objects/Pickup2⟧"]
    gaps:
      - label: Eigenschaft
        hint: Der Name der Variablen in `pickup.gd`.
      - label: Wert
        hint: Die Punktzahl dieser Instanz.
      - label: Art des Abschnitts
        hint: So heißt der Abschnitt, den Bearbeitbare Kinder schreibt.
      - label: Pfad der Instanz
        hint: Ab der Wurzel, ohne deren Namen.
    explanation: |
      Ein Override ist eine gewöhnliche Eigenschaftszeile unter dem Abschnitt der Instanz, mit dem Namen aus dem Skript. Bearbeitbare Kinder schreibt einen eigenen Abschnitt `[editable path="…"]` am Ende der Datei, mit dem Pfad der Instanz nach derselben Regel wie `parent`. So hat es der Editor in 4.7.2 gespeichert.
    resources:
      - title: Godot Docs · TSCN file format · The scene tree
        url: https://docs.godotengine.org/en/stable/engine_details/file_formats/tscn.html#the-scene-tree

  - id: kopie-im-code
    type: gap
    title: Erst kopieren, dann ändern
    prompt: |
      Ergänze die Lücken: Das Sammelstück soll eine eigene Form bekommen, bevor es sie vergrößert, und die Figur soll ihre Werte aus einer Ressource der Klasse beziehen, die `movement_stats.gd` mit `class_name` registriert.
    lang: gdscript
    code: |
      # pickup.gd
      func grow() -> void:
      	$Area.shape = $Area.shape.⟦duplicate()⟧
      	$Area.shape.radius = 9.0

      # player.gd
      @export var stats: ⟦MovementStats⟧
    gaps:
      - label: Kopie anlegen
        hint: Die Methode von `Resource`, die eine Kopie liefert.
        accept:
          - duplicate(false)
          - duplicate(true)
      - label: Typ der Ressource
        hint: Der `class_name` aus `movement_stats.gd`.
    explanation: |
      `duplicate()` liefert eine neue Form mit denselben Werten; erst nach der Zuweisung gehört sie diesem Node allein, und der neue Radius trifft die anderen Sammelstücke nicht. `@export var stats: MovementStats` macht ein Ressourcenfeld im Inspektor, das nur Ressourcen dieser Klasse annimmt. `class_name` macht die Klasse im ganzen Projekt unter diesem Namen bekannt.
    resources:
      - title: Godot Docs · Resource.duplicate
        url: https://docs.godotengine.org/en/stable/classes/class_resource.html#class-resource-method-duplicate
      - title: Godot Docs · Creating your own resources
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/resources.html#creating-your-own-resources

  - id: alle-werden-gross
    type: bug
    title: Ein großes Sammelstück, drei große Sammelstücke
    prompt: |
      Ein Agent hat `pickup.gd` um ein großes Sammelstück erweitert. Nur `Pickup3` hat im Inspektor `Big` an. Trotzdem haben alle drei Sammelstücke den Radius 9. Finde die Zeile und korrigiere sie.
    lang: gdscript
    code: |
      @export var value := 1
      @export var big := false


      func _ready() -> void:
      	if big:
      		var shape: CircleShape2D = $Area.shape
      		shape.radius = 9.0
      		$Area.shape = shape
    lines: [7]
    fix:
      - line: 7
        answers:
          - "var shape: CircleShape2D = $Area.shape.duplicate()"
          - "var shape := $Area.shape.duplicate() as CircleShape2D"
          - "var shape: CircleShape2D = $Area.shape.duplicate(true)"
          - "var shape: CircleShape2D = get_node(\"Area\").shape.duplicate()"
          - "var shape = $Area.shape.duplicate()"
          - "var shape: CircleShape2D = $Area.shape.duplicate(false)"
    explanation: |
      `var shape = $Area.shape` holt keine Kopie, sondern einen zweiten Verweis auf dieselbe Form, die alle Instanzen teilen. Das Zurückschreiben in der letzten Zeile ändert daran nichts. Erst `duplicate()` erzeugt eine eigene Form für dieses Sammelstück. Mit 4.7.2 gemessen: ohne Korrektur Radius 9, 9 und 9, mit Korrektur 5, 5 und 9.
    resources:
      - title: Godot Docs · Resource.duplicate
        url: https://docs.godotengine.org/en/stable/classes/class_resource.html#class-resource-method-duplicate

  - id: wert-wird-ignoriert
    type: bug
    title: Der Wert steht da und wirkt nicht
    prompt: |
      Ein Agent hat in `pickup.tscn` von Hand eingetragen, dass ein Sammelstück 5 Punkte zählt. Das Spiel startet ohne Meldung, aber jedes Sammelstück zählt 1. In `main.tscn` gibt es keine Overrides für `value`. Finde die Zeile, die nicht wirkt.
    lang: ini
    code: |
      [node name="Pickup" type="Area2D"]
      collision_layer = 4
      collision_mask = 2
      value = 5
      monitorable = false
      script = ExtResource("1")

      [node name="Body" type="Polygon2D" parent="."]
    lines: [4]
    hints:
      - "`value` ist keine Eigenschaft von `Area2D`. Woher kommt sie?"
    explanation: |
      `value` gibt es erst, wenn `pickup.gd` am Node hängt, und das passiert in Zeile 6. Godot setzt die Eigenschaften in der Reihenfolge der Datei; in Zeile 4 hat der Node noch kein Skript, und der Wert verpufft ohne Meldung. Gehört `value = 5` unter `script = ExtResource("1")`, zählt jedes Sammelstück 5. Der Editor schreibt die Reihenfolge immer richtig, der Fehler entsteht nur beim Bearbeiten von Hand. Mit 4.7.2 nachgestellt.
    resources:
      - title: Godot Docs · TSCN file format · Entries inside the file
        url: https://docs.godotengine.org/en/stable/engine_details/file_formats/tscn.html#entries-inside-the-file

  - id: stats-geteilt
    type: bug
    title: Der Gegner bremst die Figur
    prompt: |
      Ein Agent hat einen Gegner angelegt. Stellst du im Inspektor des Gegners `Max Speed` niedriger, läuft auch deine Figur langsamer. Finde die Zeile in `enemy.tscn` und korrigiere sie so, dass der Gegner `data/enemy_stats.tres` nutzt. Die Datei gibt es schon.
    lang: ini
    code: |
      [gd_scene format=3]

      [ext_resource type="Script" path="res://enemy.gd" id="1"]
      [ext_resource type="Resource" path="res://data/player_stats.tres" id="2"]

      [node name="Enemy" type="CharacterBody2D"]
      script = ExtResource("1")
      stats = ExtResource("2")
    lines: [4]
    fix:
      - line: 4
        answers:
          - '[ext_resource type="Resource" path="res://data/enemy_stats.tres" id="2"]'
    explanation: |
      Beide Szenen verweisen auf dieselbe Datei, und Godot lädt eine Ressource nur einmal: Figur und Gegner halten dasselbe Objekt. Im Inspektor des Gegners bearbeitest du also das Objekt aus `player_stats.tres` und änderst die Werte der Figur mit. Die `[ext_resource]`-Zeile verrät es auf einen Blick. Jeder Figurentyp bekommt seine eigene `.tres` mit demselben Skript.
    resources:
      - title: Godot Docs · Resources
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/resources.html

  - id: einzigartig-erklaeren
    type: explain
    title: Was Einzigartig machen gespeichert hat
    prompt: |
      Nach *Bearbeitbare Kinder* an `Pickup2`, *Einzigartig machen* an seiner Form und Radius 9 steht das in `main.tscn` (Ausschnitt). Erkläre in drei bis fünf Sätzen, was die vier Abschnitte bedeuten und warum `pickup.tscn` unverändert bleibt.
    lang: ini
    code: |
      [sub_resource type="CircleShape2D" id="CircleShape2D_1bvp3"]
      radius = 9.0

      [node name="Pickup2" parent="Objects" instance=ExtResource("3")]
      position = Vector2(-70, 30)

      [node name="Area" parent="Objects/Pickup2" index="1"]
      shape = SubResource("CircleShape2D_1bvp3")

      [editable path="Objects/Pickup2"]
    points:
      - Die neue `[sub_resource]` ist die Kopie der Form, sie gehört `main.tscn`; `radius = 9.0` steht dort, weil 9 vom Standard der Klasse (10) abweicht.
      - "Der Abschnitt `[node name=\"Area\" parent=\"Objects/Pickup2\" …]` ist ein Override am Kind der Instanz: Er ersetzt dort die Form."
      - "`[editable path=…]` merkt sich, dass die Kinder von `Pickup2` im Editor aufgeklappt und überschreibbar sind."
      - "`pickup.tscn` bleibt unverändert, `Pickup` und `Pickup3` teilen weiter die Form der Vorlage mit Radius 5."
    explanation: |
      Einzigartig machen hat für `Pickup2/Area` eine eigene Kreisform angelegt, die jetzt als `[sub_resource]` in `main.tscn` steht, mit dem einzigen Wert, der vom Standard der Klasse `CircleShape2D` abweicht, dem Radius 9 statt 10. Der zusätzliche Abschnitt für `Area` mit `parent="Objects/Pickup2"` überschreibt am Kind der Instanz die Eigenschaft `shape`; `index` legt fest, an welcher Stelle unter den Kindern es steht. `[editable path=…]` ist der Schalter Bearbeitbare Kinder. Die Vorlage berührt das alles nicht, deshalb teilen `Pickup` und `Pickup3` weiter die Form aus `pickup.tscn`. Gespeichert mit Godot 4.7.2; die `unique_id`-Angaben sind hier weggelassen.
    resources:
      - title: Godot Docs · TSCN file format · Internal resources
        url: https://docs.godotengine.org/en/stable/engine_details/file_formats/tscn.html#internal-resources

  - id: datenhaltung-planen
    type: practice
    title: Geteilt, überschrieben oder im Spiel verändert?
    prompt: |
      Nimm eine Art von Objekten, die dein Spiel brauchen wird. Notiere in drei bis fünf Sätzen, welcher Wert für alle Objekte dieser Art gilt, welcher je Platzierung im Level abweicht und welcher sich im Spiel ändert, und wo jeder liegen soll: eigene `.tres`, Override an der Instanz oder Variable im Skript. Die Auswahl triffst du.
    lang: prose
    checklist:
      - Eine Art von Objekten ist genannt, mit mindestens drei Werten.
      - Jeder Wert hat einen Ort (`.tres`, Override oder Skriptvariable).
      - Beim Wert, der sich im Spiel ändert, steht, wie du verhinderst, dass er alle Objekte trifft.
    hints:
      - Ein Wert, der sich im Spiel ändert, gehört selten in eine geteilte Ressource.
      - Frag bei jedem Wert, ob du ihn an einer Stelle für alle ändern willst.
    explanation: |
      Diese Liste ist die Vorgabe, die du einem Coding-Agenten mitgibst, bevor er Szenen und Ressourcen anlegt. Wer sie vorher schreibt, vermeidet die beiden häufigsten Fehler dieses Moduls: Werte, die versehentlich geteilt werden, und Werte, die an zu vielen Stellen überschrieben werden. Welche Objekte und Werte dein Spiel hat, entscheidest du; die Struktur bleibt dieselbe.
    resources:
      - title: Godot Docs · Resources · Creating your own resources
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/resources.html#creating-your-own-resources
