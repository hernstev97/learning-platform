id: instanzen-ressourcen
title: Instanzen, Overrides und geteilte Ressourcen
level: 2
minutes: 120
summary: Eine Instanz speichert nur, worin sie von ihrer Vorlage abweicht, und Ressourcen werden geteilt statt kopiert. Wer beides versteht, sagt vorher, welcher Wert gilt und welche Objekte sich mitändern.
place: unterwegs
goals:
  - Du erklärst, was in der Eltern-Szene steht, wenn du eine Instanz änderst, und welcher Wert aus Skript, Vorlage und Instanz gilt.
  - Du unterscheidest Bearbeitbare Kinder, Lokal machen und geerbte Szenen und erkennst sie in der `.tscn`.
  - Du sagst vorher, welche Objekte sich ändern, wenn eine geteilte Ressource geändert wird.
  - Du trennst geteilte Ressourcen mit Einzigartig machen, `resource_local_to_scene` oder `duplicate()` und wählst den passenden Weg.
  - Du liest eine eigene Ressource wie `MovementStats` als Werte-Container, den mehrere Nodes teilen.
