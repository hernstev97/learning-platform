lesson: |
  Nach einer Änderung des Coding-Agenten bleibt der Zähler im HUD bei 0, obwohl die Sammelstücke verschwinden. Die Ausgabe ist rot. Der schnelle Weg wäre, alles zurück an den Agenten zu geben: „Geht nicht mehr, bitte reparieren.“ Dann rät er, ändert drei Dinge auf einmal, und mit Glück verschwindet das Symptom. Was die Ursache war, weißt du danach nicht, und beim nächsten Mal fängst du von vorn an.

  Den Fehler kannst du selbst eingrenzen: mit einer Methode, die bei jedem Fehler gleich bleibt, und mit den Werkzeugen, die Godot 4.7 dafür mitbringt. Die Fehlermeldungen und Bilder stammen aus Läufen des Testgeländes mit Godot 4.7.2, in das ein Fehler eingebaut war.

  ## Methode: reproduzieren, verkleinern, vergleichen

  Fünf Schritte, in dieser Reihenfolge:

  1. **Reproduzieren.** Schreib auf, mit welchen Schritten der Fehler jedes Mal auftritt. Was nur manchmal passiert, lässt sich nicht prüfen. Für Abläufe, die auf den Frame ankommen, gibt es Drehbuch-Skripte und feste Bildraten, wie in [Testszene: Angriff](/combat/testszene-angriff).
  2. **Verkleinern.** Bau eine kleine Szene mit nur den beteiligten Nodes und starte sie mit *Aktuelle Szene abspielen*. Je weniger im Spiel ist, desto weniger kommt als Ursache in Frage.
  3. **Vermuten und eine Änderung.** Schreib eine Vermutung auf und ändere genau eine Sache. Zwei Änderungen auf einmal lassen sich im Ergebnis nicht trennen; das ist dieselbe Regel wie beim Abstimmen in [Tuning als Experiment](/combat/tuning).
  4. **Vergleichen.** Vorher und nachher mit derselben Probe: dasselbe Log, dieselben Schritte, derselbe Monitor.
  5. **Halbieren.** Lief es gestern noch, sucht `git bisect` den Commit, der den Fehler brachte, in wenigen Schritten ([Fehlersuche in der History](/git/bisect-historie)). In einer einzelnen Datei halbierst du von Hand: Die Hälfte auskommentieren, testen, die schuldige Hälfte weiter teilen.

  Aus der Webentwicklung kennst du die Werkzeuge dazu: Die **Ausgabe** entspricht der Konsole, der **Debugger** mit Haltepunkten dem Sources-Panel, der **Profiler** dem Performance-Panel und die **Monitore** grob dem Memory-Panel. Der Vergleich bricht an einer Stelle: Dein Spiel läuft in einem eigenen Prozess. Was du im Editor siehst, sind Daten, die das Spiel über eine Debug-Verbindung schickt ([Overview of debugging tools](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html)).

  > [!PRAXIS]
  > Gibst du einen Fehler doch an einen Coding-Agenten, dann mit Material: die Schritte zum Reproduzieren, erwartetes und tatsächliches Verhalten, die vollständige Fehlermeldung mit Backtrace und was du schon ausgeschlossen hast. Bitte um genau eine Änderung und prüfe sie mit derselben Probe. Dann bleibt die Ursache nachvollziehbar, auch im Commit.

  ## Fehlermeldungen lesen: die erste Meldung zählt

  Im Testgelände war in `hud.gd` der Pfad zum Label falsch, `$Count` statt `$Counter`. Beim Start und beim ersten Einsammeln schrieb Godot 4.7.2 in die Ausgabe:

  ```text
  ERROR: Node not found: "Count" (relative to "/root/Main/HUD").
     at: get_node (scene/main/node.cpp:1975)
     GDScript backtrace (most recent call first):
         [0] @implicit_ready (res://hud.gd:5)
  SCRIPT ERROR: Invalid assignment of property or key 'text' with value of type 'String' on a base object of type 'null instance'.
            at: show_total (res://hud.gd:9)
            GDScript backtrace (most recent call first):
                [0] show_total (res://hud.gd:9)
                [1] collect (res://player.gd:28)
                [2] _on_body_entered (res://pickup.gd:10)
  ```

  So liest du das:

  - **`ERROR`** meldet die Engine, hier `get_node()`. Die Zeile `at:` nennt eine Stelle im C++-Quelltext von Godot; die brauchst du selten.
  - **`SCRIPT ERROR`** meldet GDScript: Eine Zeile deines Codes ließ sich nicht ausführen.
  - **`GDScript backtrace (most recent call first)`** listet die Aufrufkette. `[0]` ist die Zeile, an der es passiert ist, darunter steht, wer sie aufgerufen hat: Das Pickup rief `collect()` auf, das Signal `collected` erreichte `show_total()`.
  - **Die Ursache steht oft weiter oben.** Die zweite Meldung knallt in Zeile 9, weil `counter` `null` ist. `null` ist es, weil der Pfad in Zeile 5 nicht stimmt. Die erste Meldung nennt diese Ursache. Lies deshalb von oben nach unten und behebe die erste Meldung zuerst.

  `@implicit_ready` ist der Teil von `_ready`, den Godot für `@onready`-Variablen erzeugt. Den Backtrace gibt es seit Godot 4.5 im Editor und in Debug-Exporten, in Release-Exporten nur, wenn du ihn einschaltest ([Script backtraces](https://docs.godotengine.org/en/stable/tutorials/scripting/logging.html#script-backtraces)).

  Weitere Meldungen, die du im Testgelände erzeugen kannst, alle mit Godot 4.7.2 nachgestellt:

  - `The InputMap action "move_left" doesn't exist. Did you mean "ui_left"?` – Die Aktion fehlt in der Eingabe-Zuordnung. `player.gd:16` meldet das zweimal pro Tick.
  - `Can't change this state while flushing queries. Use call_deferred() or set_deferred() to change monitoring state instead.` – Eine Form wurde in einem Physik-Signal direkt abgeschaltet.
  - `Removing a CollisionObject node during a physics callback is not allowed and will cause undesired behavior. Remove with call_deferred() instead.` – Eine Area wurde mit `remove_child()` in `_on_body_entered` aus dem Baum genommen.
  - `Invalid access to property or key 'frames' on a base object of type 'Nil'.` – Eine Variable hat keinen Wert, etwa weil ein Node nie zugewiesen wurde.

  > [!MERKE]
  > Behebe die erste Meldung zuerst und starte neu. Viele spätere Meldungen sind nur Folgen der ersten.

  > [!WARNING] Symptome zudecken
  > Ein `if counter:` vor Zeile 9 lässt die rote Zeile verschwinden, der Zähler bleibt trotzdem bei 0. Solche Wächter verschieben den Fehler nur. Coding-Agenten schlagen sie gern vor, weil danach keine Meldung mehr kommt. Frag nach der Ursache, nicht nach Ruhe in der Ausgabe.

  ## Der Debugger: Stacktrace, Variablen, Haltepunkte

  Läuft das Spiel aus dem Editor, hält es bei einem `SCRIPT ERROR` an der Zeile an. Unten im **Debugger** zeigt der Reiter **Stacktrace** die Meldung, die Aufrufkette und die Variablen des gewählten Aufrufs ([Stack Trace](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/debugger_panel.html#stack-trace)):

  ![Debugger, Reiter Stacktrace: Stack Frames 0 res://hud.gd:9, 1 res://player.gd:28, 2 res://pickup.gd:10; darunter Locals mit total 1 und Members mit self CanvasLayer und counter null](/media/godot/fehler-eingrenzen/stacktrace@2x.png "Godot 4.7.2, angehalten beim Fehler in hud.gd:9")

  Unter **Members** steht `counter` mit `<null>`, unter **Locals** `total` mit 1. Damit ist klar: Der Wert kam an, das Label fehlt. Klickst du auf Frame 1 oder 2, siehst du die Variablen von `collect()` oder `_on_body_entered()`. Im Reiter **Fehler** stehen alle Meldungen des Laufs mit der Zeit seit dem Start; ein Klick auf den Pfeil klappt Backtrace und C++-Quelle auf:

  ![Reiter Fehler, alle Einträge aufgeklappt: zwei rote Einträge mit der Zeit seit dem Start, aufgeklappt mit C++-Fehler, C++-Quelle und Stacktrace hud.gd:5, darunter show_total mit Stacktrace hud.gd:9, player.gd:28, pickup.gd:10](/media/godot/fehler-eingrenzen/fehler-tab@2x.png "Godot 4.7.2, Reiter Fehler nach Alle ausklappen")

  Anhalten kannst du auch selbst. Ein **Haltepunkt** entsteht per Klick links neben die Zeilennummer im Skript-Editor (roter Punkt) oder mit dem Schlüsselwort `breakpoint` im Code, das mit dem Skript gespeichert wird. Ist das Spiel angehalten, gehst du mit **Hereinspringen**, **Überspringen** und **Hinausspringen** Zeile für Zeile weiter, **Fortfahren** lässt es weiterlaufen. Im Reiter **Auswerter** rechnest du während der Pause mit Variablen des aktuellen Aufrufs. Der Knopf **Fehler-Breaks ignorieren** lässt das Spiel bei Fehlern weiterlaufen; das ist praktisch, wenn ein bekannter Fehler dich nicht bei jedem Test stoppen soll.

  ```gdscript
  func collect(value: int) -> void:
  	total += value
  	if total == 2:
  		breakpoint   # hält nur beim zweiten Sammelstück an
  	collected.emit(total)
  ```

  Für Fehler, die man sieht statt liest, hat das Menü **Debuggen** Schalter für Starts aus dem Editor: **Sichtbare Collision-Shapes**, **Sichtbare Pfade**, **Sichtbare Navigation** und **CanvasItems-Redraws debuggen** ([Debug menu options](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html#debug-menu-options)). Den Baum des laufenden Spiels zeigt das Szenen-Dock im Modus **Remote**; wie du dort Werte liest und warum Änderungen nach dem Beenden weg sind, steht in [Aktionen und Parameter](/godot/aktionen-parameter).

  ### Warnungen der statischen Prüfung

  Neben Fehlern meldet GDScript **Warnungen**: Code, der läuft, aber vermutlich nicht so, wie gemeint. Im Skript-Editor zeigt ein gelbes Dreieck unten rechts ihre Zahl, im Reiter Fehler stehen sie gelb. Drei echte Warnungen aus einer `hud.gd`, in die ein Agent `var half = total / 2` und eine unbenutzte Variable `label` geschrieben hatte:

  ```text
  GDScript::reload: Integer division. Decimal part will be discarded.
  GDScript::reload: The local variable "half" is declared but never used in the block. If this is intended, prefix it with an underscore: "_half".
  GDScript::reload: The local variable "label" is declared but never used in the block. If this is intended, prefix it with an underscore: "_label".
  ```

  Welche Warnungen aktiv sind und ob sie als Fehler zählen, steht unter *Projekteinstellungen → Debuggen → GDScript* (`debug/gdscript/warnings/…`, [Warning system](https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/warning_system.html)). Die Warnung für fehlende Typangaben, „Untyped Declaration“ (`untyped_declaration`), steht im Standard auf `Ignore`. Schaltest du sie ein, zeigt sie dir in KI-Code jede Variable ohne Typ; mit Typen erkennt der Editor mehr Fehler vor dem Start ([Static typing](https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/static_typing.html)). Beim Start aus dem Terminal standen diese Warnungen im Test nicht in der Ausgabe, nur im Editor.

  ## Monitore: Objekte, Nodes und verwaiste Nodes

  Die Gruppe **Objekt** im Reiter **Monitore** zählt Objekte, Ressourcen, Nodes im Baum und **Verwaiste Nodes**: Nodes, die es gibt, die aber in keinem Baum hängen ([Performance.OBJECT_ORPHAN_NODE_COUNT](https://docs.godotengine.org/en/stable/classes/class_performance.html#class-performance-constant-object-orphan-node-count)). Ein Node, der aus dem Baum genommen und nie freigegeben wird, bleibt im Speicher. Steigt dieser Wert während des Spiels, verliert ein Skript Nodes; der Wert ist nur in Debug-Läufen verfügbar.

  ![Monitore Objekte 1757, Nodes 3 und Verwaiste Nodes 205; die Kurve der verwaisten Nodes steigt gleichmäßig an, Nodes bleibt flach](/media/godot/fehler-eingrenzen/monitor-verwaist@2x.png "Godot 4.7.2, Messszene, die bei jedem sechsten Physik-Tick einen Node2D erzeugt und nie einhängt")

  Der häufigste Fall im Testgelände: Ein Pickup verschwindet mit `get_parent().remove_child(self)` statt mit `queue_free()`. Gemessen mit Godot 4.7.2 nach einem eingesammelten Pickup:

  - `get_parent().remove_child(self)`: Meldung `Removing a CollisionObject node during a physics callback …`, 3 verwaiste Nodes.
  - `get_parent().remove_child.call_deferred(self)`: keine Meldung während des Spiels, 3 verwaiste Nodes.
  - `queue_free()`: keine Meldung, 0 verwaiste Nodes.

  Drei, weil das Pickup mit `Body` und `Area` drei Nodes hat. Die zweite Zeile ist die tückische: Sie sieht sauber aus, und erst beim Beenden meldet Godot `WARNING: 6 ObjectDB instances were leaked at exit`, gefolgt vom Hinweis auf `--verbose`. `queue_free()` gibt den Node am Ende des Frames frei, samt Kindern ([Node.queue_free](https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-method-queue-free)).

  Welche Nodes verwaist sind, schreibt `Node.print_orphan_nodes()` in die Ausgabe, eine Zeile pro Node mit Objekt-ID, Name und Typ, etwa `… - Stray Node: Weg (Type: Node2D) (Source:)`. Seit Godot 4.6 gibt es außerdem den Reiter **ObjectDB-Profiler**: Er macht Schnappschüsse aller Objekte und vergleicht zwei davon ([ObjectDB profiler](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/objectdb_profiler.html)).

  ## Profiler: welche Funktion kostet Zeit

  Ruckelt das Spiel und zeigt der Monitor lange Bilder, sagt dir der **Profiler**, wo die Zeit bleibt ([The Profiler](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/the_profiler.html)). Er läuft nicht von selbst, weil Messen selbst Zeit kostet: Spiel starten, im Reiter Profiler auf **Start**, eine Weile spielen, mit **Stopp** beenden. Die Messszene für das Bild unten hatte eine absichtlich langsame Funktion:

  ```gdscript title=langsam.gd
  extends Node2D

  ## Nur für die Messung: eine absichtlich langsame Funktion im Physik-Takt.

  var total := 0.0


  func _physics_process(_delta: float) -> void:
  	total = count_tiles()


  func count_tiles() -> float:
  	var sum := 0.0
  	for i in 60000:
  		sum += sqrt(float(i))
  	return sum
  ```

  ![Profiler mit Messung Frame-Zeit (ms) und Zeit Gesamt; unter Script Functions stehen _physics_process mit 2.97 ms und count_tiles mit 2.97 ms, count_tiles ist angehakt](/media/godot/fehler-eingrenzen/profiler@2x.png "Godot 4.7.2, Profiler nach 4 Sekunden Messung")

  Unter **Script Functions** stehen deine Funktionen mit Zeit und Zahl der Aufrufe im gewählten Frame. Die Zeit hängt an der Einstellung **Zeit**: **Gesamt** zählt die Aufrufe in einer Funktion mit, **Eigen** nur ihren eigenen Code. Gemessen mit Godot 4.7.2 in einem zweiten Lauf (jeder Lauf misst etwas anders, im Bild sind es 2,97 ms): Bei Gesamt stand `_physics_process` bei 2,71 ms und `count_tiles` bei 2,70 ms, bei Eigen fiel `_physics_process` auf 0,00 ms, `count_tiles` blieb bei 2,70 ms. Die Zeit steckt also in `count_tiles`, und `_physics_process` wartet nur darauf. Ein Haken vor einer Funktion zeichnet sie in den Graphen rechts; ein Klick in den Graphen wählt den Frame.

  Der Reiter **Visueller Profiler** misst nur das Zeichnen auf CPU und GPU, keine Skripte und keine Physik ([Visual Profiler](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/debugger_panel.html#visual-profiler)). Für ein einzelnes Codestück reicht oft `Time.get_ticks_usec()` vor und nach dem Aufruf.

  > [!INTERVIEW]
  > „Das Spiel hakt alle paar Sekunden. Wie findest du die Ursache?“ Gute Antwort: Erst reproduzieren und im Monitor nachsehen, ob es lange Bilder sind oder ein anderer Effekt. Dann den Profiler starten, zum Ausschlag im Graphen springen und unter Script Functions mit Zeit „Eigen“ die Funktion suchen, deren eigener Code die Zeit braucht. Bevor ich etwas optimiere, messe ich den Zustand, danach messe ich mit derselben Probe noch einmal.

  ## Häufige Fehler

  - **Die letzte Meldung behoben statt der ersten.** Folgefehler verschwinden mit ihrer Ursache.
  - **Den Backtrace überlesen.** `[0]` sagt, wo es knallt; die Zeilen darunter, wer den Aufruf ausgelöst hat.
  - **Wächter statt Ursache.** `if node:` versteckt einen falschen Pfad, statt ihn zu korrigieren.
  - **Mehrere Änderungen auf einmal.** Danach weißt du nicht, welche gewirkt hat.
  - **`remove_child()` statt `queue_free()`.** Nodes bleiben verwaist, der Monitor steigt; im Physik-Signal kommt zusätzlich eine Fehlermeldung.
  - **Profiler mit Zeit Gesamt gelesen.** Die aufrufende Funktion sieht genauso teuer aus wie die langsame darin; mit Eigen trennst du sie.
  - **Warnungen ignoriert.** Ganzzahldivision und unbenutzte Variablen sind oft Reste einer halb fertigen Änderung.

  ## Zusammenfassung

  - Die Methode bleibt gleich: reproduzieren, verkleinern, eine Änderung, vergleichen, halbieren; für alte Stände `git bisect`.
  - Fehlermeldungen liest du von oben. `[0]` im Backtrace ist die Stelle, die Ursache steht oft in einer früheren Meldung.
  - Bei einem Skriptfehler hält das Spiel an; der Stacktrace zeigt Aufrufkette und Variablen, der Reiter Fehler alle Meldungen.
  - Haltepunkte setzt du per Klick oder mit `breakpoint`, dann gehst du mit Hereinspringen und Überspringen weiter.
  - Warnungen markieren Code, der läuft, aber vermutlich falsch ist; welche aktiv sind, steht in den Projekteinstellungen.
  - Steigen die verwaisten Nodes, verliert ein Skript Nodes. Freigeben mit `queue_free()`.
  - Der Profiler zeigt Zeit je Funktion; mit „Eigen“ findest du die, deren eigener Code langsam ist.
exercises:
  - id: werkzeug-waehlen
    type: choice
    title: Welches Werkzeug beantwortet welche Frage?
    prompt: |
      Welche Zuordnungen stimmen?
    options:
      - text: Welche Funktion macht ein Bild langsam? – Profiler, Script Functions
        correct: true
        why: Der Profiler misst Zeit je Funktion und Frame. Das kann kein anderes Werkzeug im Debugger.
      - text: Gehen beim Einsammeln Nodes verloren? – Monitore, Verwaiste Nodes
        correct: true
        why: Der Monitor zählt Nodes außerhalb des Baums. Steigt er bei jedem Pickup, wird etwas nicht freigegeben.
      - text: Welchen Wert hat eine Variable in dem Moment, in dem der Fehler passiert? – Visueller Profiler
        correct: false
        why: Der Visuelle Profiler misst nur das Zeichnen. Variablen zeigt der Stacktrace, wenn das Spiel angehalten ist.
      - text: Stimmt die Kollisionsform zur Figur? – Monitore, Physik-2D
        correct: false
        why: Die Monitore zählen Kollisionspaare, zeigen aber keine Formen. Dafür gibt es *Debuggen → Sichtbare Collision-Shapes*.
    explanation: |
      Jedes Werkzeug beantwortet eine Art Frage. Zeit je Funktion: Profiler. Zählwerte über die Zeit: Monitore. Zustand in einem bestimmten Moment: Stacktrace mit Variablen, wenn das Spiel an einem Fehler oder Haltepunkt steht. Was man sehen muss, etwa Formen und Pfade, schaltet das Menü Debuggen sichtbar. Wer zuerst die Frage formuliert, greift zum richtigen Werkzeug.
    resources:
      - title: Godot Docs · Debugger panel
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/debug/debugger_panel.html

  - id: methode-ordnen
    type: order
    title: Ein Fehler, fünf Schritte
    prompt: |
      Der Zähler im HUD bleibt bei 0, und du weißt nicht, seit wann. Bring die Schritte in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Die Schritte aufschreiben, mit denen der Zähler jedes Mal bei 0 bleibt.
      Eine kleine Szene mit Figur, einem Pickup und dem HUD bauen.
      Eine Vermutung notieren und genau eine Sache ändern.
      Mit denselben Schritten testen und das Ergebnis mit vorher vergleichen.
      Ursache, Korrektur und Beleg im Protokoll festhalten und committen.
    explanation: |
      Ohne zuverlässige Reproduktion lässt sich keine Änderung prüfen. Die kleine Szene schließt alles aus, was nicht beteiligt ist. Eine Vermutung mit genau einer Änderung macht das Ergebnis eindeutig, und der Vergleich mit derselben Probe zeigt, ob sie gewirkt hat. Das Protokoll mit Commit sorgt dafür, dass du denselben Fehler später wiedererkennst. Den fünften Schritt der Methode, das Halbieren mit `git bisect`, brauchst du hier nicht: Er hilft, wenn ein älterer Stand noch funktioniert und du den Commit suchst, der den Fehler brachte.
    resources:
      - title: Git · git-bisect
        url: https://git-scm.com/docs/git-bisect

  - id: ursache-finden
    type: output
    title: Wo steckt die Ursache?
    prompt: |
      Das ist die Ausgabe nach dem Start und dem ersten Einsammeln. In welcher Datei und Zeile steckt die Ursache beider Meldungen? Antworte im Format `datei.gd:zeile`.
    lang: text
    code: |
      ERROR: Node not found: "Count" (relative to "/root/Main/HUD").
         at: get_node (scene/main/node.cpp:1975)
         GDScript backtrace (most recent call first):
             [0] @implicit_ready (res://hud.gd:5)
      SCRIPT ERROR: Invalid assignment of property or key 'text' with value of type 'String' on a base object of type 'null instance'.
                at: show_total (res://hud.gd:9)
                GDScript backtrace (most recent call first):
                    [0] show_total (res://hud.gd:9)
                    [1] collect (res://player.gd:28)
                    [2] _on_body_entered (res://pickup.gd:10)
    expected: |
      hud.gd:5
    accept:
      - res://hud.gd:5
      - hud.gd 5
      - hud.gd Zeile 5
    explanation: |
      Die erste Meldung kommt aus `@implicit_ready`, also beim Belegen der `@onready`-Variablen in Zeile 5: Der Pfad `Count` findet keinen Node, die Variable bleibt `null`. Die zweite Meldung in Zeile 9 ist die Folge, denn dort wird `text` auf `null` gesetzt. `player.gd:28` und `pickup.gd:10` sind nur die Aufrufer. Beide Meldungen stammen aus einem Lauf mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Logging · Script backtraces
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/logging.html#script-backtraces

  - id: fehler-pro-tick
    type: output
    title: Wie oft meldet sich die fehlende Aktion?
    prompt: |
      Im Testgelände fehlt in der Eingabe-Zuordnung `move_left`. `player.gd` ruft in jedem Physik-Tick `Input.get_vector()` mit den vier Aktionen auf. Nach 10 Ticks zählst du 20 Zeilen `The InputMap action "move_left" doesn't exist.` Jetzt löschst du zusätzlich `move_up`. Wie viele Zeilen mit `doesn't exist` stehen nach 10 Ticks insgesamt in der Ausgabe?
    lang: text
    code: |
      ERROR: The InputMap action "move_up" doesn't exist. Did you mean "move_down"?
         at: get_action_raw_strength (core/input/input.cpp:553)
      ERROR: The InputMap action "move_left" doesn't exist. Did you mean "ui_left"?
         at: get_action_raw_strength (core/input/input.cpp:553)
      ERROR: The InputMap action "move_left" doesn't exist. Did you mean "ui_left"?
         at: action_get_deadzone (core/input/input_map.cpp:191)
      …
    expected: |
      40
    accept:
      - 40 Zeilen
    explanation: |
      20 Zeilen in 10 Ticks heißen: Jede fehlende Aktion meldet sich pro Tick zweimal. Die `at:`-Zeilen zeigen, warum: `get_vector()` liest für jede Aktion die Stärke und die Deadzone. Mit zwei fehlenden Aktionen sind es 2 × 2 × 10 = 40. Gemessen mit Godot 4.7.2: 20 Zeilen für `move_left` und 20 für `move_up`. Bei 60 Ticks pro Sekunde sind das 240 Zeilen pro Sekunde, die alles andere verdrängen; deshalb lohnt der Blick ganz nach oben. Der Vorschlag `Did you mean "move_down"?` ist nur eine Ähnlichkeitssuche über die Namen, keine Diagnose.
    resources:
      - title: Godot Docs · Input.get_vector
        url: https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-get-vector

  - id: verwaiste-zaehlen
    type: output
    title: Was zeigt der Monitor?
    prompt: |
      Dieses Testskript läuft als Hauptschleife. Was gibt es in Tick 120 aus?
    lang: gdscript
    code: |
      extends SceneTree

      var frame := 0
      var spawned: Array[Node2D] = []


      func _initialize() -> void:
      	physics_frame.connect(_tick)
      	var a := Node2D.new()
      	root.add_child(a)
      	root.remove_child(a)


      func _tick() -> void:
      	frame += 1
      	if frame % 6 == 0:
      		spawned.append(Node2D.new())
      	if frame == 120:
      		var orphans := Performance.get_monitor(Performance.OBJECT_ORPHAN_NODE_COUNT)
      		print("Verwaiste Nodes: ", orphans)
      		quit()
    expected: |
      Verwaiste Nodes: 21.0
    accept:
      - "Verwaiste Nodes: 21"
    explanation: |
      Bis Tick 120 entsteht bei jedem sechsten Tick ein `Node2D`, das sind 20, und keiner hängt im Baum. Dazu kommt der Node, der in `_initialize()` eingehängt und wieder herausgenommen wurde: Herausnehmen gibt ihn nicht frei. `get_monitor()` liefert eine Kommazahl, deshalb `21.0`. Gemessen mit Godot 4.7.2; dasselbe Verhalten zeigt der Monitor im Debugger als steigende Kurve.
    resources:
      - title: Godot Docs · Performance.OBJECT_ORPHAN_NODE_COUNT
        url: https://docs.godotengine.org/en/stable/classes/class_performance.html#class-performance-constant-object-orphan-node-count

  - id: aufgeschoben-ergaenzen
    type: gap
    title: Sauber verschwinden
    prompt: |
      Das Pickup soll beim Einsammeln seine Form abschalten und sich danach selbst freigeben, ohne Fehlermeldung und ohne verwaiste Nodes. Ergänze die Lücken.
    lang: gdscript
    code: |
      func _on_body_entered(body: Node2D) -> void:
      	if body is Player:
      		body.collect(value)
      		$Area.⟦set_deferred⟧(&"disabled", true)
      		⟦queue_free()⟧
    gaps:
      - label: Änderung bis nach der Physik-Abfrage verschieben
        hint: Eine Methode von `Object`, die eine Eigenschaft erst am Ende des Frames setzt.
      - label: Node freigeben
        hint: Gibt den Node samt Kindern am Ende des Frames frei.
        accept: ["self.queue_free()"]
    explanation: |
      Im Signal `body_entered` arbeitet der Physik-Server noch seine Abfragen ab. Eine Form direkt abzuschalten, meldet `Can't change this state while flushing queries`. `set_deferred()` setzt den Wert, wenn die Abfrage fertig ist. `queue_free()` gibt das Pickup mit `Body` und `Area` am Ende des Frames frei; gemessen mit Godot 4.7.2 blieb danach kein verwaister Node übrig.
    resources:
      - title: Godot Docs · Object.set_deferred
        url: https://docs.godotengine.org/en/stable/classes/class_object.html#class-object-method-set-deferred
      - title: Godot Docs · Node.queue_free
        url: https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-method-queue-free

  - id: debug-collisions-starten
    type: command
    title: Formen sichtbar, aus dem Terminal
    prompt: |
      Starte das Testgelände aus dem Terminal so, dass alle Kollisionsformen sichtbar sind, wie mit *Debuggen → Sichtbare Collision-Shapes*.
    context: |
      Du bist im Projektordner. `godot` steht für dein Godot-Binary.
    answers:
      - godot --debug-collisions
      - godot --path . --debug-collisions
      - godot --debug-collisions --path .
    explanation: |
      `--debug-collisions` entspricht dem Menüpunkt und wirkt auch, wenn du das Spiel ohne Editor startest, etwa für einen Lauf mit fester Bildrate oder für den Movie Maker. Der Schalter im Menü Debuggen gilt nur für Starts aus dem Editor heraus.
    resources:
      - title: Godot Docs · Command line tutorial
        url: https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html

  - id: zaehler-bleibt-null
    type: bug
    title: Der Zähler bleibt bei 0
    prompt: |
      Die Sammelstücke verschwinden, der Zähler im HUD bleibt bei 0. Die Ausgabe beginnt mit `ERROR: Node not found: "Count" (relative to "/root/Main/HUD").` Im Szenen-Dock heißt das Label unter `HUD` `Counter`. Finde die Zeile und korrigiere sie.
    lang: gdscript
    code: |
      extends CanvasLayer

      ## Zeigt, wie viele Sammelstücke die Figur hat.

      @onready var counter: Label = $Count


      func show_total(total: int) -> void:
      	counter.text = str(total)
    lines: [5]
    fix:
      - line: 5
        answers:
          - "@onready var counter: Label = $Counter"
          - "@onready var counter: Label = get_node(\"Counter\")"
          - "@onready var counter: Label = get_node(^\"Counter\")"
          - "@onready var counter := $Counter as Label"
          - "@onready var counter: Label = $\"Counter\""
    explanation: |
      `$Count` ist die Kurzform von `get_node("Count")` und sucht ein Kind namens `Count`. Das gibt es nicht, also bleibt `counter` `null`, und Zeile 9 scheitert später mit `Invalid assignment … on a base object of type 'null instance'`. Die Ursache steht in Zeile 5, nicht in Zeile 9. Ein `if counter:` in Zeile 9 würde die Meldung verschwinden lassen, den Zähler aber nicht reparieren.
    resources:
      - title: Godot Docs · Node.get_node
        url: https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-method-get-node

  - id: pickup-leck
    type: bug
    title: Mit jedem Pickup drei Nodes mehr
    prompt: |
      Seit einer Änderung des Agenten steigt der Monitor „Verwaiste Nodes“ mit jedem eingesammelten Pickup um 3. Während des Spiels gibt es keine Fehlermeldung, beim Beenden aber `WARNING: 6 ObjectDB instances were leaked at exit`. Finde die Zeile und korrigiere sie.
    lang: gdscript
    code: |
      extends Area2D

      ## Sammelstück: meldet sich bei der Figur und verschwindet.

      @export var value := 1


      func _on_body_entered(body: Node2D) -> void:
      	if body is Player:
      		body.collect(value)
      		get_parent().remove_child.call_deferred(self)
    lines: [11]
    fix:
      - line: 11
        answers:
          - queue_free()
          - self.queue_free()
          - call_deferred("queue_free")
          - queue_free.call_deferred()
    explanation: |
      `remove_child()` nimmt das Pickup nur aus dem Baum. Es und seine Kinder `Body` und `Area` bleiben im Speicher, daher drei verwaiste Nodes pro Pickup. `call_deferred` verhindert nur die Fehlermeldung, die ein direktes `remove_child()` im Physik-Signal auslöst. `queue_free()` gibt den Node am Ende des Frames frei. Gemessen mit Godot 4.7.2: mit `remove_child.call_deferred` 3 verwaiste Nodes nach einem Pickup, mit `queue_free()` 0.
    resources:
      - title: Godot Docs · Node.queue_free
        url: https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-method-queue-free

  - id: profiler-lesen
    type: choice
    title: Wo bleibt die Zeit?
    prompt: |
      Der Profiler zeigt diesen Frame mit Zeit „Gesamt“. Welche Aussage stimmt?

      ![Profiler mit Messung Frame-Zeit (ms) und Zeit Gesamt; Script Functions 2.97 ms, darunter _physics_process 2.97 ms und count_tiles 2.97 ms](/media/godot/fehler-eingrenzen/profiler@2x.png "Godot 4.7.2, Profiler der Messszene")
    options:
      - text: "`count_tiles` braucht die Zeit; `_physics_process` zeigt dieselbe Zahl, weil Gesamt den Aufruf von `count_tiles` mitzählt."
        correct: true
        why: In einem zweiten Messlauf fiel `_physics_process` mit Zeit „Eigen“ auf 0,00 ms, `count_tiles` blieb bei 2,70 ms.
      - text: "`_physics_process` und `count_tiles` kosten zusammen 5,94 ms."
        correct: false
        why: Gesamt enthält die aufgerufenen Funktionen. Die 2,97 ms von `count_tiles` stecken in den 2,97 ms von `_physics_process`, sie addieren sich nicht.
      - text: Die Physik ist der Engpass, weil Physics 2D in der Liste steht.
        correct: false
        why: Physics 2D steht bei 0,00 ms. Die Zeit liegt in einer Skriptfunktion, die nur im Physik-Takt aufgerufen wird.
    explanation: |
      Gesamt (Inclusive) misst eine Funktion samt allem, was sie aufruft; Eigen (Self) nur ihren eigenen Code. Deshalb sieht der Aufrufer in Gesamt genauso teuer aus wie die langsame Funktion darin. Gemessen mit Godot 4.7.2 in einem zweiten Lauf: Gesamt `_physics_process` 2,71 ms und `count_tiles` 2,70 ms, Eigen `_physics_process` 0,00 ms und `count_tiles` 2,70 ms. Erst mit Eigen weißt du, welchen Code du dir ansehen musst.
    resources:
      - title: Godot Docs · The Profiler · Scope of measurement
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/debug/the_profiler.html#scope-of-measurement-and-measurement-windows

  - id: stacktrace-erklaeren
    type: explain
    title: Was der angehaltene Debugger verrät
    prompt: |
      Das Spiel ist bei diesem Fehler angehalten. Erkläre in wenigen Sätzen, was der Stacktrace zeigt und wie du von hier zur Ursache kommst.

      ![Debugger, Reiter Stacktrace: Stack Frames 0 res://hud.gd:9, 1 res://player.gd:28, 2 res://pickup.gd:10; Locals total 1; Members self CanvasLayer, counter null](/media/godot/fehler-eingrenzen/stacktrace@2x.png "Godot 4.7.2, angehalten bei Invalid assignment … 'null instance' in hud.gd:9")
    lang: text
    code: |
      SCRIPT ERROR: Invalid assignment of property or key 'text'
      with value of type 'String' on a base object of type 'null instance'.
    points:
      - Frame 0 ist die Zeile, an der es scheitert (`hud.gd:9`); Frame 1 und 2 sind die Aufrufer über `collect()` und das Pickup-Signal.
      - Der Wert kam an (`total` ist 1), aber `counter` ist `<null>`; das Problem ist das Label, nicht die Zählung.
      - "`counter` wird mit `@onready` aus einem Pfad belegt; die Ursache liegt also beim Pfad in der Variablendeklaration, nicht in Zeile 9."
      - Als Nächstes prüfst du den Pfad gegen das Szenen-Dock oder liest die erste Meldung im Reiter Fehler.
    explanation: |
      Der Stacktrace beantwortet zwei Fragen: Wer hat wen aufgerufen, und welche Werte lagen vor. Frame 0 zeigt die Zeile mit dem Fehler, darunter den Weg dorthin: Das Pickup meldete den Körper, `collect()` sendete `collected`, `show_total()` scheiterte. Unter Locals steht `total` mit 1, also stimmt die Zählung. Unter Members steht `counter` mit `<null>`. Weil `counter` per `@onready` aus `$Count` belegt wird, führt der Weg zur Deklaration in Zeile 5; der Reiter Fehler bestätigt das mit `Node not found: "Count"`.
    resources:
      - title: Godot Docs · Debugger panel · Stack Trace
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/debug/debugger_panel.html#stack-trace

  - id: fehlerbericht
    type: practice
    title: Ein Fehlerbericht, den man nachstellen kann
    prompt: |
      Nimm einen Fehler, der dir in deinem Projekt oder im Testgelände begegnet ist, oder das Beispiel mit `$Count` aus der Lektion, und schreib in vier bis fünf Sätzen einen Bericht, mit dem ein anderer ihn ohne Rückfrage nachstellen kann, ob Mensch oder Coding-Agent.
    lang: prose
    checklist:
      - Die Schritte zum Reproduzieren stehen in der Reihenfolge, in der man sie ausführt.
      - Erwartetes und tatsächliches Verhalten stehen getrennt.
      - Die erste Fehlermeldung ist zitiert, unterwegs aus der Lektion oder deinen Notizen, mit `[0]` aus dem Backtrace, falls vorhanden.
      - Godot-Version und Commit oder Stand des Projekts sind genannt.
      - Du hast notiert, was du schon ausgeschlossen hast und wie.
    hints:
      - Die Godot-Version steht unten rechts im Editor und in der ersten Zeile der Ausgabe.
      - Ein guter Bericht enthält keine Vermutung als Tatsache; schreib Vermutungen als solche dazu.
    explanation: |
      Ein Fehlerbericht ist die Reproduktion in Textform. Mit Schritten, Erwartung, Meldung und Stand kann jemand anderes den Fehler auslösen, ohne dich zu fragen, und eine Korrektur mit derselben Probe prüfen. Für einen Coding-Agenten gilt das genauso: Je genauer der Bericht, desto kleiner und prüfbarer die Änderung, die zurückkommt.
    resources:
      - title: Godot Docs · Overview of debugging tools
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html
