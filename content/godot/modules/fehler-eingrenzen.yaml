id: fehler-eingrenzen
title: "Fehler eingrenzen: Debugger, Monitore und Profiler lesen"
level: 2
minutes: 130
summary: Statt einen Fehler an den Coding-Agenten zurückzugeben, grenzt du ihn selbst ein – mit einer festen Methode, mit Fehlermeldungen und Backtrace, mit Stacktrace und Haltepunkten, mit Monitoren für verlorene Nodes und mit dem Profiler für langsame Funktionen.
place: unterwegs
goals:
  - Du gehst bei einem Fehler nach einer festen Methode vor – reproduzieren, verkleinern, eine Änderung, vergleichen, halbieren – und weißt, wann `git bisect` hilft.
  - Du liest eine Godot-Fehlermeldung mit Backtrace und findest die Zeile mit der Ursache, nicht nur die, an der es knallt.
  - Du nutzt Stacktrace, Variablen und Haltepunkte des Debuggers, um einen Zustand im angehaltenen Spiel zu prüfen.
  - Du erkennst am Monitor „Verwaiste Nodes“, dass Nodes verloren gehen, und an Warnungen, wo Code unsauber ist.
  - Du findest mit dem Profiler die Funktion, die ein Bild langsam macht, und unterscheidest Gesamt- und Eigenzeit.
