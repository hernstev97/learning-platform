id: kollision-ebenen
title: "Kollisionen und Trefferzonen: Körper, Formen, Layer und Masken"
level: 2
minutes: 120
summary: Welcher Node blockiert und welcher nur meldet, wie eine Form an den Node kommt, was Layer und Maske bedeuten und was eine Fußform in der Draufsicht bewirkt – mit Regeln, die an Godot 4.7.2 nachgemessen sind.
place: unterwegs
goals:
  - Du wählst für Wand, Tür, Sammelstück und Figur den passenden Körper oder eine `Area2D` und begründest die Wahl.
  - Du liest Layer und Maske im Inspektor, in `.tscn`-Dateien und im Code und rechnest zwischen Ebenennummer und Bitwert um.
  - Du sagst für zwei Objekte vorher, ob sie sich blockieren und welches Signal feuert.
  - Du erkennst an einem Spielbild mit sichtbaren Kollisionsformen, wo eine Form sitzt und welche Folge das für die Bewegung hat.
  - Du findest fehlende Formen, falsche Masken und ausgeschaltetes `monitoring` an Warnungen, Symptomen und Einstellungen.
