lesson: |
  Du läufst im Testgelände über ein Sammelstück, und der Zähler oben links bleibt bei 0. Im Spielbild liegen Figur und Sammelstück übereinander, die Ausgabe zeigt keinen Fehler. Die Ursache steckt fast immer in vier Einstellungen, die ein Coding-Agent beim Anlegen gesetzt hat: Layer und Maske der beiden Objekte, dazu `monitoring` und `monitorable`. Wer sie lesen kann, findet den Fehler in einer Minute. Wer rät, klickt Kästchen an, bis es zufällig geht, und baut dabei den nächsten Fehler ein.

  Die Regeln für Erkennen und Blockieren stammen aus Messungen mit Godot 4.7.2 am Testgelände. Wie Hitboxen und Hurtboxen im Kampf zusammenspielen, steht in [Reichweite, Hitboxen und Hurtboxen](/combat/hitboxen); hier geht es um die Technik darunter.

  ## Körper und Areas: wer blockiert, wer meldet

  Godot kennt vier Arten von Kollisionsobjekten, alle abgeleitet von `CollisionObject2D` ([Physics introduction](https://docs.godotengine.org/en/stable/tutorials/physics/physics_introduction.html#collision-objects)). `Area2D` blockiert nichts und meldet nur. Die anderen drei, `StaticBody2D`, `RigidBody2D` und `CharacterBody2D`, sind Körper (physics bodies) und blockieren einander. `AnimatableBody2D` ist eine Unterklasse von `StaticBody2D`, deshalb hat sie in der Tabelle eine eigene Zeile.

  | Node | Wer bewegt ihn | Im Testgelände |
  | --- | --- | --- |
  | `StaticBody2D` | niemand, oder dein Code versetzt ihn | `Crate` |
  | `AnimatableBody2D` | Code oder Animation, schiebt andere mit | – |
  | `RigidBody2D` | die Physik-Engine mit Kräften und Stößen | – |
  | `CharacterBody2D` | dein Code mit `move_and_slide()` | `Player` |
  | `Area2D` | blockiert nicht, meldet Überlappungen | `Pickup` |

  Der Unterschied zwischen den ersten beiden zeigt sich erst, wenn sich etwas bewegt. Versetzt du einen `StaticBody2D` per Code, springt er laut Doku an die neue Stelle, ohne Körper auf dem Weg zu bewegen. Ein `AnimatableBody2D` schätzt dabei seine Geschwindigkeit und schiebt andere Körper mit, etwa als Tür oder bewegliche Plattform ([StaticBody2D](https://docs.godotengine.org/en/stable/classes/class_staticbody2d.html), [AnimatableBody2D](https://docs.godotengine.org/en/stable/classes/class_animatablebody2d.html)). Bewegst du ihn mit einem `AnimationPlayer`, nennt die Doku dafür den Modus `Physics` für `callback_mode_process`. Ein `RigidBody2D` passt für Dinge, die nach einem Stoß von selbst weiterrollen oder abprallen; du steuerst ihn mit Kräften, nicht mit Positionen.

  Eine `Area2D` meldet über Signale, wenn ein Körper hineinkommt (`body_entered`) oder eine andere Area (`area_entered`) ([Using Area2D](https://docs.godotengine.org/en/stable/tutorials/physics/using_area_2d.html#overlap-detection)). Das Sammelstück ist so eine Area: Die Figur läuft hindurch, und `pickup.gd` reagiert auf `body_entered`.

  Aus dem Web kennst du den `IntersectionObserver`: Er meldet, dass sich zwei Elemente überschneiden, und verschiebt nichts. So arbeitet eine Area. Ein Körper gleicht eher einem Element, das im Layout Platz einnimmt. Der Vergleich bricht an zwei Stellen: Der Observer beobachtet Elemente, die du ihm einzeln gibst, während Godot über Ebenen filtert, wer wen überhaupt sieht. Und Godot meldet nicht sofort, sondern im nächsten Physik-Frame; das misst [Godot-Start](/combat/godot-start) nach.

  ## Formen: eine Shape je CollisionShape2D, Größe statt Skalierung

  Ein Kollisionsobjekt ohne Form kollidiert mit nichts. Die Form kommt von Kind-Nodes: Ein `CollisionShape2D` trägt genau eine Form-Ressource in seiner Eigenschaft `shape`, ein `CollisionPolygon2D` ein Polygon, das du im Editor zeichnest ([CollisionShape2D](https://docs.godotengine.org/en/stable/classes/class_collisionshape2d.html#class-collisionshape2d-property-shape), [CollisionPolygon2D](https://docs.godotengine.org/en/stable/classes/class_collisionpolygon2d.html)). Brauchst du zwei Formen, hängst du zwei Kinder an. Die häufigsten Form-Ressourcen mit ihren Standardgrößen in Godot 4.7.2:

  | Ressource | Größe steckt in | Standard |
  | --- | --- | --- |
  | `RectangleShape2D` | `size` | 20 × 20 |
  | `CircleShape2D` | `radius` | 10 |
  | `CapsuleShape2D` | `radius`, `height` | 10, 30 |

  In der `.tscn` steht die Form als `sub_resource`, der Node verweist darauf. So sieht die Fußform der Figur in `player.tscn` aus:

  ```ini title=player.tscn
  [sub_resource type="RectangleShape2D" id="feet"]
  size = Vector2(10, 6)

  [node name="Feet" type="CollisionShape2D" parent="."]
  position = Vector2(0, -3)
  shape = SubResource("feet")
  ```

  Die Form ist eine Ressource. Alle Instanzen von `pickup.tscn` teilen sich deshalb denselben Kreis: Änderst du `radius` in `pickup.tscn`, ändern sich alle Sammelstücke. Was das für Instanzen heißt und wie du eine Form einzigartig machst, steht im [Modul über Instanzen und Ressourcen](/godot/instanzen-ressourcen).

  Die Größe änderst du an der Form selbst, über `size` oder `radius` oder die Griffe der Form im 2D-Bildschirm, nie über `scale` des Nodes. Die Doku warnt ausdrücklich: Die Skalierung im Inspektor soll `(1, 1)` bleiben, eine skalierte Form kann unerwartet kollidieren ([Collision shapes](https://docs.godotengine.org/en/stable/tutorials/physics/physics_introduction.html#collision-shapes)).

  Fehlt die Form, zeigt das Szenen-Dock ein Warnsymbol neben dem Node:

  ![Szenen-Dock von pickup.tscn mit zwei zusätzlichen Nodes CollisionShape2D und Area2D, beide mit gelbem Warndreieck](/media/godot/kollision-ebenen/szene-warnung.png "Godot 4.7.2, Szenen-Dock: Form ohne Shape-Ressource und Area2D ohne Form-Kind")

  Fährst du mit der Maus über das Dreieck, nennt Godot 4.7.2 für das `CollisionShape2D`: „Ein CollisionShape2D benötigt zum Funktionieren eine zugeordnete Shape. Um es verwenden zu können, muss eine Shape-Ressource dafür erzeugt werden!“ Für die `Area2D` ohne Form-Kind: „Dieser Node besitzt keine Shapes, er kann also nicht mit anderen Objekten kollidieren oder interagieren.“

  ## Layer und Maske: wo ich bin, wen ich suche

  Jedes Kollisionsobjekt hat zwei Eigenschaften mit je 32 Ebenen. `collision_layer` sind die Ebenen, auf denen es liegt. `collision_mask` sind die Ebenen, die es absucht. Standard ist für beide Ebene 1 ([Collision layers and masks](https://docs.godotengine.org/en/stable/tutorials/physics/physics_introduction.html#collision-layers-and-masks)). Die Klassenreferenz fasst die Regel in einem Satz: „Object A can detect a contact with object B only if object B is in any of the layers that object A scans.“ ([CollisionObject2D.collision_layer](https://docs.godotengine.org/en/stable/classes/class_collisionobject2d.html#class-collisionobject2d-property-collision-layer))

  > [!MERKE]
  > Layer heißt: Hier bin ich. Maske heißt: Die suche ich. Ob gemeldet oder blockiert wird, entscheidet die Maske dessen, der sucht.

  So verhält sich Godot 4.7.2, nachgemessen mit zwei überlappenden Formen und einer Figur, die gegen eine Kiste läuft:

  | Paar | Was passiert | Bedingung |
  | --- | --- | --- |
  | Area A, Körper B | A sendet `body_entered` | `monitoring` von A an, Maske von A enthält Layer von B |
  | Area A, Area B | A sendet `area_entered` | `monitoring` von A an, `monitorable` von B an, Maske von A enthält Layer von B |
  | `CharacterBody2D` A läuft mit `move_and_slide()` gegen Körper B | A bleibt stehen | Maske von A enthält Layer von B |

  Die Maske des anderen spielt in diesen drei Fällen keine Rolle. Eine Area meldet auch einen Körper mit Maske 0, und eine Kiste mit Maske 0 hält die Figur genauso auf. Zwischen zwei Areas gilt jede Richtung für sich: Sucht jede die Ebene der anderen, bekommen beide ihr `area_entered`. `monitoring` heißt „ich melde“, `monitorable` heißt „ich darf gefunden werden“ ([Area2D.monitorable](https://docs.godotengine.org/en/stable/classes/class_area2d.html#class-area2d-property-monitorable)). Körper haben kein `monitorable`; eine Area findet jeden Körper, dessen Layer in ihrer Maske liegt. Areas blockieren nie: Auch eine Figur, deren Maske die Ebene der Sammelstücke enthält, läuft hindurch.

  Im Testgelände sind die Ebenen so verteilt:

  | Node | Layer | Maske | Sonst |
  | --- | --- | --- | --- |
  | `Player` (`CharacterBody2D`) | 2 player | 1 world | – |
  | `Crate` (`StaticBody2D`) | 1 world | keine | – |
  | `Pickup` (`Area2D`) | 3 pickups | 2 player | `monitorable` aus |

  ![Inspektor des Pickup: Monitoring an, Monitorable aus mit Zurücksetzen-Pfeil, im Raster Layer 3 und Mask 2 hervorgehoben](/media/godot/kollision-ebenen/pickup-inspektor.png "Godot 4.7.2, Inspektor von pickup.tscn: Abschnitte Area2D und Collision")

  Lies es von der Seite des Suchenden. Das Sammelstück sucht Ebene 2, die Figur liegt dort: `body_entered` feuert. Die Figur sucht Ebene 1, die Kiste liegt dort: Die Figur bleibt an ihr stehen. Die Kiste sucht nichts, das muss sie auch nicht, denn sie bewegt sich nie. Und das Sammelstück darf von keiner anderen Area gefunden werden, weil `monitorable` aus ist. Der Zurücksetzen-Pfeil neben Monitorable, Layer und Mask zeigt dir, dass diese Werte vom Standard abweichen. Das Wort „An“ steht neben jedem Kästchen, auch neben einem ausgeschalteten; es zählt nur der Haken.

  ## Nummer, Bitwert und Layer-Namen

  Der Inspektor zeigt Ebenen als Nummern ab 1; das Raster zeigt die ersten 16 von 32. In der `.tscn` und im Code steht dagegen eine Zahl, in der jede Ebene ein Bit ist: Ebene *n* hat den Wert 2^(*n*−1). Ebene 1 ist 1, Ebene 2 ist 2, Ebene 3 ist 4, Ebene 4 ist 8. Mehrere Ebenen ergeben die Summe. So steht das Sammelstück in `pickup.tscn`:

  ```ini title=pickup.tscn
  [node name="Pickup" type="Area2D"]
  collision_layer = 4
  collision_mask = 2
  monitorable = false
  script = ExtResource("1")
  ```

  Werte, die dem Standard entsprechen, schreibt Godot nicht in die Datei. `crate.tscn` enthält deshalb keine Zeile `collision_layer`: Die Kiste liegt auf Ebene 1. Was nicht dasteht, ist der Standard.

  Im Code setzt du einzelne Ebenen mit ihrer Nummer zwischen 1 und 32 ([set_collision_mask_value](https://docs.godotengine.org/en/stable/classes/class_collisionobject2d.html#class-collisionobject2d-method-set-collision-mask-value)). Eine neue Area sucht schon Ebene 1. Willst du nur Ebene 3, leerst du die Maske zuerst:

  ```gdscript
  var hitbox := Area2D.new()
  print(hitbox.collision_mask)
  hitbox.collision_mask = 0
  hitbox.set_collision_mask_value(3, true)
  print(hitbox.collision_mask)
  ```

  ```text
  1
  4
  ```

  Mit einer Nummer außerhalb von 1 bis 32 meldet Godot 4.7.2 `Collision layer number must be between 1 and 32 inclusive.`, auch bei der Maske.

  > [!WARNING] Nummer oder Bitwert?
  > `set_collision_mask_value(4, true)` schaltet Ebene 4 ein, Bitwert 8. `collision_mask = 3` heißt Ebenen 1 und 2, nicht Ebene 3. Wer die beiden Schreibweisen mischt, sucht die falsche Ebene, und Godot meldet keinen Fehler, nur nichts.

  Damit niemand Nummern auswendig lernen muss, gibst du den Ebenen Namen: *Projekt → Projekteinstellungen → Allgemein → Ebenen-Namen → 2D-Physik*. Der Abschnitt ist ohne „Erweiterte Einstellungen“ sichtbar. In `project.godot` steht danach:

  ```ini title=project.godot
  [layer_names]

  2d_physics/layer_1="world"
  2d_physics/layer_2="player"
  2d_physics/layer_3="pickups"
  ```

  Die Namen helfen beim Lesen; gespeichert wird weiter der Bitwert. Eigene Skript-Variablen bekommen dasselbe Raster im Inspektor mit `@export_flags_2d_physics` ([Exporting bit flags](https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html#exporting-bit-flags)).

  > [!PRAXIS]
  > Leg die Ebenentabelle an, bevor ein Agent die ersten Kollisionen baut: Nummer, Name, wer dort liegt, wer sie sucht. Gib sie ihm mit in die Aufgabe und leg sie ins Repository. Bei einem Fehler vergleichst du dann vier Einstellungen mit einer Tabelle, statt sie aus dem Code zu rekonstruieren.

  ## Draufsicht: was eine Fußform bewirkt

  In einer Draufsicht steht der Kopf einer Figur im Bild über ihren Füßen. Das Testgelände hat dafür eine Konvention: Der Ursprung der Figur liegt an den Füßen, und ihre Form `Feet` ist ein flaches Rechteck von 10 × 6 Pixeln direkt darüber. Die Kiste kollidiert ebenso nur mit ihrem unteren Teil `Base` (16 × 8). Zusammen mit der Y-Sortierung im Node `Objects` (siehe [Modul über Szenenbäume](/godot/szenenbaum)) hat das eine Folge: Die Figur kann vor der Kiste stehen und hinter ihr, ihr Kopf überlappt die Kiste im Bild. Wie groß die Formen in deinem Spiel sind, entscheidest du; die Messungen zeigen, was die Wahl bewirkt.

  ![Zwei Ausschnitte aus dem Spiel mit sichtbaren Kollisionsformen: links steht die blaue Figur vor der braunen Kiste und verdeckt ihren unteren Teil, rechts steht sie dahinter und nur ihr Kopf ragt über die Kiste](/media/godot/kollision-ebenen/fussform@2x.png "Godot 4.7.2, Testgelände mit Debuggen → Sichtbare Collision-Shapes, sechsfach vergrößert")

  Gemessen mit Godot 4.7.2: Läuft die Figur von unten auf die Kiste zu, bleibt sie bei y ≈ 16 stehen, weil die Oberkante ihrer Füße (y − 6) die Unterkante der Kistenform (y = 10) erreicht. Ihr Bild reicht dann bis y = 0 und überdeckt die Kiste. Von oben bleibt sie bei y ≈ 2 stehen, und die Kiste verdeckt ihre Beine. Mit einer Form so groß wie die ganze Figur bleibt sie von unten schon bei y ≈ 26 stehen, 10 Pixel früher, und ihr Bild berührt die Kiste nur noch.

  Die Formen siehst du im laufenden Spiel mit *Debuggen → Sichtbare Collision-Shapes* (Visible Collision Shapes); im Terminal startet `godot --debug-collisions` das Projekt mit derselben Anzeige ([Visible collision shapes](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html#visible-collision-shapes), [Command line tutorial](https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html#debugging)). Im Testgelände ist die Fußform nur für Wände und Kisten da. Treffer im Kampf prüfen eigene Areas, Hitbox und Hurtbox, die anders sitzen können; deren Ebenentabelle steht in [Testszene: Angriff mit Frame-Daten](/combat/testszene-angriff).

  > [!DEEP] Floating statt Grounded
  > Die Figur steht auf `motion_mode` Floating. In diesem Modus gibt es keinen Boden und keine Decke, jede Kollision zählt als Wand, und beim Gleiten bleibt das Tempo konstant ([CharacterBody2D.motion_mode](https://docs.godotengine.org/en/stable/classes/class_characterbody2d.html#class-characterbody2d-property-motion-mode)). Grounded ist für Plattformer gedacht; dort wird die Figur an Schrägen schneller oder langsamer.

  ## Vorhersagen: welche Signale feuern

  Bevor du etwas startest, bestimmst du für jedes Paar zuerst, wer sucht: die Area, die das Signal senden soll, oder der Körper, der sich bewegt. Dann zwei Prüffragen. Ist beim Suchenden `monitoring` an (nur bei Areas), und darf das Ziel gefunden werden (`monitorable`, nur wenn das Ziel eine Area ist)? Enthält die Maske des Suchenden den Layer des Ziels? Erst wenn beide Antworten Ja lauten, feuert ein Signal oder blockiert ein Körper.

  Ein paar Änderungen am Testgelände, mit Godot 4.7.2 nachgespielt. Die Figur läuft jeweils über das erste Sammelstück:

  | Änderung | Zähler | Warum |
  | --- | --- | --- |
  | keine | 1 | Maske Pickup 2 trifft Layer Figur 2 |
  | Maske des Pickup auf 1 | 0 | das Pickup sucht die Welt, nicht die Figur |
  | `monitoring` des Pickup aus | 0 | das Pickup meldet nichts mehr |
  | Maske der Figur auf 0 | 1 | das Pickup sucht weiter; die Figur läuft aber durch die Kiste |

  Die letzte Zeile ist die lehrreichste: Wer welche Maske ändert, entscheidet, was sich ändert. Wann ein Signal genau kommt (einen Physik-Frame nach der Überlappung) und warum du in einem Signal Formen nur mit `set_deferred()` umschaltest, misst [Godot-Start](/combat/godot-start) nach.

  > [!INTERVIEW]
  > „Was ist der Unterschied zwischen Collision Layer und Collision Mask?“ Gute Antwort: Der Layer sagt, wo ein Objekt liegt, die Maske, welche Ebenen es absucht. Erkannt oder blockiert wird nur, wenn die Maske des Suchenden den Layer des anderen enthält. Beispiel: Ein Sammelstück liegt auf „pickups“ und sucht „player“. Dann ein Satz zur Fehlersuche: Ich prüfe zuerst, wer sucht, dann `monitoring` und `monitorable`, dann Maske gegen Layer, mit sichtbaren Formen im laufenden Spiel.

  ## Häufige Fehler

  - **Maske beim Falschen gesetzt.** Das Pickup findet die Figur nicht, also bekommt die Figur eine Maske für Ebene 3. Gesucht wird aber von der Area aus. Prüf die Maske dessen, der das Signal senden soll.
  - **Nummer und Bitwert verwechselt.** `set_collision_mask_value(4, true)` für Ebene 3 oder `collision_mask = 3` für Ebene 3. Beides sucht die falsche Ebene, ohne Fehlermeldung.
  - **Standard-Maske vergessen.** Neue Objekte suchen Ebene 1. Wer im Code nur Ebene 3 einschaltet, bekommt Maske 5 und findet nebenbei alle Wände.
  - **`monitorable` aus und trotzdem gesucht.** Eine zweite Area, etwa ein Magnet an der Figur, findet die Sammelstücke des Testgeländes nicht, weil sie nicht gefunden werden dürfen.
  - **Form fehlt.** Ein `CollisionShape2D` ohne Shape oder eine Area ohne Form-Kind kollidiert mit nichts. Das Warndreieck im Szenen-Dock sagt es dir.
  - **Form skaliert.** `scale` am `CollisionShape2D` statt `size` an der Form. Das sieht im Editor richtig aus, laut Doku kann die Form aber unerwartet kollidieren.
  - **Form größer als gedacht.** Deckt die Form die ganze Figur ab, obwohl die Figur hinter Kisten treten soll, bleibt sie mit dem Kopf an Kisten und Wänden hängen und kommt nie dahinter. Prüf mit sichtbaren Formen, ob die Form zu deiner Absicht passt.
  - **Geteilte Form geändert.** Der Radius eines Sammelstücks ändert sich, und alle anderen ändern sich mit, weil sie dieselbe Ressource benutzen.

  ## Zusammenfassung

  - Körper blockieren (`StaticBody2D`, `AnimatableBody2D`, `RigidBody2D`, `CharacterBody2D`), eine `Area2D` meldet nur, mit `body_entered` und `area_entered`.
  - Ein `CollisionShape2D` trägt genau eine Form. Größe über `size` oder `radius`, Skalierung bleibt `(1, 1)`. Formen sind Ressourcen und werden zwischen Instanzen geteilt.
  - Layer heißt „hier bin ich“, Maske „die suche ich“. Gemeldet oder blockiert wird nur, wenn die Maske des Suchenden den Layer des anderen enthält; die Maske des anderen zählt bei Areas und bei `move_and_slide()` nicht.
  - Eine Area meldet nur mit `monitoring` an. Ist das Ziel selbst eine Area, muss es außerdem `monitorable` an haben.
  - Der Inspektor zählt Ebenen ab 1, `.tscn` und `collision_mask = …` speichern Bitwerte: Ebene 3 ist 4. `set_collision_mask_value()` nimmt die Nummer.
  - Ebenen bekommen Namen unter *Projekteinstellungen → Ebenen-Namen → 2D-Physik*; Werte, die dem Standard entsprechen, fehlen in der `.tscn`.
  - Im Testgelände kollidiert die Figur mit einer flachen Form an den Füßen und kann so hinter Kisten treten; Treffer prüfen eigene Areas.
  - *Debuggen → Sichtbare Collision-Shapes* oder `--debug-collisions` zeigt die Formen im laufenden Spiel.
exercises:
  - id: koerper-zuordnen
    type: choice
    title: Welcher Node für welches Ding?
    prompt: |
      Für einen Testraum brauchst du vier Dinge. Welche Zuordnungen stimmen?
    options:
      - text: Eine Wand, die nie bewegt wird – `StaticBody2D`.
        correct: true
        why: Sie blockiert, die Physik bewegt sie nicht. Genau dafür ist der statische Körper da.
      - text: Eine Tür, die eine Animation zur Seite schiebt und die Figur dabei mitschiebt – `AnimatableBody2D`.
        correct: true
        why: Laut Doku schätzt er beim Bewegen seine Geschwindigkeit und schiebt Körper auf dem Weg mit. Ein `StaticBody2D` würde nur springen.
      - text: Ein Sammelstück, durch das die Figur hindurchläuft – `CharacterBody2D`.
        correct: false
        why: Ein Körper blockiert. Für etwas, das nur melden soll, nimmst du eine `Area2D` mit `body_entered`.
      - text: Eine Kugel, die nach einem Stoß von selbst weiterrollt und abprallt – `StaticBody2D`.
        correct: false
        why: Ein statischer Körper bewegt sich nicht von selbst. Rollen und Abprallen rechnet die Physik-Engine für einen `RigidBody2D`.
    explanation: |
      Die Frage ist immer: Wer bewegt das Ding, und soll es blockieren? Niemand bewegt die Wand, eine Animation bewegt die Tür und soll dabei schieben, die Physik bewegt die Kugel, dein Code die Figur. Was nur melden soll, ist eine `Area2D`. Wer hier den falschen Körper nimmt, merkt es oft erst, wenn sich etwas bewegt: Ein versetzter `StaticBody2D` springt durch die Figur, statt sie zu schieben.
    resources:
      - title: Godot Docs · Physics introduction · Collision objects
        url: https://docs.godotengine.org/en/stable/tutorials/physics/physics_introduction.html#collision-objects
      - title: Godot Docs · AnimatableBody2D
        url: https://docs.godotengine.org/en/stable/classes/class_animatablebody2d.html

  - id: einsammeln-ablauf
    type: order
    title: Vom Überlappen bis zur Zahl
    prompt: |
      Die Figur läuft im Testgelände über ein Sammelstück. Bring die Schritte in die Reihenfolge, in der sie passieren. Die Skripte `pickup.gd`, `player.gd` und `hud.gd` kennst du aus dem Testgelände; `Player.collected` ist mit `HUD.show_total` verbunden.
    lang: prose
    lines: |
      Der Physik-Schritt findet die Überlappung von Fußform und Kreis
      Das Pickup sendet body_entered mit der Figur als body
      _on_body_entered prüft, ob body ein Player ist
      collect(value) erhöht total der Figur
      Die Figur sendet collected mit dem neuen total
      show_total schreibt die Zahl ins Label
      queue_free entfernt das Pickup am Ende des Frames
    explanation: |
      Die Physik findet die Überlappung, weil die Maske des Pickup (Ebene 2) den Layer der Figur enthält. Danach läuft alles in einer Kette von Aufrufen: `body_entered` ruft `_on_body_entered`, das ruft `collect()`, das sendet `collected`, und die Verbindung aus `main.tscn` ruft sofort `show_total()`. Erst wenn die Kette zurückkehrt, ruft `pickup.gd` `queue_free()`; Godot entfernt das Pickup am Ende des Frames. Bleibt der Zähler bei 0, prüfst du die Kette von vorn: Ohne Überlappung kein Signal.
    resources:
      - title: Godot Docs · Using Area2D · Overlap detection
        url: https://docs.godotengine.org/en/stable/tutorials/physics/using_area_2d.html#overlap-detection

  - id: maske-als-zahl
    type: output
    title: Was steht in der Maske?
    prompt: |
      Was gibt dieser Schnipsel in Godot 4.7 aus? Zwei Zeilen.
    lang: gdscript
    code: |
      var hitbox := Area2D.new()
      hitbox.set_collision_mask_value(3, true)
      print(hitbox.collision_mask)
      hitbox.collision_mask = 3
      print(hitbox.get_collision_mask_value(3))
    expected: |
      5
      false
    hints:
      - Eine neue Area sucht schon Ebene 1.
      - Ebene 3 hat den Bitwert 4. Und welche Ebenen stecken in der Zahl 3?
    explanation: |
      Eine neue Area hat die Maske 1. `set_collision_mask_value(3, true)` schaltet Ebene 3 dazu, Bitwert 4: zusammen 5. `collision_mask = 3` setzt den Bitwert 3, also die Ebenen 1 und 2. Ebene 3 ist dann aus, daher `false`. Gemessen mit Godot 4.7.2. Wer nur Ebene 3 will, setzt vorher `collision_mask = 0` oder gleich `collision_mask = 4`.
    resources:
      - title: Godot Docs · CollisionObject2D.set_collision_mask_value
        url: https://docs.godotengine.org/en/stable/classes/class_collisionobject2d.html#class-collisionobject2d-method-set-collision-mask-value

  - id: zaehler-vorhersagen
    type: output
    title: Die Figur auf der falschen Ebene
    prompt: |
      Im Testgelände stellt jemand in `player.tscn` den Layer der Figur von 2 auf 1 um. Sonst bleibt alles wie in der Tabelle der Lektion. Die Figur läuft über alle drei Sammelstücke. Welche Zahl zeigt der Zähler danach?
    lang: text
    code: |
      Player  Layer 1 (vorher 2)   Maske 1
      Crate   Layer 1              Maske –
      Pickup  Layer 3              Maske 2
    expected: |
      0
    accept:
      - "0 Sammelstücke"
    hints:
      - Wer sucht hier wen?
      - Das Pickup sucht Ebene 2. Liegt dort noch jemand?
    explanation: |
      Das Pickup sucht mit seiner Maske Ebene 2. Die Figur liegt jetzt auf Ebene 1, also findet es sie nicht, und `body_entered` feuert nie. Die Figur selbst sucht weiter Ebene 1 und bleibt an der Kiste stehen; das hat mit dem Einsammeln nichts zu tun. Gemessen mit Godot 4.7.2: Zähler 0. Solche Fehler entstehen, wenn jemand den Layer für einen anderen Zweck umstellt und nicht nachsieht, wer die Ebene sucht.
    resources:
      - title: Godot Docs · Physics introduction · Collision layers and masks
        url: https://docs.godotengine.org/en/stable/tutorials/physics/physics_introduction.html#collision-layers-and-masks

  - id: magnet-vorhersagen
    type: output
    title: Ein Magnet an der Figur
    prompt: |
      Ein Agent hängt eine neue `Area2D` namens `Magnet` unter die Figur: Kreis mit Radius 24, Layer keiner, Maske Ebene 3, `monitoring` an. Die Sammelstücke bleiben wie im Testgelände. Die Figur läuft über ein Sammelstück. Wie oft feuert `area_entered` am Magnet?
    lang: text
    code: |
      Magnet  Layer –   Maske 3   monitoring an
      Pickup  Layer 3   Maske 2   monitorable aus
    expected: |
      0
    accept:
      - 0-mal
      - 0 Mal
      - keinmal
      - Keinmal
      - Null
      - gar nicht
      - "0 mal"
      - nie
      - Nie
    hints:
      - Für Area gegen Area reicht die Maske nicht.
      - Was heißt `monitorable` aus?
    explanation: |
      Maske und Layer passen, aber eine Area findet eine andere Area nur, wenn diese `monitorable` an hat. Beim Pickup des Testgeländes ist es aus, also feuert `area_entered` nie. Das Einsammeln selbst klappt weiter, denn das Pickup findet die Figur über `body_entered`. Gemessen mit Godot 4.7.2: Mit `monitorable` aus meldet der Magnet 0-mal, mit `monitorable` an einmal.
    resources:
      - title: Godot Docs · Area2D.monitorable
        url: https://docs.godotengine.org/en/stable/classes/class_area2d.html#class-area2d-property-monitorable

  - id: stopp-position
    type: output
    title: Wo bleibt die Figur stehen?
    prompt: |
      Die Figur startet bei (40, 40) und läuft gerade nach oben auf die Kiste bei (40, 10) zu. Bei welchem y bleibt ihr Ursprung stehen? Antworte in ganzen Pixeln.
    lang: text
    code: |
      Figur   Ursprung an den Füßen
              Feet: Rechteck 10 × 6, Mitte (0, -3)
      Kiste   Ursprung bei (40, 10), an der Unterkante
              Base: Rechteck 16 × 8, Mitte (0, -4)
    expected: |
      16
    accept:
      - y = 16
      - y=16
      - "16 px"
      - 16 Pixel
      - y = 16 px
    hints:
      - Die Kistenform reicht von y = 2 bis y = 10.
      - Die Fußform reicht von y − 6 bis y. Wann berührt ihre Oberkante die Unterkante der Kiste?
    explanation: |
      Die Form der Kiste liegt 8 Pixel hoch über ihrem Ursprung, also von y = 2 bis 10. Die Fußform reicht von y − 6 bis y. Sie stößt an, wenn y − 6 = 10 ist, also bei y = 16. Godot 4.7.2 meldet 16 mit einem Bruchteil eines Pixels Sicherheitsabstand. Das Bild der Figur reicht dann bis y = 0 und überdeckt den unteren Teil der Kiste: Sie steht davor. Eine Form über die ganze Figur hätte sie schon bei y = 26 aufgehalten.
    resources:
      - title: Godot Docs · RectangleShape2D
        url: https://docs.godotengine.org/en/stable/classes/class_rectangleshape2d.html

  - id: pickup-tscn
    type: gap
    title: Das Sammelstück als Text
    prompt: |
      Ergänze die drei Werte in `pickup.tscn`: Das Sammelstück liegt auf Ebene 3, sucht die Figur auf Ebene 2 und darf von keiner anderen Area gefunden werden.
    lang: ini
    code: |
      [node name="Pickup" type="Area2D"]
      collision_layer = ⟦4⟧
      collision_mask = ⟦2⟧
      monitorable = ⟦false⟧
      script = ExtResource("1")
    gaps:
      - label: Layer als Bitwert
        hint: Ebene n hat den Wert 2 hoch (n − 1).
      - label: Maske als Bitwert
        hint: Ebene 2 hat den Wert 2.
      - label: Gefunden werden
        hint: Ein Wahrheitswert, wie GDScript ihn schreibt.
    explanation: |
      In der `.tscn` stehen Bitwerte: Ebene 3 ist 4, Ebene 2 ist 2. Der Inspektor zeigt dieselben Werte als Kästchen 3 und 2. `monitorable = false` steht nur da, weil der Standard `true` ist; `monitoring` fehlt, weil es auf dem Standard `true` bleibt. Wer `collision_layer = 3` schreibt, legt das Sammelstück auf die Ebenen 1 und 2.
    resources:
      - title: Godot Docs · Physics introduction · Code example
        url: https://docs.godotengine.org/en/stable/tutorials/physics/physics_introduction.html#code-example

  - id: formen-sichtbar-starten
    type: command
    title: Formen sehen, ohne Menü
    prompt: |
      Starte das Testgelände aus dem Terminal so, dass alle Kollisionsformen im laufenden Spiel sichtbar sind, ohne den Haken im Menü *Debuggen* zu setzen.
    context: |
      Du bist im Projektordner (dort liegt `project.godot`). `godot` steht für dein Godot-4.7-Binary.
    answers:
      - godot --debug-collisions
      - godot --path . --debug-collisions
      - godot --debug-collisions --path .
    explanation: |
      `--debug-collisions` zeigt die Kollisionsformen beim Start, wie *Debuggen → Sichtbare Collision-Shapes* im Editor. Liegt `project.godot` im aktuellen Ordner, findet Godot das Projekt selbst; sonst gibst du es mit `--path` an. Mit Godot 4.7.2 geprüft: In beiden Fällen ist `debug_collisions_hint` des SceneTree an. Praktisch für Testläufe, die du per Skript oder Tastenkürzel startest.
    resources:
      - title: Godot Docs · Command line tutorial · Debugging
        url: https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html#debugging

  - id: ganze-figur
    type: choice
    title: Die Figur kommt nicht an die Kiste
    prompt: |
      Im Testgelände soll die Figur vor die Kiste treten können, so wie es die Vorlage vorsieht. Nach einer Änderung bleibt sie von unten stehen, bevor ihr Bild die Kiste überlappt. Das Bild zeigt den Moment mit sichtbaren Kollisionsformen. Welche Änderung erklärt das?

      ![Spielbild mit sichtbaren Kollisionsformen: Unter der braunen Kiste steht die blaue Figur, ihre Kollisionsform ist ein hohes Rechteck über die ganze Figur und stößt an die Form der Kiste](/media/godot/kollision-ebenen/ganzkoerper@2x.png "Godot 4.7.2, Testgelände mit sichtbaren Formen, siebenfach vergrößert")
    options:
      - text: Die Form `Feet` deckt jetzt die ganze Figur ab, nicht mehr nur die Füße wie in der Vorlage.
        correct: true
        why: Das Rechteck ist so hoch wie die Figur. Es stößt mit dem Kopf an die Kistenform, deshalb bleibt die Figur 10 Pixel früher stehen.
      - text: Die Maske der Kiste muss Ebene 2 enthalten, sonst stimmt der Abstand nicht.
        correct: false
        why: Die Maske der Kiste spielt beim Anstoßen keine Rolle. Ob die Figur stehen bleibt, entscheidet ihre eigene Maske.
      - text: Die Y-Sortierung ist aus, deshalb sieht es nur so aus, als stünde die Figur zu weit weg.
        correct: false
        why: Die Y-Sortierung ändert nur die Zeichenreihenfolge. Die Figur bleibt tatsächlich früher stehen, das zeigt die Form.
      - text: Die Kistenform `Base` ist zu klein und muss die ganze Kiste abdecken.
        correct: false
        why: Dann bliebe die Figur noch früher stehen und könnte auch von oben nie hinter die Kiste.
    explanation: |
      Die Vorlage legt `Feet` als flaches Rechteck an die Füße, damit die Figur vor und hinter die Kiste treten kann. Mit einer Form über die ganze Figur stößt der Kopf an die Kiste, und die Figur bleibt bei y ≈ 26 statt bei y ≈ 16 stehen, gemessen mit Godot 4.7.2. Welche Form deine Figur bekommt, entscheidest du; hier widerspricht die Änderung der Absicht der Vorlage. Prüf solche Fälle mit sichtbaren Formen: Das Bild allein zeigt nur, dass etwas nicht passt, die Form zeigt, warum.
    resources:
      - title: Godot Docs · Overview of debugging tools · Visible collision shapes
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html#visible-collision-shapes

  - id: magnet-bitwert
    type: bug
    title: Der Magnet findet nichts
    prompt: |
      Der Magnet aus einer früheren Aufgabe hat jetzt dieses Skript. Die Sammelstücke liegen auf Ebene 3 „pickups“, und `monitorable` hast du bei ihnen schon eingeschaltet. Trotzdem gibt der Magnet nie etwas aus, auch wenn sich die Formen mit sichtbaren Kollisionsformen deutlich überlappen. Finde die Zeile und korrigiere sie.
    lang: gdscript
    code: |
      extends Area2D

      ## Magnet: meldet Sammelstücke in der Nähe (Testwerkzeug).

      func _ready() -> void:
      	collision_layer = 0
      	collision_mask = 0
      	set_collision_mask_value(4, true)
      	area_entered.connect(_on_area_entered)


      func _on_area_entered(area: Area2D) -> void:
      	print("Magnet findet ", area.name)
    lines: [8]
    fix:
      - line: 8
        answers:
          - set_collision_mask_value(3, true)
          - self.set_collision_mask_value(3, true)
          - collision_mask = 4
          - self.collision_mask = 4
          - collision_mask |= 4
          - self.collision_mask |= 4
    explanation: |
      `set_collision_mask_value()` nimmt die Ebenennummer, nicht den Bitwert. Mit 4 sucht der Magnet Ebene 4 (Bitwert 8), auf der nichts liegt. Richtig ist Ebene 3, oder direkt der Bitwert `collision_mask = 4`. Mit Godot 4.7.2 geprüft: Die falsche Fassung hat Maske 8 und meldet nichts, die korrigierte Maske 4 und meldet `Magnet findet Pickup`.
    resources:
      - title: Godot Docs · CollisionObject2D.set_collision_mask_value
        url: https://docs.godotengine.org/en/stable/classes/class_collisionobject2d.html#class-collisionobject2d-method-set-collision-mask-value

  - id: pickup-inspektor-fehler
    type: bug
    title: Der Zähler bleibt bei 0
    prompt: |
      Nach einer Änderung am Testgelände bleibt der Zähler bei 0. Mit sichtbaren Formen siehst du, dass der Kreis des Sammelstücks die Fußform überlappt. Der Inspektor des Pickup sieht so aus:

      ![Inspektor des Pickup: Monitoring an, Monitorable aus, Layer 3, im Raster Mask ist Kästchen 1 hervorgehoben und neben Mask fehlt der Zurücksetzen-Pfeil](/media/godot/kollision-ebenen/pickup-maske-1.png "Godot 4.7.2, Inspektor von pickup.tscn nach der Änderung")

      Welche Einstellung verursacht das? Wähle die Zeile und schreib sie richtig. Das Wort „An“ steht neben jedem Kästchen, auch neben einem ausgeschalteten; es zählt nur der Haken.
    lang: text
    code: |
      Monitoring    an
      Monitorable   aus
      Layer         3
      Mask          1
    lines: [4]
    fix:
      - line: 4
        answers:
          - Mask 2
          - mask 2
          - Maske 2
          - maske 2
          - "Mask: 2"
          - "Maske: 2"
          - Mask = 2
          - Maske = 2
          - Mask 2 player
          - Mask 2 (player)
          - collision_mask = 2
    explanation: |
      Das Pickup sucht Ebene 1, die Welt. Die Figur liegt auf Ebene 2, also feuert `body_entered` nie. Der fehlende Zurücksetzen-Pfeil neben Mask verrät es: Die Maske steht wieder auf dem Standard, Ebene 1. `Monitorable` aus ist hier kein Fehler; es verhindert nur, dass andere Areas das Pickup finden. Mit Godot 4.7.2 geprüft: Maske 1 ergibt Zähler 0.
    resources:
      - title: Godot Docs · Area2D.monitoring
        url: https://docs.godotengine.org/en/stable/classes/class_area2d.html#class-area2d-property-monitoring

  - id: kiste-maske-null
    type: explain
    title: Warum die Kiste niemanden sucht
    prompt: |
      In `crate.tscn` steht `collision_mask = 0`, und die Figur bleibt trotzdem an der Kiste stehen. Erkläre in zwei bis vier Sätzen, warum das funktioniert und wann die Maske der Kiste doch wichtig würde.
    lang: ini
    code: |
      ; crate.tscn
      [node name="Crate" type="StaticBody2D"]
      collision_mask = 0

      ; player.tscn
      [node name="Player" type="CharacterBody2D"]
      collision_layer = 2
      collision_mask = 1
    points:
      - Blockiert wird, wenn die Maske des bewegten Körpers den Layer des anderen enthält; die Figur sucht Ebene 1, die Kiste liegt dort.
      - Die Kiste bewegt sich nie, ihre Maske wird beim Anstoßen nicht gefragt.
      - Wichtig würde ihre Maske erst, wenn die Kiste selbst etwas finden müsste, etwa als `CharacterBody2D`, der sich bewegt und an Wänden hängen bleiben soll.
    explanation: |
      Ob ein Körper an einem anderen hängen bleibt, entscheidet die Maske dessen, der sich bewegt. Die Figur sucht Ebene 1, die Kiste liegt dort (der Standard, deshalb fehlt die Zeile `collision_layer`), also bleibt die Figur stehen. Die Kiste bewegt sich nie und muss niemanden finden; Maske 0 macht das sichtbar. Gemessen mit Godot 4.7.2: Mit Maske 0, 1 oder 2 bei der Kiste bleibt die Figur an derselben Stelle stehen, bei y ≈ 16. Würde aus der Kiste ein Körper, der sich selbst bewegt und anstoßen soll, bräuchte sie eine passende Maske.
    resources:
      - title: Godot Docs · CollisionObject2D.collision_mask
        url: https://docs.godotengine.org/en/stable/classes/class_collisionobject2d.html#class-collisionobject2d-property-collision-mask

  - id: ebenen-planen
    type: practice
    title: Deine Ebenentabelle
    prompt: |
      Plane die Kollisionsebenen für dein eigenes Spiel, so weit du es heute kennst. Schreib in kurzen Zeilen: Nummer und Name jeder Ebene, welche Objekte dort liegen und welche Objekte sie suchen. Welche Ebenen du brauchst, entscheidest du; die Tabelle des Testgeländes ist nur ein Beispiel für die Form.
    lang: prose
    checklist:
      - Jede Ebene hat eine Nummer und einen Namen, den du in den Projekteinstellungen so eintragen kannst.
      - Für jede Art von Objekt steht da, auf welcher Ebene es liegt und welche Ebenen es sucht.
      - Bei jeder Area steht, ob sie melden soll (`monitoring`) und ob andere Areas sie finden dürfen (`monitorable`).
      - Du hast mindestens ein Paar notiert, das sich absichtlich nicht finden soll, und geprüft, dass deine Tabelle das sicherstellt.
      - Kampfflächen (Hitbox, Hurtbox) stehen getrennt von den Formen für Wände und Füße, falls dein Spiel sie braucht.
    hints:
      - Fang mit dem an, was blockiert, dann mit dem, was meldet.
      - Prüf jedes Paar mit den drei Fragen aus der Lektion.
    explanation: |
      Die Tabelle ist die Vorgabe, die du einem Coding-Agenten mitgibst und mit der du später jeden Kollisionsfehler prüfst. Ob dein Spiel drei oder zehn Ebenen braucht und wie sie heißen, hängt an deinen Objekten und ist deine Entscheidung. Wichtig ist, dass jede Paarung, die etwas auslösen soll, über die Regel „Maske des Suchenden enthält Layer des Ziels“ erklärbar ist.
    resources:
      - title: Godot Docs · Physics introduction · Collision layers and masks
        url: https://docs.godotengine.org/en/stable/tutorials/physics/physics_introduction.html#collision-layers-and-masks
