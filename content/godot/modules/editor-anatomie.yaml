id: editor-anatomie
title: "Der Editor als Werkstatt: Docks, Projektordner und res://"
level: 1
minutes: 100
summary: Was ein Coding-Agent baut, liegt als Textdatei im Projektordner. Hier lernst du, diese Dateien zu lesen, im Editor zu finden und an den Docks abzulesen, was eingestellt ist und was nur Standard ist.
place: unterwegs
goals:
  - Du ordnest die Dateien eines Godot-Projekts ein (`project.godot`, `.tscn`, `.tres`, `.gd`, `.uid`, `.import`, `.godot/`) und weißt, welche Godot selbst erzeugt.
  - Du unterscheidest `res://` und `user://` und findest den Ordner hinter `user://` unter Linux.
  - Du sagst zu einer Frage an ein Projekt, welches Dock sie beantwortet.
  - Du liest den Inspektor nach Vererbungsabschnitten und erkennst am Zurücksetzen-Pfeil, welche Werte vom Standard abweichen.
  - Du startest gezielt die Hauptszene oder die offene Szene und weißt, wo Ausgaben landen.
