lesson: |
  Ein Coding-Agent meldet: „Bewegung eingebaut. Die Werte liegen in `data/player_stats.tres`, die Figur ist in `main.tscn` eingesetzt.“ Du öffnest das Projekt und siehst acht Bereiche, drei Leisten und eine graue Fläche. Wo liegt die Datei? Wo stellst du die Höchstgeschwindigkeit ein? Und woran erkennst du, ob ein Wert dort bewusst gesetzt wurde oder nur der Standard ist?

  Bevor du irgendetwas abstimmst, musst du diese Fragen in einer Minute beantworten können. Alles, was ein Agent baut, landet als Datei im Projektordner. Der Editor zeigt dir diese Dateien, und was du dort änderst, schreibt er zurück. Die Beispiele stammen aus dem **Testgelände**, einem neutralen Projekt mit einer Figur, einer Kiste, drei Sammelstücken und einem Zähler. Du baust es in [Ein fremdes Projekt erkunden](/godot/projekt-erkunden) selbst auf; hier reichen die Screenshots. Installation und Pixel-Einstellungen stehen in [Godot-Start](/combat/godot-start). Alles gilt für Godot 4.7.2.

  ## Der Projektordner: jede Einstellung ist eine Datei

  Godot hält jeden Ordner mit einer Datei `project.godot` für ein Projekt. Der Ort dieser Datei ist die Wurzel, die Godot `res://` nennt ([File system](https://docs.godotengine.org/en/stable/tutorials/scripting/filesystem.html#project-godot)). Nach dem ersten Öffnen im Editor sieht das Testgelände so aus:

  ```console
  $ ls -A
  crate.tscn             pickup.gd
  data                   pickup.gd.uid
  .godot                 pickup.tscn
  hud.gd                 player.gd
  hud.gd.uid             player.gd.uid
  main.tscn              player.tscn
  movement_stats.gd      project.godot
  movement_stats.gd.uid
  ```

  - **`project.godot`**: Projekteinstellungen wie Name, Hauptszene, Eingabeaktionen, Layer-Namen und Autoloads. Der Editor schreibt sie, wenn du unter *Projekt → Projekteinstellungen* etwas änderst.
  - **`.tscn`**: eine Szene, also ein Baum aus Nodes mit ihren geänderten Eigenschaften. Der Editor schreibt sie beim Speichern.
  - **`.tres`**: eine Ressource, ein Datenobjekt wie die Bewegungswerte. Du änderst sie im Inspektor.
  - **`.gd`**: ein GDScript, von dir oder vom Agenten.
  - **`.gd.uid`**: die eindeutige ID des Skripts. Godot legt sie selbst an.
  - **`.png.import`**: die Import-Einstellungen eines Bildes; Töne bekommen ebenso eine `.import`. Das Import-Dock schreibt sie.
  - **`.godot/`**: der Cache mit importierten Dateien und dem Zustand des Editors. Godot erzeugt ihn jederzeit neu.

  Die `.uid`-Dateien gibt es seit Godot 4.4. Skripte haben keinen Platz für Godot-eigene Daten, also legt Godot die ID daneben ab. Szenen und Ressourcen tragen ihre ID im Dateikopf, importierte Dateien in der `.import`-Datei ([Godot 4.4: Universal UID support](https://godotengine.org/releases/4.4/#universal-uid-support)). Legst du ein Bild `pruefmuster.png` ins Projekt, erscheint daneben `pruefmuster.png.import`, und das umgewandelte Ergebnis landet in `.godot/imported/`. Wie du den Import einstellst, steht im [Modul zum Sprite-Import](/godot/sprites-importieren).

  `project.godot` ist eine Textdatei im INI-Format. Ein Ausschnitt aus dem Testgelände:

  ```ini title=project.godot
  [application]

  config/name="Testgelände"
  run/main_scene="res://main.tscn"
  config/features=PackedStringArray("4.7", "GL Compatibility")

  [layer_names]

  2d_physics/layer_1="world"
  2d_physics/layer_2="player"
  2d_physics/layer_3="pickups"
  ```

  Ein Autoload, ein Node, den Godot vor jeder Szene in den Baum hängt, stünde als `[autoload]` mit einer Zeile wie `HitLog="*res://hit_log.gd"` in derselben Datei ([Singletons (Autoload)](https://docs.godotengine.org/en/stable/tutorials/scripting/singletons_autoload.html#autoload)). Das Testgelände hat keinen.

  Weil alles Text ist, zeigt Git dir, was eine Sitzung im Editor geändert hat. Die Vorlagen des Testgeländes sind von Hand geschrieben, `data/player_stats.tres` nennt alle drei Werte. Stellst du im Inspektor `max_speed` von 90 auf 120 und speicherst, schreibt der Editor die Datei zum ersten Mal selbst:

  ```console
  $ git diff
  diff --git a/data/player_stats.tres b/data/player_stats.tres
  index 7009262..02fefd4 100644
  --- a/data/player_stats.tres
  +++ b/data/player_stats.tres
  @@ -1,9 +1,7 @@
  -[gd_resource type="Resource" script_class="MovementStats" format=3]
  +[gd_resource type="Resource" script_class="MovementStats" format=3 uid="uid://c328erhiur8b8"]

  -[ext_resource type="Script" path="res://movement_stats.gd" id="1"]
  +[ext_resource type="Script" uid="uid://bwctjxhdkev23" path="res://movement_stats.gd" id="1"]

   [resource]
   script = ExtResource("1")
  -max_speed = 90.0
  -acceleration = 600.0
  -friction = 900.0
  +max_speed = 120.0
  ```

  Drei Dinge passieren: Der Kopf und der Verweis aufs Skript bekommen eine `uid`. `max_speed` bekommt den neuen Wert. Und `acceleration` und `friction` verschwinden, weil ihre Werte dem Standard aus `movement_stats.gd` entsprechen; der Editor speichert nur, was davon abweicht. Ab jetzt sind Diffs klein. Stellst du danach `acceleration` auf 700, ändert sich genau eine Zeile:

  ```console
  $ git diff
  diff --git a/data/player_stats.tres b/data/player_stats.tres
  index 02fefd4..299394e 100644
  --- a/data/player_stats.tres
  +++ b/data/player_stats.tres
  @@ -5,3 +5,4 @@
   [resource]
   script = ExtResource("1")
   max_speed = 120.0
  +acceleration = 700.0
  ```

  > [!MERKE]
  > Was in einer `.tscn` oder `.tres` nicht steht, hat den Standardwert. Ändert jemand den Standard im Skript, ändert sich jeder Wert, der nicht ausdrücklich in einer Datei steht.

  > [!DEEP] Der Cache-Ordner
  > Nach dem ersten Öffnen enthält `.godot/` unter anderem `imported/` (umgewandelte Assets), `editor/` (offene Szenen, eingeklappte Abschnitte), `uid_cache.bin` und `global_script_class_cache.cfg` (alle `class_name`). Nichts davon ist Quelle. Löschst du den Ordner bei geschlossenem Editor, erzeugt Godot ihn beim nächsten Öffnen neu und importiert alle Assets erneut. Deshalb gehört er nicht ins Repository ([Git-Einstieg](/git/git-einstieg)).

  ## `res://` und `user://`: zwei Wurzeln

  `res://` zeigt immer auf den Projektordner. Im Editor kannst du dort schreiben, in einem exportierten Spiel ist er nur lesbar ([File system](https://docs.godotengine.org/en/stable/tutorials/scripting/filesystem.html#resource-path)). Für Spielstände, Einstellungen und Protokolle gibt es `user://`: Godot legt den Ordner selbst an, und er ist immer beschreibbar ([File paths](https://docs.godotengine.org/en/stable/tutorials/io/data_paths.html#accessing-persistent-user-data-user)). Unter Linux heißt er `~/.local/share/godot/app_userdata/<Projektname>/`, der Name kommt aus `config/name`:

  ```gdscript
  print(ProjectSettings.globalize_path("user://"))
  ```

  ```text
  /home/stevenh/.local/share/godot/app_userdata/Testgelände/
  ```

  Dort liegt nach dem ersten Start schon etwas: Godot schreibt Protokolle der Läufe nach `user://logs/godot.log` ([Logging](https://docs.godotengine.org/en/stable/tutorials/scripting/logging.html)). Im Editor öffnet *Projekt → Userdaten-Ordner öffnen* den Ordner im Dateimanager.

  Aus dem Web kennst du die Trennung: Der gebaute Code der App ist schreibgeschützt, Nutzerdaten kommen in `localStorage` oder IndexedDB. Anders als dort ist `user://` ein normaler Ordner, dessen Dateien du mit `ls` und jedem Editor ansehen kannst.

  ## Docks und Bildschirme: welches Fenster beantwortet welche Frage

  ![Godot-Editor mit geöffneter main.tscn; acht gelbe Nummern markieren Szenen-Dock, Dateisystem, die Hauptbildschirme 2D bis Asset Store, die Start-Knöpfe, Inspektor, den Reiter Signale, das untere Panel und die 2D-Ansicht](/media/godot/editor-anatomie/editor-ueberblick@2x.png "Godot 4.7.2, Testgelände, main.tscn mit gewähltem Player")

  Auf dem Handy tippst du das Bild an, dann öffnet es sich groß.

  | Bereich | Frage, die er beantwortet |
  | --- | --- |
  | 1 · **Szenen-Dock**, Reiter „Szene“ (Scene) | Woraus besteht die offene Szene, welcher Node ist gewählt? |
  | 2 · **Dateisystem** (FileSystem) | Welche Dateien hat das Projekt, welche ist die Hauptszene? |
  | 3 · **2D, 3D, Skript, Spiel, Asset Store** | Bearbeite ich Szene oder Code, oder schaue ich dem laufenden Spiel zu? |
  | 4 · **Start-Knöpfe** | Welche Szene startet? |
  | 5 · **Inspektor** (Inspector) | Welche Werte hat der gewählte Node oder die Ressource? |
  | 6 · **Signale** (Signals), **Gruppen** (Groups) | Wer reagiert auf welches Ereignis, in welchen Gruppen steckt der Node? |
  | 7 · **unteres Panel**: Ausgabe, Debugger, Audio, Animation, Shader-Editor | Was hat das Spiel ausgegeben, welche Fehler gab es? |
  | 8 · **2D-Ansicht** | Wo liegt was im Raum? |

  Hinter den Reitern stecken weitere Docks: **Importieren** neben dem Reiter Szene, **Verlauf** neben Dateisystem. Der Verlauf listet deine letzten Änderungen, die du rückgängig machen kannst. Gruppen ist in 4.7.2 ein eigenes Dock neben Signale; bei schmalem Fenster erreichst du es über die Pfeile rechts der Reiter. Jedes Dock findest du außerdem unter *Editor → Editor-Docks*. Die drei Filterfelder „Nodes filtern“, „Dateien filtern“ und „Eigenschaften filtern“ durchsuchen jeweils ihr Dock ([First look at Godot's interface](https://docs.godotengine.org/en/stable/getting_started/introduction/first_look_at_the_editor.html)).

  Das Dateisystem-Dock zeigt nicht alles, was im Ordner liegt:

  ![Dateisystem-Dock des Testgeländes: Favoriten, res://, Ordner data mit player_stats.tres, darunter die Szenen und Skripte; main.tscn ist blau, .uid-Dateien fehlen in der Liste](/media/godot/editor-anatomie/dateisystem@2x.png "Godot 4.7.2, Dateisystem-Dock des Testgeländes")

  `.uid`- und `.import`-Dateien blendet es aus, `.godot/` ebenso. Die Hauptszene, hier `main.tscn`, steht in Blau. Was das Dock nicht zeigt, siehst du im Terminal.

  ## Den Inspektor lesen

  Der Inspektor zeigt die Eigenschaften des gewählten Nodes, gegliedert nach Klassen. Oben steht die Klasse des Skripts, darunter jede Engine-Klasse, von der der Node erbt ([Inspector Dock](https://docs.godotengine.org/en/stable/tutorials/editor/inspector_dock.html#usage)). Für den Wurzel-Node von `player.tscn`:

  ![Inspektor des Player aus player.tscn: Abschnitte Player, CharacterBody2D, CollisionObject2D, Node2D, CanvasItem, Node; Zurücksetzen-Pfeile bei Stats, Motion Mode und Layer](/media/godot/editor-anatomie/inspektor-player@2x.png "Godot 4.7.2, Inspektor von player.tscn, Wurzel-Node Player")

  - **Player** kommt aus `class_name Player` in `player.gd`. Hier stehen die exportierten Variablen `stats` und `debug_log`. Ein Skript ohne `class_name` erscheint mit seinem Dateinamen, etwa `pickup.gd`.
  - **CharacterBody2D → CollisionObject2D → Node2D → CanvasItem → Node** ist die Vererbungskette. Zwischen CharacterBody2D und CollisionObject2D liegt noch `PhysicsBody2D`; es bringt keine eigenen Eigenschaften mit und bekommt deshalb keinen Abschnitt.
  - Suchst du eine Eigenschaft, frag dich, welche Klasse sie einführt: Kollisionsebenen gehören zu CollisionObject2D, die Position zu Node2D, Sichtbarkeit und Zeichenreihenfolge (*Ordering*) zu CanvasItem.

  Die Namen im Inspektor sind aufbereitet: Aus `max_speed` wird „Max Speed“. Fährst du mit der Maus über eine Eigenschaft, zeigt der Tooltip die Beschreibung und, wie sie im Skript heißt. Steht über einer exportierten Variable ein Kommentar mit `##`, wird er zum Tooltip ([Documentation comments](https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_documentation_comments.html)).

  **Der Zurücksetzen-Pfeil** (↺) rechts neben einem Namen heißt: Dieser Wert weicht vom Standard ab. Ein Klick setzt ihn zurück. Im Screenshot tragen ihn `Stats` (Standard: leer), `Motion Mode` (Standard: Grounded) und `Layer` (Standard: Ebene 1). `Mask` steht auf Ebene 1, das ist der Standard, also kein Pfeil. Was als Standard gilt, hängt vom Ort ab: In einer eigenen Szene ist es der Standard der Klasse oder des Skripts. Bei einer eingesetzten Szene ist es der Wert aus deren Datei. Das vertieft [Instanzen und Ressourcen](/godot/instanzen-ressourcen).

  > [!PRAXIS]
  > Hat ein Agent eine Szene gebaut, wähl im Werkzeugmenü neben „Eigenschaften filtern“ *Nicht-Default expandieren*. Dann sind nur die Abschnitte aufgeklappt, in denen etwas vom Standard abweicht, und du siehst in Sekunden, was er eingestellt hat. Vor dem Commit liest du dieselbe Liste als `git diff` der `.tscn`.

  **Ressourcenfelder** wie `Stats` zeigen ein Würfelsymbol und den Dateinamen. Ein Klick klappt die Ressource auf, und du bearbeitest ihre Werte direkt darunter. Das Kettensymbol davor zeigt Godot seit 4.6 bei Ressourcen, die der Node mit anderen teilt oder aus einer eigenen Datei lädt; der Tooltip nennt sie „extern für die Szene“ ([Godot 4.6](https://godotengine.org/releases/4.6/)). Öffnest du `player_stats.tres` selbst, siehst du, was **Export-Hints** bewirken. In `movement_stats.gd` stehen die Variablen so:

  ```gdscript
  @export_range(0, 400, 1, "suffix:px/s") var max_speed := 90.0
  @export_range(0, 5000, 10, "suffix:px/s²") var acceleration := 600.0
  @export_range(0, 5000, 10, "suffix:px/s²") var friction := 900.0
  ```

  ![Inspektor von player_stats.tres: Abschnitt MovementStats mit Max Speed 90 px/s, Acceleration 600 px/s² und Friction 900 px/s², jeweils mit Schieberegler](/media/godot/editor-anatomie/stats-regler@2x.png "Godot 4.7.2, Inspektor von data/player_stats.tres")

  `export_range` macht aus der Zahl einen Schieberegler mit Grenzen und Schrittweite, `suffix:` hängt die Einheit an ([GDScript exported properties](https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html)). Die Werte sind im Testgelände Platzhalter. Welche Werte deine Figur bekommt, entscheidest du; wie du sie abstimmst, zeigt das [Modul zu Eingabeaktionen und Parametern](/godot/aktionen-parameter).

  ## Starten: Hauptszene, offene Szene und das Spiel

  Oben rechts liegen die Start-Knöpfe. Ihre Tastenkürzel und Tooltips in 4.7.2:

  - **F5** – „Die Hauptszene des Projekts abspielen.“ Startet die Szene aus `run/main_scene`.
  - **F6** – „Zur Zeit bearbeitete Szene abspielen.“ Startet die Szene im aktiven Tab.
  - **Strg + Umschalt + F5** – „Eigene Szene abspielen.“ Startet eine Szene, die du auswählst.
  - **F7** – „Ausführung des laufenden Projekts zum Debuggen pausieren.“ Hält das Spiel im Debugger an.
  - **F8** – „Laufendes Projekt stoppen.“

  F6 ist praktisch, um eine Szene allein zu prüfen, aber auch eine Falle: Ist `player.tscn` der aktive Tab, läuft nur die Figur, ohne Boden, Sammelstücke und Zähler. Die Hauptszene änderst du im Dateisystem-Dock per Rechtsklick → *Als Hauptszene setzen* oder in den Projekteinstellungen ([ProjectSettings](https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-application-run-main-scene)).

  Seit Godot 4.4 kann der Editor das laufende Spiel einbetten ([Godot 4.4: Embedded game window](https://godotengine.org/releases/4.4/#embedded-game-window)). In 4.7 startet es standardmäßig in einem schwebenden Fenster mit einer Leiste für Pause, Einzelbild und Spieltempo; der Bildschirm **Spiel** holt dieses Fenster nach vorn ([Game embedding](https://docs.godotengine.org/en/stable/tutorials/editor/game_embedding.html)). Pause und Einzelbild kennst du aus [Godot-Start](/combat/godot-start). Was du am laufenden Spiel änderst, ist nach dem Beenden weg. Die Ausgaben von `print()` erscheinen im unteren Panel unter **Ausgabe**. Fehler des laufenden Spiels sammelt der **Debugger**; sein Reiter zeigt dann eine rote Zahl, etwa „Debugger (3335)“. Wie du sie liest, zeigt das [Modul zur Fehlersuche](/godot/fehler-eingrenzen).

  Vom Terminal aus geht dasselbe ohne Editor:

  ```console
  $ godot --path ~/godot/testgelaende
  $ godot --path ~/godot/testgelaende --scene res://player.tscn
  $ godot -e --path ~/godot/testgelaende
  ```

  Die erste Zeile startet die Hauptszene, die zweite eine bestimmte Szene, die dritte öffnet den Editor ohne Projektmanager ([Command line tutorial](https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html#command-line-reference)). `godot` steht hier für dein Binary, etwa aus `pacman` oder als Link auf die heruntergeladene Datei.

  ## Was du aus dem Web schon kennst

  - **Szenenbaum ≈ DOM.** Aber Nodes sind Objekte mit Verhalten, kein Markup, und die Reihenfolge im Baum bestimmt auch, wann ihr Code läuft.
  - **Szene (`.tscn`) ≈ Komponente.** Aber eine Szene speichert Startwerte, keine Render-Funktion.
  - **Instanz ≈ eingesetzte Komponente.** Abweichungen stehen als Overrides in der Eltern-Szene.
  - **`@export` ≈ Props.** Der Wert wird im Editor gesetzt und gespeichert, nicht zur Laufzeit vom Elternteil übergeben.
  - **Signal ≈ Event mit Callback.** Verbindungen können in der `.tscn` stehen statt im Code.
  - **Gruppe ≈ CSS-Klasse für `querySelectorAll`.** Gruppen sind nur Etiketten, sie tragen keine Darstellung ([Groups](https://docs.godotengine.org/en/stable/tutorials/scripting/groups.html)).
  - **Autoload ≈ globaler Store.** Er ist ein Node im Baum und kann wie jeder Node `_process` haben.
  - **Import und `.godot/imported` ≈ Bundler.** Godot importiert neu, sobald sich die Prüfsumme der Quelldatei ändert, ohne Build-Befehl ([Import process](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/import_process.html#automatic-reimport)).
  - **Inspektor ≈ Styles-Panel der DevTools.** Was du im Inspektor änderst, schreibt der Editor aber beim Speichern in die Datei.
  - **Remote-Baum ≈ Elements-Panel.** Wie in den DevTools ist eine Änderung dort nach dem Beenden weg.

  Den Remote-Baum, die Laufzeitansicht des Szenenbaums, nutzt du in [Ein fremdes Projekt erkunden](/godot/projekt-erkunden).

  > [!INTERVIEW]
  > „Ein Kollege sagt, er habe die Laufgeschwindigkeit angepasst. Wie prüfst du, was genau sich geändert hat?“ Gute Antwort: Ich schaue mir den `git diff` an. Szenen und Ressourcen sind Text, eine geänderte Zeile wie `max_speed = 120.0` in einer `.tres` sagt mir Datei, Eigenschaft und Wert. Im Editor finde ich dieselbe Stelle über den Zurücksetzen-Pfeil im Inspektor. Steht der Wert nirgends, gilt der Standard aus dem Skript, und dann prüfe ich, ob jemand den Standard geändert hat.

  ## Häufige Fehler

  - **Dateien im Dateimanager verschoben.** Godot meldet beim Start etwa `Parse Error: [ext_resource] referenced non-existent resource at: res://player.gd.` Verschieben und Umbenennen gehören ins Dateisystem-Dock, dann passt Godot die Verweise an ([File system, Drawbacks](https://docs.godotengine.org/en/stable/tutorials/scripting/filesystem.html#drawbacks)). Mit 4.7.2 geprüft: Wandert ein Skript samt `.uid` in einen anderen Ordner, finden Verweise mit `uid=` es nach dem nächsten Scan wieder. Verweise ohne `uid=`, wie sie ein Agent von Hand schreibt, brechen.
  - **Groß- und Kleinschreibung.** Linux unterscheidet `Player.gd` und `player.gd`. Nimm für Dateien und Ordner nur Kleinbuchstaben.
  - **`.godot/` versioniert oder vermisst.** Der Ordner ist Cache. Er gehört nicht ins Repository, und wenn er fehlt, baut Godot ihn neu.
  - **Falsche Szene gestartet.** F6 startet den aktiven Tab, nicht die Hauptszene. Wenn Boden und Zähler fehlen, prüf zuerst den Tab.
  - **Spielstand nach `res://` geschrieben.** Im Editor geht das, im exportierten Spiel ist `res://` schreibgeschützt. Spielstände gehören nach `user://`.
  - **Wert am laufenden Spiel geändert und erwartet, dass er bleibt.** Änderungen im Spiel oder im Remote-Inspektor verschwinden mit dem Beenden. Übernimm den Wert danach im Inspektor in die Datei.

  ## Zusammenfassung

  - Ein Godot-Projekt ist ein Ordner mit `project.godot`. Szenen (`.tscn`), Ressourcen (`.tres`), Skripte und Einstellungen sind Text und lassen sich mit Git vergleichen.
  - `.uid` und `.import` erzeugt Godot neben den Dateien, `.godot/` ist Cache und jederzeit neu erzeugbar.
  - In einer `.tscn` oder `.tres` steht nur, was vom Standard abweicht. Fehlt eine Zeile, gilt der Standard.
  - `res://` ist der Projektordner und im fertigen Spiel nur lesbar. `user://` liegt unter Linux in `~/.local/share/godot/app_userdata/<Projektname>/`.
  - Das Szenen-Dock zeigt den Baum, das Dateisystem die Dateien, Inspektor die Werte, Signale und Gruppen die Verbindungen, das untere Panel Ausgaben und Fehler.
  - Der Inspektor gliedert nach Klassen der Vererbungskette. Der Zurücksetzen-Pfeil markiert jede Abweichung vom Standard.
  - F5 startet die Hauptszene, F6 den aktiven Tab. Änderungen am laufenden Spiel bleiben nicht erhalten.
exercises:
  - id: dock-fuer-die-frage
    type: choice
    title: Welches Dock fragst du?
    prompt: |
      Welche Zuordnungen von Frage und Dock stimmen in Godot 4.7.2?
    options:
      - text: "„Welche Methode läuft, wenn `Player` das Signal `collected` sendet?“ → Signale, mit `Player` gewählt"
        correct: true
        why: "Das Signale-Dock listet die Signale des gewählten Nodes und darunter ihre Verbindungen, im Testgelände `../../HUD :: show_total`."
      - text: "„Welche Klasse führt die Eigenschaft `collision_layer` ein?“ → Inspektor, der Abschnitt, in dem sie steht"
        correct: true
        why: Der Inspektor gliedert nach Klassen. `Layer` steht im Abschnitt CollisionObject2D.
      - text: "„Liegt neben `player.gd` eine `player.gd.uid`?“ → Dateisystem-Dock"
        correct: false
        why: Das Dateisystem-Dock blendet `.uid`- und `.import`-Dateien aus. Das siehst du im Terminal oder im Dateimanager.
      - text: "„Welche Fehler gab es beim letzten Lauf?“ → Importieren"
        correct: false
        why: Das Import-Dock zeigt die Import-Einstellungen eines Assets. Fehler des laufenden Spiels sammelt der Debugger im unteren Panel.
    explanation: |
      Jedes Dock beantwortet eine Art Frage. Signale zeigt Verbindungen, der Inspektor Werte nach Klassen, das untere Panel Ausgaben und Fehler. Das Dateisystem-Dock ist eine gefilterte Sicht auf den Projektordner: Was Godot selbst neben die Dateien legt, blendet es aus. Wer nur dort schaut, vergisst die `.uid`-Dateien leicht, wenn er Skripte außerhalb von Godot verschiebt.
    resources:
      - title: Godot Docs · First look at Godot's interface
        url: https://docs.godotengine.org/en/stable/getting_started/introduction/first_look_at_the_editor.html

  - id: abschnitte-ordnen
    type: order
    title: Von oben nach unten im Inspektor
    prompt: |
      Du wählst in `pickup.tscn` den Wurzel-Node `Pickup`. Er ist ein `Area2D` mit dem Skript `pickup.gd`, das kein `class_name` hat. Bring die Abschnitte in die Reihenfolge, in der der Inspektor sie zeigt, oben zuerst.
    lang: text
    lines: |
      pickup.gd
      Area2D
      CollisionObject2D
      Node2D
      CanvasItem
      Node
    hints:
      - Ganz oben steht, was das Skript hinzufügt.
      - Danach folgt die Vererbungskette von der speziellsten zur allgemeinsten Klasse.
    explanation: |
      Das Skript erweitert den Node, deshalb steht sein Abschnitt oben, mangels `class_name` unter dem Dateinamen. Danach kommt die Kette der Engine-Klassen: `Area2D` erbt von `CollisionObject2D`, das von `Node2D`, dann `CanvasItem` und `Node`. So findest du jede Eigenschaft über die Frage, welche Klasse sie einführt. Gesehen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Inspector Dock
        url: https://docs.godotengine.org/en/stable/tutorials/editor/inspector_dock.html#usage
      - title: Godot Docs · Area2D
        url: https://docs.godotengine.org/en/stable/classes/class_area2d.html

  - id: abweichungen-erkennen
    type: choice
    title: Was hat jemand eingestellt?
    prompt: |
      Der Inspektor zeigt den Wurzel-Node von `pickup.tscn`. Welche Eigenschaften weichen vom Standard ab?

      ![Inspektor des Pickup aus pickup.tscn: Abschnitt pickup.gd mit Value 1, Area2D mit Monitoring an und Monitorable aus, CollisionObject2D mit Layer 3 und Mask 2 markiert](/media/godot/editor-anatomie/pickup-inspektor@2x.png "Godot 4.7.2, Inspektor von pickup.tscn")
    options:
      - text: Monitorable
        correct: true
        why: Der Pfeil steht daneben. Standard für ein `Area2D` ist an, hier ist es aus.
      - text: Collision → Layer
        correct: true
        why: Der Pfeil steht daneben. Standard ist Ebene 1, hier ist Ebene 3 gewählt.
      - text: Collision → Mask
        correct: true
        why: Der Pfeil steht daneben. Standard ist Ebene 1, hier ist Ebene 2 gewählt.
      - text: Value
        correct: false
        why: "`1` ist der Standard aus `pickup.gd` (`@export var value := 1`), deshalb kein Pfeil."
      - text: Monitoring
        correct: false
        why: An ist der Standard eines `Area2D`, kein Pfeil.
    explanation: |
      Der Zurücksetzen-Pfeil erscheint genau dort, wo ein Wert vom Standard abweicht. Für die Engine-Eigenschaften ist das der Standard der Klasse, für exportierte Variablen der Wert im Skript. Diese drei Abweichungen findest du auch als Zeilen in `pickup.tscn`: `collision_layer = 4`, `collision_mask = 2`, `monitorable = false`. Layer 3 hat den Bitwert 4; mehr dazu im [Modul zu Kollisionsebenen](/godot/kollision-ebenen).
    resources:
      - title: Godot Docs · Inspector Dock
        url: https://docs.godotengine.org/en/stable/tutorials/editor/inspector_dock.html#usage

  - id: einstellung-ausgeben
    type: output
    title: Zwei Einstellungen aus project.godot
    prompt: |
      Das Testgelände hat diese `project.godot` (Ausschnitt). Was geben die zwei Zeilen aus?

      ```ini
      [application]

      config/name="Testgelände"
      run/main_scene="res://main.tscn"

      [layer_names]

      2d_physics/layer_1="world"
      2d_physics/layer_2="player"
      2d_physics/layer_3="pickups"
      ```
    lang: gdscript
    code: |
      print(ProjectSettings.get_setting("application/run/main_scene"))
      print(ProjectSettings.get_setting("layer_names/2d_physics/layer_3"))
    expected: |
      res://main.tscn
      pickups
    hints:
      - Der Schlüssel im Code ist der Abschnitt in eckigen Klammern plus der Name in der Zeile.
    explanation: |
      Eine Projekteinstellung heißt im Code `abschnitt/name`: `[application]` plus `run/main_scene` ergibt `application/run/main_scene`. `print` gibt Strings ohne Anführungszeichen aus. Dieselben Schlüssel zeigen die Projekteinstellungen, wenn du mit der Maus über eine Einstellung fährst. Gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · ProjectSettings.get_setting
        url: https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-method-get-setting

  - id: standard-aus-dem-skript
    type: output
    title: Wer bestimmt den Wert?
    prompt: |
      Jemand hat in `movement_stats.gd` den Standard geändert. Es gibt zwei Ressourcen mit diesem Skript. Was gibt das Skript unten aus?

      ```gdscript
      # movement_stats.gd
      @export_range(0, 400, 1, "suffix:px/s") var max_speed := 120.0
      ```

      ```ini
      ; data/implicit.tres
      [resource]
      script = ExtResource("1")

      ; data/explicit.tres
      [resource]
      script = ExtResource("1")
      max_speed = 90.0
      ```
    lang: gdscript
    code: |
      print(load("res://data/implicit.tres").max_speed)
      print(load("res://data/explicit.tres").max_speed)
    expected: |
      120.0
      90.0
    hints:
      - Welche der beiden Dateien nennt `max_speed` überhaupt?
    explanation: |
      `implicit.tres` speichert keinen Wert für `max_speed`, also gilt beim Laden der Standard aus dem Skript, jetzt `120.0`. `explicit.tres` nennt `90.0` ausdrücklich, das überschreibt den Standard. Deshalb ist eine Änderung am Standard im Skript nie harmlos: Sie trifft jede Ressource, die den Wert nicht selbst speichert. Und weil der Editor beim Speichern Zeilen weglässt, die dem Standard entsprechen, fehlt der Wert oft gerade dort, wo du ihn nie angefasst hast. Gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Resources
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/resources.html

  - id: welche-szene-laeuft
    type: output
    title: F6 im falschen Tab
    prompt: |
      Ein Autoload gibt beim Start den Pfad der laufenden Szene aus. Im Editor ist `player.tscn` der aktive Tab, die Hauptszene ist `main.tscn`. Du drückst **F6**. Was steht in der Ausgabe?
    lang: gdscript
    code: |
      # probe.gd, als Autoload eingetragen
      extends Node


      func _ready() -> void:
      	await get_tree().process_frame
      	print(get_tree().current_scene.scene_file_path)
    expected: |
      res://player.tscn
    explanation: |
      F6 spielt die Szene im aktiven Tab ab, unabhängig von der Hauptszene. Mit F5 stünde hier `res://main.tscn`. Der Autoload wartet einen Frame, weil Godot Autoloads vor der Szene in den Baum hängt. Mit 4.7.2 nachgestellt über `--scene res://player.tscn`, den Befehlszeilen-Weg zu einer bestimmten Szene.
    resources:
      - title: Godot Docs · Singletons (Autoload)
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/singletons_autoload.html#autoload
      - title: Godot Docs · SceneTree.current_scene
        url: https://docs.godotengine.org/en/stable/classes/class_scenetree.html#class-scenetree-property-current-scene

  - id: projekt-godot-ergaenzen
    type: gap
    title: Hauptszene und Layer-Name
    prompt: |
      Ergänze die Zeilen in `project.godot`, sodass F5 `main.tscn` startet und Kollisionsebene 3 im Inspektor „pickups“ heißt.
    lang: ini
    code: |
      [application]

      config/name="Testgelände"
      run/⟦main_scene⟧="res://⟦main.tscn⟧"

      [layer_names]

      2d_physics/layer_⟦3⟧="pickups"
    gaps:
      - label: Schlüssel der Hauptszene
        hint: Im Code heißt die Einstellung `application/run/…`.
      - label: Datei der Hauptszene
        hint: Die Szene mit Boden, Objekten und HUD.
      - label: Nummer der Ebene
        hint: Die Ebenen zählen im Inspektor ab 1.
    explanation: |
      `run/main_scene` im Abschnitt `[application]` ist die Hauptszene, die F5 startet. Die Namen der Kollisionsebenen stehen unter `[layer_names]` und zählen wie im Inspektor ab 1. Beides schreibt der Editor, wenn du es in den Projekteinstellungen einstellst; lesen kannst du es auch im Texteditor.
    resources:
      - title: Godot Docs · ProjectSettings · application/run/main_scene
        url: https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-application-run-main-scene
      - title: Godot Docs · File system · project.godot
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/filesystem.html#project-godot

  - id: editor-aus-dem-terminal
    type: command
    title: Direkt in den Editor
    prompt: |
      Öffne das Testgelände im Editor, ohne den Projektmanager.
    context: |
      Godot liegt bei dir als `godot` im Pfad. Das Projekt liegt in `~/godot/testgelaende`.
    answers:
      - godot -e --path ~/godot/testgelaende
      - godot --editor --path ~/godot/testgelaende
      - godot --path ~/godot/testgelaende -e
      - godot --path ~/godot/testgelaende --editor
      - godot -e --path ~/godot/testgelaende/
      - godot --editor --path ~/godot/testgelaende/
      - godot -e ~/godot/testgelaende/project.godot
      - godot --editor ~/godot/testgelaende/project.godot
      - godot --path ~/godot/testgelaende/ -e
      - godot --path ~/godot/testgelaende/ --editor
      - godot ~/godot/testgelaende/project.godot
      - godot ~/godot/testgelaende/project.godot -e
    explanation: |
      `-e` oder `--editor` startet den Editor statt des Spiels, `--path` nennt den Ordner mit `project.godot`. Ohne `-e` liefe die Hauptszene. Gibst du statt `--path` den Pfad zur `project.godot` an, öffnet Godot den Editor auch ohne `-e`; mit 4.7.2 geprüft. Ein Alias in deiner Shell spart dir das Tippen.
    resources:
      - title: Godot Docs · Command line tutorial
        url: https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html#command-line-reference

  - id: cache-loeschen
    type: command
    title: Den Cache neu aufbauen
    prompt: |
      Du willst ausschließen, dass ein Fehler am Cache liegt. Lösche den Ordner, den Godot beim nächsten Öffnen neu erzeugt.
    context: |
      Der Editor ist geschlossen. Du bist im Projektordner, neben `project.godot`.
    answers:
      - rm -rf .godot
      - rm -rf .godot/
      - rm -rf ./.godot
      - rm -rf ./.godot/
      - rm -r .godot
      - rm -r .godot/
    explanation: |
      `.godot/` enthält importierte Assets, den UID-Cache und den Zustand des Editors. Nichts davon ist Quelle: Beim nächsten Öffnen erzeugt Godot den Ordner neu und importiert alle Assets erneut, das dauert bei großen Projekten eine Weile. Schließ vorher den Editor, sonst schreibt er sofort wieder hinein. `-f` unterdrückt Rückfragen bei schreibgeschützten Dateien. Mit 4.7.2 geprüft.
    resources:
      - title: Godot Docs · Import process
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/import_process.html

  - id: hauptszene-falsch
    type: bug
    title: F5 zeigt nur die Figur
    prompt: |
      Drückst du F5, siehst du das hier: eine blaue Figur auf grauem Grund, kein Boden, keine Sammelstücke, kein Zähler. Öffnest du `main.tscn` und drückst F6, ist alles da. Welche Zeile in `project.godot` ist schuld? Korrigiere sie.

      ![Spielbild 320 × 180: grauer Hintergrund, in der Mitte nur das blaue Rechteck der Figur](/media/godot/editor-anatomie/falsche-hauptszene@2x.png "Godot 4.7.2, Spielbild nach F5, doppelt vergrößert")
    lang: ini
    code: |
      [application]

      config/name="Testgelände"
      run/main_scene="res://player.tscn"
      config/features=PackedStringArray("4.7", "GL Compatibility")
    lines: [4]
    fix:
      - line: 4
        answers:
          - run/main_scene="res://main.tscn"
    explanation: |
      F5 startet die Szene aus `run/main_scene`. Steht dort `player.tscn`, läuft nur die Figur mit ihrer Kamera, und der graue Grund ist die Standard-Hintergrundfarbe. F6 startet dagegen den aktiven Tab, deshalb fiel es dort nicht auf. Im Dateisystem-Dock hättest du es auch gesehen: Die Hauptszene steht in Blau. Mit 4.7.2 nachgestellt.
    resources:
      - title: Godot Docs · ProjectSettings · application/run/main_scene
        url: https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-application-run-main-scene

  - id: pfad-gross-geschrieben
    type: bug
    title: Die Figur lädt nicht
    prompt: |
      Ein Coding-Agent hat `player.tscn` von Hand geschrieben. Startest du das Spiel im Terminal, erscheint diese Ausgabe (im Editor stehen dieselben Meldungen im Debugger), und die Figur bewegt sich nicht. Das Skript liegt als `player.gd` im Projektordner. Finde die Zeile und korrigiere sie.

      ```text
      ERROR: Attempt to open script 'res://Player.gd' resulted in error 'File not found'.
      ERROR: Failed loading resource: res://Player.gd.
      ERROR: res://player.tscn:13 - Parse Error: [ext_resource] referenced non-existent resource at: res://Player.gd.
      ```
    lang: ini
    code: |
      [gd_scene format=3]

      [ext_resource type="Script" path="res://Player.gd" id="1"]
      [ext_resource type="Resource" path="res://data/player_stats.tres" id="2"]

      [sub_resource type="RectangleShape2D" id="feet"]
      size = Vector2(10, 6)
    lines: [3]
    fix:
      - line: 3
        answers:
          - '[ext_resource type="Script" path="res://player.gd" id="1"]'
    explanation: |
      Unter Linux sind `Player.gd` und `player.gd` zwei verschiedene Dateien. Unter Windows und macOS fiele der Fehler nicht auf; laut Doku kann er im exportierten Spiel wieder auftreten. Deshalb empfiehlt sie Kleinbuchstaben für alle Dateinamen. Mit 4.7.2 geprüft: Hätte die Zeile ein `uid="uid://…"`, fände Godot das Skript über die UID trotzdem, ohne Fehlermeldung. Von Hand geschriebene Szenen haben meist keine UIDs; der Editor ergänzt sie beim ersten Speichern.
    resources:
      - title: Godot Docs · File system · Drawbacks
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/filesystem.html#drawbacks

  - id: projektordner-erklaeren
    type: explain
    title: Was davon ist Quelle?
    prompt: |
      Eine Kollegin, die aus der Webentwicklung kommt, sieht dieses Verzeichnis zum ersten Mal und fragt, welche Dateien sie lesen muss, um eine Änderung zu verstehen, und welche Godot selbst erzeugt. Erkläre es in drei bis fünf Sätzen.
    lang: text
    code: |
      $ ls -AF
      crate.tscn  hud.gd.uid             pickup.gd      player.gd.uid
      data/       main.tscn              pickup.gd.uid  player.tscn
      .godot/     movement_stats.gd      pickup.tscn    project.godot
      hud.gd      movement_stats.gd.uid  player.gd
      $ ls -AF .godot
      editor/                        scene_groups_cache.cfg
      .gdignore                      shader_cache/
      global_script_class_cache.cfg  uid_cache.bin
      imported/
    points:
      - "`project.godot`, die `.tscn`, die `.tres` in `data/` und die `.gd` sind Textdateien mit dem Inhalt des Projekts; eine Änderung zeigt `git diff`."
      - "Die `.gd.uid` erzeugt Godot für jedes Skript; sie gehört zum Skript und wandert mit, wenn man es verschiebt."
      - "`.godot/` ist Cache aus Importen und Editor-Zustand, Godot baut ihn neu, er gehört nicht ins Repository."
    explanation: |
      Die Quellen sind `project.godot` mit den Einstellungen, die Szenen (`.tscn`), die Ressourcen (`.tres`) und die Skripte (`.gd`), alles Text, also liest du eine Änderung am besten als `git diff`. Neben jedem Skript legt Godot seit 4.4 eine `.uid` an, die seine ID trägt; du musst sie nicht lesen, aber sie wird mitversioniert und beim Verschieben mitgenommen. `.godot/` ist ein Cache wie ein Build-Ordner, Godot erzeugt ihn beim Öffnen neu.
    resources:
      - title: Godot Docs · File system
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/filesystem.html
      - title: Godot 4.4 · Universal UID support
        url: https://godotengine.org/releases/4.4/#universal-uid-support

  - id: werkstatt-notiz
    type: practice
    title: Deine Fragen an ein fremdes Projekt
    prompt: |
      Schreib eine kurze Notiz für deine nächste Sitzung mit einem Coding-Agenten. Nimm drei Fragen, die du an ein Projekt hast, das du nicht selbst gebaut hast. Notiere zu jeder, welches Dock oder welche Datei du zuerst öffnest und woran du die Antwort erkennst.
    lang: prose
    checklist:
      - Drei Fragen stehen da, jede in einem Satz.
      - Zu jeder Frage steht ein Dock oder eine Datei mit Pfad.
      - Bei mindestens einer Frage ist der Beleg ein Zurücksetzen-Pfeil im Inspektor oder eine Zeile in einer `.tscn` oder `.tres`.
      - Bei mindestens einer Frage steht, ob die Antwort im Editor oder im laufenden Spiel liegt.
    hints:
      - "Typische Fragen: Wo steht ein Wert? Wer reagiert auf ein Ereignis? Welche Szene startet? Was hat sich seit gestern geändert?"
    explanation: |
      Die Notiz ist deine erste Projektkarte im Kleinen. Wer zu jeder Frage weiß, wo die Antwort steht, verliert in einem fremden Projekt keine Zeit mit Suchen und kann einem Agenten präzise sagen, wo er etwas ändern soll. Die große Fassung schreibst du in [Ein fremdes Projekt erkunden](/godot/projekt-erkunden).
    resources:
      - title: Godot Docs · First look at Godot's interface
        url: https://docs.godotengine.org/en/stable/getting_started/introduction/first_look_at_the_editor.html
