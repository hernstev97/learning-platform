lesson: |
  Die Figur im Testgelände läuft analog in jede Richtung. Gezeichnet hast du aber nur vier Laufzyklen, vielleicht acht. Läuft die Figur im Winkel von 30°, muss ein Skript entscheiden, welcher Zyklus gilt. Wechselt die Richtung mitten im Schritt, soll der Zyklus weiterlaufen, statt neu anzufangen. Und läuft die Figur schneller, als die Beine in der Zeichnung ausgreifen, rutschen die Füße über den Boden.

  Dieses Modul baut die Brücke zwischen deinen Frames und der Bewegung: SpriteFrames und `AnimatedSprite2D` für die Bilder, `AnimationPlayer` für alles, was im selben Takt passieren muss, und ein kleines Skript für die Richtung. Statt einer Figur nimmst du einen Richtungsbogen: 64 × 64 Pixel, vier Zeilen zu je vier Feldern, jedes Feld mit Rasterlinie, Richtungsbuchstabe (R, D, L, U), Frame-Nummer, wanderndem Block und Fußmarke. Den legst du wie den Testbogen aus [Eigene Sprites importieren](/godot/sprites-importieren) selbst an. Namen, Richtungszahl, FPS und Schwellen hier sind Platzhalter.

  ## SpriteFrames: Bilder, Takt und Loop

  Ein `AnimatedSprite2D` zeigt Animationen aus einer Ressource vom Typ `SpriteFrames`. Darin stehen benannte Animationen, jede mit ihren Frames, einer Geschwindigkeit in FPS und einem Loop-Modus ([SpriteFrames](https://docs.godotengine.org/en/stable/classes/class_spriteframes.html)). Im Inspektor wählst du bei *Sprite Frames* eine neue SpriteFrames-Ressource; ein Klick darauf öffnet unten das Panel *SpriteFrames*.

  ![SpriteFrames-Panel: links die Liste der Animationen idle_down bis walk_up mit walk_down markiert, darüber 8.0 FPS und der Loop-Schalter; rechts die Frames 0 und 1 mit D1 und D2, darunter angeschnitten D4, und das Feld Frame-Dauer × 1.0](/media/godot/animationen/spriteframes-panel.png "Godot 4.7.2, SpriteFrames-Panel mit den Platzhalter-Animationen aus dem Richtungsbogen")

  Die Frames holst du mit *Frames aus Sprite-Sheet hinzufügen* (Kürzel Ctrl+Shift+O, auf deutscher Tastatur Strg+Umschalt+O). Im Dialog *Frames auswählen* stellst du Spalten und Zeilen ein und klickst die Felder an, die zur Animation gehören ([Sprite sheet with AnimatedSprite2D](https://docs.godotengine.org/en/stable/tutorials/2d/2d_sprite_animation.html#sprite-sheet-with-animatedsprite2d)). Anders als `hframes` am `Sprite2D` kennt der Dialog *Trennung* und *Versatz*, also Abstände zwischen Feldern und einen Rand. Jedes Feld wird dabei eine `AtlasTexture`.

  ![Einstellungen im Dialog Frames auswählen: Horizontal 4, Vertikal 4, Größe 16 px mal 16 px, Trennung 0 px, Versatz 0 px, Knopf Autoschnitt](/media/godot/animationen/frames-auswaehlen.png "Godot 4.7.2, Dialog Frames auswählen, Einstellungen für den Richtungsbogen")

  Drei Werte bestimmen den Takt. Die **FPS** der Animation, Standard 5. Die **Frame-Dauer** je Frame, ein Faktor, Standard 1,0. Und `speed_scale` am Node. Die Doku nennt die Formel ([get_frame_duration](https://docs.godotengine.org/en/stable/classes/class_spriteframes.html#class-spriteframes-method-get-frame-duration)):

  ```text
  Dauer in Sekunden = Frame-Dauer / (FPS × |Abspieltempo|)
  ```

  Gemessen mit Godot 4.7.2 bei 60 Bildern pro Sekunde, vier Frames, `play()` im ersten Bild:

  | Einstellung | Frame wechselt bei Bild | Zyklus |
  | --- | --- | --- |
  | 8 FPS | 8, 15, 23, 30 | 0,5 s |
  | 8 FPS, dritter Frame Dauer 2,0 | 8, 15, 30, 38 | 0,625 s |
  | 8 FPS, `speed_scale` 0,5 | 15, 30, 45, 60 | 1,0 s |

  Bei 8 FPS steht ein Frame 7,5 Bilder lang, also abwechselnd 7 und 8. Der Loop-Modus heißt in Godot 4.7 `LoopMode`: aus, wiederholen oder Ping-Pong ([LoopMode](https://docs.godotengine.org/en/stable/classes/class_spriteframes.html#enum-spriteframes-loopmode)). In der Szene steht er als Zahl:

  ```ini
  [sub_resource type="SpriteFrames" id="SpriteFrames_7ahtn"]
  animations = [{
  "frames": [{
  "duration": 1.0,
  "texture": SubResource("AtlasTexture_2hs0m")
  }, …],
  "loop": 1,
  "name": &"walk_down",
  "speed": 8.0
  }, …]
  ```

  `"loop": 0` heißt aus, `1` wiederholen, `2` Ping-Pong. Das `AnimatedSprite2D` zählt seine Frames im normalen Bildtakt (`_process`), nicht im Physik-Takt. Für Bilder reicht das. Was spielmechanisch auf den Frame genau sitzen muss, gehört in einen `AnimationPlayer` mit Physik-Takt.

  ## Abspielen aus Code: play, Signale und Phase

  `play(&"walk_down")` startet eine Animation ([play](https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-method-play)). Drei Regeln musst du kennen, alle mit Godot 4.7.2 nachgemessen:

  - Ruft der Code jedes Bild `play()` mit demselben Namen auf, läuft die Animation weiter. Sie startet nicht neu.
  - Wechselt der Name, springt das Sprite auf Frame 0. Das gilt auch, wenn du `animation` direkt setzt.
  - `stop()` setzt auf Frame 0 zurück, `pause()` behält die Stelle.

  Die zweite Regel ist beim Richtungswechsel ein Problem: Aus `walk_right` in Frame 2 wird `walk_down` in Frame 0, die Figur stolpert. Die Lösung zeigt die Doku selbst: Stelle und Fortschritt merken, wechseln, zurücksetzen mit `set_frame_and_progress()` ([set_frame_and_progress](https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-method-set-frame-and-progress)). Gemessen: vorher `walk_right frame 2 progress 0.53`, danach `walk_down frame 2 progress 0.53` statt Frame 0.

  > [!MERKE]
  > Gleicher Name: läuft weiter. Neuer Name: Frame 0. Wer die Phase behalten will, setzt sie nach dem Wechsel mit `set_frame_and_progress()` zurück.

  Signale melden den Ablauf. `animation_finished` kommt nur bei Animationen ohne Loop, am Ende; bei einer Schleife kommt stattdessen `animation_looped` ([animation_finished](https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-signal-animation-finished)). `frame_changed` kommt bei jedem neuen Frame; daran hängst du später Schrittgeräusche ([Audio zuordnen](/godot/audio)). Mit *Autoplay beim Laden* im Panel (Eigenschaft `autoplay`) startet eine Animation, sobald die Szene geladen ist.

  ## AnimationPlayer: wenn mehr als das Bild wechselt

  Ein `AnimatedSprite2D` kann eines: Bilder im Takt wechseln. Ein `AnimationPlayer` setzt beliebige Eigenschaften beliebiger Nodes zu festen Zeiten ([Introduction to the animation features](https://docs.godotengine.org/en/stable/tutorials/animation/introduction.html)). Im Animations-Panel fügst du mit *Track hinzufügen* Spuren hinzu; die Spurtypen heißen auch im deutschen Editor englisch ([Animation Track types](https://docs.godotengine.org/en/stable/tutorials/animation/animation_track_types.html)):

  | Spur | Was sie tut | Beispiel im Testgelände |
  | --- | --- | --- |
  | Property Track | setzt eine Eigenschaft | `frame` eines `Sprite2D`, `disabled` einer Form |
  | Call Method Track | ruft eine Methode zu einem Zeitpunkt | `queue_free()` am Ende |
  | Audio Playback Track | spielt einen Ton an einem `AudioStreamPlayer` | Schritt bei Frame 2 |
  | Animation Playback Track | startet eine Animation eines anderen Players | verschachtelte Abläufe |

  Faustregel: Reine Bildfolgen (Laufen, Stehen) laufen im `AnimatedSprite2D`. Muss etwas anderes im selben Takt passieren, etwa eine Hitbox, ein Ton oder ein Methodenaufruf, nimm einen `AnimationPlayer`. Er kann den `frame` eines `Sprite2D` mitschalten, wie die Doku zeigt ([Sprite sheet with AnimationPlayer](https://docs.godotengine.org/en/stable/tutorials/2d/2d_sprite_animation.html#sprite-sheet-with-animationplayer)). Wie du ihn auf den Physik-Takt stellst und Keys aufs 1/60-Raster legst, steht in [Godot-Start](/combat/godot-start). Methodenspuren laufen in der Vorschau im Editor nicht, nur im Spiel ([Call Method Track](https://docs.godotengine.org/en/stable/tutorials/animation/animation_track_types.html#call-method-track)).

  Für Webentwickler: `AnimatedSprite2D` ist eine CSS-Sprite-Animation mit `steps()`. `AnimationPlayer` gleicht einer Zeitleiste mit Keyframes auf beliebigen Eigenschaften, wie die Web Animations API. Der Vergleich endet bei Methoden- und Tonspuren, dafür hat CSS nichts.

  ## Blickrichtung bei 360°-Bewegung

  `player.gd` merkt sich in `facing` die letzte Eingaberichtung. Sie bleibt stehen, wenn du loslässt; deshalb schaut die Figur im Stand dorthin, wohin sie zuletzt lief. Aus dem Winkel des Vektors wird eine Richtung: `Vector2.angle()` liefert den Winkel im Bogenmaß, 0 nach rechts, positiv im Uhrzeigersinn, weil y in Godot nach unten zeigt ([angle](https://docs.godotengine.org/en/stable/classes/class_vector2.html#class-vector2-method-angle)). Teilst du durch ein Viertel des Vollkreises und rundest, bekommst du 0 bis 3 für rechts, unten, links, oben.

  Ein eigenes Skript am `AnimatedSprite2D` erledigt das. Es liest nur, was der Player schon hat, und ändert `player.gd` nicht. Hänge es an den Node `Sprite` unter dem Player. Aus dem `Sprite2D` des letzten Moduls machst du mit Rechtsklick → *Typ ändern...* ein `AnimatedSprite2D`; der Name bleibt. Prüf danach im Inspektor, ob `offset` noch auf (0, −8) steht.

  ```gdscript title=player_animation.gd
  extends AnimatedSprite2D

  ## Wählt die Animation aus Tempo und Blickrichtung des Players (Elternknoten).
  ## Namen, Schwelle und Zahl der Richtungen sind Platzhalter: Du legst sie fest.

  @export var eight_directions := false  ## aus: 4 Richtungen, an: 8
  @export var mirror_left := false  ## an: "left" entsteht gespiegelt aus "right"
  @export_range(0, 100, 1, "suffix:px/s") var walk_threshold := 5.0  ## darunter gilt "idle"

  const NAMES_4: Array[String] = ["right", "down", "left", "up"]
  const NAMES_8: Array[String] = ["right", "down_right", "down", "down_left", "left", "up_left", "up", "up_right"]

  @onready var player: Player = get_parent()


  func _process(_delta: float) -> void:
  	var state := "walk" if player.velocity.length() > walk_threshold else "idle"
  	var dir_name := direction_name(player.facing)
  	flip_h = mirror_left and dir_name.contains("left")
  	if flip_h:
  		dir_name = dir_name.replace("left", "right")
  	var next := StringName(state + "_" + dir_name)
  	if next == animation and is_playing():
  		return
  	var same_state := String(animation).begins_with(state)
  	var keep_frame := frame
  	var keep_progress := frame_progress
  	play(next)
  	if same_state:
  		set_frame_and_progress(keep_frame, keep_progress)


  func direction_name(dir: Vector2) -> String:
  	var names := NAMES_8 if eight_directions else NAMES_4
  	var step := TAU / names.size()
  	return names[wrapi(roundi(dir.angle() / step), 0, names.size())]
  ```

  Bei „oben“ ergibt die Rundung −1. `wrapi()` faltet das auf 3 ([wrapi](https://docs.godotengine.org/en/stable/classes/class_@globalscope.html#class-globalscope-method-wrapi)). GDScript liest einen negativen Index zwar vom Ende des Arrays und träfe hier dasselbe, gemessen `names[-1]` = `up`; mit `wrapi()` steht die Absicht im Code, statt an einer Spracheigenheit zu hängen. Läuft die Figur von rechts nach unten weiter, behält das Skript die Phase; wechselt sie von `idle` zu `walk`, beginnt der Zyklus bei Frame 0.

  Die Tastatur liefert Diagonalen mit genau 45°. Das ist genau die Grenze zwischen zwei Richtungen, und `roundi()` rundet ,5 von der Null weg. Gemessen mit vier Richtungen:

  | Tasten | `facing` | Animation |
  | --- | --- | --- |
  | rechts + unten | (0.707107, 0.707107) | `walk_down` |
  | links + unten | (-0.707107, 0.707107) | `walk_left` |
  | links + oben | (-0.707107, -0.707107) | `walk_left` |
  | rechts + oben | (0.707107, -0.707107) | `walk_up` |

  Zwei Diagonalen landen senkrecht, zwei waagrecht. Mit dem Stick trifft man die Grenze selten genau. Was auf der Diagonale gelten soll, ist eine Entscheidung für dein Spiel: acht Richtungen zeichnen, eine Achse bevorzugen oder die alte Richtung behalten. Mit `eight_directions` an braucht das Skript acht Animationen je Zustand. Fehlen sie, meldet Godot jedes Bild:

  ```text
  ERROR: There is no animation with name 'walk_down_right'.
     at: play (scene/2d/animated_sprite_2d.cpp:505)
     GDScript backtrace (most recent call first):
         [0] _process (res://player_animation.gd:28)
  ```

  `flip_h` spiegelt das ganze Feld. Am Richtungsbogen siehst du sofort, was das heißt: Aus dem R wird ein gespiegeltes R.

  ![Drei Felder: walk_right mit R1, dasselbe Feld mit flip_h und gespiegelter Schrift, walk_left mit eigenem L1](/media/godot/animationen/flip-h@2x.png "Godot 4.7.2, Richtungsbogen mit und ohne flip_h, achtfach vergrößert")

  Bei einer Figur spiegeln sich genauso Seitenscheitel, Waffenhand und Licht. Ob dich das stört oder ob du links eigene Frames zeichnest, entscheidest du; `mirror_left` macht beides möglich.

  > [!INTERVIEW]
  > „Wie wählst du in einem Top-down-Spiel mit Analogstick die Animation aus?“ Gute Antwort, etwa als Gameplay Programmer: Ich trenne Zustand und Richtung. Der Zustand kommt aus dem Tempo mit einer kleinen Schwelle, die Richtung aus dem Winkel des letzten Eingabevektors, auf vier oder acht Sektoren gerundet. Beim Richtungswechsel übernehme ich Frame und Fortschritt, sonst stolpert der Zyklus. Auf den Sektorgrenzen, etwa bei Tastatur-Diagonalen, lege ich bewusst fest, welche Richtung gewinnt, und spiegle nur, wenn die Grafik es verträgt.

  ## Laufzyklus und Tempo: Fußrutschen ausrechnen

  Ein Laufzyklus zeigt eine Strecke: In deiner Zeichnung kommt die Figur pro Zyklus um eine bestimmte Zahl Pixel voran, gemessen am Fuß, der gerade am Boden steht. Das Spiel bewegt sie unabhängig davon mit `velocity`. Passen beide nicht zusammen, rutscht der Fuß über den Boden.

  ```text
  Zyklusdauer   = Summe der Frame-Dauern / FPS          4 / 8 = 0,5 s
  Strecke       = Tempo × Zyklusdauer                    90 × 0,5 = 45 px
  passende FPS  = Tempo × Summe der Frame-Dauern / Schrittweg
  ```

  Zeigt deine Zeichnung 32 Pixel Weg pro Zyklus, passen bei 90 px/s und vier Frames 90 × 4 / 32 = 11,25 FPS. Bei 8 FPS legt die Figur 45 Pixel zurück, während die Füße nur 32 zeigen: Sie gleitet vorwärts. Bei 15 FPS wären es 24 Pixel, die Füße rutschen nach hinten.

  Ändert sich das Tempo, etwa beim Anlaufen, kannst du den Zyklus mitziehen: `speed_scale = player.velocity.length() / reference_speed`, wobei `reference_speed` das Tempo ist, für das der Zyklus gezeichnet wurde ([speed_scale](https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-property-speed-scale)). Ob die Figur leicht gleiten darf, entscheidest du beim Zusehen. Die Rechnung sagt dir nur, wo du anfängst. Zum Beobachten Bild für Bild nimmst du die Werkzeuge aus [Tuning als Experiment](/combat/tuning).

  > [!PRAXIS]
  > Animationsnamen sind ein Vertrag zwischen Code und Grafik. Schreib die Liste (`idle_down`, `walk_down`, …) in die Aufgabe für den Coding-Agenten und neben deine Quelldateien, bevor du zeichnest. Ein Tippfehler im Namen fällt sonst erst als Fehlermeldung im laufenden Spiel auf.

  ## Häufige Fehler

  - **Zyklus startet bei jedem Richtungswechsel neu.** Der Name wechselt, das Sprite springt auf Frame 0. Phase mit `set_frame_and_progress()` übernehmen.
  - **Figur hängt auf Frame 0.** Der Code ruft jedes Bild `stop()` und `play()` oder setzt `frame = 0`. Nur bei einem neuen Namen etwas tun.
  - **`animation_finished` kommt nie.** Die Animation hat Loop an. Für einmalige Abläufe Loop aus (`"loop": 0`).
  - **Fehlermeldung „There is no animation with name …“.** Name falsch geschrieben, oder das Skript erwartet acht Richtungen und SpriteFrames hat vier.
  - **Diagonalen zeigen unerwartete Richtungen.** Tastatur-Diagonalen liegen genau auf der Sektorgrenze. Regel festlegen statt der Rundung zu überlassen.
  - **Füße rutschen.** FPS und Tempo passen nicht zum Schrittweg der Zeichnung. Nachrechnen.
  - **Gameplay hängt am `AnimatedSprite2D`.** Es zählt im Bildtakt. Hitboxen und Ähnliches gehören in einen `AnimationPlayer` mit Physik-Takt.

  ## Zusammenfassung

  - SpriteFrames hält benannte Animationen mit FPS (Standard 5), Loop-Modus (0 aus, 1 wiederholen, 2 Ping-Pong) und Frame-Dauer je Frame.
  - Dauer eines Frames = Frame-Dauer / (FPS × Abspieltempo). Bei 8 FPS und 60 Bildern pro Sekunde steht ein Frame 7 oder 8 Bilder.
  - Gleicher Name läuft weiter, neuer Name beginnt bei Frame 0; `set_frame_and_progress()` behält die Phase.
  - `animation_finished` gibt es nur ohne Loop; `frame_changed` kommt bei jedem Frame.
  - `AnimationPlayer` für alles, was neben dem Bild im Takt passieren muss.
  - Richtung = Winkel von `facing`, gerundet auf vier oder acht Sektoren. Tastatur-Diagonalen liegen auf der Grenze.
  - Passende FPS = Tempo × Frames / Schrittweg. Namen, Richtungszahl, Spiegeln und FPS entscheidest du.
exercises:
  - id: sprite-oder-player
    type: choice
    title: Bildfolge oder Zeitleiste?
    prompt: |
      Welche Aufgaben gehören in einen `AnimationPlayer` statt in ein `AnimatedSprite2D`? Mehrere Antworten richtig.
    options:
      - text: Eine Hitbox genau in Frame 9 bis 11 eines Angriffs einschalten
        correct: true
        why: Das ist eine Eigenschaft eines anderen Nodes, die im Physik-Takt auf den Frame genau schalten muss. Das kann nur der `AnimationPlayer`.
      - text: Einen Ton genau in dem Frame abspielen, in dem auch die Hitbox angeht
        correct: true
        why: Ton und Hitbox müssen im selben Takt sitzen. In einer Zeitleiste liegen beide als Spuren nebeneinander, die Audio Playback Track spielt den Ton.
      - text: Vier Frames eines Laufzyklus in Schleife zeigen
        correct: false
        why: Eine reine Bildfolge ist genau das, wofür `AnimatedSprite2D` und SpriteFrames da sind.
      - text: Im Physik-Takt genau in Frame 9 eines Angriffs eine Methode aufrufen, die ein Projektil erzeugt
        correct: true
        why: Eine Call Method Track ruft die Methode zu einem festen Zeitpunkt, und mit `callback_mode_process = Physics` liegt er auf dem Physik-Frame. Das `AnimatedSprite2D` zählt im Bildtakt.
    explanation: |
      `AnimatedSprite2D` wechselt Bilder, sonst nichts. Sobald neben dem Bild etwas anderes passieren muss, ein Ton, eine Form, ein Methodenaufruf, legst du es in eine Zeitleiste. Der `AnimationPlayer` kann zusätzlich im Physik-Takt laufen, was für spielmechanisches Timing zählt. Viele Projekte kombinieren beides: SpriteFrames für Laufen und Stehen, einen `AnimationPlayer` für Angriffe.
    resources:
      - title: Godot Docs · Animation Track types
        url: https://docs.godotengine.org/en/stable/tutorials/animation/animation_track_types.html

  - id: frames-aus-sheet
    type: order
    title: Vom Richtungsbogen zur Laufanimation
    prompt: |
      Bring die Schritte in eine sinnvolle Reihenfolge, um `walk_down` aus dem Richtungsbogen anzulegen.
    lang: prose
    lines: |
      Am Node Sprite (AnimatedSprite2D) bei Sprite Frames eine neue SpriteFrames-Ressource anlegen
      Die Ressource anklicken, damit unten das Panel SpriteFrames erscheint
      Eine Animation anlegen und in walk_down umbenennen
      Frames aus Sprite-Sheet hinzufügen wählen und den Richtungsbogen öffnen
      Horizontal 4 und Vertikal 4 einstellen und die vier Felder der Zeile D anklicken
      Die Frames hinzufügen, dann FPS und Loop der Animation einstellen
      Im laufenden Spiel nach unten laufen und die Nummern 1 bis 4 nacheinander sehen
    explanation: |
      Ohne SpriteFrames-Ressource gibt es kein Panel, ohne Animation keinen Ort für die Frames. Im Dialog bestimmen Spalten und Zeilen das Raster; die gewählten Felder werden zu AtlasTextures. FPS und Loop gehören zur Animation, nicht zum Frame, deshalb kommen sie danach. Der Test im Spiel zeigt, ob das Skript die Animation auch auswählt.
    resources:
      - title: Godot Docs · 2D sprite animation · Sprite sheet with AnimatedSprite2D
        url: https://docs.godotengine.org/en/stable/tutorials/2d/2d_sprite_animation.html#sprite-sheet-with-animatedsprite2d

  - id: diagonalen-vorhersagen
    type: output
    title: Welche Richtung gewinnt?
    prompt: |
      `direction_name()` aus `player_animation.gd`, mit `eight_directions = false`. Was geben die drei Zeilen aus?
    lang: gdscript
    code: |
      print(direction_name(Vector2(1, 1).normalized()))
      print(direction_name(Vector2(-1, -1).normalized()))
      print(direction_name(Vector2(0.9, 0.3)))
    expected: |
      down
      left
      right
    hints:
      - Rechne den Winkel in Vierteln des Vollkreises aus und runde. 0 ist rechts, 1 unten, 2 links, 3 oben.
      - "`roundi(0.5)` ist 1, `roundi(-1.5)` ist −2."
    explanation: |
      Rechts unten hat 45°, also 0,5 Viertel; `roundi()` rundet auf 1, das ist `down`. Links oben hat −135°, also −1,5 Viertel, gerundet −2, und `wrapi()` macht daraus 2, `left`. `Vector2(0.9, 0.3)` hat gut 18°, gerundet 0, `right`. Gemessen mit Godot 4.7.2. Mit acht Richtungen gibt die erste Zeile `down_right` aus.
    resources:
      - title: Godot Docs · Vector2.angle
        url: https://docs.godotengine.org/en/stable/classes/class_vector2.html#class-vector2-method-angle
      - title: Godot Docs · @GlobalScope.roundi
        url: https://docs.godotengine.org/en/stable/classes/class_@globalscope.html#class-globalscope-method-roundi

  - id: phase-beim-wechsel
    type: output
    title: Wo steht der Zyklus nach dem Wechsel?
    prompt: |
      Das Sprite spielt `walk_right` und steht gerade in Frame 2. Dann läuft dieser Code. Was gibt er aus?
    lang: gdscript
    code: |
      sprite.play(&"walk_down")
      print(sprite.animation, " ", sprite.frame)
      sprite.play(&"walk_down")
      print(sprite.animation, " ", sprite.frame)
    expected: |
      walk_down 0
      walk_down 0
    hints:
      - Was passiert mit dem Frame, wenn sich der Name ändert?
      - Und was, wenn `play()` mit dem Namen kommt, der schon läuft?
    explanation: |
      Der erste Aufruf wechselt den Namen, das Sprite springt auf Frame 0. Der zweite nennt denselben Namen; die Animation läuft weiter und bleibt in diesem Moment bei Frame 0. Gemessen mit Godot 4.7.2. Soll der Laufzyklus beim Richtungswechsel nicht neu beginnen, merkst du dir vorher `frame` und `frame_progress` und setzt beides mit `set_frame_and_progress()` zurück; dann stünde in beiden Zeilen Frame 2.
    resources:
      - title: Godot Docs · AnimatedSprite2D.play
        url: https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-method-play

  - id: zyklus-dauer
    type: output
    title: Wie lang ist der Zyklus?
    prompt: |
      Eine Animation hat vier Frames, 8 FPS und Loop an. Der dritte Frame hat die Frame-Dauer 2,0, alle anderen 1,0. `speed_scale` ist 1. Wie viele Sekunden dauert ein Durchlauf?
    lang: text
    code: |
      FPS:          8
      Frame-Dauern: 1,0  1,0  2,0  1,0
    expected: |
      0,625
    accept:
      - 0,625 s
      - 0,625s
      - 0.625
      - 0.625 s
      - 0.625s
      - 0,625 Sekunden
    hints:
      - Jeder Frame dauert Frame-Dauer / FPS Sekunden.
    explanation: |
      Die Frame-Dauern addieren sich zu 5,0. Geteilt durch 8 FPS ergibt das 0,625 s. Gemessen mit Godot 4.7.2 bei 60 Bildern pro Sekunde: Der dritte Frame steht 15 statt 7 oder 8 Bilder, der Zyklus dauert 37 bis 38 Bilder. Die Frame-Dauer ist das Werkzeug für Haltebilder, etwa einen Kontaktmoment, den du länger zeigen willst.
    resources:
      - title: Godot Docs · SpriteFrames.get_frame_duration
        url: https://docs.godotengine.org/en/stable/classes/class_spriteframes.html#class-spriteframes-method-get-frame-duration

  - id: passende-fps
    type: output
    title: Bei welcher FPS rutscht nichts?
    prompt: |
      Ein Laufzyklus mit vier Frames gleicher Dauer zeigt 30 Pixel Weg. Die Figur läuft mit 90 px/s (Platzhalter). Bei welcher FPS passt der Zyklus zum Tempo? Antworte mit der Zahl.
    lang: text
    code: |
      Frames:     4
      Schrittweg: 30 px pro Zyklus
      Tempo:      90 px/s
    expected: |
      12
    accept:
      - 12 FPS
      - 12 fps
      - 12FPS
      - "12,0"
      - "12.0"
    hints:
      - In der passenden Zyklusdauer legt die Figur genau 30 Pixel zurück.
    explanation: |
      90 px/s brauchen für 30 Pixel genau 1/3 Sekunde. Vier Frames in 1/3 Sekunde sind 12 FPS, kurz: 90 × 4 / 30 = 12. Mit der Standard-FPS von 5 dauerte der Zyklus 0,8 s, die Figur käme 72 Pixel weit, während die Füße 30 zeigen. Ob du die FPS anpasst, das Tempo oder die Zeichnung, entscheidest du.
    resources:
      - title: Godot Docs · AnimatedSprite2D.speed_scale
        url: https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-property-speed-scale

  - id: richtung-ergaenzen
    type: gap
    title: Vom Winkel zum Namen
    prompt: |
      Ergänze `direction_name()`, so dass sie für vier oder acht Namen funktioniert: Der Vollkreis wird in gleich große Sektoren geteilt, der Winkel gerundet und in den gültigen Bereich gefaltet.
    lang: gdscript
    code: |
      func direction_name(dir: Vector2) -> String:
      	var names := NAMES_8 if eight_directions else NAMES_4
      	var step := ⟦TAU⟧ / names.size()
      	return names[⟦wrapi⟧(roundi(dir.⟦angle⟧() / step), 0, names.size())]
    gaps:
      - label: Vollkreis
        hint: Die Konstante für 2π.
        accept: ["2 * PI", "PI * 2"]
      - label: In den Bereich falten
        hint: Eine Funktion mit Wert, Untergrenze und Obergrenze, die −1 auf das Ende des Bereichs zurückführt.
      - label: Winkel des Vektors
        hint: Liefert den Winkel zur x-Achse im Bogenmaß.
    explanation: |
      `TAU` ist der Vollkreis im Bogenmaß; geteilt durch vier ergibt sich ein Sektor von 90°, durch acht einer von 45°. `angle()` liefert −π bis π, also auch negative Werte; `wrapi()` macht aus −1 die 3 und aus −2 die 2. GDScript würde negative Indizes vom Ende des Arrays lesen und hier dasselbe treffen, aber das wäre ein Zufall der Sprache, keine Absicht im Code.
    resources:
      - title: Godot Docs · @GlobalScope.wrapi
        url: https://docs.godotengine.org/en/stable/classes/class_@globalscope.html#class-globalscope-method-wrapi

  - id: haengt-auf-frame-null
    type: bug
    title: Die Figur läuft auf der Stelle
    prompt: |
      Ein Coding-Agent hat diese Fassung geschrieben. Die Figur zeigt beim Laufen nur das Feld mit der Nummer 1, der Block auf dem Richtungsbogen rückt nie weiter. Fehlermeldungen gibt es keine. Finde die Zeile, die das verursacht.
    lang: gdscript
    code: |
      func _process(_delta: float) -> void:
      	var state := "walk" if player.velocity.length() > walk_threshold else "idle"
      	var next := StringName(state + "_" + direction_name(player.facing))
      	stop()
      	play(next)
    lines: [4]
    explanation: |
      `stop()` setzt die Animation auf Frame 0 zurück, und `play()` startet sie neu. Weil das jedes Bild passiert, kommt sie nie über Frame 0 hinaus. Gemessen mit Godot 4.7.2: Mit `stop()` steht nach 10, 20 und 30 Bildern Frame 0, ohne `stop()` Frame 1, 2 und 3. Die Zeile muss weg; `play()` mit demselben Namen lässt die Animation weiterlaufen. Ein ähnliches Muster ist `frame = 0` in `_process`.
    resources:
      - title: Godot Docs · AnimatedSprite2D.stop
        url: https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-method-stop

  - id: acht-ohne-acht
    type: bug
    title: Fehlermeldung bei jeder Diagonale
    prompt: |
      Läuft die Figur diagonal, füllt sich die Ausgabe mit `ERROR: There is no animation with name 'walk_down_right'.`, und die Figur behält das alte Bild. SpriteFrames enthält `idle_*` und `walk_*` für right, down, left und up. Hier ist der Node aus `player.tscn`. Finde die Zeile und korrigiere sie, ohne neue Animationen anzulegen.
    lang: ini
    code: |
      [node name="Sprite" type="AnimatedSprite2D" parent="." unique_id=942859769]
      sprite_frames = SubResource("SpriteFrames_7ahtn")
      animation = &"idle_down"
      offset = Vector2(0, -8)
      script = ExtResource("4_sweqy")
      eight_directions = true
    lines: [6]
    fix:
      - line: 6
        answers:
          - eight_directions = false
    explanation: |
      Mit `eight_directions = true` rundet das Skript auf acht Sektoren und verlangt Namen wie `walk_down_right`. Die gibt es nicht, `play()` meldet den Fehler jedes Bild und lässt die alte Animation stehen. Mit `false` (oder ohne die Zeile, weil das der Standard ist) rundet das Skript auf vier Richtungen. Die Meldung ist mit Godot 4.7.2 nachgestellt. Ob du acht Richtungen zeichnest, entscheidest du; dann muss SpriteFrames sie auch enthalten.
    resources:
      - title: Godot Docs · AnimatedSprite2D.play
        url: https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-method-play

  - id: finished-kommt-nie
    type: bug
    title: Das Signal kommt nie
    prompt: |
      Ein Skript spielt die Platzhalter-Animation `test_once` und wartet mit `await sprite.animation_finished` auf ihr Ende. Die Animation läuft, aber der Code danach wird nie ausgeführt. Hier ist der Ausschnitt aus der SpriteFrames-Ressource. Finde die Zeile und korrigiere sie.
    lang: ini
    code: |
      }, {
      "frames": [{
      "duration": 1.0,
      "texture": SubResource("AtlasTexture_2hs0m")
      }],
      "loop": 1,
      "name": &"test_once",
      "speed": 8.0
      }, {
    lines: [6]
    fix:
      - line: 6
        answers:
          - '"loop": 0,'
          - '"loop": 0'
    explanation: |
      `"loop": 1` heißt wiederholen. Eine Schleife hat kein Ende, also gibt es kein `animation_finished`, sondern bei jedem Durchlauf `animation_looped`. Mit `"loop": 0` läuft die Animation einmal und meldet sich am Ende. Gemessen mit Godot 4.7.2: vier Frames bei 8 FPS ohne Loop melden `animation_finished` nach 30 Bildern, also 0,5 s; mit Loop kommt nur `animation_looped`. Im Panel ist das der Schalter *Animations-Looping*.
    resources:
      - title: Godot Docs · AnimatedSprite2D.animation_finished
        url: https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-signal-animation-finished

  - id: phase-erklaeren
    type: explain
    title: Warum merkt sich das Skript den Frame?
    prompt: |
      Erkläre in wenigen Sätzen, was diese Zeilen aus `player_animation.gd` bewirken und was ohne die letzten drei Zeilen passieren würde.
    lang: gdscript
    code: |
      	var next := StringName(state + "_" + dir_name)
      	if next == animation and is_playing():
      		return
      	var same_state := String(animation).begins_with(state)
      	var keep_frame := frame
      	var keep_progress := frame_progress
      	play(next)
      	if same_state:
      		set_frame_and_progress(keep_frame, keep_progress)
    points:
      - Läuft schon die richtige Animation, kehrt das Skript sofort zurück und spart sich `play()` und `set_frame_and_progress()`; neu starten würde sie auch ohne diese Abfrage nicht.
      - Bei einem neuen Namen setzt `play()` das Sprite auf Frame 0.
      - Bleibt der Zustand gleich (etwa `walk` zu `walk`), übernimmt das Skript Frame und Fortschritt; der Laufzyklus geht beim Richtungswechsel nahtlos weiter.
      - Wechselt der Zustand (etwa `idle` zu `walk`), beginnt die neue Animation bewusst bei Frame 0.
    explanation: |
      Die erste Abfrage spart Aufrufe, wenn sich nichts ändert; `play()` mit demselben Namen ließe die Animation ohnehin weiterlaufen. Danach merkt sich das Skript, wo der alte Zyklus stand. `play()` mit neuem Namen springt auf Frame 0; `set_frame_and_progress()` setzt Frame und Fortschritt zurück, aber nur, wenn die Figur weiterläuft. Ohne die drei Zeilen begänne der Zyklus bei jedem Richtungswechsel neu, die Figur stolperte bei jeder Kurve. Das funktioniert, solange alle Laufanimationen gleich viele Frames haben; das ist eine Vorgabe an die Zeichnungen.
    resources:
      - title: Godot Docs · AnimatedSprite2D.set_frame_and_progress
        url: https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-method-set-frame-and-progress

  - id: richtungsbogen-einbauen
    type: practice
    title: Den Richtungsbogen ins Testgelände bringen
    prompt: |
      Leg den Richtungsbogen an (64 × 64, vier Zeilen R, D, L, U zu je vier Feldern mit Nummer, Block und Fußmarke) und importiere ihn wie den Testbogen. Mach aus dem Node `Sprite` unter dem Player ein `AnimatedSprite2D`, leg die Animationen `idle_right` … `walk_up` an und häng `player_animation.gd` an. Prüfe alle vier Richtungen, die vier Diagonalen und das Stehen.
    lang: ini
    solution: |
      ; player.tscn nach dem Speichern in Godot 4.7.2 (Auszug, ids weichen ab)

      [ext_resource type="Texture2D" uid="uid://blhbfbwn481j2" path="res://test_assets/test_sheet_directions.png" id="3_hqtel"]
      [ext_resource type="Script" uid="uid://dyqm1r18nljfv" path="res://player_animation.gd" id="4_sweqy"]

      [sub_resource type="AtlasTexture" id="AtlasTexture_2hs0m"]
      atlas = ExtResource("3_hqtel")
      region = Rect2(0, 16, 16, 16)

      ; … 15 weitere AtlasTextures, eine je Feld

      [sub_resource type="SpriteFrames" id="SpriteFrames_7ahtn"]
      animations = [{
      "frames": [{
      "duration": 1.0,
      "texture": SubResource("AtlasTexture_2hs0m")
      }],
      "loop": 1,
      "name": &"idle_down",
      "speed": 5.0
      }, …, {
      "frames": [ … vier Frames der Zeile D … ],
      "loop": 1,
      "name": &"walk_down",
      "speed": 8.0
      }, …]

      [node name="Sprite" type="AnimatedSprite2D" parent="." unique_id=942859769]
      sprite_frames = SubResource("SpriteFrames_7ahtn")
      animation = &"idle_down"
      offset = Vector2(0, -8)
      script = ExtResource("4_sweqy")
    checklist:
      - SpriteFrames enthält acht Animationen, `idle_*` mit einem Frame, `walk_*` mit vier, und jede `walk_*` zeigt die Buchstaben ihrer Zeile.
      - Beim Laufen nach oben erscheinen U1 bis U4 nacheinander, beim Loslassen bleibt U1 stehen.
      - Du hast die vier Tastatur-Diagonalen getestet und notiert, welche Richtung jede zeigt.
      - Beim Wechsel von rechts nach unten während des Laufens springt die Nummer nicht auf 1 zurück.
      - Mit `mirror_left` an zeigt das Laufen nach links ein gespiegeltes R.
      - Die Ausgabe zeigt beim Testen keine Fehlermeldung.
    explanation: |
      Der Richtungsbogen macht jede Entscheidung des Skripts sichtbar: Der Buchstabe zeigt die Richtung, die Nummer die Phase, der gespiegelte Buchstabe das Spiegeln. Mit Godot 4.7.2 nachgemessen: Nach oben laufen zeigt `walk_up` Frame 0 bis 3, rechts plus oben ergibt mit vier Richtungen ebenfalls `walk_up`, nach dem Loslassen kommt `idle_up`. Die Werte in der Lösung sind Platzhalter. Wenn deine Figuren kommen, tauschst du nur die Bilder in SpriteFrames aus; Namen und Skript bleiben.
    resources:
      - title: Godot Docs · 2D sprite animation
        url: https://docs.godotengine.org/en/stable/tutorials/2d/2d_sprite_animation.html

  - id: animationsplan
    type: practice
    title: Dein Animationsplan
    prompt: |
      Schreib einen kurzen Plan für die Animationen deiner Spielfigur, so dass ein Coding-Agent und du beim Zeichnen dieselbe Liste benutzt. Lege fest: wie viele Richtungen, ob links gespiegelt wird, welche Zustände es gibt, wie die Animationen heißen, mit welcher FPS und wie vielen Frames du startest und was auf Tastatur-Diagonalen gelten soll. Rechne für den Laufzyklus aus, welche FPS zu deinem Platzhalter-Tempo und deinem geplanten Schrittweg passt. Alle Zahlen sind Platzhalter, die du später im Spiel prüfst.
    lang: prose
    checklist:
      - Der Plan nennt die Zahl der Richtungen und begründet sie mit deinem Zeichenaufwand oder dem Spielgefühl, nicht mit einer Vorgabe.
      - Er sagt, ob links gespiegelt wird, und nennt mindestens ein Detail, das beim Spiegeln stören könnte, oder warum es keins gibt.
      - Jede Animation hat einen Namen nach einem festen Schema, FPS und Frame-Zahl als Platzhalter.
      - Für den Laufzyklus steht die Rechnung Tempo × Frames / Schrittweg mit deinen Zahlen da.
      - Eine Regel für Tastatur-Diagonalen ist festgehalten.
      - Du hast notiert, woran du im Spiel prüfst, ob die Füße rutschen.
    hints:
      - Die Tabelle mit den gemessenen Diagonalen aus der Lektion zeigt, was ohne eigene Regel passiert.
      - Ein Schrittweg lässt sich in der Zeichnung messen, indem du einem Fuß folgst, solange er am Boden steht.
    explanation: |
      Der Plan ist die Schnittstelle zwischen Zeichnung und Code. Er macht Entscheidungen sichtbar, die sonst ein Coding-Agent nebenbei trifft: wie viele Richtungen, was auf der Diagonale gilt, ob gespiegelt wird. Die Rechnung für die FPS gibt dir einen Startwert, kein Urteil. Ob ein leichtes Gleiten zu deinem Stil passt, siehst du erst im Spiel.
    resources:
      - title: Godot Docs · SpriteFrames
        url: https://docs.godotengine.org/en/stable/classes/class_spriteframes.html
