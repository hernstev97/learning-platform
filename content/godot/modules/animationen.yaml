id: animationen
title: "Animationen zuordnen: SpriteFrames, AnimationPlayer und Blickrichtung"
level: 2
minutes: 150
summary: Wie du Frames aus einem Spritesheet in SpriteFrames legst, Takt und Loop einstellst, wann ein AnimationPlayer die bessere Wahl ist und wie ein kleines Skript bei analoger 360°-Bewegung die passende Richtung wählt, ohne dass der Laufzyklus bei jedem Richtungswechsel neu startet.
place: pc
goals:
  - Du legst in SpriteFrames Animationen aus einem Spritesheet an und stellst FPS, Loop und Frame-Dauer ein.
  - Du rechnest aus FPS, Frame-Dauer und `speed_scale` aus, wie lange ein Frame und ein Zyklus dauern.
  - Du entscheidest begründet zwischen `AnimatedSprite2D` und `AnimationPlayer`.
  - Du erklärst, wie `player_animation.gd` aus `facing` und `velocity` eine von vier oder acht Richtungen wählt und warum Diagonalen auf der Grenze landen.
  - Du rechnest nach, bei welcher FPS ein Laufzyklus zum Tempo der Figur passt, und erkennst Fußrutschen.
