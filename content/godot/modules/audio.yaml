id: audio
title: "Audio zuordnen: Player, Busse, Dezibel und der richtige Moment"
level: 2
minutes: 130
summary: Wie du eigene Töne importierst, sie mit AudioStreamPlayer oder AudioStreamPlayer2D abspielst, über Busse in Dezibel abmischst und im richtigen Moment auslöst – aus Code, aus einer Zeitleiste oder beim passenden Frame –, ohne dass queue_free() den Ton abschneidet.
place: pc
goals:
  - Du importierst WAV- und Ogg-Dateien und erklärst, was Loop-Modus und Kompression im Import-Dock bewirken.
  - Du unterscheidest `AudioStreamPlayer` und `AudioStreamPlayer2D` und sagst vorher, wie Abstand und Seite die Lautstärke ändern.
  - Du legst Busse an, ordnest Player zu und rechnest zwischen Dezibel und Amplitude um.
  - Du löst Töne aus Code, aus einem `AnimationPlayer` und über `frame_changed` aus und erklärst, warum ein Ton im gelöschten Pickup verstummt.
  - Du variierst wiederholte Töne mit `AudioStreamRandomizer`.
resources:
  - title: Godot Docs · Audio buses
    url: https://docs.godotengine.org/en/stable/tutorials/audio/audio_buses.html
  - title: Godot Docs · Audio streams
    url: https://docs.godotengine.org/en/stable/tutorials/audio/audio_streams.html
  - title: Godot Docs · Importing audio samples
    url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html
  - title: Godot Docs · AudioStreamPlayer2D
    url: https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer2d.html
lesson: |
  Du hängst an das Pickup im Testgelände einen `AudioStreamPlayer`, rufst beim Einsammeln `play()` auf, und es bleibt still. Der Zähler im HUD springt, der Ton fehlt. Die Schritte der Figur klingen wie ein Maschinengewehr aus identischen Klicks, und als du später fragst, warum ein Ton zu laut ist, weiß niemand, wo seine Lautstärke eingestellt wird.

  Ton in Godot hat vier Stellen: die importierte Datei, den Player, der sie abspielt, den Bus, über den sie läuft, und den Moment, in dem jemand `play()` aufruft. Dieses Modul geht sie der Reihe nach durch, mit einem Prüfton statt fertiger Sounds. Welche Ereignisse in deinem Spiel klingen, wie laut und wie, entscheidest du. Hier geht es darum, dass der Ton im richtigen Frame, auf dem richtigen Bus und in der Lautstärke ankommt, die du eingestellt hast.

  ## Der Prüfton: ein eigener Klick statt fertiger Sounds

  Für die Tests brauchst du zwei Töne. Einen kurzen Klick oder Klatscher, unter 100 ms, und einen gleichmäßigen Ton von einer Sekunde für Schleifen. Nimm den Klick selbst auf, mit dem Handy oder am Rechner, oder erzeug ihn in REAPER. Exportiere als WAV mit 16 Bit, ohne Stille am Anfang: Jede Millisekunde Stille vor dem Klick ist eine Millisekunde Verzögerung im Spiel ([Edit > Trim](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#edit-trim)). Leg die Dateien als `res://test_assets/test_click.wav` und `test_hum.ogg` ab. Sie sind Messwerkzeuge wie der Testbogen, keine Sounds für dein Spiel.

  Für die Messungen in diesem Modul liefen ein Klick von 80 ms (1 kHz, abklingend) und ein Ton von 220 Hz mit einer Sekunde durch Godot 4.7.2. Die Pegel stammen aus einem `AudioEffectCapture` auf dem Master-Bus.

  ## Import: WAV und Ogg Vorbis

  WAV ist roh oder leicht komprimiert und kostet beim Abspielen wenig Rechenzeit; laut Doku sind hunderte gleichzeitige Stimmen kein Problem. Ogg Vorbis ist viel kleiner, braucht beim Abspielen aber deutlich mehr Rechenzeit ([Supported audio formats](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#supported-audio-formats)). Kurze Effekte sind deshalb meist WAV, lange Musik Ogg.

  ![Import-Dock für click.wav: Importiere als Microsoft WAV, Erzwingen mit 8-Bit, Mono und Max. Rate aus, Bearbeiten mit Beschneiden und Normalisieren aus, Loop-Modus Detect From WAV, Komprimieren Modus Quite OK Audio](/media/godot/audio/import-wav.png "Godot 4.7.2, Import-Dock des Messklicks click.wav mit Standardwerten")

  Zwei Einstellungen zählen für dich. **Loop-Modus** (Loop Mode) steht auf *Detect From WAV*: Godot übernimmt die Schleifenpunkte aus der Datei, falls es welche gibt. *Disabled* schaltet Schleifen ab, *Forward* wiederholt ([Edit > Loop Mode](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#edit-loop-mode)). **Komprimieren → Modus** steht auf *Quite OK Audio*, einer verlustbehafteten Kompression mit laut Doku hoher Qualität und wenig Speicher. Für Ogg-Dateien zeigt das Dock nur *Loop* (aus), *Loop-Versatz* und Takt-Angaben; *Erweitert …* öffnet einen Dialog mit Vorhör.

  Ob eine Datei in Schleife läuft, entscheidet über ein Signal: `finished` kommt nur, wenn der Ton endet. Gemessen mit dem Ton von einer Sekunde: ohne Loop `finished nach 1.0 s`, mit Loop nach 2,5 s noch `playing=true` und kein `finished`. Code, der auf das Ende eines Tons wartet, wartet bei einer Schleife ewig.

  ## AudioStreamPlayer und AudioStreamPlayer2D

  Ein `AudioStreamPlayer` spielt ohne Ort: gleich laut, mittig, egal wo der Node steht. Für Musik, Menüs und Töne, die zur Figur gehören, reicht das. Ein `AudioStreamPlayer2D` hat eine Position. Er wird mit dem Abstand leiser und wandert zwischen linkem und rechtem Kanal. Gehört wird laut Doku von der Bildschirmmitte aus, solange kein `AudioListener2D` aktiv ist ([AudioStreamPlayer2D](https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer2d.html)). Im Testgelände folgt die Kamera der Figur, die Bildschirmmitte ist also die Figur.

  Die Lautstärke fällt mit `(1 − Abstand / max_distance) ^ attenuation`. Der Standard für `max_distance` ist 2000 Pixel, für `attenuation` 1,0. Gemessen mit dem 220-Hz-Ton, Quelle rechts von der Bildschirmmitte, Spitzenpegel links / rechts:

  | Abstand | `attenuation` 1 | `attenuation` 2 |
  | --- | --- | --- |
  | 0 px | 0.1246 / 0.1246 | 0.1246 / 0.1246 |
  | 160 px (Bildrand) | 0.0860 / 0.1433 | 0.0791 / 0.1319 |
  | 1000 px | 0.0313 / 0.0938 | 0.0156 / 0.0469 |
  | 2010 px | 0 / 0 | 0 / 0 |

  Links plus rechts ergibt die Gesamtlautstärke: bei 1000 px die Hälfte, mit `attenuation` 2 ein Viertel. Am Bildrand eines 320 Pixel breiten Spiels ist die Quelle nur 8 % leiser als in der Mitte; mit den Standardwerten hörst du Dinge, die sechs Bildschirmbreiten entfernt sind. Ganz auf eine Seite wandert der Ton mit dem Standard-Panning (`audio/general/2d_panning_strength` 0,5) nie, gemessen höchstens 3 : 1. Welche Reichweite deine Töne haben, entscheidest du; die Tabelle zeigt, wo du anfängst.

  Beide Player haben `volume_db` (Standard 0), `pitch_scale` und `max_polyphony`. Bei `max_polyphony` 1, dem Standard, schneidet ein neues `play()` den laufenden Ton ab ([max_polyphony](https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer2d.html#class-audiostreamplayer2d-property-max-polyphony)). Und: Einen `AudioStreamPlayer2D` unsichtbar zu schalten, macht ihn nicht stumm; der `AudioStreamPlayer` hat gar keine Sichtbarkeit.

  ## Busse und Dezibel: wo die Lautstärke wohnt

  Ein Bus ist ein Kanal, durch den Ton auf dem Weg zum Lautsprecher läuft, mit Lautstärkeregler, Effekten und Pegelanzeige ([Audio buses](https://docs.godotengine.org/en/stable/tutorials/audio/audio_buses.html)). Ganz links steht `Master`, er geht an die Lautsprecher. Im unteren Panel *Audio* legst du mit *Audiobus hinzufügen* weitere an. Jeder Bus hat die Knöpfe S, M und B: *Allein* (Solo), *Stummschalten* (Mute) und *Bypass* für die Effekte, darunter *Effekt hinzufügen* und das Ziel, an das er sendet.

  ![Audio-Panel mit zwei Bussen: Master mit Regler bei 0 dB, SFX mit Regler bei −6 dB, je mit Knöpfen S, M, B, Effekt hinzufügen und Ziel; oben Layout default_bus_layout.tres und der Knopf Audiobus hinzufügen](/media/godot/audio/audio-busse.png "Godot 4.7.2, Audio-Panel mit dem Platzhalter-Bus SFX")

  Godot speichert das Layout in `res://default_bus_layout.tres`. Mit einem Bus `SFX` (Name als Platzhalter) steht dort:

  ```ini title=default_bus_layout.tres
  [gd_resource type="AudioBusLayout" format=3]

  [resource]
  bus/1/name = &"SFX"
  bus/1/solo = false
  bus/1/mute = false
  bus/1/bypass_fx = false
  bus/1/volume_db = 0.0
  bus/1/send = &"Master"
  ```

  Ein Player wählt seinen Bus über die Eigenschaft `bus`, und zwar über den **Namen**. Benennst du einen Bus um, landen alle Player, die den alten Namen tragen, auf `Master`, ohne Fehlermeldung ([Bus rearrangement](https://docs.godotengine.org/en/stable/tutorials/audio/audio_buses.html#bus-rearrangement)). Gemessen: Ein Player mit `bus = &"Sfx"`, während der Bus `SFX` heißt und auf −20 dB steht, spielt mit vollem Pegel 0.2443 statt 0.0244.

  **Dezibel** sind ein Verhältnis, kein absoluter Wert. Für die Amplitude, den Ausschlag der Welle, gilt dB = 20 × log10(Verhältnis). −6 dB halbieren die Amplitude, −20 dB teilen sie durch zehn. Die Doku schreibt, −6 dB seien „half as loud“; gemeint ist die Amplitude, wie laut es wirkt, beurteilst du mit dem Ohr ([Decibel scale](https://docs.godotengine.org/en/stable/tutorials/audio/audio_buses.html#decibel-scale)). Gemessen: derselbe Ton mit `volume_db` 0 hat den Pegel 0.2443, mit −6 dB 0.1224. Zum Umrechnen gibt es `linear_to_db()` und `db_to_linear()` ([linear_to_db](https://docs.godotengine.org/en/stable/classes/class_@globalscope.html#class-globalscope-method-linear-to-db)):

  ```text
  linear_to_db(0.5)   = -6.02059991327962
  db_to_linear(-6)    = 0.50118723362727
  db_to_linear(-20)   = 0.1
  ```

  Über 0 dB auf dem Master-Bus übersteuert das Signal. Zwischen −60 und −80 dB gilt ein Ton laut Doku als nicht mehr hörbar.

  Für Webentwickler: Ein Bus ist ein `GainNode` in der Web Audio API, Effekte sind weitere Knoten davor, `Master` ist `destination`. Die Grenze: Godot leitet nur nach links weiter, zu einem Bus weiter vorn in der Liste, statt beliebige Graphen zu erlauben.

  > [!MERKE]
  > Die Lautstärke eines Tons ist die Summe aus `volume_db` am Player und den Reglern aller Busse auf seinem Weg. Such sie an diesen Stellen, und schreib in jede Aufgabe für einen Coding-Agenten, welcher Bus gemeint ist.

  ## Der richtige Moment: Code, Zeitleiste, Frame

  ### Aus Code: das Pickup und queue_free()

  `pickup.gd` ruft beim Einsammeln `queue_free()` auf. Hängt der Player als Kind am Pickup, verschwindet er mit ihm. Gemessen mit dem Ton von 220 Hz: Pegel 0.2443 vor `queue_free()`, 0.0 danach. Hängst du den Player vor dem Löschen mit `reparent()` an einen anderen Node, spielt er weiter und meldet nach rund einer Sekunde `finished`.

  Im Testgelände geht es ohne Eingriff in `pickup.gd`: Der Player sendet schon das Signal `collected`. Ein `AudioStreamPlayer` namens `PickupSound` in `main.tscn` hört darauf und lebt weiter, wenn das Pickup verschwindet:

  ```gdscript title=pickup_sound.gd
  extends AudioStreamPlayer

  ## Spielt den Platzhalter-Ton, wenn der Player etwas einsammelt.
  ## Der Node lebt in main.tscn weiter, auch wenn das Pickup verschwindet.


  func _on_player_collected(_total: int) -> void:
  	play()
  ```

  Nach dem Verbinden im Dock *Signale* und dem Speichern in Godot 4.7.2 steht in `main.tscn` (Auszug):

  ```ini title=main.tscn
  [node name="PickupSound" type="AudioStreamPlayer" parent="." unique_id=428933553]
  stream = ExtResource("5_7mycd")
  bus = &"SFX"
  script = ExtResource("6_272bh")

  [connection signal="collected" from="Objects/Player" to="PickupSound" method="_on_player_collected"]
  ```

  Gemessen: Nach dem Einsammeln hat der Master-Bus den Pegel des Klicks. Verbindest du `collected` dagegen direkt mit `play`, bleibt es still. Das Signal übergibt `total`, und `play()` nimmt sein erstes Argument als Startposition in Sekunden: Der Klick von 80 ms startet bei Sekunde 1.

  ### Aus einer Zeitleiste

  Gehört ein Ton zu einem Ablauf mit festen Frames, etwa einem Angriff, legst du ihn als Audio Playback Track in den `AnimationPlayer` oder rufst `play` über eine Call Method Track auf ([Audio Playback Track](https://docs.godotengine.org/en/stable/tutorials/animation/animation_track_types.html#audio-playback-track)). Dann sitzt er im selben Takt wie Hitbox und Bild. Für Treffer gilt: Der Ton gehört in den Frame, in dem der Treffer gemeldet wird, nicht in den, in dem die Hitbox angeht ([Trefferfeedback](/combat/trefferfeedback)).

  ### Beim passenden Frame: Schritte

  Schritte hängen am Laufzyklus. Das `AnimatedSprite2D` aus [Animationen zuordnen](/godot/animationen) sendet `frame_changed`; ein eigener Node `Footsteps` unter dem Player hört darauf:

  ```gdscript title=footsteps.gd
  extends AudioStreamPlayer

  ## Spielt einen Schritt, wenn das Sprite einen Schritt-Frame erreicht.
  ## Welche Frames Schritte sind, ist ein Platzhalter: Du legst es fest.

  @export var step_frames: Array[int] = [0, 2]

  var _last_frame := -1

  @onready var sprite: AnimatedSprite2D = $"../Sprite"


  func _ready() -> void:
  	# Deferred: erst prüfen, wenn player_animation.gd den Frame fertig gesetzt hat.
  	sprite.frame_changed.connect(_check_step, CONNECT_DEFERRED)
  	sprite.animation_changed.connect(_check_step, CONNECT_DEFERRED)


  func _check_step() -> void:
  	if not String(sprite.animation).begins_with("walk"):
  		_last_frame = -1
  		return
  	if sprite.frame != _last_frame and sprite.frame in step_frames:
  		play()
  	_last_frame = sprite.frame
  ```

  Warum reicht `frame_changed` allein nicht? Zwei Messungen mit der ersten, kürzeren Fassung. Beim Loslaufen wechselt die Animation von `idle_right` (Frame 0) zu `walk_right` (Frame 0); der Frame ändert sich nicht, `frame_changed` kommt nicht, der erste Schritt fehlt. Erst bei Frame 2 klingt der erste Schritt, bei 8 FPS also rund 0,25 s später (gemessen 14 Bilder bei 60 pro Sekunde). `animation_changed` kommt dagegen ([animation_changed](https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-signal-animation-changed)). Und beim Richtungswechsel setzt `player_animation.gd` mit `set_frame_and_progress()` den Frame neu, was wieder `frame_changed` auslöst: ein doppelter Schritt. `CONNECT_DEFERRED` prüft erst am Ende des Bilds, wenn der Frame feststeht, und `_last_frame` verhindert die Wiederholung. Gemessen mit der Fassung oben: der erste Schritt sofort beim Loslaufen, dann alle 0,25 s, kein Doppelschritt beim Abbiegen.

  Damit zwanzig Schritte nicht wie einer klingen, nimmt `Footsteps` als `stream` einen `AudioStreamRandomizer`. Er wählt aus mehreren Tönen und verändert Tonhöhe und Lautstärke bei jedem Abspielen ([AudioStreamRandomizer](https://docs.godotengine.org/en/stable/classes/class_audiostreamrandomizer.html)). In Godot 4.7 stellst du die Tonhöhe auch in Halbtönen ein (`random_pitch_semitones`); in der Szene steht danach der Faktor: 1 Halbton wird zu `random_pitch = 1.0594631`. Wie viel Abwechslung deine Schritte vertragen, entscheidest du beim Hören.

  > [!PRAXIS]
  > Bevor ein Ton ins Spiel kommt, ordne ihn einem Bus zu und schreib den Bus in den Node, nicht in den Code. Ein Spieler, der später Musik und Effekte getrennt regeln will, braucht genau diese Trennung. Und wenn ein Ton fehlt, schalte den Bus im Audio-Panel auf *Allein*: Schlägt die Pegelanzeige aus, liegt das Problem hinter dem Bus, sonst davor.

  > [!INTERVIEW]
  > „Ein Sammelgeräusch spielt nicht, obwohl `play()` aufgerufen wird. Woran kann es liegen?“ Gute Antwort, etwa als Gameplay Programmer: Ich prüfe, ob der Player noch lebt, wenn der Ton spielen soll; ein Kind eines Nodes, der gleich `queue_free()` aufruft, verstummt sofort. Dann den Bus: stummgeschaltet, auf sehr niedrigem Pegel oder ein Name, den es nicht mehr gibt. Dann den Stream selbst, etwa Stille am Anfang oder eine Startposition hinter dem Ende. Ich schalte den Bus auf Solo und sehe an der Pegelanzeige, wo der Ton verschwindet.

  ## Häufige Fehler

  - **Ton im Pickup, das sich löscht.** Mit `queue_free()` verschwindet der Player. Ton auf einen Node legen, der weiterlebt, oder vorher mit `reparent()` umhängen.
  - **Signal direkt mit `play` verbunden.** Ein Signal mit Argument startet den Ton an dieser Stelle in Sekunden. Eigene Methode dazwischen.
  - **Bus umbenannt.** Player mit dem alten Namen spielen über `Master`, ohne Meldung.
  - **Auf `finished` gewartet, Datei läuft in Schleife.** Loop im Import-Dock prüfen.
  - **`AudioStreamPlayer2D` mit Standardreichweite in einem kleinen Bild.** 2000 Pixel Reichweite bei 320 Pixeln Breite heißt: kaum Unterschied am Bildrand.
  - **Erster Schritt fehlt, Schritt doppelt.** `frame_changed` allein reicht nicht; `animation_changed` und eine verzögerte Prüfung dazu.
  - **Stille am Anfang der Datei.** Verzögert jeden Ton. *Beschneiden* im Import-Dock oder beim Export schneiden.

  ## Zusammenfassung

  - WAV für kurze Effekte, Ogg für lange Musik. Loop-Modus und Kompression stehen im Import-Dock; eine Schleife meldet nie `finished`.
  - `AudioStreamPlayer` spielt ohne Ort, `AudioStreamPlayer2D` wird mit `(1 − Abstand / max_distance) ^ attenuation` leiser und von der Bildschirmmitte aus gehört.
  - Busse laufen von rechts nach links in `Master`; Player finden ihren Bus über den Namen.
  - −6 dB halbieren die Amplitude, −20 dB teilen sie durch zehn; `linear_to_db()` und `db_to_linear()` rechnen um.
  - Töne gehören auf Nodes, die weiterleben. Signale mit Argument nicht direkt an `play` hängen.
  - Schritte über `frame_changed` und `animation_changed`, verzögert geprüft; Abwechslung über `AudioStreamRandomizer`.
  - Welche Töne, welche Busse, welche Reichweite und wie viel Variation, entscheidest du.
exercises:
  - id: welcher-player
    type: choice
    title: Ort oder kein Ort?
    prompt: |
      Welche Aussagen über die beiden Player stimmen in Godot 4.7? Mehrere Antworten richtig.
    options:
      - text: "`AudioStreamPlayer2D` wird ohne eigenen Listener von der Bildschirmmitte aus gehört."
        correct: true
        why: So steht es in der Doku. Folgt die Kamera der Figur, ist die Bildschirmmitte die Figur.
      - text: Mit den Standardwerten ist eine Quelle am Rand eines 320 Pixel breiten Bilds deutlich leiser als in der Mitte.
        correct: false
        why: Bei 2000 Pixeln Reichweite und `attenuation` 1 fehlen 160 Pixel weit draußen nur 8 %. Gemessen mit Godot 4.7.2.
      - text: Ein unsichtbar geschalteter `AudioStreamPlayer2D` spielt weiter.
        correct: true
        why: Die Doku sagt ausdrücklich, dass Verstecken die Ausgabe nicht abschaltet. Dafür gibt es `volume_db` oder `stop()`.
      - text: "`AudioStreamPlayer` ändert seine Lautstärke, wenn du ihn im Level verschiebst."
        correct: false
        why: Er hat gar keine Position, er ist kein `Node2D`. Für Abstand und Seite brauchst du die 2D-Variante.
    explanation: |
      Der Unterschied ist der Ort. `AudioStreamPlayer` spielt immer gleich, die 2D-Variante rechnet Abstand und Seite relativ zur Bildschirmmitte. Wie stark, hängt an `max_distance` und `attenuation`; die Standardwerte sind für ein Bild mit 320 Pixeln Breite sehr großzügig. Die Entscheidung, welche Töne einen Ort haben, gehört zu deinem Sounddesign.
    resources:
      - title: Godot Docs · AudioStreamPlayer2D
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer2d.html

  - id: bus-einrichten
    type: order
    title: Ein Ton auf seinem eigenen Bus
    prompt: |
      Bring die Schritte in eine sinnvolle Reihenfolge, damit der Prüfklick beim Einsammeln über einen eigenen Bus spielt.
    lang: prose
    lines: |
      Den Klick als WAV ohne Stille am Anfang nach res://test_assets/ legen
      Im Import-Dock Loop-Modus und Kompression prüfen
      Im Panel Audio mit Audiobus hinzufügen einen Bus anlegen und benennen
      In main.tscn einen AudioStreamPlayer PickupSound anlegen, Stream und Bus zuweisen
      pickup_sound.gd anhängen und collected vom Player im Dock Signale mit _on_player_collected verbinden
      Im Spiel ein Pickup einsammeln und die Pegelanzeige des Busses beobachten
    alternatives:
      - [1, 3, 2, 4, 5, 6]
      - [3, 1, 2, 4, 5, 6]
    explanation: |
      Datei und Import kommen vor dem Player, denn der braucht einen fertigen Stream. Den Bus kannst du auch vorher oder danach anlegen; er muss nur existieren, bevor du ihn im Player wählst und testest. Erst mit der Verbindung zu `collected` löst das Einsammeln den Ton aus. Die Pegelanzeige zeigt im Test, ob der Ton über den Bus läuft.
    resources:
      - title: Godot Docs · Audio buses
        url: https://docs.godotengine.org/en/stable/tutorials/audio/audio_buses.html

  - id: dezibel-rechnen
    type: output
    title: Zwischen Dezibel und Amplitude
    prompt: |
      Was geben die beiden Zeilen in Godot 4.7.2 aus?
    lang: gdscript
    code: |
      print(snappedf(linear_to_db(0.5), 0.01))
      print(db_to_linear(-20.0))
    expected: |
      -6.02
      0.1
    accept:
      - |
        -6,02
        0,1
      - |
        -6.02
        0.10
    hints:
      - Für die Amplitude gilt dB = 20 × log10(Verhältnis).
      - 20 × log10(0,5) ist knapp −6.
    explanation: |
      Die halbe Amplitude sind 20 × log10(0,5) = −6,02 dB, daher die Faustregel „−6 dB halbieren“. −20 dB entsprechen 10^(−20/20) = 0,1, ein Zehntel. Gemessen am Pegel: Ein Ton mit 0.2443 kam mit −6 dB auf 0.1224 und über einen Bus mit −20 dB auf 0.0244. Ungerundet gibt Godot 4.7.2 für die erste Zeile `-6.02059991327962` aus; `snappedf()` rundet auf zwei Stellen. Die Ausgabe stammt aus einem Lauf mit Godot 4.7.2.
    resources:
      - title: Godot Docs · @GlobalScope.linear_to_db
        url: https://docs.godotengine.org/en/stable/classes/class_@globalscope.html#class-globalscope-method-linear-to-db

  - id: halbtoene-faktor
    type: output
    title: Halbtöne in Faktoren
    prompt: |
      Was gibt der Code aus?
    lang: gdscript
    code: |
      var r := AudioStreamRandomizer.new()
      r.random_pitch_semitones = 2.0
      print(snappedf(r.random_pitch, 0.0001))
      r.random_pitch = 2.0
      print(r.random_pitch_semitones)
    expected: |
      1.1225
      12.0
    accept:
      - |
        1.1225
        12
      - |
        1,1225
        12,0
      - |
        1,1225
        12
    hints:
      - Ein Halbton ist der Faktor 2^(1/12).
      - Eine Oktave sind zwölf Halbtöne und verdoppelt die Frequenz.
    explanation: |
      Beide Eigenschaften beschreiben dieselbe Spanne. Zwei Halbtöne sind 2^(2/12) = 1,1225; der Randomizer wählt die Tonhöhe dann zwischen 1/1,1225 und 1,1225. Der Faktor 2,0 ist eine Oktave, also 12 Halbtöne. In der Szene speichert Godot den Faktor (`random_pitch`), auch wenn du Halbtöne eingibst. Ungerundet gibt Godot 4.7.2 `1.12246203422546` aus; der Wert ist intern eine Gleitkommazahl mit begrenzter Genauigkeit, deshalb rundet `snappedf()` auf vier Stellen.
    resources:
      - title: Godot Docs · AudioStreamRandomizer.random_pitch_semitones
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamrandomizer.html#class-audiostreamrandomizer-property-random-pitch-semitones

  - id: reichweite-prozent
    type: output
    title: Wie viel kommt an?
    prompt: |
      Ein `AudioStreamPlayer2D` steht 1000 Pixel rechts von der Bildschirmmitte, `max_distance` 2000, `attenuation` 2. Wie viel Prozent der Amplitude kommen insgesamt (links plus rechts) an, verglichen mit derselben Quelle in der Mitte? Antworte mit der Zahl in Prozent.
    lang: text
    code: |
      Abstand:      1000 px
      max_distance: 2000 px
      attenuation:  2
    expected: |
      25
    accept:
      - 25 %
      - 25%
      - "0,25"
      - "0.25"
    hints:
      - "Faktor = (1 − Abstand / max_distance) ^ attenuation."
    explanation: |
      (1 − 1000 / 2000)² = 0,5² = 0,25. Gemessen mit Godot 4.7.2: in der Mitte 0.1246 je Kanal, zusammen 0.2492; bei 1000 Pixeln mit `attenuation` 2 links 0.0156 und rechts 0.0469, zusammen 0.0625, also ein Viertel. Mit `attenuation` 1 wäre es die Hälfte. Die Verteilung auf links und rechts kommt vom Panning und ändert die Summe nicht.
    resources:
      - title: Godot Docs · AudioStreamPlayer2D.attenuation
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer2d.html#class-audiostreamplayer2d-property-attenuation

  - id: pickup-sound-zeilen
    type: gap
    title: Ein Ton, der weiterlebt
    prompt: |
      Ergänze den Ausschnitt aus `main.tscn`: `PickupSound` spielt über den Bus `SFX` und reagiert auf das Signal des Players, mit dem er Einsammeln meldet.
    lang: ini
    code: |
      [node name="PickupSound" type="⟦AudioStreamPlayer⟧" parent="." unique_id=428933553]
      stream = ExtResource("5_7mycd")
      bus = &"⟦SFX⟧"
      script = ExtResource("6_272bh")

      [connection signal="⟦collected⟧" from="Objects/Player" to="PickupSound" method="⟦_on_player_collected⟧"]
    gaps:
      - label: Node-Typ
        hint: Ein Player ohne Position genügt, die Figur ist die Bildschirmmitte.
      - label: Bus
        hint: Der Name aus dem Audio-Panel, genau so geschrieben.
      - label: Signal
        hint: Steht in `player.gd` hinter `signal`.
      - label: Methode
        hint: Die Methode aus `pickup_sound.gd`.
    explanation: |
      Der Node hängt direkt unter `Main` und überlebt damit jedes Pickup. Der Bus wird über den Namen gefunden, Groß- und Kleinschreibung zählen. Die Verbindung führt vom Signal `collected` des Players zur eigenen Methode, die `play()` ohne Argument aufruft. So stand es nach dem Speichern in Godot 4.7.2 in der Datei; `unique_id` und die ids der Ressourcen weichen bei dir ab.
    resources:
      - title: Godot Docs · AudioStreamPlayer.bus
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer.html#class-audiostreamplayer-property-bus

  - id: ton-im-pickup
    type: bug
    title: Der Zähler steigt, der Ton fehlt
    prompt: |
      Ein Coding-Agent hat dem Pickup ein Kind `Sound` (`AudioStreamPlayer`) gegeben und `pickup.gd` so geändert. Beim Einsammeln steigt der Zähler im HUD, aber nichts ist zu hören. Der Bus ist nicht stumm. Finde die Zeile, die den Ton verhindert.
    lang: gdscript
    code: |
      func _on_body_entered(body: Node2D) -> void:
      	if body is Player:
      		body.collect(value)
      		$Sound.play()
      		queue_free()
    lines: [5]
    explanation: |
      `queue_free()` löscht das Pickup am Ende des Bilds, mit allen Kindern, auch dem Player, der gerade angefangen hat zu spielen. Gemessen mit Godot 4.7.2 und dem Ton von 220 Hz: Pegel 0.2443 vor dem Löschen, 0.0 danach. Lösungen: den Ton auf einen Node legen, der weiterlebt, wie `PickupSound` in `main.tscn`; oder `$Sound.reparent(get_parent())` vor `queue_free()` und den Sound mit `finished` selbst löschen lassen; oder das Pickup verstecken, seine Form abschalten und erst nach `finished` löschen.
    resources:
      - title: Godot Docs · Node.queue_free
        url: https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-method-queue-free

  - id: direkt-an-play
    type: bug
    title: Verbunden, aber stumm
    prompt: |
      Statt eines Skripts hat ein Coding-Agent das Signal direkt mit der Methode `play` des `PickupSound` verbunden. Beim ersten Einsammeln ist nichts zu hören, eine Fehlermeldung gibt es nicht. Finde die Zeile und korrigiere sie so, dass die Methode aus `pickup_sound.gd` aufgerufen wird.
    lang: ini
    code: |
      [node name="PickupSound" type="AudioStreamPlayer" parent="." unique_id=428933553]
      stream = ExtResource("5_7mycd")
      bus = &"SFX"
      script = ExtResource("6_272bh")

      [connection signal="collected" from="Objects/Player" to="PickupSound" method="play"]
    lines: [6]
    fix:
      - line: 6
        answers:
          - '[connection signal="collected" from="Objects/Player" to="PickupSound" method="_on_player_collected"]'
    explanation: |
      `collected` übergibt die Gesamtzahl, beim ersten Pickup 1. Verbunden mit `play` landet sie im ersten Parameter `from_position`: Der Ton startet bei Sekunde 1, der Klick ist aber nur 80 ms lang. Gemessen mit Godot 4.7.2: Spitzenpegel 0.0031 statt 0.603 mit der eigenen Methode, praktisch Stille. Die eigene Methode `_on_player_collected(_total)` nimmt das Argument an und ruft `play()` ohne Argument auf.
    resources:
      - title: Godot Docs · AudioStreamPlayer.play
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer.html#class-audiostreamplayer-method-play

  - id: bus-falsch-geschrieben
    type: bug
    title: Der Regler wirkt nicht
    prompt: |
      Ein Coding-Agent hat den Node `Footsteps` direkt in `player.tscn` geschrieben. Im Audio-Panel steht der Bus `SFX` auf −20 dB, die Schritte bleiben trotzdem gleich laut, egal wie du den Regler schiebst. Eine Fehlermeldung gibt es nicht. Finde die Zeile und korrigiere sie.
    lang: ini
    code: |
      [node name="Footsteps" type="AudioStreamPlayer" parent="." unique_id=1821499515]
      stream = SubResource("AudioStreamRandomizer_dw050")
      bus = &"Sfx"
      script = ExtResource("6_1jxqw")
    lines: [3]
    fix:
      - line: 3
        answers:
          - bus = &"SFX"
    hints:
      - Wähle den Node im Editor. Welchen Bus zeigt der Inspektor bei *Bus* an?
      - Busnamen unterscheiden Groß- und Kleinschreibung.
    explanation: |
      Player finden ihren Bus über den Namen, und `Sfx` ist nicht `SFX`. Kann Godot den Namen nicht auflösen, spielt der Player über `Master`, ohne Meldung. Gemessen mit Godot 4.7.2: mit `Sfx` Pegel 0.2443, mit `SFX` bei −20 dB Pegel 0.0244. Derselbe Fehler entsteht, wenn jemand einen Bus umbenennt. Im Editor siehst du ihn am Inspektor: Für einen unbekannten Namen liefert die Eigenschaft `bus` `Master`, gemessen zur Laufzeit; gespeichert schreibt der Editor die Zeile dann gar nicht. Die falsche Zeile entsteht also nur, wenn jemand die Datei von Hand oder per Agent schreibt.
    resources:
      - title: Godot Docs · Audio buses · Bus rearrangement
        url: https://docs.godotengine.org/en/stable/tutorials/audio/audio_buses.html#bus-rearrangement

  - id: schritte-erklaeren
    type: explain
    title: Warum zwei Signale und deferred?
    prompt: |
      Eine erste Fassung von `footsteps.gd` hörte nur auf `frame_changed` und prüfte sofort. Gemessen: Beim Loslaufen kam der erste Schritt erst mit Frame 2, rund 0,25 s nach dem Start, und beim Abbiegen klang ein Schritt doppelt. Erkläre, wie die Zeilen unten beides beheben.
    lang: gdscript
    code: |
      func _ready() -> void:
      	sprite.frame_changed.connect(_check_step, CONNECT_DEFERRED)
      	sprite.animation_changed.connect(_check_step, CONNECT_DEFERRED)


      func _check_step() -> void:
      	if not String(sprite.animation).begins_with("walk"):
      		_last_frame = -1
      		return
      	if sprite.frame != _last_frame and sprite.frame in step_frames:
      		play()
      	_last_frame = sprite.frame
    points:
      - Beim Loslaufen bleibt der Frame 0, nur der Name wechselt; `frame_changed` kommt nicht, `animation_changed` schon.
      - Beim Abbiegen setzt `player_animation.gd` den Frame mit `set_frame_and_progress()` zurück, das löst `frame_changed` mit einem Schritt-Frame erneut aus.
      - "`CONNECT_DEFERRED` prüft erst am Ende des Bilds, wenn Animation und Frame feststehen."
      - "`_last_frame` merkt sich den zuletzt geprüften Frame; derselbe Frame löst keinen zweiten Schritt aus, und im Stand wird er zurückgesetzt."
    explanation: |
      Der fehlende erste Schritt liegt daran, dass sich der Frame beim Wechsel von `idle_right` zu `walk_right` nicht ändert: beide stehen auf 0. `animation_changed` fängt diesen Fall. Beim Abbiegen feuern beide Signale mitten im Wechsel, einmal mit Frame 0 und einmal mit dem übernommenen Frame. Verzögert geprüft sieht das Skript nur den Endzustand, und `_last_frame` verhindert, dass der übernommene Schritt-Frame noch einmal klingt. Gemessen mit Godot 4.7.2: erster Schritt sofort, dann alle 0,25 s, kein Doppelschritt.
    resources:
      - title: Godot Docs · Object.connect · ConnectFlags
        url: https://docs.godotengine.org/en/stable/classes/class_object.html#class-object-constant-connect-deferred

  - id: pruefton-einbauen
    type: practice
    title: Prüfton, Bus und Schritte im Testgelände
    prompt: |
      Nimm einen eigenen Klick auf (unter 100 ms, ohne Stille am Anfang) und leg ihn als `res://test_assets/test_click.wav` ab. Leg einen Bus an (Name als Platzhalter), setz `PickupSound` mit `pickup_sound.gd` in `main.tscn` und `Footsteps` mit `footsteps.gd` und einem `AudioStreamRandomizer` unter den Player. Prüfe mit der Pegelanzeige im Audio-Panel und mit Solo und Mute.
    lang: ini
    solution: |
      ; default_bus_layout.tres
      [resource]
      bus/1/name = &"SFX"
      bus/1/solo = false
      bus/1/mute = false
      bus/1/bypass_fx = false
      bus/1/volume_db = 0.0
      bus/1/send = &"Master"

      ; player.tscn nach dem Speichern in Godot 4.7.2 (Auszug, ids weichen ab)
      [sub_resource type="AudioStreamRandomizer" id="AudioStreamRandomizer_dw050"]
      random_pitch = 1.0594631
      random_volume_offset_db = 2.0
      streams_count = 1
      stream_0/stream = ExtResource("5_2hs0m")

      [node name="Footsteps" type="AudioStreamPlayer" parent="." unique_id=1821499515]
      stream = SubResource("AudioStreamRandomizer_dw050")
      bus = &"SFX"
      script = ExtResource("6_1jxqw")
    checklist:
      - Der Klick ist deine eigene Aufnahme oder in REAPER erzeugt, und im Import-Dock steht der Loop-Modus auf *Detect From WAV* oder *Disabled*.
      - Beim Einsammeln schlägt die Pegelanzeige deines Busses aus, und der Ton ist zu hören.
      - Mit *Stummschalten* am Bus `SFX` verstummen Pickup und Schritte. Mit *Allein* am Bus `SFX` bleiben sie hörbar, mit *Allein* am Master verstummen sie.
      - Beim Loslaufen klingt der erste Schritt sofort, beim Abbiegen gibt es keinen Doppelschritt.
      - Pitch- und Lautstärkevariation des Randomizers stehen als Platzhalter in der Szene, und du hast notiert, welche Werte du gehört hast.
      - Die Ausgabe zeigt keine Fehlermeldung, auch nicht, wenn du alle drei Pickups einsammelst.
    explanation: |
      Die Übung prüft die ganze Kette mit einem Ton, den du kennst: Import, Player, Bus, Auslöser. Solo und Mute zeigen, dass der Ton über deinen Bus läuft und nicht direkt über Master. Steht ein Bus auf *Allein*, schweigen alle anderen Busse: Gemessen mit Godot 4.7.2 zeigen die Pegel von Master und `SFX` normal −12,2 dB, mit *Allein* am Master −200 dB (still), mit *Allein* an `SFX` wieder −12,1 dB. Die Variation im Randomizer (hier 1 Halbton und 2 dB) ist ein Platzhalter. Ob deine Schritte mehr oder weniger Abwechslung brauchen, hörst du erst mit deinen eigenen Aufnahmen.
    resources:
      - title: Godot Docs · AudioStreamRandomizer
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamrandomizer.html
      - title: Godot Docs · Audio buses
        url: https://docs.godotengine.org/en/stable/tutorials/audio/audio_buses.html

  - id: klangplan
    type: practice
    title: Dein Klangplan für das Testgelände
    prompt: |
      Schreib einen kurzen Klangplan für die Ereignisse, die dein Spiel hören lassen soll, zunächst für das Testgelände. Lege für jedes Ereignis fest: welcher Player (mit oder ohne Ort), welcher Bus, welcher Auslöser (Code, Zeitleiste oder Frame), ob es eine Schleife ist und wie du prüfst, dass der Ton im richtigen Moment kommt. Lautstärken und Reichweiten sind Platzhalter.
    lang: prose
    checklist:
      - Jedes Ereignis hat einen Player-Typ mit kurzer Begründung (Ort oder kein Ort).
      - Die Busse haben Namen nach einem festen Schema, und jedes Ereignis ist genau einem Bus zugeordnet.
      - Für jedes Ereignis steht der Auslöser da und, bei Frames, welcher Frame.
      - Für Töne mit Ort steht eine Platzhalter-Reichweite, gerechnet mit der Formel aus der Lektion.
      - Du hast für mindestens ein Ereignis notiert, wie du den Moment misst (Pegelanzeige, Frame-Nummer, Ausgabe).
    hints:
      - Nimm die drei Wege aus der Lektion als Spalten einer Tabelle.
      - Die Messung mit Solo und Mute im Audio-Panel ist eine Prüfung, die jeder wiederholen kann.
    explanation: |
      Der Klangplan trennt Technik und Entscheidung. Welche Ereignisse klingen, wie sie klingen und wie laut sie im Verhältnis sind, entscheidest du. Wo ein Ton technisch hingehört, damit er nicht abgeschnitten wird, auf dem richtigen Bus landet und im richtigen Frame kommt, legt der Plan fest. So kann ein Coding-Agent die Player einbauen, ohne dass er eine Entscheidung trifft, die dir gehört.
    resources:
      - title: Godot Docs · Audio streams
        url: https://docs.godotengine.org/en/stable/tutorials/audio/audio_streams.html
