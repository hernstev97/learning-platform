id: aktionen-parameter
title: Eingabeaktionen und exportierte Parameter abstimmen
level: 2
minutes: 130
summary: Tasten über Aktionen zuordnen, auch auf QWERTZ, Aktionen im Code richtig abfragen, exportierte Parameter mit Hints lesen, herausfinden, welcher Wert gilt, Werte im laufenden Spiel ändern, ohne sie zu verlieren, und ihre Wirkung in Frames vorhersagen.
place: unterwegs
goals:
  - Du liest die Eingabe-Zuordnung im Editor und in `project.godot` und erklärst, warum WASD als physische Tasten auf QWERTZ und QWERTY gleich liegt.
  - Du unterscheidest `is_action_pressed()`, `is_action_just_pressed()` und `get_action_strength()` und erkennst Fehler, die aus der Verwechslung entstehen.
  - Du liest exportierte Parameter mit Bereich, Einheit, Auswahl, Gruppe, Dateipfad und Node-Verweis im Inspektor und im Skript.
  - Du sagst vorher, welcher Wert gilt, wenn Skript, Szene, Instanz und `_ready()` verschiedene Werte setzen.
  - Du änderst Werte im laufenden Spiel so, dass sie nach dem Beenden erhalten bleiben, und sagst ihre Wirkung in Frames vorher.
