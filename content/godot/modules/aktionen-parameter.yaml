lesson: |
  Die Figur im Testgelände ist dir zu träge. Du öffnest `player_stats.tres`, ziehst `acceleration` hoch, startest, und nichts ändert sich. Oder es ändert sich, aber nach dem nächsten Start ist der alte Wert zurück, weil du ihn im laufenden Spiel im falschen Inspektor geändert hast. Oder ein Ausweichen löst beim Halten der Taste dreißigmal aus. Keiner dieser Fehler steckt in der Bewegungsrechnung. Sie stecken in der Frage, wo ein Wert lebt, wer ihn zuletzt setzt und wie der Code eine Taste abfragt.

  Hier geht es um die zwei Stellen, an denen du ein Spiel abstimmst, ohne Code zu schreiben: die Eingabe-Zuordnung (Input Map) für Tasten und Sticks und die exportierten Parameter im Inspektor. Ein Coding-Agent baut beides als Gerüst; welche Taste was tut und welche Werte gut sind, entscheidest du. Alle Werte hier sind Platzhalter des Testgeländes, alle Ausgaben stammen aus Läufen mit Godot 4.7.2.

  ## Aktionen statt Tasten: die Eingabe-Zuordnung

  Der Code fragt nie eine Taste ab, sondern eine Aktion (Input Action) mit einem Namen wie `move_right`. Welche Tasten, Stick-Achsen oder Knöpfe eine Aktion auslösen, steht unter *Projekt → Projekteinstellungen → Eingabe-Zuordnung* ([InputMap](https://docs.godotengine.org/en/stable/tutorials/inputs/input_examples.html#inputmap)). Jede Aktion hat dort eine Liste von Ereignissen und eine Totzone (Deadzone), Standard 0,2:

  ![Eingabe-Zuordnung des Testgeländes: Aktionen move_left und move_right mit je A oder D (Physisch), Left oder Right (Physisch) und einer Zeile Joypad Achse 0 für den linken Stick, deren Text abgeschnitten ist; rechts die Spalte Totzone mit 0.2](/media/godot/aktionen-parameter/eingabe-zuordnung.png "Godot 4.7.2, Projekteinstellungen → Eingabe-Zuordnung, Ausschnitt; die Joypad-Zeilen gehen im Editor weiter")

  Gespeichert wird das in `project.godot`, als lange Zeilen mit `Object(…)`. Gekürzt sieht `move_right` so aus:

  ```ini title=project.godot
  [input]

  move_right={
  "deadzone": 0.2,
  "events": [Object(InputEventKey, … "keycode":0,"physical_keycode":68, …)
  , Object(InputEventKey, … "keycode":0,"physical_keycode":4194321, …)
  , Object(InputEventJoypadMotion, … "axis":0,"axis_value":1.0, …)
  ]
  }
  ```

  68 ist die Taste D, 4194321 die Pfeiltaste rechts, Achse 0 mit Wert 1,0 der linke Stick nach rechts. Aus dem Web kennst du das Muster von Tastenkürzeln in einem Editor: Eine Taste ruft einen Befehl mit Namen auf, und der Code reagiert auf den Befehl. Anders als ein `keydown`-Listener fragt `player.gd` den Zustand in jedem Frame ab, statt auf ein Ereignis zu warten; beides geht in Godot ([Events versus polling](https://docs.godotengine.org/en/stable/tutorials/inputs/input_examples.html#events-versus-polling)). Die Deadzone-Rechnung für Sticks steht in [Godot-Start](/combat/godot-start).

  ### Physisch, Tastencode, Label: QWERTZ und QWERTY

  Eine Taste kann Godot auf drei Arten speichern. Im Dialog, mit dem du ein Ereignis hinzufügst, heißen sie in Godot 4.7.2 „Physischer Tastencode (Position auf der US-QWERTY-Tastatur)“, „Tastencode (Lateinäquivalent)“ und „Tasten-Label (Unicode, unabh. Groß-/Kleinschreibung)“. Die Liste zeigt physische Tasten mit dem Zusatz „(Physisch)“.

  - Der **physische Tastencode** (`physical_keycode`) ist eine Position auf einer US-Tastatur. Die Doku nennt ihn ausdrücklich für Spieleingaben wie WASD, „where only the location of the keys is important“ ([InputEventKey.physical_keycode](https://docs.godotengine.org/en/stable/classes/class_inputeventkey.html#class-inputeventkey-property-physical-keycode)).
  - Der **Tastencode** (`keycode`) ist das lateinische Zeichen, das im aktuellen Layout auf der Taste steht, gedacht für Kürzel wie Ctrl+S.
  - Das **Tasten-Label** (`key_label`) ist das Zeichen im aktuellen Layout, auch kyrillisch oder arabisch, gedacht für Anzeigen.

  W, A, S und D liegen auf QWERTZ und QWERTY an denselben Stellen, deshalb fällt der Unterschied dort nicht auf. Bei Z und Y schon: Die physische Taste Z sitzt ganz links in der unteren Buchstabenreihe; auf deiner deutschen Tastatur steht dort Y, links neben X. Eine französische AZERTY-Tastatur vertauscht A mit Q und W mit Z. Mit physischen Tasten bleibt die Bewegung für alle an derselben Stelle der Hand. Willst du im Spiel anzeigen, welche Taste das auf dem Gerät des Spielers ist, hilft `DisplayServer.keyboard_get_label_from_physical()`, wie die Doku an derselben Stelle zeigt.

  ## Aktionen im Code abfragen

  Für jede Aktion fragt der Code einen von drei Zuständen ab ([Input](https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-is-action-just-pressed)):

  | Abfrage | ist wahr | passt für |
  | --- | --- | --- |
  | `is_action_pressed()` | in jedem Frame, solange gedrückt | Laufen, Halten, Zielen |
  | `is_action_just_pressed()` | nur im ersten Frame des Drucks | Angriff, Ausweichen, Menü |
  | `is_action_just_released()` | nur im ersten Frame nach dem Loslassen | Aufladen beenden |

  Mit Godot 4.7.2 gezählt: Hält ein Testskript eine Aktion drei Physik-Frames lang, ist `is_action_pressed()` in `_physics_process` dreimal wahr, `is_action_just_pressed()` einmal. Für Sticks liefert `get_action_strength()` einen Wert zwischen 0 und 1, mit herausgerechneter Deadzone: Ein Stick bei 0,6 mit Deadzone 0,2 ergibt 0,5. `Input.get_vector()` baut daraus die Richtung, die `player.gd` benutzt:

  ```gdscript title=player.gd
  var input := Input.get_vector(&"move_left", &"move_right", &"move_up", &"move_down")
  ```

  Ein Tippfehler im Aktionsnamen bricht das Spiel nicht ab. Die Ausgabe meldet in Godot 4.7.2 bei jedem Aufruf, mit Vorschlag:

  ```text
  ERROR: The InputMap action "move_rigth" doesn't exist. Did you mean "move_right"?
  ```

  Die Abfrage liefert dann 0, und die Figur läuft nicht nach rechts. Fehlt eine Aktion ganz in der Eingabe-Zuordnung, etwa `attack`, steht dort nur `The InputMap action "attack" doesn't exist.`, ohne Vorschlag. Einen Druck aufheben, der ein paar Frames zu früh kommt (Eingabepuffer), behandelt [Eingabe: Reaktionszeit, Latenz und Puffer](/combat/eingabe).

  ## Exportierte Parameter und ihre Hints

  `@export` macht eine Variable im Inspektor sichtbar und speichert ihren Wert in der Szene oder Ressource. Hints ändern, wie der Inspektor sie zeigt ([GDScript exported properties](https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html)). Die Bewegungswerte des Testgeländes liegen in einer eigenen Ressource:

  ```gdscript title=movement_stats.gd
  class_name MovementStats
  extends Resource

  ## Bewegungswerte der Figur. Platzhalter: Die echten Werte bestimmst du.

  @export_range(0, 400, 1, "suffix:px/s") var max_speed := 90.0
  @export_range(0, 5000, 10, "suffix:px/s²") var acceleration := 600.0
  @export_range(0, 5000, 10, "suffix:px/s²") var friction := 900.0
  ```

  ![Inspektor von player_stats.tres: Abschnitt MovementStats mit Max Speed 90 px/s, Acceleration 600 px/s² und Friction 900 px/s², jeweils mit Schieberegler](/media/godot/aktionen-parameter/stats-inspektor.png "Godot 4.7.2, Inspektor der Ressource player_stats.tres")

  `export_range` setzt Grenzen und Schrittweite für Regler und Eingabe, `suffix:` hängt die Einheit an ([Adding suffixes](https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html#adding-suffixes-and-handling-degrees-radians)). Die Grenzen gelten nur im Editor: Im Code kannst du `radius = 500.0` setzen, und der Wert bleibt 500. Ein Agent baut dir oft Testwerkzeuge mit mehr Hints. Dieses Skript verteilt Sammelstücke für Testläufe, es ist kein Spielinhalt. Gezeigt ist der Kopf mit den Exports, ohne `_ready()`:

  ```gdscript title=pickup_spawner.gd
  class_name PickupSpawner
  extends Node2D

  ## Testwerkzeug: verteilt Sammelstücke für Testläufe. Kein Spielinhalt,
  ## alle Werte sind Platzhalter.

  ## Szene, die verteilt wird.
  @export_file("*.tscn") var pickup_path := "res://pickup.tscn"
  ## Node, unter den die Sammelstücke gehängt werden.
  @export var target: Node2D
  ## Wie viele Sammelstücke entstehen.
  @export_range(0, 50) var count := 5

  @export_group("Anordnung")
  ## Kreis um den Spawner oder Raster nach rechts unten.
  @export_enum("Kreis", "Raster") var layout := 0
  @export_subgroup("Kreis")
  ## Abstand vom Spawner.
  @export_range(0, 200, 1, "suffix:px") var radius := 60.0
  @export_subgroup("Raster")
  ## Abstand zwischen zwei Sammelstücken.
  @export_range(4, 64, 1, "suffix:px") var spacing := 24.0
  ```

  ![Inspektor des Spawner: Pickup Path mit Datei-Knopf, Target zeigt Objects, Count 8, Gruppe Anordnung mit Layout Raster als Auswahlliste, Untergruppen Kreis mit Radius 60 px und Raster mit Spacing 24 px](/media/godot/aktionen-parameter/spawner-inspektor.png "Godot 4.7.2, Inspektor eines Spawner-Nodes in einer Testszene")

  - `@export_file("*.tscn")` zeigt einen Dateiknopf, der nur `.tscn` anbietet. Wählst du die Datei dort aus, speichert Godot 4.7.2 eine UID wie `uid://d1p2sp4rba6w6`, wenn die Datei eine hat; so bleibt der Verweis gültig, wenn du die Datei verschiebst ([@export_file](https://docs.godotengine.org/en/stable/classes/class_@gdscript.html#class-gdscript-annotation-export-file)). `load()` versteht UID und Pfad. Soll immer der Pfad als Text gespeichert werden, nimmst du `@export_file_path`.
  - `@export var target: Node2D` ist ein Node-Verweis. In der `.tscn` steht er als Pfad, `target = NodePath("../Objects")`.
  - `@export_enum` zeigt eine Auswahlliste, speichert aber die Nummer: Raster ist `layout = 1`.
  - `@export_group` und `@export_subgroup` ordnen nur die Anzeige ([Grouping exports](https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html#grouping-exports)).
  - Ein `##`-Kommentar direkt über der Variable wird zum Tooltip im Inspektor ([Documenting script members](https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_documentation_comments.html#documenting-script-members)).

  Im Inspektor heißt `max_speed` „Max Speed“; Godot macht aus dem Bezeichner einen Titel. Suchst du den Wert im Code, nimm den Bezeichner mit Unterstrich.

  ## Wann Godot einen Wert setzt

  Wo ein exportierter Wert gespeichert sein kann, im Skript, in der Vorlage oder als Override an der Instanz, und welcher dann gilt, steht im [Modul über Instanzen und Ressourcen](/godot/instanzen-ressourcen): Jede Stufe überschreibt die vorige, und Werte, die dem Standard entsprechen, stehen nicht in der Datei. Für das Abstimmen kommt eine Frage dazu: wann Godot diese Werte setzt und was danach noch kommt.

  Godot setzt die gespeicherten Werte, nachdem das Objekt erzeugt ist und bevor `_ready()` läuft. In `_init()` siehst du deshalb noch den Standard aus dem Skript ([Reading an exported variable's value early on](https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html#reading-an-exported-variable-s-value-early-on)). Steht in `_ready()` eine Zuweisung an eine exportierte Variable, gewinnt sie gegen jeden Inspektor-Wert. Das ist die häufigste Ursache für „ich ändere den Wert, und nichts passiert“.

  Ressourcen folgen einer eigenen Regel. `stats` der Figur ist ein Verweis auf `player_stats.tres`. Die Werte darin gehören der Datei, nicht der Figur: Jeder Node, der dieselbe `.tres` benutzt, sieht dieselben Werte, und eine Änderung im Inspektor landet beim Speichern in dieser Datei. Wie du eine Ressource für eine Instanz einzigartig machst, steht im selben Modul.

  Im Web entspricht das Props mit Standardwerten in einer Komponente, die die Elternkomponente überschreibt. Der Vergleich bricht an einer Stelle: Godot setzt die Werte einmal beim Laden. Es rendert nichts neu, wenn sich danach etwas ändert.

  ## Live abstimmen, ohne den Wert zu verlieren

  Während das Spiel läuft, zeigt das Szenen-Dock oben zwei Knöpfe, „Remote“ und „Lokal“. Remote zeigt den Baum des laufenden Spiels, und der Inspektor zeigt den Node von dort, mit dem Zusatz „Remote-“ im Namen. Ganz oben stehen dort unter „Members“ auch Variablen, die nicht exportiert sind, etwa `total` (im Bild weggeschnitten). Ressourcen wie `stats` klappst du mit einem Klick auf ihr Feld auf ([Remote in scene dock](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html#remote-in-scene-dock)):

  ![Szenen-Dock im Modus Remote mit root, Main, Objects und ausgewähltem Player, darunter der Inspektor Remote-Player: Abschnitt Player mit aufgeklapptem Stats (Max Speed 90 px/s, Acceleration 600 px/s², Friction 900 px/s²) und Debug Log](/media/godot/aktionen-parameter/remote-player.png "Godot 4.7.2, Remote-Baum und Remote-Inspektor des laufenden Testgeländes")

  Was du dort änderst, wirkt sofort und ist beim Beenden weg. Die Doku sagt es ausdrücklich: Änderungen im Remote-Baum und im Spiel-Bildschirm bleiben nach dem Stoppen nicht erhalten. Ihr Weg, Werte zu behalten: im Modus Lokal den Node wählen und dort ändern, während das Spiel läuft, mit *Debuggen → Szenenänderungen synchronisieren* ([Game embedding](https://docs.godotengine.org/en/stable/tutorials/editor/game_embedding.html#interaction-mode), [Synchronize Scene Changes](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html#synchronize-scene-changes)).

  Mit Godot 4.7.2 geprüft: Der Haken ist in einem neuen Editor gesetzt. Eine Änderung von `max_speed` im Inspektor von `player_stats.tres` kam im laufenden Spiel innerhalb einer Sekunde an, ebenso `debug_log` an der Figur in `main.tscn`. Beide Werte blieben nach dem Stoppen im Editor stehen. Auf der Platte stehen sie erst nach dem Speichern: *Szene → Szene speichern* (`Ctrl+S`) schrieb auch die geänderte `player_stats.tres`.

  > [!PRAXIS]
  > Nimm Remote zum Nachsehen und Ausprobieren, Lokal für alles, was bleiben soll. Notier jeden Wert, den du im Remote-Inspektor gut findest, bevor du das Spiel beendest, und trag ihn dann lokal ein. Wie du dabei vorgehst, damit du weißt, welche Änderung was bewirkt hat, steht in [Tuning als Experiment](/combat/tuning): eine Hypothese, eine Größe pro Runde, ein Protokoll.

  ## Wirkung vorhersagen: Frames bis zum Höchsttempo

  Die Figur rechnet in jedem Physik-Frame:

  ```gdscript title=player.gd
  var rate := stats.acceleration if input != Vector2.ZERO else stats.friction
  velocity = velocity.move_toward(input * stats.max_speed, rate * delta)
  ```

  `move_toward` ändert die Geschwindigkeit pro Frame höchstens um `rate * delta`. Bei 60 Frames pro Sekunde ist `delta` 1/60, also ändern sich bei `acceleration` 600 höchstens 10 px/s pro Frame, bei `friction` 900 höchstens 15. Mit *Debug Log* an der Figur schreibt sie das selbst in die Ausgabe. Ein Testlauf mit Godot 4.7.2, Taste in den Frames 1 bis 12 gedrückt:

  ```text
  1  speed 10.0
  2  speed 20.0
  …
  8  speed 80.0
  9  speed 90.0
  10  speed 90.0
  …
  12  speed 90.0
  13  speed 75.0
  14  speed 60.0
  …
  17  speed 15.0
  18  speed 0.0
  ```

  Nach 9 Frames erreicht die Figur 90 px/s, nach dem Loslassen steht sie 6 Frames später. Den Bremsweg rechnest du aus den Geschwindigkeiten nach dem Loslassen: (75 + 60 + 45 + 30 + 15 + 0) / 60 = 3,75 Pixel. Allgemein:

  ```text
  Frames bis Höchsttempo = max_speed / (acceleration / 60), aufgerundet
  Frames bis Stillstand  = max_speed / (friction / 60), aufgerundet
  ```

  > [!MERKE]
  > Ein Wert in px/s² sagt dir erst etwas, wenn du ihn in px/s pro Frame umrechnest: geteilt durch die Physik-Ticks pro Sekunde, im Testgelände 60.

  Ob sich 9 Frames gut anfühlen, sagt keine Formel. Die Rechnung sagt dir vorher, was eine Änderung bewirkt, damit du beim Spielen weißt, was du prüfst.

  > [!INTERVIEW]
  > „Ein Designer ändert einen Wert im Inspektor, und im Spiel passiert nichts. Wie gehst du vor?“ Gute Antwort: Ich prüfe, wo der Wert lebt und wer ihn zuletzt setzt. Steht er in der Instanz und wird in der Szene überschrieben? Ist er Teil einer geteilten Ressource? Setzt `_ready()` ihn im Code? Läuft das Spiel noch, und hat er im Remote-Inspektor geändert? Dann zeige ich, wo er den Wert dauerhaft einträgt.

  ## Häufige Fehler

  - **Taste statt Aktion.** Code fragt `KEY_D` ab statt `move_right`. Dann hilft die Eingabe-Zuordnung nicht, und Gamepad oder anderes Layout gehen nicht.
  - **Tastencode statt physischer Taste.** Eine Aktion auf Z liegt mit Tastencode auf deiner Tastatur oben, für Spieler mit QWERTY unten links. Für Bewegung und Aktionen nach Position nimmst du physische Tasten.
  - **`is_action_pressed()` für eine einmalige Aktion.** Ausweichen oder Angriff lösen dann in jedem Frame aus, solange die Taste unten ist.
  - **Tippfehler im Aktionsnamen.** Godot läuft weiter und meldet `The InputMap action "…" doesn't exist.` in der Ausgabe.
  - **Zuweisung in `_ready()`.** Sie überschreibt jeden Inspektor-Wert. Such in `_ready()` nach dem Bezeichner, bevor du am Inspektor zweifelst.
  - **Im Remote-Inspektor abgestimmt.** Nach dem Beenden ist der Wert weg. Lokal ändern und speichern.
  - **Geteilte Ressource geändert.** Du wolltest eine Figur schneller machen, und alle mit derselben `.tres` werden schneller.
  - **Grenzen von `export_range` für Sicherheit gehalten.** Sie gelten nur im Editor, Code kann jeden Wert setzen.

  ## Zusammenfassung

  - Der Code fragt Aktionen ab, die Eingabe-Zuordnung verbindet sie mit Tasten, Achsen und Knöpfen. Gespeichert wird alles unter `[input]` in `project.godot`.
  - Physische Tasten sind Positionen auf einer US-Tastatur und für Spieleingaben gedacht; „(Physisch)“ in der Liste zeigt sie an.
  - `is_action_pressed()` ist in jedem gedrückten Frame wahr, `is_action_just_pressed()` nur im ersten; `get_action_strength()` liefert 0 bis 1 nach der Deadzone.
  - Hints wie `export_range` mit `suffix:`, `export_enum`, `export_group`, `export_file` und Node-Exports ändern die Anzeige, `##`-Kommentare werden zu Tooltips.
  - Es gilt der zuletzt gesetzte Wert: Skript, dann Vorlage, dann Instanz, dann Code in `_ready()`. In `_init()` siehst du nur den Standard.
  - Ressourcen gehören ihrer Datei und werden geteilt.
  - Remote-Änderungen sind beim Beenden weg. Lokal mit „Szenenänderungen synchronisieren“ ändern und speichern.
  - Beschleunigung und Reibung in px/s² geteilt durch die Physik-Ticks pro Sekunde (Standard 60) ergeben die Änderung pro Frame; daraus folgen Frames bis zum Höchsttempo und der Bremsweg.
exercises:
  - id: physisch-qwertz
    type: choice
    title: Welche Taste ist physisch Z?
    prompt: |
      Ein Agent hat die Aktion `dodge` auf die **physische** Taste Z gelegt. Du spielst mit einer deutschen QWERTZ-Tastatur. Welche Taste löst bei dir `dodge` aus?
    options:
      - text: Die Taste, auf der Y steht, ganz links in der unteren Buchstabenreihe, links neben X
        correct: true
        why: Physische Tasten sind Positionen auf einer US-QWERTY-Tastatur. Dort sitzt Z ganz links in der unteren Buchstabenreihe, auf QWERTZ steht an dieser Stelle Y.
      - text: Die Taste, auf der Z steht, oben zwischen T und U
        correct: false
        why: So wäre es mit einem Tastencode (Lateinäquivalent). Der richtet sich nach der Beschriftung im aktuellen Layout, nicht nach der Position.
      - text: Beide Tasten, Godot wählt je nach Layout
        correct: false
        why: Ein Ereignis speichert genau eine Art. Ein physisches Ereignis kennt nur die Position.
      - text: Keine, weil physische Tasten nur mit US-Tastaturen funktionieren
        correct: false
        why: Physische Tasten funktionieren mit jedem Layout. Sie beziehen sich nur auf die Position der US-Tastatur.
    explanation: |
      Der physische Tastencode beschreibt laut Doku die Position auf einer 101/102-Tasten-US-QWERTY-Tastatur. Für WASD fällt das auf QWERTZ nicht auf, für Z und Y schon. Für Bewegung und Aktionen, bei denen die Lage der Hand zählt, ist das gewollt. Willst du dem Spieler anzeigen, welche Beschriftung das auf seiner Tastatur ist, hilft `DisplayServer.keyboard_get_label_from_physical()`.
    resources:
      - title: Godot Docs · InputEventKey.physical_keycode
        url: https://docs.godotengine.org/en/stable/classes/class_inputeventkey.html#class-inputeventkey-property-physical-keycode

  - id: wert-kette
    type: order
    title: Wer setzt den Wert zuletzt?
    prompt: |
      Ein Sammelstück `Pickup2` in `main.tscn` hat die exportierte Variable `value`. Bring die Stellen in die Reihenfolge, in der Godot sie beim Starten und Spielen anwendet. Die oberste setzt den Wert zuerst, die unterste zuletzt.
    lang: prose
    lines: |
      Standardwert im Skript pickup.gd
      Zeile value in pickup.tscn
      Zeile value unter Pickup2 in main.tscn
      Zuweisung an value in _ready
      Änderung im Remote-Inspektor während das Spiel läuft
    explanation: |
      Godot erzeugt das Objekt mit dem Standardwert aus dem Skript, setzt dann die Werte aus der eigenen Szene und danach die Overrides der Instanz aus der Elternszene. Erst dann läuft `_ready()`, und eine Zuweisung dort überschreibt alles davor. Der Remote-Inspektor wirkt noch später, im laufenden Spiel, und verschwindet beim Beenden. Mit Godot 4.7.2 nachgespielt: Standard 1, `pickup.tscn` 5 und `main.tscn` 3 ergeben für `Pickup2` den Wert 3, und eine Zuweisung in `_ready()` schlägt alle drei.
    resources:
      - title: Godot Docs · Reading an exported variable's value early on
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html#reading-an-exported-variable-s-value-early-on

  - id: gedrueckt-zaehlen
    type: output
    title: Gedrückt oder gerade gedrückt?
    prompt: |
      Ein Testskript hält die Aktion `dodge` genau drei Physik-Frames lang gedrückt und lässt dann los. Danach gibt es `print(pressed_frames, " ", just_frames)` aus. Was steht in der Ausgabe?
    lang: gdscript
    code: |
      var pressed_frames := 0
      var just_frames := 0


      func _physics_process(_delta: float) -> void:
      	if Input.is_action_pressed(&"dodge"):
      		pressed_frames += 1
      	if Input.is_action_just_pressed(&"dodge"):
      		just_frames += 1
    expected: |
      3 1
    hints:
      - "`is_action_pressed()` fragt den Zustand ab, in jedem Frame neu."
      - "`is_action_just_pressed()` ist nur in dem Frame wahr, in dem der Druck beginnt."
    explanation: |
      Solange die Aktion gedrückt ist, ist `is_action_pressed()` in jedem Physik-Frame wahr, hier dreimal. `is_action_just_pressed()` ist nur im ersten Frame des Drucks wahr. Gemessen mit Godot 4.7.2: `3 1`. Daraus folgt die Regel: Für alles, was einmal pro Druck passieren soll, nimmst du `just_pressed`, für alles, was beim Halten anhält, `pressed`.
    resources:
      - title: Godot Docs · Input.is_action_just_pressed
        url: https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-is-action-just-pressed

  - id: init-oder-ready
    type: output
    title: Zu früh gefragt
    prompt: |
      Dieses Skript hängt an einem Node, bei dem im Inspektor Value 3 eingetragen ist; in der `.tscn` steht `value = 3`. Was gibt es beim Laden der Szene aus?
    lang: gdscript
    code: |
      extends Area2D

      @export var value := 1


      func _init() -> void:
      	print("_init: ", value)


      func _ready() -> void:
      	print("_ready: ", value)
    expected: |
      _init: 1
      _ready: 3
    hints:
      - "`_init()` läuft, wenn das Objekt erzeugt wird."
      - Wann setzt Godot die Werte aus der Datei?
    explanation: |
      Godot erzeugt das Objekt zuerst mit dem Standardwert aus dem Skript, dabei läuft `_init()`. Danach setzt es die Werte aus der Szene, hier `value = 3`, und erst dann kommt `_ready()`. Die Doku beschreibt genau diesen Ablauf. Gemessen mit Godot 4.7.2. Wer in `_init()` mit exportierten Werten rechnet, rechnet mit dem Standard und wundert sich über den Inspektor.
    resources:
      - title: Godot Docs · Reading an exported variable's value early on
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html#reading-an-exported-variable-s-value-early-on

  - id: welcher-wert
    type: output
    title: Wer zählt wie viel?
    prompt: |
      Angenommen, im Testgelände steht in `pickup.tscn` am Wurzel-Node `value = 5`, und `Pickup2` hat in `main.tscn` den Override `value = 3`, wie im Versuch des Moduls über Instanzen und Ressourcen. Jetzt ändert jemand in `pickup.gd` den Standard von 1 auf 2. Die Figur sammelt `Pickup` und `Pickup2` ein. Welche Zahl zeigt der Zähler?
    lang: text
    code: |
      pickup.gd     @export var value := 2   (vorher 1)
      pickup.tscn   value = 5
      main.tscn     Pickup2: value = 3
    expected: |
      8
    accept:
      - 8 Punkte
      - 5 + 3 = 8
    hints:
      - Für `Pickup` gibt es eine Zeile in der Vorlage, für `Pickup2` zusätzlich einen Override.
      - Kommt der Standard aus dem Skript hier noch irgendwo zum Zug?
    explanation: |
      `Pickup` hat keinen Override und nimmt die 5 aus der Vorlage `pickup.tscn`. `Pickup2` hat seinen Override und zählt 3. Zusammen 8, gemessen mit Godot 4.7.2, mit Standard 1 wie mit Standard 2. Der geänderte Standard kommt nicht zum Zug, weil beide Sammelstücke einen gespeicherten Wert haben. Er wirkt nur bei Nodes, die den Wert nirgends speichern; deshalb ist eine Änderung am Skript-Standard oft wirkungslos, ohne dass etwas meldet.
    resources:
      - title: Godot Docs · GDScript exported properties · Basic use
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html#basic-use

  - id: frames-bis-tempo
    type: output
    title: Langsamer anlaufen
    prompt: |
      In `player_stats.tres` stellst du `acceleration` von 600 auf 450, `max_speed` bleibt 90. Nach wie vielen Physik-Frames mit gedrückter Taste erreicht die Figur aus dem Stand 90 px/s?
    lang: text
    code: |
      max_speed     90 px/s
      acceleration  450 px/s²   (vorher 600)
      Physik        60 Frames pro Sekunde
    expected: |
      12
    accept:
      - 12 Frames
    hints:
      - Rechne die Beschleunigung in px/s pro Frame um.
      - 450 / 60 = 7,5 px/s pro Frame.
    explanation: |
      `move_toward` ändert die Geschwindigkeit pro Frame höchstens um `acceleration / 60`, hier 7,5 px/s. 90 / 7,5 = 12 Frames. Gemessen mit Godot 4.7.2: 12 Frames, mit 600 waren es 9. Geht die Division nicht auf, rundest du auf: Bei 700 sind es 90 / 11,67 = 7,7, also 8 Frames.
    resources:
      - title: Godot Docs · Vector2.move_toward
        url: https://docs.godotengine.org/en/stable/classes/class_vector2.html#class-vector2-method-move-toward

  - id: bremsweg
    type: output
    title: Wie weit rutscht die Figur?
    prompt: |
      `friction` steht jetzt auf 1800, `max_speed` auf 90. Die Figur läuft mit 90 px/s nach rechts, dann lässt du los. Wie viele Pixel legt sie noch zurück, bis sie steht?
    lang: text
    code: |
      max_speed  90 px/s
      friction   1800 px/s²
      Physik     60 Frames pro Sekunde
    expected: |
      1.5
    accept:
      - "1,5"
      - 1.5 px
      - "1,5 px"
      - 1.5 Pixel
      - "1,5 Pixel"
    hints:
      - Pro Frame sinkt die Geschwindigkeit um 1800 / 60 = 30 px/s.
      - In jedem Frame bewegt sich die Figur um ihre neue Geschwindigkeit geteilt durch 60.
    explanation: |
      Nach dem Loslassen sinkt das Tempo pro Frame um 30 px/s: 60, 30, 0. In jedem dieser Frames bewegt sich die Figur um Tempo / 60 Pixel, also (60 + 30 + 0) / 60 = 1,5 Pixel. Gemessen mit Godot 4.7.2: 3 Frames, 1,5 Pixel. Mit dem Platzhalter 900 waren es 6 Frames und 3,75 Pixel. Doppelte Reibung halbiert hier die Frames und mehr als halbiert den Weg.
    resources:
      - title: Godot Docs · CharacterBody2D.move_and_slide
        url: https://docs.godotengine.org/en/stable/classes/class_characterbody2d.html#class-characterbody2d-method-move-and-slide

  - id: export-hints
    type: gap
    title: Hints für den Inspektor
    prompt: |
      Ergänze die Annotationen, damit der Inspektor einen Zähler von 0 bis 50, eine Gruppe „Anordnung“, eine Auswahlliste und einen Regler mit der Einheit px zeigt.
    lang: gdscript
    code: |
      @⟦export_range⟧(0, 50) var count := 5

      @⟦export_group⟧("Anordnung")
      @⟦export_enum⟧("Kreis", "Raster") var layout := 0
      @export_range(0, 200, 1, "⟦suffix:px⟧") var radius := 60.0
    gaps:
      - label: Bereich
        hint: Die Annotation für Grenzen und Schrittweite.
      - label: Gruppe
        hint: Alle folgenden Variablen landen in einem aufklappbaren Abschnitt.
      - label: Auswahlliste
        hint: Zeigt Namen, speichert eine Zahl.
      - label: Einheit
        hint: Ein Hint-Text mit Doppelpunkt, gefolgt von der Einheit.
    explanation: |
      `@export_range` begrenzt Regler und Eingabe im Editor, `@export_group` ordnet die folgenden Variablen in einen Abschnitt, `@export_enum` zeigt eine Liste und speichert den Index (Raster ist 1), und `"suffix:px"` hängt die Einheit an. Alle vier ändern nur die Anzeige im Editor; der Code kann jeden Wert setzen.
    resources:
      - title: Godot Docs · Adding suffixes
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html#adding-suffixes-and-handling-degrees-radians
      - title: Godot Docs · Exporting enums
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html#exporting-enums

  - id: inspektor-lesen
    type: choice
    title: Was der Inspektor verrät
    prompt: |
      So zeigt der Inspektor den Spawner aus der Lektion. Welche Aussagen stimmen?

      ![Inspektor des Spawner: Pickup Path, Target Objects mit Zurücksetzen-Pfeil, Count 8 mit Zurücksetzen-Pfeil, Gruppe Anordnung mit Layout Raster, Untergruppe Kreis mit Radius 60 px, Untergruppe Raster mit Spacing 24 px](/media/godot/aktionen-parameter/spawner-inspektor.png "Godot 4.7.2, Inspektor des Spawner")
    options:
      - text: In der `.tscn` steht `layout = 1`, nicht der Text „Raster“.
        correct: true
        why: "`@export_enum` zeigt Namen, speichert aber den Index. Raster ist der zweite Eintrag, Index 1."
      - text: Target und Count stehen als eigene Zeilen in der `.tscn`, Radius und Spacing nicht.
        correct: true
        why: Der Zurücksetzen-Pfeil zeigt Abweichungen vom Standard. Nur sie schreibt Godot in die Datei.
      - text: Kreis und Raster sind zwei Ressourcen, die sich alle Spawner teilen.
        correct: false
        why: "`@export_subgroup` ordnet nur die Anzeige. Die Werte gehören dem Node."
      - text: Radius kann zur Laufzeit nie größer als 200 werden.
        correct: false
        why: Die Grenzen von `export_range` gelten nur im Editor. Mit Godot 4.7.2 geprüft, `radius = 500.0` im Code ergibt 500.
    explanation: |
      Den Inspektor liest du wie eine Datei: Zurücksetzen-Pfeile markieren gespeicherte Abweichungen, Auswahllisten speichern Zahlen, Gruppen und Untergruppen sind nur Ordnung. In der gespeicherten Testszene stehen unter dem Spawner `target = NodePath("../Objects")`, `count = 8` und `layout = 1`, aber weder `radius` noch `spacing`. Grenzen und Einheiten sind Hilfen für die Eingabe, keine Prüfung zur Laufzeit.
    resources:
      - title: Godot Docs · Grouping exports
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html#grouping-exports

  - id: aktion-tippfehler
    type: bug
    title: Nach rechts geht nichts
    prompt: |
      Die Figur läuft nach links, oben und unten, aber nicht nach rechts, weder mit D noch mit dem Stick. Die Ausgabe zeigt in jedem Frame:

      ```text
      ERROR: The InputMap action "move_rigth" doesn't exist. Did you mean "move_right"?
      ```

      Finde die Zeile und korrigiere sie.
    lang: gdscript
    code: |
      func _physics_process(delta: float) -> void:
      	var input := Input.get_vector(
      		&"move_left", &"move_rigth",
      		&"move_up", &"move_down")
      	var rate := stats.acceleration if input != Vector2.ZERO else stats.friction
      	velocity = velocity.move_toward(input * stats.max_speed, rate * delta)
      	move_and_slide()
    lines: [3]
    fix:
      - line: 3
        answers:
          - '&"move_left", &"move_right",'
          - '"move_left", "move_right",'
          - '&"move_left", "move_right",'
          - '"move_left", &"move_right",'
    explanation: |
      Die Aktion heißt `move_right`. Mit einem Namen, den die Eingabe-Zuordnung nicht kennt, liefert die Abfrage 0, und Godot meldet den Fehler, statt das Spiel anzuhalten. Die Meldung ist mit Godot 4.7.2 aufgenommen und nennt den richtigen Namen gleich mit. Prüf bei Eingabefehlern zuerst die Ausgabe, dann die Eingabe-Zuordnung.
    resources:
      - title: Godot Docs · Input.get_vector
        url: https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-get-vector

  - id: ausweichen-dauerfeuer
    type: bug
    title: Ein Druck, dreißig Ausweichschritte
    prompt: |
      Ein Testskript soll zählen, wie oft du ausweichst. Hältst du die Taste eine halbe Sekunde, steigt der Zähler aber um etwa 30. Finde die Zeile und korrigiere sie.
    lang: gdscript
    code: |
      extends Node

      ## Testwerkzeug: zählt, wie oft die Aktion dodge auslöst.

      var dodges := 0


      func _physics_process(_delta: float) -> void:
      	if Input.is_action_pressed(&"dodge"):
      		dodges += 1
      		print("dodge ", dodges)
    lines: [9]
    fix:
      - line: 9
        answers:
          - 'if Input.is_action_just_pressed(&"dodge"):'
          - 'if Input.is_action_just_pressed("dodge"):'
    explanation: |
      `is_action_pressed()` ist in jedem Physik-Frame wahr, in dem die Taste unten ist. Eine halbe Sekunde sind 30 Frames bei 60 pro Sekunde. `is_action_just_pressed()` ist nur im ersten Frame wahr, gemessen mit Godot 4.7.2: drei Frames gehalten, einmal wahr. Derselbe Fehler steckt oft in Angriffen und Menüs, die beim Halten mehrfach auslösen.
    resources:
      - title: Godot Docs · Input.is_action_just_pressed
        url: https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-is-action-just-pressed

  - id: remote-oder-lokal
    type: explain
    title: Warum der Wert weg ist
    prompt: |
      Du hast im laufenden Spiel im Inspektor aus dem Bild unter Stats `Max Speed` der Figur von 90 auf 120 gestellt, das fühlte sich gut an. Nach dem Beenden steht wieder 90 da. Erkläre in drei bis fünf Sätzen, warum, und wie du den Wert beim nächsten Mal behältst.

      ![Szenen-Dock im Modus Remote mit ausgewähltem Player, darunter der Inspektor Remote-Player mit aufgeklapptem Stats und Max Speed 90 px/s](/media/godot/aktionen-parameter/remote-player.png "Godot 4.7.2, Remote-Baum und Remote-Inspektor")
    lang: text
    code: |
      Szenen-Dock     Remote | Lokal
      Inspektor       Remote-Player: …
      Debuggen        Szenenänderungen synchronisieren
    points:
      - Im Modus Remote ändert der Inspektor das laufende Spiel, keine Datei; beim Beenden ist die Änderung weg.
      - Der Name „Remote-Player“ im Inspektor zeigt, dass du am laufenden Spiel arbeitest.
      - Bleiben soll ein Wert, wenn du ihn im Modus Lokal (hier in `player_stats.tres`) änderst; mit „Szenenänderungen synchronisieren“ wirkt das sofort im laufenden Spiel.
      - Auf der Platte steht der Wert erst nach dem Speichern, etwa mit Szene speichern.
    explanation: |
      Der Name „Remote-Player“ im Inspektor und der gedrückte Knopf „Remote“ zeigen es: Du hast das laufende Spiel bearbeitet, nicht die Datei. Der Remote-Inspektor zeigt Objekte im laufenden Spielprozess. Was du dort änderst, lebt nur in diesem Prozess, die Doku warnt ausdrücklich, dass es nach dem Stoppen nicht erhalten bleibt. Willst du live abstimmen und den Wert behalten, wählst du im Modus Lokal die Datei oder den Node, hier `player_stats.tres`, und änderst dort. Mit Godot 4.7.2 geprüft: Mit „Szenenänderungen synchronisieren“, das in einem neuen Editor an ist, kam die Änderung innerhalb einer Sekunde im Spiel an, und nach Szene speichern stand sie in der `.tres`.
    resources:
      - title: Godot Docs · Game embedding · Interaction mode
        url: https://docs.godotengine.org/en/stable/tutorials/editor/game_embedding.html#interaction-mode
      - title: Godot Docs · Synchronize Scene Changes
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html#synchronize-scene-changes

  - id: parameter-steckbrief
    type: practice
    title: Steckbrief für einen Parameter
    prompt: |
      Such dir einen exportierten Parameter des Testgeländes aus, etwa `acceleration`, `friction` oder `value`, und schreib mit den Dateien aus der Lektion einen kurzen Steckbrief: wo er lebt, in welcher Einheit, was er pro Frame bewirkt, wie du die Wirkung misst und welcher Wert gerade eingetragen ist. Ob der Wert gut ist, gehört nicht in den Steckbrief; das entscheidest du später beim Spielen.
    lang: prose
    checklist:
      - Datei und Bezeichner stehen da, etwa `player_stats.tres` und `acceleration`, und ob eine Instanz oder `_ready()` den Wert überschreibt.
      - Die Einheit steht da und, wo es passt, die Umrechnung pro Physik-Frame.
      - Du hast eine Größe notiert, an der du die Wirkung misst, zum Beispiel Frames bis zum Höchsttempo oder Bremsweg in Pixeln.
      - Der aktuelle Wert ist als Platzhalter oder als deine Entscheidung gekennzeichnet.
      - Du hast notiert, wo du den Wert änderst, damit er nach dem Beenden erhalten bleibt.
    hints:
      - Im Testgelände eignen sich `acceleration` und `friction` gut, weil `debug_log` ihre Wirkung pro Frame zeigt.
    explanation: |
      Ein Steckbrief trennt Fakten von Geschmack. Wo der Wert lebt, wer ihn überschreibt und was er pro Frame tut, lässt sich prüfen; ob er sich gut anfühlt, prüfst du beim Spielen. Mit dem Steckbrief kannst du einem Coding-Agenten genau sagen, welchen Wert er nicht anfassen soll, und vor einer Änderung vorhersagen, was du messen wirst.
    resources:
      - title: Godot Docs · Resources
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/resources.html
