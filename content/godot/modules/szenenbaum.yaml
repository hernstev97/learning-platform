id: szenenbaum
title: "Szenenbäume lesen: Nodes, Transform und Zeichenreihenfolge"
level: 1
minutes: 110
summary: Wer wessen Kind ist, entscheidet in Godot über Position, Zeichenreihenfolge, Pfade im Code und die Reihenfolge, in der Code läuft. Du liest Bäume im Szenen-Dock und als .tscn-Text und sagst vorher, was Godot daraus macht.
place: unterwegs
goals:
  - Du liest einen Szenenbaum im Szenen-Dock und erkennst Instanzen, Skripte und Verbindungen an ihren Symbolen.
  - Du rechnest `position` und `global_position` über Eltern mit Verschiebung, Skalierung und Drehung aus.
  - Du erklärst, in welcher Reihenfolge Godot zeichnet, und setzt Baumreihenfolge, `z_index`, Y-Sortierung und `CanvasLayer` gezielt ein.
  - Du schreibst Node-Pfade mit `$`, `get_node()`, `..` und `%` und sagst vorher, was beim Umbenennen oder Verschieben bricht.
  - Du rekonstruierst einen Baum samt Instanzen und Verbindungen aus einer `.tscn`-Datei.
