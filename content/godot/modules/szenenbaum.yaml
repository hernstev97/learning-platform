lesson: |
  Schaltet jemand im Testgelände die Y-Sortierung aus, steht die Figur sichtbar vor der Kiste, mit den Füßen unterhalb ihrer Kante, und trotzdem verdeckt die Kiste ihren Oberkörper. An einem anderen Tag hat ein Agent den Zähler in einen Container verschoben, und seitdem meldet das Spiel beim Start `Node not found: "Counter"`. Beide Fehler stecken nicht in einer Rechnung, sondern in der Struktur: wer wessen Kind ist, in welcher Reihenfolge die Nodes stehen und welcher Pfad zu welchem Node führt.

  Diese Lektion bringt dir bei, Szenenbäume zu lesen, im Szenen-Dock und als Text in der `.tscn`. Grundbegriffe kennst du aus [Godot-Start](/combat/godot-start), die Docks aus [Der Editor als Werkstatt](/godot/editor-anatomie). Alle Ausgaben stammen aus Läufen mit Godot 4.7.2.

  ## Nodes, Bäume und Szenen

  Ein **Node** ist ein Baustein mit einer Aufgabe: `Polygon2D` zeichnet eine Fläche, `CollisionShape2D` gibt einem Körper eine Form, `Camera2D` bestimmt den Bildausschnitt, `Label` zeigt Text. Nodes hängen in einem Baum. Jeder Node hat höchstens einen Elternknoten (parent) und beliebig viele Kinder (children). Der oberste Node einer Szene ist ihre Wurzel (root). Eine **Szene** ist ein gespeicherter Baum, und jede `.tscn` hat genau eine Wurzel ([TSCN file format](https://docs.godotengine.org/en/stable/engine_details/file_formats/tscn.html#the-scene-tree)). Szenen lassen sich in andere einsetzen: `main.tscn` setzt `player.tscn` einmal ein und `pickup.tscn` dreimal ([Nodes and Scenes](https://docs.godotengine.org/en/stable/getting_started/step_by_step/nodes_and_scenes.html)).

  ![Szenen-Dock von main.tscn: Main mit Floor, Objects (darin Player, Crate, Pickup, Pickup2, Pickup3) und HUD mit Counter; rechts Symbole für Verbindung, Instanz, Skript und Sichtbarkeit](/media/godot/szenenbaum/szene-main@2x.png "Godot 4.7.2, Szenen-Dock von main.tscn im Testgelände")

  Die Symbole rechts verraten, was du nicht siehst. Ihre Tooltips in 4.7.2:

  - **Filmklappe** – „Im Editor öffnen“: Der Node ist eine Instanz. Der Tooltip des Namens nennt die Szene, etwa „Instanz: res://player.tscn“.
  - **Schriftrolle** – „Skript öffnen: res://player.gd“: Am Node hängt ein Skript.
  - **Wellen** – „Node hat eine Verbindung.“: Ein Signal des Nodes ist verbunden. Ein Klick öffnet das Signale-Dock.
  - **Auge** – „Sichtbarkeit ein-/ausschalten“.

  `Crate` hat nur Klappe und Auge: eine Instanz ohne Skript und ohne Verbindung. Im Editor ist eine Instanz eine einzige Zeile. Zur Laufzeit hängt dort der ganze Baum der eingesetzten Szene. `print_tree_pretty()` zeigt das ([Node.print_tree_pretty](https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-method-print-tree-pretty)):

  ```gdscript
  var main: Node = load("res://main.tscn").instantiate()
  root.add_child(main)
  main.print_tree_pretty()
  ```

  ```text
   ┖╴Main
      ┠╴Floor
      ┠╴Objects
      ┃  ┠╴Player
      ┃  ┃  ┠╴Body
      ┃  ┃  ┠╴Feet
      ┃  ┃  ┖╴Camera2D
      ┃  ┠╴Crate
      ┃  ┃  ┠╴Body
      ┃  ┃  ┖╴Base
      ┃  ┠╴Pickup
      ┃  ┃  ┠╴Body
      ┃  ┃  ┖╴Area
      ┃  ┠╴Pickup2
      ┃  ┃  ┠╴Body
      ┃  ┃  ┖╴Area
      ┃  ┖╴Pickup3
      ┃     ┠╴Body
      ┃     ┖╴Area
      ┖╴HUD
         ┖╴Counter
  ```

  Aus dem Web kennst du das Bild: Der Szenenbaum ähnelt dem DOM, eine Szene einer Komponente, die du an mehreren Stellen einsetzt. Der Vergleich bricht an zwei Stellen. Nodes sind Objekte mit Verhalten, kein Markup. Und die Reihenfolge im Baum bestimmt neben dem Zeichnen auch, wann ihr Code läuft.

  ## Transform: Position relativ zum Elternknoten

  `position` eines `Node2D` gilt relativ zum Elternknoten, `global_position` in der Welt ([Node2D](https://docs.godotengine.org/en/stable/classes/class_node2d.html#class-node2d-property-global-position)). Verschiebung, Skalierung und Drehung des Elternknotens wirken auf alle Kinder ([2D transforms](https://docs.godotengine.org/en/stable/tutorials/2d/2d_transforms.html)). Dieses Skript läuft in `_ready()` eines `Node2D` am Ursprung:

  ```gdscript
  func _ready() -> void:
  	var a := Node2D.new()
  	a.position = Vector2(100, 50)
  	var b := Node2D.new()
  	b.position = Vector2(20, 0)
  	a.add_child(b)
  	add_child(a)
  	print(b.global_position)
  	a.scale = Vector2(2, 2)
  	print(b.global_position)
  	a.scale = Vector2.ONE
  	a.rotation_degrees = 90
  	print(b.global_position)
  ```

  ```text
  (120.0, 50.0)
  (140.0, 50.0)
  (100.0, 70.0)
  ```

  Der Versatz von `b` ist 20 Pixel nach rechts. Mit doppelter Skalierung des Elternknotens werden daraus 40, mit einer Drehung um 90° zeigt er nach unten, denn die y-Achse zeigt in Godot nach unten. `b.position` bleibt dabei die ganze Zeit `(20, 0)`. Setzt du umgekehrt `global_position`, rechnet Godot die passende `position` aus.

  Im Testgelände sind `Body`, `Feet` und `Camera2D` Kinder von `Player`. Ihre Koordinaten gelten relativ zur Figur: Der Körper reicht von y = −16 bis 0, die Fußform sitzt bei `(0, -3)`. Der Ursprung der Figur liegt also an ihren Füßen. Die Kamera folgt der Figur ohne eine Zeile Code, weil sie ihr Kind ist. Was Skalierung mit Pixelart und mit Kollisionsformen anrichtet, behandeln die Module zum [Pixelraster](/godot/pixelraster) und zu [Kollisionsebenen](/godot/kollision-ebenen).

  ## Zeichenreihenfolge: Baum, `z_index`, Y-Sortierung und `CanvasLayer`

  Godot zeichnet 2D-Nodes in Baumreihenfolge, von oben nach unten im Szenen-Dock, und Kinder über ihren Eltern ([CanvasItem](https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#description)). Ein späteres Geschwister liegt also über einem früheren. `Floor` steht im Baum vor `Objects`, deshalb liegt der Boden unter allem.

  **`z_index`** schiebt einen Node in eine andere Ebene. Höhere Werte liegen vorn, der Standard ist 0, erlaubt sind −4096 bis 4096. Solange `z_as_relative` an ist (Standard), addiert sich der Wert zu dem des Elternknotens. Auf die Reihenfolge, in der Code läuft, hat `z_index` keinen Einfluss ([z_index](https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#class-canvasitem-property-z-index)).

  **Y-Sortierung** ist die Regel der Draufsicht. Ist an einem Node `y_sort_enabled` an, zeichnet Godot seine Kinder nach ihrer y-Position: Wer weiter unten im Bild steht, liegt vorn ([y_sort_enabled](https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#class-canvasitem-property-y-sort-enabled)). Im Testgelände ist sie an `Objects` eingeschaltet. Verglichen wird der Ursprung jedes Kindes, deshalb gehört er an die Füße. Und sie sortiert nur Nodes mit gleichem `z_index`.

  ![Ausschnitt des Spielbilds: Die blaue Figur steht mit den Füßen unterhalb der braunen Kiste und überdeckt sie](/media/godot/szenenbaum/reihenfolge-richtig@2x.png "Godot 4.7.2, Figur bei y = 18, Kiste bei y = 10, Y-Sortierung an")

  ![Derselbe Ausschnitt: Die Kiste liegt über dem Oberkörper der Figur, nur deren Füße schauen unten heraus](/media/godot/szenenbaum/reihenfolge-falsch@2x.png "Godot 4.7.2, gleiche Positionen, Y-Sortierung an Objects aus")

  Ohne Y-Sortierung gilt wieder die Baumreihenfolge: `Crate` steht nach `Player`, also liegt die Kiste immer oben, egal wo die Figur steht. Bei einem `Sprite2D` liegt der Ursprung standardmäßig in der Bildmitte (`centered` ist an). Wie du ihn an die Füße setzt, zeigt das [Modul zum Sprite-Import](/godot/sprites-importieren); Y-Sortierung mit Tiles behandelt das [Modul zu Tile-Leveln](/godot/level-tilemap).

  Ein **`CanvasLayer`** zeichnet seine Kinder in einer eigenen Ebene. Die Welt liegt auf Ebene 0, das HUD des Testgeländes auf Ebene 1, dem Standard von `layer`. Damit liegt es über allem, unabhängig von jedem `z_index` ([CanvasLayer](https://docs.godotengine.org/en/stable/classes/class_canvaslayer.html#description)). Und es hat seine eigene Transformation: Die Kamera verschiebt die Welt, nicht die Ebene. Solange `follow_viewport_enabled` aus ist (Standard), bleibt der Zähler an seiner Stelle auf dem Bildschirm ([Canvas layers](https://docs.godotengine.org/en/stable/tutorials/2d/canvas_layers.html)).

  ![Spielbild mit HUD als CanvasLayer: Der Zähler 0 steht oben links in der Ecke, die Figur steht in der Bildmitte, weil die Kamera ihr folgt](/media/godot/szenenbaum/hud-canvaslayer@2x.png "Godot 4.7.2, Figur bei (60, 30), Zähler in einem CanvasLayer")

  ![Gleiches Spielbild, aber der Zähler hängt direkt unter Main: Die 0 steht mitten in der Welt neben der Kiste](/media/godot/szenenbaum/hud-node2d@2x.png "Godot 4.7.2, Figur bei (60, 30), Zähler ohne CanvasLayer")

  > [!MERKE]
  > Ein `CanvasLayer` mit höherem `layer` liegt über allem und bewegt sich nicht mit der Kamera. Darin entscheidet zuerst `z_index`. Bei gleichem `z_index` entscheidet die Y-Sortierung, wo sie an ist, sonst die Baumreihenfolge.

  ## Node-Pfade: `$`, `get_node()`, `..` und `%`

  Ein Skript findet andere Nodes über Pfade, relativ zu dem Node, an dem es hängt ([Node.get_node](https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-method-get-node)). `$Counter` ist die Kurzform von `get_node("Counter")`, `..` geht eine Ebene nach oben, ein Pfad mit `/` am Anfang beginnt bei der Wurzel des ganzen Spiels. Zum Ausprobieren schreibst du vorübergehend in `player.gd`:

  ```gdscript
  func _ready() -> void:
  	print(get_path())
  	print(get_parent().name)
  	print(get_node("../Crate").position)
  	print(get_node("../../HUD/Counter").text)
  ```

  ```text
  /root/Main/Objects/Player
  Objects
  (40.0, 10.0)
  0
  ```

  `hud.gd` holt sich den Zähler mit `@onready var counter: Label = $Counter`. `@onready` wertet den Pfad kurz vor `_ready()` aus, wenn alle Kinder im Baum sind ([GDScript reference, @onready](https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_basics.html#onready-annotation)).

  **Was bricht.** Benennst du `Counter` um oder hängst ihn tiefer, ändert Godot das Skript nicht. Beim Start meldet das Spiel, hier im Terminal gestartet (im Editor steht dieselbe Meldung im Debugger unter *Fehler*):

  ```text
  ERROR: Node not found: "Counter" (relative to "/root/Main/HUD").
     at: get_node (scene/main/node.cpp:1975)
     GDScript backtrace (most recent call first):
         [0] @implicit_ready (res://hud.gd:5)
  ```

  `@implicit_ready` ist die Zeile mit `@onready`. Gegen solche Brüche gibt es **Szenen-eindeutige Namen**: Rechtsklick im Szenen-Dock → *Über einzigartigen Namen zugreifen*. Der Node trägt dann ein `%`, und das Skript schreibt `%Counter`. Mit 4.7.2 geprüft: Hängt `Counter` danach in einem zusätzlichen Container, findet `%Counter` ihn weiter, `$Counter` nicht. Das gilt nur innerhalb derselben Szene ([Scene Unique Nodes](https://docs.godotengine.org/en/stable/tutorials/scripting/scene_unique_nodes.html)).

  Signalverbindungen speichert die Szene ebenfalls als Pfade. Verschiebst oder benennst du Nodes im Szenen-Dock um, schreibt der Editor beim Speichern die neuen Pfade. Ändert jemand die `.tscn` von Hand, passiert das nicht.

  > [!WARNING] Stille Brüche
  > Mit 4.7.2 nachgestellt: Steht `Player` nach einer Änderung im Text direkt unter `Main`, die Verbindung aber noch mit `from="Objects/Player"`, lädt die Szene ohne Fehler. Nur die Verbindung fehlt, und der Zähler bleibt bei 0. Prüf nach jedem Umbau im Signale-Dock, ob die Verbindungen noch da sind.

  ## Die `.tscn` lesen

  So speichert der Editor `main.tscn` in 4.7.2:

  ```ini title=main.tscn
  [gd_scene format=3 uid="uid://ef8tg5r8yt71"]

  [ext_resource type="PackedScene" uid="uid://titrdvxe5ria" path="res://player.tscn" id="1"]
  [ext_resource type="PackedScene" uid="uid://pf85is85vm4h" path="res://crate.tscn" id="2"]
  [ext_resource type="PackedScene" uid="uid://cjjikuxf00l3x" path="res://pickup.tscn" id="3"]
  [ext_resource type="Script" uid="uid://gox8xexcx3h1" path="res://hud.gd" id="4"]

  [node name="Main" type="Node2D" unique_id=1530763771]

  [node name="Floor" type="ColorRect" parent="." unique_id=1265667333]
  offset_left = -200.0
  offset_top = -120.0
  offset_right = 200.0
  offset_bottom = 120.0
  color = Color(0.22, 0.3, 0.22, 1)

  [node name="Objects" type="Node2D" parent="." unique_id=659594344]
  y_sort_enabled = true

  [node name="Player" parent="Objects" unique_id=1513722367 instance=ExtResource("1")]

  [node name="Crate" parent="Objects" unique_id=481004414 instance=ExtResource("2")]
  position = Vector2(40, 10)

  [node name="Pickup" parent="Objects" unique_id=1187784594 instance=ExtResource("3")]
  position = Vector2(-50, -20)

  [node name="Pickup2" parent="Objects" unique_id=969255857 instance=ExtResource("3")]
  position = Vector2(-70, 30)

  [node name="Pickup3" parent="Objects" unique_id=1350431156 instance=ExtResource("3")]
  position = Vector2(70, 40)

  [node name="HUD" type="CanvasLayer" parent="." unique_id=552369509]
  script = ExtResource("4")

  [node name="Counter" type="Label" parent="HUD" unique_id=426207881]
  offset_left = 4.0
  offset_top = 2.0
  offset_right = 44.0
  offset_bottom = 18.0
  text = "0"

  [connection signal="collected" from="Objects/Player" to="HUD" method="show_total"]
  ```

  Von oben nach unten ([TSCN file format](https://docs.godotengine.org/en/stable/engine_details/file_formats/tscn.html#file-structure)):

  - **`[gd_scene …]`** ist der Kopf mit Format und UID der Szene.
  - **`[ext_resource …]`** listet Dateien, die die Szene benutzt, jede mit einer `id`. Weiter unten verweist `ExtResource("3")` auf `pickup.tscn`.
  - **`[sub_resource …]`** wären Ressourcen, die in der Szene selbst stecken, etwa eine Kollisionsform. `main.tscn` hat keine, `player.tscn` hat eine für `Feet`.
  - **`[node …]`** ist ein Node in Baumreihenfolge. Die Wurzel hat kein `parent`. `parent="."` heißt Kind der Wurzel, `parent="Objects"` Kind von `Objects`; der Name der Wurzel fehlt in diesen Pfaden. `type` nennt die Klasse, `instance=` macht den Node zur Instanz einer Szene. Darunter stehen nur Eigenschaften, die vom Standard abweichen.
  - **`[connection …]`** ist eine Signalverbindung: Signal `collected` von `Objects/Player` an die Methode `show_total` von `HUD`.

  `unique_id` schreibt Godot seit 4.6, um Nodes beim Verschieben und Umbenennen zu verfolgen. Von Hand geschriebene Dateien wie die Vorlagen des Testgeländes haben weder `uid` noch `unique_id`. Beim ersten Speichern ergänzt der Editor beides; das ist ein großer, aber erwartbarer Diff ([Upgrading to Godot 4.6](https://docs.godotengine.org/en/stable/tutorials/migrating/upgrading_to_godot_4.6.html#core)).

  > [!PRAXIS]
  > Lies eine Szene, die ein Agent gebaut hat, einmal als Text von oben nach unten, bevor du sie im Editor anfasst. In zwei Minuten weißt du, welche Szenen sie einsetzt, was von Standardwerten abweicht und welche Verbindungen sie hat. Bitte den Agenten, Struktur im Editor-Format zu ändern oder dir die geänderten `[node]`- und `[connection]`-Zeilen zu nennen, und prüf danach das Signale-Dock.

  > [!DEEP] Aufrufreihenfolge
  > Hängt an `Main`, `Objects`, `Player`, `Crate` und `HUD` dasselbe Skript mit `extends Node`, das in `_enter_tree()`, `_ready()` und im ersten `_process()` seinen Namen ausgibt, zeigt 4.7.2: `_enter_tree` läuft von oben nach unten (Main, Objects, Player, Crate, HUD). `_ready` läuft zuerst bei den Kindern: Player, Crate, Objects, HUD, Main. `_process` läuft wieder in Baumreihenfolge: Main, Objects, Player, Crate, HUD. Die Doku beschreibt genau das ([Node._ready](https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-private-method-ready), [process_priority](https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-property-process-priority)). Ein Eltern-Node kann sich in `_ready()` also darauf verlassen, dass seine Kinder bereit sind. Wer früher drankommen muss, setzt `process_priority`.

  > [!INTERVIEW]
  > „In einem Draufsicht-Level wird die Figur hinter einem Baum gezeichnet, obwohl sie davor steht. Wie gehst du vor?“ Gute Antwort: Ich prüfe, ob Figur und Baum Kinder desselben Nodes mit Y-Sortierung sind, ob beide denselben `z_index` haben und wo ihr Ursprung liegt. Y-Sortierung vergleicht den Ursprung, also muss er bei beiden an der Standlinie sitzen. Ohne Y-Sortierung entscheidet die Baumreihenfolge, und dann gewinnt, wer später im Baum steht.

  ## Häufige Fehler

  - **Ursprung nicht an den Füßen.** Y-Sortierung vergleicht die Ursprünge. Liegt er in der Bildmitte oder am Kopf, kippt die Reihenfolge, sobald sich zwei Objekte nahe kommen.
  - **Y-Sortierung am falschen Node.** Sie sortiert die Kinder des Nodes, an dem sie an ist. Figuren und Hindernisse müssen Geschwister unter diesem Node sein.
  - **`z_index` gesetzt, Y-Sortierung wirkt nicht mehr.** Sortiert wird nur unter gleichem `z_index`. Eine Figur mit `z_index = 1` liegt vor allem mit 0.
  - **HUD ohne `CanvasLayer`.** Dann wandert der Zähler mit der Welt und kann von Objekten verdeckt werden.
  - **Node umbenannt oder verschoben, Skript nicht angepasst.** `Node not found` beim Start. `%`-Namen halten Umbauten innerhalb einer Szene aus.
  - **`.tscn` von Hand umgebaut.** Pfade in `[connection]` passen nicht mehr, die Verbindung fällt ohne Meldung weg.
  - **`position` mit `global_position` verwechselt.** Zwei Nodes mit gleicher `position` stehen nur dann am selben Ort, wenn sie denselben Elternknoten haben.

  ## Zusammenfassung

  - Ein Node hat eine Aufgabe, höchstens einen Elternknoten und beliebig viele Kinder. Eine Szene ist ein gespeicherter Baum mit genau einer Wurzel.
  - Im Editor ist eine Instanz eine Zeile mit Filmklappe; zur Laufzeit hängt dort der ganze Baum der eingesetzten Szene.
  - `position` gilt relativ zum Elternknoten. Verschiebung, Skalierung und Drehung der Eltern wirken auf die Kinder.
  - Gezeichnet wird in Baumreihenfolge, Kinder über Eltern. `z_index` legt Ebenen fest, Y-Sortierung ordnet Geschwister nach ihrem Ursprung, ein `CanvasLayer` liegt darüber und folgt der Kamera nicht.
  - `$Name` und `get_node()` sind relative Pfade, `..` geht nach oben, `%Name` findet einen Node innerhalb der Szene unabhängig vom Pfad.
  - In einer `.tscn` stehen Nodes in Baumreihenfolge mit `parent`-Pfad ohne Wurzelnamen, Verbindungen als `[connection]` mit Pfaden.
  - `_ready()` läuft bei Kindern zuerst, `_process()` in Baumreihenfolge.
exercises:
  - id: baum-aussagen
    type: choice
    title: Was gilt im Baum?
    prompt: |
      Welche Aussagen über Nodes und Szenen stimmen in Godot 4.7?
    options:
      - text: Eine `.tscn` hat genau einen Wurzel-Node.
        correct: true
        why: Die Doku verlangt genau eine Wurzel je Szene; ohne sie kann Godot die Datei nicht laden.
      - text: Im Editor ist `Player` in `main.tscn` eine Zeile, zur Laufzeit hängen darunter `Body`, `Feet` und `Camera2D`.
        correct: true
        why: Der Editor zeigt die Instanz zugeklappt. Zur Laufzeit ist sie ein gewöhnlicher Teilbaum, wie `print_tree_pretty()` zeigt.
      - text: Ein Node kann zwei Elternknoten haben, wenn er in zwei Szenen vorkommt.
        correct: false
        why: Jeder Node hat höchstens einen Elternknoten. Zwei Instanzen derselben Szene sind zwei getrennte Nodes.
      - text: "`position` eines Kindes ist eine Weltkoordinate."
        correct: false
        why: "`position` ist relativ zum Elternknoten. Die Weltkoordinate heißt `global_position`."
    explanation: |
      Der Baum hat klare Regeln: eine Wurzel je Szene, ein Elternknoten je Node, Positionen relativ zum Elternknoten. Instanzen sehen im Editor kompakt aus, weil ihr Inhalt in der eingesetzten Szene bearbeitet wird; zur Laufzeit gibt es diesen Unterschied nicht mehr. Wer das weiß, sucht im Remote-Baum nicht vergeblich nach einer „Instanz“, sondern nach ihren Nodes.
    resources:
      - title: Godot Docs · Nodes and Scenes
        url: https://docs.godotengine.org/en/stable/getting_started/step_by_step/nodes_and_scenes.html
      - title: Godot Docs · TSCN file format · The scene tree
        url: https://docs.godotengine.org/en/stable/engine_details/file_formats/tscn.html#the-scene-tree

  - id: zeichenreihenfolge-ordnen
    type: order
    title: Wer liegt vorn?
    prompt: |
      Bring die Nodes von `main.tscn` in die Reihenfolge, in der Godot sie zeichnet, zuerst gezeichnet (ganz hinten) oben. `Objects` hat Y-Sortierung an, alle `z_index` sind 0. Positionen: `Pickup` (−50, −20), `Player` (0, 0), `Crate` (40, 10), `Pickup2` (−70, 30), `Pickup3` (70, 40). `Counter` hängt im `CanvasLayer` `HUD`.
    lang: text
    lines: |
      Floor
      Pickup
      Player
      Crate
      Pickup2
      Pickup3
      Counter
    hints:
      - "`Floor` steht im Baum vor `Objects`."
      - Unter `Objects` entscheidet die y-Position, kleinere zuerst.
      - Der `CanvasLayer` liegt auf Ebene 1, über der Welt.
    explanation: |
      Zuerst kommt `Floor`, weil er im Baum vor `Objects` steht. Unter `Objects` sortiert Godot nach y: −20, 0, 10, 30, 40. Die x-Werte spielen keine Rolle. Der Zähler im `CanvasLayer` liegt auf Ebene 1 und damit über allem auf Ebene 0, egal welchen `z_index` etwas dort hat.
    resources:
      - title: Godot Docs · CanvasItem.y_sort_enabled
        url: https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#class-canvasitem-property-y-sort-enabled
      - title: Godot Docs · CanvasLayer
        url: https://docs.godotengine.org/en/stable/classes/class_canvaslayer.html#description

  - id: global-position-skaliert
    type: output
    title: Ein Kind mit großem Vater
    prompt: |
      Das Skript hängt an einem `Node2D` am Ursprung. Was gibt es aus?
    lang: gdscript
    code: |
      func _ready() -> void:
      	var a := Node2D.new()
      	a.position = Vector2(100, 50)
      	var b := Node2D.new()
      	b.position = Vector2(20, 0)
      	a.add_child(b)
      	add_child(a)
      	print(b.global_position)
      	a.scale = Vector2(2, 2)
      	print(b.global_position)
    expected: |
      (120.0, 50.0)
      (140.0, 50.0)
    accept:
      - |
        (120, 50)
        (140, 50)
    hints:
      - "`b` steht 20 Pixel rechts von `a`."
      - Die Skalierung von `a` vergrößert auch den Versatz seiner Kinder.
    explanation: |
      `b` liegt 20 Pixel rechts von `a`, also bei 100 + 20 = 120. Mit Skalierung 2 wird der Versatz doppelt so groß: 100 + 40 = 140. `b.position` bleibt die ganze Zeit `(20, 0)`. Godot gibt `Vector2` mit Nachkommastelle aus. Gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Node2D.global_position
        url: https://docs.godotengine.org/en/stable/classes/class_node2d.html#class-node2d-property-global-position

  - id: global-position-gedreht
    type: output
    title: Eine Vierteldrehung
    prompt: |
      Gleiche Ausgangslage, aber `a` wird gedreht statt skaliert. Was gibt die letzte Zeile aus?
    lang: gdscript
    code: |
      func _ready() -> void:
      	var a := Node2D.new()
      	a.position = Vector2(100, 50)
      	var b := Node2D.new()
      	b.position = Vector2(20, 0)
      	a.add_child(b)
      	add_child(a)
      	a.rotation_degrees = 90
      	print(b.global_position)
    expected: |
      (100.0, 70.0)
    accept:
      - (100, 70)
    hints:
      - In Godot zeigt die y-Achse nach unten.
      - Der Versatz (20, 0) dreht sich mit.
    explanation: |
      Die Drehung von `a` dreht den Versatz seines Kindes mit: Aus 20 Pixeln nach rechts werden 20 Pixel nach unten, weil die y-Achse in Godot nach unten zeigt. `b` landet bei (100, 50 + 20). So wandert etwa eine Hitbox an einem drehenden Pivot um die Figur. Gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · 2D transforms
        url: https://docs.godotengine.org/en/stable/tutorials/2d/2d_transforms.html

  - id: ready-reihenfolge
    type: output
    title: Wer ist zuerst bereit?
    prompt: |
      Jeder Node dieser Szene hat dasselbe Skript. Was steht in der Ausgabe?

      ```text
      Main (Node2D)
      ├── Objects (Node2D)
      │   ├── Player (CharacterBody2D)
      │   └── Crate (StaticBody2D)
      └── HUD (CanvasLayer)
      ```
    lang: gdscript
    code: |
      extends Node


      func _ready() -> void:
      	print(name)
    expected: |
      Player
      Crate
      Objects
      HUD
      Main
    hints:
      - Ein Node ist erst bereit, wenn alle seine Kinder bereit sind.
    explanation: |
      `_ready()` läuft bei den Kindern zuerst, und Geschwister kommen in Baumreihenfolge dran: Player und Crate, dann ihr Elternknoten Objects, dann HUD, zuletzt die Wurzel Main. Deshalb kann `Main` in `_ready()` auf alle Nodes zugreifen. `_process()` läuft dagegen von oben nach unten: Main, Objects, Player, Crate, HUD. Gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Node._ready
        url: https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-private-method-ready

  - id: pfade-ausgeben
    type: output
    title: Von der Figur aus gesehen
    prompt: |
      Du ergänzt vorübergehend `player.gd` im Testgelände. Was gibt `_ready()` aus? Die Kiste steht in `main.tscn` bei `(40, 10)`.
    lang: gdscript
    code: |
      func _ready() -> void:
      	print(get_path())
      	print(get_parent().name)
      	print(get_node("../Crate").position)
    expected: |
      /root/Main/Objects/Player
      Objects
      (40.0, 10.0)
    hints:
      - "`get_path()` liefert den absoluten Pfad ab der Wurzel des Spiels, `/root`."
      - "`..` ist der Elternknoten der Figur."
    explanation: |
      Der absolute Pfad beginnt bei `/root`, dem Fenster des Spiels, unter dem `Main` hängt. Der Elternknoten der Figur ist `Objects`, und `../Crate` geht von der Figur eine Ebene hoch und dort zu `Crate`. Dieselben Pfade stehen in Fehlermeldungen („relative to "/root/Main/HUD"“). Gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Node.get_node
        url: https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-method-get-node
      - title: Godot Docs · NodePath
        url: https://docs.godotengine.org/en/stable/classes/class_nodepath.html

  - id: pfade-schreiben
    type: gap
    title: Zwei Wege zum Zähler
    prompt: |
      Ergänze die Pfade. Das erste Skript hängt an `HUD`, das zweite an `Objects/Player` in `main.tscn`. `Counter` hat keinen eindeutigen Namen.
    lang: gdscript
    code: |
      # hud.gd am Node HUD
      @onready var counter: Label = ⟦$Counter⟧

      # player.gd am Node Objects/Player
      @onready var hud_counter: Label = get_node("⟦../../HUD/Counter⟧")
    gaps:
      - label: Kind des HUD
        hint: Die Kurzform mit `$`.
        accept:
          - get_node("Counter")
          - $"Counter"
      - label: Von der Figur zum Zähler
        hint: Zwei Ebenen hoch zu `Main`, dann hinunter.
        accept:
          - /root/Main/HUD/Counter
    explanation: |
      `$Counter` ist die Kurzform für `get_node("Counter")`, relativ zum Node mit dem Skript. Von `Objects/Player` führt `..` zu `Objects`, ein zweites `..` zu `Main`, dann `HUD/Counter`. Der absolute Pfad `/root/Main/HUD/Counter` geht auch, bricht aber, sobald die Szene anders eingebunden ist. Ein `%Counter` ginge erst, wenn du den Zähler als eindeutigen Namen markierst.
    resources:
      - title: Godot Docs · Node.get_node
        url: https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-method-get-node

  - id: tscn-zeilen
    type: gap
    title: Drei Zeilen aus main.tscn
    prompt: |
      Ergänze die Zeilen so, dass `Counter` ein Kind von `HUD` ist, `Pickup2` eine Instanz von `pickup.tscn` unter `Objects` und das Signal `collected` der Figur `show_total` am `HUD` aufruft.
    lang: ini
    code: |
      [ext_resource type="PackedScene" path="res://pickup.tscn" id="3"]

      [node name="Pickup2" parent="⟦Objects⟧" instance=ExtResource("⟦3⟧")]

      [node name="Counter" type="Label" parent="⟦HUD⟧"]

      [connection signal="collected" from="⟦Objects/Player⟧" to="HUD" method="show_total"]
    gaps:
      - label: Elternknoten von Pickup2
        hint: Der Pfad ab der Wurzel, ohne den Namen der Wurzel.
      - label: Verweis auf pickup.tscn
        hint: Die `id` aus der `[ext_resource]`-Zeile.
      - label: Elternknoten von Counter
        hint: Der `CanvasLayer`.
      - label: Absender des Signals
        hint: Der Pfad der Figur ab der Wurzel.
    explanation: |
      `parent` nennt den Pfad ab der Wurzel, aber ohne deren Namen: Kinder der Wurzel haben `parent="."`, Kinder von `Objects` haben `parent="Objects"`. `instance=ExtResource("3")` verweist über die `id` auf die `[ext_resource]`-Zeile von `pickup.tscn`. In `[connection]` sind `from` und `to` Pfade nach derselben Regel. Genau deshalb bricht eine Verbindung, wenn jemand den Node im Text verschiebt und `from` stehen lässt.
    resources:
      - title: Godot Docs · TSCN file format · The scene tree
        url: https://docs.godotengine.org/en/stable/engine_details/file_formats/tscn.html#the-scene-tree

  - id: zaehler-umbenannt
    type: bug
    title: Nach dem Umbenennen
    prompt: |
      Ein Agent hat im Szenen-Dock `HUD/Counter` in `TotalLabel` umbenannt. Seitdem meldet das Spiel beim Start, im Terminal gestartet:

      ```text
      ERROR: Node not found: "Counter" (relative to "/root/Main/HUD").
         at: get_node (scene/main/node.cpp:1975)
         GDScript backtrace (most recent call first):
             [0] @implicit_ready (res://hud.gd:5)
      ```

      Finde die Zeile in `hud.gd` und korrigiere sie.
    lang: gdscript
    code: |
      extends CanvasLayer

      ## Zeigt, wie viele Sammelstücke die Figur hat.

      @onready var counter: Label = $Counter


      func show_total(total: int) -> void:
      	counter.text = str(total)
    lines: [5]
    fix:
      - line: 5
        answers:
          - "@onready var counter: Label = $TotalLabel"
          - "@onready var counter: Label = get_node(\"TotalLabel\")"
          - "@onready var counter: Label = $\"TotalLabel\""
    explanation: |
      Umbenennen im Szenen-Dock ändert die Szene, aber keine Skripte. `$Counter` sucht ein Kind dieses Namens und findet keins; `@implicit_ready` in der Meldung zeigt auf die Zeile mit `@onready`. Die Korrektur nennt den neuen Namen. Dauerhaft robuster ist ein eindeutiger Name: Zähler als *Über einzigartigen Namen zugreifen* markieren und `%TotalLabel` schreiben. Die Meldung ist mit 4.7.2 nachgestellt.
    resources:
      - title: Godot Docs · Scene Unique Nodes
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/scene_unique_nodes.html

  - id: verbindung-verloren
    type: bug
    title: Der Zähler bleibt bei 0
    prompt: |
      Ein Agent hat `main.tscn` als Text bearbeitet und die Figur direkt unter `Main` gehängt; dort soll sie bleiben. Das Spiel startet ohne Fehlermeldung, die Figur sammelt alle drei Stücke ein, aber der Zähler bleibt bei 0. Finde die Zeile und korrigiere sie.
    lang: ini
    code: |
      [node name="Main" type="Node2D"]

      [node name="Objects" type="Node2D" parent="."]
      y_sort_enabled = true

      [node name="Player" parent="." instance=ExtResource("1")]

      [node name="HUD" type="CanvasLayer" parent="."]
      script = ExtResource("4")

      [connection signal="collected" from="Objects/Player" to="HUD" method="show_total"]
    lines: [11]
    fix:
      - line: 11
        answers:
          - '[connection signal="collected" from="Player" to="HUD" method="show_total"]'
    explanation: |
      `from="Objects/Player"` zeigt auf einen Node, den es nicht mehr gibt. Mit 4.7.2 nachgestellt: Godot lädt die Szene trotzdem ohne Meldung, nur die Verbindung fehlt. Hättest du die Figur im Szenen-Dock verschoben, hätte der Editor beim Speichern `from="Player"` geschrieben. Prüf nach Umbauten im Text das Signale-Dock: Die Wellen neben `Player` im Szenen-Dock wären verschwunden. Nebenbei liegt die Figur jetzt außerhalb der Y-Sortierung von `Objects`.
    resources:
      - title: Godot Docs · TSCN file format
        url: https://docs.godotengine.org/en/stable/engine_details/file_formats/tscn.html#file-structure

  - id: ursprung-am-kopf
    type: bug
    title: Davor und trotzdem dahinter
    prompt: |
      Y-Sortierung an `Objects` ist an. Die Figur steht mit den Füßen sichtbar unterhalb der Kiste, also davor, und wird trotzdem hinter ihr gezeichnet. Welche Zeile in `player.tscn` ist schuld? Korrigiere sie so, dass der Körper wie in der Vorlage über dem Ursprung liegt.

      ![Ausschnitt des Spielbilds: Die braune Kiste verdeckt den Oberkörper der blauen Figur, deren Füße unterhalb der Kiste herausschauen](/media/godot/szenenbaum/reihenfolge-kopf@2x.png "Godot 4.7.2, Figur-Ursprung bei y = 0, Kiste bei y = 10")
    lang: ini
    code: |
      [node name="Player" type="CharacterBody2D"]
      collision_layer = 2
      motion_mode = 1
      script = ExtResource("1")
      stats = ExtResource("2")

      [node name="Body" type="Polygon2D" parent="."]
      color = Color(0.35, 0.65, 0.95, 1)
      polygon = PackedVector2Array(-6, 0, 6, 0, 6, 16, -6, 16)

      [node name="Feet" type="CollisionShape2D" parent="."]
      position = Vector2(0, -3)
      shape = SubResource("feet")
    lines: [9]
    fix:
      - line: 9
        answers:
          - polygon = PackedVector2Array(-6, -16, 6, -16, 6, 0, -6, 0)
          - polygon = PackedVector2Array(-6, 0, 6, 0, 6, -16, -6, -16)
    hints:
      - Y-Sortierung vergleicht den Ursprung der Figur, nicht ihr Bild.
      - Von welcher y-Koordinate bis zu welcher reicht der Körper hier?
    explanation: |
      Der Körper reicht hier von y = 0 bis 16, unter dem Ursprung. Der Ursprung sitzt also am Kopf. Steht der Kopf bei y = 0 und die Kiste bei y = 10, zeichnet Godot die Kiste vorn, obwohl die Füße bei y = 16 schon davor stehen. Mit dem Körper von −16 bis 0 liegt der Ursprung an den Füßen, wo Y-Sortierung ihn braucht. Die Fußform bei `(0, -3)` hätte den Fehler verraten: Sie saß über dem Kopf statt an den Füßen. Das Bild ist mit 4.7.2 nachgestellt.
    resources:
      - title: Godot Docs · CanvasItem.y_sort_enabled
        url: https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#class-canvasitem-property-y-sort-enabled

  - id: canvaslayer-erklaeren
    type: explain
    title: Warum der Zähler in der Ecke bleibt
    prompt: |
      Erkläre in drei bis fünf Sätzen, warum `Counter` oben links bleibt, während die Kamera der Figur folgt, und was sich am Bild ändert, wenn jemand `Counter` aus dem `HUD` nimmt und direkt unter `Main` hängt.

      ![Spielbild: Zähler oben links, die Figur in der Bildmitte](/media/godot/szenenbaum/hud-canvaslayer@2x.png "Godot 4.7.2, Counter im CanvasLayer HUD")
    lang: text
    code: |
      Main (Node2D)
      ├── Floor (ColorRect)
      ├── Objects (Node2D, y_sort_enabled)
      │   └── Player … mit Camera2D als Kind
      └── HUD (CanvasLayer, layer = 1)
          └── Counter (Label, offset 4, 2)
    points:
      - Die Kamera verschiebt die Transformation der Welt auf Ebene 0, nicht die eines `CanvasLayer`.
      - "`HUD` hat eine eigene Ebene mit eigener Transformation; `Counter` steht in Bildschirmkoordinaten bei (4, 2)."
      - Ebene 1 liegt über Ebene 0, unabhängig von jedem `z_index` in der Welt.
      - Direkt unter `Main` läge der Zähler in Weltkoordinaten bei (4, 2), würde mit der Kamera aus dem Bild wandern und nach Baumreihenfolge mit den Objekten gezeichnet.
    explanation: |
      Eine `Camera2D` arbeitet, indem sie die Transformation der Welt-Ebene verschiebt. Ein `CanvasLayer` hat eine eigene Transformation, die die Kamera nicht anfasst, solange `follow_viewport_enabled` aus ist. Deshalb steht `Counter` immer bei (4, 2) auf dem Bildschirm, und weil Ebene 1 über Ebene 0 liegt, verdeckt ihn nichts aus der Welt. Hängt der Zähler direkt unter `Main`, ist (4, 2) eine Weltkoordinate: Er steht neben dem Startpunkt der Figur, läuft mit der Kamera aus dem Bild und wird nach Baumreihenfolge und `z_index` mit den Objekten gezeichnet; so zeigt es das zweite Spielbild der Lektion. Nebenbei fände `hud.gd` ihn mit `$Counter` nicht mehr und meldet beim Start `Node not found: "Counter"`. Im Testgelände nachgestellt mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Canvas layers
        url: https://docs.godotengine.org/en/stable/tutorials/2d/canvas_layers.html

  - id: baum-rekonstruieren
    type: practice
    title: Einen Baum aus Text bauen
    prompt: |
      Schreib den Szenenbaum dieser Datei auf, mit Typ jedes Nodes, und notiere die Signalverbindung in einem Satz. Einrückung mit Leerzeichen reicht.

      ```ini
      [gd_scene format=3]

      [ext_resource type="Script" path="res://door.gd" id="1"]

      [sub_resource type="RectangleShape2D" id="block"]
      size = Vector2(16, 6)

      [sub_resource type="RectangleShape2D" id="sensor"]
      size = Vector2(24, 24)

      [node name="Door" type="StaticBody2D"]
      script = ExtResource("1")

      [node name="Body" type="Polygon2D" parent="."]
      polygon = PackedVector2Array(-8, -16, 8, -16, 8, 0, -8, 0)

      [node name="Block" type="CollisionShape2D" parent="."]
      position = Vector2(0, -3)
      shape = SubResource("block")

      [node name="Sensor" type="Area2D" parent="."]

      [node name="Range" type="CollisionShape2D" parent="Sensor"]
      shape = SubResource("sensor")

      [node name="Hint" type="Label" parent="Sensor"]
      offset_top = -32.0
      text = "?"

      [connection signal="body_entered" from="Sensor" to="." method="_on_sensor_body_entered"]
      ```
    lang: text
    solution: |
      Door (StaticBody2D, door.gd)
        Body (Polygon2D)
        Block (CollisionShape2D, Form "block")
        Sensor (Area2D)
          Range (CollisionShape2D, Form "sensor")
          Hint (Label)

      Wenn ein Körper die Fläche von Sensor betritt,
      sendet Sensor body_entered, und Door ruft
      _on_sensor_body_entered auf.
    checklist:
      - "`Door` ist die Wurzel, weil ihre Zeile kein `parent` hat."
      - "`Body`, `Block` und `Sensor` sind Kinder der Wurzel (`parent=\".\"`)."
      - "`Range` und `Hint` hängen unter `Sensor`."
      - Jede Form ist ihrem `CollisionShape2D` über die `id` der `[sub_resource]` zugeordnet.
      - Der Satz zur Verbindung nennt Absender, Signal, Empfänger und Methode.
    explanation: |
      Die Wurzel erkennst du am fehlenden `parent`. `parent="."` heißt Kind der Wurzel, `parent="Sensor"` Kind von `Sensor`. Die Formen stecken als `[sub_resource]` in der Datei, ihre `id` verbindet sie mit dem `shape` der Nodes. In der Verbindung steht `to="."`, also die Wurzel `Door` mit ihrem Skript. Mit 4.7.2 geladen, `print_tree_pretty()` zeigt denselben Baum.
    resources:
      - title: Godot Docs · TSCN file format
        url: https://docs.godotengine.org/en/stable/engine_details/file_formats/tscn.html#file-structure
