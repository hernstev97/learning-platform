id: pixelraster
title: "Pixelraster und Skalierung: was auf dem Bildschirm landet"
level: 2
minutes: 120
summary: Was zwischen Spielauflösung und Monitor passiert, wie du ganzzahlige Faktoren und schwarze Ränder ausrechnest und wie du unscharfe, ungleiche und zitternde Pixel an echten Aufnahmen aus Godot 4.7 erkennst.
place: unterwegs
goals:
  - Du erklärst, wie Godot ein Spielbild im Stretch Mode `viewport` und `canvas_items` auf den Bildschirm bringt und an welcher Stelle der Texturfilter wirkt.
  - Du rechnest für eine Spielauflösung und einen Bildschirm den ganzzahligen Faktor und die Breite der schwarzen Ränder aus.
  - Du sagst vorher, was Stretch Aspect `keep` und `expand` mit Rändern und sichtbarer Fläche machen.
  - Du erkennst an einem Screenshot unscharfe Pixel, ungleich breite Pixel, Mixels, gedrehte Pixelart und einen nicht ganzzahligen Kamera-Zoom und nennst die Einstellung dahinter.
  - Du erklärst, warum Kameraglättung zusammen mit Pixel-Snap eine Figur um einen Pixel zittern lässt.
