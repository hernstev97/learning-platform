lesson: |
  Du zeichnest eine Figur, 16 Pixel breit, jede Kante sitzt. Im Spiel ist sie auf dem Monitor verwaschen, auf dem Laptop sind manche Pixel breiter als andere, und sobald die Kamera ihr folgt, zuckt sie um einen Pixel vor und zurück. An der Zeichnung liegt nichts davon. Es passiert zwischen dem Bild, das Godot rechnet, und dem Bild, das der Monitor zeigt.

  Die Einstellungen kennst du aus [Godot-Start](/combat/godot-start): 320 × 180, Stretch Mode `viewport`, Scale Mode `integer`, Filter `Nearest`, Snap. Hier geht es um das Warum und die Folgen: was Godot an welcher Stelle rechnet, wie viel Rand auf welchem Monitor bleibt und woran du an einem Screenshot erkennst, welche Einstellung nicht stimmt. Alle Bilder sind echte Aufnahmen aus Godot 4.7.2 mit dem Renderer Compatibility. Die 320 × 180 des Testgeländes sind ein Platzhalter. Welche Auflösung dein Spiel bekommt, entscheidest du mit deiner Pixelart.

  ## Das Prüfmuster: ein Bild, an dem jeder Fehler auffällt

  An einer Figur übersiehst du, ob ein Pixel fehlt oder doppelt ist. Ein technisches Prüfmuster zeigt es sofort. Das Muster in diesem Modul ist 32 × 32 Pixel groß: ein Rahmen aus einer Pixelreihe, ein Schachbrett aus einzelnen Pixeln, senkrechte und waagrechte Streifen von je einem Pixel und zwei Diagonalen.

  ![Prüfmuster 32 × 32 Pixel, zwölffach vergrößert: weißer Rahmen, oben links ein Schachbrett aus Einzelpixeln, oben rechts senkrechte Streifen, unten links waagrechte Streifen, unten rechts zwei Diagonalen in Weiß und Hellblau](/media/godot/pixelraster/pruefmuster@2x.png "Das Prüfmuster dieses Moduls, zwölffach vergrößert")

  Jeder Skalierungsfehler verrät sich daran: Ein ungleicher Faktor macht Streifen verschieden breit, ein weicher Filter macht aus Schwarz und Weiß Grau, eine Drehung zerreißt das Schachbrett. So ein Muster legst du in Aseprite oder Krita in zwei Minuten selbst an und speicherst es als PNG im Projekt. Es ist ein Messwerkzeug, keine Grafik für dein Spiel.

  ## Vom Spielbild zum Monitor: viewport und canvas_items

  Zwischen Szene und Monitor liegen zwei Schritte: Godot zeichnet die Szene in einer Auflösung, dann wird das Ergebnis auf die Fenstergröße gebracht. Der Stretch Mode legt fest, wann skaliert wird ([Stretch Mode](https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#stretch-mode)).

  - **`viewport`**: Godot zeichnet die ganze Szene in 320 × 180 und vergrößert danach das fertige Bild. Aus jedem Spielpixel wird ein Block aus Bildschirmpixeln.
  - **`canvas_items`**: Godot zeichnet jeden Node direkt in Fenstergröße. Ein Sprite mit 32 Pixeln wird bei Faktor 4 als 128 Bildschirmpixel gezeichnet. Dabei entscheidet der Texturfilter, was zwischen zwei Texturpixeln entsteht.

  Daraus folgt, wo der **Texturfilter** wirkt. `Linear` mischt beim Vergrößern die vier nächsten Texturpixel, `Nearest` nimmt das nächste ([DefaultCanvasItemTextureFilter](https://docs.godotengine.org/en/stable/classes/class_viewport.html#class-viewport-constant-default-canvas-item-texture-filter-linear)). Im Modus `canvas_items` vergrößert jedes Sprite selbst, also wird es mit `Linear` weich. Im Modus `viewport` zeichnet Godot das Muster 1:1 in das kleine Bild. Dort spielt der Filter nur eine Rolle, wenn ein Sprite skaliert, gedreht oder zwischen zwei Pixeln gezeichnet wird.

  ![Zwei Aufnahmen des Prüfmusters bei Faktor 4 im Modus canvas_items: links mit Filter Linear, Schachbrett und Streifen sind grau verschwommen; rechts mit Nearest, alle Kanten scharf](/media/godot/pixelraster/filter-linear-nearest@2x.png "Godot 4.7.2, Stretch Mode canvas_items, Fenster 1280 × 720")

  Gemessen mit Godot 4.7.2 im Fenster 1280 × 720: Im Modus `canvas_items` mit `Linear` hat der Ausschnitt um das Muster 99 verschiedene Farben, mit `Nearest` 5: die vier Farben des Musters und den Hintergrund. Im Modus `viewport` sind es auch mit `Linear` nur 5. Das Vergrößern des fertigen Bildes mischt keine Farben, auch nicht bei Faktor 3,5. Das gilt für Compatibility und Forward+, beide gemessen.

  > [!WARNING] Neue Projekte starten in 4.7 anders
  > Ein Projekt, das du in Godot 4.7 neu anlegst, bekommt Stretch Mode `canvas_items` und Stretch Aspect `expand` ([Changed defaults](https://docs.godotengine.org/en/stable/tutorials/migrating/upgrading_to_godot_4.7.html#changed-defaults)). Zusammen mit dem Standardfilter `Linear` sieht Pixelart dann aus wie links im Bild. Fehlt eine Zeile in `project.godot`, gilt der Standard der Klasse `ProjectSettings`: `disabled` und `keep`. Im Testgelände steht kein `aspect`; `ProjectSettings.get_setting("display/window/stretch/aspect")` liefert dort `keep`.

  Für Webentwickler: `viewport` entspricht einem `<canvas width="320" height="180">`, das per CSS auf 1280 × 720 gestreckt wird, mit `image-rendering: pixelated`. `canvas_items` ähnelt einer Seite, die mit `transform: scale(4)` vergrößert wird: Der Browser rechnet jedes Element in voller Auflösung neu. Der Vergleich bricht beim Filter: In Godot gilt er pro Node oder für das ganze Projekt, nicht pro CSS-Regel.

  ## Ganzzahlige Faktoren und schwarze Ränder ausrechnen

  Mit Scale Mode `integer` rundet Godot den Faktor ab ([Stretch Scale Mode](https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#stretch-scale-mode)). Der Faktor ist die kleinere der beiden Divisionen, abgerundet. Den Rest füllt Godot mit Schwarz, je zur Hälfte an beiden Seiten:

  ```text
  fx     = Bildschirmbreite / Spielbreite
  fy     = Bildschirmhöhe / Spielhöhe
  Faktor = abrunden(kleinerer Wert von fx, fy)
  Bild   = Spielauflösung × Faktor
  Rand   = (Bildschirm − Bild) / 2 je Seite
  ```

  Zwei Spielauflösungen zum Rechnen, keine Empfehlung: 320 × 180 aus dem Testgelände und 384 × 216.

  | Bildschirm | 320 × 180 | 384 × 216 |
  | --- | --- | --- |
  | 1920 × 1080 | × 6 | × 5 |
  | 2560 × 1440 | × 8 | × 6, 128 / 72 |
  | 3840 × 2160 | × 12 | × 10 |
  | 1366 × 768 | × 4, 43 / 24 | × 3, 107 / 60 |
  | 1280 × 800 | × 4, 0 / 40 | × 3, 64 / 76 |

  Hinter dem Faktor steht der Rand in Pixeln, links und rechts / oben und unten; ohne Angabe gibt es keinen. 1280 × 800 ist der Bildschirm des Steam Deck. Gemessen mit Godot 4.7.2 an Fenstern in diesen Größen: 320 × 180 bei 1366 × 768 ergibt 43 und 24 Pixel Rand, bei 1280 × 800 oben und unten 40, 384 × 216 bei 1366 × 768 ergibt 107 und 60. Die übrigen Zeilen sind nach der Formel gerechnet.

  ![Ganzes Spielfenster 1366 × 768 mit schmalem schwarzem Rand links, rechts, oben und unten um das Spielbild](/media/godot/pixelraster/raender-1366x768@2x.png "Godot 4.7.2, 320 × 180 im Fenster 1366 × 768, Faktor 4, auf die Hälfte verkleinert")

  Die Doku nennt 640 × 360 als Ausgangspunkt, weil es auf 720p, 1080p, 1440p und 2160p ohne Rand passt ([Desktop game](https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#desktop-game)). Für 320 × 180 gilt dasselbe mit doppeltem Faktor. Was du wählst, hängt an deiner Pixelart: Eine kleinere Auflösung heißt größere Pixel und weniger sichtbare Welt.

  > [!MERKE]
  > Faktor = kleinere Division, abgerundet. Rand = Rest durch zwei. Ein Faktor, der nicht aufgeht, wird nie gestreckt, sondern mit Schwarz aufgefüllt.

  > [!WARNING] Ein Pixel kostet einen Faktor
  > Laut Doku lässt der Fenstermodus Fullscreen unter Windows unten eine Pixelzeile frei. Aus 1080 werden 1079 Pixel Höhe, und `integer` rundet 1079 / 180 = 5,99 auf 5 ab: 1600 × 900 statt 1920 × 1080. Die Doku empfiehlt deshalb Exclusive Fullscreen ([Stretch Scale Mode](https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#stretch-scale-mode)). Die Rechnung stammt aus der Doku-Angabe, unter Linux ist sie nicht nachgemessen.

  ## Seitenverhältnis: keep, expand und die sichtbare Fläche

  Der Stretch Aspect bestimmt, was passiert, wenn der Bildschirm ein anderes Seitenverhältnis hat als das Spiel ([Stretch Aspect](https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#stretch-aspect)). Mit `keep` bleibt die Spielfläche gleich, der Rest wird schwarz. Mit `expand` wächst die Spielfläche in eine Richtung, der Spieler sieht mehr Welt. `keep_width` und `keep_height` wachsen nur nach unten oder nur zur Seite.

  Gemessen mit 320 × 180 und Scale Mode `integer`:

  | Fenster | `keep` | `expand` |
  | --- | --- | --- |
  | 1280 × 800 | 320 × 180, oben und unten 40 px Schwarz | 320 × 200, kein Rand |
  | 1366 × 768 | 320 × 180, Rand 43 / 24 | 320 × 180, Rand 43 / 24 |

  Die Spalte zeigt `get_viewport().get_visible_rect().size`. Bei 1280 × 800 füllt `expand` die 40 Pixel mit 20 zusätzlichen Spielpixeln Welt. Bei 1366 × 768 ändert `expand` nichts: Das Seitenverhältnis ist fast gleich, und der Rest kommt vom Abrunden des Faktors. Diesen Rest füllt auch `expand` nicht.

  Mit `expand` muss deine Welt größer sein als 320 × 180, sonst sieht der Spieler über den Levelrand. Ein HUD in einem `CanvasLayer` bleibt an den Ecken, an denen es verankert ist. Gemessen bei 1280 × 800: Ein Element oben links bleibt bei y = 4, eines unten rechts rückt mit `expand` von y = 166 auf y = 186. Ob alle Spieler dieselbe Fläche sehen oder breitere Bildschirme mehr zeigen, ist eine Entscheidung für dein Spiel.

  ## Fehlerbilder am Prüfmuster erkennen

  Die folgenden Bilder zeigen das Muster in einem Projekt mit 320 × 180, `viewport` und Filter `Nearest`. Jeweils eine Einstellung weicht ab.

  ### Ungleich breite Pixel: Faktor nicht ganzzahlig

  ![Streifenfeld des Prüfmusters zweimal: oben bei Faktor 4 sind weiße und schwarze Streifen gleich breit, unten bei Faktor 3,5 sind die weißen Streifen breiter als die schwarzen](/media/godot/pixelraster/faktor-4-und-3-5@2x.png "Godot 4.7.2, viewport, Fenster 1280 × 720 mit integer und 1120 × 630 mit fractional, Ausschnitt neunfach vergrößert")

  Bei Faktor 3,5 kann ein Spielpixel nicht 3,5 Bildschirmpixel breit sein. Gemessen sind die Pixel abwechselnd 4 und 3 breit. In den Streifen sieht das aus, als wären Weiß und Schwarz verschieden dick. Ursache: Scale Mode `fractional`, der Standard der Klasse.

  ### Mixels: Sprites in verschiedenen Maßstäben

  ![Zwei Prüfmuster nebeneinander: links in Originalgröße, rechts doppelt so groß mit doppelt so großen Pixeln](/media/godot/pixelraster/mixel@2x.png "Godot 4.7.2, Spielbild 320 × 180 sechsfach vergrößert, rechtes Sprite mit scale 2")

  Ein Sprite mit `scale` 2 hat doppelt so große Pixel wie alles andere. Im Bild ist jeder Pixel scharf, und trotzdem passen die Raster nicht zusammen. Solche gemischten Pixelgrößen heißen **Mixels**. Sie entstehen auch, wenn eine Grafik in einer anderen Auflösung gezeichnet wurde als der Rest. Mit `scale` 1,5 kommen ungleich breite Pixel dazu, weil 1,5 nicht aufgeht.

  ### Gedrehte Pixelart

  ![Prüfmuster um 15 Grad gedreht: links im Modus viewport mit Treppen und zerrissenem Schachbrett, rechts im Modus canvas_items mit feinen, schräg liegenden Pixeln](/media/godot/pixelraster/drehung@2x.png "Godot 4.7.2, Sprite mit rotation 15°, Faktor 4")

  Drehst du ein Sprite im Modus `viewport`, sucht Godot für jeden Pixel des kleinen Bildes das nächste Texturpixel. Manche Pixel kommen doppelt, andere fehlen, das Schachbrett zerreißt. Im Modus `canvas_items` dreht Godot in voller Auflösung: Die Pixel bleiben ganz, liegen aber schräg und sind feiner als das Raster drumherum, also wieder Mixels. Viele Pixelart-Spiele zeichnen Drehungen deshalb als eigene Frames. Ob du drehst, eigene Frames zeichnest oder beides mischst, entscheidest du.

  ## Kamera: Zoom, Pixel-Snap und Glättung

  `Camera2D.zoom` vergrößert die Welt im kleinen Bild ([zoom](https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-zoom)); der Standard ist `(1, 1)`. Im Modus `viewport` gilt dieselbe Regel wie beim Faktor: `zoom` 2 macht aus jedem Weltpixel 2 × 2 Spielpixel, `zoom` 1,5 macht manche Pixel 1 und andere 2 breit. Zoom 2 halbiert außerdem die sichtbare Welt auf 160 × 90.

  ![Prüfmuster mit Kamera-Zoom 2 und 1,5: bei 2 gleichmäßig, bei 1,5 sind Schachbrett und Streifen unregelmäßig](/media/godot/pixelraster/kamera-zoom@2x.png "Godot 4.7.2, viewport, Camera2D.zoom 2 und 1,5, Bild 320 × 180 achtfach vergrößert")

  **Pixel-Snap** rundet beim Zeichnen die Position jedes Nodes auf ganze Pixel ([snap_2d_transforms_to_pixel](https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-rendering-2d-snap-snap-2d-transforms-to-pixel)). Gemessen an vier Kopien des Musters bei Faktor 4, linker Rand in Bildschirmpixeln:

  | `position.x` | `canvas_items`, Snap aus | `viewport`, Snap an |
  | --- | --- | --- |
  | 144 | 576 | 576 |
  | 144,25 | 577 | 576 |
  | 144,5 | 578 | 580 |
  | 144,75 | 579 | 580 |

  Ohne Snap rückt das Sprite in Viertelpixeln vor, eine Figur gleitet also über das Raster. Mit Snap springt sie um ganze Spielpixel, ab ,5 wird aufgerundet. Im Modus `canvas_items` mit Snap ergab dieselbe Messung ebenfalls 576, 576, 580, 580.

  **Kameraglättung** (`position_smoothing_enabled`, Standard aus) lässt die Kamera der Figur hinterherziehen. Zusammen mit Snap zittert die Figur dann. Gemessen mit dem Prüfaufbau: Figur mit 90 px/s nach rechts, `Camera2D` als Kind, linke Kante der Figur in Pixeln des Spielbilds, Bild für Bild:

  ```text
  Glättung aus:  154 154 154 154 154 154 154 154
  Glättung an:   170 171 170 171 170 171 170 171
  ```

  Ohne Glättung steht die Figur still in der Mitte, und die Welt rückt abwechselnd um 2 und 1 Pixel weiter. Mit Glättung bleibt die Kamera rund 16 Pixel zurück. Godot rundet Kamera und Figur getrennt, ihr Abstand ist mal ein ganzer Pixel mehr, mal weniger, und die Figur springt jedes Bild hin und her. Die Doku warnt: Snap macht Bewegung weniger glatt, „especially when Camera2D smoothing is enabled“. Ob du Glättung willst, entscheidest du. Wenn ja, prüf sie in Bewegung, nicht im Standbild.

  > [!PRAXIS]
  > Leg eine Prüfszene ins Projekt: Muster, eine laufende Testfigur, sichtbares Raster. Starte sie auf jedem neuen Gerät und nach jeder Änderung an Projekteinstellungen oder Kamera. Ein Screenshot davon im Fehlerbericht oder in der Aufgabe für einen Coding-Agenten sagt mehr als „sieht unscharf aus“. Im [Abschlussmodul des Kurses](/godot/werkstatt-messen) gehören solche Einstellungen zur Fehlerkiste.

  > [!INTERVIEW]
  > „Unsere Pixelart sieht auf manchen Monitoren unscharf oder ungleichmäßig aus. Wie gehst du vor?“ Gute Antwort: Ich mache einen Screenshot mit einem Prüfmuster und schaue, welches Fehlerbild es ist. Grau statt Schwarz-Weiß heißt Filter `Linear` oder ein skaliertes Sprite. Ungleich breite Streifen heißen nicht ganzzahliger Faktor, Zoom oder Maßstab. Dann prüfe ich Stretch Mode, Scale Mode, Filter und Kamera-Zoom in `project.godot` und in der Szene und rechne für die betroffene Monitorgröße den Faktor nach.

  ## Häufige Fehler

  - **Neues 4.7-Projekt unverändert übernommen.** Es startet mit `canvas_items`, `expand` und Filter `Linear`. Pixelart wird weich. Prüfe `project.godot`, bevor du Grafiken beurteilst.
  - **Filter an jedem Sprite einzeln gesetzt.** Wer im Projekt `Linear` lässt und Sprites auf `Nearest` stellt, vergisst eins. Stell den Projektstandard um, Details in [Eigene Sprites importieren](/godot/sprites-importieren).
  - **`fractional` für ein Pixelart-Spiel.** Volle Fläche, aber Pixel mit 3 und 4 Bildschirmpixeln Breite.
  - **Ränder für einen Fehler gehalten.** Bei 1366 × 768 bleibt mit 320 × 180 immer ein Rand, auch mit `expand`. Das ist der Preis gleich großer Pixel.
  - **Kamera-Zoom oder `scale` mit Kommazahl.** Ungleiche Pixel trotz `integer`, denn der Scale Mode betrifft nur das Fenster, nicht die Kamera.
  - **Glättung im Standbild beurteilt.** Das Zittern um einen Pixel siehst du nur in Bewegung.

  ## Zusammenfassung

  - `viewport` zeichnet in Spielauflösung und vergrößert dann das ganze Bild ohne Farben zu mischen; `canvas_items` zeichnet jeden Node in Fenstergröße, dort entscheidet der Filter.
  - Neue Projekte starten in 4.7 mit `canvas_items` und `expand`; ohne Eintrag gelten `disabled` und `keep`.
  - Faktor = kleinere Division abgerundet, Rand = Rest durch zwei. 320 × 180 bei 1366 × 768: Faktor 4, Rand 43 und 24 Pixel.
  - `expand` zeigt mehr Welt, wenn das Seitenverhältnis abweicht. Den Rest aus dem Abrunden füllt es nicht.
  - Weich heißt Filter, ungleich breit heißt Faktor, Zoom oder Maßstab mit Kommazahl, verschiedene Pixelgrößen heißen Mixels.
  - Snap rundet Positionen auf ganze Spielpixel. Kameraglättung mit Snap lässt eine laufende Figur um einen Pixel zittern.
  - Die Spielauflösung und den Umgang mit Rändern, Drehung und Glättung entscheidest du; das Prüfmuster zeigt dir die Folgen.
exercises:
  - id: weiches-muster
    type: choice
    title: Grau statt Schwarz und Weiß
    prompt: |
      Ein Kollege schickt dir diesen Ausschnitt aus seinem Projekt. Das Prüfmuster liegt mit `scale` 1 in der Szene, die Kamera hat `zoom` 1. Welche Einstellungen erklären das Bild? Mehrere Antworten richtig.

      ![Prüfmuster mit verschwommenen Kanten: Das Schachbrett ist ein grau gepunktetes Feld, Streifen und Diagonalen haben graue Säume](/media/godot/pixelraster/diagnose-weich@2x.png "Godot 4.7.2, Ausschnitt aus einem Fenster mit 960 × 540, fünffach vergrößert")
    options:
      - text: Stretch Mode `canvas_items`
        correct: true
        why: In diesem Modus zeichnet Godot das Sprite direkt in Fenstergröße. Dabei wird es vergrößert, und der Filter bestimmt die Zwischenpixel.
      - text: Texturfilter `Linear` im Projekt oder am Node
        correct: true
        why: "`Linear` mischt die vier nächsten Texturpixel. Aus einem Schachbrett aus Einzelpixeln wird Grau."
      - text: Scale Mode `fractional`
        correct: false
        why: Ein nicht ganzzahliger Faktor macht Pixel ungleich breit, aber nicht weich. Hier sind alle Kanten verschwommen.
      - text: Stretch Mode `viewport` mit Filter `Nearest`
        correct: false
        why: Dann zeichnet Godot das Muster 1:1 und vergrößert das fertige Bild ohne Farbmischung. Gemessen bleiben es die vier Farben des Musters plus Hintergrund.
    explanation: |
      Weiche Kanten bei einem Sprite mit `scale` 1 entstehen, wenn das Sprite beim Zeichnen vergrößert wird und dabei gemischt wird. Das passiert im Modus `canvas_items` mit Filter `Linear`, dem Standard der Klasse. Im Modus `viewport` vergrößert Godot erst das fertige kleine Bild, und das mischt keine Farben. Das Bild ist mit `canvas_items`, `Linear` und Faktor 3 aufgenommen; der Ausschnitt hat 38 Farben statt 5 (vier im Muster, eine im Hintergrund).
    resources:
      - title: Godot Docs · Multiple resolutions · Stretch Mode
        url: https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#stretch-mode
      - title: Godot Docs · Viewport · DefaultCanvasItemTextureFilter
        url: https://docs.godotengine.org/en/stable/classes/class_viewport.html#class-viewport-constant-default-canvas-item-texture-filter-linear

  - id: mixel-erkennen
    type: choice
    title: Zwei Muster, zwei Fehler
    prompt: |
      Beide Muster stehen in derselben Szene: Stretch Mode `viewport`, Scale Mode `integer`, Filter `Nearest`, Faktor 4. Welche Aussagen treffen auf das rechte Muster zu? Mehrere Antworten richtig.

      ![Links ein Prüfmuster in Originalgröße, rechts ein größeres, bei dem die Streifen abwechselnd breit und schmal sind](/media/godot/pixelraster/diagnose-mixel@2x.png "Godot 4.7.2, Spielbild 320 × 180 siebenfach vergrößert")
    options:
      - text: Seine Pixel sind größer als die des linken Musters, das sind Mixels.
        correct: true
        why: Zwei Pixelgrößen in einem Bild sind die Definition von Mixels.
      - text: Sein `scale` ist keine ganze Zahl, deshalb sind die Streifen ungleich breit.
        correct: true
        why: Das Muster hat `scale` 1,5. Aus einem Texturpixel wird mal ein, mal zwei Spielpixel.
      - text: Der Texturfilter steht auf `Linear`.
        correct: false
        why: Dann wären Zwischenfarben zu sehen. Das Bild hat nur die vier Farben des Musters und den Hintergrund.
      - text: Das Fenster ist nicht ganzzahlig skaliert.
        correct: false
        why: Dann wäre auch das linke Muster ungleichmäßig. Das linke ist sauber, der Fehler sitzt im rechten Sprite.
    explanation: |
      Das rechte Muster hat `scale` 1,5. Damit trifft es zwei Fehlerbilder auf einmal: Seine Pixel sind größer als alle anderen (Mixels), und weil 1,5 nicht aufgeht, sind sie abwechselnd 1 und 2 Spielpixel breit. Das linke Muster im selben Bild zeigt, dass Fenster, Faktor und Filter stimmen. Ein Vergleichsobjekt mit `scale` 1 im selben Screenshot grenzt den Fehler auf einen Node ein.
    resources:
      - title: Godot Docs · Node2D.scale
        url: https://docs.godotengine.org/en/stable/classes/class_node2d.html#class-node2d-property-scale

  - id: weg-des-bildes
    type: order
    title: Der Weg eines Bildes im Modus viewport
    prompt: |
      Projekt mit 320 × 180, `viewport`, `integer` und Snap, Laptop mit 1366 × 768. Bring die Schritte in die Reihenfolge, in der aus einem Tastendruck ein Bild auf dem Monitor wird.
    lang: prose
    lines: |
      Die Eingabe „rechts“ kommt an
      _physics_process rechnet die neue Position der Figur, x = 144,25
      Godot zeichnet die Szene in das Bild mit 320 × 180 und rundet die Figur dabei auf x = 144
      Das fertige Bild wird um Faktor 4 auf 1280 × 720 vergrößert
      Godot setzt es mittig ins Fenster, links und rechts bleiben je 43 Pixel schwarz
      Der Monitor zeigt das Bild
    alternatives:
      - [1, 2, 3, 5, 4, 6]
    explanation: |
      Die Position bleibt eine Kommazahl; erst beim Zeichnen rundet Snap sie auf einen ganzen Spielpixel. Dann entsteht das kleine Bild, und erst das fertige Bild wird vergrößert. Was im Fenster übrig bleibt, wird Rand. Ob Godot erst vergrößert oder erst den Platz im Fenster festlegt, siehst du von außen nicht; deshalb gilt auch die Reihenfolge mit vertauschtem viertem und fünftem Schritt. Ein Fehler in der Szene (Zoom, `scale`, Drehung) entsteht im kleinen Bild, ein Fehler beim Faktor erst beim Vergrößern. Daran erkennst du später, wo du suchen musst.
    resources:
      - title: Godot Docs · Multiple resolutions · Stretch Mode
        url: https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#stretch-mode

  - id: faktor-1366
    type: output
    title: Faktor auf dem Laptop
    prompt: |
      Spielauflösung 320 × 180, Scale Mode `integer`, Laptop mit 1366 × 768 im Vollbild. Um welchen Faktor vergrößert Godot? Antworte mit der Zahl.
    lang: text
    code: |
      Spiel:      320 × 180
      Bildschirm: 1366 × 768
    expected: |
      4
    accept:
      - × 4
      - ×4
      - x4
      - 4x
      - 4×
      - 4 ×
      - x 4
      - Faktor 4
    explanation: |
      1366 / 320 = 4,27 und 768 / 180 = 4,27. Die kleinere Division abgerundet ist 4. Das Spielbild wird 1280 × 720 groß, gemessen mit Godot 4.7.2. Mit `fractional` wäre der Faktor 4,27, und die Pixel wären mal 4, mal 5 Bildschirmpixel breit.
    resources:
      - title: Godot Docs · Multiple resolutions · Stretch Scale Mode
        url: https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#stretch-scale-mode

  - id: rand-steam-deck
    type: output
    title: Rand auf dem Steam Deck
    prompt: |
      Spielauflösung 384 × 216, Scale Mode `integer`, Stretch Aspect `keep`, Bildschirm 1280 × 800. Wie viele Pixel ist der schwarze Rand **oben** hoch? Antworte mit der Zahl.
    lang: text
    code: |
      Spiel:      384 × 216
      Bildschirm: 1280 × 800
    expected: |
      76
    accept:
      - 76 px
      - 76px
      - 76 Pixel
    hints:
      - Rechne zuerst den Faktor aus beiden Richtungen und nimm den kleineren, abgerundet.
      - Das Bild ist 216 × Faktor hoch; der Rest verteilt sich auf oben und unten.
    explanation: |
      1280 / 384 = 3,33 und 800 / 216 = 3,70, also Faktor 3. Das Spielbild ist 1152 × 648 groß. Senkrecht bleiben 800 − 648 = 152 Pixel, also 76 oben und 76 unten; waagrecht 128, also 64 links und rechts. Bei 320 × 180 wären es Faktor 4 und nur oben und unten je 40 Pixel. Welche Auflösung du nimmst, entscheidet die Rechnung nicht, aber sie zeigt dir den Preis auf jedem Gerät.
    resources:
      - title: Godot Docs · Multiple resolutions · Stretch Scale Mode
        url: https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#stretch-scale-mode

  - id: sichtbare-flaeche
    type: output
    title: Wie viel Welt bei expand?
    prompt: |
      Projekt mit 320 × 180, Stretch Mode `viewport`, Scale Mode `integer`, Stretch Aspect `expand`. Das Fenster ist 1280 × 800 groß. Was gibt diese Zeile in Godot 4.7.2 aus?
    lang: gdscript
    code: |
      print(get_viewport().get_visible_rect().size)
    expected: |
      (320.0, 200.0)
    accept:
      - (320, 200)
      - (320,200)
      - (320.0,200.0)
      - 320 × 200
      - 320 x 200
      - 320x200
    hints:
      - Der Faktor bleibt 4, denn die Breite 1280 / 320 lässt nicht mehr zu.
      - "`expand` füllt die freie Höhe mit Spielpixeln statt mit Schwarz: 800 / 4."
    explanation: |
      Faktor 4 ergibt sich aus der Breite. Mit `keep` blieben oben und unten je 40 Pixel schwarz. `expand` lässt die Spielfläche stattdessen auf 800 / 4 = 200 Spielpixel Höhe wachsen. Der Spieler sieht 20 Zeilen mehr Welt, und ein HUD, das unten verankert ist, rückt mit. Gemessen mit Godot 4.7.2; bei 1366 × 768 liefert dieselbe Zeile `(320.0, 180.0)`, weil dort der Rest aus dem Abrunden kommt, nicht aus dem Seitenverhältnis.
    resources:
      - title: Godot Docs · Viewport.get_visible_rect
        url: https://docs.godotengine.org/en/stable/classes/class_viewport.html#class-viewport-method-get-visible-rect
      - title: Godot Docs · Multiple resolutions · Stretch Aspect
        url: https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#stretch-aspect

  - id: streifen-breite
    type: output
    title: Wie breit sind die Streifen?
    prompt: |
      Diese Aufnahme stammt aus einem Fenster mit 800 × 450, Spielauflösung 320 × 180, Stretch Mode `viewport`, Scale Mode `fractional`. Wie viele Bildschirmpixel breit sind die einzelnen Spielpixel? Nenne die beiden Breiten, die vorkommen, kleinere zuerst.

      ![Prüfmuster mit unregelmäßigen Streifen: manche Streifen sind schmaler als ihre Nachbarn](/media/godot/pixelraster/diagnose-streifen@2x.png "Godot 4.7.2, Ausschnitt aus dem Fenster 800 × 450, sechsfach vergrößert")
    lang: text
    code: |
      Fenster: 800 × 450
      Spiel:   320 × 180
      Faktor:  ?
    expected: |
      2 und 3
    accept:
      - 2, 3
      - 2 3
      - 2/3
      - 2 oder 3
      - 2–3
      - 2-3
      - 2 und 3 px
      - 2 und 3 Pixel
      - 2 und 3 Bildschirmpixel
    hints:
      - 800 / 320 = ?
      - Ein Bildschirm kennt keine halben Pixel. Wie verteilt sich ein Faktor mit ,5 auf zwei Nachbarpixel?
    explanation: |
      800 / 320 = 2,5. Zwei Spielpixel nebeneinander müssen 5 Bildschirmpixel füllen, also wird einer 2 und einer 3 breit. Gemessen an der Aufnahme wechseln sich 2 und 3 ab. Mit `integer` wäre der Faktor 2 und das Bild 640 × 360 mit Rand, aber alle Pixel gleich.
    resources:
      - title: Godot Docs · ProjectSettings · display/window/stretch/scale_mode
        url: https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-display-window-stretch-scale-mode

  - id: stretch-zeilen
    type: gap
    title: Ränder statt mehr Welt
    prompt: |
      Ergänze die Zeilen, die du von Hand in `project.godot` einträgst: Godot soll das fertige Spielbild vergrößern, nur um ganze Faktoren skalieren und bei abweichendem Seitenverhältnis schwarze Ränder zeigen statt mehr Welt.
    lang: ini
    code: |
      [display]

      window/size/viewport_width=320
      window/size/viewport_height=180
      window/stretch/mode="⟦viewport⟧"
      window/stretch/aspect="⟦keep⟧"
      window/stretch/scale_mode="⟦integer⟧"
    gaps:
      - label: Stretch Mode
        hint: Erst klein zeichnen, dann das ganze Bild vergrößern.
      - label: Stretch Aspect
        hint: Seitenverhältnis halten, Rest schwarz.
      - label: Scale Mode
        hint: Der Faktor wird abgerundet.
    explanation: |
      `viewport` zeichnet in 320 × 180 und vergrößert das fertige Bild. `keep` hält Breite und Höhe der Spielfläche fest und füllt den Rest schwarz. `integer` rundet den Faktor ab. `keep` ist der Standard der Klasse; speichert Godot die Projekteinstellungen, verschwindet die Zeile deshalb wieder, gemessen mit Godot 4.7.2. Fehlt sie, gilt trotzdem `keep`. Ein neues 4.7-Projekt schreibt dagegen `expand` hinein, und diese Zeile bleibt stehen. Die Werte für Breite und Höhe sind die Platzhalter des Testgeländes.
    resources:
      - title: Godot Docs · ProjectSettings · display/window/stretch/aspect
        url: https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-display-window-stretch-aspect

  - id: kamera-zoom-finden
    type: bug
    title: Das Schachbrett hat Löcher
    prompt: |
      Im Spiel sieht das Prüfmuster so aus, obwohl `project.godot` `viewport`, `integer` und Filter `Nearest` enthält und das Sprite `scale` 1 hat. Hier ist der Ausschnitt aus `main.tscn`. Finde die Zeile, die das Bild erklärt.

      ![Prüfmuster mit grobem, löchrigem Schachbrett, verschieden breiten Streifen und unterbrochenen Diagonalen](/media/godot/pixelraster/diagnose-zoom@2x.png "Godot 4.7.2, Ausschnitt aus dem Spielbild 320 × 180, 18-fach vergrößert")
    lang: ini
    code: |
      [node name="Pattern" type="Sprite2D" parent="."]
      position = Vector2(200, 100)
      texture = ExtResource("1_lbr83")
      centered = false

      [node name="Camera2D" type="Camera2D" parent="."]
      anchor_mode = 0
      zoom = Vector2(0.75, 0.75)
    lines: [8]
    explanation: |
      Mit `zoom` 0,75 wird die Welt im kleinen Bild auf drei Viertel verkleinert. Aus 32 Texturpixeln werden 24 Spielpixel; jedes vierte Texturpixel fällt weg, das Schachbrett bekommt Lücken, und Streifen verschmelzen. Der Scale Mode `integer` hilft nicht, er betrifft nur das Fenster. Gleichmäßig bleiben Pixel bei ganzzahligem Zoom wie 1 oder 2. Welcher Ausschnitt der Welt zu deinem Spiel passt, entscheidest du; gemessen ist hier nur, was ein Zoom mit Kommazahl mit dem Raster macht.
    resources:
      - title: Godot Docs · Camera2D.zoom
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-zoom

  - id: gleiten-statt-springen
    type: bug
    title: Die Figur gleitet in Viertelpixeln
    prompt: |
      Ein KI-Agent hat das Projekt aufgesetzt. Die Kanten der Figur sind scharf, aber beim langsamen Laufen rückt sie in Schritten weiter, die kleiner sind als ein Pixel ihrer Grafik; neben der Wand sieht man sie halb über der Fuge. Finde die Zeile und korrigiere sie.
    lang: ini
    code: |
      [display]

      window/size/viewport_width=320
      window/size/viewport_height=180
      window/stretch/mode="canvas_items"
      window/stretch/scale_mode="integer"

      [rendering]

      textures/canvas_textures/default_texture_filter=0
    lines: [5]
    fix:
      - line: 5
        answers:
          - window/stretch/mode="viewport"
    explanation: |
      Im Modus `canvas_items` zeichnet Godot in Fenstergröße. Gemessen rückt ein Sprite bei Faktor 4 dann um je einen Bildschirmpixel weiter, wenn sich `position.x` um 0,25 ändert, also in Viertelpixeln der Grafik. Der Filter `Nearest` hält die Kanten scharf, verhindert das aber nicht. Mit `viewport` entsteht das Bild in 320 × 180, und eine Position kann nur auf ganzen Spielpixeln landen. Snap (`rendering/2d/snap/snap_2d_transforms_to_pixel=true`) hätte das Gleiten hier ebenfalls beseitigt; gedrehte und skalierte Sprites zeichnet `canvas_items` aber weiter in Fensterauflösung.
    resources:
      - title: Godot Docs · ProjectSettings · display/window/stretch/mode
        url: https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-display-window-stretch-mode

  - id: zittern-erklaeren
    type: explain
    title: Warum zittert die Figur?
    prompt: |
      Die Figur läuft mit 90 px/s nach rechts, die `Camera2D` hängt als Kind an ihr, Pixel-Snap ist an. Gemessen wurde die linke Kante der Figur im Spielbild, Bild für Bild. Erkläre in wenigen Sätzen, woher der Unterschied kommt.
    lang: text
    code: |
      position_smoothing_enabled = false
      154 154 154 154 154 154 154 154

      position_smoothing_enabled = true
      170 171 170 171 170 171 170 171
    points:
      - Ohne Glättung bewegt sich die Kamera genau mit der Figur; die Figur bleibt an derselben Stelle im Bild, nur die Welt rückt.
      - Mit Glättung hinkt die Kamera hinterher; der Abstand zwischen Kamera und Figur ist eine Kommazahl.
      - Godot rundet Kamera und Figur getrennt auf ganze Pixel; je nach Nachkommastelle ergibt das mal 170, mal 171.
      - Bei 1,5 px pro Frame wechselt das jedes Bild, das Auge sieht ein Zittern; im Standbild fällt es nicht auf.
    explanation: |
      Ohne Glättung ist die Kamera an die Figur gekoppelt, beide haben dieselbe Position, und die Figur steht immer bei 154. Mit Glättung zieht die Kamera mit Abstand hinterher, im Messlauf rund 16 Pixel. Snap rundet die Figur und die Kamera jeweils für sich. Weil die Figur 1,5 Pixel pro Frame läuft, wechseln die Nachkommastellen jedes Bild, und die gerundete Differenz springt zwischen 16 und 17. Die Doku nennt diesen Fall bei Snap ausdrücklich. Ob du Glättung nutzt, entscheidest du; wenn ja, beurteile sie in Bewegung.
    resources:
      - title: Godot Docs · ProjectSettings · snap_2d_transforms_to_pixel
        url: https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-rendering-2d-snap-snap-2d-transforms-to-pixel
      - title: Godot Docs · Camera2D.position_smoothing_enabled
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-position-smoothing-enabled

  - id: aufloesung-notieren
    type: practice
    title: Deine Bildschirme, deine Rechnung
    prompt: |
      Schreib eine kurze Notiz für dein Spiel, 3 bis 5 Sätze. Nimm eine oder zwei Spielauflösungen, die du für deine Pixelart in Betracht ziehst, und die Bildschirme, auf denen du testen wirst (dein Monitor, ein Laptop, gern das Steam Deck). Rechne für jede Kombination Faktor und Rand aus. Notiere dazu, ob du `keep` oder `expand` ausprobieren willst und woran du es beurteilen wirst. Eine richtige Auflösung gibt es hier nicht.
    lang: prose
    checklist:
      - Die Notiz nennt mindestens eine Spielauflösung als Platzhalter, die du gewählt hast.
      - Für jeden genannten Bildschirm stehen Faktor und Rand in Pixeln da, nach der Formel aus der Lektion.
      - Du hast notiert, ob du `keep` oder `expand` testen willst und was du dabei prüfst (Rand, sichtbare Fläche, HUD).
      - Du hast festgehalten, mit welchem Prüfmuster oder Screenshot du das Ergebnis auf dem Gerät kontrollierst.
    hints:
      - "Faktor = abrunden(min(Bildschirmbreite / Spielbreite, Bildschirmhöhe / Spielhöhe))."
      - Wenn du noch keine Auflösung hast, nimm zwei Kandidaten und vergleiche sie auf denselben Bildschirmen.
    explanation: |
      Die Notiz trennt Rechnung und Entscheidung. Faktor und Rand liegen fest, sobald Auflösung und Bildschirm feststehen; ob dich ein Rand von 43 Pixeln stört, ob breitere Bildschirme mehr Welt zeigen sollen und wie groß deine Pixel werden, entscheidest du. Mit der Notiz kannst du einem Coding-Agenten genau sagen, was er in `project.godot` einstellen soll, und später nachsehen, warum.
    resources:
      - title: Godot Docs · Multiple resolutions · Desktop game
        url: https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#desktop-game
