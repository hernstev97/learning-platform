id: projekt-erkunden
title: Ein fremdes Projekt erkunden und das Testgelände aufbauen
level: 1
minutes: 160
summary: Ein festes Vorgehen, um ein Godot-Projekt zu verstehen, das jemand anderes gebaut hat. Du übst es am Testgelände, das du aus Textdateien selbst anlegst und auf dem die späteren Module aufbauen.
place: pc
goals:
  - Du erkundest ein fremdes Projekt in festen Schritten, von `project.godot` bis zum laufenden Spiel.
  - Du legst das Testgelände aus Textdateien an und richtest die Eingabeaktionen in der Eingabe-Zuordnung ein.
  - Du liest echte Fehlermeldungen und findest über den GDScript-Backtrace die Zeile, die sie auslöst.
  - Du untersuchst das laufende Spiel im Remote-Baum und im Remote-Inspektor und weißt, was davon erhalten bleibt.
  - Du findest Verbindungen, Gruppen und Signale im Editor und im Terminal.
  - Du beschreibst ein Projekt als Projektkarte in eigenen Worten.
