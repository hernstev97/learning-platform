lesson: |
  Ein Coding-Agent hat dir ein Projekt gebaut, oder du lädst ein Beispielprojekt herunter. Bevor du irgendeinen Wert änderst, willst du wissen: Was startet? Woraus besteht es? Wo stehen die Werte, und wer reagiert auf wen? Wer drauflos klickt, ändert schnell die Vorlage statt einer Instanz oder sucht eine Verbindung im falschen Dock.

  Dieses Modul gibt dir dafür ein festes Vorgehen und übt es am **Testgelände**, das du hier aus Textdateien anlegst. Die späteren Module des Kurses bauen darauf auf: Sprites, Animationen, Töne, Tiles und Messungen hängen an genau diesem Projekt. Du brauchst Godot 4.7.2 am PC ([Godot-Start](/combat/godot-start)) und einen Texteditor. Docks, Dateien und Szenenbäume kennst du aus [Der Editor als Werkstatt](/godot/editor-anatomie), [Szenenbäume lesen](/godot/szenenbaum) und [Instanzen und Ressourcen](/godot/instanzen-ressourcen).

  ## Vorgehen: in sieben Schritten zur Projektkarte

  1. **`project.godot` lesen.** Hauptszene (`run/main_scene`), Autoloads (`[autoload]`), Eingabeaktionen (`[input]`), die Namen der Kollisionsebenen (`[layer_names]`, in den Projekteinstellungen unter *Ebenen-Namen*). Die Abschnitte zeigt dir ein Befehl auf einen Blick, hier für das Testgelände direkt nach dem Anlegen:

     ```console
     $ grep -n "^\[" project.godot
     3:[application]
     9:[display]
     18:[layer_names]
     24:[rendering]
     ```

  2. **Starten und zusehen.** F5 startet die Hauptszene. Achte auf das untere Panel: `print()`-Zeilen erscheinen unter *Ausgabe*, Fehler des Spiels im *Debugger*.
  3. **Hauptszene öffnen und den Baum lesen.** Sie steht im Dateisystem-Dock in Blau. Instanzen folgst du über die Filmklappe „Im Editor öffnen“.
  4. **Skripte überfliegen.** `class_name` zeigt eigene Typen, `signal` die Ereignisse, `@export` die Werte, die im Inspektor einstellbar sind:

     ```console
     $ grep -rn --include="*.gd" -e class_name -e "^signal" -e @export .
     ./movement_stats.gd:1:class_name MovementStats
     ./movement_stats.gd:6:@export_range(0, 400, 1, "suffix:px/s") var max_speed := 90.0
     ./movement_stats.gd:7:@export_range(0, 5000, 10, "suffix:px/s²") var acceleration := 600.0
     ./movement_stats.gd:8:@export_range(0, 5000, 10, "suffix:px/s²") var friction := 900.0
     ./player.gd:1:class_name Player
     ./player.gd:6:signal collected(total: int)
     ./player.gd:8:@export var stats: MovementStats
     ./player.gd:9:@export var debug_log := false
     ./pickup.gd:5:@export var value := 1
     ```

     Die Reihenfolge der Dateien kann bei dir anders sein; `grep` liest sie in der Reihenfolge des Dateisystems.
  5. **Verbindungen und Gruppen prüfen**, im Signale-Dock und im Gruppen-Dock.
  6. **Suchen**, mit *Projekt → In Dateien suchen …* (Strg + Umschalt + F) oder im Terminal.
  7. **Zur Laufzeit hineinsehen**, im Remote-Baum und im Remote-Inspektor.

  Das Ergebnis schreibst du als **Projektkarte** auf: welche Szene startet, welche Szenen sie einsetzt, wo die Werte liegen, welche Signale welche Reaktion auslösen. Das ist die letzte Übung dieses Moduls.

  > [!PRAXIS]
  > Lass dir von einem Agenten zu jedem größeren Umbau eine kurze Projektkarte schreiben und vergleiche sie mit dem, was du im Editor siehst. Weicht etwas ab, hat entweder die Karte oder das Projekt einen Fehler. Beides willst du wissen, bevor du abstimmst.

  ## Das Testgelände anlegen

  Das Testgelände ist absichtlich neutral: ein Rechteck als Figur, eine Kiste, drei Sammelstücke, ein Zähler. Alle Werte sind Platzhalter. Leg den Ordner `~/godot/testgelaende` mit dem Unterordner `data` an und darin diese zehn Dateien mit genau diesem Inhalt. Die Skripte sind mit Tabs eingerückt. Leerzeichen gingen auch, aber nicht gemischt in einer Datei; dann meldet Godot `Parse Error: Used space character for indentation instead of tab as used before in the file.` Achte beim Kopieren darauf, dass dein Editor die Tabs nicht umwandelt.

  **`project.godot`** (ohne `[input]`, die Aktionen legst du gleich im Editor an):

  ```ini
  config_version=5

  [application]

  config/name="Testgelände"
  run/main_scene="res://main.tscn"
  config/features=PackedStringArray("4.7", "GL Compatibility")

  [display]

  window/size/viewport_width=320
  window/size/viewport_height=180
  window/size/window_width_override=1280
  window/size/window_height_override=720
  window/stretch/mode="viewport"
  window/stretch/scale_mode="integer"

  [layer_names]

  2d_physics/layer_1="world"
  2d_physics/layer_2="player"
  2d_physics/layer_3="pickups"

  [rendering]

  textures/canvas_textures/default_texture_filter=0
  renderer/rendering_method="gl_compatibility"
  renderer/rendering_method.mobile="gl_compatibility"
  2d/snap/snap_2d_transforms_to_pixel=true
  ```

  **`main.tscn`**, die Hauptszene:

  ```ini
  [gd_scene format=3]

  [ext_resource type="PackedScene" path="res://player.tscn" id="1"]
  [ext_resource type="PackedScene" path="res://crate.tscn" id="2"]
  [ext_resource type="PackedScene" path="res://pickup.tscn" id="3"]
  [ext_resource type="Script" path="res://hud.gd" id="4"]

  [node name="Main" type="Node2D"]

  [node name="Floor" type="ColorRect" parent="."]
  offset_left = -200.0
  offset_top = -120.0
  offset_right = 200.0
  offset_bottom = 120.0
  color = Color(0.22, 0.3, 0.22, 1)

  [node name="Objects" type="Node2D" parent="."]
  y_sort_enabled = true

  [node name="Player" parent="Objects" instance=ExtResource("1")]

  [node name="Crate" parent="Objects" instance=ExtResource("2")]
  position = Vector2(40, 10)

  [node name="Pickup" parent="Objects" instance=ExtResource("3")]
  position = Vector2(-50, -20)

  [node name="Pickup2" parent="Objects" instance=ExtResource("3")]
  position = Vector2(-70, 30)

  [node name="Pickup3" parent="Objects" instance=ExtResource("3")]
  position = Vector2(70, 40)

  [node name="HUD" type="CanvasLayer" parent="."]
  script = ExtResource("4")

  [node name="Counter" type="Label" parent="HUD"]
  offset_left = 4.0
  offset_top = 2.0
  offset_right = 44.0
  offset_bottom = 18.0
  text = "0"

  [connection signal="collected" from="Objects/Player" to="HUD" method="show_total"]
  ```

  **`player.tscn`**, die Figur mit Fußform und Kamera:

  ```ini
  [gd_scene format=3]

  [ext_resource type="Script" path="res://player.gd" id="1"]
  [ext_resource type="Resource" path="res://data/player_stats.tres" id="2"]

  [sub_resource type="RectangleShape2D" id="feet"]
  size = Vector2(10, 6)

  [node name="Player" type="CharacterBody2D"]
  collision_layer = 2
  collision_mask = 1
  motion_mode = 1
  script = ExtResource("1")
  stats = ExtResource("2")

  [node name="Body" type="Polygon2D" parent="."]
  color = Color(0.35, 0.65, 0.95, 1)
  polygon = PackedVector2Array(-6, -16, 6, -16, 6, 0, -6, 0)

  [node name="Feet" type="CollisionShape2D" parent="."]
  position = Vector2(0, -3)
  shape = SubResource("feet")

  [node name="Camera2D" type="Camera2D" parent="."]
  ```

  **`crate.tscn`**, ein festes Hindernis:

  ```ini
  [gd_scene format=3]

  [sub_resource type="RectangleShape2D" id="base"]
  size = Vector2(16, 8)

  [node name="Crate" type="StaticBody2D"]
  collision_mask = 0

  [node name="Body" type="Polygon2D" parent="."]
  color = Color(0.6, 0.45, 0.3, 1)
  polygon = PackedVector2Array(-8, -16, 8, -16, 8, 0, -8, 0)

  [node name="Base" type="CollisionShape2D" parent="."]
  position = Vector2(0, -4)
  shape = SubResource("base")
  ```

  **`pickup.tscn`**, ein Sammelstück:

  ```ini
  [gd_scene format=3]

  [ext_resource type="Script" path="res://pickup.gd" id="1"]

  [sub_resource type="CircleShape2D" id="area"]
  radius = 5.0

  [node name="Pickup" type="Area2D"]
  collision_layer = 4
  collision_mask = 2
  monitorable = false
  script = ExtResource("1")

  [node name="Body" type="Polygon2D" parent="."]
  color = Color(0.95, 0.8, 0.2, 1)
  polygon = PackedVector2Array(0, -10, 4, -5, 0, 0, -4, -5)

  [node name="Area" type="CollisionShape2D" parent="."]
  position = Vector2(0, -5)
  shape = SubResource("area")

  [connection signal="body_entered" from="." to="." method="_on_body_entered"]
  ```

  **`player.gd`**:

  ```gdscript
  class_name Player
  extends CharacterBody2D

  ## Figur des Testgeländes: läuft analog in alle Richtungen und sammelt ein.

  signal collected(total: int)

  @export var stats: MovementStats
  @export var debug_log := false

  var total := 0
  var facing := Vector2.DOWN


  func _physics_process(delta: float) -> void:
  	var input := Input.get_vector(&"move_left", &"move_right", &"move_up", &"move_down")
  	var rate := stats.acceleration if input != Vector2.ZERO else stats.friction
  	velocity = velocity.move_toward(input * stats.max_speed, rate * delta)
  	if input != Vector2.ZERO:
  		facing = input
  	move_and_slide()
  	if debug_log:
  		print(Engine.get_physics_frames(), "  speed ", snappedf(velocity.length(), 0.1))


  func collect(value: int) -> void:
  	total += value
  	collected.emit(total)
  ```

  **`movement_stats.gd`**:

  ```gdscript
  class_name MovementStats
  extends Resource

  ## Bewegungswerte der Figur. Platzhalter: Die echten Werte bestimmst du.

  @export_range(0, 400, 1, "suffix:px/s") var max_speed := 90.0
  @export_range(0, 5000, 10, "suffix:px/s²") var acceleration := 600.0
  @export_range(0, 5000, 10, "suffix:px/s²") var friction := 900.0
  ```

  **`pickup.gd`**:

  ```gdscript
  extends Area2D

  ## Sammelstück: meldet sich bei der Figur und verschwindet.

  @export var value := 1


  func _on_body_entered(body: Node2D) -> void:
  	if body is Player:
  		body.collect(value)
  		queue_free()
  ```

  **`hud.gd`**:

  ```gdscript
  extends CanvasLayer

  ## Zeigt, wie viele Sammelstücke die Figur hat.

  @onready var counter: Label = $Counter


  func show_total(total: int) -> void:
  	counter.text = str(total)
  ```

  **`data/player_stats.tres`**:

  ```ini
  [gd_resource type="Resource" script_class="MovementStats" format=3]

  [ext_resource type="Script" path="res://movement_stats.gd" id="1"]

  [resource]
  script = ExtResource("1")
  max_speed = 90.0
  acceleration = 600.0
  friction = 900.0
  ```

  Öffne das Projekt mit `godot -e --path ~/godot/testgelaende` oder im Projektmanager über *Importieren*. Beim ersten Öffnen legt Godot `.godot/` und die `.uid`-Dateien an. Die Szenen sind von Hand geschrieben und haben weder `uid` noch `unique_id`; beides ergänzt der Editor beim ersten Speichern. Leg das Projekt deshalb vorher in Git an ([Git-Einstieg](/git/git-einstieg), `.godot/` gehört nicht hinein), dann siehst du diesen Diff getrennt von deinen eigenen Änderungen.

  Was die Teile tun, in einem Satz je Datei: `player.gd` beschleunigt die Figur mit `move_toward()` auf `stats.max_speed` und bremst mit `stats.friction`. `pickup.gd` ruft beim Betreten `collect()` an der Figur auf und löscht sich mit `queue_free()`. `collect()` zählt hoch und sendet `collected`, und `main.tscn` verbindet dieses Signal mit `show_total()` in `hud.gd`. Die Kiste ist ein `StaticBody2D` auf Ebene 1, gegen den die Figur läuft; Ebenen und Masken erklärt das [Modul zu Kollisionsebenen](/godot/kollision-ebenen).

  ## Eingabeaktionen in der Eingabe-Zuordnung

  Starte das Projekt jetzt mit F5, bevor du Aktionen anlegst. Die Figur steht still, und neben *Debugger* erscheint eine rote Zahl, die schnell wächst. Im Terminal gestartet sieht der Anfang so aus:

  ```text
  ERROR: The InputMap action "move_down" doesn't exist. Did you mean "ui_down"?
     at: get_action_raw_strength (core/input/input.cpp:553)
     GDScript backtrace (most recent call first):
         [0] _physics_process (res://player.gd:16)
  ERROR: The InputMap action "move_up" doesn't exist. Did you mean "ui_up"?
     at: get_action_raw_strength (core/input/input.cpp:553)
     GDScript backtrace (most recent call first):
         [0] _physics_process (res://player.gd:16)
  ```

  So liest du eine Godot-Fehlermeldung: Die Zeile mit `ERROR:` sagt, was schiefging. `at:` nennt die Stelle in Godots C++-Quelltext, die dir selten hilft. Der **GDScript-Backtrace** nennt deine Datei und Zeile, hier `player.gd:16`, den Aufruf von `Input.get_vector()`. „Did you mean“ schlägt einen ähnlichen Namen vor. Die Meldung kommt in jedem Physik-Frame neu, deshalb wächst die Zahl am Debugger so schnell:

  ![Unteres Panel des Editors: Reiter Ausgabe, Debugger mit roter Zahl 3335, Audio, Animation, Shader-Editor](/media/godot/projekt-erkunden/debugger-zaehler@2x.png "Godot 4.7.2, Testgelände ohne Eingabeaktionen nach einigen Sekunden")

  Jetzt die Aktionen. Öffne *Projekt → Projekteinstellungen …* und den Reiter **Eingabe-Zuordnung** (Input Map). Trag in das Feld „Neue Aktion hinzufügen“ `move_left` ein und klick *Hinzufügen*. Das `+` rechts neben der Aktion öffnet den Dialog für ein Ereignis. Drück im Feld „Warte auf Eingabe“ die Taste A. Unter *Zusätzliche Einstellungen* steht danach „Tastencode (Lateinäquivalent)“; stell es auf *Physischer Tastencode (Position auf der US-QWERTY-Tastatur)* und bestätige mit OK.

  ![Dialog für ein neues Ereignis nach dem Druck auf A: oben „A or A (Physisch)“, unten unter Zusätzliche Einstellungen die Auswahl „Tastencode (Lateinäquivalent)“, darunter OK und Abbrechen](/media/godot/projekt-erkunden/ereignis-dialog@2x.png "Godot 4.7.2, Ereignis-Dialog der Eingabe-Zuordnung, Voreinstellung vor dem Umstellen")

  Füg danach die Pfeiltaste links hinzu, ebenfalls als physischen Tastencode, und unter *Joypad-Achsen* den Eintrag mit „Linker Stick links, Joystick 0 links“. Dasselbe für `move_right` (D, Pfeil rechts, Stick rechts), `move_up` (W, Pfeil hoch, Stick hoch) und `move_down` (S, Pfeil runter, Stick runter). Die Totzone bleibt auf 0.2 ([Input examples](https://docs.godotengine.org/en/stable/tutorials/inputs/input_examples.html)).

  ![Projekteinstellungen, Reiter Eingabe-Zuordnung: Aktionen move_left, move_right, move_up, move_down mit Totzone 0.2, darunter je eine Buchstabentaste und eine Pfeiltaste als „Physisch“ und eine Joypad-Achse des linken Sticks für alle Geräte](/media/godot/projekt-erkunden/eingabe-zuordnung@2x.png "Godot 4.7.2, Projekteinstellungen → Eingabe-Zuordnung im Testgelände")

  Der physische Tastencode meint die Position der Taste, nicht ihre Beschriftung. Warum das auf einer deutschen Tastatur zählt und was Totzonen bewirken, steht im [Modul zu Eingabeaktionen und Parametern](/godot/aktionen-parameter). Nach dem Schließen steht in `project.godot` ein Abschnitt `[input]` mit vier Einträgen `move_left={ … }` und so weiter. Godot schreibt die Datei dabei neu und setzt seinen Kommentarkopf davor.

  ## Starten, prüfen, Ausgaben lesen

  F5 noch einmal. Die Figur läuft mit Tastatur und Stick in alle Richtungen, die Kamera folgt ihr, und jedes eingesammelte Stück zählt den Zähler um eins hoch. Für Messungen schaltest du `Debug Log` im Inspektor der Figur ein, in `player.tscn` für alle oder als Override an der Instanz in `main.tscn`. Dann schreibt `player.gd` in jedem Physik-Frame die Framenummer und das Tempo in die Ausgabe. Ein Lauf, in dem Pfeil rechts von Frame 1 bis 12 gedrückt war (Ausschnitt):

  ```text
  1  speed 10.0
  2  speed 20.0
  3  speed 30.0
  …
  9  speed 90.0
  10  speed 90.0
  …
  13  speed 75.0
  14  speed 60.0
  ```

  Im Editor sind die Framenummern größer, weil das Spiel schon läuft, bevor du drückst. Was diese Zahlen über die Platzhalterwerte verraten, rechnest du im [Modul zu Eingabeaktionen und Parametern](/godot/aktionen-parameter) nach.

  > [!MERKE]
  > Lies den Backtrace von oben: Der oberste Eintrag `[0]` ist die Zeile, in der der Fehler auftrat, die Einträge darunter zeigen, wer sie aufgerufen hat.

  ## Zur Laufzeit hineinsehen: Remote-Baum und Remote-Inspektor

  Während das Spiel läuft, hat das Szenen-Dock oben zwei Knöpfe: **Lokal** zeigt die Szene, wie sie gespeichert ist, **Remote** den Baum des laufenden Spiels ([Overview of debugging tools](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html)). Der Remote-Baum beginnt bei `root` und zeigt die Instanzen aufgeklappt, mit `Body`, `Feet` und `Camera2D` unter `Player`:

  ![Szenen-Dock im Remote-Modus: root, darunter Main mit Floor, Objects, Player mit Body, Feet, Camera2D, Crate mit Body und Base, Pickup mit Body und Area](/media/godot/projekt-erkunden/remote-baum@2x.png "Godot 4.7.2, Remote-Baum des laufenden Testgeländes")

  Wählst du dort `Player`, zeigt der Inspektor das laufende Objekt; oben steht „Remote-Player“ mit einer Objektnummer. Ganz oben unter *Members* stehen auch Variablen, die nicht exportiert sind, hier `total` und `facing`:

  ![Remote-Inspektor der Figur: Abschnitt Members mit Total 0 und Facing (0, 1), darunter Node mit Path, dann Player mit Stats und Debug Log und CharacterBody2D](/media/godot/projekt-erkunden/remote-inspektor@2x.png "Godot 4.7.2, Remote-Inspektor von Player im laufenden Spiel")

  Das ist dein Elements-Panel aus den DevTools. Und wie dort gilt: Änderst du hier einen Wert, wirkt er sofort und ist nach dem Beenden weg ([Game embedding](https://docs.godotengine.org/en/stable/tutorials/editor/game_embedding.html#doc-game-embedding-interaction-mode)). Gefällt dir ein Wert, trägst du ihn danach im lokalen Inspektor oder in der `.tres` ein. Sammelst du ein Stück ein, verschwindet es aus dem Remote-Baum, weil `pickup.gd` es mit `queue_free()` löscht ([Node.queue_free](https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-method-queue-free)).

  > [!WARNING] Remote kostet Zeit
  > Der Tooltip des Remote-Knopfs warnt: Solange der Remote-Baum offen ist, bringt jede Aktualisierung das Projekt zum Ruckeln. Schalt auf *Lokal* zurück, bevor du Bildrate oder Timing beurteilst.

  ## Verbindungen, Gruppen und die Suche

  Das **Signale-Dock** listet für den gewählten Node alle Signale, gegliedert nach Klassen, und darunter ihre Verbindungen:

  ![Signale-Dock mit gewähltem Player: Signal collected(total: int), darunter die Verbindung ../../HUD :: show_total](/media/godot/projekt-erkunden/signale-dock@2x.png "Godot 4.7.2, Signale-Dock für Player in main.tscn")

  `../../HUD :: show_total` heißt: Empfänger ist der Node zwei Ebenen höher und dann `HUD`, aufgerufen wird `show_total`. Wählst du `Pickup`, steht dort `body_entered` mit einer Verbindung zu `_on_body_entered` am Pickup selbst; sie stammt aus `pickup.tscn`. Zusammen ergibt sich die Kette, die den Zähler bewegt:

  ```text
  Pickup.body_entered      Signal, verbunden in pickup.tscn
  → Pickup._on_body_entered(body)
  → Player.collect(value)  direkter Aufruf im Code
  → Player.collected       Signal, verbunden in main.tscn
  → HUD.show_total(total)
  → Counter.text
  ```

  Der mittlere Schritt ist ein gewöhnlicher Methodenaufruf und steht in keinem Dock, nur im Code. Ein Signal entspricht einem Event mit Callback im Web; anders als dort liegt die Verbindung oft in der Szene statt im Code ([Using signals](https://docs.godotengine.org/en/stable/getting_started/step_by_step/signals.html)).

  **Gruppen** sind Etiketten für Nodes, ähnlich einer CSS-Klasse, über die Code alle Mitglieder auf einmal findet ([Groups](https://docs.godotengine.org/en/stable/tutorials/scripting/groups.html)). Das Testgelände hat keine. Fügst du im Gruppen-Dock die Wurzel von `pickup.tscn` der Gruppe `pickups` hinzu, steht ihre Kopfzeile danach so in der Datei: `[node name="Pickup" type="Area2D" groups=["pickups"]]`, in 4.7.2 gespeichert zusätzlich mit `unique_id`. Weil die Gruppe an der Vorlage hängt, gehören alle drei Instanzen dazu, und `get_tree().get_nodes_in_group(&"pickups")` liefert alle drei ([SceneTree.get_nodes_in_group](https://docs.godotengine.org/en/stable/classes/class_scenetree.html#class-scenetree-method-get-nodes-in-group)).

  **Suchen.** *In Dateien suchen* durchsucht in 4.7.2 standardmäßig nur `.gd`- und `.gdshader`-Dateien; so steht es in der Projekteinstellung `editor/script/search_in_file_extensions` ([ProjectSettings](https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-editor-script-search-in-file-extensions)). Verbindungen in `.tscn`-Dateien findet die Suche deshalb nicht. Im Terminal schon:

  ```console
  $ grep -rn collected --exclude-dir=.godot .
  ./player.gd:6:signal collected(total: int)
  ./player.gd:28:	collected.emit(total)
  ./main.tscn:44:[connection signal="collected" from="Objects/Player" to="HUD" method="show_total"]
  ```

  > [!INTERVIEW]
  > „Du übernimmst ein Godot-Projekt, das du nicht kennst. Was machst du in der ersten Stunde?“ Gute Antwort: Ich lese `project.godot` auf Hauptszene, Autoloads, Aktionen und Ebenen, starte das Spiel und schaue in Ausgabe und Debugger. Dann folge ich dem Baum der Hauptszene in die Instanzen, überfliege die Skripte nach `class_name`, `signal` und `@export` und prüfe Verbindungen im Signale-Dock und per `grep` in den Szenen. Zum Schluss sehe ich im Remote-Baum nach, was zur Laufzeit existiert, und schreibe mir eine Projektkarte, bevor ich etwas ändere.

  ## Häufige Fehler

  - **Aktion fehlt oder ist vertippt.** Die Figur steht, der Debugger zählt in jedem Frame einen Fehler. „Did you mean“ nennt oft den vertippten Namen.
  - **Signal mit falscher Zahl von Argumenten gesendet.** `Method expected 1 argument(s), but called with 0.` Sender und Empfänger müssen gleich viele Werte erwarten.
  - **Im Remote-Inspektor abgestimmt und nichts übertragen.** Nach dem Beenden ist der Wert weg. Schreib ihn sofort in den lokalen Inspektor oder die `.tres`.
  - **Remote-Baum offen beim Messen.** Er bringt das Spiel zum Ruckeln. Vor Messungen auf Lokal schalten.
  - **Verbindung mit *In Dateien suchen* gesucht.** Die Suche schaut standardmäßig nicht in `.tscn`. Signale-Dock oder `grep` nehmen.
  - **Nicht committet vor dem ersten Speichern.** Der Diff mit `uid` und `unique_id` vermischt sich mit deinen Änderungen.

  ## Zusammenfassung

  - Ein fremdes Projekt liest du in festen Schritten: `project.godot`, Start, Hauptszene, Skripte, Verbindungen und Gruppen, Suche, Laufzeit.
  - Das Testgelände besteht aus zehn Textdateien. Die Eingabeaktionen legst du in *Projekteinstellungen → Eingabe-Zuordnung* an, mit physischem Tastencode und Stick-Achse.
  - Fehlermeldungen liest du über den GDScript-Backtrace bis zu deiner Datei und Zeile. Fehler des Spiels zählt der Debugger.
  - Der Remote-Baum zeigt das laufende Spiel mit aufgeklappten Instanzen, der Remote-Inspektor auch nicht exportierte Variablen. Änderungen dort gehen beim Beenden verloren.
  - Das Signale-Dock zeigt Verbindungen je Node; direkte Methodenaufrufe siehst du nur im Code.
  - *In Dateien suchen* durchsucht standardmäßig nur Skripte und Shader, `grep` auch Szenen.
exercises:
  - id: was-steht-in-project-godot
    type: choice
    title: Was verrät project.godot?
    prompt: |
      Du hast die Eingabeaktionen angelegt. Welche Fragen beantwortet dir `project.godot` des Testgeländes jetzt direkt?
    options:
      - text: Welche Szene F5 startet.
        correct: true
        why: "`run/main_scene` im Abschnitt `[application]`."
      - text: Wie die Kollisionsebenen 1 bis 3 heißen.
        correct: true
        why: Die Namen stehen unter `[layer_names]`.
      - text: Welche Tasten `move_left` auslösen.
        correct: true
        why: Nach dem Anlegen in der Eingabe-Zuordnung stehen Aktionen und Ereignisse unter `[input]`.
      - text: Wie viele Sammelstücke die Hauptszene enthält.
        correct: false
        why: Das steht in `main.tscn`. `project.godot` nennt nur die Hauptszene, nicht ihren Inhalt.
      - text: Wie schnell die Figur läuft.
        correct: false
        why: "`max_speed` liegt in `data/player_stats.tres` bzw. als Standard in `movement_stats.gd`."
    explanation: |
      `project.godot` hält alles, was für das ganze Projekt gilt: Hauptszene, Fenster und Darstellung, Eingabeaktionen, Ebenen-Namen, Autoloads. Was in einer Szene steckt und welche Werte eine Figur hat, steht in den Szenen und Ressourcen. Deshalb ist die Datei der erste Schritt beim Erkunden, aber nicht der letzte.
    resources:
      - title: Godot Docs · File system · project.godot
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/filesystem.html#project-godot

  - id: remote-aussagen
    type: choice
    title: Was der Remote-Baum zeigt
    prompt: |
      Das Testgelände läuft, im Szenen-Dock ist *Remote* gewählt. Welche Aussagen stimmen?
    options:
      - text: Unter `Player` stehen `Body`, `Feet` und `Camera2D`, obwohl `Player` im lokalen Baum zugeklappt ist.
        correct: true
        why: Zur Laufzeit ist eine Instanz ein gewöhnlicher Teilbaum.
      - text: Im Remote-Inspektor siehst du unter *Members* auch `total` und `facing`, die nicht exportiert sind.
        correct: true
        why: Der Remote-Inspektor zeigt die Variablen des laufenden Skripts.
      - text: Setzt du dort `Debug Log` an, steht der Wert nach dem Beenden in `player.tscn`.
        correct: false
        why: Änderungen am laufenden Spiel gehen beim Beenden verloren. In die Datei kommt nur, was du im lokalen Inspektor änderst.
      - text: Der Remote-Baum ist kostenlos und kann beim Messen der Bildrate offen bleiben.
        correct: false
        why: Laut Tooltip bringt jede Aktualisierung das Projekt zum Ruckeln. Vor Messungen auf Lokal schalten.
    explanation: |
      Der Remote-Baum ist die Laufzeitsicht: alle Nodes, auch die in Instanzen, und im Inspektor auch die Variablen, die du im Editor nicht siehst. Er ist ein Werkzeug zum Nachsehen und Ausprobieren, kein Ort zum Speichern. Was dort gut aussieht, überträgst du von Hand in die Szene oder Ressource.
    resources:
      - title: Godot Docs · Game embedding
        url: https://docs.godotengine.org/en/stable/tutorials/editor/game_embedding.html#doc-game-embedding-interaction-mode

  - id: erkundung-ordnen
    type: order
    title: Erst lesen, dann ändern
    prompt: |
      Bring die Schritte beim Erkunden eines fremden Projekts in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      project.godot auf Hauptszene, Autoloads, Aktionen und Ebenen lesen
      Das Spiel mit F5 starten und Ausgabe und Debugger beobachten
      Die Hauptszene öffnen und ihren Baum bis in die Instanzen lesen
      Skripte nach class_name, signal und @export durchsehen
      Verbindungen im Signale-Dock und per grep in den Szenen prüfen
      Im Remote-Baum nachsehen, was zur Laufzeit existiert
      Die Projektkarte schreiben und erst dann Werte ändern
    alternatives:
      - [1, 3, 2, 4, 5, 6, 7]
      - [1, 2, 3, 5, 4, 6, 7]
      - [1, 3, 2, 5, 4, 6, 7]
    explanation: |
      `project.godot` sagt dir, was startet und welche Aktionen es gibt, das brauchst du vor dem ersten Start. Ob du zuerst startest oder zuerst den Baum liest, ist egal, ebenso die Reihenfolge von Skripten und Verbindungen; diese Paare darfst du tauschen. Der Remote-Baum zeigt, was du vorher im Baum und in den Skripten gelesen hast, zur Laufzeit, und kommt deshalb danach. Geändert wird erst, wenn die Karte steht.
    resources:
      - title: Godot Docs · Overview of debugging tools
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html

  - id: suche-zaehlen
    type: output
    title: Was findet die Suche?
    prompt: |
      Im Testgelände suchst du mit *Projekt → In Dateien suchen …* nach `collected`, mit den Standardeinstellungen von Godot 4.7.2. Wie viele Trefferzeilen zeigt die Suche? Zur Erinnerung die Treffer im Terminal:
    lang: text
    code: |
      $ grep -rn collected --exclude-dir=.godot .
      ./player.gd:6:signal collected(total: int)
      ./player.gd:28:	collected.emit(total)
      ./main.tscn:44:[connection signal="collected" from="Objects/Player" to="HUD" method="show_total"]
    expected: |
      2
    accept:
      - 2 Treffer
      - 2 Zeilen
      - zwei
      - zwei Treffer
      - zwei Zeilen
    hints:
      - Welche Dateiendungen durchsucht *In Dateien suchen* standardmäßig?
    explanation: |
      Die Projekteinstellung `editor/script/search_in_file_extensions` steht in 4.7.2 auf `gd` und `gdshader`. Die Suche findet also die zwei Zeilen in `player.gd`, aber nicht die Verbindung in `main.tscn`. Willst du Szenen mit durchsuchen, ergänzt du dort `tscn`, oder du nimmst `grep`. Der Standardwert ist mit 4.7.2 ausgelesen.
    resources:
      - title: Godot Docs · ProjectSettings · search_in_file_extensions
        url: https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-editor-script-search-in-file-extensions

  - id: gruppe-zaehlen
    type: output
    title: Eine Gruppe an der Vorlage
    prompt: |
      Du fügst die Wurzel von `pickup.tscn` im Gruppen-Dock der Gruppe `pickups` hinzu und speicherst. Dann läuft dieses Skript, nachdem `main.tscn` geladen und in den Baum gehängt wurde. Was gibt es aus?
    lang: gdscript
    code: |
      print(get_tree().get_nodes_in_group(&"pickups").size())
    expected: |
      3
    hints:
      - Die Gruppe steht in der Kopfzeile des Wurzel-Nodes der Vorlage.
    explanation: |
      Die Gruppe ist Teil der Vorlage: `[node name="Pickup" type="Area2D" … groups=["pickups"]]`. Jede Instanz bringt sie mit, also sind alle drei Sammelstücke Mitglied. So findet Code alle Sammelstücke, ohne ihre Pfade zu kennen, ähnlich wie `querySelectorAll(".pickup")`. Gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Groups
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/groups.html

  - id: signale-im-terminal
    type: command
    title: Alle Signale auf einen Blick
    prompt: |
      Liste alle Zeilen, die mit `signal` beginnen, aus allen `.gd`-Dateien des Projekts, rekursiv und mit Zeilennummern.
    context: |
      Du bist im Projektordner `~/godot/testgelaende`.
    answers:
      - grep -rn "^signal" --include="*.gd" .
      - grep -rn --include="*.gd" "^signal" .
      - grep -rn "^signal" . --include="*.gd"
      - grep -rn "^signal" --include "*.gd" .
      - grep -rn --include "*.gd" "^signal" .
      - grep -rn "^signal" --include="*.gd"
      - grep -rn --include="*.gd" "^signal"
      - grep -rn -e "^signal" --include="*.gd" .
      - grep -rn --include="*.gd" -e "^signal" .
      - grep -Rn "^signal" --include="*.gd" .
      - grep -Rn --include="*.gd" "^signal" .
      - grep -Rn "^signal" . --include="*.gd"
    output: |
      ./player.gd:6:signal collected(total: int)
    explanation: |
      `-r` sucht rekursiv, `-n` zeigt Zeilennummern, `^` verankert das Muster am Zeilenanfang, sodass `collected.emit()` nicht mitkommt. `--include="*.gd"` beschränkt die Suche auf Skripte. Die Anführungszeichen sind in der fish-Shell Pflicht: Ohne sie meldet fish `No matches for wildcard '--include=*.gd'` und startet `grep` gar nicht. Im Testgelände gibt es genau ein eigenes Signal; mit `.` als Pfad stellt `grep` jedem Treffer `./` voran.
    resources:
      - title: Godot Docs · Using signals · Custom signals
        url: https://docs.godotengine.org/en/stable/getting_started/step_by_step/signals.html#custom-signals

  - id: skript-lesen
    type: gap
    title: Was player.gd nach außen anbietet
    prompt: |
      Ergänze die Schlüsselwörter, an denen du beim Überfliegen eines Skripts erkennst, was es anbietet: einen eigenen Typ, ein Signal, einen Wert im Inspektor, das Senden des Signals.
    lang: gdscript
    code: |
      ⟦class_name⟧ Player
      extends CharacterBody2D

      ⟦signal⟧ collected(total: int)

      ⟦@export⟧ var stats: MovementStats

      var total := 0


      func collect(value: int) -> void:
      	total += value
      	collected.⟦emit⟧(total)
    gaps:
      - label: Eigener Typ
        hint: Macht `Player` im ganzen Projekt als Typ bekannt.
      - label: Ereignis
        hint: Deklariert ein Ereignis, das andere Nodes verbinden können.
      - label: Wert im Inspektor
        hint: Eine Annotation mit `@`.
      - label: Senden
        hint: Die Methode eines Signals, die alle Verbindungen aufruft.
    explanation: |
      `class_name` registriert den Typ, deshalb kann `pickup.gd` `body is Player` prüfen und der Inspektor nur passende Ressourcen für `stats` anbieten. `signal` deklariert ein Ereignis mit seinen Argumenten, `.emit()` sendet es an alle verbundenen Methoden. `@export` macht die Variable im Inspektor einstellbar. Diese vier Wörter verraten dir in jedem fremden Skript, was es nach außen anbietet.
    resources:
      - title: Godot Docs · GDScript exported properties
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html
      - title: Godot Docs · Using signals
        url: https://docs.godotengine.org/en/stable/getting_started/step_by_step/signals.html

  - id: aktion-vertippt
    type: bug
    title: Die Figur läuft nach links, rechts und oben
    prompt: |
      Nach dem Anlegen der Aktionen läuft die Figur nach links, rechts und oben, aber nicht nach unten. Im Debugger steht in jedem Frame:

      ```text
      ERROR: The InputMap action "move_down" doesn't exist. Did you mean "move_dwon"?
         at: get_action_raw_strength (core/input/input.cpp:553)
         GDScript backtrace (most recent call first):
             [0] _physics_process (res://player.gd:16)
      ```

      Finde die Zeile in `project.godot` und korrigiere sie. Die Ereignisse sind gekürzt.
    lang: ini
    code: |
      [input]

      move_left={
      "deadzone": 0.2,
      "events": [ … ]
      }
      move_right={
      "deadzone": 0.2,
      "events": [ … ]
      }
      move_up={
      "deadzone": 0.2,
      "events": [ … ]
      }
      move_dwon={
      "deadzone": 0.2,
      "events": [ … ]
      }
    lines: [15]
    fix:
      - line: 15
        answers:
          - move_down={
    explanation: |
      Der Code fragt `move_down` ab, angelegt ist `move_dwon`. Godot findet die Aktion nicht und schlägt den ähnlichsten vorhandenen Namen vor. Am einfachsten korrigierst du das in der Eingabe-Zuordnung per Doppelklick auf den Namen; in der Datei ist es diese eine Zeile. Mit 4.7.2 nachgestellt.
    resources:
      - title: Godot Docs · InputMap
        url: https://docs.godotengine.org/en/stable/classes/class_inputmap.html

  - id: signal-ohne-wert
    type: bug
    title: Der Zähler bleibt bei 0
    prompt: |
      Ein Agent hat `collect()` umgebaut. Seitdem bleibt der Zähler bei 0, und beim ersten eingesammelten Stück meldet der Debugger:

      ```text
      ERROR: Error calling from signal 'collected' to callable: 'CanvasLayer(hud.gd)::show_total': Method expected 1 argument(s), but called with 0.
         at: emit_signalp (core/object/object.cpp:1311)
         GDScript backtrace (most recent call first):
             [0] collect (res://player.gd:28)
             [1] _on_body_entered (res://pickup.gd:10)
      ```

      Finde die Zeile und korrigiere sie.
    lang: gdscript
    code: |
      func collect(value: int) -> void:
      	total += value
      	collected.emit()
    lines: [3]
    fix:
      - line: 3
        answers:
          - collected.emit(total)
          - emit_signal("collected", total)
          - emit_signal(&"collected", total)
    explanation: |
      `show_total(total: int)` erwartet einen Wert, `collected.emit()` sendet keinen. Godot ruft die Methode deshalb nicht auf, und der Zähler bleibt stehen. Der Backtrace zeigt den Weg: `pickup.gd:10` ruft `collect`, und in `player.gd:28` wird gesendet. Die Deklaration `signal collected(total: int)` sagt, was gesendet werden soll; erzwungen wird es beim Senden nicht. Mit 4.7.2 nachgestellt.
    resources:
      - title: Godot Docs · Signal.emit
        url: https://docs.godotengine.org/en/stable/classes/class_signal.html#class-signal-method-emit

  - id: fehlermeldung-erklaeren
    type: explain
    title: Eine Meldung, vier Teile
    prompt: |
      Diese Meldung erschien beim ersten Start des Testgeländes, in jedem Frame neu. Erkläre in drei bis fünf Sätzen, was jeder Teil sagt und was du tust.
    lang: text
    code: |
      ERROR: The InputMap action "move_down" doesn't exist. Did you mean "ui_down"?
         at: get_action_raw_strength (core/input/input.cpp:553)
         GDScript backtrace (most recent call first):
             [0] _physics_process (res://player.gd:16)
    points:
      - Die `ERROR`-Zeile sagt, dass das Skript eine Aktion `move_down` abfragt, die in der Eingabe-Zuordnung fehlt.
      - "„Did you mean“ schlägt eine vorhandene, ähnlich benannte Aktion vor; `ui_down` ist eine eingebaute Aktion und nicht gemeint."
      - "`at:` zeigt die Stelle in Godots C++-Quelltext, der Backtrace `[0]` die eigene Zeile: `player.gd:16`, der Aufruf von `Input.get_vector()`."
      - Die Meldung kommt in jedem Physik-Frame, weil `_physics_process` sechzigmal pro Sekunde läuft.
      - Abhilfe ist, die Aktionen in den Projekteinstellungen unter Eingabe-Zuordnung anzulegen, nicht den Code zu ändern.
    explanation: |
      Die erste Zeile ist die Diagnose: Eine Aktion namens `move_down` gibt es nicht. Godot schlägt `ui_down` vor, weil das die ähnlichste eingebaute Aktion ist; sie gehört zur Bedienung von Menüs und ist hier nicht gemeint. Die `at:`-Zeile verweist auf Godots eigenen Quelltext und hilft selten weiter, der Backtrace dagegen nennt `player.gd:16`, die Zeile mit `Input.get_vector()`. Weil `_physics_process` in jedem Physik-Frame läuft, wiederholt sich die Meldung dauernd. Die Lösung liegt nicht im Code, sondern in der Eingabe-Zuordnung: Dort fehlen die Aktionen.
    resources:
      - title: Godot Docs · Input examples
        url: https://docs.godotengine.org/en/stable/tutorials/inputs/input_examples.html

  - id: testgelaende-anlegen
    type: practice
    title: Das Testgelände anlegen und prüfen
    prompt: |
      Leg das Testgelände aus der Lektion an, öffne es in Godot 4.7.2, starte es einmal ohne Aktionen, leg dann die vier Aktionen in der Eingabe-Zuordnung an und prüf das Ergebnis. Notiere die Ausgabe von `ls -A` und die Abschnitte von `project.godot` danach.
    lang: text
    solution: |
      $ ls -A
      crate.tscn         movement_stats.gd.uid
      data               pickup.gd
      .git               pickup.gd.uid
      .gitignore         pickup.tscn
      .godot             player.gd
      hud.gd             player.gd.uid
      hud.gd.uid         player.tscn
      main.tscn          project.godot
      movement_stats.gd

      $ grep -n "^\[" project.godot
      11:[application]
      17:[display]
      26:[input]
      57:[layer_names]
      63:[rendering]

      Ohne Aktionen: Figur steht, Debugger zählt
      "The InputMap action "move_down" doesn't exist."
      Mit Aktionen: Figur läuft, Zähler zählt 1, 2, 3.
    checklist:
      - Godot öffnet das Projekt ohne Fehler beim Laden der Szenen, und F5 zeigt Boden, Figur, Kiste, drei Sammelstücke und den Zähler.
      - Vor dem Anlegen der Aktionen hast du die Fehlermeldung gesehen und `player.gd:16` im Backtrace gefunden.
      - Die vier Aktionen haben je eine Buchstabentaste und eine Pfeiltaste als physischen Tastencode und eine Achse des linken Sticks.
      - "`project.godot` hat einen Abschnitt `[input]` mit `move_left`, `move_right`, `move_up` und `move_down`."
      - Mit `Debug Log` siehst du in der Ausgabe Zeilen der Form `Frame  speed Wert`.
      - Der Stand vor dem ersten Speichern einer Szene liegt als Commit in Git, mit einer `.gitignore`, die `.godot/` ausschließt.
    explanation: |
      Die Zeilennummern der Abschnitte entstehen, weil Godot `project.godot` beim Speichern der Einstellungen neu schreibt, mit Kommentarkopf und dem neuen Abschnitt `[input]`. Das Testgelände ist ab jetzt deine Werkbank: Spätere Module hängen eigene Nodes mit eigenen kleinen Skripten an, statt die Vorlagen umzuschreiben. Deshalb lohnt der Commit an dieser Stelle; jede spätere Änderung siehst du als eigenen Diff. Die Ausgaben stammen aus einem Lauf mit 4.7.2.
    resources:
      - title: Godot Docs · Input examples
        url: https://docs.godotengine.org/en/stable/tutorials/inputs/input_examples.html
      - title: Godot Docs · Overview of debugging tools
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html

  - id: projektkarte
    type: practice
    title: Deine Projektkarte des Testgeländes
    prompt: |
      Schreib eine Projektkarte des Testgeländes in eigenen Worten, so, dass du sie in drei Wochen ohne Editor verstehst. Geh die sieben Schritte der Lektion durch und halte fest, was du gefunden hast. Die Form wählst du selbst.
    lang: prose
    checklist:
      - Die Karte nennt die Hauptszene und welche Szenen sie wie oft einsetzt.
      - Für jede Datei in `data/` und jedes `@export` steht, wo der Wert liegt und wer ihn liest.
      - Die Kette vom Betreten eines Sammelstücks bis zur Zahl im Zähler steht vollständig da, mit Signalen und direkten Aufrufen.
      - Die Eingabeaktionen sind mit ihren Ereignissen genannt.
      - Mindestens eine Beobachtung stammt aus dem Remote-Baum oder Remote-Inspektor.
      - Du hast notiert, was dir beim Erkunden unklar blieb.
    hints:
      - Beginne mit einem Satz, was das Projekt tut, dann gehe Datei für Datei vor.
      - Die Kette aus der Lektion ist ein Anfang; schreib sie in deinen Worten.
    explanation: |
      Die Projektkarte ist das Ergebnis des ganzen Moduls und die Grundlage für alle weiteren: Wer weiß, wo was liegt, ändert gezielt und kann einem Coding-Agenten präzise sagen, wo er ansetzen soll. Offene Fragen sind kein Mangel, sondern der Arbeitsauftrag für die nächsten Module. Halte die Karte aktuell, wenn das Testgelände wächst.
    resources:
      - title: Godot Docs · Nodes and Scenes
        url: https://docs.godotengine.org/en/stable/getting_started/step_by_step/nodes_and_scenes.html
