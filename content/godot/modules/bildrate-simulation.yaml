id: bildrate-simulation
title: "Bildrate und Simulation: zwei Takte im selben Spiel"
level: 2
minutes: 120
summary: Godot zeichnet Bilder so oft, wie Monitor und Rechner es zulassen, rechnet die Physik aber in festen Ticks – wer beide Takte auseinanderhält, erklärt Ruckeln bei 144 Hz, Zeitlupe bei Überlast und irreführende Monitorwerte.
place: unterwegs
goals:
  - Du unterscheidest `_process` und `_physics_process` und sagst vorher, wie oft jede bei 30, 60 und 144 Bildern pro Sekunde läuft.
  - Du erklärst, warum eine Figur auf einem 144-Hz-Monitor ohne Physik-Interpolation ungleichmäßig läuft und was die Interpolation kostet.
  - Du erkennst, wann ein Spiel in Zeitlupe läuft, weil `max_physics_steps_per_frame` greift.
  - Du liest FPS, Prozessierung und Physik-Prozess im Debugger und rechnest sie gegen das Frame-Budget.
  - Du setzt `Engine.time_scale` als Zeitlupe zum Beobachten ein und weißt, was sie nicht anhält.
