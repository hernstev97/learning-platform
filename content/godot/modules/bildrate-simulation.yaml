lesson: |
  Am Laptop läuft die Figur im Testgelände gleichmäßig. An einem 144-Hz-Monitor wirkt dieselbe Bewegung unruhig, obwohl der Monitor mehr als doppelt so viele Bilder zeigt. Und als du zum Testen eine schwere Szene lädst, läuft plötzlich alles wie in Zeitlupe, auch die Figur, deren Code doch mit `delta` rechnet. Beides hat dieselbe Ursache: Ein Godot-Spiel hat zwei Takte. Der eine zeichnet Bilder, der andere rechnet die Simulation. Wie sie zusammenspielen, entscheidet, was auf dem Bildschirm landet.

  Im [Godot-Start](/combat/godot-start) hast du gesehen, dass ein `AnimationPlayer` im Modus `Idle` je nach Bildrate einen Frame mehr oder weniger trifft. Dahinter steckt ein Denkmodell mit zwei Takten, und Godot bringt die Werkzeuge mit, um beide zu messen. Alle Messungen hier stammen aus Läufen mit Godot 4.7.2.

  ## Zwei Takte: Bilder und Physik-Ticks

  Godot ruft zwei Funktionen automatisch auf, wenn ein Skript sie hat ([Idle and Physics Processing](https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html)):

  - **`_process(delta)`** läuft einmal pro gezeichnetem Bild. `delta` ist die Zeit seit dem letzten Bild in Sekunden und schwankt mit der Bildrate.
  - **`_physics_process(delta)`** läuft in festen **Physik-Ticks**, standardmäßig 60 pro Sekunde, unabhängig von der Bildrate. Den Takt stellst du unter *Projekt → Projekteinstellungen → Physik → Allgemein* ein, der Eintrag heißt „Physik-Ticks pro Sekunde“ (`physics/common/physics_ticks_per_second`).

  ![Projekteinstellungen, Physik, Allgemein: Physik-Ticks pro Sekunde 60, Max Physik-Schritte pro Frame 8, Physik-Jitter-Korrektur 0.5, Physik-Interpolation aus](/media/godot/bildrate-simulation/physik-allgemein@2x.png "Godot 4.7.2, Projekteinstellungen mit Erweiterten Einstellungen, Standardwerte")

  Aus der Webentwicklung kennst du den ersten Takt: `_process` entspricht `requestAnimationFrame`, das der Browser einmal pro Bild aufruft. Den zweiten Takt hat das Web nicht eingebaut. Ein `setInterval` mit 16 ms wäre kein Ersatz: Er holt verpasste Aufrufe nicht nach, und 16 ms sind nicht 1/60 Sekunde. Godot holt verpasste Ticks bis zu einer Grenze nach, und jeder Tick bekommt dasselbe `delta` von 1/60 Sekunde.

  Wie viele Ticks vor einem Bild laufen, zeigt ein kleines Skript, das beide Funktionen zählt:

  ```gdscript title=zaehler.gd
  extends Node

  ## Zählt, wie viele Physik-Ticks vor jedem gezeichneten Bild gelaufen sind.

  var frames := 0
  var ticks := 0
  var last_ticks := 0


  func _process(delta: float) -> void:
  	frames += 1
  	print("Bild ", frames, "  delta ", snappedf(delta, 0.000001), "  Ticks davor ", ticks - last_ticks)
  	last_ticks = ticks


  func _physics_process(_delta: float) -> void:
  	ticks += 1
  ```

  Gestartet mit `--fixed-fps`: Diese Option gibt jedem Bild eine feste Spielzeit und schaltet den Abgleich mit der Echtzeit ab ([Command line tutorial](https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html)). So bekommst du bei jedem Lauf dieselbe Ausgabe, egal wie schnell der Rechner ist. Mit `--fixed-fps 30`:

  ```text
  Bild 9  delta 0.033333  Ticks davor 2
  Bild 10  delta 0.033333  Ticks davor 2
  ```

  Mit `--fixed-fps 144`:

  ```text
  Bild 12  delta 0.006944  Ticks davor 0
  Bild 13  delta 0.006944  Ticks davor 0
  Bild 14  delta 0.006944  Ticks davor 1
  Bild 15  delta 0.006944  Ticks davor 0
  Bild 16  delta 0.006944  Ticks davor 1
  ```

  Bei 30 Bildern laufen vor jedem Bild zwei Ticks, bei 60 genau einer, bei 144 mal einer, mal keiner. In 300 Bildern zählte das Skript rund 600 Ticks bei 30 Bildern pro Sekunde, 300 bei 60 und 125 bei 144; je nachdem, wann gezählt wird, ist es ein Tick mehr oder weniger. Die Physik bleibt also bei 60 pro Sekunde; nur die Verteilung auf die Bilder ändert sich.

  > [!MERKE]
  > Was auf jedem Rechner gleich lange dauern muss, läuft in `_physics_process`: Bewegung mit Kollision, Zähler für Frame-Daten, Eingabepuffer. In `_process` gehört, was nur das Bild betrifft, etwa der Text einer Debug-Anzeige.

  > [!DEEP] Die Reihenfolge in einem Durchlauf
  > Ein Durchlauf der Hauptschleife misst zuerst, wie viel Zeit vergangen ist. Dann laufen alle fälligen Ticks, jeder mit `_physics_process` aller Nodes und danach dem Physik-Schritt. Erst dann kommt `_process`, einmal, und zum Schluss wird das Bild gezeichnet. Die Doku sagt dazu, `_process` laufe in einem Spiel mit einem Thread „after the physics step“.

  ## Ticks auf Bilder verteilen: warum es bei 144 Hz ruckelt

  Ein Monitor mit 144 Hz zeigt 144 Bilder pro Sekunde, die Physik liefert 60 neue Stände. 84 der 144 Bilder bekommen also keinen neuen Tick und zeigen dieselbe Position wie das Bild davor. Die Doku beschreibt diesen Treppeneffekt am extremen Beispiel mit 10 Ticks pro Sekunde: Jede neue Position steht dann sechs Bilder lang still ([Physics ticks and rendered frames](https://docs.godotengine.org/en/stable/tutorials/physics/interpolation/physics_interpolation_introduction.html#physics-ticks-and-rendered-frames)).

  Gemessen an einem Klotz, der mit 90 Pixeln pro Sekunde nur in `_physics_process` nach rechts läuft, bei 144 Bildern pro Sekunde, Spielauflösung 320 × 180 mit Pixel-Snap. Pro Tick sind das 1,5 Pixel. Die Spalte „Sprung“ zählt, um wie viele Pixel die linke Kante seit dem Bild davor gewandert ist:

  ```text
  Bild  Ticks davor  Kante x  Sprung
   21        1          34       2
   22        0          34       0
   23        1          35       1
   24        0          35       0
   25        0          35       0
   26        1          37       2
  ```

  Der Klotz steht zwei oder drei Bilder still und springt dann um ein oder zwei Pixel. Das Auge sieht das als Ruckeln, obwohl im Mittel alles stimmt. Derselbe Klotz bei 60 Bildern pro Sekunde springt in jedem Bild, abwechselnd 1 und 2 Pixel. Bei 30 Bildern springt er in jedem Bild 3 Pixel, weil jedes Bild zwei Ticks auf einmal zeigt: grober, aber ohne Stillstand.

  ![Zwei Spalten mit je 12 Bildern untereinander: links ohne Interpolation steht der weiße Klotz mehrere Bilder an derselben Stelle und springt dann, rechts rückt er in kleinen Schritten von höchstens einem Pixel vor](/media/godot/bildrate-simulation/takt-streifen@2x.png "Godot 4.7.2, Klotz mit 90 px/s bei 144 Bildern pro Sekunde, Bild 21 bis 32, jede Zeile ein Bild, sechsfach vergrößert")

  ## Physik-Interpolation: Zwischenstände zeichnen

  Die **Physik-Interpolation** merkt sich für jedes Objekt den Stand der letzten beiden Ticks und zeichnet ein Bild an der Stelle dazwischen, die zur aktuellen Zeit passt. In 2D gibt es sie seit Godot 4.3 ([Release 4.3](https://godotengine.org/releases/4.3/#highlights-2d-physics-interpolation)). Du schaltest sie unter *Physik → Allgemein → Physik-Interpolation* ein (`physics/common/physics_interpolation`, Standard aus). Die rechte Spalte im Bild oben ist derselbe Lauf mit Interpolation:

  ```text
  Bild  Ticks davor  Kante x  Sprung
   21        1          32       0
   22        0          33       1
   23        1          34       1
   24        0          34       0
   25        0          35       1
   26        1          35       0
  ```

  Der Klotz rückt jetzt in etwa sechs von zehn Bildern um ein Pixel vor und steht sonst still; Sprünge von 2 Pixeln kamen in den gemessenen Bildern 20 bis 40 nicht mehr vor. Ganz glatt wird es trotzdem nicht: Mit Pixel-Snap kann der Klotz nur ganze Pixel springen, und 0,625 Pixel pro Bild ergeben ein Muster aus 0 und 1.

  Die Kosten stehen in derselben Tabelle. In Bild 21 zeigt die Interpolation die Kante bei 32, ohne Interpolation bei 34. Das Bild liegt hinter dem Stand der Physik, weil es zwischen zwei schon vergangenen Ticks liegt. Die Doku nennt ein bis zwei Ticks Rückstand ([In the past](https://docs.godotengine.org/en/stable/tutorials/physics/interpolation/physics_interpolation_introduction.html#in-the-past)) und warnt vor zusätzlicher Eingabeverzögerung, gerade bei Spielen mit festem Timing ([Jitter](https://docs.godotengine.org/en/stable/tutorials/rendering/jitter_stutter.html#jitter)). Dazu kommen Regeln, die dein Code einhalten muss:

  - Interpoliert wird nur, was sich im Physik-Takt bewegt. Setzt ein Skript die Position in `_process`, zittert das Objekt ([Using physics interpolation](https://docs.godotengine.org/en/stable/tutorials/physics/interpolation/using_physics_interpolation.html#move-almost-all-game-logic-from-process-to-physics-process)).
  - Springt ein Objekt absichtlich, etwa beim Neustart an einem Startpunkt, ruf danach `reset_physics_interpolation()` auf. Sonst zeichnet Godot Zwischenstände auf dem Weg dorthin.

  ```gdscript
  func respawn(spawn_point: Vector2) -> void:
  	global_position = spawn_point
  	reset_physics_interpolation()   # kein Zwischenstand zwischen alter und neuer Stelle
  ```

  Gemessen: Der Klotz sprang im Tick 30 von x = 64 auf x = 200. Ohne `reset_physics_interpolation()` zeigten die drei Bilder nach diesem Tick die Kante bei 64, 120 und 177, eine Schliere quer durchs Bild; erst mit dem nächsten Tick stand sie bei 200. Mit dem Aufruf stand sie schon im ersten Bild nach dem Tick bei 200 ([Call reset_physics_interpolation() when teleporting objects](https://docs.godotengine.org/en/stable/tutorials/physics/interpolation/using_physics_interpolation.html#call-reset-physics-interpolation-when-teleporting-objects)).

  > [!PRAXIS]
  > Für Frame-Messungen bleibt die Interpolation aus, wie im [Godot-Start](/combat/godot-start): Dann zeigt jedes Bild genau einen Tick, und du zählst, was du siehst. Ob dein Spiel sie später bekommt, entscheidest du nach einem Test auf einem Monitor mit hoher Bildrate, mit und ohne. Ein Coding-Agent schaltet sie gern pauschal ein; prüf danach, ob irgendwo eine Position in `_process` gesetzt wird.

  ## VSync, Max FPS und das Frame-Budget

  Wie viele Bilder Godot zeichnet, bestimmen drei Dinge:

  - **VSync** wartet mit jedem Bild auf den Monitor. Die Einstellung steht unter *Anzeige → Fenster → V-Sync-Modus* (`display/window/vsync/vsync_mode`), Standard `Enabled`. Dann kann die Bildrate die Bildwiederholrate des Monitors nicht übersteigen ([Engine.max_fps](https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-property-max-fps)).
  - **Max. FPS** unter *Anwendung → Ausführen* (`application/run/max_fps`) begrenzt die Bildrate zusätzlich; 0 heißt unbegrenzt.
  - Die Rechenzeit. Ein Bild bei 60 Bildern pro Sekunde hat ein **Frame-Budget** von 1000 / 60 = 16,67 ms, bei 144 sind es 6,94 ms. Wer länger braucht, verliert Bilder.

  Zum Testen gibt es zwei Startoptionen: `--disable-vsync` schaltet VSync ab, `--max-fps 30` begrenzt die Bildrate auf 30 Bilder pro Sekunde wie bei einem langsamen Rechner ([Command line tutorial](https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html), Abschnitt *Debug options*; beide nennt auch [Input lag](https://docs.godotengine.org/en/stable/tutorials/rendering/jitter_stutter.html#input-lag)).

  Wird ein Bild sehr langsam, müsste die Physik viele Ticks nachholen. Godot begrenzt das mit **Max Physik-Schritte pro Frame** (`physics/common/max_physics_steps_per_frame`, Standard 8). Dauert ein Bild länger als 8 Ticks, also 133 ms, fehlen Ticks, und das Spiel läuft langsamer, „even if delta is consistently used“ ([max_physics_steps_per_frame](https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-property-max-physics-steps-per-frame)). Gemessen mit einem Skript, das jedes Bild künstlich verzögert, jeweils 3 Sekunden Echtzeit:

  ```text
  Dauer je Bild        100 ms    250 ms
  Bilder                   29        11
  Ticks                   174        88
  höchstens Ticks/Bild      7         8
  Spielzeit             2,9 s   1,467 s
  ```

  Bei 100 ms holt die Physik alles nach. Bei 250 ms wären 15 Ticks pro Bild fällig, es laufen nur 8, und in 3 Sekunden vergehen 1,467 Sekunden Spielzeit: halbe Geschwindigkeit. Diese Zeitlupe ist kein Fehler im Code der Figur, sondern ein Zeichen, dass Bilder zu lange dauern.

  > [!WARNING] Andere Tick-Zahlen
  > Änderst du „Physik-Ticks pro Sekunde“ auf einen Wert, der kein Vielfaches von 60 ist, verteilt sich der Takt auf einem 60-Hz-Monitor ungleichmäßig. Die Doku rät dann zur Physik-Interpolation ([physics_ticks_per_second](https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-property-physics-ticks-per-second)). Mehr Ticks kosten Rechenzeit, und die Doku empfiehlt, `max_physics_steps_per_frame` dann ebenfalls zu erhöhen.

  ## Messen: Monitore im Debugger lesen

  Im Debugger unten im Editor zeigt der Reiter **Monitore** Messwerte des laufenden Spiels ([Monitors](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/debugger_panel.html#monitors)). Für die Takte zählt die Gruppe **Zeit**:

  ![Debugger, Reiter Monitore, Gruppe Zeit: FPS 60, Prozessierung 17.89 ms, Physik-Prozess 0.10 ms, Navigations-Prozess 0.00 ms](/media/godot/bildrate-simulation/monitore-zeit@2x.png "Godot 4.7.2, Testgelände am 60-Hz-Monitor mit VSync")

  - **FPS** sind die Bilder der letzten Sekunde.
  - **Prozessierung** ist laut Doku die Zeit für ein Bild. Godot nimmt dabei den längsten Durchlauf der letzten Sekunde, und darin stecken `_process`, das Zeichnen und mit VSync auch das Warten auf den Monitor (so rechnet es der [Quelltext von 4.7.2](https://github.com/godotengine/godot/blob/4.7.2-stable/main/main.cpp), Funktion `Main::iteration`).
  - **Physik-Prozess** ist der längste Tick der letzten Sekunde.

  Die Monitore holen ihre Werte einmal pro Sekunde ([Custom performance monitors](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/custom_performance_monitors.html)). Ein einzelnes langsames Bild siehst du dort als Ausschlag, aber nicht, welche Funktion schuld ist; das zeigt der Profiler in [Fehler eingrenzen](/godot/fehler-eingrenzen).

  Gemessen am selben kleinen Projekt, jeweils nach 3,5 Sekunden:

  - normaler Start mit VSync: 60 FPS, Prozessierung 19,34 ms, Physik-Prozess 0,06 ms
  - mit `--disable-vsync`: 8849 FPS, Prozessierung 1,65 ms, Physik-Prozess 0,07 ms
  - mit `--disable-vsync --max-fps 30`: 30 FPS, Prozessierung 0,8 ms, Physik-Prozess 0,07 ms

  Mit VSync sieht Prozessierung aus, als wäre das Budget überschritten, dabei wartet Godot nur auf den Monitor. Ohne VSync zeigt derselbe Wert die echte Arbeit. Lies die Monitore deshalb immer zusammen: FPS am Limit und Prozessierung um oder knapp über 16,67 ms heißt bei VSync meist, dass Godot auf den Monitor wartet.

  > [!INTERVIEW]
  > „Ein Tester sagt, das Spiel ruckle auf seinem 144-Hz-Monitor, bei dir nicht. Wie gehst du vor?“ Gute Antwort: Zuerst trenne ich Bildrate und Simulation. Bewegt sich alles im Physik-Takt, sehen 144 Bilder nur 60 neue Stände, und Bilder ohne neuen Tick wiederholen die Position. Ich stelle das mit `--fixed-fps 144` nach und zähle die Ticks pro Bild. Dann teste ich Physik-Interpolation, prüfe, dass keine Position in `_process` gesetzt wird, und wäge die zusätzliche Verzögerung gegen die ruhigere Bewegung ab.

  ## Zeitlupe zum Beobachten: Engine.time_scale

  `Engine.time_scale` streckt die Spielzeit: Bei 0.5 läuft alles, was mit `delta` rechnet, halb so schnell ([Engine.time_scale](https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-property-time-scale)). Die Zahl der Ticks pro Sekunde bleibt 60, nur ihr `delta` halbiert sich auf 0,00833. Gemessen im Testgelände mit den Platzhaltern 90/600/900: Bei 1.0 erreicht die Figur 90 px/s nach 9 Ticks, bei 0.5 nach 18 Ticks, und pro Tick legt sie bei vollem Tempo 0,75 statt 1,5 Pixel zurück.

  Daraus folgen zwei Dinge. Zum Zusehen ist `time_scale` praktisch: Bei 0.25 erkennst du, wo eine Bewegung hakt. Zum Anhalten taugt es nicht, denn Code, der Ticks zählt, zählt weiter; das hat [Testszene: Angriff](/combat/testszene-angriff) bei `time_scale = 0` gemessen. Auch der Ton läuft im normalen Tempo weiter. Für Einzelbilder nimmst du Pause und Nächster Frame. Starten lässt sich die Zeitlupe auch von außen mit `--time-scale 0.5`.

  ## Häufige Fehler

  - **Frames in `_process` gezählt.** Ein Ausweichen mit 18 Frames dauerte gemessen bei 60 Bildern pro Sekunde 0,3 s, bei 144 rund 0,13 s, bei 30 rund 0,6 s. In `_physics_process` waren es immer 0,3 s.
  - **Bewegung in `_process` ohne `delta`.** Die Figur läuft auf schnellen Monitoren schneller.
  - **Position in `_process` gesetzt, Interpolation an.** Das Objekt zittert, weil die Interpolation nur Ticks kennt.
  - **Teleport ohne `reset_physics_interpolation()`.** Ein, zwei Bilder zeigen das Objekt auf halbem Weg.
  - **Prozessierung mit VSync für Rechenzeit gehalten.** Ohne VSync messen oder den Profiler nehmen.
  - **Zeitlupe für einen Code-Fehler gehalten.** Fallen die FPS unter 60 / 8 = 7,5, greift `max_physics_steps_per_frame`, und das ganze Spiel wird langsamer.
  - **`Engine.time_scale = 0` als Pause.** Tick-Zähler laufen weiter, der Ton auch.

  ## Zusammenfassung

  - `_process` läuft pro Bild mit schwankendem `delta`, `_physics_process` in festen Ticks, standardmäßig 60 pro Sekunde mit `delta` 1/60.
  - Bei 30 Bildern laufen zwei Ticks pro Bild, bei 144 mal einer, mal keiner. 84 von 144 Bildern zeigen dann keinen neuen Stand.
  - Physik-Interpolation glättet die Bewegung mit Zwischenständen und kostet dafür Verzögerung. Sie wirkt nur auf Bewegung im Physik-Takt; nach Teleports `reset_physics_interpolation()`.
  - VSync und Max. FPS begrenzen die Bildrate. Das Frame-Budget ist 16,67 ms bei 60 und 6,94 ms bei 144 Bildern pro Sekunde.
  - Dauert ein Bild länger als 8 Ticks, läuft das Spiel in Zeitlupe, auch wenn der Code `delta` nutzt.
  - Prozessierung enthält mit VSync das Warten auf den Monitor. Rechenzeit misst du ohne VSync oder im Profiler.
  - `Engine.time_scale` streckt `delta`, nicht die Zahl der Ticks. Zum Beobachten gut, zum Anhalten nicht.
exercises:
  - id: takt-zuordnen
    type: choice
    title: Welcher Takt für welche Arbeit?
    prompt: |
      Welche Zuordnungen stimmen für ein Spiel, das auf 60-Hz- und 144-Hz-Monitoren gleich laufen soll?
    options:
      - text: "Figur mit `velocity` und `move_and_slide()` bewegen: `_physics_process`"
        correct: true
        why: Die Bewegung mit Kollision gehört in den festen Takt. Nur dort wirkt auch die Physik-Interpolation.
      - text: "Den Text einer Debug-Anzeige mit dem aktuellen Tempo setzen: `_process`"
        correct: true
        why: Die Anzeige betrifft nur das Bild. Ob sie 60- oder 144-mal pro Sekunde neu geschrieben wird, ändert am Spiel nichts.
      - text: "Die Frames eines Ausweichens herunterzählen: `_process`"
        correct: false
        why: Dann hängt die Dauer an der Bildrate. Gemessen dauerten 18 Frames bei 144 Bildern pro Sekunde rund 0,13 s statt 0,3 s.
      - text: "Die Position eines Objekts setzen, während die Physik-Interpolation an ist: `_process`"
        correct: false
        why: Die Interpolation rechnet zwischen zwei Ticks. Positionen, die außerhalb eines Ticks gesetzt werden, lassen das Objekt zittern.
    explanation: |
      Die Regel lautet: Was auf jedem Rechner gleich lange dauern oder gleich weit führen muss, läuft in `_physics_process`. In `_process` gehört, was nur die Darstellung betrifft. Der feste Takt liefert 60 Ticks pro Sekunde mit immer gleichem `delta`, `_process` läuft so oft, wie Bilder gezeichnet werden. Die Doku empfiehlt mit Physik-Interpolation ausdrücklich, fast alle Spiellogik in `_physics_process` zu verlegen.
    resources:
      - title: Godot Docs · Idle and Physics Processing
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html
      - title: Godot Docs · Using physics interpolation
        url: https://docs.godotengine.org/en/stable/tutorials/physics/interpolation/using_physics_interpolation.html#move-almost-all-game-logic-from-process-to-physics-process

  - id: durchlauf-ordnen
    type: order
    title: Ein Durchlauf der Hauptschleife
    prompt: |
      Das Spiel läuft mit 30 Bildern pro Sekunde, die Physik mit 60 Ticks. Bring die Schritte eines Durchlaufs in die Reihenfolge, in der Godot 4.7 sie abarbeitet.
    lang: prose
    lines: |
      Godot misst, wie viel Zeit seit dem letzten Durchlauf vergangen ist.
      Erster fälliger Tick: `_physics_process` aller Nodes, danach der Physik-Schritt.
      Zweiter fälliger Tick: `_physics_process` aller Nodes, danach der Physik-Schritt.
      `_process` aller Nodes, einmal.
      Godot zeichnet das Bild.
    explanation: |
      Aus der vergangenen Zeit ergibt sich, wie viele Ticks fällig sind; bei 30 Bildern pro Sekunde sind es zwei. Jeder Tick ruft zuerst `_physics_process` auf, dann rechnet die Physik. Erst danach läuft `_process`, die Doku sagt „after the physics step“, und zum Schluss entsteht das Bild. Deshalb sieht `_process` immer die Positionen nach dem letzten Tick, und das Bild zeigt ohne Interpolation genau diesen Stand.
    resources:
      - title: Godot Docs · Idle and Physics Processing
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html

  - id: zaehler-bei-30
    type: output
    title: Was meldet das zehnte Bild?
    prompt: |
      Das Spiel startet mit `--fixed-fps 30`, die Physik läuft mit 60 Ticks pro Sekunde. `ticks` zählt in `_physics_process` mit. Was gibt diese Funktion im 10. Bild aus?
    lang: gdscript
    code: |
      func _process(delta: float) -> void:
      	frames += 1
      	print("Bild ", frames, "  delta ", snappedf(delta, 0.000001), "  Ticks davor ", ticks - last_ticks)
      	last_ticks = ticks
    expected: |
      Bild 10  delta 0.033333  Ticks davor 2
    accept:
      - Bild 10 delta 0.033333 Ticks davor 2
      - "Bild 10  delta 0.03333  Ticks davor 2"
    explanation: |
      Ein Bild dauert bei 30 Bildern pro Sekunde 1/30 s, das ist das `delta` von `_process`. In dieser Zeit sind zwei Physik-Ticks zu je 1/60 s fällig, und beide laufen vor `_process`. Gemessen mit Godot 4.7.2: In den ersten Bildern schwankt `delta` noch (0.025, 0.041667), ab Bild 7 steht es bei 0.033333, und jedes Bild hat zwei Ticks davor.
    resources:
      - title: Godot Docs · Command line tutorial
        url: https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html

  - id: bilder-ohne-tick
    type: output
    title: Wie viele Bilder wiederholen sich?
    prompt: |
      Ein Monitor zeigt 144 Bilder pro Sekunde, die Physik rechnet 60 Ticks pro Sekunde, die Physik-Interpolation ist aus. Kein Bild bekommt mehr als einen Tick. Wie viele der 144 Bilder einer Sekunde zeigen dieselbe Position wie das Bild davor?
    lang: text
    code: |
      Bilder pro Sekunde   144
      Ticks pro Sekunde     60
      Interpolation        aus
    expected: |
      84
    accept:
      - 84 Bilder
    explanation: |
      60 Bilder bekommen einen neuen Tick, die anderen 144 − 60 = 84 zeigen den Stand des letzten Ticks noch einmal. Gemessen mit Godot 4.7.2 bei `--fixed-fps 144`: In 300 Bildern liefen 125 Ticks, also 60 pro 144 Bilder. Weil die Bilder ohne Tick unregelmäßig verteilt sind (0, 0, 1, 0, 1 …), wirkt die Bewegung unruhig, obwohl der Monitor mehr Bilder zeigt.
    resources:
      - title: Godot Docs · Physics ticks and rendered frames
        url: https://docs.godotengine.org/en/stable/tutorials/physics/interpolation/physics_interpolation_introduction.html#physics-ticks-and-rendered-frames

  - id: zeitlupe-log
    type: output
    title: Das Log in halber Geschwindigkeit
    prompt: |
      Im Testgelände ist am Player `debug_log` an, `Engine.time_scale` steht auf 0.5. Die Werte sind die Platzhalter 90/600/900. Ab Tick 10 ist `move_right` gedrückt, vorher stand die Figur. Welche drei Zeilen gibt `player.gd` in den Ticks 10, 11 und 12 aus?
    lang: gdscript
    code: |
      func _physics_process(delta: float) -> void:
      	var input := Input.get_vector(&"move_left", &"move_right", &"move_up", &"move_down")
      	var rate := stats.acceleration if input != Vector2.ZERO else stats.friction
      	velocity = velocity.move_toward(input * stats.max_speed, rate * delta)
      	if input != Vector2.ZERO:
      		facing = input
      	move_and_slide()
      	if debug_log:
      		print(Engine.get_physics_frames(), "  speed ", snappedf(velocity.length(), 0.1))
    expected: |
      10  speed 5.0
      11  speed 10.0
      12  speed 15.0
    accept:
      - |
        10 speed 5.0
        11 speed 10.0
        12 speed 15.0
      - |
        10  speed 5
        11  speed 10
        12  speed 15
    explanation: |
      `time_scale` 0.5 halbiert `delta` auf 1/120 s. `move_toward` erhöht das Tempo pro Tick um `acceleration × delta` = 600 / 120 = 5 statt 10 px/s. Die Zahl der Ticks pro Sekunde bleibt 60, deshalb zählt `Engine.get_physics_frames()` normal weiter. Gemessen mit Godot 4.7.2: bei `time_scale` 1.0 stand in Tick 10 `speed 10.0`, bei 0.5 `speed 5.0`; 90 px/s erreicht die Figur nach 18 statt 9 Ticks.
    resources:
      - title: Godot Docs · Engine.time_scale
        url: https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-property-time-scale

  - id: ueberlast-ticks
    type: output
    title: Wenn ein Bild 250 ms braucht
    prompt: |
      Eine schwere Szene braucht für jedes Bild 250 ms. Die Projekteinstellungen stehen auf den Standardwerten. Wie viele Physik-Ticks laufen pro Bild?
    lang: text
    code: |
      Physik-Ticks pro Sekunde           60
      Max Physik-Schritte pro Frame       8
      Dauer je Bild                   250 ms
    expected: |
      8
    accept:
      - 8 Ticks
    explanation: |
      Fällig wären 0,25 × 60 = 15 Ticks, erlaubt sind höchstens 8. Die übrigen 7 fallen weg, und pro Bild vergehen nur 8 / 60 = 0,133 s Spielzeit statt 0,25 s. Gemessen mit Godot 4.7.2: In 3 Sekunden Echtzeit liefen 11 Bilder mit 88 Ticks, die Spielzeit betrug 1,467 s. Das Spiel lief also in halber Geschwindigkeit, auch wenn jeder Code mit `delta` rechnet.
    resources:
      - title: Godot Docs · Engine.max_physics_steps_per_frame
        url: https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-property-max-physics-steps-per-frame

  - id: teleport-ergaenzen
    type: gap
    title: Ohne Schliere zum Startpunkt
    prompt: |
      Die Physik-Interpolation ist an. Ergänze die Lücken, damit die Figur interpoliert läuft und beim Neustart ohne Zwischenbild am Startpunkt erscheint.
    lang: gdscript
    code: |
      func ⟦_physics_process⟧(delta: float) -> void:
      	velocity = direction * speed
      	move_and_slide()


      func respawn(spawn_point: Vector2) -> void:
      	global_position = spawn_point
      	⟦reset_physics_interpolation()⟧
    gaps:
      - label: Funktion für den festen Takt
        hint: Die Funktion, die Godot vor jedem Physik-Schritt aufruft.
      - label: Interpolation zurücksetzen
        hint: Eine Methode von `Node`, die den gemerkten vorigen Stand auf den aktuellen setzt.
        accept: ["self.reset_physics_interpolation()"]
    explanation: |
      Interpoliert wird nur, was sich im Physik-Takt bewegt, deshalb steht die Bewegung in `_physics_process`. Nach einem Sprung setzt `reset_physics_interpolation()` den gemerkten vorigen Stand gleich dem neuen. Ohne den Aufruf zeigten im Test mit Godot 4.7.2 zwei Bilder den Klotz unterwegs, bei x = 120 und 177 auf dem Weg von 64 nach 200.
    resources:
      - title: Godot Docs · Node.reset_physics_interpolation
        url: https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-method-reset-physics-interpolation

  - id: fester-takt-starten
    type: command
    title: 144 Bilder pro Sekunde nachstellen
    prompt: |
      Du hast keinen 144-Hz-Monitor, willst aber sehen, wie sich die Ticks auf 144 Bilder verteilen. Starte das Spiel so, dass jedes Bild genau 1/144 Sekunde Spielzeit bekommt, unabhängig davon, wie schnell dein Rechner ist.
    context: |
      Du bist im Projektordner. `godot` steht für dein Godot-Binary.
    answers:
      - godot --fixed-fps 144
      - godot --path . --fixed-fps 144
      - godot --fixed-fps 144 --path .
    explanation: |
      `--fixed-fps` gibt jedem Bild dieselbe Spielzeit und schaltet den Abgleich mit der Echtzeit ab. Das Ergebnis ist bei jedem Lauf gleich, deshalb eignet es sich für Messungen wie die Tick-Verteilung in der Lektion. `--max-fps 144` wäre etwas anderes: Es begrenzt nur die Bildrate, und auf einem 60-Hz-Monitor mit VSync kommst du gar nicht so hoch.
    resources:
      - title: Godot Docs · Command line tutorial
        url: https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html

  - id: ohne-vsync-starten
    type: command
    title: Rechenzeit ohne Warten messen
    prompt: |
      Der Monitor „Prozessierung“ zeigt mit VSync rund 19 ms. Starte das Spiel ohne VSync, damit der Wert die echte Arbeit pro Bild zeigt.
    context: |
      Du bist im Projektordner. `godot` steht für dein Godot-Binary.
    answers:
      - godot --disable-vsync
      - godot --path . --disable-vsync
      - godot --disable-vsync --path .
    explanation: |
      `--disable-vsync` schaltet VSync ab, auch wenn die Projekteinstellung es vorsieht. Dann wartet Godot nicht mehr auf den Monitor, und Prozessierung zeigt Verarbeitung und Zeichnen. Gemessen mit Godot 4.7.2 an einem kleinen Projekt: mit VSync 19,34 ms bei 60 FPS, ohne 1,65 ms bei 8849 FPS. Für den Test ist das richtig; für Spieler entscheidest du später, ob VSync an bleibt.
    resources:
      - title: Godot Docs · Fixing jitter, stutter and input lag
        url: https://docs.godotengine.org/en/stable/tutorials/rendering/jitter_stutter.html#input-lag

  - id: prozessierung-lesen
    type: choice
    title: Sind 17,89 ms zu viel?
    prompt: |
      Das Testgelände läuft am 60-Hz-Monitor mit VSync. Der Debugger zeigt diese Werte. Welche Aussage stimmt?

      ![Debugger, Reiter Monitore, Gruppe Zeit: FPS 60, Prozessierung 17.89 ms, Physik-Prozess 0.10 ms](/media/godot/bildrate-simulation/monitore-zeit@2x.png "Godot 4.7.2, Monitore des Testgeländes")
    options:
      - text: Das Spiel schafft alle 60 Bilder. In den 17,89 ms steckt das Warten auf den Monitor; die Rechenzeit zeigt erst ein Lauf ohne VSync.
        correct: true
        why: FPS stehen am Limit. Prozessierung ist der längste Durchlauf der letzten Sekunde inklusive Zeichnen und Warten.
      - text: Das Spiel überschreitet das Budget von 16,67 ms und verliert Bilder.
        correct: false
        why: Dann läge FPS unter 60. Gemessen ohne VSync brauchte ein ähnliches Projekt 1,65 ms.
      - text: Die Physik ist der Engpass, weil sie 60-mal pro Sekunde läuft.
        correct: false
        why: Der längste Tick dauerte 0,10 ms, ein winziger Teil des Budgets.
      - text: Weil Prozessierung über 16,67 ms liegt, rechnet auch die Physik weniger als 60 Ticks pro Sekunde.
        correct: false
        why: Die Physik holt fällige Ticks nach, bis zu 8 pro Bild. Weniger als 60 Ticks pro Sekunde gibt es erst, wenn ein Bild länger als 133 ms dauert.
    explanation: |
      Prozessierung misst den längsten Durchlauf aus Verarbeitung und Zeichnen der letzten Sekunde, mit VSync einschließlich der Zeit, in der Godot auf den Monitor wartet. Ein Wert um 16 bis 19 ms bei 60 FPS ist deshalb normal. Erst ohne VSync oder im Profiler siehst du, wie viel davon dein Spiel tatsächlich rechnet.
    resources:
      - title: Godot Docs · Debugger panel · Monitors
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/debug/debugger_panel.html#monitors
      - title: Godot Docs · Performance.TIME_PROCESS
        url: https://docs.godotengine.org/en/stable/classes/class_performance.html#class-performance-constant-time-process

  - id: ausweichen-zaehlt-bilder
    type: bug
    title: Am schnellen Monitor kürzer
    prompt: |
      Ein Coding-Agent hat das Ausweichen gebaut. Am 60-Hz-Monitor dauert es 0,3 Sekunden, am 144-Hz-Monitor rund 0,13 Sekunden, mit 30 Bildern pro Sekunde rund 0,6. Finde die Zeile, die das verursacht, und korrigiere sie.
    lang: gdscript
    code: |
      var dodge_frames_left := 0


      func start_dodge() -> void:
      	dodge_frames_left = 18   # Platzhalter


      func _process(_delta: float) -> void:
      	if dodge_frames_left > 0:
      		dodge_frames_left -= 1
    lines: [8]
    fix:
      - line: 8
        answers:
          - "func _physics_process(_delta: float) -> void:"
          - "func _physics_process(delta: float) -> void:"
          - "func _physics_process(_delta):"
          - "func _physics_process(delta):"
          - "func _physics_process(_delta) -> void:"
          - "func _physics_process(delta) -> void:"
    explanation: |
      `_process` läuft einmal pro gezeichnetem Bild. 18 Bilder dauern bei 144 Bildern pro Sekunde 0,125 s, bei 30 Bildern 0,6 s. In `_physics_process` sind 18 Ticks immer 0,3 s. Gemessen mit Godot 4.7.2 und `--fixed-fps`: 0,3 s, 0,132 s und 0,592 s in `_process`, 0,3 s in allen drei Fällen in `_physics_process`. Die Zahl 18 ist ein Platzhalter; wie lange dein Ausweichen dauert, entscheidest du.
    resources:
      - title: Godot Docs · Idle and Physics Processing
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html

  - id: interpolation-abwaegen
    type: explain
    title: Was die Interpolation zeigt und was sie kostet
    prompt: |
      Erkläre anhand dieser Messung in wenigen Sätzen, was die Physik-Interpolation am Bild ändert und welchen Preis sie hat. Der Klotz läuft mit 90 px/s nur in `_physics_process`, das Spiel zeigt 144 Bilder pro Sekunde.
    lang: text
    code: |
      Kante x des Klotzes
      Bild  Ticks davor  ohne  mit
       20        0        32    32
       21        1        34    32
       22        0        34    33
       23        1        35    34
       24        0        35    34
       25        0        35    35
       26        1        37    35
    points:
      - Ohne Interpolation zeigt jedes Bild den Stand des letzten Ticks; Bilder ohne neuen Tick wiederholen die Position, danach springt der Klotz um bis zu 2 Pixel.
      - Mit Interpolation zeichnet Godot Zwischenstände, der Klotz rückt in kleinen, gleichmäßigeren Schritten von 0 oder 1 Pixel vor.
      - Der gezeichnete Stand liegt zwischen zwei vergangenen Ticks und damit hinter der Physik, hier 2 Pixel in Bild 21; das bedeutet zusätzliche Eingabeverzögerung.
    explanation: |
      Ohne Interpolation landet jeder Tick unverändert im nächsten Bild. Bei 144 Bildern und 60 Ticks bekommen manche Bilder keinen Tick, die Position steht, und beim nächsten Tick holt der Klotz 1,5 Pixel auf einmal auf, gerundet 1 oder 2. Mit Interpolation verteilt Godot den Weg auf die Bilder dazwischen, Pixel-Snap rundet auf 0 oder 1. Dafür zeigt jedes Bild einen Stand aus der Vergangenheit: In Bild 21 steht die Kante bei 32 statt 34. Die Doku nennt ein bis zwei Ticks Rückstand und warnt vor mehr Eingabeverzögerung, besonders bei Spielen mit festem Timing.
    resources:
      - title: Godot Docs · Physics interpolation · Introduction
        url: https://docs.godotengine.org/en/stable/tutorials/physics/interpolation/physics_interpolation_introduction.html

  - id: messplan-takte
    type: practice
    title: Ein Messplan für deine Takte
    prompt: |
      Schreib in drei bis fünf Sätzen auf, wie du in deinem Projekt prüfst, ob Bewegung und Timing auf verschiedenen Monitoren gleich sind. Nenne, welche Startoptionen du nutzt, was du dabei zählst oder abliest und wo du es notierst. Welche Ergebnisse du dir wünschst, gehört nicht hinein, nur wie du misst.
    lang: prose
    checklist:
      - Du hast die Bildwiederholrate deines eigenen Monitors notiert.
      - Der Plan nennt mindestens zwei Läufe mit `--fixed-fps` oder `--max-fps` und die Werte, die du dabei vergleichst.
      - Du hast festgelegt, wo du zählst, etwa Ticks im Log oder FPS und Prozessierung im Monitor.
      - Ein Lauf mit und einer ohne Physik-Interpolation stehen darin, und die Entscheidung darüber ist als offen markiert.
      - Für Prozessierung steht dabei, ob VSync an oder aus war.
    hints:
      - Denk an die drei Bildraten aus der Lektion, 30, 60 und 144.
      - Die Ausgabe von `print()` mit `Engine.get_physics_frames()` liefert dir die Tick-Nummer für das Log.
    explanation: |
      Ein Messplan trennt die beiden Takte, bevor du an Werten drehst. Läufe mit festem Takt liefern bei jeder Wiederholung dieselben Zahlen, Läufe in Echtzeit zeigen, was ein Spieler sieht. Wenn du notierst, unter welchen Bedingungen ein Wert entstand, kannst du ihn später mit einer neuen Godot-Version oder einem anderen Rechner vergleichen. Wie sich die Bewegung anfühlen soll, entscheidest du erst danach.
    resources:
      - title: Godot Docs · Command line tutorial
        url: https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html
