id: level-tilemap
title: "2D-Level aus Tiles: TileSet, TileMapLayer und Y-Sortierung"
level: 2
minutes: 170
summary: Aus einem selbst gemachten Prüfmuster ein TileSet bauen, Boden und Wände im Testgelände mit TileMapLayer malen, Wänden Kollision geben, hohe Tiles richtig mit der Figur sortieren und Linien zwischen Tiles erklären und beheben.
place: pc
goals:
  - Du legst ein TileSet aus deinem eigenen Tile-Sheet an und stellst Tilegröße, Abstände, Trennung und Regionsgröße passend zum Bild ein.
  - Du baust ein Level aus mehreren TileMapLayer-Nodes und malst mit den Werkzeugen der TileMap-Leiste.
  - Du gibst Tiles über eine Physik-Ebene im TileSet Kollision, passend zu Layer und Maske der Figur.
  - Du sortierst hohe Tiles mit der Figur über `y_sort_enabled` und `y_sort_origin` und sagst vorher, wann die Figur davor oder dahinter steht.
  - Du rechnest mit `local_to_map()` und `map_to_local()` zwischen Pixeln und Zellen um und erklärst Linien zwischen Tiles mit Filter, Skalierung und Texture Padding.
