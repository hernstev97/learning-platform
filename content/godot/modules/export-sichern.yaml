id: export-sichern
title: Testversionen exportieren und die Arbeit sichern
level: 2
minutes: 130
summary: Aus dem Testgelände eine Version machen, die ohne Editor startet – mit Exportvorlagen, Presets für Linux und Windows, Debug- und Release-Builds und Log-Datei – und das Projekt so in Git sichern, dass ein frischer Klon ohne Nacharbeit läuft.
place: pc
goals:
  - Du installierst Exportvorlagen passend zur Editor-Version und legst Presets für Linux und Windows an.
  - Du exportierst Debug- und Release-Versionen im Editor und mit `--export-release` und `--export-debug` aus dem Terminal und liest die Meldungen, wenn es scheitert.
  - Du startest eine exportierte Version mit `--verbose`, findest ihr Log unter `user://logs/` und erklärst, warum ein Release-Build keinen Backtrace zeigt.
  - Du entscheidest begründet, welche Dateien eines Godot-Projekts ins Repository gehören, und nutzt `.gitignore`, `.gdignore` und bei Bedarf Git LFS.
  - Du sicherst Abstimmungsrunden mit Commits und markierst Testversionen mit Tags.
