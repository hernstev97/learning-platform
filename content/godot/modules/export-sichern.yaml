    url: https://godotengine.org/article/uid-changes-coming-to-godot-4-4/
lesson: |
  Du willst das Testgelände auf dem Laptop ausprobieren, auf dem kein Godot installiert ist, oder einem Freund eine Testversion schicken. Und du willst, dass das Projekt nach einem Plattencrash aus Git wieder genau so entsteht, wie es war, mit allen Import-Einstellungen und ohne den Cache. Beides gehört zusammen: Eine Testversion ist nur so viel wert wie der Stand, aus dem sie gebaut wurde, und den hält Git fest.

  Beides baust du hier am Testgelände: zuerst die Exportvorlagen und Presets, dann Debug- und Release-Builds aus Editor und Terminal, dann die Regeln fürs Repository. Alle Meldungen stammen aus Läufen mit Godot 4.7.2 unter Linux; der Editor war deutsch eingestellt, deshalb sind manche Meldungen deutsch.

  ## Exportvorlagen: Godot ohne Editor

  Ein exportiertes Spiel besteht aus zwei Teilen: einer **Exportvorlage**, also einem fertig gebauten Godot ohne Editor, und den Daten deines Projekts in einer **PCK**-Datei. Für jede Plattform gibt es eine Debug- und eine Release-Vorlage; nur die Debug-Vorlage schreibt zum Beispiel bei Skriptfehlern einen Backtrace ins Log ([Exporting projects](https://docs.godotengine.org/en/stable/tutorials/export/exporting_projects.html#export-templates)). Die Vorlagen lädst du einmal pro Godot-Version. Unter *Editor → Exportvorlagen verwalten …* zeigt der Dialog die Version des Editors, verfügbare und installierte Vorlagen:

  ![Exportvorlagen-Manager: Godot-Version 4.7.2.stable, Verfügbare Vorlagen als Baum mit Desktop, Windows und Linux, Installierte Vorlagen Windows x86_64 und Linux x86_64, unten der Hinweis Offline Modus und der Link Online gehen](/media/godot/export-sichern/exportvorlagen@2x.png "Godot 4.7.2, Exportvorlagen-Manager mit Vorlagen für Linux und Windows")

  Du kannst einzelne Plattformen anhaken und installieren oder über den Knopf oben rechts eine TPZ-Datei mit allen Vorlagen einspielen. Die TPZ für 4.7.2 ist laut GitHub-Release 1 281 349 702 Byte groß, rund 1,3 GB ([Release 4.7.2](https://github.com/godotengine/godot/releases/tag/4.7.2-stable)); für Linux und Windows reichen die einzelnen Vorlagen. Steht unten „Offline Modus“, darf der Editor nichts herunterladen, bis du auf „Online gehen“ klickst.

  Die Vorlagen müssen exakt zur Version passen. Godot sucht sie im Ordner `export_templates/4.7.2.stable/` seiner Editordaten, unter Linux standardmäßig in `~/.local/share/godot/` ([Editor data paths](https://docs.godotengine.org/en/stable/tutorials/io/data_paths.html#editor-data-paths)). Vorlagen für 4.7.1 helfen einem 4.7.2-Editor nicht.

  ## Presets für Linux und Windows

  Unter *Projekt → Exportieren ...* legst du mit *Hinzufügen …* je Zielplattform ein **Export-Preset** an. Ohne passende Vorlage zeigt der Dialog, wo er gesucht hat:

  ![Export-Dialog mit Presets Windows Desktop und Linux; Linux ist gewählt, Export Path leer, PCK einbetten aus; unten rot: Keine Exportvorlage unter dem erwarteten Pfad gefunden, mit den Pfaden zu linux_debug.x86_64 und linux_release.x86_64](/media/godot/export-sichern/export-vorlage-fehlt@2x.png "Godot 4.7.2, Linux-Preset ohne installierte Vorlagen; die Pfade stammen aus dem Testaufbau mit eigenem Datenordner")

  Mit installierten Vorlagen verschwinden die roten Zeilen. Die wichtigen Felder für eine Testversion:

  - **Export Path**: wohin die Datei geht, etwa `build/linux/testgelaende.x86_64`. Relative Pfade gelten ab dem Projektordner.
  - **Ausführbar**: Das Preset steht für die Ein-Klick-Auslieferung auf ein Gerät bereit; je Plattform darf nur eins so markiert sein ([One-click deploy](https://docs.godotengine.org/en/stable/tutorials/export/one-click_deploy.html)).
  - **Konsolenwrapper exportieren**: Standard `Debug Only`. Ein Debug-Export bekommt dann zusätzlich einen Starter mit Konsole: für Linux das Skript `testgelaende.sh`, für Windows `testgelaende.console.exe`.
  - **PCK einbetten**: aus heißt zwei Dateien, Programm und `.pck`; an heißt eine einzige Datei.

  ![Export-Dialog, Linux-Preset mit Export Path build/linux/testgelaende.x86_64, Konsolenwrapper Debug Only, PCK einbetten aus, Architektur x86_64, Texturformat S3TC BPTC an; keine Fehlermeldung](/media/godot/export-sichern/export-preset-linux@2x.png "Godot 4.7.2, Linux-Preset mit installierten Vorlagen")

  Der Editor speichert die Presets als Text in `export_presets.cfg` im Projektordner. Ein Ausschnitt, so wie Godot 4.7.2 ihn geschrieben hat:

  ```ini title=export_presets.cfg
  [preset.1]

  name="Linux"
  platform="Linux"
  export_filter="all_resources"
  export_path="build/linux/testgelaende.x86_64"

  [preset.1.options]

  debug/export_console_wrapper=1
  binary_format/embed_pck=false
  binary_format/architecture="x86_64"
  ```

  Diese Datei gehört ins Repository; die Doku sagt, darin stehe nichts, was man geheim halten müsste. Vertrauliches wie ein Schlüssel zum Verschlüsseln der PCK oder das Passwort für eine Windows-Signatur legt Godot getrennt in `.godot/export_credentials.cfg` ab ([Configuration files](https://docs.godotengine.org/en/stable/tutorials/export/exporting_projects.html#configuration-files)). Im Test stand dort je Preset `script_encryption_key=""`, beim Windows-Preset zusätzlich `codesign/password=""`. Unter *Ressourcen* stellst du ein, was in die PCK kommt; Standard ist „all resources“. Dateien, die keine Ressourcen sind, etwa `.txt` oder `.json`, brauchen dort einen eigenen Filter, und Dateien, deren Name mit einem Punkt beginnt, exportiert Godot nie.

  ## Debug oder Release, und das Log danach

  *Projekt exportieren …* öffnet einen Speicherdialog mit dem Schalter *Exportiere mit Debuginformationen*. Für Testversionen ist der Unterschied wichtig. Mit einem eingebauten Fehler im Testgelände (`$Count` statt `$Counter` in `hud.gd`) meldete der Release-Export:

  ```text
  ERROR: Node not found: "Count" (relative to "/root/Main/HUD").
     at: get_node (scene/main/node.cpp:1975)
  ```

  Der Debug-Export derselben Version:

  ```text
  ERROR: Node not found: "Count" (relative to "/root/Main/HUD").
     at: get_node (scene/main/node.cpp:1975)
     GDScript backtrace (most recent call first):
         [0] @implicit_ready (res://hud.gd:5)
  ```

  Nur der Debug-Build nennt die Zeile in deinem Code. In Release-Builds ist der Backtrace aus Leistungsgründen abgeschaltet, außer du schaltest die Projekteinstellung *Always Track Call Stacks* (`debug/settings/gdscript/always_track_call_stacks`, Standard aus) ein ([Script backtraces](https://docs.godotengine.org/en/stable/tutorials/scripting/logging.html#script-backtraces)). Für Testversionen, die andere spielen, ist Debug deshalb oft die bessere Wahl: Wenn etwas schiefgeht, steht im Log, wo.

  Das Log schreibt ein Desktop-Export ohne weitere Einstellung nach `user://logs/godot.log` ([Built-in file logging](https://docs.godotengine.org/en/stable/tutorials/scripting/logging.html#built-in-file-logging)). Unter Linux ist `user://` für das Testgelände `~/.local/share/godot/app_userdata/Testgelände/` ([user://](https://docs.godotengine.org/en/stable/tutorials/io/data_paths.html#accessing-persistent-user-data-user)). Jeder Start legt ein neues `godot.log` an, das alte heißt danach etwa `godot2026-10-22T07.12.21.log`; fünf Dateien bleiben liegen. Mehr Einzelheiten liefert `--verbose`. Gekürzt aus einem Lauf des Release-Exports, für den Test ohne Fenster und nach 60 Durchläufen beendet:

  ```console
  $ ./build/linux/testgelaende.x86_64 --verbose --headless --quit-after 60
  WorkerThreadPool: 24 threads, 7 max low-priority.
  Godot Engine v4.7.2.stable.official.ed1daf0bf - https://godotengine.org
  …
  Loading resource: res://player.gdc remapped: res://player.gdc
  Completed load for: 'res://player.gd' remapped 'res://player.gdc' at thread -1
  …
  ```

  Die Endung `.gdc` zeigt: Im Export liegen die Skripte nicht als Text, sondern vorverarbeitet. Fehlt neben dem Programm die `.pck`, startet es nicht (der Pfad stammt aus dem Test):

  ```text
  ERROR: Error: Couldn't load project data at path "/tmp/lrn23/d/pcktest". Is the .pck file missing?
  ```

  Das passiert, wenn du nur die `.x86_64`-Datei weitergibst. Mit *PCK einbetten* entsteht eine einzige Datei; im Test war sie 73 534 928 Byte groß, statt 73 519 416 Byte Programm plus 15 508 Byte PCK.

  > [!PRAXIS]
  > Schick Testversionen als Debug-Export mit eingebetteter PCK und bitte darum, bei Problemen die Datei `godot.log` mitzuschicken, nicht einen Screenshot der Fehlermeldung. Notiere zu jeder Testversion den Tag im Repository. Dann weißt du beim Lesen des Logs, welcher Stand lief.

  ## Exportieren aus dem Terminal

  Was der Dialog kann, geht auch ohne Editor-Fenster, mit demselben Preset ([Exporting](https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html#exporting)). `godot` steht für dein Godot-Binary; Fortschrittszeilen sind gekürzt:

  ```console
  $ godot --headless --path . --export-release "Linux" build/linux/testgelaende.x86_64
  Godot Engine v4.7.2.stable.official.ed1daf0bf - https://godotengine.org
  …
  ERROR: Vorlage vorbereiten: Der angegebene Export-Pfad existiert nicht.
     at: add_message (./editor/export/editor_export_platform.h:270)
  ERROR: Project export for preset "Linux" failed.
     at: _fs_changed (editor/editor_node.cpp:1417)
  $ mkdir -p build/linux
  $ godot --headless --path . --export-release "Linux" build/linux/testgelaende.x86_64
  Godot Engine v4.7.2.stable.official.ed1daf0bf - https://godotengine.org
  …
  $ ls build/linux
  testgelaende.pck  testgelaende.x86_64
  ```

  Der Zielordner muss existieren. Ein relativer Pfad gilt ab dem Ordner mit `project.godot`, nicht ab dem Ordner, in dem du gerade stehst; das sagt die Doku, und der Test bestätigt es. `--export-debug` baut den Debug-Build, `--export-pack` nur die PCK. Der Preset-Name muss genau stimmen, auch in Groß- und Kleinschreibung:

  ```console
  $ godot --headless --path . --export-release "linux" build/linux/testgelaende.x86_64
  Godot Engine v4.7.2.stable.official.ed1daf0bf - https://godotengine.org
  ERROR: Invalid export preset name: linux.
  The following presets were detected in this project's `export_presets.cfg`:
          "Windows Desktop"
          "Linux"
     at: _fs_changed (editor/editor_node.cpp:1417)
  ```

  Ein Export aus dem Terminal importiert vorher alles, was nötig ist. Im Test lief er auch in einem frischen Klon ohne `.godot/`, und die exportierte Datei startete ohne Fehler. Das macht ihn zur Grundlage für automatische Builds, wie sie [CI/CD rund um Git](/git/ci-cd) beschreibt.

  ## Was ins Repository gehört

  Ein Godot-Projekt ist fast nur Text, und fast alles davon gehört ins Repository:

  | Datei oder Ordner | Ins Repository? | Warum |
  | --- | --- | --- |
  | `project.godot`, `.tscn`, `.tres`, `.gd` | ja | das Projekt selbst |
  | `.import` neben Bildern und Tönen | ja | Import-Einstellungen; ohne sie importiert ein Klon mit Standardwerten |
  | `.uid` neben Skripten | ja | stabile Verweise, auch wenn Dateien wandern |
  | `export_presets.cfg` | ja | Presets ohne Geheimnisse |
  | `.godot/` | nein | Cache, Importergebnisse, `export_credentials.cfg` |
  | `build/` | nein | Exporte entstehen aus dem Stand neu |

  Die `.gitignore` erzeugt Godot selbst: *Projekt → Versionsverwaltung → Metadaten der Versionsverwaltung erstellen/überschreiben...*, dann Git wählen ([Files to exclude from VCS](https://docs.godotengine.org/en/stable/tutorials/best_practices/version_control_systems.html#files-to-exclude-from-vcs)).

  ![Dialog Versionsverwaltungsmetadaten erstellen: Dateien mit VCS Metadaten erstellen für Git; Hinweis, dass bestehende Dateien überschrieben werden](/media/godot/export-sichern/vcs-metadaten@2x.png "Godot 4.7.2, Projekt → Versionsverwaltung")

  Godot 4.7.2 schrieb damit diese beiden Dateien. Die letzte Zeile der `.gitignore` für den Export-Ordner hast du selbst ergänzt:

  ```text title=.gitignore
  # Godot 4+ specific ignores
  .godot/
  /android/
  /build/
  ```

  ```text title=.gitattributes
  # Normalize EOL for all files that Git considers text files.
  * text=auto eol=lf
  ```

  Die `.uid`-Dateien gibt es seit Godot 4.4. Das Godot-Team schreibt ausdrücklich, dass sie committet werden müssen; sonst brechen auf einem anderen Rechner die UID-Verweise, und Godot fällt mit einer Warnung auf den Pfad zurück ([What happens if I don't commit .uid files](https://godotengine.org/article/uid-changes-coming-to-godot-4-4/#what-happens-if-i-dont-commit-uid-files-to-version-control)). Muster und Regeln der `.gitignore` erklärt [Gute Commits und Commit-Hygiene](/git/commit-hygiene).

  Ein frischer Klon hat kein `.godot/`. Öffnest du ihn einmal im Editor oder rufst `godot --headless --path . --import` auf, baut Godot den Cache neu. Startest du das Spiel direkt, fehlt die Liste der Klassennamen, und es scheitert:

  ```text
  SCRIPT ERROR: Parse Error: Could not find type "MovementStats" in the current scope.
            at: GDScript::reload (res://player.gd:8)
  ```

  ### Originale, große Dateien und `.gdignore`

  Deine Arbeitsdateien aus Aseprite, Krita oder REAPER (`.aseprite`, `.kra`, `.rpp` samt Aufnahmen) importiert Godot nicht, aber exportierte PNG- und WAV-Dateien in denselben Ordnern schon. Zwei Wege halten sie heraus: Die Originale liegen in einem Ordner neben dem Projekt, oder ein Ordner im Projekt bekommt eine leere Datei `.gdignore`. Dann importiert Godot darin nichts, `load()` findet die Dateien nicht, und das Dateisystem-Dock blendet den Ordner aus ([Ignoring specific folders](https://docs.godotengine.org/en/stable/tutorials/best_practices/project_organization.html#ignoring-specific-folders)). Im Test bekam eine PNG im ignorierten Ordner keine `.import`-Datei, und `ResourceLoader.exists()` meldete `false`.

  Große Binärdateien belasten Git: Jede Version einer Datei ist ein eigener Blob in der History ([Das Datenmodell](/git/datenmodell)). Für Aufnahmen und große Arbeitsdateien gibt es **Git LFS**. Es ersetzt die Dateien im Repository durch kleine Verweise und lagert den Inhalt auf dem Server aus. Nach `git lfs install` legst du je Dateityp mit `git lfs track "*.wav"` eine Regel in `.gitattributes` an und committest diese Datei ([Git LFS](https://git-lfs.com/)). Die Doku rät, LFS einzurichten, bevor die ersten großen Dateien committet sind ([Git LFS mit Godot](https://docs.godotengine.org/en/stable/tutorials/best_practices/version_control_systems.html#git-lfs)). Welche Dateitypen du auslagerst und wo deine Originale liegen, entscheidest du nach deinen Werkzeugen und Dateigrößen.

  ## Commits und Tags für Testversionen

  Für Abstimmungsrunden aus [Tuning als Experiment](/combat/tuning) heißt das: ein Commit vor der Runde mit Variante A, einer danach mit B, jeweils mit der geänderten Größe in der Nachricht. Lies vor jedem Commit den Diff der `.import`-Dateien und von `project.godot`; dort fallen Einstellungen auf, die ein Coding-Agent nebenbei geändert hat.

  Eine Testversion markierst du mit einem annotierten Tag, etwa `git tag -a testversion-2026-10-22 -m "Testversion für die Messrunde"`. Den Namen wählst du; wichtig ist, dass du ihn in deinem Protokoll und beim Weitergeben nennst. Tags gehen mit `git push origin <tag>` auf den Server; mehr dazu in [CI/CD rund um Git](/git/ci-cd).

  > [!INTERVIEW]
  > „Ein Kollege klont euer Godot-Projekt, und die Sprites sehen bei ihm anders aus. Was prüfst du?“ Gute Antwort: Ob die `.import`-Dateien im Repository sind, denn ohne sie importiert sein Godot mit Standardwerten. Dann, ob seine Godot-Version gleich ist. Ins Repository gehören Szenen, Ressourcen, Skripte, `.import`- und `.uid`-Dateien und `export_presets.cfg`; `.godot/` und die Exporte nicht. Zugangsdaten für den Export liegen in `.godot/export_credentials.cfg` und bleiben damit lokal.

  ## Häufige Fehler

  - **Vorlagen einer anderen Version.** Godot sucht in `export_templates/4.7.2.stable/`; der Dialog nennt den Pfad.
  - **Zielordner fehlt.** `Der angegebene Export-Pfad existiert nicht.` Vorher `mkdir -p build/linux`.
  - **Preset-Name falsch geschrieben.** Groß- und Kleinschreibung zählen; die Meldung listet die vorhandenen Namen.
  - **Nur die Programmdatei weitergegeben.** Ohne `.pck` startet sie nicht; PCK einbetten oder beide Dateien schicken.
  - **Release-Build zum Fehlersuchen.** Kein Backtrace im Log; für Tests den Debug-Build nehmen.
  - **`.godot/` committet oder `.import`/`.uid` ignoriert.** Das eine bläht das Repository und erzeugt Konflikte, das andere bricht Import-Einstellungen und Verweise beim nächsten Klon.
  - **Klon direkt gestartet.** Ohne Editor-Start oder `--import` fehlen die Klassennamen.
  - **Große Aufnahmen ohne LFS.** Jede Version bleibt für immer in der History.

  ## Zusammenfassung

  - Ein Export ist eine Vorlage plus PCK. Die Vorlagen müssen zur Editor-Version passen und liegen in `export_templates/4.7.2.stable/`.
  - Presets stehen in `export_presets.cfg` und gehören ins Repository; Geheimnisse liegen in `.godot/export_credentials.cfg`.
  - Debug-Builds schreiben einen Backtrace ins Log, Release-Builds nicht. Das Log liegt unter `user://logs/godot.log`.
  - `--export-release` und `--export-debug` brauchen einen vorhandenen Zielordner und den exakten Preset-Namen; relative Pfade gelten ab dem Projektordner.
  - Ins Repository: Projektdateien, `.import`, `.uid`, `export_presets.cfg`. Nicht: `.godot/`, Exporte.
  - Originale liegen neben dem Projekt oder hinter `.gdignore`; große Binärdateien kommen bei Bedarf in Git LFS.
  - Commits rahmen jede Abstimmungsrunde ein, Tags markieren Testversionen.
exercises:
  - id: repo-oder-nicht
    type: choice
    title: Was gehört ins Repository?
    prompt: |
      Welche Dateien des Testgeländes gehören ins Git-Repository?
    options:
      - text: "`export_presets.cfg`"
        correct: true
        why: Die Presets sind Text ohne Geheimnisse; mit ihnen baut jeder Klon dieselbe Testversion.
      - text: "`player.gd.uid`"
        correct: true
        why: Die UID-Dateien halten Verweise stabil. Das Godot-Team sagt ausdrücklich, dass sie committet werden müssen.
      - text: "`.godot/export_credentials.cfg`"
        correct: false
        why: Darin stehen Schlüssel und Passwörter für den Export. Die Datei liegt in `.godot/` und bleibt lokal.
      - text: "`build/linux/testgelaende.x86_64`"
        correct: false
        why: Exporte entstehen aus dem Stand neu. Die Testversion markierst du mit einem Tag, nicht mit der Datei im Repository.
    explanation: |
      Ins Repository gehört, was sich nicht verlustfrei neu erzeugen lässt: Szenen, Ressourcen, Skripte, Import-Einstellungen, UID-Dateien, Presets. Was Godot aus diesen Dateien erzeugt, also den Cache in `.godot/` und die Exporte, bleibt draußen. Die Zugangsdaten liegen absichtlich in `.godot/`, damit sie mit dem Cache ignoriert werden.
    resources:
      - title: Godot Docs · Exporting projects · Configuration files
        url: https://docs.godotengine.org/en/stable/tutorials/export/exporting_projects.html#configuration-files
      - title: Godot Docs · Files to exclude from VCS
        url: https://docs.godotengine.org/en/stable/tutorials/best_practices/version_control_systems.html#files-to-exclude-from-vcs

  - id: export-ablauf
    type: order
    title: Von der Vorlage zur gestarteten Testversion
    prompt: |
      Bring die Schritte in eine Reihenfolge, mit der der erste Linux-Export klappt.
    lang: prose
    lines: |
      Unter Editor → Exportvorlagen verwalten die Vorlagen für 4.7.2 installieren.
      Unter Projekt → Exportieren ein Preset Linux anlegen.
      Den Ordner build/linux anlegen.
      Mit --export-debug in diesen Ordner exportieren.
      Die exportierte Datei mit --verbose starten und das Log lesen.
    alternatives:
      - [1, 3, 2, 4, 5]
      - [3, 1, 2, 4, 5]
      - [2, 1, 3, 4, 5]
      - [2, 3, 1, 4, 5]
      - [3, 2, 1, 4, 5]
    explanation: |
      Vorlagen, Preset und Ordner sind voneinander unabhängig, alle drei müssen aber vor dem Export stehen. Ohne Vorlage meldet der Dialog den fehlenden Pfad, ohne Preset kennt `--export-debug` den Namen nicht, ohne Ordner scheitert der Export mit „Der angegebene Export-Pfad existiert nicht.“ Der Start mit `--verbose` zeigt danach, was die Testversion lädt.
    resources:
      - title: Godot Docs · Exporting projects
        url: https://docs.godotengine.org/en/stable/tutorials/export/exporting_projects.html

  - id: debug-export-dateien
    type: output
    title: Was liegt im Ordner?
    prompt: |
      Das Linux-Preset steht auf den Standardwerten: Konsolenwrapper `Debug Only`, PCK einbetten aus. Du exportierst mit `--export-debug` nach `build/linux-debug/testgelaende.x86_64`. Was zeigt danach `ls build/linux-debug`, eine Datei pro Zeile?
    lang: text
    code: |
      $ godot --headless --path . --export-debug "Linux" build/linux-debug/testgelaende.x86_64
      $ ls build/linux-debug
    expected: |
      testgelaende.pck
      testgelaende.sh
      testgelaende.x86_64
    accept:
      - testgelaende.pck testgelaende.sh testgelaende.x86_64
      - testgelaende.pck  testgelaende.sh  testgelaende.x86_64
    explanation: |
      Ohne eingebettete PCK entstehen Programm und `.pck` getrennt. Der Konsolenwrapper `testgelaende.sh` kommt nur beim Debug-Export dazu, weil die Einstellung auf `Debug Only` steht; er startet das Spiel aus einem Terminal. Gemessen mit Godot 4.7.2: Der Release-Export desselben Presets enthielt nur `testgelaende.pck` und `testgelaende.x86_64`.
    resources:
      - title: Godot Docs · Exporting for Linux
        url: https://docs.godotengine.org/en/stable/tutorials/export/exporting_for_linux.html

  - id: release-meldung
    type: choice
    title: Was der Release-Build verrät
    prompt: |
      In `hud.gd` steht `@onready var counter: Label = $Count`, das Label heißt aber `Counter`. Du startest den **Release**-Export im Terminal. Was steht danach in der Ausgabe?
    options:
      - text: 'Die Meldung `Node not found: "Count" …` mit der Stelle im C++-Quelltext von Godot, aber ohne GDScript-Backtrace.'
        correct: true
        why: Fehler meldet auch der Release-Build. Den Backtrace mit `hud.gd:5` schreibt im Standard nur der Debug-Build.
      - text: 'Die Meldung mit GDScript-Backtrace bis `[0] @implicit_ready (res://hud.gd:5)`.'
        correct: false
        why: So sieht die Ausgabe des Debug-Exports aus. Im Release-Build ist das Mitschreiben der Aufrufkette aus Leistungsgründen aus.
      - text: Nichts, weil ein Release-Build keine Fehler ausgibt.
        correct: false
        why: Fehler und Warnungen gehen auch im Release-Build auf die Fehlerausgabe und ins Log; nur der Backtrace fehlt.
      - text: Eine Fehlermeldung beim Export, weil Godot den falschen Pfad schon beim Exportieren erkennt.
        correct: false
        why: Der Export prüft keine Node-Pfade in Skripten. Der Fehler tritt erst beim Start auf, wenn `@onready` den Pfad auflöst.
    explanation: |
      Gemessen mit Godot 4.7.2: Der Release-Export schrieb `ERROR: Node not found: "Count" (relative to "/root/Main/HUD").` und die Zeile `at: get_node (scene/main/node.cpp:1975)`. Der Debug-Export derselben Version schrieb zusätzlich `GDScript backtrace (most recent call first):` und `[0] @implicit_ready (res://hud.gd:5)`. Die Doku nennt den Grund: In Release-Builds ist der Backtrace abgeschaltet, außer man schaltet `debug/settings/gdscript/always_track_call_stacks` ein. Für Testversionen, bei denen du Fehler suchst, ist der Debug-Export deshalb die bessere Wahl.
    resources:
      - title: Godot Docs · Logging · Script backtraces
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/logging.html#script-backtraces

  - id: relativer-pfad
    type: output
    title: Wo landet der Export?
    prompt: |
      Du stehst in deinem Home-Ordner und rufst auf:

      `godot --headless --path ~/projekte/testgelaende --export-release "Linux" build/linux/testgelaende.x86_64`

      Der Ordner existiert an der richtigen Stelle. Unter welchem Pfad liegt danach die exportierte Datei?
    lang: text
    code: |
      ~ $ godot --headless --path ~/projekte/testgelaende --export-release "Linux" build/linux/testgelaende.x86_64
    expected: |
      ~/projekte/testgelaende/build/linux/testgelaende.x86_64
    accept:
      - $HOME/projekte/testgelaende/build/linux/testgelaende.x86_64
      - projekte/testgelaende/build/linux/testgelaende.x86_64
    explanation: |
      Relative Exportpfade gelten ab dem Ordner mit `project.godot`, nicht ab dem aktuellen Ordner. Die Doku warnt ausdrücklich davor, und im Test mit Godot 4.7.2 landete die Datei bei einem Aufruf aus `/tmp` im Projektordner, `/tmp/build` entstand nicht. Wer in CI-Skripten mit absoluten Pfaden arbeitet, umgeht die Verwechslung.
    resources:
      - title: Godot Docs · Command line tutorial · Exporting
        url: https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html#exporting

  - id: release-exportieren
    type: command
    title: Release-Export aus dem Terminal
    prompt: |
      Exportiere die Release-Version des Presets `Linux` nach `build/linux/testgelaende.x86_64`, ohne dass ein Fenster aufgeht. Der Ordner existiert.
    context: |
      Du bist im Projektordner. `godot` steht für dein Godot-Binary.
    answers:
      - godot --headless --path . --export-release "Linux" build/linux/testgelaende.x86_64
      - godot --headless --export-release "Linux" build/linux/testgelaende.x86_64
      - godot --path . --headless --export-release "Linux" build/linux/testgelaende.x86_64
      - godot --headless --export-release "Linux" build/linux/testgelaende.x86_64 --path .
      - godot --path . --export-release "Linux" build/linux/testgelaende.x86_64 --headless
      - godot --export-release "Linux" build/linux/testgelaende.x86_64 --headless
      - godot --headless --path . --export-release "Linux" ./build/linux/testgelaende.x86_64
      - godot --headless --export-release "Linux" ./build/linux/testgelaende.x86_64
    explanation: |
      `--export-release` nimmt den Preset-Namen und den Zielpfad. `--headless` verhindert das Fenster; auf Rechnern ohne Grafik, etwa in CI, ist es Pflicht. Im Projektordner kannst du `--path .` weglassen. `--export-debug` hätte denselben Aufbau und baut den Debug-Build.
    resources:
      - title: Godot Docs · Command line tutorial · Exporting
        url: https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html#exporting

  - id: testversion-taggen
    type: command
    title: Die Testversion markieren
    prompt: |
      Setze auf den aktuellen Commit einen **annotierten** Tag `testversion-2026-10-22` mit der Nachricht `Testversion für die Messrunde`.
    answers:
      - git tag -a testversion-2026-10-22 -m "Testversion für die Messrunde"
      - git tag -a -m "Testversion für die Messrunde" testversion-2026-10-22
      - git tag testversion-2026-10-22 -a -m "Testversion für die Messrunde"
      - git tag -m "Testversion für die Messrunde" testversion-2026-10-22
      - git tag testversion-2026-10-22 -m "Testversion für die Messrunde"
      - git tag -am "Testversion für die Messrunde" testversion-2026-10-22
      - git tag -a testversion-2026-10-22 -m "Testversion für die Messrunde" HEAD
      - git tag -a testversion-2026-10-22 HEAD -m "Testversion für die Messrunde"
      - git tag -m "Testversion für die Messrunde" testversion-2026-10-22 HEAD
    explanation: |
      Ein annotierter Tag ist ein eigenes Objekt mit Autor, Datum und Nachricht; `-m` allein impliziert `-a`. So steht im Repository, welcher Stand als Testversion rausging. Den Tag nennst du im Protokoll und beim Weitergeben; mit `git push origin testversion-2026-10-22` kommt er auf den Server. Das Namensschema ist ein Platzhalter, du legst es fest.
    resources:
      - title: Git · git-tag
        url: https://git-scm.com/docs/git-tag

  - id: gitignore-ergaenzen
    type: gap
    title: Die .gitignore des Testgeländes
    prompt: |
      Ergänze die `.gitignore` so, dass der Cache von Godot und der Export-Ordner `build` im Projektordner nicht ins Repository kommen.
    lang: text
    code: |
      # Godot 4+ specific ignores
      ⟦.godot/⟧
      /android/
      # Exporte
      ⟦/build/⟧
    gaps:
      - label: Cache und Importergebnisse
        hint: Der versteckte Ordner, den Godot beim ersten Öffnen anlegt.
        accept: [".godot"]
      - label: Export-Ordner
        hint: Mit Schrägstrich am Anfang gilt das Muster nur im Projektordner.
        accept: ["build/", "/build"]
    explanation: |
      `.godot/` enthält Cache, Importergebnisse und `export_credentials.cfg`; Godot erzeugt ihn bei jedem Öffnen neu. Die ersten drei Zeilen schreibt Godot 4.7.2 selbst, wenn du unter *Projekt → Versionsverwaltung* die Metadaten für Git erstellst. `/build/` ergänzt du für deine Exporte. Ein Schrägstrich am Anfang verankert das Muster am Projektordner, einer am Ende passt nur auf Ordner.
    resources:
      - title: Godot Docs · Files to exclude from VCS
        url: https://docs.godotengine.org/en/stable/tutorials/best_practices/version_control_systems.html#files-to-exclude-from-vcs
      - title: Git · gitignore · Pattern Format
        url: https://git-scm.com/docs/gitignore#_pattern_format

  - id: eine-datei-weitergeben
    type: bug
    title: Der Freund sieht nur eine Fehlermeldung
    prompt: |
      Du willst Testversionen als eine einzige Datei weitergeben. Dein Freund startet `testgelaende.x86_64` und bekommt `Couldn't load project data at path … Is the .pck file missing?`. Finde in `export_presets.cfg` die Zeile und korrigiere sie.
    lang: ini
    code: |
      [preset.1.options]

      custom_template/debug=""
      custom_template/release=""
      debug/export_console_wrapper=1
      binary_format/embed_pck=false
      texture_format/s3tc_bptc=true
      binary_format/architecture="x86_64"
    lines: [6]
    fix:
      - line: 6
        answers:
          - binary_format/embed_pck=true
    explanation: |
      Mit `embed_pck=false` schreibt der Export Programm und `.pck` getrennt; wer nur das Programm bekommt, kann es nicht starten. Mit `true` hängt Godot die PCK an das Programm an. Gemessen mit Godot 4.7.2: 73 534 928 Byte in einer Datei statt 73 519 416 plus 15 508 Byte in zweien, und die eine Datei startete ohne Fehler. Im Dialog heißt die Einstellung *PCK einbetten*.
    resources:
      - title: Godot Docs · PCK versus ZIP pack file formats
        url: https://docs.godotengine.org/en/stable/tutorials/export/exporting_projects.html#pck-versus-zip-pack-file-formats

  - id: gitignore-zu-streng
    type: bug
    title: Nach dem Klonen gilt wieder der Standard
    prompt: |
      Am PC hast du im Import-Dock für deinen Prüfton eine Einstellung geändert und auf *Neuimport* geklickt. Auf dem Laptop klonst du das Repository, und dort gilt für den Prüfton wieder der Standard. Außerdem zeigt `git status` am PC bei neuen Skripten immer nur die `.gd`-Datei, nie die `.gd.uid` daneben. Finde die beiden Zeilen der `.gitignore`, die das verursachen.
    lang: text
    code: |
      # Godot 4+ specific ignores
      .godot/
      /android/
      *.import
      *.uid
      /build/
    lines: [4, 5]
    explanation: |
      Die Import-Einstellungen stehen in der `.import`-Datei neben der Quelle. Ist sie ignoriert, legt Godot auf dem Laptop eine neue mit Standardwerten an. Die `.uid`-Dateien enthalten die IDs, über die Szenen auf Skripte verweisen; das Godot-Team schreibt, dass sie committet werden müssen, weil sonst auf anderen Rechnern die UID-Verweise brechen und Godot mit einer Warnung auf den Pfad zurückfällt. Beide Zeilen gehören gelöscht, die Dateien danach committet. Ignoriert wird nur, was Godot ohne Verlust neu erzeugt.
    resources:
      - title: Godot Blog · UID changes coming to Godot 4.4
        url: https://godotengine.org/article/uid-changes-coming-to-godot-4-4/#what-happens-if-i-dont-commit-uid-files-to-version-control
      - title: Godot Docs · Import process
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/import_process.html

  - id: credentials-erklaeren
    type: explain
    title: Zwei Dateien für einen Export
    prompt: |
      Godot speichert die Export-Einstellungen in zwei Dateien. Erkläre in wenigen Sätzen, warum, was jeweils drinsteht und was das für Git und für einen zweiten Rechner bedeutet.
    lang: ini
    code: |
      ; export_presets.cfg (Projektordner)
      [preset.1]
      name="Linux"
      export_path="build/linux/testgelaende.x86_64"

      ; .godot/export_credentials.cfg
      [preset.1]
      script_encryption_key=""
    points:
      - "`export_presets.cfg` enthält Plattform, Pfad und Optionen ohne Geheimnisse und gehört ins Repository."
      - "`export_credentials.cfg` enthält Schlüssel und Passwörter, etwa für Verschlüsselung oder Signatur, und liegt in `.godot/`."
      - Weil `.godot/` ignoriert wird, bleiben die Geheimnisse lokal und gelangen nicht in die History.
      - Auf einem zweiten Rechner fehlen diese Werte; du kopierst die Datei von Hand oder trägst sie neu ein.
    explanation: |
      Die Trennung hält Geheimnisse aus Git heraus, ohne dass du die Presets auf jedem Rechner neu anlegen musst. `export_presets.cfg` beschreibt, was gebaut wird, und gehört ins Repository. `.godot/export_credentials.cfg` enthält, was niemand sehen soll, etwa den Schlüssel für eine verschlüsselte PCK oder das Passwort für die Windows-Signatur. Weil die Datei im ignorierten `.godot/` liegt, fehlt sie in jedem Klon; die Doku empfiehlt, sie bei Bedarf von Hand zu kopieren.
    resources:
      - title: Godot Docs · Exporting projects · Configuration files
        url: https://docs.godotengine.org/en/stable/tutorials/export/exporting_projects.html#configuration-files

  - id: testversion-bauen
    type: practice
    title: Zwei Testversionen bauen und taggen
    prompt: |
      Installiere die Exportvorlagen für deine Godot-Version, lege im Testgelände Presets für Linux und Windows an und exportiere beide als Debug-Build aus dem Terminal. Starte den Linux-Export mit `--verbose`, finde sein Log und markiere den Stand mit einem Tag.
    lang: text
    solution: |
      $ mkdir -p build/linux build/windows
      $ godot --headless --path . --export-debug "Linux" build/linux/testgelaende.x86_64
      $ godot --headless --path . --export-debug "Windows Desktop" build/windows/testgelaende.exe
      $ ls build/linux build/windows
      build/linux:
      testgelaende.pck  testgelaende.sh  testgelaende.x86_64

      build/windows:
      testgelaende.console.exe  testgelaende.exe  testgelaende.pck
      $ ./build/linux/testgelaende.x86_64 --verbose
      $ ls ~/.local/share/godot/app_userdata/Testgelände/logs/
      $ git tag -a testversion-2026-10-22 -m "Testversion für die Messrunde"

      .gitignore enthält /build/, export_presets.cfg ist committet.
    checklist:
      - Der Exportvorlagen-Manager zeigt deine Editor-Version und die installierten Vorlagen für Linux und Windows.
      - "`export_presets.cfg` liegt im Projektordner, ist committet und enthält die Presets `Linux` und `Windows Desktop`."
      - Beide Exporte entstanden aus dem Terminal ohne Fehlermeldung.
      - Der Linux-Export startet, und du hast `godot.log` unter `user://logs/` geöffnet.
      - "`git status` zeigt nichts aus `build/` und nichts aus `.godot/`."
      - Der Tag zeigt auf den exportierten Stand, und du hast ihn notiert.
    explanation: |
      Die Reihenfolge Vorlagen, Presets, Ordner, Export ist die aus der Lektion. Den Windows-Export erzeugst du unter Linux ohne zusätzliche Werkzeuge; ob er startet, prüfst du auf einem Windows-Rechner. Im Test mit Godot 4.7.2 entstanden beim Debug-Export für Windows ohne eingebettete PCK drei Dateien: `testgelaende.exe`, `testgelaende.pck` und `testgelaende.console.exe`, der Starter mit Konsolenfenster aus der Einstellung *Konsolenwrapper exportieren*. Der Tag verbindet die Dateien, die du weitergibst, mit genau einem Commit.
    resources:
      - title: Godot Docs · Exporting for Windows
        url: https://docs.godotengine.org/en/stable/tutorials/export/exporting_for_windows.html
      - title: Godot Docs · Exporting for Linux
        url: https://docs.godotengine.org/en/stable/tutorials/export/exporting_for_linux.html

  - id: ablage-regeln
    type: practice
    title: Deine Regeln für Originale und große Dateien
    prompt: |
      Leg für dein Projekt fest, wo deine Arbeitsdateien liegen und wie sie gesichert werden. Schreib in fünf bis acht Sätzen auf: welche Werkzeuge du nutzt und welche Dateitypen dabei entstehen, wo die Originale liegen, welche exportierten Dateien ins Godot-Projekt kommen, welche Dateitypen du in Git LFS legst oder warum nicht, und wann du committest.
    lang: prose
    checklist:
      - Jeder Dateityp deiner Werkzeuge ist einem Ort zugeordnet, im Projekt, neben dem Projekt oder hinter `.gdignore`.
      - Du hast die Größe deiner größten Arbeitsdatei nachgesehen und notiert.
      - Für Git LFS steht eine Entscheidung mit Begründung da, ja oder nein.
      - Die Regel für Commits nennt einen Anlass, etwa vor und nach jeder Abstimmungsrunde.
      - Du hast die Regeln an einem Ordner deines Projekts geprüft, und `git status` zeigt nichts Ungewolltes.
    hints:
      - Denk an REAPER-Projekte mit Aufnahmen und an Aseprite- oder Krita-Dateien mit Ebenen.
      - "`du -h` zeigt dir im Terminal die Größe von Dateien und Ordnern."
    explanation: |
      Wo Originale liegen, hängt an deinen Werkzeugen und daran, wie groß ihre Dateien werden; dafür gibt es keine Regel, die für alle passt. Wichtig ist, dass jede Datei einen festen Ort hat und dass Godot nur importiert, was ins Spiel soll. Git LFS lohnt sich für große, oft geänderte Binärdateien, kostet aber Einrichtung und Speicher auf dem Server. Deine Regeln gehören in das Projekt, etwa als Abschnitt in einer README, damit ein Coding-Agent sie ebenfalls befolgt.
    resources:
      - title: Godot Docs · Ignoring specific folders
        url: https://docs.godotengine.org/en/stable/tutorials/best_practices/project_organization.html#ignoring-specific-folders
      - title: Git LFS
        url: https://git-lfs.com/
