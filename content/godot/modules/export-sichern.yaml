  - title: Godot Docs · Command line tutorial · Exporting
    url: https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html#exporting
  - title: Godot Docs · Version control systems
    url: https://docs.godotengine.org/en/stable/tutorials/best_practices/version_control_systems.html
  - title: Godot Docs · Logging
    url: https://docs.godotengine.org/en/stable/tutorials/scripting/logging.html
