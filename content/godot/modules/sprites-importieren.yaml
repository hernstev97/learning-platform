lesson: |
  Du exportierst aus Aseprite ein Blatt mit vier Bildern, ziehst es ins Projekt und setzt es in ein `Sprite2D`. Im Spiel steht dann das ganze Blatt auf einmal da, halb im Boden versunken. Stellst du die Zahl der Felder falsch ein, siehst du halbe Bilder. Und ein Kollege meldet, auf seinem Rechner sei die Grafik verschmiert, obwohl in deinem Projekt alles scharf ist.

  Alle drei Fehler entstehen zwischen deiner Datei und dem Bild im Spiel: beim Import, beim Zerlegen des Blatts und beim Ursprung. Dieses Modul geht diesen Weg einmal vollständig durch. Statt einer Figur nimmst du einen Testbogen, ein technisches Prüfmuster, das du selbst in zwei Minuten anlegst. Wie deine Figuren aussehen und wie groß ihre Felder sind, entscheidest du später selbst. Die 16 × 16 Pixel hier sind ein Platzhalter. Wie die Pixel danach auf den Bildschirm kommen, behandelt [Pixelraster und Skalierung](/godot/pixelraster).

  ## Die Import-Pipeline: Quelle, .import und .godot/imported

  Legst du `test_sheet.png` in den Projektordner, importiert Godot sie sofort. Die PNG bleibt unverändert liegen. Daneben entsteht `test_sheet.png.import` mit den Einstellungen, und im versteckten Ordner `.godot/imported/` liegt das Ergebnis, das das Spiel lädt ([Files generated](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/import_process.html#files-generated)). So sieht die Datei aus, die Godot 4.7.2 für den Testbogen geschrieben hat (gekürzt):

  ```ini title=test_sheet.png.import
  [remap]

  importer="texture"
  type="CompressedTexture2D"
  uid="uid://bnbb5aa4yerph"
  path="res://.godot/imported/test_sheet.png-142e95a07cea5c3d31f4022e607774aa.ctex"

  [deps]

  source_file="res://test_assets/test_sheet.png"

  [params]

  compress/mode=0
  mipmaps/generate=false
  process/fix_alpha_border=true
  process/size_limit=0
  detect_3d/compress_to=1
  ```

  Die `uid` ist eine feste Kennung der Ressource. Szenen nennen sie neben dem Pfad; nach dem Speichern steht in `player.tscn` beim Testbogen `uid="uid://bnbb5aa4yerph"`. In `.godot/imported/` stehen dazu eine `.ctex` (die fertige Textur) und eine `.md5` (Prüfsumme). Ändert sich die PNG, importiert Godot sie automatisch neu ([Automatic reimport](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/import_process.html#automatic-reimport)). Löschst du `.godot/`, entsteht alles beim nächsten Start neu.

  Für Webentwickler: Das ist ein Bundler. Die Quelle in `src/` bleibt, das Ergebnis landet mit Hash im Namen in einem Ausgabeordner, und die Konfiguration bestimmt, wie umgewandelt wird. Der Unterschied: In Godot steht die Konfiguration pro Datei direkt neben der Quelle, nicht zentral in einer `vite.config.ts`.

  Daraus folgt, was ins Repository gehört: die PNG und die `.import`-Datei ja, `.godot/` nein. Die Doku sagt ausdrücklich, dass die `.import`-Dateien wichtige Metadaten enthalten. Ohne sie importiert jeder Rechner mit Standardwerten, und genau so entsteht das verschmierte Bild beim Kollegen. Mehr zu `.gitignore` und großen Dateien in [Testversionen und Sicherung](/godot/export-sichern).

  > [!MERKE]
  > Die Quelle bleibt unverändert, die Einstellungen stehen in `.import`, das Ergebnis in `.godot/imported`. Die ersten beiden versionierst du, das dritte erzeugt Godot.

  ## Das Import-Dock: was für Pixelart zählt

  Wählst du die PNG im Dock *Dateisystem* (FileSystem), zeigt das Dock *Importieren* (Import) ihre Einstellungen ([Changing import parameters](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/import_process.html#changing-import-parameters)). In Godot 4.7.2 mit deutscher Oberfläche sind dort auch die Optionsnamen übersetzt, anders als im Inspektor:

  ![Import-Dock für test_sheet.png: Importiere als Texture2D, Komprimieren Modus Lossless, Mipmaps Erzeugen aus, Prozessierung mit Alpharand beheben an und Größenbeschränkung 0, 3D Erkennen Komprimieren zu VRAM Compressed](/media/godot/sprites-importieren/import-dock.png "Godot 4.7.2, Import-Dock mit den Standardwerten für eine PNG")

  | Im Dock | Original | Standard | Für Pixelart |
  | --- | --- | --- | --- |
  | Komprimieren → Modus | Compress → Mode | Lossless | Lossless lassen |
  | Mipmaps → Erzeugen | Mipmaps → Generate | aus | aus lassen |
  | Prozessierung → Alpharand beheben | Fix Alpha Border | an | an lassen |
  | Prozessierung → Größenbeschränkung | Size Limit | 0 | 0 lassen |
  | 3D Erkennen → Komprimieren zu | Detect 3D → Compress To | VRAM Compressed | wirkt nur, wenn die Textur in 3D benutzt wird |

  Die Standardwerte passen für 2D-Pixelart. Gefährlich wird es, wenn jemand sie ändert. **Lossless** speichert jedes Pixel exakt und ist laut Doku die Empfehlung für Pixelart ([Compress Mode](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_images.html#compress-mode)). **VRAM Compressed** spart Grafikspeicher, verfälscht aber Farben in kleinen Blöcken. **Größenbeschränkung** verkleinert große Texturen beim Import mit kubischer Interpolation ([Size Limit](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_images.html#process-size-limit)). Gemessen mit dem Prüfmuster aus 4 Farben:

  ![Drei Prüfmuster im Spiel: Lossless scharf, VRAM Compressed mit dunklen Flecken und verschobenen Farben, Größenbeschränkung 16 halb so groß und grau verwaschen](/media/godot/sprites-importieren/import-varianten@2x.png "Godot 4.7.2, dieselbe PNG mit drei Import-Einstellungen, Spielbild vierfach vergrößert")

  Lossless liefert die 4 Farben der Quelle, VRAM Compressed nach dem Entpacken 13, Größenbeschränkung 16 ein Bild mit 16 × 16 Pixeln und 32 Farben. **Mipmaps** sind kleinere Kopien für verkleinerte Darstellung; in 2D kosten sie laut Doku rund 33 % mehr Speicher und lohnen sich nur, wenn die Kamera stark herauszoomt ([Mipmaps](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_images.html#mipmaps-generate)).

  Über der Liste steht *Importiere als* (Import As). Für Sprites bleibt es `Texture2D`. Daneben öffnet *Vorgabe* (Preset) ein Menü mit „2D/3D (Autoerkennung)“, „2D“, „3D“ und „Als Default für ‚Texture2D‘ setzen“. Eine Vorgabe „2D Pixel“ wie in Godot 3 gibt es in 4.7 nicht, denn der Texturfilter ist seit Godot 4.0 keine Importeinstellung mehr ([Import options](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_images.html#import-options)). Projektweite Standards pro Dateityp findest du unter *Projekt → Projekteinstellungen → Import-Default-Werte*.

  > [!WARNING] Erst Neuimport, dann weiter
  > Änderungen im Import-Dock gelten erst nach einem Klick auf *Neuimport* (Reimport). Wählst du vorher eine andere Datei, sind sie verloren ([Changing import parameters](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/import_process.html#changing-import-parameters)). Wählst du mehrere Dateien zugleich, steht vor jeder Option ein Kästchen; nur die angekreuzten Optionen ändern sich bei allen ([Reimporting multiple assets](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/import_process.html#reimporting-multiple-assets)).

  ## Filter: Projektstandard und texture_filter am Node

  Ob ein Sprite beim Vergrößern scharf bleibt, entscheidet der Filter beim Zeichnen, nicht der Import. Das Testgelände stellt ihn für das ganze Projekt auf Nearest: In `project.godot` steht `textures/canvas_textures/default_texture_filter=0` ([default_texture_filter](https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-rendering-textures-canvas-textures-default-texture-filter)). Jeder Node kann das überschreiben: Im Inspektor unter *CanvasItem → Texture → Filter* (`texture_filter`) stehen *Inherit*, *Nearest*, *Linear* und Varianten mit Mipmaps ([texture_filter](https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#class-canvasitem-property-texture-filter)). *Inherit* übernimmt den Wert des Elternknotens, am Ende den des Projekts.

  Vorsicht beim Lesen der Textdateien: Die beiden Einstellungen zählen verschieden.

  | Wert | `project.godot` | `texture_filter` in `.tscn` |
  | --- | --- | --- |
  | 0 | Nearest | Inherit (Zeile fehlt meist ganz) |
  | 1 | Linear | Nearest |
  | 2 | Linear Mipmap | Linear |

  Godot 4.7.2 schreibt `texture_filter = 1` für Nearest und `texture_filter = 2` für Linear in die Szene, gemessen. Stell den Filter einmal im Projekt ein und lass die Nodes auf *Inherit*. Ein einzelnes Sprite auf Linear fällt im Stretch Mode `viewport` erst auf, wenn es skaliert, gedreht oder zwischen Pixeln steht, im Modus `canvas_items` sofort ([Pixelraster](/godot/pixelraster)).

  ## Sprite2D: Raster, Ausschnitt und Ursprung

  Ein `Sprite2D` zeigt eine Textur. Ein Spritesheet teilt es selbst in Felder: `hframes` ist die Zahl der Spalten, `vframes` die der Zeilen, `frame` das gezeigte Feld, gezählt ab 0 von links oben, zeilenweise ([hframes](https://docs.godotengine.org/en/stable/classes/class_sprite2d.html#class-sprite2d-property-hframes)). `frame_coords` ist dasselbe als Spalte und Zeile. Die Feldgröße rechnet Godot aus: Breite der Textur durch `hframes`. Für Blätter mit mehreren Zeilen nimmst du einen zweiten Testbogen `test_sheet_4x2.png`: 64 × 32 Pixel, zwei Zeilen zu je vier Feldern, nummeriert 1 bis 8.

  ![Inspektor eines Sprite2D: Texture mit dem Testbogen aus vier Feldern, Offset mit Centered an und Offset y −8, Animation mit Hframes 4, Vframes 1, Frame 0](/media/godot/sprites-importieren/inspector-sprite2d.png "Godot 4.7.2, Inspektor des Sprite2D mit dem Testbogen")

  Gemessen mit `get_rect()` am Testbogen (64 × 16, vier Felder):

  ```gdscript
  sprite.hframes = 4
  print(sprite.get_rect())   # [P: (-8.0, -8.0), S: (16.0, 16.0)]
  sprite.hframes = 8
  print(sprite.get_rect())   # [P: (-4.0, -8.0), S: (8.0, 16.0)]
  sprite.hframes = 2
  print(sprite.get_rect())   # [P: (-16.0, -8.0), S: (32.0, 16.0)]
  ```

  Stimmt `hframes` nicht mit dem Blatt überein, zeigt jedes Feld ein halbes oder ein doppeltes Bild:

  ![Drei Zeilen mit dem Testbogen: bei hframes 4 die vier Felder mit Nummer 1 bis 4, bei hframes 8 nur halbe Felder, bei hframes 2 je zwei Felder auf einmal](/media/godot/sprites-importieren/hframes-vergleich@2x.png "Godot 4.7.2, Frames 0 bis 3 (unten 0 und 1) bei verschiedenen hframes")

  Für einen Ausschnitt ohne Raster gibt es **Region**: `region_enabled` an, und `region_rect` bestimmt das Rechteck in Pixeln. Dieselbe Idee als Ressource heißt `AtlasTexture`: eine Textur, die nur einen Teil einer anderen zeigt und überall verwendbar ist, wo eine Textur erwartet wird ([AtlasTexture](https://docs.godotengine.org/en/stable/classes/class_atlastexture.html)). SpriteFrames legt solche AtlasTextures an, wenn du Frames aus einem Sheet holst ([Animationen zuordnen](/godot/animationen)).

  ### Der Ursprung gehört an die Füße

  Standardmäßig ist `centered` an: Der Ursprung des Nodes liegt in der Mitte des Felds. Für eine Draufsicht mit Y-Sortierung brauchst du ihn an den Füßen, denn Godot sortiert nach der Position des Nodes. Steht der Ursprung in der Mitte, wird die Figur hinter einer Kiste gezeichnet, obwohl ihre Füße schon davor stehen, denn ihre Mitte liegt noch höher als der Ursprung der Kiste. Im Testgelände liegt der Ursprung des Players deshalb an den Füßen; die Form `Feet` sitzt bei y = −3.

  ![Zwei Felder des Testbogens mit gelbem Kreuz am Ursprung des Nodes: links in der Mitte des Felds, rechts an der Unterkante](/media/godot/sprites-importieren/ursprung@2x.png "Godot 4.7.2, links offset (0, 0), rechts offset (0, −8), gelb der Ursprung des Nodes")

  Zwei Wege führen dahin, beide gemessen mit demselben Ergebnis `[P: (-8.0, -16.0), S: (16.0, 16.0)]`: `centered` an und `offset = Vector2(0, -8)` (halbe Feldhöhe nach oben), oder `centered` aus und `offset = Vector2(-8, -16)`. Der erste Weg passt, solange das Feld gerade Maße hat. Bei ungerader Breite liegt die Mitte zwischen zwei Pixeln, die Doku warnt dann vor verzerrten Sprites ([centered](https://docs.godotengine.org/en/stable/classes/class_sprite2d.html#class-sprite2d-property-centered)). Gemessen mit den Einstellungen des Testgeländes (Snap an): Ein 15 × 15 großes Muster zentriert bei (40, 40) erscheint unverzerrt ab Pixel (33, 33), der Ursprung liegt also einen halben Pixel neben der Mitte. `flip_h` spiegelt das Bild im selben Rechteck. Liegt die Fußmarke nicht mittig im Feld, springt die Figur beim Spiegeln zur Seite.

  ## Aus Aseprite und Krita exportieren

  `hframes` und `vframes` funktionieren nur mit einem gleichmäßigen Raster ohne Abstände: jedes Feld gleich groß, keine Lücke zwischen den Feldern, kein Rand. Die Aseprite-Doku beschreibt die Optionen an der Kommandozeile ([CLI](https://www.aseprite.org/docs/cli/)); im Dialog *File → Export Sprite Sheet* stehen sie unter ähnlichen Namen.

  | Option in Aseprite | Wirkung | Für `hframes` |
  | --- | --- | --- |
  | `--sheet-type` horizontal, rows | Felder in einer Zeile oder in Zeilen | passt |
  | `--sheet-pack` | dichte Packung ohne Raster | passt nicht |
  | `--trim` | schneidet leere Ränder je Bild ab | zerstört das Raster |
  | `--shape-padding`, `--border-padding` | Abstand zwischen Feldern, Rand ums Blatt | passt nicht |
  | `--ignore-empty`, `--merge-duplicates` | lässt Bilder weg | verschiebt die Nummern |
  | `--scale` | vergrößert beim Export | lass es bei 1 |

  Trimmen ([trim](https://www.aseprite.org/docs/cli/#trim)) macht aus gleich großen Feldern verschieden große. Dann teilt `hframes` an den falschen Stellen, und die Figur springt von Frame zu Frame. Exportiere in der Größe 1:1; vergrößert wird erst im Spiel.

  Krita rendert Animationen über *File → Render Animation* als Bildfolge mit einer PNG je Frame ([Export as Image Sequence](https://docs.krita.org/en/reference_manual/render_animation.html#export-as-image-sequence)). Die Option *Only Unique Frames* lässt dabei gehaltene Bilder weg, dann fehlt das Timing. Einzelbilder ziehst du direkt in ein SpriteFrames, ohne Sheet. Für ein `Sprite2D` mit `hframes` brauchst du ein Blatt.

  Die Quelldateien (`.aseprite`, `.kra`) bewahrst du auf, denn aus ihnen exportierst du neu. Legst du sie in einen Ordner mit einer leeren Datei `.gdignore`, importiert Godot nichts daraus und blendet den Ordner im Dateisystem aus ([Ignoring specific folders](https://docs.godotengine.org/en/stable/tutorials/best_practices/project_organization.html#ignoring-specific-folders)). Die Alternative ist ein Ordner neben dem Projekt. Wie du sie in Git sicherst, steht im Modul zu Export und Sicherung.

  > [!PRAXIS]
  > Ein Coding-Agent ändert gern Import-Einstellungen nebenbei, etwa „Mipmaps an für bessere Qualität“. Lies deshalb bei jedem Commit den Diff der `.import`-Dateien. Eine geänderte Zeile `compress/mode=2` oder `process/size_limit` fällt dort sofort auf, im Spiel erst, wenn jemand genau hinsieht.

  ## Der Testbogen: ein Prüfmuster statt einer Figur

  Bevor deine eigenen Figuren ins Projekt kommen, prüfst du die Kette mit einem Bild, bei dem jeder Fehler auffällt. Der Testbogen dieses Kurses ist 64 × 16 Pixel groß, vier Felder zu 16 × 16:

  - eine graue Rasterlinie am Rand jedes Felds: Fehlt sie oder ist sie doppelt, stimmt `hframes` nicht,
  - die Nummer 1 bis 4: zeigt, welches Feld gerade läuft,
  - ein Block, der von Feld zu Feld weiterrückt: macht die Animation sichtbar,
  - eine rote Fußmarke von 2 Pixeln unten in der Mitte: muss genau am Ursprung des Nodes stehen.

  So einen Bogen legst du in Aseprite oder Krita in zwei Minuten an: neues Bild 64 × 16, Raster auf 16 × 16, Linien und Ziffern mit dem Stift. Er ist ein Messwerkzeug wie ein Testbild im Fernsehen, keine Grafik für dein Spiel. Leg ihn als `res://test_assets/test_sheet.png` ab. Im Testgelände bekommt der Player ein `Sprite2D` namens `Sprite` mit diesem Bogen; den Platzhalter `Body` schaltest du unsichtbar, statt ihn zu löschen. In [Animationen zuordnen](/godot/animationen) wird daraus ein `AnimatedSprite2D`.

  > [!INTERVIEW]
  > „Die Grafik sieht im Spiel anders aus als in Aseprite. Wie findest du die Ursache?“ Gute Antwort, etwa für eine Stelle als Technical Artist: Ich prüfe die Kette von hinten. Zuerst das Import-Dock und den Diff der `.import`-Datei: Lossless, keine Größenbeschränkung, keine Mipmaps. Dann den Filter im Projekt und am Node. Dann `hframes`, `vframes` und `offset` am Sprite. Zum Schluss Stretch Mode und Kamera. Statt der Figur nehme ich ein Prüfmuster, damit ich sehe, ob ein Pixel fehlt.

  ## Häufige Fehler

  - **`.import` nicht versioniert.** Auf einem anderen Rechner importiert Godot mit Standardwerten. `.png` und `.png.import` gehören immer zusammen in den Commit.
  - **Import geändert, aber nicht neu importiert.** Ohne Klick auf *Neuimport* bleibt das alte Ergebnis.
  - **VRAM Compressed oder Größenbeschränkung bei Pixelart.** Farben verschieben sich, Kanten verschwimmen. Zurück auf Lossless und 0.
  - **Filter am Node statt im Projekt.** Ein Sprite mit `texture_filter = 2` ist Linear, auch wenn das Projekt auf Nearest steht.
  - **`hframes` falsch.** Halbe oder doppelte Felder. Breite des Blatts durch Feldbreite rechnen.
  - **Getrimmt oder mit Abstand exportiert.** Das Raster stimmt nicht mehr, die Figur springt.
  - **Ursprung in der Mitte.** Y-Sortierung sortiert nach der Mitte des Bildes; die Figur steht halb hinter Dingen, vor denen sie steht.

  ## Zusammenfassung

  - Quelle, `.import` und `.godot/imported`: Die ersten beiden gehören ins Repository, den Ordner `.godot/` erzeugt Godot selbst.
  - Die Standardwerte im Import-Dock passen für Pixelart: Lossless, keine Mipmaps, Größenbeschränkung 0. Änderungen gelten erst nach *Neuimport*.
  - Der Filter ist seit Godot 4 eine Zeicheneinstellung: im Projekt `default_texture_filter=0` für Nearest, am Node `texture_filter`, wo 1 Nearest und 2 Linear heißt.
  - `hframes` und `vframes` teilen ein Blatt in gleich große Felder; `frame` zählt ab 0 zeilenweise.
  - Region und `AtlasTexture` schneiden Rechtecke aus einer größeren Textur.
  - Für die Draufsicht liegt der Ursprung an den Füßen: `offset` um die halbe Feldhöhe nach oben.
  - Exportiere 1:1, ohne Trim, ohne Abstand. Quelldateien bleiben erhalten, aber außerhalb des Imports.
exercises:
  - id: was-versionieren
    type: choice
    title: Was gehört in den Commit?
    prompt: |
      Du hast `test_assets/test_sheet.png` angelegt und importiert. Welche Dateien gehören ins Git-Repository? Mehrere Antworten richtig.
    options:
      - text: "`test_assets/test_sheet.png`"
        correct: true
        why: Die Quelle ist das, was du gezeichnet hast. Ohne sie gibt es nichts zu importieren.
      - text: "`test_assets/test_sheet.png.import`"
        correct: true
        why: Sie hält die Import-Einstellungen. Fehlt sie, importiert jeder andere Rechner mit Standardwerten.
      - text: "`.godot/imported/test_sheet.png-….ctex`"
        correct: false
        why: Das ist das Ergebnis des Imports. Godot erzeugt es neu, sobald es fehlt; im Repository kostet es nur Platz.
      - text: "`.godot/imported/test_sheet.png-….md5`"
        correct: false
        why: Die Prüfsumme gehört zum Cache in `.godot/` und entsteht ebenfalls beim Import.
      - text: Die Quelldatei `test_sheet.aseprite` in einem Ordner mit `.gdignore`
        correct: true
        why: Aus ihr exportierst du neu, wenn sich etwas ändert. `.gdignore` hält sie aus dem Import heraus.
    explanation: |
      Ins Repository gehört alles, was sich nicht aus anderen Dateien erzeugen lässt: deine Quellen und die Einstellungen in `.import`. Der Ordner `.godot/` ist ein Cache, Godot baut ihn aus Quelle und Einstellungen neu. Das ist dasselbe Muster wie `src/` und `vite.config.ts` im Repository, `dist/` und `node_modules/` nicht. Wie du große Binärdateien sicherst, klärt das Modul zu Export und Sicherung.
    resources:
      - title: Godot Docs · Import process · Files generated
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/import_process.html#files-generated

  - id: vom-export-zum-sprite
    type: order
    title: Vom Zeichenprogramm ins Spiel
    prompt: |
      Bring die Schritte in eine sinnvolle Reihenfolge, damit der Testbogen als Sprite mit Ursprung an den Füßen im Spiel steht.
    lang: prose
    lines: |
      In Aseprite als Sheet in einer Zeile exportieren, Maßstab 1, ohne Trim und ohne Abstand
      Die PNG nach res://test_assets/ kopieren
      Im Import-Dock prüfen: Lossless, Mipmaps aus, Größenbeschränkung 0
      Ein Sprite2D unter dem Player anlegen und die Textur zuweisen
      hframes auf 4 stellen
      offset auf (0, −8) setzen, damit die Fußmarke am Ursprung liegt
      Spiel starten und prüfen, ob Feld 1 scharf und vollständig erscheint
    alternatives:
      - [1, 2, 3, 4, 6, 5, 7]
    explanation: |
      Der Export bestimmt das Raster, deshalb kommt er zuerst und ohne Trim. Danach prüfst du den Import, bevor du die Textur benutzt; sonst beurteilst du ein Bild, das später anders aussieht. `hframes` und `offset` sind voneinander unabhängig. Beide verlangen aber, dass die Textur schon zugewiesen ist. Zum Schluss steht der Test im Spiel, nicht im Editor, denn Stretch Mode und Filter wirken erst dort.
    resources:
      - title: Godot Docs · Importing images
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_images.html

  - id: rechteck-bei-acht
    type: output
    title: Wie groß ist ein Feld?
    prompt: |
      `test_sheet.png` ist 64 × 16 Pixel groß, das Sprite hat `centered` an und `offset` (0, 0). Was gibt die letzte Zeile in Godot 4.7.2 aus?
    lang: gdscript
    code: |
      var sprite := Sprite2D.new()
      sprite.texture = load("res://test_assets/test_sheet.png")
      sprite.hframes = 8
      print(sprite.get_rect())
    expected: |
      [P: (-4.0, -8.0), S: (8.0, 16.0)]
    hints:
      - Die Feldbreite ist die Breite der Textur geteilt durch `hframes`.
      - Mit `centered` liegt die Mitte des Felds am Ursprung.
    explanation: |
      64 / 8 = 8 Pixel Breite, die Höhe bleibt 16. Zentriert reicht das Rechteck von −4 bis 4 und von −8 bis 8. Ein Feld ist damit halb so breit wie die gezeichneten 16 Pixel: Jedes Frame zeigt eine Hälfte einer Zelle. `get_rect()` ist der schnellste Weg, das ohne Spielstart nachzuprüfen. Gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Sprite2D.get_rect
        url: https://docs.godotengine.org/en/stable/classes/class_sprite2d.html#class-sprite2d-method-get-rect

  - id: frame-koordinaten
    type: output
    title: Welche Zelle ist Frame 5?
    prompt: |
      `test_sheet_4x2.png` hat vier Spalten und zwei Zeilen. Was gibt der Code aus?
    lang: gdscript
    code: |
      var sprite := Sprite2D.new()
      sprite.texture = load("res://test_assets/test_sheet_4x2.png")
      sprite.hframes = 4
      sprite.vframes = 2
      sprite.frame = 5
      print(sprite.frame_coords)
    expected: |
      (1, 1)
    accept:
      - (1,1)
    hints:
      - "`frame` zählt ab 0 von links oben, eine Zeile nach der anderen."
    explanation: |
      Frame 0 bis 3 sind die erste Zeile, Frame 4 bis 7 die zweite. Frame 5 ist das zweite Feld der zweiten Zeile, also Spalte 1, Zeile 1, beide ab 0 gezählt. Auf dem Testbogen trägt es die Nummer 6. Umgekehrt ergibt `frame_coords = Vector2i(2, 1)` den Frame 6. Gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Sprite2D.frame_coords
        url: https://docs.godotengine.org/en/stable/classes/class_sprite2d.html#class-sprite2d-property-frame-coords

  - id: ursprung-rechteck
    type: output
    title: Wo liegen die Füße?
    prompt: |
      Testbogen mit 16 × 16-Feldern, `hframes = 4`. Was gibt die letzte Zeile aus?
    lang: gdscript
    code: |
      sprite.hframes = 4
      sprite.centered = true
      sprite.offset = Vector2(0, -8)
      print(sprite.get_rect())
    expected: |
      [P: (-8.0, -16.0), S: (16.0, 16.0)]
    hints:
      - Ohne `offset` reicht das Feld von −8 bis 8. Was macht eine Verschiebung um −8 in y?
    explanation: |
      Zentriert reicht das Feld senkrecht von −8 bis 8. Der `offset` schiebt es um 8 nach oben, auf −16 bis 0. Die Unterkante liegt also am Ursprung, dort, wo die Fußmarke sitzen soll. `centered = false` mit `offset = Vector2(-8, -16)` ergibt dasselbe Rechteck, gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Sprite2D.offset
        url: https://docs.godotengine.org/en/stable/classes/class_sprite2d.html#class-sprite2d-property-offset

