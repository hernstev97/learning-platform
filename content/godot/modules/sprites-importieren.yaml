id: sprites-importieren
title: "Eigene Sprites importieren: Import-Dock, Spritesheets und Ursprung"
level: 1
minutes: 150
summary: Wie Godot eine PNG-Datei importiert, welche Einstellungen im Import-Dock Pixelart schützen, wie ein Sprite2D ein Spritesheet in Felder teilt und warum der Ursprung an die Füße gehört – geprüft an einem Testbogen, den du selbst anlegst.
place: pc
goals:
  - Du erklärst, was in der Quelldatei, in der `.import`-Datei und in `.godot/imported` steht, und welche davon ins Repository gehören.
  - Du liest das Import-Dock und erkennst die Einstellungen, die Pixelart unscharf machen oder verfälschen.
  - Du unterscheidest den Texturfilter des Projekts von `texture_filter` am Node und liest beide in `project.godot` und `.tscn`.
  - Du richtest ein `Sprite2D` mit `hframes`, `vframes`, `frame` und `offset` so ein, dass jedes Feld vollständig erscheint und der Ursprung an den Füßen liegt.
  - Du exportierst ein Spritesheet aus Aseprite oder Bildfolgen aus Krita so, dass das Raster erhalten bleibt.
