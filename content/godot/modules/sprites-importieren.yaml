  - id: sprite-zeilen
    type: gap
    title: Feld drei mit Ursprung an den Füßen
    prompt: |
      Ergänze den Node in `player.tscn`: Der Testbogen hat vier Felder mit 16 × 16 Pixeln in einer Zeile. `centered` bleibt an, der Ursprung soll an der Unterkante liegen, und das Sprite zeigt das Feld mit der Nummer 3.
    lang: ini
    code: |
      [node name="Sprite" type="Sprite2D" parent="."]
      texture = ExtResource("3_i3pqv")
      offset = Vector2(0, ⟦-8⟧)
      ⟦hframes⟧ = 4
      frame = ⟦2⟧
    gaps:
      - label: Verschiebung in y
        hint: Die halbe Feldhöhe, nach oben ist negativ.
        accept: ["-8.0"]
      - label: Eigenschaft für die Spalten
        hint: Horizontale Frames.
      - label: Frame-Index
        hint: Gezählt wird ab 0.
    explanation: |
      `offset` verschiebt das Bild um die halbe Feldhöhe nach oben, damit die Unterkante am Ursprung liegt. `hframes = 4` teilt die 64 Pixel in vier Felder. Das Feld mit der Nummer 3 hat den Index 2, weil `frame` bei 0 beginnt. `centered` steht nicht in der Datei, denn Godot schreibt nur Werte, die vom Standard abweichen.
    resources:
      - title: Godot Docs · Sprite2D
        url: https://docs.godotengine.org/en/stable/classes/class_sprite2d.html

  - id: groessenbeschraenkung
    type: bug
    title: Halb so groß und grau
    prompt: |
      Nach einem Commit des Coding-Agents ist das Prüfmuster im Spiel nur noch halb so groß, und das Schachbrett ist eine graue Fläche. An Szene und Projekteinstellungen hat sich nichts geändert. Hier ist der Ausschnitt aus `pattern.png.import`. Finde die Zeile und korrigiere sie.
    lang: ini
    code: |
      [params]

      compress/mode=0
      mipmaps/generate=false
      process/fix_alpha_border=true
      process/premult_alpha=false
      process/size_limit=16
      detect_3d/compress_to=1
    lines: [7]
    fix:
      - line: 7
        answers:
          - process/size_limit=0
    explanation: |
      Die Größenbeschränkung verkleinert die Textur beim Import auf höchstens 16 Pixel an der längeren Seite, mit kubischer Interpolation. Aus dem 32 × 32 großen Muster wird ein 16 × 16 großes mit 32 statt 4 Farben, gemessen mit Godot 4.7.2. Mit 0 ist die Beschränkung aus. Nach der Korrektur musst du im Import-Dock *Neuimport* klicken oder Godot neu starten, damit das Ergebnis in `.godot/imported` ersetzt wird.
    resources:
      - title: Godot Docs · Importing images · Size Limit
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_images.html#process-size-limit

  - id: halbe-felder
    type: bug
    title: Die Animation zeigt halbe Zellen
    prompt: |
      So sehen die ersten vier Frames des Testbogens im Spiel aus. Die Textur ist 64 × 16 Pixel groß und hat vier Felder. Finde die Zeile im Szenenausschnitt und korrigiere sie.

      ![Vier Frames nebeneinander: jedes zeigt nur eine linke oder rechte Hälfte einer Zelle mit halber Ziffer](/media/godot/sprites-importieren/diagnose-halbe-felder@2x.png "Godot 4.7.2, Frames 0 bis 3, Spielbild sechsfach vergrößert")
    lang: ini
    code: |
      [node name="Sprite" type="Sprite2D" parent="."]
      texture = ExtResource("3_i3pqv")
      offset = Vector2(0, -8)
      hframes = 8
    lines: [4]
    fix:
      - line: 4
        answers:
          - hframes = 4
    explanation: |
      Mit `hframes = 8` teilt Godot die 64 Pixel in acht Felder zu 8 Pixeln. Frame 0 zeigt die linke Hälfte der ersten Zelle, Frame 1 die rechte, und so weiter. An der Rasterlinie des Testbogens erkennst du das sofort: Jedes Bild hat nur eine senkrechte Kante. `hframes` muss Breite des Blatts durch Feldbreite sein, hier 64 / 16 = 4.
    resources:
      - title: Godot Docs · Sprite2D.hframes
        url: https://docs.godotengine.org/en/stable/classes/class_sprite2d.html#class-sprite2d-property-hframes

  - id: ein-sprite-weich
    type: bug
    title: Nur eine Figur ist weich
    prompt: |
      Ein Projekt im Stretch Mode `canvas_items` hat `textures/canvas_textures/default_texture_filter=0` in `project.godot`. Alle Sprites sind scharf, nur der Testbogen am Player ist verwaschen. Hier ist sein Node in `player.tscn`. Finde die Zeile und korrigiere sie so, dass das Sprite dem Projekt folgt oder ausdrücklich Nearest nutzt.
    lang: ini
    code: |
      [node name="Sprite" type="Sprite2D" parent="."]
      texture_filter = 2
      texture = ExtResource("3_i3pqv")
      offset = Vector2(0, -8)
      hframes = 4
    lines: [2]
    fix:
      - line: 2
        answers:
          - texture_filter = 1
          - texture_filter = 0
    explanation: |
      Am Node bedeutet `texture_filter = 2` Linear, auch wenn im Projekt eine 0 steht, die dort Nearest heißt. Die beiden Einstellungen zählen verschieden: Am Node ist 0 Inherit und 1 Nearest. Mit 0 übernimmt das Sprite den Projektwert, mit 1 erzwingt es Nearest. Godot schreibt Inherit gar nicht in die Datei; die Zeile zu löschen wirkt deshalb wie 0. Im Modus `canvas_items` vergrößert jedes Sprite selbst, deshalb fällt der Filter dort sofort auf.
    resources:
      - title: Godot Docs · CanvasItem.texture_filter
        url: https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#class-canvasitem-property-texture-filter

  - id: import-datei-erklaeren
    type: explain
    title: Was ist diese Datei?
    prompt: |
      Ein Kollege fragt, warum neben jeder PNG eine solche Datei liegt und ob man sie nicht in `.gitignore` aufnehmen könnte. Erkläre in wenigen Sätzen, was sie ist, was beim Ändern der PNG passiert und was gegen das Ignorieren spricht.
    lang: ini
    code: |
      [remap]

      importer="texture"
      type="CompressedTexture2D"
      uid="uid://bnbb5aa4yerph"
      path="res://.godot/imported/test_sheet.png-142e95a07cea5c3d31f4022e607774aa.ctex"

      [deps]

      source_file="res://test_assets/test_sheet.png"

      [params]

      compress/mode=0
      mipmaps/generate=false
      process/size_limit=0
    points:
      - Die Datei hält die Import-Einstellungen für genau diese PNG und sagt, wo das Ergebnis liegt.
      - Das Ergebnis (`.ctex`) liegt im Cache `.godot/imported` und wird bei jeder Änderung der PNG automatisch neu erzeugt.
      - Ohne die Datei importiert jeder andere Rechner mit Standardwerten; abweichende Einstellungen wie ein anderer Kompressionsmodus gingen verloren.
      - Die `uid` ist eine feste Kennung der Ressource; Szenen nennen sie in `ext_resource` neben dem Pfad.
    explanation: |
      Die `.import`-Datei ist die Konfiguration des Imports für eine Datei, vergleichbar mit einer Loader-Regel im Bundler, nur direkt neben der Quelle. Unter `[params]` stehen die Werte aus dem Import-Dock, unter `[remap]` der Pfad zum Ergebnis im Cache. Ändert sich die PNG, erkennt Godot das an der Prüfsumme und importiert neu. Die `uid` ist eine feste Kennung der Ressource: `player.tscn` nennt beim Testbogen `uid="uid://bnbb5aa4yerph"` neben dem Pfad. Die Doku verlangt, `.import`-Dateien zu versionieren; ignoriert wird nur `.godot/`. Sonst sieht dieselbe Grafik auf jedem Rechner anders aus, je nachdem, welche Standards dort gelten.
    resources:
      - title: Godot Docs · Import process
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/import_process.html

  - id: testbogen-einsetzen
    type: practice
    title: Den Testbogen anlegen und einsetzen
    prompt: |
      Leg in Aseprite oder Krita den Testbogen an: 64 × 16 Pixel, vier Felder zu 16 × 16 mit grauer Rasterlinie am Feldrand, Nummer 1 bis 4, einem Block, der von Feld zu Feld weiterrückt, und einer roten Fußmarke von 2 Pixeln unten in der Mitte. Exportiere ihn nach `res://test_assets/test_sheet.png`. Setz ihn im Testgelände als `Sprite2D` namens `Sprite` unter den Player, schalte `Body` unsichtbar und richte `hframes` und `offset` ein. Prüfe das Ergebnis im laufenden Spiel und im Diff von `player.tscn`.
    lang: ini
    solution: |
      ; player.tscn nach dem Speichern in Godot 4.7.2 (Auszug).
      ; uid und unique_id vergibt Godot, sie weichen bei dir ab.

      [ext_resource type="Texture2D" uid="uid://bnbb5aa4yerph" path="res://test_assets/test_sheet.png" id="3_i3pqv"]

      [node name="Body" type="Polygon2D" parent="." unique_id=1710148549]
      visible = false
      color = Color(0.35, 0.65, 0.95, 1)
      polygon = PackedVector2Array(-6, -16, 6, -16, 6, 0, -6, 0)

      [node name="Sprite" type="Sprite2D" parent="." unique_id=1152945]
      texture = ExtResource("3_i3pqv")
      offset = Vector2(0, -8)
      hframes = 4
    checklist:
      - Der Testbogen liegt als `res://test_assets/test_sheet.png` im Projekt, die `.import`-Datei daneben zeigt `compress/mode=0` und `process/size_limit=0`.
      - Das Import-Dock zeigt Lossless, Mipmaps aus, Größenbeschränkung 0.
      - Im Spiel ist Feld 1 vollständig zu sehen, mit allen vier Rasterlinien.
      - Die rote Fußmarke steht auf derselben Höhe wie die Unterkante der Form `Feet` (sichtbar mit *Debuggen → Sichtbare Collision-Shapes*).
      - Mit `frame` 0 bis 3 im Inspektor erscheinen die Nummern 1 bis 4.
      - Im Git-Diff stehen die PNG, ihre `.import`-Datei und die Änderung an `player.tscn`, nichts aus `.godot/`.
    explanation: |
      Der Testbogen prüft die ganze Kette auf einmal: Import (scharf, richtige Größe), Raster (`hframes`), Ursprung (Fußmarke an der Unterkante der Fußform) und Versionierung. Beim ersten Speichern im Editor ergänzt Godot 4.7.2 `uid` und `unique_id` und streicht Zeilen mit Standardwerten wie `collision_mask = 1`; erschrick nicht über diesen Diff. `Body` bleibt als Node erhalten, weil andere Module des Kurses mit den Namen der Vorlage arbeiten. Die Zahlen sind die Platzhalter des Testbogens. Wenn deine Figuren andere Feldgrößen haben, ändern sich `hframes` und `offset`, die Prüfung bleibt dieselbe.
    resources:
      - title: Godot Docs · Sprite2D
        url: https://docs.godotengine.org/en/stable/classes/class_sprite2d.html
      - title: Godot Docs · Overview of debugging tools · Visible collision shapes
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html#visible-collision-shapes

  - id: eigene-exportregeln
    type: practice
    title: Deine Exportregeln für Sprites
    prompt: |
      Schreib eine kurze Exportregel für deine eigenen Sprites, so dass du oder ein Coding-Agent sie später ohne Rückfrage befolgen kann. Lege fest, welche Feldgröße du als Platzhalter nimmst, wie das Blatt aufgebaut ist, wo Quelldateien liegen, wie Dateien heißen und woran du nach dem Import prüfst, ob alles stimmt. Die Werte entscheidest du.
    lang: prose
    checklist:
      - Die Regel nennt eine Feldgröße in Pixeln, ausdrücklich als Platzhalter.
      - Sie legt Layout (Zeile oder Zeilen), Maßstab beim Export und den Verzicht auf Trim und Abstand fest.
      - Sie nennt den Ort der Quelldateien (`.aseprite`, `.kra`), mit `.gdignore` oder außerhalb des Projekts.
      - Sie enthält eine Namensregel für Dateien, die ein Coding-Agent ohne Rückfrage anwenden kann.
      - Sie nennt mindestens zwei Prüfungen nach dem Import, etwa Werte im Import-Dock und die Lage der Fußmarke.
    hints:
      - Nimm die Tabelle mit den Aseprite-Optionen aus der Lektion als Gerüst.
      - Eine Prüfung ist gut, wenn jemand anderes sie mit Ja oder Nein beantworten kann.
    explanation: |
      Eine Exportregel macht aus deinen Entscheidungen etwas, das andere ausführen können: ein Coding-Agent, ein Mitstreiter oder du in drei Monaten. Die technischen Teile (kein Trim, kein Abstand, Maßstab 1, Lossless) folgen aus dem, was `hframes` und der Import brauchen. Feldgröße, Aufbau und Namen sind deine Wahl. Schreib die Regel ins Repository, etwa neben die Quelldateien.
    resources:
      - title: Aseprite Docs · CLI · sheet-type
        url: https://www.aseprite.org/docs/cli/#sheet-type
      - title: Godot Docs · Project organization
        url: https://docs.godotengine.org/en/stable/tutorials/best_practices/project_organization.html
