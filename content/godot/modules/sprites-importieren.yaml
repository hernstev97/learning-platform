    explanation: |
      `--import` startet den Editor, wartet, bis alle Ressourcen importiert sind, und beendet ihn. `--headless` verhindert das Fenster, `--path` nennt den Projektordner. Danach liegen die `.import`-Dateien neben den PNGs und die Ergebnisse in `.godot/imported`. Die Ausgabe ist gekürzt und stammt aus einem Lauf mit Godot 4.7.2 und deutscher Systemsprache.
