lesson: |
  Du hast die Werkzeuge kennengelernt: Debugger, Monitore und Profiler in [Fehler eingrenzen](/godot/fehler-eingrenzen), die Takte in [Bildrate und Simulation](/godot/bildrate-simulation), die Methode des Experiments in [Tuning als Experiment](/combat/tuning). Hier wendest du sie am Testgelände an, zuerst an Werten, die du selbst änderst, dann an Fehlern, die du nicht kennst. Ein Skript, die **Fehlerkiste**, baut einen von acht vorbereiteten Fehlern ein. Du siehst nur das Symptom und gehst vor, wie du es bei einem Projekt tun würdest, das ein Coding-Agent umgebaut hat: beschreiben, eingrenzen, belegen, protokollieren.

  Alle Werte in den Skripten sind Platzhalter, damit die Messungen laufen. Welche Werte dein Spiel bekommt, entscheidest du. Alle Ausgaben stammen aus Läufen mit Godot 4.7.2 an einem Testgelände, das die vorigen Module erweitert haben.

  ## Der Prüfstand im Testgelände

  Die Fehlerkiste und die Messungen brauchen ein paar Dinge, die du aus früheren Modulen hast oder jetzt ergänzt:

  - die Figur mit ihrem `Sprite` aus [Animationen zuordnen](/godot/animationen),
  - den Ton beim Einsammeln aus dem Modul zu [Audio](/godot/audio): `PickupSound` mit `pickup_sound.gd` auf einem eigenen Bus, dort mit dem Platzhalternamen `SFX`,
  - das Prüfmuster aus [Pixelraster und Skalierung](/godot/pixelraster), 32 × 32 Pixel mit Rahmen, Schachbrett, Streifen und Diagonalen, als `res://test_assets/pruefmuster.png` und als `Sprite2D` namens `Pruefmuster` unter `Objects`,
  - ein Git-Repository mit sauberem Stand, wie in [Testversionen exportieren und sichern](/godot/export-sichern),
  - den neuen `Messpunkt` mit einer Anzeige.

  ```text
  Main (Node2D)
  ├── Floor oder Ground          je nach Stand des Testgeländes
  ├── Objects (Node2D)           y_sort_enabled
  │   ├── Player                 mit Sprite (AnimatedSprite2D), Body unsichtbar
  │   ├── Crate, Pickups, gegebenenfalls Walls
  │   └── Pruefmuster (Sprite2D) pruefmuster.png, Position ist ein Platzhalter
  ├── HUD (CanvasLayer)
  │   ├── Counter (Label)
  │   └── Messanzeige (Label)    Schriftgröße 8 unter Theme Overrides → Font Sizes
  ├── PickupSound                aus dem Audio-Modul, Bus SFX
  └── Messpunkt (Node)           messpunkt.gd, player = Objects/Player, label = HUD/Messanzeige
  ```

  Das Prüfmuster steht neben der Figur, weil es Fehler im Import und in der Skalierung deutlicher zeigt als ein einzelnes Feld des Testbogens.

  Der Messpunkt ist technisches Gerüst. Er zeigt Tempo und Physik-Tick der Figur, meldet die eingesammelten Stücke als eigenen Monitor und stellt die Zeitlupe ein:

  ```gdscript title=werkstatt/messpunkt.gd
  extends Node

  ## Werkstatt-Messpunkt: zeigt Tempo und Physik-Tick der Figur im Spiel an,
  ## meldet die eingesammelten Stücke als eigenen Monitor und stellt Engine.time_scale ein.
  ## Technisches Gerüst, keine Designentscheidung. Alle Werte sind Platzhalter.

  @export var player: Player
  @export var label: Label
  ## 1 = normal, 0.25 = Viertel-Tempo zum Zusehen
  @export_range(0.05, 1.0, 0.05) var time_scale := 1.0:
  	set(value):
  		time_scale = value
  		Engine.time_scale = value


  func _ready() -> void:
  	Performance.add_custom_monitor(&"Testgelände/Gesammelt", _collected)


  func _exit_tree() -> void:
  	Performance.remove_custom_monitor(&"Testgelände/Gesammelt")


  func _process(_delta: float) -> void:
  	label.text = "Tempo %5.1f px/s  Tick %d" % [player.velocity.length(), Engine.get_physics_frames()]


  func _collected() -> int:
  	return player.total
  ```

  ![Spielbild des Testgeländes in 320 × 180, doppelt vergrößert: die Figur mit einem Feld des Testbogens vor der Kiste, links darunter das Prüfmuster mit Schachbrett, Streifen und Diagonalen, oben der Zähler 0, unten die Messanzeige Tempo 0.0 px/s Tick 6](/media/godot/werkstatt-messen/pruefstand@2x.png "Godot 4.7.2, Testgelände mit Prüfstand, Spielbild zweifach vergrößert")

  ## Messpunkte: Log, Anzeige, eigener Monitor, Zeitlupe

  Vier Werkzeuge, vier Fragen:

  | Frage | Werkzeug | Takt |
  | --- | --- | --- |
  | Was passiert in jedem Tick? | `debug_log` am Player, Ausgabe | jeder Physik-Tick |
  | Was sehe ich gerade? | Messanzeige im Spiel | jedes Bild |
  | Wie entwickelt sich ein Zählwert über Minuten? | eigener Monitor im Debugger | einmal pro Sekunde |
  | Wo hakt eine Bewegung? | `time_scale` am Messpunkt | streckt die Spielzeit |

  **Log.** Mit `debug_log` an schreibt `player.gd` in jedem Tick `Tick  speed Tempo` in die Ausgabe. Das ist die genaueste Quelle; mit `--fixed-fps 60` aus dem Terminal ist sie bei jedem Lauf gleich.

  **Eigener Monitor.** `Performance.add_custom_monitor()` hängt einen Wert in den Reiter Monitore. Ein Schrägstrich im Namen legt die Gruppe fest: `Testgelände/Gesammelt` erscheint als Gruppe „Testgelände“ mit dem Eintrag „Gesammelt“ ([Custom performance monitors](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/custom_performance_monitors.html)). Die Funktion muss eine Zahl ab 0 liefern. Der Editor fragt sie einmal pro Sekunde ab, deshalb taugen Monitore für Zählwerte, nicht für das Tempo eines einzelnen Ticks. Den Monitor entfernst du in `_exit_tree()`, sonst meldet ein zweites `add_custom_monitor()` mit derselben ID einen Fehler ([add_custom_monitor](https://docs.godotengine.org/en/stable/classes/class_performance.html#class-performance-method-add-custom-monitor)).

  ![Debugger, Reiter Monitore: Gruppe Testgelände mit Gesammelt 3 angehakt; rechts der Graph Gesammelt steigt in drei Stufen von 0 auf 3, daneben Verwaiste Nodes konstant 0](/media/godot/werkstatt-messen/monitor-gesammelt@2x.png "Godot 4.7.2, eigener Monitor, während die Figur drei Sammelstücke einsammelt")

  **Zeitlupe.** `time_scale` am Messpunkt setzt `Engine.time_scale` über einen Setter; `@export_range` macht daraus einen Schieberegler im Inspektor ([@export_range](https://docs.godotengine.org/en/stable/classes/class_@gdscript.html#class-gdscript-annotation-export-range)). Du kannst es im laufenden Spiel im Remote-Inspektor verändern; wie Remote und Lokal zusammenspielen und warum ein dort gefundener Wert nach dem Beenden weg ist, steht in [Aktionen und Parameter](/godot/aktionen-parameter). Gemessen: Bei 0.25 erreicht die Figur 90 px/s nach 36 statt 9 Ticks, und die Anzeige zeigt dann `Tempo  90.0 px/s`. Das Tempo steigt pro Tick langsamer, weil `delta` kleiner ist, und auch der Weg pro Tick schrumpft; der Endwert von `velocity` bleibt derselbe. Ganze Läufe als Bildfolge nimmst du mit dem Movie Maker auf, beschrieben in [Tuning als Experiment](/combat/tuning).

  ## Vorhersagen, ändern, messen

  Bevor du einen Wert änderst, schreibst du auf, was du erwartest. `player.gd` bewegt das Tempo mit `move_toward()` pro Tick um höchstens `acceleration × delta` auf das Ziel zu ([Vector2.move_toward](https://docs.godotengine.org/en/stable/classes/class_vector2.html#class-vector2-method-move-toward)). Bei den Platzhaltern 90/600/900 wächst das Tempo also pro Tick um 600 / 60 = 10 px/s, nach 9 Ticks sind 90 erreicht; nach dem Loslassen sinkt es um 900 / 60 = 15 pro Tick, die Figur steht nach 6 Ticks, der Bremsweg ist 3,75 px. Eine Probe mit anderen Platzhaltern, `acceleration` 300 und `friction` 450: Vorhersage 18 Ticks bis 90 px/s und 12 Ticks bis zum Stillstand. Gemessen mit Godot 4.7.2: 18 und 12, Bremsweg 8,25 px.

  Stimmt die Messung nicht, ist das ein Befund, kein Fehlschlag. Dann rechnet der Code anders, als du dachtest, oder eine andere Stelle setzt den Wert. Die Reihenfolge, in der Skript, Szene, Instanz und Ressource einen Wert setzen, steht in [Aktionen und Parameter](/godot/aktionen-parameter). Eine Zeile pro Versuch reicht:

  ```text
  Datum  Godot  Datei · Wert alt -> neu  Vorhersage  Messung  Abweichung erklärt?
  ```

  > [!PRAXIS]
  > Lass einen Coding-Agenten den Messpunkt bauen, aber prüf ihn mit einer Vorhersage, bevor du ihm traust: Stell einen Wert ein, dessen Ergebnis du ausrechnen kannst, und vergleiche. Eine Messung, die du nicht nachrechnen kannst, ist keine Messung.

  ## Die Fehlerkiste

  Die Fehlerkiste ist ein Skript, das Godot als Hauptschleife ausführt, ohne Fenster und ohne Spiel. Es prüft, ob alles committet ist, wählt zufällig einen von acht Fehlern, baut ihn in eine Datei des Testgeländes ein und schreibt die Nummer nach `user://fehlerkiste.txt`, unter Linux `~/.local/share/godot/app_userdata/Testgelände/fehlerkiste.txt`. Die Fehler betreffen Import, Kollision, Skalierung, Parameter, eine Signalverbindung, die Y-Sortierung, einen Audio-Bus und den Physik-Takt. Jeder ändert genau einen Wert in einer Datei.

  Leg das Skript **außerhalb** des Projekts ab, etwa als `~/werkstatt/fehlerkiste.gd`. So taucht es nicht im Dateisystem-Dock auf, kommt nicht in Exporte, und `git restore` setzt es nicht zurück. Der Code verrät, welche Fehler es gibt; lies ihn erst, wenn du alle acht gefunden hast.

  > [!WARNING] Erst committen, Editor schließen
  > Die Kiste bricht ab, solange `git status` Änderungen zeigt, damit `git diff` danach genau den Fehler zeigt und `git restore .` ihn sauber entfernt. Schließ den Editor vorher, damit er beim Speichern keine geöffnete Szene mit seiner Fassung überschreibt.

  ```console
  $ git status --short
  $ godot --headless --path . -s ~/werkstatt/fehlerkiste.gd
  Godot Engine v4.7.2.stable.official.ed1daf0bf - https://godotengine.org
  Ein Fehler ist eingebaut. Die Nummer steht in …/godot/app_userdata/Testgelände/fehlerkiste.txt
  ```

  `-s` führt ein Skript aus; ein absoluter Pfad ist erlaubt ([Running a script](https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html#running-a-script)). Mit `-- 4` am Ende baust du gezielt Fehler 4 ein, etwa um eine Korrektur zu wiederholen. Gibt es noch Änderungen, kommt `Abbruch: Es gibt Änderungen ohne Commit. Erst committen, dann die Kiste öffnen.`, und nichts wird verändert. Ist der Ordner kein Git-Repository oder fehlt git, lautet die Meldung `Abbruch: git lässt sich nicht starten, oder der Projektordner ist kein Git-Repository.`

  ```gdscript title=~/werkstatt/fehlerkiste.gd
  extends SceneTree

  ## Fehlerkiste der Werkstatt: baut genau einen vorbereiteten Fehler ins Testgelände ein
  ## und schreibt seine Nummer nach user://fehlerkiste.txt.
  ## Editor schließen, alles committen, dann im Projektordner:
  ##   godot --headless --path . -s ~/werkstatt/fehlerkiste.gd
  ## Mit "-- 4" am Ende baust du gezielt Fehler 4 ein. Zurück zum sauberen Stand: git restore .
  ## Jeder Fehler ist eine Textänderung in genau einer Datei, wie sie auch ein Agent machen könnte.
  ## Technisches Gerüst. Die Werte sind Platzhalter, keine Vorschläge für dein Spiel.

  const PATTERN := "res://test_assets/pruefmuster.png"  ## dein Prüfmuster
  const COUNT := 8


  func _initialize() -> void:
  	var status := _git_status()
  	if status == "kein-git":
  		print("Abbruch: git lässt sich nicht starten, oder der Projektordner ist kein Git-Repository.")
  		quit(1)
  		return
  	if status == "geaendert":
  		print("Abbruch: Es gibt Änderungen ohne Commit. Erst committen, dann die Kiste öffnen.")
  		quit(1)
  		return
  	var args := OS.get_cmdline_user_args()
  	var numbers: Array = [int(args[0])] if args.size() > 0 else range(1, COUNT + 1)
  	numbers.shuffle()
  	for number: int in numbers:
  		if _apply(number):
  			var file := FileAccess.open("user://fehlerkiste.txt", FileAccess.WRITE)
  			file.store_line(str(number))
  			print("Ein Fehler ist eingebaut. Die Nummer steht in ", ProjectSettings.globalize_path("user://fehlerkiste.txt"))
  			quit()
  			return
  	print("Abbruch: Kein passender Fehler ließ sich einbauen.")
  	quit(1)


  func _apply(number: int) -> bool:
  	match number:
  		1: return _set_import(PATTERN, "compress/mode", 2)
  		2: return _set_property("res://crate.tscn", "[node name=\"Crate\"", "collision_layer", "4", true)
  		3: return _set_property("res://player.tscn", "[node name=\"Camera2D\"", "zoom", "Vector2(1.5, 1.5)", true)
  		4: return _set_property("res://data/player_stats.tres", "[resource]", "friction", "30.0", true)
  		5: return _remove_line("res://main.tscn", "", "[connection signal=\"collected\" from=\"Objects/Player\" to=\"HUD\" method=\"show_total\"]")
  		6: return _remove_line("res://main.tscn", "[node name=\"Objects\"", "y_sort_enabled = true")
  		7: return _set_property("res://default_bus_layout.tres", "[resource]", "bus/1/volume_db", "-80.0", false)
  		8:
  			ProjectSettings.set_setting("physics/common/physics_ticks_per_second", 30)
  			return ProjectSettings.save() == OK
  	return false


  ## Liefert "sauber", "geaendert" oder "kein-git".
  func _git_status() -> String:
  	var output := []
  	var code := OS.execute("git", ["-C", ProjectSettings.globalize_path("res://"), "status", "--porcelain"], output)
  	if code != 0:
  		return "kein-git"
  	return "sauber" if output[0].strip_edges().is_empty() else "geaendert"


  func _set_import(path: String, key: String, value: Variant) -> bool:
  	var config := ConfigFile.new()
  	if config.load(path + ".import") != OK:
  		return false
  	config.set_value("params", key, value)
  	return config.save(path + ".import") == OK


  ## Setzt "key = value" im Abschnitt, der mit header beginnt. Steht key noch nicht da,
  ## hängt die Funktion die Zeile ans Ende des Abschnitts, wenn insert true ist,
  ## also hinter "script = …", damit auch Werte aus Skripten ankommen.
  func _set_property(path: String, header: String, key: String, value: String, insert: bool) -> bool:
  	var lines := _read(path)
  	var start := _find_header(lines, header)
  	if start == -1:
  		return false
  	var i := start + 1
  	while i < lines.size() and lines[i] != "" and not lines[i].begins_with("["):
  		if lines[i].begins_with(key + " = "):
  			lines[i] = key + " = " + value
  			return _write(path, lines)
  		i += 1
  	if not insert:
  		return false
  	lines.insert(i, key + " = " + value)
  	return _write(path, lines)


  ## Entfernt eine Zeile, im ganzen Text (header leer) oder nur im Abschnitt unter header.
  func _remove_line(path: String, header: String, line: String) -> bool:
  	var lines := _read(path)
  	var start := 0 if header.is_empty() else _find_header(lines, header)
  	if start == -1:
  		return false
  	for i in range(start, lines.size()):
  		if not header.is_empty() and i > start and (lines[i].begins_with("[") or lines[i] == ""):
  			break
  		if lines[i] == line:
  			lines.remove_at(i)
  			return _write(path, lines)
  	return false


  func _find_header(lines: PackedStringArray, header: String) -> int:
  	for i in lines.size():
  		if lines[i].begins_with(header):
  			return i
  	return -1


  func _read(path: String) -> PackedStringArray:
  	return FileAccess.get_file_as_string(path).split("\n")


  func _write(path: String, lines: PackedStringArray) -> bool:
  	var file := FileAccess.open(path, FileAccess.WRITE)
  	if file == null:
  		return false
  	file.store_string("\n".join(lines))
  	return true
  ```

  Die Kiste ändert Dateien als Text: Sie setzt oder löscht genau eine Zeile, wie es ein Agent mit einem Texteditor tun würde. Nur die Import-Einstellung schreibt sie über `ConfigFile` und den Physik-Takt über `ProjectSettings.save()` ([ConfigFile](https://docs.godotengine.org/en/stable/classes/class_configfile.html)). Deshalb zeigt `git diff` danach genau die geänderte Zeile, auch in Szenen, die du von Hand aus dem Kurs kopiert und nie im Editor gespeichert hast. Gemessen mit Godot 4.7.2 an einem frischen Klon: Jeder der acht Fehler änderte genau eine Datei, beim Physik-Takt kam der Abschnitt `[physics]` mit zwei Leerzeilen dazu, und nach `git restore .` zeigte `git status` nichts mehr.

  > [!DEEP] Die Reihenfolge in einer `.tres`
  > Godot setzt die Werte einer Ressource in der Reihenfolge, in der sie in der Datei stehen. Ein Wert aus einem Skript wie `friction` muss deshalb hinter `script = ExtResource(…)` stehen. Im Test mit Godot 4.7.2 stand `friction = 30.0` zuerst vor dieser Zeile: Die Datei lud ohne Meldung, und `friction` war trotzdem 900, weil der Wert gesetzt wurde, bevor das Skript da war. Eine erste Fassung der Kiste hatte genau diesen Fehler, gefunden durch eine Messung, die nicht zur Vorhersage passte.

  ## Eine Runde mit der Kiste

  1. Kiste öffnen, Editor starten, spielen. Den Inhalt von `fehlerkiste.txt` nicht ansehen.
  2. **Symptom** notieren: was du siehst, hörst oder misst, ohne Vermutung. „Die Figur läuft durch die Kiste“, nicht „die Maske stimmt nicht“.
  3. **Vermutung** notieren und mit einem Werkzeug prüfen: Inspektor, Import-Dock, Audio-Panel, Projekteinstellungen, Log, Monitor, *Sichtbare Collision-Shapes*.
  4. **Ursache** finden und erst dann mit `git diff` bestätigen. Der Diff ist der Beleg, nicht der Suchweg.
  5. Nummer in `fehlerkiste.txt` nachsehen und die passende Übung „Fehlerkiste, Fall …“ unten öffnen.
  6. Zurücksetzen mit `git restore .` ([git-restore](https://git-scm.com/docs/git-restore)), Editor öffnen; geänderte Import-Einstellungen importiert er dabei neu.
  7. Protokollieren, dann die nächste Runde.

  Wo du je nach Symptom zuerst nachsiehst:

  | Symptom | Erste Stelle |
  | --- | --- |
  | Bild sieht anders aus als die Datei | Import-Dock, `.import`-Datei, Filter, Kamera |
  | Pixel ungleich groß, alles zu groß oder zu klein | Stretch-Einstellungen, `Camera2D` → Zoom |
  | Figur läuft durch etwas oder sammelt nicht | *Sichtbare Collision-Shapes*, Layer und Mask im Inspektor |
  | Bewegung fühlt sich anders an | Log mit `debug_log`, Werte in der `.tres` |
  | Etwas passiert, aber die Anzeige reagiert nicht | Signale-Dock, `[connection]` in der `.tscn` |
  | Falsche Figur vorn | Y-Sortierung am Elternknoten |
  | Ton fehlt | Audio-Panel: Lautstärke, Stumm, Bus des Players |
  | Bewegung gröber, alles reagiert träger | Projekteinstellungen → Physik, Tick im Messpunkt |

  Die Tabelle nennt Orte, keine Lösungen. Mehrere Symptome können dieselbe Ursache haben, und dasselbe Symptom kann aus verschiedenen Ursachen kommen.

  > [!INTERVIEW]
  > „Ein Prototyp verhält sich nach einem Umbau anders, und niemand weiß, warum. Wie gehst du vor?“ Gute Antwort: Ich beschreibe das Symptom ohne Vermutung und stelle es reproduzierbar nach. Dann prüfe ich gezielt die Stellen, an denen sich dieses Symptom einstellen lässt, und erst wenn ich eine Ursache habe, bestätige ich sie im Diff gegen den letzten guten Commit. Jede Korrektur bekommt einen eigenen Commit und einen Eintrag mit Symptom, Ursache und Beleg, damit das Team den Fehler beim nächsten Mal wiedererkennt.

  ## Das Korrektur- und Einstellungsprotokoll

  Das Abschlussprojekt verlangt zwei Dateien, die hier beginnen. `KORREKTUREN.md` bekommt pro Fehler einen Eintrag:

  ```text
  Fall          ‹Nummer aus fehlerkiste.txt, nach der Diagnose eingetragen›
  Symptom       ‹was du gesehen, gehört oder gemessen hast›
  Vermutung     ‹vor der Prüfung›
  Prüfung       ‹Werkzeug und was es gezeigt hat›
  Ursache       ‹Datei, Zeile, Wert›
  Korrektur     ‹git restore oder deine Änderung›
  Beleg         ‹Diff-Zeile, Log-Ausschnitt oder Screenshot›
  Dauer         ‹Minuten bis zur Ursache›
  ```

  `EINSTELLUNGEN.md` sammelt jede Einstellung, die vom Standard abweicht, mit Ort und einem Satz Begründung. Was nicht in `project.godot`, einer `.import`-Datei oder `default_bus_layout.tres` steht, ist der Standard; diese drei Dateien sind deshalb die Quelle, nicht deine Erinnerung. Platzhalter aus dem Kurs, die du übernimmst, kennzeichnest du dort als solche.

  ## Häufige Fehler

  - **Vermutung als Symptom notiert.** „Maske falsch“ ist schon eine Diagnose. Schreib auf, was du siehst.
  - **Zuerst `git diff`.** Dann übst du Lesen von Diffs, nicht Eingrenzen. Der Diff kommt als Beleg am Ende.
  - **Kiste bei offenem Editor geöffnet.** Speicherst du danach im Editor, kann er seine Fassung einer geöffneten Szene zurückschreiben, und der Fehler ist weg.
  - **Monitor für schnelle Werte.** Einmal pro Sekunde abgefragt, zeigt er das Tempo nur zufällig an einer Stelle. Dafür gibt es Log und Anzeige.
  - **Monitor nicht entfernt.** Startet der Messpunkt ein zweites Mal, meldet `add_custom_monitor()` einen Fehler.
  - **Zeitlupe mit falscher Erwartung.** `time_scale` streckt `delta`: `velocity` steigt langsamer, erreicht aber denselben Endwert; Tick-Zähler laufen weiter.
  - **Nach `git restore` nicht neu importiert.** Eine zurückgesetzte `.import`-Datei wirkt erst, wenn Godot neu importiert, also nach dem Öffnen des Editors oder `--import`.

  ## Zusammenfassung

  - Der Prüfstand ergänzt das Testgelände um Prüfmuster, Ton auf eigenem Bus und einen Messpunkt; Werte darin sind Platzhalter.
  - Log für jeden Tick, Anzeige für jedes Bild, eigener Monitor für Zählwerte einmal pro Sekunde, `time_scale` zum Zusehen.
  - Vor jeder Änderung steht eine Vorhersage; eine Abweichung ist ein Befund.
  - Die Fehlerkiste baut einen von acht Fehlern ein, nur bei sauberem Stand und mit geschlossenem Editor; die Nummer liegt in `user://fehlerkiste.txt`.
  - Eine Runde: Symptom, Vermutung, Prüfung, Ursache, dann Diff als Beleg, `git restore .`, Protokoll.
  - `KORREKTUREN.md` und `EINSTELLUNGEN.md` setzen das Abschlussprojekt fort; die Quelle für Einstellungen sind die Dateien, nicht die Erinnerung.
exercises:
  - id: kistenrunde-ordnen
    type: order
    title: Eine Runde mit der Fehlerkiste
    prompt: |
      Bring die Schritte einer Runde in die Reihenfolge aus der Lektion.
    lang: prose
    lines: |
      Mit git status prüfen, dass alles committet ist, und den Editor schließen.
      Die Kiste mit godot --headless -s öffnen.
      Spielen und das Symptom ohne Vermutung notieren.
      Eine Vermutung aufschreiben und mit einem Werkzeug im Editor prüfen.
      Die gefundene Ursache mit git diff bestätigen und die Nummer in fehlerkiste.txt nachsehen.
      Mit git restore zurücksetzen und den Eintrag in KORREKTUREN.md schreiben.
    explanation: |
      Ohne sauberen Stand bricht die Kiste ab, und ein offener Editor würde den Fehler überschreiben. Das Symptom kommt vor jeder Vermutung, sonst siehst du nur, was du erwartest. Der Diff steht am Ende: Er bestätigt die Ursache, die du mit den Werkzeugen gefunden hast. Zurücksetzen und Protokoll schließen die Runde ab, damit die nächste wieder auf sauberem Stand beginnt.
    resources:
      - title: Git · git-restore
        url: https://git-scm.com/docs/git-restore

  - id: zeitlupe-anzeige
    type: output
    title: Was die Anzeige in der Zeitlupe zeigt
    prompt: |
      Am Messpunkt steht `time_scale` auf 0.25, die Werte sind die Platzhalter 90/600/900. Die Figur startet aus dem Stand und `move_right` bleibt gedrückt. Erste Zeile: Nach wie vielen Ticks erreicht die Figur 90 px/s? Zweite Zeile: Welche Zahl zeigt die Messanzeige danach hinter „Tempo“?
    lang: gdscript
    code: |
      # player.gd
      velocity = velocity.move_toward(input * stats.max_speed, rate * delta)

      # messpunkt.gd
      label.text = "Tempo %5.1f px/s  Tick %d" % [player.velocity.length(), Engine.get_physics_frames()]
    expected: |
      36
      90.0
    accept:
      - |
        36 Ticks
        90.0
      - |
        36
        90
      - |
        36 Ticks
        90
      - |
        36
        Tempo  90.0 px/s
      - |
        36
        Tempo 90.0 px/s
    explanation: |
      `time_scale` 0.25 viertelt `delta`, das Tempo wächst pro Tick um 600 × 1/240 = 2,5 statt 10 px/s; 90 / 2,5 = 36 Ticks. Der Endwert von `velocity` ist trotzdem 90, denn `move_toward` steuert auf `max_speed` zu, unabhängig von `delta`. Langsamer werden der Anstieg pro Tick und der Weg pro Tick. Gemessen mit Godot 4.7.2: 9 Ticks bei 1.0, 36 bei 0.25, und die Anzeige zeigte `Tempo  90.0 px/s`.
    resources:
      - title: Godot Docs · Engine.time_scale
        url: https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-property-time-scale

  - id: monitor-registrieren
    type: gap
    title: Ein eigener Monitor, sauber auf- und abgebaut
    prompt: |
      Ergänze die Lücken, damit die eingesammelten Stücke im Reiter Monitore unter „Testgelände“ erscheinen und der Monitor beim Verlassen des Baums wieder verschwindet.
    lang: gdscript
    code: |
      func _ready() -> void:
      	Performance.⟦add_custom_monitor⟧(&"Testgelände/Gesammelt", _collected)


      func _exit_tree() -> void:
      	Performance.⟦remove_custom_monitor⟧(&"Testgelände/Gesammelt")


      func _collected() -> int:
      	return player.total
    gaps:
      - label: Monitor anlegen
        hint: Die Methode von `Performance`, die einen Namen und ein Callable bekommt.
      - label: Monitor entfernen
        hint: Das Gegenstück zum Anlegen, mit derselben ID.
    explanation: |
      `add_custom_monitor()` nimmt eine ID und ein Callable, das eine Zahl ab 0 liefert. Der Teil vor dem Schrägstrich wird zur Gruppe im Reiter Monitore. Ohne `remove_custom_monitor()` bliebe die ID registriert, und ein zweiter Start des Messpunkts, etwa nach einem Szenenwechsel, würde mit derselben ID einen Fehler melden. Die Doku nennt diesen Fehler in der Beschreibung von `add_custom_monitor()`.
    resources:
      - title: Godot Docs · Performance.add_custom_monitor
        url: https://docs.godotengine.org/en/stable/classes/class_performance.html#class-performance-method-add-custom-monitor

  - id: fall-1
    type: bug
    title: Fehlerkiste, Fall 1
    prompt: |
      Öffne diese Übung erst nach deiner Diagnose. Symptom: Das Prüfmuster sieht im Spiel anders aus als die Datei. Der dunkelgraue Grund ist in Blöcken fast schwarz, im Feld mit den Diagonalen entstehen hellere Kästchen, Weiß wirkt stellenweise grau (rechts im Bild, links der saubere Stand). Finde die Zeile in `test_assets/pruefmuster.png.import` und korrigiere sie.

      ![Zwei Spielausschnitte des Prüfmusters, sechsfach vergrößert: links gleichmäßig grauer Grund mit Schachbrett, Streifen und Diagonalen; rechts ist der Grund in Blöcken schwarz, um die Diagonalen liegen hellere Kästchen](/media/godot/werkstatt-messen/fall-import@2x.png "Godot 4.7.2, links Lossless, rechts nach Fall 1")
    lang: ini
    code: |
      [params]

      compress/mode=2
      compress/high_quality=false
      compress/lossy_quality=0.7
      mipmaps/generate=false
      process/fix_alpha_border=true
      process/size_limit=0
    lines: [3]
    fix:
      - line: 3
        answers:
          - compress/mode=0
    explanation: |
      `compress/mode=2` ist im Import-Dock *Komprimieren → Modus: VRAM Compressed*. Godot speichert die Textur dann in einem Blockformat, das jeden Block aus 4 × 4 Pixeln mit wenigen Farben beschreibt; im Test lud das Spiel das deckende Prüfmuster im Format DXT1, einen Testbogen mit Transparenz im Format DXT5. Pixelart verliert dabei Flächen und Kanten. `0` ist `Lossless`, der Standard für 2D. Nach `git restore .` importiert Godot die Datei beim nächsten Öffnen neu; gemessen mit Godot 4.7.2 war die Textur danach wieder unkomprimiert. Mehr zu den Import-Einstellungen in [Sprites importieren](/godot/sprites-importieren).
    resources:
      - title: Godot Docs · Importing images · Compress mode
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_images.html#compress-mode

  - id: fall-2
    type: bug
    title: Fehlerkiste, Fall 2
    prompt: |
      Öffne diese Übung erst nach deiner Diagnose. Symptom: Die Figur läuft durch die Kiste hindurch. Mit `move_right` von (0, 8) aus stand sie nach 60 Ticks bei x = 84 statt bei 27. Sammelstücke sammelt sie weiter ein. Finde die Zeile in `crate.tscn` und korrigiere sie.
    lang: ini
    code: |
      [gd_scene format=3 uid="uid://pf85is85vm4h"]

      [sub_resource type="RectangleShape2D" id="base"]
      size = Vector2(16, 8)

      [node name="Crate" type="StaticBody2D" unique_id=755276202]
      collision_mask = 0
      collision_layer = 4

      [node name="Body" type="Polygon2D" parent="." unique_id=1999749856]
      color = Color(0.6, 0.45, 0.3, 1)
      polygon = PackedVector2Array(-8, -16, 8, -16, 8, 0, -8, 0)

      [node name="Base" type="CollisionShape2D" parent="." unique_id=319616897]
      position = Vector2(0, -4)
      shape = SubResource("base")
    lines: [8]
    fix:
      - line: 8
        answers:
          - collision_layer = 1
    explanation: |
      Die Kiste liegt mit Wert 4 auf Ebene 3, „pickups“. Die Figur sucht mit Maske 1 nur Ebene 1, „world“, findet die Kiste also nicht und läuft hindurch. Die Pickups sind nicht betroffen, weil sie die Figur auf Ebene 2 suchen. Im Testgelände steht in `crate.tscn` gar keine Zeile `collision_layer`, weil Ebene 1 der Standard ist; die korrigierte Zeile verschwindet beim nächsten Speichern im Editor wieder. Mehr zu Ebenen und Masken in [Kollisionen und Ebenen](/godot/kollision-ebenen).
    resources:
      - title: Godot Docs · Collision layers and masks
        url: https://docs.godotengine.org/en/stable/tutorials/physics/physics_introduction.html#collision-layers-and-masks

  - id: fall-3
    type: bug
    title: Fehlerkiste, Fall 3
    prompt: |
      Öffne diese Übung erst nach deiner Diagnose. Symptom: Alles im Spiel wirkt größer, und das Prüfmuster ist ungleichmäßig: Streifen sind verschieden breit, im Schachbrett sind manche Reihen doppelt so hoch wie andere (rechts im Bild, links der saubere Stand). Finde die Zeile in `player.tscn` und korrigiere sie.

      ![Prüfmuster zweimal: links klein mit gleichmäßigem Schachbrett und gleich breiten Streifen, rechts anderthalbfach so groß mit ungleich breiten Streifen und unregelmäßigem Schachbrett](/media/godot/werkstatt-messen/fall-zoom@2x.png "Godot 4.7.2, links sauberer Stand, rechts nach Fall 3, beide vierfach vergrößert")
    lang: ini
    code: |
      [node name="Feet" type="CollisionShape2D" parent="." unique_id=1982390300]
      position = Vector2(0, -3)
      shape = SubResource("feet")

      [node name="Camera2D" type="Camera2D" parent="." unique_id=380230576]
      zoom = Vector2(1.5, 1.5)

      [node name="Sprite" type="AnimatedSprite2D" parent="." unique_id=942859769]
      sprite_frames = SubResource("SpriteFrames_7ahtn")
    lines: [6]
    fix:
      - line: 6
        answers:
          - zoom = Vector2(1, 1)
          - zoom = Vector2(1.0, 1.0)
    explanation: |
      Ein Zoom von 1,5 verteilt jedes Pixel des Musters auf anderthalb Pixel des 320 × 180-Bilds. Weil es keine halben Pixel gibt, werden manche Pixel zu einem, andere zu zwei. Im Testgelände hat die Kamera keinen eigenen Zoom; der korrigierte Wert ist der Standard und verschwindet beim Speichern aus der Datei. Ob dein Spiel einen ganzzahligen Zoom bekommt, entscheidest du; warum nicht ganzzahlige Faktoren Pixelart verzerren, steht in [Pixelraster und Skalierung](/godot/pixelraster).
    resources:
      - title: Godot Docs · Camera2D.zoom
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-zoom

  - id: fall-4
    type: bug
    title: Fehlerkiste, Fall 4
    prompt: |
      Öffne diese Übung erst nach deiner Diagnose. Symptom: Nach dem Loslassen gleitet die Figur lange weiter. Mit `debug_log` zeigt das Log nach dem Loslassen in Tick 60:

      ```text
      59  speed 90.0
      60  speed 89.5
      61  speed 89.0
      62  speed 88.5
      ```

      Finde die Zeile in `data/player_stats.tres` und korrigiere sie auf den Platzhalter aus `movement_stats.gd`.
    lang: ini
    code: |
      [gd_resource type="Resource" script_class="MovementStats" format=3 uid="uid://c328erhiur8b8"]

      [ext_resource type="Script" uid="uid://bwctjxhdkev23" path="res://movement_stats.gd" id="1"]

      [resource]
      script = ExtResource("1")
      friction = 30.0
    lines: [7]
    fix:
      - line: 7
        answers:
          - friction = 900.0
          - friction = 900
    explanation: |
      Das Tempo sinkt pro Tick um 0,5 px/s, also ist `friction × delta` = 0,5 und `friction` = 30. Mit dem Platzhalter 900 wären es 15 pro Tick. Gemessen mit Godot 4.7.2: Mit 30 stand die Figur nach 180 Ticks, mit 900 nach 6. Die Datei enthält sonst keine Werte, weil alle dem Standard im Skript entsprechen; die korrigierte Zeile verschwindet beim Speichern im Editor wieder. Rechne aus dem Log zurück, bevor du in Dateien suchst: Die Zahl pro Tick verrät den Wert.
    resources:
      - title: Godot Docs · Vector2.move_toward
        url: https://docs.godotengine.org/en/stable/classes/class_vector2.html#class-vector2-method-move-toward

  - id: fall-5
    type: explain
    title: Fehlerkiste, Fall 5
    prompt: |
      Öffne diese Übung erst nach deiner Diagnose. Symptom: Die Sammelstücke verschwinden, der Ton spielt, aber der Zähler im HUD bleibt bei 0. Die Ausgabe ist leer. So endet `main.tscn` jetzt. Erkläre, was fehlt, warum es keine Fehlermeldung gibt und wie du es im Editor siehst und behebst.
    lang: ini
    code: |
      [node name="Messpunkt" type="Node" parent="." unique_id=427264249 node_paths=PackedStringArray("player", "label")]
      script = ExtResource("8_kek77")
      player = NodePath("../Objects/Player")
      label = NodePath("../HUD/Messanzeige")

      [connection signal="collected" from="Objects/Player" to="PickupSound" method="_on_player_collected"]
    points:
      - Die Verbindung von `collected` an `HUD.show_total` fehlt; nur die zu `PickupSound` ist übrig, deshalb spielt der Ton.
      - Ein Signal ohne Empfänger ist kein Fehler; `emit()` läuft durch, und `show_total()` wird nie aufgerufen.
      - Im Signale-Dock des Players fehlt unter `collected` der Eintrag für `HUD`.
      - Behoben wird es durch die Verbindung im Signale-Dock oder `git restore .`; in der Datei steht danach wieder eine `[connection]`-Zeile.
    explanation: |
      `player.gd` sendet `collected`, aber in `main.tscn` ist nur noch `PickupSound` verbunden. Ein Signal ohne Verbindung ist erlaubt, Godot meldet nichts, und `show_total()` läuft nie. Deshalb ist die Ausgabe leer, während Pickups verschwinden und der Ton spielt. Im Signale-Dock siehst du unter `collected` nur einen Empfänger. Die Zeile `[connection signal="collected" from="Objects/Player" to="HUD" method="show_total"]` kommt mit der neuen Verbindung oder mit `git restore .` zurück. Der Fall zeigt, warum ein Symptom ohne Fehlermeldung oft auf eine fehlende Verbindung oder einen falschen Wert hindeutet, nicht auf kaputten Code.
    resources:
      - title: Godot Docs · Using signals
        url: https://docs.godotengine.org/en/stable/getting_started/step_by_step/signals.html

  - id: fall-6
    type: choice
    title: Fehlerkiste, Fall 6
    prompt: |
      Öffne diese Übung erst nach deiner Diagnose. Symptom: Steht die Figur unterhalb der Kiste, also vor ihr, verdeckt die Kiste trotzdem ihr Sprite (rechts im Bild, links der saubere Stand). Im Inspektor steht *Z Index* bei Figur und Kiste auf 0. Welche Einstellung erklärt das?

      ![Zwei Spielausschnitte, sechsfach vergrößert: links steht die Figur mit einem Feld des Testbogens vor der braunen Kiste und verdeckt sie teilweise, rechts an derselben Stelle verdeckt die Kiste die Figur bis auf einen Streifen unten](/media/godot/werkstatt-messen/fall-ysort@2x.png "Godot 4.7.2, links sauberer Stand, rechts nach Fall 6, Figur bei (40, 14), Kiste bei (40, 10)")
    options:
      - text: "`Objects` hat `y_sort_enabled` aus; ohne Y-Sortierung zeichnet Godot die Kinder in Baumreihenfolge, und `Crate` steht nach `Player`."
        correct: true
        why: In `main.tscn` fehlt die Zeile `y_sort_enabled = true` am Node `Objects`. Ohne sie gilt die Baumreihenfolge, unabhängig von der Position.
      - text: Der Ursprung der Figur liegt in der Mitte statt an den Füßen.
        correct: false
        why: Ein falscher Ursprung verschiebt den Punkt, an dem sortiert wird, aber nur, wenn überhaupt sortiert wird. Hier steht die Figur 4 Pixel tiefer als die Kiste und wird trotzdem verdeckt.
      - text: Die Kiste hat einen höheren `z_index` als die Figur.
        correct: false
        why: Das gäbe dasselbe Bild, laut Inspektor steht *Z Index* aber bei beiden auf 0. Prüfen solltest du es trotzdem, unter Ordering.
    explanation: |
      Mit `y_sort_enabled` am gemeinsamen Elternknoten zeichnet Godot die Kinder nach ihrer y-Position: Wer weiter unten steht, wird später gezeichnet und liegt vorn. Ohne gilt die Reihenfolge im Szenen-Dock, und `Crate` kommt nach `Player`. Prüfen lässt sich das im Inspektor von `Objects` unter Ordering und im Diff von `main.tscn`, wo die Zeile `y_sort_enabled = true` fehlt. Wie das mit Tiles zusammenspielt, steht in [Level aus Tiles](/godot/level-tilemap).
    resources:
      - title: Godot Docs · CanvasItem.y_sort_enabled
        url: https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#class-canvasitem-property-y-sort-enabled

  - id: fall-7
    type: bug
    title: Fehlerkiste, Fall 7
    prompt: |
      Öffne diese Übung erst nach deiner Diagnose. Symptom: Beim Einsammeln ist der Ton nicht zu hören. Das Pickup verschwindet, der Zähler zählt. Im Audio-Panel steht der Regler des Busses `SFX` ganz unten (rechts im Bild). Finde die Zeile in `default_bus_layout.tres` und korrigiere sie.

      ![Audio-Panel mit den Bussen Master und SFX; beim Master steht der Lautstärkeregler auf 0 dB, bei SFX ganz unten unter −72 dB](/media/godot/werkstatt-messen/fall-bus@2x.png "Godot 4.7.2, Audio-Panel nach Fall 7; SFX ist der Platzhaltername aus dem Audio-Modul")
    lang: ini
    code: |
      [gd_resource type="AudioBusLayout" format=3]

      [resource]
      bus/1/name = &"SFX"
      bus/1/solo = false
      bus/1/mute = false
      bus/1/bypass_fx = false
      bus/1/volume_db = -80.0
      bus/1/send = &"Master"
    lines: [8]
    fix:
      - line: 8
        answers:
          - bus/1/volume_db = 0.0
          - bus/1/volume_db = 0
    explanation: |
      −80 dB sind ein Zehntausendstel der Amplitude, praktisch stumm. `PickupSound` spielt, sein Bus lässt aber nichts durch. Gemessen mit Godot 4.7.2: `AudioServer.get_bus_volume_db(1)` lieferte `-80.0`, `is_bus_mute(1)` blieb `false`; der Knopf M (Stummschalten) ist also nicht die Ursache. 0 dB ist der Stand des Testgeländes; welche Lautstärke dein Bus bekommt, entscheidest du beim Abmischen.
    resources:
      - title: Godot Docs · Audio buses
        url: https://docs.godotengine.org/en/stable/tutorials/audio/audio_buses.html

  - id: fall-8
    type: output
    title: Fehlerkiste, Fall 8
    prompt: |
      Öffne diese Übung erst nach deiner Diagnose. Symptom: Die Figur bewegt sich in gröberen Schritten, und sie reagiert träger. Du startest das Testgelände mit `--fixed-fps 60`, also mit genau einer Sekunde Spielzeit pro 60 Bilder, und liest den Tick in der Messanzeige vor und nach 60 Bildern. Um wie viel ist er gestiegen?
    lang: ini
    code: |
      [physics]

      common/physics_ticks_per_second=30
    expected: |
      30
    accept:
      - 30 Ticks
    explanation: |
      Die Fehlerkiste hat in `project.godot` die Physik auf 30 Ticks pro Sekunde gesetzt; im Testgelände fehlt der Abschnitt, also gilt der Standard 60. Mit 30 Ticks legt die Figur bei 90 px/s pro Tick 3 statt 1,5 Pixel zurück und reagiert auf Eingaben nur halb so oft. Gemessen mit Godot 4.7.2: 30 Ticks in 60 Bildern statt 60, und die Figur stand 3 statt 6 Ticks nach dem Loslassen. Unter *Projekteinstellungen → Physik → Allgemein* siehst du den Wert als „Physik-Ticks pro Sekunde“.
    resources:
      - title: Godot Docs · Engine.physics_ticks_per_second
        url: https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-property-physics-ticks-per-second

  - id: pruefstand-aufbauen
    type: practice
    title: Prüfstand aufbauen und die Kiste öffnen
    prompt: |
      Ergänze das Testgelände um den Prüfstand aus der Lektion: Prüfmuster als `Sprite2D`, Messanzeige und Messpunkt; `PickupSound` und den Bus `SFX` hast du aus dem Audio-Modul. Prüfe den Messpunkt mit einer Vorhersage, committe, leg die Fehlerkiste unter `~/werkstatt/fehlerkiste.gd` ab und öffne sie einmal.
    lang: text
    solution: |
      Szenen-Dock von main.tscn:
        Objects/Pruefmuster Sprite2D, Texture test_assets/pruefmuster.png
        HUD/Messanzeige     Label, Theme Overrides → Font Sizes 8
        PickupSound         aus dem Audio-Modul, Bus SFX
        Messpunkt           Node, messpunkt.gd,
                            Player = Objects/Player, Label = HUD/Messanzeige

      Vorhersage mit time_scale 0.25 am Messpunkt:
        36 Ticks bis 90 px/s, Anzeige danach "Tempo  90.0 px/s"

      $ git add -A && git commit -m "Prüfstand für die Werkstatt"
      $ git status --short
      $ godot --headless --path . -s ~/werkstatt/fehlerkiste.gd
      Ein Fehler ist eingebaut. Die Nummer steht in …/godot/app_userdata/Testgelände/fehlerkiste.txt
      $ git status --short
       M <genau eine Datei>
    checklist:
      - Das Prüfmuster steht im Spiel, die Messanzeige zeigt Tempo und Tick.
      - Im Reiter Monitore gibt es die Gruppe „Testgelände“ mit „Gesammelt“, und der Wert steigt beim Einsammeln.
      - Deine Vorhersage für einen geänderten Wert steht im Protokoll, bevor du gemessen hast, und die Messung daneben.
      - "`git status` war vor dem Öffnen der Kiste leer und zeigt danach genau eine geänderte Datei."
      - Du hast die Kiste bei geschlossenem Editor geöffnet und `fehlerkiste.txt` noch nicht angesehen.
    explanation: |
      Der Prüfstand macht die Fehler der Kiste sichtbar: Ohne Prüfmuster fällt ein Importfehler kaum auf, ohne Ton auf eigenem Bus gibt es keinen Busfehler, ohne Messanzeige siehst du den Physik-Takt nicht. Die Vorhersage prüft den Messpunkt selbst, bevor du ihm Messungen anvertraust. Eine geänderte Datei nach dem Öffnen ist das Zeichen, dass die Kiste gearbeitet hat; welche, liest du erst nach deiner Diagnose. Fehlt eine Voraussetzung, etwa das Prüfmuster, wählt die Kiste einen anderen Fehler.
    resources:
      - title: Godot Docs · Custom performance monitors
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/debug/custom_performance_monitors.html
      - title: Godot Docs · Command line tutorial · Running a script
        url: https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html#running-a-script

  - id: korrekturprotokoll
    type: practice
    title: Acht Fälle im Korrekturprotokoll
    prompt: |
      Arbeite die Fehlerkiste durch, bis du alle acht Fälle einmal gefunden hast, und führe dabei `KORREKTUREN.md` nach der Vorlage aus der Lektion. Ergänze `EINSTELLUNGEN.md` um jede Einstellung des Prüfstands, die vom Standard abweicht.
    lang: prose
    checklist:
      - "`KORREKTUREN.md` hat acht Einträge, jeder mit Symptom, Vermutung, Prüfung, Ursache, Korrektur, Beleg und Dauer."
      - Jedes Symptom ist eine Beobachtung, keine Diagnose.
      - Bei jedem Eintrag steht die Vermutung vor der Prüfung, und bei mindestens einem Fall ist eine Vermutung als falsch markiert, falls es eine gab.
      - Jeder Beleg ist eine Diff-Zeile, ein Log-Ausschnitt oder ein Screenshot.
      - "`EINSTELLUNGEN.md` nennt für jede Abweichung im Prüfstand Datei oder Dock, und übernommene Kurswerte sind als Platzhalter markiert."
      - Nach jedem Fall war `git status` nach `git restore .` leer.
    hints:
      - Wiederholt sich eine Nummer, öffne die Kiste noch einmal; mit `-- 4` am Ende baust du einen bestimmten Fall gezielt ein, wenn nur noch einer fehlt.
      - Notiere die Dauer bis zur Ursache; beim zweiten Durchgang derselben Kategorie siehst du, was du gelernt hast.
    explanation: |
      Das Protokoll ist der Teil, den ein Team von dir sieht. Es trennt Beobachtung und Deutung und macht jeden Fund mit einem Beleg nachprüfbar. Falsche Vermutungen gehören hinein, denn sie zeigen, welche Stellen du schon ausgeschlossen hast. `EINSTELLUNGEN.md` beantwortet die Frage, die in fremden Projekten am meisten Zeit kostet: Was weicht hier vom Standard ab, und warum. Beide Dateien sind Teil des Abschlussprojekts.
    resources:
      - title: Godot Docs · Overview of debugging tools
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html
