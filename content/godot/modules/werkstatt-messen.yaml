id: werkstatt-messen
title: "Werkstatt: vorhersagen, ändern, messen – und vorbereitete Fehler finden"
level: 3
minutes: 180
summary: Am Testgelände misst du mit Log, Anzeige, eigenem Monitor und Zeitlupe, sagst Änderungen vorher und prüfst sie – und öffnest die Fehlerkiste, die einen von acht vorbereiteten Fehlern einbaut, den du über sein Symptom findest, im Diff belegst und protokollierst.
place: pc
goals:
  - Du baust am Testgelände einen Messpunkt mit Anzeige im Spiel, eigenem Monitor im Debugger und einem Regler für `Engine.time_scale`.
  - Du sagst vor einer Änderung voraus, was Log und Anzeige danach zeigen, und vergleichst mit der Messung.
  - Du nimmst die Fehlerkiste in Betrieb, baust Fehler ein, ohne nachzusehen, und setzt das Projekt mit Git zurück.
  - Du findest acht vorbereitete Fehler aus Import, Kollision, Skalierung, Parametern, Signalen, Y-Sortierung, Audio-Bus und Physik-Takt über ihr Symptom.
  - Du führst ein Korrektur- und Einstellungsprotokoll, das das Abschlussprojekt fortsetzt.
