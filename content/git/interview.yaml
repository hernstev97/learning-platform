cards:
  - id: drei-bereiche
    module: git-einstieg
    q: Welche drei Bereiche unterscheidet Git, und wie wandert eine Änderung durch sie hindurch?
    a: |
      Arbeitsverzeichnis, Index (Staging Area) und Repository. Ich ändere `src/api.py` im Arbeitsverzeichnis, `git add` legt genau diesen Stand in den Index, `git commit` macht aus dem Index einen neuen Commit. Der Index ist also der Entwurf des nächsten Commits – deshalb kann ich eine Datei stagen und danach weiter ändern, ohne dass die spätere Änderung mitkommt.

      Abgrenzung: `git diff` zeigt Arbeitsverzeichnis gegen Index, `git diff --staged` Index gegen `HEAD`.
    tags: [grundlagen, index]
    level: 1
  - id: snapshots-statt-diffs
    module: datenmodell
    q: Speichert Git Änderungen als Diffs?
    a: |
      Nein. Jeder Commit zeigt auf einen vollständigen Snapshot des Projekts in Form eines Trees. Unveränderte Dateien kosten trotzdem kaum Platz, weil gleicher Inhalt denselben Blob ergibt und nur einmal gespeichert wird. Diffs berechnet Git beim Anzeigen, etwa in `git show` oder `git log -p`.

      Abgrenzung: In Packfiles speichert Git Objekte zusätzlich als Deltas. Das ist eine Speicheroptimierung, nicht das Datenmodell.
    tags: [grundlagen, datenmodell]
    level: 1
  - id: config-ebenen
    module: git-einstieg
    q: Ein Commit trägt die falsche E-Mail-Adresse. Wie findest du heraus, woher der Wert kommt?
    a: |
      Mit `git config --show-origin --show-scope user.email`. Git liest die Ebenen system, global (`~/.gitconfig`) und local (`.git/config`); die spezifischere Ebene gewinnt. Oft steckt eine alte lokale Einstellung dahinter oder eine Umgebungsvariable wie `GIT_AUTHOR_EMAIL`.

      Für getrennte Arbeits- und Privatprojekte nutze ich `includeIf "gitdir:~/arbeit/"` in der globalen Konfiguration, statt in jedem Repository von Hand zu setzen.
    tags: [grundlagen, konfiguration]
    level: 1
  - id: objekttypen
    module: datenmodell
    q: Welche Objekttypen kennt Git und wie hängen sie zusammen?
    a: |
      Blob, Tree, Commit und annotierter Tag. Ein Blob enthält nur Dateiinhalt, ohne Namen. Ein Tree listet Namen, Modi und die Hashes von Blobs und Unter-Trees. Ein Commit zeigt auf genau einen Wurzel-Tree, auf null oder mehr Eltern und enthält Autor, Committer und Nachricht. Ein annotierter Tag zeigt meist auf einen Commit und trägt eigene Metadaten.

      Branches und `HEAD` sind keine Objekte, sondern Refs – Namen, die auf Objekte zeigen.
    tags: [datenmodell]
    level: 1
  - id: inhaltsadressiert
    module: datenmodell
    q: Was bedeutet „inhaltsadressiert“ und welche Folgen hat das im Alltag?
    a: |
      Der Name eines Objekts ist der Hash über Typ, Größe und Inhalt. Zwei Dateien mit identischem Inhalt ergeben denselben Blob, auch in verschiedenen Verzeichnissen. Ein Commit-Hash hängt am Tree, an den Eltern, an Autor, Zeitstempeln und Nachricht.

      Die wichtigste Folge: Ändere ich irgendetwas an einem Commit – Nachricht, Eltern, Inhalt –, entsteht ein neuer Commit mit neuem Hash. Deshalb erzeugen `commit --amend`, Rebase und Cherry-pick immer neue Commits, und deshalb ist umgeschriebene History für Kollegen ein Problem.
    tags: [datenmodell, rebase]
    level: 2
  - id: umbenennung
    module: datenmodell
    q: Wie merkt sich Git, dass eine Datei umbenannt wurde?
    a: |
      Gar nicht. Ein Commit speichert nur Snapshots; eine Umbenennung ist dort ein verschwundener und ein neuer Pfad. Beim Anzeigen erkennt Git Umbenennungen heuristisch über Ähnlichkeit, standardmäßig ab 50 Prozent (`-M`).

      Praktische Folge: Wer im selben Commit umbenennt und stark umbaut, verliert die Erkennung, und `git log --follow` oder `blame` finden die Vorgeschichte schlechter. Deshalb Umbenennen und Umbauen in getrennte Commits.
    tags: [datenmodell, commits]
    level: 2
  - id: branch-technisch
    module: datenmodell
    q: Was ist ein Branch technisch, und warum ist Branchen in Git so billig?
    a: |
      Ein Branch ist eine Ref: eine Datei unter `.git/refs/heads/` (oder ein Eintrag in `packed-refs`), die einen Commit-Hash enthält. Einen Branch anzulegen schreibt also 41 Byte, es wird nichts kopiert. Beim Committen rückt der Branch, auf den `HEAD` zeigt, auf den neuen Commit vor.

      Abgrenzung: `HEAD` ist eine symbolische Ref, die normalerweise auf einen Branch zeigt, nicht direkt auf einen Commit.
    tags: [datenmodell, branches]
    level: 1
  - id: tilde-vs-caret
    module: datenmodell
    q: Was ist der Unterschied zwischen `HEAD~2` und `HEAD^2`?
    a: |
      `~` geht Generationen zurück und folgt dabei immer dem ersten Elternteil: `HEAD~2` ist der Großelter. `^n` wählt den n-ten Elternteil: `HEAD^2` ist der zweite Elternteil eines Merge-Commits, also die Spitze des hineingemergten Branches.

      Bei einem normalen Commit ohne zweiten Elternteil existiert `HEAD^2` nicht. `HEAD^` und `HEAD~` sind dagegen gleich.
    tags: [datenmodell, revisionen]
    level: 2
  - id: detached-head
    module: branches-head
    q: Was ist ein Detached HEAD, wann entsteht er und wie verlierst du darin keine Arbeit?
    a: |
      `HEAD` zeigt direkt auf einen Commit statt auf einen Branch. Das passiert mit `git switch --detach v2.4.0`, `git checkout <hash>`, während eines Rebase und bei `bisect`. Commits sind darin möglich, aber kein Branch bewegt sich mit.

      Wechsle ich weg, sind diese Commits nur noch über den Reflog erreichbar. Git warnt mit „you are leaving 1 commit behind“. Rettung: vorher `git switch -c fix/login`, nachher `git branch fix/login <hash>` mit dem Hash aus der Warnung oder aus `git reflog`.
    tags: [branches, recovery]
    level: 1
  - id: fetch-vs-pull
    module: branches-head
    q: Was unterscheidet `git fetch` von `git pull`?
    a: |
      `fetch` lädt neue Objekte und aktualisiert Remote-Tracking-Branches wie `origin/main`, fasst aber meine Branches und mein Arbeitsverzeichnis nicht an. `pull` ist `fetch` plus Integration in den aktuellen Branch – per Merge, Rebase oder nur Fast-Forward, je nach `pull.rebase` und `pull.ff`.

      Ich fetche lieber zuerst und schaue mit `git log main..origin/main`, was kommt. Sind die Branches auseinandergelaufen und nichts ist konfiguriert, bricht `git pull` heute mit „Need to specify how to reconcile divergent branches“ ab.
    tags: [remotes]
    level: 1
  - id: remote-tracking-branch
    module: branches-head
    q: Was ist `origin/main`, und wann ändert es sich?
    a: |
      Ein Remote-Tracking-Branch: meine lokale Kopie des Stands, den `main` auf `origin` beim letzten Kontakt hatte. Er ändert sich nur bei `fetch`, `pull` und `push`, nie durch Arbeit auf dem Server allein. Ich kann ihn nicht auschecken und darauf committen, ohne in Detached HEAD zu landen.

      Deshalb kann `git status` „up to date with origin/main“ melden, obwohl längst neue Commits auf dem Server liegen.
    tags: [remotes, branches]
    level: 1
  - id: zwei-vs-drei-punkte
    module: branches-head
    q: Was bedeuten `main..feature` und `main...feature` in `git log` – und in `git diff`?
    a: |
      In `log` heißt `main..feature`: Commits, die von `feature` erreichbar sind, aber nicht von `main` – also was der Branch mitbringt. `main...feature` ist die symmetrische Differenz: Commits, die nur auf einer der beiden Seiten liegen; mit `--left-right` sehe ich, welche Seite.

      In `diff` ist es anders: `git diff main..feature` ist dasselbe wie `git diff main feature`. `git diff main...feature` vergleicht die Merge-Base mit `feature` und zeigt nur die Änderungen des Branches – genau das, was ein Pull Request anzeigt.
    tags: [revisionen, branches]
    level: 2
  - id: guter-commit
    module: commit-hygiene
    q: Was macht für dich einen guten Commit aus?
    a: |
      Er enthält genau eine logische Änderung, baut und besteht die Tests für sich allein und hat eine Nachricht, die das Warum erklärt. Beispiel: „Validiere Ablaufdatum des Login-Tokens“ mit Code und Test in einem Commit, die Formatierung der ganzen Datei in einem eigenen.

      Das zahlt sich später aus: `revert` nimmt genau eine Sache zurück, `bisect` findet einen präzisen Schuldigen, und ein Reviewer kann Commit für Commit lesen. Mehrere Themen in einer Datei trenne ich mit `git add -p`.
    tags: [commits, review]
    level: 1
  - id: commit-nachricht
    module: commit-hygiene
    q: Wie schreibst du eine Commit-Nachricht?
    a: |
      Betreff im Imperativ, knapp (Richtwert 50, höchstens etwa 72 Zeichen), ohne Punkt: „Begrenze Login-Versuche pro IP“. Leerzeile, dann ein Body, der erklärt, warum die Änderung nötig ist und welche Alternativen verworfen wurden – das Was steht im Diff. Am Ende Trailer wie `Refs: LRN-42` oder `Co-authored-by:`.

      Ein Team, das Conventional Commits nutzt, setzt `fix:` oder `feat:` davor. „fix“, „wip“ oder „changes“ als Nachricht fallen in jedem Review negativ auf.
    tags: [commits]
    level: 1
  - id: gitignore-wirkt-nicht
    module: commit-hygiene
    q: Du hast `config.local.yaml` in `.gitignore` eingetragen, aber Git zeigt Änderungen daran weiter an. Warum?
    a: |
      `.gitignore` gilt nur für untracked Dateien. Die Datei ist schon im Index und damit getrackt. Lösung: `git rm --cached config.local.yaml`, committen, dann greift der Eintrag. Die Datei bleibt lokal liegen, verschwindet aber bei Kollegen beim nächsten Pull aus dem Arbeitsverzeichnis – das kündige ich an.

      Mit `git check-ignore -v datei` sehe ich, welche Regel in welcher Datei greift. Enthält die Datei ein Secret, reicht das nicht: Es steckt weiter in der History und muss rotiert werden.
    tags: [commits, konfiguration]
    level: 1
  - id: conventional-commits
    module: commit-hygiene
    q: Was bringen Conventional Commits, und wann lohnen sie sich nicht?
    a: |
      Ein festes Präfix wie `feat:`, `fix:` oder `feat!:` bzw. ein `BREAKING CHANGE:`-Footer macht Nachrichten maschinenlesbar. Werkzeuge leiten daraus die nächste SemVer-Version und den Changelog ab, CI kann das Format per `commit-msg`-Hook und im PR prüfen.

      Sie ersetzen keinen guten Betreff und keinen Body. Bei einer internen App ohne Versionsnummern oder wenn das Team per Squash-Merge ohnehin nur den PR-Titel übernimmt, reicht es oft, nur den PR-Titel im Format zu prüfen.
    tags: [commits, releases]
    level: 2
  - id: fast-forward-vs-drei-wege
    module: merge
    q: Wann macht `git merge` einen Fast-Forward und wann einen Merge-Commit?
    a: |
      Ist der aktuelle Branch Vorfahre des anderen, gibt es nichts zusammenzuführen: Git schiebt den Zeiger vor, ohne neuen Commit. Sind beide auseinandergelaufen, berechnet Git aus Merge-Base und beiden Spitzen einen Drei-Wege-Merge und erzeugt einen Commit mit zwei Eltern.

      `--no-ff` erzwingt den Merge-Commit, damit ein Feature als Einheit sichtbar bleibt und `git log --first-parent main` nur die Integrationen zeigt. `--ff-only` verweigert alles außer Fast-Forward – gut für `pull` auf `main`.
    tags: [merge]
    level: 1
  - id: merge-vs-rebase
    module: rebase
    q: Merge oder Rebase – wie entscheidest du?
    a: |
      Beide integrieren dieselben Änderungen, sie erzählen die History anders. Merge bewahrt die tatsächliche Entstehung und schreibt nichts um, erzeugt aber Merge-Commits. Rebase spielt meine Commits auf die neue Basis und liefert eine lineare History, erzeugt dabei neue Commits und kann Zwischenstände erzeugen, die so nie getestet wurden.

      Meine Regel: Eigene, noch nicht geteilte Branches rebase ich auf `main`, bevor ich den PR öffne. Geteilte Branches merge ich. Was am Ende in `main` landet, entscheidet die Teamkonvention für PRs, nicht meine Vorliebe.
    tags: [merge, rebase]
    level: 2
  - id: squash-merge-folgen
    module: merge
    q: Welche Folgen hat ein Squash-Merge für den Branch?
    a: |
      `git merge --squash feature` übernimmt die Änderungen als einen einzigen neuen Commit, verbindet ihn aber nicht mit `feature`. Für Git ist der Branch danach nicht gemergt: `git branch -d` verweigert das Löschen, und wer auf dem alten Branch weiterarbeitet und später erneut mergt, bekommt Konflikte oder doppelte Änderungen.

      Deshalb nach einem Squash-Merge den Branch löschen und neue Arbeit von aktuellem `main` beginnen. `git cherry main feature` zeigt mit `-`, dass die Patches inhaltlich schon drin sind.
    tags: [merge, pull-requests]
    level: 2
  - id: x-ours-vs-s-ours
    module: merge
    q: Was unterscheidet `git merge -X ours` von `git merge -s ours`?
    a: |
      `-X ours` ist eine Option der normalen Strategie `ort`: Nicht widersprüchliche Änderungen beider Seiten werden gemergt, nur in widersprüchlichen Hunks gewinnt meine Seite. `-s ours` ist eine eigene Strategie: Das Ergebnis ist exakt mein Tree, die andere Seite wird komplett ignoriert, nur als Elternteil vermerkt.

      `-s ours` nutzt man selten, etwa um einen alten Release-Branch als „erledigt“ zu markieren. Beide ersetzen kein Nachdenken über den Konflikt.
    tags: [merge, konflikte]
    level: 3
  - id: konflikt-vorgehen
    module: konflikte
    q: Beim Merge meldet Git einen Konflikt in `src/api.py`. Wie gehst du vor?
    a: |
      Erst Überblick: `git status` bzw. `git diff --name-only --diff-filter=U`. Dann verstehe ich beide Absichten: Mit `merge.conflictStyle=zdiff3` zeigen die Marker zusätzlich die Basis, `git log --merge -p src/api.py` zeigt die beteiligten Commits. Ich kombiniere fachlich richtig, statt blind eine Seite zu nehmen, entferne alle Marker, führe Tests aus, `git add` und `git merge --continue`.

      Wird es unübersichtlich, ist `git merge --abort` ein legitimer Schritt – danach mit der Kollegin sprechen oder den Branch in kleinere Schritte teilen.
    tags: [konflikte]
    level: 2
  - id: ours-theirs-rebase
    module: konflikte
    q: Warum sind „ours“ und „theirs“ beim Rebase vertauscht?
    a: |
      Beim Merge ist „ours“ der Branch, auf dem ich stehe, „theirs“ der hineingemergte. Beim Rebase steht Git auf der neuen Basis und spielt meine Commits einzeln darauf. Aus Sicht dieser Operation ist „ours“ also `main` samt schon übertragener Commits, „theirs“ ist mein Commit, der gerade angewendet wird.

      `git checkout --theirs config.yaml` während `git rebase main` nimmt also meine Version. Ich prüfe im Zweifel mit `git show :2:config.yaml` und `:3:`, statt mich auf das Gedächtnis zu verlassen.
    tags: [konflikte, rebase]
    level: 2
  - id: lockfile-konflikt
    module: konflikte
    q: Konflikt in `package-lock.json` oder `poetry.lock`. Was tust du?
    a: |
      Nicht von Hand mergen. Ich löse den Konflikt in der Quelldatei (`package.json`, `pyproject.toml`), nehme für die Lock-Datei eine Seite als Ausgangspunkt, erzeuge sie mit dem Paketmanager neu und committe das Ergebnis. Tests und Build prüfen, dass die Auflösung stimmt.

      Gleiches gilt für andere generierte Dateien. Handgemergte Lock-Dateien sind syntaktisch oft gültig, aber inkonsistent – ein typischer Review-Fund.
    tags: [konflikte, review]
    level: 2
  - id: rerere
    module: konflikte
    q: Was macht `rerere` und wann hilft es?
    a: |
      „Reuse recorded resolution“: Mit `rerere.enabled=true` merkt sich Git, wie ich einen bestimmten Konflikt gelöst habe, und wendet die Lösung automatisch an, wenn derselbe Konflikt wieder auftritt.

      Das hilft, wenn ich einen langlebigen Branch mehrfach rebase oder testweise merge und jedes Mal dieselben Konflikte bekomme. Die Auflösung prüfe ich trotzdem und lasse Tests laufen – eine falsch gemerkte Lösung wird ebenso zuverlässig wiederholt.
    tags: [konflikte, rebase]
    level: 3
  - id: goldene-regel
    module: rebase
    q: Was ist die „goldene Regel“ des Rebase?
    a: |
      Keine Commits umschreiben, auf denen andere schon aufbauen. Rebase erzeugt neue Commits; wer die alten schon hat, bekommt nach meinem Force-Push doppelte Commits und Konflikte.

      In der Praxis: Meinen eigenen Feature-Branch darf ich auch nach dem Push rebasen, wenn niemand anderes darauf arbeitet und ich `--force-with-lease` verwende. `main` und gemeinsam genutzte Branches schreibe ich nie um – dort ist `revert` das Mittel.
    tags: [rebase, team]
    level: 1
  - id: force-with-lease
    module: rebase
    q: Warum `git push --force-with-lease` statt `--force`?
    a: |
      `--force` überschreibt den Remote-Branch bedingungslos, auch wenn eine Kollegin inzwischen gepusht hat. `--force-with-lease` überschreibt nur, wenn der Remote-Branch noch auf dem Stand steht, den mein `origin/feature` kennt; sonst lehnt Git mit „stale info“ ab.

      Die Grenze: Ein `git fetch` direkt davor aktualisiert `origin/feature`, und der Schutz greift nicht mehr. `--force-if-includes` ergänzt eine Prüfung, ob ich den Remote-Stand lokal tatsächlich eingearbeitet habe. Nach einer Ablehnung: fetchen, fremde Commits ansehen, einarbeiten, erneut pushen.
    tags: [rebase, remotes]
    level: 2
  - id: rebase-onto
    module: rebase
    q: Dein Branch `feature/export` wurde versehentlich von `feature/login` statt von `main` abgezweigt. Wie löst du ihn?
    a: |
      Mit `git rebase --onto main feature/login feature/export`. Das nimmt alle Commits, die in `feature/export` sind, aber nicht in `feature/login`, und spielt sie auf `main`. Die Login-Commits bleiben zurück.

      Vorher setze ich ein Lesezeichen (`git branch export-backup`), danach prüfe ich mit `git log --format=%s main..feature/export`, dass nur meine Commits übrig sind. Bei gestapelten PRs nimmt `--update-refs` die Zwischen-Branches automatisch mit.
    tags: [rebase]
    level: 3
  - id: push-abgelehnt
    module: pull-requests
    q: Dein Push wird mit „rejected … (fetch first)“ abgelehnt. Was tust du?
    a: |
      Die Meldung heißt: Auf dem Remote liegen Commits, die ich nicht habe; ein Push wäre kein Fast-Forward. Ich mache `git fetch`, sehe mir mit `git log HEAD..origin/main` die fremden Commits an, integriere mit `git rebase origin/main` (bzw. `git pull --rebase`) oder Merge, lasse die Tests laufen und pushe erneut.

      Falsch wäre `--force`: Das würde die Arbeit der anderen löschen. Auf `main` verhindert Branch Protection das ohnehin.
    tags: [remotes, team]
    level: 1
  - id: fixup-autosquash
    module: interactive-rebase
    q: Ein Reviewer findet einen Tippfehler in deinem zweiten von vier Commits. Wie arbeitest du das sauber ein?
    a: |
      `git commit --fixup=<hash>` mit der Korrektur, dann `git rebase -i --autosquash main`. Git sortiert den `fixup!`-Commit direkt hinter den Ziel-Commit und verschmilzt ihn, ohne dass ich die Todo-Liste von Hand bearbeiten muss. Danach `git push --force-with-lease`.

      Viele Teams lassen Fixup-Commits während des Reviews stehen, damit der Reviewer nur die Änderung sieht, und squashen erst unmittelbar vor dem Merge. Mit `rebase.autoSquash=true` braucht es die Option nicht.
    tags: [interactive-rebase, review]
    level: 2
  - id: history-aufraeumen-wann
    module: interactive-rebase
    q: Wann räumst du History mit interaktivem Rebase auf – und wann nicht?
    a: |
      Vor dem Review bzw. vor dem Merge meines eigenen Branches: WIP-Commits zusammenfassen, Nachrichten verbessern, Fixups einarbeiten, einen Commit mit versehentlich eingechecktem Debug-Code entfernen. Ziel ist eine Folge von Commits, die jeweils einzeln Sinn ergeben und bauen – `git rebase -i --exec "pytest -q" main` prüft das.

      Nicht bei geteilten Branches und nicht auf `main`. Und nicht zum Selbstzweck: Wenn das Team per Squash mergt, ist aufwendige Commit-Kosmetik wenig wert.
    tags: [interactive-rebase, commits]
    level: 2
  - id: commit-aufteilen
    module: interactive-rebase
    q: Ein Commit mitten im Branch enthält zwei unabhängige Änderungen. Wie teilst du ihn?
    a: |
      `git rebase -i main`, den Commit auf `edit` setzen. Wenn der Rebase dort anhält: `git reset HEAD~` – die Änderungen liegen jetzt ungestaged im Arbeitsverzeichnis. Dann mit `git add -p` den ersten Teil stagen und committen, den Rest ebenso, zum Schluss `git rebase --continue`.

      Danach prüfe ich, dass beide neuen Commits einzeln bauen. Ist der Commit schon gepusht, gilt die goldene Regel.
    tags: [interactive-rebase, commits]
    level: 3
  - id: revert-vs-reset
    module: cherry-pick-revert
    q: Ein fehlerhafter Commit ist schon auf `main`. `reset` oder `revert`?
    a: |
      `revert`. Er erzeugt einen neuen Commit, der die Änderung umkehrt, und lässt die bestehende History intakt – alle anderen können normal pullen. `reset` würde `main` zurücksetzen und einen Force-Push verlangen; das bricht die Clones aller Kollegen und ist auf geschützten Branches ohnehin verboten.

      `reset` ist das Werkzeug für lokale, noch nicht geteilte Commits.
    tags: [revert, reset]
    level: 1
  - id: backport-hotfix
    module: cherry-pick-revert
    q: Ein Sicherheitsfix liegt auf `main` und muss auch auf `release/2.4`. Wie gehst du vor?
    a: |
      `git switch release/2.4`, dann `git cherry-pick -x <hash>`. `-x` hängt „(cherry picked from commit …)“ an die Nachricht, damit später nachvollziehbar ist, woher der Commit stammt. Konflikte löse ich wie beim Merge, danach Tests auf dem Release-Branch.

      Der Fix sollte ein eigener, kleiner Commit sein – deshalb lohnen atomare Commits. Mehrere Commits wähle ich mit `A^..B`, weil `A..B` den Commit `A` selbst ausschließt.
    tags: [cherry-pick, releases]
    level: 2
  - id: revert-merge-wieder-mergen
    module: cherry-pick-revert
    q: Ihr habt einen Feature-Merge mit `git revert -m 1` zurückgenommen. Das Feature ist repariert, aber erneutes Mergen bringt die alten Änderungen nicht zurück. Warum?
    a: |
      Die ursprünglichen Feature-Commits sind nach dem ersten Merge schon Vorfahren von `main`. Git sieht sie als integriert an und übernimmt nur neue Commits; der Revert-Commit hält die alten Änderungen weiter entfernt.

      Lösung: zuerst den Revert revertieren (`git revert <revert-hash>`), dann den reparierten Branch mergen. `-m 1` beim ersten Revert bedeutet übrigens: Behalte die Seite des ersten Elternteils, also `main`.
    tags: [revert, merge]
    level: 3
  - id: reset-modi
    module: reset-reflog
    q: Erkläre `reset --soft`, `--mixed` und `--hard`.
    a: |
      Alle drei setzen den aktuellen Branch (über `HEAD`) auf den Zielcommit. `--soft` lässt Index und Arbeitsverzeichnis in Ruhe – die Änderungen der entfernten Commits sind gestaged. `--mixed` (Standard) setzt zusätzlich den Index zurück – die Änderungen liegen ungestaged im Arbeitsverzeichnis. `--hard` setzt auch das Arbeitsverzeichnis zurück – uncommittete Änderungen an getrackten Dateien sind weg.

      Beispiel: `git reset --soft HEAD~3` und neu committen fasst drei Commits zu einem zusammen.
    tags: [reset]
    level: 2
  - id: reset-hard-verloren
    module: reset-reflog
    q: Du hast mit `git reset --hard HEAD~3` drei Commits „verloren“. Was tust du?
    a: |
      Ruhig bleiben, die Commits existieren noch. `git reflog` zeigt, wohin `HEAD` vorher zeigte, etwa `HEAD@{1}`. Direkt nach dem Reset reicht `git reset --hard ORIG_HEAD` oder `git reset --hard HEAD@{1}`. Sicherer ist zuerst ein Lesezeichen: `git branch rettung HEAD@{1}`, dann prüfen und zurücksetzen.

      Verloren wären dagegen uncommittete Änderungen, die nie gestaged waren – die kennt Git nicht. Nur gestagte, nicht committete Inhalte lassen sich noch als dangling Blobs über `git fsck --lost-found` finden.
    tags: [recovery, reflog]
    level: 2
  - id: was-ist-verloren
    module: reset-reflog
    q: Was ist in Git endgültig verloren, und was lässt sich zurückholen?
    a: |
      Zurückholbar: alles, was je committet wurde (über Reflog, auch bei gelöschten Branches oder misslungenem Rebase), gedroppte Stashes und gestagte Inhalte als unerreichbare Objekte über `git fsck`. Der Reflog behält erreichbare Einträge standardmäßig 90 Tage, unerreichbare 30; `git gc` löscht unerreichbare Objekte erst nach einer Karenzzeit.

      Verloren: Änderungen, die nie gestaged oder committet wurden und durch `reset --hard`, `restore` oder `checkout -- datei` überschrieben wurden. Der Reflog ist außerdem lokal – ein frischer Clone hat ihn nicht.
    tags: [recovery, reflog]
    level: 2
  - id: rebase-rueckgaengig
    module: reset-reflog
    q: Ein Rebase hat dir den Branch zerschossen. Wie kommst du zum Zustand davor zurück?
    a: |
      Läuft er noch: `git rebase --abort`. Ist er abgeschlossen: direkt danach zeigt `ORIG_HEAD` auf die alte Spitze, also `git reset --hard ORIG_HEAD`. Später hilft der Branch-Reflog: `git reflog feature/login` zeigt oben „rebase (finish)“ und direkt darunter die alte Spitze, also `git reset --hard feature/login@{1}` (bei späteren Commits die passende Nummer). Im Reflog von `HEAD` steht die alte Spitze vor dem Eintrag „rebase (start)“.

      Vorsorge: vor riskanten Rebases `git branch backup/login` anlegen. Das kostet nichts.
    tags: [recovery, rebase]
    level: 2
  - id: stash-wip-worktree
    module: stash-worktrees
    q: Du musst mitten in der Arbeit einen Hotfix machen. Stash, WIP-Commit oder Worktree?
    a: |
      Für eine kurze Unterbrechung reicht `git stash push -u -m "login halb fertig"` – `-u` nimmt auch neue Dateien mit. Dauert es länger, ist ein WIP-Commit auf dem Feature-Branch robuster, weil er am Branch hängt und nicht in einer globalen Stash-Liste verschwindet. Muss ich parallel bauen, testen oder reviewen, nehme ich `git worktree add ../hotfix -b hotfix/login-timeout main` und lasse meine Arbeit unberührt.

      Beim Stash-Pop mit Konflikt bleibt der Stash erhalten; ich droppe ihn erst, wenn alles gelöst ist.
    tags: [stash, worktrees]
    level: 2
  - id: worktree-grenzen
    module: stash-worktrees
    q: Was teilen sich Worktrees, und was nicht?
    a: |
      Alle Worktrees eines Repositorys teilen Objekte, Refs, Konfiguration und die Stash-Liste. Jeder hat eigenes Arbeitsverzeichnis, eigenen Index und eigenes `HEAD`. Ein Branch kann nur in einem Worktree ausgecheckt sein; sonst meldet Git „already used by worktree“.

      Lösche ich ein Worktree-Verzeichnis per `rm -rf`, bleibt die Verwaltung stehen. `git worktree prune` räumt auf, besser gleich `git worktree remove`.
    tags: [worktrees]
    level: 2
  - id: bisect-run
    module: bisect-historie
    q: Seit dem letzten Release schlägt ein Login-Test fehl, dazwischen liegen 300 Commits. Wie findest du den Schuldigen?
    a: |
      `git bisect start HEAD v2.3.0`, dann `git bisect run pytest -q tests/test_login.py`. Bisect halbiert den Bereich; nach etwa neun Schritten steht der erste schlechte Commit fest. Der Befehl muss mit 0 für „gut“ und 1–127 außer 125 für „schlecht“ enden; 125 überspringt einen nicht testbaren Commit, 128 und mehr brechen ab. Am Ende `git bisect reset`.

      Das funktioniert nur, wenn die Commits einzeln bauen und atomar sind – ein weiterer Grund für saubere Commits.
    tags: [bisect, historie]
    level: 3
  - id: pickaxe-blame
    module: bisect-historie
    q: Wie findest du heraus, wer und warum eine bestimmte Zeile eingeführt hat?
    a: |
      `git blame -w -C -M src/api.py` zeigt pro Zeile den letzten Commit, ignoriert Leerraum und verfolgt verschobenen Code. Stört ein großer Formatierungs-Commit, trage ich ihn in `.git-blame-ignore-revs` ein und setze `blame.ignoreRevsFile`. Wann ein String verschwunden oder aufgetaucht ist, findet `git log -S "MAX_RETRIES" -p`; `-G` sucht per Regex in geänderten Zeilen.

      Das Ergebnis ist ein Commit mit Nachricht und PR-Bezug – kein Anlass für Schuldzuweisung, sondern Kontext.
    tags: [historie]
    level: 2
  - id: guter-pr
    module: pull-requests
    q: Was macht einen guten Pull Request aus?
    a: |
      Klein und fokussiert (eine Absicht, idealerweise unter ein paar hundert geänderten Zeilen), eine Beschreibung mit Warum, Vorgehen und Testweg, Screenshots bei UI, Verweis aufs Ticket. Die Commits sind lesbar, CI ist grün, bevor ich um Review bitte. Große Vorhaben zerlege ich in gestapelte PRs.

      Ich reviewe meinen eigenen Diff vor dem Öffnen einmal selbst. Das findet Debug-Ausgaben, auskommentierten Code und vergessene Dateien, bevor jemand anderes Zeit investiert.
    tags: [pull-requests, review]
    level: 2
  - id: branching-modelle
    module: pull-requests
    q: Trunk-based, GitHub Flow oder Git Flow – was empfiehlst du?
    a: |
      Für eine kontinuierlich ausgelieferte Web-App Trunk-based bzw. GitHub Flow: kurzlebige Branches von `main`, PR, Review, Merge, Deployment aus `main`, unfertige Features hinter Feature-Flags. Das hält Konflikte klein.

      Git Flow mit `develop` und langlebigen Release-Branches passt eher, wenn mehrere Versionen parallel gepflegt werden, etwa installierte Software. Selbst dann reichen oft `main` plus `release/2.4`-Branches für Backports. Das Modell folgt aus der Art des Auslieferns, nicht umgekehrt.
    tags: [pull-requests, team]
    level: 2
  - id: pr-aktuell-halten
    module: pull-requests
    q: Dein PR ist hinter `main` zurück. Rebase oder `main` hineinmergen?
    a: |
      Wenn nur ich auf dem Branch arbeite und das Team lineare History mag: `git fetch`, `git rebase origin/main`, Tests, `git push --force-with-lease`. Arbeiten mehrere auf dem Branch oder läuft schon ein Review mit Kommentaren an konkreten Commits, ist ein Merge von `main` schonender.

      Mergt das Team per Squash, ist die Frage für die Endhistory egal. Ich richte mich nach der Teamkonvention und dokumentiere sie im CONTRIBUTING.
    tags: [pull-requests, rebase]
    level: 2
  - id: branch-protection
    module: pull-requests
    q: Welche Regeln richtest du für `main` in einem Team-Repository ein?
    a: |
      Branch Protection oder Rulesets: kein direkter Push, Merge nur per PR, mindestens ein Review (bei kritischen Pfaden über CODEOWNERS), erforderliche Status-Checks aus CI, kein Force-Push, kein Löschen, optional lineare History und signierte Commits. Bei viel Verkehr eine Merge Queue, damit jeder Merge gegen den aktuellen Stand getestet wird.

      Hooks auf den Rechnern der Entwickler ersetzen das nicht, weil sie sich mit `--no-verify` umgehen lassen und nicht mitgeklont werden.
    tags: [pull-requests, ci]
    level: 2
  - id: secret-gepusht
    module: ci-cd
    q: Ein API-Key ist in einem gepushten Commit gelandet. Was tust du, in welcher Reihenfolge?
    a: |
      Zuerst den Key widerrufen bzw. rotieren – ab dem Push gilt er als kompromittiert, egal was ich an der History ändere. Dann Zugriffe in den Logs des Dienstes prüfen und das Team bzw. die Security informieren. Danach den Key aus dem Code entfernen, `.gitignore` bzw. Umgebungsvariablen einrichten.

      Die History bereinige ich nur, wenn nötig und abgestimmt, etwa mit `git filter-repo`; alle müssen danach neu klonen, Forks und Caches behalten den alten Stand. Vorbeugen: Secret Scanning mit Push Protection und ein `pre-commit`-Check.
    tags: [sicherheit, ci]
    level: 2
  - id: hooks-vs-ci
    module: ci-cd
    q: Reicht ein `pre-commit`-Hook, um die Code-Qualität im Team sicherzustellen?
    a: |
      Nein. Hooks liegen in `.git/hooks` und werden nicht versioniert oder mitgeklont; man kann sie mit `core.hooksPath` teilen, aber jeder muss sie aktivieren, und `--no-verify` umgeht sie. Sie sind schnelles Feedback auf dem eigenen Rechner.

      Durchgesetzt wird in CI: dieselben Prüfungen als Pflicht-Checks im PR. Ein guter Hook ist schnell und prüft nur die gestagten Dateien, die gründliche Prüfung läuft in der Pipeline.
    tags: [hooks, ci]
    level: 2
  - id: shallow-clone-describe
    module: ci-cd
    q: In GitHub Actions liefert `git describe` „No names found“, lokal funktioniert es. Warum?
    a: |
      `actions/checkout` klont standardmäßig flach mit `fetch-depth: 1` – nur der letzte Commit, keine Tags. `git describe` braucht einen erreichbaren Tag in der History. Lösung: `fetch-depth: 0` im Checkout, oder gezielt `git fetch --unshallow --tags`.

      Dasselbe Problem trifft Diffs gegen die Basis eines PR, Changelog-Generatoren und `bisect` in CI. Flache und partielle Klone (`--filter=blob:none`) sparen Zeit, fehlende History muss man aber bewusst nachladen.
    tags: [ci, releases]
    level: 3
  - id: release-per-tag
    module: ci-cd
    q: Wie baust du einen Release-Prozess rund um Git auf?
    a: |
      Versionen nach SemVer, Release = annotierter Tag `git tag -a v2.4.0 -m "Release 2.4.0"` auf einem Commit von `main`. Annotiert, weil der Tag dann Tagger, Datum und Nachricht trägt und `git describe` ihn standardmäßig nutzt; `git push` überträgt Tags nicht automatisch, also `git push origin v2.4.0`. Ein Workflow mit Trigger auf `push` von Tags `v*` baut, testet, erzeugt den Changelog aus den Commits bzw. PR-Titeln seit dem letzten Tag und veröffentlicht das Release. Niemand baut Releases auf dem eigenen Laptop.

      `git describe` liefert zwischen Releases Versionen wie `v2.4.0-3-gab12cd3`. Für Fixes an alten Versionen gibt es einen `release/2.4`-Branch mit Backports per Cherry-pick.
    tags: [releases, ci]
    level: 2
  - id: review-riesiger-pr
    module: pull-requests
    q: Du sollst einen PR mit 60 geänderten Dateien und einem einzigen Commit „fixes“ reviewen. Wie reagierst du?
    a: |
      Ich frage zuerst nach der Absicht und bitte um eine PR-Beschreibung. Dann schlage ich konkret vor, den PR zu teilen: Formatierung und Umbenennungen getrennt von fachlicher Änderung, unabhängige Fixes als eigene PRs. Mit `git diff -w` und `--color-moved` trenne ich beim Lesen reine Verschiebungen vom eigentlichen Inhalt.

      Der Ton bleibt sachlich: Es geht darum, Fehler im Review überhaupt finden zu können, nicht um Stilpunkte.
    tags: [review, pull-requests]
    level: 2
  - id: review-history-lesen
    module: commit-hygiene
    q: Worauf achtest du, wenn du im Review die Commits eines Branches liest?
    a: |
      Ob jeder Commit eine Absicht hat und die Nachricht sie trägt, ob Refactoring und Verhaltensänderung getrennt sind, ob Merge-Commits von `main` die Änderungen verschleiern, ob generierte Dateien, Lock-Dateien oder `.env` ohne Grund dabei sind und ob Commits wie „fix typo“ vor dem Merge eingearbeitet werden sollten.

      Nach einem Force-Push zeigt `git range-diff` den Unterschied zwischen alter und neuer Version einer Commit-Folge – so muss ich nicht alles neu lesen.
    tags: [review, commits]
    level: 3
  - id: verhalten-eigener-fehler
    q: Erzähl von einem Fehler, den du mit Git gemacht hast.
    a: |
      Gute Antworten sind konkret und zeigen den Lernschritt: „Ich habe nach einem Rebase mit `--force` gepusht und dabei einen Commit einer Kollegin überschrieben. Ich habe es über ihren Reflog bzw. meinen alten `origin/feature`-Stand rekonstruiert, sie informiert und nutze seitdem `--force-with-lease`. Außerdem haben wir Force-Pushes auf gemeinsam genutzte Branches per Regel verboten.“

      Wichtig: Situation, eigene Handlung, Wiederherstellung, dauerhafte Verbesserung. Kein erfundener Heldenmoment – in einem Lernprojekt ist ein absichtlich nachgestellter Fall ehrlicher.
    tags: [verhalten, recovery]
    level: 1
  - id: verhalten-teamkonvention
    module: pull-requests
    q: Dein Team ist uneins, ob PRs per Merge, Squash oder Rebase gemergt werden. Wie gehst du damit um?
    a: |
      Ich trenne Geschmack von Folgen: Squash liefert eine lineare `main`-History mit einem Commit pro PR, verliert aber die Einzelcommits. Merge-Commits bewahren alles, machen `main` aber unruhiger. Rebase-Merge ist linear mit Einzelcommits, setzt aber saubere Commits im PR voraus. Dazu kommen Werkzeuge: Changelog, `bisect`, Revert eines ganzen Features.

      Ich schlage vor, eine Methode festzulegen, sie in den Repository-Einstellungen zu erzwingen und im CONTRIBUTING zu begründen. Konsistenz ist wichtiger als die perfekte Wahl.
    tags: [verhalten, pull-requests, team]
    level: 2
  - id: verhalten-junior-anleiten
    q: Eine neue Kollegin hat Angst, mit Git etwas kaputtzumachen. Wie hilfst du ihr?
    a: |
      Ich erkläre das Sicherheitsnetz: Committete Arbeit ist über den Reflog wiederherstellbar, `--abort` bricht Merge, Rebase und Cherry-pick ab, und ein Lesezeichen-Branch vor riskanten Aktionen kostet nichts. Dann üben wir in einem Wegwerf-Repository gemeinsam: Commit „verlieren“, per Reflog zurückholen, Konflikt erzeugen und lösen.

      Echte Gefahrenstellen benenne ich klar: nie gestagte Änderungen bei `reset --hard`, Force-Push auf geteilte Branches, Secrets im Commit.
    tags: [verhalten, recovery, team]
    level: 1
