projects:
  - id: objekt-inspektor
    title: Git-Objekt-Inspektor ohne Git
    level: 2
    hours: 8
    summary: Ein Python-Werkzeug liest `.git` direkt – Refs, Blobs, Trees, Commits und Tags – und beweist mit Tests, dass es dasselbe sieht wie `git cat-file`.
    brief: |
      **Ausgangslage:** Im Team heißt es oft „Git speichert Diffs“ oder „ein Branch ist eine Kopie“. Du willst das Gegenteil nicht nur behaupten, sondern zeigen. Dafür schreibst du ein Kommandozeilenwerkzeug, das ein Repository ausschließlich über das Dateisystem liest – ohne `git`-Aufrufe und ohne Git-Bibliotheken.

      **Anforderungen:**

      - Python 3 mit Standardbibliothek (`zlib`, `hashlib`, `pathlib`, `argparse`). Das Werkzeug ruft nie `git` auf und schreibt nie in `.git`.
      - `resolve <name>` löst `HEAD`, Branches und Tags auf, auch über `packed-refs` und symbolische Refs; ein Detached HEAD wird als solcher gemeldet.
      - `cat <oid>` gibt Typ, Größe und Inhalt eines losen Objekts aus: Blobs als Text (Binärdaten erkennen und nicht ausgeben), Trees mit Modus, Typ, Hash und Name, Commits und annotierte Tags mit ihren Kopfzeilen.
      - `log <name>` folgt ab einem Commit dem ersten Elternteil und gibt Hash und Betreff aus; `tree <name>` zeigt den Wurzel-Tree eines Commits rekursiv.
      - `verify <oid>` berechnet den Hash über Header und Inhalt neu und prüft, dass er zum Dateinamen passt.
      - Liegt ein Objekt nur in einem Packfile, meldet das Werkzeug das verständlich statt abzustürzen.

      **Rahmen:** Tests erzeugen ihre Test-Repositorys in temporären Verzeichnissen mit echtem `git` und vergleichen deine Ausgaben mit `git cat-file -p`, `git rev-parse` und `git log --first-parent --format=…`. Nur die Tests dürfen `git` aufrufen. Referenz für Formate: [Pro Git – Git Objects](https://git-scm.com/book/en/v2/Git-Internals-Git-Objects), [Git References](https://git-scm.com/book/en/v2/Git-Internals-Git-References), [Python `zlib`](https://docs.python.org/3/library/zlib.html).
    skills: [datenmodell, blob, tree, commit, refs, python, zlib, hashlib, tests]
    steps:
      - id: fixture-repos
        title: Test-Repositorys erzeugen
        detail: Schreibe eine Test-Hilfsfunktion, die ein Repository mit mehreren Commits, einem Unterverzeichnis, zwei Dateien mit identischem Inhalt, einem Merge, einem leichtgewichtigen und einem annotierten Tag anlegt. Setze Name, E-Mail und Zeitstempel über Umgebungsvariablen (`GIT_AUTHOR_DATE`, `GIT_COMMITTER_DATE`), damit die Hashes stabil sind.
      - id: refs-aufloesen
        title: Refs und HEAD auflösen
        detail: Lies `.git/HEAD`, folge `ref:`-Zeilen, suche zuerst lose Refs unter `refs/` und dann in `packed-refs`. Teste einen Detached HEAD und einen Branch, der nur nach `git pack-refs --all` existiert.
      - id: lose-objekte
        title: Lose Objekte lesen
        detail: Ein Objekt liegt unter `.git/objects/<2 Zeichen>/<38 Zeichen>` und ist zlib-komprimiert. Trenne Header (`<typ> <größe>`) am ersten Nullbyte vom Inhalt und prüfe die Größe. Kurze Hashes löst du über das Verzeichnis auf; mehrdeutige Präfixe sind ein Fehler.
      - id: tree-parser
        title: Trees parsen
        detail: Einträge sind `<modus> <name>\0` gefolgt vom Hash als 20 Rohbytes (SHA-1), nicht als Hex-Text. Leite aus dem Modus ab, ob der Eintrag ein Blob, ein Tree oder ein Submodul-Commit ist. Vergleiche mit `git ls-tree`.
      - id: commit-und-tag
        title: Commits und annotierte Tags lesen
        detail: Kopfzeilen bis zur ersten Leerzeile, danach die Nachricht. Ein Merge hat mehrere `parent`-Zeilen, der erste Commit keine. Ein annotierter Tag zeigt über `object` und `type` auf sein Ziel.
      - id: hash-pruefen
        title: Hashes nachrechnen
        detail: Berechne SHA-1 über den unkomprimierten Header samt Inhalt. Zeige in einem Test, dass zwei Pfade mit gleichem Inhalt auf denselben Blob zeigen und dass sich nach `git commit --amend` nur der Commit-Hash ändert, wenn nur die Nachricht geändert wurde.
      - id: packfile-grenze
        title: Die Grenze Packfile sauber behandeln
        detail: Führe in einem Test `git gc` aus. Dein Werkzeug soll dann klar melden, dass das Objekt gepackt ist, und auf die `.idx`-Dateien verweisen. Lies nicht halb, sondern gar nicht.
      - id: readme-und-demo
        title: README mit Denkmodell schreiben
        detail: Erkläre mit einem kleinen Diagramm, wie Commit, Tree und Blob zusammenhängen, und zeige eine Beispielsitzung. Nenne die Grenzen des Werkzeugs (keine Packfiles, nur SHA-1).
    acceptance:
      - id: kein-git-aufruf
        text: Der Produktionscode importiert weder `subprocess` noch eine Git-Bibliothek; nur Tests rufen `git` auf.
      - id: abgleich-cat-file
        text: Für alle Objekte der Test-Repositorys stimmt `cat` inhaltlich mit `git cat-file -p` überein.
      - id: refs-vollstaendig
        text: Lose Refs, `packed-refs`, symbolisches `HEAD` und Detached HEAD werden korrekt aufgelöst.
      - id: hash-verifiziert
        text: "`verify` erkennt ein absichtlich verändertes Objekt in einer Kopie des Repositorys als beschädigt."
      - id: fehler-verstaendlich
        text: Unbekannte Hashes, mehrdeutige Präfixe und gepackte Objekte führen zu klaren Meldungen und Exit-Code ungleich 0.
    stretch:
      - Lies Packfiles über den Index (`.idx` Version 2) und löse `OFS_DELTA`- und `REF_DELTA`-Objekte auf ([gitformat-pack](https://git-scm.com/docs/gitformat-pack)).
      - Ergänze einen Befehl, der den Index (`.git/index`) liest und die Stufen 1–3 während eines Merge-Konflikts anzeigt ([gitformat-index](https://git-scm.com/docs/gitformat-index)).
      - Unterstütze Repositorys mit `--object-format=sha256`.
      - Zeichne den Commit-Graphen als ASCII oder erzeuge Graphviz-Ausgabe.
    portfolio: |
      Zeige eine kurze Sitzung: `resolve main`, `cat` auf den Commit, auf dessen Tree und auf einen Blob – und daneben `git cat-file -p`. Im Gespräch erklärst du daran, warum ein Branch nur 41 Byte kostet, warum Rebase neue Hashes erzeugt und warum eine Umbenennung nirgends gespeichert ist.

      Das Projekt ist klein, aber es beantwortet eine Frage, die in Interviews gern gestellt wird („Wie speichert Git Daten?“), mit eigenem Code statt mit auswendig gelernten Sätzen.
  - id: git-rettungsdienst
    title: Git-Rettungsdienst
    level: 2
    hours: 14
    summary: Eine Sammlung reproduzierbarer Kaputt-Szenarien als Bash-Skripte, jeweils mit Reparaturanleitung und automatischer Prüfung, ob die Rettung gelungen ist.
    brief: |
      **Ausgangslage:** In deinem Team fragen Neue immer wieder dieselben Dinge: „Mein Commit ist weg“, „Ich bin in Detached HEAD“, „Der Push wird abgelehnt“. Du baust dafür einen Trainingskasten: Jedes Szenario erzeugt auf Knopfdruck einen realistisch kaputten Zustand in einem Wegwerf-Verzeichnis, und ein Prüfskript sagt, ob die Reparatur stimmt.

      **Anforderungen:**

      - Ein Einstiegsskript `rettung` mit den Befehlen `liste`, `start <szenario>` (legt ein frisches Verzeichnis per `mktemp -d` an und gibt den Pfad aus), `pruefe <szenario> <verzeichnis>` und `hinweis <szenario> [stufe]`.
      - Mindestens zehn Szenarien aus mindestens fünf Themen: Reset und Reflog, Branches und Detached HEAD, Merge und Konflikte, Rebase, Stash und Worktrees, Remotes (mit lokalem Bare-Repository als `origin`), Commit-Hygiene.
      - Pro Szenario: `kaputt.sh` (erzeugt den Zustand), `pruefe.sh` (Exit-Code 0 nur bei gelungener Reparatur, sonst eine verständliche Meldung), `loesung.sh` (Referenzreparatur) und `ANLEITUNG.md` (Symptom, Diagnosebefehle, Ursache, Reparatur, Vorbeugung).
      - Die Szenarien beschreiben das Symptom, nicht die Ursache.
      - Die Skripte fassen nie ein Repository außerhalb ihres Wegwerf-Verzeichnisses an und brechen ab, wenn sie in einem vorhandenen Repository gestartet werden.

      **Rahmen:** Bash und Git, keine weiteren Laufzeitabhängigkeiten. Commit-Hashes sind wegen der Zeitstempel nicht stabil; Prüfungen arbeiten mit Betreffzeilen, Dateiinhalten, `git merge-base --is-ancestor`, `git status --porcelain` und `git rev-list --count`. Kein Netzwerk: Remotes sind lokale Bare-Repositorys. Grundlage: [Reset und Reflog](/git/reset-reflog), [Konflikte lösen](/git/konflikte), [Remotes und Pull Requests](/git/pull-requests).
    skills: [bash, reflog, reset, konflikte, rebase, remotes, shellcheck, github-actions]
    steps:
      - id: szenario-katalog
        title: Szenarien auswählen und Symptome formulieren
        detail: Lege eine Tabelle mit Szenario-ID, Thema, Symptom aus Nutzersicht, Schwierigkeit und Zielzustand an. Gute Kandidaten sind Commits nach `reset --hard`, gelöschter Branch, Arbeit in Detached HEAD, gedroppter Stash, gestagte, aber nie committete Datei, falscher Branch gemergt, `.env` im letzten Commit, halb gelöster Konflikt mit Markern, misslungenes Rebase, abgelehnter Push und veralteter Remote-Tracking-Branch.
      - id: sandbox-runner
        title: Einstiegsskript und Sicherheitsnetz bauen
        detail: "`rettung start` erzeugt ein neues Verzeichnis und setzt für das Szenario eine feste Identität und `init.defaultBranch`. Prüfe vor jedem Lauf, dass das Zielverzeichnis leer ist und nicht innerhalb eines vorhandenen Repositorys liegt (`git rev-parse --is-inside-work-tree`)."
      - id: erstes-szenario
        title: Ein Szenario vollständig durchbauen
        detail: Beginne mit „Commits nach `reset --hard` verloren“. Schreibe `kaputt.sh`, `pruefe.sh`, `loesung.sh` und die Anleitung. Die Anleitung zeigt echte Ausgaben von `git reflog` aus einem Lauf.
      - id: negativtest
        title: Prüfskripte gegen Falsch-Positive absichern
        detail: Ein automatischer Test führt pro Szenario zweimal aus – einmal nur `kaputt.sh` plus `pruefe.sh` (muss scheitern) und einmal mit `loesung.sh` (muss bestehen). Ein Prüfskript, das auch ohne Reparatur grün ist, ist wertlos.
      - id: recovery-szenarien
        title: Recovery-Szenarien ergänzen
        detail: Gelöschter Branch, Detached-HEAD-Arbeit, gedroppter Stash (`git fsck`), gestagte Datei nach `reset --hard` (dangling Blob) und misslungenes Rebase (`ORIG_HEAD`, Branch-Reflog). Die Anleitung benennt, was in welchem Fall endgültig verloren wäre.
      - id: remote-szenarien
        title: Team-Szenarien mit Bare-Remote
        detail: Simuliere zwei Klone (`alice`, `bob`) eines Bare-Repositorys. Szenarien sind etwa ein abgelehnter Push, ein Force-Push, der fremde Arbeit überschrieben hat, und ein Branch, der auf dem Server gelöscht wurde. Prüfe mit `git -C` gegen das Bare-Repository.
      - id: konflikt-szenarien
        title: Konflikt- und Hygiene-Szenarien
        detail: Ein Inhaltskonflikt, der nur fachlich richtig gelöst ist, wenn beide Änderungen erhalten bleiben; ein Commit mit Konfliktmarkern; eine bereits getrackte Datei, die ignoriert werden soll. `pruefe.sh` prüft Inhalt und History, nicht nur „kein Konflikt mehr“.
      - id: hinweise-und-anleitungen
        title: Abgestufte Hinweise schreiben
        detail: Jede Anleitung hat drei Hinweisstufen vom Diagnosebefehl bis fast zur Lösung. Verlinke die passende Stelle der offiziellen Doku, etwa [git-reflog](https://git-scm.com/docs/git-reflog) oder [git-fsck](https://git-scm.com/docs/git-fsck).
      - id: ci-matrix
        title: Alle Szenarien in CI prüfen
        detail: Ein GitHub-Actions-Workflow führt ShellCheck und den Negativtest für jedes Szenario aus, gern als Matrix. Setze in CI `GIT_CONFIG_GLOBAL=/dev/null`, damit keine Runner-Konfiguration die Ergebnisse beeinflusst.
    acceptance:
      - id: zehn-szenarien
        text: Mindestens zehn Szenarien aus mindestens fünf Themen sind vorhanden, jedes mit `kaputt.sh`, `pruefe.sh`, `loesung.sh` und `ANLEITUNG.md`.
      - id: pruefung-trennscharf
        text: In CI scheitert jedes `pruefe.sh` ohne Reparatur und besteht mit der Referenzlösung.
      - id: sandbox-sicher
        text: Ein Start innerhalb eines vorhandenen Repositorys oder in einem nicht leeren Verzeichnis bricht mit verständlicher Meldung ab.
      - id: shellcheck-sauber
        text: "`shellcheck` meldet für alle Skripte keine Befunde; alle Skripte laufen mit `set -euo pipefail`."
      - id: anleitungen-korrekt
        text: Jede Anleitung enthält Symptom, Diagnose, Ursache, Reparatur und Vorbeugung; gezeigte Ausgaben stammen aus echten Läufen.
    stretch:
      - Ergänze einen Modus `rettung zufall`, der ein Szenario auswählt, ohne den Namen zu verraten.
      - Miss die Zeit bis zur erfolgreichen Prüfung und lass Kolleginnen das Set als Übung durchlaufen.
      - Füge Szenarien für `bisect run` und für einen Worktree hinzu, dessen Verzeichnis gelöscht wurde.
    portfolio: |
      Führe im Gespräch ein Szenario live vor: `rettung start`, Symptom zeigen, mit `git reflog` oder `git status` diagnostizieren, reparieren, `rettung pruefe` wird grün. Erkläre danach, wie der Negativtest verhindert, dass ein Prüfskript immer grün ist.

      Das Projekt zeigt zwei Dinge, die Arbeitgeber suchen: sicheren Umgang mit Recovery und die Fähigkeit, Wissen für ein Team nutzbar zu machen. Verlinke im README die Anleitungen der drei Szenarien, die du am spannendsten findest.
  - id: team-repo-automation
    title: Hooks und CI für ein Team-Repository
    level: 2
    hours: 16
    summary: Versionierte Git-Hooks, Pflicht-Checks in GitHub Actions, geschützter `main`-Branch und ein Release per Tag mit automatisch erzeugtem Changelog.
    brief: |
      **Ausgangslage:** Ein Team aus vier Entwicklern betreut eine kleine Python-Web-API (`src/api.py`, Tests mit pytest). Commit-Nachrichten sind uneinheitlich, zweimal ist eine `.env` im Repository gelandet, und Releases entstehen, indem jemand auf dem Laptop baut. Du richtest die Automatisierung rund um Git ein.

      **Anforderungen:**

      - Hooks liegen versioniert in `.githooks/`, ein Einrichtungsskript setzt `core.hooksPath`. `commit-msg` lehnt Nachrichten ohne Conventional-Commits-Präfix ab, `pre-commit` prüft nur gestagte Dateien (Formatierung, verbotene Dateien wie `.env`, Dateien über einer Größengrenze), `pre-push` verhindert direkte Pushes auf `main`.
      - Ein Testskript beweist in Wegwerf-Repositorys, dass jeder Hook ablehnt und akzeptiert, was er soll.
      - GitHub Actions: Bei jedem Pull Request laufen Tests, Lint und eine Prüfung **aller Commit-Nachrichten des PR** bzw. des PR-Titels, je nach gewählter Merge-Methode. Die Basis des Vergleichs muss im Checkout vorhanden sein (`fetch-depth`).
      - `main` ist per Ruleset oder Branch Protection geschützt; die CI-Jobs sind Pflicht-Checks. CODEOWNERS und eine PR-Vorlage sind eingerichtet.
      - Ein Tag `vX.Y.Z` löst einen Release-Workflow aus: Tests, Build, Changelog seit dem vorigen Tag, GitHub Release mit Artefakt.

      **Rahmen:** Öffentliches oder privates Übungs-Repository auf GitHub. Keine echten Secrets, auch nicht in Tests. Grundlage: [CI/CD rund um Git](/git/ci-cd), [githooks](https://git-scm.com/docs/githooks), [Workflow-Syntax](https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax), [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).
    skills: [hooks, github-actions, conventional-commits, semver, branch-protection, codeowners, releases, bash]
    steps:
      - id: ausgangsrepo
        title: Übungsprojekt und Regeln festlegen
        detail: Lege die kleine API mit Tests an. Schreibe in `CONTRIBUTING.md`, welche Commit-Konvention gilt, welche Merge-Methode ihr nutzt und warum. Davon hängt ab, ob CI Einzelcommits oder nur den PR-Titel prüft.
      - id: commit-msg-hook
        title: "`commit-msg` schreiben"
        detail: Der Hook bekommt den Pfad der Nachrichtendatei als erstes Argument. Erlaube Typen wie `feat`, `fix`, `docs`, `refactor`, `test`, `chore`, optional Scope und `!`. Merge-, `fixup!`- und `squash!`-Nachrichten brauchen eine bewusste Regel.
      - id: pre-commit-hook
        title: "`pre-commit` auf gestagte Dateien begrenzen"
        detail: Hole die Dateiliste mit `git diff --cached --name-only --diff-filter=ACM`. Prüfe verbotene Pfade, Größe und Formatierung. Der Hook muss auch bei Dateinamen mit Leerzeichen funktionieren und schnell bleiben.
      - id: pre-push-hook
        title: "`pre-push` gegen Pushes auf `main`"
        detail: Der Hook liest pro Ref eine Zeile `<lokale-ref> <lokaler-hash> <remote-ref> <remote-hash>` von stdin. Lehne ab, wenn die Remote-Ref `refs/heads/main` ist. Teste mit einem lokalen Bare-Repository.
      - id: hook-tests
        title: Hooks automatisiert testen
        detail: Ein Bash-Testskript legt pro Fall ein Wegwerf-Repository an, installiert die Hooks und prüft Exit-Codes. Jeder Hook hat mindestens einen Ablehnungs- und einen Annahmefall. Das Skript läuft auch in CI.
      - id: ci-workflow
        title: PR-Workflow in GitHub Actions
        detail: |
          Trigger `pull_request` und `push` auf `main`. Für die Commit-Prüfung brauchst du die Basis des PR im Checkout; überlege, ob `fetch-depth: 0` nötig ist oder eine gezielte Tiefe reicht. Prüfe den Bereich `origin/main..HEAD` bzw. Basis- und Kopf-SHA aus dem Event.
      - id: schutzregeln
        title: "`main` schützen"
        detail: Richte ein Ruleset oder Branch Protection ein – PR-Pflicht, ein Review, Pflicht-Checks, kein Force-Push, kein Löschen. Belege mit einem abgelehnten Direkt-Push und einem PR, der wegen roter CI nicht mergebar ist. Ergänze CODEOWNERS für `src/auth/`.
      - id: release-workflow
        title: Release per Tag
        detail: Trigger auf Tags `v*`. Der Workflow braucht die volle History und die Tags, um den vorigen Tag zu finden (`git describe --tags --abbrev=0 HEAD^`). Erzeuge den Changelog gruppiert nach `feat`, `fix` und Breaking Changes und veröffentliche ein GitHub Release.
      - id: dokumentation
        title: Ablauf dokumentieren
        detail: README und CONTRIBUTING erklären Einrichtung der Hooks, PR-Ablauf, Release-Ablauf und was zu tun ist, wenn ein Hook fälschlich blockiert. Nenne ausdrücklich, dass Hooks nur Komfort sind und CI die Regeln durchsetzt.
    acceptance:
      - id: hooks-versioniert
        text: Hooks liegen in `.githooks/`, ein Skript setzt `core.hooksPath`, und ein Testskript belegt Ablehnung und Annahme für `commit-msg`, `pre-commit` und `pre-push`.
      - id: pr-checks-pflicht
        text: Ein PR mit fehlerhafter Commit-Nachricht oder rotem Test ist wegen Pflicht-Checks nicht mergebar; ein korrekter PR ist es.
      - id: main-geschuetzt
        text: Direkte Pushes und Force-Pushes auf `main` werden vom Server abgelehnt.
      - id: release-per-tag
        text: Zwei Releases (z. B. `v1.0.0` und `v1.1.0`) sind per Tag entstanden; das zweite enthält einen Changelog mit genau den Änderungen seit dem ersten.
      - id: keine-secrets
        text: Weder Repository noch Workflows noch Logs enthalten echte Zugangsdaten; der Release-Workflow nutzt nur die minimal nötigen `permissions`.
    stretch:
      - Ergänze eine Merge Queue und erkläre, welches Problem sie gegenüber „PR ist grün gegen alten Stand“ löst.
      - Nutze ein Hook-Framework wie [pre-commit](https://pre-commit.com/) und vergleiche Aufwand und Nutzen mit deinen eigenen Skripten.
      - Aktiviere Secret Scanning mit Push Protection und dokumentiere, was bei einem Fund passiert.
    portfolio: |
      Zeige die Pull-Request-Seite eines absichtlich fehlerhaften PR mit roten Pflicht-Checks, danach denselben PR grün und die Release-Seite mit generiertem Changelog. Erkläre im Gespräch, warum ein Hook allein nichts erzwingt, warum der Release-Workflow `fetch-depth: 0` braucht und wie die gewählte Merge-Methode die Commit-Prüfung beeinflusst.
  - id: repo-sanierung
    title: "Abschlussprojekt: Repository sanieren und Release-Prozess einführen"
    capstone: true
    level: 3
    hours: 40
    summary: Ein gewachsenes, chaotisches Kunden-Repository wird analysiert, bereinigt und auf einen dokumentierten, automatisierten Team-Workflow mit reproduzierbaren Releases umgestellt.
    brief: |
      ## Auftrag

      Ein kleines Softwarehaus betreut `kursbuch`, eine Web-App zur Buchung von Volkshochschulkursen (Python-Backend, etwas JavaScript im Frontend). Vier Entwickler committen seit drei Jahren direkt auf `main`. Die Probleme laut Auftraggeber:

      - Commits wie „update“, „fix“, „asdf“, teils mit mehreren tausend geänderten Zeilen, die Features, Formatierung und Build-Ergebnisse mischen.
      - `node_modules/`, ein `dist/`-Ordner und ein 40-MB-Datenbankdump sind in der History; ein Klon dauert lange.
      - Eine `.env` mit SMTP-Passwort und ein API-Schlüssel eines Zahlungsanbieters wurden vor einem Jahr committet und später „gelöscht“.
      - Es gibt kein Branching-Modell. Branches heißen `test`, `neu2`, `alt-backup`, `lisa-fix`.
      - Releases entstehen, indem jemand auf dem Laptop baut und per SFTP hochlädt. Zwei Kunden laufen auf unterschiedlichen Versionen, niemand weiß genau, auf welchen.
      - Hotfixes wurden schon zweimal direkt auf dem Server gemacht und nie committet.

      Deine Aufgabe ist eine nachvollziehbare Sanierung: Bestand aufnehmen, History bereinigen, einen Team-Workflow einführen und Releases automatisieren. Die Abgabe ist so aufgebaut, dass ein Nachfolger sie ohne dich weiterführen kann.

      ## Ausgangsrepository erzeugen

      Da du kein echtes Kunden-Repository hast, schreibst du zuerst ein Skript `erzeuge-altlast.sh`, das diesen Zustand reproduzierbar herstellt: mindestens 60 Commits von drei Autoren, eine kleine lauffähige App mit Tests, die oben genannten Altlasten und einige verwaiste Branches. Verwende ausschließlich erfundene, klar erkennbare Test-Secrets (etwa `SMTP_PASSWORD=kursbuch-test-nicht-echt`) – keine Zeichenketten im Format echter Anbieter-Schlüssel. Schiebe die Altlast nie in ein öffentliches Repository.

      ## Fachliche Anforderungen

      1. **Bestandsaufnahme:** Größe des Repositorys, größte Objekte in der History, alle Refs, gefundene Secrets, Liste der Branches mit Einschätzung (mergen, archivieren als Tag, löschen).
      2. **Sanierungsplan:** Reihenfolge, Freeze-Zeitraum, Kommunikation an das Team, Rückweg. Secrets werden **zuerst rotiert**, dann aus der History entfernt.
      3. **History-Bereinigung** auf einem frischen Klon mit [git filter-repo](https://github.com/newren/git-filter-repo): Secrets, Build-Artefakte, `node_modules/` und der Dump verschwinden aus allen Refs. `.gitignore` und `.gitattributes` verhindern Wiederholung.
      4. **Branching-Modell:** kurzlebige Feature-Branches mit Pull Requests auf `main`, dazu `release/<major>.<minor>`-Branches für die beiden Kunden. Entscheidung und Begründung als kurzes Architecture Decision Record.
      5. **Qualitätssicherung:** versionierte Hooks, CI mit Pflicht-Checks, geschütztes `main`, CODEOWNERS, PR-Vorlage.
      6. **Releases:** SemVer, annotierte Tags, Release-Workflow per Tag, Changelog aus Conventional Commits, Hotfix-Prozess per `cherry-pick -x` auf Release-Branches.
      7. **Recovery-Runbook** für das Team: versehentlicher Force-Push, falscher Merge auf `main`, erneut geleaktes Secret, verlorene lokale Commits.

      ## Technischer Rahmen

      GitHub-Repository (privat genügt) mit GitHub Actions. Bash für Skripte, Python für die App. Die Bereinigung ist ein Skript, das auf einem frischen Klon der Altlast wiederholbar läuft. Alle gezeigten Befehlsausgaben stammen aus echten Läufen. Beachte die Hinweise von GitHub zum [Entfernen sensibler Daten](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository): Klone, Forks und Referenzen in Pull Requests behalten alte Objekte.

      ## Abgabe

      Repository mit bereinigter History und neuem Workflow, `erzeuge-altlast.sh`, Bereinigungsskript, `SANIERUNGSBERICHT.md` (vorher/nachher mit Zahlen), `CONTRIBUTING.md`, `RELEASING.md`, `RUNBOOK.md`, ADR und mindestens zwei Releases auf zwei Release-Linien. Deine eigene Arbeit an diesem Projekt geschieht selbst über Pull Requests mit sauberen Commits – die History der Abgabe wird gelesen.
    skills: [datenmodell, reflog, rebase, interactive-rebase, cherry-pick, revert, filter-repo, hooks, github-actions, branch-protection, semver, conventional-commits, bash, dokumentation]
    steps:
      - id: auftrag-klaeren
        title: Auftrag und Nichtziele festhalten
        detail: Schreibe auf, was „saniert“ bedeutet und was nicht dazugehört (etwa keine Umschreibung der App-Architektur). Lege fest, welche Nachweise du am Ende zeigst, und leite daraus die Abnahmekriterien ab.
      - id: altlast-erzeugen
        title: Das chaotische Ausgangsrepository erzeugen
        detail: "`erzeuge-altlast.sh` baut die History mit festen Autoren und Zeitstempeln (`GIT_AUTHOR_DATE`, `GIT_COMMITTER_DATE`), damit jeder Lauf dieselben Hashes liefert. Baue auch einen Merge-Commit, einen Commit mit gemischten Themen und das „Löschen“ der `.env` in einem späteren Commit ein."
      - id: bestandsaufnahme
        title: Bestand messen und dokumentieren
        detail: "Nutze `git count-objects -vH`, `git rev-list --objects --all` zusammen mit `git cat-file --batch-check` für die größten Blobs, `git log --all -S` für bekannte Secret-Fragmente und `git for-each-ref` für das Branch-Inventar. `git filter-repo --analyze` liefert zusätzliche Berichte. Halte alle Zahlen für den Vorher-nachher-Vergleich fest."
      - id: sanierungsplan
        title: Sanierungsplan und Kommunikation schreiben
        detail: "Lege die Reihenfolge fest: Secrets rotieren, Freeze ankündigen, offene Arbeit sichern, bereinigen, prüfen, pushen, alle klonen neu. Beschreibe, was mit offenen Branches der Kollegen passiert (Rebase auf die neue History per `--onto` oder Neuanlage) und wie der Rückweg aussieht, falls die Prüfung scheitert."
      - id: history-bereinigen
        title: History auf einem frischen Klon bereinigen
        detail: "Arbeite nie im einzigen Original. Entferne Pfade mit `--path … --invert-paths`, ersetze Secret-Texte mit `--replace-text` und entferne große Blobs. Heb die Zuordnung alter zu neuer Commit-IDs auf, die filter-repo unter `.git/filter-repo/` ablegt – sie wird für Tickets und Verweise gebraucht."
      - id: bereinigung-beweisen
        title: Die Bereinigung automatisiert beweisen
        detail: Ein Prüfskript durchsucht alle erreichbaren Objekte aller Refs nach den bekannten Secrets und nach Pfaden wie `node_modules/`, misst die Größe und bestätigt, dass die App-Tests auf der neuen Spitze weiter grün sind. Ein zweiter Lauf des Bereinigungsskripts auf einem frischen Klon liefert dieselben Tree-Hashes an den Branch-Spitzen.
      - id: branching-modell
        title: Branching-Modell festlegen und Altbranches auflösen
        detail: Schreibe das ADR (Kontext, Optionen Trunk-based/GitHub Flow/Git Flow, Entscheidung, Folgen). Führe `release/1.4` und `release/2.0` ein, archiviere erhaltenswerte Altbranches als Tags unter `archive/` und lösche den Rest.
      - id: hooks-einrichten
        title: Versionierte Hooks einrichten
        detail: "`commit-msg` für Conventional Commits, `pre-commit` gegen `.env`, große Dateien und Konfliktmarker, geteilt über `core.hooksPath` mit Einrichtungsskript und automatisierten Tests für Ablehnung und Annahme."
      - id: ci-und-schutz
        title: CI-Pflicht-Checks und Schutzregeln
        detail: PR-Workflow mit Tests, Lint, Commit- bzw. PR-Titel-Prüfung und Secret-Scan über die Commits des PR. Ruleset für `main` und `release/*` (PR-Pflicht, Review, Pflicht-Checks, kein Force-Push), CODEOWNERS und PR-Vorlage.
      - id: release-prozess
        title: Release-Prozess automatisieren
        detail: Workflow auf Tags `v*` mit voller History, Build, Tests, Changelog seit dem vorigen Tag derselben Release-Linie und GitHub Release mit Artefakt. Dokumentiere in `RELEASING.md`, wer wann welchen Tag setzt und wie eine Version zurückgezogen wird.
      - id: hotfix-durchspielen
        title: Hotfix und Recovery-Fälle durchspielen
        detail: "Spiele einen Sicherheitsfix durch: PR auf `main`, Backport per `cherry-pick -x` auf `release/1.4`, Patch-Release `v1.4.1`. Übe mindestens zwei Runbook-Fälle praktisch, etwa einen versehentlichen Merge auf `main` (Revert) und einen verlorenen lokalen Branch (Reflog), und halte die echten Befehle fest."
      - id: uebergabe
        title: Übergabe und Präsentation vorbereiten
        detail: Vervollständige Sanierungsbericht, README und Runbook. Lass eine zweite Person nur anhand der Doku einen PR mergen und ein Release auslösen. Bereite eine 15-Minuten-Präsentation mit Vorher-nachher-Zahlen und einer Live-Demo vor.
    acceptance:
      - id: altlast-reproduzierbar
        text: "`erzeuge-altlast.sh` erzeugt auf jedem Rechner dieselbe chaotische Ausgangs-History mit allen im Auftrag genannten Altlasten und nur erfundenen Test-Secrets."
      - id: history-ohne-secrets
        text: Ein Prüfskript belegt, dass kein erreichbares Objekt irgendeiner Ref die bekannten Secrets, `node_modules/`, `dist/` oder den Dump enthält; der Bericht dokumentiert, dass die Secrets vorher rotiert wurden.
      - id: bereinigung-wiederholbar
        text: Das Bereinigungsskript läuft auf einem frischen Klon der Altlast fehlerfrei und liefert dieselben Tree-Hashes an allen Branch-Spitzen; die App-Tests sind danach grün.
      - id: groesse-belegt
        text: Der Sanierungsbericht zeigt Größe, Objektzahl und Klondauer vorher und nachher mit den verwendeten Befehlen.
      - id: main-geschuetzt
        text: "`main` und `release/*` akzeptieren Änderungen nur per Pull Request mit Review und grünen Pflicht-Checks; Direkt- und Force-Pushes werden vom Server abgelehnt."
      - id: ci-pflichtchecks
        text: CI prüft bei jedem PR Tests, Lint, Commit-Konvention und Secrets; ein absichtlich fehlerhafter PR ist sichtbar rot und nicht mergebar.
      - id: hooks-getestet
        text: Versionierte Hooks mit Einrichtungsskript; ein automatisierter Test belegt Ablehnung und Annahme für jeden Hook.
      - id: releases-automatisiert
        text: Mindestens zwei Releases auf zwei Release-Linien (z. B. `v2.0.0` und `v1.4.1`) sind per annotiertem Tag und Workflow entstanden, jeweils mit Changelog und Artefakt; kein Release wurde lokal gebaut.
      - id: hotfix-nachvollziehbar
        text: Der Hotfix ist auf `main` und per `cherry-pick -x` auf `release/1.4` vorhanden; `git log` zeigt die Herkunft.
      - id: doku-uebergabefaehig
        text: README, CONTRIBUTING (Branching-Modell, Commit-Konvention, Merge-Methode, PR-Ablauf), RELEASING, RUNBOOK und ADR liegen vor; eine zweite Person hat danach einen PR und ein Release erfolgreich durchgeführt.
      - id: eigene-history-sauber
        text: Die Commits und Pull Requests der Abgabe selbst sind atomar, folgen der Konvention und haben aussagekräftige Beschreibungen.
    stretch:
      - Ergänze einen Migrationshelfer, der offene lokale Branches von Kollegen per `git rebase --onto` von der alten auf die neue History umpflanzt, und teste ihn.
      - Erzeuge mit `.mailmap` einheitliche Autorennamen für `git shortlog -sn`.
      - Füge `.git-blame-ignore-revs` für den großen Formatierungs-Commit hinzu und zeige den Unterschied in `git blame`.
      - Nutze eine Merge Queue und begründe, ab welcher Teamgröße sie sich lohnt.
    portfolio: |
      Beginne die Präsentation mit dem Problem, nicht mit Werkzeugen: drei Zahlen aus der Bestandsaufnahme (Klongröße, Anzahl gefundener Secrets, Anzahl verwaister Branches) und ein Ausschnitt der alten History. Zeige dann den Plan, die Zahlen danach, einen PR mit roten und grünen Checks, das Release auf zwei Linien und einen Runbook-Fall live.

      Im Gespräch zählen die Abwägungen: Warum wird zuerst rotiert und dann umgeschrieben? Was bleibt trotz Bereinigung bestehen (Klone, Forks, PR-Referenzen)? Warum dieses Branching-Modell und nicht Git Flow? Welche Merge-Methode hast du gewählt, und was bedeutet sie für Changelog und `bisect`? Sei offen darüber, dass die Ausgangslage simuliert ist, und nenne, was bei einem echten Kunden zusätzlich nötig wäre – Abstimmung eines Freeze-Termins, Umgang mit CI-Caches und Deploy-Schlüsseln, Zeitfenster für alle Teammitglieder.

      Verlinke die Abgabe mit einer kurzen Einleitung im README: Ausgangslage, Ergebnis in Zahlen, wichtigste Entscheidung, Link zum Sanierungsbericht. Wer das liest, soll in zwei Minuten verstehen, was du geleistet hast.
