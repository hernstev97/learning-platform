id: git
title: Git & professionelle Workflows
short: Git
tagline: History verstehen, Branches beherrschen, jeden Fehler rückgängig machen.
description: >
  Das Datenmodell aus Blobs, Trees und Commits, Branches und HEAD, Merge und
  Rebase, interaktives Umschreiben, Cherry-pick, Reflog und Recovery, Bisect,
  Stash und Worktrees, Konfliktlösung, Pull Requests und CI rund um Git. Viele
  Übungen erzeugen absichtlich kaputte Repositorys, die du anschließend reparierst.
color: "#FF5CA8"
order: 6
outcomes:
  - Du erklärst Git über sein **Datenmodell** – Blob, Tree, Commit, Ref – und sagst vorher, was ein Befehl mit der History macht.
  - Du bewegst dich sicher zwischen Branches, verstehst **HEAD** und kommst aus jedem Detached-HEAD-Zustand heraus.
  - Du wählst begründet zwischen **Merge und Rebase**, räumst Branches mit interaktivem Rebase auf und löst Konflikte ohne Panik.
  - Du holst verlorene Commits über **Reflog** zurück und reparierst verkorkste Resets, Rebases und Merges.
  - Du findest Regressionen mit **Bisect** und arbeitest mit Stash und Worktrees an mehreren Dingen gleichzeitig.
  - Du lieferst Änderungen als saubere **Pull Requests** mit sinnvollen Commits, Reviews und grüner CI.
tracks:
  - title: Fundament
    description: Arbeitsverzeichnis, Index und Repository, das Objektmodell, Branches und HEAD, gute Commits.
    modules: [git-einstieg, datenmodell, branches-head, commit-hygiene]
  - title: History formen
    description: Zusammenführen, Konflikte lösen, Rebase, History aufräumen und Commits gezielt übertragen.
    modules: [merge, konflikte, rebase, interactive-rebase, cherry-pick-revert]
  - title: Recovery & Werkzeuge
    description: Zurücksetzen und retten, parallel arbeiten, Fehler in der History finden.
    modules: [reset-reflog, stash-worktrees, bisect-historie]
  - title: Im Team
    description: Remotes, Pull Requests, Review und die Automatisierung rund um Git.
    modules: [pull-requests, ci-cd]
