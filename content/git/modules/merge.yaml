lesson: |
  Der Pull Request für das Login-Feature ist freigegeben. Du tippst `git merge feature/login` – und je nach Lage der History passiert jeweils etwas anderes: Mal bewegt Git nur einen Zeiger, mal entsteht ein neuer Commit mit zwei Eltern, mal bleibt Git mit einem Konflikt stehen. Wer nicht vorhersagen kann, welcher Fall eintritt, wundert sich später über eine unlesbare History, über Branches, die angeblich „not fully merged“ sind, obwohl ihr Code längst auf `main` liegt, oder über einen Hotfix, der trotz Merge-Commit fehlt.

  Das Denkmodell dahinter ist klein: Ein Merge vergleicht drei Snapshots – die beiden Branch-Spitzen und ihren gemeinsamen Vorfahren. Alles andere, von `--no-ff` bis `--squash`, folgt daraus. Wie du Konflikte auflöst, behandelt das nächste Modul [Konflikte lösen](/git/konflikte).

  ## Die Merge-Base: der gemeinsame Ausgangspunkt

  Ein Branch ist ein beweglicher Zeiger auf einen Commit (siehe [Branches, HEAD und Remotes](/git/branches-head)). Zweigst du `feature/login` von `main` ab und wachsen danach beide Seiten weiter, entsteht eine Gabelung im Commit-Graphen:

  ```text
          C---D    feature/login
         /
    A---B---E      main
  ```

  `B` ist die **Merge-Base**: der jüngste Commit, der von beiden Spitzen aus erreichbar ist. Git findet ihn, indem es den Graphen von beiden Seiten aus rückwärts durchläuft ([git merge-base](https://git-scm.com/docs/git-merge-base)). Du kannst ihn selbst abfragen:

  ```console
  $ git merge-base main feature/login
  a31fdcb182bba2e2fd7b03574e93900277a76634
  $ git log -1 --oneline a31fdcb
  a31fdcb Projektgerüst anlegen
  ```

  Warum ist dieser Commit so wichtig? Git vergleicht beim Merge nicht die beiden Dateiversionen miteinander, sondern jede Seite mit dem gemeinsamen Ausgangspunkt. Erst die Basis verrät, **wer** eine Zeile geändert hat. Steht in `config.yaml` auf `main` `timeout: 60` und auf dem Feature-Branch `timeout: 30`, kann Git ohne Basis nicht entscheiden, welcher Wert neu ist. Mit der Basis `timeout: 30` ist die Lage klar: `main` hat geändert, der Feature-Branch nicht – also gilt `60`, ohne Konflikt.

  > [!MERKE]
  > Ein Merge vergleicht drei Snapshots: die Merge-Base, die eigene Spitze (HEAD, „ours“) und die fremde Spitze („theirs“). Wer den Graphen aufmalt und die Merge-Base findet, kann das Ergebnis jedes Merges vorhersagen.

  `git merge-base --is-ancestor A B` beantwortet eine verwandte Frage ohne Ausgabe, nur über den Exit-Status: Ist `A` ein Vorfahre von `B` (oder derselbe Commit)? In Skripten und CI ist das die robuste Form von „Ist dieser Commit schon in `main` enthalten?“.

  ## Fast-Forward oder Drei-Wege-Merge

  Welcher Fall eintritt, hängt nur davon ab, wo die Merge-Base liegt.

  **Fall 1: Die Merge-Base ist HEAD selbst.** `main` hat sich seit dem Abzweigen nicht bewegt, alle Commits von `main` stecken schon in `feature/login`. Es gibt nichts zu kombinieren. Git schiebt den Zeiger `main` bis zur Spitze des Feature-Branch vor – ein **Fast-Forward** ([git merge · Fast-forward merge](https://git-scm.com/docs/git-merge#_fast_forward_merge)). Es entsteht kein neuer Commit.

  ```text
  vorher:   A---B        main          nachher:  A---B---C---D   main, feature/login
                 \
                  C---D  feature/login
  ```

  ```console
  $ git switch main
  $ git merge feature/login
  Updating a31fdcb..be168a6
  Fast-forward
   src/auth.py | 6 +++++-
   1 file changed, 5 insertions(+), 1 deletion(-)
  $ git log --graph --oneline
  * be168a6 (HEAD -> main, feature/login) Logout ergänzen
  * 88fe093 Passwort prüfen
  * a31fdcb Projektgerüst anlegen
  ```

  **Fall 2: Beide Seiten haben neue Commits.** Jetzt führt Git einen **Drei-Wege-Merge** aus ([git merge · True merge](https://git-scm.com/docs/git-merge#_true_merge)). Es berechnet die Änderungen von der Basis zu HEAD und von der Basis zur anderen Spitze und kombiniert sie: Was nur eine Seite geändert hat, wird übernommen. Identische Änderungen auf beiden Seiten übernimmt Git einmal. Nur wenn beide Seiten dieselbe Stelle unterschiedlich geändert haben, entsteht ein Konflikt. Das Ergebnis speichert Git als **Merge-Commit**.

  ```console
  $ git merge feature/login
  Merge made by the 'ort' strategy.
   src/auth.py | 6 +++++-
   1 file changed, 5 insertions(+), 1 deletion(-)
  $ git log --graph --oneline
  *   929d136 (HEAD -> main) Merge branch 'feature/login'
  |\
  | * be168a6 (feature/login) Logout ergänzen
  | * 88fe093 Passwort prüfen
  * | 4a7e5f5 Timeout für Zahlungs-API erhöhen
  |/
  * a31fdcb Projektgerüst anlegen
  ```

  Der Merge-Commit ist ein gewöhnliches Commit-Objekt mit einer Besonderheit, die `git cat-file` zeigt ([Das Datenmodell](/git/datenmodell)):

  ```console
  $ git cat-file -p HEAD
  tree 2e5d6fffb43131033b1f7cec1c264f89636f0bf3
  parent 4a7e5f548fe05684c73fa1b142e60de2aa7bd6c9
  parent be168a68dade14925bc83dc0cc2aa35f3c02d924
  author Lea Lernt <lea@example.com> 1790687168 +0200
  committer Lea Lernt <lea@example.com> 1790687168 +0200

  Merge branch 'feature/login'
  ```

  Er hat **zwei** `parent`-Zeilen, und ihre Reihenfolge ist nicht zufällig. Der **erste Elternteil** ist der Commit, auf dem du beim Mergen standest (hier der alte Stand von `main`), der **zweite** die Spitze des gemergten Branch. `HEAD^1` (gleichbedeutend mit `HEAD~1`) führt zurück zum alten `main`, `HEAD^2` zu `feature/login`. Auf dieser Reihenfolge bauen `git log --first-parent`, `git revert -m 1` und `git bisect --first-parent` auf.

  Zwei Randfälle: Ist der andere Branch schon vollständig in HEAD enthalten, meldet Git `Already up to date.` und tut nichts. Gibst du mehrere Branches auf einmal an, entsteht ein **Octopus-Merge** mit mehr als zwei Eltern. Die Strategie `octopus` verweigert jeden Merge, der manuelle Konfliktlösung bräuchte; in Anwendungsrepositorys ist sie selten sinnvoll.

  > [!INTERVIEW] „Was ist der Unterschied zwischen einem Fast-Forward und einem echten Merge?“
  > Beim Fast-Forward ist mein aktueller Branch ein Vorfahre des anderen. Git bewegt nur den Zeiger nach vorn, es entsteht kein Commit, die History bleibt linear. Haben beide Seiten neue Commits, macht Git einen Drei-Wege-Merge gegen die Merge-Base und speichert das Ergebnis als Merge-Commit mit zwei Eltern – der erste ist der alte Stand meines Branch. Mit `--no-ff` erzwinge ich den Merge-Commit, mit `--ff-only` verbiete ich ihn.

  ## Merge-Commits steuern: --no-ff, --ff-only und pull.ff

  Ohne Optionen spult Git vor, wenn es kann, und mergt sonst. Zwei Optionen verschieben diese Entscheidung ([git merge · --no-ff](https://git-scm.com/docs/git-merge#Documentation/git-merge.txt---no-ff)):

  - `--no-ff` erzeugt **immer** einen Merge-Commit, auch wenn ein Fast-Forward möglich wäre. Die History zeigt dann, dass `C` und `D` gemeinsam als ein Feature hereinkamen, und ein einzelner Revert des Merge-Commits nimmt das ganze Feature zurück.
  - `--ff-only` erlaubt **nur** den Fast-Forward und bricht sonst ab, ohne etwas zu verändern:

  ```console
  $ git merge --ff-only feature/login
  hint: Diverging branches can't be fast-forwarded, you need to either:
  hint:
  hint: 	git merge --no-ff
  hint:
  hint: or:
  hint:
  hint: 	git rebase
  hint:
  hint: Disable this message with "git config set advice.diverging false"
  fatal: Not possible to fast-forward, aborting.
  ```

  `--ff-only` gehört an Stellen, an denen nie ein ungeplanter Merge-Commit entstehen soll, allen voran `git pull`. Ein Pull ist `git fetch` plus Integration von `origin/main` in deinen lokalen Branch. Sind beide auseinandergelaufen, bricht Git ab und verlangt eine Entscheidung. Die legst du dauerhaft in der Konfiguration fest ([git config · pull.ff](https://git-scm.com/docs/git-config#Documentation/git-config.txt-pullff)):

  ```ini title=.gitconfig
  [pull]
      ff = only
  ```

  Mit `pull.ff = only` aktualisiert `git pull` nur noch, wenn es vorspulen kann. Hast du lokal eigene Commits, scheitert der Pull laut, und du entscheidest bewusst: mergen (`git merge origin/main`, der Fetch ist ja schon passiert) oder rebasen ([Rebase](/git/rebase)). Das Gegenstück für `git merge` heißt `merge.ff`; `false` wirkt dort wie ein dauerhaftes `--no-ff`.

  **History lesen.** `git log --graph` zeichnet alle Linien. `git log --first-parent` folgt an jedem Merge nur dem ersten Elternteil und zeigt damit genau die Schritte, die auf `main` selbst passiert sind ([git log · --first-parent](https://git-scm.com/docs/git-log#Documentation/git-log.txt---first-parent)):

  ```console
  $ git log --first-parent --oneline
  929d136 (HEAD -> main) Merge branch 'feature/login'
  4a7e5f5 Timeout für Zahlungs-API erhöhen
  a31fdcb Projektgerüst anlegen
  ```

  Integriert ein Team konsequent mit Merge-Commits, liefert `--first-parent` eine Liste mit einem Eintrag pro Pull Request – brauchbar für Changelogs und für die Fehlersuche mit `git bisect --first-parent` ([Fehlersuche in der History](/git/bisect-historie)).

  > [!PRAXIS]
  > Eine verbreitete Kombination: `pull.ff = only` auf jedem Entwicklerrechner, damit `git pull` nie still Merge-Commits wie `Merge branch 'main' of github.com:…` erzeugt, und Integration in `main` nur über Pull Requests. Welche Merge-Methoden ein Repository erlaubt (Merge-Commit, Squash, Rebase), legen Admins auf GitHub fest ([About merge methods on GitHub](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/about-merge-methods-on-github)). Die Abwägung folgt im Modul [Pull Requests](/git/pull-requests).

  ## Die Strategie ort und die Optionen ours und theirs

  Wie Git die drei Snapshots kombiniert, legt die **Merge-Strategie** fest. Für Merges mit zwei Seiten ist das seit Git 2.34 `ort` („Ostensibly Recursive's Twin“). Sie wurde als Ersatz für den früheren Standard `recursive` geschrieben, erkennt Umbenennungen und kommt auch mit mehreren gemeinsamen Vorfahren zurecht ([merge-strategies · ort](https://git-scm.com/docs/merge-strategies#Documentation/merge-strategies.txt-ort)). Das `'ort' strategy` in den Ausgaben oben ist genau sie. Angeben musst du sie nie.

  Ein Namenspaar wird dagegen ständig verwechselt – und fällt in Reviews regelmäßig auf:

  - `-X ours` ist eine **Option** der Strategie `ort` (lang: `--strategy-option=ours`). Git mergt normal. Nur an Stellen, die ein **Konflikt** wären, gewinnt automatisch die eigene Seite. Nicht widersprüchliche Änderungen der anderen Seite kommen trotzdem herein. `-X theirs` ist das Spiegelbild.
  - `-s ours` ist eine eigene **Strategie**. Sie ignoriert den Inhalt der anderen Seite vollständig. Der Merge-Commit hat zwei Eltern, sein Tree ist aber exakt der von HEAD. Die History behauptet „gemergt“, der Code sagt nein ([merge-strategies · ours](https://git-scm.com/docs/merge-strategies#Documentation/merge-strategies.txt-ours-1)).

  ```console
  $ git merge -X ours release/2.4
  Auto-merging config.yaml
  Merge made by the 'ort' strategy.
   CHANGELOG.md   | 3 +++
   src/payment.py | 2 +-
   2 files changed, 4 insertions(+), 1 deletion(-)
  $ git reset --hard ORIG_HEAD
  HEAD is now at 9cda06c Timeout erhöhen
  $ git merge -s ours release/2.4
  Merge made by the 'ours' strategy.
  $ git diff --stat HEAD^1 HEAD
  $ git merge -s theirs release/2.4
  Could not find merge strategy 'theirs'.
  Available strategies are: octopus ours recursive resolve subtree.
  ```

  Mit `-X ours` kommen Changelog und Zahlungsfix aus dem Hotfix herein, nur im Konflikt um den Timeout in `config.yaml` gewinnt `main`. Mit `-s ours` ändert der Merge nichts – der Diff zum ersten Elternteil ist leer. Eine Strategie `theirs` gibt es nicht. `-s ours` hat einen legitimen Zweck: einen alten Branch als „erledigt“ zu markieren, ohne seinen Inhalt zu übernehmen. Wer „bei Konflikten meine Version“ meint, will fast immer `-X ours`.

  > [!WARNING]
  > Auch `-X ours` entscheidet Konflikte blind, selbst dort, wo beide Seiten recht hatten. Setze es nur ein, wenn du für die betroffenen Dateien sicher weißt, welche Seite gewinnt, und prüfe das Ergebnis mit `git show --stat` und den Tests.

  ## Squash-Merge: ein Commit ohne Verwandtschaft

  `git merge --squash feature/export` übernimmt alle Änderungen des Branch in Index und Arbeitsverzeichnis, erzeugt aber **keinen** Merge-Commit und merkt sich keinen zweiten Elternteil ([git merge · --squash](https://git-scm.com/docs/git-merge#Documentation/git-merge.txt---squash)). Das anschließende `git commit` erzeugt einen gewöhnlichen Commit mit einem Elternteil. Dasselbe macht der Button „Squash and merge“ auf GitHub.

  ```console
  $ git merge --squash feature/export
  Updating 9cda06c..e6b5a81
  Fast-forward
  Squash commit -- not updating HEAD
   src/export.py | 6 ++++++
   1 file changed, 6 insertions(+)
   create mode 100644 src/export.py
  $ git commit -m "Export als CSV und JSON (#7)"
  [main 7b4d549] Export als CSV und JSON (#7)
   1 file changed, 6 insertions(+)
   create mode 100644 src/export.py
  $ git branch -d feature/export
  error: the branch 'feature/export' is not fully merged
  hint: If you are sure you want to delete it, run 'git branch -D feature/export'
  hint: Disable this message with "git config set advice.forceDeleteBranch false"
  ```

  Der Vorteil: eine Zeile pro Feature auf `main`, Zwischencommits wie „WIP“ oder „Tippfehler“ verschwinden. Der Preis: Für den Graphen hat `main` die Commits von `feature/export` nie gesehen. Die Merge-Base bleibt der alte Abzweigpunkt, `git branch -d` verweigert das Löschen, `git branch --merged` listet den Branch nicht. Daraus folgen drei Regeln:

  1. Nach einem Squash-Merge wird der Branch gelöscht – mit `-D`, weil `-d` die Verwandtschaft prüft.
  2. Wer weiterarbeiten will, zweigt neu von `main` ab. Mergst du den alten Branch erneut, rechnet Git alle seine Commits noch einmal gegen die alte Basis. Das endet in Konflikten mit dem eigenen Squash-Commit oder in doppelten Änderungen.
  3. Branches, die auf einem gesquashten Branch aufbauen, müssen umgepflanzt werden (`git rebase --onto`, siehe [Rebase](/git/rebase)).

  ## Abbrechen und rückgängig machen

  Solange ein Merge mit Konflikt offen ist, merkt sich Git die andere Seite in `MERGE_HEAD`. `git merge --abort` bricht ab und stellt den Stand vor dem Merge wieder her ([git merge · --abort](https://git-scm.com/docs/git-merge#Documentation/git-merge.txt---abort)). Starte Merges deshalb mit sauberem Arbeitsverzeichnis: Uncommittete Änderungen kann `--abort` nicht in jedem Fall rekonstruieren. Würde ein Merge solche Dateien überschreiben, weigert sich Git ohnehin (`Your local changes to the following files would be overwritten by merge`).

  Ist der Merge abgeschlossen, hilft `ORIG_HEAD`. Vor einem Merge speichert Git die alte Spitze des aktuellen Branch in dieser Referenz ([gitrevisions · ORIG_HEAD](https://git-scm.com/docs/gitrevisions#Documentation/gitrevisions.txt-ORIGHEAD)):

  ```console
  $ git rev-parse --short ORIG_HEAD
  4a7e5f5
  $ git reset --hard ORIG_HEAD
  HEAD is now at 4a7e5f5 Timeout für Zahlungs-API erhöhen
  ```

  `git reset --hard` setzt Branch, Index und Arbeitsverzeichnis zurück und verwirft dabei uncommittete Änderungen – prüfe vorher `git status`. Der Weg passt nur für Merges, die du **noch nicht gepusht** hast. `ORIG_HEAD` wird vom nächsten Merge, Reset oder Rebase überschrieben; ist der alte Stand dort nicht mehr zu finden, hilft das Reflog ([Reset und Reflog](/git/reset-reflog)). Einen geteilten Merge nimmst du mit einem neuen Commit zurück: `git revert -m 1 <merge>` ([Cherry-pick und Revert](/git/cherry-pick-revert)).

  ## Häufige Fehler

  - **Unerwartete Commits wie `Merge branch 'main' of github.com:…`.** Ein `git pull` hat lokale und entfernte Commits zusammengeführt. Setze `pull.ff = only` und integriere bewusst.
  - **`fatal: Not possible to fast-forward, aborting.`** Das ist kein Defekt, sondern die Schutzfunktion von `--ff-only`: Die Branches sind auseinandergelaufen, `git status` zeigt `ahead` und `behind`.
  - **Falschen Branch gemergt.** Noch nicht gepusht: `git reset --hard ORIG_HEAD`. Schon gepusht: `git revert -m 1`.
  - **`-s ours` statt `-X ours`.** Der Merge-Commit ist da, die Änderungen fehlen. `git diff --stat HEAD^1 HEAD` bleibt leer.
  - **Gesquashten Branch weiterbenutzen.** Beim zweiten Merge kollidiert der Branch mit dem eigenen Squash-Commit. Neu von `main` abzweigen und nur die neuen Commits übernehmen.
  - **Richtung verwechselt.** `git merge X` holt `X` in den **aktuellen** Branch. Wer auf `feature/login` steht und `git merge main` tippt, aktualisiert den Feature-Branch, nicht `main`.
  - **Merge mit uncommitteten Änderungen gestartet.** `--abort` kann sie nicht immer wiederherstellen. Vorher committen oder stashen ([Stash und Worktrees](/git/stash-worktrees)).

  ## Zusammenfassung

  - Ein Merge vergleicht drei Snapshots: Merge-Base, HEAD und die andere Spitze. `git merge-base` zeigt die Basis, `--is-ancestor` prüft Verwandtschaft.
  - Ist HEAD ein Vorfahre der anderen Spitze, spult Git vor – kein neuer Commit. Sonst entsteht ein Merge-Commit mit zwei Eltern; der erste ist der alte Stand des aktuellen Branch.
  - `--no-ff` erzwingt einen Merge-Commit, `--ff-only` verbietet ihn. `pull.ff = only` schützt vor ungeplanten Merges beim Pull.
  - `git log --graph` zeigt den ganzen Graphen, `git log --first-parent` die Integrationsschritte eines Branch.
  - `ort` ist die Standardstrategie. `-X ours` entscheidet nur Konflikte zugunsten der eigenen Seite, `-s ours` verwirft die andere Seite vollständig.
  - `--squash` erzeugt einen normalen Commit ohne Verwandtschaft. Der Branch gilt danach als nicht gemergt und wird gelöscht.
  - `git merge --abort` bricht einen offenen Merge ab, `git reset --hard ORIG_HEAD` nimmt einen abgeschlossenen, ungepushten Merge zurück.
exercises:
  - id: wann-fast-forward
    type: choice
    title: Nur ein Zeiger bewegt sich
    prompt: Du stehst auf `main` und führst `git merge feature/suche` ohne weitere Optionen und ohne besondere Konfiguration aus. In welcher Situation macht Git einen Fast-Forward?
    options:
      - text: "`main` hat seit dem Abzweigen keine neuen Commits, `feature/suche` hat drei."
        correct: true
        why: Die Merge-Base ist `main` selbst. Alle Commits von `main` stecken schon in `feature/suche`, Git muss nur den Zeiger vorschieben.
      - text: Beide Branches haben neue Commits, aber sie ändern verschiedene Dateien.
        correct: false
        why: Die Branches sind auseinandergelaufen. Auch ohne Konflikt braucht es einen Drei-Wege-Merge und damit einen Merge-Commit, der beide Linien verbindet.
      - text: "`feature/suche` hat keine neuen Commits, `main` hat zwei."
        correct: false
        why: "`feature/suche` ist dann schon vollständig in `main` enthalten. Git meldet `Already up to date.` und ändert nichts."
      - text: "`main` hat keine neuen Commits, aber in der Konfiguration steht `merge.ff = false`."
        correct: false
        why: "`merge.ff = false` wirkt wie `--no-ff`: Git erzeugt auch dann einen Merge-Commit, wenn ein Fast-Forward möglich wäre."
    explanation: |
      Ein Fast-Forward ist nur möglich, wenn der aktuelle Branch ein Vorfahre des anderen ist – also wenn die Merge-Base gleich HEAD ist. Ob die Änderungen sich in verschiedenen Dateien abspielen, spielt keine Rolle: Sobald beide Seiten eigene Commits haben, gibt es keinen Commit, auf den `main` zeigen könnte und der beide Stände enthält.
    resources:
      - title: git merge · Fast-forward merge
        url: https://git-scm.com/docs/git-merge#_fast_forward_merge
      - title: git config · merge.ff
        url: https://git-scm.com/docs/git-config#Documentation/git-config.txt-mergeff

  - id: drei-wege-ablauf
    type: order
    title: Was bei einem echten Merge passiert
    prompt: "`main` und `feature/login` sind auseinandergelaufen. Du führst auf `main` `git merge feature/login` aus, und es gibt keinen Konflikt. Bring die Schritte in die Reihenfolge, in der Git sie ausführt."
    lang: text
    lines: |
      Git bestimmt die Merge-Base von HEAD und feature/login.
      Git stellt fest, dass die Merge-Base nicht HEAD ist – ein Fast-Forward scheidet aus.
      Git berechnet die Änderungen von der Merge-Base zu HEAD und von der Merge-Base zu feature/login.
      Git kombiniert beide Änderungsmengen; was nur eine Seite geändert hat, wird übernommen.
      Git schreibt das kombinierte Ergebnis als neuen Tree.
      Git erzeugt einen Commit mit diesem Tree und zwei Eltern: zuerst HEAD, dann feature/login.
      Der Branch main wird auf den neuen Merge-Commit gesetzt.
    explanation: |
      Die Merge-Base ist der Dreh- und Angelpunkt: Aus ihr folgt, ob überhaupt gemergt werden muss, und gegen sie werden beide Seiten verglichen. Erst wenn das kombinierte Ergebnis als Tree feststeht, kann Git einen Commit darauf bauen. Die Reihenfolge der Eltern ist fest: Der erste ist immer der Commit, auf dem du standest. Zum Schluss bewegt sich – wie bei jedem Commit – der aktuelle Branch.
    resources:
      - title: git merge · True merge
        url: https://git-scm.com/docs/git-merge#_true_merge

  - id: ff-oder-merge-commit
    type: output
    title: Zwei Merges, zwei Ergebnisse
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      printf 'v1\n' > app.py
      git add app.py && git commit -qm "Start"
      git switch -qc feature/login
      printf 'v2\n' > app.py && git commit -qam "Login"
      git switch -q main
      git merge -q feature/login
      git rev-list --count main
      git switch -qc feature/logout
      printf 'v3\n' > app.py && git commit -qam "Logout"
      git switch -q main
      git merge -q --no-ff --no-edit feature/logout
      git rev-list --count main
      git log -1 --format=%s
    expected: |
      2
      4
      Merge branch 'feature/logout'
    verify: true
    explanation: |
      Beim ersten Merge hat sich `main` seit dem Abzweigen nicht bewegt: Git spult vor, `main` zeigt danach auf „Login“ und enthält zwei Commits. Beim zweiten Merge wäre wieder ein Fast-Forward möglich, aber `--no-ff` erzwingt einen Merge-Commit. Zu „Start“ und „Login“ kommen „Logout“ und der Merge-Commit hinzu – vier Commits. `--no-edit` übernimmt die Standardnachricht `Merge branch 'feature/logout'`.
    resources:
      - title: git merge · --no-ff
        url: https://git-scm.com/docs/git-merge#Documentation/git-merge.txt---no-ff

  - id: erster-elternteil
    type: output
    title: Welche Linie ist main?
    prompt: Was gibt das Skript aus? Die Commits entstehen innerhalb derselben Sekunde – die Reihenfolge ergibt sich allein aus dem Graphen.
    lang: bash
    code: |
      git init -q
      printf 'api\n' > api.py
      git add . && git commit -qm "API anlegen"
      git switch -qc feature/suche
      printf 'index\n' > suche.py && git add . && git commit -qm "Suche: Index"
      printf 'filter\n' >> suche.py && git commit -qam "Suche: Filter"
      git switch -q main
      printf 'doku\n' > README.md && git add . && git commit -qm "README"
      git merge -q --no-edit feature/suche
      git log --first-parent --format=%s
      echo ---
      git log --format=%s HEAD^1..HEAD^2
    expected: |
      Merge branch 'feature/suche'
      README
      API anlegen
      ---
      Suche: Filter
      Suche: Index
    verify: true
    explanation: |
      Der Merge-Commit hat zwei Eltern: `HEAD^1` ist der alte Stand von `main` („README“), `HEAD^2` die Spitze von `feature/suche`. `--first-parent` folgt nur dem ersten Elternteil und zeigt deshalb die Linie von `main` ohne die Feature-Commits. `HEAD^1..HEAD^2` bedeutet „erreichbar vom zweiten Elternteil, aber nicht vom ersten“ – genau die Commits, die der Merge neu nach `main` gebracht hat, neueste zuerst.
    resources:
      - title: git log · --first-parent
        url: https://git-scm.com/docs/git-log#Documentation/git-log.txt---first-parent
      - title: gitrevisions
        url: https://git-scm.com/docs/gitrevisions

  - id: squash-verwandtschaft
    type: output
    title: Gemergt oder nicht?
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      printf 'v1\n' > app.py
      git add . && git commit -qm "Start"
      git switch -qc feature/export
      printf 'csv\n' > export.py && git add . && git commit -qm "CSV-Export"
      printf 'json\n' >> export.py && git commit -qam "JSON-Export"
      git switch -q main
      git merge -q --squash feature/export > /dev/null
      git commit -qm "Export (#7)"
      git rev-list --count main
      git log -1 --format=%P | wc -w
      git branch --merged main --format='%(refname:short)'
      git merge-base --is-ancestor feature/export main && echo verwandt || echo fremd
    expected: |
      2
      1
      main
      fremd
    verify: true
    explanation: |
      `--squash` übernimmt nur den Inhalt. Der folgende Commit ist ein gewöhnlicher Commit mit **einem** Elternteil, `main` besteht aus „Start“ und „Export (#7)“. Die Commits „CSV-Export“ und „JSON-Export“ sind von `main` aus nicht erreichbar. Deshalb listet `git branch --merged main` den Feature-Branch nicht, und `--is-ancestor` scheitert – obwohl der Code vollständig auf `main` liegt.
    resources:
      - title: git merge · --squash
        url: https://git-scm.com/docs/git-merge#Documentation/git-merge.txt---squash
      - title: git merge-base · --is-ancestor
        url: https://git-scm.com/docs/git-merge-base#Documentation/git-merge-base.txt---is-ancestor

  - id: merge-base-finden
    type: command
    title: Wo haben sich die Wege getrennt?
    prompt: Gib den Commit aus, der die gemeinsame Basis von `main` und `feature/login` für einen Merge bildet.
    context: Du willst vor dem Merge wissen, seit welchem Commit die beiden Branches auseinanderlaufen.
    answers:
      - git merge-base main feature/login
      - git merge-base feature/login main
    output: |
      a31fdcb182bba2e2fd7b03574e93900277a76634
    explanation: |
      `git merge-base` sucht den jüngsten gemeinsamen Vorfahren – denselben Commit, gegen den `git merge` beide Seiten vergleicht. Die Reihenfolge der beiden Branches spielt für das Ergebnis keine Rolle. Mit `git log --oneline a31fdcb..feature/login` und `git log --oneline a31fdcb..main` siehst du danach, was jede Seite seitdem gemacht hat.
    resources:
      - title: git merge-base
        url: https://git-scm.com/docs/git-merge-base

  - id: squash-vorbereiten
    type: command
    title: Ein Feature, ein Commit
    prompt: Übernimm alle Änderungen von `feature/export` in `main` als **einen** vorbereiteten Commit, ohne Merge-Commit und ohne sofort zu committen.
    context: Du stehst auf `main`, das Arbeitsverzeichnis ist sauber. Die Commit-Nachricht willst du danach selbst mit `git commit -m` schreiben.
    answers:
      - git merge --squash feature/export
    output: |
      Updating 9cda06c..e6b5a81
      Fast-forward
      Squash commit -- not updating HEAD
       src/export.py | 6 ++++++
       1 file changed, 6 insertions(+)
       create mode 100644 src/export.py
    explanation: |
      `--squash` legt das Ergebnis des Merges in Index und Arbeitsverzeichnis ab, bewegt HEAD aber nicht und merkt sich keinen `MERGE_HEAD`. Der anschließende `git commit` hat deshalb nur einen Elternteil. Das ist gewollt für eine kompakte History – aber `feature/export` gilt danach nicht als gemergt und sollte gelöscht werden.
    resources:
      - title: git merge · --squash
        url: https://git-scm.com/docs/git-merge#Documentation/git-merge.txt---squash

  - id: merge-abbrechen
    type: command
    title: Zurück auf Anfang
    prompt: Brich den laufenden Merge ab und stelle den Zustand vor dem Merge wieder her.
    context: |
      Du hast `git merge feature/zahlung` gestartet und siehst:

      ```text
      Auto-merging src/payment.py
      CONFLICT (content): Merge conflict in src/payment.py
      Automatic merge failed; fix conflicts and then commit the result.
      ```

      Die Kollegin, die den Code geschrieben hat, ist erst morgen wieder da. Vor dem Merge war dein Arbeitsverzeichnis sauber.
    answers:
      - git merge --abort
      - git reset --merge
    explanation: |
      Während eines offenen Merges kennt Git den Zustand über `MERGE_HEAD`. `git merge --abort` setzt Index und Arbeitsverzeichnis auf den Stand vor dem Merge zurück und entfernt `MERGE_HEAD`; intern entspricht das `git reset --merge`. Weil das Arbeitsverzeichnis vorher sauber war, geht nichts verloren. Mit uncommitteten Änderungen vor dem Merge kann `--abort` sie nicht in jedem Fall wiederherstellen.
    resources:
      - title: git merge · --abort
        url: https://git-scm.com/docs/git-merge#Documentation/git-merge.txt---abort

  - id: integrationsskript
    type: gap
    title: Ein vorsichtiges Integrationsskript
    prompt: Ergänze die Optionen so, dass jeder Schritt genau das tut, was im Kommentar steht.
    lang: bash
    code: |
      # 1. main aktualisieren – aber nur, wenn das ohne Merge-Commit geht
      git switch main
      git pull ⟦--ff-only⟧
      # 2. Feature integrieren – immer mit Merge-Commit, auch wenn Vorspulen möglich wäre
      git merge ⟦--no-ff⟧ -m "Merge feature/login (#42)" feature/login
      # 3. Nur die Integrationsschritte auf main anzeigen, ohne die Feature-Commits
      git log ⟦--first-parent⟧ --format=%s -n 5
      # 4. Prüfen, ob der Hotfix-Branch vollständig in main enthalten ist
      git merge-base ⟦--is-ancestor⟧ release/2.4 main && echo "Hotfix ist enthalten"
    gaps:
      - label: Pull ohne Merge-Commit
        hint: Die Option lässt nur das Vorspulen zu und bricht sonst ab.
      - label: Merge-Commit erzwingen
        hint: Das Gegenteil von „fast-forward“ – mit „no“ davor.
      - label: Nur die Hauptlinie
        hint: Folge an jedem Merge nur dem ersten Elternteil.
      - label: Verwandtschaft prüfen
        hint: Eine Option von `git merge-base`, die nur über den Exit-Status antwortet.
    explanation: |
      `--ff-only` verhindert, dass ein Pull still einen Merge-Commit erzeugt. `--no-ff` sorgt dafür, dass das Feature als Einheit mit eigenem Merge-Commit in der History steht. `--first-parent` zeigt auf `main` genau diese Merge-Commits und die direkt auf `main` gemachten Commits. `git merge-base --is-ancestor A B` endet mit Status 0, wenn `A` von `B` aus erreichbar ist – nach einem Squash-Merge wäre das nicht der Fall.
    resources:
      - title: git pull · --ff-only
        url: https://git-scm.com/docs/git-pull#Documentation/git-pull.txt---ff-only
      - title: git log · --first-parent
        url: https://git-scm.com/docs/git-log#Documentation/git-log.txt---first-parent

  - id: hotfix-verschwunden
    type: bug
    title: Der Hotfix ist gemergt – und fehlt trotzdem
    prompt: |
      Die Befehle sollen den Hotfix 2.4.1 aus `release/2.4` nach `main` übernehmen. Nur bei Konflikten (in `config.yaml` haben beide Seiten den Timeout geändert) soll die Version von `main` gewinnen. Der Merge-Commit erscheint, und `git branch --merged` listet `release/2.4`. Aber der Rundungsfix in `src/payment.py` und der Eintrag in `CHANGELOG.md` fehlen auf `main`, und `git diff --stat HEAD^1 HEAD` gibt nichts aus. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: bash
    code: |
      # Hotfix 2.4.1 nach main übernehmen; bei Konflikten gewinnt main.
      git switch main
      git pull --ff-only
      git merge --no-edit -s ours release/2.4
      git log --first-parent --format=%s -n 1
    lines: [4]
    fix:
      - line: 4
        answers:
          - git merge --no-edit -X ours release/2.4
          - git merge -X ours --no-edit release/2.4
          - git merge --no-edit --strategy-option=ours release/2.4
          - git merge --strategy-option=ours --no-edit release/2.4
          - git merge --no-edit --strategy-option ours release/2.4
          - git merge -X ours release/2.4
          - git merge --strategy-option=ours release/2.4
          - git merge --no-edit -Xours release/2.4
    explanation: |
      `-s ours` wählt die **Strategie** „ours“: Der Merge-Commit bekommt zwar zwei Eltern, übernimmt aber exakt den Tree von `main` und verwirft alles aus `release/2.4`. Gemeint war die **Strategie-Option** `-X ours` der Standardstrategie `ort`: normal mergen und nur bei Konflikten die eigene Seite nehmen. Tückisch: Weil der Release-Branch jetzt als gemergt gilt, bringt ein erneutes `git merge release/2.4` nichts mehr. Ist der falsche Merge noch nicht gepusht, setzt du ihn mit `git reset --hard ORIG_HEAD` zurück und mergst richtig; ist er gepusht, holst du die Hotfix-Commits gezielt nach ([Cherry-pick und Revert](/git/cherry-pick-revert)).
    resources:
      - title: merge-strategies · ours (Strategie)
        url: https://git-scm.com/docs/merge-strategies#Documentation/merge-strategies.txt-ours-1
      - title: merge-strategies · ours (Option von ort)
        url: https://git-scm.com/docs/merge-strategies#Documentation/merge-strategies.txt-ours

  - id: zwei-merges-erklaeren
    type: explain
    title: Zwei Merges im Protokoll
    prompt: Eine Kollegin fragt, warum der erste Merge keinen Merge-Commit erzeugt hat, der zweite aber schon, und was in der Grafik zu sehen ist. Erkläre es ihr anhand der Sitzung.
    lang: console
    code: |
      $ git switch main
      $ git merge feature/rabatt
      Updating 14c4cb0..ea3feef
      Fast-forward
       src/cart.py | 3 +++
       1 file changed, 3 insertions(+)
      $ git merge feature/versand
      Merge made by the 'ort' strategy.
       src/shipping.py | 4 ++++
       1 file changed, 4 insertions(+)
       create mode 100644 src/shipping.py
      $ git log --graph --oneline
      *   b3575b7 (HEAD -> main) Merge branch 'feature/versand'
      |\
      | * c05d63e (feature/versand) Versandkosten berechnen
      * | ea3feef (feature/rabatt) Rabattcode prüfen
      |/
      * 14c4cb0 Warenkorb anlegen
    points:
      - Beim ersten Merge war `main` (14c4cb0) Vorfahre von `feature/rabatt`; Git hat den Zeiger nur vorgeschoben, es entstand kein Commit.
      - Danach waren `main` und `feature/versand` auseinandergelaufen (beide haben einen eigenen Commit seit 14c4cb0), deshalb war ein Drei-Wege-Merge gegen die Merge-Base 14c4cb0 nötig.
      - "Der Merge-Commit b3575b7 hat zwei Eltern: erster Elternteil ea3feef (alter Stand von `main`), zweiter c05d63e (`feature/versand`)."
      - "„Rabattcode prüfen“ steht wegen des Fast-Forwards auf der Hauptlinie; dass es ein eigener Branch war, ist nicht mehr sichtbar. Mit `--no-ff` wäre auch dafür ein Merge-Commit entstanden."
    explanation: |
      Der erste Merge war ein Fast-Forward: `main` zeigte noch auf den Abzweigpunkt 14c4cb0, also steckte alles von `main` schon in `feature/rabatt`, und Git hat `main` nur auf ea3feef vorgeschoben. Beim zweiten Merge hatte `main` dadurch einen Commit, den `feature/versand` nicht kennt, und umgekehrt. Git hat beide Seiten gegen die Merge-Base 14c4cb0 verglichen, die Änderungen kombiniert und den Merge-Commit b3575b7 mit zwei Eltern erzeugt – links in der Grafik der erste Elternteil ea3feef, rechts der zweite c05d63e. `git log --first-parent` würde deshalb Merge, „Rabattcode prüfen“ und „Warenkorb anlegen“ zeigen. Dass der Rabattcode aus einem eigenen Branch kam, geht durch den Fast-Forward verloren; wer das sehen will, mergt mit `--no-ff`.
    resources:
      - title: git log · --graph
        url: https://git-scm.com/docs/git-log#Documentation/git-log.txt---graph

  - id: labor-falscher-branch
    type: practice
    title: "Labor: Der falsche Branch ist drin"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Es erzeugt ein Repository, in dem auf `main` plötzlich eine Datei `style.css` und ein Commit „WIP: Dark Mode ausprobieren“ auftauchen. Nichts davon ist gepusht. Integriert werden sollte nur das Login-Feature.

      Stelle den Zustand her, in dem `main` genau `feature/login` per Merge-Commit enthalten hat und vom Dark-Mode-Experiment nichts weiß. Das Experiment selbst soll als Branch erhalten bleiben. Prüfe am Ende mit `git log --graph --format=%s` und `git status --short`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      printf 'timeout: 30\n' > config.yaml
      git add config.yaml && git commit -qm "Konfiguration anlegen"
      git switch -qc feature/login
      printf 'def login(user, password):\n    return check_password(user, password)\n' > login.py
      git add login.py && git commit -qm "Login prüfen"
      git switch -qc experiment/dark-mode main
      printf 'body { background: #000; }\n' > style.css
      git add style.css && git commit -qm "WIP: Dark Mode ausprobieren"
      git switch -q main
      printf 'timeout: 60\n' > config.yaml
      git commit -qam "Timeout erhöhen"
      git merge -q --no-edit experiment/dark-mode
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      printf 'timeout: 30\n' > config.yaml
      git add config.yaml && git commit -qm "Konfiguration anlegen"
      git switch -qc feature/login
      printf 'def login(user, password):\n    return check_password(user, password)\n' > login.py
      git add login.py && git commit -qm "Login prüfen"
      git switch -qc experiment/dark-mode main
      printf 'body { background: #000; }\n' > style.css
      git add style.css && git commit -qm "WIP: Dark Mode ausprobieren"
      git switch -q main
      printf 'timeout: 60\n' > config.yaml
      git commit -qam "Timeout erhöhen"
      git merge -q --no-edit experiment/dark-mode
      # Reparatur: Merge zurücknehmen, dann den richtigen Branch mergen
      git reset --hard ORIG_HEAD
      git merge --no-edit feature/login
      # Kontrolle
      test "$(git log -1 --format=%s)" = "Merge branch 'feature/login'"
      git merge-base --is-ancestor feature/login main
      if git merge-base --is-ancestor experiment/dark-mode main; then exit 1; fi
      test ! -e style.css
      test "$(git rev-list --count main)" -eq 4
      git rev-parse --verify -q experiment/dark-mode > /dev/null
      test -z "$(git status --porcelain)"
    checklist:
      - "`git log -1 --format=%s` zeigt `Merge branch 'feature/login'`."
      - "`git merge-base --is-ancestor experiment/dark-mode main` endet mit Status 1, `style.css` existiert nicht mehr."
      - "`git rev-list --count main` ist 4: Konfiguration, Timeout, Login und der Merge-Commit."
      - Der Branch `experiment/dark-mode` existiert noch.
      - "`git status --short` ist leer."
    verify: true
    hints:
      - Git hat sich vor dem Merge die alte Spitze von `main` gemerkt.
      - "`ORIG_HEAD` zeigt auf den Stand vor dem Merge. Welcher `reset`-Modus setzt auch das Arbeitsverzeichnis zurück?"
      - "`git reset --hard ORIG_HEAD`, danach `git merge --no-edit feature/login`."
    explanation: |
      Vor jedem Merge legt Git die alte Spitze des aktuellen Branch in `ORIG_HEAD` ab. `git reset --hard ORIG_HEAD` setzt `main` dorthin zurück und bringt Index und Arbeitsverzeichnis auf denselben Stand – der Merge-Commit ist danach von `main` aus nicht mehr erreichbar, der Branch `experiment/dark-mode` bleibt unberührt. Gleichwertig wäre hier `git reset --hard HEAD^1`, denn der erste Elternteil des Merge-Commits ist genau der alte Stand. Das Rezept gilt nur, solange nichts gepusht ist: Einen geteilten Merge nimmst du mit `git revert -m 1` zurück, damit die History der anderen nicht umgeschrieben wird.
    resources:
      - title: gitrevisions · ORIG_HEAD
        url: https://git-scm.com/docs/gitrevisions#Documentation/gitrevisions.txt-ORIGHEAD
      - title: git reset
        url: https://git-scm.com/docs/git-reset

  - id: labor-ff-only
    type: practice
    title: "Labor: Pull verweigert"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Es simuliert ein Team ohne Netzwerk: ein Bare-Repository `origin.git` und zwei Klone `alice` und `bob`. Bob hat `pull.ff = only` gesetzt. Sein `git pull` endet mit `fatal: Not possible to fast-forward, aborting.`, und am Ende steht die Shell in `bob/`.

      Finde mit `git status` heraus, was los ist. Führe dann Bobs Commit und Alices Änderung mit einem **Merge-Commit** zusammen (Rebase folgt im Modul [Rebase](/git/rebase)) und pushe das Ergebnis. Prüfe am Ende mit `git log --graph --format=%s` und `git status -sb`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q --bare origin.git
      git clone -q origin.git alice 2> /dev/null
      printf 'timeout: 30\n' > alice/config.yaml
      git -C alice add config.yaml
      git -C alice commit -qm "Konfiguration anlegen"
      git -C alice push -q origin main
      git clone -q origin.git bob
      git -C bob config pull.ff only
      # Alice pusht eine Änderung ...
      printf 'timeout: 30\nretries: 3\n' > alice/config.yaml
      git -C alice commit -qam "Retries konfigurieren"
      git -C alice push -q
      # ... während Bob lokal committet hat und aktualisieren will
      printf 'print("Hallo")\n' > bob/app.py
      git -C bob add app.py
      git -C bob commit -qm "App-Einstieg anlegen"
      git -C bob pull || true
      cd bob
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q --bare origin.git
      git clone -q origin.git alice 2> /dev/null
      printf 'timeout: 30\n' > alice/config.yaml
      git -C alice add config.yaml
      git -C alice commit -qm "Konfiguration anlegen"
      git -C alice push -q origin main
      git clone -q origin.git bob
      git -C bob config pull.ff only
      # Alice pusht eine Änderung ...
      printf 'timeout: 30\nretries: 3\n' > alice/config.yaml
      git -C alice commit -qam "Retries konfigurieren"
      git -C alice push -q
      # ... während Bob lokal committet hat und aktualisieren will
      printf 'print("Hallo")\n' > bob/app.py
      git -C bob add app.py
      git -C bob commit -qm "App-Einstieg anlegen"
      git -C bob pull || true
      cd bob
      # Diagnose: git status -sb zeigt [ahead 1, behind 1]
      # Reparatur: der gescheiterte Pull hat origin/main bereits aktualisiert
      git merge --no-edit origin/main
      git push -q
      # Kontrolle
      test "$(git rev-parse main)" = "$(git -C ../origin.git rev-parse main)"
      test "$(git log -1 --format=%P | wc -w)" -eq 2
      git log --format=%s | grep -q "Retries konfigurieren"
      grep -q 'retries: 3' config.yaml
      test -z "$(git status --porcelain)"
    checklist:
      - "`git status -sb` zeigte vor der Reparatur `[ahead 1, behind 1]` – die Branches waren auseinandergelaufen."
      - "`git log --graph --format=%s` zeigt einen Merge-Commit, der „App-Einstieg anlegen“ und „Retries konfigurieren“ verbindet."
      - "`config.yaml` enthält `retries: 3`, `app.py` ist vorhanden."
      - "`git status -sb` zeigt `## main...origin/main` ohne ahead/behind, `origin.git` hat denselben Stand."
    verify: true
    hints:
      - Ein `git pull` besteht aus zwei Schritten. Welcher davon hat schon geklappt?
      - "`origin/main` ist bereits aktuell. Du kannst ihn wie jeden anderen Branch mergen."
      - "`git merge --no-edit origin/main`, danach `git push`. Gleichwertig: `git pull --no-ff --no-edit`."
    explanation: |
      `pull.ff = only` hat genau das getan, wofür es da ist: Es hat verhindert, dass beim Pull unbemerkt ein Merge-Commit entsteht. Der Fetch-Teil des Pulls war erfolgreich, `origin/main` kennt Alices Commit schon. `git status -sb` zeigt `ahead 1, behind 1` – jede Seite hat einen Commit, den die andere nicht hat. Ein Fast-Forward ist damit unmöglich, also braucht es eine bewusste Entscheidung: Hier ein Merge von `origin/main` mit Merge-Commit, danach ist Bobs `main` ein Nachfahre von `origin/main` und der Push ist wieder ein Fast-Forward für das Remote. `git pull --no-ff` oder `git pull --no-rebase` führen zum selben Ergebnis, weil die Option auf der Kommandozeile die Konfiguration übersteuert.
    resources:
      - title: git config · pull.ff
        url: https://git-scm.com/docs/git-config#Documentation/git-config.txt-pullff
      - title: git pull
        url: https://git-scm.com/docs/git-pull

  - id: labor-squash-zweimal
    type: practice
    title: "Labor: Derselbe Branch, zweiter Merge"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Das Login-Feature wurde als Pull Request per Squash-Merge integriert. Danach hat jemand auf dem alten Branch `feature/login` einen weiteren Commit gemacht und ihn erneut gemergt. Der Merge bleibt mit einem Konflikt in `src/auth.py` stehen – in Code, der doch längst auf `main` liegt.

      Verstehe zuerst, warum der Konflikt entsteht. Stelle dann diesen Zustand her: `main` enthält zusätzlich zum Squash-Commit genau **einen** neuen Commit „Leerzeichen im Passwort ignorieren“, die ursprünglichen Einzelcommits des Features tauchen in der History von `main` nicht auf, und der alte Branch `feature/login` ist gelöscht. Prüfe mit `git log --graph --format=%s`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      mkdir src
      printf 'def login(user, password):\n    return False\n' > src/auth.py
      git add src && git commit -qm "Login-Stub"
      git switch -qc feature/login
      printf 'def login(user, password):\n    return check(user, password)\n' > src/auth.py
      git commit -qam "Passwort prüfen"
      printf 'def logout(user):\n    user.session = None\n' > src/session.py
      git add src && git commit -qm "Logout ergänzen"
      # Der Pull Request wird per Squash-Merge integriert
      git switch -q main
      git merge -q --squash feature/login > /dev/null
      git commit -qm "Login und Logout (#12)"
      # Auf dem alten Branch geht die Arbeit weiter ...
      git switch -q feature/login
      printf 'def login(user, password):\n    return check(user, password.strip())\n' > src/auth.py
      git commit -qam "Leerzeichen im Passwort ignorieren"
      # ... und er wird erneut gemergt
      git switch -q main
      git merge --no-edit feature/login || true
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      mkdir src
      printf 'def login(user, password):\n    return False\n' > src/auth.py
      git add src && git commit -qm "Login-Stub"
      git switch -qc feature/login
      printf 'def login(user, password):\n    return check(user, password)\n' > src/auth.py
      git commit -qam "Passwort prüfen"
      printf 'def logout(user):\n    user.session = None\n' > src/session.py
      git add src && git commit -qm "Logout ergänzen"
      # Der Pull Request wird per Squash-Merge integriert
      git switch -q main
      git merge -q --squash feature/login > /dev/null
      git commit -qm "Login und Logout (#12)"
      # Auf dem alten Branch geht die Arbeit weiter ...
      git switch -q feature/login
      printf 'def login(user, password):\n    return check(user, password.strip())\n' > src/auth.py
      git commit -qam "Leerzeichen im Passwort ignorieren"
      # ... und er wird erneut gemergt
      git switch -q main
      git merge --no-edit feature/login || true
      # Reparatur: Merge abbrechen, nur den neuen Commit übernehmen, alten Branch löschen
      git merge --abort
      git cherry-pick feature/login
      git branch -D feature/login
      # Kontrolle
      test "$(git log -1 --format=%s)" = "Leerzeichen im Passwort ignorieren"
      test "$(git rev-list --count main)" -eq 3
      grep -q 'password.strip()' src/auth.py
      test -f src/session.py
      if git rev-parse --verify -q feature/login > /dev/null; then exit 1; fi
      test -z "$(git status --porcelain)"
    checklist:
      - Du kannst erklären, warum der Konflikt entsteht – Merge-Base ist weiterhin „Login-Stub“.
      - "`git log --format=%s main` zeigt genau drei Commits: „Leerzeichen im Passwort ignorieren“, „Login und Logout (#12)“, „Login-Stub“."
      - "`src/auth.py` enthält `password.strip()`, `src/session.py` ist vorhanden."
      - "`git branch` listet `feature/login` nicht mehr, `git status --short` ist leer."
    verify: true
    hints:
      - Welcher Commit ist die Merge-Base von `main` und `feature/login`? `git merge-base main feature/login` und `git log --format=%s -1 <hash>` verraten es.
      - Zuerst den offenen Merge abbrechen. Neu ist auf dem Branch nur sein letzter Commit.
      - "`git merge --abort`, dann `git cherry-pick feature/login` (übernimmt genau die Spitze des Branch), dann `git branch -D feature/login`."
    explanation: |
      Der Squash-Merge hat nur Inhalt übertragen, keine Verwandtschaft. Für Git ist die Merge-Base von `main` und `feature/login` deshalb immer noch „Login-Stub“. Beim zweiten Merge vergleicht Git beide Seiten gegen diesen alten Stand: `main` hat die `login`-Zeile auf `check(user, password)` geändert, der Branch auf `check(user, password.strip())` – aus Git-Sicht zwei widersprüchliche Änderungen derselben Zeile. Selbst ohne Konflikt würden die alten Einzelcommits noch einmal in `main` landen, neben dem Squash-Commit mit demselben Inhalt. Sauber ist es, den Merge abzubrechen und nur den neuen Commit zu übernehmen: `git cherry-pick` wendet genau die Änderung eines Commits an ([Cherry-pick und Revert](/git/cherry-pick-revert)). Im Team-Alltag zweigst du dafür einen neuen Branch von `main` ab und stellst einen neuen Pull Request.
    resources:
      - title: git merge · --squash
        url: https://git-scm.com/docs/git-merge#Documentation/git-merge.txt---squash
      - title: git cherry-pick
        url: https://git-scm.com/docs/git-cherry-pick
      - title: GitHub Docs · About pull request merges
        url: https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/incorporating-changes-from-a-pull-request/about-pull-request-merges
