id: merge
title: Merge verstehen
level: 2
minutes: 150
summary: Was beim Zusammenführen von Branches passiert – Merge-Base, Fast-Forward und Merge-Commit –, wie du Merges steuerst, liest und rückgängig machst, und warum ein Squash-Merge die Verwandtschaft kappt.
goals:
  - Du bestimmst die Merge-Base zweier Branches und sagst vorher, ob `git merge` vorspult oder einen Merge-Commit mit zwei Eltern erzeugt.
  - Du steuerst Merges mit `--no-ff`, `--ff-only` und `pull.ff` und liest die History mit `git log --graph` und `--first-parent`.
  - Du unterscheidest die Strategie-Option `-X ours` von der Strategie `-s ours` und weißt, welche Rolle `ort` spielt.
  - Du erklärst, warum ein Squash-Merge keine Verwandtschaft herstellt, und arbeitest danach sauber weiter.
  - Du brichst offene Merges mit `--abort` ab und nimmst einen ungepushten Merge mit `ORIG_HEAD` zurück.
