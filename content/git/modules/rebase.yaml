id: rebase
title: "Rebase: History neu aufsetzen"
level: 2
minutes: 160
summary: Wie Rebase Commits auf eine neue Basis kopiert, wann du es statt Merge einsetzt, wie du Konflikte Commit für Commit löst, Branches mit --onto umpflanzt und nach dem Rebase sicher pushst.
goals:
  - Du erklärst, dass Rebase Commits kopiert und neu anwendet, und sagst vorher, welche Commits neue Hashes bekommen und wo die alten bleiben.
  - Du wägst Merge und Rebase gegeneinander ab und hältst dich an die goldene Regel für geteilte History.
  - Du hältst Branches mit `pull --rebase` und `rebase origin/main` aktuell und pflanzt Branches mit `--onto` und `--update-refs` um.
  - Du löst Konflikte während eines Rebase, kennst die vertauschten Rollen von ours und theirs und brichst sauber ab.
  - Du pushst umgeschriebene Branches mit `--force-with-lease` und machst einen missglückten Rebase mit `ORIG_HEAD` oder dem Reflog rückgängig.
