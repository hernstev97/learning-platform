lesson: |
  Freitagnachmittag, ein Hotfix für die Rechnungs-App: Du checkst den Tag `v2.3.0` aus, korrigierst die Rundung, committest zweimal und wechselst zurück auf `main`. Am Montag tauchen die beiden Commits in keinem `git log` mehr auf. Am selben Tag wird dein Push abgelehnt, obwohl `git status` gerade noch „up to date“ gemeldet hat. Beide Überraschungen haben dieselbe Ursache: ein unscharfes Bild davon, was ein Branch, `HEAD` und `origin/main` sind.

  Das Bild, das dieses Modul aufbaut, ist klein: Commits bilden einen Graphen, der sich nicht verändert – jeder Commit kennt seine Eltern. Branches, Tags, `HEAD` und `origin/main` sind Namensschilder, die auf Knoten dieses Graphen zeigen. Fast jeder Befehl in diesem Modul verschiebt nur Schilder.

  ## Ein Branch ist ein beweglicher Zeiger

  Ein Commit weiß nichts von Branches. Ein Branch ist eine **Ref**: ein Name unter `refs/heads/`, der auf genau einen Commit zeigt ([Pro Git · Branches in a Nutshell](https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell)). Im Standardformat ist das eine Datei mit 40 Hex-Zeichen und einem Zeilenumbruch:

  ```console
  $ wc -c .git/refs/heads/main
  41 .git/refs/heads/main
  $ git rev-parse --short main
  3f9a1c2
  ```

  Einen Branch anzulegen kostet deshalb nichts – es werden keine Dateien kopiert, nur ein Schild aufgestellt. Interessant wird es beim Commit: Git schreibt den neuen Commit mit dem bisherigen als Elternteil und **verschiebt dann den Branch, auf dem du stehst**, auf den neuen Commit. Alle anderen Branches bleiben, wo sie sind.

  ```text
  git branch feature/login     A---B---C   main, feature/login
                                           (HEAD → main)

  git switch feature/login     A---B---C   main, feature/login
                                           (HEAD → feature/login)

  git commit                   A---B---C   main
                                        \
                                         D   feature/login
                                             (HEAD → feature/login)
  ```

  Daraus folgt: Ein Branch „enthält“ keine Commits. Er zeigt auf einen, und alles, was von dort über Eltern erreichbar ist, gehört zu seiner History. Löschst du einen Branch, verschwindet nur das Schild. Commits, auf die danach kein Schild mehr zeigt, sind **unerreichbar**; Git räumt sie irgendwann mit `git gc` weg. Wie Refs gespeichert werden (auch gesammelt in `.git/packed-refs`), zeigt das Modul [Das Datenmodell](/git/datenmodell).

  > [!MERKE]
  > Ein Branch ist ein Zeiger auf einen Commit. Ein Commit bewegt genau den Branch, auf den `HEAD` zeigt – keinen anderen.

  ### Branches verwalten

  ```console
  $ git branch -v
    feature/login 5c2e8a1 Add login form
  * main          3f9a1c2 Initial commit
  $ git branch --merged
  * main
  $ git branch --no-merged
    feature/login
  $ git branch -d feature/login
  error: the branch 'feature/login' is not fully merged
  hint: If you are sure you want to delete it, run 'git branch -D feature/login'
  hint: Disable this message with "git config set advice.forceDeleteBranch false"
  $ git branch -m feature/login feature/auth
  ```

  `-v` zeigt zu jedem Branch den Commit, auf den er zeigt; der Stern markiert den aktuellen. [`--merged`](https://git-scm.com/docs/git-branch#Documentation/git-branch.txt---mergedcommit) listet Branches, deren Spitze von `HEAD` aus erreichbar ist – ihre Arbeit steckt also schon im aktuellen Branch, sie lassen sich gefahrlos löschen. `--no-merged` zeigt das Gegenteil. `-d` löscht nur, wenn der Branch vollständig in seinen Upstream eingeflossen ist – oder, falls er keinen hat, in `HEAD`; `-D` löscht ohne diese Prüfung. `-m` benennt um – nur lokal, der Branch auf dem Server behält seinen Namen.

  ## HEAD: Wo du gerade stehst

  `HEAD` beantwortet die Frage „Worauf baut mein nächster Commit auf?“. Normalerweise ist `HEAD` eine **symbolische Ref**: Es zeigt nicht auf einen Commit, sondern auf einen Branch.

  ```console
  $ cat .git/HEAD
  ref: refs/heads/main
  $ git symbolic-ref HEAD
  refs/heads/main
  $ git branch --show-current
  main
  ```

  Beim Commit ändert sich `.git/HEAD` nicht – es steht weiterhin `ref: refs/heads/main` darin. Was sich ändert, ist der Inhalt von `refs/heads/main`. Das ist der Mechanismus hinter „Ein Commit bewegt den aktuellen Branch“.

  Gewechselt wird mit [`git switch`](https://git-scm.com/docs/git-switch). Der Befehl setzt `HEAD` auf den Ziel-Branch und bringt Index und Arbeitsverzeichnis auf dessen Stand:

  ```console
  $ git switch feature/login
  Switched to branch 'feature/login'
  $ git switch -c feature/export
  Switched to a new branch 'feature/export'
  $ git switch -c hotfix/2.3.1 v2.3.0
  Switched to a new branch 'hotfix/2.3.1'
  $ git switch main
  error: Your local changes to the following files would be overwritten by checkout:
  	app.py
  Please commit your changes or stash them before you switch branches.
  Aborting
  ```

  `-c` legt den Branch an und wechselt darauf, optional mit einem Startpunkt (Branch, Tag, Commit). Nicht committete Änderungen nimmt `switch` mit, solange sie nicht mit dem Ziel kollidieren. Kollidieren sie, bricht Git ab, bevor etwas verloren geht – dann committest du oder parkst die Änderungen (mehr dazu in [Stash und Worktrees](/git/stash-worktrees)).

  `switch` gibt es seit Git 2.23. Vorher erledigte `git checkout` alles: `git checkout feature/login` wechselt, `git checkout -b feature/export` legt an und wechselt, `git checkout -- app.py` stellt dagegen eine Datei wieder her. Weil ein Befehl mit zwei so verschiedenen Aufgaben leicht Arbeit vernichtet, wurde er in `switch` und `restore` aufgeteilt. In Anleitungen und bei Kollegen begegnet dir `checkout` weiterhin.

  > [!TIP]
  > `git switch -` wechselt zum vorherigen Branch, so wie `cd -` ins vorherige Verzeichnis. Praktisch, wenn du zwischen Feature-Branch und `main` pendelst.

  ## Detached HEAD

  Enthält `.git/HEAD` statt `ref: …` direkt einen Commit-Hash, ist `HEAD` **detached** – losgelöst von jedem Branch ([gitglossary · detached HEAD](https://git-scm.com/docs/gitglossary#def_detached_HEAD)). Das passiert, wenn du einen Tag oder Commit auscheckst, während eines Rebase (Git setzt die Commits einzeln neu auf), während `git bisect` und in vielen CI-Systemen, die genau einen Commit auschecken. `switch` verlangt dafür ausdrücklich `--detach`, `checkout` nicht:

  ```console
  $ git switch v2.3.0
  fatal: a branch is expected, got tag 'v2.3.0'
  hint: If you want to detach HEAD at the commit, try again with the --detach option.
  $ git switch --detach v2.3.0
  HEAD is now at 807e9fe Release 2.3.0
  $ git status
  HEAD detached at v2.3.0
  nothing to commit, working tree clean
  ```

  Ansehen, bauen, testen – alles unproblematisch. Auch Commits funktionieren: Git schreibt den Commit und verschiebt `HEAD` direkt auf ihn. Nur zeigt **kein Branch** auf die neuen Commits. Solange du im Detached HEAD bleibst, hält `HEAD` sie fest. Wechselst du weg, verlieren sie ihr letztes Schild:

  ```text
        E---F      ← HEAD (detached), nach git switch main: kein Name mehr
       /
  A---B---C        main
      ↑
    v2.3.0
  ```

  Git warnt dabei und nennt den Hash:

  ```console
  $ git switch main
  Warning: you are leaving 2 commits behind, not connected to
  any of your branches:

    a41c9d0 Document rounding rule
    edd1a81 Fix rounding in invoice

  If you want to keep them by creating a new branch, this may be a good time
  to do so with:

   git branch <new-branch-name> a41c9d0

  Switched to branch 'main'
  ```

  **Rettung.** Solange du noch im Detached HEAD stehst: `git switch -c hotfix/2.3.1` – der neue Branch zeigt auf den aktuellen Commit, `HEAD` hängt wieder an einem Branch. Bist du schon weg, nimm den Hash aus der Warnung: `git branch hotfix/2.3.1 a41c9d0`. Ist die Warnung aus dem Terminal verschwunden, hilft das Reflog: `HEAD@{1}` ist der Commit, auf dem `HEAD` vor dem letzten Wechsel stand, und `git reflog` listet alle früheren Positionen ([Reset und Reflog](/git/reset-reflog)).

  > [!WARNING]
  > Unerreichbare Commits bleiben nicht ewig. Sie leben nur noch im Reflog, und dessen Einträge für unerreichbare Commits laufen standardmäßig nach 30 Tagen ab. Danach entfernt `git gc` sie endgültig. Wer im Detached HEAD committet, legt sofort einen Branch an.

  > [!INTERVIEW] „Was ist ein Detached HEAD – und ist das schlimm?“
  > `HEAD` zeigt dann direkt auf einen Commit statt auf einen Branch, etwa nach dem Auschecken eines Tags oder mitten in einem Rebase. Zum Ansehen und Testen ist das in Ordnung. Riskant wird es erst, wenn ich dort committe und wegwechsle: Dann zeigt kein Branch mehr auf die Commits. Ich sichere sie mit `git switch -c <name>` oder später mit `git branch <name> <hash>` aus der Warnung bzw. aus dem Reflog.

  ## Tags: Namen, die stehen bleiben

  Ein Tag ist eine Ref unter `refs/tags/`, die sich beim Commit **nicht** bewegt – ideal für Releases. Es gibt zwei Arten ([git-tag](https://git-scm.com/docs/git-tag)):

  - **Leichtgewichtig:** `git tag v2.4.0-rc1` legt nur die Ref an, direkt auf den Commit. Gut für private Lesezeichen.
  - **Annotiert:** `git tag -a v2.4.0 -m "Release 2.4.0"` erzeugt ein eigenes Tag-Objekt mit Autor, Datum, Nachricht und optional Signatur; die Ref zeigt auf dieses Objekt, das Objekt auf den Commit. Releases bekommen annotierte Tags, und `git describe` berücksichtigt standardmäßig nur diese.

  ```console
  $ git tag v2.4.0-rc1
  $ git tag -a v2.4.0 -m "Release 2.4.0"
  $ git cat-file -t v2.4.0-rc1
  commit
  $ git cat-file -t v2.4.0
  tag
  $ git push origin v2.4.0
  To github.com:acme/shop.git
   * [new tag]         v2.4.0 -> v2.4.0
  ```

  `git push` ohne weitere Angaben überträgt **keine** Tags. Du pushst sie einzeln (`git push origin v2.4.0`), alle auf einmal (`git push origin --tags` – dann auch jedes vergessene Test-Tag) oder mit [`--follow-tags`](https://git-scm.com/docs/git-push#Documentation/git-push.txt---follow-tags) die annotierten Tags, die an gepushten Commits hängen. Gelöscht wird lokal mit `git tag -d v2.4.0-rc1`, auf dem Server mit `git push origin --delete v2.4.0-rc1`. Einen veröffentlichten Tag verschiebt man nicht: `git fetch` überschreibt vorhandene Tags nicht, bei Kolleginnen bliebe der alte Stand stehen. Stattdessen gibt es ein neues Release, etwa `v2.4.1`.

  ## Remotes und Remote-Tracking-Branches

  `git clone` kopiert den gesamten Commit-Graphen und merkt sich die Adresse unter dem Namen `origin`. Für jeden Branch auf dem Server legt Git einen **Remote-Tracking-Branch** an: `origin/main` unter `refs/remotes/origin/`. Er ist Gits Erinnerung daran, wo `main` auf dem Server beim letzten Kontakt stand ([Pro Git · Remote Branches](https://git-scm.com/book/en/v2/Git-Branching-Remote-Branches)). Du committest nie direkt darauf; `git switch origin/main` wird mit `fatal: a branch is expected, got remote branch 'origin/main'` abgelehnt.

  Drei Befehle bewegen unterschiedliche Schilder:

  - [`git fetch`](https://git-scm.com/docs/git-fetch) lädt neue Commits und verschiebt **nur** `origin/*`. Deine Branches und dein Arbeitsverzeichnis bleiben unberührt – `fetch` ist immer gefahrlos.
  - [`git pull`](https://git-scm.com/docs/git-pull) ist `fetch` plus Integration des Upstreams in den aktuellen Branch: Fast-Forward, Merge oder mit `--rebase` ein Rebase. Sind beide Seiten auseinandergelaufen und ist nichts konfiguriert, bricht Git mit `fatal: Need to specify how to reconcile divergent branches.` ab und schlägt `pull.rebase` oder `pull.ff` vor. Die Abwägung behandeln [Merge](/git/merge) und [Rebase](/git/rebase).
  - [`git push`](https://git-scm.com/docs/git-push) überträgt deine Commits und verschiebt den Branch auf dem Server – aber nur als Fast-Forward. Hat der Server Commits, die du nicht hast, wird der Push abgelehnt.

  ### Upstream, ahead und behind

  Der **Upstream** eines Branches ist der Remote-Tracking-Branch, mit dem er verknüpft ist. Du setzt ihn beim ersten Push mit `git push -u origin feature/login` oder nachträglich mit `git branch -u origin/feature/login`. Git setzt ihn automatisch, wenn du von einem Remote-Tracking-Branch abzweigst: `git switch feature/search` legt, falls es nur `origin/feature/search` gibt, einen lokalen Branch mit diesem Upstream an. In Befehlen steht `@{u}` (lang `@{upstream}`) für den Upstream des aktuellen Branches ([gitrevisions · @{upstream}](https://git-scm.com/docs/gitrevisions#Documentation/gitrevisions.txt-branchnameupstreamegmasterupstreamu)).

  Mit dem Upstream vergleicht `git status` – und zwar **lokal**, ohne den Server zu fragen:

  ```console
  $ git status
  On branch main
  Your branch is ahead of 'origin/main' by 1 commit.
    (use "git push" to publish your local commits)

  nothing to commit, working tree clean
  $ git fetch
  From github.com:acme/shop
     b79e67c..d24a95a  main       -> origin/main
  $ git status
  On branch main
  Your branch and 'origin/main' have diverged,
  and have 1 and 2 different commits each, respectively.
    (use "git pull" if you want to integrate the remote branch with yours)

  nothing to commit, working tree clean
  $ git branch -vv
  * main 9c41e07 [origin/main: ahead 1, behind 2] Document setup
  $ git rev-list --left-right --count main...@{u}
  1	2
  ```

  **Ahead** zählt deine Commits, die `origin/main` nicht hat; **behind** die Commits auf `origin/main`, die dir fehlen. Vor dem `fetch` war der Stand nur scheinbar harmlos. Im Graphen sieht die Lage nach dem `fetch` so aus:

  ```text
  A---B---F---G   origin/main
       \
        D         main (HEAD)
  ```

  Ein `git push` würde jetzt abgelehnt (`! [rejected] main -> main (non-fast-forward)`), weil `origin/main` sonst `F` und `G` verlieren würde. Der übliche Weg: `git pull --rebase` setzt `D` hinter `G`, danach geht der Push durch.

  Eine Falle: Wer mit `git switch -c feature/login origin/main` abzweigt, bekommt `origin/main` als Upstream. `git status` meldet dann „ahead of 'origin/main'“, und `git push` scheitert mit `fatal: The upstream branch of your current branch does not match the name of your current branch.` Der dort vorgeschlagene Befehl `git push origin HEAD:main` würde dein Feature direkt auf `main` schieben. Richtig ist `git push -u origin HEAD`: Es legt `feature/login` auf dem Server an und setzt den Upstream neu. Mit `git config branch.autoSetupMerge simple` setzt Git den Upstream beim Abzweigen nur noch, wenn die Namen übereinstimmen.

  > [!PRAXIS] Erst fetchen, dann urteilen
  > Aussagen wie „Mein Branch ist aktuell“ oder „Da ist nichts Neues“ basieren auf dem letzten `fetch`. Viele Teams stellen deshalb `git config --global fetch.prune true` ein (gelöschte Remote-Branches verschwinden lokal) und `pull.rebase true` oder `pull.ff only`, damit `git pull` keine ungeplanten Merge-Commits erzeugt. IDEs fetchen oft im Hintergrund – im Terminal bist du dafür selbst zuständig.

  ## Bereiche: A..B und A...B

  Weil alles ein Graph ist, lassen sich Fragen als Mengen von Commits stellen ([gitrevisions · Specifying Ranges](https://git-scm.com/docs/gitrevisions#_specifying_ranges)):

  - `A..B` – Commits, die von `B` aus erreichbar sind, aber nicht von `A`. `git log main..feature/login` zeigt, was der Feature-Branch mitbringt – genau das, was ein Pull Request enthalten würde.
  - `A...B` – die **symmetrische Differenz**: erreichbar von `A` oder `B`, aber nicht von beiden. Mit `--left-right` markiert Git, auf welcher Seite ein Commit liegt.
  - Eine leere Seite steht für `HEAD`: `git log @{u}..` sind deine ungepushten Commits.

  Für die Lage aus dem Graphen oben:

  ```console
  $ git log --format=%s main..origin/main
  Log request ids
  Add health endpoint
  $ git log --format=%s origin/main..main
  Document setup
  $ git log --left-right --format='%m %s' main...origin/main
  < Document setup
  > Log request ids
  > Add health endpoint
  ```

  `main..origin/main` ist „was beim Pull hereinkommt“, `origin/main..main` „was beim Push hinausgeht“. Die Richtung zu vertauschen ist der häufigste Fehler mit dieser Syntax. Achtung: Bei `git diff` bedeuten die Punkte etwas anderes. `git diff A...B` vergleicht die gemeinsame Basis mit `B` – so stellt ein Pull Request seine Änderungen dar. Das vertieft das Modul [Merge](/git/merge).

  ## Häufige Fehler

  - **Im Detached HEAD committet und weggewechselt.** Symptom: Commits fehlen in `git log --all`. Hash aus der Warnung oder `git reflog` nehmen und `git branch <name> <hash>`.
  - **`origin/main` für den aktuellen Serverstand halten.** `git status` sagt „up to date“, der Push scheitert trotzdem. Erst `git fetch`, dann vergleichen.
  - **`git pull` ohne Konfiguration.** Je nach Lage entstehen Merge-Commits oder der Abbruch „Need to specify how to reconcile divergent branches“. `pull.rebase` oder `pull.ff` bewusst setzen.
  - **`git branch -D` aus Gewohnheit.** `-d` verweigert das Löschen ungemergter Arbeit – diese Prüfung willst du fast immer.
  - **Tags nicht gepusht** oder mit `--tags` versehentlich alle lokalen Test-Tags veröffentlicht.
  - **Falscher Upstream nach `git switch -c x origin/main`.** Push-Fehler „upstream branch … does not match“. Nicht `HEAD:main` pushen, sondern `git push -u origin HEAD`.
  - **Richtung bei `A..B` vertauscht.** `main..origin/main` ist eingehend, `origin/main..main` ausgehend.

  ## Zusammenfassung

  - Commits bilden einen unveränderlichen Graphen; Branches, Tags, `HEAD` und `origin/*` sind Zeiger darauf.
  - `HEAD` zeigt normalerweise auf einen Branch. Ein Commit verschiebt genau diesen Branch.
  - `git switch`, `switch -c`, `switch -`; `checkout` ist die ältere Mehrzweckform. `git branch -v/-vv/-d/-D/-m/--merged` verwaltet Branches.
  - Detached HEAD: `HEAD` zeigt direkt auf einen Commit. Commits dort mit `git switch -c` sichern, bevor du wegwechselst – sonst über Hash oder Reflog retten.
  - Annotierte Tags für Releases (`git tag -a`), einzeln pushen; `git push` allein überträgt keine Tags.
  - `origin/main` ist der Stand beim letzten Kontakt. `fetch` bewegt nur `origin/*`, `pull` = `fetch` + Integration, `push` nur als Fast-Forward.
  - Upstream mit `push -u` setzen, `@{u}` referenziert ihn; ahead/behind kommen aus `git status`, `git branch -vv` und `git rev-list --left-right --count`.
  - `A..B`: in `B`, nicht in `A`. `A...B`: auf genau einer Seite.
exercises:
  - id: zeiger-verstehen
    type: choice
    title: Wer bewegt sich beim Commit?
    prompt: |
      Du stehst auf `main` (`.git/HEAD` enthält `ref: refs/heads/main`) und führst nacheinander aus:

      ```bash
      git branch feature/export
      git commit -am "Add CSV export"
      ```

      Welche Aussagen stimmen?
    options:
      - text: "`git branch feature/export` legt nur eine neue Ref an, die auf denselben Commit zeigt wie `main`. Dateien werden nicht kopiert."
        correct: true
        why: Ein Branch ist ein Zeiger; ihn anzulegen heißt, eine Ref mit einem Commit-Hash zu schreiben.
      - text: Der neue Commit landet auf `feature/export`, weil das der zuletzt angelegte Branch ist.
        correct: false
        why: "`git branch` legt an, wechselt aber nicht. `HEAD` zeigt weiter auf `main`, also bewegt der Commit `main`."
      - text: Nach dem Commit zeigt `main` auf den neuen Commit, `feature/export` bleibt auf dem vorherigen stehen.
        correct: true
        why: Ein Commit verschiebt nur den Branch, auf den `HEAD` zeigt.
      - text: Durch den Commit ändert sich der Inhalt von `.git/HEAD`.
        correct: false
        why: "`.git/HEAD` enthält weiterhin `ref: refs/heads/main`. Geändert wird `refs/heads/main`."
      - text: "`git branch -d feature/export` würde danach den Commit löschen, auf den `feature/export` zeigt."
        correct: false
        why: Gelöscht wird nur die Ref. Der Commit bleibt als Vorfahre von `main` erreichbar – deshalb erlaubt `-d` das Löschen auch ohne Rückfrage.
    explanation: |
      Das Denkmodell in einem Satz: Commits sind feste Knoten, Branches sind Schilder, `HEAD` sagt, welches Schild beim nächsten Commit mitwandert. `git branch` stellt nur ein Schild auf; erst `git switch` hängt `HEAD` an ein anderes Schild. Wer das verinnerlicht hat, kann vorhersagen, wo ein Commit landet, und weiß, dass das Löschen eines Branches keine Commits löscht.
    resources:
      - title: Pro Git · Branches in a Nutshell
        url: https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell
      - title: gitglossary · HEAD
        url: https://git-scm.com/docs/gitglossary#def_HEAD

  - id: origin-main-stand
    type: choice
    title: „Your branch is up to date“
    prompt: |
      Du hast seit gestern Morgen weder `fetch`, `pull` noch `push` ausgeführt. Jetzt meldet `git status`:

      ```text
      On branch main
      Your branch is up to date with 'origin/main'.
      ```

      Welche Aussagen stimmen?
    options:
      - text: Dein `main` zeigt auf denselben Commit wie dein lokales `origin/main` – also auf den Stand, den `main` auf dem Server beim letzten Kontakt hatte.
        correct: true
        why: "`origin/main` ist eine lokale Ref, die nur bei `fetch`, `pull` und `push` aktualisiert wird. `git status` vergleicht mit ihr."
      - text: Auf dem Server gibt es garantiert keine neuen Commits auf `main`.
        correct: false
        why: "`git status` fragt den Server nicht. Seit gestern können Kolleginnen beliebig viel gepusht haben."
      - text: "`git fetch` kann `origin/main` weiterbewegen, sodass `git status` danach „behind“ meldet – ohne dass sich dein `main` oder dein Arbeitsverzeichnis ändert."
        correct: true
        why: "`fetch` lädt Commits und verschiebt nur die Remote-Tracking-Branches."
      - text: Solange du keine eigenen Commits hast, tun `git fetch` und `git pull` dasselbe.
        correct: false
        why: "`pull` integriert zusätzlich: Ohne eigene Commits spult es `main` per Fast-Forward vor und aktualisiert dein Arbeitsverzeichnis. `fetch` fasst beides nicht an."
    explanation: |
      Die Meldung vergleicht zwei **lokale** Zeiger: `main` und `origin/main`. Wie aktuell `origin/main` ist, hängt vom letzten `fetch`, `pull` oder `push` ab. Deshalb gehört vor jede Aussage über den Serverstand ein `git fetch`. `fetch` ist gefahrlos, weil es nur `origin/*` bewegt; erst `pull` verändert deinen Branch.
    resources:
      - title: Pro Git · Remote Branches
        url: https://git-scm.com/book/en/v2/Git-Branching-Remote-Branches
      - title: git-fetch – Referenz
        url: https://git-scm.com/docs/git-fetch

  - id: zeiger-nach-commit
    type: output
    title: Wohin ist der Commit gegangen?
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      printf 'v1\n' > app.py
      git add app.py
      git commit -qm "Initial commit"
      git branch feature/export
      printf 'v2\n' > app.py
      git commit -qam "Add CSV export"
      git log --format=%s feature/export
      echo "---"
      git log --format=%s main
      git branch --show-current
    expected: |
      Initial commit
      ---
      Add CSV export
      Initial commit
      main
    verify: true
    explanation: |
      `git branch feature/export` stellt nur ein neues Schild auf den ersten Commit; `HEAD` bleibt an `main`. Der zweite Commit bewegt deshalb `main`, während `feature/export` stehen bleibt. `git log` zeigt vom jeweiligen Branch aus alle erreichbaren Commits, neueste zuerst. Wer „Add CSV export“ auf dem Feature-Branch haben wollte, hätte `git switch -c feature/export` gebraucht.
    resources:
      - title: git-branch – Referenz
        url: https://git-scm.com/docs/git-branch

  - id: verwaister-commit
    type: output
    title: Der Commit, den niemand kennt
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      printf 'v1\n' > app.py && git add app.py && git commit -qm "Release 2.3.0"
      git tag v2.3.0
      printf 'v2\n' > app.py && git commit -qam "Add payment API"
      git switch -q --detach v2.3.0
      printf 'fix\n' > app.py && git commit -qam "Fix rounding in invoice"
      git switch -q main
      git log --all --format=%s
      echo "---"
      git branch --format='%(refname:short)'
    expected: |
      Add payment API
      Release 2.3.0
      ---
      main
    verify: true
    explanation: |
      Der Commit „Fix rounding in invoice“ entsteht im Detached HEAD: Nur `HEAD` zeigt auf ihn. Nach `git switch main` zeigt nichts mehr darauf. `git log --all` startet bei allen Refs (Branches, Tags, Remote-Tracking-Branches) und bei `HEAD` – der verwaiste Commit ist von keinem davon erreichbar und taucht nicht auf. Er existiert noch als Objekt und steht im Reflog von `HEAD`; retten ließe er sich mit `git branch hotfix 'HEAD@{1}'`.
    resources:
      - title: gitglossary · detached HEAD
        url: https://git-scm.com/docs/gitglossary#def_detached_HEAD
      - title: git-switch · --detach
        url: https://git-scm.com/docs/git-switch#Documentation/git-switch.txt---detach

  - id: bereiche-zaehlen
    type: output
    title: Zwei Punkte, drei Punkte
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      printf 'v1\n' > app.py && git add app.py && git commit -qm "Initial commit"
      git switch -qc feature/login
      printf 'form\n' > login.py && git add login.py && git commit -qm "Add login form"
      printf 'check\n' >> login.py && git commit -qam "Validate password length"
      git switch -q main
      printf 'v2\n' > app.py && git commit -qam "Fix typo in footer"
      git rev-list --count main..feature/login
      git rev-list --count feature/login..main
      git rev-list --count main...feature/login
      git log --format=%s feature/login..main
    expected: |
      2
      1
      3
      Fix typo in footer
    verify: true
    explanation: |
      Der Graph: `Initial commit` ist die gemeinsame Basis, `feature/login` hat zwei eigene Commits, `main` einen. `main..feature/login` sind die Commits, die von `feature/login` erreichbar sind, aber nicht von `main` – zwei. `feature/login..main` ist die Gegenrichtung – ein Commit, „Fix typo in footer“. `main...feature/login` ist die symmetrische Differenz, also beide Seiten ohne die gemeinsame History: drei. Genau diese Zahlen zeigt `git status` als ahead/behind, wenn `main` der Upstream wäre.
    resources:
      - title: gitrevisions · Specifying Ranges
        url: https://git-scm.com/docs/gitrevisions#_specifying_ranges

  - id: hotfix-branch-anlegen
    type: command
    title: Hotfix auf dem Release-Branch
    prompt: Lege den Branch `hotfix/2.4.1` an, der auf dem Stand von `release/2.4` beginnt, und wechsle mit **einem** Befehl direkt darauf.
    context: Du stehst auf `main`, das Arbeitsverzeichnis ist sauber. `release/2.4` existiert als lokaler Branch.
    answers:
      - git switch -c hotfix/2.4.1 release/2.4
      - git switch --create hotfix/2.4.1 release/2.4
      - git checkout -b hotfix/2.4.1 release/2.4
    output: |
      Switched to a new branch 'hotfix/2.4.1'
    explanation: |
      `git switch -c <neu> <startpunkt>` legt den Branch am Startpunkt an und hängt `HEAD` daran. Ohne Startpunkt würde der Branch bei `HEAD` beginnen – also auf `main`, und der Hotfix enthielte alles, was seit dem Release auf `main` passiert ist. `git checkout -b` ist die ältere Schreibweise mit derselben Wirkung.
    resources:
      - title: git-switch · --create
        url: https://git-scm.com/docs/git-switch#Documentation/git-switch.txt---createnew-branch

  - id: detached-sichern
    type: command
    title: Commits im Detached HEAD sichern
    prompt: Sichere die beiden neuen Commits in einem Branch `hotfix/2.3.1` und hänge `HEAD` in **einem** Befehl daran.
    context: |
      Du hast `git switch --detach v2.3.0` ausgeführt und danach zwei Commits gemacht. `git status` meldet:

      ```text
      HEAD detached from v2.3.0
      nothing to commit, working tree clean
      ```
    answers:
      - git switch -c hotfix/2.3.1
      - git switch --create hotfix/2.3.1
      - git checkout -b hotfix/2.3.1
      - git switch -c hotfix/2.3.1 HEAD
      - git checkout -b hotfix/2.3.1 HEAD
    output: |
      Switched to a new branch 'hotfix/2.3.1'
    explanation: |
      Ohne Startpunkt beginnt der neue Branch bei `HEAD` – also beim letzten deiner beiden Commits. Danach zeigt `HEAD` wieder symbolisch auf einen Branch, und weitere Commits bewegen `hotfix/2.3.1`. `git branch hotfix/2.3.1` würde die Commits ebenfalls sichern, `HEAD` bliebe aber detached. Das ist der Moment, bevor du wegwechselst – danach brauchst du den Hash aus der Warnung oder das Reflog.
    resources:
      - title: git-switch – Referenz
        url: https://git-scm.com/docs/git-switch

  - id: erster-push-upstream
    type: command
    title: Der erste Push eines Feature-Branches
    prompt: Pushe `feature/login` zum ersten Mal nach `origin` und richte dabei den Upstream ein, damit später `git push` und `git pull` ohne Argumente funktionieren. Nenne den Branch ausdrücklich.
    context: Du stehst auf `feature/login`. Der Branch existiert auf dem Server noch nicht und hat keinen Upstream.
    answers:
      - git push -u origin feature/login
      - git push --set-upstream origin feature/login
      - git push origin -u feature/login
      - git push origin --set-upstream feature/login
    output: |
      To github.com:acme/shop.git
       * [new branch]      feature/login -> feature/login
      branch 'feature/login' set up to track 'origin/feature/login'.
    explanation: |
      `-u` (lang `--set-upstream`) legt den Branch auf dem Server an und trägt `origin/feature/login` als Upstream ein. Ab dann weiß `git status`, womit es ahead/behind berechnet, und `git pull`/`git push` brauchen keine Argumente mehr. `git push -u origin HEAD` hat dieselbe Wirkung, ohne den Namen tippen zu müssen.
    resources:
      - title: git-push · --set-upstream
        url: https://git-scm.com/docs/git-push#Documentation/git-push.txt---set-upstream

  - id: release-tag
    type: gap
    title: Ein Release markieren
    prompt: Markiere den aktuellen Commit als Release `v2.4.0` – mit Autor, Datum und Nachricht, aber ohne Signatur. Übertrage danach **nur diesen** Tag zum Server und prüfe, welcher Objekttyp hinter dem Namen steckt.
    lang: bash
    code: |
      # Annotierten Tag anlegen
      git ⟦tag -a⟧ v2.4.0 -m "Release 2.4.0"
      # Genau diesen Tag pushen
      git push origin ⟦v2.4.0⟧
      # Objekttyp anzeigen – erwartet: tag
      git cat-file ⟦-t⟧ v2.4.0
    gaps:
      - label: Annotierter Tag
        hint: Der Befehl heißt wie das Objekt, die Option steht für „annotate“.
        accept: ["tag --annotate"]
      - label: Was gepusht wird
        hint: Du gibst den Namen des Tags als Refspec an.
        accept: ["refs/tags/v2.4.0", "tag v2.4.0"]
      - label: Typ anzeigen
        hint: "`cat-file` hat eine Option für **t**ype."
    explanation: |
      `-a` erzeugt ein eigenes Tag-Objekt mit Autor, Datum und Nachricht; ohne `-a` (und ohne `-m`) entstünde ein leichtgewichtiger Tag, und `git cat-file -t` gäbe `commit` aus. `git push` überträgt Tags nicht von selbst – du nennst sie einzeln oder nutzt `--follow-tags`. `git push origin --tags` würde auch jedes lokale Test-Tag veröffentlichen.
    resources:
      - title: git-tag · --annotate
        url: https://git-scm.com/docs/git-tag#Documentation/git-tag.txt---annotate
      - title: Pro Git · Tagging
        url: https://git-scm.com/book/en/v2/Git-Basics-Tagging

  - id: incoming-falsche-richtung
    type: bug
    title: Neu auf dem Server – oder doch nicht?
    prompt: |
      Das Skript soll vor dem Pull zeigen, welche Commits Kolleginnen auf `main` gepusht haben. `git status` meldet `Your branch and 'origin/main' have diverged, and have 1 and 3 different commits each`. Das Skript listet aber nur deinen eigenen, noch nicht gepushten Commit „Document setup“ – die drei neuen Commits von Aylin fehlen. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: bash
    code: |
      #!/usr/bin/env bash
      # incoming.sh – was ist neu auf origin/main?
      set -euo pipefail
      git fetch -q origin
      echo "Neu auf origin/main, noch nicht in main:"
      git log --format='%h %an: %s' origin/main..main
    lines: [6]
    fix:
      - line: 6
        answers:
          - "git log --format='%h %an: %s' main..origin/main"
          - 'git log --format="%h %an: %s" main..origin/main'
          - "git log --format='%h %an: %s' origin/main ^main"
          - "git log --format='%h %an: %s' ^main origin/main"
          - "git log --format='%h %an: %s' origin/main --not main"
    explanation: |
      `A..B` heißt „erreichbar von `B`, aber nicht von `A`“. `origin/main..main` sind also deine Commits, die der Server nicht hat – das, was ein Push hinausschicken würde. Eingehend ist die Gegenrichtung `main..origin/main`. Der `fetch` davor ist richtig und nötig: Ohne ihn wäre `origin/main` veraltet, und auch die korrigierte Zeile fände nichts.
    resources:
      - title: gitrevisions · Two-dot range
        url: https://git-scm.com/docs/gitrevisions#Documentation/gitrevisions.txt-Thetwo-dotRangeNotation

  - id: branch-vv-lesen
    type: explain
    title: Was erzählt git branch -vv?
    prompt: Du kommst aus dem Urlaub zurück, führst `git fetch --prune` aus und dann `git branch -vv`. Erkläre Zeile für Zeile, was die Ausgabe über jeden Branch sagt und was du jeweils als Nächstes tun würdest.
    lang: console
    code: |
      $ git branch -vv
        feature/login     f538617 [origin/feature/login: ahead 2] Show login errors
        hotfix/csv-export a5a28dd [origin/hotfix/csv-export: gone] Fix CSV export
      * main              85c5b29 [origin/main: behind 3] Initial commit
        spike/redis-cache 23b503f Try Redis cache
    points:
      - "`feature/login` hat zwei lokale Commits, die noch nicht auf dem Server sind: pushen (bzw. vorher prüfen, ob sie fertig sind)."
      - "`gone` heißt: Der Upstream-Branch wurde auf dem Server gelöscht – meist nach dem Merge des Pull Requests. Mit `git branch -d` aufräumen; verweigert `-d`, erst prüfen, was fehlt."
      - "`main` ist 3 Commits hinter `origin/main` und hat keine eigenen: `git pull` spult per Fast-Forward vor."
      - "`spike/redis-cache` hat keinen Upstream (keine eckigen Klammern) – er existiert nur lokal und ist nirgends gesichert."
      - Die Zahlen beruhen auf dem letzten `fetch`; ohne ihn wären ahead/behind veraltet.
    explanation: |
      In eckigen Klammern steht der Upstream und der Vergleich mit ihm. `feature/login` ist zwei Commits voraus – die Arbeit liegt nur auf meinem Rechner, ich würde sie pushen. `hotfix/csv-export` zeigt `gone`: Der Branch wurde auf dem Server gelöscht, vermutlich nach dem Merge. Ich lösche ihn lokal mit `git branch -d`; lehnt Git das ab, gibt es Commits, die nie gemergt wurden, und ich sehe mir `git log origin/main..hotfix/csv-export` an. `main` ist drei Commits hinter dem Server und hat nichts Eigenes, also bringt `git pull` einen Fast-Forward. `spike/redis-cache` hat keinen Upstream – ein reines Experiment, das nur lokal existiert. Alle Angaben stammen aus dem Vergleich lokaler Refs, deshalb war der `fetch` vorher entscheidend.
    resources:
      - title: git-branch · -vv
        url: https://git-scm.com/docs/git-branch#Documentation/git-branch.txt--vv
      - title: git-fetch · --prune
        url: https://git-scm.com/docs/git-fetch#Documentation/git-fetch.txt---prune

  - id: labor-detached-commits
    type: practice
    title: "Labor: Der Hotfix ist verschwunden"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Es spielt den Freitagnachmittag aus der Lektion nach: Jemand hat auf dem Stand von `v2.3.0` die Rundung korrigiert, zwei Commits gemacht und ist zurück auf `main` gegangen. Jetzt findet `git log --all` die Korrektur nicht mehr.

      Lege einen Branch `hotfix/2.3.1` an, der auf den **letzten** der beiden verlorenen Commits zeigt. `main` soll unverändert bleiben. Prüfe am Ende mit `git log --format=%s hotfix/2.3.1`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q shop && cd shop
      printf 'total = round(summe, 1)\n' > invoice.py
      git add invoice.py && git commit -qm "Release 2.3.0"
      git tag v2.3.0
      printf 'total = round(summe, 1)\nPAYMENT_API = True\n' > invoice.py
      git commit -qam "Add payment API"
      # Schnell den alten Stand ansehen und dort „kurz“ etwas reparieren
      git switch -q --detach v2.3.0
      printf 'total = round(summe, 2)\n' > invoice.py
      git commit -qam "Fix rounding in invoice"
      printf 'total = round(summe, 2)\n# Cent-genau seit Ticket SHOP-412\n' > invoice.py
      git commit -qam "Document rounding rule"
      # … und zurück auf main
      git switch -q main
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q shop && cd shop
      printf 'total = round(summe, 1)\n' > invoice.py
      git add invoice.py && git commit -qm "Release 2.3.0"
      git tag v2.3.0
      printf 'total = round(summe, 1)\nPAYMENT_API = True\n' > invoice.py
      git commit -qam "Add payment API"
      # Schnell den alten Stand ansehen und dort „kurz“ etwas reparieren
      git switch -q --detach v2.3.0
      printf 'total = round(summe, 2)\n' > invoice.py
      git commit -qam "Fix rounding in invoice"
      printf 'total = round(summe, 2)\n# Cent-genau seit Ticket SHOP-412\n' > invoice.py
      git commit -qam "Document rounding rule"
      # … und zurück auf main
      git switch -q main
      # Reparatur: HEAD@{1} = wo HEAD vor dem letzten Wechsel stand
      git reflog -3
      git branch hotfix/2.3.1 'HEAD@{1}'
      # Kontrolle
      test "$(git log -1 --format=%s hotfix/2.3.1)" = "Document rounding rule"
      test "$(git rev-list --count v2.3.0..hotfix/2.3.1)" = 2
      git merge-base --is-ancestor v2.3.0 hotfix/2.3.1
      test "$(git log -1 --format=%s main)" = "Add payment API"
    checklist:
      - "`git log --format=%s hotfix/2.3.1` zeigt „Document rounding rule“, „Fix rounding in invoice“ und „Release 2.3.0“."
      - "`git log --format=%s main` ist unverändert: „Add payment API“, „Release 2.3.0“."
      - "`git log --all --format=%s` zeigt die beiden Hotfix-Commits wieder."
      - Du hast den Commit über den Hash aus der Warnung von `git switch` oder über `git reflog` bzw. `HEAD@{1}` gefunden und kannst erklären, warum er vorher unsichtbar war.
    verify: true
    explanation: |
      Die Commits waren nie weg – ihnen fehlte nur ein Name. `git log --all` beginnt bei Refs und `HEAD`, und keine davon zeigte noch auf sie. Beim Wegwechseln hat Git den Hash in einer Warnung genannt; `git branch <name> <hash>` hätte gereicht. Das Reflog merkt sich jede Position von `HEAD`: `HEAD@{0}` ist `main`, `HEAD@{1}` der Commit davor – der letzte Hotfix-Commit. Das funktioniert, solange du `HEAD` nicht weiter bewegt hast; sonst suchst du den Eintrag in `git reflog` heraus. Die Lehre für die Praxis: Wer im Detached HEAD committet, legt sofort mit `git switch -c` einen Branch an.
    resources:
      - title: git-reflog – Referenz
        url: https://git-scm.com/docs/git-reflog
      - title: gitrevisions · @{n}
        url: https://git-scm.com/docs/gitrevisions#Documentation/gitrevisions.txt-refnamenegmaster1

  - id: labor-auseinandergelaufen
    type: practice
    title: "Labor: Push abgelehnt – ahead und behind"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Es simuliert einen Server (`origin.git`) und zwei Klone: Alice pusht zwei Commits, Bob hat parallel einen eigenen Commit gemacht. Bobs Push wird abgelehnt.

      Arbeite in `bob`: Diagnostiziere zuerst, wie viele Commits Bob voraus und hinterher ist. Bring dann Bobs Commit auf den Server, **ohne Merge-Commit**, sodass die History linear bleibt. Prüfe am Ende mit `git status -sb` und `git log --graph --format=%s`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q --bare origin.git
      git clone -q origin.git alice 2>/dev/null
      printf 'def health():\n    return "ok"\n' > alice/api.py
      git -C alice add api.py
      git -C alice commit -qm "Add health endpoint"
      git -C alice push -q origin main
      git clone -q origin.git bob
      # Alice arbeitet weiter und pusht zwei Commits
      printf 'LOG_LEVEL = "info"\n' > alice/config.py
      git -C alice add config.py && git -C alice commit -qm "Add log level setting"
      printf 'TIMEOUT = 30\n' >> alice/config.py
      git -C alice commit -qam "Add request timeout" && git -C alice push -q
      # Bob hat parallel einen eigenen Commit gemacht
      printf '# Shop-API\n' > bob/README.md
      git -C bob add README.md && git -C bob commit -qm "Document setup"
      git -C bob push -q 2>/dev/null || echo "Push von Bob wurde abgelehnt."
      cd bob
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q --bare origin.git
      git clone -q origin.git alice 2>/dev/null
      printf 'def health():\n    return "ok"\n' > alice/api.py
      git -C alice add api.py
      git -C alice commit -qm "Add health endpoint"
      git -C alice push -q origin main
      git clone -q origin.git bob
      # Alice arbeitet weiter und pusht zwei Commits
      printf 'LOG_LEVEL = "info"\n' > alice/config.py
      git -C alice add config.py && git -C alice commit -qm "Add log level setting"
      printf 'TIMEOUT = 30\n' >> alice/config.py
      git -C alice commit -qam "Add request timeout" && git -C alice push -q
      # Bob hat parallel einen eigenen Commit gemacht
      printf '# Shop-API\n' > bob/README.md
      git -C bob add README.md && git -C bob commit -qm "Document setup"
      git -C bob push -q 2>/dev/null || echo "Push von Bob wurde abgelehnt."
      cd bob
      # Diagnose: erst fetchen, dann vergleichen
      git fetch -q
      git status -sb | head -1
      git rev-list --left-right --count main...origin/main
      # Reparatur: eigenen Commit hinter die neuen Commits setzen, dann pushen
      git pull -q --rebase
      git push -q
      # Kontrolle
      test "$(git rev-list --left-right --count main...origin/main)" = "$(printf '0\t0')"
      test "$(git rev-list --count --merges main)" = 0
      test "$(git log -1 --format=%s origin/main)" = "Document setup"
      test "$(git -C ../origin.git rev-list --count main)" = 4
    checklist:
      - Vor der Reparatur zeigt `git status -sb` nach `git fetch` die Zeile `## main...origin/main [ahead 1, behind 2]`.
      - "`git log --graph --format=%s` zeigt eine gerade Linie: „Document setup“ über „Add request timeout“, „Add log level setting“ und „Add health endpoint“."
      - "`git status -sb` meldet danach `## main...origin/main` ohne ahead/behind."
      - Es gibt keinen Merge-Commit (`git rev-list --count --merges main` gibt `0` aus).
    verify: true
    explanation: |
      Die Ablehnung war richtig: Ein Push darf den Branch auf dem Server nur vorspulen, und Bobs `main` enthielt Alices zwei Commits nicht. Vor dem `fetch` wusste Bobs Repository davon nichts – `git status` meldete nur „ahead 1“. Erst nach dem `fetch` zeigt es die Divergenz „ahead 1, behind 2“. `git pull --rebase` holt die neuen Commits und setzt Bobs Commit neu obendrauf (mit neuem Hash); danach ist der Push ein Fast-Forward. Ein normales `git pull` hätte je nach Konfiguration einen Merge-Commit erzeugt oder mit „Need to specify how to reconcile divergent branches“ abgebrochen. Warum Rebase hier passt und wann nicht, vertieft das Modul [Rebase](/git/rebase).
    resources:
      - title: git-pull · --rebase
        url: https://git-scm.com/docs/git-pull
      - title: Pro Git · Remote Branches
        url: https://git-scm.com/book/en/v2/Git-Branching-Remote-Branches

  - id: labor-falscher-upstream
    type: practice
    title: "Labor: Der Branch mit dem falschen Upstream"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Ein neuer Feature-Branch `feature/login` hat einen Commit, aber `git push` scheitert mit einer langen Meldung, und `git status` behauptet, der Branch sei „ahead of 'origin/main'“. Finde mit `git branch -vv` heraus, was los ist.

      Sorge dafür, dass `feature/login` auf dem Server als eigener Branch existiert und `origin/feature/login` sein Upstream ist. `main` auf dem Server darf sich **nicht** ändern. Prüfe am Ende mit `git branch -vv` und `git -C ../origin.git log --format=%s main`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q --bare origin.git
      git clone -q origin.git app 2>/dev/null
      cd app
      printf 'def login(user):\n    pass\n' > auth.py
      git add auth.py && git commit -qm "Add auth module"
      git push -q origin main
      # Neuer Feature-Branch – direkt vom Remote-Tracking-Branch abgezweigt
      git switch -q -c feature/login origin/main
      printf 'def login(user):\n    return check_password(user)\n' > auth.py
      git commit -qam "Check password on login"
      git push -q 2>/dev/null || echo "git push ist fehlgeschlagen."
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q --bare origin.git
      git clone -q origin.git app 2>/dev/null
      cd app
      printf 'def login(user):\n    pass\n' > auth.py
      git add auth.py && git commit -qm "Add auth module"
      git push -q origin main
      # Neuer Feature-Branch – direkt vom Remote-Tracking-Branch abgezweigt
      git switch -q -c feature/login origin/main
      printf 'def login(user):\n    return check_password(user)\n' > auth.py
      git commit -qam "Check password on login"
      git push -q 2>/dev/null || echo "git push ist fehlgeschlagen."
      # Diagnose: der Upstream ist origin/main
      git branch -vv
      # Reparatur: eigenen Branch auf dem Server anlegen und Upstream neu setzen
      git push -q -u origin feature/login
      # Kontrolle
      test "$(git rev-parse --abbrev-ref '@{u}')" = origin/feature/login
      test "$(git -C ../origin.git rev-parse feature/login)" = "$(git rev-parse HEAD)"
      test "$(git -C ../origin.git log -1 --format=%s main)" = "Add auth module"
    checklist:
      - "`git branch -vv` zeigt vor der Reparatur `[origin/main: ahead 1]` bei `feature/login` – das ist die Ursache."
      - "`git branch -vv` zeigt danach `[origin/feature/login]` ohne ahead/behind."
      - "`git -C ../origin.git log --format=%s main` zeigt weiterhin nur „Add auth module“."
      - Du hast **nicht** den vorgeschlagenen Befehl `git push origin HEAD:main` benutzt und kannst erklären, was er angerichtet hätte.
    verify: true
    explanation: |
      `git switch -c feature/login origin/main` zweigt von einem Remote-Tracking-Branch ab und trägt ihn deshalb automatisch als Upstream ein. Mit der Standardeinstellung `push.default=simple` weigert sich `git push`, einen Branch in einen Upstream mit anderem Namen zu pushen – ein Schutz. Die Fehlermeldung schlägt `git push origin HEAD:main` vor; das hätte das unfertige Feature direkt auf `main` gelegt. `git push -u origin feature/login` (oder `git push -u origin HEAD`) legt stattdessen den gleichnamigen Branch auf dem Server an und ersetzt den Upstream. Vorbeugen lässt sich mit `git switch -c feature/login main` nach einem `git pull` oder mit `branch.autoSetupMerge=simple`.
    resources:
      - title: git-push · --set-upstream
        url: https://git-scm.com/docs/git-push#Documentation/git-push.txt---set-upstream
      - title: git-config · branch.autoSetupMerge
        url: https://git-scm.com/docs/git-config#Documentation/git-config.txt-branchautoSetupMerge
