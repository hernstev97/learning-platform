id: branches-head
title: Branches, HEAD und Remotes
level: 1
minutes: 160
summary: Branches, Tags und HEAD sind Zeiger auf Commits – wer das verinnerlicht, rettet Commits aus einem Detached HEAD, liest ahead/behind richtig und weiß, was fetch, pull und push mit welchem Zeiger tun.
goals:
  - Du erklärst Branches als bewegliche Zeiger und HEAD als symbolische Ref und sagst vorher, welcher Zeiger sich bei `commit`, `switch` und `branch` bewegt.
  - Du erkennst einen Detached HEAD, weißt, wann er entsteht, und rettest darin entstandene Commits mit `git switch -c` oder über den angezeigten Hash.
  - Du verwaltest Branches mit `git branch -v/-vv/-d/-D/-m/--merged` und setzt leichtgewichtige und annotierte Tags gezielt ein und pushst sie.
  - Du unterscheidest Branch, Remote-Tracking-Branch und Upstream, liest ahead/behind und entscheidest zwischen `fetch`, `pull` und `push`.
  - Du beantwortest mit `A..B` und `A...B` Fragen wie „Was kommt beim Pull herein?“ und „Was habe ich noch nicht gepusht?“.
