id: cherry-pick-revert
title: Cherry-pick und Revert
level: 2
minutes: 150
summary: Einzelne Änderungen gezielt auf einen anderen Branch übertragen und veröffentlichte Commits zurücknehmen, ohne die History umzuschreiben – inklusive Backports, doppelter Commits und der Falle beim Revert von Merges.
goals:
  - Du überträgst einzelne Commits und Bereiche mit `git cherry-pick` und sagst vorher, welche Commits `A..B` und `A^..B` umfassen.
  - Du portierst einen Hotfix mit `-x` auf einen Release-Branch zurück und löst Konflikte mit `--continue`, `--skip` und `--abort`.
  - Du findest mit `git cherry` und `git log --cherry-pick` heraus, welche Änderungen schon übertragen sind.
  - Du nimmst veröffentlichte Commits und Merges mit `git revert` zurück und führst ein zurückgenommenes Feature korrekt wieder ein.
  - Du ordnest `format-patch`, `am` und `apply` als Weg für Änderungen außerhalb von Branches ein.
