lesson: |
  Version 2.4 deiner Web-App läuft beim Kunden. Auf `main` hat eine Kollegin gerade einen Fehler in der Session-Prüfung behoben – derselbe Fehler steckt im Release. `main` enthält aber zwanzig weitere Commits mit halbfertigen Features, die in kein Patch-Release gehören. Du brauchst genau diesen einen Commit auf `release/2.4`. Eine Stunde später zeigt sich, dass das gestern gemergte Export-Feature Umlaute zerstört. `main` ist gepusht, zehn Leute haben es gepullt. Du musst das Feature zurücknehmen, ohne die History umzuschreiben.

  Für beides gibt es ein Werkzeug: [`git cherry-pick`](https://git-scm.com/docs/git-cherry-pick) überträgt die Änderung eines Commits auf einen anderen Branch, [`git revert`](https://git-scm.com/docs/git-revert) erzeugt einen Commit, der die Änderung eines anderen aufhebt. Beide arbeiten nach demselben Prinzip. Wer es verstanden hat, sagt auch ihre Fallen vorher.

  ## Cherry-pick: eine Änderung neu anwenden

  Ein Commit speichert einen Snapshot, keinen Diff (siehe [Das Datenmodell](/git/datenmodell)). Die *Änderung* eines Commits ergibt sich erst aus dem Vergleich mit seinem Elternteil. Genau diese Änderung überträgt `git cherry-pick`:

  ```text
  Vorher:
            F---G---H  main
           /
      A---B---C  release/2.4

  git switch release/2.4
  git cherry-pick G

  Nachher:
            F---G---H  main
           /
      A---B---C---G'  release/2.4
  ```

  `G'` ist ein **neuer Commit**. Er hat dieselbe Nachricht, denselben Autor und dasselbe Autorendatum wie `G`, aber einen anderen Elternteil (`C` statt `F`), einen anderen Snapshot und dich als Committer – also einen anderen Hash. `G` bleibt unverändert auf `main`. Nichts wird verschoben.

  Technisch ist Cherry-pick ein Drei-Wege-Merge mit ungewöhnlicher Basis: Basis ist `F`, der Elternteil von `G`. Die eine Seite ist `HEAD` (hier `C`), die andere `G`. Git übernimmt also alles, was sich von `F` nach `G` geändert hat, und legt es auf `C`. Was `F` oder frühere Commits auf `main` eingeführt haben, kommt nicht mit. Baut der Fix auf solchem Code auf, entsteht ein Konflikt.

  ```console
  $ git switch release/2.4
  Switched to branch 'release/2.4'
  $ git cherry-pick 4e1a9c2
  [release/2.4 7d2f0b3] Fix off-by-one in session expiry
   Date: Mon Sep 28 16:42:10 2026 +0200
   1 file changed, 1 insertion(+), 1 deletion(-)
  ```

  Die Zeile `Date:` zeigt das Autorendatum des Originals. Committer und Commit-Datum sind neu.

  > [!MERKE]
  > Cherry-pick kopiert eine Änderung, nicht einen Commit. Das Ergebnis ist immer ein neuer Commit mit neuem Hash. Git speichert keine Verbindung zum Original.

  ### Bereiche, `-x` und `-n`

  `git cherry-pick` nimmt mehrere Commits oder einen Bereich. Bereiche folgen den Regeln aus [gitrevisions](https://git-scm.com/docs/gitrevisions#_specifying_ranges): `A..B` heißt „alles, was von `B` aus erreichbar ist, aber nicht von `A`“. `A` selbst gehört also **nicht** dazu.

  ```bash
  git cherry-pick 4e1a9c2                  # ein Commit
  git cherry-pick 4e1a9c2 8d0b3f5          # mehrere, in dieser Reihenfolge
  git cherry-pick 4e1a9c2..c7a2e19         # ohne 4e1a9c2, bis einschließlich c7a2e19
  git cherry-pick 4e1a9c2^..c7a2e19        # mit 4e1a9c2
  ```

  Bei Bereichen wendet Git die Commits vom ältesten zum neuesten an. Merge-Commits im Bereich brauchen die Option `-m` (dazu unten mehr). Für Backports nimmst du besser nur die linearen Fix-Commits.

  Zwei Optionen brauchst du oft:

  - **`-x`** hängt an die Commit-Nachricht eine Leerzeile und `(cherry picked from commit 4e1a9c2b7f0d3e8a1c6b5d4e3f2a1b0c9d8e7f6a)` mit dem vollen Hash an. Wer später auf `release/2.4` den Commit sieht, findet das Original auf `main`. Das lohnt sich nur, wenn das Original in einem geteilten Branch liegt – ein Verweis auf einen privaten Commit führt ins Leere ([git cherry-pick · -x](https://git-scm.com/docs/git-cherry-pick#Documentation/git-cherry-pick.txt--x)).
  - **`-n`** (`--no-commit`) wendet die Änderungen nur auf Index und Arbeitsverzeichnis an. So fasst du mehrere Commits zu einem Backport-Commit zusammen: `git cherry-pick -n 4e1a9c2 8d0b3f5`, danach `git commit`.

  Steckt eine Änderung schon im Ziel – etwa weil sie jemand vorher übertragen hat –, wird der neue Commit leer. Git hält dann an und meldet `The previous cherry-pick is now empty, possibly due to conflict resolution.` Mit `git cherry-pick --skip` lässt du ihn aus. Die Option `--empty=drop` verwirft solche Commits von vornherein.

  ## Konflikte beim Cherry-pick

  Setzt der Fix auf Code auf, der im Release anders aussieht, hält Git mitten im Cherry-pick an:

  ```console
  $ git cherry-pick -x 4e1a9c2
  Auto-merging session.py
  CONFLICT (content): Merge conflict in session.py
  error: could not apply 4e1a9c2... Fix off-by-one in session expiry
  hint: After resolving the conflicts, mark them with
  hint: "git add/rm <pathspec>", then run
  hint: "git cherry-pick --continue".
  hint: You can instead skip this commit with "git cherry-pick --skip".
  hint: To abort and get back to the state before "git cherry-pick",
  hint: run "git cherry-pick --abort".
  hint: Disable this message with "git config set advice.mergeConflict false"
  $ git status --short
  UU session.py
  ```

  Die Marker zeigen oben `HEAD` – den Branch, auf dem du stehst – und unten den übertragenen Commit:

  ```text
  def is_expired(session, now):
  <<<<<<< HEAD
      return now > session.created + 3600
  =======
      return now >= session.created + SESSION_TTL
  >>>>>>> 4e1a9c2 (Fix off-by-one in session expiry)
  ```

  Anders als beim Rebase ist „ours“ hier das, was du erwartest: dein aktueller Branch. Die richtige Auflösung ist oft keine der beiden Seiten, sondern die Absicht des Fixes im Code des Ziels – hier `now >= session.created + 3600`, denn die Konstante `SESSION_TTL` gibt es im Release nicht. Danach hast du drei Wege:

  - `git add session.py` und `git cherry-pick --continue`: Git erstellt den Commit mit der ursprünglichen Nachricht, inklusive `-x`-Zeile.
  - `git cherry-pick --skip`: diesen Commit auslassen und mit dem nächsten des Bereichs weitermachen.
  - `git cherry-pick --abort`: alles zurück auf den Stand vor dem Befehl, auch bereits übertragene Commits eines Bereichs.

  Solange der Konflikt besteht, zeigt die Referenz `CHERRY_PICK_HEAD` auf den Commit, den Git gerade anwendet. Konfliktmarker, `zdiff3` und Werkzeuge vertieft das Modul [Konflikte lösen](/git/konflikte).

  ## Backports und doppelte Commits erkennen

  In den meisten Teams gilt für Hotfixes: **erst auf `main`, dann zurückportieren** („upstream first“). So kann der Fehler in der nächsten Version nicht wieder auftauchen, weil jemand vergessen hat, ihn nach `main` zu bringen.

  ```bash
  git switch release/2.4
  git pull --ff-only
  git cherry-pick -x 4e1a9c2
  pytest                           # den Release-Branch testen, nicht main
  git push origin release/2.4
  ```

  > [!PRAXIS]
  > In Projekten mit mehreren gepflegten Releases (`release/2.3`, `release/2.4`) bekommt jeder Backport einen eigenen kleinen Pull Request mit `-x`-Vermerk. Viele Teams automatisieren das: Ein Label wie `backport release/2.4` am Original-PR startet einen Bot, der den Cherry-pick versucht und bei Konflikten einen Menschen fragt. Im Review fällt ein Backport ohne Herkunftsvermerk sofort auf.

  Weil Cherry-pick neue Hashes erzeugt, zählt `git log release/2.4..main` den übertragenen Fix weiterhin als „fehlt noch“. Die Frage „Welche Änderungen von `main` sind schon im Release?“ beantwortet Git über die **Patch-ID**: einen Hash über den Diff eines Commits, bei dem Zeilennummern und Leerraum keine Rolle spielen ([git patch-id](https://git-scm.com/docs/git-patch-id)). Zwei Commits mit gleicher Änderung haben dieselbe Patch-ID, auch wenn Hash, Datum und Nachricht verschieden sind.

  ```console
  $ git cherry -v release/2.4 main
  + eddcd42a005e835d035e45039f8a24f5e8b6e510 Add CSV export
  - 4e1a9c2b7f0d3e8a1c6b5d4e3f2a1b0c9d8e7f6a Fix off-by-one in session expiry
  + 3f70f4b1974853d579ca17e8198a96a06b03ed51 Add dark mode
  $ git log --cherry-pick --right-only --format=%s release/2.4...main
  Add dark mode
  Add CSV export
  ```

  [`git cherry`](https://git-scm.com/docs/git-cherry) listet die Commits aus `main`, die es in `release/2.4` nicht gibt, vom ältesten zum neuesten. `-` heißt „eine gleichwertige Änderung ist schon im Release“, `+` heißt „fehlt noch“. `git log --cherry-pick` blendet bei einem symmetrischen Bereich `A...B` Commits aus, deren Änderung auf beiden Seiten vorkommt. `--right-only` zeigt nur die rechte Seite ([git log · --cherry-pick](https://git-scm.com/docs/git-log#Documentation/git-log.txt---cherry-pick)). Musste ein Backport wegen eines Konflikts angepasst werden, ändert sich sein Diff und damit die Patch-ID. Dann hilft nur noch der `-x`-Vermerk.

  ## Revert: rückgängig machen, ohne die History umzuschreiben

  `git revert` ist das Gegenstück: Es berechnet die Änderung eines Commits, kehrt sie um und legt das Ergebnis als **neuen Commit** oben auf den aktuellen Branch.

  ```text
  Vorher:   A---B---C---D  main          C hat den Fehler eingeführt

  git revert C

  Nachher:  A---B---C---D---C'  main     C' = Revert "…", hebt C auf
  ```

  ```console
  $ git revert --no-edit 5ef577e
  [main 1e45f5a] Revert "Raise timeout"
   Date: Tue Sep 29 10:14:03 2026 +0200
   1 file changed, 1 insertion(+), 1 deletion(-)
  $ git log -1 --format=%B
  Revert "Raise timeout"

  This reverts commit 5ef577eb1c279811cbb2370a7f5fecc5898c1a1c.
  ```

  Ohne `--no-edit` öffnet Git den Editor, damit du begründest, *warum* zurückgenommen wird – in echten Projekten solltest du das tun. `D` bleibt unberührt, auch wenn es später als `C` entstanden ist. Mehrere Commits nimmt Git in der Reihenfolge des Bereichs zurück, bei `git revert HEAD~3..HEAD` also vom neuesten zum ältesten. Mit `-n` sammelst du alle Umkehrungen in einem einzigen Commit.

  Der entscheidende Unterschied zu `git reset`: Revert fügt hinzu, statt zu entfernen. Alle, die `main` schon gepullt haben, bekommen den Revert-Commit als gewöhnlichen neuen Commit. Reset dagegen setzt den Branch zurück und schreibt die History um. Für geteilte Branches ist das tabu (Details in [Reset und Reflog](/git/reset-reflog)).

  > [!INTERVIEW]
  > „Wie machst du einen fehlerhaften Commit rückgängig, der schon auf `main` gepusht ist?“ – Mit `git revert`. Das erzeugt einen neuen Commit, der die Änderung umkehrt. Die History der anderen bleibt gültig, und im Log ist nachvollziehbar, was wann und warum zurückgenommen wurde. `git reset` mit anschließendem Force-Push würde allen anderen die Grundlage ihrer Arbeit entziehen. Reset nutze ich nur für lokale, noch nicht geteilte Commits.

  ## Merges zurücknehmen und wieder einführen

  Ein Merge-Commit hat zwei Eltern. „Die Änderung des Merges“ ist deshalb nicht eindeutig: gegenüber welchem Elternteil? Ohne Angabe verweigert Git den Revert:

  ```console
  $ git revert 9f2c4e1
  error: commit 9f2c4e1a7b3d5f0e2c4a6b8d0f1e3c5a7b9d2f4e is a merge but no -m option was given.
  fatal: revert failed
  $ git revert -m 1 --no-edit 9f2c4e1
  [main 0449c40] Revert "Merge branch 'feature/export'"
   Date: Tue Sep 29 11:02:37 2026 +0200
   1 file changed, 3 deletions(-)
  ```

  `-m 1` wählt den ersten Elternteil als Hauptlinie – bei einem Merge in `main` ist das `main` selbst. Git macht damit alles rückgängig, was der zweite Elternteil, also der Feature-Branch, eingebracht hat ([git revert · -m](https://git-scm.com/docs/git-revert#Documentation/git-revert.txt---mainlineparent-number)).

  Jetzt kommt die Falle. Der Revert hebt den *Inhalt* auf, nicht die *History*: Die Commits des Features bleiben Vorfahren von `main`. Behebt das Team den Fehler auf dem Feature-Branch und mergt erneut, berücksichtigt Git nur die Commits seit dem letzten Merge – also nur den Fix. Der ursprüngliche Feature-Code bleibt draußen, und der Merge meldet trotzdem Erfolg.

  ```text
            E1-----------E2        feature/export   (E2 = Fix)
           /  \            \
      A---B----M-----R------M2     main

  M  = Merge des Features       R  = git revert -m 1 M
  M2 = neuer Merge: bringt nur E2 – E1 gilt als längst gemergt
  ```

  Die Lösung: **den Revert reverten**, bevor du erneut mergst. `git revert --no-edit 0449c40` (der Revert-Commit von oben) stellt den Inhalt des Features wieder her – Git nennt diesen Commit `Reapply "Merge branch 'feature/export'"`. Danach bringt `git merge feature/export` nur noch den Fix dazu. Die Hintergründe beschreibt Linus Torvalds in [How to revert a faulty merge](https://git-scm.com/docs/howto/revert-a-faulty-merge), das Pro-Git-Buch im Abschnitt [Reverse the commit](https://git-scm.com/book/en/v2/Git-Tools-Advanced-Merging#_reverse_commit).

  > [!WARNING]
  > Ein zurückgenommener Merge ist eine Mine. Schreib in die Revert-Nachricht, dass das Feature vor einem erneuten Merge per Revert des Reverts zurückgeholt werden muss. Sonst mergt in drei Wochen jemand den Branch und wundert sich, warum die Hälfte fehlt.

  ## Patches ohne gemeinsames Repository

  Cherry-pick setzt voraus, dass der Commit im selben Repository liegt. Zwischen Repositorys ohne gemeinsames Remote reist eine Änderung als Patch-Datei. `git format-patch` schreibt Commits als E-Mail-artige Dateien mit Autor, Datum und Nachricht. [`git am`](https://git-scm.com/docs/git-am) wendet sie im Ziel als Commits an und übernimmt Autor und Nachricht. `git apply` wendet dagegen nur den Diff auf das Arbeitsverzeichnis an, ohne Commit – passend für die Ausgabe von `git diff`.

  ```bash
  git format-patch -1 4e1a9c2            # schreibt 0001-Fix-off-by-one-in-session-expiry.patch
  # im anderen Repository:
  git apply --check 0001-Fix-off-by-one-in-session-expiry.patch   # passt der Patch?
  git am 0001-Fix-off-by-one-in-session-expiry.patch              # als Commit anwenden
  ```

  Mit GitHub oder GitLab brauchst du das selten. Projekte wie der Linux-Kernel und Git selbst arbeiten bis heute so ([Pro Git · Patches from Email](https://git-scm.com/book/en/v2/Distributed-Git-Maintaining-a-Project#_patches_from_email)).

  ## Häufige Fehler

  - **Commit auf dem falschen Branch.** Du hast auf `main` committet statt auf `feature/login-limit`. Solange nichts gepusht ist: `git switch feature/login-limit`, `git cherry-pick main`, zurück auf `main` und dort `git reset --hard HEAD~1`. Der letzte Schritt schreibt `main` um. Das ist nur lokal in Ordnung; wie Reset genau arbeitet, klärt [Reset und Reflog](/git/reset-reflog).
  - **`A..B` statt `A^..B`.** Der erste Commit des Bereichs fehlt. Prüfe vorher mit `git log --format=%s A..B`, welche Commits der Bereich umfasst.
  - **Cherry-pick als Dauerlösung.** Wer regelmäßig Commits zwischen langlebigen Branches hin- und herkopiert, erzeugt dieselbe Änderung mehrfach mit verschiedenen Hashes. Spätere Merges werden konfliktreich, die History unlesbar. Für ganze Branches sind [Merge](/git/merge) und [Rebase](/git/rebase) das Werkzeug.
  - **Revert eines Merges ohne `-m`.** Git bricht mit `is a merge but no -m option was given` ab. Fast immer ist `-m 1` gemeint.
  - **Erneuter Merge nach einem Revert.** Der Merge meldet Erfolg, aber der ursprüngliche Code fehlt – oder es entstehen Konflikte in Code, der „doch schon drin war“. Erst den Revert reverten, dann mergen.
  - **Reset statt Revert auf geteilten Branches.** Nach `git reset --hard` und Force-Push haben alle anderen Commits, die es auf dem Server nicht mehr gibt. Auf geteilten Branches gilt: `git revert`.

  ## Zusammenfassung

  - `git cherry-pick C` wendet die Änderung von `C` (Diff zum Elternteil) als neuen Commit auf `HEAD` an. Das Original bleibt, der Hash ist neu.
  - `A..B` schließt `A` aus, `A^..B` schließt ihn ein. Bereiche wendet Git vom ältesten zum neuesten Commit an.
  - `-x` vermerkt die Herkunft, `-n` sammelt Änderungen ohne Commit. Bei Konflikten: auflösen, `git add`, `--continue` – oder `--skip` bzw. `--abort`.
  - Hotfixes landen zuerst auf `main` und werden dann mit `-x` auf `release/*` zurückportiert.
  - `git cherry` und `git log --cherry-pick` erkennen übertragene Änderungen über die Patch-ID.
  - `git revert` hebt einen Commit durch einen neuen, inversen Commit auf und ist die richtige Wahl für geteilte Branches.
  - Merges nimmst du mit `git revert -m 1` zurück. Vor einem erneuten Merge muss der Revert selbst revertet werden.
  - `format-patch` und `am` übertragen Commits als Dateien, `apply` nur Diffs.
exercises:
  - id: was-cherry-pick-erzeugt
    type: choice
    title: Kopie oder Umzug?
    prompt: |
      Du stehst auf `release/2.4` und führst `git cherry-pick 4e1a9c2` aus. `4e1a9c2` liegt auf `main`. Welche Aussage stimmt?
    options:
      - text: Auf `release/2.4` entsteht ein neuer Commit mit derselben Nachricht, aber einem anderen Hash. `4e1a9c2` bleibt auf `main`.
        correct: true
        why: Neuer Elternteil, neuer Snapshot und neuer Committer ergeben einen neuen Hash. Das Original wird nicht angefasst.
      - text: Der Commit `4e1a9c2` wird von `main` nach `release/2.4` verschoben.
        correct: false
        why: Cherry-pick verschiebt nichts. `main` sieht nach dem Befehl genauso aus wie vorher.
      - text: "`release/2.4` bekommt den kompletten Snapshot von `4e1a9c2`, also auch alle früheren Änderungen von `main`."
        correct: false
        why: Übertragen wird nur die Änderung gegenüber dem Elternteil von `4e1a9c2`. Frühere Commits von `main` kommen nicht mit – genau deshalb gibt es Konflikte, wenn der Fix auf ihnen aufbaut.
      - text: Git merkt sich, dass beide Commits zusammengehören, und verhindert dadurch spätere Konflikte beim Mergen.
        correct: false
        why: Git speichert keine Verbindung. Nur `-x` schreibt einen Vermerk in die Nachricht, und `git cherry` erkennt gleiche Änderungen nachträglich über die Patch-ID.
    explanation: |
      Cherry-pick ist ein Drei-Wege-Merge mit dem Elternteil des gepickten Commits als Basis. Das Ergebnis ist ein neuer Commit auf dem aktuellen Branch. Weil sich Elternteil, Snapshot und Committer unterscheiden, hat er zwangsläufig einen anderen Hash – für Git sind es zwei unabhängige Commits.
    resources:
      - title: git-cherry-pick – Beschreibung
        url: https://git-scm.com/docs/git-cherry-pick#_description

  - id: backport-reihenfolge
    type: order
    title: Ein Backport mit Hindernis
    prompt: |
      Der Hotfix `4e1a9c2` auf `main` soll nach `release/2.4`. Du weißt schon, dass `session.py` im Release anders aussieht und ein Konflikt entstehen wird. Bring die Schritte in die richtige Reihenfolge.
    lang: bash
    lines: |
      git switch release/2.4
      git pull --ff-only
      git cherry-pick -x 4e1a9c2
      # Konflikt in session.py im Editor auflösen
      git add session.py
      git cherry-pick --continue
      git push origin release/2.4
    explanation: |
      Zuerst wechselst du auf den Zielbranch und bringst ihn auf den Stand des Servers – sonst überträgst du auf einen veralteten Branch und der Push scheitert. Dann überträgst du den Fix mit `-x`. Der Konflikt wird im Arbeitsverzeichnis gelöst, mit `git add` als gelöst markiert, und `git cherry-pick --continue` erstellt den Commit mit der ursprünglichen Nachricht samt Herkunftsvermerk. Erst danach wird gepusht.
    resources:
      - title: git-cherry-pick – Sequencer-Befehle
        url: https://git-scm.com/docs/git-cherry-pick#_sequencer_subcommands

  - id: bereich-ohne-anfang
    type: output
    title: Wie viel steckt im Bereich?
    prompt: |
      Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q -b main
      printf 'v1\n' > app.py && git add app.py && git commit -qm "Initial"
      git switch -qc feature/login
      printf 'form\n' > form.html && git add form.html && git commit -qm "Add login form"
      printf 'check\n' > validate.py && git add validate.py && git commit -qm "Validate email"
      printf 'limit\n' > limit.py && git add limit.py && git commit -qm "Add rate limit"
      git switch -q main
      git cherry-pick feature/login~2..feature/login >/dev/null
      git log --format=%s
      ls
    expected: |
      Add rate limit
      Validate email
      Initial
      app.py
      limit.py
      validate.py
    verify: true
    hints:
      - "`feature/login~2` ist der Commit „Add login form“."
      - Bei `A..B` gehört `A` selbst nicht zum Bereich.
    explanation: |
      `feature/login~2..feature/login` bedeutet: alle Commits, die von `feature/login` erreichbar sind, aber nicht von `feature/login~2`. „Add login form“ ist `feature/login~2` selbst und damit ausgeschlossen. Übertragen werden „Validate email“ und „Add rate limit“, in dieser Reihenfolge – `form.html` fehlt deshalb auf `main`. Wer den ersten Commit mitnehmen will, schreibt `feature/login~3..feature/login` oder `feature/login~2^..feature/login`.
    resources:
      - title: gitrevisions – Bereiche angeben
        url: https://git-scm.com/docs/gitrevisions#_specifying_ranges

  - id: revert-mittendrin
    type: output
    title: Ein Commit aus der Mitte
    prompt: |
      Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q -b main
      printf 'TIMEOUT = 30\n' > config.py
      git add config.py && git commit -qm "Add config"
      printf 'TIMEOUT = 60\n' > config.py && git commit -qam "Raise timeout"
      printf 'DEBUG = True\n' > settings.py
      git add settings.py && git commit -qm "Enable debug toolbar"
      git revert --no-edit HEAD~1 >/dev/null
      git log --format=%s
      cat config.py
    expected: |
      Revert "Raise timeout"
      Enable debug toolbar
      Raise timeout
      Add config
      TIMEOUT = 30
    verify: true
    hints:
      - "`HEAD~1` ist zum Zeitpunkt des Reverts der Commit „Raise timeout“."
      - Revert entfernt keinen Commit aus der History.
    explanation: |
      `git revert HEAD~1` kehrt nur die Änderung von „Raise timeout“ um und legt das Ergebnis als neuen Commit oben drauf. Alle vier bisherigen Commits bleiben in der History, auch „Enable debug toolbar“, das nach dem fehlerhaften Commit entstand. Inhaltlich steht `TIMEOUT` wieder auf 30, `settings.py` bleibt erhalten.
    resources:
      - title: git-revert – Beschreibung
        url: https://git-scm.com/docs/git-revert#_description

  - id: cherry-zeichen
    type: output
    title: Plus oder Minus?
    prompt: |
      Was gibt das Skript aus? `cut` entfernt nur die Hash-Spalte.
    lang: bash
    code: |
      git init -q -b main
      printf 'v1\n' > app.py && git add app.py && git commit -qm "Initial"
      git branch release/2.4
      for fix in timeout csv darkmode; do
        printf '%s\n' "$fix" > "$fix.txt"
        git add "$fix.txt" && git commit -qm "Fix $fix"
      done
      git switch -q release/2.4
      git cherry-pick -x main~1 >/dev/null
      git cherry -v release/2.4 main | cut -d' ' -f1,3-
    expected: |
      + Fix timeout
      - Fix csv
      + Fix darkmode
    verify: true
    hints:
      - "`main~1` ist der mittlere der drei Fix-Commits."
      - "`git cherry` listet vom ältesten zum neuesten Commit."
    explanation: |
      `git cherry release/2.4 main` betrachtet die Commits von `main`, die es in `release/2.4` nicht gibt. Obwohl „Fix csv“ übertragen wurde, hat die Kopie einen anderen Hash – deshalb taucht das Original überhaupt in der Liste auf. Über die Patch-ID erkennt `git cherry` die gleiche Änderung und markiert sie mit `-`. Die beiden anderen Fixes fehlen im Release und bekommen `+`.
    resources:
      - title: git-cherry – Referenz
        url: https://git-scm.com/docs/git-cherry

  - id: hotfix-mit-herkunft
    type: command
    title: Hotfix mit Herkunftsvermerk
    context: |
      Du stehst auf `release/2.4`. Der Fix `4e1a9c2` liegt bereits auf `main` und ist gepusht.
    prompt: |
      Übertrage den Commit so, dass seine Nachricht auf das Original verweist.
    answers:
      - git cherry-pick -x 4e1a9c2
      - git cherry-pick 4e1a9c2 -x
    output: |
      [release/2.4 7d2f0b3] Fix off-by-one in session expiry
       Date: Mon Sep 28 16:42:10 2026 +0200
       1 file changed, 1 insertion(+), 1 deletion(-)
    explanation: |
      `-x` hängt `(cherry picked from commit 4e1a9c2…)` mit dem vollen Hash an die Nachricht an. Im Release ist damit nachvollziehbar, woher der Fix stammt – auch dann, wenn der Backport wegen eines Konflikts angepasst werden musste und die Patch-ID nicht mehr passt. Weil `main` geteilt ist, zeigt der Verweis auf einen Commit, den alle finden.
    resources:
      - title: git-cherry-pick · -x
        url: https://git-scm.com/docs/git-cherry-pick#Documentation/git-cherry-pick.txt--x

  - id: cherry-pick-abbrechen
    type: command
    title: Falscher Branch, halber Bereich
    context: |
      Du hast `git cherry-pick 4e1a9c2..c7a2e19` gestartet. Der erste Commit wurde übertragen, beim zweiten meldet Git einen Konflikt. Jetzt merkst du: Du stehst auf `release/2.3` statt auf `release/2.4`.
    prompt: |
      Bring das Repository in den Zustand vor dem Cherry-pick zurück – auch der schon übertragene erste Commit soll verschwinden.
    answers:
      - git cherry-pick --abort
    explanation: |
      `--abort` beendet den ganzen Vorgang und setzt den Branch auf den Stand vor dem Befehl zurück, einschließlich der bereits erstellten Commits. `--skip` würde nur den aktuellen Commit auslassen und weitermachen, `--quit` den Vorgang beenden, aber die schon übertragenen Commits behalten.
    resources:
      - title: git-cherry-pick · --abort
        url: https://git-scm.com/docs/git-cherry-pick#_sequencer_subcommands

  - id: merge-zuruecknehmen
    type: command
    title: Den Merge zurücknehmen
    context: |
      ```console
      $ git log --graph --format='%h %s' -4
      *   9f2c4e1 Merge branch 'feature/export'
      |\
      | * 2a08aca Add CSV export
      * | 5d1c7b3 Update changelog
      |/
      * ffb29e0 Add orders endpoint
      ```
      `main` ist gepusht. Das Export-Feature soll wieder raus.
    prompt: |
      Nimm den Merge-Commit `9f2c4e1` zurück, ohne die History umzuschreiben. Die Hauptlinie ist `main`, also der erste Elternteil. Übernimm die Standardnachricht, ohne dass sich ein Editor öffnet.
    answers:
      - git revert -m 1 --no-edit 9f2c4e1
      - git revert --no-edit -m 1 9f2c4e1
      - git revert --mainline 1 --no-edit 9f2c4e1
      - git revert --no-edit --mainline 1 9f2c4e1
      - git revert -m 1 9f2c4e1 --no-edit
      - git revert --no-edit 9f2c4e1 -m 1
      - git revert 9f2c4e1 -m 1 --no-edit
      - git revert 9f2c4e1 --no-edit -m 1
    output: |
      [main 0449c40] Revert "Merge branch 'feature/export'"
       Date: Tue Sep 29 11:02:37 2026 +0200
       1 file changed, 3 deletions(-)
    explanation: |
      Ein Merge hat zwei Eltern, deshalb muss Git wissen, gegenüber welchem es die Änderung berechnen soll. `-m 1` nimmt den ersten Elternteil (`5d1c7b3`, die Linie von `main`) als Maßstab und macht alles rückgängig, was der zweite Elternteil eingebracht hat – das Feature. Ohne `-m` bricht Git mit `is a merge but no -m option was given` ab. `--no-edit` übernimmt die Nachricht `Revert "Merge branch 'feature/export'"`.
    resources:
      - title: git-revert · -m
        url: https://git-scm.com/docs/git-revert#Documentation/git-revert.txt---mainlineparent-number

  - id: optionen-ergaenzen
    type: gap
    title: Drei Situationen, drei Optionen
    prompt: |
      Ergänze die fehlenden Teile. Die Kommentare beschreiben, was jeweils passieren soll.
    lang: bash
    code: |
      # Zwei Fixes als EINEN Backport-Commit übernehmen
      git switch release/2.4
      git cherry-pick ⟦-n⟧ 4e1a9c2 8d0b3f5
      git commit -m "Backport session fixes from main"

      # Ein Commit des Bereichs war schon im Release, der Cherry-pick ist leer
      git cherry-pick 1b7e3d0..c7a2e19
      git cherry-pick ⟦--skip⟧

      # Welche Commits von main fehlen im Release noch (gleiche Änderungen ausblenden)?
      git log --cherry-pick --right-only --format=%s release/2.4⟦...⟧main
    gaps:
      - label: Ohne Commit
        hint: Die Änderungen sollen nur in Index und Arbeitsverzeichnis landen.
        accept: ["--no-commit"]
      - label: Leeren Commit auslassen
        hint: Nicht abbrechen, sondern mit dem nächsten Commit des Bereichs weitermachen.
      - label: Bereichsoperator
        hint: "`--cherry-pick` vergleicht beide Seiten miteinander und braucht deshalb die symmetrische Differenz."
    explanation: |
      `-n` (`--no-commit`) wendet beide Änderungen an, ohne zu committen – der eigene `git commit` fasst sie zusammen. `--skip` lässt den leer gewordenen Commit aus und setzt den Bereich fort; `--abort` würde alles zurückrollen. `--cherry-pick` braucht `A...B`, weil es Commits der linken und der rechten Seite paarweise vergleicht. Mit `release/2.4..main` gäbe es keine linke Seite, und der übertragene Fix bliebe in der Liste.
    resources:
      - title: git log · --cherry-pick
        url: https://git-scm.com/docs/git-log#Documentation/git-log.txt---cherry-pick

  - id: bereich-verschluckt
    type: bug
    title: Der erste Fix fehlt
    prompt: |
      Die drei Hotfix-Commits `4e1a9c2`, `8d0b3f5` und `c7a2e19` liegen in dieser Reihenfolge direkt hintereinander auf `main`. Alle drei sollen mit Herkunftsvermerk nach `release/2.4`. Nach dem Lauf zeigt das Log auf `release/2.4` aber nur zwei neue Commits, der Fix aus `4e1a9c2` fehlt. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: bash
    code: |
      git switch release/2.4
      git pull --ff-only
      git cherry-pick -x 4e1a9c2..c7a2e19
      git log --format=%s -3
    lines: [3]
    fix:
      - line: 3
        answers:
          - git cherry-pick -x 4e1a9c2^..c7a2e19
          - git cherry-pick -x 4e1a9c2~..c7a2e19
          - git cherry-pick -x 4e1a9c2~1..c7a2e19
          - git cherry-pick -x 4e1a9c2^1..c7a2e19
          - git cherry-pick -x 4e1a9c2 8d0b3f5 c7a2e19
    explanation: |
      `A..B` enthält alle Commits, die von `B` erreichbar sind, aber nicht von `A` – `A` selbst ist also ausgeschlossen. Mit `4e1a9c2^..c7a2e19` beginnt der Bereich beim Elternteil von `4e1a9c2`, und der erste Fix gehört dazu. Bei drei Commits ist es genauso gut, sie einzeln aufzuzählen. Vor einem Bereichs-Cherry-pick lohnt sich `git log --format=%s 4e1a9c2^..c7a2e19`, um die Auswahl zu prüfen.
    resources:
      - title: gitrevisions – Bereiche angeben
        url: https://git-scm.com/docs/gitrevisions#_specifying_ranges

  - id: merge-bereits-aktuell
    type: explain
    title: „Already up to date“ – aber das Feature fehlt
    prompt: |
      Das Export-Feature wurde gemergt und kurz darauf zurückgenommen. Jetzt soll es unverändert zurück nach `main`. Erkläre, warum der Merge nichts tut und wie das Team das Feature zurückbekommt.
    lang: console
    code: |
      $ git log --graph --format='%h %s'
      * 662703c Revert "Merge branch 'feature/export'"
      *   dc6a18b Merge branch 'feature/export'
      |\
      | * 2a08aca Add CSV export
      |/
      * ffb29e0 Add orders endpoint
      $ git merge feature/export
      Already up to date.
    points:
      - Der Revert hat den Inhalt entfernt, nicht die History – `2a08aca` ist weiterhin Vorfahre von `main`.
      - "`git merge` bringt nur Commits, die von `main` aus noch nicht erreichbar sind; hier gibt es keine."
      - Lösung ist ein Revert des Reverts (`git revert 662703c`), der den Feature-Inhalt als `Reapply "…"` zurückholt.
      - Spätere Fixes auf dem Feature-Branch lassen sich danach normal mergen.
    explanation: |
      `662703c` hat die Änderungen des Merges umgekehrt, aber `dc6a18b` und damit `2a08aca` bleiben Teil der History von `main`. Für Git ist `feature/export` vollständig gemergt: Der Branch zeigt auf `2a08aca`, und dieser Commit ist von `main` aus erreichbar. Deshalb meldet der Merge `Already up to date.` Der Inhalt kommt zurück, indem das Team den Revert selbst revertet: `git revert 662703c` erzeugt `Reapply "Merge branch 'feature/export'"`. Kommen danach Fixes auf dem Feature-Branch hinzu, bringt ein normaler Merge genau diese. Ein zurückgenommener Merge sollte deshalb in seiner Revert-Nachricht auf dieses Vorgehen hinweisen.
    resources:
      - title: How to revert a faulty merge
        url: https://git-scm.com/docs/howto/revert-a-faulty-merge

  - id: labor-falscher-branch
    type: practice
    title: "Labor: Auf main statt auf dem Feature-Branch"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Es erzeugt ein Repository mit `main` und dem Branch `feature/login-limit`. Der Commit „Lock account after too many attempts“ gehört zum Feature, liegt aber auf `main`. Nichts ist gepusht.

      Stelle den Zustand her, in dem `feature/login-limit` den Commit enthält und `main` wieder bei „Add login“ steht. Verwende `git cherry-pick`; das Zurücksetzen von `main` erklärt das Modul [Reset und Reflog](/git/reset-reflog). Prüfe am Ende mit `git log --format=%s main`, `git log --format=%s feature/login-limit` und `git status --short`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q -b main
      printf 'def login(user, password):\n    return check(user, password)\n' > auth.py
      git add auth.py && git commit -qm "Add login"
      git switch -qc feature/login-limit
      printf 'MAX_ATTEMPTS = 5\n' > limits.py
      git add limits.py && git commit -qm "Add attempt limit setting"
      git switch -q main
      # Versehentlich auf main statt auf dem Feature-Branch committet:
      printf 'def login(user, password):\n    if too_many_attempts(user):\n        raise LockedOut(user)\n    return check(user, password)\n' > auth.py
      git commit -qam "Lock account after too many attempts"
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q -b main
      printf 'def login(user, password):\n    return check(user, password)\n' > auth.py
      git add auth.py && git commit -qm "Add login"
      git switch -qc feature/login-limit
      printf 'MAX_ATTEMPTS = 5\n' > limits.py
      git add limits.py && git commit -qm "Add attempt limit setting"
      git switch -q main
      # Versehentlich auf main statt auf dem Feature-Branch committet:
      printf 'def login(user, password):\n    if too_many_attempts(user):\n        raise LockedOut(user)\n    return check(user, password)\n' > auth.py
      git commit -qam "Lock account after too many attempts"
      # Reparatur
      git switch -q feature/login-limit
      git cherry-pick main
      git switch -q main
      git reset --hard HEAD~1
      # Kontrolle
      test "$(git log -1 --format=%s main)" = "Add login"
      test "$(git log -1 --format=%s feature/login-limit)" = "Lock account after too many attempts"
      test "$(git rev-list --count feature/login-limit)" = 3
      git show feature/login-limit:auth.py | grep -q 'too_many_attempts'
      test -z "$(git status --porcelain)"
    checklist:
      - "`git log --format=%s main` zeigt nur noch „Add login“."
      - "`git log --format=%s feature/login-limit` zeigt „Lock account after too many attempts“ über „Add attempt limit setting“ und „Add login“."
      - "`git show feature/login-limit:auth.py` enthält `too_many_attempts`."
      - "`git status --short` ist leer."
    verify: true
    hints:
      - Übertrage den Commit zuerst auf den Feature-Branch, bevor du ihn von `main` entfernst.
      - "`git cherry-pick main` überträgt den Commit, auf den `main` gerade zeigt."
      - "Auf `main` entfernt `git reset --hard HEAD~1` den letzten Commit – nur zulässig, weil er nicht gepusht ist."
    explanation: |
      Die Reihenfolge ist entscheidend: Erst kopiert `git cherry-pick main` die Änderung auf `feature/login-limit`, dann setzt `git reset --hard HEAD~1` den Branch `main` einen Commit zurück. Umgekehrt wäre der Commit nur noch über den Reflog auffindbar. Das Original auf `main` ist nach dem Reset nicht mehr erreichbar, die Kopie auf dem Feature-Branch hat einen neuen Hash. Wäre `main` schon gepusht gewesen, hättest du den Commit auf `main` stattdessen mit `git revert` zurücknehmen müssen.
    resources:
      - title: git-reset – Beispiel „Undo a commit, making it a topic branch“
        url: https://git-scm.com/docs/git-reset#Documentation/git-reset.txt-Undoacommitmakingitatopicbranch

  - id: labor-backport-konflikt
    type: practice
    title: "Labor: Der Backport klemmt"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Auf `main` liegt der Hotfix „Fix off-by-one in session expiry“: Eine Session gilt ab genau dem Ablaufzeitpunkt als abgelaufen (`>=` statt `>`). Das Skript lässt dich auf `release/2.4` stehen. Dort sieht `session.py` etwas anders aus als auf `main`.

      Übertrage den Hotfix mit Herkunftsvermerk auf `release/2.4`. Der Code im Release soll danach dem Fix entsprechen, aber keine Konstante verwenden, die es im Release nicht gibt. Prüfe am Ende mit `cat session.py`, `git log -1 --format=%B` und `git status --short`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q -b main
      printf 'def is_expired(session, now):\n    return now > session.created + 3600\n' > session.py
      git add session.py && git commit -qm "Add session expiry"
      git branch release/2.4
      # Auf main geht die Entwicklung weiter ...
      printf 'SESSION_TTL = 3600\n\ndef is_expired(session, now):\n    return now > session.created + SESSION_TTL\n' > session.py
      git commit -qam "Extract SESSION_TTL constant"
      # ... und der Hotfix landet zuerst auf main:
      printf 'SESSION_TTL = 3600\n\ndef is_expired(session, now):\n    return now >= session.created + SESSION_TTL\n' > session.py
      git commit -qam "Fix off-by-one in session expiry"
      git switch -q release/2.4
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q -b main
      printf 'def is_expired(session, now):\n    return now > session.created + 3600\n' > session.py
      git add session.py && git commit -qm "Add session expiry"
      git branch release/2.4
      # Auf main geht die Entwicklung weiter ...
      printf 'SESSION_TTL = 3600\n\ndef is_expired(session, now):\n    return now > session.created + SESSION_TTL\n' > session.py
      git commit -qam "Extract SESSION_TTL constant"
      # ... und der Hotfix landet zuerst auf main:
      printf 'SESSION_TTL = 3600\n\ndef is_expired(session, now):\n    return now >= session.created + SESSION_TTL\n' > session.py
      git commit -qam "Fix off-by-one in session expiry"
      git switch -q release/2.4
      # Reparatur
      git cherry-pick -x main || true
      printf 'def is_expired(session, now):\n    return now >= session.created + 3600\n' > session.py
      git add session.py
      git cherry-pick --continue --no-edit
      # Kontrolle
      test "$(git branch --show-current)" = "release/2.4"
      grep -qx '    return now >= session.created + 3600' session.py
      git log -1 --format=%B | grep -q '^(cherry picked from commit '
      test "$(git log -1 --format=%s)" = "Fix off-by-one in session expiry"
      test ! -e .git/CHERRY_PICK_HEAD
      test -z "$(git status --porcelain)"
    checklist:
      - "`session.py` enthält die Zeile `return now >= session.created + 3600` und keine Konfliktmarker."
      - "`session.py` verwendet `SESSION_TTL` nicht."
      - "`git log -1 --format=%B` zeigt „Fix off-by-one in session expiry“ und `(cherry picked from commit …)`."
      - "`git status --short` ist leer, kein Cherry-pick läuft mehr."
      - "`main` ist unverändert."
    verify: true
    hints:
      - "Der Konflikt entsteht, weil der Fix auf `SESSION_TTL` aufbaut – eine Konstante aus einem Commit, der nicht übertragen wird."
      - "Übernimm die Absicht des Fixes (`>=`) in den Code des Release (`3600`)."
      - "Nach `git add session.py` schließt `git cherry-pick --continue` den Vorgang ab. `--no-edit` verhindert den Editor."
    explanation: |
      Cherry-pick vergleicht den Elternteil des Fixes mit dem Fix selbst und wendet das auf `release/2.4` an. Im Release fehlt der Commit „Extract SESSION_TTL constant“, deshalb passt die Umgebung der geänderten Zeile nicht, und es gibt einen Konflikt. Weder „ours“ (`>` mit `3600`) noch „theirs“ (`>=` mit `SESSION_TTL`) ist richtig: Die eine Seite hat den Fehler, die andere nutzt eine Konstante, die es nicht gibt. Richtig ist die Absicht des Fixes im Code des Ziels. Wer blind „theirs“ nimmt, bekommt einen `NameError` im Release. `-x` bleibt auch nach einer Konfliktauflösung in der Nachricht erhalten und hilft später, weil die Patch-ID des angepassten Backports nicht mehr mit dem Original übereinstimmt.
    resources:
      - title: git-cherry-pick – Referenz
        url: https://git-scm.com/docs/git-cherry-pick

  - id: labor-revert-revert
    type: practice
    title: "Labor: Das Feature kommt nur halb zurück"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Der CSV-Export wurde gemergt, wegen kaputter Umlaute auf `main` per Revert zurückgenommen, auf `feature/export` repariert und erneut gemergt. Der zweite Merge lief ohne Fehler durch. Trotzdem fehlt `export_csv` in `api.py`. Nichts ist gepusht.

      Stelle den Zustand her, in dem `main` das vollständige Feature samt Fix enthält, ohne dass du den Feature-Code von Hand neu schreibst. Prüfe am Ende mit `git log --graph --format=%s`, `cat api.py config.py` und `git status --short`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q -b main
      printf 'CSV_ENCODING = "latin-1"\n' > config.py
      printf 'def orders():\n    return load_orders()\n' > api.py
      git add . && git commit -qm "Add orders endpoint"
      git switch -qc feature/export
      printf '\ndef export_csv():\n    return to_csv(orders(), CSV_ENCODING)\n' >> api.py
      git commit -qam "Add CSV export"
      git switch -q main
      git merge -q --no-ff -m "Merge branch 'feature/export'" feature/export
      # Umlaute im Export kaputt -> Merge auf main zurückgenommen:
      git revert --no-edit -m 1 HEAD >/dev/null
      # Das Team behebt den Fehler auf dem Feature-Branch ...
      git switch -q feature/export
      printf 'CSV_ENCODING = "utf-8"\n' > config.py
      git commit -qam "Export CSV as UTF-8"
      # ... und mergt das Feature erneut:
      git switch -q main
      git merge -q --no-edit feature/export
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q -b main
      printf 'CSV_ENCODING = "latin-1"\n' > config.py
      printf 'def orders():\n    return load_orders()\n' > api.py
      git add . && git commit -qm "Add orders endpoint"
      git switch -qc feature/export
      printf '\ndef export_csv():\n    return to_csv(orders(), CSV_ENCODING)\n' >> api.py
      git commit -qam "Add CSV export"
      git switch -q main
      git merge -q --no-ff -m "Merge branch 'feature/export'" feature/export
      # Umlaute im Export kaputt -> Merge auf main zurückgenommen:
      git revert --no-edit -m 1 HEAD >/dev/null
      # Das Team behebt den Fehler auf dem Feature-Branch ...
      git switch -q feature/export
      printf 'CSV_ENCODING = "utf-8"\n' > config.py
      git commit -qam "Export CSV as UTF-8"
      # ... und mergt das Feature erneut:
      git switch -q main
      git merge -q --no-edit feature/export
      # Reparatur
      git reset --hard ORIG_HEAD
      git revert --no-edit HEAD
      git merge --no-edit feature/export
      # Kontrolle
      grep -q 'def export_csv' api.py
      grep -q '"utf-8"' config.py
      git merge-base --is-ancestor feature/export main
      test -n "$(git log --format=%s --grep='^Reapply')"
      test -z "$(git status --porcelain)"
    checklist:
      - "`api.py` enthält `def export_csv`."
      - "`config.py` enthält `CSV_ENCODING = \"utf-8\"`."
      - "`git log --format=%s` enthält einen Commit `Reapply \"Merge branch 'feature/export'\"`."
      - "`git merge-base --is-ancestor feature/export main` endet mit Status 0."
      - "`git status --short` ist leer."
    verify: true
    hints:
      - "Warum brachte der zweite Merge nur `config.py` mit? Welche Commits von `feature/export` waren für Git schon gemergt?"
      - "Der Revert-Commit selbst lässt sich revertieren."
      - "Du kannst den zweiten Merge vorher mit `git reset --hard ORIG_HEAD` rückgängig machen (nicht gepusht) oder den Revert direkt darauf revertieren."
    explanation: |
      Der Revert von `-m 1` hat den Inhalt von „Add CSV export“ entfernt, der Commit blieb aber Vorfahre von `main`. Der zweite Merge berücksichtigte deshalb nur den neuen Commit „Export CSV as UTF-8“ – er brachte die Konfiguration, aber nicht die Funktion. Der Revert des Reverts stellt den Feature-Code wieder her. Die Musterlösung macht zuerst den unvollständigen Merge mit `ORIG_HEAD` rückgängig, revertet dann den Revert und mergt erneut. So entsteht eine lesbare History: Reapply, danach der Merge des Fixes. Ebenfalls richtig ist `git revert --no-edit HEAD^1` direkt auf dem zweiten Merge, weil dessen erster Elternteil der Revert-Commit ist.
    resources:
      - title: How to revert a faulty merge
        url: https://git-scm.com/docs/howto/revert-a-faulty-merge
      - title: Pro Git · Reverse the commit
        url: https://git-scm.com/book/en/v2/Git-Tools-Advanced-Merging#_reverse_commit
