id: datenmodell
title: "Das Datenmodell: Blob, Tree, Commit"
level: 2
minutes: 170
summary: Unter jedem Git-Befehl liegt eine kleine Objektdatenbank aus Blobs, Trees, Commits und Tags plus Refs, die darauf zeigen – wer sie versteht, sagt vorher, was ein Befehl tut, und findet verloren geglaubte Stände wieder.
goals:
  - Du erklärst, wie Git Inhalte adressiert, und zeigst mit `hash-object` und `cat-file`, dass gleicher Inhalt überall denselben Hash hat.
  - Du unterscheidest Blob, Tree, Commit und annotierten Tag und liest ihren Inhalt mit `cat-file -p` und `ls-tree`.
  - Du beschreibst Branches, Tags und HEAD als Refs, findest sie in `.git/refs` und `packed-refs` und setzt sie mit `update-ref` sicher um.
  - Du zerlegst `git commit` in `write-tree`, `commit-tree` und `update-ref` und baust einen Commit nur mit Plumbing.
  - Du navigierst im Commit-Graphen mit `HEAD~n`, `HEAD^n`, `<rev>:<pfad>` und `rev-parse`.
