id: bisect-historie
title: Fehlersuche in der History
level: 3
minutes: 160
summary: Du befragst die History gezielt mit Pickaxe, log -L, blame und git grep und findest mit git bisect in wenigen Schritten den Commit, der eine Regression eingeführt hat.
goals:
  - Du unterscheidest `git log -S` und `git log -G` und findest damit, wann ein Text in den Code kam oder verschwand.
  - Du verfolgst Dateien, Funktionen und Zeilen mit `log --follow`, `log -L` und `blame` und blendest Formatierungs-Commits mit `.git-blame-ignore-revs` aus.
  - Du führst eine Bisect-Sitzung von Hand, korrigierst Fehlmarkierungen mit `bisect log` und `bisect replay` und beendest sie sauber.
  - Du automatisierst Bisect mit `git bisect run` und einem Prüfskript mit den richtigen Exit-Codes.
  - Du erklärst, warum atomare, baubare Commits und `--first-parent` Bisect erst zuverlässig machen.
