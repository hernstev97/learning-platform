id: konflikte
title: Konflikte lösen
level: 2
minutes: 170
summary: Warum Konflikte entstehen, wie du Marker, Index-Stufen und ours/theirs liest – auch beim Rebase – und wie du Inhalts-, Lösch-, Binär- und Lockfile-Konflikte fachlich richtig auflöst.
goals:
  - Du sagst vorher, welche Änderungen einen Konflikt auslösen, und liest Konfliktmarker im Stil `merge`, `diff3` und `zdiff3`.
  - Du nutzt die Index-Stufen 1, 2 und 3 (`git ls-files -u`, `git show :1:datei`) und `git status`, um jeden Konflikt einzuordnen.
  - Du wählst mit `--ours`/`--theirs` gezielt eine Seite und weißt, dass sich die Bedeutung beim Rebase umkehrt.
  - Du löst modify/delete-, Binär- und Lockfile-Konflikte, indem du die fachliche Absicht beider Seiten erhältst oder Dateien neu erzeugst.
  - Du schließt Konflikte sauber ab (`--continue`, `--abort`), findest vergessene Marker und kennst `rerere` und `mergetool`.
resources:
  - title: git merge · How to resolve conflicts
    url: https://git-scm.com/docs/git-merge#_how_to_resolve_conflicts
  - title: Pro Git · Advanced Merging
    url: https://git-scm.com/book/en/v2/Git-Tools-Advanced-Merging
  - title: git rerere – Referenz
    url: https://git-scm.com/docs/git-rerere
  - title: GitHub Docs · About merge conflicts
    url: https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/addressing-merge-conflicts/about-merge-conflicts
lesson: |
  Du mergst `feature/retry` nach `main`, und Git meldet `CONFLICT (content): Merge conflict in config.yaml`. Viele übernehmen in diesem Moment blind eine Seite, bis die Marker weg sind – und löschen damit still die Änderung einer Kollegin. Ein Konflikt ist aber kein Defekt, sondern eine Rückfrage: Zwei Seiten haben dieselbe Stelle unterschiedlich geändert, und Git weigert sich zu raten, welche Absicht gilt.

  Wer weiß, woher die drei beteiligten Versionen stammen, wo Git sie ablegt und welche Seite gerade „ours“ ist, löst Konflikte ruhig und fachlich richtig. Das Modul baut auf [Merge verstehen](/git/merge) auf: Merge-Base, Drei-Wege-Merge und Merge-Commit solltest du kennen.

  ## Wann Git einen Konflikt meldet

  Beim Drei-Wege-Merge vergleicht Git jede Seite mit der Merge-Base. Für jede Stelle einer Datei gibt es vier Möglichkeiten:

  | Basis → ours (HEAD) | Basis → theirs | Ergebnis |
  | --- | --- | --- |
  | unverändert | geändert | Version von theirs |
  | geändert | unverändert | Version von ours |
  | identisch geändert | identisch geändert | die Änderung, einmal |
  | unterschiedlich geändert | unterschiedlich geändert | **Konflikt** |

  „Dieselbe Stelle“ heißt nicht nur dieselbe Zeile. Ändert eine Seite Zeile 3 und die andere Zeile 4, landen beide im selben Konfliktblock, weil Git nicht weiß, wie die Änderungen zusammengehören. Liegt mindestens eine unveränderte Zeile dazwischen, kombiniert Git beide automatisch.

  Neben diesen **Inhaltskonflikten** gibt es Konflikte auf Dateiebene: Eine Seite ändert eine Datei, die andere löscht sie (modify/delete). Eine Seite benennt um, die andere löscht (rename/delete). Beide legen dieselbe Datei mit verschiedenem Inhalt an (add/add). Und Binärdateien kann Git grundsätzlich nicht zeilenweise kombinieren. Eine reine Umbenennung ist dagegen kein Problem: Die Strategie `ort` erkennt, dass `src/api.py` zu `src/routes.py` wurde, und wendet eine Änderung der anderen Seite auf die neue Datei an.

  ```console
  $ git merge feature/retry
  Auto-merging config.yaml
  CONFLICT (content): Merge conflict in config.yaml
  Automatic merge failed; fix conflicts and then commit the result.
  ```

  Umgekehrt heißt „kein Konflikt“ nicht „korrekt“. Git arbeitet rein textuell. Benennt `main` eine Funktion um und ruft ein Feature-Branch sie in einer neuen Datei noch unter dem alten Namen auf, mergt Git ohne Murren – und der Build bricht. Solche **semantischen Konflikte** fängst du nur mit Tests ab, die nach jedem Merge laufen.

  ## Konfliktmarker lesen

  Bei einem Inhaltskonflikt schreibt Git beide Versionen mit Markern in die Datei ([git merge · How conflicts are presented](https://git-scm.com/docs/git-merge#_how_conflicts_are_presented)):

  ```text
  server:
    port: 8080
  <<<<<<< HEAD
    timeout: 60
  =======
    timeout: 30
    retries: 3
  >>>>>>> feature/retry
  logging:
    level: info
  ```

  Zwischen `<<<<<<< HEAD` und `=======` steht die Version des Branch, auf dem du stehst (ours), zwischen `=======` und `>>>>>>> feature/retry` die des gemergten Branch (theirs). Alles außerhalb der Marker hat Git schon zusammengeführt. Deine Aufgabe: den richtigen Endzustand herstellen und **alle** Markerzeilen entfernen.

  Im Beispiel bleibt eine Frage offen: Hat `feature/retry` den Timeout auf 30 gesetzt, oder stand er vorher schon so da? Die Standardanzeige verschweigt die Basis. Mit `merge.conflictStyle` zeigt Git sie zusätzlich an ([git config · merge.conflictStyle](https://git-scm.com/docs/git-config#Documentation/git-config.txt-mergeconflictStyle)):

  ```ini title=.gitconfig
  [merge]
      conflictStyle = zdiff3
  ```

  Ein Beispiel aus einer Rate-Limit-Funktion, zuerst im Stil `diff3`:

  ```text title=diff3
  def rate_limit():
  <<<<<<< HEAD
      # Limit pro Minute
      limit = 200
      return limit
  ||||||| 81283fe
      return 100
  =======
      # Limit pro Minute
      limit = 120
      return limit
  >>>>>>> feature/limit
  ```

  Derselbe Konflikt im Stil `zdiff3`:

  ```text title=zdiff3
  def rate_limit():
      # Limit pro Minute
  <<<<<<< HEAD
      limit = 200
  ||||||| 81283fe
      return 100
  =======
      limit = 120
  >>>>>>> feature/limit
      return limit
  ```

  Der Block nach `|||||||` ist die Merge-Base. Jetzt lässt sich jede Seite mit ihr vergleichen: Beide haben aus `return 100` eine Variable `limit` mit Kommentar gemacht, nur der Wert unterscheidet sich – 200 gegen 120. `zdiff3` (seit Git 2.35) zieht Zeilen, die auf beiden Seiten identisch sind, aus dem Konfliktblock heraus. So bleibt nur die eigentliche Streitfrage übrig. Mit `git checkout --conflict=zdiff3 datei` zeichnet Git einen bestehenden Konflikt im gewünschten Stil neu – Vorsicht: Deine bisherigen Änderungen an dieser Datei sind dann weg.

  > [!TIP]
  > Setze `merge.conflictStyle = zdiff3` global. Ohne die Basis rätst du bei jedem Konflikt, welche Seite was geändert hat. Mit ihr ist das Lesen mechanisch: Jede Seite gegen die Basis vergleichen, beide Absichten verstehen, dann kombinieren.

  ## Was im Index passiert: die Stufen 1, 2 und 3

  Normalerweise hat jeder Pfad genau einen Eintrag im Index (Stufe 0). Während eines Konflikts legt Git für die Datei bis zu drei Einträge an – die vollständigen Versionen aller Beteiligten ([git ls-files · --unmerged](https://git-scm.com/docs/git-ls-files#Documentation/git-ls-files.txt---unmerged)):

  ```console
  $ git status --short
  UU config.yaml
  $ git ls-files -u
  100644 0d7214a5dc5ae88bda3f5ded02cbf2ccaf876a50 1	config.yaml
  100644 15fe1ef37694468bd95867e0e6c022d82129a17d 2	config.yaml
  100644 9970447294fc7fa10309930732aca3f81c37945a 3	config.yaml
  $ git show :1:config.yaml
  server:
    port: 8080
    timeout: 30
  logging:
    level: info
  ```

  **Stufe 1** ist die Merge-Base, **Stufe 2** ours (HEAD), **Stufe 3** theirs. Die Syntax `:n:pfad` adressiert eine Stufe direkt ([gitrevisions](https://git-scm.com/docs/gitrevisions#Documentation/gitrevisions.txt-npatheg0READMEREADME)); `git show :1:config.yaml` beantwortet damit die Frage, die der Standard-Marker offenlässt. `git status --short` fasst die Lage in zwei Buchstaben zusammen: `UU` beide geändert, `UD` von theirs gelöscht, `DU` von ours gelöscht, `AA` auf beiden Seiten neu angelegt ([git status · Short Format](https://git-scm.com/docs/git-status#_short_format)).

  `git add datei` schreibt die Datei aus dem Arbeitsverzeichnis als Stufe 0 in den Index und entfernt die Stufen 1–3. Genau das bedeutet „als gelöst markieren“. Git prüft dabei **nicht**, ob noch Marker in der Datei stehen. Das erledigt `git diff --check` bzw. vor dem Commit `git diff --cached --check`, das übrig gebliebene Marker als `leftover conflict marker` meldet.

  Während des Konflikts zeigt `git diff` ein **kombiniertes Diff** mit zwei Spalten: Die erste vergleicht mit ours, die zweite mit theirs ([git diff · Combined diff format](https://git-scm.com/docs/git-diff#_combined_diff_format)).

  ```console
  $ git diff
  diff --cc config.yaml
  index 15fe1ef,9970447..0000000
  --- a/config.yaml
  +++ b/config.yaml
  @@@ -1,5 -1,6 +1,10 @@@
    server:
      port: 8080
  ++<<<<<<< HEAD
   +  timeout: 60
  ++=======
  +   timeout: 30
  +   retries: 3
  ++>>>>>>> feature/retry
    logging:
      level: info
  ```

  Nach dem Merge ist dasselbe Format ein Review-Werkzeug: `git show <merge-commit>` zeigt nur Zeilen, die von **beiden** Eltern abweichen – also genau die Stellen, an denen jemand beim Auflösen eigenen Code geschrieben hat. Eine mit `++` markierte Zeile stand auf keiner Seite. Genau diese Zeilen solltest du im Review lesen.

  ## Ours und theirs – und die Umkehrung beim Rebase

  Für Entscheidungen über eine ganze Datei holst du eine Stufe ins Arbeitsverzeichnis: `git restore --ours datei` nimmt Stufe 2, `git restore --theirs datei` Stufe 3 ([git restore · --ours](https://git-scm.com/docs/git-restore#Documentation/git-restore.txt---ours)). Die ältere Schreibweise `git checkout --ours datei` tut dasselbe. Die Datei bleibt danach ungelöst, bis du sie mit `git add` markierst.

  Beim Merge ist die Zuordnung intuitiv: ours ist der Branch, auf dem du stehst, theirs der, den du hereinholst. Beim **Rebase** kehrt sie sich um. Git setzt HEAD zuerst auf die neue Basis (`main`) und wendet dann deine Commits einzeln darauf an. Mitten im Konflikt ist HEAD also `main` samt den schon übertragenen Commits – das ist ours. Der Commit, der gerade angewendet wird, ist dein eigener – theirs.

  ```text
  $ git switch feature/rabatt && git rebase main

          B          feature/rabatt (dein Commit, wird gerade angewendet)
         /
    ---o---M         main – während des Rebase steht HEAD hier

    ours   = M (main)
    theirs = B (dein Commit)
  ```

  | Vorgang | ours (Stufe 2) | theirs (Stufe 3) |
  | --- | --- | --- |
  | `git merge feature` auf `main` | `main` | `feature` |
  | `git rebase main` auf `feature` | `main` plus bereits übertragene Commits | dein Commit, der gerade angewendet wird |
  | `git cherry-pick X` | aktueller Branch | `X` |
  | `git stash pop` | aktueller Branch | der Stash |

  Dasselbe gilt für die Strategie-Optionen: `git rebase -X ours main` bevorzugt bei Konflikten `main`, nicht deine Commits. Mehr zum Ablauf eines Rebase im Modul [Rebase](/git/rebase).

  > [!INTERVIEW] „Was bedeuten ours und theirs – und warum sind sie beim Rebase vertauscht?“
  > ours ist immer HEAD, theirs das, was gerade hereinkommt. Beim Merge ist HEAD mein Branch. Beim Rebase setzt Git HEAD zuerst auf die Zielbasis und spielt meine Commits darauf ab – dann ist HEAD `main`, und mein Commit ist theirs. Wer beim Rebase „meine Version“ will, nimmt deshalb `--theirs`. Bevor ich eine ganze Seite übernehme, prüfe ich mit `git show :1:datei`, was die andere Seite geändert hat.

  ## Gelöschte Dateien, Binärdateien und Lockfiles

  **modify/delete.** Hier gibt es keine Marker, weil eine Version fehlt. Git lässt die geänderte Version im Arbeitsverzeichnis liegen und meldet:

  ```console
  $ git merge cleanup
  CONFLICT (modify/delete): scripts/deploy_old.sh deleted in cleanup and modified in HEAD.  Version HEAD of scripts/deploy_old.sh left in tree.
  Automatic merge failed; fix conflicts and then commit the result.
  $ git status --short
  UD scripts/deploy_old.sh
  ```

  Du entscheidest: `git rm scripts/deploy_old.sh` (die Löschung gewinnt) oder `git add scripts/deploy_old.sh` (die geänderte Datei bleibt). Die fachliche Frage dahinter: Wurde die Datei gelöscht, weil sie ersetzt wurde? Dann gehört die Änderung von `main` oft in die neue Datei, sonst geht ein Bugfix verloren.

  **Binärdateien.** Bei Bildern, PDFs oder Office-Dateien meldet Git `warning: Cannot merge binary files: assets/logo.png (HEAD vs. feature/rebrand)` und lässt die Version von ours liegen. Es gibt nur ganze Seiten: `git restore --theirs assets/logo.png` oder `--ours`, danach `git add` – oder eine neu erstellte Datei. Dateien, die Git fälschlich für Text hält, markierst du in `.gitattributes` mit `binary` ([gitattributes · Marking files as binary](https://git-scm.com/docs/gitattributes#_marking_files_as_binary)).

  **Generierte Dateien und Lockfiles.** `package-lock.json`, `uv.lock` oder `Cargo.lock` sind Ergebnisse eines Werkzeugs. Einen Konflikt darin löst du nie von Hand, sondern an der Quelle: Erst `package.json` bzw. `pyproject.toml` fachlich richtig zusammenführen, dann das Lockfile mit dem Werkzeug neu erzeugen.

  ```bash
  git restore --theirs package-lock.json   # irgendeine gültige Seite als Ausgangspunkt
  npm install                              # Lockfile aus dem gemergten package.json neu berechnen
  git add package.json package-lock.json
  git merge --continue
  ```

  Dasselbe gilt für generierten Code (OpenAPI-Clients, Protobuf), gebaute Assets und Test-Snapshots: Quelle mergen, neu generieren, committen.

  ## Der Ablauf: auflösen, prüfen, abschließen

  1. `git status` zeigt, welche Dateien betroffen sind und welche Art von Konflikt vorliegt.
  2. Verstehe beide Seiten. `git log --merge` listet die Commits beider Seiten, die konfliktbehaftete Dateien geändert haben ([git log · --merge](https://git-scm.com/docs/git-log#Documentation/git-log.txt---merge)); mit `-p` siehst du die Änderungen dazu.
  3. Bearbeite die Datei, bis sie beide Absichten enthält, und entferne alle Marker.
  4. `git diff --check` findet vergessene Marker. Führe die Tests aus.
  5. `git add` markiert die Datei als gelöst. `git merge --continue` (gleichbedeutend mit `git commit`) erzeugt den Merge-Commit; beim Rebase heißt es `git rebase --continue`, beim Cherry-pick `git cherry-pick --continue`.
  6. Willst du neu anfangen, bringt `git merge --abort` (bzw. `git rebase --abort`) dich zum Stand vor dem Vorgang zurück.

  ```console
  $ git log --merge --oneline
  d92b545 Timeout erhöhen
  e88f871 Retries konfigurieren
  ```

  **mergetool.** `git mergetool` öffnet für jede Konfliktdatei ein konfiguriertes Werkzeug (`merge.tool`, etwa `vimdiff` oder `meld`) mit Basis, ours und theirs nebeneinander ([git mergetool](https://git-scm.com/docs/git-mergetool)). Standardmäßig bleibt eine Sicherung `datei.orig` zurück; `mergetool.keepBackup = false` verhindert das. Viele IDEs bringen eine eigene Drei-Wege-Ansicht mit.

  **rerere** („reuse recorded resolution“) merkt sich, wie du einen Konflikt gelöst hast, und wendet die Lösung an, wenn exakt derselbe Konflikt wieder auftritt – etwa wenn du einen langlebigen Branch wiederholt rebasest ([git rerere](https://git-scm.com/docs/git-rerere)):

  ```console
  $ git config rerere.enabled true
  $ git merge feature/timeout
  Auto-merging config.yaml
  CONFLICT (content): Merge conflict in config.yaml
  Recorded preimage for 'config.yaml'
  Automatic merge failed; fix conflicts and then commit the result.
  $ git restore --ours config.yaml
  $ git add config.yaml && git commit --no-edit
  Recorded resolution for 'config.yaml'.
  [main 1e7fcf2] Merge branch 'feature/timeout'
  ```

  Beim nächsten Auftreten meldet Git `Resolved 'config.yaml' using previous resolution.`. Die Datei ist dann gelöst, aber noch nicht gestaged – du prüfst das Ergebnis und markierst es selbst mit `git add` (oder setzt `rerere.autoUpdate`).

  > [!PRAXIS] Konflikte vermeiden
  > Die meisten Konflikte sind ein Symptom langer Branches. Kleine Pull Requests, die nach ein bis zwei Tagen gemergt sind, `main` regelmäßig in lange Branches holen, Formatierung und Massenumbenennungen als eigenen, abgesprochenen PR und ein Formatter, der in CI erzwungen wird, halten Konflikte klein. Lockfile-Updates (Dependabot, Renovate) mergt man einzeln statt gebündelt mit Features.

  ## Häufige Fehler

  - **Marker committet.** `git add` akzeptiert jede Datei. Vor dem Commit hilft `git diff --cached --check`. Noch nicht gepusht: Datei korrigieren, `git add`, `git commit --amend --no-edit` – der Merge-Commit behält beide Eltern.
  - **Blind eine Seite genommen.** `--ours`, `--theirs` oder `-X ours` auf eine Datei, in der beide Seiten etwas Sinnvolles geändert haben, löscht eine Änderung still. Erst mit `git show :1:datei` die Basis vergleichen.
  - **ours und theirs beim Rebase verwechselt.** Beim Rebase ist `--theirs` dein eigener Commit.
  - **Lockfile von Hand gemergt.** Das Ergebnis passt nicht zur Quelle, der nächste `npm ci` scheitert oder installiert andere Versionen. Neu erzeugen.
  - **Konfliktfrei heißt korrekt.** Semantische Konflikte (umbenannte Funktion, geänderte Signatur) meldet Git nicht. Tests nach jedem Merge.
  - **Fremde Konflikte gelöst, ohne zu fragen.** Verstehst du eine Seite nicht, frag die Person aus `git log --merge`, statt zu raten – oder brich mit `--abort` ab.

  ## Zusammenfassung

  - Ein Konflikt entsteht, wenn beide Seiten dieselbe oder direkt benachbarte Stellen unterschiedlich ändern oder sich auf Dateiebene widersprechen (modify/delete, add/add, Binärdateien).
  - Marker zeigen ours (HEAD) und theirs; mit `merge.conflictStyle = zdiff3` siehst du zusätzlich die Merge-Base.
  - Im Index liegen Stufe 1 (Basis), 2 (ours) und 3 (theirs); `git ls-files -u` listet sie, `git show :n:datei` zeigt sie, `git add` macht daraus Stufe 0.
  - `--ours`/`--theirs` wählen eine ganze Seite. Beim Rebase ist ours die neue Basis und theirs dein Commit.
  - Lockfiles und generierte Dateien werden aus der gemergten Quelle neu erzeugt, nicht von Hand zusammengeführt.
  - Abschluss mit `git add` und `--continue`, Rückweg mit `--abort`; `git diff --check` findet vergessene Marker.
  - `rerere` wiederholt gespeicherte Lösungen, `git log --merge` zeigt die beteiligten Commits, Tests fangen semantische Konflikte.
exercises:
  - id: wann-konflikt
    type: choice
    title: Streit oder Einigung?
    prompt: "`main` und `feature/api` haben sich von derselben Merge-Base aus weiterentwickelt. Welche Kombinationen von Änderungen führen bei `git merge feature/api` zu einem Konflikt?"
    options:
      - text: Beide Seiten ändern Zeile 12 von `src/api.py` auf unterschiedliche Weise.
        correct: true
        why: Das ist der klassische Inhaltskonflikt. Gegenüber der Basis haben beide Seiten dieselbe Stelle verschieden geändert.
      - text: "`main` ändert Zeile 3 von `config.yaml`, `feature/api` Zeile 4."
        correct: true
        why: Direkt benachbarte Änderungen landen im selben Block. Git kann nicht entscheiden, wie sie zusammengehören, und meldet einen Konflikt.
      - text: Beide Seiten ändern Zeile 12 von `src/api.py` exakt gleich.
        correct: false
        why: Identische Änderungen erkennt Git und übernimmt sie einmal. Es gibt nichts zu entscheiden.
      - text: "`main` löscht `src/legacy.py`, `feature/api` behebt darin einen Bug."
        correct: true
        why: Ein modify/delete-Konflikt. Git kann nicht wissen, ob die Löschung oder die Änderung gelten soll.
      - text: "`feature/api` benennt `src/api.py` in `src/routes.py` um, `main` ändert eine Zeile in `src/api.py`."
        correct: false
        why: Die Strategie `ort` erkennt die Umbenennung und wendet die Änderung von `main` auf `src/routes.py` an – ohne Konflikt.
    explanation: |
      Git vergleicht jede Seite mit der Merge-Base. Konflikte entstehen nur, wo beide Seiten sich widersprechen: dieselbe oder direkt benachbarte Stellen unterschiedlich geändert, oder eine Datei auf einer Seite gelöscht und auf der anderen geändert. Gleiche Änderungen und Umbenennungen kann `ort` auflösen. Umgekehrt bedeutet „kein Konflikt“ nicht, dass das Ergebnis fachlich stimmt – dafür braucht es Tests.
    resources:
      - title: git merge · True merge
        url: https://git-scm.com/docs/git-merge#_true_merge
      - title: merge-strategies · ort
        url: https://git-scm.com/docs/merge-strategies#Documentation/merge-strategies.txt-ort

  - id: status-im-konflikt
    type: output
    title: Drei Dateien, drei Zustände
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      printf 'timeout: 30\n' > config.yaml
      printf 'print("v1")\n' > app.py
      printf 'alt\n' > legacy.txt
      git add . && git commit -qm "Basis"
      git switch -qc feature
      printf 'timeout: 45\n' > config.yaml
      printf 'print("v2")\n' > app.py
      git rm -q legacy.txt && git commit -qam "Feature"
      git switch -q main
      printf 'timeout: 60\n' > config.yaml
      printf 'neu\n' > legacy.txt
      git commit -qam "Main"
      git merge feature > /dev/null || true
      git status --short
    expected: |
      M  app.py
      UU config.yaml
      UD legacy.txt
    verify: true
    explanation: |
      `app.py` hat nur `feature` geändert – Git übernimmt die Änderung und legt sie schon in den Index (`M` in der ersten Spalte). `config.yaml` haben beide Seiten unterschiedlich geändert: `UU`, beide Seiten „unmerged“. `legacy.txt` hat `main` geändert und `feature` gelöscht: `UD` – ours hat geändert (U), theirs gelöscht (D). Die Datei steht mit der Version von `main` im Arbeitsverzeichnis, bis du dich mit `git add` oder `git rm` entscheidest.
    resources:
      - title: git status · Short Format
        url: https://git-scm.com/docs/git-status#_short_format

  - id: index-stufen
    type: output
    title: Was liegt auf welcher Stufe?
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      printf 'timeout: 30\n' > config.yaml
      git add . && git commit -qm "Basis"
      git switch -qc feature/timeout
      printf 'timeout: 45\n' > config.yaml && git commit -qam "Timeout 45"
      git switch -q main
      printf 'timeout: 60\n' > config.yaml && git commit -qam "Timeout 60"
      git merge feature/timeout > /dev/null || true
      git ls-files -u | wc -l
      git show :1:config.yaml
      git show :3:config.yaml
      git add config.yaml
      git ls-files -s | wc -l
    expected: |
      3
      timeout: 30
      timeout: 45
      1
    verify: true
    explanation: |
      Während des Konflikts liegt `config.yaml` dreimal im Index: Stufe 1 ist die Merge-Base (`timeout: 30`), Stufe 2 ours (`main`, `timeout: 60`), Stufe 3 theirs (`feature/timeout`, `timeout: 45`). `git add` ersetzt die drei Einträge durch einen einzigen auf Stufe 0 – mit dem Inhalt aus dem Arbeitsverzeichnis, hier sogar noch mit Markern. Git prüft beim Markieren als gelöst nicht, ob die Datei sinnvoll ist.
    resources:
      - title: git ls-files · --unmerged
        url: https://git-scm.com/docs/git-ls-files#Documentation/git-ls-files.txt---unmerged
      - title: gitrevisions · :n:path
        url: https://git-scm.com/docs/gitrevisions#Documentation/gitrevisions.txt-npatheg0READMEREADME

  - id: ours-beim-rebase
    type: output
    title: Wem gehört „ours“?
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      printf 'timeout: 30\n' > config.yaml
      git add . && git commit -qm "Basis"
      git switch -qc feature/timeout
      printf 'timeout: 45\n' > config.yaml && git commit -qam "Timeout 45"
      git switch -q main
      printf 'timeout: 60\n' > config.yaml && git commit -qam "Timeout 60"
      git merge feature/timeout > /dev/null || true
      git restore --ours config.yaml && cat config.yaml
      git merge --abort
      git switch -q feature/timeout
      git rebase main > /dev/null 2>&1 || true
      git restore --ours config.yaml && cat config.yaml
      git restore --theirs config.yaml && cat config.yaml
    expected: |
      timeout: 60
      timeout: 60
      timeout: 45
    verify: true
    explanation: |
      Beim Merge auf `main` ist ours `main` – also `timeout: 60`. Beim Rebase von `feature/timeout` auf `main` setzt Git HEAD zuerst auf `main` und wendet dann den Commit „Timeout 45“ an. Während des Konflikts ist ours deshalb wieder `main` (`timeout: 60`), obwohl du den Rebase auf deinem Feature-Branch gestartet hast. Dein eigener Commit ist theirs (`timeout: 45`).
    resources:
      - title: git restore · --ours / --theirs
        url: https://git-scm.com/docs/git-restore#Documentation/git-restore.txt---ours
      - title: git checkout · --ours
        url: https://git-scm.com/docs/git-checkout#Documentation/git-checkout.txt---ours

  - id: conflictstyle-setzen
    type: command
    title: Die Basis immer sehen
    prompt: Stelle Git für alle deine Repositorys so ein, dass Konfliktmarker zusätzlich die Merge-Base zeigen und gemeinsame Zeilen beider Seiten aus dem Konfliktblock herausgezogen werden.
    answers:
      - git config --global merge.conflictStyle zdiff3
      - git config --global merge.conflictstyle zdiff3
      - git config set --global merge.conflictStyle zdiff3
      - git config set --global merge.conflictstyle zdiff3
    explanation: |
      `merge.conflictStyle` bestimmt das Format der Marker. `diff3` ergänzt den Block `|||||||` mit der Merge-Base, `zdiff3` (seit Git 2.35) zieht zusätzlich Zeilen, die auf beiden Seiten identisch sind, aus dem Konflikt heraus. Die Einstellung gehört in die globale Konfiguration, weil sie für jedes Repository nützlich ist. Konfigurationsschlüssel sind unabhängig von Groß- und Kleinschreibung.
    resources:
      - title: git config · merge.conflictStyle
        url: https://git-scm.com/docs/git-config#Documentation/git-config.txt-mergeconflictStyle

  - id: binaer-theirs
    type: command
    title: Das neue Logo gewinnt
    prompt: Hole für `assets/logo.png` die Version aus dem Branch, den du gerade mergst, ins Arbeitsverzeichnis. Nutze `git restore`.
    context: |
      Du stehst auf `main` und hast `git merge feature/rebrand` gestartet:

      ```text
      warning: Cannot merge binary files: assets/logo.png (HEAD vs. feature/rebrand)
      Auto-merging assets/logo.png
      CONFLICT (content): Merge conflict in assets/logo.png
      Automatic merge failed; fix conflicts and then commit the result.
      ```

      Das Design-Team hat entschieden: Das Logo aus `feature/rebrand` ist das neue.
    answers:
      - git restore --theirs assets/logo.png
      - git restore --theirs -- assets/logo.png
      - git restore assets/logo.png --theirs
    explanation: |
      Binärdateien kann Git nicht zeilenweise kombinieren; im Arbeitsverzeichnis bleibt die Version von ours liegen. Beim Merge ist theirs der hereingeholte Branch, also `feature/rebrand`. `git restore --theirs` kopiert Stufe 3 ins Arbeitsverzeichnis, die Datei ist danach aber noch ungelöst. Erst `git add assets/logo.png` markiert sie als gelöst. Die ältere Schreibweise `git checkout --theirs assets/logo.png` wirkt gleich.
    resources:
      - title: git restore · --theirs
        url: https://git-scm.com/docs/git-restore#Documentation/git-restore.txt---theirs
      - title: gitattributes · Marking files as binary
        url: https://git-scm.com/docs/gitattributes#_marking_files_as_binary

  - id: log-merge
    type: command
    title: Wer hat hier was geändert?
    prompt: Zeige in Kurzform (eine Zeile pro Commit) nur die Commits beider Seiten, die die konfliktbehafteten Dateien geändert haben.
    context: Du steckst mitten in einem Merge mit Konflikt in `config.yaml` und willst wissen, welche Commits von `main` und vom Feature-Branch dafür verantwortlich sind, um die Autorinnen zu fragen.
    answers:
      - git log --merge --oneline
      - git log --oneline --merge
    output: |
      d92b545 Timeout erhöhen
      e88f871 Retries konfigurieren
    explanation: |
      `--merge` beschränkt `git log` auf Commits im Bereich `HEAD...MERGE_HEAD`, die Pfade mit Konflikten berühren – also genau die Änderungen, die sich widersprechen. Die Option funktioniert nur, solange der Index ungelöste Einträge hat. Mit `-p` siehst du zusätzlich die Diffs, mit `--format='%h %an %s'` die Autoren.
    resources:
      - title: git log · --merge
        url: https://git-scm.com/docs/git-log#Documentation/git-log.txt---merge

  - id: aufloese-ablauf
    type: gap
    title: Einen Konflikt Schritt für Schritt lösen
    prompt: Ergänze die Befehle so, dass jeder Schritt tut, was im Kommentar steht.
    lang: bash
    code: |
      git merge feature/retry
      # CONFLICT (content): Merge conflict in src/client.py
      git ⟦status --short⟧            # Überblick: zeigt UU src/client.py
      git show ⟦:1:⟧src/client.py     # Stand der Merge-Base ansehen
      # src/client.py zusammenführen, Marker entfernen, Tests laufen lassen
      git ⟦add⟧ src/client.py         # als gelöst markieren
      git diff --cached ⟦--check⟧     # vergessene Konfliktmarker finden
      git ⟦merge --continue⟧          # Merge-Commit erzeugen
    gaps:
      - label: Kurzer Status
        hint: Der Status in zwei Buchstaben pro Datei.
        accept: ["status -s"]
      - label: Basis-Stufe
        hint: "Die Stufen heißen 1, 2 und 3; die Syntax ist `:n:`."
      - label: Als gelöst markieren
        hint: Derselbe Befehl, mit dem du Änderungen in den Index legst.
      - label: Marker finden
        hint: Eine Option von `git diff`, die Whitespace-Fehler und übrig gebliebene Marker meldet.
      - label: Abschließen
        hint: Der Merge soll fortgesetzt werden.
        accept: ["commit", "commit --no-edit", "merge --continue --no-edit"]
    explanation: |
      `git status --short` zeigt, welche Dateien in welchem Zustand sind. `git show :1:pfad` holt die Merge-Base aus dem Index – ohne sie ist nicht zu erkennen, welche Seite was geändert hat. `git add` ersetzt die Stufen 1–3 durch die gelöste Datei, prüft aber nicht deren Inhalt. Deshalb meldet `git diff --cached --check` übrig gebliebene `<<<<<<<`-Zeilen, bevor sie im Commit landen. `git merge --continue` erzeugt den Merge-Commit wie `git commit`.
    resources:
      - title: git merge · How to resolve conflicts
        url: https://git-scm.com/docs/git-merge#_how_to_resolve_conflicts

  - id: rebase-falsche-seite
    type: bug
    title: Der Rabatt ist weg
    prompt: |
      Die Befehle sollen `feature/rabatt` auf das aktuelle `main` heben. Bei einem Konflikt in `src/cart.py` soll die Feature-Version gewinnen. Nach dem Rebase steht in `src/cart.py` aber die Version von `main`, die Rabatt-Logik fehlt, und der Commit „Rabattcode anwenden“ ändert nur noch `tests/test_cart.py`. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: bash
    code: |
      # feature/rabatt auf main heben; bei Konflikt in src/cart.py gewinnt das Feature
      git switch feature/rabatt
      git rebase main
      git checkout --ours src/cart.py
      git add src/cart.py
      git rebase --continue
    lines: [4]
    fix:
      - line: 4
        answers:
          - git checkout --theirs src/cart.py
          - git checkout --theirs -- src/cart.py
          - git restore --theirs src/cart.py
          - git restore --theirs -- src/cart.py
    explanation: |
      Während eines Rebase ist HEAD die neue Basis `main`, auf die Git deine Commits einzeln anwendet. `--ours` holt deshalb die Version von `main`, `--theirs` die deines Commits. Mit `--ours` wird der Konflikt „gelöst“, indem die Rabatt-Änderung verworfen wird; übrig bleibt nur die Testdatei. Richtig ist `--theirs`. Noch besser: Hat `main` in der Datei ebenfalls etwas Sinnvolles geändert (etwa eine Rundung), nimmst du keine ganze Seite, sondern kombinierst beide Änderungen von Hand.
    resources:
      - title: git checkout · --ours / --theirs
        url: https://git-scm.com/docs/git-checkout#Documentation/git-checkout.txt---ours
      - title: Pro Git · Advanced Merging
        url: https://git-scm.com/book/en/v2/Git-Tools-Advanced-Merging

  - id: zdiff3-erklaeren
    type: explain
    title: Premium trifft Konfiguration
    prompt: Beim Merge von `feature/env-config` nach `main` erscheint dieser Konflikt (Stil `zdiff3`). Erkläre, was jede Seite gegenüber der Basis geändert hat, wie das richtige Ergebnis aussieht und wie du den Konflikt abschließt.
    lang: python
    code: |
      import os


      def rate_limit(user):
      <<<<<<< HEAD
          if user.is_premium:
              return 1000
          return 100
      ||||||| 7ae8c61
          return 100
      =======
          return int(os.environ.get("RATE_LIMIT", 100))
      >>>>>>> feature/env-config
    points:
      - "Der Block zwischen `|||||||` und `=======` ist die Merge-Base: früher lieferte die Funktion immer 100."
      - "`main` (HEAD, ours) hat ein Sonderlimit von 1000 für Premium-Nutzer ergänzt, das Standardlimit blieb 100."
      - "`feature/env-config` (theirs) hat das Standardlimit über die Umgebungsvariable `RATE_LIMIT` konfigurierbar gemacht."
      - "Das richtige Ergebnis enthält beides: die Premium-Abfrage und danach `return int(os.environ.get(\"RATE_LIMIT\", 100))` – keine Seite allein ist korrekt."
      - Danach alle Marker entfernen, Tests ausführen, `git add` und `git merge --continue`.
    explanation: |
      Mit der Basis im Blick ist der Konflikt eindeutig: Ursprünglich stand dort `return 100`. `main` hat davor eine Premium-Abfrage mit Limit 1000 eingefügt und den Standardwert unverändert gelassen. `feature/env-config` hat den Standardwert durch eine Umgebungsvariable ersetzt. Die Absichten widersprechen sich nicht, sie berühren nur dieselben Zeilen. Das Ergebnis ist deshalb die Premium-Abfrage von `main`, gefolgt von `return int(os.environ.get("RATE_LIMIT", 100))`. Nähme ich nur ours, wäre das Limit nicht mehr konfigurierbar; nähme ich nur theirs, bekämen Premium-Nutzer das normale Limit. Danach entferne ich alle Markerzeilen, lasse die Tests für beide Fälle laufen, markiere die Datei mit `git add` und schließe mit `git merge --continue` ab.
    resources:
      - title: git config · merge.conflictStyle
        url: https://git-scm.com/docs/git-config#Documentation/git-config.txt-mergeconflictStyle

  - id: labor-beide-absichten
    type: practice
    title: "Labor: Keine Seite hat recht"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository. Die Kontrolle am Ende braucht `python3`.

      Das Skript bleibt beim Merge von `feature/retry` nach `main` mit einem Konflikt in `src/client.py` stehen. Löse den Konflikt so, dass **beide** Absichten erhalten bleiben: Die Änderung von `main` an der Timeout-Konstante und die Wiederholungen aus dem Feature. Übernimmst du nur eine Seite, ist der Client kaputt. Schließe den Merge danach mit einem Merge-Commit ab. Prüfe mit dem Python-Aufruf aus der Kontrolle und mit `git status --short`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      mkdir src
      cat > src/client.py <<'EOF'
      TIMEOUT = 30


      def fetch_user(session, user_id):
          return session.get(f"/users/{user_id}", timeout=TIMEOUT)
      EOF
      git add src && git commit -qm "API-Client anlegen"
      git switch -qc feature/retry
      cat > src/client.py <<'EOF'
      TIMEOUT = 30


      def fetch_user(session, user_id):
          return session.get(f"/users/{user_id}", timeout=TIMEOUT, retries=3)
      EOF
      git commit -qam "Fehlgeschlagene Requests wiederholen"
      git switch -q main
      cat > src/client.py <<'EOF'
      TIMEOUT_SECONDS = 60


      def fetch_user(session, user_id):
          return session.get(f"/users/{user_id}", timeout=TIMEOUT_SECONDS)
      EOF
      git commit -qam "Timeout umbenennen und erhöhen"
      git merge --no-edit feature/retry || true
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      mkdir src
      cat > src/client.py <<'EOF'
      TIMEOUT = 30


      def fetch_user(session, user_id):
          return session.get(f"/users/{user_id}", timeout=TIMEOUT)
      EOF
      git add src && git commit -qm "API-Client anlegen"
      git switch -qc feature/retry
      cat > src/client.py <<'EOF'
      TIMEOUT = 30


      def fetch_user(session, user_id):
          return session.get(f"/users/{user_id}", timeout=TIMEOUT, retries=3)
      EOF
      git commit -qam "Fehlgeschlagene Requests wiederholen"
      git switch -q main
      cat > src/client.py <<'EOF'
      TIMEOUT_SECONDS = 60


      def fetch_user(session, user_id):
          return session.get(f"/users/{user_id}", timeout=TIMEOUT_SECONDS)
      EOF
      git commit -qam "Timeout umbenennen und erhöhen"
      git merge --no-edit feature/retry || true
      # Reparatur: neuer Konstantenname von main, retries vom Feature
      cat > src/client.py <<'EOF'
      TIMEOUT_SECONDS = 60


      def fetch_user(session, user_id):
          return session.get(f"/users/{user_id}", timeout=TIMEOUT_SECONDS, retries=3)
      EOF
      git add src/client.py
      git commit -q --no-edit
      # Kontrolle: der Client ruft mit Timeout 60 und 3 Wiederholungen auf
      test "$(git log -1 --format=%P | wc -w)" -eq 2
      python3 -B - <<'EOF'
      import sys
      sys.path.insert(0, "src")
      import client
      class FakeSession:
          def get(self, url, **kwargs):
              return kwargs
      assert client.fetch_user(FakeSession(), 7) == {"timeout": 60, "retries": 3}
      EOF
      test -z "$(git status --porcelain)"
    checklist:
      - "`src/client.py` enthält keine Markerzeilen mehr und nutzt `TIMEOUT_SECONDS` zusammen mit `retries=3`."
      - "Die Python-Kontrolle aus der Musterlösung läuft ohne `AssertionError` oder `NameError`."
      - "`git log -1 --format=%P` zeigt zwei Eltern – der Merge ist abgeschlossen."
      - "`git status --short` ist leer."
    verify: true
    hints:
      - "Schau dir die Basis an: `git show :1:src/client.py`. Was hat jede Seite gegenüber diesem Stand geändert?"
      - "`main` hat die Konstante umbenannt und den Wert erhöht, das Feature hat `retries=3` ergänzt. Übernimmst du theirs, fehlen Wert und Name von `main`."
      - "Schreibe die Zeile als `timeout=TIMEOUT_SECONDS, retries=3`, dann `git add src/client.py` und `git commit --no-edit`."
    explanation: |
      Die Zeile mit `session.get` haben beide Seiten geändert, deshalb der Konflikt. Die erste Zeile hat nur `main` geändert, die hat Git schon übernommen: Oben steht `TIMEOUT_SECONDS = 60`. Wer jetzt mit `--theirs` die Feature-Zeile nimmt, verweist auf die Konstante `TIMEOUT`, die es nicht mehr gibt – ein `NameError` zur Laufzeit, den Git nicht bemerkt. Wer `--ours` nimmt, verliert die Wiederholungen. Richtig ist die Kombination beider Absichten. Genau diese Art Konflikt zeigt, warum ein Merge erst nach grünen Tests fertig ist.
    resources:
      - title: git merge · How to resolve conflicts
        url: https://git-scm.com/docs/git-merge#_how_to_resolve_conflicts

  - id: labor-modify-delete
    type: practice
    title: "Labor: Gelöscht und repariert"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Auf `cleanup` wurde `scripts/deploy_old.sh` durch ein neues `scripts/deploy.sh` ersetzt. Auf `main` hat jemand im alten Skript einen Fix gemacht: Es bricht jetzt bei Fehlern ab (`set -eu`). Der Merge von `cleanup` nach `main` bleibt stehen.

      Lies `git status`. Stelle dann diesen Zustand her: Das alte Skript ist gelöscht, der Fix steckt als eigene Zeile `set -eu` direkt nach der Shebang-Zeile im neuen `scripts/deploy.sh`, der Merge ist mit einem Merge-Commit abgeschlossen. Prüfe mit `git show --stat HEAD` und `git status --short`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      mkdir scripts
      printf '#!/bin/sh\nscp -r dist/* deploy@web01:/var/www/shop/\n' > scripts/deploy_old.sh
      git add scripts && git commit -qm "Deploy per scp"
      # Branch cleanup ersetzt das alte Skript durch ein neues mit rsync
      git switch -qc cleanup
      printf '#!/bin/sh\nnpm run build\nrsync -az --delete dist/ deploy@web01:/var/www/shop/\n' > scripts/deploy.sh
      git rm -q scripts/deploy_old.sh
      git add scripts && git commit -qm "Deploy auf rsync umstellen"
      # Auf main wurde das alte Skript währenddessen repariert
      git switch -q main
      printf '#!/bin/sh\nset -eu\nscp -r dist/* deploy@web01:/var/www/shop/\n' > scripts/deploy_old.sh
      git commit -qam "Deploy bei Fehlern abbrechen"
      git merge --no-edit cleanup || true
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      mkdir scripts
      printf '#!/bin/sh\nscp -r dist/* deploy@web01:/var/www/shop/\n' > scripts/deploy_old.sh
      git add scripts && git commit -qm "Deploy per scp"
      # Branch cleanup ersetzt das alte Skript durch ein neues mit rsync
      git switch -qc cleanup
      printf '#!/bin/sh\nnpm run build\nrsync -az --delete dist/ deploy@web01:/var/www/shop/\n' > scripts/deploy.sh
      git rm -q scripts/deploy_old.sh
      git add scripts && git commit -qm "Deploy auf rsync umstellen"
      # Auf main wurde das alte Skript währenddessen repariert
      git switch -q main
      printf '#!/bin/sh\nset -eu\nscp -r dist/* deploy@web01:/var/www/shop/\n' > scripts/deploy_old.sh
      git commit -qam "Deploy bei Fehlern abbrechen"
      git merge --no-edit cleanup || true
      # Diagnose: git status zeigt "deleted by them: scripts/deploy_old.sh"
      # Reparatur: Löschung akzeptieren, den Fix ins neue Skript übertragen
      git rm -q scripts/deploy_old.sh
      printf '#!/bin/sh\nset -eu\nnpm run build\nrsync -az --delete dist/ deploy@web01:/var/www/shop/\n' > scripts/deploy.sh
      git add scripts/deploy.sh
      git commit -q --no-edit
      # Kontrolle
      test "$(git log -1 --format=%P | wc -w)" -eq 2
      test -z "$(git ls-tree --name-only HEAD scripts/deploy_old.sh)"
      test "$(sed -n 2p scripts/deploy.sh)" = "set -eu"
      grep -q '^rsync -az --delete dist/' scripts/deploy.sh
      test -z "$(git status --porcelain)"
    checklist:
      - "`git status` zeigte `deleted by them: scripts/deploy_old.sh` (Kurzform `UD`), und du kannst erklären, was „them“ hier ist."
      - "`git ls-tree --name-only HEAD scripts/` listet nur noch `scripts/deploy.sh`."
      - "`scripts/deploy.sh` hat in Zeile 2 `set -eu` und nutzt weiter `rsync`."
      - "`git log -1 --format=%P` zeigt zwei Eltern, `git status --short` ist leer."
    verify: true
    hints:
      - "Bei modify/delete gibt es keine Marker. Die Entscheidung triffst du mit `git add` (Datei behalten) oder `git rm` (Löschung übernehmen)."
      - Das alte Skript soll weg – aber was wird dann aus dem Fix von `main`?
      - "`git rm scripts/deploy_old.sh`, `set -eu` als zweite Zeile in `scripts/deploy.sh` einfügen, `git add scripts/deploy.sh`, `git commit --no-edit`."
    explanation: |
      Git meldet `CONFLICT (modify/delete)`, weil eine Seite (theirs, `cleanup`) die Datei gelöscht und die andere (ours, `main`) sie geändert hat – `UD` im Kurzformat. Git kann das nicht entscheiden und lässt die geänderte Version liegen. Nur `git rm` zu tippen, wäre technisch eine Lösung, würde aber den Bugfix von `main` still verwerfen: Das neue Skript liefe weiter, auch wenn der Build scheitert. Fachlich richtig ist, die Löschung zu übernehmen und die Absicht des Fixes in die Ersatzdatei zu tragen. Git hat die Umbenennung hier nicht erkannt, weil das neue Skript zu verschieden ist – dann ist das Übertragen deine Aufgabe.
    resources:
      - title: git status · Short Format
        url: https://git-scm.com/docs/git-status#_short_format
      - title: git rm
        url: https://git-scm.com/docs/git-rm

  - id: labor-lockfile
    type: practice
    title: "Labor: Konflikt im Lockfile"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Das Projekt erzeugt `requirements.lock` mit dem Skript `lock.sh` aus `requirements.in` – so wie `uv lock` oder `npm install` es mit echten Lockfiles tun. Beide Branches haben eine Abhängigkeit ergänzt. Der Merge von `feature/httpx` nach `main` bleibt mit einem Konflikt im Lockfile stehen.

      Löse den Konflikt so, wie man es mit generierten Dateien tut, und schließe den Merge ab. Am Ende muss `requirements.lock` beide neuen Pakete enthalten und exakt dem entsprechen, was `sh lock.sh` aus dem gemergten `requirements.in` erzeugt. Prüfe mit `sh lock.sh && git diff --quiet && echo passt`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      cat > lock.sh <<'EOF'
      #!/bin/sh
      # Erzeugt requirements.lock aus requirements.in – nie von Hand bearbeiten
      {
        echo "# generiert von lock.sh"
        echo "# pruefsumme: $(cksum < requirements.in | cut -d ' ' -f 1)"
        sort requirements.in
      } > requirements.lock
      EOF
      printf 'django==5.2\npytest==8.3\nrequests==2.32\n' > requirements.in
      sh lock.sh
      git add . && git commit -qm "Abhängigkeiten festlegen"
      git switch -qc feature/httpx
      printf 'django==5.2\nhttpx==0.28\npytest==8.3\nrequests==2.32\n' > requirements.in
      sh lock.sh && git commit -qam "httpx hinzufügen"
      git switch -q main
      printf 'django==5.2\npytest==8.3\nrequests==2.32\nsentry-sdk==2.19\n' > requirements.in
      sh lock.sh && git commit -qam "sentry-sdk hinzufügen"
      git merge --no-edit feature/httpx || true
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      cat > lock.sh <<'EOF'
      #!/bin/sh
      # Erzeugt requirements.lock aus requirements.in – nie von Hand bearbeiten
      {
        echo "# generiert von lock.sh"
        echo "# pruefsumme: $(cksum < requirements.in | cut -d ' ' -f 1)"
        sort requirements.in
      } > requirements.lock
      EOF
      printf 'django==5.2\npytest==8.3\nrequests==2.32\n' > requirements.in
      sh lock.sh
      git add . && git commit -qm "Abhängigkeiten festlegen"
      git switch -qc feature/httpx
      printf 'django==5.2\nhttpx==0.28\npytest==8.3\nrequests==2.32\n' > requirements.in
      sh lock.sh && git commit -qam "httpx hinzufügen"
      git switch -q main
      printf 'django==5.2\npytest==8.3\nrequests==2.32\nsentry-sdk==2.19\n' > requirements.in
      sh lock.sh && git commit -qam "sentry-sdk hinzufügen"
      git merge --no-edit feature/httpx || true
      # Diagnose: requirements.in wurde sauber gemergt (M), nur requirements.lock ist UU
      # Reparatur: Lockfile aus der gemergten Quelle neu erzeugen
      sh lock.sh
      git add requirements.lock
      git commit -q --no-edit
      # Kontrolle
      test "$(git log -1 --format=%P | wc -w)" -eq 2
      grep -qx 'httpx==0.28' requirements.lock
      grep -qx 'sentry-sdk==2.19' requirements.lock
      sh lock.sh
      git diff --quiet
      test -z "$(git status --porcelain)"
    checklist:
      - "`git status --short` zeigte vor der Reparatur `M  requirements.in` und `UU requirements.lock` – die Quelle war schon sauber gemergt."
      - Du hast das Lockfile mit `sh lock.sh` neu erzeugt, nicht von Hand zusammengesetzt.
      - "`requirements.lock` enthält `httpx==0.28` und `sentry-sdk==2.19` und keine Markerzeilen."
      - "`sh lock.sh && git diff --quiet` ist erfolgreich, `git log -1 --format=%P` zeigt zwei Eltern."
    verify: true
    hints:
      - Welche der beiden Dateien ist die Quelle, welche das Erzeugnis? Wie sieht `requirements.in` nach dem Merge aus?
      - Die Prüfsumme kannst du nicht sinnvoll von Hand wählen. Lass das Werkzeug rechnen.
      - "`sh lock.sh`, dann `git add requirements.lock` und `git commit --no-edit`."
    explanation: |
      `requirements.in` haben beide Seiten an verschiedenen Stellen geändert – Git hat die Datei ohne Konflikt kombiniert. Im Lockfile dagegen steht eine Prüfsumme über die ganze Quelle, die auf beiden Seiten anders ist. Eine Seite zu wählen oder eine der Prüfsummen zu behalten, ergäbe ein Lockfile, das nicht zu `requirements.in` passt: Mit `--theirs` fehlt `sentry-sdk`, mit `--ours` fehlt `httpx`, und die Prüfsumme stimmt in keinem Fall. Generierte Dateien behandelst du deshalb immer gleich: Quelle mergen, Datei mit dem Werkzeug neu erzeugen, beides committen. In echten Projekten sind das `npm install`, `uv lock` oder `poetry lock`, und CI prüft mit `npm ci` oder `uv sync --locked`, dass Lockfile und Quelle zusammenpassen.
    resources:
      - title: Pro Git · Advanced Merging
        url: https://git-scm.com/book/en/v2/Git-Tools-Advanced-Merging

  - id: labor-marker-committet
    type: practice
    title: "Labor: Marker im Commit"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Beim Merge von `feature/perf` nach `main` gab es zwei Konflikte in `config.yaml`. Einer wurde gelöst, dann hat jemand alles committet. Der Merge ist nicht gepusht, aber die App startet nicht mehr: Der YAML-Parser stolpert über `<<<<<<< HEAD`.

      Finde die Marker mit Git-Mitteln. Stelle dann den Zustand her, als wäre der Merge gleich richtig gewesen: `log_level: warning` wie bereits gelöst, `pool_size: 20` aus `feature/perf`, keine Marker, **kein** zusätzlicher Reparatur-Commit, und der Merge-Commit hat weiter zwei Eltern. Prüfe mit `git diff --check HEAD^1 HEAD` und `git log --graph --format=%s`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      printf 'app:\n  name: shop\n  log_level: info\ndatabase:\n  pool_size: 5\n  timeout: 10\n' > config.yaml
      git add config.yaml && git commit -qm "Konfiguration anlegen"
      git switch -qc feature/perf
      printf 'app:\n  name: shop\n  log_level: debug\ndatabase:\n  pool_size: 20\n  timeout: 10\n' > config.yaml
      git commit -qam "Pool für Lasttest vergrößern"
      git switch -q main
      printf 'app:\n  name: shop\n  log_level: warning\ndatabase:\n  pool_size: 10\n  timeout: 10\n' > config.yaml
      git commit -qam "Produktionswerte setzen"
      git merge --no-edit feature/perf > /dev/null || true
      # Nur der erste Konflikt wurde gelöst, dann wurde alles committet
      cat > config.yaml <<'EOF'
      app:
        name: shop
        log_level: warning
      database:
      <<<<<<< HEAD
        pool_size: 10
      =======
        pool_size: 20
      >>>>>>> feature/perf
        timeout: 10
      EOF
      git add config.yaml
      git commit -q --no-edit
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      printf 'app:\n  name: shop\n  log_level: info\ndatabase:\n  pool_size: 5\n  timeout: 10\n' > config.yaml
      git add config.yaml && git commit -qm "Konfiguration anlegen"
      git switch -qc feature/perf
      printf 'app:\n  name: shop\n  log_level: debug\ndatabase:\n  pool_size: 20\n  timeout: 10\n' > config.yaml
      git commit -qam "Pool für Lasttest vergrößern"
      git switch -q main
      printf 'app:\n  name: shop\n  log_level: warning\ndatabase:\n  pool_size: 10\n  timeout: 10\n' > config.yaml
      git commit -qam "Produktionswerte setzen"
      git merge --no-edit feature/perf > /dev/null || true
      # Nur der erste Konflikt wurde gelöst, dann wurde alles committet
      cat > config.yaml <<'EOF'
      app:
        name: shop
        log_level: warning
      database:
      <<<<<<< HEAD
        pool_size: 10
      =======
        pool_size: 20
      >>>>>>> feature/perf
        timeout: 10
      EOF
      git add config.yaml
      git commit -q --no-edit
      # Diagnose: git diff --check HEAD^1 HEAD meldet "leftover conflict marker"
      # Reparatur: Datei korrigieren und den Merge-Commit ersetzen
      printf 'app:\n  name: shop\n  log_level: warning\ndatabase:\n  pool_size: 20\n  timeout: 10\n' > config.yaml
      git add config.yaml
      git commit -q --amend --no-edit
      # Kontrolle
      test "$(git log -1 --format=%P | wc -w)" -eq 2
      test "$(git rev-list --count HEAD)" -eq 4
      git merge-base --is-ancestor feature/perf HEAD
      git diff --check HEAD^1 HEAD
      grep -qx '  log_level: warning' config.yaml
      grep -qx '  pool_size: 20' config.yaml
      test "$(grep -c pool_size config.yaml)" -eq 1
      test -z "$(git status --porcelain)"
    checklist:
      - "`git diff --check HEAD^1 HEAD` meldete vor der Reparatur `leftover conflict marker` und gibt danach nichts mehr aus."
      - "`config.yaml` enthält `log_level: warning` und genau einmal `pool_size: 20`."
      - "`git rev-list --count HEAD` ist weiterhin 4 – kein zusätzlicher Commit."
      - "`git log -1 --format=%P` zeigt zwei Eltern, `git status --short` ist leer."
    verify: true
    hints:
      - "`git diff --check` findet übrig gebliebene Marker. Gegen welchen Commit vergleichst du einen Merge-Commit?"
      - Der Merge ist nicht gepusht. Welcher Befehl ersetzt den letzten Commit, statt einen neuen anzuhängen?
      - "Datei korrigieren, `git add config.yaml`, `git commit --amend --no-edit`."
    explanation: |
      `git add` markiert eine Datei als gelöst, egal was darin steht – deshalb landen Marker so leicht im Commit. `git diff --check HEAD^1 HEAD` vergleicht das Ergebnis mit dem ersten Elternteil und meldet jede Markerzeile als `leftover conflict marker`; vor dem Commit leistet `git diff --cached --check` dasselbe. `git commit --amend` ersetzt den Merge-Commit durch einen neuen mit korrigiertem Tree, aber denselben beiden Eltern. Die History sieht aus, als wäre der Merge gleich richtig gewesen. Wäre der Merge schon gepusht, würdest du stattdessen einen normalen Korrektur-Commit anhängen, statt geteilte History umzuschreiben.
    resources:
      - title: git diff · --check
        url: https://git-scm.com/docs/git-diff#Documentation/git-diff.txt---check
      - title: git commit · --amend
        url: https://git-scm.com/docs/git-commit#Documentation/git-commit.txt---amend
