id: stash-worktrees
title: Stash und Worktrees
level: 2
minutes: 150
summary: Du legst halbfertige Arbeit sicher beiseite, holst sie konfliktfest zurück und arbeitest mit Worktrees an zwei Branches gleichzeitig – ohne Arbeit zu verlieren.
goals:
  - Du sagst vorher, welche Änderungen `git stash push` mit und ohne `-u`, `-a`, `--keep-index` und `--staged` sichert.
  - Du erklärst einen Stash als Commit mit zwei oder drei Eltern im Reflog von `refs/stash`.
  - Du löst einen Konflikt nach `git stash pop` sauber auf und entfernst den Eintrag danach bewusst.
  - Du wählst begründet zwischen Stash, WIP-Commit und Worktree.
  - Du verwaltest Worktrees mit `add`, `list`, `remove`, `prune` und `lock` und erklärst, was sie teilen und was nicht.
resources:
  - title: git-stash – Referenz
    url: https://git-scm.com/docs/git-stash
  - title: git-worktree – Referenz
    url: https://git-scm.com/docs/git-worktree
  - title: Pro Git · Stashing and Cleaning
    url: https://git-scm.com/book/en/v2/Git-Tools-Stashing-and-Cleaning
  - title: gitrevisions – Reflog-Syntax
    url: https://git-scm.com/docs/gitrevisions#Documentation/gitrevisions.txt-refnamenegmaster1
lesson: |
  Du steckst mitten im Login-Feature: `src/auth.py` ist halb umgebaut, ein neuer Test liegt noch untracked im Verzeichnis, die Tests sind rot. Da meldet der Support einen Fehler in Version 2.4, der heute noch behoben werden muss. Du brauchst jetzt ein sauberes Arbeitsverzeichnis auf `release/2.4` – ohne die halbe Arbeit zu verlieren und ohne sie halbfertig auf `feature/login` zu committen.

  Git bietet dafür drei Werkzeuge. Der **Stash** legt Änderungen für ein paar Minuten beiseite. Ein **WIP-Commit** parkt sie sichtbar auf dem Branch. Ein **Worktree** gibt dir ein zweites Arbeitsverzeichnis für dasselbe Repository, sodass du gar nicht erst wechseln musst. Welches Werkzeug passt, ergibt sich aus dem Datenmodell dahinter.

  ## Stash: Änderungen beiseitelegen

  ```console
  $ git status --short
   M src/auth.py
  ?? tests/test_auth.py
  $ git stash push -u -m "Login: leere Benutzer abweisen"
  Saved working directory and index state On feature/login: Login: leere Benutzer abweisen
  $ git status --short
  $ git stash list
  stash@{0}: On feature/login: Login: leere Benutzer abweisen
  stash@{1}: WIP on main: 3f2c9e1 Rate-Limit für Login-Versuche
  ```

  `git stash push` sichert deine Änderungen und setzt Index und Arbeitsverzeichnis danach auf den Stand von `HEAD` zurück. Das Arbeitsverzeichnis ist sauber, du kannst den Branch wechseln. `git stash` ohne Unterbefehl bedeutet dasselbe wie `git stash push`. Gib immer eine Nachricht mit `-m` an: Der zweite Eintrag oben zeigt die Standardnachricht „WIP on main: …“ – nach einer Woche weiß niemand mehr, was darin steckt.

  Entscheidend ist, **was** gesichert wird ([git-stash · Optionen](https://git-scm.com/docs/git-stash#_options)):

  | Aufruf | Was im Stash landet |
  | --- | --- |
  | `git stash push` | gestagte und nicht gestagte Änderungen an **getrackten** Dateien (auch neu gestagte Dateien) |
  | `git stash push -u` (`--include-untracked`) | zusätzlich untracked Dateien |
  | `git stash push -a` (`--all`) | zusätzlich ignorierte Dateien – zieht `node_modules/` und `.venv/` mit, selten sinnvoll |
  | `git stash push -S` (`--staged`) | nur den Index, seit Git 2.35 |
  | `git stash push -k` (`--keep-index`) | alles, aber der Index bleibt zusätzlich im Arbeitsverzeichnis stehen |
  | `git stash push -p` | interaktiv Hunk für Hunk auswählen |
  | `git stash push -- config.yaml` | nur die angegebenen Pfade |

  Ohne `-u` bleibt eine neue Datei wie `tests/test_auth.py` im Arbeitsverzeichnis liegen. Sie wandert beim Branchwechsel mit – und landet schnell in einem Commit, in den sie nicht gehört. `--keep-index` ist nützlich, um genau das zu testen, was du gleich committen willst: Der Rest verschwindet kurz, der gestagte Stand bleibt stehen ([git-stash · --keep-index](https://git-scm.com/docs/git-stash#Documentation/git-stash.txt---keep-index)). `--staged` ist das Gegenstück: Es sichert nur den Index und lässt alles andere stehen ([git-stash · --staged](https://git-scm.com/docs/git-stash#Documentation/git-stash.txt---staged)).

  Hineinschauen, ohne etwas zu verändern:

  ```console
  $ git stash show
   src/auth.py | 2 ++
   1 file changed, 2 insertions(+)
  $ git stash show --include-untracked
   src/auth.py        | 2 ++
   tests/test_auth.py | 2 ++
   2 files changed, 4 insertions(+)
  ```

  `git stash show` zeigt eine Übersicht, `git stash show -p stash@{1}` den Patch eines älteren Eintrags. Untracked Dateien siehst du nur mit `--include-untracked`. `stash@{0}` ist der neueste Eintrag. Die Nummern verschieben sich, sobald ein Eintrag dazukommt oder entfernt wird – verlass dich in Skripten nicht auf `stash@{2}`. In PowerShell musst du `'stash@{1}'` quoten.

  ## Was ein Stash im Datenmodell ist

  Ein Stash ist kein eigener Objekttyp, sondern ein Commit – genauer ein Merge-Commit mit zwei oder drei Eltern:

  ```console
  $ git log --graph --oneline stash
  *-.   279f6b0 On feature/login: Login: leere Benutzer abweisen
  |\ \
  | | * 3989ff7 untracked files on feature/login: 3110406 Login-Endpunkt anlegen
  | * a27269c index on feature/login: 3110406 Login-Endpunkt anlegen
  |/
  * 3110406 Login-Endpunkt anlegen
  ```

  ```text
  W  279f6b0  Stand des Arbeitsverzeichnisses        <- refs/stash = stash@{0}
  ├─ 1. Elternteil: H  3110406  der Commit, auf dem du standest
  ├─ 2. Elternteil: I  a27269c  Stand des Index (Elternteil: H)
  └─ 3. Elternteil: U  3989ff7  untracked Dateien (nur mit -u/-a, ohne Eltern)
  ```

  `refs/stash` zeigt immer auf den neuesten Stash. Die älteren Einträge stehen im **Reflog** dieser Ref: `stash@{1}` ist dieselbe Syntax wie `HEAD@{1}` und bedeutet „der vorige Wert von `refs/stash`“ ([gitrevisions](https://git-scm.com/docs/gitrevisions#Documentation/gitrevisions.txt-refnamenegmaster1)). `git stash list` ist im Kern `git reflog show stash`. Der Abschnitt „Discussion“ der Referenz beschreibt diesen Aufbau genau ([git-stash · Discussion](https://git-scm.com/docs/git-stash#_discussion)).

  Daraus folgen vier Dinge, die du im Alltag brauchst:

  - Ein Stash hängt am **Commit H**, nicht an einem Branch. Du kannst ihn auf jedem Branch anwenden. Der Name „On feature/login“ ist nur Text.
  - `git stash drop` löscht nur den Reflog-Eintrag. Der Commit W existiert weiter, bis die Garbage Collection ihn entfernt. Einen versehentlich gelöschten Stash findest du mit `git fsck --unreachable` wieder – das Rezept steht im Modul [Reset und Reflog](/git/reset-reflog).
  - Der Stash ist **lokal**. `git push` überträgt `refs/stash` nicht. Ein Stash ist kein Backup.
  - Es gibt **einen** Stash-Stapel pro Repository – für alle Branches und alle Worktrees gemeinsam.

  > [!MERKE]
  > Ein Stash ist ein Commit W mit den Eltern H (wo du standest), I (Index) und optional U (untracked). `refs/stash` zeigt auf den neuesten, ältere Einträge leben im Reflog von `refs/stash`.

  ## Zurückholen: apply, pop und Konflikte

  `git stash apply` wendet den neuesten Eintrag an und lässt ihn in der Liste. `git stash pop` wendet ihn an und löscht ihn – aber **nur, wenn das Anwenden ohne Konflikt gelingt**. Beide akzeptieren einen Eintrag als Argument: `git stash apply stash@{1}`.

  Anwenden ist ein Drei-Wege-Merge: Basis ist H, auf der einen Seite steht dein aktueller Stand, auf der anderen W. Deshalb klappt ein Stash auch auf einem anderen Branch, und deshalb kann er Konflikte erzeugen. Ohne `--index` landen Änderungen an bestehenden Dateien als nicht gestagte Änderungen im Arbeitsverzeichnis; neu hinzugefügte Dateien bleiben gestagt. `git stash apply --index` stellt auch die Aufteilung zwischen Index und Arbeitsverzeichnis wieder her.

  Hat sich `config.yaml` seit dem Stash auf `main` geändert, sieht das so aus:

  ```console
  $ git stash pop
  Auto-merging config.yaml
  CONFLICT (content): Merge conflict in config.yaml
  On branch main
  Unmerged paths:
    (use "git restore --staged <file>..." to unstage)
    (use "git add <file>..." to mark resolution)
          both modified:   config.yaml

  no changes added to commit (use "git add" and/or "git commit -a")
  The stash entry is kept in case you need it again.
  ```

  ```text
  <<<<<<< Updated upstream
  debug: false
  port: 9000
  =======
  debug: true
  port: 8000
  >>>>>>> Stashed changes
  workers: 4
  ```

  „Updated upstream“ ist dein aktueller Stand, „Stashed changes“ der Inhalt des Stash. Die letzte Zeile der Ausgabe ist die wichtigste: Der Eintrag ist **noch da**. Der saubere Ablauf:

  ```bash
  # 1. Datei fachlich richtig zusammenführen, Marker entfernen
  $EDITOR config.yaml
  # 2. Konflikt als gelöst markieren
  git add config.yaml
  # 3. Optional: wieder als nicht gestagte Änderung, wie vor dem Stash
  git restore --staged config.yaml
  # 4. Erst jetzt den Eintrag entfernen
  git stash drop
  ```

  Ein zweites `git stash pop` wäre falsch: Es wendet denselben Stash noch einmal auf deinen gelösten Stand an und erzeugt neue Konflikte. Wie man Konflikte fachlich richtig löst, vertieft das Modul [Konflikte lösen](/git/konflikte).

  Zwei weitere Fälle, in denen Git das Anwenden verweigert und den Eintrag behält: Hast du **ungesicherte Änderungen an derselben Datei**, bricht Git mit `error: Your local changes to the following files would be overwritten by merge` ab. Existiert eine untracked Datei aus dem Stash schon im Arbeitsverzeichnis, meldet Git `already exists, no checkout`.

  Ist der Branch seit dem Stash weit weitergelaufen, erspart dir `git stash branch` die Konflikte ([Pro Git · Creating a Branch from a Stash](https://git-scm.com/book/en/v2/Git-Tools-Stashing-and-Cleaning#_creating_a_branch_from_a_stash)):

  ```console
  $ git stash branch experiment/cache stash@{1}
  Switched to a new branch 'experiment/cache'
  On branch experiment/cache
  Changes not staged for commit:
    (use "git add <file>..." to update what will be committed)
    (use "git restore <file>..." to discard changes in working directory)
          modified:   src/cache.py

  no changes added to commit (use "git add" and/or "git commit -a")
  Dropped stash@{1} (76bbca7d49654a4460d6bd5139f97684e24b43eb)
  ```

  Der Befehl erzeugt einen neuen Branch **auf dem Commit H**, wendet den Stash dort mit `--index` an – dort passt er garantiert – und löscht ihn bei Erfolg. Aus dem vergessenen Experiment wird ein normaler Branch, den du später mergen oder rebasen kannst.

  ## Stash, WIP-Commit oder Worktree?

  | | Stash | WIP-Commit | Worktree |
  | --- | --- | --- | --- |
  | Typische Dauer | Minuten | Stunden bis Tage | Tage |
  | Wo liegt die Arbeit? | Reflog von `refs/stash`, ohne Branch | auf dem Branch | im zweiten Verzeichnis, auf ihrem Branch |
  | Pushbar als Sicherung | nein | ja | ja (Branch) |
  | Risiko | vergessen, falschen Eintrag poppen | WIP-Commit landet im PR | Verzeichnisse vergessen |

  Ein **WIP-Commit** ist oft die bessere Wahl, sobald die Unterbrechung länger als eine Kaffeepause dauert: `git add -A && git commit -m "WIP: Login-Validierung"`. Die Arbeit liegt dann sichtbar auf `feature/login`, lässt sich pushen und später mit `git reset --soft HEAD~` wieder auflösen oder per interaktivem Rebase einarbeiten ([Interaktives Rebase](/git/interactive-rebase)).

  > [!WARNING] Stash in Skripten
  > `git stash push` meldet bei einem sauberen Arbeitsverzeichnis `No local changes to save` – und endet trotzdem mit Exit-Code 0. Ein Skript nach dem Muster `git stash; git pull; git stash pop` poppt dann einen **alten, fremden** Eintrag. Für `pull` gibt es `git pull --rebase --autostash` ([git-pull · --autostash](https://git-scm.com/docs/git-pull#Documentation/git-pull.txt---autostash)); andere Skripte prüfen, ob sich `refs/stash` durch den eigenen Aufruf geändert hat.

  > [!INTERVIEW] „Du bist mitten in einem Feature und musst einen Hotfix machen. Wie gehst du vor?“
  > Für ein paar Minuten nehme ich `git stash push -u -m "…"`, damit auch neue Dateien gesichert sind, und hole die Arbeit danach mit `pop` zurück. Dauert es länger, mache ich einen WIP-Commit auf dem Feature-Branch, weil der sichtbar ist und sich pushen lässt. Wenn ich parallel weiterarbeiten oder eine laufende Testsuite nicht unterbrechen will, lege ich mit `git worktree add` ein zweites Verzeichnis für den Hotfix an.

  ## Worktrees: ein Repository, mehrere Arbeitsverzeichnisse

  Ein Worktree ist ein weiteres Arbeitsverzeichnis, das an dasselbe Repository angebunden ist ([git-worktree](https://git-scm.com/docs/git-worktree)). Du wechselst nicht mehr den Branch, sondern das Verzeichnis:

  ```console
  $ git worktree add -b hotfix/2.4.1 ../shop-hotfix release/2.4
  Preparing worktree (new branch 'hotfix/2.4.1')
  HEAD is now at 8c41d0e Release 2.4.0
  $ git worktree list
  /home/lea/code/shop        3110406 [feature/login]
  /home/lea/code/shop-hotfix 8c41d0e [hotfix/2.4.1]
  $ cat ../shop-hotfix/.git
  gitdir: /home/lea/code/shop/.git/worktrees/shop-hotfix
  $ git switch hotfix/2.4.1
  fatal: 'hotfix/2.4.1' is already used by worktree at '/home/lea/code/shop-hotfix'
  $ git branch
  * feature/login
  + hotfix/2.4.1
    main
    release/2.4
  ```

  Das ursprüngliche Verzeichnis ist der **Hauptworktree**, jedes weitere ein **verknüpfter Worktree**. Dessen `.git` ist nur eine Datei mit einem Verweis auf `.git/worktrees/<name>` im Hauptrepository. Dort liegen die Dinge, die jeder Worktree für sich hat.

  **Gemeinsam** sind die Objektdatenbank und alle Refs unter `refs/` – Branches, Tags, Remote-Tracking-Branches und auch `refs/stash`. Ebenso die Konfiguration in `.git/config` und die Hooks. Ein Commit im Hotfix-Worktree ist sofort im Hauptworktree sichtbar, ohne Push und Fetch.

  **Pro Worktree** gibt es `HEAD`, den Index, die Dateien und alle Pseudo-Refs wie `ORIG_HEAD` und `MERGE_HEAD`. Außerdem sind `refs/bisect`, `refs/worktree` und `refs/rewritten` nicht geteilt ([git-worktree · Refs](https://git-scm.com/docs/git-worktree#_refs)). Du kannst also im einen Worktree mergen und im anderen gleichzeitig eine Bisect-Sitzung laufen lassen.

  **Ein Branch in genau einem Worktree.** Stell dir vor, `feature/login` wäre in zwei Verzeichnissen ausgecheckt. Ein Commit im ersten bewegt den Branch. Im zweiten zeigt `HEAD` damit plötzlich auf den neuen Commit, Index und Dateien stehen aber noch auf dem alten. Der nächste Commit dort würde die Arbeit aus dem ersten Verzeichnis stillschweigend zurückdrehen. Deshalb verweigert Git das mit `is already used by worktree at …`, und `git branch` markiert solche Branches mit `+`. Mit `git switch --ignore-other-worktrees` oder `git worktree add -f` lässt sich die Sperre umgehen – tu es nicht.

  Varianten von `add`:

  - `git worktree add ../shop-review` checkt einen Branch `shop-review` aus, benannt nach dem letzten Pfadteil; gibt es ihn noch nicht, legt Git ihn auf `HEAD` an.
  - `git worktree add ../shop-hotfix hotfix/2.4.1` checkt einen vorhandenen Branch aus.
  - `git worktree add --detach ../shop-build v2.4.0` arbeitet ohne Branch, mit Detached HEAD – ideal für einen langen Build, ein Review oder einen Vergleich mit einer alten Version.

  **Aufräumen.** `git worktree remove ../shop-hotfix` löscht das Verzeichnis und die Verwaltungsdaten. Enthält der Worktree geänderte oder untracked Dateien, verweigert Git das; `--force` erzwingt es. Löschst du das Verzeichnis dagegen mit `rm -rf` oder dem Dateimanager, bleibt der Eintrag unter `.git/worktrees/` stehen. `git worktree list` zeigt ihn als `prunable`, und der Branch gilt weiter als belegt. `git worktree prune` entfernt solche Leichen; ohne dein Zutun erledigt das irgendwann die Garbage Collection ([git-worktree · prune](https://git-scm.com/docs/git-worktree#Documentation/git-worktree.txt-prune)). Liegt ein Worktree auf einer externen Platte oder einem Netzlaufwerk, schützt `git worktree lock --reason "…"` ihn vor dem Aufräumen.

  > [!PRAXIS] So sieht es im Team aus
  > Viele Entwickler haben ihr Repository als `~/code/shop` und daneben `~/code/shop-hotfix` und `~/code/shop-review`. Während im Hauptworktree die Tests des Features laufen, prüft man im Review-Worktree den Pull Request einer Kollegin. Auch parallele Sitzungen von KI-Coding-Agenten arbeiten oft in eigenen Worktrees. Denk daran: Untracked Dateien wie `node_modules/`, `.venv/` oder `.env` gehören zum Verzeichnis, nicht zum Repository – jeder Worktree braucht seine eigene Installation. Und der Stash-Stapel ist gemeinsam: Ein `git stash pop` in einem Worktree kann den Eintrag aus einem anderen erwischen.

  ## Häufige Fehler

  - **`-u` vergessen.** Neue Dateien bleiben im Arbeitsverzeichnis, wandern beim Branchwechsel mit und landen per `git add -A` im falschen Commit. Kontrolliere nach dem Stash mit `git status --short`, dass nichts übrig ist.
  - **Nach einem Konflikt erneut poppen.** Der Eintrag ist nach einem Konflikt absichtlich noch da. Konflikt lösen, `git add`, dann `git stash drop`.
  - **Anonyme Stashes sammeln.** Fünf Einträge „WIP on main“ sind nach einer Woche wertlos. Immer `-m` verwenden, regelmäßig `git stash list` lesen und Altes mit `git stash branch` retten oder mit `git stash drop` entfernen.
  - **Den Stash für ein Backup halten.** Er ist lokal und wird nicht gepusht. Längere Arbeit gehört in einen Commit auf einem Branch.
  - **`git stash clear` im Affekt.** Es löscht alle Einträge auf einmal. Rettbar nur über `git fsck`, solange die Garbage Collection noch nicht gelaufen ist.
  - **Worktree mit `rm -rf` gelöscht.** Danach meldet Git `is already used by worktree` für den Branch. Lösung: `git worktree prune`. Uncommittete Arbeit aus dem gelöschten Verzeichnis ist weg, Commits dagegen nicht – sie liegen im gemeinsamen Repository.
  - **Denselben Branch mit `-f` in zwei Worktrees auschecken.** Führt zu Index und Dateien, die nicht mehr zu `HEAD` passen.

  ## Zusammenfassung

  - `git stash push -m "…"` sichert getrackte Änderungen aus Index und Arbeitsverzeichnis; `-u` nimmt untracked, `-a` auch ignorierte Dateien mit.
  - `--keep-index` lässt den Index stehen, `--staged` sichert nur den Index, `-p` wählt Hunks aus.
  - Ein Stash ist ein Commit mit den Eltern H, I und optional U; `stash@{n}` ist Reflog-Syntax auf `refs/stash`.
  - `apply` behält den Eintrag, `pop` löscht ihn nur bei Erfolg. Nach einem Konflikt: lösen, `git add`, `git stash drop`.
  - `git stash branch` wendet einen alten Stash konfliktfrei auf einem neuen Branch an seinem Ursprungscommit an.
  - Für längere Unterbrechungen ist ein WIP-Commit sicherer als ein Stash, für parallele Arbeit ein Worktree.
  - Worktrees teilen Objekte, Refs, Stash und Konfiguration; jeder hat eigenen `HEAD`, Index und eigene Dateien. Ein Branch ist in höchstens einem Worktree ausgecheckt.
  - Worktrees mit `git worktree remove` löschen; Reste nach `rm -rf` mit `git worktree prune` aufräumen.
exercises:
  - id: was-landet-im-stash
    type: choice
    title: Was nimmt der Stash mit?
    prompt: |
      `git status --short --ignored` zeigt vor dem Stash:

      ```text
       M config.yaml
      M  src/auth.py
      ?? tests/test_auth.py
      !! .env
      ```

      Welche Dateien sichert `git stash push -m "Login"` **ohne weitere Optionen**?
    options:
      - text: "`src/auth.py` (gestagte Änderung)"
        correct: true
        why: Der Stash sichert den Index als eigenen Commit I. Gestagte Änderungen an getrackten Dateien sind immer dabei.
      - text: "`config.yaml` (nicht gestagte Änderung)"
        correct: true
        why: Nicht gestagte Änderungen an getrackten Dateien stecken im Commit W und werden danach im Arbeitsverzeichnis zurückgesetzt.
      - text: "`tests/test_auth.py` (untracked)"
        correct: false
        why: Untracked Dateien sichert der Stash nur mit `-u` bzw. `--include-untracked`. Ohne die Option bleibt die Datei im Arbeitsverzeichnis liegen.
      - text: "`.env` (ignoriert)"
        correct: false
        why: Ignorierte Dateien kommen nur mit `-a` bzw. `--all` in den Stash. Das ist fast nie gewollt, weil damit auch `node_modules/` oder `.venv/` gesichert würden.
    explanation: |
      Ohne Optionen nimmt `git stash push` alles mit, was Git schon kennt – also Änderungen an getrackten Dateien aus Index und Arbeitsverzeichnis. Untracked Dateien brauchen `-u`, ignorierte `-a`. Dass `tests/test_auth.py` liegen bleibt, ist die häufigste Stash-Überraschung: Die Datei wandert beim Branchwechsel mit.
    resources:
      - title: git-stash · --include-untracked
        url: https://git-scm.com/docs/git-stash#Documentation/git-stash.txt---include-untracked

  - id: was-worktrees-teilen
    type: choice
    title: Gemeinsam oder getrennt?
    prompt: Du hast `~/code/shop` und einen verknüpften Worktree `~/code/shop-hotfix`. Was teilen sich die beiden?
    options:
      - text: Branches und Tags
        correct: true
        why: Alle Refs unter `refs/` sind gemeinsam. Ein Commit auf `hotfix/2.4.1` ist sofort auch im Hauptworktree sichtbar.
      - text: Die Liste aus `git stash list`
        correct: true
        why: "`refs/stash` liegt unter `refs/` und ist damit gemeinsam. Ein Stash aus dem einen Worktree lässt sich im anderen anwenden – oder versehentlich poppen."
      - text: Den Index (Staging Area)
        correct: false
        why: Jeder Worktree hat einen eigenen Index unter `.git/worktrees/<name>/index`. Sonst würde ein `git add` im einen Verzeichnis den Commit im anderen verändern.
      - text: "`HEAD`"
        correct: false
        why: "`HEAD` ist pro Worktree. Genau deshalb kann jeder Worktree einen anderen Branch ausgecheckt haben."
      - text: Das Verzeichnis `node_modules/`
        correct: false
        why: Untracked und ignorierte Dateien gehören zum Arbeitsverzeichnis, nicht zum Repository. Jeder Worktree braucht seine eigene Installation.
    explanation: |
      Die Faustregel aus der Referenz: Alle Refs unter `refs/` sind gemeinsam, Pseudo-Refs wie `HEAD` und `ORIG_HEAD` sind pro Worktree; Ausnahmen sind `refs/bisect`, `refs/worktree` und `refs/rewritten`. Dazu kommen der Index und die Dateien, die jeder Worktree für sich hat. Objektdatenbank, Konfiguration und Hooks teilen sich alle.
    resources:
      - title: git-worktree · Refs
        url: https://git-scm.com/docs/git-worktree#_refs

  - id: hotfix-im-worktree
    type: order
    title: Hotfix ohne Branchwechsel
    prompt: |
      Du arbeitest in `~/code/shop` auf `feature/login` und willst die Arbeit nicht anfassen. Bring die Schritte für einen Hotfix auf Basis von `release/2.4` in eine sinnvolle Reihenfolge.
    lang: bash
    lines: |
      git worktree add -b hotfix/2.4.1 ../shop-hotfix release/2.4
      cd ../shop-hotfix
      $EDITOR config.py
      git commit -am "Hotfix: Timeout für Zahlungsanbieter erhöhen"
      git push -u origin hotfix/2.4.1
      cd ../shop
      git worktree remove ../shop-hotfix
    alternatives:
      - [1, 2, 3, 4, 6, 5, 7]
      - [1, 2, 3, 4, 6, 7, 5]
    explanation: |
      Erst entsteht der Worktree mit neuem Branch auf `release/2.4`, dann arbeitest und committest du dort. Weil Branches geteilt sind, kannst du `hotfix/2.4.1` aus jedem der beiden Verzeichnisse pushen – deshalb sind mehrere Reihenfolgen richtig. Entfernt wird der Worktree von außerhalb, nach dem Commit: `git worktree remove` löscht das Verzeichnis, der Commit bleibt im gemeinsamen Repository erhalten.
    resources:
      - title: git-worktree · add
        url: https://git-scm.com/docs/git-worktree#Documentation/git-worktree.txt-addpathcommit-ish

  - id: stash-ohne-u
    type: output
    title: Was bleibt liegen?
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      printf 'debug: false\n' > config.yaml
      git add config.yaml
      git commit -qm "Konfiguration anlegen"
      printf 'debug: true\n' > config.yaml
      printf 'API_KEY=geheim\n' > .env
      git stash push -q -m "Debug-Modus"
      git status --short
      git stash list
      cat config.yaml
    expected: |
      ?? .env
      stash@{0}: On main: Debug-Modus
      debug: false
    verify: true
    explanation: |
      Die Änderung an der getrackten `config.yaml` wandert in den Stash, die Datei steht danach wieder auf dem Stand von `HEAD` (`debug: false`). `.env` ist untracked und bleibt ohne `-u` im Arbeitsverzeichnis – `git status` zeigt sie weiter mit `??`. Die Nachricht aus `-m` erscheint in `git stash list` hinter dem Branchnamen.
    resources:
      - title: git-stash · push
        url: https://git-scm.com/docs/git-stash#Documentation/git-stash.txt-push-p--patch-S--staged-k--no-keep-index-u--include-untracked-a--all-q--quiet-m--messagemessage--pathspec-from-filefile--pathspec-file-nul--pathspec

  - id: pop-mit-konflikt
    type: output
    title: Pop mit Hindernis
    prompt: Was gibt das Skript aus? Die Meldungen von `git stash pop` selbst werden verworfen.
    lang: bash
    code: |
      git init -q
      printf 'port: 8000\n' > config.yaml
      git add config.yaml
      git commit -qm "Start"
      printf 'port: 8080\n' > config.yaml
      git stash push -q -m "Lokaler Port"
      printf 'port: 9000\n' > config.yaml
      git commit -qam "Port für Staging"
      git stash pop -q >/dev/null 2>&1 || echo "pop gescheitert"
      git stash list
      git status --short
    expected: |
      pop gescheitert
      stash@{0}: On main: Lokaler Port
      UU config.yaml
    verify: true
    explanation: |
      Stash und neuer Commit ändern dieselbe Zeile, der Drei-Wege-Merge beim Anwenden erzeugt einen Konflikt. `git stash pop` endet dann mit einem Fehlercode und **löscht den Eintrag nicht** – er steht weiter in `git stash list`. `UU` bedeutet: in beiden Versionen geändert, noch nicht aufgelöst. Nach dem Auflösen entfernst du den Eintrag selbst mit `git stash drop`.
    resources:
      - title: git-stash · pop
        url: https://git-scm.com/docs/git-stash#Documentation/git-stash.txt-pop--index-q--quietstash

  - id: branch-in-zwei-worktrees
    type: output
    title: Zwei Verzeichnisse, ein Branch
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      mkdir shop && cd shop
      git init -q
      printf 'TIMEOUT = 30\n' > config.py
      git add config.py && git commit -qm "Start"
      git worktree add -q -b hotfix ../shop-hotfix
      printf 'TIMEOUT = 60\n' > ../shop-hotfix/config.py
      git -C ../shop-hotfix commit -qam "Timeout erhöhen"
      git log -1 --format=%s hotfix
      cat config.py
      git switch -q hotfix 2>/dev/null || echo "switch abgelehnt"
      git branch
    expected: |
      Timeout erhöhen
      TIMEOUT = 30
      switch abgelehnt
      + hotfix
      * main
    verify: true
    explanation: |
      Der Commit im Worktree bewegt den gemeinsamen Branch `hotfix`, deshalb sieht der Hauptworktree ihn sofort. Die Dateien des Hauptworktrees bleiben unberührt – `config.py` steht dort weiter auf 30, weil jeder Worktree eigene Dateien und einen eigenen `HEAD` hat. `git switch hotfix` scheitert, weil der Branch schon im anderen Worktree ausgecheckt ist; `git branch` markiert ihn deshalb mit `+`.
    resources:
      - title: git-worktree · Description
        url: https://git-scm.com/docs/git-worktree#_description

  - id: stash-mit-untracked
    type: command
    title: Alles einpacken
    prompt: Lege alle Änderungen beiseite, **inklusive der neuen, untracked Testdatei**, mit der Nachricht `Login halbfertig`. Nutze den Unterbefehl `push`.
    context: |
      ```console
      $ git status --short
       M src/auth.py
      ?? tests/test_auth.py
      ```
    answers:
      - git stash push -u -m "Login halbfertig"
      - git stash push -m "Login halbfertig" -u
      - git stash push --include-untracked -m "Login halbfertig"
      - git stash push -m "Login halbfertig" --include-untracked
      - git stash push -u --message "Login halbfertig"
      - git stash push --include-untracked --message "Login halbfertig"
      - git stash push --message "Login halbfertig" -u
      - git stash push --message "Login halbfertig" --include-untracked
    output: |
      Saved working directory and index state On feature/login: Login halbfertig
    explanation: |
      `-u` (`--include-untracked`) nimmt untracked Dateien in einen dritten Eltern-Commit U auf; ohne die Option bliebe `tests/test_auth.py` liegen. `-m` gibt dem Eintrag einen Namen, den du in einer Woche noch verstehst. Danach sollte `git status --short` leer sein.
    resources:
      - title: git-stash · --include-untracked
        url: https://git-scm.com/docs/git-stash#Documentation/git-stash.txt---include-untracked

  - id: worktree-fuer-hotfix
    type: command
    title: Ein zweites Verzeichnis für den Hotfix
    prompt: |
      Lege neben dem Repository das Verzeichnis `../shop-hotfix` als Worktree an. Darin soll ein **neuer** Branch `hotfix/2.4.1` ausgecheckt sein, der auf `release/2.4` startet.
    context: Du bist in `~/code/shop` auf `feature/login` mit uncommitteten Änderungen, die du nicht anfassen willst. Der lokale Branch `release/2.4` existiert.
    answers:
      - git worktree add -b hotfix/2.4.1 ../shop-hotfix release/2.4
      - git worktree add ../shop-hotfix -b hotfix/2.4.1 release/2.4
      - git worktree add ../shop-hotfix release/2.4 -b hotfix/2.4.1
    output: |
      Preparing worktree (new branch 'hotfix/2.4.1')
      HEAD is now at 8c41d0e Release 2.4.0
    explanation: |
      `-b` erzeugt den Branch, der Pfad bestimmt das Verzeichnis, das Argument nach dem Pfad den Startpunkt. Ohne Startpunkt würde der Branch auf deinem aktuellen `HEAD` – also `feature/login` – beginnen, und der Hotfix enthielte halbfertige Feature-Commits. Deine Änderungen im Hauptworktree bleiben unberührt, weil jeder Worktree eigene Dateien und einen eigenen Index hat.
    resources:
      - title: git-worktree · -b
        url: https://git-scm.com/docs/git-worktree#Documentation/git-worktree.txt--bnew-branch

  - id: nur-den-commit-testen
    type: gap
    title: Genau das testen, was du committest
    prompt: |
      Du hast `src/auth.py` und den neuen Test gestagt. Daneben gibt es eine nicht gestagte Änderung an `config.yaml` und eine untracked `notizen.md`. Du willst die Tests **nur** mit dem gestagten Stand laufen lassen, dann committen und danach den Rest zurückholen und den Eintrag entfernen. Verwende Langoptionen.
    lang: bash
    code: |
      git add src/auth.py tests/test_auth.py
      git stash push ⟦--keep-index⟧ ⟦--include-untracked⟧ -m "Nicht Teil des Commits"
      pytest
      git commit -m "Login: leere Benutzernamen abweisen"
      git stash ⟦pop⟧
    gaps:
      - label: Gestagter Stand für den Test
        hint: Die Option sorgt dafür, dass der gestagte Stand zusätzlich im Arbeitsverzeichnis bleibt.
        accept: ["-k"]
      - label: Die Notizdatei
        hint: Ohne diese Option bliebe `notizen.md` liegen und könnte die Tests beeinflussen.
        accept: ["-u"]
      - label: Nach dem Commit
        hint: Einer der beiden Befehle zum Zurückholen löscht den Eintrag nach erfolgreichem Anwenden.
        accept: ["pop -q", "pop --quiet"]
    explanation: |
      `--keep-index` sichert alles, stellt den Index aber sofort wieder ins Arbeitsverzeichnis. `--include-untracked` räumt auch `notizen.md` weg, sodass `pytest` exakt den Stand sieht, der gleich committet wird. `pop` holt den Rest zurück und löscht den Eintrag. Das klappt hier ohne Konflikt, weil keine Datei gleichzeitig gestagte und nicht gestagte Änderungen hat – sonst kann das Zurückholen an dieser Datei scheitern.
    resources:
      - title: git-stash · --keep-index
        url: https://git-scm.com/docs/git-stash#Documentation/git-stash.txt---keep-index

  - id: zweites-pop
    type: bug
    title: Der Konflikt kommt zurück
    prompt: |
      Nach `git stash pop` gab es einen Konflikt in `config.yaml`. Lea hat ihn gelöst und diese Befehle ausgeführt. Danach enthält `config.yaml` **wieder** Konfliktmarker, und `git stash list` zeigt den Eintrag immer noch. Welche Zeile ist falsch? Korrigiere sie.
    lang: bash
    code: |
      git stash pop
      $EDITOR config.yaml
      git add config.yaml
      git stash pop
      git restore --staged config.yaml
    lines: [4]
    fix:
      - line: 4
        answers: ["git stash drop", "git stash drop -q", "git stash drop stash@{0}", "git stash drop 'stash@{0}'", "git stash drop \"stash@{0}\""]
    explanation: |
      Nach einem Konflikt behält `git stash pop` den Eintrag absichtlich. Die Änderungen sind nach dem Auflösen aber schon im Arbeitsverzeichnis. Ein zweites `pop` wendet denselben Stash noch einmal auf den gelösten Stand an und erzeugt neue Konflikte. Richtig ist `git stash drop`: Es entfernt nur den Eintrag, den du nicht mehr brauchst.
    resources:
      - title: git-stash · drop
        url: https://git-scm.com/docs/git-stash#Documentation/git-stash.txt-drop-q--quietstash

  - id: deploy-skript-stash
    type: explain
    title: Woher kommt dieses Experiment?
    prompt: |
      Das Deploy-Skript auf dem Staging-Server lautet `git stash push -m "deploy-autostash"`, `git pull --rebase`, `./build.sh`, `git stash pop`. Nach einem Lauf in einem **sauberen** Arbeitsverzeichnis ist plötzlich `src/cache.py` verändert. Erkläre anhand der Sitzung, was passiert ist und wie man das Skript robust macht.
    lang: console
    code: |
      $ git stash list
      stash@{0}: On main: Caching-Experiment
      $ ./deploy.sh
      No local changes to save
      Already up to date.
      On branch main
      Your branch is up to date with 'origin/main'.

      Changes not staged for commit:
        (use "git add <file>..." to update what will be committed)
        (use "git restore <file>..." to discard changes in working directory)
              modified:   src/cache.py

      no changes added to commit (use "git add" and/or "git commit -a")
      Dropped refs/stash@{0} (ca4c3cd620094aec0b546af9abd7b8cba5f66c20)
      $ git status --short
       M src/cache.py
    points:
      - Ohne lokale Änderungen legt `git stash push` keinen Eintrag an, meldet `No local changes to save` und endet trotzdem mit Exit-Code 0.
      - "`git stash pop` nimmt den obersten Eintrag – hier das alte `Caching-Experiment` – und löscht ihn nach dem Anwenden."
      - Es gibt nur einen Stash-Stapel pro Repository, gemeinsam für alle Branches und Worktrees; ein Skript kann nicht wissen, wem der oberste Eintrag gehört.
      - "Robust wird es mit `git pull --rebase --autostash` oder indem das Skript nur dann poppt, wenn sich `refs/stash` durch das eigene `git stash push` geändert hat."
    explanation: |
      Das Arbeitsverzeichnis war sauber, also hat `git stash push` nichts gesichert – aber mit Exit-Code 0 geendet. Das Skript lief weiter, und `git stash pop` hat den obersten vorhandenen Eintrag angewendet: ein altes Experiment, das jemand vor Wochen beiseitegelegt hatte. Der Eintrag ist jetzt sogar aus der Liste verschwunden. Für den Pull ist `git pull --rebase --autostash` die richtige Lösung, weil Git dann nur das zurückholt, was es selbst gesichert hat. Allgemein vergleicht ein Skript `git rev-parse -q --verify refs/stash` vor und nach `git stash push` und poppt nur bei einer Änderung – oder es verzichtet auf den Stash und bricht bei einem unsauberen Arbeitsverzeichnis ab.
    resources:
      - title: git-pull · --autostash
        url: https://git-scm.com/docs/git-pull#Documentation/git-pull.txt---autostash

  - id: labor-pop-konflikt
    type: practice
    title: "Labor: Der Stash passt nicht mehr"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.
      Du hattest lokal den Debug-Modus eingeschaltet und die Änderung gestasht. Inzwischen hat sich auf `main` der Port geändert, und `git stash pop` meldet einen Konflikt.

      Stelle diesen Zustand her: `config.yaml` enthält **beide** Änderungen (`debug: true` und `port: 9000`), wie vorher als nicht gestagte Änderung. Der Stash-Eintrag ist weg, es gibt keine ungelösten Pfade mehr. Prüfe mit `git status --short` und `git stash list`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      printf 'debug: false\nport: 8000\nworkers: 4\n' > config.yaml
      git add config.yaml && git commit -qm "Konfiguration anlegen"
      # Lokal: Debug-Modus an, dann beiseitelegen
      printf 'debug: true\nport: 8000\nworkers: 4\n' > config.yaml
      git stash push -q -m "Debug lokal"
      # Inzwischen auf main: Port geändert
      printf 'debug: false\nport: 9000\nworkers: 4\n' > config.yaml
      git commit -qam "Port auf 9000 umstellen"
      # Zurückholen scheitert
      git stash pop || true
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      printf 'debug: false\nport: 8000\nworkers: 4\n' > config.yaml
      git add config.yaml && git commit -qm "Konfiguration anlegen"
      # Lokal: Debug-Modus an, dann beiseitelegen
      printf 'debug: true\nport: 8000\nworkers: 4\n' > config.yaml
      git stash push -q -m "Debug lokal"
      # Inzwischen auf main: Port geändert
      printf 'debug: false\nport: 9000\nworkers: 4\n' > config.yaml
      git commit -qam "Port auf 9000 umstellen"
      # Zurückholen scheitert
      git stash pop || true
      # Reparatur
      # 1. Fachlich zusammenführen: beide Änderungen behalten, Marker weg
      printf 'debug: true\nport: 9000\nworkers: 4\n' > config.yaml
      # 2. Als gelöst markieren, dann wieder aus dem Index nehmen
      git add config.yaml
      git restore --staged config.yaml
      # 3. Den nicht mehr gebrauchten Eintrag entfernen
      git stash drop
      # Kontrolle
      test "$(cat config.yaml)" = "$(printf 'debug: true\nport: 9000\nworkers: 4')"
      test -z "$(git ls-files -u)"
      git diff --cached --quiet
      test "$(git status --short)" = " M config.yaml"
      test -z "$(git stash list)"
    checklist:
      - "`config.yaml` enthält `debug: true`, `port: 9000` und `workers: 4`, aber keine Konfliktmarker."
      - "`git status --short` zeigt genau ` M config.yaml` (nicht gestagt, kein `UU`)."
      - "`git stash list` ist leer."
      - Du hast den Stash nicht ein zweites Mal gepoppt.
    verify: true
    hints:
      - "`git stash pop` hat den Eintrag wegen des Konflikts behalten. Sieh mit `git stash list` nach."
      - Übernimm in `config.yaml` beide Absichten – den Debug-Modus aus dem Stash und den neuen Port aus `main`.
      - "`git add` markiert den Konflikt als gelöst, `git restore --staged` nimmt die Änderung wieder aus dem Index, `git stash drop` entfernt den Eintrag."
    explanation: |
      Ein Konflikt beim Pop ist ein normaler Merge-Konflikt zwischen deinem aktuellen Stand und dem Stash. Nur eine Seite zu nehmen wäre falsch: Der Port auf `main` ist gewollt, der Debug-Modus auch. Nach dem Zusammenführen markiert `git add` den Pfad als gelöst. `git restore --staged` (oder `git reset -q`) stellt den Zustand wie vor dem Stash her, also eine nicht gestagte Änderung. Weil `pop` den Eintrag nach dem Konflikt behalten hat, musst du ihn selbst mit `git stash drop` entfernen – aber erst, wenn der Inhalt sicher im Arbeitsverzeichnis steht.
    resources:
      - title: Pro Git · Stashing Your Work
        url: https://git-scm.com/book/en/v2/Git-Tools-Stashing-and-Cleaning#_stashing_your_work

  - id: labor-vergessenes-u
    type: practice
    title: "Labor: Die Datei ist im falschen Commit"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.
      Mitten in der Arbeit an einem CSV-Export kam ein dringender Hotfix. Die Arbeit wurde gestasht, der Hotfix auf `release/2.4` committet (noch nicht gepusht). Sieh dir den Hotfix-Commit mit `git show --stat` an.

      Stelle diesen Zustand her: Der Hotfix-Commit auf `release/2.4` ändert nur `config.py`. Du bist wieder auf `feature/export`, dort ist `src/api.py` geändert und `src/export.py` liegt als untracked Datei vor – wie vor der Unterbrechung. Der Stash ist leer.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      mkdir src
      printf 'TIMEOUT = 30\n' > config.py
      printf 'def bestellungen():\n    return []\n' > src/api.py
      git add . && git commit -qm "Shop-Grundgerüst"
      git branch release/2.4
      git switch -q -c feature/export
      # Halbfertige Arbeit: eine geänderte und eine neue Datei
      printf 'def bestellungen():\n    return lade_alle()\n' > src/api.py
      printf 'def als_csv(daten):\n    pass\n' > src/export.py
      git stash push -q -m "Export halbfertig"
      # Dringender Hotfix auf release/2.4 (noch nicht gepusht)
      git switch -q release/2.4
      printf 'TIMEOUT = 60\n' > config.py
      git add -A && git commit -qm "Hotfix: Timeout erhöhen"
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      mkdir src
      printf 'TIMEOUT = 30\n' > config.py
      printf 'def bestellungen():\n    return []\n' > src/api.py
      git add . && git commit -qm "Shop-Grundgerüst"
      git branch release/2.4
      git switch -q -c feature/export
      # Halbfertige Arbeit: eine geänderte und eine neue Datei
      printf 'def bestellungen():\n    return lade_alle()\n' > src/api.py
      printf 'def als_csv(daten):\n    pass\n' > src/export.py
      git stash push -q -m "Export halbfertig"
      # Dringender Hotfix auf release/2.4 (noch nicht gepusht)
      git switch -q release/2.4
      printf 'TIMEOUT = 60\n' > config.py
      git add -A && git commit -qm "Hotfix: Timeout erhöhen"
      # Reparatur
      # 1. export.py aus dem Hotfix-Commit nehmen, die Datei selbst behalten
      git rm -q --cached src/export.py
      git commit -q --amend --no-edit
      # 2. Zurück zum Feature, die Datei wandert als untracked mit
      git switch -q feature/export
      git stash pop -q
      # Kontrolle
      test "$(git show --name-only --format= release/2.4)" = config.py
      test "$(git branch --show-current)" = feature/export
      test -z "$(git stash list)"
      test "$(git status --short | tr '\n' ,)" = " M src/api.py,?? src/export.py,"
    checklist:
      - "`git show --name-only --format= release/2.4` zeigt nur `config.py`."
      - "`git branch --show-current` zeigt `feature/export`."
      - "`git status --short` zeigt ` M src/api.py` und `?? src/export.py`."
      - "`git stash list` ist leer."
      - Du kannst erklären, warum `src/export.py` überhaupt im Hotfix gelandet ist.
    verify: true
    hints:
      - Der Stash wurde ohne `-u` angelegt. Wo war `src/export.py` also, als der Hotfix committet wurde?
      - Nimm die Datei nur aus dem Commit, nicht von der Platte – `git rm --cached` – und korrigiere den noch nicht gepushten Commit mit `--amend`.
      - Wechselst du zuerst zu `feature/export`, entfernt Git die Datei aus dem Arbeitsverzeichnis, weil sie auf `release/2.4` getrackt ist. Repariere deshalb zuerst den Hotfix.
    explanation: |
      Ohne `-u` hat der Stash `src/export.py` nicht mitgenommen. Die untracked Datei blieb beim Wechsel auf `release/2.4` liegen, und `git add -A` hat sie in den Hotfix gepackt. `git rm --cached` nimmt sie aus dem Index, lässt sie aber auf der Platte; `--amend` ersetzt den ungepushten Commit. Danach ist die Datei wieder untracked und wandert beim Wechsel zurück mit. Die Reihenfolge zählt: Wechselst du vorher zu `feature/export`, löscht Git die Datei aus dem Arbeitsverzeichnis, weil sie auf dem alten Branch getrackt und auf dem neuen unbekannt ist – dann wirkt sie „verschwunden“, obwohl sie im Hotfix-Commit liegt. Vorbeugung: `git stash push -u` und vor jedem Commit `git status --short` lesen.
    resources:
      - title: git-stash · --include-untracked
        url: https://git-scm.com/docs/git-stash#Documentation/git-stash.txt---include-untracked
      - title: git-rm · --cached
        url: https://git-scm.com/docs/git-rm

  - id: labor-geloeschter-worktree
    type: practice
    title: "Labor: Der Worktree ist weg, der Branch ist belegt"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.
      Ein Hotfix-Worktree wurde mit dem Dateimanager gelöscht. Jetzt lässt sich der Branch `hotfix/2.4.1` nirgends mehr auschecken. Sieh dir die Fehlermeldung und `git worktree list` an.

      Stelle diesen Zustand her: `hotfix/2.4.1` ist im neuen Worktree `../shop-hotfix-2` ausgecheckt, der bereits committete Hotfix ist darin enthalten, und `git worktree list` zeigt nur noch zwei Einträge.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      mkdir shop && cd shop
      git init -q
      printf 'TIMEOUT = 30\n' > config.py
      git add . && git commit -qm "Shop-Grundgerüst"
      git branch release/2.4
      # Hotfix in eigenem Worktree, ein Commit ist schon drin
      git worktree add -q -b hotfix/2.4.1 ../shop-hotfix release/2.4
      printf 'TIMEOUT = 60\n' > ../shop-hotfix/config.py
      git -C ../shop-hotfix commit -qam "Hotfix: Timeout erhöhen"
      # Aufräumen mit dem Dateimanager statt mit Git
      rm -rf ../shop-hotfix
      # Später: den Hotfix-Branch wieder auschecken
      git worktree add ../shop-hotfix-2 hotfix/2.4.1 || true
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      mkdir shop && cd shop
      git init -q
      printf 'TIMEOUT = 30\n' > config.py
      git add . && git commit -qm "Shop-Grundgerüst"
      git branch release/2.4
      # Hotfix in eigenem Worktree, ein Commit ist schon drin
      git worktree add -q -b hotfix/2.4.1 ../shop-hotfix release/2.4
      printf 'TIMEOUT = 60\n' > ../shop-hotfix/config.py
      git -C ../shop-hotfix commit -qam "Hotfix: Timeout erhöhen"
      # Aufräumen mit dem Dateimanager statt mit Git
      rm -rf ../shop-hotfix
      # Später: den Hotfix-Branch wieder auschecken
      git worktree add ../shop-hotfix-2 hotfix/2.4.1 || true
      # Reparatur
      # 1. Verwaltungsdaten des gelöschten Worktrees entfernen
      git worktree prune
      # 2. Branch neu auschecken
      git worktree add -q ../shop-hotfix-2 hotfix/2.4.1
      # Kontrolle
      test "$(git worktree list --porcelain | grep -c '^worktree ')" = 2
      test "$(git -C ../shop-hotfix-2 branch --show-current)" = hotfix/2.4.1
      test "$(git -C ../shop-hotfix-2 log -1 --format=%s)" = "Hotfix: Timeout erhöhen"
      test -z "$(git -C ../shop-hotfix-2 status --porcelain)"
    checklist:
      - "`git worktree list` zeigt genau zwei Einträge, keinen mit `prunable`."
      - "In `../shop-hotfix-2` zeigt `git branch --show-current` den Branch `hotfix/2.4.1`."
      - "`git log -1 --format=%s` zeigt dort `Hotfix: Timeout erhöhen`."
      - Du hast kein `-f` verwendet, um die Sperre zu umgehen.
    verify: true
    hints:
      - "`git worktree list` zeigt den gelöschten Worktree noch – mit dem Zusatz `prunable`."
      - Git hält den Branch für belegt, weil unter `.git/worktrees/` noch die Verwaltungsdaten des gelöschten Verzeichnisses liegen.
      - "`git worktree prune` räumt Einträge auf, deren Verzeichnis nicht mehr existiert."
    explanation: |
      `rm -rf` löscht nur das Verzeichnis. Die Verwaltungsdaten unter `.git/worktrees/shop-hotfix` bleiben, und für Git ist `hotfix/2.4.1` weiter dort ausgecheckt. `git worktree prune` entfernt Einträge, deren Verzeichnis fehlt; `git worktree remove ../shop-hotfix` hätte hier dasselbe erreicht. `git worktree add -f` würde den Branch zwar auschecken, ließe den toten Eintrag aber stehen. Der Commit hat überlebt, weil Objekte und Branches im gemeinsamen Repository liegen – verloren wären nur uncommittete Änderungen im gelöschten Verzeichnis. Beim nächsten Mal: `git worktree remove`.
    resources:
      - title: git-worktree · prune
        url: https://git-scm.com/docs/git-worktree#Documentation/git-worktree.txt-prune
      - title: git-worktree · remove
        url: https://git-scm.com/docs/git-worktree#Documentation/git-worktree.txt-remove
