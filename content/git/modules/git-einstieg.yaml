lesson: |
  Freitagnachmittag, der Bestellabruf der Shop-API bricht mit Timeouts ab. Du erhöhst in `src/api.py` den Timeout, stellst zum Testen in `config.yaml` das Log-Level auf `debug` und legst eine `.env` mit einem Test-Passwort an. Der Fix soll heute noch ins Review – die Debug-Einstellung und das Passwort auf keinen Fall. Git lässt dich genau festlegen, welche Änderung in welchen Commit kommt, zeigt dir jederzeit, was sich seit dem letzten Stand geändert hat, und holt jede committete Version einer Datei zurück.

  Dieses Modul legt das Fundament für alle weiteren: das Modell der **drei Bereiche**. Fast jede Verwirrung mit Git – „Warum ist meine Änderung nicht im Commit?“, „Warum zeigt `git diff` nichts an?“ – löst sich auf, sobald du weißt, in welchem Bereich eine Änderung gerade liegt.

  ## Warum Versionskontrolle – und was Git anders macht

  Versionskontrolle beantwortet drei Fragen: Was hat sich geändert, wer hat es geändert und warum? Ohne sie entstehen Dateien wie `api_final_v2_neu.py`, und niemand weiß, welche Version gerade auf dem Server läuft. Mit Git ist jeder gespeicherte Stand ein **Commit**: ein Schnappschuss aller Dateien des Projekts mit Autor, Zeitpunkt und einer Nachricht, die erklärt, warum sich etwas geändert hat.

  Das Wort „Schnappschuss“ ist wörtlich gemeint. Viele ältere Systeme speichern pro Version eine Liste von Änderungen. Git speichert dagegen mit jedem Commit den **vollständigen Stand** aller Dateien, die es verwaltet ([Pro Git · What is Git?](https://git-scm.com/book/en/v2/Getting-Started-What-is-Git%3F)). Das klingt teuer, ist es aber nicht: Unveränderte Dateien werden nicht erneut abgelegt, der neue Commit verweist auf denselben gespeicherten Inhalt wie der alte.

  ```text
  Commit 1             Commit 2             Commit 3
  README.md   (v1)     README.md   (v1)     README.md   (v1)
  src/api.py  (v1)     src/api.py  (v2)     src/api.py  (v2)
  config.yaml (v1)     config.yaml (v1)     config.yaml (v2)
  ```

  Diffs – also „Zeile 3 wurde geändert“ – berechnet Git erst, wenn du danach fragst, etwa mit `git diff` oder `git log -p`. Wie das Speichern genau funktioniert, klärt das Modul [Das Datenmodell](/git/datenmodell).

  Git ist außerdem **verteilt**: Jeder Klon enthält die komplette History. `log`, `diff`, `commit` und fast alles in diesem Modul arbeiten lokal, ohne Netzwerk und entsprechend schnell. Der Server bei GitHub oder GitLab ist eine weitere Kopie, auf die sich das Team als gemeinsamen Stand einigt.

  ## Einrichten: git config, init und clone

  Bevor du den ersten Commit anlegst, braucht Git deinen Namen und deine E-Mail-Adresse. Beide landen in jedem Commit und lassen sich danach nur ändern, indem man die History umschreibt ([Pro Git · First-Time Git Setup](https://git-scm.com/book/en/v2/Getting-Started-First-Time-Git-Setup)).

  ```bash
  git config --global user.name "Lea Lernt"
  git config --global user.email "lea@privat.example"
  git config --global init.defaultBranch main
  git config --global core.editor "nano"
  ```

  `init.defaultBranch` legt fest, wie der erste Branch in neuen Repositorys heißt. Ohne diese Einstellung heißt er `master`, und `git init` zeigt einen längeren Hinweis an. `core.editor` ist der Editor, den Git öffnet, wenn du eine Commit-Nachricht ohne `-m` schreibst – für VS Code wäre das `code --wait`, damit Git wartet, bis du den Tab schließt.

  Git liest Einstellungen aus drei Ebenen ([git-config · Configuration File](https://git-scm.com/docs/git-config#_configuration_file)):

  | Ebene | Datei | Gilt für | Option |
  | --- | --- | --- | --- |
  | system | meist `/etc/gitconfig` | alle Benutzer des Rechners | `--system` |
  | global | `~/.gitconfig` oder `~/.config/git/config` | deinen Benutzer, alle Repositorys | `--global` |
  | local | `.git/config` im Repository | nur dieses Repository | `--local` (Standard beim Schreiben) |

  Git liest die Ebenen in dieser Reihenfolge, der zuletzt gelesene Wert gewinnt. Die spezifischere Ebene überschreibt also die allgemeinere: local vor global vor system. Die Datei selbst ist schlichtes INI-Format:

  ```ini title=~/.gitconfig
  [user]
      name = Lea Lernt
      email = lea@privat.example
  [init]
      defaultBranch = main
  [core]
      editor = nano
  ```

  Das klassische Problem: Im Firmen-Repository tauchen Commits mit deiner privaten Adresse auf. Setze dort die Firmenadresse lokal mit `git config user.email lea.lernt@firma.example` und prüfe mit `--show-origin`, woher der gültige Wert kommt:

  ```console
  $ git config --show-origin --get-all user.email
  file:/home/lea/.gitconfig  lea@privat.example
  file:.git/config  lea.lernt@firma.example
  $ git config --show-origin user.email
  file:.git/config  lea.lernt@firma.example
  ```

  `--get-all` zeigt jeden gefundenen Wert, ohne diese Option siehst du nur den gültigen. `git config --list --show-origin` listet alle Einstellungen mit ihrer Quelle, `--show-scope` ergänzt die Ebene. Neuere Git-Versionen kennen zusätzlich die Schreibweise mit Unterbefehlen, etwa `git config set --global user.email …` und `git config get user.email`.

  Ein Repository entsteht auf zwei Wegen ([Pro Git · Getting a Git Repository](https://git-scm.com/book/en/v2/Git-Basics-Getting-a-Git-Repository)): `git init shop-api` legt ein neues, leeres Repository an und meldet `Initialized empty Git repository in …/shop-api/.git/`. `git clone git@github.com:acme/shop-api.git` kopiert ein bestehendes samt kompletter History in ein neues Verzeichnis `shop-api`. In beiden Fällen liegt das Repository selbst im versteckten Verzeichnis `.git`. Wer es löscht, löscht die History. `git clone` richtet zusätzlich die Verbindung zum Server unter dem Namen `origin` ein und wechselt auf dessen Standard-Branch – mehr dazu in [Branches, HEAD und Remotes](/git/branches-head).

  ## Die drei Bereiche: Arbeitsverzeichnis, Index, Repository

  Jede Datei, die Git verwaltet, existiert in bis zu drei Fassungen:

  ```text
  Arbeitsverzeichnis        Index (Staging Area)          Repository (.git)
  Dateien auf der Platte    Entwurf des nächsten Commits  alle Commits, HEAD = aktueller

           ── git add ──────────▶
                                        ── git commit ────────────▶
           ◀── git restore ──────
                                        ◀── git restore --staged ──
  ```

  - Das **Arbeitsverzeichnis** sind die Dateien, die du im Editor öffnest.
  - Der **Index** (auch **Staging Area**) ist die Datei `.git/index`. Er enthält den vollständigen Entwurf des nächsten Commits – nicht nur die Änderungen, sondern jede Datei in genau der Fassung, die committet werden soll. Direkt nach einem Commit stimmt der Index mit dem Commit überein.
  - Das **Repository** enthält alle Commits. **HEAD** bezeichnet den Commit, auf dem du gerade arbeitest; `HEAD~1` ist sein Vorgänger.

  `git add datei` kopiert den **aktuellen Inhalt** der Datei in den Index. `git commit` macht aus dem Index einen neuen Commit und schaut dabei nicht ins Arbeitsverzeichnis. Änderst du eine Datei nach `git add` erneut, landet diese zweite Änderung erst nach einem weiteren `git add` im Commit.

  > [!MERKE]
  > `git add` heißt „diese Fassung der Datei kommt in den nächsten Commit“, nicht „Git soll diese Datei beobachten“. `git commit` nimmt den Index, nicht deine Dateien.

  Wozu der Zwischenschritt? Er trennt Arbeiten von Festhalten. Du kannst zehn Dateien ändern und daraus zwei saubere Commits bauen: erst den Bugfix, dann das Refactoring. `git commit -a` überspringt den Schritt teilweise: Es merkt alle geänderten und gelöschten Dateien vor, die Git schon kennt. Neue, noch nie hinzugefügte Dateien bleiben draußen ([git-commit](https://git-scm.com/docs/git-commit)).

  Wo jede Datei gerade steht, zeigt `git status`:

  ```console
  $ git status
  On branch main
  Changes to be committed:
    (use "git restore --staged <file>..." to unstage)
          modified:   src/api.py

  Changes not staged for commit:
    (use "git add <file>..." to update what will be committed)
    (use "git restore <file>..." to discard changes in working directory)
          modified:   config.yaml

  Untracked files:
    (use "git add <file>..." to include in what will be committed)
          .env

  $ git status --short
   M config.yaml
  M  src/api.py
  ?? .env
  ```

  Die Kurzform hat zwei Spalten ([git-status · Short Format](https://git-scm.com/docs/git-status#_short_format)). Die **linke Spalte X** vergleicht Index mit HEAD – „ist etwas vorgemerkt?“. Die **rechte Spalte Y** vergleicht Arbeitsverzeichnis mit Index – „gibt es noch nicht vorgemerkte Änderungen?“.

  | Anzeige | Bedeutung |
  | --- | --- |
  | `M ` | geändert und vollständig vorgemerkt |
  | ` M` | geändert, nichts davon vorgemerkt |
  | `MM` | vorgemerkt und danach erneut geändert |
  | `A ` | neue Datei, vorgemerkt |
  | `D ` / ` D` | gelöscht, vorgemerkt / nur im Arbeitsverzeichnis gelöscht |
  | `R ` | umbenannt, vorgemerkt |
  | `??` | untracked: Git kennt die Datei nicht |
  | `!!` | ignoriert (nur mit `--ignored`) |

  Nicht verfolgte Dateien stehen immer am Ende der Liste. Die Kurzform eignet sich auch für Skripte: `git status --porcelain` liefert dasselbe Format in einer Form, die sich zwischen Git-Versionen nicht ändert.

  > [!INTERVIEW] „Wozu gibt es die Staging Area?“
  > Sie ist der Entwurf des nächsten Commits. Ich kann damit Änderungen, die gleichzeitig entstanden sind, auf mehrere Commits mit je einem Zweck aufteilen und vor dem Commit genau prüfen, was hineingeht – mit `git diff --staged`. `git commit` nimmt nur den Index; was danach noch geändert wurde, bleibt draußen, bis ich es erneut mit `git add` vormerke.

  ## Unterschiede sehen: git diff

  Weil es drei Bereiche gibt, gibt es drei Vergleiche – und für jeden eine eigene Schreibweise ([git-diff](https://git-scm.com/docs/git-diff)):

  ```text
          git diff --staged              git diff
  HEAD  ◀──────────────────▶  Index  ◀──────────────▶  Arbeitsverzeichnis
        ◀──────────────────── git diff HEAD ─────────────────────────▶
  ```

  - `git diff` – Arbeitsverzeichnis gegen Index: was du noch **nicht** vorgemerkt hast.
  - `git diff --staged` (gleichbedeutend: `--cached`) – Index gegen HEAD: was im nächsten Commit landet.
  - `git diff HEAD` – Arbeitsverzeichnis gegen HEAD: alles seit dem letzten Commit, vorgemerkt oder nicht.
  - `git diff HEAD~3` vergleicht das Arbeitsverzeichnis mit einem älteren Commit, `git diff A B` zwei beliebige Commits.

  ```console
  $ git diff
  diff --git a/config.yaml b/config.yaml
  index 9eaac81..03b2c4a 100644
  --- a/config.yaml
  +++ b/config.yaml
  @@ -1,2 +1,2 @@
  -log_level: info
  +log_level: debug
   port: 8000
  ```

  `---` ist die alte Seite, `+++` die neue. Die Zeile `@@ -1,2 +1,2 @@` sagt: Dieser Abschnitt (Hunk) umfasst in der alten Fassung zwei Zeilen ab Zeile 1, in der neuen ebenfalls. Zeilen mit `-` fallen weg, Zeilen mit `+` kommen hinzu, Zeilen mit Leerzeichen sind unveränderter Kontext. Mit `--stat` bekommst du eine Übersicht pro Datei, mit `--name-only` nur die Dateinamen.

  Die häufigste Verwirrung: Nach `git add` zeigt `git diff` nichts mehr an. Die Änderung ist nicht weg, sie liegt jetzt im Index – `git diff --staged` zeigt sie.

  > [!PRAXIS] Vor jedem Commit
  > `git status` und `git diff --staged` gehören vor jeden Commit. Genau dieses Diff sehen deine Kolleginnen später im Review. Vergessene `print()`-Aufrufe, auskommentierter Code, eine `.env` oder ein geändertes Lockfile fallen hier auf – oder erst, wenn jemand anderes sie im Pull Request anmerkt.

  ## History lesen: log und show

  `git log` listet Commits vom neuesten zum ältesten. Die Optionen, die du täglich brauchst ([git-log](https://git-scm.com/docs/git-log), [Pro Git · Viewing the Commit History](https://git-scm.com/book/en/v2/Git-Basics-Viewing-the-Commit-History)):

  ```console
  $ git log --oneline --graph
  *   f877846 Merge branch 'login'
  |\
  | * 0ea850b Passwort-Prüfung ergänzen
  | * d712b2c Login-Formular anlegen
  * | 58ea4f5 README ergänzen
  |/
  * 1458006 Timeout für Bestellabruf erhöhen
  * 7a2c8c8 Grundgerüst der Shop-API
  ```

  - `--oneline` zeigt gekürzten Hash und Betreff, eine Zeile pro Commit.
  - `--graph` zeichnet die Verzweigungen. Hier wurde ein Branch `login` in `main` zusammengeführt.
  - `-n 3` (kurz `-3`) begrenzt auf die letzten drei Commits.
  - `--stat` zeigt pro Commit die geänderten Dateien mit Zeilenzahlen, `-p` das vollständige Diff.
  - `git log -- src/api.py` beschränkt die Liste auf Commits, die diese Datei betreffen.

  `git show` zeigt einen einzelnen Commit mit Metadaten und Diff, ohne Argument den aktuellen (`HEAD`). `git show --stat HEAD~1` zeigt den vorletzten Commit als Dateiübersicht, `git show HEAD~1:src/api.py` den Inhalt einer Datei, wie sie in diesem Commit war – nützlich, wenn du nur nachsehen und nichts zurücksetzen willst.

  ## Zurücknehmen, löschen, umbenennen, ignorieren

  [`git restore`](https://git-scm.com/docs/git-restore) kopiert Dateiinhalte zwischen den Bereichen zurück – immer von links nach rechts im Bild oben, niemals in einen Commit:

  ```bash
  git restore --staged config.yaml        # Index ← HEAD: nicht mehr vormerken, Datei bleibt geändert
  git restore config.yaml                 # Arbeitsverzeichnis ← Index: lokale Änderung verwerfen
  git restore --source=HEAD~2 config.yaml # Arbeitsverzeichnis ← Stand von vor zwei Commits
  git restore -SW templates/login.html    # Index und Arbeitsverzeichnis ← HEAD
  ```

  Ohne Option ist die Quelle der Index, mit `--staged` (`-S`) ist sie HEAD. `-W` steht für `--worktree`. `git restore` gibt es seit Git 2.23. In älteren Anleitungen findest du dieselben Operationen als `git reset datei` (entspricht `git restore --staged datei`) und `git checkout -- datei` (entspricht `git restore datei`). Beide funktionieren weiterhin.

  > [!WARNING]
  > `git restore datei` überschreibt die Datei ohne Rückfrage. Änderungen, die nie mit `git add` vorgemerkt oder committet wurden, hat Git nie gesehen – sie sind danach endgültig weg. Committete Stände dagegen lassen sich fast immer zurückholen ([Reset und Reflog](/git/reset-reflog)).

  **Löschen und Umbenennen.** `git rm datei` löscht die Datei im Arbeitsverzeichnis und merkt die Löschung vor. `git rm --cached datei` entfernt sie nur aus dem Index – die Datei bleibt auf der Platte und wird untracked. Das brauchst du, wenn eine Datei versehentlich ins Repository geraten ist ([Gute Commits](/git/commit-hygiene)). `git mv alt neu` benennt um und merkt beides vor. Git speichert allerdings keine Umbenennungen: Es sieht eine gelöschte und eine neue Datei und erkennt am ähnlichen Inhalt, dass es eine Umbenennung war.

  ```console
  $ mv src/utils.py src/helpers.py
  $ git status --short
   D src/utils.py
  ?? src/helpers.py
  $ git add src/utils.py src/helpers.py
  $ git status --short
  R  src/utils.py -> src/helpers.py
  ```

  **Ignorieren.** Build-Ergebnisse, Logs und Geheimnisse gehören nicht ins Repository. Eine Datei `.gitignore` im Projekt listet Muster, die `git status` und `git add .` überspringen ([gitignore](https://git-scm.com/docs/gitignore)):

  ```text title=.gitignore
  # Python
  __pycache__/
  .venv/
  # Lokale Einstellungen und Geheimnisse
  .env
  *.log
  ```

  `.gitignore` wirkt nur auf Dateien, die Git noch nicht verfolgt. Eine bereits committete Datei bleibt verfolgt, bis du sie mit `git rm --cached` herausnimmst. Muster, Negation und globale Ausnahmen behandelt [Gute Commits und Commit-Hygiene](/git/commit-hygiene).

  > [!TIP] Hilfe im Terminal
  > `git status -h` zeigt eine kurze Übersicht der Optionen, `git help status` (oder `git status --help`) die vollständige Handbuchseite, `git help -g` die Liste der Konzept-Anleitungen wie `git help everyday` ([git-help](https://git-scm.com/docs/git-help)).

  ## Häufige Fehler

  - **Die Änderung fehlt im Commit.** Die Datei wurde nach `git add` noch einmal geändert. `git status --short` zeigt `MM`. Erneut `git add`, dann committen.
  - **`git diff` zeigt nichts, obwohl du etwas geändert hast.** Die Änderung ist bereits vorgemerkt. `git diff --staged` zeigt sie.
  - **`git add .` nimmt zu viel mit.** `.env`, Logs oder `node_modules/` landen im Index. Vorher `git status` lesen, eine `.gitignore` anlegen und Überflüssiges mit `git restore --staged` wieder herausnehmen.
  - **`git restore datei` statt `git restore --staged datei`.** Du wolltest die Datei nur aus dem Index nehmen und hast stattdessen ihren Inhalt überschrieben – oder Git meldet `pathspec … did not match`, weil die Datei im Index gar nicht mehr existiert.
  - **Commits mit falscher Identität.** Im Firmen-Repository steht deine private Adresse. `git config --show-origin user.email` zeigt, woher sie kommt; die richtige Adresse lokal setzen, bevor du pushst.
  - **Mit `rm` gelöscht und gewundert.** `git status` zeigt ` D`: Die Löschung ist noch nicht vorgemerkt. `git rm datei` oder `git add datei` merkt sie vor, `git restore datei` holt die Datei zurück.
  - **`git init` im falschen Verzeichnis.** Ein `.git` im Home-Verzeichnis macht jedes Unterverzeichnis zu einem Teil dieses Repositorys. `git rev-parse --show-toplevel` zeigt, wo das Repository beginnt.

  ## Zusammenfassung

  - Ein Commit ist ein vollständiger Schnappschuss des Projekts; Diffs berechnet Git bei Bedarf.
  - Einstellungen kommen aus system, global und local; die spezifischere Ebene gewinnt, `--show-origin` zeigt die Quelle.
  - Arbeitsverzeichnis → `git add` → Index → `git commit` → Repository. Der Commit enthält den Index, nicht die Dateien auf der Platte.
  - `git status --short`: linke Spalte Index gegen HEAD, rechte Spalte Arbeitsverzeichnis gegen Index.
  - `git diff` = noch nicht vorgemerkt, `git diff --staged` = kommt in den Commit, `git diff HEAD` = alles seit dem letzten Commit.
  - `git log --oneline --graph -n 10`, `--stat` und `-p` für die History; `git show` für einen einzelnen Commit.
  - `git restore --staged` nimmt aus dem Index, `git restore` verwirft Änderungen im Arbeitsverzeichnis – endgültig.
  - `git rm`, `git mv` und `.gitignore` halten den Index sauber; Umbenennungen erkennt Git am Inhalt.
exercises:
  - id: was-landet-im-commit
    type: choice
    title: Zweimal geändert, einmal vorgemerkt
    prompt: Die Datei `src/api.py` war vorher committet. Welchen Inhalt hat sie im neuen Commit?
    lang: bash
    code: |
      printf 'TIMEOUT = 30\n' > src/api.py
      git add src/api.py
      printf 'TIMEOUT = 60\n' > src/api.py
      git commit -m "Timeout erhöhen"
    options:
      - text: "`TIMEOUT = 30`"
        correct: true
        why: "`git add` hat genau diese Fassung in den Index kopiert, und `git commit` macht aus dem Index den Commit."
      - text: "`TIMEOUT = 60`"
        correct: false
        why: "`git commit` liest das Arbeitsverzeichnis nicht. Die zweite Änderung bleibt als ` M` liegen, bis du sie erneut vormerkst."
      - text: Der Commit scheitert, weil sich die Datei nach `git add` geändert hat.
        correct: false
        why: Git prüft das nicht. Es ist ein normaler Zustand, dass Index und Arbeitsverzeichnis voneinander abweichen.
      - text: Der Commit enthält beide Fassungen als zwei aufeinanderfolgende Änderungen.
        correct: false
        why: Ein Commit ist ein einziger Schnappschuss. Pro Datei gibt es darin genau eine Fassung.
    explanation: |
      `git add` ist ein Kopiervorgang zu einem Zeitpunkt, keine dauerhafte Verknüpfung. Nach dem Commit zeigt `git status --short` die Datei als ` M src/api.py`: Die zweite Änderung existiert nur im Arbeitsverzeichnis. Wer beides committen wollte, braucht ein zweites `git add` oder `git commit -a`.
    resources:
      - title: Pro Git · Recording Changes to the Repository
        url: https://git-scm.com/book/en/v2/Git-Basics-Recording-Changes-to-the-Repository

  - id: commit-a-grenzen
    type: choice
    title: Was nimmt commit -a mit?
    prompt: |
      Seit dem letzten Commit hast du `src/api.py` geändert, `README.md` mit `rm` gelöscht und die neue Datei `src/payment.py` angelegt. Nichts ist vorgemerkt. Du führst `git commit -am "Zahlungsmodul"` aus. Was steckt im Commit?
    options:
      - text: Die Änderung an `src/api.py`
        correct: true
        why: "`-a` merkt alle geänderten Dateien vor, die Git bereits verfolgt."
      - text: Die Löschung von `README.md`
        correct: true
        why: "`-a` erfasst auch Löschungen verfolgter Dateien."
      - text: Die neue Datei `src/payment.py`
        correct: false
        why: "Untracked Dateien nimmt `-a` nie mit. Sie brauchen ein explizites `git add`; danach zeigt `git status --short` sie weiter als `??`."
      - text: Nichts, weil vorher kein `git add` ausgeführt wurde
        correct: false
        why: Genau diesen Schritt übernimmt `-a` für verfolgte Dateien.
    explanation: |
      `git commit -a` entspricht grob „alle verfolgten Dateien vormerken, dann committen“. Neue Dateien sind davon ausgenommen – das schützt davor, versehentlich `.env` oder Build-Ergebnisse zu committen, führt aber oft dazu, dass eine neue Datei im Commit fehlt. Ein Blick auf `git status` nach dem Commit zeigt `?? src/payment.py`.
    resources:
      - title: git-commit
        url: https://git-scm.com/docs/git-commit

  - id: nur-den-fix-committen
    type: order
    title: Nur den Fix committen
    prompt: |
      Du hast in `src/api.py` einen Bugfix und in `config.yaml` eine lokale Debug-Einstellung. Nur der Fix soll in einen Commit, und du willst jeden Schritt kontrollieren. Bring die Befehle in eine sinnvolle Reihenfolge.
    lang: bash
    lines: |
      git status --short
      git diff src/api.py
      git add src/api.py
      git diff --staged
      git commit -m "Timeout für Bestellabruf erhöhen"
      git log --oneline -n 1
    alternatives:
      - [2, 1, 3, 4, 5, 6]
    explanation: |
      Erst Überblick (`status`) und Inhalt (`diff`) der noch nicht vorgemerkten Änderung – die Reihenfolge dieser beiden ist egal. Dann vormerken, danach mit `git diff --staged` prüfen, was im Commit landet. Vor dem `add` wäre `--staged` leer, nach dem `commit` ebenfalls. Zum Schluss bestätigt `git log`, dass der Commit existiert. `config.yaml` bleibt als ` M` im Arbeitsverzeichnis.
    resources:
      - title: git-diff
        url: https://git-scm.com/docs/git-diff

  - id: status-spalten
    type: output
    title: Zwei Spalten lesen
    prompt: Was gibt das Skript aus? Achte auf Leerzeichen in den ersten beiden Spalten.
    lang: bash
    code: |
      git init -q
      printf 'debug: false\n' > config.yaml
      printf 'print("v1")\n' > app.py
      git add .
      git commit -qm "Erste Version"
      printf 'debug: true\n' > config.yaml
      printf 'print("v2")\n' > app.py
      git add app.py
      printf 'print("v3")\n' > app.py
      printf 'TODO\n' > notizen.txt
      git status --short
    expected: |
      MM app.py
       M config.yaml
      ?? notizen.txt
    verify: true
    hints:
      - Die linke Spalte vergleicht Index mit HEAD, die rechte Arbeitsverzeichnis mit Index.
      - "`app.py` wurde vorgemerkt und danach noch einmal geändert."
    explanation: |
      `app.py` hat eine vorgemerkte Änderung (`v2`, linke Spalte `M`) und danach eine weitere im Arbeitsverzeichnis (`v3`, rechte Spalte `M`). `config.yaml` ist nur im Arbeitsverzeichnis geändert, deshalb steht das `M` rechts und links ein Leerzeichen. `notizen.txt` kennt Git nicht (`??`); untracked Dateien stehen immer am Ende.
    resources:
      - title: git-status · Short Format
        url: https://git-scm.com/docs/git-status#_short_format

  - id: drei-diffs
    type: output
    title: Drei Richtungen
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      printf 'TIMEOUT = 10\n' > api.py
      printf 'debug: false\n' > config.yaml
      printf '# Shop\n' > README.md
      git add .
      git commit -qm "Start"
      printf 'TIMEOUT = 30\n' > api.py
      git add api.py
      printf 'debug: true\n' > config.yaml
      echo "diff:"; git diff --name-only
      echo "staged:"; git diff --staged --name-only
      echo "HEAD:"; git diff HEAD --name-only
    expected: |
      diff:
      config.yaml
      staged:
      api.py
      HEAD:
      api.py
      config.yaml
    verify: true
    explanation: |
      `git diff` vergleicht Arbeitsverzeichnis mit Index – dort unterscheidet sich nur `config.yaml`, denn `api.py` ist bereits vorgemerkt. `--staged` vergleicht Index mit HEAD und zeigt deshalb nur `api.py`. `git diff HEAD` vergleicht das Arbeitsverzeichnis direkt mit dem letzten Commit und sieht beide Änderungen. `README.md` taucht nirgends auf, weil sie in allen drei Bereichen gleich ist.
    resources:
      - title: git-diff
        url: https://git-scm.com/docs/git-diff

  - id: restore-staged-vorhersagen
    type: output
    title: Erst aus dem Index, dann weg
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      printf 'port: 8000\n' > config.yaml
      git add config.yaml
      git commit -qm "Konfiguration"
      printf 'port: 9000\n' > config.yaml
      git add config.yaml
      git restore --staged config.yaml
      git status --short
      cat config.yaml
      git restore config.yaml
      cat config.yaml
    expected: |2
       M config.yaml
      port: 9000
      port: 8000
    verify: true
    explanation: |
      `git restore --staged` kopiert die Fassung aus HEAD in den Index – die Datei ist nicht mehr vorgemerkt, im Arbeitsverzeichnis steht aber weiter `port: 9000`, deshalb ` M`. Erst `git restore` ohne Option überschreibt das Arbeitsverzeichnis mit dem Index, der jetzt wieder `port: 8000` enthält. Der zweite Schritt ist der gefährliche: `port: 9000` ist danach nirgends mehr gespeichert.
    resources:
      - title: git-restore
        url: https://git-scm.com/docs/git-restore

  - id: befehle-fuer-den-ueberblick
    type: gap
    title: Der Überblick vor dem Commit
    prompt: Ergänze die Optionen so, dass jeder Befehl genau das tut, was der Kommentar darüber beschreibt.
    lang: bash
    code: |
      # kompakte Übersicht, zwei Statusspalten pro Datei
      git status ⟦--short⟧
      # genau die Änderungen, die im nächsten Commit landen
      git diff ⟦--staged⟧
      # die letzten drei Commits, je eine Zeile
      git log --oneline ⟦-n 3⟧
      # geänderte Dateien des letzten Commits mit Zeilenzahlen
      git show ⟦--stat⟧ HEAD
    gaps:
      - label: Kurzform
        hint: Die Langoption heißt wie das englische Wort für „kurz“.
        accept: ["-s"]
      - label: Index gegen HEAD
        hint: Zwei gleichbedeutende Langoptionen, eine davon beschreibt die Staging Area.
        accept: ["--cached"]
      - label: Anzahl begrenzen
        hint: Eine Kurzoption mit Zahl, die auch als `-3` geschrieben werden kann.
        accept: ["-3", "-n3", "--max-count=3", "--max-count 3"]
      - label: Dateiübersicht
        hint: Dieselbe Option wie bei `git log` für Statistiken.
    explanation: |
      `--short` (oder `-s`) ist die Zwei-Spalten-Ansicht aus der Lektion. `--staged` und `--cached` sind Synonyme für den Vergleich Index gegen HEAD. `-n 3`, `-3` und `--max-count=3` begrenzen die Ausgabe gleichermaßen. `--stat` funktioniert bei `log` und `show` und ist der schnellste Weg, den Umfang eines Commits abzuschätzen, bevor du das vollständige Diff liest.
    resources:
      - title: git-log
        url: https://git-scm.com/docs/git-log
      - title: git-show
        url: https://git-scm.com/docs/git-show

  - id: aus-dem-index-nehmen
    type: command
    title: Zu viel vorgemerkt
    prompt: Nimm `config.yaml` aus dem Index. Die Änderung in der Datei selbst muss erhalten bleiben.
    context: |
      `git status --short` zeigt:

      ```text
      M  config.yaml
      M  src/api.py
      ```
    answers:
      - git restore --staged config.yaml
      - git restore -S config.yaml
      - git restore --staged -- config.yaml
      - git restore -S -- config.yaml
      - git reset config.yaml
      - git reset -- config.yaml
      - git reset HEAD config.yaml
      - git reset HEAD -- config.yaml
      - git reset -q config.yaml
    output: |
      $ git status --short
       M config.yaml
      M  src/api.py
    explanation: |
      `git restore --staged` setzt den Eintrag im Index auf den Stand von HEAD zurück und lässt das Arbeitsverzeichnis unberührt – aus `M ` wird ` M`. Das ältere `git reset config.yaml` tut mit einem Pfad dasselbe; ohne Pfad und mit `--hard` wäre `reset` dagegen ein anderes Werkzeug ([Reset und Reflog](/git/reset-reflog)). `git restore config.yaml` ohne `--staged` wäre hier falsch: Es überschreibt die Datei mit der vorgemerkten Fassung.
    resources:
      - title: git-restore
        url: https://git-scm.com/docs/git-restore

  - id: vorgemerktes-diff
    type: command
    title: Was geht in den Commit?
    prompt: Zeige das vollständige Diff genau der Änderungen, die ein `git commit` jetzt festhalten würde.
    context: |
      `git status --short` zeigt:

      ```text
       M config.yaml
      M  src/api.py
      ```
    answers:
      - git diff --staged
      - git diff --cached
      - git diff --staged HEAD
      - git diff --cached HEAD
    output: |
      diff --git a/src/api.py b/src/api.py
      index 4c95e21..3caf777 100644
      --- a/src/api.py
      +++ b/src/api.py
      @@ -1,6 +1,6 @@
       import requests

      -TIMEOUT = 10
      +TIMEOUT = 30

       def fetch_orders(session):
           return session.get("/orders", timeout=TIMEOUT)
    explanation: |
      `git diff --staged` vergleicht Index mit HEAD. `config.yaml` erscheint nicht, weil ihre Änderung nicht vorgemerkt ist – ein `git diff` ohne Option würde umgekehrt nur `config.yaml` zeigen. `--cached` ist das ältere Synonym, beide sind gleichwertig.
    resources:
      - title: git-diff
        url: https://git-scm.com/docs/git-diff

  - id: firmen-adresse
    type: command
    title: Die richtige Adresse im Firmen-Repository
    prompt: Setze die E-Mail-Adresse `lea.lernt@firma.example` **nur für dieses Repository**. Deine globale Einstellung soll unverändert bleiben.
    context: Du bist im Verzeichnis `~/firma/shop-api`. Global ist `lea@privat.example` eingetragen.
    answers:
      - git config user.email lea.lernt@firma.example
      - git config --local user.email lea.lernt@firma.example
      - git config set user.email lea.lernt@firma.example
      - git config set --local user.email lea.lernt@firma.example
    output: |
      $ git config --show-origin user.email
      file:.git/config  lea.lernt@firma.example
    explanation: |
      Ohne Ebenen-Option schreibt `git config` in die lokale Ebene, also nach `.git/config`. Beim Lesen gewinnt die lokale Ebene über die globale, deshalb verwenden alle künftigen Commits in diesem Repository die Firmenadresse, alle anderen Repositorys weiter die private. Bereits vorhandene Commits ändert das nicht – die Adresse steht fest in jedem Commit.
    resources:
      - title: git-config · Configuration File
        url: https://git-scm.com/docs/git-config#_configuration_file

  - id: debug-config-im-commit
    type: bug
    title: Die Debug-Einstellung ist doch im Commit
    prompt: |
      Im echten Projekt sind zwanzig Dateien geändert, deshalb merkt die Sequenz zuerst bewusst alles vor. Danach soll nur `config.yaml` wieder aus dem Commit herausgehalten werden, die Debug-Einstellung darin aber lokal erhalten bleiben.

      Nach dem Lauf zeigt `git show --name-only HEAD` die Dateien `config.yaml` und `src/api.py`, und `git status` meldet `nothing to commit, working tree clean`. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: bash
    code: |
      # Alle Änderungen vormerken, config.yaml bleibt lokal
      git add .
      git restore config.yaml
      git commit -m "Timeout für Bestellabruf erhöhen"
    lines: [3]
    fix:
      - line: 3
        answers:
          - git restore --staged config.yaml
          - git restore -S config.yaml
          - git restore --staged -- config.yaml
          - git reset config.yaml
          - git reset -q config.yaml
          - git reset -- config.yaml
          - git reset HEAD config.yaml
          - git reset HEAD -- config.yaml
    explanation: |
      `git restore` ohne `--staged` kopiert vom Index ins Arbeitsverzeichnis. Nach `git add .` enthält der Index bereits die Debug-Fassung – der Befehl ändert also nichts, und `config.yaml` bleibt vorgemerkt. Richtig ist die Gegenrichtung: `git restore --staged config.yaml` holt den Index-Eintrag aus HEAD zurück, die Datei auf der Platte behält `log_level: debug`. Bei einer Datei mit weiteren, nicht vorgemerkten Änderungen hätte die fehlerhafte Zeile diese sogar gelöscht.
    resources:
      - title: git-restore
        url: https://git-scm.com/docs/git-restore

  - id: config-herkunft
    type: explain
    title: Woher kommt diese Einstellung?
    prompt: |
      Eine Kollegin wundert sich, dass ihre Commits im Firmen-Repository mal mit privater, mal mit Firmenadresse erscheinen. In `~/firma/shop-api` liefert Git diese Ausgabe. Erkläre, welche Adresse der nächste Commit hier bekommt, warum, was in anderen Repositorys passiert und wie sie das künftig im Griff behält.
    lang: console
    code: |
      $ git config --list --show-origin
      file:/etc/gitconfig        core.autocrlf=input
      file:/home/lea/.gitconfig  user.name=Lea Lernt
      file:/home/lea/.gitconfig  user.email=lea@privat.example
      file:/home/lea/.gitconfig  init.defaultbranch=main
      file:/home/lea/.gitconfig  core.editor=nano
      file:.git/config           core.repositoryformatversion=0
      file:.git/config           core.filemode=true
      file:.git/config           core.bare=false
      file:.git/config           core.logallrefupdates=true
      file:.git/config           user.email=lea.lernt@firma.example
    points:
      - "Die Präfixe zeigen drei Ebenen: `/etc/gitconfig` (system), `~/.gitconfig` (global), `.git/config` (local)."
      - "`user.email` ist zweimal gesetzt; der lokale Wert wird zuletzt gelesen und gewinnt, der nächste Commit hier bekommt die Firmenadresse."
      - In jedem anderen Repository ohne lokalen Eintrag gilt die globale private Adresse – daher die gemischten Commits.
      - "`core.autocrlf` gilt für alle Benutzer des Rechners, `init.defaultBranch` wirkt nur beim Anlegen neuer Repositorys."
      - "Prüfen mit `git config --show-origin user.email`, in jedem Firmen-Repository lokal setzen; bestehende Commits ändert das nicht."
    explanation: |
      Git liest system, dann global, dann local; bei Einstellungen mit nur einem Wert gewinnt der zuletzt gelesene. `user.email` steht global mit der privaten und lokal mit der Firmenadresse, deshalb gilt in `shop-api` die Firmenadresse. In einem anderen Firmen-Repository ohne lokalen Eintrag rutscht die private Adresse durch – das erklärt das gemischte Bild. `core.autocrlf` stammt aus der Systemkonfiguration und betrifft alle Benutzer, `init.defaultbranch` wird erst beim nächsten `git init` wirksam. Ich würde vor dem ersten Commit in jedem Firmen-Repository `git config --show-origin user.email` prüfen und die Adresse dort lokal setzen. Wer viele Firmen-Repositorys in einem Verzeichnis hat, kann das mit `includeIf` in der globalen Konfiguration automatisieren. Schon vorhandene Commits behalten ihre Adresse.
    resources:
      - title: git-config · Configuration File
        url: https://git-scm.com/docs/git-config#_configuration_file
      - title: Pro Git · First-Time Git Setup
        url: https://git-scm.com/book/en/v2/Getting-Started-First-Time-Git-Setup

  - id: labor-falsch-gestaged
    type: practice
    title: "Labor: Die Debug-Einstellung will mit"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Es erzeugt die Lage vom Anfang der Lektion: Der Timeout-Fix in `src/api.py` soll committet werden. `git status --short` zeigt aber auch `config.yaml` – und zwar mit zwei Buchstaben. In `config.yaml` stecken zwei lokale Einstellungen (`log_level: debug` und `mock_payments: true`), die du weiter zum Testen brauchst, die aber nicht in den Commit gehören.

      Stelle den Zustand her, in dem genau ein neuer Commit „Timeout für Bestellabruf erhöhen“ nur `src/api.py` enthält und beide lokalen Einstellungen in `config.yaml` erhalten bleiben. Prüfe am Ende mit `git show --name-only HEAD` und `git status --short`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      mkdir src
      printf 'TIMEOUT = 10\n' > src/api.py
      printf 'log_level: info\nmock_payments: false\n' > config.yaml
      git add .
      git commit -qm "Grundgerüst der Shop-API"
      # Der Bugfix – gehört in den Commit
      printf 'TIMEOUT = 30\n' > src/api.py
      # Lokale Debug-Einstellung – gehört nicht in den Commit
      printf 'log_level: debug\nmock_payments: false\n' > config.yaml
      git add .
      # Später weiter lokal experimentiert
      printf 'log_level: debug\nmock_payments: true\n' > config.yaml
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      mkdir src
      printf 'TIMEOUT = 10\n' > src/api.py
      printf 'log_level: info\nmock_payments: false\n' > config.yaml
      git add .
      git commit -qm "Grundgerüst der Shop-API"
      # Der Bugfix – gehört in den Commit
      printf 'TIMEOUT = 30\n' > src/api.py
      # Lokale Debug-Einstellung – gehört nicht in den Commit
      printf 'log_level: debug\nmock_payments: false\n' > config.yaml
      git add .
      # Später weiter lokal experimentiert
      printf 'log_level: debug\nmock_payments: true\n' > config.yaml
      # Reparatur
      git restore --staged config.yaml
      git commit -qm "Timeout für Bestellabruf erhöhen"
      # Kontrolle
      test "$(git log -1 --format=%s)" = "Timeout für Bestellabruf erhöhen"
      test "$(git show --name-only --format= HEAD)" = "src/api.py"
      test "$(git status --short)" = " M config.yaml"
      grep -q 'log_level: debug' config.yaml
      grep -q 'mock_payments: true' config.yaml
    checklist:
      - Vor der Reparatur zeigt `git status --short` die Zeile `MM config.yaml`, und du kannst beide Buchstaben erklären.
      - "`git show --name-only --format= HEAD` gibt nur `src/api.py` aus."
      - "`git status --short` zeigt danach genau ` M config.yaml`."
      - "`config.yaml` enthält weiter `log_level: debug` und `mock_payments: true`."
      - Du hast weder `git restore config.yaml` ohne `--staged` noch `git reset --hard` benutzt.
    verify: true
    explanation: |
      `MM` bedeutet: eine Fassung von `config.yaml` liegt im Index (`log_level: debug`), eine neuere im Arbeitsverzeichnis (zusätzlich `mock_payments: true`). `git restore --staged config.yaml` ersetzt nur den Index-Eintrag durch die Fassung aus HEAD; das Arbeitsverzeichnis bleibt, wie es ist. Danach nimmt `git commit` ausschließlich `src/api.py` mit. Ein `git restore config.yaml` hätte dagegen die Datei auf die vorgemerkte Fassung zurückgesetzt und `mock_payments: true` gelöscht – eine Änderung, die Git nie gespeichert hatte. `git reset config.yaml` ist eine gleichwertige Reparatur.
    resources:
      - title: git-restore
        url: https://git-scm.com/docs/git-restore
      - title: Pro Git · Undoing Things
        url: https://git-scm.com/book/en/v2/Git-Basics-Undoing-Things

  - id: labor-geloeschte-dateien
    type: practice
    title: "Labor: Die Login-Seite ist verschwunden"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Nach einem hastigen Aufräumen startet die App nicht mehr: `ModuleNotFoundError: No module named 'src.auth'`, und die Login-Seite liefert 404. Deine laufende Arbeit an `src/api.py` (`TIMEOUT = 30`) ist noch nicht committet und muss erhalten bleiben.

      Stelle den Zustand her, in dem alle Dateien wieder den Inhalt aus dem letzten Commit haben – außer `src/api.py`, das deine Änderung behält. Prüfe am Ende mit `git status --short`: Es darf nur noch ` M src/api.py` erscheinen.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      mkdir -p src templates
      printf 'def login(user, password):\n    ...\n' > src/auth.py
      printf '<form method="post">Login</form>\n' > templates/login.html
      printf 'TIMEOUT = 10\n' > src/api.py
      git add .
      git commit -qm "Login-Seite und API-Client"
      # Deine laufende Arbeit – soll erhalten bleiben
      printf 'TIMEOUT = 30\n' > src/api.py
      # Beim Aufräumen zu viel erwischt
      rm src/auth.py
      git rm -q templates/login.html
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q
      mkdir -p src templates
      printf 'def login(user, password):\n    ...\n' > src/auth.py
      printf '<form method="post">Login</form>\n' > templates/login.html
      printf 'TIMEOUT = 10\n' > src/api.py
      git add .
      git commit -qm "Login-Seite und API-Client"
      # Deine laufende Arbeit – soll erhalten bleiben
      printf 'TIMEOUT = 30\n' > src/api.py
      # Beim Aufräumen zu viel erwischt
      rm src/auth.py
      git rm -q templates/login.html
      # Reparatur
      git restore src/auth.py
      git restore --staged --worktree templates/login.html
      # Kontrolle
      test "$(git status --short)" = " M src/api.py"
      grep -q 'def login' src/auth.py
      grep -q 'form method' templates/login.html
      grep -q 'TIMEOUT = 30' src/api.py
    checklist:
      - Vor der Reparatur zeigt `git status --short` die Zeilen ` D src/auth.py` und `D  templates/login.html`, und du kannst den Unterschied der Spalten erklären.
      - "`src/auth.py` und `templates/login.html` existieren wieder mit dem Inhalt aus dem letzten Commit."
      - "`git status --short` zeigt nur noch ` M src/api.py`."
      - "`src/api.py` enthält weiter `TIMEOUT = 30`."
      - Du hast kein `git reset --hard` und kein `git restore .` verwendet.
    verify: true
    explanation: |
      Die beiden Dateien sind in unterschiedlichen Bereichen verschwunden. `src/auth.py` fehlt nur im Arbeitsverzeichnis (` D`), im Index steht sie noch – `git restore src/auth.py` kopiert sie von dort zurück. `templates/login.html` hat `git rm` auch aus dem Index entfernt (`D `). Ein `git restore templates/login.html` scheitert deshalb mit `pathspec … did not match any file(s) known to git`, denn die Standardquelle ist der Index. Mit `--staged --worktree` (kurz `-SW`) ist die Quelle HEAD, und beide Bereiche werden wiederhergestellt; `git checkout HEAD -- templates/login.html` leistet dasselbe. Ein `git reset --hard` hätte zwar alles zurückgeholt, aber auch `TIMEOUT = 30` vernichtet.
    resources:
      - title: git-restore
        url: https://git-scm.com/docs/git-restore
      - title: git-rm
        url: https://git-scm.com/docs/git-rm
