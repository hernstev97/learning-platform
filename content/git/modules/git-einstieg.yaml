id: git-einstieg
title: "Git-Grundlagen: drei Bereiche"
level: 1
minutes: 150
summary: Du lernst das Modell hinter jedem Git-Befehl – Arbeitsverzeichnis, Index und Repository – und entscheidest damit genau, was in einen Commit kommt, was du dir ansiehst und was du zurücknimmst.
goals:
  - Du richtest Git mit Name, E-Mail, Standard-Branch und Editor ein und findest mit `--show-origin` heraus, aus welcher Ebene (system, global, local) eine Einstellung stammt.
  - Du erklärst Arbeitsverzeichnis, Index und Repository und sagst für `add`, `commit` und `restore` vorher, welchen Bereich sie verändern.
  - Du liest `git status --short` Spalte für Spalte und wählst die passende Variante von `git diff` für jede der drei Vergleichsrichtungen.
  - Du liest die History mit `git log` und `git show` in der Form, die du gerade brauchst.
  - Du nimmst falsch vorgemerkte Dateien aus dem Index, verwirfst lokale Änderungen bewusst und stellst gelöschte Dateien wieder her, ohne andere Arbeit zu verlieren.
