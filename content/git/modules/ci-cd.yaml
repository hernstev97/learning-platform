id: ci-cd
title: CI/CD rund um Git
level: 3
minutes: 170
summary: Was Hooks lokal leisten und warum erst die CI Regeln durchsetzt, was ein CI-Klon von deinem Repository enthält, wie Tags zu Releases werden und was zu tun ist, wenn ein Secret in der History gelandet ist.
goals:
  - Du schreibst `pre-commit`-, `commit-msg`- und `pre-push`-Hooks, verteilst sie mit `core.hooksPath` und erklärst, warum Hooks keine Durchsetzung sind.
  - Du erklärst, was `actions/checkout` klont (Tiefe 1, Merge-Ref eines PR) und behebst Fehler wie `No names found` oder unbekannte Revisionen in flachen Klonen.
  - Du unterscheidest flache und partielle Klone und wählst `fetch-depth`, `--filter` und `sparse-checkout` passend zur Aufgabe.
  - Du versionierst mit SemVer und annotierten Tags, liest `git describe` und baust einen Release-Workflow, der auf Tags reagiert.
  - Du reagierst richtig auf ein Secret in der History – rotieren zuerst, History bereinigen nur, wenn nötig.
