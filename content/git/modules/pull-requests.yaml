id: pull-requests
title: Remotes und Pull-Request-Workflows
level: 2
minutes: 170
summary: Wie Remotes, Remote-Tracking-Branches und Pull Requests zusammenspielen – vom ersten Push über Review und Force-Push bis zum Merge, dazu Branching-Modelle und die Regeln, mit denen Teams main schützen.
goals:
  - Du verwaltest Remotes (`origin`, `upstream`) sicher, räumst veraltete Remote-Tracking-Branches mit `fetch --prune` auf und synchronisierst einen Fork.
  - Du führst einen Pull Request durch seinen Lebenszyklus und hältst ihn mit Rebase, Fixup-Commits und `--force-with-lease` aktuell, ohne fremde Arbeit zu überschreiben.
  - Du erklärst die drei Merge-Methoden auf GitHub und ihre Folgen für History und lokale Branches.
  - Du ordnest Trunk-based Development, GitHub Flow, Git Flow und Release-Branches ein und begründest eine Wahl für ein Team.
  - Du kennst Branch Protection, Rulesets, CODEOWNERS, Pflicht-Checks und Merge Queue und weißt, welches Problem sie jeweils lösen.
