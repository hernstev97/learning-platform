lesson: |
  Dein Login-Feature läuft lokal. Bis es auf `main` liegt, passiert noch einiges: Du pushst den Branch, öffnest einen Pull Request, die CI läuft, eine Kollegin kommentiert, du baust die Anmerkungen ein, `main` ist inzwischen weitergelaufen, jemand anderes hat auf deinen Branch gepusht – und am Ende wird gemergt und aufgeräumt. An genau diesen Übergängen entstehen im Team die meisten Git-Probleme: abgelehnte Pushes, überschriebene Commits, Branches, die „nicht vollständig gemergt“ sind, obwohl der PR längst durch ist.

  Alles davon lässt sich mit einem Denkmodell erklären: Ein Remote ist ein anderes Repository, deine Remote-Tracking-Branches sind der Stand beim letzten Kontakt, und ein Pull Request ist eine Anfrage auf dem Server, einen Branch in einen anderen zu mergen.

  ## Remotes: Namen für andere Repositorys

  Ein **Remote** ist ein Kurzname für eine URL. `git clone` legt automatisch `origin` an. Mit [`git remote`](https://git-scm.com/docs/git-remote) verwaltest du weitere:

  ```console
  $ git remote -v
  origin	git@github.com:lea/shop.git (fetch)
  origin	git@github.com:lea/shop.git (push)
  $ git remote add upstream https://github.com/acme/shop.git
  $ git remote rename origin fork
  $ git remote set-url fork git@github.com:lea/webshop.git
  ```

  `rename` benennt das Remote samt seiner Remote-Tracking-Branches um, `set-url` ändert nur die Adresse – etwa wenn ein Repository umzieht oder du von HTTPS auf SSH wechselst.

  `git fetch` lädt fehlende Objekte und schreibt den Stand der entfernten Branches nach `refs/remotes/<remote>/…`, also `origin/main`, `origin/feature/login`. Diese **Remote-Tracking-Branches** bewegst du nie selbst; sie ändern sich nur bei `fetch`, `pull` und `push`. Die Grundlagen zu Upstream und ahead/behind stehen im Modul [Branches, HEAD und Remotes](/git/branches-head).

  > [!MERKE]
  > `origin/main` ist kein Live-Blick auf den Server, sondern eine Momentaufnahme vom letzten `fetch`. Jede Aussage wie „ich bin aktuell“ gilt nur bis zum nächsten Push eines anderen.

  **Fork-Workflow.** In Open-Source-Projekten hast du keine Schreibrechte am Original. Du forkst es auf GitHub, klonst deinen Fork und trägst das Original zusätzlich ein. Konvention: `origin` ist dein Fork (dorthin pushst du), `upstream` das Original (von dort holst du).

  ```text
  acme/shop (upstream) ──fetch──►  dein Klon  ──push──►  lea/shop (origin)
          ▲                                                   │
          └─────────── Pull Request: lea:fix/typo → acme:main ┘
  ```

  Den Fork aktualisierst du, indem du `upstream` fetchst, dein lokales `main` vorspulst und es in den Fork pushst.

  **Branches veröffentlichen und löschen.** `git push -u origin feature/login` legt den Branch auf dem Server an und setzt ihn als Upstream; danach genügen `git push` und `git pull`. Mit `push.autoSetupRemote=true` setzt Git den Upstream beim ersten `git push` automatisch. Gelöscht wird ein Remote-Branch mit `git push origin --delete feature/login`.

  Wird ein Branch auf dem Server gelöscht – etwa per „Delete branch“ nach dem Merge –, bleibt dein `origin/feature/login` trotzdem stehen. Erst [`git fetch --prune`](https://git-scm.com/docs/git-fetch#Documentation/git-fetch.txt---prune) entfernt Remote-Tracking-Branches, die es auf dem Server nicht mehr gibt:

  ```console
  $ git fetch --prune
  From github.com:acme/shop
   - [deleted]         (none)     -> origin/feature/login
  $ git branch -vv
  * feature/login a4a7629 [origin/feature/login: gone] Login-Formular
    main          696f6a8 [origin/main] Start
  ```

  Dein lokaler Branch bleibt dabei unangetastet; `gone` zeigt nur, dass sein Upstream verschwunden ist.

  > [!TIP]
  > `git config --global fetch.prune true` macht jedes `fetch` und `pull` zu einem aufräumenden. Das gehört zu den Einstellungen, die sich in jedem Team lohnen.

  ## Der Lebenszyklus eines Pull Requests

  Ein Pull Request ist **kein Git-Objekt**. Er ist eine Funktion der Plattform: die Bitte, den *head branch* (`feature/login`) in den *base branch* (`main`) zu mergen, mit Diskussion, Reviews und Checks drumherum. Git selbst merkt davon nur, dass GitHub zusätzliche Refs anlegt: `refs/pull/57/head` zeigt auf die Spitze deines Branches, `refs/pull/57/merge` auf einen simulierten Merge mit dem Base-Branch ([GitHub Docs · Pull request refs and merge branches](https://docs.github.com/en/pull-requests/reference/pull-requests#pull-request-refs-and-merge-branches)).

  ```bash
  git switch -c feature/login origin/main   # vom aktuellen Server-Stand abzweigen
  # … arbeiten, kleine Commits …
  git push -u origin feature/login
  gh pr create --draft --fill                # Draft-PR, Titel und Text aus den Commits
  gh pr ready                                # später: bereit für Review
  gh pr checkout 57                          # PR einer Kollegin lokal ansehen
  git fetch origin pull/57/head:pr-57        # dasselbe ohne gh
  ```

  Der Ablauf in einem typischen Team:

  1. **Branch** vom aktuellen `origin/main`, ein Thema pro Branch.
  2. **Früh pushen und einen Draft öffnen.** Ein Draft lässt sich nicht mergen, CODEOWNERS werden noch nicht angefragt, die CI läuft aber schon.
  3. **Beschreibung schreiben:** was, warum, wie getestet, was Reviewer besonders ansehen sollen, verknüpftes Ticket.
  4. **Review und CI.** Anmerkungen werden diskutiert, Checks müssen grün sein.
  5. **Aktualisieren:** Review-Anmerkungen einbauen, bei Bedarf auf aktuelles `main` bringen.
  6. **Mergen** mit der Methode, die das Repository vorgibt.
  7. **Aufräumen:** Remote-Branch löschen (GitHub kann das automatisch), lokal `fetch --prune` und Branch löschen.

  Das Werkzeug `gh` (GitHub CLI) ist optional; alles geht auch im Browser.

  > [!PRAXIS] Eine PR-Beschreibung, die Reviews beschleunigt
  > „**Warum:** Nutzer ohne Passwort-Manager scheitern am Login-Timeout (Ticket SHOP-412). **Was:** Timeout von 30 auf 120 Sekunden, Fehlermeldung verständlicher. **Test:** neuer Test in `tests/test_login.py`, manuell im Staging geprüft. **Hinweis:** `config.yaml` bekommt einen neuen Schlüssel, Default ist abwärtskompatibel.“ Wer so schreibt, bekommt schneller ein Review – und im Interview zeigt es, dass du an die Leser deines Codes denkst.

  ## Den PR aktuell halten und auf Reviews reagieren

  **Der abgelehnte Push.** Hat jemand anderes auf deinen Branch gepusht, lehnt der Server deinen Push ab, weil er sonst Commits verlieren würde:

  ```console
  $ git push
  To github.com:acme/shop.git
   ! [rejected]        feature/suche -> feature/suche (fetch first)
  error: failed to push some refs to 'github.com:acme/shop.git'
  hint: Updates were rejected because the remote contains work that you do not
  hint: have locally. This is usually caused by another repository pushing to
  hint: the same ref. If you want to integrate the remote changes, use
  hint: 'git pull' before pushing again.
  hint: See the 'Note about fast-forwards' in 'git push --help' for details.
  ```

  `fetch first` heißt: Der Server hat einen Commit, den du nicht kennst. Nach einem `fetch` hieße die Meldung `non-fast-forward`. Ein nacktes `git pull` bricht bei auseinandergelaufenen Branches ohne Konfiguration mit `fatal: Need to specify how to reconcile divergent branches.` ab. Für deine eigenen, noch unveröffentlichten Commits ist `git pull --rebase` richtig: Es setzt sie auf den fremden Stand, ohne Merge-Commit.

  **PR auf aktuelles main bringen.** Liegt `main` weit vorn oder gibt es Konflikte, holst du `main` in deinen Branch – per Rebase oder per Merge. GitHub bietet beides als „Update branch“ an.

  | | Rebase auf `main` | `main` in den Branch mergen |
  | --- | --- | --- |
  | History | linear, deine Commits neu erzeugt | Merge-Commit im Branch |
  | Push | braucht Force-Push | normaler Push |
  | Wer mitarbeitet | muss seinen lokalen Branch auf den neuen Stand setzen | holt den Merge mit normalem `git pull` |

  Wird der PR später gesquasht, ist der Merge-Commit im Branch bedeutungslos. Wird er per Merge-Commit oder Rebase übernommen, landet jede Zwischenstufe auf `main` – dann lohnt der Rebase. Die Mechanik steht im Modul [Rebase](/git/rebase).

  **Sicher überschreiben.** Nach einem Rebase passt dein Branch nicht mehr auf den Server-Stand, ein normaler Push wird abgelehnt. `--force` überschreibt blind. [`--force-with-lease`](https://git-scm.com/docs/git-push#Documentation/git-push.txt---force-with-lease) überschreibt nur, wenn der Branch auf dem Server noch genau dort steht, wo dein `origin/feature/checkout` steht – wenn also niemand seit deinem letzten Fetch etwas gepusht hat. Sonst lehnt Git mit `(stale info)` ab.

  ```text
  Server:          A---B---M        feature/checkout   (M = Mias Commit)
  dein origin/…:   A---B            (Stand vom letzten Fetch)
  lokal:           A'--B'           nach dem Rebase

  --force               → Server wird A'--B', M ist weg
  --force-with-lease    → abgelehnt (stale info), weil Server ≠ origin/feature/checkout
  ```

  > [!WARNING] Ein Fetch entschärft die Lease
  > Führst du vor dem Push ein normales `git fetch` aus, steht `origin/feature/checkout` danach auf `M`. Die Lease ist erfüllt, der Push geht durch – und `M` ist trotzdem weg. [`--force-if-includes`](https://git-scm.com/docs/git-push#Documentation/git-push.txt---force-if-includes) (seit Git 2.30) prüft zusätzlich, ob der Stand des Remote-Tracking-Branches jemals in deinen lokalen Branch eingeflossen ist, und lehnt sonst ab. Mit `push.useForceIfIncludes=true` gilt das für jeden Force-Push mit Lease.

  > [!INTERVIEW] „Wann ist ein Force-Push in Ordnung?“
  > Auf dem eigenen Feature-Branch nach einem Rebase oder Aufräumen – und dann mit `--force-with-lease`, idealerweise mit `--force-if-includes`. Niemals auf `main` oder Release-Branches; dort verbietet es üblicherweise die Branch Protection. Arbeiten andere auf demselben Branch mit, sage ich vorher Bescheid oder merge statt zu rebasen.

  **Auf Reviews reagieren.** Während das Review läuft, ist ein Force-Push lästig: Die Ansicht „Changes since last review“ verliert ihren Bezug. Besser: Anmerkungen als **Fixup-Commits** pushen, die sich auf den betroffenen Commit beziehen. Der Reviewer sieht genau die Nachbesserung. Kurz vor dem Merge arbeitest du sie ein:

  ```bash
  git commit --fixup=3f9e2a1          # Anmerkung zu Commit 3f9e2a1 umsetzen
  git push                            # normaler Push, Reviewer sieht nur den Fix
  # vor dem Merge:
  git fetch origin
  git rebase --autosquash origin/main # seit Git 2.44 auch ohne -i
  git push --force-with-lease
  ```

  Wie `fixup!`-Commits entstehen und verschmolzen werden, erklärt das Modul [History aufräumen mit interaktivem Rebase](/git/interactive-rebase).

  ## Merge-Methoden auf GitHub

  GitHub bietet drei Knöpfe, und jeder erzeugt eine andere History ([GitHub Docs · Pull request merges](https://docs.github.com/en/pull-requests/reference/pull-request-merges)):

  ```text
  Ausgangslage:       A---B---C  main
                           \
                            D---E  feature/login

  Create a merge commit:  A---B---C-------M  main   M hat die Eltern C und E
                               \         /
                                D-------E

  Squash and merge:       A---B---C---S  main       S enthält D+E, ein Elternteil

  Rebase and merge:       A---B---C---D'--E'  main  neue Commits, neue Hashes
  ```

  - **Merge-Commit** (GitHub nutzt `--no-ff`): Alle Commits bleiben erhalten, der Merge-Commit markiert die PR-Grenze. `git log --first-parent main` zeigt dann eine Zeile pro PR.
  - **Squash and merge:** Ein neuer Commit mit dem Gesamtinhalt. `main` bleibt knapp, Zwischenstände verschwinden. Aus Git-Sicht ist `feature/login` danach **nicht** gemergt – kein Commit des Branches ist von `main` aus erreichbar. Deshalb verweigert `git branch -d` das Löschen, sobald der Remote-Branch weg ist, und wer auf dem Branch weiterarbeitet und erneut einen PR öffnet, schleppt die alten Commits mit und bekommt Konflikte.
  - **Rebase and merge:** Die Commits werden einzeln auf `main` gesetzt. GitHub erzeugt dabei immer neue Hashes und aktualisiert die Committer-Angaben, auch wenn der Branch schon aktuell war.

  Squash passt, wenn ein PR eine logische Änderung ist und die Commits nach „fix typo“ aussehen. Merge-Commits oder Rebase passen, wenn die Commits bewusst geschnitten sind und einzeln wertvoll bleiben – etwa für `git bisect` oder `git revert` einzelner Schritte.

  ## Branching-Modelle

  Ein Branching-Modell legt fest, welche langlebigen Branches es gibt und wie Änderungen fließen.

  - **Trunk-based Development:** Alle integrieren mindestens täglich in `main`, Branches leben Stunden bis wenige Tage, Unfertiges steckt hinter Feature-Flags. Voraussetzung ist eine schnelle, verlässliche CI.
  - **GitHub Flow:** `main` ist jederzeit auslieferbar; Branch, PR, Review, Merge, Deploy ([GitHub Docs · GitHub flow](https://docs.github.com/en/get-started/using-github/github-flow)). Für die meisten Web-Apps und Dienste der Standard.
  - **Git Flow:** zusätzlich ein `develop`-Branch, `release/*`- und `hotfix/*`-Branches. Gedacht für Software mit festen, parallel gepflegten Versionen. Sein Autor empfiehlt für kontinuierlich ausgelieferte Software inzwischen selbst ein schlankeres Modell ([Note of reflection](https://nvie.com/posts/a-successful-git-branching-model/)).
  - **Release-Branches** gibt es auch ohne Git Flow: Wer Version 2.4 noch pflegt, während `main` auf 3.0 zugeht, zweigt `release/2.4` ab und übernimmt Hotfixes per Cherry-pick ([Cherry-pick und Revert](/git/cherry-pick-revert)).

  ```text
  A---B---C---D---H---F  main          H = Hotfix, zuerst auf main
       \
        R---H'  release/2.4            H' = git cherry-pick -x H
  ```

  ## Regeln durchsetzen: Branch Protection, CODEOWNERS, Merge Queue

  Absprachen reichen nicht; der Server erzwingt sie. [Branch Protection](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches) und das neuere [Rulesets](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/about-rulesets) legen für `main` typischerweise fest: Änderungen nur per PR, mindestens eine Freigabe, Freigaben verfallen bei neuen Commits, Pflicht-Checks müssen grün sein, keine Force-Pushes, kein Löschen, optional lineare History (dann bleiben nur Squash und Rebase). Mehrere Rulesets können gleichzeitig gelten (dann greift jeweils die strengste Regel), lassen sich vorübergehend deaktivieren, und aktive Rulesets sind für alle mit Lesezugriff sichtbar.

  Bei Pflicht-Checks gibt es zwei Stufen: *strict* verlangt, dass der Branch vor dem Merge auf dem neuesten Stand von `main` ist, *loose* nicht. Loose spart CI-Läufe, riskiert aber, dass zwei einzeln grüne PRs zusammen `main` brechen.

  **CODEOWNERS** ordnet Pfaden Verantwortliche zu. Sie werden automatisch als Reviewer angefragt; mit der Regel „Require review from Code Owners“ wird ihre Freigabe Pflicht. Die Datei liegt in `.github/`, im Wurzelverzeichnis oder in `docs/`, und bei mehreren passenden Zeilen gewinnt die **letzte** ([GitHub Docs · About code owners](https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners)).

  ```text title=.github/CODEOWNERS
  *                  @acme/web
  /src/payment/      @acme/payment
  /.github/          @acme/platform
  ```

  **Merge Queue.** In vielbeschäftigten Repositorys ist *strict* lästig: Jeder Merge macht alle anderen PRs veraltet. Eine [Merge Queue](https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/managing-a-merge-queue) nimmt freigegebene PRs in eine Warteschlange, baut temporäre Branches aus aktuellem `main` plus den PRs davor und mergt nur, was in dieser Kombination grün ist. Workflows müssen dafür auf das Ereignis `merge_group` reagieren – mehr dazu in [CI/CD rund um Git](/git/ci-cd).

  **Kleine und gestapelte PRs.** Kleine PRs bekommen gründlichere Reviews und machen weniger Konflikte. Baut Teil B auf Teil A auf, öffnest du PR B mit `feature/api` als Base-Branch. Wird A gemergt und `feature/api` danach gelöscht, stellt GitHub die Basis von PR B automatisch auf `main` um ([GitHub Docs · Managing branches](https://docs.github.com/en/pull-requests/how-tos/commit-changes/managing-branches-within-your-repository)). Wurde A gesquasht, enthält B aber noch die alten Commits von A. `git rebase --onto origin/main feature/api feature/ui` verpflanzt nur die Commits von B – vorausgesetzt, dein lokales `feature/api` steht noch auf dem alten Stand von A. GitHub bietet gestapelte PRs inzwischen auch als eigene Funktion an (derzeit Public Preview), die solche Rebases selbst übernimmt ([About stacked pull requests](https://docs.github.com/en/pull-requests/get-started/about-stacked-prs)).

  ## Häufige Fehler

  - **`--force` statt `--force-with-lease`** auf einem geteilten Branch. Symptom: Die Commits der Kollegin fehlen nach deinem Push. Rettung: Sie hat sie noch lokal oder im Reflog; ab jetzt `--force-with-lease`.
  - **`git fetch` direkt vor `--force-with-lease`** und dann trotzdem überschrieben. Nach dem Fetch erst `git log HEAD..origin/<branch>` ansehen oder `--force-if-includes` nutzen.
  - **`git pull` ohne Plan** auf einem Branch mit eigenen Commits: entweder Abbruch („Need to specify how to reconcile divergent branches“) oder ein unnötiger Merge-Commit. Entscheide dich bewusst: `pull.rebase=true` oder `pull.ff=only`.
  - **Weiterarbeiten auf einem gesquashten Branch.** Der nächste PR zeigt alte Commits und Konflikte. Neuer Branch vom aktuellen `main`.
  - **`git branch -D` aus Gewohnheit.** Nach einem Squash-Merge ist `-D` nötig, aber prüfe vorher, dass nichts fehlt. Direkt nach dem Merge ist `git diff main feature/login` leer, sofern der Branch auf aktuellem `main` lag; zeigt der Diff etwas, liegen Commits nur auf dem Branch.
  - **Veraltete `origin/*`-Branches** in der Autovervollständigung und in `git branch -r`. `fetch --prune` oder `fetch.prune=true`.
  - **Fork nicht synchronisiert:** `git fetch origin` statt `git fetch upstream`, der PR basiert auf einem Wochen alten Stand.
  - **Riesige PRs**, die Formatierung, Refactoring und Feature mischen. Trennen – das Review wird schneller und gründlicher.

  ## Zusammenfassung

  - Ein Remote ist ein Name für eine URL; `origin/*` ist der Stand vom letzten Kontakt. Im Fork-Workflow pushst du nach `origin` (Fork) und holst von `upstream` (Original).
  - `git push -u` setzt den Upstream, `git push origin --delete` löscht Remote-Branches, `git fetch --prune` entfernt verwaiste Remote-Tracking-Branches.
  - Ein Pull Request ist eine Plattform-Funktion: head branch in base branch, mit Review und Checks; GitHub legt dafür `refs/pull/<n>/head` und `refs/pull/<n>/merge` an.
  - `fetch first` und `non-fast-forward` bedeuten: erst fremde Commits holen und integrieren, eigene Commits mit `pull --rebase` obenauf setzen.
  - `--force-with-lease` schützt nur, solange du nicht blind gefetcht hast; `--force-if-includes` schließt diese Lücke.
  - Review-Anmerkungen als Fixup-Commits pushen, vor dem Merge mit `rebase --autosquash` einarbeiten.
  - Merge-Commit behält alles, Squash macht einen neuen Commit (der Branch gilt danach als nicht gemergt), Rebase erzeugt neue Hashes.
  - Branch Protection bzw. Rulesets, CODEOWNERS, Pflicht-Checks und Merge Queue setzen die Regeln des Teams auf dem Server durch.
exercises:
  - id: merge-methoden-folgen
    type: choice
    title: Was bleibt nach dem Squash?
    prompt: |
      Dein PR #42 (`feature/login`, fünf Commits) wurde auf GitHub mit **Squash and merge** übernommen. Welche Aussagen stimmen?
    options:
      - text: "`main` hat genau einen neuen Commit mit dem Gesamtinhalt der fünf Commits; sein einziger Elternteil ist die bisherige Spitze von `main`."
        correct: true
        why: Squash erzeugt einen neuen gewöhnlichen Commit, keinen Merge-Commit mit zwei Eltern.
      - text: "Nach `git fetch --prune` verweigert `git branch -d feature/login` das Löschen, obwohl der Inhalt auf `main` ist."
        correct: true
        why: "`-d` prüft Erreichbarkeit, nicht Inhalt. Keiner der fünf Commits ist von `main` aus erreichbar, also gilt der Branch als nicht gemergt."
      - text: "`git log main` zeigt die fünf ursprünglichen Commits mit ihren alten Hashes."
        correct: false
        why: Die fünf Commits existieren nur noch auf deinem Branch. `main` kennt nur den neuen Squash-Commit.
      - text: Arbeitest du auf `feature/login` weiter und öffnest einen neuen PR, zeigt er nur die neuen Commits.
        correct: false
        why: Der neue PR enthält auch die fünf alten Commits, weil sie nicht in `main` sind. Das führt zu doppelten Änderungen und Konflikten. Neuer Branch vom aktuellen `main`.
      - text: Mit **Rebase and merge** hätten die Commits auf `main` ihre ursprünglichen Hashes behalten.
        correct: false
        why: GitHub erzeugt bei „Rebase and merge“ immer neue Commits mit aktualisierten Committer-Angaben – selbst wenn der Branch schon auf aktuellem `main` lag.
    explanation: |
      Die Merge-Methode entscheidet, welche Commits auf `main` landen. Beim Squash ist es ein neuer Commit, dessen Inhalt dem Branch entspricht, der aber mit dem Branch nicht verwandt ist. Git beurteilt „gemergt“ über den Commit-Graphen, nicht über Inhalte – deshalb braucht es nach einem Squash-Merge `git branch -D`, idealerweise nach einer Kontrolle mit `git diff main feature/login`.
    resources:
      - title: GitHub Docs · Pull request merges
        url: https://docs.github.com/en/pull-requests/reference/pull-request-merges
      - title: git-branch – Referenz
        url: https://git-scm.com/docs/git-branch

  - id: pr-lebenszyklus
    type: order
    title: Vom Branch bis zum Aufräumen
    prompt: Bring die Schritte eines Pull Requests in eine sinnvolle Reihenfolge.
    lang: text
    lines: |
      Branch feature/login vom aktuellen origin/main abzweigen
      Änderungen in kleinen, in sich geschlossenen Commits festhalten
      Branch mit git push -u origin feature/login veröffentlichen
      Draft-PR mit Beschreibung öffnen (Was, Warum, Wie getestet)
      PR als „Ready for review“ markieren, CI und Reviewer prüfen
      Review-Anmerkungen als Fixup-Commits pushen
      Auf aktuelles main rebasen, Fixups mit --autosquash einarbeiten, mit --force-with-lease pushen
      PR mergen, Remote-Branch löschen, lokal fetch --prune und Branch löschen
    explanation: |
      Ein Draft vor dem Review holt früh CI-Ergebnisse und Feedback, ohne CODEOWNERS vorzeitig anzufragen. Während des Reviews bleiben Fixup-Commits normale Pushes, damit Reviewer die Nachbesserung einzeln sehen. Erst kurz vor dem Merge wird die History umgeschrieben – dann ist der Force-Push unkritisch. Aufräumen gehört dazu, sonst sammeln sich lokale Branches und veraltete `origin/*`-Einträge.
    resources:
      - title: GitHub Docs · GitHub flow
        url: https://docs.github.com/en/get-started/using-github/github-flow

  - id: prune-vorhersagen
    type: output
    title: Der Branch ist doch gelöscht
    prompt: Was gibt das Skript aus? (Das Löschen im Bare-Repository `server.git` entspricht dem Knopf „Delete branch“ auf GitHub.)
    lang: bash
    code: |
      git init -q --bare server.git
      git clone -q server.git lea 2>/dev/null
      cd lea
      git commit -q --allow-empty -m "Start"
      git push -q -u origin main
      git switch -qc feature/login
      git commit -q --allow-empty -m "Login-Formular"
      git push -q -u origin feature/login
      git -C ../server.git branch -q -D feature/login
      git fetch -q
      git branch -r --list 'origin/feature/*' --format='%(refname:short)'
      git fetch -q --prune
      git branch -r --list 'origin/feature/*' --format='%(refname:short)'
      git branch --format='%(refname:short) %(upstream:track)'
    expected: |
      origin/feature/login
      feature/login [gone]
      main
    verify: true
    explanation: |
      Ein normales `git fetch` holt neue Commits und Branches, entfernt aber keine Remote-Tracking-Branches – `origin/feature/login` bleibt als Leiche stehen. Erst `--prune` löscht ihn; die zweite Liste ist deshalb leer und erzeugt keine Zeile. Der lokale Branch `feature/login` bleibt unangetastet, sein Upstream ist jetzt `[gone]`. `main` ist auf dem Stand seines Upstreams, `%(upstream:track)` ist dann leer.
    resources:
      - title: git-fetch – Pruning
        url: https://git-scm.com/docs/git-fetch#_pruning

  - id: squash-vorhersagen
    type: output
    title: Gemergt oder nicht?
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      printf 'def login():\n    pass\n' > api.py
      git add api.py && git commit -qm "Start"
      git switch -qc feature/login
      printf '    # Passwort prüfen\n' >> api.py && git commit -qam "Login prüfen"
      printf '    # Tests\n' >> api.py && git commit -qam "Tests ergänzen"
      git switch -q main
      git merge -q --squash feature/login >/dev/null
      git commit -qm "Login-Feature (#42)"
      git log --format=%s
      git branch --merged main --format='%(refname:short)'
      git diff --quiet main feature/login && echo "kein Unterschied"
    expected: |
      Login-Feature (#42)
      Start
      main
      kein Unterschied
    verify: true
    explanation: |
      `merge --squash` überträgt nur den Inhalt in Index und Arbeitsverzeichnis; der anschließende Commit hat einen Elternteil (`Start`). Die beiden Feature-Commits tauchen in `git log` auf `main` nicht auf. `--merged main` listet nur Branches, deren Spitze von `main` aus erreichbar ist – `feature/login` gehört nicht dazu. Der Inhalt ist trotzdem identisch, `git diff --quiet` endet mit 0. Genau das passiert bei „Squash and merge“ auf GitHub.
    resources:
      - title: git-merge – --squash
        url: https://git-scm.com/docs/git-merge
      - title: GitHub Docs · Squash and merge
        url: https://docs.github.com/en/pull-requests/reference/pull-request-merges

  - id: upstream-remote
    type: command
    title: Das Original eintragen
    prompt: Du hast `acme/shop` auf GitHub geforkt und deinen Fork geklont. Trage das Original unter dem üblichen Namen als zweites Remote ein.
    context: |
      Du bist im Klon deines Forks. `git remote -v` zeigt nur `origin` (`git@github.com:lea/shop.git`). Das Original liegt unter `https://github.com/acme/shop.git`.
    answers:
      - git remote add upstream https://github.com/acme/shop.git
    explanation: |
      `git remote add <name> <url>` legt ein weiteres Remote an; nach dem nächsten `git fetch upstream` gibt es `upstream/main`. Der Name `upstream` ist Konvention, aber so verbreitet, dass Anleitungen, Skripte und GitHubs eigene Doku ihn voraussetzen. Wichtig ist die Rollenverteilung: Gepusht wird in den Fork (`origin`), geholt wird vom Original (`upstream`).
    resources:
      - title: git-remote – Referenz
        url: https://git-scm.com/docs/git-remote
      - title: GitHub Docs · Syncing a fork
        url: https://docs.github.com/en/pull-requests/how-tos/work-with-forks/syncing-a-fork

  - id: remote-branch-loeschen
    type: command
    title: Den Branch auf dem Server entfernen
    prompt: Lösche den Branch `feature/login` auf dem Remote `origin`. Dein lokaler Branch soll bleiben.
    context: Der PR ist gemergt, das Repository löscht Head-Branches aber nicht automatisch.
    answers:
      - git push origin --delete feature/login
      - git push origin -d feature/login
      - git push --delete origin feature/login
      - git push -d origin feature/login
      - git push origin :feature/login
    output: |
      To github.com:acme/shop.git
       - [deleted]         feature/login
    explanation: |
      Branches auf dem Server verändert nur `git push`. `--delete` (kurz `-d`) löscht die genannte Ref. Die alte Schreibweise `git push origin :feature/login` pusht „nichts“ auf den Ziel-Branch, was denselben Effekt hat. Dein eigenes `origin/feature/login` entfernt Git dabei gleich mit; Kolleginnen sehen es bis zu ihrem nächsten `git fetch --prune` weiterhin.
    resources:
      - title: git-push – --delete
        url: https://git-scm.com/docs/git-push#Documentation/git-push.txt---delete

  - id: pr-aktualisieren
    type: gap
    title: Review einarbeiten, PR fertig machen
    prompt: |
      Eine Reviewerin hat Commit `3f9e2a1` kommentiert. Du setzt die Anmerkung um, so dass sie die Nachbesserung einzeln sieht. Kurz vor dem Merge bringst du den Branch auf den aktuellen Stand von `origin/main`, verschmilzt die Nachbesserung mit dem ursprünglichen Commit und aktualisierst den PR, ohne fremde Commits blind zu überschreiben.
    lang: bash
    code: |
      git add src/login.py
      git commit ⟦--fixup=3f9e2a1⟧
      git push
      # kurz vor dem Merge
      git ⟦fetch⟧ origin
      git rebase ⟦--autosquash⟧ origin/main
      git push ⟦--force-with-lease⟧
    gaps:
      - label: Nachbesserung zu 3f9e2a1
        hint: Eine Option von `git commit`, die den neuen Commit als Nachbesserung eines bestimmten älteren Commits kennzeichnet.
        accept: ["--fixup 3f9e2a1"]
      - label: Server-Stand holen
        hint: Aktualisiert die Remote-Tracking-Branches, ohne deinen Branch anzufassen.
      - label: Fixups einarbeiten
        hint: Die Rebase-Option, die gekennzeichnete Nachbesserungen automatisch hinter ihren Ziel-Commit sortiert und mit ihm verschmilzt.
        accept: ["-i --autosquash", "--autosquash -i", "--interactive --autosquash", "--autosquash --interactive"]
      - label: Sicherer Force-Push
        hint: Überschreibt nur, wenn der Server noch den Stand deines Remote-Tracking-Branches hat.
        accept: ["--force-with-lease --force-if-includes", "--force-if-includes --force-with-lease"]
    explanation: |
      `--fixup=3f9e2a1` erzeugt einen Commit `fixup! <Betreff von 3f9e2a1>`. Er wird normal gepusht, die Reviewerin sieht nur die Nachbesserung. Vor dem Merge holt `git fetch` den aktuellen Stand, `git rebase --autosquash origin/main` setzt den Branch auf `main` und verschmilzt jeden `fixup!`-Commit mit seinem Ziel – seit Git 2.44 auch ohne `-i`. Weil der Rebase neue Hashes erzeugt, braucht es einen Force-Push, und `--force-with-lease` bricht ab, falls inzwischen jemand anderes gepusht hat.
    resources:
      - title: git-rebase – --autosquash
        url: https://git-scm.com/docs/git-rebase#Documentation/git-rebase.txt---autosquash
      - title: git-commit – --fixup
        url: https://git-scm.com/docs/git-commit

  - id: lease-nach-fetch
    type: choice
    title: Die Lease nach dem Fetch
    prompt: |
      Du hast `feature/checkout` lokal auf `origin/main` rebased. In der Zwischenzeit hat Mia einen Commit auf `feature/checkout` gepusht, davon weißt du nichts. Du führst `git fetch` aus (holt alle Branches), schaust dir nichts weiter an und pushst mit `git push --force-with-lease`. Welche Aussagen stimmen?
    options:
      - text: "Der Push wird mit `(stale info)` abgelehnt, weil Mia gepusht hat."
        correct: false
        why: Der Fetch hat `origin/feature/checkout` auf Mias Commit gesetzt. Server und Remote-Tracking-Branch stimmen überein, die Lease ist erfüllt.
      - text: Der Push geht durch, und Mias Commit ist danach nicht mehr auf dem Branch.
        correct: true
        why: "`--force-with-lease` vergleicht nur Server-Stand und `origin/feature/checkout`. Ob du den Stand gesehen oder integriert hast, prüft es nicht."
      - text: Git mergt Mias Commit beim Push automatisch in deinen Branch.
        correct: false
        why: "`git push` führt nie einen Merge aus. Es setzt die Ref auf dem Server auf deinen Commit oder lehnt ab."
      - text: "Mit zusätzlichem `--force-if-includes` wäre der Push abgelehnt worden."
        correct: true
        why: "`--force-if-includes` prüft, ob der aktuelle Stand von `origin/feature/checkout` irgendwann in deinen lokalen Branch eingeflossen ist. Mias Commit war das nie, also lehnt Git mit `remote ref updated since checkout` ab."
    explanation: |
      Die Lease ist eine Frage an den Server: „Steht der Branch noch da, wo mein Remote-Tracking-Branch steht?“ Ein Fetch ohne anschließende Kontrolle macht die Antwort immer „ja“. Deshalb gehört nach einem Fetch ein Blick auf `git log HEAD..origin/feature/checkout` dazu, oder du lässt Git das mit `--force-if-includes` (bzw. `push.useForceIfIncludes=true`) prüfen.
    resources:
      - title: git-push – --force-with-lease
        url: https://git-scm.com/docs/git-push#Documentation/git-push.txt---force-with-lease
      - title: git-push – --force-if-includes
        url: https://git-scm.com/docs/git-push#Documentation/git-push.txt---force-if-includes

  - id: fork-sync-bug
    type: bug
    title: Der Fork bleibt alt
    prompt: |
      Mit diesem Skript willst du `main` in deinem Fork `lea/shop` auf den Stand des Originals `acme/shop` bringen. `origin` ist dein Fork, `upstream` das Original. Das Skript läuft fehlerfrei durch und meldet `Already up to date.` und `Everything up-to-date` – aber GitHub zeigt deinen Fork weiterhin als „12 commits behind acme/shop:main“. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: bash
    code: |
      #!/usr/bin/env bash
      # sync-fork.sh – main des Forks auf den Stand von acme/shop bringen
      set -euo pipefail
      git switch main
      git fetch origin
      git merge --ff-only upstream/main
      git push origin main
    lines: [5]
    fix:
      - line: 5
        answers:
          - git fetch upstream
          - git fetch upstream main
          - git fetch --prune upstream
          - git fetch -p upstream
          - git fetch upstream --prune
          - git fetch --all
    explanation: |
      `git fetch origin` holt nur den Stand deines Forks. `upstream/main` bleibt auf dem Stand des letzten `git fetch upstream` stehen – vielleicht von vor Wochen. Der Merge meldet deshalb ehrlich „Already up to date“: Gemessen an diesem alten Remote-Tracking-Branch gibt es nichts zu tun. Mit `git fetch upstream` wird `upstream/main` aktualisiert, der Fast-Forward holt die neuen Commits, und der Push bringt sie in den Fork.
    resources:
      - title: GitHub Docs · Syncing a fork from the command line
        url: https://docs.github.com/en/pull-requests/how-tos/work-with-forks/syncing-a-fork

  - id: stale-info-erklaeren
    type: explain
    title: Warum „stale info“?
    prompt: Erkläre, was in dieser Sitzung passiert ist, warum der Push abgelehnt wurde, was du jetzt **nicht** tun solltest und wie du richtig weitermachst.
    lang: console
    code: |
      $ git fetch origin main
      From github.com:acme/shop
       * branch            main       -> FETCH_HEAD
         61bda78..e162870  main       -> origin/main
      $ git rebase origin/main
      Successfully rebased and updated refs/heads/feature/checkout.
      $ git push --force-with-lease
      To github.com:acme/shop.git
       ! [rejected]        feature/checkout -> feature/checkout (stale info)
      error: failed to push some refs to 'github.com:acme/shop.git'
    points:
      - "`git fetch origin main` hat nur `origin/main` aktualisiert; `origin/feature/checkout` steht noch auf dem Stand vor dem Rebase."
      - Die Lease vergleicht den Branch auf dem Server mit `origin/feature/checkout`. Sie unterscheiden sich, also hat jemand anderes auf den Branch gepusht – Git lehnt ab und überschreibt nichts.
      - "Falsch wäre `git push --force` oder ein blindes `git fetch` mit erneutem `--force-with-lease`: Beides würde die fremden Commits vom Server löschen."
      - "Richtig: `git fetch`, mit `git log feature/checkout..origin/feature/checkout` die fremden Commits ansehen, sie integrieren (z. B. per `cherry-pick` oder Branch auf `origin/feature/checkout` zurücksetzen und erneut rebasen) und dann mit `--force-with-lease` pushen."
    explanation: |
      Der Fetch hat nur `main` geholt, also kennt mein Repository den aktuellen Stand von `feature/checkout` nicht; `origin/feature/checkout` zeigt noch auf den alten Stand. `--force-with-lease` fragt den Server, ob der Branch dort noch auf genau diesem Commit steht. Das tut er nicht – eine Kollegin hat inzwischen gepusht –, deshalb `stale info`. Ich würde jetzt weder `--force` nutzen noch blind fetchen und denselben Push wiederholen, denn beides löscht ihren Commit. Stattdessen fetche ich, schaue mir mit `git log feature/checkout..origin/feature/checkout` an, was dazugekommen ist, übernehme es in meinen rebasten Branch (etwa per `git cherry-pick`) und pushe dann mit `--force-with-lease`. Und ich sage der Kollegin Bescheid, dass der Branch umgeschrieben ist.
    resources:
      - title: git-push – --force-with-lease
        url: https://git-scm.com/docs/git-push#Documentation/git-push.txt---force-with-lease

  - id: labor-push-abgelehnt
    type: practice
    title: "Labor: Der Push wird abgelehnt"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Mia und du arbeitet gemeinsam am PR-Branch `feature/suche`. Dein letzter `git push` wird abgelehnt. Bringe deinen Commit auf den Server, **ohne** Mias Arbeit zu verlieren und **ohne** Merge-Commit. Prüfe am Ende mit `git log --graph --format=%s`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q --bare origin.git
      git clone -q origin.git mia 2>/dev/null
      cd mia
      printf '# Shop\n' > README.md
      git add README.md && git commit -qm "README anlegen"
      git push -q origin main
      git switch -qc feature/suche
      printf 'def suche(q):\n    return []\n' > suche.py
      git add suche.py && git commit -qm "Suche: Grundgerüst"
      git push -q -u origin feature/suche
      cd ..
      git clone -q -b feature/suche origin.git lea
      # Mia legt auf dem gemeinsamen PR-Branch nach …
      printf 'Suche: GET /api/suche?q=…\n' >> mia/README.md
      git -C mia commit -qam "Suche dokumentieren"
      git -C mia push -q
      # … und du auch
      mkdir lea/tests
      printf 'def test_leer():\n    assert suche("") == []\n' > lea/tests/test_suche.py
      git -C lea add tests
      git -C lea commit -qm "Suche: Test für leere Anfrage"
      git -C lea push -q || true
      cd lea
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q --bare origin.git
      git clone -q origin.git mia 2>/dev/null
      cd mia
      printf '# Shop\n' > README.md
      git add README.md && git commit -qm "README anlegen"
      git push -q origin main
      git switch -qc feature/suche
      printf 'def suche(q):\n    return []\n' > suche.py
      git add suche.py && git commit -qm "Suche: Grundgerüst"
      git push -q -u origin feature/suche
      cd ..
      git clone -q -b feature/suche origin.git lea
      # Mia legt auf dem gemeinsamen PR-Branch nach …
      printf 'Suche: GET /api/suche?q=…\n' >> mia/README.md
      git -C mia commit -qam "Suche dokumentieren"
      git -C mia push -q
      # … und du auch
      mkdir lea/tests
      printf 'def test_leer():\n    assert suche("") == []\n' > lea/tests/test_suche.py
      git -C lea add tests
      git -C lea commit -qm "Suche: Test für leere Anfrage"
      git -C lea push -q || true
      cd lea
      # Reparatur
      git pull -q --rebase
      git push -q
      # Kontrolle
      test "$(git rev-parse HEAD)" = "$(git -C ../origin.git rev-parse feature/suche)"
      git log --format=%s | grep -q "Suche dokumentieren"
      git log --format=%s | grep -q "Suche: Test für leere Anfrage"
      test "$(git rev-list --count --merges HEAD)" = 0
    checklist:
      - Du hast die Ablehnung `(fetch first)` gelesen und erkannt, dass der Server einen Commit hat, den du nicht kennst.
      - "`git log --graph --format=%s` zeigt eine gerade Linie: `Suche: Test für leere Anfrage` über `Suche dokumentieren` über `Suche: Grundgerüst`."
      - "`git rev-list --count --merges HEAD` gibt `0` aus."
      - "`git status -sb` zeigt `## feature/suche...origin/feature/suche` ohne ahead/behind."
    verify: true
    explanation: |
      Der Server lehnt jeden Push ab, der Commits vom Branch entfernen würde. `git pull --rebase` holt Mias Commit und setzt deinen darauf; danach ist dein Push ein Fast-Forward. Gleichwertig ist `git fetch` plus `git rebase origin/feature/suche`. Ein Force-Push würde Mias Arbeit löschen, ein normales `git pull` bricht entweder ab oder erzeugt einen überflüssigen Merge-Commit. Weil dein Commit noch nicht veröffentlicht war, ist das Umschreiben hier unproblematisch.
    resources:
      - title: git-pull – --rebase
        url: https://git-scm.com/docs/git-pull

  - id: labor-fork-synchronisieren
    type: practice
    title: "Labor: Der Fork hinkt hinterher"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      `upstream.git` ist das Original-Projekt, `fork.git` dein Fork, `lea` dein Klon des Forks. Du hast einen Tippfehler-Fix vorbereitet, aber dein Fork und dein Branch kennen die neuesten Commits des Originals nicht. Stelle diesen Zustand her:

      - In `lea` gibt es ein Remote namens `upstream`, das auf `../upstream.git` zeigt.
      - `main` im Fork steht auf demselben Commit wie `main` im Original.
      - `fix/readme-typo` basiert auf dem aktuellen `main` des Originals, enthält genau einen eigenen Commit und liegt mit diesem Stand im Fork.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q --bare upstream.git
      git clone -q upstream.git acme 2>/dev/null
      printf 'Wilkommen im Shop\n' > acme/README.md
      git -C acme add README.md
      git -C acme commit -qm "README anlegen"
      git -C acme push -q origin main
      git clone -q --bare upstream.git fork.git
      git clone -q fork.git lea
      # Das Original entwickelt sich weiter …
      printf 'def rabatt(preis):\n    return preis\n' > acme/shop.py
      git -C acme add shop.py
      git -C acme commit -qm "Rabattfunktion anlegen"
      git -C acme push -q origin main
      # … während du einen Fix vorbereitest
      git -C lea switch -qc fix/readme-typo
      printf 'Willkommen im Shop\n' > lea/README.md
      git -C lea commit -qam "README: Tippfehler korrigieren"
      cd lea
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q --bare upstream.git
      git clone -q upstream.git acme 2>/dev/null
      printf 'Wilkommen im Shop\n' > acme/README.md
      git -C acme add README.md
      git -C acme commit -qm "README anlegen"
      git -C acme push -q origin main
      git clone -q --bare upstream.git fork.git
      git clone -q fork.git lea
      # Das Original entwickelt sich weiter …
      printf 'def rabatt(preis):\n    return preis\n' > acme/shop.py
      git -C acme add shop.py
      git -C acme commit -qm "Rabattfunktion anlegen"
      git -C acme push -q origin main
      # … während du einen Fix vorbereitest
      git -C lea switch -qc fix/readme-typo
      printf 'Willkommen im Shop\n' > lea/README.md
      git -C lea commit -qam "README: Tippfehler korrigieren"
      cd lea
      # Reparatur
      git remote add upstream ../upstream.git
      git fetch -q upstream
      git switch -q main
      git merge -q --ff-only upstream/main
      git push -q origin main
      git switch -q fix/readme-typo
      git rebase -q main
      git push -q -u origin fix/readme-typo
      # Kontrolle
      test "$(git -C ../fork.git rev-parse main)" = "$(git -C ../upstream.git rev-parse main)"
      git merge-base --is-ancestor upstream/main fix/readme-typo
      test "$(git rev-list --count upstream/main..fix/readme-typo)" = 1
      test "$(git -C ../fork.git rev-parse fix/readme-typo)" = "$(git rev-parse fix/readme-typo)"
    checklist:
      - "`git remote -v` zeigt `origin` (Fork) und `upstream` (Original)."
      - "`git log --format=%s -1 upstream/main` zeigt `Rabattfunktion anlegen`, und `git -C ../fork.git log --format=%s -1 main` ebenfalls."
      - "`git log --graph --format=%s fix/readme-typo` zeigt deinen Fix direkt über `Rabattfunktion anlegen`."
      - "`git merge-base --is-ancestor upstream/main fix/readme-typo` endet mit Exit-Code 0."
    verify: true
    explanation: |
      Dein Klon kennt zunächst nur den Fork. Erst `git remote add upstream …` und `git fetch upstream` machen die neuen Commits des Originals sichtbar. `merge --ff-only` spult dein `main` vor, ohne je einen Merge-Commit zu erzeugen – scheitert es, hast du versehentlich auf `main` committet. Der Push aktualisiert den Fork. Der Rebase setzt den Fix auf den neuen Stand, damit der PR ohne Konflikte und mit aktueller CI läuft. Da der Branch noch nicht gepusht war, reicht ein normaler Push; sonst wäre `--force-with-lease` nötig.
    resources:
      - title: GitHub Docs · Syncing a fork
        url: https://docs.github.com/en/pull-requests/how-tos/work-with-forks/syncing-a-fork
      - title: Pro Git · Contributing to a Project – Forked Public Project
        url: https://git-scm.com/book/en/v2/Distributed-Git-Contributing-to-a-Project

  - id: labor-force-with-lease
    type: practice
    title: "Labor: Die Lease hält"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Du hast deinen PR-Branch `feature/checkout` auf das aktuelle `main` gesetzt, aber dein `git push --force-with-lease` wird mit `(stale info)` abgelehnt. Stelle den Zustand her, in dem `feature/checkout` auf dem Server auf dem aktuellen `origin/main` aufsetzt und genau zwei eigene Commits enthält: deinen (`Summe berechnen`) **und** den, der dir bisher entgangen ist. `git push --force` ist verboten.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q --bare origin.git
      git clone -q origin.git lea 2>/dev/null
      cd lea
      printf 'def summe(korb):\n    return 0\n' > checkout.py
      git add checkout.py && git commit -qm "Checkout-Grundgerüst"
      git push -q origin main
      git switch -qc feature/checkout
      printf 'def summe(korb):\n    return sum(korb)\n' > checkout.py
      git commit -qam "Summe berechnen"
      git push -q -u origin feature/checkout
      # Mia ergänzt Tests auf deinem PR-Branch
      git clone -q -b feature/checkout ../origin.git ../mia
      printf 'def test_summe():\n    assert summe([2, 3]) == 5\n' > ../mia/test_checkout.py
      git -C ../mia add test_checkout.py
      git -C ../mia commit -qm "Tests für die Summe"
      git -C ../mia push -q
      # main bewegt sich weiter (ein anderer PR wurde gemergt)
      git -C ../mia switch -q main
      printf '# Shop\n' > ../mia/README.md
      git -C ../mia add README.md
      git -C ../mia commit -qm "README anlegen"
      git -C ../mia push -q origin main
      # Du aktualisierst deinen PR
      git fetch -q origin main
      git rebase -q origin/main
      git push -q --force-with-lease || true
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q --bare origin.git
      git clone -q origin.git lea 2>/dev/null
      cd lea
      printf 'def summe(korb):\n    return 0\n' > checkout.py
      git add checkout.py && git commit -qm "Checkout-Grundgerüst"
      git push -q origin main
      git switch -qc feature/checkout
      printf 'def summe(korb):\n    return sum(korb)\n' > checkout.py
      git commit -qam "Summe berechnen"
      git push -q -u origin feature/checkout
      # Mia ergänzt Tests auf deinem PR-Branch
      git clone -q -b feature/checkout ../origin.git ../mia
      printf 'def test_summe():\n    assert summe([2, 3]) == 5\n' > ../mia/test_checkout.py
      git -C ../mia add test_checkout.py
      git -C ../mia commit -qm "Tests für die Summe"
      git -C ../mia push -q
      # main bewegt sich weiter (ein anderer PR wurde gemergt)
      git -C ../mia switch -q main
      printf '# Shop\n' > ../mia/README.md
      git -C ../mia add README.md
      git -C ../mia commit -qm "README anlegen"
      git -C ../mia push -q origin main
      # Du aktualisierst deinen PR
      git fetch -q origin main
      git rebase -q origin/main
      git push -q --force-with-lease || true
      # Reparatur
      git fetch -q origin
      git log --format=%s feature/checkout..origin/feature/checkout
      git cherry-pick origin/feature/checkout
      git push -q --force-with-lease
      # Kontrolle
      git merge-base --is-ancestor origin/main origin/feature/checkout
      git log --format=%s origin/main..origin/feature/checkout | grep -q "Tests für die Summe"
      git log --format=%s origin/main..origin/feature/checkout | grep -q "Summe berechnen"
      test "$(git rev-list --count origin/main..origin/feature/checkout)" = 2
      test "$(git -C ../origin.git rev-parse feature/checkout)" = "$(git rev-parse HEAD)"
    checklist:
      - Du hast nach dem Fetch mit `git log feature/checkout..origin/feature/checkout` nachgesehen, welcher fremde Commit auf dem Server liegt, bevor du irgendetwas überschrieben hast.
      - "`git log --graph --format=%s origin/feature/checkout` zeigt `Tests für die Summe` und `Summe berechnen` direkt über `README anlegen`, ohne Verzweigung."
      - "`git merge-base --is-ancestor origin/main origin/feature/checkout` endet mit Exit-Code 0."
      - Dein letzter Push war `--force-with-lease`, nicht `--force`.
    verify: true
    explanation: |
      `git fetch origin main` hat nur `origin/main` aktualisiert. Deshalb passte `origin/feature/checkout` nicht mehr zum Server, und die Lease hat Mias Commit gerettet. Nach einem vollständigen Fetch zeigt `git log feature/checkout..origin/feature/checkout` genau diesen Commit; `git cherry-pick` übernimmt ihn auf deinen rebasten Branch, und der Force-Push mit Lease geht durch. Gleichwertig: `git reset --hard origin/feature/checkout` und erneut `git rebase origin/main`. Achtung vor `git pull --rebase`: Es kopiert hier den `main`-Commit `README anlegen` ein zweites Mal auf den Branch, weil dein lokaler Branch und der Server-Stand verschiedene Basen haben – die Kontrolle schlägt dann fehl.
    resources:
      - title: git-push – --force-with-lease
        url: https://git-scm.com/docs/git-push#Documentation/git-push.txt---force-with-lease
      - title: git-cherry-pick – Referenz
        url: https://git-scm.com/docs/git-cherry-pick

  - id: labor-aufraeumen-nach-squash
    type: practice
    title: "Labor: Aufräumen nach dem Squash-Merge"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Dein PR `feature/login` wurde auf GitHub per „Squash and merge“ übernommen, der Branch auf dem Server gelöscht. Lokal zeigt `git branch -r` weiterhin `origin/feature/login`, `main` hinkt hinterher, und `feature/login` liegt noch herum. Räume auf: kein veralteter Remote-Tracking-Branch, `main` auf dem Stand des Servers, `feature/login` lokal gelöscht – aber erst, **nachdem** du bewiesen hast, dass sein Inhalt vollständig auf `main` ist.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q --bare origin.git
      git clone -q origin.git lea 2>/dev/null
      cd lea
      printf 'def login():\n    pass\n' > api.py
      git add api.py && git commit -qm "API-Grundgerüst"
      git push -q -u origin main
      git switch -qc feature/login
      printf 'def login(user, pw):\n    return pruefe(user, pw)\n' > api.py
      git commit -qam "Login prüfen"
      printf 'def test_login():\n    assert login("lea", "geheim")\n' > test_api.py
      git add test_api.py && git commit -qm "Login testen"
      git push -q -u origin feature/login
      # Auf GitHub: „Squash and merge“, danach „Delete branch“
      git clone -q ../origin.git ../github
      git -C ../github merge -q --squash origin/feature/login >/dev/null
      git -C ../github commit -qm "Login-Feature (#42)"
      git -C ../github push -q origin main
      git -C ../origin.git branch -q -D feature/login
      # Zurück auf main, Stand holen
      git switch -q main
      git fetch -q
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q --bare origin.git
      git clone -q origin.git lea 2>/dev/null
      cd lea
      printf 'def login():\n    pass\n' > api.py
      git add api.py && git commit -qm "API-Grundgerüst"
      git push -q -u origin main
      git switch -qc feature/login
      printf 'def login(user, pw):\n    return pruefe(user, pw)\n' > api.py
      git commit -qam "Login prüfen"
      printf 'def test_login():\n    assert login("lea", "geheim")\n' > test_api.py
      git add test_api.py && git commit -qm "Login testen"
      git push -q -u origin feature/login
      # Auf GitHub: „Squash and merge“, danach „Delete branch“
      git clone -q ../origin.git ../github
      git -C ../github merge -q --squash origin/feature/login >/dev/null
      git -C ../github commit -qm "Login-Feature (#42)"
      git -C ../github push -q origin main
      git -C ../origin.git branch -q -D feature/login
      # Zurück auf main, Stand holen
      git switch -q main
      git fetch -q
      # Reparatur
      git fetch -q --prune
      git merge -q --ff-only origin/main
      git diff --quiet main feature/login
      git branch -q -D feature/login
      # Kontrolle
      test -z "$(git branch -r --list 'origin/feature/*')"
      test -z "$(git branch --list 'feature/*')"
      test "$(git rev-parse main)" = "$(git rev-parse origin/main)"
      git log --format=%s -1 | grep -q "(#42)"
    checklist:
      - "`git branch -r` listet nur noch `origin/HEAD -> origin/main` und `origin/main`."
      - "`git status -sb` zeigt `## main...origin/main` ohne `behind`."
      - "Du hast gesehen, dass `git branch -d feature/login` mit `not fully merged` abbricht, und verstehst, warum."
      - "Bevor du `git branch -D` genutzt hast, hat `git diff main feature/login` keine Ausgabe geliefert."
    verify: true
    explanation: |
      `git fetch` ohne `--prune` lässt `origin/feature/login` stehen, obwohl der Branch auf dem Server fehlt. `--prune` räumt ihn weg. `main` wird per Fast-Forward auf den Squash-Commit gebracht (`git pull --ff-only` geht genauso). Danach verweigert `git branch -d` das Löschen, weil kein Commit von `feature/login` auf `main` liegt – Git prüft Erreichbarkeit, nicht Inhalt. Der leere `git diff main feature/login` beweist, dass der Inhalt vollständig übernommen wurde; erst dann ist `-D` sicher. Solange `origin/feature/login` noch existierte, hätte `-d` den Branch dagegen mit einer Warnung gelöscht, weil er in seinen Upstream gemergt war.
    resources:
      - title: git-fetch – Pruning
        url: https://git-scm.com/docs/git-fetch#_pruning
      - title: git-branch – Referenz
        url: https://git-scm.com/docs/git-branch
