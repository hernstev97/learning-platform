id: reset-reflog
title: Reset, Reflog und Recovery
level: 3
minutes: 190
summary: Was `git reset` mit HEAD, Index und Arbeitsverzeichnis macht, wie der Reflog jede Bewegung festhält und wie du verlorene Commits, gelöschte Branches, verworfene Stashes und gestagte Inhalte zurückholst – und was endgültig verloren ist.
goals:
  - Du erklärst die drei Bäume HEAD, Index und Arbeitsverzeichnis und sagst vorher, was `reset --soft`, `--mixed` und `--hard` mit jedem davon machen.
  - Du unterscheidest `git reset` mit Pfad von `git restore` und wählst das passende Werkzeug.
  - Du liest Reflogs von HEAD und Branches und adressierst frühere Stände mit `@{n}`, Zeitangaben und `ORIG_HEAD`.
  - Du rettest Commits nach `reset --hard`, gelöschte Branches, misslungene Rebases, verworfene Stashes und nur gestagte Inhalte.
  - Du weißt, wann Reflog-Einträge verfallen, was unwiederbringlich verloren ist und wie du riskante Aktionen vorher absicherst.
