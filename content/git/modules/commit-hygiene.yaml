id: commit-hygiene
title: Gute Commits und Commit-Hygiene
level: 2
minutes: 160
summary: Atomare Commits mit Nachrichten, die das Warum erklären, gezielt mit dem Patch-Modus gebaut und mit --amend nachgebessert – und .gitignore und .gitattributes, die Secrets, Build-Artefakte und Zeilenend-Chaos gar nicht erst ins Repository lassen.
goals:
  - Du erkennst, ob ein Commit atomar ist, und trennst Formatierung, Refactoring und Verhaltensänderung in eigene Commits.
  - Du stellst Commits mit `git add -p` Hunk für Hunk zusammen und prüfst sie mit `git diff --staged` und `git commit -v`.
  - Du schreibst Commit-Nachrichten mit kurzem Betreff im Imperativ, einem Body, der das Warum erklärt, und Trailern wie `Co-authored-by:` und `Refs:`; Conventional Commits kannst du lesen und anwenden.
  - Du korrigierst den letzten, noch nicht gepushten Commit mit `--amend` und legst mit `--fixup` Korrekturen für ältere Commits an.
  - Du schreibst `.gitignore`-Regeln mit Verzeichnissen, Verankerung und Negation, findest mit `git check-ignore -v` die greifende Regel und hörst mit `git rm --cached` auf, eine Datei zu tracken.
  - Du legst Zeilenenden und Binärdateien mit `.gitattributes` fest und weißt, warum Secrets und generierte Dateien nicht ins Repository gehören.
