lesson: |
  Im Review landet ein Pull Request mit einem einzigen Commit: `fix stuff`, 38 geänderte Dateien. Darin stecken eine neue Rabattlogik, die Umformatierung aller Dateien in `src/` und eine `.env` mit dem Datenbankpasswort. Die Reviewerin kann die fachliche Änderung nicht vom Rauschen trennen, ein `git revert` würde alles auf einmal zurücknehmen, und das Passwort muss rotiert werden. Drei Wochen später findet `git bisect` genau diesen Commit als Ursache einer Regression – und hilft damit kaum weiter.

  Commits sind die Einheit, in der Git und dein Team über Änderungen sprechen: Review, `revert`, `cherry-pick`, `bisect` und `blame` arbeiten Commit für Commit. Wie gut diese Werkzeuge helfen, entscheidet sich beim Committen. Dieses Modul zeigt, wie ein guter Commit aussieht, wie du ihn gezielt zusammenstellst, beschreibst und nachbesserst – und wie `.gitignore` und `.gitattributes` verhindern, dass Falsches hineinrutscht.

  ## Was ist ein guter Commit?

  Ein guter Commit ist **atomar**: Er enthält genau eine logische Änderung, vollständig. Daraus folgen drei prüfbare Eigenschaften:

  - **Eine Absicht.** Die Nachricht lässt sich ohne „und“ formulieren. „Add discount codes and reformat cart module“ sind zwei Commits.
  - **Vollständig.** Code, Tests und Doku zur Änderung gehören zusammen. Nach jedem Commit baut das Projekt, und die Tests laufen grün – sonst meldet `git bisect` später Fehler, die nichts mit der gesuchten Regression zu tun haben.
  - **Unabhängig rückgängig zu machen.** `git revert` nimmt genau diese Änderung zurück, ohne Unbeteiligtes mitzureißen.

  In der Praxis heißt das vor allem: **Formatierung, Refactoring und Verhaltensänderung trennen.** Ein Commit, der eine Funktion umbenennt, fasst viele Dateien an, ändert aber kein Verhalten – die Reviewerin kann ihn schnell durchsehen. Der Commit mit der fachlichen Logik bleibt dadurch klein. Eine gute Commit-Folge für ein Rabatt-Feature:

  ```text
  e09b6d3 Show applied discount in order summary
  c4f8a21 Apply discount codes in calculate_total()
  7b2d9e0 Extract price calculation into calculate_total()
  a1c3e5f Format cart module with ruff
  ```

  Das Gegenteil ist ebenso störend: zehn Commits „WIP“, „fix“, „fix again“. Solche Zwischenstände sind beim Arbeiten normal. Vor dem Merge räumst du sie auf – das zeigt [History aufräumen mit interaktivem Rebase](/git/interactive-rebase).

  > [!MERKE]
  > Ein Commit, eine Absicht. Wenn die Nachricht ein „und“ braucht, sind es meistens zwei Commits.

  ## Gezielt stagen: der Patch-Modus

  Der Index ist die Werkbank, auf der du den nächsten Commit zusammenstellst. Hast du zwei Dinge in derselben Datei geändert, wählst du mit [`git add -p`](https://git-scm.com/docs/git-add#Documentation/git-add.txt---patch) Hunk für Hunk aus, was in den Commit kommt. Liegen zwei Änderungen so dicht beieinander, dass Git sie in einen Hunk packt, teilt `s` ihn auf:

  ```console
  $ git add -p
  diff --git a/api.py b/api.py
  index 33d3cf0..b6eb54d 100644
  --- a/api.py
  +++ b/api.py
  @@ -1,7 +1,8 @@
   import logging

   logger = logging.getLogger(__name__)
  +TIMEOUT_SECONDS = 5


   def health():
  -    return "ok"
  +    return {"status": "ok"}
  (1/1) Stage this hunk [y,n,q,a,d,s,e,p,P,?]? s
  Split into 2 hunks.
  @@ -1,6 +1,7 @@
   import logging

   logger = logging.getLogger(__name__)
  +TIMEOUT_SECONDS = 5


   def health():
  (1/2) Stage this hunk [y,n,q,a,d,k,K,j,J,g,/,e,p,P,?]? y
  @@ -4,4 +5,4 @@


   def health():
  -    return "ok"
  +    return {"status": "ok"}
  (2/2) Stage this hunk [y,n,q,a,d,K,J,g,/,e,p,P,?]? n
  $ git status --short
  MM api.py
  ```

  Die wichtigsten Tasten: `y` übernehmen, `n` überspringen, `s` aufteilen, `e` den Hunk im Editor zeilengenau bearbeiten, `q` beenden, `?` Hilfe. `MM` im Status heißt: Ein Teil von `api.py` ist gestaged, ein anderer nicht. Vor dem Commit prüfst du mit `git diff --staged`, was tatsächlich hineingeht. `git commit -v` zeigt denselben Diff zusätzlich unter der Nachricht im Editor – du schreibst die Nachricht, während du die Änderung vor Augen hast.

  Das Gegenstück zum Herausnehmen ist `git restore --staged -p` (bzw. `git reset -p`), und `git restore -p` verwirft Hunks im Arbeitsverzeichnis. Mehr zu den drei Bereichen steht in [Git-Grundlagen](/git/git-einstieg).

  > [!TIP]
  > `git add -p` zeigt nur Dateien, die Git schon kennt. Für eine neue Datei meldest du zuerst mit `git add -N datei.py` die Absicht an; danach erscheint ihr Inhalt als Hunk im Patch-Modus.

  ## Commit-Nachrichten und Metadaten

  Git behandelt die erste Zeile einer Nachricht als **Betreff** – sie steht in `git log --oneline`, in GitHub-Listen und als Betreff von Patch-Mails. Nach einer Leerzeile folgt der **Body** ([git-commit · Discussion](https://git-scm.com/docs/git-commit#_discussion)).

  ```text
  Fix rounding of discounted order totals

  Discounts were applied after rounding each line item, so orders
  with many cheap items could be off by several cents. Round only
  the final total, as the accounting export expects.

  Refs: SHOP-412
  ```

  Die Regeln dahinter:

  - **Betreff kurz**, etwa 50 Zeichen, höchstens 72 – längere werden in vielen Ansichten abgeschnitten. Kein Punkt am Ende.
  - **Imperativ:** „Fix rounding“, nicht „Fixed“ oder „Fixes“. Der Betreff vervollständigt den Satz „Wenn angewendet, wird dieser Commit …“ – so formuliert auch Git selbst („Merge branch …“, „Revert …“).
  - **Body erklärt das Warum** und die Folgen, auf etwa 72 Zeichen umbrochen. Was sich geändert hat, zeigt der Diff. Warum, steht nirgends sonst – in zwei Jahren beantwortet der Body die Frage „Kann das weg?“.
  - **Sprache:** In den meisten Teams Englisch. Entscheidend ist, dass ein Repository einheitlich ist.

  ### Trailer

  Am Ende einer Nachricht stehen oft **Trailer**: Zeilen der Form `Schlüssel: Wert` im letzten Absatz. Gängig sind `Co-authored-by: Name <mail>` (GitHub zeigt dann beide Personen als Autoren), `Refs: SHOP-412` für das Ticket und `Signed-off-by:`, das `git commit -s` einfügt. Mit [`--trailer`](https://git-scm.com/docs/git-commit#Documentation/git-commit.txt---trailertokenvalue) setzt du sie ohne Editor, und `git interpret-trailers --parse` liest sie maschinell aus:

  ```console
  $ git commit -m "Validate session tokens" --trailer "Refs: SHOP-481" --trailer "Co-authored-by: Aylin Kaya <aylin@example.com>"
  $ git log -1 --format=%B | git interpret-trailers --parse
  Refs: SHOP-481
  Co-authored-by: Aylin Kaya <aylin@example.com>
  ```

  ### Conventional Commits

  Viele Teams nutzen die Konvention [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/): `<typ>[(bereich)][!]: <beschreibung>`, etwa `feat(cart): apply discount codes` oder `fix(api): return 404 for unknown orders`. Übliche Typen sind `feat`, `fix`, `docs`, `refactor`, `test`, `build`, `ci` und `chore`. Der Nutzen ist maschinell: Werkzeuge erzeugen daraus Changelogs und die nächste Versionsnummer nach [SemVer](https://semver.org/) – `fix` erhöht die Patch-, `feat` die Minor-Version, ein `!` oder ein Footer `BREAKING CHANGE:` die Major-Version. Das Modul [CI/CD rund um Git](/git/ci-cd) setzt das um. Ein Detail aus der Praxis: Git sucht Trailer nur im letzten Absatz und erkennt sie im Normalfall nur, wenn alle Zeilen dort die Form `Schlüssel: Wert` haben. `BREAKING CHANGE:` enthält ein Leerzeichen und ist für Git kein Trailer, im selben Absatz wie `Refs:` verhindert es, dass Git die übrigen Trailer erkennt. Die Spezifikation erlaubt als Synonym `BREAKING-CHANGE:` – damit funktioniert beides.

  ### Commits signieren

  Name und E-Mail eines Commits kann jeder beliebig setzen. Eine **Signatur** beweist, dass der Commit mit deinem Schlüssel erstellt wurde. Statt GPG kannst du seit Git 2.34 deinen SSH-Schlüssel nutzen:

  ```ini title=~/.gitconfig
  [gpg]
  	format = ssh
  [user]
  	signingKey = ~/.ssh/id_ed25519.pub
  [commit]
  	gpgSign = true
  ```

  Auf GitHub hinterlegst du denselben öffentlichen Schlüssel zusätzlich als „Signing Key“; dann erscheinen deine Commits als „Verified“ ([GitHub · Commit signature verification](https://docs.github.com/en/authentication/managing-commit-signature-verification/about-commit-signature-verification)). Lokal prüft `git log --show-signature` die Signatur, sobald `gpg.ssh.allowedSignersFile` auf eine Liste vertrauenswürdiger Schlüssel zeigt. Manche Organisationen verlangen signierte Commits per Branch-Regel.

  ## Den letzten Commit korrigieren: --amend und --fixup

  Datei vergessen, Tippfehler in der Nachricht: [`git commit --amend`](https://git-scm.com/docs/git-commit#Documentation/git-commit.txt---amend) ersetzt den letzten Commit durch einen neuen, der den aktuellen Index und – je nach Option – die alte oder eine neue Nachricht enthält.

  ```console
  $ git add tests/test_auth.py
  $ git commit --amend --no-edit
  [feature/login 5d1e0a7] Add login endpoint
   Date: Tue Sep 29 15:11:20 2026 +0200
   2 files changed, 2 insertions(+)
   create mode 100644 src/auth.py
   create mode 100644 tests/test_auth.py
  $ git commit --amend -m "Add login endpoint with tests"
  ```

  `--no-edit` übernimmt die bisherige Nachricht, `-m` setzt eine neue, ohne beides öffnet sich der Editor. Wichtig ist das Bild dahinter: Git **ändert** keinen Commit. Es baut einen neuen mit demselben Elternteil und verschiebt den Branch darauf:

  ```text
  vorher:   A---B    feature/login
  nachher:  A---B'   feature/login     (B ist nur noch im Reflog)
  ```

  `B'` hat einen neuen Hash. Hast du `B` schon gepusht, weicht dein Branch jetzt vom Server ab, und der nächste Push wird abgelehnt. Deshalb gilt: `--amend` nur für Commits, die noch niemand sonst hat – oder auf deinem eigenen Feature-Branch mit `git push --force-with-lease`, wie das Modul [Rebase](/git/rebase) zeigt.

  Für einen **älteren** Commit gibt es `git commit --fixup=<commit>`. Das erzeugt einen Commit mit dem Betreff `fixup! <Betreff des Ziels>` – aus `git commit -a --fixup=a41c9d0` wird etwa `fixup! Add session model`. Beim nächsten `git rebase -i --autosquash` wird er automatisch in sein Ziel eingeschmolzen; die Anwendung steht in [History aufräumen mit interaktivem Rebase](/git/interactive-rebase).

  > [!WARNING]
  > `--amend` auf einem Commit, der schon auf `main` gepusht ist, erzeugt eine abweichende History für alle im Team. Veröffentlichte Commits auf geteilten Branches korrigierst du mit einem neuen Commit oder mit `git revert`.

  ## .gitignore in der Tiefe

  `.gitignore` legt fest, welche **untracked** Dateien Git bei `git status` und `git add .` übersehen soll. Auf Dateien, die Git schon trackt, hat es keine Wirkung. Die Musterregeln ([gitignore · Pattern Format](https://git-scm.com/docs/gitignore#_pattern_format)):

  | Muster | Wirkung |
  | --- | --- |
  | `*.log` | Kein Schrägstrich: passt in jedem Verzeichnis, `debug.log` wie `src/debug.log`. |
  | `build/` | Schrägstrich am Ende: nur Verzeichnisse, in jeder Tiefe. |
  | `/build/` | Schrägstrich am Anfang: nur relativ zur `.gitignore`, `src/build/` bleibt unberührt. |
  | `docs/*.pdf` | Schrägstrich in der Mitte: ebenfalls relativ, also nicht `docs/api/x.pdf`. |
  | `**/cache/`, `logs/**` | `**` steht für beliebig viele Verzeichnisebenen. |
  | `!logs/.gitkeep` | Negation: nimmt eine Datei wieder auf, die ein früheres Muster ausschließt. |

  Innerhalb einer Datei gewinnt das **letzte** passende Muster. Eine Einschränkung überrascht fast jeden: Eine Datei lässt sich nicht wieder aufnehmen, wenn ihr übergeordnetes Verzeichnis ausgeschlossen ist – Git schaut in ein ignoriertes Verzeichnis gar nicht erst hinein. Deshalb ignoriert man den **Inhalt** statt des Verzeichnisses:

  ```text title=.gitignore
  # Abhängigkeiten und Build-Ergebnisse
  node_modules/
  /build/
  # Logs ignorieren, das leere Verzeichnis behalten
  *.log
  logs/*
  !logs/.gitkeep
  # Lokale Konfiguration und Secrets – die Vorlage wird versioniert
  .env*
  !.env.example
  ```

  **Wo Regeln stehen.** `.gitignore` wird versioniert und gilt für alle, die das Projekt klonen – dort gehört hinein, was das Projekt erzeugt. `.git/info/exclude` gilt nur in deinem Klon, etwa für eigene Notizdateien. Die globale Datei aus [`core.excludesFile`](https://git-scm.com/docs/git-config#Documentation/git-config.txt-coreexcludesFile) (Standard: `~/.config/git/ignore`) gilt in all deinen Repositorys und ist der richtige Ort für `.DS_Store`, `.idea/` oder `.vscode/` – Dinge deines Rechners, nicht des Projekts.

  **Welche Regel greift?** [`git check-ignore -v`](https://git-scm.com/docs/git-check-ignore) nennt Datei, Zeile und Muster:

  ```console
  $ git check-ignore -v build/app.js logs/app.log debug.log
  .gitignore:3:/build/	build/app.js
  .gitignore:6:logs/*	logs/app.log
  .gitignore:5:*.log	debug.log
  ```

  `logs/app.log` passt auf `*.log` und `logs/*`; angezeigt wird das letzte passende Muster. Für getrackte Dateien gibt `check-ignore` standardmäßig nichts aus – sie unterliegen den Regeln nicht.

  ### Schon getrackt: git rm --cached

  Wurde eine Datei einmal committet, hilft ein nachträglicher Eintrag in `.gitignore` nicht: `git status` meldet weiter jede Änderung. Du musst sie aus dem Index nehmen, ohne sie zu löschen:

  ```console
  $ git rm --cached config.local.yaml
  rm 'config.local.yaml'
  $ git status --short
  D  config.local.yaml
  ?? .gitignore
  $ git commit -m "Stop tracking local config"
  ```

  Der Commit **löscht** die Datei aus dem Repository. Deine Kopie bleibt liegen; bei Kolleginnen entfernt der nächste `git pull` sie aus dem Arbeitsverzeichnis. Für Konfiguration deshalb vorher eine Vorlage wie `config.example.yaml` committen und im Team ankündigen. Frühere Commits enthalten die Datei weiterhin.

  ### Was nie ins Repository gehört

  **Secrets** – Passwörter, API-Keys, private Schlüssel, `.env`-Dateien. Einmal gepusht, gilt ein Secret als kompromittiert: Klone, Forks und Caches haben es bereits. Die Reihenfolge ist dann: sofort rotieren, danach die History bereinigen ([CI/CD rund um Git](/git/ci-cd)). Liegt es nur im letzten, noch nicht gepushten Commit, reichen `git rm --cached` und `--amend`. **Generierte Dateien** – Build-Ausgaben, `node_modules/`, `__pycache__/`, Coverage-Berichte – lassen sich jederzeit neu erzeugen, blähen das Repository auf und verursachen Konflikte. Lockfiles wie `uv.lock`, `package-lock.json` oder `Cargo.lock` sind die Ausnahme: Sie sind zwar generiert, legen aber die exakten Versionen fest und gehören bei Anwendungen ins Repository.

  > [!INTERVIEW] „Du hast gerade ein API-Token committet. Was tust du?“
  > Erst klären, ob der Commit gepusht ist. Wenn nicht: `git rm --cached .env`, `.env` in die `.gitignore`, `git commit --amend` – das Token ist nie auf dem Server angekommen. Wenn doch: Das Token sofort beim Anbieter widerrufen und ein neues erzeugen, denn es ist kompromittiert, egal was ich mit der History mache. Danach die History bereinigen, das Team informieren und mit Secret Scanning und einem Pre-Commit-Hook verhindern, dass es wieder passiert.

  ## .gitattributes: Zeilenenden und Binärdateien

  Windows beendet Zeilen traditionell mit CRLF, Linux und macOS mit LF. Ohne Regel entstehen Diffs, in denen jede Zeile geändert scheint, und Shell-Skripte mit CRLF scheitern mit `/bin/bash^M: bad interpreter`. Die Einstellung `core.autocrlf` gilt nur auf dem jeweiligen Rechner. `.gitattributes` wird versioniert und gilt damit für alle ([gitattributes · End-of-line conversion](https://git-scm.com/docs/gitattributes#_end_of_line_conversion)):

  ```text title=.gitattributes
  # Git erkennt Textdateien selbst und speichert sie mit LF
  * text=auto
  # Skripte immer mit LF auschecken, auch unter Windows
  *.sh text eol=lf
  # Batch-Dateien brauchen CRLF
  *.bat text eol=crlf
  # Kein Diff, kein Merge, keine Konvertierung
  *.png binary
  ```

  `text=auto` speichert erkannte Textdateien im Repository mit LF und checkt sie mit dem Zeilenende der Plattform aus. `eol=lf` bzw. `eol=crlf` erzwingt ein bestimmtes Zeilenende im Arbeitsverzeichnis. `binary` ist eine Abkürzung für `-text -diff -merge`: Git zeigt „Binary files differ“ und versucht nicht, Konflikte zeilenweise zu lösen. Führst du die Datei in ein bestehendes Projekt ein, bringt `git add --renormalize .` den Index auf den neuen Stand – am besten als eigener Commit:

  ```console
  $ git add --renormalize .
  $ git ls-files --eol deploy.sh notes.txt
  i/lf    w/crlf  attr/text eol=lf      	deploy.sh
  i/lf    w/crlf  attr/text=auto        	notes.txt
  ```

  `i/` zeigt das Zeilenende im Index, `w/` im Arbeitsverzeichnis, `attr/` die greifenden Attribute. Beim `git add` einer CRLF-Datei unter `text=auto` warnt Git: `CRLF will be replaced by LF the next time Git touches it`.

  > [!PRAXIS] Was im Review auffällt
  > Reviewer schauen zuerst auf die Commit-Liste: Sind Formatierung und Logik getrennt? Sagt jeder Betreff, was passiert? Ein Diff, in dem jede Zeile einer Datei „geändert“ ist, obwohl nur eine anders ist, deutet auf Zeilenenden oder einen Formatierer hin. Bei jeder neuen Datei fragen sie: Gehört sie ins Repository? Build-Ordner, `.env` oder `.idea/` im Diff bringen sicher einen Kommentar.

  ## Häufige Fehler

  - **`git add .` ohne Blick in `git status`.** So landen `.env`, Logs und Build-Ordner im Commit. Vor jedem Commit `git status` und `git diff --staged`.
  - **Formatierung und Logik in einem Commit.** Der Review wird unlesbar, `blame` zeigt auf den Formatierungs-Commit. Formatierer in einem eigenen Commit laufen lassen.
  - **Betreff „fix“, „changes“, „WIP“.** Sagt nichts. Imperativ, konkret, mit Body für das Warum.
  - **`--amend` nach dem Push auf einen geteilten Branch.** Die History weicht ab. Stattdessen neuer Commit oder `git revert`.
  - **`.gitignore` wirkt nicht.** Die Datei ist schon getrackt – `git rm --cached` und committen. Oder das übergeordnete Verzeichnis ist ausgeschlossen, und die Negation greift nicht; `git check-ignore -v` zeigt es.
  - **`git rm` statt `git rm --cached`.** Die Datei verschwindet auch aus dem Arbeitsverzeichnis.
  - **Secret aus dem letzten Commit entfernt, aber schon gepusht.** Entfernen reicht nicht, das Secret muss rotiert werden.
  - **Keine `.gitattributes`.** Zeilenend-Diffs und kaputte Skripte in gemischten Teams.

  ## Zusammenfassung

  - Ein guter Commit ist atomar: eine Absicht, vollständig, baut und testet grün, einzeln revertierbar. Formatierung, Refactoring und Verhalten trennen.
  - `git add -p` stellt Commits Hunk für Hunk zusammen (`s` teilt, `e` bearbeitet); `git diff --staged` und `git commit -v` zeigen, was hineingeht.
  - Nachricht: kurzer Betreff im Imperativ ohne Punkt, Leerzeile, Body mit dem Warum, Trailer wie `Refs:` und `Co-authored-by:` im letzten Absatz.
  - Conventional Commits (`feat`, `fix`, `!`) machen Changelogs und SemVer-Versionen automatisierbar. SSH-Signaturen belegen, wer committet hat.
  - `--amend` ersetzt den letzten Commit durch einen neuen – nur vor dem Push. `--fixup` markiert Korrekturen für ältere Commits.
  - `.gitignore` wirkt nur auf untracked Dateien; letzte passende Regel gewinnt; Inhalt statt Verzeichnis ignorieren, wenn du etwas wieder aufnehmen willst. `git check-ignore -v` erklärt, `git rm --cached` beendet das Tracking.
  - Projektregeln in `.gitignore`, eigene in `.git/info/exclude`, Rechner-Müll in `core.excludesFile`.
  - `.gitattributes` mit `* text=auto`, `eol=` und `binary` regelt Zeilenenden für alle. Secrets und generierte Dateien gehören nicht ins Repository, Lockfiles schon.
exercises:
  - id: atomarer-schnitt
    type: choice
    title: Wie schneidest du den Nachmittag?
    prompt: |
      Du hast an einem Nachmittag in `shop/` Folgendes geändert:

      - alle Dateien des Projekts mit `ruff format` formatiert,
      - die Funktion `calc()` in `calculate_total()` umbenannt (zwölf Dateien),
      - einen Rundungsfehler in `calculate_total()` behoben,
      - einen Test geschrieben, der den Rundungsfehler abdeckt.

      Welche Commit-Folge ist für Review, `revert` und `bisect` am besten?
    options:
      - text: Ein Commit „Improve cart module“ mit allem – die Änderungen hängen ja zusammen.
        correct: false
        why: Die Reviewerin muss den Rundungsfix zwischen hunderten Formatierungszeilen suchen, und ein `revert` würde auch Formatierung und Umbenennung zurücknehmen.
      - text: "Drei Commits: „Format project with ruff“, „Rename calc() to calculate_total()“, „Fix rounding in calculate_total()“ – der Test steckt im Fix-Commit."
        correct: true
        why: Jeder Commit hat eine Absicht, und nach jedem laufen die Tests grün. Formatierung und Umbenennung ändern kein Verhalten und sind schnell geprüft; der Fix ist klein und bringt seinen Test mit.
      - text: Vier Commits, wobei der Test als eigener Commit **vor** dem Fix kommt, damit man sieht, dass er vorher fehlschlug.
        correct: false
        why: Der Test-Commit hinterlässt eine rote Test-Suite. `git bisect` und CI stolpern später über genau diesen Zwischenstand.
      - text: Ein Commit pro geänderter Datei, damit jeder Commit möglichst klein ist.
        correct: false
        why: Klein ist nicht dasselbe wie atomar. Eine Umbenennung, verteilt auf zwölf Commits, lässt elf davon nicht bauen.
    explanation: |
      Atomar heißt: eine logische Änderung, vollständig. Formatierung und reine Umbenennung ändern kein Verhalten – getrennt sind sie im Review in Sekunden abgehakt, und `git blame` lässt sich so einstellen, dass es Formatierungs-Commits überspringt. Der Fix bleibt klein und enthält seinen Test, sodass jeder Commit für sich baut und grün ist. Genau davon hängt ab, ob `bisect` und `revert` später präzise arbeiten.
    resources:
      - title: git-commit · Discussion
        url: https://git-scm.com/docs/git-commit#_discussion
      - title: gitworkflows · Separate changes
        url: https://git-scm.com/docs/gitworkflows#_separate_changes

  - id: gitignore-vorhersagen
    type: output
    title: Was landet im Index?
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      mkdir -p build src/build logs
      touch build/app.js src/build/helper.py logs/app.log logs/.gitkeep
      touch debug.log .env .env.example
      printf '/build/\n*.log\nlogs/*\n!logs/.gitkeep\n.env*\n!.env.example\n' > .gitignore
      git add .
      git ls-files
    expected: |
      .env.example
      .gitignore
      logs/.gitkeep
      src/build/helper.py
    verify: true
    explanation: |
      `/build/` ist durch den führenden Schrägstrich an die Wurzel gebunden – `src/build/helper.py` bleibt sichtbar. `*.log` hat keinen Schrägstrich und greift überall. `logs/*` ignoriert den **Inhalt** von `logs`, nicht das Verzeichnis; deshalb kann `!logs/.gitkeep` die Datei zurückholen. Mit `logs/` statt `logs/*` ginge das nicht, weil Git ignorierte Verzeichnisse gar nicht betritt. `.env*` schließt `.env` und `.env.example` aus, das spätere `!.env.example` nimmt die Vorlage wieder auf – das letzte passende Muster gewinnt. `git ls-files` listet sortiert, was im Index steht.
    resources:
      - title: gitignore · Pattern Format
        url: https://git-scm.com/docs/gitignore#_pattern_format

  - id: getrackt-trotz-ignore
    type: output
    title: Ignoriert – oder doch nicht?
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      printf 'db: localhost\n' > config.local.yaml
      printf 'print("shop")\n' > app.py
      git add . && git commit -qm "Initial commit"
      printf 'config.local.yaml\n' > .gitignore
      printf 'db: staging\n' > config.local.yaml
      git status --short
      echo "---"
      git rm -q --cached config.local.yaml
      git status --short
      ls
    expected: |2
       M config.local.yaml
      ?? .gitignore
      ---
      D  config.local.yaml
      ?? .gitignore
      app.py
      config.local.yaml
    accept:
      - |
        M config.local.yaml
        ?? .gitignore
        ---
        D  config.local.yaml
        ?? .gitignore
        app.py
        config.local.yaml
    verify: true
    explanation: |
      `.gitignore` wirkt nur auf untracked Dateien. `config.local.yaml` ist committet, also meldet `git status` die Änderung trotz Eintrag (` M`: im Arbeitsverzeichnis geändert, nicht gestaged). `git rm --cached` entfernt die Datei nur aus dem Index: `D ` in der ersten Spalte ist eine gestagte Löschung, die mit dem nächsten Commit wirksam wird. Weil die Datei jetzt untracked **und** ignoriert ist, taucht sie nicht als `??` auf. `ls` zeigt: Im Arbeitsverzeichnis liegt sie weiterhin.
    resources:
      - title: git-rm · --cached
        url: https://git-scm.com/docs/git-rm#Documentation/git-rm.txt---cached
      - title: git-status · Short Format
        url: https://git-scm.com/docs/git-status#_short_format

  - id: amend-und-fixup
    type: output
    title: Wie viele Commits sind es?
    prompt: Was gibt das Skript aus?
    lang: bash
    code: |
      git init -q
      printf 'app\n' > app.py && git add app.py && git commit -qm "Add app"
      printf 'login\n' > auth.py && git add auth.py && git commit -qm "Add login"
      printf 'test\n' > test_auth.py && git add test_auth.py
      git commit -q --amend --no-edit
      printf 'app v2\n' > app.py && git commit -qa --fixup=HEAD~1
      git rev-list --count HEAD
      git log --format=%s
      git show --name-only --format= HEAD~1
    expected: |
      3
      fixup! Add app
      Add login
      Add app
      auth.py
      test_auth.py
    verify: true
    explanation: |
      `--amend` legt keinen weiteren Commit an, sondern ersetzt „Add login“ durch einen neuen Commit, der zusätzlich `test_auth.py` enthält – die Nachricht bleibt dank `--no-edit` gleich. Erst `--fixup` erzeugt einen dritten Commit. Sein Ziel ist `HEAD~1`, also der Elternteil des aktuellen Commits: „Add app“. Deshalb heißt der Betreff `fixup! Add app`. `HEAD~1` zeigt danach auf den ersetzten Login-Commit mit beiden Dateien. Eingeschmolzen wird der Fixup erst durch `git rebase -i --autosquash`.
    resources:
      - title: git-commit · --amend
        url: https://git-scm.com/docs/git-commit#Documentation/git-commit.txt---amend
      - title: git-commit · --fixup
        url: https://git-scm.com/docs/git-commit#Documentation/git-commit.txt---fixupamendrewordcommit

  - id: patch-modus
    type: command
    title: Nur ein Teil der Datei
    prompt: Starte den Patch-Modus für `src/api.py`, um nur einzelne Hunks dieser Datei für den nächsten Commit auszuwählen.
    context: In `src/api.py` stecken zwei unabhängige Änderungen – ein neuer Timeout und eine geänderte Antwort des Health-Endpoints. Nur der Timeout soll in den nächsten Commit.
    answers:
      - git add -p src/api.py
      - git add --patch src/api.py
      - git add -p -- src/api.py
      - git add --patch -- src/api.py
    output: |
      diff --git a/src/api.py b/src/api.py
      index 33d3cf0..b6eb54d 100644
      --- a/src/api.py
      +++ b/src/api.py
      @@ -1,7 +1,8 @@
       import logging

       logger = logging.getLogger(__name__)
      +TIMEOUT_SECONDS = 5


       def health():
      -    return "ok"
      +    return {"status": "ok"}
      (1/1) Stage this hunk [y,n,q,a,d,s,e,p,P,?]?
    explanation: |
      `-p` (lang `--patch`) zeigt jeden Hunk einzeln und fragt, ob er in den Index soll. Hier liegen beide Änderungen in einem Hunk; mit `s` teilst du ihn, übernimmst den Timeout mit `y` und überspringst die Health-Änderung mit `n`. `git status --short` zeigt danach `MM src/api.py`, und `git diff --staged` beweist, dass nur der Timeout im Commit landet.
    resources:
      - title: git-add · --patch
        url: https://git-scm.com/docs/git-add#Documentation/git-add.txt---patch
      - title: Pro Git · Interactive Staging
        url: https://git-scm.com/book/en/v2/Git-Tools-Interactive-Staging

  - id: amend-vergessene-datei
    type: command
    title: Den Test nachreichen
    prompt: Nimm die bereits gestagte Testdatei in den letzten Commit auf, **ohne** die Commit-Nachricht zu ändern und ohne dass sich ein Editor öffnet.
    context: Du hast gerade `git commit -m "Add login endpoint"` ausgeführt und danach `git add tests/test_auth.py`. Der Commit ist noch nicht gepusht.
    answers:
      - git commit --amend --no-edit
      - git commit --no-edit --amend
    output: |
      [feature/login 5d1e0a7] Add login endpoint
       Date: Tue Sep 29 15:11:20 2026 +0200
       2 files changed, 2 insertions(+)
       create mode 100644 src/auth.py
       create mode 100644 tests/test_auth.py
    explanation: |
      `--amend` baut aus dem aktuellen Index einen neuen Commit, der den letzten ersetzt; `--no-edit` übernimmt dessen Nachricht. Der Commit bekommt einen neuen Hash. Weil er noch nicht gepusht ist, merkt davon niemand etwas. Ein zweiter Commit „Add missing test“ wäre ebenfalls korrekt, hinterlässt aber einen Zwischenstand ohne Test.
    resources:
      - title: git-commit · --amend
        url: https://git-scm.com/docs/git-commit#Documentation/git-commit.txt---amend

  - id: check-ignore-v
    type: command
    title: Wer ignoriert build/app.js?
    prompt: Finde heraus, welche Ignore-Datei in welcher Zeile mit welchem Muster dafür sorgt, dass `build/app.js` ignoriert wird.
    context: "`git status` zeigt `build/app.js` nicht an. Im Projekt gibt es eine `.gitignore`, außerdem vielleicht Regeln in `.git/info/exclude` oder in deiner globalen Ignore-Datei."
    answers:
      - git check-ignore -v build/app.js
      - git check-ignore --verbose build/app.js
      - git check-ignore -v -- build/app.js
    output: |
      .gitignore:3:/build/	build/app.js
    explanation: |
      `check-ignore` beantwortet „Wird diese Datei ignoriert?“, `-v` ergänzt Quelle, Zeilennummer und Muster. Das ist besonders nützlich, wenn eine Regel aus `.git/info/exclude` oder der globalen `core.excludesFile` stammt, die niemand im Projekt sieht. Für getrackte Dateien gibt der Befehl standardmäßig nichts aus – sie unterliegen den Ignore-Regeln nicht.
    resources:
      - title: git-check-ignore – Referenz
        url: https://git-scm.com/docs/git-check-ignore

  - id: gitignore-schreiben
    type: gap
    title: Eine .gitignore für die Shop-App
    prompt: |
      Ergänze die `.gitignore` im Wurzelverzeichnis:

      1. `node_modules` soll als Verzeichnis in jeder Tiefe ignoriert werden.
      2. `build` nur im Wurzelverzeichnis – `src/build/` enthält Quellcode.
      3. Im Verzeichnis `logs` soll alles ignoriert werden außer `logs/.gitkeep`.
      4. `.env`-Dateien ignorieren, die Vorlage `.env.example` aber versionieren.
    lang: text
    code: |
      # 1. Abhängigkeiten
      ⟦node_modules/⟧
      # 2. Build-Ergebnis nur an der Wurzel
      ⟦/build/⟧
      # 3. Logs ohne das Verzeichnis selbst
      ⟦logs/*⟧
      !logs/.gitkeep
      # 4. Umgebungsdateien und ihre Vorlage
      .env*
      ⟦!.env.example⟧
    gaps:
      - label: Abhängigkeiten
        hint: Ein Schrägstrich am **Ende** heißt „nur Verzeichnisse“.
        accept: ["node_modules", "**/node_modules/", "**/node_modules"]
      - label: Build an der Wurzel
        hint: Ein Schrägstrich am **Anfang** verankert das Muster an der `.gitignore`.
        accept: ["/build"]
      - label: Inhalt von logs
        hint: Ignorierst du das Verzeichnis selbst, kann die Negation darunter nicht mehr greifen.
        accept: ["/logs/*", "logs/**", "/logs/**"]
      - label: Vorlage zurückholen
        hint: Negation mit Ausrufezeichen, nach dem Muster, das die Datei ausschließt.
        accept: ["!/.env.example"]
    explanation: |
      `node_modules/` ohne führenden Schrägstrich passt in jeder Tiefe. `/build/` ist an die Wurzel gebunden, `src/build/` bleibt sichtbar. `logs/*` ignoriert den Inhalt, nicht das Verzeichnis – nur so kann `!logs/.gitkeep` die Datei zurückholen, weil Git in ausgeschlossene Verzeichnisse nicht hineinschaut. `!.env.example` muss **nach** `.env*` stehen, denn das letzte passende Muster gewinnt.
    resources:
      - title: gitignore · Pattern Format
        url: https://git-scm.com/docs/gitignore#_pattern_format

  - id: gitattributes-schreiben
    type: gap
    title: Zeilenenden für ein gemischtes Team
    prompt: |
      Das Team arbeitet unter Windows, macOS und Linux. Ergänze die `.gitattributes`:

      1. Git soll Textdateien selbst erkennen und im Repository mit LF speichern.
      2. Shell-Skripte müssen auch unter Windows mit LF ausgecheckt werden.
      3. PNG-Dateien sollen weder zeilenweise gedifft noch gemergt oder konvertiert werden.
    lang: text
    code: |
      # 1. Automatische Erkennung für alle Dateien
      * ⟦text=auto⟧
      # 2. Skripte immer mit LF
      *.sh text ⟦eol=lf⟧
      # Batch-Dateien brauchen CRLF
      *.bat text eol=crlf
      # 3. Bilder
      *.png ⟦binary⟧
    gaps:
      - label: Automatische Erkennung
        hint: Das Attribut `text` mit dem Wert, der Git selbst entscheiden lässt.
      - label: Zeilenende erzwingen
        hint: Das Attribut heißt wie die Abkürzung für „end of line“.
      - label: Binärdatei
        hint: Ein Makro-Attribut, das `-text -diff -merge` zusammenfasst.
        accept: ["-text -diff -merge", "-diff -merge -text", "-text -merge -diff"]
    explanation: |
      `* text=auto` lässt Git erkennen, was Text ist; im Repository steht dann LF, ausgecheckt wird mit dem Zeilenende der Plattform. `eol=lf` überschreibt das für Skripte, die sonst unter Windows mit CRLF im Arbeitsverzeichnis landen und in Containern oder WSL mit `bad interpreter` scheitern. `binary` steht für `-text -diff -merge`: keine Konvertierung, kein zeilenweiser Diff, kein Merge-Versuch. Weil die Datei versioniert ist, gilt das für alle – anders als `core.autocrlf`, das jeder selbst setzt.
    resources:
      - title: gitattributes · End-of-line conversion
        url: https://git-scm.com/docs/gitattributes#_end_of_line_conversion
      - title: Pro Git · Git Attributes
        url: https://git-scm.com/book/en/v2/Customizing-Git-Git-Attributes

  - id: env-geloescht
    type: bug
    title: Der Commit ist sauber, die App startet nicht
    prompt: |
      Mit diesen Befehlen wolltest du `.env` aus deinem letzten, noch nicht gepushten Commit entfernen. Der Commit enthält die Datei danach tatsächlich nicht mehr. Aber beim nächsten Start bricht die App mit `KeyError: 'DB_URL'` ab – `.env` ist aus deinem Projektordner verschwunden. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: bash
    code: |
      # .env aus dem letzten Commit entfernen und künftig ignorieren
      printf '.env\n' >> .gitignore
      git rm .env
      git add .gitignore
      git commit --amend --no-edit
    lines: [3]
    fix:
      - line: 3
        answers:
          - git rm --cached .env
          - git rm --cached -- .env
          - git rm -q --cached .env
          - git rm --cached -q .env
    explanation: |
      `git rm` entfernt eine Datei aus dem Index **und** aus dem Arbeitsverzeichnis. Gewollt war nur der Index: `git rm --cached .env` merkt die Löschung für den Commit vor und lässt deine lokale Datei liegen. Jetzt hilft `git restore --source=HEAD@{1} .env` oder `git show 'HEAD@{1}:.env' > .env`, denn der ersetzte Commit steht noch im Reflog. Wäre der Commit schon gepusht gewesen, müssten die Zugangsdaten zusätzlich rotiert werden.
    resources:
      - title: git-rm · --cached
        url: https://git-scm.com/docs/git-rm#Documentation/git-rm.txt---cached

  - id: nachricht-reviewen
    type: explain
    title: Eine Commit-Nachricht im Review
    prompt: Du reviewst diesen Commit. Erkläre Teil für Teil, was die Nachricht leistet, warum sie so aufgebaut ist und welche Werkzeuge welchen Teil auswerten.
    lang: text
    code: |
      feat(auth)!: require email verification before first login

      Accounts created through the public sign-up form could log in
      immediately, so bots registered thousands of fake accounts in
      September. New accounts now stay inactive until the link in the
      verification email is opened.

      A migration marks all existing accounts as verified, so current
      customers are not locked out.

      BREAKING-CHANGE: POST /api/login returns 403 for unverified accounts.
      Refs: SHOP-512
      Co-authored-by: Aylin Kaya <aylin@example.com>
    points:
      - "Betreff nach Conventional Commits: Typ `feat`, Bereich `auth`, `!` markiert eine inkompatible Änderung; kurz, im Imperativ, ohne Punkt."
      - Der Body erklärt das Warum (Bots, Fake-Accounts) und das neue Verhalten – nicht den Code, den zeigt der Diff.
      - Der zweite Absatz nennt die Folgen für Bestandskunden (Migration) – genau die Frage, die ein Reviewer sonst stellen müsste.
      - "`BREAKING-CHANGE:` beschreibt, was für API-Nutzer bricht; Release-Werkzeuge erhöhen daraus die Major-Version und schreiben es ins Changelog. Mit Bindestrich bleibt der letzte Absatz für Git ein gültiger Trailer-Block."
      - "Trailer: `Refs:` verknüpft das Ticket, `Co-authored-by:` nennt die Mitautorin, die GitHub als Autorin anzeigt."
    explanation: |
      Der Betreff folgt Conventional Commits: `feat` ist ein neues Feature, `(auth)` der betroffene Bereich, und das `!` warnt, dass sich etwas inkompatibel ändert. Er ist kurz und im Imperativ formuliert. Der Body beantwortet, was der Diff nicht zeigen kann: Warum gibt es die Änderung – Bots haben Fake-Accounts angelegt – und was ist jetzt anders. Der zweite Absatz nimmt die wichtigste Review-Frage vorweg, nämlich was mit bestehenden Konten passiert. Der letzte Absatz besteht nur aus Trailern: `BREAKING-CHANGE` liest das Release-Werkzeug und macht daraus einen Major-Release mit Changelog-Eintrag; die Schreibweise mit Bindestrich sorgt dafür, dass auch `git interpret-trailers` den Block erkennt. `Refs` verknüpft das Ticket, `Co-authored-by` nennt Aylin als Mitautorin – GitHub zeigt dann beide an.
    resources:
      - title: Conventional Commits 1.0.0
        url: https://www.conventionalcommits.org/en/v1.0.0/
      - title: git-interpret-trailers – Referenz
        url: https://git-scm.com/docs/git-interpret-trailers
      - title: GitHub · Commit mit mehreren Autoren
        url: https://docs.github.com/en/pull-requests/committing-changes-to-your-project/creating-and-editing-commits/creating-a-commit-with-multiple-authors

  - id: labor-env-im-commit
    type: practice
    title: "Labor: Die .env ist mitgerutscht"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Beim Commit „Add payment module“ wurde mit `git add .` mehr eingepackt als geplant. Der Commit ist noch nicht gepusht.

      Sorge dafür, dass keine Datei `.env` mehr in der History des Branches vorkommt, die lokale `.env` aber erhalten bleibt und künftig ignoriert wird. Es sollen weiterhin genau zwei Commits sein, der zweite mit unverändertem Betreff. Prüfe am Ende mit `git show --name-only --format=%s HEAD` und `git status --short`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q shop && cd shop
      printf 'import os\nDB_URL = os.environ["DB_URL"]\n' > settings.py
      git add settings.py && git commit -qm "Add settings module"
      # Neues Feature – mit git add . landet mehr im Commit als gedacht
      printf 'def pay(order):\n    return gateway.charge(order)\n' > payment.py
      printf 'PAYMENT_API_KEY=labor-dummy-4711\nDB_URL=postgres://shop:geheim@db/shop\n' > .env
      git add . && git commit -qm "Add payment module"
      git show --name-only --format=%s HEAD
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q shop && cd shop
      printf 'import os\nDB_URL = os.environ["DB_URL"]\n' > settings.py
      git add settings.py && git commit -qm "Add settings module"
      # Neues Feature – mit git add . landet mehr im Commit als gedacht
      printf 'def pay(order):\n    return gateway.charge(order)\n' > payment.py
      printf 'PAYMENT_API_KEY=labor-dummy-4711\nDB_URL=postgres://shop:geheim@db/shop\n' > .env
      git add . && git commit -qm "Add payment module"
      git show --name-only --format=%s HEAD
      # Reparatur: nur aus dem Index nehmen, ignorieren, letzten Commit ersetzen
      git rm -q --cached .env
      printf '.env\n' >> .gitignore
      git add .gitignore
      git commit -q --amend --no-edit
      # Kontrolle
      test "$(git rev-list --count HEAD)" = 2
      test "$(git log -1 --format=%s)" = "Add payment module"
      test -z "$(git log --all --format=%h -- .env)"
      git cat-file -e HEAD:payment.py
      git cat-file -e HEAD:.gitignore
      test -f .env
      git check-ignore -q .env
      test -z "$(git status --porcelain)"
    checklist:
      - "`git show --name-only --format=%s HEAD` zeigt „Add payment module“ mit `.gitignore` und `payment.py`, aber ohne `.env`."
      - "`git log --all --format=%h -- .env` gibt nichts aus."
      - "`git rev-list --count HEAD` ist `2` – du hast den Commit ersetzt, keinen neuen „Remove .env“-Commit angehängt."
      - Die Datei `.env` liegt noch im Arbeitsverzeichnis, und `git check-ignore -v .env` nennt die Regel aus `.gitignore`.
      - "`git status --short` ist leer."
    verify: true
    explanation: |
      Ein zusätzlicher Commit „Remove .env“ würde die Datei nur aus dem neuesten Stand entfernen – im Commit davor stünde sie weiter, und mit dem Push wäre das Secret veröffentlicht. `git rm --cached` nimmt `.env` aus dem Index, lässt sie aber auf der Platte. Zusammen mit der neuen `.gitignore` ersetzt `--amend` den fehlerhaften Commit durch einen sauberen. Der alte Commit existiert noch als Objekt im Reflog, bis `git gc` ihn entfernt – lokal ist das unkritisch, weil er nie gepusht wurde. Wäre er gepusht gewesen, müssten Schlüssel und Passwort zuerst rotiert werden.
    resources:
      - title: git-rm · --cached
        url: https://git-scm.com/docs/git-rm#Documentation/git-rm.txt---cached
      - title: GitHub · About secret scanning
        url: https://docs.github.com/en/code-security/secret-scanning/introduction/about-secret-scanning

  - id: labor-ignore-wirkt-nicht
    type: practice
    title: "Labor: Die .gitignore wirkt nicht"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Das Team hat `logs/` in die `.gitignore` eingetragen und committet. Trotzdem zeigt `git status` nach jedem Start der App eine Änderung in `logs/app.log`.

      Finde die Ursache und sorge dafür, dass Log-Dateien nicht mehr getrackt werden, `logs/app.log` lokal aber erhalten bleibt. Committe die Korrektur. Prüfe am Ende, dass `git status --short` auch nach einer weiteren Log-Zeile leer bleibt.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q shop && cd shop
      printf 'print("shop")\n' > app.py
      mkdir logs && printf 'started\n' > logs/app.log
      git add . && git commit -qm "Initial commit"
      printf 'logs/\n' > .gitignore
      git add .gitignore && git commit -qm "Ignore log files"
      # Die App läuft und schreibt weiter ins Log
      printf 'GET /health 200\n' >> logs/app.log
      git status --short
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q shop && cd shop
      printf 'print("shop")\n' > app.py
      mkdir logs && printf 'started\n' > logs/app.log
      git add . && git commit -qm "Initial commit"
      printf 'logs/\n' > .gitignore
      git add .gitignore && git commit -qm "Ignore log files"
      # Die App läuft und schreibt weiter ins Log
      printf 'GET /health 200\n' >> logs/app.log
      git status --short
      # Diagnose: getrackte Dateien fallen nicht unter die Ignore-Regeln
      git ls-files logs
      git check-ignore -v logs/app.log || echo "check-ignore: keine Ausgabe"
      # Reparatur: aus dem Index nehmen, Datei behalten, committen
      git rm -r -q --cached logs
      git commit -qm "Stop tracking log files"
      # Kontrolle
      test -z "$(git ls-files logs)"
      test -f logs/app.log
      printf 'GET /orders 200\n' >> logs/app.log
      test -z "$(git status --porcelain)"
      git check-ignore -q logs/app.log
      test "$(git rev-list --count HEAD)" = 3
    checklist:
      - "`git ls-files logs` zeigt vor der Reparatur `logs/app.log`, danach nichts mehr."
      - "`logs/app.log` existiert noch im Arbeitsverzeichnis."
      - Nach einer weiteren Zeile im Log ist `git status --short` leer.
      - "`git check-ignore -v logs/app.log` nennt jetzt die Regel `.gitignore:1:logs/`."
      - Es gibt einen neuen Commit, der die Datei aus dem Repository entfernt.
    verify: true
    explanation: |
      Ignore-Regeln gelten nur für untracked Dateien. `logs/app.log` war schon im ersten Commit, deshalb meldet Git jede Änderung – und `git check-ignore` schweigt, weil getrackte Dateien den Regeln nicht unterliegen. `git rm -r --cached logs` nimmt das Verzeichnis aus dem Index, ohne es zu löschen; der Commit macht das dauerhaft. Ab jetzt ist die Datei untracked und fällt unter `logs/`. Beachte: Bei Kolleginnen löscht der nächste `git pull` ihre `logs/app.log` – bei Logs egal, bei lokaler Konfiguration vorher ankündigen.
    resources:
      - title: gitignore · Notes
        url: https://git-scm.com/docs/gitignore#_notes
      - title: git-check-ignore – Referenz
        url: https://git-scm.com/docs/git-check-ignore

  - id: labor-commit-aufteilen
    type: practice
    title: "Labor: Ein Commit, zwei Themen"
    prompt: |
      Führe das Labor-Skript in einem leeren Verzeichnis aus (`cd "$(mktemp -d)"`) – **nie** in einem echten Repository.

      Der letzte, noch nicht gepushte Commit „Add discount and fix typo“ mischt ein Feature in `cart.py` mit einem Tippfehler-Fix in `README.md`.

      Teile ihn in zwei Commits auf – zuerst `Add discount to cart total` (nur `cart.py`), danach `Fix typo in README` (nur `README.md`). Die Inhalte der Dateien sollen am Ende genau so sein wie vorher. Prüfe mit `git log --format=%s` und `git show --name-only --format=%s HEAD~1`.
    lang: bash
    starter: |
      # Labor: erzeugt den kaputten Zustand
      git init -q shop && cd shop
      printf 'def total(items):\n    return sum(i.price for i in items)\n' > cart.py
      printf '# Shop\n\nInstal with pip.\n' > README.md
      git add . && git commit -qm "Add cart"
      # Ein Commit, der zwei unabhängige Dinge mischt
      printf 'def total(items, discount=0):\n    return sum(i.price for i in items) - discount\n' > cart.py
      printf '# Shop\n\nInstall with pip.\n' > README.md
      git commit -qam "Add discount and fix typo"
      # Deine Reparatur:
    solution: |
      # Labor: erzeugt den kaputten Zustand
      git init -q shop && cd shop
      printf 'def total(items):\n    return sum(i.price for i in items)\n' > cart.py
      printf '# Shop\n\nInstal with pip.\n' > README.md
      git add . && git commit -qm "Add cart"
      # Ein Commit, der zwei unabhängige Dinge mischt
      printf 'def total(items, discount=0):\n    return sum(i.price for i in items) - discount\n' > cart.py
      printf '# Shop\n\nInstall with pip.\n' > README.md
      git commit -qam "Add discount and fix typo"
      # Reparatur: Commit auflösen, Änderungen bleiben im Arbeitsverzeichnis
      git reset -q HEAD~
      git add cart.py
      git commit -qm "Add discount to cart total"
      git add README.md
      git commit -qm "Fix typo in README"
      # Kontrolle
      test "$(git rev-list --count HEAD)" = 3
      test "$(git log -1 --format=%s HEAD~1)" = "Add discount to cart total"
      test "$(git show --name-only --format= HEAD~1)" = cart.py
      test "$(git log -1 --format=%s HEAD)" = "Fix typo in README"
      test "$(git show --name-only --format= HEAD)" = README.md
      test -z "$(git status --porcelain)"
      grep -q 'discount=0' cart.py
    checklist:
      - "`git log --format=%s` zeigt „Fix typo in README“, „Add discount to cart total“, „Add cart“."
      - "`git show --name-only --format= HEAD~1` listet nur `cart.py`, `git show --name-only --format= HEAD` nur `README.md`."
      - "`git status --short` ist leer, und `cart.py` enthält weiterhin `discount=0`."
      - Du kannst erklären, warum `git reset HEAD~` (ohne `--hard`) keine Änderung verliert.
    verify: true
    explanation: |
      `git reset HEAD~` setzt den Branch einen Commit zurück und leert den Index auf diesen Stand (Modus `--mixed`), lässt das Arbeitsverzeichnis aber unangetastet. Die Änderungen sind also noch da, nur nicht mehr committet – und du stellst die beiden Commits neu zusammen. Stecken beide Themen in **derselben** Datei, nimmst du statt `git add cart.py` den Patch-Modus `git add -p cart.py`. `--hard` hätte die Änderungen verworfen. Die Reset-Modi im Detail erklärt [Reset, Reflog und Recovery](/git/reset-reflog); innerhalb eines längeren Branches teilst du Commits mit `edit` im [interaktiven Rebase](/git/interactive-rebase).
    resources:
      - title: git-reset – Referenz
        url: https://git-scm.com/docs/git-reset
      - title: Pro Git · Rewriting History
        url: https://git-scm.com/book/en/v2/Git-Tools-Rewriting-History
