terms:
  - term: Annotierter Tag
    definition: Tag, der als eigenes Objekt mit Tagger, Datum und Nachricht gespeichert wird und signiert werden kann (`git tag -a v2.4.0 -m "…"`). Für Releases üblich; `git describe` berücksichtigt standardmäßig nur annotierte Tags.
  - term: Arbeitsverzeichnis
    definition: Die ausgecheckten Dateien, die du im Editor bearbeitest (Working Tree). Änderungen hier kennt Git erst, wenn du sie mit `git add` in den Index übernimmst.
  - term: Bare Repository
    definition: Repository ohne Arbeitsverzeichnis, nur mit dem Inhalt von `.git` (`git init --bare`). Server-Repositorys sind bare, weil dort niemand Dateien bearbeitet; lokal eignen sie sich, um ein Remote zu simulieren.
  - term: Bisect
    definition: Binäre Suche nach dem Commit, der einen Fehler eingeführt hat (`git bisect`). Mit `git bisect run` testet ein Skript jeden Kandidaten automatisch; Exit-Code 0 heißt gut, 1–127 außer 125 schlecht, 125 überspringen.
  - term: Blame
    definition: Zeigt für jede Zeile einer Datei den Commit, der sie zuletzt geändert hat (`git blame`). Mit `-w`, `-M`, `-C` und `--ignore-rev` blendet es Leerraumänderungen, Verschiebungen und Formatierungs-Commits aus.
  - term: Blob
    definition: Objekt, das den Inhalt einer Datei speichert – ohne Namen und Rechte. Gleicher Inhalt ergibt denselben Blob, egal unter welchem Pfad.
  - term: Branch
    definition: Beweglicher Name für einen Commit, gespeichert als Ref unter `refs/heads/`. Ein neuer Commit auf dem ausgecheckten Branch schiebt den Namen auf diesen Commit weiter.
  - term: Branch Protection
    definition: Serverseitige Regeln für einen Branch auf Plattformen wie GitHub, etwa Merge nur per Pull Request, Pflicht-Reviews, Pflicht-Checks, kein Force-Push. Neuere Variante auf GitHub sind Rulesets. Anders als Hooks lassen sie sich nicht lokal umgehen.
  - term: Cherry-pick
    definition: Wendet die Änderung eines bestehenden Commits als neuen Commit auf den aktuellen Branch an (`git cherry-pick`). Typisch für Backports auf Release-Branches; `-x` vermerkt den Ursprungs-Commit in der Nachricht.
  - term: CODEOWNERS
    definition: Datei, die Pfaden verantwortliche Personen oder Teams zuordnet. GitHub fordert deren Review automatisch an und kann es per Schutzregel zur Pflicht machen.
  - term: Commit
    definition: Objekt mit einem Verweis auf genau einen Wurzel-Tree, null oder mehr Eltern-Commits, Autor, Committer und Nachricht. Ändert sich eines davon, entsteht ein neuer Commit mit neuem Hash.
  - term: Commit-Graph
    definition: Die Commits eines Repositorys als gerichteter azyklischer Graph (DAG), in dem jeder Commit auf seine Eltern zeigt. Branches, Merges und Revisionsausdrücke wie `HEAD~2` oder `A..B` beschreiben Wege in diesem Graphen.
  - term: Conventional Commits
    definition: Konvention für Commit-Nachrichten mit Typ-Präfix wie `feat:`, `fix:` oder `feat!:` und optionalem `BREAKING CHANGE:`-Footer. Werkzeuge leiten daraus Changelog und nächste SemVer-Version ab.
  - term: Dangling Object
    definition: Objekt, das von keiner Ref und keinem anderen Objekt erreichbar ist, etwa ein gestagter, aber nie committeter Blob oder ein gedroppter Stash. `git fsck` findet solche Objekte, `git gc` entfernt sie nach einer Karenzzeit.
  - term: Detached HEAD
    definition: Zustand, in dem `HEAD` direkt auf einen Commit statt auf einen Branch zeigt, etwa nach `git switch --detach v2.4.0`, während eines Rebase oder bei Bisect. Neue Commits hängen an keinem Branch und sind nach dem Wegwechseln nur über den Reflog auffindbar.
  - term: Drei-Wege-Merge
    definition: Zusammenführung zweier auseinandergelaufener Branches anhand ihrer Merge-Base und beider Spitzen. Was nur eine Seite geändert hat, wird übernommen; widersprechen sich beide Seiten an derselben Stelle, entsteht ein Konflikt.
  - term: Fast-Forward
    definition: Merge, bei dem der aktuelle Branch Vorfahre des anderen ist und Git den Zeiger nur vorrückt, ohne einen Merge-Commit zu erzeugen. `--no-ff` erzwingt dennoch einen Merge-Commit, `--ff-only` erlaubt nur diesen Fall.
  - term: Fixup-Commit
    definition: Korrektur-Commit, dessen Nachricht mit `fixup!` und dem Betreff des Ziel-Commits beginnt (`git commit --fixup=<commit>`). `git rebase -i --autosquash` verschmilzt ihn automatisch mit dem Ziel.
  - term: Force-with-lease
    definition: Sichere Variante des Force-Push (`git push --force-with-lease`). Sie überschreibt den Remote-Branch nur, wenn er noch auf dem Stand steht, den der lokale Remote-Tracking-Branch kennt, und schützt so fremde Commits vor versehentlichem Überschreiben.
  - term: Fork
    definition: Serverseitige Kopie eines fremden Repositorys unter eigenem Konto. Im Fork-Workflow heißt der eigene Fork meist `origin`, das Original `upstream`; Änderungen gehen per Pull Request zurück.
  - term: Garbage Collection
    definition: Aufräumen des Objektspeichers mit `git gc`, das Git auch automatisch anstößt. Packt lose Objekte in Packfiles, lässt abgelaufene Reflog-Einträge verfallen und entfernt unerreichbare Objekte nach einer Karenzzeit (standardmäßig zwei Wochen).
  - term: HEAD
    definition: |
      Symbolische Ref, die angibt, was gerade ausgecheckt ist – normalerweise ein Branch (`ref: refs/heads/main`), im Detached-HEAD-Zustand ein Commit. `HEAD~1`, `HEAD^2` und `HEAD@{1}` sind Revisionsausdrücke relativ dazu.
  - term: Hook
    definition: Skript in `.git/hooks` (oder im Verzeichnis aus `core.hooksPath`), das Git an bestimmten Punkten ausführt, etwa `pre-commit`, `commit-msg` oder `pre-push`. Ein Exit-Code ungleich 0 bricht die Aktion ab; Hooks werden nicht mitgeklont und lassen sich mit `--no-verify` umgehen.
  - term: Index
    definition: Die Staging Area – der vorbereitete Stand des nächsten Commits, gespeichert in `.git/index`. `git add` schreibt hinein, `git commit` macht daraus einen Tree. Während eines Konflikts hält der Index bis zu drei Stufen pro Datei (Basis, ours, theirs).
  - term: Interaktives Rebase
    definition: Rebase mit bearbeitbarer Todo-Liste (`git rebase -i`), in der jeder Commit per `pick`, `reword`, `edit`, `squash`, `fixup`, `drop` oder `exec` behandelt wird. Werkzeug zum Aufräumen eigener, noch nicht geteilter Commits.
  - term: Konfliktmarker
    definition: Die Zeilen `<<<<<<<`, `=======` und `>>>>>>>` (bei `diff3`/`zdiff3` zusätzlich `|||||||` mit der Basis), die Git bei einem Konflikt in die Datei schreibt. Sie müssen vor dem Commit vollständig entfernt sein.
  - term: Merge-Base
    definition: Der beste gemeinsame Vorfahre zweier Commits (`git merge-base main feature`). Ausgangspunkt für den Drei-Wege-Merge und für `git diff main...feature`.
  - term: Merge-Commit
    definition: Commit mit zwei oder mehr Eltern, der zwei Entwicklungslinien verbindet. Der erste Elternteil ist der Branch, auf dem gemergt wurde; `git log --first-parent` folgt nur diesem.
  - term: Merge Queue
    definition: Warteschlange auf der Git-Plattform, die jeden zum Merge freigegebenen Pull Request zusammen mit den vor ihm eingereihten gegen den aktuellen Stand von `main` testet. Verhindert, dass zwei einzeln grüne PRs zusammen `main` brechen.
  - term: ORIG_HEAD
    definition: Ref, die Befehle wie `reset`, `merge` und `rebase` auf den vorherigen Stand von `HEAD` setzen. Direkt nach einer misslungenen Aktion macht `git reset --hard ORIG_HEAD` sie rückgängig.
  - term: Ours und theirs
    definition: Die beiden Seiten eines Konflikts. Beim Merge ist „ours“ der aktuelle Branch und „theirs“ der hineingemergte; beim Rebase ist „ours“ die neue Basis und „theirs“ der eigene Commit, der gerade übertragen wird.
  - term: Packfile
    definition: Datei unter `.git/objects/pack/`, die viele Objekte komprimiert und teilweise als Deltas zu ähnlichen Objekten speichert, begleitet von einer `.idx`-Indexdatei. Entsteht bei `git gc` und bei der Übertragung über das Netz.
  - term: Partial Clone
    definition: Klon, der bestimmte Objekte zunächst weglässt, etwa alle Blobs mit `git clone --filter=blob:none`. Git lädt fehlende Objekte bei Bedarf nach; die History der Commits ist vollständig.
  - term: Pickaxe
    definition: Suche nach Commits, die die Anzahl der Vorkommen eines Strings ändern (`git log -S "MAX_RETRIES"`) bzw. deren Diff auf einen regulären Ausdruck passt (`git log -G`). Findet, wann Code eingeführt oder entfernt wurde.
  - term: Plumbing und Porcelain
    definition: Plumbing sind die Low-Level-Befehle mit stabiler Ausgabe für Skripte (`cat-file`, `hash-object`, `update-ref`, `rev-parse`), Porcelain die Befehle für Menschen (`commit`, `switch`, `log`). In Skripten Plumbing oder stabile Formate wie `--porcelain` verwenden.
  - term: Pull Request
    definition: Anfrage auf einer Plattform wie GitHub, einen Branch in einen anderen zu übernehmen, verbunden mit Diff, Review, Diskussion und CI-Checks. Bei GitLab heißt das Merge Request.
  - term: Rebase
    definition: Überträgt die Commits eines Branches auf eine neue Basis, indem sie als neue Commits nacheinander angewendet werden (`git rebase main`). Ergibt eine lineare History, erzeugt aber neue Hashes und darf geteilte Commits nicht umschreiben.
  - term: Ref
    definition: Name, der auf ein Objekt zeigt, gespeichert als Datei unter `.git/refs/` oder als Zeile in `.git/packed-refs`. Branches (`refs/heads/`), Tags (`refs/tags/`) und Remote-Tracking-Branches (`refs/remotes/`) sind Refs.
  - term: Reflog
    definition: Lokales Protokoll, wohin `HEAD` und jeder Branch in der Vergangenheit gezeigt haben (`git reflog`, `main@{2}`). Wichtigstes Werkzeug für Recovery; erreichbare Einträge verfallen standardmäßig nach 90, unerreichbare nach 30 Tagen.
  - term: Remote
    definition: Benanntes anderes Repository mit URL, meist `origin` (`git remote -v`). `fetch`, `pull` und `push` tauschen Commits mit ihm aus.
  - term: Remote-Tracking-Branch
    definition: Lokale, schreibgeschützte Kopie eines Branches auf einem Remote, etwa `origin/main`. Wird nur bei `fetch`, `pull` und `push` aktualisiert und zeigt den zuletzt bekannten Stand des Servers.
  - term: rerere
    definition: „Reuse recorded resolution“ (`rerere.enabled=true`). Git merkt sich Konfliktauflösungen und wendet sie automatisch an, wenn derselbe Konflikt erneut auftritt, etwa bei wiederholtem Rebase.
  - term: Revert
    definition: Neuer Commit, der die Änderungen eines früheren Commits umkehrt (`git revert`). Macht Fehler auf geteilten Branches rückgängig, ohne History umzuschreiben; bei Merge-Commits wählt `-m 1` die Seite, die erhalten bleibt.
  - term: SemVer
    definition: Semantic Versioning, Versionsnummern der Form MAJOR.MINOR.PATCH. MAJOR steigt bei inkompatiblen Änderungen, MINOR bei neuen kompatiblen Funktionen, PATCH bei Fehlerbehebungen.
  - term: Shallow Clone
    definition: Klon mit abgeschnittener History, etwa `git clone --depth 1`. Spart Zeit in CI, aber `git describe`, Diffs gegen ältere Basen und Bisect funktionieren erst nach `git fetch --unshallow` bzw. mit ausreichender Tiefe.
  - term: Sparse Checkout
    definition: Checkout nur eines Teils der Dateien ins Arbeitsverzeichnis (`git sparse-checkout set src/api docs`). Nützlich in großen Monorepos; Commits und History bleiben vollständig.
  - term: Squash
    definition: Zusammenfassen mehrerer Commits zu einem – im interaktiven Rebase per `squash`/`fixup`, beim Merge per `git merge --squash` oder als Merge-Methode „Squash and merge“ auf GitHub. Der Squash-Merge verbindet den Branch nicht mit dem Ziel; Git sieht ihn danach als nicht gemergt.
  - term: Stash
    definition: Zwischenspeicher für uncommittete Änderungen (`git stash push`), intern ein Commit des Arbeitsstands, dessen Eltern der Ausgangs-Commit und ein Commit des Index sind, mit `-u` zusätzlich ein dritter Elternteil für untracked Dateien. Die Liste liegt unter `refs/stash` und ist allen Worktrees gemeinsam.
  - term: Symbolische Ref
    definition: Ref, die nicht auf ein Objekt, sondern auf eine andere Ref zeigt. `HEAD` ist das wichtigste Beispiel (`git symbolic-ref HEAD` gibt `refs/heads/main` aus).
  - term: Tree
    definition: Objekt, das ein Verzeichnis beschreibt – eine Liste von Einträgen mit Modus, Name und dem Hash eines Blobs oder Unter-Trees. Jeder Commit zeigt auf genau einen Wurzel-Tree.
  - term: Trunk-based Development
    definition: Branching-Modell, bei dem alle kleine, kurzlebige Branches häufig in einen Hauptzweig (`main`) integrieren und unfertige Funktionen hinter Feature-Flags liegen. Hält Konflikte klein und passt zu kontinuierlicher Auslieferung.
  - term: Upstream
    definition: Der Remote-Tracking-Branch, mit dem ein lokaler Branch verknüpft ist (`git push -u`, `@{u}`). Bestimmt Standardziel für `pull` und `push` und die Ahead/Behind-Anzeige in `git status`. Im Fork-Workflow heißt außerdem das Original-Repository oft `upstream`.
  - term: Worktree
    definition: Zusätzliches Arbeitsverzeichnis desselben Repositorys (`git worktree add ../hotfix -b hotfix/login main`) mit eigenem `HEAD` und Index, aber gemeinsamen Objekten und Refs. Ein Branch kann nur in einem Worktree gleichzeitig ausgecheckt sein.
