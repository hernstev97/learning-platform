id: sound
title: Sounddesign & interaktive Musik
short: Sound
tagline: Eigene Klänge und Musik, die im Spiel Information tragen.
description: >
  Kritisch hören, Klänge als Cue-Liste planen, mit dem Handy aufnehmen, in REAPER schneiden,
  säubern, schichten und variieren, ein eigenes Stück für mehrere Spielzustände aufbereiten und
  alles in Godot 4.7 mischen und abhören. Der Kurs setzt deine Erfahrung aus der Musikproduktion
  voraus und zeigt, was Spiele anders verlangen. Jeder Klang, jedes Stück und jede Mischentscheidung
  liegt bei dir; eine KI darf nur Technik beschleunigen. „Unterwegs“ geht am Handy mit Kopfhörern,
  verlinkte Clips brauchen Netz. „Am PC“ braucht REAPER und Godot; lesen kannst du diese Lektionen
  auch unterwegs.
color: "#A8B8FF"
order: 16
outcomes:
  - Du hörst Spiele **kritisch**, benennst, welche Information ein Klang trägt, und begründest, was im Mix Vorrang hat.
  - Du planst Klänge als **Cue-Liste und Zustandsdiagramm** aus Animation, Aktion und Spielzustand.
  - Du **nimmst auf, schneidest, säuberst, schichtest und variierst** kurze Geräusche in REAPER und stimmst die Varianten auf eine selbst gewählte Aktion ab.
  - Du formst **Hüllkurve, Frequenz, Dynamik und Raum** so, dass ein Klang im richtigen Frame, mit seinem Gewicht und an seinem Ort ankommt.
  - Du bereitest ein **eigenes Stück für mehrere Zustände** auf – Loops, Stems, Übergänge – und testest die Übergänge mit `AudioStreamInteractive` im Spiel.
  - Du **mischst** Musik, Geräusche und Stille nach Priorität, stimmst die **Lautheit** ab und prüfst alles im Spiel.
  - Du **dokumentierst Quellen, Lizenzen und Entscheidungen**, sodass jede Datei im Projekt nachvollziehbar bleibt.
tracks:
  - title: Hören und planen
    description: Was Klänge im Spiel leisten, wie aus Ereignissen eine Cue-Liste wird, Aufnahmen mit dem Handy und fremdes Material mit sauberer Herkunft.
    modules: [hoeren-analysieren, klangplan, feldaufnahme, quellen-lizenzen]
  - title: Geräusche bauen
    description: Hüllkurve, Frequenz, Dynamik und Raum für kurze Spielgeräusche, dann am PC in REAPER schneiden, säubern, schichten, variieren und eigenes Material umbauen.
    modules: [klangformung, reaper-werkbank, layering-varianten, foley-umgebung]
  - title: Interaktive Musik
    description: Musik, die Zuständen folgt, ein eigenes Stück als Loops, Stems und Übergangsstücke und die Umsetzung mit AudioStreamInteractive in Godot.
    modules: [musik-zustaende, loops-stems, godot-musik]
  - title: Mischen und ins Spiel
    description: Prioritäten, Maskierung, Ducking und Stille, dann Lautheit, Export, Import und Hörtest im Spiel und eine Werkstatt mit eigenem Audioabschnitt.
    modules: [mischung-stille, export-im-spiel, werkstatt-audioabschnitt]
