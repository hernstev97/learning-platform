projects:
  - id: hoeranalyse-abschnitt
    title: Höranalyse eines veröffentlichten Spielabschnitts
    level: 1
    hours: 6
    summary: Du hörst einen kurzen Abschnitt eines veröffentlichten Spiels mit Kopfhörern Klang für Klang auseinander, rekonstruierst daraus seine Cue-Liste und seine Musikzustände und schreibst auf, was der Mix dir sagt und was er weglässt. Geht größtenteils unterwegs.
    brief: |
      Wähle zwei bis drei Minuten aus einem veröffentlichten Spiel, am besten aus einer Draufsicht mit Kampf und Erkundung. Grundlage ist ein Video, das du selbst aufnimmst oder das der Hersteller veröffentlicht hat. Ziel ist eine Analyse, die ein anderer nachprüfen kann: Jede Zeile hat eine Zeitmarke im Video.

      Hör mit Kopfhörern, einmal laut und einmal leise. Am Handy gehen Protokoll und Urteil; Zeitmarken auf die Zehntelsekunde setzt du leichter am PC.

      Grundlage sind [Kritisch hören](/sound/hoeren-analysieren), [Vom Ereignis zur Cue-Liste](/sound/klangplan), [Musik für Zustände](/sound/musik-zustaende) und [Mischung und Stille](/sound/mischung-stille).
    skills: [kritisch-hoeren, cue-liste, prioritaet, musikzustaende, analyse]
    steps:
      - id: abschnitt-waehlen
        title: Abschnitt und Quelle festlegen
        detail: Notiere Spiel, Plattform, Abschnitt, Link und Länge des Videos. Prüfe, ob im Video kommentiert oder Musik nachträglich unterlegt wurde; dann taugt es nicht.
      - id: hoerprotokoll
        title: Hörprotokoll mit Zeitmarken
        detail: Jede Zeile hat Zeit, Klang, Quelle im Bild oder außerhalb, Funktion (Rückmeldung, Warnung, Ort, Stimmung) und eine Priorität von 1 bis 3. Stille notierst du auch.
      - id: cue-liste-rekonstruieren
        title: Cue-Liste rekonstruieren
        detail: Fasse gleiche Klänge zu Ereignissen zusammen und schätze, wie viele Varianten jedes Ereignis hat. Schreib dazu, woran du Varianten erkennst und wo du unsicher bist.
      - id: musik-zustaende
        title: Musikzustände und Übergänge
        detail: Zeichne die Zustände der Musik als Diagramm und notiere bei jedem Wechsel, was ihn ausgelöst hat und ob er auf einem Schlag, einem Takt oder sofort passiert.
      - id: mix-lesen
        title: Den Mix lesen
        detail: Markiere drei Stellen, an denen ein Klang einen anderen verdrängt oder etwas leiser wird. Beschreibe, welche Information dadurch hörbar bleibt.
      - id: leise-hoeren
        title: Leise und am Handylautsprecher hören
        detail: Hör den Abschnitt noch einmal sehr leise und einmal über den Handylautsprecher. Was verschwindet, was bleibt?
      - id: fragen-notieren
        title: Eigene Fragen notieren
        detail: Schreib drei Fragen auf, die diese Analyse für dein eigenes Spiel aufwirft. Antworten brauchst du nicht.
    stretch:
      - Denselben Abschnitt in einem zweiten Spiel desselben Genres analysieren und die Prioritäten vergleichen.
      - Eine zweite Person das Hörprotokoll unabhängig schreiben lassen und die Prioritäten vergleichen.
    portfolio: |
      Eine Höranalyse zeigt, dass du Ton in Funktionen und Prioritäten beschreiben kannst, nicht nur in Geschmack. Zeig Protokoll, Cue-Liste und Zustandsdiagramm nebeneinander. Im Gespräch fragen Audio-Leute gern, welchen Klang du zuerst streichen würdest, wenn das Spiel zu voll klingt.

  - id: eigene-geraeuschbibliothek
    title: Eine kleine eigene Geräuschbibliothek
    level: 1
    hours: 10
    summary: Du nimmst mit dem Handy eine kleine Sammlung eigener Geräusche auf, protokollierst jede Aufnahme, säuberst, schneidest und benennst sie in REAPER und legst eine Quellenliste an, mit der du jede Datei später wiederfindest.
    brief: |
      Eine eigene Bibliothek ist dein Rohstoff. Sie muss nicht groß sein, aber jede Datei soll nachvollziehbar sein: Wann, wo und womit ist sie entstanden, was wurde bearbeitet, und unter welchem Namen liegt sie. Was du aufnimmst, entscheidest du: Flächen, Gegenstände, Räume, Kleidung, Wasser, Wind.

      Grundlage sind [Feldaufnahme mit dem Handy](/sound/feldaufnahme), [Quellen und Lizenzen](/sound/quellen-lizenzen) und [REAPER als Werkbank](/sound/reaper-werkbank).
    skills: [feldaufnahme, aufnahmeprotokoll, reaper, saeubern, benennung, quellenliste]
    steps:
      - id: app-pruefen
        title: Aufnahme-App prüfen
        detail: Notiere App, Format, Abtastrate und ob Pegelautomatik und Rauschunterdrückung aus sind. Mach eine Probeaufnahme von Stille und eine von einem Klatscher und hör beide am PC an.
      - id: aufnahmeplan
        title: Aufnahmeplan
        detail: Liste zehn bis zwanzig Klänge, die du aufnehmen willst, mit Ort und Zeit, zu der es dort ruhig ist.
      - id: aufnehmen
        title: Aufnehmen mit Ansage und Room Tone
        detail: Jede Aufnahme beginnt mit einer kurzen Ansage, jeder Ort bekommt 30 Sekunden Room Tone. Pro Klang mehrere Takes aus unterschiedlichem Abstand.
      - id: protokoll
        title: Aufnahmeprotokoll
        detail: Datum, Ort, Gerät, Abstand, Take-Nummer und Notizen zu Störungen für jede Aufnahme, am besten direkt nach dem Take.
      - id: saeubern
        title: Säubern und schneiden
        detail: In REAPER Hochpass, Rauschreduktion mit dem Room Tone, Fades und Schnitt mit Bordmitteln. Notiere, was du bei welchem Klang gemacht hast.
      - id: regionen-rendern
        title: Regionen und Render
        detail: Eine Region je Klang, Render über die Region Render Matrix mit einem Namensschema, das du festlegst. Abtastrate und Bittiefe stehen im Protokoll.
      - id: quellenliste
        title: Quellenliste
        detail: Eine Datei mit einer Zeile je Klang – Datei, Herkunft, Aufnahmedatum, Ort, Bearbeitung, Lizenz „eigene Aufnahme“. Rohaufnahmen und REAPER-Projekt liegen getrennt von den Exporten.
      - id: sichern
        title: Sichern
        detail: Rohaufnahmen, Projekt und Exporte liegen in einer Sicherung außerhalb des Rechners. Git allein ist kein Backup.
    stretch:
      - Dieselbe Fläche mit drei Schuhwerken aufnehmen und die Unterschiede beschreiben.
      - Eine eigene Impulsantwort eines Raums aufnehmen und in ReaVerb laden.
    portfolio: |
      Eine kleine, sauber dokumentierte Bibliothek zeigt Arbeitsweise: Planung, Protokoll, Säubern, Benennung. Zeig ein Vorher-nachher-Beispiel und die Quellenliste. Wer sieht, dass du jede Datei zurückverfolgen kannst, traut dir auch Lizenzfragen zu.

  - id: aktion-varianten
    title: Eine Aktion, mehrere Varianten
    level: 2
    hours: 10
    summary: Du baust für eine selbst gewählte Aktion einen eigenen Klang aus Schichten, erzeugst mehrere Varianten, legst die Transiente auf das richtige Bild und vergleichst im Spiel zwei Fassungen in protokollierten Hörtests.
    brief: |
      Eine Aktion, die oft vorkommt, verrät schnell, ob ihr Klang trägt: ein Schritt, ein Ausweichen, ein Angriff, ein Einsammeln. Welche Aktion es ist und wie sie klingt, entscheidest du. Der Kurs gibt dir das Werkzeug und die Messung.

      Grundlage sind [Vom Ereignis zur Cue-Liste](/sound/klangplan), [Hüllkurve, Frequenz, Dynamik und Raum](/sound/klangformung), [Layering und Varianten](/sound/layering-varianten) und für den Einbau [Audio zuordnen](/godot/audio). Die Bildnummern der Aktion kommen aus deiner Animation ([Animation im Spiel](/animation/animation-im-spiel)) oder aus der Testszene des Combat-Bereichs ([Testszene: Angriff](/combat/testszene-angriff)).
    skills: [layering, varianten, huellkurve, synchronisation, godot-audio, hoertest]
    steps:
      - id: aktion-waehlen
        title: Aktion und Bildnummern
        detail: Wähle die Aktion und notiere ihre Dauer in Frames und das Bild, in dem der Klang „passiert“. Schreib in einem Satz, was der Klang dem Spieler sagen soll.
      - id: cue-zeile
        title: Cue-Zeile schreiben
        detail: Name, Auslöser, One-Shot oder Loop, Länge, Priorität, Bus, Zahl der Varianten mit Begründung aus der Häufigkeit.
      - id: schichten-bauen
        title: Schichten bauen
        detail: Mindestens zwei Schichten aus eigenem Material in REAPER, zeitlich ausgerichtet, Phase geprüft. Notiere, welche Schicht welche Aufgabe hat.
      - id: varianten
        title: Varianten erzeugen
        detail: Mindestens vier Varianten aus unterschiedlichen Takes oder Kombinationen, mit gleicher Lautheit. Render über Regionen.
      - id: einbauen
        title: Im Spiel einbauen
        detail: Die Varianten in einen `AudioStreamRandomizer`, Auslösen im richtigen Bild. Prüfe mit einem Log oder einer Aufnahme, dass die Transiente im geplanten Frame liegt.
      - id: ab-vergleich
        title: Zwei Fassungen vergleichen
        detail: Fassung A und B unterscheiden sich in genau einer Sache. Hör beide im Spiel mehrmals hintereinander, notiere vorher deine Erwartung und danach, was du gehört hast.
      - id: entscheiden
        title: Entscheiden und festhalten
        detail: Welche Fassung bleibt, warum, und was du als Nächstes testen würdest. Beide Fassungen bleiben als Dateien erhalten.
    stretch:
      - Die Varianten zur Laufzeit aus Schichten kombinieren statt vorzurendern und beide Wege vergleichen.
      - Eine zweite Person die Aktion fünf Minuten spielen lassen und fragen, ob ihr eine Wiederholung auffällt.
    portfolio: |
      Ein Klang mit Varianten, die auf ein Bild genau sitzen, zeigt Handwerk und Umsetzung zugleich. Zeig im Video die Aktion zehnmal hintereinander und daneben Cue-Zeile und Protokoll. Im Gespräch fragen Sounddesigner, wie du verhinderst, dass derselbe Klang zweimal hintereinander kommt.

  - id: stueck-zwei-zustaende
    title: Ein eigenes Stück für zwei Zustände
    level: 2
    hours: 12
    summary: Du bereitest ein eigenes Musikstück so auf, dass es zwei Spielzuständen folgt, setzt es mit AudioStreamInteractive in Godot um und misst, wann und wie jeder Übergang tatsächlich erklingt.
    brief: |
      Ein Stück, das als Ganzes gut ist, muss im Spiel an Stellen umschalten, die du nicht kennst. Dieses Projekt prüft, ob deins das kann. Welches Stück, welche Zustände und welche Übergänge, entscheidest du. Neu komponieren musst du nicht; ein vorhandenes eigenes Stück ist der vorgesehene Weg.

      Grundlage sind [Musik für Zustände](/sound/musik-zustaende), [Loops, Hallfahnen, Stems](/sound/loops-stems) und [Musik in Godot](/sound/godot-musik).
    skills: [interaktive-musik, loops, stems, uebergaenge, audiostreaminteractive, messen]
    steps:
      - id: zustaende-festlegen
        title: Zustände und Auslöser
        detail: Zwei Zustände, die Ereignisse, die zwischen ihnen wechseln, und eine Regel gegen schnelles Hin- und Herschalten. Als Zustandsdiagramm.
      - id: stueck-pruefen
        title: Stück prüfen
        detail: Tempo, Taktart, Länge der Abschnitte in Takten. Welche Teile taugen als Loop, welche als Übergang?
      - id: loops-rendern
        title: Loops und Stems rendern
        detail: Loops auf Taktgrenzen mit Hallfahne am Anfang, Länge in Samples nachgerechnet. Für eine vertikale Schicht gleich lange Stems.
      - id: uebergaenge-rendern
        title: Übergänge und Stinger
        detail: Mindestens ein Übergangsstück oder ein Stinger, gerendert und benannt.
      - id: godot-einrichten
        title: In Godot einrichten
        detail: Ogg-Import mit Tempo und Takt, `AudioStreamInteractive` mit Clips und Übergangstabelle. Umschalten per Spielereignis und per Taste.
      - id: messen
        title: Übergänge messen
        detail: Für jeden Übergang drei Anfragen zu unterschiedlichen Zeitpunkten. Notiere Anfragezeit, erwarteten und tatsächlichen Wechsel, gemessen im Log oder in einer Aufnahme.
      - id: hoeren
        title: Im Spiel hören
        detail: Spiel den Abschnitt zehn Minuten. Notiere jeden Übergang, der dich stört, und was ihn auslöst.
      - id: ueberarbeiten
        title: Überarbeiten
        detail: Eine Änderung je Runde, mindestens zwei Runden. Alte Fassungen bleiben erhalten.
    stretch:
      - Einen dritten Zustand als vertikale Schicht mit `AudioStreamSynchronized` ergänzen.
      - Den Prüfloop aus Metronom-Klicks gegen dein Stück tauschen und die Messung wiederholen.
    portfolio: |
      Ein Video mit sichtbarem Zustandswechsel, in dem die Musik auf dem Takt folgt, zeigt mehr als jedes Stück allein. Daneben gehören Zustandsdiagramm und Übergangstabelle. Im Gespräch fragen Komponisten und Audio Directors, was passiert, wenn der Spieler im falschen Moment umschaltet.

  - id: abschluss-audioabschnitt
    title: "Abschlussprojekt: Audio-Test für einen Spielprototyp"
    capstone: true
    level: 3
    hours: 40
    summary: Ein kleines Studio schickt dir einen Audio-Test. Du vertonst einen kurzen spielbaren Abschnitt mit eigenen Klängen, einer Atmo und einem eigenen Stück in mindestens zwei Zuständen, mischst nach Priorität, stimmst die Lautheit ab und lieferst Cue-Liste, Quellenliste, Entscheidungsprotokoll und ein kurzes Video. Jeder Klang und jede Mischentscheidung liegt bei dir.
    brief: |
      ## Auftrag

      Mira Petersen leitet ein Indie-Studio mit fünf Leuten in Hamburg. Das Team baut ein Actionspiel in der Draufsicht in Godot 4.7. Für die Stelle „Sound Designer (m/w/d)“ schickt sie dir einen Audio-Test. Ihre Lage:

      - Der Prototyp hat nur Platzhalter-Klicks. Tester sagen, das Spiel fühle sich „leer“ an.
      - Niemand im Team weiß, welche Klänge das Spiel überhaupt braucht oder wie laut sie sein sollen.
      - Musik gibt es, aber sie läuft als ein Stück durch und ignoriert, was passiert.

      Gesucht ist kein fertiger Soundtrack, sondern ein Beleg, dass du einen Abschnitt planst, vertonst, einbaust, mischst und so dokumentierst, dass das Team weiterarbeiten kann. Was der Abschnitt zeigt, wie er klingt und welche Musik ihn trägt, gibt dir niemand vor. Wenn du willst, ist er dein erster Audioabschnitt für Project Delicate Flower; der Kurs schlägt dafür keine Klänge vor.

      ## Was du lieferst

      1. **Ein spielbarer Abschnitt** in Godot 4.7, etwa die Testszene des Combat-Bereichs oder eine eigene Szene: mindestens eine Aktion mit eigenen Varianten, eine Atmo, ein eigenes Stück in mindestens zwei Zuständen mit Übergängen.
      2. **`CUE-LISTE.md`:** alle Klänge mit Auslöser, Varianten, Priorität, Bus und Status.
      3. **`QUELLEN.md`:** eine Zeile je Datei mit Herkunft, Lizenz und Bearbeitung.
      4. **`ENTSCHEIDUNGEN.md`:** mindestens acht Einträge mit Entscheidung, Grund, verworfener Alternative, Test und Ergebnis.
      5. **`HOERTEST.md`:** Hörprotokolle mit mindestens drei Wiedergabegeräten und zwei Lautstärken.
      6. **Originale und Exporte getrennt:** REAPER-Projekte und Rohaufnahmen in einem Ordner, gerenderte Dateien in einem anderen.
      7. **Ein Video** von höchstens 90 Sekunden mit sichtbarem Zustandswechsel.

      ## Technischer Rahmen

      Godot 4.7, REAPER 7 mit Bordmitteln, eigene Plugins nur, wenn sie bei dir stabil laufen. Den Code für das Einbauen darf eine KI schreiben, auch nach deiner Vorgabe. Klänge, Musik, Mischung und das Urteil über die Wirkung sind deine. Kein generiertes Audio; fremdes Material nur mit dokumentierter Lizenz. Das Lautheitsziel legst du selbst fest und begründest es.

      Grundlage sind alle Module dieses Bereichs, besonders [Vom Ereignis zur Cue-Liste](/sound/klangplan), [Layering und Varianten](/sound/layering-varianten), [Musik in Godot](/sound/godot-musik), [Mischung und Stille](/sound/mischung-stille), [Lautheit, Export und Hörtest](/sound/export-im-spiel) und die [Werkstatt](/sound/werkstatt-audioabschnitt).
    skills: [sounddesign, interaktive-musik, mischung, lautheit, godot-audio, dokumentation, lizenzen]
    steps:
      - id: abschnitt-festlegen
        title: Abschnitt und Ziel
        detail: Welcher Abschnitt, wie lang, was passiert darin? Schreib in einem Satz, was ein Spieler danach über den Abschnitt gehört haben soll.
      - id: cue-liste
        title: Cue-Liste
        detail: Alle Ereignisse mit Auslöser, Bildnummer oder Signal, Varianten, Priorität und Bus, bevor du einen Klang baust.
      - id: aufnehmen-bauen
        title: Klänge aufnehmen und bauen
        detail: Eigene Aufnahmen, Schichten und Varianten nach der Cue-Liste. Jede Datei bekommt sofort eine Zeile in `QUELLEN.md`.
      - id: atmo
        title: Atmo
        detail: Ein nahtloses Bett und Spot-Klänge, die das Spiel zufällig verteilt.
      - id: musik-aufbereiten
        title: Musik aufbereiten
        detail: Eigenes Stück als Loops, Stems und Übergänge, Zustände und Auslöser als Diagramm.
      - id: einbauen
        title: Einbauen
        detail: Busse, Varianten, `AudioStreamInteractive` und Auslöser im Spiel. Jede Bildnummer aus der Cue-Liste ist geprüft.
      - id: mischen
        title: Mischen nach Priorität
        detail: Prioritätentabelle, Ducking wo nötig, bewusste Stille an mindestens einer Stelle. Begründung in `ENTSCHEIDUNGEN.md`.
      - id: lautheit
        title: Lautheit abstimmen
        detail: Lautheitsziel festlegen, alle Exporte messen und angleichen, True Peak prüfen. Messwerte stehen in der Cue-Liste.
      - id: hoertest
        title: Hörtest
        detail: Kopfhörer, Laptop-Lautsprecher, Handy oder ein drittes Gerät, je laut und leise. Notiere, welche Information verloren geht.
      - id: fremdtest
        title: Fremdtest
        detail: Eine Person spielt den Abschnitt ohne Erklärung. Frag danach, was sie gehört hat und was ihr gefehlt hat.
      - id: ueberarbeiten
        title: Zwei Überarbeitungsrunden
        detail: Jede Runde ändert gezielt, was Hörtest oder Fremdtest gezeigt haben, und hat einen Eintrag in `ENTSCHEIDUNGEN.md`.
      - id: abgabe
        title: Abgabe zusammenstellen
        detail: Video, Dokumente, README mit Godot- und REAPER-Version und Startanleitung. Lies alles einmal als Mira Petersen.
    acceptance:
      - id: spielbar
        text: Der Abschnitt startet mit Godot 4.7 ohne Fehler oder Warnungen in der Ausgabe; alle Klänge der Cue-Liste sind im Spiel zu hören.
      - id: cue-liste-vollstaendig
        text: "`CUE-LISTE.md` nennt für jedes Ereignis Auslöser, Varianten, Priorität, Bus und gemessene Lautheit; jede Bildnummer ist im Spiel geprüft."
      - id: varianten
        text: Mindestens eine Aktion hat vier oder mehr eigene Varianten, und eine direkte Wiederholung derselben Datei ist ausgeschlossen oder begründet.
      - id: uebergaenge-gemessen
        text: Jeder Musikübergang ist mit Anfragezeit und tatsächlichem Wechsel gemessen; der Wechsel liegt dort, wo die Übergangstabelle ihn vorsieht.
      - id: quellen
        text: "`QUELLEN.md` hat eine Zeile je Datei im Projekt; fremdes Material nennt Lizenz mit Version, Quelle und Abrufdatum, generiertes Audio kommt nicht vor."
      - id: entscheidungen
        text: "`ENTSCHEIDUNGEN.md` enthält mindestens acht Einträge mit Grund, verworfener Alternative und Testergebnis."
      - id: hoertest-belegt
        text: "`HOERTEST.md` belegt Tests mit mindestens drei Wiedergabegeräten bei zwei Lautstärken und einen Fremdtest."
      - id: originale-getrennt
        text: Rohaufnahmen und REAPER-Projekte liegen getrennt von den Exporten und sind außerhalb des Rechners gesichert.
    stretch:
      - Lautstärkeregler für Musik, SFX und Atmo im Spielmenü, die auf die Busse wirken.
      - Den Abschnitt mit dem Prüfloop statt der Musik testen und zeigen, dass jeder Übergang auf dem geplanten Schlag liegt.
    portfolio: |
      Das ist dein Reel-Stück. Zeig im Video zuerst den Abschnitt mit Platzhalter-Klicks, dann mit deinem Ton, und lass den Zustandswechsel sehen. Daneben gehören Cue-Liste, Übergangstabelle und zwei Einträge aus dem Entscheidungsprotokoll. Im Gespräch wirst du gefragt, was du mit doppelt so viel Zeit ändern würdest und was du zuerst streichst, wenn der Speicher knapp wird.
