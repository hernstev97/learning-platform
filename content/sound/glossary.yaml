terms:
  - term: Cue-Liste
    definition: Liste aller Klangereignisse eines Spiels oder Abschnitts mit Name, Auslöser, One-Shot oder Loop, Länge, Varianten, Priorität, Bus und Status. Planungs- und Übergabedokument zwischen Design, Animation, Programmierung und Audio.
  - term: Ereignis
    definition: Ein Moment im Spiel, an dem ein Klang beginnt, endet oder sich ändert, etwa ein Kontaktbild in der Animation, ein gemeldeter Treffer oder ein Zustandswechsel. In Middleware wie Wwise und FMOD heißt das Objekt, das Code auslöst, ebenfalls Event.
  - term: One-Shot
    definition: Klang, der einmal abgespielt wird und endet, etwa ein Schritt oder ein Treffer. Gegenstück zum Loop.
  - term: Loop
    definition: Klang oder Musikabschnitt, der nahtlos wiederholt wird. In Godot meldet ein Loop kein `finished`.
  - term: Variante
    definition: Eine von mehreren Fassungen desselben Klangs für dasselbe Ereignis. Varianten verhindern, dass ein häufiges Ereignis wie eine Wiederholung derselben Datei klingt.
  - term: Maschinengewehr-Effekt
    definition: Eindruck eines mechanischen Rasterns, wenn derselbe kurze Klang schnell hintereinander identisch abgespielt wird, etwa bei Schritten. Gegenmittel sind Varianten und kleine Änderungen von Tonhöhe und Lautstärke.
  - term: AudioStreamRandomizer
    definition: Godot-Ressource, die bei jedem Abspielen aus mehreren Streams wählt und Tonhöhe und Lautstärke zufällig ändern kann. Standardmodus in Godot 4.7 ist `PLAYBACK_RANDOM_NO_REPEATS`.
  - term: Layering
    definition: Einen Klang aus mehreren Schichten bauen, etwa Transiente, Körper und Fahne oder tiefe, mittlere und hohe Anteile aus verschiedenen Quellen. Jede Schicht hat eine Aufgabe.
  - term: Schicht
    definition: Ein Bestandteil eines geschichteten Klangs (englisch Layer). In der Musik auch eine Stimme oder Instrumentengruppe, die man bei vertikaler Schichtung zu- oder abschaltet.
  - term: Hüllkurve
    definition: Verlauf der Lautstärke eines Klangs über die Zeit, oft beschrieben mit Attack, Decay, Sustain und Release. Bei kurzen Spielgeräuschen entscheidet vor allem die Attack, wann der Klang wahrgenommen wird.
  - term: Transiente
    definition: Kurzer, lauter Anfang eines Klangs, etwa der Aufschlag eines Schritts. Trägt das Timing; liegt sie nicht im richtigen Bild, wirkt der Klang zu früh oder zu spät.
  - term: Hallfahne
    definition: Nachklang eines Klangs oder Stücks nach dem eigentlichen Ende, etwa durch Hall (englisch Tail). Wird beim Rendern leicht abgeschnitten und muss bei Musik-Loops an den Anfang zurückgeführt werden.
  - term: Room Tone
    definition: Aufnahme der Stille eines Ortes, ohne gezielte Geräusche. Dient als Rauschprofil für die Rauschreduktion und als Füllmaterial beim Schneiden.
  - term: Feldaufnahme
    definition: Aufnahme außerhalb eines Studios, an dem Ort, wo der Klang entsteht (englisch Field Recording).
  - term: Ansage
    definition: Kurze gesprochene Kennung am Anfang einer Aufnahme mit Ort, Gegenstand und Take (englisch Slate). Macht Aufnahmen auch ohne Protokoll zuordenbar.
  - term: Foley
    definition: Geräusche, die passend zum Bild aufgenommen werden, etwa Schritte, Kleidung und Gegenstände. Benannt nach Jack Foley, der das Verfahren beim Film prägte.
  - term: Atmo
    definition: Umgebungsklang eines Ortes (englisch Ambience), meist aus einem Bett und darüber verteilten Spot-Klängen.
  - term: Bett
    definition: Durchgehender, meist geloopter Grundklang einer Atmo, etwa Wind oder Raumrauschen.
  - term: Spot-Klang
    definition: Einzelner Klang, der über ein Bett verteilt wird, etwa ein Vogelruf oder ein Knarzen. Im Spiel oft zufällig ausgelöst, damit das Bett nicht als Loop auffällt.
  - term: Diegetisch
    definition: Klang, der in der Spielwelt existiert und von den Figuren gehört werden könnte, etwa Schritte. Nicht diegetisch sind Klänge außerhalb der Welt wie Menütöne oder meist die Musik.
  - term: Hörmodi
    definition: Nach Michel Chion drei Arten zuzuhören – kausal (Was erzeugt den Klang?), semantisch (Was bedeutet er?) und reduziert (Wie klingt er an sich?). Werkzeug für die Analyse.
  - term: Grundton
    definition: In R. Murray Schafers Begriffen der Klanghintergrund eines Ortes, den man meist nicht bewusst hört (englisch Keynote Sound). Dazu kommen Signale, die man beachtet, und Klangmarken, die einen Ort unverwechselbar machen.
  - term: Priorität
    definition: Rangfolge, welche Klänge hörbar bleiben müssen, wenn viele gleichzeitig spielen. Grundlage für Stimmenbegrenzung, Ducking und Lautstärke.
  - term: Maskierung
    definition: Ein Klang macht einen anderen schwer hörbar, weil er im gleichen Frequenzbereich oder zur gleichen Zeit lauter ist.
  - term: Ducking
    definition: Automatisches Absenken eines Signals, solange ein anderes spielt, etwa Musik unter wichtigen Geräuschen. Meist mit einem Kompressor, dessen Sidechain vom anderen Signal gesteuert wird.
  - term: Sidechain
    definition: Steuereingang eines Effekts, der auf ein anderes Signal reagiert als das, das er bearbeitet. In Godot hat `AudioEffectCompressor` dafür die Eigenschaft `sidechain` mit dem Namen eines Busses.
  - term: Stimmenbegrenzung
    definition: Obergrenze, wie viele Instanzen eines Klangs gleichzeitig spielen dürfen. In Godot `max_polyphony` am Player.
  - term: Audiobus
    definition: Kanal, über den Ton zum Ausgang läuft, mit Lautstärke, Effekten und Pegelanzeige. In Godot im Panel *Audio*; Player wählen ihren Bus über den Namen.
  - term: Lautheit
    definition: Wahrgenommene Lautstärke, gemessen in LUFS nach ITU-R BS.1770. Anders als der Spitzenpegel berücksichtigt sie Frequenzgewichtung und Dauer.
  - term: LUFS
    definition: Loudness Units relative to Full Scale. Integriert über ein ganzes Signal, kurzzeitig über 3 Sekunden, momentan über 400 Millisekunden. Ein LU entspricht einem dB.
  - term: True Peak
    definition: Spitzenpegel des rekonstruierten analogen Signals zwischen den Samples, angegeben in dBTP. Kann über dem höchsten Sample-Wert liegen.
  - term: Headroom
    definition: Abstand zwischen dem Pegel eines Signals und 0 dBFS. Platz, damit gleichzeitige Klänge zusammen nicht übersteuern.
  - term: dBFS
    definition: Dezibel relativ zum größten darstellbaren Wert eines digitalen Signals. 0 dBFS ist das Maximum, alle Pegel darunter sind negativ.
  - term: Abtastrate
    definition: Samples pro Sekunde, etwa 48 000. Godot mischt standardmäßig mit 44 100 Hz (`audio/driver/mix_rate`) und rechnet andere Raten um.
  - term: Region
    definition: In REAPER ein benannter Zeitabschnitt im Projekt. Für Spielgeräusche meist eine Region je Klang, die sich einzeln rendern lässt.
  - term: Region Render Matrix
    definition: Tabelle in REAPER, in der man festlegt, welche Region über welche Spur gerendert wird. Damit entstehen viele Dateien in einem Durchgang.
  - term: Wildcard
    definition: Platzhalter in REAPERs Render-Dateinamen wie `$region` oder `$project`, den REAPER beim Rendern ersetzt.
  - term: Horizontale Neuordnung
    definition: Interaktive Musik, die zwischen Abschnitten wechselt, je nach Zustand (englisch Horizontal Re-sequencing). Gegenstück zur vertikalen Schichtung.
  - term: Vertikale Schichtung
    definition: Interaktive Musik aus gleichzeitig laufenden Schichten, die je nach Zustand lauter oder leiser werden (englisch Vertical Layering).
  - term: Stem
    definition: Gerenderte Teilspur eines Stücks, etwa Rhythmus oder Melodie, mit gleicher Länge und gleichem Startpunkt wie die übrigen Stems.
  - term: Stinger
    definition: Kurzes Musikstück, das ein Ereignis markiert, etwa einen Fund oder einen Sieg. Meist liegt es über der laufenden Musik; es kann sie auch kurz ersetzen, danach kehrt die Musik zurück.
  - term: Übergangsstück
    definition: Kurzer Musikabschnitt, der zwischen zwei Zuständen vermittelt. In Godots `AudioStreamInteractive` als Filler-Clip einer Übergangsregel.
  - term: AudioStreamInteractive
    definition: Godot-Ressource für interaktive Musik aus Clips mit einer Übergangstabelle. Ein Übergang kann sofort, auf dem nächsten Schlag, dem nächsten Takt oder am Ende des Clips greifen; Schlag und Takt brauchen Tempo und Taktangabe im Import.
  - term: AudioStreamSynchronized
    definition: Godot-Ressource, die mehrere Streams synchron abspielt und je Stream eine Lautstärke hat. Werkzeug für vertikale Schichtung.
  - term: Hysterese
    definition: Zwei Schwellen gegen schnelles Hin- und Herschalten zwischen zwei Zuständen. Der Zustand beginnt bei einem Wert und endet erst bei einem anderen, etwa Kampfmusik ab einem Abstand von 100 Pixeln und Ruhe erst ab 150 (Platzhalter).
  - term: Nachlauf
    definition: Ein Zustand endet erst, wenn sein Signal eine Zeit lang ununterbrochen fehlt. Verhindert Flattern wie die Hysterese und kostet Reaktionszeit; bei Musik auf dem Takt kommt die Wartezeit bis zur nächsten Taktgrenze dazu.
  - term: Prüfloop
    definition: Technisches Testsignal aus Metronom-Klicks mit hörbarem Taktanfang, mit dem man prüft, wo ein Musikübergang tatsächlich greift. Kein Stück für das Spiel.
  - term: Platzhalter
    definition: Wert oder Klang, der nur zum Testen da ist und keine Empfehlung darstellt. In diesem Kurs sind alle Zahlen für dein Spiel Platzhalter.
  - term: Redesign
    definition: Neuvertonung einer veröffentlichten Spiel- oder Filmszene mit eigenem Ton, üblich für Demo-Reels.
  - term: CC0
    definition: Creative-Commons-Verzicht, mit dem ein Urheber so weit wie möglich auf seine Rechte verzichtet. Namensnennung ist nicht verlangt, aber zur Nachvollziehbarkeit sinnvoll.
  - term: CC BY
    definition: Creative-Commons-Lizenz, die Nutzung, Bearbeitung und kommerziellen Einsatz erlaubt, wenn du den Urheber nennst, auf die Lizenz verweist und Änderungen kenntlich machst. Die Zusätze NC und ND schließen kommerzielle Nutzung bzw. Bearbeitungen aus, SA verlangt dieselbe Lizenz für Bearbeitungen.
  - term: Quellenliste
    definition: Datei mit einer Zeile je Audiodatei im Projekt – Herkunft, Urheber, Lizenz mit Version, URL, Abrufdatum, Nachweis und Bearbeitung.
  - term: Entscheidungsprotokoll
    definition: Aufzeichnung von Gestaltungsentscheidungen mit Grund, verworfener Alternative, Test und Ergebnis. Macht nachvollziehbar, warum ein Klang so ist, wie er ist.
