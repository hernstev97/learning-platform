cards:
  - id: aufgaben-eines-klangs
    module: hoeren-analysieren
    q: Welche Aufgaben kann ein Klang im Spiel haben?
    a: |
      Rückmeldung auf eine Eingabe, Warnung vor etwas, das gleich passiert, Information über etwas außerhalb des Bilds, Orientierung im Raum, Stimmung und Kontinuität zwischen Szenen. Oft hat ein Klang mehrere davon zugleich: Ein Schritt bestätigt die Bewegung und sagt, auf welchem Boden ich stehe. Wenn ich einen Klang beurteile, frage ich zuerst, welche Aufgabe er hat, und erst danach, ob er gut klingt.
    tags: [hoeren, funktion]
    level: 1
  - id: diegetisch-transdiegetisch
    module: hoeren-analysieren
    q: Was heißt diegetisch, und wo wird die Unterscheidung im Spiel unscharf?
    a: |
      Diegetisch ist ein Klang, dessen Quelle in der Spielwelt liegt, etwa ein Schritt. Nicht diegetisch sind Menütöne oder meist die Musik. Im Spiel kreuzen viele Klänge die Grenze: Musik, die anschwillt, wenn ein Gegner kommt, liegt außerhalb der Welt und informiert trotzdem über sie. Kristine Jørgensen nennt solche Klänge transdiegetisch. Für die Arbeit heißt das: Auch Musik kann eine Warnung tragen und braucht dann eine Priorität.
    tags: [hoeren, diegese]
    level: 2
  - id: unbekanntes-spiel-analysieren
    module: hoeren-analysieren
    q: Wie analysierst du den Ton eines Spiels, das du nicht kennst?
    a: |
      Ich nehme einen kurzen Clip und höre ihn mehrmals mit Kopfhörern, einmal mit geschlossenen Augen. Jeden Klang trage ich mit Zeit, Quelle im Bild oder außerhalb, Aufgabe und Priorität ein. Dann frage ich, welche Information nur über den Ton kommt, wie viel Vorlauf die Warnungen haben und wo es still wird. Was mir gefällt, notiere ich getrennt; ein schöner Klang kann trotzdem eine Warnung verdecken.
    tags: [hoeren, analyse]
    level: 1
  - id: hoerweisen-chion
    module: hoeren-analysieren
    q: Was bringen dir Chions drei Hörweisen bei der Analyse?
    a: |
      Sie ergeben drei Durchgänge. Kausal frage ich, was den Klang erzeugt. Semantisch, was er bedeutet, etwa „gleich greift er an“. Reduziert, wie er an sich klingt: Hüllkurve, Lage, Länge. Den reduzierten Durchgang mache ich zuletzt, sonst beurteile ich Klangfarbe, bevor ich weiß, welche Aufgabe der Klang hat.
    tags: [hoeren, analyse]
    level: 2
  - id: cue-liste-wozu
    module: klangplan
    q: Was ist eine Cue-Liste, und was steht darin?
    a: |
      Eine Liste mit einer Zeile pro Klangereignis, nicht pro Datei. Darin stehen ID, Auslöser als Bild, Frame oder Signal, Typ (One-Shot oder Loop), Länge, Zahl der Varianten, Priorität, Bus, ob der Klang einen Ort hat, Status und Quelle. Sie ist die Übergabe zwischen Design, Animation, Programmierung und Audio: Wer sie liest, weiß, was fehlt, was fertig ist und wo jeder Klang ausgelöst wird.
    tags: [planung, cue-liste]
    level: 1
  - id: neuer-gegner-ton
    module: klangplan
    q: Wir bekommen einen neuen Gegner. Wie planst du seinen Ton?
    a: |
      Ich lasse mir die Animationsliste und den Zustandsautomaten geben. Daraus schreibe ich eine Cue-Liste mit Auslöser, Typ, Varianten aus der geschätzten Häufigkeit, Priorität, Bus und Ort. Für jeden Loop prüfe ich am Diagramm alle Ausgänge, damit er überall stoppt. Dann setze ich Prüfmuster ein und vergleiche im Log, ob sie im richtigen Frame kommen. Erst danach entstehen die Klänge.
    tags: [planung, cue-liste, technik]
    level: 2
  - id: treffer-ton-wann
    module: klangplan
    q: In welchem Frame gehört der Trefferklang ausgelöst?
    a: |
      In dem Frame, in dem der Treffer gemeldet wird, nicht in dem, in dem die Hitbox angeht. Sonst klingt auch ein Schlag ins Leere wie ein Treffer. Den Klang des Schwungs löse ich getrennt aus, am Bild der Animation, das ihn trägt. In der Cue-Liste stehen deshalb zwei Zeilen mit zwei Auslösern.
    tags: [planung, synchronisation, kampf]
    level: 1
  - id: wie-viele-varianten
    module: klangplan
    q: Wie viele Varianten braucht ein Klang?
    a: |
      Das folgt aus der Häufigkeit. Ein Schritt, der hundertmal pro Minute spielt, braucht mehr als ein Klang, der einmal pro Level kommt. Bei n zufällig gewählten Varianten kommt dieselbe mit Wahrscheinlichkeit 1/n direkt wieder. Es gibt auch Klänge, die bewusst gleich bleiben: Ein Signal, das der Spieler lernen soll, etwa eine Warnung, darf nicht jedes Mal anders klingen.
    tags: [planung, varianten]
    level: 1
  - id: loop-ausgaenge
    module: klangplan
    q: Ein Loop läuft weiter, obwohl die Figur längst etwas anderes tut. Wo suchst du?
    a: |
      Im Zustandsdiagramm. Ein Loop braucht einen Start und an jedem Ausgang seines Zustands einen Stopp. Meist wurde ein Ausgang vergessen, etwa ein Treffer, der das Laufen unterbricht, oder ein Szenenwechsel. Ich gehe alle Pfeile aus dem Zustand ab und prüfe, ob jeder den Loop beendet.
    tags: [planung, technik, fehlersuche]
    level: 2
  - id: aufnahme-vorbereiten
    module: feldaufnahme
    q: Wie bereitest du eine Aufnahme für Spielgeräusche vor?
    a: |
      Ich prüfe vorher, ob das Gerät verlustfrei und ohne Filter aufnimmt, und mache einen Probe-Take für den Pegel. Ich nehme nah auf, sage jeden Take an und nehme mehrere Takes und Abstände auf, weil das Spiel Varianten braucht. Am Ende kommt Room Tone mit derselben Position und demselben Pegel. Ich führe ein Protokoll und benenne die Dateien nach dem Schema des Projekts. Stimmen Dritter nehme ich nicht auf.
    tags: [aufnahme, feld]
    level: 1
  - id: abstand-statt-pegel
    module: feldaufnahme
    q: Die Aufnahme hat zu viel Hintergrund. Hilft es, den Pegel herunterzudrehen?
    a: |
      Nein. Der Pegel ändert beide gleich, Klang und Hintergrund. Das Verhältnis ändert nur der Abstand: Jede Verdopplung des Abstands kostet bis zu 6 dB Vorsprung vor dem Hintergrund. Also näher ran, und Hall nehme ich möglichst trocken auf, denn im Spiel kann ich ihn dazugeben, aus der Datei nehmen kann ich ihn nicht.
    tags: [aufnahme, feld, pegel]
    level: 1
  - id: room-tone-wozu
    module: feldaufnahme
    q: Wozu nimmst du Room Tone auf?
    a: |
      Room Tone ist die Stille des Orts, mit derselben Position und demselben Pegel wie die Takes. Ich brauche ihn als Rauschprofil für die Rauschreduktion und als Material, um Lücken beim Schneiden zu füllen, ohne dass der Hintergrund springt. Dreißig Sekunden reichen meist, aufgenommen direkt nach den Takes.
    tags: [aufnahme, feld, saeubern]
    level: 1
  - id: nc-im-verkauf
    module: quellen-lizenzen
    q: Darfst du einen Klang mit CC BY-NC in einem Spiel verwenden, das du verkaufst?
    a: |
      Nein. Der Lizenztext definiert nicht kommerziell als „nicht vorrangig auf einen geschäftlichen Vorteil oder eine geldwerte Vergütung gerichtet“, und ein verkauftes Spiel ist auf Vergütung gerichtet. CC0 und CC BY passen. BY-SA und BY-ND kläre ich vorher: Die 4.0-Lizenzen werten die Vertonung von Bewegtbildern immer als Bearbeitung, SA verlangt dann dieselbe Lizenz, ND verbietet die Weitergabe. Ich bin kein Jurist; ich lese den Lizenztext und frage im Zweifel den Rechteinhaber.
    tags: [lizenzen, creative-commons]
    level: 1
  - id: namensnennung-tasl
    module: quellen-lizenzen
    q: Wie sieht eine korrekte Namensnennung für einen CC-BY-Klang aus?
    a: |
      Nach TASL: Titel, Autor mit dem Namen, den er gewählt hat, Quelle mit Link und Lizenz mit Version und Link zum Lizenztext, dazu, was ich geändert habe. „Klänge von Freesound“ reicht nicht, die Plattform ersetzt nicht die Person. Wo die Nennung im Spiel steht, entscheide ich; eine eigene Credits-Seite mit allen Einträgen ist üblich.
    tags: [lizenzen, namensnennung]
    level: 1
  - id: alle-klaenge-lizenziert
    module: quellen-lizenzen
    q: Kurz vor dem Release fragt die Produzentin, ob alle Klänge sauber lizenziert sind. Was antwortest du?
    a: |
      Ich zeige die Quellenliste. Jede Datei im Projekt hat eine Zeile mit Herkunft, Lizenz mit Version, Abrufdatum und Nachweis, auch die eigenen Aufnahmen. Ein Skript prüft vor jedem Build auf Lücken und auf NC oder ND. Fälle, die ein Lizenztext offen lässt, habe ich beim Hersteller angefragt; bis zur Antwort sind sie markiert und nicht im Build.
    tags: [lizenzen, quellenliste]
    level: 2
  - id: library-effekt
    module: quellen-lizenzen
    q: Darfst du einen einzelnen Effekt aus einer Kontakt-Library als WAV ins Spiel legen?
    a: |
      Das ist offen. Die EULA von Native Instruments erlaubt Samples für Musik- und Audioproduktionen und verbietet, einzelne Samples als Soundeffekte oder Library weiterzugeben. Ein Stück aus Kontakt ist klar eine Produktion. Ob ein einzelner gerenderter Effekt im Spiel als Produktion oder als weitergegebenes Sample zählt, beantwortet der Text nicht. Ich frage den Hersteller und lege die Antwort zu den Nachweisen.
    tags: [lizenzen, libraries]
    level: 3
  - id: treffer-wirkt-spaet
    module: klangformung
    q: Unser Trefferklang wird im richtigen Frame ausgelöst und wirkt trotzdem spät. Woran kann es liegen?
    a: |
      Erst die Datei: Ich messe, wie viel Stille vor der Transiente liegt, und rechne sie in Frames um; 40 ms sind bei 60 Frames pro Sekunde mehr als zwei Frames. Dann die Hüllkurve: Eine weiche Attack oder ein Kompressor mit schneller Attack nimmt der Transiente die Spitze. Dann die Länge: Eine lange Fahne verwischt den nächsten Treffer oder wird von der Stimmenbegrenzung abgeschnitten. Erst danach prüfe ich im Log den Auslöse-Frame.
    tags: [klangformung, huellkurve, timing]
    level: 2
  - id: mono-fuer-ort
    module: klangformung
    q: Warum lieferst du Klänge mit Ort in Mono?
    a: |
      Weil die Engine aus der Position das Kanalverhältnis macht. Godot 4.7.2 mischt Stereo-Dateien in `AudioStreamPlayer2D` nicht zu Mono, sondern gewichtet jeden Kanal nach der Position; was nur im linken Kanal der Datei liegt, bleibt links, auch wenn die Quelle rechts steht. Mono-Dateien verteilen sich dagegen nach der Position. Stereo bleibt für Bett und Musik, die keinen Ort haben.
    tags: [klangformung, raum, godot]
    level: 2
  - id: hall-trocken-oder-eingebacken
    module: klangformung
    q: Hall in die Datei oder im Spiel?
    a: |
      Trocken liefern und im Spiel auf einem Hall-Bus verhallen spart Dateilänge und folgt dem Ort: Derselbe Schritt klingt im Gang anders als im Freien. Eingebacken passt, wenn der Raum zum Klang gehört, etwa bei einem Stinger. In Godot leitet ein `Area2D` mit `audio_bus_override` auf einen Hall-Bus, aber nur, wenn `area_mask` des Players die Ebene enthält; der Standard ist 0.
    tags: [klangformung, raum, godot]
    level: 2
  - id: frequenz-rollen
    module: klangformung
    q: Wie verteilst du einen Klang auf die Frequenzbereiche?
    a: |
      Unten liegt Gewicht, in der Mitte die Identität, oben Detail. Hyper Light Drifter hat Schichten bewusst nach Bändern verteilt, die Wucht kam aus dem Bass. Dazu prüfe ich, was auf kleinen Lautsprechern übrig bleibt: Auf einem Handy fehlt der tiefe Bass, die Information muss dann in den Mitten stecken.
    tags: [klangformung, frequenz]
    level: 2
  - id: sechzig-varianten-neu
    module: reaper-werkbank
    q: Wir brauchen alle 60 Schritt-Varianten mit einem anderen Hochpass. Wie lange dauert das?
    a: |
      Kurz, wenn das Projekt so gebaut ist. Die Kette liegt auf der Spur, nicht in den Dateien; jede Variante ist eine Region mit ihrem Dateinamen; der Export ist ein Preset über die Region Render Matrix. Ich ändere den Filter einmal, höre drei Varianten im Spiel gegen, rendere alles neu, die Namen bleiben gleich, die Engine importiert neu. Steckt die Bearbeitung in sechzig einzeln exportierten Dateien, muss ich jede einzeln anfassen.
    tags: [reaper, workflow]
    level: 2
  - id: region-render-matrix
    module: reaper-werkbank
    q: Wozu nutzt du in REAPER Regionen und die Region Render Matrix?
    a: |
      Eine Region je Datei, ihr Name ist der Dateiname. In der Matrix lege ich fest, welche Region über welche Spur gerendert wird, und mit `$region` im Dateinamen entstehen alle Dateien in einem Durchgang. So bleibt das Rohmaterial unverändert, und jede neue Fassung überschreibt die alte unter demselben Namen, den das Spiel kennt.
    tags: [reaper, render]
    level: 1
  - id: neue-fassung-alte-im-spiel
    module: reaper-werkbank
    q: Du hast neu gerendert, aber im Spiel klingt noch die alte Fassung. Was prüfst du?
    a: |
      Den Dateinamen. Ist „Silently increment filenames“ an, legt REAPER eine neue Datei mit Nummer an, statt die alte zu überschreiben, und das Spiel spielt weiter die alte. Godot importiert neu, wenn sich der Inhalt einer Datei ändert, aber nur unter dem Namen, den die Szene kennt. Danach prüfe ich, ob der Render in den richtigen Ordner ging.
    tags: [reaper, render, fehlersuche]
    level: 2
  - id: hall-abgeschnitten
    module: reaper-werkbank
    q: Nach dem Render bricht der Hall jeder Datei hart ab. Woran liegt das?
    a: |
      Am Tail. Ohne Tail endet die Datei am Ende der Region, und ein Hall auf der Spur bricht dort ab. Entweder schalte ich Tail ein und aktiviere es in den Render-Einstellungen für Regionen, oder ich verlängere die Regionen bis zum Ende der Fahne. Vorher frage ich, ob der Hall überhaupt in die Datei gehört oder im Spiel auf einem Bus liegt.
    tags: [reaper, render, fehlersuche]
    level: 2
  - id: schritte-nerven
    module: layering-varianten
    q: Unsere Schritte nerven nach zwei Minuten. Was machst du?
    a: |
      Erst zählen, wie oft sie pro Minute spielen und wie viele Varianten es gibt, dann den Modus des Containers prüfen; mit zwei Varianten und Wiederholungsschutz entsteht ein starres A-B-A-B. Danach mehr echte Takes statt nur Tonhöhe, eventuell Schichten, die die Engine kombiniert. Jede Änderung höre ich im Spiel gegen die alte Fassung, möglichst blind, und ich höre mindestens so lange, wie es dauert, bis es nervt.
    tags: [varianten, fehlersuche]
    level: 2
  - id: no-repeats-modus
    module: layering-varianten
    q: Was ändert `PLAYBACK_RANDOM_NO_REPEATS` gegenüber `PLAYBACK_RANDOM`?
    a: |
      `PLAYBACK_RANDOM` wählt jedes Mal frei, dieselbe Variante kommt mit 1/n direkt wieder; mit vier Varianten waren es gemessen knapp 25 %. `PLAYBACK_RANDOM_NO_REPEATS` verhindert die direkte Wiederholung, dafür kommt A-B-A häufiger, mit 1/(n − 1). Mit nur zwei Varianten entsteht ein strenges A B A B, und das hört man auch. Der Standard in Godot 4.7.2 ist der Modus ohne Wiederholung.
    tags: [varianten, godot]
    level: 2
  - id: schichten-ausrichten
    module: layering-varianten
    q: Zwei Schichten klingen allein gut, zusammen dünn. Was prüfst du?
    a: |
      Die Ausrichtung. Wenige Millisekunden Versatz zwischen zwei ähnlichen Schichten löschen tiefe Frequenzen teilweise aus, wie ein Kammfilter. Ich richte die Schichten an der Transiente aus, in REAPER mit dem Snap Offset, und prüfe die Polarität. Danach höre ich die Summe, nicht die Schichten einzeln.
    tags: [layering, phase]
    level: 2
  - id: vorgerendert-oder-laufzeit
    module: layering-varianten
    q: Varianten vorrendern oder zur Laufzeit kombinieren?
    a: |
      Vorgerendert heißt: Jede Kombination ist geprüft, aber es entstehen viele Dateien. Zur Laufzeit kombiniert die Engine Schichten, etwa mit `AudioStreamSynchronized` und einem Randomizer je Schicht; das spart Dateien und ergibt mehr Kombinationen, aber nicht jede ist geprüft. Ich entscheide nach Häufigkeit und Speicher und höre beide Wege im Spiel gegeneinander.
    tags: [varianten, godot]
    level: 3
  - id: ambience-zwanzig-minuten
    module: foley-umgebung
    q: Wie baust du eine Ambience, die nach zwanzig Minuten nicht nervt?
    a: |
      Ich trenne Bett und Spot-Klänge. Aus dem Bett schneide ich alles Auffällige heraus, mache es mit getauschten Hälften und Crossfade nahtlos und halte es lang genug für die Verweildauer am Ort. Die herausgeschnittenen Stücke werden Spot-Klänge mit Varianten, die die Engine in zufälligen Pausen spielt, erst nach dem Ende des vorigen. Dann höre ich im Spiel so lange zu, wie ein Spieler dort bleibt.
    tags: [ambience, loop]
    level: 2
  - id: nahtloser-loop
    module: foley-umgebung
    q: Wie machst du aus einer Aufnahme einen nahtlosen Loop?
    a: |
      Ich teile sie an einer ruhigen Stelle etwa in der Mitte, tausche die Hälften und verbinde sie am neuen Stoß mit einem Crossfade. Danach liegen an der Naht des Loops zwei Samples, die in der Aufnahme nebeneinanderlagen; der alte Sprung sitzt in der Mitte unter dem Crossfade. Der Crossfade kürzt den Loop um seine Länge. Gerendert wird ohne Tail, geprüft in Schleife.
    tags: [ambience, loop, reaper]
    level: 2
  - id: spot-klaenge-ueberlappen
    module: foley-umgebung
    q: Deine Spot-Klänge spielen manchmal übereinander. Wie verhinderst du das?
    a: |
      Die zufällige Pause beginnt erst, wenn der vorige Klang zu Ende ist, also nach `finished`, nicht nach dem Start. Sonst überholt eine kurze Pause einen langen Klang. Mark Hollier beschreibt für Eon Altar genau dieses Problem und diese Lösung.
    tags: [ambience, godot]
    level: 2
  - id: horizontal-vertikal
    module: musik-zustaende
    q: Was ist der Unterschied zwischen horizontaler Neuordnung und vertikaler Schichtung?
    a: |
      Horizontal wechselt die Musik zwischen Abschnitten, je nach Zustand: Erkunden, dann ein Kampfteil. Vertikal laufen Schichten synchron, und der Zustand regelt, welche hörbar sind. Horizontal erlaubt große Wechsel, braucht aber Übergänge; vertikal reagiert sofort und bleibt im Takt, verlangt aber Schichten, die in jeder Kombination tragen. Viele Spiele mischen beides.
    tags: [musik, interaktiv]
    level: 1
  - id: kampfmusik-jederzeit
    module: musik-zustaende
    q: Die Musik soll auf Kämpfe reagieren, die jederzeit beginnen und enden können. Wie gehst du vor?
    a: |
      Erst klären, was die Musik dem Spieler sagen soll und was Geräusche schon sagen. Dann Zustände als Diagramm mit Auslösern, und für jeden Übergang Zeitpunkt, Ziel und Art. Wechsel auf den Takt klingen musikalisch, kommen aber bis zu einem Takt später; was sofort ankommen muss, trägt ein Stinger oder ein Geräusch. Gegen Flattern setze ich Hysterese oder Nachlauf. Getestet wird mit einem Prüfloop und einem Log.
    tags: [musik, interaktiv, planung]
    level: 2
  - id: naechster-takt-wartezeit
    module: musik-zustaende
    q: Wie lange kann ein Wechsel „auf den nächsten Takt“ dauern?
    a: |
      Bis zu einem ganzen Takt. Bei 120 BPM im 4/4 sind das bis zu 2 Sekunden oder 120 Frames bei 60 pro Sekunde. Für einen Kampfbeginn kann das zu spät sein. Dann wechsle ich auf den nächsten Schlag, setze einen Stinger darüber oder lasse ein Geräusch die Information tragen, bis die Musik folgt.
    tags: [musik, uebergaenge, timing]
    level: 2
  - id: hysterese-flattern
    module: musik-zustaende
    q: Die Musik springt am Rand eines Kampfgebiets ständig hin und her. Was fehlt?
    a: |
      Eine Regel gegen Flattern. Hysterese heißt zwei Schwellen: Der Kampf beginnt bei einem Abstand und endet erst bei einem größeren. Nachlauf heißt: Der Kampf endet erst, wenn sein Signal eine Zeit lang ununterbrochen fehlt. Beides kostet Reaktionszeit, deshalb rechne ich die Wartezeiten mit dem Übergang auf den Takt zusammen, bevor ich Werte festlege.
    tags: [musik, zustaende, fehlersuche]
    level: 2
  - id: stinger-wann
    module: musik-zustaende
    q: Wann setzt du einen Stinger ein?
    a: |
      Wenn ein Ereignis sofort markiert werden soll, die Musik aber nicht sofort wechseln kann oder soll, etwa ein Fund. Meist liegt der Stinger über der laufenden Musik; er kann sie auch kurz ersetzen, dann plane ich die Rückkehr mit. Liegt er darüber, muss er über allem tragen, was zu diesem Zeitpunkt laufen kann, denn ich weiß nicht, was gerade läuft; das prüfe ich gegen jeden Clip und jede Schichtkombination.
    tags: [musik, stinger]
    level: 2
  - id: adaptive-musik-liefern
    module: loops-stems
    q: Wie lieferst du Musik für ein adaptives System?
    a: |
      Tempo und Taktart stehen vorher fest, jeder Teil ist eine Region auf Taktgrenzen, die Länge in Samples vorher gerechnet. Loops rendere ich im 2nd pass, damit die Fahne am Anfang liegt, Stinger mit ausklingender Fahne. Stems haben gleichen Start und gleiche Länge. Zu jeder Datei gibt es eine Zeile mit Tempo, Schlägen, Taktart und Loop, denn nach dem Import steht in Godot `bpm` auf 0 und `loop` aus. Vor dem Einbau läuft ein Prüfloop aus Metronom-Klicks.
    tags: [musik, loops, lieferung]
    level: 2
  - id: loop-laenge-samples
    module: loops-stems
    q: Wie lang ist ein Loop von vier Takten im 4/4 bei 120 BPM bei 48 kHz?
    a: |
      Ein Schlag dauert 60/120 = 0,5 Sekunden, vier Takte sind 16 Schläge, also 8 Sekunden oder 384 000 Samples. Ich rechne das vor dem Rendern aus und prüfe die Datei danach. Ist sie länger, hört man es im Prüfloop als zwei hohe Klicks hintereinander am Loop-Punkt.
    tags: [musik, loops, rechnen]
    level: 1
  - id: loop-fahne
    module: loops-stems
    q: Am Loop-Punkt wird die Musik plötzlich trocken. Was ist passiert?
    a: |
      Die Hallfahne fehlt am Anfang der Datei. Beim ersten Durchlauf klingt am Anfang nichts nach, beim Loop müsste das Ende des vorigen Durchlaufs nachklingen. REAPERs 2nd pass render spielt den Bereich vor dem Rendern einmal ab, damit die Fahne in den Anfang der Datei kommt. Eine Fahne hinter dem Loop-Ende hilft nicht; Godot blendet sie hinter `beat_count` aus.
    tags: [musik, loops, fehlersuche]
    level: 2
  - id: stems-laufen-auseinander
    module: loops-stems
    q: Zwei Stems laufen im Spiel nach ein paar Durchläufen auseinander. Woran liegt es?
    a: |
      Sie sind nicht gleich lang. Ein Stem, der einen Schlag länger ist, wandert in `AudioStreamSynchronized` pro Durchlauf um diesen Schlag weiter. Stems brauchen gleichen Start, gleiche Länge und gleiche Fahnenbehandlung, und in Godot denselben `beat_count`. Ich prüfe die Längen in Samples, bevor ich sie importiere.
    tags: [musik, stems, fehlersuche]
    level: 2
  - id: boss-warnung-unhoerbar
    module: mischung-stille
    q: Im Bosskampf hört man die Warnung des Bosses nicht. Was tust du?
    a: |
      Ich nehme die Stelle auf und schreibe auf, was im Moment der Warnung gleichzeitig spielt. Dann prüfe ich die Prioritätentabelle: Hat die Warnung den Rang, den sie braucht, und hält sich der Mix daran? Danach Maskierung in der Lage und in der Zeit, etwa eine laute Transiente direkt davor. Erst nehme ich etwas weg, begrenze Stimmen oder ducke die Musik mit einer Regel; lauter drehe ich zuletzt.
    tags: [mischung, prioritaet, fehlersuche]
    level: 2
  - id: summenpegel
    module: mischung-stille
    q: Zwei gleich laute Klänge spielen gleichzeitig. Wie viel lauter wird die Summe?
    a: |
      Kommt derselbe Klang zweimal im selben Frame, addieren sich die Wellen: +6 dB, bei jeder weiteren Verdopplung wieder. Zwei verschiedene Klänge ergeben im Mittel etwa +3 dB, Spitzen können trotzdem bis +6 dB gehen. In Godot 4.7.2 habe ich genau das gemessen. Deshalb begrenze ich Stimmen, statt jeden Klang leiser zu machen.
    tags: [mischung, pegel, rechnen]
    level: 2
  - id: ducking-erklaeren
    module: mischung-stille
    q: Was ist Ducking, und wann setzt du es nicht ein?
    a: |
      Ducking senkt ein Signal ab, solange ein anderes spielt, meist über einen Kompressor mit Sidechain; in Godot hat `AudioEffectCompressor` dafür die Eigenschaft `sidechain` mit einem Busnamen. Ich setze es für wenige, begründete Regeln ein. Als Mittel gegen jeden Lautstärkestreit erzeugt es Pumpen und versteckt das eigentliche Problem, eine fehlende Priorität. Overwatch beschreibt genau so ein ungeplantes Ducking.
    tags: [mischung, ducking]
    level: 2
  - id: stille-als-werkzeug
    module: mischung-stille
    q: Wozu setzt du Stille im Mix ein?
    a: |
      Als Kontrast. Nach einer dünnen Stelle wirkt das Nächste lauter und wichtiger, ohne dass ich den Pegel ändere. Stille ist im Spiel selten Null: Meist fällt etwas weg, und anderes bleibt, etwa das Bett. Die Dichte folgt dem Rhythmus des Abschnitts, mit ruhigen Stellen vor den Momenten, die zählen.
    tags: [mischung, stille]
    level: 1
  - id: portfolio-entscheidung
    module: werkstatt-audioabschnitt
    q: Erzähl uns von einem Stück in deinem Portfolio. Was hast du entschieden und warum?
    a: |
      Ich zeige den Abschnitt im Spiel, dann eine Entscheidung aus dem Protokoll, mit Grund, verworfener Alternative und dem Test, der sie bestätigt hat. Ich spiele Fassung 1 und die letzte Fassung nacheinander vor und sage, welche Änderung welchen Unterschied macht. Ich nenne die Herkunft jeder fremden Datei mit Lizenz und sage, was ich selbst aufgenommen habe.
    tags: [portfolio, dokumentation]
    level: 2
  - id: entscheidungsprotokoll
    module: werkstatt-audioabschnitt
    q: Warum führst du ein Entscheidungsprotokoll?
    a: |
      Damit nachvollziehbar bleibt, warum ein Klang so ist, wie er ist. Jeder Eintrag nennt Entscheidung, Grund, verworfene Alternative, Test und Ergebnis. Wenn drei Wochen später jemand fragt, warum die Musik erst auf dem Takt wechselt, steht die Antwort da, mit Messung. Und ich sehe, welche Entscheidungen ich ohne Test getroffen habe.
    tags: [dokumentation]
    level: 1
  - id: kampfmusik-zu-spaet
    module: godot-musik
    q: Unsere Kampfmusik setzt manchmal Sekunden zu spät ein und manchmal gar nicht. Woran liegt es?
    a: |
      Ich lasse ein Log mit Frame der Anfrage und Frame des tatsächlichen Wechsels laufen und schneide den Ton mit. Wartet ein Takt-Wechsel bis zur Eins, ist „zu spät“ das Raster, kein Fehler, und die dringende Information gehört in ein Geräusch. Kommt der Wechsel gar nicht, prüfe ich, ob der Zustand kürzer ist als der Weg zum Takt und ob der Code die Anfrage zurücknimmt oder den laufenden Clip erneut anfragt. Dann setze ich einen Nachlauf und frage nur bei Änderungen an.
    tags: [godot, interaktive-musik, fehlersuche]
    level: 3
  - id: takt-wechsel-voraussetzung
    module: godot-musik
    q: Was braucht ein Wechsel „auf den nächsten Takt“ in Godots `AudioStreamInteractive`?
    a: |
      Eine Regel in der Übergangstabelle und Tempo, Schlagzahl und Schläge pro Takt aus dem Import: `bpm`, `beat_count` und `bar_beats`. Steht `bpm` auf 0, dem Standard nach dem Import, greift der Wechsel in Godot 4.7.2 sofort, ohne Fehlermeldung. Schlag und Takt rechnet Godot aus der Position im laufenden Clip. Ohne passende Regel wechselt er auf den nächsten Schlag mit einer Ausblendung über einen Schlag.
    tags: [godot, interaktive-musik]
    level: 2
  - id: clip-erneut-angefragt
    module: godot-musik
    q: Warum fragst du in Godot nie den Clip an, der schon läuft?
    a: |
      Weil Godot 4.7.2 das als neue Anfrage behandelt: Der laufende Clip verstummt bis zum Wechselpunkt und beginnt dort von vorn. Wer jeden Frame anfragt, bekommt Stille. Dasselbe passiert, wenn ich eine wartende Anfrage zurücknehme. Die Musikregie fragt deshalb nur an, wenn sich das Ziel ändert, und verlässt einen Zustand erst nach einem Nachlauf.
    tags: [godot, interaktive-musik, fehlersuche]
    level: 3
  - id: spiel-zu-laut
    module: export-im-spiel
    q: Spieler sagen, unser Spiel sei viel lauter als andere. Wie gehst du vor?
    a: |
      Ich messe nicht einzelne Dateien, sondern das Spiel. Ich schneide mindestens 30 Minuten aus repräsentativen Abschnitten mit und messe integrierte Lautheit und True Peak nach BS.1770. Als Bezug nenne ich die Empfehlung für die Plattform, etwa ASWG-R001 mit −24 LKFS für Heimkonsolen, und frage, ob wir uns daran halten wollen. Dann suche ich, wo die Lautheit herkommt: Musikbus, Effekte, Ducking, Limiter. Ich ändere eine Sache auf einmal und messe mit demselben Ablauf neu.
    tags: [lautheit, mischung]
    level: 2
  - id: lufs-statt-spitze
    module: export-im-spiel
    q: Warum gleichst du Klänge nach LUFS an und nicht nach dem Spitzenpegel?
    a: |
      Weil die Spitze wenig mit dem Eindruck zu tun hat. Ein Klick-Loop mit Spitze bei −7,1 dBFS maß −26,4 LUFS, ein Sinus mit Spitze bei −20 dBFS −20,0 LUFS: nach Spitze 13 dB lauter, nach Lautheit 6,4 LU leiser. LUFS nach BS.1770 messen die Energie mit Frequenzgewichtung und Gating. Für die Frage, ob etwas übersteuert, nehme ich True Peak, denn zwischen den Samples können höhere Werte entstehen.
    tags: [lautheit, messen]
    level: 2
  - id: mono-misst-anders
    module: export-im-spiel
    q: Eine Mono-Datei misst −23 LUFS, im Spielmitschnitt aber −20. Wer hat recht?
    a: |
      Beide. BS.1770 misst einen Kanal; ein `AudioStreamPlayer` spielt die Mono-Datei in Godot auf beiden Kanälen in voller Höhe, und zwei gleiche Kanäle messen 3 LU mehr. Deshalb messe ich Effekte so, wie sie im Spiel ankommen, oder gleiche den Unterschied beim Rendern aus; REAPER bietet dafür eine Mono-Korrektur um 3 dB. Für Klänge mit Ort gilt das nicht: Über `AudioStreamPlayer2D` in der Bildmitte maß dieselbe Datei −26,0 LUFS, 3 LU unter der Datei.
    tags: [lautheit, godot]
    level: 3
  - id: plugin-laeuft-nicht
    q: Ein Plugin, auf das du dich verlässt, läuft auf dem Rechner des Projekts nicht. Was tust du?
    a: |
      Ich trenne Werkzeug und Ergebnis. Pflichtschritte baue ich mit Bordmitteln, die überall laufen, in REAPER etwa ReaEQ, ReaComp oder ReaFIR. Was nur mit dem Plugin geht, rendere ich an einem Rechner, auf dem es läuft, und lege das Ergebnis mit Vermerk ins Projekt. Den offenen Stand schreibe ich auf, statt einen Abend mit einer Brücke zu verlieren, die nicht stabil ist.
    tags: [praxis, werkzeuge]
    level: 1
  - id: generierter-klang
    q: Ein Kollege schlägt vor, fehlende Klänge mit einem KI-Generator zu füllen. Was sagst du?
    a: |
      Für mein Projekt nein: Klänge, Musik und Mischentscheidungen sind meine Arbeit, und generiertes Material hat oft unklare Rechte. Als Platzhalter nehme ich einen eigenen Prüfklick, denn Platzhalter landen gern im Release. KI nutze ich für Technik, etwa ein Skript, das die Quellenliste prüft oder Dateien umbenennt.
    tags: [praxis, ki]
    level: 1
  - id: feedback-zum-klang
    q: Die Lead Designerin findet deinen Klang „zu viel“. Wie gehst du damit um?
    a: |
      Ich frage, woran sie es festmacht: zu laut, zu lang, zu oft, verdeckt er etwas? Dann übersetze ich das in eine Größe, die ich ändern kann, und biete zwei Fassungen an, die sich nur darin unterscheiden. Wir hören beide im Spiel, nicht im Editor. Wenn sie danach bei ihrer Einschätzung bleibt, gilt ihre Entscheidung für das Spiel, und ich notiere sie im Protokoll.
    tags: [praxis, zusammenarbeit]
    level: 1
