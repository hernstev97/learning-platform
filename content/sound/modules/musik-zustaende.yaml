id: musik-zustaende
title: "Musik für Zustände: horizontal, vertikal, Übergänge"
level: 2
minutes: 100
summary: Was ein Stück zusätzlich braucht, damit ein Spiel es umbauen kann – Abschnitte oder Schichten, Stinger, Übergänge mit Zeitpunkt, Ziel und Art, bewusst glatte oder harte Nähte und ein Zustandsdiagramm, das nicht flattert.
place: unterwegs
goals:
  - Du unterscheidest horizontale Neuordnung, vertikale Schichtung und Stinger und ordnest veröffentlichte Beispiele zu.
  - Du legst für einen Übergang Zeitpunkt, Ziel und Art fest und rechnest aus, wann ein Wechsel auf den nächsten Schlag oder Takt greift.
  - Du prüfst eine Naht an Metrum, Klangfarbe, Tonhöhe, Lautstärke und Abruptheit und entscheidest, ob sie glatt oder hart sein soll.
  - Du zeichnest ein Zustandsdiagramm mit Auslösern und spielst eine Folge von Ereignissen darin durch.
  - Du erkennst Flattern zwischen Zuständen und verhinderst es mit Hysterese oder Nachlauf.
