lesson: |
  Angenommen, ein Spiel hat ein Stück für die Erkundung und eins für den Kampf. Ein Gegner taucht auf, während das Erkundungsstück im dritten Takt steht. Soll die Musik sofort umschlagen, bis zur nächsten Eins warten oder erst ein kurzes Übergangsstück spielen? Und was passiert, wenn der Gegner zwei Sekunden später aus der Reichweite läuft und gleich darauf zurückkommt?

  Aus der Musik kennst du Stücke mit fester Form: Du entscheidest, wann die Strophe endet und der Refrain kommt. Im Spiel entscheidet das der Spieler, und niemand weiß vorher, wie lange er in einem Zustand bleibt. Bill Elm, einer der beiden Komponisten von Red Dead Redemption, sagt dazu: „you don't know how long you're going to be staying in that mood“ ([The Guardian, 2010](https://www.theguardian.com/technology/gamesblog/2010/may/26/red-dead-redemption-soundtrack)). Dieses Modul lehrt keine Komposition. Es zeigt, was ein Stück zusätzlich braucht, damit ein Spiel es umbauen kann: Abschnitte oder Schichten, Übergänge mit Zeitpunkt und Art, ein Zustandsdiagramm und eine Regel gegen Flattern. Welche Zustände dein Spiel hat und wie die Musik dort klingt, entscheidest du. Alle Zahlen in diesem Modul sind Platzhalter.

  ## Zwei Achsen: Abschnitte neu ordnen, Schichten stapeln

  Winifred Phillips, die für Sackboy: A Big Adventure komponiert hat, unterscheidet in ihrem Buch „A Composer's Guide to Game Music“ (MIT Press) zwei Grundtechniken. Bei der **horizontalen Neuordnung** (horizontal re-sequencing) besteht ein Stück aus Abschnitten, die das Spiel in wechselnder Reihenfolge abspielt. Die Abschnitte tragen Marken, an denen gewechselt werden darf, laut Phillips „on each individual beat, at the beginning of each measure, or at designated points in the composition“. Sie zitiert die Stelle selbst in einem Artikel zu ihrem GDC-Vortrag 2021 ([Horizontal Resequencing and Dynamic Transitions](https://www.gamedeveloper.com/audio/horizontal-resequencing-and-dynamic-transitions-for-game-music-composers-from-spyder-to-sackboy-gdc-2021-)).

  Bei der **vertikalen Schichtung** (vertical layering) laufen mehrere Dateien gleichzeitig und synchron, und das Spiel schaltet sie einzeln zu oder ab. Phillips grenzt das ausdrücklich von den Stems ab, die du aus der Produktion kennst. Mix-Stems klingen am Ende alle zusammen. Schichten im Spiel sind dagegen „not always meant to play simultaneously“ ([Pure Vertical Layering](https://www.gamedeveloper.com/game-platforms/pure-vertical-layering-for-game-music-composers-from-spyder-to-sackboy-gdc-2021-)). Jede Kombination, die das Spiel erzeugen kann, muss für sich tragen.

  | Spiel | Technik | Was wechselt |
  | --- | --- | --- |
  | Spyder | horizontal | 30+ Abschnitte, zufällig |
  | Sackboy, Bosskampf | horizontal | 3 Abschnitte, steigend |
  | Spyder, Bomber | vertikal | Schichten je Fortschritt |
  | Super Mario World | vertikal | Percussion auf Yoshi |
  | Sackboy, Walzer | beides | 7 Abschnitte, Chor-Schicht |

  Die Angaben zu Spyder und Sackboy stammen aus Phillips' Artikelreihe. In Spyder hat jedes Level über 30 Abschnitte in zufälliger Reihenfolge, damit niemand vorhersagt, was als Nächstes kommt, und die Wechsel sind hörbar. Im Sackboy-Bosskampf sollen die Wechsel dagegen verschwinden. Zu Super Mario World hat Koji Kondo auf der GDC 2007 gezeigt, wie Percussion-Spuren spielen oder schweigen, je nachdem, ob der Spieler auf Yoshi reitet ([Bericht von Vincent Diamante](https://www.gamedeveloper.com/game-platforms/gdc-koji-kondo-s-interactive-musical-landscapes)).

  Die beiden Achsen haben verschiedene Kosten. Horizontal zerlegt das Stück, und jede Stelle, an der zwei Abschnitte aufeinandertreffen, muss funktionieren. Vertikal bleibt das Stück ganz, laut Phillips „without needing to fragment the composition“, aber jede Schicht muss zu allen anderen passen, mit denen sie zusammen klingen kann.

  Die Musiktheoretikerin Elizabeth Medina-Gray nennt diese Stellen Nähte (seams) ([Analyzing Modular Smoothness](https://www.mtosmt.org/issues/mto.19.25.3/mto.19.25.3.medina.gray.html), Absatz 10). Eine Naht ist **sequenziell**, wenn das erste Modul ganz endet, bevor das nächste beginnt, und **simultan**, wenn beide sich überlappen. Vertikale Schichtung erzeugt immer simultane Nähte. Horizontale Neuordnung erzeugt beide Arten: Ein harter Wechsel mit Pause ist sequenziell, eine Kreuzblende simultan.

  ## Stinger: ein kurzer Einwurf

  Ein **Stinger** ist ein kurzes Musikstück, das ein Ereignis markiert. Meist liegt er über der laufenden Musik. Er kann sie auch kurz ersetzen und danach zu ihr zurückkehren; wie das in Godot geht, zeigt [Musik in Godot](/sound/godot-musik). Phillips beschreibt die Erfolgsmelodie von Sackboy: sechs Töne, die bei jedem eingesammelten Dreamer Orb erklingen, in jedem Level und jedem Musikstil. Sie liegt als eigene Schicht über dem Abschnitt, der gerade läuft, und fügt sich harmonisch ein ([Hybrid Horizontal-Vertical Structure](https://www.gamedeveloper.com/game-platforms/hybrid-horizontal-vertical-structure-for-game-music-composers-from-spyder-to-sackboy-gdc-2021-)).

  Für einen Stinger über der Musik heißt das: Er muss über allem klingen, was gerade laufen kann. Passt er nur zu einem Abschnitt, klingt er über den anderen falsch. Ersetzt er die Musik, braucht er stattdessen einen Rückweg, also eine Angabe, wo die Musik danach weiterläuft. Und jeder Stinger braucht einen Zeitpunkt. Sofort ausgelöst, sitzt er im Frame des Ereignisses, aber vielleicht neben dem Schlag. Auf den nächsten Schlag gelegt, sitzt er im Raster, kommt aber bis zu einem Schlag später.

  ## Übergänge: wann, wohin, wie

  Ein Übergang zwischen zwei Abschnitten oder Stücken braucht drei Entscheidungen.

  **Wann** der Wechsel greift: sofort, auf dem nächsten Schlag, auf dem nächsten Takt oder am Ende des laufenden Abschnitts.

  **Wohin** im Ziel: an den Anfang, an dieselbe Stelle (gleiche Position, sinnvoll bei zwei Fassungen desselben Stücks) oder dorthin, wo das Ziel zuletzt aufgehört hat.

  **Wie**: harter Schnitt, Aus- und Einblenden, Kreuzblende (Crossfade) oder über ein **Übergangsstück** (Filler oder Transition-Clip), ein kurzes eigenes Stück, das vom einen zum anderen führt.

  > [!MERKE]
  > Jeder Übergang hat einen Zeitpunkt, ein Ziel und eine Art. Schreib alle drei in deinen Plan, sonst entscheidet sie jemand beim Einbauen.

  Je später der Zeitpunkt, desto musikalischer der Wechsel und desto größer die Verzögerung. Wie groß, rechnest du aus Tempo und Taktart. Das Modell sucht für jede Anfrage die erste Schlag- und Taktgrenze danach; liegt eine Anfrage genau auf einer Grenze, nimmt es die folgende:

  ```python run
  import math

  BPM = 120   # Platzhalter
  TAKT = 4    # Schläge pro Takt
  schlag_s = 60 / BPM
  takt_s = TAKT * schlag_s


  def danach(t, raster):
      # erste Grenze nach t
      n = math.floor(t / raster)
      return (n + 1) * raster


  print("Anfrage: Schlag, Takt")
  for t in [0.3, 1.9, 2.05, 6.0]:
      s = danach(t, schlag_s)
      k = danach(t, takt_s)
      print(f"{t}: {s}, {k}")
  ```

  Bei 120 BPM im 4/4-Takt dauert ein Takt 2 Sekunden. Die Anfrage bei 2,05 s kommt knapp nach der Eins und wartet fast einen ganzen Takt, bis 4,0 s. Die Anfrage genau auf der Eins bei 6,0 s wartet einen ganzen Takt, bis 8,0 s; so verhielt sich Godot in der Messung mit einer Anfrage genau auf dem Schlag. Ein ganzer Takt sind bei 60 Physik-Frames pro Sekunde 120 Frames. Ein Trefferton gehört in den Frame, in dem der Treffer gemeldet wird ([Trefferfeedback](/combat/trefferfeedback)); ein Musikwechsel auf den nächsten Takt kann das nicht leisten. Was sofort ankommen muss, trägt deshalb oft ein Geräusch oder ein sofortiger Stinger, und die Musik folgt im Takt. Das ist eine Abwägung, keine Regel. Wie Godot den Zeitpunkt genau bestimmt, misst [Musik in Godot](/sound/godot-musik); dieses Modell ist nur die Rechnung.

  Ein veröffentlichtes Beispiel für einen sofortigen Wechsel: In The Legend of Zelda: The Wind Waker segelt Link vom offenen Meer zu seiner Heimatinsel Outset Island. Medina-Gray hat den Übergang durch wiederholtes Spielen rekonstruiert. Er kann an jeder Stelle der Meeresmusik greifen, die Meeresmusik blendet aus, die Inselmusik blendet ein und beginnt immer an ihrem Anfang, und dazwischen liegen mindestens 0,4 Sekunden Stille (Absatz 8). Weil sich die beiden Stücke nicht überlappen, müssen Tempo und Tonart nicht zueinander passen.

  ## Kontinuität: was eine Naht glatt oder hart macht

  Medina-Gray prüft jede Naht an fünf Merkmalen: Metrum (die zeitliche Ordnung der Schläge), Klangfarbe, Tonhöhe (vor allem die Tonklassen), Lautstärke und Abruptheit, also ob ein Modul mit eigenem Anfang und Ende einsetzt und aufhört oder abgeschnitten wird (Absatz 18). Eine Naht kann in einem Merkmal glatt und in einem anderen hart sein. Der Wind-Waker-Übergang ist glatt in der Blende und hart in der Klangfarbe: Die Kontrabässe streichen auf dem Meer und zupfen auf der Insel (Absatz 11 und 25).

  Hart ist nicht falsch. Medina-Gray zitiert den Komponisten Leonard Paul, nach dem „a good musical break between music segments“ dem Spieler zeigen kann, „that they have entered a new location or game state“ (Absatz 13). Entscheidend ist, dass du den Bruch willst. Was das für deine Dateien heißt, ohne Theorie:

  - **Metrum.** Sollen Abschnitte auf Schlag oder Takt wechseln, brauchen sie ein gemeinsames Raster oder einen Übergang, der das Tempo mitnimmt. Die Engine muss das Raster kennen. Dafür trägst du Tempo und Schläge beim Import ein ([Eigenes Stück aufbereiten](/sound/loops-stems)).
  - **Tonhöhe.** Alles, was übereinander liegen kann, also Schichten und Stinger, muss in jeder Kombination zusammen klingen. Bei Abschnitten zählt nur die Stelle, an der sie sich berühren.
  - **Klangfarbe und Lautstärke.** Jede Schicht, die dazukommt, verschiebt den Mix. Hör jede Kombination, auch die kleinen.
  - **Abruptheit.** Wird ein Abschnitt mitten im Takt verlassen, endet er nicht, er wird abgeschnitten. Blende oder Übergangsstück entscheiden, wie das klingt.

  Für Red Dead Redemption haben Bill Elm und Woody Jackson das Raster als feste Grenze gesetzt. Für einen nahtlosen Klang galt, so der Guardian: „the whole score is composed in A minor and at 130 beats per minute“. Elm beschreibt, was das Spiel verlangt hat: „If the player shoots someone, suddenly the music changes, so we have to think, 'okay, does this work over the top of that?'“ ([The Guardian, 2010](https://www.theguardian.com/technology/gamesblog/2010/may/26/red-dead-redemption-soundtrack)). Das war die Entscheidung dieses Projekts. Welche Grenzen du dir setzt und wo du bewusst brichst, legst du für dein Spiel selbst fest.

  > [!PRAXIS] Seit Jahrzehnten dieselben Mittel
  > Koji Kondo zeigte in seinem Vortrag „Painting an Interactive Musical Landscape“ (GDC 2007) Beispiele aus mehreren Spielen. In Super Mario World spielt eine Percussion-Spur nur, solange Mario auf Yoshi reitet. In Super Mario 64 wechselt die Besetzung zwischen Ufer, Wasser und Höhle. In Ocarina of Time setzt das Spiel die Musik der Hyrule-Steppe tagsüber aus zwölf Phrasen zufällig zusammen. Für Kondo beginnt das beim Rhythmus des Spiels: „If the music doesn't reflect the rhythm of the game, it becomes background music that might as well be piped in from any other room.“ Er spielt das Spiel deshalb beim Komponieren immer wieder ([Bericht von Vincent Diamante, Game Developer](https://www.gamedeveloper.com/game-platforms/gdc-koji-kondo-s-interactive-musical-landscapes)).

  ## Zustände planen: Diagramm, Auslöser, Hysterese

  Bevor du Musik für Zustände schreibst, zeichne die Zustände. Ein **Zustandsdiagramm** nennt jeden Zustand der Musik und jeden Übergang mit seinem **Auslöser**, dem Ereignis im Spiel, das ihn startet. Wie du Auslöser aus Animation, Kampf und Level ableitest, steht in [Vom Ereignis zur Cue-Liste](/sound/klangplan). Ein Lehrbeispiel, kein Vorschlag für dein Spiel:

  ```text
  RUHE  --gesehen-->   ALARM
  ALARM --verloren-->  RUHE
  ALARM --angriff-->   KAMPF
  KAMPF --frei 4 s-->  RUHE
  ```

  Jede Zeile ist ein Übergang: Zustand vorher, Auslöser, Zustand danach. „frei 4 s“ heißt: Vier Sekunden nach dem Ereignis `frei`, wenn kein Gegner mehr in Reichweite ist, wechselt die Musik, falls bis dahin nichts anderes passiert. Das ist ein Nachlauf (siehe unten). Ein Ereignis ohne Pfeil im aktuellen Zustand ändert nichts. Zu jedem Pfeil gehört ein Eintrag im Übergangsplan mit Zeitpunkt, Ziel und Art.

  ### Flattern und wie man es verhindert

  Steht der Spieler am Rand der Reichweite eines Gegners, wechselt das Signal „in Reichweite“ ständig. Folgt die Musik jedem Wechsel, springt sie im Sekundentakt zwischen zwei Stücken. Das heißt **Flattern**. Zwei Mittel helfen:

  - **Hysterese:** Für Ein- und Ausstieg gelten verschiedene Schwellen. Der Kampf beginnt unter 100 Pixeln Abstand und endet erst über 160 (Platzhalter). Dazwischen bleibt, was gerade gilt.
  - **Nachlauf:** Ein Zustand endet erst, wenn sein Signal eine Zeit lang ununterbrochen fehlt. Kommt es vorher zurück, beginnt die Wartezeit von vorn.

  Das Modell zeigt den Nachlauf an einem Signal mit einem Wert pro Sekunde. Der Kampf (`K`) beginnt sofort. Er endet erst, wenn die letzte Messung mit Gegner `nachlauf` Sekunden zurückliegt:

  ```python run
  # 1 = Gegner in Reichweite,
  # 0 = nicht; ein Wert pro Sekunde
  signal = [0, 0, 1, 0, 1, 1, 0,
            1, 0, 0, 0, 0, 0, 0]


  def musik(signal, nachlauf):
      zustand, seit = "-", 0
      zeile = ""
      for s in signal:
          if s:
              zustand, seit = "K", 0
          else:
              seit += 1
              if seit >= nachlauf:
                  zustand = "-"
          zeile += zustand
      return zeile


  print("1 s:", musik(signal, 1))
  print("4 s:", musik(signal, 4))
  ```

  Jedes Zeichen ist eine Sekunde. Mit einer Sekunde Nachlauf folgt die Musik dem Signal und wechselt sechsmal zwischen Sekunde 2 und 8. Mit vier Sekunden wechselt sie zweimal. Der Kampf endet dann bei Sekunde 11, vier Sekunden nach der letzten Messung mit Gegner bei Sekunde 7. Der Preis: Vier Sekunden lang läuft die Kampfmusik ohne Gefahr weiter.

  Valve arbeitet beim Tempo von Left 4 Dead mit ähnlichen Wartezeiten. Der AI Director hält nach der Spitze noch „3-5 seconds“ volle Bedrohung, beginnt die Ruhe erst, wenn sich im Kampf eine Pause ergibt, und hält sie dann „30-45 seconds“ ([Michael Booth, 2009, Folie 81](https://cdn.akamai.steamstatic.com/apps/valve/2009/ai_systems_of_l4d_mike_booth.pdf#page=81)). Wie der Level-Kurs diese Phasen nutzt, steht in [Rhythmus](/level-design/rhythmus). Dein Musikdiagramm kann ähnliche Wartezeiten nutzen. Wie lang sie sind, ist eine Entscheidung, die du im Spiel prüfst.

  > [!WARNING] Wartezeiten addieren sich
  > Nachlauf und Takt-Synchronisation zählen zusammen. Vier Sekunden Nachlauf plus Warten auf den nächsten Takt, bei 120 BPM im 4/4 bis zu 2 Sekunden, heißt: Die Ruhe beginnt bis zu 6 Sekunden nach der letzten Messung mit Gegner. Rechne beides zusammen, bevor du im Spiel urteilst.

  ## Was Godot dafür bereitstellt

  Godot 4.7 hat für beide Achsen eigene Streams. `AudioStreamInteractive` hält Clips und eine Übergangstabelle. `add_transition()` nimmt Clip vorher und nachher, Zeitpunkt, Ziel, Blende und ihre Länge in Schlägen und optional ein Übergangsstück ([add_transition](https://docs.godotengine.org/en/stable/classes/class_audiostreaminteractive.html#class-audiostreaminteractive-method-add-transition)). Die Zeitpunkte heißen dort `TRANSITION_FROM_TIME_IMMEDIATE`, `…_NEXT_BEAT`, `…_NEXT_BAR` und `…_END`. Die Ziele heißen `TRANSITION_TO_TIME_START`, `…_SAME_POSITION` und `…_PREVIOUS_POSITION`, die Blenden `FADE_DISABLED`, `FADE_IN`, `FADE_OUT`, `FADE_CROSS` und `FADE_AUTOMATIC`. Einen eigenen Stinger-Typ kennt die Klasse nicht.

  `AudioStreamSynchronized` spielt bis zu 32 Streams gleichzeitig, jeden mit eigener Lautstärke; das ist die vertikale Schichtung ([AudioStreamSynchronized](https://docs.godotengine.org/en/stable/classes/class_audiostreamsynchronized.html)). Damit Schlag und Takt stimmen, muss jeder Clip sein Tempo und seine Schläge kennen. Das trägst du beim Import ein ([Eigenes Stück aufbereiten](/sound/loops-stems)). Aufbau, Umschalten aus dem Spiel und gemessene Wechselzeiten stehen in [Musik in Godot](/sound/godot-musik).

  > [!INTERVIEW]
  > „Die Musik soll auf Kämpfe reagieren, die jederzeit beginnen und enden können. Wie gehst du vor?“ Gute Antwort, etwa als Composer oder Technical Sound Designer: Erst klären, was die Musik dem Spieler sagen soll und was Geräusche schon sagen. Dann die Zustände als Diagramm mit Auslösern, und für jeden Übergang Zeitpunkt, Ziel und Art. Ich nenne die Abwägung: Wechsel auf den Takt klingen musikalisch, kommen aber bis zu einem Takt später; was sofort ankommen muss, trägt ein Stinger oder ein Geräusch. Gegen Flattern setze ich Hysterese oder Nachlauf und rechne die Wartezeiten zusammen. Getestet wird mit einem Prüfloop und einem Log, das Anfrage und tatsächlichen Wechsel zeigt.

  ## Häufige Fehler

  - **Wechsel auf den Takt für dringende Information.** Bei 120 BPM im 4/4 kommt er bis zu 2 Sekunden zu spät. Leg die Information in ein Geräusch oder einen sofortigen Stinger.
  - **Schichten wie Mix-Stems geschrieben.** Allein oder in Teilkombinationen klingen sie leer oder schief. Hör jede Kombination, die das Spiel erzeugen kann.
  - **Stinger, der nur zu einem Abschnitt passt.** Über den anderen klingt er falsch.
  - **Gleiche Schwelle für Ein- und Ausstieg.** Die Musik flattert am Rand der Reichweite.
  - **Nachlauf und Takt nicht zusammengerechnet.** Die Ruhe kommt später, als du beim Testen erwartest.
  - **Raster nicht notiert.** Ohne Tempo und Schläge kann die Engine nicht auf Schlag oder Takt wechseln.
  - **Jede Naht geglättet.** Der Spieler merkt nicht, dass sich der Zustand geändert hat. Manchmal ist der hörbare Bruch die Information.

  ## Zusammenfassung

  - Horizontale Neuordnung spielt Abschnitte in wechselnder Reihenfolge, vertikale Schichtung schaltet synchrone Schichten zu und ab. Schichten im Spiel müssen in jeder Kombination tragen, anders als Mix-Stems.
  - Ein Stinger markiert ein Ereignis. Meist liegt er über der laufenden Musik und muss über allem klingen, was gerade laufen kann; ersetzt er sie kurz, braucht er einen Rückweg.
  - Jeder Übergang braucht Zeitpunkt (sofort, Schlag, Takt, Ende), Ziel (Anfang, gleiche oder letzte Position) und Art (Schnitt, Blende, Übergangsstück).
  - Ein Wechsel auf den nächsten Takt greift auf der ersten Taktgrenze nach der Anfrage. Er wartet bis zu einem Takt, bei 120 BPM im 4/4 bis zu 2 Sekunden oder 120 Frames.
  - Eine Naht ist sequenziell oder simultan und kann in Metrum, Klangfarbe, Tonhöhe, Lautstärke und Abruptheit glatt oder hart sein. Ein harter Bruch kann einen neuen Zustand anzeigen.
  - Ein Zustandsdiagramm nennt Zustände und Auslöser. Hysterese (zwei Schwellen) und Nachlauf (Ausstieg erst, wenn das Signal eine Zeit lang fehlt) verhindern Flattern und kosten Zeit.
  - In Godot heißen die Bausteine `AudioStreamInteractive` und `AudioStreamSynchronized`. Tempo und Schläge kommen aus dem Import.
exercises:
  - id: technik-zuordnen
    type: choice
    title: Abschnitt, Schicht oder Einwurf?
    prompt: |
      Welche Zuordnungen stimmen mit den Quellen der Lektion überein?
    options:
      - text: Super Mario World, Percussion nur auf Yoshi – vertikale Schichtung
        correct: true
        why: Kondo zeigte Percussion-Spuren, die über der Hintergrundmusik spielen oder schweigen. Das Stück läuft weiter, eine Schicht kommt dazu.
      - text: Spyder, über 30 Abschnitte je Level in zufälliger Reihenfolge – horizontale Neuordnung
        correct: true
        why: Das Spiel ordnet Abschnitte neu an. Phillips betont, dass die Wechsel dort hörbar sein dürfen.
      - text: Sackboys Erfolgsmelodie beim Dreamer Orb – horizontale Neuordnung
        correct: false
        why: Die Melodie ersetzt keinen Abschnitt. Sie liegt als eigene Schicht über dem Abschnitt, der gerade läuft, so wie ein Stinger.
      - text: Wind Waker, vom Meer zur Insel mit Blende und Pause – vertikale Schichtung
        correct: false
        why: Die Meeresmusik endet, bevor die Inselmusik beginnt. Das ist ein horizontaler Wechsel mit sequenzieller Naht.
    explanation: |
      Die Frage ist jedes Mal, was das Spiel umbaut. Ordnet es Abschnitte nacheinander an, ist es horizontal; schaltet es gleichzeitige Spuren zu oder ab, ist es vertikal. Ein Stinger, der wie Sackboys Erfolgsmelodie über der Musik liegt, wirkt wie eine kurze Schicht: von einem Ereignis ausgelöst, über allem anderen. Sackboys Walzer zeigt, dass ein Stück beides zugleich nutzen kann.
