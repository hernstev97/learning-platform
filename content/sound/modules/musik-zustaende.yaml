  - id: rdr-raster
    type: choice
    title: Eine Tonart, ein Tempo
    prompt: |
      Bill Elm und Woody Jackson schrieben die ganze Musik von Red Dead Redemption in a-Moll bei 130 BPM. Welchen Grund nennt der Guardian-Artikel?
    options:
      - text: Die Loops sollten ineinander übergehen und übereinander passen, wenn das Spiel die Musik wechselt.
        correct: true
        why: Der Artikel nennt als Grund „to ensure a seamless sound“. Elm beschreibt die Frage, ob eine Spur über einer anderen funktioniert, wenn der Spieler schießt.
      - text: Die Engine konnte nur ein Tempo abspielen.
        correct: false
        why: Davon steht nichts im Artikel. Die Grenze war eine Entscheidung der Komponisten, keine technische Vorgabe.
      - text: Western-Musik steht traditionell in a-Moll.
        correct: false
        why: Der Artikel begründet die Wahl nicht mit dem Genre, sondern mit den Übergängen zwischen den Loops.
      - text: So ließ sich schneller komponieren.
        correct: false
        why: Elm nennt die Grenze im Nachhinein befreiend, aber der Grund war, dass die Stücke nahtlos ineinandergreifen.
    explanation: |
      Ein gemeinsames Raster macht jede Naht im Metrum glatt und senkt das Risiko, dass zwei Schichten oder zwei Loops in der Tonhöhe kollidieren. Der Preis ist Spielraum. Elm sagt im Artikel, es habe sich zuerst wie das schwerste Problem angefühlt und sei dann befreiend gewesen. Das ist ein Projekt; ob du dir so eine Grenze setzt, ist deine Entscheidung.
    resources:
      - title: Keith Stuart · Redemption songs (The Guardian, 2010)
        url: https://www.theguardian.com/technology/gamesblog/2010/may/26/red-dead-redemption-soundtrack

  - id: uebergang-ablauf
    type: order
    title: Ein Wechsel auf die nächste Eins
    prompt: |
      Ein Übergang ist so geplant: Zeitpunkt „nächster Takt“, über ein Übergangsstück, das Ziel beginnt am Anfang. Bring die Schritte in die Reihenfolge, in der sie im Spiel passieren.
    lang: prose
    lines: |
      Im Spiel tritt der Auslöser ein, und das Zustandsdiagramm wechselt den Zustand.
      Die Musik bekommt die Anfrage, zum neuen Stück zu wechseln.
      Das laufende Stück spielt bis zur nächsten Taktgrenze weiter.
      An der Taktgrenze beginnt das Übergangsstück.
      Nach dem Übergangsstück beginnt das Ziel an seinem Anfang.
    explanation: |
      Der Zustand im Spiel wechselt sofort, die Musik folgt später. Zwischen Anfrage und Taktgrenze vergeht bis zu ein Takt, danach noch die Länge des Übergangsstücks. Diese Verzögerung ist der Preis für einen musikalischen Wechsel, und sie gehört in deinen Plan. Ein Log, das Anfrage und tatsächlichen Wechsel getrennt festhält, macht sie im Test sichtbar.
    resources:
      - title: Godot Docs · AudioStreamInteractive · add_transition
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreaminteractive.html#class-audiostreaminteractive-method-add-transition

  - id: naechster-takt-3-4
    type: output
    title: Wann greift der Wechsel?
    prompt: |
      Ein Stück im 3/4-Takt bei 90 BPM (Platzhalter). Die Anfrage kommt bei 5,3 s. Das Programm rechnet den nächsten Schlag, den nächsten Takt und die Wartezeit bis zum Takt aus. Was gibt es aus?
    lang: python
    code: |
      import math

      BPM = 90
      TAKT = 3
      schlag_s = 60 / BPM
      takt_s = TAKT * schlag_s
      anfrage = 5.3


      def danach(t, raster):
          # erste Grenze nach t
          n = math.floor(t / raster)
          return (n + 1) * raster


      schlag = danach(anfrage, schlag_s)
      takt = danach(anfrage, takt_s)
      print(f"{schlag:.2f}")
      print(f"{takt:.2f}")
      print(f"{takt - anfrage:.2f}")
    expected: |
      5.33
      6.00
      0.70
    hints:
      - Ein Schlag dauert 60 / 90 s, ein Takt drei Schläge, also 2 s.
    explanation: |
      Ein Schlag dauert zwei Drittel Sekunden, ein Takt genau 2 Sekunden. Die Schlaggrenzen liegen bei 4,67, 5,33 und 6,00 s, die Taktgrenzen bei 4, 6 und 8 s. Der nächste Schlag nach 5,3 s kommt also nach 0,03 s, der nächste Takt nach 0,70 s. Im 3/4-Takt bei 90 BPM ist ein Takt genauso lang wie im 4/4 bei 120 BPM; die längste Wartezeit ist in beiden Fällen 2 Sekunden.
    resources:
      - title: Godot Docs · AudioStreamInteractive, TRANSITION_FROM_TIME_NEXT_BAR
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreaminteractive.html#class-audiostreaminteractive-constant-transition-from-time-next-bar

  - id: hysterese-folge
    type: output
    title: Eine Schwelle oder zwei?
    prompt: |
      Der Abstand zum nächsten Gegner wird einmal pro Sekunde gemessen. `folge()` schreibt für jede Messung `K` für Kampfmusik und `-` für keine. Einmal gilt dieselbe Schwelle für Ein- und Ausstieg, einmal steigt die Musik erst über 160 Pixel aus. Was gibt das Programm aus?
    lang: python
    code: |
      abstand = [180, 120, 95, 110, 98,
                 130, 150, 165, 140]


      def folge(abstand, rein, raus):
          kampf, zeile = False, ""
          for a in abstand:
              if not kampf and a < rein:
                  kampf = True
              elif kampf and a > raus:
                  kampf = False
              if kampf:
                  zeile += "K"
              else:
                  zeile += "-"
          return zeile


      print(folge(abstand, 100, 100))
      print(folge(abstand, 100, 160))
    expected: |
      --K-K----
      --KKKKK--
    hints:
      - Geh die Liste Wert für Wert durch und merk dir, ob gerade Kampf ist.
      - Bei 140 am Ende ist der Kampf in beiden Fällen schon vorbei; 140 liegt nicht unter 100.
    explanation: |
      Mit einer Schwelle springt die Musik bei 95 hinein, bei 110 hinaus, bei 98 wieder hinein und bei 130 wieder hinaus: vier Wechsel in vier Sekunden. Mit Hysterese bleibt sie von 95 bis 150 im Kampf, weil kein Wert über 160 liegt, und steigt erst bei 165 aus: zwei Wechsel. Die Zone zwischen den Schwellen hält den aktuellen Zustand fest. Wie breit sie sein muss, hängt an Bewegung und Reichweite in deinem Spiel und ist ein Platzhalter, bis du es getestet hast.

  - id: zustand-durchspielen
    type: output
    title: Welcher Zustand gilt?
    prompt: |
      Das Lehrbeispiel aus der Lektion in Pfeil-Notation: Jede Zeile ist ein Übergang `vorher --Auslöser--> danach`. „frei 4 s“ heißt: Vier Sekunden nach dem Ereignis `frei` wechselt die Musik, wenn bis dahin nichts anderes passiert. Ein Ereignis ohne Pfeil im aktuellen Zustand ändert nichts. Die Musik beginnt in RUHE.

      Welcher Zustand gilt bei 3 s, 5,5 s, 8,5 s, 12 s und 14 s? Eine Zeile je Zeitpunkt.
    lang: ablauf
    code: |
      RUHE  --gesehen-->   ALARM
      ALARM --verloren-->  RUHE
      ALARM --angriff-->   KAMPF
      KAMPF --frei 4 s-->  RUHE

      Ereignisse:
      2 s   gesehen
      5 s   verloren
      6 s   gesehen
      7 s   angriff
      8 s   verloren
      9 s   frei
    expected: |
      ALARM
      RUHE
      KAMPF
      KAMPF
      RUHE
    hints:
      - Bei 8 s ist die Musik in KAMPF. Gibt es dort einen Pfeil für `verloren`?
      - "`frei` bei 9 s plus vier Sekunden."
    explanation: |
      Bei 2 s geht es nach ALARM, bei 5 s zurück nach RUHE, bei 6 s wieder nach ALARM und bei 7 s nach KAMPF. Das `verloren` bei 8 s hat in KAMPF keinen Pfeil und ändert nichts. Ab 9 s läuft der Nachlauf, bei 13 s wechselt die Musik nach RUHE; bei 12 s ist sie also noch in KAMPF, bei 14 s in RUHE. Ein Ereignis ohne Pfeil und ein laufender Nachlauf sind die Fälle, die ein Diagramm ausdrücklich festlegen muss. Steht dazu nichts darin, entscheidet sie jemand beim Einbauen.

  - id: begriffe
    type: gap
    title: Die Wörter für den Plan
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Spielt das Spiel Abschnitte in wechselnder Reihenfolge, heißt das horizontale ⟦Neuordnung⟧.
      Laufen mehrere Dateien synchron und werden einzeln zugeschaltet, heißt das vertikale ⟦Schichtung⟧.
      Ein kurzes Musikstück, das ein Ereignis markiert, heißt ⟦Stinger⟧.
      Verschiedene Schwellen für Ein- und Ausstieg nennt man ⟦Hysterese⟧.
      Endet das erste Modul, bevor das nächste beginnt, ist die Naht ⟦sequenziell⟧.
    gaps:
      - label: Horizontal
        hint: Englisch re-sequencing.
        accept: ["Umordnung", "Resequencing", "Re-Sequencing"]
      - label: Vertikal
        hint: Englisch layering.
        accept: ["Layering"]
      - label: Einwurf
        hint: Englischer Fachbegriff, wie ein Stich.
      - label: Zwei Schwellen
        hint: Begriff aus der Physik und der Regelungstechnik.
      - label: Naht ohne Überlappung
        hint: Das Gegenteil von simultan.
        accept: ["sequentiell"]
    explanation: |
      Mit diesen Wörtern lässt sich ein Musikplan knapp beschreiben, auch gegenüber einem Programmierer. Horizontal und vertikal sagen, was das Spiel umbaut, Stinger ein kurzes Stück für ein Ereignis, Hysterese eine Regel gegen Flattern. Sequenziell und simultan stammen von Medina-Gray und sagen, ob sich zwei Module an der Naht überlappen.
    resources:
      - title: Elizabeth Medina-Gray · Analyzing Modular Smoothness (MTO 25.3)
        url: https://www.mtosmt.org/issues/mto.19.25.3/mto.19.25.3.medina.gray.html

  - id: formel-takt
    type: gap
    title: Die Rechnung für den nächsten Takt
    prompt: |
      Ergänze das Modell: Ein Takt dauert so viele Sekunden, wie seine Schläge zusammen dauern, und der Wechsel liegt auf der ersten Taktgrenze nach der Anfrage `t`. `schlaege` sind die Schläge pro Takt.
    lang: python
    code: |
      import math


      def takt_nach(t, bpm, schlaege):
          takt_s = ⟦schlaege * 60 / bpm⟧
          n = ⟦math.floor⟧(t / takt_s)
          return (n + 1) * takt_s
    gaps:
      - label: Länge eines Takts
        hint: Ein Schlag dauert 60 / bpm Sekunden.
        accept: ["60 / bpm * schlaege", "schlaege * (60 / bpm)", "(60 / bpm) * schlaege", "60 * schlaege / bpm", "(schlaege * 60) / bpm", "schlaege / bpm * 60", "schlaege * 60.0 / bpm", "60.0 / bpm * schlaege", "schlaege / (bpm / 60)"]
      - label: Abrunden
        hint: Die Funktion aus `math`, die zur ganzen Zahl darunter rundet.
        accept: ["int"]
    explanation: |
      Die Anfrage geteilt durch die Taktlänge sagt, im wievielten Takt sie liegt, etwa 2,55. Abgerundet ist das die Nummer der letzten Taktgrenze bis zur Anfrage; plus eins ergibt die nächste, mal Taktlänge ihre Zeit. Liegt die Anfrage genau auf einer Grenze, kommt so die folgende heraus. Godot verhielt sich in der Messung bei einer Anfrage genau auf dem Schlag ebenso ([Musik in Godot](/sound/godot-musik)). `math.ceil` würde in diesem Fall die Grenze selbst liefern; ohne `+ 1` käme die Grenze vor der Anfrage heraus, ein Wechsel in der Vergangenheit. `int()` liefert für positive Zeiten dasselbe wie `math.floor`.
    resources:
      - title: Python Docs · math.floor
        url: https://docs.python.org/3/library/math.html#math.floor

  - id: plan-falsche-zeile
    type: bug
    title: Der Plan stimmt nicht mit dem Test
    prompt: |
      Du hast vor dem Test einen Übergangsplan gerechnet. Im Log stimmen drei Wechsel mit dem Plan überein. Bei einer Anfrage wechselt die Musik im Test erst bei 12,0 s. Finde die Zeile im Plan, die falsch gerechnet ist, und korrigiere sie.
    lang: text
    code: |
      Tempo 100 BPM, 4/4 (Platzhalter)
      Schlag 0,6 s, Takt 2,4 s
      Wechsel: nächster Takt
      Anfrage 3,0 s -> Takt bei 4,8 s
      Anfrage 5,0 s -> Takt bei 7,2 s
      Anfrage 9,7 s -> Takt bei 9,6 s
      Anfrage 12,1 s -> Takt bei 14,4 s
    lines: [6]
    fix:
      - line: 6
        answers:
          - Anfrage 9,7 s -> Takt bei 12,0 s
          - Anfrage 9,7 s -> Takt bei 12 s
          - Anfrage 9,7 s -> Takt bei 12.0 s
          - Anfrage 9.7 s -> Takt bei 12.0 s
          - Anfrage 9.7 s -> Takt bei 12 s
          - Anfrage 9.7 s -> Takt bei 12,0 s
    hints:
      - Die Taktgrenzen liegen bei 0; 2,4; 4,8; 7,2; 9,6; 12,0 und 14,4 s.
    explanation: |
      9,6 s liegt vor der Anfrage. Ein Wechsel kann nicht in der Vergangenheit greifen, der nächste Takt nach 9,7 s beginnt bei 12,0 s. Das ist der typische Fehler, die letzte Grenze vor der Anfrage zu nehmen statt der ersten danach. Die Anfrage kam 0,1 s nach der Eins und wartet deshalb fast einen ganzen Takt, 2,3 Sekunden. Plan und Log nebeneinander zu legen ist die schnellste Art, solche Rechenfehler zu finden, bevor du am Klang zweifelst.

  - id: flattern-regel
    type: bug
    title: Die Musik springt am Rand
    prompt: |
      Ein Lehrbeispiel. Steht der Spieler ungefähr 100 Pixel vom Gegner entfernt und bewegt sich ein wenig, springt die Musik mehrmals pro Sekunde zwischen RUHE und KAMPF. Der Kampf soll weiter sofort beginnen, wenn der Gegner näher als 100 Pixel kommt. Welche Regel änderst du?
    lang: text
    code: |
      RUHE  --abstand < 100-->  KAMPF
      KAMPF --abstand > 100-->  RUHE
      KAMPF --spieler tot-->    RUHE
    lines: [2]
    hints:
      - Die erste Regel soll bleiben, wie sie ist.
    explanation: |
      Ein- und Ausstieg hängen an derselben Schwelle. Jede kleine Bewegung über die 100-Pixel-Linie löst einen Wechsel aus. Die Ausstiegsregel braucht entweder eine höhere Schwelle, etwa `abstand > 160` (Hysterese), oder eine Zeit, etwa „abstand > 100 für 4 s“ (Nachlauf). Beides sind Platzhalter, deshalb gibt es hier keine einzige richtige Korrektur. Die dritte Regel ist ein eigener Auslöser und flattert nicht.

  - id: wind-waker-naht
    type: explain
    title: Vom Meer zur Insel
    prompt: |
      Medina-Gray hat diesen Übergang aus The Legend of Zelda: The Wind Waker durch wiederholtes Spielen rekonstruiert. Erkläre, warum er ohne Takt-Synchronisation auskommt, was die Pause bewirkt und in welchen Merkmalen die Naht glatt und in welchen hart ist.
    lang: text
    code: |
      Von:  Ocean (Schleife)
      Nach: Outset Island (Schleife)
      Auslöser: Insel ansteuern
      Zeitpunkt: an jeder Stelle
      Ziel: Anfang von Outset Island
      Art: Ocean blendet aus,
           Outset Island blendet ein,
           mind. 0,4 s Stille dazwischen
    points:
      - Die Naht ist sequenziell; die Stücke überlappen nicht, deshalb müssen Tempo und Tonart nicht zueinander passen.
      - Weil der Wechsel an jeder Stelle greifen darf, folgt die Musik dem Spieler ohne Wartezeit auf einen Takt.
      - Blende und Pause machen die Naht in der Abruptheit glatt; nichts wird hörbar abgeschnitten.
      - Die Klangfarbe wechselt hart (gestrichen gegen gezupft); der Bruch zeigt einen neuen Ort an.
      - Weil die Inselmusik immer am Anfang beginnt, hört der Spieler bei jeder Ankunft denselben Einstieg.
    explanation: |
      Der Übergang verzichtet auf Synchronisation, weil die beiden Stücke sich nie berühren: Die Meeresmusik ist ausgeblendet, bevor die Inselmusik beginnt, dazwischen liegt Stille. So kann das Spiel an jeder Stelle wechseln, und der Spieler wartet auf nichts. Die Blenden sorgen dafür, dass kein Stück mitten in einer Phrase abreißt. Die Klangfarbe dagegen bricht deutlich, die Bässe streichen auf dem Meer und zupfen auf der Insel. Das ist im Sinne von Leonard Paul ein Bruch, der einen neuen Ort ansagt. Und weil die Inselmusik immer an ihrem Anfang beginnt, wird ihr Einstieg zum Zeichen für die Ankunft.
    resources:
      - title: Elizabeth Medina-Gray · Analyzing Modular Smoothness (MTO 25.3), Absatz 8 und 11
        url: https://www.mtosmt.org/issues/mto.19.25.3/mto.19.25.3.medina.gray.html

  - id: hoerprotokoll-wechsel
    type: practice
    title: Drei Musikwechsel abhören
    prompt: |
      Spiel ein Spiel deiner Wahl mit Kopfhörern oder sieh dir einen Clip davon an, und warte auf drei Stellen, an denen die Musik wechselt. Notiere zu jedem Wechsel kurz: Auslöser, Zeitpunkt (sofort, Schlag, Takt, Ende), Art (Schnitt, Blende, Pause, Übergangsstück), horizontal oder vertikal, und ob die Naht glatt oder hart klingt. Ein Satz pro Wechsel reicht.
    lang: prose
    starter: |
      Spiel und Stelle:

      Wechsel 1:
      Wechsel 2:
      Wechsel 3:
    checklist:
      - Du hast Spiel und Stelle notiert, sodass du die Wechsel wiederfindest.
      - Zu jedem der drei Wechsel steht ein Auslöser im Spiel.
      - Zu jedem Wechsel steht ein Zeitpunkt aus den vier Kategorien oder „nicht erkennbar“.
      - Zu jedem Wechsel steht, ob ein Abschnitt wechselt oder eine Schicht dazukommt oder wegfällt.
      - Bei mindestens einem Wechsel hast du ein Merkmal genannt, in dem die Naht hart oder glatt ist (Metrum, Klangfarbe, Tonhöhe, Lautstärke, Abruptheit).
    explanation: |
      Das ist Medina-Grays Methode im Kleinen: hören, wiederholen, rekonstruieren, ohne Zugriff auf den Code. „Nicht erkennbar“ ist eine gültige Antwort; oft hörst du erst nach mehreren Wiederholungen, ob ein Wechsel auf den Takt wartet. Die Notizen sind Material für deine eigenen Entscheidungen, keine Vorlage zum Kopieren.
    resources:
      - title: Elizabeth Medina-Gray · Analyzing Modular Smoothness (MTO 25.3)
        url: https://www.mtosmt.org/issues/mto.19.25.3/mto.19.25.3.medina.gray.html

  - id: eigenes-diagramm
    type: practice
    title: Dein Zustandsdiagramm
    prompt: |
      Schreib ein Zustandsdiagramm für die Musik eines Abschnitts aus deinem eigenen Spiel in der Pfeil-Notation der Lektion, zwei bis vier Zustände. Ergänze zu jedem Pfeil Zeitpunkt, Ziel und Art des Übergangs und zu mindestens einem Ausstieg eine Regel gegen Flattern. Welche Zustände es gibt und wie sie klingen, entscheidest du; Zahlen sind Platzhalter.
    lang: prose
    starter: |
      Abschnitt:

      Zustände:

      Pfeile (vorher --Auslöser--> danach | Zeitpunkt | Ziel | Art):

      Regel gegen Flattern:
    checklist:
      - Das Diagramm hat zwei bis vier Zustände, und jeder ist von mindestens einem Pfeil erreichbar.
      - Jeder Pfeil nennt einen Auslöser, der im Spiel als Ereignis oder Messwert vorkommt.
      - Zu jedem Pfeil stehen Zeitpunkt, Ziel und Art.
      - Mindestens ein Ausstieg hat eine Hysterese oder einen Nachlauf mit Platzhalterwert.
      - Du hast für einen Pfeil die längste Wartezeit ausgerechnet, mit Takt und Nachlauf zusammen.
    explanation: |
      Das Diagramm ist der Vertrag zwischen deiner Musik und dem Code, der sie umschaltet. Ein Auslöser, den das Spiel nicht kennt, lässt sich nicht einbauen; ein Pfeil ohne Zeitpunkt wird beim Einbauen nach Gefühl entschieden. Die ausgerechnete Wartezeit sagt dir vorher, was du im Test hören solltest. Aufbereitet wird die Musik in [Eigenes Stück aufbereiten](/sound/loops-stems), eingebaut in [Musik in Godot](/sound/godot-musik).
    resources:
      - title: Michael Booth · The AI Systems of Left 4 Dead (Valve, 2009), Folie 81
        url: https://cdn.akamai.steamstatic.com/apps/valve/2009/ai_systems_of_l4d_mike_booth.pdf#page=81
