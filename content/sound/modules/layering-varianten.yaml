id: layering-varianten
title: "Layering und Varianten: ein Klang für eine eigene Aktion"
level: 2
minutes: 150
summary: Wie du einen Klang aus Schichten baust, ohne dass sie sich gegenseitig auslöschen, wie viele Varianten eine Aktion braucht, ob du sie vorab renderst oder Godot sie kombinieren lässt, und wie du das Ergebnis im Spiel blind gegen eine zweite Fassung prüfst.
place: pc
goals:
  - Du baust einen Klang aus Schichten in einem Folder-Track, richtest die Transienten aus und prüfst Versatz, Polarität und Summenpegel.
  - Du rechnest aus Häufigkeit und Variantenzahl aus, wie oft dieselbe Variante kommt, und begründest den Modus des `AudioStreamRandomizer` mit dem in Godot 4.7.2 gemessenen Verhalten.
  - Du wägst vorgerenderte Kombinationen gegen Schichten ab, die `AudioStreamSynchronized` zur Laufzeit kombiniert.
  - Du legst die Transiente auf das Kontaktbild einer selbst gewählten Aktion und rechnest Bildnummern in Frames und Samples um.
  - Du vergleichst zwei Fassungen im Spiel blind und liest aus der Trefferzahl, ob du sie unterscheiden kannst.
