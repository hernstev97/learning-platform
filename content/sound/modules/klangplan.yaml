  - id: vom-log-zur-zeile
    type: order
    title: Vom Log zur Zeile
    prompt: |
      Bring die Schritte in eine sinnvolle Reihenfolge, um aus dem Kampf-Log eine Zeile der Cue-Liste zu machen und sie zu prüfen.
    lang: prose
    lines: |
      Im Log den Frame suchen, in dem der Treffer gemeldet wird
      Die Bedingung notieren: nur bei Treffer, nicht bei jedem Schlag
      Typ, Länge, Priorität, Bus und Ort eintragen
      Aus der geschätzten Häufigkeit die Zahl der Varianten ableiten
      Ein Prüfmuster an den Auslöser hängen und den Status setzen
      Im Log prüfen, ob das Prüfmuster im erwarteten Frame spielt
    alternatives:
      - [1, 2, 4, 3, 5, 6]
    explanation: |
      Zuerst kommt der Auslöser, denn alles andere hängt daran, wann und unter welcher Bedingung der Klang spielt. Die beschreibenden Spalten und die Varianten kannst du in beliebiger Folge füllen. Danach testet ein Prüfmuster nur den Auslöser, noch ohne gestalteten Klang. Erst wenn es im erwarteten Frame spielt, lohnt sich die Arbeit am Klang.

  - id: hysterese
    type: choice
    title: Der Loop, der flattert
    prompt: |
      Ein Loop „Gegner nah“ startet und stoppt im Test fünfmal in zwei Sekunden. Der Gegner steht genau an der Grenze, ab der er als nah gilt. Welche Änderungen am Plan verhindern das? Mehrere Antworten richtig.
    options:
      - text: Der Wechsel zählt erst, wenn die Bedingung eine Zeit lang ununterbrochen gilt.
        correct: true
        why: Kurze Wechsel an der Grenze lösen dann nichts aus.
      - text: Zwei Schwellen, hinein bei einem kleineren Abstand als hinaus.
        correct: true
        why: Zwischen den Schwellen bleibt der alte Zustand. Ein Gegner, der an einer Grenze pendelt, überschreitet nicht beide.
      - text: Eine kürzere Loop-Datei.
        correct: false
        why: Die Länge der Datei ändert nichts daran, wie oft der Zustand wechselt.
      - text: Mehr Varianten für den Loop.
        correct: false
        why: Varianten ändern den Klang, nicht die Zahl der Starts und Stopps.
      - text: Ein kurzer Fade beim Stoppen.
        correct: false
        why: Der Fade macht jeden Stopp weicher, aber der Loop pumpt weiter im Rhythmus des Flatterns.
    explanation: |
      Das Problem liegt im Zustand, nicht im Klang. Zwei Schwellen heißen Hysterese; eine Wartezeit beim Ausstieg heißt Nachlauf. Beide folgen derselben Idee: Ein Zustand wechselt nicht beim ersten Anlass zurück. Für Musik ist das noch wichtiger, weil ein Wechsel dort oft an Takte gebunden ist; das vertieft [Musik für Zustände](/sound/musik-zustaende).

  - id: schritte-in-frames
    type: output
    title: In welchen Frames klingen die Schritte?
    prompt: |
      Ein Gehzyklus mit 8 Bildern bei 12 FPS, Kontaktbilder 1 und 5. Die Animation beginnt in Frame 240 und läuft durch. Das Programm sammelt die Frames der ersten vier Schritte. Was gibt es aus?
    lang: python
    code: |
      TICKS = 60
      BILD_FPS = 12
      BILDER = 8
      START = 240
      kontakte = [1, 5]
      schritte = []
      runde = 0
      while len(schritte) < 4:
          basis = runde * BILDER
          for bild in kontakte:
              i = basis + bild - 1
              f = i * TICKS // BILD_FPS
              schritte.append(START + f)
          runde += 1
      print(schritte)
    expected: |
      [240, 260, 280, 300]
    hints:
      - Ein Bild steht 60 / 12 = 5 Frames.
      - Bild 5 ist das fünfte Bild, also 4 Bilder nach Bild 1.
    explanation: |
      Ein Bild steht 5 Frames, Bild 5 kommt also 20 Frames nach Bild 1. Ein Zyklus dauert 8 × 5 = 40 Frames, danach beginnt Bild 1 wieder. So entstehen Schritte in 240, 260, 280 und 300: alle 20 Frames einer, drei pro Sekunde. Das ist die Zahl, aus der du die Varianten ableitest. Ändert sich das Tempo der Animation, ändern sich die Frames, die Bildnummern in der Cue-Liste bleiben.
    resources:
      - title: Godot Docs · SpriteFrames · get_animation_speed
        url: https://docs.godotengine.org/en/stable/classes/class_spriteframes.html#class-spriteframes-method-get-animation-speed

  - id: wiederholungen-pro-minute
    type: output
    title: Wie oft dieselbe Datei?
    prompt: |
      Ein Klang spielt 90-mal pro Minute. Bei jedem Abspielen wählt das Spiel zufällig und gleich verteilt eine von n Varianten, ohne Wiederholungen zu vermeiden. Das Programm gibt n, die Wahrscheinlichkeit einer direkten Wiederholung und die erwartete Zahl direkter Wiederholungen pro Minute aus. Was gibt es aus?
    lang: python
    code: |
      # Platzhalter: 90-mal pro Minute
      pro_min = 90
      for n in (1, 3, 6):
          p = round(1 / n, 2)
          wdh = round((pro_min - 1) / n)
          print(n, p, wdh)
    expected: |
      1 1.0 89
      3 0.33 30
      6 0.17 15
    hints:
      - 90 Abspielungen haben 89 Übergänge von einer zur nächsten.
    explanation: |
      Bei jedem der 89 Übergänge kommt dieselbe Datei mit der Wahrscheinlichkeit 1/n noch einmal. Mit drei Varianten sind das im Schnitt rund 30 direkte Wiederholungen pro Minute, mit sechs rund 15. Doppelt so viele Varianten halbieren die Wiederholungen, verschwinden lassen sie sie nicht. Das tut der Standardmodus von Godots `AudioStreamRandomizer`, `PLAYBACK_RANDOM_NO_REPEATS`, solange mindestens zwei Varianten da sind.
    resources:
      - title: Godot Docs · AudioStreamRandomizer, PLAYBACK_RANDOM_NO_REPEATS
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamrandomizer.html#class-audiostreamrandomizer-constant-playback-random-no-repeats

  - id: flattern-mit-mindestdauer
    type: output
    title: Welcher Zustand nach dem Hin und Her?
    prompt: |
      Notation: Jeder Zustand steht links, darunter seine Übergänge. Ein Übergang gilt erst, wenn seine Bedingung so viele Frames **ohne Unterbrechung** zutrifft, wie in Klammern steht. Jede Zeile unter „Ereignisse“ ändert ab diesem Frame, was gilt. Der Plan startet in `RUHE`. Gezählt wird so: Gilt eine Bedingung mit (30) ab Frame 10, wechselt der Plan in Frame 40.

      In welchem Zustand ist der Plan in Frame 250, und in welchem Frame hat er zuletzt gewechselt? Antworte wie `RUHE 0`.
    lang: ablauf
    code: |
      RUHE
        Gegner sichtbar (30)  -> ALARM
      ALARM
        kein Gegner (60)      -> RUHE

      Ereignisse
        100  Gegner sichtbar
        120  kein Gegner
        130  Gegner sichtbar
        170  kein Gegner
        200  Gegner sichtbar
        215  kein Gegner
    expected: ALARM 160
    accept: ["ALARM, 160", "Alarm 160", "alarm 160", "ALARM ab 160", "ALARM seit 160"]
    hints:
      - Von 100 bis 120 sind es nur 20 Frames.
      - Ab 130 ist der Gegner 40 Frames lang sichtbar.
      - Nach 170 und nach 215 müsste „kein Gegner“ 60 Frames halten.
    explanation: |
      Der erste Blick dauert nur 20 Frames, das reicht nicht. Ab 130 ist der Gegner ununterbrochen sichtbar, in Frame 160 sind die 30 Frames voll, und der Plan wechselt nach `ALARM`. „Kein Gegner“ ab 170 hält nur 30 Frames, dann ist er wieder sichtbar. Ab 215 müsste es bis 275 halten. In Frame 250 ist der Plan also noch in `ALARM`, seit Frame 160. Ohne Wartezeiten hätte er in diesem Abschnitt sechsmal gewechselt.
    resources:
      - title: Godot Docs · Idle and Physics Processing
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html

  - id: cue-karten-luecken
    type: gap
    title: Zwei Karteikarten ausfüllen
    prompt: |
      Ergänze die Karteikarten. Aus dem Log: Die Hitbox geht in Frame 20 an, der Treffer wird in Frame 21 gemeldet. Der Treffer-Ton soll von der Position des Dummys kommen. Das Bett der Halle läuft, solange die Figur in der Halle ist.
    lang: text
    code: |
      ID        sfx_dummy_treffer
      Auslöser  Treffer gemeldet,
                Log-Frame ⟦21⟧
      Typ       ⟦One-Shot⟧
      Ort       ⟦ja⟧, 2D am Dummy

      ID        amb_halle_bett
      Typ       ⟦Loop⟧
      Start     Halle betreten
      Stopp     Halle ⟦verlassen⟧
      Ort       nein
    gaps:
      - label: Frame
        hint: Der Ton gehört zur Treffermeldung, nicht zur Hitbox.
      - label: Typ Treffer
        hint: Spielt einmal ab und endet von selbst.
        accept: ["One-shot", "One shot", "One Shot", "one-shot", "one shot", "OneShot", "Oneshot", "oneshot", "OS"]
      - label: Ort Treffer
        hint: Hat der Klang eine Position im Raum?
        accept: ["Ja", "JA"]
      - label: Typ Bett
        hint: Läuft, bis ihn etwas stoppt.
        accept: ["loop", "LOOP"]
      - label: Stopp
        hint: Das Gegenstück zu „betreten“.
        accept: ["Verlassen", "verlässt", "Verlässt"]
    explanation: |
      Der Treffer-Ton hängt an Frame 21, weil erst dort feststeht, dass getroffen wurde. Er spielt einmal, also One-Shot, und kommt vom Dummy, also mit Ort. Das Bett ist ein Loop: Es soll so lange laufen, wie die Figur im Raum ist, und braucht deshalb Start und Stopp. Ohne Ort spielt es gleich laut, egal wo die Figur in der Halle steht. Ob dein Bett so funktionieren soll, ist eine Entscheidung; die Karte zwingt dich nur, sie hinzuschreiben.
    resources:
      - title: Godot Docs · AudioStreamPlayer2D
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer2d.html

  - id: dateinamen-luecken
    type: gap
    title: Namen nach dem Schema
    prompt: |
      Schreib die Dateinamen nach dem Platzhalter-Schema `<kategorie>_<objekt>_<aktion>_<nn>.wav`.
    lang: text
    code: |
      sfx, spieler, schritt, Variante 1
        ⟦sfx_spieler_schritt_01.wav⟧
      sfx, dummy, treffer, Variante 3
        ⟦sfx_dummy_treffer_03.wav⟧
      amb, halle, bett, Variante 1
        ⟦amb_halle_bett_01.wav⟧
    gaps:
      - label: Schritt
        hint: Zweistellig nummerieren.
      - label: Treffer
        hint: Variante 3 wird zu 03.
      - label: Bett
        hint: Kategorie zuerst.
    explanation: |
      Die Kategorie steht vorn, damit sich alle Klänge einer Art zusammen sortieren und Bus und Priorität teilen können. Die Nummer ist zweistellig, damit `_10` nach `_09` kommt und nicht vor `_2`. Kleinbuchstaben und Unterstriche statt Leerzeichen machen die Namen für Godot-Pfade und Skripte eindeutig. Das Schema ist ein Platzhalter; mit deinem eigenen funktioniert die Prüfung genauso.
    resources:
      - title: Universal Category System (UCS)
        url: https://universalcategorysystem.com/

  - id: treffer-frame-falsch
    type: bug
    title: Treffer ins Leere
    prompt: |
      Im Test hörst du den Treffer-Ton bei jedem Angriff, auch wenn der Dummy ausweicht oder außer Reichweite steht. Finde die Zeile der Karteikarte, die das verursacht, und korrigiere sie.
    lang: text
    code: |
      ID        sfx_dummy_treffer
      Auslöser  Spieler WINDUP -> ACTIVE
      Typ       One-Shot
      Varianten 3
      Priorität 1
      Ort       ja, 2D am Dummy
    lines: [2]
    fix:
      - line: 2
        answers:
          - Auslöser  Treffer gemeldet
          - Auslöser  Treffer gemeldet (Log-Frame 21)
          - Auslöser  Treffer gemeldet, Log-Frame 21
          - Auslöser  Treffer gemeldet (Frame 21)
          - Auslöser  Treffermeldung
          - Auslöser  Treffermeldung (Log-Frame 21)
          - Auslöser  Log-Frame 21
          - Auslöser  Frame 21
          - Auslöser  Dummy getroffen
          - Auslöser  Dummy getroffen (Log-Frame 21)
          - Auslöser  Dummy WAIT -> HITSTUN
          - Auslöser  Signal getroffen
    hints:
      - Die Karte in der Lektion nennt als Auslöser die Treffermeldung mit ihrem Log-Frame.
    explanation: |
      `WINDUP -> ACTIVE` ist der Frame, in dem die Hitbox angeht, im Log Frame 20. Er kommt bei jedem Angriff, ob er trifft oder nicht. Der Treffer-Ton gehört an die Treffermeldung, im Log Frame 21. Wer `Dummy WAIT -> HITSTUN` einträgt, trifft beim Dummy denselben Frame; die Treffermeldung bleibt der bessere Auslöser, weil sie auch kommt, wenn `interruptible` aus ist und der Gegner nicht in `HITSTUN` wechselt. Ein Ton für jeden Schlag kann trotzdem sinnvoll sein, dann ist er ein eigenes Ereignis mit eigener Zeile.
    resources:
      - title: Godot Docs · Area2D, Signal area_entered
        url: https://docs.godotengine.org/en/stable/classes/class_area2d.html#class-area2d-signal-area-entered

  - id: atmo-verstummt
    type: bug
    title: Nach 40 Sekunden still
    prompt: |
      Im Test ist das Bett der Halle beim Betreten zu hören. Nach etwa 40 Sekunden ist die Halle still, obwohl die Figur noch dort steht. Die Datei ist 40 Sekunden lang. Finde die Zeile, die nicht zum Plan passt, und korrigiere sie.
    lang: text
    code: |
      ID        amb_halle_bett
      Auslöser  Halle betreten
      Typ       One-Shot
      Länge     40 s
      Stopp     Halle verlassen
      Ort       nein
    lines: [3]
    fix:
      - line: 3
        answers:
          - Typ       Loop
          - Typ       loop
          - Typ       LOOP
    explanation: |
      Ein One-Shot spielt einmal und endet. Das Bett soll laufen, solange die Figur in der Halle ist, also ein Loop, der beim Verlassen stoppt. Die Zeile mit dem Stopp zeigt schon, dass ein Loop gemeint war; One-Shots brauchen keinen Stopp. In Godot entscheidet bei WAV-Dateien der Loop-Modus im Import-Dock darüber, ob die Datei wiederholt wird ([Audio zuordnen](/godot/audio)).
    resources:
      - title: Godot Docs · Importing audio samples, Loop Mode
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#edit-loop-mode

  - id: telegraph-karte-erklaeren
    type: explain
    title: Warum diese Karte so aussieht
    prompt: |
      Erkläre die Entscheidungen auf dieser Karteikarte: Warum dieser Auslöser, warum nur eine Variante, warum Priorität 1 und ein Ort? Die Werte sind Platzhalter, es geht um die Begründung.
    lang: text
    code: |
      ID        sfx_dummy_telegraph
      Auslöser  Dummy WAIT -> TELEGRAPH
      Typ       One-Shot
      Varianten 1
      Priorität 1
      Ort       ja, 2D am Dummy
      Status    Prüfmuster
    points:
      - Der Auslöser ist der Zustandswechsel in den Telegraph; der Klang wandert mit, wenn sich die Wartezeit ändert.
      - Eine einzige Variante macht die Warnung erkennbar und lernbar.
      - Priorität 1, weil der Spieler auf diese Warnung reagieren muss.
      - Der Ort sagt, welcher Gegner angreift, auch am Bildrand.
      - Das Prüfmuster testet den Auslöser, bevor es einen gestalteten Klang gibt.
    explanation: |
      Die Karte plant eine Warnung. Ihr Auslöser ist der Eintritt in den Telegraph, kein fester Zeitpunkt; ändert sich die Wartezeit des Gegners, kommt die Warnung trotzdem rechtzeitig. Eine einzige Variante folgt der Idee aus Overwatch und For Honor: Was der Spieler lernen soll, bleibt gleich. Priorität 1 heißt, dass die Warnung in dichten Momenten nicht untergehen darf, und der Ort zeigt, woher der Angriff kommt. Solange der Status „Prüfmuster“ heißt, spielt dort nur ein Klick, mit dem du den Frame im Log prüfst.
    resources:
      - title: Wwise Tour 2016 · Overwatch (6 of 7) – Pavlovian Response
        url: https://www.youtube.com/watch?v=ojlqmkoLvHg
      - title: Khris Brown · Audio Choreography for Battle Design (GDC 2017)
        url: https://www.youtube.com/watch?v=q6Vs3d6CrUc

  - id: eigene-cue-liste
    type: practice
    title: Eine Cue-Liste für eine eigene Aktion
    prompt: |
      Wähl eine Aktion aus deinem Spiel oder einer Testszene, etwa einen Angriff, eine Ausweichrolle oder ein Einsammeln. Welche, entscheidest du. Schreib für sie drei bis sechs Zeilen der Cue-Liste als kurze Karteikarten, mit Auslöser, Typ, Varianten, Priorität, Bus und Ort. Notier zu den Varianten einen Satz Begründung.
    lang: prose
    checklist:
      - Du hast notiert, welche Aktion die Liste abdeckt und woher die Auslöser stammen, etwa aus einer Animationsliste oder einem Log.
      - Jede Zeile ist ein Ereignis mit eigenem Auslöser als Bild, Frame, Signal oder Zustandswechsel, keiner in Millisekunden.
      - Jeder Loop hat einen Start und für jeden Ausgang seines Zustands einen Stopp.
      - Zu den Varianten steht eine Begründung aus Häufigkeit oder Aufgabe.
      - Jede ID folgt einem Benennungsschema, das du vorher aufgeschrieben hast.
      - Der Status jeder Zeile ist „geplant“ oder „Prüfmuster“.
    hints:
      - Fang mit dem Ereignis an, das der Spieler auf keinen Fall verpassen darf.
    explanation: |
      Die kurze Liste ist der Anfang einer längeren. Sie zeigt dir, welche Klänge eine Aktion braucht und welche Fragen du noch nicht beantworten kannst, etwa die Länge, solange die Animation nicht fertig ist. Am PC setzt du für jede Zeile ein Prüfmuster ein und prüfst den Frame im Log. Die Klänge selbst baust du in [REAPER als Werkbank](/sound/reaper-werkbank) und [Layering und Varianten](/sound/layering-varianten).
    resources:
      - title: Godot Docs · AnimatedSprite2D, Signal frame_changed
        url: https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-signal-frame-changed
