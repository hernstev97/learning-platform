id: klangplan
title: Vom Ereignis zur Cue-Liste
level: 1
minutes: 100
summary: Wie aus Ton-Bildern der Animation, dem Treffer-Frame im Kampf und den Orten eines Levels eine Cue-Liste wird – jedes Klangereignis mit Auslöser, Typ, Länge, Varianten, Priorität, Bus, Ort, Status und Quelle –, warum Bildnummern und Frames statt Millisekunden zählen und wie ein Zustandsdiagramm Klänge plant, die von Zuständen abhängen.
place: unterwegs
goals:
  - Du sammelst Klangereignisse aus Animationsliste, Kampf-Log und Level-Plan und schreibst je Ereignis eine Zeile der Cue-Liste mit festen Spalten.
  - Du rechnest zwischen Sprite-Bildern, Frames, Millisekunden und Samples um und begründest, warum der Auslöser als Bild oder Frame notiert wird.
  - Du schätzt, wie oft ein Klang pro Minute spielt, und leitest daraus die Zahl der Varianten ab – oder begründest, warum ein Signal bewusst gleich bleibt.
  - Du notierst Zustände und Übergänge als Zustandsdiagramm in Textform, leitest Start und Stopp von Loops daraus ab und erkennst, wo ein Wechsel flattern kann.
  - Du legst ein Benennungsschema als Platzhalter fest und prüfst Dateinamen dagegen.
