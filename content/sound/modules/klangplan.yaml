lesson: |
  Im Log der Combat-Testszene trifft der Angriff den Dummy in Frame 21. Im Prüfprotokoll des Animationskurses steht in der Zeile „Ton-Bilder“ eine 3 für den Aufprall. Im Level-Design-Kurs steht neben den Hinweisen der Satz „Auch Klang kann ein Hinweis sein“. Drei Kurse haben dir Stellen hinterlassen, an die ein Klang gehört. Keine sagt, wie lang er ist, wie oft er spielt, wie viele Varianten er braucht und über welchen Bus er läuft. Die Liste, die das festhält, heißt in diesem Kurs **Cue-Liste**: eine Zeile pro Klangereignis.

  Aus der Musik kennst du Spurlisten, Arrangements und Session-Notizen. Ein Stück hat eine Zeitleiste, auf der jeder Klang seinen Platz hat. Ein Spiel hat keine. Klänge starten, wenn etwas passiert, so oft es passiert, und zusammen mit allem anderen, was gerade passiert. Die Cue-Liste ersetzt die Zeitleiste: Sie sagt nicht, wann ein Klang spielt, sondern wodurch.

  Alle Werte in diesem Modul sind Platzhalter, die Beispiele stammen aus den Testszenen der anderen Kurse. Welche Klänge dein Spiel bekommt, entscheidest du. Das Modul zeigt, wie du sie notierst, damit du sie bauen, testen und wiederfinden kannst.

  ## Woher die Ereignisse kommen: Animation, Kampf, Level

  Ein **Ereignis** ist ein Moment im Spiel, an dem ein Klang beginnt oder endet. Der **Auslöser** ist das, was das Spiel in diesem Moment meldet: ein Bild der Animation, ein Signal, ein Zustandswechsel. Drei Quellen liefern dir Ereignisse.

  **Animation.** Der Animationskurs markiert Ton-Bilder als Bildnummern, etwa die Kontaktbilder 1 und 5 in einem Gehzyklus mit acht Bildern. Im Prüfprotokoll steht für eine Aktion „Ton-Bilder 3 (Aufprall)“ ([In der Testszene prüfen](/animation/testszene)). In [Animation im Spiel](/animation/animation-im-spiel) hieß es: „Wie die Töne klingen, wie laut sie sind und wie sie sich abwechseln, behandelt später der Kurs Sound.“ Hier beginnt das.

  **Kampf.** Das echte Log der Combat-Testszene mit einem Treffer:

  ```text
   12  Spieler MOVE -> WINDUP
   20  Spieler WINDUP -> ACTIVE
   21  Dummy getroffen: Zone body …
   21  Dummy WAIT -> HITSTUN
   27  Spieler ACTIVE -> RECOVERY
  ```

  Zwei Frames liegen nah beieinander. In Frame 20 geht die Hitbox an, in Frame 21 meldet das Spiel den Treffer. Der Treffer-Ton gehört in Frame 21. Hängt er an Frame 20, klingt auch ein Schlag ins Leere wie ein Treffer ([Trefferfeedback](/combat/trefferfeedback)). Ein Ton, der zu jedem Schlag gehört, ob er trifft oder nicht, ist ein eigenes Ereignis mit eigenem Auslöser. Auch der Gegner liefert Ereignisse. Der Trainingsgegner wechselt im Log mit `10  Dummy WAIT -> TELEGRAPH` in die Ankündigung seines Angriffs ([Testszene: Ausweichen](/combat/testszene-ausweichen)). Ein Klang an dieser Stelle wäre eine Warnung.

  **Level.** Orte und Hinweise liefern Ereignisse ohne Bildnummer: ein Raum, den man betritt, eine Klangmarke an einem Ort, ein Hinweis, der hörbar sein soll ([Ausgestaltung](/level-design/ausgestaltung)). Ihre Auslöser sind Flächen und Zustände, keine Frames. Was eine Klangmarke ist, steht in [Kritisch hören](/sound/hoeren-analysieren).

  Eine Zeile der Cue-Liste ist ein Ereignis, keine Datei. Hinter einem Ereignis können mehrere Dateien stehen, als Varianten oder als Schichten. Overwatch hatte Mitte 2016 rund 5.400 Klänge im Spiel mit im Schnitt etwa 11 Audiodateien, und eine einzelne Schrittdatei wurde von rund 150 Klängen benutzt ([Wwise Tour 2016, Teil 1](https://www.youtube.com/watch?v=fGDOgn2WXLs), ab etwa 20:23 und 21:43). Die Cue-Liste plant die Ereignisse; welche Dateien sie brauchen, folgt aus den Spalten.

  ## Eine Zeile der Cue-Liste: zehn Spalten

  Jede Zeile beantwortet dieselben Fragen. Am Handy schreibst du eine Zeile am besten als Karteikarte, eine Spalte pro Zeile:

  ```text
  ID        sfx_dummy_treffer
  Auslöser  Treffer gemeldet
            (Log-Frame 21)
  Typ       One-Shot
  Länge     max. 15 Frames
  Varianten 3
  Priorität 1
  Bus       SFX
  Ort       ja, 2D am Dummy
  Status    Prüfmuster
  Quelle    eigene Aufnahme
  ```

  Die Werte sind Platzhalter. Warum jede Spalte da ist:

  - **ID**: der Name nach deinem Benennungsschema. Er verbindet Liste, Dateien und Code.
  - **Auslöser**: Signal, Bild oder Frame, dazu die Bedingung, etwa „nur bei Treffer“. Ohne Bedingung spielt der Klang auch dann, wenn er nichts bedeutet.
  - **Typ**: Ein **One-Shot** spielt einmal ab und endet von selbst. Ein **Loop** wiederholt sich, bis ihn etwas stoppt, und braucht deshalb einen Start- und einen Stopp-Auslöser.
  - **Länge**: die längste Dauer, die die Aktion verträgt, in Frames. Ein Klang, der in die nächste Aktion ragt, verdeckt deren Ton. Wie du Länge und Hüllkurve formst, steht in [Klangformung](/sound/klangformung).
  - **Varianten**: wie viele verschiedene Aufnahmen. Die Zahl folgt aus der Häufigkeit, dazu gleich mehr.
  - **Priorität**: 1 darf der Spieler nicht verpassen, 3 ist Hintergrund, wie im Hörprotokoll. Was daraus im Mix wird, steht in [Mischung](/sound/mischung-stille).
  - **Bus**: über welchen Bus der Klang läuft. Godot findet den Bus über seinen Namen; ein Player mit falsch geschriebenem Namen landet ohne Meldung auf `Master` ([Audio zuordnen](/godot/audio)).
  - **Ort**: ob der Klang eine Position im Raum hat. Mit Ort spielt ihn ein `AudioStreamPlayer2D`, ohne Ort ein `AudioStreamPlayer` (ebenda).
  - **Status**: geplant, Prüfmuster, aufgenommen, im Spiel, geprüft. So siehst du, was fehlt.
  - **Quelle**: eigene Aufnahme oder fremdes Material mit Lizenz, siehe [Quellen und Lizenzen](/sound/quellen-lizenzen).

  Besteht ein Klang aus Schichten, schreib sie mit ihrer Rolle in die Zeile, etwa „Schichten: Transiente, Körper“. Wie man sie baut, zeigen [Klangformung](/sound/klangformung) und [Layering und Varianten](/sound/layering-varianten).

  Für den Überblick reicht dann eine schmale Liste. Ein Beispiel für die Testszenen, OS heißt One-Shot:

  ```text
  ID                   Typ  Var
  sfx_spieler_schritt  OS   4
  sfx_spieler_schwung  OS   3
  sfx_dummy_treffer    OS   3
  sfx_dummy_telegraph  OS   1
  amb_halle_bett       Loop 1
  ```

  Am PC führst du die Liste als Tabelle oder CSV-Datei mit allen zehn Spalten. Eine Zeile pro Ereignis, eine Spalte pro Frage: So kannst du filtern, etwa nach allem mit Status „geplant“ oder allem auf einem Bus.

  > [!PRAXIS] Nach Art ordnen, nicht nach Figur
  > Das Overwatch-Team ordnete seine Klänge zuerst nach Helden, alle Klänge einer Figur in einem Ordner. Das erzeugte ständig Fehler: falscher Bus, falsche Priorität, weil jemand es eilig hatte. Wer die Priorität aller Schritte ändern wollte, musste an Hunderte Stellen. Danach ordnete das Team nach Art des Klangs, etwa Fähigkeiten der eigenen Figur getrennt von denen anderer Spieler, und setzte Bus, Hall und Priorität einmal pro Art ([Teil 1](https://www.youtube.com/watch?v=fGDOgn2WXLs), ab etwa 8:02 und 9:31). In deiner Cue-Liste ist das die Kategorie am Anfang der ID: Klänge derselben Kategorie teilen Bus und Priorität, bis du bewusst abweichst.

  ## Bildnummern und Frames statt Millisekunden

  In diesem Kurs heißt ein Bild der Sprite-Animation **Bild** und ein Schritt der Spiellogik **Frame** (im Animationskurs Tick). Godot rechnet die Physik standardmäßig mit 60 Frames pro Sekunde (`physics/common/physics_ticks_per_second`, in Godot 4.7.2 per Skript geprüft: 60, [ProjectSettings](https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-physics-common-physics-ticks-per-second)). Eine Animation hat ihr eigenes Tempo in Bildern pro Sekunde; eine neue Animation in einer `SpriteFrames`-Ressource startet mit 5 FPS. Bei 12 FPS steht ein Bild 5 Frames lang.

  Für Audio kommt eine dritte Einheit hinzu: Samples. Bei 48 kHz sind ein Frame 800 Samples, bei 44,1 kHz 735. Welche Abtastrate dein Projekt hat, legst du in [REAPER als Werkbank](/sound/reaper-werkbank) fest. Das Programm rechnet die Ton-Bilder einer Animation in alle drei Einheiten um:

  ```python run
  TICKS = 60     # Godot: Frames/s
  BILD_FPS = 12  # Platzhalter
  RATE = 48000   # Platzhalter: Hz
  START = 100    # Frame von Bild 1

  print("Bild Frame ms Samples")
  for bild in (1, 3, 5):
      i = bild - 1
      f = i * TICKS // BILD_FPS
      ms = round(f * 1000 / TICKS)
      smp = f * RATE // TICKS
      frame = START + f
      print(bild, frame, ms, smp)
  ```

  Warum steht der Auslöser trotzdem als Bild oder Frame in der Liste und nicht in Millisekunden? Weil sich Timing ändert. Wird die Animation schneller, wandert der Ton mit seinem Bild; eine Millisekundenangabe bliebe an der alten Stelle stehen. Dasselbe gilt für Kampfwerte: Verlängert sich der Wind-up um zwei Frames, verschiebt sich der Treffer, und der Ton folgt dem Signal, nicht der Uhr. Millisekunden brauchst du nur, um zu prüfen, ob eine Datei in ihr Zeitfenster passt.

  Zwei Grenzen. Passt das Tempo nicht glatt in 60, etwa bei 8 FPS mit 7,5 Frames pro Bild, steht ein Bild mal 7, mal 8 Frames ([Timing und Spacing](/animation/timing-spacing)). Und jede Millisekunde Stille vor der Transiente der Datei ist eine Millisekunde Verzögerung im Spiel ([Audio zuordnen](/godot/audio)). Der Auslöser kann stimmen, und der Klang kommt trotzdem zu spät.

  > [!MERKE]
  > Ein Ereignis, eine Zeile. Den Auslöser notierst du als Bild, Frame oder Signal, nie als Millisekunde.

  ## Häufigkeit und Varianten

  Wie viele Varianten ein Klang braucht, beginnt mit einer Zählung. Ein Gehzyklus mit acht Bildern bei 12 FPS dauert 40 Frames und hat zwei Kontaktbilder. Das sind drei Schritte pro Sekunde, 180 pro Minute. Ein Treffer-Ton spielt so oft, wie der Spieler trifft, eine Ankündigung so oft, wie ein Gegner angreift.

  Wählt das Spiel bei jedem Abspielen zufällig eine von n Varianten, kommt dieselbe Datei mit der Wahrscheinlichkeit 1/n direkt noch einmal. Bei 180 Schritten pro Minute:

  ```python run
  pro_minute = 180  # 3 pro Sekunde
  print("Varianten Wiederholungen")
  for n in (1, 2, 4, 8):
      gleich = (pro_minute - 1) / n
      print(n, round(gleich))
  ```

  Mit einer Datei wiederholt sich jeder Schritt; das klingt wie ein Maschinengewehr aus identischen Klicks. Mit vier sind es im Schnitt immer noch rund 45 direkte Wiederholungen pro Minute. Godots `AudioStreamRandomizer` steht standardmäßig auf `PLAYBACK_RANDOM_NO_REPEATS` (in Godot 4.7.2 per Skript geprüft). Laut Doku wählt er dann zufällig, soll aber „avoid playing the same stream twice in a row whenever possible“ ([playback_mode](https://docs.godotengine.org/en/stable/classes/class_audiostreamrandomizer.html#class-audiostreamrandomizer-property-playback-mode)). Wie du ihn einrichtest, steht in [Audio zuordnen](/godot/audio). Wie du Varianten aufnimmst und angleichst, in [Layering und Varianten](/sound/layering-varianten).

  Mehr Varianten sind nicht immer besser. Khris Brown beschreibt, wie Kampfstimmen früher als „variety pack“ aufgenommen wurden: viele verschiedene Laute für eine Aktion, aus denen das Spiel zufällig wählt, damit das Ohr nicht ermüdet und auch wegen Speichergrenzen ([GDC 2017](https://www.youtube.com/watch?v=q6Vs3d6CrUc), ab etwa 6:46). Für For Honor nahm sie stattdessen kleine, gleichbleibende Laute auf, die genau zu einer Bewegung gehören. Spieler lernten daran die Züge (ab etwa 8:12). Kleine Unterschiede blieben trotzdem, weil eine Stimme nie zweimal genau gleich klingt, und laut Brown ermüdeten die Laute deshalb das Ohr nicht (ab etwa 12:03). Das Overwatch-Team ging bei den stärksten Fähigkeiten ähnlich vor. Tomas Neumann: „the less variation actually meant that learning happened earlier“ ([Teil 6](https://www.youtube.com/watch?v=ojlqmkoLvHg), ab etwa 1:36).

  Die Spalte Varianten hat also zwei Richtungen. Häufige Klänge ohne besondere Bedeutung, etwa Schritte, brauchen Abwechslung. Signale, die der Spieler lernen soll, bleiben erkennbar gleich, mit wenig oder kleiner Abweichung. Welche Klänge in deinem Spiel welche Richtung bekommen, entscheidest du; notier in der Liste den Grund.

  ## Zustände: Klänge, die an einem Zustand hängen

  Manche Klänge hängen nicht an einem Moment, sondern an einem Zustand: ein Bett, solange die Figur in einem Raum ist, ein Loop, solange ein Gegner ausholt, Musik, solange gekämpft wird. Für sie brauchst du ein **Zustandsdiagramm**: Zustände und die Übergänge zwischen ihnen. Am Handy reicht Text. Der Trainingsgegner der Combat-Testszene, nach seinem Code:

  ```text
  WAIT
    Wartezeit um    -> TELEGRAPH
  TELEGRAPH
    Wind-up um      -> ACTIVE
  ACTIVE
    Aktiv-Frames um -> RECOVERY
  RECOVERY
    Erholung um     -> WAIT
  HITSTUN
    Hitstun um      -> WAIT
  aus jedem Zustand
    getroffen       -> HITSTUN
  ```

  Die letzte Zeile gilt, solange `interruptible` an ist, und das ist im Code der Standard: `take_hit()` schickt den Gegner aus jedem Zustand in `HITSTUN`. Jeder Übergang ist ein möglicher Auslöser. Der Eintritt in `TELEGRAPH` kann einen One-Shot starten. Ein Loop, der den ganzen Telegraph tragen soll, braucht einen Start beim Eintritt und einen Stopp an **jedem** Ausgang. Der Telegraph hat zwei: nach `ACTIVE`, wenn der Wind-up um ist, und nach `HITSTUN`, wenn der Gegner vorher getroffen wird. Der zweite steht nicht unter `TELEGRAPH`, sondern unten bei „aus jedem Zustand“. Das Diagramm zeigt dir alle Ausgänge auf einen Blick, die Liste allein nicht.

  > [!WARNING] Der Loop, der nie aufhört
  > Ein Loop ohne Stopp an einem Ausgang läuft weiter, wenn das Spiel diesen Weg nimmt. Meist fällt das erst im Test auf, beim seltenen Weg. Geh für jeden Loop alle Ausgänge seines Zustands durch und trag den Stopp in die Zeile ein.

  Bei Zuständen, die von Spielwerten abhängen, kann ein Wechsel **flattern**. Steht ein Gegner genau an der Grenze, ab der er als nah gilt, wechselt der Zustand in jedem Frame hin und her, und ein Loop startet und stoppt immer wieder. Dagegen helfen zwei Mittel. Erstens eine Wartezeit: Der Wechsel zählt erst, wenn seine Bedingung eine Zeit lang ununterbrochen gilt. Beim Ausstieg heißt diese Wartezeit **Nachlauf**: Der Zustand endet erst, wenn sein Signal eine Zeit lang ununterbrochen fehlt. Zweitens zwei Schwellen, hinein bei einem kleineren Abstand als hinaus. Das heißt **Hysterese**. Für Musik zwischen Zuständen ist das wichtiger als für Geräusche; dort geht [Musik für Zustände](/sound/musik-zustaende) weiter.

  ## Namen, Status und Prüfmuster

  Ein Dateiname nach festem Schema findet sich ohne Suchen und lässt sich per Skript prüfen. Als **Platzhalter** nimmt dieser Kurs für die fertigen Spieldateien `<kategorie>_<objekt>_<aktion>_<nn>.wav`, etwa `sfx_dummy_treffer_01.wav`: eine Datei pro Variante. Dein eigenes Schema legst du selbst fest. Diese Regeln helfen bei jedem:

  - Kleinbuchstaben, keine Leerzeichen, keine Umlaute. Pfade in Godot (`res://`), Skripte und Kommandozeilen behandeln sie sonst verschieden.
  - Feste Reihenfolge der Teile. Dann sortieren sich alle Klänge eines Objekts zusammen.
  - Zweistellige Nummern. Sonst sortiert sich `_10` vor `_2`.

  Für Soundeffekt-Bibliotheken gibt es ein öffentliches System, das Universal Category System. Es will Kategorien vereinheitlichen und „uniformity in a filename structure“ bieten ([UCS](https://universalcategorysystem.com/)). Das Overwatch-Team nannte Ereignisse nach einer Regel: Sie beginnen mit `play_` oder `stop_` (Teil 1, ab etwa 16:43). Ein Prüfskript für das Platzhalter-Schema:

  ```python run
  import re

  # kategorie_objekt_aktion_nn.wav
  SCHEMA = re.compile(
      r"[a-z]+_[a-z]+_[a-z]+"
      r"_\d\d\.wav"
  )
  namen = [
      "sfx_spieler_schritt_01.wav",
      "sfx_spieler_schritt_2.wav",
      "sfx_Dummy_treffer_01.wav",
      "amb_halle_bett_01.wav",
      "sfx_dummy_telegraph 01.wav",
  ]
  for name in namen:
      if SCHEMA.fullmatch(name):
          print("ok    ", name)
      else:
          print("FEHLER", name)
  ```

  Solche Skripte, ein Gerüst für die CSV-Datei oder ein Umbenennen per Skript darf dir eine KI schreiben; das ist technische Arbeit. Was in der Liste steht, welche Klänge, wie viele Varianten, welche Priorität, entscheidest du.

  Die Spalte **Status** zeigt, wie weit ein Ereignis ist. Bevor es einen Klang gibt, steht dort ein **Prüfmuster**: ein technisches Signal, mit dem du nur den Auslöser testest, etwa ein Klick, den du mit dem Handy aufnimmst, oder ein Klick des REAPER-Metronoms. Spielt der Klick im richtigen Frame und auf dem richtigen Bus, stimmt die Zeile. Wie du ihn in Godot an ein Signal, eine Zeitleiste oder ein Bild hängst, steht in [Audio zuordnen](/godot/audio). Erst danach lohnt es sich, den eigentlichen Klang zu bauen.

  > [!INTERVIEW]
  > „Wir bekommen einen neuen Gegner. Wie planst du seinen Ton?“ Gute Antwort, etwa als Technical Sound Designer: Ich lasse mir die Animationsliste und den Zustandsautomaten geben. Daraus schreibe ich eine Cue-Liste, eine Zeile pro Ereignis, mit Auslöser als Bild oder Frame, Typ, Varianten aus der geschätzten Häufigkeit, Priorität, Bus und ob der Klang einen Ort hat. Für jeden Loop prüfe ich am Diagramm alle Ausgänge. Dann setze ich Prüfmuster ein und vergleiche im Log, ob sie im richtigen Frame kommen. Erst dann entstehen die Klänge, und die Status-Spalte zeigt dem Team, was fertig ist.

  ## Häufige Fehler

  - **Treffer-Ton am Einschalten der Hitbox.** Jeder Fehlschlag klingt wie ein Treffer. Auslöser ist die Treffermeldung.
  - **Millisekunden statt Bildnummern.** Nach der nächsten Timing-Änderung sitzt der Klang daneben.
  - **Eine Zeile pro Datei.** Varianten und Schichten bekommen eigene Zeilen, und die Liste wird unlesbar. Eine Zeile pro Ereignis, Varianten als Zahl.
  - **Loop ohne Stopp-Auslöser.** Er läuft weiter, sobald das Spiel einen Ausgang nimmt, den die Zeile nicht kennt.
  - **Atmo als One-Shot.** Die Datei endet, und der Raum ist still.
  - **Gleich viele Varianten für alles.** Schritte klingen mechanisch, Signale werden schwer zu lernen. Die Zahl folgt aus Häufigkeit und Aufgabe.
  - **Bus und Priorität pro Klang einzeln.** Spätestens bei der zwanzigsten Zeile weicht eine ab. Kategorie zuerst.
  - **Namen mit Umlauten und Leerzeichen.** Ein Skript oder ein Pfad scheitert irgendwann daran.

  ## Zusammenfassung

  - Die Cue-Liste hat eine Zeile pro Klangereignis, keine pro Datei. Ereignisse kommen aus Ton-Bildern, Kampf-Log, Zuständen und Orten.
  - Zehn Spalten: ID, Auslöser, Typ, Länge, Varianten, Priorität, Bus, Ort, Status, Quelle.
  - Auslöser als Bild, Frame oder Signal. Bei 60 Frames pro Sekunde steht ein Bild mit 12 FPS 5 Frames; ein Frame sind 800 Samples bei 48 kHz.
  - Der Treffer-Ton gehört zur Treffermeldung, nicht zum Einschalten der Hitbox.
  - Varianten folgen aus der Häufigkeit. Bei n zufälligen Varianten wiederholt sich eine mit 1/n; Signale, die man lernen soll, bleiben bewusst gleich.
  - Ein Loop braucht einen Start und an jedem Ausgang seines Zustands einen Stopp. Das Zustandsdiagramm zeigt die Ausgänge.
  - Gegen flatternde Wechsel helfen zwei Schwellen (Hysterese) und Wartezeiten, die ununterbrochen gelten müssen. Beim Ausstieg heißt die Wartezeit Nachlauf.
  - Ein festes Benennungsschema mit Kategorie vorn lässt sich per Skript prüfen. Das Schema hier ist ein Platzhalter.
exercises:
  - id: was-gehoert-in-die-liste
    type: choice
    title: Eine Zeile, ein Ereignis
    prompt: |
      Welche Aussagen über die Cue-Liste stimmen? Mehrere Antworten richtig.
    options:
      - text: Ein Schritt mit vier Varianten ist eine Zeile mit der Zahl 4 in der Spalte Varianten.
        correct: true
        why: Die Liste plant Ereignisse. Die Varianten sind eine Eigenschaft des Ereignisses.
      - text: Ein Loop braucht einen Start-Auslöser und einen Stopp-Auslöser.
        correct: true
        why: Ein Loop endet nicht von selbst. Ohne Stopp läuft er weiter.
      - text: Der Auslöser wird in Millisekunden ab Spielstart notiert, damit er eindeutig ist.
        correct: false
        why: Im Spiel gibt es keine feste Zeitleiste. Der Auslöser ist ein Bild, Frame oder Signal, und er wandert mit, wenn sich das Timing ändert.
      - text: Die Spalte Ort sagt, ob der Klang mit einem AudioStreamPlayer2D eine Position bekommt.
        correct: true
        why: Klänge mit Ort werden mit dem Abstand leiser und wandern zwischen links und rechts, Klänge ohne Ort nicht.
      - text: Bus und Priorität legst du am besten für jeden Klang einzeln fest, damit jeder genau stimmt.
        correct: false
        why: Overwatch hat damit Fehler erzeugt. Eine Kategorie teilt Bus und Priorität, Abweichungen sind bewusst.
    explanation: |
      Die Cue-Liste ersetzt die Zeitleiste eines Stücks durch Auslöser. Darum ist jede Zeile ein Ereignis, und Auslöser sind Bilder, Frames oder Signale. Loops brauchen zwei Auslöser, One-Shots einen. Bus und Priorität gehören zur Kategorie, damit eine Änderung an einer Stelle reicht.
    resources:
