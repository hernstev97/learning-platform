id: werkstatt-audioabschnitt
title: "Werkstatt: ein kleiner Audioabschnitt im Spiel"
level: 3
minutes: 240
summary: Du baust einen kleinen Abschnitt deines Spiels mit eigener Aktion und Varianten, eigenem Stück in mindestens zwei Zuständen, Atmo, Mischung und Lautheit, hältst Originale, Exporte und Sicherung getrennt und überarbeitest in Fassungen nach Hörtests, mit Entscheidungsprotokoll und Quellenliste.
place: pc
goals:
  - Du begrenzt vor der Arbeit den Umfang und legst einen Abschnittsplan mit Cue-Liste, Zustandsdiagramm, Busplan und Prioritäten an.
  - Du hältst REAPER-Projekte und Rohaufnahmen getrennt von den Exporten im Godot-Projekt und sicherst beides unabhängig von Git, mit geprüfter Wiederherstellung.
  - Du baust eine selbst gewählte Aktion mit eigenen Varianten, ein eigenes Stück mit mindestens zwei Zuständen und getesteten Übergängen und eine Atmo ins Spiel ein und mischst sie nach Priorität.
  - Du überarbeitest in Fassungen nach Hörtests, eine Änderung je Protokolleintrag, und führst ein Entscheidungsprotokoll mit Entscheidung, Grund, Alternative, Test und Ergebnis.
  - Du begründest, warum KI in dieser Werkstatt nur Technik beschleunigt und keinen Klang, keine Musik und keine Mischentscheidung liefert.
