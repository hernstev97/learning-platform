lesson: |
  Du hast in den vorigen Modulen einzelne Teile gebaut: eine Cue-Liste, Aufnahmen, geschichtete Varianten, eine Atmo, ein Stück in Loops und Stems, Busse in Godot. Jeder Teil klang für sich richtig. Im Spiel klingt alles zugleich, und plötzlich überdeckt die Atmo die Schritte, die Musik wechselt zu spät, und nach der dritten Änderung weißt du nicht mehr, welche den Unterschied gemacht hat.

  In dieser Werkstatt baust du einen kleinen Abschnitt deines Spiels, zwei bis vier Bildschirme groß, mit allem, was dazugehört, und überarbeitest ihn in Fassungen. Die Lektion erklärt den Ablauf und warum er so gebaut ist; die Übungen sind die Arbeitsschritte. Es gibt keine Vorschläge für Klänge, Stile, Instrumente, Tempi, Zustände oder Lautstärken. Was in deinem Abschnitt klingt und wie, entscheidest du. Jede Zahl, die hier steht, ist ein Platzhalter.

  > [!NOTE] Zeit einplanen
  > Plan mehrere Sitzungen am PC ein, mit mindestens einer Nacht zwischen Fassung und Hörtest. Die ersten Übungen gehen schnell, die Übungen ab „Fassung 1“ sind die Werkstatt selbst. Als Testumgebung dient die Combat-Testszene ([Testszene: Angriff](/combat/testszene-angriff)) oder das Godot-Testgelände ([Projekt erkunden](/godot/projekt-erkunden)).

  ## Der Ablauf im Überblick

  1. **Abschnittsplan** – Umfang, Cue-Liste, Zustandsdiagramm, Busplan und Prioritäten.
  2. **Ordner und Sicherung** – Originale getrennt von Exporten, Sicherung mit geprüfter Wiederherstellung.
  3. **Fassung 1** – Aktion mit Varianten, Stück in mindestens zwei Zuständen, Atmo, Mischung und Lautheit, im Spiel.
  4. **Hörtest 1**, dann **Überarbeitung 1** – Fassung 2.
  5. **Hörtest 2**, dann **Überarbeitung 2** – Fassung 3.
  6. **Abschluss** – Quellenliste, Entscheidungsprotokoll, Sicherung, Reflexion.

  Jeder Schritt stützt sich auf ein Modul dieses Kurses. Die Cue-Liste kommt aus [Vom Ereignis zur Cue-Liste](/sound/klangplan), das Zustandsdiagramm aus [Musik für Zustände](/sound/musik-zustaende), Busplan und Prioritäten aus [Mischung und Stille](/sound/mischung-stille). Gebaut wird wie in [Layering und Varianten](/sound/layering-varianten), [Foley und Atmo](/sound/foley-umgebung) und [Eigenes Stück aufbereiten](/sound/loops-stems), eingebaut wie in [Musik in Godot](/sound/godot-musik) und [Lautheit, Export, Import](/sound/export-im-spiel). Die Herkunft fremder Dateien dokumentierst du wie in [Quellen und Lizenzen](/sound/quellen-lizenzen). Hier geht es darum, alles zusammenzubringen und in Runden besser zu machen.

  ## Der Abschnittsplan: Umfang festlegen, bevor du baust

  Ein Abschnitt wird schnell zu groß. Begrenz ihn deshalb vorher: **eine** selbst gewählte Aktion mit ihren Varianten, **ein** eigenes Stück mit mindestens zwei Zuständen, **eine** Atmo aus Bett und Spot-Klängen und die Stille, die du bewusst setzt. Alles andere bleibt für später.

  Der Plan besteht aus Teilen, die du schon kennst, auf den Abschnitt zugeschnitten. Die Form, ohne Inhalt:

  ```text
  Abschnitt:      <Name>, <Bildschirme>
  Aktion:         <Name>, Auslöser <Signal/Bild>
  Cue-Liste:      <ID, Auslöser, One-Shot/Loop,
                   Varianten, Priorität, Bus>
  Musik:          <Zustände>, Diagramm mit
                   Auslösern und Nachlauf
  Atmo:           Bett <Datei>, Spots <Dateien>
  Busse:          <Namen>, Ducking <wer, wann>
  Prioritäten:    <Reihenfolge>
  Lautheit:       Ziel <Platzhalter> LUFS-I,
                   True Peak <Platzhalter>
  ```

  Der Plan ist der Maßstab für jeden Hörtest. Ohne ihn hörst du gegen ein Gefühl, mit ihm gegen deine eigene Absicht. Er darf sich ändern. Wenn du beim Bauen merkst, dass der Abschnitt etwas anderes braucht, notier die Änderung im Entscheidungsprotokoll, statt den Plan still umzuschreiben.

  ## Originale, Exporte und Sicherung

  Halte zwei Welten getrennt. Die **Originale**: REAPER-Projekte, Rohaufnahmen, Aufnahmeprotokolle, die Lieferliste. Sie werden bearbeitet, aber nie durch einen Export ersetzt. Die **Exporte**: WAV- und Ogg-Dateien im Godot-Projekt, die jederzeit aus den Originalen neu entstehen können. Ein Platzhalter-Aufbau:

  ```text
  audio-quellen/            (außerhalb des Godot-Projekts)
    reaper/abschnitt-1.rpp
    roh/2026-10-24_ort_takes/
    protokolle/
  spiel/                    (Godot-Projekt)
    project.godot
    audio/sfx/
    audio/musik/
    audio/atmo/
  ```

  Liegen die Originale im Godot-Projekt, importiert Godot jede Rohaufnahme mit. Willst du sie trotzdem dort haben, verhindert eine leere Datei `.gdignore` im Ordner den Import ([Ignoring specific folders](https://docs.godotengine.org/en/stable/tutorials/best_practices/project_organization.html#ignoring-specific-folders)).

  REAPER hilft dir, Fassungen nachzuvollziehen. Beim Speichern wird die vorige Fassung des Projekts als `.RPP-bak` aufgehoben ([S. 29](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=29)); mit „Keep multiple versions“ entsteht bei jedem Speichern eine neue Fassung mit Datum und Uhrzeit ([S. 234](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=234)). Im Render-Dialog legt „Save copy of project to outfile.xxx.RPP“ zu jedem Export eine Kopie des Projekts in dem Zustand ab, in dem gerendert wurde ([S. 415](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=415)). Damit weißt du bei jeder Datei, aus welchem Projektstand sie stammt. Vorsicht mit „Silently increment filenames“ auf derselben Seite: Die Option hängt bei vorhandenen Namen eine Nummer an. Für das Spiel heißt das, dass eine neue Datei neben der alten landet und das Spiel weiter die alte spielt. Ersetzt du eine Datei unter gleichem Namen, importiert Godot sie automatisch neu ([Automatic reimport](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/import_process.html#automatic-reimport)); die Render-Einstellungen dafür stehen in [REAPER als Werkbank](/sound/reaper-werkbank).

  Für das Godot-Projekt nimmst du Git, Audiodateien gern mit Git LFS ([Git LFS](https://docs.godotengine.org/en/stable/tutorials/best_practices/version_control_systems.html#git-lfs)). Git hebt Fassungen auf. Ein Backup ist es nicht.

  > [!WARNING] Git ersetzt kein Backup
  > Ein lokaler Commit liegt auf derselben Platte wie das Projekt. Ein Push kopiert nur das Godot-Projekt, nicht die Originale außerhalb davon. Ein Backup ist eine Kopie von Originalen und Projekt auf einem anderen Datenträger. Ob es eines ist, weißt du erst, wenn du einmal daraus wiederhergestellt hast: Projekt aus der Kopie öffnen, ein Export neu rendern, im Spiel hören.

  ## Fassung 1: Aktion, Stück, Atmo und Mischung im Spiel

  Bau Fassung 1 in derselben Reihenfolge, in der du später Fehler suchst: erst mit Prüfmustern, dann mit deinem Material. Ein Klick auf dem Kontaktbild zeigt, ob der Auslöser im richtigen Frame sitzt ([Animation im Spiel](/animation/animation-im-spiel), [Testszene](/animation/testszene)). Ein Prüfloop aus Metronom-Klicks zeigt, ob Loop-Länge und Übergänge stimmen ([Eigenes Stück aufbereiten](/sound/loops-stems)). Erst wenn die Prüfmuster stimmen, kommen deine Varianten, dein Stück und deine Atmo dazu. Dann weißt du bei einem Fehler, ob er im Material oder im Einbau liegt.

  Für jeden Übergang deines Diagramms hältst du im Log fest, wann das Spiel ihn anfragt und wann die Musik wechselt, und vergleichst beides mit deiner Rechnung. Wie das Log entsteht, zeigt [Musik in Godot](/sound/godot-musik).

  Gemischt wird im Spiel, nicht in REAPER. Jeder Player hängt an einem Bus deines Busplans, und die Lautstärke eines Klangs ist die Summe aus Player und allen Bussen auf seinem Weg ([Audio buses](https://docs.godotengine.org/en/stable/tutorials/audio/audio_buses.html), [Audio zuordnen](/godot/audio)). Prüf die Prioritäten aus deinem Plan: Ist das Wichtigste in jedem Moment hörbar? Setz die Stille, die du geplant hast, und hör, ob sie als Stille ankommt oder als Lücke. Zum Schluss misst du die Lautheit des Abschnitts und vergleichst sie mit deinem Platzhalterwert ([Lautheit, Export, Import](/sound/export-im-spiel)). Der Wert ist ein Startpunkt, kein Urteil.

  ## Hörtest, Überarbeitung und Entscheidungsprotokoll

  Zwischen Fassung und Hörtest liegt mindestens eine Nacht. Direkt danach hörst du, was du gemeint hast; mit Abstand eher, was klingt. Hör den Abschnitt im Spiel, mit Kopfhörern und über den Lautsprecher des Handys oder was du sonst hast, laut und sehr leise. Leise hörst du, was als Erstes verschwindet. Notier jede Stelle, an der etwas nicht so ankommt, wie dein Plan es vorsieht, und korrigier beim Hören nichts.

  Dann überarbeitest du. Jeder Eintrag im Protokoll ändert **eine** Sache. Änderst du zwei Dinge auf einmal und es klingt besser, weißt du nicht, welche geholfen hat, und kannst die andere nicht zurücknehmen. Nach der Überarbeitung speicherst du die neue Fassung getrennt von der alten: Projektstand, Exporte und Protokoll.

  > [!MERKE]
  > Ein Hörtest, eine Liste. Eine Änderung, ein Eintrag. Jede Fassung bleibt erhalten.

  Das **Entscheidungsprotokoll** hält jede Entscheidung fest, die über den Plan hinausgeht oder ihn ändert. Fünf Spalten reichen: Entscheidung, Grund, Alternative, Test, Ergebnis. Als CSV-Datei neben den Originalen. Ein Lehrbeispiel für die Form, kein Vorschlag für deinen Abschnitt:

  ```csv
  datum,fassung,entscheidung,grund,alternative,test,ergebnis
  2026-10-25,2,"Übergang B->A auf nächsten Takt","Hörtest 1: Schnitt mitten in Phrase","sofort mit Blende","Prüfloop + Log, 5 Anfragen","Wechsel 0,3 bis 1,9 s nach Anfrage; Schnitt weg"
  ```

  Die Spalte **Alternative** zeigt, dass es eine Wahl war. Die Spalte **Test** sagt, wie du es geprüft hast, so genau, dass du den Test wiederholen kannst. Das **Ergebnis** steht erst nach dem Test, mit dem, was du gemessen oder gehört hast. Zusammen mit der Quellenliste aus [Quellen und Lizenzen](/sound/quellen-lizenzen) macht das Protokoll jede Datei im Abschnitt nachvollziehbar, auch für dich in einem halben Jahr.

  > [!PRAXIS] Im Zusammenhang hören
  > Koji Kondo legte seinem Director laut einem Bericht über seinen GDC-Vortrag 2007 keine einzelnen Stücke vor. Er wartete, bis vier oder fünf fertig waren, und präsentierte sie als Gruppe, damit die Balance zwischen den Stücken hörbar wird; auch die Übergänge zwischen Stücken nennt er eine Frage der Balance ([Vincent Diamante, Game Developer](https://www.gamedeveloper.com/game-platforms/gdc-koji-kondo-s-interactive-musical-landscapes)). Für die Werkstatt heißt das: Ein Klang wird im Abschnitt beurteilt, mit allem, was dort gleichzeitig klingt, nicht solo in REAPER.

  > [!INTERVIEW]
  > „Erzähl uns von einem Stück in deinem Portfolio. Was hast du entschieden und warum?“ Gute Antwort, etwa als Sound Designer oder Audio Designer: Ich zeige den Abschnitt im Spiel, dann eine Entscheidung aus dem Protokoll, mit Grund, verworfener Alternative und dem Test, der sie bestätigt hat. Ich spiele Fassung 1 und die letzte Fassung nacheinander vor und sage, welche Änderung welchen Unterschied macht. Ich nenne die Herkunft jeder fremden Datei mit Lizenz und sage, was ich selbst aufgenommen habe. Und ich nenne, was ich bewusst nicht geändert habe.

  ## KI in der Werkstatt

  Jeder Klang, jedes Stück und jede Mischentscheidung in diesem Abschnitt stammt von dir. KI darf hier Technik beschleunigen: ein GDScript-Gerüst, das die Musik umschaltet und ins Log schreibt, ein Skript, das Dateien nach deinem Schema umbenennt, eine CSV-Vorlage für Protokoll und Quellenliste mit Platzhaltern. Generierte Klänge oder Musik gehören nicht in den Abschnitt, auch nicht als Platzhalter, denn Platzhalter bleiben gern liegen. Assistenten, die einen Mix oder ein Master vorschlagen, fallen ebenfalls darunter.

  Auch Fragen sind Aufträge. „Klingt die Mischung gut?“ oder „Was fehlt hier?“ liefert dir fremde Mischentscheidungen. Diese Fragen beantwortest du im Hörtest, mit deinem Plan als Maßstab, und später mit Menschen, die den Abschnitt zum ersten Mal hören.

  ## Häufige Fehler

  - **Umfang wächst beim Bauen.** Aus einer Aktion werden drei, und keine wird fertig. Plan begrenzen, Neues ins Protokoll für später.
  - **Gleich mit eigenem Material eingebaut.** Ein Fehler kann dann im Klang oder im Einbau liegen. Erst Prüfmuster, dann Material.
  - **Solo beurteilt.** Ein Klang, der allein trägt, verschwindet im Abschnitt. Beurteilen im Spiel, mit allem zugleich.
  - **Zwei Änderungen in einem Eintrag.** Es klingt besser, aber du weißt nicht, warum. Eine Änderung je Eintrag.
  - **Ergebnis vor dem Test notiert.** Das Protokoll bestätigt dann die Erwartung statt der Messung.
  - **Rohaufnahmen im Godot-Projekt.** Godot importiert sie mit. Originale außerhalb oder mit `.gdignore`.
  - **„Silently increment filenames“ beim Export an.** Die neue Datei heißt anders, das Spiel spielt die alte.
  - **Git als Backup.** Lokal geht es mit der Platte verloren, gepusht fehlen die Originale. Kopie von allem auf einem anderen Datenträger, Wiederherstellung ausprobiert.

  ## Zusammenfassung

  - Der Umfang steht vorher fest: eine Aktion, ein Stück mit mindestens zwei Zuständen, eine Atmo, bewusste Stille.
  - Der Abschnittsplan aus Cue-Liste, Diagramm, Busplan, Prioritäten und Lautheitsziel ist der Maßstab für jeden Hörtest.
  - Originale und Exporte sind getrennt; jeder Export lässt sich einem Projektstand zuordnen; ein Backup liegt auf einem anderen Datenträger und ist einmal wiederhergestellt worden.
  - Erst Prüfmuster, dann eigenes Material; Übergänge werden mit Log gegen die Rechnung geprüft.
  - Gemischt und beurteilt wird im Spiel, laut und leise, mit verschiedenen Wiedergabegeräten.
  - Jede Überarbeitung ändert eine Sache je Eintrag, jede Fassung bleibt erhalten.
  - Das Entscheidungsprotokoll nennt Entscheidung, Grund, Alternative, Test und Ergebnis; die Quellenliste die Herkunft jeder fremden Datei.
  - KI beschleunigt nur Technik. Klänge, Musik und Mischentscheidungen bleiben deine.
exercises:
  - id: ablauf-ordnen
    type: order
    title: Was kommt wann?
    prompt: |
      Bring die Schritte der Werkstatt in die Reihenfolge, in der du sie machst.
    lang: prose
    lines: |
      Abschnittsplan mit Umfang, Cue-Liste, Diagramm, Busplan und Prioritäten anlegen
      Ordner für Originale und Exporte anlegen und eine Sicherung einrichten
      Fassung 1 mit Prüfmustern einbauen und testen
      Eigenes Material einsetzen, mischen und die Lautheit messen
      Hörtest 1 nach mindestens einer Nacht
      Überarbeitung 1, eine Änderung je Protokolleintrag
      Hörtest 2 und Überarbeitung 2
      Quellenliste und Entscheidungsprotokoll abschließen und die Wiederherstellung prüfen
    explanation: |
      Der Plan kommt zuerst, weil er der Maßstab für alle Tests ist. Die Ordner kommen vor dem ersten Export, sonst landen Originale und Exporte vermischt im Projekt. Prüfmuster vor dem eigenen Material trennen Fehler im Einbau von Fehlern im Klang. Die Nacht vor dem Hörtest trennt Bauen und Urteilen. Am Ende steht die Wiederherstellung, weil erst sie zeigt, dass die Sicherung alles enthält, was du gebaut hast.
    resources:
      - title: REAPER User Guide 7.81 · Multiple Project Backup Versions (S. 234)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=234

  - id: was-ist-ein-backup
    type: choice
    title: Was übersteht einen Plattenausfall?
    prompt: |
      Die Platte deines PCs fällt aus. Welche Sicherung bringt dir Godot-Projekt, REAPER-Projekte und Rohaufnahmen zurück?
    options:
      - text: Eine Kopie von Godot-Projekt und Originalen auf einem zweiten Datenträger, aus der du schon einmal wiederhergestellt hast.
        correct: true
        why: Sie liegt woanders, enthält alles, und du weißt, dass die Wiederherstellung funktioniert.
      - text: Ein Commit im Git-Repository des Godot-Projekts.
        correct: false
        why: Ein lokaler Commit liegt auf derselben Platte. Auch gepusht enthält das Repository nur das Godot-Projekt, nicht die REAPER-Projekte und Rohaufnahmen außerhalb davon.
      - text: Die `.RPP-bak`-Dateien von REAPER.
        correct: false
        why: Sie liegen neben dem Projekt auf derselben Platte und enthalten nur den vorigen Projektstand, keine Aufnahmen.
      - text: Die exportierten Ogg- und WAV-Dateien im Godot-Projekt.
        correct: false
        why: Exporte sind Ergebnisse. Ohne REAPER-Projekte und Rohaufnahmen kannst du sie nicht mehr ändern, nur noch abspielen.
    explanation: |
      Ein Backup braucht drei Eigenschaften: eine Kopie, an einem anderen Ort, und eine Wiederherstellung, die du ausprobiert hast. Git und `.RPP-bak` sind Werkzeuge für Fassungen. Lokal liegen beide auf derselben Platte, und ein Push sichert nur das Godot-Projekt. Sie helfen, wenn du eine Änderung zurücknehmen willst, nicht wenn die Platte weg ist. Welches Werkzeug du für die Kopie nimmst, entscheidest du.
    resources:
      - title: REAPER User Guide 7.81 · Project Backup File (S. 29)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=29

  - id: ki-auftrag
    type: choice
    title: Was darf die Maschine hier?
    prompt: |
      Welche Aufträge an eine KI passen zur Regel dieser Werkstatt? Mehrere Antworten richtig.
    options:
      - text: Schreib ein GDScript-Gerüst, das bei jeder Musik-Anfrage Frame und Clip ins Log schreibt.
        correct: true
        why: Das ist Technik. Das Gerüst entscheidet nichts über den Klang, es macht deinen Test schneller. Prüfen musst du es trotzdem, wie jeden Code.
      - text: Leg eine CSV-Vorlage für das Entscheidungsprotokoll mit leeren Spalten an.
        correct: true
        why: Eine Vorlage mit Platzhaltern. Was in den Zeilen steht, entscheidest und misst du.
      - text: Erzeug eine Atmo als Platzhalter, bis meine eigene Aufnahme fertig ist.
        correct: false
        why: Generierte Klänge gehören nicht in den Abschnitt, auch nicht als Platzhalter, denn Platzhalter bleiben gern liegen. Zum Testen des Einbaus nimmst du ein Prüfmuster.
      - text: Hör dir den Mitschnitt an und sag mir, ob die Mischung stimmt.
        correct: false
        why: Das ist eine Mischentscheidung. Ob die Mischung trägt, prüfst du im Hörtest gegen deinen Plan und später mit Menschen, die den Abschnitt zum ersten Mal hören.
      - text: Schlag mir eine Lautstärke für den Atmo-Bus vor.
        correct: false
        why: Auch ein einzelner Wert ist eine Mischentscheidung. Den Startpunkt setzt du als Platzhalter selbst und prüfst ihn im Hörtest.
    explanation: |
      Die Grenze verläuft zwischen Werkzeug und Gestaltung. Ein Log-Gerüst oder eine leere Vorlage beschleunigt Arbeit, deren Ergebnis du bestimmst. Ein generierter Klang, ein Urteil über die Mischung oder ein vorgeschlagener Wert nimmt dir die Entscheidung ab, die diese Werkstatt üben soll. Auch die Frage „Klingt das gut?“ ist so ein Auftrag.

  - id: lautheit-fassung
    type: output
    title: Fassung 1 gegen das Ziel
    prompt: |
      Du hast den Abschnitt in Fassung 1 gemessen: −19,4 LUFS-I und −0,8 dBTP True Peak. Dein Platzhalterziel ist −16 LUFS-I, deine Grenze für True Peak −1 dBTP. Das Programm rechnet den Gain bis zum Ziel und prüft den True Peak vor und nach dem Gain gegen die Grenze. Was gibt es aus?
    lang: python
    code: |
      ziel_lufs = -16.0   # Platzhalter
      gemessen_lufs = -19.4
      true_peak = -0.8    # dBTP, gemessen
      grenze_tp = -1.0    # Platzhalter

      gain = ziel_lufs - gemessen_lufs
      neu_tp = true_peak + gain
      print(f"{gain:+.1f} dB")
      print("vorher:", "über der Grenze" if true_peak > grenze_tp else "ok")
      print(f"{neu_tp:+.1f} dBTP")
      print("nachher:", "über der Grenze" if neu_tp > grenze_tp else "ok")
    expected: |
      +3.4 dB
      vorher: über der Grenze
      +2.6 dBTP
      nachher: über der Grenze
    hints:
      - Ein Gain verschiebt Lautheit und True Peak um dieselben Dezibel.
    explanation: |
      Bis zum Ziel fehlen 3,4 dB. Schon Fassung 1 liegt mit −0,8 dBTP über der Grenze von −1 dBTP, noch ohne jeden Gain. Ein reiner Gain hebt den True Peak um weitere 3,4 dB, auf +2,6 dBTP. Fassung 1 hat also zu wenig Abstand zwischen Spitzen und Lautheit, um mit Gain allein ans Ziel zu kommen. Was du tust, entscheidest du: das Ziel als Platzhalter überprüfen, die Spitzen bearbeiten oder die Mischung ändern. Ins Protokoll gehören Messwerte, Entscheidung und der Test danach. Wie du misst, steht in [Lautheit, Export, Import](/sound/export-im-spiel).
    resources:
      - title: REAPER User Guide 7.81 · Dry Run Render Stats, LUFS-I und True Peak (S. 416)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=416

  - id: ruhe-erwartet
    type: output
    title: Wann sollte die Ruhe kommen?
    prompt: |
      Vor dem Hörtest rechnest du aus, was du hören solltest. Ein Lehrbeispiel: Das Diagramm wechselt 3 s nach dem letzten Gegner zurück, auf den nächsten Takt, 4/4 bei 90 BPM (Platzhalter). Der Kampf-Clip läuft seit 0,0 s und wurde nicht neu gestartet; seine Takte zählen also ab 0,0 s. Der letzte Gegner verschwindet bei 20,0 s. Das Programm gibt den erwarteten Wechsel und den Abstand zum letzten Gegner aus. Was steht da?
    lang: python
    code: |
      import math

      BPM = 90
      TAKT = 4
      nachlauf = 3.0
      letzter_gegner = 20.0

      takt_s = TAKT * 60 / BPM
      anfrage = letzter_gegner + nachlauf
      wechsel = math.ceil(anfrage / takt_s) * takt_s
      print(f"{wechsel:.2f}")
      print(f"{wechsel - letzter_gegner:.2f}")
    expected: |
      24.00
      4.00
    hints:
      - Ein Takt dauert 4 × 60 / 90 ≈ 2,67 s. Die Taktgrenzen liegen bei 21,33 und 24,00 s.
    explanation: |
      Der Nachlauf endet bei 23,0 s. Weil der Kampf-Clip bei 0,0 s begonnen hat, liegen seine Taktgrenzen bei 0, 2,67, 5,33 … 21,33 und 24,0 s; die nächste nach 23,0 s ist 24,0 s. Die Ruhe kommt also 4 Sekunden nach dem letzten Gegner, nicht 3. Diese Zahl schreibst du vor dem Hörtest auf. Wirkt die Ruhe im Test zu spät, weißt du, dass Nachlauf und Takt zusammen die Ursache sind, und kannst im Protokoll eins von beiden ändern, nicht beide.
    resources:
      - title: Godot Docs · AudioStreamInteractive, TRANSITION_FROM_TIME_NEXT_BAR
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreaminteractive.html#class-audiostreaminteractive-constant-transition-from-time-next-bar

  - id: zwei-aenderungen
    type: bug
    title: Besser, aber warum?
    prompt: |
      Nach Überarbeitung 2 klingt der Abschnitt besser. Im Protokoll kannst du aber nicht ablesen, welche Änderung das bewirkt hat. Finde den Eintrag, der gegen die Regel der Werkstatt verstößt.
    lang: prose
    code: |
      Fassung 1, Hörtest 1: Die Schritte gehen unter der Atmo unter.
      Überarbeitung 1: Atmo-Bus 3 dB leiser.
      Fassung 2, Hörtest 2: Schritte hörbar, die Atmo wirkt jetzt dünn.
      Überarbeitung 2: Atmo-Bett neu gerendert und Ducking der Musik verlängert.
      Fassung 3, Hörtest 3: Schritte hörbar, Atmo trägt den Raum.
    lines: [4]
    explanation: |
      Überarbeitung 2 ändert zwei Dinge auf einmal: das Atmo-Bett und das Ducking der Musik. Beides kann den Eindruck in Hörtest 3 erklären, und wenn eins davon an anderer Stelle schadet, weißt du nicht, welches du zurücknehmen musst. Getrennt wären es zwei Einträge mit zwei Hörtests oder wenigstens zwei A/B-Vergleichen. Überarbeitung 1 ändert genau eine Sache, so wie es sein soll.
    resources:
      - title: Godot Docs · Audio buses
        url: https://docs.godotengine.org/en/stable/tutorials/audio/audio_buses.html

  - id: rohaufnahmen-im-projekt
    type: bug
    title: Der Import dauert ewig
    prompt: |
      Nach jedem neuen Aufnahmetag braucht Godot beim Öffnen des Projekts lange, und der Ordner `.godot/imported` wächst um Hunderte Megabyte, obwohl im Spiel nur wenige Dateien benutzt werden. Finde die Zeile im Ordneraufbau, die das verursacht.
    lang: text
    code: |
      spiel/
        project.godot
        audio/sfx/
        audio/musik/
        audio/roh/      (Rohaufnahmen, alle Takes)
        scenes/
    lines: [5]
    explanation: |
      Godot importiert alle Dateien, die es kennt, aus dem ganzen Projektordner, auch jede Rohaufnahme. Die Rohaufnahmen gehören zu den Originalen und damit außerhalb des Godot-Projekts. Sollen sie doch im Projekt liegen, verhindert eine leere Datei `.gdignore` im Ordner `audio/roh/` den Import. Es gibt also zwei richtige Korrekturen; beide beginnen an dieser Zeile.
    resources:
      - title: Godot Docs · Project organization, Ignoring specific folders
        url: https://docs.godotengine.org/en/stable/tutorials/best_practices/project_organization.html#ignoring-specific-folders

  - id: alte-datei-spielt
    type: bug
    title: Die Änderung kommt nicht an
    prompt: |
      Du hast die Atmo in REAPER geändert und neu gerendert. Im Spiel klingt sie wie vorher. Im Ordner `audio/atmo/` liegen jetzt `atmo_bett_01.ogg` und `atmo_bett_01-001.ogg`. Finde die Einstellung im Render-Blatt, die das verursacht.
    lang: text
    code: |
      Quelle:      Selected media items
      Dateiname:   atmo_bett_01
      Verzeichnis: spiel/audio/atmo
      Format:      OGG Vorbis
      Silently increment filenames: an
      Save copy of project: an
    lines: [5]
    fix:
      - line: 5
        answers:
          - "Silently increment filenames: aus"
          - "Silently increment filenames: Aus"
          - "Silently increment filenames aus"
          - "Silently increment filenames: off"
          - "Silently increment filenames off"
          - "Silently increment filenames: nein"
    explanation: |
      Laut Guide hängt „Silently increment filenames“ eine Nummer an, wenn der Name schon existiert. Die neue Fassung landet als `atmo_bett_01-001.ogg` neben der alten, und das Spiel spielt weiter `atmo_bett_01.ogg`. Für Exporte ins Spiel schaltest du die Option aus, damit die Datei ersetzt wird. Fassungen hebst du stattdessen über die Projektkopie auf, die „Save copy of project“ zu jedem Export ablegt, und über deine Sicherung. Die Option steht auch in [REAPER als Werkbank](/sound/reaper-werkbank) unter den Einstellungen, die über den Export entscheiden.
    resources:
      - title: REAPER User Guide 7.81 · Render to File, Silently increment filenames (S. 415)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=415

  - id: protokollzeile
    type: explain
    title: Was eine Protokollzeile leistet
    prompt: |
      Ein Lehrbeispiel aus einem Entscheidungsprotokoll, kein Vorschlag für deinen Abschnitt. Erkläre, wozu jede der fünf Spalten da ist und was fehlen würde, wenn eine leer bliebe.
    lang: text
    code: |
      Entscheidung: Übergang B->A auf
        nächsten Takt statt sofort
      Grund: Hörtest 1, Schnitt mitten
        in der Phrase
      Alternative: sofort mit Blende
      Test: Prüfloop + Log, 5 Anfragen
      Ergebnis: Wechsel 0,3 bis 1,9 s
        nach Anfrage; Schnitt weg
    points:
      - Der Grund verbindet die Entscheidung mit einer Beobachtung aus einem Hörtest oder mit dem Plan, nicht mit einem Gefühl.
      - Die Alternative zeigt, dass es eine Wahl war, und ist der erste Kandidat, wenn die Entscheidung sich später als falsch herausstellt.
      - Der Test ist so genau beschrieben, dass du ihn wiederholen kannst.
      - Das Ergebnis enthält, was gemessen oder gehört wurde, auch den Preis, hier die Verzögerung.
    explanation: |
      Ohne Grund lässt sich die Entscheidung später nicht prüfen; du weißt nicht mehr, welches Problem sie lösen sollte. Ohne Alternative sieht sie aus wie die einzige Möglichkeit, und beim nächsten Problem fängst du von vorn an. Ohne genauen Test kannst du nach einer weiteren Änderung nicht noch einmal nachsehen, ob sie noch hält. Und ohne Ergebnis bleibt nur die Erwartung. Hier steht auch der Preis drin: Der Wechsel wartet bis zu 1,9 Sekunden. Ob dir das recht ist, entscheidest du beim nächsten Hörtest, und du weißt, wonach du hören musst.

  - id: abschnittsplan
    type: practice
    title: Der Plan vor dem Bauen
    prompt: |
      Wähle einen Abschnitt deines Spiels, zwei bis vier Bildschirme groß, und schreib den Abschnittsplan in der Form aus der Lektion. Übernimm, was du schon hast: Cue-Liste aus [Vom Ereignis zur Cue-Liste](/sound/klangplan), Diagramm aus [Musik für Zustände](/sound/musik-zustaende), Busplan und Prioritäten aus [Mischung und Stille](/sound/mischung-stille). Was in deinem Abschnitt klingt, entscheidest du; Werte sind Platzhalter. Speichere den Plan als eigene Datei bei den Originalen.
    lang: prose
    starter: |
      Abschnitt (Name, Bildschirme):
      Aktion (Name, Auslöser):
      Cue-Liste (ID, Auslöser, One-Shot/Loop, Varianten, Priorität, Bus):
      Musik (Zustände, Diagramm, Nachlauf):
      Atmo (Bett, Spot-Klänge):
      Stille (wo, warum):
      Busse und Ducking:
      Prioritäten:
      Lautheit (Platzhalter):
      Bewusst nicht in diesem Abschnitt:
    checklist:
      - Der Plan enthält genau eine Aktion, ein Stück mit mindestens zwei Zuständen und eine Atmo.
      - Jeder Eintrag der Cue-Liste hat einen Auslöser, eine Priorität und einen Bus.
      - Jeder Pfeil im Diagramm hat Auslöser, Zeitpunkt, Ziel und Art.
      - Mindestens eine Stelle mit bewusster Stille ist notiert.
      - Lautheitsziel und True-Peak-Grenze sind als Platzhalter mit Einheit notiert.
      - Unter „Bewusst nicht“ steht mindestens ein Punkt.
      - Der Plan liegt als Datei bei den Originalen, mit Datum.
    explanation: |
      Der Plan begrenzt den Umfang und macht jeden Hörtest prüfbar. Die Zeile „Bewusst nicht in diesem Abschnitt“ ist kein Beiwerk: Sie fängt die Ideen auf, die beim Bauen kommen, ohne dass der Abschnitt wächst. Lautheitsziel und Grenze als Platzhalter heißen: Du startest mit einer Zahl und prüfst sie im Hörtest, statt ihr zu gehorchen.
    resources:
      - title: Godot Docs · Audio buses
        url: https://docs.godotengine.org/en/stable/tutorials/audio/audio_buses.html

  - id: ordner-und-sicherung
    type: practice
    title: Ordner, Projektkopien und eine geprüfte Sicherung
    prompt: |
      Leg die Ordner für Originale und Exporte an, schalte in REAPER „Keep multiple versions“ ein und im Render-Dialog „Save copy of project to outfile.xxx.RPP“, und richte eine Sicherung auf einem zweiten Datenträger ein. Stell danach einmal wieder her: Projekt aus der Sicherung öffnen, eine Datei neu rendern, im Spiel hören. Trag hier Ordneraufbau, Einstellungen und Ergebnis der Wiederherstellung ein. Namen und Pfade sind Platzhalter.
    lang: text
    starter: |
      Ordneraufbau:

      REAPER (Preferences, Render-Dialog):

      Godot-Projekt (Git, LFS, .gdignore):

      Sicherung (wohin, womit, wie oft):

      Wiederherstellung (Datum, was geprüft, Ergebnis):
    solution: |
      Ordneraufbau:
        audio-quellen/   (außerhalb des Godot-Projekts)
          reaper/  roh/  protokolle/  plan/
        spiel/   (Godot-Projekt)
          audio/sfx/  audio/musik/  audio/atmo/

      REAPER:
        Preferences, Project: Keep multiple versions an
        Render-Dialog: Save copy of project an,
          Silently increment filenames aus

      Godot-Projekt:
        Git-Repository, Audio über Git LFS
        keine Rohaufnahmen im Projekt

      Sicherung:
        audio-quellen/ und spiel/ auf <zweiter Datenträger>,
        mit <Werkzeug>, <Rhythmus>

      Wiederherstellung:
        <Datum>: abschnitt-1.rpp aus der Sicherung geöffnet,
        atmo_bett_01.ogg neu gerendert, im Spiel gehört: ok
    checklist:
      - Originale und Exporte liegen in getrennten Ordnern; im Godot-Projekt liegen keine Rohaufnahmen ohne `.gdignore`.
      - „Keep multiple versions“ ist an, und nach zweimal Speichern gibt es mehrere Fassungen in der `.RPP-bak`.
      - Zu einem Testexport liegt eine Projektkopie mit dem Zustand beim Rendern.
      - Die Sicherung liegt auf einem anderen Datenträger als das Projekt und enthält Originale und Godot-Projekt.
      - Du hast einmal aus der Sicherung wiederhergestellt und das Ergebnis mit Datum notiert.
    explanation: |
      Die Musterlösung zeigt die Form, nicht deine Werkzeuge: Welches Programm die Kopie macht und wie oft, entscheidest du. Entscheidend ist die Wiederherstellung. Eine Sicherung, aus der du nie zurückgeholt hast, kann leer sein, alte Stände enthalten oder einen Ordner auslassen, und du merkst es erst, wenn du sie brauchst. Die REAPER-Optionen beantworten eine andere Frage: aus welchem Projektstand ein Export stammt.
    resources:
      - title: REAPER User Guide 7.81 · Multiple Project Backup Versions (S. 234)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=234
      - title: Godot Docs · Version control systems, Git LFS
        url: https://docs.godotengine.org/en/stable/tutorials/best_practices/version_control_systems.html#git-lfs

  - id: fassung-1
    type: practice
    title: Fassung 1 im Spiel
    prompt: |
      Bau Fassung 1 in deine Testumgebung, erst mit Prüfmustern, dann mit deinem Material: die Aktion mit ihren Varianten auf dem Auslöser aus deinem Plan, das Stück mit mindestens zwei Zuständen und den Übergängen aus deinem Diagramm, die Atmo aus Bett und Spot-Klängen. Prüf jeden Übergang mit Log gegen deine Rechnung. Misch nach deinen Prioritäten, setz die geplante Stille und miss die Lautheit des Abschnitts. Trag hier ein, was du gebaut, gemessen und notiert hast.
    lang: prose
    starter: |
      Testumgebung:

      Prüfmuster (Klick auf Auslöser, Prüfloop): Ergebnis

      Aktion und Varianten (Dateien, Auslöser):

      Stück (Dateien, Zustände, Übergänge):

      Übergänge im Log (Anfrage, Wechsel, Rechnung):

      Atmo (Bett, Spots):

      Busse und Prioritäten (was ist wann vorn?):

      Stille (wo):

      Lautheit Fassung 1 (LUFS-I, True Peak):
    checklist:
      - Im Spiel ist die Aktion mit mindestens zwei eigenen Varianten zu hören, auf dem Auslöser aus deinem Plan.
      - Im Spiel sind mindestens zwei Zustände deines Stücks zu hören, und jeder Übergang aus dem Diagramm ist mindestens einmal ausgelöst worden.
      - Für jeden Übergang stehen Anfrage- und Wechselzeit aus dem Log neben deiner Rechnung.
      - Bett und mindestens ein Spot-Klang der Atmo sind im Spiel zu hören.
      - Jeder Player hängt an einem Bus aus deinem Busplan.
      - Die Lautheit von Fassung 1 ist mit Messwert und Einheit notiert, neben deinem Platzhalterziel.
      - Fassung 1 ist gespeichert, mit Projektstand und Exporten.
    explanation: |
      Prüfmuster zuerst, weil du sonst bei jedem Fehler zwei Ursachen hast. Das Log macht aus „die Musik kommt irgendwie spät“ eine Zahl, die du mit deiner Rechnung vergleichen kannst. Die Lautheit von Fassung 1 ist kein Urteil über die Fassung, sondern der Ausgangspunkt für die Überarbeitungen. Ob die Mischung trägt, entscheidet der Hörtest, nicht der Messwert.
    resources:
      - title: Godot Docs · AudioStreamInteractive
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreaminteractive.html

  - id: hoertest-ueberarbeitung-1
    type: practice
    title: Hörtest 1 und Überarbeitung 1
    prompt: |
      Mindestens eine Nacht nach Fassung 1. Hör den Abschnitt im Spiel mit Kopfhörern und über einen zweiten Lautsprecher, laut und sehr leise. Notier jede Stelle, an der etwas nicht so ankommt wie geplant, ohne beim Hören zu ändern. Überarbeite dann, eine Änderung je Protokolleintrag, und speichere Fassung 2 getrennt von Fassung 1.
    lang: prose
    starter: |
      Hörtest 1 (Datum, Geräte, Lautstärken):

      Beobachtungen (Stelle, was ankommt, was laut Plan ankommen soll):

      Überarbeitung 1 (je Zeile: Entscheidung, Grund, Alternative, Test, Ergebnis):

      Fassung 2 gespeichert (wo):
    checklist:
      - Zwischen Fassung 1 und Hörtest 1 lag mindestens eine Nacht.
      - Du hast mit mindestens zwei Wiedergabegeräten und mindestens zwei Lautstärken gehört und beides notiert.
      - Jede Beobachtung nennt die Stelle im Abschnitt und bezieht sich auf einen Punkt im Plan.
      - Jede Änderung steht als eigener Eintrag mit Entscheidung, Grund, Alternative, Test und Ergebnis im Protokoll.
      - Kein Eintrag ändert mehr als eine Sache.
      - Fassung 1 ist unverändert gespeichert, Fassung 2 getrennt davon.
    explanation: |
      Hören und Ändern sind getrennt, damit die erste auffällige Stelle nicht alles andere überdeckt. Leise hörst du, was zuerst verschwindet, und das ist oft das, was die Prioritäten im Plan schützen sollten. Der zweite Lautsprecher zeigt, was nur auf deinen Kopfhörern funktioniert. Eine Änderung je Eintrag kostet mehr Hörtests, aber nur so weißt du nach Fassung 2, was gewirkt hat.
    resources:
      - title: Godot Docs · Audio buses, Decibel scale
        url: https://docs.godotengine.org/en/stable/tutorials/audio/audio_buses.html#decibel-scale

  - id: hoertest-ueberarbeitung-2-abschluss
    type: practice
    title: Hörtest 2, Überarbeitung 2 und Abschluss
    prompt: |
      Wiederhol Hörtest und Überarbeitung mit Fassung 2 und speichere Fassung 3. Schließ dann ab: Quellenliste für jede fremde Datei im Abschnitt, Entscheidungsprotokoll vollständig, Sicherung erneuert und einmal wiederhergestellt. Leg Fassung 1 und Fassung 3 nebeneinander, im Spiel nacheinander gespielt, und schreib eine kurze Reflexion: drei Änderungen mit Grund und Wirkung, eine Stelle, die du bewusst nicht geändert hast, und was du beim nächsten Abschnittsplan anders festlegst.
    lang: prose
    starter: |
      Hörtest 2 (Datum, Geräte, Lautstärken, Beobachtungen):

      Überarbeitung 2 (Einträge):

      Fassung 3 gespeichert (wo):

      Quellenliste (Datei, Herkunft, Lizenz mit Version, Nachweis):

      Sicherung und Wiederherstellung (Datum, Ergebnis):

      Reflexion – Änderung 1, 2, 3 (Stelle, vorher, nachher, Grund):

      Bewusst nicht geändert:

      Für den nächsten Abschnittsplan:
    checklist:
      - Fassung 1, 2 und 3 sind getrennt gespeichert und lassen sich im Spiel abspielen.
      - Jede Änderung aus Überarbeitung 2 steht als eigener Eintrag mit Test und Ergebnis im Protokoll.
      - Jede Datei im Abschnitt, die nicht von dir stammt, steht mit Herkunft, Lizenz mit Version und Nachweis in der Quellenliste; jede eigene ist als eigen markiert.
      - Die Sicherung ist nach Fassung 3 erneuert und einmal wiederhergestellt worden, mit Datum.
      - Die Reflexion nennt drei Änderungen mit Stelle, vorher, nachher und Grund, und jeder Grund verweist auf einen Hörtest oder den Plan.
      - Du nennst eine Stelle, die du bewusst nicht geändert hast, und einen Punkt für den nächsten Plan.
    explanation: |
      Der zweite Durchgang zeigt, ob die Änderungen aus dem ersten halten, wenn du mit Abstand hörst. Der Vergleich von Fassung 1 und 3 im Spiel macht sichtbar, wie viel sich bewegt hat, und die bewusst unveränderte Stelle schützt vor dem Reflex, alles zu glätten. Quellenliste und Protokoll sind das, was aus dem Abschnitt ein Portfolio-Stück macht: Jede Datei hat eine Herkunft, jede Entscheidung einen Grund. Der Punkt für den nächsten Plan fließt in deinen nächsten Abschnitt ein.
    resources:
      - title: REAPER User Guide 7.81 · Render to File, Save copy of project (S. 415)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=415
