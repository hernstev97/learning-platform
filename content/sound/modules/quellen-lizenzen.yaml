id: quellen-lizenzen
title: "Quellen und Lizenzen: fremde Klänge sauber dokumentieren"
level: 1
minutes: 80
summary: Welche Lizenzen fremder Klänge zu einem verkauften Spiel passen – CC0, CC BY, BY-SA, BY-NC, ND, Freesound, Sonniss, Splice und Library-EULAs –, wie eine Namensnennung nach TASL aussieht und wie eine Quellenliste jede Datei nachvollziehbar macht. Kein Rechtsrat, aber die Texte, auf die es ankommt.
place: unterwegs
goals:
  - Du unterscheidest CC0, CC BY, BY-SA, BY-NC und BY-ND und begründest mit dem Lizenztext, welche für ein verkauftes Spiel in Frage kommen.
  - Du schreibst eine Namensnennung nach TASL und erkennst unvollständige Credit-Zeilen.
  - Du liest die Bedingungen von Freesound, Sonniss, Splice und Native Instruments auf drei Fragen hin – Spiel erlaubt, Namensnennung nötig, Weitergabe als Datei verboten – und benennst, was offen bleibt.
  - Du führst eine Quellenliste mit Lizenzversion, Abrufdatum und Nachweis und erklärst, warum das Abrufdatum zählt.
  - Du hältst KI-generiertes Material aus deinem Projekt und lässt KI höchstens technische Hilfen liefern.
