lesson: |
  In deinem Projektordner liegt `amb_regen_01.wav`. Du weißt noch, dass er gut klang. Du weißt nicht mehr, ob du ihn aufgenommen, bei Freesound geladen oder aus einem Splice-Pack gezogen hast. Vor einem Release musst du für jede Datei drei Fragen beantworten: Darf sie in ein verkauftes Spiel? Muss jemand genannt werden? Darfst du sie bearbeitet weitergeben? Ohne Notiz von damals beantwortest du keine davon.

  Dieses Modul zeigt, wo die Antworten stehen, zitiert die Texte und baut eine **Quellenliste**: eine Zeile pro Datei, die Herkunft, Lizenz und Nachweis festhält. Welche Klänge du verwendest, entscheidest du.

  > [!NOTE] Kein Rechtsrat
  > Dieses Modul ersetzt keine Rechtsberatung. Es gibt die Texte wieder, die gelten, und sagt, wo sie Fragen offen lassen. Creative Commons und Freesound schreiben über ihre eigenen Zusammenfassungen dasselbe. Im Zweifel fragst du den Rechteinhaber und legst die Antwort zu den Nachweisen.

  ## Eigenes Material zuerst

  Am wenigsten Fragen stellen Klänge, die du selbst gemacht hast: Aufnahmen aus [Feldaufnahme mit dem Handy](/sound/feldaufnahme), Foley, eigene Synthese. Auch sie bekommen eine Zeile in der Quellenliste, mit Datum und Verweis aufs Aufnahmeprotokoll. Dann ist jede Datei im Projekt erklärt, die eigenen wie die fremden.

  Warum fremde Klänge fast nie frei sind: § 85 Abs. 1 UrhG gibt dem Hersteller eines Tonträgers „das ausschließliche Recht, den Tonträger zu vervielfältigen, zu verbreiten und öffentlich zugänglich zu machen“ ([§ 85 UrhG](https://www.gesetze-im-internet.de/urhg/__85.html)). Der Wortlaut knüpft an die Aufnahme an, nicht an ein Kunstwerk; die Rechte an der Aufnahme einer Tür liegen also beim Hersteller der Aufnahme, bei eigenen Aufnahmen bei dir. Freesound warnt in seiner FAQ: „‚free‘ is a tricky concept! Free to do what exactly?“ ([Freesound FAQ](https://freesound.org/help/faq/#licenses)).

  ## Creative Commons: vier Bausteine, sechs Lizenzen

  Creative Commons setzt seine Lizenzen aus Bausteinen zusammen: **BY** (Namensnennung), **SA** (Weitergabe unter gleichen Bedingungen), **NC** (nicht kommerziell) und **ND** (keine Bearbeitungen). Daraus entstehen sechs Lizenzen von CC BY bis CC BY-NC-ND ([Über die CC-Lizenzen](https://creativecommons.org/about/cclicenses/)). **CC0** ist keine dieser Lizenzen, sondern ein Verzicht auf alle Rechte, soweit das gesetzlich möglich ist. Freesound fasst CC0 so zusammen: „you can do pretty much what you want with the sound. You could even sell the sound, ... but you can't claim you are the author!“

  Was die Bausteine für ein verkauftes Spiel heißen, laut den deutschen Kurzfassungen und Lizenztexten:

  | Lizenz | Verkauftes Spiel | Pflicht |
  | --- | --- | --- |
  | CC0 | ja | keine, Herkunft notieren |
  | CC BY | ja | Namensnennung |
  | CC BY-SA | ja, Folgen vorher klären | Nennung, gleiche Lizenz für Bearbeitungen |
  | CC BY-ND | nein bzw. vorher klären | Nennung; Vertonung gilt als Bearbeitung (1a) |
  | alle mit NC | nein | – |

  **BY** verlangt laut [Kurzfassung](https://creativecommons.org/licenses/by/4.0/deed.de): „Sie müssen angemessene Urheber- und Rechteangaben machen, einen Link zur Lizenz beifügen und angeben, ob Änderungen vorgenommen wurden.“ Was genau dazugehört, regelt Abschnitt 3(a) des Lizenztexts.

  **SA** verlangt für Bearbeitungen dieselbe Lizenz. Für Klänge im Spiel ist dabei ein Satz aus Abschnitt 1 der 4.0-Lizenzen wichtig, der für SA und ND gilt: „Im Sinne der vorliegenden Public License entsteht immer abgewandeltes Material, wenn das lizenzierte Material ein Musikwerk, eine Darbietung oder eine Tonaufnahme ist und zur Vertonung von Bewegtbildern verwendet wird“ ([CC BY 4.0, Abschnitt 1a](https://creativecommons.org/licenses/by/4.0/legalcode.de#s1a_adapted_material)). Wie weit „abgewandeltes Material“ in einem Spiel reicht, ist eine Rechtsfrage, die dieser Kurs nicht beantwortet. Bei BY-SA in einem verkauften Spiel klärst du sie vorher oder nimmst einen anderen Klang.

  **NC** definiert der Lizenztext so: „Nicht kommerziell meint nicht vorrangig auf einen geschäftlichen Vorteil oder eine geldwerte Vergütung gerichtet“ ([CC BY-NC 4.0](https://creativecommons.org/licenses/by-nc/4.0/legalcode.de#s1i_noncommercial)). Ein Spiel, das du verkaufst, ist auf Vergütung gerichtet. Freesound fasst es knapper: „you can't earn any money with the piece of work you create!“

  **ND** verbietet, bearbeitete Fassungen zu verbreiten: „Es sei klargestellt, dass Sie gemäß der vorliegenden Public License keine Erlaubnis haben, abgewandeltes Material weiterzugeben“ ([CC BY-ND 4.0, Abschnitt 3a](https://creativecommons.org/licenses/by-nd/4.0/legalcode.de#s3a)). Schneiden, Schichten, Tonhöhe ändern ist Bearbeitung. Und der Satz aus Abschnitt 1a steht auch in dieser Lizenz: Wer eine Tonaufnahme zur Vertonung von Bewegtbildern verwendet, erzeugt immer abgewandeltes Material. Auch ein unbearbeiteter ND-Klang im Spiel kann deshalb als Bearbeitung gelten. Das Creative-Commons-Wiki warnt bei Musik: „Your use of CC-licensed music is often an adaptation!“ Bei BY-ND klärst du die Frage vorher oder nimmst einen anderen Klang.

  Zwei Details gehören in jede Zeile der Quellenliste. Die **Version**: CC BY 3.0 und 4.0 sind verschiedene Texte, auch wenn beide CC BY heißen. Und der **Zeitpunkt**: Die Lizenzen sind laut CC-FAQ unwiderruflich – „once you receive material under a CC license, you will always have the right to use it under those license terms“ ([CC FAQ](https://creativecommons.org/faq/#what-happens-if-the-author-decides-to-revoke-the-cc-license-to-material-i-am-using)). Ändert jemand später die Lizenz seiner Datei, gilt für dich die von damals. Beweisen musst du sie selbst.

  ## Namensnennung nach TASL

  Das Creative-Commons-Wiki empfiehlt, dass eine Namensnennung „the Title, Author, Source, and License“ enthält, kurz **TASL** ([Recommended practices](https://wiki.creativecommons.org/wiki/Recommended_practices_for_attribution)). Für einen Klang von Freesound heißt das:

  ```text
  „<Titel>“ von <nutzername>
  freesound.org/s/<id>/
  Lizenz: CC BY 4.0, <Lizenzlink>
  geändert: geschnitten, Tonhöhe
  ```

  `<Lizenzlink>` ist die Adresse des Lizenztexts, bei CC BY 4.0 `https://creativecommons.org/licenses/by/4.0/`. Abschnitt 3(a)(1)(C) verlangt, den Text der Lizenz oder einen Link darauf beizufügen ([CC BY 4.0, Abschnitt 3a](https://creativecommons.org/licenses/by/4.0/legalcode.de#s3a1C)). Der Link zur Quelle ersetzt ihn nicht.

  Zwei Fallen nennt das Wiki unter „Common pitfalls“. Die Plattform zu nennen statt der Person: „crediting the site where you have found the material cannot substitute crediting the author“. Und den echten Namen zu suchen: Genannt wird der Name, den die Person gewählt hat, auch ein Pseudonym. Bei Freesound ist das der Nutzername.

  Wo die Nennung im Spiel steht, entscheidest du. Das Wiki schlägt für Medien wie Audio und Video eine eigene Webseite mit allen Angaben vor, und Freesound zeigt eine kurze Form für wenig Platz: „uses many sounds from freesound, for the full list see here“ mit Link.

  > [!PRAXIS] Credits in einem veröffentlichten Spiel
  > Freesound verlinkt in seiner FAQ als Beispiel die Seite [Sound Attributions](https://www.minecraft.net/en-us/attribution/sound) von Minecraft. Dort stehen im Oktober 2026 rund 200 Einträge, je einer pro Klang: Titel in Anführungszeichen, „by“ und der Nutzername, darunter die Lizenz mit Version, meist CC BY 3.0 oder CC0 1.0. Auch die CC0-Klänge sind aufgeführt, obwohl CC0 keine Nennung verlangt. So arbeitet auch eine Quellenliste: Jede Datei ist erklärt, auch die ohne Pflicht.

  ## Freesound: eine Lizenz pro Datei

  Auf Freesound wählt jede Person die Lizenz für jeden Klang selbst: CC0, CC BY 4.0 oder CC BY-NC 4.0. Ältere Klänge tragen noch die zurückgezogene Lizenz Sampling+, die Freesound in derselben FAQ so liest: „you can do pretty much what you could do with the attribution noncommercial license“. Freesound fügt hinzu: „We aren't lawyers so this isn't legal advice“. Lies deshalb die Lizenz auf der Seite jeder einzelnen Datei, nie die eines Packs oder Nutzers.

  Wer Klänge anderer bearbeitet und neu hochlädt, ist an deren Lizenz gebunden. Die FAQ hat dafür eine Tabelle: Aus einem CC-BY-Klang darf kein CC0-Klang werden, aus einem BY-NC-Klang kein BY-Klang. Wenn du einen Klang nutzt, den jemand aus einem fremden BY-Klang gebaut hat, nennst du laut FAQ beide.

  Freesound erlaubt auch KI-generierte Klänge: „AI generated audio/sounds created with generative AI models is permitted as long as it is marked with the GenAI tag and the model is indicated in the description.“ Solche Dateien kommen nicht in dein Projekt; prüf Tags und Beschreibung, bevor du lädst.

  ## Sonniss, Splice und Library-EULAs

  Außerhalb von Creative Commons hat jeder Anbieter seinen eigenen Text. Du liest ihn auf drei Fragen hin: Darf der Klang in ein Spiel? Muss jemand genannt werden? Was darfst du mit der Datei selbst nicht tun?

  ### Sonniss GDC Bundle

  Die Lizenz der jährlichen #GameAudioGDC-Bundles liegt im Oktober 2026 in Version 2.0 vor, gültig seit dem 27. August 2026 ([GDC Bundle License](https://sonniss.com/gdc-bundle-license/)). Sie erlaubt die Nutzung „for personal and commercial projects without attribution to the original creator“, synchronisiert im eigenen Projekt, und nennt Spiele ausdrücklich. Verboten ist, die Klänge als Klänge weiterzugeben, „whether the sound effects are unmodified, modified or re-designed“, auch als Teil einer Library, eines Asset-Packs oder einer Projektvorlage: „Re-designed and manipulated sounds remain licensed material under this Agreement.“ Bevor du ein Projekt mit solchen Dateien öffentlich machst, etwa als Repository oder Vorlage, prüfst du diesen Absatz.

  Für die Quellenliste zählt ein weiterer Absatz. Wer vor dem 27. August 2026 geladen hat, für den gilt „the version of this Agreement that was published on the day you downloaded“. Eine Kopie der Lizenz im Download entscheidet nicht, wenn sie von der veröffentlichten abweicht. Ohne Abrufdatum weißt du also nicht, welche Fassung für deine Datei gilt.

  ### Splice

  Die Nutzungsbedingungen von Splice (Stand 24. Juli 2026) erlauben in Abschnitt 3.1.1.2 Klänge in „video games, film or television projects“, auch „used either in isolation as sound effects, loops, and/or sound mixes“ ([Splice Terms](https://splice.com/terms)). Abschnitt 3.1.1.3 verbietet unter anderem, die Klänge „in isolation as sound effects, loops, or as source material for any other form of sample (even if you modify the Sounds)“ weiterzulizenzieren und sie „in new sample packs“ weiterzugeben. Im Spiel darf ein Splice-Klang also allein als Effekt laufen; weitergeben, damit andere ihn nutzen, darfst du ihn nicht.

  Anders als bei CC BY nennst du bei Splice niemanden ohne dessen Erlaubnis. Derselbe Abschnitt verbietet, den Namen eines Künstlers, der mit einem Klang verbunden ist, ohne dessen schriftliche Erlaubnis zu verwenden, ausdrücklich auch als Mitwirkenden. Als Nachweis bietet Splice eine „Certified License“ pro Klang an (Abschnitt 3.1.1); die legst du zu den Nachweisen.

  ### Native Instruments und andere Libraries

  Die EULA von Native Instruments (Fassung vom 1. Juli 2026) erlaubt in Abschnitt 3.7 Samples, Instrumente und Presets „for commercial or non-commercial music and audio productions“ ([NI EULA](https://www.native-instruments.com/en/eula/#gmbh)). Danach: „Individual samples, sound sets or audio loops may not be distributed (commercially or otherwise) standalone. Furthermore these samples, sound sets or audio may not be repackaged in whole or in part as audio samples, sound libraries or sound effects.“

  Für Musik aus Kontakt ist das klar: ein Stück ist eine Produktion. Für einen einzelnen Effekt, den du aus einem Kontakt-Instrument renderst und als WAV ins Spiel legst, ist es offen: Ist das eine Produktion oder ein Sample, das als Soundeffekt weitergegeben wird? Der Text beantwortet das nicht. Frag beim Hersteller nach und leg die Antwort als Nachweis ab. Libraries anderer Hersteller, die in Kontakt laufen, haben eigene Lizenztexte; jeder wird einzeln gelesen.

  > [!MERKE]
  > Eine Lizenz gilt für eine Datei und in der Fassung, unter der du sie bekommen hast. Deshalb stehen Datei, Lizenz mit Version, Abrufdatum und Nachweis in jeder Zeile.

  ## Die Quellenliste: eine Zeile pro Datei

  Die Quellenliste ist eine CSV-Datei neben deinen Audiodateien, zum Beispiel `quellen.csv`, eine Zeile pro Datei im Projekt. Die Spalten:

  | Spalte | Inhalt |
  | --- | --- |
  | datei | Dateiname im Projekt |
  | herkunft | eigen, Freesound, Sonniss … |
  | autor | Name, wie er genannt werden will |
  | lizenz | mit Version, etwa CC BY 4.0 |
  | url | Seite der einzelnen Datei |
  | abgerufen | Datum des Downloads |
  | nachweis | Pfad zur gesicherten Lizenzseite |
  | aenderung | was du geändert hast |
  | credit | fertiger Text für die Credits |

  Eine Zeile, untereinander geschrieben:

  ```text
  datei:     amb_regen_01.wav
  herkunft:  Freesound
  autor:     <nutzername>
  lizenz:    CC BY 4.0
  url:       freesound.org/s/<id>/
  abgerufen: 2026-10-20
  nachweis:  nachweise/regen_01.pdf
  aenderung: geschnitten
  credit:
    „<Titel>“ von <nutzername>,
    freesound.org/s/<id>/,
    CC BY 4.0, <Lizenzlink>,
    geschnitten
  ```

  Den Nachweis sicherst du beim Download: die Seite der Datei mit Lizenz als PDF, die Certified License von Splice, die Lizenzseite von Sonniss am Tag des Downloads. Ein Skript prüft die Liste vor jedem Release auf Lücken. Das Modell unten kennt nur die Regeln aus diesem Modul:

  ```python run
  PFLICHT = ("datei", "herkunft",
             "lizenz", "abgerufen",
             "nachweis")
  BY_ZUSATZ = ("autor", "url",
               "credit")


  def pruefe(z):
      liz = z.get("lizenz", "")
      felder = PFLICHT
      if "BY" in liz:
          felder += BY_ZUSATZ
      m = []  # Meldungen
      for f in felder:
          if not z.get(f):
              m += ["fehlt " + f]
      if "NC" in liz:
          m += ["NC: kein Verkauf"]
      if "ND" in liz:
          m += ["ND: vorher klären"]
      return m or ["ok"]


  klick = dict(
      datei="ui_klick_01.wav",
      herkunft="eigen",
      lizenz="eigen",
      abgerufen="2026-10-24",
      nachweis="protokoll.txt",
  )
  regen = dict(
      datei="amb_regen_01.wav",
      herkunft="Freesound",
      autor="nutzername",
      lizenz="CC BY 4.0",
      url="freesound.org/s/<id>/",
      abgerufen="2026-10-20",
      nachweis="regen_01.pdf",
      aenderung="geschnitten",
      credit="<TASL-Text>",
  )
  holz = dict(
      datei="hit_holz_01.wav",
      herkunft="Freesound",
      autor="nutzer2",
      lizenz="CC BY-NC 4.0",
      url="freesound.org/s/<id>/",
      abgerufen="2026-10-20",
      nachweis="",
      credit="<TASL-Text>",
  )

  for z in [klick, regen, holz]:
      print(z["datei"])
      for meldung in pruefe(z):
          print("-", meldung)
  ```

  Das Skript ersetzt kein Lesen. Es findet nur, was fehlt oder einen Baustein trägt, den du für ein verkauftes Spiel ausschließt oder vorher klärst. Ob eine EULA dein Vorhaben erlaubt, steht in keiner Spalte.

  ### Die KI-Regel in der Quellenliste

  Jeder Klang im Projekt ist deiner oder sauber lizenziert. KI-generierte Klänge oder Musik gehören in keine Zeile, auch nicht als Platzhalter. Das betrifft Dateien mit GenAI-Tag auf Freesound ebenso wie KI-Werkzeuge, die Anbieter neben ihren Bibliotheken anbieten; Splice beschreibt sein „Create Tool“ als „AI-assisted music creation technology“. Umgekehrt verbieten Sonniss, Splice und Native Instruments, ihre Klänge zum Training von KI zu verwenden. Lade lizenzierte Klänge deshalb nicht in Dienste, die damit trainieren könnten.

  KI darf dir Technik abnehmen: ein Prüfskript wie das oben, Spalten umbenennen, eine CSV aus deinen Notizen formatieren. Die Einträge und die Entscheidungen bleiben deine.

  > [!INTERVIEW]
  > „Kurz vor dem Release fragt die Produzentin, ob alle Klänge sauber lizenziert sind. Was antwortest du?“ Gute Antwort, etwa als Audio Designer: Ich zeige die Quellenliste. Jede Datei im Projekt hat eine Zeile mit Herkunft, Lizenz mit Version, Abrufdatum und Nachweis, auch die eigenen Aufnahmen. Ein Skript prüft vor jedem Build auf Lücken und auf NC oder ND. Die Credit-Texte stehen fertig in der Liste. Fälle, die ein Lizenztext offen lässt, habe ich beim Hersteller angefragt und die Antwort abgelegt; bis dahin sind sie markiert und nicht im Build.

  ## Häufige Fehler

  - **Plattform statt Person genannt.** „Klänge: Freesound“ ist keine Namensnennung. Titel, Autor, Quelle, Lizenz.
  - **Lizenz ohne Version.** „CC BY“ reicht nicht; 3.0 und 4.0 sind verschiedene Texte.
  - **Kein Abrufdatum.** Bei Sonniss entscheidet es, welche Fassung gilt; bei CC beweist es, was du bekommen hast.
  - **NC im verkauften Spiel.** Nicht vorrangig auf Vergütung gerichtet – ein Verkauf ist es.
  - **ND unterschätzt.** Schneiden und Pitchen ist Bearbeitung, und schon die Vertonung zählt laut Abschnitt 1a als abgewandeltes Material. Eine ND-Datei kommt nur nach Klärung ins Spiel.
  - **Pack-Lizenz statt Datei-Lizenz.** Auf Freesound hat jede Datei ihre eigene.
  - **Rohdateien veröffentlicht.** Sonniss, Splice und NI verbieten die Weitergabe der Klänge als Klänge, auch bearbeitet.
  - **KI-Klang als Platzhalter.** Platzhalter landen im Release. Nimm einen eigenen Prüfklick.

  ## Zusammenfassung

  - Eigene Aufnahmen zuerst; auch sie bekommen eine Zeile in der Quellenliste.
  - CC0 und CC BY passen laut Text zu einem verkauften Spiel, alles mit NC nicht. BY-SA und BY-ND klärst du vorher, weil Vertonung laut Abschnitt 1a immer abgewandeltes Material erzeugt.
  - Namensnennung nach TASL: Titel, Autor mit gewähltem Namen, Quelle mit Link, Lizenz mit Version und Link, dazu die Änderungen.
  - Freesound: Lizenz pro Datei lesen; Dateien mit GenAI-Tag bleiben draußen.
  - Sonniss und Splice erlauben Spiele ohne Namensnennung und verbieten die Weitergabe der Klänge selbst; bei Splice nennst du ohne Erlaubnis niemanden.
  - Die NI-EULA erlaubt Musik- und Audioproduktionen und verbietet einzelne Samples als Soundeffekte weiterzugeben; einzelne gerenderte Effekte klärst du mit dem Hersteller.
  - Jede Zeile: Datei, Herkunft, Autor, Lizenz mit Version, URL, Abrufdatum, Nachweis, Änderungen, Credit.
  - Kein KI-generiertes Material im Projekt; KI darf Skripte und Formatierung liefern.
exercises:
  - id: was-darf-ins-spiel
    type: choice
    title: Was passt zu einem verkauften Spiel?
    prompt: |
      Du verkaufst dein Spiel. Bei welchen Dateien erlaubt der Lizenztext die Nutzung im Spiel, so wie beschrieben? Mehrere Antworten richtig.
    options:
      - text: Ein CC0-Klang von Freesound, geschnitten und in der Tonhöhe verändert.
        correct: true
        why: Laut CC0-Kurzfassung darfst du das Werk kopieren, verändern und verbreiten, „sogar zu kommerziellen Zwecken“. Die Herkunft notierst du trotzdem.
      - text: Ein CC-BY-4.0-Klang, bearbeitet, mit TASL-Nennung und dem Hinweis auf die Änderung.
        correct: true
        why: BY erlaubt kommerzielle Nutzung und Bearbeitung, solange die Nennung mit Link zur Lizenz und Änderungshinweis da ist.
      - text: Ein CC-BY-NC-4.0-Klang mit vollständiger Nennung.
        correct: false
        why: NC heißt „nicht vorrangig auf einen geschäftlichen Vorteil oder eine geldwerte Vergütung gerichtet“. Ein Verkauf ist auf Vergütung gerichtet; die Nennung ändert daran nichts.
      - text: Ein CC-BY-ND-4.0-Klang, den du mit zwei anderen Klängen schichtest.
        correct: false
        why: Schichten ist Bearbeitung, und laut Abschnitt 1a gilt schon die Vertonung als Bearbeitung. ND verbietet, abgewandeltes Material weiterzugeben, und ein Spiel gibt es weiter.
      - text: Ein Klang aus dem Sonniss-GDC-Bundle in einem eigenen Klang, ohne Namensnennung.
        correct: true
        why: Die Bundle-Lizenz erlaubt kommerzielle Projekte „without attribution to the original creator“, synchronisiert im eigenen Projekt.
    explanation: |
      Entscheidend sind zwei Bausteine: NC schließt den Verkauf aus, ND die Bearbeitung, und als Bearbeitung zählt schon die Vertonung. BY verlangt nur eine korrekte Nennung, CC0 nichts. Sonniss steht außerhalb von Creative Commons und erlaubt Spiele ohne Nennung, verbietet aber die Weitergabe der Klänge selbst. Ob ein Fall passt, hängt am Text der einzelnen Datei; diese Übung prüft das Lesen, keinen Rechtsrat.
    resources:
      - title: Creative Commons · Über die CC-Lizenzen
        url: https://creativecommons.org/about/cclicenses/
      - title: Creative Commons · CC0 1.0, Kurzfassung
        url: https://creativecommons.org/publicdomain/zero/1.0/deed.de
      - title: Sonniss · GDC Game Audio Bundle License
        url: https://sonniss.com/gdc-bundle-license/

  - id: was-die-texte-verbieten
    type: choice
    title: Was die Texte ausdrücklich verbieten
    prompt: |
      Welche Handlungen verbieten die zitierten Texte von Splice und Native Instruments ausdrücklich? Mehrere Antworten richtig.
    options:
      - text: Splice-Klänge, auch bearbeitet, in einem eigenen Sample-Pack weitergeben.
        correct: true
        why: Abschnitt 3.1.1.3 verbietet, Klänge „in new sample packs“ weiterzugeben und sie als Ausgangsmaterial für andere Samples weiterzulizenzieren, „even if you modify the Sounds“.
      - text: Einen Splice-Klang im Spiel allein als Soundeffekt abspielen.
        correct: false
        why: Abschnitt 3.1.1.2 erlaubt Videospiele ausdrücklich, auch „used either in isolation as sound effects“.
      - text: Den Künstler eines Splice-Samples ohne schriftliche Erlaubnis in den Credits nennen.
        correct: true
        why: Splice verbietet, den Namen eines mit einem Klang verbundenen Künstlers ohne schriftliche Erlaubnis zu verwenden, ausdrücklich auch als Mitwirkenden.
      - text: Einzelne Samples aus einer NI-Library als eigene Sound-Library weitergeben.
        correct: true
        why: Abschnitt 3.7 verbietet, Samples „standalone“ zu verbreiten oder als „audio samples, sound libraries or sound effects“ neu zu verpacken.
      - text: Mit einem Kontakt-Instrument ein Musikstück für ein verkauftes Spiel produzieren.
        correct: false
        why: Abschnitt 3.7 erlaubt Samples, Instrumente und Presets „for commercial or non-commercial music and audio productions“.
    explanation: |
      Beide Texte trennen die Nutzung im eigenen Werk von der Weitergabe des Materials. Im Spiel oder Stück darf es klingen; als Datei, die andere wieder als Klang benutzen, darf es nicht weitergehen, auch bearbeitet nicht. Bei Splice kommt hinzu, dass eine gut gemeinte Nennung ohne Erlaubnis gegen die Bedingungen verstößt, das Gegenteil von CC BY.
    resources:
      - title: Splice · Terms of Use, Abschnitt 3.1.1
        url: https://splice.com/terms
      - title: Native Instruments · EULA, Abschnitt 3.7
        url: https://www.native-instruments.com/en/eula/#gmbh

  - id: wen-nennen
    type: choice
    title: Wen nennst du?
    prompt: |
      Auf Freesound hat B einen Klang aus einem CC-BY-Klang von A gebaut und unter CC BY 4.0 hochgeladen. Du nutzt den Klang von B in deinem Spiel. Wen musst du laut Freesound-FAQ nennen?
    lang: text
    code: |
      A  CC BY  → Klang a
      B  CC BY  → Klang b (aus a gebaut)
      du        → nutzt b im Spiel
    options:
      - text: Nur A, weil von A das Ausgangsmaterial stammt.
        correct: false
        why: B hat den Klang bearbeitet und selbst unter CC BY hochgeladen. Auch B ist Lizenzgeber und verlangt eine Nennung.
      - text: Nur B, weil du den Klang von B geladen hast.
        correct: false
        why: Die Nennung von A wandert mit dem Material. Die FAQ sagt ausdrücklich, dass du beide nennst.
      - text: A und B.
        correct: true
        why: Laut FAQ nennt, wer den Klang von B nutzt, „both A and B“.
      - text: Niemanden, weil B einen neuen Klang gebaut hat.
        correct: false
        why: Der neue Klang steht unter CC BY, und er bleibt an die Lizenz von A gebunden. Beides verlangt eine Nennung.
    explanation: |
      Die FAQ sagt: B muss A nennen, und wer den Klang von B nutzt, nennt „both A and B“. Die Namensnennung wandert mit dem Material. In deiner Credit-Zeile stehen also zwei Autoren mit ihren Klängen und Links. Steht auf der Seite von B kein Hinweis auf A, fragst du nach, bevor du den Klang nutzt.
    resources:
      - title: Freesound · FAQ, License restrictions
        url: https://freesound.org/help/faq/#license-restrictions-when-publishing-new-sounds-that-includemodifyremix-other-sounds

  - id: bevor-datei-ins-projekt
    type: order
    title: Bevor eine fremde Datei ins Projekt kommt
    prompt: |
      Bring die Schritte in die Reihenfolge, in der du sie für eine fremde Datei erledigst.
    lang: prose
    lines: |
      Die Lizenz auf der Seite der einzelnen Datei lesen, mit Version
      Prüfen, ob sie zu Verkauf und Bearbeitung passt
      Herunterladen, Abrufdatum notieren und die Lizenzseite als Nachweis sichern
      Eine Zeile in der Quellenliste anlegen, mit fertigem Credit-Text
      Die Datei bearbeiten und die Änderungen in der Zeile nachtragen
    explanation: |
      Erst lesen, dann laden: Passt die Lizenz nicht, sparst du dir Download und Aufräumen. Der Nachweis entsteht im selben Moment wie der Download, denn er soll zeigen, was an diesem Tag galt. Die Zeile kommt vor der Bearbeitung, damit keine Datei ohne Herkunft im Projekt liegt; die Änderungen trägst du nach, weil CC BY und viele Credits sie verlangen.
    resources:
      - title: Creative Commons FAQ · Unwiderruflichkeit
        url: https://creativecommons.org/faq/#what-happens-if-the-author-decides-to-revoke-the-cc-license-to-material-i-am-using

  - id: pruefskript-ausgabe
    type: output
    title: Was meldet das Prüfskript?
    prompt: |
      Das Prüfskript aus der Lektion mit drei neuen Zeilen. Was gibt es aus?
    lang: python
    code: |
      PFLICHT = ("datei", "herkunft",
                 "lizenz", "abgerufen",
                 "nachweis")
      BY_ZUSATZ = ("autor", "url",
                   "credit")


      def pruefe(z):
          liz = z.get("lizenz", "")
          felder = PFLICHT
          if "BY" in liz:
              felder += BY_ZUSATZ
          m = []  # Meldungen
          for f in felder:
              if not z.get(f):
                  m += ["fehlt " + f]
          if "NC" in liz:
              m += ["NC: kein Verkauf"]
          if "ND" in liz:
              m += ["ND: vorher klären"]
          return m or ["ok"]


      wind = dict(
          datei="amb_wind_01.wav",
          herkunft="Freesound",
          lizenz="CC0 1.0",
          abgerufen="2026-10-21",
          nachweis="wind_01.pdf",
      )
      metall = dict(
          datei="hit_metall_02.wav",
          herkunft="Webseite",
          autor="nutzer3",
          lizenz="CC BY-ND 4.0",
          url="<url>",
          abgerufen="2026-10-21",
          nachweis="metall_02.pdf",
          aenderung="Tonhöhe -2",
      )
      whoosh = dict(
          datei="whoosh_01.wav",
          herkunft="Sonniss",
          lizenz="Sonniss 2.0",
          abgerufen="",
          nachweis="sonniss.pdf",
      )

      for z in [wind, metall, whoosh]:
          print(z["datei"])
          for meldung in pruefe(z):
              print("-", meldung)
    expected: |
      amb_wind_01.wav
      - ok
      hit_metall_02.wav
      - fehlt credit
      - ND: vorher klären
      whoosh_01.wav
      - fehlt abgerufen
    hints:
      - CC0 enthält kein „BY“, also gelten nur die fünf Pflichtfelder.
      - Bei der zweiten Zeile prüft das Skript erst die Felder, dann NC, dann ND.
    explanation: |
      Die CC0-Datei hat alle Pflichtfelder und braucht weder Autor noch Credit. Die ND-Datei trägt „BY“ im Namen ihrer Lizenz und braucht deshalb einen Credit-Text, der fehlt; dazu kommt die ND-Meldung, weil schon die Vertonung als Bearbeitung zählt. Die Sonniss-Zeile hat einen Nachweis, aber kein Abrufdatum. Gerade dort zählt es, weil die Fassung vom Tag des Downloads gilt. Das Skript zeigt Lücken; ob es die richtigen Regeln kennt, prüfst du selbst.

  - id: tasl-buchstaben
    type: gap
    title: Wofür TASL steht
    prompt: |
      Ergänze die vier Teile einer Namensnennung nach dem Creative-Commons-Wiki, auf Deutsch.
    lang: prose
    code: |
      T steht für ⟦Titel⟧, A für ⟦Autor⟧, S für ⟦Quelle⟧ mit Link und L für ⟦Lizenz⟧ mit Version.
    gaps:
      - label: T
        hint: Wie heißt der Klang?
        accept: ["Title"]
      - label: A
        hint: Wer hat ihn gemacht, mit gewähltem Namen?
        accept: ["Author", "Autorin", "Urheber", "Urheberin", "Urheberschaft"]
      - label: S
        hint: Wo findet man ihn?
        accept: ["Source", "Herkunft", "Fundort", "Link", "URL"]
      - label: L
        hint: Unter welchen Bedingungen darfst du ihn nutzen?
        accept: ["License", "Licence"]
    explanation: |
      Titel, Autor, Quelle, Lizenz – das Wiki empfiehlt alle vier, wo immer der Lizenzgeber sie angibt. Der Titel ist bei 4.0 nicht mehr Pflicht, bei 3.0 und älter schon. Der Autor ist der Name, den die Person gewählt hat, die Quelle die Seite der einzelnen Datei, die Lizenz steht mit Version und Link. Dazu kommt bei CC BY der Hinweis auf Änderungen.
    resources:
      - title: Creative Commons Wiki · Recommended practices for attribution
        url: https://wiki.creativecommons.org/wiki/Recommended_practices_for_attribution

  - id: remix-tabelle
    type: gap
    title: Was aus einem fremden Klang werden darf
    prompt: |
      Person B baut aus dem Freesound-Klang von Person A einen neuen Klang und will ihn unter einer Lizenz hochladen. Ergänze nach der Tabelle in der Freesound-FAQ, ob das geht: `ja` oder `nein`.
    lang: text
    code: |
      A: cc0    → B: by      ⟦ja⟧
      A: by     → B: cc0     ⟦nein⟧
      A: by     → B: by-nc   ⟦ja⟧
      A: by-nc  → B: by      ⟦nein⟧
      A: by-nc  → B: cc0     ⟦nein⟧
    gaps:
      - label: cc0 zu by
        hint: CC0 verlangt nichts.
        accept: ["Ja", "JA"]
      - label: by zu cc0
        hint: CC0 hieße, auf die Nennung von A zu verzichten.
        accept: ["Nein", "NEIN"]
      - label: by zu by-nc
        hint: Strenger darf B sein, solange A genannt wird.
        accept: ["Ja", "JA"]
      - label: by-nc zu by
        hint: by würde kommerzielle Nutzung erlauben.
        accept: ["Nein", "NEIN"]
      - label: by-nc zu cc0
        hint: Beides fällt weg, NC und Nennung.
        accept: ["Nein", "NEIN"]
    explanation: |
      Die Regel hinter der Tabelle: B darf nur Bedingungen hinzufügen, keine wegnehmen. Aus CC0 darf alles werden. Aus BY wird kein CC0, weil die Nennung von A wegfiele; aus BY-NC kein BY und kein CC0, weil der Ausschluss kommerzieller Nutzung wegfiele. Für dich als Nutzer heißt das: Die Lizenz eines bearbeiteten Klangs sagt nur etwas, wenn B sich an die Tabelle gehalten hat. Prüf bei Remixen auch die Quelle.
    resources:
      - title: Freesound · FAQ, License restrictions
        url: https://freesound.org/help/faq/#license-restrictions-when-publishing-new-sounds-that-includemodifyremix-other-sounds

  - id: credit-zeile
    type: bug
    title: Die Credit-Zeile mit einer Lücke
    prompt: |
      Die Credits deines Spiels für einen bearbeiteten CC-BY-4.0-Klang. Die Person, die den Klang aufgenommen hat, schreibt dir: Ihr Name fehlt. Finde die Zeile.
    lang: text
    code: |
      Credits – Klänge
      „<Titel>“ von Freesound
      freesound.org/s/<id>/
      Lizenz: CC BY 4.0, <Lizenzlink>
      geändert: geschnitten
    lines: [2]
    explanation: |
      Zeile 2 nennt die Plattform statt der Person. Das Creative-Commons-Wiki führt das als Falle: Die Seite, auf der du den Klang gefunden hast, ersetzt nicht die Nennung des Autors. Richtig wäre „„<Titel>“ von <nutzername>“, mit dem Namen, den die Person auf Freesound gewählt hat. Quelle mit Link, Lizenz mit Version und Link und der Änderungshinweis sind vorhanden.
    resources:
      - title: Creative Commons Wiki · Common pitfalls
        url: https://wiki.creativecommons.org/wiki/Recommended_practices_for_attribution#Common_pitfalls

  - id: sonniss-zeile
    type: bug
    title: Welche Fassung gilt?
    prompt: |
      Eine Zeile deiner Quellenliste, untereinander geschrieben. Bei der Prüfung vor dem Release lässt sich für diese Datei nicht belegen, welche Fassung der Sonniss-Lizenz gilt. Finde die Zeile, die das verursacht.
    lang: text
    code: |
      datei:     whoosh_luft_01.wav
      herkunft:  Sonniss GDC Bundle
      lizenz:    GDC Bundle License 2.0
      abgerufen: –
      nachweis:  nachweise/sonniss.pdf
      aenderung: Tonhöhe -3, geschnitten
      credit:    –
    lines: [4]
    explanation: |
      Fassung 2.0 gilt laut Sonniss für Downloads ab dem 27. August 2026. Wer vorher geladen hat, für den gilt die Fassung, die am Tag des Downloads veröffentlicht war. Die Zeile nennt Version 2.0 und einen Nachweis, aber ob 2.0 beim Download schon galt, zeigt nur das Abrufdatum, und das fehlt. Der leere Credit ist kein Fehler, die Bundle-Lizenz verlangt keine Nennung.
    resources:
      - title: Sonniss · GDC Bundle License, Which version applies
        url: https://sonniss.com/gdc-bundle-license/

  - id: abrufdatum-erklaeren
    type: explain
    title: Warum das Datum in jede Zeile gehört
    prompt: |
      Ein Teammitglied hält die Spalte `abgerufen` für überflüssig: „Die Lizenz steht doch auf der Seite.“ Erkläre mit Creative Commons und Sonniss, warum das Datum trotzdem zählt.
    lang: prose
    code: |
      CC FAQ: „once you receive material under a CC license, you will always have the right to use it under those license terms“
      Sonniss: „the version of this Agreement that was published on the day you downloaded is the version that governs your use of those files“
    points:
      - Seiten ändern sich; die Lizenz, die heute dort steht, muss nicht die vom Tag des Downloads sein.
      - Bei CC gilt die Lizenz, unter der du das Material bekommen hast, auch wenn der Autor sie später ändert.
      - Bei Sonniss bestimmt der Tag des Downloads, welche Fassung des Vertrags gilt.
      - Das Datum allein beweist nichts; zusammen mit dem gesicherten Nachweis zeigt es, was damals galt.
    explanation: |
      Die Seite zeigt den Stand von heute. Creative Commons sagt, dass du die Lizenz behältst, unter der du das Material bekommen hast, selbst wenn die Person sie später ändert; dafür musst du wissen, wann das war und was dort stand. Sonniss macht den Tag des Downloads ausdrücklich zur Regel für die Fassung. Abrufdatum und Nachweis gehören deshalb zusammen: Das Datum sagt, welcher Stand zählt, der Nachweis zeigt ihn.
    resources:
      - title: Creative Commons FAQ · Unwiderruflichkeit
        url: https://creativecommons.org/faq/#what-happens-if-the-author-decides-to-revoke-the-cc-license-to-material-i-am-using
      - title: Sonniss · GDC Game Audio Bundle License
        url: https://sonniss.com/gdc-bundle-license/

  - id: eula-offen
    type: explain
    title: Ein Kontakt-Effekt im Spiel
    prompt: |
      Du renderst aus einem Kontakt-Instrument einen kurzen Effekt und willst ihn als WAV ins Spiel legen. Erkläre anhand des Auszugs aus Abschnitt 3.7 der NI-EULA, was klar ist, was offen bleibt und was du tust.
    lang: prose
    code: |
      The provided samples, instruments and presets can be used for commercial or non-commercial music and audio productions […]. Individual samples, sound sets or audio loops may not be distributed (commercially or otherwise) standalone. Furthermore these samples, sound sets or audio may not be repackaged in whole or in part as audio samples, sound libraries or sound effects.
    points:
      - Klar erlaubt sind Musik- und Audioproduktionen, auch kommerziell.
      - Klar verboten ist, Samples einzeln oder als Library oder Soundeffekte weiterzugeben.
      - Offen ist, ob ein einzelner gerenderter Effekt im Spiel eine Produktion ist oder ein weitergegebener Soundeffekt.
      - Du fragst beim Hersteller nach, legst die Antwort als Nachweis ab und markierst die Datei bis dahin in der Quellenliste.
    explanation: |
      Ein Stück, das mit Kontakt entstanden ist, ist eine Produktion und fällt unter die Erlaubnis. Ein Ordner mit einzelnen Samples fällt klar unter das Verbot. Ein einzelner Effekt, der als WAV im Spielpaket liegt, steht dazwischen: Er ist Teil des Spiels, aber er ist auch eine einzelne Datei, die man herausholen kann. Der Text entscheidet das nicht, also entscheidest du es nicht allein. Eine schriftliche Antwort des Herstellers ist der Nachweis; bis sie da ist, bleibt die Datei markiert.
    resources:
      - title: Native Instruments · EULA, Abschnitt 3.7
        url: https://www.native-instruments.com/en/eula/#gmbh

  - id: eigene-quellenliste
    type: practice
    title: Deine Quellenliste beginnen
    prompt: |
      Leg deine Quellenliste an, am Handy reicht eine Notiz. Trag mindestens drei Zeilen ein: deine Aufnahmen aus [Feldaufnahme mit dem Handy](/sound/feldaufnahme) und eine fremde Datei, die du verwenden möchtest oder schon verwendest. Welche Dateien, entscheidest du.
    lang: prose
    hints:
      - Spalten aus der Lektion, untereinander geschrieben, sind am Handy gut lesbar.
      - Für eine Datei, die du noch nicht geladen hast, fehlt das Abrufdatum. Das ist der Moment, den Nachweis zu sichern.
    checklist:
      - Jede Zeile hat Datei, Herkunft und Lizenz; das Abrufdatum steht da oder ist als offen markiert.
      - Die Lizenz steht mit Version, oder bei eigenem Material steht „eigen“ mit Verweis aufs Protokoll.
      - Für die fremde Datei hast du notiert, wo der Nachweis liegt oder dass du ihn noch sichern musst.
      - Bei einer CC-BY-Datei steht ein fertiger Credit-Text nach TASL in der Zeile.
      - Keine Zeile enthält eine KI-generierte Datei.
    explanation: |
      Die Liste wächst mit dem Projekt. Wer sie ab der ersten Datei führt, muss vor dem Release nichts rekonstruieren. Eigene Aufnahmen gehören hinein, damit jede Datei im Projekt erklärt ist. Wie du die Liste später als CSV neben die Audiodateien legst und prüfst, zeigt das Skript in der Lektion; in der [Werkstatt](/sound/werkstatt-audioabschnitt) ist sie Teil der Abgabe.
    resources:
      - title: Freesound · FAQ, How do I credit
        url: https://freesound.org/help/faq/#how-do-i-creditattribute
