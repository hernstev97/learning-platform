lesson: |
  Du nimmst am Küchentisch einen Klatscher auf, als Prüfmuster für [Audio zuordnen](/godot/audio). Mit Kopfhörern hörst du danach: eine halbe Sekunde Rascheln, dann den Klatscher, oben abgeschnitten, dahinter den Kühlschrank und eine Stimme aus dem Nebenzimmer. Am Tisch war nichts davon laut. Das Handy hat aufgenommen, was im Raum war, und die App hat noch etwas dazugetan.

  Eine **Feldaufnahme** ist eine Aufnahme außerhalb des Studios, hier mit dem Handy. Pegel, Mikrofonabstand und Raum kennst du aus der Musik. Für Spielgeräusche kommt hinzu: Du brauchst von jedem Klang mehrere brauchbare Takes, saubere Pausen für den Schnitt, einen Room Tone zum Füllen und ein Protokoll, mit dem du in drei Monaten noch weißt, welche Datei was ist. Dieses Modul zeigt, wie das mit Handy und Kopfhörern geht. Was du aufnimmst, entscheidest du. Säubern und Schneiden kommt in [REAPER als Werkbank](/sound/reaper-werkbank).

  ## Das Handy als Recorder: erst die App prüfen

  Aufnahme-Apps sind für Sprache gebaut. Viele bearbeiten den Klang schon während der Aufnahme: Sie filtern Hintergrund weg, regeln den Pegel nach oder speichern verlustbehaftet. Für eine Notiz ist das praktisch. Für Rohmaterial ist es ein Eingriff, den du später nicht zurücknimmst. Prüf deshalb vor der ersten Session vier Punkte:

  | Punkt | Wonach du suchst |
  | --- | --- |
  | Format | verlustfrei (WAV, FLAC) oder verlustbehaftet (AAC, MP3)? |
  | Filter | Rauschunterdrückung, Sprachfilter |
  | Pegel | Regler, Automatik oder nichts? |
  | Kanäle | Mono, Stereo, 3D |

  Für Sprachmemos auf dem iPhone beschreibt Apple im Handbuch zu iOS 27:

  - Den Pegel stellst du über den Abstand ein: „Verringere oder vergrößere den Abstand des Mikrofons zur aufgezeichneten Audioquelle, um den Aufnahmepegel anzupassen“ ([Aufnahme mit Sprachmemos](https://support.apple.com/de-de/guide/iphone/iph4d2a39a3b/ios#iph30340c381)). Einen Regler nennt die Anleitung nicht.
  - Im Kontrollzentrum wählst du zwischen „Stimmisolation“, die Hintergrundgeräusche herausfiltert, und „Breites Spektrum“, das sie einbezieht. „Breites Spektrum“ gibt es nicht auf allen Modellen. Bei Geräuschen ist der „Hintergrund“ oft der Klang, den du willst.
  - Unter Einstellungen → Apps → Sprachmemos → „Aufnahmemodus“ stehen Mono, Stereo und 3D-Audio ([Aufnahmemodus](https://support.apple.com/de-de/guide/iphone/iph4d2a39a3b/ios#iphc30ff1a19)). Auf unterstützten Modellen nimmt das eingebaute Mikrofon laut derselben Seite automatisch in 3D-Audio auf.
  - „Aufnahme optimieren“ reduziert beim Abspielen Hintergrundgeräusche und Echo, „Studio-Sound“ Hintergrund und Hall in 3D-Audioaufnahmen ([Aufnahme wiedergeben](https://support.apple.com/de-de/guide/iphone/iphebbd067ce/ios#iph4b15d91b6)). Für Rohmaterial bleiben beide aus.

  In welchem Format und mit welcher Abtastrate Sprachmemos speichert, steht auf diesen Seiten nicht. Prüf es an einer Probedatei auf dem PC. Auf Android hängen Format, Filter und Pegelautomatik an Hersteller und App. Such in deiner App nach den vier Punkten und notier, was du findest und was sie nicht anzeigt.

  Warum der Aufwand? Die Godot-Doku trennt Quelle und Spieldatei: „While keeping pristine-quality audio sources is important if you're performing editing, using the same quality in the exported project is not necessary“ ([Best practices](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#best-practices)). Dieselbe Seite sagt, eine Abtastrate über 48 kHz bringe im Spiel nur etwas, wenn du den Ton zur Laufzeit verlangsamst. Für die Aufnahme ist das eine eigene Frage. Der Sounddesigner Jamie Hardt nimmt kurze Klänge nach eigener Aussage möglichst mit 192 kHz auf, Hintergründe mit 96 oder 48 kHz ([A Sound Effect](https://www.asoundeffect.com/jamie-hardt-field-recording-immersive-audio/)). Was dein Handy kann, zeigt die Probedatei.

  > [!TIP] Der erste Take ist ein Prüfmuster
  > Fang jede Session mit einem Klatscher an. Er zeigt dir beim Abhören, ob die App filtert, ob der Pegel reicht und ob die Datei vorne Stille hat. Ein kurzer, trockener Klatscher ohne Stille am Anfang ist zugleich der Prüfklick für [Audio zuordnen](/godot/audio). Er ist ein Messwerkzeug, kein Klang für dein Spiel.

  ## Pegel: Übersteuern lässt sich nicht reparieren

  Headroom kennst du aus der Musik. Im Feld gilt er strenger: Ein Klang, der einmal passiert, kommt nicht wieder, und eine übersteuerte Spitze bleibt abgeschnitten. Kurze Schläge sind tückisch, weil ihre Spitze weit über dem liegt, was du als Lautstärke wahrnimmst. Eine App ohne Pegelanzeige verrät dir das erst beim Abhören.

  Leiser aufnehmen und später anheben hilft nicht. NPR Training antwortet auf diese Frage: „Recording at a lower level will not record less background noise. It will simply record — at a lower level — the same ratio of direct sound (your subject speaking) to background sound“ ([Audio production FAQ](https://training.npr.org/2017/05/19/audio-production-faq-headphones-levels-mics/)). Dazu kommt das Rauschen der Elektronik, das beim Anheben mitkommt. Das Verhältnis zum Hintergrund änderst du nur über den Abstand.

  Am Handy heißt das: Probe-Take mit dem lautesten Moment, den du erwartest, abhören, Abstand anpassen, erst dann die Takes. NPR beginnt seine Checkliste mit „Always wear your headphones. If you can't hear problems, you can't prevent them“ ([Field recording checklist](https://training.npr.org/2017/06/30/get-great-sound-every-time-with-this-field-recording-checklist/)).

  > [!WARNING] Kopfhörer mit Funk oder Geräuschunterdrückung
  > NPR rät für die Feldarbeit von Bluetooth- und Noise-Cancelling-Kopfhörern ab: Bluetooth reduziert die Qualität für die Übertragung, die Geräuschunterdrückung kann verdecken, was du aufnimmst. Schalt die Unterdrückung zum Abhören aus und hör heikle Takes später am PC noch einmal.

  ## Abstand, Raum und Perspektive

  Das Abstandsgesetz kennst du aus der Musik. Am Handy zählt es mehr: Wo die App keinen Pegelregler hat, wie Sprachmemos laut Anleitung, ist der Abstand dein einziger Regler. Eine punktförmige Quelle verliert mit jeder Verdopplung des Abstands etwa 6 dB, in der Praxis laut Hugh Robjohns „rarely as much as 6dB per doubling of distance“ ([Sound On Sound](https://www.soundonsound.com/sound-advice/q-does-strength-proximity-effect-depend-volume-source)). Der Hintergrund – Kühlschrank, Straße, Raumhall – bleibt dabei ungefähr gleich laut. Das Modell rechnet aus, wie viel Vorsprung vor dem Hintergrund bleibt; die 30 dB bei 10 cm sind ein Platzhalter:

  ```python run
  from math import log10

  REF = 10         # cm, Platzhalter
  VORSPRUNG = 30   # dB, Platzhalter

  for d in [10, 20, 40, 80, 160]:
      verlust = 20 * log10(d / REF)
      vor = VORSPRUNG - verlust
      print(f"{d} cm: {vor:.1f} dB")
  ```

  Bei 160 cm sind von 30 dB noch 5,9 übrig. Den Nahbesprechungseffekt kennst du ebenfalls; welche Bauart das Mikrofon deines Handys hat, steht aber meist nirgends. Hör es dir an: derselbe Klang bei 5, 20 und 50 cm.

  Raumhall in der Datei ist für Spiele ein eigenes Problem. Die Godot-Doku empfiehlt auf der schon zitierten Seite, Hall über Busse im Spiel zu erzeugen, statt ihn in die Datei zu backen; die Abwägung steht in [Klangformung](/sound/klangformung). Hall lässt sich im Spiel dazugeben, aber nicht herausnehmen, und ein Take mit Badhall klingt in jedem Raum des Spiels nach Bad. Für die Aufnahme heißt das: nah ran, und ein Raum mit Polstern, Vorhängen und Kleidung wirft weniger zurück als ein Bad.

  Für Spiele zählt auch die Perspektive. Watson Wu nimmt Waffen für Filme nach den Winkeln der Szenen auf, für Spiele dagegen „multiple perspectives such as close, medium, far, and incoming“ ([A Sound Effect](https://www.asoundeffect.com/weapon-sound-effects-recording/)). Ob du nahe und ferne Fassungen brauchst, hängt an deinem Spiel. Am Handy kostet ein zweiter Abstand einen Take.

  ## Wind, Griffgeräusche und Störungen

  Wind ist bewegte Luft direkt an der Mikrofonöffnung. Er klingt als tiefes Rumpeln, das sich später kaum sauber entfernen lässt. NPR: „Omnidirectional microphones experience less wind noise and handle p-pops better than cardioids and shotguns“ ([Which mic should I use?](https://www.npr.org/sections/npr-training/2025/05/28/g-s1-66934/which-mic-should-i-use-mics-part-1)). Was dein Handy hat, weißt du nicht. Schütz es mit deinem Körper, einer Wand oder einem Hauseingang.

  Griffgeräusche sind Schall, der über das Gehäuse ins Mikrofon kommt. NPR beschreibt „fingers sliding across the surface of the mic or tendons and bones creaking“ und warnt, dass das gern bei leisen Atmos auftaucht. Am Handy heißt das: nicht in der Hand halten, sondern auf eine weiche Unterlage legen, Finger weg von der Mikrofonöffnung.

  Störungen planst du weg: Kühlschrank aus und danach wieder an, Fenster zu, Benachrichtigungen aus. Die Start- und Stopptöne von Sprachmemos schaltest du laut derselben Apple-Anleitung mit dem Stummmodus ab. NPR schreibt, bei Nachrichten und Dokumentationen schade ein Hochpassfilter im Feld nie. Bei Spielgeräuschen sitzt das Gewicht oft unten; diesen Schnitt machst du besser später in REAPER, wo er sich zurücknehmen lässt.

  ## Ansage, Takes, Room Tone und Protokoll

  Eine **Ansage** (Slate) ist laut Sound On Sound „a verbal identification recorded just before each take to help identify it subsequently“ ([Glossar](https://www.soundonsound.com/glossary/slate)). Du sagst vor jedem Take kurz, was kommt, und lässt danach Stille, damit sich Stimme und Klang beim Schneiden trennen lassen:

  ```text
  „Take vier, Schublade,
   zwanzig Zentimeter, langsam“
  – 2 s Stille –
  Schublade auf, Schublade zu
  – ausklingen lassen, 3 s –
  ```

  Nimm gleich mehrere Takes auf. Im Spiel läuft ein Klang oft viele Male hintereinander, und identische Wiederholungen fallen auf. Wu schreibt dazu: „Video games are non-linear so more variation sounds are often needed.“ Wie viele Varianten ein Klang braucht, leitest du aus der Cue-Liste ab ([Vom Ereignis zur Cue-Liste](/sound/klangplan)). Was du daraus baust, kommt in [Layering und Varianten](/sound/layering-varianten). Bei der Aufnahme gilt: lieber ein Take zu viel.

  Ein **Room Tone** ist eine Aufnahme des Raums ohne Aktion, mit derselben Position und demselben Pegel wie die Takes. Du brauchst ihn, um Lücken im Schnitt zu füllen und in REAPER ein Rauschprofil zu nehmen. NPR nennt ihn „probably the most commonly forgotten audio element“, empfiehlt für Reportagen 90 Sekunden pro Szene und gibt die Regel dazu: „keep your microphone in the same place it was in during the interview and don't adjust levels on the recorder“. Der Kurs nimmt 30 Sekunden als Platzhalter. Bei 48 kHz sind das 1 440 000 Samples.

  > [!PRAXIS] Profis nehmen auch mit dem Telefon auf
  > Jamie Hardt erzählt, dass er ein Stereomikrofon für das iPhone immer an der Tasche trägt: „a lot of the short sounds in my library are from that“. Watson Wu benennt seine Waffenaufnahmen nach einem festen Schema aus Waffentyp, Name, Kaliber, Schussart, Perspektive und Versionsnummer. Beides zusammen ist der Kern einer Session: Aufnahmen, die du jederzeit machen kannst, und Namen, die dir sagen, was drin ist.

  ### Das Aufnahmeprotokoll

  Ein Aufnahmeprotokoll hält fest, was du aufgenommen hast, solange du es noch weißt. Eine Zeile pro Take reicht, im Notizprogramm des Handys:

  ```text
  2026-10-24  Küche, Fenster zu
  Handy, App: Sprachmemos
  Breites Spektrum, Mono
  T1–T3  Schublade  20 cm
  T4–T5  Schublade  60 cm
  T6     Room Tone 30 s, Stelle T1
  Notiz: T2 Kühlschrank lief noch
  ```

  Die Ansage im Take und die Zeile im Protokoll sagen dasselbe. Fehlt eins, rettet dich das andere. Benenne die Rohdatei nach der Session nach einem eigenen Schema, etwa mit Datum, Ort und Gegenstand. Das Platzhalter-Schema `<kategorie>_<objekt>_<aktion>_<nn>.wav` aus [Vom Ereignis zur Cue-Liste](/sound/klangplan) gilt erst für die geschnittenen Varianten aus [REAPER als Werkbank](/sound/reaper-werkbank), eine Datei pro Variante. Eine Session-Datei enthält dagegen mehrere Takes und den Room Tone. Die Originaldatei überschreibst du nie. Sprachmemos bietet nach dem Kürzen „Als neue Aufnahme sichern“ an, das laut Apple das Original unverändert lässt ([Sprachaufnahme bearbeiten](https://support.apple.com/de-de/guide/iphone/iphc9bdaee83/ios#iph80099e945)).

  Wie viel Platz Rohmaterial braucht, rechnest du aus Abtastrate, Bittiefe und Kanälen. Eine unkomprimierte WAV-Datei speichert jeden Sample-Wert:

  ```python run
  # MB pro Minute, unkomprimiert
  def mb_min(rate, bits, ch):
      pro_s = rate * bits // 8 * ch
      return pro_s * 60 / 1_000_000

  formate = [
      (48000, 24, 1),
      (48000, 24, 2),
      (44100, 16, 2),
  ]
  print("Hz Bit Kanäle MB/min")
  for rate, bits, ch in formate:
      mb = mb_min(rate, bits, ch)
      print(rate, bits, ch, mb)
  ```

  Eine Stunde Mono mit 48 kHz und 24 Bit sind rund 518 MB. Übertrag die Originaldatei auf den PC und prüf dort, ob Format, Abtastrate und Länge zu deinem Protokoll passen.

  ## Fremde Stimmen und fremder Grund

  Stimmen anderer Menschen gehören nicht in deine Aufnahmen. § 201 Abs. 1 StGB bestraft, „wer unbefugt 1. das nichtöffentlich gesprochene Wort eines anderen auf einen Tonträger aufnimmt oder 2. eine so hergestellte Aufnahme gebraucht oder einem Dritten zugänglich macht“ ([§ 201 StGB](https://www.gesetze-im-internet.de/stgb/__201.html)). Was im Einzelfall „nichtöffentlich“ ist, ist eine Rechtsfrage. Dieser Kurs gibt keinen Rechtsrat. Er gibt dir eine Arbeitsregel, die ohne Juristen auskommt:

  - Keine verständlichen Stimmen Dritter. Hörst du beim Abhören eine, schneidest du die Stelle heraus und löschst das Original mit ihr.
  - Musik aus einem Radio oder Laden im Hintergrund gehört jemandem. Warum, steht in [Quellen und Lizenzen](/sound/quellen-lizenzen).
  - Auf fremdem Grund fragst du vorher, auch im Hausflur.

  > [!INTERVIEW]
  > „Wie bereitest du eine Aufnahme für Spielgeräusche vor?“ Gute Antwort, etwa als Sound Designer: Ich prüfe vorher, ob das Gerät verlustfrei und ohne Filter aufnimmt, und mache einen Probe-Take für den Pegel. Ich nehme nah auf, sage jeden Take an und nehme mehrere Takes und Abstände auf, weil das Spiel Varianten braucht. Am Ende kommt Room Tone mit derselben Position und demselben Pegel. Ich führe ein Protokoll, benenne die Rohdateien nach Datum, Ort und Gegenstand und erst die geschnittenen Varianten nach dem Schema des Projekts. Stimmen Dritter nehme ich nicht auf.

  ## Häufige Fehler

  - **Filter der App an.** „Stimmisolation“ oder Rauschunterdrückung können den Hintergrund wegnehmen, der ein Geräusch ausmacht. Vorher prüfen, Probe-Take hören.
  - **Zu leise, um sicher zu sein.** Der Hintergrund kommt beim Anheben mit, das Rauschen der Elektronik dazu. Näher ran statt leiser.
  - **Handy in der Hand.** Griffgeräusche und ein Daumen auf der Öffnung. Auf eine weiche Unterlage legen.
  - **Kein Room Tone oder ein anderer.** Room Tone von einer anderen Stelle oder mit anderem Pegel passt nicht zu den Takes.
  - **Takes ohne Ansage.** Nach zwei Wochen weißt du nicht mehr, welcher Take der nahe war.
  - **Original überschrieben.** Kürzen ist gut, Überschreiben nicht. Als neue Aufnahme sichern.
  - **Eine Stimme im Hintergrund.** Herausschneiden und das Original löschen.

  ## Zusammenfassung

  - Aufnahme-Apps sind für Sprache gebaut. Prüf Format, Filter, Pegelregelung und Kanäle, bevor du Rohmaterial aufnimmst.
  - Bei Sprachmemos stellst du den Pegel laut Apple über den Abstand ein; „Breites Spektrum“ behält den Hintergrund, „Stimmisolation“ filtert ihn.
  - Übersteuern ist endgültig. Leiser aufnehmen ändert das Verhältnis zum Hintergrund nicht, nur der Abstand tut das.
  - Jede Verdopplung des Abstands kostet bis zu 6 dB Vorsprung vor dem Hintergrund: nah ran, nah bleiben.
  - Hall lässt sich im Spiel dazugeben, aber nicht aus der Datei nehmen. Nimm möglichst trocken auf.
  - Ansage, mehrere Takes, Room Tone mit gleicher Position und gleichem Pegel, eine Protokollzeile pro Take.
  - Eine Minute Mono-WAV mit 48 kHz und 24 Bit sind 8,64 MB. Originale bleiben unverändert.
  - Keine verständlichen Stimmen Dritter; § 201 StGB nennt den Rahmen, der Kurs ersetzt keinen Rechtsrat.
exercises:
  - id: app-pruefen
    type: choice
    title: Was die App vorher verraten muss
    prompt: |
      Du willst mit dem Handy Rohmaterial für Spielgeräusche aufnehmen. Welche Aussagen stimmen? Mehrere Antworten richtig.
    options:
      - text: Du prüfst, ob die App verlustfrei speichert, etwa als WAV oder FLAC, oder verlustbehaftet als AAC oder MP3.
        correct: true
        why: Verlustbehaftete Formate werfen Information weg, die du beim Bearbeiten nicht zurückbekommst. Die Godot-Doku rät, Quellen in hoher Qualität zu behalten, solange du sie bearbeitest.
      - text: In Sprachmemos stellst du den Pegel laut Apple über den Abstand zum Mikrofon ein.
        correct: true
        why: So steht es im iPhone-Handbuch. Einen Regler beschreibt die Anleitung nicht.
      - text: „Stimmisolation“ ist für Geräusche die bessere Wahl, weil sie das Rauschen entfernt.
        correct: false
        why: Sie filtert laut Apple Hintergrundgeräusche heraus. Bei Geräuschen ist der Hintergrund oft der Klang, den du willst. „Breites Spektrum“ bezieht ihn ein.
      - text: Unter 192 kHz taugt eine Aufnahme nicht für Spiele.
        correct: false
        why: Laut Godot-Doku bringt eine Abtastrate über 48 kHz im Spiel nur etwas, wenn du den Ton zur Laufzeit verlangsamst. Ob du für späteres Herunterstimmen höher aufnimmst, ist deine Entscheidung, keine Pflicht.
      - text: Eine leise Aufnahme ist die sichere Wahl, weil man sie später ohne Nachteil anhebt.
        correct: false
        why: Beim Anheben kommen Hintergrund und Rauschen der Elektronik mit. NPR schreibt, leiser aufnehmen nehme nicht weniger Hintergrund auf, sondern dasselbe Verhältnis, nur leiser.
    explanation: |
      Die App entscheidet mit, was in der Datei landet. Format und Filter wirken, bevor du irgendetwas hörst, und lassen sich später nicht zurücknehmen. Der Pegel hängt bei Sprachmemos am Abstand, das ist zugleich das Werkzeug gegen Hintergrund. Eine hohe Abtastrate ist eine Option, kein Muss; ein sauberer, naher, unverfälschter Take zählt mehr.
    resources:
      - title: Apple Support · Hintergrundgeräusche filtern
        url: https://support.apple.com/de-de/guide/iphone/iph4d2a39a3b/ios#iph896bc6087
      - title: Godot Docs · Importing audio samples, Best practices
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#best-practices

  - id: ablauf-session
    type: order
    title: Eine Session von vorn bis hinten
    prompt: |
      Bring die Schritte einer kurzen Aufnahme-Session in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      App-Einstellungen prüfen und einen Klatscher als Probe aufnehmen
      Die Probe mit Kopfhörern anhören und den Abstand anpassen
      Aufnahme starten, den ersten Take ansagen, zwei Sekunden warten
      Mehrere Takes aufnehmen, nah und weiter weg, jeder mit Ansage
      Ohne das Handy zu bewegen 30 Sekunden Room Tone aufnehmen
      Die Takes im Protokoll nachtragen und die Datei umbenennen
    explanation: |
      Erst prüfen, dann aufnehmen: Die Probe zeigt Filter und Pegel, bevor ein echter Take verloren geht. Ansage und Stille kommen vor jeden Take. Der Room Tone folgt direkt nach den Takes, solange Position und Pegel noch dieselben sind; danach bewegst du das Handy. Das Protokoll schreibst du zum Schluss fertig, solange du dich noch erinnerst.
    resources:
      - title: NPR Training · Field recording checklist
        url: https://training.npr.org/2017/06/30/get-great-sound-every-time-with-this-field-recording-checklist/

  - id: arbeitsregel-stimmen
    type: choice
    title: Welche Aufnahme behältst du nicht so?
    prompt: |
      Die Arbeitsregel des Moduls: keine verständlichen Stimmen Dritter; ist doch eine drin, Stelle herausschneiden und Original löschen. Welche Aufnahmen verstoßen gegen die Regel, so wie sie sind? Mehrere Antworten richtig.
    options:
      - text: Im Café nimmst du Geschirrklappern auf. Am Nebentisch versteht man zwei Leute, die sich unterhalten.
        correct: true
        why: Verständliche Stimmen Dritter. Herausschneiden oder die Aufnahme verwerfen und das Original löschen.
      - text: In deiner Wohnung nimmst du allein Schubladen und Türen auf.
        correct: false
        why: Keine fremden Stimmen, eigener Raum. Hier gibt es nichts zu entscheiden.
      - text: Ein Take vom Balkon, auf dem der Nachbar am Telefon verständlich zu hören ist, aber nur leise.
        correct: true
        why: Leise ist nicht unverständlich. Die Regel fragt, ob man die Worte versteht.
      - text: Du sprichst selbst die Ansage vor jedem Take.
        correct: false
        why: Deine eigene Stimme ist keine Stimme Dritter. Die Ansage schneidest du später ohnehin ab.
    explanation: |
      § 201 StGB schützt das nichtöffentlich gesprochene Wort; was im Einzelfall darunterfällt, beantwortet dieser Kurs nicht. Die Arbeitsregel ist enger als jede Auslegung und deshalb ohne Jurist anwendbar: Was man verstehen kann, kommt nicht in deine Dateien. So musst du später nicht entscheiden, ob eine Stelle heikel ist.
    resources:
      - title: Gesetze im Internet · § 201 StGB
        url: https://www.gesetze-im-internet.de/stgb/__201.html

  - id: naeher-ran
    type: output
    title: Vom Tisch näher heran
    prompt: |
      Im Modell aus der Lektion liegt dein Klang bei 40 cm 12 dB über dem Hintergrund. Der Hintergrund bleibt gleich laut. Was gibt das Programm aus?
    lang: python
    code: |
      from math import log10

      # Platzhalter
      vorsprung = 12.0  # dB bei 40 cm
      for d in [40, 20, 10]:
          gewinn = 20 * log10(40 / d)
          v = vorsprung + gewinn
          print(d, round(v, 1))
    expected: |
      40 12.0
      20 18.0
      10 24.0
    hints:
      - 20 × log10(2) ist etwa 6.
    explanation: |
      Jede Halbierung des Abstands bringt im Modell 6 dB, von 40 auf 10 cm also 12 dB mehr Vorsprung. Laut Robjohns ist der echte Gewinn meist kleiner, weil kaum eine Quelle punktförmig ist. Die Richtung stimmt trotzdem, und sie ist der einzige Hebel: Am Pegel der App zu drehen ändert den Vorsprung nicht. Nähe hat ihren eigenen Preis, bei Richtmikrofonen den Nahbesprechungseffekt.
    resources:
      - title: Sound On Sound · Abstand und Nahbesprechungseffekt
        url: https://www.soundonsound.com/sound-advice/q-does-strength-proximity-effect-depend-volume-source

  - id: speicher-pro-minute
    type: output
    title: Wie groß wird die Datei?
    prompt: |
      Du nimmst eine Minute in Stereo mit 48 kHz und 24 Bit auf, unkomprimiert. Was gibt das Programm aus?
    lang: python
    code: |
      rate = 48000
      bits = 24
      kanaele = 2
      sekunden = 60
      pro_s = rate * bits // 8 * kanaele
      groesse = pro_s * sekunden
      print(groesse)
      mb = groesse / 1_000_000
      print(round(mb, 2), "MB")
    expected: |
      17280000
      17.28 MB
    hints:
      - 24 Bit sind 3 Byte. Pro Sekunde also 48 000 × 3 × 2.
    explanation: |
      Pro Sekunde fallen 48 000 Samples je Kanal an, jeder mit 3 Byte, bei zwei Kanälen 288 000 Byte. Mal 60 sind das 17 280 000 Byte, gut 17 MB pro Minute, doppelt so viel wie Mono. Für Klänge, die im Spiel einen Ort haben, brauchst du später ohnehin Mono (siehe [Klangformung](/sound/klangformung)). Ob du stereo aufnimmst und später zusammenfasst, entscheidest du; die Rechnung sagt dir, was es kostet.
    resources:
      - title: Godot Docs · Supported audio formats (Größenvergleich)
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#supported-audio-formats

  - id: samples-rechnen
    type: gap
    title: Sekunden, Frames und Samples
    prompt: |
      Ergänze die Werte für eine Aufnahme mit 48 kHz. Ganze Zahlen ohne Tausenderpunkte.
    lang: text
    code: |
      Room Tone 30 s = ⟦1440000⟧ Samples
      Stille 2 s     = ⟦96000⟧ Samples
      1 Frame (60/s) = ⟦800⟧ Samples
      24 Bit mono    = ⟦144000⟧ Byte/s
    gaps:
      - label: 30 s
        hint: 30 × 48 000
        accept: ["1.440.000", "1 440 000"]
      - label: 2 s
        hint: 2 × 48 000
        accept: ["96.000", "96 000"]
      - label: 1 Frame
        hint: 48 000 / 60
      - label: Byte pro Sekunde
        hint: 48 000 × 3 Byte
        accept: ["144.000", "144 000"]
    explanation: |
      Abtastrate mal Sekunden ergibt Samples. Ein Frame bei 60 Frames pro Sekunde sind 800 Samples; diese Zahl brauchst du wieder, wenn Stille vor einem Klang zur Verzögerung im Spiel wird. Die 2 s nach der Ansage sind 96 000 Samples, genug Abstand für einen sauberen Schnitt. Rechnest du in Samples, sind Schnitte und Längen in REAPER und Godot exakt vergleichbar.
    resources:
      - title: Godot Docs · Edit > Trim
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#edit-trim

  - id: begriffe-feld
    type: gap
    title: Die Wörter einer Session
    prompt: |
      Ergänze die Fachbegriffe.
    lang: prose
    code: |
      Die gesprochene Kennung vor jedem Take heißt ⟦Ansage⟧ oder Slate. Eine Aufnahme des Raums ohne Aktion, mit gleicher Position und gleichem Pegel wie die Takes, heißt ⟦Room Tone⟧. Fassungen desselben Klangs aus verschiedenen Abständen, etwa nah, mittel und fern, nimmt Watson Wu für Spiele als mehrere ⟦Perspektiven⟧ auf.
    gaps:
      - label: Kennung
        hint: Das deutsche Wort für Slate.
      - label: Raum ohne Aktion
        hint: Englischer Begriff aus Film und Radio, zwei Wörter.
        accept: ["Roomtone", "Raumton"]
      - label: Nah, mittel, fern
        hint: Wie beim Zeichnen der Standpunkt, von dem aus man auf etwas schaut.
        accept: ["Perspektive", "perspectives", "perspective"]
    explanation: |
      Ansage, Room Tone und Perspektive sind drei Begriffe, die in Sessions für Spielgeräusche vorkommen. Die Ansage ordnet Takes zu, der Room Tone füllt Lücken und liefert das Rauschprofil. Perspektiven geben dem Spiel nahe und ferne Fassungen desselben Klangs, weil ein Spieler eine Quelle aus vielen Abständen hört; Wu nimmt Waffen deshalb für Spiele anders auf als für Filme. Wer die Wörter kennt, versteht Protokolle und Gespräche im Team.
    resources:
      - title: Sound On Sound · Glossar, Slate
        url: https://www.soundonsound.com/glossary/slate
      - title: A Sound Effect · Watson Wu, Weapon sound effects recording
        url: https://www.asoundeffect.com/weapon-sound-effects-recording/

  - id: rumpeln-im-take
    type: bug
    title: Jeder Take knarzt
    prompt: |
      So beschreibst du deinen Ablauf für einen Take. Beim Abhören reibt und knarzt es leise in jedem Take, und der Klang wirkt dumpfer als im Raum. Finde die zwei Schritte, die das verursachen.
    lang: prose
    code: |
      Ich starte die Aufnahme und warte zwei Sekunden.
      Ich sage: „Take drei, Schublade, zwanzig Zentimeter.“
      Ich warte zwei Sekunden.
      Ich halte das Handy in der Hand.
      Mein Daumen liegt auf der Unterkante des Handys.
      Ich ziehe die Schublade auf und lasse den Klang drei Sekunden ausklingen.
      Ich stoppe und höre den Take mit Kopfhörern an.
    lines: [4, 5]
    explanation: |
      Ein Handy in der Hand überträgt jede Bewegung der Finger und Sehnen ins Gehäuse; das ist das Reiben und Knarzen, das NPR als „fingers sliding across the surface of the mic or tendons and bones creaking“ beschreibt. An der Unterkante sitzt bei vielen Geräten eine Mikrofonöffnung; ein Daumen darauf macht den Klang dumpf. Leg das Handy auf eine weiche Unterlage und halte die Öffnungen frei. Die übrigen Schritte sind richtig: Ansage, Stille, Ausklingen, Abhören.
    resources:
      - title: NPR Training · Which mic should I use?
        url: https://www.npr.org/sections/npr-training/2025/05/28/g-s1-66934/which-mic-should-i-use-mics-part-1

  - id: room-tone-passt-nicht
    type: bug
    title: Der Room Tone fällt auf
    prompt: |
      Dein Protokoll einer Session. In REAPER klingt der Room Tone halliger und dünner als die Pausen zwischen den Takes. Als Füller zwischen zwei Takes hört man ihn sofort. Finde die Zeile, die das erklärt.
    lang: text
    code: |
      2026-10-24  Küche, Fenster zu
      Handy, App: Sprachmemos
      Breites Spektrum, Mono
      T1–T4  Schublade  20 cm
      T5     Schublade  60 cm
      T6     Room Tone 30 s, bei 2 m
      Notiz: T2 Kühlschrank lief noch
    lines: [6]
    explanation: |
      Room Tone muss dieselbe Position und denselben Pegel haben wie die Takes, sonst klingt er nach einem anderen Raum. NPR schreibt ausdrücklich, das Mikrofon an derselben Stelle zu lassen und den Pegel nicht zu ändern. In 2 m Abstand statt an der Stelle der nahen Takes hört das Handy mehr Raumhall und weniger Nahes, deshalb klingt T6 halliger. Die Notiz zu T2 ist kein Fehler; solche Notizen gehören ins Protokoll.
    resources:
      - title: NPR Training · Field recording checklist
        url: https://training.npr.org/2017/06/30/get-great-sound-every-time-with-this-field-recording-checklist/

  - id: leise-ist-nicht-sicher
    type: explain
    title: „Ich hebe es später an“
    prompt: |
      Jemand aus deinem Team sagt diesen Satz. Erkläre in eigenen Worten, warum der Plan nicht aufgeht und was stattdessen hilft.
    lang: prose
    code: |
      Im Hof ist es laut. Ich nehme deshalb ganz leise auf, dann ist weniger Lärm drauf, und ich hebe den Klang später in REAPER an.
    points:
      - Leiser aufnehmen ändert das Verhältnis von Klang zu Hintergrund nicht; beides wird gleich leiser.
      - Beim Anheben kommt der Hintergrund mit, dazu das Rauschen der Elektronik.
      - Das Verhältnis ändert nur der Abstand; jede Halbierung bringt bis zu 6 dB.
      - Den Pegel stellt man so ein, dass der lauteste Moment nicht übersteuert, nicht so leise wie möglich.
    explanation: |
      Der Plan verwechselt Pegel und Verhältnis. Ein leiserer Pegel macht Klang und Hof gleichermaßen leiser; NPR schreibt dazu, man nehme dasselbe Verhältnis auf, nur leiser. Hebt man später an, kommt der Hof zurück und das Rauschen des Geräts dazu. Was hilft, ist Nähe: Bei halbem Abstand liegt der Klang bis zu 6 dB weiter vor dem Hintergrund. Den Pegel stellt man über einen Probe-Take mit dem lautesten Moment ein.
    resources:
      - title: NPR Training · Audio production FAQ
        url: https://training.npr.org/2017/05/19/audio-production-faq-headphones-levels-mics/

  - id: app-check
    type: practice
    title: Deine App mit einem Prüfmuster prüfen
    prompt: |
      Nimm mit deiner Aufnahme-App einen Klatscher als Prüfmuster auf, mit Ansage. Notiere in einer kurzen Liste, was du über Format, Filter, Pegelregelung und Kanäle herausfindest, und was die App nicht anzeigt. Hör die Probe mit Kopfhörern an und notiere, ab welchem Abstand der Klatscher nicht mehr übersteuert.
    lang: prose
    hints:
      - Such in den Einstellungen der App nach Wörtern wie Format, Qualität, verlustfrei, Rauschunterdrückung, Sprachmodus, Mono, Stereo.
      - Bei Sprachmemos stehen Filter im Kontrollzentrum, der Aufnahmemodus unter Einstellungen → Apps → Sprachmemos.
    checklist:
      - Du hast notiert, in welchem Format die App speichert, oder dass sie es nicht anzeigt.
      - Du hast notiert, welche Filter oder Modi es gibt und wie sie bei der Probe standen.
      - Die Probe beginnt mit einer Ansage, danach folgen mindestens zwei Sekunden Stille.
      - Du hast den Abstand notiert, bei dem der Klatscher nicht übersteuert.
      - Du hast eine offene Frage notiert, die du am PC an der Datei prüfst, etwa die Abtastrate.
    explanation: |
      Der Klatscher ist kurz und laut und damit das härteste Prüfmuster für Pegel und Filter. Was die App nicht anzeigt, prüfst du an der Datei, nicht an Annahmen. Die Liste ist der Anfang deines Protokolls: Gerät, App und Einstellung gehören in jede Session. Den Klatscher kannst du später als Prüfklick für [Audio zuordnen](/godot/audio) verwenden.
    resources:
      - title: Apple Support · Stereo-, Mono- oder 3D-Audio aufnehmen
        url: https://support.apple.com/de-de/guide/iphone/iph4d2a39a3b/ios#iphc30ff1a19

  - id: eigene-session
    type: practice
    title: Eine kleine Session mit Protokoll
    prompt: |
      Wähl einen Gegenstand in deiner Wohnung und nimm ihn auf: mindestens drei Takes nah, zwei weiter weg, jeder mit Ansage, danach 30 Sekunden Room Tone. Schreib das Protokoll in wenigen Zeilen auf. Welcher Gegenstand und welche Bewegung, entscheidest du.
    lang: prose
    hints:
      - Datum, Ort, Gerät und App, Einstellung, Abstand je Take, Room Tone, Notizen.
    checklist:
      - Das Protokoll nennt Datum, Ort, Gerät, App und Einstellung.
      - Jeder Take hat eine Nummer und einen Abstand, und die Ansage im Take sagt dasselbe.
      - Der Room Tone ist 30 Sekunden lang und an derselben Stelle mit demselben Pegel aufgenommen wie die nahen Takes.
      - Auf keinem Take ist eine verständliche Stimme Dritter.
      - Die Originaldatei ist unverändert, und ihr Name folgt einem Schema für Sessions, das du notiert hast, etwa mit Datum, Ort und Gegenstand.
    explanation: |
      Die Session übt den ganzen Ablauf an einem Gegenstand, ohne Anspruch auf einen fertigen Klang. Was du aufnimmst, bleibt deine Wahl; geprüft wird, ob die Aufnahme später auffindbar und schneidbar ist. Das Material gehört in [REAPER als Werkbank](/sound/reaper-werkbank), wo du es schneidest und säuberst.
    resources:
      - title: NPR Training · Active sound
        url: https://training.npr.org/2015/09/29/active-sound-how-to-find-it-record-it-and-use-it/
