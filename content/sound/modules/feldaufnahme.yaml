id: feldaufnahme
title: "Feldaufnahme mit dem Handy: Pegel, Abstand, Ansage und Room Tone"
level: 1
minutes: 90
summary: Wie du mit dem Handy brauchbares Rohmaterial für Spielgeräusche aufnimmst – App-Einstellungen, Pegel, Abstand, Raum, Wind und Griffgeräusche, Ansage, mehrere Takes und Room Tone –, ohne Stimmen Dritter mitzuschneiden, und warum ein Aufnahmeprotokoll dir später die Suche erspart.
place: unterwegs
goals:
  - Du prüfst in deiner Aufnahme-App Format, Filter, Pegelregelung und Aufnahmemodus und nennst, was Apple dazu für Sprachmemos dokumentiert.
  - Du stellst den Pegel über den Abstand ein und begründest mit dem Abstandsgesetz, warum „nah ran“ den Vorsprung vor dem Hintergrund vergrößert.
  - Du erkennst Übersteuern, Wind, Griffgeräusche und Raumhall beim Abhören und vermeidest sie bei der Aufnahme.
  - Du nimmst mit Ansage, mehreren Takes und Room Tone auf und führst ein Aufnahmeprotokoll.
  - Du rechnest Samples und Dateigröße einer WAV-Aufnahme aus.
  - Du hältst Stimmen Dritter aus deinen Aufnahmen heraus und kennst den Wortlaut von § 201 StGB, ohne ihn als Rechtsrat zu nehmen.
