lesson: |
  Auf dem Handy liegt eine Aufnahme von sieben Minuten: eine Ansage, 30 Sekunden Room Tone, dann zwanzig Klatscher, dazwischen Rascheln und ein vorbeifahrendes Auto. Für das Spiel brauchst du daraus zwanzig Dateien, jede kurz, ohne Stille am Anfang, ohne Rauschen, nach einem Schema benannt. Und wenn du morgen den Hochpass änderst, willst du alle zwanzig neu haben, ohne zwanzigmal zu rendern.

  Aus der Musik kennst du REAPER als Ort, an dem ein Stück entsteht und am Ende als eine Datei herauskommt. Im Spiel kommt hinzu: Aus einem Projekt werden viele kurze Dateien, jede mit einem festen Namen, unter dem die Engine sie findet. Dieses Modul baut REAPER zu einer Werkbank dafür um. Als Material nimmst du deine Aufnahmen aus [Feldaufnahme mit dem Handy](/sound/feldaufnahme); zum Üben reicht ein Take mit zwanzig Klatschern als Prüfmuster. Alle Werte hier sind Platzhalter. Was gut klingt, entscheidest du.

  > [!NOTE] Seitenangaben
  > „S. 128“ meint die PDF-Seite im [REAPER User Guide 7.81](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf), „Effects Guide, S. 17“ die Seite im [REAPER Effects Guide](https://www.reaper.fm/userguide/REAPEREffectsGuide2021.pdf). Menünamen stehen englisch, wie REAPER sie zeigt.

  ## Ein Projekt für Geräusche: Abtastrate, Bittiefe, Ordner

  Unter *File → Project Settings* (Alt+Enter) stehen die *Project Sample Rate*, die Zeitbasis und auf der Seite *Media* das Aufnahmeformat mit Bittiefe sowie das Format für alles, was REAPER beim Anwenden von FX oder beim Glue neu schreibt (S. 32). Auf derselben Seite legst du fest, dass importierte Dateien in den Projektordner kopiert werden. Javier Zumer stellt für Geräusche die Zeitbasis auf *Time* statt *Beats*: „Since I don't usually work with music, I have the timebases set to ‚Time‘ instead of ‚Beat.‘“ ([A Sound Effect](https://www.asoundeffect.com/reaper-for-game-audio-getting-started-rendering/)).

  Welche Abtastrate und Bittiefe? Die Antwort hängt daran, was Godot mit deiner Datei macht. Gemessen mit Godot 4.7.2 (Import headless, Datei danach geladen):

  | Datei | Import | Ergebnis in Godot |
  | --- | --- | --- |
  | WAV 24 Bit, 48 kHz | Standard | Quite OK Audio, 48 000 Hz |
  | WAV 24 Bit, 48 kHz | Kompression *Disabled* | 16 Bit, 48 000 Hz |
  | WAV 16 Bit, 44,1 kHz | Standard | Quite OK Audio, 44 100 Hz |

  Godot speichert WAV höchstens mit 16 Bit; standardmäßig komprimiert es mit Quite OK Audio ([Compress > Mode](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#compress-mode)). Die Abtastrate der Datei bleibt erhalten. Gemischt wird mit `audio/driver/mix_rate`, Standard 44100; laut Doku lässt man das besser dem Betriebssystem, die tatsächliche Rate liefert `AudioServer.get_mix_rate()` ([mix_rate](https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-audio-driver-mix-rate)). Weicht die Datei ab, rechnet Godot um: Ein 1-kHz-Sinus von einer Sekunde als 48-kHz-WAV kam in einem 44,1-kHz-Mix gemessen mit etwa 1000 Hz und 1,000 Sekunden heraus, Tonhöhe und Länge blieben also gleich.

  Die Godot-Doku rät unter *Best practices*: Im Spiel bringt 24 Bit keinen hörbaren Vorteil, und über 48 kHz nur, wenn du den Klang zur Laufzeit verlangsamst; die Rohfassung für die Bearbeitung darfst du trotzdem in voller Qualität behalten ([Best practices](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#best-practices)). Ein Startpunkt, kein Gesetz: Projekt in der Rate deiner Aufnahmen, Rohmaterial unverändert, Export in einer Rate für alle Geräusche.

  ```text
  ~/sound/                     (Platzhalter)
  ├── roh/                     Handy-Dateien, nur lesen
  │   └── 2026-10-24_klatsch/
  ├── reaper/werkbank/
  │   └── werkbank.rpp         Projekt, kopierte Medien
  └── export/sfx/              Ziel des Renders
  ```

  > [!WARNING] Rohaufnahmen nur lesen
  > Mach den Rohordner schreibgeschützt, etwa mit `chmod -R a-w ~/sound/roh/2026-10-24_klatsch`. Dann scheitert jeder Versuch, ein Original zu ändern, mit einer Meldung statt still. Das Projekt arbeitet mit Kopien, wenn unter *Project Settings → Media* das Kopieren beim Import eingestellt ist (S. 32).

  ## Vom Take zum Klang: Schnitt, Fades, Nulldurchgänge

  Zieh die Aufnahme auf eine Spur. Ansage und Room Tone schneidest du nicht weg, sondern legst sie als eigene Items ab: Den Room Tone brauchst du gleich für das Rauschprofil.

  Zwanzig Klatscher von Hand zu schneiden, kostet Zeit. *Item processing → Dynamic split items…* trennt ein Item an den Stellen, an denen ein Gate öffnet und schließt. Für das Entfernen von Stille empfiehlt der Guide: *At transients* aus, *When gate opens* und *When gate closes* an, die Schwelle bei etwa −50 dB beginnen und von dort anpassen, *Remove silent areas* an; *Fade pads* glätten die Übergänge (S. 150–152). Die Aktion *Item: Auto trim/split items (remove silence)* macht dasselbe mit weiteren Optionen, darunter *Use zero crossings when splitting*, das laut Guide Klicks beim Abspielen verhindern kann (S. 128).

  Gegen Klicks an der Schnittkante hilft wie in der Musik ein Schnitt am Nulldurchgang oder ein kurzer Fade; Länge und Form stellst du je Item in den *Media Item Properties* (F2) ein, Vorgaben für neue Items unter *Preferences → Project → Item Fade Defaults* (S. 66, S. 134). Im Spiel klickt ein vergessener Schnitt bei jedem Auslösen. Rechne Fades in Samples, wenn es eng wird: 5 ms sind bei 48 kHz 240 Samples, ein Frame bei 60 Frames pro Sekunde 800.

  Am Anfang des Klangs gilt eine eigene Regel: Jede Millisekunde Stille vor der Transiente ist eine Millisekunde Verzögerung im Spiel. Godot kann beim Import beschneiden ([Audio zuordnen](/godot/audio)), aber dann entscheidet Godot, wo der Schnitt liegt. Schneide lieber in REAPER direkt vor die Transiente und lass den Fade-in so kurz, dass er sie nicht abflacht. Ob deine Exporte das einhalten, misst ein kleines Skript. Es liest 16- und 24-Bit-WAVs mit dem Modul `wave` und meldet die Zeit bis zum ersten Sample über der Schwelle. Hier legt es zum Vorführen eine Prüfdatei mit 30 ms Stille an:

  ```python run
  import array, math, wave
  from pathlib import Path

  def stille_vorn_ms(pfad, schwelle_db=-50.0):
      with wave.open(str(pfad)) as w:
          rate, kanaele, breite = w.getframerate(), w.getnchannels(), w.getsampwidth()
          daten = w.readframes(w.getnframes())
      grenze = 2 ** (8 * breite - 1) * 10 ** (schwelle_db / 20)
      for pos in range(0, len(daten), breite):
          wert = int.from_bytes(daten[pos:pos + breite], "little", signed=True)
          if abs(wert) > grenze:
              return 1000 * (pos // breite // kanaele) / rate
      return None

  # Prüfdatei: 30 ms Stille, dann ein abklingender 1-kHz-Klick
  rate = 48000
  werte = [0] * int(0.030 * rate) + [
      round(20000 * math.exp(-i / 800) * math.sin(2 * math.pi * 1000 * i / rate))
      for i in range(4800)
  ]
  with wave.open("pruef_klick.wav", "wb") as w:
      w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
      w.writeframes(array.array("h", werte).tobytes())

  for datei in sorted(Path(".").glob("*.wav")):
      print(datei.name, round(stille_vorn_ms(datei), 2), "ms")
  ```

  Auf deinem Rechner ersetzt du `Path(".")` durch deinen Exportordner und lässt den Teil mit der Prüfdatei weg. Fließkomma-WAVs (32 Bit float) liest `wave` nicht; rendere für die Prüfung in PCM.

  ## Säubern mit Bordmitteln: Hochpass, Rauschprofil, Gate

  Aus der Musik kennst du EQ und Gate. Im Spiel kommt hinzu: Ein Fehler in einem Klang, der 30-mal pro Minute spielt, ist 30-mal pro Minute zu hören. Und jede Datei bringt ihr eigenes Grundrauschen mit, das mit dem Klang kommt und mit ihm verschwindet. Darum säuberst du vor dem Export, und zwar mit Plugins, die REAPER mitbringt und die unter Linux nativ laufen:

  ```text
  vorher      Items geschnitten, mit Fades
  Spur „sauber“ (Track FX, alle Takes einer Aufnahme)
  1  ReaEQ    Band-Typ High pass   Rumpeln, Trittschall
  2  ReaFIR   Subtract, Profil     gleichmäßiges Rauschen
              aus dem Room Tone
  3  ReaGate  Schwelle, Hold,      Reste zwischen den
              Release, Hysteresis  Klängen
  danach      Render, Postprocess: Normalisieren
  ```

  **ReaEQ** mit dem Band-Typ *High pass* (Effects Guide, S. 17) nimmt Rumpeln und Trittschall heraus; wo die Grenze liegt, hörst du an deinem Material.

  **ReaFIR** im Modus *Subtract* zieht ein Rauschprofil ab. Der Ablauf laut Guide: ReaFIR auf die Spur, Modus *Subtract*, *Edit mode* auf *Precise*, *Automatically build noise profile* einschalten, nur die Stelle mit dem reinen Rauschen abspielen, stoppen, das Häkchen wieder entfernen. Danach wird das Profil beim Abspielen abgezogen ([User Guide, S. 333–334](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=333)). Mit Strg und Ziehen hebst oder senkst du das ganze Profil; je höher, desto mehr Artefakte (Effects Guide, S. 23). Dafür hast du den Room Tone aufgenommen. Der Guide grenzt ab: ReaFIR passt zu gleichmäßigem Rauschen wie Brummen, ein Gate zu gelegentlichen Geräuschen wie Atmern.

  **ReaGate** kennst du aus der Musik (Effects Guide, S. 24). Für eine Spieldatei zählen *Hold* und *Release*: Sie entscheiden, wie viel Ausklang in der Datei bleibt. Schließt das Gate zu früh, fehlt der Fahne das Ende; schließt es erst nach dem Ende der Region, endet die Datei im Restrauschen statt in Stille. *Hysteresis* hält das Gate ruhig, wenn der Ausklang um die Schwelle pendelt.

  Die Reihenfolge hat Gründe. Der Hochpass steht vor ReaFIR, weil das Profil das Signal lernen soll, das es später bearbeitet; änderst du den Hochpass, baust du das Profil neu. Das Gate steht hinter ReaFIR, weil der Abstand zwischen Klang und Rest dort größer ist und sich eine Schwelle leichter findet.

  Normalisiert wird am Ende, im Render. *Item processing → Normalize items* ändert die Lautstärke der Items (S. 141), und die liegt in REAPERs Signalfluss vor den Spur-FX: Item-Lautstärke und Fades kommen zuerst, dann die *Track FX Chain* (Signalfluss-Diagramm, S. 122). Normalisierst du die Items, nachdem die Kette steht, bekommen ReaFIR und ReaGate einen anderen Pegel: Das Profil wurde beim alten Pegel gelernt, die Schwelle passt nicht mehr. Im Render-Dialog öffnet *Postprocess…* dagegen eine Nachbearbeitung der fertigen Datei, nach allen FX. Sie normalisiert auf Peak, True Peak, LUFS-I und weitere Maße, „each file separately, to loudest file, or as if files play together“ (S. 414). Ob zwanzig Varianten gleich laut sein sollen oder ihre Unterschiede behalten, ist deine Entscheidung; mehr dazu in [Layering und Varianten](/sound/layering-varianten), Lautheit und Zielwerte in [Lautheit, Export, Import und Hörtest im Spiel](/sound/export-im-spiel).

  Die Kette sitzt auf der Spur, nicht in den Dateien. Eine Spur je Aufnahme-Sitzung, denn das Rauschprofil gehört zu Ort und Gerät. So bleibt jede Entscheidung änderbar, bis du renderst.

  ## Je Klang eine Region

  Eine **Region** ist ein benannter Zeitabschnitt im Projekt. Für die Werkbank heißt das: eine Region je Datei, ihr Name wird der Dateiname. Aus einer Zeitauswahl entsteht sie mit Shift+R (S. 179). Für viele Items auf einmal gibt es die Aktion *Markers: Insert separate regions for each selected item* (S. 182). Im *Region/Marker Manager* benennst du Regionen per Doppelklick, filterst die Liste und exportierst oder importierst sie als Datei, etwa als `.csv` (S. 180–181).

  Benenne nach einem Schema, das du einmal festlegst. Ein Platzhalter: `<kategorie>_<objekt>_<aktion>_<nn>`, also `pruef_klatsch_hand_01`. Die Grenzen der Region sind die Grenzen der Datei: Start direkt vor der Transiente, Ende dort, wo der Klang im Rauschen verschwunden ist.

  ## Region Render Matrix und Wildcards

  Die **Region Render Matrix** zeigt Regionen als Spalten und Spuren als Zeilen. Ein Kreuz heißt: diese Spur für diese Region rendern; die Zeile *Master mix* rendert den Mix. Du öffnest sie über *File → Region Render Matrix*, über den Knopf im Region/Marker Manager oder aus dem Render-Dialog. Gerendert wird mit *File → Render…*, Source *Region render matrix*, Bounds *All project regions*. Das Kontextmenü der Matrix kann eine Spur für alle Regionen ankreuzen und einzelne Felder in Mono, Stereo oder mehrkanalig erzwingen ([S. 419–420](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=419)). Der Render einer Spur enthält ihre FX, Fader und alles, was in sie geroutet ist (S. 417). *File → Consolidate/Export Tracks* dagegen gibt Spuren ohne Spur-FX aus (S. 411); deine Säuberungskette fehlte dann.

  Den Dateinamen setzt du aus **Wildcards** zusammen. Die Wildcard-Hilfe im Render-Dialog, im Guide als Bild abgedruckt, nennt die Regeln ([S. 411](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=411)):

  ```text
  $region           Name der Region
  $project          Name des Projekts
  $track            Name der Spur
  /                 Unterordner (unter Linux wie auf dem Mac)
  $Region           erster Buchstabe groß
  $REGION           alles groß
  $rEGION           alles klein
  $region< >        Leerzeichen entfernen
  $region< _>       Leerzeichen durch _ ersetzen
  leere Wildcard    angrenzendes Leerzeichen, -, _ oder . fällt weg
  $filenumber[01]   Zählung 01, 02 …
  ```

  Zumer zeigt in seinem Artikel, wie weit das trägt: `$project_$parenttrack_$track_$region` wird zu „AwesomeEnemy_Cannon_Impacts_A“, und `$project_$track_$timelineorder[00]` nummeriert ausgewählte Items in der Reihenfolge auf der Zeitleiste ab 00. Am robustesten bleibt: Die Nummer steht im Regionsnamen, der Dateiname ist `$region`. Dann ändert ein neuer Klang in der Mitte keine anderen Namen.

  Drei Einstellungen entscheiden, ob der Export im Spiel funktioniert:

  - **Tail.** Unter den Time bounds steht *Tail* mit einer Länge in Millisekunden; im Screenshot des Guides ist sie an, mit 1000 ms (S. 413). Für welche Bounds die Fahne gilt, stellst du unter *Preferences → Audio → Rendering* ein, getrennt für ganzes Projekt, Zeitauswahl und Regionen sowie Items (S. 437). Zumer warnt: „Careful with this one. It is on by default and you may not need it.“ Ohne Tail endet die Datei am Ende der Region, und ein Hall auf der Spur bricht dort ab. Mit Tail hängt jede Datei Zeit an.
  - **Silently increment filenames.** Diese Option hängt eine Nummer an, statt eine vorhandene Datei zu überschreiben (S. 415). Für Spiele ist das falsch herum: Godot importiert eine Datei neu, wenn sich ihr Inhalt ändert ([Automatic reimport](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/import_process.html#automatic-reimport)), aber nur unter dem Namen, den die Szene kennt.
  - **Channels.** Mono oder Stereo legst du für alle fest oder je Feld in der Matrix. Warum Klänge mit Ort meist mono sind, steht in [Hüllkurve, Frequenz, Dynamik und Raum](/sound/klangformung).

  Speichere das Ganze mit *Presets* als Preset; der Guide unterscheidet *Bounds and output*, *Options and format* und *All settings* (S. 414). *Dry run (no output)* rendert zur Probe, zeigt Wellenform, Lautheit und markiert Übersteuerungen (S. 416).

  > [!PRAXIS] Viele kleine Dateien aus einem Projekt
  > Zumer kommt von Pro Tools und nennt die Region Render Matrix für Spiele „quite powerful“, weil man dort „many small files“ braucht. Er rendert die Schichten eines Klangs auch einzeln, „so you can manage variations on the middleware side“, und speichert Render-Einstellungen als Presets, um Dateien immer gleich zu erzeugen. Daraus folgt: Das Projekt ist die Quelle, die WAVs sind ein Ergebnis, das du jederzeit neu erzeugst.

  ## Linux: REAPER nativ, fremde Plugins über yabridge

  REAPER 7.81 läuft bei dir nativ, gestartet mit `pw-jack reaper`. `pw-jack` lässt ein Programm die JACK-Bibliotheken von PipeWire laden, so landet REAPERs JACK-Verbindung bei PipeWire ([pw-jack(1)](https://docs.pipewire.org/page_man_pw-jack_1.html)). Der Guide nennt VST2, VST3, CLAP und LV2 als unterstützte Formate und hebt für Linux hervor, dass REAPER LV2-Plugins automatisch sucht (S. 25, S. 116); dass ein Linux-VST3 läuft, zeigt dein Serum 2 auf dem PC. Windows-Plugins brauchen [yabridge](https://github.com/robbert-vdh/yabridge). Dein Stand: Kontakt 8 ließ sich auf dem Laptop nicht scannen, REAPER fror dabei ein; die übrigen Windows-Plugins sind unter Linux ungeprüft. Der Rückweg ist REAPERs Bordmittel, oder du lässt das Plugin weg. Jeder Schritt in diesem Kurs geht deshalb mit den Cockos-Plugins.

  > [!INTERVIEW]
  > „Wir brauchen alle 60 Schritt-Varianten mit einem anderen Hochpass. Wie lange dauert das?“ Gute Antwort, etwa als Sound Designer: Kurz, wenn das Projekt so gebaut ist. Die Kette liegt auf der Spur, nicht in den Dateien; jede Variante ist eine Region mit ihrem Dateinamen; der Export ist ein Preset über die Region Render Matrix. Ich ändere den Filter einmal, höre drei Varianten im Spiel gegen, rendere alles neu, die Namen bleiben gleich, die Engine importiert neu. Die Rohaufnahmen fasse ich nicht an. Steckt die Bearbeitung dagegen in sechzig einzeln exportierten Dateien, muss ich jede einzeln anfassen.

  ## Häufige Fehler

  - **Im Rohordner gearbeitet.** Wer die Originale bearbeitet statt Kopien, hat irgendwann keine unbearbeitete Fassung mehr. Rohmaterial bleibt schreibgeschützt in `roh/`, das Projekt arbeitet mit Kopien.
  - **Stille vor der Transiente.** Jede Millisekunde verzögert den Klang im Spiel. Miss sie im Export.
  - **Schnitt ohne Fade.** Ein Schnitt mitten in der Welle klickt, bei jeder Wiedergabe.
  - **ReaFIR-Profil aus Klang statt Rauschen gelernt.** Dann zieht es Teile des Klangs ab. Profil nur aus dem Room Tone bauen.
  - **Hochpass nach dem Profil geändert.** Das Profil passt nicht mehr; neu lernen lassen.
  - **Items nach der Kette normalisiert.** ReaFIR und ReaGate bekommen einen anderen Pegel, Profil und Schwelle passen nicht mehr. Normalisiert wird im Render unter *Postprocess*.
  - **Consolidate statt Render.** Die Spur-FX fehlen in den Dateien.
  - **Tail aus bei Klängen mit Hall auf der Spur.** Die Fahne bricht am Regionsende ab.
  - **Silently increment filenames an.** Neue Fassungen bekommen neue Namen, das Spiel spielt die alte.

  ## Zusammenfassung

  - Godot 4.7.2 importiert WAV standardmäßig als Quite OK Audio, ohne Kompression mit 16 Bit; die Abtastrate bleibt, beim Mischen rechnet Godot um.
  - Rohmaterial bleibt unverändert, das Projekt kopiert, der Export ist ein Ergebnis.
  - Schnitte an Nulldurchgängen oder mit Fades, keine Stille vor der Transiente.
  - Säubern mit Bordmitteln: Hochpass, ReaFIR-Profil aus dem Room Tone, Gate. Normalisiert wird im Render unter *Postprocess*, nach allen FX, nicht an den Items davor.
  - Eine Region je Datei, ihr Name ist der Dateiname; die Region Render Matrix rendert alle in einem Durchgang.
  - Wildcards bauen Namen und Ordner; `$region` mit der Nummer im Regionsnamen ist die robusteste Form.
  - Tail und *Silently increment filenames* entscheiden, ob die Dateien im Spiel stimmen; alles als Preset speichern.
exercises:
  - id: render-weg
    type: choice
    title: Eine Datei je Klang, mit der Kette
    prompt: |
      Zwanzig Klatscher liegen auf der Spur „sauber“ mit ReaEQ, ReaFIR und ReaGate, jeder in seiner Region. Welcher Weg liefert eine Datei je Klang, mit der Säuberungskette?
    options:
      - text: "*File → Render…*, Source *Region render matrix*, Bounds *All project regions*, in der Matrix „sauber“ für alle Regionen angekreuzt"
        correct: true
        why: Die Matrix rendert je angekreuztem Feld eine Datei, und der Render einer Spur enthält ihre FX.
      - text: "*File → Render…*, Source *Master mix*, Bounds *Entire project*, Dateiname `$region`"
        correct: false
        why: Das ergibt eine einzige Datei über das ganze Projekt. `$region` ändert daran nichts.
      - text: "*File → Consolidate/Export Tracks*, alle Spuren"
        correct: false
        why: Consolidate gibt Spuren vor der Bearbeitung aus, ohne Spur-FX. Die Kette fehlte, und es entsteht eine Datei je Spur, nicht je Klang.
      - text: "*File → Render…*, Source *Stems (selected tracks)*, Bounds *Time selection* über alle zwanzig Klänge"
        correct: false
        why: Stems liefern eine Datei je ausgewählter Spur, hier also eine lange Datei mit allen zwanzig Klängen.
    explanation: |
      Im Spiel ist jede Datei ein Klang. Die Region Render Matrix verbindet beides: Regionen geben die Grenzen und Namen, Spuren den Klang samt FX. Consolidate ist für die Weitergabe an andere DAWs gedacht und lässt Spur-FX bewusst weg. Für Geräusche ist es deshalb fast nie der richtige Weg.
    resources:
      - title: REAPER User Guide 7.81 · Render Source Options (S. 417)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=417
      - title: REAPER User Guide 7.81 · Rendering Regions (S. 419)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=419

  - id: kette-ordnen
    type: order
    title: Von der Handy-Datei zur Spieldatei
    prompt: |
      Bring die Schritte in eine Reihenfolge, in der du keinen Schritt wiederholen musst, weil ein späterer seine Grundlage ändert.
    lang: prose
    lines: |
      Die Handy-Datei liegt unverändert in roh/, das Projekt arbeitet mit einer Kopie.
      Ansage und Room Tone werden eigene Items, die Klatscher werden geschnitten und bekommen kurze Fades.
      ReaEQ mit Hochpass kommt als erstes FX auf die Spur.
      ReaFIR lernt das Rauschprofil aus dem Room Tone, danach wird das Lernen abgeschaltet.
      ReaGate kommt hinter ReaFIR, die Schwelle wird eingestellt.
      Je Klang eine Region nach dem Schema, ihr Ende dort, wo der gesäuberte Klang verklungen ist.
      Render über die Region Render Matrix mit dem Preset, das unter Postprocess normalisiert.
    alternatives:
      - [1, 3, 2, 4, 5, 6, 7]
    explanation: |
      Ohne Kopie gibt es nichts zu schneiden, und erst der Room Tone als eigenes Item liefert das Material für das Profil. Der Hochpass steht vor ReaFIR, weil das Profil das Signal lernen soll, das ReaFIR später bekommt; ob du ihn vor oder nach dem Schneiden auf die Spur legst, ist gleich. Die Schwelle des Gates stellst du erst hinter ReaFIR ein, denn sie muss zum entrauschten Signal passen. Wo ein Klang verklungen ist, hörst du erst mit der fertigen Kette, deshalb folgen die Regionen danach. Normalisiert wird im Render unter *Postprocess*, nach allen FX. *Normalize items* würde die Lautstärke der Items ändern, die im Signalfluss vor den Spur-FX liegt: ReaFIR und ReaGate bekämen einen anderen Pegel, und Profil und Schwelle müsstest du neu einstellen.
    resources:
      - title: REAPER User Guide 7.81 · Noise Reduction with ReaFir (S. 333)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=333
      - title: REAPER User Guide 7.81 · Audio Signal Flow Chart, Tracks (S. 122)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=122
      - title: REAPER User Guide 7.81 · Render, Postprocess (S. 414)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=414

  - id: fade-in-samples
    type: output
    title: Wie viele Samples hat ein Fade?
    prompt: |
      Was gibt dieses Programm aus?
    lang: python
    code: |
      rate = 48000
      for ms in (2, 5, 10):
          print(ms, "ms =", round(ms * rate / 1000), "Samples")
      print("1 Frame bei 60 fps =", rate // 60, "Samples")
    expected: |
      2 ms = 96 Samples
      5 ms = 240 Samples
      10 ms = 480 Samples
      1 Frame bei 60 fps = 800 Samples
    explanation: |
      Bei 48 kHz sind es 48 Samples je Millisekunde. Ein Frame bei 60 Frames pro Sekunde dauert 16,7 ms und umfasst 800 Samples, bei 44,1 kHz wären es 735. Die Rechnung hilft beim Abwägen: Ein Fade-in von 10 ms ist über die Hälfte eines Frames lang und kann eine scharfe Transiente schon merklich abflachen. Wie lang deine Fades sind, entscheidest du am Material.
    resources:
      - title: REAPER User Guide 7.81 · Media Item Properties (S. 134)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=134

  - id: dateinamen-vorhersagen
    type: output
    title: Was REAPER aus den Wildcards macht
    prompt: |
      Das Projekt heißt `werkbank.rpp`, die Region „Klatsch Hand 01“, das Feld *Author* in den Projekt-Notizen ist leer. Gerendert wird als WAV. Welche Dateinamen ergeben die vier Muster? Eine Zeile je Muster, mit Endung. Die Regeln stehen in der Lektion.
    lang: text
    code: |
      1  $project/$region
      2  $region< _>
      3  $rEGION
      4  $author_$region< >
    expected: |
      werkbank/Klatsch Hand 01.wav
      Klatsch_Hand_01.wav
      klatsch hand 01.wav
      KlatschHand01.wav
    hints:
      - Der Schrägstrich legt einen Unterordner an.
      - Kleiner erster und großer zweiter Buchstabe der Wildcard machen alles klein.
      - Eine leere Wildcard nimmt ein angrenzendes `_` mit.
    explanation: |
      `$project` ist der Projektname ohne Endung, der Schrägstrich macht daraus einen Ordner. `< _>` ersetzt jedes Leerzeichen durch einen Unterstrich, `< >` entfernt Leerzeichen. `$rEGION` schreibt alles klein. `$author` ist leer, und weil daneben ein `_` steht, fällt es weg. Leerzeichen in Dateinamen sind erlaubt, aber in Godot-Pfaden und Skripten lästig. Deshalb lohnt `< _>` oder ein Regionsname ohne Leerzeichen.
    resources:
      - title: REAPER User Guide 7.81 · Wildcards (S. 411)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=411

  - id: exportgroesse
    type: output
    title: Wie groß wird der Exportordner?
    prompt: |
      Zwanzig Klänge zu je 0,8 Sekunden, als WAV ohne BWF-Metadaten (44 Byte Kopf). Was gibt das Programm aus?
    lang: python
    code: |
      def wav_bytes(sekunden, rate, bit, kanaele):
          return round(sekunden * rate) * kanaele * bit // 8 + 44

      klaenge, laenge = 20, 0.8
      print(klaenge * wav_bytes(laenge, 48000, 24, 1))
      print(klaenge * wav_bytes(laenge, 48000, 16, 1))
      print(klaenge * wav_bytes(laenge, 48000, 24, 2))
    expected: |
      2304880
      1536880
      4608880
    explanation: |
      0,8 Sekunden sind bei 48 kHz 38 400 Samples, mit 3 Byte je Sample 115 200 Byte, plus Kopf. 16 Bit spart ein Drittel, Stereo verdoppelt. Für den Export ist die Größe selten ein Problem. Wichtiger ist, was Godot daraus macht: Gemessen in 4.7.2 speichert es WAV höchstens mit 16 Bit oder komprimiert mit Quite OK Audio. 24 Bit im Export kostet also Platz im Ordner, aber nichts im Spiel; im Archiv der Rohdateien ist es richtig aufgehoben.
    resources:
      - title: Godot Docs · Supported audio formats
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#supported-audio-formats

  - id: render-luecken
    type: gap
    title: Ein Render-Preset für Regionen
    prompt: |
      Ergänze die Einstellungen so, dass je Region eine Datei im Ordner `export/sfx` entsteht, die genau wie die Region heißt.
    lang: text
    code: |
      Source:      ⟦Region render matrix⟧
      Bounds:      ⟦All project regions⟧
      Directory:   ~/sound/export/sfx
      File name:   ⟦$region⟧
      Silently increment filenames: ⟦aus⟧
    gaps:
      - label: Source
        hint: Die Quelle, die Spuren und Regionen kombiniert.
        accept: ["Region Render Matrix", "region render matrix"]
      - label: Bounds
        hint: Alle Regionen des Projekts.
        accept: ["All Project Regions", "all project regions", "Project regions", "Project Regions", "project regions", "All regions", "All Regions", "all regions"]
      - label: Dateiname
        hint: Die Wildcard für den Namen der Region.
      - label: Hochzählen
        hint: Godot soll die neue Fassung unter dem alten Namen finden.
        accept: ["Aus", "AUS", "off", "Off", "OFF", "nein", "Nein", "deaktiviert", "Deaktiviert", "disabled", "Disabled"]
    explanation: |
      Die Matrix bestimmt, welche Spur für welche Region gerendert wird, *All project regions* nimmt alle Regionen. `$region` macht den Regionsnamen zum Dateinamen. Hochzählen bleibt aus, damit ein neuer Render die Datei ersetzt und Godot sie neu importiert. Speichere das als Preset, dann ist jeder weitere Export ein Klick.
    resources:
      - title: REAPER User Guide 7.81 · Render to File options (S. 414)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=414

  - id: fahne-abgeschnitten
    type: bug
    title: Der Hall endet hart
    prompt: |
      Auf der Spur „sauber“ liegt zum Test ein ReaVerbate. Im Projekt klingt jeder Klatscher sauber aus. In den gerenderten Dateien bricht der Hall am Ende abrupt ab. Welche Einstellung im Render-Dialog ist schuld?
    lang: text
    code: |
      Source:    Region render matrix
      Bounds:    All project regions
      Tail:      aus
      Regionen:  enden 20 ms nach dem trockenen Klatscher
      File name: $region
      Format:    WAV, 24 bit PCM
    lines: [3]
    explanation: |
      Ohne Tail endet jede Datei am Ende ihrer Region. Die Region endet kurz nach dem trockenen Klang, der Hall auf der Spur klingt aber länger. Im Render-Dialog ist Tail die Stelle; die Regionen selbst legst du in der Zeitleiste fest, nicht im Dialog. Zwei Wege: Tail einschalten und unter *Preferences → Audio → Rendering* für Regionen aktivieren, oder die Regionen bis zum Ende der Fahne verlängern. Ob ein Hall überhaupt in die Datei gehört oder im Spiel auf einem Bus liegt, ist eine eigene Entscheidung (siehe [Hüllkurve, Frequenz, Dynamik und Raum](/sound/klangformung)).
    resources:
      - title: REAPER User Guide 7.81 · Render-Dialog mit Tail (S. 413)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=413
      - title: REAPER User Guide 7.81 · Preferences, Audio, Rendering (S. 437)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=437

  - id: alte-fassung-im-spiel
    type: bug
    title: Godot spielt die alte Fassung
    prompt: |
      Du hast den Hochpass geändert und neu gerendert. In Godot klingt alles wie vorher. Im Exportordner liegen neben `pruef_klatsch_hand_01.wav` jetzt weitere Dateien mit angehängten Nummern. Welche Zeile ist schuld?
    lang: text
    code: |
      Source:    Region render matrix
      Bounds:    All project regions
      Directory: ~/projekte/spiel/audio/sfx
      File name: $region
      Silently increment filenames to avoid overwriting: an
      Format:    WAV, 24 bit PCM
    lines: [5]
    explanation: |
      Die Option schützt vor dem Überschreiben, indem sie eine Nummer anhängt. Für Musik-Exporte ist das bequem, für ein Spiel falsch: Die Szene verweist auf den alten Namen, und die neue Datei liegt daneben, ohne dass ein Node sie nutzt. Ist die Option aus, ersetzt der Render die Datei; ändert sich ihr Inhalt, importiert Godot sie neu. Die angehängten Kopien löschst du von Hand.
    resources:
      - title: REAPER User Guide 7.81 · Silently increment filenames (S. 415)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=415
