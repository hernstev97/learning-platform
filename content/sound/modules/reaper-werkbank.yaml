id: reaper-werkbank
title: REAPER als Werkbank für Spielgeräusche
level: 1
minutes: 130
summary: Wie du in REAPER aus einer langen Handy-Aufnahme viele kurze, saubere und gleich benannte Dateien machst – Projekt für Geräusche, Schnitt und Fades, Säubern mit Bordmitteln, je Klang eine Region und ein Render, den du nach jeder Änderung mit einem Klick wiederholst.
place: pc
goals:
  - Du legst ein REAPER-Projekt für Geräusche an und begründest Abtastrate und Bittiefe mit dem, was Godot 4.7.2 beim Import daraus macht.
  - Du schneidest Takes mit Fades und Nulldurchgängen und misst die Stille vor der Transiente.
  - Du säuberst Aufnahmen mit Hochpass, ReaFIR-Rauschprofil und ReaGate in einer begründeten Reihenfolge.
  - Du legst je Klang eine Region an, renderst alle über die Region Render Matrix und sagst aus Wildcards die Dateinamen voraus.
  - Du findest Render-Einstellungen, die Hallfahnen abschneiden oder Godot eine alte Fassung spielen lassen, und speicherst deine eigenen als Preset.
