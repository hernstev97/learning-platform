        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/import_process.html#automatic-reimport

  - id: stille-falsch-gemessen
    type: bug
    title: Das Skript misst zu viel Stille
    prompt: |
      Das Messskript meldet für eine 24-Bit-Monodatei mit 30 ms Stille vor dem Klick 90 ms, für eine 16-Bit-Stereodatei mit derselben Stille 120 ms. Finde die Zeile und korrigiere sie.
    lang: python
    code: |
      import wave

      def stille_vorn_ms(pfad, schwelle_db=-50.0):
          with wave.open(pfad) as w:
              rate = w.getframerate()
              kanaele = w.getnchannels()
              breite = w.getsampwidth()
              daten = w.readframes(w.getnframes())
          grenze = 2 ** (8 * breite - 1) * 10 ** (schwelle_db / 20)
          for pos in range(0, len(daten), breite):
              wert = int.from_bytes(daten[pos:pos + breite], "little", signed=True)
              if abs(wert) > grenze:
                  return 1000 * pos / rate
          return None
    lines: [13]
    fix:
      - line: 13
        answers:
          - return 1000 * (pos // breite // kanaele) / rate
          - return 1000 * (pos // (breite * kanaele)) / rate
          - return 1000 * (pos // (kanaele * breite)) / rate
          - return 1000 * (pos // kanaele // breite) / rate
          - return pos // breite // kanaele * 1000 / rate
          - return pos // (breite * kanaele) * 1000 / rate
          - return 1000 * pos / (breite * kanaele) / rate
          - return 1000 * pos / (kanaele * breite) / rate
          - return 1000 * pos / breite / kanaele / rate
          - return 1000 * (pos / (breite * kanaele)) / rate
          - return 1000 * (pos / breite / kanaele) / rate
          - return pos / (breite * kanaele) / rate * 1000
          - return pos / breite / kanaele / rate * 1000
    explanation: |
      `pos` zählt Bytes, nicht Zeitpunkte. Ein Zeitpunkt (in `wave` ein Frame) umfasst `breite` Bytes je Kanal und `kanaele` Kanäle, bei 24 Bit mono also 3 Byte, bei 16 Bit stereo 4 Byte. Deshalb kommt das Dreifache und das Vierfache heraus. Erst die Teilung durch Breite und Kanäle ergibt den Zeitpunkt, und der durch die Rate die Zeit. Ob du mit `//` auf ganze Zeitpunkte abrundest wie das Lektionsskript oder mit `/` teilst, ändert das Ergebnis um weniger als ein Sample.
    resources:
      - title: Python Docs · wave
        url: https://docs.python.org/3/library/wave.html

  - id: reafir-erklaeren
    type: explain
    title: Warum das Rauschprofil aus dem Room Tone kommt
    prompt: |
      Erkläre jemandem, der ReaFIR nicht kennt, was diese Notiz bewirkt und warum sie so aufgebaut ist.
    lang: text
    code: |
      Spur „sauber“, Sitzung 2026-10-24
      1 ReaEQ   High pass
      2 ReaFIR  Subtract, Edit mode Precise
                Profil: nur Room Tone (0:12–0:40)
                abgespielt, Lernen danach aus
      3 ReaGate hinter ReaFIR
      neue Sitzung = neue Spur, neues Profil
    points:
      - ReaFIR zieht im Modus Subtract ein gelerntes Rauschspektrum vom Signal ab.
      - Das Profil darf nur Rauschen enthalten, sonst zieht es Teile des Klangs ab; dafür ist der Room Tone da.
      - Das Lernen wird abgeschaltet, damit das Profil beim Abspielen der Klänge nicht weiterlernt.
      - Der Hochpass steht davor, weil das Profil das Signal lernen soll, das ReaFIR später bekommt.
      - Rauschen hängt an Ort und Gerät, deshalb gehört zu jeder Sitzung ein eigenes Profil.
    explanation: |
      ReaFIR im Modus *Subtract* lernt mit *Automatically build noise profile*, wie das Rauschen klingt, und zieht dieses Spektrum danach ab. Damit es nur das Rauschen lernt, spielst du beim Lernen nur den Room Tone ab und schaltest das Lernen danach aus; sonst würde es auch die Klatscher als Rauschen begreifen. Der Hochpass steht davor, weil das Profil zu dem Signal passen muss, das ReaFIR später bekommt. Für gleichmäßiges Rauschen ist ReaFIR das richtige Werkzeug, für gelegentliche Geräusche das Gate dahinter. Weil das Rauschen vom Ort und vom Gerät abhängt, bekommt jede Aufnahmesitzung eine eigene Spur mit eigenem Profil.
    resources:
      - title: REAPER User Guide 7.81 · Noise Reduction with ReaFir (S. 333)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=333
      - title: REAPER Effects Guide · ReaFir Subtract Mode (S. 22)
        url: https://www.reaper.fm/userguide/REAPEREffectsGuide2021.pdf#page=22

  - id: matrix-erklaeren
    type: explain
    title: Was diese Matrix rendert
    prompt: |
      Erkläre, welche Dateien diese Region Render Matrix mit dem Dateinamen `$region-$track` erzeugt und warum der Room Tone aus einer anderen Spur kommt. Die Spur „roh“ hat keine FX, „sauber“ die Säuberungskette. Tail ist aus.
    lang: text
    code: |
      Spur        klatsch_01  klatsch_02  room_tone
      Master mix
      roh                                     x
      sauber          x           x
    points:
      - "Es entstehen drei Dateien: `klatsch_01-sauber.wav`, `klatsch_02-sauber.wav` und `room_tone-roh.wav`."
      - Jede Datei ist so lang wie ihre Region und enthält die FX ihrer Spur.
      - Der Room Tone kommt unbearbeitet aus „roh“, damit sein Rauschen erhalten bleibt, etwa für ein späteres Profil oder als Grund unter Stille.
      - Die leere Zeile Master mix erzeugt keine zusätzlichen Mischdateien.
    explanation: |
      Jedes Kreuz ist eine Datei, benannt aus Region und Spur: zweimal die Klatscher aus „sauber“, mit Hochpass, Rauschprofil und Gate, einmal der Room Tone aus „roh“. Den Room Tone willst du gerade nicht entrauscht haben, denn er ist das Rauschen; du brauchst ihn für Profile oder als Grundton, der Lücken füllt. Grenzen der Dateien sind die Grenzen der Regionen, weil Tail aus ist. Der Master mix bleibt leer, sonst kämen je Region weitere Dateien mit dem Mix aller Spuren dazu.
    resources:
      - title: REAPER User Guide 7.81 · Region Render Matrix (S. 420)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=420

  - id: render-vorlage
    type: practice
    title: Ordner und Render-Preset anlegen
    prompt: |
      Lege die Ordner für deine Geräusche an und in REAPER ein Render-Preset, das je Region eine Datei in deinen Exportordner schreibt. Mach die Rohaufnahmen schreibgeschützt. Prüfe das Preset mit *Dry run* an einem Testprojekt mit zwei Regionen, dann mit einem echten Render. Ordnernamen, Abtastrate und Format sind deine Wahl; die Musterlösung zeigt Platzhalter.
    lang: text
    solution: |
      Ordner (Platzhalter)
      ~/sound/roh/            Handy-Dateien
      ~/sound/reaper/werkbank/werkbank.rpp
      ~/sound/export/sfx/

      Rohdateien schreibgeschützt:
      chmod -R a-w ~/sound/roh/2026-10-24_klatsch

      Render-Preset „Spiel-SFX“ (Presets → All settings)
      Source       Region render matrix
      Bounds       All project regions
      Tail         aus (an nur, wenn FX nachklingen)
      Directory    ~/sound/export/sfx
      File name    $region
      Sample rate  48000 (Platzhalter)
      Channels     Mono (Platzhalter)
      Format       WAV, 24 bit PCM
      Postprocess  Normalize nach deiner Wahl
      Silently increment filenames   aus

      Test: zwei Regionen pruef_a, pruef_b
      Dry run zeigt 2 Dateien, keine Übersteuerung
      Render: export/sfx/pruef_a.wav, pruef_b.wav
      Zweiter Render ersetzt beide, keine Kopien mit Nummer
    checklist:
      - "In deinem Rohordner lässt sich keine Datei ändern oder anlegen (Test: `echo x >> datei.wav` oder `touch neu.wav` im Ordner schlägt mit „Keine Berechtigung“ fehl)."
      - Das Preset steht unter *Presets* mit einem Namen, den du wiedererkennst, und lädt Source, Bounds, Dateiname und Format.
      - Ein Dry run mit zwei Regionen zeigt genau zwei Dateien.
      - Nach dem zweiten Render liegen im Exportordner dieselben zwei Dateinamen, ohne angehängte Nummern.
    explanation: |
      Ordner und Preset sind Technik, keine Gestaltung, deshalb gibt es hier eine Musterlösung. Der Schreibschutz verhindert, dass ein Glue oder ein Editor die einzige Kopie einer Aufnahme verändert. Das Preset sorgt dafür, dass jeder Export gleich entsteht. Der zweite Render ist der entscheidende Test: Er muss die Dateien ersetzen, sonst sieht Godot deine Änderungen nie.
    resources:
      - title: REAPER User Guide 7.81 · Render-Presets (S. 414)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=414

  - id: eigene-aufnahme-werkbank
    type: practice
    title: Deine Aufnahme durch die Werkbank
    prompt: |
      Nimm eine eigene Aufnahme aus [Feldaufnahme mit dem Handy](/sound/feldaufnahme) mit mehreren Takes und Room Tone. Schneide, säubere und rendere sie mit deinem Preset. Halte in einer kurzen Notiz fest, was du in welcher Reihenfolge eingestellt hast und warum. Wie stark du entrauschst und wie die Klänge klingen sollen, entscheidest du.
    lang: prose
    checklist:
      - Die Rohdatei ist unverändert, das Projekt arbeitet mit einer Kopie.
      - Room Tone und Ansage liegen als eigene Items im Projekt.
      - Das ReaFIR-Profil ist nur aus dem Room Tone gelernt, und das Lernen ist abgeschaltet.
      - Jede exportierte Datei heißt nach deinem Schema, und ihr Name steht so im Region/Marker Manager.
      - Das Messskript meldet für jede Datei die Stille vor der Transiente, und du hast notiert, welche Werte du akzeptierst.
      - Deine Notiz nennt die Reihenfolge der FX und einen Grund für jede Stelle.
    explanation: |
      Die Übung prüft die Werkbank, nicht deinen Geschmack. Ob die Klänge gelingen, hörst du später im Spiel. Ob die Werkbank trägt, siehst du daran, dass du eine Entscheidung ändern und alles in Minuten neu erzeugen kannst. Die Notiz brauchst du, wenn du in drei Wochen wissen willst, warum ein Klang so klingt.
    resources:
      - title: REAPER User Guide 7.81 · Dynamic Splitting (S. 150)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=150
