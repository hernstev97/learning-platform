lesson: |
  Drei Trainingsgegner greifen gleichzeitig an. Musik läuft, dazu das Bett der Halle, Schritte, Schwünge, Treffer. Ein vierter Gegner holt am Bildrand aus, und seine Warnung ist nicht zu hören. Kein einzelner Klang ist zu leise eingestellt. Zusammen verdecken sie ihn.

  Aus der Musik kennst du das Problem und die Werkzeuge: Platz im Spektrum schaffen, komprimieren, automatisieren, bis jede Spur ihren Ort hat. Im Stück gelingt das, weil die Kombination feststeht. Im Spiel entsteht der Mix zur Laufzeit aus Ereignissen, die niemand vorher kennt, und jede Kombination klingt anders. Du mischst also keine Stelle, sondern Regeln: welcher Klang Vorrang hat, wie viele gleichzeitig spielen dürfen, wer wen leiser macht und wo Stille hingehört.

  Dieses Modul plant diese Regeln am Handy, als Prioritätentabelle und Bus-Plan. Umgesetzt und gemessen wird am PC in [Lautheit, Export, Import und Hörtest](/sound/export-im-spiel). Alle Werte hier sind Platzhalter oder Werte anderer Spiele. Die Mischentscheidungen für dein Spiel triffst du.

  ## Priorität: die richtigen Klänge, nicht alle

  Walter Murch, Sounddesigner und Mischtonmeister von Apocalypse Now, beschreibt in [Dense Clarity – Clear Density](https://transom.org/2005/walter-murch/) eine Grenze. Von gleichartigen Klängen kann man etwa zweieinhalb Schichten einzeln verfolgen, er nennt das „Law of Two-and-a-half“. Sind die Schichten über sein Spektrum von Sprache bis Musik verteilt, werden es rund fünf. Für die Landung der Hubschrauber hielt er sich an fünf: „If I wanted to add something new, I had to take something else away.“ Als ein junger Soldat im Hubschrauber „I'm not going!“ ruft, nahm Murch die Musik ganz heraus, obwohl sie aus genau diesem Hubschrauber kommt. Sie war „the sacrificial victim“, und „you do not hear it go away“.

  Spiele brauchen dieselbe Entscheidung, nur automatisch. DICE beschreibt für Battlefield: Bad Company ein System namens HDR-Audio. Es misst die Lautheit am Ort des Hörers und skaliert alle Quellen danach. Auf den Folien steht „Prioritize, instead of compete for dynamic range“ und „Play the right sounds, not all sounds“. Priorität folgt dort der Lautheit: „loudness is a good approximation for ‘importance’ especially in FPS game“, und HDR-Audio „functions as a culling algorithm“, sortiert also leise Klänge aus ([Adaptive mixing in Frostbite](https://www.slideshare.net/slideshow/adaptive-mixing-in-frostbite/3128152), Folien 11 und 16).

  Sakurai ordnet in Smash die Lautstärke nach Wichtigkeit: KO zuerst, dann Treffer und Spezialangriffe, Schritte zuletzt ([Trefferfeedback](/combat/trefferfeedback), Abschnitt Ton). Eine **Prioritätentabelle** schreibt so eine Reihenfolge auf, bevor du etwas einstellst. Am Handy reicht Text:

  ```text
  Rang  Klangart      Grund
  1     …             darf man nicht
                      verpassen
  2     …             hilft beim
                      Spielen
  3     …             Stimmung, Bett
  ```

  Was auf welchem Rang steht, entscheidest du für dein Spiel. Die Spalte Grund ist Pflicht: Ohne Grund wird die Tabelle beim ersten Konflikt umgeschrieben.

  ## Bedrohung statt Lautheit: wie Overwatch Vorrang verteilt

  Das Overwatch-Team hat HDR-Audio ausprobiert und wieder verlassen. Ein Sounddesigner drehte den Klang eines brechenden Schilds immer lauter, weil er im Mix nicht durchkam, bis er Stimmen und anderes stark wegduckte ([Wwise Tour 2016, Teil 3](https://www.youtube.com/watch?v=2M5cWHswQsM), ab etwa 2:23). Ein Besucher von Audiokinetic sagte dem Team, HDR sei „basically just a ducking system that works on the only information it has which is volume“ (ab etwa 3:03). Das Team stellte eine andere Frage: „what is your greatest threat“.

  Jeder Gegner bekommt Punkte für seine Bedrohung, etwa wenn er auf dich zielt, schießt oder dich trifft. Dann sortiert das Spiel die Gegner in Plätze mit begrenzter Zahl: Der oberste nimmt nur einen auf, der zweite zwei, der Rest und alle Verbündeten landen weiter unten, und was darüber hinausgeht, im letzten Platz (ab etwa 6:45). Für Waffenfeuer anderer Spieler nannte das Team diese Werte:

  | Platz | Wer | Pegel | Prio |
  | --- | --- | --- | --- |
  | 1 | 1 Gegner | +7 dB | 95 |
  | 2 | 2 Gegner | etwa +3 dB | 60 |
  | 3 | Rest, Verbündete | 0 dB | 40 |
  | 4 | darüber hinaus | −7 bis −8 dB | 0 |

  Bei Priorität 0, so das Team, hört man den Klang wahrscheinlich nie (ab etwa 8:31 und 9:44). Für Schritte waren die Abstände noch größer, +12 und +9 dB für die beiden oberen Plätze, dann −4 dB, und ihre Priorität lag über der des Waffenfeuers (ab etwa 11:39). Anlass war eine Rückmeldung aus dem Design-Team: Jemand sei von hinten herangelaufen und habe geschossen.

  Die Zahlen gehören zu Overwatch, einem Spiel mit zwölf Spielern. Was du übernehmen kannst, ist der Aufbau: wenige Plätze oben, eine feste Zahl Klänge pro Platz, und eine Regel aus Spielwissen, nicht aus dem Pegel. Welche Spielinformation bei dir die Frage stellt, entscheidest du.

  > [!PRAXIS] Gleiche Dateien, anderer Mix
  > Overwatch unterscheidet Freund und Feind ohne eigene Aufnahmen. Waffenfeuer von Verbündeten läuft über dieselben Dateien, aber mit weniger Bass, leiser und leicht tiefer gestimmt, damit man es unbewusst von Gegnern trennt (Teil 3, ab etwa 10:34 und 15:04). Das ist eine Mischregel, keine neue Klanggestaltung: Eine Kategorie bekommt eine feste Behandlung im Mix, und jeder Klang, der hineinfällt, erbt sie.

  ## Maskierung in Frequenz und Zeit

  **Maskierung** ist laut Handbook for Acoustic Ecology „the effect one sound has on another by making it harder or impossible to hear“. Das Handbuch nennt zwei Formen, die du für Spiele brauchst. Tiefe Klänge stören die Wahrnehmung anderer stärker als hohe. Und Maskierung wirkt auch zeitlich, „for a few milliseconds before and after the desired sound“, als Vor- und Nachmaskierung ([Mask](https://www.sfu.ca/sonic-studio-webdav/cmns/Handbook/Mask.html)).

  Frequenzmaskierung kennst du vom EQ. Im Spiel kannst du aber keine Kombination entzerren, die du nie gehört hast. Deshalb planst du Lagen: Ein Signal, das in dichten Momenten durchkommen muss, braucht einen Bereich im Spektrum, in dem wenig anderes liegt. Die Verbündeten mit weniger Bass in Overwatch zeigen, wie das aussehen kann. Zeitliche Maskierung heißt: Ein leiser Klang direkt nach einer lauten Transiente geht unter, auch wenn er in einer anderen Lage liegt. Für eine Warnung zählt deshalb auch, was im Frame davor spielt.

  Murchs Spektrum ist eine dritte Achse. Er unterscheidet „Encoded“ und „Embodied“: Sprache trägt Bedeutung in einem Code, Musik wirkt direkt. Zwei Gespräche gleichzeitig kann man knapp verfolgen, drei nicht. Schichten aus verschiedenen Bereichen vertragen sich besser als Schichten aus demselben. Für dein Spiel heißt das: Zwei Warnungen mit Sprache gleichzeitig sind riskanter als eine Warnung plus Musik.

  Das Handbuch nennt eine Umgebung, in der Signale sich drängen, Lo-Fi: „overcrowded, resulting in masking and lack of clarity“. Das erste Mittel dagegen ist Murchs: weglassen. Im Spiel kommen begrenzen und verschieben dazu. Lauter drehen ist das letzte Mittel. Der Schild in Overwatch zeigt, warum: Wer immer lauter dreht, verdeckt am Ende das Nächste.

  > [!MERKE]
  > Weglassen, begrenzen, verschieben. Lauter drehen kommt zuletzt, denn jeder lautere Klang verdeckt den nächsten.

  ## Gleichzeitig: Summenpegel und Stimmenbegrenzung

  Spielen zwei Klänge zugleich, addieren sie sich. Wie viel lauter das wird, hängt davon ab, ob sie gleich sind. Gemessen in Godot 4.7.2 mit zwei Prüfsignalen, Sinustönen von 440 und 554 Hz mit je 0,5 Sekunden, aufgezeichnet über einen `AudioEffectCapture` auf `Master`:

  ```text
  A allein
    Spitze 0.2500  RMS 0.1767
  A + A im selben Frame
    Spitze +6.02 dB  RMS +6.02 dB
  A + B im selben Frame
    Spitze +6.02 dB  RMS +2.98 dB
  ```

  Derselbe Klang zweimal im selben Frame verdoppelt die Amplitude, das sind 20 × log10(2) ≈ +6 dB. Zwei verschiedene Klänge addieren sich in der Leistung, 10 × log10(2) ≈ +3 dB im RMS. Ihre Spitzen können trotzdem zusammenfallen und +6 dB erreichen. Das Modell in Python liefert fast dieselben Zahlen, im RMS von A + B +3,01 statt +2,98 dB:

  ```python run
  import math

  RATE = 48000
  N = RATE // 2  # 0,5 s


  def sinus(freq):
      w = 2 * math.pi * freq / RATE
      return [0.25 * math.sin(w * i)
              for i in range(N)]


  def rms(x):
      q = sum(v * v for v in x)
      return math.sqrt(q / len(x))


  def db(x, ref):
      return 20 * math.log10(x/ref)


  a, b = sinus(440), sinus(554)
  aa = [x + y for x, y in zip(a, a)]
  ab = [x + y for x, y in zip(a, b)]
  # Anstieg gegenüber A, in dB
  daa = db(rms(aa), rms(a))
  dab = db(rms(ab), rms(a))
  dsp = db(max(map(abs, ab)),
           max(map(abs, a)))
  print(f"A+A RMS    {daa:+.2f} dB")
  print(f"A+B RMS    {dab:+.2f} dB")
  print(f"A+B Spitze {dsp:+.2f} dB")
  ```

  Im Spiel heißt das: Trifft ein Schlag zwei Gegner im selben Frame, und beide spielen dieselbe Datei, hörst du einen Treffer, 6 dB lauter, keinen doppelten. Mit verschiedenen Varianten oder leicht verschobener Tonhöhe bleiben es zwei Klänge. Und jede Kategorie, die viele Klänge gleichzeitig erlaubt, braucht Headroom.

  > [!WARNING] Derselbe Klang im selben Frame
  > Zehn Kopien desselben Klangs im selben Frame sind 20 dB lauter als einer und klingen wie einer. Plane für Klänge, die oft gleichzeitig ausgelöst werden, Varianten und eine Grenze für gleichzeitige Stimmen.

  Diese Grenze heißt **Stimmenbegrenzung**. In Godot setzt sie `max_polyphony` am Player, Standard 1 (in 4.7.2 per Skript geprüft): „Calling play() after this value is reached will cut off the oldest sounds“ ([max_polyphony](https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer.html#class-audiostreamplayer-property-max-polyphony)). Wie sich das anhört, misst [Audio zuordnen](/godot/audio). Für die Planung bekommt jede Zeile der [Cue-Liste](/sound/klangplan) eine Zahl „max. Stimmen“. Murch liefert einen Hinweis, wie klein sie sein darf. Bei den Robotern in THX 1138 mussten die Schritte von einem oder zwei synchron zum Bild sein, bei dreien „nothing had to be in sync“. Ab drei hört man eine Gruppe, keine einzelnen.

  ## Ducking und Sidechain als Plan

  **Ducking** heißt: Ein Klang macht einen anderen leiser, solange er spielt. **Sidechain** heißt der Weg dafür. Ein Kompressor auf dem einen Bus hört auf das Signal eines anderen. Godots `AudioEffectCompressor` nennt diese Anwendung: „This technique is common in video game mixing to decrease the volume of music and SFX while voices are being heard. This effect is also known as ‚ducking‘“ ([AudioEffectCompressor](https://docs.godotengine.org/en/stable/classes/class_audioeffectcompressor.html)). Den Bus, auf den er hört, nennt die Eigenschaft `sidechain`, und zwar mit Namen.

  Die Standardwerte in Godot 4.7.2, per Skript geprüft: `threshold` 0 dB, `ratio` 4, `attack_us` 20 µs, `release_ms` 250 ms. Die Attack-Zeit geht laut Doku von 20 bis 2000 Mikrosekunden, die Release-Zeit von 20 bis 2000 Millisekunden. Für deinen Plan rechnest du die Release in Frames: 250 ms sind 15 Frames, 2000 ms 120. Das ist die untere Grenze, nicht die Rückkehrzeit. Gemessen in Godot 4.7.2 mit 250 ms Release fehlten der Musik eine halbe Sekunde nach dem Ende des auslösenden Klangs noch 2,8 dB, eine Sekunde danach noch 0,4 dB ([Lautheit, Export, Import und Hörtest](/sound/export-im-spiel)).

  Ducking ist kein Allheilmittel. Overwatchs Schild zeigt ein Ducking, das niemand geplant hatte. DICE schreibt auf seinen Folien, Alternativen wie „duckers, snapshot mixers, scene defines“ lösten das Problem der Battlefield-Sandbox nicht (Folie 5). Plane deshalb wenige Regeln, jede mit Auslöser und Grund.

  Der Bus-Plan dazu als Baum. Die Namen sind Platzhalter:

  ```text
  Master
  ├─ Musik
  ├─ SFX
  │  ├─ SFX_Spieler
  │  └─ SFX_Gegner
  ├─ Atmo
  └─ UI
  ```

  In Godot sendet ein Bus nur an einen Bus weiter links in der Liste, am Ende an `Master` ([Audio zuordnen](/godot/audio)). Eine Ducking-Regel schreibst du als Zeile:

  ```text
  Auslöser   SFX_Gegner
  Ziel       Musik
  Absenkung  Platzhalter
  Release    250 ms = 15 Frames
  Grund      Warnungen hören
  ```

  Die Umsetzung mit `sidechain` und das Messen der Absenkung folgen in [Lautheit, Export, Import und Hörtest](/sound/export-im-spiel).

  ## Stille und Dichte über einen Abschnitt

  „There is no such thing as silence“, schloss John Cage nach einem Besuch in einem schalltoten Raum; das Handbuch zitiert ihn im Eintrag [Silence](https://www.sfu.ca/sonic-studio-webdav/cmns/Handbook/Silence.html). Im Spiel ist Stille fast nie digitale Null. Es ist der Moment, in dem Schichten wegfallen und wenig bleibt: ein Room Tone, also das Grundrauschen eines Raums, ein leises Bett, ein einzelnes Signal. Overwatch dämpft alles, wenn du dich in eine Nische zurückziehst, und dann hörst du „clearly one person walk in the room“ ([Teil 4](https://www.youtube.com/watch?v=F2N8bbzhHd8), ab etwa 7:19). Stille macht das Nächste hörbar, das kommt.

  Murch überträgt die Regel der Lautstärke auf die Dichte: „Conceptual density is something that should obey the same rules as loudness dynamics.“ Und: „A monotonously dense soundtrack is just as wearing as a monotonously loud film.“ Für ein Spiel heißt das, die Dichte folgt dem Rhythmus des Abschnitts. Im Level-Design-Kurs hat jeder Takt eine geschätzte Intensität, und dort steht: „Musik und Klang tragen den Rhythmus mit“ ([Rhythmus](/level-design/rhythmus)). Neben den Taktplan schreibst du, welche Schichten pro Takt spielen. Eine ausgedachte Form, keine Vorgabe:

  ```text
  Takt  Int.  Schichten
  1     1     Bett
  2     2     Bett, Spot
  3     4     Musik, SFX
  4     1     Bett, Musik leise
  5     0     Room Tone
  ```

  Mit Kopfhörern prüfst du das, indem du fragst: Was wird wann leiser, und was bleibt? Im Overwatch-Beispiel ab etwa 12:40 in Teil 3 kämpfen zwei Spieler um den oberen Platz, bis sich eine Scharfschützin umdreht und anlegt. Ab da kommen ihre Schüsse durch. Genau solche Wechsel hörst du in deinem eigenen Spiel ab.

  > [!INTERVIEW]
  > „Im Bosskampf hört man die Warnung des Bosses nicht. Was tust du?“ Gute Antwort, etwa als Audio Designer: Ich nehme die Stelle auf und schreibe auf, was im Moment der Warnung gleichzeitig spielt. Dann prüfe ich die Prioritätentabelle: Hat die Warnung den Rang, den sie braucht, und hält sich der Mix daran? Danach prüfe ich Maskierung, in der Lage und in der Zeit, etwa eine laute Transiente direkt davor. Erst nehme ich etwas weg, begrenze Stimmen oder ducke die Musik mit einer Regel; lauter drehe ich zuletzt, sonst verdecke ich das Nächste. Danach teste ich dieselbe Situation noch einmal und vergleiche.

  ## Häufige Fehler

  - **Lautstärke gegen Lautstärke.** Jeder wichtige Klang wird lauter gedreht, bis alles laut ist und nichts heraussticht. Priorität und Weglassen zuerst.
  - **Derselbe Klang mehrfach im selben Frame.** Er wird bis zu 6 dB pro Verdopplung lauter und klingt wie einer. Varianten und Stimmenbegrenzung planen.
  - **Keine Stimmenbegrenzung.** Viele Gegner, viele Schritte, und der Mix wird Lo-Fi.
  - **Ducking ohne Grund.** Jede Regel drückt etwas weg. Ohne Auslöser und Grund im Plan weiß später niemand, warum die Musik pumpt.
  - **Sidechain auf einen Bus, den es so nicht gibt.** Der Name muss genau stimmen. Sonst hört der Kompressor in Godot 4.7.2 ohne Meldung auf `Master` und duckt bei Klängen, die er nicht soll.
  - **Stille als Null.** Wird alles abgeschaltet, klingt es nach Fehler. Ein Room Tone oder ein leises Bett bleibt.
  - **Gleiche Dichte im ganzen Abschnitt.** Dann ist der Kampf nicht dichter als der Weg dorthin.

  ## Zusammenfassung

  - Im Spiel mischst du Regeln, nicht Stellen: Priorität, Stimmenbegrenzung, Ducking, Stille.
  - Murch: Von gleichartigen Klängen verfolgt man etwa zweieinhalb Schichten, verteilt rund fünf. Wer etwas hinzufügt, nimmt etwas weg.
  - DICE priorisiert nach Lautheit und sortiert leise Klänge aus. Overwatch fragt nach der größten Bedrohung und verteilt Vorrang auf wenige Plätze.
  - Maskierung wirkt in der Frequenz, tiefe Klänge stärker, und in der Zeit, kurz vor und nach einem Klang.
  - Gleiche Klänge im selben Frame: +6 dB pro Verdopplung. Verschiedene: etwa +3 dB im RMS, Spitzen bis +6 dB. Gemessen in Godot 4.7.2.
  - `max_polyphony` begrenzt Stimmen und schneidet die ältesten ab. Ducking geht in Godot über `AudioEffectCompressor.sidechain`; 250 ms Release sind 15 Frames, die Rückkehr dauert gemessen länger.
  - Stille ist selten Null. Sie macht das Nächste hörbar, und die Dichte folgt dem Rhythmus des Abschnitts.
exercises:
  - id: lautheit-oder-bedrohung
    type: choice
    title: Wer entscheidet, was man hört?
    prompt: |
      Welche Aussagen über HDR-Audio bei DICE und den Mix von Overwatch stimmen? Mehrere Antworten richtig.
    options:
      - text: DICE nimmt die Lautheit als Näherung für Wichtigkeit und sortiert leise Klänge aus.
        correct: true
        why: Auf den Folien steht „loudness is a good approximation for ‘importance’“ und „functions as a culling algorithm“.
      - text: Overwatch verteilt Vorrang nach der Bedrohung, die ein Gegner für dich darstellt.
        correct: true
        why: Die Leitfrage war „what is your greatest threat“. Zielen, Schießen und Treffen geben Punkte.
      - text: HDR-Audio ist bei DICE eine Kompression, die alle Klänge auf eine Lautheit bringt.
        correct: false
        why: Die Folien sagen ausdrücklich „HDR Audio is not compression“. Es arbeitet mit logischen Lautheitswerten und verändert die Wellenform nicht.
      - text: In Overwatch kommen beliebig viele Gegner auf den obersten Platz, solange sie auf dich zielen.
        correct: false
        why: Der oberste Platz nimmt nur einen Gegner auf, der zweite zwei. Die Begrenzung ist der Kern des Systems.
      - text: Overwatch ließ HDR fallen, weil es keine Spielinformation kennt, nur den Pegel.
        correct: true
        why: Ein Besucher von Audiokinetic nannte HDR „just a ducking system that works on the only information it has which is volume“.
    explanation: |
      Beide Systeme spielen nicht alles, was gerade passiert. Sie unterscheiden sich darin, woher sie wissen, was wichtig ist. DICE nimmt die Lautheit, was in einem Shooter oft passt. Overwatch nimmt Spielwissen, weil ein leiser Gegner, der auf dich zielt, wichtiger sein kann als ein lauter, der wegschaut. Für dein Spiel überlegst du, welche Information die bessere Frage ergibt.
    resources:
      - title: DICE · HDR Audio, Adaptive mixing in Frostbite (Folien)
        url: https://www.slideshare.net/slideshow/adaptive-mixing-in-frostbite/3128152
      - title: Wwise Tour 2016 · Overwatch (3 of 7) – A Clear Mix
        url: https://www.youtube.com/watch?v=2M5cWHswQsM

  - id: warnung-geht-unter
    type: order
    title: Die Warnung geht unter
    prompt: |
      Eine Warnung ist im dichten Kampf nicht zu hören. Bring die Schritte der Fehlersuche in die Reihenfolge aus der Lektion.
    lang: prose
    lines: |
      Die Stelle aufnehmen und notieren, was im Moment der Warnung gleichzeitig spielt
      In der Prioritätentabelle prüfen, welchen Rang die Warnung hat
      Maskierung prüfen, in der Lage und in der Zeit
      Etwas wegnehmen, Stimmen begrenzen oder mit einer Regel ducken
      Erst wenn das nicht reicht, die Warnung lauter machen
      Dieselbe Situation noch einmal testen und vergleichen
    explanation: |
      Zuerst brauchst du einen Befund, keine Vermutung. Die Tabelle sagt dann, ob die Warnung Vorrang haben soll. Maskierung erklärt, warum sie trotzdem untergeht. Die Mittel folgen der Lehre aus Murch und Overwatch: weglassen und begrenzen vor lauter drehen, denn ein lauterer Klang verdeckt den nächsten. Ohne Test derselben Situation weißt du nicht, ob die Änderung gewirkt hat.

  - id: dreimal-derselbe-treffer
    type: output
    title: Drei Treffer im selben Frame
    prompt: |
      Ein Schlag trifft n Gegner im selben Frame. Einmal spielt jeder dieselbe Datei, einmal verschiedene Varianten. Das Programm rechnet den Anstieg im RMS gegenüber einem Treffer. Was gibt es aus?
    lang: python
    code: |
      import math

      for n in (2, 3, 4):
          gleich = 20 * math.log10(n)
          versch = 10 * math.log10(n)
          print(n, round(gleich, 1),
                round(versch, 1))
    expected: |
      2 6.0 3.0
      3 9.5 4.8
      4 12.0 6.0
    hints:
      - Gleiche Klänge addieren sich in der Amplitude, verschiedene in der Leistung.
    explanation: |
      Gleiche Klänge im selben Frame addieren sich wie eine einzige Welle mit n-facher Amplitude, also 20 × log10(n). Vier Kopien sind 12 dB lauter und klingen wie ein Treffer. Verschiedene Klänge addieren sich in der Leistung, 10 × log10(n): Vier Varianten sind etwa 6 dB lauter und als mehrere Treffer zu hören. Die Messung in Godot 4.7.2 bestätigt den Fall n = 2 mit +6,02 und +2,98 dB.
    resources:
      - title: Godot Docs · Audio buses, Decibel scale
        url: https://docs.godotengine.org/en/stable/tutorials/audio/audio_buses.html#decibel-scale

  - id: spitzen-addieren
    type: output
    title: Drei Spitzen auf einmal
    prompt: |
      Drei verschiedene Klänge haben je eine Spitze bei −6 dBFS. Im ungünstigsten Fall fallen ihre Spitzen in dasselbe Sample. Das Programm rechnet die Summe. Was gibt es aus?
    lang: python
    code: |
      import math

      # −6 dBFS als Amplitude
      spitze = 10 ** (-6 / 20)
      summe = 3 * spitze
      print(round(spitze, 3))
      db = 20 * math.log10(summe)
      print(round(db, 1))
      print(summe > 1.0)
    expected: |
      0.501
      3.5
      True
    hints:
      - −6 dB ist ziemlich genau die halbe Amplitude.
    explanation: |
      −6 dBFS sind eine Amplitude von 0,501. Drei davon im selben Sample ergeben 1,504, also etwa +3,5 dBFS, über der Grenze von 0 dBFS. Im RMS wären drei verschiedene Klänge nur etwa 4,8 dB lauter als einer, ihre Spitzen können aber trotzdem zusammenfallen. Deshalb braucht jede Kategorie, die mehrere Klänge gleichzeitig zulässt, Headroom. Wie du Spitzen und Lautheit im Export misst, folgt in [Lautheit, Export, Import und Hörtest](/sound/export-im-spiel).
    resources:
      - title: Godot Docs · @GlobalScope.linear_to_db
        url: https://docs.godotengine.org/en/stable/classes/class_@globalscope.html#class-globalscope-method-linear-to-db

  - id: release-in-frames
    type: output
    title: Wann ist die Musik zurück?
    prompt: |
      Eine Warnung spielt von Frame 300 bis Frame 360 und duckt die Musik. Das vereinfachte Modell rechnet nur die Release-Zeit in Frames um und zählt sie zum Ende der Warnung; das ist die früheste Rückkehr. Was gibt das Programm aus?
    lang: python
    code: |
      FPS = 60
      ende = 360  # Frame
      for ms in (250, 500, 2000):
          n = ms * FPS // 1000  # Frames
          print(ms, n, ende + n)
    expected: |
      250 15 375
      500 30 390
      2000 120 480
    hints:
      - 1000 ms sind 60 Frames.
    explanation: |
      250 ms sind 15 Frames, 500 ms 30, 2000 ms 120 Frames, die längste Release, die Godots Kompressor erlaubt. Mit 2000 ms ist die Musik frühestens zwei Sekunden nach der Warnung zurück. Folgt in dieser Zeit die nächste Warnung, bleibt die Musik dauerhaft gedrückt. Das Modell ist grob: Ein Kompressor lässt die Absenkung allmählich los, nicht auf einen Schlag. In Godot 4.7.2 gemessen fehlten der Musik mit 250 ms Release eine halbe Sekunde nach dem Ende des auslösenden Klangs noch 2,8 dB, eine Sekunde danach noch 0,4 dB (siehe [Lautheit, Export, Import und Hörtest](/sound/export-im-spiel)). Für den Plan reicht die Rechnung als untere Grenze, um Release-Zeit und Abstand zwischen Ereignissen zu vergleichen; den echten Verlauf misst du im Spiel.
    resources:
      - title: Godot Docs · AudioEffectCompressor · release_ms
        url: https://docs.godotengine.org/en/stable/classes/class_audioeffectcompressor.html#class-audioeffectcompressor-property-release-ms

  - id: godot-eigenschaften
    type: gap
    title: Plan mit Godot-Namen
    prompt: |
      Ergänze die Namen der Godot-Eigenschaften und die Umrechnung. Der Kompressor auf dem Bus `Musik` soll auf den Bus `Stimme` hören, der Treffer-Player höchstens drei Klänge gleichzeitig spielen.
    lang: text
    code: |
      Bus Musik
        Effekt  AudioEffectCompressor
        ⟦sidechain⟧ = Stimme
        release_ms = 250
          = ⟦15⟧ Frames bei 60/s
      Player Treffer
        ⟦max_polyphony⟧ = 3
    gaps:
      - label: Eigenschaft für den hörenden Bus
        hint: Englisch für den Steuerweg eines Kompressors.
        accept: ["Sidechain"]
      - label: Frames
        hint: 250 × 60 / 1000
      - label: Stimmen
        hint: Polyphonie, mit Unterstrich davor „max“.
    explanation: |
      `sidechain` nennt den Bus, dessen Pegel die Absenkung steuert, und zwar mit Namen. `release_ms` ist die Zeit, bis der Kompressor die Absenkung loslässt; 250 ms sind 15 Frames. `max_polyphony` begrenzt, wie viele Klänge ein Player gleichzeitig spielt, und schneidet beim nächsten `play()` die ältesten ab. Die Werte sind Platzhalter.
    resources:
      - title: Godot Docs · AudioEffectCompressor · sidechain
        url: https://docs.godotengine.org/en/stable/classes/class_audioeffectcompressor.html#class-audioeffectcompressor-property-sidechain
      - title: Godot Docs · AudioStreamPlayer · max_polyphony
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer.html#class-audiostreamplayer-property-max-polyphony

  - id: begriffe-mix
    type: gap
    title: Vier Begriffe der Mischung
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Wenn ein Klang einen anderen schwerer hörbar macht, heißt das ⟦Maskierung⟧. Ein Klang macht einen anderen leiser, solange er spielt: Das ist ⟦Ducking⟧. Der Steuerweg, über den ein Kompressor auf einen anderen Bus hört, heißt ⟦Sidechain⟧. Die Grenze, wie viele Klänge ein Player gleichzeitig spielen darf, heißt ⟦Stimmenbegrenzung⟧.
    gaps:
      - label: Verdecken
        hint: Englisch masking.
        accept: ["Masking", "Verdeckung"]
      - label: Absenken
        hint: Englisch, vom Ducken.
      - label: Steuerweg
        hint: Englisch, wörtlich Seitenkette.
        accept: ["Seitenkette", "Sidechaining", "Side-Chain", "Side Chain"]
      - label: Grenze
        hint: In Godot heißt sie max_polyphony.
        accept: ["Polyphonie", "max_polyphony", "Voice Limit", "Stimmenlimit"]
    explanation: |
      Maskierung ist das Problem, die anderen drei sind Werkzeuge. Ducking und Sidechain hängen zusammen: Ducking beschreibt die Wirkung, Sidechain den Weg. Die Stimmenbegrenzung setzt früher an, sie verhindert, dass zu viele Klänge überhaupt spielen.

  - id: sidechain-falscher-bus
    type: bug
    title: Die Musik duckt bei allem
    prompt: |
      Laut Plan soll die Musik nur leiser werden, solange ein Gegner etwas spielt. Im Test duckt sie aber bei jedem Effekt, auch bei den Schritten der Spielfigur. Godot meldet keinen Fehler. Die Busse stehen in dieser Reihenfolge von links nach rechts im Audio-Panel. Finde die Zeile, die nicht zum Bus-Plan passt, und korrigiere sie.
    lang: text
    code: |
      Busse
        Master
        Musik
        SFX_Spieler
        SFX_Gegner
      Ducking
        Bus        Musik
        Effekt     AudioEffectCompressor
        sidechain  SFX_Gegner_Warnung
        release    250 ms
    lines: [9]
    fix:
      - line: 9
        answers:
          - sidechain  SFX_Gegner
          - Sidechain  SFX_Gegner
          - "sidechain = SFX_Gegner"
          - "sidechain: SFX_Gegner"
          - "Sidechain: SFX_Gegner"
          - sidechain = "SFX_Gegner"
          - sidechain = &"SFX_Gegner"
    explanation: |
      `sidechain` nennt einen Bus mit Namen. Einen Bus `SFX_Gegner_Warnung` gibt es im Plan nicht. Godot meldet das nicht, sondern lässt den Kompressor in 4.7.2 auf `Master` hören, gemessen in [Lautheit, Export, Import und Hörtest](/sound/export-im-spiel). Auf `Master` liegt schon alles, was Godot vor `Musik` bearbeitet hat, also alle Busse rechts davon, hier beide SFX-Busse. Deshalb duckt jeder Effekt die Musik. Mit `SFX_Gegner` hört der Kompressor nur auf Gegnergeräusche. Sollen nur Warnungen ducken, legst du dafür einen eigenen Bus an. Was du willst, entscheidet der Grund in deiner Ducking-Regel.
    resources:
      - title: Godot Docs · AudioEffectCompressor · sidechain
        url: https://docs.godotengine.org/en/stable/classes/class_audioeffectcompressor.html#class-audioeffectcompressor-property-sidechain

  - id: treffer-klingt-wie-einer
    type: bug
    title: Drei Gegner, ein Treffer
    prompt: |
      Du willst hören, wenn ein Schlag mehrere Gegner trifft. Im Test trifft ein Schlag drei Gegner im selben Frame, und du hörst einen einzigen, deutlich lauteren Treffer. Finde die Zeile der Karteikarte, die das verursacht.
    lang: text
    code: |
      ID           sfx_dummy_treffer
      Auslöser     Treffer gemeldet
      Typ          One-Shot
      Varianten    1
      max. Stimmen 3
      Ort          ja, 2D am Dummy
    lines: [4]
    explanation: |
      Mit einer einzigen Variante spielen drei Stimmen im selben Frame dieselbe Datei. Sie addieren sich zu einer Welle mit dreifacher Amplitude, etwa 9,5 dB lauter, und klingen wie ein Treffer. Drei Stimmen sind hier gewollt, sonst hörte man nur einen. Damit es nach drei Treffern klingt, brauchen die Stimmen verschiedene Varianten oder eine leicht verschiedene Tonhöhe. Wie viel Abweichung du willst, entscheidest du beim Hören.
    resources:
      - title: Godot Docs · AudioStreamRandomizer
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamrandomizer.html

  - id: freund-und-feind
    type: explain
    title: Dieselben Dateien, zwei Lager
    prompt: |
      Erkläre, was das Overwatch-Team hier gemacht hat und warum es eine Mischentscheidung ist, keine neue Klanggestaltung.
    lang: prose
    code: |
      Waffenfeuer von Verbündeten und Gegnern benutzt dieselben Dateien.
      Verbündete laufen über den untersten regulären Platz.
      Ihr Waffenfeuer hat weniger Bass, ist leiser und etwas tiefer gestimmt.
    points:
      - Die Unterscheidung entsteht durch Regeln im Mix, nicht durch eigene Aufnahmen.
      - Weniger Bass und tiefere Stimmung geben den Verbündeten eine eigene Lage und verringern Maskierung.
      - Gegner behalten den Vorrang, weil sie die Bedrohung sind.
      - Jeder neue Klang der Kategorie erbt die Behandlung automatisch.
    explanation: |
      Das Team brauchte zwei Fassungen jedes Waffenklangs und nahm doch nur eine auf. Die zweite entsteht im Mix: weniger Bass, leiser, etwas tiefer. Spieler trennen so Verbündete von Gegnern, ohne darüber nachzudenken, und die Gegner behalten Vorrang. Weil die Regel an der Kategorie hängt, gilt sie für jede neue Waffe von selbst. Für deinen Plan heißt das: Eine Kategorie kann eine Behandlung haben, die du nur einmal festlegst.
    resources:
      - title: Wwise Tour 2016 · Overwatch (3 of 7) – A Clear Mix
        url: https://www.youtube.com/watch?v=2M5cWHswQsM

  - id: murch-musik-weg
    type: explain
    title: Die Musik, die man nicht vermisst
    prompt: |
      Erkläre Murchs Entscheidung in eigenen Worten und was ein Spiel daraus lernen kann.
    lang: prose
    code: |
      Eine Hubschrauberszene mit höchstens fünf Schichten.
      Ein junger Soldat im Hubschrauber ruft „I'm not going!“.
      Murch nimmt für diesen Satz die Musik ganz heraus, obwohl sie aus genau diesem Hubschrauber kommt.
      Nach dem Satz kommt die Musik zurück, und etwas anderes fällt weg.
    points:
      - Es gibt eine Grenze, wie viele Schichten man gleichzeitig verfolgen kann.
      - Wer etwas hinzufügt, muss etwas anderes wegnehmen.
      - Die Musik verschwindet, ohne dass man es bemerkt, weil die Aufmerksamkeit beim Satz ist.
      - Im Spiel übernimmt eine Regel diese Entscheidung zur Laufzeit, etwa Priorität oder Ducking.
    explanation: |
      Murch hält die Szene bei fünf Schichten, weil mehr zu Rauschen verschmilzt. Der Satz des Soldaten muss verständlich sein, also muss etwas weichen, und er wählt die Musik, obwohl sie dort am lautesten sein müsste. Man hört sie nicht verschwinden. Ein Spiel kann das nicht von Hand für jede Stelle tun. Es braucht eine Regel, die zur Laufzeit dasselbe entscheidet: Was gerade Vorrang hat, bleibt, anderes wird leiser oder fällt weg.
    resources:
      - title: Walter Murch · Dense Clarity – Clear Density (Transom)
        url: https://transom.org/2005/walter-murch/

  - id: was-wird-leiser
    type: practice
    title: Was wird wann leiser?
    prompt: |
      Hör mit Kopfhörern einen dichten Moment von 20 bis 40 Sekunden aus einem Spiel deiner Wahl, ohne Kommentar. Wenn du keinen zur Hand hast, nimm das Beispiel in [A Clear Mix](https://www.youtube.com/watch?v=2M5cWHswQsM) ab etwa 12:40. Notier in wenigen Zeilen, was wann leiser oder lauter wird, was ganz wegfällt und was durchkommt.
    lang: prose
    checklist:
      - Du hast Spiel oder Clip und den Zeitbereich notiert.
      - Mindestens drei Zeilen mit Zeit und dem, was leiser, lauter oder still wird.
      - Bei mindestens einer Zeile hast du notiert, welcher Klang dabei Vorrang bekommt.
      - Du hast notiert, ob du eine Regel vermutest, etwa Priorität, Ducking oder Stimmenbegrenzung, und sie als Vermutung markiert.
      - Bewertungen stehen nicht in den Zeilen.
    explanation: |
      Einen fertigen Mix kannst du nicht aufschrauben, aber du hörst seine Regeln. Wer gewinnt, wenn es dicht wird? Was verschwindet, ohne dass es auffällt? Die Vermutungen notierst du als Vermutungen; prüfen kannst du sie nur in deinem eigenen Spiel. Das Protokoll aus [Kritisch hören](/sound/hoeren-analysieren) ist dafür die Form.
    resources:
      - title: Wwise Tour 2016 · Overwatch (3 of 7) – A Clear Mix
        url: https://www.youtube.com/watch?v=2M5cWHswQsM

  - id: eigener-mix-plan
    type: practice
    title: Prioritäten und Busse für einen Abschnitt
    prompt: |
      Schreib für einen Abschnitt deines Spiels oder einer Testszene einen kurzen Mix-Plan: eine Prioritätentabelle mit drei Rängen, einen Bus-Baum und eine Ducking-Regel. Alle Namen und Werte sind deine Platzhalter.
    lang: prose
    checklist:
      - Die Prioritätentabelle hat drei Ränge, jeder mit Klangart und Grund.
      - Der Bus-Baum endet in Master, und jeder Bus hat einen eindeutigen Namen.
      - Die Ducking-Regel nennt Auslöser-Bus, Ziel-Bus, Release in Frames und einen Grund.
      - Der Auslöser-Bus der Regel steht genau so im Bus-Baum.
      - Für mindestens eine Klangart hast du eine Zahl für gleichzeitige Stimmen notiert.
      - Du hast notiert, wo im Abschnitt es still wird und was dort bleibt.
    hints:
      - Fang mit der Frage an, welche Information der Spieler in diesem Abschnitt nicht verpassen darf.
    explanation: |
      Der Plan hält Mischentscheidungen fest, bevor du in Godot einen Regler anfasst. Er ist kurz genug fürs Handy und genau genug, um ihn am PC umzusetzen und zu messen. Die Prüfung, ob der Auslöser-Bus genau so heißt, verhindert den häufigsten stillen Fehler. Umgesetzt wird der Plan in [Lautheit, Export, Import und Hörtest](/sound/export-im-spiel), geprüft im Spiel.
    resources:
      - title: Godot Docs · Audio buses
        url: https://docs.godotengine.org/en/stable/tutorials/audio/audio_buses.html
