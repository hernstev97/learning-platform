id: mischung-stille
title: "Mischung: Musik, Geräusche und Stille nach Priorität"
level: 2
minutes: 100
summary: Wie ein Spiel zur Laufzeit entscheidet, welcher Klang Vorrang hat – Priorität statt Lautstärkekampf, Maskierung in Frequenz und Zeit, Summenpegel und Stimmenbegrenzung, Ducking als Plan, Stille als Kontrast –, an Overwatch, Battlefield und Walter Murch, mit in Godot 4.7.2 gemessenen Summenpegeln.
place: unterwegs
goals:
  - Du vergleichst Priorität nach Lautheit (HDR-Audio bei DICE) mit Priorität nach Bedrohung (Overwatch) und schreibst eine eigene Prioritätentabelle mit Begründungen.
  - Du erkennst Maskierung in Frequenz und Zeit und nennst Mittel dagegen, die nicht „lauter“ heißen.
  - Du rechnest Summenpegel gleichzeitiger Klänge – gleiche Klänge im selben Frame +6 dB, verschiedene etwa +3 dB – und planst Stimmenbegrenzung pro Klang.
  - Du planst Busse und Ducking als Tabelle und rechnest Release-Zeiten in Frames um.
  - Du setzt Stille als Kontrast ein und planst die Dichte des Mixes über einen Abschnitt passend zum Taktplan.
