lesson: |
  Du legst einen eigenen Trefferklang in die [Testszene: Angriff](/combat/testszene-angriff). Laut Log meldet der Dummy den Treffer in Frame 21, und genau dort startet der Ton. Trotzdem wirkt er spät und verwaschen, und wenn der Dummy rechts steht, kommt er von links. In der Datei stehen 40 ms Stille vor dem ersten Ausschlag, die Hallfahne läuft 1,2 Sekunden, und die Datei ist stereo, aufgenommen mit dem Handy links neben der Quelle.

  Hüllkurve, EQ, Kompressor und Hall kennst du aus der Musik. Im Spiel kommt hinzu: Ein kurzer Klang muss in einem bestimmten Frame ankommen, er wiederholt sich in einem Takt, den das Spiel vorgibt, er steht neben vielen anderen, und er hat einen Ort auf dem Bildschirm. Dieses Modul geht die vier Werkzeuge unter diesen Bedingungen durch. Wie dein Klang klingt, entscheidest du; alle Zahlen hier sind Platzhalter oder Messwerte.

  ## Hüllkurve: wann der Klang passiert

  Der hörbare Moment eines kurzen Klangs ist seine **Transiente**, der steile Anstieg am Anfang. Alles davor ist Wartezeit. Bei 60 Frames pro Sekunde dauert ein Frame 16,7 ms, bei 48 kHz sind das 800 Samples. 40 ms Stille am Dateianfang verschieben den hörbaren Treffer also um 2,4 Frames. Der Ton startet im richtigen Frame und klingt im falschen. Wie du die Stille beim Import oder Export abschneidest, steht in [Audio zuordnen](/godot/audio).

  Für den Treffer gilt die Regel aus [Trefferfeedback](/combat/trefferfeedback): Der Ton gehört in den Frame, in dem der Treffer gemeldet wird. Das setzt voraus, dass die Transiente am Anfang der Datei sitzt. Masahiro Sakurai beschreibt in [Strong Attack, Light Reverb](https://www.youtube.com/watch?v=-nWjT49-cds) zwei Regeln für starke Treffer: Sie bekommen einen kurzen Hall mit der Spitze am Anfang (0:56), und ihr Hauptton endet im Hitstop (2:13). Die Testszene hält bei einem Treffer 4 Frames an, das sind 67 ms. Wie lang dein Hauptton ist, entscheidest du; die Rechnung sagt dir, wie er zum Stillstand passt.

  Die Länge zählt auch nach hinten. In der Testszene kann der Spieler mit Treffer alle 29 Frames angreifen. Ein Klang, der länger ist, liegt beim nächsten Angriff noch in der Luft. Das Modell rechnet Hüllkurve und Abstand in Frames; die Zeiten sind Platzhalter:

  ```python run
  import math

  FPS = 60
  RATE = 48000


  def frames(ms):
      return ms * FPS / 1000


  # Platzhalter-Klang, Zeiten in ms
  stille, attack = 40, 2
  koerper, fahne = 120, 1200
  gesamt = stille + attack
  gesamt += koerper + fahne

  t = frames(stille + attack)
  print("Transiente nach",
        f"{t:.1f} Frames")
  smp = stille * RATE // 1000
  print(f"Stille: {smp} Samples")
  lang = frames(gesamt)
  print(f"Länge: {lang:.1f} Frames")

  # Frames zwischen zwei Treffern
  ABSTAND = 29
  n = math.ceil(lang / ABSTAND)
  print("gleichzeitig:", n)
  ```

  Bis zu drei Kopien desselben Klangs klingen gleichzeitig, jede mit ihrer Fahne. Das verwischt den nächsten Treffer. Spielt der Player mit `max_polyphony` 1, dem Standard, schneidet jedes neue `play()` den laufenden Ton ab ([Audio zuordnen](/godot/audio)); dann hörst du statt der Überlagerung einen Abbruch. Beides ist eine Folge der Länge, nicht der Engine. Der **Release**, das Ausklingen nach dem Körper, ist im Spiel deshalb eine Frage der Wiederholrate: Wie oft kommt das Ereignis, und was soll dazwischen zu hören sein?

  ## Frequenz: Gewicht, Identität, Detail

  Dieses Modul ist kein EQ-Kurs. Für kurze Spielgeräusche hilft ein grobes Arbeitsmodell mit drei Rollen: Unten sitzt das **Gewicht**, also wie schwer etwas wirkt. In der Mitte sitzt die **Identität**, also woran man erkennt, was es ist. Oben sitzt das **Detail**, das den Klang nah und scharf macht. Wo genau die Grenzen liegen, hängt am Klang; das Modell sagt dir nur, welche Frage du beim Hören stellst.

  Akash Thakkar und Rich Vreeland bauten für Hyper Light Drifter einen Schuss der Diamond Shotgun aus 9 Schichten, manche Sounds aus bis zu etwa 20 ([GDC 2017](https://www.youtube.com/watch?v=k1b9xKRC74E), ab etwa 30:16). Die Schichten verteilen sie auf hohe, mittlere und tiefe Frequenzen, die Wucht kommt aus dem Bass (Fragerunde, 55:46 und 57:01). Das ist das Modell oben, als Arbeitsweise: Jede Schicht übernimmt eine Rolle, statt dass alle denselben Bereich füllen. Wie du Schichten baust, zeigt [Layering und Varianten](/sound/layering-varianten).

  Wo ein Klang gehört wird, ändert die Rechnung. Koukoi Games schreibt in einem Blogbeitrag über sein Handyspiel Crashing Season: „The bass sounds simply cannot be properly replayed through basic mobile device speakers, often resulting in a tinny, treble-heavy sound“ ([Game Developer](https://www.gamedeveloper.com/audio/making-good-sounding-audio-for-mobile-games)). Sein Ausweg ist Sättigung, die Obertöne des Basses hörbar macht. Ein Klang, der sein Gewicht nur ganz unten trägt, verliert es auf kleinen Lautsprechern. Ob dein Spiel dort läuft, entscheidest du; prüfen kannst du es mit dem Lautsprecher deines Handys.

  Wenn viele Klänge gleichzeitig spielen, verdecken sie sich gegenseitig in denselben Bändern. Diese **Maskierung** behandelt [Mischung: Musik, Geräusche und Stille](/sound/mischung-stille).

  > [!PRAXIS] Schichten nach Rollen, nicht nach Menge
  > Die 9 Schichten der Diamond Shotgun sind kein Ziel, sondern ein Beispiel dafür, wie ein Studio einen Klang aus Teilen mit klaren Aufgaben baut. Thakkar und Vreeland nennen die Verteilung auf hoch, mittel und tief und den Bass als Quelle der Wucht. Schreib deshalb in die Cue-Liste, welche Schichten ein Klang hat und welche Rolle jede spielt (siehe [Vom Ereignis zur Cue-Liste](/sound/klangplan)).

  ## Dynamik: gleich laute Varianten, geformte Transienten

  In einem Stück formst du Dynamik über die Zeit: Strophe, Refrain, Break. Im Spiel bestimmt der Spieler, wann was kommt, und eine Zufallsauswahl, welche Variante spielt. Jede Variante steht für sich. Ist eine davon deutlich lauter, wirkt ein zufälliger Treffer wichtiger als die anderen. Sakurai ordnet die Lautstärke in [Strike a Balance with Sound Effects](https://www.youtube.com/watch?v=qKjD5qbLUeI) nach Wichtigkeit: KO zuerst, dann Treffer und Spezialangriffe, Schritte zuletzt (1:01 bis 3:14). Lautstärke trägt im Spiel Information; Varianten desselben Ereignisses sollen deshalb dieselbe tragen.

  Ein Kompressor gleicht die Spitzen an. Schwelle, Ratio und Attack kennst du aus der Musik; im Spiel zählt, wie nah die Spitzen der Varianten danach beieinanderliegen. Als statische Kennlinie, ohne Attack und Release:

  ```python run
  def komp(pegel, schwelle, ratio):
      if pegel <= schwelle:
          return pegel
      ueber = pegel - schwelle
      ueber /= ratio
      return schwelle + ueber


  # Spitzen in dBFS, Platzhalter
  for v in [-3.0, -6.0, -9.0]:
      aus = komp(v, -12.0, 4.0)
      print(v, "->", round(aus, 2))
  ```

  Aus 6 dB Unterschied werden 1,5 dB. Das gilt nur oberhalb der Schwelle; was darunter liegt, bleibt, wie es ist. Spitzen sind außerdem nicht Lautheit. Ob Varianten gleich laut wirken, hörst du und misst es mit einem Lautheitsmesser, wie in [Lautheit, Export, Import und Hörtest](/sound/export-im-spiel).

  Die Attack-Zeit des Kompressors formt die Transiente. Das ist nicht die Attack in der Hüllkurve des Klangs: Eine weiche Hüllkurven-Attack schiebt die Spitze nach hinten, eine langsame Kompressor-Attack lässt sie durch. Die Godot-Doku nennt die Folge für Spielgeräusche: Ein Kompressor „can accentuate transients by using a slower attack, which lets louder parts go through before they are compressed. This can emphasize the "punchiness" of sound effects“ ([Compressor](https://docs.godotengine.org/en/stable/tutorials/audio/audio_effects.html#compressor)). Eine schnelle Kompressor-Attack oder ein Limiter drückt die Transiente dagegen flach, und mit ihr den hörbaren Moment des Treffers.

  ## Raum: trocken liefern oder Hall einbacken

  Hall in der Datei ist endgültig. Hall im Spiel lässt sich mit dem Ort ändern. Die Godot-Doku rät bei den Import-Empfehlungen zum zweiten Weg: Das Bus-System „saves SFX artists the need to add reverb to the sound effects, reducing their size greatly and ensuring correct trimming“ ([Best practices](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#best-practices)). Kürzer heißt hier auch: weniger Fahne, die ins nächste Ereignis ragt.

  | | trocken + Bus | eingebacken |
  | --- | --- | --- |
  | Ort | wechselt mit dem Bereich | fest |
  | Datei | kurz | länger |
  | Ende | sauber beschnitten, Fahne vom Bus | Fahne muss in der Datei auslaufen |
  | Entscheidung | im Spiel | in REAPER |

  Eingebacken hat seinen Platz, wenn der Raum zum Klang gehört statt zum Ort. Sakurais kurzer Hall auf starken Angriffen ist so ein Fall: Er hängt am Angriff, nicht am Ort. Welchen Weg ein Klang nimmt, entscheidest du pro Cue.

  In Godot 2D lenkt ein `Area2D` Klänge auf einen eigenen Bus, wenn `audio_bus_override` an ist; `audio_bus_name` nennt den Bus ([Area2D](https://docs.godotengine.org/en/stable/classes/class_area2d.html#class-area2d-property-audio-bus-override)). Den Bus legst du im Audio-Panel an und gibst ihm dort mit *Effekt hinzufügen* ein `AudioEffectReverb` ([Audio zuordnen](/godot/audio) zeigt das Panel). Welche Bereiche einen Player erreichen, bestimmt sein `area_mask`: laut Klassenreferenz die Area2D-Ebenen, die „affect the sound for reverb and audio bus effects“ ([area_mask](https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer2d.html#class-audiostreamplayer2d-property-area-mask)). Der Standard ist in Godot 4.7.2 `0`, gemessen und so in der Klassenreferenz. Gemessen mit einem 1-kHz-Ton, `Area2D` auf Ebene 1, Bus `Hall` zur Erkennung auf −20 dB:

  ```text
  area_mask 0 (Standard)
    Pegel Master   0.2500
    Bus Hall       stumm
  area_mask 1
    Pegel Master   0.0250
    Ton läuft über Hall
  ```

  Mit dem Standard wirkt kein Hall-Bereich, ohne Meldung. Die drei Einstellungen gehen im Inspektor oder im Code. Der Code, mit dem Bus `Hall` als Platzhalter, in 4.7.2 geprüft:

  ```gdscript
  func _ready() -> void:
  	var area: Area2D = $HallArea
  	area.audio_bus_override = true
  	area.audio_bus_name = &"Hall"
  	$Treffer.area_mask = 1
  ```

  ## Mono, Stereo und die Draufsicht

  Ein Klang mit Ort im Spiel kommt aus einem `AudioStreamPlayer2D`. Die Godot-Doku schreibt: „Many sound effects can generally be converted to mono as opposed to stereo“, und bietet dafür beim WAV-Import „Force > Mono“ an, das beide Kanäle zusammenmischt ([Best practices](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#best-practices)). Was passiert, wenn du es nicht tust, zeigt eine Messung mit Godot 4.7.2: ein 1-kHz-Ton als Mono-Datei und als Stereo-Datei mit Signal nur im linken Kanal, Bild 320 × 180, Hörer in der Bildmitte, Spitzenpegel links und rechts:

  | Datei, Position | links | rechts |
  | --- | --- | --- |
  | Mono, Mitte | 0.2500 | 0.2500 |
  | Mono, 150 px rechts | 0.1156 | 0.3469 |
  | Mono, 150 px oben | 0.2312 | 0.2312 |
  | Stereo nur L, Mitte | 0.2500 | 0 |
  | Stereo nur L, 150 px rechts | 0.1156 | 0 |

  Godot faltet die Stereo-Datei nicht zu Mono. Es gewichtet jeden Kanal mit dem Faktor seiner Seite: links bei 150 px rechts mit demselben Faktor wie bei der Mono-Datei, rechts ebenso. Was nur links aufgenommen ist, bleibt links, auch wenn die Quelle rechts steht. So kam der Trefferklang aus dem Einstieg von links. Mono-Dateien dagegen verteilen sich nach der Position. Der Ausweg ist Mono für alles mit Ort: beim Export aus REAPER oder mit „Force > Mono“. Stereo bleibt für Bett und Musik, die über einen `AudioStreamPlayer` ohne Ort laufen. Die Messung zeigt noch etwas: Derselbe Mono-Ton erreicht im `AudioStreamPlayer` 0.5 je Kanal, im `AudioStreamPlayer2D` in der Bildmitte 0.25, also 6 dB weniger.

  Für die **Draufsicht** zeigt die Tabelle eine zweite Folge. Eine Quelle 150 px über der Bildmitte ist auf beiden Seiten gleich laut, nur um den Abstand leiser. Godot unterscheidet oben und unten nicht über die Seite, sondern nur über die Lautstärke. Bewegt sich deine Figur in alle Richtungen, kommen Gegner auch von oben und unten; dort hörst du, wie weit sie weg sind, aber nicht, ob oben oder unten. Was du damit machst, entscheidest du. Reichweite und Panning-Stärke stehen in [Audio zuordnen](/godot/audio).

  > [!WARNING] Hall-Bereich ohne Wirkung
  > `area_mask` steht in Godot 4.7.2 standardmäßig auf `0`. Dann erreicht kein `Area2D` den Player, und dein Hall-Bus bleibt stumm. Setz die Ebene deines Bereichs im Player, im Inspektor oder im Code.

  > [!INTERVIEW]
  > „Unser Trefferklang wird im richtigen Frame ausgelöst und wirkt trotzdem spät. Woran kann es liegen?“ Gute Antwort, etwa als Technical Sound Designer: Erst die Datei. Ich messe, wie viel Stille vor der Transiente liegt, und rechne sie in Frames um; 40 ms sind bei 60 FPS mehr als zwei Frames. Dann die Hüllkurve: Eine weiche Attack in der Hüllkurve des Klangs oder ein Kompressor mit schneller Attack nimmt der Transiente die Spitze. Dann die Länge: Eine lange Fahne verwischt den nächsten Treffer oder wird von `max_polyphony` abgeschnitten. Erst danach prüfe ich im Log, ob der Auslöse-Frame stimmt.

  ## Häufige Fehler

  - **Stille vor der Transiente.** Jede Millisekunde ist Verzögerung; 800 Samples sind ein Frame bei 48 kHz und 60 FPS.
  - **Fahne länger als die Wiederholrate.** Kopien überlagern sich oder werden abgeschnitten. Länge gegen den kürzesten Abstand rechnen.
  - **Gewicht nur ganz unten.** Auf kleinen Lautsprechern verschwindet es.
  - **Varianten ungleich laut.** Eine zufällige Variante wirkt wichtiger als die anderen. Angleichen, dann hören.
  - **Schnelle Kompressor-Attack auf dem Treffer.** Der Kompressor drückt den Moment flach, an dem der Treffer hörbar wird.
  - **Hall in jede Datei gebacken.** Der Raum wandert nicht mit dem Ort, und die Datei wird lang.
  - **Stereo-Datei mit Ort.** Godot 4.7.2 faltet sie nicht zu Mono; einseitiger Inhalt bleibt auf seiner Seite.
  - **`area_mask` vergessen.** Der Standard 0 lässt jeden Hall-Bereich wirkungslos.

  ## Zusammenfassung

  - Der hörbare Moment ist die Transiente. Stille davor ist Verzögerung: 40 ms sind 2,4 Frames bei 60 FPS.
  - Länge gegen Aktion und Wiederholrate rechnen. Was länger ist als der Abstand zweier Auslösungen, überlagert sich oder wird abgeschnitten.
  - Unten Gewicht, Mitte Identität, oben Detail. Hyper Light Drifter verteilt Schichten nach Bändern; auf Handy-Lautsprechern fehlt der tiefe Bass.
  - Varianten tragen dieselbe Information und sollen gleich laut wirken. Ein Kompressor gleicht Spitzen oberhalb der Schwelle an, seine langsame Attack betont die Transiente.
  - Trocken liefern und im Spiel verhallen spart Länge und folgt dem Ort; eingebacken passt, wenn der Raum zum Klang gehört.
  - In Godot 2D lenkt ein `Area2D` mit `audio_bus_override` auf einen Hall-Bus, aber nur, wenn `area_mask` des Players die Ebene enthält; der Standard ist 0.
  - Klänge mit Ort mono: Godot 4.7.2 gewichtet Stereo-Kanäle nur, statt sie zu mischen. Stereo bleibt für Bett und Musik.
  - In der Draufsicht hört man links und rechts als Seite, oben und unten nur als Abstand.
exercises:
  - id: wann-passiert-es
    type: choice
    title: Wann ist der Treffer zu hören?
    prompt: |
      Welche Aussagen über Hüllkurve und Timing eines kurzen Spielgeräuschs stimmen? Mehrere Antworten richtig.
    options:
      - text: 40 ms Stille vor der Transiente verschieben den hörbaren Treffer bei 60 FPS um mehr als zwei Frames.
        correct: true
        why: 40 ms sind 2,4 Frames. Der Ton startet im richtigen Frame, hörbar wird er später.
      - text: Stille am Dateianfang ist egal, weil Godot den Ton im richtigen Frame startet.
        correct: false
        why: Godot startet die Datei im richtigen Frame, aber die Datei beginnt mit Stille. Hörbar ist erst die Transiente.
      - text: Ist die Hallfahne länger als der Abstand zwischen zwei Auslösungen, überlagern sich die Kopien oder die laufende wird abgeschnitten.
        correct: true
        why: Mit mehreren Stimmen klingen Fahnen übereinander, mit `max_polyphony` 1 schneidet jedes neue `play()` die laufende ab.
      - text: Eine weichere Attack in der Hüllkurve des Klangs macht den Treffer früher hörbar.
        correct: false
        why: Eine weichere Hüllkurven-Attack verschiebt die Spitze nach hinten und nimmt ihr die Schärfe. Der Treffer wird später und weicher.
      - text: Sakurai lässt den Hauptton eines starken Treffers im Hitstop enden.
        correct: true
        why: So steht es in „Strong Attack, Light Reverb“ ab 2:13.
    explanation: |
      Zwischen Auslösen und Hören liegt alles, was in der Datei vor der Transiente steht, und alles, was eine weiche Attack der Hüllkurve verzögert. Nach hinten zählt die Länge gegen die Wiederholrate. Sakurais Regel bindet die Länge des Haupttons an den Hitstop; wie lang deiner ist, entscheidest du, aber in Frames rechnen musst du ihn.
    resources:
      - title: Masahiro Sakurai · Strong Attack, Light Reverb
        url: https://www.youtube.com/watch?v=-nWjT49-cds
      - title: Godot Docs · Edit > Trim
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#edit-trim

  - id: signalweg-godot
    type: order
    title: Der Weg eines Klangs mit Ort
    prompt: |
      Bring die Stationen in die Reihenfolge, die ein Trefferklang mit Hall-Bereich in Godot 4.7.2 durchläuft.
    lang: prose
    lines: |
      Die WAV-Datei wird importiert und mit „Force > Mono“ zu einem Kanal gemischt
      Ein AudioStreamPlayer2D spielt sie an seiner Position, Abstand und Seite bestimmen die Kanalgewichte
      Ein Area2D, dessen Ebene in area_mask steht, lenkt den Klang auf den Bus Hall
      Auf dem Bus Hall verhallt ein AudioEffectReverb den Klang
      Der Bus Hall sendet an Master, Master geht an die Lautsprecher
    explanation: |
      Der Import entscheidet über die Kanäle, bevor irgendetwas spielt. Der Player gewichtet die Kanäle nach Position und gibt den Klang an einen Bus; welchen, entscheidet das Area2D, aber nur, wenn `area_mask` seine Ebene enthält. Effekte sitzen auf dem Bus, und jeder Bus endet in Master. Fehlt ein Klang oder klingt er trocken, gehst du denselben Weg ab.
    resources:
      - title: Godot Docs · Area2D.audio_bus_override
        url: https://docs.godotengine.org/en/stable/classes/class_area2d.html#class-area2d-property-audio-bus-override

  - id: stille-in-frames
    type: output
    title: Wie spät ist der Treffer?
    prompt: |
      In deiner Datei liegen 2400 Samples Stille vor der Transiente, die Datei hat 48 kHz, das Spiel läuft mit 60 FPS. Was gibt das Programm aus?
    lang: python
    code: |
      RATE = 48000
      FPS = 60
      stille_samples = 2400
      ms = stille_samples * 1000 / RATE
      print(ms, "ms")
      frames = round(ms * FPS / 1000, 1)
      print(frames, "Frames")
    expected: |
      50.0 ms
      3.0 Frames
    hints:
      - 800 Samples sind bei 48 kHz und 60 FPS ein Frame.
    explanation: |
      2400 Samples durch 48 000 sind 0,05 s, also 50 ms. Bei 16,7 ms pro Frame sind das genau 3 Frames. Bei einem Hitstop von 4 Frames landet die Transiente damit fast am Ende des Stillstands statt an seinem Anfang. Schneid die Stille beim Export oder mit Edit > Trim beim Import.
    resources:
      - title: Godot Docs · Edit > Trim
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#edit-trim

  - id: kopien-gleichzeitig
    type: output
    title: Wie viele Fahnen gleichzeitig?
    prompt: |
      Ein Klang ist mit Fahne 900 ms lang. Er wird alle 60, alle 29 oder alle 12 Frames ausgelöst. Wie viele Kopien klingen höchstens gleichzeitig, wenn der Player genug Stimmen hat? Was gibt das Programm aus?
    lang: python
    code: |
      import math

      FPS = 60
      fahne_ms = 900
      lang = fahne_ms * FPS // 1000
      for abstand in [60, 29, 12]:
          n = math.ceil(lang / abstand)
          print(abstand, n)
    expected: |
      60 1
      29 2
      12 5
    hints:
      - 900 ms sind 54 Frames.
    explanation: |
      54 Frames passen in 60 einmal, in 29 knapp zweimal und in 12 viereinhalbmal; aufgerundet klingen also bis zu 1, 2 und 5 Kopien übereinander. Bei schnellen Ereignissen wie Schritten oder Schüssen wird aus einer schönen Fahne ein Teppich. Mit `max_polyphony` 1 wäre es stattdessen ein Abbruch alle 12 Frames. Die Länge eines Klangs plant man gegen den kürzesten Abstand, mit dem er kommen kann.
    resources:
      - title: Godot Docs · AudioStreamPlayer2D · max_polyphony
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer2d.html#class-audiostreamplayer2d-property-max-polyphony

  - id: kompressor-varianten
    type: output
    title: Drei Varianten durch den Kompressor
    prompt: |
      Drei Varianten haben Spitzen bei −4, −10 und −16 dBFS. Schwelle −18 dB, Ratio 3:1, statische Kennlinie ohne Attack und Release. Was gibt das Programm aus?
    lang: python
    code: |
      def komp(pegel, schwelle, ratio):
          if pegel <= schwelle:
              return pegel
          ueber = pegel - schwelle
          ueber /= ratio
          return schwelle + ueber


      def spanne(werte):
          return max(werte) - min(werte)


      varianten = [-4.0, -10.0, -16.0]
      aus = []
      for v in varianten:
          a = komp(v, -18.0, 3.0)
          aus.append(round(a, 1))
      print(aus)
      print(spanne(varianten), "->",
            round(spanne(aus), 1))
    expected: |
      [-13.3, -15.3, -17.3]
      12.0 -> 4.0
    hints:
      - Alle drei liegen über −18 dB. Der Überschuss wird durch 3 geteilt.
    explanation: |
      Die Überschüsse über der Schwelle sind 14, 8 und 2 dB, geteilt durch 3 also 4,7, 2,7 und 0,7 dB. Aus 12 dB Abstand zwischen der lautesten und der leisesten Spitze werden 4 dB. Das ist die Kennlinie; ein echter Kompressor mit Attack lässt die ersten Millisekunden durch, die Spitzen liegen dann höher. Ob die Varianten danach gleich laut wirken, entscheidet dein Ohr und ein Lautheitsmesser.
    resources:
      - title: REAPER Effects Guide · ReaComp, Ratio (PDF, S. 9)
        url: https://www.reaper.fm/userguide/REAPEREffectsGuide2021.pdf#page=9

  - id: stereo-vorhersage
    type: output
    title: Die Stereo-Datei auf der anderen Seite
    prompt: |
      Gemessene Spitzenpegel aus der Lektion, Godot 4.7.2, Bild 320 × 180. „li“ und „re“ heißen links und rechts der Bildmitte. Sag den fehlenden Wert voraus: Die Stereo-Datei mit Signal nur links steht 150 px links der Bildmitte. Antworte mit zwei Zahlen, erst links, dann rechts, etwa `0.25 0`.
    lang: text
    code: |
      Datei, Position  links   rechts
      Mono Mitte       0.2500  0.2500
      Mono 150 px li   0.3469  0.1156
      Stereo L Mitte   0.2500  0
      Stereo L 150 re  0.1156  0
      Stereo L 150 li  ?       ?
    expected: |
      0.3469 0
    accept:
      - 0.3469 0.0
      - 0.3469 0.000
      - 0.3469 0.0000
      - 0.3469, 0
      - 0.3469, 0.0
      - 0,3469 0
      - 0,3469 0,0
      - 0,3469 0,0000
    hints:
      - Godot gewichtet jeden Kanal der Datei mit dem Faktor seiner Seite, wie bei der Mono-Datei.
    explanation: |
      Der linke Kanal bekommt bei 150 px links denselben Faktor wie der linke Kanal der Mono-Datei, also 0.3469. Der rechte Kanal der Datei ist leer, und ein leerer Kanal bleibt leer, egal mit welchem Faktor. Gemessen: 0.3469 und 0. Steht die Quelle links, passt das zufällig; steht sie rechts, kommt der Klang trotzdem von links. Deshalb gehören Klänge mit Ort als Mono ins Spiel.

  - id: rollen-baender
    type: gap
    title: Drei Rollen, drei Bereiche
    prompt: |
      Ergänze das Arbeitsmodell aus der Lektion.
    lang: prose
    code: |
      Unten trägt ein kurzer Klang sein ⟦Gewicht⟧, in der Mitte seine ⟦Identität⟧, oben das ⟦Detail⟧. Auf kleinen Handy-Lautsprechern fehlt laut Koukoi Games vor allem der ⟦Bass⟧.
    gaps:
      - label: unten
        hint: Wie schwer etwas wirkt.
        accept: ["Wucht"]
      - label: Mitte
        hint: Woran man erkennt, was es ist.
        accept: ["Erkennbarkeit", "Charakter"]
      - label: oben
        hint: Was den Klang nah und scharf macht.
        accept: ["Details"]
      - label: was fehlt
        hint: Der Bereich, den Thakkar und Vreeland als Quelle der Wucht nennen.
        accept: ["tiefe Bass", "tiefen Bass", "Tiefbass", "Bassbereich", "Bässe", "Subbass", "Tiefen", "Tieftonbereich"]
    explanation: |
      Das Modell ersetzt keinen EQ, es sortiert Fragen: Wirkt es schwer genug, erkennt man es, ist es nah genug? Hyper Light Drifter verteilt Schichten auf diese Bereiche, und die Wucht kommt aus dem Bass. Der fehlt auf kleinen Lautsprechern. Wer dort spielt, braucht Gewicht, das auch weiter oben ankommt, etwa über Obertöne.
    resources:
      - title: Game Developer · Making good sounding audio for mobile games
        url: https://www.gamedeveloper.com/audio/making-good-sounding-audio-for-mobile-games

  - id: hall-bereich-code
    type: gap
    title: Einen Hall-Bereich einrichten
    prompt: |
      Ergänze den Code, der in Godot 4.7.2 einen Hall-Bereich einrichtet. Den Bus `Hall` mit seinem `AudioEffectReverb` hast du im Audio-Panel angelegt. Der Bereich `HallArea` soll Klänge auf diesen Bus lenken, und der Player `Treffer` soll von Ebene 1 erreicht werden.
    lang: gdscript
    code: |
      func _ready() -> void:
      	var area: ⟦Area2D⟧ = $HallArea
      	area.⟦audio_bus_override⟧ = true
      	area.audio_bus_name = &"Hall"
      	$Treffer.⟦area_mask⟧ = 1
    gaps:
      - label: Typ des Bereichs
        hint: Die Klasse für 2D-Bereiche, die Klänge umlenken können.
      - label: Umlenken an
        hint: Die Eigenschaft heißt in der Klassenreferenz von Area2D „override“.
      - label: Ebenen des Players
        hint: Steht in 4.7.2 standardmäßig auf 0.
    explanation: |
      `var area: Area2D` holt den Bereich in eine Variable vom Typ `Area2D`, damit die folgenden Zeilen kurz bleiben. `audio_bus_override` schaltet das Umlenken des Bereichs an, `audio_bus_name` nennt den Ziel-Bus. Ohne `area_mask = 1` hört der Player den Bereich auf Ebene 1 nicht; der Standard 0 lässt den Hall-Bus stumm. So gemessen mit Godot 4.7.2: mit 0 blieb der Bus stumm, mit 1 lief der Ton darüber.
    resources:
      - title: Godot Docs · AudioStreamPlayer2D · area_mask
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer2d.html#class-audiostreamplayer2d-property-area-mask
      - title: Godot Docs · Area2D.audio_bus_override
        url: https://docs.godotengine.org/en/stable/classes/class_area2d.html#class-area2d-property-audio-bus-override

  - id: datenblatt-seite
    type: bug
    title: Der Treffer kommt von der falschen Seite
    prompt: |
      Das Datenblatt deines Trefferklangs. Im Spiel steht der Dummy rechts von der Figur, der Treffer klingt aber von links, und das bei jedem Treffer. Finde die Zeile, die das erklärt.
    lang: text
    code: |
      treffer_holz_01.wav
      Stille vorn:  0 ms
      Transiente:   Sample 0
      Kanäle:       stereo, Quelle links
      Hall:         trocken, Bus Hall
      Player:       AudioStreamPlayer2D
    lines: [4]
    explanation: |
      Godot 4.7.2 faltet eine Stereo-Datei im `AudioStreamPlayer2D` nicht zu Mono, sondern gewichtet beide Kanäle nach der Position. Liegt der Inhalt fast nur links, bleibt er links, egal wo die Quelle steht. Gemessen: Stereo nur links, Quelle 150 px rechts, ergab 0.1156 links und 0 rechts. Exportier den Klang mono oder nutz „Force > Mono“ beim Import. Die übrigen Zeilen sind sauber: keine Stille vorn, trocken auf den Hall-Bus.
    resources:
      - title: Godot Docs · Force > Mono
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#force-mono

  - id: hall-bus-stumm
    type: bug
    title: Der Hall-Bus schlägt nie aus
    prompt: |
      Im Hall-Bereich klingt der Treffer so trocken wie draußen. Die Pegelanzeige des Busses `Hall` bewegt sich nie, der Bus existiert und hat sein Reverb. Finde die Zeile und korrigiere sie.
    lang: gdscript
    code: |
      func _ready() -> void:
      	var area: Area2D = $HallArea
      	area.audio_bus_override = true
      	area.audio_bus_name = &"Hall"
      	$Treffer.area_mask = 0
    lines: [5]
    fix:
      - line: 5
        answers:
          - $Treffer.area_mask = 1
          - $Treffer.area_mask |= 1
          - $Treffer.set_area_mask(1)
    explanation: |
      Mit `area_mask = 0` erreicht kein Bereich den Player, also bleibt er auf seinem eigenen Bus. Das ist in Godot 4.7.2 auch der Standard, die Zeile wiederholt ihn nur. Gemessen: mit 0 blieb der Bus `Hall` bei −200 dB, also stumm, mit 1 lief der Ton darüber. Die Ebene im Player muss zur `collision_layer` des Bereichs passen, hier Ebene 1.
    resources:
      - title: Godot Docs · AudioStreamPlayer2D · area_mask
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer2d.html#class-audiostreamplayer2d-property-area-mask

  - id: messung-erklaeren
    type: explain
    title: Was die Stereo-Messung zeigt
    prompt: |
      Erkläre an dieser Messung aus Godot 4.7.2 („re“ heißt rechts der Bildmitte), was mit Stereo-Dateien in einem `AudioStreamPlayer2D` passiert und was daraus für Klänge mit Ort und für die Draufsicht folgt.
    lang: text
    code: |
      Datei, Position  links   rechts
      Mono Mitte       0.2500  0.2500
      Mono 150 px re   0.1156  0.3469
      Mono 150 px oben 0.2312  0.2312
      Stereo L Mitte   0.2500  0
      Stereo L 150 re  0.1156  0
    points:
      - Godot mischt die Stereo-Datei nicht zu Mono, sondern gewichtet jeden Kanal mit dem Faktor seiner Seite.
      - Inhalt, der nur in einem Kanal liegt, bleibt auf dieser Seite, auch wenn die Quelle auf der anderen steht.
      - Eine Mono-Datei verteilt sich nach der Position, hier 1 zu 3 bei 150 px rechts.
      - Oben und unten ändern nur die Lautstärke über den Abstand, nicht die Seite.
      - Klänge mit Ort gehören als Mono ins Spiel; Stereo bleibt für Bett und Musik ohne Ort.
    explanation: |
      Die Mono-Zeilen zeigen das Panning: 150 px rechts verteilen den Ton etwa 1 zu 3 auf links und rechts, 150 px oben lassen ihn mittig und machen ihn nur um den Abstand leiser. Die Stereo-Zeilen zeigen, dass Godot nicht zusammenmischt. Der linke Kanal bekommt bei 150 px rechts denselben kleinen Faktor wie bei Mono, der rechte Kanal ist leer und bleibt leer. Ein einseitig aufgenommener Klang klingt also immer von seiner Seite. Darum exportiert man Klänge mit Ort mono. In der Draufsicht heißt die dritte Zeile: Ein Gegner oberhalb der Figur klingt mittig, nur ferner.
    resources:
      - title: Godot Docs · AudioStreamPlayer2D
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer2d.html

  - id: lautsprecher-vergleich
    type: practice
    title: Handy-Lautsprecher gegen Kopfhörer
    prompt: |
      Spiel einen eigenen kurzen Klang oder deinen Prüfklatscher aus [Feldaufnahme mit dem Handy](/sound/feldaufnahme) einmal über den Lautsprecher deines Handys und einmal über Kopfhörer ab, in gleicher Lautstärke, so gut es geht. Notier in wenigen Sätzen, was sich unten, in der Mitte und oben ändert.
    lang: prose
    hints:
      - "Frag dich bei jeder Rolle: Wirkt es noch schwer? Erkenne ich es noch? Ist es noch nah?"
    checklist:
      - Du hast notiert, welchen Klang du verwendet hast und über welche zwei Wege du ihn gehört hast.
      - Zu jeder der drei Rollen steht ein Satz, was über den Handy-Lautsprecher anders ist.
      - Du hast notiert, ob die Transiente auf beiden Wegen zur selben Zeit kommt oder sich anders anfühlt.
      - Du hast eine offene Frage für die Arbeit am PC notiert, ohne sie hier zu entscheiden.
    explanation: |
      Der Vergleich zeigt dir an deinem eigenen Material, was die Quelle zu Handy-Lautsprechern beschreibt. Was dort fehlt, ist meist das Gewicht ganz unten; was bleibt, sind Mitte und Höhen. Ob dein Spiel auf solchen Lautsprechern laufen soll und was du dann änderst, entscheidest du später in REAPER. Die Notiz ist dafür die Grundlage.
    resources:
      - title: Game Developer · Making good sounding audio for mobile games
        url: https://www.gamedeveloper.com/audio/making-good-sounding-audio-for-mobile-games

  - id: datenblatt-eigene-aktion
    type: practice
    title: Ein Datenblatt für eine eigene Aktion
    prompt: |
      Wähl eine Aktion aus deinem Spiel oder aus der Testszene, die einen Klang bekommen soll. Schreib ein kurzes Datenblatt: Aktionsdauer und kürzester Abstand zweier Auslösungen in Frames, Frame der Transiente, Länge mit Fahne in Frames, wie viele Kopien sich überlagern können, mono oder stereo, Hall trocken oder eingebacken, jeweils mit einem Satz Begründung. Welche Aktion und welche Werte, entscheidest du; die Werte sind deine Platzhalter.
    lang: prose
    hints:
      - Länge in ms mal 60 durch 1000 ergibt Frames. Überlagerung ist Länge durch Abstand, aufgerundet.
      - Frame-Daten von Angriffen findest du im Log der [Testszene](/combat/testszene-angriff), Ton-Bilder in [Animation im Spiel](/animation/animation-im-spiel).
    checklist:
      - Aktionsdauer und kürzester Abstand stehen in Frames da.
      - Du hast notiert, in welchem Frame der Aktion die Transiente liegen soll, und warum gerade dort.
      - Die Länge mit Fahne steht in Frames, und die Zahl der möglichen Überlagerungen ist ausgerechnet.
      - Mono oder Stereo ist entschieden und mit dem Ort im Spiel begründet.
      - Hall trocken oder eingebacken ist entschieden und mit einem Satz begründet.
    explanation: |
      Das Datenblatt macht aus Hörgefühl prüfbare Angaben. Frame der Transiente, Länge und Abstand kannst du im Spiel gegen das Log halten; Mono und Hall-Weg prüfst du mit der Messung aus der Lektion. Die Entscheidungen bleiben deine, das Blatt macht sie nur sichtbar. Wie du den Klang baust und gegen die Aktion abstimmst, folgt in [Layering und Varianten](/sound/layering-varianten).
    resources:
      - title: Masahiro Sakurai · Strike a Balance with Sound Effects
        url: https://www.youtube.com/watch?v=qKjD5qbLUeI
