id: klangformung
title: "Klangformung: Hüllkurve, Frequenz, Dynamik und Raum für kurze Spielgeräusche"
level: 2
minutes: 110
summary: Wie Hüllkurve, Frequenzbänder, Dynamik und Raum bestimmen, wann ein kurzer Klang im Spiel passiert, wie schwer er wirkt und wo er sitzt – mit Rechnungen in Frames, Samples und Dezibel und dem gemessenen Verhalten von Godot 4.7.2 bei Stereo-Dateien und Hall-Bereichen.
place: unterwegs
goals:
  - Du bestimmst, wann ein Klang im Spiel hörbar „passiert“, und rechnest Stille vor der Transiente in Samples und Frames um.
  - Du vergleichst die Länge eines Klangs mit Aktionsdauer und Wiederholrate und erkennst eine Hallfahne, die ins nächste Ereignis ragt.
  - Du ordnest den Frequenzbändern eines kurzen Klangs Rollen zu und nennst mit Hyper Light Drifter und einer Quelle zu Handy-Lautsprechern, was das für Schichten und Bass heißt.
  - Du rechnest mit Schwelle und Ratio aus, wie ein Kompressor die Spitzen von Varianten angleicht, und erklärst, wie eine langsame Attack des Kompressors die Transiente betont.
  - Du entscheidest begründet zwischen trockenem Klang mit Hall im Spiel und eingebackenem Hall und richtest in Godot 4.7.2 einen Hall-Bereich mit `area_mask` ein.
  - Du begründest mit einer Messung in Godot 4.7.2, warum Klänge mit Ort mono sein sollten und was die Draufsicht für links, rechts, oben und unten heißt.
