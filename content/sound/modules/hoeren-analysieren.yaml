id: hoeren-analysieren
title: "Kritisch hören: was ein Klang im Spiel leistet"
level: 1
minutes: 90
summary: Wie du mit Kopfhörern am Handy hörst, welche Information ein Klang im Spiel trägt – Rückmeldung, Warnung, Ort außerhalb des Bilds, Orientierung, Stimmung, Kontinuität –, wie du ihn mit Begriffen von Jørgensen, Chion und Schafer einordnest und als Hörprotokoll festhältst.
place: unterwegs
goals:
  - Du ordnest einen Klang einer oder mehreren Aufgaben zu – Rückmeldung, Warnung, Information außerhalb des Bilds, Orientierung, Stimmung, Kontinuität – und nennst die wichtigste zuerst.
  - Du unterscheidest diegetische, extradiegetische und transdiegetische Klänge nach Kristine Jørgensen und begründest Grenzfälle mit ihrer Funktion.
  - Du hörst denselben Clip nacheinander kausal, semantisch und reduziert, wie Michel Chion die drei Hörweisen unterscheidet.
  - Du überträgst Schafers Grundton, Signal und Klangmarke auf eine Spielszene.
  - Du führst ein Hörprotokoll eines 30–60-Sekunden-Clips mit Zeit, Klang, Quelle, Aufgabe, Priorität und Stille und wertest es aus.
