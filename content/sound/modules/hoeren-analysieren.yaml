lesson: |
  Du sitzt im Bus, Kopfhörer auf, und spielst einen Clip von 40 Sekunden aus einem Action-Spiel in der Draufsicht ab. Beim ersten Durchgang schaust du hin. Beim zweiten schließt du die Augen und zählst, was du trotzdem weißt: dass rechts jemand läuft, dass gleich ein Angriff kommt, dass der Kampf vorbei ist. Diese zweite Liste ist das Thema dieses Moduls.

  Jeff Kaplan, Game Director von Overwatch, gab dem Audio-Team früh ein Ziel: Er wollte das Spiel nach Gehör spielen können. Scott Lawlor, Audio Director des Projekts, gibt es so wieder: „he wants so much information encoded in the sound that he could practically close his eyes or turn off the monitor and know what's going on at any given time“ ([Wwise Tour 2016, Teil 1](https://www.youtube.com/watch?v=fGDOgn2WXLs), ab etwa 24:30). Aus der Musik kennst du kritisches Hören: Frequenzen, Dynamik, Raum, Fehler im Mix. Im Spiel kommt eine Frage hinzu, die ein Stück nicht stellt: Was sagt dieser Klang dem Spieler, und was tut der Spieler deshalb?

  Dieses Modul gibt dir Begriffe und eine Methode dafür, das Hörprotokoll. Es bewertet keine Klänge. Ob dir etwas gefällt, notierst du getrennt. Im Protokoll steht, was ein Klang leistet. In deinem Spiel wirst du dieselben Fragen an deine eigenen Klänge stellen; welche das sind, entscheidest du.

  ## Sechs Aufgaben eines Klangs im Spiel

  Khris Brown nennt in einem GDC-Vortrag von 2017 als Zweck von Sounddesign „providing the information you need to know to interact optimally with the world“ ([Audio Choreography for Battle Design](https://www.youtube.com/watch?v=q6Vs3d6CrUc), ab etwa 1:42). Für die Analyse zerlegst du diese Information in sechs Aufgaben:

  | Aufgabe | Frage an den Klang |
  | --- | --- |
  | Rückmeldung | Hat meine Eingabe gewirkt? |
  | Warnung | Was passiert gleich? |
  | Außerhalb des Bilds | Was ist da, das ich nicht sehe? |
  | Orientierung | Wo bin ich, wohin geht es? |
  | Stimmung | Wie fühlt sich dieser Ort an? |
  | Kontinuität | Was verbindet zwei Momente? |

  **Rückmeldung** bestätigt eine Eingabe. Brown fordert „accurate immediate reinforcing feedback“ (ab etwa 10:40). Im Kampf heißt das: Der Ton gehört in den Frame, in dem der Treffer gemeldet wird, sonst klingt auch ein Schlag ins Leere wie ein Treffer ([Trefferfeedback](/combat/trefferfeedback)).

  **Warnung** kündigt an, was gleich passiert. In Overwatch ruft McCree (heute Cassidy) „It's high noon“, bevor seine stärkste Fähigkeit trifft. Laut Team galt: „as soon as you hear that line you had to react and hide“ ([Teil 4, Pinpoint Accuracy](https://www.youtube.com/watch?v=F2N8bbzhHd8), ab etwa 9:51).

  **Information außerhalb des Bilds** ist das, was nur der Ton liefert. Der Sound Supervisor von Overwatch klagte beim Spielen immer wieder, er sei sicher, dass jemand bei ihm sei, und finde ihn nicht. Die Aufnahme zeigte: Der Gegner lief ein Stockwerk höher (Teil 4, ab etwa 1:52). In einer Draufsicht ist der Bildrand diese Grenze. Was dahinter liegt, kann nur klingen.

  **Orientierung** sagt, wo du bist. Im Vortrag zu Hyper Light Drifter beschreiben Rich Vreeland und Akash Thakkar zwei Arten von Atmo: allgemeine wie Wind, den man überall hört, und Klänge an Fackeln und Lampen, die lauter und leiser werden, während man vorbeigeht ([GDC 2017](https://www.youtube.com/watch?v=k1b9xKRC74E), ab etwa 49:45). Die zweite Art macht Orte unterscheidbar. Im Level-Design-Kurs steht dazu der Satz „Auch Klang kann ein Hinweis sein“ ([Ausgestaltung](/level-design/ausgestaltung)). Hier hörst du, wie das klingt.

  **Stimmung** färbt, wie sich ein Ort anfühlt. Brown beschreibt für BioShock einzelne Klänge wie Knarren und Wasser und darunter „this bed of the actual pressure“, den Druck des Ozeans auf dem Bauwerk (ab etwa 3:28).

  **Kontinuität** verbindet, was das Bild trennt: zwei Räume, einen Kampf und die Ruhe danach. Hyper Light Drifter hatte dafür mehrere Fassungen desselben Stücks, „that kind of crossfade between each other“ (ab etwa 48:53).

  Ein Klang hat selten nur eine Aufgabe. Die Schritte eines Gegners hinter dir sind Warnung und Information außerhalb des Bilds zugleich. Notier im Protokoll die wichtigste zuerst.

  ## Quelle in der Spielwelt oder nicht: diegetisch, extradiegetisch, transdiegetisch

  Die Filmtheorie unterscheidet Klänge nach ihrer Quelle. **Diegetisch** ist, was in der erzählten Welt entsteht und was die Figuren hören könnten: Schritte, Stimmen, ein Schwert. **Extradiegetisch** (auch nicht diegetisch) ist, was keine Quelle in dieser Welt hat, etwa die Filmmusik. Kristine Jørgensen zeigt, warum diese Trennung im Spiel nicht reicht ([On Transdiegetic Sounds in Computer Games](https://hdl.handle.net/1956/5855), 2007). Ihr Beispiel: In Oblivion wechselt beim Ritt durch den Wald die Musik zu einer aggressiveren Melodie. Der Spieler weiß, dass ein Gegner kommt, und kann ausweichen oder kämpfen. Beim Hai-Thema in Jaws kann der Zuschauer nur zusehen. Jørgensen nennt Musik, die keine Quelle in der Spielwelt hat und trotzdem über Ereignisse darin informiert, **transdiegetisch**.

  Sie unterscheidet zwei Richtungen:

  - **Extern transdiegetisch**: keine Quelle in der Welt, aber Information für das Handeln darin. Ihr Beispiel ist die Musik in Hitman Contracts, die dramatisch wird, sobald die Figur in einen Kampf gerät.
  - **Intern transdiegetisch**: eine Quelle in der Welt, die sich an den Spieler wendet. In Warcraft III antwortet ein Arbeiter „More work?“, wenn der Spieler ihn auswählt. In World of Warcraft sagt die eigene Figur „Not enough mana!“, und nur ihr Spieler hört es.

  Daneben bleiben Klänge, die eindeutig sind: Die Hintergrundmusik von Warcraft III reagiert laut Jørgensen nicht auf das Spiel und wirkt nur als Stimmung, sie ist extradiegetisch. Für Jørgensen ist das Transdiegetische vor allem eine Funktion eines Klangs, kein dritter Raum zwischen den beiden anderen. Das ist für die Analyse der nützliche Teil. Zur Frage „Wo ist die Quelle?“ kommt eine zweite: „Wem sagt der Klang etwas, und kann der Spieler damit handeln?“ Einen breiten Überblick über Geschichte, Theorie und Praxis von Spielton gibt Karen Collins' Lehrbuch [Game Sound](https://doi.org/10.7551/mitpress/7909.001.0001) (MIT Press, 2008).

  Diegetisch heißt nicht realistisch. Ein Treffer-Ton kann stilisiert sein und trotzdem aus der Welt kommen. Umgekehrt kann eine Musik, die nur der Spieler hört, die wichtigste Warnung im Clip sein.

  ## Drei Arten zu hören: kausal, semantisch, reduziert

  Michel Chion unterscheidet in [Audio-Vision](https://cup.columbia.edu/book/audio-vision-sound-on-screen/9780231185899/) im Kapitel „The Three Listening Modes“ drei Arten, auf einen Klang zu hören. **Kausal** hörst du, wenn du nach der Ursache fragst: Wer oder was macht das? **Semantisch** hörst du, wenn du einen Code liest, etwa Sprache oder ein Signal mit vereinbarter Bedeutung. **Reduziert** hörst du, wenn du auf den Klang selbst achtest, unabhängig von Ursache und Bedeutung: Hüllkurve, Lage, Dichte, Raum.

  Im Spiel ist semantisches Hören oft gelernt. Das Overwatch-Team nennt das Ziel „Pavlovian response“: „when you hear a sound you can react as quickly as possible“ (Teil 1, ab etwa 25:46). Tomas Neumann erzählt, dass von der Ansage „Justice rains from above“ der Anfang genügt, und man weiß, was zu tun ist ([Teil 6, Pavlovian Response](https://www.youtube.com/watch?v=ojlqmkoLvHg), ab etwa 2:00). Ein Spieler, der das Spiel kennt, hört also anderes als du beim ersten Durchgang.

  Reduziert hörst du als Produzent ohnehin. Gerade deshalb kommt dieser Durchgang zuletzt. Wer zuerst auf Transienten und Hall achtet, notiert Klangeigenschaften und übersieht, was der Klang dem Spieler sagt. Für einen Clip heißt das drei Durchgänge:

  ```text
  Durchgang 1, kausal:
    Was erzeugt den Klang?
  Durchgang 2, semantisch:
    Was bedeutet er im Spiel?
  Durchgang 3, reduziert:
    Wie klingt er? Hüllkurve,
    Lage, Dichte, Raum
  ```

  Chion schreibt über Film. Seine Hörweisen sind ein Werkzeug, mit dem du dieselbe Stelle dreimal anders hörst, kein Gesetz über Spiele.

  ## Klanglandschaft: Grundton, Signal, Klangmarke

  Der Komponist R. Murray Schafer hat den Begriff Soundscape geprägt. Sein Verlag fasst die Aufgabe, die er seinen Lesern stellt, so zusammen: „Our task, he maintains, is to listen, analyze, and make distinctions“ ([The Soundscape](https://www.innertraditions.com/books/the-soundscape)). Das Handbook for Acoustic Ecology, herausgegeben von Barry Truax und ursprünglich vom World Soundscape Project der Simon Fraser University veröffentlicht, definiert die drei Begriffe, die du für Spiele brauchst:

  - **Grundton** (keynote): Klänge, die so beständig zu hören sind, dass sie einen Hintergrund bilden, „against which other sounds are perceived“. Oft nimmt man sie nicht bewusst wahr ([Keynote](https://www.sfu.ca/sonic-studio-webdav/cmns/Handbook/Keynote.html)).
  - **Signal** (sound signal): „any sound or message which is meant to be listened to“. Signale stehen immer im Verhältnis zu ihrem Grundton, wie Figur und Grund im Bild (Eintrag Sound Signal).
  - **Klangmarke** (soundmark): abgeleitet von landmark, ein Klang, der für einen Ort einzigartig ist oder dort besonders beachtet wird (Eintrag Soundmark).

  Auf eine Spielszene übertragen:

  | Begriff | Im Spiel | Frage |
  | --- | --- | --- |
  | Grundton | Bett der Atmo | Was hört man immer? |
  | Signal | Schritt, Warnung | Worauf reagiert man? |
  | Klangmarke | Klang eines Orts | Woran erkennt man ihn? |

  Atmo heißt in diesem Kurs ein Bett aus Grundton plus einzelne Spot-Klänge. Der Wind in Hyper Light Drifter ist Grundton, die Fackeln sind Spot-Klänge mit Ort. Ob ein Spot-Klang zur Klangmarke wird, hängt daran, ob er einen Ort unverwechselbar macht. Für Orientierung zählen die Klangmarken, nicht der Grundton.

  Das Handbuch kennt noch ein Begriffspaar, das dir im Modul zur Mischung wieder begegnet. In einer Hi-Fi-Umgebung sind alle Klänge klar zu hören, „without being crowded or masked“. In einer Lo-Fi-Umgebung sind die Signale „overcrowded, resulting in masking and lack of clarity“ (Einträge Hi-Fi und Lo-Fi). Schafer bewertet damit Umgebungen. Für die Analyse nimmst du die Begriffe als Beschreibung: Kann man in diesem Moment ein Signal noch heraushören?

  ## Priorität und Stille: was der Spieler nicht verpassen darf

  Nicht jeder Klang ist gleich wichtig. Das Overwatch-Team stellte für den Mix eine Frage: „what is your greatest threat“ ([Teil 3, A Clear Mix](https://www.youtube.com/watch?v=2M5cWHswQsM), ab etwa 3:23). Wer auf dich zielt, ist wichtiger als jemand, der näher steht, aber wegschaut. Die Genauigkeit der Richtung ging dabei vor Ästhetik. Ein breites Stereobild „may not sound cinematic“, heißt es im Vortrag, aber „it's better for the game to say this person's right there“ (Teil 4, ab etwa 11:27). Sakurai ordnet die Lautstärke in Smash nach Wichtigkeit: KO zuerst, Schritte zuletzt ([Trefferfeedback](/combat/trefferfeedback), Abschnitt Ton). Wie man solche Reihenfolgen baut, ist Stoff von [Mischung: Musik, Geräusche und Stille](/sound/mischung-stille).

  Für dein Protokoll reicht eine Ziffer: 1 heißt, der Spieler darf den Klang nicht verpassen, 2 hilft ihm, 3 ist Hintergrund. Du schätzt die Priorität. Ob das Spiel sie auch so setzt, hörst du daran, was in dichten Momenten noch durchkommt.

  Zur Priorität gehört ihr Gegenteil: Stellen, an denen es leise wird. In Overwatch dämpft das Spiel alles, wenn du dich in eine Nische zurückziehst. „Everything would just get quiet and muffled and you would hear clearly one person walk in the room“ (Teil 4, ab etwa 7:19). Die Stille dort ist eine Information: Hier bist du sicher, und was du jetzt noch hörst, zählt. Stille im Protokoll heißt deshalb selten digitale Null. Notier, was wegfällt und was bleibt.

  ## Das Hörprotokoll: 30 bis 60 Sekunden mit Kopfhörern

  Das Hörprotokoll hält fest, was du hörst, in Zeilen, die man vergleichen kann. Es passt aufs Handy, wenn du kurze Kürzel nimmst. So gehst du vor:

  1. Wähl einen Clip von 30 bis 60 Sekunden, am besten Spielszenen ohne Kommentar. Längere Clips werden ungenau.
  2. Stell die Lautstärke mit Kopfhörern einmal ein und lass sie, bis du fertig bist.
  3. Hör einmal ohne Notizen, mit Bild.
  4. Hör mit geschlossenen Augen und notier, was du ohne Bild weißt.
  5. Trag jeden Klang mit Zeit, Quelle, Aufgabe und Priorität ein, ein Klang pro Zeile. Hör dafür kausal, dann semantisch.
  6. Notier die Stellen, an denen es still wird, und was dort bleibt.
  7. Hör ein letztes Mal reduziert und ergänze Klangeigenschaften, wo sie dir auffallen.
  8. Werte aus: Welche Information kommt nur über den Ton?

  Ein Protokoll in dieser Form, für einen ausgedachten Clip:

  ```text
  Zeit  Klang          Q  Aufg. P
  0:03  Schritte Fig.  B  Rück  3
  0:05  Wind           -  Stim  3
  0:11  Schritte re.   A  Warn  1
  0:12  Musik dichter  -  Warn  1
  0:14  Hieb           B  Rück  2
  0:15  Treffer        B  Rück  1
  0:18  Stille 1 s     -  Kont  -
        bleibt: Wind
  ```

  Q ist die Quelle: B im Bild, A außerhalb des Bilds, - ohne Quelle in der Spielwelt. Aufg. ist die wichtigste Aufgabe als Kürzel: Rück, Warn, Auß, Ort, Stim und Kont stehen für die sechs Aufgaben aus der Tabelle oben. P ist die Priorität. Wo du unsicher bist, schreib ein Fragezeichen dazu. Ein Fragezeichen ist ein Befund, keine Lücke.

  Die Auswertung beantwortet drei Fragen. Welche Klänge mit Priorität 1 haben keine Quelle im Bild? Das ist die Information, die nur der Ton liefert, im Beispiel die Schritte rechts und die dichtere Musik. Wie viel Vorlauf gibt eine Warnung? Rechne ihn in Frames, wie im [Combat-Kurs](/combat/testszene-ausweichen), wo der Telegraph des Trainingsgegners in den Beispielläufen 20 Frames dauert. Und wo wird es still, und was kommt danach?

  > [!MERKE]
  > Notier, was ein Klang dem Spieler sagt, nicht, ob er dir gefällt. Geschmack bekommt eine eigene Zeile.

  > [!PRAXIS] Vom Clip zum Befund
  > Im Overwatch-Studio liefen Aufnahmen mit. Fühlte sich ein Tod unfair an, schickten Kollegen dem Audio-Team das Video. Das Team sah es sich an, baute die Situation nach und änderte die Werte, damit der Spieler eine Chance zum Reagieren hatte (Teil 3, ab etwa 11:19). Ein Auslöser war die Rückmeldung aus dem Design-Team, jemand sei von hinten herangelaufen und habe geschossen. Danach bekamen die Schritte die höchsten Prioritäten im Mix (ab etwa 11:05). Im Kern ist das ein Hörprotokoll mit einer Frage: Was hätte der Spieler hören müssen, und wann?

  > [!TIP] Kopfhörer und Lautstärke
  > Im Bus ist es laut. Dreh nicht nach, wenn eine Stelle leise wird, sonst misst du deine Hand statt des Mixes. Leise Stellen notierst du als leise.

  > [!INTERVIEW]
  > „Wie analysierst du den Ton eines Spiels, das du nicht kennst?“ Gute Antwort, etwa für eine Stelle als Sound Designer oder Audio Designer: Ich nehme einen kurzen Clip und höre ihn mehrmals mit Kopfhörern, einmal mit geschlossenen Augen. Jeden Klang trage ich mit Zeit, Quelle im Bild oder außerhalb, Aufgabe und Priorität ein. Dann frage ich, welche Information nur über den Ton kommt, wie viel Vorlauf die Warnungen haben und wo es still wird. Was mir gefällt, notiere ich getrennt, denn ein schöner Klang kann trotzdem eine Warnung verdecken.

  ## Häufige Fehler

  - **Geschmack statt Aufgabe.** „Klingt fett“ sagt nichts darüber, was der Spieler erfährt. Aufgabe und Geschmack in getrennte Spalten.
  - **Gewusstes statt Gehörtes.** Wer das Spiel kennt, trägt ein, was er erwartet. Mit geschlossenen Augen hören und nur eintragen, was im Clip zu hören ist.
  - **Nur die lauten Klänge.** Grundton und Stille fehlen im Protokoll, obwohl sie den Rahmen für jedes Signal bilden.
  - **Diegetisch mit realistisch verwechselt.** Die Frage ist, woher der Klang kommt und wem er etwas sagt, nicht, ob er echt klingt.
  - **Lautstärke nachgeregelt.** Danach stimmen die Verhältnisse im Protokoll nicht mehr.
  - **Zu lange Clips.** Fünf Minuten ergeben eine Liste ohne Zeitangaben. 30 bis 60 Sekunden genügen für eine Frage.
  - **Reduziert zuerst gehört.** Dann stehen Hall und Transienten im Protokoll, aber nicht, was der Klang bedeutet.

  ## Zusammenfassung

  - Ein Klang im Spiel hat Aufgaben: Rückmeldung, Warnung, Information außerhalb des Bilds, Orientierung, Stimmung, Kontinuität. Oft mehrere zugleich.
  - Diegetisch heißt, die Quelle liegt in der Spielwelt. Transdiegetisch ist ein Klang nach Jørgensen, wenn er über die Grenze hinweg informiert, etwa Musik, die einen Gegner ankündigt.
  - Chions drei Hörweisen ergeben drei Durchgänge: kausal, semantisch, reduziert. Reduziert zuletzt.
  - Schafers Grundton, Signal und Klangmarke beschreiben Bett, Reaktion und Ort.
  - Priorität fragt, was der Spieler nicht verpassen darf. Overwatch fragt nach der größten Bedrohung.
  - Stille ist selten Null. Notier, was wegfällt und was bleibt.
  - Das Hörprotokoll hat eine Zeile pro Klang: Zeit, Klang, Quelle, Aufgabe, Priorität. Die Auswertung sucht Information, die nur der Ton liefert.
exercises:
  - id: aufgaben-der-schritte
    type: choice
    title: Schritte von rechts
    prompt: |
      Im Clip ist nur deine Figur im Bild. Von rechts, jenseits des Bildrands, kommen Schritte näher. Eine Sekunde später erscheint ein Gegner und greift an. Welche Aufgaben erfüllen die Schritte? Mehrere Antworten richtig.
    options:
      - text: Warnung
        correct: true
        why: Sie kündigen den Angriff eine Sekunde vorher an.
      - text: Information außerhalb des Bilds
        correct: true
        why: Der Gegner ist noch nicht zu sehen. Nur der Ton sagt, dass und wo er kommt.
      - text: Rückmeldung auf deine Eingabe
        correct: false
        why: Du hast nichts gedrückt. Rückmeldung bestätigt eine eigene Eingabe, etwa einen Treffer.
      - text: Kontinuität zwischen zwei Räumen
        correct: false
        why: Im Clip wechselt kein Raum. Die Schritte verbinden nichts, sie kündigen an.
    explanation: |
      Ein Klang hat oft mehrere Aufgaben. Diese Schritte warnen und liefern zugleich, was das Bild nicht zeigt. Im Protokoll trägst du die wichtigste zuerst ein, hier die Warnung, und notierst die Quelle als „außerhalb“. So taucht der Klang in der Auswertung bei der Information auf, die nur der Ton liefert. Overwatch hat solche Schritte so gemischt, dass ein Spieler sie hört, bevor der Gegner schießt.
    resources:
      - title: Wwise Tour 2016 · Overwatch (3 of 7) – A Clear Mix
        url: https://www.youtube.com/watch?v=2M5cWHswQsM

  - id: transdiegetisch-einordnen
    type: choice
    title: Welche Klänge überschreiten die Grenze?
    prompt: |
      Welche Beispiele aus Kristine Jørgensens Aufsatz sind dort transdiegetisch? Mehrere Antworten richtig.
    options:
      - text: In Hitman Contracts wird die Musik dramatisch, sobald die Figur in einen Kampf gerät.
        correct: true
        why: Extern transdiegetisch. Die Musik hat keine Quelle in der Welt, gibt dem Spieler aber Information für sein Handeln.
      - text: In Warcraft III antwortet ein Arbeiter „More work?“, wenn der Spieler ihn auswählt.
        correct: true
        why: Intern transdiegetisch. Die Figur ist Teil der Welt, spricht aber den Spieler an.
      - text: In World of Warcraft sagt die eigene Figur „Not enough mana!“, und nur ihr Spieler hört es.
        correct: true
        why: Intern transdiegetisch. Andere Spieler hören den Satz nicht, er richtet sich an den Spieler.
      - text: Die Hintergrundmusik von Warcraft III, die nicht auf das Spielgeschehen reagiert.
        correct: false
        why: Laut Jørgensen wirkt sie nur als Stimmung. Sie ist extradiegetisch.
      - text: Ein Schwert, das im Bild auf einen Schild trifft.
        correct: false
        why: Die Quelle liegt in der Welt, die Figuren könnten es hören. Das ist diegetisch.
    explanation: |
      Jørgensen fragt nach der Quelle und nach der Funktion. Extern transdiegetisch ist ein Klang ohne Quelle in der Welt, der trotzdem über sie informiert. Intern transdiegetisch ist ein Klang aus der Welt, der sich an den Spieler wendet. Musik, die nur färbt, und Klänge, die nur aus der Welt kommen, bleiben in ihren alten Kategorien. Für dein Protokoll heißt das: Eine Musik ohne Quelle kann eine Warnung mit Priorität 1 sein.
    resources:
      - title: Kristine Jørgensen · On Transdiegetic Sounds in Computer Games
        url: https://hdl.handle.net/1956/5855

  - id: protokoll-ablauf
    type: order
    title: Ein Hörprotokoll Schritt für Schritt
    prompt: |
      Bring die Schritte des Hörprotokolls in die Reihenfolge aus der Lektion.
    lang: prose
    lines: |
      Einen Clip von 30 bis 60 Sekunden wählen und die Lautstärke einmal festlegen
      Einmal ohne Notizen hören, mit Bild
      Mit geschlossenen Augen hören und notieren, was du ohne Bild weißt
      Jeden Klang mit Zeit, Quelle, Aufgabe und Priorität eintragen
      Notieren, wo es still wird und was dort bleibt
      Ein letztes Mal reduziert hören und Klangeigenschaften ergänzen
      Auswerten, welche Information nur über den Ton kommt
    explanation: |
      Die Lautstärke steht vor allem anderen fest, sonst stimmen die Verhältnisse nicht. Der erste Durchgang ohne Notizen gibt dir den Überblick, der zweite mit geschlossenen Augen zeigt, was der Ton allein trägt. Dann folgen die Zeilen, kausal und semantisch gehört, und die Stille. Reduziertes Hören kommt zuletzt, damit Klangeigenschaften nicht die Frage nach der Bedeutung verdrängen. Die Auswertung braucht alle Zeilen und steht deshalb am Ende.

  - id: nur-ueber-den-ton
    type: output
    title: Was nur der Ton sagt
    prompt: |
      Ein Protokoll als Liste, die Zeit in Sekunden. Die Quelle ist `B` im Bild, `A` außerhalb des Bilds, `-` ohne Quelle in der Spielwelt. Priorität 1 ist die höchste. Was gibt das Programm aus?
    lang: python
    code: |
      # Zeit (s), Klang, Quelle, Prio
      liste = [
          (3, "Schritte Fig.", "B", 3),
          (7, "Wind", "-", 3),
          (11, "Schritte re.", "A", 1),
          (12, "Musik dichter", "-", 1),
          (14, "Hieb", "B", 2),
          (15, "Treffer", "B", 1),
          (19, "Rufen li.", "A", 2),
      ]
      for zeit, klang, q, prio in liste:
          if q != "B" and prio == 1:
              print(zeit, klang)
    expected: |
      11 Schritte re.
      12 Musik dichter
    hints:
      - "Gesucht sind Zeilen, deren Quelle `q` nicht `B` ist und deren Priorität 1 ist."
    explanation: |
      Der Filter ist die erste Frage der Auswertung: Welche wichtige Information zeigt das Bild nicht? Die Schritte rechts kommen von außerhalb, die dichtere Musik hat gar keine Quelle in der Welt. Beide kündigen den Angriff an. Der Treffer hat auch Priorität 1, ist aber im Bild zu sehen, und das Rufen links ist nur Priorität 2. In einem echten Protokoll sind das oft nur zwei, drei Zeilen. Gerade sie zeigen, wofür der Ton im Spiel gebraucht wird.

  - id: vorlauf-in-frames
    type: output
    title: Wie viel Vorlauf gibt die Warnung?
    prompt: |
      Aus einem Protokoll: drei Ankündigungen und die Ereignisse, die sie ankündigen, in Sekunden. Das Programm rechnet den Vorlauf in Frames bei 60 Frames pro Sekunde. Was gibt es aus?
    lang: python
    code: |
      FPS = 60
      # Klang, Ankündigung, Ereignis (s)
      paare = [
          ("Ruf", 11.20, 11.90),
          ("Zischen", 23.50, 24.00),
          ("Musik", 40.00, 43.25),
      ]
      for name, an, ereignis in paare:
          frames = (ereignis - an) * FPS
          print(name, round(frames))
    expected: |
      Ruf 42
      Zischen 30
      Musik 195
    hints:
      - "0,7 Sekunden sind 0,7 × 60 Frames."
    explanation: |
      0,7 s sind 42 Frames, 0,5 s sind 30, 3,25 s sind 195. Der Trainingsgegner im Combat-Kurs hat einen Telegraph von 20 Frames; alle drei Ankündigungen geben hier mehr Vorlauf. In Frames rechnest du, damit du Ton und Spielmechanik in derselben Einheit vergleichen kannst. Zeiten, die du im Clip abliest, sind nur auf etwa eine Zehntelsekunde genau; das reicht für einen Vergleich.
    resources:
      - title: Godot Docs · ProjectSettings, physics_ticks_per_second
        url: https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-physics-common-physics-ticks-per-second

  - id: begriffe-luecken
    type: gap
    title: Sechs Begriffe, ein Absatz
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Ein Klang, der so beständig zu hören ist, dass er einen Hintergrund bildet, heißt bei Schafer ⟦Grundton⟧. Ein Klang, auf den man hören soll, ist ein ⟦Signal⟧. Ein Klang, der einen Ort unverwechselbar macht, ist eine ⟦Klangmarke⟧. Wer fragt, was einen Klang erzeugt, hört ⟦kausal⟧. Wer seine Bedeutung nach einem Code liest, hört ⟦semantisch⟧. Wer nur auf seine Eigenschaften achtet, hört ⟦reduziert⟧.
    gaps:
      - label: Hintergrund
        hint: Im Englischen keynote, wie der Grundton einer Tonart.
        accept: ["Keynote", "Keynote Sound"]
      - label: Zum Hinhören
        hint: Englisch sound signal.
        accept: ["Sound Signal", "Signalklang"]
      - label: Ort
        hint: Abgeleitet von landmark.
        accept: ["Soundmark"]
      - label: Ursache
        hint: Chions erste Hörweise, von „Ursache“.
        accept: ["causal"]
      - label: Code
        hint: Wie Sprache oder Morsezeichen.
        accept: ["semantic"]
      - label: Eigenschaften
        hint: Der Klang wird auf sich selbst zurückgeführt.
        accept: ["reduced"]
    explanation: |
      Schafers Begriffe beschreiben eine Klanglandschaft: Bett, Signale und Orte. Chions Hörweisen beschreiben, wie du hörst. Beide zusammen ergeben die Spalten deines Protokolls: Die Quelle findest du kausal, die Aufgabe semantisch, Klangeigenschaften reduziert. Ob ein Klang Grundton oder Signal ist, hängt an der Szene, nicht am Klang selbst.
    resources:
      - title: Handbook for Acoustic Ecology · Sound Signal
        url: https://www.sfu.ca/sonic-studio-webdav/cmns/Handbook/Sound_Signal.html
      - title: Handbook for Acoustic Ecology · Soundmark
        url: https://www.sfu.ca/sonic-studio-webdav/cmns/Handbook/Soundmark.html

  - id: quelle-falsch
    type: bug
    title: Null Klänge von außerhalb
    prompt: |
      Zum Clip: Im Bild ist nur deine Figur. Der Gegner taucht erst bei 0:24 im Bild auf. Deine Auswertung sagt trotzdem: „Kein Klang mit Quelle außerhalb des Bilds.“ Finde die Zeile, die das verursacht, und korrigiere sie.
    lang: text
    code: |
      Zeit  Klang          Q  Aufg. P
      0:04  Schritte Fig.  B  Rück  3
      0:09  Wind           -  Stim  3
      0:21  Schritte re.   B  Warn  1
      0:24  Gegner Ruf     B  Warn  2
      0:25  Hieb           B  Rück  2
    lines: [4]
    fix:
      - line: 4
        answers:
          - 0:21  Schritte re.   A  Warn  1
    explanation: |
      Bei 0:21 ist der Gegner noch nicht zu sehen. Seine Schritte kommen also von außerhalb des Bilds, Quelle `A`. Wer das Spiel kennt oder den Clip schon gesehen hat, weiß, wer da läuft, und trägt aus Versehen `B` ein. Dann fehlt in der Auswertung die Information, die nur der Ton liefert. Deshalb der Durchgang mit geschlossenen Augen: Er trennt Gehörtes von Gewusstem.
    resources:
      - title: Wwise Tour 2016 · Overwatch (4 of 7) – Pinpoint Accuracy
        url: https://www.youtube.com/watch?v=F2N8bbzhHd8

  - id: klangmarke-falsch
    type: bug
    title: Die Orte klingen gleich
    prompt: |
      Du willst mit diesen Notizen festhalten, woran man drei Orte eines Clips am Klang unterscheidet. Beim Nachlesen merkst du, dass eine Zeile dabei nicht hilft, weil sie einen Klang falsch einordnet. Finde sie.
    lang: prose
    code: |
      Der Wind ist in allen drei Gebieten zu hören. Er ist die Klangmarke des Spiels.
      Der Brunnen ist nur auf dem Platz zu hören. Er ist die Klangmarke des Platzes.
      Das Brummen der Maschine ist nur in der Halle zu hören. Es ist ihre Klangmarke.
      Die Schritte des Gegners sind ein Signal. Auf sie reagiert man.
    lines: [1]
    explanation: |
      Ein Klang, der überall zu hören ist, ist ein Grundton, kein Ort. Er bildet den Hintergrund, vor dem Signale und Klangmarken auffallen. Eine Klangmarke macht einen bestimmten Ort unverwechselbar, wie der Brunnen den Platz. Für Orientierung zählen deshalb die Klänge, die es nur an einem Ort gibt. Der Wind sagt dir, dass du im Spiel bist, nicht wo.
    resources:
      - title: Handbook for Acoustic Ecology · Keynote
        url: https://www.sfu.ca/sonic-studio-webdav/cmns/Handbook/Keynote.html

  - id: high-noon-erklaeren
    type: explain
    title: Eine Ansage, die durch Wände geht
    prompt: |
      Erkläre in eigenen Worten, warum das Overwatch-Team diese Ausnahmen gemacht hat.
    lang: prose
    code: |
      Schritte und Waffenfeuer haben verschiedene Abstandskurven:
      Die Waffe hört man von weiter weg, die Schritte erst in der Nähe.
      Die Ansage „It's high noon“ wird von Wänden kaum gedämpft.
      Das Team hat Dämpfungswerte bei Ansagen der stärksten Fähigkeiten bewusst weggelassen.
    points:
      - Die Ansage ist eine Warnung, auf die jeder sofort reagieren muss, auch hinter einer Wand.
      - Priorität geht hier vor physikalischer Wahrscheinlichkeit.
      - Die gelernte Bedeutung wirkt nur, wenn die Ansage zuverlässig ankommt.
      - Verschiedene Abstandskurven geben zusätzliche Information, etwa ob ein Gegner nah oder nur in Hörweite ist.
    explanation: |
      McCrees Ansage kündigt einen Angriff an, der jeden im Blickfeld treffen kann. Würde eine Wand sie dämpfen, verpasste ausgerechnet der Spieler die Warnung, der in Gefahr ist. Das Team hat deshalb bei solchen Ansagen auf die Dämpfung verzichtet und Priorität über Realismus gestellt. Weil die Ansage gelernt ist, reicht oft der Anfang, und man sucht Deckung. Die verschiedenen Kurven für Schritte und Waffen sind dieselbe Idee im Kleinen: Hört man nur die Waffe, ist der Gegner weit weg; hört man die Schritte, ist er nah und kommt vielleicht um die Ecke.
    resources:
      - title: Wwise Tour 2016 · Overwatch (4 of 7) – Pinpoint Accuracy
        url: https://www.youtube.com/watch?v=F2N8bbzhHd8
      - title: Wwise Tour 2016 · Overwatch (6 of 7) – Pavlovian Response
        url: https://www.youtube.com/watch?v=ojlqmkoLvHg

  - id: film-gegen-spiel
    type: explain
    title: Dieselbe Musik, andere Wirkung
    prompt: |
      Erkläre mit Jørgensens Begriffen, warum eine Musik ohne Quelle im Film extradiegetisch bleibt, im Spiel aber transdiegetisch werden kann.
    lang: prose
    code: |
      Film: Das Hai-Thema setzt ein. Die Figur im Wasser ahnt nichts.
      Spiel: Die Musik wird aggressiver. Der Spieler weicht dem Gegner aus, den er noch nicht sieht.
    points:
      - Im Film kann der Zuschauer die Information nicht in Handlung umsetzen, im Spiel kann der Spieler es.
      - Die Musik hat in beiden Fällen keine Quelle in der erzählten Welt.
      - Im Spiel beeinflusst sie, was in der Spielwelt passiert, und ist deshalb extern transdiegetisch.
      - Transdiegetisch ist eine Funktion des Klangs, kein eigener Ort.
    explanation: |
      Der Zuschauer von Jaws hört das Hai-Thema, aber er kann nichts tun; die Musik bleibt Kommentar für ihn. Der Spieler von Oblivion hört die aggressivere Melodie und handelt: Er weicht aus oder bleibt und kämpft. Die Quelle ist in beiden Fällen dieselbe, nämlich keine in der Welt. Was sich ändert, ist die Funktion: Im Spiel trägt die Musik Information, die in die Welt zurückwirkt. Jørgensen nennt das extern transdiegetisch und betont, dass es um diese Funktion geht.
    resources:
      - title: Kristine Jørgensen · On Transdiegetic Sounds in Computer Games
        url: https://hdl.handle.net/1956/5855

  - id: drei-durchgaenge
    type: practice
    title: Ein Clip, drei Hörweisen
    prompt: |
      Nimm einen Clip von 30 Sekunden aus einem Spiel deiner Wahl, Spielszenen ohne Kommentar. Hör ihn dreimal mit Kopfhörern: kausal, dann semantisch, dann reduziert. Schreib nach jedem Durchgang zwei, drei Stichpunkte. Notier am Ende, welcher Durchgang dir etwas gezeigt hat, das die anderen nicht zeigten.
    lang: prose
    checklist:
      - Du hast notiert, welchen Clip du gehört hast und welche 30 Sekunden.
      - Zu jedem der drei Durchgänge stehen eigene Stichpunkte.
      - Im semantischen Durchgang hast du mindestens eine Bedeutung notiert, die man im Spiel lernen muss.
      - Im reduzierten Durchgang hast du Eigenschaften beschrieben, keine Ursachen.
      - Du hast eine Beobachtung notiert, die nur einer der drei Durchgänge geliefert hat.
    hints:
      - Im kausalen Durchgang darfst du raten. Schreib dann ein Fragezeichen dazu.
    explanation: |
      Die drei Durchgänge trennen, was beim normalen Hören zusammenfällt. Kausal findest du die Quellen, semantisch die Bedeutungen, reduziert die Eigenschaften, mit denen ein Klang seine Aufgabe erfüllt. Oft zeigt der semantische Durchgang am meisten, weil man dort merkt, was ein Spieler erst lernen muss. Der reduzierte bereitet vor, was du in [Klangformung](/sound/klangformung) selbst gestaltest.
    resources:
      - title: Michel Chion · Audio-Vision (Columbia University Press)
        url: https://cup.columbia.edu/book/audio-vision-sound-on-screen/9780231185899/

  - id: eigenes-hoerprotokoll
    type: practice
    title: Dein erstes Hörprotokoll
    prompt: |
      Schreib ein Hörprotokoll für einen Clip von 30 bis 60 Sekunden aus einem Spiel deiner Wahl. Halte dich an die Schritte und Spalten aus der Lektion, mit kurzen Kürzeln, damit es aufs Handy passt. Schreib darunter drei Sätze Auswertung.
    lang: prose
    checklist:
      - Du hast Spiel, Clip und Zeitbereich notiert.
      - Das Protokoll hat mindestens acht Zeilen mit Zeit, Klang, Quelle, Aufgabe und Priorität.
      - Mindestens eine Zeile hat eine Quelle außerhalb des Bilds oder ohne Quelle in der Spielwelt, oder du hast notiert, dass es keine gibt.
      - Du hast mindestens eine Stelle notiert, an der es still oder leiser wird, und was dort bleibt.
      - Die Auswertung nennt die Information, die nur der Ton liefert.
      - Unsichere Einträge tragen ein Fragezeichen.
      - Bewertungen wie „gut“ oder „zu laut“ stehen nicht in den Spalten.
    explanation: |
      Das Protokoll ist dein Werkzeug für alle weiteren Module. Mit ihm planst du in [Vom Ereignis zur Cue-Liste](/sound/klangplan), welche Klänge dein Spiel braucht, und prüfst in [Mischung](/sound/mischung-stille), ob ein Signal durchkommt. Ein erstes Protokoll ist oft zu grob oder zu lang. Vergleich es nach ein paar Tagen mit einem zweiten Durchgang desselben Clips: Was du dann anders einträgst, zeigt, was du dazugelernt hast.
    resources:
      - title: Wwise Tour 2016 · Overwatch (1 of 7) – Audio in Overwatch
        url: https://www.youtube.com/watch?v=fGDOgn2WXLs
