id: foley-umgebung
title: Foley, Atmo und eigenes Material umbauen
level: 2
minutes: 140
summary: Wie du Foley zu einem Clip deiner eigenen Szene anlegst, eine Atmo aus nahtlosem Bett und zufälligen Spot-Klängen baust und eigene Aufnahmen mit den Bordmitteln von REAPER zu neuem Material umformst.
place: pc
goals:
  - Du nimmst mit Godots Movie Maker einen Clip deiner Szene auf, holst ihn in REAPER, ins Videofenster oder als PNG-Folge mit WAV, und setzt Foley auf Frame-Nummern.
  - Du trennst eine Atmo in Bett und Spot-Klänge und baust das Bett mit getauschten Hälften und Crossfade zu einem nahtlosen Loop, dessen Länge du vorher ausrechnest.
  - Du lässt Spot-Klänge in Godot in zufälligen Pausen an zufälligen Orten spielen und begründest, warum die Pause erst nach dem Klang beginnt.
  - Du formst eigenes Material mit Abspielrate, Pitch-Modi, Reverse und Faltung mit einer selbst aufgenommenen Impulsantwort um.
  - Du findest die Ursache, wenn ein Loop im Spiel an der Naht klickt oder aussetzt.
