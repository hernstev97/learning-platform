  - id: spot-luecken
    type: gap
    title: Spot-Klänge mit Pause nach dem Klang
    prompt: |
      Ergänze das Skript: Die Pause ist zufällig zwischen `min_pause` und `max_pause`, der Ort liegt in einem Kreis um den Node, und die nächste Pause beginnt, wenn der Klang zu Ende ist.
    lang: gdscript
    code: |
      func _ready() -> void:
      	_player.stream = stream
      	add_child(_player)
      	_timer.⟦one_shot⟧ = true
      	add_child(_timer)
      	_timer.timeout.connect(_play_spot)
      	_player.⟦finished⟧.connect(_wait)
      	_wait()


      func _wait() -> void:
      	_timer.start(⟦randf_range⟧(min_pause, max_pause))


      func _play_spot() -> void:
      	_player.position = Vector2.⟦from_angle⟧(randf() * TAU) * randf() * radius
      	_player.play()
    gaps:
      - label: Timer läuft einmal
        hint: Die Eigenschaft, die einen Timer nach einem Ablauf stehen lässt.
      - label: Signal am Ende
        hint: Das Signal, das ein Player sendet, wenn der Klang zu Ende ist.
      - label: Zufällige Zahl
        hint: Eine Fließkommazahl zwischen zwei Grenzen.
      - label: Richtung aus Winkel
        hint: Ein Einheitsvektor aus einem Winkel im Bogenmaß.
    explanation: |
      `one_shot` hält den Timer nach jedem Ablauf an; neu gestartet wird er nur in `_wait()`. Weil `_wait()` an `finished` hängt, beginnt die Pause erst nach dem Klang, wie in Holliers Lösung. `randf_range` liefert die Pause, `Vector2.from_angle` eine Richtung, die mit `randf() * radius` eine Entfernung bekommt. Ein Klang, der in Schleife läuft, sendet kein `finished`; Spot-Klänge dürfen deshalb nicht loopen.
    resources:
      - title: Godot Docs · Timer.start
        url: https://docs.godotengine.org/en/stable/classes/class_timer.html#class-timer-method-start
      - title: Godot Docs · Vector2.from_angle
        url: https://docs.godotengine.org/en/stable/classes/class_vector2.html#class-vector2-method-from-angle

  - id: loop-setzt-aus
    type: bug
    title: Das Bett setzt immer wieder aus
    prompt: |
      Das Bett ist in REAPER nahtlos, die Region 22 Sekunden lang. Im Spiel setzt es nach 22 Sekunden kurz aus und danach bei jedem Durchlauf wieder. Die Datei im Exportordner ist 23 Sekunden lang. Welche Zeile ist schuld?
    lang: text
    code: |
      Region     bett_ort_loop, 0:00.000 bis 0:22.000
      Source     Region render matrix
      Tail       an, 1000 ms
      File name  $region
      Format     WAV, 24 bit PCM
      Godot      Loop Mode Forward, Loop End −1
    lines: [3]
    explanation: |
      Mit Tail hängt REAPER an jede Region Zeit an, hier eine Sekunde. Die Datei ist dann 23 Sekunden lang, und Godot loopt über die ganze Datei, also auch über die angehängte Sekunde, in der das Bett schon zu Ende ist. Für Loops rendert man ohne Tail; braucht der Anfang eine Hallfahne vom Ende, ist *2nd pass render* der Weg.
    resources:
      - title: REAPER User Guide 7.81 · Render-Dialog mit Tail (S. 413)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=413
      - title: REAPER User Guide 7.81 · 2nd pass render (S. 415)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=415

  - id: spots-abgeschnitten
    type: bug
    title: Lange Spot-Klänge brechen ab
    prompt: |
      Kurze Spot-Klänge laufen gut. Lange brechen manchmal mitten ab, und die Abstände zwischen den Klängen wirken kürzer als die eingestellten Pausen plus Klang. Finde die Zeile und korrigiere sie.
    lang: gdscript
    code: |
      func _ready() -> void:
      	_player.stream = stream
      	add_child(_player)
      	_timer.one_shot = true
      	add_child(_timer)
      	_timer.timeout.connect(_play_spot)
      	_timer.timeout.connect(_wait)
      	_wait()
    lines: [7]
    fix:
      - line: 7
        answers:
          - _player.finished.connect(_wait)
          - _player.finished.connect(self._wait)
          - _player.finished.connect(Callable(self, "_wait"))
          - _player.connect("finished", _wait)
          - _player.connect("finished", self._wait)
          - _player.connect(&"finished", _wait)
    explanation: |
      Die Zeile startet die nächste Pause schon in dem Moment, in dem der Klang beginnt. Ist der Klang länger als die neue Pause, startet der nächste, während der alte noch läuft, und weil der Player nur eine Stimme hat, schneidet er ihn ab. Gemessen in Godot 4.7.2: 6 Abbrüche in 40 Sekunden statt keinem. Mit `finished` beginnt die Pause nach dem Klang, so wie Hollier es für Eon Altar gelöst hat.
    resources:
      - title: Mark Hollier · Eon Altar Ambience System (Game Developer)
        url: https://www.gamedeveloper.com/audio/video-game-audio-under-the-hood-eon-altar-ambience-system

  - id: naht-erklaeren
    type: explain
    title: Warum das Tauschen die Naht versteckt
    prompt: |
      Erkläre an dieser Ausgabe des Modells aus der Lektion, warum getauschte Hälften einen Loop nahtlos machen und wohin der Sprung wandert.
    lang: text
    code: |
      Naht vorher: 0.957
      Naht nachher: 0.012
      Stoß in der Mitte: 0.957
      größter Schritt sonst: 0.021
    points:
      - Vorher springt das Signal an der Naht vom letzten zum ersten Sample weit, das klickt bei jedem Durchlauf.
      - Nach dem Tausch sind Ende und Anfang zwei Samples, die in der Aufnahme nebeneinanderlagen; der Schritt ist so klein wie jeder andere.
      - Der alte Sprung sitzt jetzt in der Mitte der Datei.
      - In der Mitte lässt er sich mit einem Crossfade überdecken, an der Naht eines Loops nicht, weil dort nichts überlappt.
    explanation: |
      Der Loop-Punkt ist der einzige Ort, an dem du nicht überblenden kannst: Danach kommt der Anfang derselben Datei. Tauschst du die Hälften, liegen dort zwei Samples, die in der Aufnahme direkt aufeinander folgten, und der Übergang ist so glatt wie die Aufnahme. Den Sprung hast du damit nicht beseitigt, sondern in die Mitte verlegt. Dort überlappen die Hälften, und ein Crossfade macht ihn unhörbar. Im echten Material wählst du die Schnittstelle an einer ruhigen Stelle, damit der Crossfade nichts Auffälliges verdoppelt.

  - id: ir-erklaeren
    type: explain
    title: Ein Raum aus einem Klatscher
    prompt: |
      Erkläre, was diese Kette tut und was du beim Ergebnis erwarten musst.
    lang: text
    code: |
      Aufnahme  Handy, Flur, ein Klatscher
      Schnitt   direkt vor der Transiente,
                Ausklang bis ins Rauschen, Fade am Ende
      Render    ir_flur_klatsch_01.wav
      ReaVerb   Add → File: ir_flur_klatsch_01.wav
                Normalize
      Spur      Schritt-Varianten, ReaVerb als Track FX
    points:
      - ReaVerb faltet das Signal mit der Datei; die Datei wirkt als Impulsantwort, also als Abdruck des Flurs.
      - Der Schnitt direkt vor der Transiente verhindert eine Verzögerung des Halls, der Fade am Ende einen harten Abbruch.
      - Ein Klatscher ist kein idealer Impuls; sein eigener Klang färbt den Hall mit.
      - Das Rauschen im Ausklang wird mit gefaltet, deshalb lohnt ein kurzer Ausklang oder eine gesäuberte Aufnahme.
    explanation: |
      Faltung heißt: Jedes Sample des Signals löst eine Kopie der Impulsantwort aus, mit seinem Wert skaliert, und alle Kopien werden addiert. Ist die Impulsantwort die Aufnahme eines kurzen Knalls in einem Raum, klingt das Ergebnis, als stünde die Quelle in diesem Raum. Ein Klatscher ist kein perfekter Knall, er hat eine eigene Klangfarbe, die mitkommt; ob sie stört oder gerade passt, hörst du. Stille vor der Transiente verzögert den ganzen Hall, Rauschen im Ausklang wird zu einem rauschenden Hall. Normalize hebt die Impulsantwort auf 0 dBFS, damit der Pegel planbar bleibt.
    resources:
      - title: REAPER User Guide 7.81 · ReaVerb (S. 331)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=331

  - id: foley-zum-clip
    type: practice
    title: Foley zu deinem Clip
    prompt: |
      Nimm mit Movie Maker einen Clip einer festen Aktion deiner Szene auf, hol ihn in REAPER und lege Foley dazu: eigene Aufnahmen mit dem Handy, zum Bild eingespielt oder wild aufgenommen und auf die Frames geschoben. Spielt das Videofenster bei dir nicht, nimm den Weg ohne Bild aus der Lektion: PNG-Folge, WAV und Prüfklick. Welche Geräusche, entscheidest du.
    lang: prose
    checklist:
      - Der Clip ist mit `--fixed-fps` und `--quit-after` aufgenommen und läuft im Videofenster, oder du hast ihn als PNG-Folge mit WAV aufgenommen und notiert, warum das Videofenster nicht ging.
      - Die Zeitleiste zeigt Frames, und die Bildrate in den Projekteinstellungen entspricht der des Clips.
      - Ohne Videofenster liegt der Prüfklick in der WAV in dem Frame, den du für sein Ereignis notiert hast.
      - Für jedes Foley-Ereignis hast du notiert, auf welchem Frame es liegt.
      - Jede Aufnahme hat eine Ansage oder einen Klatscher, und die Rohdateien liegen unverändert in deinem Rohordner.
      - Mindestens eine Bewegung hast du in zwei Varianten aufgenommen und notiert, welche du nimmst und warum.
    explanation: |
      Die Übung verbindet Bild, Aufnahme und Schnitt in einem Ablauf, den du später für jede feste Sequenz wiederholst. Die Frame-Nummern machen dein Foley änderbar: Ändert sich die Animation, weißt du, welches Ereignis wohin wandern muss. Ob die Geräusche gut sind, entscheidest du beim Hören im Spiel, nicht diese Liste.
    resources:
      - title: Godot Docs · Creating movies
        url: https://docs.godotengine.org/en/stable/tutorials/animation/creating_movies.html

  - id: eigene-atmo
    type: practice
    title: Eine Atmo für einen Ort
    prompt: |
      Bau die Atmo für einen Ort deiner Wahl: ein Bett als nahtlosen Loop aus eigener Aufnahme und Spot-Klänge, die `spot_sounds.gd` in Godot zufällig spielt. Hör sie im Spiel mindestens zehn Minuten und notiere, was dir wann auffällt. Ort, Klänge und Pausen entscheidest du.
    lang: prose
    checklist:
      - Das Bett ist eine Region ohne Tail, ihre Länge steht in deiner Notiz, und in Godot steht *Loop Mode* auf *Forward* mit Loop-Ende −1.
      - In Schleife abgehört klickt die Naht nicht, weder in REAPER noch im Spiel.
      - Mindestens ein auffälliges Stück aus der Aufnahme ist aus dem Bett geschnitten und als Spot-Klang mit Varianten verwendet.
      - Die Spot-Klänge spielen über `spot_sounds.gd` auf einem eigenen Bus, und kein Klang bricht ab.
      - Deine Notiz nennt für die zehn Minuten Hören mindestens einen Zeitpunkt, an dem dir eine Wiederholung auffiel, oder hält fest, dass keine auffiel.
      - Fremdes Material, falls verwendet, steht mit Lizenz in deiner Quellenliste.
    explanation: |
      Ob eine Atmo trägt, zeigt erst langes Hören im Spiel. Die Notiz mit Zeitpunkten macht daraus eine Messung: Fällt dir nach drei Minuten etwas auf, weißt du, was du aus dem Bett nehmen oder als Spot-Klang variieren musst. Bus und Lizenz sind Ordnung, die du in [Mischung](/sound/mischung-stille) und in der Werkstatt brauchst.
    resources:
      - title: Godot Docs · Importing audio samples, Loop Mode
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#edit-loop-mode
