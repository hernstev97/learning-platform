lesson: |
  Du hast eine Aktion deiner Figur in der Testszene, mit Treffer und eigenen Varianten aus [Layering und Varianten](/sound/layering-varianten). Zwischen den Treffern ist es still, als stünde die Figur im luftleeren Raum: kein Stoff, der sich bewegt, kein Ort, der klingt. Dafür sind zwei Handwerke da. **Foley** sind Geräusche, die zu einer Bewegung im Bild aufgenommen werden: Schritte, Kleidung, Dinge, die angefasst werden. Eine **Atmo** (Ambience) ist der Klang des Ortes, aus einem durchgehenden Bett und einzelnen Spot-Klängen.

  Aus der Musik kennst du Aufnahmen zum Klick und Loops auf Taktgrenzen. Im Spiel kommt hinzu: Foley hängt an Frames statt an Takten, und ein Bett läuft so lange, wie der Spieler an einem Ort bleibt, vielleicht zwanzig Minuten. Dieses Modul zeigt, wie du beides mit Handy, REAPER-Bordmitteln und Godot baust, und wie du eigenes Material zu neuem umformst. Welche Klänge dein Ort hat, entscheidest du. Seitenangaben beziehen sich auf die PDF-Seiten des [REAPER User Guide 7.81](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf).

  ## Foley im Spiel: zum Bild oder als Ereignis

  Shaun Gallagher übernahm den Foley für den Story-Modus von Mortal Kombat X. Er beschreibt die übliche Arbeit so: „footstep, cloth, and interaction foley is performed live to picture“, danach wird geschnitten. In Spielen ändert sich das Bild aber laufend, weil viele Leute gleichzeitig an Figuren und Umgebungen arbeiten: Schuhe, Böden, Kostüme. Das Team spielte Schritte deshalb über Sampler-Patches mit einzelnen Schritten per MIDI zum Bild ein; Timing und Lautstärke ließen sich danach Note für Note verschieben, und bei einem neuen Boden tauschte man nur das Patch. Kleidung und Interaktionen kamen aus eigenen Aufnahmen und Bibliotheken ([A Sound Effect](https://www.asoundeffect.com/mortal-kombat-x-sound/)).

  Für dein Spiel heißt das zweierlei:

  - **Als Ereignis.** Was der Spieler auslöst, spielt die Engine im passenden Frame, etwa Schritte über `frame_changed` ([Audio zuordnen](/godot/audio)). Hier nimmst du keine Darbietung auf, sondern Varianten: viele Takes, geschnitten, gesäubert, als Regionen gerendert.
  - **Zum Bild.** Feste Abläufe, etwa ein Auftritt, eine Animation, die immer gleich läuft, oder ein Trailer, bekommen Foley zu einem Clip.

  Die Sampler-Methode geht mit Bordmitteln: ReaSamplOmatic5000 nimmt eine Aufnahme per Drag-and-drop oder mit *Import item from arrange* (S. 347). Spielen kannst du ohne Keyboard über das *Virtual MIDI Keyboard* (Alt+B, S. 72) oder indem du Noten im MIDI-Editor auf die Frame-Positionen zeichnest. Kontakt bleibt unter Linux ein offener Punkt; der Kurs braucht es nicht.

  ## Der eigene Clip: Videofenster oder PNG-Folge

  Einen Clip deiner Szene nimmt Godots **Movie Maker** auf. Er rendert nicht in Echtzeit, sondern Frame für Frame mit fester Bildrate, und schreibt den Ton mit; hören kannst du ihn während der Aufnahme nicht ([Creating movies](https://docs.godotengine.org/en/stable/tutorials/animation/creating_movies.html#command-line-usage)). Im Projektordner:

  ```text
  godot --path . --write-movie clip.avi --fixed-fps 60 --quit-after 600
  ```

  `--quit-after` zählt Frames, 600 sind bei 60 Frames pro Sekunde zehn Sekunden. Ein relativer Pfad landet im Projektordner. AVI enthält MJPEG-Video und unkomprimierten Ton. Beende die Aufnahme über `--quit-after` oder das Fensterkreuz; nach Strg+C fehlt der AVI-Datei laut Doku die Dauer, und Schnittprogramme öffnen sie dann womöglich nicht. Gemessen: Mit `--headless` stürzte Godot 4.7.2 im Movie Maker ab, starte also mit Fenster. Die Mischrate der Aufnahme steht standardmäßig auf 48 000 und muss laut Doku durch die Bildrate teilbar sein, sonst laufen Bild und Ton auseinander; 48 000 / 60 = 800 passt. Damit jede Aufnahme gleich abläuft, steuerst du die Eingaben mit dem Drehbuch der [Testszene](/combat/testszene-angriff) statt mit der Hand.

  In REAPER holst du die AVI mit *Insert → Media File* oder per Drag-and-drop, *View → Video Window* (Strg+Umschalt+V) zeigt das Bild (S. 399). Unter *Project Settings → Video* stellst du die Bildrate auf 60, die Zeitleiste per Rechtsklick auf *Absolute Frames* (S. 46, S. 408, S. 410). Für den Ton der AVI gibt es in den Eigenschaften der Videodatei *Ignore audio* (S. 409–410).

  Unter Linux ist das Videofenster der unsichere Teil. Der Guide nennt für Windows DirectShow und für macOS QuickTime (S. 399), zu Linux sagt er nichts Eigenes. Er beschreibt unter *Preferences → Media → Video* eine Rangfolge der Decoder mit ffmpeg und vlc und die Option *Show decoder information* (S. 409, S. 426). Ob REAPER 7.81 unter CachyOS die AVI aus Godot abspielt, ist ungeprüft. Bleibt das Fenster schwarz, zeigt *Show decoder information*, welcher Decoder es versucht hat; die Windows-Partition ist ein zweiter Weg.

  Es geht auch ohne Videofenster. Nimm den Clip als PNG-Folge auf, in einen Ordner außerhalb des Projekts, den du vorher anlegst; im Projektordner würde der Editor jede PNG importieren:

  ```text
  godot --path . --write-movie ~/sound/clips/schlag/clip.png --fixed-fps 60 --quit-after 600
  ```

  Godot schreibt `clip00000000.png`, `clip00000001.png` und so weiter, eine Datei pro Frame ab 0, und daneben `clip.wav` ([PNG](https://docs.godotengine.org/en/stable/tutorials/animation/creating_movies.html#png)). Die WAV öffnet REAPER wie jede Aufnahme, und Datei Nummer k beginnt in ihr bei k/60 Sekunden. Gemessen mit Godot 4.7.2: Eine Testszene schaltete im 21. Physik-Frame das Bild auf Weiß und startete einen Klick. Weiß war das Bild ab `clip00000020.png`, und der Klick begann in der WAV bei Sample 16 450, 450 Samples nach dem Beginn von Frame 20 (16 000 bei 48 kHz). Welches Ereignis in welchem Frame liegt, siehst du im Bildbetrachter an der Dateinummer oder im Log der Testszene. Lass die Szene an einem bekannten Ereignis einen Prüfklick spielen: An ihm prüfst du in der WAV, ob deine Zählung stimmt, bevor du Foley auf die Frames legst.

  **Aufnehmen zum Bild mit dem Handy:** Setz einen Marker zwei Sekunden vor die erste Bewegung. Starte die Handy-Aufnahme, spiel das Projekt ab und klatsche einmal, wenn der Cursor den Marker erreicht, dann spiel die Bewegungen mit. In REAPER legst du die Transiente des Klatschers auf den Marker. Die Ausrichtung ist so genau wie dein Klatschen; die einzelnen Ereignisse schiebst du danach auf ihre Frames, wie Gallagher seine MIDI-Noten. Halte die Takes kurz, denn zwei Geräte laufen nie genau gleich schnell. Wie du mit dem Handy aufnimmst, steht in [Feldaufnahme mit dem Handy](/sound/feldaufnahme).

  ## Atmo: Bett und Spot-Klänge

  Das **Bett** läuft durchgehend: der Grundton eines Ortes, als Loop. **Spot-Klänge** sind einzelne Ereignisse darüber, die zu unregelmäßigen Zeiten an verschiedenen Stellen kommen. Wie man das an veröffentlichten Spielen hört, steht in [Kritisch hören](/sound/hoeren-analysieren).

  Ronny Mraz beschreibt den ersten Schritt am Bett: auffällige Einzelgeräusche herausnehmen, denn wer „the same bird call every 15 seconds“ hört, erkennt den Loop. Die herausgenommenen Stücke hebt er auf, als Spot-Klänge ([Splice, 2021](https://splice.com/blog/audio-soundscape-for-video-games/)). Mark Hollier baute für Eon Altar je Zone ein Bett, mit Crossfade beim Wechsel, und darüber „One Shot Sweeteners“: eine zufällige Pause, in seiner Demo zwischen 5 und 10 Sekunden, dann eine zufällige Gruppe aus 5 bis 10 Klängen, daraus eine von 5 Varianten, an einem zufälligen Ort um den Hörer. Sein Problem danach: Klänge spielten übereinander. Seine Lösung: erst warten, bis der Klang zu Ende ist, dann die nächste Pause starten ([Game Developer, 2016](https://www.gamedeveloper.com/audio/video-game-audio-under-the-hood-eon-altar-ambience-system)).

  Dasselbe in Godot. Als `stream` trägst du einen `AudioStreamRandomizer` mit deinen Spot-Klängen ein:

  ```gdscript title=spot_sounds.gd
  extends Node2D
  ## Spielt Spot-Klänge einer Atmo in zufälligen Pausen an zufälligen Orten
  ## um diesen Node. Die nächste Pause beginnt erst, wenn der Klang zu Ende ist.
  ## Alle Zahlen sind Platzhalter.

  @export var stream: AudioStream    ## z. B. ein AudioStreamRandomizer mit deinen Spot-Klängen
  @export var min_pause := 4.0       ## Sekunden Stille, mindestens
  @export var max_pause := 12.0      ## Sekunden Stille, höchstens
  @export var radius := 160.0        ## Pixel um diesen Node
  @export var bus := &"Atmo"         ## muss im Audio-Panel existieren

  var _player := AudioStreamPlayer2D.new()
  var _timer := Timer.new()


  func _ready() -> void:
  	_player.stream = stream
  	_player.bus = bus
  	add_child(_player)
  	_timer.one_shot = true
  	add_child(_timer)
  	_timer.timeout.connect(_play_spot)
  	_player.finished.connect(_wait)
  	_wait()


  func _wait() -> void:
  	_timer.start(randf_range(min_pause, max_pause))


  func _play_spot() -> void:
  	_player.position = Vector2.from_angle(randf() * TAU) * randf() * radius
  	_player.play()
  ```

  Gemessen in Godot 4.7.2 mit einem Prüfklang von 2 Sekunden und Pausen zwischen 1 und 3 Sekunden, 40 Sekunden lang: 9 Starts, 9-mal `finished`, kein Abbruch; zwischen zwei Starts lagen 3,39 bis 5,04 Sekunden. In einer Fassung, die die Pause schon beim Start des Klangs neu startet, statt bei `finished`, gab es 17 Starts und 6 Abbrüche: Der neue Klang schnitt den alten ab, weil ein Player standardmäßig nur eine Stimme hat (`max_polyphony`, siehe [Audio zuordnen](/godot/audio)). Das Bett selbst läuft auf einem eigenen `AudioStreamPlayer` ohne Ort, mit Loop aus dem Import-Dock.

  > [!PRAXIS] Was aus dem Bett fliegt, wird Spot-Klang
  > Mraz und Hollier arbeiten mit derselben Trennung: Das Bett ist gleichmäßig und unauffällig, alles Erkennbare spielt die Engine einzeln, zufällig und mit Varianten. Mraz macht die Spot-Klänge aus genau den Stücken, die er aus dem Bett geschnitten hat. Ein Bett mit einem Vogelruf darin ist nach drei Durchläufen ein Loop; derselbe Ruf als Spot-Klang mit Varianten an wechselnden Orten bleibt Teil des Ortes.

  ## Der nahtlose Loop

  Ein Bett endet und beginnt im Spiel ohne Pause. Liegt der letzte Sample-Wert weit weg vom ersten, springt das Signal an der Naht, und das klickt bei jedem Durchlauf. Mraz' Weg: die Aufnahme etwa in der Mitte teilen, an einer ruhigen Stelle, die Hälften tauschen und am neuen Stoß mit einem Crossfade verbinden. An die äußeren Enden setzt er zusätzlich sehr kurze Fades gegen Klicks. Als Länge nennt er 10 bis 30 Sekunden als Startpunkt. Warum es funktioniert, zeigt ein kleines Modell mit einem Sinus, der nicht in ganzen Perioden endet:

  ```python run
  import math

  rate = 1000
  werte = [math.sin(2 * math.pi * 3.3 * i / rate) for i in range(rate)]

  def sprung(a, b):
      return round(abs(a - b), 3)

  print("Naht vorher:", sprung(werte[-1], werte[0]))
  mitte = len(werte) // 2
  neu = werte[mitte:] + werte[:mitte]
  print("Naht nachher:", sprung(neu[-1], neu[0]))
  print("Stoß in der Mitte:", sprung(neu[mitte - 1], neu[mitte]))
  print("größter Schritt sonst:", max(sprung(a, b) for a, b in zip(werte, werte[1:])))
  ```

  Nach dem Tausch sind Ende und Anfang der Datei zwei Samples, die in der Aufnahme nebeneinanderlagen; der Sprung ist so klein wie jeder andere Schritt. Der alte Sprung sitzt jetzt in der Mitte, und dort kannst du ihn mit einem Crossfade überdecken, an der Naht eines Loops nicht. Weil an der Naht jetzt Nachbarn liegen, senkt ein Fade dort den Pegel kurz ab; ob du Mraz' kurze Fades brauchst, hörst du in Schleife.

  In REAPER teilst du mit S, schiebst die Hälften und lässt sie überlappen; mit *Auto Crossfade* (Alt+X) entsteht der Crossfade beim Überlappen, im *Crossfade Editor* stellst du Länge und Form ein (S. 145). Der Crossfade verkürzt den Loop um seine Länge: Aus 24 Sekunden mit 2 Sekunden Crossfade werden 22. Zum Abhören legst du eine Region genau über den Loop und spielst sie mit *Repeat* (R) in Schleife; der Region/Marker Manager kann eine Region beim Auswählen durchspielen und wiederholen (S. 46, S. 181). Gerendert wird ohne Tail, sonst hängt REAPER Zeit an. Liegt ein Hall auf dem Bett, braucht der Anfang des Loops die Fahne vom Ende; dafür gibt es *2nd pass render*, das den Bereich vor dem Rendern einmal abspielt (S. 415). Ausführlich steht das in [Eigenes Stück aufbereiten](/sound/loops-stems).

  In Godot stellst du im Import-Dock *Loop Mode* auf *Forward* und lässt *Loop End* auf −1, das Ende der Datei ([Edit > Loop Mode](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#edit-loop-mode)). Gemessen in 4.7.2: Der Übergang im Spiel ist so glatt wie in der Datei, bis auf ein ausgelassenes Sample (Details im Kasten). Ein Klick in der Datei bleibt ein Klick.

  > [!DEEP] Was Godot 4.7.2 an der Naht tut
  > Eine WAV mit 44 100 Samples, importiert mit *Forward* und Loop-Ende −1, hatte danach `loop_end` 44 099. Offline über `mix_audio()` gemischt, wiederholte Godot ab dem zweiten Durchlauf die Samples 1 bis 44 099; Sample 0 kam nur beim ersten Mal. Bei einem Sinus mit ganzen Perioden war der Schritt an der Naht deshalb 0,063 statt 0,031 wie im Inneren, ein ausgelassenes Sample. Setzt du `loop_end` per Code auf die Anzahl der Samples, also eins zu hoch, entstand an der Naht ein einzelner falscher Wert von 0,418 statt nahe 0, ein Klick. Lass das Loop-Ende im Import-Dock auf −1.

  Wie oft hört man den Loop? Bei 22 Sekunden Länge 2,7-mal pro Minute. Auffällige Stellen im Bett hört der Spieler also alle 22 Sekunden. Dagegen helfen ein längerer Loop, ein gleichmäßigeres Bett und Spot-Klänge, die das Ohr beschäftigen.

  ## Eigenes Material umbauen

  Aus wenigen Aufnahmen wird mehr Material, wenn du sie umformst. Alles hier sind Bordmittel:

  - **Abspielrate ohne Tonhöhenerhalt.** In den *Media Item Properties* (F2) setzt du *Playback rate* und schaltest *Preserve pitch* aus, oder du ziehst mit Alt an der Kante des Items (S. 134, S. 195). Tonhöhe und Länge ändern sich zusammen, wie bei einer Bandmaschine: halbe Rate, eine Oktave tiefer, doppelt so lang.
  - **Tonhöhe und Länge getrennt.** *Pitch adjust* in Halbtönen, mit wählbarem Algorithmus: élastique Pro, Efficient oder Soloist, Rubber Band, SoundTouch für Dehnungen bis zum 1000-Fachen und Rrreeeaaa, laut Guide „useful if you want big stretches that do not preserve transients“ ([S. 193](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=193)). Welcher Modus zu deinem Material passt, hörst du.
  - **Reverse.** Die Item-Eigenschaften haben eine Option zum Umkehren, *Reverse items as new take* legt die umgekehrte Fassung als neuen Take daneben und lässt das Original stehen (S. 135, S. 166).
  - **Faltung mit eigener Impulsantwort.** ReaVerb ist ein Faltungshall: Er nutzt die Impulsantwort eines Raums, also die Aufnahme eines kurzen Signals in diesem Raum ([S. 331](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=331)). Mit *Add → File* lädst du eine Datei als Impulsantwort, weitere Module normalisieren, kürzen, dehnen oder kehren sie um (S. 332–333). Deine eigene: ein Klatscher im Raum, mit dem Handy aufgenommen, direkt vor der Transiente geschnitten, bis ins Rauschen ausklingen lassen, Fade am Ende. Ein Klatscher ist kein idealer Impuls, er färbt mit; für ein Spielgeräusch kann genau das gewollt sein. ReaVerb lädt jede Datei als Impulsantwort; auch ein Schlag auf Metall ergibt so einen „Raum“, wenn auch keinen, den es gibt.

  Für extreme Dehnungen gibt es PaulXStretch. Laut README läuft es unter Linux nur als eigenständiges Programm, das du selbst baust; als Plugin gibt es es für macOS, Windows und iOS ([PaulXStretch](https://github.com/essej/paulxstretch)). Emergence ist unter Linux ungeprüft. Die Bordmittel Rrreeeaaa und SoundTouch decken den Pflichtteil ab. Fremdes Material behält nach dem Umbau seine Lizenz; das hältst du in der Quellenliste fest ([Quellen und Lizenzen](/sound/quellen-lizenzen)).

  > [!INTERVIEW]
  > „Wie baust du eine Ambience, die nach zwanzig Minuten nicht nervt?“ Gute Antwort, etwa als Sound Designer: Ich trenne Bett und Spot-Klänge. Aus dem Bett schneide ich alles Auffällige heraus, mache es mit getauschten Hälften und Crossfade nahtlos und halte es lang genug für die Verweildauer am Ort. Die herausgeschnittenen Stücke werden Spot-Klänge mit Varianten, die die Engine in zufälligen Pausen an wechselnden Orten spielt, erst nach dem Ende des vorigen. Dann höre ich im Spiel so lange zu, wie ein Spieler dort bleibt, und notiere, wann mir etwas zum ersten Mal auffällt.

  ## Häufige Fehler

  - **Ein auffälliges Ereignis im Bett.** Es verrät den Loop bei jedem Durchlauf.
  - **Loop ohne getauschte Hälften.** An der Naht klickt es.
  - **Tail beim Rendern eines Loops.** Die Datei wird länger als der Loop, im Spiel setzt das Bett kurz aus.
  - **Loop-Ende per Code auf die Anzahl der Samples.** Godot liest einen Wert zu weit; im Import-Dock bleibt es bei −1.
  - **Pause ab dem Start des Spot-Klangs.** Längere Klänge werden vom nächsten abgeschnitten.
  - **Movie Maker headless oder mit Strg+C beendet.** Absturz oder eine AVI ohne Dauer.
  - **PNG-Folge in den Projektordner geschrieben.** Der Editor importiert jede einzelne Datei.
  - **Foley zum Bild für Ereignisse, die die Engine auslöst.** Dort brauchst du Varianten, keine Darbietung.
  - **Umgebautes fremdes Material ohne Lizenzvermerk.** Die Lizenz gilt weiter.

  ## Zusammenfassung

  - Foley für Ereignisse sind Varianten, Foley für feste Abläufe entsteht zum Bild.
  - Movie Maker nimmt einen Clip mit fester Bildrate auf; in REAPER Videofenster, 60 Frames pro Sekunde, Zeitleiste in Frames. Ob das Videofenster unter CachyOS läuft, ist ungeprüft; ohne Video trägt eine PNG-Folge mit WAV.
  - Eine Atmo ist ein gleichmäßiges Bett und Spot-Klänge; Auffälliges aus dem Bett wird Spot-Klang.
  - Spot-Klänge spielt die Engine zufällig nach Pause und Ort, die Pause beginnt nach `finished`.
  - Nahtlos: Hälften tauschen, Crossfade in der Mitte, Region ohne Tail; der Crossfade kürzt den Loop.
  - Godot 4.7.2 übernimmt den Übergang der Datei, bis auf ein ausgelassenes Sample, wenn das Loop-Ende im Import-Dock auf −1 steht.
  - Umbauen mit Bordmitteln: Abspielrate, Pitch-Modi, Reverse, ReaVerb mit eigener Impulsantwort.
exercises:
  - id: bett-oder-spot
    type: choice
    title: Was gehört ins Bett?
    prompt: |
      Du baust die Atmo eines Ortes aus einer zehnminütigen Aufnahme. Welche Teile gehören als Spot-Klänge in die Engine statt ins Bett?
    options:
      - text: Ein einzelner, gut erkennbarer Ruf, der einmal in der Aufnahme vorkommt
        correct: true
        why: Im Bett käme er bei jedem Durchlauf an derselben Stelle. Als Spot-Klang kommt er zufällig und an wechselnden Orten.
      - text: Ein knackender Ast, der deutlich lauter ist als alles um ihn herum
        correct: true
        why: Was heraussticht, verrät den Loop. Aus dem Bett schneiden und als Spot-Klang mit Varianten verwenden.
      - text: Ein gleichmäßiges Rauschen aus Wind und fernen Blättern
        correct: false
        why: Das ist das Bett. Es soll gleichmäßig sein, damit die Naht und die Wiederholung nicht auffallen.
      - text: Der Grundton eines Raumes ohne erkennbare Ereignisse
        correct: false
        why: Auch das ist Bett, im Grunde ein Room Tone. Er füllt die Stille und trägt keine Information, die man wiedererkennt.
    explanation: |
      Die Trennung folgt einer Frage: Würde man es beim dritten Durchlauf wiedererkennen? Alles Erkennbare macht einen Loop hörbar und gehört deshalb in die Engine, die es zufällig verteilt. Das Bett bleibt gleichmäßig. Welche Klänge dein Ort hat, entscheidest du; die Trennung bleibt dieselbe.
    resources:
      - title: Ronny Mraz · How to create an audio soundscape for video games (Splice)
        url: https://splice.com/blog/audio-soundscape-for-video-games/

  - id: loop-ordnen
    type: order
    title: Ein Bett nahtlos machen
    prompt: |
      Bring die Schritte in die richtige Reihenfolge.
    lang: prose
    lines: |
      Auffällige Einzelgeräusche aus der Aufnahme schneiden und für Spot-Klänge aufheben.
      Die Aufnahme an einer ruhigen Stelle etwa in der Mitte teilen.
      Die Hälften tauschen, die zweite kommt nach vorn.
      Die Hälften am neuen Stoß überlappen lassen und mit einem Crossfade verbinden.
      Eine Region genau über den Loop legen und in Schleife auf Klicks und Pegellöcher abhören.
      Ohne Tail rendern und in Godot mit Loop-Modus Forward importieren.
    explanation: |
      Erst kommt heraus, was den Loop verraten würde, dann wird getauscht. Nach dem Tausch liegen an Anfang und Ende der Datei zwei Stellen, die in der Aufnahme nebeneinanderlagen; der alte Stoß sitzt in der Mitte und bekommt den Crossfade. Abhören in Schleife zeigt, ob es noch klickt, bevor du renderst. Ohne Tail bleibt die Datei so lang wie der Loop.
    resources:
      - title: REAPER User Guide 7.81 · Crossfades (S. 145)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=145

  - id: loop-laenge
    type: output
    title: Wie lang wird der Loop?
    prompt: |
      Eine Aufnahme von 24 Sekunden wird mit getauschten Hälften und 2 Sekunden Crossfade zum Loop. Was gibt das Programm aus?
    lang: python
    code: |
      laenge = 24.0   # Sekunden Aufnahme, Platzhalter
      xfade = 2.0     # Sekunden Crossfade am Stoß
      loop = laenge - xfade
      print(loop)
      print(round(loop * 48000))
      print(round(60 / loop, 2))
    expected: |
      22.0
      1056000
      2.73
    explanation: |
      Im Crossfade liegen beide Hälften übereinander, also wird der Loop um die Länge des Crossfades kürzer: 22 Sekunden, bei 48 kHz 1 056 000 Samples. Pro Minute läuft er 2,73-mal durch. Ein auffälliges Ereignis im Bett hört der Spieler damit alle 22 Sekunden. Die Länge der Region in REAPER sollte genau diese Zahl zeigen.
    resources:
      - title: Ronny Mraz · How to create an audio soundscape for video games (Splice)
        url: https://splice.com/blog/audio-soundscape-for-video-games/

  - id: spots-pro-minute
    type: output
    title: Wie oft kommt ein Spot-Klang?
    prompt: |
      Pausen gleichverteilt zwischen 4 und 12 Sekunden, Spot-Klänge im Mittel 1,5 Sekunden lang (Platzhalter). Die letzte Zeile rechnet die fehlerhafte Fassung, die die Pause schon beim Start des Klangs beginnt. Was gibt das Programm aus?
    lang: python
    code: |
      min_pause, max_pause = 4.0, 12.0
      laenge = 1.5
      abstand = (min_pause + max_pause) / 2 + laenge
      print(abstand)
      print(round(60 / abstand, 1))
      print(round(60 / ((min_pause + max_pause) / 2), 1))
    expected: |
      9.5
      6.3
      7.5
    explanation: |
      Beginnt die Pause erst nach `finished`, liegen zwischen zwei Starts im Mittel 8 Sekunden Pause plus 1,5 Sekunden Klang, etwa 6,3 Spot-Klänge pro Minute. Die fehlerhafte Fassung zählt die Pause ab dem Start; dann kommen 7,5 pro Minute, und jeder Klang, der länger ist als die nächste Pause, wird abgeschnitten. In der Messung mit 2-Sekunden-Klängen und Pausen von 1 bis 3 Sekunden waren das 6 Abbrüche in 40 Sekunden.
    resources:
      - title: Godot Docs · AudioStreamPlayer2D, Signal finished
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer2d.html#class-audiostreamplayer2d-signal-finished

  - id: abspielrate
    type: output
    title: Halbe Rate, wie tief?
    prompt: |
      Abspielrate ohne Tonhöhenerhalt, wie *Playback rate* in REAPER mit *Preserve pitch* aus oder `pitch_scale` in Godot: Was gibt das Programm aus?
    lang: python
    code: |
      import math

      for rate in (0.5, 1.06, 2.0):
          halbtoene = 12 * math.log2(rate)
          print(rate, round(halbtoene, 2), "Halbtöne, Länge mal", round(1 / rate, 2))
    expected: |
      0.5 -12.0 Halbtöne, Länge mal 2.0
      1.06 1.01 Halbtöne, Länge mal 0.94
      2.0 12.0 Halbtöne, Länge mal 0.5
    explanation: |
      Ohne Tonhöhenerhalt hängen Tonhöhe und Länge zusammen: Die halbe Rate klingt eine Oktave tiefer und dauert doppelt so lang, die doppelte eine Oktave höher bei halber Länge. 1,06 ist etwa ein Halbton höher und macht den Klang um 6 % kürzer. In Godot gilt dasselbe: `pitch_scale` ändert laut Doku „pitch and tempo“, und auch die zufällige Tonhöhe eines `AudioStreamRandomizer` ist ein solcher Faktor. Eine Fahne, die gerade in ein Zeitfenster passt, wird mit tieferer Zufallstonhöhe länger. In REAPER schaltest du *Preserve pitch* ein oder nimmst *Pitch adjust* mit einem der Algorithmen, wenn du nur eins von beiden ändern willst.
    resources:
      - title: REAPER User Guide 7.81 · Pitch and Time Manipulation (S. 193)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=193
      - title: Godot Docs · AudioStreamPlayer.pitch_scale
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamplayer.html#class-audiostreamplayer-property-pitch-scale

