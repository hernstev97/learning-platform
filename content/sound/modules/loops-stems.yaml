id: loops-stems
title: "Eigenes Stück aufbereiten: Loops, Hallfahnen, Stems, Übergangsstücke"
level: 2
minutes: 150
summary: Wie du ein eigenes Stück in REAPER so renderst, dass Godot es nahtlos schleift und schaltet – Raster und Länge in Samples, Prüfloop aus Metronom-Klicks, Hallfahne im 2nd pass render, gleich lange Stems, Übergangsstücke und Stinger als eigene Dateien und Import-Werte, die zum Export passen.
place: pc
goals:
  - Du legst in REAPER Tempo, Taktart und Regionen auf Taktgrenzen fest und rechnest die Länge eines Loops in Samples vorher aus.
  - Du prüfst Loop-Länge und Naht mit einem Prüfloop aus Metronom-Klicks, in REAPER und in Godot.
  - Du bringst die Hallfahne mit dem 2nd pass render an den Anfang des Loops und erklärst mit Messungen aus Godot 4.7.2, warum eine Fahne hinter dem Loop-Ende nicht hilft.
  - Du renderst Stems mit gleichem Start, gleicher Länge und einer Normalisierung, die ihr Verhältnis hält, sowie Übergangsstücke und Stinger als eigene Dateien.
  - Du trägst `loop`, `loop_offset`, `bpm`, `beat_count` und `bar_beats` beim Ogg-Import so ein, dass sie zum Export passen.
