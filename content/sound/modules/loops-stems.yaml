lesson: |
  Du renderst dein Stück als Datei, ziehst sie nach Godot und schaltest Loop an. Am Loop-Punkt reißt der Hall ab, die Eins kommt einen Schlag zu spät, und die zweite Schicht läuft nach drei Durchläufen hörbar neben der ersten. In REAPER klang alles richtig.

  Rendern, Stems und Hallfahnen kennst du aus der Produktion. Im Spiel kommt hinzu: Die Datei muss so lang sein wie ihr Raster, auf das Sample genau. Die Hallfahne gehört an den Anfang statt ans Ende. Alle Schichten müssen gleich lang sein und gleich anfangen. Und die Engine braucht Tempo und Schläge als Zahlen, sonst kann sie nicht im Takt wechseln. In diesem Modul bereitest du ein eigenes Stück für mindestens zwei Zustände so auf. Was das Stück enthält, welche Zustände es gibt und wie es klingt, entscheidest du; den Plan dafür hast du in [Musik für Zustände](/sound/musik-zustaende) gezeichnet. Tempo, Takte und Dateinamen hier sind Platzhalter. Jeder Schritt geht mit REAPER-Bordmitteln.

  > [!NOTE] Wie hier gemessen wurde
  > Alle Godot-Ergebnisse in diesem Modul stammen aus Godot 4.7.2, headless, aufgenommen mit `AudioEffectRecord` am Master-Bus. Die Messdateien sind Prüfloops aus Klicks (1500 Hz auf Takt 1, sonst 750 Hz), mit ffmpeg als Ogg Vorbis kodiert, nicht mit REAPER. Deine eigenen Exporte prüfst du deshalb selbst mit einem Prüfloop.

  ## Das Raster: Tempo, Taktart und Länge in Samples

  Leg Tempo und Taktart in den Project Settings fest, bevor du schneidest (`Alt+Enter`, [User Guide S. 185](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=185)). Dort steht auch die Abtastrate des Projekts (S. 32). Mit Snap auf das Raster (`Alt+S`, S. 141) setzt du für jeden Teil des Stücks eine Zeitauswahl von Taktgrenze zu Taktgrenze und machst mit `Shift+R` eine Region daraus (S. 179). Jede Region wird später eine Datei.

  Wie lang die Datei sein muss, rechnest du vorher aus: Takte mal Schläge pro Takt mal 60 durch Tempo ergibt Sekunden, mal Abtastrate ergibt Samples.

  ```python run
  RATE = 48000   # Abtastrate der Datei (Platzhalter)
  SCHLAEGE = 4   # pro Takt (Platzhalter)
  TAKTE = 8      # Länge des Loops (Platzhalter)

  for bpm in [120, 130, 95]:
      sekunden = TAKTE * SCHLAEGE * 60 / bpm
      samples = sekunden * RATE
      print(f"{bpm} BPM: {sekunden:.4f} s = {samples:.2f} Samples")
  ```

  Nicht jedes Tempo ergibt ganze Samples. Bei 130 BPM sind acht Takte 708923,08 Samples lang; eine Datei kann nur 708923 haben, der Rest fällt weg. Diese Rundung hörst du nicht. Ein Fehler von einem Schlag dagegen sind bei 120 BPM 24000 Samples, und den hörst du sofort. Vergleiche deine Zahl mit der Länge, die REAPER zeigt: in den Item-Eigenschaften (`F2`) auch in Samples (S. 134) und im Fenster nach einem Dry Run mit der Option, die Dateilänge in Samples einzublenden ([S. 416](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=416)).

  Godot mischt standardmäßig mit 44,1 kHz (`audio/driver/mix_rate` ist 44100, gemessen) und rechnet Dateien mit anderer Rate um. Die Loops der Messdateien mit 48 kHz liefen trotzdem genau im Raster. Welche Rate du exportierst, entscheidest du in [Lautheit, Export, Import](/sound/export-im-spiel); für die Rechnung oben zählt die Rate der Datei.

  ## Der Prüfloop: Metronom-Klicks als Messsignal

  Bevor deine Musik ins Spiel geht, schickst du einen **Prüfloop** voraus: ein technisches Signal mit derselben Länge und demselben Raster, an dem du Fehler hörst, statt sie zu vermuten. REAPER liefert ihn mit. `Insert → Click source` legt ein Item an, das den Metronom-Klick als Audio spielt; Tempo und eigene Klickdateien stellst du in seinen Source Properties ein ([S. 377](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=377)). Im Metronom spielt Klang A den ersten Klick jedes Takts und Klang B die übrigen (S. 62). Stell es so ein, dass die Eins hoch und die übrigen Schläge tief klingen, und hör nach dem Rendern nach, ob die gerenderte Datei das auch tut.

  Leg den Click-Source-Track über dieselben Regionen wie die Musik und render ihn als eigene Datei. In Godot hörst du dann, ob nach jedem Durchlauf die Eins wiederkommt. So klangen zwei Prüfloops in Godot 4.7.2, einer mit acht Schlägen und einer mit einem Schlag zu viel (Zeiten in Sekunden, H = hoher Klick, T = tiefer Klick, gekürzt und umbrochen):

  ```text
  loop8.ogg, 8 Schläge, Loop an
  0.000H 0.500T 1.000T 1.500T
  2.000H 2.500T 3.000T 3.500T
  4.000H 4.500T 5.000T 5.500T

  loop9.ogg, 9 Schläge, Loop an
  0.000H 0.500T 1.000T 1.500T
  2.000H 2.500T 3.000T 3.500T
  4.000H 4.500H 5.000T 5.500T
  ```

  Ein Schlag zu viel klingt als zwei hohe Klicks hintereinander. Der neunte Schlag ist die Eins des dritten Takts, danach springt der Loop zurück auf die Eins des ersten. In einer Musikdatei hörst du an derselben Stelle ein Stolpern, das man leicht für ein Timing-Problem der Aufnahme hält.

  ## Hallfahnen: was über das Loop-Ende hinausklingt

  Hall und Delay vom letzten Takt klingen über das Ende der Region hinaus. Schneidest du sie ab, ist der Anfang jeder Wiederholung trocken, während das Ende noch hallt: Der Loop-Punkt springt hörbar. Hängst du die Fahne hinten an die Datei, hilft das im Spiel nicht. Zwei Messungen mit derselben Datei, acht Schläge Klicks und danach eine Sekunde 440-Hz-Ton als Ersatz für die Fahne:

  ```text
  loop8_tail.ogg: 8 Schläge + 1 s Ton

  bpm 120, beat_count 8:
    Eins bei 0, 2, 4, 6, 8, 10 s
    Ton: nie hörbar
    (dieselbe Datei ohne Klick auf
    der Eins: nach 4 s rund 5 ms)

  bpm 0, beat_count 0:
    Eins bei 0, 2, 5, 7, 10 s
    Ton: 4,0–5,0 s und 9,0–10,0 s
  ```

  Mit `bpm` und `beat_count` springt Godot nach `beat_count` Schlägen zurück; die Klassenreferenz sagt dazu, die Datei dürfe länger sein, `beat_count` lege das Ende fürs Schleifen fest ([beat_count](https://docs.godotengine.org/en/stable/classes/class_audiostreamoggvorbis.html#class-audiostreamoggvorbis-property-beat-count)). Was hinter diesem Ende steht, blendet Godot aus. In der Messung war der Ton nach dem Sprung nicht nachzuweisen; in einer Fassung derselben Datei ohne Klick auf der Eins klang er noch rund 5 ms. Die Fahne hörst du also nicht über dem Anfang. Ohne `beat_count` spielt Godot die ganze Datei, und die Fahne verlängert den Loop: Die Eins rutscht nach dem ersten Durchlauf um eine Sekunde. Bei Übergängen zwischen Clips gilt dasselbe Ende: „Clip-Ende“ heißt `beat_count` Schläge, ohne `beat_count` die Dateilänge. Ob ein Loop am Wechselpunkt abbricht oder ausblendet, legt der Fade-Modus fest; beides misst [Musik in Godot](/sound/godot-musik).

  Die Fahne muss deshalb in die Datei, an den Anfang des Loops. Dafür hat REAPER den **2nd pass render**. Laut Guide spielt REAPER den Bereich dabei einmal ab, bevor es rendert, damit Effektfahnen wie Hall angewendet werden ([S. 415](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=415), für Stem-Aktionen S. 426). Für einen Loop heißt das: Wenn der gerenderte Durchlauf beginnt, klingt im Hall noch das Ende des ersten Durchlaufs. Die Region selbst renderst du ohne angehängte Fahne, also mit *Tail* aus. Wo die Option sitzt und für welche Grenzen sie gilt, steht in [REAPER als Werkbank](/sound/reaper-werkbank) (Guide S. 413 und 437).

  Ohne die Option geht es von Hand: Das Material zweimal hintereinander legen, mit Fahne rendern und aus dem Ergebnis den zweiten Durchlauf ausschneiden, auf die Taktgrenzen genau. Das ist dasselbe Prinzip.

  Mit einem Intro in derselben Datei hilft der 2nd pass nicht. Er gilt für den ganzen Render-Bereich, also landet die Fahne vom Loop-Ende über dem Intro statt am Loop-Anfang. Render Intro und Loop dann als zwei Regionen, den Loop im 2nd pass, und verbinde sie in Godot, etwa mit Auto-Advance in `AudioStreamInteractive` wie beim Stinger in [Musik in Godot](/sound/godot-musik). Oder leg die Fahne von Hand unter den Loop-Anfang.

  Prüf das Ergebnis, bevor es nach Godot geht. Zieh die Datei in einen leeren Track und verlängere das Item über mehrere Durchläufe. REAPER-Items sind standardmäßig Loops, und die Kerben im Item zeigen die Loop-Punkte (S. 175). Hörst du am Loop-Punkt einen Klick, liegt dort ein Sprung in der Wellenform. Schneidest du selbst, hilft das Trennen an Nulldurchgängen; der Guide nennt die Option im Dialog Auto trim/split ausdrücklich gegen Klicks (S. 128).

  > [!MERKE]
  > Eine Loop-Fahne gehört an den Anfang des Loops, gerendert im 2nd pass; ein Intro bekommt dafür eine eigene Region. Eine Stinger-Fahne darf ausklingen, denn ein Stinger wiederholt sich nicht.

  ## Stems für vertikale Schichten

  Aus der Produktion kennst du Stems als Teile eines Mixes, die am Ende alle zusammen klingen. Winifred Phillips betont, dass Schichten im Spiel anders gedacht sind: „separate audio files that are not always meant to play simultaneously“ ([Pure Vertical Layering](https://www.gamedeveloper.com/game-platforms/pure-vertical-layering-for-game-music-composers-from-spyder-to-sackboy-gdc-2021-)). Für die Dateien heißt das:

  - **Gleicher Start.** Jeder Stem beginnt auf derselben Eins, auch wenn er dort noch schweigt.
  - **Gleiche Länge,** auf das Sample. Das gilt auch für einen Stem, der nur im letzten Takt spielt.
  - **Gleiche Fahnenbehandlung.** Jeder Stem wird im 2nd pass gerendert, sonst ist der Stem ohne Fahne am Loop-Punkt trocken, sobald er allein läuft.
  - **Gemeinsame Pegel.** Normalisieren nur so, dass das Verhältnis der Stems bleibt.
  - **Jeder Stem trägt allein** oder in jeder Kombination, die dein Diagramm erzeugen kann.

  Welche Quelle im Render-Dialog was liefert, steht im Guide ([S. 417](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=417)). „Stems (selected tracks)“ schreibt für jeden ausgewählten Track eine Datei, nach Track-FX, Fader und Pan, aber ohne die FX des Master-Tracks. „Selected tracks via master“ schickt jeden Track einzeln durch die Master-FX. Liegt auf dem Master ein Kompressor oder Limiter, reagiert er dann auf jeden Stem allein anders als auf den ganzen Mix. Beide Wege haben einen Preis. Welchen du nimmst, entscheidest du, und den Unterschied hörst du, wenn du die Stems zusammen gegen den Master-Mix abspielst. Mit „Add rendered items to new tracks in project“ landen sie dafür direkt im Projekt (S. 415).

  > [!WARNING] Getrennt normalisiert
  > Die Postprocess-Optionen des Render-Dialogs normalisieren „each file separately, to loudest file, or as if files play together“ (S. 414). Getrennt normalisiert, zieht jeder Stem auf denselben Zielwert, und die Balance deines Arrangements ist weg. „to loudest file“ und „as if files play together“ halten das Verhältnis der Dateien; für Items beschreibt der Guide das beim Normalisieren auf S. 141. Für Stems kommt nur eine dieser beiden Optionen in Frage oder gar keine Normalisierung.

  Mehrere Teile mit mehreren Stems renderst du über die **Region Render Matrix** (`File → Region Render Matrix`): Spalten sind Regionen, Zeilen Tracks, und jedes Häkchen wird eine Datei ([S. 419](https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=419)). Im Render-Dialog wählst du dann die Quelle „Region render matrix“ mit den Grenzen „All project regions“. Wildcards wie `$project`, `$region` und `$track` bauen den Dateinamen; der Guide zeigt `$project\$region-$track` als Beispiel (S. 420). Wie Matrix und Wildcards im Einzelnen funktionieren, steht in [REAPER als Werkbank](/sound/reaper-werkbank).

  Was passiert, wenn ein Stem nicht gleich lang ist, zeigt eine Messung mit `AudioStreamSynchronized`, Godots Stream für synchrone Schichten. Stem 0 ist der Prüfloop mit acht Schlägen, Stem 1 eine Datei mit einer Markierung auf Schlag 1 und neun Schlägen Länge:

  ```text
  Stem 1 ein Schlag zu lang, Loop an
  Markierung bei 0.00, 4.50, 9.00 s

  beide mit bpm 120, beat_count 8
  Markierung bei 0, 4, 8, 12 s
  ```

  Jeder Stem schleift für sich. Ist einer länger, wandert er pro Durchlauf um die Differenz weiter. Mit `beat_count` springen beide nach acht Schlägen zurück, der überzählige Schlag fällt weg. Laut Godot-Doku braucht Ogg Vorbis beim Abspielen deutlich mehr Rechenzeit als WAV ([Supported audio formats](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#supported-audio-formats)); jeder Stem ist ein eigener Ogg-Stream, also zählt die Zahl der Schichten.

  ## Übergangsstücke und Stinger als eigene Dateien

  Ein **Übergangsstück** führt von einem Teil zum anderen und hat eine eigene Region. Mach es so lang, wie dein Plan es vorsieht, in ganzen Schlägen oder Takten, und gib ihm dieselben Import-Werte wie den Loops. Sonst bricht das Raster nach dem Übergang. Wie lange Godot es spielt (`beat_count` Schläge) und wie das Ziel danach einsetzt, misst [Musik in Godot](/sound/godot-musik).

  Ein **Stinger** ist ein kurzes Musikstück, das ein Ereignis markiert. Meist liegt er über der laufenden Musik, er kann sie auch kurz ersetzen. Als Datei ist er ein One-Shot ohne Loop. Er beginnt auf seiner ersten Transiente, ohne Stille davor, denn jede Millisekunde Stille ist Verzögerung im Spiel ([Audio zuordnen](/godot/audio)). Seine Fahne klingt aus. Render ihn mit *Tail*, nicht im 2nd pass.

  Gib jeder Datei einen Namen, aus dem Stück, Teil und Schicht hervorgehen. Ein Platzhalter-Schema, dein eigenes legst du selbst fest:

  ```text
  mus_<stück>_<teil>_<schicht>.ogg
  mus_<stück>_<von>-<nach>.ogg
  mus_<stück>_stinger_<nn>.ogg
  mus_<stück>_pruefloop.ogg
  ```

  > [!PRAXIS] Komponieren und Einbauen
  > Komposition und Einbau liegen oft bei verschiedenen Leuten. Für Sackboy: A Big Adventure schrieb Winifred Phillips Musik, darunter ihre Fassung von „Material Girl“. Das Audio-Team des Spiels teilte das Stück beim Einbau nach der Songform in Abschnitte ([Horizontal Resequencing and Dynamic Transitions](https://www.gamedeveloper.com/audio/horizontal-resequencing-and-dynamic-transitions-for-game-music-composers-from-spyder-to-sackboy-gdc-2021-)). Bill Elm beschreibt die Arbeit an Red Dead Redemption so: „with the video game, we're working in five-minute loops“ ([The Guardian, 2010](https://www.theguardian.com/technology/gamesblog/2010/may/26/red-dead-redemption-soundtrack)). Wer Dateien liefert, die jemand anderes einbaut, legt eine **Lieferliste** bei: zu jeder Datei eine Zeile mit Teil, Schicht, Länge in Samples, Tempo, Schlägen, Taktart und Loop ja oder nein. Mit dieser Liste kann ein Audio-Programmierer die Import-Werte eintragen, ohne dich zu fragen, und du prüfst nach dem Einbau Zeile für Zeile.

  ## Ogg Vorbis exportieren und in Godot eintragen

  Für Musik nimmst du in Godot meist Ogg Vorbis, für kurze Effekte WAV ([Audio zuordnen](/godot/audio)). Im Render-Dialog ist OGG Vorbis eines der Ausgabeformate, die Formatoptionen hängen vom Format ab (S. 415). Die Qualität ist ein Platzhalter: Render einmal als WAV und einmal als Ogg und vergleiche beide mit Kopfhörern, bevor du dich festlegst.

  Nach dem Import stehen Tempo und Schläge in Godot auf 0, auch wenn die Datei ein BPM-Tag trägt: Gemessen landet ein Tag `BPM=120` nur in `tags`, `bpm` bleibt 0. Du trägst die Werte im Import-Dock ein; ein Doppelklick auf die Datei öffnet einen Dialog, in dem du den Loop-Punkt mit Vorhör setzt und Tempo und Schläge einträgst ([Import options](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#import-options-ogg-vorbis-and-mp3)). Die Werte landen in der `.import`-Datei neben der Ogg. Renderst du die Datei unter demselben Namen neu, importiert Godot sie automatisch neu und wendet die gespeicherten Einstellungen wieder an ([Automatic reimport](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/import_process.html#automatic-reimport)). Gemessen: Eine Datei mit `beat_count = 12` wurde durch eine kürzere mit acht Schlägen ersetzt, und nach dem Neuimport stand dort weiter `beat_count = 12`. Ändert sich die Länge, änderst du die Werte mit. Die Standardwerte für eine neue Datei, gemessen in 4.7.2:

  | Feld | Standard | Bedeutung |
  | --- | --- | --- |
  | `loop` | `false` | Datei wiederholen |
  | `loop_offset` | `0` | Sprungziel in Sekunden |
  | `bpm` | `0` | Tempo |
  | `beat_count` | `0` | Länge in Schlägen |
  | `bar_beats` | `4` | Schläge pro Takt |

  So sieht der Teil `[params]` aus, nachdem für eine Datei mit einem Takt Intro und zwei Takten Loop bei 120 BPM die Werte eingetragen und neu importiert wurden:

  ```ini title=intro_loop.ogg.import
  [params]

  loop=true
  loop_offset=2.0
  bpm=120.0
  beat_count=12
  bar_beats=4
  ```

  `beat_count` zählt ab dem Anfang der Datei, also mit Intro: drei Takte zu je vier Schlägen. `loop_offset` ist das Ende des Intros in Sekunden. Gemessen spielt das Intro einmal, danach springt Godot nach 6 Sekunden immer wieder auf 2 Sekunden zurück.

  Drei weitere Messungen zeigen, wofür die Felder gebraucht werden. Mit `bpm = 0` greift ein Übergang auf den nächsten Takt in `AudioStreamInteractive` sofort statt auf der Eins, ohne Fehlermeldung. Mit `bpm = 120` und `beat_count = 0` wartet er weiter auf die Eins. Und `bar_beats` legt fest, wo die Eins ist: Eine Anfrage bei 0,6 Sekunden wechselte mit 4 bei 2,0 Sekunden, mit 3 bei 1,5 Sekunden. Die Tutorial-Seite der Doku nennt Bar Beats „the number of bars within a single beat“ und die drei Takt-Felder „currently unused“; die Klassenreferenz („the number of beats within a single bar“) und die Messungen zeigen, dass beides nicht mehr stimmt. `AudioStreamWAV` hat Loop-Punkte in Samples, aber gar keine Felder für Tempo und Schläge (gemessen: `loop_mode`, `loop_begin`, `loop_end`, kein `bpm`). Wie du die Clips zu einer Übergangstabelle verbindest, steht in [Musik in Godot](/sound/godot-musik).

  > [!INTERVIEW]
  > „Wie lieferst du Musik für ein adaptives System?“ Gute Antwort, etwa als Composer oder Technical Sound Designer: Ich lege Tempo und Taktart vorher fest und rendere jeden Teil als Region auf Taktgrenzen, Länge in Samples vorher gerechnet. Loops rendere ich im 2nd pass, damit die Fahne am Anfang liegt, Stinger mit ausklingender Fahne. Stems haben gleichen Start und gleiche Länge und werden nur so normalisiert, dass ihr Verhältnis bleibt. Zu jeder Datei gibt es eine Zeile mit Tempo, Schlägen, Taktart und Loop, denn nach dem Import stehen sie in Godot auf 0. Bevor die Musik eingebaut wird, läuft ein Prüfloop aus Metronom-Klicks mit denselben Werten im Spiel.

  ## Häufige Fehler

  - **Region einen Schlag zu lang.** Im Prüfloop zwei hohe Klicks hintereinander, in der Musik ein Stolpern am Loop-Punkt. Region auf die Taktgrenze setzen, Länge in Samples vergleichen.
  - **Fahne hinten angehängt.** Mit `beat_count` blendet Godot sie in rund 5 ms aus, ohne `beat_count` verlängert sie den Loop. Fahne im 2nd pass an den Anfang.
  - **Stems getrennt normalisiert.** Die Balance im Spiel stimmt nicht mehr mit dem Projekt. „to loudest file“, „as if files play together“ oder gar nicht normalisieren.
  - **Ein Stem kürzer oder länger.** Er wandert pro Durchlauf weiter. Alle Stems einer Region gemeinsam über die Region Render Matrix rendern.
  - **`bpm` nicht eingetragen.** Wechsel auf den nächsten Takt greifen sofort. Import-Werte aus der Lieferliste übernehmen.
  - **`beat_count` ohne Intro gezählt.** Godot zählt ab Dateianfang; der Loop endet zu früh.
  - **Neu gerendert, Länge geändert, Werte alt.** Der Neuimport behält `bpm` und `beat_count`. Lieferliste und Import-Werte zusammen ändern.
  - **Stille vor dem Stinger.** Er kommt später als das Ereignis. Auf die erste Transiente schneiden.

  ## Zusammenfassung

  - Tempo und Taktart stehen fest, bevor du schneidest. Jeder Teil ist eine Region auf Taktgrenzen; ihre Länge in Samples rechnest du vorher aus.
  - Ein Prüfloop aus Metronom-Klicks (`Insert → Click source`, Takt 1 hoch) zeigt Längenfehler als zwei hohe Klicks hintereinander.
  - Loop-Fahnen gehören an den Anfang des Loops, im 2nd pass render; ein Intro bekommt eine eigene Region. Eine Fahne hinter `beat_count` blendet Godot in rund 5 ms aus.
  - Stems haben gleichen Start, gleiche Länge, gleiche Fahnenbehandlung und gemeinsame Pegel; ein längerer Stem wandert pro Durchlauf weiter.
  - Übergangsstücke haben ganze Schläge und dieselben Import-Werte, Stinger beginnen auf der Transiente und klingen aus.
  - Nach dem Import stehen Tempo und Schläge auf 0. `bpm`, `beat_count` (ab Dateianfang), `bar_beats` und `loop_offset` trägst du beim Import ein; ohne `bpm` greifen Takt-Übergänge sofort.
exercises:
  - id: render-quelle
    type: choice
    title: Welche Quelle für die Stems?
    prompt: |
      Du willst für jeden ausgewählten Track eine eigene Datei, mit seinen Track-FX und seinem Fader, aber ohne die FX, die auf dem Master-Track liegen. Welche Quelle wählst du im Render-Dialog?
    options:
      - text: Stems (selected tracks)
        correct: true
        why: Laut Guide eine Datei je ausgewähltem Track, „post FX, post-fader and post-pan“, ohne den Weg über den Master.
      - text: Selected tracks via master
        correct: false
        why: Damit läuft jeder Track einzeln durch die Master-FX und den Master-Fader. Die sollten hier wegbleiben.
      - text: Master mix
        correct: false
        why: Das ist eine einzige Datei mit allem, was über den Master läuft.
      - text: "`File → Consolidate/Export tracks…` statt Render"
        correct: false
        why: Das exportiert die Tracks ohne Track-FX, Fader und Pan. Der Guide empfiehlt es gerade dann, wenn du die Verarbeitung nicht mitnehmen willst.
    explanation: |
      Die Quellen unterscheiden sich darin, welche Verarbeitung in der Datei landet. Für Schichten, deren Summe im Spiel ohne Master-Bearbeitung laufen soll, ist „Stems (selected tracks)“ der direkte Weg. Mit „via master“ bekommt jeder Stem die Master-Kette einzeln, und ein Kompressor dort reagiert auf jeden Stem anders als auf den Mix. Beides kann richtig sein; hör die Stems zusammen gegen den Master-Mix, bevor du dich festlegst.
    resources:
      - title: REAPER User Guide 7.81 · Render to File, Source Options (S. 417)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=417

  - id: vom-projekt-zum-import
    type: order
    title: Vom Projekt bis zum Prüfloop im Spiel
    prompt: |
      Bring die Arbeitsschritte in eine Reihenfolge, in der jeder Schritt auf dem vorigen aufbaut.
    lang: prose
    lines: |
      Tempo und Taktart in den Project Settings festlegen.
      Für jeden Teil eine Region auf Taktgrenzen anlegen und ihre Länge in Samples ausrechnen.
      Einen Click-Source-Track als Prüfloop über dieselben Regionen legen.
      Prüfloop und Stems über die Region Render Matrix im 2nd pass als Ogg rendern.
      In Godot bpm, beat_count, bar_beats und loop für jede Datei eintragen.
      Erst den Prüfloop im Spiel abhören, dann die Musik.
    explanation: |
      Das Raster kommt zuerst, weil Regionen, Klicks und Längen davon abhängen. Der Prüfloop entsteht vor dem Rendern, damit er mit denselben Einstellungen gerendert wird wie die Musik. Die Import-Werte gehören zu jeder Datei, auch zum Prüfloop. Im Spiel hörst du zuerst die Klicks: Stimmen sie, liegt ein Problem in der Musik nicht mehr an Länge oder Raster.
    resources:
      - title: REAPER User Guide 7.81 · Rendering Regions (S. 419)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=419

  - id: loop-samples
    type: output
    title: Wie viele Samples hat der Loop?
    prompt: |
      Ein Loop von acht Takten im 3/4-Takt bei 96 BPM (Platzhalter). Das Programm gibt `beat_count`, die Länge in Sekunden und die Länge in Samples bei 48 und 44,1 kHz aus. Was steht da?
    lang: python
    code: |
      BPM = 96
      SCHLAEGE = 3
      TAKTE = 8

      beat_count = TAKTE * SCHLAEGE
      sekunden = beat_count * 60 / BPM
      print(beat_count)
      print(sekunden)
      for rate in [48000, 44100]:
          print(round(sekunden * rate))
    expected: |
      24
      15.0
      720000
      661500
    hints:
      - Ein Schlag dauert 60 / 96 = 0,625 s.
    explanation: |
      24 Schläge zu je 0,625 s ergeben genau 15 Sekunden, und 15 Sekunden sind bei 48 kHz 720000 Samples, bei 44,1 kHz 661500. Diese Zahl vergleichst du mit der Länge in REAPER, bevor du renderst, und mit dem Ergebnis danach. `beat_count` trägst du so in Godot ein, wie das Programm es ausgibt: Schläge, nicht Takte.
    resources:
      - title: REAPER User Guide 7.81 · Media Item Properties, Länge in Samples (S. 134)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=134

  - id: intro-und-loop
    type: output
    title: Intro, Loop und zwei Zahlen
    prompt: |
      Eine Datei beginnt mit zwei Takten Intro, danach folgen acht Takte Loop, 4/4 bei 128 BPM (Platzhalter). Godot zählt `beat_count` ab dem Anfang der Datei, `loop_offset` ist in Sekunden. Was gibt das Programm aus?
    lang: python
    code: |
      BPM = 128
      SCHLAEGE = 4
      INTRO_TAKTE = 2
      LOOP_TAKTE = 8

      schlag_s = 60 / BPM
      loop_offset = INTRO_TAKTE * SCHLAEGE * schlag_s
      beat_count = (INTRO_TAKTE + LOOP_TAKTE) * SCHLAEGE
      print(loop_offset)
      print(beat_count)
      print(beat_count * schlag_s)
    expected: |
      3.75
      40
      18.75
    hints:
      - Ein Schlag dauert 60 / 128 = 0,46875 s.
    explanation: |
      Das Intro hat acht Schläge, also 3,75 Sekunden; dorthin springt Godot nach jedem Durchlauf zurück. `beat_count` umfasst Intro und Loop, 40 Schläge, und das Ende der Schleife liegt bei 18,75 Sekunden. Wer nur die 32 Schläge des Loops einträgt, lässt den Loop bei 15 Sekunden enden, acht Schläge zu früh. In der Messung mit einem Takt Intro und zwei Takten Loop sprang Godot mit `beat_count = 12` nach 6 Sekunden auf 2 Sekunden zurück.
    resources:
      - title: Godot Docs · AudioStreamOggVorbis · loop_offset
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamoggvorbis.html#class-audiostreamoggvorbis-property-loop-offset

  - id: pruefloop-hoeren
    type: output
    title: Was hörst du im Prüfloop?
    prompt: |
      Ein Prüfloop im 4/4-Takt: hoher Klick (H) auf jeder Eins, sonst tiefer Klick (T). Die Region war einen Schlag zu lang, die Datei hat also neun Schläge. In Godot ist `loop` an, `bpm` und `beat_count` stehen auf 0. Welche 14 Klicks hörst du ab dem Start? Schreib sie in eine Zeile, durch Leerzeichen getrennt.
    lang: text
    code: |
      Schlag in der Datei: 1 2 3 4 5 6 7 8 9
      Klick:               H T T T H T T T H
    expected: |
      H T T T H T T T H H T T T H
    accept:
      - HTTTHTTTHHTTTH
    hints:
      - Nach dem neunten Schlag beginnt die Datei wieder bei Schlag 1.
    explanation: |
      Die Datei spielt ihre neun Schläge, H T T T H T T T H, und beginnt dann von vorn mit H. So entstehen zwei hohe Klicks hintereinander. Die Messung in Godot 4.7.2 zeigte sie bei 4,0 und 4,5 Sekunden. Danach liegt jede Eins einen Schlag neben dem Raster, in dem der Spieler das Stück gehört hat. Mit `beat_count = 8` spränge Godot nach dem achten Schlag zurück, und der überzählige Schlag fiele weg; die richtige Lösung bleibt eine Region auf der Taktgrenze.
    resources:
      - title: REAPER User Guide 7.81 · Automating the Metronome, Click Source (S. 377)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=377

  - id: import-werte
    type: gap
    title: Die Werte für den Import
    prompt: |
      Eine Datei: ein Takt Intro, danach vier Takte Loop, 4/4 bei 100 BPM (Platzhalter). Die Datei endet auf der Taktgrenze. Ergänze die Import-Werte.
    lang: ini
    code: |
      [params]

      loop=⟦true⟧
      loop_offset=⟦2.4⟧
      bpm=⟦100.0⟧
      beat_count=⟦20⟧
      bar_beats=⟦4⟧
    gaps:
      - label: Wiederholen
        hint: Der Loop soll laufen.
      - label: Sprungziel
        hint: Ein Takt bei 100 BPM, in Sekunden.
        accept: ["2.40"]
      - label: Tempo
        hint: Das Projekttempo.
        accept: ["100"]
      - label: Schläge
        hint: Godot zählt ab Dateianfang, Intro eingeschlossen.
      - label: Taktart
        hint: Schläge pro Takt.
    explanation: |
      Ein Schlag dauert bei 100 BPM 0,6 Sekunden, ein Takt 2,4. Dorthin springt Godot zurück. `beat_count` sind fünf Takte zu vier Schlägen, mit Intro, also 20. `bar_beats` ist 4 und muss gesetzt bleiben, denn Wechsel auf den nächsten Takt richten sich danach. Weil die Datei auf der Taktgrenze endet, würde der Loop hier auch ohne `beat_count` richtig springen; für Übergänge in `AudioStreamInteractive` brauchst du die Werte trotzdem.
    resources:
      - title: Godot Docs · Import options (Ogg Vorbis and MP3)
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_audio_samples.html#import-options-ogg-vorbis-and-mp3

  - id: render-blatt
    type: gap
    title: Ein Render-Blatt für Stems
    prompt: |
      Ergänze das Render-Blatt für Loops mit mehreren Stems pro Teil. Die Dateinamen sollen aus Regionsname und Trackname bestehen.
    lang: text
    code: |
      Quelle:      Region render matrix
      Grenzen:     All project regions
      Dateiname:   mus_⟦$region⟧_⟦$track⟧
      2nd pass:    ⟦an⟧
      Normalisieren: ⟦gemeinsam⟧
      Format:      OGG Vorbis
    gaps:
      - label: Regionsname
        hint: Wildcard mit Dollarzeichen.
      - label: Trackname
        hint: Wildcard mit Dollarzeichen.
      - label: 2nd pass render
        hint: Damit die Fahne am Anfang liegt.
        accept: ["An", "ein", "Ein", "ja", "Ja", "on", "On"]
      - label: Normalisieren
        hint: So, dass das Verhältnis der Stems bleibt.
        accept: ["Gemeinsam", "to loudest file", "To loudest file", "as if files play together", "As if files play together", "aus", "Aus", "nein", "Nein", "keine", "Keine"]
    explanation: |
      Mit `$region` und `$track` heißt jede Datei nach ihrem Teil und ihrer Schicht. Der 2nd pass legt die Fahne an den Anfang jeder Region. Normalisieren darfst du nur so, dass das Verhältnis bleibt („to loudest file“ oder „as if files play together“), oder gar nicht, sonst verschiebt sich die Balance. Speichere das Blatt als Preset im Render-Dialog, dann bleiben die Einstellungen bei jedem neuen Render gleich (S. 414).
    resources:
      - title: REAPER User Guide 7.81 · Region Render Matrix und Wildcards (S. 420)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=420

  - id: region-zu-lang
    type: bug
    title: Zwei hohe Klicks hintereinander
    prompt: |
      Projekt bei 120 BPM im 4/4. Im Prüfloop in Godot hörst du bei einem Teil am Loop-Punkt zwei hohe Klicks im Abstand eines Schlags. Die anderen Teile laufen sauber. Finde die Region, die falsch gesetzt ist, und korrigiere ihr Ende. Positionen in REAPER-Schreibweise Takt.Schlag.
    lang: text
    code: |
      Region teil1:     1.1.00 bis  5.1.00
      Region teil2:     5.1.00 bis  9.1.00
      Region teil3:     9.1.00 bis 11.2.00
      Region uebergang: 11.1.00 bis 12.1.00
    lines: [3]
    fix:
      - line: 3
        answers:
          - "Region teil3: 9.1.00 bis 11.1.00"
    hints:
      - Eine Region auf Taktgrenzen endet auf Schlag 1.
    explanation: |
      Die Region teil3 endet auf Schlag 2 von Takt 11 und ist damit zwei Takte und einen Schlag lang. Der neunte Schlag ist die Eins von Takt 11, dann springt der Loop auf die Eins von Takt 9: zwei Einsen hintereinander. Die übrigen Regionen enden auf Schlag 1. Dass die Region uebergang bei 11.1.00 beginnt und mit teil3 überlappt, ist der zweite Hinweis auf dieselbe Ursache.
    resources:
      - title: REAPER User Guide 7.81 · Creating and Using Regions (S. 179)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=179

  - id: normalisiert-getrennt
    type: bug
    title: Die Percussion ist zu laut
    prompt: |
      Im Projekt sitzt die Percussion leise unter Pad und Bass. Im Spiel, mit allen drei Schichten an und gleichen Lautstärken in Godot, ist sie fast so laut wie das Pad. Finde die Einstellung im Render-Blatt, die das verursacht, und korrigiere sie.
    lang: text
    code: |
      Quelle:      Region render matrix
      Grenzen:     All project regions
      Dateiname:   mus_$region_$track
      2nd pass:    an
      Normalisieren: each file separately, -1 dB
      Format:      OGG Vorbis
    lines: [5]
    fix:
      - line: 5
        answers:
          - "Normalisieren: as if files play together, -1 dB"
          - "Normalisieren: aus"
          - "Normalisieren: Aus"
          - "Normalisieren: as if files play together"
          - "Normalisieren: to loudest file, -1 dB"
          - "Normalisieren: to loudest file"
          - "Normalisieren: gemeinsam, -1 dB"
          - "Normalisieren: gemeinsam"
          - "Normalisieren: Gemeinsam, -1 dB"
          - "Normalisieren: Gemeinsam"
    explanation: |
      Getrennt normalisiert zieht jede Datei für sich auf −1 dB. Eine leise Percussion-Schicht wird dabei stärker angehoben als das Pad, und das Verhältnis aus deinem Mix ist weg. Mit „to loudest file“ oder „as if files play together“ bleibt das Verhältnis, oder du normalisierst gar nicht. Im Spiel stellst du die Lautstärken dann an den Schichten ein, nicht in den Dateien.
    resources:
      - title: REAPER User Guide 7.81 · Render to File, Postprocess (S. 414)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=414

  - id: stem-wandert
    type: bug
    title: Eine Schicht läuft davon
    prompt: |
      Drei Stems eines Teils laufen in einem `AudioStreamSynchronized`, Loop an, ohne `beat_count`, 120 BPM, 48 kHz. Nach dem ersten Durchlauf liegt eine Schicht einen Schlag hinter den anderen, nach dem zweiten zwei Schläge. Finde den Stem in der Lieferliste, der die Ursache ist.
    lang: text
    code: |
      Datei                  Samples
      mus_a_teil1_pad.ogg    768000
      mus_a_teil1_bass.ogg   768000
      mus_a_teil1_perc.ogg   792000
    lines: [4]
    hints:
      - Ein Schlag bei 120 BPM dauert 0,5 s.
    explanation: |
      768000 Samples sind bei 48 kHz 16 Sekunden, acht Takte bei 120 BPM. Die Percussion-Datei ist 24000 Samples länger, genau ein Schlag. Jeder Stem schleift für sich, also wandert sie pro Durchlauf um einen Schlag weiter, wie in der Messung mit `AudioStreamSynchronized` (Markierung bei 0, 4,5 und 9 s statt 0, 4 und 8 s). `bpm = 120` mit `beat_count = 32` würde alle drei nach 32 Schlägen zurückspringen lassen; besser ist ein neuer Render über die Region, damit alle Stems dieselbe Länge haben.
    resources:
      - title: Godot Docs · AudioStreamSynchronized
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamsynchronized.html

  - id: fahne-gemessen
    type: explain
    title: Wohin mit der Fahne?
    prompt: |
      Erkläre an diesen zwei Messungen aus Godot 4.7.2, warum eine Hallfahne hinter dem Loop-Ende nicht hilft und was du stattdessen tust. Die Datei hat acht Schläge Klicks und danach eine Sekunde Ton als Ersatz für eine Fahne.
    lang: text
    code: |
      bpm 120, beat_count 8:
        Eins bei 0, 2, 4, 6, 8, 10 s
        Ton: nie hörbar
        (dieselbe Datei ohne Klick auf
        der Eins: nach 4 s rund 5 ms)

      bpm 0, beat_count 0:
        Eins bei 0, 2, 5, 7, 10 s
        Ton: 4,0–5,0 s und 9,0–10,0 s
    points:
      - Mit beat_count springt Godot nach acht Schlägen zurück und blendet den Rest der Datei in wenigen Millisekunden aus; die Fahne liegt nicht über dem Anfang.
      - Ohne beat_count spielt Godot die ganze Datei; die Fahne verlängert den Loop, und die Eins rutscht aus dem Raster.
      - Die Fahne muss deshalb am Anfang der Datei liegen, gerendert im 2nd pass, und die Datei endet auf der Taktgrenze.
      - Ob es nahtlos klingt, prüfst du in REAPER mit einem geloopten Item und in Godot mit einem Prüfloop.
    explanation: |
      Im ersten Lauf kommt die Eins alle zwei Sekunden, der Loop springt also nach acht Schlägen. Der Ton dahinter ist nach dem Sprung nicht zu hören; ohne Klick auf der Eins zeigt die Messung noch rund fünf Millisekunden, dann blendet Godot ihn aus. Eine Fahne an dieser Stelle ginge genauso verloren. Im zweiten Lauf kennt Godot das Raster nicht und spielt bis zum Ende der Datei. Der Ton ist eine ganze Sekunde zu hören, aber die Eins kommt danach erst bei 5 Sekunden statt bei 4, der Loop ist um die Fahne länger geworden. In beiden Fällen ist der Anfang trocken. Deshalb renderst du Loops im 2nd pass, sodass der Hall vom Ende schon am Anfang klingt, und lässt die Datei auf der Taktgrenze enden.
    resources:
      - title: REAPER User Guide 7.81 · 2nd pass render (S. 415)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=415
      - title: Godot Docs · AudioStreamOggVorbis · beat_count
        url: https://docs.godotengine.org/en/stable/classes/class_audiostreamoggvorbis.html#class-audiostreamoggvorbis-property-beat-count

  - id: render-vorlage
    type: practice
    title: Eine Render-Vorlage und eine Lieferliste
    prompt: |
      Leg in REAPER ein Render-Preset für Musik-Loops an und eine Lieferliste als CSV-Datei. Das Preset rendert über die Region Render Matrix im 2nd pass als Ogg Vorbis, mit Dateinamen aus Region und Track und ohne getrennte Normalisierung. Die Lieferliste hat eine Zeile je Datei mit Teil, Schicht, Länge in Samples, Tempo, Schlägen, Taktart, Loop und Loop-Versatz. Trag die Einstellungen des Presets und die Kopfzeile der Liste hier ein. Werte sind Platzhalter.
    lang: text
    starter: |
      Preset-Name:
      Quelle:
      Grenzen:
      Dateiname:
      2nd pass:
      Normalisieren:
      Format und Qualität:

      Lieferliste (Kopfzeile und eine Zeile):
    solution: |
      Preset-Name: musik-loops (Bounds and output + Options and format)
      Quelle: Region render matrix
      Grenzen: All project regions
      Dateiname: mus_$project_$region_$track
      2nd pass: an
      Normalisieren: aus (oder to loudest file / as if files play together)
      Format und Qualität: OGG Vorbis, Qualität = Platzhalter nach Hörvergleich

      Lieferliste:
      datei,teil,schicht,samples,rate,bpm,beat_count,bar_beats,loop,loop_offset
      mus_a_teil1_pad.ogg,teil1,pad,768000,48000,120,32,4,true,0
    checklist:
      - Das Preset ist im Render-Dialog gespeichert und lässt sich laden.
      - Quelle, Grenzen, 2nd pass und Normalisierung stehen so, wie es die Lektion für Loops beschreibt.
      - Der Dateiname enthält Wildcards für Region und Track.
      - Die Lieferliste ist eine Datei mit Kopfzeile und den Spalten Länge in Samples, Tempo, Schläge, Taktart, Loop und Loop-Versatz.
      - Du hast mit einem Testrender geprüft, dass die Dateinamen so herauskommen, wie du sie geplant hast.
    explanation: |
      Ein Preset nimmt dir das Wiederholen ab und verhindert, dass beim fünften Render eine Option anders steht als beim ersten. Der Render-Dialog speichert Presets für Grenzen und Ausgabe, für Optionen und Format oder für alles (S. 414). Die Lieferliste ist der Vertrag mit dem Einbau: Godot übernimmt Tempo und Schläge nicht aus der Datei, also müssen sie irgendwo stehen. Die Musterlösung zeigt die Form, nicht die Werte.
    resources:
      - title: REAPER User Guide 7.81 · Render to File, Presets (S. 414)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=414

  - id: stueck-aufbereiten
    type: practice
    title: Dein Stück für zwei Zustände
    prompt: |
      Bereite ein eigenes Stück für mindestens zwei Zustände aus deinem Diagramm auf: Loops für jeden Zustand, mindestens ein Übergangsstück oder ein Stinger, wenn dein Plan es vorsieht, Stems, wenn du vertikal schichtest. Render zuerst den Prüfloop über dieselben Regionen und hör ihn in Godot ab, dann die Musik. Notiere hier Lieferliste, Prüfergebnis und was du geändert hast. Was das Stück enthält und wie es klingt, entscheidest du.
    lang: prose
    starter: |
      Stück, Tempo, Taktart:

      Regionen (Name, Takte, Samples gerechnet / in REAPER):

      Prüfloop in Godot (Was hörst du am Loop-Punkt?):

      Fahne am Anfang hörbar (ja / nein, wie geprüft):

      Stems (Namen, Samples):

      Import-Werte je Datei:

      Geändert nach dem Test:
    checklist:
      - Für jede Region stehen die gerechnete Länge in Samples und die Länge in REAPER, und sie stimmen überein.
      - Der Prüfloop läuft in Godot mit denselben Import-Werten wie die Musik, und nach jedem Durchlauf kommt genau ein hoher Klick auf der Eins.
      - Du hast an einem geloopten Item in REAPER oder in Godot geprüft, dass am Loop-Punkt kein Klick und kein trockener Anfang zu hören ist.
      - Alle Stems einer Region haben dieselbe Länge in Samples.
      - Für jede Datei stehen bpm, beat_count, bar_beats, loop und loop_offset in der Lieferliste und in der .import-Datei.
      - REAPER-Projekt und Rohmaterial liegen getrennt von den exportierten Ogg-Dateien.
    explanation: |
      Die Checkliste prüft das Handwerk, nicht den Klang: Länge, Naht, Synchronität, Werte. Der Prüfloop zuerst trennt zwei Fehlerquellen. Stimmen die Klicks und es stolpert trotzdem, liegt es an der Musik; stolpern schon die Klicks, an Region oder Import. Ob dein Stück in den Zuständen das sagt, was du willst, prüfst du im Spiel; den Einbau mit Übergangstabelle beschreibt [Musik in Godot](/sound/godot-musik), die Werkstatt [ein kleiner Audioabschnitt](/sound/werkstatt-audioabschnitt).
    resources:
      - title: REAPER User Guide 7.81 · 2nd pass render (S. 415)
        url: https://www.reaper.fm/userguide/ReaperUserGuide781c.pdf#page=415
