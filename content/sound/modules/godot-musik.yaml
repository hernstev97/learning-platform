id: godot-musik
title: "Musik in Godot: AudioStreamInteractive und Synchronized"
level: 3
minutes: 160
summary: Wie du in Godot 4.7 eigene Musik über eine Übergangstabelle zwischen Zuständen wechselst, Schichten ein- und ausblendest und mit Prüfloops misst, wann ein Wechsel zu hören ist, statt es zu vermuten.
place: pc
goals:
  - Du baust eine Übergangstabelle aus Clips, Zeitpunkt, Ziel-Position, Fade-Modus und Übergangsstück und sagst vorher, wann ein Wechsel hörbar wird.
  - Du schaltest über das Playback um, nicht über den Stream, und verhinderst mit einem Nachlauf, dass die Musik flattert oder neu beginnt.
  - Du kennst die gemessenen Abweichungen von der Doku in 4.7.2, etwa die Einblendung nach dem Übergangsstück und `FADE_IN` bei Loops.
  - Du blendest Schichten eines `AudioStreamSynchronized` per Tween ein und aus und weißt, wie sich eine Kurve in dB von einer linearen unterscheidet.
  - Du prüfst Übergänge in der Combat-Testszene mit Log und Mitschnitt und liest die Wechselzeit aus der WAV-Datei ab.
