id: export-im-spiel
title: "Lautheit, Export, Import und Hörtest im Spiel"
level: 3
minutes: 150
summary: Wie du Klänge und Musik nach Lautheit statt nach Spitzenpegel abstimmst, aus REAPER mit Normalisieren und Begrenzen renderst, in Godot über Busse mit Reglern und Ducking mischst und das Ergebnis im Spiel mit Mitschnitt, Messung und Hörprotokoll prüfst.
place: pc
goals:
  - Du unterscheidest integrierte, kurzzeitige und momentane Lautheit und True Peak nach ITU-R BS.1770 und EBU R 128 und misst sie an einer Datei und an einem Mitschnitt aus dem Spiel.
  - Du rechnest den Gain bis zu einem Platzhalter-Ziel und sagst vorher, ob danach ein Limiter greift.
  - Du stellst die Nachbearbeitung im REAPER-Render-Dialog ein und weißt, was ein Neu-Rendern in Godot ändert und was nicht.
  - Du legst Busse mit Reglern an und richtest Ducking mit `AudioEffectCompressor` und `sidechain` so ein, wie es in Godot 4.7.2 gemessen funktioniert.
  - Du führst einen Hörtest im Spiel mit Protokoll auf verschiedenen Geräten und Lautstärken durch.
