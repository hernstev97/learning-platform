projects:
  - id: skizzenbuch-unterwegs
    title: Vier Wochen Skizzenbuch für unterwegs
    level: 1
    hours: 10
    summary: Ein kleines Heft, ein Stift und zehn Minuten im Bus an fünf Tagen pro Woche. Du übst Kontur, Negativraum, Messen, Gesten und Tonwerte nach einem festen Plan und hältst fest, was sich nach vier Wochen verändert hat.
    brief: |
      **Ausgangslage:** Zeichnen lernt man nicht am Wochenende, sondern in vielen kurzen Einheiten. Der Weg zur Arbeit ist dafür gut geeignet: Du sitzt, hast Menschen und Gegenstände vor dir und zehn Minuten Zeit. Dieses Projekt macht daraus einen Plan mit vier Wochenthemen.

      **Anforderungen:**

      - Ein Heft im Format A6 oder A5, ein Bleistift oder Fineliner. Karopapier ist für Woche 4 praktisch, aber keine Pflicht.
      - Fünf Einheiten pro Woche zu je etwa zehn Minuten, jede mit Datum.
      - Woche 1 Kontur und Negativraum, Woche 2 Messen und Grundkörper, Woche 3 Gesten von 30 bis 60 Sekunden, Woche 4 Tonwertstudien mit drei Werten und erste Pixelversuche auf Karopapier.
      - Am Ende jeder Woche zwei Sätze: was leichter fiel als am Anfang und was nicht.

      **Rahmen:** Alles unterwegs, ohne Rechner. Wenn du draußen zeichnest, zeichnest du Gegenstände, Haltungen und Silhouetten, keine erkennbaren Gesichter fremder Menschen ohne deren Einverständnis. Für Gesten zu Hause eignen sich die zeitgesteuerten Referenzen von [Line of Action](https://line-of-action.com/). Grundlage sind [Beobachten, Messen und Referenzen](/pixelart/beobachten), [Grundkörper, Perspektive und Draufsicht](/pixelart/grundkoerper-raum), [Figur, Geste und Proportion](/pixelart/figur-proportion) und [Licht, Schatten und Tonwerte](/pixelart/licht-werte).
    skills: [beobachten, negativraum, messen, gesten, tonwerte, routine]
    steps:
      - id: heft-einrichten
        title: Heft und Plan einrichten
        detail: |
          Schreib die vier Wochenthemen auf die erste Seite und nummeriere die nächsten Seiten. Zeichne auf Seite 1 aus dem Gedächtnis eine Tasse, einen Stuhl und eine stehende Person. Diese Seite ist dein Vergleich für Woche 4.
      - id: woche-kontur
        title: "Woche 1: Kontur und Negativraum"
        detail: |
          Zeichne an jedem Tag einen Gegenstand mit Lücken: Stuhl, Fahrradständer, Henkeltasse, Haltestange mit Hand. Zeichne zuerst nur die Lücken, dann den Gegenstand. Wie das geht, steht in [Beobachten](/pixelart/beobachten).
      - id: woche-messen
        title: "Woche 2: Messen und Grundkörper"
        detail: |
          Miss mit ausgestrecktem Arm Verhältnisse ab, etwa Breite zu Höhe einer Tasche, und notiere die Zahl neben die Zeichnung. Baue danach Gegenstände aus Würfel, Zylinder und Kugel auf.
      - id: woche-gesten
        title: "Woche 3: Gesten"
        detail: |
          Zeichne Haltungen in 30 bis 60 Sekunden, zuerst nur die Handlungslinie, dann die Gliederpuppe darüber. Mindestens acht Gesten pro Einheit.
      - id: woche-werte
        title: "Woche 4: Tonwerte und Karopapier"
        detail: |
          Zeichne Gegenstände in drei Tonwerten: Papierweiß, Schraffur, ausgefüllt. An zwei Tagen setzt du einen der Gegenstände als 16 × 16 Kästchen auf Karopapier um.
      - id: rueckblick
        title: Rückblick
        detail: |
          Zeichne Tasse, Stuhl und Person von Seite 1 noch einmal aus dem Gedächtnis und einmal nach Beobachtung. Leg die drei Fassungen nebeneinander und notiere in höchstens fünf Sätzen, was sich verändert hat.
    acceptance:
      - id: einheiten
        text: Mindestens 16 datierte Einheiten über vier Wochen, jede einem Wochenthema zugeordnet.
      - id: wochensaetze
        text: Am Ende jeder Woche stehen zwei Sätze, was leichter fiel und was nicht.
      - id: messzahlen
        text: In Woche 2 stehen neben mindestens fünf Zeichnungen gemessene Verhältnisse als Zahl.
      - id: vergleich
        text: Die Gedächtniszeichnungen von Seite 1 und die drei Fassungen aus dem Rückblick liegen nebeneinander, mit schriftlichem Vergleich.
    stretch:
      - Eine fünfte Woche nur mit Silhouetten von Gegenständen und Haltungen, schwarz ausgefüllt.
      - Dieselbe Haltestelle an drei Tagen zu verschiedenen Uhrzeiten in drei Tonwerten zeichnen und das Licht vergleichen.
    portfolio: |
      Ein Skizzenbuch zeigt keine fertige Arbeit, sondern dass du regelmäßig übst und beobachtest. Zeig zwei Doppelseiten, eine vom Anfang und eine vom Ende, und den Rückblick. Im Gespräch zählt, was du über dein eigenes Lernen sagen kannst: welche Übung am meisten gebracht hat und warum.

  - id: gegenstand-drei-groessen
    title: Ein Gegenstand in drei Größen
    level: 2
    hours: 8
    summary: Am PC zeichnest du einen selbst gewählten Gegenstand – eine Laterne, eine Truhe, eine Pflanze – in 16, 32 und 48 Pixeln mit derselben Palette und Lichtrichtung und dokumentierst, was du bei jeder Verkleinerung behältst und was wegfällt.
    brief: |
      **Ausgangslage:** Wie viel Detail ein Gegenstand trägt, hängt an seiner Größe in Pixeln. Wer dasselbe Motiv in drei Größen zeichnet, lernt schneller als mit drei verschiedenen Motiven, weil er jede Entscheidung vergleichen kann.

      **Anforderungen:**

      - Ein Gegenstand deiner Wahl, beobachtet an einem echten Vorbild oder an Fotos, die du selbst gemacht hast. Keine Vorlage zum Abpausen, keine generierten Bilder.
      - Drei Fassungen auf Leinwänden von 16 × 16, 32 × 32 und 48 × 48 Pixeln, jede neu gezeichnet, nicht skaliert.
      - Eine gemeinsame Palette mit höchstens 12 Farben und eine feste Lichtrichtung.
      - Eine kurze Notiz je Größe: Was ist geblieben, was ist weggefallen, und warum.

      **Rahmen:** Ein Pixel-Editor deiner Wahl, etwa Pixelorama, LibreSprite oder Aseprite. Grundlage sind [Linien, Kurven und Cluster](/pixelart/linien-cluster), [Farbe, Rampen und begrenzte Paletten](/pixelart/farbe-paletten) und [Schattieren, Dithering, Textur und Detailgrad](/pixelart/schattieren-textur).
    skills: [reduktion, detailgrad, palette, schattieren, cluster]
    steps:
      - id: vorbild-beobachten
        title: Vorbild beobachten
        detail: |
          Zeichne den Gegenstand zuerst auf Papier aus zwei Blickwinkeln und markiere die drei Merkmale, an denen man ihn erkennt. Diese Merkmale müssen in der kleinsten Fassung noch lesbar sein.
      - id: palette-festlegen
        title: Palette und Licht festlegen
        detail: |
          Leg eine Palette mit höchstens 12 Farben in Rampen an und schalte den Editor in den Indexed-Modus. Markiere die Lichtrichtung mit einem Pfeil in einer eigenen Ebene.
      - id: gross-zeichnen
        title: 48 Pixel zuerst
        detail: |
          Zeichne die größte Fassung: Silhouette, dann Tonwerte, dann Farbe, dann Linien aufräumen. Prüf bei 1×.
      - id: mittel-zeichnen
        title: 32 Pixel neu zeichnen
        detail: |
          Zeichne die mittlere Fassung neu und schau dabei auf die große. Notiere jedes Detail, das du weglässt oder vereinfachst.
      - id: klein-zeichnen
        title: 16 Pixel neu zeichnen
        detail: |
          Die kleinste Fassung trägt nur noch Silhouette, zwei oder drei Tonwerte und die wichtigsten Merkmale. Prüf, ob die drei Merkmale aus dem ersten Schritt noch erkennbar sind.
      - id: vergleichen
        title: Nebeneinander prüfen
        detail: |
          Leg alle drei Fassungen in einer Datei nebeneinander, bei 1× und ganzzahlig vergrößert. Mach die Graustufen- und Silhouettenprobe und schreib die Notizen fertig.
    acceptance:
      - id: drei-leinwaende
        text: Drei Fassungen auf 16 × 16, 32 × 32 und 48 × 48 Pixeln, jede neu gezeichnet; keine ist aus einer anderen skaliert.
      - id: palette-geprueft
        text: Alle drei nutzen dieselbe Palette mit höchstens 12 Farben, geprüft im Indexed-Modus.
      - id: licht-gleich
        text: Die Lichtrichtung ist in allen drei Fassungen dieselbe und in der Datei markiert.
      - id: notizen
        text: Zu jeder Größe gibt es eine Notiz, was geblieben und was weggefallen ist, mit Grund.
      - id: eigenes-vorbild
        text: Das Vorbild ist ein echter Gegenstand oder ein eigenes Foto; keine Vorlage wurde abgepaust oder generiert.
    stretch:
      - Eine vierte Fassung in 8 × 8 Pixeln und die Frage, ab welcher Größe der Gegenstand nicht mehr erkennbar ist.
      - Dieselbe Reihe mit einer Palette von nur 4 Farben.
    portfolio: |
      Drei Größen nebeneinander zeigen, dass du Detail bewusst einsetzt. Zeig die Reihe bei 1× und vergrößert und daneben deine Notizen. Im Gespräch fragt man dich, welches Detail dir am schwersten wegzulassen fiel und woran du gemerkt hast, dass die 16-Pixel-Fassung trägt.

  - id: figur-vier-richtungen
    title: Eine eigene Figur in vier Richtungen
    level: 2
    hours: 16
    summary: Von Thumbnails über eine Gliederpuppe zum Sprite – du entwirfst eine eigene Figur, zeichnest sie als Standbild in vier Richtungen auf einem Modellblatt und prüfst sie mit Silhouetten- und Graustufenprobe.
    brief: |
      **Ausgangslage:** Eine Figur für ein Top-down-Spiel muss von vorn, hinten und der Seite gleich wirken und bei 1× lesbar sein. Dieses Projekt führt dich von den ersten Silhouetten bis zu einem Modellblatt mit vier Richtungen. Bewegung kommt später im Animationskurs.

      **Anforderungen:**

      - Mindestens zwölf Thumbnails als schwarze Silhouetten, aus denen du eine auswählst.
      - Eine Skizze der Figur als Gliederpuppe mit festgelegter Kopfzahl.
      - Ein Sprite in einer Größe deiner Wahl zwischen 16 und 32 Pixeln Höhe, in vier Richtungen: vorn, hinten, links, rechts. Die Seiten dürfen gespiegelt sein, Asymmetrien beachtest du.
      - Ein Modellblatt mit Hilfslinien für Kopf, Hüfte und Füße, die in allen Ansichten auf denselben Zeilen liegen.
      - Eine Palette und eine kurze Begründung der Lesehierarchie: Was soll man zuerst erkennen?

      **Rahmen:** Thumbnails und Skizze auf Papier oder am Handy, Sprite im Editor. Die Figur entwirfst du selbst; Referenzen für Haltung oder Kleidung notierst du mit Quelle. Grundlage sind [Silhouette und Formensprache](/pixelart/silhouette-formsprache), [Figur, Geste und Proportion](/pixelart/figur-proportion), [Vom Entwurf zum Sprite](/pixelart/sprite-entwerfen) und [Ansichten, Maßstab und große Kreaturen](/pixelart/ansichten-massstab).
    skills: [silhouette, thumbnails, proportion, sprite, ansichten, modellblatt, palette]
    steps:
      - id: thumbnails
        title: Zwölf Thumbnails
        detail: |
          Zeichne mindestens zwölf kleine schwarze Silhouetten in höchstens zwei Minuten pro Stück. Variiere Grundformen und Proportionen, nicht Details. Wähl eine aus und notiere, warum.
      - id: gliederpuppe
        title: Gliederpuppe und Kopfzahl
        detail: |
          Leg die Kopfzahl fest und zeichne die Figur als Gliederpuppe von vorn und von der Seite. Markiere Kopf, Hüfte und Füße als Hilfslinien.
      - id: groesse-waehlen
        title: Spritegröße wählen
        detail: |
          Wähl die Höhe in Pixeln passend zu deiner Tile-Größe und rechne aus, wie viele Pixel Kopf und Rumpf bekommen. Trag das in eine Maßstabstabelle ein.
      - id: vorderansicht
        title: Vorderansicht
        detail: |
          Zeichne die Vorderansicht in den Schritten Silhouette, Tonwerte, Farbe und Feinschliff, jeden Schritt in einer eigenen Ebene. Prüf bei 1×.
      - id: weitere-ansichten
        title: Rückansicht und Seiten
        detail: |
          Übertrage die Hilfslinien und zeichne Rückansicht und eine Seite. Spiegel die Seite und korrigiere, was nicht symmetrisch ist, etwa einen Gegenstand in einer Hand.
      - id: proben
        title: Proben
        detail: |
          Mach für alle vier Ansichten die Silhouetten- und die Graustufenprobe. Notiere, was du danach geändert hast.
      - id: modellblatt
        title: Modellblatt zusammenstellen
        detail: |
          Stell alle Ansichten nebeneinander mit Hilfslinien, Palette, Maßstabstabelle und der Begründung der Lesehierarchie.
    acceptance:
      - id: thumbnails-belegt
        text: Mindestens zwölf Thumbnails liegen vor, die gewählte ist markiert und begründet.
      - id: vier-ansichten
        text: Das Sprite liegt in vier Richtungen vor, alle in derselben Höhe in Pixeln.
      - id: linien-durchgehend
        text: Kopf, Hüfte und Füße liegen in allen Ansichten auf denselben Pixelzeilen; die Hilfslinien sind auf dem Modellblatt eingezeichnet.
      - id: proben-dokumentiert
        text: Silhouetten- und Graustufenprobe sind für alle Ansichten gemacht und die Änderungen danach notiert.
      - id: eigene-figur
        text: Die Figur ist dein eigener Entwurf; verwendete Referenzen stehen mit Quelle auf dem Modellblatt.
    stretch:
      - Vier diagonale Richtungen ergänzen.
      - Dieselbe Figur in zwei Größen zeichnen und vergleichen, was bei der kleineren wegfällt.
    portfolio: |
      Ein Modellblatt ist ein Standardstück im Portfolio von Character Artists. Zeig Thumbnails, Gliederpuppe und das fertige Blatt nebeneinander, damit man den Weg sieht. Im Gespräch fragt man, warum du gerade diese Silhouette gewählt hast und wie du sicherstellst, dass die Figur in allen Ansichten gleich groß wirkt.

  - id: abschluss-asset-set
    title: Asset-Set für eine Begegnung
    capstone: true
    level: 3
    hours: 40
    summary: Ein kleines Studio schickt dir einen Art-Test. Du entwirfst ein zusammenpassendes Asset-Set für eine Top-down-Begegnung – Spielfigur in vier Richtungen, Gegner, große Kreatur, Tiles und Requisiten mit gemeinsamer Palette –, prüfst es im Mockup, überarbeitest es in dokumentierten Runden und begründest jede Entscheidung.
    brief: |
      ## Auftrag

      Mara Okafor ist Art Lead eines Indie-Studios mit fünf Leuten in Köln. Das Studio entwickelt ein Actionspiel in der Draufsicht mit Pixelart und großen Kreaturen als Bossen. Für die Stelle „Pixel Artist (m/w/d)“ schickt sie dir einen Art-Test. Ihre Lage:

      - Bisherige Assets stammen von drei verschiedenen Leuten und passen nicht zusammen: verschiedene Pixeldichten, Paletten und Lichtrichtungen.
      - In Playtests finden Spieler ihre Figur auf manchen Böden nicht, und Gefahren gehen im Hintergrund unter.
      - Niemand hat aufgeschrieben, warum etwas so aussieht. Jede neue Grafik beginnt bei null.

      Gesucht ist kein fertiges Spiel, sondern ein Beleg, dass du ein kleines, zusammenpassendes Set entwirfst, seine Lesbarkeit prüfst und deine Entscheidungen so dokumentierst, dass andere daran weiterarbeiten können. Den Inhalt gibt dir niemand vor: Figur, Gegner, Kreatur, Ort und Stil entwirfst du selbst. Wenn du willst, ist das Set ein erster Stand für Project Delicate Flower; der Kurs schlägt dafür nichts vor.

      ## Was du lieferst

      1. **Spielfigur** als Sprite in vier Richtungen (Standbild).
      2. **Einen Gegner** in mindestens einer Richtung, klar von der Spielfigur unterscheidbar.
      3. **Eine große Kreatur** in mindestens einer Ansicht, mindestens dreimal so hoch wie die Spielfigur, in derselben Pixeldichte.
      4. **Tiles:** eine nahtlose Bodenkachel mit zwei Varianten, ein Hindernis oder Wandstück, drei Requisiten.
      5. **`palette.png`** und die Palette als Datei deines Editors, höchstens 32 Farben, in Rampen geordnet.
      6. **`mockup_1x.png`** in Spielauflösung und eine ganzzahlig vergrößerte Fassung, in der alle Assets zusammen zu sehen sind.
      7. **`ENTSCHEIDUNGEN.md`:** Maßstabstabelle, Lesehierarchie, Entscheidungsprotokoll, zwei Überarbeitungsrunden mit Vorher und Nachher, Ergebnisse von Proben und Fremdtest, Liste der Referenzen mit Quelle.
      8. **Quelldateien** deines Editors und alle exportierten PNGs mit sprechenden Dateinamen.

      ## Technischer Rahmen

      Ein Pixel-Editor deiner Wahl, etwa Pixelorama, LibreSprite oder Aseprite; für Skizzen gern Papier oder Krita. Spielauflösung und Tile-Größe wählst du und schreibst sie in die Maßstabstabelle. Jede Zeichnung, jede Palette und jedes Tile stammt von dir; generierte Bilder sind nicht erlaubt, auch nicht als Vorlage. KI darf technische Arbeit übernehmen, etwa ein Skript, das Exporte in Graustufen kopiert. Den Import in Godot musst du nicht liefern; wie er geht, steht in [Eigene Sprites importieren](/godot/sprites-importieren).

      Grundlage sind alle Module dieses Bereichs, besonders [Farbe, Rampen und begrenzte Paletten](/pixelart/farbe-paletten), [Silhouette und Formensprache](/pixelart/silhouette-formsprache), [Ansichten, Maßstab und große Kreaturen](/pixelart/ansichten-massstab), [Umgebung und Tiles](/pixelart/umgebung-tiles) und [Prüfen, überarbeiten, dokumentieren](/pixelart/lesbarkeit-pruefen).
    skills: [character-design, pixelart, palette, tiles, massstab, lesbarkeit, dokumentation, ueberarbeitung]
    steps:
      - id: rahmen-festlegen
        title: Rahmen festlegen
        detail: |
          Leg Spielauflösung, Tile-Größe und Höhe der Spielfigur fest und schreib die Maßstabstabelle mit Figur, Gegner, Kreatur, Tür, Kiste und Tile in Pixeln. Formuliere die Lesehierarchie: Was muss ein Spieler in einer Sekunde erkennen?
      - id: thumbnails-set
        title: Thumbnails für Figur, Gegner und Kreatur
        detail: |
          Zeichne je mindestens acht Silhouetten-Thumbnails und wähle aus. Achte darauf, dass sich Figur und Gegner schon in der Silhouette unterscheiden. Notiere Referenzen mit Quelle.
      - id: palette-bauen
        title: Palette bauen
        detail: |
          Baue eine Palette mit höchstens 32 Farben in Rampen. Prüf mit der Graustufenprobe, welche Farben gleich hell sind, und entscheide, wofür du sie einsetzt. Schreib die Entscheidung ins Protokoll.
      - id: figur-zeichnen
        title: Spielfigur in vier Richtungen
        detail: |
          Zeichne die Figur in den Schritten Silhouette, Tonwerte, Farbe, Feinschliff und übertrage sie mit Hilfslinien auf die anderen Richtungen.
      - id: gegner-kreatur
        title: Gegner und große Kreatur
        detail: |
          Zeichne den Gegner und die Kreatur in der Pixeldichte der Figur, ohne etwas hochzuskalieren. Plane bei der Kreatur einen klaren Blickpunkt und große Massen.
      - id: tiles-zeichnen
        title: Tiles und Requisiten
        detail: |
          Zeichne die Bodenkachel im Tiled Mode oder Tile Mode, dann zwei Varianten, das Hindernis und drei Requisiten. Halte den Boden in einem engen Wertebereich.
      - id: mockup-bauen
        title: Mockup bauen
        detail: |
          Setz alle Assets in Spielauflösung zu einem Bild zusammen. Exportiere es bei 1× und ganzzahlig vergrößert.
      - id: proben-machen
        title: Proben machen
        detail: |
          Mach am Mockup die Proben Originalgröße, Graustufen, Silhouette und eine Simulation von Farbfehlsichtigkeit. Halte die Befunde fest.
      - id: fremdtest
        title: Fremdtest
        detail: |
          Zeig das Mockup zwei Personen je fünf Sekunden und stell offene Fragen. Schreib die Antworten wörtlich auf und vergleiche sie mit deiner Lesehierarchie.
      - id: runde-eins
        title: Erste Überarbeitungsrunde
        detail: |
          Wähle einen Befund, ändere genau eine Sache, wiederhole die passenden Proben und dokumentiere Befund, Änderung, Probe und Ergebnis mit Vorher und Nachher.
      - id: runde-zwei
        title: Zweite Überarbeitungsrunde
        detail: |
          Wiederhole das mit einem anderen Befund. Prüf auch, ob die erste Änderung etwas anderes verschlechtert hat.
      - id: abgabe
        title: Abgabe zusammenstellen
        detail: |
          Ordne Quelldateien und PNGs, prüf die Dateinamen und lies `ENTSCHEIDUNGEN.md` einmal so, als wärst du Mara Okafor und müsstest morgen ein neues Asset im selben Stil in Auftrag geben.
    acceptance:
      - id: palette-indexed
        text: Alle Assets nutzen ausschließlich die Palette mit höchstens 32 Farben; geprüft, indem jede Datei im Indexed-Modus ohne Farbänderung geöffnet wird.
      - id: pixeldichte
        text: Im Mockup haben alle Pixel aller Assets dieselbe Größe; kein Asset ist hochskaliert, und die große Kreatur ist mindestens dreimal so hoch wie die Spielfigur.
      - id: vier-richtungen
        text: Die Spielfigur liegt in vier Richtungen vor; Kopf, Hüfte und Füße liegen in allen auf denselben Pixelzeilen.
      - id: kacheln-nahtlos
        text: Die Bodenkachel und ihre Varianten sind in einer 3 × 3-Wiederholung ohne sichtbare Naht; ein Bild dieser Wiederholung liegt bei.
      - id: proben-belegt
        text: Für das Mockup liegen Ergebnisse der Proben Originalgröße, Graustufen, Silhouette und Farbfehlsichtigkeit als Bild und Notiz vor.
      - id: fremdtest-wortlich
        text: Der Fremdtest mit zwei Personen ist mit wörtlichen Antworten und dem Abgleich zur Lesehierarchie dokumentiert.
      - id: zwei-runden
        text: Zwei Überarbeitungsrunden sind mit Befund, genau einer Änderung, wiederholter Probe, Ergebnis und Vorher-Nachher-Bild dokumentiert.
      - id: entscheidungen-begruendet
        text: "`ENTSCHEIDUNGEN.md` nennt mindestens fünf Entscheidungen mit prüfbarem Grund und verworfener Alternative sowie die Maßstabstabelle."
      - id: eigene-arbeit
        text: Alle Zeichnungen stammen von dir; Referenzen stehen mit Quelle in der Liste, generierte Bilder wurden weder verwendet noch als Vorlage genutzt.
    stretch:
      - Eine zweite Bodenart mit eigenem Übergang zur ersten.
      - Die große Kreatur in einer zweiten Ansicht.
      - Ein Mockup mit einer anderen Tageszeit, nur über eine zweite Palette gelöst.
    portfolio: |
      Das Projekt ist eine vollständige Fallstudie: Rahmen, Entwurf, Prüfung, Überarbeitung und Begründung. Zeig im Portfolio das Mockup groß, darunter Figur, Gegner, Kreatur und Tiles einzeln, und zwei Vorher-Nachher-Paare mit je einem Satz, was sich geändert hat und warum. Studios suchen in Anzeigen etwa „A strong pixel art portfolio with unique creatures and characters“ ([Conradical Games](https://workwithindies.com/careers/conradical-games-pixel-artist)). Im Gespräch fragt man, welche Probe dich am meisten überrascht hat, was du mit mehr Zeit ändern würdest und wie ein anderer Artist anhand deiner Dokumentation ein neues Asset im selben Stil zeichnen könnte.
