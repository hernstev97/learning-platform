terms:
  - term: Pixelart
    definition: Bilder, in denen jeder Pixel bewusst gesetzt ist, meist in kleiner Auflösung und mit begrenzter Palette. Im Spiel wird das Bild nur ganzzahlig vergrößert, damit jeder Pixel gleich groß bleibt.
  - term: Sprite
    definition: Einzelnes Bild einer Figur, eines Gegners oder Gegenstands, das sich im Spiel unabhängig vom Hintergrund bewegt. Mehrere Sprites liegen oft nebeneinander in einem Spritesheet.
  - term: Tile
    definition: Kachel fester Größe, häufig 16 × 16 Pixel, aus der Böden, Wände und Level zusammengesetzt werden. Gute Tiles passen nahtlos aneinander.
  - term: Pixelraster
    definition: Ansicht im Editor, die die Grenzen zwischen den Pixeln als Linien zeigt (Pixel Grid). In Pixelorama mit Ctrl+H, in Aseprite unter den Einstellungen als „Visible Pixel Grid“.
  - term: Lauf
    definition: Folge von Pixeln in derselben Reihe oder Spalte einer Linie. Gleich lange Läufe ergeben eine gerade Linie, stetig wachsende oder schrumpfende eine Kurve.
  - term: Jaggy
    definition: Ungewollte Ecke oder Unregelmäßigkeit, die den Fluss einer Pixellinie unterbricht, etwa ein Lauf, der aus dem Muster fällt. Gewollte Ecken an harten Formen sind keine Jaggies.
  - term: Doppelpixel
    definition: Zusätzlicher Pixel an einer Stufe, der mit seinen Nachbarn eine L-Form bildet und die Linie dort zwei Pixel dick macht. Entsteht fast immer beim Freihandzeichnen.
  - term: Pixel-perfect-Modus
    definition: Option des Stifts in Aseprite, Pixelorama und LibreSprite, die beim Zeichnen den mittleren Pixel von L-Formen entfernt. Gut für Konturen, schlecht für Flächen in mehreren Strichen.
  - term: Cluster
    definition: Zusammenhängende Gruppe von Pixeln derselben Farbe. Aus Clustern entstehen lesbare Formen wie Lichtflecken, Schatten oder Steine.
  - term: Verwaister Pixel
    definition: Einzelner Pixel, der zu keinem Cluster seiner Farbe gehört und keine Kantenglättung ist (Orphan Pixel). Wirkt in Originalgröße wie Rauschen.
  - term: Banding
    definition: Tonstreifen, die parallel nebeneinanderlaufen und den Stufen einer Kante folgen. Statt einer Fläche liest das Auge ein Bündel Linien oder eine verdoppelte, weiche Kante.
  - term: Kantenglättung
    definition: Zwischentöne an den Stufen einer Kante, die sie weicher wirken lassen (Anti-Aliasing, AA). In Pixelart von Hand und sparsam gesetzt, an der Außenkante eines Sprites mit Vorsicht.
  - term: Kontur
    definition: Umrisslinie einer Form (Outline). Kann schwarz, in einem dunklen Ton der eigenen Farbe oder als Sel-out ausgeführt sein.
  - term: Sel-out
    definition: Selektive Kontur, die auf der Lichtseite heller oder ganz weggelassen ist und auf der Schattenseite dunkel bleibt. Lässt Formen weniger ausgeschnitten wirken.
  - term: Dithering
    definition: Abwechselnd gesetzte Pixel zweier Farben, die aus der Entfernung wie ein Zwischenton wirken. Geordnet als Raster oder unregelmäßig; nützlich für Textur und Übergänge bei wenigen Farben.
  - term: Kissenschattierung
    definition: Schattierung, die an jeder Kontur dunkler wird und zur Mitte heller, ohne Lichtrichtung (Pillow Shading). Lässt Formen flach und aufgeblasen wirken.
  - term: Formschattierung
    definition: Schattierung nach einer festgelegten Lichtrichtung, bei der helle und dunkle Bereiche der Form des Körpers folgen.
  - term: Tonwert
    definition: Helligkeit einer Farbe von Schwarz bis Weiß, unabhängig vom Farbton (Value). Tonwerte tragen einen großen Teil der Lesbarkeit eines Bildes.
  - term: Wertegruppe
    definition: Zusammenfassung eines Bildes in wenige Helligkeitsstufen, etwa Licht, Mitte und Schatten. Einfache Wertegruppen bleiben auch klein und aus der Entfernung lesbar.
  - term: Glanzlicht
    definition: Hellste Stelle auf einer glänzenden Oberfläche, wo das Licht direkt zum Auge gespiegelt wird. In Pixelart oft ein einzelner, bewusst gesetzter Pixel oder kleiner Cluster.
  - term: Kernschatten
    definition: Dunkelster Bereich auf der Form selbst, direkt hinter der Grenze zwischen Licht- und Schattenseite, dem Terminator.
  - term: Reflexlicht
    definition: Aufhellung auf der Schattenseite einer Form durch Licht, das von Boden oder Umgebung zurückgeworfen wird. Bleibt immer dunkler als die Lichtseite.
  - term: Schlagschatten
    definition: Schatten, den ein Körper auf andere Flächen wirft, auf der Seite gegenüber dem Licht. Direkt unter dem Körper liegt der dunkelste Teil, der Kontaktschatten.
  - term: Farbton
    definition: Die Farbe selbst, etwa Rot, Grün oder Blau (Hue), getrennt von Helligkeit und Sättigung betrachtet.
  - term: Sättigung
    definition: Reinheit oder Kräftigkeit einer Farbe, von Grau bis voll leuchtend.
  - term: Farbrampe
    definition: Reihe von Tönen einer Farbe von dunkel nach hell, aus der eine Form schattiert wird. Gute Rampen verschieben dabei auch den Farbton.
  - term: Hue Shifting
    definition: Verschiebung des Farbtons innerhalb einer Farbrampe, meist Schatten in Richtung Blau oder Violett und Lichter in Richtung Gelb. Lässt Rampen lebendiger wirken als reines Abdunkeln.
  - term: Begrenzte Palette
    definition: Feste, kleine Auswahl von Farben für ein ganzes Bild oder Spiel. Hält Assets zusammen und zwingt zu klaren Entscheidungen.
  - term: Indexed-Modus
    definition: Farbmodus, in dem jedes Pixel auf einen Eintrag der Palette verweist statt eine eigene Farbe zu speichern. In Aseprite bis 256 Farben; zeigt sofort, ob ein Bild nur Palettenfarben nutzt.
  - term: Relative Leuchtdichte
    definition: Nach WCAG berechnete Helligkeit einer Farbe zwischen 0 (Schwarz) und 1 (Weiß), mit Gewichten für Rot, Grün und Blau, die der Wahrnehmung folgen.
  - term: Kontrastverhältnis
    definition: Verhältnis der relativen Leuchtdichten zweier Farben nach WCAG, zwischen 1 (gleich hell) und 21 (Schwarz auf Weiß). Für Pixelart eine Rechenhilfe, keine Regel.
  - term: Negativraum
    definition: Die Flächen zwischen und um Gegenstände herum. Wer die Lücken zeichnet statt die Dinge, umgeht das Gedächtnisbild und trifft Formen genauer.
  - term: Vergleichsmessen
    definition: Proportionen mit ausgestrecktem Arm und Stift abnehmen und vergleichen, etwa wie oft die Kopfhöhe in die Körperhöhe passt.
  - term: Kopfeinheit
    definition: Kopfhöhe als Maßeinheit für Figuren. Ein durchschnittlicher Erwachsener ist etwa 7,5 Köpfe hoch, kleine Spielfiguren oft nur 2 bis 4.
  - term: Handlungslinie
    definition: Eine durchgehende Linie, meist eine C- oder S-Kurve oder eine Gerade, die die Hauptrichtung einer Pose zusammenfasst (Line of Action).
  - term: Gliederpuppe
    definition: Vereinfachte Figur aus Grundkörpern für Kopf, Rumpf und Glieder, an der sich Proportionen und Posen ohne Anatomiewissen planen lassen.
  - term: Chibi
    definition: Stilisierung mit großem Kopf und kleinem Körper (Super Deformed), der Kopf nimmt etwa ein Drittel bis die Hälfte der Höhe ein. Verbreitet bei kleinen Sprites, weil Gesicht und Ausdruck Platz bekommen.
  - term: Silhouette
    definition: Umrissform einer Figur oder eines Gegenstands, schwarz gefüllt ohne Innenzeichnung. Eine gute Silhouette ist auch ohne Farbe und Details erkennbar.
  - term: Formensprache
    definition: Wiederkehrende Grundformen wie Kreis, Quadrat oder Dreieck, aus denen ein Entwurf aufgebaut ist und die eine Wirkung nahelegen. Eine Konvention, kein Gesetz.
  - term: Thumbnail
    definition: Sehr kleine, schnelle Skizze, oft nur eine schwarze Silhouette oder drei Tonwerte, um viele Varianten zu vergleichen, bevor man eine ausarbeitet.
  - term: 3/4-Draufsicht
    definition: Ansicht vieler Top-down-Spiele, als sähe man schräg von oben. Oberseite und Vorderseite eines Gegenstands sind gleichzeitig zu sehen, ohne Fluchtpunkte.
  - term: Fluchtpunkt
    definition: Punkt auf dem Horizont, auf den parallele Kanten in der Perspektive zulaufen. In der 3/4-Draufsicht von Spielen wird meist darauf verzichtet.
  - term: Ghosting
    definition: Übung aus Drawabox, bei der man die Bewegung eines Strichs mehrmals in der Luft ausführt, bevor man ihn zeichnet, damit er sicherer und gerader wird.
  - term: Mixel
    definition: Pixel unterschiedlicher Größe im selben Bild, etwa wenn ein Teil doppelt vergrößert neben nativen Sprites steht. Bricht die einheitliche Pixeldichte.
  - term: Pixeldichte
    definition: Wie groß ein Pixel im Verhältnis zur Spielwelt ist. Bei einheitlicher Pixeldichte sind alle Pixel aller Assets im Spielbild gleich groß.
  - term: Maßstabstabelle
    definition: Liste der Größen in Pixeln für Figur, Gegner, Türen, Kisten, Tiles und große Kreaturen, damit alle Assets zusammenpassen.
  - term: Modellblatt
    definition: Blatt mit derselben Figur in mehreren Ansichten nebeneinander, mit Hilfslinien für Kopf, Hüfte und Füße (Turnaround). Hält Proportionen über alle Ansichten gleich.
  - term: Tiled Mode
    definition: Ansicht in Aseprite, die das Bild wiederholt um sich selbst zeigt, damit Nähte beim Zeichnen sichtbar werden. Pixelorama nennt das Tile Mode.
  - term: Referenzebene
    definition: Ebene mit einer Skizze oder einem Foto, auf der nicht gezeichnet wird und die beim Export nicht mitkommt. In Aseprite als Reference Layer.
  - term: Nächster Nachbar
    definition: Vergrößerungsverfahren, bei dem jeder Pixel zu einem größeren Quadrat wird (Nearest Neighbor). Hält Pixelart scharf; bilineares Vergrößern macht sie verwaschen.
  - term: Mockup
    definition: Aus eigenen Sprites und Tiles zusammengesetztes Bildschirmfoto, wie das Spiel aussehen soll. Lesbarkeit prüft man am Mockup, nicht am Einzelsprite.
  - term: Lesehierarchie
    definition: Festgelegte Reihenfolge, was ein Spieler zuerst, dann und zuletzt erkennen muss. Valve nennt sie für Team Fortress 2 „Read Hierarchy“.
  - term: Entscheidungsprotokoll
    definition: Kurze Liste der Gestaltungsentscheidungen eines Asset-Sets, jeweils mit prüfbarem Grund und verworfener Alternative.
