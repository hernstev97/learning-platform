cards:
  - id: symbol-oder-beobachtung
    module: beobachten
    q: Warum zeichnen Anfänger eine Tasse oft falsch, obwohl sie direkt vor ihnen steht?
    a: |
      Weil sie das Symbol zeichnen, das sie im Kopf haben, und nicht das, was sie sehen. Das Gedächtnisbild zeigt die Öffnung als Kreis und den Henkel von der Seite, egal wo man steht. Ich umgehe das, indem ich Verhältnisse messe und die Lücken zeichne, etwa die Fläche im Henkel. Die Lücke hat kein Symbol im Kopf, also zeichne ich sie so, wie sie ist.
    tags: [beobachten, grundlagen]
    level: 1
  - id: negativraum-nutzen
    module: beobachten
    q: Was ist Negativraum, und wofür nutzt du ihn?
    a: |
      Negativraum sind die Flächen zwischen und um Gegenstände, etwa zwischen den Beinen eines Stuhls. Ich zeichne sie, um Proportionen zu prüfen, weil ich bei ihnen keine Vorstellung habe, wie sie aussehen „sollten“. In der Pixelart kommt dieselbe Idee bei Silhouetten wieder: Eine Lücke zwischen Arm und Körper macht eine Pose lesbar.
    tags: [beobachten, negativraum]
    level: 1
  - id: vergleichsmessen
    module: beobachten
    q: Wie misst du Proportionen, wenn du ohne Lineal nach Beobachtung zeichnest?
    a: |
      Mit ausgestrecktem Arm und einem Stift. Ich nehme eine Einheit ab, etwa die Kopfhöhe, und zähle, wie oft sie in die Körperhöhe passt. Der Arm bleibt gestreckt, damit der Abstand gleich bleibt. Winkel prüfe ich, indem ich den Stift an die Kante halte und auf das Blatt übertrage. Die Zahlen schreibe ich neben die Skizze.
    tags: [beobachten, proportion]
    level: 1
  - id: referenz-oder-kopie
    module: beobachten
    q: Wie arbeitest du mit Referenzen, ohne zu kopieren?
    a: |
      Ich nutze Referenzen, um zu verstehen, wie etwas gebaut ist, und zeichne dann meine eigene Lösung. Ich sammle mehrere Quellen statt einer, notiere, was ich daraus lerne, und pause nichts ab. Für mein eigenes Spiel heißt das: Haltung, Material oder Licht darf ich studieren, die Figur entwerfe ich selbst. Generierte Bilder nutze ich weder als Vorlage noch als Ersatz.
    tags: [referenzen, ki-regel]
    level: 2
  - id: draufsicht-schummeln
    module: grundkoerper-raum
    q: Warum zeigen viele Top-down-Spiele Dach und Fassade gleichzeitig?
    a: |
      Sie nutzen eine 3/4-Draufsicht, als schaute man schräg von oben. Slynyrd beschreibt das so, dass man etwa drei Viertel von Dach und Fassade sieht. Eine reine Draufsicht zeigt Figuren nur als Kopf und Schultern, eine Seitenansicht verliert die Bewegungsfläche. Die 3/4-Ansicht verbindet beides und verzichtet dafür auf Fluchtpunkte, damit sich Tiles wiederholen lassen.
    tags: [perspektive, draufsicht]
    level: 1
  - id: grundkoerper-warum
    module: grundkoerper-raum
    q: Warum baust du Gegenstände aus Würfel, Zylinder und Kugel auf?
    a: |
      Weil ich bei einfachen Körpern weiß, wie Licht und Perspektive auf ihnen wirken. Ein Fass ist ein Zylinder, eine Kiste ein Würfel, ein Kopf beginnt als Kugel. Stimmt der Grundkörper, stimmen Verkürzung und Schatten, und Details setze ich erst danach. Fehler im Grundkörper repariert kein Detail.
    tags: [grundkoerper, konstruktion]
    level: 1
  - id: ghosting
    module: grundkoerper-raum
    q: Was ist Ghosting, und warum hilft es bei geraden Linien?
    a: |
      Ghosting heißt, die Bewegung eines Strichs mehrmals in der Luft auszuführen, bevor man aufsetzt. Drawabox beschreibt dafür drei Schritte: planen, die Bewegung in der Luft üben und dann ausführen. Der Strich kommt dann aus einer geübten Bewegung, meist aus der Schulter, und wird gerader und sicherer als ein zögerlich gezogener.
    tags: [zeichnen, linien]
    level: 1
  - id: kopfeinheiten
    module: figur-proportion
    q: Wie hoch ist ein Mensch in Kopfhöhen, und warum haben Spielfiguren oft viel weniger?
    a: |
      Ein durchschnittlicher Erwachsener ist etwa 7,5 Köpfe hoch. Kleine Sprites nutzen oft 2 bis 4 Köpfe, weil sonst für Gesicht und Ausdruck nur ein paar Pixel blieben. Bei 24 Pixeln Höhe und 7,5 Köpfen wäre der Kopf gut 3 Pixel hoch, bei 3 Köpfen 8 Pixel. Die stilisierte Proportion ist eine Entscheidung für Lesbarkeit, kein Fehler.
    tags: [proportion, sprites]
    level: 1
  - id: handlungslinie
    module: figur-proportion
    q: Was ist eine Handlungslinie, und wie setzt du sie ein?
    a: |
      Eine Linie, die die Hauptrichtung einer Pose zusammenfasst, meist eine C- oder S-Kurve oder eine Gerade. Proko empfiehlt, zuerst die längste Bewegungslinie des Körpers zu finden. Ich zeichne sie zuerst und baue die Gliederpuppe darüber. So wirkt die Pose bewegt, statt steif aus Einzelteilen zusammengesetzt.
    tags: [geste, pose]
    level: 1
  - id: gewicht-im-stand
    module: figur-proportion
    q: Woran erkennt man im Standbild, ob eine Figur sicher steht?
    a: |
      Daran, ob ihr Schwerpunkt über der Stützfläche liegt. Steht sie auf einem Bein, liegt der Schwerpunkt über diesem Fuß, Hüfte und Schultern kippen gegeneinander. Liegt er außerhalb, wirkt die Figur, als fiele sie, was in einer Bewegung gewollt sein kann, im Stand aber nicht.
    tags: [pose, gewicht]
    level: 2
  - id: tonwert-farbe
    module: licht-werte
    q: Was ist der Unterschied zwischen Tonwert und Farbe?
    a: |
      Der Tonwert ist die Helligkeit, die Farbe der Farbton. Ctrl+Paint beschreibt „value“ als Beleuchtung: helle Bereiche haben einen hohen Wert, dunkle einen niedrigen. Zwei verschiedene Farben können denselben Tonwert haben und verschmelzen dann in Graustufen. Deshalb plane ich Tonwerte zuerst und lege Farbe darüber.
    tags: [tonwert, farbe]
    level: 1
  - id: licht-zonen
    module: licht-werte
    q: Welche Zonen hat Licht auf einer Kugel?
    a: |
      Von der Lichtseite zur Schattenseite: Glanzlicht, Licht, Halbton, Terminator mit Kernschatten, Reflexlicht. Auf dem Boden kommen Kontaktschatten direkt darunter und Schlagschatten dazu. Das Reflexlicht bleibt immer dunkler als die Lichtseite. In kleinen Sprites fasse ich die Zonen zu zwei oder drei Werten zusammen.
    tags: [licht, schatten]
    level: 1
  - id: wenige-werte
    module: licht-werte
    q: Warum arbeitest du mit wenigen Wertegruppen?
    a: |
      Weil ein Bild mit wenigen, klar getrennten Tonwerten auch klein und aus der Entfernung lesbar bleibt. James Gurney schreibt „the fewer values the better“. Ich teile ein Bild in Licht, Mitte und Schatten und prüfe in Graustufen, ob jede Gruppe zusammenhält. Verstreute Werte wirken wie Rauschen.
    tags: [tonwert, lesbarkeit]
    level: 2
  - id: editor-ohne-kauf
    module: editor-einrichten
    q: Welche Pixel-Editoren empfiehlst du jemandem, der nichts kaufen will?
    a: |
      Pixelorama, frei unter MIT-Lizenz und mit Godot gebaut, oder LibreSprite, ein freier Fork des alten Aseprite. Aseprite selbst kostet etwas, der Quellcode ist aber offen, und die Lizenz erlaubt, es für den eigenen Gebrauch selbst zu kompilieren. Für freie Skizzen nehme ich Krita. Wichtiger als das Programm sind Pixelraster, Pixel-perfect-Strich, Indexed-Modus und ganzzahliger Export.
    tags: [werkzeuge, editor]
    level: 1
  - id: maus-statt-tablett
    module: editor-einrichten
    q: Kann man Pixelart mit der Maus machen?
    a: |
      Ja, in kleinen Auflösungen sogar gut. Pixelart setzt man Pixel für Pixel, nicht in langen Freihandstrichen. Gerade Linien ziehe ich mit dem Linienwerkzeug oder in Aseprite mit Shift vom letzten Pixel aus, Kurven baue ich aus Läufen. Mit der rechten Maustaste lege ich eine zweite Farbe oder ein zweites Werkzeug.
    tags: [werkzeuge, maus]
    level: 1
  - id: export-ganzzahlig
    module: editor-einrichten
    q: Warum exportierst du Pixelart nur ganzzahlig vergrößert?
    a: |
      Weil bei einem ganzzahligen Faktor jeder Pixel ein gleich großes Quadrat wird. Bei 150 % werden manche Pixel eins, manche zwei Bildschirmpixel breit, und bilineares Vergrößern macht alles verwaschen. Zum Teilen exportiere ich mit Faktor 4 oder 5 und nächstem Nachbarn. Im Spiel kümmert sich die Engine um die Skalierung.
    tags: [export, skalierung]
    level: 1
  - id: laeufe-lesen
    module: linien-cluster
    q: Warum wirkt eine Kurve in Pixeln zittrig, und wie behebst du das?
    a: |
      Meist springen die Läufe: Auf einen langen folgt ein kurzer und wieder ein langer. Ich schreibe die Lauflängen als Zahlenfolge auf, etwa 4, 1, 3, 2, und gleiche sie an, bis sie stetig fallen, also 4, 3, 2, 1. Danach entferne ich Doppelpixel und setze erst zum Schluss sparsam Zwischentöne.
    tags: [linien, kurven]
    level: 2
  - id: verwaiste-pixel
    module: linien-cluster
    q: Was sind verwaiste Pixel, und warum stören sie?
    a: |
      Einzelne Pixel, die zu keinem Cluster ihrer Farbe gehören und keine Kantenglättung sind. Im Zoom sehen sie wie Detail aus, bei 1× wie Schmutz oder Rauschen. Ich prüfe, ob jeder Pixel einen Nachbarn derselben Farbe hat, und setze Ausnahmen wie ein Glanzlicht bewusst.
    tags: [cluster, rauschen]
    level: 2
  - id: banding-erkennen
    module: linien-cluster
    q: Was ist Banding, und wie vermeidest du es?
    a: |
      Tonstreifen, die parallel nebeneinanderlaufen, oft genau entlang der Stufen einer Kante. Das Auge liest dann eine verdoppelte, weiche Kante statt einer Fläche. Ich führe die Grenze eines Schattens in einem anderen Winkel, variiere die Clusterbreiten oder fasse Bänder zusammen. Interessant ist, dass Saint11 und cure Banding verschieden definieren, die Wirkung aber dieselbe meinen.
    tags: [banding, schattieren]
    level: 2
  - id: kantenglaettung-aussen
    module: linien-cluster
    q: Warum glättest du die Außenkante eines Sprites selten?
    a: |
      Weil der Zwischenton die Figurfarbe mit einer Hintergrundfarbe mischt. Läuft die Figur später über verschiedene Böden, passt der Mischton nur auf einem und wirkt auf den anderen wie ein Saum. Innerhalb der Figur kenne ich beide Farben, dort setze ich Zwischentöne an langen Läufen.
    tags: [kantenglaettung, sprites]
    level: 3
  - id: hue-shifting
    module: farbe-paletten
    q: Was ist Hue Shifting, und warum nutzt du es in Farbrampen?
    a: |
      Eine Verschiebung des Farbtons innerhalb einer Rampe, meist Schatten Richtung Blau oder Violett, Lichter Richtung Gelb. Slynyrd schreibt, eine gute Rampe sollte Hue Shifting nutzen. Eine Rampe, die nur dunkler und heller wird, wirkt schnell flach und schmutzig. Mit Verschiebung wirken Licht und Schatten wie farbiges Licht.
    tags: [farbe, rampen]
    level: 2
  - id: begrenzte-palette
    module: farbe-paletten
    q: Warum arbeitest du mit einer begrenzten Palette?
    a: |
      Weil eine feste Palette Assets zusammenhält und Entscheidungen erzwingt. Jede neue Farbe muss sich ihren Platz verdienen. Im Indexed-Modus sehe ich sofort, ob ein Bild Farben außerhalb der Palette nutzt. Fertige Paletten von Lospec sind gutes Lernmaterial, für mein Spiel baue ich eine eigene.
    tags: [palette, zusammenhalt]
    level: 2
  - id: farbe-graustufen
    module: farbe-paletten
    q: Wie prüfst du, ob zwei Farben deiner Palette verwechselbar sind?
    a: |
      Ich sehe sie mir in Graustufen an oder rechne ihre relative Leuchtdichte nach WCAG aus. Rot und Blau oder Gelb und Hellblau können fast gleich hell sein und verschmelzen dann. Für Farbfehlsichtigkeit simuliere ich in den Chromium DevTools Protanopie, Deuteranopie und Tritanopie. Wichtige Unterschiede lege ich in den Tonwert, nicht nur in den Farbton.
    tags: [farbe, barrierefreiheit]
    level: 2
  - id: kissenschattierung
    module: schattieren-textur
    q: Was ist Kissenschattierung, und warum gilt sie als Fehler?
    a: |
      Schattierung, die an jeder Kontur dunkler wird und zur Mitte heller, ohne Lichtrichtung. Saint11 beschreibt sie als allgemeinen Schatten um die Umrisse, wenn keine klare Lichtquelle festgelegt ist. Die Form wirkt flach und aufgeblasen. Ich lege zuerst die Lichtrichtung fest und schattiere dann nach der Form.
    tags: [schattieren, licht]
    level: 2
  - id: dithering-wann
    module: schattieren-textur
    q: Wann setzt du Dithering ein und wann nicht?
    a: |
      Für Textur, etwa Stein oder Stoff, und für Übergänge, wenn die Palette sehr wenige Farben hat. Saint11 schreibt, er vermeide Dithering, wo er kann. In kleinen Sprites wirkt es schnell wie Rauschen, und in Bewegung flimmert es. Ich prüfe jedes Dithering bei 1×.
    tags: [dithering, textur]
    level: 2
  - id: detailbudget
    module: schattieren-textur
    q: Wie entscheidest du, wie viel Detail ein kleines Sprite trägt?
    a: |
      Nach Größe und Lesehierarchie. Je kleiner die Auflösung, desto mehr muss ich wählen, welche Details wichtig sind, wie Saint11 es formuliert. Ich behalte Silhouette, Hauptformen und ein Erkennungsmerkmal und lasse den Rest weg. Textur baue ich aus Clustern mit Licht- und Schattenkante, nicht aus einzelnen Pixeln.
    tags: [detail, textur]
    level: 2
  - id: sel-out
    module: schattieren-textur
    q: Was ist Sel-out, und welches Problem löst es?
    a: |
      Eine selektive Kontur, die auf der Lichtseite heller ist oder fehlt und auf der Schattenseite dunkel bleibt. Eine durchgehend schwarze Kontur lässt Formen ausgeschnitten wirken und frisst in kleinen Sprites viele Pixel. Saint11 rät, statt Schwarz eine dunkle Farbe zu nehmen. Sel-out trennt die Figur trotzdem vom Hintergrund, weil die Schattenseite dunkel bleibt.
    tags: [kontur, sel-out]
    level: 2
  - id: silhouette-zuerst
    module: silhouette-formsprache
    q: Warum beginnst du einen Figurenentwurf mit der Silhouette?
    a: |
      Weil die Silhouette das Erste ist, was ein Spieler liest, besonders klein und in Bewegung. Valve hat die Klassen von Team Fortress 2 so entworfen, dass sie schon als schwarze Silhouette ohne Innenzeichnung erkennbar sind. Ich zeichne viele kleine schwarze Thumbnails, wähle die stärkste aus und arbeite erst dann Details aus.
    tags: [silhouette, character-design]
    level: 2
  - id: formensprache
    module: silhouette-formsprache
    q: Was bedeuten Kreis, Quadrat und Dreieck im Character Design?
    a: |
      Es sind Konventionen, keine Gesetze. Runde Formen werden oft mit freundlich oder weich verbunden, eckige mit stabil oder schwer, spitze mit gefährlich oder schnell. Ich nutze sie als Ausgangspunkt und prüfe dann, ob mein Entwurf so wirkt, wie ich will. Wichtiger als die Grundform ist, dass Figuren sich voneinander unterscheiden.
    tags: [formensprache, character-design]
    level: 2
  - id: gegner-unterscheidbar
    module: silhouette-formsprache
    q: Wie stellst du sicher, dass Spieler Spielfigur und Gegner nicht verwechseln?
    a: |
      Zuerst über die Silhouette: andere Grundform, Proportion oder Größe. Dann über Farbe und Tonwert: Bei Team Fortress 2 liest man das Team an der Farbe, Rot oder Blau, die Klasse an der Silhouette. Ich prüfe beides im Mockup mit Silhouetten- und Graustufenprobe und mit einem Fremdtest.
    tags: [lesbarkeit, gegner]
    level: 2
  - id: pose-standbild
    module: pose-ausdruck
    q: Wie zeigst du in einem einzelnen kleinen Sprite, wie es einer Figur geht?
    a: |
      Über die Haltung, bevor das Gesicht etwas tun kann. Offen mit breitem Stand, verschlossen mit gesenktem Kopf und Armen vor dem Körper, angespannt mit gebeugten Knien und Gewicht nach vorn. In kleinen Bildern übertreibe ich, weil feine Unterschiede bei 1× verschwinden. Wie die Figur von einer Haltung in die nächste kommt, ist Animation.
    tags: [pose, ausdruck]
    level: 2
  - id: gesicht-wenige-pixel
    module: pose-ausdruck
    q: Wie viel Ausdruck passt in ein Gesicht aus wenigen Pixeln?
    a: |
      Mehr als man denkt, wenn man die richtigen Pixel wählt. Brauen verändern den Ausdruck am stärksten: zwei schräge Pixel über jedem Auge machen aus neutral wütend. Die Höhe der Augen und ein offener oder flacher Mund ergänzen das. Ich prüfe jeden Ausdruck bei 1× und frage jemanden, welches Gefühl er sieht.
    tags: [ausdruck, gesicht]
    level: 2
  - id: spritegroesse
    module: sprite-entwerfen
    q: Wie wählst du die Größe einer Spielfigur in Pixeln?
    a: |
      Aus Tile-Größe, Spielauflösung und dem, was die Figur zeigen muss. Slynyrd nennt für Top-down-Spiele eine Figur von einem Tile Breite und zwei Tiles Höhe als häufige Größe, mit einem Kopf von einem Drittel bis zur Hälfte der Höhe. Größere Figuren tragen mehr Detail, kosten aber mehr Arbeit pro Bild und Richtung. Ich halte die Entscheidung in einer Maßstabstabelle fest.
    tags: [sprites, groesse]
    level: 2
  - id: arbeitsablauf-sprite
    module: sprite-entwerfen
    q: Beschreib deinen Arbeitsablauf vom Entwurf zum fertigen Sprite.
    a: |
      Thumbnails als Silhouetten, dann eine Gliederpuppe mit Kopfzahl. Im Editor die Silhouette in Spritegröße, dann drei oder vier Tonwerte, dann Farbe aus der Palette, zuletzt Linien, Cluster, Kontur und sparsame Kantenglättung. Jeder Schritt liegt in einer eigenen Ebene, und nach jedem prüfe ich bei 1×.
    tags: [arbeitsablauf, sprites]
    level: 2
  - id: dunkel-unten-hell-oben
    module: sprite-entwerfen
    q: Warum legen manche Studios den stärksten Kontrast einer Figur auf Brusthöhe?
    a: |
      Weil der Blick zum stärksten Kontrast geht. Valve hat die Figuren von Team Fortress 2 von dunklen Füßen zu einem hellen, kontrastreichen Oberkörper abgestuft, weil dort die Waffe gehalten wird und sie dem Spieler sagt, was die Figur tut. Ich lege den stärksten Kontrast dorthin, wo die wichtigste Information sitzt.
    tags: [lesbarkeit, tonwert]
    level: 3
  - id: vier-richtungen
    module: ansichten-massstab
    q: Wie hältst du eine Figur in vier Richtungen konsistent?
    a: |
      Mit einem Modellblatt: Kopf, Hüfte und Füße liegen in allen Ansichten auf denselben Pixelzeilen. Die Seiten spiegele ich, prüfe dann aber Asymmetrien wie einen Gegenstand in einer Hand. Ich vergleiche die Ansichten nebeneinander bei 1× und mit der Silhouettenprobe.
    tags: [ansichten, konsistenz]
    level: 2
  - id: mixels
    module: ansichten-massstab
    q: Was ist an einem Boss falsch, der in halber Auflösung gezeichnet und dann verdoppelt wurde?
    a: |
      Seine Pixel sind doppelt so groß wie die der Spielfigur. Im selben Bild stehen dann zwei Pixeldichten nebeneinander, oft Mixels genannt, und der Boss wirkt grob und wie aus einem anderen Spiel. Slynyrd rät, nur ganzzahlig zu vergrößern, damit Pixel einheitlich bleiben. Ich zeichne große Kreaturen in voller Auflösung und halte die Clustergröße der kleinen Sprites.
    tags: [massstab, pixeldichte]
    level: 2
  - id: grosse-kreatur-lesbar
    module: ansichten-massstab
    q: Worauf achtest du beim Entwurf einer großen Kreatur als Boss?
    a: |
      Auf wenige große Massen mit klarer Silhouette, einen Blickpunkt und dieselbe Pixeldichte wie der Rest des Spiels. Ich baue die Kreatur aus Grundkörpern auf und plane Teile, die sich später bewegen, getrennt. Ob Angriffe gut angekündigt sind, ist eine Frage des Combat Designs, die ich mit dem Bild abstimme.
    tags: [bosse, character-design]
    level: 3
  - id: nahtlose-kachel
    module: umgebung-tiles
    q: Wie zeichnest du eine Bodenkachel, die sich ohne Naht wiederholt?
    a: |
      Im Tiled Mode von Aseprite oder im Tile Mode von Pixelorama, die das Bild um sich selbst wiederholen. Formen, die über den Rand gehen, laufen auf der Gegenseite weiter. Ich prüfe eine 3 × 3-Wiederholung bei 1× und achte dabei nicht nur auf Nähte, sondern auch auf Muster, die sich als Raster verraten.
    tags: [tiles, nahtlos]
    level: 2
  - id: wiederholung-brechen
    module: umgebung-tiles
    q: Wie verhinderst du, dass ein Boden aus Tiles wie ein Raster aussieht?
    a: |
      Mit Varianten und seltenen Details. Ein auffälliges Detail in jeder Kachel verrät das Raster sofort. Ich lege ruhige Grundkacheln an, dazu Varianten mit kleinen Unterschieden, und setze auffällige Details sparsam und unregelmäßig. Der Boden bleibt in einem engen Wertebereich.
    tags: [tiles, wiederholung]
    level: 2
  - id: hintergrund-ruhig
    module: umgebung-tiles
    q: Warum soll der Hintergrund weniger Kontrast haben als die Figuren?
    a: |
      Weil der Blick zum stärksten Kontrast geht. Ist der Boden so kontrastreich wie die Figur, verschwindet sie darin. Ich halte den Boden in einem engen Tonwertbereich und mit weniger Sättigung und gebe Figuren und Gefahren den vollen Kontrast. Begehbares und Hindernisse unterscheide ich über Tonwert und Kante.
    tags: [lesbarkeit, umgebung]
    level: 2
  - id: drei-proben
    module: lesbarkeit-pruefen
    q: Mit welchen schnellen Proben prüfst du die Lesbarkeit eines Asset-Sets?
    a: |
      Originalgröße für Details, Graustufen für Tonwerte, Silhouette für Form und Richtung, dazu eine Simulation von Farbfehlsichtigkeit. Immer am Mockup in Spielauflösung, nicht am Einzelsprite. In Chromium gehen Graustufen und Farbfehlsichtigkeit über die DevTools, schwarze Silhouetten über eine gefüllte Kopie.
    tags: [lesbarkeit, proben]
    level: 2
  - id: rueckmeldung-holen
    module: lesbarkeit-pruefen
    q: Wie holst du Rückmeldung zu einem Bild, ohne die Antwort vorzugeben?
    a: |
      Ich zeige es fünf Sekunden und frage „Was hast du gesehen?“ statt „Erkennst du den Wolf?“. Die Antworten schreibe ich wörtlich auf und erkläre nichts. Vorschläge wie „mach ihn rot“ übersetze ich in die Beobachtung dahinter, hier: Er wurde nicht als Gefahr erkannt. Die Lösung entscheide ich selbst.
    tags: [feedback, playtest]
    level: 2
  - id: eine-aenderung
    module: lesbarkeit-pruefen
    q: Warum änderst du pro Überarbeitungsrunde nur eine Sache?
    a: |
      Damit ich weiß, was gewirkt hat. Ändere ich Palette, Größe und Kontur auf einmal, kann jede der drei Änderungen der Grund für das bessere Ergebnis sein, und vielleicht hat eine sogar etwas verschlechtert. Jede Runde hält Befund, Änderung, Probe und Ergebnis mit Vorher und Nachher fest.
    tags: [ueberarbeitung, dokumentation]
    level: 2
  - id: entscheidungsprotokoll
    module: lesbarkeit-pruefen
    q: Was gehört in ein Entscheidungsprotokoll für ein Asset-Set?
    a: |
      Jede Entscheidung, die das Set prägt, etwa Palette, Spritegröße, Lichtrichtung oder Kontur, mit einem prüfbaren Grund und der verworfenen Alternative. Dazu die Maßstabstabelle und die Lesehierarchie. Damit kann ich oder ein anderer Artist später neue Assets im selben Stil zeichnen, ohne bei null anzufangen.
    tags: [dokumentation, portfolio]
    level: 3
  - id: art-test-vorgehen
    q: Du bekommst einen Art-Test für eine Stelle als Pixel Artist. Wie gehst du vor?
    a: |
      Ich kläre, was bewertet wird, und halte mich an Größen, Palette und Zeit. Dann lege ich den Rahmen schriftlich fest: Auflösung, Tile-Größe, Spritehöhe, Lichtrichtung. Ich zeige den Weg von Thumbnails über Tonwerte zur Ausarbeitung, prüfe alles im Mockup und schreibe eine halbe Seite zu meinen wichtigsten Entscheidungen.
    tags: [praxis, bewerbung]
    level: 2
  - id: ki-in-der-arbeit
    q: Wie stehst du zu KI in deiner Arbeit als Artist?
    a: |
      Zeichnungen, Entwürfe und Assets mache ich selbst; generierte Bilder nutze ich weder als Vorlage noch als Ersatz. KI darf technische Arbeit übernehmen, etwa ein Skript, das Exporte umbenennt oder Graustufenkopien erzeugt. Manche Studios schreiben das inzwischen in ihre Anzeigen, etwa „Not using AI in their work“.
    tags: [praxis, ki-regel]
    level: 1
