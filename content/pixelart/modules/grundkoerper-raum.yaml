  - title: Slynyrd · Pixelblog 3 · Graphical Projections
    url: https://www.slynyrd.com/blog/2018/3/14/pixelblog-3-graphical-projections-1
  - title: Wikipedia · 2.5D · Axonometric and oblique projection
    url: https://en.wikipedia.org/wiki/2.5D#Axonometric_and_oblique_projection
  - title: Krita Docs · Painting with Assistants · Logic of the vanishing point
    url: https://docs.krita.org/en/user_manual/painting_with_assistants.html#logic-of-the-vanishing-point
lesson: |
  Zeichne eine Kiste. Wahrscheinlich entsteht ein Quadrat mit zwei schrägen Flächen oben und rechts, wie aus dem Mathebuch. Jetzt stell dir dieselbe Kiste in einem Top-down-Spiel vor. Die Kamera schaut schräg von oben, neben der Kiste stehen ein Fass und eine Mauer. Welche Seiten siehst du? Wie hoch ist die Oberseite im Verhältnis zur Front? Laufen die Kanten irgendwo zusammen? Wer darauf keine Antwort hat, zeichnet eine Kiste, ein Fass und eine Mauer, die nicht zueinander passen, obwohl jedes für sich ordentlich aussieht.

  Dieses Modul übt räumliches Denken: Gegenstände aus Grundkörpern bauen, Perspektive verstehen und die Projektionen kennen, die Spiele verwenden. Alles geht mit Stift und Papier, Karopapier hilft bei den Projektionen besonders.

  ## Grundkörper: Würfel, Zylinder, Kugel und Kegel

  Fast jeder Gegenstand lässt sich aus vier Grundkörpern zusammensetzen: Würfel oder Quader, Zylinder, Kugel und Kegel. Eine Kiste ist ein Quader, ein Fass ein Zylinder mit Bauch, ein Baum eine Kugel auf einem Zylinder, eine Laterne ein Zylinder mit Kegel als Dach. Drawabox übt, wie solche Körper sich durchdringen ([Form Intersections](https://drawabox.com/lesson/2/formintersections)), und baut später ganze Tiere aus Grundformen auf ([Lesson 5](https://drawabox.com/lesson/5)).

  ![Drei Grundkörper in 3/4-Draufsicht auf hellem Grund, Licht von oben links, jeder mit flachem Schatten auf dem Boden. A ist ein Würfel mit heller Oberseite und mittelgrauer Front. B ist ein Zylinder mit weißer, elliptischer Oberseite und einem Mantel, der von links hell nach rechts dunkel wird. C ist eine Kugel mit weißem Glanzfeld oben links und dunkler Zone unten rechts](/media/pixelart/grundkoerper-raum/grundkoerper@2x.png "Würfel (A), Zylinder (B) und Kugel (C) in 3/4-Draufsicht. Eigenes Schaubild")

  Jeder Körper nimmt Licht anders an. Der Würfel A hat ebene Flächen mit Kanten: Oberseite hell, Front mittel, der Wechsel ist hart. Der Zylinder B hat eine flache, helle Oberseite und einen runden Mantel, auf dem das Licht von links nach rechts in Stufen abnimmt. Die Kugel C hat keine Kante, das hellste Feld liegt oben links, das dunkelste unten rechts. Alle drei werfen einen Schatten auf den Boden, ohne ihn würden sie schweben. Wie Licht auf solchen Körpern genau verläuft, zeigt [Licht, Schatten und Tonwerte](/pixelart/licht-werte).

  Der Nutzen: Du lernst die Regeln von vier Körpern einmal und wendest sie auf alles an. Ein Fass hat dieselben Ellipsen wie ein Zylinder, ein Kopf dieselben Lichtzonen wie eine Kugel.

  ### Tiefe ohne Fluchtpunkte

  Drei Hinweise sagen dem Auge, was vorn und was hinten ist:

  - **Überschneidung.** Was vorn steht, verdeckt, was dahinter steht. Der stärkste Hinweis, er wirkt in jeder Projektion.
  - **Größe.** In der Perspektive erscheint Entferntes kleiner. In den Projektionen der meisten Pixelspiele gilt das nicht, dazu unten mehr.
  - **Lage im Bild.** In der Draufsicht steht weiter unten, was näher am Betrachter ist. Es darf verdecken, was weiter oben steht.

  ## Perspektive: Horizont, Fluchtpunkte und Verkürzung

  Der **Horizont** ist eine waagerechte Linie auf deiner Augenhöhe. Liegt eine Kiste darunter, siehst du ihre Oberseite. Liegt sie darüber, etwa ein Regal über deinem Kopf, siehst du die Unterseite.

  Ein **Fluchtpunkt** ist laut Krita-Doku „the point where any two parallel lines meet“ ([Logic of the vanishing point](https://docs.krita.org/en/user_manual/painting_with_assistants.html#logic-of-the-vanishing-point)). Kanten, die in Wirklichkeit parallel sind und von dir weglaufen, laufen im Bild auf einen Punkt zu. Bei waagerechten Kanten liegt dieser Punkt auf dem Horizont.

  - **Einpunktperspektive.** Die Front der Kiste steht dir gerade gegenüber. Nur die Kanten in die Tiefe laufen zu einem Fluchtpunkt.
  - **Zweipunktperspektive.** Die Kiste ist gedreht. Ihre Kanten laufen nach links und nach rechts zu je einem Fluchtpunkt, die Senkrechten bleiben senkrecht. Krita baut sie aus „2 vanishing point and 1 vertical parallel ruler“ ([Linear Perspective](https://docs.krita.org/en/user_manual/painting_with_assistants.html#linear-perspective)).

  **Verkürzung** heißt: Eine Strecke, die von dir weg zeigt, erscheint kürzer als dieselbe Strecke quer vor dir. Die Oberseite einer Kiste unter dem Horizont ist deshalb im Bild flacher als ihre Front, obwohl beide gleich groß sind.

  ```text
  Horizont        = deine Augenhöhe
  unter Horizont  -> Oberseite sichtbar
  Senkrechte      bleiben senkrecht (1 und 2 Fluchtpunkte)
  weg von dir     -> kürzer, Kanten laufen zusammen
  ```

  Kisten sind die Grundübung für all das. Drawabox beginnt damit in Lektion 1 ([Boxes](https://drawabox.com/lesson/1/6)) und hat dafür eine eigene Fleißaufgabe, die [250 Box Challenge](https://drawabox.com/lesson/250boxes).

  ## Ellipsen und Linien aus der Schulter

  Ein Kreis, den du schräg siehst, wird zur **Ellipse**. Zwei Regeln reichen für den Anfang:

  - **Augenhöhe.** Je weiter eine Kreisfläche über oder unter deiner Augenhöhe liegt, desto runder erscheint die Ellipse. Auf Augenhöhe wird sie zur Linie. Bei einem Becher auf dem Tisch ist die obere Öffnung deshalb flacher als der Boden.
  - **Achse.** Die kurze Achse der Ellipse zeigt in Richtung der Mittelachse des Zylinders. Steht der Zylinder, liegt die Ellipse waagerecht. Kippt er, kippt sie mit.

  Den Boden eines stehenden Zylinders siehst du nur zur Hälfte: Die vordere Kante ist ein Bogen. In der Parallelprojektion der Spiele hat er dieselbe Krümmung wie die Oberseite, in echter Perspektive ist er runder als die Öffnung. Eine gerade Unterkante macht aus dem Fass ein Brett.

  Für saubere Linien und Ellipsen gibt es zwei Techniken aus Drawabox. **Ghosting:** „Ghosting is the act of going through the motion of drawing a mark, but without actually touching the page.“ ([Ghosted Lines](https://drawabox.com/lesson/1/ghostedlines)) Du übst die Bewegung zwei-, dreimal in der Luft und setzt dann den Strich in einem Zug. Und **aus der Schulter zeichnen:** Lange Linien werden aus Ellbogen und Schulter gerader als aus dem Handgelenk, das in einem Bogen schwingt ([Lesson 1](https://drawabox.com/lesson/1)). Ellipsen übst du mit der Ellipsen-Lektion ([Ellipses](https://drawabox.com/lesson/1/5)).

  > [!TIP] Im Bus
  > Die Fahrt wackelt, und der Arm hat wenig Platz. Zeichne klein, ghoste jede Linie und setz sie nach einer ruhigen Strecke, etwa an der Ampel. Kisten von zwei Zentimetern reichen, dann passen auch die Fluchtpunkte noch aufs Blatt.

  ## Spielprojektionen: Draufsicht, 3/4-Draufsicht, Seitenansicht

  Spiele zeigen ihre Welt meist nicht in Fluchtpunktperspektive, sondern in einer **Parallelprojektion**: Parallele Kanten bleiben im Bild parallel. Eine Unterform ist die **schiefe Projektion** (oblique projection). Die Wikipedia schreibt, dass Videospiele, besonders vor der Zeit der 3D-Spiele, oft eine Form davon verwenden ([Oblique projection](https://en.wikipedia.org/wiki/Oblique_projection#Examples)).

  ![Drei Quadrate mit dunkler Kontur, jedes zeigt denselben Würfel aus einer anderen Ansicht. A ist ganz hellgrau: nur die Oberseite. B ist oben etwas mehr als zur Hälfte hellgrau und unten mittelgrau: Oberseite und Front. C ist ganz mittelgrau: nur die Front](/media/pixelart/grundkoerper-raum/draufsicht-projektionen@2x.png "Reine Draufsicht (A), 3/4-Draufsicht (B) und Seitenansicht (C). Eigenes Schaubild")

  Das Schaubild zeigt denselben Würfel dreimal, jedes Feld 14 Pixel hoch mit einem Pixel Kontur oben und unten:

  - **A, reine Draufsicht:** nur die Oberseite, 12 Reihen. Von einer Figur siehst du hier laut Wikipedia nur „a head and shoulders seen from above“.
  - **B, 3/4-Draufsicht:** Oberseite 7 Reihen, Front 5 Reihen. Raymond Schlitter (Slynyrd) beschreibt sie so: „as if you are viewing the house from 45 degrees above … you see about 3/4 of both the roof and facade.“ ([Pixelblog 3](https://www.slynyrd.com/blog/2018/3/14/pixelblog-3-graphical-projections-1))
  - **C, Seitenansicht:** nur die Front, 12 Reihen. Typisch für Jump-'n'-Runs.

  Die Wikipedia fasst den Vorteil der schrägen Ansichten so: Sie verbinden „the visibility and mobility of a top-down game with the character recognizability of a side-scrolling game“ ([2.5D](https://en.wikipedia.org/wiki/2.5D#Axonometric_and_oblique_projection)). Du siehst den Boden, auf dem du läufst, und erkennst Figuren und Gegenstände an ihrer Front. Auch Slynyrds Bodentiles sind in dieser Projektion gezeichnet; als Größe nennt er „16x16px is probably the most common size“ ([Pixelblog 20](https://www.slynyrd.com/blog/2019/8/27/pixelblog-20-top-down-tiles)).

  ## Warum Top-down-Spiele schummeln

  Echte Perspektive würde in einem Top-down-Spiel Probleme machen. Ein Haus links am Bildrand hätte andere Fluchtlinien als dasselbe Haus in der Mitte. Jedes Tile müsste je nach Lage auf dem Bildschirm anders verzerrt sein, und beim Scrollen würden sich alle Formen ändern. In der Parallelprojektion sieht jede Kopie eines Objekts überall gleich aus. Deshalb lassen sich Tiles wiederholen und Sprites verschieben.

  Dazu kommt eine bewusste Unschärfe. Slynyrd gibt zu, dass echte Perspektive das Dach flacher machen und die Wände nach außen neigen würde. Er bevorzugt saubere Winkel und schreibt, in Pixelart gehe Einheitlichkeit vor Realismus: „uniformity takes priority over realism“ (Pixelblog 3). Figuren zeichnen viele Spiele fast in Vorderansicht, auch wenn die Kamera schräg von oben schaut, damit man sie erkennt. Das hat Folgen: Der Kopf steht im Bild über den Füßen. Was das für Trefferflächen heißt, steht in [Reichweite, Hitboxen und Hurtboxen](/combat/hitboxen).

  > [!MERKE]
  > Wähl eine Projektion und halte sie durch. Ein Objekt in Zweipunktperspektive neben Tiles in 3/4-Draufsicht wirkt schief, egal wie gut es gezeichnet ist.

  Für dich hat die Parallelprojektion einen praktischen Vorteil: Sie passt auf Karopapier. Senkrechte bleiben auf den Rasterlinien, und du brauchst keine Fluchtpunkte außerhalb des Blatts. Legst du einmal fest, wie stark Oberseiten verkürzt werden, etwa auf die halbe Tiefe, gilt das für jede Kiste, jedes Fass und jede Mauer.

  > [!PRAXIS]
  > Slynyrd zeichnet seine Projektionen nicht nach den Regeln der Perspektive, sondern nach festen Regeln für alle Objekte: gleiche Winkel, gleiche Verkürzung, Licht aus derselben Ecke, wobei er eine obere Ecke am natürlichsten findet. Projektionen sollen nach ihm „in most cases“ nicht in einer Szene gemischt werden, und schief gewählte Regeln können gut aussehen, wenn alle Elemente ihnen folgen (Pixelblog 3). Bevor du ein Objekt für dein Spiel zeichnest, schreib deshalb die Regel auf: Verkürzung der Oberseite, Lichtrichtung, Tilegröße.

  ## Werkzeuge: Papier, Karos und Krita

  Auf Papier genügt der Heftrand als Bezug für die Waagerechte. Für Übungen in Fluchtpunktperspektive zeichnest du klein, damit beide Fluchtpunkte auf die Seite passen. Für Spielprojektionen nimmst du Karopapier, ein Kästchen ist ein Pixel.

  Am PC kann Krita Perspektive vorgeben. Der Perspektiv-Assistent legt ein Raster aus vier Eckpunkten an, der Fluchtpunkt-Assistent einen einzelnen Punkt, der Zweipunkt-Assistent zwei Fluchtpunkte und einen Sehmittelpunkt ([Perspective](https://docs.krita.org/en/user_manual/painting_with_assistants.html#perspective), [2 Point Perspective](https://docs.krita.org/en/user_manual/painting_with_assistants.html#point-perspective)). Mit „Snap to Assistants“ in den Werkzeugoptionen des Freihandpinsels rastet der Strich an den Hilfslinien ein. Für dieses Modul brauchst du das nicht; es hilft, wenn du später Hintergründe in Perspektive skizzierst.

  > [!INTERVIEW]
  > Pine Creek Games nannte „good knowledge of perspective“ als Muss für eine 2D-Artist-Stelle ([Work With Indies](https://workwithindies.com/careers/pine-creek-games-2d-artist)). In einem Art-Test könnte die Aufgabe lauten: „Zeichne eine Truhe, die zu diesen Tiles passt.“ Gute Antwort: Du liest zuerst die Projektion der vorhandenen Assets ab, also das Verhältnis von Oberseite zu Front, die Lichtrichtung und die Tilegröße. Dann baust du die Truhe als Quader mit Zylinderdeckel in genau dieser Projektion, ohne Fluchtpunkte, Senkrechte senkrecht. Zum Schluss legst du sie neben ein vorhandenes Asset und vergleichst die Verkürzung.

  ## Häufige Fehler

  - **Projektionen gemischt.** Ein Haus in Zweipunktperspektive zwischen Tiles in 3/4-Draufsicht. Prüf jedes Objekt gegen die Regel der Szene.
  - **Gerade Unterkante am Zylinder.** Der Boden eines Fasses ist ein Bogen, in der Parallelprojektion mit derselben Krümmung wie die Oberseite.
  - **Ellipse mit Spitzen.** Eine Ellipse hat an den Enden runde Bögen, keine Ecken wie ein Auge.
  - **Gekippte Ellipse am stehenden Zylinder.** Die kurze Achse zeigt entlang der Mittelachse.
  - **Senkrechte zum Fluchtpunkt gezogen.** In Ein- und Zweipunktperspektive bleiben Senkrechte senkrecht.
  - **Verschiedene Verkürzung.** Eine Kiste mit halber, ein Fass mit voller Tiefe passen nicht nebeneinander.
  - **Linien aus dem Handgelenk.** Lange Linien biegen sich. Ghoste und zeichne aus Ellbogen und Schulter.

  ## Zusammenfassung

  - Würfel, Zylinder, Kugel und Kegel sind die Bausteine fast jedes Gegenstands.
  - Überschneidung wirkt in jeder Projektion. Größe als Tiefenhinweis gilt nur in der Perspektive.
  - Der Horizont liegt auf Augenhöhe. Parallele Kanten, die von dir weglaufen, treffen sich in einem Fluchtpunkt.
  - Ellipsen werden runder, je weiter sie von der Augenhöhe entfernt sind. Ihre kurze Achse zeigt entlang der Zylinderachse.
  - Ghosting und Linien aus der Schulter machen Striche gerade und sicher.
  - Top-down-Pixelspiele nutzen meist eine 3/4-Draufsicht als Parallelprojektion: Oberseite und Front zugleich, keine Fluchtpunkte.
  - Eine Projektion pro Szene, eine feste Verkürzung für alle Objekte.
exercises:
  - id: projektion-erkennen
    type: choice
    title: Welche Ansicht für ein Top-down-Spiel?
    prompt: |
      Welches Feld zeigt die Projektion, die die meisten Top-down-Pixelspiele verwenden?

      ![Drei Quadrate mit demselben Würfel. A ganz hellgrau, nur Oberseite. B oben hellgrau, unten mittelgrau, Oberseite und Front. C ganz mittelgrau, nur Front](/media/pixelart/grundkoerper-raum/draufsicht-projektionen@2x.png "Drei Ansichten desselben Würfels. Eigenes Schaubild")
    options:
      - text: B, weil Oberseite und Front zugleich zu sehen sind.
        correct: true
        why: Die 3/4-Draufsicht zeigt den Boden zum Laufen und die Front zum Erkennen. Slynyrd beschreibt sie als Blick aus 45° von oben.
      - text: A, weil die Kamera in Top-down-Spielen senkrecht nach unten schaut.
        correct: false
        why: Reine Draufsicht gibt es, aber Figuren sind dort nur Kopf und Schultern. Die meisten Pixelspiele kippen die Ansicht, damit man Figuren erkennt.
      - text: C, weil Figuren von der Seite am besten zu erkennen sind.
        correct: false
        why: Die Seitenansicht zeigt keinen Boden, auf dem man in alle Richtungen läuft. Sie gehört zu Jump-'n'-Runs.
      - text: Keines, Top-down-Spiele brauchen Zweipunktperspektive.
        correct: false
        why: Mit Fluchtpunkten sähe jedes Tile je nach Lage anders aus. Spiele nutzen deshalb Parallelprojektionen.
    explanation: |
      Die 3/4-Draufsicht ist ein Kompromiss. Sie zeigt genug vom Boden, um Wege und Hindernisse zu lesen, und genug von der Front, um Figuren und Gegenstände zu erkennen. Wikipedia nennt das die Verbindung von „visibility and mobility“ der Draufsicht mit der „character recognizability“ der Seitenansicht.
    resources:
      - title: Wikipedia · 2.5D · Axonometric and oblique projection
        url: https://en.wikipedia.org/wiki/2.5D#Axonometric_and_oblique_projection

  - id: tiefenhinweise
    type: choice
    title: Was zeigt Tiefe in der 3/4-Draufsicht?
    prompt: |
      Du zeichnest eine Szene in 3/4-Draufsicht als Parallelprojektion. Welche Tiefenhinweise funktionieren dort?
    options:
      - text: Überschneidung – eine Kiste verdeckt teilweise das Fass dahinter.
        correct: true
        why: Überschneidung wirkt in jeder Projektion, auch ohne Fluchtpunkte.
      - text: Lage im Bild – was weiter unten steht, ist näher und darf verdecken, was weiter oben steht.
        correct: true
        why: In der Draufsicht entspricht „unten im Bild“ dem Vordergrund.
      - text: Größe – entfernte Kisten werden kleiner gezeichnet.
        correct: false
        why: In der Parallelprojektion haben gleiche Objekte überall dieselbe Größe. Sonst ließen sie sich nicht wiederholen.
      - text: Fluchtlinien – die Kanten aller Kisten laufen auf einen Punkt zu.
        correct: false
        why: Parallele Kanten bleiben parallel. Fluchtlinien gehören zur Perspektive, nicht zur Spielprojektion.
    explanation: |
      Ohne Perspektive fallen Größe und Fluchtlinien als Tiefenhinweise weg. Was bleibt, sind Überschneidung und Lage im Bild, und beide reichen, weil der Spieler die Projektion nach wenigen Sekunden gelernt hat. Licht und Schatten auf dem Boden helfen zusätzlich, Objekte auf den Boden zu stellen.
    resources:
      - title: Wikipedia · Oblique projection
        url: https://en.wikipedia.org/wiki/Oblique_projection

  - id: kiste-zweipunkt
    type: order
    title: Eine Kiste in Zweipunktperspektive
    prompt: |
      Bring die Schritte für eine Kiste unter dem Horizont in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Den Horizont als waagerechte Linie ziehen.
      Zwei Fluchtpunkte weit auseinander auf den Horizont setzen.
      Die vordere senkrechte Kante unterhalb des Horizonts zeichnen.
      Von beiden Enden dieser Kante Linien zu beiden Fluchtpunkten ziehen.
      Die beiden hinteren senkrechten Kanten dort setzen, wo die Seiten enden sollen.
      Von deren oberen Enden Linien zum jeweils anderen Fluchtpunkt ziehen, bis sie sich kreuzen.
    alternatives:
      - [3, 1, 2, 4, 5, 6]
      - [1, 3, 2, 4, 5, 6]
    hints:
      - Die Fluchtpunkte liegen auf dem Horizont, also muss der zuerst da sein.
    explanation: |
      Horizont und Fluchtpunkte legen den Raum fest, die vordere Kante setzt die Kiste hinein. Ob du die Kante vor oder nach dem Horizont zeichnest, ist gleich, die Fluchtpunkte brauchen aber den Horizont. Die Linien zu den Fluchtpunkten bilden die Seiten, die hinteren Senkrechten begrenzen sie. Die letzte Kreuzung schließt die Oberseite, die du siehst, weil die Kiste unter deiner Augenhöhe liegt.
    resources:
      - title: Krita Docs · Painting with Assistants · Linear Perspective
        url: https://docs.krita.org/en/user_manual/painting_with_assistants.html#linear-perspective

  - id: kistenhoehe
    type: output
    title: Wie hoch wird das Sprite?
    prompt: |
      Eine Kiste in 3/4-Draufsicht wie im Schaubild B. Wie viele Pixel hoch ist das ganze Sprite? Antworte mit der Zahl.
    lang: text
    code: |
      Kontur oben:      1 Reihe
      Oberseite:        7 Reihen
      Front:            5 Reihen
      Kontur unten:     1 Reihe
    expected: |
      14
    accept:
      - 14 px
      - 14 Pixel
    explanation: |
      1 + 7 + 5 + 1 = 14. In der 3/4-Draufsicht setzt sich die Höhe eines Sprites aus Oberseite und Front zusammen, nicht aus der echten Höhe des Gegenstands. Deshalb ist eine Kiste im Spiel höher als breit, wenn ihre Oberseite viel Platz bekommt. Leg diese Aufteilung einmal fest und nutze sie für alle Objekte.
    resources:
      - title: Slynyrd · Pixelblog 3 · Graphical Projections
        url: https://www.slynyrd.com/blog/2018/3/14/pixelblog-3-graphical-projections-1

  - id: ellipse-verkuerzt
    type: output
    title: Ein Fass neben der Kiste
    prompt: |
      In deiner Szene sind Oberseiten auf die halbe Tiefe verkürzt. Ein Fass mit runder Oberseite soll so breit werden wie die Kiste. Wie viele Pixel hoch wird die Ellipse der Oberseite? Antworte mit der Zahl.
    lang: text
    code: |
      Kiste:  16 px breit, Oberseite 8 Reihen tief
      Regel:  Oberseiten auf die halbe Tiefe verkürzt
      Fass:   Durchmesser 16 px
    expected: |
      8
    accept:
      - 8 px
      - 8 Pixel
    hints:
      - Ein Kreis ist in alle Richtungen gleich breit. Welche Richtung wird verkürzt?
    explanation: |
      Der Kreis ist 16 Pixel breit und 16 Pixel tief. Die Breite bleibt, die Tiefe wird wie bei der Kiste halbiert: 16 × 0,5 = 8. Die Ellipse ist also 16 × 8 Pixel groß. Gibst du dem Fass eine andere Verkürzung als der Kiste, sieht es aus, als stünde es auf einem anders geneigten Boden.
    resources:
      - title: Drawabox · Lesson 1 · Ellipses
        url: https://drawabox.com/lesson/1/5

  - id: fluchtpunkte-zaehlen
    type: output
    title: Wo laufen die Kanten zusammen?
    prompt: |
      Zehn gleiche Kisten stehen in 3/4-Draufsicht nebeneinander, gezeichnet wie im Schaubild B. Du verlängerst die Kanten, die in die Tiefe laufen, also die seitlichen Kanten der Oberseiten. In wie vielen Punkten treffen sie sich? Antworte mit einer Zahl.
    lang: text
    code: |
      Projektion:  3/4-Draufsicht, Parallelprojektion
      Kisten:      10, alle gleich gezeichnet
      verlängert:  Seitenkanten der Oberseiten
    expected: |
      0
    accept:
      - null
      - keinem
      - in keinem
      - keine
    explanation: |
      In einer Parallelprojektion bleiben parallele Kanten parallel und treffen sich nie. Die zehn Kisten sind identisch, egal wo sie stehen. Genau das macht Tiles und wiederholte Objekte möglich. In Perspektive liefen genau diese Tiefenkanten auf einen Fluchtpunkt zu, und jede Kiste sähe je nach Lage im Bild anders aus.
    resources:
      - title: Wikipedia · Oblique projection
        url: https://en.wikipedia.org/wiki/Oblique_projection

  - id: begriffe-raum
    type: gap
    title: Wörter für den Raum
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Die waagerechte Linie auf deiner Augenhöhe heißt ⟦Horizont⟧. Parallele Kanten, die von dir weglaufen, treffen sich im ⟦Fluchtpunkt⟧. Dass eine Strecke kürzer erscheint, wenn sie von dir weg zeigt, nennt man ⟦Verkürzung⟧. Ein Kreis, den du schräg siehst, erscheint als ⟦Ellipse⟧. Die Bewegung eines Strichs in der Luft zu üben, bevor du ihn setzt, heißt ⟦Ghosting⟧. Eine Projektion, in der parallele Kanten parallel bleiben, heißt ⟦Parallelprojektion⟧.
    gaps:
      - label: Augenhöhe
        hint: Am Meer siehst du ihn als Linie zwischen Wasser und Himmel.
        accept: ["Horizontlinie", "Augenhöhe", "Horizontale"]
      - label: Treffpunkt
        hint: Zusammengesetzt aus „Flucht“ und einem kleinen Wort.
        accept: ["vanishing point", "Fluchtpunkten"]
      - label: kürzer erscheinen
        hint: Auf Englisch „foreshortening“.
        accept: ["foreshortening", "perspektivische Verkürzung"]
      - label: schräger Kreis
        hint: Eine Planetenbahn hat diese Form.
        accept: ["Ellipsen", "Oval"]
      - label: Luftübung
        hint: Englisch, darin steckt „ghost“.
        accept: ["ghosten", "Luftstrich"]
      - label: ohne Fluchtpunkte
        hint: Zusammengesetzt aus „parallel“ und „Projektion“.
        accept: ["Parallelperspektive", "schiefe Projektion", "oblique projection", "axonometrische Projektion"]
    explanation: |
      Horizont, Fluchtpunkt und Verkürzung beschreiben Perspektive, die Ellipse ist ihr Sonderfall für Kreise. Ghosting ist die Technik, mit der du diese Linien sicher setzt. Die Parallelprojektion ist das, was Spiele stattdessen verwenden. Wer beide Seiten kennt, kann begründen, warum ein Spiel auf Fluchtpunkte verzichtet.
    resources:
      - title: Drawabox · Lesson 1 · Ghosted Lines
        url: https://drawabox.com/lesson/1/ghostedlines

  - id: fass-ohne-boden
    type: bug
    title: Das Fass steckt im Boden
    prompt: |
      Ein Fass in 3/4-Draufsicht, `#` ist Kontur, `-` die helle Oberseite, `+` der Mantel. Es wirkt unten wie abgeschnitten, als stecke es im Boden oder sei eine Kiste. Finde die Zeile.
    lang: text
    code: |
      . . # # # # # # . .
      . # - - - - - - # .
      # - - - - - - - - #
      # + - - - - - - + #
      # + + + + + + + + #
      # + + + + + + + + #
      # + + + + + + + + #
      # + + + + + + + + #
      # # # # # # # # # #
    lines: [9]
    hints:
      - Vergleiche die oberste Zeile mit der untersten.
    explanation: |
      Die Unterkante ist gerade, die Oberkante ein Bogen. Der Boden eines Zylinders ist aber dieselbe Ellipse wie die Oberseite, von ihr siehst du nur die vordere Hälfte. Richtig wäre ein Bogen über zwei Zeilen, etwa `. # + + + + + + # .` und darunter `. . # # # # # # . .`, gespiegelt zur Oberkante. Erst dann steht das Fass auf dem Boden.
    resources:
      - title: Drawabox · Lesson 1 · Ellipses
        url: https://drawabox.com/lesson/1/5

  - id: gemischte-projektion
    type: bug
    title: Ein Haus passt nicht ins Bild
    prompt: |
      Lehrbeispiel: Asset-Liste für eine Dorfszene. Im Mockup wirkt ein Objekt, als stünde es schief zur übrigen Szene, und beim Scrollen springt es ins Auge. Finde die Zeile.
    lang: prose
    code: |
      Kiste: 3/4-Draufsicht, Oberseite und Front, Senkrechte senkrecht.
      Fass: 3/4-Draufsicht, Ellipse oben, Mantel darunter.
      Brunnen: 3/4-Draufsicht, Ellipse oben, Mauerring darunter.
      Haus: Zweipunktperspektive, Wände laufen zu zwei Fluchtpunkten.
      Zaun: 3/4-Draufsicht, Latten senkrecht, Oberkanten sichtbar.
    lines: [4]
    explanation: |
      Alle Objekte folgen der 3/4-Draufsicht ohne Fluchtpunkte, nur das Haus nicht. Seine Wände laufen zusammen, und beim Scrollen bleibt diese Verzerrung stehen, während sich die Kamera bewegt. Slynyrd rät, Projektionen in einer Szene nicht zu mischen. Zeichne das Haus mit derselben Verkürzung wie die Kiste: Dach als Oberseite, Fassade als Front.
    resources:
      - title: Slynyrd · Pixelblog 3 · Graphical Projections
        url: https://www.slynyrd.com/blog/2018/3/14/pixelblog-3-graphical-projections-1

  - id: warum-schummeln
    type: explain
    title: Ein Dorf ohne Fluchtpunkte
    prompt: |
      Lehrbeispiel: Ein Top-down-Pixelspiel zeigt ein Dorf. Erkläre in drei bis fünf Sätzen, warum das Spiel keine echte Perspektive verwendet und was es durch die gewählte Ansicht gewinnt.
    lang: prose
    code: |
      Häuser zeigen Dach und Fassade zugleich. Alle Senkrechten sind senkrecht, nichts läuft zusammen. Der Boden besteht aus Tiles von 16 × 16 Pixeln, die sich wiederholen. Ein Brunnen sieht links am Bildrand genauso aus wie in der Mitte. Figuren sieht man fast von vorn, nicht als Kopf von oben.
    points:
      - In der Parallelprojektion sieht jede Kopie eines Objekts überall gleich aus; so lassen sich Tiles wiederholen und die Kamera scrollen.
      - Mit Fluchtpunkten müsste jedes Objekt je nach Lage im Bild anders gezeichnet sein.
      - Oberseite und Front zugleich zeigen den Boden zum Laufen und die Front zum Erkennen.
      - Reine Draufsicht zeigte Figuren nur als Kopf und Schultern, deshalb wird die Ansicht gekippt.
      - Einheitlichkeit geht vor Realismus, solange alle Objekte derselben Projektion folgen.
    explanation: |
      Das Dorf ist in einer schiefen Parallelprojektion gezeichnet. Weil parallele Kanten parallel bleiben, sieht der Brunnen überall gleich aus, und dieselben Tiles passen an jede Stelle. Echte Perspektive würde jedes Objekt je nach Lage verzerren und beim Scrollen verändern. Die gekippte Ansicht zeigt Dach und Fassade, Boden und Figuren zugleich, eine reine Draufsicht ließe von Figuren nur Kopf und Schultern übrig. Slynyrd fasst den Preis zusammen: Die Ansicht ist nicht realistisch, aber einheitlich, und das zählt in Pixelart mehr.
    resources:
      - title: Wikipedia · 2.5D · Axonometric and oblique projection
        url: https://en.wikipedia.org/wiki/2.5D#Axonometric_and_oblique_projection

  - id: grundkoerper-zerlegen
    type: practice
    title: Drei Gegenstände, aus Körpern gebaut
    prompt: |
      Wähle drei Gegenstände in deiner Nähe, zum Beispiel eine Flasche, einen Rucksack und einen Mülleimer. Zeichne jeden als Zusammensetzung aus Grundkörpern, je etwa drei Zentimeter groß. Beschrifte jeden Teil mit dem Namen seines Körpers.
    lang: prose
    checklist:
      - Jeder der drei Gegenstände besteht aus mindestens zwei Grundkörpern, und jeder Teil ist beschriftet.
      - Bei jedem Zylinder zeigt die kurze Achse der Ellipse entlang der Mittelachse.
      - Wo zwei Körper sich überschneiden, verdeckt der vordere den hinteren, ohne dass Linien durchlaufen.
      - Bei jedem stehenden Zylinder ist die Unterkante ein Bogen, keine Gerade.
      - Du hast notiert, welcher Teil dir am schwersten fiel und warum.
    hints:
      - Ein Rucksack ist ein Quader mit abgerundeter Oberseite, die Träger sind gebogene Zylinder.
    explanation: |
      Die Zerlegung trainiert den Blick, mit dem du später Figuren und Kreaturen baust. Die Beschriftung zwingt dich, für jeden Teil eine Form zu wählen, statt Umrisse nachzuzeichnen. Ellipsenachse und Unterkante sind die zwei Fehler, die bei Zylindern am häufigsten auffallen, deshalb stehen sie in der Liste.
    resources:
      - title: Drawabox · Lesson 2 · Form Intersections
        url: https://drawabox.com/lesson/2/formintersections

  - id: kisten-unterwegs
    type: practice
    title: Zwanzig Kisten im Bus
    prompt: |
      Zeichne zwanzig Kisten in Zweipunktperspektive, jede etwa zwei Zentimeter groß, mit dem Horizont auf jeder Seite als Linie. Ghoste jede Linie, bevor du sie setzt. Verlängere bei den letzten fünf Kisten die Kanten mit einem helleren Strich, bis du siehst, ob sie auf die Fluchtpunkte zulaufen.
    lang: prose
    checklist:
      - Auf deinen Seiten stehen zwanzig Kisten, jede mit Horizont und zwei Fluchtpunkten.
      - Bei den letzten fünf Kisten sind alle Kanten bis in die Nähe der Fluchtpunkte verlängert.
      - Du hast notiert, welche Kanten bei der Verlängerung am deutlichsten danebenlaufen.
      - Alle senkrechten Kanten sind senkrecht, geprüft am Heftrand.
      - Keine Linie ist nachgezogen oder mehrfach übermalt.
    hints:
      - Liegt eine Kiste über dem Horizont, siehst du ihre Unterseite statt der Oberseite.
    explanation: |
      Kisten zeigen jeden Perspektivfehler sofort, weil ihre Kanten parallel sein müssen. Die Verlängerung macht sichtbar, was dein Auge noch nicht schätzen kann. Die Notiz der Abweichungen zeigt dir, ob du eher die Fluchtpunkte zu nah setzt oder die Kanten aus dem Handgelenk biegst. Mit der 250 Box Challenge kannst du das später ausbauen.
    resources:
      - title: Drawabox · 250 Box Challenge
        url: https://drawabox.com/lesson/250boxes

  - id: kiste-und-fass-projektion
    type: practice
    title: Kiste und Fass in einer Projektion
    prompt: |
      Leg auf Karopapier eine Projektionsregel fest: wie stark Oberseiten verkürzt werden und woher das Licht kommt. Zeichne danach eine Kiste mit quadratischer Grundfläche und ein Fass, beide 12 Kästchen breit, in dieser 3/4-Draufsicht nebeneinander. Fülle Oberseiten und Fronten mit drei Tönen: leer, schraffiert, ausgefüllt.
    lang: prose
    starter: |
      Verkürzung der Oberseite:
      Lichtrichtung:
      Kiste – Oberseite / Front in Kästchen:
      Fass – Ellipse / Mantel in Kästchen:
    checklist:
      - Die Regel steht über der Zeichnung, mit Verkürzung als Bruch oder Zahl und Lichtrichtung als Pfeil.
      - Oberseite der Kiste und Ellipse des Fasses haben dieselbe Tiefe in Kästchen.
      - Alle senkrechten Kanten liegen auf Rasterlinien, und keine Kante läuft auf einen Fluchtpunkt zu.
      - Die Unterkante des Fasses ist ein Bogen mit derselben Krümmung wie die Oberkante, gespiegelt.
      - Die helle Seite liegt bei beiden Objekten auf der Seite, aus der laut Regel das Licht kommt.
    hints:
      - Rechne die Tiefe der Ellipse aus der Regel aus, bevor du das erste Kästchen füllst.
    explanation: |
      Diese Aufgabe ist der Kern jeder Asset-Arbeit in Top-down-Spielen: erst die Regel, dann die Objekte. Die überprüfbaren Punkte stellen sicher, dass beide Objekte auf demselben Boden stehen. Wie du sie danach im Pixel-Editor sauber setzt, zeigen die Module [Linien, Kurven und Cluster](/pixelart/linien-cluster) und [Umgebung und Tiles](/pixelart/umgebung-tiles).
    resources:
      - title: Slynyrd · Pixelblog 20 · Top Down Tiles
        url: https://www.slynyrd.com/blog/2019/8/27/pixelblog-20-top-down-tiles
