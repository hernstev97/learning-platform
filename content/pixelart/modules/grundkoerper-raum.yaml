id: grundkoerper-raum
title: Grundkörper, Perspektive und Draufsicht
level: 1
minutes: 110
summary: Wie du Gegenstände aus Würfel, Zylinder, Kugel und Kegel aufbaust, was Horizont, Fluchtpunkte, Verkürzung und Ellipsen bedeuten und warum Top-down-Spiele auf Fluchtpunkte verzichten und Oberseite und Front zugleich zeigen.
place: unterwegs
goals:
  - Du zerlegst Gegenstände in Grundkörper und nutzt Überschneidung und Lage im Bild als Tiefenhinweise.
  - Du erklärst Horizont, Fluchtpunkt und Verkürzung und zeichnest eine Kiste in Ein- und Zweipunktperspektive.
  - Du zeichnest Ellipsen passend zur Augenhöhe und zur Achse eines Zylinders.
  - Du unterscheidest reine Draufsicht, 3/4-Draufsicht und Seitenansicht und erkennst, welche ein Spiel verwendet.
  - Du begründest, warum Top-down-Spiele mit Parallelprojektion arbeiten, und hältst eine Projektion über mehrere Objekte durch.
