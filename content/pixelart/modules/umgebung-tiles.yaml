id: umgebung-tiles
title: Umgebung und Tiles, die Figuren tragen
level: 3
minutes: 140
summary: Wie du Kacheln zeichnest, die nahtlos aneinanderpassen, wie du sichtbare Wiederholung mit Varianten und seltenen Details brichst und warum ein ruhiger Boden in engem Tonwertbereich die Figur trägt, statt sie zu verschlucken.
place: pc
goals:
  - Du wählst eine Kachelgröße passend zu Spritegröße und Bildschirmauflösung und rechnest aus, wie viele Kacheln ein Bild füllen.
  - Du zeichnest nahtlose Kacheln mit Tiled Mode oder Tile Mode und erkennst Nähte an Kachelgrenzen.
  - Du brichst Wiederholung mit Varianten, seltenen Details und Clustern, die über die Kachelränder laufen.
  - Du planst Tonwerte und Sättigung so, dass der Boden ruhig bleibt und Figuren, Hindernisse und Gefahren hervortreten.
  - Du machst begehbare Flächen und Hindernisse über Tonwert und Kante eindeutig und prüfst das in einem Mockup.
