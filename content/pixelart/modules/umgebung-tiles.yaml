    url: https://gurneyjourney.blogspot.com/2019/12/why-should-i-mass-values.html
lesson: |
  Du hast eine Graskachel von 16 × 16 Pixeln gezeichnet, mit einem hübschen Büschel und einer gelben Blume. Einzeln sieht sie gut aus. Dann legst du sie 40-mal nebeneinander und 23-mal untereinander, so viele braucht ein Bild von 640 × 360 Pixeln. Jetzt siehst du kein Gras mehr, sondern ein Gitter aus 920 gleichen Blumen. Und deine Figur, die über diese Wiese läuft, verschwindet zwischen hellen und dunklen Punkten.

  Eine gute Kachel ist keine schöne Einzelzeichnung. Sie muss an jeder Seite in sich selbst übergehen, darf sich in der Wiederholung nicht verraten und muss sich hinter die Figur zurückziehen. Dieses Modul behandelt alle drei Aufgaben. Wie Godot Kacheln zu einer Karte zusammensetzt und Kollisionen zuordnet, steht in [2D-Level aus Tiles](/godot/level-tilemap); hier geht es um das Zeichnen.

  ## Kachelgröße und Raster

  Raymond Schlitter (Slynyrd) erklärt, warum es Tiles gibt: Frühe Computer hatten wenig Speicher, also zerlegte man Bilder in kleine Quadrate, die sich wiederholen und kombinieren lassen. Tiles sparen Speicher und Zeichenzeit, und ihr Raster ist „a logical base to map gameplay onto“ ([Pixelblog 20](https://www.slynyrd.com/blog/2019/8/27/pixelblog-20-top-down-tiles)). Zur Größe schreibt er: „16x16px is probably the most common size“, und alles über 32 × 32 Pixel hält er für Pixelart für übertrieben.

  Die Kachelgröße hängt mit allem anderen zusammen. Slynyrd nennt „1 tile wide by 2 tiles tall“ eine der häufigsten Spritegrößen für Top-down-Figuren ([Pixelblog 22](https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites)). Bei 16er-Kacheln ist eine Figur dann 16 × 32 Pixel groß. Wie du Figuren, Türen, Kisten und große Kreaturen in einem Maßstab hältst, behandelt [Ansichten, Maßstab und große Kreaturen](/pixelart/ansichten-massstab).

  Auch die Bildschirmgröße zählt. Die Godot-Doku nennt für Pixelart-Spiele 640 × 360 „a good baseline“, weil es ganzzahlig auf 1280 × 720, 1920 × 1080 und 3840 × 2160 skaliert ([Multiple resolutions: Desktop game](https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#desktop-game)). Mit 16er-Kacheln sind das 40 Spalten und 22,5 Reihen. Die halbe Reihe ist kein Fehler, sie zeigt nur, dass der Bildschirmrand eine Kachel anschneidet. Wie Godot das Bild ganzzahlig vergrößert, steht in [Pixelraster und Skalierung](/godot/pixelraster).

  Ein Asset-Set für eine Top-down-Umgebung besteht aus vier Gruppen:

  | Gruppe | Beispiel | Aufgabe |
  | --- | --- | --- |
  | Boden | Gras, Erde, Pflaster | begehbar, wiederholt sich am häufigsten |
  | Wand | Mauer, Felskante | blockiert, zeigt Oberseite und Front |
  | Hindernis | Stein, Kiste, Baumstumpf | blockiert einzeln, steht auf dem Boden |
  | Requisite | Fass, Schild, Pflanze | erzählt, blockiert oder nicht |

  Wände und Hindernisse zeigst du in der 3/4-Draufsicht mit Oberseite und Front. Slynyrd beschreibt sie „as if you are viewing the house from 45 degrees above“ ([Pixelblog 3](https://www.slynyrd.com/blog/2018/3/14/pixelblog-3-graphical-projections-1)), Grundlagen dazu in [Grundkörper, Perspektive und Draufsicht](/pixelart/grundkoerper-raum).

  ## Nahtlose Kacheln: Tiled Mode und Tile Mode

  ![Zwei Flächen aus je 3 × 3 gleichen Steinkacheln. In A enden die Steine genau an den Kachelgrenzen, gerade Fugen bilden ein sichtbares Gitter. In B laufen die Steine über die Kachelgrenzen hinweg, kein Gitter ist zu erkennen](/media/pixelart/umgebung-tiles/kachelnaht@2x.png "Steinkachel mit sichtbaren Nähten (A) und nahtlos (B), jeweils 3 × 3-mal wiederholt. Eigenes Schaubild")

  In A ist jede Kachel für sich gezeichnet. Die Steine hören am Rand auf, und alle 16 Pixel läuft eine gerade Fuge über die ganze Fläche. Das Auge findet dieses Gitter sofort. In B laufen Steine über den rechten Rand und kommen links wieder herein, ebenso oben und unten. Slynyrd nennt solche Gruppen zusammenhängender Pixel Cluster: „Include clusters that overlap the edges and loop around the tile to help hide the seems.“

  Bedienung: Leg eine Leinwand in genau der Kachelgröße an. In Aseprite schaltest du `View › Tiled Mode › Tiled in Both Axes` ein ([Tiled Mode](https://www.aseprite.org/docs/tiled-mode/)), in Pixelorama `View › Tile Mode › Tiled in Both Axis`. Beide Programme zeigen die Kachel dann mehrfach um die Leinwand herum. In Pixelorama kannst du laut Doku auch im wiederholten Bereich zeichnen ([Tile Mode](https://pixelorama.org/user_manual/user_interface/canvas/#tile-mode)). Slynyrd beschreibt das für Aseprite so: „anything you draw will live update in all the cells.“ Einen Stein, der über den rechten Rand ragt, siehst du sofort links wieder auftauchen.

  Ein zweites Werkzeug ist das Verschieben mit Umbruch. Pixelorama hat dafür den Effekt **Offset** im Menü `Effects`: Pixel, die rechts hinauslaufen, „re-appears on the left side“ ([Image effects](https://pixelorama.org/user_manual/image_effects/#list-of-image-effects)). Verschiebst du eine Kachel um ihre halbe Breite und Höhe, liegen die Ränder in der Mitte, und jede Naht wird zu einer sichtbaren Linie, die du übermalst.

  Tiled Mode ist eine Zeichenhilfe für eine einzelne Kachel. Aseprite nennt ihn „simpler than tilemaps“. Ein Tileset mit vielen Kacheln, die in beliebiger Anordnung eine Karte bilden, baust du in Godot ([2D-Level aus Tiles](/godot/level-tilemap)). Dort steht auch, woher Linien zwischen Tiles kommen, die erst in der Engine entstehen. Die Nähte hier sind dagegen Teil der Zeichnung.

  > [!TIP] Prüfen im Vorschaufenster
  > Slynyrd empfiehlt beim Arbeiten an Tiles ein Vorschaufenster, das die Szene verkleinert zeigt, „allowing you to see how it appears from a normal viewing distance“. In Aseprite ist das die Vorschau, in Pixelorama die Second Canvas. Prüf jede Kachel in mindestens 3 × 3 Wiederholung bei 1×.

  ## Wiederholung brechen

  Nahtlos heißt noch nicht unauffällig. Slynyrd: „you don't want the tiles to be too obvious. The trick is in trying to hide the patterns within consistent non-distracting textures.“

  ![Zwei grüne Rasenflächen aus 4 × 3 Kacheln. In A ist es überall dieselbe Kachel mit einer gelben Blume, die Blumen stehen in einem genauen Raster. In B sind vier verschiedene Kacheln gemischt, nur fünf Blumen stehen unregelmäßig verteilt](/media/pixelart/umgebung-tiles/wiederholung@2x.png "Eine Kachel mit auffälliger Blume, 4 × 3-mal wiederholt (A), und vier Varianten gemischt (B). Eigenes Schaubild")

  A und B nutzen dasselbe Grün und dieselben Büschel. In A steht die Blume in jeder Kachel an derselben Stelle, und aus zwölf Blumen wird ein Raster. In B gibt es vier Varianten: eine mit Blume oben rechts, eine mit Blume unten links, zwei ohne. Die Blumen verteilen sich unregelmäßig, das Raster verschwindet. Slynyrds Rat für Gras: „a grass texture made up of only one tile becomes monotonous, no matter how awesome the tile is.“ Er mischt flache Grünflächen mit Flächen verschiedener Dichte und streut „occasional flower variants“ ein.

  Seine Grundsätze für Tiles fasst er in fünf Punkten zusammen:

  - **Balance:** Das visuelle Gewicht ist gleichmäßig über die Kachel verteilt. „If any area of the tile has a visual dominance the pattern will become too obvious.“
  - **Consistency:** Dieselben Schlüsselcluster wiederholen, aber nicht aneinanderstoßen lassen, sonst klumpen sie zu Rauschen. Ecke an Ecke ist in Ordnung.
  - **Limit colors:** Wenige Farben reichen. Stark kontrastierende Farben in einem Muster ergeben „displeasing noise“.
  - **Contrast:** Eine unruhige Textur neben einer anderen unruhigen ermüdet das Auge. „Negative space is your friend.“
  - **Reflect:** Kacheln lassen sich spiegeln, um Varianten für andere Richtungen zu bekommen.

  Daraus ergibt sich ein Arbeitsablauf für Varianten. Die Grundkachel bleibt die häufigste. Jede Variante ist eine Kopie der Grundkachel, bei der du nur das Innere änderst, die Randpixel bleiben gleich. So passt jede Variante an jede andere. Auffällige Details wie Blumen, Risse oder Pilze kommen nur in seltene Varianten. Beim Spiegeln achte auf die Lichtrichtung: Eine gespiegelte Kachel mit Licht von oben links hat danach Licht von oben rechts. Spiegeln ist deshalb für Texturen ohne Lichtkanten sicher. Steine mit Lichtkante spiegelst du nicht: Horizontal wandert das Licht nach rechts, vertikal nach unten.

  Valve beschreibt für Team Fortress 2 dasselbe Ziel in drei Dimensionen: Wiederholte Strukturen wie Brückenstreben oder Telegrafenmasten blieben bewusst wenige, weil „conveying the impression of repetition in the space is more important than representing every detail explicitly“ ([NPAR 2007](https://media.steampowered.com/apps/valve/2007/NPAR07_IllustrativeRenderingInTeamFortress2.pdf), Abschnitt 4.2).

  ## Der Boden trägt die Figur

  ![Zwei Top-down-Szenen mit derselben Figur in der Mitte und vier Steinen. In A ist der Boden ein unruhiges Muster aus sehr hellem und sehr dunklem Grün, die Steine sind fast weiß mit schwarzer Kontur, die Figur ist blass und geht im Boden unter. In B ist der Boden ein ruhiges, gedämpftes Grün mit wenig Unterschied zwischen den Tönen, die Steine sind gedämpft grau, die Figur hat kräftige Farben und hebt sich klar ab](/media/pixelart/umgebung-tiles/kontrast-ebenen@2x.png "Unruhiger, kontrastreicher Boden (A) und ruhiger Boden in engem Tonwertbereich (B). Eigenes Schaubild")

  In A hat der Boden den größten Tonwertbereich des Bildes, von fast Schwarz bis fast Weiß. Die Steine haben den stärksten Kontrast, die Figur den schwächsten. Das Auge springt zu den Steinen und findet die Figur nur mit Mühe. In B liegen alle Bodentöne nah beieinander, die Steine sind gedämpft, und nur die Figur nutzt kräftige Farben und dunkle Konturen.

  Diese Rangfolge ist gewollt. Valve legt für Team Fortress 2 fest, dass die Umgebung „Desaturated relative to players“ ist ([MIGS 2008](https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf)). Pedro Medeiros (Saint11) rät zu „large low saturation areas with small high saturation details“ ([Saturation](https://saint11.art/pixel_art_articles/article6/#saturation)). James Gurney begründet wenige, große Tonwertgruppen damit, dass ein Bild dann auch „when reduced to a tiny size“ noch lesbar ist ([Why should I mass values?](https://gurneyjourney.blogspot.com/2019/12/why-should-i-mass-values.html)), und schreibt an anderer Stelle „the fewer values the better“ ([How many values?](https://gurneyjourney.blogspot.com/2018/01/how-many-values.html)).

  Leg deshalb einen Werteplan fest, bevor du Tiles zeichnest. Auf der Neunerskala aus [Licht, Schatten und Tonwerte](/pixelart/licht-werte), 1 Weiß, 9 fast Schwarz:

  | Ebene | Tonwerte | Sättigung |
  | --- | --- | --- |
  | Boden | eng, etwa zwei bis drei Stufen | gedämpft |
  | Wände, Hindernisse | mittel, mit dunkler Kante | gedämpft bis mittel |
  | Figuren | voller Bereich | kräftig |
  | Gefahren | stärkster Kontrast zum Boden | kräftig |

  Die Zahlen sind ein Ausgangspunkt, kein Gesetz. Prüfen lässt sich der Plan mit dem Graustufentest aus [Farbe, Rampen und begrenzte Paletten](/pixelart/farbe-paletten): Im Graustufenbild soll die Figur das Erste sein, was du siehst. Wie Gegnerangriffe sich ankündigen und warum das lesbar sein muss, behandelt [Gegnermuster](/combat/gegnermuster).

  > [!MERKE]
  > Der Boden bekommt den engsten Tonwertbereich und die geringste Sättigung im Bild. Kontrast ist für das reserviert, was der Spieler sehen muss.

  ## Begehbar oder Hindernis: Tonwert und Kante

  Der Spieler muss ohne Ausprobieren erkennen, wo er laufen kann. Keine der Quellen dieses Kurses gibt dafür eine feste Regel. Hier ein Vorschlag, den du prüfst und anpasst: Triff die Unterscheidung über mehrere Merkmale gleichzeitig und halte sie im ganzen Spiel durch.

  - **Kante:** Begehbare Flächen haben keine Kontur, Hindernisse eine dunkle Kante, mindestens an der Unterseite.
  - **Höhe:** Hindernisse zeigen in der 3/4-Draufsicht eine Front. Eine sichtbare Front heißt: Das steht hoch.
  - **Schatten:** Hindernisse werfen einen kleinen Schatten auf den Boden, Bodenflecken nicht.
  - **Tonwert:** Gruben und Abgründe sind die dunkelsten Flächen der Umgebung.

  Ein Bodenfleck aus dunklem Gras darf deshalb keine dunkle Kante bekommen, sonst liest er sich als Stein. Ein flacher Stein, über den man laufen kann, braucht entweder keine Front oder eine eigene, im Spiel gelernte Regel. Requisiten, die blockieren oder die Figur verdecken können, zeichnest du als eigene Sprites statt in die Bodenkachel. Kollisionen ordnest du in Godot den Kacheln zu ([2D-Level aus Tiles](/godot/level-tilemap)).

  Die Umgebung kann auch erzählen: eine zertretene Stelle im Gras, ein umgekippter Eimer, ein Riss, der zu einer Tür führt. Solche Spuren sind seltene Varianten mit Absicht. Wie man sie plant, zeigt [Erzählen über Handlung, Umgebung und Folgen](/narrative/umgebung-erzaehlt). Halte sie selten, sonst werden sie zum Muster.

  > [!PRAXIS]
  > Slynyrd baut ein Top-down-Set in Schichten: zuerst Graskacheln mit Varianten, dann Erde in einem Stil, der zum Gras passt, dann Übergangskacheln zwischen beiden. Erst danach ordnet er Kacheln zu Karten an. Für Tiles nutzt er selbst ein Spezialprogramm, Pyxel Edit; für Aseprite beschreibt er den Weg mit einer Leinwand in genau der Kachelgröße und Tiled Mode. Wichtig ist ihm, die Nähte beim Zeichnen live zu sehen und ein verkleinertes Vorschaufenster offen zu haben ([Pixelblog 20](https://www.slynyrd.com/blog/2019/8/27/pixelblog-20-top-down-tiles)). Übernimm die Reihenfolge: erst den häufigsten Boden, dann was daran anschließt, zuletzt die Ausnahmen.

  > [!INTERVIEW]
  > Stellenanzeigen für 2D Artists in Indie-Studios verlangen oft Perspektive und eigene Arbeit. Pine Creek Games nennt „good knowledge of perspective“ und „Not using AI in their work“ ([Stellenanzeige](https://workwithindies.com/careers/pine-creek-games-2d-artist)). Rechne im Gespräch mit der Frage: „Deine Kacheln wiederholen sich sichtbar. Was tust du?“ Gute Antwort: Du nennst die Ursache – ein Element mit zu viel Gewicht oder Nähte am Rand – und deine Mittel: Gewicht gleichmäßig verteilen, Cluster über die Ränder führen, Varianten mit gleichen Rändern, auffällige Details nur in seltenen Varianten. Dann zeigst du vorher und nachher in 3 × 3 Wiederholung bei 1×.

  ## Häufige Fehler

  - **Einzeln schön, zusammen ein Gitter.** Jede Kachel nur in Wiederholung beurteilen, mindestens 3 × 3.
  - **Nähte an den Rändern.** Cluster enden genau an der Kachelgrenze. Mit Tiled Mode über die Ränder zeichnen oder mit Offset die Ränder in die Mitte holen.
  - **Ein Blickfang in der Grundkachel.** Eine Blume oder ein Stein mit viel Gewicht wird zum Raster. In seltene Varianten verschieben.
  - **Varianten mit eigenen Rändern.** Dann passen sie nicht an die Grundkachel. Ränder gleich lassen, nur das Innere ändern.
  - **Gespiegelte Lichtrichtung.** Eine gespiegelte Kachel mit Lichtkanten bricht das Licht der Szene.
  - **Kontrastreicher Boden.** Der Boden hat den größten Tonwertbereich, die Figur geht unter. Boden eng und gedämpft halten.
  - **Bodenfleck mit Kontur.** Dunkles Gras mit dunkler Kante liest sich als Hindernis.

  ## Zusammenfassung

  - 16 × 16 ist die häufigste Kachelgröße. Eine Figur von 1 × 2 Kacheln misst dann 16 × 32 Pixel, ein Bild von 640 × 360 hat 40 × 22,5 Kacheln.
  - Nahtlos wird eine Kachel, wenn Cluster über die Ränder laufen. Tiled Mode, Tile Mode und Offset helfen dabei.
  - Wiederholung brichst du mit gleichmäßig verteiltem Gewicht, Varianten mit gleichen Rändern und seltenen Details.
  - Der Boden hat den engsten Tonwertbereich und die geringste Sättigung, Figuren und Gefahren den stärksten Kontrast.
  - Begehbar und Hindernis trennst du über Kante, Front, Schatten und Tonwert, gleichzeitig und im ganzen Spiel gleich.
  - Seltene Varianten können erzählen. Das Zusammensetzen der Karte und die Kollisionen erledigt Godot.
exercises:
  - id: naht-diagnose
    type: choice
    title: Woran sieht man die Naht?
    prompt: |
      Beide Flächen bestehen aus derselben Steinkachel, 3 × 3-mal wiederholt. Welche Aussagen treffen zu?

      ![Zwei Steinflächen. In A bilden gerade Fugen an den Kachelgrenzen ein Gitter. In B laufen die Steine über die Kachelgrenzen](/media/pixelart/umgebung-tiles/kachelnaht@2x.png "Zwei Fassungen derselben Steinkachel. Eigenes Schaubild")
    options:
      - text: In A enden die Steine an den Kachelgrenzen, deshalb entsteht alle 16 Pixel eine gerade Fuge.
        correct: true
        why: Die Grenzen der Kachel werden zu Linien, die über die ganze Fläche laufen. Das Auge liest sie als Gitter.
      - text: In B laufen Cluster über den Rand und kommen auf der gegenüberliegenden Seite wieder herein.
        correct: true
        why: Genau das empfiehlt Slynyrd, um Nähte zu verstecken. Tiled Mode zeigt es beim Zeichnen.
      - text: B braucht mehr Farben als A, um nahtlos zu sein.
        correct: false
        why: Beide nutzen dieselben Töne. Nahtlos wird eine Kachel durch die Lage der Cluster, nicht durch Farben.
      - text: Bei 1× verschwinden die Nähte von A.
        correct: false
        why: Gerade bei 1× sieht man das Gitter über große Flächen am deutlichsten, weil das Auge regelmäßige Linien sucht.
    explanation: |
      Eine Naht ist keine falsche Farbe, sondern eine Kante, die sich alle 16 Pixel wiederholt. Sie entsteht, wenn du jede Kachel als abgeschlossenes Bild zeichnest. Wer die Kachel als Ausschnitt einer endlosen Fläche zeichnet, mit Steinen über die Ränder, bekommt eine Fläche ohne Gitter.
    resources:
      - title: Slynyrd · Pixelblog 20 · Top Down Tiles
        url: https://www.slynyrd.com/blog/2019/8/27/pixelblog-20-top-down-tiles

  - id: kontrast-diagnose
    type: choice
    title: Warum verschwindet die Figur?
    prompt: |
      Welche Aussagen erklären, warum die Figur in A untergeht und in B nicht?

      ![Zwei Top-down-Szenen mit Figur und vier Steinen. A hat einen unruhigen Boden aus sehr hellem und sehr dunklem Grün, fast weiße Steine und eine blasse Figur. B hat einen ruhigen, gedämpften Boden, graue Steine und eine kräftige Figur](/media/pixelart/umgebung-tiles/kontrast-ebenen@2x.png "Zwei Böden, dieselbe Figur. Eigenes Schaubild")
    options:
      - text: In A hat der Boden einen größeren Tonwertbereich als die Figur.
        correct: true
        why: Der Boden reicht von fast Schwarz bis fast Weiß. Die Figur kann damit nicht konkurrieren.
      - text: In A haben die Steine den stärksten Kontrast im Bild und ziehen den Blick an.
        correct: true
        why: Fast weiße Flächen mit schwarzer Kontur sind das Auffälligste in der Szene, obwohl sie unwichtig sind.
      - text: In B ist die Figur nur deshalb sichtbar, weil sie größer gezeichnet ist.
        correct: false
        why: Die Figur ist in beiden Szenen gleich groß. Der Unterschied liegt in Tonwert und Sättigung von Boden und Figur.
      - text: In B wäre die Szene besser, wenn der Boden mehr Textur hätte.
        correct: false
        why: Mehr Textur vergrößert den Tonwertbereich des Bodens. Gerade die Ruhe des Bodens lässt die Figur hervortreten.
    explanation: |
      Das Auge geht zuerst zum stärksten Kontrast. In A liegt der im Boden und in den Steinen, in B in der Figur. Valve hält die Umgebung gegenüber den Spielern entsättigt, Saint11 rät zu großen ruhigen Flächen mit kleinen kräftigen Details. Ein Werteplan vor dem Zeichnen legt diese Rangfolge fest.
    resources:
      - title: Saint11 · Basic Color Theory · Saturation
        url: https://saint11.art/pixel_art_articles/article6/#saturation

  - id: kachel-ablauf
    type: order
    title: Von der leeren Leinwand zur Bodenkachel mit Varianten
    prompt: |
      Bring die Schritte in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Eine Leinwand in genau der Kachelgröße anlegen, 16 × 16 Pixel.
      Tiled Mode oder Tile Mode für beide Achsen einschalten.
      Die Grundtextur aus Clustern zeichnen, einige davon über die Ränder.
      Die Kachel in 3 × 3 Wiederholung bei 1× prüfen und Blickfänge abschwächen.
      Die Grundkachel kopieren und in den Kopien nur das Innere ändern.
      Ein Mockup mit Varianten, Hindernis und Figur bauen und in Graustufen prüfen.
    explanation: |
      Die Leinwand muss die Kachel genau umfassen, sonst wiederholt Tiled Mode den falschen Ausschnitt. Mit eingeschaltetem Modus zeichnest du die Grundtextur gleich nahtlos. Die Prüfung in Wiederholung kommt vor den Varianten, denn jeder Fehler der Grundkachel würde in alle Kopien übernommen. Varianten entstehen als Kopien, damit ihre Ränder passen. Erst das Mockup zeigt, ob der Boden die Figur trägt.
    resources:
      - title: Aseprite Docs · Tiled Mode
        url: https://www.aseprite.org/docs/tiled-mode/

  - id: kachelreihen
    type: output
    title: Wie viele Kachelreihen?
    prompt: |
      Ein Spiel zeigt ein Bild von 640 × 360 Pixeln, die Kacheln sind 16 × 16 Pixel groß. Wie viele Kachelreihen brauchst du mindestens, damit die Höhe ganz gefüllt ist? Antworte mit der Zahl.
    lang: text
    code: |
      Bild:   640 × 360 Pixel
      Kachel:  16 × 16 Pixel
    expected: |
      23
    accept:
      - 23 Reihen
      - dreiundzwanzig
    hints:
      - 360 ÷ 16 geht nicht ganz auf.
    explanation: |
      360 ÷ 16 = 22,5. Für eine halbe Reihe brauchst du trotzdem eine ganze Kachel, also 23 Reihen, von denen der Bildschirm eine anschneidet. In der Breite sind es 640 ÷ 16 = 40 Spalten. Zusammen zeigt ein Bild bis zu 40 × 23 = 920 Kacheln. So oft wiederholt sich eine einzelne Graskachel, wenn du keine Varianten hast.
    resources:
      - title: Godot Docs · Multiple resolutions · Desktop game
        url: https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#desktop-game

  - id: blumenkacheln
    type: output
    title: Wie viele Blumen auf dem Bildschirm?
    prompt: |
      Auf einem Bildschirm liegen 920 Bodenkacheln. Die Blumenvariante soll etwa jede achte Kachel sein. Wie viele Blumenkacheln sind das? Antworte mit der Zahl.
    lang: text
    code: |
      Kacheln auf dem Bildschirm: 920
      Anteil der Blumenvariante:  1 von 8
    expected: |
      115
    accept:
      - 115 Kacheln
      - etwa 115
      - ca. 115
    explanation: |
      920 ÷ 8 = 115. Das ist ein Achtel, aber immer noch viel: 115 gleiche Blumen auf einem Bildschirm. Ein seltenes Detail sollte deshalb noch seltener sein, als es sich im Plan anfühlt, oder es gibt mehrere Blumenvarianten an verschiedenen Stellen der Kachel. Die Rechnung hilft dir, die Häufigkeit vorher festzulegen, statt sie im Mockup zu erraten.
    resources:
      - title: Slynyrd · Pixelblog 20 · Top Down Tiles
        url: https://www.slynyrd.com/blog/2019/8/27/pixelblog-20-top-down-tiles

  - id: ueberstand
    type: output
    title: Wo taucht der Stein wieder auf?
    prompt: |
      Du zeichnest im Tiled Mode eine Kachel von 16 × 16 Pixeln. Ein Stein ragt drei Pixel über den rechten Rand hinaus. An welchem Rand der Kachel erscheinen diese drei Pixel? Antworte mit einem Wort.
    lang: text
    code: |
      Kachel: 16 × 16, Tiled Mode in beiden Achsen
      Stein:  ragt 3 px über den rechten Rand
    expected: |
      links
    accept:
      - linker Rand
      - am linken Rand
      - links am Rand
      - linke Seite
    explanation: |
      Die Kachel wiederholt sich. Was rechts hinausläuft, ist der Anfang der nächsten Kachel, und die beginnt mit dem linken Rand derselben Kachel. Deshalb erscheinen die drei Pixel links, in derselben Zeile. Genau das macht eine Kachel nahtlos: Der Stein ist in der Wiederholung ein ganzer Stein, obwohl er in der Datei an zwei Rändern liegt.
    resources:
      - title: Pixelorama · Image effects · Offset
        url: https://pixelorama.org/user_manual/image_effects/#list-of-image-effects

  - id: begriffe-tiles
    type: gap
    title: Begriffe rund um Tiles
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Eine kleine quadratische Grafik, die sich im Raster wiederholt, heißt ⟦Tile⟧. In Aseprite zeigt der ⟦Tiled⟧ Mode die Kachel beim Zeichnen mehrfach nebeneinander. Eine sichtbare Kante, die sich an jeder Kachelgrenze wiederholt, ist eine ⟦Naht⟧. Kopien der Grundkachel mit geändertem Inneren heißen ⟦Varianten⟧. Der Boden bekommt den engsten ⟦Tonwertbereich⟧ im Bild. Die Sammlung der Kacheln, aus der du in Godot eine Karte malst, heißt ⟦TileSet⟧.
    gaps:
      - label: Grafikbaustein
        hint: Englisch, deutsch „Kachel“.
        accept: ["Kachel", "Tiles"]
      - label: Modus
        hint: Englisch, das Partizip von „tile“.
        accept: ["Tile"]
      - label: Kante an der Grenze
        hint: Englisch „seam“.
        accept: ["Seam", "Kachelnaht"]
      - label: Kopien
        hint: Eine andere Fassung desselben Grundmusters.
        accept: ["Variante", "Kachelvarianten"]
      - label: Spanne der Helligkeit
        hint: Von der dunkelsten bis zur hellsten Stufe.
        accept: ["Wertebereich", "Tonwertumfang", "Helligkeitsbereich"]
      - label: Godot-Ressource
        hint: Steht in der Godot-Doku neben TileMapLayer.
        accept: ["Tile Set", "Tileset"]
    explanation: |
      Tile, Naht und Variante beschreiben die Kachel selbst. Tiled Mode ist das Werkzeug, mit dem du Nähte schon beim Zeichnen vermeidest. Der Tonwertbereich ist die Stellschraube für Lesbarkeit. Das TileSet gehört schon zur Engine, dort beginnt der Godot-Kurs.
    resources:
      - title: Aseprite Docs · Tiled Mode
        url: https://www.aseprite.org/docs/tiled-mode/

  - id: werteplan-boden
    type: bug
    title: Der Boden flimmert
    prompt: |
      Werteplan für eine Wiese auf der Neunerskala (1 Weiß, 9 fast Schwarz). Im Mockup flimmert der Boden, und die Figur verschwindet zwischen hellen und dunklen Punkten. Finde die Zeile.
    lang: prose
    code: |
      Gras: Tonwerte 5 bis 6, gedämpftes Grün.
      Weg: Tonwerte 5 bis 6, gedämpftes Ocker.
      Steine: Tonwerte 3 bis 7, dunkle Kontur, kleiner Schatten.
      Blumen im Gras: Tonwerte 1 bis 9, volle Sättigung, auf jeder dritten Kachel.
      Figur: Tonwerte 1 bis 8, kräftige Farben, dunkle Kontur.
    lines: [4]
    hints:
      - Welche Zeile gibt dem Boden den größten Tonwertbereich im Bild?
    explanation: |
      Die Blumen gehören zum Boden und bekommen trotzdem den vollen Bereich von Weiß bis fast Schwarz bei voller Sättigung, und das auf jeder dritten Kachel. Damit hat der Boden mehr Kontrast als die Figur und wird zu einem Punktmuster. Gras und Weg sind eng und gedämpft, die Steine als Hindernisse dürfen sich abheben. Besser: Blumen in zwei Tönen nahe am Gras, auf einer seltenen Variante.
    resources:
      - title: James Gurney · How many values?
        url: https://gurneyjourney.blogspot.com/2018/01/how-many-values.html

  - id: variante-mit-kante
    type: bug
    title: Eine gerade Kante im Gras
    prompt: |
      Notiz zu einem Graskachel-Set. Im Mockup sieht man hier und da eine gerade Kante im Gras, immer neben derselben Variante. Finde die Zeile.
    lang: prose
    code: |
      Grundkachel Gras: 16 × 16, Ränder im Tiled Mode nahtlos geprüft.
      Variante 1: Kopie der Grundkachel, innen zwei Büschel verschoben.
      Variante 2: Kopie der Grundkachel, innen eine Blume ergänzt.
      Variante 3: neu gezeichnet, gleiche Farben, eigene Büschel bis an den Rand.
      Mischung: Grundkachel 60 %, Varianten je etwa 13 %.
    lines: [4]
    hints:
      - Welche Variante hat andere Randpixel als die Grundkachel?
    explanation: |
      Variante 3 ist neu gezeichnet, ihre Ränder stimmen nicht mit denen der Grundkachel überein. Wo sie neben einer anderen Kachel liegt, treffen zwei verschiedene Randverläufe aufeinander, und es entsteht eine Kante. Varianten 1 und 2 sind Kopien mit geändertem Inneren, sie passen überall. Willst du eine ganz neue Variante, prüf sie im Tiled Mode zusammen mit der Grundkachel.
    resources:
      - title: Pixelorama · Canvas · Tile Mode
        url: https://pixelorama.org/user_manual/user_interface/canvas/#tile-mode

  - id: slynyrd-gras-erklaeren
    type: explain
    title: Warum Slynyrds Gras nicht langweilt
    prompt: |
      Hier ist Slynyrds Vorgehen für Gras zusammengefasst. Erkläre in drei bis fünf Sätzen, warum jede dieser Entscheidungen hilft, die Wiederholung zu verstecken.
    lang: prose
    code: |
      Slynyrd, Pixelblog 20 (2019): Gras aus mehreren 16 × 16-Kacheln. Das visuelle Gewicht ist gleichmäßig über jede Kachel verteilt. Dieselben Schlüsselcluster kehren wieder, berühren sich aber nicht. Wenige Farben, keine stark kontrastierenden. Flache grüne Flächen wechseln mit Flächen unterschiedlicher Dichte. Blumen kommen nur in gelegentlichen Varianten vor.
    points:
      - Gleichmäßiges Gewicht verhindert einen Blickfang, der sich in jeder Kachel wiederholt und ein Raster bildet.
      - Wiederkehrende Schlüsselcluster geben dem Material einen einheitlichen Charakter, ohne zu klumpen.
      - Wenige, nahe beieinanderliegende Farben halten das Rauschen klein.
      - Flache Flächen und wechselnde Dichte geben Pausen und brechen den Rhythmus der Kachelgröße.
      - Seltene Blumenvarianten bringen Abwechslung, ohne dass sich ein Muster bildet.
    explanation: |
      Das Auge sucht Regelmäßigkeit. Hat eine Kachel einen Schwerpunkt, findet es ihn alle 16 Pixel wieder, deshalb verteilt Slynyrd das Gewicht gleichmäßig. Dieselben Cluster machen aus vielen Kacheln ein Material, solange sie nicht zu größeren, zufälligen Klumpen verschmelzen. Wenige Farben ohne starken Kontrast halten den Boden ruhig, und flache Flächen geben dem Auge Pausen. Die Blume ist der Reiz, und sie wirkt nur, weil sie selten ist.
    resources:
      - title: Slynyrd · Pixelblog 20 · Top Down Tiles
        url: https://www.slynyrd.com/blog/2019/8/27/pixelblog-20-top-down-tiles

  - id: bodenkachel-varianten
    type: practice
    title: Eine nahtlose Bodenkachel mit zwei Varianten
    prompt: |
      Zeichne im Editor eine Bodenkachel von 16 × 16 Pixeln, etwa Gras, Erde oder Pflaster. Arbeite mit Tiled Mode oder Tile Mode und führe mindestens zwei Cluster über die Ränder. Leg danach zwei Varianten als Kopien an, bei denen du nur das Innere änderst. Eine davon bekommt ein seltenes Detail. Lege die drei Kacheln in einer Fläche von 6 × 4 Kacheln gemischt aus.
    lang: prose
    starter: |
      Material:
      Farben (Zahl):
      Tonwertbereich auf der Neunerskala:
      Seltenes Detail:
      Was in der Fläche von 6 × 4 auffällt:
    checklist:
      - Die Grundkachel ist 16 × 16 Pixel groß und nutzt höchstens vier Farben.
      - Mindestens zwei Cluster laufen über einen Rand und erscheinen auf der Gegenseite, geprüft im Tiled Mode.
      - Die Randpixel beider Varianten sind identisch mit denen der Grundkachel.
      - Das seltene Detail kommt in der Fläche von 6 × 4 höchstens dreimal vor.
      - Die Bodentöne liegen auf der Neunerskala höchstens drei Stufen auseinander, geprüft in Graustufen.
      - Du hast die Fläche bei 1× angesehen und notiert, ob und wo du ein Raster erkennst.
    hints:
      - Für gleiche Ränder dupliziere die Grundkachel und sperre oder markiere die äußerste Pixelreihe, bevor du im Inneren änderst.
    explanation: |
      Die Übung verbindet die drei Aufgaben einer Kachel: nahtlos, unauffällig, ruhig. Gleiche Randpixel sind die überprüfbare Bedingung dafür, dass Varianten zueinanderpassen. Die Häufigkeit des Details und den Tonwertbereich legst du vorher fest und prüfst sie nachher, statt nach Gefühl zu entscheiden.
    resources:
      - title: Aseprite Docs · Tiled Mode
        url: https://www.aseprite.org/docs/tiled-mode/
      - title: Pixelorama · Canvas · Tile Mode
        url: https://pixelorama.org/user_manual/user_interface/canvas/#tile-mode

  - id: hindernis-zeichnen
    type: practice
    title: Ein Hindernis, das man sofort erkennt
    prompt: |
      Zeichne zu deiner Bodenkachel ein Hindernis in 3/4-Draufsicht, etwa einen Felsblock, eine Kiste oder einen Baumstumpf, auf 16 × 16 oder 16 × 24 Pixeln in einer eigenen Ebene. Leg dazu einen Bodenfleck, über den man laufen kann, etwa eine dunklere Grasstelle. Stell beide auf deinen Boden.
    lang: prose
    starter: |
      Hindernis:
      Merkmale, die „blockiert“ sagen:
      Bodenfleck:
      Merkmale, die „begehbar“ sagen:
    checklist:
      - Das Hindernis zeigt Oberseite und Front, die Front ist dunkler als die Oberseite.
      - Das Hindernis hat eine dunkle Kante mindestens an der Unterseite und einen kleinen Schatten auf dem Boden.
      - Der Bodenfleck hat keine Kontur und keinen Schatten.
      - Die Lichtrichtung des Hindernisses stimmt mit der deiner Bodenkachel überein.
      - Du hast notiert, an welchen zwei Merkmalen man das Hindernis vom Bodenfleck unterscheidet.
    explanation: |
      Ein Hindernis muss mit mehreren Merkmalen gleichzeitig „blockiert“ sagen: Front, Kante, Schatten. Der Bodenfleck bekommt bewusst keines davon, auch wenn er dunkel ist. Wer diese Regel einmal festlegt und durchhält, bringt dem Spieler bei, wo er laufen kann, ohne dass er es ausprobieren muss.
    resources:
      - title: Slynyrd · Pixelblog 3 · Graphical Projections
        url: https://www.slynyrd.com/blog/2018/3/14/pixelblog-3-graphical-projections-1

  - id: mockup-ausschnitt
    type: practice
    title: Ein Mockup-Ausschnitt mit Figur
    prompt: |
      Bau aus deinen Kacheln und dem Hindernis einen Ausschnitt von 10 × 6 Kacheln, also 160 × 96 Pixeln. Setz eine neutrale Figur von 16 × 32 Pixeln hinein, eine einfarbige Gliederpuppe oder ein Rechteck mit Kopf genügt. Prüf den Ausschnitt in Graustufen und zeig ihn jemandem.
    lang: prose
    starter: |
      Werteplan (Boden, Hindernis, Figur):
      Ergebnis Graustufentest:
      Frage an meinen Tester:
      Antwort:
    checklist:
      - Der Ausschnitt ist 160 × 96 Pixel groß und nutzt die Grundkachel und mindestens zwei Varianten.
      - Vor dem Bau steht ein Werteplan mit Tonwertbereichen für Boden, Hindernis und Figur.
      - Im Graustufenbild hat der Boden den engsten Tonwertbereich, geprüft mit Graustufen-Modus, Entsättigen oder Achromatopsia in Chromium.
      - Du hast jemandem den Ausschnitt fünf Sekunden gezeigt und gefragt, wo man laufen kann und wo die Figur steht, und die Antwort notiert.
      - Du hast notiert, was du nach Graustufentest und Rückmeldung geändert hast, oder warum nichts.
    explanation: |
      Erst im Mockup zeigt sich, ob Tiles eine Figur tragen. Die neutrale Figur reicht dafür, weil es um Tonwert und Kontrast geht, nicht um ihr Aussehen. Die fünf Sekunden ersetzen den Blick eines Spielers, der nicht weiß, was du gemeint hast. Wie du solche Proben systematisch durchführst und Entscheidungen festhältst, vertieft das Modul [Prüfen, überarbeiten, dokumentieren](/pixelart/lesbarkeit-pruefen).
    resources:
      - title: Chrome DevTools · Emulate vision deficiencies
        url: https://developer.chrome.com/docs/devtools/rendering/apply-effects#emulate_vision_deficiencies
