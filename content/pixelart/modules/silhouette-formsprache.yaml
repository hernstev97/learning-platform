lesson: |
  Du hast eine Figur gezeichnet, mit Gürtel, Knöpfen und einer Narbe über dem Auge. Im Spiel ist sie 24 Pixel hoch, steht zwischen drei Gegnern auf unruhigem Boden, und du verlierst sie aus den Augen. Die Details sind da, aber jedes ist einen Pixel groß. Was du in diesem Moment wahrnimmst, ist ein dunkler Fleck mit einem Umriss. Ob du darin deine Figur erkennst, entscheidet dieser Umriss, nicht der Gürtel.

  Dieses Modul behandelt den Umriss als erste Entwurfsentscheidung. Du brauchst einen Bleistift, einen dicken Filzstift und ein kleines Heft. Am Handy liest du die Schaubilder und löst die Übungen. Einen Editor brauchst du nicht; wie aus einem Entwurf ein Sprite wird, zeigt [Vom Entwurf zum Sprite](/pixelart/sprite-entwerfen).

  ## Silhouette zuerst: der Umriss erzählt als Erstes

  Die **Silhouette** ist der Umriss einer Figur als gefüllte Fläche: ohne Innenlinien, ohne Farbe, ohne Schattierung. Pedro Medeiros (Saint11) vergleicht Character Design mit dem Erzählen einer Geschichte. Figuren erzählen über ihr Aussehen, und „the silhouette is the prologue, the first thing the viewer will notice“ ([Character Design 1](https://saint11.art/img/pixel-tutorials/Silhouette.gif)). Seinen Arbeitsablauf schreibt er auf dieselbe Tafel: erst eine Silhouettenskizze, dann Details, dann Animation. Wie sich eine Figur bewegt, ist Thema des Animationskurses. Hier geht es um das Standbild.

  Auf derselben Tafel beschriftet Saint11 eine Silhouette mit dem, was man aus ihr liest: menschliche Form, stark, trägt Rüstung, hat ein Schwert. Das ist der Kern des **Silhouettentests**. Du füllst eine Figur schwarz und schreibst auf, was man dann noch über sie sagen kann. Auf Papier zeichnest du den Umriss mit Bleistift und malst ihn mit dem Filzstift voll, Innenlinien verschwinden dabei von selbst. Bleiben zwei oder drei Aussagen übrig, trägt die Silhouette. Bleibt nur „ein Mensch“, trägt sie nicht.

  Für Pixelart wiegt das schwerer als für große Illustrationen. Ein Sprite von 24 Pixeln Höhe hat für ein Gesicht eine Handvoll Pixel. Innenformen sind dort winzig, der Umriss ist das größte Merkmal, das du hast. Auch die Lesbarkeit im Kampf hängt daran: Wie Silhouette und Trefferfläche zusammenpassen, behandelt [Reichweite, Hitboxen und Hurtboxen](/combat/hitboxen) im Abschnitt „Pixelart-Silhouette und Hurtbox“.

  ## Lesehierarchie: was Valve bei Team Fortress 2 geprüft hat

  Team Fortress 2 hat neun Klassen, und welche Klasse ein Gegner spielt, entscheidet, wie du reagierst. Valve schreibt deshalb, „the silhouettes of the nine classes were carefully designed to be very distinct from one another“. Unter einer Abbildung der Klassen als schwarze Flächen steht: „Even when viewed only in silhouette with no internal shading at all, the characters are readily identifiable“ ([Illustrative Rendering in Team Fortress 2, Abschnitt 4.1](https://media.steampowered.com/apps/valve/2007/NPAR07_IllustrativeRenderingInTeamFortress2.pdf)). Mit diesem Test hat das Team die Entwürfe schon in der Konzeptphase geprüft. Die Unterschiede kamen aus Körperproportionen, Waffen und aus Umrisslinien, die Schuhe, Hüte und Kleiderfalten bilden.

  Jason Mitchell hat das 2008 als **Lesehierarchie** (Read Hierarchy) zusammengefasst ([Connecting Visuals to Gameplay at Valve](https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf)). Jede Stufe beantwortet eine Frage des Spielers:

  | Frage | Stufe | Mittel |
  | --- | --- | --- |
  | Freund oder Feind? | Team | Farbe |
  | Weglaufen oder angreifen? | Klasse | Silhouette, Proportionen, Waffe, Schuhe, Hüte, Falten |
  | Welche Waffe hält er? | Waffe | höchster Kontrast auf Brusthöhe, Verlauf von dunklen Füßen zur hellen Brust |

  Art Director Moby Francke erklärte dazu 2008 in einem Vortrag auf der Gamefest: „We did it through silhouettes“ ([Game Developer, 2008](https://www.gamedeveloper.com/art/in-depth-how-valve-makes-art-to-enhance-gameplay)). Team Fortress 2 ist ein 3D-Shooter, keine Pixelart. Die Fragen stellt ein Spieler in einem Top-down-Spiel trotzdem, nur kleiner: Ist das meine Figur? Welcher Gegner ist das, und muss ich ausweichen?

  > [!MERKE]
  > Farbe sagt, zu wem eine Figur gehört. Die Silhouette sagt, was sie ist.

  ## Formensprache: Kreis, Rechteck, Dreieck als Konvention

  **Formensprache** (Shape Language) heißt: Die Grundform, aus der eine Figur gebaut ist, soll etwas über sie sagen. In vielen Character-Design-Kursen wird sie so gelehrt: Kreise wirken weich und harmlos, Rechtecke stabil und schwer, Dreiecke und Zacken beweglich oder gefährlich.

  ![Drei schwarze Silhouetten nebeneinander. A ist aus Kreisen gebaut: großer runder Körper, kleiner runder Kopf, flache ovale Füße. B aus Rechtecken: breiter Block als Rumpf, eckiger Kopf, zwei breite Beine. C aus Dreiecken: ein nach unten zeigendes Dreieck als Rumpf mit drei Zacken oben und zwei dünnen schrägen Beinen](/media/pixelart/silhouette-formsprache/grundformen@2x.png "Figuren aus Kreisen (A), Rechtecken (B) und Dreiecken (C). Eigenes Schaubild")

  A sitzt schwer auf dem Boden, nichts ragt heraus. B steht breit und fest. C steht auf zwei dünnen Beinen, die Spitzen zeigen nach außen, die schwere Seite ist oben. Saint11 begründet die Konvention halb im Scherz: Schlangenartige Formen, lange Gliedmaßen und spitze Kanten „convey danger“, komplizierte und scharfe Formen ebenso. Gleich darunter merkt er an, Säugetiere machten sich wohl zu viele Sorgen ([Character Design 1](https://saint11.art/img/pixel-tutorials/Silhouette.gif)). Für niedliche Figuren rät er zu „rounded and soft shapes“ und schreibt groß darunter: „These are NOT rules, just guidelines“ ([Cuteness](https://saint11.art/img/pixel-tutorials/Cuteness.gif)).

  Formensprache wirkt auch jenseits von Figuren. Bei Team Fortress 2 haben die Gebäude der beiden Teams gegensätzliche Eigenschaften: Die Basis des roten Teams nutzt warme Farben, Naturmaterialien und „angular geometry“, die des blauen Teams kühle Farben, Industriematerialien und „orthogonal forms“ ([NPAR 2007, Abschnitt 4.2](https://media.steampowered.com/apps/valve/2007/NPAR07_IllustrativeRenderingInTeamFortress2.pdf)). Dort trennt die Form zwei Teams, nicht Gut und Böse.

  Warum Konvention und kein Gesetz? Keine Quelle dieses Kurses misst, wie Formen wirken, und Saint11 nennt seine Hinweise ausdrücklich Leitlinien. Eine runde Figur kann bedrohlich wirken, wenn sie zehnmal so groß ist wie die Spielfigur. Ein Dreieck kann auch eine Richtung zeigen statt Gefahr. Nimm die Konvention als Startpunkt und prüf die Wirkung bei anderen: Zeig zwei Silhouetten und frag, welche gefährlicher wirkt, ohne eine Antwort vorzugeben. Meist dominiert eine Grundform, die anderen ergänzen. Eine Figur aus Rechtecken mit einem spitzen Hut liest sich anders als ein reiner Block.

  ### Größe, Proportion und Rhythmus: groß, mittel, klein

  Eine Silhouette aus gleich großen Teilen wirkt starr. Proko warnt beim Gestenzeichnen vor dem Hang zur Symmetrie, der eine Figur aussehen lässt „like a snowman“ ([How to Draw Gesture](https://www.proko.com/course-lesson/how-to-draw-gesture)). Für Silhouetten gilt Ähnliches: Drei gleiche Kreise übereinander sind ein Schneemann.

  Eine verbreitete Faustregel ist der **Größenrhythmus** groß – mittel – klein: eine große Masse wie Rumpf oder Mantel, eine mittlere wie Kopf oder Waffe, ein kleines Element wie Hutspitze, Ohr oder Werkzeug. Die Regel stammt aus der Praxis, nicht aus einer Messung. Prüfen kannst du sie an jedem Thumbnail: Lassen sich die Teile in drei klar verschiedene Größen sortieren? In Feld B der Abbildung oben gelingt das: Der Rumpf ist 16 Pixel breit, der Kopf 8, jedes Bein 5. Auch in C stehen der breite Rumpf, die Zacken und die dünnen Beine in deutlichem Kontrast.

  Proportionen sind selbst ein Merkmal. Mitchell nennt sie in der Lesehierarchie direkt neben der Silhouette. Ein großer Kopf auf einem kleinen Körper liest sich anders als ein kleiner Kopf auf breiten Schultern; wie du Proportionen misst und stilisierst, behandelt [Figur, Geste und Proportion](/pixelart/figur-proportion). Saint11 setzt außerdem ein starkes Element in die Silhouette, „something that will make it easy to recognize them“, bei seinem Roboter ein flacher Kopf und ein Kettenantrieb ([Character Design 1](https://saint11.art/img/pixel-tutorials/Silhouette.gif)). Ein solches **Erkennungsmerkmal** kann ein Hut sein, eine Haarform oder ein langes Werkzeug.

  ## Negativraum: Lücken machen die Pose lesbar

  **Negativraum** ist die Fläche zwischen und um die Teile einer Figur. Ctrl+Paint beschreibt ihn als den Raum um ein Objekt herum und schreibt: „Eventually, when you're designing characters and environments, you'll be using the negative space intentionally“ ([Drawing Shape: Negative Space](https://www.ctrlpaint.com/videos/drawing-shape-negative-space)). Wie du Negativraum beim Beobachten siehst, übst du in [Beobachten, Messen und Referenzen](/pixelart/beobachten).

  ![Zwei schwarze Silhouetten derselben Puppe. In A liegen die Arme am Rumpf an und verschmelzen mit ihm, nur die Beine sind getrennt. In B zeigt ein Arm schräg nach oben, der andere schräg nach unten, die Beine stehen gespreizt; zwischen Armen und Rumpf und zwischen den Beinen liegen helle Lücken](/media/pixelart/silhouette-formsprache/negativraum-silhouette@2x.png "Arme am Körper (A) und vom Körper weg (B). Eigenes Schaubild")

  In A ist die Silhouette ein Block mit Kopf. Ob die Figur etwas hält, die Arme verschränkt oder hängen lässt, sieht man nicht. In B zeigen die Lücken, wo die Arme sind und wohin sie zeigen. Das gilt für alles, was eine Figur hält: Ein Schwert vor dem Bauch verschwindet in der Silhouette, ein Schwert seitlich vom Körper wird Teil von ihr. Valve hat Details und Waffe nach oben zur Brust gelegt, damit man die Waffe gut sieht.

  In Pixeln braucht eine Lücke Platz. Liegt ein Arm nur einen Pixel neben dem Rumpf und bekommen beide eine dunkle Kontur außen herum, füllt die Kontur die Lücke, und die Silhouette schließt sich wieder. Plane Lücken so breit, dass nach der Kontur noch Hintergrund bleibt.

  ## Thumbnails: viele kleine Silhouetten, dann eine weiterentwickeln

  Ein **Thumbnail** ist eine kleine, schnelle Skizze, kaum größer als ein Daumennagel. Für Silhouetten heißt das: Du füllst ein Blatt mit vielen kleinen schwarzen Figuren, jede in weniger als einer Minute. Das kleine Format zwingt zur großen Form, weil für Details kein Platz ist. Danach wählst du nach Kriterien aus, die du vorher aufgeschrieben hast, zum Beispiel:

  - Die Figur ist ohne Innenlinien als das erkennbar, was sie sein soll.
  - Sie unterscheidet sich von allen anderen auf dem Blatt.
  - Sie hat ein Erkennungsmerkmal, das du in einem Wort benennen kannst.
  - Ihre Teile lassen sich in groß, mittel und klein sortieren.

  Ctrl+Paint kritisiert dabei eine Gewohnheit: Viele behandeln jede Skizze als Treffer oder Fehlschuss, „and they draw until a 'hit' happens“ ([Thumbnail Iteration](https://www.ctrlpaint.com/videos/thumbnail-iteration)). Matt Kohr entwickelt stattdessen ein vielversprechendes Thumbnail weiter, im Video mit Masken in Photoshop. Auf Papier heißt das: Du zeichnest dein bestes Thumbnail mehrmals neu und änderst jedes Mal genau einen Teil, etwa den Kopf, die Arme oder das Werkzeug. Beides zusammen ergibt einen Ablauf: erst breit suchen, dann eine Idee gezielt verändern.

  > [!WARNING] Ein Prüfwerkzeug, kein Stil
  > Ctrl+Paint warnt in [The Danger of Painting Silhouettes](https://www.ctrlpaint.com/videos/the-danger-of-painting-silhouettes) vor Moden in der Digitalmalerei: „It's bad when you copy the style, and not the substance.“ Schwarze Silhouetten sind ein Mittel, um Umrisse zu vergleichen. Sie ersetzen nicht die Arbeit an Proportion, Pose und Innenformen danach.

  > [!TIP] Die Armlänge als 1×-Test
  > Halt das Blatt auf Armlänge oder kneif die Augen zusammen. Details verschwimmen, die großen Formen bleiben. James Gurney nennt als Vorteil eines klaren Tonwertaufbaus, dass er sich „from across the room or when reduced to a tiny size“ liest ([Why Should I Mass Values?](https://gurneyjourney.blogspot.com/2019/12/why-should-i-mass-values.html)). Was auf Armlänge nicht trägt, trägt als kleines Sprite erst recht nicht.

  ## Spielfigur, Gegner und große Kreaturen unterscheiden

  In einem Top-down-Actionspiel sieht der Spieler Figuren schräg von oben. Eine reine Draufsicht zeigt laut Wikipedia nur „a head and shoulders seen from above“. Die übliche Schrägansicht verbindet „the visibility and mobility of a top-down game with the character recognizability of a side-scrolling game“ ([2.5D](https://en.wikipedia.org/wiki/2.5D#Axonometric_and_oblique_projection)). Prüf Silhouetten deshalb in der Ansicht, die das Spiel zeigt; die Projektionen erklärt [Grundkörper, Perspektive und Draufsicht](/pixelart/grundkoerper-raum).

  Übertragen auf Mitchells Hierarchie: Die Spielfigur braucht ein Merkmal, das kein Gegner teilt, etwa eine eigene dominante Grundform oder ein eigenes Erkennungsmerkmal. Gegner, die verschieden zu bekämpfen sind, brauchen verschiedene Silhouetten, nicht nur verschiedene Farben. Welche Rollen Gegner im Kampf übernehmen, steht in [Gegnermuster und Telegraphing](/combat/gegnermuster).

  Große Kreaturen folgen derselben Logik in größerem Maßstab. Saint11 rät beim Übertragen eines Entwurfs in Pixel: „Focus on the big masses first“ ([Resizing Pixel Art](https://saint11.art/img/pixel-tutorials/Resizing.gif)). Für eine Kreatur, die viermal so groß ist wie die Spielfigur, heißt das: zwei oder drei große Massen, die sich auch auf Armlänge trennen lassen, und ein klarer **Blickpunkt**, eine Stelle mit dem stärksten Kontrast, etwa Kopf oder Auge. Verteilst du kleine Spitzen über den ganzen Umriss, zerfällt er; das ist eine Faustregel aus der Praxis, keine Messung. Ob man einen großen Gegner im Kampf liest, hängt auch an Telegraphs und Kamera; das behandelt [Große Kreaturen als Bosse](/combat/grosse-gegner). Maßstab und Pixeldichte vertieft [Ansichten, Maßstab und große Kreaturen](/pixelart/ansichten-massstab).

  > [!PRAXIS] Silhouette als Prüfung im Konzept
  > Valve hat die Klassen „in silhouette with no internal shading“ gezeigt, um die Entwürfe in der Konzeptphase zu bestätigen (NPAR 2007, Abbildung 2). In Mitchells Folien steht die Silhouette als erster Schritt der Figurenentwicklung, vor Innenformen, Modellblatt und 3D-Modell, mit den Stichworten „Building block of character design“ und „Identifiable at first read“. Saint11 arbeitet in derselben Reihenfolge: Silhouettenskizze, Details, Animation. Für dich heißt das: Ein Entwurf bekommt erst Innenlinien, wenn du ihn schwarz gefüllt angesehen und aufgeschrieben hast, was man aus ihm liest.

  > [!INTERVIEW]
  > Ein Studio sucht laut Stellenanzeige „A strong pixel art portfolio with unique creatures and characters“ ([Conradical Games, Pixel Artist](https://workwithindies.com/careers/conradical-games-pixel-artist)). Im Portfolio-Gespräch zeigt jemand auf zwei deiner Figuren und fragt: „Woran unterscheidet man die beiden im Gedränge?“ Gute Antwort: Du nennst die Lesehierarchie, also welche Frage die Farbe und welche die Silhouette beantwortet. Du zeigst beide schwarz gefüllt nebeneinander und benennst die Unterschiede in Grundform, Größenrhythmus und Erkennungsmerkmal. Hast du ein Blatt mit Thumbnails dabei, zeigst du, welche Varianten du verworfen hast und nach welchem Kriterium.

  ## Häufige Fehler

  - **Details vor dem Umriss.** Gürtel und Knöpfe zuerst, die Silhouette ergibt sich nebenbei. Prüf erst den Umriss schwarz gefüllt, dann kommen Innenformen.
  - **Arme und Werkzeug vor dem Körper.** In der Silhouette verschwinden sie. Halte vom Rumpf weg, was erkannt werden soll.
  - **Lücken von einem Pixel.** Nach der Kontur sind sie zu. Plane Negativraum mit der Kontur zusammen.
  - **Alles gleich groß.** Ohne groß, mittel und klein wirkt die Figur starr. Sortiere die Teile nach Größe.
  - **Formensprache als Gesetz.** „Rund heißt freundlich“ ist eine Konvention. Prüf die Wirkung bei anderen.
  - **Gegner nur über Farbe unterschieden.** In Graustufen sind sie gleich. Gib jedem Gegnertyp eine eigene Silhouette.
  - **Das erste Thumbnail genommen.** Ohne Vergleich weißt du nicht, ob es trägt. Zeichne mehrere und wähle nach Kriterien.
  - **Große Kreatur voller kleiner Zacken.** Der Umriss zerfällt. Wenige große Massen, ein Blickpunkt.

  ## Zusammenfassung

  - Die Silhouette ist das Erste, was ein Spieler von einer Figur wahrnimmt. Prüf sie schwarz gefüllt ohne Innenlinien.
  - Valve hat die neun Klassen von Team Fortress 2 so entworfen, dass sie allein als Silhouette erkennbar sind, und das in der Konzeptphase geprüft.
  - In der Lesehierarchie beantwortet Farbe „Freund oder Feind?“, die Silhouette „Was ist das?“ und Kontrast auf Brusthöhe „Welche Waffe?“.
  - Kreis, Rechteck und Dreieck sind eine Konvention der Formensprache. Saint11 nennt solche Hinweise Leitlinien, keine Regeln.
  - Größenrhythmus und ein Erkennungsmerkmal machen eine Silhouette unverwechselbar.
  - Negativraum zeigt die Pose. Lücken brauchen in Pixeln Platz für die Kontur.
  - Thumbnails: erst viele kleine Silhouetten, dann eine gezielt in Varianten weiterentwickeln.
  - Große Kreaturen bestehen aus wenigen großen Massen mit einem klaren Blickpunkt.
exercises:
  - id: silhouettentest
    type: choice
    title: Was der Silhouettentest zeigt
    prompt: |
      Welche Aussagen über den Silhouettentest stimmen?
    options:
      - text: Du füllst die Figur dunkel und schreibst auf, was man ohne Innenlinien noch über sie sagen kann.
        correct: true
        why: Genau so beschriftet Saint11 eine Silhouette mit dem, was man aus ihr liest, etwa „hat ein Schwert“ oder „trägt Rüstung“.
      - text: Valve hat die Klassen von Team Fortress 2 schon in der Konzeptphase allein als Silhouetten geprüft.
        correct: true
        why: Laut NPAR-Paper wurden die Entwürfe so bestätigt, ohne jede Innenschattierung.
      - text: Eine Figur mit vielen Innendetails braucht den Test nicht, weil die Details sie unterscheiden.
        correct: false
        why: In 24 Pixeln Höhe sind Innendetails nur wenige Pixel groß. Im Gedränge sieht man zuerst den Umriss.
      - text: Der Test zeigt, ob eine Figur schön ist.
        correct: false
        why: Er zeigt, ob sie erkennbar und von anderen unterscheidbar ist. Ob sie gefällt, entscheidet kein Test.
    explanation: |
      Der Silhouettentest nimmt einer Figur alles außer dem Umriss. Was danach noch lesbar ist, trägt sie auch im Spiel, wenn sie klein ist und sich bewegt. Valve hat das als Abnahme in der Konzeptphase genutzt, Saint11 beginnt jeden Entwurf damit. Der Test misst Lesbarkeit, nicht Geschmack.
    resources:
      - title: Saint11 · Character Design 1 (Silhouette)
        url: https://saint11.art/img/pixel-tutorials/Silhouette.gif

  - id: lesehierarchie-frage
    type: choice
    title: Welche Frage beantwortet die Silhouette?
    prompt: |
      Ein Spieler sieht am Bildrand eine Figur. Welche Frage beantwortet nach Mitchells Lesehierarchie für Team Fortress 2 vor allem die Silhouette?
    options:
      - text: Freund oder Feind?
        correct: false
        why: Das Team liest man an der Farbe. Rot und Blau trennen die Seiten.
      - text: Weglaufen oder angreifen?
        correct: true
        why: Die Klasse sagt, wie gefährlich ein Gegner ist und wie man reagiert. Sie liest man an Silhouette, Proportionen und Waffe.
      - text: Welche Waffe hält er gerade?
        correct: false
        why: Dafür setzt Valve den höchsten Kontrast auf Brusthöhe, wo die Waffe gehalten wird.
      - text: Wie viele Lebenspunkte hat er noch?
        correct: false
        why: Das gehört nicht zur Lesehierarchie der Figur, sondern zur Oberfläche des Spiels.
    explanation: |
      Mitchell ordnet jede Frage des Spielers einem Mittel zu: Team über Farbe, Klasse über Silhouette, gewählte Waffe über Kontrast. Die Reihenfolge entspricht der Wichtigkeit im Spiel. Für ein Top-down-Spiel lässt sich das übertragen: Ob eine Figur zu dir gehört, darf die Farbe sagen, aber welcher Gegnertyp es ist, sollte schon der Umriss verraten.
    resources:
      - title: Jason Mitchell · Connecting Visuals to Gameplay at Valve (MIGS 2008)
        url: https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf

  - id: grundformen-konvention
    type: choice
    title: Kreis, Rechteck, Dreieck
    prompt: |
      Sieh dir das Schaubild an. Welche Aussage passt zur Formensprache, wie die Lektion sie beschreibt?

      ![Drei schwarze Silhouetten. A aus Kreisen mit großem rundem Körper, B aus Rechtecken mit breitem Block als Rumpf, C aus einem nach unten zeigenden Dreieck mit Zacken oben und dünnen Beinen](/media/pixelart/silhouette-formsprache/grundformen@2x.png "Figuren aus Kreisen (A), Rechtecken (B) und Dreiecken (C). Eigenes Schaubild")
    options:
      - text: Nach der verbreiteten Konvention wirkt C am ehesten gefährlich. Ob das in deinem Spiel so ankommt, prüfst du bei anderen.
        correct: true
        why: Spitze Kanten und dünne Gliedmaßen gelten als Signal für Gefahr, auch bei Saint11. Er nennt das aber Leitlinien, keine Regeln.
      - text: A ist garantiert harmlos, weil sie aus Kreisen besteht.
        correct: false
        why: Eine runde Figur kann bedrohlich wirken, etwa wenn sie riesig ist. Die Konvention ist ein Startpunkt, keine Garantie.
      - text: Die Grundform sagt nichts über eine Figur, deshalb sind A, B und C austauschbar.
        correct: false
        why: Die Formen wirken verschieden, A sitzt schwer, B steht fest, C steht kippelig auf Spitzen. Nur ist die Wirkung nicht festgeschrieben.
      - text: Formensprache gilt nur für Figuren, nicht für Gebäude.
        correct: false
        why: In Team Fortress 2 unterscheiden sich die Basen der Teams durch kantige und rechtwinklige Formen.
    explanation: |
      Formensprache ist eine Konvention, die viele Kurse lehren und die Saint11 mit einem Augenzwinkern begründet. Keine Quelle dieses Kurses misst ihre Wirkung. Deshalb nimmst du sie als ersten Entwurf und prüfst bei anderen, ob deine Figur so wirkt, wie du willst.
    resources:
      - title: Saint11 · Cuteness
        url: https://saint11.art/img/pixel-tutorials/Cuteness.gif

  - id: thumbnail-ablauf
    type: order
    title: Vom leeren Blatt zur Auswahl
    prompt: |
      Bring die Schritte einer Thumbnail-Runde in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Die Aufgabe der Figur in einem Satz aufschreiben.
      Die Auswahlkriterien notieren, bevor du zeichnest.
      Zwölf kleine schwarze Silhouetten in zehn Minuten zeichnen.
      Das Blatt auf Armlänge halten und markieren, welche Figuren noch tragen.
      Zwei oder drei Thumbnails nach den Kriterien auswählen.
      Das beste mehrmals neu zeichnen, jedes Mal mit genau einer Änderung.
      Erst danach Innenformen und Details planen.
    explanation: |
      Die Kriterien hängen an der Aufgabe und müssen vor dem Zeichnen feststehen, sonst passt man sie hinterher an das an, was gerade gefällt. Der Armlängentest kommt vor der Auswahl, weil er Figuren aussortiert, die nur im Detail funktionieren. Die Varianten mit je einer Änderung sind der Schritt, den Ctrl+Paint vorschlägt: eine gute Idee gezielt verbessern, statt auf einen Zufallstreffer zu warten. Details kommen zuletzt, weil sie den Umriss nicht mehr retten.
    resources:
      - title: Ctrl+Paint · Thumbnail Iteration
        url: https://www.ctrlpaint.com/videos/thumbnail-iteration

  - id: negativraum-zaehlen
    type: output
    title: Wie viele Lücken sind eingeschlossen?
    prompt: |
      Das Raster zeigt eine Silhouette, `#` ist die Figur, `.` der Hintergrund. Wie viele Lücken sind vollständig von der Figur umschlossen? Antworte mit der Zahl.
    lang: text
    code: |
      . . . . . # # # . . . . .
      . . . . . # # # . . . . .
      . . . . . . # . . . . . .
      . . # # # # # # # # # . .
      . # # . # # # # # . # # .
      . # . . # # # # # . . # .
      . # # . # # # # # . # # .
      . . # # # # # # # # # . .
      . . . . # # # # # . . . .
      . . . . # # . # # . . . .
      . . . # # . . . # # . . .
      . . . # . . . . . # . . .
      . . # # . . . . . # # . .
    expected: |
      2
    accept:
      - 2 Lücken
      - zwei
      - zwei Lücken
    hints:
      - Verfolge jede Lücke. Erreicht sie den Rand des Rasters, ist sie nicht eingeschlossen.
      - Die Lücke zwischen den Beinen ist nach unten offen.
    explanation: |
      Die Figur stemmt die Hände in die Hüften. Zwischen jedem Arm und dem Rumpf liegt eine eingeschlossene Lücke, zusammen zwei. Die Lücke zwischen den Beinen ist nach unten offen und zählt deshalb nicht. Genau diese beiden Löcher machen die Pose lesbar: Ohne sie wäre der Oberkörper ein breiter Block, und niemand sähe, wo die Arme sind.
    resources:
      - title: Ctrl+Paint · Drawing Shape · Negative Space
        url: https://www.ctrlpaint.com/videos/drawing-shape-negative-space

  - id: kontur-luecke
    type: output
    title: Was die Kontur von der Lücke übrig lässt
    prompt: |
      Zwischen einem Arm und dem Rumpf liegen 3 Pixel Hintergrund. Beide Formen bekommen danach eine Kontur von einem Pixel, die außen um die Form gesetzt wird. Wie viele Pixel Hintergrund bleiben zwischen Arm und Rumpf? Antworte mit der Zahl.
    lang: text
    code: |
      Lücke vorher:  3 px
      Kontur Arm:    1 px, außen
      Kontur Rumpf:  1 px, außen
    expected: |
      1
    accept:
      - 1 px
      - 1 Pixel
      - ein Pixel
      - einer
    explanation: |
      Jede Kontur nimmt einen Pixel von der Lücke: 3 − 1 − 1 = 1. Bei einer Lücke von 2 Pixeln bliebe nichts übrig, und Arm und Rumpf verschmölzen in der Silhouette. Setzt du die Kontur innen auf die äußersten Pixel der Form, bleibt die Lücke, dafür werden Arm und Rumpf schmaler. Pixeloramas Effekt „Outline“ kann beides, die Option dafür heißt „place inside image“.
    resources:
      - title: Pixelorama · Image effects (Outline)
        url: https://pixelorama.org/user_manual/image_effects/#list-of-image-effects

  - id: begriffe-silhouette
    type: gap
    title: Begriffe rund um den Umriss
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Den Umriss einer Figur als gefüllte Fläche ohne Innenlinien nennt man ⟦Silhouette⟧. Die Flächen zwischen Armen, Beinen und Rumpf heißen ⟦Negativraum⟧. Eine kleine, schnelle Skizze zum Vergleichen von Ideen ist ein ⟦Thumbnail⟧. Dass Kreise weich und Zacken gefährlich wirken sollen, gehört zur ⟦Formensprache⟧. Valves Reihenfolge von Team über Klasse zur Waffe heißt ⟦Lesehierarchie⟧. Die Stelle mit dem stärksten Kontrast, auf die der Blick zuerst fällt, ist der ⟦Blickpunkt⟧.
    gaps:
      - label: gefüllter Umriss
        hint: Französisches Wort, im Deutschen üblich.
        accept: ["Umriss", "Schattenriss"]
      - label: Zwischenflächen
        hint: Das Gegenteil der Figur selbst, auf Englisch Negative Space.
        accept: ["negativer Raum", "Negative Space", "Zwischenraum"]
      - label: kleine Skizze
        hint: Englisch, wörtlich „Daumennagel“.
        accept: ["Thumbnails", "Daumenskizze", "Miniatur"]
      - label: Wirkung der Grundformen
        hint: Auf Englisch Shape Language.
        accept: ["Shape Language", "Formsprache"]
      - label: Valves Reihenfolge
        hint: Auf Englisch Read Hierarchy.
        accept: ["Read Hierarchy", "Lese-Hierarchie"]
      - label: stärkster Kontrast
        hint: Die Stelle, zu der das Auge zuerst wandert.
        accept: ["Fokuspunkt", "Focal Point", "Blickfang", "Fokus"]
    explanation: |
      Mit diesen Begriffen beschreibst du eine Figur, ohne über Geschmack zu reden. Silhouette und Negativraum sind zwei Seiten derselben Fläche. Thumbnails sind das Werkzeug, um viele Umrisse zu vergleichen. Formensprache und Lesehierarchie sagen, was ein Umriss mitteilen soll, und der Blickpunkt, wohin der Blick zuerst geht.

  - id: arm-verwachsen
    type: bug
    title: Der Arm wächst aus der Hüfte
    prompt: |
      Die Puppe soll beide Arme frei neben dem Körper hängen lassen. Bei 1× wirkt die linke Seite an einer Stelle wie ein breiter Block, als wüchse der Arm aus der Hüfte. Finde die Zeile.
    lang: text
    code: |
      . . . . . # # # . . . . .
      . . . . . # # # . . . . .
      . . . . . . # . . . . . .
      . . . # # # # # # # . . .
      . . # # . # # # . # # . .
      . . # . . # # # . . # . .
      . # # # # # # # . . # # .
      . # . . . # # # . . . # .
      . . . . # # # # # . . . .
      . . . . # # . # # . . . .
      . . . # # . . . # # . . .
      . . . # . . . . . # . . .
    lines: [7]
    hints:
      - Vergleiche jede Zeile links mit rechts. Die Figur soll symmetrisch sein.
    explanation: |
      In Zeile 7 füllen zwei Pixel links die Lücke zwischen Arm und Rumpf. Rechts liegen an derselben Stelle zwei Pixel Hintergrund. Die Brücke schließt den Negativraum, und der Arm verschmilzt mit dem Rumpf genau dort, wo die Hand sein sollte. Entfernst du die beiden Pixel, hängt der Arm wieder frei. Solche Brücken entstehen oft, wenn man eine Form freihändig füllt.
    resources:
      - title: Ctrl+Paint · Drawing Shape · Negative Space
        url: https://www.ctrlpaint.com/videos/drawing-shape-negative-space

  - id: verwechslung-notiz
    type: bug
    title: Wer ist hier die Spielfigur?
    prompt: |
      Lehrbeispiel: Designnotizen für ein kleines Top-down-Spiel. Im Test mit einem Screenshot in Graustufen verwechselt eine Testerin zweimal die Spielfigur mit einem Gegner. Finde die Zeile, die das verursacht.
    lang: prose
    code: |
      Spielfigur: schmal, breiter Hut mit Krempe als Erkennungsmerkmal
      Nahkämpfer: breite Schultern, kantig, Keule seitlich vom Körper
      Fernkämpfer: lang und dünn, Stab ragt über den Kopf hinaus
      Späher: so groß wie die Spielfigur, gleicher Hut, nur andere Farbe
      Großer Gegner: drei große Massen, helles Auge als Blickpunkt
    lines: [4]
    hints:
      - Was bleibt von einer Figur übrig, wenn die Farbe wegfällt?
    explanation: |
      Der Späher teilt Größe und Erkennungsmerkmal mit der Spielfigur und unterscheidet sich nur in der Farbe. In Graustufen bleibt davon nichts. Nach Valves Lesehierarchie darf die Farbe sagen, auf welcher Seite eine Figur steht, aber der Umriss muss sagen, was sie ist. Der Späher braucht eine eigene Silhouette, etwa eine andere Kopfform oder Größe.
    resources:
      - title: Jason Mitchell · Connecting Visuals to Gameplay at Valve (MIGS 2008)
        url: https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf

  - id: tf2-silhouetten
    type: explain
    title: Neun Klassen als schwarze Flächen
    prompt: |
      Erkläre in drei bis fünf Sätzen, warum Valve die Klassen von Team Fortress 2 als Silhouetten ohne Innenschattierung prüfte und was daraus für ein kleines Top-down-Spiel folgt.
    lang: text
    code: |
      Team Fortress 2 (Valve, 2007)
      nach NPAR-Paper und MIGS-Folien:
      - Die Klasse entscheidet, wie man
        auf einen Gegner reagiert.
      - Die neun Silhouetten sind bewusst
        stark verschieden.
      - Prüfung im Konzept: nur Umriss,
        keine Innenschattierung.
      - Unterschiede aus Proportionen,
        Waffen, Schuhen, Hüten, Falten.
      - Team über Farbe, Waffe über
        Kontrast auf Brusthöhe.
    points:
      - Die Klasse bestimmt die Reaktion des Spielers, deshalb muss sie auf den ersten Blick lesbar sein, auch im Gedränge und in schwierigem Licht.
      - Ohne Innenschattierung bleibt nur der Umriss. Ist eine Figur so erkennbar, tragen Details nur noch zusätzlich.
      - Die Unterschiede entstehen aus großen Merkmalen wie Proportionen, Waffen und Hüten, nicht aus Farbe.
      - Für ein Top-down-Spiel heißt das, dass Spielfigur und jeder Gegnertyp eine eigene Silhouette in der Ansicht brauchen, die das Spiel zeigt.
    explanation: |
      In Team Fortress 2 entscheidet die Klasse eines Gegners, ob du angreifst oder fliehst, und das oft in Sekundenbruchteilen und bei schwierigem Licht. Valve hat die Figuren deshalb so entworfen, dass sie schon als schwarze Fläche erkennbar sind, und das in der Konzeptphase geprüft, bevor teure Modelle entstanden. Die Unterschiede stecken in großen Merkmalen: Proportionen, Waffen, Hüte, Schuhe. Farbe übernimmt eine andere Frage, nämlich die nach dem Team. Für ein kleines Top-down-Spiel folgt daraus, jeden Gegnertyp und die Spielfigur in der Spielansicht schwarz gefüllt nebeneinanderzulegen und zu prüfen, ob man sie auseinanderhält.
    resources:
      - title: Valve · Illustrative Rendering in Team Fortress 2 (NPAR 2007)
        url: https://media.steampowered.com/apps/valve/2007/NPAR07_IllustrativeRenderingInTeamFortress2.pdf

  - id: zwoelf-thumbnails
    type: practice
    title: Zwölf Silhouetten in zehn Minuten
    prompt: |
      Wähle eine Aufgabe für eine Figur, etwa „flinker Späher“, „schwerer Wächter“ oder „Händler“, und schreib sie oben aufs Blatt, dazu drei Auswahlkriterien. Stell einen Timer auf zehn Minuten und zeichne zwölf Silhouetten, keine höher als dein Daumen, gleich mit Filzstift gefüllt. Danach hältst du das Blatt auf Armlänge, wählst zwei aus und zeichnest die bessere dreimal neu, jedes Mal mit genau einer Änderung. Notiere hier in zwei bis drei Sätzen, welche du gewählt hast und warum.
    lang: prose
    checklist:
      - Aufgabe und drei Kriterien standen auf dem Blatt, bevor du die erste Silhouette gezeichnet hast.
      - Auf dem Blatt stehen zwölf gefüllte Silhouetten, gezeichnet innerhalb der zehn Minuten.
      - Keine Silhouette ist höher als dein Daumen.
      - Für beide ausgewählten Thumbnails hast du ein Kriterium genannt, das sie erfüllen.
      - Die drei Varianten unterscheiden sich jeweils in genau einem Teil, und du hast notiert, welcher Teil das war.
    hints:
      - Fang jede Silhouette mit der größten Masse an, Kopf und Kleinteile kommen danach.
      - Wenn dir nach sechs Figuren nichts mehr einfällt, ändere bewusst die dominante Grundform.
    explanation: |
      Der Timer zwingt dich, die große Form zu entscheiden statt Details zu zeichnen. Weil die Kriterien vorher feststehen, wählst du nach Lesbarkeit und nicht nach dem, was dir gerade gefällt. Die Varianten mit je einer Änderung zeigen dir, welcher Teil des Umrisses die Wirkung trägt. Das Blatt hebst du auf: Es ist genau das Material, das im Portfolio-Gespräch deinen Prozess zeigt.
    resources:
      - title: Ctrl+Paint · Thumbnail Iteration
        url: https://www.ctrlpaint.com/videos/thumbnail-iteration

  - id: silhouettentest-spiel
    type: practice
    title: Silhouettentest an einem Spiel
    prompt: |
      Wähle ein Pixelart-Spiel mit Draufsicht, das du kennst, und nimm einen Screenshot mit mindestens drei Figuren, darunter die Spielfigur. Sieh ihn am Handy klein oder auf Armlänge an. Notiere in höchstens fünf Stichpunkten, welche Figuren du am Umriss unterscheiden kannst und woran.
    lang: prose
    starter: |
      Spiel und Szene:
      Figur 1 – Merkmal:
      Figur 2 – Merkmal:
      Figur 3 – Merkmal:
      Am schwersten zu unterscheiden:
    checklist:
      - Spiel und Szene sind genannt.
      - Für mindestens drei Figuren steht je ein Merkmal des Umrisses da, also Grundform, Größe oder Erkennungsmerkmal, keine Farbe.
      - Du hast das Paar genannt, das am schwersten zu unterscheiden ist, mit einem Grund im Umriss.
      - Du hast notiert, ob das Spiel die Spielfigur zusätzlich über Farbe oder Helligkeit hervorhebt.
    hints:
      - Schreib nur, was du am Umriss siehst. Farbe kommt erst im letzten Punkt vor.
    explanation: |
      An fremden Spielen siehst du, welche Mittel die Lesbarkeit tragen, ohne an deinen eigenen Entwurf gebunden zu sein. Trennst du Umriss und Farbe, merkst du, wo ein Spiel sich auf Farbe verlässt. Die Antwort auf die letzte Frage zeigt dir, ob es die Lesehierarchie so umsetzt wie Valve oder anders.
    resources:
      - title: Jason Mitchell · Connecting Visuals to Gameplay at Valve (MIGS 2008)
        url: https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf

  - id: kreatur-massen
    type: practice
    title: Eine große Kreatur aus drei Massen
    prompt: |
      Zeichne auf Papier sechs Thumbnails einer großen Kreatur, jede neben einer Strichfigur in der Größe einer Spielfigur. Baue jede Kreatur aus höchstens drei großen Massen und markiere ihren Blickpunkt mit einem Kreis. Wähle eine aus und zeig sie einer anderen Person zwei Sekunden lang, oder sieh sie dir selbst am nächsten Tag zwei Sekunden lang an. Notiere, was zuerst genannt oder gesehen wurde.
    lang: prose
    checklist:
      - Sechs Thumbnails, jedes mit einer Strichfigur als Größenvergleich daneben.
      - Jede Kreatur ist mindestens dreimal so hoch wie die Strichfigur.
      - In jedem Thumbnail hast du die großen Massen nummeriert, es sind höchstens drei.
      - Jedes Thumbnail hat genau einen markierten Blickpunkt.
      - Du hast notiert, was beim Zwei-Sekunden-Blick zuerst auffiel und ob es dein markierter Blickpunkt war.
    hints:
      - Fang mit dem größten Körper an, etwa einem liegenden Oval, und setz die anderen Massen daran.
    explanation: |
      Bei großen Kreaturen ist die Versuchung groß, den zusätzlichen Platz mit Kleinteilen zu füllen. Die Begrenzung auf drei Massen hält den Umriss lesbar, der eine Blickpunkt sagt dem Auge, wohin es zuerst gehen soll. Der Zwei-Sekunden-Blick prüft genau das. Welche Stellen eines Bosses im Kampf wichtig sind, etwa Schwachpunkte, behandelt [Große Kreaturen als Bosse](/combat/grosse-gegner).
    resources:
      - title: Saint11 · Resizing Pixel Art
        url: https://saint11.art/img/pixel-tutorials/Resizing.gif
