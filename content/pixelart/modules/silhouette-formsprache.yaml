id: silhouette-formsprache
title: Silhouette und Formensprache
level: 2
minutes: 110
summary: Warum eine Figur schon als schwarzer Fleck zeigen muss, was sie ist, wie Grundformen, Größenrhythmus und Negativraum eine Silhouette lesbar machen und wie du mit schnellen Thumbnails auf Papier Varianten findest und prüfst.
place: unterwegs
goals:
  - Du prüfst eine Figur mit dem Silhouettentest und schreibst auf, was man ohne Innenlinien über sie sagen kann.
  - Du erklärst Valves Lesehierarchie für Team Fortress 2 und ordnest Farbe, Silhouette und Kontrast den Fragen eines Spielers zu.
  - Du setzt Kreis, Rechteck und Dreieck als Formensprache ein und begründest, warum das eine Konvention ist und kein Gesetz.
  - Du baust Größenrhythmus und Negativraum gezielt in eine Silhouette ein und planst Lücken so, dass sie eine Kontur überstehen.
  - Du zeichnest Thumbnails in kurzer Zeit, wählst nach vorher notierten Kriterien aus und entwickelst eines in Varianten weiter.
  - Du planst die Silhouette einer großen Kreatur aus wenigen großen Massen mit einem klaren Blickpunkt.
