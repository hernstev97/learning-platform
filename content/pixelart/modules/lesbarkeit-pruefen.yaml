lesson: |
  Du hast zwei Abende an einer Figur gearbeitet. Im Editor bei 800 % ist jeder Pixel vertraut, jede Kante hast du dreimal geprüft. Dann setzt du sie ins Spielbild, und ein Freund fragt: „Wo bist du?“ Das Problem ist nicht dein Auge. Wer stundenlang an einem Bild arbeitet, sieht, was er gemeint hat, nicht, was dasteht.

  Dieses Modul gibt dir Werkzeuge gegen diese Betriebsblindheit: drei Proben, die du in Sekunden machst, eine Art, Rückmeldung zu holen, ohne die Antwort vorzugeben, und ein Protokoll, das deine Überarbeitungen nachvollziehbar macht. Es eignet sich für den Bus: Exportiere dein Mockup als PNG aufs Handy und prüfe dort. Ein Mockup ist ein Bildschirmfoto, wie das Spiel aussehen soll, aus deinen Sprites und Tiles zusammengesetzt, ohne dass etwas programmiert sein muss. Alle Kriterien hier beschreiben, was du prüfst. Ob dir das Ergebnis gefällt, entscheidest du.

  ## Abstand schaffen: warum du deine eigene Arbeit nicht siehst

  Abstand entsteht durch Zeit, durch eine andere Größe und durch eine andere Ansicht. Zeit kostet am wenigsten: Leg ein Asset einen Tag weg, bevor du es beurteilst. Eine andere Größe zeigt, ob die Grundform trägt. James Gurney schreibt über einfache Tonwertgestaltung, dass sie „reads from across the room or when reduced to a tiny size“ ([Why should I mass values?](https://gurneyjourney.blogspot.com/2019/12/why-should-i-mass-values.html)). Eine andere Ansicht entsteht durch Spiegeln. Spiegelst du ein Bild waagerecht, siehst du es mit fremden Augen, und schiefe Achsen oder ungleiche Proportionen springen ins Auge. In Krita spiegelt die Taste M die Ansicht, ohne das Bild zu verändern ([View Menu](https://docs.krita.org/en/reference_manual/main_menu/view_menu.html)).

  > [!TIP] Das Handy als Prüfgerät
  > Exportiere das Mockup einmal in Originalgröße und einmal ganzzahlig vergrößert und schick dir beides aufs Handy. Im Bus siehst du es zum ersten Mal ohne Editor, ohne Raster und ohne Zoom, fast wie ein Spieler. Viele Handys haben in den Bedienungshilfen zusätzlich einen Graustufenmodus.

  ## Drei Proben: Originalgröße, Graustufen, Silhouette

  Jede Probe beantwortet eine eigene Frage. Mach sie in dieser Reihenfolge, weil jede die vorige voraussetzt.

  ![Dieselbe Top-down-Szene dreimal: A winzig in Originalgröße, B vergrößert in Graustufen, C als Silhouetten mit schwarzer Figur, grauen Steinen und weißem Boden](/media/pixelart/lesbarkeit-pruefen/drei-proben@2x.png "Originalgröße (A), Graustufen (B) und Silhouetten (C) derselben Szene. Eigenes Schaubild")

  **Originalgröße (A).** Sieh dir das Mockup bei 100 % an, Pixel für Pixel so groß wie im Spiel. Frage: Erkennst du, was jedes Ding ist, und findest du die Figur sofort? Details, die nur im Zoom existieren, gibt es für den Spieler nicht. Was hier verschwindet, kann weg oder muss größer werden.

  **Graustufen (B).** Nimm die Farbe weg. Frage: Trennen die Tonwerte Figur, Gefahr und Boden? Zwei Farben mit gleicher Helligkeit verschmelzen in Graustufen zu einer Fläche, auch wenn sie farbig verschieden aussehen. Wie du Tonwerte planst, steht in [Licht, Schatten und Tonwerte](/pixelart/licht-werte) und [Farbe, Rampen und begrenzte Paletten](/pixelart/farbe-paletten). In Chromium schaltest du jede Seite über die DevTools auf Graustufen: Ctrl+Shift+P, „Show Rendering“, dann unter „Emulate vision deficiencies“ die Option Achromatopsia ([Chrome DevTools](https://developer.chrome.com/docs/devtools/rendering/apply-effects#emulate_vision_deficiencies)). Öffnest du dein PNG im Browser, prüfst du es so ohne weiteres Programm. In Krita legst du eine Filterebene mit „Desaturate“ über das Bild ([Filter Layers](https://docs.krita.org/en/reference_manual/layers_and_masks/filter_layers.html)).

  **Silhouette (C).** Füll jede Figur schwarz, den Boden weiß. Frage: Erkennst du an der Umrissform, was es ist und wohin es schaut? Valve hat die neun Klassen von Team Fortress 2 so entworfen: „Even when viewed only in silhouette with no internal shading at all, the characters are readily identifiable to players“ ([NPAR 2007](https://media.steampowered.com/apps/valve/2007/NPAR07_IllustrativeRenderingInTeamFortress2.pdf)). Wie man Silhouetten entwirft, zeigt [Silhouette und Formensprache](/pixelart/silhouette-formsprache).

  Dieselben DevTools simulieren auch Protanopie, Deuteranopie und Tritanopie. Hängt eine wichtige Unterscheidung nur an Rot gegen Grün, etwa Gift gegen Heilung, siehst du dort, ob sie hält.

  ## Eine Zahl für Kontrast und ihre Grenzen

  Für Text gibt es ein Maß: das Kontrastverhältnis nach WCAG. Es vergleicht die relative Leuchtdichte zweier Farben, also ihre Helligkeit, wie das Auge sie gewichtet ([Relative luminance](https://www.w3.org/TR/WCAG22/#dfn-relative-luminance), [Contrast ratio](https://www.w3.org/TR/WCAG22/#dfn-contrast-ratio)). 1 heißt gleich hell, 21 ist Schwarz auf Weiß. Für Pixelart ist das keine Regel. Die Zahl sagt aber schnell, ob zwei Farben in Graustufen verschmelzen werden.

  ```python run
  def kanal(v):
      s = v / 255
      if s <= 0.04045:
          return s / 12.92
      return ((s + 0.055) / 1.055) ** 2.4

  def leuchtdichte(hexwert):
      r, g, b = (int(hexwert[i:i + 2], 16) for i in (1, 3, 5))
      return 0.2126 * kanal(r) + 0.7152 * kanal(g) + 0.0722 * kanal(b)

  def kontrast(a, b):
      hell, dunkel = sorted((leuchtdichte(a), leuchtdichte(b)), reverse=True)
      return (hell + 0.05) / (dunkel + 0.05)

  boden = "#8A9C75"
  print("Hemd   ", round(kontrast("#4F7FBF", boden), 1))
  print("Kontur ", round(kontrast("#1F2E52", boden), 1))
  ```

  Die Zahlen stammen aus der Szene im Schaubild oben. Das blaue Hemd hat gegen den grünen Boden nur 1,4 : 1. Farblich ist es klar verschieden, in Graustufen fast gleich hell. Getragen wird die Figur von ihrer dunklen Kontur mit 4,5 : 1. Daraus folgt eine Entscheidung, die du bewusst triffst: Entweder bleibt die Kontur, oder das Hemd braucht einen anderen Tonwert. Die Zahl ersetzt den Blick nicht. Sie misst nur zwei Farben, nicht Form, Größe, Sättigung oder Bewegung.

  ## Lesbarkeit im Spielbild, nicht im Einzelsprite

  Ein Sprite allein auf grauem Grund sagt wenig. Lesbar oder nicht ist es nur zwischen den Dingen, mit denen es im Spiel steht. Prüf deshalb immer ein Mockup in Spielauflösung: Figur, ein Gegner, ein Stück Boden, ein Hindernis. Welche Auflösung dein Spiel hat und wie Godot sie auf den Bildschirm bringt, erklärt [Pixelraster und Skalierung](/godot/pixelraster) im Godot-Kurs.

  Valve ordnet, was ein Spieler zuerst erkennen muss, in einer „Read Hierarchy“: Das Team liest man an der Farbe, die Klasse an Silhouette und Proportionen, danach die Waffe ([MIGS 2008](https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf)). Für dein Mockup stellst du dieselbe Frage: Was muss ein Spieler in einer Sekunde wissen? Wo bin ich, was ist gefährlich, wo kann ich hin. Ein schneller Selbsttest: Schau eine Sekunde auf das Mockup, dann weg, und schreib auf, was du gesehen hast. Steht dort zuerst ein Stein im Hintergrund statt der Figur, ist die Hierarchie verdreht.

  Für Kampfszenen kommt die Lesbarkeit von Angriffen dazu. Wie Gegner Angriffe ankündigen, behandelt [Gegnermuster und Telegraphing](/combat/gegnermuster), wie Bild und Trefferfläche zusammenpassen, [Hitboxen](/combat/hitboxen).

  > [!PRAXIS]
  > Bei Team Fortress 2 war Lesbarkeit eine Gestaltungsvorgabe, kein späterer Test. Moby Francke beschreibt, dass das Team die Figuren „from the dark bottoms to the contrasting upper torso“ abgestuft hat, damit sie besser lesbar sind ([Game Developer, 2008](https://www.gamedeveloper.com/art/in-depth-how-valve-makes-art-to-enhance-gameplay)). Die Folien von 2008 nennen dazu „Highest contrast at chest level, where weapon is held“. Für dich heißt das: Leg vor dem Zeichnen fest, was zuerst gelesen werden soll, und prüf genau das.

  ## Rückmeldung einholen, ohne die Antwort vorzugeben

  Deine eigenen Proben finden viel, aber nicht alles. Du weißt, was das Bild zeigen soll. Ein anderer weiß es nicht und sieht deshalb, was wirklich da ist. Entscheidend ist die Frage. „Erkennst du den Wolf?“ verrät die Antwort. „Was siehst du?“ nicht.

  - Zeig das Mockup fünf Sekunden lang, nimm es weg und frag: „Was hast du gesehen?“
  - Frag danach: „Wo würdest du hinlaufen? Was würdest du meiden?“
  - Schreib die Antworten wörtlich auf und erklär nichts. Jede Erklärung ersetzt die Beobachtung, die du gerade sammeln wolltest.
  - Zähl erst danach, wie viele Personen das Wichtige zuerst genannt haben.

  Das Verfahren kennst du vielleicht aus dem Bereich Erzählhandwerk: [Testlesen und Playtest](/narrative/testlesen-playtest) arbeitet mit denselben offenen Fragen. Eine Antwort ist eine Beobachtung, keine Anweisung. Sagt jemand „mach den Gegner rot“, notierst du, dass er ihn nicht als Gefahr erkannt hat. Wie du das löst, entscheidest du.

  > [!INTERVIEW]
  > In einem Portfolio-Gespräch oder nach einem Art-Test fragt ein Art Lead: „Was würdest du an diesem Asset als Nächstes ändern?“ Gute Antwort: Du nennst eine konkrete Schwäche mit Beleg („In Graustufen verschmilzt der Mantel mit dem Boden, das Kontrastverhältnis lag bei 1,3“), sagst, was du ändern würdest, und wie du prüfst, ob es geholfen hat. Snow Day Games beschrieb in einer inzwischen geschlossenen Anzeige einen bezahlten Testauftrag als Teil der Bewerbung, um zu sehen, ob die künstlerische Vorstellung zusammenpasst ([Work With Indies](https://workwithindies.com/careers/snow-day-games-2d-technical-pixel-artist)). Dort zählt, ob du deine Entscheidungen begründen kannst.

  ## Überarbeiten in Runden, dokumentieren in Sätzen

  Eine Überarbeitungsrunde ändert genau eine Sache. Änderst du Palette, Kontur und Größe auf einmal, weißt du danach nicht, was geholfen hat. Jede Runde hat dieselbe Form:

  ```text
  Runde 2 – Figur im Mockup Wiese
  Befund:   In Graustufen verschmilzt das Hemd mit dem Boden
            (Kontrast 1,4). 2 von 3 Testpersonen nannten
            zuerst einen Stein.
  Änderung: Hemd eine Stufe dunkler in der Rampe, sonst nichts.
  Probe:    Graustufen und 5-Sekunden-Test wiederholt.
  Ergebnis: Kontrast 2,5. 3 von 3 nannten zuerst die Figur.
  Datei:    figur_v2.aseprite, mockup_wiese_v2.png
  ```

  Bewahr jede Fassung auf, mit Versionsnummer im Dateinamen oder in Git, und leg Vorher und Nachher in Originalgröße nebeneinander. So siehst du auch, ob eine Änderung etwas anderes verschlechtert hat.

  Aus den Runden wird ein **Entscheidungsprotokoll**: eine kurze Liste der Entscheidungen, die dein Asset-Set prägen, jeweils mit Grund und der verworfenen Alternative. „Palette mit 24 Farben, weil vier Rampen à sechs Töne für Figur, Gegner, Boden und Requisiten reichen; 32 Farben verworfen, weil zwei Grüntöne in Graustufen gleich waren.“ Ein solches Protokoll ist für dich in einem halben Jahr so wertvoll wie für einen Art Lead, der dein Portfolio liest.

  KI darf dir dabei technische Arbeit abnehmen, etwa ein Skript, das alle PNGs eines Ordners in Graustufen kopiert. Die Entscheidung, was du änderst, und die Pixel selbst bleiben bei dir.

  ## Was danach kommt

  Mit geprüftem Asset-Set hast du alles, was ein Standbild braucht. Zwei Wege führen weiter. Wie du die PNGs in Godot scharf und im richtigen Raster importierst, zeigt [Eigene Sprites importieren](/godot/sprites-importieren). Wie Figuren sich bewegen, mit Timing, Gewicht und Schlüsselposen, ist Thema des Animationskurses, der auf diesem Kurs aufbaut. Nimm dorthin deine Maßstabstabelle, deine Palette und dein Entscheidungsprotokoll mit: Jede Animation muss dieselben Proben bestehen, nur in Bewegung.

  ## Häufige Fehler

  - **Nur im Zoom geprüft.** Details, die bei 1× verschwinden, kosten Zeit und bringen dem Spieler nichts.
  - **Sprite allein geprüft.** Lesbar ist ein Sprite nur vor dem Boden und neben den Dingen, mit denen es im Spiel steht.
  - **Farbe für Tonwert gehalten.** Verschiedene Farbtöne können gleich hell sein und verschmelzen in Graustufen.
  - **Die Zahl über das Auge gestellt.** Das Kontrastverhältnis misst zwei Farben, nicht Form, Größe oder Sättigung.
  - **Führende Fragen.** „Siehst du, dass das Gift ist?“ liefert Zustimmung, keine Beobachtung.
  - **Rückmeldung als Anweisung genommen.** Notier, was jemand gesehen oder nicht gesehen hat, und such die Lösung selbst.
  - **Mehrere Änderungen pro Runde.** Danach weißt du nicht, was gewirkt hat.
  - **Alte Fassungen überschrieben.** Ohne Vorher kein Vergleich und kein Beleg.

  ## Zusammenfassung

  - Abstand entsteht durch Zeit, eine andere Größe und eine gespiegelte Ansicht.
  - Originalgröße prüft Details, Graustufen prüfen Tonwerte, die Silhouette prüft Form und Richtung.
  - Das Kontrastverhältnis nach WCAG zeigt schnell, ob zwei Farben verschmelzen, ist aber keine Regel für Pixelart.
  - Geprüft wird im Mockup in Spielauflösung, nach einer festgelegten Lesehierarchie.
  - Rückmeldung holst du mit offenen Fragen und notierst sie wörtlich.
  - Jede Überarbeitungsrunde ändert eine Sache und hält Befund, Änderung, Probe und Ergebnis fest.
  - Das Entscheidungsprotokoll sammelt Gründe und verworfene Alternativen.
exercises:
  - id: probe-zuordnen
    type: choice
    title: Welche Probe beantwortet was?
    prompt: |
      Welche Zuordnungen von Probe und Frage stimmen?
    options:
      - text: Originalgröße – sind alle Details auch in Spielgröße erkennbar?
        correct: true
        why: Bei 100 % siehst du das Bild so groß wie der Spieler. Was dort verschwindet, existiert für ihn nicht.
      - text: Graustufen – trennen die Tonwerte Figur, Gefahr und Boden?
        correct: true
        why: Ohne Farbe bleibt nur die Helligkeit. Gleich helle Farben verschmelzen.
      - text: Silhouette – passen die Farben der Figur zur Palette?
        correct: false
        why: In der Silhouette gibt es keine Farben. Sie prüft Umrissform und Blickrichtung.
      - text: Graustufen – erkennt man, wohin die Figur schaut?
        correct: false
        why: Die Richtung liest man vor allem an der Umrissform. Dafür ist die Silhouettenprobe da.
    explanation: |
      Jede Probe nimmt dem Bild etwas weg und zeigt so, ob der Rest trägt. Die Originalgröße nimmt den Zoom weg, Graustufen nehmen die Farbe weg, die Silhouette nimmt Farbe und Innenzeichnung weg. Wer weiß, welche Frage eine Probe beantwortet, weiß auch, welche er nach einer Änderung wiederholen muss.
    resources:
      - title: Valve · Illustrative Rendering in Team Fortress 2 (NPAR 2007)
        url: https://media.steampowered.com/apps/valve/2007/NPAR07_IllustrativeRenderingInTeamFortress2.pdf

  - id: drei-proben-lesen
    type: choice
    title: Was zeigt die Graustufenprobe?
    prompt: |
      Sieh dir Feld B an. Welche Aussage trifft zu?

      ![Dieselbe Top-down-Szene dreimal: A winzig in Originalgröße, B vergrößert in Graustufen, C als Silhouetten](/media/pixelart/lesbarkeit-pruefen/drei-proben@2x.png "Drei Proben derselben Szene. Eigenes Schaubild")
    options:
      - text: Das Hemd der Figur ist in Graustufen fast so hell wie der Boden. Die Figur trennt sich vor allem über ihre dunkle Kontur und die dunklen Haare.
        correct: true
        why: Das Hemd hat gegen den Boden ein Kontrastverhältnis von etwa 1,4, die Kontur von etwa 4,5. Ohne Kontur würde die Figur in Graustufen weitgehend verschwinden.
      - text: Die Figur ist in Graustufen unsichtbar, die Szene ist also unbrauchbar.
        correct: false
        why: Die Figur ist sichtbar, getragen von Kontur und dunklen Teilen. Die Probe zeigt, wovon die Lesbarkeit abhängt, nicht dass sie fehlt.
      - text: Die Steine sind dunkler als die Figur und ziehen deshalb mehr Blick.
        correct: false
        why: Die Steine liegen in einem engen, mittleren Wertebereich. Die dunkelsten Werte des Bildes gehören der Figur.
      - text: Graustufen sagen nichts über Lesbarkeit, weil das Spiel farbig ist.
        correct: false
        why: Tonwerte tragen einen großen Teil der Lesbarkeit, auch in Farbe. Graustufen machen sie sichtbar.
    explanation: |
      Die Graustufenprobe zeigt, welche Teile eines Bildes über Helligkeit getrennt sind. Hier ist es die Kontur, nicht die Hemdfarbe. Das ist kein Fehler, aber eine Abhängigkeit, die du kennen musst: Nimmst du später die Kontur weg oder hellst sie auf, verschwindet die Figur auf diesem Boden.
    resources:
      - title: Chrome DevTools · Emulate vision deficiencies
        url: https://developer.chrome.com/docs/devtools/rendering/apply-effects#emulate_vision_deficiencies

  - id: pruefrunde-ordnen
    type: order
    title: Eine Prüfrunde
    prompt: |
      Bring die Schritte einer Prüf- und Überarbeitungsrunde in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Das Mockup in Spielauflösung exportieren.
      Es in Originalgröße ansehen und notieren, was auffällt.
      Graustufen- und Silhouettenprobe machen.
      Genau einen Befund für diese Runde auswählen.
      Eine Änderung vornehmen und als neue Fassung speichern.
      Dieselben Proben wiederholen und Vorher und Nachher vergleichen.
      Befund, Änderung und Ergebnis ins Protokoll schreiben.
    explanation: |
      Geprüft wird das Spielbild, nicht das Einzelsprite, deshalb steht der Export am Anfang. Die Originalgröße kommt zuerst, weil sie die gröbsten Probleme zeigt. Erst wenn alle Befunde gesammelt sind, wählst du einen aus. Eine neue Fassung statt Überschreiben macht den Vergleich möglich, und das Protokoll am Ende hält fest, was die Runde gebracht hat.
    resources:
      - title: Jason Mitchell · Connecting Visuals to Gameplay at Valve (MIGS 2008)
        url: https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf

  - id: kontrast-rechnen
    type: output
    title: Die Grenzen der Skala
    prompt: |
      Was gibt das Programm aus? Zwei Zeilen.
    lang: python
    code: |
      def kanal(v):
          s = v / 255
          if s <= 0.04045:
              return s / 12.92
          return ((s + 0.055) / 1.055) ** 2.4

      def leuchtdichte(hexwert):
          r, g, b = (int(hexwert[i:i + 2], 16) for i in (1, 3, 5))
          return 0.2126 * kanal(r) + 0.7152 * kanal(g) + 0.0722 * kanal(b)

      def kontrast(a, b):
          hell, dunkel = sorted((leuchtdichte(a), leuchtdichte(b)), reverse=True)
          return (hell + 0.05) / (dunkel + 0.05)

      print(round(kontrast("#FFFFFF", "#000000")))
      print(round(kontrast("#808080", "#808080")))
    expected: |
      21
      1
    hints:
      - Weiß hat die relative Leuchtdichte 1, Schwarz 0.
      - Zwei gleiche Farben haben dieselbe Leuchtdichte.
    explanation: |
      Die Formel teilt die hellere Leuchtdichte plus 0,05 durch die dunklere plus 0,05. Weiß gegen Schwarz ergibt 1,05 ÷ 0,05 = 21, den größten möglichen Wert. Zwei gleiche Farben ergeben immer 1, egal wie hell sie sind. Diese beiden Grenzen helfen, jede andere Zahl einzuordnen: 1,4 liegt nah an „gleich hell“, 4,5 deutlich darüber.
    resources:
      - title: W3C · WCAG 2.2 · Contrast ratio
        url: https://www.w3.org/TR/WCAG22/#dfn-contrast-ratio

  - id: faktor-mockup
    type: output
    title: Wie groß wird das Mockup?
    prompt: |
      Dein Mockup ist 384 × 216 Pixel groß. Du willst es ganzzahlig vergrößert so zeigen, dass es einen Bildschirm mit 1920 × 1080 Pixeln genau ausfüllt. Mit welchem Faktor? Antworte mit der Zahl.
    lang: text
    code: |
      Mockup:     384 × 216
      Bildschirm: 1920 × 1080
    expected: |
      5
    accept:
      - 5x
      - 5×
      - fünf
      - Faktor 5
      - 5-fach
      - fünffach
    hints:
      - Teile Breite durch Breite und Höhe durch Höhe.
    explanation: |
      1920 ÷ 384 = 5 und 1080 ÷ 216 = 5. Beide Richtungen gehen ganzzahlig auf, jeder Pixel wird ein Quadrat aus 5 × 5 Bildschirmpixeln. Bei einem Faktor wie 4,5 würden Pixel ungleich groß, und du würdest Fehler sehen, die im Spiel nicht da sind. Wie Godot das im Spiel löst, steht im Godot-Kurs unter Pixelraster und Skalierung.
    resources:
      - title: Godot Docs · Multiple resolutions · Stretch scale mode
        url: https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#stretch-scale-mode

  - id: zwei-kontraste
    type: output
    title: Dunkler heißt mehr Kontrast?
    prompt: |
      Das Programm vergleicht das Hemd der Figur aus der Lektion mit einer Fassung, die eine Stufe dunkler ist, beide gegen denselben Boden. Was gibt es aus? Zwei Zeilen. Rechnen musst du nicht, überlege, was die Funktionen tun.
    lang: python
    code: |
      def kanal(v):
          s = v / 255
          if s <= 0.04045:
              return s / 12.92
          return ((s + 0.055) / 1.055) ** 2.4

      def leuchtdichte(hexwert):
          r, g, b = (int(hexwert[i:i + 2], 16) for i in (1, 3, 5))
          return 0.2126 * kanal(r) + 0.7152 * kanal(g) + 0.0722 * kanal(b)

      def kontrast(a, b):
          hell, dunkel = sorted((leuchtdichte(a), leuchtdichte(b)), reverse=True)
          return (hell + 0.05) / (dunkel + 0.05)

      boden = "#8A9C75"        # heller als beide Hemden
      hemd = "#4F7FBF"         # Kontrast 1,4 laut Lektion
      hemd_dunkler = "#33558F" # eine Stufe dunkler in der Rampe
      print(kontrast(hemd_dunkler, boden) > kontrast(hemd, boden))
      print(kontrast(boden, hemd) == kontrast(hemd, boden))
    expected: |
      True
      True
    hints:
      - Der Boden ist heller als beide Hemden. Was passiert mit dem Abstand, wenn das Hemd dunkler wird?
      - Was macht `sorted(..., reverse=True)` mit der Reihenfolge der beiden Farben?
    explanation: |
      Der Boden ist heller als beide Hemden. Wird das Hemd dunkler, sinkt seine Leuchtdichte, der Nenner wird kleiner und das Verhältnis größer: von 1,4 auf 2,5. Die zweite Zeile ist `True`, weil `sorted(..., reverse=True)` immer die hellere Farbe nach vorn stellt. Die Reihenfolge der Argumente spielt keine Rolle, das Verhältnis ist immer mindestens 1. Gilt das auch umgekehrt? Ist der Boden dunkler als das Hemd, bringt ein dunkleres Hemd weniger Kontrast. Die Richtung hängt also davon ab, auf welcher Seite des Bodens die Figur liegt.
    resources:
      - title: W3C · WCAG 2.2 · Contrast ratio
        url: https://www.w3.org/TR/WCAG22/#dfn-contrast-ratio

  - id: begriffe-pruefen
    type: gap
    title: Begriffe der Prüfung
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Ein zusammengesetztes Bildschirmfoto, wie das Spiel aussehen soll, heißt ⟦Mockup⟧. Füllst du jede Figur schwarz, machst du die ⟦Silhouettenprobe⟧. Valve ordnet, was ein Spieler zuerst erkennen muss, in einer ⟦Lesehierarchie⟧. Die Liste deiner Gestaltungsentscheidungen mit Gründen und verworfenen Alternativen heißt ⟦Entscheidungsprotokoll⟧.
    gaps:
      - label: zusammengesetztes Spielbild
        hint: Englisches Wort, auch im Deutschen üblich.
        accept: ["Mock-up", "Mock up", "Attrappe"]
      - label: schwarze Figuren
        hint: Zusammengesetzt aus Umrissform und Probe.
        accept: ["Silhouette", "Silhouettentest", "Silhouetten-Probe", "Silhouettenprüfung"]
      - label: Valves Ordnung
        hint: Auf Englisch „Read Hierarchy“.
        accept: ["Read Hierarchy", "Lesereihenfolge", "Hierarchie"]
      - label: Liste der Entscheidungen
        hint: Ein Protokoll über Entscheidungen.
        accept: ["Gestaltungsprotokoll", "Entscheidungslog", "Designprotokoll"]
    explanation: |
      Mockup, Silhouettenprobe und Lesehierarchie gehören zur Prüfung, das Entscheidungsprotokoll zur Dokumentation. Zusammen beantworten sie zwei Fragen: Liest der Spieler, was er lesen soll? Und weißt du später noch, warum es so aussieht?
    resources:
      - title: Jason Mitchell · Connecting Visuals to Gameplay at Valve (MIGS 2008)
        url: https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf

  - id: fuehrende-frage
    type: bug
    title: Eine Frage zu viel
    prompt: |
      Du testest ein Mockup mit einem Gegner, der giftig sein soll. Nach dem Test weißt du nur, dass alle zugestimmt haben, aber nicht, ob jemand die Gefahr von selbst erkannt hätte. Finde die Frage, die das verursacht hat.
    lang: prose
    code: |
      Was hast du in den fünf Sekunden gesehen?
      Wo würdest du hinlaufen?
      Was würdest du meiden?
      Siehst du, dass der grüne Gegner giftig ist?
      Woran hast du die Figur erkannt?
    lines: [4]
    hints:
      - Welche Frage enthält schon die Antwort?
    explanation: |
      Frage 4 nennt den Gegner, seine Farbe und seine Eigenschaft. Wer so gefragt wird, schaut hin und stimmt zu, auch wenn er das Gift vorher nicht bemerkt hat. Die Fragen 1 bis 3 lassen die Antwort offen. Ob der Gegner als Gefahr gelesen wird, zeigt sich bei Frage 3: Nennt ihn dort jemand von selbst, wirkt die Gestaltung.
    resources:
      - title: Valve · Illustrative Rendering in Team Fortress 2 (NPAR 2007)
        url: https://media.steampowered.com/apps/valve/2007/NPAR07_IllustrativeRenderingInTeamFortress2.pdf

  - id: protokoll-runde
    type: bug
    title: Was hat geholfen?
    prompt: |
      Nach diesen Überarbeitungsrunden ist die Figur deutlich besser lesbar. Du kannst aber nicht sagen, welche Änderung das bewirkt hat. Finde die Zeile, die das verursacht.
    lang: prose
    code: |
      Runde 1: Kontur der Figur von Schwarz auf dunkles Blau, Silhouettenprobe wiederholt.
      Runde 2: Palette ausgetauscht, Figur zwei Pixel größer gezeichnet und Boden aufgehellt.
      Runde 3: Glanzlicht im Haar entfernt, Originalgröße verglichen.
      Runde 4: Hemd eine Stufe dunkler, Graustufenprobe wiederholt.
    lines: [2]
    hints:
      - Zähl, wie viele Dinge jede Runde ändert.
    explanation: |
      Runde 2 ändert drei Dinge auf einmal: Palette, Größe und Boden. Wird die Figur danach besser lesbar, kann jede der drei Änderungen der Grund sein, oder nur ihre Kombination. Teilst du sie auf drei Runden auf, weißt du, welche wirkt, und kannst die anderen zurücknehmen, falls sie etwas verschlechtert haben.

  - id: lesehierarchie-erklaeren
    type: explain
    title: Dunkle Füße, helle Brust
    prompt: |
      Valve hat die Figuren in Team Fortress 2 von dunklen Beinen zu einem hellen, kontrastreichen Oberkörper abgestuft. Erkläre in drei bis fünf Sätzen, warum das der Lesbarkeit dient und was du daraus für Figuren in einem Top-down-Spiel ableiten kannst.
    lang: text
    code: |
      MIGS 2008, Folie „Read Hierarchy“:
      Team   → Farbe
      Klasse → Silhouette, Proportionen, Waffen
      Waffe  → „Highest contrast at chest level,
                where weapon is held“
               „Gradient from dark feet to light chest“
    points:
      - Der Blick geht zum stärksten Kontrast. Liegt er an der Brust, landet er dort, wo die Waffe und damit die Information sitzt.
      - Dunkle Beine treten zurück und konkurrieren nicht mit dem, was zuerst gelesen werden soll.
      - Die Abstufung folgt einer festgelegten Reihenfolge, was ein Spieler zuerst, dann und zuletzt erkennen muss.
      - Für eigene Figuren heißt das, vor dem Zeichnen festzulegen, was zuerst gelesen werden soll, und den stärksten Kontrast dorthin zu legen.
    explanation: |
      Das Auge springt zum stärksten Hell-Dunkel-Unterschied. Valve legt diesen Unterschied an die Brust, wo die Waffe gehalten wird, denn die Waffe sagt dem Spieler, was die Figur gleich tut. Die dunklen Beine treten zurück. Die Abstufung ist kein Stilmittel, sondern die Umsetzung der Lesehierarchie in Tonwerte. In einem Top-down-Spiel siehst du Figuren klein und von schräg oben. Was dort zuerst gelesen werden muss, entscheidest du für dein Spiel, etwa Kopf und Blickrichtung oder eine Waffe. Der stärkste Kontrast gehört dorthin, und die Graustufenprobe zeigt, ob er dort sitzt.
    resources:
      - title: "Game Developer · In-Depth: How Valve Makes Art To Enhance Gameplay"
        url: https://www.gamedeveloper.com/art/in-depth-how-valve-makes-art-to-enhance-gameplay

  - id: proben-unterwegs
    type: practice
    title: Drei Proben im Bus
    prompt: |
      Nimm ein eigenes Mockup, Sprite oder eine Zeichnung aus diesem Kurs als PNG oder Foto aufs Handy. Mach unterwegs die drei Proben: Originalgröße, Graustufen (Bedienungshilfen des Handys oder vorher exportierte Graustufenkopie), Silhouette (eine schwarz gefüllte Kopie oder ein Blick mit zusammengekniffenen Augen). Schreib zu jeder Probe höchstens zwei Sätze.
    lang: prose
    checklist:
      - Zu jeder der drei Proben steht, welche Frage sie beantwortet und was du gesehen hast.
      - Mindestens ein Befund nennt eine konkrete Stelle, etwa „Hemd und Boden verschmelzen in Graustufen“.
      - Du hast den Befund ausgewählt, den du als Nächstes bearbeiten willst, und notiert, warum.
      - Du hast notiert, welche Probe du nach der Änderung wiederholen musst.
    explanation: |
      Unterwegs fehlt der Editor, und genau das ist der Vorteil. Du siehst das Bild ohne Raster und Zoom und kannst nicht sofort etwas ändern. So trennst du Befund und Lösung, die du am PC umsetzt.
    resources:
      - title: Chrome DevTools · Emulate vision deficiencies
        url: https://developer.chrome.com/docs/devtools/rendering/apply-effects#emulate_vision_deficiencies

  - id: fuenf-sekunden-test
    type: practice
    title: Fünf Sekunden für eine fremde Person
    prompt: |
      Zeig einer Person, die das Bild nicht kennt, dein Mockup oder ein Sprite fünf Sekunden lang am Handy. Stell danach nur offene Fragen und erklär nichts. Schreib die Antworten wörtlich auf.
    lang: prose
    checklist:
      - Du hast vorher aufgeschrieben, was die Person zuerst erkennen soll.
      - Keine deiner Fragen nennt ein Ding, eine Farbe oder eine Eigenschaft, die die Person erkennen soll.
      - Die Antworten stehen wörtlich da, ohne deine Deutung.
      - Du hast notiert, ob die Person das Wichtige zuerst genannt hat, ja oder nein.
      - Wenn die Person eine Lösung vorgeschlagen hat, steht dort, welche Beobachtung dahintersteckt.
    explanation: |
      Die Person weiß nicht, was das Bild zeigen soll, und sieht deshalb, was dasteht. Deine vorher notierte Erwartung ist der Maßstab, an dem du die Antwort misst. Vorschläge wie „mach es rot“ übersetzt du in die Beobachtung dahinter. Die Lösung bleibt deine Entscheidung.
    resources:
      - title: Jason Mitchell · Connecting Visuals to Gameplay at Valve (MIGS 2008)
        url: https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf

  - id: protokoll-eintrag
    type: practice
    title: Ein Eintrag im Entscheidungsprotokoll
    prompt: |
      Schreib für eine echte Entscheidung aus deiner bisherigen Arbeit in diesem Kurs einen Eintrag ins Entscheidungsprotokoll, etwa zu Palette, Spritegröße, Kontur oder Maßstab. Höchstens vier Sätze.
    lang: prose
    checklist:
      - Der Eintrag nennt die Entscheidung in einem Satz.
      - Er nennt einen Grund, der sich prüfen lässt, etwa eine Probe, eine Zahl oder eine Testantwort.
      - Er nennt mindestens eine verworfene Alternative und warum du sie verworfen hast.
      - Er nennt die Datei oder Fassung, auf die er sich bezieht.
    explanation: |
      Ein Protokolleintrag hält fest, was du entschieden hast, warum und wogegen. Der prüfbare Grund unterscheidet ihn von einer Geschmacksaussage. Die verworfene Alternative zeigt, dass es eine Wahl gab. Das ist die Form, die ein Art Lead im Portfolio sucht, und die Form, die du selbst in einem halben Jahr brauchst.
