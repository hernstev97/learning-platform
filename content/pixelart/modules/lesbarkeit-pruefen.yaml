id: lesbarkeit-pruefen
title: Prüfen, überarbeiten, dokumentieren
level: 3
minutes: 110
summary: Wie du eigene Sprites und Tiles mit drei schnellen Proben – Originalgröße, Graustufen, Silhouette – im Spielbild prüfst, Rückmeldung einholst, ohne die Antwort vorzugeben, und Überarbeitungen so festhältst, dass du später weißt, warum etwas so aussieht.
place: unterwegs
goals:
  - Du prüfst ein Asset im Mockup mit 1×-, Graustufen- und Silhouettenprobe und sagst, welche Frage jede Probe beantwortet.
  - Du rechnest das Kontrastverhältnis zweier Farben nach WCAG aus und kennst die Grenzen dieser Zahl für Pixelart.
  - Du stellst Testpersonen offene Fragen und hältst ihre Antworten wörtlich fest.
  - Du überarbeitest in Runden mit genau einer Änderung und belegst jede Runde mit Vorher, Nachher und Grund.
  - Du führst ein Entscheidungsprotokoll, aus dem ein anderer die Gründe deiner Gestaltung ablesen kann.
