lesson: |
  Du schattierst eine Kugel mit Bleistift. Rundum am Rand wird es dunkler, in der Mitte bleibt es hell. Das Ergebnis sieht aus wie ein Knopf oder ein Kissen, nicht wie eine Kugel unter einer Lampe. Du weißt nicht, woher das Licht kommt, und die Zeichnung weiß es auch nicht. Jetzt leg eine Orange unter die Schreibtischlampe. Eine Seite ist hell, die andere dunkel. Auf dem Tisch liegt ein Schatten, der von der Lampe wegzeigt, und genau unter der Orange ist es am dunkelsten.

  Dieses Modul übt das Sehen von Licht: was ein Tonwert ist, wie Licht auf eine Form fällt und warum wenige, klar getrennte Werte ein Bild lesbar machen, auch wenn es winzig ist. Genau das brauchst du für Sprites. Du arbeitest mit Bleistift und Papier und mit der Kamera deines Handys. Farbe kommt erst in [Farbe, Rampen und begrenzte Paletten](/pixelart/farbe-paletten).

  ## Tonwert: Helligkeit ohne Farbe

  Matt Kohr (Ctrl+Paint) definiert den Begriff so: „In the vocabulary of painting 'value' refers to illumination. Light areas are high in value, dark areas are low in value.“ ([Sketching: Value](https://www.ctrlpaint.com/videos/sketching-value)) Der **Tonwert** (value) ist also die Helligkeit einer Fläche, unabhängig von ihrem Farbton. Ein kräftiges Rot und ein mittleres Blau können fast denselben Tonwert haben. In Graustufen verschwimmen sie dann zu einer Fläche. Wie nah sich Farben dabei kommen, rechnet das Farbmodul mit konkreten Werten nach.

  Kohr rät, mit Graustufen anzufangen: „it's important to start your drawing and painting education in grayscale“ und „reserve color for later“ ([Why Practice in Grayscale](https://www.ctrlpaint.com/videos/why-practice-in-grayscale)). Ohne Farbe bleibt nur die Frage, wie hell oder dunkel etwas ist. Das ist die Frage, die über Form und Lesbarkeit entscheidet.

  ![Neun graue Felder nebeneinander, von links Weiß bis rechts fast Schwarz, darunter die Zahlen 1 bis 9](/media/pixelart/licht-werte/werteskala@2x.png "Werteskala in neun Stufen, 1 hell bis 9 dunkel. Eigenes Schaubild")

  Eine **Werteskala** ordnet Tonwerte in gleichmäßigen Stufen. Dieser Kurs zählt 1 als Weiß und 9 als fast Schwarz, andere Skalen zählen umgekehrt. Mit neun Stufen kannst du jede Fläche einordnen: Die helle Wand liegt bei 2, der Schatten unter dem Tisch bei 8. Für den Anfang reichen drei Gruppen: hell 1 bis 3, mittel 4 bis 6, dunkel 7 bis 9.

  ## Licht auf der Kugel: vom Glanzlicht bis zum Schlagschatten

  Eine Kugel zeigt alle Lichtzonen, die eine Form haben kann. Proko beschreibt sie in [How to Shade a Drawing](https://www.proko.com/course-lesson/how-to-shade-a-drawing/), Derek Yu nimmt für seine Figur eine Lichtquelle „above … and slightly in front“ an und schreibt: „By shading, you're not just adding color - you're sculpting out a form.“ ([Form and Volume](https://www.derekyu.com/makegames/pixelart.html#form))

  ![Zwei graue Kugeln auf hellem Grund, Licht von oben links vorn. A hat oben links ein weißes Glanzfeld, dann hellgraues Licht, ein mittelgraues Band, ein dunkles Band unten rechts und ganz am unteren rechten Rand einen etwas helleren Streifen. Unter der Kugel liegt ein kleiner schwarzer Fleck, nach rechts zieht ein langer dunkelgrauer Schatten über den Boden. B ist dieselbe Kugel mit nur zwei Werten: hellgrau auf der Lichtseite, dunkelgrau auf der Schattenseite, mit denselben Schatten am Boden](/media/pixelart/licht-werte/licht-auf-kugel@2x.png "Alle Lichtzonen (A) und dieselbe Kugel in zwei Werten (B). Eigenes Schaubild")

  In Kugel A, von oben links nach unten rechts:

  - **Glanzlicht:** der hellste Fleck. Proko nennt ihn die Fläche, die das Licht „relative to the position of the viewer“ zurückwirft. Gehst du um die Kugel herum, wandert er mit.
  - **Licht:** die Flächen, die zur Lampe zeigen.
  - **Halbton:** der Übergang, laut Proko „darkest near the core shadow and lightest at the center light“.
  - **Terminator:** die Grenze, an der die Form sich vom Licht abwendet. Hier beginnt der Schatten.
  - **Kernschatten:** „a darker strip at the edge of the shadow“, das dunkelste Band auf der Kugel selbst.
  - **Reflexlicht:** Licht, das vom Boden zurück in die Schattenseite fällt. Proko beschreibt es als heller als den Kernschatten. In A ist es der etwas hellere Streifen am unteren rechten Rand.
  - **Kontaktschatten:** der dunkelste Fleck genau dort, wo die Kugel den Boden berührt. Proko nennt ihn „occlusion shadow“. Er stellt die Kugel auf den Boden.
  - **Schlagschatten:** der Schatten, den die Kugel auf den Boden wirft. Er zeigt von der Lichtquelle weg, hier nach rechts.

  ## Zwei Familien: Licht- und Schattenseite

  Proko ordnet alle Zonen zwei Familien zu: „All the planes that face the light will belong to the light family.“ und „All the planes that face away from the light will belong to the shadow family.“ Sein wichtigster Satz: „The most important part is to separate the shadow family from the light family.“ (How to Shade a Drawing)

  Kugel B im Schaubild zeigt, wie viel diese Trennung allein leistet. Sie hat nur zwei Werte auf der Kugel, und trotzdem liest du eine runde Form mit Licht von oben links. Der Terminator als Grenze zwischen beiden Werten trägt die Form, die Abstufungen in A verfeinern sie nur.

  Daraus folgt eine Regel für jede Abstufung: Alles in der Lichtfamilie bleibt heller als alles in der Schattenfamilie. Das Reflexlicht hellt die Schattenseite auf, gehört aber zu ihr. Machst du es so hell wie die Lichtseite, verschwimmen beide Familien, und die Kugel wird flach. Pedro Medeiros (Saint11) rät für Pixelart außerdem „avoid gradients when possible“ ([Shading](https://saint11.art/img/pixel-tutorials/Shading.gif)): wenige klare Stufen statt eines weichen Verlaufs. Wie du damit Kissenschattierung vermeidest, zeigt [Schattieren, Dithering, Textur und Detailgrad](/pixelart/schattieren-textur).

  > [!MERKE]
  > Erst Licht und Schatten trennen, dann abstufen. Die Grenze zwischen beiden Familien trägt die Form.

  ## Werteskala und Wertegruppen

  Wie viele Werte braucht ein Bild? James Gurney antwortet auf diese Frage für Studien: „the fewer values the better“, und zitiert Howard Pyle: „The fewer tones the simpler and better your pictures.“ Er empfiehlt dafür zwei oder drei Töne ([How Many Values?](https://gurneyjourney.blogspot.com/2018/01/how-many-values.html)). In einem zweiten Beitrag begründet er, warum wenige große Wertegruppen wirken: „You can tell at a glance what's going on, and it reads from across the room or when reduced to a tiny size.“ ([Why Should I Mass Values?](https://gurneyjourney.blogspot.com/2019/12/why-should-i-mass-values.html)) „Reduced to a tiny size“ – das ist die Lage jedes Sprites.

  Die Gestaltung mit wenigen Hell-Dunkel-Formen hat auch einen japanischen Namen: **Notan**, laut Wikipedia „a design aesthetic referring to the use of light and shade“. Im Westen machte ihn Arthur Wesley Dow mit seinem Buch „Composition“ von 1899 bekannt ([Notan](https://en.wikipedia.org/wiki/Notan)).

  ![Zwei Fassungen derselben Szene in Graustufen: ein Ball auf einer Kiste vor einer Wand, Licht von oben links. In A sind die Werte überall zufällig verstreut, Wand, Boden und Kiste flimmern, der Ball ist kaum zu erkennen. In B gibt es nur drei Werte: Ballseite zum Licht, Oberseite der Kiste und Boden hell; Wand und Kistenfront mittel; Schattenseite des Balls und die Schlagschatten dunkel](/media/pixelart/licht-werte/wertegruppen@2x.png "Verstreute Werte (A) und drei Wertegruppen (B). Eigenes Schaubild")

  In A weicht rund die Hälfte der Pixel zufällig um eine Stufe von ihrer Fläche ab. Im Zoom wirkt das wie Struktur, auf Handygröße wie Rauschen, und die Formen gehen unter. In B gehört jede Fläche zu einer von drei Gruppen: Was zum Licht zeigt, ist hell. Was senkrecht steht oder sich abwendet, ist mittel. Was im Schatten liegt, ist dunkel. Der Ball hebt sich ab, weil sein heller Teil vor der mittleren Wand sitzt und sein dunkler Teil an die helle Kistenoberseite grenzt.

  Gurney beschreibt dasselbe Prinzip: Weniger wichtige Teile dürfen in einer hellen oder einer dunklen Masse aufgehen, „light-on-light“ oder „dark-on-dark“. Die Wand in B ist so eine Masse, sie hat keinen eigenen Kontrast.

  ## Kontrast lenkt den Blick

  Gurney schreibt weiter: „The parts that you want the viewer to notice are highly contrasting.“ (Why Should I Mass Values?) Das Auge springt dorthin, wo Hell und Dunkel am stärksten aufeinandertreffen. Für ein Spiel heißt das: Spielfigur und Gefahren bekommen den stärksten Kontrast, der Boden einen engen Wertebereich. Wie du das in einer Szene umsetzt, zeigen [Umgebung und Tiles](/pixelart/umgebung-tiles) und [Prüfen, überarbeiten, dokumentieren](/pixelart/lesbarkeit-pruefen).

  > [!PRAXIS]
  > Valve hat die Figuren in Team Fortress 2 über Tonwerte lesbar gemacht. Jason Mitchells Vortrag nennt einen „Gradient from dark feet to light chest“ und den „Highest contrast at chest level, where weapon is held“ ([Connecting Visuals to Gameplay at Valve](https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf)). Art Director Moby Francke beschreibt es im Interview: „We then also gradated the character from the dark bottoms to the contrasting upper torso for better readability.“ ([Game Developer](https://www.gamedeveloper.com/art/in-depth-how-valve-makes-art-to-enhance-gameplay)) Die Werte folgen dort nicht nur dem Licht, sondern einer Entscheidung, wohin der Spieler schauen soll.

  ## Tonwertstudien auf Papier und am Handy

  Eine **Tonwertstudie** ist eine kleine Skizze nur aus Werten, ohne Linien und ohne Farbe. Kohr nennt das Arbeiten direkt in Tönen eine gute Übung, weil sie zwingt, über Form und Masse nachzudenken (Sketching: Value).

  **Auf Papier** nimmst du drei Werte: Papierweiß für hell, eine lockere Schraffur für mittel, eine dichte Schraffur für dunkel. Zeichne ein Rechteck von etwa 5 × 4 cm, leg die Lichtrichtung mit einem Pfeil fest und füll jede Fläche mit einem der drei Werte. Motive gibt es überall: eine Haltestelle, ein Tisch mit Tasse, ein Fenster mit Vorhang.

  **Am Handy** fotografierst du dasselbe Motiv und stellst das Foto mit einem Schwarz-Weiß-Filter der Galerie-App auf Graustufen. Dann vergleichst du: Liegt die Wand in derselben Gruppe wie in deiner Skizze?

  **Am PC** legst du in Krita eine Filterebene mit dem Filter „Desaturate“ über dein Bild ([Filter Layers](https://docs.krita.org/en/reference_manual/layers_and_masks/filter_layers.html), [Desaturate](https://docs.krita.org/en/reference_manual/filters/adjust.html#desaturate)). Das Bild darunter bleibt farbig, die Ebene lässt sich an- und ausschalten. Chromium kann jede Webseite in Graustufen zeigen, auch einen Screenshot im Browser: In den DevTools unter „Rendering“ die Option „Emulate vision deficiencies“ auf „Achromatopsia“ stellen ([Chrome DevTools](https://developer.chrome.com/docs/devtools/rendering/apply-effects#emulate_vision_deficiencies)).

  > [!TIP] Augen zusammenkneifen
  > Kneif die Augen zusammen, bis das Motiv verschwimmt. Details verschwinden, die großen hellen und dunklen Formen bleiben. Was du dann siehst, gehört in die Tonwertstudie.

  > [!INTERVIEW]
  > Im Portfolio-Gespräch zeigt ein Art Lead auf ein Sprite: „Warum liest sich die Figur vor diesem Hintergrund schlecht?“ Gute Antwort: Du stellst Figur und Hintergrund in Graustufen und prüfst, ob sie in derselben Wertegruppe liegen. Dann nennst du die Abhilfe in Werten, nicht in Farben: den Hintergrund in einen engeren, mittleren Bereich legen, der Figur den stärksten Hell-Dunkel-Kontrast geben, etwa an Brust und Waffe wie bei Valve. Wer so antwortet, zeigt, dass er Lesbarkeit prüfen kann, statt sie zu erraten.

  ## Häufige Fehler

  - **Ohne Lichtrichtung schattiert.** Rundum dunkle Ränder ergeben ein Kissen. Leg die Lichtrichtung mit einem Pfeil fest, bevor du einen Wert setzt.
  - **Licht- und Schattenfamilie vermischt.** Ein Reflexlicht so hell wie die Lichtseite macht die Form flach.
  - **Schlagschatten zur Lampe hin.** Der Schlagschatten zeigt immer von der Lichtquelle weg.
  - **Kontaktschatten vergessen.** Ohne den dunkelsten Fleck an der Berührung schwebt der Gegenstand.
  - **Zu viele Werte.** Jede Fläche mit eigenem Wert ergibt Rauschen. Drei Gruppen reichen für eine Studie.
  - **Farbe mit Tonwert verwechselt.** Ein kräftiges Rot ist nicht automatisch hell. Prüf in Graustufen.
  - **Kontrast überall gleich stark.** Dann weiß das Auge nicht, wohin. Der stärkste Kontrast gehört zum Wichtigsten.

  ## Zusammenfassung

  - Der Tonwert ist die Helligkeit einer Fläche, unabhängig von ihrem Farbton.
  - Auf einer Kugel liegen Glanzlicht, Licht und Halbton in der Lichtfamilie, Kernschatten und Reflexlicht in der Schattenfamilie, getrennt durch den Terminator.
  - Kontaktschatten stellen einen Gegenstand auf den Boden, Schlagschatten zeigen von der Lichtquelle weg.
  - Erst Licht und Schatten als zwei Familien trennen, dann abstufen. Alles in der Lichtfamilie bleibt heller als alles im Schatten.
  - Wenige Wertegruppen machen ein Bild auch winzig lesbar. Drei Gruppen reichen für eine Studie.
  - Der stärkste Kontrast lenkt den Blick. In Spielen gehört er zu Figur und Gefahr, nicht zum Boden.
  - Tonwerte prüfst du mit einer Drei-Werte-Studie auf Papier und mit einem Foto in Graustufen.
exercises:
  - id: tonwert-und-farbe
    type: choice
    title: Was ist ein Tonwert?
    prompt: |
      Welche Aussagen über den Tonwert stimmen?
    options:
      - text: Der Tonwert ist die Helligkeit einer Fläche, unabhängig von ihrem Farbton.
        correct: true
        why: So definiert Ctrl+Paint „value“, als Beleuchtung, hell oder dunkel.
      - text: Zwei verschiedene Farben können fast denselben Tonwert haben und in Graustufen zu einer Fläche verschmelzen.
        correct: true
        why: Ein kräftiges Rot und ein mittleres Blau liegen oft nah beieinander. In Graustufen trennt sie nichts mehr.
      - text: Eine kräftige, gesättigte Farbe ist immer heller als eine blasse.
        correct: false
        why: Sättigung und Helligkeit sind verschiedene Eigenschaften. Ein sattes Dunkelblau ist dunkler als ein blasses Gelb.
      - text: Tonwerte lassen sich erst beurteilen, wenn die Farben feststehen.
        correct: false
        why: Gerade umgekehrt. Ctrl+Paint rät, in Graustufen anzufangen und Farbe später dazuzunehmen.
    explanation: |
      Der Tonwert beantwortet nur eine Frage: Wie hell oder dunkel ist diese Fläche? Farbton und Sättigung sind davon unabhängig. Deshalb lassen sich Formen und Lesbarkeit in Graustufen planen, bevor eine einzige Farbe gewählt ist. Und deshalb kann eine bunte Figur vor einem bunten Hintergrund verschwinden, wenn beide denselben Tonwert haben.
    resources:
      - title: Ctrl+Paint · Why Practice in Grayscale
        url: https://www.ctrlpaint.com/videos/why-practice-in-grayscale

  - id: zone-erkennen
    type: choice
    title: Der helle Streifen im Schatten
    prompt: |
      Am unteren rechten Rand von Kugel A liegt innerhalb der dunklen Schattenseite ein etwas hellerer Streifen. Welche Lichtzone ist das?

      ![Graue Kugel, Licht von oben links: weißes Glanzfeld oben links, hellgraues Licht, mittelgraues Band, dunkles Band unten rechts, ganz am Rand unten rechts ein etwas hellerer Streifen. Darunter ein schwarzer Fleck und ein langer dunkelgrauer Schatten nach rechts](/media/pixelart/licht-werte/licht-auf-kugel@2x.png "Kugel A mit allen Lichtzonen, daneben B in zwei Werten. Eigenes Schaubild")
    options:
      - text: Reflexlicht
        correct: true
        why: Licht, das vom Boden zurück in die Schattenseite fällt. Es ist heller als der Kernschatten, bleibt aber in der Schattenfamilie.
      - text: Halbton
        correct: false
        why: Der Halbton liegt auf der Lichtseite, zwischen Licht und Kernschatten.
      - text: Glanzlicht
        correct: false
        why: Das Glanzlicht ist der hellste Fleck auf der Seite zur Lichtquelle, hier oben links.
      - text: Kontaktschatten
        correct: false
        why: Der Kontaktschatten liegt auf dem Boden, genau unter der Berührungsstelle, und ist der dunkelste Fleck im Bild.
    explanation: |
      Das Reflexlicht entsteht, weil der helle Boden Licht zurückwirft. Es hellt den Rand der Schattenseite auf, aber nur wenig: Es muss dunkler bleiben als alles auf der Lichtseite, sonst zerfällt die Form. Der Kernschatten liegt deshalb nicht am Rand, sondern als dunkelstes Band zwischen Terminator und Reflexlicht.
    resources:
      - title: Proko · How to Shade a Drawing
        url: https://www.proko.com/course-lesson/how-to-shade-a-drawing/

  - id: kugel-schattieren
    type: order
    title: Eine Kugel in fünf Schritten
    prompt: |
      Bring die Schritte zum Schattieren einer Kugel in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Die Lichtrichtung als Pfeil festlegen.
      Den Terminator als Grenze zwischen Licht- und Schattenseite einzeichnen.
      Schattenseite und Schlagschatten mit einem flachen dunklen Wert füllen.
      Den Kernschatten an der Grenze abdunkeln und das Reflexlicht am Rand leicht aufhellen.
      Halbtöne auf der Lichtseite zur Grenze hin setzen, das Glanzlicht zuletzt.
    alternatives:
      - [1, 2, 3, 5, 4]
    hints:
      - Ohne Lichtrichtung weißt du nicht, wo die Grenze liegt.
    explanation: |
      Die Lichtrichtung bestimmt den Terminator, und der trennt die zwei Familien. Erst wenn die Schattenseite flach gefüllt ist, siehst du, ob die Form schon liest. Danach verfeinerst du beide Familien; ob du mit der Schatten- oder der Lichtseite anfängst, ist gleich. Das Glanzlicht kommt zuletzt, weil es am leichtesten zu viel wird.
    resources:
      - title: Proko · How to Shade a Drawing
        url: https://www.proko.com/course-lesson/how-to-shade-a-drawing/

  - id: schlagschatten-richtung
    type: output
    title: Wohin fällt der Schatten?
    prompt: |
      In deiner Top-down-Szene kommt das Licht von oben links, bezogen auf den Bildschirm. In welche Richtung auf dem Bildschirm fällt der Schlagschatten eines Fasses? Antworte mit zwei Wörtern.
    lang: text
    code: |
      Licht:  von oben links (Bildschirm)
      Objekt: Fass auf dem Boden
    expected: |
      unten rechts
    accept:
      - nach unten rechts
      - rechts unten
      - nach rechts unten
      - unten-rechts
      - rechts-unten
    explanation: |
      Ein Schlagschatten zeigt immer von der Lichtquelle weg. Kommt das Licht von oben links, fällt er nach unten rechts. Diese Richtung gilt für jedes Objekt der Szene. Ein einziger Schatten in eine andere Richtung wirkt, als gäbe es eine zweite Lampe.
    resources:
      - title: Proko · How to Shade a Drawing
        url: https://www.proko.com/course-lesson/how-to-shade-a-drawing/

  - id: werteskala-mitte
    type: output
    title: Drei Gruppen auf der Skala
    prompt: |
      Du planst eine Studie mit drei Werten auf der Skala der Lektion: hell bei 1, dunkel bei 9. Der Mittelton soll von beiden gleich weit entfernt sein. Welche Stufe nimmst du? Antworte mit der Zahl.
    lang: text
    code: |
      Skala:   1 (Weiß) bis 9 (fast Schwarz)
      hell:    1
      dunkel:  9
      mittel:  ?
    expected: |
      5
    accept:
      - Stufe 5
      - fünf
    explanation: |
      Von 1 bis 9 sind es acht Stufen, die Mitte liegt vier Stufen von jedem Ende entfernt, bei 5. Mit 1, 5 und 9 sind die drei Gruppen so weit wie möglich voneinander getrennt. In einem Sprite rückst du sie später oft enger zusammen, etwa für einen ruhigen Hintergrund, aber für eine Studie willst du klare Abstände.
    resources:
      - title: James Gurney · How Many Values?
        url: https://gurneyjourney.blogspot.com/2018/01/how-many-values.html

  - id: werte-zaehlen
    type: output
    title: Wie viele Werte hat B?
    prompt: |
      Wie viele verschiedene Tonwerte nutzt Feld B? Antworte mit der Zahl.

      ![Zwei Fassungen einer Szene in Graustufen, Ball auf Kiste vor einer Wand. A mit zufällig verstreuten Werten, B mit klar getrennten Flächen](/media/pixelart/licht-werte/wertegruppen@2x.png "Verstreute Werte (A) und Wertegruppen (B). Eigenes Schaubild")
    lang: text
    code: |
      Feld B: Ball auf Kiste vor einer Wand,
      Licht von oben links
    expected: |
      3
    accept:
      - drei
      - 3 Werte
      - 3 Tonwerte
    hints:
      - Zähl hell, mittel und dunkel. Gibt es Flächen, die in keine dieser Gruppen passen?
    explanation: |
      B nutzt drei Werte: hell für die Flächen zum Licht (Ballseite, Kistenoberseite, Boden), mittel für Wand und Kistenfront, dunkel für die Schattenseite des Balls und die Schlagschatten. A nutzt bis zu fünf Grautöne, ohne Ordnung verteilt. Weniger Werte, klug gruppiert, lesen sich besser als mehr Werte ohne Ordnung.
    resources:
      - title: James Gurney · Why Should I Mass Values?
        url: https://gurneyjourney.blogspot.com/2019/12/why-should-i-mass-values.html

  - id: begriffe-licht
    type: gap
    title: Wörter für das Licht
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Die Helligkeit einer Fläche unabhängig vom Farbton heißt ⟦Tonwert⟧. Die Grenze, an der eine Form sich vom Licht abwendet, heißt ⟦Terminator⟧. Licht, das vom Boden zurück in die Schattenseite fällt, nennt man ⟦Reflexlicht⟧. Den Schatten, den ein Gegenstand auf den Boden wirft, nennt man ⟦Schlagschatten⟧. Der dunkelste Fleck genau an der Berührungsstelle heißt ⟦Kontaktschatten⟧. Die japanische Bezeichnung für die Gestaltung mit Hell und Dunkel lautet ⟦Notan⟧.
    gaps:
      - label: Helligkeit
        hint: Auf Englisch „value“.
        accept: ["value", "Helligkeitswert", "Wert", "Tonwerte"]
      - label: Grenze
        hint: Lateinisch, wörtlich „Begrenzer“.
        accept: ["Schattengrenze", "Licht-Schatten-Grenze"]
      - label: zurückgeworfenes Licht
        hint: Auf Englisch „reflected light“.
        accept: ["reflected light", "Reflex", "Reflexion"]
      - label: geworfener Schatten
        hint: Auf Englisch „cast shadow“.
        accept: ["cast shadow", "Wurfschatten"]
      - label: Berührungsstelle
        hint: Proko nennt ihn „occlusion shadow“.
        accept: ["occlusion shadow", "Okklusionsschatten", "Berührungsschatten"]
      - label: Hell und Dunkel
        hint: Vier Buchstaben, Arthur Wesley Dow machte den Begriff im Westen bekannt.
        accept: ["Nōtan", "Notan-Design"]
    explanation: |
      Tonwert und Notan sind die großen Begriffe: Helligkeit und die Gestaltung mit ihr. Terminator, Reflexlicht, Schlagschatten und Kontaktschatten benennen die Zonen, die du an jeder beleuchteten Form wiederfindest. Mit diesen Wörtern kannst du eine Schattierung beschreiben, statt nur „sieht flach aus“ zu sagen.
    resources:
      - title: Wikipedia · Notan
        url: https://en.wikipedia.org/wiki/Notan

  - id: reflexlicht-zu-dunkel
    type: bug
    title: Ein Loch am Kugelrand
    prompt: |
      Lehrbeispiel: Werteplan für eine Kugel auf der Skala der Lektion, 1 hell bis 9 dunkel. Nach diesem Plan schattiert, wirkt der untere Rand der Kugel wie ein Loch, und die Rundung unten geht verloren. Finde die Zeile.
    lang: prose
    code: |
      Licht von oben links vorn.
      Glanzlicht: Wert 1.
      Licht: Wert 3.
      Halbton: Wert 5.
      Kernschatten: Wert 8.
      Reflexlicht: Wert 9.
      Schlagschatten: Wert 8.
    lines: [6]
    hints:
      - Welche Zone soll heller sein als der Kernschatten?
    explanation: |
      Das Reflexlicht ist Licht, das vom Boden zurückfällt. Es muss heller sein als der Kernschatten, etwa Wert 7, und dunkler als alles auf der Lichtseite. Mit Wert 9 ist es das Dunkelste auf der Kugel, und der Rand wirkt wie ein Loch statt wie eine Rundung, die sich vom Boden abhebt. Der Kernschatten gehört als dunkelstes Band an die Grenze zum Licht, nicht an den Rand.
    resources:
      - title: Proko · How to Shade a Drawing
        url: https://www.proko.com/course-lesson/how-to-shade-a-drawing/

  - id: zweite-lampe
    type: bug
    title: Eine Kiste mit eigener Lampe
    prompt: |
      Lehrbeispiel: Lichtplan für eine Top-down-Szene. Im Bild wirkt eine Kiste, als würde sie von einer zweiten Lampe beleuchtet. Finde die Zeile.
    lang: prose
    code: |
      Licht kommt von oben links.
      Fass: Oberseite hell, linke Mantelhälfte Licht, rechte Hälfte Schatten.
      Kiste: Oberseite hell, Front mittel.
      Schlagschatten der Kiste fällt nach oben links.
      Kontaktschatten unter beiden Objekten am dunkelsten.
    lines: [4]
    explanation: |
      Ein Schlagschatten zeigt von der Lichtquelle weg, bei Licht von oben links also nach unten rechts. Die Kiste wirft ihren Schatten zur Lampe hin, als stünde auf der anderen Seite eine zweite. Alle anderen Zeilen passen zur Lichtrichtung. Schreib die Schattenrichtung deshalb in jeden Lichtplan und prüf jedes Objekt dagegen.
    resources:
      - title: Derek Yu · Pixel Art Tutorial · Form and Volume
        url: https://www.derekyu.com/makegames/pixelart.html#form

  - id: wertegruppen-erklaeren
    type: explain
    title: Rauschen oder Gruppen
    prompt: |
      Sieh dir die zwei Fassungen an. Erkläre in drei bis fünf Sätzen, warum B sich besser liest als A, besonders auf Handygröße.

      ![Zwei Fassungen derselben Szene in Graustufen: Ball auf Kiste vor einer Wand. A mit zufällig verstreuten Werten, B mit drei klar getrennten Wertegruppen](/media/pixelart/licht-werte/wertegruppen@2x.png "Verstreute Werte (A) und drei Wertegruppen (B). Eigenes Schaubild")
    lang: prose
    code: |
      A: dieselbe Szene, aber rund die Hälfte der Pixel weicht zufällig um eine Stufe ab.
      B: drei Werte, nach Lage zum Licht verteilt.
    points:
      - In A weichen viele Pixel zufällig von ihrer Fläche ab; die Grenzen der Formen gehen im Rauschen unter.
      - In B gehört jede Fläche zu einer von drei Gruppen, je nachdem, ob sie zum Licht zeigt, sich abwendet oder im Schatten liegt.
      - Wenige große Wertegruppen lesen sich auch stark verkleinert, wie Gurney schreibt.
      - Unwichtige Teile wie die Wand gehen in einer Masse auf; der Kontrast sitzt dort, wo der Ball an andere Werte grenzt.
    explanation: |
      A enthält dieselbe Szene, aber die zufälligen Abweichungen zerstören die Grenzen zwischen den Flächen. Das Auge muss die Formen aus einzelnen Pixeln zusammensetzen, und auf Handygröße gelingt das nicht mehr. In B ordnet jede Fläche sich einer von drei Gruppen zu, und die Grenzen zwischen den Gruppen sind die Formen. Gurney nennt genau das den Vorteil einer schlichten Tonwertgestaltung („simple tonal design“): Sie liest sich auf einen Blick, auch winzig. Die Wand verschmilzt zu einer ruhigen mittleren Masse, und der Ball bekommt den Kontrast, weil er hell vor Mittel und dunkel vor Hell steht.
    resources:
      - title: James Gurney · Why Should I Mass Values?
        url: https://gurneyjourney.blogspot.com/2019/12/why-should-i-mass-values.html

  - id: drei-werte-studie
    type: practice
    title: Eine Szene in drei Werten
    prompt: |
      Wähle eine Szene in deiner Nähe, etwa eine Haltestelle, einen Tisch mit Tasse oder ein Fenster. Zeichne in höchstens fünf Minuten ein Rechteck von etwa 5 × 4 cm und füll jede Fläche mit einem von drei Werten: Papierweiß, lockere Schraffur, dichte Schraffur. Fotografiere die Szene danach und stell das Foto auf Graustufen.
    lang: prose
    checklist:
      - Die Studie nutzt genau drei Werte, und keine Fläche liegt dazwischen.
      - Ein Pfeil zeigt die Lichtrichtung, und die hellen Flächen zeigen zu ihr hin.
      - Jeder Wert bildet zusammenhängende Flächen, keine verstreuten Flecken.
      - Du hast Studie und Graustufenfoto nebeneinandergelegt und eine Fläche notiert, die du in eine andere Gruppe eingeordnet hattest als das Foto.
      - Der Timer stand am Ende bei höchstens fünf Minuten.
    hints:
      - Kneif die Augen zusammen, bevor du anfängst. Was übrig bleibt, sind deine drei Gruppen.
    explanation: |
      Drei Werte zwingen dich, jede Fläche einer Gruppe zuzuordnen. Das Foto in Graustufen ist eine Kontrolle, die du nicht mit dem Auge allein hättest: Es zeigt, wo du dich von Farbe hast täuschen lassen. Die notierte Abweichung ist das Lernergebnis der Übung.
    resources:
      - title: James Gurney · How Many Values?
        url: https://gurneyjourney.blogspot.com/2018/01/how-many-values.html

  - id: kugel-alle-zonen
    type: practice
    title: Eine Kugel, alle Zonen
    prompt: |
      Leg eine Orange, einen Apfel oder einen Ball unter eine Lampe oder ans Fenster. Zeichne die Kugel zweimal nebeneinander: links mit allen Lichtzonen der Lektion, beschriftet, rechts mit nur zwei Werten für Licht- und Schattenseite.
    lang: prose
    checklist:
      - In der linken Zeichnung sind Glanzlicht, Licht, Halbton, Terminator, Kernschatten, Reflexlicht, Kontaktschatten und Schlagschatten beschriftet.
      - Der Schlagschatten zeigt in beiden Zeichnungen von der Lichtquelle weg, und ein Pfeil zeigt die Lichtrichtung.
      - Das Reflexlicht ist heller als der Kernschatten und dunkler als jeder Wert auf der Lichtseite.
      - Der Kontaktschatten ist der dunkelste Fleck im Bild.
      - Die rechte Zeichnung hat auf der Kugel genau zwei Werte, getrennt an derselben Stelle wie links der Terminator.
    hints:
      - Das Reflexlicht siehst du am besten, wenn die Unterlage hell ist, etwa ein weißes Blatt.
    explanation: |
      Die beschriftete Fassung prüft, ob du die Zonen am echten Gegenstand findest, nicht nur im Schaubild. Die Zweiwertfassung zeigt, dass die Grenze zwischen Licht und Schatten die Form trägt. Die Regel für das Reflexlicht ist der Punkt, an dem Anfänger am häufigsten die zwei Familien vermischen.
    resources:
      - title: Proko · How to Shade a Drawing
        url: https://www.proko.com/course-lesson/how-to-shade-a-drawing/

  - id: foto-graustufen
    type: practice
    title: Farben, die in Grau verschwinden
    prompt: |
      Fotografiere drei bunte Motive, zum Beispiel ein Plakat, ein Obstregal und Kleidung an einem Ständer. Schreib vor dem Umstellen auf, welche zwei Farben deiner Meinung nach in Graustufen am ähnlichsten werden. Stell die Fotos dann mit einem Schwarz-Weiß-Filter auf Graustufen und vergleiche.
    lang: prose
    starter: |
      Motiv 1 – Vermutung / Ergebnis:
      Motiv 2 – Vermutung / Ergebnis:
      Motiv 3 – Vermutung / Ergebnis:
    checklist:
      - Zu jedem Motiv steht deine Vermutung, notiert vor dem Umstellen.
      - Zu jedem Motiv hast du ein Paar verschiedener Farben gefunden, das in Graustufen fast gleich hell ist.
      - Mindestens einmal hast du notiert, ob deine Vermutung stimmte oder nicht.
      - Die Graustufenfassungen liegen neben den Farbfotos in einem Ordner.
    hints:
      - Rot neben Grün und Gelb neben Hellblau sind häufige Kandidaten.
    explanation: |
      Die Vermutung vorher macht sichtbar, wie stark Farbe dein Urteil über Helligkeit lenkt. Paare, die in Graustufen verschmelzen, sind genau die Fallen, in die eine Figur vor einem Hintergrund gerät. Am PC wiederholst du die Prüfung mit einer Krita-Filterebene oder in Chromium mit der Achromatopsie-Simulation.
    resources:
      - title: Chrome DevTools · Emulate vision deficiencies
        url: https://developer.chrome.com/docs/devtools/rendering/apply-effects#emulate_vision_deficiencies
