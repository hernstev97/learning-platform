id: licht-werte
title: Licht, Schatten und Tonwerte
level: 1
minutes: 110
summary: Was ein Tonwert ist und warum er unabhängig von Farbe zählt, wie Licht auf eine Form fällt – vom Glanzlicht bis zum Schlagschatten –, warum wenige Wertegruppen ein Bild auch winzig lesbar machen und wie du Tonwertstudien mit Bleistift und Handy anlegst.
place: unterwegs
goals:
  - Du erklärst Tonwert als Helligkeit unabhängig vom Farbton und ordnest Flächen auf einer Werteskala ein.
  - Du benennst die Lichtzonen auf einer Kugel vom Glanzlicht bis zum Schlagschatten und zeichnest sie passend zur Lichtrichtung.
  - Du trennst Licht- und Schattenseite als zwei Familien, bevor du abstufst.
  - Du planst eine Szene in drei Wertegruppen und setzt den stärksten Kontrast dorthin, wo der Blick hinsoll.
  - Du prüfst Tonwerte mit einer Studie auf Papier und mit einem Foto in Graustufen.
