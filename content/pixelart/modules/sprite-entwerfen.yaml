id: sprite-entwerfen
title: Vom Entwurf zum Sprite
level: 2
minutes: 140
summary: Wie du eine Spritegröße wählst, eine Skizze auf 16 bis 32 Pixel Höhe übersetzt statt verkleinerst und sie in vier Ebenen – Silhouette, Werte, Farbe, Feinschliff – zu einer Figur ausbaust, die bei 100 % Zoom und gespiegelt noch trägt.
place: pc
goals:
  - Du wählst eine Spritegröße aus Tilegröße, Kopfanteil und Arbeitsaufwand und begründest sie.
  - Du entscheidest beim Übersetzen in wenige Pixel, was bleibt und was wegfällt, und hältst die Entscheidung in einer Merkmalsliste fest.
  - Du baust ein Sprite in getrennten Ebenen auf, Silhouette, Werte, Farbe und Feinschliff, und prüfst jede Stufe einzeln.
  - Du legst die Werte einer Figur von unten dunkel nach oben hell an und setzt den stärksten Kontrast dorthin, wo der Blick hin soll.
  - Du prüfst ein Sprite bei 100 % Zoom, gespiegelt und als Silhouette und findest so Fehler, die im Zoom verborgen bleiben.
  - Du legst deine eigene Skizze als Referenz unter, speicherst im Editorformat und exportierst mit ganzzahliger Vergrößerung.
