lesson: |
  Du hast auf Papier eine Figur entworfen: Hut, Tasche, Gürtel, Stiefel mit Schnallen. Jetzt legst du im Editor eine Leinwand von 16 × 24 Pixeln an und merkst, dass der Kopf acht Pixel hoch wird und ein Auge ein einziger Pixel ist. Für den Gürtel bleibt eine Reihe, die Schnallen haben keinen Platz, die Tasche wird ein Fleck. Fotografierst du die Skizze und rechnest sie auf diese Größe herunter, bekommst du einen Brei aus Mischfarben.

  Dieses Modul führt vom Entwurf zum Sprite: Größe wählen, entscheiden, was bleibt, und die Figur in vier Ebenen aufbauen, die du einzeln prüfen kannst. Du arbeitest im Pixel-Editor, kostenlos mit Pixelorama oder LibreSprite oder mit Aseprite, wenn du es hast. Die Einrichtung steht in [Einen Pixel-Editor wählen und einrichten](/pixelart/editor-einrichten). Bedienschritte stehen in eigenen Absätzen mit **Bedienung**, damit sie nicht mit den Gestaltungsgründen verschwimmen. Den Umriss hast du in [Silhouette und Formensprache](/pixelart/silhouette-formsprache) schon auf Papier geprüft; hier wird er zu Pixeln.

  ## Die Spritegröße wählen: Tile, Kopf, Aufwand

  Raymond Schlitter (Slynyrd) schreibt: „Generally, tile size is the best gauge for determining sprite size“, und: „1 tile wide by 2 tiles tall is one of the most common sprite sizes“ ([Pixelblog 22](https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites)). Für Tiles in Draufsicht nennt er 16 × 16 Pixel als „probably the most common size“ ([Pixelblog 20](https://www.slynyrd.com/blog/2019/8/27/pixelblog-20-top-down-tiles)). Daraus ergibt sich als Ausgangspunkt eine Leinwand von 16 × 32 Pixeln, in der die Figur nicht jede Reihe füllen muss.

  Der Kopf bekommt mehr Platz als in der Natur. Bei wenig Platz nimmt er laut Schlitter „usually … a third to half of the total sprite“ ein. Wikipedia beschreibt für den Stil Super Deformed einen Kopf, der „normally anywhere between one third and one half the character's height“ ausmacht ([Super deformed](https://en.wikipedia.org/wiki/Super_deformed#Appearance_and_media_usage)). Saint11 nennt niedliche Figuren „usually short (less than 4 heads)“ ([Cuteness](https://saint11.art/img/pixel-tutorials/Cuteness.gif)). Wie du Kopfeinheiten misst, steht in [Figur, Geste und Proportion](/pixelart/figur-proportion).

  ![Dieselbe Figur in drei Größen bei gleicher Pixelgröße. A ist 16 Pixel hoch, der Kopf hat nur wenige Pixel, Arme und Rumpf verschmelzen fast. B ist 24 Pixel hoch, Kopf, Hemd, Arme und Hose sind getrennt erkennbar. C ist 32 Pixel hoch, der Kopf ist runder, Arme und Beine sind deutlich abgesetzt](/media/pixelart/sprite-entwerfen/groessen@2x.png "16, 24 und 32 Pixel hoch (A–C), gleiche Pixelgröße. Eigenes Schaubild")

  Die Puppe im Schaubild ist gut drei Köpfe hoch. In A sind das rund fünf Pixel Kopf, für Augen bleiben zwei Pixel, Arme und Rumpf trennen sich kaum. In B hat der Kopf rund acht Pixel, Hemd und Hose sind eigene Flächen. In C wird der Kopf rund, die Beine haben eine Lücke. Saint11 fasst das so: „Bigger resolutions allow more realistic styles and rounded shapes“, und „Higher resolutions usually have more colors too“ ([Resizing Pixel Art](https://saint11.art/img/pixel-tutorials/Resizing.gif)).

  Größe kostet Arbeit. Eine Leinwand von 16 × 24 hat 384 Pixel, eine von 32 × 48 viermal so viele, und das für jede Ansicht, die du später zeichnest. Zum Vergleich: Bei Dead Cells, einem Actionspiel in Seitenansicht, ist die Figur laut Thomas Vasseur von Motion Twin im Spiel „only 50 pixels“ hoch ([Game Developer](https://www.gamedeveloper.com/production/art-design-deep-dive-using-a-3d-pipeline-for-2d-animation-in-i-dead-cells-i-)). Die passende Größe folgt aus Kamera, Tilegröße und Aufwand, nicht aus einer Norm. Wie viele Bildschirmpixel ein Spritepixel im Spiel bekommt, regelt die Engine, siehe [Pixelraster in Godot](/godot/pixelraster).

  ## Übersetzen statt verkleinern

  Saint11 beginnt seine Tafel zum Skalieren mit einer Warnung: „Scaling and rotating pixel art should always be avoided, to do it properly there's no easy escape, you need to redraw it.“ Für den Weg vom Konzept zum Sprite rät er: „Think of it more as a translation than as a rescaling“, „Focus on the big masses first“ und „Choose strong details“, an seinem Beispiel einen Schulterschutz und die Knöpfe am Mantel. Und: „As the resolution decreases you need to start choosing what details are important.“

  Übersetzen heißt entscheiden. Schreib vor dem ersten Pixel eine **Merkmalsliste** und ordne sie nach Wichtigkeit:

  1. Silhouette: Grundform, Proportion, Haltung.
  2. Kopf: Größe, Haarform oder Kopfbedeckung.
  3. Ein Erkennungsmerkmal: ein Werkzeug, ein Kragen, eine Farbe.
  4. Zweitrangiges: Gürtel, Tasche, Schuhe.
  5. Kleinkram: Knöpfe, Schnallen, Nähte.

  Dann streichst du von unten, bis der Rest in die Leinwand passt. Was bleibt, darf größer werden als in der Skizze; ein Erkennungsmerkmal in drei Pixeln ist lesbarer als drei Merkmale in je einem. Schlitter beschreibt das Ziel als „push the detail just far enough until the mind can fill in the rest“ und rät: „Avoid too many small scattered clusters“ ([Pixelblog 57](https://www.slynyrd.com/blog/2025/7/28/pixelblog-57-knights-monsters-amp-castles)). Derek Yu: „Making small sprites is about making compromises“ ([Pixel Art Tutorial](https://www.derekyu.com/makegames/pixelart.html#small_sprite)).

  Eine Rechnung zeigt, warum Kleinkram verschwindet. Halbierst du die Höhe von 32 auf 16 Pixel, steht jeder neue Pixel für 2 × 2 alte. Alles, was in der großen Fassung kleiner ist als ein Block von 2 × 2 Pixeln, bekommt in der kleinen meist keinen eigenen Pixel mehr.

  > [!WARNING] Herunterrechnen ist kein Entwurf
  > Ein Foto der Skizze mit der Größenänderung des Editors zu verkleinern, erzeugt Mischfarben und verwaiste Pixel. Saint11 nennt automatische Skalierung höchstens einen ersten Schritt beim Anpassen fertiger Pixelart, danach müssen Kontur und Silhouette neu gezogen werden, und rät: „don't rely too much on them“. Leg die Skizze stattdessen als Referenz unter und zeichne neu.

  ## Vier Stufen in vier Ebenen

  Jede Stufe beantwortet eine Frage. Erst wenn sie beantwortet ist, kommt die nächste.

  ![Dieselbe Puppe von 16 × 24 Pixeln in vier Stufen. A ist eine dunkle Silhouette. B zeigt dieselbe Form in vier Grautönen, Haare am dunkelsten, Hose dunkel, Hemd mittel, Gesicht und Arme hell, mit helleren Kanten oben links und dunkleren unten rechts. C setzt Farben ein, Haut, blaues Hemd, braune Hose und dunkelbraune Haare, jeweils mit Licht- und Schattenton. D hat eine Außenkontur, an jeder Stelle in einer dunklen Variante der angrenzenden Farbe](/media/pixelart/sprite-entwerfen/arbeitsschritte@2x.png "Silhouette (A), Werte (B), Farbe (C), Feinschliff mit farbiger Kontur (D). Eigenes Schaubild")

  - **A Silhouette:** Ist die Figur als Umriss erkennbar, und stimmen Proportion und Haltung?
  - **B Werte:** Trennen sich Haare, Gesicht, Hemd und Hose im Tonwert, und liegt der stärkste Kontrast an der richtigen Stelle? Tonwerte erklärt [Licht, Schatten und Tonwerte](/pixelart/licht-werte).
  - **C Farbe:** Welche Farbtöne bekommt jede Fläche, ohne dass die Wertestruktur aus B verloren geht? Rampen und Paletten stehen in [Farbe, Rampen und begrenzte Paletten](/pixelart/farbe-paletten).
  - **D Feinschliff:** Kontur, saubere Linien, Kantenglättung, die letzten Details. In D ist die Kontur nicht schwarz, sondern je Fläche eine dunkle Variante ihrer Farbe; wann das hilft, behandelt [Schattieren, Dithering, Textur und Detailgrad](/pixelart/schattieren-textur), saubere Läufe [Linien, Kurven und Cluster](/pixelart/linien-cluster).

  Getrennte Ebenen erlauben, eine Stufe zu verwerfen, ohne die vorige zu verlieren. Du blendest die Farbe aus und vergleichst mit den Werten, oder du zeigst nur die Silhouette.

  **Bedienung:** In Aseprite legst du mit *Layer > New > New Layer* oder Shift+N eine neue Ebene an; *Layer > Visible* oder Shift+X blendet sie ein und aus, ein Doppelklick auf den Namen benennt sie um ([Layers](https://www.aseprite.org/docs/layers/)). In Pixelorama liegen die Ebenen in der Timeline, obere Ebenen werden über unteren gezeichnet, Gruppenebenen halten sie zusammen ([Layer](https://pixelorama.org/concepts/layer/)). LibreSprite hat das Ebenenmenü älterer Aseprite-Versionen, eine eigene Doku gibt es nicht. Benenne die Ebenen nach der Stufe: „1 Silhouette“, „2 Werte“, „3 Farbe“, „4 Kontur“.

  > [!PRAXIS] So arbeiten andere
  > In Mitchells Folien zu Team Fortress 2 beginnt die Figurenentwicklung mit der Silhouette, dann folgen Innenformen, Modellblatt und Modell ([MIGS 2008](https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf)). Saint11 schreibt seinen Ablauf als „silhouette sketch → add details → animate“. Derek Yu skizziert kleine Sprites oft mit farbigen Flächen statt mit Konturen ([Pixel Art Tutorial](https://www.derekyu.com/makegames/pixelart.html#small_sprite)), und Raymond Schlitters Prozess beginnt bei Figuren oft „with basic color coded dummies“ ([Pixelblog 57](https://www.slynyrd.com/blog/2025/7/28/pixelblog-57-knights-monsters-amp-castles)). Allen gemeinsam: grobe Flächen zuerst, Linien und Details zuletzt.

  ## Werte von unten nach oben: wohin der Blick geht

  Valve hat die Figuren in Team Fortress 2 von unten nach oben heller werden lassen. In Mitchells Lesehierarchie steht: „Gradient from dark feet to light chest“ und „Highest contrast at chest level, where weapon is held“. Art Director Moby Francke erklärt: „We then also gradated the character from the dark bottoms to the contrasting upper torso for better readability“ ([Game Developer, 2008](https://www.gamedeveloper.com/art/in-depth-how-valve-makes-art-to-enhance-gameplay)).

  In Stufe B des Schaubilds ist die Hose dunkler als das Hemd, Gesicht und Hände sind am hellsten, die Haare am dunkelsten. Der stärkste Kontrast liegt am Kopf, wo dunkles Haar an helle Haut stößt. Für ein Sprite in Draufsicht ist der Kopf oft die wichtigste Stelle, weil er ein Drittel der Figur ausmacht und Blickrichtung und Ausdruck trägt. Liegt dein Erkennungsmerkmal woanders, etwa an einem Werkzeug, gehört der stärkste Kontrast dorthin.

  Team Fortress 2 ist ein 3D-Spiel. Dass sich das Prinzip auf ein Sprite von 24 Pixeln übertragen lässt, ist eine Folgerung, die du an deinem Sprite prüfst: Kneif die Augen zusammen und schau, wohin der Blick zuerst geht.

  > [!MERKE]
  > Werte vor Farbe. Wenn eine Figur in Grau nicht trägt, rettet keine Farbe sie.

  ## Prüfen: bei 100 %, gespiegelt, als Silhouette

  Im Zoom von 800 % sieht jedes Sprite ordentlich aus. Ob es trägt, zeigt erst die Originalgröße. Prüf jede Stufe dreimal:

  - **Bei 100 %.** So groß ist die Figur, bevor die Engine sie skaliert. Wirkt sie bei 100 % unklar, hilft dir die Vergrößerung im Spiel nur, die Unklarheit größer zu sehen.
  - **Gespiegelt.** Nach längerem Hinsehen gewöhnst du dich an eigene Fehler. Gespiegelt wirkt das Bild fremd, und schiefe Schultern oder ein verrutschter Kopf fallen auf.
  - **Als Silhouette.** Blende alle Ebenen außer der Silhouette aus, oder fülle eine Kopie der fertigen Figur mit einer Farbe.

  **Bedienung:** In Aseprite stellen die Tasten 1 bis 6 den Zoom auf 100 % bis 3200 % ([Zoom](https://www.aseprite.org/docs/zoom/)). *Edit > Flip Horizontal* oder Shift+H spiegelt das Bild selbst ([Flip](https://www.aseprite.org/docs/flip/)); spiegel danach zurück. Pixelorama hat im Zoom-Werkzeug einen Knopf für 100 %, der zeigt, „how your art looks at its original dimensions“ ([Canvas · Zoom](https://pixelorama.org/user_manual/user_interface/canvas/#zoom)). *View > Mirror View* oder Shift+M spiegelt dort nur die Ansicht, das Bild bleibt unverändert ([Canvas · Mirror](https://pixelorama.org/user_manual/user_interface/canvas/#mirror)). Für Skizzen in Krita spiegelt die Taste M die Ansicht ([View Menu](https://docs.krita.org/en/reference_manual/main_menu/view_menu.html)).

  ## Skizze als Referenz, Speichern und Export

  Deine Papierskizze kommt als Foto in den Editor, aber nicht als Pixel. Aseprite hat dafür Referenzebenen, „a way to show reference images at higher resolutions than the canvas“, die man nicht bemalen kann; du legst sie mit *Layer > New > New Reference Layer from File* an ([Reference Layer](https://www.aseprite.org/docs/reference-layer/)). Pixelorama fragt beim Import eines Bildes, wie es geöffnet werden soll, unter anderem als „New reference image“ oder als neue Ebene ([Import](https://pixelorama.org/user_manual/Import/#import-image-options)). In LibreSprite legst du das Foto auf eine eigene, unterste Ebene, zeichnest auf Ebenen darüber und blendest die Fotoebene zum Prüfen aus. Freie Skizzen mit der Maus gehen in Krita besser als im Pixel-Editor.

  Die Referenz ist deine eigene Zeichnung. Fotos und Werke anderer helfen beim Lernen, aber du paust sie nicht ab, und generierte Bilder sind keine Vorlage: Jede Figur, die du zeichnest, ist deine Arbeit.

  Speichern und Exportieren sind zwei Schritte. Pixelorama erklärt den Unterschied: Speichern im eigenen Format behält Ebenen und alle Daten, Exportieren erzeugt PNG-Dateien zum Teilen oder für eine Engine. „Of course, nothing is stopping you from doing both, which is actually the recommended approach“ ([Save and Export](https://pixelorama.org/user_manual/save_and_export/#exporting)). Aseprite speichert als `.aseprite`, Pixelorama als `.pxo`. Für die Engine exportierst du bei 100 %. Zum Zeigen im Netz vergrößerst du beim Export ganzzahlig, etwa auf 400 %: Aseprite hat dafür im Exportdialog das Feld *Resize* ([Exporting](https://www.aseprite.org/docs/exporting/#automatic-resize-on-export)), Pixelorama eine Option zum Vergrößern mit der Interpolation *Nearest*. Schlitter begründet die ganzen Zahlen: „increase the image size only by whole number multiples in order to preserve the uniformity of the pixel units“ ([Pixelblog 5](https://www.slynyrd.com/blog/2018/5/16/pixelblog-5-back-to-basics)). Wie das Sprite danach in Godot kommt, steht in [Sprites importieren](/godot/sprites-importieren).

  > [!INTERVIEW]
  > Manche Studios vergeben vor einer Zusammenarbeit eine bezahlte Probearbeit; Snow Day Games beschrieb das in einer inzwischen geschlossenen Anzeige als „Paid test commission to ensure shared artistic vision“ ([Snow Day Games](https://workwithindies.com/careers/snow-day-games-2d-technical-pixel-artist)); Pine Creek Games nennt in seiner Anzeige ausdrücklich „Not using AI in their work“ ([2D Artist](https://workwithindies.com/careers/pine-creek-games-2d-artist)). Eine typische Bitte im Gespräch: „Zeig uns, wie du von der Skizze zum Sprite kommst.“ Gute Antwort: Du öffnest die Datei mit allen Ebenen und gehst die Stufen durch, Silhouette, Werte, Farbe, Feinschliff. Du zeigst die Merkmalsliste und sagst, was du bei dieser Größe gestrichen hast und warum. Und du zeigst die Figur bei 100 %, denn so sieht sie der Spieler.

  ## Häufige Fehler

  - **Die Skizze herunterrechnen.** Mischfarben und verwaiste Pixel statt einer Figur. Skizze als Referenz unterlegen und neu zeichnen.
  - **Größe nach Gefühl.** Die Figur passt nicht zum Tile oder zu den anderen Figuren. Größe aus Tile und Kopfanteil ableiten.
  - **Alles behalten wollen.** Fünf Merkmale in je einem Pixel ergeben Rauschen. Merkmalsliste von unten kürzen.
  - **Farbe vor Werten.** In Graustufen verschwimmen Hemd und Hose. Erst die Werte, dann die Farben darauf abstimmen.
  - **Alles in einer Ebene.** Keine Stufe lässt sich einzeln prüfen oder zurücknehmen. Eine Ebene pro Stufe.
  - **Nur im Zoom gearbeitet.** Bei 800 % sieht alles ordentlich aus. Jede Stufe bei 100 % prüfen.
  - **Kontrast überall.** Der Blick findet keinen Halt. Den stärksten Kontrast an eine Stelle legen.
  - **Krumm vergrößert exportiert.** 150 % macht manche Pixel doppelt so breit wie andere. Nur ganzzahlig vergrößern.

  ## Zusammenfassung

  - Die Tilegröße ist der beste Maßstab für die Spritegröße. Ein Tile breit und zwei hoch ist laut Slynyrd eine der häufigsten Größen.
  - Bei wenig Platz nimmt der Kopf ein Drittel bis die Hälfte der Figur ein.
  - Pixelart übersetzt man, statt sie zu skalieren: große Massen zuerst, wenige starke Details, der Rest fällt weg.
  - Vier Stufen in vier Ebenen: Silhouette, Werte, Farbe, Feinschliff. Jede Stufe beantwortet eine Frage.
  - Werte von unten dunkel nach oben hell, der stärkste Kontrast dort, wo der Blick hin soll.
  - Prüf jede Stufe bei 100 %, gespiegelt und als Silhouette.
  - Die eigene Skizze liegt als Referenz unter dem Sprite. Speichern im Editorformat, Export bei 100 % für die Engine und ganzzahlig vergrößert zum Zeigen.
exercises:
  - id: groesse-waehlen
    type: choice
    title: Wie groß wird das Sprite?
    prompt: |
      Welche Aussagen über die Wahl der Spritegröße stimmen?
    options:
      - text: Laut Slynyrd ist die Tilegröße der beste Maßstab, ein Tile breit und zwei hoch ist eine der häufigsten Größen.
        correct: true
        why: Bei Tiles von 16 Pixeln ergibt das 16 × 32. So passt die Figur zum Raster der Umgebung.
      - text: Bei wenig Platz nimmt der Kopf meist ein Drittel bis die Hälfte der Figur ein.
        correct: true
        why: Der große Kopf lässt Platz für Gesichtszüge, die sonst in einem Pixel verschwinden würden.
      - text: Eine größere Leinwand ist immer besser, weil mehr Details hineinpassen.
        correct: false
        why: Mehr Pixel kosten mehr Arbeit, für jede Ansicht. Und mehr Details sind nicht automatisch lesbarer.
      - text: Es gibt eine feste Norm, 50 Pixel Höhe für jede Spielfigur.
        correct: false
        why: Die 50 Pixel stammen aus Dead Cells, einem Spiel in Seitenansicht. Die Größe folgt aus Kamera, Tiles und Aufwand.
    explanation: |
      Die Spritegröße ist eine Abwägung. Das Tileraster gibt einen Rahmen, der Kopfanteil entscheidet, ob ein Gesicht Platz hat, und die Zahl der Pixel bestimmt, wie viel Arbeit jede Ansicht kostet. Saint11 zeigt, dass mit sinkender Auflösung Details wegfallen müssen; Slynyrd nennt den üblichen Rahmen für Figuren in Draufsicht.
    resources:
      - title: Slynyrd · Pixelblog 22 · Top-down character sprites
        url: https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites

  - id: werte-stufe
    type: choice
    title: In welcher Stufe prüfst du den Tonwert?
    prompt: |
      Du willst prüfen, ob sich Haare, Gesicht, Hemd und Hose im Tonwert deutlich unterscheiden. In welchem Feld geht das am besten?

      ![Dieselbe Puppe von 16 × 24 Pixeln in vier Stufen. A dunkle Silhouette, B vier Grautöne mit Licht- und Schattenkanten, C farbig mit Licht- und Schattenton je Fläche, D farbig mit farbiger Kontur](/media/pixelart/sprite-entwerfen/arbeitsschritte@2x.png "Vier Stufen eines Sprites. Eigenes Schaubild")
    options:
      - text: B, weil dort nur Helligkeit vorkommt und kein Farbton ablenkt.
        correct: true
        why: In Grau siehst du direkt, ob die Flächen sich trennen und wo der stärkste Kontrast liegt.
      - text: A, weil die Silhouette alles zeigt, was zählt.
        correct: false
        why: A hat nur einen Ton. Ob sich die Teile innen trennen, zeigt sie nicht.
      - text: C, weil man erst mit Farbe sieht, ob die Teile sich unterscheiden.
        correct: false
        why: Farben können verschieden aussehen und trotzdem fast denselben Tonwert haben. Das versteckt Probleme, statt sie zu zeigen.
      - text: D, weil die Kontur die Flächen trennt.
        correct: false
        why: Die Kontur trennt die Figur vom Grund. Ob die Flächen innen tragen, entscheidet der Tonwert.
    explanation: |
      Die Werte-Stufe gibt es, damit du eine Frage allein beantworten kannst: Tragen die Helligkeiten die Figur? In Farbe mischt sich der Farbton ein, und zwei Farben gleicher Helligkeit wirken verschieden, obwohl sie in Graustufen verschmelzen. Darum kommen die Werte vor der Farbe.
    resources:
      - title: Ctrl+Paint · Why Practice in Grayscale
        url: https://www.ctrlpaint.com/videos/why-practice-in-grayscale

  - id: stufen-reihenfolge
    type: order
    title: Von der Skizze zur Datei
    prompt: |
      Bring die Arbeitsschritte vom Papierentwurf zum fertigen Sprite in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Merkmalsliste schreiben und von unten kürzen, bis sie zur Größe passt.
      Foto der Skizze als Referenz unter die Leinwand legen.
      Silhouette in einer eigenen Ebene zeichnen und bei 100 % prüfen.
      Werte in Grau in einer neuen Ebene anlegen, unten dunkel, oben hell.
      Farben in einer weiteren Ebene auf die Werte abstimmen.
      Kontur und Details im Feinschliff setzen, dann gespiegelt prüfen.
      Im Editorformat speichern und als PNG bei 100 % exportieren.
    alternatives:
      - [2, 1, 3, 4, 5, 6, 7]
    explanation: |
      Die Merkmalsliste kommt zuerst, weil sie festlegt, was überhaupt gezeichnet wird. Die Referenz liegt unter der Leinwand, bevor der erste Pixel fällt. Dann folgen die Stufen in der Reihenfolge ihrer Fragen: Umriss, Tonwert, Farbton, Feinschliff. Jede Stufe prüfst du, bevor die nächste beginnt, denn ein Fehler im Umriss wird mit jeder Stufe teurer. Gespeichert wird mit Ebenen, exportiert ohne.
    resources:
      - title: Aseprite Docs · Reference Layer
        url: https://www.aseprite.org/docs/reference-layer/

  - id: kopfhoehe
    type: output
    title: Wie hoch wird der Kopf?
    prompt: |
      Eine Figur soll 24 Pixel hoch werden und drei Köpfe hoch sein. Wie viele Pixel hoch wird der Kopf? Antworte mit der Zahl.
    lang: text
    code: |
      Spritehöhe:  24 px
      Proportion:  3 Köpfe
    expected: |
      8
    accept:
      - 8 px
      - 8 Pixel
      - acht
    explanation: |
      24 ÷ 3 = 8. Der Kopf macht damit ein Drittel der Figur aus, die untere Grenze dessen, was Slynyrd für Sprites mit wenig Platz nennt. Mit 8 Pixeln Höhe bleiben nach der Kontur etwa sechs Reihen für das Gesicht, genug für Augen und eine Andeutung von Mund. Bei 2,5 Köpfen wären es 9,6 Pixel, die du auf 10 rundest.
    resources:
      - title: Wikipedia · Super deformed · Appearance
        url: https://en.wikipedia.org/wiki/Super_deformed#Appearance_and_media_usage

  - id: halbieren
    type: output
    title: Was ein Pixel nach dem Halbieren trägt
    prompt: |
      Du übersetzt eine Figur von 32 auf 16 Pixel Höhe, die Breite halbiert sich mit. Für wie viele Pixel der großen Fassung steht jeder Pixel der kleinen? Antworte mit der Zahl.
    lang: text
    code: |
      groß:   32 px hoch
      klein:  16 px hoch
      Breite: halbiert sich mit
    expected: |
      4
    accept:
      - 4 Pixel
      - vier
      - 4 px
      - 2 × 2
      - 2x2
      - 2 x 2
    explanation: |
      Höhe und Breite halbieren sich, also fasst jeder neue Pixel 2 × 2 = 4 alte zusammen. Ein Knopf, der in der großen Fassung zwei Pixel groß war, hat in der kleinen keinen eigenen Pixel mehr. Entweder er fällt weg, oder er wird bewusst größer gezeichnet, als er im Verhältnis wäre. Diese Entscheidung trifft keine Skalierung für dich.
    resources:
      - title: Saint11 · Resizing Pixel Art
        url: https://saint11.art/img/pixel-tutorials/Resizing.gif

  - id: exportgroesse
    type: output
    title: Export zum Zeigen
    prompt: |
      Du exportierst ein Sprite von 16 × 24 Pixeln mit 400 % Vergrößerung, um es zu teilen. Wie groß ist die PNG-Datei? Antworte als Breite × Höhe.
    lang: text
    code: |
      Sprite:  16 × 24 px
      Export:  400 %
    expected: |
      64 × 96
    accept:
      - 64x96
      - 64 x 96
      - 64×96
      - 64 × 96 px
      - 64 × 96 Pixel
    explanation: |
      400 % heißt Faktor 4: 16 × 4 = 64 und 24 × 4 = 96. Jeder Spritepixel wird zu einem Block von 4 × 4 Pixeln, alle gleich groß, weil der Faktor ganzzahlig ist. Für die Engine exportierst du dagegen bei 100 %; dort skaliert die Engine selbst.
    resources:
      - title: Aseprite Docs · Exporting · Automatic Resize on Export
        url: https://www.aseprite.org/docs/exporting/#automatic-resize-on-export

  - id: begriffe-sprite
    type: gap
    title: Begriffe vom Entwurf zum Sprite
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Eine Ebene, die ein Bild zum Nachzeichnen zeigt und sich nicht bemalen lässt, heißt in Aseprite ⟦Referenzebene⟧. Die erste Stufe eines Sprites ist die ⟦Silhouette⟧, die zweite legt die ⟦Werte⟧ in Grau an. Ob ein Sprite trägt, prüfst du bei einem Zoom von ⟦100⟧ Prozent. Zum Teilen vergrößerst du beim Export nur ⟦ganzzahlig⟧. Pixelart zu verkleinern ist nach Saint11 eher eine ⟦Übersetzung⟧ als eine Skalierung.
    gaps:
      - label: Ebene zum Nachzeichnen
        hint: Auf Englisch Reference Layer.
        accept: ["Reference Layer", "Referenz-Ebene", "Referenz"]
      - label: erste Stufe
        hint: Der gefüllte Umriss.
        accept: ["Umriss"]
      - label: zweite Stufe
        hint: Helligkeiten, auf Englisch Values.
        accept: ["Tonwerte", "Values", "Helligkeiten", "Grauwerte"]
      - label: Zoomstufe
        hint: Originalgröße, eine Zahl.
        accept: ["hundert"]
      - label: Art der Vergrößerung
        hint: Faktor 2, 3, 4 – keine Kommazahl.
        accept: ["ganzzahlige", "in ganzen Zahlen", "integer"]
      - label: Saint11s Bild
        hint: „translation“ auf Deutsch.
        accept: ["Translation", "Übertragung"]
    explanation: |
      Die Referenzebene trennt deine Skizze von den Pixeln. Silhouette und Werte sind die ersten beiden Stufen, weil sie Umriss und Helligkeit klären, bevor Farbe dazukommt. 100 % ist die Größe, in der du ehrlich prüfst, ganzzahlige Vergrößerung hält alle Pixel gleich groß. Und „Übersetzung“ erinnert dich daran, dass du beim Verkleinern entscheidest, statt zu rechnen.
    resources:
      - title: Aseprite Docs · Reference Layer
        url: https://www.aseprite.org/docs/reference-layer/

  - id: arbeitsnotiz-brei
    type: bug
    title: Ein verwaschenes Sprite
    prompt: |
      Lehrbeispiel: Arbeitsnotiz für ein Sprite von 16 × 24 Pixeln. Das Ergebnis wirkt verwaschen, voller Mischfarben und einzelner Pixel, und die Silhouette ist ausgefranst. Finde die Zeile, die das verursacht.
    lang: prose
    code: |
      Merkmalsliste: Silhouette, Kopf mit Mütze, Schal, Rest streichen
      Skizze fotografieren und mit der Größenänderung auf 16 × 24 verkleinern
      Das verkleinerte Foto als unterste Ebene übernehmen und darauf weitermalen
      Werte in einer neuen Ebene in vier Grautönen anlegen
      Farben auf die Werte abstimmen, Kontur zuletzt
      Bei 100 % und gespiegelt prüfen
    lines: [2, 3]
    hints:
      - Woher kommen Mischfarben, die du nie selbst gesetzt hast?
    explanation: |
      Zeile 2 rechnet das Foto herunter, dabei mischt das Programm benachbarte Farben. Zeile 3 übernimmt das Ergebnis als Grundlage, statt es nur als Vorlage zu nutzen, und so landen die Mischfarben und Einzelpixel im Sprite. Richtig ist, das Foto als Referenz unterzulegen und jeden Pixel selbst zu setzen. Saint11 nennt automatische Skalierung höchstens einen ersten Schritt, nach dem Kontur und Silhouette neu gezogen werden müssen.
    resources:
      - title: Saint11 · Resizing Pixel Art
        url: https://saint11.art/img/pixel-tutorials/Resizing.gif

  - id: werteplan-fuesse
    type: bug
    title: Der Blick klebt an den Füßen
    prompt: |
      Lehrbeispiel: Werteplan für eine Figur, Skala von 1 (Weiß) bis 9 (fast Schwarz). Bei 100 % zieht der Blick zuerst zu den Füßen statt zum Kopf. Finde die Zeile.
    lang: prose
    code: |
      Werteplan Lehrfigur, Skala 1 (Weiß) bis 9 (fast Schwarz)
      Haare: 8
      Gesicht: 3
      Hemd: 5
      Hose: 7
      Stiefel: 1
    lines: [6]
    hints:
      - Valve lässt die Figur von unten nach oben heller werden.
    explanation: |
      Die Stiefel haben mit 1 den hellsten Wert der Figur, direkt unter der dunklen Hose mit 7. Dort entsteht mit sechs Stufen der stärkste Kontrast der Figur, und der Blick geht zu den Füßen. Nach Valves Prinzip werden Figuren von dunklen Füßen zur hellen Brust heller, der stärkste Kontrast sitzt oben. Die Stiefel gehören auf 8 oder 9; dann liegt der stärkste Kontrast zwischen Haaren und Gesicht.
    resources:
      - title: Game Developer · How Valve Makes Art To Enhance Gameplay
        url: https://www.gamedeveloper.com/art/in-depth-how-valve-makes-art-to-enhance-gameplay

  - id: groessen-erklaeren
    type: explain
    title: Dieselbe Figur in drei Größen
    prompt: |
      Das Schaubild zeigt dieselbe Figur mit 16, 24 und 32 Pixeln Höhe bei gleicher Pixelgröße. Erkläre in drei bis fünf Sätzen, was zwischen A, B und C gewonnen oder verloren geht und wovon die Wahl abhängt.

      ![Dieselbe Figur dreimal bei gleicher Pixelgröße. A 16 Pixel hoch mit winzigem Kopf und fast verschmolzenen Armen, B 24 Pixel mit getrennten Flächen, C 32 Pixel mit rundem Kopf und abgesetzten Beinen](/media/pixelart/sprite-entwerfen/groessen@2x.png "16, 24 und 32 Pixel hoch. Eigenes Schaubild")
    lang: text
    code: |
      A: 16 px hoch, Kopf rund 5 px
      B: 24 px hoch, Kopf rund 8 px
      C: 32 px hoch, Kopf rund 10 px
      gleiche Pixelgröße, gleiche Figur
    points:
      - In A reicht der Kopf nur für zwei Augenpixel, Arme und Rumpf trennen sich kaum; Details müssen wegfallen.
      - In B sind Kopf, Hemd, Arme und Hose eigene Flächen; die Figur trägt mit wenigen Merkmalen.
      - In C erlauben mehr Pixel rundere Formen und mehr Details, wie Saint11 es für höhere Auflösungen beschreibt.
      - Die Wahl hängt von Tilegröße, Kamera und Aufwand ab; jede Ansicht und jedes Bild kostet bei mehr Pixeln mehr Arbeit.
    explanation: |
      Weil die Pixel gleich groß sind, zeigt das Schaubild echte Unterschiede im Inhalt, keinen Zoom. A muss fast alles außer der Silhouette streichen, der Kopf hat kaum Platz für ein Gesicht. B trennt die großen Flächen und ist damit eine typische Arbeitsgröße. C erlaubt runde Formen und mehr Merkmale, kostet aber gut viermal so viele Pixel wie A, und das in jeder Ansicht. Welche Größe passt, entscheiden das Tileraster des Spiels, die Kamera und wie viel Zeichenarbeit du dir vornehmen willst.
    resources:
      - title: Saint11 · Resizing Pixel Art
        url: https://saint11.art/img/pixel-tutorials/Resizing.gif

  - id: figur-in-stufen
    type: practice
    title: Eine Figur in vier Ebenen
    prompt: |
      Zeichne im Editor eine eigene Figur oder eine neutrale Gliederpuppe auf einer Leinwand von 16 × 24 oder 16 × 32 Pixeln. Leg dein Papierfoto als Referenz unter. Arbeite in vier benannten Ebenen: Silhouette, Werte, Farbe, Feinschliff. Prüf jede Stufe bei 100 % und gespiegelt, bevor du die nächste beginnst. Schreib hier in einigen Sätzen auf, was dir bei jeder Prüfung aufgefallen ist und was du geändert hast.
    lang: prose
    checklist:
      - Die Leinwand ist 16 × 24 oder 16 × 32 Pixel groß.
      - Die Datei hat mindestens vier Ebenen, benannt nach Silhouette, Werte, Farbe und Feinschliff, und ist im Editorformat gespeichert.
      - Die Referenz ist deine eigene Skizze und liegt als Referenzebene oder ausgeblendete Ebene in der Datei.
      - Du hast die Silhouette-Ebene allein angesehen oder jemandem gezeigt und notiert, welche Merkmale man daran erkennt.
      - Die Werte-Ebene nutzt höchstens fünf Grautöne, und die Füße sind dunkler als der Oberkörper.
      - Du hast jede Stufe bei 100 % und gespiegelt angesehen und mindestens eine Änderung notiert, die daraus folgte.
      - Es gibt einen PNG-Export bei 100 % und einen bei 400 %.
    hints:
      - Wenn du keine eigene Figur entwerfen willst, nimm eine Gliederpuppe aus Grundkörpern wie im Schaubild.
      - Setz die Silhouette mit dem Füllwerkzeug und korrigiere den Rand von Hand, das geht mit der Maus schneller als Freihand.
    explanation: |
      Die vier Ebenen zwingen dich, eine Frage nach der anderen zu beantworten, und lassen jede Entscheidung sichtbar. Die Prüfung bei 100 % und gespiegelt findet Fehler, die du im Zoom übersiehst. Weil die Ebenen erhalten bleiben, kannst du im Gespräch oder in einer Probearbeit zeigen, wie die Figur entstanden ist; die Datei ist dein Arbeitsnachweis.
    resources:
      - title: Aseprite Docs · Layers
        url: https://www.aseprite.org/docs/layers/
      - title: Pixelorama Docs · Layer
        url: https://pixelorama.org/concepts/layer/

  - id: uebersetzen-32-16
    type: practice
    title: Von 32 auf 16 Pixel übersetzen
    prompt: |
      Nimm eine Figur von 32 Pixeln Höhe, deine eigene oder die aus der vorigen Übung in größerer Fassung, und zeichne sie neu mit 16 Pixeln Höhe, ohne die Größenänderung des Editors zu benutzen. Schreib vorher die Merkmalsliste und streich von unten. Notiere hier, was geblieben ist, was weggefallen ist und was du größer gezeichnet hast, als es im Verhältnis wäre.
    lang: prose
    checklist:
      - Die Merkmalsliste stand vor dem ersten Pixel fest und ist nach Wichtigkeit geordnet.
      - Die kleine Fassung ist ohne automatische Größenänderung entstanden.
      - Beide Fassungen stehen nebeneinander auf einer Leinwand und sind bei 100 % verglichen.
      - Du hast mindestens ein Merkmal benannt, das du in der kleinen Fassung größer gezeichnet hast, als es im Verhältnis wäre.
      - In der kleinen Fassung hat jeder Pixel mindestens einen Nachbarn derselben Farbe, Ausnahmen hast du markiert und begründet.
    hints:
      - Fang mit Kopf und Silhouette an. Sie bekommen ihren Platz zuerst, alles andere teilt sich den Rest.
    explanation: |
      Saint11 beschreibt genau diesen Schritt als Übersetzung: große Massen zuerst, wenige starke Details. Die Übung zeigt dir, welche Merkmale eine Figur tragen, denn bei 16 Pixeln bleibt nur Platz für die wichtigsten. Das Kriterium mit den Nachbarpixeln prüft, ob du verwaiste Pixel als Detail missbraucht hast; mehr dazu in [Linien, Kurven und Cluster](/pixelart/linien-cluster).
    resources:
      - title: Saint11 · Resizing Pixel Art
        url: https://saint11.art/img/pixel-tutorials/Resizing.gif
