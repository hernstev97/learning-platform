lesson: |
  Du legst in einem Bildprogramm ein Bild von 32 × 32 Pixeln an und setzt mit der Maus eine Kiste. Bei 100 % ist sie so groß wie ein Daumennagel. Zum Zeigen vergrößerst du sie auf 250 % und schickst sie in einen Chat. Dort sind manche Pixel breiter als andere, und der Bildbetrachter auf dem Handy macht die Kanten weich. An deiner Zeichnung liegt das nicht. Es liegt an drei Einstellungen: am Programm, an der Vergrößerung und an der Art, wie vergrößert wird.

  Dieses Modul richtet dein Werkzeug ein. Jeder Abschnitt trennt zwei Dinge: **Bedienung** – wo du klickst – und **Gestaltung** – warum du es so einstellst. Die Bedienung ändert sich mit jeder Version, die Gründe bleiben. Die Schritte stehen für Pixelorama und Aseprite, LibreSprite bedienst du ähnlich wie Aseprite.

  ## Welcher Editor: frei, bezahlt oder selbst gebaut

  Derek Yu nennt als Grundausstattung für Pixelart nur zwei Werkzeuge: Zoom und einen Stift, der einzelne Pixel setzt. Linien- und Formwerkzeuge, Auswahl und Füllen helfen, mehr braucht es zum Start nicht ([Pixel Art Tutorial: Software](https://www.derekyu.com/makegames/pixelart.html#software)). Pedro Medeiros (Saint11) schreibt, dass du „even with just a good mouse and free software“ gute Pixelart machen kannst ([Tools](https://saint11.art/pixel_art_articles/article1/#tools)). Ein Tablett oder eine Lizenz ist also keine Voraussetzung.

  | Programm | Lizenz und Preis | Unter CachyOS |
  | --- | --- | --- |
  | Pixelorama 1.2.3 | MIT, frei; auf Steam 9,99 USD als Unterstützung | Flathub, AUR `pixelorama` |
  | LibreSprite 1.3 | GPL-2.0, frei | Arch-Repo `extra` |
  | Aseprite 1.3.18.6 | ab 19,99 USD oder selbst kompiliert | AUR `aseprite` baut aus dem Quellcode |
  | Krita 5.3.4.1 | GPL, frei | Flathub; `extra` hat die Qt6-Linie 6.0.4.1 |

  **Pixelorama** ist mit Godot gebaut und hat eine ausführliche Dokumentation. Die Web-Version läuft laut Doku über itch.io, die Android-Version ist „mostly meant to be used in tablets“ ([Installation](https://pixelorama.org/user_manual/installation/#android)). **LibreSprite** ist ein „Fork of the last GPLv2 commit of Aseprite“: Als Aseprite 2016 die Lizenz wechselte, lief die alte, freie Fassung als eigenes Projekt weiter ([LibreSprite](https://libresprite.github.io/)). Es hat Pixel-perfect und den Indexed-Modus, aber keine eigene Doku. Menüs und Abläufe ähneln dem alten Aseprite.

  **Aseprite** nennt Derek Yu den derzeit wohl beliebtesten Pixel-Editor, und Saint11 nutzt es in seinen Tutorials. Der Quellcode ist offen, die Lizenz aber nicht frei. Die EULA erlaubt in §2(g): „You may only compile and modify the source code of the SOFTWARE PRODUCT for your own personal purpose …“ ([EULA](https://github.com/aseprite/aseprite/blob/main/EULA.txt)). Selbst kompilieren für den eigenen Gebrauch ist also erlaubt. Weitergeben darfst du das Ergebnis nicht, §2(b) verbietet, Kopien an Dritte zu verteilen. Die Testversion speichert laut Saint11 keine Dateien ([Aseprite](https://saint11.art/pixel_art_articles/article1/#aseprite)).

  **Krita** ist ein Malprogramm. Für freie Skizzen, Tonwertstudien und Referenzbilder ist es gut, für Pixel nimmst du einen der drei Pixel-Editoren.

  > [!TIP] Eine Empfehlung für den Start
  > Nimm Pixelorama oder LibreSprite. Wenn du später merkst, dass dir eine Aseprite-Funktion fehlt, baust du es aus dem AUR. Alles in diesem Kurs geht mit jedem der drei Programme.

  ## Installation unter CachyOS

  Bedienung: LibreSprite kommt aus dem offiziellen Repository, Pixelorama aus Flathub ([Installation: Flathub](https://pixelorama.org/user_manual/installation/#flathub)), Aseprite über einen AUR-Helfer wie `paru`.

  ```console
  $ sudo pacman -S libresprite
  $ flatpak install flathub com.orama_interactive.Pixelorama
  $ paru -S aseprite
  ```

  Der AUR-Build von Aseprite kompiliert eine Weile. Pixelorama gibt es auch als AUR-Paket `pixelorama`. Nimm eines, nicht beides, sonst hast du zwei Starter im Menü. Das Paket [`libresprite`](https://archlinux.org/packages/extra/x86_64/libresprite/) aktualisiert sich mit jedem `pacman -Syu`, das Flatpak mit `flatpak update`.

  Für Werkzeuge gilt eine Regel dieses Kurses: Ein KI-Assistent darf dir bei technischer Arbeit helfen, etwa bei einem Build-Fehler oder einem Exportskript. Jede Zeichnung, jedes Tile (jede Kachel) und jede Palette entsteht von deiner Hand. Generierte Bilder ersetzen keine eigene Arbeit, auch nicht als Vorlage zum Nachpixeln.

  ## Leinwand, Zoom und Pixelraster

  Bedienung: In Aseprite legst du mit `File › New` (Ctrl+N) eine Leinwand an und wählst Breite, Höhe und Farbmodus ([New Sprite](https://www.aseprite.org/docs/new-sprite/)). In Pixelorama geht das ebenfalls über `File › New`.

  Gestaltung: Ein **Sprite** ist eine einzelne Grafik für ein Spiel, etwa eine Figur oder eine Kiste. Fang mit **16 × 16** an. Saint11 begründet das so: Größere Leinwände lenken davon ab, „understanding the interactions of pixels with their neighbors“ ([Making a New File](https://saint11.art/pixel_art_articles/article1/#making-a-new-file)). Als Nächstes kommt 32 × 32. Den Farbmodus lässt du zu Beginn auf RGB(A), den Indexed-Modus lernst du weiter unten kennen.

  Bedienung beim Zoom: In Pixelorama zoomst du mit dem Mausrad oder mit `+` und `-`. Das Zoom-Werkzeug hat einen Knopf für 100 %, der die Leinwand in ihrer echten Pixelgröße zeigt. Verschieben geht mit gedrückter mittlerer Maustaste oder Leertaste ([Zoom](https://pixelorama.org/user_manual/user_interface/canvas/#zoom)). In Aseprite zoomt das Mausrad in der Voreinstellung ([Preferences: Editor](https://www.aseprite.org/docs/preferences/#editor)), die Leertaste schaltet vorübergehend auf die Hand ([Keyboard Shortcuts](https://www.aseprite.org/docs/keyboard-shortcuts/#tools)).

  Das **Pixelraster** zeichnet ab einer bestimmten Zoomstufe eine feine Linie um jeden Pixel. In Pixelorama schaltest du es mit Ctrl+H oder `View › Show Pixel Grid` ein ([Pixel Grid](https://pixelorama.org/user_manual/user_interface/canvas/#pixel-grid)), in Aseprite über `View › Show › Pixel Grid` oder in den Einstellungen unter „Visible Pixel Grid“ ([Preferences: Grid](https://www.aseprite.org/docs/preferences/#grid)).

  Gestaltung: Gezeichnet wird vergrößert, beurteilt in Originalgröße. Ein Bogen, der bei 800 % sauber wirkt, kann bei 100 % zittern ([Linien, Kurven und Cluster](/pixelart/linien-cluster)). Halte deshalb eine zweite Ansicht in 1× offen. Pixelorama hat dafür die **Second Canvas** (`Window › Panels`), Aseprite ein Vorschaufenster. Raymond Schlitter (Slynyrd) empfiehlt ein Vorschaufenster in kleinem Zoom, damit du nicht ständig hin- und herzoomen musst ([Pixelblog 20](https://www.slynyrd.com/blog/2019/8/27/pixelblog-20-top-down-tiles)).

  > [!WARNING] 100 % in Aseprite sind nicht immer 1×
  > Aseprite stellt die Bildschirmskalierung („Screen Scaling“) standardmäßig auf 200 %: „each pixel in the window will be represented with a 2x2 square on the screen“ ([Preferences: General](https://www.aseprite.org/docs/preferences/#general)). Bei Zoom 100 % siehst du dein Sprite dann doppelt so groß. Für die echte Originalgröße öffnest du das exportierte PNG in einem Bildbetrachter bei 100 % oder nimmst den 100-%-Knopf in Pixelorama.

  ## Mit der Maus zeichnen, ohne freihändig zu zeichnen

  Mit der Maus triffst du keine ruhige Linie. Das musst du auch nicht: Du setzt Punkte, und das Programm verbindet sie.

  | Aufgabe | Aseprite | Pixelorama |
  | --- | --- | --- |
  | Stift | B | P |
  | Radierer | E | E |
  | Pipette | Alt gedrückt halten oder I | O |
  | Gerade Linie | Shift-Klick vom letzten Pixel | Shift halten, dann ziehen |
  | Zweite Farbe | rechte Maustaste | eigenes Werkzeug und eigene Farbe je Maustaste |

  Bedienung: In Aseprite malt die linke Maustaste mit der Vordergrund-, die rechte mit der Hintergrundfarbe ([Drawing](https://www.aseprite.org/docs/drawing/)); X tauscht beide ([Color Bar](https://www.aseprite.org/docs/color-bar/)). Shift zieht „a straight line from the last painted pixel“, Ctrl dazu rastet den Winkel ein ([Action Modifiers](https://www.aseprite.org/docs/keyboard-shortcuts/#action-modifiers)). Pixelorama geht weiter: Jede Maustaste bekommt ein eigenes Werkzeug mit eigener Farbe, die Werkzeugleiste markiert links blau und rechts orange ([Tools](https://pixelorama.org/user_manual/tools/)). Links Stift, rechts Radierer ist eine bequeme Belegung.

  Halte die Stiftgröße bei einem Pixel. Saint11 sagt, der Stift „should always be kept with 1 pixel of width“ ([Let's Draw](https://saint11.art/pixel_art_articles/article1/#lets-draw)).

  **Pixel-perfect** entfernt beim Zeichnen den mittleren Pixel von L-Ecken. In Aseprite schaltest du es in der Kontextleiste des Stifts ein ([Pixel-perfect mode](https://www.aseprite.org/docs/context-bar/#pixel-perfect-mode)), in Pixelorama in den Werkzeugoptionen ([Pixel perfect](https://pixelorama.org/user_manual/drawing/#pixel-perfect)). Warum Doppelpixel stören und warum du den Modus beim Ausmalen von Flächen ausschaltest, steht in [Linien, Kurven und Cluster](/pixelart/linien-cluster).

  **Spiegeln** gibt es zweimal. Die Symmetrie malt jeden Strich gespiegelt mit: in Aseprite über `View › Symmetry Options` ([Symmetry](https://www.aseprite.org/docs/symmetry/)), in Pixelorama in den Werkzeugoptionen ([Mirroring](https://pixelorama.org/user_manual/drawing/#mirroring)). Die gespiegelte Ansicht ändert dagegen kein Pixel, sie zeigt das Bild nur seitenverkehrt: in Pixelorama mit Shift+M ([Mirror](https://pixelorama.org/user_manual/user_interface/canvas/#mirror)), in Krita mit der Taste M ([View Menu](https://docs.krita.org/en/reference_manual/main_menu/view_menu.html)). Derek Yu nennt das horizontale Spiegeln einen „powerful trick“, der Fehler in Proportionen und Schattierung zeigt ([Selective Outlining](https://www.derekyu.com/makegames/pixelart.html#selout)).

  > [!NOTE] Hand und Handgelenk
  > Derek Yu empfiehlt für längeres Arbeiten ein Tablett, weil die Maus das Handgelenk belastet ([Other Supplies](https://www.derekyu.com/makegames/pixelart.html#supplies)). Ohne Tablett hilft, was die Maus entlastet: Tastenkürzel statt Wege zur Werkzeugleiste, Shift-Linien statt langer Züge, und kurze Sitzungen mit Pausen.

  ## Ebenen, Palette und Indexed-Modus

  Bedienung: Eine neue Ebene legst du in Aseprite mit Shift+N an, Shift+X blendet sie aus ([Layers](https://www.aseprite.org/docs/layers/)). In Pixelorama stehen die Ebenen in der Zeitleiste. Gestaltung: Trenne, was du getrennt ändern willst – Skizze, Kontur, Farbflächen. Eine Skizzenebene blendest du am Ende aus, statt sie wegzuradieren.

  Jede neue Aseprite-Datei startet mit der Palette DawnBringer 32 ([Default Palette](https://www.aseprite.org/docs/default-palette/)). Andere Paletten findest du auf [Lospec](https://lospec.com/palette-list), dort lädst du sie als PNG, GPL, PAL oder HEX herunter. Pixelorama importiert eine Palettendatei per Drag-and-drop oder über `File › Open`, unter anderem GPL, PAL und PNG ([Palettes import](https://pixelorama.org/user_manual/palettes/#palettes-import)). In Aseprite lädst du sie über das Menü ☰ der Farbleiste („Load Palette“).

  Der **Farbmodus** entscheidet, wie fest die Palette ist. Im RGB-Modus hat jeder Pixel eine eigene Farbe, die Palette ist nur eine Auswahlhilfe. Im **Indexed-Modus** speichert jeder Pixel eine Nummer, die auf eine Palettenfarbe zeigt. Aseprite erlaubt bis zu 256 Farben, und änderst du eine Palettenfarbe, ändern sich alle Pixel mit dieser Nummer ([Color Mode: Indexed](https://www.aseprite.org/docs/color-mode/#indexed)). Pixelorama ersetzt eine frei gewählte Farbe im Indexed-Modus durch die nächstliegende Palettenfarbe ([Indexed](https://pixelorama.org/concepts/color_mode/#indexed)). Umschalten: in Aseprite `Sprite › Color Mode › Indexed`, in Pixelorama im Menü `Project` unter „Color mode“.

  Gestaltung: Indexed zwingt dich, in der Palette zu bleiben, und erlaubt, ein fertiges Bild mit einer Palettenänderung umzufärben. Saint11 lässt Anfänger trotzdem im RGB-Modus starten, weil Indexed auch Nachteile hat ([Making a New File](https://saint11.art/pixel_art_articles/article1/#making-a-new-file)). Wie du Farben für eine Palette auswählst, ist Thema von [Farbe, Rampen und begrenzte Paletten](/pixelart/farbe-paletten).

  Eine **Referenzebene** zeigt ein Bild in höherer Auflösung als die Leinwand. Man kann auf ihr nicht malen ([Reference Layer](https://www.aseprite.org/docs/reference-layer/)). Du legst sie mit `Layer › New › New Reference Layer from File` an. In Pixelorama und LibreSprite legst du das Bild in eine eigene Ebene unter deine Zeichnung. Nutze sie für deine eigene Papierskizze, die du abfotografiert hast, oder für eine Studie, die du vergleichst. Ein fremdes Bild in Pixel nachzufahren, übt kein Sehen und ergibt kein eigenes Asset.

  ## Speichern und Exportieren: zwei verschiedene Dateien

  Bedienung: Speichern (Ctrl+S) schreibt das Editorformat: `.aseprite` in Aseprite, `.pxo` in Pixelorama. Es behält Ebenen, Palette und Einstellungen. Exportieren schreibt eine flache Bilddatei, meist PNG: in Aseprite über `File › Export › Export As` (Ctrl+Alt+Shift+S), in Pixelorama über `File › Export` (Ctrl+E) ([Save and Export](https://pixelorama.org/user_manual/save_and_export/#exporting)). Pixelorama empfiehlt ausdrücklich, beides zu tun. Saint11 behält von jeder Datei eine Version im Editorformat, so wie man in Photoshop eine PSD behält ([Saving Your File](https://saint11.art/pixel_art_articles/article1/#saving-your-file)).

  Zum Teilen vergrößerst du beim Export. Aseprite hat dafür im Exportdialog das Feld „Resize“ ([Automatic Resize on Export](https://www.aseprite.org/docs/exporting/#automatic-resize-on-export)), Pixelorama eine Größenänderung mit wählbarer Interpolation, Standard ist „Nearest“.

  ![Ein Prüfmuster von 16 × 16 Pixeln, zweimal stark vergrößert. A ist mit nächstem Nachbarn vergrößert: Schachbrett, blaue Treppenlinie, orange Scheibe und umrandetes Quadrat haben scharfe Kanten. B ist bilinear vergrößert: dieselben Formen sind verwaschen, das Schachbrett verschwimmt zu einem weichen Muster](/media/pixelart/editor-einrichten/skalieren@2x.png "Dasselbe Prüfmuster mit nächstem Nachbarn (A) und bilinear (B) vergrößert. Eigenes Schaubild")

  A und B zeigen dasselbe Bild. Bei A ist jeder Pixel zu einem gleich großen Quadrat geworden, das ist **nächster Nachbar** (Nearest Neighbor): Jeder neue Pixel übernimmt die Farbe des nächstgelegenen alten. Bei B hat das Programm zwischen benachbarten Pixeln gemischt. Dabei entstehen Farben, die in deiner Palette nicht vorkommen, und jede Kante wird weich. Bildbetrachter und Webseiten vergrößern oft so, wenn sie ein kleines Bild hochrechnen. Pixelorama nennt genau das als Grund für den Export in größerer Auflösung ([Save and Export](https://pixelorama.org/user_manual/save_and_export/#exporting)).

  Der zweite Punkt ist der **Faktor**. Slynyrd: „increase the image size only by whole number multiples in order to preserve the uniformity of the pixel units“ ([Pixelblog 5](https://www.slynyrd.com/blog/2018/5/16/pixelblog-5-back-to-basics)). Bei 200 % wird jeder Pixel 2 × 2 Bildpixel groß, bei 400 % 4 × 4. Bei 250 % müsste jeder Pixel 2,5 Bildpixel breit werden. Halbe Pixel gibt es nicht, also wechseln sich Breiten von 2 und 3 ab:

  ```text
  # # . . # # . .
  # # . . . # # . . .
  ```

  Beide Zeilen zeigen vier Sprite-Pixel, abwechselnd dunkel und hell. Oben bei 200 %: Jeder Lauf ist zwei Bildpixel breit. Unten bei 250 %: Die Läufe sind 2, 3, 2 und 3 breit. Eine gleichmäßige Treppe wird so zu einer holprigen. Saint11 warnt mit demselben Argument vor 107 % ([Saving Your File](https://saint11.art/pixel_art_articles/article1/#saving-your-file)).

  > [!MERKE]
  > Speichern im Editorformat, exportieren als PNG. Vergrößern nur um ganze Faktoren und nur mit nächstem Nachbarn.

  Für dein Spiel exportierst du in **Originalgröße**. Die Vergrößerung auf den Bildschirm übernimmt die Engine. Wie Godot Pixelart scharf und ganzzahlig skaliert und wie du PNGs und Spritesheets importierst, steht in [Pixelraster und Skalierung](/godot/pixelraster) und [Eigene Sprites importieren](/godot/sprites-importieren). Godot empfiehlt für Pixelart den Kompressionsmodus Lossless ([Importing images](https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_images.html#compress-mode)).

  > [!PRAXIS]
  > Saint11 arbeitet so: Jede Datei bleibt im Editorformat erhalten, für Web und Spiel wird exportiert, und am Resize-Feld des Exportdialogs schätzt er, dass es in runden Faktoren skaliert ([Saving Your File](https://saint11.art/pixel_art_articles/article1/#saving-your-file)). Slynyrd empfiehlt beim Arbeiten an Tiles ein verkleinertes Vorschaufenster ([Pixelblog 20](https://www.slynyrd.com/blog/2019/8/27/pixelblog-20-top-down-tiles)). Übernimm beides von Anfang an. Ein Ordner mit `.aseprite`- oder `.pxo`-Dateien und daneben ein Ordner `export/` mit PNGs in 1× ist eine Ordnung, die du später in Godot wiederfindest.

  > [!INTERVIEW]
  > Manche Studios vergeben vor einer Zusammenarbeit einen bezahlten Testauftrag. Snow Day Games nannte das eine „Paid test commission to ensure shared artistic vision“ ([Stellenanzeige](https://workwithindies.com/careers/snow-day-games-2d-technical-pixel-artist)). Rechne damit, dass jemand fragt: „Was schickst du ab?“ Gute Antwort: das PNG in Originalgröße für die Engine, eine ganzzahlig vergrößerte Vorschau zum Ansehen, die Quelldatei mit sauber benannten Ebenen und die Palette, die du benutzt hast. Dazu ein Satz, warum die Vorschau 400 % und nicht 250 % hat.

  ## Häufige Fehler

  - **Freihand mit der Maus.** Lange Linien entstehen mit Shift-Klick oder dem Linienwerkzeug. Die Hand setzt Punkte, das Programm verbindet.
  - **Pinsel größer als ein Pixel.** Dann setzt jeder Klick einen Klecks. Der Stift bleibt bei 1 px.
  - **Nur im Zoom beurteilt.** Prüf jeden Zwischenstand in echter Originalgröße, in Aseprite mit Blick auf die Bildschirmskalierung.
  - **Nur exportiert, nicht gespeichert.** Ein PNG hat keine Ebenen und keine Palette mehr. Ohne Editordatei fängst du bei jeder Änderung neu an.
  - **Krumme Faktoren.** 150 % oder 250 % machen Pixel ungleich breit. Nimm 200 %, 300 %, 400 %.
  - **Weichgezeichnet vergrößert.** Bilinear oder „glatt“ mischt Farben. Beim Export immer „Nearest“.
  - **Vergrößert ins Spiel exportiert.** Für Godot exportierst du in 1×, die Skalierung übernimmt die Engine.
  - **Zwei Pakete desselben Programms.** Flatpak und AUR-Paket nebeneinander führen zu zwei Startern und getrennten Einstellungen.

  ## Zusammenfassung

  - Pixelorama und LibreSprite sind frei, Aseprite kostet oder wird nach EULA §2(g) für den Eigengebrauch selbst kompiliert. Krita nimmst du für Skizzen.
  - Unter CachyOS: `pacman -S libresprite`, Pixelorama aus Flathub oder dem AUR, Aseprite aus dem AUR.
  - Start mit 16 × 16, Pixelraster an, eine zweite Ansicht in Originalgröße offen. In Aseprite zeigt 100 % bei Standardeinstellung 2 × 2 Bildschirmpixel je Pixel.
  - Die Hand setzt Punkte: Shift-Linien, Stift 1 px, Pixel-perfect für Konturen, rechte Maustaste für die zweite Farbe.
  - Ebenen trennen Skizze, Kontur und Fläche. Indexed bindet jeden Pixel an eine Palettenfarbe, bis zu 256.
  - Speichern im Editorformat, exportieren als PNG. Vergrößern nur ganzzahlig mit nächstem Nachbarn.
  - Fürs Spiel exportierst du in 1×. Import und Skalierung erledigt Godot.
exercises:
  - id: editor-wahl
    type: choice
    title: Welcher Editor, welche Bedingungen?
    prompt: |
      Welche Aussagen über die Programme stimmen?
    options:
      - text: Aseprite darfst du laut EULA für deinen eigenen Gebrauch aus dem Quellcode kompilieren.
        correct: true
        why: §2(g) erlaubt Kompilieren und Ändern „for your own personal purpose“. Weitergeben darfst du das Ergebnis nach §2(b) nicht.
      - text: LibreSprite ist ein Fork der letzten Aseprite-Fassung unter GPLv2 und liegt im Arch-Repository.
        correct: true
        why: Nach dem Lizenzwechsel von Aseprite 2016 lief die freie Fassung als LibreSprite weiter. Du installierst es mit `pacman -S libresprite`.
      - text: Die Testversion von Aseprite reicht für den Kurs, weil sie alle Dateien speichert.
        correct: false
        why: Laut Saint11 speichert die Testversion nicht. Zum Üben ohne Speichern reicht sie, für einen Kurs mit Dateien nicht.
      - text: Krita ist das beste Werkzeug für Sprites, weil es die meisten Pinsel hat.
        correct: false
        why: Krita ist ein Malprogramm. Für Skizzen ist es gut, für einzelne Pixel nimmst du einen Pixel-Editor mit Pixel-perfect, Palette und Tiled Mode.
    explanation: |
      Ohne Kauf hast du zwei vollwertige Wege, Pixelorama und LibreSprite, und mit dem AUR einen dritten, Aseprite aus dem Quellcode. Die Lizenzfrage entscheidet nur, ob du zahlst oder kompilierst und ob du das Programm weitergeben darfst. Für das Zeichnen selbst zählt, dass das Programm Pixel setzt, Paletten verwaltet und ganzzahlig exportiert.
    resources:
      - title: Aseprite · EULA
        url: https://github.com/aseprite/aseprite/blob/main/EULA.txt
      - title: Arch Linux · Paket libresprite
        url: https://archlinux.org/packages/extra/x86_64/libresprite/

  - id: skalieren-diagnose
    type: choice
    title: Scharf oder verwaschen?
    prompt: |
      Beide Felder zeigen dasselbe Prüfmuster von 16 × 16 Pixeln, gleich stark vergrößert. Welche Aussagen treffen zu?

      ![Ein Prüfmuster zweimal vergrößert. A hat scharfe Kanten. B ist verwaschen, das Schachbrett oben links ist kaum zu erkennen](/media/pixelart/editor-einrichten/skalieren@2x.png "Zwei Vergrößerungen desselben Bildes. Eigenes Schaubild")
    options:
      - text: A ist mit nächstem Nachbarn vergrößert, jeder Pixel ist ein gleich großes Quadrat geworden.
        correct: true
        why: Nächster Nachbar kopiert jeden Pixel in einen Block. Es entstehen keine neuen Farben.
      - text: In B sind beim Vergrößern Mischfarben entstanden, die in der Palette nicht vorkommen.
        correct: true
        why: Bilineares Vergrößern mischt benachbarte Pixel. Deshalb sind die Kanten weich, und das Schachbrett verschwimmt zu einem weichen Muster.
      - text: B ist die bessere Wahl für ein Spiel, weil es glatter aussieht.
        correct: false
        why: Glätte ist in Pixelart kein Ziel. B verliert gerade die Kanten, die du Pixel für Pixel gesetzt hast.
      - text: Der Unterschied kommt von der Zeichnung, nicht von der Vergrößerung.
        correct: false
        why: Beide Felder stammen aus derselben Datei. Nur das Verfahren beim Vergrößern ist verschieden.
    explanation: |
      Ein Bild kann auf zwei Arten wachsen: Jeder Pixel wird zum Block (nächster Nachbar), oder das Programm rechnet Zwischenwerte (bilinear). Für Pixelart willst du nur das erste. Deshalb stellst du beim Export „Nearest“ ein, und in Godot sorgt der Texturfilter für dasselbe.
    resources:
      - title: Pixelorama · Save and Export · Exporting
        url: https://pixelorama.org/user_manual/save_and_export/#exporting

  - id: erstes-sprite-ablauf
    type: order
    title: Vom leeren Editor zum geteilten Bild
    prompt: |
      Bring die Schritte für dein erstes Sprite in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Den Editor installieren und starten.
      Eine neue Leinwand mit 16 × 16 Pixeln anlegen.
      Eine Palette laden.
      Die Kontur mit dem Stift und Shift-Linien setzen.
      Die Datei im Editorformat speichern.
      Eine Kopie als PNG mit 400 % und nächstem Nachbarn exportieren.
    alternatives:
      - [1, 2, 3, 4, 6, 5]
    explanation: |
      Ohne Leinwand gibt es nichts, worauf eine Palette wirken könnte. Die Palette kommt vor dem ersten Strich, damit du von Anfang an mit ihren Farben zeichnest. Speichern und Exportieren sind zwei getrennte Dateien. Welche du zuerst schreibst, ist gleich, solange es beide gibt. Wer nur exportiert, verliert Ebenen und Palette.
    resources:
      - title: Saint11 · Saving Your File
        url: https://saint11.art/pixel_art_articles/article1/#saving-your-file

  - id: exportgroesse-400
    type: output
    title: Wie groß wird der Export?
    prompt: |
      Du exportierst ein Sprite von 32 × 32 Pixeln mit dem Resize-Wert 400 %. Wie viele Pixel breit ist das exportierte PNG? Antworte mit der Zahl.
    lang: text
    code: |
      Leinwand: 32 × 32 Pixel
      Export:   Resize 400 %, Nearest
    expected: |
      128
    accept:
      - 128 px
      - 128 Pixel
      - 128 × 128
      - 128x128
    explanation: |
      400 % heißt Faktor 4: 32 × 4 = 128. Jeder Sprite-Pixel wird zu einem Block von 4 × 4 Bildpixeln. Weil der Faktor ganz ist, sind alle Blöcke gleich groß, und mit nächstem Nachbarn entstehen keine neuen Farben. Das PNG für Godot exportierst du trotzdem in 1×, also mit 32 × 32.
    resources:
      - title: Aseprite Docs · Exporting · Automatic Resize on Export
        url: https://www.aseprite.org/docs/exporting/#automatic-resize-on-export

  - id: bildschirmskalierung
    type: output
    title: Was zeigt Zoom 100 %?
    prompt: |
      Aseprite steht auf der Standard-Bildschirmskalierung. Du siehst ein Sprite von 32 Pixeln Breite bei Zoom 100 % an. Wie viele Bildschirmpixel breit ist es? Antworte mit der Zahl.
    lang: text
    code: |
      Screen Scaling: 200 % (Standard)
      Zoom:           100 %
      Sprite:         32 Pixel breit
    expected: |
      64
    accept:
      - 64 px
      - 64 Pixel
    hints:
      - Die Aseprite-Doku sagt, wie viele Bildschirmpixel ein Fensterpixel bei 200 % belegt.
    explanation: |
      Bei 200 % Bildschirmskalierung wird jeder Pixel im Fenster als Quadrat von 2 × 2 Bildschirmpixeln gezeigt. Zoom 100 % bedeutet also 2× auf dem Bildschirm, 32 × 2 = 64. Wer bei dieser Einstellung „bei 100 %“ prüft, sieht sein Sprite doppelt so groß wie im Spiel bei 1×. Für die echte Originalgröße stellst du die Skalierung auf 100 % oder öffnest das exportierte PNG im Bildbetrachter.
    resources:
      - title: Aseprite Docs · Preferences · General
        url: https://www.aseprite.org/docs/preferences/#general

  - id: indexed-grenze
    type: output
    title: Wie viele Farben im Indexed-Modus?
    prompt: |
      Wie viele Farben kann eine Palette in Aseprite im Indexed-Modus höchstens haben? Antworte mit der Zahl.
    lang: text
    code: |
      Farbmodus: Indexed
      jeder Pixel: eine Nummer, die auf die Palette zeigt
      erste Nummer: 0
    expected: |
      256
    accept:
      - 256 Farben
    hints:
      - Die Nummern laufen von 0 bis 255.
    explanation: |
      Jeder Pixel speichert eine Nummer von 0 bis 255, also gibt es höchstens 256 Palettenplätze. Für Pixelart ist das viel mehr als nötig, Paletten mit 16 oder 32 Farben sind üblich. Der Nutzen von Indexed liegt in der Bindung: Ein Pixel kann keine Farbe haben, die nicht in der Palette steht, und eine Palettenänderung färbt alle Pixel mit dieser Nummer um.
    resources:
      - title: Aseprite Docs · Color Mode · Indexed
        url: https://www.aseprite.org/docs/color-mode/#indexed

  - id: begriffe-editor
    type: gap
    title: Begriffe aus der Einrichtung
    prompt: |
      Ergänze die Fachbegriffe aus der Lektion.
    lang: prose
    code: |
      Ein Modus, der beim Zeichnen den mittleren Pixel von L-Ecken entfernt, heißt ⟦Pixel-perfect⟧. Speichert jeder Pixel nur eine Nummer, die auf eine Palettenfarbe zeigt, arbeitest du im ⟦Indexed⟧-Modus. Ein Vergrößerungsverfahren, das jeden Pixel zu einem gleich großen Block macht, heißt nächster ⟦Nachbar⟧. Eine Ebene, die ein Bild in höherer Auflösung zeigt und auf der man nicht malen kann, heißt ⟦Referenzebene⟧. Ebenen und Palette bleiben nur erhalten, wenn du im ⟦Editorformat⟧ speicherst.
    gaps:
      - label: Modus gegen Doppelpixel
        hint: Englisch, zwei Wörter mit Bindestrich, das erste ist „Pixel“.
        accept: ["pixel perfect", "Pixelperfect"]
      - label: Farbmodus mit Nummern
        hint: Englisch für „indiziert“.
        accept: ["indiziert", "indizierten", "Index"]
      - label: Vergrößerungsverfahren
        hint: Auf Englisch „Nearest Neighbor“.
        accept: ["Neighbor", "Neighbour"]
      - label: Ebene für Vorlagen
        hint: In Aseprite heißt sie „Reference Layer“.
        accept: ["Reference Layer", "Referenz-Ebene", "Referenzebenen"]
      - label: Dateiformat
        hint: Bei Aseprite `.aseprite`, bei Pixelorama `.pxo`.
        accept: ["Projektformat", "Programmformat", "aseprite", "pxo", "nativen Format"]
    explanation: |
      Pixel-perfect und Indexed sind die beiden Einstellungen, die dich beim Zeichnen am stärksten führen: das eine bei Linien, das andere bei Farben. Nächster Nachbar und Editorformat betreffen das, was nach dem Zeichnen passiert. Die Referenzebene hilft bei der Übertragung einer eigenen Skizze.
    resources:
      - title: Pixelorama · Color mode · Indexed
        url: https://pixelorama.org/concepts/color_mode/#indexed

  - id: export-holprig
    type: bug
    title: Die Treppe holpert im Chat
    prompt: |
      Du hast eine Kiste gezeichnet und ihren Weg in den Chat notiert. Dort sind die Kanten scharf, aber manche Pixel sind breiter als andere, und eine gleichmäßige Treppe holpert. Finde die Zeile.
    lang: prose
    code: |
      Leinwand: 32 × 32 Pixel, RGB-Modus.
      Palette Sweetie 16 von Lospec über das Palettenmenü geladen.
      Kontur mit Shift-Linien gezogen, Pixel-perfect an.
      Gespeichert als kiste.aseprite.
      Exportiert als kiste.png mit Resize 250 % und Nearest.
      Das PNG in den Chat geschickt und bei 100 % angesehen.
    lines: [5]
    hints:
      - Scharfe Kanten heißen, dass nicht weichgezeichnet wurde. Was macht Pixel ungleich breit?
    explanation: |
      250 % verlangen 2,5 Bildpixel pro Sprite-Pixel. Weil es nur ganze Bildpixel gibt, wechseln sich Breiten von 2 und 3 ab, und gleichmäßige Läufe werden ungleich. Nearest ist richtig, deshalb bleiben die Kanten scharf. Mit 200 % oder 300 % sind alle Blöcke gleich groß. Wären die Kanten weich, läge die Ursache am Verfahren, nicht am Faktor.
    resources:
      - title: Slynyrd · Pixelblog 5 · Back to Basics
        url: https://www.slynyrd.com/blog/2018/5/16/pixelblog-5-back-to-basics

  - id: zwei-dateien-erklaeren
    type: explain
    title: Warum zwei Dateien?
    prompt: |
      Ein Freund fragt, warum du von jeder Zeichnung eine `.pxo`- oder `.aseprite`-Datei und zusätzlich ein PNG behältst und warum das PNG für Godot kleiner ist als das, das du im Chat zeigst. Erkläre es in drei bis fünf Sätzen.
    lang: prose
    code: |
      sprites/kiste.aseprite   Ebenen: skizze, kontur, farbe
      export/kiste.png         32 × 32, für Godot
      vorschau/kiste-4x.png    128 × 128, für den Chat
    points:
      - Die Editordatei behält Ebenen, Palette und Einstellungen. Nur aus ihr lässt sich das Bild sauber weiterbearbeiten.
      - Das PNG ist eine flache Kopie zum Weitergeben und für die Engine.
      - Für Godot exportierst du in 1×, weil die Engine selbst ganzzahlig skaliert.
      - Die Vorschau ist ganzzahlig mit nächstem Nachbarn vergrößert, damit Bildbetrachter sie nicht weichzeichnen.
    explanation: |
      Die Editordatei ist das Original: Sie kennt die Skizzenebene, die Kontur und die Palette. Ein PNG kennt nur Pixel, und jede Änderung daran fängt ohne Ebenen an. Für das Spiel brauchst du das Bild in Originalgröße, denn Godot vergrößert es selbst um ganze Faktoren und mit scharfem Filter. Im Chat würde ein Bild von 32 × 32 Pixeln winzig erscheinen oder weichgezeichnet werden. Deshalb gibt es dort eine Kopie mit Faktor 4 und nächstem Nachbarn.
    resources:
      - title: Pixelorama · Save and Export
        url: https://pixelorama.org/user_manual/save_and_export/
      - title: Godot Docs · Importing images · Compress mode
        url: https://docs.godotengine.org/en/stable/tutorials/assets_pipeline/importing_images.html#compress-mode

  - id: pruefmuster-einrichten
    type: practice
    title: Editor einrichten und Prüfmuster exportieren
    prompt: |
      Installiere Pixelorama oder LibreSprite (oder Aseprite aus dem AUR). Leg eine Leinwand von 16 × 16 Pixeln an und schalte das Pixelraster ein. Zeichne ein eigenes Prüfmuster: ein Schachbrett von 4 × 4 Pixeln, eine Linie mit Läufen von zwei Pixeln, eine gefüllte Scheibe und ein umrandetes Quadrat. Speichere im Editorformat. Exportiere zweimal: mit 400 % und mit 250 %, beide mit Nearest. Öffne beide Exporte im Bildbetrachter bei 100 %.
    lang: prose
    starter: |
      Programm und Version:
      Installiert über:
      Exportgröße bei 400 %:
      Wo ich bei 250 % ungleiche Pixel sehe:
    checklist:
      - Programm, Version und Installationsweg (pacman, Flatpak oder AUR) sind notiert.
      - Die Leinwand ist 16 × 16 Pixel groß, und das Pixelraster ist bei starkem Zoom sichtbar.
      - Die Linie besteht durchgehend aus Läufen von zwei Pixeln und wurde mit Shift-Linie oder Linienwerkzeug gesetzt.
      - Die Editordatei lässt sich schließen und wieder öffnen, und ihre Ebenen sind noch da.
      - Der 400-%-Export ist 64 × 64 Pixel groß, geprüft in den Dateieigenschaften oder im Bildbetrachter.
      - Du hast notiert, an welcher Stelle der 250-%-Export ungleich breite Pixel zeigt.
    hints:
      - Für das Schachbrett setzt du die zweite Farbe mit der rechten Maustaste (Aseprite) oder mit einem Stift, den du auf die rechte Taste legst (Pixelorama).
    explanation: |
      Das Prüfmuster ist dein Test für jede neue Einrichtung: Schachbrett und Treppe zeigen sofort, ob ein Export Pixel mischt oder ungleich breit macht. Die Größe in den Dateieigenschaften ist eine Prüfung, die nicht von deinem Auge abhängt. Wenn du später ein anderes Programm oder einen anderen Rechner nimmst, wiederholst du diesen Test in fünf Minuten.
    resources:
      - title: Pixelorama · Installation
        url: https://pixelorama.org/user_manual/installation/

  - id: kiste-mit-kuerzeln
    type: practice
    title: Eine Kiste nur mit Tastenkürzeln
    prompt: |
      Zeichne auf einer Leinwand von 32 × 32 Pixeln eine Holzkiste in Frontansicht. Benutze dabei die Werkzeugleiste möglichst gar nicht, sondern Tastenkürzel: Stift, Radierer, Pipette, Shift-Linien, zweite Farbe auf der rechten Maustaste. Schalte für die Front die Symmetrie ein und für ein einzelnes Detail, etwa einen Kratzer, wieder aus. Schreib die benutzten Kürzel auf.
    lang: prose
    starter: |
      Programm:
      Kürzel, die ich benutzt habe:
      Belegung der rechten Maustaste:
      Detail ohne Symmetrie:
    checklist:
      - Jede gerade Kante der Kiste ist mit Shift-Linie oder Linienwerkzeug entstanden, keine mit freier Hand.
      - Deine Liste nennt mindestens sechs Tastenkürzel mit dem Programm, für das sie gelten.
      - Die rechte Maustaste trägt eine zweite Farbe oder ein zweites Werkzeug, und du hast notiert, welches.
      - Die Front ist symmetrisch, das eine Detail sitzt nur auf einer Seite.
      - Die Kontur hat an schrägen oder runden Stellen keine Doppelpixel, geprüft bei starkem Zoom mit Pixelraster.
      - Du hast die Kiste in echter Originalgröße angesehen und notiert, was dir dort auffällt.
    explanation: |
      Die Übung trainiert die Hand für die Maus: Punkte setzen, verbinden lassen, mit der Tastatur wechseln. Nach einer Kiste kennst du die Kürzel, die du in jedem weiteren Modul brauchst. Das asymmetrische Detail zeigt, dass Symmetrie ein Werkzeug zum Arbeitsparen ist, das du gezielt ausschaltest.
    resources:
      - title: Aseprite Docs · Keyboard Shortcuts · Action Modifiers
        url: https://www.aseprite.org/docs/keyboard-shortcuts/#action-modifiers
      - title: Pixelorama · Drawing · Mirroring
        url: https://pixelorama.org/user_manual/drawing/#mirroring

  - id: skizze-als-referenz
    type: practice
    title: Von der Papierskizze zum 32er-Sprite
    prompt: |
      Zeichne auf Papier eine Tasse, die vor dir steht, in zwei Minuten. Fotografiere die Skizze und leg das Foto als Referenzebene (Aseprite) oder in eine eigene Ebene unter die Zeichnung (Pixelorama, LibreSprite). Lade eine Palette mit höchstens 16 Farben, stell auf Indexed und setz die Tasse auf 32 × 32 Pixeln in einer neuen Ebene. Blende die Skizze am Ende aus.
    lang: prose
    starter: |
      Palette und Farbzahl:
      Ebenen:
      Was ich gegenüber der Skizze vereinfacht habe:
    checklist:
      - Die Skizze zeigt eine echte Tasse, die du beim Zeichnen angesehen hast.
      - Skizze und Pixelzeichnung liegen in getrennten Ebenen, die Skizze ist im Export nicht zu sehen.
      - Das Bild steht im Indexed-Modus, und die Palette hat höchstens 16 Farben.
      - Die Kontur ist mit Pixel-perfect oder von Hand gesetzt und hat an schrägen oder runden Stellen keine Doppelpixel.
      - Es gibt eine Editordatei und einen Export in 1× und einen in 400 %.
      - Du hast notiert, welche Einzelheit der Skizze du für 32 × 32 Pixel weggelassen hast.
    explanation: |
      Der Weg von der eigenen Skizze zum Sprite ist der Arbeitsablauf, den du später für Figuren und Tiles brauchst. Die Referenzebene trägt deine Beobachtung in den Editor, ohne dass du ein fremdes Bild abpaust. Die Notiz zum Weglassen ist der erste Schritt zur Frage, wie viel Detail eine kleine Fläche trägt. Sie kommt in [Schattieren, Dithering, Textur und Detailgrad](/pixelart/schattieren-textur) wieder.
    resources:
      - title: Aseprite Docs · Reference Layer
        url: https://www.aseprite.org/docs/reference-layer/
      - title: Pixelorama · Palettes · Palettes import
        url: https://pixelorama.org/user_manual/palettes/#palettes-import
