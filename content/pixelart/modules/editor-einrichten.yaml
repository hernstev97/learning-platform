id: editor-einrichten
title: Einen Pixel-Editor wählen und einrichten
level: 1
minutes: 100
summary: Welcher Pixel-Editor ohne Kauf reicht, wie du ihn unter CachyOS installierst und für Maus und Tastatur einrichtest, und warum du im Editorformat speicherst, aber nur ganzzahlig vergrößert exportierst.
place: pc
goals:
  - Du wählst einen Pixel-Editor ohne Kauf und installierst ihn unter CachyOS mit pacman, Flatpak oder aus dem AUR.
  - Du legst eine Leinwand von 16 × 16 oder 32 × 32 Pixeln an und schaltest Pixelraster, Pixel-perfect und eine geladene Palette ein.
  - Du zeichnest mit Maus und Tastatur, mit Shift-Linien, zweiter Farbe auf der rechten Maustaste, Pipette und Spiegeln statt Freihand.
  - Du speicherst im Editorformat, exportierst getrennt davon als PNG und vergrößerst dabei nur um ganze Faktoren.
  - Du trennst Bedienschritte von Gestaltungsgründen und weißt, welche Schritte erst in Godot folgen.
