lesson: |
  Du hast eine Figur in kräftigem Rot gezeichnet und einen Gegner in kräftigem Blau. Auf dem Bildschirm unterscheiden sie sich auf den ersten Blick. Dann stellst du das Bild auf Graustufen, und beide sind dasselbe Mittelgrau. Wer Rot und Blau schlecht unterscheidet oder auf einen kleinen, hellen Handybildschirm schaut, sieht zwei gleiche Flecken.

  Farbe hat mehrere Eigenschaften, und das Auge liest sie getrennt. Dieses Modul zerlegt Farbe in Farbton, Sättigung und Helligkeit, zeigt, wie du den Tonwert einer Farbe nachrechnest, und baut daraus Rampen und Paletten. Alles geht am Handy und auf Papier. Den Graustufentest im Browser machst du am PC.

  ## Farbton, Sättigung, Helligkeit

  Pixel-Editoren bieten neben RGB meist Regler für **HSB** oder **HSV**. Raymond Schlitter (Slynyrd) erklärt sie so: Hue ist „the actual color“ von 0 bis 360°, Saturation „the intensity or purity of a color“, Brightness „the amount of black or white mixed with a color“ ([Pixelblog 1](https://www.slynyrd.com/blog/2018/1/10/pixelblog-1-color-palettes)). Pedro Medeiros (Saint11) nennt die dritte Größe Value, „the amount of light a color has“ ([Basic Color Theory: Value](https://saint11.art/pixel_art_articles/article6/#value)).

  - **Farbton** (Hue): Rot, Grün, Blau – die Stelle auf dem Farbkreis.
  - **Sättigung** (Saturation): wie kräftig die Farbe ist. Ein Grau hat keine.
  - **Helligkeit** (Brightness/Value): wie viel Licht die Farbe hat.

  Mit diesen drei Reglern stellst du jede Farbe gezielt ein. Eine Falle steckt im dritten. Saint11 warnt: „some hues, like blue and purple, can appear darker than yellow, even when the luminosity value is the same“ ([Hue](https://saint11.art/pixel_art_articles/article6/#hue)). Der Helligkeitsregler im Editor sagt also nicht, wie hell eine Farbe wirkt.

  ## Der Tonwert einer Farbe: was in Graustufen übrig bleibt

  Der **Tonwert** ist die Helligkeit, die bleibt, wenn du die Farbe wegnimmst. Wie Licht und Schatten mit Tonwerten arbeiten, behandelt [Licht, Schatten und Tonwerte](/pixelart/licht-werte). Hier geht es darum, welchen Tonwert eine Farbe hat.

  ![Acht Farbfelder in einer Reihe, darunter jeweils ihr Grauwert. 1 dunkles Violett wird fast schwarz. 2 Rot und 4 Blau ergeben dasselbe Mittelgrau. 5 Gelb und 6 Hellblau ergeben dasselbe helle Grau. 8 helles Gelb wird fast weiß](/media/pixelart/farbe-paletten/graustufen@2x.png "Acht Farben (oben) und ihre Grauwerte gleicher relativer Leuchtdichte (unten), Felder 1–8. Eigenes Schaubild")

  | Feld | Farbe | Leuchtdichte | HSB-Helligkeit |
  | --- | --- | --- | --- |
  | 1 | `#2B2445` | 0.022 | 27 % |
  | 2 | `#C8463C` | 0.170 | 78 % |
  | 3 | `#3E8C45` | 0.202 | 55 % |
  | 4 | `#3B6FD8` | 0.173 | 85 % |
  | 5 | `#E8B04A` | 0.487 | 91 % |
  | 6 | `#7FC4D8` | 0.489 | 85 % |
  | 7 | `#8A5A3C` | 0.130 | 54 % |
  | 8 | `#F2EFA8` | 0.834 | 95 % |

  Rot (2) und Blau (4) unterscheiden sich im Farbton um rund 140° und ergeben trotzdem dasselbe Grau. Dasselbe gilt für Gelb (5) und Hellblau (6). Die Spalte rechts zeigt, warum dir der Helligkeitsregler nicht hilft: Blau steht dort bei 85 %, Grün (3) bei 55 %, und trotzdem ist das Grün in Graustufen heller.

  Die Spalte „Leuchtdichte“ folgt der Definition der **relativen Leuchtdichte** in WCAG 2.2. Jeder Kanal wird von 0–255 auf 0–1 gebracht und linearisiert, die Schwelle liegt bei 0.04045. Dann werden die Kanäle gewichtet: 0.2126 für Rot, 0.7152 für Grün, 0.0722 für Blau ([Relative luminance](https://www.w3.org/TR/WCAG22/#dfn-relative-luminance)). Grün zählt also zehnmal so viel wie Blau. Das Programm rechnet vier Farben aus der Tabelle nach:

  ```python run
  def kanal(wert):
      s = wert / 255
      if s <= 0.04045:
          return s / 12.92
      return ((s + 0.055) / 1.055) ** 2.4

  def leuchtdichte(hexfarbe):
      r = int(hexfarbe[1:3], 16)
      g = int(hexfarbe[3:5], 16)
      b = int(hexfarbe[5:7], 16)
      return (0.2126 * kanal(r)
              + 0.7152 * kanal(g)
              + 0.0722 * kanal(b))

  for f in ("#C8463C", "#3B6FD8",
            "#E8B04A", "#7FC4D8"):
      print(f, round(leuchtdichte(f), 3))
  ```

  Aus zwei Leuchtdichten rechnet WCAG ein **Kontrastverhältnis**: (hell + 0.05) ÷ (dunkel + 0.05) ([Contrast ratio](https://www.w3.org/TR/WCAG22/#dfn-contrast-ratio)). Weiß auf Schwarz ergibt 21 : 1, Rot gegen Blau aus der Tabelle 1,01 : 1, also praktisch keinen Unterschied. Die Formel ist für Text auf Webseiten gemacht. Für Pixelart nutzt du sie als Messlatte, nicht als Norm: Liegt das Verhältnis zweier Farben nahe 1, verschmelzen sie in Graustufen.

  > [!MERKE]
  > Farbton und Tonwert sind zwei verschiedene Eigenschaften. Zwei Farben, die sich nur im Farbton unterscheiden, verschmelzen in Graustufen.

  > [!DEEP] Leuchtdichte ist nicht wahrgenommene Helligkeit
  > Die relative Leuchtdichte misst Licht linear. Sie ist keine Skala, auf der gleiche Abstände gleich hell wirken. Dafür sind Farbräume wie **OKLab** gebaut; Björn Ottosson beschreibt ihn in [A perceptual color space for image processing](https://bottosson.github.io/posts/oklab/), CSS kennt ihn als `oklab()` ([CSS Color 4](https://www.w3.org/TR/css-color-4/#ok-lab)). Programme rechnen Graustufen außerdem verschieden, manche mitteln nur die Kanäle. Für die Frage „Verschmelzen diese zwei Farben?“ reicht die Leuchtdichte.

  ## Farbrampen und Hue Shifting

  Slynyrd definiert: „A color ramp is a specific range of colors that work well together, arranged according to brightness.“ Eine **Rampe** ist die Reihe von Tönen, mit der du eine Fläche vom Schatten bis zum Licht schattierst.

  ![Zwei Rampen aus je sechs Farben, darunter jeweils eine damit schattierte Kugel mit Licht von oben links. A geht nur in der Helligkeit von Dunkelgrün nach Blassgrün. B geht in kleinen Schritten von dunklem Blaugrün über Grün nach hellem Gelbgrün](/media/pixelart/farbe-paletten/rampen@2x.png "Rampe nur über die Helligkeit (A) und Rampe mit Hue Shifting (B), beide mit demselben Mittelton. Eigenes Schaubild")

  Beide Rampen teilen sich den dritten Ton, das Grün `#3F7C5C`. A bleibt im Farbton fast stehen, zwischen 137° und 153°, und ändert nur die Helligkeit. B wandert in Schritten von etwa 18° von `#1D494C` (dunkles Blaugrün, 184°) über das gemeinsame Grün zu `#BDEB9B` (helles Gelbgrün, 94°); die dunklen Töne sind gesättigter als die hellen. Das nennt man **Hue Shifting**, das Verschieben des Farbtons entlang der Rampe. Slynyrd: „A good color ramp should also apply hue-shifting“. Rampen ohne Verschiebung nennt er „straight ramps“; ihre Farben „will lack interest and be difficult to harmonize with ramps of a different hue“. Er verschiebt in eine Richtung: „positive hue shift usually results in more natural colors, warming as they become brighter“, und für die Schrittweite gilt bei ihm: „20 is about as high as I go“. In welche Richtung des Farbkreises er dabei zählt, sagt die Stelle nicht eindeutig. Dieser Kurs hält sich an die Wirkung, die er beschreibt, zum Licht hin wärmer; in Rampe B sinken die Gradzahlen dabei. Das ist eine Deutung, kein Zitat.

  Saint11 zeigt dasselbe an einer Vase. Die Rampe nur über die Helligkeit wirke „dull and muddy“. In seiner zweiten Fassung hat er den Schatten „a little more blue and less saturated (colder)“ gemacht und das Licht „a little more yellow and saturated (warmer)“ ([Shading](https://saint11.art/pixel_art_articles/article6/#shading)). Valve hielt für Team Fortress 2 fest: „Shading obeys a warm-to-cool hue shift. Shadows go to cool, not black.“ ([NPAR 2007](https://media.steampowered.com/apps/valve/2007/NPAR07_IllustrativeRenderingInTeamFortress2.pdf), Abschnitt 3)

  Bei der **Sättigung** sind sich die Quellen nicht einig, und das darfst du wissen. Slynyrd: „Generally, darker colors have more saturation“; er lässt die Sättigung in der Mitte der Rampe gipfeln und an hellen Enden sinken, sonst entstehen „intense eye burning colors“. Saint11 macht in seinem Beispiel den Schatten weniger gesättigt. Valve schreibt, die Sättigung steige am Übergang von Licht zu Schatten. Gemeinsam ist allen drei: Der Farbton wandert zum Schatten hin kühl und zum Licht hin warm, und sehr helle Töne sind nie voll gesättigt. Wie stark du die Sättigung führst, ist deine Entscheidung. Notiere sie, damit alle Rampen einer Palette ihr folgen.

  Rampen planst du am Handy in Zahlen. Eine Zeile pro Stufe, von dunkel nach hell:

  ```text
  1  H 250°  S 45 %  B 25 %
  2  H 230°  S 50 %  B 38 %
  3  H 210°  S 52 %  B 52 %
  4  H 190°  S 48 %  B 66 %
  5  H 170°  S 35 %  B 82 %
  ```

  Diese Rampe verschiebt den Farbton um 20° pro Stufe in eine Richtung, die Helligkeit steigt bei jeder Stufe, die Sättigung gipfelt in der Mitte. Im Editor übernimmt Pixelorama einen Teil davon: Sein Shading-Werkzeug hat einen Modus „Hue Shifting“, der beim Aufhellen den Farbton Richtung Gelb und beim Abdunkeln Richtung Blau schiebt ([Shading: Hue Shifting](https://pixelorama.org/user_manual/shading/#hue-shifting)). Eine selbst geplante Rampe lehrt dich mehr als der Automat.

  ## Begrenzte Paletten: warum wenige Farben

  Derek Yu: „Pixel art is defined by its constraints.“ Für Anfänger rät er, Palettentheorie zunächst beiseitezulassen und „just pick an existing one“. 32 Farben seien eine verbreitete Wahl, 16 auch üblich ([Choosing a Palette](https://www.derekyu.com/makegames/pixelart.html#palette)). Slynyrd baut große Paletten aus vielen Rampen und zieht daraus für jeden Auftrag eine kleinere: „A little color goes a long way with pixel art“. Saint11 nennt als Ziel „do as much as I can with as little as possible“ und warnt, zu viele Farbtöne machten ein Bild unruhig ([Hue](https://saint11.art/pixel_art_articles/article6/#hue)).

  Eine begrenzte Palette hilft dreifach:

  - **Zusammenhalt.** Teilen sich Rampen ihre dunkelsten und hellsten Töne, passen Figur und Umgebung zusammen.
  - **Lesbarkeit.** Wenige, gut getrennte Tonwerte sind bei 1× leichter zu unterscheiden als viele ähnliche.
  - **Entscheidungen.** Mit 16 Farben wählst du, statt zu mischen. Jeder Pixel bekommt eine Farbe, die du kennst.

  Fertige Paletten sind Lernstoff. Auf [Lospec](https://lospec.com/palette-list) findest du [PICO-8](https://lospec.com/palette-list/pico-8) mit den 16 festen Farben der gleichnamigen Fantasiekonsole, [Sweetie 16](https://lospec.com/palette-list/sweetie-16) von GrafxKid und [Endesga 32](https://lospec.com/palette-list/endesga-32). Aseprite startet jede neue Datei mit DawnBringer 32 ([Default Palette](https://www.aseprite.org/docs/default-palette/)). Lies eine solche Palette wie einen Bauplan: Welche Farben bilden zusammen eine Rampe? Wo verschiebt sich der Farbton? Welche Farben teilen sich mehrere Rampen? Für dein eigenes Spiel baust du später eine eigene Palette. Fertige Paletten zeigen dir, wie andere die Fragen beantwortet haben, die du dann selbst entscheidest. Wie du eine Palette im Editor lädst und mit dem Indexed-Modus festhältst, steht in [Einen Pixel-Editor wählen und einrichten](/pixelart/editor-einrichten).

  > [!PRAXIS]
  > Slynyrd legt seine Palette „Mondo“ mit 128 Farben aus acht Rampen an: neun Töne pro Rampe, 20° Hue Shift zwischen zwei Tönen, die Rampen um je 45° auf dem Farbkreis versetzt. Dazu kommen entsättigte Fassungen der mittleren Töne für natürliche Grautöne ([Pixelblog 1](https://www.slynyrd.com/blog/2018/1/10/pixelblog-1-color-palettes)). Für ein einzelnes Bild nimmt er daraus nur wenige Farben. Das Prinzip kannst du übernehmen: ein Vorrat mit festen Regeln, für jedes Bild eine kleine Auswahl daraus.

  ## Farbe im Spiel: Figuren, Hintergrund, Teams

  In einem Spiel muss Farbe Fragen beantworten, bevor der Spieler nachdenkt. Jason Mitchell beschreibt für Team Fortress 2 eine „Read Hierarchy“: Zuerst liest der Spieler das Team über die Farbe, dann die Klasse über Silhouette und Proportionen, dann die Waffe ([Connecting Visuals to Gameplay](https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf)). Die Basen des roten Teams nutzen warme Farben und kantige Formen, die des blauen Teams kühle Farben und rechtwinklige Formen. In den Texturen dominieren gedämpfte Farben mit kleinen gesättigten Flächen, und die Umgebung ist „Desaturated relative to players“ (NPAR 2007, Abschnitt 4; MIGS 2008).

  Saint11 gibt denselben Rat für einzelne Bilder: „try using large low saturation areas with small high saturation details“ ([Saturation](https://saint11.art/pixel_art_articles/article6/#saturation)). Für ein Top-down-Spiel heißt das: Der Boden bekommt gedämpfte Farben in einem engen Tonwertbereich, Figuren und Gefahren die kräftigen Farben und den vollen Kontrast. Wie das in Tiles (Kacheln) aussieht, zeigt [Umgebung und Tiles, die Figuren tragen](/pixelart/umgebung-tiles).

  Zwei Regeln folgen aus dem Graustufenbild oben. Erstens: Unterscheide Freund und Feind nie nur über den Farbton. Gib ihnen auch verschiedene Tonwerte, Formen oder Konturen. Valve verbindet Teamfarbe mit Formensprache, nicht Farbe allein. Zweitens: Prüf jede Paarung, die im Spiel zählt, in Graustufen.

  > [!INTERVIEW]
  > Im Portfolio-Gespräch fragt ein Art Lead: „Warum hast du diese Farben gewählt?“ Eine schwache Antwort ist „Die gefallen mir“. Eine gute nennt die Struktur: wie viele Rampen, wie der Farbton in jeder Rampe wandert, welche Töne sich die Rampen teilen. Dazu zeigst du dasselbe Bild in Graustufen und sagst, welche Paare du daraufhin geändert hast. Geschmack darfst du haben; begründen musst du ihn.

  ## Farbfehlsichtigkeit und Graustufen prüfen

  Chromium kann simulieren, wie Menschen mit Farbfehlsichtigkeit ein Bild sehen. Öffne dein exportiertes PNG in einem Tab, dann die DevTools. Mit Ctrl+Shift+P öffnest du das Befehlsmenü, tippst „rendering“ und wählst „Show Rendering“. Unter „Emulate vision deficiencies“ stehen unter anderem Protanopia (kein Rot), Deuteranopia (kein Grün), Tritanopia (kein Blau) und Achromatopsia, also keine Farbe ([Emulate vision deficiencies](https://developer.chrome.com/docs/devtools/rendering/apply-effects#emulate_vision_deficiencies)). Achromatopsia ist dein Graustufentest. Bei Protanopia und Deuteranopia nennt die Doku „confusion of greens, reds, and yellows“. Rot gegen Grün als einziges Unterscheidungsmerkmal fällt dort durch.

  Unterwegs prüfst du grob: ein Foto deiner Skizze oder ein Screenshot in Schwarzweiß, wenn deine Galerie-App einen solchen Filter hat. Den genauen Test machst du am PC.

  ## Häufige Fehler

  - **Schatten mit Schwarz gemischt.** Die Farbe wird trüb. Schatten werden kühler und dunkler, nicht schwarz.
  - **Gerade Rampen.** Nur die Helligkeit zu ändern ergibt laut Saint11 „dull and muddy“ Töne und Rampen, die nicht zueinander passen.
  - **Helligkeitsregler als Tonwert gelesen.** Blau bei 85 % kann dunkler sein als Grün bei 55 %. Rechne nach oder prüf in Graustufen.
  - **Volle Sättigung bei voller Helligkeit.** Slynyrd nennt das den größten Fehler, „unless you want to burn some eyeballs“.
  - **Zu viele Farbtöne.** Jede neue Rampe macht das Bild unruhiger. Lieber weniger Rampen, die sich Töne teilen.
  - **Freund und Feind nur über den Farbton getrennt.** In Graustufen und bei Farbfehlsichtigkeit verschwindet der Unterschied.
  - **Kräftiger Hintergrund.** Ist der Boden so gesättigt wie die Figur, konkurrieren beide um den Blick.

  ## Zusammenfassung

  - Farbe hat Farbton, Sättigung und Helligkeit. Der Tonwert ist das, was in Graustufen bleibt.
  - Die relative Leuchtdichte nach WCAG gewichtet Grün stark und Blau schwach. Der HSB-Helligkeitsregler sagt nichts über den Tonwert.
  - Ein Kontrastverhältnis nahe 1 : 1 heißt: Die Farben verschmelzen in Graustufen.
  - Eine Rampe ordnet Töne nach Helligkeit. Mit Hue Shifting wandert sie zum Licht hin warm und zum Schatten hin kühl.
  - Bei der Sättigung widersprechen sich Slynyrd, Saint11 und Valve. Leg deine Regel fest und halte sie durch.
  - Wenige Farben halten ein Bild zusammen. Fertige Paletten sind Lernstoff, deine eigene baust du selbst.
  - Im Spiel: gedämpfte Umgebung, kräftige Figuren, Unterschiede nie nur im Farbton. Chromium simuliert Farbfehlsichtigkeit und Graustufen.
exercises:
  - id: hsb-unterscheiden
    type: choice
    title: Drei Eigenschaften einer Farbe
    prompt: |
      Welche Aussagen über Farbton, Sättigung und Helligkeit stimmen?
    options:
      - text: Zwei Farben mit verschiedenem Farbton können denselben Tonwert haben.
        correct: true
        why: Rot `#C8463C` und Blau `#3B6FD8` liegen rund 140° auseinander und ergeben in Graustufen dasselbe Grau.
      - text: Ein Grau hat keine Sättigung.
        correct: true
        why: Sättigung ist die Kraft der Farbe. Bei null bleibt nur die Helligkeit übrig.
      - text: Eine Farbe mit 85 % HSB-Helligkeit ist in Graustufen immer heller als eine mit 55 %.
        correct: false
        why: Der Regler misst nicht, wie hell eine Farbe wirkt. Blau bei 85 % hat eine Leuchtdichte von 0.173, Grün bei 55 % eine von 0.202.
      - text: Der Farbton bestimmt, wie hell eine Farbe in Graustufen erscheint.
        correct: false
        why: Der Farbton beeinflusst das zwar über die Gewichtung der Kanäle, entscheidend ist aber die Leuchtdichte der ganzen Farbe. Gelb und Hellblau aus dem Schaubild sind gleich hell.
    explanation: |
      Die drei Regler eines Farbwählers sind praktische Stellschrauben, aber nur einer davon heißt „Helligkeit“, und er misst etwas anderes als das Auge. Was in Graustufen übrig bleibt, hängt von allen drei Kanälen und ihrer Gewichtung ab. Deshalb prüfst du Tonwerte immer in Graustufen oder rechnest sie nach.
    resources:
      - title: Saint11 · Basic Color Theory · Hue
        url: https://saint11.art/pixel_art_articles/article6/#hue

  - id: graustufen-paare
    type: choice
    title: Welche Farben verschmelzen?
    prompt: |
      Sieh dir die acht Farben und ihre Grauwerte an. Welche Paare sind in Graustufen kaum zu unterscheiden?

      ![Acht Farbfelder mit ihren Grauwerten darunter, nummeriert 1 bis 8](/media/pixelart/farbe-paletten/graustufen@2x.png "Acht Farben und ihre Grauwerte. Eigenes Schaubild")
    options:
      - text: 2 (Rot) und 4 (Blau)
        correct: true
        why: "Leuchtdichte 0.170 und 0.173, Kontrastverhältnis 1,01 : 1."
      - text: 5 (Gelb) und 6 (Hellblau)
        correct: true
        why: Leuchtdichte 0.487 und 0.489. Im Bild sind beide Grauflächen gleich hell.
      - text: 1 (Violett) und 8 (helles Gelb)
        correct: false
        why: "Das ist das stärkste Paar im Bild, Leuchtdichte 0.022 gegen 0.834, rund 12 : 1."
      - text: 3 (Grün) und 7 (Braun)
        correct: false
        why: 0.202 gegen 0.130 ist ein kleiner, aber sichtbarer Unterschied. Für Freund und Feind wäre er zu knapp, verschmelzen tun sie nicht.
    explanation: |
      Rot und Blau, Gelb und Hellblau sind die Paare, die im Farbbild am stärksten auseinanderliegen und in Graustufen verschwinden. Genau solche Paare sind gefährlich, wenn sie im Spiel etwas unterscheiden sollen. Der Test kostet keine Minute und zeigt, ob deine Unterscheidung am Tonwert oder nur am Farbton hängt.
    resources:
      - title: W3C · WCAG 2.2 · Contrast ratio
        url: https://www.w3.org/TR/WCAG22/#dfn-contrast-ratio

  - id: rampe-planen-ablauf
    type: order
    title: Eine Rampe planen
    prompt: |
      Bring die Schritte zum Planen einer Rampe in die Reihenfolge, die Slynyrd in Pixelblog 1 beschreibt.
    lang: prose
    lines: |
      Festlegen, wie viele Stufen die Rampe hat und wie viele Grad sich der Farbton pro Stufe verschiebt.
      Einen Mittelton wählen, der die Fläche im normalen Licht zeigt und am kräftigsten wirkt.
      Von dort aus die Stufen setzen: zum Licht hin heller und wärmer, zum Schatten hin dunkler und kühler.
      Die Sättigung nach deiner Regel einstellen und die hellste Stufe entsättigen.
      Eine Kugel mit der Rampe schattieren und die Stufen in Graustufen vergleichen.
    explanation: |
      Slynyrd schreibt: „First I decide how many swatches I want per ramp and how many degrees of hue shift.“ Erst danach wählt er den Mittelton, und den will er am kräftigsten: „I want the middle color to be the most vibrant“. Aus Stufenzahl, Schrittweite und Mittelton ergeben sich die übrigen Töne. Die Sättigung justierst du danach, weil sie nicht in gleichen Schritten aufgeht. Der Test an einer Kugel und in Graustufen steht am Ende, er zeigt, ob die Stufen gleichmäßig wirken.
    resources:
      - title: Slynyrd · Pixelblog 1 · Color Palettes
        url: https://www.slynyrd.com/blog/2018/1/10/pixelblog-1-color-palettes

  - id: reine-kanaele
    type: output
    title: Wie hell sind Rot, Grün und Blau?
    prompt: |
      Das Programm berechnet die relative Leuchtdichte für reines Rot, reines Grün und reines Blau. Was gibt es aus?
    lang: python
    code: |
      def kanal(wert):
          s = wert / 255
          if s <= 0.04045:
              return s / 12.92
          return ((s + 0.055) / 1.055) ** 2.4

      def leuchtdichte(r, g, b):
          return (0.2126 * kanal(r)
                  + 0.7152 * kanal(g)
                  + 0.0722 * kanal(b))

      print(round(leuchtdichte(255, 0, 0), 3))
      print(round(leuchtdichte(0, 255, 0), 3))
      print(round(leuchtdichte(0, 0, 255), 3))
    expected: |
      0.213
      0.715
      0.072
    hints:
      - "`kanal(255)` ergibt 1, `kanal(0)` ergibt 0."
      - Übrig bleibt jeweils nur ein Gewicht, gerundet auf drei Stellen.
    explanation: |
      Bei einem reinen Kanal ist der linearisierte Wert 1 und die anderen sind 0. Übrig bleibt das Gewicht des Kanals: 0.2126, 0.7152 und 0.0722, gerundet 0.213, 0.715 und 0.072. Reines Grün ist also rund zehnmal so hell wie reines Blau. Das erklärt, warum ein kräftiges Blau in Graustufen dunkel wird und warum Grün so schnell grell wirkt.
    resources:
      - title: W3C · WCAG 2.2 · Relative luminance
        url: https://www.w3.org/TR/WCAG22/#dfn-relative-luminance

  - id: kontrast-vorhersagen
    type: output
    title: Weiß gegen Schwarz, Rot gegen Blau
    prompt: |
      Das Programm berechnet das Kontrastverhältnis nach WCAG für zwei Paare: Weiß gegen Schwarz und Rot gegen Blau aus dem Schaubild. Was gibt es aus?
    lang: python
    code: |
      def kontrast(l1, l2):
          hell = max(l1, l2)
          dunkel = min(l1, l2)
          return (hell + 0.05) / (dunkel + 0.05)

      print(round(kontrast(1.0, 0.0), 1))
      print(round(kontrast(0.170, 0.173), 2))
    expected: |
      21.0
      1.01
    hints:
      - "Erste Zeile: 1.05 ÷ 0.05."
      - "Zweite Zeile: 0.223 ÷ 0.220, auf zwei Stellen gerundet."
    explanation: |
      Weiß gegen Schwarz ist das größte mögliche Verhältnis: 1.05 ÷ 0.05 = 21. Rot gegen Blau ergibt 0.223 ÷ 0.220 ≈ 1.014, gerundet 1.01, also fast keinen Unterschied. Die Reihenfolge der Argumente spielt keine Rolle, weil die Funktion den helleren Wert selbst sucht. Ein Verhältnis nahe 1 ist der Zahlenbeweis für das, was das Graustufenbild zeigt.
    resources:
      - title: W3C · WCAG 2.2 · Contrast ratio
        url: https://www.w3.org/TR/WCAG22/#dfn-contrast-ratio

  - id: palette-zaehlen
    type: output
    title: Wie viele Farben hat die Palette?
    prompt: |
      Eine Palette hat drei Rampen zu je fünf Tönen: Haut, Stoff und Stein. Alle drei teilen sich denselben dunkelsten Ton, ein dunkles Violett. Sonst ist jeder Ton einmalig. Wie viele verschiedene Farben hat die Palette? Antworte mit der Zahl.
    lang: text
    code: |
      Rampe Haut:   5 Töne
      Rampe Stoff:  5 Töne
      Rampe Stein:  5 Töne
      gemeinsam:    dunkelster Ton aller drei
    expected: |
      13
    accept:
      - 13 Farben
      - dreizehn
    hints:
      - Ohne Teilen wären es 15. Wie oft zählst du das Violett zu viel?
    explanation: |
      Drei mal fünf sind 15 Einträge, aber das Violett steht in allen drei Rampen und zählt nur einmal: 15 − 2 = 13. Geteilte Töne sparen Farben und halten die Palette zusammen, weil Schatten auf Haut, Stoff und Stein im selben Ton enden. Viele fertige Paletten auf Lospec sind so gebaut.
    resources:
      - title: Lospec · Endesga 32
        url: https://lospec.com/palette-list/endesga-32

  - id: farbbegriffe
    type: gap
    title: Fachbegriffe der Farbe
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Eine Reihe von Tönen, nach Helligkeit geordnet, heißt ⟦Rampe⟧. Verschiebt sich der Farbton entlang dieser Reihe, spricht man von ⟦Hue⟧ Shifting. Die Kraft einer Farbe nennt man ⟦Sättigung⟧. Die Helligkeit, die in Graustufen übrig bleibt, ist der ⟦Tonwert⟧. Nach WCAG rechnest du sie als relative ⟦Leuchtdichte⟧. Schatten werden laut Valve nicht schwarz, sondern ⟦kühl⟧.
    gaps:
      - label: geordnete Tonreihe
        hint: Englisch „ramp“.
        accept: ["Farbrampe", "Ramp", "Color Ramp"]
      - label: Verschiebung
        hint: Englisch für Farbton.
        accept: ["Farbton"]
      - label: Kraft der Farbe
        hint: Englisch „saturation“.
        accept: ["Saturation", "Farbsättigung"]
      - label: Helligkeit ohne Farbe
        hint: Englisch „value“.
        accept: ["Value", "Helligkeitswert", "Grauwert"]
      - label: Rechengröße
        hint: Englisch „luminance“.
        accept: ["Luminanz", "Luminance"]
      - label: Schattenfarbe bei Valve
        hint: Das Gegenteil von warm.
        accept: ["kalt", "cool", "kühler"]
    explanation: |
      Mit diesen Begriffen beschreibst du jede Palette: Rampen mit Hue Shifting, Sättigung und Tonwert als getrennte Eigenschaften, die Leuchtdichte als Messgröße. „Shadows go to cool, not black“ fasst den wichtigsten Rat für Schatten in fünf Wörtern.
    resources:
      - title: Valve · Illustrative Rendering in Team Fortress 2 (NPAR 2007)
        url: https://media.steampowered.com/apps/valve/2007/NPAR07_IllustrativeRenderingInTeamFortress2.pdf

  - id: rampe-springt
    type: bug
    title: Die Kugel bekommt einen Ring
    prompt: |
      Du hast eine Rampe in deiner Handy-Notiz geplant und damit eine Kugel schattiert. Statt eines gleichmäßigen Verlaufs zeigt die Kugel einen dunklen Ring zwischen Mitte und Licht. Finde die Zeile.
    lang: prose
    code: |
      1  H 255°  S 45 %  B 24 %
      2  H 235°  S 50 %  B 38 %
      3  H 215°  S 52 %  B 52 %
      4  H 195°  S 50 %  B 46 %
      5  H 175°  S 40 %  B 80 %
      6  H 160°  S 25 %  B 94 %
    lines: [4]
    hints:
      - Lies nur die Spalte B von oben nach unten.
    explanation: |
      Eine Rampe ist nach Helligkeit geordnet. Stufe 4 ist mit 46 % dunkler als Stufe 3 mit 52 %. Auf der Kugel liegt sie zwischen Mittelton und Licht, deshalb erscheint dort ein dunkler Ring. Farbton und Sättigung sind in Ordnung: Der Farbton wandert in eine Richtung um 15 bis 20° pro Stufe, die Sättigung gipfelt in der Mitte. Mit etwa 66 % passt Stufe 4 in die Reihe.
    resources:
      - title: Slynyrd · Pixelblog 1 · Color Palettes
        url: https://www.slynyrd.com/blog/2018/1/10/pixelblog-1-color-palettes

  - id: freund-feind-grau
    type: bug
    title: Im Graustufentest verschwindet der Gegner
    prompt: |
      Ein Farbplan für eine Testszene. Die Spielfigur steht fest. Im Graustufentest sind Spielfigur und Gegner nicht zu unterscheiden. Finde die Zeile, die du ändern musst.
    lang: prose
    code: |
      Boden: gedämpftes Grün, Leuchtdichte 0.10 bis 0.14.
      Spielfigur: Gelb #E8B04A, Leuchtdichte 0.487.
      Gegner: Hellblau #7FC4D8, Leuchtdichte 0.489.
      Gefahrenzone: Rot #C8463C mit dunkler Kontur.
      Schatten aller Figuren: kühles Violett statt Schwarz.
    lines: [3]
    hints:
      - Vergleiche die Leuchtdichten der beiden Figuren.
    explanation: |
      Gelb und Hellblau unterscheiden sich im Farbton stark und in der Leuchtdichte fast gar nicht, 0.487 gegen 0.489. In Graustufen und für viele Menschen mit Farbfehlsichtigkeit sind beide dasselbe. Weil die Spielfigur feststeht, bekommt der Gegner einen deutlich anderen Tonwert, zum Beispiel ein dunkles Blau, oder zusätzlich eine andere Form oder Kontur. Der Boden ist mit 0.10 bis 0.14 gedämpft und dunkler als beide Figuren, er trennt sich also von beiden.
    resources:
      - title: Chrome DevTools · Emulate vision deficiencies
        url: https://developer.chrome.com/docs/devtools/rendering/apply-effects#emulate_vision_deficiencies

  - id: tf2-farben-erklaeren
    type: explain
    title: Rot gegen Blau in Team Fortress 2
    prompt: |
      Erkläre in drei bis vier Sätzen, warum diese Entscheidungen Spielern helfen, schnell zu reagieren.
    lang: prose
    code: |
      Team Fortress 2 (Valve, 2007): Die Basen des roten Teams nutzen warme Farben, natürliche Materialien und kantige Formen, die des blauen Teams kühle Farben, Industriematerialien und rechtwinklige Formen. Gedämpfte Farben dominieren, gesättigt sind nur kleine Flächen. Die Umgebung ist gegenüber den Spielern entsättigt. Schatten gehen ins Kühle, nicht ins Schwarze. Als Lesereihenfolge gilt: Team über Farbe, Klasse über Silhouette, Waffe zuletzt.
    points:
      - Das Team ist die erste Frage (Freund oder Feind), deshalb trägt sie die auffälligste Eigenschaft, die Farbe.
      - Die entsättigte Umgebung lässt die Spieler hervortreten, weil die kräftigen Farben ihnen vorbehalten sind.
      - Farbe ist mit Formen gekoppelt, warm und kantig gegen kühl und rechtwinklig, sodass die Unterscheidung nicht am Farbton allein hängt.
      - Kühle statt schwarzer Schatten halten Farben auch im Schatten erkennbar.
    explanation: |
      Valve ordnet die Fragen eines Spielers nach Dringlichkeit und gibt der dringendsten die stärkste Eigenschaft: Freund oder Feind über die Farbe. Damit das funktioniert, darf die Umgebung nicht mit den Spielern konkurrieren, sie ist entsättigt und gedämpft. Die Teamfarbe steht nicht allein, sie hat eine eigene Formensprache, und das hilft auch dort, wo der Farbton nicht trägt. Kühle Schatten bewahren die Farbe dort, wo Schwarz sie auslöschen würde. Für ein eigenes Spiel übernimmst du die Methode, nicht die Farben.
    resources:
      - title: Jason Mitchell · Connecting Visuals to Gameplay at Valve (MIGS 2008)
        url: https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf

  - id: farben-aus-foto
    type: practice
    title: Fünf Farben aus einem Foto
    prompt: |
      Nimm ein Foto aus deiner Galerie, am besten draußen bei Sonne. Wähle fünf Farbflächen und beschreib jede mit drei Wörtern für Farbton, Sättigung und Helligkeit, etwa „Blauviolett, gedämpft, dunkel“. Ordne sie von dunkel nach hell. Sieh dir das Foto dann in Schwarzweiß an und prüf deine Reihenfolge.
    lang: prose
    starter: |
      1:
      2:
      3:
      4:
      5:
      Nach dem Schwarzweißtest:
    checklist:
      - Es sind fünf Farbflächen, jede mit einer Angabe zu Farbton, Sättigung und Helligkeit.
      - Die Liste ist von dunkel nach hell geordnet, bevor du das Foto in Schwarzweiß angesehen hast.
      - Du hast notiert, ob die Reihenfolge im Schwarzweißbild stimmt, und welche Fläche du falsch eingeschätzt hast.
      - Mindestens eine Notiz sagt, ob die Schatten im Foto kühler oder wärmer sind als das Licht.
    hints:
      - Wenn deine Galerie keinen Schwarzweißfilter hat, mach den Test später am PC mit Achromatopsia in Chromium.
    explanation: |
      Die Übung trainiert genau die Trennung aus der Lektion: Farbton und Tonwert sind zwei Urteile. Fast jeder schätzt dabei mindestens eine Fläche falsch ein, meist ein gesättigtes Blau als zu hell oder ein Gelb als zu dunkel. Die Notiz zur Temperatur der Schatten verbindet die Beobachtung mit dem Hue Shifting, das du in Rampen nachbaust.
    resources:
      - title: Saint11 · Basic Color Theory · Color Temperature
        url: https://saint11.art/pixel_art_articles/article6/#color-temperature

  - id: rampe-auf-papier
    type: practice
    title: Eine eigene Rampe und eine Kugel
    prompt: |
      Plane in einer Handy-Notiz eine Rampe von fünf Tönen in HSB-Zahlen, eine Zeile pro Stufe, mit Hue Shifting. Zeichne dann auf Karopapier eine Kugel von etwa 12 Kästchen Durchmesser mit einem Pfeil für die Lichtrichtung und schreib in jedes Kästchen die Nummer der Stufe, die es bekommt.
    lang: prose
    starter: |
      1  H     S     B
      2  H     S     B
      3  H     S     B
      4  H     S     B
      5  H     S     B
      Regel für die Sättigung:
    checklist:
      - Die Helligkeit B steigt von Stufe 1 bis 5 bei jeder Stufe.
      - Der Farbton verschiebt sich bei jeder Stufe in dieselbe Richtung, um höchstens 20°.
      - Die hellste Stufe hat eine niedrigere Sättigung als die Stufe darunter.
      - Unter der Rampe steht in einem Satz deine Regel für die Sättigung und nach welcher Quelle sie sich richtet.
      - Auf der Kugel liegt Stufe 5 auf der Seite des Lichtpfeils und Stufe 1 gegenüber.
    explanation: |
      Die Rampe in Zahlen ist ein Plan, den du später im Editor eins zu eins eintippst. Die Kugel prüft, ob fünf Stufen für eine runde Form reichen und wo die Grenzen liegen. Welcher Sättigungsregel du folgst, entscheidest du selbst. Wichtig ist, dass sie feststeht und für alle weiteren Rampen gilt.
    resources:
      - title: Pixelorama · Shading · Hue Shifting
        url: https://pixelorama.org/user_manual/shading/#hue-shifting
