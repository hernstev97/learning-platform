id: farbe-paletten
title: Farbe, Rampen und begrenzte Paletten
level: 2
minutes: 120
summary: Warum zwei verschiedene Farben in Graustufen dasselbe Grau ergeben können, wie du Farbrampen mit Hue Shifting baust und warum wenige Farben ein Bild zusammenhalten und lesbar machen – mit der relativen Leuchtdichte als Rechenhilfe.
place: unterwegs
goals:
  - Du beschreibst eine Farbe mit Farbton, Sättigung und Helligkeit und trennst ihren Tonwert von ihrem Farbton.
  - Du berechnest die relative Leuchtdichte nach WCAG und erkennst Farbpaare, die in Graustufen verschmelzen.
  - Du planst eine Farbrampe mit Hue Shifting, Schatten kühler und Lichter wärmer, und begründest den Verlauf der Sättigung.
  - Du erklärst, warum eine begrenzte Palette hilft, und liest fertige Paletten als Lernstoff.
  - Du planst Farbe für ein Spiel, gedämpfter Hintergrund gegen kräftige Figuren, und weißt, wie du Farbfehlsichtigkeit in Chromium prüfst.
