id: beobachten
title: Beobachten, Messen und Referenzen
level: 1
minutes: 90
summary: Warum du zeichnest, was du über einen Gegenstand weißt, statt was du siehst, und wie Konturzeichnen, Negativraum, Vergleichsmessen mit dem Stift und ehrlich genutzte Referenzen das ändern – mit einer Skizzenroutine für Bus und Bahn.
place: unterwegs
goals:
  - Du unterscheidest Symbolzeichnen von Beobachtungszeichnen und erkennst Symbole in deinen eigenen Skizzen.
  - Du zeichnest Konturen langsam nach Beobachtung und baust Formen über ihren Negativraum auf.
  - Du misst Verhältnisse und Winkel mit dem Stift und überträgst sie auf Karopapier.
  - Du sammelst und analysierst Referenzen und nutzt sie, ohne abzupausen oder Entwürfe zu übernehmen.
  - Du planst eine Skizzenroutine für unterwegs mit 2-Minuten-Thumbnails und der 50-%-Regel.
resources:
  - title: Ctrl+Paint · Visual Measuring
    url: https://www.ctrlpaint.com/videos/visual-measuring
  - title: Ctrl+Paint · Drawing Shape · Negative Space
    url: https://www.ctrlpaint.com/videos/drawing-shape-negative-space
  - title: Betty Edwards · Theory (fünf Wahrnehmungsfertigkeiten)
    url: https://www.drawright.com/theory
  - title: Drawabox · Lesson 0 · The 50 % Rule
    url: https://drawabox.com/lesson/0/2/50percent
  - title: Line of Action · zeitgesteuerte Referenzen
    url: https://line-of-action.com/
lesson: |
  Zeichne aus dem Kopf einen Stuhl von der Seite. Die meisten Anfänger zeichnen ein Rechteck als Sitz, vier Striche als Beine und ein Rechteck als Lehne. Jetzt stell dich neben einen echten Stuhl und sieh ihn von der Seite an. Du siehst zwei Beine, nicht vier, denn die vorderen verdecken die hinteren. Die Sitzfläche ist ein schmaler Streifen. Die Lehne steht schräg, und die Querstrebe sitzt tiefer, als du dachtest. Deine Zeichnung zeigt, was du über Stühle weißt. Sie zeigt nicht, was vor dir steht.

  In Pixelart wiegt das doppelt. Ein Sprite von 16 × 16 Pixeln hat Platz für wenige Entscheidungen, und jede beruht darauf, was du an einem Gegenstand gesehen hast. Dieses Modul übt das Sehen: Kanten verfolgen, Lücken zeichnen, Verhältnisse mit dem Stift messen und Referenzen nutzen, ohne sie abzupausen. Du brauchst einen Bleistift, ein kleines Heft, am besten mit Karos, und dein Handy für Referenzen und Timer.

  ## Symbol oder Beobachtung: was dein Kopf zeichnet

  Matt Kohr (Ctrl+Paint) beschreibt den Fehler vom Anfang: Anfänger zeichnen Symbole statt der Dinge vor ihnen, selbst wenn das Ding direkt im Blick ist. Sein Rat für Umrisse: „draw the unique contour you're observing, and not a generalized outline drawn from your memory“ ([Drawing Shape: Contour](https://www.ctrlpaint.com/videos/drawing-shape-contour)). Ein **Symbol** ist die Kurzform, die du als Kind gelernt hast: Auge als Mandel, Haus mit Spitzdach, Stuhl mit vier Beinen. **Beobachtungszeichnen** heißt, die Kurzform beiseitezulegen und nachzusehen.

  Betty Edwards zerlegt Zeichnen in fünf Wahrnehmungsfertigkeiten ([Theory](https://www.drawright.com/theory)): Kanten sehen („contour drawing“), Zwischenräume sehen („negative spaces“), Verhältnisse sehen („perspective and proportion“), Licht und Schatten sehen und das Ganze sehen. Die Seite begründet das mit einer Theorie über Hirnhälften, die heute als überholt gilt. Für die Übungen hier brauchst du nur die Liste. Dieses Modul übt die ersten drei Fertigkeiten, Licht und Schatten folgen in [Licht, Schatten und Tonwerte](/pixelart/licht-werte).

  Drawabox, ein freier Zeichenkurs von Irshad Karim, nennt drei Grundlagen: Strichführung, Beobachtung und räumliches Denken ([Lesson 0](https://drawabox.com/lesson/0)). Räumliches Denken übt das nächste Modul, [Grundkörper, Perspektive und Draufsicht](/pixelart/grundkoerper-raum).

  Warum zählt das in Pixeln? Pedro Medeiros (Saint11) zeigt in [Resizing](https://saint11.art/img/pixel-tutorials/Resizing.gif), was beim Verkleinern passiert: „as the resolution decreases you need to start choosing what details are important“. Auswählen kann nur, wer gesehen hat, was da ist.

  ## Kontur: langsam an der Kante entlang

  Konturzeichnen ist die erste Übung gegen Symbole. Dein Blick wandert langsam an einer Kante des Gegenstands entlang, und der Stift folgt im selben Tempo. Du schaust mehr auf den Gegenstand als auf das Papier. Kohr nennt Kontur „a linear approach to drawing, focusing on creating descriptive outlines“ (Quelle wie oben).

  Drei Regeln helfen:

  - **Langsam.** Eine Kante von einer Handbreite braucht eine halbe Minute. Schnelle Striche zeichnet dein Gedächtnis.
  - **Jede Richtungsänderung zählt.** Wo die Kante knickt, knickt der Strich. Wo sie hinter einer anderen verschwindet, hört der Strich auf.
  - **Schief ist erlaubt.** Verzerrte Proportionen sind bei dieser Übung normal. Sie trainiert das Hinsehen, nicht die fertige Zeichnung.

  Gute Motive für den Bus: deine eigene Hand, ein Schuh, ein Rucksack, die Haltestange mit ihren Gelenken. Menschen gegenüber zeichnest du nur, wenn es sie nicht stört.

  ## Negativraum: die Lücken zeichnen

  Der **Negativraum** ist der Raum um einen Gegenstand und zwischen seinen Teilen. Kohr schreibt, dass man einen Gegenstand oft am besten über den Raum um ihn herum sieht, und nennt den Negativraum genauso wichtig wie den Gegenstand selbst ([Drawing Shape: Negative Space](https://www.ctrlpaint.com/videos/drawing-shape-negative-space)).

  ![Drei Felder mit einem Stuhl in Seitenansicht. A zeigt die dunkle Kontur: senkrechte Lehne, die links in ein Bein übergeht, Sitz, Querstrebe und rechtes Bein. In B sind die beiden Lücken zwischen den Beinen orange gefüllt, eine zwischen Sitz und Querstrebe, eine zwischen Querstrebe und Boden. C zeigt nur die zwei orangen Rechtecke ohne Stuhl](/media/pixelart/beobachten/negativraum@2x.png "Kontur (A), Lücken gefüllt (B) und nur die Lücken (C). Eigenes Schaubild")

  In A siehst du einen Stuhl, und dein Kopf ergänzt sofort das Wort „Stuhl“. In B sind die Lücken zwischen den Beinen gefüllt: eine zwischen Sitz und Querstrebe, eine zwischen Querstrebe und Boden. In C stehen die Lücken allein. Für diese Formen hast du kein Symbol, also musst du hinsehen. Beide Rechtecke sind gleich groß und fast dreimal so breit wie hoch. Zeichnest du sie richtig, liegen Sitz, Querstrebe und Beine an ihren Kanten, und der Stuhl stimmt.

  > [!TIP] Lücken zuerst
  > Bei Stühlen, Fahrrädern, Pflanzen oder einer Hand mit gespreizten Fingern zeichnest du zuerst die größte Lücke. Danach die Nachbarlücken, dann die Teile dazwischen. Der Gegenstand entsteht als Rest.

  In Pixelart ist Negativraum sichtbar: Jedes leere Kästchen innerhalb einer Figur ist eine Entscheidung. Ob ein Arm am Körper klebt oder Luft dazwischen hat, entscheidet später, ob eine Pose lesbar ist. Das vertieft [Silhouette und Formensprache](/pixelart/silhouette-formsprache).

  ## Vergleichsmessen mit dem Stift

  Kohr fasst es so: „Drawing is at least 50% 'seeing'“ ([Visual Measuring](https://www.ctrlpaint.com/videos/visual-measuring)). Visuelles Messen gilt für Winkel und für Proportionen und braucht nur einen Stift ([Visual Measuring: Proportion](https://www.ctrlpaint.com/videos/visual-measuring-proportion)). Das Verfahren:

  1. Streck den Arm ganz aus und drück den Ellbogen durch. So bleibt der Abstand zwischen Auge und Stift bei jeder Messung gleich.
  2. Schließ ein Auge. Mit zwei Augen siehst du den Stift doppelt.
  3. Halte den Stift senkrecht, die Spitze an der oberen Kante einer Strecke, die du als **Einheit** wählst, etwa den Kopf einer Person oder die Höhe einer Tasse.
  4. Schieb den Daumen auf dem Stift bis zur unteren Kante.
  5. Vergleiche mit dieser Länge andere Strecken: Wie oft passt die Tassenhöhe in ihre Breite? Wie oft der Kopf in die ganze Figur?
  6. Schreib das Verhältnis auf und übertrage es aufs Papier.

  Für **Winkel** hältst du den Stift genau waagerecht oder senkrecht vor eine schräge Kante, etwa die Lehne. Schätz den Winkel zwischen Stift und Kante und übertrage ihn mit dem Heftrand als Bezug.

  > [!WARNING] Gleicher Arm, gleiche Ebene
  > Beugst du den Arm zwischen zwei Messungen, ändert sich die Einheit, und alle Verhältnisse stimmen nicht mehr. Kippst du den Stift zum Gegenstand hin, misst du eine verkürzte Strecke. Der Stift bleibt parallel zu deinem Gesicht.

  So sieht eine Messnotiz für eine Tasse aus:

  ```text
  Einheit: Tassenhöhe = 1
  Breite ohne Henkel   0,75
  Henkel               0,25 breit, 0,5 hoch
  Öffnung              Ellipse, 1/4 so hoch wie breit
  ```

  Auf Karopapier wird daraus ein Plan in Kästchen. Soll die Tasse 12 Kästchen hoch werden, ist sie ohne Henkel 9 breit, der Henkel 3 breit und 6 hoch. Damit bist du schon bei der Rechnung, die du in einem Sprite brauchst: Ein Kästchen ist ein Pixel. Menschen misst du in Kopfhöhen, mehr dazu in [Figur, Geste und Proportion](/pixelart/figur-proportion).

  > [!MERKE]
  > Verhältnisse vor Details. Erst stimmen Gesamthöhe, Gesamtbreite und die großen Lücken, dann kommen Henkel, Schrauben und Gesichter.

  ## Referenzen: Lernmaterial, keine Vorlage

  Eine **Referenz** ist ein Bild oder Gegenstand, den du beim Zeichnen ansiehst, um etwas zu verstehen. Referenzen sind kein Schummeln. Sie sind dein Lernmaterial. Drei Schritte:

  - **Sammeln.** Am besten eigene Fotos: ein Gegenstand aus mehreren Winkeln, mit Licht von einer Seite. Für Menschen und Tiere gibt es Seiten mit Fotos und Timer im Browser: [Line of Action](https://line-of-action.com/) bietet Figuren, Tiere, Gesichter und Hände, [Quickposes](https://quickposes.com/en) ist eine freie Bildsammlung für Posen mit selbst gewähltem Zeitlimit.
  - **Analysieren.** Schreib zu einer Referenz drei Beobachtungen: ein Verhältnis, einen Winkel, eine Lücke. Das ist eine Studie, kein fertiges Bild.
  - **Nutzen, ohne abzupausen.** Abpausen liefert eine genaue Linie, aber du hast dabei nichts gemessen und nichts entschieden. Die Hand folgt einer Kante, die dein Blick nicht verstanden hat. Zeichne neben die Referenz, nicht darauf.

  Für dein Spiel gilt eine zweite Grenze. Referenzen zeigen dir, wie ein Stuhl, ein Hund oder eine Rüstung gebaut ist. Den Entwurf machst du danach selbst. Eine abgezeichnete Figur aus einem anderen Spiel oder ein nachgezeichnetes Foto gehört nicht hinein.

  Dazu die Regel dieses Kurses: KI darf technische Arbeit beschleunigen, etwa ein Skript, das deine Referenzfotos nach Datum sortiert. Jede Zeichnung, jeder Entwurf und jedes Asset ist deine eigene Arbeit. Ein generiertes Bild ersetzt weder Referenz noch Entwurf. Es zeigt keinen echten Gegenstand, den du messen könntest, und keine Entscheidung, die du getroffen hast.

  Am PC legst du Referenzen neben die Leinwand statt darunter. Krita hat dafür das [Referenzbild-Werkzeug](https://docs.krita.org/en/reference_manual/tools/reference_images_tool.html).

  > [!PRAXIS]
  > Studios suchen eigene Entwürfe. Conradical Games verlangte von Bewerbern für eine Pixel-Artist-Stelle „A strong pixel art portfolio with unique creatures and characters“ ([Work With Indies](https://workwithindies.com/careers/conradical-games-pixel-artist)). Pine Creek Games nannte für 2D Artists „good knowledge of perspective“ und „Not using AI in their work“ als Muss ([Work With Indies](https://workwithindies.com/careers/pine-creek-games-2d-artist)). In beiden Anzeigen ist eigene Arbeit eine Bedingung, keine Stilfrage. Beobachtung ist das Material, aus dem eigene Entwürfe entstehen.

  ## Skizzenroutine im Bus

  Ein **Thumbnail** ist eine kleine, schnelle Skizze, etwa so groß wie eine Streichholzschachtel. Im Bus zeichnest du Thumbnails von zwei Minuten: Gesamtform, eine Einheit gemessen, die größte Lücke, fertig. Proko beschreibt Sitzungen für schnelle Figurenskizzen mit Posen „ranging from 30 seconds to 10 minutes“ ([How to Draw Gesture](https://www.proko.com/course-lesson/how-to-draw-gesture)). Zwei Minuten liegen am kurzen Ende und passen zwischen zwei Haltestellen.

  **Werkzeuge unterwegs.** Papier zuerst: ein Bleistift und ein Heft im Format A6, am besten mit 5-mm-Karos. Das Handy dient als Timer, Referenzquelle und Archiv; fotografier jede volle Seite. Krita gibt es für Android nur auf Tablets und Chromebooks, nicht auf Handys ([Krita FAQ](https://docs.krita.org/en/KritaFAQ.html#can-i-get-krita-for-ipad-or-for-android)), und Pixelorama nennt seine Android-Version „mostly meant to be used in tablets“ ([Installation](https://pixelorama.org/user_manual/installation/#android)). Für eine Handyskizze reicht eine Notiz-App mit Zeichenfunktion.

  **Die 50-%-Regel.** Drawabox teilt die Zeichenzeit in zwei Hälften: eine für Übungen und Studien, eine für Zeichnen um seiner selbst willen, ohne Lernziel ([The 50 % Rule](https://drawabox.com/lesson/0/2/50percent)). Wer nur übt, verliert die Lust. Wer nur frei zeichnet, wiederholt seine Symbole. Ein Wochenplan:

  ```text
  5 Busfahrten à 20 Minuten = 100 Minuten
  Studien   Kontur, Negativraum, Messen   50 min
  Frei      was du willst, ohne Regeln    50 min
  ```

  > [!INTERVIEW]
  > Im Portfolio-Gespräch fragt ein Art Lead: „Wie arbeitest du mit Referenzen?“ Gute Antwort: Du sammelst eigene Fotos und Posen-Referenzen, machst Studien mit Messungen und entwirfst danach ohne Vorlage. Du pausst nicht ab und nutzt keine generierten Bilder. Zeig dazu eine Studie neben dem Entwurf, der daraus entstand, nicht das ganze Skizzenheft. Das ArtStation Magazine rät Spiele-Artists „Taste over technique“ und „Delete half your portfolio.“ ([Top 10 Portfolio Tips](https://magazine.artstation.com/2019/03/games-portfolio-top-10/)). Auswahl ist Teil der Antwort.

  ## Häufige Fehler

  - **Aus dem Gedächtnis zeichnen, obwohl der Gegenstand vor dir steht.** Du erkennst es an Symbolen: vier Beine von der Seite, Mandelaugen, ein Henkel als Ohr.
  - **Mit Details anfangen.** Wer mit dem Henkel oder dem Auge beginnt, merkt spät, dass die Gesamtform nicht aufs Blatt passt.
  - **Arm beim Messen gebeugt.** Die Einheit ändert sich, und kein Verhältnis stimmt mehr.
  - **Nur den Gegenstand ansehen.** Die Lücken zeigen Fehler, die du am Gegenstand übersiehst.
  - **Abpausen statt messen.** Die Linie stimmt, aber du hast nichts gelernt, was du ohne Vorlage wiederholen kannst.
  - **Referenz als Asset-Vorlage.** Studien bleiben im Heft. Ins Spiel kommt dein eigener Entwurf.
  - **Thumbnails ohne Timer.** Ohne Zeitlimit wird aus einer Skizze ein Bild, und du schaffst eine statt sechs.
  - **Nur üben.** Ohne freies Zeichnen fehlt die Hälfte der 50-%-Regel.

  ## Zusammenfassung

  - Symbole zeigen, was du weißt. Beobachtung zeigt, was vor dir steht.
  - Konturzeichnen heißt: langsam der Kante folgen, mehr auf den Gegenstand als aufs Papier schauen.
  - Negativraum hat keinen Namen und kein Symbol. Deshalb siehst du ihn genauer als den Gegenstand.
  - Vergleichsmessen: Arm gestreckt, ein Auge zu, eine Einheit, alle anderen Strecken als Vielfache.
  - Verhältnisse vor Details. Auf Karopapier wird ein gemessenes Verhältnis direkt zu Kästchen, später zu Pixeln.
  - Referenzen sind Lernmaterial. Nicht abpausen, nicht ins Spiel übernehmen, nicht durch generierte Bilder ersetzen.
  - Unterwegs: 2-Minuten-Thumbnails, Papier zuerst, Handy für Timer und Referenzen, halb Studien, halb frei.
exercises:
  - id: symbol-oder-beobachtung
    type: choice
    title: Was hast du gesehen?
    prompt: |
      Du zeichnest den Rucksack auf dem Sitz gegenüber. Welche Notizen beruhen auf Beobachtung statt auf einem Symbol?
    options:
      - text: Die Schnalle sitzt etwa ein Drittel der Höhe über dem Sitz.
        correct: true
        why: Das ist ein gemessenes Verhältnis. Es gilt für genau diesen Rucksack in genau dieser Lage.
      - text: Der Tragegriff verschwindet links hinter der Kopfstütze.
        correct: true
        why: Du hast gesehen, wo eine Kante endet. Ein Symbol zeigt immer den ganzen Griff.
      - text: Rucksäcke sind Rechtecke mit zwei Riemen.
        correct: false
        why: Das ist Wissen über Rucksäcke im Allgemeinen, also ein Symbol. Es sagt nichts über die Form vor dir.
      - text: Ich zeichne beide Träger, weil jeder Rucksack zwei hat, auch wenn von hier nur einer zu sehen ist.
        correct: false
        why: Genau so entstehen die vier Stuhlbeine in der Seitenansicht. Was verdeckt ist, wird nicht gezeichnet.
    explanation: |
      Beobachtung erkennst du daran, dass sie nur für diesen Gegenstand aus diesem Blickwinkel gilt: ein Verhältnis, ein Winkel, eine verdeckte Kante. Symbole gelten für alle Rucksäcke und damit für keinen bestimmten. Ctrl+Paint beschreibt genau diesen Fehler: Anfänger zeichnen Symbole, selbst wenn der Gegenstand vor ihnen steht.
    resources:
      - title: Ctrl+Paint · Drawing Shape · Contour
        url: https://www.ctrlpaint.com/videos/drawing-shape-contour

  - id: negativraum-schaubild
    type: choice
    title: Was die Lücken verraten
    prompt: |
      Sieh dir das Schaubild an. Welche Aussagen treffen zu?

      ![Drei Felder mit einem Stuhl in Seitenansicht. A zeigt die Kontur, B dieselbe Kontur mit zwei orange gefüllten Lücken zwischen den Beinen, C nur die zwei orangen Rechtecke](/media/pixelart/beobachten/negativraum@2x.png "Kontur (A), Lücken gefüllt (B), nur die Lücken (C). Eigenes Schaubild")
    options:
      - text: In C siehst du Formen, für die du kein Symbol hast. Deshalb musst du ihre Breite und Höhe ansehen.
        correct: true
        why: Für „Stuhl“ hat dein Kopf eine Kurzform, für ein Rechteck zwischen zwei Streben nicht. Du zeichnest es, wie es ist.
      - text: Die Kanten der orangen Lücken sind zugleich Kanten von Sitz, Querstrebe und Beinen.
        correct: true
        why: Lücke und Gegenstand teilen sich ihre Grenzen. Stimmt die Lücke, liegen die Teile richtig.
      - text: Die untere Lücke zählt nicht als Negativraum, weil sie zum Boden hin offen ist.
        correct: false
        why: Negativraum ist jeder Raum um und zwischen den Teilen, offen oder geschlossen. Hier begrenzt der Boden die Lücke.
      - text: Negativraum hilft nur bei Möbeln mit geraden Kanten.
        correct: false
        why: Pflanzen, Hände mit gespreizten Fingern oder eine Figur mit Arm in der Hüfte haben genauso Lücken, oft sogar auffälligere.
    explanation: |
      Der Negativraum ist eine zweite Sicht auf denselben Gegenstand. Weil Lücken keinen Namen haben, drängt sich kein Symbol dazwischen, und du siehst ihre Form genauer. Zugleich teilen sie ihre Kanten mit dem Gegenstand. Wer die Lücken richtig zeichnet, bekommt den Gegenstand dazwischen umsonst.
    resources:
      - title: Ctrl+Paint · Drawing Shape · Negative Space
        url: https://www.ctrlpaint.com/videos/drawing-shape-negative-space

  - id: studie-ablauf
    type: order
    title: Eine Studie in zehn Minuten
    prompt: |
      Du zeichnest eine Beobachtungsstudie eines Gegenstands. Bring die Schritte in die Reihenfolge, die die Lektion empfiehlt.
    lang: prose
    lines: |
      Timer stellen und einen Gegenstand wählen, den du ganz sehen kannst.
      Eine Einheit wählen und das Verhältnis von Gesamthöhe zu Gesamtbreite mit dem Stift messen.
      Die Gesamtform als leichte Linie aufs Papier setzen.
      Die größten Lücken als eigene Formen einzeichnen.
      Die Konturen der Teile langsam und mit Blick auf den Gegenstand nachziehen.
      Details erst ergänzen, wenn Verhältnisse und Lücken stimmen.
    hints:
      - Was muss feststehen, damit die Zeichnung aufs Blatt passt?
    explanation: |
      Die Messung kommt vor dem ersten Strich, denn sie legt fest, wie groß die Gesamtform auf dem Papier wird. Die Lücken setzt du vor die Konturen, weil sie die Lage der Teile bestimmen. Details kommen zuletzt: Ein schön gezeichneter Henkel an einer zu schmalen Tasse ist verlorene Zeit.
    resources:
      - title: Ctrl+Paint · Visual Measuring · Proportion
        url: https://www.ctrlpaint.com/videos/visual-measuring-proportion

  - id: kopfhoehen-messen
    type: output
    title: Wie viele Köpfe?
    prompt: |
      Du misst eine stehende Person mit gestrecktem Arm. Wie viele Kopfhöhen ist sie groß? Antworte mit der Zahl.
    lang: text
    code: |
      Kopf auf dem Stift:    2 cm
      ganze Figur:          15 cm
      Arm gestreckt, ein Auge geschlossen
    expected: |
      7,5
    accept:
      - "7.5"
      - 7,5 Köpfe
      - 7,5 Kopfhöhen
      - 7.5 Köpfe
      - 7.5 Kopfhöhen
    explanation: |
      Der Kopf ist die Einheit, also teilst du: 15 ÷ 2 = 7,5. Die Zentimeter auf dem Stift sind keine echten Maße, sie hängen von deinem Abstand ab. Das Verhältnis bleibt gleich, solange der Arm gestreckt bleibt. 7,5 Köpfe ist der Durchschnitt, mit dem Proko arbeitet; einzelne Menschen weichen davon ab.
    resources:
      - title: Proko · Human Proportions · Average Figure
        url: https://www.proko.com/course-lesson/human-proportions-average-figure

  - id: tasse-uebertragen
    type: output
    title: Vom Stift aufs Karopapier
    prompt: |
      Du überträgst die Messung einer Tasse auf Karopapier. Wie viele Kästchen breit wird die Tasse ohne Henkel? Antworte mit der Zahl.
    lang: text
    code: |
      Tassenhöhe auf dem Stift:      4 cm  (Einheit)
      Breite ohne Henkel:            3 cm
      Auf Karopapier: Höhe 12 Kästchen
    expected: |
      9
    accept:
      - 9 Kästchen
      - 9 Pixel
      - 9 px
    hints:
      - Rechne erst das Verhältnis Breite zu Höhe aus.
    explanation: |
      Breite zu Höhe ist 3 : 4, also 0,75. Bei 12 Kästchen Höhe ergibt das 0,75 × 12 = 9 Kästchen. Die Zentimeter vom Stift überträgst du nie direkt, nur das Verhältnis. So wird aus einer Messung im Bus ein Plan, den du später Pixel für Pixel umsetzen kannst.
    resources:
      - title: Ctrl+Paint · Visual Measuring · Proportion
        url: https://www.ctrlpaint.com/videos/visual-measuring-proportion

  - id: luecken-zaehlen
    type: output
    title: Umschlossene Lücken
    prompt: |
      Das Raster zeigt einen Stuhl mit durchbrochener Lehne von der Seite, `#` ist Stuhl, `.` ist leer. Wie viele Lücken sind auf allen Seiten vom Stuhl umschlossen? Antworte mit der Zahl.
    lang: text
    code: |
      . # # # # # . . . . . .
      . # . . . # . . . . . .
      . # . . . # . . . . . .
      . # # # # # . . . . . .
      . # . . . . . . . . . .
      . # # # # # # # # # # .
      . # . . . . . . . . # .
      . # # # # # # # # # # .
      . # . . . . . . . . # .
      . # . . . . . . . . # .
    expected: |
      2
    accept:
      - zwei
      - 2 Lücken
    hints:
      - Prüf bei jeder leeren Fläche, ob du von ihr aus das Rasterende erreichst, ohne einen `#` zu überqueren.
    explanation: |
      Umschlossen sind das Loch in der Lehne (3 × 2 Pixel) und der Streifen zwischen Sitz und Querstrebe (8 × 1). Der Raum zwischen den Beinen ist nach unten offen und wird erst vom Boden begrenzt, der Raum rechts der Lehne nach oben und zur Seite. Auch diese offenen Flächen sind Negativraum, nur ohne geschlossene Form. Gerade die geschlossenen Lücken sind die Formen, die du beim Zeichnen zuerst und am genauesten misst.

  - id: begriffe-beobachten
    type: gap
    title: Die Wörter fürs Sehen
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Zeichnest du, was du über einen Gegenstand weißt, statt was du siehst, entsteht ein ⟦Symbol⟧. Den Raum um einen Gegenstand und zwischen seinen Teilen nennt man ⟦Negativraum⟧. Beim Messen mit dem Stift wählst du eine Strecke als ⟦Einheit⟧ und vergleichst andere Strecken damit. Ein Bild, das du beim Zeichnen ansiehst, um etwas zu verstehen, ist eine ⟦Referenz⟧. Eine kleine, schnelle Skizze heißt ⟦Thumbnail⟧.
    gaps:
      - label: Kurzform aus dem Gedächtnis
        hint: Auch ein Verkehrsschild ist eins.
        accept: ["Symbole", "Zeichen"]
      - label: Raum zwischen den Teilen
        hint: Auf Englisch „negative space“.
        accept: ["negative space", "Zwischenraum", "Negativform"]
      - label: Bezugsstrecke
        hint: Damit rechnest du, wie mit einem Meter.
        accept: ["Maßeinheit", "Maß"]
      - label: Bild zum Lernen
        hint: Wörtlich „Bezug“, ein Fremdwort.
        accept: ["Referenzbild", "reference"]
      - label: kleine Skizze
        hint: Englisch, wörtlich „Daumennagel“.
        accept: ["Thumbnails", "Daumenskizze"]
    explanation: |
      Mit diesen fünf Begriffen beschreibst du jede Beobachtungsstudie. Symbol und Negativraum sind Gegenspieler: Das eine kommt aus dem Gedächtnis, das andere hat keinen Namen und zwingt dich hinzusehen. Einheit und Referenz sind deine Werkzeuge, das Thumbnail ist das Format, in dem du unterwegs übst.
    resources:
      - title: Betty Edwards · Theory
        url: https://www.drawright.com/theory

  - id: referenz-abgepaust
    type: bug
    title: Genau, aber nichts gelernt
    prompt: |
      Lehrbeispiel: Arbeitsnotiz für eine Studie nach einem Foto. Die Zeichnung ist sehr genau geworden. Als du die Tasse am nächsten Tag ohne Foto zeichnen willst, weißt du nichts über ihre Verhältnisse. Finde die Zeile, die das erklärt.
    lang: prose
    code: |
      Foto der Tasse von der Seite aufnehmen, Licht von links.
      Handy neben das Heft legen, Foto so groß, dass der Henkel gut zu sehen ist.
      Papier auf das Display legen und die Kanten mit dem Bleistift nachfahren.
      Henkel und Öffnung sauber nachziehen.
      Zeichnung neben das Foto halten und Abweichungen notieren.
    lines: [3]
    hints:
      - In welcher Zeile misst und entscheidest du nichts?
    explanation: |
      Zeile 3 ist Abpausen. Die Hand folgt den Kanten auf dem Display, ohne dass du ein Verhältnis gemessen oder einen Winkel geschätzt hast. Deshalb bleibt nichts hängen. Zeichne neben das Foto, miss mit dem Stift oder am Bildschirm mit dem Daumen, und schreib das Verhältnis auf. Das Ergebnis wird ungenauer, aber du kannst es wiederholen.
    resources:
      - title: Ctrl+Paint · Visual Measuring
        url: https://www.ctrlpaint.com/videos/visual-measuring

  - id: messnotiz-stuhl
    type: bug
    title: Der Stuhl wird zum Turm
    prompt: |
      Messnotiz für einen Stuhl von der Seite, Einheit ist die Sitzhöhe vom Boden. Mit dem Stift hast du den ganzen Stuhl als knapp zweimal so hoch wie die Sitzhöhe gemessen. Auf dem Karopapier wird er aber 21 Kästchen hoch und wirkt wie ein Turm. Finde die Zeile.
    lang: text
    code: |
      Einheit      Sitzhöhe = 1 = 6 Kästchen
      Sitztiefe    0,8 = 5 Kästchen
      Lehne        0,9 über dem Sitz = 5 Kästchen
      Gesamthöhe   3,5 = 21 Kästchen
      Querstrebe   0,5 über dem Boden = 3 Kästchen
    lines: [4]
    hints:
      - Die Gesamthöhe ist Sitzhöhe plus Lehne über dem Sitz.
    explanation: |
      Sitzhöhe 1 plus Lehne 0,9 ergibt 1,9 Einheiten, also rund 11 Kästchen. Zeile 4 notiert 3,5 und widerspricht damit der eigenen Messung „knapp zweimal so hoch“. Solche Fehler fängst du ab, wenn du die Teilmaße am Ende zur Gesamthöhe addierst und mit der Messung vergleichst. Die übrigen Zeilen sind gerundet, aber stimmig: 0,8 × 6 = 4,8, 0,9 × 6 = 5,4.
    resources:
      - title: Ctrl+Paint · Visual Measuring · Proportion
        url: https://www.ctrlpaint.com/videos/visual-measuring-proportion

  - id: stuhl-aus-dem-kopf
    type: explain
    title: Zwei Stühle, ein Modell
    prompt: |
      Lehrbeispiel: zwei Zeichnungen desselben Küchenstuhls von der Seite. Erkläre in zwei bis vier Sätzen, woher die Unterschiede kommen und mit welchen Techniken aus der Lektion Zeichnung 2 entstanden sein kann.
    lang: prose
    code: |
      Zeichnung 1, aus dem Gedächtnis: Sitz als breites Rechteck, vier gleich lange Beine nebeneinander, Lehne als senkrechtes Rechteck.
      Zeichnung 2, nach Beobachtung: Sitz als schmaler Streifen, zwei Beine sichtbar, die hinteren verdeckt, Lehne leicht nach hinten geneigt, Querstrebe tiefer als in Zeichnung 1.
    points:
      - Zeichnung 1 zeigt Wissen über Stühle, also ein Symbol mit vier Beinen und flachem Sitz.
      - Von der Seite verdecken die vorderen Beine die hinteren, und die Sitzfläche ist zu einem Streifen verkürzt.
      - Die Neigung der Lehne und die Höhe der Querstrebe lassen sich mit dem Stift messen, als Winkel und als Verhältnis.
      - Die Lücken zwischen Sitz, Strebe und Beinen zeigen die Lage der Strebe, ohne dass das Wort „Stuhl“ dazwischenfunkt.
    explanation: |
      Zeichnung 1 ist das Symbol „Stuhl“: Sie zeigt alles, was ein Stuhl hat, aus keinem bestimmten Blickwinkel. Zeichnung 2 zeigt, was von der Seite zu sehen ist, mit verdeckten Beinen und verkürztem Sitz. Die Neigung der Lehne entsteht durch Winkelmessen mit dem waagerecht oder senkrecht gehaltenen Stift, die Lage der Querstrebe durch ein Verhältnis zur Sitzhöhe oder durch die Form der Lücken darunter. Keine der Techniken braucht Talent, nur Zeit zum Hinsehen.
    resources:
      - title: Ctrl+Paint · Drawing Shape · Contour
        url: https://www.ctrlpaint.com/videos/drawing-shape-contour

  - id: negativraum-studie
    type: practice
    title: Ein Gegenstand aus Lücken
    prompt: |
      Wähle einen Stuhl, einen Hocker, ein Fahrrad oder eine Pflanze mit großen Blättern. Zeichne in höchstens zehn Minuten auf Papier zuerst nur die Lücken als geschlossene Formen, erst danach die Teile des Gegenstands. Notiere darunter in Stichpunkten, was du gemessen hast.
    lang: prose
    starter: |
      Gegenstand:
      Zeit (Timer):
      Gemessene Lücke und Verhältnis:
      Abweichung beim Vergleich:
    checklist:
      - Du hast mindestens drei Lücken als eigene Formen gezeichnet, bevor du eine Kante des Gegenstands gezogen hast.
      - Der Timer zeigte am Ende höchstens zehn Minuten.
      - Mindestens eine Lücke hast du mit dem Stift vermessen und ihr Verhältnis von Breite zu Höhe notiert.
      - Du hast die Zeichnung neben den Gegenstand gehalten und eine Stelle notiert, an der sie abweicht.
    hints:
      - Fang mit der größten Lücke an, meist die zwischen Beinen oder Stamm und Blatt.
    explanation: |
      Die Reihenfolge zwingt dich, Formen ohne Namen zu sehen. Das Verhältnis einer Lücke ist eine Messung, die du nachprüfen kannst. Die notierte Abweichung zeigt dir, worauf du beim nächsten Mal achtest. Ob die Zeichnung schön ist, spielt keine Rolle; sie ist eine Studie.
    resources:
      - title: Ctrl+Paint · Drawing Shape · Negative Space
        url: https://www.ctrlpaint.com/videos/drawing-shape-negative-space

  - id: bus-thumbnails
    type: practice
    title: Sechs Thumbnails zwischen zwei Haltestellen
    prompt: |
      Zeichne auf einer Fahrt sechs Thumbnails von je zwei Minuten, jedes etwa so groß wie eine Streichholzschachtel. Motive sind Gegenstände in deiner Nähe: Tasche, Schuh, Haltestange, Fenstergriff, die eigene Hand. Stell für jedes den Timer am Handy. Schreib unter jedes Thumbnail ein gemessenes Verhältnis.
    lang: prose
    checklist:
      - Auf der Seite stehen sechs Thumbnails, jedes höchstens 5 × 5 cm groß.
      - Für jedes lief ein Timer von zwei Minuten, und du hast beim Signal aufgehört.
      - Unter jedem Thumbnail steht ein Verhältnis, das du mit dem Stift gemessen hast.
      - Bei mindestens zwei Thumbnails ist eine Lücke als eigene Form eingezeichnet.
      - Du hast die Seite fotografiert und das Foto mit Datum abgelegt.
    hints:
      - Wenn zwei Minuten zu kurz sind, zeichne kleiner, nicht länger.
    explanation: |
      Der Timer verhindert, dass aus einer Skizze ein Bild wird, an dem du hängen bleibst. Das gemessene Verhältnis unter jedem Thumbnail macht aus einer schnellen Zeichnung eine Beobachtung, die du später nachschlagen kannst. Die fotografierten Seiten zeigen dir nach ein paar Wochen, was sich verändert hat. Diese Fahrt zählt zur Studienhälfte der 50-%-Regel.
    resources:
      - title: Drawabox · Lesson 0 · The 50 % Rule
        url: https://drawabox.com/lesson/0/2/50percent

  - id: referenz-studie
    type: practice
    title: Drei Referenzen, eine Zeichnung ohne Vorlage
    prompt: |
      Wähle einen Gegenstand, den du für Spiele oft brauchst, zum Beispiel eine Kiste, ein Fass oder einen Eimer. Fotografiere ihn selbst aus drei Winkeln oder nimm Fotos, die du findest. Schreib zu jeder Referenz drei Beobachtungen. Leg die Fotos dann weg und zeichne den Gegenstand aus dem Kopf.
    lang: prose
    starter: |
      Gegenstand:
      Referenz 1 – Verhältnis, Winkel, Lücke:
      Referenz 2 – Verhältnis, Winkel, Lücke:
      Referenz 3 – Verhältnis, Winkel, Lücke:
      In der Zeichnung umgesetzt:
    checklist:
      - Du hast drei Referenzen aus verschiedenen Winkeln, mindestens eine davon ist ein eigenes Foto.
      - Zu jeder Referenz stehen drei Beobachtungen, darunter mindestens ein Verhältnis oder ein Winkel.
      - Die Zeichnung entstand ohne Blick auf die Fotos.
      - Du hast notiert, welche zwei Beobachtungen du in der Zeichnung umgesetzt hast.
      - Keine Referenz wurde abgepaust oder durch ein generiertes Bild ersetzt.
    hints:
      - Achte auf das, was dich überrascht hat, etwa wie tief ein Fassreifen sitzt.
    explanation: |
      Die Aufgabe trennt Referenz und Entwurf, wie du es für dein Spiel brauchst. Die Beobachtungen sind dein Wissen über den Gegenstand, die Zeichnung aus dem Kopf zeigt, was davon hängen geblieben ist. Ein eigenes Foto hat den Vorteil, dass du Licht und Winkel selbst gewählt hast und es frei nutzen kannst.
    resources:
      - title: Krita Docs · Reference Images Tool
        url: https://docs.krita.org/en/reference_manual/tools/reference_images_tool.html
