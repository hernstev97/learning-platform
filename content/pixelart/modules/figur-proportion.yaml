lesson: |
  Du zeichnest eine Figur, die eine schwere Kiste schiebt. Heraus kommt ein Mensch, der senkrecht neben der Kiste steht und die Arme nach vorn streckt, wie das Männchen auf einem Hinweisschild. Der Kopf hat vielleicht die richtige Größe, die Beine die richtige Länge. Trotzdem glaubt niemand, dass diese Figur Kraft aufwendet. Ihr fehlt die Geste: die eine Linie, entlang der sich der ganze Körper gegen die Kiste stemmt.

  Dieses Modul baut Figuren in drei Schichten auf: Geste, Gliederpuppe aus Grundkörpern, Proportion in Kopfeinheiten. Dann geht es um Gewicht im Stand und um die Frage, wie viel davon in ein Sprite von 24 Pixeln passt. Alles bleibt Standbild. Wie sich eine Figur bewegt, ist Thema des Animationskurses.

  ## Geste: die Handlungslinie zuerst

  Die **Handlungslinie** (line of action) ist die längste durchgehende Linie durch eine Pose. Proko beginnt jede Gestenzeichnung mit ihr: „Start by finding the longest action line of the body.“ Für die Form gibt es eine klare Grenze: „Don't use anything more complicated than a C curve, S curve, or straight.“ ([How to Draw Gesture](https://www.proko.com/course-lesson/how-to-draw-gesture))

  ![Zwei Gliederpuppen in hellem Grau mit orangefarbener Handlungslinie. A steht steif, die Linie läuft gerade und senkrecht vom Scheitel bis zwischen die Füße. B lehnt sich schräg nach vorn rechts, als schiebe sie etwas; die Linie ist eine C-Kurve vom Kopf oben rechts durch den Rumpf und das hintere Bein bis zum Fuß unten links, das vordere Bein ist gebeugt, die Arme greifen nach vorn](/media/pixelart/figur-proportion/handlungslinie@2x.png "Gerade, senkrechte Handlungslinie (A) und C-Kurve beim Schieben (B). Eigenes Schaubild")

  In A läuft die Linie senkrecht vom Scheitel zum Boden. Die Puppe steht still, und genau so liest man sie. In B folgt der ganze Körper einer C-Kurve vom Kopf bis zum hinteren Fuß. Das hintere Bein ist gestreckt und drückt, das vordere ist gebeugt, die Arme greifen nach vorn. Ohne ein Gesicht und ohne Kiste erkennst du: Diese Figur schiebt.

  Eine gerade Handlungslinie ist kein Fehler. Eine Wache, die stramm steht, darf gerade sein. Es soll nur eine Entscheidung sein und nicht das Ergebnis davon, dass du Kopf, Rumpf und Beine übereinandergestapelt hast.

  > [!MERKE]
  > Erst die Linie, dann der Körper. Eine Pose, die du nicht als Gerade, C- oder S-Kurve zeichnen kannst, hast du noch nicht entschieden.

  ## Die Gliederpuppe aus Grundkörpern

  Auf die Linie setzt du eine **Gliederpuppe** aus den Körpern, die du in [Grundkörper, Perspektive und Draufsicht](/pixelart/grundkoerper-raum) geübt hast:

  - **Kopf:** Ei oder Kugel.
  - **Brustkorb:** Ei oder abgerundete Kiste, die größte Masse.
  - **Becken:** Kiste oder Schale, kleiner als der Brustkorb.
  - **Arme und Beine:** Zylinder, die zum Ende schmaler werden.
  - **Gelenke:** Kugeln an Schulter, Ellbogen, Hüfte und Knie.
  - **Hände und Füße:** Keile oder flache Kisten.

  Brustkorb und Becken sind die zwei großen Massen. Die Wirbelsäule verbindet sie biegsam, sie können gegeneinander kippen und sich verdrehen. Genau dort steckt die Geste: Kippen Brustkorb und Becken in dieselbe Richtung wie ein Brett, wirkt die Figur steif.

  Muskeln brauchst du dafür nicht. Für kleine Sprites reichen Massen. Raymond Schlitter (Slynyrd) schreibt, dass die menschliche Form in Pixelart oft „stylized and deformed“ wird, rät aber trotzdem: „one should first understand the proper forms in order to make sensible abstractions“ ([Pixelblog 17](https://www.slynyrd.com/blog/2019/5/21/pixelblog-17-human-anatomy)). Anatomie lernst du also nach Bedarf, wenn eine Form nicht stimmt und du wissen willst, warum. Für später gibt es seinen Artikel zur realistischen Anatomie ([Pixelblog 49](https://www.slynyrd.com/blog/2024/3/25/pixelblog-49-realistic-human-anatomy)).

  ## Kopfeinheiten: Proportionen messen

  Proportionen misst man in **Kopfeinheiten**: Wie oft passt die Kopfhöhe in die ganze Figur? Prokos Lektion nach dem System des Anatomen Paul Richer setzt den Durchschnitt fest: „the average person is 7.5 heads tall“. Dazu gehören Landmarken in Kopfeinheiten vom Scheitel ([Human Proportions](https://www.proko.com/course-lesson/human-proportions-average-figure)):

  ```text
  Scheitel      0
  Kinn          1
  Brustwarzen   2
  Nabel         3
  Schambein     3,75  (halbe Höhe)
  Fußsohle      7,5
  ```

  Die Lektion sagt auch: „everyone's proportions are slightly different“. Die Zahlen sind ein Messband, kein Gesetz. Slynyrd stellt für Pixelart ein Modell mit 8 Köpfen für idealisierte erwachsene Männer vor und eines mit 6 Köpfen, das „fairly realistic“ und etwas niedlicher wirkt (Pixelblog 17).

  ![Drei Gliederpuppen auf hellem Grund, jede mit waagerechten Hilfslinien im Abstand einer Kopfhöhe. A ist schlank und 7,5 Köpfe hoch. B ist 4 Köpfe hoch, mit größerem Kopf und kürzeren Beinen. C ist 2,5 Köpfe hoch, der Kopf ist breiter als die Schultern, die Beine sind kurz. Alle drei stehen auf derselben Grundlinie](/media/pixelart/figur-proportion/kopfeinheiten@2x.png "7,5 Köpfe (A), 4 Köpfe (B) und 2,5 Köpfe (C, Chibi). Eigenes Schaubild")

  Das Schaubild zeigt drei Puppen mit Hilfslinien je Kopfhöhe. A ist 60 Pixel hoch und 7,5 Köpfe groß, also 8 Pixel pro Kopf. B ist 48 Pixel hoch und 4 Köpfe groß, 12 Pixel pro Kopf. C ist 30 Pixel hoch und 2,5 Köpfe groß, ebenfalls 12 Pixel pro Kopf. B und C haben gleich große Köpfe, aber C hat nur gut halb so viel Körper. Die Rechnung ist immer dieselbe:

  ```text
  Pixel pro Kopf = Figurhöhe ÷ Kopfzahl
  A   60 ÷ 7,5 =  8
  B   48 ÷ 4   = 12
  C   30 ÷ 2,5 = 12
  ```

  Mit diesem Werkzeug misst du in der Bahn eine stehende Person mit gestrecktem Arm, wie in [Beobachten, Messen und Referenzen](/pixelart/beobachten). Und du planst damit ein Sprite, bevor du den ersten Pixel setzt.

  ## Gewicht im Stand: Standbein und Schwerpunkt

  Eine Figur steht glaubhaft, wenn ihr Gewicht getragen wird. Proko erklärt das über den Schwerpunkt: Fällst du von der Körpermitte ein Lot auf den Boden, müssen die Füße „on that point or evenly spread around that point“ stehen ([How to Draw Balanced Poses](https://www.proko.com/course-lesson/how-to-draw-balanced-poses)). Steht jemand mit dem meisten Gewicht auf einem Bein, rückt der Schwerpunkt näher an diesen Fuß. Ruht das ganze Gewicht darauf, liegt er „directly above the supporting foot“.

  Das **Standbein** trägt, das **Spielbein** ist entlastet. Daraus folgt eine Gegenbewegung, die Proko beschreibt: Das Standbein drückt seine Beckenseite nach oben, die andere sinkt; der Brustkorb dreht in die Gegenrichtung, und die Schulterlinie kippt entgegengesetzt zur Beckenlinie. In der Kunstgeschichte heißt diese Haltung **Kontrapost**, „a human figure standing with most of its weight on one foot“, dessen Schultern und Arme gegen Hüfte und Beine verdreht sind ([Contrapposto](https://en.wikipedia.org/wiki/Contrapposto)).

  ```text
  Standbein links:
  Schulterlinie   links tiefer, rechts höher
  Beckenlinie     links höher,  rechts tiefer
  Lot vom Schwerpunkt  -> auf den linken Fuß
  ```

  > [!WARNING] Schultern und Becken kippen gegeneinander
  > Kippen beide Linien in dieselbe Richtung, sieht die Figur aus, als falle sie zur Seite. Prüf jede stehende Pose mit dem Stift als Lot: senkrecht vor die Zeichnung halten und schauen, ob die Linie vom Schwerpunkt den tragenden Fuß trifft.

  Im Bus hast du dafür ständig Modelle. Wer an der Haltestange steht, verlagert das Gewicht auf ein Bein. Zeichne nur so, dass es niemanden stört, und nur Haltung, keine Gesichter.

  ## Stilisierte Proportionen für kleine Sprites

  Rechne die realistischen Proportionen auf ein Sprite von 24 Pixeln um: 24 ÷ 7,5 = 3,2 Pixel pro Kopf. In drei Pixeln Kopfhöhe haben zwei Augen und ein Mund keinen Platz. Slynyrd schreibt dazu: „Going for realistic proportions at such a small size will result in a stick figure.“ Für Top-down-Figuren nennt er als Faustregel: „the head usually takes up a third to half of the total sprite“, und „The smaller the sprite the more condensed and abstracted the proportions tend to become.“ ([Pixelblog 22](https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites))

  Diese Verkürzung hat einen Namen. **Super deformed** oder **Chibi** bezeichnet Figuren, deren Kopf „normally anywhere between one third and one half the character's height“ misst ([Super deformed](https://en.wikipedia.org/wiki/Super_deformed#Appearance_and_media_usage)). Pedro Medeiros (Saint11) beschreibt Chibi-Figuren als „usually short (less than 4 heads)“ ([Cuteness](https://saint11.art/img/pixel-tutorials/Cuteness.gif)). Puppe C im Schaubild ist so eine Figur. Slynyrd begründet die großen Köpfe mit Ausdruck: „Big-headed, or doll-like features tend to read well and capture a lot of expression.“ (Pixelblog 17)

  Der große Kopf hat einen Preis. Derek Yu schreibt über kleine Sprites: „If your character has well defined arms and legs, the head will probably need to be smaller to make room for them.“ ([Pixel Art Tutorial](https://www.derekyu.com/makegames/pixelart.html#small_sprite)) Jeder Pixel, den der Kopf bekommt, fehlt den Gliedern. Größere Sprites haben mehr Spielraum: In Dead Cells ist die Figur im Spiel 50 Pixel hoch ([Game Developer](https://www.gamedeveloper.com/production/art-design-deep-dive-using-a-3d-pipeline-for-2d-animation-in-i-dead-cells-i-)).

  Proportionen sind auch ein Werkzeug, um Figuren zu unterscheiden. Valve trennt die Klassen in Team Fortress 2 in der „Read Hierarchy“ unter anderem über Silhouette, Proportionen und Waffe ([Connecting Visuals to Gameplay at Valve](https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf)). Mehr dazu in [Silhouette und Formensprache](/pixelart/silhouette-formsprache).

  > [!PRAXIS]
  > Slynyrd plant Top-down-Figuren vom Tile aus: „1 tile wide by 2 tiles tall is one of the most common sprite sizes“, bei 16-Pixel-Tiles also 16 × 32 Pixel. Innerhalb dieser Grenze gibt er Figuren verschiedene Höhen, um Männer, Frauen, Junge und Alte zu unterscheiden (Pixelblog 22). Die Proportion ist dort keine Frage von richtig oder falsch, sondern eine Festlegung für alle Figuren eines Spiels. Schreib sie auf: Spritehöhe, Kopfhöhe in Pixeln, Lage von Hüfte und Schulter.

  > [!INTERVIEW]
  > Im Art-Test eines Studios lautet die Aufgabe oft, eine neue Figur passend zu vorhandenen Sprites zu zeichnen. Gute Herangehensweise: Du misst zuerst die vorhandenen Figuren in Kopfeinheiten und Pixeln aus, also Spritehöhe, Kopfhöhe, Lage der Hüfte. Dann baust du die neue Figur mit genau diesen Maßen und erklärst, wo du bewusst abweichst, etwa einen Pixel größer für einen Anführer. Wer „sieht passend aus“ sagt, überzeugt weniger als jemand, der „Kopf 10 von 24 Pixeln, wie die anderen“ sagt.

  ## Gesten nach der Uhr

  Gesten übst du mit Zeitlimit, damit du gar nicht erst ins Detail kommst. Proko beschreibt Sitzungen mit Posen von 30 Sekunden bis 10 Minuten (How to Draw Gesture). [Line of Action](https://line-of-action.com/) und [Quickposes](https://quickposes.com/en) zeigen Fotos mit Timer im Browser. Ein Plan für eine Fahrt:

  ```text
  10 × 30 s   nur Handlungslinie
   5 × 60 s   Linie, Kopf, Brustkorb, Becken, Standbein
   2 × 2 min  ganze Gliederpuppe mit Kopfeinheiten
  ```

  Bei 30 Sekunden zeichnest du nur die Linie, nichts sonst. Das fühlt sich unfertig an und ist genau richtig. Wer in 30 Sekunden eine Hand zeichnet, hat die Pose verpasst.

  ## Häufige Fehler

  - **Körperteile gestapelt.** Kopf auf Rumpf auf Beine, jedes gerade. Erst die Handlungslinie, dann die Teile darauf.
  - **Komplizierte Linien.** Eine Handlungslinie mit drei Bögen ist keine. Gerade, C oder S.
  - **Brustkorb und Becken parallel.** Die Figur wird zum Brett. Die zwei Massen kippen gegeneinander.
  - **Schwerpunkt neben dem Fuß.** Die Figur kippt. Prüf mit dem Lot.
  - **Schambein falsch gesetzt.** Die halbe Höhe liegt beim Schambein. Wer den Nabel auf halbe Höhe legt, rückt das Schambein nach unten, und die Beine werden zu kurz.
  - **Realistische Proportionen in 24 Pixeln.** Der Kopf schrumpft auf drei Pixel. Kleine Sprites brauchen einen Kopf von einem Drittel bis zur Hälfte.
  - **Details vor der Geste.** Finger und Gesicht in einer 30-Sekunden-Skizze kosten die Pose.

  ## Zusammenfassung

  - Die Handlungslinie ist die längste Linie durch eine Pose: gerade, C- oder S-Kurve.
  - Die Gliederpuppe besteht aus Grundkörpern. Brustkorb und Becken sind zwei Massen, die gegeneinander kippen.
  - Proportionen misst man in Kopfeinheiten. Der Durchschnitt liegt bei 7,5 Köpfen, das Schambein auf halber Höhe.
  - Pixel pro Kopf = Figurhöhe ÷ Kopfzahl.
  - Im Stand liegt der Schwerpunkt über der Stützfläche. Mit Standbein kippen Schulter- und Beckenlinie gegeneinander.
  - Kleine Sprites brauchen große Köpfe: ein Drittel bis die Hälfte der Figur. Jeder Pixel für den Kopf fehlt den Gliedern.
  - Gesten übst du mit Timer, 30 Sekunden bis 2 Minuten, ohne Details.
exercises:
  - id: handlungslinie-schaubild
    type: choice
    title: Was die Linie erzählt
    prompt: |
      Sieh dir das Schaubild an. Welche Aussagen treffen zu?

      ![Zwei Gliederpuppen mit orangefarbener Handlungslinie. A steht steif mit senkrechter, gerader Linie. B lehnt sich schräg nach vorn rechts, die Linie ist eine C-Kurve vom Kopf bis zum hinteren Fuß](/media/pixelart/figur-proportion/handlungslinie@2x.png "Zwei Handlungslinien. Eigenes Schaubild")
    options:
      - text: In B läuft eine C-Kurve vom Kopf bis zum gestreckten hinteren Fuß. Deshalb liest man die Pose als Schieben.
        correct: true
        why: Der ganze Körper folgt einer Richtung, das hintere Bein drückt. Die Geste trägt die Aussage, nicht ein Detail.
      - text: Die gerade Linie in A passt zu einer Figur, die bewusst still und aufrecht steht.
        correct: true
        why: Eine Gerade ist erlaubt, wenn sie gewollt ist, etwa bei einer Wache. Sie liest sich als Stillstand.
      - text: Eine gute Handlungslinie hat mehrere Bögen, damit die Pose lebendig wirkt.
        correct: false
        why: Proko begrenzt sie auf Gerade, C- oder S-Kurve. Mehr Bögen machen die Pose unklar.
      - text: B ist falsch, weil der Kopf nicht über den Füßen steht.
        correct: false
        why: Wer schiebt, stützt sich auf das, was er schiebt. Die Neigung ist die Aussage der Pose.
    explanation: |
      Die Handlungslinie fasst eine Pose in einer Linie zusammen. In A steht sie senkrecht, die Puppe ruht. In B biegt sie sich zu einem C, und alle Teile ordnen sich ihr unter: gestrecktes hinteres Bein, gebeugtes vorderes, Arme nach vorn. So erkennt man die Absicht der Figur, bevor ein einziges Detail gezeichnet ist.
    resources:
      - title: Proko · How to Draw Gesture
        url: https://www.proko.com/course-lesson/how-to-draw-gesture

  - id: standbein-pruefen
    type: choice
    title: Gewicht auf einem Bein
    prompt: |
      Eine Figur steht mit dem meisten Gewicht auf dem linken Bein. Welche Aussagen stimmen?
    options:
      - text: Die linke Beckenseite steht höher als die rechte.
        correct: true
        why: Das Standbein drückt seine Beckenseite nach oben, die Seite des Spielbeins sinkt.
      - text: Die Schulterlinie kippt entgegengesetzt zur Beckenlinie, links steht die Schulter also tiefer.
        correct: true
        why: Der Brustkorb dreht in die Gegenrichtung zum Becken. Daraus entsteht der Kontrapost.
      - text: Ein Lot vom Schwerpunkt fällt zwischen die Füße, näher am linken als am rechten.
        correct: true
        why: Proko beschreibt genau das, wenn das meiste Gewicht links liegt. Der Schwerpunkt liegt dann näher am linken Fuß. Direkt über einem Fuß steht er erst, wenn dieser das ganze Gewicht trägt.
      - text: Schultern und Becken kippen in dieselbe Richtung, damit die Figur gerade bleibt.
        correct: false
        why: Gleich gekippte Linien lassen die Figur seitlich wegkippen. Die Linien laufen gegeneinander.
    explanation: |
      Gewicht auf einem Bein ist die häufigste Haltung im Stehen. Das Becken folgt dem Standbein nach oben, der Brustkorb gleicht in der Gegenrichtung aus, und der Schwerpunkt wandert über den tragenden Fuß. Proko beschreibt diese Kette im Kapitel über ausbalancierte Posen. Prüf sie mit dem Stift als Lot.
    resources:
      - title: Proko · How to Draw Balanced Poses
        url: https://www.proko.com/course-lesson/how-to-draw-balanced-poses

  - id: puppe-aufbauen
    type: order
    title: Eine Figur in 60 Sekunden
    prompt: |
      Du zeichnest eine Pose von Quickposes in 60 Sekunden. Bring die Schritte in die Reihenfolge der Lektion.
    lang: prose
    lines: |
      Die längste Handlungslinie als Gerade, C- oder S-Kurve ziehen.
      Den Kopf als Ei an ein Ende der Linie setzen.
      Brustkorb und Becken als zwei Massen auf die Linie setzen, gegeneinander gekippt.
      Arme und Beine als Zylinder von den Gelenken aus ansetzen.
      Mit dem Stift als Lot prüfen, ob der Schwerpunkt über dem tragenden Fuß liegt.
    hints:
      - Die Prüfung braucht Füße, die schon gezeichnet sind.
    explanation: |
      Die Linie legt fest, was die Pose aussagt, alles andere hängt sich daran. Kopf, Brustkorb und Becken sind die großen Massen und kommen vor den Gliedern. Die Lotprüfung steht am Ende, weil sie Füße und Rumpf braucht. Liegt der Schwerpunkt daneben, korrigierst du die Linie, nicht die Füße allein.
    resources:
      - title: Quickposes
        url: https://quickposes.com/en

  - id: kopf-in-pixeln
    type: output
    title: Wie viele Pixel pro Kopf?
    prompt: |
      Ein Sprite ist 32 Pixel hoch und 4 Köpfe groß. Wie viele Pixel hoch ist der Kopf? Antworte mit der Zahl.
    lang: text
    code: |
      Spritehöhe:  32 px
      Kopfzahl:    4
    expected: |
      8
    accept:
      - 8 px
      - 8 Pixel
    explanation: |
      Pixel pro Kopf = Figurhöhe ÷ Kopfzahl, also 32 ÷ 4 = 8. Das ist ein Viertel der Figur, kleiner als Slynyrds Faustregel von einem Drittel bis zur Hälfte für kleine Top-down-Sprites. Bei 32 Pixeln Höhe ist das vertretbar, weil Arme und Beine mehr Platz bekommen. Ob dir 8 Pixel für das Gesicht reichen, prüfst du an einer Skizze.
    resources:
      - title: Slynyrd · Pixelblog 22 · Top Down Character Sprites
        url: https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites

  - id: chibi-spanne
    type: output
    title: Wie groß darf der Kopf werden?
    prompt: |
      Ein Sprite ist 24 Pixel hoch. Der Kopf soll nach Slynyrds Faustregel ein Drittel bis die Hälfte der Figur einnehmen. Welche Kopfhöhen in Pixeln kommen in Frage? Antworte mit der kleinsten und größten Zahl, etwa „5 bis 7“.
    lang: text
    code: |
      Spritehöhe:  24 px
      Kopf:        1/3 bis 1/2 der Höhe
    expected: |
      8 bis 12
    accept:
      - 8-12
      - 8 - 12
      - 8–12
      - 8 – 12
      - 8 bis 12 px
      - 8 bis 12 Pixel
      - zwischen 8 und 12
      - 8 und 12
    explanation: |
      24 ÷ 3 = 8 und 24 ÷ 2 = 12. Ein Kopf von 8 bis 12 Pixeln lässt Platz für Augen, Brauen und Mund. Mit realistischen 7,5 Köpfen wären es nur 3,2 Pixel. Innerhalb der Spanne entscheidest du: Mehr Kopf heißt mehr Ausdruck, aber kürzere Glieder.
    resources:
      - title: Wikipedia · Super deformed · Appearance and media usage
        url: https://en.wikipedia.org/wiki/Super_deformed#Appearance_and_media_usage

  - id: nabel-hoehe
    type: output
    title: Wo sitzt der Nabel?
    prompt: |
      Puppe A im Schaubild ist 60 Pixel hoch und 7,5 Köpfe groß. Nach Prokos Landmarken liegt der Nabel 3 Kopfeinheiten unter dem Scheitel. Wie viele Pixel liegt er unter dem Scheitel? Antworte mit der Zahl.
    lang: text
    code: |
      Figurhöhe:  60 px
      Kopfzahl:   7,5
      Nabel:      3 Köpfe unter dem Scheitel
    expected: |
      24
    accept:
      - 24 px
      - 24 Pixel
      - 24 Pixel tiefer
    hints:
      - Rechne zuerst aus, wie viele Pixel ein Kopf hat.
    explanation: |
      60 ÷ 7,5 = 8 Pixel pro Kopf, 3 × 8 = 24. Der Nabel sitzt also 24 Pixel unter dem Scheitel, das Schambein bei 3,75 × 8 = 30, genau auf halber Höhe. Mit diesen Landmarken legst du die Hilfslinien eines Sprites fest, bevor du die Figur zeichnest.
    resources:
      - title: Proko · Human Proportions · Average Figure
        url: https://www.proko.com/course-lesson/human-proportions-average-figure

  - id: begriffe-figur
    type: gap
    title: Wörter für die Figur
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Die längste durchgehende Linie durch eine Pose heißt ⟦Handlungslinie⟧. Proportionen misst man in ⟦Kopfeinheiten⟧. Das Bein, das das Gewicht trägt, ist das ⟦Standbein⟧. Eine Figur steht sicher, wenn ihr ⟦Schwerpunkt⟧ über der Stützfläche liegt. Die Haltung, bei der Schultern und Becken gegeneinander kippen, heißt ⟦Kontrapost⟧. Figuren mit einem Kopf von einem Drittel bis zur Hälfte der Körperhöhe nennt man ⟦Chibi⟧.
    gaps:
      - label: längste Linie
        hint: Auf Englisch „line of action“.
        accept: ["line of action", "Aktionslinie", "Bewegungslinie"]
      - label: Maßeinheit
        hint: Die Höhe eines Körperteils dient als Lineal.
        accept: ["Kopfhöhen", "Köpfen", "Kopfeinheit", "Kopflängen"]
      - label: tragendes Bein
        hint: Sein Gegenstück heißt Spielbein.
        accept: ["Stützbein"]
      - label: Lotpunkt
        hint: Physik, der Punkt, an dem man einen Körper balancieren könnte.
        accept: ["Körperschwerpunkt", "center of gravity", "Massenmittelpunkt"]
      - label: Gegenbewegung
        hint: Italienisch „contrapposto“.
        accept: ["contrapposto", "Kontrapposto"]
      - label: großer Kopf
        hint: Japanisch, auch „super deformed“ genannt.
        accept: ["super deformed", "SD", "Chibis"]
    explanation: |
      Handlungslinie und Kopfeinheit sind deine Werkzeuge für Geste und Maß. Standbein, Schwerpunkt und Kontrapost beschreiben, wie ein Körper sein Gewicht trägt. Chibi ist der Name für die gestauchten Proportionen, die kleine Sprites oft brauchen.
    resources:
      - title: Wikipedia · Contrapposto
        url: https://en.wikipedia.org/wiki/Contrapposto

  - id: kurze-beine
    type: bug
    title: Die Beine sind zu kurz
    prompt: |
      Lehrbeispiel: Landmarken für eine Figur mit 7,5 Köpfen. Nach dieser Notiz gezeichnet, wirkt der Rumpf viel zu lang und die Beine zu kurz. Finde die Zeile.
    lang: prose
    code: |
      Einheit: Kopfhöhe, Figur 7,5 Köpfe.
      Kinn: 1 Kopf unter dem Scheitel.
      Brustwarzen: 2 Köpfe unter dem Scheitel.
      Nabel: 3 Köpfe unter dem Scheitel.
      Schambein: 5 Köpfe unter dem Scheitel.
      Fußsohle: 7,5 Köpfe unter dem Scheitel.
    lines: [5]
    hints:
      - Wo liegt die halbe Höhe der Figur?
    explanation: |
      Das Schambein liegt bei der durchschnittlichen Figur auf halber Höhe, also bei 3,75 Köpfen. Die Notiz setzt es bei 5. Dann bleiben für die Beine nur 2,5 statt 3,75 Köpfe, und der Rumpf wächst um mehr als einen Kopf. Prüf Landmarken immer gegen die halbe Höhe, das ist die verlässlichste.
    resources:
      - title: Proko · Human Proportions · Average Figure
        url: https://www.proko.com/course-lesson/human-proportions-average-figure

  - id: schief-statt-locker
    type: bug
    title: Die Figur kippt zur Seite
    prompt: |
      Lehrbeispiel: Posennotiz für eine Figur, die locker auf einem Bein steht. Gezeichnet wirkt sie, als kippe sie zur Seite. Finde die Zeile.
    lang: prose
    code: |
      Gewicht auf dem rechten Bein.
      Rechte Beckenseite höher als die linke.
      Rechte Schulter höher als die linke.
      Schwerpunkt senkrecht über dem rechten Fuß.
      Linkes Knie leicht gebeugt, Fuß locker aufgesetzt.
    lines: [3]
    hints:
      - Vergleiche die Neigung von Becken und Schultern.
    explanation: |
      Becken und Schultern kippen in Zeile 2 und 3 in dieselbe Richtung, die ganze Figur neigt sich wie ein Brett. Im Kontrapost dreht der Brustkorb gegen das Becken: Steht die rechte Beckenseite höher, steht die rechte Schulter tiefer. Diese Gegenbewegung hält den Schwerpunkt über dem Standbein und lässt die Haltung locker wirken.
    resources:
      - title: Proko · How to Draw Balanced Poses
        url: https://www.proko.com/course-lesson/how-to-draw-balanced-poses

  - id: grosse-koepfe
    type: explain
    title: Warum so viel Kopf?
    prompt: |
      Lehrbeispiel: zwei Entwürfe für dieselbe Figur in einem Top-down-Spiel. Erkläre in drei bis fünf Sätzen, warum Entwurf 2 für ein Sprite dieser Größe die bessere Grundlage ist und was er dafür aufgibt.
    lang: text
    code: |
      Spritehöhe 24 px
      Entwurf 1: 7,5 Köpfe -> Kopf 3 px,
                 Arme und Beine lang und dünn
      Entwurf 2: 2,5 Köpfe -> Kopf 10 px,
                 Rumpf kurz, Beine 5 px
    points:
      - Bei 7,5 Köpfen bleiben in 24 Pixeln rund 3 Pixel für den Kopf, zu wenig für Augen und Mund; die Figur wird zum Strichmännchen.
      - Kleine Sprites brauchen einen Kopf von einem Drittel bis zur Hälfte der Höhe; 10 von 24 Pixeln liegt in dieser Spanne.
      - Große Köpfe lesen sich gut und tragen Ausdruck.
      - Der Preis sind kurze Glieder; jeder Pixel für den Kopf fehlt Armen und Beinen.
    explanation: |
      Realistische Proportionen lassen in 24 Pixeln rund drei Pixel für den Kopf, und Slynyrd warnt, dass so ein Strichmännchen entsteht. Entwurf 2 gibt dem Kopf 10 Pixel, gut 40 Prozent der Höhe, und liegt damit in der Spanne von einem Drittel bis zur Hälfte, die Slynyrd und die Wikipedia für solche Figuren nennen. Ein großer Kopf liest sich gut und trägt Ausdruck. Dafür werden Rumpf und Beine kurz, wie Derek Yu für kleine Sprites beschreibt: Mehr Kopf heißt weniger Platz für deutliche Arme und Beine.
    resources:
      - title: Slynyrd · Pixelblog 17 · Human Anatomy
        url: https://www.slynyrd.com/blog/2019/5/21/pixelblog-17-human-anatomy

  - id: gesten-timer
    type: practice
    title: Fünfzehn Gesten nach der Uhr
    prompt: |
      Öffne Line of Action oder Quickposes am Handy und zeichne auf Papier zehn Posen à 30 Sekunden und fünf Posen à 60 Sekunden. Bei 30 Sekunden zeichnest du nur die Handlungslinie, bei 60 Sekunden Linie, Kopf, Brustkorb, Becken und Standbein.
    lang: prose
    checklist:
      - Auf deinen Seiten stehen fünfzehn Skizzen, zehn davon nur als Linie.
      - Jede Handlungslinie ist eine Gerade, eine C- oder eine S-Kurve, und du hast sie danebengeschrieben.
      - Bei jeder 60-Sekunden-Skizze ist das Standbein markiert, oder du hast notiert, dass beide Beine tragen.
      - Keine Skizze enthält Gesicht, Finger oder Kleidungsfalten.
      - Du hast den Timer der Seite genutzt und bei jedem Wechsel aufgehört.
    hints:
      - Such zuerst die Linie vom Kopf bis zum Fuß, der das Gewicht trägt.
    explanation: |
      Das Zeitlimit nimmt dir die Wahl, ins Detail zu gehen. Die Beschriftung als Gerade, C oder S zwingt dich, die Pose zu entscheiden, statt sie abzuzeichnen. Das markierte Standbein verbindet Geste und Gewicht. Wiederhole die Übung über mehrere Fahrten und vergleiche die ersten mit den letzten Seiten.
    resources:
      - title: Line of Action
        url: https://line-of-action.com/

  - id: puppe-zwei-proportionen
    type: practice
    title: Eine Puppe, zwei Proportionen
    prompt: |
      Zeichne auf Karopapier dieselbe stehende Gliederpuppe zweimal nebeneinander. A realistisch: 30 Kästchen hoch, 7,5 Köpfe. B stilisiert für ein Sprite: 24 Kästchen hoch, Kopf ein Drittel bis die Hälfte. Zieh zuerst die Hilfslinien für jede Kopfhöhe und die Landmarken.
    lang: prose
    starter: |
      A – Kästchen pro Kopf:
      A – Nabel in Reihe:
      A – Schambein in Reihe:
      B – Kopfhöhe in Kästchen:
      B – was weggefallen ist:
    checklist:
      - A hat Hilfslinien alle 4 Kästchen, und das Schambein liegt in Reihe 15.
      - Der Kopf von B ist 8 bis 12 Kästchen hoch.
      - Bei beiden stehen die Füße auf derselben Grundlinie, und ein Lot vom Schwerpunkt trifft die Stützfläche.
      - Brustkorb und Becken sind bei beiden als eigene Massen erkennbar.
      - Du hast notiert, welche Teile in B kürzer oder weggefallen sind.
    hints:
      - 30 Kästchen ÷ 7,5 Köpfe ergibt die Höhe eines Kopfes.
    explanation: |
      A übt die Landmarken, B die Entscheidung für ein kleines Sprite. Weil beide nebeneinanderstehen, siehst du, wo die Pixel hingehen: in den Kopf, weg von Rumpf und Beinen. Die Notiz zu dem, was wegfällt, ist dieselbe Arbeit, die du später in [Vom Entwurf zum Sprite](/pixelart/sprite-entwerfen) machst.
    resources:
      - title: Slynyrd · Pixelblog 22 · Top Down Character Sprites
        url: https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites

  - id: standbein-im-bus
    type: practice
    title: Wer steht auf welchem Bein?
    prompt: |
      Zeichne in Bus oder Bahn fünf stehende Menschen als Gliederpuppe, je höchstens eine Minute, unauffällig und ohne Gesichter. Markiere bei jeder Skizze Standbein, Schulterlinie, Beckenlinie und das Lot vom Schwerpunkt.
    lang: prose
    checklist:
      - Es gibt fünf Skizzen, jede in höchstens einer Minute gezeichnet.
      - Bei jeder ist das Standbein markiert, oder du hast notiert, dass beide Beine tragen.
      - Schulter- und Beckenlinie sind eingezeichnet, und daneben steht, ob sie gegeneinander oder gleich kippen.
      - Bei jeder Skizze fällt ein senkrechtes Lot vom Schwerpunkt auf den Boden, und du hast notiert, welchen Fuß es trifft.
      - Keine Skizze zeigt ein Gesicht oder ein Merkmal, an dem man die Person erkennen könnte.
    hints:
      - Menschen an der Haltestange tragen oft mit einem Bein und lehnen sich mit dem Arm an. Die Stange ist dann eine zweite Stütze.
    explanation: |
      Echte Menschen bestätigen oder widerlegen die Regeln der Lektion. Wer sich festhält, hat eine dritte Stütze, und der Schwerpunkt darf weiter vom Fuß weg liegen. Notier solche Fälle, sie sind keine Fehler. Der Verzicht auf Gesichter schützt die Menschen, die du zeichnest, und lenkt deinen Blick auf die Haltung.
    resources:
      - title: Proko · How to Draw Balanced Poses
        url: https://www.proko.com/course-lesson/how-to-draw-balanced-poses
