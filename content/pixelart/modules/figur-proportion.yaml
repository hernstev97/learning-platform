id: figur-proportion
title: Figur, Geste und Proportion
level: 1
minutes: 110
summary: Wie du eine Figur von der Handlungslinie über eine Gliederpuppe aus Grundkörpern bis zu messbaren Proportionen in Kopfeinheiten aufbaust, wie sie im Stand ihr Gewicht trägt und warum kleine Sprites große Köpfe haben – alles als Standbild, mit Stift und Papier.
place: unterwegs
goals:
  - Du findest die Handlungslinie einer Pose und zeichnest sie als Gerade, C- oder S-Kurve.
  - Du baust eine Figur als Gliederpuppe aus Grundkörpern auf, mit Brustkorb und Becken als zwei Massen.
  - Du misst und planst Proportionen in Kopfeinheiten und rechnest sie in Pixel um.
  - Du zeichnest eine stehende Figur mit Standbein und Schwerpunkt über der Stützfläche.
  - Du begründest stilisierte Proportionen für kleine Sprites mit dem Platz, den Gesicht und Glieder brauchen.
