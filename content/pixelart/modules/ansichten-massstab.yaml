id: ansichten-massstab
title: Ansichten, Maßstab und große Kreaturen
level: 3
minutes: 140
summary: Wie du dieselbe Figur von vorn, von der Seite und von hinten zeichnest, ohne dass sie beim Drehen springt, wie eine Maßstabstabelle Figuren, Requisiten und Bosse zusammenhält und warum eine große Kreatur dieselbe Pixelgröße braucht wie alles andere im Bild.
place: pc
goals:
  - Du zeichnest eine Figur in vier Richtungen und entscheidest, wo Spiegeln Arbeit spart und wo Asymmetrie es verbietet.
  - Du legst ein Modellblatt mit Hilfslinien für Kopf, Augen, Schultern, Hüfte und Füße an und hältst die Höhen über alle Ansichten.
  - Du stellst eine Maßstabstabelle für Figur, Tür, Kiste, Tile, Gegner und Boss auf und rechnest Größen in Pixel um.
  - Du erkennst gemischte Pixelgrößen (Mixels) und erklärst, warum nur gleiche Pixelgröße und ganzzahlige Vergrößerung ein Bild zusammenhalten.
  - Du konstruierst eine große Kreatur aus Grundkörpern, mit Clustern in der Größe der kleinen Sprites und einem klaren Blickpunkt.
  - Du planst Teile einer großen Kreatur, die später einzeln bewegt werden, in getrennten Ebenen.
