lesson: |
  Du hast deine Figur von vorn gezeichnet, 24 Pixel hoch. Dann die Seitenansicht. Nebeneinandergestellt ist die Seite plötzlich einen Pixel größer, die Hüfte sitzt eine Reihe tiefer, und die Tasche hängt auf der falschen Schulter. Im Spiel springt die Figur bei jeder Drehung. Später kommt ein Gegner dazu, so groß wie ein Schuppen, den du in halber Auflösung gezeichnet und verdoppelt hast. Neben der Figur wirkt er wie aus einem anderen Spiel.

  Dieses Modul hält Figuren über Ansichten und Größen zusammen: mehrere Richtungen, ein Modellblatt, eine Maßstabstabelle, gleiche Pixeldichte und große Kreaturen. Es setzt [Vom Entwurf zum Sprite](/pixelart/sprite-entwerfen) voraus. Du arbeitest im Pixel-Editor, Pixelorama oder LibreSprite kostenlos, Aseprite, wenn du es hast. Bedienschritte stehen in eigenen Absätzen mit **Bedienung**.

  ## Vier Richtungen: vorn, Seite, hinten und das Spiegelbild

  Raymond Schlitter (Slynyrd) schreibt über Figuren in Draufsicht: „in order to animate a top down character you will need to represent the sprite in at least 4 directions.“ Gezeichnet werden dafür drei: oben, unten und zur Seite. Die Seitenansicht „can simply be reflected for right and left movement“ ([Pixelblog 22](https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites)).

  ![Dieselbe Figur in vier Ansichten von je 16 × 24 Pixeln. A von vorn mit zwei Augen und Haaren oben am Kopf. B von der Seite nach rechts blickend, deutlich schmaler, mit einem Auge und den Haaren am Hinterkopf. C von hinten, die Haare bedecken den ganzen Hinterkopf, kein Gesicht. D ist B waagerecht gespiegelt und blickt nach links](/media/pixelart/ansichten-massstab/vier-richtungen@2x.png "Vorn (A), Seite (B), hinten (C), gespiegelte Seite (D). Eigenes Schaubild")

  Zwischen den Ansichten ändert sich einiges: In B ist die Figur schmaler, man sieht ein Auge und einen Arm; in C verschwindet das Gesicht hinter den Haaren. Gleich bleiben die Höhen. Kopfoberkante, Schultern, Hüfte und Fußsohle liegen in allen vier Feldern auf denselben Reihen. Sonst springt die Figur beim Drehen. D kostet nichts: Es ist B, waagerecht gespiegelt.

  Spiegeln hat eine Grenze. Schlitter nennt sie selbst: Es geht nicht, wenn „your character has an asymmetrical design you wish to accurately display based on orientation“. Eine Tasche über der linken Schulter, ein Werkzeug in der rechten Hand, ein Scheitel auf einer Seite wechseln beim Spiegeln die Seite. Du hast zwei Möglichkeiten: Du nimmst den Seitenwechsel in Kauf, oder du zeichnest beide Seiten. Entscheide das bewusst und schreib es auf.

  Mit acht Richtungen kommen die Diagonalen dazu. Spiegelst du alle Ansichten mit Blick nach links aus denen mit Blick nach rechts, zeichnest du fünf: unten, schräg unten, Seite, schräg oben, oben. Jede Richtung, die du nicht spiegeln kannst, kostet eine ganze Zeichnung mehr, und später auch jedes Bild einer Bewegung. Wie sich die Figur in jeder Richtung bewegt, ist Thema des Animationskurses; wie Godot Richtungen als Animationen verwaltet, steht in [Animationen](/godot/animationen).

  **Bedienung:** Vorder- und Rückansicht sind meist fast symmetrisch. In Aseprite schaltest du über *View > Symmetry Options* eine Spiegelachse ein, dann malt jeder Strich auf beiden Seiten; die Achse lässt sich verschieben, auch in die Mitte eines Pixels ([Symmetry](https://www.aseprite.org/docs/symmetry/)). Pixelorama hat das Spiegeln in den Optionen des Werkzeugs ([Mirroring](https://pixelorama.org/user_manual/drawing/#mirroring)). Für D kopierst du B in die Zelle von D und spiegelst dort die Auswahl: in Aseprite mit *Edit > Flip Horizontal* oder Shift+H ([Flip](https://www.aseprite.org/docs/flip/)), in Pixelorama mit dem Effekt *Mirror* im Menü *Effects* ([Image effects](https://pixelorama.org/user_manual/image_effects/#list-of-image-effects)).

  ## Modellblatt: gleiche Höhen in jeder Ansicht

  Ein **Modellblatt** (Model Sheet, auch Turnaround) stellt alle Ansichten einer Figur nebeneinander, mit waagerechten Hilfslinien für die wichtigen Höhen. Jede Ansicht muss dieselben Linien treffen. Ein Beispiel für eine Figur von 24 Pixeln, die Werte sind Platzhalter:

  | Hilfslinie | Reihe |
  | --- | --- |
  | Kopfoberkante | 1 |
  | Augen | 5 |
  | Schultern | 8 |
  | Hüfte | 16 |
  | Fußsohle | 24 |

  Die Breite darf sich ändern, die Höhen nicht. Weil der Umriss von vorn und von hinten bei einer symmetrischen Figur fast gleich ist, kopierst du die Silhouette der Vorderansicht für die Rückansicht und zeichnest nur das Innere neu. Die Seitenansicht baust du auf denselben Linien neu auf.

  > [!PRAXIS] Das Modellblatt als Vertrag
  > Bei Team Fortress 2 stand das Modellblatt zwischen Konzept und 3D-Modell. Mitchells Folien nennen als Aufgaben „Use concept painting as guide“ und „Solve design problems using silhouette only“, für das Modell danach „Match silhouette to model sheet“ ([MIGS 2008](https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf)). Art Director Moby Francke sagt über das Ergebnis: „There are some discrepancies but overall the character still obeys the model sheet“ ([Game Developer, 2008](https://www.gamedeveloper.com/art/in-depth-how-valve-makes-art-to-enhance-gameplay)). Für dich ist das Modellblatt die Vorlage, an der jede spätere Zeichnung derselben Figur gemessen wird, auch die Bilder einer Bewegung.

  **Bedienung:** Leg eine Leinwand an, die alle Ansichten nebeneinander fasst, etwa 64 × 24 Pixel für vier Ansichten von 16 × 24. Die Leinwand vergrößerst du nachträglich in Aseprite über *Sprite > Canvas Size* ([Canvas](https://www.aseprite.org/docs/canvas/)), in Pixelorama über *Project > Resize Canvas* ([Transforming · Scale](https://pixelorama.org/user_manual/transforming/#scale)). Ein Raster in Zellgröße trennt die Ansichten: In Pixelorama stellst du Breite und Höhe des Rasters in den Einstellungen unter *Canvas* ein und blendest es mit Ctrl+G ein ([Canvas · Grid](https://pixelorama.org/user_manual/user_interface/canvas/#grid)), in Aseprite unter *Grid* in den Einstellungen für das aktive Dokument ([Preferences · Grid](https://www.aseprite.org/docs/preferences/#grid)). Die Hilfslinien zeichnest du in eine eigene Ebene in einer grellen Farbe, die in der Figur nicht vorkommt, und blendest sie beim Export aus. In LibreSprite funktioniert die Ebene mit Hilfslinien genauso.

  ## Maßstab: eine Tabelle für alles im Bild

  Jedes Asset, das du allein zeichnest, wandert ein wenig: Die Tür wird zu klein, die Kiste zu groß, der Boss mal 50, mal 70 Pixel hoch. Eine **Maßstabstabelle** hält das fest, bevor du zeichnest. Eine reale Größe pro Pixel hilft beim Rechnen. Ein Lehrbeispiel mit 7,5 cm pro Pixel:

  | Ding | real | Höhe | Breite |
  | --- | --- | --- | --- |
  | Tile | – | 16 px | 16 px |
  | Figur | 1,80 m | 24 px | 16 px |
  | Tür | 2,10 m | 28 px | 16 px |
  | Kiste | 1,20 m | 16 px | 16 px |
  | großer Gegner | 4,20 m | 56 px | 64 px |

  Die Rechnung ist eine Division: 2,10 m ÷ 0,075 m = 28 Pixel. Die realen Maße sind ein Hilfsmittel für Stimmigkeit, keine Pflicht zum Realismus. Du darfst davon abweichen, wo Lesbarkeit oder Spielfluss es verlangen, etwa mit einer Tür, die breiter ist, als sie real wäre, damit die Figur sichtbar hindurchpasst. Wichtig ist, dass jede Abweichung in der Tabelle steht und für alle Assets gilt.

  Die Draufsicht der meisten Top-down-Spiele schummelt dabei. Schlitter beschreibt die 3/4-Draufsicht „as if you are viewing the house from 45 degrees above … you see about 3/4 of both the roof and facade“ ([Pixelblog 3](https://www.slynyrd.com/blog/2018/3/14/pixelblog-3-graphical-projections-1)). Höhen zeichnest du deshalb senkrecht in voller Länge, die Tiefe am Boden gestaucht; mehr dazu in [Grundkörper, Perspektive und Draufsicht](/pixelart/grundkoerper-raum). Für die Kollision mit der Umgebung beschreibt Saint11 die Fläche am Boden als „ground projection of what it would be in 3-D“, nicht das ganze Bild ([Top Down Tricks](https://saint11.art/img/pixel-tutorials/TopDownTricks.gif)). Welche Fläche einer Figur getroffen werden kann, ist eine eigene Entscheidung, siehe [Reichweite, Hitboxen und Hurtboxen](/combat/hitboxen).

  ## Pixeldichte: Mixels und ganze Faktoren

  Schlitter rät, ein Bild nur in ganzen Vielfachen zu vergrößern, „in order to preserve the uniformity of the pixel units“ ([Pixelblog 5](https://www.slynyrd.com/blog/2018/5/16/pixelblog-5-back-to-basics)). Das gilt nicht nur für das ganze Bild, sondern für jedes Teil darin. Für Pixel unterschiedlicher Größe im selben Bild ist das Wort **Mixel** verbreitet. Keine Quelle dieses Kurses definiert es; hier heißt es genau das: Pixel unterschiedlicher Größe nebeneinander.

  ![Zwei Fassungen derselben Szene auf einem Raster von 16 Pixeln: links eine Figur von 24 Pixeln Höhe, daneben eine Kiste von 16 Pixeln, rechts eine große vierbeinige Kreatur von 64 × 56 Pixeln mit orangem Auge. In A ist die Kreatur in halber Auflösung gezeichnet und verdoppelt, ihre Kontur läuft in groben Stufen aus Blöcken von 2 × 2 Pixeln. In B ist sie in voller Auflösung gezeichnet, Kontur und Schattierung sind so fein wie bei Figur und Kiste](/media/pixelart/ansichten-massstab/pixeldichte@2x.png "Kreatur verdoppelt (A) und in voller Auflösung (B). Eigenes Schaubild")

  In A ist die Kreatur 32 × 28 Pixel groß gezeichnet und dann verdoppelt. Jeder ihrer Pixel ist ein Block von 2 × 2, ihre Stufen sind doppelt so lang und hoch wie die der Figur, und sie wirkt gröber als alles andere, obwohl dieselben Farben im Spiel sind. In B ist sie in voller Auflösung gezeichnet, ihre Kontur und ihre Schattierung haben dieselbe Feinheit wie Figur und Kiste.

  Wer verdoppelt, muss nachzeichnen. Saint11 listet für das Vergrößern: „Hunt down big squares and make things rounder“, „Redraw broken lines and dither“, „Find areas to put extra details“ ([Resizing Pixel Art](https://saint11.art/img/pixel-tutorials/Resizing.gif)). Krumme Faktoren sind noch schlimmer. Bei 150 % wird jede zweite Pixelspalte doppelt so breit wie die anderen, das Bild bekommt ungleiche Pixel. Dasselbe gilt für Drehungen um krumme Winkel; Saint11 schreibt, Skalieren und Drehen von Pixelart „should always be avoided“. Wie Godot das ganze Bild ganzzahlig skaliert, steht in [Pixelraster in Godot](/godot/pixelraster).

  > [!MERKE]
  > Alles in einem Bild hat dieselbe Pixelgröße. Ein großer Gegner bekommt mehr Pixel, keine größeren.

  ## Große Kreaturen: Grundkörper, Massen, ein Blickpunkt

  Eine große Kreatur ist ein Sprite wie jedes andere, nur mit mehr Pixeln und mehr Gelegenheit, sich zu verzetteln. Vier Regeln halten sie zusammen.

  **Aus Grundkörpern bauen.** Die Kreatur im Schaubild besteht aus zwei Ellipsen für Körper und Kopf, vier Rechtecken für die Beine und einem Dreieck als Horn. Drawabox zeigt in [Lektion 5](https://drawabox.com/lesson/5), wie man Tiere aus solchen Körpern konstruiert, und [Grundkörper, Perspektive und Draufsicht](/pixelart/grundkoerper-raum) übt die Körper selbst. Konstruierst du zuerst, stimmen Volumen und Überschneidungen, bevor du einen Pixel Detail setzt.

  **Große Massen zuerst.** Saint11 rät beim Übertragen: „Focus on the big masses first“. Der Umriss trägt auch bei einer großen Kreatur die Lesbarkeit, siehe [Silhouette und Formensprache](/pixelart/silhouette-formsprache).

  **Clustergröße der kleinen Sprites.** In B sind die Schattierungsbänder der Kreatur mehrere Pixel breit, wie die Flächen der Figur. Schlitter rät: „Avoid too many small scattered clusters“ ([Pixelblog 57](https://www.slynyrd.com/blog/2025/7/28/pixelblog-57-knights-monsters-amp-castles)). Mehr Fläche heißt nicht mehr Rauschen. Ist die Kreatur feiner gezeichnet als die Figur, wirkt sie fremd, ist sie gröber, auch.

  **Ein Blickpunkt.** Das orange Auge ist der einzige gesättigte Farbfleck der Kreatur. Der stärkste Hell-Dunkel-Kontrast liegt zwar an der Kontur, doch der einzelne Farbakzent zieht den Blick, und der findet sofort Kopf und Blickrichtung. Valve setzt den höchsten Kontrast einer Figur ebenfalls gezielt an eine Stelle, auf Brusthöhe, wo die Waffe gehalten wird. Welche Stellen eines Bosses im Kampf wichtig sind, etwa Schwachpunkte und Zonen, behandelt [Große Kreaturen als Bosse](/combat/grosse-gegner).

  Plane außerdem, welche Teile sich später einzeln bewegen: Kopf, jedes Bein, Horn oder Schwanz. Jedes bekommt eine eigene Ebene, benannt nach dem Teil. Den Körper zeichnest du unter einem Bein vollständig weiter, auch wo das Bein ihn verdeckt, damit beim späteren Verschieben kein Loch entsteht. Gruppenebenen in Pixelorama halten die Teile zusammen ([Layer · Group layers](https://pixelorama.org/concepts/layer/#group-layers)). Die Bewegung selbst ist Thema des Animationskurses; hier geht es nur darum, sie nicht zu verbauen.

  Rechne den Aufwand vorher. 64 × 56 Pixel sind gut neunmal so viele wie eine Figur von 16 × 24, für jede Richtung und jedes Bild. Prüf deshalb, wie viele Richtungen eine große Kreatur in deinem Spiel braucht.

  > [!INTERVIEW]
  > Studios suchen „A strong pixel art portfolio with unique creatures and characters“ ([Conradical Games](https://workwithindies.com/careers/conradical-games-pixel-artist)) oder ausdrücklich „good knowledge of perspective“ ([Pine Creek Games](https://workwithindies.com/careers/pine-creek-games-2d-artist)). Eine Frage im Portfolio-Gespräch: „Dein Boss wirkt neben der Spielfigur gröber. Woran liegt das?“ Gute Antwort: Du prüfst die Pixeldichte, also ob der Boss in voller Auflösung gezeichnet oder hochskaliert ist, dann die Clustergröße im Vergleich zur Figur. Du zeigst die Maßstabstabelle und das Modellblatt und erklärst, wo der Blickpunkt sitzt. Das ArtStation Magazine rät für Portfolios: „Delete half your portfolio“ ([Top 10 Portfolio Tips](https://magazine.artstation.com/2019/03/games-portfolio-top-10/)). Zeig also eher eine stimmige Szene als zehn Figuren in verschiedenen Maßstäben.

  ## Häufige Fehler

  - **Ansichten einzeln gezeichnet.** Ohne Hilfslinien springen Kopf und Hüfte beim Drehen. Ein Modellblatt mit Linien für alle Höhen.
  - **Seitenansicht so breit wie vorn.** Von der Seite ist ein Körper schmaler. Höhen gleich, Breite neu.
  - **Asymmetrie gespiegelt, ohne es zu merken.** Die Tasche wechselt die Schulter. Entscheiden und aufschreiben.
  - **Maßstab im Kopf.** Jedes Asset wandert ein wenig. Eine Tabelle, die für alle gilt.
  - **Teile hochskaliert.** Ein verdoppelter Boss hat doppelt so große Pixel wie die Figur. In voller Auflösung zeichnen.
  - **Krumme Faktoren.** 150 % erzeugt ungleiche Pixel. Nur ganzzahlig vergrößern.
  - **Große Kreatur voller Rauschen.** Mehr Platz verführt zu Kleinteilen. Clustergröße der kleinen Sprites halten.
  - **Kein Blickpunkt.** Kontrast überall, der Blick findet nichts. Ein Akzent, eine Stelle.
  - **Bewegliche Teile verschmolzen.** Ein Bein, das in den Körper gemalt ist, lässt sich später nicht bewegen. Eigene Ebenen planen.

  ## Zusammenfassung

  - Figuren in Draufsicht brauchen mindestens vier Richtungen. Die Seite wird gespiegelt, solange keine Asymmetrie dagegen spricht.
  - Mit acht Richtungen und Spiegelung zeichnest du fünf Ansichten.
  - Ein Modellblatt hält Kopf, Augen, Schultern, Hüfte und Füße in allen Ansichten auf denselben Reihen.
  - Eine Maßstabstabelle legt die Pixelgrößen aller Assets fest; eine reale Größe pro Pixel hilft beim Rechnen.
  - Alles in einem Bild hat dieselbe Pixelgröße. Vergrößert wird nur ganzzahlig, und hochskalierte Teile werden nachgezeichnet.
  - Große Kreaturen baust du aus Grundkörpern, mit großen Massen, Clustern in der Größe der kleinen Sprites und einem Blickpunkt.
  - Teile, die sich später bewegen, bekommen eigene Ebenen; die Bewegung selbst ist Thema des Animationskurses.
exercises:
  - id: richtungen-spiegeln
    type: choice
    title: Wann Spiegeln Arbeit spart
    prompt: |
      Welche Aussagen über Richtungen und Spiegeln stimmen?
    options:
      - text: Laut Slynyrd brauchen Figuren in Draufsicht mindestens vier Richtungen.
        correct: true
        why: Oben, unten und zwei Seiten. Gezeichnet werden drei, die zweite Seite entsteht durch Spiegeln.
      - text: Eine Tasche über einer Schulter wechselt beim Spiegeln die Seite.
        correct: true
        why: Asymmetrische Merkmale drehen sich mit. Dann entscheidest du, ob du das in Kauf nimmst oder beide Seiten zeichnest.
      - text: Die Rückansicht entsteht, indem man die Vorderansicht waagerecht spiegelt.
        correct: false
        why: Der Umriss ist ähnlich, aber das Innere ist anders, das Gesicht fehlt, die Haare bedecken den Kopf. Die Rückansicht wird neu gezeichnet.
      - text: In der Seitenansicht ist die Figur genauso breit wie von vorn, nur anders bemalt.
        correct: false
        why: Von der Seite ist ein Körper schmaler. Gleich bleiben die Höhen, nicht die Breite.
    explanation: |
      Spiegeln spart eine ganze Ansicht, aber nur bei der Seite und nur, solange die Figur symmetrisch ist. Vorder- und Rückansicht teilen den Umriss, nicht das Innere. Und die Seitenansicht hat eigene Breiten, aber dieselben Höhen wie die anderen. Wer das vorher klärt, zeichnet nicht doppelt und nicht falsch.
    resources:
      - title: Slynyrd · Pixelblog 22 · Top-down character sprites
        url: https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites

  - id: pixeldichte-bild
    type: choice
    title: Wo die Pixel nicht passen
    prompt: |
      Woran erkennst du in Feld A, dass die Kreatur nicht in derselben Pixeldichte gezeichnet ist wie Figur und Kiste?

      ![Zwei Fassungen derselben Szene mit Figur, Kiste und großer Kreatur. In A ist die Kreatur verdoppelt und hat grobe Stufen aus Blöcken von 2 × 2 Pixeln, in B ist sie in voller Auflösung gezeichnet](/media/pixelart/ansichten-massstab/pixeldichte@2x.png "Kreatur verdoppelt (A) und in voller Auflösung (B). Eigenes Schaubild")
    options:
      - text: Die Stufen ihrer Kontur und ihre Schattierungsbänder bestehen aus Blöcken von 2 × 2 Pixeln, die der Figur aus einzelnen Pixeln.
        correct: true
        why: Das ist das Kennzeichen eines hochskalierten Teils. Seine kleinste Einheit ist doppelt so groß wie die der übrigen Szene.
      - text: Die Kreatur ist viel größer als die Figur.
        correct: false
        why: Das ist sie in A und B. Größe ist gewollt, entscheidend ist die Größe der einzelnen Pixel.
      - text: Die Kreatur hat andere Farben als die Figur.
        correct: false
        why: Farben gehören zur Gestaltung, nicht zur Pixeldichte. In A und B hat die Kreatur dieselben Farben.
      - text: Die Kreatur steht über mehrere Tiles.
        correct: false
        why: Auch das gilt für A und B. Ein großer Gegner darf mehrere Tiles belegen.
    explanation: |
      Gemischte Pixelgrößen erkennst du an der kleinsten Einheit: Wie kurz kann eine Stufe sein, wie schmal ein Band? In A ist sie bei der Kreatur doppelt so groß wie bei Figur und Kiste. Deshalb wirkt die Kreatur gröber, obwohl Farben und Formen stimmen. Schlitter rät aus genau diesem Grund, nur ganzzahlig zu vergrößern und gleiche Pixeleinheiten zu wahren.
    resources:
      - title: Slynyrd · Pixelblog 5 · Back to Basics
        url: https://www.slynyrd.com/blog/2018/5/16/pixelblog-5-back-to-basics

  - id: blickpunkt-kreatur
    type: choice
    title: Wohin schaut man zuerst?
    prompt: |
      Eine große Kreatur von 64 × 56 Pixeln wirkt unruhig, der Blick findet keinen Halt. Welche Änderung schafft am ehesten einen klaren Blickpunkt?
    options:
      - text: Den stärksten Kontrast und die einzige gesättigte Akzentfarbe auf eine Stelle legen, etwa das Auge.
        correct: true
        why: Ein einzelner Akzent zieht den Blick. Valve legt den höchsten Kontrast einer Figur ebenfalls gezielt an eine Stelle.
      - text: Überall mehr Details setzen, damit die Kreatur interessanter wird.
        correct: false
        why: Mehr Details verteilen die Aufmerksamkeit weiter. Slynyrd rät, zu viele kleine verstreute Cluster zu vermeiden.
      - text: Die Kreatur in halber Größe zeichnen und verdoppeln, damit die Formen gröber und klarer werden.
        correct: false
        why: Dann hat sie doppelt so große Pixel wie der Rest der Szene. Klarer wird sie durch große Massen, nicht durch große Pixel.
      - text: Eine dickere schwarze Kontur um die ganze Kreatur ziehen.
        correct: false
        why: Eine Kontur trennt die Kreatur vom Grund, aber sie legt keinen Punkt fest, an dem der Blick hängen bleibt.
    explanation: |
      Ein Blickpunkt entsteht durch Ausnahme: Eine Stelle ist heller, dunkler oder farbiger als alles um sie herum. Wenn überall Kontrast herrscht, gibt es keine Ausnahme mehr. Bei großen Kreaturen ist die Stelle oft der Kopf oder ein Schwachpunkt, und wo sie im Kampf sitzen sollte, ist eine Frage des Combat Designs.
    resources:
      - title: Jason Mitchell · Connecting Visuals to Gameplay at Valve (MIGS 2008)
        url: https://media.steampowered.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf

  - id: modellblatt-ablauf
    type: order
    title: Ein Modellblatt anlegen
    prompt: |
      Bring die Schritte, mit denen du ein Modellblatt für vier Richtungen anlegst, in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Größe der Figur aus der Maßstabstabelle übernehmen.
      Leinwand mit einer Zelle pro Ansicht und eine Ebene mit Hilfslinien anlegen.
      Vorderansicht auf den Hilfslinien zeichnen.
      Silhouette der Vorderansicht für die Rückansicht kopieren und das Innere neu zeichnen.
      Seitenansicht auf denselben Linien neu aufbauen, schmaler als vorn.
      Seitenansicht spiegeln und asymmetrische Merkmale prüfen.
      Alle Ansichten nebeneinander bei 100 % vergleichen.
    alternatives:
      - [1, 2, 3, 5, 4, 6, 7]
      - [1, 2, 3, 5, 6, 4, 7]
    explanation: |
      Die Größe kommt aus der Tabelle, damit die Figur zum Rest der Welt passt. Hilfslinien müssen vor der ersten Ansicht stehen, sonst richtet man sie nach der Zeichnung aus. Die Vorderansicht liefert den Umriss für die Rückansicht, die Seite braucht einen eigenen Aufbau. Gespiegelt wird erst, wenn die Seite fertig ist, und der Vergleich bei 100 % zeigt, ob eine Ansicht beim Drehen springt.
    resources:
      - title: Pixelorama Docs · Canvas · Grid
        url: https://pixelorama.org/user_manual/user_interface/canvas/#grid

  - id: richtungen-zaehlen
    type: output
    title: Wie viele Ansichten zeichnest du?
    prompt: |
      Eine Figur soll in acht Richtungen zu sehen sein. Die Ansichten mit Blick nach links entstehen durch Spiegeln der Ansichten mit Blick nach rechts, die Figur ist symmetrisch. Wie viele Ansichten zeichnest du selbst? Antworte mit der Zahl.
    lang: text
    code: |
      Richtungen: 8
      Spiegeln:   links aus rechts
      Figur:      symmetrisch
    expected: |
      5
    accept:
      - 5 Ansichten
      - fünf
      - 5 Richtungen
    hints:
      - Welche Richtungen haben kein Spiegelbild, weil sie genau nach oben oder unten zeigen?
    explanation: |
      Oben und unten haben kein Gegenstück, sie zeichnest du je einmal. Die drei Richtungen mit Blick nach rechts, schräg unten, Seite und schräg oben, zeichnest du ebenfalls; die drei nach links entstehen durch Spiegeln. Das ergibt 2 + 3 = 5. Bei vier Richtungen sind es entsprechend drei, wie Slynyrd beschreibt.
    resources:
      - title: Slynyrd · Pixelblog 22 · Top-down character sprites
        url: https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites

  - id: tuer-pixel
    type: output
    title: Wie hoch wird die Tür?
    prompt: |
      In deiner Maßstabstabelle ist eine Figur von 1,80 m 24 Pixel hoch. Wie viele Pixel hoch wird eine Tür von 2,10 m? Antworte mit der Zahl.
    lang: text
    code: |
      Figur:  1,80 m = 24 px
      Tür:    2,10 m = ? px
    expected: |
      28
    accept:
      - 28 px
      - 28 Pixel
    hints:
      - Rechne zuerst aus, wie viele Zentimeter ein Pixel darstellt.
    explanation: |
      180 cm ÷ 24 px = 7,5 cm pro Pixel. 210 cm ÷ 7,5 cm = 28 Pixel. Mit dem Wert pro Pixel rechnest du jedes weitere Asset in Sekunden aus, eine Kiste von 1,20 m wird 16 Pixel, also genau ein Tile. Ob du die Tür im Spiel bewusst größer machst, damit die Figur gut hindurchpasst, entscheidest du; die Abweichung gehört dann in die Tabelle.
    resources:
      - title: Slynyrd · Pixelblog 20 · Top-down tiles
        url: https://www.slynyrd.com/blog/2019/8/27/pixelblog-20-top-down-tiles

  - id: aufwand-faktor
    type: output
    title: Wie viel mehr Arbeit ist der Boss?
    prompt: |
      Eine Figur hat eine Leinwand von 16 × 24 Pixeln, eine große Kreatur eine von 64 × 56. Wie viele Male mehr Pixel hat die Leinwand der Kreatur, auf eine ganze Zahl gerundet? Antworte mit der Zahl.
    lang: text
    code: |
      Figur:    16 × 24 px
      Kreatur:  64 × 56 px
    expected: |
      9
    accept:
      - 9-mal
      - 9×
      - neunmal
      - etwa 9
      - 9 mal
    explanation: |
      16 × 24 = 384 Pixel, 64 × 56 = 3584 Pixel. 3584 ÷ 384 ≈ 9,3. Nicht jeder Pixel der Leinwand ist bemalt, aber die Zahl zeigt die Größenordnung: Eine Ansicht der Kreatur kostet so viel wie neun Figuren. Für vier Richtungen und mehrere Bilder einer Bewegung wächst das weiter, deshalb lohnt die Frage, wie viele Ansichten ein Boss braucht.
    resources:
      - title: Derek Yu · Pixel Art Tutorial · Big sprite
        url: https://www.derekyu.com/makegames/pixelart.html#big_sprite

  - id: begriffe-massstab
    type: gap
    title: Begriffe zu Ansicht und Maßstab
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Ein Blatt, das alle Ansichten einer Figur mit Hilfslinien nebeneinanderstellt, heißt ⟦Modellblatt⟧. Die Seitenansicht für die zweite Richtung entsteht durch ⟦Spiegeln⟧, solange die Figur keine ⟦Asymmetrie⟧ hat, die die Seite wechseln würde. Pixel unterschiedlicher Größe im selben Bild nennt man ⟦Mixels⟧. Vergrößern darfst du nur ⟦ganzzahlig⟧. Die Stelle einer großen Kreatur mit dem stärksten Kontrast ist ihr ⟦Blickpunkt⟧.
    gaps:
      - label: Blatt mit allen Ansichten
        hint: Auf Englisch Model Sheet.
        accept: ["Model Sheet", "Turnaround", "Modell-Blatt"]
      - label: zweite Seite
        hint: Waagerecht umdrehen, ein Verb.
        accept: ["Spiegelung", "Flip", "Flippen"]
      - label: Gegenteil von symmetrisch
        hint: Ein Merkmal nur auf einer Seite.
        accept: ["asymmetrisches Merkmal", "Asymmetrien"]
      - label: gemischte Pixelgrößen
        hint: Kunstwort aus „mixed“ und „Pixel“.
        accept: ["Mixel", "gemischte Pixel"]
      - label: Art der Vergrößerung
        hint: Faktor 2, 3, 4 – keine Kommazahl.
        accept: ["ganzzahlige", "in ganzen Zahlen", "integer", "in ganzen Vielfachen"]
      - label: wohin der Blick fällt
        hint: Die Stelle, zu der das Auge zuerst wandert.
        accept: ["Fokuspunkt", "Focal Point", "Blickfang"]
    explanation: |
      Modellblatt und Spiegeln regeln die Ansichten, Asymmetrie ist die Ausnahme, die du bewusst entscheidest. Mixels und ganzzahlige Vergrößerung betreffen die Pixeldichte, die alles im Bild zusammenhält. Der Blickpunkt sagt bei großen Kreaturen, wohin das Auge zuerst gehen soll.

  - id: massstabstabelle-fehler
    type: bug
    title: Ein Fass so groß wie eine Kiste
    prompt: |
      Lehrbeispiel: Maßstabstabelle für ein Mockup. Im Mockup reicht das Fass der Figur bis zur Brust und steht höher als die Kiste daneben. Finde die Zeile.
    lang: prose
    code: |
      Maßstab: 7,5 cm pro Pixel
      Figur: 1,80 m, 24 px
      Tür: 2,10 m, 28 px
      Kiste: 1,20 m, 16 px
      Fass: 0,90 m, 18 px
      Großer Gegner: 4,20 m, 56 px
    lines: [5]
    hints:
      - Rechne jede Zeile mit 7,5 cm pro Pixel nach.
    explanation: |
      0,90 m ÷ 0,075 m = 12 Pixel, nicht 18. Mit 18 Pixeln ist das Fass größer als die Kiste mit 16 und reicht der Figur von 24 Pixeln weit über die Hüfte. Alle anderen Zeilen gehen mit 7,5 cm pro Pixel auf. Ein solcher Fehler fällt erst auf, wenn die Dinge nebeneinanderstehen; deshalb prüfst du jede neue Zeile sofort nach.
    resources:
      - title: Slynyrd · Pixelblog 22 · Top-down character sprites
        url: https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites

  - id: modellblatt-huefte
    type: bug
    title: Beim Drehen werden die Beine kürzer
    prompt: |
      Lehrbeispiel: Notiz zum Modellblatt einer Figur. Beim Wechsel zwischen Vorder- und Seitenansicht scheinen die Beine kürzer zu werden, obwohl die Figur gleich groß bleibt. Finde die Zeile.
    lang: prose
    code: |
      Modellblatt Lehrfigur, 16 × 24 je Ansicht
      Kopfoberkante: Reihe 1 in allen Ansichten
      Augen: Reihe 5 vorn und seitlich
      Schultern: Reihe 8 in allen Ansichten
      Hüfte: Reihe 16 vorn, Reihe 18 seitlich
      Fußsohle: Reihe 24 in allen Ansichten
    lines: [5]
    hints:
      - Welche Höhe ist nicht in allen Ansichten gleich?
    explanation: |
      Die Hüfte liegt seitlich zwei Reihen tiefer als vorn. Weil die Fußsohle in beiden Ansichten auf Reihe 24 bleibt, sind die Beine in der Seitenansicht zwei Pixel kürzer und der Rumpf länger. Beim Drehen springt die Hüfte, und das liest sich als Schrumpfen der Beine. Alle Hilfslinien gelten für alle Ansichten, nur die Breiten dürfen sich ändern.
    resources:
      - title: Game Developer · How Valve Makes Art To Enhance Gameplay
        url: https://www.gamedeveloper.com/art/in-depth-how-valve-makes-art-to-enhance-gameplay

  - id: pixeldichte-erklaeren
    type: explain
    title: Warum der Boss fremd wirkt
    prompt: |
      Eine große Kreatur wurde mit 32 × 28 Pixeln gezeichnet und für das Spiel auf 64 × 56 verdoppelt. Neben der Figur und der Kiste wirkt sie grob und wie aus einem anderen Spiel. Erkläre in drei bis fünf Sätzen, woran das liegt und wie du es behebst.
    lang: text
    code: |
      Figur:   24 px hoch, 1 px = 1 px
      Kiste:   16 px, 1 px = 1 px
      Kreatur: gezeichnet 32 × 28,
               verdoppelt auf 64 × 56,
               1 Pixel = Block 2 × 2
    points:
      - Die kleinste Einheit der Kreatur ist ein Block von 2 × 2 Pixeln, die der übrigen Szene ein Pixel; das Bild hat gemischte Pixelgrößen.
      - Stufen in der Kontur und Bänder in der Schattierung sind dadurch doppelt so grob wie bei Figur und Kiste.
      - Slynyrd rät, nur ganzzahlig zu vergrößern, um gleiche Pixeleinheiten zu wahren; das gilt für jedes Teil im Bild, nicht nur das Ganze.
      - Abhilfe ist, die Kreatur in voller Auflösung neu zu zeichnen oder nach dem Verdoppeln nachzuarbeiten, wie Saint11 es beschreibt.
    explanation: |
      Das Verdoppeln ist ganzzahlig, aber nur für die Kreatur. Ihre Pixel sind danach 2 × 2 groß, die der Figur und der Kiste 1 × 1. Das Auge sieht diesen Unterschied an jeder Stufe der Kontur und an jedem Schattierungsband, deshalb wirkt die Kreatur gröber, auch wenn Farben und Formen passen. Schlitters Regel der gleichen Pixeleinheiten gilt für jedes Teil im Bild. Beheben lässt sich das nur durch Zeichnen: Entweder die Kreatur entsteht gleich in 64 × 56, oder du gehst nach dem Verdoppeln Saint11s Liste durch, große Quadrate runden, Linien neu ziehen, Details ergänzen.
    resources:
      - title: Saint11 · Resizing Pixel Art
        url: https://saint11.art/img/pixel-tutorials/Resizing.gif

  - id: vier-richtungen-modellblatt
    type: practice
    title: Ein Modellblatt in vier Richtungen
    prompt: |
      Zeichne im Editor eine eigene Figur oder eine neutrale Gliederpuppe in vier Richtungen auf einem Modellblatt: vorn, Seite, hinten und die gespiegelte Seite. Leg vorher eine Ebene mit Hilfslinien für Kopfoberkante, Augen, Schultern, Hüfte und Fußsohle an. Schreib hier in einigen Sätzen auf, welche Merkmale asymmetrisch sind und wie du beim Spiegeln mit ihnen umgegangen bist.
    lang: prose
    checklist:
      - Die Datei hat eine Zelle pro Ansicht, alle gleich groß, und eine eigene Ebene mit Hilfslinien.
      - In allen vier Ansichten liegen Kopfoberkante, Schultern, Hüfte und Fußsohle auf denselben Reihen; du hast es mit den Hilfslinien geprüft.
      - Die Seitenansicht ist schmaler als die Vorderansicht.
      - Die gespiegelte Seite ist mit dem Spiegelbefehl entstanden, nicht neu gezeichnet.
      - Du hast jedes asymmetrische Merkmal notiert und dazu, ob es beim Spiegeln die Seite wechseln darf.
      - Du hast die vier Ansichten nebeneinander bei 100 % angesehen und notiert, ob eine beim Durchschalten springt.
    hints:
      - Kopier die Silhouette der Vorderansicht in die Zelle der Rückansicht und zeichne dort nur das Innere neu.
    explanation: |
      Das Modellblatt ist die Grundlage für alles, was du später mit der Figur machst. Die Hilfslinien zwingen alle Ansichten auf dieselben Höhen, das verhindert das Springen beim Drehen. Die Notiz zur Asymmetrie hält eine Entscheidung fest, die sonst stillschweigend fällt und erst im Spiel auffällt. Wie sich die Figur in jeder Richtung bewegt, kommt im Animationskurs.
    resources:
      - title: Aseprite Docs · Symmetry
        url: https://www.aseprite.org/docs/symmetry/
      - title: Pixelorama Docs · Drawing · Mirroring
        url: https://pixelorama.org/user_manual/drawing/#mirroring

  - id: massstab-mockup
    type: practice
    title: Maßstabstabelle und Mockup mit großer Kreatur
    prompt: |
      Leg eine Maßstabstabelle mit mindestens sechs Einträgen an: Tile, Figur, Tür, Kiste, ein kleiner Gegner und eine große Kreatur. Zeichne dann ein Mockup auf einem Raster in Tilegröße mit Figur, Kiste, Tür und der großen Kreatur in voller Auflösung. Die Kreatur baust du aus Grundkörpern, mit höchstens drei großen Massen und einem Blickpunkt, die Teile, die sich später bewegen sollen, in eigenen Ebenen. Notiere hier die Tabelle und zwei Sätze zu deinen Entscheidungen.
    lang: prose
    starter: |
      Maßstab: … cm pro Pixel
      Tile:
      Figur:
      Tür:
      Kiste:
      kleiner Gegner:
      große Kreatur:
      Entscheidungen:
    checklist:
      - Die Tabelle hat mindestens sechs Einträge mit Pixelmaßen, und jede Zeile geht mit dem angegebenen Maßstab auf oder ist als bewusste Abweichung markiert.
      - Im Mockup haben alle Dinge dieselbe Pixelgröße; nichts ist hochskaliert.
      - Die Kreatur ist aus erkennbaren Grundkörpern aufgebaut, und du hast notiert, aus welchen.
      - Die Kreatur hat genau einen Blickpunkt mit dem stärksten Kontrast der Kreatur.
      - Jedes Teil, das sich später bewegen soll, liegt in einer eigenen, benannten Ebene, und der Körper ist unter diesen Teilen vollständig gezeichnet.
      - Du hast das Mockup bei 100 % angesehen und notiert, ob die Clustergröße der Kreatur zu der der Figur passt.
    hints:
      - Rechne zuerst die Größe pro Pixel aus der Figur aus, dann alle anderen Zeilen.
      - Zeichne die Kreatur zuerst als graue Grundkörper in einer eigenen Ebene und erst danach Umriss und Schattierung.
    explanation: |
      Tabelle und Mockup prüfen sich gegenseitig: Was in der Tabelle stimmt, aber im Mockup falsch wirkt, ist ein Fall für eine bewusste Abweichung. Die große Kreatur in voller Auflösung zeigt dir, wie viel Arbeit ein Boss kostet. Die getrennten Ebenen sind die Vorbereitung für den Animationskurs, ohne dass du hier schon etwas bewegst. Welche Teile ein Boss im Kampf braucht, etwa Schwachpunkte, behandelt [Große Kreaturen als Bosse](/combat/grosse-gegner).
    resources:
      - title: Drawabox · Lesson 5 (Tiere konstruieren)
        url: https://drawabox.com/lesson/5
      - title: Slynyrd · Pixelblog 5 · Back to Basics
        url: https://www.slynyrd.com/blog/2018/5/16/pixelblog-5-back-to-basics
