id: schattieren-textur
title: Schattieren, Dithering, Textur und Detailgrad
level: 2
minutes: 130
summary: Warum eine Form mit abgedunkelten Rändern wie ein Kissen aussieht, wann Dithering hilft und wann es nur rauscht, wie du Stein, Holz und Gras aus Clustern statt aus Zufallspixeln baust, wie viel Detail eine kleine Fläche trägt und welche Kontur zu welchem Bild passt.
place: pc
goals:
  - Du legst eine Lichtrichtung fest und schattierst Kugel und Kiste nach ihrer Form statt nach ihrer Kontur.
  - Du erkennst Kissenschattierung und erklärst, warum sie die Form verflacht.
  - Du setzt Dithering gezielt ein, unterscheidest geordnetes Raster von Zufallsrauschen und weißt, wann du es weglässt.
  - Du baust Texturen aus wiederholten Clustern und lässt Flächen frei, statt Pixel zu streuen.
  - Du entscheidest, welches Detail eine kleine Fläche trägt, und wählst zwischen schwarzer Kontur, farbiger Kontur und Sel-out.
