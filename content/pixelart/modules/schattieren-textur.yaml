lesson: |
  Du hast eine Kiste gezeichnet und willst sie plastisch machen. Du dunkelst alle Ränder ab und hellst die Mitte auf. Das Ergebnis sieht aus wie ein aufgeblasenes Kissen, nicht wie eine Kiste. Danach versuchst du eine Steinwand: Du streust hellere und dunklere Pixel über eine graue Fläche. Im Zoom wirkt das körnig, bei 100 % flimmert es nur.

  Beide Versuche haben denselben Fehler. Sie verteilen Helligkeit nach der Kontur oder nach dem Zufall, nicht nach Licht und Form. Dieses Modul zeigt, wie du nach Form schattierst, wann Dithering hilft, wie Texturen aus Clustern entstehen, also aus Gruppen zusammenhängender Pixel derselben Farbe, wie viel Detail eine kleine Fläche trägt und welche Kontur du wählst. Die Grundlagen von Licht und Tonwert stehen in [Licht, Schatten und Tonwerte](/pixelart/licht-werte), Cluster und verwaiste Pixel in [Linien, Kurven und Cluster](/pixelart/linien-cluster).

  ## Erst die Lichtrichtung, dann der erste Schatten

  Bevor du einen Schatten setzt, entscheidest du, woher das Licht kommt. Pedro Medeiros (Saint11) lässt in einer Übung die Lichtquelle absichtlich offen, weil „choosing a good light source is a skill as important as rendering the scene correctly“ ([Identifying Faces](https://saint11.art/pixel_art_articles/article4/#identifying-faces)). In allen Schaubildern dieses Kurses kommt das Licht von oben links. Für ein Asset-Set legst du die Richtung einmal fest und hältst sie in jeder Spielgrafik (Sprite) und jeder Kachel (Tile) durch, sonst passen die Teile im Spiel nicht zusammen.

  Dann siehst du dir die Flächen an. Saint11 unterscheidet flache und runde Formen: „Flat faces usually have a uniform color in their entirety while rounded shapes can have color ramps.“ Eine Kiste bekommt also pro Seite einen Ton: Oberseite hell, Front mittel, abgewandte Seite dunkel. Eine Kugel bekommt eine Rampe, die vom Licht weg dunkler wird. Den Übergang zwischen Licht und Schatten, den Terminator, hält Saint11 in Pixelart scharf, „to avoid banding“ ([Basic structure](https://saint11.art/pixel_art_articles/article4/#basic-structure)).

  Bedienung: In Aseprite malt die **Shading-Ink** mit einem Ausschnitt der Palette. Du wählst mehrere Farben einer Rampe aus, die linke Maustaste schiebt einen Pixel eine Stufe in die eine Richtung der Rampe, die rechte in die andere ([Shading](https://www.aseprite.org/docs/shading/)). Pixelorama hat dafür ein eigenes Werkzeug (Taste U) mit den Modi Simple Shading, Hue Shifting und Color Replace; Color Replace wandert wie die Aseprite-Ink entlang ausgewählter Palettenfarben ([Shading](https://pixelorama.org/user_manual/shading/)). Gestaltung: Beide Werkzeuge sparen Klicks. Wo Licht und Schatten liegen, entscheiden sie nicht.

  ## Formschattierung statt Kissenschattierung

  ![Zwei graue Ovale mit dunkler Kontur. A ist in Ringen schattiert, die zur Kontur hin dunkler werden, die hellste Fläche liegt genau in der Mitte. B ist von oben links beleuchtet: hell oben links, dunkel unten rechts, die Grenzen laufen schräg über die Form](/media/pixelart/schattieren-textur/kissen-und-form@2x.png "Kissenschattierung (A) und Formschattierung mit Licht von oben links (B). Eigenes Schaubild")

  A ist **Kissenschattierung** (Pillow Shading). Jede Seite wird zur Kontur hin dunkler, die Mitte ist am hellsten, egal, woher das Licht kommt. Saint11 beschreibt sie als Versuch, „to shade an object with no clear light source and making a generic shadow around the outlines“, und rät: „This is best avoided by having a clearer light source and not darkening the edges of a face.“ ([Pillow shading](https://saint11.art/pixel_art_articles/article4/#pillow-shading)) Im Pixel-Joint-Tutorial von cure steht es kürzer: „Pillow-shading is bad because it pays no attention to the light source“ ([The Pixel Art Tutorial](https://pixeljoint.com/forum/forum_posts.asp?TID=11299)).

  B ist **Formschattierung**. Die hellste Stelle sitzt dort, wo die Fläche zum Licht zeigt, die dunkelste gegenüber. Die Grenzen zwischen den Tönen laufen schräg über die Form und verraten ihre Rundung. Derek Yu beschreibt das Ziel: „By shading, you're not just adding color - you're sculpting out a form.“ Seine Prüfung: „if you squint, a few large clusters of light and dark should still emerge.“ ([Form and Volume](https://www.derekyu.com/makegames/pixelart.html#form))

  Saint11 nennt zwei weitere häufige Fehler. **Soft faces** entstehen, wenn du das Licht zu stark oder in die falsche Richtung weichzeichnest. **Flat light** heißt, die Form des Objekts zu ignorieren ([Common Mistakes](https://saint11.art/pixel_art_articles/article4/#common-mistakes)).

  > [!MERKE]
  > Schatten folgt dem Licht und der Form, nie der Kontur. Wenn alle Ränder dunkler sind als die Mitte, fehlt die Lichtrichtung.

  ## Dithering: zwei Farben, die wie eine dritte wirken

  **Dithering** mischt zwei Farben in einem Pixelmuster, damit dazwischen ein Übergang entsteht, ohne eine neue Farbe zu brauchen. Derek Yu: „The idea is to create noise of varying densities to simulate the gradation of color.“ ([Dithering](https://www.derekyu.com/makegames/pixelart.html#dithering))

  ![Drei waagerechte Verläufe von Dunkelgrau nach Hellgrau. A wechselt in der Mitte hart von dunkel zu hell. B nutzt ein regelmäßiges Pixelraster, das von links nach rechts immer mehr helle Pixel enthält. C nutzt zufällig verteilte Pixel, die einzelne Klumpen und Löcher bilden](/media/pixelart/schattieren-textur/dithering@2x.png "Harte Stufe (A), geordnetes Raster nach Bayer 4 × 4 (B) und Zufallsrauschen (C) zwischen denselben zwei Farben. Eigenes Schaubild")

  Alle drei Streifen nutzen nur zwei Farben. A hat eine harte Kante. B verteilt die hellen Pixel nach einem festen Muster, einer **Bayer-Matrix** von 4 × 4 Pixeln: Je weiter rechts, desto mehr Pixel jeder 4 × 4-Zelle sind hell. Das Muster ist regelmäßig und liest sich als Verlauf. C verteilt die hellen Pixel zufällig mit derselben Dichte. Dabei entstehen Klumpen, Löcher und viele verwaiste Pixel. Zwei Stufen aus dem geordneten Raster sehen so aus, oben 50 %, darunter 25 % helle Pixel:

  ```text
  # - # - # - # -
  - # - # - # - #
  # - # - # - # -
  - # - # - # - #

  - # - # - # - #
  # # # # # # # #
  - # - # - # - #
  # # # # # # # #
  ```

  Wann hilft Dithering? Derek Yu meint, es wirke „best on large areas of a single color“ oder dort, wo eine Fläche „rough or bumpy“ aussehen soll, etwa bei Erde. Er selbst nutzt es sparsam, und manche Pixel Artists gar nicht. Saint11 schreibt auf seiner Tafel zu den Grundlagen „I avoid dither when I can“ ([Fundamentals](https://saint11.art/img/pixel-tutorials/Fundamentals.gif)) und setzt in seiner Schattierungsübung „some cheap dither“ ein, um einen Übergang zu verbessern ([My version](https://saint11.art/pixel_art_articles/article4/#my-version)). Daraus folgt eine Arbeitsregel: Dithering ist ein Werkzeug für Übergänge auf großen Flächen und für raue Oberflächen. Auf einem kleinen Sprite verbraucht ein Ditherband Pixel, die du für die Form brauchst.

  Bedienung: Das Verlaufswerkzeug von Aseprite bietet Bayer-Matrizen von 2 × 2, 4 × 4 und 8 × 8 ([Dithering options](https://www.aseprite.org/docs/context-bar/#dithering-options)). In Pixelorama erzeugt der Effekt *Gradient* Verläufe, die sich laut Doku „optionally be dithered“ lassen ([Image effects](https://pixelorama.org/user_manual/image_effects/)). Von Hand setzt du ein Raster schneller, als du denkst: Ein 50-%-Schachbrett mit Shift-Linien im 45°-Winkel, dann ausdünnen.

  > [!WARNING] Zufallsrauschen ist kein Dithering
  > Ein Pinsel, der Pixel zufällig streut, oder ein Rauschfilter erzeugt Muster wie C. Jeder einzelne helle Pixel in dunkler Umgebung ist ein verwaister Pixel und flimmert bei 1×. Wenn du ditherst, setz ein regelmäßiges Muster.

  ## Texturen aus Clustern statt aus Rauschen

  Raymond Schlitter (Slynyrd) warnt: „If not treated with care, texture details will only add unnecessary noise.“ Seine Grundsätze für Texturen ([Pixelblog 2](https://www.slynyrd.com/blog/2018/2/15/pixelblog-2-texture)):

  - **Simplify:** Einzelheiten in schlichte, abstrakte Formen zerlegen. „Don't try to depict the fine details of every leaf and blade of grass.“
  - **Repetition:** „A good texture may only need a few simple clusters.“ Dieselben Cluster wiederholen, ihre Verteilung variieren.
  - **Balance:** Ein Detail hier verlangt meist ein Detail dort.
  - **Contrast:** Textur nur an ausgewählten Stellen, dazwischen leere Flächen, in denen sie mitgedacht wird.
  - **Avoid orphan pixels:** einzelne Pixel ohne Cluster derselben Farbe vermeiden.

  Saint11 sagt zu Steinen dasselbe: „avoid orphan pixels and adding too much noise“ ([Rock](https://saint11.art/img/pixel-tutorials/Rock.gif)).

  ![Drei graue Flächen aus je 2 × 2 Kacheln. A besteht aus zufällig verteilten Pixeln in vier Grautönen und flimmert. B zeigt Steine als zusammenhängende helle Flächen mit dunklen Fugen, jeder Stein hat oben links einen hellen und unten rechts einen dunklen Rand. C ist eine einzige glatte graue Fläche](/media/pixelart/schattieren-textur/detailgrad@2x.png "Zufallspixel (A), Steine aus Clustern mit Licht von oben links (B) und Fläche ohne Textur (C). Eigenes Schaubild")

  A hat viel „Detail“ und zeigt nichts. B hat weniger Töne in größeren Flächen, und jeder Stein ist ein Cluster mit einer eigenen kleinen Lichtseite: hell oben links, dunkel unten rechts, wie die ganze Szene. C zeigt nichts, ist aber ruhig. Als Boden unter einer Figur kann eine Mischung aus B und C besser tragen als B allein, weil die leeren Stellen dem Auge Pausen geben.

  Ein einzelner Stein als Textraster, Licht von oben links:

  ```text
  . . # # # # . .
  . # - - - + # .
  # - - + + + + #
  # - + + + + # #
  . # + + + # # .
  . . # # # # . .
  ```

  Dasselbe Prinzip gilt für andere Materialien. Für Holz bietet es sich an, lange Läufe in Richtung der Maserung zu setzen und nur wenige Astlöcher als Cluster. Gras entsteht aus kleinen Büscheln, die sich wiederholen, mit freier Fläche dazwischen. Bei Ziegeln rät Slynyrd, nicht jeden Ziegel zu zeichnen: „Depicting every single brick would appear noisy“, und die Fugen nicht zu betonen.

  ## Detailbudget: wie viel eine kleine Fläche trägt

  Auf 16 × 16 Pixeln hast du 256 Pixel für alles. Saint11 schreibt auf seiner Tafel zum Verkleinern: „as the resolution decreases you need to start choosing what details are important“ ([Resizing](https://saint11.art/img/pixel-tutorials/Resizing.gif)). An anderer Stelle: „good pixel art eliminates all unnecessary detail“ ([Basic structure](https://saint11.art/pixel_art_articles/article4/#basic-structure)). Derek Yu sagt über kleine Sprites: „Making small sprites is about making compromises. If you add an outline around something, you may lose the room to shade it.“ ([The 32 × 32 Sprite](https://www.derekyu.com/makegames/pixelart.html#small_sprite))

  Rechne nach: Eine Kiste von 10 × 10 Pixeln mit einem Pixel Kontur behält innen 8 × 8 = 64 Pixel. Für drei Seiten mit je einem Ton, ein paar Bretterfugen und einen Beschlag reicht das. Für Maserung, Nagelköpfe und Kratzer reicht es nicht. Eine Faustregel für dich: Ein Detail, das kleiner ist als ein Cluster von zwei Pixeln, liest sich bei 1× als Rauschen. Was du weglässt, entscheidest du nach der Frage, woran man das Objekt erkennt. Valve hielt für Team Fortress 2 fest: „High frequency detail is omitted where possible“ ([NPAR 2007](https://media.steampowered.com/apps/valve/2007/NPAR07_IllustrativeRenderingInTeamFortress2.pdf), Abschnitt 3).

  ## Konturen: schwarz, farbig oder Sel-out

  ![Ein schattiertes Tongefäß dreimal auf grünem Grund. A hat eine schwarze Kontur. B hat eine Kontur im dunkelsten Ton der Rampe, einem dunklen Violett. C hat eine Kontur, die auf der Lichtseite oben links fast verschwindet und unten rechts dunkelviolett ist](/media/pixelart/schattieren-textur/umrisse@2x.png "Schwarze Kontur (A), farbige dunkle Kontur (B) und Sel-out (C). Eigenes Schaubild")

  A trennt das Gefäß hart vom Grund. Derek Yu schreibt, eine rein schwarze Kontur gebe einem Sprite „an overall cartoony look“ und erzeuge „a lot of harsh segmentation“ ([Selective Outlining](https://www.derekyu.com/makegames/pixelart.html#selout)). B nimmt den dunkelsten Ton der eigenen Rampe. Saint11 rät: „use a dark color instead of black“ ([Outlines](https://saint11.art/img/pixel-tutorials/Outlines.gif)). Die Kontur gehört dann zum Material.

  C ist **Sel-out** (selective outlining). Derek Yu: „Selout means replacing a lot of the black outline with lighter colors.“ Oben, wo das Licht trifft, nimmt er die hellsten Töne oder lässt die Kontur ganz weg. Linien im Inneren, etwa für Muskeln oder Fell, zieht er mit dunklen Schattentönen statt Schwarz. Das Ergebnis wirkt weicher und naturalistischer.

  Welche Kontur passt, hängt vom Einsatz ab. Eine dunkle Kontur hält ein Sprite auf jedem Untergrund zusammen. Sel-out senkt den Kontrast auf der Lichtseite, und auf hellem Boden kann diese Kante mit dem Grund verschmelzen. Für Figuren in einem Spiel prüfst du das auf dem echten Boden, siehe [Umgebung und Tiles, die Figuren tragen](/pixelart/umgebung-tiles). Bei 16 × 16 Pixeln frisst jede Kontur Platz, Derek Yus Kompromiss von oben.

  > [!PRAXIS]
  > Derek Yu baut einen Sprite in festen Schritten: grobe Skizze, Kontur aufräumen, Grundfarben, Schattierung mit Kantenglättung, Sel-out, Feinschliff. Zwei Prüfungen empfiehlt er am Schluss: das Bild horizontal spiegeln, weil das Fehler in Proportionen und Schattierung zeigt, und die Farbe entfernen, „to see whether your shading still reads well“ ([Selective Outlining](https://www.derekyu.com/makegames/pixelart.html#selout)). Saint11 arbeitet bei der Schattierung von großen Farbclustern zu Details, und zwar mit wenigen Farben, um Banding gering zu halten ([Working with a photo reference](https://saint11.art/pixel_art_articles/article4/#working-with-a-photo-reference)).

  > [!INTERVIEW]
  > Im Portfolio-Review zeigt ein Art Lead auf deine Steinwand: „Das flimmert.“ Gute Antwort: Du nennst die Ursache – zu viele einzelne Pixel in zu vielen Tönen – und die Lösung: weniger Töne, Steine als Cluster mit Licht- und Schattenkante in der Richtung der Szene, leere Flächen dazwischen. Dann zeigst du vorher und nachher bei 1×. Wer die Kritik in Begriffe wie Cluster, verwaiste Pixel und Lichtrichtung übersetzt, zeigt, dass er sie versteht.

  ## Häufige Fehler

  - **Kissenschattierung.** Alle Ränder dunkler als die Mitte. Lichtrichtung festlegen, Ränder auf der Lichtseite hell lassen.
  - **Flache Seiten mit Verlauf.** Eine ebene Seite einer Kiste bekommt einen Ton, keine Rampe.
  - **Zufallsrauschen als Textur.** Streupixel flimmern. Cluster wiederholen, leere Flächen lassen.
  - **Dithering überall.** Auf kleinen Flächen verbraucht es Pixel für die Form. Für große Flächen und raue Oberflächen aufheben.
  - **Zu viel Detail.** Jede Fuge, jeder Grashalm. Bei 1× wird daraus Rauschen. Wichtiges behalten, Rest weglassen.
  - **Schwarze Kontur ohne Absicht.** Sie zerlegt die Form in harte Teile. Dunklen Rampenton nehmen oder Sel-out probieren.
  - **Sel-out ohne Untergrundtest.** Auf hellem Boden verschwindet die Lichtkante. Auf dem echten Hintergrund prüfen.

  ## Zusammenfassung

  - Erst die Lichtrichtung, dann die Flächen: Ebene Seiten bekommen einen Ton, runde Formen eine Rampe.
  - Kissenschattierung dunkelt nach der Kontur ab und verflacht die Form. Formschattierung folgt dem Licht.
  - Dithering mischt zwei Farben in einem Muster. Geordnet liest es sich als Verlauf, zufällig als Rauschen. Sparsam einsetzen.
  - Texturen entstehen aus wenigen wiederholten Clustern mit eigener Lichtkante und leeren Flächen dazwischen.
  - Eine kleine Fläche trägt wenig Detail. Behalte, woran man das Objekt erkennt.
  - Konturen: schwarz trennt hart, ein dunkler Rampenton gehört zum Material, Sel-out hellt die Lichtseite auf.
  - Prüf jedes Ergebnis bei 1×, gespiegelt und ohne Farbe.
exercises:
  - id: kissen-erkennen
    type: choice
    title: Kissen oder Form?
    prompt: |
      Welche Aussagen über die beiden Ovale treffen zu?

      ![Zwei graue Ovale. A wird in Ringen zur Kontur hin dunkler. B ist oben links hell und unten rechts dunkel](/media/pixelart/schattieren-textur/kissen-und-form@2x.png "Zwei Schattierungen derselben Form. Eigenes Schaubild")
    options:
      - text: A ist Kissenschattierung, weil alle Ränder dunkler werden, egal, woher das Licht kommt.
        correct: true
        why: Genau so beschreibt Saint11 Pillow Shading, ein allgemeiner Schatten entlang der Kontur ohne klare Lichtquelle.
      - text: In B verraten die schrägen Grenzen zwischen den Tönen, dass die Form rund ist und Licht von oben links bekommt.
        correct: true
        why: Die Tongrenzen laufen quer über die Form. Daraus liest das Auge Rundung und Richtung.
      - text: A wirkt plastischer, weil die Mitte am hellsten ist.
        correct: false
        why: Die helle Mitte ohne Richtung lässt die Form aufgeblasen und flach wirken. Plastik entsteht aus einer klaren Licht- und Schattenseite.
      - text: B braucht mehr Farben als A.
        correct: false
        why: Beide nutzen dieselben vier Grautöne und dieselbe Kontur. Der Unterschied liegt nur in der Verteilung.
    explanation: |
      Kissenschattierung erkennst du daran, dass die Helligkeit der Kontur folgt: Ringe, die nach außen dunkler werden. Formschattierung erkennst du an einer Lichtseite und einer Schattenseite. Mit denselben Farben ist das eine flach und das andere rund. Deshalb ist die erste Frage beim Schattieren immer die nach dem Licht.
    resources:
      - title: Saint11 · Basic Shading · Pillow shading
        url: https://saint11.art/pixel_art_articles/article4/#pillow-shading

  - id: dithering-wann
    type: choice
    title: Wann lohnt sich Dithering?
    prompt: |
      In welchen Fällen ist Dithering eine gute Wahl?
    options:
      - text: Ein großer Himmel soll mit zwei Blautönen sanft von oben nach unten heller werden.
        correct: true
        why: Große Flächen einer Farbe sind laut Derek Yu der Ort, an dem Dithering am besten wirkt.
      - text: Ein Erdboden soll rau und uneben aussehen.
        correct: true
        why: Für raue Oberflächen nennt Derek Yu Dithering ausdrücklich, etwa bei Erde.
      - text: Ein Sprite von 16 × 16 Pixeln soll mehr Detail bekommen.
        correct: false
        why: Auf so kleiner Fläche verbraucht ein Ditherband die Pixel, die die Form beschreiben. Detail entsteht dort aus wenigen klaren Clustern.
      - text: Eine Fläche soll mit einem Zufallspinsel Struktur bekommen.
        correct: false
        why: Zufällige Verteilung erzeugt verwaiste Pixel und Klumpen wie im Schaubild der Lektion, Feld C. Dithering ist ein Muster, kein Rauschen.
    explanation: |
      Dithering ersetzt eine fehlende Zwischenfarbe durch ein Muster aus zwei vorhandenen. Das lohnt sich dort, wo Platz für das Muster ist und ein Übergang oder eine raue Fläche gezeigt werden soll. Auf kleinen Sprites und als Ersatz für echte Form lohnt es sich nicht. Saint11 meidet es, wo er kann, Derek Yu setzt es sparsam ein.
    resources:
      - title: Derek Yu · Pixel Art Tutorial · Dithering
        url: https://www.derekyu.com/makegames/pixelart.html#dithering

  - id: schattier-ablauf
    type: order
    title: Eine Kiste schattieren
    prompt: |
      Bring die Arbeitsschritte zum Schattieren einer Kiste in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Die Lichtrichtung festlegen und notieren.
      Jede Seite der Kiste mit ihrem Grundton flächig füllen.
      Die Seite, die vom Licht abgewandt ist, im dunklen Ton der Rampe setzen.
      Einzelne Kanten und Fugen auf der Lichtseite mit dem helleren Ton der Seite absetzen.
      Die Kontur nach dem Licht anpassen, dunkel auf der Schattenseite.
      Die Kiste bei 1× und ohne Farbe ansehen.
    alternatives:
      - [1, 2, 4, 3, 5, 6]
    explanation: |
      Ohne Lichtrichtung weißt du nicht, welche Seite hell wird, deshalb steht sie am Anfang. Die Grundtöne füllen jede Seite flächig, wie Saint11 es für ebene Flächen beschreibt. Schatten und Lichtkanten bauen darauf auf. Die Kontur kommt danach, weil sie sich nach Licht und Schatten richtet. Die Prüfung bei 1× und ohne Farbe zeigt am Ende, ob die drei Seiten als Tonwerte getrennt sind.
    resources:
      - title: Saint11 · Basic Shading · Identifying Faces
        url: https://saint11.art/pixel_art_articles/article4/#identifying-faces

  - id: bayer-anteil
    type: output
    title: Wie viele helle Pixel bei 25 %?
    prompt: |
      Ein geordnetes Raster nach Bayer arbeitet mit Zellen von 4 × 4 Pixeln. Bei einer Helligkeit von 25 % ist ein Viertel der Pixel jeder Zelle hell. Wie viele helle Pixel hat eine Zelle? Antworte mit der Zahl.
    lang: text
    code: |
      Zelle:      4 × 4 Pixel
      Helligkeit: 25 %
    expected: |
      4
    accept:
      - 4 Pixel
      - 4 px
      - vier
    explanation: |
      Eine Zelle hat 16 Pixel, ein Viertel davon sind 4. Eine Bayer-Matrix von 4 × 4 kann so 17 Stufen von 0 bis 16 hellen Pixeln darstellen, also 15 Zwischenstufen zwischen den zwei reinen Farben, jede mit einem Pixel mehr. Die Matrix legt fest, in welcher Reihenfolge die Pixel hell werden, damit das Muster in jeder Stufe gleichmäßig verteilt bleibt.
    resources:
      - title: Aseprite Docs · Context Bar · Dithering options
        url: https://www.aseprite.org/docs/context-bar/#dithering-options

  - id: innenflaeche
    type: output
    title: Was bleibt innen?
    prompt: |
      Eine Kiste ist 10 × 10 Pixel groß und hat ringsum eine Kontur von einem Pixel. Wie viele Pixel bleiben innen für Farbe und Schattierung? Antworte mit der Zahl.
    lang: text
    code: |
      Kiste:   10 × 10 Pixel
      Kontur:  1 Pixel auf jeder Seite
    expected: |
      64
    accept:
      - 64 Pixel
      - 64 px
    hints:
      - Die Kontur nimmt links und rechts je einen Pixel weg, oben und unten ebenso.
    explanation: |
      Innen bleiben 8 × 8 = 64 Pixel, die Kontur belegt 36 der 100. Mehr als ein Drittel der Fläche geht also an die Kontur. Das ist Derek Yus Kompromiss in Zahlen: Wer eine Kontur setzt, hat weniger Platz für Schattierung. Bei kleinen Objekten lohnt es sich, die Kontur auf der Lichtseite wegzulassen.
    resources:
      - title: Derek Yu · Pixel Art Tutorial · The 32 × 32 Sprite
        url: https://www.derekyu.com/makegames/pixelart.html#small_sprite

  - id: waisen-zaehlen
    type: output
    title: Verwaiste Pixel zählen
    prompt: |
      Das Raster zeigt einen Ausschnitt einer Textur: `+` Mittelton, `-` hell, `#` dunkel. Wie viele Pixel haben keinen direkten Nachbarn (oben, unten, links, rechts) in derselben Farbe? Antworte mit der Zahl.
    lang: text
    code: |
      + + + + + + + +
      + - + + + - - +
      + + + # + + + +
      + + + + + + - +
    expected: |
      3
    accept:
      - 3 Pixel
      - drei
    hints:
      - Prüf nur die `-` und `#`. Die `+` hängen alle zusammen.
    explanation: |
      Verwaist sind das `-` in Zeile 2, Spalte 2, das `#` in Zeile 3 und das `-` in Zeile 4. Die beiden `-` nebeneinander in Zeile 2 bilden einen kleinen Cluster und zählen nicht. Drei Einzelpixel auf 32 sind fast ein Zehntel, das flimmert bei 1×. Fasst du die hellen Pixel zu zwei Clustern zusammen, liest sich die Fläche als Struktur.
    resources:
      - title: Slynyrd · Pixelblog 2 · Texture
        url: https://www.slynyrd.com/blog/2018/2/15/pixelblog-2-texture

  - id: begriffe-schattieren
    type: gap
    title: Begriffe zum Schattieren
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Werden alle Ränder einer Form ohne Rücksicht auf das Licht dunkler, spricht man von ⟦Kissenschattierung⟧. Zwei Farben in einem Muster zu mischen, damit ein Übergang entsteht, heißt ⟦Dithering⟧. Ein regelmäßiges Muster dafür liefert die ⟦Bayer⟧-Matrix. Eine Kontur, die auf der Lichtseite heller wird oder verschwindet, heißt ⟦Sel-out⟧. Texturen baut man aus wiederholten ⟦Clustern⟧ statt aus einzelnen Pixeln. Der Übergang zwischen Licht und Schatten auf einer Form heißt ⟦Terminator⟧.
    gaps:
      - label: falsche Schattierung
        hint: Auf Englisch „pillow shading“.
        accept: ["Pillow Shading", "Pillow-Shading", "Kissen-Schattierung"]
      - label: Mischmuster
        hint: Englisches Wort, auch im Deutschen üblich.
        accept: ["Dither", "Rastern"]
      - label: Matrix
        hint: Nach dem Erfinder benannt, fünf Buchstaben.
        accept: ["Bayer-Matrix"]
      - label: Kontur
        hint: Kurzform von „selective outlining“.
        accept: ["Selout", "selective outlining", "selektive Kontur"]
      - label: Bausteine
        hint: Zusammenhängende Pixel derselben Farbe.
        accept: ["Cluster", "Pixelgruppen"]
      - label: Lichtgrenze
        hint: Englischer Begriff, Saint11 hält ihn in Pixelart scharf.
        accept: ["Schattengrenze"]
    explanation: |
      Kissenschattierung und Formschattierung sind die zwei Arten, Helligkeit zu verteilen. Dithering und die Bayer-Matrix betreffen Übergänge mit wenigen Farben, Cluster die Bausteine von Textur. Sel-out und Terminator sind die Stellen, an denen sich Licht und Kontur treffen.
    resources:
      - title: Derek Yu · Pixel Art Tutorial · Selective Outlining
        url: https://www.derekyu.com/makegames/pixelart.html#selout

  - id: schattierplan-kissen
    type: bug
    title: Ein Stein wie ein Kissen
    prompt: |
      Arbeitsnotiz zu einer Szene mit mehreren Objekten. Im Bild wirkt eines davon aufgeblasen, als hätte es keine Kanten und läge in keinem Licht. Finde die Zeile.
    lang: prose
    code: |
      Lichtrichtung: oben links, für alle Objekte der Szene.
      Kiste: Oberseite hell, Front Mittelton, rechte Seite dunkel.
      Fass: hellster Streifen links von der Mitte, nach rechts dunkler werdend.
      Stein: jede Seite zur Kontur hin abgedunkelt, die Mitte am hellsten.
      Kontur aller Objekte: dunkelster Ton der Rampe, auf der Lichtseite eine Stufe heller.
    lines: [4]
    hints:
      - Welche Zeile nennt keine Richtung?
    explanation: |
      Zeile 4 beschreibt Kissenschattierung: Die Helligkeit folgt der Kontur, nicht dem Licht von oben links. Alle anderen Objekte haben eine Licht- und eine Schattenseite. Richtig wäre etwa: Oberseite und linke Kante hell, rechte untere Seite dunkel, Terminator scharf. Ein einzelnes Objekt mit Kissenschattierung fällt in einer sonst stimmigen Szene besonders auf, weil es das gemeinsame Licht bricht.
    resources:
      - title: Saint11 · Basic Shading · Pillow shading
        url: https://saint11.art/pixel_art_articles/article4/#pillow-shading

  - id: raster-klumpen
    type: bug
    title: Ein Klumpen im Schachbrett
    prompt: |
      Das 50-%-Raster soll gleichmäßig sein, damit es sich als Mittelton liest. Bei 1× fällt an einer Stelle ein dunkler Klumpen auf. Finde die Zeile.
    lang: text
    code: |
      # - # - # - # -
      - # - # - # - #
      # - # - # - # -
      - # - # # - - #
      # - # - # - # -
      - # - # - # - #
    lines: [4]
    hints:
      - In einem Schachbrett hat jeder Pixel nur diagonale Nachbarn derselben Farbe.
    explanation: |
      In Zeile 4 sind die Pixel in Spalte 5 und 6 vertauscht. Dadurch stehen zwei `#` nebeneinander, die auch die `#` darüber und darunter berühren, und zwei `-` bilden eine Lücke. Das Auge springt bei einem regelmäßigen Muster sofort auf jede Störung. Ein Raster mit einem Fehler wirkt schlechter als eine harte Kante, weil es die Aufmerksamkeit auf genau diese Stelle zieht.
    resources:
      - title: Derek Yu · Pixel Art Tutorial · Dithering
        url: https://www.derekyu.com/makegames/pixelart.html#dithering

  - id: detailgrad-erklaeren
    type: explain
    title: Rauschen, Stein, Fläche
    prompt: |
      Erkläre in drei bis fünf Sätzen, warum A bei 1× flimmert, B sich als Steinboden liest und wofür C trotzdem nützlich ist.

      ![Drei graue Flächen. A zufällige Pixel in vier Grautönen, B Steine als helle Cluster mit dunklen Fugen und Lichtkanten oben links, C eine glatte graue Fläche](/media/pixelart/schattieren-textur/detailgrad@2x.png "Drei Arten, eine Fläche zu füllen. Eigenes Schaubild")
    lang: prose
    code: |
      A: jeder Pixel zufällig einer von vier Grautönen
      B: Steine als Cluster, heller Rand oben links, dunkler unten rechts
      C: eine einzige graue Fläche
    points:
      - In A gehört fast kein Pixel zu einem Cluster derselben Farbe; verwaiste Pixel erzeugen Rauschen statt Formen.
      - In B ist jeder Stein ein Cluster mit eigener Licht- und Schattenkante in der Lichtrichtung der Szene.
      - B nutzt Wiederholung ähnlicher Formen, das Auge liest daraus ein Material.
      - C trägt keine Information, gibt aber Ruhe; Slynyrd lässt Flächen bewusst frei, damit Textur dort nur mitgedacht wird.
    explanation: |
      A hat die meisten Wechsel und zeigt am wenigsten: Fast jeder Pixel steht allein, und bei 1× bleibt nur Flimmern. B hat weniger Töne in größeren Flächen. Jeder Stein ist ein Cluster mit einer hellen Kante zum Licht und einer dunklen davon weg, und weil sich diese Form wiederholt, liest das Auge Stein. C ist leer, aber nicht nutzlos. Slynyrds Grundsatz „Contrast“ meint genau das: Textur an ausgewählten Stellen, dazwischen ruhige Flächen. Unter einer Figur ist eine solche Mischung oft besser als eine durchgehende Textur.
    resources:
      - title: Slynyrd · Pixelblog 2 · Texture
        url: https://www.slynyrd.com/blog/2018/2/15/pixelblog-2-texture

  - id: kugel-und-kiste
    type: practice
    title: Kugel und Kiste nach Form schattieren
    prompt: |
      Leg im Editor eine Leinwand von 32 × 32 Pixeln an. Zeichne eine Kugel und eine Kiste nebeneinander, beide mit derselben Rampe aus vier Tönen und Licht von oben links. Die Kugel bekommt einen Verlauf, jede Seite der Kiste genau einen Ton. Arbeite mit der Shading-Ink in Aseprite oder dem Shading-Werkzeug in Pixelorama, wenn du magst.
    lang: prose
    starter: |
      Programm:
      Rampe (vier Töne):
      Lichtrichtung:
      Was ich nach dem Test ohne Farbe geändert habe:
    checklist:
      - Die Lichtrichtung ist als kleiner Pfeil in einer eigenen Ebene eingezeichnet und im Export ausgeblendet.
      - Auf der Kugel liegt der hellste Ton oben links, der dunkelste unten rechts; kein Rand ist rundum dunkler als die Mitte.
      - Jede sichtbare Seite der Kiste hat genau einen Ton, und die drei Seiten unterscheiden sich im Tonwert.
      - Beide Objekte nutzen höchstens vier Töne plus Kontur, gezählt in der Palette.
      - Du hast das Bild ohne Farbe angesehen (Graustufen-Modus oder Entsättigen) und notiert, was du danach geändert hast.
      - Du hast das Bild gespiegelt angesehen und notiert, ob dir dabei etwas aufgefallen ist.
    explanation: |
      Kugel und Kiste sind die zwei Grundfälle: runde Form mit Rampe, ebene Seiten mit je einem Ton. Wer beide nach derselben Lichtrichtung schattiert, hat das Prinzip für jedes weitere Objekt. Der Test ohne Farbe und das Spiegeln sind Derek Yus Prüfungen. Sie zeigen Fehler, die du nach einer Stunde Arbeit nicht mehr siehst.
    resources:
      - title: Aseprite Docs · Shading
        url: https://www.aseprite.org/docs/shading/
      - title: Pixelorama · Shading · Color Replace
        url: https://pixelorama.org/user_manual/shading/#color-replace

  - id: steinkachel
    type: practice
    title: Eine Steinkachel aus Clustern
    prompt: |
      Zeichne eine Kachel von 16 × 16 Pixeln mit Steinen aus höchstens vier Grautönen. Jeder Stein ist ein Cluster mit heller Kante zum Licht oben links und dunkler Kante unten rechts. Lass mindestens eine Stelle ohne Textur. Sieh dir die Kachel in 2 × 2 Wiederholung an, mit Tiled Mode in Aseprite oder Tile Mode in Pixelorama.
    lang: prose
    starter: |
      Töne:
      Zahl der Steine:
      Verwaiste Pixel (Zahl und Grund):
      Was in der Wiederholung auffällt:
    checklist:
      - Die Kachel nutzt höchstens vier Töne.
      - Jeder Pixel hat mindestens einen direkten Nachbarn in derselben Farbe, Ausnahmen sind markiert und begründet.
      - Jeder Stein hat oben links eine helle und unten rechts eine dunkle Kante.
      - Mindestens eine Fläche von 3 × 3 Pixeln ist ohne Textur.
      - Du hast die Kachel in 2 × 2 Wiederholung bei 1× angesehen und notiert, was dir auffällt.
    hints:
      - Setz zuerst die Fugen als dunkle Linien, dann füll die Steine mit dem Mittelton und setz zuletzt die Lichtkanten.
    explanation: |
      Die Kachel übt Slynyrds Grundsätze auf kleiner Fläche: wenige Töne, wiederholte Formen, keine Waisen, freie Stellen. Die Lichtkante an jedem Stein verbindet die Textur mit dem Licht der Szene. Ob die Kachel an ihren Rändern nahtlos weiterläuft und wie du Wiederholung versteckst, vertieft [Umgebung und Tiles, die Figuren tragen](/pixelart/umgebung-tiles).
    resources:
      - title: Aseprite Docs · Tiled Mode
        url: https://www.aseprite.org/docs/tiled-mode/
      - title: Pixelorama · Canvas · Tile Mode
        url: https://pixelorama.org/user_manual/user_interface/canvas/#tile-mode

  - id: drei-konturen
    type: practice
    title: Dasselbe Gefäß, drei Konturen
    prompt: |
      Zeichne ein eigenes Gefäß, etwa eine Flasche oder einen Krug, auf 24 × 24 Pixeln und schattiere es mit Licht von oben links. Dupliziere die Ebene zweimal und gib den drei Fassungen verschiedene Konturen: schwarz, dunkelster Ton der eigenen Rampe, Sel-out. Lege unter alle drei nacheinander einen hellen und einen dunklen Hintergrund.
    lang: prose
    starter: |
      Gefäß:
      Auf hellem Grund fällt auf:
      Auf dunklem Grund fällt auf:
      Meine Wahl für dieses Objekt und warum:
    checklist:
      - Es gibt drei Fassungen in getrennten Ebenen, die sich nur in der Kontur unterscheiden.
      - In der Sel-out-Fassung ist die Kontur oben links heller als unten rechts oder fehlt dort.
      - Keine Fassung enthält in der Kontur reines Schwarz außer der ersten.
      - Du hast alle drei auf einem hellen und einem dunklen Grund angesehen und je eine Beobachtung notiert.
      - Deine Wahl ist mit einer Beobachtung zum Untergrund begründet, nicht mit „sieht besser aus“.
    explanation: |
      Die Kontur ist eine Entscheidung, keine Pflicht. Auf dunklem Grund kann eine schwarze Kontur verschwinden, auf hellem Grund die Lichtkante beim Sel-out. Wer das an einem eigenen Objekt gesehen hat, wählt später für Figuren und Requisiten bewusst. Welche Kontur dir gefällt, ist deine Sache; die Begründung über den Untergrund ist überprüfbar.
    resources:
      - title: Derek Yu · Pixel Art Tutorial · Selective Outlining
        url: https://www.derekyu.com/makegames/pixelart.html#selout
      - title: Saint11 · Outlines
        url: https://saint11.art/img/pixel-tutorials/Outlines.gif
