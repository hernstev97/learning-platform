lesson: |
  Du ziehst im Editor mit der Maus einen Bogen, so ruhig du kannst. In der Vergrößerung sieht er ordentlich aus. Bei 100 % zittert er: Hier sitzt eine Stufe zu viel, dort ein Pixel doppelt, und an einer Stelle knickt der Bogen, obwohl deine Hand gleichmäßig war. Bei einem Foto fällt das niemandem auf. Bei einem Sprite von 16 × 16 Pixeln hat das ganze Bild 256 Pixel, und jeder einzelne ist eine sichtbare Entscheidung.

  Dieses Modul übt die kleinste Ebene der Pixelart: wie Pixel zu Linien, Kurven und Flächen zusammenfinden. Du brauchst dafür keinen Rechner. Ein Bleistift und ein Heft mit Karopapier reichen, ein Kästchen ist ein Pixel. Am Handy liest du die Schaubilder und die Textraster in den Übungen. Den Editor richtest du im Modul [Einen Pixel-Editor wählen und einrichten](/pixelart/editor-einrichten) ein; dort setzt du dasselbe mit Maus und Tastatur um.

  ## Das Raster: eine Linie ist einen Pixel breit

  Eine Linie in Pixelart ist einen Pixel breit, und ihre Pixel berühren sich nur an den Ecken oder Kanten, nie doppelt. Pedro Medeiros (Saint11) nennt das eine „pixel perfect line, it's only 1 pixel wide and it connects diagonally“ ([An Absolute Beginner's Guide](https://saint11.art/pixel_art_articles/article1/#step-1-lines)). Er empfiehlt, mit 16 × 16 Pixeln anzufangen. Auf so kleiner Fläche lernst du schneller, weil jeder Fehler sofort auffällt.

  In den Übungen dieses Moduls stehen Pixel als Textraster, eine Zeile pro Pixelreihe:

  ```text
  # # # . . . . . . . . .
  . . . # # # . . . . . .
  . . . . . . # # # . . .
  . . . . . . . . . # # #
  ```

  `#` ist ein gesetzter Pixel, `.` ein leerer. Später kommen `+` für einen Mittelton und `-` für einen hellen Ton dazu. Auf Karopapier füllst du die Kästchen aus. Zeichne zuerst leicht, dann dunkel nach, sobald die Linie stimmt.

  > [!TIP] Karopapier im Bus
  > Ein kleines Heft mit 5-mm-Karos passt in jede Jackentasche. Rahme dir ein Feld von 16 × 16 Kästchen ein. Größer brauchst du für dieses Modul nicht, und so ein Feld füllst du zwischen zwei Haltestellen.

  ## Gerade Linien: Läufe und Steigungen

  Ein **Lauf** ist eine Folge von Pixeln in derselben Reihe oder Spalte. Die Linie oben besteht aus vier Läufen zu je drei Pixeln. Weil alle Läufe gleich lang sind, wirkt sie gerade. Saint11 fasst die Regel für gerade Linien so: Jede Stufe hat „the same number of pixels“ ([Fundamentals 2](https://saint11.art/img/pixel-tutorials/Fundamentals2.gif)).

  ![Vier Linien im Pixelraster. A steigt mit Läufen von einem Pixel diagonal, B mit Läufen von zwei Pixeln, C mit Läufen von drei Pixeln, D mit Läufen von 3, 1, 2, 1, 3 und 2 Pixeln, die unruhig wirken](/media/pixelart/linien-cluster/steigungen@2x.png "Läufe von 1, 2 und 3 Pixeln (A–C) und eine Linie mit ungleichen Läufen (D). Eigenes Schaubild")

  Die Steigung einer Linie ergibt sich aus der Lauflänge. Läufe von einem Pixel ergeben 45° (A), Läufe von zwei Pixeln das Verhältnis 2 : 1 (B), von drei Pixeln 3 : 1 (C). D hat keine feste Lauflänge. Derek Yu nennt solche Stellen **Jaggies**: „single pixels or small segments of pixels that break up the consistency of a line“ ([Pixel Art Tutorial](https://www.derekyu.com/makegames/pixelart.html#jaggies)). Das Auge liest den Rhythmus der Läufe und stolpert über jede Unregelmäßigkeit.

  Nicht jeder Winkel hat eine ganze Lauflänge. Eine Linie, die auf 9 Pixel Breite 6 Reihen steigt, braucht im Schnitt 1,5 Pixel pro Lauf. Dann wiederholst du ein Muster: 2, 1, 2, 1, 2, 1. Ein regelmäßiges Muster wirkt ebenfalls gerade, weil der Rhythmus gleich bleibt. Unruhig wird es erst, wenn das Muster bricht.

  Mit der Maus triffst du keinen Winkel sauber. Setz Anfang und Ende und lass das Programm verbinden. In Aseprite zieht Shift eine Gerade vom zuletzt gesetzten Pixel, mit Ctrl dazu rastet der Winkel ein ([Keyboard Shortcuts](https://www.aseprite.org/docs/keyboard-shortcuts/#action-modifiers)). Pixelorama und LibreSprite haben ein Linienwerkzeug. Wähl die Endpunkte so, dass Breite und Höhe ein sauberes Verhältnis ergeben: 12 breit und 4 hoch ergibt Läufe von drei Pixeln. 12 breit und 5 hoch geht nicht auf; dann bleibt ein Muster aus benachbarten Zahlen wie 2, 3, 2, 3, 2, das Saint11 „non-ideal but useful“ nennt.

  > [!MERKE]
  > Gerade heißt in Pixelart: gleich lange Läufe oder ein Muster, das sich regelmäßig wiederholt.

  ## Kurven: Läufe, die stetig wachsen oder schrumpfen

  Eine Kurve ist eine Linie, deren Steigung sich ändert. In Pixeln heißt das: Die Läufe werden von Stufe zu Stufe länger oder kürzer. Saint11 schreibt, „each step should be smaller than the previous“ ([Fundamentals 2](https://saint11.art/img/pixel-tutorials/Fundamentals2.gif)), wenn eine Kurve abflacht oder steiler wird.

  ![Zwei ansteigende Kurven im Pixelraster. A hat von unten links nach oben rechts die Läufe 1, 1, 1, 2, 3, 4. B hat die Läufe 1, 2, 1, 3, 1, 4 und wirkt bucklig](/media/pixelart/linien-cluster/kurven-laufstrecken@2x.png "Stetige Läufe (A) und springende Läufe (B), beide 12 Pixel breit. Eigenes Schaubild")

  Beide Kurven in der Abbildung sind 12 Pixel breit und 6 Reihen hoch. A wird gleichmäßig flacher: 1, 1, 1, 2, 3, 4. B springt zwischen kurzen und langen Läufen: 1, 2, 1, 3, 1, 4. Jeder Sprung von lang zu kurz ist ein Knick, und B sieht aus wie eine Treppe mit Buckeln. Zum Prüfen zählst du die Läufe und schreibst sie als Zahlenfolge auf. Steigt oder fällt die Folge ohne Ausreißer, ist die Kurve glatt. Gleiche Läufe hintereinander sind erlaubt, sie sind ein Stück gerader Linie in der Kurve.

  Kreise und Ellipsen sind zusammengesetzte Kurven. Oben und unten liegen die langen Läufe, an den Seiten die kurzen. Ein Kreis wirkt rund, wenn alle vier Viertel dieselbe Folge haben, gespiegelt.

  ### Doppelpixel: wo die Linie dicker wird

  Zieht deine Hand eine Kurve, entstehen fast immer Ecken in L-Form: An einer Stufe sitzt ein Pixel zusätzlich, der eine waagerechte und eine senkrechte Verbindung herstellt. Die Linie ist an dieser Stelle zwei Pixel dick.

  ![Zwei Viertelbögen im Pixelraster. A enthält fünf orange markierte Pixel, die an den Stufen L-förmige Ecken bilden. B ist derselbe Bogen ohne diese Pixel](/media/pixelart/linien-cluster/doppelte-pixel@2x.png "Doppelpixel orange markiert (A) und bereinigter Bogen (B). Eigenes Schaubild")

  Saint11 nennt Jaggies „unintentional corners that appear in pixel art, usually when making natural hand movements“ ([Article 2](https://saint11.art/pixel_art_articles/article2/#step-3-fix-jaggies-and-add-detail)). Das Wort „unintentional“ zählt: Eine Ecke, die du willst, etwa an einer Kiste, ist kein Fehler. Editoren haben dafür einen Pixel-perfect-Modus. Pixelorama beschreibt ihn als „automatically removing the middle pixel of L-shapes“ ([Pixel perfect](https://pixelorama.org/user_manual/drawing/#pixel-perfect)), Aseprite schaltet ihn in der Kontextleiste des Stifts an ([Pixel-perfect mode](https://www.aseprite.org/docs/context-bar/#pixel-perfect-mode)).

  > [!WARNING] Pixel-perfect nur für Linien
  > Der Modus entfernt beim Zeichnen Pixel aus L-Formen. Malst du mit dem Stift eine Fläche oder einen Cluster in mehreren Strichen, fehlen danach Pixel. Schalte ihn für Konturen ein und für Flächen aus, oder füll Flächen mit dem Füllwerkzeug.

  ## Cluster und verwaiste Pixel

  Ein **Cluster** ist eine zusammenhängende Gruppe von Pixeln derselben Farbe. Aus Clustern entstehen Formen: ein Lichtfleck, ein Schatten, ein Stein. Ein **verwaister Pixel** (Orphan Pixel) steht allein. Saint11 definiert ihn als Pixel, der „not part of a bigger group of pixels of the same color and are not part of the anti-alias“ ist ([Article 1](https://saint11.art/pixel_art_articles/article1/)), Raymond Schlitter (Slynyrd) als „single pixel units not connected to a cluster of the same color“ ([Pixelblog 2](https://www.slynyrd.com/blog/2018/2/15/pixelblog-2-texture)).

  ![Zwei schattierte Kugeln im Pixelraster, Licht von oben links. A enthält viele einzelne Pixel in fremden Tönen, die wie Schmutz wirken. B hat dieselben vier Töne in zusammenhängenden Flächen](/media/pixelart/linien-cluster/cluster@2x.png "Verwaiste Pixel (A) und saubere Cluster (B) bei gleicher Palette. Eigenes Schaubild")

  Beide Kugeln nutzen dieselben vier Töne. In A sind rund ein Fünftel der Pixel durch einen Nachbarton ersetzt. Im Zoom wirkt das wie Struktur, bei 1× wie Rauschen oder Schmutz, und die Form der Kugel wird unscharf. In B folgen die Cluster der Rundung: Die Grenze zwischen zwei Tönen läuft als Kurve über die Kugel. Damit gelten die Regeln für Linien auch für Flächen: Die Kante eines Clusters ist eine Linie und sollte glatte Läufe haben.

  Eine schnelle Prüfung: Jeder Pixel berührt mindestens einen Nachbarn in derselben Farbe. Ausnahmen setzt du bewusst, etwa ein Glanzlicht im Auge oder einen Pixel zur Kantenglättung.

  ## Banding: wenn sich eine Kante verdoppelt

  Beim Schattieren entsteht ein Fehler, den beide Standardquellen verschieden fassen. cure schreibt auf Pixel Joint: „Banding, most simply, is when pixels line up.“ ([The Pixel Art Tutorial](https://pixeljoint.com/forum/forum_posts.asp?TID=11299)) Saint11: „Banding happens when we have multiple color bands that are clearly distinct from one another.“ ([Anti-Alias and Banding](https://saint11.art/pixel_art_articles/article5/#banding)) Beide meinen dieselbe Wirkung: Tonstreifen laufen parallel nebeneinander her, und das Auge sieht statt einer Fläche ein Bündel Linien.

  ![Eine schräge Kante mit Läufen von zwei Pixeln. In A läuft direkt darunter ein mittelgrauer Streifen mit genau denselben Stufen. In B liegt der mittelgraue Ton als eigene Fläche unten links mit einer steileren Grenze](/media/pixelart/linien-cluster/banding@2x.png "Banding (A): Der Mittelton wiederholt die Stufen der Kante. Getrennte Schattenform (B). Eigenes Schaubild")

  In A wiederholt der Mittelton jede Stufe der dunklen Kante. Das liest sich wie eine zwei Pixel dicke, verwaschene Linie. In B ist der Mittelton eine eigene Form mit einer anderen Steigung. Die Kante bleibt scharf, und der Schatten wirkt wie ein Schatten. Banding beseitigst du, indem du Clusterbreiten variierst, die Grenze zwischen zwei Tönen in einem anderen Winkel führst oder zwei Bänder zu einem zusammenfasst.

  ## Kantenglättung von Hand

  Eine Stufe zwischen zwei Läufen bleibt sichtbar, auch wenn die Läufe stimmen. **Kantenglättung** (Anti-Aliasing, AA) setzt Zwischentöne in die Stufen, damit die Kante weicher wirkt ([Derek Yu: Anti-aliasing](https://www.derekyu.com/makegames/pixelart.html#aa)). Saint11 erklärt in [What is alias](https://saint11.art/pixel_art_articles/article5/#what-is-alias-and-why-people-dont-like-it), woher die harten Stufen kommen.

  ![Ein dunkler Hügel vor hellem Grund. A hat harte Stufen. B hat an den Stufen einzelne mittel- und hellgraue Pixel, die den Übergang weicher machen](/media/pixelart/linien-cluster/kantenglaettung@2x.png "Ohne Kantenglättung (A) und mit Zwischentönen an den Stufen (B). Eigenes Schaubild")

  Drei Regeln helfen. Erstens: Lange Läufe bekommen längere Übergänge, kurze Läufe meist keinen. Zweitens: Der Zwischenton sitzt auf der Seite der Stufe, die die Kurve verlängert. Drittens: Weniger ist mehr. Glättest du jede Stufe, verschwimmt die Form wie in einem verkleinerten Foto. Programme glätten Formen und Pinselstriche automatisch. In Pixelart ist das meist abgeschaltet, weil du jeden Zwischenton selbst wählen willst.

  An der Außenkante eines Sprites ist Kantenglättung heikel. Der Zwischenton mischt die Figurfarbe mit einer Hintergrundfarbe. Läuft die Figur später über Gras, Stein und Wasser, passt dieser Mischton nur auf einem Untergrund und wirkt auf den anderen wie ein heller oder dunkler Saum. Innerhalb der Figur, zwischen zwei bekannten Farben, gibt es dieses Problem nicht.

  > [!PRAXIS]
  > Pixel Artists trennen Skizze und Reinzeichnung. Erst setzen sie die Form grob, oft in einer eigenen Ebene, dann ziehen sie in einem zweiten Durchgang die Linien sauber: Läufe angleichen, Doppelpixel entfernen, Knicke glätten. Saint11 zeigt diesen Schritt in [Article 2](https://saint11.art/pixel_art_articles/article2/#step-3-fix-jaggies-and-add-detail) als eigene Phase „fix jaggies and add detail“. Für dich heißt das: Erwarte nicht, dass der erste Strich stimmt. Plane den Aufräumdurchgang ein.

  > [!INTERVIEW]
  > Im Art-Test eines Studios oder im Portfolio-Gespräch fragt jemand: „Warum wirkt dieser Bogen zittrig?“ Gute Antwort: Du zählst die Läufe und zeigst, wo die Folge springt oder wo ein Doppelpixel die Linie verdickt. Dann sagst du, wie du es behebst: Läufe stetig machen, L-Ecken entfernen, Kantenglättung nur an langen Läufen. Wer Pixel in Läufen beschreibt statt mit „sieht komisch aus“, zeigt, dass er sein Handwerk versteht.

  ## Häufige Fehler

  - **Freihand mit der Maus.** Lange Linien und Bögen entstehen mit dem Linienwerkzeug oder mit Shift-Klick, nicht mit einem Zug der Hand.
  - **Doppelpixel.** L-Ecken machen eine Linie stellenweise doppelt so dick. Pixel-perfect für Konturen einschalten oder von Hand entfernen.
  - **Springende Läufe in Kurven.** Schreib die Lauflängen als Zahlenfolge auf. Ein Ausreißer ist ein Knick.
  - **Winkel ohne Muster.** Wähl Endpunkte so, dass Breite und Höhe ein sauberes Verhältnis ergeben, oder nimm ein regelmäßiges Muster wie 2, 1, 2, 1.
  - **Verwaiste Pixel als „Detail“.** Einzelne Pixel lesen sich bei 1× als Rauschen. Detail entsteht aus Clustern.
  - **Banding.** Tonstreifen, die den Stufen einer Kante folgen, verdoppeln die Kante. Den Schatten als eigene Form anlegen.
  - **Zu viel Kantenglättung.** Jede Stufe zu glätten macht die Form weich und unscharf, an der Außenkante entsteht ein Saum.
  - **Nur im Zoom geprüft.** Was bei 800 % ordentlich aussieht, kann bei 100 % zittern. Prüf jedes Zwischenergebnis in Originalgröße.

  ## Zusammenfassung

  - Eine Pixellinie ist einen Pixel breit und verbindet sich diagonal, ohne Doppelpixel.
  - Gerade Linien haben gleich lange Läufe oder ein regelmäßiges Muster. Die Lauflänge bestimmt die Steigung.
  - Kurven haben Läufe, die stetig länger oder kürzer werden. Ein Sprung in der Folge ist ein Knick.
  - Jaggies sind ungewollte Ecken. Gewollte Ecken an harten Formen sind keine Fehler.
  - Cluster sind zusammenhängende Pixel einer Farbe, verwaiste Pixel stehen allein und wirken als Rauschen.
  - Banding entsteht, wenn Tonstreifen parallel zur Kante laufen. Schattenformen brauchen eigene Grenzen.
  - Kantenglättung setzt Zwischentöne an langen Läufen, sparsam und vorsichtig an der Außenkante.
exercises:
  - id: pixellinie-merkmale
    type: choice
    title: Was macht eine saubere Pixellinie aus?
    prompt: |
      Welche Aussagen über Linien in Pixelart stimmen?
    options:
      - text: Eine saubere Linie ist einen Pixel breit, und ihre Pixel verbinden sich diagonal oder an den Kanten, nie doppelt.
        correct: true
        why: Genau so beschreibt Saint11 die „pixel perfect line“. Jeder zusätzliche Pixel an einer Stufe verdickt die Linie.
      - text: Eine Linie mit den Läufen 2, 1, 2, 1, 2, 1 wirkt gerade, weil sich das Muster regelmäßig wiederholt.
        correct: true
        why: Das Auge liest den Rhythmus. Für Winkel ohne ganze Lauflänge ist ein wiederholtes Muster die saubere Lösung.
      - text: Jede Ecke in einer Kontur ist ein Jaggy und muss entfernt werden.
        correct: false
        why: Jaggies sind ungewollte Ecken. Die Kante einer Kiste oder die Spitze eines Dachs sind gewollt.
      - text: Kantenglättung an jeder Stufe macht eine Linie in Pixelart immer besser.
        correct: false
        why: Zu viel Glättung macht die Form weich und unscharf. Zwischentöne gehören an lange Läufe, sparsam.
    explanation: |
      Eine Pixellinie wird über ihre Läufe gelesen. Gleich lange Läufe oder ein regelmäßiges Muster ergeben eine gerade Linie, jede Unregelmäßigkeit ist ein Jaggy. Ob eine Ecke ein Fehler ist, hängt davon ab, ob du sie willst. Kantenglättung ist ein Werkzeug für bestimmte Stellen, keine Pflicht für jede Stufe.
    resources:
      - title: Saint11 · An Absolute Beginner's Guide · Lines
        url: https://saint11.art/pixel_art_articles/article1/#step-1-lines

  - id: kurven-vergleichen
    type: choice
    title: Welche Kurve ist glatter?
    prompt: |
      Sieh dir das Schaubild an. Beide Kurven sind 12 Pixel breit und 6 Reihen hoch. Welche Aussage trifft zu?

      ![Zwei ansteigende Kurven im Pixelraster. A hat von unten links nach oben rechts die Läufe 1, 1, 1, 2, 3, 4. B hat die Läufe 1, 2, 1, 3, 1, 4](/media/pixelart/linien-cluster/kurven-laufstrecken@2x.png "Zwei Kurven mit gleicher Breite und Höhe. Eigenes Schaubild")
    options:
      - text: A ist glatter, weil die Läufe ohne Ausreißer länger werden.
        correct: true
        why: Die Folge 1, 1, 1, 2, 3, 4 steigt stetig. Die Kurve flacht gleichmäßig ab.
      - text: B ist glatter, weil die Läufe abwechslungsreicher sind.
        correct: false
        why: Abwechslung ist hier das Problem. Jeder Sprung von einem langen zu einem kurzen Lauf ist ein Knick.
      - text: Beide sind gleich glatt, weil sie gleich viele Pixel haben.
        correct: false
        why: Die Zahl der Pixel ist gleich, ihre Verteilung nicht. Glätte hängt an der Reihenfolge der Läufe.
      - text: B ist glatter, weil sie mit dem längsten Lauf endet.
        correct: false
        why: Auch A endet mit dem längsten Lauf. Entscheidend ist, was dazwischen passiert.
    explanation: |
      Eine Kurve ist eine Linie mit sich ändernder Steigung. In Pixeln bedeutet das Läufe, die stetig länger oder kürzer werden. B wechselt dreimal zwischen kurz und lang und bekommt dadurch drei Buckel. Zum Prüfen schreibst du die Läufe als Zahlenfolge auf, das geht auch ohne Bild.
    resources:
      - title: Saint11 · Fundamentals 2 (Linien und Kurven)
        url: https://saint11.art/img/pixel-tutorials/Fundamentals2.gif

  - id: linie-aufraeumen
    type: order
    title: Eine Kontur aufräumen
    prompt: |
      Du hast eine Kontur grob gesetzt und willst sie sauber ziehen. Bring die Schritte in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Die grobe Form in einer eigenen Ebene oder leicht mit Bleistift setzen.
      Die Läufe jedes Abschnitts zählen und als Zahlenfolge notieren.
      Springende Läufe angleichen, bis jede Folge stetig steigt oder fällt.
      Doppelpixel an den Stufen entfernen.
      Die Kontur in Originalgröße ansehen.
      An langen Läufen sparsam Zwischentöne setzen.
    explanation: |
      Erst brauchst du die Form, sonst räumst du etwas auf, das sich noch ändert. Läufe zählen kommt vor dem Angleichen, weil du erst danach weißt, welcher Lauf ausreißt. Doppelpixel entfernst du nach dem Angleichen, weil sich beim Verschieben neue L-Ecken bilden können. Die Prüfung in Originalgröße zeigt, ob noch etwas zittert. Kantenglättung kommt zuletzt, denn sie verdeckt Fehler im Verlauf, statt sie zu beheben.
    resources:
      - title: Saint11 · Article 2 · Fix jaggies and add detail
        url: https://saint11.art/pixel_art_articles/article2/#step-3-fix-jaggies-and-add-detail

  - id: lauflaenge-steigung
    type: output
    title: Wie lang ist jeder Lauf?
    prompt: |
      Eine gerade Linie soll von links unten nach rechts oben 12 Pixel breit und 4 Reihen hoch werden, mit gleich langen Läufen. Wie viele Pixel hat jeder Lauf? Antworte mit der Zahl.
    lang: text
    code: |
      Breite: 12 Pixel
      Höhe:    4 Reihen
      Läufe:   alle gleich lang
    expected: |
      3
    accept:
      - 3 Pixel
      - 3 px
      - drei
    hints:
      - Jede Reihe enthält genau einen Lauf.
    explanation: |
      Vier Reihen heißen vier Läufe, und zusammen müssen sie 12 Pixel breit sein: 12 ÷ 4 = 3. Das ergibt die Steigung 3 : 1. Wählst du 12 breit und 5 hoch, geht die Rechnung nicht auf, und die Linie bekommt ungleiche Läufe. Deshalb lohnt es sich, Endpunkte vorher so zu wählen, dass die Teilung aufgeht.
    resources:
      - title: Aseprite Docs · Keyboard Shortcuts · Action modifiers (Shift-Linie)
        url: https://www.aseprite.org/docs/keyboard-shortcuts/#action-modifiers

  - id: laeufe-ablesen
    type: output
    title: Läufe ablesen
    prompt: |
      Notiere die Lauflängen dieser Kurve von unten links nach oben rechts, getrennt durch Leerzeichen.
    lang: text
    code: |
      . . . . . . . . # # # #
      . . . . . # # # . . . .
      . . . # # . . . . . . .
      . . # . . . . . . . . .
      . # . . . . . . . . . .
      # . . . . . . . . . . .
    expected: |
      1 1 1 2 3 4
    accept:
      - 1, 1, 1, 2, 3, 4
      - 1,1,1,2,3,4
      - 111234
    hints:
      - Fang in der untersten Reihe an. Jede Reihe ist ein Lauf.
    explanation: |
      Von unten gelesen hat jede Reihe einen Lauf: 1, 1, 1, 2, 3, 4. Die Folge steigt ohne Ausreißer, die Kurve flacht also gleichmäßig ab. Die drei Einer am Anfang sind ein Stück 45°-Linie, das ist erlaubt. Diese Zahlenfolge ist das Werkzeug, mit dem du jede Kurve prüfst, auch ohne sie zu sehen.
    resources:
      - title: Saint11 · Fundamentals 2 (Linien und Kurven)
        url: https://saint11.art/img/pixel-tutorials/Fundamentals2.gif

  - id: kurvenbreite
    type: output
    title: Wie breit wird der Bogen?
    prompt: |
      Ein Bogen fällt von oben links nach unten rechts. Seine waagerechten Läufe sind von oben nach unten 5, 3, 2, 1, 1, jeder Lauf in einer eigenen Reihe. Wie viele Pixel ist der Bogen breit? Antworte mit der Zahl.
    lang: text
    code: |
      Läufe von oben: 5, 3, 2, 1, 1
      jeder Lauf: eine Reihe
    expected: |
      12
    accept:
      - 12 Pixel
      - 12 px
    hints:
      - Die Läufe liegen nebeneinander versetzt, ihre Längen addieren sich.
    explanation: |
      Jeder Lauf beginnt eine Spalte rechts vom Ende des vorigen. Die Breite ist also die Summe: 5 + 3 + 2 + 1 + 1 = 12. Höhe: fünf Reihen. Mit dieser Rechnung planst du auf Karopapier, wie viel Platz ein Bogen braucht, bevor du das erste Kästchen füllst.

  - id: begriffe-linien
    type: gap
    title: Fachbegriffe der Pixellinie
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Eine Folge von Pixeln in derselben Reihe oder Spalte heißt ⟦Lauf⟧. Eine ungewollte Ecke, die den Fluss einer Linie stört, nennen Pixel Artists ⟦Jaggy⟧. Ein Pixel, der allein steht und zu keiner Gruppe seiner Farbe gehört, ist ein ⟦verwaister⟧ Pixel. Eine zusammenhängende Gruppe von Pixeln derselben Farbe heißt ⟦Cluster⟧. Zwischentöne, die eine Stufe weicher machen, nennt man ⟦Kantenglättung⟧. Laufen Tonstreifen parallel zur Kante, spricht man von ⟦Banding⟧.
    gaps:
      - label: Pixelfolge
        hint: Kurzes deutsches Wort, man „läuft“ an einer Linie entlang.
        accept: ["Run", "Läufe"]
      - label: ungewollte Ecke
        hint: Englisches Wort, verwandt mit „gezackt“.
        accept: ["Jaggies", "Zacke"]
      - label: allein stehender Pixel
        hint: Auf Englisch „orphan“.
        accept: ["orphan", "einzelner", "verwaiste"]
      - label: Pixelgruppe
        hint: Englisches Wort, auch im Deutschen üblich.
        accept: ["Klumpen", "Cluster-Fläche"]
      - label: weiche Stufen
        hint: Auf Englisch „Anti-Aliasing“.
        accept: ["Anti-Aliasing", "Antialiasing", "AA"]
      - label: parallele Tonstreifen
        hint: Englisches Wort, darin steckt „band“.
        accept: ["Bänderung", "Streifenbildung"]
    explanation: |
      Mit diesen sechs Begriffen kannst du jede kleine Pixelfläche beschreiben. Läufe bestimmen Steigung und Glätte einer Linie, Jaggies und verwaiste Pixel sind die häufigsten Störungen. Cluster sind die Bausteine von Flächen, Kantenglättung und Banding zwei Seiten derselben Frage: wie Töne an einer Kante zusammenkommen.
    resources:
      - title: Derek Yu · Pixel Art Tutorial · Jaggies
        url: https://www.derekyu.com/makegames/pixelart.html#jaggies

  - id: doppelpixel-finden
    type: bug
    title: Hier wird die Linie dicker
    prompt: |
      Die Linie soll aus vier Läufen zu je drei Pixeln bestehen. An einer Stelle wirkt sie bei 1× dicker. Finde die Zeile.
    lang: text
    code: |
      # # # . . . . . . . . .
      . . # # # # . . . . . .
      . . . . . . # # # . . .
      . . . . . . . . . # # #
    lines: [2]
    hints:
      - Vergleiche, wo jeder Lauf beginnt und wo der vorige endet.
    explanation: |
      Der erste Lauf endet in Spalte 3, der zweite beginnt ebenfalls in Spalte 3. Der Pixel ganz links in Zeile 2 sitzt direkt unter dem letzten Pixel der ersten Reihe und bildet eine L-Ecke. Ohne ihn hat Zeile 2 genau drei Pixel und beginnt diagonal versetzt, wie die anderen. Genau diesen Pixel entfernt der Pixel-perfect-Modus beim Zeichnen.
    resources:
      - title: Pixelorama · Drawing · Pixel perfect
        url: https://pixelorama.org/user_manual/drawing/#pixel-perfect

  - id: knick-finden
    type: bug
    title: Der Bogen hat einen Buckel
    prompt: |
      Der Bogen soll von oben rechts nach unten links gleichmäßig steiler werden. Er hat aber einen Buckel. Finde die beiden Zeilen, deren Läufe nicht zur Folge passen.
    lang: text
    code: |
      . . . . . . . . # # # #
      . . . . . . # # . . . .
      . . . # # # . . . . . .
      . . # . . . . . . . . .
      . # . . . . . . . . . .
      # . . . . . . . . . . .
    lines: [2, 3]
    hints:
      - Schreib die Lauflängen von oben nach unten als Zahlenfolge auf.
      - In einem gleichmäßig steiler werdenden Bogen wird kein Lauf länger als sein Vorgänger.
    explanation: |
      Die Läufe sind von oben 4, 2, 3, 1, 1, 1. Nach der 2 kommt eine 3, der Bogen wird also kurz flacher und dann wieder steiler. Tauschst du die Läufe von Zeile 2 und 3, ergibt sich 4, 3, 2, 1, 1, 1, eine stetig fallende Folge. Die Breite bleibt 12 Pixel, nur die Verteilung ändert sich.
    resources:
      - title: Saint11 · Fundamentals 2 (Linien und Kurven)
        url: https://saint11.art/img/pixel-tutorials/Fundamentals2.gif

  - id: cluster-diagnose
    type: choice
    title: Rauschen oder Form?
    prompt: |
      Beide Kugeln nutzen dieselben vier Töne und dieselbe Lichtrichtung. Welche Aussagen treffen zu?

      ![Zwei schattierte Kugeln im Pixelraster. A enthält viele einzelne Pixel in fremden Tönen. B hat dieselben Töne in zusammenhängenden Flächen](/media/pixelart/linien-cluster/cluster@2x.png "Zwei Kugeln mit gleicher Palette. Eigenes Schaubild")
    options:
      - text: In A stehen viele Pixel allein in einem fremden Ton. Bei 1× wirken sie wie Schmutz.
        correct: true
        why: Das sind verwaiste Pixel. Im Zoom wirken sie wie Struktur, in Originalgröße als Rauschen.
      - text: In B folgen die Grenzen zwischen den Tönen der Rundung der Kugel.
        correct: true
        why: Die Cluster bilden Bänder, die sich um die Form legen. So liest man die Kugel als rund.
      - text: A hat mehr Detail und ist deshalb die bessere Wahl für ein kleines Sprite.
        correct: false
        why: Einzelne Pixel sind kein Detail, sondern Rauschen. Detail entsteht aus Clustern mit lesbarer Form.
      - text: Der Unterschied verschwindet bei 1×, weil die Kugeln dann zu klein sind.
        correct: false
        why: Gerade bei 1× fällt Rauschen auf, weil das Auge die Form nicht mehr aus einzelnen Pixeln zusammensetzt.
    explanation: |
      Cluster sind die Bausteine einer Fläche. Ihre Kanten sind Linien und sollten der Form folgen. Verwaiste Pixel zerstören diese Kanten und lassen die Form flimmern. Prüf deshalb, ob jeder Pixel mindestens einen Nachbarn derselben Farbe hat, und setz Ausnahmen wie ein Glanzlicht bewusst.
    resources:
      - title: Slynyrd · Pixelblog 2 · Texture
        url: https://www.slynyrd.com/blog/2018/2/15/pixelblog-2-texture

  - id: banding-erklaeren
    type: explain
    title: Zwei Schatten an derselben Kante
    prompt: |
      Beide Raster zeigen dieselbe dunkle Kante (`#`) über einer hellen Fläche (`-`) mit einem Mittelton (`+`). Erkläre in drei bis fünf Sätzen, warum A verwaschen wirkt und B nicht.
    lang: text
    code: |
      A
      # # . . . . . . . . . .
      + + # # . . . . . . . .
      - - + + # # . . . . . .
      - - - - + + # # . . . .
      - - - - - - + + # # . .
      - - - - - - - - + + # #

      B
      # # . . . . . . . . . .
      - - # # . . . . . . . .
      - - - - # # . . . . . .
      + - - - - - # # . . . .
      + + - - - - - - # # . .
      + + + - - - - - - - # #
    points:
      - In A folgt der Mittelton jeder Stufe der Kante mit derselben Lauflänge, die Pixel liegen parallel.
      - Dadurch liest das Auge in A eine doppelt dicke, unscharfe Kante statt einer Kante und einer Fläche.
      - In B ist der Mittelton eine eigene Form mit anderer Steigung, die Kante bleibt einen Pixel breit.
      - Abhilfe gegen Banding sind andere Winkel, verschiedene Clusterbreiten oder weniger Bänder.
    explanation: |
      A ist ein Lehrbuchfall von Banding: Der Mittelton läuft im Gleichschritt mit der dunklen Kante, jede Stufe wiederholt sich eine Reihe tiefer. cure fasst das als „pixels line up“, Saint11 als deutlich getrennte Farbbänder. Das Ergebnis ist eine Kante, die doppelt so dick und weich wirkt. In B hat der Mittelton eine steilere Grenze und sitzt als eigene Schattenform unten links. Die Kante bleibt scharf, und der Schatten beschreibt die Form, statt die Linie zu verdoppeln.
    resources:
      - title: Saint11 · Anti-Alias and Banding · Banding
        url: https://saint11.art/pixel_art_articles/article5/#banding

  - id: linien-karopapier
    type: practice
    title: Linien und ein Kreis auf Karopapier
    prompt: |
      Rahme auf Karopapier vier Felder von 16 × 16 Kästchen ein. Zeichne ins erste Feld je eine Linie mit Läufen von 1, 2 und 3 Kästchen, ins zweite eine Linie mit dem Muster 2, 1, 2, 1. Ins dritte setzt du einen Kreis mit 12 Kästchen Durchmesser. Ins vierte ziehst du freihändig eine Welle und räumst sie danach nach den Regeln der Lektion auf. Notiere unter jeder Kurve die Lauffolge eines Viertels.
    lang: prose
    checklist:
      - Jede gerade Linie hat durchgehend gleiche Läufe oder ein Muster ohne Bruch.
      - Keine Linie und kein Kreis enthält eine L-Ecke.
      - Die vier Viertel des Kreises haben dieselbe Lauffolge, gespiegelt, und du hast sie notiert.
      - Die Welle hat nach dem Aufräumen in jedem Bogen eine stetig steigende oder fallende Lauffolge.
      - Du hast das Blatt aus einem Meter Abstand angesehen und notiert, welche Stelle dir dann noch auffällt.
    hints:
      - Für den Kreis zeichnest du zuerst ein Viertel und überträgst die Läufe dann gespiegelt auf die anderen drei.
    explanation: |
      Auf Papier musst du jede Stufe bewusst setzen, es gibt kein Werkzeug, das sie für dich glättet. Das trainiert genau das Lesen in Läufen, das du später im Editor brauchst. Der Abstand von einem Meter ersetzt die Ansicht bei 1×: Was dann noch auffällt, stört auch im Spiel.
    resources:
      - title: Saint11 · An Absolute Beginner's Guide
        url: https://saint11.art/pixel_art_articles/article1/

  - id: kugel-cluster
    type: practice
    title: Eine Kugel aus drei Tönen
    prompt: |
      Zeichne auf Karopapier in ein Feld von 16 × 16 Kästchen eine Kugel mit Kontur. Leg die Lichtrichtung fest und markiere sie mit einem Pfeil. Schattiere mit drei Tönen: leer für hell, schraffiert für mittel, ausgefüllt für dunkel. Prüf danach jeden Pixel und räum auf.
    lang: prose
    checklist:
      - Die Lichtrichtung ist eingezeichnet, und der hellste Bereich liegt auf ihrer Seite.
      - Jeder Pixel eines Tons berührt mindestens einen Pixel desselben Tons, Ausnahmen hast du markiert und begründet.
      - Keine Grenze zwischen zwei Tönen verläuft über mehr als drei Stufen parallel zur Kontur.
      - Die Kontur ist ein Kästchen breit und hat keine Doppelpixel.
      - Du hast notiert, welche Stelle du beim Aufräumen geändert hast und warum.
    explanation: |
      Die Kugel verbindet alles aus diesem Modul: eine runde Kontur aus Läufen, Cluster statt Rauschen und Tongrenzen, die der Form folgen statt der Kontur. Das dritte Kriterium ist eine schnelle Prüfung auf Banding. Wie Licht auf einer Kugel genau verteilt ist, vertieft das Modul [Licht, Schatten und Tonwerte](/pixelart/licht-werte); wie du schattierst, ohne dass es wie ein Kissen aussieht, zeigt [Schattieren, Dithering, Textur und Detailgrad](/pixelart/schattieren-textur).
    resources:
      - title: Saint11 · Basic Shading
        url: https://saint11.art/pixel_art_articles/article4/
