id: linien-cluster
title: Linien, Kurven und Cluster
level: 2
minutes: 110
summary: Warum eine Linie, die du mit der Maus ziehst, in Pixeln zittrig wirkt, wie du gerade Linien und Kurven aus gleichmäßigen Läufen baust und wie Cluster, Kantenglättung und Banding entscheiden, ob eine kleine Fläche ruhig oder verrauscht aussieht – geübt auf Karopapier und an Schaubildern.
place: unterwegs
goals:
  - Du liest eine Pixellinie als Folge von Läufen und erkennst, ob sie gleichmäßig ist.
  - Du baust gerade Linien in sauberen Steigungen und Kurven mit stetig wachsenden oder schrumpfenden Läufen.
  - Du findest Doppelpixel, Knicke und verwaiste Pixel und erklärst, warum sie bei 1× stören.
  - Du unterscheidest Cluster von Rauschen und erkennst Banding in einer Schattierung.
  - Du setzt Kantenglättung von Hand an die Stufen einer Kante, statt sie dem Programm zu überlassen.
