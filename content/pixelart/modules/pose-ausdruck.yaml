id: pose-ausdruck
title: Pose, Körpersprache und Ausdruck in wenigen Pixeln
level: 2
minutes: 100
summary: Wie eine Figur im Standbild zeigt, ob sie selbstbewusst, verschlossen oder bereit ist, warum kleine Bilder übertriebene Posen brauchen und wie zwei Augenpixel, eine Braue und ein Mund in einem Kopf von 10 × 10 Pixeln einen Ausdruck tragen.
place: unterwegs
goals:
  - Du liest Haltungen als offen, verschlossen oder bereit und benennst die Körpermerkmale, die das zeigen.
  - Du prüfst eine Pose auf Handlungslinie, Schwerpunkt und Stützfläche.
  - Du übertreibst eine Pose so weit, dass jede Änderung als kleines Bild mindestens einen Pixel ausmacht.
  - Du baust Ausdrücke aus Augen, Brauen, Mund und Kopfneigung und sagst, welche Pixel welche Wirkung tragen.
  - Du machst Zustände wie bereit, verletzt oder erschöpft als Einzelbild lesbar, ohne Bewegung.
  - Du skizzierst unterwegs Haltungen in 30-Sekunden-Gesten und benennst jede mit einem Wort.
