lesson: |
  Du zeichnest eine Figur, die erschöpft ist. Auf Papier hängen die Schultern, der Kopf sinkt nach vorn, die Lider sind halb geschlossen. Im Sprite ist der Kopf zehn Pixel groß, jedes Auge ein einziger Pixel. Von der Erschöpfung bleibt nichts übrig, die Figur steht da wie jede andere. Kleine Bilder verzeihen keine leisen Posen: Was sich um weniger als einen Pixel ändert, sieht niemand.

  Dieses Modul zeigt, wie du Haltung und Ausdruck so deutlich machst, dass sie in wenigen Pixeln ankommen. Es bleibt beim Standbild, einer einzelnen Pose. Wie sich eine Figur von einer Pose in die nächste bewegt, mit Timing und Schlüsselposen, ist Thema des Animationskurses. Du brauchst Stift, Heft und Karopapier, die Übungen gehen am Handy.

  ## Haltung im Standbild: offen, verschlossen, bereit

  Eine Haltung liest man zuerst an der Silhouette, lange bevor man ein Gesicht erkennt. Das Schaubild zeigt drei Haltungen derselben Gliederpuppe, nur als schwarze Fläche.

  ![Drei schwarze Silhouetten. A steht breitbeinig und aufrecht, die Hände in den Hüften, zwischen Armen und Rumpf liegen zwei Lücken. B ist schmal, der Kopf hängt nach vorn und zur Seite, die Arme liegen vor dem Körper, die Knie zeigen nach innen. C steht im weiten Ausfallschritt, der Rumpf ist geneigt, ein Arm ist angewinkelt erhoben, die Faust auf Schulterhöhe, der andere verschwindet vor dem Rumpf](/media/pixelart/pose-ausdruck/haltung@2x.png "Offen (A), verschlossen (B), bereit (C). Eigenes Schaubild")

  Drei Merkmale tragen den Unterschied: Breite, Höhe und Richtung.

  - **A nimmt Raum ein.** Die Füße stehen breit, die Ellbogen zeigen nach außen, der Kopf sitzt hoch. Die zwei Lücken zwischen Armen und Rumpf machen die Hände in den Hüften lesbar; wie Negativraum eine Pose zeigt, steht in [Silhouette und Formensprache](/pixelart/silhouette-formsprache).
  - **B macht sich klein.** Der Kopf ist gesenkt und zur Seite gekippt, die Arme liegen vor dem Körper, die Knie zeigen nach innen. Die Silhouette ist schmal und hat kaum Lücken.
  - **C senkt den Schwerpunkt.** Die Füße stehen weit auseinander, ein Knie ist gebeugt, die Arme sind vor dem Körper erhoben. Die Figur kann in jede Richtung losgehen.

  „Offen“, „verschlossen“ und „bereit“ sind Lesarten, keine festen Bedeutungen. Arme vor dem Körper können Abwehr heißen, Kälte oder Konzentration, der Zusammenhang entscheidet. Ob eine Haltung so ankommt, wie du willst, prüfst du an echten Menschen und bei Betrachtern, nicht an einer Tabelle.

  ## Handlungslinie, Schwerpunkt und Stützfläche

  Eine Pose hat eine Richtung. Proko beschreibt sie als Linie: „There is always one main line that shows the directional flow of the pose.“ Er rät: „Start by finding the longest action line of the body“, und: „Don't use anything more complicated than a C curve, S curve, or straight“ ([How to Draw Gesture](https://www.proko.com/course-lesson/how-to-draw-gesture)). Diese **Handlungslinie** zeichnest du zuerst, Kopf und Glieder hängst du daran.

  Im Schaubild steht A fast senkrecht, die Linie ist eine Gerade. In B kippt der Kopf aus der Senkrechten, die Linie krümmt sich zu einem C. In C läuft eine lange Diagonale vom weit gestellten Fuß bis zum Kopf. Eine Diagonale liest sich als Spannung oder Bewegung, eine Senkrechte als Ruhe; vergleich dazu A und C. Proko warnt auch vor dem Gegenteil: „The tendency for us is to make things symmetrical, but this stiffens the gesture and makes the figure look like a snowman.“

  Zum Gewicht gehören zwei Begriffe. Der **Schwerpunkt** ist der Punkt, um den sich das Gewicht der Figur verteilt; bei einer stehenden Figur liegt er etwa im Becken. Die **Stützfläche** ist die Fläche unter und zwischen den Füßen. Liegt der Schwerpunkt über ihr, steht die Figur. Liegt er daneben, kippt sie oder ist in Bewegung, etwa beim Schieben oder Laufen. Wie du das an einer Gliederpuppe misst und welche Rolle das Standbein spielt, behandelt [Figur, Geste und Proportion](/pixelart/figur-proportion) ausführlich. Für dieses Modul reicht eine Prüfung: Zieh vom Becken eine senkrechte Linie nach unten. Trifft sie zwischen die Füße, steht die Figur ruhig.

  ## Übertreibung: Posen für kleine Bilder

  Proko schreibt über Gesten: „It's a good idea to exaggerate the pose to tell a better story.“ In Pixelart wird aus dem Rat eine Notwendigkeit. Raymond Schlitter (Slynyrd) stellt fest: „Within the limited restrictions of pixel art, the human form is often stylized and deformed.“ Und: „Big-headed, or doll-like features tend to read well and capture a lot of expression“ ([Pixelblog 17](https://www.slynyrd.com/blog/2019/5/21/pixelblog-17-human-anatomy)). Für Figuren in Draufsicht nimmt der Kopf bei wenig Platz meist ein Drittel bis die Hälfte des Sprites ein, damit die Gesichtszüge noch Persönlichkeit zeigen können ([Pixelblog 22](https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites)).

  Rechne es dir vor. Eine Figur ist 24 Pixel hoch, ihr Kopf 8. Senkst du den Kopf in der Skizze „ein wenig“, wandert er vielleicht einen halben Pixel. Im Sprite passiert dann nichts oder ein einzelner Pixel springt, und die Figur wirkt fehlerhaft statt müde. Damit der gesenkte Kopf ankommt, setzt du ihn zwei Pixel tiefer und einen nach vorn, ziehst die Schultern eine Reihe herunter und lässt die Arme länger hängen. Auf Papier sieht das übertrieben aus. Im Sprite liest es sich als Müdigkeit.

  > [!MERKE]
  > Was sich um weniger als einen Pixel ändert, sieht niemand. Übertreib eine Pose, bis jede Änderung mindestens einen Pixel ausmacht, und prüf sie dann als Silhouette.

  ## Ausdruck mit wenigen Pixeln: Augen, Brauen, Mund

  Ein Kopf von 10 × 10 Pixeln hat innerhalb der Kontur rund 50 Pixel. Davon trägt eine Handvoll den Ausdruck.

  ![Vier runde Köpfe von 10 × 10 Pixeln mit dunkler Kontur. A hat zwei einzelne Punktaugen. B hat dieselben Augen und darüber zwei schräge Brauen, die zur Mitte hin abfallen, dazu einen kleinen Mund. C hat Augen aus je zwei Pixeln übereinander und einen offenen Mund aus 2 × 2 Pixeln. D hat waagerechte Strichaugen aus je zwei Pixeln und einen kleinen Mund](/media/pixelart/pose-ausdruck/gesichter@2x.png "Neutral (A), wütend (B), überrascht (C), müde (D). Eigenes Schaubild")

  So sieht Kopf B als Textraster aus. `#` ist die Kontur und alles Dunkle, `-` die Haut, `+` der Mund:

  ```text
  . . . # # # # . . .
  . # # - - - - # # .
  . # - - - - - - # .
  # - # - - - - # - #
  # - - # - - # - - #
  # - - # - - # - - #
  # - - - - - - - - #
  . # - - + + - - # .
  . # # - - - - # # .
  . . . # # # # . . .
  ```

  Die Augen sitzen in der sechsten Reihe, je ein Pixel. Darüber steigen die Brauen von außen nach innen ab und stoßen auf die Augen. Gegenüber A kommen sechs Pixel dazu, vier für die Brauen, zwei für den Mund. C ändert ebenfalls sechs Pixel: Die Augen wachsen um je einen Pixel nach oben, der Mund öffnet sich zu einem Quadrat. D braucht nur vier: Jedes Auge wird ein waagerechter Strich, dazu der Mund.

  Daraus folgen Faustregeln, die du an jedem Betrachter überprüfen kannst:

  - **Brauen** tragen die meiste Wirkung. Fallen sie zur Mitte hin ab, liest man Wut. Steigen sie zur Mitte hin an, liest man Sorge oder Trauer. Waagerecht oder fehlend ist neutral.
  - **Augen** zeigen Wachheit. Höhere Augen wirken aufgerissen, Striche geschlossen oder müde. Saint11 schreibt: „Shiny and dark eyes have a very strong puppy effect“ ([Cuteness](https://saint11.art/img/pixel-tutorials/Cuteness.gif)).
  - **Mund**: kein Mund, ein Strich oder eine Öffnung. Ein offener Mund ist die stärkste Änderung.
  - **Kopfneigung** verstärkt alles. Ein gesenkter Kopf macht aus müden Augen Erschöpfung.

  Ein einzelner Pixel kann den Ausdruck kippen: Rückt ein Brauenpixel eine Reihe höher oder tiefer, ändert sich die Lesart. Gesichtspixel brauchen außerdem Abstand im Tonwert zur Haut, sonst verschwinden sie bei 1×; wie du Tonwerte planst, steht in [Licht, Schatten und Tonwerte](/pixelart/licht-werte). Und manchmal ist für ein Gesicht kein Platz. Saint11 schreibt zum Verkleinern: „Sometimes you need to let go of some details, like the face in this example“ ([Resizing Pixel Art](https://saint11.art/img/pixel-tutorials/Resizing.gif)). Dann trägt die Pose den Ausdruck allein.

  > [!NOTE] Leitlinien, keine Regeln
  > Unter seiner Tafel zu niedlichen Figuren schreibt Saint11: „These are NOT rules, just guidelines.“ Das gilt für Gesichter genauso. Ob dein Gesicht wütend oder nur streng wirkt, sagt dir nur ein Betrachter, der die Absicht nicht kennt.

  ## Zustände als Einzelbild: bereit, verletzt, erschöpft

  Im Spiel muss eine Figur oft einen Zustand zeigen, ohne dass Text dabeisteht. Als Einzelbild heißt das: eine Pose und ein Gesicht, die zusammenpassen. Die Tabelle ist ein Vorschlag zum Ausprobieren, keine Vorschrift:

  | Zustand | Körper | Gesicht |
  | --- | --- | --- |
  | bereit | Schwerpunkt tief, Füße weit, Arme vorn | Augen offen, Brauen gerade |
  | verletzt | Gewicht auf einer Seite, eine Hand an der getroffenen Stelle | Augen zusammengekniffen, Mund schief |
  | erschöpft | Schultern tief, Kopf vor und unten, Arme hängen | Strichaugen, Mund offen |

  Achte auf die Symmetrie. „Bereit“ und „erschöpft“ dürfen fast symmetrisch sein, „verletzt“ nicht: Eine Figur, die eine Seite schützt, verlagert ihr Gewicht. Prüf jeden Zustand erst als Silhouette und setz das Gesicht zuletzt. Lässt sich der Zustand ohne Gesicht nicht erraten, hilft das Gesicht nur wenig.

  Im Kampf zählen Gegnerposen doppelt. Eine Pose kann einen Angriff ankündigen, ein **Telegraph**; welche Kanäle es dafür gibt und wie lange sie dauern, behandelt [Gegnermuster und Telegraphing](/combat/gegnermuster). Und im Hitstop, dem kurzen Anhalten beim Treffer, sieht der Spieler ein Standbild, deshalb zählt jede Pose, die dort stehen bleibt ([Trefferfeedback](/combat/trefferfeedback)). Wie die Figur in diese Posen hinein- und wieder herauskommt, ist Thema des Animationskurses.

  > [!PRAXIS] Grobe Formen vor der Linie
  > Raymond Schlitter beginnt Posen nicht mit Konturen: „Before making the wireframe I find it helpful to throw down some very rough forms that capture the essence of the pose.“ Und für kleine Sprites: „With practice you might develop the confidence to skip right to the last step of blocking out the final form, especially if it's a small sprite“ ([Pixelblog 17](https://www.slynyrd.com/blog/2019/5/21/pixelblog-17-human-anatomy)). Saint11 skizziert sogar Bewegungen erst als Silhouetten, damit die Aktion „easy to read“ bleibt ([Character Design 1](https://saint11.art/img/pixel-tutorials/Silhouette.gif)). Grobe Formen zuerst, Gesicht zuletzt: So arbeiten beide.

  ## Unterwegs beobachten: Haltungen in 30 Sekunden

  Posen lernst du an echten Menschen am schnellsten, und im Bus, in der Bahn oder in einer Warteschlange stehen sie dir Modell. Proko beschreibt typische Sitzungen im Schnellzeichnen „with poses ranging from 30 seconds to 10 minutes per pose“. Für unterwegs reichen 30 Sekunden pro Haltung:

  1. Die Handlungslinie: eine Gerade, ein C oder ein S.
  2. Kopf und Füße als Punkte auf der Linie.
  3. Schultern und Becken als zwei kurze Striche. Ihre Neigung zeigt das Gewicht.
  4. Darunter ein Wort für die Haltung: „wartet“, „müde“, „ungeduldig“.

  Danach fragst du dich, welcher Strich dich zu diesem Wort gebracht hat. Das ist die Übung: Haltung sehen und benennen, was sie trägt. Zuhause bieten [Line of Action](https://line-of-action.com/) und [Quickposes](https://quickposes.com/en) Fotos von Posen mit Zeitvorgabe, auch am Handy. Wie du Verhältnisse misst und Referenzen nutzt, ohne abzupausen, übst du in [Beobachten, Messen und Referenzen](/pixelart/beobachten).

  > [!TIP] Haltungen, keine Gesichter
  > Zeichne im Bus Haltungen, nicht Gesichter, und fotografiere niemanden ohne Erlaubnis. Für die Übung brauchst du nur Linie, Kopf, Schultern, Becken und Füße. Wer merkt, dass er gezeichnet wird, ändert seine Haltung.

  > [!INTERVIEW]
  > Manche Studios vergeben vor einer Zusammenarbeit eine bezahlte Probearbeit; Snow Day Games nannte das in einer inzwischen geschlossenen Anzeige „Paid test commission to ensure shared artistic vision“ ([Stellenanzeige](https://workwithindies.com/careers/snow-day-games-2d-technical-pixel-artist)). Eine typische Frage dazu: „Wie zeigst du in einer Figur von 24 Pixeln Höhe, dass sie erschöpft ist?“ Gute Antwort: Erst die Pose, dann das Gesicht. Du senkst Kopf und Schultern um ganze Pixel, lässt die Arme hängen und krümmst die Handlungslinie nach vorn. Du prüfst die Pose als Silhouette bei 1×, dann setzt du Strichaugen und einen offenen Mund. Du sagst auch, wie du es testest: Jemand, der den Zustand nicht kennt, soll ihn benennen.

  ## Häufige Fehler

  - **Leise Posen.** Änderungen unter einem Pixel verschwinden. Übertreib, bis jede Änderung sichtbar ist.
  - **Steif und symmetrisch.** Beide Seiten gleich, Linie senkrecht: ein Schneemann. Gib der Pose eine Richtung.
  - **Ausdruck nur im Gesicht.** Der Körper steht neutral, das Gesicht soll alles tragen. Bei 1× sieht man zuerst die Haltung.
  - **Zu viele Gesichtspixel.** Brauen, Augen und Mund verschmelzen zu einem Fleck. Weniger Pixel, klarer gesetzt.
  - **Gesicht ohne Kontrast.** Augen im Tonwert der Haut verschwinden. Plane einen deutlichen Abstand.
  - **Schwerpunkt ungewollt daneben.** Die Figur soll stehen, kippt aber. Lot vom Becken prüfen.
  - **Arme vor dem Körper, wo sie lesbar sein sollen.** In der Silhouette sind sie weg. Lücken lassen.
  - **Zustand nur über Farbe.** Rot für verletzt geht in Graustufen verloren. Die Pose muss den Zustand allein tragen können.

  ## Zusammenfassung

  - Eine Haltung liest man zuerst an der Silhouette: Breite, Höhe und Richtung tragen offen, verschlossen und bereit.
  - Die Handlungslinie ist eine Gerade, ein C oder ein S. Sie kommt zuerst, Kopf und Glieder hängen daran.
  - Liegt der Schwerpunkt über der Stützfläche, steht die Figur; liegt er daneben, kippt sie oder bewegt sich.
  - Kleine Bilder brauchen Übertreibung, jede Änderung muss mindestens einen Pixel ausmachen.
  - In einem Kopf von 10 × 10 Pixeln tragen vier bis sechs Pixel den Ausdruck. Brauen wirken am stärksten.
  - Zustände wie bereit, verletzt und erschöpft prüfst du erst als Silhouette, das Gesicht kommt zuletzt.
  - Haltungen lernst du unterwegs in 30-Sekunden-Gesten: Linie, Kopf, Schultern, Becken, Füße und ein Wort.
exercises:
  - id: haltung-lesen
    type: choice
    title: Welche Haltung zieht sich zurück?
    prompt: |
      Welches Feld zeigt eine verschlossene Haltung, und woran erkennst du sie?

      ![Drei schwarze Silhouetten. A steht breitbeinig mit den Händen in den Hüften. B ist schmal, mit gesenktem Kopf, Armen vor dem Körper und Knien nach innen. C steht im weiten Ausfallschritt mit erhobenen Armen](/media/pixelart/pose-ausdruck/haltung@2x.png "Drei Haltungen derselben Puppe. Eigenes Schaubild")
    options:
      - text: B, weil der Kopf gesenkt ist, die Arme vor dem Körper liegen und die Knie nach innen zeigen.
        correct: true
        why: Die Figur macht sich schmal und klein. Ihre Silhouette hat kaum Lücken.
      - text: A, weil die Hände in den Hüften den Körper abschließen.
        correct: false
        why: A nimmt Raum ein, die Ellbogen zeigen nach außen, der Stand ist breit. Das liest sich offen.
      - text: C, weil die Arme vor dem Körper Abwehr zeigen.
        correct: false
        why: Die Arme sind erhoben, der Stand ist weit, der Schwerpunkt tief. Die Figur ist bereit, nicht zurückgezogen.
      - text: Keines, ohne Gesicht lässt sich keine Haltung lesen.
        correct: false
        why: Alle drei sind nur Silhouetten, und trotzdem unterscheiden sie sich deutlich. Haltung liest man vor dem Gesicht.
    explanation: |
      Verschlossene Haltungen nehmen wenig Raum ein: Kopf gesenkt, Arme vor dem Körper, Beine zusammen. Offene breiten sich aus, bereite senken den Schwerpunkt und stellen die Füße weit. Diese Lesarten sind Konventionen, die du an Menschen selbst überprüfen kannst. Dass sie schon als Silhouette funktionieren, zeigt, wie viel die Pose vor jedem Gesichtspixel erzählt.
    resources:
      - title: Proko · How to Draw Gesture
        url: https://www.proko.com/course-lesson/how-to-draw-gesture

  - id: gesicht-diagnose
    type: choice
    title: Welche Pixel machen wütend?
    prompt: |
      Welches Feld zeigt Wut, und welche Pixel tragen sie?

      ![Vier runde Köpfe von 10 × 10 Pixeln. A mit Punktaugen. B mit Punktaugen und zur Mitte abfallenden Brauen, dazu ein kleiner Mund. C mit hohen Augen und offenem Mund. D mit Strichaugen und kleinem Mund](/media/pixelart/pose-ausdruck/gesichter@2x.png "Vier Köpfe mit 10 × 10 Pixeln. Eigenes Schaubild")
    options:
      - text: B, die Brauen fallen zur Mitte hin ab.
        correct: true
        why: Vier Brauenpixel über den Augen genügen. Zur Mitte abfallende Brauen liest man als Wut.
      - text: C, die hohen Augen und der offene Mund.
        correct: false
        why: Aufgerissene Augen und ein offener Mund lesen sich als Überraschung.
      - text: D, die Strichaugen.
        correct: false
        why: Striche wirken wie geschlossene oder halb geschlossene Augen, also müde.
      - text: A, die Punktaugen ohne Mund.
        correct: false
        why: A ist die neutrale Ausgangslage, an der man die anderen misst.
    explanation: |
      In kleinen Köpfen tragen die Brauen am meisten. Dieselben Punktaugen wirken neutral oder wütend, je nachdem, ob darüber zwei schräge Pixelreihen sitzen. Augenhöhe und Mundöffnung verschieben die Lesart zu Überraschung, Striche zu Müdigkeit. Weil so wenige Pixel so viel tragen, entscheidet jeder einzelne.
    resources:
      - title: Saint11 · Cuteness
        url: https://saint11.art/img/pixel-tutorials/Cuteness.gif

  - id: pose-aufbau
    type: order
    title: Eine Pose aufbauen
    prompt: |
      Bring die Schritte, mit denen du eine Pose als Standbild aufbaust, in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Die Haltung in einem Wort festlegen.
      Die Handlungslinie als Gerade, C- oder S-Kurve ziehen.
      Kopf und Füße auf die Linie setzen und die Stützfläche markieren.
      Prüfen, ob der Schwerpunkt über der Stützfläche liegt.
      Rumpf und Glieder ansetzen und die Pose übertreiben.
      Die Silhouette füllen und auf Armlänge prüfen.
      Zuletzt Augen, Brauen und Mund setzen.
    alternatives:
      - [1, 2, 3, 5, 4, 6, 7]
    explanation: |
      Das Wort ist der Maßstab, an dem du am Ende prüfst. Die Handlungslinie gibt der Pose ihre Richtung, bevor Einzelteile sie steif machen können. Den Schwerpunkt prüfst du, sobald Kopf und Füße stehen, weil sich danach alles daran ausrichtet. Übertrieben wird, solange die Pose noch aus groben Formen besteht. Der Silhouettentest kommt vor dem Gesicht, denn ein Gesicht rettet keine Pose, die als Fläche nichts sagt.
    resources:
      - title: Slynyrd · Pixelblog 17 · Human Anatomy
        url: https://www.slynyrd.com/blog/2019/5/21/pixelblog-17-human-anatomy

  - id: pixel-unterschied
    type: output
    title: Von neutral zu müde
    prompt: |
      Oben steht Kopf A (neutral), unten Kopf D (müde). Wie viele Pixel musst du ändern, um aus A das Gesicht D zu machen? Antworte mit der Zahl.
    lang: text
    code: |
      A
      . . . # # # # . . .
      . # # - - - - # # .
      . # - - - - - - # .
      # - - - - - - - - #
      # - - - - - - - - #
      # - - # - - # - - #
      # - - - - - - - - #
      . # - - - - - - # .
      . # # - - - - # # .
      . . . # # # # . . .

      D
      . . . # # # # . . .
      . # # - - - - # # .
      . # - - - - - - # .
      # - - - - - - - - #
      # - - - - - - - - #
      # - # # - - # # - #
      # - - - - - - - - #
      . # - - + + - - # .
      . # # - - - - # # .
      . . . # # # # . . .
    expected: |
      4
    accept:
      - 4 Pixel
      - 4 px
      - vier
    hints:
      - Vergleiche Zeile für Zeile. Nur zwei Zeilen unterscheiden sich.
    explanation: |
      In Zeile 6 wird jedes Auge um einen Pixel nach außen zum Strich verlängert, das sind zwei Pixel. In Zeile 8 kommt ein Mund aus zwei Pixeln dazu. Zusammen vier Pixel von rund hundert, und der Ausdruck kippt von neutral zu müde. Darum setzt du Gesichtspixel einzeln und mit Absicht, nie mit einem breiten Pinsel.
    resources:
      - title: Saint11 · Cuteness
        url: https://saint11.art/img/pixel-tutorials/Cuteness.gif

  - id: schwerpunkt-verschieben
    type: output
    title: Die Figur kippt
    prompt: |
      Eine Figur steht mit den Füßen in den Spalten 3 bis 4 und 9 bis 10. Die Stützfläche reicht also von Spalte 3 bis Spalte 10. Ihr Schwerpunkt liegt in Spalte 13, sie wirkt, als kippe sie nach rechts. Um wie viele Spalten muss der Schwerpunkt mindestens nach links wandern, damit er über der Stützfläche liegt? Antworte mit der Zahl.
    lang: text
    code: |
      linker Fuß:   Spalten 3–4
      rechter Fuß:  Spalten 9–10
      Schwerpunkt:  Spalte 13
    expected: |
      3
    accept:
      - 3 Spalten
      - 3 Pixel
      - 3 px
      - drei
    explanation: |
      Die Stützfläche endet rechts mit Spalte 10. Von 13 nach 10 sind es drei Spalten. Du kannst dafür den Oberkörper nach links holen oder den rechten Fuß weiter nach außen setzen; die zweite Lösung verbreitert die Stützfläche und lässt die Figur kräftiger stehen. Soll sie kippen, etwa weil sie gegen etwas drückt, bleibt der Schwerpunkt bewusst draußen.
    resources:
      - title: Proko · How to Draw Gesture
        url: https://www.proko.com/course-lesson/how-to-draw-gesture

  - id: begriffe-pose
    type: gap
    title: Begriffe der Pose
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Die Linie, die den Fluss einer Pose zeigt, heißt ⟦Handlungslinie⟧. Der Punkt, um den sich das Gewicht der Figur verteilt, ist der ⟦Schwerpunkt⟧. Die Fläche unter und zwischen den Füßen nennt man ⟦Stützfläche⟧. Damit eine Pose in wenigen Pixeln ankommt, musst du sie ⟦übertreiben⟧. Eine Pose, mit der ein Gegner einen Angriff ankündigt, ist ein ⟦Telegraph⟧.
    gaps:
      - label: Fluss der Pose
        hint: Auf Englisch Line of Action.
        accept: ["Line of Action", "Aktionslinie", "Bewegungslinie"]
      - label: Gewicht
        hint: Der Punkt, an dem man sich das ganze Gewicht der Figur vereint denkt.
        accept: ["Körperschwerpunkt"]
      - label: unter den Füßen
        hint: Ein Wort mit „Fläche“, sie stützt die Figur.
        accept: ["Standfläche", "Unterstützungsfläche"]
      - label: deutlicher machen
        hint: Verb, das Gegenteil von abschwächen.
        accept: ["überzeichnen", "verstärken", "zuspitzen"]
      - label: Ankündigung im Kampf
        hint: So heißt sie im Kurs Combat Design.
        accept: ["Tell", "Telegraphing", "Ankündigung"]
    explanation: |
      Handlungslinie, Schwerpunkt und Stützfläche beschreiben, ob eine Pose Richtung hat und ob sie steht. Übertreibung sorgt dafür, dass all das in wenigen Pixeln sichtbar bleibt. Der Telegraph verbindet Pose und Kampf: Eine Gegnerpose, die man nicht liest, kündigt nichts an.
    resources:
      - title: Proko · How to Draw Gesture
        url: https://www.proko.com/course-lesson/how-to-draw-gesture

  - id: wuetend-statt-muede
    type: bug
    title: Müde soll es aussehen
    prompt: |
      Das Gesicht soll müde wirken. Wer es sieht, nennt es wütend. Finde die Zeilen, die das verursachen.
    lang: text
    code: |
      . . . # # # # . . .
      . # # - - - - # # .
      . # - - - - - - # .
      # - # - - - - # - #
      # - - # - - # - - #
      # - # # - - # # - #
      # - - - - - - - - #
      . # - - + + - - # .
      . # # - - - - # # .
      . . . # # # # . . .
    lines: [4, 5]
    hints:
      - Die Strichaugen in Zeile 6 stimmen. Was sitzt darüber?
    explanation: |
      In Zeile 4 und 5 sitzen Brauen, die von außen zur Mitte abfallen. Dieses Muster liest man als Wut, und es überstimmt die müden Strichaugen. Für Müdigkeit lässt du die Brauen weg oder setzt sie waagerecht; senkst du zusätzlich den Kopf um einen Pixel, wird die Wirkung stärker. Vier Pixel entscheiden hier über den ganzen Ausdruck.
    resources:
      - title: Saint11 · Cuteness
        url: https://saint11.art/img/pixel-tutorials/Cuteness.gif

  - id: zustand-notiz
    type: bug
    title: Erschöpft, aber stolz?
    prompt: |
      Lehrbeispiel: Notiz für eine Figur im Zustand „erschöpft“. Eine Testerin liest das fertige Standbild als stolz und selbstbewusst. Finde die Zeile, die das verursacht.
    lang: prose
    code: |
      Zustand: erschöpft, Standbild, 24 px hoch
      Handlungslinie: C-Kurve, nach vorn gebeugt
      Schultern: zwei Pixel tiefer als in der Grundpose
      Kopf: aufrecht, Kinn gehoben, Blick nach oben
      Arme: hängen schlaff, Hände unter der Hüfte
      Gewicht: auf einem Bein, Knie leicht eingeknickt
    lines: [4]
    hints:
      - Welcher Körperteil fällt in einem kleinen Sprite zuerst auf?
    explanation: |
      Ein gehobener Kopf mit Blick nach oben ist ein Signal für Stolz oder Zuversicht. Weil der Kopf in kleinen Sprites ein Drittel oder mehr der Figur ausmacht, überstimmt er die hängenden Schultern und Arme. Für Erschöpfung gehört der Kopf nach vorn und unten, auf die Linie der C-Kurve. Erst dann zeigen alle Teile in dieselbe Richtung.
    resources:
      - title: Slynyrd · Pixelblog 22 · Top-down character sprites
        url: https://www.slynyrd.com/blog/2019/10/21/pixelblog-22-top-down-character-sprites

  - id: bereit-erklaeren
    type: explain
    title: Warum diese Pose bereit wirkt
    prompt: |
      Die Notiz beschreibt Pose C aus dem Schaubild zur Haltung. Erkläre in drei bis vier Sätzen, warum man sie als „bereit“ liest und nicht als „offen“ wie Pose A, die aufrecht mit den Händen in den Hüften steht.
    lang: text
    code: |
      Pose C (Standbild, Silhouette)
      Füße:   weit auseinander,
              ein Knie gebeugt
      Becken: tiefer als bei A
      Rumpf:  nach vorn geneigt
      Arme:   einer angewinkelt erhoben,
              der andere vor dem Rumpf
      Kopf:   zwischen den Füßen,
              vor der Hüfte
    points:
      - Die weit gestellten Füße ergeben eine große Stützfläche, die Figur kann in jede Richtung losgehen.
      - Das tiefe Becken senkt den Schwerpunkt; die Figur ist gespannt statt entspannt.
      - Die Handlungslinie ist eine lange Diagonale vom hinteren Fuß zum Kopf, A steht senkrecht.
      - Der erhobene, angewinkelte Arm und der Arm vor dem Rumpf zeigen Schutz oder Angriff, die Hände in den Hüften bei A zeigen Ruhe.
    explanation: |
      Pose C ist auf Bewegung vorbereitet. Die weit gestellten Füße und das gebeugte Knie senken den Schwerpunkt und vergrößern die Stützfläche, die Figur kann jederzeit ausweichen oder vorstoßen. Rumpf und Kopf liegen auf einer Diagonale, die Spannung erzeugt, während A senkrecht und ruhig steht. Der erhobene Arm und der Arm vor dem Rumpf schützen oder holen aus; die Hände in den Hüften bei A brauchen dagegen keine Reaktion. Beide nehmen viel Raum ein, aber nur C wirkt, als passiere gleich etwas.
    resources:
      - title: Proko · How to Draw Gesture
        url: https://www.proko.com/course-lesson/how-to-draw-gesture

  - id: gesten-bus
    type: practice
    title: Zehn Haltungen auf einer Fahrt
    prompt: |
      Zeichne auf einer Fahrt mit Bus oder Bahn oder in einer Warteschlange zehn Menschen als 30-Sekunden-Gesten: Handlungslinie, Kopf und Füße als Punkte, Schultern und Becken als Striche. Schreib unter jede Geste ein Wort für die Haltung. Notiere hier, welche Haltung am schwersten zu benennen war und warum, in zwei bis drei Sätzen.
    lang: prose
    checklist:
      - Auf dem Blatt stehen zehn Gesten, jede mit Handlungslinie, Kopf, Füßen, Schultern und Becken.
      - Keine Geste hat ein Gesicht oder Kleidungsdetails.
      - Unter jeder Geste steht genau ein Wort für die Haltung.
      - Bei mindestens drei Gesten hast du markiert, welcher Strich dich zu dem Wort gebracht hat.
      - In deiner Notiz steht, welche Haltung am schwersten zu benennen war, mit einem Grund.
    hints:
      - Wenn die Person sich bewegt, bevor du fertig bist, beginne eine neue Geste. Halbe Gesten zählen nicht.
    explanation: |
      Dreißig Sekunden reichen nur für das Wesentliche, und genau das sollst du sehen lernen. Das Wort zwingt dich, die Haltung zu deuten, der markierte Strich zeigt dir, woran du sie gedeutet hast. Nach einigen Fahrten merkst du, dass meist Schultern, Kopfneigung und Fußstellung die Haltung tragen, kaum je die Hände.
    resources:
      - title: Proko · How to Draw Gesture
        url: https://www.proko.com/course-lesson/how-to-draw-gesture

  - id: drei-gesichter
    type: practice
    title: Drei Gesichter auf Karopapier
    prompt: |
      Rahme auf Karopapier drei Felder von 10 × 10 Kästchen ein und zeichne in jedes einen runden Kopf mit Kontur. Der erste bekommt ein neutrales Gesicht aus zwei Augenpixeln. Für zwei andere Ausdrücke deiner Wahl änderst du jeweils höchstens sechs Kästchen. Lass jemanden, der die Ausdrücke nicht kennt, sie benennen, oder benenne sie selbst am nächsten Tag aus der Erinnerung heraus, ohne deine Notiz anzusehen.
    lang: prose
    checklist:
      - Drei Köpfe in Feldern von 10 × 10 Kästchen, alle mit derselben Kontur.
      - Der neutrale Kopf hat zwei Augenpixel und sonst kein Gesichtsmerkmal.
      - Jeder der beiden Ausdrücke unterscheidet sich vom neutralen Kopf in höchstens sechs Kästchen, und du hast sie gezählt.
      - Du hast den beabsichtigten Ausdruck vorher verdeckt notiert.
      - Du hast notiert, welche Namen genannt wurden und ob sie mit deiner Absicht übereinstimmen.
    hints:
      - Fang mit den Brauen an. Sie tragen die meiste Wirkung.
    explanation: |
      Die Grenze von sechs Kästchen zwingt dich zu entscheiden, welcher Pixel den Ausdruck trägt. Der Test mit einem Betrachter zeigt, ob deine Absicht ankommt. Weicht die Antwort ab, sagt dir das, welche Pixel eine andere Lesart nahelegen; das ist eine Information, kein Scheitern.
    resources:
      - title: Saint11 · Cuteness
        url: https://saint11.art/img/pixel-tutorials/Cuteness.gif

  - id: drei-zustaende
    type: practice
    title: Eine Puppe, drei Zustände
    prompt: |
      Zeichne dieselbe schlichte Gliederpuppe dreimal als gefüllte Silhouette, etwa fünf Zentimeter hoch: bereit, verletzt und erschöpft. Schreib den Zustand auf die Rückseite. Zeig die drei jemandem und frag, welche welcher ist, oder lege sie selbst nach einem Tag gemischt hin und ordne sie zu.
    lang: prose
    checklist:
      - Drei gefüllte Silhouetten derselben Puppe, ungefähr gleich groß.
      - Jede Pose hat eine eingezeichnete oder deutlich erkennbare Handlungslinie.
      - Die verletzte Pose ist sichtbar asymmetrisch, das Gewicht liegt auf einer Seite.
      - Bei der bereiten Pose liegt der Schwerpunkt über einer breiten Stützfläche, und du hast das mit einem Lot geprüft.
      - Du hast notiert, welche Zustände richtig zugeordnet wurden und welcher nicht.
    hints:
      - Geh die Tabelle aus der Lektion durch und setz zuerst den Körper um, ganz ohne Gesicht.
    explanation: |
      Ohne Gesicht muss die Pose den Zustand allein tragen. Genau das passiert im Spiel, wenn die Figur klein ist oder sich vom Spieler abwendet. Wird ein Zustand falsch zugeordnet, prüfe zuerst Handlungslinie und Schwerpunkt; meist ist die Pose noch zu leise.
    resources:
      - title: Line of Action (zeitgesteuerte Posenreferenzen)
        url: https://line-of-action.com/
