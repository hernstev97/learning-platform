id: pixelart
title: Zeichnen, Character Design & Pixelart
short: Pixelart
tagline: Sehen lernen, Formen vereinfachen und lesbare Figuren und Tiles Pixel für Pixel bauen.
description: >
  Beobachten und Messen, einfache Körper und Draufsicht, Proportionen, Licht und Tonwerte, Farbe und
  begrenzte Paletten, Linien und Cluster, Schattieren und Textur, Silhouette und Körpersprache, Sprites in
  mehreren Ansichten, Maßstab und Tiles. Du brauchst keine Zeichenerfahrung und kein Grafiktablett: Papier,
  Handy und Maus reichen, für Pixelarbeit nennt der Kurs freie Programme neben Aseprite. Jede Figur, jedes
  Tile und jede Palette entwirfst du selbst; kreative Aufgaben prüfst du mit offenen Kriterien, nicht mit
  einer Musterlösung. Module mit der Marke „Unterwegs“ gehen am Handy und mit Stift und Karopapier, „Am PC“
  braucht einen Pixel-Editor; lesen kannst du auch diese Lektionen unterwegs.
color: "#FFC6A8"
order: 13
outcomes:
  - "Du **beobachtest statt zu erinnern**: Du misst Proportionen, siehst Negativraum und arbeitest mit Referenzen, ohne sie abzupausen."
  - Du baust Gegenstände und Figuren aus **einfachen Körpern** auf und zeichnest sie in der Draufsicht, die Top-down-Spiele verwenden.
  - Du planst **Licht, Tonwerte und Farbe** bewusst, gruppierst Werte und baust begrenzte Paletten mit Farbrampen.
  - Du setzt Pixel mit Absicht – **saubere Linien, Cluster, Kantenglättung, Dithering** – und erkennst typische Fehler wie Doppelpixel, Banding und Kissenschattierung.
  - Du entwirfst Figuren mit **lesbarer Silhouette, Formensprache und Körpersprache** und übersetzt Skizzen in kleine Sprites.
  - Du hältst **Maßstab und Pixeldichte** über Figuren, große Kreaturen und Umgebung durch und zeichnest dieselbe Figur in mehreren Ansichten.
  - Du prüfst eigene Arbeit mit **Graustufen-, Silhouetten- und 1×-Test**, holst Rückmeldung ein und dokumentierst deine Gestaltungsentscheidungen.
tracks:
  - title: Sehen und Formen
    description: Beobachten und Messen, einfache Körper und Draufsicht, Figur und Proportion, Licht und Tonwerte. Alles mit Stift und Papier oder am Handy.
    modules: [beobachten, grundkoerper-raum, figur-proportion, licht-werte]
  - title: Pixel für Pixel
    description: Einen Pixel-Editor einrichten, Linien und Cluster setzen, Farben in Rampen und Paletten ordnen, schattieren und Texturen bauen.
    modules: [editor-einrichten, linien-cluster, farbe-paletten, schattieren-textur]
  - title: Figuren entwerfen
    description: Silhouette und Formensprache, Pose und Ausdruck im Standbild, vom Entwurf zum Sprite, mehrere Ansichten und große Kreaturen im selben Maßstab.
    modules: [silhouette-formsprache, pose-ausdruck, sprite-entwerfen, ansichten-massstab]
  - title: Umgebung und Asset-Set
    description: Tiles und Umgebung, die Figuren tragen statt sie zu verschlucken, dann prüfen, überarbeiten und Entscheidungen festhalten.
    modules: [umgebung-tiles, lesbarkeit-pruefen]
