id: massstab-dichte
title: Maßstab, Dichte und Freiflächen
level: 2
minutes: 100
summary: Maße aus der Spielfigur ableiten – Fußform, Tempo und Ausweichweite in Tiles –, daraus Gänge, Türen und Arenen bemessen, Hindernisse bewusst dosieren und Enge und Weite so setzen, dass Größe und Freifläche etwas bedeuten.
place: unterwegs
goals:
  - Du rechnest Tempo, Ausweichweite und Fußform einer Figur in Tiles um und leitest daraus Gang- und Türbreiten ab.
  - Du bemisst eine Arena in Ausweichweiten und Sekunden und prüfst, ob sie in einen Bildschirm passt.
  - Du beschreibst, was die Dichte von Hindernissen bewirkt, und misst sie in einer Rasterkarte.
  - Du erklärst, wie Bezugsobjekte, Raumgröße und Bildausschnitt Größe wirken lassen, ohne frei zu zoomen.
  - Du setzt Enge und Weite bewusst ein und planst einen Maßstabsraum, in dem du deine Maße ausprobierst.
resources:
  - title: The Level Design Book · Metrics
    url: https://book.leveldesignbook.com/process/blockout/metrics
  - title: Joel Burgess, Nate Purkeypile, „Skyrim's Modular Approach to Level Design“ (GDC 2013, Folien)
    url: https://www.slideshare.net/JoelBurgess/gdc2013-kit-buildingfinal
  - title: Christopher W. Totten, „Designing Better Levels Through Human Survival Instincts“ (Game Developer, 2011)
    url: https://www.gamedeveloper.com/design/designing-better-levels-through-human-survival-instincts
  - title: The Level Design Book · Prospect-refuge
    url: https://book.leveldesignbook.com/process/blockout/massing/prospect-refuge
lesson: |
  Koichi Hayashida, Director von Super Mario 3D Land, erzählt, wie sein Team Super Mario Galaxy 2 auf einem sehr kleinen Fernseher ausprobierte: „what we noticed, of course, was Mario was very, very tiny on the screen, so it was difficult to play the game when he's that small. We realized we have to make Mario a little bit bigger.“ ([Game Developer, 2012](https://www.gamedeveloper.com/design/the-structure-of-fun-learning-from-i-super-mario-3d-land-i-s-director)) Wie groß die Figur im Bild ist, bestimmt, wie groß sich alles um sie herum anfühlt und wie viel Platz sie braucht.

  Dieses Modul leitet Maße aus der Spielfigur ab: Gänge, Türen, Arenen, Hindernisfelder. Es rechnet mit den Platzhaltern dieses Kurses, wie sie die Testszenen aus dem Combat-Kurs nutzen. Deine Werte kommen aus deiner Figur, und welche das sind, entscheidest du. Wie der Bildschirm in Tiles aussieht und wie weit man darin voraussieht, steht in [Level lesen](/level-design/raum-lesen); was eine Freifläche vor einer Begegnung für den Ablauf eines Levels bedeutet, in [Rhythmus](/level-design/rhythmus).

  ## Metriken aus der Spielfigur

  Das Level Design Book definiert: „In level design, metrics are the sense of scale, distance, and measurements across the entire level / game.“ Es trennt zwei Arten. „Player metrics (or physics metrics) are factual numbers measured in-engine like player size, movement speed, maximum jump height, etc.“ Building metrics dagegen sind Maße für Böden und Wände, die du dir selbst festlegst, „based on your desired experience goals“ ([Metrics](https://book.leveldesignbook.com/process/blockout/metrics#what-are-metrics)). Die einen misst du, die anderen entscheidest du. Für Spiele gilt laut Buch: „build at the player's scale“.

  Die Platzhalter dieses Kurses als Tabelle:

  | Größe | Platzhalter | in Tiles |
  | --- | --- | --- |
  | Tile | 16 × 16 Pixel | 1 |
  | Spielbild | 320 × 180 Pixel | 20 × 11 volle Tiles |
  | Tempo (`move_speed`) | 90 Pixel pro Sekunde | 5,6 Tiles pro Sekunde |
  | Ausweichen | 66 Pixel in 18 Frames | gut 4 Tiles |
  | Fußform | 10 × 6 Pixel | ⅝ × ⅜ Tile |

  Bild und Tempo stammen aus [Godot-Start](/combat/godot-start), das Ausweichen aus [Ausweichen, Risiko und Belohnung](/combat/ausweichen). Die Fußform ist die flache Kollisionsform an den Füßen, mit der eine Figur in der Draufsicht an Wänden anstößt. Ihr Bild darf größer sein und über Kanten ragen. Wie das funktioniert, zeigt [Kollision und Ebenen](/godot/kollision-ebenen), aus dessen Testgelände die Fußform von 10 × 6 Pixeln stammt. Für Gänge zählt die Breite der Fußform, nicht die des Bildes.

  ```python run
  # Platzhalter, Tempo in px/s
  TILE = 16
  TEMPO = 90
  AUSWEICHEN = 66
  FUSS_B = 10

  tiles_s = round(TEMPO / TILE, 1)
  s_tile = round(TILE / TEMPO, 2)
  print(tiles_s, s_tile)
  print(round(AUSWEICHEN / TILE, 1))
  print(2 * FUSS_B)
  ```

  Die Figur läuft 5,6 Tiles pro Sekunde und braucht 0,18 Sekunden für ein Tile. Ein Ausweichen trägt sie 4,1 Tiles weit. Zwei Fußbreiten sind 20 Pixel. Diese Zahlen sind der Maßstab für alles, was folgt. Das Buch warnt zugleich, „metrics are not magic“. Ob ein Maß sich richtig anfühlt, weißt du erst, „when you're walking around inside your level and playtesting“. Deshalb gehören Maße in den Blockout, nicht erst in die fertige Grafik.

  > [!MERKE] Jedes Maß beginnt bei der Figur
  > Gänge, Türen, Arenen und Abstände rechnest du aus Fußform, Tempo und Ausweichweite. Ändert sich eine dieser Zahlen, prüfst du die Maße neu.

  ## Gänge und Türen für Bewegung in alle Richtungen

  Für die Breite von Gängen gibt es zwei Quellen, die dasselbe sagen. Das Level Design Book: „The minimum hallway width should be at least double the player width. Even then, it will feel a bit narrow and uncomfortable.“ ([Basic metrics](https://book.leveldesignbook.com/process/blockout/metrics#common-modern-architecture-dimensions)) Joel Burgess über Skyrim, laut dem Transkript seines Vortrags mit Nate Purkeypile auf der GDC 2013, das auf Burgess' Blog steht: „We usually stick to a minimum of two character widths. This allows us to avoid pathing problems by ensuring there’s at least enough space for two AI characters to path around each other in any given space.“ Die Folien zum Vortrag liegen bei [Slideshare](https://www.slideshare.net/JoelBurgess/gdc2013-kit-buildingfinal).

  Übertragen auf das Raster: Zwei Fußbreiten sind 20 Pixel. Wände liegen im 16-Pixel-Raster, also ist der schmalste Gang nach dieser Regel 2 Tiles breit, 32 Pixel. Ein Gang von einem Tile, 16 Pixeln, lässt einer Fußform von 10 Pixeln 3 Pixel an jeder Seite. Mit Godot 4.7.2 nachgeprüft läuft sie durch einen senkrechten Gang dieser Breite ([Blockout in Godot](/level-design/blockout)). Ein Gegner kommt aber nicht an ihr vorbei, und wer schräg in die Öffnung läuft, hat wenig Spielraum. Wie sich das in deinem Spiel anfühlt, hängt an Kollisionsform und Bewegungscode; das prüfst du im Maßstabsraum. Ob die Regel aus Skyrim für dein Spiel gilt, entscheidest du. Sie gibt dir einen begründeten Startwert.

  Für Türen schreibt das Buch: „Modern doors should be narrower than hallways to allow space for a door frame.“ Im Raster heißt das, eine Tür von 2 Tiles in einem Gang von 3 Tiles zu planen, oder bewusst zu entscheiden, dass Türen so breit sind wie der Gang. In der 3/4-Ansicht kommt etwas hinzu: Zeichnest du Wände hoch, kann ihre Vorderseite im Bild einen Teil des Gangs dahinter verdecken. Der Gang wirkt dann schmaler, als er ist.

  Aus solchen Entscheidungen entsteht eine Tabelle von Gebäudemaßen, etwa „enger Gang 2, Standardgang 3, Tür 2, breiter Durchgang 4 Tiles“. Die Zahlen hier sind ein Lehrbeispiel. Deine Tabelle schreibst du nach dem Maßstabsraum.

  > [!PRAXIS] Bethesda misst den engsten Raum
  > Burgess rät, früh den schmalsten begehbaren Raum des Spiels festzulegen: „It’s also worth figuring out the most narrow traversable space in the game.“ Der Grund ist praktisch: Zwei computergesteuerte Figuren müssen aneinander vorbeikommen. Bethesda bringt Baukästen dafür so früh wie möglich in einen Zustand, den das Team „functional-but-ugly“ nennt, damit das Design schon mit den echten Maßen arbeiten kann, während die Grafik ohne Eile ihre Richtung findet (Transkript; [Folien bei Slideshare](https://www.slideshare.net/JoelBurgess/gdc2013-kit-buildingfinal)). Für dich heißt das: Gangbreiten in grauen Tiles festlegen und ablaufen, lange bevor ein Tile gezeichnet ist.

  ## Arenen in Ausweichweiten

  Eine Arena ist eine Fläche für eine Begegnung. Wie Kämpfe darin ablaufen, behandelt der Combat-Kurs. Hier geht es um ihre Größe. Das Level Design Book stellt dafür eigene Fragen, „What is "close range" or "long range"? How big is a "big fight"?“ ([Combat metrics](https://book.leveldesignbook.com/process/blockout/metrics#combat-metrics)). In einem Spiel mit Ausweichrolle ist die Ausweichweite ein gutes Maß. Bei 66 Pixeln sind das gut 4 Tiles.

  Ein Lehrbeispiel: Eine Arena von 12 × 8 Tiles ist 192 × 128 Pixel groß. Quer passen zwei volle Ausweichrollen, die dritte endet an der Wand. Zu Fuß ist die Breite in 2,1 Sekunden durchquert. Die Arena passt in einen Bildschirm von 20 × 11 Tiles, der Spieler sieht also den ganzen Kampf. Ist sie größer als ein Bildschirm, entscheidet die Kamera mit, was er sieht; dazu [Große Kreaturen als Bosse](/combat/grosse-gegner).

  Ein großer Gegner nimmt Fläche weg. Das Level Design Book beschreibt einen Kampf in Elden Ring, einen großen Wolf in einem mittelgroßen Saal: „The medium-sized room makes the large wolf feel even larger. It will be difficult to dodge the wolf's attacks.“ Und weiter: „Furniture and clutter further limit the player's mobility and options. (Until the boss destroys the furniture, opening up more floor space, making the fight a bit easier.)“ ([Safety as game state](https://book.leveldesignbook.com/process/blockout/massing/prospect-refuge#safety-as-game-state)) Raumgröße, Gegnergröße und Einrichtung ergeben zusammen, wie viel Platz zum Ausweichen bleibt, und das kann sich im Kampf ändern.

  ## Freiflächen und Dichte

  Eine leere, weite Fläche kündigt etwas an. Das Level Design Book zählt es zu den subtilen Hinweisen, wenn „a room feels structured like a boss battle arena“ ([Subtle](https://book.leveldesignbook.com/process/blockout/wayfinding#subtle-1-20-certainty)). Christopher Totten beschreibt Bossräume als „typically wide-open places for staging elaborate encounters with strong enemies“ und die in Mega Man als Räume mit „little or no elaboration or places to hide“ ([Game Developer, 2011](https://www.gamedeveloper.com/design/designing-better-levels-through-human-survival-instincts)). Eine Freifläche ist damit ein Versprechen. Passiert dort nie etwas, lernt der Spieler, dass sie nichts bedeutet.

  **Dichte** ist der Anteil der Fläche, den Hindernisse belegen. Sie wirkt auf drei Arten:

  - **Reibung.** Hindernisse verlängern Wege und verlangen Lenken. Im Bericht von 4Gamer über einen Vortrag zu Breath of the Wild heißt es über kleine Felsen und Hügel, sie führten zu häufigen Eingaben am Stick und bestimmten so das Tempo der Erkundung (eigene Übersetzung, [4Gamer](https://www.4gamer.net/games/341/G034168/20170901120/)).
  - **Deckung.** „Cover is any object that blocks a sightline and/or combat.“ (Level Design Book, [Enclosure](https://book.leveldesignbook.com/process/blockout/massing/prospect-refuge#enclosure)) In der Draufsicht sperren hohe Hindernisse Geschosse und Sicht, niedrige nur den Weg.
  - **Rauschen.** Viele kleine Formen gleicher Stärke machen das Bild unruhig, siehe [Komposition und Blickführung](/level-design/blickfuehrung).

  Messen lässt sich Dichte in einer Rasterkarte, Hindernisse geteilt durch begehbare Fläche plus Hindernisse. Legende: `#` Wand, `.` Boden, `o` niedriges Hindernis.

  ```text
  ############
  #..o....o..#
  #....o.....#
  #.o.....o..#
  #.....o....#
  ############
  ```

  Hier sind es 6 von 40 Tiles, 15 Prozent. Die Zahl allein sagt nicht alles. Gleichmäßig verstreut steht in jeder Innenzeile ein Hindernis im Weg, wer waagerecht durch den Raum will, muss Haken schlagen. Dieselben sechs als zwei Gruppen lassen ganze Zeilen und eine zusammenhängende Fläche frei. Ob du Gassen willst oder Gestrüpp, folgt aus deiner Absicht.

  ## Größe wirken lassen: Bezugsobjekte und Bildausschnitt

  In einem Spiel mit pixelgenauer Darstellung kannst du nicht frei zoomen. `Camera2D.zoom` 2 macht aus jedem Weltpixel 2 × 2 Spielpixel und halbiert die sichtbare Welt auf 160 × 90 Pixel, eine Zoomstufe wie 1,5 macht manche Pixel ein, andere zwei Spielpixel breit ([Pixelraster und Skalierung](/godot/pixelraster), [Camera2D, zoom](https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-zoom)). Größe muss also anders entstehen.

  Das Level Design Book fragt, was die Wahrnehmung von Größe und Tempo bestimmt, und antwortet: „Basically anything on the screen.“ ([Metrics of perception](https://book.leveldesignbook.com/process/blockout/metrics#metrics-of-perception)) In der Draufsicht sind das vor allem drei Dinge, eine Einteilung dieses Kurses:

  - **Bezugsobjekte.** Dinge, deren Größe der Spieler kennt, eine Tür, eine Kiste, die eigene Figur. Neben ihnen liest er ab, wie groß etwas Unbekanntes ist. Wie du Größen im Bild festhältst, zeigt die Maßstabstabelle in [Ansichten, Maßstab und große Kreaturen](/pixelart/ansichten-massstab).
  - **Raumgröße.** Derselbe Gegner wirkt im engen Saal riesig und auf einer weiten Ebene klein, wie beim Wolf in Elden Ring.
  - **Der Bildausschnitt.** Ein Objekt, das ein Drittel des Bildschirms füllt, wirkt anders als eines, das über den Bildrand ragt.

  Ungewöhnliche Größe braucht Gewöhnliches drumherum. Das Buch schreibt: „to make something feel unusual, you must contrast it with enough usual common elements first.“

  > [!WARNING] Kein krummer Zoom für mehr Übersicht
  > Wenn eine Arena nicht ins Bild passt, liegt die Lösung im Layout oder in der Kamera, nicht in einem Zoom von 0,75. Krumme Zoomstufen verzerren Pixelart.

  ## Enge und Weite

  In der Architektur gibt es dafür einen Namen. „In architecture, compression and expansion or compression and release is a technique in which small, narrow and sometimes dark spaces lead to ones that are large and bright.“ Die Technik lebe vom Kontrast und lasse große Räume größer wirken, als sie sind; bekannt gemacht hat sie Frank Lloyd Wright ([Wikipedia](https://en.wikipedia.org/wiki/Compression_and_expansion)). In einer Rasterkarte sieht das so aus, Legende wie oben:

  ```text
  ######..######
  ######..######
  #............#
  #............#
  #............#
  #............#
  ######..######
  ```

  Ein Gang von 2 Tiles öffnet sich in eine Fläche von 12 Tiles Breite, und am anderen Ende wird es wieder eng.

  Totten teilt Räume nach ihrer Größe im Verhältnis zur Figur in drei Gruppen:

  - **Narrow Space**, „A small enclosed space where the occupant feels confined and unable to move“. Er schreibt dazu: „In a narrow passage an enemy can literally become another wall of the space, diminishing the size of the space with each approaching step.“
  - **Intimate Space**, „neither confining nor overly large“. Alles darin soll „immediately accessible to the player and within reach of their avatar and their inherent abilities“ sein. Solche Räume wachsen mit den Fähigkeiten der Figur.
  - **Prospect Space**, offen und ausgesetzt. Dazu zählt er die Bossräume.

  Dan Taylor beschreibt dieselbe Folge an Tomb Raider (2013): Lara gehe „from narrow, claustrophobic caves, through sprawling, epic jungles, to vertiginous mountain ascents“ ([Ten Principles, Teil 2](https://www.gamedeveloper.com/design/ten-principles-of-good-level-design-part-2-)). Enge und Weite wirken im Wechsel. Ein Abschnitt aus lauter gleich großen Räumen hat diesen Kontrast nicht.

  Totten beschreibt auch eine Folge aus Rückzugsort, offener Fläche und nächstem Rückzugsort, englisch Refuge, Prospect und „Secondary Refuge“, und schreibt: „Secondary Refuges can urge the occupant of a space forward“. Das Level Design Book hält diese Theorie für begrenzt nützlich, „This book argues that prospect-refuge, as traditionally understood, has limited application to level design“, und nennt Sicherheit im Spiel „a situation / game state, not a formal quality of architecture“ ([Prospect-refuge](https://book.leveldesignbook.com/process/blockout/massing/prospect-refuge)). Es schlägt stattdessen die Begriffe Sichtlinie, Aussichtspunkt, Deckung und Umschließung vor. Für dieses Modul reicht: Enge und Weite misst du in Tiles. Was sie im Ablauf eines Levels bedeuten, behandelt [Rhythmus](/level-design/rhythmus).

  ## Der Maßstabsraum

  Das Level Design Book empfiehlt einen „metrics zoo“ oder „metrics playground“, eine Testkarte nur für dich, mit allen Bauteilen deines Spiels ([Build a metrics zoo test map](https://book.leveldesignbook.com/process/blockout/metrics#build-a-metrics-zoo-test-map)). Die Schritte dort: einen Blockout mit verschiedenen Räumen und Gängen bauen, auf Benutzbarkeit testen, auf Gefühl testen, ändern und wiederholen. Für ein Top-down-Spiel könnte ein Maßstabsraum zum Beispiel enthalten:

  - Gänge von 1, 2 und 3 Tiles Breite, gerade und mit Ecke,
  - Türen in verschiedenen Breiten, die man auch schräg anläuft,
  - eine Fläche in der Größe deiner Standardarena mit einer Linie in Ausweichweite,
  - zwei Hindernisfelder mit verschiedener Dichte,
  - Bezugsobjekte in der Größe deiner Maßstabstabelle.

  Burgess gibt dazu eine Rechenregel für Baukästen. Teilbaukästen sollen Grundflächen haben, die Vielfache voneinander sind: „a 512x512x512 room will always tile nicely with a 256x256x256 hallway, but a 384x384x384 room will eventually create gaps and/or overlaps.“ Im Tile-Raster heißt das: Ist dein Gangmodul 2 Tiles breit, gehen Räume von 8, 10 oder 12 Tiles auf, solche von 9 nicht.

  Auf Papier geht das unterwegs, ein Kästchen pro Tile. Den Maßstabsraum in Godot baust du in [Blockout in Godot](/level-design/blockout). Ein kleines Skript, das Abstände im Spiel anzeigt, darf dir eine KI schreiben. Welche Breiten und Größen bleiben, entscheidest du nach dem Ablaufen.

  > [!TIP] Erst ablaufen, dann festschreiben
  > Schreib ein Maß erst in deine Tabelle, wenn du es im Maßstabsraum abgelaufen bist, auch schräg und mit Ausweichen. Ein Gang, der auf Papier reicht, kann sich mit 360°-Bewegung an jeder Ecke verhaken.

  > [!INTERVIEW] „Wie legst du fest, wie breit Gänge und wie groß Arenen werden?“
  > Ich fange bei der Figur an: Fußform, Tempo, Ausweichweite, gemessen im Spiel. Für Gänge nehme ich mindestens zwei Fußbreiten, auf das Raster aufgerundet, damit Figur und Gegner aneinander vorbeikommen. Arenen rechne ich in Ausweichweiten und in Sekunden zu Fuß und prüfe, ob sie in den Bildschirm passen. Dann baue ich einen Maßstabsraum, laufe alles ab, auch schräg, und schreibe erst danach eine Tabelle mit Gebäudemaßen. Ändert sich das Tempo der Figur, prüfe ich die Tabelle neu.

  ## Häufige Fehler

  - **Gang so breit wie die Figur.** Ein Tile für eine Fußform von 10 Pixeln. Die Figur kommt durch, ein Gegner nicht an ihr vorbei.
  - **Maße nach Augenmaß im Editor.** Ohne Bezug zu Fußform, Tempo und Ausweichweite passt nichts zusammen, sobald sich eine Zahl ändert.
  - **Arena ohne Rechnung.** Zu klein für zwei Ausweichrollen oder so groß, dass der Kampf über den Bildrand läuft, ohne dass es Absicht war.
  - **Gleichmäßig verstreute Hindernisse.** Kein freier Weg, keine freie Fläche, viel Rauschen.
  - **Freifläche ohne Folge.** Weite Räume kündigen etwas an. Bleiben sie leer, verliert das Signal seinen Wert.
  - **Größe über Zoom.** Krumme Zoomstufen zerstören das Pixelraster.
  - **Alles gleich groß.** Ohne Enge gibt es keine Weite.
  - **Maße, die nicht aufgehen.** Räume, die keine Vielfachen des Gangmoduls sind, erzeugen Lücken und Sonderteile.

  ## Zusammenfassung

  - Player Metrics misst du im Spiel, Building Metrics legst du fest. Beide rechnest du in Tiles.
  - Mit den Platzhaltern läuft die Figur 5,6 Tiles pro Sekunde, weicht gut 4 Tiles weit aus und hat eine Fußform von 10 Pixeln Breite.
  - Gänge sind mindestens zwei Fußbreiten breit, auf das Raster aufgerundet. Bei 10 Pixeln sind das 20 Pixel, also 2 Tiles.
  - Arenen misst du in Ausweichweiten und Sekunden und prüfst, ob sie in einen Bildschirm passen. Große Gegner und Einrichtung nehmen Fläche weg.
  - Dichte wirkt als Reibung, Deckung und Rauschen. Ihre Verteilung zählt so viel wie ihre Menge.
  - Größe entsteht über Bezugsobjekte, Raumgröße und Bildausschnitt, nicht über krummen Zoom.
  - Enge und Weite wirken im Wechsel. Im Maßstabsraum probierst du Maße aus, bevor du sie festschreibst.
exercises:
  - id: spieler-oder-bau
    type: choice
    title: Gemessen oder entschieden?
    prompt: |
      Das Level Design Book trennt Player Metrics, die man im Spiel misst, von Building Metrics, die man festlegt. Welche dieser Werte sind Player Metrics?
    options:
      - text: "`move_speed = 90` Pixel pro Sekunde"
        correct: true
        why: Das Tempo ist ein Wert der Figur, den du im Spiel messen und prüfen kannst.
      - text: Das Ausweichen trägt die Figur 66 Pixel weit.
        correct: true
        why: Die Weite folgt aus Tempo und Dauer des Ausweichens und lässt sich im Log nachmessen.
      - text: Die Fußform ist 10 × 6 Pixel groß.
        correct: true
        why: Sie ist die Kollisionsform der Figur, ein Fakt im Projekt.
      - text: Ein Standardgang ist 3 Tiles breit.
        correct: false
        why: Das ist eine Building Metric. Du legst sie fest, abgeleitet aus den Player Metrics und deiner Absicht.
      - text: Arenen für große Gegner sind 16 × 10 Tiles groß.
        correct: false
        why: Auch das ist eine Entscheidung, die du triffst, nicht ein Wert, den das Spiel misst.
    explanation: |
      Player Metrics beschreiben die Physik der Figur, Building Metrics schreiben vor, wie gebaut wird. Die zweiten leitest du aus den ersten ab. Ändert sich das Tempo oder die Ausweichweite, müssen die Gebäudemaße neu geprüft werden, nicht umgekehrt.
    hints:
      - Drei Werte sind richtig.
    resources:
      - title: The Level Design Book · Metrics, What are metrics?
        url: https://book.leveldesignbook.com/process/blockout/metrics#what-are-metrics

  - id: gangbreite
    type: choice
    title: Der schmalste Gang
    prompt: |
      Die Fußform der Figur ist 10 Pixel breit (Platzhalter), Wände liegen im Raster von 16 Pixeln. Welche ist die schmalste Gangbreite, die Burgess' Regel von mindestens zwei Figurbreiten erfüllt?
    options:
      - text: 1 Tile, 16 Pixel
        correct: false
        why: Zwei Fußbreiten sind 20 Pixel. Die Figur passt durch ein Tile, ein Gegner kommt aber nicht an ihr vorbei.
      - text: 1,25 Tiles, 20 Pixel
        correct: false
        why: Rechnerisch genau zwei Fußbreiten, aber Wände liegen im Raster. Einen Gang von 1,25 Tiles gibt es dort nicht.
      - text: 2 Tiles, 32 Pixel
        correct: true
        why: Das erste Rastermaß über 20 Pixeln. Zwei Figuren kommen aneinander vorbei.
      - text: 3 Tiles, 48 Pixel
        correct: false
        why: Erfüllt die Regel auch, ist aber nicht der schmalste Gang. Ob dein Standardgang 2 oder 3 Tiles breit ist, entscheidest du im Maßstabsraum.
    explanation: |
      Die Regel nennt eine Untergrenze, keine Wunschbreite. 20 Pixel auf das Raster aufgerundet ergibt 2 Tiles. Das Level Design Book fügt hinzu, dass sich die doppelte Breite noch eng anfühlt. Ein Standardgang darf deshalb breiter sein. Der engste Gang des Spiels ist aber eine Zahl, die du kennen solltest.
    hints:
      - Rechne erst in Pixeln, dann auf ganze Tiles aufrunden.
    resources:
      - title: Joel Burgess, Nate Purkeypile, Skyrim's Modular Approach (Folien)
        url: https://www.slideshare.net/JoelBurgess/gdc2013-kit-buildingfinal

  - id: massstabsraum-schritte
    type: order
    title: Ein Maßstabsraum entsteht
    prompt: |
      Du willst die Maße für dein Spiel in einem Maßstabsraum finden. Bring die Schritte in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Schreib die Werte deiner Figur auf, Fußform, Tempo und Ausweichweite.
      Bau einen Testraum mit Gängen, Türen und einer Fläche aus grauen Platzhalter-Tiles.
      Lauf durch alle Gänge und Türen, auch schräg und mit Ausweichen.
      Notier, welche Breiten sich zu eng oder zu weit anfühlen.
      Ändere ein Maß und lauf denselben Weg noch einmal.
      Schreib die Maße, die bleiben, in deine Tabelle der Gebäudemaße.
    explanation: |
      Das Level Design Book nennt für einen „metrics zoo“ dieselbe Folge: Blockout bauen, auf Benutzbarkeit und Gefühl testen, ändern, wiederholen. Die Werte der Figur stehen am Anfang, weil alle Maße davon abhängen. Die Tabelle steht am Ende, weil erst das Ablaufen zeigt, welche Maße tragen. Wer eine Zahl ändert, läuft denselben Weg, sonst vergleicht er zwei verschiedene Tests.
    hints:
      - Was muss feststehen, bevor du einen Gang bauen kannst?
    resources:
      - title: The Level Design Book · Build a metrics zoo test map
        url: https://book.leveldesignbook.com/process/blockout/metrics#build-a-metrics-zoo-test-map

  - id: metriken-in-tiles
    type: output
    title: Eine andere Figur in Tiles
    prompt: |
      Lehrbeispiel: eine schnellere Figur mit anderen Platzhaltern. Was gibt das Modell aus?
    lang: python
    code: |
      import math

      # Lehrbeispiel, Platzhalter
      TILE = 16
      TEMPO = 120
      AUSWEICHEN = 80
      FUSS_B = 14

      s_tile = round(TILE / TEMPO, 2)
      print(TEMPO / TILE, s_tile)
      print(AUSWEICHEN / TILE)
      zwei = 2 * FUSS_B
      print(math.ceil(zwei / TILE))
    expected: |
      7.5 0.13
      5.0
      2
    hints:
      - 16 / 120 sind 0,1333 Sekunden.
      - Zwei Fußbreiten sind 28 Pixel. Wie viele ganze Tiles braucht man dafür?
    explanation: |
      Die Figur läuft 7,5 Tiles pro Sekunde, ein Tile in 0,13 Sekunden. Ein Ausweichen trägt sie genau 5 Tiles weit. Zwei Fußbreiten sind 28 Pixel, aufgerundet 2 Tiles, also bleibt der schmalste Gang gleich, obwohl die Figur breiter ist. Eine Fußform über 16 Pixel würde 3 Tiles verlangen. `math.ceil` rundet auf: 28 / 16 sind 1,75 Tiles. Abgerundet wäre der Gang ein Tile breit, 16 Pixel, also 12 Pixel zu schmal. Aufgerundet ist er 32 Pixel breit, 4 Pixel mehr als nötig.
    resources:
      - title: Python · math.ceil
        url: https://docs.python.org/3/library/math.html#math.ceil

  - id: ausweichen-quer
    type: output
    title: Wie viele Ausweichrollen passen quer?
    prompt: |
      Das Modell rechnet für drei Arenabreiten, wie viele volle Ausweichrollen quer hineinpassen und wie viele Sekunden die Figur zu Fuß hindurch braucht. Alle Werte sind Platzhalter. Was gibt es aus?
    lang: python
    code: |
      # Platzhalter
      TILE, TEMPO = 16, 90
      AUSWEICHEN = 66

      def quer(breite):
          px = breite * TILE
          rollen = px // AUSWEICHEN
          sek = round(px / TEMPO, 1)
          return rollen, sek

      for breite in (8, 12, 20):
          print(breite, quer(breite))
    expected: |
      8 (1, 1.4)
      12 (2, 2.1)
      20 (4, 3.6)
    hints:
      - "`//` teilt ganzzahlig: 192 // 66 ist 2."
      - 20 Tiles sind 320 Pixel, ein ganzer Bildschirm.
    explanation: |
      8 Tiles sind 128 Pixel, darin passt eine volle Ausweichrolle, zu Fuß 1,4 Sekunden. 12 Tiles sind 192 Pixel, zwei Rollen, 2,1 Sekunden. Ein ganzer Bildschirm, 320 Pixel, fasst vier Rollen und ist in 3,6 Sekunden durchquert. Damit hast du ein Maß für „groß“ und „klein“, das an deiner Figur hängt. Wie viele Rollen ein Kampf braucht, hängt an den Angriffen; das entscheidet der Combat-Teil deines Spiels.
    resources:
      - title: The Level Design Book · Combat metrics
        url: https://book.leveldesignbook.com/process/blockout/metrics#combat-metrics

  - id: dichte-zaehlen
    type: output
    title: Wie dicht ist der Raum?
    prompt: |
      Das Modell zählt Boden und niedrige Hindernisse in einer Rasterkarte und gibt danach den Anteil der Hindernisse in Prozent aus. Legende: `#` Wand, `.` Boden, `o` niedriges Hindernis. Was gibt es aus?
    lang: python
    code: |
      raum = [
          "############",
          "#o...oo....#",
          "#o...oo....#",
          "#..........#",
          "#....oo..oo#",
          "############",
      ]
      text = "".join(raum)
      boden = text.count(".")
      hindernis = text.count("o")
      alle = boden + hindernis
      anteil = hindernis / alle
      print(boden, hindernis)
      print(round(100 * anteil))
    expected: |
      30 10
      25
    hints:
      - Jede Innenzeile hat 10 Tiles. Zähl die `o` Zeile für Zeile.
    explanation: |
      Die vier Innenzeilen haben 40 Tiles, davon 10 Hindernisse, also 25 Prozent. Anders als in der Lektion stehen die Hindernisse hier in Gruppen, und die vierte Zeile der Karte, `#..........#`, bleibt ganz frei. Dieselbe Dichte kann eine Gasse lassen oder ein Gestrüpp bilden. Die Zahl hilft beim Vergleichen zweier Felder, die Verteilung siehst du nur in der Karte.
    resources:
      - title: The Level Design Book · Prospect-refuge, Enclosure
        url: https://book.leveldesignbook.com/process/blockout/massing/prospect-refuge#enclosure

  - id: zoom-ausschnitt
    type: output
    title: Zoom 2 im kleinen Bild
    prompt: |
      Im Spielbild von 320 × 180 Pixeln steht `Camera2D.zoom` auf `(2, 2)`. Tiles sind 16 Pixel. Wie viele volle Tiles zeigt das Bild quer und hoch? Antworte in der Form „quer × hoch“.
    lang: text
    code: |
      sichtbar = Bildgröße / zoom
      Bild     320 × 180
      zoom     2
      Tile     16
    expected: |
      10 × 5
    accept: ["10 x 5", "10x5", "10×5", "10 mal 5", "10 × 5 Tiles", "10 x 5 Tiles", "10x5 Tiles", "10×5 Tiles"]
    explanation: |
      Zoom 2 zeigt 160 × 90 Pixel der Welt, also 10 Tiles quer und 5 volle Tiles hoch, ein Viertel der Fläche. Alles wirkt doppelt so groß, und der Spieler sieht nach oben nur noch 45 Pixel voraus. Zoom 2 hält das Pixelraster gleichmäßig, ändert aber den ganzen Maßstab des Spiels. Für einen einzelnen großen Raum ist es deshalb selten die richtige Antwort.
    resources:
      - title: Godot Docs · Camera2D, zoom
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-zoom

  - id: enge-weite-begriffe
    type: gap
    title: Eng, vertraut, offen
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Totten teilt Räume in drei Größen: den ⟦Narrow⟧ Space, in dem man sich eingeengt fühlt, den ⟦Intimate⟧ Space, in dem alles in Reichweite der Figur liegt, und den ⟦Prospect⟧ Space, offen und ausgesetzt. In der Architektur heißt eine Folge von eng zu weit compression and ⟦release⟧. Wie groß etwas ist, liest der Spieler an einem ⟦Bezugsobjekt⟧ ab, dessen Größe er kennt.
    gaps:
      - label: eng
        hint: Englisch für „schmal“.
        accept: ["narrow"]
      - label: vertraut
        hint: Englisch für „vertraut, nah“.
        accept: ["intimate"]
      - label: offen
        hint: Englisch für „Aussicht“.
        accept: ["prospect"]
      - label: Freigabe
        hint: Wikipedia nennt auch „compression and expansion“.
        accept: ["expansion"]
      - label: Vergleich
        hint: Eine Tür oder Kiste neben dem großen Ding.
        accept: ["Vergleichsobjekt", "Referenzobjekt", "Bezugsgegenstand", "Bezugspunkt"]
    explanation: |
      Tottens drei Größen messen Räume an der Figur, nicht in Metern. Compression and release beschreibt die Folge aus beiden. Bezugsobjekte sind das Werkzeug, mit dem Größe in einem Spiel ohne freien Zoom entsteht.
    resources:
      - title: Wikipedia · Compression and expansion
        url: https://en.wikipedia.org/wiki/Compression_and_expansion

  - id: gang-zu-schmal
    type: bug
    title: Hier bleiben sie hängen
    prompt: |
      Lehrbeispiel: zwei Räume, verbunden durch einen Gang. Absicht: Der Gang ist überall mindestens zwei Fußbreiten breit, bei 10 Pixeln Fußbreite also 20 Pixel, im Raster 2 Tiles. Tester stoßen im Gang an eine Kante, und ein Gegner kommt nicht an der Figur vorbei. Finde die Zeile.

      Legende: `#` Wand, `.` Boden, `S` Start, `A` Ausgang
    lang: text
    code: |
      ########################
      #......#########.......#
      #..S................A..#
      #...........####.......#
      #......#########.......#
      ########################
    lines: [4]
    explanation: |
      Der Gang liegt in Zeile 3 und 4 zwischen den Räumen. In Zeile 4 ragt ein Wandstück von vier Tiles hinein. Dort ist der Gang nur noch ein Tile breit, 16 Pixel für eine Fußform von 10. Die Figur passt hindurch, aber wer schräg anläuft, stößt an die Ecke des Wandstücks, und für zwei Figuren nebeneinander ist kein Platz. Abhilfe: das Wandstück entfernen oder den Gang an dieser Stelle nach oben verbreitern.
    hints:
      - Zähl in jeder Spalte des Gangs, wie viele Reihen Boden übereinanderliegen.

  - id: arena-notiz
    type: bug
    title: Eine Zeile rechnet falsch
    prompt: |
      Lehrbeispiel: Notiz zu einer Arena. Tile 16 Pixel, Platzhalter aus dem Kurs. Eine Zeile stimmt nicht. Finde sie und korrigiere sie.
    lang: prose
    code: |
      Arena: 12 × 8 Tiles = 192 × 128 Pixel
      Ausweichweite: 66 Pixel = gut 2 Tiles
      Quer passen 2 volle Ausweichrollen.
      Großer Gegner: 4 × 3 Tiles, belegt 12 von 96 Tiles.
      Freie Fläche für die Figur: 84 Tiles.
    lines: [2]
    fix:
      - line: 2
        answers: ["Ausweichweite: 66 Pixel = gut 4 Tiles", "Ausweichweite: 66 Pixel = 4 Tiles", "Ausweichweite: 66 Pixel = 4,1 Tiles", "Ausweichweite: 66 Pixel = etwa 4 Tiles", "Ausweichweite: 66 Pixel = rund 4 Tiles", "Ausweichweite: 66 Pixel = über 4 Tiles", "Ausweichweite: 66 Pixel = knapp über 4 Tiles"]
    explanation: |
      66 / 16 = 4,1 Tiles, nicht gut 2. Die übrigen Zeilen stimmen: 192 / 66 ergibt zwei volle Rollen, der Gegner belegt 12 der 96 Tiles, und 84 bleiben frei. Ein Faktor zwei in der Ausweichweite verschiebt jede Entscheidung über die Arena. Mit „gut 2 Tiles“ würde die Arena doppelt so geräumig wirken, wie sie ist.
    hints:
      - Teil 66 durch 16.

  - id: elden-ring-saal
    type: explain
    title: Ein Wolf im Saal
    prompt: |
      Das Level Design Book beschreibt einen Bosskampf in Elden Ring. Hier zwei Sätze daraus, wörtlich. Erkläre in drei bis fünf Sätzen, wie Raumgröße und Einrichtung den Kampf und die Wirkung des Gegners verändern und was das für die Planung einer Arena heißt.
    lang: prose
    code: |
      The medium-sized room makes the large wolf feel even larger. It will be difficult to dodge the wolf's attacks.

      Furniture and clutter further limit the player's mobility and options. (Until the boss destroys the furniture, opening up more floor space, making the fight a bit easier.)
    points:
      - Der Raum ist der Bezug für die Größe des Gegners. Ein mittelgroßer Saal lässt einen großen Gegner noch größer wirken.
      - Weniger freie Fläche heißt weniger Platz zum Ausweichen. Raumgröße ist eine Kampfgröße.
      - Möbel erhöhen die Dichte und schränken die Bewegung weiter ein. Werden sie zerstört, wächst die freie Fläche und der Kampf wird leichter.
      - Für eine Arena heißt das, freie Fläche, Gegnergröße und Hindernisse zusammen zu rechnen und auch zu planen, wie sie sich im Kampf ändern.
    explanation: |
      Der Saal ist der Maßstab, an dem der Spieler den Wolf misst. Weil der Raum nur mittelgroß ist, füllt der Wolf viel davon, und das macht ihn groß und gefährlich zugleich, denn es bleibt wenig Platz zum Ausweichen. Die Möbel erhöhen die Dichte noch und nehmen Wege weg. Dass der Boss sie zerstört, ändert die Arena während des Kampfs: Mehr freie Fläche macht ihn leichter. Für eine eigene Arena rechne ich deshalb nicht nur ihre Größe, sondern die freie Fläche nach Abzug von Gegner und Einrichtung, und ich überlege, ob sich diese Fläche im Kampf ändern soll.
    hints:
      - Woran misst der Spieler, wie groß der Wolf ist?
    resources:
      - title: The Level Design Book · Prospect-refuge, Safety as game state
        url: https://book.leveldesignbook.com/process/blockout/massing/prospect-refuge#safety-as-game-state

  - id: zwei-breiten
    type: explain
    title: Warum zwei Figurbreiten?
    prompt: |
      Zwei Quellen zur Gangbreite, wörtlich. Erkläre in drei bis fünf Sätzen, was sie fordern, warum, und wie du die Regel auf ein Top-down-Spiel im 16-Pixel-Raster überträgst.
    lang: prose
    code: |
      Level Design Book: „The minimum hallway width should be at least double the player width. Even then, it will feel a bit narrow and uncomfortable.“

      Joel Burgess (Skyrim, GDC 2013, Transkript): „We usually stick to a minimum of two character widths. This allows us to avoid pathing problems by ensuring there’s at least enough space for two AI characters to path around each other in any given space.“
    points:
      - Beide nennen zwei Figurbreiten als Untergrenze, nicht als Ziel. Auch das fühlt sich laut Buch noch eng an.
      - Der Grund bei Burgess ist praktisch. Zwei computergesteuerte Figuren müssen aneinander vorbeikommen.
      - In der Draufsicht zählt die Breite der Fußform, weil sie an Wänden anstößt, nicht das Bild der Figur.
      - Im Raster rundest du auf ganze Tiles auf. Bei 10 Pixeln Fußbreite sind das 20 Pixel, also 2 Tiles.
    explanation: |
      Beide Quellen setzen die Untergrenze bei zwei Figurbreiten. Das Buch sagt dazu, dass sich selbst das noch eng anfühlt, Burgess begründet sie mit der Wegfindung: Zwei Figuren müssen aneinander vorbeikommen, sonst bleiben Gegner stecken. In einem Top-down-Spiel messe ich die Breite der Fußform, weil sie mit Wänden kollidiert. Bei 10 Pixeln sind zwei Breiten 20 Pixel, und weil Wände im 16-Pixel-Raster liegen, ist der engste Gang 2 Tiles breit. Wie breit der Standardgang wird, entscheide ich danach im Maßstabsraum.
    hints:
      - Wer muss in einem Gang aneinander vorbeikommen?
    resources:
      - title: The Level Design Book · Basic metrics
        url: https://book.leveldesignbook.com/process/blockout/metrics#common-modern-architecture-dimensions

  - id: massstabsraum-skizze
    type: practice
    title: Dein Maßstabsraum auf Papier
    prompt: |
      Skizzier auf Karopapier einen Maßstabsraum, ein Kästchen pro Tile. Nimm die Werte deiner Figur, wenn du sie schon hast, sonst die Platzhalter des Kurses. Welche Gänge, Flächen und Hindernisse du hineinstellst und wie breit sie sind, entscheidest du. Hier notierst du die Werte und Maße in wenigen Zeilen.
    lang: prose
    starter: |
      Figur (Fußform, Tempo, Ausweichweite):
      Gänge (Breiten in Tiles):
      Türen:
      Fläche für eine Arena (Tiles, Ausweichrollen quer):
      Hindernisfelder (Dichte in Prozent):
    checklist:
      - Die Werte der Figur stehen da und sind als eigene Werte oder Platzhalter gekennzeichnet.
      - Es gibt Gänge in mindestens drei Breiten, darunter einen, der schmaler ist als zwei Fußbreiten.
      - Die Arenafläche ist in Tiles, Ausweichrollen und Sekunden zu Fuß angegeben.
      - Es gibt zwei Hindernisfelder mit verschiedener Dichte, beide in Prozent ausgerechnet.
      - Die Raummaße sind Vielfache deiner Gangbreite.
    explanation: |
      Der Maßstabsraum ist der Ort, an dem aus Zahlen Gefühl wird. Der zu schmale Gang gehört absichtlich hinein: An ihm merkst du, wo deine Grenze liegt. Auf Papier prüfst du, ob die Maße zusammenpassen. Ob sie sich richtig anfühlen, zeigt erst das Ablaufen im [Blockout](/level-design/blockout).
    hints:
      - Fang mit der Arena an. Gänge und Räume rechnest du dann in Vielfachen deiner Gangbreite.
    resources:
      - title: The Level Design Book · Build a metrics zoo test map
        url: https://book.leveldesignbook.com/process/blockout/metrics#build-a-metrics-zoo-test-map

  - id: enge-weite-beobachten
    type: practice
    title: Eng, dann weit, in einem fremden Spiel
    prompt: |
      Such in einem veröffentlichten Top-down-Spiel eine Stelle, an der ein enger Weg in eine weite Fläche führt. Schätz die Breiten in Tiles, etwa an der Größe der Figur oder einer Tür. Notier in höchstens fünf Stichpunkten, was du findest.
    lang: prose
    starter: |
      Spiel und Stelle:
      Breite eng / weit (geschätzt, Tiles):
      Bezugsobjekt für die Schätzung:
      Was in der weiten Fläche passiert:
      Hindernisse in der Fläche (viele, wenige, Gruppen):
    checklist:
      - Spiel und Stelle sind genannt.
      - Beide Breiten sind in Tiles geschätzt, und du nennst das Bezugsobjekt.
      - Du beschreibst, was in der weiten Fläche passiert, ohne es zu werten.
      - Du beschreibst, wie die Hindernisse in der Fläche verteilt sind.
    explanation: |
      Die Schätzung über ein Bezugsobjekt ist dieselbe Arbeit, die ein Spieler beim Ansehen macht. Passiert in der weiten Fläche eine Begegnung, hat das Spiel das Versprechen der Freifläche eingelöst. Passiert dort nichts, achte darauf, ob die Fläche einen anderen Zweck hat, etwa einen Ausblick. Was die Stelle im Ablauf leistet, ordnest du mit [Rhythmus](/level-design/rhythmus) ein.
    hints:
      - Die eigene Figur ist das zuverlässigste Bezugsobjekt.
    resources:
      - title: Christopher W. Totten, „Designing Better Levels Through Human Survival Instincts“
        url: https://www.gamedeveloper.com/design/designing-better-levels-through-human-survival-instincts
