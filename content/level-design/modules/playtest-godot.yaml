id: playtest-godot
title: "Playtest am PC: Wege aufzeichnen und vergleichen"
level: 2
minutes: 140
summary: Eine Testversion deines Blockouts so vorbereiten, dass sie Wege selbst aufzeichnet – Position als CSV, Zonen mit Zeit, eine Spur als Line2D und ein Übersichtsbild aller Sitzungen –, und die Spuren mit deinem erwarteten Weg vergleichen, ohne Daten über die Tester zu sammeln.
place: pc
goals:
  - Du bereitest eine Testsitzung am PC vor, mit getaggtem Stand, Einverständnis und Sitzungsnummern statt Namen.
  - Du baust einen Wegschreiber ein, der die Position alle 0,25 Sekunden als CSV nach `user://` schreibt und als Spur in eine `Line2D` hängt.
  - Du legst Zonen als `Area2D` an und sagst vorher, welche Einträge im Zonen-Log stehen.
  - Du erzeugst ein Übersichtsbild mit Wänden, erwartetem Weg und allen Spuren und liest daraus Halte, Umwege und Umkehrungen.
  - Du trennst, was eine Spur zeigt, von dem, was nur Beobachtung und Protokoll erklären.
