lesson: |
  Lehrbeispiel: Drei Tester haben deinen Hof gespielt, und du hast ihre Wege auf einer Papierkarte mitgezeichnet, wie in [Beobachten, ohne zu erklären](/level-design/playtest-methode). Beim Auswerten merkst du, wo das Papier ungenau ist. Stand T2 am Brunnen zwei Sekunden oder acht? Ging T3 an der Wand entlang oder eine Tile daneben? Und wann genau hat T1 den Seitengang betreten, vor oder nach dem Blick zum Tor?

  Am PC kann das Spiel selbst mitschreiben: wo die Figur ist, viermal pro Sekunde, und wann sie welche Zone betritt. Das ersetzt das Zusehen nicht. Valve fasst es in den Folien zu ihrem Playtest-Vortrag so: „Nothing beats direct gameplay observation“ ([Ambinder, GDC 2009](https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf)). Die Aufzeichnung macht dein Protokoll genauer und deine Spuren vergleichbar. Die zwei Skripte hier sind technisches Gerüst, eine KI darf sie schreiben. Welcher Weg der erwartete ist, wo die Zonen liegen und was du aus den Spuren schließt, entscheidest du. Grundlage ist der Blockout aus [Blockout in Godot](/level-design/blockout), mit `Notes` und `notes.gd`.

  ## Eine Testsitzung am PC vorbereiten

  Getestet wird ein fester Stand. Vor der Sitzung committest du, setzt einen Tag und exportierst eine Debug-Version, wie in [Testversionen exportieren und die Arbeit sichern](/godot/export-sichern) beschrieben. Debug, weil das Log bei einem Fehler die Zeile nennt. Spielt der Tester an deinem Rechner, kannst du das Projekt auch aus dem Editor starten; dann musst du aber darauf achten, dass er keine Docks und keinen Szenenbaum sieht.

  Vor dem Start liegen bereit:

  - die Absichtsnotiz des Abschnitts, mit den Zeichen, dass es klappt oder scheitert,
  - das Beobachtungsprotokoll mit den Spalten `Zeit | Ort | Was der Spieler tut | Was er sagt`,
  - eine Stoppuhr, die du startest, wenn das Spiel startet, damit Protokoll und Aufzeichnung dieselbe Zeit haben.

  Wie du ohne zu erklären beobachtest, steht in [Beobachten, ohne zu erklären](/level-design/playtest-methode) und allgemeiner in [Testlesen und Playtest](/narrative/testlesen-playtest). Das Level Design Book nennt den Kern: „Watching their behavior is more important than their feedback“ ([Playtesting](https://book.leveldesignbook.com/process/blockout/playtesting)).

  ### Daten über Wege, nicht über Menschen

  Der Wegschreiber zeichnet Position, Zeit und Zonen auf, keinen Namen, keinen Ton, kein Bild vom Gesicht. Sag dem Tester vor dem Start in einem Satz, was aufgezeichnet wird und wozu, und frag, ob das in Ordnung ist. Die Dateien bekommen Sitzungsnummern, im Protokoll heißt der Tester T1, T2, T3. Eine Liste, wer welche Nummer hatte, brauchst du nicht; wenn du sie doch führst, liegt sie getrennt von den Daten. Möchte jemand, dass seine Sitzung gelöscht wird, löschst du beide Dateien dieser Nummer.

  ## Der Wegschreiber: Position als CSV in user://

  Im laufenden Spiel ist der Projektordner `res://` laut Doku meist schreibgeschützt. Für eigene Dateien gibt es `user://`, einen Ordner, der „guaranteed to be writable to, even in an exported project“ ist. Unter Linux liegt er standardmäßig in `~/.local/share/godot/app_userdata/[project_name]`, beim Start aus dem Editor und beim exportierten Spiel auf demselben Rechner im selben Ordner ([user://](https://docs.godotengine.org/en/stable/tutorials/io/data_paths.html#accessing-persistent-user-data-user)). Das Skript hängt an einem `Node` namens `PathRecorder`, der im Baum **vor** `Objects` steht:

  ```gdscript title=path_recorder.gd
  extends Node

  ## Wegschreiber für Playtests: schreibt alle 15 Physik-Frames (0,25 s) die Position
  ## der Figur nach user://wege/, hängt sie an eine Line2D als Spur und notiert,
  ## wann die Figur eine Zone der Gruppe "zones" betritt. Jede Sitzung bekommt
  ## die nächste freie Nummer. Technisches Gerüst, keine Designentscheidung.

  @export var player: Node2D
  @export var trail: Line2D
  @export var every_frames := 15

  var _frame := 0
  var _path: FileAccess
  var _zones: FileAccess


  func _ready() -> void:
  	DirAccess.make_dir_recursive_absolute("user://wege")
  	var n := 1
  	while FileAccess.file_exists("user://wege/sitzung_%02d_weg.csv" % n):
  		n += 1
  	_path = FileAccess.open("user://wege/sitzung_%02d_weg.csv" % n, FileAccess.WRITE)
  	_path.store_line("t,x,y")
  	_zones = FileAccess.open("user://wege/sitzung_%02d_zonen.csv" % n, FileAccess.WRITE)
  	_zones.store_line("t,zone")
  	for zone in get_tree().get_nodes_in_group(&"zones"):
  		zone.body_entered.connect(_on_zone_entered.bind(zone.name))
  	print("Wegschreiber: Sitzung ", n)


  func _physics_process(_delta: float) -> void:
  	if _frame % every_frames == 0:
  		var p := player.global_position
  		_path.store_line("%.2f,%.1f,%.1f" % [_seconds(), p.x, p.y])
  		_path.flush()
  		trail.add_point(p)
  	_frame += 1


  func _on_zone_entered(body: Node2D, zone_name: StringName) -> void:
  	if body == player:
  		_zones.store_line("%.2f,%s" % [_seconds(), zone_name])
  		_zones.flush()


  func _seconds() -> float:
  	return _frame / float(Engine.physics_ticks_per_second)
  ```

  Was die Teile tun:

  - **Sitzungsnummer.** Das Skript sucht die erste Nummer, für die es noch keine Datei gibt. So überschreibt keine Sitzung eine andere, auch im exportierten Spiel, wo du im Inspektor nichts ändern kannst. Der Ordner muss vorher existieren; die Doku zu `FileAccess.WRITE` sagt dazu: „When creating a file it must be in an already existing directory.“
  - **Takt.** `_physics_process` läuft 60-mal pro Sekunde ([physics_ticks_per_second](https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-property-physics-ticks-per-second)). Jeder 15. Frame ergibt vier Messpunkte pro Sekunde, mit genauen Zeiten 0.00, 0.25, 0.50. Ein Zähler statt eines Timers hält die Zeiten auf diesem Raster. Mit Godot 4.7.2 nachgeprüft: Nach 3600 Physik-Frames, also 60 Sekunden, hat die Spur 240 Punkte.
  - **CSV.** `store_line()` hängt einen Zeilenumbruch an ([store_line](https://docs.godotengine.org/en/stable/classes/class_fileaccess.html#class-fileaccess-method-store-line)). `%.2f` schreibt die Zeit mit zwei Stellen, `%.1f` die Pixel mit einer.
  - **`flush()`.** Ohne diese Zeile hält Godot geschriebenen Text in einem Puffer und schreibt ihn in Blöcken auf die Platte, nachgemessen in Blöcken von 4096 Byte. Bei diesem Format sind das gut 220 Messpunkte, knapp eine Minute. Die Doku: „calling flush() can be used to ensure the data is safe even if the project crashes instead of being closed gracefully“ ([flush](https://docs.godotengine.org/en/stable/classes/class_fileaccess.html#class-fileaccess-method-flush)). Mit Godot 4.7.2 nachgeprüft, das Spiel jeweils hart beendet: Ohne `flush()` war die Datei nach 200 Frames leer; nach 250 Sekunden standen 16384 von 18292 Byte darin, die letzten gut 25 Sekunden fehlten, und die letzte Zeile war abgeschnitten. Mit `flush()` waren beide Dateien vollständig. Bei regulärem Beenden ist die Datei auch ohne `flush()` vollständig.
  - **Reihenfolge im Baum.** `PathRecorder` vor `Objects` misst, bevor sich die Figur im selben Frame bewegt. Dann ist der Punkt bei 0.50 genau der Stand nach 30 Bewegungsschritten.

  Gemessen mit Godot 4.7.2, Figur ab (40, 100) mit 90 Pixeln pro Sekunde nach rechts, ohne Beschleunigung:

  ```csv title=sitzung_01_weg.csv
  t,x,y
  0.00,40.0,100.0
  0.25,62.5,100.0
  0.50,85.0,100.0
  0.75,107.5,100.0
  1.00,130.0,100.0
  ```

  > [!TIP] Die Sitzungsnummer steht in der Ausgabe
  > Beim Start schreibt der Wegschreiber `Wegschreiber: Sitzung 3` in die Ausgabe, im exportierten Spiel ins Log unter `user://logs/`. Trag die Nummer nach dem Beenden ins Protokoll ein, bevor die nächste Sitzung startet; dann gehören `sitzung_03_weg.csv` und `sitzung_03_zonen.csv` eindeutig zu dieser Seite. Während der Sitzung bleibt dein Blick beim Tester.

  Vier Punkte pro Sekunde sind 240 Zeilen pro Minute. Für Abschnitte von 2 bis 4 Bildschirmen reicht das; ein Halt von einer Sekunde sind vier Punkte auf einer Stelle. Willst du gröber messen, stellst du `every_frames` im Inspektor auf 30.

  ## Die Spur und der erwartete Weg als Line2D

  `trail.add_point(p)` hängt jeden Messpunkt an eine `Line2D` an ([add_point](https://docs.godotengine.org/en/stable/classes/class_line2d.html#class-line2d-method-add-point)). Daneben zeichnest du einen zweiten `Line2D`, `ExpectedPath`, mit den Punkten des Wegs, den deine Absichtsnotiz erwartet; die Punkte setzt du im 2D-Editor oder trägst sie im Inspektor unter *Points* ein ([points](https://docs.godotengine.org/en/stable/classes/class_line2d.html#class-line2d-property-points)). Beide hängen unter `Notes`:

  ```text
  Main (Node2D)
  ├── PathRecorder (Node)        path_recorder.gd, vor Objects
  ├── Ground, Cues, Objects …    aus dem Blockout
  ├── Gang (Area2D)              Gruppe zones
  │   └── Shape (CollisionShape2D)
  ├── Tor (Area2D)               Gruppe zones
  │   └── Shape (CollisionShape2D)
  └── Notes (Node2D)             notes.gd, im Spiel aus, liegt bei (0, 0)
      ├── ExpectedPath (Line2D)  erwarteter Weg, von dir gezeichnet
      └── Trail (Line2D)         Spur, vom Wegschreiber gefüllt
  ```

  So sieht der Tester weder seine Spur noch deinen erwarteten Weg; beides würde ihn lenken. Nach der Sitzung drückst du die Taste für `toggle_notes` und siehst die Spur im laufenden Spiel über dem Blockout. Mit Godot 4.7.2 nachgeprüft: Unter `Notes` ist `Trail` nach dem Start unsichtbar und nach der Aktion sichtbar. Stell bei beiden `width` auf 1; der Standard ist 10 Pixel, in einem Bild von 320 × 180 ein breiter Balken ([width](https://docs.godotengine.org/en/stable/classes/class_line2d.html#class-line2d-property-width)). `add_point()` erwartet Koordinaten der `Line2D`, der Wegschreiber übergibt globale Positionen. Deshalb liegen `Notes`, `Trail` und `ExpectedPath` bei (0, 0); auch das Übersichtsbild weiter unten liest die Punkte von `ExpectedPath` als Positionen im Spiel.

  ## Zonen: wann betritt der Spieler welchen Ort?

  Eine Zone ist eine `Area2D` mit einer `CollisionShape2D`, deren Namen der Ort ist, den deine Absichtsnotiz nennt. Leg sie in die Gruppe `zones` ([Groups](https://docs.godotengine.org/en/stable/tutorials/scripting/groups.html)). Der Wegschreiber holt sich alle Zonen der Gruppe und verbindet ihr Signal `body_entered`. Das Signal kommt, wenn ein Körper die Fläche betritt, und verlangt `monitoring = true`, den Standard ([body_entered](https://docs.godotengine.org/en/stable/classes/class_area2d.html#class-area2d-signal-body-entered)). Mit `bind(zone.name)` bekommt die Funktion den Namen der Zone mit.

  Damit die Zone die Figur bemerkt, muss ihre Maske den Layer der Figur enthalten. Im Testgelände liegt die Figur auf Layer 2 „player“. Die Zone selbst braucht keinen Layer. Ausschnitt aus `main.tscn`, ohne die `unique_id`, die Godot 4.7.2 in jede Node-Zeile schreibt:

  ```ini title=main.tscn
  [node name="Tor" type="Area2D" parent="." groups=["zones"]]
  position = Vector2(208, 100)
  collision_layer = 0
  collision_mask = 2
  ```

  Warum Layer und Maske so zusammenhängen, erklärt [Kollisionen und Trefferzonen](/godot/kollision-ebenen). Das Log hält nur das Betreten fest. Wer in einer Zone steht, erzeugt keine neuen Zeilen; wer sie verlässt und wieder betritt, eine neue. Gemessen mit Godot 4.7.2: Zone `Gang` von x = 96 bis 144, `Tor` von 192 bis 224, die Figur läuft 2 Sekunden nach rechts, 1 Sekunde zurück und 1 Sekunde wieder nach rechts:

  ```csv title=sitzung_01_zonen.csv
  t,zone
  0.58,Gang
  1.65,Tor
  2.82,Gang
  3.65,Tor
  ```

  Welche Orte Zonen werden, folgt aus deiner Absichtsnotiz. Steht dort „Der Spieler soll das Tor erreichen, bevor er den Seitengang betritt“, brauchst du genau diese zwei Zonen, und das Log beantwortet die Frage für jeden Tester mit einer Zeile.

  ## Ein Übersichtsbild aller Sitzungen

  Die Spur im Spiel zeigt nur den Bildausschnitt um die Figur. Für die Auswertung, auch unterwegs am Handy, brauchst du ein Bild des ganzen Abschnitts mit allen Sitzungen. Dieses Skript läuft ohne Fenster aus dem Terminal. Es lädt deine Hauptszene, zeichnet die Zellen von `Walls`, den erwarteten Weg in Grün und jede Datei `*_weg.csv` in einer eigenen Farbe:

  ```gdscript title=trail_overview.gd
  extends SceneTree

  ## Übersichtsbild für die Auswertung: zeichnet die Wände, den erwarteten Weg (grün)
  ## und jeden Weg aus user://wege/ in ein PNG, 1 Bildpixel = 1 Spielpixel.
  ## Aufruf im Projektordner: godot --headless --path . -s trail_overview.gd
  ## Technisches Gerüst, keine Designentscheidung.

  const COLORS := [Color.RED, Color.ORANGE, Color.MAGENTA, Color.CYAN, Color.YELLOW]


  func _initialize() -> void:
  	var level: Node = load("res://main.tscn").instantiate()
  	var ground: TileMapLayer = level.get_node("Ground")
  	var walls: TileMapLayer = level.get_node("Objects/Walls")
  	var tile := ground.tile_set.tile_size
  	var rect := ground.get_used_rect()
  	var image := Image.create_empty(rect.size.x * tile.x, rect.size.y * tile.y, false, Image.FORMAT_RGB8)
  	image.fill(Color(0.55, 0.55, 0.55))
  	for cell in walls.get_used_cells():
  		image.fill_rect(Rect2i((cell - rect.position) * tile, tile), Color(0.24, 0.24, 0.24))
  	var origin := Vector2(rect.position * tile)
  	_draw(image, level.get_node("Notes/ExpectedPath").points, origin, Color.GREEN)
  	var files := Array(DirAccess.get_files_at("user://wege")).filter(func(f): return f.ends_with("_weg.csv"))
  	for i in files.size():
  		var points := PackedVector2Array()
  		var csv := FileAccess.open("user://wege/" + files[i], FileAccess.READ)
  		csv.get_csv_line()   # Kopfzeile t,x,y
  		while csv.get_position() < csv.get_length():
  			var row := csv.get_csv_line()
  			points.append(Vector2(float(row[1]), float(row[2])))
  		_draw(image, points, origin, COLORS[i % COLORS.size()])
  		print(files[i], ": ", points.size(), " Punkte, Farbe ", COLORS[i % COLORS.size()].to_html(false))
  	image.save_png("user://wege/uebersicht.png")
  	print("gespeichert: ", ProjectSettings.globalize_path("user://wege/uebersicht.png"))
  	level.free()
  	quit()


  func _draw(image: Image, points: PackedVector2Array, origin: Vector2, color: Color) -> void:
  	for i in points.size() - 1:
  		var a := points[i] - origin
  		var b := points[i + 1] - origin
  		for s in int(a.distance_to(b)) + 1:
  			var p := Vector2i(a.move_toward(b, s))
  			if p.x >= 0 and p.y >= 0 and p.x < image.get_width() and p.y < image.get_height():
  				image.set_pixelv(p, color)
  ```

  Ein Skript, das von `SceneTree` erbt, startet Godot mit `-s` ohne Hauptszene ([Running a script](https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html#running-a-script)). `get_files_at()` liefert die Dateien „sorted alphabetically“ ([DirAccess.get_files_at](https://docs.godotengine.org/en/stable/classes/class_diraccess.html#class-diraccess-method-get-files-at)), also bekommt Sitzung 01 immer Rot, 02 Orange und so weiter. Heißt deine Hauptszene anders oder liegen die Nodes woanders, passt du die drei Pfade an. Ausgabe nach drei Lehrbeispiel-Sitzungen, mit Godot 4.7.2, Pfad gekürzt:

  ```console
  $ godot --headless --path . -s trail_overview.gd
  sitzung_01_weg.csv: 18 Punkte, Farbe ff0000
  sitzung_02_weg.csv: 18 Punkte, Farbe ffa500
  sitzung_03_weg.csv: 22 Punkte, Farbe ff00ff
  gespeichert: /home/…/.local/share/godot/app_userdata/Playtest-Pruefung/wege/uebersicht.png
  ```

  Das Bild ist so groß wie der Abschnitt in Spielpixeln, bei 24 × 12 Tiles also 384 × 192. Spielt jemand auf einem anderen Rechner, kopierst du dessen Ordner `wege` vorher in deinen `user://`-Ordner. Bei mehr als fünf Sitzungen wiederholen sich die Farben; erzeug dann ein Bild pro Runde.

  ## Spuren lesen: was sie zeigen und was nicht

  Im Übersichtsbild suchst du Muster, die du zählen kannst:

  - **Halt.** Viele Punkte auf einer Stelle. Acht Punkte sind zwei Sekunden.
  - **Umkehr.** Die Spur läuft ein Stück zurück. Zähl, wo und wie oft.
  - **Umweg.** Die Spur weicht vom grünen Weg ab und kommt später zurück, oder sie kommt nicht zurück.
  - **Reihenfolge.** Das Zonen-Log zeigt, ob der Tester die Orte in der erwarteten Folge betreten hat.
  - **Lücke.** Ein Ort ohne jede Spur. Niemand war dort, auch nicht zufällig.

  > [!MERKE]
  > Die Spur zählt Ort, Dauer und Reihenfolge. Den Grund für einen Halt oder Umweg liefert nur das Protokoll. Deutung kommt erst, wenn beides zusammenpasst.

  Was die Spur nicht zeigt, ist der Grund. Acht Punkte vor einer Abzweigung können Unsicherheit sein, ein Blick auf etwas Interessantes oder ein Tester, der kurz mit dir spricht. Das klärst du mit dem Protokoll: Die Stoppuhrzeit im Protokoll und die Zeit in der CSV gehören zusammen. Erst wenn beides zusammenpasst, schreibst du eine Deutung auf, getrennt von der Beobachtung. Wie du daraus eine Änderung ableitest, zeigt [Überarbeiten: von der Beobachtung zur Änderung](/level-design/ueberarbeiten).

  > [!PRAXIS] Heatmaps bei Valve
  > In Valves Folien zum Playtesting von 2009 steht die Aufzeichnung neben der direkten Beobachtung: „Record of gameplay behaviors“, etwa „Deaths, level times, friendly fire“, dazu eine „Heatmap of Death Concentrations“ der Karte Dustbowl aus Team Fortress 2. Die Folien nennen die Grenzen gleich mit: „Averages hide extreme examples“, „Miss nuance (lacking context)“ und „Can see ‘illusory’ patterns“. Valve nutzt beides, Zahlen und Zusehen, und behandelt jede Designidee als Hypothese: „Game designs are hypotheses“, „Playtests are experiments“ ([Ambinder, GDC 2009](https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf)).

  > [!INTERVIEW]
  > „Wir haben Wegdaten aus vielen Sitzungen. Warum noch zusehen?“ Gute Antwort: Die Daten zeigen, wo und wie lange jemand war, nicht warum. Ein Halt vor einer Abzweigung kann Verwirrung sein oder Neugier. Ich nutze die Spuren, um Stellen zu finden und zu zählen, und das Protokoll aus der Beobachtung, um sie zu erklären. Dazu achte ich darauf, dass die Daten nichts über die Person enthalten: Sitzungsnummern, keine Namen, nur Position, Zeit und Zonen.

  ## Häufige Fehler

  - **Eine Zeile pro Datei.** Wer die Datei bei jedem Messpunkt mit `FileAccess.WRITE` neu öffnet, leert sie jedes Mal. Öffne sie einmal in `_ready()`.
  - **Leeres Zonen-Log.** Die Maske der Zone enthält den Layer der Figur nicht, die Zone ist nicht in der Gruppe `zones`, oder `monitoring` ist aus.
  - **Unvollständige Datei nach einem Absturz.** `flush()` fehlt. Am Ende fehlt bis zu knapp eine Minute, eine kurze Sitzung geht ganz verloren. Bei regulärem Beenden fällt das nicht auf.
  - **Sitzungen überschrieben.** Ein fester Dateiname für alle Sitzungen. Die Nummer muss das Skript selbst finden.
  - **Spur für den Tester sichtbar.** `Trail` oder `ExpectedPath` hängen nicht unter `Notes`. Der Tester folgt dann der grünen Linie.
  - **Namen in Dateien.** Ein Dateiname wie `sitzung_anna.csv` sammelt Daten über eine Person, die du nicht brauchst.
  - **Spuren ohne Protokoll.** Das Bild zeigt eine Abweichung, aber niemand weiß, was in dem Moment passiert ist.

  ## Zusammenfassung

  - Getestet wird ein getaggter Stand als Debug-Export. Absichtsnotiz, Protokoll und Stoppuhr liegen bereit.
  - Aufgezeichnet werden Position, Zeit und Zonen unter einer Sitzungsnummer, mit Einverständnis und ohne Namen.
  - `path_recorder.gd` schreibt alle 15 Physik-Frames eine CSV-Zeile nach `user://wege/`, 240 pro Minute, mit `flush()` nach jeder Zeile.
  - Zonen sind `Area2D` in der Gruppe `zones`, deren Maske den Layer der Figur enthält. Das Log hält nur das Betreten fest.
  - `Trail` und `ExpectedPath` hängen unter `Notes` und sind im Spiel aus.
  - `trail_overview.gd` zeichnet Wände, erwarteten Weg und alle Sitzungen in ein PNG, 1 Bildpixel pro Spielpixel.
  - Spuren zeigen Halte, Umkehrungen, Umwege und Lücken. Den Grund liefert das Protokoll.
exercises:
  - id: was-aufzeichnen
    type: choice
    title: Was gehört in die Aufzeichnung?
    prompt: |
      Du bereitest eine Sitzung am PC vor. Welche Daten zeichnest du auf?
    options:
      - text: Position und Zeit alle 0,25 Sekunden unter einer Sitzungsnummer.
        correct: true
        why: Das ist der Weg, ohne etwas über die Person. Die Nummer reicht, um Datei und Protokoll zusammenzubringen.
      - text: Den Zeitpunkt, an dem die Figur eine Zone betritt.
        correct: true
        why: Damit beantwortest du Reihenfolge-Fragen aus der Absichtsnotiz mit einer Zeile pro Tester.
      - text: Den Vornamen des Testers im Dateinamen, damit du Sitzungen später zuordnen kannst.
        correct: false
        why: Für die Auswertung brauchst du nur die Sitzungsnummer. Ein Name in den Daten ist eine Information über eine Person, die du nicht brauchst.
      - text: Eine Tonaufnahme der ganzen Sitzung, damit dir nichts entgeht, ohne vorher zu fragen.
        correct: false
        why: Was aufgezeichnet wird, sagst du vorher und fragst nach dem Einverständnis. Für Wege reichen Position, Zeit und Zonen; das Gesagte steht in deinem Protokoll.
    explanation: |
      Die Aufzeichnung dient der Frage, ob der Raum funktioniert, nicht der Person, die ihn testet. Daraus folgt die Auswahl: Position, Zeit und Zonen unter einer Nummer. Alles Weitere fragst du vorher ab oder lässt es weg. Wer vorher erklärt, was gespeichert wird, bekommt außerdem entspanntere Tester.
    resources:
      - title: Godot Docs · Accessing persistent user data (user://)
        url: https://docs.godotengine.org/en/stable/tutorials/io/data_paths.html#accessing-persistent-user-data-user

  - id: spur-deuten
    type: choice
    title: Was sagen die Daten von T2?
    prompt: |
      Im Übersichtsbild liegen an einer Abzweigung 12 Punkte der Spur von T2 auf einer Stelle. Das Zonen-Log von T2 enthält `12.25,Gabelung` und `16.50,Seitengang`, danach endet die Sitzung, ein Eintrag `Tor` fehlt. Welche Aussagen stützen die Daten?
    options:
      - text: T2 stand an der Abzweigung ungefähr drei Sekunden.
        correct: true
        why: 12 Punkte mal 0,25 Sekunden sind 3 Sekunden. Das ist gezählt.
      - text: T2 hat in dieser Sitzung den Seitengang betreten und das Tor nicht.
        correct: true
        why: Das steht im Zonen-Log, mit Zeit.
      - text: T2 war an der Abzweigung unsicher, wohin.
        correct: false
        why: Das ist eine Deutung. T2 kann sich umgesehen, etwas betrachtet oder mit dir gesprochen haben. Ob er unsicher war, sagt dir das Protokoll, nicht die Spur.
      - text: T2 hat die Markierung am Tor nicht gesehen.
        correct: false
        why: Die Spur zeigt, wo die Figur war, nicht wohin der Tester geschaut hat. Gesehen haben kann er sie und sich trotzdem anders entschieden haben.
    explanation: |
      Spuren und Zonen-Logs zählen Ort, Dauer und Reihenfolge. Alles, was im Kopf des Testers passiert, liegt außerhalb. Für die Frage, ob die Markierung am Tor gewirkt hat, brauchst du das Protokoll: Was hat T2 in den drei Sekunden getan und gesagt? Erst dann ordnest du die Stelle einer der vier Arten aus [Überarbeiten](/level-design/ueberarbeiten) zu: „nicht bemerkt“, „falsch gelesen“, „nicht befolgt“ oder „unbeabsichtigte Folge“.
    hints:
      - Frag bei jeder Aussage, ob eine Zahl oder Zeile in den Daten sie belegt.
    resources:
      - title: Mike Ambinder · Valve's Approach to Playtesting, Folien „Stat Collection/Analysis“
        url: https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf

  - id: sitzung-ordnen
    type: order
    title: Eine Sitzung am PC
    prompt: |
      Bring die Schritte einer Testsitzung in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Du committest den Stand, setzt einen Tag und exportierst eine Debug-Version.
      Du legst Absichtsnotiz, Protokoll und Stoppuhr bereit und prüfst, dass Notes im Spiel aus ist.
      Wenn Version und Unterlagen bereitliegen, sagst du dem Tester, was aufgezeichnet wird, und fragst nach seinem Einverständnis.
      Der Tester spielt, du startest die Stoppuhr mit dem Spiel und schreibst mit, ohne zu erklären.
      Nach dem regulären Beenden notierst du die neue Sitzungsnummer im Protokoll.
      Du erzeugst das Übersichtsbild und vergleichst die Spur mit dem erwarteten Weg.
    alternatives:
      - [2, 1, 3, 4, 5, 6]
    explanation: |
      Ob du zuerst exportierst oder zuerst die Unterlagen bereitlegst, ist gleich. Fest ist: Einverständnis vor dem Start, Mitschreiben während des Spiels, die Nummer nach dem Beenden und vor der nächsten Sitzung, damit Protokoll und Datei zusammengehören. Die Auswertung kommt zuletzt, mit allen Daten der Sitzung.
    resources:
      - title: The Level Design Book · Playtesting, „How to run a playtest“
        url: https://book.leveldesignbook.com/process/blockout/playtesting#how-to-run-a-playtest

  - id: csv-zeile
    type: output
    title: Welche Zeile steht bei 1,50 Sekunden?
    prompt: |
      Die Figur startet bei (40, 100) und läuft ab dem ersten Physik-Frame mit konstant 90 Pixeln pro Sekunde nach rechts (Platzhalter, ohne Beschleunigung). `PathRecorder` steht im Baum vor `Objects` und misst, bevor sich die Figur im selben Frame bewegt. Welche Zeile schreibt der Wegschreiber für t = 1,50?
    lang: gdscript
    code: |
      func _physics_process(_delta: float) -> void:
      	if _frame % every_frames == 0:
      		var p := player.global_position
      		_path.store_line("%.2f,%.1f,%.1f" % [_seconds(), p.x, p.y])
      		_path.flush()
      		trail.add_point(p)
      	_frame += 1
    expected: |
      1.50,175.0,100.0
    hints:
      - 1,5 Sekunden sind 90 Physik-Frames.
      - Pro Frame läuft die Figur 1,5 Pixel.
    explanation: |
      Bei t = 1,50 ist `_frame` 90. Weil der Wegschreiber vor der Figur läuft, hat sie sich bis dahin 90-mal bewegt: 90 × 1,5 = 135 Pixel, also x = 175. y bleibt 100. Das Format schreibt die Zeit mit zwei Nachkommastellen und die Pixel mit einer. Gemessen mit Godot 4.7.2. Stünde `PathRecorder` hinter `Objects`, wäre jeder Punkt einen Schritt weiter, hier 176.5.
    resources:
      - title: Godot Docs · FileAccess.store_line
        url: https://docs.godotengine.org/en/stable/classes/class_fileaccess.html#class-fileaccess-method-store-line

  - id: zonen-folge
    type: output
    title: Was steht im Zonen-Log?
    prompt: |
      Zone `Gang` reicht von x = 96 bis 144, Zone `Tor` von x = 192 bis 224, beide über die ganze Höhe des Wegs. Die Figur startet bei x = 40, läuft 2 Sekunden nach rechts (bis x = 220), dann 1 Sekunde nach links (bis x = 130), dann 1 Sekunde nach rechts. Welche Zonen stehen in `zonen.csv`? Schreib nur die Namen, einen pro Zeile, in der Reihenfolge des Logs.
    lang: gdscript
    code: |
      func _on_zone_entered(body: Node2D, zone_name: StringName) -> void:
      	if body == player:
      		_zones.store_line("%.2f,%s" % [_seconds(), zone_name])
      		_zones.flush()
    expected: |
      Gang
      Tor
      Gang
      Tor
    hints:
      - "`body_entered` kommt nur beim Betreten, nicht beim Verweilen."
      - Wo steht die Figur bei x = 130?
    explanation: |
      Auf dem Hinweg betritt die Figur `Gang` und dann `Tor`. Auf dem Rückweg verlässt sie `Tor` und betritt `Gang` ein zweites Mal. Bei x = 130 steht sie in `Gang`; auf dem zweiten Weg nach rechts gibt es deshalb keinen neuen Eintrag für `Gang`, erst wieder für `Tor`. Gemessen mit Godot 4.7.2: Einträge bei 0.58, 1.65, 2.82 und 3.65 Sekunden. Ein zweiter Eintrag derselben Zone heißt also immer: Der Tester war draußen und ist zurückgekommen.
    resources:
      - title: Godot Docs · Area2D.body_entered
        url: https://docs.godotengine.org/en/stable/classes/class_area2d.html#class-area2d-signal-body-entered

  - id: zellen-zaehlen
    type: output
    title: Wo stand T2 am längsten?
    prompt: |
      Das Modell zählt, wie viele Messpunkte eines Wegs in jede Zelle von 16 × 16 Pixeln fallen. Was gibt es aus?
    lang: python
    code: |
      from collections import Counter

      # (t, x, y) aus sitzung_02_weg.csv, gekürzt
      weg = [(0.00, 40.0, 100.0), (0.25, 62.5, 100.0), (0.50, 85.0, 100.0),
             (0.75, 99.0, 96.5), (1.00, 99.0, 96.5), (1.25, 99.0, 96.5),
             (1.50, 99.0, 96.5), (1.75, 100.5, 95.0), (2.00, 121.0, 88.0)]

      zellen = Counter((int(x // 16), int(y // 16)) for t, x, y in weg)
      zelle, anzahl = zellen.most_common(1)[0]
      print(zelle, anzahl * 0.25, "s")
      print(len(zellen), "Zellen besucht")
    expected: |
      (6, 6) 1.0 s
      6 Zellen besucht
    hints:
      - 99 // 16 ist 6, 96.5 // 16 ist 6, 95 // 16 ist 5.
      - Jeder Punkt steht für 0,25 Sekunden.
    explanation: |
      Vier Punkte liegen bei (99, 96.5), also in Zelle (6, 6): eine Sekunde. Der Punkt bei (100.5, 95) liegt schon in Zelle (6, 5), obwohl er nur 1,5 Pixel daneben ist; Zellgrenzen schneiden Halte manchmal in zwei Teile. Besucht wurden (2, 6), (3, 6), (5, 6), (6, 6), (6, 5) und (7, 5). Zelle (4, 6) fehlt, weil die Figur sie zwischen zwei Messpunkten durchquert hat. So eine Zählung ist eine kleine Heatmap auf Tile-Ebene; `//` rundet wie `local_to_map()` ab.
    resources:
      - title: Python · collections.Counter
        url: https://docs.python.org/3/library/collections.html#collections.Counter

  - id: wegschreiber-luecken
    type: gap
    title: Datei öffnen und Zonen verbinden
    prompt: |
      Ergänze den Anfang des Wegschreibers. Die Datei soll neu angelegt werden, die Kopfzeile bekommen, und jede Zone der Gruppe `zones` soll beim Betreten `_on_zone_entered` aufrufen.
    lang: gdscript
    code: |
      func _ready() -> void:
      	DirAccess.make_dir_recursive_absolute("user://wege")
      	_path = FileAccess.open("user://wege/sitzung_01_weg.csv", FileAccess.⟦WRITE⟧)
      	_path.⟦store_line⟧("t,x,y")
      	for zone in get_tree().⟦get_nodes_in_group⟧(&"zones"):
      		zone.⟦body_entered⟧.connect(_on_zone_entered.bind(zone.name))
    gaps:
      - label: Modus zum Schreiben
        hint: Die Konstante von `FileAccess`, die eine Datei neu anlegt oder leert.
        accept: ["WRITE_READ"]
      - label: eine Zeile schreiben
        hint: Schreibt Text und hängt einen Zeilenumbruch an.
      - label: alle Nodes einer Gruppe
        hint: Eine Methode von `SceneTree`.
      - label: Signal beim Betreten
        hint: Das Signal von `Area2D` für Körper, nicht für andere Areas.
    explanation: |
      `FileAccess.WRITE` legt die Datei an oder leert sie, deshalb öffnest du sie genau einmal. `WRITE_READ` tut beim Öffnen dasselbe und erlaubt zusätzlich Lesen; mit Godot 4.7.2 nachgeprüft, der Wegschreiber läuft mit beiden gleich. `store_line()` schreibt die Kopfzeile mit Zeilenumbruch. `get_nodes_in_group()` liefert alle Zonen, egal wo sie im Baum hängen. `body_entered` meldet Körper wie die Figur; `area_entered` würde nur andere Areas melden. Mit `bind()` hängt der Name der Zone als zusätzliches Argument an.
    resources:
      - title: Godot Docs · SceneTree.get_nodes_in_group
        url: https://docs.godotengine.org/en/stable/classes/class_scenetree.html#class-scenetree-method-get-nodes-in-group
      - title: Godot Docs · FileAccess.open
        url: https://docs.godotengine.org/en/stable/classes/class_fileaccess.html#class-fileaccess-method-open

  - id: nur-eine-zeile
    type: bug
    title: Die CSV hat nur eine Zeile
    prompt: |
      Nach einer Sitzung von zwei Sekunden enthält `sitzung_01_weg.csv` nur eine Zeile, `1.75,197.5,100.0`. Die Kopfzeile fehlt, die Spur im Spiel ist vollständig. Finde die Zeile, die das verursacht.
    lang: gdscript
    code: |
      func _physics_process(_delta: float) -> void:
      	if _frame % every_frames == 0:
      		var p := player.global_position
      		_path = FileAccess.open("user://wege/sitzung_01_weg.csv", FileAccess.WRITE)
      		_path.store_line("%.2f,%.1f,%.1f" % [_seconds(), p.x, p.y])
      		_path.flush()
      		trail.add_point(p)
      	_frame += 1
    lines: [4]
    explanation: |
      `FileAccess.WRITE` legt die Datei neu an oder kürzt sie auf null. Jeder Messpunkt öffnet sie neu und löscht damit alles davor, auch die Kopfzeile aus `_ready()`. Übrig bleibt der letzte Punkt. Mit Godot 4.7.2 nachgestellt: genau die Zeile `1.75,197.5,100.0`. Die Zeile gehört gestrichen; die Datei öffnet `_ready()` einmal. Die Spur ist vollständig, weil `add_point()` mit der Datei nichts zu tun hat, deshalb fällt der Fehler im Spiel nicht auf.
    hints:
      - Was macht der Modus `WRITE` mit einer Datei, die schon existiert?
    resources:
      - title: Godot Docs · FileAccess, Konstante WRITE
        url: https://docs.godotengine.org/en/stable/classes/class_fileaccess.html#class-fileaccess-constant-write

  - id: leere-zonen
    type: bug
    title: Das Zonen-Log bleibt leer
    prompt: |
      Nach jeder Sitzung enthält `zonen.csv` nur die Kopfzeile. Mit *Sichtbare Kollisionsformen* siehst du, dass die Figur durch die Zone `Tor` läuft. Die Figur des Testgeländes liegt auf Layer 2 „player“, Layer 3 heißt „pickups“. Finde die Zeile und korrigiere sie.
    lang: ini
    code: |
      [node name="Tor" type="Area2D" parent="." groups=["zones"]]
      position = Vector2(208, 100)
      collision_layer = 0
      collision_mask = 4

      [node name="Shape" type="CollisionShape2D" parent="Tor"]
      shape = SubResource("tor")
    lines: [4]
    fix:
      - line: 4
        answers:
          - collision_mask = 2
          - collision_mask = 3
          - collision_mask = 6
          - collision_mask = 7
    explanation: |
      4 ist der Bitwert für Layer 3 „pickups“. Die Zone sucht also nur Sammelstücke, die Figur auf Layer 2 meldet `body_entered` nicht, obwohl sich die Formen überlappen. Mit Maske 2, dem Bitwert für Layer 2, sieht die Zone die Figur. Jede Maske, die Layer 2 enthält, geht auch, etwa 3 oder 6; die Zone meldet dann zusätzlich Wände oder Sammelstücke, und der Wegschreiber sortiert sie über `body == player` aus. Mit Godot 4.7.2 nachgestellt: Mit Maske 4 bleibt das Log leer, mit 2, 3, 6 oder 7 stehen `Gang` und `Tor` darin. Die Standardmaske 1 schreibt Godot gar nicht in die `.tscn`; steht dort keine Zeile `collision_mask`, sucht die Zone nur Layer 1.
    resources:
      - title: Godot Docs · Using Area2D
        url: https://docs.godotengine.org/en/stable/tutorials/physics/using_area_2d.html

  - id: wegschreiber-erklaeren
    type: explain
    title: Takt, Zeit und flush
    prompt: |
      Erkläre in drei bis fünf Sätzen, wann diese Funktionen eine Zeile schreiben, woher die Zeit kommt und wozu `flush()` dient.
    lang: gdscript
    code: |
      func _physics_process(_delta: float) -> void:
      	if _frame % every_frames == 0:
      		var p := player.global_position
      		_path.store_line("%.2f,%.1f,%.1f" % [_seconds(), p.x, p.y])
      		_path.flush()
      		trail.add_point(p)
      	_frame += 1


      func _seconds() -> float:
      	return _frame / float(Engine.physics_ticks_per_second)
    points:
      - "Bei `every_frames = 15` und 60 Physik-Frames pro Sekunde schreibt die Funktion vier Zeilen pro Sekunde, in den Frames 0, 15, 30 …"
      - Die Zeit kommt aus dem Frame-Zähler geteilt durch die Physik-Frames pro Sekunde, nicht aus der Uhr; sie liegt immer auf dem Raster 0.00, 0.25, 0.50.
      - "`flush()` schreibt jede Zeile sofort auf die Platte; stürzt das Spiel ab, fehlt höchstens die letzte Viertelsekunde. Ohne `flush()` fehlt alles, was noch im Puffer lag, bis zu knapp einer Minute, bei kurzen Sitzungen alles."
      - "`add_point()` hängt denselben Punkt an die Spur, Datei und Spur zeigen also dieselben Messpunkte."
    explanation: |
      Die Funktion läuft in jedem Physik-Frame, schreibt aber nur, wenn der Zähler ein Vielfaches von 15 ist, bei 60 Physik-Frames pro Sekunde also viermal pro Sekunde. Die Zeit rechnet `_seconds()` aus dem Zähler, deshalb stehen in der Datei glatte Werte wie 0.25 und 0.50, egal wie schnell der Rechner zeichnet. `flush()` schreibt den Puffer sofort auf die Platte. Mit Godot 4.7.2 nachgeprüft: Ohne `flush()` fehlte nach einem harten Abbruch alles, was noch im Puffer von 4096 Byte lag, nach einer kurzen Sitzung die ganze Datei; mit `flush()` enthielt sie alle Punkte bis zum Abbruch. `add_point()` hängt denselben Punkt an die Spur, Bild im Spiel und Datei passen zusammen.
    resources:
      - title: Godot Docs · FileAccess.flush
        url: https://docs.godotengine.org/en/stable/classes/class_fileaccess.html#class-fileaccess-method-flush

  - id: wegschreiber-einbauen
    type: practice
    title: Den Wegschreiber in deinen Blockout bauen
    prompt: |
      Bau Wegschreiber, Zonen, erwarteten Weg und Spur in deinen Blockout ein und teste alles mit einem eigenen Durchlauf. Welche Orte Zonen werden und wie der erwartete Weg verläuft, entscheidest du aus deiner Absichtsnotiz; die Skripte darf dir ein Agent schreiben.
    lang: prose
    checklist:
      - "`PathRecorder` steht im Baum vor `Objects`, `player` und `trail` sind im Inspektor gesetzt."
      - Jede Zone ist eine `Area2D` in der Gruppe `zones`, ihre Maske enthält den Layer deiner Figur, und ihr Name ist ein Ort aus deiner Absichtsnotiz.
      - "`ExpectedPath` und `Trail` hängen unter `Notes`, liegen wie `Notes` bei (0, 0), haben `width` 1 und sind im Spiel aus."
      - Nach deinem Durchlauf gibt es eine neue Weg-Datei mit vier Zeilen pro Sekunde und ein Zonen-Log mit deinen Zonen in der gelaufenen Reihenfolge.
      - Das Übersichtsbild zeigt Wände, erwarteten Weg und deine Spur deckungsgleich mit dem Abschnitt.
      - Du hast das Spiel einmal hart beendet und geprüft, dass die Datei bis kurz davor gefüllt ist.
    hints:
      - Lauf beim ersten Durchlauf absichtlich einmal zurück, dann siehst du im Zonen-Log, ob ein zweiter Eintrag kommt.
    explanation: |
      Ein eigener Durchlauf prüft die Technik, bevor ein Tester seine Zeit investiert. Dass das Zonen-Log deine Reihenfolge wiedergibt und das Übersichtsbild auf den Abschnitt passt, sind die zwei Proben, die du brauchst. Der harte Abbruch zeigt dir, dass `flush()` wirkt; unter Linux beendet `kill -9` mit der Prozessnummer das Spiel ohne Aufräumen.
    resources:
      - title: Godot Docs · Groups
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/groups.html
      - title: Godot Docs · Line2D.add_point
        url: https://docs.godotengine.org/en/stable/classes/class_line2d.html#class-line2d-method-add-point

  - id: sitzung-mit-tester
    type: practice
    title: Eine Sitzung mit einem Tester
    prompt: |
      Führ eine Sitzung mit einer Person durch, die deinen Abschnitt nicht kennt. Wer das ist, entscheidest du. Bereite sie vor wie in der Lektion, sieh zu, ohne zu erklären, und halte Protokoll und Aufzeichnung zusammen.
    lang: prose
    checklist:
      - Der getestete Stand hat einen Tag, und das Protokoll nennt ihn.
      - Der Tester wusste vor dem Start, was aufgezeichnet wird, und hat zugestimmt.
      - Weder Dateinamen noch Protokoll enthalten seinen Namen; er heißt T1 oder trägt die Sitzungsnummer.
      - Notizen, Spur und erwarteter Weg waren während der Sitzung aus.
      - Du hast nichts erklärt; jeder Eingriff steht mit Zeit im Protokoll.
      - Die Sitzungsnummer der neuen Dateien steht im Protokoll.
    hints:
      - Sag vorher einen Satz wie „Das Spiel speichert, wo die Figur langläuft, keinen Namen und keinen Ton. In Ordnung?“ und dann nichts mehr zum Abschnitt.
    explanation: |
      Eine einzige Sitzung reicht, um den Ablauf zu üben: Einverständnis, Stoppuhr, Protokoll, Nummer. Für Aussagen über deinen Abschnitt brauchst du mehrere Tester, das ist Teil der [Werkstatt](/level-design/werkstatt-abschnitt). Jeder Eingriff mit Zeit im Protokoll erklärt dir später Halte in der Spur, die sonst wie Verwirrung aussehen.
    resources:
      - title: The Level Design Book · Playtesting, „Playtest formats“
        url: https://book.leveldesignbook.com/process/blockout/playtesting#playtest-formats
      - title: Nielsen Norman Group · Talking with Users in a Usability Test
        url: https://www.nngroup.com/articles/talking-to-users/

  - id: spuren-auswerten
    type: practice
    title: Spur und Absicht vergleichen
    prompt: |
      Erzeuge das Übersichtsbild für deine Sitzungen und leg es neben Absichtsnotiz und Protokoll. Schreib drei bis fünf Beobachtungen auf. Welche Stellen du auswählst und was du daraus schließt, entscheidest du.
    lang: prose
    starter: |
      Ort (Zone oder Zelle) | Zeit | Spur zeigt | Protokoll sagt | meine Deutung
    checklist:
      - Jede Beobachtung nennt einen Ort und eine Zeit.
      - Jede Beobachtung trennt, was Spur und Protokoll zeigen, von deiner Deutung.
      - Mindestens eine Beobachtung vergleicht die Spur mit dem erwarteten Weg.
      - Halte von mehr als zwei Sekunden und Umkehrungen sind gezählt, nicht geschätzt.
      - Du hast notiert, welche Frage die Daten nicht beantworten und wie du sie beim nächsten Test klärst.
    hints:
      - Acht Punkte auf einer Stelle sind zwei Sekunden.
    explanation: |
      Die Tabelle zwingt dich, Ort, Zeit und Quelle zu nennen, bevor du deutest. Dann kannst du später prüfen, ob eine Änderung das beobachtete Verhalten getroffen hat. Wie du aus solchen Beobachtungen eine Änderung ableitest, zeigt [Überarbeiten](/level-design/ueberarbeiten).
    resources:
      - title: Mike Ambinder · Valve's Approach to Playtesting (Folien, GDC 2009)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf
