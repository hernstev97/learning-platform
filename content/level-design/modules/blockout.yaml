id: blockout
title: "Blockout in Godot: graue Formen und Platzhalter-Tiles"
level: 2
minutes: 150
summary: Aus deiner Skizze einen begehbaren Abschnitt in Godot bauen – mit flachen Tonwerten statt Grafik, getrennten Ebenen für Boden, Wände, Hinweise und Notizen, einer Kamera mit Grenzen und einem Maßstabsraum, billig genug, um ihn nach jedem Test umzubauen.
place: pc
goals:
  - Du erklärst, warum ein Blockout das Layout prüft und nicht die Grafik, und hältst ihn getrennt von der späteren Ausgestaltung.
  - Du legst ein Platzhalter-TileSet an, in dem jede Kategorie deiner Blockout-Vokabel genau eine flache Tile hat, wo nötig mit einer einfachen Formmarke.
  - Du baust einen Abschnitt aus den getrennten Ebenen `Ground`, `Walls` und `Cues` und hältst Notizen mit `Marker2D` und `Label` fest, die im Spiel ausgeblendet sind.
  - Du setzt die Grenzen der Kamera aus der bemalten Fläche und rechnest aus, wie viele Bildschirme ein Abschnitt hat.
  - Du läufst jeden Blockout selbst mit der Spielfigur ab und sicherst jede Runde in Git.
