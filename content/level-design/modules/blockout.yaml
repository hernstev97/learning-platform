lesson: |
  Lehrbeispiel: Auf deinem Karopapier steht ein Hof, 20 × 12 Kästchen, mit einem Tor rechts und einem Gang nach unten, ein Kästchen breit. Auf Papier sieht alles klar aus. In Godot läufst du los und merkst drei Dinge auf einmal: Der Hof passt fast ganz in ein Bild, also siehst du das Tor, das eine Entdeckung sein sollte, vom ersten Moment an. Der Gang, ein Kästchen breit, wirkt in Bewegung enger als auf Papier. Und die Fläche in der Mitte, die nach Platz aussah, durchquerst du in gut drei Sekunden.

  Das Level Design Book sagt es knapp: „You can't playtest a design document or a layout sketch, but you can playtest a blockout“ ([Blockout](https://book.leveldesignbook.com/process/blockout)). Ein **Blockout** ist die begehbare Rohfassung eines Levels aus einfachen Formen, ohne Details und ohne fertige Grafik. In diesem Modul baust du die Skizze aus [Absicht notieren, Layout skizzieren](/level-design/absicht-skizze) in Godot nach, mit grauen Tiles. Du brauchst Godot 4.7 am PC und das Testgelände aus [Ein fremdes Projekt erkunden](/godot/projekt-erkunden). Die zwei Skripte hier sind technisches Gerüst, eine KI darf sie schreiben. Wo eine Wand steht, wie breit ein Gang ist und was ein Hinweis zeigt, entscheidest du. Alle Zahlen sind Platzhalter: Tiles 16 × 16, Spielbild 320 × 180, Figur mit 90 Pixeln pro Sekunde.

  ## Warum grau: billig ändern, Layout statt Grafik prüfen

  Das Level Design Book beschreibt den Blockout für 3D als „rough draft level built with simple 3D shapes, but without any details or polished art assets“. In der Draufsicht heißt das: flache Tiles in wenigen Tonwerten, dazu einfache Polygone für Formen, die nicht ins Raster passen. Der Grund steht im selben Abschnitt: Grobe Blockout-Geometrie zu löschen oder neu zu bauen ist „cheap“, fertige Grafik wegzuwerfen ist „expensive“ und verschwenderisch.

  Billig heißt hier zweierlei. Eine graue Wand verschiebst du in Sekunden, und es tut dir nicht leid um sie. Mit fertiger Pixelart zögerst du, und ein Gang, der zu schmal ist, bleibt schmal, weil das Umzeichnen Stunden kostet. Weiter unten steht ohne Umschweife: „99% of the time, your blockout will not survive a playtest.“ Räume fühlen sich falsch an, Türen sind zu eng, das Layout verwirrt. Genau dafür baust du ihn.

  Ein Blockout beantwortet Fragen zum Raum: Passt die Figur durch? Sieht der Spieler das Tor, bevor er davorsteht? Wie lange dauert der Weg? Welchen Weg nehmen Tester, die deine Absicht nicht kennen? Er beantwortet nicht, ob der Ort schön ist oder welche Stimmung er hat. Das kommt in [Vom Blockout zur Ausgestaltung](/level-design/ausgestaltung), nachdem der Blockout einen Test bestanden hat. Fertige Pixelart brauchst du für dieses Modul nicht.

  > [!MERKE]
  > Der Blockout klärt, ob Spieler tun, was du beabsichtigst. Die Ausgestaltung klärt, wie der Ort aussieht. Wer beides zugleich baut, weiß nach einem Test nicht, ob das Layout oder die Grafik gewirkt hat.

  ## Ein Platzhalter-TileSet aus flachen Tonwerten

  Wie du ein TileSet aus einem Bild anlegst, Tilegröße einstellst und Wand-Tiles eine Physik-Ebene gibst, zeigt [2D-Level aus Tiles](/godot/level-tilemap). Für den Blockout zeichnest du dir ein zweites, kleines Atlasbild mit einem Feld pro Kategorie deiner Blockout-Vokabel aus [Umgebung als Information](/level-design/umgebung-informiert): ein flacher Tonwert, wo die Vokabel es verlangt mit einer einfachen Formmarke wie einem Kreis oder einem Gitter. Das Level Design Book rät, Wände in einer anderen Farbe als den Boden zu zeigen, und fügt hinzu: „If you are afraid of colors affecting your blockout too much, then at least use textures with different shades of gray.“

  Jede Kategorie bekommt genau eine Tile. Das Lehrbeispiel dieses Moduls benutzt die sechs Kategorien der Vorlage aus „Umgebung als Information“ mit diesen Platzhaltern:

  | Kategorie | Zeichen in der Rasterkarte | Platzhalter im Lehrbeispiel | Ebene | Kollision |
  | --- | --- | --- | --- | --- |
  | begehbar | `.` `+` `S` | mittleres Grau `#8c8c8c` | `Ground` | nein |
  | blockiert hoch | `#` | dunkles Grau `#3c3c3c` | `Walls` | ja |
  | blockiert tief | `o` `~` | Grau `#646464` | `Walls` | ja |
  | gefährlich | – | fast Schwarz `#1e1e1e` mit hellem Gitter | `Walls`, wenn es den Weg sperrt, sonst `Ground` | nur auf `Walls` |
  | benutzbar | – | mittleres Grau mit dunklem Kreis | `Walls`, wenn es den Weg sperrt, sonst `Ground` | nur auf `Walls` |
  | Hinweis | `!` | helles Gelb `#f0d23c` | `Cues` | nein |

  Im Lehrbeispiel ist alles, was blockiert, dunkler als der Boden, gefährlich und benutzbar tragen zusätzlich eine Form, und der Hinweis ist die hellste Fläche. Ob dein Hinweis heraussticht, prüfst du mit einem Screenshot aller Tiles in Graustufen und mit zusammengekniffenen Augen, wie in [Komposition und Blickführung](/level-design/blickfuehrung). Warum der Tonwert vor der Farbe kommt, erklärt [Licht, Schatten und Tonwerte](/pixelart/licht-werte). Die Tabelle ist ein Lehrbeispiel; deine eigene Vokabel ersetzt sie.

  So sieht der Hof aus dem Einstieg als Rasterkarte aus, ein Zeichen pro Tile, 20 Zeichen sind ein Bildschirm breit:

  ```text
  ####################
  #..................#
  #..oo.........~~~..#
  #..oo.........~~~..#
  #S.................+
  #.......!..........#
  #..................#
  ######.#############
  ######.#############
  ######.#############
  ######!#############
  ######+#############
  ```

  Legende: `#` Wand, `.` Boden, `o` niedriges Hindernis, `~` Wasser oder Abgrund, `+` Durchgang, `S` Start, `!` beabsichtigter Hinweis. In Godot wird daraus: Boden und Durchgänge auf `Ground`, `#`, `o` und `~` auf `Walls`, jedes `!` auf `Cues` über dem Boden. `S` ist die Position der Figur.

  ## Getrennte Ebenen: Ground, Walls, Cues und Notizen

  Ein `TileMapLayer` zeigt in jeder Zelle höchstens eine Tile. Mehrere Ebenen sind mehrere Nodes ([Multiple TileMapLayers and settings](https://docs.godotengine.org/en/stable/tutorials/2d/using_tilemaps.html#multiple-tilemaplayers-and-settings)). Für den Blockout bekommt jede Aufgabe ihre eigene Ebene, mit englischen Node-Namen wie im Godot-Kurs:

  ```text
  Main (Node2D)
  ├── Ground (TileMapLayer)      Boden, keine Kollision
  ├── Cues (TileMapLayer)        Hinweise, collision_enabled aus
  ├── Objects (Node2D)           y_sort_enabled
  │   ├── Walls (TileMapLayer)   Wände und Hindernisse, mit Kollision
  │   └── Player                 Figur aus dem Testgelände
  ├── Notes (Node2D)             notes.gd, im Spiel aus
  │   └── Note1 (Marker2D)
  │       └── Label
  └── CameraLimits (Node)        camera_limits.gd
  ```

  Die Trennung hat drei Gründe. Erstens kollidiert nur `Walls`. `Cues` bekommt im Inspektor *Collision Enabled* aus ([collision_enabled](https://docs.godotengine.org/en/stable/classes/class_tilemaplayer.html#class-tilemaplayer-property-collision-enabled)); ein Hinweis darf den Weg nicht verändern, sonst misst dein Test die Sperre statt des Hinweises. Zweitens blendest du mit dem Augensymbol im Szenen-Dock jede Ebene aus und siehst, was der Raum ohne Hinweise sagt. Drittens kommt später eine Ebene `Dressing` für die Ausgestaltung dazu, und `Ground` und `Walls` bleiben dabei, was sie sind. Warum `Walls` unter `Objects` hängt und Y-sortiert ist, steht in [2D-Level aus Tiles](/godot/level-tilemap).

  Nicht alles passt ins Raster. Eine schräge Kante, eine große Landmarke oder ein Platz, der kein Rechteck ist, entsteht als [`Polygon2D`](https://docs.godotengine.org/en/stable/classes/class_polygon2d.html) oder `ColorRect` in einem der Tonwerte. Soll die Form blockieren, braucht sie einen Körper mit Kollisionsform wie die Kiste im Testgelände ([Kollisionen und Trefferzonen](/godot/kollision-ebenen)).

  ### Notizen im Editor, aus im Spiel

  Für Notizen eignet sich der `Marker2D`. Die Doku nennt ihn „Generic 2D position hint for editing“, im Editor erscheint er immer als Kreuz ([Marker2D](https://docs.godotengine.org/en/stable/classes/class_marker2d.html)). Ein `Label` als Kind trägt den Text: Wegpunkte des erwarteten Wegs, „Hier soll das Tor zu sehen sein“, eine Frage für den Test. Eine verwandte Idee beschreibt Joel Burgess: Für das Projekt nach Skyrim führte Bethesda „Helper Markers“ für seine Baukästen ein, „editor-only markup that can help convey meaningful information about the kit“, etwa wie Teile zusammenpassen ([Transkript des GDC-Vortrags](http://blog.joelburgess.com/2013/04/skyrims-modular-level-design-gdc-2013.html)). Dort tragen die Marker Wissen über Bauteile, bei dir Wissen über deine Absicht; in beiden Fällen sieht sie nur, wer im Editor baut.

  Tester sollen deine Notizen nicht sehen. Dieses Skript am Node `Notes` blendet sie beim Start aus und mit einer Taste wieder ein:

  ```gdscript title=notes.gd
  extends Node2D

  ## Notizen im Blockout: im Editor sichtbar, im laufenden Spiel zuerst aus.
  ## Die Aktion toggle_notes blendet sie ein und aus. Technisches Gerüst.


  func _ready() -> void:
  	visible = false


  func _unhandled_input(event: InputEvent) -> void:
  	if event.is_action_pressed(&"toggle_notes"):
  		visible = not visible
  		print("Notizen sichtbar: ", visible)
  ```

  Leg dafür in der Eingabe-Zuordnung die Aktion `toggle_notes` an, im Lehrbeispiel auf der Taste N. `_ready()` läuft nur im Spiel, also bleiben die Notizen im Editor sichtbar. `_unhandled_input()` bekommt Eingaben, die keine Oberfläche verbraucht hat ([Node._unhandled_input](https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-private-method-unhandled-input)). Kinder wie `Marker2D` und `Label` folgen der Sichtbarkeit ihres Elternknotens ([CanvasItem.visible](https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#class-canvasitem-property-visible)). Mit Godot 4.7.2 nachgeprüft: Nach dem Start ist `Notes` aus, ein Druck auf die Aktion schaltet es ein, und die Ausgabe zeigt `Notizen sichtbar: true`.

  > [!WARNING] Notiz oder Hinweis?
  > Was der Spieler sehen soll, gehört auf `Cues`, nie in `Notes`. Eine Notiz, die beim Test sichtbar ist, erklärt den Raum, und du misst deine Erklärung statt deines Layouts.

  ## Die Kamera an der bemalten Fläche begrenzen

  Die Kamera des Testgeländes hängt an der Figur. Am Rand des Abschnitts zeigt sie sonst, was hinter dem Boden liegt, also nichts. `Camera2D` hat dafür Grenzen in Pixeln: `limit_left`, `limit_top`, `limit_right`, `limit_bottom` ([Camera2D.limit_left](https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-limit-left)). Statt sie nach jeder Änderung von Hand nachzutragen, liest ein kleines Skript sie aus `Ground`:

  ```gdscript title=camera_limits.gd
  extends Node

  ## Setzt die Grenzen der aktiven Kamera auf die bemalte Fläche von Ground.
  ## Technisches Gerüst: Welche Fläche du bemalst, entscheidest du.

  @export var ground: TileMapLayer


  func _ready() -> void:
  	var camera := get_viewport().get_camera_2d()
  	var rect := ground.get_used_rect()
  	var tile := ground.tile_set.tile_size
  	camera.limit_left = rect.position.x * tile.x
  	camera.limit_top = rect.position.y * tile.y
  	camera.limit_right = rect.end.x * tile.x
  	camera.limit_bottom = rect.end.y * tile.y
  	print("Kamera-Grenzen: ", camera.limit_left, " ", camera.limit_top, " ", camera.limit_right, " ", camera.limit_bottom)
  ```

  Hänge das Skript an einen `Node` namens `CameraLimits` und zieh `Ground` in das Feld *Ground* im Inspektor. Was die Zeilen tun:

  - `get_camera_2d()` liefert die aktive Kamera, hier die an der Figur ([Viewport.get_camera_2d](https://docs.godotengine.org/en/stable/classes/class_viewport.html#class-viewport-method-get-camera-2d)). Mit Godot 4.7.2 nachgeprüft: Das klappt auch, wenn `CameraLimits` vor `Objects` im Baum steht, denn alle Nodes sind im Baum, bevor das erste `_ready()` läuft.
  - `get_used_rect()` gibt das Rechteck um alle bemalten Zellen zurück, in Zellen, nicht in Pixeln ([TileMapLayer.get_used_rect](https://docs.godotengine.org/en/stable/classes/class_tilemaplayer.html#class-tilemaplayer-method-get-used-rect)).
  - `rect.end` ist `position + size`, die Ecke rechts unten, eine Zelle hinter der letzten bemalten ([Rect2i.end](https://docs.godotengine.org/en/stable/classes/class_rect2i.html#class-rect2i-property-end)). Mal Tilegröße ergibt Pixel.
  - Das Skript setzt voraus, dass `Ground` bei (0, 0) liegt und nicht skaliert ist. So ist es im Testgelände.

  Gemessen mit Godot 4.7.2: Boden von Zelle (−2, −1) bis (37, 10) bemalt, Ausgabe `Kamera-Grenzen: -32 -16 608 176`.

  ### Wie viele Bildschirme hat ein Abschnitt?

  Das Spielbild ist 320 × 180 Pixel, also 20 × 11,25 Tiles. Ein Abschnitt von 40 × 12 Zellen ist 640 × 192 Pixel groß. Waagerecht hat die Kamera 320 Pixel Spielraum, genau ein zweiter Bildschirm. Senkrecht sind es nur 12 Pixel. Mit 11 Zeilen, also 176 Pixeln, ist die Fläche niedriger als das Bild. Dann zentriert Godot 4.7.2 die Kamera, nachgemessen: Sichtbar ist y = −2 bis 178, oben und unten bleiben je 2 Pixel ohne Boden. Plane deshalb mindestens 12 Zeilen Boden. Das Skript zählt nur Zellen auf `Ground`; bemalst du den Boden auch unter den Wänden, gehören deren Zeilen dazu.

  ## Der Maßstabsraum: Maße, die du ablaufen kannst

  Das Level Design Book unterscheidet bei Metriken die messbaren Werte der Figur: „Player metrics (or physics metrics) are factual numbers measured in-engine like player size, movement speed“ ([Metrics](https://book.leveldesignbook.com/process/blockout/metrics)). Es rät zu einer eigenen Testkarte, einem „metrics zoo“ oder „metrics playground“ ([Build a metrics zoo test map](https://book.leveldesignbook.com/process/blockout/metrics#build-a-metrics-zoo-test-map)), und warnt im selben Text: „metrics are not magic“.

  Bau dir dafür eine eigene Szene, den Maßstabsraum, mit demselben TileSet und derselben Figur. Darin stehen Gänge mit 1, 2 und 3 Tiles Breite, gerade und mit Ecke, Türen mit 1 und 2 Tiles, ein Rahmen aus 20 × 11 Tiles für einen Bildschirm und Markierungen für die Strecke, die die Figur in einer Sekunde läuft (90 Pixel, gut 5,6 Tiles), und für die Ausweichweite (66 Pixel, rund 4 Tiles, aus [Ausweichen, Risiko und Belohnung](/combat/ausweichen)). Mit Godot 4.7.2 nachgeprüft: Die Fußform des Testgeländes, 10 × 6 Pixel, läuft durch einen senkrechten Gang von einer Tile Breite. Dass sie durchpasst, heißt noch nicht, dass sich der Gang gut läuft. Das merkst du erst, wenn du schräg in die Ecken steuerst. Wie du aus diesen Werten Gang- und Arenabreiten ableitest, behandelt [Maßstab, Dichte und Freiflächen](/level-design/massstab-dichte).

  > [!TIP]
  > Für Skyrim galt laut Burgess ein Minimum von „two character widths“ für den schmalsten begehbaren Raum, damit zwei computergesteuerte Figuren aneinander vorbeikommen. Das ist eine Regel für deren Spiel, keine für deins. Sie zeigt aber, wie man vorgeht: Eine Mindestbreite wird einmal festgelegt, begründet und im Maßstabsraum geprüft.

  ## Iteration: ablaufen, ändern, sichern

  Das Level Design Book verlangt für jeden Blockout zuerst einen eigenen Test: „walk around the space, within the game engine, with full player gravity, collision, and speed“, und ausdrücklich nicht nur im Editor herumschauen. Für dich heißt das: F5, mit der Figur jeden Gang ablaufen, jede Tür, jede Ecke schräg anlaufen und das Tor aus der Richtung suchen, aus der ein Tester kommt.

  Danach sicherst du den Stand. Die gemalten Zellen speichert Godot binär in `tile_map_data`; ein Diff davon sagt nichts ([2D-Level aus Tiles](/godot/level-tilemap)). Die Commit-Nachricht muss deshalb sagen, was du geändert hast und warum. Vor jedem Test setzt du einen Tag, damit du später weißt, welcher Stand getestet wurde. Wie Tags und Testversionen zusammenhängen, steht in [Testversionen exportieren](/godot/export-sichern).

  ```console
  $ git add .
  $ git commit -m "Blockout Runde 2: Gang nach unten 2 statt 1 Tile breit"
  $ git tag blockout-r2
  ```

  Leg zu jeder Runde einen Screenshot des Abschnitts in deine Notizen. Wie du Tests mit anderen Menschen führst und Wege aufzeichnest, zeigen [Beobachten, ohne zu erklären](/level-design/playtest-methode) und [Playtest am PC](/level-design/playtest-godot).

  > [!PRAXIS] „Functional-but-ugly“ bei Bethesda
  > Joel Burgess und Nate Purkeypile beschreiben, wie Bethesda für Skyrim modulare Baukästen gebaut hat. Das Ziel war, sie so früh wie möglich in einen „functional-but-ugly“ Zustand zu bringen, damit das Level-Design arbeiten kann, während die Grafik ohne Eile ihre Richtung findet. Die ersten Teile, „proof pieces“, haben laut Transkript „almost no mesh detail and usually no textures at all“. Burgess betont auch, wie wichtig es ist, die eigene Arbeit oft zu spielen, „rather than staying editor-side for too long“ ([Transkript](http://blog.joelburgess.com/2013/04/skyrims-modular-level-design-gdc-2013.html), [Folien](https://www.slideshare.net/slideshow/gdc2013-kit-buildingfinal/17728576)).

  > [!INTERVIEW]
  > „Warum zeigst du uns graue Kästen statt eines fertigen Levels?“ Gute Antwort: Weil ich das Layout prüfen will, solange Änderungen billig sind. Grau trennt die Fragen: Passt die Figur durch, sehen Tester den Ausgang, stimmt die Reihenfolge? Hinweise liegen auf einer eigenen Ebene ohne Kollision, Notizen sind im Spiel aus. Hält der Blockout im Playtest, gestalte ich ihn aus und wiederhole denselben Test, um zu sehen, ob die Hinweise die Grafik überleben.

  ## Häufige Fehler

  - **Ausgestaltung im Blockout.** Gras mit drei Varianten, Deko an den Wänden. Der Test misst dann die Grafik mit, und jede Änderung wird teuer. Flache Tonwerte, bis der Blockout einen Test bestanden hat.
  - **Hinweise mit Kollision.** Liegt ein Hinweis auf `Walls` oder hat `Cues` Kollision, ändert er den Weg. Nimmst du ihn später weg, ändert sich das Layout mit.
  - **Notizen beim Test sichtbar.** Der Tester liest „Tor“ und geht zum Tor. Notizen gehören auf `Notes`, und `Notes` ist im Spiel aus.
  - **Kamera ohne Grenzen.** Am Rand zeigt das Bild leere Fläche, die es im Abschnitt nicht gibt.
  - **`size` statt `end`.** Beginnt der Boden nicht bei Zelle 0, verschiebt `rect.size` die rechte oder untere Grenze um genau diesen Versatz.
  - **Abschnitt niedriger als das Bild.** 11 Zeilen sind 176 Pixel; das Bild ist 180 hoch. Godot zentriert, und oben und unten bleibt ein Streifen.
  - **Nur im Editor schauen.** Im Editor siehst du den ganzen Abschnitt von oben. Im Spiel siehst du 20 × 11 Tiles um die Figur. Lauf ihn ab.
  - **Kein Commit vor dem Test.** Nach drei Runden weißt du nicht mehr, welcher Stand welche Beobachtung erzeugt hat.

  ## Zusammenfassung

  - Ein Blockout ist die begehbare Rohfassung aus flachen Formen. Er prüft Wege, Breiten, Sicht und Reihenfolge, nicht die Grafik.
  - Ein Platzhalter-TileSet hat eine Tile pro Kategorie der Blockout-Vokabel: flache Tonwerte, wo nötig mit einer einfachen Formmarke. Der Hinweis muss im Graustufen- und Unschärfetest herausstechen.
  - `Ground`, `Walls` und `Cues` sind getrennte `TileMapLayer`. Nur `Walls` kollidiert. `Dressing` kommt erst nach dem Test dazu.
  - Notizen sind `Marker2D` mit `Label` unter `Notes`; `notes.gd` blendet sie im Spiel aus und per Taste ein.
  - `camera_limits.gd` setzt die Kameragrenzen aus `get_used_rect()` und `rect.end` mal Tilegröße.
  - 320 × 180 sind 20 × 11,25 Tiles. Ein Abschnitt mit weniger als 12 Zeilen ist niedriger als das Bild.
  - Der Maßstabsraum zeigt Gänge, Türen, Laufstrecke und Ausweichweite der Figur zum Ablaufen.
  - Jede Runde: im Spiel ablaufen, ändern, committen, vor dem Test taggen.
exercises:
  - id: was-gehoert-hinein
    type: choice
    title: Was gehört in den ersten Blockout?
    prompt: |
      Lehrbeispiel: Du baust den ersten Blockout eines Hofs mit einem Tor als Ausgang. Welche Dinge gehören hinein?
    options:
      - text: Flache Platzhalter-Tiles, eine pro Kategorie deiner Blockout-Vokabel, etwa begehbar, blockiert hoch und blockiert tief.
        correct: true
        why: Das ist der Kern eines Blockouts. Jede Fläche hat eine Bedeutung, und keine lenkt mit Details ab.
      - text: Eine gelbe Platzhalter-Tile auf `Cues` an der Stelle, an der später eine Laterne das Tor zeigen soll.
        correct: true
        why: Der beabsichtigte Hinweis gehört schon in den Blockout, sonst testest du einen Raum ohne die Hilfe, die du geplant hast. Als flache Tile ohne Kollision ist er billig zu verschieben.
      - text: Fertige Gras-Tiles mit drei Varianten, damit der Hof beim Test nicht so leer wirkt.
        correct: false
        why: Das ist Ausgestaltung. Der Test misst dann die Grafik mit, und jede Layoutänderung kostet Zeichenarbeit.
      - text: Ein `Label` mit „Hier soll der Spieler zuerst das Tor sehen“, das die Tester während des Tests sehen.
        correct: false
        why: Notizen sind für dich. Sieht der Tester sie, erklärst du ihm den Raum und misst deine Erklärung statt des Layouts.
    explanation: |
      Ein Blockout enthält alles, was das Verhalten im Raum bestimmen soll: begehbare und blockierte Flächen und die geplanten Hinweise. Er enthält nichts, was nur gut aussehen soll, und nichts, was dem Tester die Absicht verrät. Notizen hältst du trotzdem fest, auf einer eigenen Ebene, die im Spiel aus ist.
    hints:
      - Frag bei jeder Option, ob sie das Verhalten des Testers prüft oder beeinflusst, ohne Teil des Raums zu sein.
      - Zwei Optionen sind richtig.
    resources:
      - title: The Level Design Book · Blockout
        url: https://book.leveldesignbook.com/process/blockout

  - id: erste-runde-ordnen
    type: order
    title: Von der Skizze zum ersten Test
    prompt: |
      Bring die Schritte für die erste Blockout-Runde in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Du legst ein TileSet mit den Platzhalter-Tonwerten deiner Blockout-Vokabel an.
      Du malst Boden, Wände und Hinweise auf Ground, Walls und Cues.
      Du verbindest CameraLimits mit Ground und startest das Spiel.
      Du läufst mit der Figur jeden Gang und jede Tür ab, auch schräg in die Ecken.
      Du änderst, was nicht passt, und läufst den Abschnitt erneut ab.
      Du committest den Stand und markierst ihn mit einem Tag.
      Du lässt eine andere Person den Abschnitt spielen und siehst zu.
    explanation: |
      Ohne Tiles gibt es nichts zu malen, ohne bemalten Boden keine Kameragrenzen. Der eigene Durchlauf kommt vor jedem fremden Test: Fehler, die du selbst findest, etwa ein Gang, in dem die Figur hängen bleibt, kosten keinen Tester. Der Tag vor dem Test sorgt dafür, dass du jede Beobachtung später genau einem Stand zuordnen kannst.
    hints:
      - Was muss es geben, bevor die Kamera Grenzen bekommen kann?
    resources:
      - title: The Level Design Book · Blockout, „How to blockout“
        url: https://book.leveldesignbook.com/process/blockout

  - id: zelle-vorhersagen
    type: output
    title: In welcher Zelle steht die Figur?
    prompt: |
      `walls` ist ein `TileMapLayer` bei (0, 0) mit Tiles von 16 × 16 Pixeln. Was gibt Godot 4.7 aus?
    lang: gdscript
    code: |
      print(walls.local_to_map(Vector2(171.5, 94)))
      print(walls.local_to_map(Vector2(-3, 47.9)))
    expected: |
      (10, 5)
      (-1, 2)
    accept:
      - |
        (10,5)
        (-1,2)
    hints:
      - Teile jede Koordinate durch 16 und runde ab.
      - Abrunden heißt auch bei negativen Zahlen zur kleineren Zahl hin.
    explanation: |
      171,5 / 16 = 10,7, abgerundet 10; 94 / 16 = 5,9, abgerundet 5. −3 / 16 = −0,19, abgerundet −1; 47,9 / 16 = 2,99, abgerundet 2. Gemessen mit Godot 4.7.2. Mit dieser Rechnung findest du heraus, auf welcher Zelle ein Tester stehen geblieben ist, wenn du nur seine Position in Pixeln hast.
    resources:
      - title: Godot Docs · TileMapLayer.local_to_map
        url: https://docs.godotengine.org/en/stable/classes/class_tilemaplayer.html#class-tilemaplayer-method-local-to-map

  - id: kamera-grenzen-vorhersagen
    type: output
    title: Wo bleibt die Kamera stehen?
    prompt: |
      Auf `Ground` (bei (0, 0), Tiles 16 × 16) sind alle Zellen von (−2, −1) bis einschließlich (37, 10) bemalt. Was gibt `camera_limits.gd` aus der Lektion beim Start aus?
    lang: gdscript
    code: |
      var rect := ground.get_used_rect()
      var tile := ground.tile_set.tile_size
      camera.limit_left = rect.position.x * tile.x
      camera.limit_top = rect.position.y * tile.y
      camera.limit_right = rect.end.x * tile.x
      camera.limit_bottom = rect.end.y * tile.y
      print("Kamera-Grenzen: ", camera.limit_left, " ", camera.limit_top, " ", camera.limit_right, " ", camera.limit_bottom)
    expected: |
      Kamera-Grenzen: -32 -16 608 176
    hints:
      - "`rect.position` ist (−2, −1), `rect.size` ist (40, 12)."
      - "`rect.end` ist `position + size`, also eine Zelle hinter der letzten bemalten."
    explanation: |
      Das Rechteck beginnt bei (−2, −1) und ist 40 × 12 Zellen groß, `end` ist also (38, 11). Mal 16 ergibt links −32, oben −16, rechts 608, unten 176. Gemessen mit Godot 4.7.2. Rechts ist 608 und nicht 37 × 16 = 592: Die letzte bemalte Zelle reicht bis zum Pixel 608, und genau dort soll das Bild enden.
    resources:
      - title: Godot Docs · Rect2i.end
        url: https://docs.godotengine.org/en/stable/classes/class_rect2i.html#class-rect2i-property-end
      - title: Godot Docs · TileMapLayer.get_used_rect
        url: https://docs.godotengine.org/en/stable/classes/class_tilemaplayer.html#class-tilemaplayer-method-get-used-rect

  - id: wie-viele-bildschirme
    type: output
    title: Wie viel Spielraum hat die Kamera?
    prompt: |
      Das Modell rechnet aus, um wie viele Pixel die Kamera in einem Abschnitt waagerecht und senkrecht wandern kann. Tiles 16 × 16, Spielbild 320 × 180, beides Platzhalter. Was gibt es aus?
    lang: python
    code: |
      ZELLE = 16

      def spielraum(spalten, zeilen, bild=(320, 180)):
          return spalten * ZELLE - bild[0], zeilen * ZELLE - bild[1]

      for groesse in [(20, 12), (40, 12), (40, 11)]:
          print(groesse, spielraum(*groesse))
    expected: |
      (20, 12) (0, 12)
      (40, 12) (320, 12)
      (40, 11) (320, -4)
    hints:
      - 12 Zeilen sind 192 Pixel, 11 Zeilen sind 176 Pixel.
    explanation: |
      20 Spalten sind genau ein Bildschirm breit, die Kamera steht waagerecht still. 40 Spalten geben 320 Pixel Spielraum, also einen zweiten Bildschirm. Senkrecht reichen 12 Zeilen für 12 Pixel Bewegung. Mit 11 Zeilen ist der Abschnitt 4 Pixel niedriger als das Bild; Godot 4.7.2 zentriert die Kamera dann, und oben und unten bleibt je ein Streifen von 2 Pixeln ohne Boden. Diese Rechnung machst du, bevor du malst, nicht nachdem der Rand im Test auffällt.
    resources:
      - title: Godot Docs · Camera2D.limit_bottom
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-limit-bottom

  - id: grenzen-ergaenzen
    type: gap
    title: Die Kameragrenzen aus dem Boden lesen
    prompt: |
      Ergänze die drei Lücken in `camera_limits.gd`.
    lang: gdscript
    code: |
      func _ready() -> void:
      	var camera := get_viewport().⟦get_camera_2d⟧()
      	var rect := ground.⟦get_used_rect⟧()
      	var tile := ground.tile_set.tile_size
      	camera.limit_left = rect.position.x * tile.x
      	camera.limit_right = rect.⟦end⟧.x * tile.x
    gaps:
      - label: aktive Kamera
        hint: Eine Methode des Viewports, die die aktive 2D-Kamera liefert.
      - label: bemalte Fläche
        hint: Eine Methode von `TileMapLayer`, die ein `Rect2i` um alle belegten Zellen liefert.
      - label: rechte untere Ecke
        hint: Die Eigenschaft von `Rect2i`, die `position + size` ist.
    explanation: |
      `get_camera_2d()` liefert die aktive Kamera, hier die an der Figur. `get_used_rect()` misst die bemalte Fläche in Zellen, `end` ist ihre Ecke rechts unten. Mit `size` statt `end` wäre die rechte Grenze nur dann richtig, wenn der Boden bei Spalte 0 beginnt.
    resources:
      - title: Godot Docs · Viewport.get_camera_2d
        url: https://docs.godotengine.org/en/stable/classes/class_viewport.html#class-viewport-method-get-camera-2d

  - id: notizen-ergaenzen
    type: gap
    title: Notizen per Taste
    prompt: |
      Ergänze `notes.gd` so, dass die Aktion `toggle_notes` die Notizen ein- und ausschaltet.
    lang: gdscript
    code: |
      func _ready() -> void:
      	visible = false


      func ⟦_unhandled_input⟧(event: InputEvent) -> void:
      	if event.⟦is_action_pressed⟧(&"toggle_notes"):
      		⟦visible = not visible⟧
    gaps:
      - label: Eingaben, die keine Oberfläche verbraucht hat
        hint: Eine virtuelle Methode von `Node`, beginnt mit Unterstrich.
      - label: Aktion gedrückt
        hint: Eine Methode von `InputEvent`, die prüft, ob dieses Ereignis eine Aktion drückt.
      - label: umschalten
        hint: Sichtbarkeit auf das Gegenteil setzen.
        accept: ["visible = !visible", "self.visible = not visible", "self.visible = not self.visible", "self.visible = !self.visible", "visible = not self.visible", "set_visible(not visible)"]
    explanation: |
      `_unhandled_input()` bekommt Tastendrücke, die keine Oberfläche verbraucht hat; für Eingaben im Spiel ist das laut Doku meist die passende Stelle. `is_action_pressed()` prüft das Ereignis gegen die Aktion aus der Eingabe-Zuordnung, nicht gegen eine Taste. `visible = not visible` schaltet um, und alle Kinder folgen. GDScript kennt für die Verneinung `not` und `!`; beide Schreibweisen und `set_visible()` sind mit Godot 4.7.2 nachgeprüft.
    resources:
      - title: Godot Docs · InputEvent.is_action_pressed
        url: https://docs.godotengine.org/en/stable/classes/class_inputevent.html#class-inputevent-method-is-action-pressed

  - id: rechter-rand
    type: bug
    title: Zwei Tiles Leere am rechten Rand
    prompt: |
      Der Boden ist von Zelle (−2, −1) bis (37, 10) bemalt. Läufst du ganz nach rechts, zeigt die Kamera am rechten Bildrand einen Streifen von 32 Pixeln ohne Boden. Links, oben und unten stimmt alles. Finde die Zeile und korrigiere sie.
    lang: gdscript
    code: |
      func _ready() -> void:
      	var camera := get_viewport().get_camera_2d()
      	var rect := ground.get_used_rect()
      	var tile := ground.tile_set.tile_size
      	camera.limit_left = rect.position.x * tile.x
      	camera.limit_top = rect.position.y * tile.y
      	camera.limit_right = rect.size.x * tile.x
      	camera.limit_bottom = rect.end.y * tile.y
    lines: [7]
    fix:
      - line: 7
        answers:
          - camera.limit_right = rect.end.x * tile.x
          - camera.limit_right = tile.x * rect.end.x
          - camera.limit_right = rect.end.x * ground.tile_set.tile_size.x
          - camera.limit_right = (rect.position + rect.size).x * tile.x
          - camera.limit_right = (rect.position.x + rect.size.x) * tile.x
    explanation: |
      `rect.size.x` ist die Breite, 40 Zellen, also 640 Pixel. Der Boden endet aber bei Zelle 38, also bei 608 Pixeln, weil er bei −2 beginnt. Die Kamera darf 32 Pixel zu weit. Mit Godot 4.7.2 nachgestellt: Mit `size` zeigt das Bild ganz rechts x = 320 bis 640, mit `end` x = 288 bis 608. Der Fehler fällt nur auf, wenn der Boden nicht bei Spalte 0 beginnt, und genau deshalb bleibt er oft lange unbemerkt.
    resources:
      - title: Godot Docs · Rect2i.end
        url: https://docs.godotengine.org/en/stable/classes/class_rect2i.html#class-rect2i-property-end

  - id: ebenenplan
    type: bug
    title: Tester laufen um die Markierung herum
    prompt: |
      Im ersten Test laufen zwei von drei Testern auf die gelbe Markierung vor dem Tor zu, bleiben an ihr stehen und gehen außen herum. Die Markierung soll den Weg zeigen, nicht versperren. Finde die Zeile im Ebenenplan, die das verursacht.
    lang: text
    code: |
      Ground     Boden und Durchgänge, mittleres Grau, keine Kollision
      Walls      Wände, Hindernisse, Abgrund, dunkel, Kollision Ebene 1
      Cues       Hinweise, helles Gelb, Kollision Ebene 1
      Notes      Marker2D mit Label, im Spiel aus
      Dressing   kommt erst nach dem getesteten Blockout
    lines: [3]
    explanation: |
      Der Hinweis hat Kollision und ist damit eine Sperre. Die Tester laufen nicht um ihn herum, weil sie ihn falsch lesen, sondern weil sie nicht durchkommen. Der Test misst also das Hindernis, nicht den Hinweis. `Cues` gehört ohne Kollision in den Plan: *Collision Enabled* aus am Layer und keine Physik-Polygone an den Hinweis-Tiles.
    hints:
      - Welche Ebene soll den Weg zeigen, und welche soll ihn begrenzen?
    resources:
      - title: Godot Docs · TileMapLayer.collision_enabled
        url: https://docs.godotengine.org/en/stable/classes/class_tilemaplayer.html#class-tilemaplayer-property-collision-enabled

  - id: notizen-erklaeren
    type: explain
    title: Warum die Notizen im Spiel aus sind
    prompt: |
      Erkläre in drei bis fünf Sätzen, was `notes.gd` im Editor und im laufenden Spiel bewirkt und warum Tester die Notizen nicht sehen sollen.
    lang: gdscript
    code: |
      extends Node2D

      func _ready() -> void:
      	visible = false


      func _unhandled_input(event: InputEvent) -> void:
      	if event.is_action_pressed(&"toggle_notes"):
      		visible = not visible
      		print("Notizen sichtbar: ", visible)
    points:
      - "`_ready()` läuft nur im Spiel. Im Editor bleiben die Notizen sichtbar, beim Start schaltet das Skript sie aus."
      - "`Marker2D` und `Label` unter `Notes` folgen der Sichtbarkeit ihres Elternknotens, ein Schalter reicht für alle."
      - Die Aktion `toggle_notes` schaltet die Notizen im laufenden Spiel ein und aus, etwa für deinen eigenen Durchlauf.
      - Sähe ein Tester die Notizen, würde er deine Absicht lesen statt den Raum, und der Test misst die Erklärung statt des Layouts.
    explanation: |
      Das Skript sorgt dafür, dass Notizen dort sichtbar sind, wo du baust, und dort fehlen, wo andere testen. Im Editor läuft `_ready()` nicht, also siehst du Wegpunkte und Fragen beim Malen. Beim Start setzt das Skript `visible` auf `false`, und weil Kinder der Sichtbarkeit ihrer Eltern folgen, verschwinden alle Marker und Labels. Mit der Aktion holst du sie für deinen eigenen Durchlauf zurück. Für Tester bleiben sie aus, denn eine sichtbare Notiz wie „Tor zuerst“ ist eine Anweisung, und dann weißt du nach dem Test nicht, ob der Raum oder die Notiz gewirkt hat. Das Skript ist technisches Gerüst; was in den Notizen steht, entscheidest du.
    resources:
      - title: Godot Docs · CanvasItem.visible
        url: https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#class-canvasitem-property-visible

  - id: vokabel-tileset
    type: practice
    title: Deine Blockout-Vokabel als TileSet
    prompt: |
      Leg deine Blockout-Vokabel als Platzhalter-TileSet an: eine Tile pro Kategorie, in deiner Tilegröße oder 16 × 16. Schreib zu jeder Tile ihre Kategorie, ihre Ebene und ob sie kollidiert. Welche Tonwerte und Formmarken es sind, entscheidest du; die Tabelle der Lektion ist nur ein Lehrbeispiel.
    lang: prose
    starter: |
      Kategorie       Tonwert / Form   Ebene   Kollision
      begehbar
      blockiert hoch
      blockiert tief
      gefährlich
      benutzbar
      Hinweis
    checklist:
      - Jede Kategorie deiner Blockout-Vokabel hat genau eine Tile, und jede Tile gehört zu genau einer Kategorie.
      - Jede Tile ist ein flacher Tonwert, höchstens mit einer einfachen Formmarke wie Kreis oder Gitter.
      - Zu jeder Tile stehen Kategorie, Ebene (`Ground`, `Walls` oder `Cues`) und Kollision ja oder nein.
      - Begehbar und blockiert unterscheiden sich im Tonwert, gefährlich und blockiert auch in der Form.
      - Du hast alle Tiles nebeneinander als Screenshot in Graustufen und mit zusammengekniffenen Augen angesehen, und die Hinweis-Tile fällt dabei zuerst auf.
      - Das TileSet ist als `.tres` gespeichert, und nur Tiles für `Walls` haben ein Kollisionspolygon.
      - Die Vokabel stimmt mit deiner Notiz aus „Umgebung als Information“ überein, oder du hast notiert, was du geändert hast und warum.
    hints:
      - Wenn dein Spiel eine Kategorie im Abschnitt nicht braucht, bekommt sie trotzdem eine Tile; dann ist die Vokabel für den nächsten Abschnitt fertig.
    explanation: |
      Die Vokabel ist ein Vertrag mit dir selbst: Eine Tile heißt im ganzen Abschnitt dasselbe. Dann kannst du nach einem Test sagen, ob ein Tester eine Wand als Wand gelesen hat, und musst nicht raten, ob ihn ein Detail abgelenkt hat. Der Graustufen- und Unschärfetest zeigt dir vor jedem Playtest, ob der Hinweis überhaupt die Chance hat, bemerkt zu werden. Wie du das TileSet technisch anlegst, steht in [2D-Level aus Tiles](/godot/level-tilemap).
    resources:
      - title: The Level Design Book · Blockout, „Sketch layout“
        url: https://book.leveldesignbook.com/process/blockout
      - title: Godot Docs · Using TileSets · Adding collision
        url: https://docs.godotengine.org/en/stable/tutorials/2d/using_tilesets.html#adding-collision-navigation-and-occlusion-to-the-tileset

  - id: massstabsraum
    type: practice
    title: Ein Maßstabsraum für deine Figur
    prompt: |
      Bau eine eigene Szene als Maßstabsraum, mit deinem Blockout-TileSet und deiner Figur. Lauf alles ab und notiere, was du misst. Welche Breiten du später verwendest, entscheidest du nach diesem Durchlauf.
    lang: prose
    starter: |
      Gang 1 Tile:
      Gang 2 Tiles:
      Gang 3 Tiles:
      Tür 1 / 2 Tiles:
      Strecke in 1 s:
      Ausweichweite:
      Ein Bildschirm (20 × 11):
    checklist:
      - Die Szene ist getrennt vom Abschnitt und nutzt dasselbe TileSet und dieselbe Figur.
      - Es gibt Gänge mit 1, 2 und 3 Tiles Breite, je einmal gerade und einmal mit Ecke.
      - Es gibt Türöffnungen mit 1 und 2 Tiles Breite.
      - Ein Rahmen aus 20 × 11 Tiles zeigt die Größe eines Bildschirms.
      - Markierungen zeigen die Strecke der Figur in einer Sekunde und die Ausweichweite, mit deinen Werten oder den Platzhaltern.
      - Du bist jeden Gang mit Tastatur und, falls vorhanden, mit Stick abgelaufen, auch schräg in die Ecken.
      - Zu jedem Gang steht, ob und wo die Figur hängen bleibt, in Tiles oder Pixeln, nicht als Urteil.
    hints:
      - Leg die Gänge nebeneinander, dann vergleichst du sie in einem Bildausschnitt.
    explanation: |
      Der Maßstabsraum macht Zahlen begehbar. Statt „2 Tiles klingt eng“ läufst du durch 2 Tiles und siehst, wie die Figur an der Ecke reagiert. Die Notizen sind deine Grundlage für [Maßstab, Dichte und Freiflächen](/level-design/massstab-dichte) und für jede spätere Änderung an Tempo oder Fußform: Nach so einer Änderung läufst du den Raum erneut ab.
    resources:
      - title: The Level Design Book · Build a metrics zoo test map
        url: https://book.leveldesignbook.com/process/blockout/metrics#build-a-metrics-zoo-test-map

  - id: eigener-blockout
    type: practice
    title: Deinen Abschnitt blocken
    prompt: |
      Bau den Abschnitt aus deiner Skizze als Blockout: Ebenen, Hinweise, Notizen, Kameragrenzen. Lauf ihn selbst ab, ändere, was nicht passt, und sichere den Stand. Jede Wand, jede Breite und jeder Hinweis ist deine Entscheidung; ein Agent darf dir nur die Skripte schreiben.
    lang: prose
    checklist:
      - Der Abschnitt folgt deiner Skizze aus „Absicht notieren, Layout skizzieren“; Abweichungen stehen als Notiz in `Notes` oder in der Absichtsnotiz.
      - "`Ground`, `Walls` und `Cues` sind getrennte `TileMapLayer`, und nur `Walls` kollidiert."
      - Jeder Hinweis aus deiner Absichtsnotiz liegt auf `Cues`.
      - Der erwartete Weg steht als nummerierte `Marker2D` in `Notes`; im Spiel ist `Notes` aus und per Taste einschaltbar.
      - Die Kamera bleibt in der bemalten Fläche, und du hast die Ausgabe von `camera_limits.gd` notiert.
      - Du bist den erwarteten Weg und jede Abzweigung im Spiel gelaufen, nicht nur im Editor angesehen.
      - Der Stand ist committet und mit einem Tag markiert.
      - Im Abschnitt liegt keine fertige Grafik, nur Platzhalter-Tiles und einfache Formen.
    hints:
      - Bleib bei 2 bis 4 Bildschirmen. Was nicht hineinpasst, kommt in einen zweiten Abschnitt.
    explanation: |
      Das ist der Stand, mit dem du in [Playtest am PC](/level-design/playtest-godot) Wege aufzeichnest. Je weniger du in diesen Stand investiert hast, desto leichter fällt es dir, ihn nach dem Test umzubauen. Das Level Design Book sagt es so: „Want to delete an entire room? Do it.“
    resources:
      - title: The Level Design Book · Blockout, „Diverge and iterate“
        url: https://book.leveldesignbook.com/process/blockout
      - title: Godot Docs · Using TileMaps
        url: https://docs.godotengine.org/en/stable/tutorials/2d/using_tilemaps.html
