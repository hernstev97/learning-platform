id: ueberarbeiten
title: "Überarbeiten: von der Beobachtung zur Änderung"
level: 3
minutes: 100
summary: Aus Playtest-Notizen eine Änderung ableiten, die eine bestimmte Ursache trifft – bestimmen, wo die Kette aus Bemerken, Lesen, Befolgen und Folge reißt, die Absicht prüfen, den kleinsten passenden Hebel wählen, eine Änderung pro Runde mit frischen Testern prüfen und dabei nicht übermarkieren.
place: unterwegs
goals:
  - Du ordnest eine beobachtete Stelle einer von vier Arten zu – nicht bemerkt, falsch gelesen, nicht befolgt, unbeabsichtigte Folge – und nennst den Beleg.
  - Du entscheidest begründet, ob du das Level änderst oder bewusst die Absicht.
  - Du wählst zu jeder Art einen passenden Hebel und fängst mit dem kleinsten an.
  - Du planst eine Runde mit genau einer Änderung, einer zählbaren Erwartung und neuen Testern.
  - Du erkennst, wann stärkere Markierungen das Finden kosten, und hältst eine Rangfolge der Hinweise.
resources:
  - title: Mike Ambinder, „Valve's Approach to Playtesting“ (GDC 2009, Folien)
    url: https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf
  - title: The Level Design Book · Wayfinding
    url: https://book.leveldesignbook.com/process/blockout/wayfinding
  - title: Jakob Nielsen, „Why You Only Need to Test with 5 Users“ (NN/g, 2000)
    url: https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/
  - title: GamesRadar+, Debatte um gelbe Markierungen (2023)
    url: https://www.gamesradar.com/debate-over-resident-evil-4-remakes-yellow-paint-resurfaces-as-devs-explain-just-how-much-players-really-need-realism-is-less-immersive/
lesson: |
  Lehrbeispiel: Du hast einen Gang mit einer Abzweigung gebaut. Im Seitengang liegt ein Fundstück, und deine Absicht lautet: „Der Spieler soll den Seitengang bemerken, aber zuerst geradeaus gehen.“ Vier Tester haben gespielt. Drei sind am Seitengang vorbeigelaufen und nicht zurückgekommen. Der erste Reflex ist ein Pfeil an der Abzweigung. Er würde vermutlich helfen, und du wüsstest danach trotzdem nicht, warum drei von vier Testern den Gang übersehen haben.

  Überarbeiten heißt, aus Beobachtungen eine Änderung abzuleiten, die eine bestimmte Ursache trifft. Dieses Modul zeigt, wie du eine Stelle diagnostizierst, den passenden Hebel wählst, eine Änderung pro Runde testest und dabei deine Absicht im Blick behältst. Du arbeitest unterwegs mit deinen Notizen. Die Änderung selbst baust du am PC in den Blockout ein ([Blockout in Godot](/level-design/blockout)). Welche Änderung du wählst, ist eine Designentscheidung und bleibt deine; eine KI kann dir höchstens beim Auszählen und Sortieren der Notizen helfen.

  ## Wo die Kette reißt: vier Arten, einen Hinweis zu verfehlen

  Ein Hinweis wirkt nur, wenn vier Dinge nacheinander klappen. Er muss im Bild sein und bemerkt werden. Er muss richtig gelesen werden. Der Spieler muss ihm folgen wollen. Und das, was dann passiert, muss das sein, was du wolltest. An jeder Stelle kann die Kette reißen, und jede Stelle braucht eine andere Reparatur.

  | Art | Was passiert | Woran du es erkennst |
  | --- | --- | --- |
  | Nicht bemerkt | Der Hinweis war nicht im Bild oder ging im Rest unter. | Kein Halt, kein Richtungswechsel in seiner Nähe, beim lauten Denken kein Wort dazu. |
  | Falsch gelesen | Bemerkt, aber anders verstanden: Der Durchgang sah aus wie Wand, das Fundstück wie Dekoration. | Der Spieler geht hin, versucht etwas anderes oder dreht ab; er sagt etwa „ach, da geht's nicht weiter“. |
  | Nicht befolgt | Verstanden, aber etwas anderes war wichtiger oder der Weg zu teuer. | Er schaut hin, sagt „später“ oder folgt einem stärkeren Ziel. |
  | Unbeabsichtigte Folge | Befolgt, aber anders als gedacht: Abkürzung, festgefahren, Reihenfolge umgangen. | Der Weg im Protokoll weicht von deinem erwarteten Weg ab, obwohl der Hinweis gewirkt hat. |

  Die Spalte rechts ist der Grund, warum du in [Playtests beobachten](/level-design/playtest-methode) Ort, Zeit, Blickrichtung und Gesagtes getrennt notierst. Aus „hat den Gang übersehen“ kannst du keine Art ablesen. Aus „läuft bei 0:14 ohne Halt an der Abzweigung vorbei, die Kamera zeigt den Seitengang 1,5 Sekunden lang am linken Bildrand“ schon: Der Gang war im Bild, aber vermutlich nicht auffällig genug.

  > [!MERKE] Erst die Art, dann die Änderung
  > Bestimme für jede Stelle zuerst, an welcher Stelle der Kette sie reißt. Eine Änderung, die eine andere Stelle repariert, hilft zufällig oder gar nicht.

  ## Die Absicht prüfen, bevor du das Level änderst

  Manchmal ist nicht der Raum falsch, sondern die Absicht. Zwei Tester gehen zuerst in den Seitengang statt geradeaus, finden das Fundstück und gehen danach zufrieden weiter. Das widerspricht deiner Notiz, aber vielleicht ist der Ablauf besser als dein Plan. Dann änderst du die Absicht bewusst, schreibst die neue Fassung in die Notiz und testest gegen sie weiter. Was du nicht tun solltest: die Absicht still an das anpassen, was gerade passiert ist. Dann kann dein nächster Test nichts mehr widerlegen.

  Die Gegenfrage gehört dazu: Ist das Verhalten ein Problem für dein Spiel oder nur eine Abweichung von deinem Plan? Ein Tester, der eine Stelle anders löst, als du gedacht hast, hat nicht zwingend etwas falsch gemacht. Ein Tester, der festhängt, umkehrt und aufgibt, schon eher. Das entscheidest du, nicht der Tester.

  ## Hebel: was du an einer Stelle ändern kannst

  Zu jeder Art gehören andere Hebel. Die Tabelle verweist auf die Module, in denen sie erklärt sind.

  | Art | Mögliche Hebel |
  | --- | --- |
  | Nicht bemerkt | Hinweis früher oder länger ins Bild bringen, Tonwertkontrast erhöhen, konkurrierende Reize daneben entfernen, Rahmung durch eine Öffnung ([Blickführung](/level-design/blickfuehrung)), eine Sichtlinie öffnen ([Orientierung](/level-design/orientierung)) |
  | Falsch gelesen | Form und Farbe an deine visuelle Sprache angleichen, Durchgänge breiter und klarer abgrenzen, Zustand sichtbar machen ([Umgebung als Information](/level-design/umgebung-informiert)) |
  | Nicht befolgt | Kosten senken (kürzerer Weg, kein Risiko), Belohnung vorher zeigen, Konkurrenz später auftauchen lassen, Reihenfolge ändern ([Einführen und variieren](/level-design/einfuehren-variieren)) |
  | Unbeabsichtigte Folge | Kante oder Kollision schließen, Abkürzung bewusst erlauben oder sperren, Weg breiter oder enger ([Maßstab und Dichte](/level-design/massstab-dichte)) |

  Fang mit dem kleinsten Hebel an, der die Ursache trifft. Ein stärkerer Kontrast am Seitengang ist kleiner als ein Pfeil, und ein Pfeil ist kleiner als ein neuer Grundriss. Das Level Design Book ordnet Hilfen zur Orientierung nach geschätzter Sicherheit, von subtil (1–20 %) bis direkt (95–98 %), und rät: „start at the top, and gradually incorporate less subtle methods in response to playtesting“ ([Wayfinding](https://book.leveldesignbook.com/process/blockout/wayfinding#wayfinding-aids)). Der Pfeil bleibt erlaubt. Er kostet nur etwas: Was überall markiert ist, muss niemand mehr finden.

  ## Eine Änderung pro Runde, mit frischen Testern

  Combat Design stimmt Werte als Experiment ab: Hypothese vorher, genau eine Größe ändern, vergleichen ([Tuning als Experiment](/combat/tuning)). Für Räume gilt dasselbe. Änderst du am Seitengang Kontrast, Breite und Lage des Fundstücks zugleich, und jetzt finden ihn alle, weißt du nicht, welche Änderung es war. Beim nächsten Abschnitt fängst du wieder bei null an.

  Schreib die Hypothese vor dem Umbau auf, in dieser Form:

  ```text
  Stelle:    Abzweigung, WP 3
  Gesehen:   3/4 ohne Halt vorbei
  Art:       nicht bemerkt
  Änderung:  Boden im Seitengang
             einen Tonwert heller
  Erwartung: mind. 3/4 halten
             an WP 3
  ```

  Für den nächsten Test brauchst du neue Tester. Wer den Abschnitt schon gespielt hat, weiß, dass es den Seitengang gibt. Er kann dir sagen, ob die Änderung stört, aber nicht, ob man den Gang jetzt bemerkt. Das Level Design Book nennt einen Test mit möglichst wenig Anleitung einen „blind“ Playtest: „pretend they are playing the level by themselves, alone, and see what they do“ ([Playtesting](https://book.leveldesignbook.com/process/blockout/playtesting#playtest-formats)). Valve fasst diese Haltung in zwei Zeilen: „Game designs are hypotheses“, „Playtests are experiments“ ([Ambinder, GDC 2009](https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf)). Viele kleine Runden zeigen dir dabei mehr als eine große. Jakob Nielsen hat das für Usability-Tests so formuliert: „The best results come from testing no more than 5 users and running as many small tests as you can afford.“ ([NN/g, 2000](https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/)). Sein Grund passt auch zu Leveln: Nach jeder kleinen Runde änderst du etwas, und die nächste Runde prüft die Änderung.

  > [!TIP] Eine Runde, ein kurzer Block
  > Passt die Hypothese nicht in diese sieben kurzen Zeilen, änderst du zu viel auf einmal. Teil sie auf mehrere Runden auf.

  ## Übermarkieren: wenn jeder Hinweis lauter wird

  Jede Runde verführt dazu, die Stelle mit den meisten Problemen deutlicher zu machen. Nach fünf Runden leuchtet jeder Durchgang, jedes Fundstück blinkt, und der Raum hat keine Rangfolge mehr. Die Debatte um gelbe Farbe an kletterbaren Kanten, die 2023 um das Remake von Resident Evil 4 aufkam, dreht sich um genau diese Abwägung. Der Entwickler David Szymanski erklärte dort, warum detaillierte Grafik das Problem verschärft: „As environments get more detailed and realistic, materials get more complex and noisy, etc, it becomes increasingly difficult to direct players in unobtrusive ways“ ([GamesRadar+](https://www.gamesradar.com/debate-over-resident-evil-4-remakes-yellow-paint-resurfaces-as-devs-explain-just-how-much-players-really-need-realism-is-less-immersive/)). Starke Markierungen machen sicher, dass niemand festhängt, und nehmen dem Spieler das Finden. Für dich folgt daraus noch etwas: Ein Hinweis, der im grauen Blockout trägt, kann in der fertigen Grafik untergehen. Deshalb testest du nach der Ausgestaltung noch einmal ([Ausgestaltung](/level-design/ausgestaltung)).

  Zwei Fragen helfen. Muss der Spieler diesen Hinweis finden, um weiterzukommen, oder ist er eine Belohnung für Aufmerksamkeit? Pflichtwege dürfen deutlich sein, Nebenwege leiser. Und: Welchen Hinweis machst du leiser, wenn du diesen lauter machst? Eine Rangfolge bleibt nur erhalten, wenn nicht alles gleichzeitig steigt.

  ## Das Iterationsprotokoll

  Halte jede Runde in einem kurzen Block fest. Das Protokoll ist für dich, aber es ist auch das, was du später im Vergleich zwischen Absicht und Verhalten zeigst ([Werkstatt](/level-design/werkstatt-abschnitt)).

  ```text
  Runde 1 · 4 Tester
  Stelle:    WP 3
  Gesehen:   3/4 ohne Halt vorbei
  Art:       nicht bemerkt
  Änderung:  Boden heller
  Erwartung: mind. 3/4 halten
  Ergebnis:  Runde 2: 3/4 halten

  Runde 2 · 4 neue Tester
  Stelle:    WP 3
  Gesehen:   3/4 halten, 1/4 vorbei
  Art:       Absicht erfüllt
  Änderung:  keine
  Erwartung: –
  Ergebnis:  –
  ```

  Die Zeile „Ergebnis“ füllst du erst nach der nächsten Runde aus. Bleibt sie leer, weil kein Test mehr kam, steht da „nicht geprüft“. Auch das ist eine ehrliche Angabe.

  > [!PRAXIS] Zusehen, dann ändern
  > Joseph Hunter, Entwickler von Sucker for Love, schrieb in derselben Debatte: „I promise the yellow paint was added in after a dev was forced to watch in silence as a playtester got stuck for 20 minutes looking for a way up“ ([GamesRadar+](https://www.gamesradar.com/debate-over-resident-evil-4-remakes-yellow-paint-resurfaces-as-devs-explain-just-how-much-players-really-need-realism-is-less-immersive/)). Valve beschreibt in seinem Post-Mortem zu Portal dieselbe Reihenfolge: „Watch your playtests“ und „Adjust gameplay to what players look like they need.“ ([Swift und Wolpaw, GDC 2008](https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf)). Die Änderung folgt dem, was Spieler tun, nicht dem, was der Designer vorher befürchtet hat.

  > [!INTERVIEW] „Tester verstehen deinen Raum nicht. Was tust du?“
  > Ich schaue zuerst, an welcher Stelle es reißt: nicht bemerkt, falsch gelesen, nicht befolgt oder eine Folge, die ich nicht wollte. Dazu nehme ich Ort, Zeit und Gesagtes aus dem Protokoll, nicht den Eindruck. Dann prüfe ich, ob meine Absicht noch stimmt, ändere eine Sache mit einer schriftlichen Erwartung und teste mit Leuten, die den Raum noch nicht kennen.

  ## Häufige Fehler

  - **Mehrere Änderungen auf einmal.** Du weißt danach nicht, was gewirkt hat. Eine Änderung pro Runde, die anderen auf die Liste.
  - **Den Vorschlag des Testers bauen.** „Mach den Gang rot“ ist eine Beobachtung, dass er den Gang nicht als Weg gelesen hat. Ob Rot die Antwort ist, entscheidest du ([Testlesen und Playtest](/narrative/testlesen-playtest)).
  - **Mit denselben Testern prüfen, ob etwas auffällt.** Wer es schon kennt, bemerkt es immer. Für Fragen des Bemerkens brauchst du frische Tester.
  - **Ein Ausreißer, ein Umbau.** Ein Tester von fünf hängt fest. Notier es, prüf es in der nächsten Runde, aber bau nicht den Grundriss um.
  - **Ein Layoutproblem mit Grafik lösen.** Liest niemand den Durchgang als Weg, weil er nur ein Tile breit ist, hilft keine schönere Tür. Erst das Layout, dann die Ausgestaltung ([Ausgestaltung](/level-design/ausgestaltung)).
  - **Die Absicht still ändern.** Schreib jede neue Fassung mit Datum in die Notiz.

  ## Zusammenfassung

  - Ein Hinweis kann auf vier Arten verfehlen: nicht bemerkt, falsch gelesen, nicht befolgt, unbeabsichtigte Folge.
  - Die Art liest du aus Ort, Zeit, Blickrichtung und Gesagtem, nicht aus einem Eindruck.
  - Prüf vor jeder Änderung, ob die Absicht noch stimmt. Änderst du sie, dann bewusst und schriftlich.
  - Jede Art hat eigene Hebel. Fang mit dem kleinsten an, der die Ursache trifft.
  - Eine Änderung pro Runde, mit schriftlicher Erwartung und neuen Testern.
  - Starke Markierungen kosten das Finden. Wenn du einen Hinweis lauter machst, frag, welcher leiser wird.
  - Das Iterationsprotokoll hält Beobachtung, Art, Änderung und Ergebnis jeder Runde fest.
exercises:
  - id: art-bestimmen
    type: choice
    title: Nur Deko?
    prompt: |
      Lehrbeispiel, Notiz aus einem Playtest: „0:31 WP 4. Geht auf den schmalen Durchgang zu, bleibt davor stehen, sagt: ‚Ah, da ist nur Deko.‘ Geht weiter nach rechts.“ Der Durchgang ist begehbar und führt zum Fundstück. An welcher Stelle reißt die Kette?
    options:
      - text: Falsch gelesen
        correct: true
        why: Der Tester hat den Durchgang bemerkt und ist hingegangen, hat ihn aber als Dekoration gedeutet. Das Bemerken hat geklappt, das Lesen nicht.
      - text: Nicht bemerkt
        correct: false
        why: Er ist auf den Durchgang zugegangen und hat darüber gesprochen. Bemerkt hat er ihn also.
      - text: Nicht befolgt
        correct: false
        why: Nicht befolgt hieße, er hätte den Weg erkannt und sich trotzdem für etwas anderes entschieden. Er hielt ihn aber gar nicht für einen Weg.
      - text: Unbeabsichtigte Folge
        correct: false
        why: Eine unbeabsichtigte Folge setzt voraus, dass der Hinweis gewirkt hat und etwas anderes passiert ist als geplant. Hier hat der Hinweis nicht gewirkt.
    explanation: |
      Der Satz „da ist nur Deko“ ist der wichtigste Beleg im Protokoll. Er zeigt, dass der Durchgang im Bild war und angesehen wurde, aber nicht wie ein Weg aussah. Die passenden Hebel betreffen deshalb Form und visuelle Sprache, etwa eine klarere Öffnung oder denselben Boden wie im Hauptweg, nicht mehr Licht oder eine größere Belohnung.
    hints:
      - Hat er den Durchgang gesehen? Hat er ihn als Weg verstanden?
    resources:
      - title: Don Norman, „Signifiers, not affordances“ (2008)
        url: https://jnd.org/signifiers-not-affordances/

  - id: passender-hebel
    type: choice
    title: Am Bildrand vorbei
    prompt: |
      Lehrbeispiel: Der Seitengang war beim Vorbeilaufen 1,5 Sekunden am linken Bildrand zu sehen. Drei von vier Testern liefen ohne Halt vorbei und sagten nichts dazu. Du hast die Stelle als „nicht bemerkt“ eingeordnet. Welche Änderungen setzen an dieser Ursache an?
    options:
      - text: Den Hauptweg vor der Abzweigung leicht auf den Seitengang zu biegen, damit er länger und näher an der Bildmitte im Bild ist.
        correct: true
        why: Mehr Zeit im Bild und eine bessere Lage im Bildausschnitt erhöhen die Chance, dass der Gang bemerkt wird. Das trifft die Ursache.
      - text: Den Boden im Seitengang einen Tonwert heller machen als den Hauptweg.
        correct: true
        why: Kontrast zieht den Blick. Das ist ein kleiner Hebel an der richtigen Stelle der Kette.
      - text: Das Fundstück im Seitengang wertvoller machen.
        correct: false
        why: Eine größere Belohnung hilft, wenn Spieler den Gang sehen und sich trotzdem dagegen entscheiden. Wer ihn nicht bemerkt, weiß nichts von der Belohnung.
      - text: Den Seitengang breiter machen, ohne an Lage oder Kontrast etwas zu ändern.
        correct: false
        why: Breite hilft beim Lesen als Weg. Ob der Gang bemerkt wird, hängt hier vor allem an Lage und Kontrast; die Breite allein ändert daran wenig.
    explanation: |
      Für „nicht bemerkt“ sind Lage im Bild, Dauer im Bild und Kontrast die passenden Hebel. Eine wertvollere Belohnung oder ein breiterer Gang reparieren andere Stellen der Kette. Ändere in der nächsten Runde nur eines der beiden richtigen Mittel, sonst weißt du nicht, welches gewirkt hat.
    hints:
      - Zwei Antworten sind richtig. Frag bei jeder, ob sie dem Spieler hilft, den Gang überhaupt zu sehen.
    resources:
      - title: The Level Design Book · Wayfinding
        url: https://book.leveldesignbook.com/process/blockout/wayfinding

  - id: eine-runde
    type: order
    title: Eine Überarbeitungsrunde
    prompt: |
      Bring die Schritte einer Überarbeitungsrunde in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Lies das Protokoll und such die Stellen, an denen Verhalten und Absicht auseinandergehen.
      Bestimm für jede Stelle, an welcher Stelle der Kette sie reißt, und notier den Beleg.
      Prüf, ob die Absicht noch stimmt oder ob du sie bewusst ändern willst.
      Wähl für eine Stelle den kleinsten Hebel, der die Ursache trifft.
      Schreib Änderung und Erwartung auf, bevor du im Blockout etwas umbaust.
      Bau die Änderung ein und teste mit Leuten, die den Abschnitt noch nicht kennen.
    explanation: |
      Die Diagnose kommt vor der Absicht, weil du erst wissen musst, was passiert ist, bevor du entscheidest, ob es ein Problem ist. Die Erwartung steht vor dem Umbau, damit das Ergebnis sie widerlegen kann. Neue Tester stehen am Ende, weil nur sie zeigen, ob jemand die Stelle ohne Vorwissen jetzt anders spielt.
    hints:
      - Was muss feststehen, bevor du einen Hebel wählen kannst?
    resources:
      - title: Mike Ambinder, „Valve's Approach to Playtesting“ (GDC 2009, Folien)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf

  - id: notizen-zaehlen
    type: output
    title: Was kam am häufigsten vor?
    prompt: |
      Du hast die Stellen aus einem Playtest mit drei Testern eingeordnet. Was gibt das Modell aus?
    lang: python
    code: |
      from collections import Counter

      notizen = [
          "nicht bemerkt",
          "falsch gelesen",
          "nicht bemerkt",
          "Absicht erfüllt",
          "nicht bemerkt",
          "falsch gelesen",
      ]
      zaehlung = Counter(notizen)
      top = zaehlung.most_common(2)
      for art, n in top:
          print(art, n)
    expected: |
      nicht bemerkt 3
      falsch gelesen 2
    hints:
      - "`most_common(2)` liefert die zwei häufigsten Einträge, der häufigste zuerst."
    explanation: |
      „Nicht bemerkt“ kommt dreimal vor, „falsch gelesen“ zweimal, „Absicht erfüllt“ einmal. Die Zählung sagt dir, womit du anfängst: mit der Art, die am häufigsten auftritt und am meisten stört. Sie sagt dir nicht, ob alle drei „nicht bemerkt“ an derselben Stelle lagen. Ordne deshalb immer nach Stelle und Art, nicht nur nach Art.
    resources:
      - title: Python · collections.Counter.most_common
        url: https://docs.python.org/3/library/collections.html#collections.Counter.most_common

  - id: vorher-nachher
    type: output
    title: Vorher und nachher
    prompt: |
      Runde 1 mit vier Testern, Runde 2 nach einer Änderung mit fünf neuen. `True` heißt: hat an der Abzweigung angehalten. Was gibt das Modell aus?
    lang: python
    code: |
      r1 = [False, False, True, False]
      r2 = [True, True, False,
            True, True]

      def bruch(runde):
          n = sum(runde)
          return f"{n}/{len(runde)}"

      print(bruch(r1), bruch(r2))
    expected: |
      1/4 4/5
    hints:
      - "`sum` zählt `True` als 1 und `False` als 0."
    explanation: |
      In Runde 1 hielt einer von vier an, in Runde 2 vier von fünf. Das spricht für die Änderung, beweist bei neun Menschen aber keine Regel. Schreib deshalb beide Brüche ins Protokoll statt Prozentzahlen: „80 %“ klingt nach mehr Gewissheit, als fünf Tester liefern. Ob die Erwartung „mindestens 3 von 4“ erfüllt ist, entscheidest du mit der Zahl und mit dem, was die Tester an der Stelle getan haben.
    resources:
      - title: Jakob Nielsen, „Why You Only Need to Test with 5 Users“ (NN/g, 2000)
        url: https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/

  - id: begriffe-ueberarbeiten
    type: gap
    title: Vier Wörter für eine Runde
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Bevor du etwas änderst, stellst du eine ⟦Diagnose⟧: An welcher Stelle reißt die Kette? Dann schreibst du eine ⟦Erwartung⟧ auf, was nach der Änderung anders sein soll. Du änderst pro Runde genau ⟦eine⟧ Sache. Ob man die Stelle jetzt bemerkt, zeigen nur ⟦frische⟧ Tester, die den Abschnitt noch nicht kennen.
    gaps:
      - label: vor der Änderung
        hint: Wie beim Arzt, bevor er behandelt.
        accept: ["Ursachenanalyse", "Analyse"]
      - label: schriftlich vor dem Umbau
        hint: Englisch oft „hypothesis“.
        accept: ["Hypothese", "Vorhersage"]
      - label: wie viele
        hint: Mehr als das, und du weißt nicht, was gewirkt hat.
        accept: ["1", "einzige"]
      - label: welche Tester
        hint: Das Gegenteil von „wiederkehrend“.
        accept: ["neue", "unvoreingenommene", "unbeteiligte"]
    explanation: |
      Diagnose, Erwartung, eine Änderung und neue Tester sind die vier Bestandteile jeder Runde. Ohne Diagnose triffst du die Ursache zufällig, ohne Erwartung kann das Ergebnis nichts widerlegen, mit mehreren Änderungen weißt du nicht, was gewirkt hat, und mit bekannten Testern misst du Erinnerung statt Bemerken.

  - id: runde-zu-voll
    type: bug
    title: Diese Runde beweist nichts
    prompt: |
      Lehrbeispiel: der Plan für Runde 2 an einer Abzweigung. Zwei Zeilen machen das Ergebnis der Runde unbrauchbar. Finde beide.
    lang: prose
    code: |
      Stelle: Abzweigung, WP 3
      Gesehen: 3 von 4 laufen ohne Halt vorbei
      Art: nicht bemerkt
      Änderung: Boden heller, Gang zwei Tiles breiter und Fundstück näher an die Abzweigung
      Erwartung: mindestens 3 von 4 halten an WP 3
      Tester: dieselben vier wie in Runde 1
    lines: [4, 6]
    explanation: |
      Zeile 4 ändert drei Dinge zugleich. Halten danach alle an, weißt du nicht, ob es der Boden, die Breite oder das Fundstück war. Zeile 6 nimmt dieselben Tester. Die wissen schon, dass es den Seitengang gibt, und halten vermutlich an, auch wenn die Änderung nichts bewirkt. Die übrigen Zeilen sind in Ordnung: Stelle, Beobachtung, Art und eine prüfbare Erwartung.
    hints:
      - Eine Zeile betrifft, was geändert wird, die andere, wer testet.
    resources:
      - title: The Level Design Book · Playtesting
        url: https://book.leveldesignbook.com/process/blockout/playtesting#playtest-formats

  - id: falsche-art
    type: bug
    title: Die Art passt nicht zum Beleg
    prompt: |
      Lehrbeispiel: drei eingeordnete Stellen aus einem Protokoll. Bei einer passt die Art nicht zu dem, was beobachtet wurde. Finde sie.
    lang: prose
    code: |
      WP 2: läuft ohne Halt am Hebel vorbei, sagt nichts → nicht bemerkt
      WP 4: geht zur Tür, drückt dagegen, sagt „zu“, geht weiter → nicht bemerkt
      WP 6: sieht das Fundstück, sagt „hol ich später“, geht zum Ausgang → nicht befolgt
    lines: [2]
    explanation: |
      An WP 4 ist der Tester zur Tür gegangen und hat sie angefasst, bemerkt hat er sie also. Er hielt sie für verschlossen. Ist sie offen, hat er sie falsch gelesen; ist sie wirklich verschlossen und soll es sein, ist das Verhalten vielleicht sogar beabsichtigt. Die Art „nicht bemerkt“ würde dich zu Hebeln wie Kontrast oder Licht führen, die hier nichts helfen.
    hints:
      - Wo hat der Tester den Hinweis angefasst oder angesprochen?

  - id: protokoll-diagnose
    type: explain
    title: Zweimal um den Brunnen
    prompt: |
      Lehrbeispiel: Ausschnitt aus einem Protokoll. Absicht des Abschnitts: „Der Spieler soll vom Hof aus den Durchgang rechts unten nehmen.“ Erkläre in drei bis fünf Sätzen, an welcher Stelle die Kette vermutlich reißt, welche Zeilen das belegen und welche einzelne Änderung du für die nächste Runde vorschlagen würdest.
    lang: prose
    code: |
      0:05 betritt den Hof von unten
      0:08 läuft zum Brunnen in der Mitte
      0:10 umrundet den Brunnen einmal
      0:16 umrundet ihn ein zweites Mal
      0:22 sagt „Hier muss doch was sein“
      0:25 geht nach links oben hinaus
    points:
      - Das Verhalten weicht von der Absicht ab, der Tester nimmt den falschen Durchgang.
      - Der Brunnen zieht den Blick und wird für ein Ziel gehalten; das zeigen das Umrunden und der Satz bei 0:22.
      - Über den Durchgang rechts unten gibt es keinen Beleg, dass er bemerkt wurde. Die Kette reißt vermutlich beim Bemerken, weil der Brunnen die Aufmerksamkeit bindet.
      - Eine Änderung genügt für die nächste Runde, etwa den Brunnen unauffälliger machen oder den Durchgang heller, nicht beides.
    explanation: |
      Der Tester hält den Brunnen für das Ziel: Er läuft direkt hin, umrundet ihn zweimal und sagt „Hier muss doch was sein“. Der Durchgang rechts unten taucht im Protokoll gar nicht auf, also gibt es keinen Beleg, dass er bemerkt wurde. Ich ordne die Stelle als „nicht bemerkt“ ein, mit dem Brunnen als konkurrierendem Reiz. Für die nächste Runde rücke ich den Brunnen im Tonwert näher an den Boden. Ein hellerer Durchgang ginge auch, aber nicht beides zugleich.
    hints:
      - Was sucht der Tester am Brunnen, und was erwähnt er gar nicht?

  - id: gelbe-farbe
    type: explain
    title: Warum Realismus mehr Farbe braucht
    prompt: |
      Zwei Entwickler zur Debatte um gelbe Markierungen, 2023 in GamesRadar+ zitiert. Erkläre in drei bis fünf Sätzen, was beide meinen und was daraus für einen Blockout aus grauen Formen und für seine spätere Ausgestaltung folgt.
    lang: prose
    code: |
      David Szymanski: „As environments get more detailed and realistic, materials get more complex and noisy, etc, it becomes increasingly difficult to direct players in unobtrusive ways“

      Damion Schubert: „the push towards more realistic art increases the need for more unrealistic visual cues.“
    points:
      - Detaillierte Grafik erzeugt visuelles Rauschen, in dem leise Hinweise untergehen.
      - Je mehr Rauschen, desto stärker müssen Hinweise sein, bis hin zu unrealistischen Markierungen.
      - Ein grauer Blockout hat kaum Rauschen, deshalb können Hinweise dort stärker wirken als später.
      - Nach der Ausgestaltung musst du deshalb erneut testen, ob die Hinweise noch tragen.
    explanation: |
      Beide beschreiben denselben Zusammenhang. Je mehr Details, Materialien und Texturen ein Raum hat, desto lauter ist der Hintergrund, gegen den ein Hinweis ankommen muss. Leise Mittel wie ein etwas hellerer Boden verschwinden darin, und Studios greifen zu deutlichen, oft unrealistischen Markierungen wie gelber Farbe. Für deinen Ablauf heißt das: Im grauen Blockout gibt es kaum Rauschen, ein Hinweis kann dort tragen und in der fertigen Grafik untergehen. Deshalb gehört nach der Ausgestaltung derselbe Test noch einmal auf den Plan, und ein Hinweis, der dann scheitert, ist ein Fall für diese Abwägung, kein Grund für Gelb überall.
    hints:
      - Was passiert mit einem leisen Signal in einem lauten Raum?
    resources:
      - title: GamesRadar+, Debatte um gelbe Markierungen (2023)
        url: https://www.gamesradar.com/debate-over-resident-evil-4-remakes-yellow-paint-resurfaces-as-devs-explain-just-how-much-players-really-need-realism-is-less-immersive/

  - id: drei-stellen-einordnen
    type: practice
    title: Drei Stellen, drei Diagnosen
    prompt: |
      Lehrbeispiel: Notizen aus einem Playtest mit drei Testern in einem Abschnitt aus zwei Bildschirmen. Die Absicht lautet: „Der Spieler soll den Schalter finden, das Tor öffnen und den Abschnitt nach oben verlassen.“ Ordne die drei Stellen ein und schreib für eine davon Änderung und Erwartung auf.

      ```text
      A  0:12 WP 2 läuft am Schalter
         vorbei, sagt nichts (3 von 3)
      B  0:40 WP 5 steht vor dem Tor,
         sagt „zu?“, kehrt um (2 von 3)
      C  1:05 WP 6 läuft am Tor vorbei
         über die Wiese hinaus (1 von 3)
      ```
    lang: prose
    starter: |
      A – Art, Beleg:
      B – Art, Beleg:
      C – Art, Beleg:
      Gewählte Stelle:
      Änderung (eine):
      Erwartung:
    checklist:
      - Jede der drei Stellen hat eine Art und einen Beleg aus der Notiz.
      - Du hast eine Stelle gewählt und begründest kurz, warum diese zuerst.
      - Die Änderung ist genau eine und passt zur Art der gewählten Stelle.
      - Die Erwartung nennt ein Verhalten, das du in der nächsten Runde zählen kannst.
    explanation: |
      Hier gibt es keine einzige richtige Lösung, aber eine prüfbare Begründung. Stelle A betrifft alle drei Tester und steht am Anfang der Kette: Ohne Schalter kein Tor. Viele würden deshalb dort anfangen. Stelle C betrifft einen von drei und ist vielleicht eine unbeabsichtigte Folge, eine Lücke, durch die man das Tor umgehen kann. Ob das ein Fehler ist, hängt an deiner Absicht.
    hints:
      - Welche Stelle müsste zuerst klappen, damit die anderen überhaupt vorkommen?

  - id: eigene-runde
    type: practice
    title: Deine nächste Runde
    prompt: |
      Nimm die Notizen aus deinem letzten eigenen Playtest. Hast du noch keinen gemacht, nimm die Notizen aus [Playtests beobachten](/level-design/playtest-methode). Schreib den Block für die nächste Runde.
    lang: prose
    starter: |
      Runde · Tester (neu?):
      Stelle:
      Gesehen:
      Art:
      Änderung:
      Erwartung:
      Ergebnis: (nach dem Test)
    checklist:
      - Die Stelle ist so genau benannt, dass du sie im Blockout wiederfindest.
      - Unter „Gesehen“ steht ein Beleg mit Häufigkeit, etwa „3 von 4“.
      - Die Art ist eine der vier und passt zum Beleg.
      - Es gibt genau eine Änderung.
      - Die Erwartung ist zählbar und steht vor dem Test fest.
      - Du hast notiert, ob die Tester der nächsten Runde den Abschnitt schon kennen.
    explanation: |
      Dieser Block ist eine Runde deines Iterationsprotokolls. Mit der Zeit zeigt er dir, welche Hebel bei dir oft wirken und welche selten. In der [Werkstatt](/level-design/werkstatt-abschnitt) legst du mehrere solche Blöcke neben die Absicht deines Abschnitts.
    hints:
      - Passt der Block nicht auf sieben Zeilen, änderst du zu viel auf einmal.
    resources:
      - title: "Kim Swift, Erik Wolpaw, „Integrating Narrative and Design: A Portal Post-Mortem“ (GDC 2008, Folien)"
        url: https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf
