    url: https://jnd.org/signifiers-not-affordances/
  - title: The Level Design Book · Wayfinding
    url: https://book.leveldesignbook.com/process/blockout/wayfinding
  - title: The Level Design Book · Environment Art, „Readability“
    url: https://book.leveldesignbook.com/process/env-art#readability
  - title: Jason Mitchell, „Connecting Visuals to Gameplay at Valve“ (MIGS 2008, Folien)
    url: https://cdn.akamai.steamstatic.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf
  - title: GamesRadar+, Debatte um gelbe Markierungen (2023)
    url: https://www.gamesradar.com/debate-over-resident-evil-4-remakes-yellow-paint-resurfaces-as-devs-explain-just-how-much-players-really-need-realism-is-less-immersive/
lesson: |
  Lehrbeispiel: Ein Lagerraum mit drei gleichen Türen. Zwei sind Kulisse und gehen nicht auf, eine führt weiter. Im Test läuft jeder Tester die Türen der Reihe nach an. Der erste erwischt zufällig gleich die richtige, der zweite probiert alle drei. Damion Schubert, Creative Director bei Boss Fight, hat genau das in der Debatte um gelbe Markierungen beschrieben: „Trying to open 30 doors to find one we can go through breaks immersion, because the tedium of the experience calls attention to the faults of the simulation.“ ([GamesRadar+](https://www.gamesradar.com/debate-over-resident-evil-4-remakes-yellow-paint-resurfaces-as-devs-explain-just-how-much-players-really-need-realism-is-less-immersive/))

  Jeder Raum beantwortet die Frage „Was kann ich hier tun?“, ob du das planst oder nicht. Dieses Modul zeigt, wie eine Umgebung informiert: wie sich das, was möglich ist, von dem unterscheidet, was man sieht, wie eine feste visuelle Sprache aussieht, wie stark Markierungen sein sollen und wie Zustände und Ziele sichtbar werden. Kurz geht es auch darum, wie Spuren zugleich führen und erzählen. Am Ende legst du deine eigene Blockout-Vokabel fest.

  ## Affordanz und Signifikant: was möglich ist und was man sieht

  Der Psychologe J. J. Gibson hat den Begriff Affordanz (affordance) geprägt. Don Norman fasst ihn so zusammen: „the actions possible by a specific agent on a specific environment. To Gibson, affordances did not have to be perceivable or even knowable — they simply existed.“ Norman hat den Begriff 1988 ins Design gebracht und dabei wahrnehmbare Affordanzen gemeint. 2008 setzt er einen zweiten Begriff daneben, den Signifikanten (signifier): „A “signifier” is some sort of indicator, some signal in the physical or social world that can be interpreted meaningfully.“ Sein Schluss: „Forget affordances: what people need, and what design must provide, are signifiers.“ ([Signifiers, not affordances](https://jnd.org/signifiers-not-affordances/))

  Im Spiel lassen sich beide sauber trennen. Die Affordanz steckt in den Regeln: Kollision, Tiefe des Wassers, ob eine Tür aufgeht. Der Signifikant ist das, was der Spieler davon sieht: Tonwert, Form, Kante, Licht. Was die Figur kann, steht im Code. Was der Spieler glaubt, dass sie kann, steht auf dem Bildschirm. Daraus ergeben sich vier Fälle:

  | Möglich? | Sichtbar? | Folge |
  | --- | --- | --- |
  | ja | ja | Der Spieler sieht die Möglichkeit und nutzt sie. |
  | ja | nein | Versteckt: gut für ein Geheimnis, schlecht für den Pflichtweg. |
  | nein | ja | Kulisse, die benutzbar aussieht: Der Spieler probiert und wird enttäuscht. |
  | nein | nein | Wand, die wie eine Wand aussieht: kein Problem. |

  Der dritte Fall kostet Zeit und Vertrauen. Der Entwickler Pedro Braga nennt in derselben Debatte, was ihm erst im Playtest auffiel: „I have [to make] holes impossible to jump through twice as large otherwise people will be trying to make the jump for hours and get bored of the game.“ In der Draufsicht gilt das für Lücken und Abgründe. Das Ausweichen der Testszene trägt 66 Pixel, gut vier Tiles (Platzhalter, siehe [Ausweichen](/combat/ausweichen)). Ein Abgrund von drei Tiles kann dann überwindbar aussehen, ob er es ist oder nicht. Welche Breite was bedeutet, legen deine Regeln fest, und die Grafik muss es zeigen.

  Norman ergänzt zwei Dinge. Auch Fehlendes ist ein Zeichen, etwa ein leerer Bahnsteig, an dem der Zug schon weg ist. Und Zeichen entstehen auch ungewollt, als „accidental byproduct of the world“. Ein Muster im Boden, das wie ein Weg aussieht, ist ein Signifikant, auch wenn du es nur als Schmuck gezeichnet hast.

  > [!MERKE] Regel und Zeichen
  > Die Kollision entscheidet, was möglich ist. Die Grafik entscheidet, was der Spieler für möglich hält. Prüf beides getrennt.

  ## Eine visuelle Sprache: eine Bedeutung, ein Zeichen

  Vor jedem Raum stellt der Spieler dieselben Fragen. Kann ich hier gehen? Sperrt das den Weg, die Sicht oder beides? Ist das gefährlich? Kann ich das benutzen? Soll ich hierhin? Eine visuelle Sprache gibt auf jede Frage im ganzen Spiel dieselbe Antwort.

  Valve hat für Team Fortress 2 eine Rangfolge solcher Fragen aufgeschrieben, die „Read Hierarchy“ ([Jason Mitchell, MIGS 2008](https://cdn.akamai.steamstatic.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf)). Die erste Frage, „Team – Friend or Foe?“, beantwortet die Farbe. Die zweite, „Class – Run or Attack?“, beantworten unter anderem „Distinctive silhouettes“. Jede Frage hat ihren eigenen Kanal. Valve spricht dort über Figuren, nicht über Räume. Übertragen auf einen Blockout heißt das: Gib jeder Frage einen eigenen Kanal, etwa den Tonwert für begehbar und blockiert und die Form für Gefahr, und benutze keinen Kanal für zwei Fragen.

  Das Level Design Book fragt bei der Lesbarkeit eines Levels: „Can the player understand where they can go vs. can't go, should vs. shouldn't go?“ ([Readability](https://book.leveldesignbook.com/process/env-art#readability)). Als Mittel nennt es, Farben für eine Bedeutung zu reservieren, etwa „only explosive barrels are red!“. Ein Beispiel aus dem Buch: In The Last of Us Part II steht Efeu für geschlossene Gebäude, Gebäude zum Betreten sind frei davon. Das funktioniert laut Buch nur, „As long as all the designers and artists maintain consistency in how they use ivy“.

  Bedeutung entsteht dabei durch Wiederholung, nicht durch die Form an sich. Das Buch rät ausdrücklich ab: „shape and color psychology are not effective for level design“ ([Avoid shape and color psychology](https://book.leveldesignbook.com/process/env-art#avoid-shape-and-color-psychology)). Ein Dreieck ist nicht von sich aus gefährlich. Es wird gefährlich, wenn es im ganzen Spiel Gefahr bedeutet und der Spieler das gelernt hat. Wie du so etwas einführst, zeigt [Möglichkeiten einführen, sicher erproben, variieren](/level-design/einfuehren-variieren).

  Die Legende der Rasterkarten in diesem Kurs ist schon eine kleine visuelle Sprache. `#` sperrt Weg und Sicht nach dahinter, `o` und `~` sperren den Weg, aber nicht die Sicht. Das Level Design Book trennt genauso zwischen Abgründen und Flüssen, die „physically block movement without blocking line of sight“, und Wänden, die Bewegung und Sicht sperren.

  Eine Ausnahme ist erlaubt, wenn sie ein eigenes Zeichen hat. Eine Wand, durch die man gehen kann, braucht einen Hinweis, sonst bricht sie die Sprache. Das Buch nennt als subtiles Zeichen „subtle crack in ground or wall (Zelda)“.

  ## Wie stark markieren: von subtil bis direkt

  Das Level Design Book ordnet Hilfen zur Orientierung nach geschätzter Sicherheit, „a non-scientific estimate of the proportion of players will likely perceive and use the aid“ ([Wayfinding aids](https://book.leveldesignbook.com/process/blockout/wayfinding#wayfinding-aids)). Einige Einträge aus seiner Tabelle:

  | Stufe | Sicherheit | Beispiele |
  | --- | --- | --- |
  | Subtle | 1–20 % | ungewöhnliches Detail wie ein Riss (10 %) |
  | Coarse | 35–60 % | Licht und Farbe (40 %), Schilder in der Welt (40 %), Spuren (50 %) |
  | Situational | 70–93 % | Reihen von Fundstücken, sichtbare Belohnungen in der Ferne (80 %) |
  | Direct | 95–98 % | tiefe, breite Abgründe (95 %), feste Wände (98 %) |

  Zwei Dinge fallen auf. Schilder in der Welt stehen nur bei 40 %, mit dem Zusatz „easily mistaken for irrelevant set dressing“. Und selbst eine feste Wand überzeugt nicht jeden. Das Buch nennt Speedrunner und Spieler, die „wallhugging to try to find secrets“ jede Wand abtasten.

  Daraus folgt eine Faustregel: Ein Pflichtweg braucht mehr Sicherheit als ein Nebenweg. Was den Abschnitt beendet, darf nicht nur an einem Riss hängen. Was eine Belohnung für Aufmerksamkeit ist, darf leise sein. Zu viele laute Zeichen nehmen dem Spieler das Finden; wie du beim Überarbeiten nicht übermarkierst, zeigt [Überarbeiten](/level-design/ueberarbeiten).

  Licht ist ein starkes Mittel. Für Left 4 Dead notiert Valve: „Players tend to follow the light“. Dieselben Folien zeigen eine frühe Fassung mit „Too many areas of contrast“ und daneben die vereinfachte Beleuchtung der fertigen Fassung ([Mitchell, MIGS 2008](https://cdn.akamai.steamstatic.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf)). Ein Hinweis wirkt nur, wenn wenig anderes mit ihm konkurriert. Im grauen Blockout ist das leicht, mit der Ausgestaltung wird es schwer. Schubert nennt das „one of those counterintuitive cases where realism is less immersive“. Halte deine Sprache deshalb auch, wenn Grafik dazukommt ([Vom Blockout zur Ausgestaltung](/level-design/ausgestaltung)).

  > [!PRAXIS] Was im Playtest nicht offensichtlich war
  > In der Debatte um gelbe Markierungen 2023 listete Pedro Braga auf, welche „things that seemed obvious to me but weren't during playtests“ er nachbessern musste. Eines davon: „Players won't pick up a necessary item even though it's on a pedestal... So I make it [floating and glowing] instead.“ Palle Hoffstein, Artist bei The Division, erzählt halb im Scherz, er habe einmal gedacht: „we don't need the signs and breadcrumbs. Players aren't stupid. Let them explore.“ Nach Playtests hieß es: „put it back and let's never speak of this again.“ ([GamesRadar+](https://www.gamesradar.com/debate-over-resident-evil-4-remakes-yellow-paint-resurfaces-as-devs-explain-just-how-much-players-really-need-realism-is-less-immersive/)) Beide haben die Stärke ihrer Zeichen am Verhalten der Tester eingestellt, nicht an der eigenen Erwartung.

  ## Zustände und Ziele sichtbar machen

  Norman schreibt, Menschen brauchen „some sign of what it is for, what is happening, and what the alternative actions are“. Im Raum heißt das: Ein Ding mit Zuständen zeigt, in welchem Zustand es ist. Eine Tür kann offen sein, geschlossen, verschlossen bis zu einer Bedingung oder Kulisse, die nie aufgeht. Jeder dieser Zustände braucht ein eigenes Zeichen, und die Kulisse sollte nicht wie eine Tür aussehen, die gerade nur zu ist.

  Eine Änderung des Zustands muss der Spieler sehen, wenn sie passiert. In der Draufsicht heißt das: Ursache und Wirkung liegen auf einem Bildschirm, oder die Wirkung wird auf andere Weise gezeigt. Hält die Kamera die Figur am Schalter mittig, sieht der Spieler rund 10 Tiles zu jeder Seite. Liegt das Tor 16 Tiles neben dem Schalter, ist es nicht im Bild, wenn es aufgeht.

  Auch Ziele kann der Raum zeigen, bevor der Spieler sie erreicht. In Portal trägt der Spieler einen Würfel durch ein langes Level und legt ihn am Ende auf einen Schalter. Nach einer gescheiterten ersten Fassung steht auf den Folien von Valve: „Always see the button.“ ([Portal Post-Mortem, GDC 2008](https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf)). Das Level Design Book führt „collectibles or powerups visible in the distance“ bei 80 % Sicherheit. Hidemaro Fujibayashi hat für Breath of the Wild von 引力 gesprochen, einer Anziehungskraft. Laut dem Bericht von 4Gamer definiert er sie als 「プレイヤーにとってお得であるがゆえに，そこに向かいたくなってしまう力」, in eigener Übersetzung: „eine Kraft, die den Spieler dorthin ziehen will, weil es sich für ihn lohnt“ ([4Gamer, 2017](https://www.4gamer.net/games/341/G034168/20170901120/)).

  Verstecken bleibt erlaubt. Dan Taylor schreibt, es sei „entirely appropriate to hide areas from the player, to add depth and replayability through exploration (as long as you provide the necessary visual or narrative clues)“ ([Ten Principles, Teil 1](https://www.gamedeveloper.com/design/ten-principles-of-good-level-design-part-1-)). Versteckt ist etwas, dessen Zeichen leise ist, nicht etwas ganz ohne Zeichen.

  ## Spuren, die führen und erzählen

  Information beantwortet „Was kann ich hier tun?“. Erzählung beantwortet „Was ist hier passiert?“. Eine Spur kann beides. Das Level Design Book führt Erzählen über die Umgebung als Orientierungshilfe mit 50 % Sicherheit: „trail of blood on floor (Doom), trail of destruction (BioShock)... clear authored path formed by a character or event“. Norman nennt Trampelpfade, „desire lines“, als Zeichen, das andere Menschen hinterlassen haben.

  Soll eine Spur führen, muss sie zuerst als Weg lesbar sein: zusammenhängend, in Laufrichtung und mit einem Ende, das man erreichen kann. Ihre Bedeutung kommt danach. Eine Spur, die nur erzählt, darf leiser sein, denn niemand muss ihr folgen. Wie Räume über Spuren erzählen, zeigt [Erzählen über Handlung, Umgebung und Folgen](/narrative/umgebung-erzaehlt). Hier zählt, wohin die Spur führt.

  Ein Spiel kann ganz ohne Text auskommen. Heart Machine hat für Hyper Light Drifter früh entschieden: „We decided pretty much at the beginning as a full team we did not want any text in the game whatsoever“ (Teddy Diefenbach bei [Kill Screen, 2014](https://www.killscreen.com/building-wordless-world-hyper-light-drifter/)). Dann muss die Umgebung alles tragen, was sonst eine Texttafel sagt. Auch Klang kann ein Hinweis sein; das behandelt der spätere Sound-Kurs.

  ## Deine Blockout-Vokabel

  Bevor du in Godot einen Blockout baust ([Blockout in Godot](/level-design/blockout)), legst du fest, welche Form und welcher Tonwert was bedeutet. Diese Liste ist deine Blockout-Vokabel. Im Blockout gibt es keine fertige Grafik, nur graue Formen und flache Platzhalter-Tiles, deshalb trägt der Tonwert die Hauptlast. Warum der Tonwert vor der Farbe kommt, erklären [Licht und Tonwerte](/pixelart/licht-werte) und [Komposition und Blickführung](/level-design/blickfuehrung).

  Die Vorlage hat sechs Zeilen. „Blockiert hoch“ sperrt Weg und Sicht, „blockiert tief“ nur den Weg:

  ```text
  Kategorie       Form   Tonwert
  begehbar
  blockiert hoch
  blockiert tief
  gefährlich
  benutzbar
  Hinweis
  ```

  Fünf Regeln halten die Vokabel brauchbar:

  - Jede Kategorie hat genau ein Zeichen, jedes Zeichen genau eine Bedeutung.
  - Begehbar und blockiert unterscheiden sich im Tonwert, damit es auch in Graustufen und mit zusammengekniffenen Augen lesbar bleibt ([Lesbarkeit prüfen](/pixelart/lesbarkeit-pruefen)).
  - Gefährlich unterscheidet sich von blockiert auch in der Form, nicht nur im Tonwert. Sonst liest der Spieler eine Gefahr als Wand oder eine Wand als Gefahr.
  - Das Hinweis-Zeichen ist selten. Es markiert die Stellen, die in deiner Absichtsnotiz unter „Hinweise“ stehen, und nichts sonst.
  - Die Vokabel gilt für den ganzen Abschnitt und bleibt, wenn später Grafik dazukommt.

  Welche Formen und Tonwerte du wählst, entscheidest du. Lass dir die Vokabel nicht von einer KI vorschlagen. Sie ist die erste Designentscheidung deines Blockouts.

  > [!INTERVIEW] „Was ist der Unterschied zwischen Affordanz und Signifikant?“
  > Die Affordanz ist, was möglich ist, in einem Spiel also das, was Kollision und Regeln erlauben. Der Signifikant ist das wahrnehmbare Zeichen dafür. Don Norman rät, sich um Signifikanten zu kümmern, weil Menschen nur nutzen, was sie erkennen. Im Level prüfe ich beides getrennt: Stimmt die Kollision, und sieht der Spieler, was sie erlaubt? Heikel sind die Stellen, an denen beides auseinanderläuft, also Kulisse, die benutzbar aussieht, und Wege, die wie Wand aussehen.

  ## Häufige Fehler

  - **Kulisse sieht benutzbar aus.** Drei gleiche Türen, nur eine geht auf. Gib der Kulisse ein eigenes Zeichen oder mach sie zur Wand.
  - **Ein Zeichen, zwei Bedeutungen.** Dieselbe Farbe steht für Gefahr und für Belohnung. Der Spieler lernt die eine Regel und erlebt die andere.
  - **Ausnahme ohne Zeichen.** Eine einzelne begehbare Wand ohne Riss. Spieler lernen daraus, dass Wände lügen, und laufen jede Wand ab.
  - **Pflichtweg nur subtil markiert.** Der einzige Weg weiter hängt an einem Zeichen mit 10 % Sicherheit. Prüf die Stufe jedes Pflichtwegs.
  - **Zustand ändert sich außerhalb des Bildes.** Schalter und Tor liegen auf verschiedenen Bildschirmen, und nichts zeigt die Änderung.
  - **Formpsychologie statt Wiederholung.** „Rund wirkt freundlich“ ersetzt keine Regel, die der Spieler gelernt hat.

  ## Zusammenfassung

  - Affordanz ist, was möglich ist; ein Signifikant ist das wahrnehmbare Zeichen dafür. Im Spiel entscheidet die Kollision das eine, die Grafik das andere.
  - Kulisse, die benutzbar aussieht, kostet Zeit und Vertrauen. Versteckte Möglichkeiten passen zu Geheimnissen, nicht zu Pflichtwegen.
  - Eine visuelle Sprache gibt jeder Frage einen eigenen Kanal und jeder Bedeutung genau ein Zeichen. Bedeutung entsteht durch Wiederholung.
  - Das Level Design Book ordnet Hilfen von subtil (1–20 %) bis direkt (95–98 %). Pflichtwege brauchen mehr Sicherheit als Nebenwege.
  - Zustände brauchen eigene Zeichen, und Änderungen müssen im Bild passieren. Ein sichtbares Ziel zieht den Spieler dorthin, wo es sich lohnt.
  - Information beantwortet „Was kann ich hier tun?“, Erzählung „Was ist hier passiert?“. Eine führende Spur muss zuerst als Weg lesbar sein.
  - Deine Blockout-Vokabel legt Form und Tonwert für begehbar, blockiert, gefährlich, benutzbar und Hinweis fest.
exercises:
  - id: luecke-in-der-wand
    type: choice
    title: Die Lücke, die keiner sieht
    prompt: |
      Lehrbeispiel: In der Wand eines Hofs ist eine Lücke von zwei Tiles, durch die die Figur passt. Die Lücke hat denselben Tonwert wie die Wand daneben, nur die Kollision fehlt. Alle Tester laufen vorbei. Wie beschreibst du die Stelle mit Normans Begriffen?
    options:
      - text: Eine Affordanz ohne Signifikant. Möglich ist der Durchgang, sichtbar ist er nicht.
        correct: true
        why: Die Regeln erlauben den Weg, die Grafik zeigt ihn nicht. Für ein gewolltes Geheimnis kann das richtig sein, für einen Pflichtweg nicht.
      - text: Ein Signifikant ohne Affordanz. Sichtbar ist ein Durchgang, möglich ist er nicht.
        correct: false
        why: Umgekehrt. Hier ist der Durchgang möglich, aber nicht zu sehen.
      - text: Ein Fehler in der Kollision, der sich nur im Code beheben lässt.
        correct: false
        why: Die Kollision tut, was sie soll. Das Problem liegt im Zeichen, also in der Grafik.
      - text: Eine zu starke Markierung, die Tester abschreckt.
        correct: false
        why: Es gibt gar keine Markierung. Die Lücke sieht aus wie Wand.
    explanation: |
      Gibson nennt das, was eine Umgebung einer Figur erlaubt, Affordanz. Norman betont, dass Menschen nur nutzen, was sie über ein Zeichen erkennen. Ob die Lücke ein Fehler ist, entscheidet deine Absicht. Soll sie ein Geheimnis sein, braucht sie ein leises Zeichen, etwa einen Riss. Soll sie der Weg sein, braucht sie ein deutliches.
    hints:
      - Was erlauben die Regeln, und was zeigt der Bildschirm?
    resources:
      - title: Don Norman, „Signifiers, not affordances“
        url: https://jnd.org/signifiers-not-affordances/

  - id: drei-tueren
    type: choice
    title: Drei Türen, eine geht auf
    prompt: |
      Lehrbeispiel: Ein Lager mit drei gleich aussehenden Türen. Zwei sind Kulisse, eine führt weiter. Welche Änderungen machen den Zustand der Türen lesbar?
    options:
      - text: Die beiden Kulissentüren werden zu Wand, etwa mit einem Regal davor, sodass sie keine Türform mehr haben.
        correct: true
        why: Was nie aufgeht, sieht nicht mehr wie eine Tür aus. Der Signifikant passt wieder zur Affordanz.
      - text: Die echte Tür bekommt den hellen Rahmen, den im ganzen Abschnitt nur Türen haben, die aufgehen.
        correct: true
        why: Das ist ein Zeichen mit genau einer Bedeutung, wenn du es überall so hältst.
      - text: Über der echten Tür hängt ein Schild mit der Aufschrift „Ausgang“, sonst bleibt alles gleich.
        correct: false
        why: Schilder in der Welt stehen im Level Design Book bei 40 % und werden leicht für Dekoration gehalten. Die Kulissentüren sehen weiter benutzbar aus.
      - text: Alles bleibt gleich. Die Tester sollen ausprobieren, das gehört zur Erkundung.
        correct: false
        why: Damion Schubert beschreibt genau das als Bruch der Immersion, weil das Ausprobieren die Schwächen der Simulation zeigt.
    explanation: |
      Ein Ding mit Zuständen zeigt, in welchem Zustand es ist. Kulisse, die wie eine geschlossene Tür aussieht, verspricht eine Möglichkeit, die es nicht gibt. Zwei Wege führen heraus: Die Kulisse verliert ihr Türzeichen, oder die echte Tür bekommt ein Zeichen, das im ganzen Abschnitt nur echte Türen tragen. Beides zusammen ist am deutlichsten.
    hints:
      - Zwei Antworten sind richtig.
    resources:
      - title: GamesRadar+, Debatte um gelbe Markierungen (Schubert)
        url: https://www.gamesradar.com/debate-over-resident-evil-4-remakes-yellow-paint-resurfaces-as-devs-explain-just-how-much-players-really-need-realism-is-less-immersive/

  - id: information-oder-erzaehlung
    type: choice
    title: Was kann ich hier tun?
    prompt: |
      Lehrbeispiel: Ein Wachraum mit mehreren Details. Welche Details beantworten vor allem die Frage „Was kann ich hier tun?“
    options:
      - text: Ein heller Rahmen an der einzigen Tür, die aufgeht.
        correct: true
        why: Das Zeichen sagt, wo es weitergeht. Es erzählt nichts über die Vergangenheit.
      - text: Ein feiner Riss in der Wand, hinter der ein Durchgang liegt.
        correct: true
        why: Ein leises Zeichen für eine Möglichkeit, also Information, auch wenn sie leise ist.
      - text: Fußspuren im Staub, die vom Eingang zu einer Falltür führen.
        correct: true
        why: Die Spur führt zur Falltür und informiert damit. Zugleich erzählt sie, dass jemand hier war.
      - text: Ein umgestürzter Stuhl und eine halb leere Tasse auf dem Tisch.
        correct: false
        why: Das erzählt, dass jemand den Raum plötzlich verlassen hat. Was der Spieler tun kann, sagt es nicht.
      - text: Ein verblasstes Bild an der Wand.
        correct: false
        why: Ein Detail für die Frage „Was ist hier passiert?“, keine Information über Wege oder Möglichkeiten.
    explanation: |
      Information sagt, was möglich ist und wohin es geht. Erzählung sagt, was hier geschehen ist. Die Fußspuren tun beides, und so eine Spur ist nützlich, solange sie zuerst als Weg lesbar ist. Die Erzählung selbst behandelt [Erzählen über Handlung, Umgebung und Folgen](/narrative/umgebung-erzaehlt).
    hints:
      - Drei Antworten sind richtig.
      - Frag bei jedem Detail, ob es einen Weg oder eine Handlung zeigt.
    resources:
      - title: The Level Design Book · Wayfinding, „Coarse“ (environmental storytelling)
        url: https://book.leveldesignbook.com/process/blockout/wayfinding#coarse-35-60-certainty

  - id: hilfen-nach-sicherheit
    type: order
    title: Von leise bis laut
    prompt: |
      Bring diese Hilfen in die Reihenfolge der geschätzten Sicherheit aus dem Level Design Book, von der leisesten zur sichersten.
    lang: prose
    lines: |
      Ein ungewöhnliches Detail, etwa ein feiner Riss in der Wand.
      Licht und Farbe, etwa ein hell erleuchteter Ausgang.
      Eine Spur, die eine Figur oder ein Ereignis hinterlassen hat.
      Eine Reihe von Fundstücken, die zum Ziel führt.
      Ein tiefer, breiter Abgrund, der den Weg sperrt, aber nicht die Sicht.
      Eine feste Wand, die Weg und Sicht sperrt.
    explanation: |
      Die Tabelle des Level Design Book nennt für das ungewöhnliche Detail 10 %, für Licht und Farbe 40 %, für Spuren 50 %, für Reihen von Fundstücken 80 %, für tiefe, breite Abgründe 95 % und für feste Wände 98 %. Das Buch nennt die Zahlen selbst eine grobe Schätzung. Sie helfen dir, die Stärke eines Zeichens zu seinem Zweck zu passen: Pflichtweg weiter unten in der Liste, Geheimnis weiter oben.
    hints:
      - Was den Spieler körperlich aufhält, steht am Ende.
    resources:
      - title: The Level Design Book · Wayfinding aids
        url: https://book.leveldesignbook.com/process/blockout/wayfinding#wayfinding-aids

  - id: zeichen-doppelt
    type: output
    title: Ein Zeichen zu viel
    prompt: |
      Du hast in einem Raum notiert, welches Zeichen welche Bedeutung trägt. Das Modell sucht Zeichen mit mehr als einer Bedeutung. Was gibt es aus?
    lang: python
    code: |
      funde = [("rot", "gefährlich"),
               ("hell", "begehbar"),
               ("rot", "Belohnung"),
               ("Kreis", "benutzbar"),
               ("hell", "begehbar"),
               ("Gitter", "blockiert")]
      je = {}
      for z, bed in funde:
          je.setdefault(z, set())
          je[z].add(bed)
      doppelt = [z for z in je
                 if len(je[z]) > 1]
      print(len(je), doppelt)
    expected: |
      4 ['rot']
    hints:
      - "`set()` speichert jede Bedeutung nur einmal. „hell, begehbar“ kommt zweimal vor und zählt als eine."
      - Es gibt vier verschiedene Zeichen.
    explanation: |
      Vier Zeichen kommen vor: rot, hell, Kreis und Gitter. Nur „rot“ hat zwei Bedeutungen, Gefahr und Belohnung. Ein Spieler, der Rot als Gefahr gelernt hat, meidet die Belohnung, oder er lernt, dass Rot nichts Sicheres bedeutet. Die umgekehrte Prüfung gehört auch dazu: Hat eine Bedeutung mehrere Zeichen? Das prüft das Modell nicht.
    resources:
      - title: Python · dict.setdefault
        url: https://docs.python.org/3/library/stdtypes.html#dict.setdefault

  - id: stufen-je-weg
    type: output
    title: Welcher Weg ist lauter?
    prompt: |
      Hinweise eines Lehrbeispiels mit der Sicherheit aus der Tabelle des Level Design Book. Licht am Tor, Riss in der Wand und Schild am Tor liegen am Pflichtweg, ein Fundstück in Sicht und eine Spur am Boden am Nebenweg. Das Modell zählt je Weg die Hinweise ab 35 % und nennt den stärksten Wert. Was gibt es aus?
    lang: python
    code: |
      hinweise = [
          ("Pflicht", "Licht", 40),
          ("Pflicht", "Riss", 10),
          ("Pflicht", "Schild", 40),
          ("Neben", "Fundstück", 80),
          ("Neben", "Spur", 50),
      ]
      for weg in ("Pflicht", "Neben"):
          werte = [p for w, _, p in
                   hinweise if w == weg]
          stark = [p for p in werte
                   if p >= 35]
          print(weg, len(stark),
                max(werte))
    expected: |
      Pflicht 2 40
      Neben 2 80
    hints:
      - Der Riss liegt unter 35 und zählt nicht mit.
      - "`max` nimmt alle Werte des Wegs, auch den Riss."
    explanation: |
      Beide Wege haben zwei Hinweise ab 35 %, aber der stärkste Hinweis im Raum liegt auf dem Nebenweg. Ein Fundstück, das man von Weitem sieht, zieht stärker als Licht und Schild am Tor. Wenn deine Absicht ist, dass der Spieler zuerst durchs Tor geht, arbeitet dieser Raum gegen dich. Die Zahlen sind grobe Schätzungen, aber sie zeigen dir, wo du im Playtest hinsehen musst.
    resources:
      - title: The Level Design Book · Wayfinding aids
        url: https://book.leveldesignbook.com/process/blockout/wayfinding#wayfinding-aids

  - id: begriffe-information
    type: gap
    title: Möglichkeit, Zeichen, Sicherheit
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Was eine Umgebung einer Figur tatsächlich zu tun erlaubt, nannte J. J. Gibson ⟦Affordanz⟧. Das wahrnehmbare Zeichen dafür nennt Don Norman ⟦Signifikant⟧. Das Level Design Book ordnet Hilfen zur Orientierung nach geschätzter ⟦Sicherheit⟧, von subtil bis direkt. Die Frage „Was kann ich hier tun?“ beantwortet die Umgebung als ⟦Information⟧, die Frage „Was ist hier passiert?“ als ⟦Erzählung⟧.
    gaps:
      - label: was möglich ist
        hint: Englisch affordance.
        accept: ["Affordance", "Affordanzen"]
      - label: was man sieht
        hint: Englisch signifier.
        accept: ["Signifier", "Signifikanten"]
      - label: Maß der Ordnung
        hint: Das Buch spricht von „% certainty“.
        accept: ["certainty", "Gewissheit", "Wahrscheinlichkeit"]
      - label: erste Frage
        hint: Das Thema dieses Moduls.
        accept: ["Informationen", "Hinweis"]
      - label: zweite Frage
        hint: Das Thema von „umgebung-erzaehlt“ im Narrative-Kurs.
        accept: ["Erzählen", "Geschichte", "Environmental Storytelling", "Storytelling"]
    explanation: |
      Affordanz und Signifikant trennen das Mögliche vom Sichtbaren. Die Sicherheit des Level Design Book ist eine grobe Schätzung, wie viele Spieler eine Hilfe bemerken und nutzen. Information und Erzählung sind zwei Fragen an denselben Raum; eine Spur kann beide beantworten.
    resources:
      - title: Don Norman, „Signifiers, not affordances“
        url: https://jnd.org/signifiers-not-affordances/

  - id: vokabel-doppelt
    type: bug
    title: Zwei Kategorien, ein Zeichen
    prompt: |
      Lehrbeispiel: eine Blockout-Vokabel. Die Zeile für die hohe Wand steht seit dem ersten Entwurf fest. Eine andere Zeile macht zwei Kategorien ununterscheidbar. Finde sie.
    lang: text
    code: |
      begehbar:   hell, glatt
      Wand hoch:  dunkel, voll
      Hindernis:  mittel, Kreuz
      Gefahr:     dunkel, voll
      benutzbar:  mittel, Kreis
      Hinweis:    sehr hell, Raute
    lines: [4]
    explanation: |
      Gefahr und hohe Wand haben denselben Tonwert und dieselbe Form. Der Spieler liest jede Gefahr als Wand und hält Abstand, oder er lernt, dass Wände wehtun können. Mindestens die Form muss sich unterscheiden, besser beides. Hindernis und benutzbar teilen sich den Tonwert, unterscheiden sich aber in der Form; das ist erlaubt, solange die Form deutlich genug ist.
    hints:
      - Vergleiche die Zeilen paarweise, Tonwert und Form zusammen.
    resources:
      - title: The Level Design Book · Environment Art, „Color and value“
        url: https://book.leveldesignbook.com/process/env-art#color-and-value

  - id: pflichtweg-subtil
    type: bug
    title: Der einzige Weg ist leise
    prompt: |
      Lehrbeispiel: Hinweise aus einer Absichtsnotiz für einen Lagerhof. Der Hof hat genau einen Weg weiter, den Durchbruch im Osten. Eine Zeile passt in ihrer Stärke nicht zu ihrem Zweck. Finde sie.
    lang: prose
    code: |
      Hohe Mauer rings um den Hof: sperrt Weg und Sicht, damit der Hof nur über den Durchbruch verlassen wird.
      Fundstück halb sichtbar in der Nische West: Belohnung für Neugier, Nebenweg.
      Feiner Riss in der Ostwand: einziges Zeichen für den Durchbruch, Pflichtweg.
      Brunnen in der Mitte: Landmarke, an der sich die Wege treffen.
    lines: [3]
    explanation: |
      Ein feiner Riss steht im Level Design Book bei etwa 10 %. Für ein Geheimnis passt das. Für den einzigen Weg weiter heißt es, dass die meisten Spieler den Hof nicht verlassen. Der Pflichtweg braucht eine stärkere Hilfe dazu, etwa Licht am Durchbruch oder eine Sichtlinie auf das, was dahinter liegt. Der leise Riss darf bleiben, als zusätzliches Zeichen.
    hints:
      - Welche Zeile nennt einen Pflichtweg?
      - Wie sicher ist ein Riss laut der Tabelle?
    resources:
      - title: The Level Design Book · Wayfinding, „Subtle“
        url: https://book.leveldesignbook.com/process/blockout/wayfinding#subtle-1-20-certainty

  - id: lesehierarchie
    type: explain
    title: Valves Lesehierarchie im Blockout
    prompt: |
      Auszug aus Jason Mitchells Folien zu Team Fortress 2. Erkläre in drei bis fünf Sätzen, welches Prinzip dahintersteht und wie du es auf die Blockout-Vokabel eines Top-down-Abschnitts überträgst.
    lang: prose
    code: |
      Read Hierarchy
      Team – Friend or Foe? Color
      Class – Run or Attack? Distinctive silhouettes, Body proportions, Weapons
      Selected weapon – What’s he packin’? Highest contrast at chest level, where weapon is held
    points:
      - Die Fragen des Spielers stehen in einer Rangfolge, die wichtigste zuerst.
      - Jede Frage hat ihren eigenen Kanal, etwa Farbe, Silhouette oder Kontrast an einer Stelle.
      - Im Blockout bekommt die wichtigste Frage, etwa „Kann ich hier gehen?“, den stärksten Kanal, meist den Tonwert.
      - Kein Kanal trägt zwei Fragen, sonst widersprechen sich die Antworten.
    explanation: |
      Valve hat die Fragen, die ein Spieler bei einer Figur stellt, nach Wichtigkeit geordnet und jeder einen Kanal gegeben: Farbe für Freund oder Feind, Silhouette für die Klasse, Kontrast an der Brust für die Waffe. Die Folien sprechen über Figuren, das Prinzip lässt sich aber auf Räume übertragen. Im Blockout ist die wichtigste Frage meist, wo man gehen kann, und sie bekommt den Tonwert, weil der auch in Graustufen und auf Distanz trägt. Gefahr bekommt einen anderen Kanal, etwa die Form, und benutzbare Dinge wieder einen anderen. Teilen sich zwei Fragen einen Kanal, muss der Spieler raten, welche gemeint ist.
    hints:
      - Lies jede Zeile als Frage und Antwortkanal.
    resources:
      - title: Jason Mitchell, „Connecting Visuals to Gameplay at Valve“ (MIGS 2008)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf

  - id: ohne-text
    type: explain
    title: Lehren ohne Texttafel
    prompt: |
      Alex Preston, der Gründer von Heart Machine, im Interview über Hyper Light Drifter, ein Spiel ohne Text. Erkläre in drei bis fünf Sätzen, was diese Entscheidung für die Umgebung bedeutet und wie du prüfst, ob sie trägt.
    lang: prose
    code: |
      Just today we were talking about teaching people certain functions, and there’s mechanics in our game that can be relatively esoteric, and the best way to do that usually in a game is just blurt some text on the screen [...] but in our game we can’t tell people that with text so we have to find a different way to do that, and that requires more effort from us.
    points:
      - Ohne Text muss die Umgebung zeigen, was möglich ist und wie es funktioniert.
      - Das kostet mehr Arbeit, weil jede Information ein eigenes Zeichen im Raum oder in der Handlung braucht.
      - Ob ein Zeichen ohne Text verstanden wird, zeigt nur das Verhalten von Testern, die das Spiel nicht kennen.
      - Was keine Texttafel erklärt, steht als Hinweis in der Absichtsnotiz und wird im Playtest geprüft.
    explanation: |
      Ein Satz auf dem Bildschirm ist das billigste Werkzeug, eine Funktion zu erklären. Wer darauf verzichtet, muss dieselbe Information über Raum, Form, Licht oder eine gespielte Situation vermitteln, und Preston sagt offen, dass das mehr Aufwand ist. Jede dieser Informationen wird so zu einem Hinweis im Sinne dieses Kurses: Sie braucht einen Ort, ein Zeichen und einen Zweck. Ob sie ankommt, prüfst du nur im Test mit Menschen, die das Spiel nicht kennen, denn du selbst weißt die Antwort schon. Ob dein Spiel Text nutzt, entscheidest du.
    hints:
      - Was übernimmt die Umgebung, wenn die Texttafel fehlt?
    resources:
      - title: Unwinnable, „Interview with Alex Preston“ (2015)
        url: https://unwinnable.com/2015/12/02/interview-with-alex-preston-the-creator-of-hyper-light-drifter/

  - id: raum-inventur
    type: practice
    title: Die Sprache eines fremden Raums
    prompt: |
      Wähle einen Raum aus einem veröffentlichten Top-down-Spiel, das du kennst, oder ein Standbild aus einem Video. Notiere in höchstens fünf Stichpunkten, welches Zeichen dort für begehbar, blockiert, gefährlich und benutzbar steht. Such eine Stelle, an der ein Zeichen zwei Bedeutungen haben könnte oder Kulisse benutzbar aussieht.
    lang: prose
    starter: |
      Spiel, Raum:
      begehbar / blockiert:
      gefährlich:
      benutzbar:
      Zweifelhafte Stelle:
    checklist:
      - Spiel und Raum sind genannt.
      - Zu jeder der vier Kategorien steht ein konkretes Zeichen (Tonwert, Form, Kante, Licht oder Bewegung).
      - Du hast eine zweifelhafte Stelle benannt oder begründet, warum du keine gefunden hast.
      - Was du vermutest, ist als Vermutung markiert, etwa mit „vermutlich“.
    explanation: |
      Veröffentlichte Spiele haben fast immer eine feste Sprache, auch wenn sie nirgends aufgeschrieben ist. Wenn du sie ausliest, siehst du, welche Kanäle das Spiel für welche Frage nutzt. Die zweifelhafte Stelle ist der wertvollste Teil: Dort hat das Spiel eine Ausnahme gemacht oder eine Bedeutung doppelt belegt, und du kannst prüfen, ob es das durch ein anderes Zeichen auffängt.
    hints:
      - Schau zuerst auf den Boden. Wo hört begehbar auf?
    resources:
      - title: The Level Design Book · Environment Art, „Readability“
        url: https://book.leveldesignbook.com/process/env-art#readability

  - id: eigene-vokabel
    type: practice
    title: Deine Blockout-Vokabel
    prompt: |
      Leg deine eigene Blockout-Vokabel fest, eine Zeile je Kategorie, mit Form und Tonwert. Welche Formen und Tonwerte du nimmst, entscheidest du. Du baust sie später in Godot als Platzhalter-Tiles ([Blockout in Godot](/level-design/blockout)).
    lang: prose
    starter: |
      begehbar:
      blockiert hoch (Weg und Sicht):
      blockiert tief (nur Weg):
      gefährlich:
      benutzbar:
      Hinweis:
    checklist:
      - Jede der sechs Kategorien hat eine Form und einen Tonwert.
      - Keine zwei Kategorien teilen sich Form und Tonwert zugleich.
      - Begehbar und beide Arten von blockiert unterscheiden sich im Tonwert.
      - Gefährlich unterscheidet sich von blockiert auch in der Form.
      - Du kommst mit höchstens fünf Tonwerten aus.
      - Du hast notiert, wofür das Hinweis-Zeichen benutzt wird und wofür nicht.
    explanation: |
      Die Vokabel ist die Legende deines Blockouts. Mit wenigen Tonwerten bleibt sie in Graustufen lesbar, und weil jede Kategorie ein eigenes Zeichen hat, kannst du im Playtest unterscheiden, ob ein Tester ein Zeichen übersehen oder falsch gelesen hat. Halte die Vokabel neben der Absichtsnotiz fest, damit du sie bei der Ausgestaltung wiederfindest.
    hints:
      - Fang mit begehbar und blockiert hoch an. Sie sind die häufigsten Tiles.
    resources:
      - title: The Level Design Book · Environment Art, „Avoid shape and color psychology“
        url: https://book.leveldesignbook.com/process/env-art#avoid-shape-and-color-psychology
