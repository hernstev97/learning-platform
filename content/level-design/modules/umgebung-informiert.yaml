id: umgebung-informiert
title: Umgebung als Information und visuelles Erzählen
level: 2
minutes: 90
summary: Wie ein Raum sagt, was man hier tun kann – Affordanz und Signifikant nach Don Norman, eine feste visuelle Sprache für begehbar, blockiert, gefährlich und benutzbar, die Stärke von Markierungen, sichtbare Zustände und Vorschau, kurz das Erzählen über Spuren und am Ende deine eigene Blockout-Vokabel.
place: unterwegs
goals:
  - Du unterscheidest Affordanz und Signifikant nach Don Norman und findest in einem Raum Möglichkeiten ohne Zeichen und Zeichen ohne Möglichkeit.
  - Du prüfst eine visuelle Sprache auf Konsistenz, sodass begehbar, blockiert, gefährlich, benutzbar und Hinweis je ein eigenes, gleichbleibendes Zeichen haben.
  - Du ordnest Markierungen nach ihrer Sicherheit von subtil bis direkt und begründest, wie stark ein Pflichtweg und ein Nebenweg markiert sein sollen.
  - Du machst Zustände und Ziele sichtbar und trennst Information („Was kann ich hier tun?“) von Erzählung („Was ist hier passiert?“).
  - Du legst deine eigene Blockout-Vokabel aus Formen und Tonwerten fest, als Vorbereitung für den Blockout.
resources:
