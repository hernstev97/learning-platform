id: blickfuehrung
title: Komposition und Blickführung in der Draufsicht
level: 1
minutes: 90
summary: Womit du in einem Top-down-Bild den Blick lenkst – Tonwert, Sättigung, Licht, Bewegung, Linien und Rahmung –, warum ein Bildschirm einen Hauptpunkt und Ruhe drumherum braucht und was die Kamera mit Drag-Rändern vom Blick voraus übrig lässt.
place: unterwegs
goals:
  - Du nennst die Mittel, die in der Draufsicht den Blick lenken, und erklärst, warum der Tonwert vor der Farbe kommt.
  - Du baust für einen Bildschirm eine Hierarchie aus einem Hauptpunkt und wenigen Nebenpunkten und erkennst Lockvögel, die mit ihm konkurrieren.
  - Du prüfst ein Bild mit Graustufen und zusammengekniffenen Augen darauf, ob der Hauptpunkt übrig bleibt.
  - Du rechnest aus, wie weit der Spieler mit den Drag-Rändern der Godot-Kamera voraussieht.
  - Du planst Blickführung im Blockout zuerst nur in Tonwerten und hältst sie getrennt von der Ausgestaltung.
resources:
  - title: The Level Design Book · Wayfinding
    url: https://book.leveldesignbook.com/process/blockout/wayfinding
  - title: Jason Mitchell, „Connecting Visuals to Gameplay at Valve“ (MIGS 2008, Folien)
    url: https://cdn.akamai.steamstatic.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf
  - title: The Level Design Book · Massing (Hierarchy, Readability)
    url: https://book.leveldesignbook.com/process/blockout/massing
  - title: Godot Docs · Camera2D
    url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html
lesson: |
  Halt ein Spiel an, sobald ein neuer Raum im Bild ist, und frag dich, wohin dein Blick zuerst ging. Meist weißt du es, bevor du sagen kannst, warum. Das Level Design Book beschreibt eine solche Stelle aus Half-Life 2. Wenn Spieler den Bahnhof am Anfang verlassen, sehen sie die Stadt mit dem Turm der Zitadelle in der Mitte. Damit sie ihn bemerken, richteten Valves Level-Designer einen Türrahmen auf den Platz aus, und im selben Moment fliegt ein Schwarm Vögel auf ([Level Design Book, Wayfinding](https://book.leveldesignbook.com/process/blockout/wayfinding#signage-theory)).

  Rahmen, Bewegung, ein Ziel in der Bildmitte: Die Stelle ist komponiert. In einem Spiel in der Draufsicht hast du dieselben Mittel, aber einen anderen Rahmen. Es gibt keinen Horizont und keinen Blick nach oben, nur den Bildschirm, der mit der Figur mitfährt. Dieses Modul zeigt, womit du in diesem Rahmen den Blick lenkst, wie du einen Hauptpunkt gegen Lockvögel und Rauschen schützt und was die Kamera davon übrig lässt. Es baut auf [Level lesen: Absicht, Hinweis, Verhalten](/level-design/raum-lesen) auf. Ein Blickziel ist ein Hinweis; ob er wirkt, zeigt erst das Verhalten der Spieler.

  ## Drei Regeln für den Blick und was die Draufsicht daraus macht

  Aus dem Beispiel leitet das Level Design Book drei Leitlinien für die Komposition einer Szene ab:

  1. „Players don’t look upwards unless something draws their eye.“
  2. „Players look in the direction they are moving.“
  3. „Players focus on contrast (in color, shape, lighting, and movement.)“

  Die Regeln stammen aus einem Spiel in der Ich-Perspektive. Was davon in der Draufsicht gilt, ist eine Übertragung dieses Kurses, keine Aussage des Buchs.

  - **Die erste Regel verschiebt sich.** Nach oben schaut in der Draufsicht niemand, die Kamera ist fest. Die Grenze des Blicks ist der Bildrand. Was außerhalb liegt, sieht der Spieler nicht, so auffällig es auch ist.
  - **Die zweite Regel wird schärfer.** Wer nach rechts läuft, schaut nach rechts, und dort zeigt das Bild bei mittiger Figur 160 Pixel, nach oben nur 90. Was den Blick lenken soll, muss in Laufrichtung im Bild sein.
  - **Die dritte Regel gilt unverändert.** Kontrast in Helligkeit und Farbe, in Form, Licht und Bewegung zieht den Blick. Sie trägt den Rest dieses Moduls.

  Eine Einschränkung gehört dazu. Das Buch ordnet Hilfen zur Orientierung nach einer geschätzten Sicherheit, „a non-scientific estimate“, wie viele Spieler sie bemerken und nutzen. Licht und Farbe stehen dort bei 40 Prozent, Komposition und Sichtlinien bei 35 ([Wayfinding aids](https://book.leveldesignbook.com/process/blockout/wayfinding#coarse-35-60-certainty)). Blickführung ist ein Vorschlag an den Spieler, kein Befehl. Sie macht die Absicht wahrscheinlicher, und ob sie reicht, zeigt der Playtest.

  ## Tonwert vor Farbe: Kontrast, der auch in Graustufen trägt

  Der stärkste Kontrast ist der Unterschied in der Helligkeit, der **Tonwert**. Wie man Tonwerte sieht und plant, behandelt [Licht, Schatten und Tonwerte](/pixelart/licht-werte) mit einer Skala in neun Stufen, 1 hell bis 9 fast schwarz. Dieser Kurs nutzt dieselbe Skala für **Tonwertkarten**. Das sind Rasterkarten, in denen jede Ziffer den Tonwert eines Tiles angibt, keinen Wegpunkt.

  ```text
  9999999999
  9777777779
  9777777739
  9777777779
  9999999999
  ```

  Wände in Stufe 9, Boden in Stufe 7, ein Tile in Stufe 3: Das Auge findet die 3 sofort, mit oder ohne Farbe. Zwei Farben mit gleichem Tonwert dagegen, etwa ein Rot und ein Grün, verschmelzen in Graustufen zu einer Fläche ([Prüfen, überarbeiten, dokumentieren](/pixelart/lesbarkeit-pruefen)). Farbe ist deshalb der zweite Kanal. Sie kann den Tonwert verstärken, aber nicht ersetzen. Das Level Design Book nennt als Beispiel für Farbkontrast eine „bright blue door in a dark orange landscape“. Diese Tür unterscheidet sich zweimal, kühl gegen warm und hell gegen dunkel.

  Auch **Sättigung** trennt. Valve hielt bei Team Fortress 2 die Umgebung blasser als die Figuren. Jason Mitchells Folie zur Umgebung nennt „Team distinction through material hue/value/saturation“ und „Desaturated relative to players“ ([MIGS 2008, Folien](https://cdn.akamai.steamstatic.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf)). Was auffallen soll, darf satt sein, weil der Rest es nicht ist. Eine satte Farbe überall macht keine Stelle wichtig.

  > [!MERKE] Tonwert zuerst
  > Plane den Kontrast in Helligkeit. Was in Graustufen nicht heraussticht, sticht für viele Augen auch in Farbe nicht genug heraus.

  ## Licht, Bewegung und Linien

  **Licht** ist Tonwert mit einem Grund. Für Left 4 Dead nennt Mitchell beim Licht in dunklen Szenen ausdrücklich „Aid navigation“ und „Players tend to follow the light“. Das Level Design Book listet bei Licht und Farbe den „path implied by light placement (Left 4 Dead)“ und „visibly lit entrances and exits“. In der Draufsicht heißt das: ein beleuchteter Durchgang in einem dunklen Raum, eine Reihe Laternen entlang eines Wegs, ein heller Fleck am Ende eines Gangs. Wie du Licht und Schatten in Pixelart zeichnest, steht im Pixelart-Kurs. Hier zählt, wo es liegt.

  **Bewegung** zählt nach der dritten Regel ebenso. In Half-Life 2 sind es die Vögel. Das Buch führt Tiere und Figuren, denen man folgt, als subtile Hilfe, „birds in Half-Life 2“ steht als Beispiel. In einem Standbild aus lauter ruhigen Tiles fällt eine bewegte Stelle auf: eine flackernde Flamme, Wasser, ein Tier. Daraus folgt auch das Gegenteil. Bewegt sich überall etwas, etwa animiertes Wasser über die halbe Karte, verliert Bewegung ihre Wirkung. Wie solche Schleifen im Spiel getaktet und gezeichnet werden, ist Thema des Animationskurses ([Animation im Spiel](/animation/animation-im-spiel)); hier zählt nur, wo sie stehen.

  **Linien** führen den Blick entlang ihrer Richtung: ein Weg aus anderem Boden, ein Zaun, ein Fluss, eine Kante zwischen zwei Bodenarten, eine Reihe Säulen. Das Buch nennt solche Führung „ground composition“ mit Beispielen wie „train tracks (Team Fortress 2)“ und betont die „clear gameplay function“. Eine Linie führt dorthin, wo sie endet. Endet sie an einer leeren Wand, kommt der Blick dort an und findet nichts.

  Dan Taylor fasst die Mittel für das Ziel eines Levels in einem Satz zusammen: Ziele sollen „visually distinct“ sein, „using location, form, lighting and animation to make them clearly stand out from their surroundings“ ([Ten Principles, Teil 1](https://www.gamedeveloper.com/design/ten-principles-of-good-level-design-part-1-)). Lage, Form, Licht und Bewegung, und zwar gegen die Umgebung.

  ## Rahmung und Hierarchie: ein Hauptpunkt, wenige Nebenpunkte

  **Rahmung** heißt, einen Punkt mit Dunkel oder Masse zu umgeben, damit er allein steht. Der Türrahmen in Half-Life 2 tut das, und das Buch nennt unter Komposition auch „window framing a specific view“. In der Draufsicht rahmt eine Lücke in einer Hecke, ein Tor zwischen zwei Pfeilern, ein Ring aus Bäumen um eine Lichtung oder ein dunkler Gang, der auf einen hellen Fleck zuläuft.

  **Hierarchie** heißt, dass nicht alles gleich wichtig ist. Das Level Design Book schreibt über Baumassen: „A bigger mass with a more unusual shape will feel more important than surrounding masses.“ ([Massing, Hierarchy](https://book.leveldesignbook.com/process/blockout/massing#hierarchy)) Für einen Bildschirm in der Draufsicht nutzt dieser Kurs eine Faustregel:

  | Ebene | Anzahl | Kontrast | Beispiel |
  | --- | --- | --- | --- |
  | Hauptpunkt | einer | der stärkste im Bild | der Ausgang, den die Absicht meint |
  | Nebenpunkte | höchstens zwei | deutlich schwächer | Seitengang, Fundstück |
  | Ruhe | der Rest | enger Tonwertbereich | Boden, Wände |

  Ruhe ist kein verschenkter Platz. Sie macht den Hauptpunkt erst sichtbar. Der Pixelart-Kurs zeigt mit großen Wertegruppen, warum ein Boden in einem engen Bereich die Figur trägt ([Licht, Schatten und Tonwerte](/pixelart/licht-werte)).

  Ein **Lockvogel** ist ein auffälliger Punkt ohne Bedeutung, etwa eine Fackel, die heller ist als der Ausgang. Das Buch erinnert daran, dass „everything in the game is a wayfinding aid“. Auch der Lockvogel ist also ein Hinweis, nur ein falscher. Spieler gehen ihm nach, finden nichts und lernen, dem Licht in diesem Spiel weniger zu trauen.

  > [!PRAXIS] Valve vereinfacht das Licht in Left 4 Dead
  > Mitchells Folien zeigen ein frühes Bild aus der Produktion von Left 4 Dead mit der Überschrift „Too many areas of contrast“ und daneben die fertige Fassung als „Simplified lighting“. Weniger helle Stellen, und jede davon hat einen Grund. Dazu trennt Valve mit Nebel und Partikeln Vordergrund und Hintergrund, „Separate foreground from background“ ([MIGS 2008, Folien](https://cdn.akamai.steamstatic.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf)). Das Studio hat Kontrast also weggenommen, damit der übrige wirkt.

  ## Visuelles Rauschen und der Unschärfetest

  **Visuelles Rauschen** entsteht, wenn viele kleine Kontraste gleich stark sind. Kein Punkt gewinnt, der Blick springt umher. Das Level Design Book unterscheidet lesbare Karten, die „relatively simple shapes into clear distinct groups“ ordnen, von wenig lesbaren mit „fragmented massing that feels like camouflage“ ([Massing, Readability](https://book.leveldesignbook.com/process/blockout/massing#readability)). Es fügt hinzu, dass wenig Lesbarkeit nicht schlecht sein muss. Für einen versteckten Durchgang willst du genau diese Tarnung, an dieser einen Stelle.

  Zwei Proben zeigen dir die Hierarchie eines Bildes in Sekunden, beide am Handy:

  - **Graustufen.** Screenshot machen und in der Galerie-App einen Schwarz-Weiß-Filter anlegen, oder den Graustufenmodus der Bedienungshilfen einschalten. Bleibt der Hauptpunkt der hellste oder dunkelste Fleck gegen seine Umgebung?
  - **Unschärfe.** Augen zusammenkneifen oder das Handy auf Armlänge halten. Details verschwinden, die großen Kontraste bleiben. Was übrig bleibt, ist deine tatsächliche Hierarchie.

  Bleibt nach dem Zusammenkneifen der Lockvogel übrig und nicht der Ausgang, ist der Lockvogel dein Hauptpunkt, egal was in der Notiz steht. Beide Proben stammen aus dem Pixelart-Kurs, die Graustufenprobe aus [Prüfen, überarbeiten, dokumentieren](/pixelart/lesbarkeit-pruefen), das Zusammenkneifen aus [Licht, Schatten und Tonwerte](/pixelart/licht-werte). Sie prüfen das Bild, nicht das Spielen. Ob Spieler dem Hauptpunkt folgen, zeigt nur der Playtest.

  > [!TIP] Erst das Standbild, dann der Weg
  > Prüf jeden Bildschirm, den ein Spieler beim Betreten zuerst sieht, einmal als Standbild mit beiden Proben. Das dauert eine Minute und findet Lockvögel, bevor ein Tester an ihnen hängen bleibt.

  ## Der Bildausschnitt: Figur in der Mitte, Kamera mit Drag-Rändern

  Hängt eine `Camera2D` an der Figur, hält sie die Figur standardmäßig in der Bildmitte (`anchor_mode` „Drag Center“). Dann gilt, was [Level lesen](/level-design/raum-lesen) ausgerechnet hat. Bei 320 × 180 Pixeln Spielbild, einem Platzhalter wie alle Werte hier, siehst du zur Seite 160 Pixel voraus, nach oben 90.

  Schaltest du `drag_horizontal_enabled` oder `drag_vertical_enabled` ein, folgt die Kamera erst, wenn die Figur einen Drag-Rand erreicht. Die Ränder `drag_left_margin`, `drag_right_margin`, `drag_top_margin` und `drag_bottom_margin` stehen auf 0,2. Laut Doku heißt 1, dass sich die Kamera erst am Bildrand bewegt ([Camera2D, drag_right_margin](https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-drag-right-margin)). Der Wert ist also ein Anteil am halben Bild. Nachgemessen mit Godot 4.7.2 in einem Bild von 320 × 180 Pixeln: Läuft die Figur mit eingeschaltetem Drag nach rechts, steht sie 32 Pixel rechts der Bildmitte, und die Kamera zieht mit ihr.

  ```python run
  # Platzhalter
  BILD_B, BILD_H = 320, 180
  TILE = 16
  # Standard in Godot 4.7
  DRAG = 0.2

  def voraus(halb):
      return halb - DRAG * halb

  seite = voraus(BILD_B / 2)
  oben = voraus(BILD_H / 2)
  print(seite, seite / TILE)
  print(oben, oben / TILE)
  ```

  Mit Drag siehst du beim Laufen nach rechts noch 128 Pixel voraus, 8 Tiles, und 192 Pixel hinter dir. Nach oben bleiben 72 Pixel, viereinhalb Tiles. Drag zeigt mehr von dem, woher du kommst, und weniger von dem, wohin du gehst. Auch `position_smoothing_enabled` lässt die Kamera der Figur hinterherlaufen. Willst du das Gegenteil, eine Kamera, die in Laufrichtung vorausschaut, brauchst du ein Skript, das `offset` verschiebt. Das Skript darf dir eine KI schreiben; wie weit die Kamera vorausschaut, entscheidest du. Weitere Kamera-Techniken für große Gegner stehen in [Große Kreaturen als Bosse](/combat/grosse-gegner).

  Für die Komposition heißt das: Ein Bildschirm in der Draufsicht ist kein festes Bild. Der Ausschnitt wandert mit. Plane den Hauptpunkt so, dass er im Bild ist, wenn der Spieler sich entscheiden muss, und rechne dafür mit dem Blick voraus deiner Kamera, nicht mit dem ganzen Bildschirm.

  ## Blickführung im Blockout: erst Tonwerte, dann Ausgestaltung

  Ein Blockout ist ein Level aus grauen Formen und flachen Platzhalter-Tiles. Er prüft das Layout, nicht die Grafik ([Blockout in Godot](/level-design/blockout)). Blickführung gehört schon hinein, aber nur als Tonwert. Vier bis fünf flache Werte reichen: Boden, Wand, Hindernis, Hauptpunkt, Nebenpunkt. Damit testest du, ob die Hierarchie trägt, bevor ein einziges fertiges Tile existiert. Fertige Pixelart brauchst du dafür nicht.

  Die Ausgestaltung kommt später und darf die Hierarchie nicht umwerfen. Das Level Design Book beschreibt Environment Art als „the cosmetic decoration of a level or game world, while preserving its core functionality and gameplay“ und rät, für den Art Pass auf einen „mature blockout“ zu warten ([Environment Art](https://book.leveldesignbook.com/process/env-art)). Wie du dabei Hinweise erhältst, zeigt [Vom Blockout zur Ausgestaltung](/level-design/ausgestaltung). Wie Markierungen eine eigene visuelle Sprache bilden, behandelt [Umgebung als Information](/level-design/umgebung-informiert).

  > [!NOTE] Deine Komposition
  > Welche Stelle eines Bildschirms der Hauptpunkt ist, folgt aus deiner Absicht. Eine KI darf dir ein Skript für eine Vorlaufkamera oder für Graustufen-Screenshots schreiben. Wohin der Blick gehen soll, legst du fest.

  > [!INTERVIEW] „Wie lenkst du in einem Top-down-Raum den Blick zum Ausgang, ohne einen Pfeil zu malen?“
  > Ich lege zuerst fest, welcher Ausgang gemeint ist, und gebe ihm den stärksten Tonwertkontrast im Bild, oft mit Licht. Boden und Wände halte ich in einem engen Bereich, damit nichts mit ihm konkurriert, und ich suche gezielt nach Lockvögeln, die heller sind oder sich bewegen. Dann prüfe ich das Standbild in Graustufen und mit zusammengekniffenen Augen und rechne nach, ob der Ausgang mit der eingestellten Kamera rechtzeitig im Bild ist. Ob es wirkt, zeigt ein Playtest ohne Erklärung. Erst wenn das nicht reicht, nehme ich stärkere Mittel wie Fundstücke oder Markierungen.

  ## Häufige Fehler

  - **Farbe statt Tonwert.** Eine rote Tür in grüner Wiese mit gleichem Tonwert verschwindet in Graustufen. Hell oder dunkel zuerst, Farbe danach.
  - **Zwei Hauptpunkte.** Ausgang und Truhe gleich hell, und der Spieler wählt per Zufall. Entscheide, was zuerst kommt, und nimm dem anderen Kontrast weg.
  - **Ein Lockvogel.** Die hellste Stelle im Bild ist eine Fackel ohne Bedeutung. Der Unschärfetest findet sie.
  - **Rauschen.** Jedes Tile hat ein eigenes Detail, der Boden springt über die ganze Skala. Ruhe ist die Voraussetzung für einen Hauptpunkt.
  - **Hauptpunkt zu spät im Bild.** Du planst mit 10 Tiles Blick voraus, die Kamera mit Drag zeigt 8. Der Ausgang erscheint später als gedacht, und dem Spieler bleibt weniger Zeit, sich zu entscheiden.
  - **Linien ins Leere.** Ein Weg zeigt auf eine Wand, der Blick kommt an und findet nichts.
  - **Blickführung erst in der Ausgestaltung.** Wer Kontrast erst mit der fertigen Grafik plant, testet im Blockout eine andere Hierarchie als die, die später im Spiel steht.

  ## Zusammenfassung

  - In der Draufsicht ist der Bildrand die Grenze des Blicks. Spieler schauen in Laufrichtung und folgen Kontrast in Helligkeit, Farbe, Form, Licht und Bewegung.
  - Der Tonwert kommt vor der Farbe. Sättigung trennt, wenn die Umgebung blasser ist als das Wichtige.
  - Licht, Bewegung und Linien führen den Blick. Eine Linie führt dorthin, wo sie endet.
  - Ein Bildschirm braucht einen Hauptpunkt, höchstens zwei Nebenpunkte und Ruhe drumherum. Ein Lockvogel ist ein falscher Hinweis.
  - Graustufen und Unschärfe zeigen die tatsächliche Hierarchie eines Standbilds. Ob Spieler ihr folgen, zeigt der Playtest.
  - Drag-Ränder von 0,2 kürzen den Blick voraus von 160 auf 128 Pixel zur Seite und von 90 auf 72 nach oben.
  - Im Blockout planst du Blickführung mit wenigen flachen Tonwerten. Die Ausgestaltung muss diese Hierarchie erhalten.
exercises:
  - id: drei-regeln-draufsicht
    type: choice
    title: Was bleibt von den drei Regeln?
    prompt: |
      Das Level Design Book nennt drei Leitlinien für den Blick, abgeleitet aus Half-Life 2, einem Spiel in der Ich-Perspektive. Welche Aussagen über ihre Übertragung auf die Draufsicht stimmen?
    options:
      - text: „Players look in the direction they are moving“ gilt weiter. Der Blick voraus ist durch den Bildausschnitt begrenzt.
        correct: true
        why: Wer läuft, schaut in Laufrichtung. In der Draufsicht reicht der Blick dorthin nur bis zum Bildrand, bei mittiger Figur 160 Pixel zur Seite und 90 nach oben.
      - text: „Players focus on contrast“ gilt unverändert, für Helligkeit, Farbe, Form, Licht und Bewegung.
        correct: true
        why: Kontrast wirkt in jeder Perspektive. Die Mittel dieses Moduls hängen alle an dieser Regel.
      - text: „Players don’t look upwards“ gilt in der Draufsicht genauso, deshalb sehen Spieler die obere Bildhälfte kaum.
        correct: false
        why: In der Draufsicht gibt es kein Nach-oben-Schauen, die Kamera ist fest. Die obere Bildhälfte ist im Bild wie die untere. Die Grenze des Blicks ist der Bildrand.
      - text: Die Regeln sagen voraus, dass Spieler dem stärksten Kontrast auch folgen.
        correct: false
        why: Die Regeln beschreiben, wohin der Blick geht. Ob der Spieler dorthin läuft, ist eine zweite Frage. Das Buch schätzt solche Hilfen auf 35 bis 40 Prozent und verweist auf den Playtest.
    explanation: |
      Die zweite und dritte Regel tragen in die Draufsicht, die erste verschiebt sich zum Bildrand. Alle drei beschreiben den Blick, nicht das Verhalten. Zwischen „hat es gesehen“ und „ist hingegangen“ liegt die Lücke, die du im Playtest misst.
    hints:
      - Zwei Aussagen sind richtig.
      - Kann die Kamera in einem Top-down-Spiel nach oben kippen?
    resources:
      - title: The Level Design Book · Wayfinding
        url: https://book.leveldesignbook.com/process/blockout/wayfinding

  - id: rote-tuer
    type: choice
    title: Die rote Tür in der Wiese
    prompt: |
      Lehrbeispiel: Eine rote Tür steht in einer grünen Wiese. Auf der Neunerskala (1 hell, 9 fast schwarz) haben beide den Tonwert 5. Tester laufen an der Tür vorbei. Welche Änderung hilft am ehesten, ohne die Stelle direkter zu markieren?
    options:
      - text: Die Tür auf Tonwert 2 aufhellen oder die Wiese rund um die Tür auf 7 abdunkeln.
        correct: true
        why: Dann trennt sie der Tonwert, und sie fällt auch in Graustufen auf. Farbe verstärkt den Kontrast danach nur noch.
      - text: Das Rot der Tür satter machen.
        correct: false
        why: Sättigung ändert den Tonwert nicht. In Graustufen bleibt die Tür so hell wie die Wiese, und auch farbig bleibt der Abstand klein.
      - text: Mehr rote Blumen in der Wiese verteilen, damit Rot als Farbe des Abschnitts auffällt.
        correct: false
        why: Jede rote Blume ist ein weiterer Lockvogel. Die Tür verliert ihr einziges Merkmal.
      - text: Einen leuchtenden Pfeil über die Tür setzen.
        correct: false
        why: Das ist eine stärkere, direktere Hilfe. Das Level Design Book rät, mit subtilen Mitteln zu beginnen und stärkere erst nach dem Playtest zu nehmen. Hier fehlt zuerst der Kontrast.
    explanation: |
      Gleich helle Farben verschmelzen in Graustufen und schwächen sich auch farbig gegenseitig. Die erste Frage ist deshalb, wie weit Tür und Umgebung auf der Skala auseinanderliegen. Erst wenn der Tonwert trägt und Tester die Tür trotzdem nicht finden, ist eine stärkere Markierung dran.
    hints:
      - Was sieht man von der Tür, wenn man die Farbe wegnimmt?
    resources:
      - title: The Level Design Book · Wayfinding aids
        url: https://book.leveldesignbook.com/process/blockout/wayfinding#wayfinding-aids

  - id: tonwerte-planen
    type: order
    title: Ein Bildschirm in Tonwerten
    prompt: |
      Du planst die Blickführung für einen Bildschirm im Blockout. Bring die Schritte in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Schreib die Absicht für diesen Bildschirm in einem Satz auf.
      Leg fest, welche Stelle der Hauptpunkt ist.
      Leg Boden und Wände in einen engen Tonwertbereich.
      Gib dem Hauptpunkt den stärksten Kontrast im Bild.
      Setz höchstens zwei Nebenpunkte mit schwächerem Kontrast.
      Prüf das Standbild in Graustufen und mit zusammengekniffenen Augen.
      Lass jemanden ohne Erklärung spielen und schau, wohin er geht.
    alternatives:
      - [1, 3, 2, 4, 5, 6, 7]
    explanation: |
      Der Hauptpunkt folgt aus der Absicht, deshalb steht der Satz am Anfang. Ob du zuerst den Hauptpunkt wählst oder zuerst den ruhigen Grund festlegst, ist gleichwertig. Der stärkste Kontrast hängt aber von beiden ab, und Nebenpunkte ordnest du dem Hauptpunkt unter. Die Proben am Standbild sind schnell und billig, deshalb kommen sie vor dem Playtest. Erst der Playtest zeigt, ob Spieler dem Blick auch folgen.
    hints:
      - Woraus folgt, welche Stelle der Hauptpunkt ist?
    resources:
      - title: The Level Design Book · Massing, Hierarchy
        url: https://book.leveldesignbook.com/process/blockout/massing#hierarchy

  - id: lockvogel-modell
    type: output
    title: Wer gewinnt den Blick?
    prompt: |
      Lehrbeispiel: eine Tonwertkarte mit vier Zeilen zu je fünf Tiles, Neunerskala (1 hell, 9 fast schwarz). Die 3 in Zeile 2 ist der Ausgang, die 1 in Zeile 1 eine Laterne ohne Bedeutung, Zeilen und Spalten gezählt ab 0. Das Modell gibt für jedes Tile, das nicht Boden ist, Zeile, Spalte und den Abstand zum mittleren Tonwert der Karte aus. Was gibt es aus?
    lang: python
    code: |
      # Neunerskala: 1 hell, 9 dunkel
      karte = ["77777",
               "71777",
               "77737",
               "77777"]
      werte = []
      for zeile in karte:
          werte += map(int, zeile)
      mittel = sum(werte) / len(werte)
      for i, w in enumerate(werte):
          if w != 7:
              d = abs(w - mittel)
              print(i // 5, i % 5, d)
    expected: |
      1 1 5.5
      2 3 3.5
    hints:
      - 18 Tiles mit 7, dazu eine 1 und eine 3. Die Summe ist 130, der Mittelwert 6,5.
      - "`i // 5` ist die Zeile, `i % 5` die Spalte."
    explanation: |
      Der Mittelwert liegt bei 6,5. Die Laterne ist 5,5 Stufen davon entfernt, der Ausgang 3,5. Die Laterne ist der stärkste Kontrast. Es ist grob: Es vergleicht nur mit dem Durchschnitt und kennt weder Größe noch Licht, Bewegung oder Lage im Bild. Für einen ersten Blick reicht es aber. Liegt ein Lockvogel weiter vom Grund entfernt als dein Hauptpunkt, gewinnt er den Blick, und du dunkelst ihn ab oder hellst den Ausgang auf.
    resources:
      - title: The Level Design Book · Wayfinding, Psychology
        url: https://book.leveldesignbook.com/process/blockout/wayfinding#psychology

  - id: vorlauf-drag
    type: output
    title: Breite Drag-Ränder
    prompt: |
      Die Kamera hat seitlich breitere Drag-Ränder als oben, rechts 0,5 und oben 0,2. Alle Werte sind Platzhalter. Was gibt das Modell aus?
    lang: python
    code: |
      BREITE, HOEHE = 320, 180
      TILE = 16

      def voraus(halb, drag):
          return halb - drag * halb

      rechts = voraus(BREITE / 2, 0.5)
      oben = voraus(HOEHE / 2, 0.2)
      print(rechts, rechts / TILE)
      print(oben, oben / TILE)
    expected: |
      80.0 5.0
      72.0 4.5
    hints:
      - Ein Drag-Rand ist ein Anteil am halben Bild. Die Hälfte von 160 Pixeln ist 80.
    explanation: |
      Mit `drag_right_margin = 0.5` läuft die Figur 80 Pixel aus der Mitte, bevor die Kamera folgt. Beim Laufen nach rechts steht sie dann dort, und voraus bleiben 80 Pixel, 5 Tiles. Nach oben mit 0,2 bleiben 72 Pixel, viereinhalb Tiles. Breite Ränder beruhigen die Kamera bei kleinen Bewegungen, kosten aber Blick voraus. Ob dir Ruhe oder Vorlauf wichtiger ist, entscheidest du.
    resources:
      - title: Godot Docs · Camera2D, drag_right_margin
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-drag-right-margin

  - id: sekunden-voraus
    type: output
    title: Wie viel Zeit bleibt?
    prompt: |
      Mit den Standard-Drag-Rändern von 0,2 siehst du beim Laufen nach rechts 128 Pixel voraus. Die Figur läuft 90 Pixel pro Sekunde (Platzhalter). Wie viele Sekunden vergehen, bis sie die Stelle erreicht, die gerade am rechten Bildrand erscheint? Runde auf eine Nachkommastelle und antworte mit der Zahl.
    lang: text
    code: |
      Sekunden = Pixel / (px/s)
      Pixel    128
      px/s     90
    expected: |
      1.4
    accept: ["1,4", "1,4 s", "1.4 s", "1,4 Sekunden"]
    explanation: |
      128 / 90 = 1,42 Sekunden. Ohne Drag wären es 160 / 90 = 1,78, also fast zwei Sekunden. Der Unterschied von gut einer Drittelsekunde klingt klein, aber er ist die Zeit, in der ein Spieler einen Abzweig bemerkt und sich entscheidet. Liegt ein Hauptpunkt an einer Stelle, an der er schnell reagieren soll, rechne mit dem kürzeren Wert.

  - id: begriffe-blick
    type: gap
    title: Fünf Begriffe zum Blick
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Die Helligkeit einer Fläche ohne Farbe heißt ⟦Tonwert⟧. Die Stelle eines Bildschirms, zu der der Blick zuerst gehen soll, ist der ⟦Hauptpunkt⟧. Ein auffälliger Punkt ohne Bedeutung, der den Blick abzieht, ist ein ⟦Lockvogel⟧. Viele kleine, gleich starke Kontraste ergeben visuelles ⟦Rauschen⟧. In Godot lassen die ⟦Drag-Ränder⟧ der Kamera die Figur aus der Bildmitte laufen, bevor die Kamera folgt.
    gaps:
      - label: Helligkeit
        hint: Die Pixelart-Skala hat davon neun Stufen.
        accept: ["Helligkeitswert", "Wert", "Value"]
      - label: wichtigste Stelle
        hint: Es gibt pro Bildschirm genau einen davon.
        accept: ["Blickpunkt", "Fokuspunkt", "Blickziel", "Schwerpunkt", "Fokus"]
      - label: falscher Hinweis
        hint: Ein Wort aus der Jagd.
        accept: ["Köder", "Ablenkung", "Decoy", "Störer"]
      - label: zu viel von allem
        hint: Ein Begriff aus der Bild- und Tontechnik.
        accept: ["Bildrauschen", "Noise", "Unruhe"]
      - label: Kamera-Einstellung
        hint: Englisch heißen sie „drag margins“.
        accept: ["Drag Ränder", "Drag-Margins", "Drag Margins", "drag margins", "Ränder", "Drag-Margin"]
    explanation: |
      Tonwert, Hauptpunkt und Ruhe bilden die Hierarchie eines Bildes. Lockvogel und Rauschen sind die beiden Arten, sie zu stören: ein einzelner falscher Punkt oder zu viele gleich laute. Die Drag-Ränder gehören dazu, weil sie bestimmen, wie viel vom Bild in Laufrichtung überhaupt zu sehen ist.
    resources:
      - title: Godot Docs · Camera2D
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html

  - id: laterne-zieht
    type: bug
    title: Der Blick geht woandershin
    prompt: |
      Lehrbeispiel: Tonwertkarte eines Bildschirms, 20 × 11 Tiles, Neunerskala (1 hell, 9 fast schwarz). Wände sind 9, der Boden 7. Absicht: Der Blick soll zuerst zum Ausgang am rechten Rand gehen, Tonwert 3 in Zeile 6. In Tests schauen fast alle zuerst woandershin. Eine Zeile enthält, was dem Ausgang den Blick stiehlt. Finde sie.
    lang: text
    code: |
      99999999999999999999
      97777777777777777779
      97777777777777777779
      97717777777777777779
      97777777777777777779
      97777777777777777773
      97777777777777777779
      97777777777777777779
      97777777777777777779
      97777777777777777779
      99999999999999999999
    lines: [4]
    explanation: |
      In Zeile 4 steht links eine 1, sechs Stufen heller als der Boden. Der Ausgang mit 3 ist nur vier Stufen heller. Die 1 ist der stärkste Kontrast im Bild und damit der Hauptpunkt, ob du willst oder nicht. Abhilfe ist eine von zwei Änderungen: die 1 abdunkeln, etwa auf 6, oder den Ausgang heller machen als alles andere. Welche du nimmst, hängt daran, ob die helle Stelle links etwas bedeuten soll.
    hints:
      - Such die Ziffer, die am weitesten von 7 entfernt ist.

  - id: wasser-am-rand
    type: bug
    title: Ein Blickplan mit einer Zeile zu viel
    prompt: |
      Lehrbeispiel: Blickplan für einen Bildschirm, Neunerskala (1 hell, 9 fast schwarz). Tester schauen zuerst nach unten statt zum Tor. Eine Zeile widerspricht der Hierarchie. Finde sie.
    lang: prose
    code: |
      Absicht: Der Spieler soll den Ausgang oben links zuerst sehen.
      Hauptpunkt: Tor oben links, Tonwert 2, einziges Licht im Bild.
      Nebenpunkt: Truhe im Seitengang rechts, Tonwert 5.
      Boden: Tonwerte 6 bis 8, ohne Muster.
      Wände: Tonwert 9, ohne Fenster.
      Wasser: Tonwert 2, animiert, über die ganze Unterkante.
    lines: [6]
    explanation: |
      Das Wasser ist so hell wie das Tor, bewegt sich und läuft über die ganze Breite. Es hat damit zwei Mittel, die das Tor nicht hat: Bewegung und Fläche. Es konkurriert nicht nur mit dem Hauptpunkt, es schlägt ihn. Abhilfe ist ein dunklerer Tonwert für das Wasser, weniger Fläche oder weniger Bewegung. Die übrigen Zeilen passen zur Faustregel: ein Hauptpunkt, ein schwächerer Nebenpunkt, ruhiger Boden und Wände.
    hints:
      - Welche Zeile hat denselben Tonwert wie der Hauptpunkt?
    resources:
      - title: Jason Mitchell, „Connecting Visuals to Gameplay at Valve“ (Folien)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf

  - id: zu-viel-kontrast
    type: explain
    title: Weniger helle Stellen
    prompt: |
      Hier stehen Texte nach den Folien von Jason Mitchells Vortrag über Left 4 Dead (MIGS 2008). Erkläre in drei bis fünf Sätzen, was Valve zwischen dem frühen und dem fertigen Bild geändert hat, warum das der Orientierung hilft und was daraus für einen Raum in der Draufsicht folgt.
    lang: prose
    code: |
      Lighting for Darkness
      • Aid navigation
        • Players tend to follow the light

      Too many areas of contrast – Early production screenshot
      Simplified lighting – Final look
    points:
      - Im frühen Bild gab es zu viele kontrastreiche Stellen, kein Punkt setzte sich durch.
      - Das fertige Bild hat weniger helle Stellen, und jede davon hat einen Grund.
      - Weil Spieler dem Licht folgen, ist jede helle Stelle ein Hinweis. Wenige Lichter heißen wenige, klare Hinweise.
      - In der Draufsicht heißt das, einen Hauptpunkt zu beleuchten und den Rest ruhig zu halten, und dann im Playtest zu prüfen, ob Spieler folgen.
    explanation: |
      Valve hat Licht weggenommen, nicht hinzugefügt. Im frühen Bild konkurrierten viele helle Flächen, und der Blick fand kein Ziel. Im fertigen Bild ist Licht selten und deshalb bedeutsam. Weil Spieler laut Mitchell dem Licht folgen, wird jede helle Stelle zu einem Vorschlag, wohin es geht. Für einen Raum in der Draufsicht folgt daraus die Faustregel dieses Moduls: eine helle Stelle für den Hauptpunkt, wenige schwächere für Nebenpunkte, der Rest in einem engen, dunklen Bereich. Ob Spieler dem Licht auch hier folgen, misst du im Playtest.
    hints:
      - Hat Valve mehr Licht gesetzt oder weniger?
    resources:
      - title: Jason Mitchell, „Connecting Visuals to Gameplay at Valve“ (MIGS 2008, Folien)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf

  - id: drag-erklaeren
    type: explain
    title: Warum sehe ich so wenig voraus?
    prompt: |
      Ein Tester sagt: „Beim Laufen tauchen Abzweige immer erst auf, wenn ich fast daran vorbei bin.“ Die Kamera hat diese Einstellungen. Erkläre in drei bis fünf Sätzen, was sie bewirken und welche Möglichkeiten du hast.
    lang: text
    code: |
      anchor_mode = Drag Center
      drag_horizontal_enabled = true
      drag_left_margin = 0.2
      drag_right_margin = 0.2
      position_smoothing_enabled = true
    points:
      - Mit Drag folgt die Kamera erst, wenn die Figur 20 Prozent des halben Bildes aus der Mitte gelaufen ist. Beim Laufen steht die Figur vor der Mitte.
      - Dadurch schrumpft der Blick voraus zur Seite von 160 auf 128 Pixel, die Glättung lässt die Kamera zusätzlich hinterherlaufen.
      - Möglichkeiten sind Drag aus, kleinere Ränder, eine Vorlaufkamera per `offset` oder Abzweige, die früher ins Bild kommen.
      - Welche Möglichkeit passt, ist eine Designentscheidung, die du mit einem neuen Test prüfst.
    explanation: |
      Die Drag-Ränder lassen die Figur 32 Pixel aus der Mitte laufen, bevor die Kamera folgt. Wer nach rechts läuft, steht deshalb rechts der Mitte und sieht 128 statt 160 Pixel voraus, mit der Glättung noch etwas weniger. Der Tester beschreibt genau das. Ich kann Drag abschalten, die Ränder verkleinern, ein Skript schreiben lassen, das die Kamera per `offset` in Laufrichtung schiebt, oder die Abzweige so legen, dass sie mit diesem Blick rechtzeitig erscheinen. Was davon passt, hängt davon ab, wie ruhig die Kamera sein soll. Ich ändere eine Sache und teste neu.
    hints:
      - Wo steht die Figur im Bild, während sie gleichmäßig nach rechts läuft?
    resources:
      - title: Godot Docs · Camera2D, drag_horizontal_enabled
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-drag-horizontal-enabled
      - title: Godot Docs · Camera2D, offset
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-offset

  - id: screenshot-pruefen
    type: practice
    title: Ein fremdes Bild in Graustufen
    prompt: |
      Mach einen Screenshot aus einem veröffentlichten Top-down-Spiel, an der Stelle, an der ein neuer Raum ins Bild kommt. Stell ihn am Handy auf Graustufen und kneif die Augen zusammen. Notier in höchstens fünf Stichpunkten, was du findest.
    lang: prose
    starter: |
      Spiel und Stelle:
      Hauptpunkt (Mittel):
      Nebenpunkte:
      Lockvögel oder Rauschen:
      Übersteht der Hauptpunkt Graustufen?
    checklist:
      - Spiel und Stelle sind genannt.
      - Du nennst einen Hauptpunkt und das Mittel, das ihn trägt (Tonwert, Licht, Bewegung, Linie, Rahmung).
      - Du nennst höchstens zwei Nebenpunkte.
      - Du sagst, ob es einen Lockvogel oder Rauschen gibt, und wo.
      - Du hast notiert, ob der Hauptpunkt in Graustufen der stärkste Kontrast bleibt.
    explanation: |
      Veröffentlichte Spiele sind gute Lehrer, weil ihre Hierarchie getestet ist. Bleibt der Hauptpunkt in Graustufen stark, trägt ihn der Tonwert. Verschwindet er, trägt ihn Farbe oder Bewegung, und das Standbild zeigt dir, wie viel davon abhängt. Was der Raum vermutlich will, liest du mit der Methode aus [Level lesen](/level-design/raum-lesen).
    hints:
      - Viele Handys haben den Graustufenmodus in den Bedienungshilfen, die Galerie-App einen Schwarz-Weiß-Filter.
    resources:
      - title: The Level Design Book · Massing, Readability
        url: https://book.leveldesignbook.com/process/blockout/massing#readability

  - id: tonwertkarte-eigene
    type: practice
    title: Deine Tonwertkarte
    prompt: |
      Zeichne auf Karopapier eine Tonwertkarte für einen Bildschirm, 20 × 11 Kästchen, ein Kästchen pro Tile, eine Ziffer der Neunerskala pro Kästchen. Nimm einen Abschnitt, an dem du arbeitest, oder eine freie Übungsfläche; was dort steht und welche Stelle der Hauptpunkt ist, entscheidest du. Hier notierst du nur Absicht und Werte in wenigen Zeilen.
    lang: prose
    starter: |
      Absicht (ein Satz):
      Hauptpunkt (Ort, Tonwert):
      Nebenpunkte (Ort, Tonwert):
      Boden und Wände (Tonwerte):
      Ergebnis der Graustufen- und Unschärfeprobe:
    checklist:
      - Die Absicht ist ein Satz, der sagt, was der Spieler zuerst sehen soll.
      - Genau ein Hauptpunkt hat den größten Abstand zum Tonwert des Bodens.
      - Es gibt höchstens zwei Nebenpunkte, beide mit kleinerem Abstand als der Hauptpunkt.
      - Boden und Wände liegen in einem engeren Tonwertbereich, als der Abstand zwischen Hauptpunkt und Boden beträgt.
      - Du hast die Skizze fotografiert, in Graustufen und mit zusammengekniffenen Augen angesehen und das Ergebnis notiert.
    explanation: |
      Die Karte ist ein Blockout auf Papier. Sie prüft die Hierarchie, bevor es Tiles gibt. Was sie nicht prüfen kann, ist der Weg: wann der Hauptpunkt beim Laufen ins Bild kommt und ob Spieler ihm folgen. Dafür baust du den Bildschirm später im [Blockout](/level-design/blockout) nach und lässt jemanden spielen.
    hints:
      - Fang mit Boden und Wänden an. Der Hauptpunkt fällt erst auf, wenn der Grund ruhig ist.
    resources:
      - title: The Level Design Book · Environment Art
        url: https://book.leveldesignbook.com/process/env-art
