id: playtest-methode
title: "Beobachten, ohne zu erklären: Playtests für Level"
level: 2
minutes: 100
summary: Was du bei einem Level-Playtest beobachtest – Weg, Halt, Blickrichtung, Umkehr, Wände entlang, Kanten testen, übersehene Hinweise –, wie du den Weg auf einer Papierkarte mitschreibst, wann du eingreifst, wen du testen lässt und wie du anonyme Notizen unterwegs in die Arten einordnest, mit denen du danach überarbeitest.
place: unterwegs
goals:
  - Du bereitest einen Level-Playtest aus deiner Absichtsnotiz vor, mit Testfragen, einer Karte ohne erwarteten Weg und einer Abbruchregel.
  - Du beobachtest Weg, Halt, Blickrichtung, Umkehr, Laufen an Wänden, Kantentests und übersehene Hinweise und protokollierst sie als Zeit, Ort, Tun und Sagen.
  - Du unterscheidest gewollte Erkundung von Verwirrung anhand deiner Absicht und des Wegs, nicht nach Eindruck.
  - Du entscheidest nach einer vorher festgelegten Regel, wann du eingreifst, und protokollierst den Eingriff so, dass die Daten danach getrennt bleiben.
  - Du wählst frische oder wiederkehrende Tester passend zur Frage, testest in kleinen Runden und notierst anonym.
  - Du ordnest Beobachtungen den Codes „Absicht erfüllt“, „nicht bemerkt“, „falsch gelesen“, „nicht befolgt“ und „unbeabsichtigte Folge“ zu und sortierst sie nach Häufigkeit und Schwere.
resources:
  - title: The Level Design Book · Playtesting
    url: https://book.leveldesignbook.com/process/blockout/playtesting
  - title: Mike Ambinder, „Valve's Approach to Playtesting“ (GDC 2009, Folien)
    url: https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf
  - title: Jakob Nielsen, „Why You Only Need to Test with 5 Users“ (NN/g, 2000)
    url: https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/
  - title: Amy Schade, „Avoid Leading Questions to Get Better Insights from Participants“ (NN/g, 2017)
    url: https://www.nngroup.com/articles/leading-questions/
  - title: Kim Swift, Erik Wolpaw, „A Portal Post-Mortem“ (GDC 2008, Folien)
    url: https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf
lesson: |
  Lehrbeispiel: Eine Freundin spielt deinen Blockout, den Lagerhof aus [Absicht notieren, Layout skizzieren](/level-design/absicht-skizze). Nach 14 Sekunden läuft sie an der Öffnung zur Kammer vorbei. Nach 30 Sekunden steht sie am Tor und läuft gegen die Wand daneben. Nach einer Minute fragt sie: „Muss ich hier irgendwas finden?“ Du willst „rechts!“ sagen. Sagst du es, weißt du nie, ob sie die Kammer allein gefunden hätte.

  Wie man zusieht, ohne zu helfen, steht allgemein in [Testlesen und Playtest: Verständlichkeit beobachten](/narrative/testlesen-playtest): lautes Denken anleiten, Fragen zurückgeben, danach neutral fragen, Beobachtung und Deutung trennen. Lies das zuerst, hier wird es nicht wiederholt. Dieses Modul behandelt, was bei Leveln dazukommt: worauf du achtest, wie du einen Weg auf Papier mitschreibst, wann du eingreifst, wen du testen lässt und wie du deine Notizen unterwegs einordnest, damit du in [Überarbeiten](/level-design/ueberarbeiten) damit arbeiten kannst.

  ## Was du bei einem Level beobachtest

  Das Level Design Book beginnt sein Kapitel mit „A playtest is when someone plays your level, and you watch whether your level works or not.“ Für Tests mit Menschen, die keine Entwickler sind, schreibt es: „Watching their behavior is more important than their feedback“ ([Playtest formats](https://book.leveldesignbook.com/process/blockout/playtesting#playtest-formats)). Verhalten heißt bei einem Level vor allem Bewegung im Raum. Sieben Dinge kannst du sehen:

  - **Weg.** Welche Wegpunkte der Tester in welcher Reihenfolge erreicht.
  - **Halt.** Wo die Figur stehen bleibt und wie lange.
  - **Blickrichtung und Kamera.** Augen siehst du nicht. Du siehst, wohin die Figur schaut und was die Kamera gerade zeigt. Das Level Design Book nennt als Regel: „Players look in the direction they are moving.“ ([Wayfinding, Psychology](https://book.leveldesignbook.com/process/blockout/wayfinding#psychology)). Dreht die Figur kurz zu einer Öffnung, spricht das dafür, dass sie bemerkt wurde. Ein Beweis ist es nicht.
  - **Umkehr.** Der Tester geht zu einem Wegpunkt zurück, an dem er schon war.
  - **An Wänden entlang.** Die Figur läuft dicht an einer Wand entlang. Das Buch nennt Spieler, die so nach Geheimnissen suchen: „wallhugging to try to find secrets“. Es kann auch heißen, dass der Tester keinen Ausgang sieht.
  - **Kanten testen.** Der Tester läuft gegen Wände, Wasser oder Abgründe, um zu prüfen, ob sie wirklich sperren. Dann traut er deinen Zeichen für „blockiert“ nicht ganz ([Umgebung als Information](/level-design/umgebung-informiert)).
  - **Hinweis übersehen.** In der Nähe eines Hinweises hält der Tester nicht, ändert nicht die Richtung und sagt nichts dazu. Ob der Hinweis dabei im Bild war oder im Rest unterging, kannst du nur mit der Skizze und ihren Wegpunkten sagen.

  Dazu kommt, was der Tester sagt. Valve beschreibt lautes Denken mit drei Wörtern: „Unprompted and uncorrected“ ([Ambinder, GDC 2009](https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf)). Du schreibst es wörtlich und kurz auf.

  ## Der Weg auf der Papierkarte

  Nimm zum Test eine Kopie deiner Skizze mit, eine Karte je Tester. Die Nummern der Wegpunkte brauchst du für die Ortsangaben, die Linie deines erwarteten Wegs nicht. Steht sie auf der Karte, zeichnest du leicht nach, was du erwartest, statt was passiert. Mit dem Stift ziehst du den Weg des Testers nach. Wo er hält, setzt du eine kleine Nummer an die Linie, am Rand stehen Nummer und Zeit. Die Zeit nimmst du mit der Stoppuhr des Handys, wie es die Checkliste des Level Design Book vorschlägt: „use stopwatch app to time how long it takes“ ([Prepare for playtest](https://book.leveldesignbook.com/process/blockout/playtesting#id-1.-prepare-for-playtest)).

  Daneben führst du das Beobachtungsprotokoll. Jeder Eintrag hat vier Angaben: Zeit, Ort, was der Spieler tut, was er sagt. Am Handy schreibst du es als kurze Zeilen:

  ```text
  0:05 S    betritt den Hof
  0:09 1    hält 3 s, schaut hoch
  0:14 3    läuft vorbei
  0:22 2    hält 8 s am Tor
  0:30 2    läuft gegen Wand links
  0:40 1    zurück zur Hofmitte
  1:02 1    „Muss ich was finden?“
  ```

  Der Ort ist eine Wegpunktnummer oder ein Zeichen aus der Skizze. Das Tun ist ein Verb mit Ort oder Richtung. Gesagtes steht wörtlich in Anführungszeichen. Deutungen wie „verwirrt“ gehören nicht in diese Zeilen; warum, steht im Narrative-Modul.

  Valve nennt drei Schwächen des direkten Beobachtens: „Presence of observers can bias results“, „Salient event can slant interpretation“ und „Behavior requires interpretation“. Für einen Level-Playtest folgen daraus drei Regeln:

  - **Setz dich schräg hinter den Tester.** Das Level Design Book: „watch from a short distance behind the playtester(s), don’t just breathe over their shoulder.“
  - **Notier auch das Unauffällige.** Jeden Wegpunkt und jeden Halt, nicht nur den Moment, in dem etwas schiefgeht. Sonst hängt deine Auswertung am lautesten Ereignis.
  - **Zeig nicht auf den Bildschirm und frag nicht nach einem Hinweis, solange gespielt wird.** Die Nielsen Norman Group beschreibt eine Sitzung, in der die Frage „What do you think this button does?“ der Testperson erst verriet, dass der Text ein Link war ([Avoid Leading Questions](https://www.nngroup.com/articles/leading-questions/)). Im Level gilt dasselbe: Fragst du nach dem Licht in der Kammer, hat ab dann nicht mehr der Raum es gezeigt, sondern du.

  Am PC kannst du den Weg auch aufzeichnen lassen. In [Playtest am PC: Wege aufzeichnen und vergleichen](/level-design/playtest-godot) schreibt ein Skript alle 0,25 Sekunden die Position der Figur in eine Datei mit der Kopfzeile `t,x,y`, 240 Punkte pro Minute, und zeichnet die Spuren. Das Skript darf dir eine KI schreiben; was du beobachtest und wie du es einordnest, entscheidest du. Die Papierkarte bleibt trotzdem nützlich, denn sie hält fest, was eine Spur allein nicht zeigt: wohin die Figur schaute und was der Tester sagte.

  > [!MERKE] Zeit, Ort, Tun, Sagen
  > Jede Zeile im Protokoll hat diese vier Teile. Gedeutet wird später, und zwar gegen die Absichtsnotiz.

  ## Verwirrung oder gewollte Erkundung?

  Dasselbe Verhalten kann zweierlei bedeuten. Ein Tester, der 40 Sekunden in einer Nische steht und die Wände abläuft, kann verloren sein oder genau das tun, was du wolltest. Die Nielsen Norman Group warnt vor dieser Verwechslung: Was für den Beobachter wie Mühe aussah, kann auch heißen, dass die Person gerade entschied, was wichtig ist, oder dass sie „exploring various areas of the site“ war ([Avoid Leading Questions](https://www.nngroup.com/articles/leading-questions/)). Dan Taylor erinnert daran, dass sogar Verlorensein gewollt sein kann. Es sei in Ordnung, „to create areas where the player feels lost or confused, to create a sense of dramatic tension“ ([Ten Principles, Teil 1](https://www.gamedeveloper.com/design/ten-principles-of-good-level-design-part-1-)).

  Entscheide deshalb nicht nach Eindruck, sondern nach deiner Absichtsnotiz. Schreib vor dem Test hinein, wo Erkundung erwünscht ist, etwa „Nische West: Nebenweg zum Suchen“. Läuft ein Tester dort herum und kommt danach auf den Weg zurück, ist das kein Befund gegen den Raum. Läuft er auf dem Pflichtweg im Kreis, schon.

  Ein paar Anhaltspunkte helfen. Keiner davon ist ein Beweis.

  - **Neue Orte oder alte Schleifen?** Wer erkundet, kommt oft an Stellen, an denen er noch nicht war. Wer verloren ist, wiederholt oft dieselbe Folge von Wegpunkten.
  - **Zurück zum Bekannten.** Kehrt der Tester immer wieder zum Start oder zum letzten Knoten zurück, sucht er einen neuen Anfang.
  - **Kanten testen nahe am Ziel.** Läuft er dort gegen Wände, wo es für ihn weitergehen soll, hat er das Ziel gesehen, aber keinen Weg dorthin.
  - **Gesagtes.** „Was ist da hinten?“ klingt nach Neugier, „Wo war ich schon?“ nach fehlender Orientierung. Du schreibst beides wörtlich auf und deutest es erst danach.

  Umkehrungen je Wegpunkt und Verweildauer je Ort kannst du aus dem Protokoll auszählen. Wie das geht, zeigen die Übungen.

  ## Eingreifen: wann und wie du es notierst

  Das Level Design Book rät, „resist the urge to interrupt the playtest to apologize or explain“, und setzt eine Grenze: „However, if the playtester is definitely stuck or if the level is clearly just broken, then go ahead and intervene.“ ([Observe playtest](https://book.leveldesignbook.com/process/blockout/playtesting#id-3.-observe-playtest-collect-telemetry))

  Leg vor dem Test eine **Abbruchregel** fest, damit du nicht im Moment entscheidest, etwa „kein neuer Wegpunkt seit zwei Minuten“. Die Zahl wählst du selbst. Ohne Regel sitzt du im Zweifel sehr lange daneben. In der Debatte um gelbe Markierungen erzählte Joseph Hunter, Entwickler von Sucker for Love, dass ein Entwickler 20 Minuten schweigend zusehen musste, wie ein Tester einen Weg nach oben suchte ([GamesRadar+](https://www.gamesradar.com/debate-over-resident-evil-4-remakes-yellow-paint-resurfaces-as-devs-explain-just-how-much-players-really-need-realism-is-less-immersive/)).

  Greifst du ein, dann in drei Schritten:

  1. Zuerst die kleinste Hilfe: Gib eine Frage zurück, wie in [Testlesen und Playtest](/narrative/testlesen-playtest) beschrieben.
  2. Reicht das nicht, zeig auf einen Bereich, nicht auf die Lösung, etwa „Schau dich im Hof noch einmal um“.
  3. Notier den Eingriff als eigene Zeile, mit Zeit, Ort und deinem Wortlaut, und zieh auf der Karte einen Querstrich. Alles danach ist „nach Eingriff“.

  ```text
  2:40 1    EINGRIFF „Schau im Hof“
  2:47 3    geht in die Kammer
  ```

  Die Stelle, an der der Tester festhing, wertest du aus. Was er nach dem Eingriff findet, zählt nicht als gefunden, denn gezeigt hast du es. Technische Fehler sind etwas anderes: Die Figur steckt in der Kollision fest, die Kamera springt, das Spiel stürzt ab. Dann hilfst du sofort und notierst „Technik“. Das sagt nichts über die Lesbarkeit deines Raums und kommt auf die Fehlerliste ([Fehler eingrenzen](/godot/fehler-eingrenzen)).

  ## Wer testet: frische und wiederkehrende Tester

  **Frische Tester** haben den Abschnitt noch nie gespielt. Nur sie können zeigen, ob man einen Hinweis bemerkt. Das Level Design Book nennt einen Test mit möglichst wenig Anleitung einen „blind“ Playtest. **Wiederkehrende Tester** kennen den Grundriss. Ihr Weg zeigt Erinnerung, nicht Lesbarkeit. Sie sind gut für andere Fragen: Stört eine Änderung den Fluss? Ist irgendwo etwas kaputt? Wie spielt sich der nächste Abschnitt, wenn der erste bekannt ist? **Du selbst** findest beim eigenen Durchspielen, was das Buch „obvious problems“ nennt: „does the level load? is the doorway wide enough?“. Notier zu jedem Tester, ob er neu ist und welche Fassung er gespielt hat.

  **Wenige pro Runde.** Jakob Nielsen hat für Usability-Tests gezeigt, dass jeder weitere Tester weniger Neues bringt. Er schreibt: „Even 3 users are enough to get an idea of the diversity in user behavior and insight into what's unique and what can be generalized.“ Zugleich warnt er vor „the spurious behavior of a single person“ ([NN/g, 2000](https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/)). Für Level heißt das: drei bis fünf Tester, dann ändern, dann eine neue Runde mit neuen Testern. Was ein einzelner Tester Ungewöhnliches tut, ist eine Notiz, noch kein Befund.

  **Kurz einweisen.** Das Buch rät, Erwartungen zu setzen, „But keep it brief.“ Sag, was der Tester tun soll, wie lange es dauert und dass alles graue Platzhalter sind. Erkläre nicht das Level. Ein Satz wie „Du musst den Hebel finden“ beendet den Test, bevor er beginnt. Das Level Design Book warnt allerdings: „But normies have a hard time playtesting blockouts, you'll likely have to art pass first“. Spielt jemand selten, erklärst du deshalb in der Einweisung kurz die Steuerung und deine Blockout-Vokabel ([Umgebung als Information](/level-design/umgebung-informiert)), also welche Form und welcher Tonwert was bedeutet, aber nie den Weg. Reicht das nicht, testest du mit dieser Person erst nach einer kurzen Ausgestaltung ([Vom Blockout zur Ausgestaltung](/level-design/ausgestaltung)).

  **Anonym notieren.** Schreib keine Namen in Karte und Protokoll, sondern „T1“, „T2“, „T3“, dazu Datum, Fassung und ob neu oder wiederkehrend. Notizen am Handy landen oft in einem Cloud-Speicher; Namen haben dort nichts zu suchen. Nimmst du den Bildschirm auf, dann nur das Spielbild, mit Einverständnis, und lösch die Aufnahme, wenn du sie ausgewertet hast.

  > [!PRAXIS] Valves Freitags-Playtest
  > Bei Valve testen Level-Designer jeden Freitag mit Menschen außerhalb des Teams. Phil Co beschreibt, was das für die Woche bedeutet: „Everything we do during the week is focused on that Friday playtest.“ (zitiert im [Level Design Book](https://book.leveldesignbook.com/process/blockout/playtesting#playtesting-at-valve)). Im Post-Mortem zu Portal steht unter „Playtesting“: „Keeps you objective“ und „Watching a playtest exposes what isn’t working.“ ([Swift und Wolpaw, GDC 2008](https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf)). Feste, kleine Runden halten das Zusehen im Arbeitsablauf, statt es ans Ende zu schieben.

  ## Notizen auswerten: einordnen, zählen, ordnen

  Nach der Sitzung, etwa auf dem Heimweg, gehst du das Protokoll Zeile für Zeile durch und gibst jeder Zeile, die etwas über deinen Raum sagt, einen von fünf Codes:

  | Code | Bedeutung | Beispiel |
  | --- | --- | --- |
  | Absicht erfüllt | Verhalten passt zum Zeichen „klappt“ | geht zuerst zu 2, dann zu 3 |
  | nicht bemerkt | Hinweis war nicht im Bild oder ging im Rest unter | kein Halt, kein Richtungswechsel, kein Wort an 3 |
  | falsch gelesen | bemerkt, aber anders verstanden | hält den Durchgang für Wand |
  | nicht befolgt | verstanden, aber nicht gefolgt | schaut zur Kammer, sagt „später“ |
  | unbeabsichtigte Folge | befolgt, aber anders als gedacht | erreicht A durch eine Lücke |

  Die Kette dahinter, bemerken, lesen, befolgen, Folge, und die Hebel für jede Art behandelt [Überarbeiten](/level-design/ueberarbeiten). Hier zählt der Beleg: Zu jedem Code gehören Zeit und Ort aus dem Protokoll. Kannst du zwischen „nicht bemerkt“ und „falsch gelesen“ nicht entscheiden, schreib „unklar“ und achte in der nächsten Runde an dieser Stelle auf Blickrichtung und Halt.

  Danach fasst du über alle Tester zusammen, je Ort und Code, etwa „3, nicht bemerkt, 3 von 4“. Geordnet wird nach Häufigkeit und Schwere. Eine Skala als Vorschlag: Schwere 3 blockiert den Pflichtweg, Schwere 2 kostet deutlich Zeit oder dreht die Reihenfolge um, Schwere 1 betrifft einen Nebenweg. Valve warnt bei Statistiken: „Averages hide extreme examples“. Halte deshalb den einen Tester, der festhing, neben den Zahlen sichtbar.

  ```text
  Runde 1 · 4 Tester, alle neu
  3  nicht bemerkt  3/4 Schwere 3
  2  falsch gelesen 2/4 Schwere 2
  4  Absicht erfüllt 4/4
  T3: 2 min an 1, Eingriff
  ```

  Diese Liste ist der Anfang für [Überarbeiten](/level-design/ueberarbeiten). Dort wählst du eine Stelle aus und änderst genau eine Sache.

  > [!INTERVIEW] „Ein Tester läuft im Kreis. Was tust du?“
  > Ich schaue zuerst in die Absichtsnotiz, ob dort Erkundung vorgesehen ist. Wenn nicht, schreibe ich weiter mit: Zeit, Wegpunkt, Blickrichtung, Gesagtes, damit ich später sehe, welche Schleife er läuft und an welchem Hinweis er vorbeigeht. Eingreifen tue ich erst nach der Regel, die ich vorher festgelegt habe, mit der kleinsten Hilfe, und ich protokolliere den Eingriff. Danach ordne ich die Stelle ein, meist als „nicht bemerkt“ oder „falsch gelesen“, und prüfe in der nächsten Runde mit neuen Testern, ob es ein Muster ist.

  ## Häufige Fehler

  - **Nur das Spannende notieren.** Im Protokoll stehen drei dramatische Momente und keine Zeit dazwischen. Schreib jeden Wegpunkt und jeden Halt auf.
  - **Den erwarteten Weg auf der Karte.** Du zeichnest den Weg des Testers an deinem entlang. Nimm eine Karte ohne deine Linie.
  - **Eingriff ohne Notiz.** Später zählst du einen Fund, den du selbst gezeigt hast. Jeder Eingriff bekommt eine Zeile und einen Strich.
  - **Mit wiederkehrenden Testern prüfen, ob etwas auffällt.** Wer die Kammer kennt, findet sie immer. Für Fragen des Bemerkens brauchst du neue Tester.
  - **Jede Umkehr als Problem werten.** In einem Bereich, der zum Suchen da ist, ist Umkehr erwünscht. Prüf gegen die Notiz.
  - **Namen in den Notizen.** Schreib T1, T2, T3.
  - **Eine große Runde.** Zehn Tester auf einmal zeigen dir oft dieselben Stellen. Teil sie auf mehrere Runden mit Änderungen dazwischen auf.

  ## Zusammenfassung

  - Bei Leveln beobachtest du Weg, Halt, Blickrichtung, Umkehr, Laufen an Wänden, Kantentests und übersehene Hinweise, dazu wörtlich das Gesagte.
  - Der Weg kommt auf eine Kopie der Skizze ohne deinen erwarteten Weg, mit Nummern und Zeiten. Das Protokoll hat je Zeile Zeit, Ort, Tun und Sagen.
  - Sitz schräg dahinter, notier auch Unauffälliges und zeig nicht auf den Bildschirm.
  - Ob Erkundung oder Verwirrung, entscheidet die Absichtsnotiz, nicht dein Eindruck.
  - Eingreifen nach einer vorher festgelegten Regel, mit der kleinsten Hilfe, als eigene Zeile im Protokoll.
  - Frische Tester für Fragen des Bemerkens, wiederkehrende für Fluss und Technik. Drei bis fünf pro Runde, anonym notiert.
  - Jede Zeile bekommt einen Code mit Beleg. Zusammengefasst wird je Ort und Code, geordnet nach Häufigkeit und Schwere.
exercises:
  - id: erkundung-oder-verwirrung
    type: choice
    title: 40 Sekunden in der Nische
    prompt: |
      Lehrbeispiel: In der Absichtsnotiz steht „Nische West: Nebenweg zum Suchen, Fundstück hinter Kisten“. Ein Tester geht in die Nische, läuft 40 Sekunden an den Wänden und Kisten entlang, findet nichts, geht zurück zur Hofmitte und von dort zum Tor. Wie ordnest du die 40 Sekunden ein?
    options:
      - text: Absicht erfüllt. Die Nische ist zum Suchen da, der Tester hat gesucht und ist danach auf den Weg zurückgekehrt.
        correct: true
        why: Die Notiz sieht Erkundung genau dort vor. Dass er das Fundstück nicht gefunden hat, ist eine eigene Beobachtung, kein Zeichen für Verwirrung.
      - text: Nicht bemerkt, weil er das Fundstück nicht gefunden hat.
        correct: false
        why: Das Suchen selbst war erwünscht. Ob das Fundstück zu gut versteckt ist, notierst du getrennt und prüfst es über mehrere Tester.
      - text: Verwirrung, weil er lange an Wänden entlanggelaufen ist.
        correct: false
        why: An Wänden entlanglaufen kann Suche nach Geheimnissen sein. Ohne Bezug zur Notiz ist „Verwirrung“ nur ein Eindruck.
      - text: Unbeabsichtigte Folge, weil er nicht direkt zum Tor ging.
        correct: false
        why: Er hat die Reihenfolge nicht umgangen, sondern einen erlaubten Umweg gemacht und ist zurückgekehrt.
    explanation: |
      Dasselbe Verhalten kann Erkundung oder Verwirrung sein. Entscheidend ist, was die Absichtsnotiz für diesen Ort vorsieht. Hier ist Suchen gewollt, und der Tester kehrt danach auf den Weg zurück. Dass er nichts gefunden hat, ist eine zweite Frage: Wenn drei von vier Testern suchen und keiner etwas findet, ist das Fundstück vielleicht nicht bemerkt worden.
    hints:
      - Lies zuerst, was die Notiz über die Nische sagt.
    resources:
      - title: NN/g · Avoid Leading Questions
        url: https://www.nngroup.com/articles/leading-questions/

  - id: wann-eingreifen
    type: choice
    title: Jetzt helfen oder nicht?
    prompt: |
      Deine Abbruchregel lautet „kein neuer Wegpunkt seit zwei Minuten“. In welchen Fällen greifst du ein?
    options:
      - text: Die Figur steckt zwischen zwei Kisten in der Kollision fest und kommt nicht mehr heraus.
        correct: true
        why: Ein technischer Fehler. Du hilfst sofort und notierst „Technik“. Über die Lesbarkeit sagt das nichts.
      - text: Der Tester hat seit drei Minuten keinen neuen Wegpunkt erreicht und läuft zwischen Hofmitte und Tor hin und her.
        correct: true
        why: Die Regel ist erfüllt. Du gibst die kleinste Hilfe und protokollierst den Eingriff.
      - text: Der Tester bleibt 20 Sekunden an der Abzweigung stehen und schaut sich um.
        correct: false
        why: Ein Halt ist eine Beobachtung. Er kann gerade das tun, was du willst, nämlich den Raum lesen.
      - text: Der Tester fragt „Bin ich hier richtig?“
        correct: false
        why: Eine Frage ist kein Festhängen. Gib sie zurück, etwa mit „Was meinst du?“, und notier sie wörtlich.
    explanation: |
      Das Level Design Book erlaubt den Eingriff, wenn der Tester „definitely stuck“ ist oder das Level „clearly just broken“. Die Abbruchregel macht „definitely stuck“ zu einer Zahl, die du vorher festlegst. Technik hilfst du sofort. Halte und Fragen sind Material für deine Auswertung und kein Grund zu helfen.
    hints:
      - Zwei Fälle sind richtig.
    resources:
      - title: The Level Design Book · Playtesting, „Observe playtest“
        url: https://book.leveldesignbook.com/process/blockout/playtesting#id-3.-observe-playtest-collect-telemetry

  - id: frisch-oder-wiederkehrend
    type: choice
    title: Wer kann das beantworten?
    prompt: |
      Du hast im Lagerhof eine Änderung gemacht. Ein Tester aus der letzten Runde hat Zeit. Welche Fragen kann er dir sinnvoll beantworten?
    options:
      - text: Stören die neuen Kisten den Weg zum Tor?
        correct: true
        why: Eine Frage zum Fluss. Dafür muss der Tester den Raum nicht neu sehen.
      - text: Läuft die Figur nach der Änderung irgendwo fest?
        correct: true
        why: Technik prüft jeder, auch du selbst.
      - text: Bemerkt man die Öffnung zur Kammer jetzt?
        correct: false
        why: Er weiß schon, dass es die Kammer gibt. Ob die Öffnung auffällt, zeigt nur jemand, der sie noch nie gesehen hat.
      - text: Geht man jetzt zuerst zum Tor?
        correct: false
        why: Seine Reihenfolge folgt der Erinnerung an die letzte Runde, nicht dem Raum.
    explanation: |
      Wiederkehrende Tester kennen den Grundriss. Ihr Verhalten zeigt Erinnerung, deshalb taugen sie nicht für Fragen des Bemerkens und der ersten Reihenfolge. Für Fluss, Technik und spätere Abschnitte sind sie gut. Für die Frage, ob die Änderung wirkt, brauchst du neue Tester.
    hints:
      - Welche Fragen hängen davon ab, dass man den Raum zum ersten Mal sieht?
    resources:
      - title: The Level Design Book · Playtesting, „Playtest formats“
        url: https://book.leveldesignbook.com/process/blockout/playtesting#playtest-formats

  - id: sitzung-ablauf
    type: order
    title: Eine Sitzung von vorn bis hinten
    prompt: |
      Bring die Schritte eines Level-Playtests in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Leite aus der Absichtsnotiz die Testfragen und die Abbruchregel ab.
      Kopier die Skizze ohne deinen erwarteten Weg, eine Karte je Tester.
      Weise den Tester kurz ein, ohne das Level zu erklären.
      Sieh zu, zeichne den Weg mit und protokolliere Zeit, Ort, Tun und Sagen.
      Stell nach dem Spiel deine offenen Fragen.
      Ordne jede Protokollzeile einem der fünf Codes zu.
      Zähl nach Ort und Code und ordne nach Häufigkeit und Schwere.
    alternatives:
      - [2, 1, 3, 4, 5, 6, 7]
    explanation: |
      Testfragen, Regel und Karte bereitest du vor, ihre Reihenfolge ist gleich. Die Einweisung kommt vor dem Spiel und bleibt kurz. Während des Spiels beobachtest du nur, Fragen kommen danach, damit sie das Verhalten nicht ändern. Das Einordnen braucht das ganze Protokoll, das Zählen alle Codes.
    hints:
      - Fragen stellst du erst, wenn nicht mehr gespielt wird.
    resources:
      - title: The Level Design Book · Playtesting, „How to run a playtest“
        url: https://book.leveldesignbook.com/process/blockout/playtesting#how-to-run-a-playtest

  - id: umkehr-zaehlen
    type: output
    title: Wie oft zurück?
    prompt: |
      Ein Weglog aus einem Playtest: Sekunde und Wegpunkt, an dem der Tester ankommt. Das Modell zählt Ankünfte an Wegpunkten, an denen er schon war. Was gibt es aus?
    lang: python
    code: |
      # (Sekunde, Wegpunkt)
      log = [(0, "S"), (4, "1"),
             (9, "2"), (15, "3"),
             (22, "2"), (30, "3"),
             (41, "4")]
      gesehen = set()
      umkehr = []
      for zeit, wp in log:
          if wp in gesehen:
              umkehr.append((wp, zeit))
          gesehen.add(wp)
      print(len(umkehr), umkehr)
    expected: |
      2 [('2', 22), ('3', 30)]
    hints:
      - Bis Sekunde 15 ist jeder Wegpunkt neu.
    explanation: |
      Der Tester kommt bei Sekunde 22 zum zweiten Mal an Wegpunkt 2 an und bei Sekunde 30 zum zweiten Mal an 3. Zwischen Tor und Öffnung pendelt er also einmal hin und her, bevor er zum Hebel geht. Ob das ein Problem ist, sagt die Zahl nicht. Liegt dort laut Notiz der Pflichtweg, ist es ein Befund; vielleicht wurde die Öffnung beim ersten Mal nicht bemerkt.
    resources:
      - title: Python · set
        url: https://docs.python.org/3/library/stdtypes.html#set

  - id: verweildauer
    type: output
    title: Wo blieb er am längsten?
    prompt: |
      Dasselbe Weglog. Das Modell rechnet für jeden Wegpunkt die Zeit vom Ankommen bis zum nächsten Wegpunkt zusammen, also Halten plus Weg. Was gibt es aus?
    lang: python
    code: |
      log = [(0, "S"), (4, "1"),
             (9, "2"), (15, "3"),
             (22, "2"), (30, "3"),
             (41, "4")]
      dauer = {}
      for a, b in zip(log, log[1:]):
          t1, wp = a
          t2 = b[0]
          dauer[wp] = dauer.get(wp, 0)
          dauer[wp] += t2 - t1
      top = max(dauer, key=dauer.get)
      print(top, dauer[top])
      print(dauer["2"])
    expected: |
      3 18
      14
    hints:
      - "Wegpunkt 3 kommt zweimal vor: 22 − 15 und 41 − 30."
      - Wegpunkt 2 ebenso, 15 − 9 und 30 − 22.
    explanation: |
      An Wegpunkt 3 kommen 7 und 11 Sekunden zusammen, an 2 sind es 6 und 8. Der letzte Eintrag hat keinen Nachfolger und zählt nicht. Das Modell trennt Halten und Gehen nicht. Ziehst du die Gehzeit ab, die du aus Weglänge und Tempo kennst ([Rhythmus](/level-design/rhythmus)), bleibt die Zeit, in der der Tester stand oder suchte. Bei 3 ist das vermutlich der größte Teil, und genau dort lohnt der Blick ins Protokoll.
    resources:
      - title: Python · zip()
        url: https://docs.python.org/3/library/functions.html#zip

  - id: begriffe-playtest
    type: gap
    title: Fünf Begriffe für den Playtest
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Einen Test mit möglichst wenig Anleitung nennt das Level Design Book einen ⟦blind⟧ Playtest. Geht ein Tester zu einem Wegpunkt zurück, an dem er schon war, ist das eine ⟦Umkehr⟧. Wann du eingreifst, legst du vorher in einer ⟦Abbruchregel⟧ fest. Ob man einen Hinweis bemerkt, zeigen nur ⟦frische⟧ Tester. War ein Hinweis nicht im Bild oder ging er im Rest unter, lautet der Code ⟦nicht bemerkt⟧.
    gaps:
      - label: Testform
        hint: Englisch, in Anführungszeichen, wie „ohne zu sehen“.
        accept: ["blinden", "Blind-"]
      - label: zurück zum Bekannten
        hint: Das Gegenteil von „weitergehen“.
        accept: ["Umkehrung", "Rückkehr", "Backtracking"]
      - label: vorher festgelegt
        hint: Eine Regel, nach der du den Test unterbrichst.
        accept: ["Eingriffsregel", "Regel"]
      - label: wer den Abschnitt nicht kennt
        hint: Gegenteil von „wiederkehrend“.
        accept: ["neue", "frischen", "neuen"]
      - label: erste der vier Fehlerarten
        hint: Zwei Wörter. Der Hinweis wurde nicht wahrgenommen.
        accept: ["übersehen", "nicht gesehen", "nicht wahrgenommen"]
    explanation: |
      Ein blinder Playtest kommt dem Spielen ohne dich am nächsten. Umkehr und Verweildauer kannst du zählen. Die Abbruchregel schützt dich vor spontanen Eingriffen, frische Tester schützen deine Ergebnisse vor Erinnerung. „Nicht bemerkt“ ist die erste der vier Fehlerarten, mit denen du in [Überarbeiten](/level-design/ueberarbeiten) weiterarbeitest; der fünfte Code, „Absicht erfüllt“, hält fest, was funktioniert hat.
    resources:
      - title: The Level Design Book · Playtesting, „Playtest formats“
        url: https://book.leveldesignbook.com/process/blockout/playtesting#playtest-formats

  - id: vorbereitung-fehler
    type: bug
    title: Ein Schritt verdirbt den Test
    prompt: |
      Lehrbeispiel: deine Notizen zur Vorbereitung eines Playtests. Eine Zeile macht den Test wertlos für die Frage, ob Tester den Weg allein finden. Finde sie.
    lang: prose
    code: |
      Ich setze mich schräg hinter den Tester.
      Ich notiere die Tester als T1, T2 und T3.
      Ich zeige dem Tester vor dem Start die Skizze, damit er weiß, wo er ist.
      Ich lege fest, dass ich nach zwei Minuten ohne neuen Wegpunkt helfe.
      Ich starte die Stoppuhr, sobald der Tester die Figur bewegt.
    lines: [3]
    explanation: |
      Die Skizze zeigt Wege, Durchgänge und Hinweise. Wer sie vorher gesehen hat, spielt mit einer Karte im Kopf, und du misst, ob er sich an die Skizze erinnert, nicht, ob der Raum ihm den Weg zeigt. Die anderen Zeilen schützen den Test: Abstand, anonyme Notizen, eine feste Abbruchregel und Zeiten ab einem klaren Startpunkt.
    hints:
      - Welche Zeile gibt dem Tester eine Information, die das Level geben soll?
    resources:
      - title: The Level Design Book · Playtesting, „Brief playtester“
        url: https://book.leveldesignbook.com/process/blockout/playtesting#id-2.-brief-playtester

  - id: eingriff-gezaehlt
    type: bug
    title: Ein Fund, der keiner war
    prompt: |
      Ein ausgewertetes Protokoll, jede Zeile mit Code. Eine Zeile ist falsch eingeordnet. Finde sie.
    lang: text
    code: |
      0:14 3 vorbei: nicht bemerkt
      1:02 1 hält 30 s: unklar
      2:40 1 EINGRIFF „Schau im Hof“
      2:47 3 Kammer: Absicht erfüllt
      3:20 A hinaus: nach Eingriff
    lines: [4]
    explanation: |
      Der Tester geht in die Kammer, sieben Sekunden nachdem du ihn auf den Hof hingewiesen hast. Das ist kein Beleg dafür, dass der Raum die Kammer zeigt. Die Zeile gehört zu „nach Eingriff“ wie die letzte. Ausgewertet wird die Stelle davor: An Wegpunkt 3 ist er vorbeigelaufen, an 1 hat er 30 Sekunden gestanden. Diese Stelle geht als Befund in die Zählung.
    hints:
      - Was passiert direkt vor der falschen Zeile?

  - id: beobachter-wirkung
    type: explain
    title: Drei Schwächen des Zusehens
    prompt: |
      Auszug aus Valves Folien zum Playtesting. Erkläre in drei bis fünf Sätzen, was die drei Minuspunkte bei einem Level-Playtest bedeuten und was du jeweils dagegen tust.
    lang: prose
    code: |
      Direct Observation
      + Get a feel for player interaction with game
      + Importance of what people do—not what they say
      – Presence of observers can bias results
      – Salient event can slant interpretation
      – Behavior requires interpretation
    points:
      - Wer zusieht, verändert das Verhalten. Du sitzt schräg dahinter, zeigst nicht auf den Bildschirm und fragst während des Spiels nicht nach Hinweisen.
      - Ein auffälliges Ereignis färbt die Auswertung. Du notierst jeden Wegpunkt und jeden Halt mit Zeit, nicht nur das Dramatische.
      - Verhalten muss gedeutet werden. Du trennst die Zeilen des Protokolls von den Codes und deutest gegen die Absichtsnotiz.
      - Über mehrere Tester zählen schützt davor, eine einzelne Deutung für ein Muster zu halten.
    explanation: |
      Valve hält das direkte Beobachten für unverzichtbar und nennt trotzdem drei Fallen. Erstens verändert ein Beobachter, was der Tester tut, deshalb sitzt du schräg dahinter und zeigst auf nichts. Zweitens bleibt das auffälligste Ereignis am stärksten hängen; ein Protokoll mit jeder Ankunft und jedem Halt hält dagegen. Drittens sagt ein Halt an einer Abzweigung allein nicht, warum der Tester hält. Darum stehen im Protokoll nur Zeit, Ort, Tun und Sagen, und gedeutet wird danach, mit der Absichtsnotiz daneben und über mehrere Tester.
    hints:
      - Nimm dir die drei Minuspunkte einzeln vor.
    resources:
      - title: Mike Ambinder, „Valve's Approach to Playtesting“ (GDC 2009, Folien)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf

  - id: protokoll-einordnen
    type: explain
    title: T2 im Lagerhof
    prompt: |
      Lehrbeispiel: das Protokoll von T2 im Lagerhof, dem Abschnitt aus der Lektion. Absicht: „Der Spieler soll das Tor im Norden sehen, bevor er den Weg über die Kammer findet.“ Erkundung ist in der Notiz nicht vorgesehen. Erkläre in drei bis fünf Sätzen, welche Codes du für die Wegpunkte 2 und 3 vergibst und ob die Umkehrungen nach Erkundung oder nach Suche aussehen.
    lang: prose
    code: |
      0:05 S betritt den Hof.
      0:09 1 hält 2 s.
      0:16 2 hält 6 s am Tor, Figur zum Licht.
      0:25 2 läuft gegen die Wand rechts vom Tor.
      0:31 2 sagt: „Geht das nicht auf?“
      0:38 1 zurück zur Hofmitte.
      0:44 3 läuft an der Öffnung vorbei, die Kamera zeigt die Kammer 1 s lang.
      0:52 1 zurück zur Hofmitte, hält 10 s.
      1:05 3 dreht zur Öffnung, geht in die Kammer.
      1:12 4 zieht den Hebel.
    points:
      - An Wegpunkt 2 ist die Absicht erfüllt, denn der Tester geht zuerst zum Tor; der Kantentest und die Frage zeigen, dass er das Tor als geschlossen gelesen hat.
      - An Wegpunkt 3 lautet der Code beim ersten Vorbeigehen „nicht bemerkt“, denn der Tester hält nicht, ändert die Richtung nicht und sagt nichts, obwohl die Kammer kurz im Bild war.
      - Beim zweiten Mal bemerkt er die Öffnung, nach zwei Umkehrungen zur Hofmitte und 10 Sekunden Halt.
      - Weil die Notiz hier keine Erkundung vorsieht und er zum Bekannten zurückkehrt, sieht das nach Suche aus, nicht nach gewollter Erkundung.
      - Ein Tester ist kein Muster; die Codes werden über alle Tester gezählt.
    explanation: |
      T2 geht zuerst zum Tor und hält dort, die Figur zeigt zum Licht. Die Reihenfolge stimmt, an Wegpunkt 2 ist die Absicht erfüllt. Dass er gegen die Wand daneben läuft und fragt, ob das Tor nicht aufgeht, zeigt, dass er es als geschlossen gelesen hat und einen anderen Weg sucht. An Wegpunkt 3 läuft er zuerst vorbei, ohne Halt, Richtungswechsel oder ein Wort, obwohl die Kammer eine Sekunde im Bild war. Sie ging also im Rest unter: „nicht bemerkt“, belegt mit 0:44. Erst nach zwei Rückkehren zur Hofmitte und zehn Sekunden Stillstand dreht er zur Öffnung. Da die Notiz dort keine Erkundung vorsieht und er immer wieder zum Knoten zurückgeht, spricht das für Suche. Ob die Öffnung zu leise ist, entscheidest du erst, wenn du dieselbe Stelle bei den anderen Testern gezählt hast.
    hints:
      - Geh die Zeilen nach Wegpunkt sortiert durch, erst alle zu 2, dann alle zu 3.
    resources:
      - title: The Level Design Book · Playtesting, „Analyze playtest data“
        url: https://book.leveldesignbook.com/process/blockout/playtesting#id-5.-analyze-playtest-data

  - id: video-weg
    type: practice
    title: Einen fremden Weg mitzeichnen
    prompt: |
      Wähle ein Video, in dem jemand ein Top-down-Spiel zum ersten Mal spielt. Nimm zwei bis drei Minuten in einem Bereich. Skizzier den Bereich grob auf Papier, setz eigene Nummern als Wegpunkte und zeichne den Weg mit Zeiten mit. Schreib hier fünf Protokollzeilen und zähl die Umkehrungen.
    lang: prose
    starter: |
      Video, Spiel, Stelle:
      Protokoll (Zeit, Ort, Tun, Sagen):
      Umkehrungen:
      Stelle, die du einordnen würdest:
    checklist:
      - Jede der fünf Zeilen hat Zeit, Ort als Wegpunkt, Tun und, falls gesprochen wurde, das Gesagte wörtlich.
      - Keine Zeile enthält ein Gefühlswort oder ein „weil“.
      - Mindestens eine Zeile beschreibt Blickrichtung, Halt, Laufen an einer Wand oder einen Kantentest.
      - Die Zahl der Umkehrungen passt zu den Wegpunkten im Protokoll.
      - Du nennst eine Stelle, die du einordnen würdest, und schreibst dazu, welche Information dir für den Code fehlt.
    explanation: |
      Ein Video ist kein echter Test, denn die Person spielt für ein Publikum und du kennst die Absicht des Spiels nicht. Zum Üben reicht es: Du lernst, schnell Zeit und Ort zu notieren und den Weg auf Papier mitzuzeichnen. Die fehlende Information für den Code ist meist die Absicht. Genau deshalb schreibst du sie für deine eigenen Abschnitte vorher auf.
    hints:
      - Halte das Video an, wenn ein neuer Bereich ins Bild kommt, und skizzier zuerst die Ränder.
    resources:
      - title: The Level Design Book · Playtesting
        url: https://book.leveldesignbook.com/process/blockout/playtesting

  - id: eigener-test-planen
    type: practice
    title: Dein erster Level-Playtest
    prompt: |
      Plane den ersten Playtest deines eigenen Abschnitts. Nimm die Absichtsnotiz aus [Absicht notieren, Layout skizzieren](/level-design/absicht-skizze). Stichpunkte genügen.
    lang: prose
    starter: |
      Testfragen (mit Ort):
      Abbruchregel:
      Einweisung (ein bis zwei Sätze):
      Tester (wie viele, neu?):
      So bleiben die Notizen anonym:
    checklist:
      - Jede Testfrage nennt einen Wegpunkt und lässt sich durch Zusehen beantworten.
      - Die Abbruchregel enthält eine Zahl, etwa eine Zeit ohne neuen Wegpunkt.
      - Die Einweisung erklärt nicht, wohin der Tester gehen oder was er finden soll.
      - Du planst drei bis fünf Tester und notierst, ob sie den Abschnitt schon kennen.
      - Die Notizen enthalten keine Namen, und du hast festgelegt, was mit Aufnahmen geschieht.
    explanation: |
      Mit diesem Plan kannst du den Test ohne Vorbereitung im Moment durchführen. Die Testfragen bestimmen, worauf du achtest, die Abbruchregel, wann du eingreifst, und die Einweisung schützt den Test davor, dass du das Level erklärst. Den ganzen Ablauf mit mehreren Runden übst du in der [Werkstatt](/level-design/werkstatt-abschnitt).
    hints:
      - Nimm die Zeichen für „klappt“ und „scheitert“ aus deiner Notiz und mach aus jedem eine Frage.
    resources:
      - title: The Level Design Book · Playtesting, „Prepare for playtest“
        url: https://book.leveldesignbook.com/process/blockout/playtesting#id-1.-prepare-for-playtest
