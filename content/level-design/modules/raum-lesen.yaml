id: raum-lesen
title: "Level lesen: Absicht, Hinweis, Verhalten"
level: 1
minutes: 80
summary: Das Denkmodell des Kurses – ein Level ist eine Absicht, die über Hinweise im Raum Verhalten auslösen soll – und eine Methode, Abschnitte veröffentlichter Top-down-Spiele zu lesen, Gesehenes von Gedeutetem zu trennen und eine eigene Absicht prüfbar aufzuschreiben.
place: unterwegs
goals:
  - Du unterscheidest Absicht, Hinweis und Verhalten und sagst, welche Ebene du gestaltest und welche du beobachtest.
  - Du rechnest aus, wie viele Tiles ein Bildschirm zeigt und wie früh der Spieler in der Draufsicht sieht, was kommt.
  - Du liest einen Abschnitt eines veröffentlichten Top-down-Spiels in sechs Schritten und formulierst die vermutete Absicht in einem Satz.
  - Du trennst in Notizen, was zu sehen war, von dem, was du daraus geschlossen hast.
  - Du schreibst eine Absichtsnotiz mit beobachtbaren Zeichen für Erfolg und Scheitern.
resources:
  - title: The Level Design Book · Critical path
    url: https://book.leveldesignbook.com/process/layout/criticalpath
  - title: Dan Taylor, „Ten Principles of Good Level Design“, Teil 1 (Game Developer, 2013)
    url: https://www.gamedeveloper.com/design/ten-principles-of-good-level-design-part-1-
  - title: Mike Ambinder, „Valve's Approach to Playtesting“ (GDC 2009, Folien)
    url: https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf
  - title: Iwata Asks · A Link Between Worlds, Teil 3 „Direct Top-down View“
    url: https://www.nintendo.com/en-gb/Iwata-Asks/Iwata-Asks-The-Legend-of-Zelda-A-Link-Between-Worlds/The-Legend-of-Zelda-A-Link-Between-Worlds/3-Direct-Top-down-View/3-Direct-Top-down-View-831979.html
lesson: |
  Lehrbeispiel: Du betrittst in einem Top-down-Spiel einen Hof. Links und rechts gibt es Durchgänge, oben einen weiteren, in der Mitte steht ein Brunnen. Neben dem rechten unteren Durchgang hängt eine Laterne, sonst ist alles dunkel. Du gehst zur Laterne. Hat das jemand so gewollt? Und wenn ja, hat dich die Laterne dorthin gebracht, oder war es der Brunnen, der den Weg geradeaus versperrt?

  Level-Design beginnt mit solchen Fragen. Ein Level ist kein Bild, das man betrachtet, sondern ein Raum, in dem jemand Entscheidungen trifft: wohin er geht, wo er stehen bleibt, was er ausprobiert und was er übersieht. Dieses Modul führt das Denkmodell ein, mit dem der ganze Kurs arbeitet, und eine Methode, mit der du veröffentlichte Level liest, bevor du eigene baust. Du brauchst dafür ein Spiel, ein Video oder deine Erinnerung, Papier und einen Stift.

  ## Ein Level ist ein Raum mit Absicht

  Ein Raum wird zum Level, sobald jemand mit einer Absicht entschieden hat, wie er aussieht. Die Absicht ist das, was der Spieler an dieser Stelle tun, bemerken oder verstehen soll: den Ausgang finden, einen Seitengang bemerken, eine neue Fähigkeit ohne Risiko ausprobieren, vor einer Begegnung einen Überblick bekommen. Sie ist nicht dasselbe wie „schön“ oder „stimmig“. Ein schöner Raum, in dem niemand den Ausgang findet, verfehlt seine Absicht. Ein karger grauer Raum aus Kästen, in dem alle sofort richtig gehen, erfüllt sie.

  Dan Taylor hat das 2013 auf der GDC als zehn Prinzipien formuliert. Zum ersten, „Good level design is fun to navigate“, schreibt er: „Careful layout, lighting, signage and other visual cues should create a natural “flow” to the level that guides the player instinctively through it.“ Das dritte lautet: „Good level design tells the player what to do, but not how to do it“ ([Game Developer, Teil 1](https://www.gamedeveloper.com/design/ten-principles-of-good-level-design-part-1-)). Das Ziel soll klar sein, der Weg dorthin bleibt beim Spieler. The Level Design Book sagt es knapper: „the best flow is whatever supports the intended experience design goals“ ([Flow](https://book.leveldesignbook.com/process/layout/flow)). Gut ist, was der Absicht dient.

  Für dich heißt das: Jeder Abschnitt, den du in diesem Kurs baust, beginnt mit einem Satz. Welcher Satz das ist, entscheidest du. Der Kurs gibt dir Werkzeuge, ihn umzusetzen und zu prüfen, keine Orte und keine Begegnungen für dein Spiel.

  ## Absicht, Hinweis, Verhalten: das Grundmodell

  Jede Stelle eines Levels hat drei Ebenen, und sie liegen an drei verschiedenen Orten.

  | Ebene | Wo sie liegt | Was du damit tust |
  | --- | --- | --- |
  | Absicht | in deinem Kopf, als Satz notiert | festlegen, bevor du baust |
  | Hinweis | im Raum: Licht, Weg, Kontrast, Form, Landmarke | bauen und ändern |
  | Verhalten | beim Spieler: Weg, Halt, Umkehr, Gesagtes | beobachten und notieren |

  Nur die mittlere Ebene kannst du gestalten. Die Absicht siehst du in keinem Spiel, und Verhalten kannst du nicht anordnen, nur beobachten. Das Level Design Book nennt den beabsichtigten Hauptweg „critical path“ und schränkt sofort ein: „Most players will wander, explore, linger, or even just get confused.“ ([Critical path](https://book.leveldesignbook.com/process/layout/criticalpath)). Level-Design arbeitet deshalb in einer Schleife: Absicht notieren, Hinweise bauen, Spieler beobachten, die Lücke zwischen Absicht und Verhalten ansehen und dann entweder die Hinweise oder die Absicht ändern.

  Im Hof aus dem Einstieg sieht das so aus. Absicht: „Der Spieler soll zuerst rechts unten hinausgehen.“ Hinweise: die Laterne als einziges Licht, der Brunnen in der Achse vom Eingang. Verhalten: Drei von vier Testern gehen zur Laterne, einer geht zuerst oben links hinaus. Ob die Laterne gewirkt hat oder der Brunnen, verrät dieses Ergebnis nicht. Dafür müsstest du eine Sache ändern und neu beobachten.

  > [!MERKE] Drei Ebenen
  > Die Absicht steht in deiner Notiz, der Hinweis im Raum, das Verhalten beim Spieler. Gestalten kannst du nur Hinweise, prüfen nur am Verhalten.

  ## Die Draufsicht: was der Bildschirm zeigt und was er verbirgt

  In einem Spiel mit Kamera hinter der Figur sieht der Spieler einen Turm am Horizont, auch wenn er weit weg ist. In der Draufsicht gibt es keinen Horizont. Was der Spieler sieht, ist der Bildschirm, und der ist klein. Bei 320 × 180 Pixeln Spielgrafik und Tiles von 16 Pixeln, wie in der Testszene aus [Godot-Start](/combat/godot-start), passen 20 Tiles nebeneinander und 11 volle übereinander. Beide Werte sind Platzhalter; deine Auflösung und deine Tilegröße legst du mit deiner Grafik fest ([Pixelraster und Skalierung](/godot/pixelraster)).

  Daraus folgen drei Dinge, die den ganzen Kurs begleiten:

  - **Der Bildschirm ist die Einheit.** Ein Hinweis, der nicht im Bild ist, existiert für den Spieler nur als Erinnerung. Ein Abschnitt aus drei Bildschirmen ist bei 90 Pixeln pro Sekunde in elf Sekunden durchquert.
  - **Der Blick voraus ist kurz und ungleich.** Hält die Kamera die Figur in der Mitte, sieht der Spieler nach rechts 160 Pixel voraus, nach oben nur 90. Wer im Breitbild nach oben läuft, sieht Hindernisse also später. Mit Drag-Rändern und Glättung läuft die Kamera in Godot der Figur sogar etwas hinterher; soll sie vorausschauen, verschiebt ein kleines Skript ihren `offset` in Laufrichtung ([Camera2D, offset](https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-offset)). Welche Kamera du willst, ist eine Designentscheidung.
  - **Die 3/4-Ansicht verdeckt.** Die meisten Top-down-Spiele zeigen Wände von vorn und Dächer von oben. Was hinter einer hohen Wand oder unter einem Dach liegt, ist unsichtbar, obwohl es im Bildausschnitt liegt. Wie diese Ansicht gezeichnet wird, steht in [Grundkörper, Perspektive und Draufsicht](/pixelart/grundkoerper-raum).

  > [!NOTE] Rechnen, um zu sehen
  > Die kleinen Rechnungen in den Übungen sind keine Mathematik um ihrer selbst willen. Sie zeigen dir, wie viel ein Bildschirm fasst und wie lange ein Weg dauert, bevor du auch nur ein Tile setzt.

  ## Ein veröffentlichtes Level lesen: die Methode

  Du lernst Level-Design schneller, wenn du fremde Level liest, bevor du eigene baust. Lesen heißt dabei nicht, einen Eindruck zu haben, sondern eine Stelle so genau zu beschreiben, dass ein anderer sie nachvollziehen kann. Die Methode hat sechs Schritte:

  1. **Einmal unvorbereitet spielen.** Danach sofort notieren, wo du entlanggegangen bist. Das geht nur einmal: Beim zweiten Mal kennst du die Stelle.
  2. **Noch einmal ansehen und skizzieren.** Auf Karopapier, ein Kästchen pro Tile, mit einem Rahmen von 20 × 11 Kästchen für einen Bildschirm. Videos darfst du anhalten.
  3. **Hinweise markieren.** Alles, was den Blick oder den Weg gelenkt hat: Licht, Kontrast, Wege, Öffnungen, Bewegung, Gegenstände.
  4. **Gesehenes und Gedeutetes trennen.** Mehr dazu im nächsten Abschnitt.
  5. **Die vermutete Absicht in einem Satz.** Was soll der Spieler hier tun oder bemerken?
  6. **Gegenprüfen.** Mit einer Entwicklerquelle, etwa einem Vortrag im [GDC Vault](https://gdcvault.com/) oder einem Postmortem, oder mit dem Weg eines zweiten Spielers, dem du nichts erklärst.

  Gute Stellen für den Anfang sind kurze Abschnitte von einem bis drei Bildschirmen: der erste Raum eines Dungeons, eine Kreuzung in einem Dorf, ein Raum vor einer Begegnung. Ganze Level sind für den Anfang zu groß.

  > [!PRAXIS] Nintendo baut auf einem bekannten Level auf
  > Für A Link Between Worlds (2013) suchte das Zelda-Team eine Ansicht, in der das neue Eintreten der Figur in Wände wirkt. Eiji Aonuma erzählt: „we considered placing the camera directly overhead and fixing it there, and we made a test version.“ Als das passte, schlug er vor, „that we should use the landforms from A Link to the Past instead of starting from scratch“, und übertrug das Gelände des Vorgängers selbst in 3D ([Iwata Asks, Teil 3](https://www.nintendo.com/en-gb/Iwata-Asks/Iwata-Asks-The-Legend-of-Zelda-A-Link-Between-Worlds/The-Legend-of-Zelda-A-Link-Between-Worlds/3-Direct-Top-down-View/3-Direct-Top-down-View-831979.html)). Zuerst prüfte eine spielbare Testfassung die Idee, dann diente ein Level, das alle kannten, als Grundlage.

  ## Gesehenes und Gedeutetes trennen

  „Die Laterne lockt den Spieler zum Tor“ klingt wie eine Beobachtung, ist aber eine Deutung. Beobachtet hast du zweierlei: Die Laterne ist das hellste Objekt im Bild, und du bist zum Tor gegangen. Dass das eine das andere bewirkt hat, ist eine Vermutung. Sie kann stimmen. Aber solange du sie nicht als Vermutung notierst, prüfst du sie nie.

  Dieselbe Trennung brauchst du beim Zusehen. „Der Spieler war verwirrt“ ist eine Deutung. „Er blieb zwölf Sekunden am Brunnen stehen und ging dann zurück“ ist eine Beobachtung. Eine Kamera könnte sie aufnehmen. Valve hat das 2009 in seinen Folien zum Playtesting so zusammengefasst: „Importance of what people do—not what they say“ ([Ambinder, GDC 2009](https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf)). Was jemand sagt, hilft trotzdem. Die Nielsen Norman Group beschreibt das laute Denken, bei dem Testpersonen „continuously thinking out loud“ spielen oder arbeiten, als billiges und robustes Werkzeug ([Thinking Aloud](https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/)). Auch dort ist das Gesagte eine Beobachtung und die Ursache eine Deutung. Wie man solche Protokolle führt, behandelt [Testlesen und Playtest](/narrative/testlesen-playtest); was speziell bei Leveln wichtig ist, [Playtests beobachten](/level-design/playtest-methode).

  Ein Prüfsatz hilft: Könnte eine Kamera das aufnehmen? Wenn nein, gehört es in die Spalte „gedeutet“.

  ## Die Absichtsnotiz

  Für eigene Abschnitte drehst du die Methode um. Statt eine Absicht zu vermuten, schreibst du sie vorher auf, zusammen mit dem, woran du beim Zusehen merkst, ob sie eintritt. Die Notiz hat in diesem Kurs immer dieselbe Form:

  ```text
  Abschnitt:
  Absicht (ein Satz):
    Der Spieler soll …
  Erwarteter Weg:
  Hinweise (wo, was, wofür):
  Zeichen, dass es klappt:
  Zeichen, dass es scheitert:
  ```

  Die letzten beiden Zeilen sind die wichtigsten. „Der Gang soll geheimnisvoll wirken“ ist ein Ziel, aber kein Zeichen. „Der Spieler wird am Seitengang langsamer oder schaut hinein“ kannst du auf einem Video abhaken. Ausführlich übst du die Notiz in [Absicht notieren, Layout skizzieren](/level-design/absicht-skizze). Eine Skizze ersetzt dabei nie den Test. Das Level Design Book warnt: „A layout is NOT a level, the player never plays your drawing.“ ([Layout](https://book.leveldesignbook.com/process/layout))

  > [!NOTE] Deine Absicht, deine Entscheidung
  > Was in der Notiz steht, entscheidest du. Eine KI darf dir später Skripte schreiben, etwa einen Wegschreiber für Playtests. Layouts, Orte und Absichten für dein Spiel lässt du dir nicht erzeugen: Dann würdest du die Lücke zwischen Absicht und Verhalten an einem fremden Entwurf studieren.

  > [!INTERVIEW] „Wie analysierst du ein Level?“
  > Ich spiele die Stelle einmal unvorbereitet und notiere sofort meinen Weg. Dann skizziere ich sie im Raster, markiere jeden Hinweis und trenne, was zu sehen war, von dem, was ich daraus geschlossen habe. Am Ende steht die vermutete Absicht in einem Satz, und den prüfe ich gegen eine Entwicklerquelle oder gegen den Weg eines zweiten Spielers.

  ## Häufige Fehler

  - **Ein Gefühl als Absicht.** „Soll spannend sein“ lässt sich nicht beobachten. Schreib dazu, woran du Spannung beim Zusehen erkennen würdest, oder wähl eine andere Absicht.
  - **Hinweis gleich Wirkung.** „Ich habe eine Laterne hingestellt, also gehen sie hin.“ Ob sie hingehen, zeigt erst der Test.
  - **Nach dem eigenen Spielen urteilen.** Du kennst jeden Weg und jede Absicht. Dein eigener Durchgang zeigt dir Fehler in der Technik, nicht ob andere die Hinweise lesen.
  - **Ein Standbild statt eines Wegs.** Ein Screenshot zeigt Komposition, aber nicht, wann der Spieler was sieht. Ein Level wird über die Zeit gespielt.
  - **Kopieren statt verstehen.** Wer einen gelungenen Raum nachbaut, ohne die Absicht dahinter zu kennen, übernimmt die Form und verliert den Grund.

  ## Zusammenfassung

  - Ein Level ist ein Raum mit Absicht. Gut ist er, wenn das Verhalten der Spieler zur Absicht passt, nicht wenn er schön ist.
  - Absicht (Kopf), Hinweis (Raum), Verhalten (Spieler): Gestalten kannst du nur Hinweise, prüfen nur am Verhalten.
  - In der Draufsicht ist der Bildschirm die Einheit: 20 × 11 Tiles bei 320 × 180 Pixeln und 16-Pixel-Tiles, als Platzhalter.
  - Der Blick voraus ist kurz, nach oben und unten kürzer als zur Seite. Hohe Wände und Dächer verdecken auch im Bildausschnitt.
  - Fremde Level liest du in sechs Schritten: unvorbereitet spielen, skizzieren, Hinweise markieren, Gesehenes und Gedeutetes trennen, Absicht vermuten, gegenprüfen.
  - Eine Absichtsnotiz nennt die Absicht in einem Satz und beobachtbare Zeichen für Erfolg und Scheitern.
exercises:
  - id: was-ist-verhalten
    type: choice
    title: Was hast du beobachtet?
    prompt: |
      Lehrbeispiel: Ein Hof mit drei Ausgängen. Welche Aussagen beschreiben **Verhalten**, also etwas, das du beim Zusehen beobachten kannst?
    options:
      - text: Drei von vier Testern gingen zuerst zum Tor mit der Laterne.
        correct: true
        why: Das ist gezählt, was Spieler getan haben. Ob die Laterne der Grund war, sagt die Aussage nicht, und das ist richtig so.
      - text: Ein Tester blieb zwölf Sekunden am Brunnen stehen und lief dann zurück zum Eingang.
        correct: true
        why: Ort, Dauer und Richtung sind beobachtbar. Was er dabei dachte, steht nicht drin.
      - text: Die Laterne am Tor ist das hellste Objekt im Bild.
        correct: false
        why: Das beschreibt den Raum, also einen Hinweis. Ob jemand darauf reagiert, ist eine andere Frage.
      - text: Die Spieler sollen das Tor als Weg nach draußen erkennen.
        correct: false
        why: Das ist die Absicht. Sie steht im Kopf des Designers, nicht im Spiel, und lässt sich nur über Verhalten prüfen.
      - text: Der Tester war am Brunnen verwirrt.
        correct: false
        why: Verwirrung ist eine Deutung. Beobachtet hast du, dass er stehen blieb und umkehrte. Er kann auch gesucht, gelesen oder sich umgesehen haben.
    explanation: |
      Absicht, Hinweis und Verhalten liegen an drei verschiedenen Orten: im Kopf, im Raum und beim Spieler. Nur Hinweise kannst du direkt bauen, nur Verhalten kannst du beobachten. Wer Deutungen wie „verwirrt“ als Beobachtung notiert, legt sich auf eine Ursache fest, bevor er sie geprüft hat.
    hints:
      - Frag bei jeder Aussage, ob eine Kamera sie aufnehmen könnte.
      - Zwei Aussagen sind richtig.
    resources:
      - title: "Nielsen Norman Group, „Thinking Aloud: The #1 Usability Tool“"
        url: https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/

  - id: hinweis-oder-absicht
    type: choice
    title: Die Laterne am Tor
    prompt: |
      Lehrbeispiel: In deinem Hof hängt am Tor eine Laterne, sonst ist es dunkel. Vier von vier Testern gehen zuerst zum Tor. Was darfst du daraus schließen?
    options:
      - text: Die Absicht „zuerst zum Tor“ ist in diesem Test erreicht. Ob die Laterne der Grund war, weißt du noch nicht.
        correct: true
        why: Das Verhalten passt zur Absicht. Für die Ursache kommen auch der Weg vom Eingang, die Form des Hofs oder Gewohnheit infrage.
      - text: Die Laterne funktioniert. Sie zieht Spieler zum Tor.
        correct: false
        why: Das ist eine Deutung. Liegt das Tor direkt gegenüber dem Eingang, wären die Tester vielleicht auch ohne Laterne hingegangen.
      - text: Die Absicht ist bewiesen und gilt für alle Spieler.
        correct: false
        why: Vier Tester sind vier Beobachtungen. Sie zeigen, dass die Stelle nicht offensichtlich scheitert, aber keine Regel für alle.
      - text: Nichts, weil die Tester nicht gesagt haben, warum sie zum Tor gegangen sind.
        correct: false
        why: Verhalten ist eine Beobachtung, auch ohne Begründung. Was Spieler sagen, ergänzt das Verhalten, ersetzt es aber nicht.
    explanation: |
      Ein Test prüft zuerst, ob das Verhalten zur Absicht passt. Welcher Hinweis es ausgelöst hat, ist eine zweite Frage. Die beantwortest du, indem du eine Sache änderst, etwa die Laterne an einen anderen Ausgang hängst, und mit neuen Testern wieder zusiehst. Wie das geht, zeigt [Überarbeiten](/level-design/ueberarbeiten).
    hints:
      - Welche anderen Gründe könnte es geben, zum Tor zu gehen?
    resources:
      - title: Mike Ambinder, „Valve's Approach to Playtesting“ (GDC 2009, Folien)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf

  - id: level-lesen-schritte
    type: order
    title: Einen fremden Abschnitt lesen
    prompt: |
      Du willst einen kurzen Abschnitt eines veröffentlichten Top-down-Spiels lesen. Bring die Schritte in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Spiel den Abschnitt einmal ohne Vorsatz und notier danach aus dem Gedächtnis, wo du entlanggegangen bist.
      Sieh dir die Stelle noch einmal an und skizzier sie auf Karopapier, ein Kästchen pro Tile.
      Markier in der Skizze alles, was deinen Blick oder deinen Weg gelenkt hat.
      Trenn deine Notizen in das, was zu sehen war, und das, was du daraus geschlossen hast.
      Schreib die vermutete Absicht des Abschnitts in einem Satz auf.
      Vergleich den Satz mit einer Entwicklerquelle oder mit dem Weg eines zweiten Spielers.
    explanation: |
      Der erste Durchgang ist der einzige, in dem du den Abschnitt nicht kennst. Deshalb notierst du deinen Weg sofort und vor jeder Analyse. Die Skizze macht aus Bildern einen Raum mit Maßen. Erst danach suchst du Hinweise, trennst Beobachtung von Deutung und formulierst die Absicht. Der Vergleich am Ende zeigt, ob deine Deutung mehr ist als dein eigener Eindruck.
    hints:
      - Was geht nur ein einziges Mal?
    resources:
      - title: The Level Design Book · Critical path
        url: https://book.leveldesignbook.com/process/layout/criticalpath

  - id: bildschirm-in-tiles
    type: output
    title: Ein Bildschirm in Tiles
    prompt: |
      Spielbild 320 × 180 Pixel, Tiles 16 × 16 (beides Platzhalter). Was gibt das Modell aus?
    lang: python
    code: |
      BILD_B, BILD_H = 320, 180
      TILE = 16

      quer = BILD_B // TILE
      hoch = BILD_H // TILE
      rest = BILD_H % TILE
      print(quer, hoch, rest)
    expected: |
      20 11 4
    hints:
      - "`//` teilt ganzzahlig, `%` liefert den Rest."
      - 11 × 16 = 176.
    explanation: |
      Quer passen genau 20 Tiles, hoch 11 volle und ein Streifen von 4 Pixeln. Ein Bildschirm ist also 20 × 11 Tiles groß, und je nach Kameraposition schaut oben oder unten ein Viertel einer zwölften Reihe herein. Für Skizzen auf Karopapier heißt das: Ein Rahmen von 20 × 11 Kästchen ist ein Bildschirm.
    resources:
      - title: Godot Docs · Multiple resolutions
        url: https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html

  - id: quer-ueber-den-bildschirm
    type: output
    title: Wie lange ist ein Bildschirm?
    prompt: |
      Die Figur läuft mit 90 Pixeln pro Sekunde (Platzhalter aus [Godot-Start](/combat/godot-start)). Was gibt das Modell aus? Das erste Ergebnis ist ein Bildschirm quer, das zweite ein Abschnitt aus drei Bildschirmen nebeneinander.
    lang: python
    code: |
      BILD_B = 320
      TEMPO = 90  # Pixel pro Sekunde

      eins = BILD_B / TEMPO
      drei = 3 * eins
      print(round(eins, 1),
            round(drei, 1))
    expected: |
      3.6 10.7
    hints:
      - 320 / 90 ist etwas mehr als 3,5.
    explanation: |
      Ein Bildschirm quer dauert gut dreieinhalb Sekunden, drei Bildschirme knapp elf. Ein „kurzer Abschnitt“ ist im Spiel also wirklich kurz. Diese Zahlen helfen dir später beim Rhythmus: Was in elf Sekunden passieren soll, muss auf drei Bildschirme passen. Mit deinem eigenen Tempo kommen andere Werte heraus.
    resources:
      - title: Python · round()
        url: https://docs.python.org/3/library/functions.html#round

  - id: vorlauf-nach-oben
    type: output
    title: Wie früh siehst du, was kommt?
    prompt: |
      Die Kamera hält die Figur in der Bildmitte, Spielbild 320 × 180, Tempo 90 Pixel pro Sekunde (Platzhalter). Etwas erscheint am Bildrand, sobald es einen halben Bildschirm entfernt ist. Wie viele Sekunden vorher siehst du es, wenn du nach rechts und wenn du nach oben läufst? Was gibt das Modell aus?
    lang: python
    code: |
      BILD_B, BILD_H = 320, 180
      TEMPO = 90  # px/s, Platzhalter

      rechts = (BILD_B / 2) / TEMPO
      oben = (BILD_H / 2) / TEMPO
      print(round(rechts, 1),
            round(oben, 1))
    expected: |
      1.8 1.0
    hints:
      - Ein halber Bildschirm ist 160 Pixel breit und 90 Pixel hoch.
    explanation: |
      Nach rechts reicht der Blick 160 Pixel, das sind knapp zwei Sekunden Vorlauf. Nach oben sind es 90 Pixel und genau eine Sekunde. Im Breitbild siehst du beim Laufen nach oben oder unten also deutlich weniger voraus. Was dort hinter dem Bildrand wartet, braucht mehr Ankündigung, eine langsamere Annäherung oder eine Kamera, die in Laufrichtung vorausschaut. In Godot verschiebt dafür ein kleines Skript den `offset` der Kamera ([Camera2D, offset](https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-offset)).
    resources:
      - title: Godot Docs · Camera2D, offset
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-offset

  - id: begriffe-grundmodell
    type: gap
    title: Drei Ebenen und ein Rahmen
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Was der Designer erreichen will, ist die ⟦Absicht⟧. Was im Raum steht, um das zu bewirken, etwa Licht, ein Weg oder eine Landmarke, ist ein ⟦Hinweis⟧. Was Spieler tatsächlich tun, ist ihr ⟦Verhalten⟧. In der Draufsicht begrenzt der ⟦Bildschirm⟧ alles, was der Spieler gerade sehen kann.
    gaps:
      - label: im Kopf
        hint: Das Ziel des Designers, in einem Satz.
        accept: ["Designabsicht", "Ziel"]
      - label: im Raum
        hint: Englisch oft „cue“.
        accept: ["Cue", "Signal", "Hinweise"]
      - label: beim Spieler
        hint: Das, was du beim Zusehen beobachtest.
        accept: ["Spielerverhalten"]
      - label: der Rahmen
        hint: Bei 320 × 180 Pixeln sind es 20 × 11 Tiles.
        accept: ["Bildausschnitt", "Ausschnitt", "Kamerabild"]
    explanation: |
      Absicht, Hinweis und Verhalten sind das Grundmodell dieses Kurses. Gestalten kannst du nur die Hinweise, prüfen nur am Verhalten. Der Bildschirm ist in der Draufsicht der Rahmen, in dem jeder Hinweis wirken muss: Was nicht im Bild ist, kennt der Spieler nur aus der Erinnerung.

  - id: deutung-im-protokoll
    type: bug
    title: Eine Zeile zu viel gewusst
    prompt: |
      Lehrbeispiel: Notizen, nachdem du einen Freund den Hof aus dem Lehrbeispiel hast spielen sehen. Eine Zeile notiert eine Deutung, als wäre sie beobachtet. Finde sie.
    lang: prose
    code: |
      0:05 betritt den Hof von unten
      0:09 läuft geradeaus bis zum Brunnen
      0:11 bleibt am Brunnen stehen, die Figur zeigt nach links
      0:23 ist unsicher, wohin es weitergeht
      0:24 läuft zum Durchgang rechts oben
      0:31 kommt zurück und geht zum Tor
    lines: [4]
    explanation: |
      „Unsicher“ steht nirgends im Bild. Beobachtet hast du nur zwölf Sekunden ohne Bewegung am Brunnen. Er kann unsicher gewesen sein, aber auch den Brunnen betrachtet, eine Nachricht auf dem Handy gelesen oder überlegt haben, welchen Durchgang er zuerst nimmt. Schreib „0:11–0:23 steht still am Brunnen“ und die Deutung, wenn du willst, getrennt daneben. Wie man Beobachtung und Deutung in Protokollen trennt, zeigt [Testlesen und Playtest](/narrative/testlesen-playtest).
    hints:
      - Welche Zeile könnte eine Kamera nicht aufnehmen?

  - id: absicht-nicht-pruefbar
    type: bug
    title: Woran merkst du das?
    prompt: |
      Lehrbeispiel: eine Absichtsnotiz für einen kurzen Gang mit einer Abzweigung. Eine Zeile lässt sich beim Zusehen nicht prüfen. Finde sie.
    lang: prose
    code: |
      Abschnitt: Gang mit Abzweigung, zwei Bildschirme
      Absicht (ein Satz): Der Spieler soll den Seitengang bemerken, aber zuerst geradeaus gehen.
      Erwarteter Weg: geradeaus bis zur Tür, danach zurück in den Seitengang
      Hinweise (wo, was, wofür): Licht am Ende des Gangs, Fundstück halb sichtbar im Seitengang
      Zeichen, dass es klappt: Der Gang soll sich geheimnisvoll anfühlen.
      Zeichen, dass es scheitert: Der Spieler läuft am Seitengang vorbei und kommt nicht zurück.
    lines: [5]
    explanation: |
      „Geheimnisvoll anfühlen“ ist ein Gefühl, kein Zeichen. Beobachten könntest du etwa, dass der Spieler am Seitengang langsamer wird, kurz hineinschaut oder später zurückkommt. Ein Gefühl darfst du als Ziel haben; in die Notiz gehört, woran du beim Zusehen merkst, dass es eintritt. Zeile 6 dagegen ist beobachtbar und deshalb brauchbar.
    hints:
      - Vergleich die Zeilen 5 und 6. Welche könntest du auf einem Video abhaken?

  - id: hof-lesen
    type: explain
    title: Vier Durchgänge, ein Hof
    prompt: |
      Lehrbeispiel: ein Hof als Rasterkarte, ein Zeichen pro Tile. Der Spieler kommt bei `S` herein. Erkläre in drei bis fünf Sätzen, welcher Durchgang die meisten Spieler zuerst anziehen dürfte, welche Hinweise dafür sprechen und was du beobachten müsstest, um deine Vermutung zu prüfen.

      Legende: `#` Wand, `.` Boden, `o` Brunnen (niedrig), `+` Durchgang, `!` Laterne, `S` Start
    lang: text
    code: |
      ####+###############
      #..................#
      #..................+
      #........o.........#
      #..................#
      #.................!#
      +..................+
      #..................#
      #..................#
      #########S##########
    points:
      - Der Hof hat vier Durchgänge, oben links, links unten und zwei rechts.
      - Die Laterne steht neben dem unteren rechten Durchgang und macht ihn zum auffälligsten Punkt im Bild.
      - Der Brunnen steht genau auf der Linie vom Eingang nach oben und nimmt dem Weg geradeaus das Ziel.
      - Prüfen würdest du das am ersten Durchgang, den Tester ohne Erklärung nehmen, und an Halten oder Umkehren unterwegs.
    explanation: |
      Der Hof hat vier Durchgänge: einen oben links, einen links unten und zwei rechts. Am unteren rechten hängt die Laterne, das einzige Licht im Bild, und vermutlich gehen die meisten Spieler dorthin. Der Brunnen steht genau in der Achse vom Eingang nach oben. Er nimmt dem Weg geradeaus die Richtung und macht die Laterne als nächsten Punkt noch auffälliger. Prüfen kannst du das nur im Test: welchen Durchgang Tester zuerst nehmen, ob sie am Brunnen halten und ob jemand nach dem ersten Durchgang umkehrt. Ob dieser Hof gut ist, hängt an der Absicht. Soll der Spieler oben links hinaus, arbeitet die Laterne gegen dich.
    hints:
      - Zähl zuerst die Ausgänge und such dann das Einzige, das anders ist als alles andere.

  - id: was-nicht-wie
    type: explain
    title: Was, aber nicht wie
    prompt: |
      Dan Taylor, Level-Designer bei Square Enix Montreal, hat 2013 zehn Prinzipien guten Level-Designs vorgestellt. Hier der Titel des dritten Prinzips, ein Satz aus seiner Erläuterung zum ersten und einer aus der zum dritten. Erkläre in drei bis fünf Sätzen, was er meint, wie das zu Absicht, Hinweis und Verhalten passt und wo die Grenze liegt.
    lang: prose
    code: |
      Good level design tells the player what to do, but not how to do it.

      Careful layout, lighting, signage and other visual cues should create a natural “flow” to the level that guides the player instinctively through it.

      the player must never be in any doubt as to what their objective is.
    points:
      - Das Ziel („what“) soll klar sein, der Weg dorthin („how“) bleibt die Entscheidung des Spielers.
      - Layout, Licht und Zeichen sind Hinweise. Sie führen, ohne den Weg vorzuschreiben.
      - Ob die Führung „instinctively“ wirkt, zeigt nur das Verhalten der Spieler, nicht der Entwurf.
      - Die Grenze ist das Ziel selbst. Über das Ziel darf kein Zweifel bestehen, über den Weg schon.
    explanation: |
      Taylor trennt Ziel und Weg. Der Spieler soll wissen, was er erreichen will, etwa „hinaus aus dem Hof“, aber selbst herausfinden, wie. Das passt zum Grundmodell: Die Absicht legt das Ziel fest, die Hinweise im Raum machen es lesbar, und das Verhalten zeigt, ob die Führung so selbstverständlich wirkt, wie er es fordert. Die Grenze steht im letzten Satz. Unklarheit über den Weg kann Entdecken sein, Unklarheit über das Ziel ist ein Fehler im Level. Das schließt Geheimnisse nicht aus: Taylor hält versteckte Bereiche ausdrücklich für richtig, solange es Hinweise darauf gibt.
    hints:
      - Lies „what“ als Ziel und „how“ als Weg.
      - Welche Ebene des Grundmodells beschreibt „instinctively“?
    resources:
      - title: Dan Taylor, „Ten Principles of Good Level Design“, Teil 1 (Game Developer, 2013)
        url: https://www.gamedeveloper.com/design/ten-principles-of-good-level-design-part-1-
      - title: Dan Taylor, „Ten Principles for Good Level Design“ (GDC 2013, Video)
        url: https://www.youtube.com/watch?v=iNEe3KhMvXM

  - id: abschnitt-lesen
    type: practice
    title: Ein Abschnitt auf Karopapier
    prompt: |
      Nimm einen kurzen Abschnitt aus einem veröffentlichten Top-down-Spiel, das du spielst. Skizzier ihn auf Karopapier, ein Kästchen pro Tile, und füll die Notiz aus. Das Foto der Skizze bleibt bei dir; hier schreibst du nur die Notiz.
    lang: prose
    starter: |
      Spiel und Stelle:
      Mein Weg beim ersten Spielen:
      Hinweise (Ort, Art):
      Gesehen:
      Gedeutet:
      Vermutete Absicht (ein Satz):
    checklist:
      - Die Skizze hat einen Rahmen, der zeigt, wie viel davon auf einen Bildschirm passt.
      - Dein Weg beim ersten Spielen steht drin, aus dem Gedächtnis notiert.
      - Mindestens drei Hinweise sind mit Ort und Art genannt.
      - Unter „Gesehen“ steht nur, was eine Kamera aufnehmen könnte.
      - Die vermutete Absicht ist ein Satz und nennt ein beobachtbares Verhalten.
    explanation: |
      Diese Notiz ist die Grundform jeder Analyse in diesem Kurs. Später schreibst du dieselbe Notiz vor dem Bauen für deine eigenen Abschnitte, nur heißt die letzte Zeile dann „Absicht“ statt „vermutete Absicht“. Wenn du dieselbe Stelle in ein paar Wochen noch einmal liest, siehst du, wie sich dein Blick verändert hat.
    hints:
      - Für Maße zählst du Schritte oder vergleichst mit der Größe der Figur. Genau muss es nicht sein.
    resources:
      - title: The Level Design Book · Layout
        url: https://book.leveldesignbook.com/process/layout

  - id: erster-blick
    type: practice
    title: Wohin ging dein Blick?
    prompt: |
      Öffne ein Top-down-Spiel, das du noch nicht kennst, oder ein Video davon, das du noch nicht gesehen hast. Halt das erste Bild an, das einen neuen Raum zeigt. Notier, wohin dein Blick zuerst ging, dann zweitens, dann drittens, und vermute je einen Grund.
    lang: prose
    starter: |
      Spiel, Stelle:
      1. Blick:
      2. Blick:
      3. Blick:
      Wohin würde ich zuerst gehen:
    checklist:
      - Drei Blickpunkte in der Reihenfolge, in der du sie bemerkt hast.
      - Zu jedem Punkt steht ein möglicher Grund (Helligkeit, Farbe, Bewegung, Form, Lage im Bild).
      - Du nennst den Ort, zu dem du zuerst gehen würdest, und ob er einer deiner Blickpunkte ist.
    explanation: |
      Der erste Blick ist schnell und lässt sich nicht wiederholen. Deshalb hältst du ihn sofort fest. Die Gründe sind Vermutungen; welche Mittel den Blick wirklich lenken, behandelt [Komposition und Blickführung](/level-design/blickfuehrung). Liegt der Ort, zu dem du gehen würdest, nicht unter deinen Blickpunkten, hat dich etwas anderes gelenkt, etwa ein Weg oder eine Gewohnheit aus anderen Spielen.
    hints:
      - Video anhalten genügt. Der Rest geht ohne Spiel.
