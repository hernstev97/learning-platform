lesson: |
  Jenova Chen fasst das Ziel von Journey (thatgamecompany, 2012) in einem Satz: „The game’s goal is simple: go to the mountain.“ Im selben Interview erklärt er, warum sich Spieler in der weiten Wüste trotzdem nicht verlieren. Offene Flächen machen ratlos, „When you have open space it often feels like you don’t know where to go, you feel lost.“ Journey sei groß, aber geführt, „because there’s always a ‘doorway’, a giant ‘weenie’“. Das Wort stammt aus Disneys Parks und meint „something in the distance to guide you in the right direction“ ([Push Square, 2012](https://www.pushsquare.com/news/2012/02/interview_thatgamecompany_journey)). Welche Dinge im Spiel diese Rolle übernehmen, sagt Chen dort nicht im Einzelnen.

  In der Draufsicht gibt es keinen Horizont, an dem ein Ziel in der Ferne stehen könnte. Der Spieler sieht den Bildschirm, 20 × 11 Tiles im Platzhaltermaß dieses Kurses, und was er sich merkt. Orientierung muss aus diesem Rahmen und aus der Erinnerung kommen. Dieses Modul zeigt, aus welchen Elementen Spieler eine Karte im Kopf bauen, wie Landmarken in der Draufsicht funktionieren, wie du Sichtlinien setzt und wann Verlaufen zum Spiel gehört. Den Bildausschnitt und das Grundmodell aus Absicht, Hinweis und Verhalten kennst du aus [Level lesen](/level-design/raum-lesen), die Mittel, mit denen ein Bild den Blick lenkt, aus [Komposition und Blickführung](/level-design/blickfuehrung).

  ## Die mentale Karte: Lynchs fünf Elemente in der Draufsicht

  Das Level Design Book trennt zwei Fragen: „Wayfinding is when a player finds where they are in the level (orientation) and/or finds a route toward their destination (navigation).“ ([Wayfinding](https://book.leveldesignbook.com/process/blockout/wayfinding#what-is-wayfinding)) Für beide braucht der Spieler eine Vorstellung vom Raum, eine **mentale Karte**.

  Wie solche Karten aufgebaut sind, hat der Stadtplaner Kevin Lynch fünf Jahre lang in Boston, Jersey City und Los Angeles untersucht. Sein Buch „The Image of the City“ erschien 1960 bei MIT Press ([Verlagsseite](https://mitpress.mit.edu/9780262620017/the-image-of-the-city/)). Lynchs Kernsatz steht hier so, wie ihn ein Aufsatz der American Society of Appraisers zitiert, nicht nach dem Buch selbst: „The contents of the city images can conveniently be classified into five types of elements: paths, edges, districts, nodes, and landmarks.“ ([ASA, PDF](https://www.appraisers.org/docs/default-source/discipline_rp/site-analysis-part-9.pdf?sfvrsn=0)) Die Kurzbeschreibungen in der Mitte folgen der Zusammenfassung bei [Wikipedia](https://en.wikipedia.org/wiki/The_Image_of_the_City). Die rechte Spalte ist die Übertragung dieses Kurses.

  | Element | bei Lynch | in der Draufsicht |
  | --- | --- | --- |
  | Wege (paths) | Kanäle, in denen Menschen sich bewegen | Gänge, Pfade, Brücken, Treppen |
  | Kanten (edges) | Mauern, Gebäude, Ufer | Wände, Klippen, Wasser, Zäune, die Grenze zwischen zwei Böden |
  | Bereiche (districts) | größere Flächen, die man betritt und verlässt | Abschnitte mit eigenem Boden, Licht oder Material |
  | Knoten (nodes) | Orte, die man betritt, wo Wege zusammenlaufen | Kreuzungen, Plätze, Räume mit mehreren Ausgängen |
  | Landmarken (landmarks) | Bezugspunkte, die man nicht betritt | ein Turm, ein großer Baum, ein umgestürzter Pfeiler |

  Kanten sind nicht alle gleich. Das Level Design Book unterscheidet Barrieren, die Weg und Sicht sperren, etwa Wände, von solchen, die nur den Weg sperren, „deep pits, canyons, lava, rivers“ ([Direct](https://book.leveldesignbook.com/process/blockout/wayfinding#direct-95-98-certainty)). Die Rasterkarten dieses Kurses tragen den Unterschied in der Legende: `#` sperrt Weg und Sicht, `~` und `o` nur den Weg. Ein Fluss trennt zwei Bereiche und zeigt zugleich, was drüben liegt.

  Fehlt jeder Bezugspunkt, schätzen Menschen ihre Lage aus Richtung, Tempo und Zeit. Das Buch nennt das „dead reckoning“, eine Methode für Lagen, „when no landmarks are available“. Weil sich bei dieser Schätzung jeder Fehler zum nächsten addiert, wird sie mit jeder Abbiegung unsicherer. Wer durch drei gleiche Gänge gelaufen ist, weiß irgendwann nicht mehr, ob er zweimal oder dreimal links abgebogen ist.

  > [!TIP] Eine Karte aus dem Gedächtnis
  > Das Level Design Book verweist auf Mapstalgia, eine Sammlung von Karten, die Spieler aus dem Gedächtnis gezeichnet haben, „often beautiful and wildly inaccurate“. Das Buch nennt sie „the closest thing we have to a player's mental map“ ([Further reading](https://book.leveldesignbook.com/process/blockout/wayfinding#further-reading)). Zeichne einen Abschnitt aus einem Spiel, das du kennst, ohne nachzusehen. Was du richtig erinnerst, hat deine Karte getragen.

  ## Landmarken: einzigartig, sichtbar, beständig

  Bei Lynch, wieder nach dem Zitat der ASA, sind Landmarken Bezugspunkte, die man von außen nutzt: „the observer does not enter within them, they are external“. Ihr Gebrauch bedeutet „the singling out of one element from a host of possibilities“. Lynch unterscheidet zwei Arten:

  - **Ferne Landmarken** sieht man „from many angles and distances“. Manche stehen so weit weg, dass sie „for all practical purposes“ eine Richtung anzeigen, „a constant direction“. Seine Beispiele sind einzelne Türme, goldene Kuppeln, große Hügel, sogar die Sonne, weil sie sich langsam und regelmäßig bewegt.
  - **Nahe Landmarken** sind „visible only in restricted localities and from certain approaches“: Schilder, Schaufenster, Bäume, sogar Türknäufe. Auf sie verlassen sich Menschen umso mehr, je vertrauter ihnen ein Weg wird.

  Daraus leitet dieser Kurs drei Prüffragen ab:

  - **Einzigartig.** Gibt es das im Abschnitt nur einmal? Wikipedia fasst Lynch so zusammen, dass mindestens ein Merkmal „unique or memorable“ sein muss. Zwei gleiche Brunnen an zwei Kreuzungen sind keine Landmarken, sie machen die Kreuzungen verwechselbar.
  - **Sichtbar.** Ist sie dort im Bild, wo der Spieler sich entscheidet? Nicht hinter einer hohen Wand, nicht unter einem Dach, nicht im Dunkeln, nicht außerhalb der Kameragrenzen.
  - **Beständig.** Bleibt sie, wo sie ist, und sieht sie beim zweiten Besuch gleich aus? Ein patrouillierender Gegner, eine Truhe, die nach dem Öffnen verschwindet, oder ein Licht, das ausgeht, taugen schlecht.

  Lynch bemerkt auch über Knoten, die gelungensten schienen „both to be unique in some way and at the same time to intensify some surrounding characteristic“ (zitiert bei Wikipedia). Ein Knoten wird erkennbar, wenn er etwas Eigenes hat, das zum Bereich um ihn passt.

  In der Draufsicht ist die ferne Landmarke das schwierigste Element. Ein Turm am Horizont fehlt. Es gibt Ersatz, alles Übertragungen dieses Kurses: eine Kante, die über viele Bildschirme läuft und eine Richtung trägt, wie ein Fluss oder eine Mauer; ein Knoten, an dem der Spieler oft vorbeikommt; oder ein hohes Objekt in der 3/4-Ansicht. Dessen Bild ragt nach oben, sein oberes Ende ist deshalb noch zu sehen, wenn der Fuß schon unter dem unteren Bildrand liegt. Wie diese Ansicht gezeichnet wird, steht in [Grundkörper, Perspektive und Draufsicht](/pixelart/grundkoerper-raum).

  > [!MERKE] Drei Prüffragen für eine Landmarke
  > Gibt es sie nur einmal? Ist sie am Entscheidungspunkt im Bild? Bleibt sie, wie sie ist?

  ## Sichtlinien in der Draufsicht: Bildausschnitt, Verdecker, Licht

  „A sightline is a line of empty space where one area can be seen from another area.“ So definiert es das Level Design Book. Als Nutzen von Aussichtspunkten nennt es, „preview landmarks, and offer layout information“ ([Instead of prospect](https://book.leveldesignbook.com/process/blockout/massing/prospect-refuge#instead-of-prospect)). In der Draufsicht entscheiden vier Dinge darüber, ob es eine Sichtlinie gibt:

  1. **Bildausschnitt und Kameragrenzen.** Was nicht im Bild ist, sieht niemand.
  2. **Hohe Verdecker.** Wände, Dächer und hohe Bäume verdecken in der 3/4-Ansicht, was im Bild über ihnen liegt. Niedrige Hindernisse und Wasser verdecken nichts.
  3. **Licht und Dunkel.** Christopher Totten trennt Schatten, der versteckt, von Halbdunkel, das neugierig macht: „Where Shadow is primarily used to hide objects or the nature of spaces, Shade is used to obscure objects and evoke a sense of curiosity in players“ ([Game Developer, 2011](https://www.gamedeveloper.com/design/designing-better-levels-through-human-survival-instincts)).
  4. **Blickachsen.** Ein gerader Weg oder eine Öffnung, die auf die Landmarke zeigt, hält sie beim Gehen länger im Bild.

  Verdecken ist kein Fehler, sondern ein Werkzeug. Das zeigt ein Vortrag zu Breath of the Wild auf der japanischen Entwicklerkonferenz CEDEC 2017, über den das Fachmedium 4Gamer ausführlich berichtet hat. Die Sätze hier sind eigene Übersetzungen aus dem japanischen Bericht, keine Quelle von Nintendo ([4Gamer](https://www.4gamer.net/games/341/G034168/20170901120/)). Makoto Yonezu stellte dort eine Regel vor, die im Team „Regel der Felddreiecke“ hieß, englisch meist „Triangle Rule“. Das Gelände ist so gebaut, dass es aus Sicht des Spielers meist als Dreieck erscheint. Große Dreiecke wie Berge sind Landmarken, die man von weit her sieht. Mittlere verdecken Orte dahinter. Kleine Felsen und Hügel bestimmen das Tempo der Erkundung in der Nähe. Geht der Spieler weiter, erscheint, was das Dreieck verdeckt hat, und das weckt den Wunsch, als Nächstes dorthin zu gehen. Rechtecke verdecken vollständig und geben die Sicht plötzlich frei. Die englische Zusammenfassung bei [80 Level](https://80.lv/articles/the-design-secrets-of-breath-of-the-wild/) stützt sich auf Übersetzungen von Matt Walker und schreibt: „the team used them to surprise players, making them wonder what they’ll find on the other side.“

  Die Übertragung auf die Draufsicht ist deine Arbeit. Die Verdecker sind dort der Bildrand, hohe Wände, Dächer und Dunkelheit. Eine Öffnung zeigt die Sicht frei, wenn die Kamera an einer Wandkante vorbeiscrollt.

  ### Kameragrenzen: was nie ins Bild kommt

  Godot begrenzt mit `limit_left`, `limit_top`, `limit_right` und `limit_bottom`, wie weit die Kamera scrollt: „The camera stops moving when reaching this value“ ([Camera2D, limit_right](https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-limit-right)). Die Grenzen gelten für den Bildrand, nicht für die Bildmitte. Die Mitte bleibt deshalb einen halben Bildschirm von jeder Grenze entfernt. Nachgemessen mit Godot 4.7.2 in einem Bild von 320 × 180 Pixeln: Mit `limit_right = 640` bleibt die Bildmitte bei x = 480 stehen, auch wenn die Figur weiter nach rechts läuft.

  ```python run
  # halbe Bildbreite, Platzhalter
  HALB = 320 // 2

  def mitte_x(fx, links, rechts):
      m = max(fx, links + HALB)
      return min(m, rechts - HALB)

  # Landmarke bei 900, Raum 960
  for rechts in (640, 960):
      m = mitte_x(900, 0, rechts)
      sicht = abs(900 - m) <= HALB
      print(rechts, m, sicht)
  ```

  Mit einer Grenze bei 640 ist die Landmarke bei x = 900 nie im Bild, und die Figur läuft rechts aus dem Bild. Mit der Grenze am Rand des Raums, 960, steht die Mitte bei 800, und die Landmarke ist zu sehen.

  > [!WARNING] Grenzen schneiden auch Landmarken ab
  > Eine Landmarke, die jenseits einer Kameragrenze steht, etwa im nächsten Raum hinter der Wand, sieht der Spieler von hier aus nie. Prüf bei jeder Landmarke, von welchen Bildmitten aus sie im Bild ist. `offset` kann die Kamera laut Doku über die Grenzen schieben; das ist eine eigene Entscheidung.

  ## Knoten, Schleifen und Abkürzungen

  Knoten sind die Stellen, an denen Spieler sich entscheiden. Dort zählt Orientierung am meisten, und dort gehören Landmarken hin. Kommt der Spieler an einen Knoten zurück, erkennt er ihn und weiß wieder, wo er ist.

  Eine **Schleife** führt zu einem bekannten Knoten zurück, ohne denselben Weg zu nehmen. Der Spieler kann seine Karte im Kopf prüfen: Er kommt dort an, wo er es erwartet. Eine **Abkürzung**, die sich am Ende eines Wegs zum Knoten öffnet, spart den langen Rückweg. Das Level Design Book zählt die Frage, „how much backtracking should be allowed?“, zu den Maßen, die du für dein Spiel festlegst ([Pacing metrics](https://book.leveldesignbook.com/process/blockout/metrics#pacing-metrics)). Dan Taylor verlangt für Wege, die man zweimal geht, „bi-directional gameplay, preferably with a key modifier on the second pass“ ([Ten Principles, Teil 2](https://www.gamedeveloper.com/design/ten-principles-of-good-level-design-part-2-)). Der Rückweg soll sich anders spielen als der Hinweg.

  **Brotkrumen** sind eine Reihe von Fundstücken, die einen Weg zeigen. Das Buch schätzt ihre Wirkung hoch ein, auf 80 Prozent, und nennt „lines of collectible items or powerups (Donkey Kong Country)“ und Dinge, die man aus der Ferne sieht, „weenies“, dasselbe Disney-Wort wie bei Chen ([Situational](https://book.leveldesignbook.com/process/blockout/wayfinding#situational-70-93-certainty)).

  **Sackgassen** sind erlaubt, wenn sie etwas bieten. Taylor beschreibt eine Truhe in Skyrim, die „clearly visible from the main path“ ist, „but has no obvious access“. Der Lohn ist sichtbar, der Weg dahin muss gefunden werden. Breath of the Wild nennt das, was Spieler vom Weg abzieht, laut 4Gamer 引力, „Anziehungskraft“. Hidemaro Fujibayashi definierte sie als eine Kraft, die den Spieler zu einem Ort zieht, weil es sich für ihn lohnt (eigene Übersetzung). Eine Sackgasse ohne Lohn und ohne Grund kostet den Weg hinein und den Weg zurück.

  ## Gewolltes und ungewolltes Verlaufen

  Nicht jedes Verlaufen ist ein Fehler. Taylor hält es für richtig, Bereiche zu verstecken, „as long as you provide the necessary visual or narrative clues“, und sogar „to create areas where the player feels lost or confused, to create a sense of dramatic tension“ ([Ten Principles, Teil 1](https://www.gamedeveloper.com/design/ten-principles-of-good-level-design-part-1-)). Das Level Design Book warnt vor dem Gegenteil: „Heavy use of landmarking, signposting, and breadcrumbing, will make a level feel like Disneyland.“ Wer eine echte Wildnis will, kann laut Buch eine Art „anti-wayfinding“ brauchen ([Against wayfinding](https://book.leveldesignbook.com/process/blockout/wayfinding#against-wayfinding)).

  Breath of the Wild zeigt beide Seiten in einem Test. Laut 4Gamer verteilte das Team zuerst Türme als Ziele über die Welt und legte Ereignisse auf die Wege dazwischen. Testspieler, die den Straßen folgten, empfanden die Welt als einen einzigen vorgegebenen Weg. Wer die Straßen verließ, hatte den Eindruck, kaum auf Ereignisse zu treffen. Fujibayashi nannte das Erlebnis „im schlechten Sinn zerstückelt“ (eigene Übersetzung). Laut Bericht antwortete das Team darauf mit der Anziehungskraft: Orte, die unterwegs ins Blickfeld kommen und zu einem Umweg locken, nach dem der Spieler auf seinen Weg zurückkehrt.

  Für deine Abschnitte hilft eine Unterscheidung, die dieser Kurs vorschlägt:

  | | gewollt | ungewollt |
  | --- | --- | --- |
  | Ziel | Der Spieler weiß, was er sucht, oder weiß, dass er erkundet. | Der Spieler weiß nicht, was er sucht. |
  | Rückweg | Ein bekannter Knoten ist erreichbar. | Er findet nicht zurück. |
  | Ende | Das Suchen endet in einem Fund oder einem Ausblick. | Er läuft dieselbe Runde noch einmal. |

  Andrew Shouldice beschreibt für Tunic Phasen, in denen man etwas lernt. Eine davon ist „knowledge [phase] where you know something exists, but you don't understand it“ ([Game Developer, 2023](https://www.gamedeveloper.com/design/video-how-the-tunic-developers-built-a-mysterious-world)). Ein sichtbarer, noch unerreichbarer Ort ist so eine offene Frage. Gewollt ist sie, wenn der Spieler sie als Frage erkennt. Woran du ungewolltes Verlaufen beim Zusehen erkennst, etwa am Stehenbleiben an Knoten oder am Hin und Her zwischen zwei Gängen, behandelt [Playtests beobachten](/level-design/playtest-methode).

  ## Hilfen von subtil bis direkt: Karte und Kompass zuletzt

  Das Level Design Book ordnet Hilfen zur Orientierung in vier Stufen nach geschätzter Sicherheit, „a non-scientific estimate“: subtil (1 bis 20 Prozent), grob (35 bis 60), situativ (70 bis 93) und direkt (95 bis 98). Einige Beispiele aus den Tabellen:

  | Hilfe | Stufe | Schätzung |
  | --- | --- | --- |
  | ungewöhnliches Detail, etwa ein feiner Riss | subtil | 10 % |
  | Komposition, Sichtlinie auf eine Landmarke | grob | 35 % |
  | Licht und Farbe | grob | 40 % |
  | Brotkrumen aus Fundstücken | situativ | 80 % |
  | dauerhafte Zielmarkierung, Minikarte im HUD | direkt | 97 % |

  Der Rat dazu lautet: „When possible, it's considered good practice to start at the top, and gradually incorporate less subtle methods in response to playtesting.“ ([Wayfinding aids](https://book.leveldesignbook.com/process/blockout/wayfinding#wayfinding-aids)) Bei der direkten Stufe schreibt das Buch auch „sometimes it's OK to "give up"“. Eine Karte ist erlaubt. Sie ersetzt aber kein Layout, in dem man sich zurechtfindet, sie hilft nur, es zu lesen. Wie stark Markierungen im Raum sein dürfen, behandelt [Umgebung als Information](/level-design/umgebung-informiert). Auch Klang kann orientieren; das gehört in den späteren Sound-Kurs.

  > [!PRAXIS] Journey ohne Worte, Kompass und Karte
  > Chen sagt über Journey: „We used the environment to guide the player without using words, or compass, or map.“ Für Spieler, die zu weit abweichen, gibt es eine unsichtbare Wand, die sagt, „hey, that’s probably not the direction you wanna go“. Geprüft hat das Team es an vielen Menschen: „we’ve tested the game on at least 200 people and they all managed to find their way out themselves“ ([Push Square](https://www.pushsquare.com/news/2012/02/interview_thatgamecompany_journey)). Die Hilfen bleiben subtil, die harte Grenze kommt erst am Rand, und ob es reicht, zeigt der Test.

  > [!INTERVIEW] „Tester verlaufen sich in deinem Abschnitt. Was tust du?“
  > Zuerst schaue ich, wo es passiert, meist an einem Knoten, und ob es gewollt ist. Dann prüfe ich die Landmarke dort: Ist sie einzigartig, ist sie am Entscheidungspunkt mit unserer Kamera im Bild, bleibt sie gleich? Ich prüfe auch, ob es von dort eine Schleife oder Abkürzung zu einem bekannten Knoten gibt. Ich ändere eine Sache, etwa eine Sichtlinie oder eine stärkere Landmarke, und teste mit neuen Leuten. Erst wenn subtile Mittel nicht reichen, nehme ich direktere wie Brotkrumen oder eine Markierung auf der Karte.

  ## Häufige Fehler

  - **Gleiche Knoten.** Zwei Kreuzungen mit demselben Brunnen und denselben Böden. Der Spieler hält die zweite für die erste.
  - **Landmarke hinter einer hohen Wand.** In der 3/4-Ansicht verdeckt die Wand, was im Bild über ihr liegt, auch wenn es im Bildausschnitt ist.
  - **Landmarke jenseits der Kameragrenze.** Sie steht im Level, aber nie im Bild.
  - **Bewegliche Landmarken.** Ein Gegner oder ein Licht, das ausgeht, ist beim zweiten Besuch nicht mehr da.
  - **Sackgassen ohne Grund.** Hinweg und Rückweg kosten Zeit, und am Ende steht nichts. Danach misstraut der Spieler jedem Seitengang.
  - **Kein Rückweg zum Knoten.** Ein langer Weg ohne Schleife oder Abkürzung zwingt zum Zurücklaufen durch Bekanntes.
  - **Alles markiert.** Jede Abzweigung hat ein Licht und ein Fundstück, und der Abschnitt wirkt wie ein Themenpark.
  - **Karte statt Layout.** Die Minikarte zeigt den Weg, weil der Raum ihn nicht zeigt.

  ## Zusammenfassung

  - Spieler bauen eine mentale Karte aus Wegen, Kanten, Bereichen, Knoten und Landmarken. Ohne Bezugspunkte schätzen sie, und jede Abbiegung macht die Schätzung unsicherer.
  - Kanten sperren Weg und Sicht oder nur den Weg. Die Legende dieses Kurses trennt `#` von `~` und `o`.
  - Eine Landmarke ist einzigartig, am Entscheidungspunkt sichtbar und beständig. Ferne Landmarken zeigen eine Richtung, nahe tragen vertraute Wege.
  - In der Draufsicht entscheiden Bildausschnitt, Kameragrenzen, hohe Verdecker, Licht und Blickachsen über Sichtlinien. Verdecken ist ein Werkzeug für Überraschung und Anreiz.
  - Kameragrenzen gelten für den Bildrand. Die Bildmitte bleibt einen halben Bildschirm von jeder Grenze entfernt.
  - Schleifen und Abkürzungen führen zu bekannten Knoten zurück. Sackgassen brauchen einen Lohn.
  - Verlaufen ist gewollt, wenn der Spieler sein Ziel kennt und zurückfindet. Hilfen setzt du von subtil nach direkt, nach jedem Playtest eine Stufe, wenn nötig.
exercises:
  - id: lynch-zuordnen
    type: choice
    title: Fünf Elemente in einem Abschnitt
    prompt: |
      Lehrbeispiel: ein Top-down-Abschnitt mit einem Fluss, einer Brücke, einem Platz und einem Viertel. Welche Zuordnungen zu Lynchs fünf Elementen stimmen?
    options:
      - text: Ein Fluss, der den Abschnitt teilt und nur an einer Brücke überquert werden kann, ist eine Kante.
        correct: true
        why: Er trennt zwei Bereiche und begrenzt die Bewegung. Lynch nennt Ufer ausdrücklich als Kante. Weil er die Sicht nicht sperrt, zeigt er zugleich, was drüben liegt.
      - text: Ein Platz, auf den vier Gassen münden, ist ein Knoten.
        correct: true
        why: Man betritt ihn, und Wege laufen dort zusammen. Hier entscheidet sich der Spieler.
      - text: Ein Viertel mit rotem Pflaster und Laternen an jeder Ecke ist ein Bereich.
        correct: true
        why: Es ist eine größere Fläche mit gemeinsamen Merkmalen, die man betritt und verlässt.
      - text: Ein Hof, den man betritt und von dem drei Wege abgehen, ist eine Landmarke.
        correct: false
        why: Landmarken betritt man laut Lynch nicht, sie sind äußere Bezugspunkte. Ein Hof, an dem Wege zusammenlaufen, ist ein Knoten. Eine Statue in seiner Mitte könnte eine Landmarke sein.
    explanation: |
      Lynchs Elemente unterscheiden sich darin, was man mit ihnen tut. Auf Wegen bewegt man sich, Kanten begrenzen, Bereiche betritt man als Fläche, Knoten als Ort der Entscheidung, Landmarken nutzt man von außen. Ein Raum kann mehrere Rollen haben: Die Brücke ist ein Weg über eine Kante.
    hints:
      - Drei Aussagen sind richtig.
      - Betritt man eine Landmarke?
    resources:
      - title: Wikipedia · The Image of the City
        url: https://en.wikipedia.org/wiki/The_Image_of_the_City

  - id: landmarke-waehlen
    type: choice
    title: Woran erkennt man Kreuzung B?
    prompt: |
      Lehrbeispiel: Ein Abschnitt hat drei Kreuzungen, A, B und C, die der Spieler mehrmals passiert. An Kreuzung B soll er beim Zurückkommen sofort wissen, wo er ist. Welche Landmarke erfüllt die drei Prüffragen am besten?
    options:
      - text: Ein umgestürzter Pfeiler quer über der Kreuzung, der einzige im Abschnitt, von allen vier Zugängen aus im Bild.
        correct: true
        why: Er ist einzigartig, am Entscheidungspunkt sichtbar und bleibt liegen. Alle drei Prüffragen sind erfüllt.
      - text: Ein Brunnen, wie er auch an Kreuzung A und C steht.
        correct: false
        why: Er ist nicht einzigartig. Drei gleiche Brunnen machen die Kreuzungen verwechselbar, statt sie zu unterscheiden.
      - text: Ein auffällig gefärbter Gegner, der an der Kreuzung patrouilliert.
        correct: false
        why: Er bewegt sich und ist nach dem Kampf weg. Beim zweiten Besuch fehlt der Bezugspunkt.
      - text: Eine große Statue in einem Seitenraum neben der Kreuzung, sichtbar, sobald man den Seitenraum betritt.
        correct: false
        why: Sie ist von der Kreuzung aus nicht im Bild. Am Entscheidungspunkt hilft sie nicht.
    explanation: |
      Eine Landmarke muss dort wirken, wo der Spieler sich entscheidet, und sie muss beim zweiten Besuch dieselbe sein. Lynch beschreibt Landmarken als das Herausgreifen eines Elements aus vielen Möglichkeiten. Was es mehrfach gibt, was sich bewegt oder was man vom Knoten aus nicht sieht, kann diese Aufgabe nicht übernehmen.
    hints:
      - Prüf jede Option mit drei Fragen. Gibt es sie nur einmal, ist sie im Bild, bleibt sie?
    resources:
      - title: American Society of Appraisers · Land/Site Analysis, Part 9 (zitiert Lynch, PDF)
        url: https://www.appraisers.org/docs/default-source/discipline_rp/site-analysis-part-9.pdf?sfvrsn=0

  - id: hilfen-stufen
    type: order
    title: Von subtil bis direkt
    prompt: |
      Das Level Design Book ordnet Hilfen zur Orientierung nach der geschätzten Sicherheit, mit der Spieler sie bemerken und nutzen. Bring diese sechs Hilfen in die Reihenfolge des Buchs, von der subtilsten zur direktesten.
    lang: prose
    lines: |
      Eine Hommage an einen bekannten Ort erinnert nur Kenner an ein anderes Spiel.
      Ein feiner Riss in der Wand fällt als ungewöhnliches Detail auf.
      Eine Sichtlinie öffnet den Blick auf eine große Landmarke in der Ferne.
      Ein beleuchteter Eingang hebt sich in einem dunklen Raum ab.
      Eine Reihe Fundstücke führt zum Ziel.
      Eine dauerhafte Markierung im HUD zeigt das Ziel.
    explanation: |
      Das Buch schätzt die Hommage auf 1 Prozent, das ungewöhnliche Detail auf 10, Komposition und Sichtlinien auf 35, Licht und Farbe auf 40, Brotkrumen auf 80 und eine dauerhafte Markierung im HUD auf 97. Die Zahlen sind ausdrücklich keine Messung. Die Reihenfolge ist trotzdem nützlich: Du fängst oben an und gehst nur dann eine Stufe weiter, wenn der Playtest zeigt, dass die subtilere Hilfe nicht reicht.
    hints:
      - Licht und Sichtlinie liegen nah beieinander. Das Buch stellt Komposition und Sichtlinien knapp vor Licht und Farbe.
    resources:
      - title: The Level Design Book · Wayfinding aids
        url: https://book.leveldesignbook.com/process/blockout/wayfinding#wayfinding-aids

  - id: landmarke-im-bild
    type: output
    title: Von wo sieht man die Landmarke?
    prompt: |
      Ein Raum ist 640 × 360 Pixel groß, die Kameragrenzen liegen an seinen Rändern. Die Landmarke steht bei (600, 40). Das Modell gibt für vier Positionen der Figur, (100, 300), (450, 300), (450, 200) und (620, 100), die Bildmitte aus und ob die Landmarke im Bild ist. Die Bildmitten stimmen mit Godot 4.7.2 überein, nachgemessen. Was gibt es aus?
    lang: python
    code: |
      # halbes Bild, Platzhalter
      HB, HH = 160, 90
      # limit_left/top/right/bottom
      L, O, R, U = 0, 0, 640, 360
      # Landmarke
      LX, LY = 600, 40

      def klemme(w, a, b):
          return min(max(w, a), b)

      wege = [(100, 300), (450, 300),
              (450, 200), (620, 100)]
      for fx, fy in wege:
          mx = klemme(fx, L + HB, R - HB)
          my = klemme(fy, O + HH, U - HH)
          sx = abs(LX - mx) <= HB
          sy = abs(LY - my) <= HH
          print(mx, my, sx and sy)
    expected: |
      160 270 False
      450 270 False
      450 200 False
      480 100 True
    hints:
      - Die Bildmitte liegt waagerecht zwischen 160 und 480, senkrecht zwischen 90 und 270.
      - Senkrecht ist die Landmarke im Bild, wenn die Mitte höchstens 90 Pixel von y = 40 entfernt ist.
    explanation: |
      Bei (100, 300) klemmen beide Grenzen die Mitte auf (160, 270). Bei (450, 300) ist die Landmarke waagerecht nah genug, aber 230 Pixel zu weit oben. Bei (450, 200) sind es noch 160 Pixel, auch das ist mehr als ein halber Bildschirm hoch. Erst bei (620, 100) klemmt die rechte Grenze die Mitte auf x = 480, und die Landmarke ist 120 Pixel seitlich und 60 Pixel oben, also im Bild. Eine Landmarke in einer Ecke sieht man nur aus der Nähe dieser Ecke. Und weil das Bild nach oben nur 90 Pixel reicht, kostet jede Reihe Abstand nach oben mehr als zur Seite.
    resources:
      - title: Godot Docs · Camera2D, limit_bottom
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-limit-bottom

  - id: abkuerzung-sekunden
    type: output
    title: Was spart die Abkürzung?
    prompt: |
      Lehrbeispiel: Vom Ende eines Seitenwegs zurück zum Knoten sind es auf dem Hinweg 46 Tiles. Eine Abkürzung, die sich dort öffnet, ist 9 Tiles lang. Tiles sind 16 Pixel, die Figur läuft 90 Pixel pro Sekunde (Platzhalter). Wie viele Sekunden spart die Abkürzung? Runde auf eine Nachkommastelle und antworte mit der Zahl.
    lang: text
    code: |
      Sekunden = Tiles × 16 / 90
      Hinweg     46 Tiles
      Abkürzung   9 Tiles
    expected: |
      6.6
    accept: ["6,6", "6,6 s", "6.6 s", "6,6 Sekunden"]
    explanation: |
      Der Hinweg dauert 46 × 16 / 90 = 8,2 Sekunden, die Abkürzung 9 × 16 / 90 = 1,6. Die Differenz sind 37 × 16 / 90 = 6,58, gerundet 6,6 Sekunden. Das klingt wenig, aber ein Spieler, der denselben Weg zum dritten Mal zurückläuft, spürt jede davon. Wie viel Rückweg dein Spiel verträgt, legst du als eigenes Maß fest, das Level Design Book zählt es zu den Pacing-Metriken.
    resources:
      - title: The Level Design Book · Metrics, Pacing metrics
        url: https://book.leveldesignbook.com/process/blockout/metrics#pacing-metrics

  - id: lynch-begriffe
    type: gap
    title: Die Karte im Kopf
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Lynch teilt die mentale Karte einer Stadt in fünf Elemente: Wege, ⟦Kanten⟧, Bereiche, ⟦Knoten⟧ und ⟦Landmarken⟧. Eine Landmarke betritt man nicht, sie ist ein äußerer ⟦Bezugspunkt⟧. Ohne Landmarken schätzen Menschen ihre Lage aus Richtung, Tempo und Zeit. Das Level Design Book nennt das dead ⟦reckoning⟧.
    gaps:
      - label: Grenzen
        hint: Mauern, Ufer und Klippen gehören dazu.
        accept: ["Ränder", "Grenzen", "edges"]
      - label: Entscheidungsorte
        hint: Dort laufen Wege zusammen.
        accept: ["nodes", "Knotenpunkte"]
      - label: Bezugspunkte
        hint: Ein Turm oder ein großer Baum.
        accept: ["landmarks", "Wahrzeichen", "Landmarks"]
      - label: was eine Landmarke ist
        hint: Lynch spricht von „point-reference“.
        accept: ["Orientierungspunkt", "Referenzpunkt", "point-reference", "Punkt", "Bezugspunkte"]
      - label: Koppelnavigation
        hint: Das englische Wort für die Rechnung der Seefahrer.
        accept: ["Reckoning", "dead reckoning", "Dead Reckoning"]
    explanation: |
      Wege, Kanten, Bereiche, Knoten und Landmarken sind Lynchs Bausteine der mentalen Karte. Landmarken sind äußere Bezugspunkte, an Knoten entscheidet man sich. Dead reckoning ist die Notlösung ohne Bezugspunkte. Sie funktioniert, wird aber mit jeder Abbiegung ungenauer.
    resources:
      - title: The Level Design Book · Wayfinding, Psychology
        url: https://book.leveldesignbook.com/process/blockout/wayfinding#psychology

  - id: landmarke-verdeckt
    type: bug
    title: Die Landmarke, die keiner sieht
    prompt: |
      Lehrbeispiel in der 3/4-Ansicht. Eine Mauer aus `#` ist im Bild zwei Tiles höher als ihr Fuß und verdeckt deshalb, was in den zwei Reihen direkt über ihr liegt. Der Spieler startet bei `S` und soll beim Hochlaufen die Landmarke `L` sehen. Kein Tester erwähnt sie. Finde die Zeile, die sie verdeckt.

      Legende: `#` hohe Wand, `.` Boden, `+` Durchgang, `S` Start, `L` Landmarke (ein Tile hoch gezeichnet)
    lang: text
    code: |
      ####################
      #..................#
      #.......L..........#
      #..................#
      #..######+######...#
      #..................#
      #..................#
      +.........S........#
      ####################
    lines: [5]
    explanation: |
      Die Mauer in Zeile 5 steht zwei Reihen unter der Landmarke, genau in derselben Spalte. In der 3/4-Ansicht reicht ihr Bild zwei Tiles nach oben und deckt Zeile 4 und 3 ab, also auch `L`. Der Durchgang liegt eine Spalte daneben, die Sichtlinie durch ihn trifft die Landmarke nicht. Abhilfe: die Landmarke über den Durchgang oder weiter nach oben setzen, die Mauer durch niedrige Hindernisse ersetzen oder die Landmarke höher zeichnen als die Mauer. Welche Lösung passt, hängt davon ab, ob der Spieler sie schon vor dem Durchgang sehen soll.
    hints:
      - Zähl von der Landmarke zwei Reihen nach unten.

  - id: grenze-schneidet
    type: bug
    title: Die Kamera bleibt stehen
    prompt: |
      Lehrbeispiel: Kameraeinstellungen für einen Raum. Läuft die Figur nach rechts, verschwindet sie ab x = 640 aus dem Bild, und die Landmarke taucht nie auf. Finde die Zeile und korrigiere sie.
    lang: text
    code: |
      Raum: 960 × 360 Pixel
      Landmarke: x = 900, y = 60
      limit_left = 0
      limit_right = 640
      limit_top = 0
      limit_bottom = 360
    lines: [4]
    fix:
      - line: 4
        answers: ["limit_right = 960", "limit_right=960"]
    explanation: |
      `limit_right` gilt für den rechten Bildrand. Mit 640 bleibt die Bildmitte bei 640 − 160 = 480 stehen, das Bild reicht bis x = 640. Was rechts davon liegt, auch die Figur und die Landmarke bei 900, ist nie im Bild. Mit 960, dem Rand des Raums, kann die Mitte bis 800 wandern, und die Landmarke ist zu sehen. Solche Werte stammen oft aus einer früheren, kleineren Fassung des Raums.
    resources:
      - title: Godot Docs · Camera2D, limit_right
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-limit-right

  - id: journey-weenie
    type: explain
    title: Etwas in der Ferne
    prompt: |
      Jenova Chen im Interview mit Push Square (2012) über Journey, wörtlich zitiert. Erkläre in drei bis fünf Sätzen, wie Journey laut Chen die Orientierung löst, welche Rolle die unsichtbare Wand spielt und was davon in der Draufsicht nicht direkt funktioniert.
    lang: prose
    code: |
      When you have open space it often feels like you don’t know where to go, you feel lost. You don’t know how to navigate. Actually in Journey we can say it’s huge but the experience is rather guided, because there’s always a ‘doorway’, a giant ‘weenie’ — which is a Disney term, it’s something in the distance to guide you in the right direction. If you were to wander really far away from the map, we do have an invisible wall that tells you, “hey, that’s probably not the direction you wanna go.” So we’ve tested the game on at least 200 people and they all managed to find their way out themselves, so we’re pretty proud of that. We used the environment to guide the player without using words, or compass, or map.
    points:
      - Eine offene Fläche ohne Ziel macht ratlos. Ein sichtbares Ziel in der Ferne gibt die Richtung.
      - Der „weenie“ ist immer da und zieht, die unsichtbare Wand fängt erst ab, wer sehr weit abweicht.
      - Chen verzichtet auf Text, Kompass und Karte und belegt die Wirkung mit Tests an mindestens 200 Menschen.
      - In der Draufsicht fehlt der Horizont. Ein Ziel in der Ferne muss in den Bildausschnitt passen oder als Kante, Richtung oder Erinnerung weitergetragen werden.
    explanation: |
      Chen beschreibt eine Stufenfolge. Zuerst zieht immer etwas Sichtbares in der Ferne in die richtige Richtung, ein „weenie“ im Sinn der Disney-Parks. Erst wer sehr weit abweicht, trifft auf eine unsichtbare Wand, die ihn zurückschickt. Text, Kompass oder Karte braucht es dabei nicht, und das Team hat an mindestens 200 Testern geprüft, dass es reicht. In der Draufsicht lässt sich das nicht eins zu eins übernehmen, weil es keinen Horizont gibt. Das Ziel in der Ferne wird dort zu etwas, das im Bildausschnitt erscheint, wenn der Spieler sich entscheidet, oder zu einer Kante, die über viele Bildschirme eine Richtung trägt.
    hints:
      - In welcher Reihenfolge greifen „weenie“ und unsichtbare Wand?
    resources:
      - title: Push Square · Interview mit Jenova Chen zu Journey
        url: https://www.pushsquare.com/news/2012/02/interview_thatgamecompany_journey

  - id: dreiecksregel
    type: explain
    title: Dreiecke, die verdecken
    prompt: |
      Hier stehen zwei Berichte über einen CEDEC-Vortrag zu Breath of the Wild (2017): zwei Sätze aus 80 Level, das sich auf Übersetzungen von Matt Walker stützt, und eine Zusammenfassung aus dem japanischen Bericht von 4Gamer in eigener Übersetzung. Erkläre in drei bis fünf Sätzen, was die Regel bewirken soll, wozu die drei Größen dienen und wie sich die Idee auf die Draufsicht übertragen lässt.
    lang: prose
    code: |
      80 Level: „By using triangles they could give players a choice as to whether to go straight over the triangle, or around it.“ / „The triangles is also said obscure the player’s view, so the team used them to surprise players, making them wonder what they’ll find on the other side.“

      4Gamer (eigene Übersetzung): Große Dreiecke wie Berge sind Landmarken, die man von weit her sieht. Mittlere verdecken weiter entfernte Orte. Kleine, etwa Felsen, bestimmen das Tempo der Erkundung in der Nähe. Rechtecke verdecken ganz und geben die Sicht plötzlich frei.
    points:
      - Dreiecke lassen die Wahl zwischen drüber und drumherum und verdecken, was dahinter liegt.
      - Das Verdecken ist Absicht. Beim Weitergehen öffnet sich die Sicht und zeigt ein neues Ziel.
      - Die drei Größen haben drei Aufgaben, Landmarke, Verdecker und Tempo.
      - In der Draufsicht verdecken Bildrand, hohe Wände in der 3/4-Ansicht, Dächer und Dunkelheit. Mit ihnen lässt sich dieselbe Folge aus Verdecken und Freigeben bauen.
      - Es ist der Bericht über einen Vortrag, übersetzt. Eine Primärquelle von Nintendo gibt es dazu nicht.
    explanation: |
      Die Regel nutzt Gelände, um den Blick zu steuern. Ein Dreieck bietet zwei Wege an, drüber oder drumherum, und versteckt, was dahinter liegt. Geht der Spieler weiter, öffnet sich die Sicht, und das, was erscheint, wird zum nächsten Ziel. Große Dreiecke sind Landmarken, mittlere verdecken, kleine geben in der Nähe den Takt vor. In der Draufsicht gibt es keine Berge, die den Blick verstellen, aber den Bildrand, hohe Wände, Dächer und Dunkelheit. Mit ihnen kann ich dieselbe Folge bauen: verdecken, freigeben, neues Ziel. Weil die Quelle ein übersetzter Bericht ist, nenne ich sie auch so.
    hints:
      - Was passiert, wenn der Spieler um ein Dreieck herumgeht?
    resources:
      - title: 80 Level · The Design Secrets of Breath of the Wild
        url: https://80.lv/articles/the-design-secrets-of-breath-of-the-wild/
      - title: 4Gamer · Bericht zum CEDEC-Vortrag (Japanisch)
        url: https://www.4gamer.net/games/341/G034168/20170901120/

  - id: karte-aus-dem-gedaechtnis
    type: practice
    title: Eine Karte aus dem Gedächtnis
    prompt: |
      Wähle einen Abschnitt aus einem Top-down-Spiel, das du länger gespielt hast, etwa ein Dorf oder einen Dungeon. Zeichne ihn auf Papier aus dem Gedächtnis, ohne nachzusehen. Vergleiche die Skizze danach mit einer Karte oder einem Video. Notiere in höchstens fünf Stichpunkten, was du findest.
    lang: prose
    starter: |
      Spiel und Abschnitt:
      Richtig erinnert:
      Falsch oder vergessen:
      Woran ich mich festgehalten habe (Element nach Lynch):
    checklist:
      - Die Skizze entstand, bevor du nachgesehen hast.
      - Du nennst mindestens zwei Dinge, die du richtig erinnert hast, und zwei, die fehlten oder falsch waren.
      - Jedes Erinnerte ist einem von Lynchs fünf Elementen zugeordnet.
      - Du nennst mindestens eine Landmarke oder einen Knoten, an dem du dich orientiert hast.
    explanation: |
      Was du richtig erinnerst, hat deine mentale Karte getragen. Was fehlt oder falsch liegt, zeigt Stellen, an denen der Raum keinen Halt geboten hat. Die Sammlung Mapstalgia, auf die das Level Design Book verweist, besteht aus genau solchen Karten. Dieselbe Übung kannst du später mit Testern deiner eigenen Abschnitte machen.
    hints:
      - Fang mit dem Knoten an, an dem du am häufigsten warst.
    resources:
      - title: The Level Design Book · Wayfinding, Further reading
        url: https://book.leveldesignbook.com/process/blockout/wayfinding#further-reading

  - id: landmarken-pruefen
    type: practice
    title: Drei Stellen, drei Prüffragen
    prompt: |
      Nimm einen Abschnitt, an dem du arbeitest, oder eine Skizze dazu. Welche Stellen das sind, an denen sich Spieler orientieren sollen, wählst du selbst, höchstens drei. Prüf für jede ihre Landmarke mit den drei Prüffragen und notier das Ergebnis kurz. Layout, Stellen und Landmarken entscheidest du; eine KI darf dir höchstens bei der Technik helfen, etwa mit einem Skript, das Bildmitten ausrechnet.
    lang: prose
    starter: |
      Stelle 1 (Knoten, Entscheidung):
      Landmarke: einzigartig? sichtbar? beständig?
      Stelle 2:
      Stelle 3:
      Schleife oder Abkürzung zu einem Knoten:
    checklist:
      - Jede Stelle nennt einen Knoten oder eine Entscheidung des Spielers.
      - Für jede Landmarke ist notiert, ob es sie im Abschnitt nur einmal gibt.
      - Für jede ist geprüft, ob sie vom Entscheidungspunkt aus im Bildausschnitt liegt, mit deinen Werten für Bildgröße und Kameragrenzen, und nicht hinter einer hohen Wand oder unter einem Dach.
      - Für jede ist notiert, ob sie sich bewegen, verschwinden oder verändern kann.
      - Mindestens eine Stelle hat eine Schleife oder Abkürzung zurück zu einem bekannten Knoten.
    explanation: |
      Die Prüffragen ersetzen keinen Test, aber sie finden die häufigsten Fehler vorher: verwechselbare Knoten, verdeckte oder abgeschnittene Landmarken, Bezugspunkte, die beim zweiten Besuch fehlen. Was die Stellen sind und wie die Landmarken aussehen, entscheidest du. Ob Spieler sich daran orientieren, zeigt der Playtest in [Playtests beobachten](/level-design/playtest-methode).
    hints:
      - Für die Sichtbarkeit genügt ein Rahmen von 20 × 11 Kästchen um den Entscheidungspunkt auf deiner Skizze.
    resources:
      - title: The Level Design Book · Wayfinding
        url: https://book.leveldesignbook.com/process/blockout/wayfinding
