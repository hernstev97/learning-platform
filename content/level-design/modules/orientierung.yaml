id: orientierung
title: Wege, Landmarken und Sichtlinien
level: 2
minutes: 100
summary: Wie Spieler eine Karte im Kopf bauen – Lynchs Wege, Kanten, Bereiche, Knoten und Landmarken in der Draufsicht –, wie du Landmarken und Sichtlinien mit Bildausschnitt, Kameragrenzen, hohen Verdeckern und Licht setzt und wann Verlaufen zum Spiel gehört.
place: unterwegs
goals:
  - Du ordnest die Teile eines Top-down-Abschnitts Lynchs fünf Elementen zu und erkennst, wo die mentale Karte keinen Halt hat.
  - Du unterscheidest ferne und nahe Landmarken und prüfst sie darauf, ob sie einzigartig, sichtbar und beständig sind.
  - Du rechnest mit den Kameragrenzen von Godot aus, ob eine Landmarke von einer Stelle aus im Bild ist.
  - Du setzt Sichtlinien, Verdecker, Schleifen und Abkürzungen zu Knoten bewusst ein.
  - Du unterscheidest gewolltes von ungewolltem Verlaufen und wählst Hilfen von subtil bis direkt, Karte und Kompass zuletzt.
