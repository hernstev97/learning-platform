id: werkstatt-abschnitt
title: "Werkstatt: dein begehbarer Abschnitt"
level: 3
minutes: 240
summary: Der ganze Zyklus an einem Abschnitt, den du selbst auswählst – Umfang, Absichtsnotiz, Skizze, Blockout, eine Testrunde mit mindestens drei Testern ohne Erklärung, ein Vergleich von Absicht und Verhalten mit Spuren, mindestens eine Überarbeitung und auf Wunsch die Ausgestaltung mit Regressionstest.
place: pc
goals:
  - Du wählst einen Abschnitt von 2 bis 4 Bildschirmen mit einer einzigen Absicht und schreibst sie als Absichtsnotiz mit beobachtbaren Zeichen.
  - Du übersetzt die Zeichen deiner Absichtsnotiz in Zonen und Zahlen, die der Wegschreiber misst.
  - Du baust Skizze und Blockout, testest mit mindestens drei Personen, ohne zu erklären, und sicherst jede Runde mit Tag, Protokollen und Spuren.
  - Du vergleichst Absicht und Verhalten in einer Tabelle und trennst Beobachtung von Deutung.
  - Du überarbeitest eine Stelle pro Runde, prüfst die Änderung mit neuen Testern und dokumentierst den Weg in einer Werkstattmappe.
resources:
  - title: The Level Design Book · Blockout, „How to blockout“
    url: https://book.leveldesignbook.com/process/blockout
  - title: The Level Design Book · Playtesting
    url: https://book.leveldesignbook.com/process/blockout/playtesting
  - title: Jakob Nielsen · Why You Only Need to Test with 5 Users (NN/g, 2000)
    url: https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/
  - title: Kim Swift, Erik Wolpaw · Portal Post-Mortem (Folien, GDC 2008)
    url: https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf
lesson: |
  Dieses Modul bringt keinen neuen Stoff. Es lässt dich den Zyklus des Kurses einmal ganz durchlaufen, an einem Abschnitt, den du auswählst: Absicht notieren, skizzieren, blocken, testen, vergleichen, überarbeiten, wieder testen. Am Ende hast du einen Abschnitt, der nachweislich tut, was du wolltest, oder eine begründete neue Absicht. Dazu eine Mappe, die zeigt, wie du dahin gekommen bist.

  Plane dafür mehrere Tage ein. Am PC sitzt du ungefähr vier Stunden; dazu kommt die Zeit, bis drei Menschen für einen Test Zeit haben. Welchen Ort du baust, ob aus deinem Spiel oder ein neutraler Übungsraum, entscheidest du. Der Kurs gibt dir keinen vor. Eine KI darf dir Skripte schreiben, Dateien sortieren und Tabellen formatieren. Die Absicht, das Layout, die Hinweise und die Deutung der Beobachtungen sind deine Arbeit.

  ## Der Zyklus im Überblick

  Das Level Design Book fasst den Ablauf für einen Blockout in Schritten zusammen: skizzieren, testen, „Diverge, iterate, and playtest again“, wiederholen ([Blockout](https://book.leveldesignbook.com/process/blockout)). In diesem Kurs sieht das so aus:

  | Schritt | Grundlage | Ergebnis |
  | --- | --- | --- |
  | 1. Umfang wählen | [Absicht notieren, Layout skizzieren](/level-design/absicht-skizze) | 2 bis 4 Bildschirme, eine Absicht |
  | 2. Absichtsnotiz | [Absicht notieren, Layout skizzieren](/level-design/absicht-skizze) | Notiz mit beobachtbaren Zeichen |
  | 3. Skizze | [Absicht notieren, Layout skizzieren](/level-design/absicht-skizze) | Karopapier im Tile-Maßstab, erwarteter Weg |
  | 4. Blockout | [Blockout in Godot](/level-design/blockout) | Abschnitt mit Tag `r1`, Selbsttest |
  | 5. Testrunde 1 | [Beobachten, ohne zu erklären](/level-design/playtest-methode), [Playtest am PC](/level-design/playtest-godot) | 3 Protokolle, Wege, Übersichtsbild |
  | 6. Vergleich | dieses Modul | Tabelle Absicht gegen Verhalten |
  | 7. Überarbeitung | [Überarbeiten](/level-design/ueberarbeiten) | eine Änderung, Tag `r2` |
  | 8. Testrunde 2 | wie Runde 1, neue Tester | zweiter Vergleich |
  | 9. Ausgestaltung (optional) | [Vom Blockout zur Ausgestaltung](/level-design/ausgestaltung) | Dressing, Regressionstest |
  | 10. Rückblick | dieses Modul | Werkstattmappe |

  Die Übungen dieses Moduls folgen diesen Schritten. Jede Praxisaufgabe hat eine Checkliste, die prüft, ob ein Schritt vollständig ist, nicht ob dein Abschnitt gefällt.

  ## Umfang: klein genug, um ihn dreimal zu bauen

  Ein Abschnitt von 2 bis 4 Bildschirmen ist klein genug, um ihn nach jedem Test umzubauen, und groß genug für eine echte Entscheidung des Spielers. Mit den Platzhaltern des Kurses, 320 × 180 Pixel und 90 Pixel pro Sekunde, quert die Figur einen Bildschirm in 3,6 Sekunden. Ein Tester, der sucht, braucht für 2 bis 4 Bildschirme eher ein bis drei Minuten. Mit Begrüßung und ein paar Fragen danach sind das gut zehn Minuten pro Person, für drei Tester also eine gute halbe Stunde, mit Aufbau und Pausen etwa 45 Minuten.

  Wichtiger als die Größe ist, dass der Abschnitt **eine** Frage stellt. Zwei Absichten in einem Abschnitt, etwa „Der Spieler soll den Seitengang entdecken“ und „Der Spieler soll vor der Freifläche einen Überblick bekommen“, kannst du nach einem Test nicht auseinanderhalten. Wähl eine. Die zweite bekommt einen eigenen Abschnitt.

  > [!MERKE]
  > Ein Abschnitt, eine Absicht, eine Änderung pro Runde. Nur so kannst du sagen, was gewirkt hat.

  ## Von der Absicht zu Zonen und Zahlen

  Die Absichtsnotiz kennst du aus [Absicht notieren, Layout skizzieren](/level-design/absicht-skizze):

  ```text
  Abschnitt:
  Absicht (ein Satz): Der Spieler soll …
  Erwarteter Weg:
  Hinweise (wo, was, wofür):
  Zeichen, dass es klappt:
  Zeichen, dass es scheitert:
  ```

  In der Werkstatt kommt ein Schritt dazu: Jedes Zeichen bekommt eine Messung. Was der Wegschreiber aus [Playtest am PC](/level-design/playtest-godot) zählen kann, sind Zonen, Zeiten, Halte und Wege. Ein Lehrbeispiel mit neutralen Orten:

  | Zeichen in der Notiz | Messung | Quelle |
  | --- | --- | --- |
  | erreicht das Tor, ohne den Seitengang zu betreten | Zone `Tor` im Log, `Seitengang` nicht | Zonen-Log |
  | erreicht das Tor in unter 40 Sekunden | Zeit des ersten Eintrags `Tor` | Zonen-Log |
  | bleibt an der Gabelung nicht länger als 3 Sekunden stehen | höchstens 12 Punkte auf einer Stelle | Übersichtsbild, CSV |
  | sagt etwas über die Laterne, bevor er losgeht | Eintrag im Protokoll | Beobachtung |

  Die Grenzen, 40 Sekunden oder 3 Sekunden, setzt du vor dem Test, aus deinem Maßstabsraum und deinem eigenen Durchlauf. Setzt du sie danach, passt du sie unbewusst an das an, was du gesehen hast. Valve beschreibt diese Haltung in den Folien zum Playtesting so: „Game designs are hypotheses“, „Playtests are experiments“ ([Ambinder, GDC 2009](https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf)). Die Absichtsnotiz ist deine Hypothese, die Grenzen sagen, wann sie widerlegt ist.

  Nicht jedes Zeichen lässt sich messen. „Der Spieler fühlt sich frei“ beobachtest du weder in einer Spur noch im Protokoll. Formulier es als Verhalten, etwa „Der Spieler betritt mindestens zwei der drei Bereiche, bevor er zum Ausgang geht“, oder lass es weg.

  ## Testrunde: mindestens drei Tester, keine Erklärung

  Jakob Nielsen hat für Usability-Tests von Software begründet, warum wenige Tester pro Runde und mehrere Runden besser sind als ein großer Test: „The best results come from testing no more than 5 users and running as many small tests as you can afford.“ Zum Minimum schreibt er: „Even 3 users are enough to get an idea of the diversity in user behavior and insight into what's unique and what can be generalized“ ([NN/g, 2000](https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/)). Ein Level ist keine Software-Oberfläche, aber die Rechnung trägt: Ein einzelner Tester kann zufällig richtig oder falsch gehen, bei dreien siehst du, ob ein Muster da ist, und eine zweite Runde ist besser als zwei weitere Tester in der ersten.

  Für jede Sitzung gilt, was du in den Testmodulen geübt hast: getaggter Stand, Einverständnis, Sitzungsnummer statt Namen, Notizen und Spuren im Spiel aus, Stoppuhr mit dem Spielstart, Protokoll ohne Deutung. Das Level Design Book nennt die Form, die du brauchst, einen blinden Playtest, „with minimal guidance or prompting; pretend they are playing the level by themselves, alone, and see what they do“ ([Playtesting](https://book.leveldesignbook.com/process/blockout/playtesting)). Eingreifen darfst du, wenn jemand ganz festsitzt; dann steht der Eingriff mit Zeit im Protokoll, und alles danach zählt für dieses Zeichen nicht mehr.

  Die Tester einer Runde kennen den Abschnitt nicht. Für Runde 2 brauchst du neue, sonst misst du, was sie sich gemerkt haben.

  ## Vergleich: Absicht gegen Verhalten

  Nach der Runde legst du Absichtsnotiz, Protokolle, Zonen-Logs und Übersichtsbild nebeneinander und füllst eine Tabelle, ein Zeichen pro Zeile, ein Tester pro Spalte:

  ```text
  Runde 1 · Stand r1 · T1–T3
  Zeichen                     T1         T2                  T3                  Quelle
  Tor ohne Seitengang         ja         nein, Seitengang    nein, Seitengang    Zonen-Log
                                         ab 0:14             ab 0:18
  Tor in unter 40 s           ja, 0:21   nein, 1:01          nein, nie           Zonen-Log
  Halt an Gabelung über 3 s   nein       ja, 0:09–0:13       ja, 0:13–0:18       Übersicht
  Laterne erwähnt             ja         nein                nein                Protokoll
  ```

  Diese Tabelle ist reine Beobachtung. Erst darunter schreibst du, was du vermutest, mit Verweis auf die Protokollzeile: „T2, 0:09: bleibt an der Gabelung stehen, dreht die Figur zweimal nach links, sagt nichts; 0:14 im Seitengang.“ Die Diagnose führt [Überarbeiten](/level-design/ueberarbeiten) aus: Jede Stelle, an der ein Zeichen nicht eingetreten ist, bekommt eine der vier Arten „nicht bemerkt“, „falsch gelesen“, „nicht befolgt“ oder „unbeabsichtigte Folge“, mit Beleg aus dem Protokoll. Ist ein Zeichen eingetreten, steht dort „Absicht erfüllt“.

  Die Tabelle hat zwei mögliche Ausgänge. Entweder die Zeichen sind eingetreten, dann ist der Abschnitt für diese Absicht fertig. Oder nicht, dann entscheidest du: Änderst du einen Hinweis, oder änderst du die Absicht? Beides ist erlaubt. Eine Absicht bewusst zu ändern ist ehrlicher, als das Level so lange zu biegen, bis die Zahlen passen. Welche Entscheidung du triffst, entscheidest du; die Tabelle sagt dir nur, worüber.

  ## Überarbeiten und zweite Runde

  Pro Runde änderst du eine Stelle, wie in [Überarbeiten](/level-design/ueberarbeiten) und [Tuning als Experiment](/combat/tuning). Die Änderung kommt mit Begründung ins Iterationsprotokoll, der Stand bekommt einen neuen Tag, dann testest du mit neuen Testern und füllst dieselbe Tabelle. Der Vergleich der beiden Tabellen zeigt, ob deine Änderung das Verhalten getroffen hat, das du ändern wolltest, und ob sie an anderer Stelle etwas verschoben hat.

  > [!PRAXIS] Ein fester Testtag
  > Bei Valve testen Level-Designer laut Level Design Book jeden Freitag. Phil Co beschreibt den Wochenrhythmus seines Teams so: „Everything we do during the week is focused on that Friday playtest.“ Die Folien zum Portal Post-Mortem fassen die Haltung in drei Zeilen: „Watch your playtests“, „Adjust gameplay to what players look like they need.“ und „Watching a playtest exposes what isn’t working.“ ([Playtesting at Valve](https://book.leveldesignbook.com/process/blockout/playtesting#playtesting-at-valve), [Swift und Wolpaw, GDC 2008](https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf)). Für dich allein kann das heißen: Leg den Testtag für Runde 2 fest, bevor du mit der Überarbeitung anfängst.

  Wann ist Schluss? Wenn die Zeichen in einer Runde mit neuen Testern eingetreten sind. Oder nach drei Runden ohne Fortschritt; dann liegt das Problem meistens in der Absicht oder im Umfang, nicht im nächsten Hinweis.

  ## Optional: Ausgestaltung und Regressionstest

  Hat der Blockout seine Runde bestanden, kannst du einen Bildschirm oder den ganzen Abschnitt ausgestalten, wie in [Vom Blockout zur Ausgestaltung](/level-design/ausgestaltung). Danach wiederholst du den letzten bestandenen Test mit neuen Testern und füllst dieselbe Tabelle noch einmal. Fällt eine Zeile zurück, liegt es vermutlich an der Grafik; das Protokoll zeigt, ob etwas anderes dazukam. Dieser Schritt ist optional; der Kern der Werkstatt ist der Zyklus mit grauen Tiles.

  ## Die Werkstattmappe

  Alles, was im Zyklus entsteht, kommt in einen Ordner neben dem Godot-Projekt. So kann jemand anderes, oder du in drei Monaten, den Weg nachvollziehen:

  ```text
  werkstatt-abschnitt/
  ├── absicht.md               Absichtsnotiz, jede Fassung mit Datum
  ├── skizze.jpg               Foto der Skizze auf Karopapier
  ├── runde-1/
  │   ├── protokoll-T1.md      Beobachtungsprotokoll, ohne Namen
  │   ├── protokoll-T2.md
  │   ├── protokoll-T3.md
  │   ├── sitzung_01_weg.csv   Kopien aus user://wege/
  │   ├── sitzung_01_zonen.csv
  │   ├── …
  │   ├── uebersicht.png
  │   └── vergleich.md         Tabelle und Deutung
  ├── runde-2/
  │   └── …
  └── iteration.md             Iterationsprotokoll aller Runden
  ```

  Im Git-Repository des Projekts stehen dazu die Tags `r1`, `r2` und so weiter. Die Mappe enthält keine Namen; die Tester heißen T1 bis T3 pro Runde. Nach Ende der Werkstatt löschst du die Rohdaten, die du nicht mehr brauchst, und behältst die Übersichtsbilder und Tabellen.

  > [!INTERVIEW]
  > „Erzähl von einem Level, das du nach einem Playtest geändert hast.“ Gute Antwort in vier Teilen: Absicht in einem Satz und woran ich gemessen habe, ob sie eintritt. Was drei Tester getan haben, mit Zahlen, etwa „einer von drei am Tor, zwei im Seitengang“. Welche eine Änderung ich daraus abgeleitet habe und warum diese. Was die zweite Runde mit neuen Testern gezeigt hat. Dazu das Übersichtsbild vorher und nachher. Wer so antwortet, zeigt, dass er Level als Hypothesen behandelt und nicht als Geschmackssache.

  ## Häufige Fehler

  - **Zu groß angefangen.** Sechs Bildschirme mit drei Absichten. Nach dem Test weißt du nicht, welche Beobachtung zu welcher Absicht gehört.
  - **Zeichen erst nach dem Test festgelegt.** Dann passen sie zu dem, was passiert ist, und prüfen nichts.
  - **Erklärt statt beobachtet.** Ein Satz wie „Du musst da zum Tor“ macht die ganze Sitzung für dieses Zeichen wertlos.
  - **Dieselben Tester in Runde 2.** Sie wissen, wo das Tor ist.
  - **Mehrere Änderungen auf einmal.** Die zweite Runde ist besser oder schlechter, und du weißt nicht, warum.
  - **Deutung in der Beobachtungstabelle.** „Verwirrt“ steht in keinem Zonen-Log. In der Tabelle stehen Zahlen und Ereignisse, die Deutung darunter.
  - **Grafik vor dem bestandenen Test.** Dann misst die Runde Layout und Grafik zugleich.

  ## Zusammenfassung

  - Die Werkstatt ist der ganze Zyklus an einem Abschnitt: Umfang, Absicht, Skizze, Blockout, Test, Vergleich, Überarbeitung, zweiter Test.
  - 2 bis 4 Bildschirme, eine Absicht. Der Ort ist deine Wahl.
  - Jedes Zeichen der Absichtsnotiz bekommt vor dem Test eine Messung: Zone, Zeit, Halt oder Protokolleintrag.
  - Pro Runde mindestens drei Tester, die den Abschnitt nicht kennen, ohne Erklärung, mit Einverständnis und ohne Namen.
  - Die Vergleichstabelle enthält nur Beobachtungen. Deutung und Diagnose stehen darunter.
  - Pro Runde eine Änderung, neuer Tag, neue Tester, dieselbe Tabelle.
  - Ausgestaltung mit Regressionstest ist optional und kommt erst nach einer bestandenen Runde.
  - Die Werkstattmappe hält Notizen, Protokolle, Spuren, Tabellen und das Iterationsprotokoll zusammen.
exercises:
  - id: zyklus-ordnen
    type: order
    title: Der Zyklus der Werkstatt
    prompt: |
      Bring die Schritte der Werkstatt in die Reihenfolge, in der du sie machst.
    lang: prose
    lines: |
      Du wählst einen Abschnitt von 2 bis 4 Bildschirmen mit einer Absicht.
      Du schreibst die Absichtsnotiz und legst für jedes Zeichen eine Messung fest.
      Du skizzierst den Abschnitt auf Karopapier mit dem erwarteten Weg.
      Du baust den Blockout, läufst ihn selbst ab und setzt einen Tag.
      Drei Tester spielen, du beobachtest, ohne zu erklären.
      Du füllst die Vergleichstabelle und schreibst die Deutung darunter.
      Du änderst eine Stelle und testest mit neuen Testern.
    explanation: |
      Die Messungen gehören vor die Skizze, weil sie mit der Absicht entstehen; sonst passt man sie später an das an, was man gesehen hat. Die Skizze kommt vor dem Blockout, der Selbsttest vor dem fremden Test. Der Vergleich braucht die Daten der ganzen Runde. Die Überarbeitung beginnt erst danach, mit genau einer Änderung.
    hints:
      - Wann legst du fest, woran du Erfolg erkennst, vor oder nach dem Test?
    resources:
      - title: The Level Design Book · Blockout, „How to blockout“
        url: https://book.leveldesignbook.com/process/blockout

  - id: umfang-waehlen
    type: choice
    title: Welcher Umfang passt?
    prompt: |
      Welcher Umfang passt zur Werkstatt?
    options:
      - text: Ein Abschnitt von drei Bildschirmen mit einer Absicht und einer Abzweigung, an der sich der Spieler entscheidet.
        correct: true
        why: Klein genug zum Umbauen, und die Abzweigung gibt dem Tester eine Entscheidung, die du beobachten kannst.
      - text: Das ganze erste Level deines Spiels, damit sich der Aufwand lohnt.
        correct: false
        why: Zu groß für mehrere Runden. Jede Änderung zieht weitere nach sich, und die Tests dauern so lange, dass du nach einer Runde aufhörst.
      - text: Zwei Bildschirme mit drei Absichten, damit ein Test möglichst viel prüft.
        correct: false
        why: Mit drei Absichten weißt du nach dem Test nicht, welche Beobachtung zu welcher gehört. Ein Abschnitt stellt eine Frage.
      - text: Ein einzelner Gang ohne Abzweigung, damit sicher nichts schiefgeht.
        correct: false
        why: Ohne Entscheidung gibt es nichts zu beobachten. Ein Test, der nicht scheitern kann, prüft nichts.
    explanation: |
      Der Umfang muss zwei Bedingungen erfüllen: Du musst ihn mehrmals umbauen können, und der Tester muss darin etwas entscheiden. 2 bis 4 Bildschirme mit einer Absicht erfüllen beide. Größere Abschnitte teilst du in mehrere Werkstätten.
    resources:
      - title: Jakob Nielsen · Why You Only Need to Test with 5 Users
        url: https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/

  - id: zeichen-pruefen
    type: output
    title: Klappt es bei T1, T2 und T3?
    prompt: |
      Das Modell prüft für drei Tester das Zeichen „erreicht das Tor in unter 40 Sekunden, ohne den Seitengang zu betreten“ aus deren Zonen-Logs. Was gibt es aus?
    lang: python
    code: |
      # Zonen-Logs dreier Tester, Zeilen wie in sitzung_XX_zonen.csv
      sitzungen = {
          "T1": ["3.25,Hof", "21.50,Tor"],
          "T2": ["2.75,Hof", "14.00,Seitengang", "52.25,Hof", "61.00,Tor"],
          "T3": ["4.00,Hof", "18.75,Seitengang", "40.50,Hof"],
      }

      for tester, log in sitzungen.items():
          zonen = [zeile.split(",")[1] for zeile in log]
          tor = [float(z.split(",")[0]) for z in log if z.endswith(",Tor")]
          klappt = bool(tor) and tor[0] < 40 and "Seitengang" not in zonen
          print(tester, tor[0] if tor else "-", "klappt" if klappt else "scheitert")
    expected: |
      T1 21.5 klappt
      T2 61.0 scheitert
      T3 - scheitert
    hints:
      - "`tor` ist für T3 eine leere Liste."
      - "`float(\"21.50\")` wird als `21.5` ausgegeben."
    explanation: |
      T1 erreicht das Tor nach 21,5 Sekunden und war nie im Seitengang. T2 erreicht es, aber erst nach 61 Sekunden und über den Seitengang; beide Bedingungen scheitern. T3 kommt nicht ans Tor, `tor` bleibt leer, ausgegeben wird `-`. Ein Treffer von dreien: Das Zeichen ist nicht eingetreten. Warum T2 und T3 in den Seitengang gingen, sagt das Modell nicht; dafür liest du ihre Protokolle bei 14,00 und 18,75 Sekunden.
    resources:
      - title: Python · str.split
        url: https://docs.python.org/3/library/stdtypes.html#str.split

  - id: deutung-in-der-tabelle
    type: bug
    title: Eine Zeile deutet schon
    prompt: |
      Lehrbeispiel: Auszug aus dem Beobachtungsteil einer Vergleichsnotiz, Runde 1. Finde die Zeile, die eine Deutung als Beobachtung notiert.
    lang: text
    code: |
      T1  0:21  betritt Zone Tor, kein Halt davor
      T2  0:09  hält an der Gabelung, 4 s
      T2  0:14  betritt Zone Seitengang
      T2  0:31  verwirrt am Brunnen, sucht den Ausgang
      T2  0:52  betritt Zone Hof
      T3  0:13  hält an der Gabelung, 5 s
    lines: [4]
    explanation: |
      „Verwirrt“ und „sucht den Ausgang“ beschreiben, was im Kopf von T2 vorgeht. Die Spur kann einen Halt zeigen und das Protokoll, was T2 getan und gesagt hat, etwa „bleibt am Brunnen stehen, dreht sich zweimal, sagt: Hm.“ Ob das Suche war, Neugier oder Pause, gehört in die Deutung darunter, mit Verweis auf diese Zeile.
    hints:
      - Welche Zeile könnte keine Kamera aufnehmen?
    resources:
      - title: The Level Design Book · Playtesting
        url: https://book.leveldesignbook.com/process/blockout/playtesting

  - id: zeichen-nicht-messbar
    type: bug
    title: Ein Zeichen, das niemand sehen kann
    prompt: |
      Lehrbeispiel: eine Absichtsnotiz für die Werkstatt. Finde die Zeile, die du nach dem Test weder mit Spuren noch mit dem Protokoll prüfen kannst.
    lang: text
    code: |
      Abschnitt: Hof mit Tor und Seitengang, 3 Bildschirme
      Absicht: Der Spieler soll das Tor erreichen, bevor er den Seitengang betritt.
      Erwarteter Weg: Start, über den Hof, Gabelung, Tor
      Hinweise: Laterne am Tor, heller Weg vom Start zur Gabelung
      Zeichen, dass es klappt: Der Spieler fühlt sich sicher, wohin er gehen soll.
      Zeichen, dass es scheitert: Zone Seitengang vor Zone Tor im Log
    lines: [5]
    explanation: |
      Ein Gefühl steht in keinem Log, und wer laut denkt, sagt nicht unbedingt „Ich fühle mich sicher“. Formuliere es als Verhalten, etwa „Zone Tor im Log vor Zone Seitengang, und an der Gabelung kein Halt über 3 Sekunden“. Dann kannst du nach der Runde für jeden Tester ja oder nein schreiben.
    hints:
      - Welches Zeichen beschreibt einen Zustand im Kopf statt ein Verhalten?
    resources:
      - title: Mike Ambinder · Valve's Approach to Playtesting (Folien, GDC 2009)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf

  - id: vergleich-erklaeren
    type: explain
    title: Was sagt diese Tabelle?
    prompt: |
      Lehrbeispiel: die Vergleichstabelle nach Runde 1. Erkläre in drei bis fünf Sätzen, was die Tabelle zeigt, was sie nicht zeigt und welche Entscheidung jetzt ansteht.
    lang: text
    code: |
      Absicht: Der Spieler soll das Tor erreichen, bevor er den Seitengang betritt.
      Runde 1 · Stand r1 · T1–T3
      Zeichen                     T1         T2                  T3                  Quelle
      Tor ohne Seitengang         ja         nein, Seitengang    nein, Seitengang    Zonen-Log
                                             ab 0:14             ab 0:18
      Tor in unter 40 s           ja, 0:21   nein, 1:01          nein, nie           Zonen-Log
      Halt an Gabelung über 3 s   nein       ja, 0:09–0:13       ja, 0:13–0:18       Übersicht
      Laterne erwähnt             ja         nein                nein                Protokoll
    points:
      - Die Absicht ist in Runde 1 nicht eingetreten; nur T1 erfüllt alle Zeichen.
      - T2 und T3 halten an der Gabelung länger als 3 Sekunden und betreten direkt danach den Seitengang, um 0:14 und 0:18; an der Gabelung trennen sich die Wege.
      - Nur T1 erwähnt die Laterne. Welche der vier Arten aus „Überarbeiten“ bei T2 und T3 vorliegt, nicht bemerkt, falsch gelesen, nicht befolgt oder unbeabsichtigte Folge, sagt die Tabelle nicht; das klären die Protokolle an der Gabelung.
      - Jetzt steht die Entscheidung an, einen Hinweis an der Gabelung zu ändern oder die Absicht zu ändern; in beiden Fällen eine Änderung und eine neue Runde mit neuen Testern.
    explanation: |
      Die Tabelle zeigt, dass die Absicht nur bei einem von drei Testern eingetreten ist und dass sich die Wege an der Gabelung trennen: Beide Tester, die scheitern, halten dort länger als 3 Sekunden und betreten eine Sekunde später den Seitengang. Sie zeigt auch, dass nur T1 die Laterne erwähnt hat. Warum die anderen nicht zum Tor gegangen sind, zeigt sie nicht; dafür liest du die Protokolle an der Gabelung und ordnest die Stelle einer der vier Arten aus [Überarbeiten](/level-design/ueberarbeiten) zu. War die Laterne „nicht bemerkt“, änderst du etwas an ihr oder an der Sicht auf sie. Wurde sie „falsch gelesen“, änderst du ihre Form oder ihren Ort. Wurde sie verstanden, aber „nicht befolgt“, weil der Seitengang mehr versprach, prüfst du zuerst die Absicht: Ist der Seitengang für dich die bessere Entdeckung, änderst du die Absicht. In jedem Fall ist es eine Änderung, und Runde 2 läuft mit neuen Testern.
    resources:
      - title: Kim Swift, Erik Wolpaw · Portal Post-Mortem (Folien, GDC 2008)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf

  - id: umfang-und-absicht
    type: practice
    title: Umfang und Absichtsnotiz
    prompt: |
      Wähle den Abschnitt für deine Werkstatt und schreib seine Absichtsnotiz. Welcher Ort es ist und was der Spieler dort tun soll, entscheidest du. Leg für jedes Zeichen eine Messung fest, bevor du skizzierst.
    lang: prose
    starter: |
      Abschnitt (Größe in Bildschirmen):
      Absicht (ein Satz): Der Spieler soll …
      Erwarteter Weg:
      Hinweise (wo, was, wofür):
      Zeichen, dass es klappt:      Messung:
      Zeichen, dass es scheitert:   Messung:
    checklist:
      - Der Abschnitt ist 2 bis 4 Bildschirme groß.
      - Die Absicht ist ein Satz und enthält eine einzige Absicht.
      - Im Abschnitt muss der Spieler mindestens eine Entscheidung treffen, etwa an einer Abzweigung.
      - Jedes Zeichen beschreibt Verhalten, kein Gefühl.
      - Jedes Zeichen hat eine Messung mit Quelle (Zonen-Log, Übersichtsbild, CSV oder Protokoll) und eine Grenze in Sekunden, Zonen oder Anzahl.
      - Die Zonen, die du dafür brauchst, sind benannt.
    hints:
      - Schreib die Zeichen so, dass du nach jeder Sitzung ja oder nein dahinter schreiben kannst.
    explanation: |
      Die Messungen sind der Unterschied zwischen einer Absicht und einer Hoffnung. Mit ihnen weißt du schon vor dem Bauen, welche Zonen der Wegschreiber braucht und welche Spalten deine Vergleichstabelle hat.
    resources:
      - title: The Level Design Book · Layout
        url: https://book.leveldesignbook.com/process/layout

  - id: skizze-und-blockout
    type: practice
    title: Skizze und Blockout
    prompt: |
      Skizziere den Abschnitt auf Karopapier im Tile-Maßstab und bau ihn als Blockout in Godot, mit Wegschreiber und Zonen. Lauf ihn selbst ab und setz den Tag für Runde 1. Jede Wand, jede Breite und jeder Hinweis ist deine Entscheidung.
    lang: prose
    checklist:
      - Die Skizze zeigt den Rahmen der Bildschirme, den erwarteten Weg und jeden Hinweis mit Symbol; ein Foto liegt in der Mappe.
      - Der Blockout nutzt deine Blockout-Vokabel auf `Ground`, `Walls` und `Cues`, ohne fertige Grafik.
      - Jede Zone aus der Absichtsnotiz ist eine `Area2D` in der Gruppe `zones`.
      - "`ExpectedPath` folgt dem erwarteten Weg der Skizze, `Notes` ist im Spiel aus."
      - Dein eigener Durchlauf hat eine Weg-Datei und ein Zonen-Log erzeugt, die zu deinem Weg passen.
      - Der Stand ist committet und hat den Tag für Runde 1.
    hints:
      - Weicht der Blockout von der Skizze ab, notiere die Abweichung, statt die Skizze nachzuzeichnen.
    explanation: |
      Der eigene Durchlauf prüft die Technik und die Maße. Er sagt nichts darüber, ob ein Fremder den Weg findet, denn du kennst ihn. Aber er erspart dir, einen Tester an einem Gang scheitern zu lassen, in dem die Figur hängen bleibt.
    resources:
      - title: The Level Design Book · Blockout
        url: https://book.leveldesignbook.com/process/blockout

  - id: testrunde-eins
    type: practice
    title: Testrunde 1 mit drei Testern
    prompt: |
      Lass mindestens drei Personen deinen Abschnitt spielen, die ihn nicht kennen. Wen du fragst, entscheidest du. Beobachte, ohne zu erklären, und sichere jede Sitzung.
    lang: prose
    checklist:
      - Mindestens drei Sitzungen auf demselben getaggten Stand.
      - Jeder Tester wusste vor dem Start, was aufgezeichnet wird, und hat zugestimmt.
      - Keine Namen in Dateien, Protokollen oder Mappe; die Tester heißen T1, T2, T3.
      - Du hast den Abschnitt nicht erklärt; jeder Eingriff steht mit Zeit im Protokoll.
      - Zu jeder Sitzung liegen in `runde-1/` das Protokoll, die Weg-Datei und das Zonen-Log, und jedes Protokoll nennt die Sitzungsnummer seiner Dateien.
      - Das Übersichtsbild der Runde liegt in der Mappe.
    hints:
      - Plane gut zehn Minuten pro Person und mit Aufbau etwa 45 Minuten für die Runde.
    explanation: |
      Drei Sitzungen sind das Minimum, um zufälliges Verhalten von einem Muster zu unterscheiden. Der feste Stand sorgt dafür, dass alle drei denselben Abschnitt gespielt haben. Wie du ohne Erklären beobachtest, steht in [Beobachten, ohne zu erklären](/level-design/playtest-methode).
    resources:
      - title: The Level Design Book · Playtesting, „How to run a playtest“
        url: https://book.leveldesignbook.com/process/blockout/playtesting#how-to-run-a-playtest
      - title: Nielsen Norman Group · Talking with Users in a Usability Test
        url: https://www.nngroup.com/articles/talking-to-users/

  - id: vergleich-schreiben
    type: practice
    title: Absicht gegen Verhalten
    prompt: |
      Füll die Vergleichstabelle für Runde 1 aus Zonen-Logs, Übersichtsbild und Protokollen. Schreib darunter deine Deutung und die Entscheidung, die daraus folgt. Was du daraus schließt, entscheidest du.
    lang: prose
    starter: |
      Runde 1 · Stand · Tester
      Zeichen | T1 | T2 | T3 | Quelle

      Deutung (mit Protokollzeile):
      Art je Stelle: nicht bemerkt / falsch gelesen / nicht befolgt / unbeabsichtigte Folge / Absicht erfüllt
      Entscheidung: Hinweis ändern / Absicht ändern / fertig
    checklist:
      - Jedes Zeichen der Absichtsnotiz hat eine Zeile, jeder Tester eine Spalte.
      - In der Tabelle stehen nur Zahlen, Zonen und Ereignisse, keine Deutung.
      - Jede Deutung verweist auf eine Protokollzeile oder eine Stelle im Übersichtsbild.
      - Für jedes nicht eingetretene Zeichen steht eine der vier Arten aus „Überarbeiten“ (nicht bemerkt, falsch gelesen, nicht befolgt, unbeabsichtigte Folge) mit Beleg und der Stelle, an der sich das Verhalten trennt; eingetretene Zeichen stehen als „Absicht erfüllt“ da.
      - Die Entscheidung nennt genau eine Änderung oder eine neue Absicht, mit Begründung.
    hints:
      - Füll die Tabelle, bevor du die Protokolle ein zweites Mal liest.
    explanation: |
      Die Tabelle trennt, was passiert ist, von dem, was du daraus machst. Wer später fragt, warum du etwas geändert hast, findet die Antwort in der Zeile darunter, mit Quelle. Wie du eine Stelle diagnostizierst, steht in [Überarbeiten](/level-design/ueberarbeiten).
    resources:
      - title: Mike Ambinder · Valve's Approach to Playtesting (Folien, GDC 2009)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf

  - id: runde-zwei
    type: practice
    title: Eine Änderung, neue Tester
    prompt: |
      Setz die eine Änderung aus deinem Vergleich um, teste mit mindestens drei neuen Personen und füll dieselbe Tabelle für Runde 2. Welche Änderung es ist, hast du entschieden; hier prüfst du, ob sie gewirkt hat.
    lang: prose
    checklist:
      - Zwischen Runde 1 und Runde 2 ist genau eine Stelle geändert, und das Iterationsprotokoll nennt sie mit Begründung.
      - Der neue Stand hat einen eigenen Tag.
      - Mindestens drei Tester, die weder den Abschnitt noch Runde 1 kennen.
      - Die Tabelle von Runde 2 hat dieselben Zeilen wie die von Runde 1.
      - Du hast notiert, ob sich das Verhalten an der geänderten Stelle verändert hat und ob sich an einer anderen Stelle etwas verschoben hat.
      - Das Iterationsprotokoll sagt, wie es weitergeht, mit einer weiteren Runde, einer neuen Absicht oder dem Abschluss.
    hints:
      - Leg die Übersichtsbilder beider Runden nebeneinander.
    explanation: |
      Erst die zweite Runde zeigt, ob deine Deutung stimmt. Hat sich das Verhalten an der geänderten Stelle verändert, war die Diagnose richtig. Hat es sich nicht verändert, war es eine andere Ursache, und du weißt mehr als vorher. Beide Ergebnisse sind brauchbar, solange du nur eine Sache geändert hast.
    resources:
      - title: Jakob Nielsen · Why You Only Need to Test with 5 Users
        url: https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/

  - id: ausgestalten-und-wiederholen
    type: practice
    title: Ausgestaltung und Regressionstest
    prompt: |
      Optional, wenn eine Runde bestanden ist: Gestalte den Abschnitt oder einen Bildschirm davon aus und wiederhole den bestandenen Test mit neuen Testern. Wie der Ort aussieht, entscheidest du.
    lang: prose
    checklist:
      - Ausgestaltet hast du erst nach einer Runde, in der die Zeichen eingetreten sind.
      - Die Grafik liegt auf `Dressing` ohne Kollision, `Walls` ist unsichtbar und kollidiert weiter, `check_dressing.gd` meldet nichts.
      - Der Regressionstest hat dieselben Zeichen, Zonen und dieselbe Zahl an neuen Testern wie die bestandene Runde.
      - Die Tabelle vorher und nachher steht nebeneinander in der Mappe.
      - Jeder Rückschritt hat Ort, Zeit und eine Änderung an der Grafik als nächsten Schritt.
    hints:
      - Ein Bildschirm reicht, um das Verfahren einmal durchzuspielen.
    explanation: |
      Der Regressionstest beantwortet, ob die Grafik etwas gekostet hat. Weil das Layout gleich geblieben ist, liegt ein Rückschritt vermutlich an der Ausgestaltung; das Protokoll zeigt, ob etwas anderes dazukam. Die Einzelheiten stehen in [Vom Blockout zur Ausgestaltung](/level-design/ausgestaltung).
    resources:
      - title: The Level Design Book · Environment Art
        url: https://book.leveldesignbook.com/process/env-art

  - id: werkstattmappe
    type: practice
    title: Die Werkstattmappe und dein Rückblick
    prompt: |
      Räum die Werkstattmappe auf und schreib einen Rückblick von höchstens einer Seite: was du beabsichtigt hast, was die Tester getan haben, was du geändert hast und was du beim nächsten Abschnitt anders machst.
    lang: prose
    checklist:
      - Die Mappe hat Absichtsnotiz mit allen Fassungen, Skizze, einen Ordner pro Runde und das Iterationsprotokoll.
      - Jede Runde hat Protokolle, Zonen-Logs, Übersichtsbild und Vergleichstabelle.
      - Die Mappe enthält keine Namen von Testern.
      - Der Rückblick nennt die Absicht, die Ergebnisse jeder Runde in Zahlen und jede Änderung mit Begründung.
      - Der Rückblick nennt mindestens eine Sache, die du am Vorgehen ändern willst, nicht nur am Abschnitt.
      - Rohdaten, die du nicht mehr brauchst, sind gelöscht.
    hints:
      - Schreib den Rückblick so, als würdest du ihn im Vorstellungsgespräch erzählen.
    explanation: |
      Die Mappe ist der Beleg, dass du Level als Hypothesen behandelst: Absicht, Messung, Beobachtung, Änderung, neue Messung. Der Satz über dein Vorgehen ist der wichtigste im Rückblick, denn er macht den nächsten Abschnitt schneller.
    resources:
      - title: The Level Design Book · Playtesting
        url: https://book.leveldesignbook.com/process/blockout/playtesting
