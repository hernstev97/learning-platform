id: ausgestaltung
title: Vom Blockout zur Ausgestaltung, ohne Hinweise zu verlieren
level: 3
minutes: 120
summary: Einen getesteten Blockout ausgestalten, mit eigenen Tiles oder dem Prüfmuster aus dem Godot-Kurs – auf einer eigenen Ebene, mit Kollision aus dem Blockout statt aus der Grafik, mit gehaltenen Tonwerten, einem Baukasten statt Einzelstücken und einem Regressionstest, der zeigt, ob die Hinweise die Grafik überlebt haben.
place: pc
goals:
  - Du beginnst die Ausgestaltung erst, wenn der Blockout einen Test bestanden hat, und hältst dessen Ergebnis als Vergleichswert fest.
  - Du legst die Grafik auf eine eigene Ebene `Dressing` ohne Kollision und lässt `Walls` als unsichtbare Kollision des Blockouts stehen.
  - Du prüfst mit einem Skript, ob die Ausgestaltung Kollision mitbringt oder Wände ohne Bild hinterlässt.
  - Du hältst die Tonwerte der Blockout-Vokabel und rechnest nach, ob ein Hinweis nach der Ausgestaltung noch genug Kontrast hat.
  - Du baust die Ausgestaltung aus einem kleinen Baukasten und wiederholst danach denselben Test mit neuen Testern.
resources:
  - title: The Level Design Book · Environment Art
    url: https://book.leveldesignbook.com/process/env-art
  - title: Joel Burgess, Nate Purkeypile · Skyrim's Modular Level Design (Folien, GDC 2013)
    url: https://www.slideshare.net/slideshow/gdc2013-kit-buildingfinal/17728576
  - title: Godot Docs · TileMapLayer
    url: https://docs.godotengine.org/en/stable/classes/class_tilemaplayer.html
  - title: Godot Docs · 2D lights and shadows
    url: https://docs.godotengine.org/en/stable/tutorials/2d/2d_lights_and_shadows.html
lesson: |
  Lehrbeispiel: Dein Hof hat im Blockout einen Test bestanden. Drei von drei Testern sind über den Hof zum Tor gegangen, der gelbe Hinweis daneben hat gewirkt, das Übersichtsbild zeigt drei fast gerade Spuren. Dann gestaltest du aus: Steinwände, Gras mit Blumen, eine warme Laterne am Tor, ein paar Kisten am Rand. In der nächsten Runde findet einer von drei Testern das Tor direkt. Die anderen zwei laufen zu den Blumen, und einer bleibt an einer Kiste hängen, die er für Deko hielt. Am Layout wolltest du nichts ändern.

  Joel Burgess beschreibt diese Lage aus der Sicht von Level-Designern, die fertige Grafik für ihre Level bekommen: „Level designers often inherit a litany of unforeseen problems when receiving final art for their levels.“ Eines seiner Beispiele: „A wall intended as a visual blocker is now a see-though [sic] chain-link fence“ ([Transkript des GDC-Vortrags](http://blog.joelburgess.com/2013/04/skyrims-modular-level-design-gdc-2013.html)). Das Level Design Book definiert die Ausgestaltung, dort „environment art“, als „the cosmetic decoration of a level or game world, while preserving its core functionality and gameplay“ ([Environment Art](https://book.leveldesignbook.com/process/env-art)). Dieses Modul zeigt, wie du den zweiten Halbsatz einhältst. Du kannst mit eigenen Tiles arbeiten ([Umgebung und Tiles, die Figuren tragen](/pixelart/umgebung-tiles)) oder mit dem Prüfmuster aus [2D-Level aus Tiles](/godot/level-tilemap); fertige Pixelart brauchst du nicht. Das Prüfskript ist technisches Gerüst, eine KI darf es schreiben. Wie dein Ort aussieht, entscheidest du.

  ## Erst testen, dann ausgestalten

  Das Level Design Book beschreibt die Reihenfolge in Studios so: „the environment artist is usually supposed to wait for a mature blockout before beginning an art pass.“ Allein am Projekt heißt das: Du wartest auf dich selbst. Ausgestalten darfst du, wenn der Blockout eine Runde mit Testern bestanden hat, in der die Zeichen aus deiner Absichtsnotiz eingetreten sind ([Werkstatt](/level-design/werkstatt-abschnitt) und [Playtest am PC](/level-design/playtest-godot)).

  Vor dem ersten ausgestalteten Pixel sicherst du drei Dinge:

  - den Tag des getesteten Blockouts, etwa `blockout-r3`,
  - das Übersichtsbild und die Zonen-Logs dieser Runde,
  - zwei, drei Zahlen aus der Runde: Wie viele Tester haben das Ziel erreicht, in welcher Zeit, mit welchen Halten?

  Diese Zahlen sind dein Vergleichswert. Ohne ihn kannst du nach der Ausgestaltung nicht sagen, ob es schlechter geworden ist.

  > [!MERKE]
  > Die Ausgestaltung darf ändern, wie der Ort aussieht, nicht, was der Spieler dort tut. Ob das gelungen ist, zeigt derselbe Test vorher und nachher.

  ## Eine eigene Ebene: Dressing über dem Blockout

  Die Grafik kommt auf einen eigenen `TileMapLayer` namens `Dressing`, mit einem eigenen TileSet aus deinen Tiles. `Ground` und `Walls` bleiben, was sie im Blockout waren. Die Kollision folgt dem Blockout, nicht der Grafik: `Walls` behält seine Kollisionsformen und wird nur unsichtbar, `Dressing` kollidiert nie. Im Ausschnitt aus `main.tscn` fehlt die `unique_id`, die Godot 4.7.2 in jede Node-Zeile schreibt:

  ```ini title=main.tscn
  [node name="Dressing" type="TileMapLayer" parent="."]
  tile_set = ExtResource("3")
  collision_enabled = false

  [node name="Walls" type="TileMapLayer" parent="Objects"]
  visible = false
  y_sort_enabled = true
  tile_set = ExtResource("1")
  ```

  Zwei Eigenschaften klingen ähnlich und tun Verschiedenes. `visible = false` blendet einen Layer aus, die Kollision bleibt ([CanvasItem.visible](https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#class-canvasitem-property-visible)). `enabled = false` schaltet ihn laut Doku „completely“ ab, „rendering, collision, navigation, scene tiles, etc.“ ([TileMapLayer.enabled](https://docs.godotengine.org/en/stable/classes/class_tilemaplayer.html#class-tilemaplayer-property-enabled)). Mit Godot 4.7.2 nachgeprüft, Wand in Spalte 8, Figur läuft von x = 40 nach rechts:

  | `Walls` | Figur bleibt stehen bei |
  | --- | --- |
  | sichtbar | x = 123 |
  | `visible = false` | x = 123 |
  | `enabled = false` | läuft durch |
  | `collision_enabled = false` | läuft durch |

  `collision_enabled = false` an `Dressing` ist eine Sicherung ([collision_enabled](https://docs.godotengine.org/en/stable/classes/class_tilemaplayer.html#class-tilemaplayer-property-collision-enabled)). Hat dein Dressing-TileSet keine Physik-Ebene, kollidiert es ohnehin nicht. Kopierst du aber das Blockout-TileSet als Grundlage, bringt jede Tile ihr Kollisionspolygon mit. Nachgestellt: Eine Kiste auf `Dressing` mit Polygon und ohne die Sicherung hält die Figur bei x = 75 auf, mitten im Weg, den der Blockout frei hatte.

  Hohe Teile wie Baumkronen oder Mauerkronen, hinter die die Figur laufen kann, brauchen eine Ebene in der Y-Sortierung unter `Objects`, unten `DressingHigh` genannt. Wie das geht, steht in [2D-Level aus Tiles](/godot/level-tilemap); auch diese Ebene bekommt `collision_enabled = false`.

  ### Reihenfolge der Ebenen: Grafik unter den Hinweisen

  Godot zeichnet Geschwister in der Reihenfolge des Szenenbaums: Was im Szenen-Dock weiter unten steht, liegt im Bild darüber. `Dressing` enthält auch Boden-Tiles und deckt alles zu, was vor ihm gezeichnet wird. Es gehört deshalb zwischen `Ground` und `Cues`:

  ```text
  Main (Node2D)
  ├── Ground (TileMapLayer)            Blockout-Boden, unter der Grafik
  ├── Dressing (TileMapLayer)          Grafik, collision_enabled aus
  ├── Cues (TileMapLayer)              Hinweise, über der Grafik
  ├── Objects (Node2D)                 y_sort_enabled
  │   ├── Walls (TileMapLayer)         visible aus, Kollision des Blockouts
  │   ├── DressingHigh (TileMapLayer)  hohe Teile, collision_enabled aus
  │   └── Player
  └── Notes (Node2D)
  ```

  Mit Godot 4.7.2 nachgeprüft, je eine Tile von `Dressing` und `Cues` in derselben Zelle: In dieser Reihenfolge zeigt das Bild den gelben Hinweis, mit `Dressing` hinter `Cues` die grüne Grafik. Lass `z_index` an beiden auf 0, sonst zählt die Reihenfolge im Baum nicht mehr ([z_index](https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#class-canvasitem-property-z-index)). Die Grafik des Hinweises selbst, etwa eine Laterne statt der gelben Tile, malst du auf `Cues` an die Stelle des Platzhalters. Ein TileSet kann dafür mehrere Atlanten enthalten, den Platzhalter und deine Hinweis-Tiles ([Using TileSets](https://docs.godotengine.org/en/stable/tutorials/2d/using_tilesets.html#merging-several-atlases-into-a-single-atlas)). So bleibt jeder Hinweis auf seiner Ebene, auch ausgestaltet. Hohe Teile auf `DressingHigh` liegen dagegen über `Cues`; wo sie einen Hinweis verdecken können, steht im Abschnitt zur Atmosphäre.

  ### Ein Prüfskript nach jeder Runde

  Zwei Fehler sieht man im Editor schlecht: Kollision, die mit der Grafik hereinkommt, und Wände, die unsichtbar geworden sind, weil an ihrer Stelle kein Bild liegt. Dieses Skript prüft beides gegen den Blockout:

  ```gdscript title=check_dressing.gd
  extends SceneTree

  ## Prüft nach jeder Ausgestaltungsrunde drei Dinge gegen den Blockout:
  ## Kollision in Dressing, Dressing über Cues und Wand-Zellen ohne Bild in Dressing.
  ## Aufruf im Projektordner: godot --headless --path . -s check_dressing.gd
  ## Technisches Gerüst, keine Designentscheidung.


  func _initialize() -> void:
  	var level: Node = load("res://main.tscn").instantiate()
  	var walls: TileMapLayer = level.get_node("Objects/Walls")
  	var dressing: TileMapLayer = level.get_node("Dressing")
  	var cues: TileMapLayer = level.get_node("Cues")
  	if dressing.collision_enabled and dressing.tile_set.get_physics_layers_count() > 0:
  		print("Dressing kann kollidieren: collision_enabled ausschalten")
  	if dressing.get_index() > cues.get_index():
  		print("Dressing wird nach Cues gezeichnet und verdeckt Hinweise")
  	for cell in walls.get_used_cells():
  		if dressing.get_cell_source_id(cell) == -1:
  			print("Wand ohne Bild: ", cell)
  	level.free()
  	quit()
  ```

  `get_used_cells()` liefert alle belegten Zellen von `Walls`, `get_cell_source_id()` gibt −1 zurück, wenn in `Dressing` an dieser Stelle nichts liegt ([get_cell_source_id](https://docs.godotengine.org/en/stable/classes/class_tilemaplayer.html#class-tilemaplayer-method-get-cell-source-id)). `get_index()` ist die Position unter den Geschwistern im Baum ([get_index](https://docs.godotengine.org/en/stable/classes/class_node.html#class-node-method-get-index)). Mit Godot 4.7.2 nachgeprüft: vier Wandzellen, auf einer davon fehlt das Bild, Ausgabe `Wand ohne Bild: (9, 6)`. Mit einem Dressing-TileSet mit Physik-Ebene und ohne die Sicherung kommt die erste Meldung dazu, mit `Dressing` hinter `Cues` die zweite. Liegen deine Wandbilder auf mehreren Ebenen, lass dir das Skript für jede erweitern.

  Was das Skript nicht findet: Grafik, die wie eine Wand aussieht, wo keine ist, etwa ein Busch, durch den man laufen kann. Das zeigt nur der Test.

  ## Tonwerte und Vokabel halten

  Im Blockout war alles lesbar, weil es nichts anderes gab. Das Level Design Book beschreibt, was beim Ausgestalten passiert: „as we add additional visual details to the world, the level geometry becomes less distinct and more noisy.“ Und an anderer Stelle: „everything is ivy, everything in environment art has a readability function.“ Das Buch erklärt den Satz an The Last of Us Part II: Dort zeigt Efeu, dass ein Gebäude geschlossen ist, und fehlender Efeu, dass man es betreten soll ([Environment Art, Readability](https://book.leveldesignbook.com/process/env-art)).

  Für dich heißt das: Die Vokabel aus dem Blockout überlebt die Ausgestaltung. Was blockiert, bleibt dunkler als der Boden, oder du hast eine andere, ebenso deutliche Regel. Die Farbe, die im Blockout den Hinweisen gehörte, gehört auch jetzt nur ihnen. Das Level Design Book nennt Spiele, die Farben reservieren, „only explosive barrels are red!“. Wie du Tonwerte prüfst, zeigen [Licht, Schatten und Tonwerte](/pixelart/licht-werte) und [Prüfen, überarbeiten, dokumentieren](/pixelart/lesbarkeit-pruefen): Mach von derselben Stelle einen Screenshot im Blockout und einen nach der Ausgestaltung, stell beide in Graustufen nebeneinander, und vergleich die Reihenfolge der Helligkeiten.

  Ob ein Hinweis noch heraussticht, kannst du auch rechnen. Der Pixelart-Kurs nutzt dafür die relative Leuchtdichte und das Kontrastverhältnis nach WCAG ([Farbe, Rampen und begrenzte Paletten](/pixelart/farbe-paletten)): 1 heißt gleich hell, 21 heißt Schwarz auf Weiß.

  ```python run
  def kanal(v):
      s = v / 255
      return s / 12.92 if s <= 0.04045 else ((s + 0.055) / 1.055) ** 2.4

  def leuchtdichte(hexwert):
      r, g, b = (int(hexwert[i:i + 2], 16) for i in (1, 3, 5))
      return 0.2126 * kanal(r) + 0.7152 * kanal(g) + 0.0722 * kanal(b)

  def kontrast(a, b):
      hell, dunkel = sorted((leuchtdichte(a), leuchtdichte(b)), reverse=True)
      return (hell + 0.05) / (dunkel + 0.05)

  print(round(kontrast("#3c3c3c", "#8c8c8c"), 1))  # Wand gegen Boden, Blockout
  ```

  Die Zahl ist ein Messwert, keine Regel. Sie sagt dir, ob zwei Flächen in Graustufen verschmelzen. Ob dein Hinweis wirkt, sagt der Test.

  Die Debatte um gelbe Markierungen in großen Spielen, „yellow paint“, dreht sich um genau diese Wirkung: Je mehr Detail im Bild ist, desto stärker muss ein Hinweis sein, um bemerkt zu werden. Die Stimmen aus der Debatte stehen in [Umgebung als Information](/level-design/umgebung-informiert) und [Überarbeiten](/level-design/ueberarbeiten), dort auch, wie stark eine Markierung sein soll.

  ## Baukasten statt Einzelstücke

  Bethesda hat Skyrim aus modularen Baukästen gebaut, „kits“. Burgess: „Kits, first and foremost, are systems.“ Ein Kit rastet in einem Raster ein, und „the most important attribute of a kit is that it adds up to far more than the sum of its parts.“ Für Tiles in der Draufsicht ist das Raster schon da. Die Regel zu Grundflächen überträgt sich trotzdem: „a 512x512x512 room will always tile nicely with a 256x256x256 hallway, but a 384x384x384 room will eventually create gaps and/or overlaps.“ Größere Teile, die über mehrere Zellen gehen, haben bei dir Maße in ganzen Tiles, 32 oder 48 Pixel bei 16er-Tiles, nie 24.

  Ein kleiner Baukasten für einen Abschnitt kann so aussehen: ein Boden mit höchstens zwei Varianten, Wandkanten mit Ecken (dafür sind Terrains gemacht, siehe [2D-Level aus Tiles](/godot/level-tilemap)), eine Wandkrone, ein Durchgang, die Hinweis-Teile und vielleicht ein einziges Stück für eine Landmarke. Welche Teile dein Baukasten hat, entscheidest du aus deiner Blockout-Vokabel: Jede Tile der Vokabel braucht mindestens ein Gegenstück.

  Zwei Ratschläge aus den Quellen helfen beim Bauen. Burgess rät, „one visually-complete piece“ fertigzustellen, bevor die Varianten kommen. Wenn sich die Richtung ändert, änderst du ein Teil statt zwanzig. Das Level Design Book rät zu einer Testszene mit allen Teilen: „Make a scene or level with every prop / art asset, and walk around in it.“ Das ist dein Maßstabsraum aus dem Blockout-Modul, diesmal mit Grafik.

  ## Atmosphäre ohne Hinweisverlust

  Licht, Farbe und Dichte machen einen Ort, und alle drei können Hinweise verdecken.

  - **Licht.** Ein `CanvasModulate` färbt den ganzen Canvas, etwa dunkler für Nacht ([CanvasModulate](https://docs.godotengine.org/en/stable/classes/class_canvasmodulate.html)), ein `PointLight2D` hellt Stellen auf ([2D lights and shadows](https://docs.godotengine.org/en/stable/tutorials/2d/2d_lights_and_shadows.html#point-lights)). Valve hat für Left 4 Dead Licht gezielt zur Wegführung genutzt; auf der Folie steht: „Players tend to follow the light“ ([Mitchell, MIGS 2008](https://cdn.akamai.steamstatic.com/apps/valve/2008/MIGS08_ConnectingVisualsToGameplay.pdf)). Machst du den Ort dunkler, muss der Hinweis heller bleiben als alles um ihn herum.
  - **Dichte.** Das Level Design Book rät, Details in Gruppen zu setzen, „in clusters of related details“. Viele einzelne Details gleich verteilt machen den ganzen Boden laut. Halte den Weg ruhiger als die Ränder, wenn er der Weg sein soll.
  - **Hohe Teile.** In der Draufsicht verdeckt ein hohes Teil, was oberhalb von ihm liegt. Eine Baumkrone eine Zeile unter dem Hinweis kann ihn ganz zudecken. Lauf jeden Hinweis aus der Richtung an, aus der Tester kommen.

  Auch Klang kann ein Hinweis sein; das behandelt der spätere Sound-Kurs.

  ## Regressionstest: derselbe Test nach der Ausgestaltung

  Ein Regressionstest wiederholt einen bestandenen Test, um zu sehen, ob eine Änderung etwas kaputt gemacht hat. Hier heißt das: dieselbe Absichtsnotiz, dieselben Zonen, derselbe Wegschreiber, dieselbe Zahl an Testern, aber neue Tester, die den Abschnitt nicht kennen. Vorher läuft `check_dressing.gd` ohne Meldung, und der Stand hat einen eigenen Tag.

  Danach legst du die Übersichtsbilder vorher und nachher nebeneinander und vergleichst die Zahlen. Rückschritte sind: weniger Tester am Ziel, längere Zeiten, neue Halte oder Umwege an ausgestalteten Stellen, Tester, die an einer unsichtbaren Wand hängen bleiben oder in etwas hineinlaufen, das wie eine Wand aussieht. Findest du einen, änderst du zuerst die Ausgestaltung an dieser Stelle, nicht das Layout; das Layout hat seinen Test bestanden. Wie du eine Stelle diagnostizierst und eine Änderung pro Runde machst, steht in [Überarbeiten](/level-design/ueberarbeiten).

  > [!PRAXIS] Kunst und Level-Design arbeiten zusammen, nicht nacheinander
  > Burgess schildert die übliche Übergabe: Das Design arbeitet am Layout, gibt es an die Grafik ab, die Grafik macht einen Art-Pass, und erst danach zeigt sich, dass Deckung zu dünnen Stangen und Sichtblocker zu Zäunen geworden sind. Bethesda setzt deshalb Kit-Artist und Level-Designer von Anfang an zusammen und bringt die Kits so früh wie möglich in einen „functional-but-ugly“ Zustand. Allein am Projekt bist du beides. Dann hilft die Trennung in zwei Ebenen und ein Test nach jedem Art-Pass ([Transkript](http://blog.joelburgess.com/2013/04/skyrims-modular-level-design-gdc-2013.html), [Folien](https://www.slideshare.net/slideshow/gdc2013-kit-buildingfinal/17728576)).

  > [!INTERVIEW]
  > „Nach dem Art-Pass finden Tester den Ausgang nicht mehr. Was tust du?“ Gute Antwort: Ich vergleiche zuerst mit dem Test vor dem Art-Pass, gleiche Zonen, gleiche Aufgabe, neue Tester, damit ich weiß, ob es schlechter geworden ist. Dann prüfe ich, ob die Kollision noch dem Blockout entspricht und ob der Hinweis seinen Kontrast verloren hat, im Graustufen-Screenshot oder als Zahl. Ich ändere die Grafik an der Stelle, eine Sache pro Runde, und teste wieder. Das Layout fasse ich erst an, wenn sich auch die Absicht geändert hat.

  ## Häufige Fehler

  - **Ausgestalten vor dem Test.** Dann gibt es keinen Vergleichswert, und jede Beobachtung kann vom Layout oder von der Grafik kommen.
  - **Kollision aus der Grafik.** Ein Dressing-TileSet mit Kollisionspolygonen ändert den Weg. `collision_enabled = false` an jeder Dressing-Ebene.
  - **`enabled` statt `visible`.** `Walls` mit `enabled = false` hat keine Kollision mehr, die Figur läuft durch alle Wände.
  - **Dressing über den Hinweisen.** `Dressing` steht im Baum hinter `Cues`, und die Boden-Grafik deckt jeden Hinweis zu. Die Reihenfolge ist `Ground`, `Dressing`, `Cues`.
  - **Wand ohne Bild.** `Walls` ist unsichtbar, und an einer Stelle fehlt das Bild. Der Tester stößt an Luft.
  - **Bild ohne Wand.** Ein Busch oder Zaun sieht blockierend aus, ist aber begehbar, oder umgekehrt. Das findet nur der Test.
  - **Hinweisfarbe überall.** Die Farbe der Hinweise taucht jetzt auch in Blumen und Dächern auf, und der Hinweis verschwindet zwischen ihnen.
  - **Alles gleich detailliert.** Der Boden ist so laut wie die Ränder. Ruhe auf dem Weg, Details in Gruppen.

  ## Zusammenfassung

  - Ausgestaltet wird ein Blockout, der einen Test bestanden hat. Tag, Übersichtsbild und Zahlen dieser Runde sind der Vergleichswert.
  - Die Grafik liegt auf `Dressing` mit `collision_enabled = false`. `Walls` bleibt mit `visible = false` als Kollision des Blockouts.
  - `visible = false` behält die Kollision, `enabled = false` schaltet sie ab.
  - Im Baum liegt `Dressing` zwischen `Ground` und `Cues`; die Grafik der Hinweise kommt auf `Cues`.
  - `check_dressing.gd` meldet Kollision in `Dressing`, `Dressing` hinter `Cues` und Wandzellen ohne Bild.
  - Die Tonwerte der Blockout-Vokabel bleiben erhalten; die Hinweisfarbe gehört nur Hinweisen. Graustufen-Screenshot oder Kontrastverhältnis prüfen das.
  - Ein Baukasten hat Teile in ganzen Tiles, ein fertiges Teil vor den Varianten und eine Testszene mit allen Teilen.
  - Licht, Dichte und hohe Teile dürfen Hinweise nicht verdecken.
  - Der Regressionstest wiederholt denselben Test mit neuen Testern. Rückschritte behebst du zuerst in der Grafik.
exercises:
  - id: bereit-fuer-ausgestaltung
    type: choice
    title: Wann fängst du an?
    prompt: |
      Wann ist dein Blockout bereit für die Ausgestaltung?
    options:
      - text: Wenn eine Runde mit Testern die Zeichen aus deiner Absichtsnotiz gezeigt hat und Tag, Übersichtsbild und Zahlen dieser Runde gesichert sind.
        correct: true
        why: Dann weißt du, dass das Layout funktioniert, und hast einen Vergleichswert für den Test danach.
      - text: Wenn der Blockout im Editor vollständig aussieht und alle Ebenen bemalt sind.
        correct: false
        why: Vollständig heißt nicht getestet. Ob Spieler tun, was du willst, zeigt nur ein Test.
      - text: Wenn du selbst den erwarteten Weg ohne Zögern findest.
        correct: false
        why: Du kennst die Absicht. Dein eigener Durchlauf prüft Technik und Maße, nicht ob ein Fremder den Weg findet.
      - text: Wenn die Tiles für den Ort fertig gezeichnet sind.
        correct: false
        why: Fertige Grafik ist eine Frage der Grafik, nicht des Layouts. Wer sie einbaut, bevor das Layout getestet ist, baut sie oft zweimal.
    explanation: |
      Die Reihenfolge Blockout, Test, Ausgestaltung schützt dich vor zwei Fehlern: Grafik für ein Layout zu bauen, das sich noch ändert, und nach der Ausgestaltung nicht zu wissen, ob es schlechter geworden ist. Das Level Design Book nennt es einen „mature blockout“, auf den die Grafik wartet.
    resources:
      - title: The Level Design Book · Environment Art
        url: https://book.leveldesignbook.com/process/env-art

  - id: was-darf-sich-aendern
    type: choice
    title: Was darf die Ausgestaltung ändern?
    prompt: |
      Lehrbeispiel: Du gestaltest den getesteten Hof aus. Welche Änderungen erhalten, was der Blockout im Test gezeigt hat?
    options:
      - text: Der graue Boden wird zu Gras-Tiles, die heller bleiben als die Wände.
        correct: true
        why: Das Aussehen ändert sich, die Tonwert-Ordnung der Vokabel bleibt. Was begehbar war, sieht weiter begehbar aus.
      - text: Über der Wand am Nordrand hängen Ranken auf `Dressing`, ohne Kollision.
        correct: true
        why: Reine Grafik auf einer Wand, die schon blockiert hat. Weg und Kollision bleiben gleich.
      - text: Eine Kiste mit Kollision kommt mitten in den Weg zum Tor, weil der Hof leer wirkt.
        correct: false
        why: Das ändert das Layout. Ein Hindernis im getesteten Weg gehört in den Blockout und in einen neuen Test, nicht in die Ausgestaltung.
      - text: Die gelbe Hinweis-Tile wird zu einer braunen Laterne, die im Gras kaum heller ist als der Boden.
        correct: false
        why: Der Hinweis verliert seinen Kontrast. Er ist noch da, aber nicht mehr das, was im Test gewirkt hat.
    explanation: |
      Die Ausgestaltung darf alles ändern, was der Spieler nicht als Information liest, und muss alles halten, was er liest: begehbar und blockiert, Weg und Kollision, Stärke der Hinweise. Eine Laterne als Hinweis ist eine gute Idee, solange sie im Graustufenbild so heraussticht wie vorher die gelbe Tile.
    hints:
      - Zwei Änderungen sind in Ordnung.
    resources:
      - title: The Level Design Book · Environment Art, Readability
        url: https://book.leveldesignbook.com/process/env-art

  - id: walls-unsichtbar
    type: output
    title: Hält die unsichtbare Wand?
    prompt: |
      `Walls` hat Wand-Tiles mit vollem Kollisionsquadrat in den Zellen (8, 5) und (8, 6) und steht auf `visible = false`. `Dressing` zeigt Mauer-Tiles in denselben Zellen und eine Kiste in (5, 5) und (5, 6); `Dressing` hat `collision_enabled = false`. Tiles 16 × 16. Die Figur des Testgeländes, Fußform 10 × 6 mittig über dem Ursprung, startet bei (40, 100) und läuft 2 Sekunden mit 90 px/s nach rechts. Was gibt die Zeile danach aus?
    lang: gdscript
    code: |
      print(roundi(player.position.x))
    expected: |
      123
    hints:
      - Welche Ebene kollidiert überhaupt?
      - Spalte 8 beginnt bei x = 128, die Fußform reicht 5 Pixel nach rechts.
    explanation: |
      Die Kiste auf `Dressing` hat keine Kollision, die Figur läuft durch. `Walls` ist unsichtbar, kollidiert aber weiter, weil `visible` nur das Zeichnen betrifft. Die rechte Kante der Fußform erreicht x = 128 bei x = 123. Gemessen mit Godot 4.7.2: 122,997, gerundet 123. Mit `enabled = false` an `Walls` wäre die Figur nach 120 Physik-Frames bei x = 220, durch die Wand hindurch; ebenfalls gemessen.
    resources:
      - title: Godot Docs · TileMapLayer.enabled
        url: https://docs.godotengine.org/en/stable/classes/class_tilemaplayer.html#class-tilemaplayer-property-enabled

  - id: pruefung-vorhersagen
    type: output
    title: Was meldet das Prüfskript?
    prompt: |
      `Walls` hat Zellen in (8, 5), (8, 6), (9, 5) und (9, 6). `Dressing` hat Tiles in (8, 5), (8, 6), (9, 5) und (3, 2), ein TileSet ohne Physik-Ebene und `collision_enabled = false`, und `Dressing` steht im Baum vor `Cues`. Was gibt `check_dressing.gd` aus?
    lang: gdscript
    code: |
      if dressing.collision_enabled and dressing.tile_set.get_physics_layers_count() > 0:
      	print("Dressing kann kollidieren: collision_enabled ausschalten")
      if dressing.get_index() > cues.get_index():
      	print("Dressing wird nach Cues gezeichnet und verdeckt Hinweise")
      for cell in walls.get_used_cells():
      	if dressing.get_cell_source_id(cell) == -1:
      		print("Wand ohne Bild: ", cell)
    expected: |
      Wand ohne Bild: (9, 6)
    accept:
      - "Wand ohne Bild: (9,6)"
    hints:
      - Die ersten zwei Bedingungen sind falsch.
      - Das Skript geht die Zellen von `Walls` durch, nicht die von `Dressing`.
    explanation: |
      `collision_enabled` ist aus, die erste Meldung entfällt. `Dressing` steht vor `Cues`, die zweite entfällt auch. Von den vier Wandzellen hat nur (9, 6) kein Bild in `Dressing`; dort stößt ein Tester später an eine Wand, die er nicht sieht. Die Tile in (3, 2) ist Deko ohne Wand und kein Fehler, das Skript fragt nur in eine Richtung. Gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · TileMapLayer.get_used_cells
        url: https://docs.godotengine.org/en/stable/classes/class_tilemaplayer.html#class-tilemaplayer-method-get-used-cells

  - id: kontrast-nachrechnen
    type: output
    title: Sticht der Hinweis noch heraus?
    prompt: |
      Das Modell rechnet das Kontrastverhältnis nach WCAG zwischen Hinweis und Boden, einmal mit den Farben des Blockouts, einmal mit den ausgestalteten. Was gibt es aus?
    lang: python
    code: |
      def kanal(v):
          s = v / 255
          return s / 12.92 if s <= 0.04045 else ((s + 0.055) / 1.055) ** 2.4

      def leuchtdichte(hexwert):
          r, g, b = (int(hexwert[i:i + 2], 16) for i in (1, 3, 5))
          return 0.2126 * kanal(r) + 0.7152 * kanal(g) + 0.0722 * kanal(b)

      def kontrast(a, b):
          hell, dunkel = sorted((leuchtdichte(a), leuchtdichte(b)), reverse=True)
          return (hell + 0.05) / (dunkel + 0.05)

      print(round(kontrast("#f0d23c", "#8c8c8c"), 1))  # Hinweis gegen Boden, Blockout
      print(round(kontrast("#c9a227", "#a89a5a"), 1))  # dasselbe, ausgestaltet
    expected: |
      2.2
      1.2
    hints:
      - Im Blockout ist der Boden mittleres Grau, der Hinweis helles Gelb.
      - Der ausgestaltete Boden ist ein heller Ocker, die Laterne ein dunkleres Gold.
    explanation: |
      Im Blockout liegt das Kontrastverhältnis zwischen Hinweis und Boden bei 2,2 : 1. Ausgestaltet sind es 1,2 : 1, Laterne und Boden sind fast gleich hell; in Graustufen verschmelzen sie. Farbig mag die Laterne noch auffallen, aber sie hat den Unterschied verloren, der im Test gewirkt hat. Die Zahl ersetzt den Test nicht; sie sagt dir vor dem Test, wo du nachsehen solltest. Die Formel stammt aus WCAG 2.2, wie im Modul [Farbe, Rampen und begrenzte Paletten](/pixelart/farbe-paletten).
    resources:
      - title: W3C · WCAG 2.2 · Contrast ratio
        url: https://www.w3.org/TR/WCAG22/#dfn-contrast-ratio

  - id: dressing-ebene
    type: gap
    title: Grafik ohne Kollision, Kollision ohne Grafik
    prompt: |
      Ergänze die Zeilen in `main.tscn`: `Dressing` zeigt die Grafik und kollidiert nie, `Walls` bleibt die Kollision des Blockouts und wird nicht gezeichnet.
    lang: ini
    code: |
      [node name="Dressing" type="TileMapLayer" parent="."]
      tile_set = ExtResource("3")
      ⟦collision_enabled⟧ = false

      [node name="Walls" type="TileMapLayer" parent="Objects"]
      ⟦visible⟧ = false
      y_sort_enabled = true
      tile_set = ExtResource("1")
    gaps:
      - label: Kollision des Layers
        hint: Die Eigenschaft von `TileMapLayer`, die Kollisionen an- oder ausschaltet.
      - label: nicht zeichnen
        hint: Eine Eigenschaft von `CanvasItem`. Nicht `enabled`, das schaltet auch die Kollision ab.
    explanation: |
      `collision_enabled = false` sichert `Dressing` gegen Kollisionspolygone aus kopierten TileSets. `visible = false` an `Walls` blendet die grauen Tiles aus, die Kollision bleibt. Mit `enabled = false` wäre `Walls` ganz abgeschaltet, auch die Kollision; mit Godot 4.7.2 nachgeprüft, die Figur läuft dann durch die Wand.
    resources:
      - title: Godot Docs · TileMapLayer.collision_enabled
        url: https://docs.godotengine.org/en/stable/classes/class_tilemaplayer.html#class-tilemaplayer-property-collision-enabled

  - id: kiste-im-gang
    type: bug
    title: Die Kiste, die nur Deko sein sollte
    prompt: |
      Nach der Ausgestaltung bleiben Tester im Gang vor einer Kiste hängen, die nur Deko sein soll. `Walls` hat an dieser Stelle keine Zelle. Dein Dressing-TileSet ist eine Kopie des Blockout-TileSet, die Kiste ist die Tile `2:0`, und `Dressing` hat in `main.tscn` keine Zeile `collision_enabled`. Finde die Zeile im Dressing-TileSet, die die Figur aufhält.
    lang: ini
    code: |
      [sub_resource type="TileSetAtlasSource" id="atlas"]
      texture = ExtResource("1")
      0:0/0 = 0
      1:0/0 = 0
      2:0/0 = 0
      2:0/0/physics_layer_0/polygon_0/points = PackedVector2Array(-8, -8, 8, -8, 8, 8, -8, 8)
      3:0/0 = 0

      [resource]
      physics_layer_0/collision_layer = 1
      sources/0 = SubResource("atlas")
    lines: [6]
    explanation: |
      Die Kiste hat ein volles Kollisionsquadrat, und weil `collision_enabled` an `Dressing` nicht ausgeschaltet ist, gilt der Standard `true`. Mit Godot 4.7.2 nachgestellt: Kiste in Spalte 5, die Figur bleibt bei x = 75 stehen. Zwei Abhilfen, am besten beide: die Zeile mit dem Polygon löschen und `collision_enabled = false` an `Dressing` setzen. `check_dressing.gd` hätte den Fehler vor dem Test gemeldet.
    hints:
      - Welche Zeile gibt einer einzelnen Tile eine Form?
    resources:
      - title: Godot Docs · Using TileSets · Adding collision
        url: https://docs.godotengine.org/en/stable/tutorials/2d/using_tilesets.html#adding-collision-navigation-and-occlusion-to-the-tileset

  - id: krone-ueber-hinweis
    type: bug
    title: Der Hinweis ist weg
    prompt: |
      Lehrbeispiel: Im Blockout haben drei von drei Testern den Hinweis `!` beim Tor gesehen. Nach der Ausgestaltung läuft niemand mehr direkt zum Tor. Die Rasterkarte zeigt den ausgestalteten Hof. Legende: `#` Wand, `.` Boden, `+` Tor, `S` Start, `!` Hinweis, `T` Baum, zwei Tiles hoch; sein Bild ragt eine Zeile nach oben über die Zelle darüber. Finde die Zeile mit dem Element, das den Hinweis verdeckt.
    lang: text
    code: |
      ####################
      #..................#
      #.................!+
      #.................T#
      #S.................#
      #..................#
      ####################
    lines: [4]
    explanation: |
      Der Baum steht direkt unter dem Hinweis. In der Draufsicht ragt sein Bild eine Zeile nach oben und deckt die Zelle mit `!` zu. Im Editor fällt das kaum auf, im Spiel siehst du statt der Markierung eine Baumkrone. Liegt der Baum auf einer Ebene unter `Objects`, wird er außerdem nach `Cues` gezeichnet, also immer darüber. Der Baum muss nicht weg; er darf nur nicht unter dem Hinweis stehen.
    hints:
      - Welche Zelle liegt direkt unter dem `!`?
    resources:
      - title: Godot Docs · Using TileMaps · Multiple TileMapLayers and settings
        url: https://docs.godotengine.org/en/stable/tutorials/2d/using_tilemaps.html#multiple-tilemaplayers-and-settings

  - id: kollision-folgt-blockout
    type: explain
    title: Warum die Kollision im Blockout bleibt
    prompt: |
      Erkläre in drei bis fünf Sätzen, warum die Kollision nach der Ausgestaltung aus `Walls` kommt und nicht aus der Grafik, und was diese Einstellungen dafür tun.
    lang: ini
    code: |
      [node name="Dressing" type="TileMapLayer" parent="."]
      tile_set = ExtResource("3")
      collision_enabled = false

      [node name="Walls" type="TileMapLayer" parent="Objects"]
      visible = false
      y_sort_enabled = true
      tile_set = ExtResource("1")
    points:
      - Der Blockout hat mit genau dieser Kollision einen Test bestanden; die Ausgestaltung soll das Aussehen ändern, nicht den Weg.
      - "`visible = false` blendet die grauen Tiles aus, die Kollision von `Walls` bleibt erhalten."
      - "`collision_enabled = false` sorgt dafür, dass keine Dressing-Tile den Weg verändert, auch wenn das TileSet Polygone mitbringt."
      - Grafik und Kollision können jetzt auseinanderlaufen; deshalb prüft `check_dressing.gd` Wände ohne Bild, und der Regressionstest prüft den Rest.
    explanation: |
      Die Kollision ist das Ergebnis des Blockouts: Mit ihr sind die Tester den Weg gegangen, den du wolltest. Würde sie mit der Grafik neu entstehen, hätte jede Kiste und jede Mauerkante die Chance, den Weg zu verändern, und du müsstest das Layout neu testen. Deshalb bleibt `Walls` die einzige Kollision, nur ausgeblendet, und `Dressing` ist reine Grafik. Der Preis ist, dass beide auseinanderlaufen können: eine Wand ohne Bild oder ein Bild, das wie eine Wand aussieht. Das Erste findet das Prüfskript, das Zweite der Test mit neuen Testern.
    resources:
      - title: Godot Docs · CanvasItem.visible
        url: https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#class-canvasitem-property-visible

  - id: baukasten-szene
    type: practice
    title: Ein kleiner Baukasten
    prompt: |
      Leg für deinen Abschnitt einen kleinen Baukasten an, mit eigenen Tiles oder mit dem Prüfmuster aus dem Godot-Kurs, und eine Testszene, in der jedes Teil einmal liegt. Welche Teile es gibt und wie sie aussehen, entscheidest du aus deiner Blockout-Vokabel.
    lang: prose
    starter: |
      Vokabel-Tile → Baukasten-Teil(e):
    checklist:
      - Jede Tile deiner Blockout-Vokabel hat mindestens ein Gegenstück im Baukasten.
      - Teile über mehrere Zellen haben Maße in ganzen Tiles.
      - Ein Teil ist fertig, bevor es Varianten davon gibt.
      - Das Dressing-TileSet hat keine Physik-Ebene, oder jede Dressing-Ebene hat `collision_enabled = false`.
      - Die Testszene zeigt jedes Teil einmal, und du bist mit der Figur hindurchgelaufen.
      - Die Hinweisfarbe kommt in keinem Teil vor, das kein Hinweis ist.
    hints:
      - Weniger Teile machen den Test leichter. Zwei Bodenvarianten reichen für den Anfang.
    explanation: |
      Der Baukasten ist die Übersetzung deiner Vokabel in Grafik. Wenn jedes Teil ein Gegenstück in der Vokabel hat, weißt du bei jedem Pixel, welche Information es tragen soll. Die Testszene zeigt dir, ob die Teile nebeneinander funktionieren, bevor sie im Abschnitt liegen. Wie du Tiles zeichnest, zeigt [Umgebung und Tiles, die Figuren tragen](/pixelart/umgebung-tiles).
    resources:
      - title: Joel Burgess · Skyrim's Modular Level Design (Folien, GDC 2013)
        url: https://www.slideshare.net/slideshow/gdc2013-kit-buildingfinal/17728576
      - title: The Level Design Book · Environment Art, „Make a prop zoo“
        url: https://book.leveldesignbook.com/process/env-art

  - id: bildschirm-ausgestalten
    type: practice
    title: Einen Bildschirm ausgestalten
    prompt: |
      Gestalte einen Bildschirm deines getesteten Abschnitts aus, mit deinem Baukasten auf `Dressing`. Prüf danach Kollision, Wände und Tonwerte. Wie der Ort aussieht, entscheidest du; die Checkliste prüft nur, dass der Test von vorher noch gelten kann.
    lang: prose
    checklist:
      - Der Blockout hat vorher einen Test bestanden, und Tag, Übersichtsbild und Zahlen sind gesichert.
      - Die Grafik liegt auf `Dressing` oder Ebenen darunter, `Walls` steht auf `visible = false`, nicht auf `enabled = false`.
      - Im Baum liegt `Dressing` zwischen `Ground` und `Cues`, und die Grafik der Hinweise liegt auf `Cues`.
      - "`check_dressing.gd` läuft ohne Meldung."
      - Du hast von derselben Stelle einen Screenshot im Blockout und einen danach in Graustufen verglichen, und blockierende Flächen sind weiter dunkler als der Boden oder folgen einer neuen Regel, die du notiert hast.
      - Jeder Hinweis hat gegen seine Umgebung mindestens den Kontrast aus dem Blockout, gemessen oder im Graustufenbild verglichen.
      - Kein hohes Teil steht direkt unter einem Hinweis.
    hints:
      - Fang mit dem Boden an, dann die Wände, die Hinweise zuletzt. Dann siehst du, ob sie gegen den fertigen Hintergrund noch wirken.
    explanation: |
      Ein Bildschirm reicht, um das Verfahren zu prüfen, bevor du den ganzen Abschnitt ausgestaltest. Die Checkliste prüft nichts am Aussehen, nur, dass die Information aus dem Blockout erhalten ist. Ob sie wirkt, zeigt erst der Regressionstest.
    resources:
      - title: The Level Design Book · Environment Art, „How to art pass“
        url: https://book.leveldesignbook.com/process/env-art

  - id: regressionstest
    type: practice
    title: Derselbe Test nach der Ausgestaltung
    prompt: |
      Wiederhole den bestandenen Test des Blockouts mit dem ausgestalteten Stand: gleiche Absichtsnotiz, gleiche Zonen, gleiche Zahl an Testern, neue Tester. Vergleiche vorher und nachher und notiere, was sich geändert hat.
    lang: prose
    starter: |
      Stand vorher (Tag) / nachher (Tag):
      Tester vorher / nachher:
      Ziel erreicht vorher / nachher:
      Zeit bis zum Ziel vorher / nachher:
      Neue Halte oder Umwege (Ort, Zeit):
      Nächste Änderung (eine):
    checklist:
      - Beide Stände haben einen Tag, und `check_dressing.gd` lief vor dem Test ohne Meldung.
      - Die Tester kannten den Abschnitt nicht, auch nicht den Blockout.
      - Die Zahlen vorher und nachher stammen aus Zonen-Logs oder Übersichtsbildern, nicht aus der Erinnerung.
      - Jeder Rückschritt nennt Ort und Zeit, und Beobachtung und Deutung stehen getrennt.
      - Die nächste Änderung betrifft die Ausgestaltung an einer Stelle; eine Änderung am Layout ist nur notiert, wenn sich die Absicht geändert hat.
    hints:
      - Leg die zwei Übersichtsbilder nebeneinander, bevor du die Protokolle liest.
    explanation: |
      Der Regressionstest beantwortet eine einzige Frage: Hat die Ausgestaltung etwas gekostet? Weil nur die Grafik anders ist, liegt ein Rückschritt vermutlich an der Grafik; prüf trotzdem mit dem Protokoll, ob die neuen Tester etwas anderes getan haben, das nichts mit ihr zu tun hat. Wie du die Stelle diagnostizierst und eine Änderung pro Runde machst, zeigt [Überarbeiten](/level-design/ueberarbeiten).
    resources:
      - title: The Level Design Book · Playtesting
        url: https://book.leveldesignbook.com/process/blockout/playtesting
