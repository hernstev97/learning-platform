    url: https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf
  - title: Christopher W. Totten, „Designing Better Levels Through Human Survival Instincts“ (Game Developer, 2011)
    url: https://www.gamedeveloper.com/design/designing-better-levels-through-human-survival-instincts
lesson: |
  Lehrbeispiel: Ein Abschnitt aus drei Bildschirmen. Ein Gang, ein Raum mit Gegnern, ein Gang, ein Raum mit Gegnern, ein Gang, ein Raum mit Gegnern. Im Test funktioniert jeder Raum für sich: Die Tester finden den Eingang, nutzen die Fläche und finden den Ausgang. Trotzdem werden sie im dritten Raum schneller und nachlässiger, und einer sagt: „Schon wieder.“ Kein Raum ist kaputt. Die Folge ist es.

  Rhythmus ist die Ordnung eines Abschnitts in der Zeit: was nacheinander passiert, wie lange es dauert und wo der Spieler Luft holt. Dieses Modul zeigt, wie du einen Abschnitt in Takte zerlegst, sie als Taktplan in Textform notierst, ihre Dauer aus Weglänge und Tempo abschätzt und Aussicht, Ruhe und Kontrast bewusst setzt. Begegnungen kommen hier nur als Raum und als Takt vor. Was in ihnen passiert, ist Combat Design ([Gegnermuster](/combat/gegnermuster), [Große Kreaturen als Bosse](/combat/grosse-gegner)).

  ## Takte: woraus ein Abschnitt in der Zeit besteht

  Das Level Design Book definiert: „Pacing is the general order and rhythm of activities and events in a level.“ Die kleinste Einheit nennt es Beat: „A beat is a small self-contained chunk of a level. A single area, event, activity, or element.“ ([Pacing](https://book.leveldesignbook.com/process/preproduction/pacing#beats-and-variation)). In diesem Kurs heißt ein Beat **Takt**.

  Valve hat für Half-Life 2: Episode Two und Left 4 Dead Takte in vier Arten sortiert: Explore, Combat, Choreo und Puzzle. Das Buch fügt hinzu: „For each project, you must devise your own categories and metrics.“ ([Pacing, Graph](https://book.leveldesignbook.com/process/preproduction/pacing#graph)). Für ein Top-down-Spiel mit Erkundung arbeitet dieser Kurs mit fünf Arten:

  | Art | Was der Spieler tut | Lehrbeispiel |
  | --- | --- | --- |
  | Bewegung | geht von A nach B, ohne neue Aufgabe | Gang zwischen zwei Höfen |
  | Beobachtung | bekommt einen Überblick oder sieht ein Ziel | Treppenabsatz über einem Hof |
  | Entdeckung | findet etwas abseits des Hauptwegs | Nische mit Fundstück |
  | Begegnung | muss mit einer Gefahr umgehen | Freifläche mit Gegnern |
  | Ruhe | nichts verlangt etwas von ihm | Raum ohne Gefahr am Ende eines Wegs |

  Die Arten sind ein Werkzeug, keine Vorschrift. Brauchst du für dein Spiel andere, leg sie fest und bleib dabei.

  Zu jedem Takt gehört eine **Intensität**, also wie viel Aufmerksamkeit er verlangt. Unter den Fragen, die ein Plan beantworten soll, nennt das Buch: „When should the player pay more attention, and when do they rest and recover?“ Zugleich warnt es: „The intensity score is just a gut feeling that emerges from knowing the game and observing playtests. It's not a hard science.“ Eine Intensität von 0 bis 5 ist also eine Schätzung, die du im Playtest prüfst.

  ## Der Taktplan als Text

  Das Buch nennt mehrere Formen, Takte festzuhalten, darunter eine Liste („Beat sheet, simple text list of beats“) und ein Balkendiagramm der Intensität über die Zeit ([Plotting and documentation](https://book.leveldesignbook.com/process/preproduction/pacing#plotting-and-documentation)). In diesem Kurs heißt so eine Liste **Taktplan** (englisch oft beat chart oder, im Level Design Book, beat sheet). Am Handy passt beides in einen Textblock: eine Zeile pro Takt, die Weglänge in Tiles, die geschätzte Intensität als Zahl und als Balken.

  ```text
  Nr Art          Tiles  Int.
  1  Bewegung       30   1 =
  2  Beobachtung     6   2 ==
  3  Begegnung      12   4 ====
  4  Ruhe            8   0
  5  Entdeckung     14   2 ==
  6  Bewegung       25   1 =
  ```

  Lies den Plan von oben nach unten wie eine Melodie. Wo stehen die Spitzen? Wie viele Takte liegen zwischen zwei Spitzen? Folgen zwei gleiche Arten aufeinander? Wo ist die längste Strecke ohne Ruhe? Diese Fragen beantwortest du, bevor du ein Tile gesetzt hast. Ob die Antworten stimmen, zeigt erst der Test.

  > [!NOTE] Dein Plan
  > Welche Takte dein Abschnitt hat und in welcher Reihenfolge, entscheidest du. Eine KI darf dir ein kleines Skript schreiben, das aus deinem Plan Zeiten rechnet. Den Plan selbst lässt du dir nicht vorschlagen.

  ## Dauer aus Weglänge und Tempo

  In der Draufsicht kannst du die Dauer eines Bewegungstakts aus der Skizze ablesen. Die Platzhalter der Testszene aus [Godot-Start](/combat/godot-start) sind Tiles mit 16 Pixeln und ein Tempo von 90 Pixeln pro Sekunde. Ein Tile dauert dann 0,18 Sekunden, ein Bildschirm quer (20 Tiles) 3,6 Sekunden. Deine echten Werte legst du selbst fest.

  ```python run
  TILE = 16   # px, Platzhalter
  TEMPO = 90  # px/s, Platzhalter

  def sekunden(tiles):
      s = tiles * TILE / TEMPO
      return round(s, 1)

  takte = [("Bewegung", 30),
           ("Beobachtung", 6),
           ("Begegnung", 12),
           ("Ruhe", 8)]
  for art, tiles in takte:
      print(art, sekunden(tiles))
  ```

  Der Gang mit 30 Tiles, anderthalb Bildschirme lang, dauert 5,3 Sekunden. Ein Weg, der auf dem Karopapier lang aussieht, ist im Spiel oft nach wenigen Sekunden vorbei.

  Für die anderen Arten liefert die Rechnung nur eine Untergrenze: die Zeit, die ein Spieler ohne Halt für den Weg braucht. Eine Begegnung auf 12 Tiles dauert nicht 2,1 Sekunden, und eine Nische mit Fundstück hält den Spieler länger, als der Weg hinein dauert. Diese Verweildauer misst du im Playtest ([Playtests beobachten](/level-design/playtest-methode)). Der Unterschied ist selbst ein Befund: Dauert ein Takt im Test viel länger als sein Weg, ist dort etwas passiert.

  > [!WARNING] Weglänge ist nicht Dauer
  > Die Rechnung aus Tiles und Tempo stimmt nur für Bewegung ohne Halt. Für Beobachtung, Entdeckung, Begegnung und Ruhe ist sie die kürzeste mögliche Zeit.

  ## Anspannung und Ruhe: der AI Director von Left 4 Dead

  Michael Booth hat 2009 beschrieben, wie Left 4 Dead (Valve) Anspannung und Ruhe abwechselt ([The AI Systems of Left 4 Dead](https://cdn.akamai.steamstatic.com/apps/valve/2009/ai_systems_of_l4d_mike_booth.pdf)). Vorbild war Counter-Strike, dessen Pacing er „spiky“ nennt, „with periods of quiet tension punctuated by unpredictable moments of intense combat“. Zwei Zeilen seiner Folien fassen das Problem zusammen: „Constant, unchanging combat is fatiguing“ und „Long periods of inactivity are boring“.

  Das System, das Valve AI Director nennt, schätzt für jeden Spieler eine „Survivor Intensity“. Sie steigt, wenn der Spieler Schaden nimmt, kampfunfähig wird, von einer Kante gezogen wird oder wenn in seiner Nähe Gegner sterben. Mit der Zeit klingt sie ab. Daraus steuert der Director vier Phasen:

  - **Build Up:** volle Bedrohung, bis die Intensität die Spitze überschreitet.
  - **Sustain Peak:** volle Bedrohung noch 3 bis 5 Sekunden nach der Spitze.
  - **Peak Fade:** minimale Bedrohung, bis die Intensität aus dem Spitzenbereich abklingt.
  - **Relax:** minimale Bedrohung für 30 bis 45 Sekunden oder bis die Spieler weit genug zum nächsten Safe Room gelaufen sind, dann wieder Build Up.

  Zwei Punkte aus den Folien zählen für handgebaute Abschnitte. Erstens: „Algorithm adjusts pacing, not difficulty“. Der Director macht die Spitzen nicht höher, er verteilt sie. Rhythmus und Schwierigkeit sind zwei verschiedene Größen. Zweitens hängt die Ruhe am Raum. Sie endet nach einer Zeit oder nach einer Strecke Richtung nächster sicherer Raum.

  Dein Abschnitt hat keinen Director. Du legst die Täler fest an Orte, und du kannst nicht messen, wie angespannt ein Spieler gerade ist. Übernehmen kannst du das Muster: Aufbau, Spitze, Abklingen, Ruhe, und die Ruhe an einen Ort gebunden. Booths 30 Sekunden Ruhe wären bei 90 Pixeln pro Sekunde über acht Bildschirme Weg. In einem Abschnitt von zwei bis vier Bildschirmen entsteht Ruhe deshalb selten durch Weglänge allein. Sie braucht einen Ort, an dem der Spieler stehen bleibt.

  Das Level Design Book gibt dieselbe Richtung als Rat: „Start slow and quiet.“ und „Alternate highs and lows.“ Wer zu lange auf hoher Intensität bleibt, stumpft ab, „otherwise the player will simply go numb“ ([Pacing advice](https://book.leveldesignbook.com/process/preproduction/pacing#pacing-advice)).

  > [!MERKE] Rhythmus ist Wechsel
  > Ein Takt wirkt durch seine Nachbarn. Eine Spitze braucht ein Tal davor und danach, eine Ruhe braucht etwas, wovon sie ausruht.

  ## Aussicht vor der Freifläche, Ruhe danach

  Christopher W. Totten überträgt die Prospect-Refuge-Theorie aus der Architektur auf Level ([Game Developer, 2011](https://www.gamedeveloper.com/design/designing-better-levels-through-human-survival-instincts)). Prospect ist bei ihm „an open space where the player is exposed to threats and feels vulnerable“. Refuges sind geschützte Orte, von denen aus frühe Menschen in die offene Fläche schauen und Gefahren einschätzen konnten. Totten beschreibt Folgen aus Zuflucht, Freifläche und nächster Zuflucht. Die nächste Zuflucht zieht den Spieler voran: „Secondary Refuges can urge the occupant of a space forward“. Bossräume nennt er als Beispiel für Prospect-Räume.

  Das Level Design Book widerspricht: „This book argues that prospect-refuge, as traditionally understood, has limited application to level design.“ ([Prospect-refuge](https://book.leveldesignbook.com/process/blockout/massing/prospect-refuge)). Es schlägt vor, statt von prospect von sightline und vista zu sprechen, statt von refuge von cover, enclosure oder safe house. Eine vista ist ein Aussichtspunkt mit vielen Sichtlinien, nützlich „especially for an arena layout before an encounter begins“. Sicherheit ist für das Buch kein Merkmal einer Form: „No shape or layout is intrinsically safe.“ Ein Raum wirkt sicher, weil das Spiel dort bisher nicht angegriffen hat, weil dort ein Speicherpunkt steht oder weil die Begegnung vorbei ist.

  Für deinen Taktplan folgen daraus zwei Bausteine, ohne Theorie über Instinkte:

  - **Aussicht vor der Freifläche.** Ein Beobachtungstakt direkt vor einer Begegnung zeigt dem Spieler die Fläche, bevor er sie betritt. In der Draufsicht ist das eine Kamerafrage. Steht die Figur am unteren Rand einer Freifläche und hält die Kamera sie mittig, sieht der Spieler nach oben nur gut 5 Tiles weit. Passt die Fläche ins Bild, solange er noch am Eingang steht? Was die Kamera zeigt, behandelt [Wege, Landmarken und Sichtlinien](/level-design/orientierung), wie groß eine Freifläche sein muss, [Maßstab, Dichte und Freiflächen](/level-design/massstab-dichte).
  - **Ruhe nach der Spitze.** Ein Ort nach der Begegnung, an dem nichts verlangt wird. Ob er sich sicher anfühlt, hängt daran, was das Spiel dort bisher getan hat, nicht an seiner Form.

  Entdeckungen haben einen eigenen Rhythmus. Andrew Shouldice, Entwickler von Tunic, teilt das Lernen über ein Geheimnis in drei Phasen: „You start not knowing [something], that's the ignorance phase. And there's [the] knowledge [phase] where you know something exists, but you don't understand it.“ Danach folgt: „Understanding is closure.“ Laut dem Bericht von Game Developer interessiert ihn die mittlere Phase am meisten ([Game Developer, 2023](https://www.gamedeveloper.com/design/video-how-the-tunic-developers-built-a-mysterious-world)). Für den Taktplan heißt das: Eine Entdeckung kann über mehrere Takte reichen. Der Spieler sieht etwas in einem Beobachtungstakt und erreicht es erst Takte später. Dazwischen trägt die offene Frage den Abschnitt.

  ## Monotonie und Kontrast

  Monotonie hat zwei Formen. Die eine ist eine zu lange Spitze, Booths „fatiguing“. Das Level Design Book schreibt, auch ein intensiver Bosskampf werde nach zehn Minuten zur Plackerei: „Any intense boss fight will feel like a slog after 10+ minutes.“ Die andere ist zu viel Gleiches auf mittlerer Höhe, wie im Lehrbeispiel am Anfang: drei gleiche Räume hintereinander, keiner davon ein Ereignis.

  Im Taktplan erkennst du beides an zwei Zeichen. Mehrere Takte derselben Art folgen aufeinander, oder die Balken bleiben über viele Zeilen gleich lang. Die Gegenmittel sind Kontrast in der Art, etwa eine Entdeckung nach einer Begegnung, und Kontrast in der Intensität: ein Tal nach einer Spitze oder eine Spitze nach langer gleicher Mitte. Welches Mittel du wählst und was in dem neuen Takt passiert, entscheidest du.

  > [!PRAXIS] Valve ändert den Rhythmus nach Playtests
  > Valve testete jeden Freitag mit Menschen außerhalb des Teams. Der Level-Designer Phil Co beschreibt, wie sich dabei Monotonie zeigte: „we might have too much of one particular gameplay and the playtester suffers from fatigue.“ In Half-Life 2: Episode Two bestand der Teil vor dem Auto fast nur aus Kämpfen „with just a few enemies at a time“. Das Team fügte deshalb eine Spitze ein, „a combat high moment“: ein Gebäude, in dem Alyx den Spieler mit dem Scharfschützengewehr unterstützt (zitiert im [Level Design Book](https://book.leveldesignbook.com/process/blockout/playtesting#playtesting-at-valve)). Die Antwort auf Ermüdung war dort keine Pause, sondern ein Kontrast.

  ## Begegnungen als Raum und Takt

  In diesem Kurs ist eine Begegnung ein Platz im Taktplan: ein Ort mit einer Größe, ein Weg hinein und hinaus, eine Aussicht davor oder keine, und ein Takt danach. Was die Gegner tun, wie viele es sind und wie sie sich ankündigen, gehört nicht in den Taktplan des Level-Designs. Booth hat Bossbegegnungen sogar aus dem Director herausgenommen: „Boss Encounters NOT affected by adaptive pacing“, denn „Boss encounters are intended to change up the pacing anyhow“. Eine große Begegnung ist selbst ein Wechsel im Rhythmus.

  Für den Taktplan reichen drei Fragen. Was sieht der Spieler, bevor die Begegnung beginnt? Wie lang ist der Weg hinein und hinaus? Was kommt danach? Wie Gegnermuster eine Begegnung füllen, zeigt [Gegnermuster](/combat/gegnermuster), Arena und Kamera für große Gegner [Große Kreaturen als Bosse](/combat/grosse-gegner). Musik und Klang tragen den Rhythmus mit; das behandelt der spätere Sound-Kurs.

  > [!INTERVIEW] „Wie planst du den Rhythmus eines Abschnitts?“
  > Ich schreibe die Takte als Liste mit Art, geschätzter Intensität und Weglänge in Tiles und rechne die Mindestdauer aus dem Tempo. Dann suche ich die längste Strecke ohne Ruhe und Stellen, an denen zwei gleiche Takte aufeinanderfolgen. Vor jeder Freifläche prüfe ich, ob der Spieler sie überblickt, bevor die Begegnung beginnt. Im Playtest messe ich, wie lange jeder Takt wirklich dauert, und vergleiche das mit dem Plan.

  ## Häufige Fehler

  - **Gleiche Takte hintereinander.** Drei Begegnungen ähnlicher Größe mit kurzen Gängen dazwischen: Im Taktplan steht dreimal dieselbe Zeile. Setz einen Takt anderer Art oder anderer Intensität dazwischen.
  - **Ein Gang als Ruhe.** 20 Tiles Gang sind 3,6 Sekunden. Ruhe braucht einen Ort, an dem der Spieler stehen bleibt, nicht nur Weg.
  - **Die höchste Spitze ganz am Ende.** Das Level Design Book rät: „Avoid maximum intensity final bosses / encounters.“ Valve hat das bei Portal im Test erfahren. Über eine verworfene, sehr intensive Fassung des Endkampfs steht im Post-Mortem „High Intensity = Bad“ ([Swift und Wolpaw, GDC 2008](https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf)).
  - **Intensität mit Schwierigkeit verwechseln.** Booths Director verändert die Verteilung der Spitzen, nicht ihre Höhe. Ein Takt kann intensiv und leicht sein.
  - **Den Plan für das Ergebnis halten.** „You can't playtest a document“, schreibt das Level Design Book über Pacing-Pläne ([Against pacing](https://book.leveldesignbook.com/process/preproduction/pacing#against-pacing)). Die geschätzte Intensität ersetzt den Test nicht.
  - **Kampfinhalte im Taktplan.** Gegnertypen und Muster gehören ins Combat Design. Im Taktplan stehen Ort, Größe, Weg und Dauer.

  ## Zusammenfassung

  - Pacing ist Reihenfolge und Rhythmus der Tätigkeiten in einem Level. Die Einheit ist der Takt (Beat).
  - Dieser Kurs nutzt fünf Arten: Bewegung, Beobachtung, Entdeckung, Begegnung, Ruhe. Die Intensität von 0 bis 5 ist eine Schätzung, die der Playtest prüft.
  - Ein Taktplan in Textform zeigt Spitzen, Täler, Wiederholungen und die längste Strecke ohne Ruhe.
  - Tiles mal 16 durch 90 ergibt die Mindestdauer in Sekunden (Platzhalter). Außer bei Bewegung kommt Verweildauer dazu.
  - Der AI Director von Left 4 Dead wechselt zwischen Build Up, Sustain Peak, Peak Fade und Relax. Er verteilt die Spitzen, die Schwierigkeit ändert er nicht.
  - Eine Aussicht vor einer Freifläche zeigt die Fläche, bevor die Begegnung beginnt. Sicherheit ist ein Zustand des Spiels, keine Form.
  - Monotonie entsteht durch zu lange Spitzen oder zu viel Gleiches. Kontrast in Art oder Intensität hilft.
exercises:
  - id: director-phasen
    type: choice
    title: Was der Director tut
    prompt: |
      Welche Aussagen geben Michael Booths Folien zum AI Director von Left 4 Dead richtig wieder?
    options:
      - text: In der Phase Relax hält der Director die Bedrohung 30 bis 45 Sekunden lang minimal oder bis die Spieler weit genug zum nächsten Safe Room gelaufen sind.
        correct: true
        why: So steht es auf der Folie zu Relax. Die Ruhe endet nach Zeit oder nach Weg.
      - text: Sustain Peak hält die volle Bedrohung noch 3 bis 5 Sekunden, nachdem die Intensität ihre Spitze erreicht hat.
        correct: true
        why: Auf der Folie steht „Continue full threat population for 3-5 seconds after Survivor Intensity has peaked“. Die volle Bedrohung läuft also nach der Spitze noch kurz weiter.
      - text: Spielen die Survivors gut, erhöht der Director die Schwierigkeit der Spitzen.
        correct: false
        why: Booth schreibt „Algorithm adjusts pacing, not difficulty“. Verändert wird die Verteilung der Spitzen, nicht ihre Höhe.
      - text: Bossbegegnungen verschiebt der Director in die Phase Build Up.
        correct: false
        why: Bossbegegnungen sind ausgenommen, „NOT affected by adaptive pacing“. Sie sollen den Rhythmus ohnehin wechseln.
    explanation: |
      Der Director schätzt eine Intensität pro Spieler und schaltet zwischen voller und minimaler Bedrohung. Er verändert, wann Spitzen kommen, nicht wie hoch sie sind. Für handgebaute Abschnitte ist das die wichtigste Lehre: Rhythmus und Schwierigkeit sind zwei getrennte Größen.
    hints:
      - Zwei Aussagen sind richtig.
      - Achte auf die Folie mit dem Satz über „difficulty“.
    resources:
      - title: Michael Booth, „The AI Systems of Left 4 Dead“ (Folien)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2009/ai_systems_of_l4d_mike_booth.pdf

  - id: phasen-ordnen
    type: order
    title: Ein Zyklus des Directors
    prompt: |
      Bring die Phasen des AI Director in die Reihenfolge, in der sie aufeinander folgen. Der Zyklus beginnt mit Build Up.
    lang: prose
    lines: |
      Build Up: volle Bedrohung, bis die Intensität der Spieler die Spitze überschreitet.
      Sustain Peak: volle Bedrohung noch 3 bis 5 Sekunden nach der Spitze.
      Peak Fade: minimale Bedrohung, bis die Intensität aus dem Spitzenbereich abklingt.
      Relax: minimale Bedrohung für 30 bis 45 Sekunden oder bis die Spieler weit genug zum nächsten Safe Room gelaufen sind.
      Danach beginnt der Zyklus wieder mit Build Up.
    explanation: |
      Aufbau, Spitze halten, Abklingen, Ruhe. Peak Fade steht zwischen Spitze und Ruhe, damit ein laufender Kampf zu Ende gehen kann, bevor die Ruhe zählt. Für deinen Taktplan heißt das: Nach einer Begegnung kommt nicht sofort die Ruhe, sondern erst der Ausklang.
    hints:
      - Zweimal volle Bedrohung, zweimal minimale.
    resources:
      - title: Michael Booth, „The AI Systems of Left 4 Dead“ (Folien)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2009/ai_systems_of_l4d_mike_booth.pdf

  - id: ruhe-ist-zustand
    type: choice
    title: Was einen Ort ruhig macht
    prompt: |
      Lehrbeispiel: Nach einer Begegnung auf einer Freifläche soll der Spieler einen Ort zum Durchatmen haben. Welche Aussage entspricht der Haltung des Level Design Book?
    options:
      - text: Ob ein Ort sicher wirkt, hängt am Zustand des Spiels, etwa daran, ob dort bisher angegriffen wurde. Keine Form ist von sich aus sicher.
        correct: true
        why: „No shape or layout is intrinsically safe.“ Das Buch nennt refuge einen Zustand, keine Eigenschaft der Architektur.
      - text: Eine enge Nische mit niedrigem Dach ist nach der Prospect-Refuge-Theorie immer ein Ruheort, also reicht sie.
        correct: false
        why: Das ist die Lesart, gegen die sich das Buch wendet. Eine Nische, in der schon einmal ein Hinterhalt lag, wirkt nicht ruhig.
      - text: Eine Aussicht ist vor allem nach einer Begegnung nützlich, damit der Spieler sieht, was er geschafft hat.
        correct: false
        why: Das Buch nennt die vista nützlich „especially for an arena layout before an encounter begins“, also davor.
      - text: Ruhe entsteht durch einen langen Gang, weil dort nichts passiert.
        correct: false
        why: Ein Gang mit 20 Tiles dauert bei den Platzhaltern 3,6 Sekunden. Ruhe braucht einen Ort zum Stehenbleiben.
    explanation: |
      Das Level Design Book ersetzt refuge durch Begriffe wie cover, enclosure oder safe house und macht Sicherheit zu einer Frage des Spielzustands. Ein Ort wird ruhig, weil das Spiel ihn ruhig hält, und der Spieler lernt das über die Zeit. Deshalb kann derselbe Raum vor der Begegnung bedrohlich und danach ruhig sein.
    hints:
      - Lies die Option, die von Form spricht, und die, die von Zustand spricht.
    resources:
      - title: The Level Design Book · Prospect-refuge, „Safety as game state“
        url: https://book.leveldesignbook.com/process/blockout/massing/prospect-refuge#safety-as-game-state

  - id: takt-dauer
    type: output
    title: Drei Wege in Sekunden
    prompt: |
      Tiles mit 16 Pixeln, Tempo 90 Pixel pro Sekunde, beides Platzhalter. Was gibt das Modell aus?
    lang: python
    code: |
      TILE = 16   # px, Platzhalter
      TEMPO = 90  # px/s, Platzhalter

      def sekunden(tiles):
          s = tiles * TILE / TEMPO
          return round(s, 1)

      print(sekunden(20))
      print(sekunden(45))
      print(sekunden(9))
    expected: |
      3.6
      8.0
      1.6
    hints:
      - Ein Tile dauert 16 / 90 Sekunden, also etwa 0,18.
      - 45 × 16 = 720, und 720 / 90 ist glatt.
    explanation: |
      20 Tiles sind ein Bildschirm quer, 3,6 Sekunden. 45 Tiles ergeben genau 8 Sekunden, 9 Tiles 1,6. Diese Zeiten gelten nur, wenn der Spieler ohne Halt geht. Für einen Bewegungstakt ist das die Dauer, für alle anderen Arten die Untergrenze.
    resources:
      - title: Python · round()
        url: https://docs.python.org/3/library/functions.html#round

  - id: laengste-strecke
    type: output
    title: Wie lange ohne Ruhe?
    prompt: |
      Der Taktplan lautet: Bewegung 30 Tiles, Begegnung 12, Ruhe, Entdeckung 14, Bewegung 25, Begegnung 15, Ruhe. Das Modell sucht die längste Strecke ohne Ruhe, zuerst in Tiles, dann als Mindestdauer in Sekunden. Was gibt es aus?
    lang: python
    code: |
      TILE = 16   # px, Platzhalter
      TEMPO = 90  # px/s, Platzhalter
      # Tiles je Takt, "R" heißt Ruhe
      takte = [30, 12, "R", 14, 25,
               15, "R"]
      lauf = rekord = 0
      for t in takte:
          if t == "R":
              lauf = 0
          else:
              lauf += t
          rekord = max(rekord, lauf)
      s = rekord * TILE / TEMPO
      print(rekord, round(s, 1))
    expected: |
      54 9.6
    hints:
      - Vor der ersten Ruhe liegen 30 + 12 Tiles, zwischen den beiden Ruhen 14 + 25 + 15.
      - 54 × 16 / 90 = 9,6.
    explanation: |
      Die erste Strecke hat 42 Tiles, die zweite 54. Die längste Strecke ohne Ruhe liegt also zwischen den beiden Ruhetakten und dauert mindestens 9,6 Sekunden. In Wirklichkeit dauert sie länger, denn Entdeckung und Begegnung halten den Spieler auf. Das Modell misst Weg, der Playtest misst Zeit. Beides nebeneinander zeigt dir, wo die Verweildauer liegt.
    resources:
      - title: Python · max()
        url: https://docs.python.org/3/library/functions.html#max

  - id: ruhe-in-bildschirmen
    type: output
    title: 30 Sekunden Weg
    prompt: |
      Booths Phase Relax dauert mindestens 30 Sekunden. Wie viele Bildschirme quer (je 20 Tiles) läuft die Figur in dieser Zeit ohne Halt, bei 90 Pixeln pro Sekunde und 16-Pixel-Tiles (Platzhalter)? Eine Nachkommastelle.
    lang: text
    code: |
      Pixel = Sekunden × Tempo
      Tiles = Pixel / 16
      Bildschirme = Tiles / 20
    expected: |
      8,4
    accept: ["8.4", "8,4 Bildschirme", "8,4 Bildschirmbreiten"]
    explanation: |
      30 × 90 = 2700 Pixel, durch 16 sind das 168,75 Tiles, durch 20 rund 8,4 Bildschirme. Ein Abschnitt von zwei bis vier Bildschirmen kann die Ruhe von Left 4 Dead also nicht über Weg allein herstellen. Ruhe braucht dort einen Ort, an dem der Spieler stehen bleibt, oder sie ist kürzer als bei Booth. Wie lang sie in deinem Spiel sein soll, entscheidest du.
    resources:
      - title: Michael Booth, „The AI Systems of Left 4 Dead“ (Folien)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2009/ai_systems_of_l4d_mike_booth.pdf

  - id: begriffe-rhythmus
    type: gap
    title: Fünf Begriffe zum Rhythmus
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Reihenfolge und Rhythmus der Tätigkeiten in einem Level nennt das Level Design Book ⟦Pacing⟧. Einen kleinen, abgeschlossenen Teil davon nennt es ⟦Beat⟧, dieser Kurs sagt Takt. Im AI Director von Left 4 Dead folgt auf Sustain Peak die Phase ⟦Peak Fade⟧, danach ⟦Relax⟧. Statt prospect empfiehlt das Buch für einen Aussichtspunkt vor einer Begegnung den Begriff ⟦vista⟧.
    gaps:
      - label: Fachbegriff für Rhythmus
        hint: Englisch, von „pace“, Schritt oder Tempo.
      - label: Einheit
        hint: Englisch wie in der Musik, vier Buchstaben.
        accept: ["Takt", "Beats"]
      - label: dritte Phase
        hint: Die Spitze klingt ab, zwei Wörter.
        accept: ["Peak-Fade"]
      - label: vierte Phase
        hint: Englisch für „entspannen“.
        accept: ["Relax period", "Ruhe"]
      - label: Aussichtspunkt
        hint: Englisch, fünf Buchstaben, wie in „Panorama“.
        accept: ["Aussicht", "Aussichtspunkt", "sightline"]
    explanation: |
      Pacing und Beat stammen aus dem Level Design Book, die Phasen aus Booths Folien. Peak Fade lässt einen laufenden Kampf ausklingen, Relax hält die Bedrohung danach minimal. Vista und sightline sind die Begriffe, die das Buch statt prospect vorschlägt, weil sie beschreiben, was der Spieler sieht, statt ein Gefühl zu behaupten.
    resources:
      - title: The Level Design Book · Prospect-refuge, „Instead of prospect“
        url: https://book.leveldesignbook.com/process/blockout/massing/prospect-refuge#instead-of-prospect

  - id: dauer-falsch
    type: bug
    title: Ein Takt ist zu kurz gerechnet
    prompt: |
      Ein Taktplan mit Mindestdauern. Eine Zeile ist falsch gerechnet. Tippe sie an und korrigiere sie.
    lang: text
    code: |
      Tile 16 px, Tempo 90 px/s
      Takt 1 Bewegung: 45 Tiles, 8,0 s
      Takt 2 Beobachtung: 9 Tiles, 1,6 s
      Takt 3 Begegnung: 18 Tiles, 2,0 s
      Takt 4 Ruhe: 10 Tiles, 1,8 s
    lines: [4]
    fix:
      - line: 4
        answers: ["Takt 3 Begegnung: 18 Tiles, 3,2 s", "Takt 3 Begegnung: 18 Tiles, 3.2 s"]
    explanation: |
      18 × 16 = 288 Pixel, durch 90 sind das 3,2 Sekunden. Mit 2,0 wirkt die Begegnung im Plan kürzer als ihre eigene Durchquerung. Die anderen Zeilen stimmen: 720 / 90 = 8,0, 144 / 90 = 1,6 und 160 / 90 ≈ 1,8. Eine falsche Untergrenze ist tückisch, weil du im Playtest dann eine Verweildauer siehst, die gar keine ist.
    hints:
      - Rechne jede Zeile nach. Tiles × 16 / 90.

  - id: sicht-verdeckt
    type: bug
    title: Die Brüstung ist eine Wand
    prompt: |
      Lehrbeispiel: Der Spieler kommt bei `S` in einen Vorraum. Von dort soll er über eine niedrige Brüstung die Freifläche mit der Begegnung `B` überblicken, bevor er sie durch den Durchgang betritt. Der Raum passt auf einen Bildschirm. Eine Zeile widerspricht dieser Absicht. Finde sie.

      Legende: `#` Wand, blockiert Weg und Sicht nach dahinter · `o` niedriges Hindernis, blockiert Weg, nicht Sicht · `.` Boden · `+` Durchgang · `S` Start · `B` Begegnung
    lang: text
    code: |
      ####################
      #..................#
      #..................#
      #.........B........#
      #..................#
      #..................#
      #########+##########
      #..................#
      #.....S............#
      ####################
    lines: [7]
    explanation: |
      Zeile 7 trennt Vorraum und Freifläche mit hohen Wänden. Nach der Legende verdecken sie die Sicht auf das, was dahinter liegt, und der Spieler sieht die Freifläche erst, wenn er durch den Durchgang tritt. Für die Absicht müsste die Zeile aus niedrigen Hindernissen bestehen, etwa `#oooooooo+ooooooooo#`. Dann ist der Vorraum ein Beobachtungstakt vor der Begegnung. Ob die Brüstung auch in der Ausgestaltung niedrig aussieht, prüfst du später noch einmal.
    hints:
      - Welche Zeile liegt zwischen `S` und `B`?
      - Vergleich die Bedeutung von `#` und `o` in der Legende.
    resources:
      - title: The Level Design Book · Prospect-refuge, „Instead of prospect“
        url: https://book.leveldesignbook.com/process/blockout/massing/prospect-refuge#instead-of-prospect

  - id: glados-takt
    type: explain
    title: Der letzte Takt von Portal
    prompt: |
      Auszüge aus den Folien des Portal-Post-Mortems von Kim Swift und Erik Wolpaw (Valve, GDC 2008) zum Endkampf. Erkläre in drei bis fünf Sätzen, was Valve über den letzten Takt gelernt hat und was daraus für den letzten Takt eines eigenen Abschnitts folgt.
    lang: prose
    code: |
      Conclusion: High Intensity = Bad. No one paid attention to GLaDOS. Alienated people who liked the slower-paced, cerebral nature of Portal.
      Complex Boss Battle: Nope. The more complex, the longer players would take, resulting in bad pacing.
      What made the Fire Pit climactic? Time Pressure. Visual Impact. High Drama. Easy Puzzle.
    points:
      - Eine sehr intensive Fassung lenkte von der Figur ab und passte nicht zum ruhigeren Rhythmus des restlichen Spiels.
      - Komplexität verlängert die Dauer eines Takts, und die längere Dauer verschlechterte das Pacing.
      - Die gewählte Fassung wirkte als Höhepunkt durch Zeitdruck und Wirkung, nicht durch Schwierigkeit („Easy Puzzle“).
      - Gefunden hat Valve das über mehrere getestete Fassungen, nicht über den Plan.
    explanation: |
      Valve hat mehrere Fassungen des Endkampfs gebaut und verworfen. Die sehr intensive Fassung zog die Aufmerksamkeit von GLaDOS weg und vergraulte Spieler, die das langsame, nachdenkliche Portal mochten. Ein komplexes Rätsel scheiterte an der Dauer, denn je komplexer, desto länger brauchten die Spieler. Der Höhepunkt kam aus Zeitdruck, Wirkung und Drama bei einem leichten Rätsel. Für einen eigenen Abschnitt heißt das: Der letzte Takt muss zum Rhythmus des Ganzen passen, und Höhepunkt heißt nicht höchste Schwierigkeit. Das Level Design Book rät ebenso, die letzte Begegnung nicht auf maximale Intensität zu setzen. Was dein letzter Takt ist, entscheidest du und prüfst es im Test.
    hints:
      - Lies die drei Auszüge als drei Versuche mit je einem Ergebnis.
      - Was steht beim Fire Pit zur Schwierigkeit?
    resources:
      - title: Swift, Wolpaw, „A Portal Post-Mortem“ (GDC 2008, Folien)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf
      - title: The Level Design Book · Pacing, „Avoid maximum intensity final bosses“
        url: https://book.leveldesignbook.com/process/preproduction/pacing#avoid-maximum-intensity-final-bosses-encounters

  - id: director-uebertragen
    type: explain
    title: Ein Director ohne Director
    prompt: |
      Dein Abschnitt hat kein System, das die Anspannung der Spieler misst. Erkläre in drei bis fünf Sätzen, was du vom AI Director für einen handgebauten Abschnitt übernehmen kannst und was nicht. Die Auszüge stammen aus Booths Folien.
    lang: prose
    code: |
      Estimate the “emotional intensity” of each Survivor. Track the max intensity of all 4 Survivors. If intensity is too high, remove major threats for awhile. Otherwise, create an interesting population of threats.
      Relax: Maintain minimal threat population for 30-45 seconds, or until Survivors have traveled far enough toward the next safe room, then resume Build Up.
      Algorithm adjusts pacing, not difficulty.
    points:
      - Übernehmen lässt sich das Muster aus Aufbau, Spitze, Abklingen und Ruhe.
      - Die Ruhe wird an einen Ort gebunden, wie bei Booth an den Weg zum nächsten Safe Room.
      - Rhythmus und Schwierigkeit bleiben getrennt; der Director verteilt Spitzen, er macht sie nicht höher.
      - Nicht übernehmen lässt sich die Messung in Echtzeit. Die Intensität ist im Plan geschätzt und wird im Playtest geprüft.
    explanation: |
      Der Director misst für jeden Spieler eine Intensität und schaltet danach zwischen voller und minimaler Bedrohung. Ein handgebauter Abschnitt kann das Muster übernehmen: Aufbau, Spitze, Ausklang und Ruhe, die Ruhe an einen Ort gebunden, so wie in Left 4 Dead an den Safe Room. Ebenso lässt sich die Trennung übernehmen, dass Rhythmus nicht Schwierigkeit ist. Was fehlt, ist die Messung. Wann ein Spieler wirklich angespannt ist, weißt du nicht vorher, deshalb schätzt du die Intensität im Taktplan und prüfst sie im Playtest an Verweildauer, Umkehr und Gesagtem.
    hints:
      - Trenne das Muster vom Messen.
    resources:
      - title: Michael Booth, „The AI Systems of Left 4 Dead“ (Folien)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2009/ai_systems_of_l4d_mike_booth.pdf

  - id: taktplan-veroeffentlicht
    type: practice
    title: Taktplan eines fremden Abschnitts
    prompt: |
      Wähle zwei bis fünf Minuten aus einem veröffentlichten Top-down-Spiel, das du kennst, oder aus einem Video davon. Schreib einen Taktplan mit höchstens acht Takten. Je Takt: Art, geschätzte Intensität von 0 bis 5 und Dauer (geschätzt oder mit Zeitangaben aus dem Video). Markiere zum Schluss die längste Strecke ohne Ruhe.
    lang: prose
    starter: |
      Spiel, Stelle:
      1 Art / Int. / Dauer:
      2 Art / Int. / Dauer:
      3 Art / Int. / Dauer:
      Längste Strecke ohne Ruhe:
    checklist:
      - Spiel und Stelle sind so genannt, dass jemand sie wiederfindet.
      - Jeder Takt hat eine der fünf Arten oder eine Art, die du vorher selbst festgelegt hast.
      - Jeder Takt hat eine Intensität von 0 bis 5 und eine Dauer.
      - Die längste Strecke ohne Ruhe ist mit ihren Takten benannt.
      - Du notierst, ob vor einer Begegnung ein Beobachtungstakt liegt.
    explanation: |
      Ein fremder Abschnitt zeigt dir, wie veröffentlichte Spiele Spitzen und Täler setzen, ohne dass du selbst etwas bauen musst. Die Intensität bleibt deine Schätzung. Wenn du denselben Abschnitt später mit jemand anderem vergleichst, siehst du, wie unterschiedlich zwei Menschen dieselbe Stelle einordnen, und genau deshalb gehört die Schätzung in den Playtest.
    hints:
      - Ein Takt endet, wenn sich ändert, was der Spieler tut.
    resources:
      - title: The Level Design Book · Pacing, „Plotting and documentation“
        url: https://book.leveldesignbook.com/process/preproduction/pacing#plotting-and-documentation

  - id: taktplan-eigen
    type: practice
    title: Dein eigener Taktplan
    prompt: |
      Für einen eigenen Abschnitt von zwei bis vier Bildschirmen: Welche Takte er hat, entscheidest du. Schreib den Taktplan mit Art, Weglänge in Tiles, Mindestdauer in Sekunden und geschätzter Intensität. Notiere darunter, welcher Takt im Test vermutlich viel länger dauert als sein Weg, und warum.
    lang: prose
    starter: |
      Abschnitt (Bildschirme):
      Tempo, Tilegröße:
      Takte (Art, Tiles, s, Int.):
      Längste Strecke ohne Ruhe:
      Takt, der länger dauern wird:
    checklist:
      - Der Plan hat höchstens acht Takte, jeder mit Art, Tiles, Sekunden und Intensität.
      - Die Sekunden sind aus Tiles und deinem Tempo gerechnet, und du hast notiert, welche Werte Platzhalter sind.
      - Die längste Strecke ohne Ruhe ist benannt.
      - Begegnungen stehen nur mit Ort, Größe, Weg und Dauer im Plan, ohne Gegnertypen.
      - Du hast eine Vermutung notiert, die du im Playtest prüfen kannst.
    explanation: |
      Dieser Plan ist eine Hypothese über die Zeit. Die gerechneten Sekunden sind die Untergrenze, die Vermutung zum längeren Takt ist deine erste Testfrage. Im Playtest misst du, wie lange die Takte wirklich dauern ([Playtests beobachten](/level-design/playtest-methode)), und vergleichst die Zahlen mit diesem Plan.
    hints:
      - Fang mit der Skizze an und miss die Wege in Kästchen.
    resources:
      - title: The Level Design Book · Pacing
        url: https://book.leveldesignbook.com/process/preproduction/pacing
