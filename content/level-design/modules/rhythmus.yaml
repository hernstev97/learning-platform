id: rhythmus
title: Rhythmus aus Bewegung, Beobachtung, Entdeckung und Begegnung
level: 2
minutes: 90
summary: Wie ein Abschnitt zwischen Anspannung und Ruhe wechselt – Takte benennen und als Taktplan in Textform notieren, ihre Mindestdauer aus Weglänge und Tempo rechnen, Aussicht vor der Freifläche und Ruhe danach setzen und Monotonie erkennen, am AI Director von Left 4 Dead, an Portal und am Level Design Book.
place: unterwegs
goals:
  - Du zerlegst einen Abschnitt in Takte der Arten Bewegung, Beobachtung, Entdeckung, Begegnung und Ruhe und notierst sie als Taktplan in Textform.
  - Du rechnest die Mindestdauer eines Takts aus Weglänge in Tiles und Tempo und findest die längste Strecke ohne Ruhe.
  - Du nennst die vier Phasen des AI Director von Left 4 Dead und erklärst, was ein handgebauter Abschnitt davon übernehmen kann und was nicht.
  - Du setzt einen Aussichtspunkt vor eine Freifläche und begründest ihn mit Sichtlinie und Bildausschnitt, nicht mit einem angeborenen Sicherheitsgefühl.
  - Du erkennst Monotonie in einem Taktplan und benennst, wo ein Kontrast in Art oder Intensität fehlt, ohne den Inhalt vorzugeben.
