id: absicht-skizze
title: Absicht notieren, Layout skizzieren
level: 2
minutes: 90
summary: Bevor du baust – eine Absichtsnotiz mit beobachtbaren Zeichen, ein Raumdiagramm aus Blasen in Textform, eine Skizze auf Karopapier im Tile-Maßstab mit Bildschirmrahmen, erwartetem Weg und Hinweis-Symbolen, daraus abgeleitete Testfragen und ein Umfang, der klein genug bleibt, um ihn zu testen.
place: unterwegs
goals:
  - Du füllst eine Absichtsnotiz vollständig aus, mit einer Absicht in einem Satz, nummeriertem Weg, Hinweisen mit Ort, Art und Zweck und beobachtbaren Zeichen.
  - Du zeichnest ein Raumdiagramm aus Blasen und Verbindungen in Textform und liest daraus Knoten, Sackgassen und Sperren.
  - Du skizzierst einen Abschnitt auf Karopapier im Tile-Maßstab mit Bildschirmrahmen und rechnest aus, wie viele Bildschirme er umfasst und welche Hinweise von einem Wegpunkt aus im Bild sind.
  - Du leitest aus der Notiz Testfragen ab, die du beim Zusehen beantwortest, ohne den Tester zu fragen.
  - Du hältst den Umfang bei zwei bis vier Bildschirmen und streichst, was der Absicht nicht dient.
resources:
  - title: The Level Design Book · Layout
    url: https://book.leveldesignbook.com/process/layout
  - title: The Level Design Book · Critical path
    url: https://book.leveldesignbook.com/process/layout/criticalpath
  - title: The Level Design Book · Playtesting, „Prepare for playtest“
    url: https://book.leveldesignbook.com/process/blockout/playtesting#id-1.-prepare-for-playtest
  - title: Mike Ambinder, „Valve's Approach to Playtesting“ (GDC 2009, Folien)
    url: https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf
lesson: |
  Lehrbeispiel: Du hast eine Idee für einen Abschnitt. Der Spieler soll in einem Lagerhof zuerst das Tor sehen und erst über eine Seitenkammer dorthin kommen. Du öffnest Godot und setzt Tiles. Nach einer Stunde hast du sechs Bildschirme gebaut, und auf die Frage, woran du im Test erkennst, ob es klappt, fällt dir nur „wenn es Spaß macht“ ein. Zehn Minuten mit Stift und Karopapier hätten dir eine bessere Antwort gegeben, und zwar vor dem ersten Tile.

  Dieses Modul zeigt, wie du vor dem Bauen planst: eine vollständige Absichtsnotiz, ein Raumdiagramm aus Blasen, eine Skizze im Tile-Maßstab mit erwartetem Weg und Hinweisen, daraus Testfragen und ein Umfang, den du bauen und testen kannst. Alles geht unterwegs, mit Papier, Stift und Handy. Die Vorlage der Absichtsnotiz kennst du aus [Level lesen: Absicht, Hinweis, Verhalten](/level-design/raum-lesen). Hier füllst du sie vollständig aus. Das Level Design Book warnt vorab: „A layout drawing cannot tell you if your level works, only a blockout and playtest can begin answering that question.“ ([Layout](https://book.leveldesignbook.com/process/layout))

  > [!MERKE] Die Skizze ist ein Plan für den Test
  > Notiz und Skizze beweisen nichts. Sie legen fest, was du baust und woran du im Playtest erkennst, ob es wirkt.

  ## Die Absichtsnotiz Feld für Feld

  Die Felder bleiben in diesem Kurs immer dieselben:

  ```text
  Abschnitt:
  Absicht (ein Satz):
    Der Spieler soll …
  Erwarteter Weg:
  Hinweise (wo, was, wofür):
  Zeichen, dass es klappt:
  Zeichen, dass es scheitert:
  ```

  **Abschnitt.** Name und Größe in Bildschirmen, etwa „Lagerhof, 2 Bildschirme“. Die Größe zwingt dich, früh an den Umfang zu denken.

  **Absicht (ein Satz).** Sie beginnt mit „Der Spieler soll …“ und endet mit etwas, das man beobachten kann: bemerken, finden, wählen, zurückkehren, überblicken. Das Level Design Book nennt so ein Ziel experience goal und fragt: „What should the player learn, feel, or do, in this level?“ Dazu: „But more specific = easier to design.“ ([Pre-production plan](https://book.leveldesignbook.com/process/layout#id-1.-pre-production-plan)). Brauchst du ein „und“, sind es oft zwei Absichten. Teil sie auf zwei Abschnitte auf oder entscheide, welche zählt.

  **Erwarteter Weg.** Die Wegpunkte in der Reihenfolge, in der du sie erwartest, mit denselben Nummern wie in der Skizze. Das Buch nennt diesen Hauptweg critical path und rät, Start und Ausgang zu markieren und „Mark, label, and number any major beats“ ([Critical path](https://book.leveldesignbook.com/process/layout/criticalpath#how-to-plan-a-critical-path)).

  **Hinweise (wo, was, wofür).** Jeder Hinweis hat drei Angaben: den Ort als Wegpunkt oder Stelle in der Skizze, die Art (Licht, Öffnung, Landmarke, Kontrast, Spur) und den Teil der Absicht, dem er dient. Ein Hinweis ohne „wofür“ ist Dekoration oder steht für etwas, das du noch nicht entschieden hast. Wie stark ein Hinweis sein muss, behandelt [Umgebung als Information](/level-design/umgebung-informiert).

  **Zeichen, dass es klappt oder scheitert.** Beobachtbar und an einen Ort gebunden, etwa „hält an 3 oder schaut nach rechts“. Ein gutes Zeichen kannst du zählen: Bei wie vielen von vier Testern ist es eingetreten?

  Ein vollständiges Lehrbeispiel:

  ```text
  Abschnitt: Lagerhof, 2 Bildsch.
  Absicht (ein Satz):
    Der Spieler soll das Tor im
    Norden sehen, bevor er den
    Weg über die Kammer findet.
  Erwarteter Weg:
    S, 1 Hofmitte, 2 Tor (zu),
    3 Öffnung, 4 Hebel, A
  Hinweise (wo, was, wofür):
    2: Licht am Tor, Ziel zeigen
    3: Licht in der Kammer,
       Weg zur Kammer zeigen
    4: Hebel heller als Boden,
       benutzbar zeigen
  Zeichen, dass es klappt:
    geht zuerst zu 2, dann zu 3
  Zeichen, dass es scheitert:
    läuft an 3 vorbei, kehrt
    mehrmals zwischen 1 und 2 um
  ```

  ## Raumdiagramm: Blasen und Verbindungen als Text

  Bevor du Wände zeichnest, klärst du, welche Bereiche es gibt und wie sie zusammenhängen. Das Level Design Book nennt das bubble diagram, ein Blasendiagramm: „The goal of the bubble diagram is to establish proportions and relationships in your level. What needs to be big? What needs to connect to each other?“ ([Bubble diagrams](https://book.leveldesignbook.com/process/layout#id-3.-bubble-diagrams)). Am Handy zeichnest du es als Text. Für das Lehrbeispiel:

  ```text
          (A Ausgang)
               |
          [2 Tor, zu] <~ Hebel in 3
               |
  (S) -- (1 Hof, groß) -- (3 Kammer)
  ```

  Die Zeichen: `( )` ist ein Bereich mit Nummer, Name und Größe, `[ ]` eine Sperre, `--` und `|` sind Wege in beide Richtungen, `<~` ist eine Wirkung von anderswo, hier der Hebel, der das Tor öffnet.

  Was du daraus abliest:

  - **Knoten.** Der Hof hat drei Verbindungen. Dort entscheidet der Spieler, wohin er geht, und dort braucht er Orientierung.
  - **Sackgassen.** Die Kammer hat nur einen Zugang. Das ist in Ordnung, solange dort etwas liegt, das der Spieler braucht oder will.
  - **Sperren und Ursachen.** Das Tor ist zu, die Ursache liegt in einem anderen Bereich. Der Spieler muss das Tor gesehen haben, bevor der Hebel Sinn ergibt.
  - **Größen.** Ein großer Bereich zwischen kleinen fällt auf. Ob das zur Absicht passt, entscheidest du.

  Das Buch rät, mehrere Fassungen zu zeichnen: „Draw at least 3 bubble diagrams to imagine multiple arrangements and sizes.“ Und es tröstet: „A bad bubble diagram is good.“ Ein schlechtes Diagramm zeigt dir das Problem, bevor du es gebaut hast. Schreib in jede Blase, welche Art von Takt dort liegt, dann siehst du auch den Rhythmus ([Rhythmus](/level-design/rhythmus)).

  ## Karopapier im Tile-Maßstab

  Auf Karopapier steht **ein Kästchen für ein Tile**. Mit den Platzhaltern dieses Kurses, 16-Pixel-Tiles und 320 × 180 Pixeln Spielbild, ist ein Rahmen von **20 × 11 Kästchen ein Bildschirm**. Deine echten Werte legst du mit deiner Grafik fest ([Pixelraster](/godot/pixelraster)).

  Zeichne zuerst die Bildschirmrahmen, dann die großen Formen. Das Level Design Book gibt für Grundrisse knappe Regeln, darunter „START BIG“, „BE BOXY“ und „WE'RE NOT ARCHITECTS. Draw the minimum needed to imagine the player experience.“ ([Floor plan](https://book.leveldesignbook.com/process/layout#id-4.-floor-plan)). Fast alle Ecken sind rechtwinklig und liegen auf dem Raster. Dekoration lässt du weg.

  Für die Zeichen nimmst du die Legende des Kurses. Dann kannst du einen Ausschnitt jederzeit als Textblock abschreiben. Das Lehrbeispiel, ein Bildschirm Hof und links der Anfang des zweiten Bildschirms mit der Kammer:

  ```text
  #########A########################
  #.......!2!.......################
  #.................#.........######
  #..o..o.....o..o..#......!..######
  #.................#.........######
  #........1.......3+......4h.######
  #.................#.........######
  #..o..o.....o..o..#.........######
  #.................#.........######
  #........S........################
  ##################################
  ```

  Legende: `#` Wand · `.` Boden · `o` Kisten, niedrig, sperren den Weg, nicht die Sicht · `+` Durchgang · `S` Start · `A` Ausgang, hier das Tor · `!` beabsichtigter Hinweis · `1`–`4` Wegpunkte · `h` Hebel (eigenes Zeichen für dieses Beispiel)

  Die 21. Spalte von links ist die erste des zweiten Bildschirms. Der Abschnitt ist 34 Tiles breit und 11 hoch, also zwei Bildschirme quer. Am Handy passen 34 Zeichen in eine Zeile, also knapp zwei Bildschirme; auf Papier zeichnest du größer.

  > [!WARNING] Bildschirm ist ein Maß, keine Wand
  > Folgt die Kamera der Figur, schneidet sie keine festen Bildschirme aus. Der Rahmen zeigt dir, wie viel auf einmal zu sehen ist. Wechselt dein Spiel dagegen Bildschirm für Bildschirm, ist der Rahmen auch eine Grenze im Spiel.

  ## Erwarteter Weg und Hinweise einzeichnen

  Den erwarteten Weg trägst du als Ziffern ein, `1` bis `9`, in der Reihenfolge, die du erwartest. Diese Nummern sind deine Wegpunkte. Sie stehen gleich in der Skizze, in der Notiz und später im Protokoll des Playtests, deshalb heißen sie in diesem Kurs auch „WP 3“ und so weiter. Hinweise bekommen ein `!`. Zu jedem `!` steht in der Notiz, wofür es da ist.

  Dann prüfst du jeden Hinweis gegen den Bildschirm: Ist er von dem Wegpunkt aus im Bild, an dem er wirken soll? Hält die Kamera die Figur in der Mitte, reicht der Blick rund 10 Tiles zur Seite und gut 5 nach oben und unten. Im Lehrbeispiel liegt das Licht in der Kammer 16 Spalten rechts von Wegpunkt 1. Von der Hofmitte aus ist es nicht zu sehen, an Wegpunkt 3 ist es nur noch 8 Spalten entfernt. Das passt zur Absicht: Erst zieht das Tor, dann die Kammer. Wie Kameragrenzen und Bildausschnitt genauer zusammenspielen, zeigt [Wege, Landmarken und Sichtlinien](/level-design/orientierung).

  Miss auch den Weg. Mit dem Tempo der Testszene (90 Pixel pro Sekunde, Platzhalter) dauert ein Tile 0,18 Sekunden. Der Weg von `S` über `1` zu `2` ist 8 Tiles lang, also knapp anderthalb Sekunden. So erfährst du schon auf Papier, ob der Abschnitt so lang ist, wie er sich anfühlt.

  ## Von der Notiz zu Testfragen

  Vor einem Playtest fragt das Level Design Book unter anderem: „Focus: Which parts are most important to test? What are your biggest questions?“ und „Data: What data are you collecting? How will you collect it?“ ([Prepare for playtest](https://book.leveldesignbook.com/process/blockout/playtesting#id-1.-prepare-for-playtest)). Valve listet unter direkter Beobachtung auch: „Have a design goal“ ([Ambinder, GDC 2009](https://cdn.akamai.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf)). Deine Absichtsnotiz ist dieses Ziel. Die Testfragen leitest du daraus ab:

  - Aus jedem **Zeichen** wird eine Frage, die du durch Zusehen beantwortest, mit Ort und Zählung.
  - Aus jedem **Hinweis** wird eine Frage, ob sich das Verhalten nach dem Hinweis ändert, sobald er im Bild ist.
  - Aus dem **erwarteten Weg** wird eine Frage nach der Reihenfolge der Wegpunkte.

  Für das Lehrbeispiel:

  ```text
  F1 Wie viele gehen zuerst zu 2?
     (zählen: x von 4)
  F2 Hält der Tester an 3 oder
     dreht er nach rechts?
  F3 Wie oft kehrt er zwischen
     1 und 2 um?
  ```

  Andrew Yoder, dessen Skizzen das Buch zeigt, prüft seine Entwürfe mit ähnlichen Fragen: „Does the player know the goal? Can they anticipate a solution and plan for it?“ ([Layout, Andrew Yoder](https://book.leveldesignbook.com/process/layout#untitled-for-quake-1-by-andrew-yoder)). Bleib bei drei bis fünf Fragen pro Runde. Eine Frage, die du dem Tester stellen müsstest, etwa „Hast du das Licht gesehen?“, ist keine Testfrage zum Zusehen. Sie verrät den Hinweis. Offene Fragen nach dem Spiel behandelt [Testlesen und Playtest](/narrative/testlesen-playtest), das Zusehen selbst [Playtests beobachten](/level-design/playtest-methode).

  > [!PRAXIS] Pläne, die sich im Test ändern
  > Das Level Design Book zeigt ein Whiteboard von Valve für Half-Life 2: Episode Two, mit einer Skizze des Layouts und daneben dem Ablauf, und merkt an: „note that this drawing differs a bit from the final game“. Für die Karte Warpath aus Team Fortress Classic beschreibt Robin Walker, wie die Designgruppe Karten skizzierte, die Level-Designer sie bauten und die Playtests begannen, „often resulting in drastic changes to original plans for the map“. Das Team von Super Mario 64 hat laut Shigeru Miyamoto keine Pläne vorab gezeichnet, es gab nur Konzeptskizzen und kurze Notizen ([Layout](https://book.leveldesignbook.com/process/layout#against-layouts)). Eine Skizze ist ein Werkzeug zum Denken und Testen. Wie viel du zeichnest, hängt davon ab, was du vor dem Bauen klären musst.

  ## Klein anfangen, unterwegs arbeiten

  Halte einen Abschnitt bei zwei bis vier Bildschirmen. Vier Bildschirme quer sind mit den Platzhaltern gut 14 Sekunden Weg (4 × 320 / 90 = 14,2), genug für vier bis acht Takte. Jeder weitere Bildschirm bringt Hinweise, die du im Test beobachten musst, und Tiles, die du bauen und bei jeder Änderung anfassen musst. Das Level Design Book nutzt den critical path ausdrücklich zum Kürzen: „If something isn't on the critical path, then only some players will see it. Is it worth making?“ ([Critical path as scoping tool](https://book.leveldesignbook.com/process/layout/criticalpath#critical-path-as-scoping-tool)).

  Streich, bevor du baust:

  - Bereiche, die keine Rolle in der Absicht haben.
  - Hinweise ohne „wofür“.
  - Eine zweite Absicht. Sie wird ein eigener Abschnitt.

  Unterwegs reichen Karopapier, Bleistift und Handy. Bei 5-Millimeter-Karo ist ein Bildschirm 10 × 5,5 Zentimeter groß, zwei passen nebeneinander auf eine A4-Seite. Fotografier die Skizze und gib dem Foto einen Namen mit Abschnitt, Version und Datum, etwa `lagerhof-v2-2026-10-22`. Die Notiz schreibst du mit der Vorlage in eine Notiz-App. So liegen Fassungen nebeneinander, und du siehst später, was sich nach welchem Test geändert hat.

  > [!NOTE] Deine Skizze
  > Absicht, Bereiche und Grundriss entscheidest du. Lass dir keine Layouts oder Varianten erzeugen, auch nicht aus dem Foto deiner Skizze. Technische Hilfe ist in Ordnung, etwa ein kleines Skript, das aus deinen Wegpunkten Längen und Sekunden rechnet.

  > [!INTERVIEW] „Wie bereitest du einen Abschnitt vor, bevor du ihn baust?“
  > Ich schreibe die Absicht in einem Satz, mit einem Verhalten, das ich beobachten kann. Dann zeichne ich mindestens drei Blasendiagramme und wähle eins. Auf Karopapier lege ich die Bildschirmrahmen an, zeichne große, eckige Formen, nummeriere den erwarteten Weg und setze die Hinweise. Für jeden Hinweis prüfe ich, ob er von dem Wegpunkt aus im Bild ist, an dem er wirken soll. Zum Schluss leite ich drei bis fünf Testfragen ab und streiche alles, was der Absicht nicht dient.

  ## Häufige Fehler

  - **Zwei Absichten in einem Satz.** „Der Spieler soll die Kammer finden und den Hof erkunden.“ Du weißt im Test nicht, welche du prüfst. Entscheide dich oder teil den Abschnitt.
  - **Hinweise ohne Zweck.** In der Skizze stehen fünf `!`, in der Notiz drei mit „wofür“. Die anderen zwei sind Dekoration oder eine Absicht, die du noch nicht aufgeschrieben hast.
  - **Kein Bildschirmrahmen.** Ein Hinweis und das, worauf er zeigt, liegen weiter auseinander, als ein Bildschirm zeigt. Ohne Rahmen fällt das erst im Blockout auf.
  - **Zu viel Detail.** Kisten, Fässer und Pflanzen ohne Funktion machen die Skizze unlesbar. Das Buch rät: „don't clutter your layout drawing with unnecessary design features.“
  - **Der Weg steht nur im Kopf.** Ohne nummerierte Wegpunkte kannst du im Playtest nicht notieren, wo etwas passiert.
  - **Zu großer Umfang.** Acht Bildschirme für den ersten Test. Fang mit zwei an.
  - **Die Skizze für das Ergebnis halten.** Eine stimmige Skizze heißt nur, dass du einen Plan hast. Ob er trägt, zeigt der Playtest.

  ## Zusammenfassung

  - Die Absichtsnotiz hat feste Felder. Die Absicht ist ein Satz mit einem beobachtbaren Verhalten, jeder Hinweis hat Ort, Art und Zweck.
  - Ein Blasendiagramm in Textform zeigt Bereiche, Größen, Verbindungen, Knoten, Sackgassen und Sperren, bevor eine Wand steht.
  - Auf Karopapier ist ein Kästchen ein Tile und ein Rahmen von 20 × 11 Kästchen ein Bildschirm (Platzhalter).
  - Wegpunkte sind nummeriert und heißen in Skizze, Notiz und Protokoll gleich. Hinweise bekommen ein `!`.
  - Jeder Hinweis muss von dem Wegpunkt aus im Bild sein, an dem er wirken soll.
  - Testfragen kommen aus den Zeichen, den Hinweisen und dem erwarteten Weg. Du beantwortest sie durch Zusehen, nicht durch Fragen.
  - Zwei bis vier Bildschirme reichen. Was der Absicht nicht dient, streichst du vor dem Bauen.
exercises:
  - id: absicht-ein-satz
    type: choice
    title: Welche Absicht kannst du prüfen?
    prompt: |
      Lehrbeispiel: vier Fassungen der Absicht für einen Lagerhof. Welche taugt für eine Absichtsnotiz?
    options:
      - text: Der Spieler soll die Kammer finden, bevor er zum Tor zurückgeht.
        correct: true
        why: Ein Satz, eine Absicht, und die Reihenfolge der Orte kannst du im Test beobachten.
      - text: Der Hof soll groß und verlassen wirken.
        correct: false
        why: Hier fehlt der Spieler, und „wirken“ ist ein Gefühl. Woran du es beim Zusehen erkennst, steht nicht da.
      - text: Der Spieler soll die Kammer finden und den Hof erkunden und den Brunnen bemerken.
        correct: false
        why: Drei Absichten in einem Satz. Im Test weißt du nicht, welche du prüfst, und Hinweise für die eine stören die andere.
      - text: Der Spieler soll Spaß haben.
        correct: false
        why: Ein Ziel für das ganze Spiel, nicht für diesen Abschnitt. Es sagt nichts darüber, was der Spieler hier tut.
    explanation: |
      Eine brauchbare Absicht beginnt mit „Der Spieler soll …“, enthält ein Verhalten, das man sehen kann, und hat genau einen Kern. Das Level Design Book sagt dazu „more specific = easier to design“. Aus der richtigen Fassung folgt sofort ein Zeichen für Erfolg: Der Tester betritt die Kammer, bevor er zum Tor zurückkehrt.
    hints:
      - Streich zuerst alle Sätze ohne Spieler.
    resources:
      - title: The Level Design Book · Layout, „Pre-production plan“
        url: https://book.leveldesignbook.com/process/layout#id-1.-pre-production-plan

  - id: blasen-lesen
    type: choice
    title: Was das Diagramm zeigt
    prompt: |
      Lehrbeispiel: ein Blasendiagramm. `( )` ist ein Bereich, `[ ]` eine Sperre, `--` und `|` sind Wege in beide Richtungen, `*` ein Fundstück. Welche Aussagen stimmen?
    lang: text
    code: |
      (S) -- (1 Halle, groß) -- (2 Gang)
                   |               |
             (3 Nische, *)      [4 Tor]
                                   |
                                  (A)
    options:
      - text: Die Halle ist ein Knoten, an dem sich drei Wege treffen.
        correct: true
        why: Sie verbindet Start, Nische und Gang. Dort entscheidet der Spieler, wohin er geht.
      - text: Die Nische ist eine Sackgasse mit einem Fundstück.
        correct: true
        why: Sie hat nur eine Verbindung, zur Halle, und das Fundstück gibt ihr einen Zweck.
      - text: Vom Gang führt ein zweiter Weg zurück zur Halle, eine Schleife.
        correct: false
        why: Gang und Halle sind nur einmal verbunden. Eine Schleife bräuchte eine zweite Verbindung.
      - text: Das Diagramm zeigt, dass der Gang 12 Tiles lang ist.
        correct: false
        why: Blasendiagramme zeigen Beziehungen und grobe Größen, keine Maße. Die stehen erst in der Skizze auf Karopapier.
    explanation: |
      Ein Blasendiagramm beantwortet die Fragen „What needs to be big? What needs to connect to each other?“, wie das Level Design Book schreibt. Knoten, Sackgassen und Sperren siehst du darin sofort. Maße und Sichtlinien kommen erst mit dem Raster dazu.
    hints:
      - Zähl die Verbindungen jeder Blase.
    resources:
      - title: The Level Design Book · Layout, „Bubble diagrams“
        url: https://book.leveldesignbook.com/process/layout#id-3.-bubble-diagrams

  - id: vom-satz-zur-skizze
    type: order
    title: Vom Satz zur Skizze
    prompt: |
      Bring die Arbeitsschritte vor dem Bauen in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Schreib die Absicht als einen Satz, der mit „Der Spieler soll“ beginnt.
      Zeichne drei Blasendiagramme und wähle eines davon aus.
      Zeichne auf Karopapier die Bildschirmrahmen mit je 20 × 11 Kästchen.
      Trag Wände, Böden und Durchgänge als große, eckige Formen ein.
      Nummeriere den erwarteten Weg mit Wegpunkten vom Start bis zum Ausgang.
      Setz die Hinweise als Ausrufezeichen und notier zu jedem, wofür er da ist.
      Leite aus den Zeichen für Erfolg und Scheitern die Testfragen ab.
    explanation: |
      Die Absicht steht am Anfang, weil sie entscheidet, welche Bereiche es braucht. Die Blasen klären Beziehungen, bevor Maße dazukommen; so ordnet auch das Level Design Book seine Schritte. Die Rahmen kommen vor den Wänden, damit du in Bildschirmen denkst. Weg und Hinweise brauchen die Wände, und die Testfragen brauchen alles davor.
    hints:
      - Erst Beziehungen, dann Maße, dann Weg.
    resources:
      - title: The Level Design Book · Layout, „How to design a layout“
        url: https://book.leveldesignbook.com/process/layout#how-to-design-a-layout

  - id: bildschirme-zaehlen
    type: output
    title: Wie viele Bildschirme?
    prompt: |
      Drei Skizzen mit Breite und Höhe in Tiles. Ein Bildschirm ist 20 × 11 Tiles (Platzhalter). Was gibt das Modell aus?
    lang: python
    code: |
      import math

      # Tiles je Bildschirm, Platzhalter
      BILD_B = 20
      BILD_H = 11

      def bildschirme(b, h):
          quer = math.ceil(b / BILD_B)
          hoch = math.ceil(h / BILD_H)
          return quer * hoch

      print(bildschirme(34, 11))
      print(bildschirme(40, 12))
      print(bildschirme(18, 30))
    expected: |
      2
      4
      3
    hints:
      - "`math.ceil` rundet auf: 34 / 20 = 1,7 wird 2."
      - 12 Reihen passen nicht in 11.
    explanation: |
      34 × 11 sind zwei Bildschirme quer. 40 × 12 klingt nach zwei, sind aber vier, weil die zwölfte Reihe eine zweite Reihe Bildschirme anfängt. Der Spieler sieht dann nie die ganze Höhe auf einmal. 18 × 30 sind drei Bildschirme übereinander. Eine Reihe zu viel kann also einen Abschnitt verdoppeln. Folgt die Kamera der Figur, ist das Ergebnis ein Maß für die Größe, keine Zahl fester Bildschirme.
    resources:
      - title: Python · math.ceil
        url: https://docs.python.org/3/library/math.html#math.ceil

  - id: hinweis-im-bild
    type: output
    title: Von wo ist das Licht zu sehen?
    prompt: |
      Lehrbeispiel aus der Lektion: Das Licht in der Kammer liegt bei Spalte 25, Reihe 3, gezählt ab 0 von links oben. Die Kamera hält die Figur in der Mitte und hat keine Grenzen. Vereinfacht reicht der Blick 10 Tiles zur Seite und 5 nach oben und unten. Was gibt das Modell aus?
    lang: python
    code: |
      # halbe Bildbreite und -höhe
      # in Tiles, vereinfacht
      HALB_B, HALB_H = 10, 5
      wp_orte = {"1": (9, 5),
                 "3": (17, 5)}
      lx, ly = 25, 3  # Licht, Kammer
      for wp, (x, y) in wp_orte.items():
          dx = abs(lx - x)
          dy = abs(ly - y)
          im_bild = (dx <= HALB_B
                     and dy <= HALB_H)
          print(wp, im_bild)
    expected: |
      1 False
      3 True
    hints:
      - Von Wegpunkt 1 sind es 16 Spalten, von Wegpunkt 3 nur 8.
    explanation: |
      Von der Hofmitte ist das Licht 16 Spalten entfernt und nicht im Bild. An Wegpunkt 3, direkt vor der Öffnung, sind es 8 Spalten und 2 Reihen, das Licht ist zu sehen. Das passt zur Absicht, denn das Tor soll zuerst ziehen und die Kammer erst danach. Läge das Licht bei Spalte 19, direkt hinter der Wand, wäre es schon von der Hofmitte aus im Bild und würde mit dem Tor konkurrieren. Kameragrenzen verschieben den Ausschnitt am Rand des Abschnitts ([Orientierung](/level-design/orientierung)); die Grundprüfung bleibt dieselbe.
    resources:
      - title: Godot Docs · Camera2D
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html

  - id: begriffe-skizze
    type: gap
    title: Fünf Begriffe für die Skizze
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Auf dem Karopapier steht ein Kästchen für ein ⟦Tile⟧. Ein Rahmen von ⟦20⟧ × 11 Kästchen zeigt einen Bildschirm. Eine Zeichnung aus Bereichen als Blasen mit Verbindungen heißt ⟦Blasendiagramm⟧. Den beabsichtigten Hauptweg nennt das Level Design Book ⟦critical path⟧, und seine Stationen nummerierst du als ⟦Wegpunkte⟧.
    gaps:
      - label: ein Kästchen
        hint: Die Kachel der Tilemap, englisch.
        accept: ["Tiles", "Kachel", "Feld"]
      - label: Breite
        hint: 320 Pixel durch 16.
        accept: ["zwanzig"]
      - label: Diagramm
        hint: Englisch bubble diagram.
        accept: ["Raumdiagramm", "bubble diagram", "Blasendiagramme", "Bubble-Diagramm"]
      - label: Hauptweg
        hint: Zwei englische Wörter, auch golden path genannt.
        accept: ["golden path", "kritischer Pfad", "kritischen Pfad"]
      - label: Stationen
        hint: In Skizze, Notiz und Protokoll als WP abgekürzt.
        accept: ["Wegpunkt", "WP"]
    explanation: |
      Mit Tile, Bildschirmrahmen und Wegpunkten sprechen Skizze, Notiz und Protokoll dieselbe Sprache. Das Blasendiagramm klärt vorher, welche Bereiche es gibt, der critical path, welcher Weg zählt. Alles, was nicht auf ihm liegt, sehen nur manche Spieler.
    resources:
      - title: The Level Design Book · Critical path
        url: https://book.leveldesignbook.com/process/layout/criticalpath

  - id: dritter-ausgang
    type: bug
    title: Ein Ausgang zu viel
    prompt: |
      Lehrbeispiel: Ein Hof, ein Bildschirm groß. Er soll drei Durchgänge haben, `S` unten, `A` oben und `+` rechts. Eine Zeile der Skizze öffnet ungewollt einen vierten. Finde sie.

      Legende: `#` Wand · `.` Boden · `o` niedriges Hindernis · `+` Durchgang · `S` Start · `A` Ausgang · `L` Landmarke
    lang: text
    code: |
      #########A##########
      #..................#
      #..o...........o...#
      #..................#
      #..................+
      #........L.........#
      #..................#
      ...................#
      #..o...........o...#
      #..................#
      #########S##########
    lines: [8]
    explanation: |
      In Zeile 8 fehlt die linke Wand. Auf dem Papier ist das ein Strich, im Blockout ein Loch im Rand, durch das der Spieler den Hof verlässt. Prüf an jeder Skizze die Ränder Zeile für Zeile: Jede Öffnung am Rand ist ein Durchgang, und jeder Durchgang muss in der Notiz stehen. Wenn du die Skizze als Text abschreibst, fallen solche Lücken leichter auf als auf Papier.
    hints:
      - Lies nur das erste und das letzte Zeichen jeder Zeile.

  - id: hinweis-gegen-absicht
    type: bug
    title: Ein Hinweis zieht in die falsche Richtung
    prompt: |
      Lehrbeispiel: Absicht „Der Spieler soll die Kammer erst finden, nachdem er am Tor war.“ Eine Zeile unter „Hinweise“ arbeitet gegen diese Absicht. Finde sie.
    lang: prose
    code: |
      WP 2, Licht am Tor: zeigt das Ziel.
      WP 1, Brunnen in der Hofmitte: Landmarke für den Rückweg.
      WP 3, Fundstück hell beleuchtet in der Kammer, schon vom Start S aus im Bild: zieht in die Kammer.
      WP 4, Hebel heller als der Boden: zeigt, dass er benutzbar ist.
    lines: [3]
    explanation: |
      Ein hell beleuchtetes Fundstück, das schon vom Start aus zu sehen ist, konkurriert mit dem Licht am Tor und zieht den Spieler zuerst in die Kammer. Das widerspricht der Reihenfolge der Absicht. Entweder kommt das Fundstück erst ins Bild, wenn der Spieler an Wegpunkt 3 steht, oder es wird leiser. Ändert sich deine Meinung über die Reihenfolge, änderst du bewusst die Absicht.
    hints:
      - Welcher Hinweis wirkt schon am Start?
    resources:
      - title: The Level Design Book · Wayfinding aids
        url: https://book.leveldesignbook.com/process/blockout/wayfinding#wayfinding-aids

  - id: testfrage-verraet
    type: bug
    title: Eine Frage, die den Hinweis verrät
    prompt: |
      Testfragen zum Lehrbeispiel, die du während des Spiels durch Zusehen beantworten willst. Eine passt nicht dazu. Finde sie.
    lang: prose
    code: |
      Wie viele Tester gehen zuerst zu WP 2?
      Wie lange steht jeder Tester an WP 3?
      Hast du das Licht in der Kammer gesehen?
      Wie oft kehrt ein Tester zwischen WP 1 und WP 2 um?
      Nach wie vielen Sekunden erreicht ein Tester den Hebel?
    lines: [3]
    explanation: |
      Frage 3 kannst du nicht durch Zusehen beantworten, du müsstest sie dem Tester stellen. Damit zeigst du ihm den Hinweis, und alles, was er danach tut, sagt nichts mehr darüber, ob der Hinweis allein wirkt. Außerdem lässt sie nur Ja oder Nein zu. Beobachtbar wäre etwa, ob der Tester die Figur zur Kammer dreht, sobald das Licht im Bild ist. Offene Fragen nach dem Spiel behandelt [Testlesen und Playtest](/narrative/testlesen-playtest).
    hints:
      - Welche Frage richtet sich an den Tester statt an dich?
    resources:
      - title: NN/g · Avoid Leading Questions
        url: https://www.nngroup.com/articles/leading-questions/

  - id: skizze-kein-level
    type: explain
    title: Warum zeichnen, wenn es nichts beweist?
    prompt: |
      Das Level Design Book über Layout-Zeichnungen. Erkläre in drei bis fünf Sätzen, was eine Skizze nicht leisten kann und wofür du sie trotzdem zeichnest.
    lang: prose
    code: |
      But remember: plans aren't magic. A layout drawing cannot tell you if your level works, only a blockout and playtest can begin answering that question. A layout is NOT a level, the player never plays your drawing.
    points:
      - Eine Skizze kann nicht zeigen, wie Spieler sich verhalten. Das zeigt erst ein Playtest am Blockout.
      - Sie macht Absicht, Bereiche, Weg und Hinweise sichtbar, bevor du baust, und Fehler werden billig.
      - Mit Bildschirmrahmen und Tile-Maßstab prüfst du Größe, Weglängen und ob Hinweise im Bild sind.
      - Aus ihr leitest du die Testfragen ab, mit denen du den Blockout prüfst.
    explanation: |
      Eine Zeichnung wird nicht gespielt, also verrät sie nicht, ob Spieler die Kammer finden. Das kann nur ein Test am Blockout. Trotzdem ist die Skizze der billigste Ort für Fehler: Ein zu großer Abschnitt, ein Hinweis außerhalb des Bildes oder ein vergessener Rand fallen auf, bevor ein Tile gesetzt ist. Vor allem aber legt die Skizze fest, was du im Test beobachtest, denn Wegpunkte und Hinweise stehen dort mit Nummern. Wer ohne Skizze baut, entscheidet das oft erst nach dem Test, und dann passt die Absicht sich still an das an, was passiert ist.
    hints:
      - Trenne, was die Skizze prüfen kann, von dem, was nur Spieler zeigen.
    resources:
      - title: The Level Design Book · Layout
        url: https://book.leveldesignbook.com/process/layout

  - id: notiz-zu-fragen
    type: explain
    title: Was du beim Zusehen prüfst
    prompt: |
      Lehrbeispiel: eine Absichtsnotiz für einen Gang mit Seitengang. Erkläre in drei bis fünf Sätzen, welche Testfragen daraus folgen und welche Beobachtung die Absicht widerlegen würde.
    lang: prose
    code: |
      Abschnitt: Gang mit Seitengang, 2 Bildschirme.
      Absicht: Der Spieler soll den Seitengang bemerken, aber zuerst geradeaus bis zur Tür gehen.
      Erwarteter Weg: S, 1 Abzweigung, 2 Tür, zurück zu 1, 3 Seitengang.
      Hinweise: 1 Fundstück halb sichtbar im Seitengang (bemerken lassen); 2 Licht an der Tür (Ziel zeigen).
      Zeichen, dass es klappt: wird an 1 langsamer oder dreht kurz zum Seitengang, geht zur Tür, kommt danach zurück.
      Zeichen, dass es scheitert: geht an 1 sofort in den Seitengang, oder kommt von 2 nicht zurück.
    points:
      - Eine Frage zur Reihenfolge, etwa wie viele Tester zuerst zur Tür gehen.
      - Eine Frage zum Bemerken an Wegpunkt 1, etwa ob die Figur langsamer wird oder sich zum Seitengang dreht.
      - Eine Frage zur Rückkehr, etwa wie viele nach der Tür in den Seitengang gehen.
      - Widerlegt wäre die Absicht, wenn Tester an 1 ohne Halt vorbeigehen und nicht zurückkommen oder sofort abbiegen.
    explanation: |
      Die Notiz enthält schon fast alle Fragen. Aus dem Weg folgt die Frage nach der Reihenfolge: Wie viele von vier Testern gehen zuerst zur Tür? Aus dem Hinweis an Wegpunkt 1 folgt die Frage nach dem Bemerken: Wird die Figur dort langsamer oder dreht sie zum Seitengang? Aus der Rückkehr folgt die dritte: Wer kommt nach der Tür zurück und biegt ab? Widerlegt ist die Absicht in zwei Richtungen. Gehen Tester sofort in den Seitengang, zieht das Fundstück zu stark. Gehen sie ohne Halt vorbei und kommen nicht zurück, war es zu schwach oder nicht im Bild.
    hints:
      - Geh die Felder „Erwarteter Weg“, „Hinweise“ und „Zeichen“ nacheinander durch.
    resources:
      - title: The Level Design Book · Playtesting, „Prepare for playtest“
        url: https://book.leveldesignbook.com/process/blockout/playtesting#id-1.-prepare-for-playtest

  - id: drei-blasendiagramme
    type: practice
    title: Drei Anordnungen
    prompt: |
      Für einen Abschnitt, den du selbst wählst: Zeichne auf Papier drei verschiedene Blasendiagramme. Notiere hier je Diagramm in einer Zeile die Bereiche mit Größe und ihre Verbindungen, etwa „S – Hof (groß) – Kammer (klein); Hof – Tor; Hebel in Kammer öffnet Tor“. Schreib zum Schluss, welches du nimmst und warum.
    lang: prose
    starter: |
      Absicht (ein Satz):
      Diagramm 1:
      Diagramm 2:
      Diagramm 3:
      Gewählt, weil:
    checklist:
      - Über den Diagrammen steht eine Absicht in einem Satz, mit einem beobachtbaren Verhalten.
      - Jedes Diagramm hat einen Start und einen Ausgang.
      - Jeder Bereich hat einen Namen und eine grobe Größe.
      - Mindestens zwei Diagramme unterscheiden sich in Reihenfolge oder Verbindungen, nicht nur in Namen oder Größen.
      - Die Begründung bezieht sich auf die Absicht, etwa auf Reihenfolge, Knoten oder Sackgassen.
    explanation: |
      Drei Fassungen zwingen dich, Alternativen zu sehen, bevor du dich festlegst. Das Level Design Book rät genau dazu, und ein schlechtes Diagramm ist dort ausdrücklich gut, weil es ein Problem früh zeigt. Die Begründung am Ende ist der wichtigste Teil: Sie verbindet die Form mit der Absicht.
    hints:
      - Verschieb in der zweiten Fassung den Knoten, in der dritten die Sperre.
    resources:
      - title: The Level Design Book · Layout, „Advice for bubble diagrams“
        url: https://book.leveldesignbook.com/process/layout#advice-for-bubble-diagrams

  - id: notiz-und-skizze
    type: practice
    title: Notiz, Skizze, Testfragen
    prompt: |
      Wähle einen eigenen Abschnitt von zwei bis vier Bildschirmen; was dort passiert, entscheidest du. Zeichne ihn auf Karopapier mit Bildschirmrahmen, Wegpunkten und Hinweisen, schreib die vollständige Absichtsnotiz daneben oder in deine Notiz-App und fotografier beides. Hier trägst du nur Absicht und drei Testfragen ein und hakst den Rest ab.
    lang: prose
    starter: |
      Absicht (ein Satz):
      Testfrage 1:
      Testfrage 2:
      Testfrage 3:
    checklist:
      - Die Skizze hat Bildschirmrahmen von 20 × 11 Kästchen oder deinem eigenen Maß, und du hast notiert, welches.
      - Die Absicht ist ein Satz mit einem beobachtbaren Verhalten. Steht ein „und“ darin, hast du geprüft, ob es zwei Absichten sind.
      - Der erwartete Weg nennt die Wegpunkte mit denselben Nummern wie die Skizze.
      - Jeder Hinweis hat Ort, Art und Zweck.
      - Du hast für jeden Hinweis geprüft, ob er von seinem Wegpunkt aus im Bild ist.
      - Die drei Testfragen lassen sich durch Zusehen beantworten und nennen einen Ort.
    explanation: |
      Diese Notiz ist die Grundlage für alles Weitere: Nach ihr baust du den Blockout ([Blockout in Godot](/level-design/blockout)), nach ihren Testfragen beobachtest du ([Playtests beobachten](/level-design/playtest-methode)), und gegen sie vergleichst du später das Verhalten der Tester. Heb das Foto der Skizze mit Version und Datum auf.
    hints:
      - Fang mit zwei Bildschirmen an. Erweitern kannst du nach dem ersten Test.
    resources:
      - title: The Level Design Book · Layout, „Gameplay markup“
        url: https://book.leveldesignbook.com/process/layout#id-5.-gameplay-markup
