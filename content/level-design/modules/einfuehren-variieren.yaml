id: einfuehren-variieren
title: Möglichkeiten einführen, sicher erproben, variieren
level: 2
minutes: 100
summary: Wie ein Level eine neue Möglichkeit lehrt, ohne sie zu erklären – einführen, sicher erproben lassen, prüfen, wenden und abschließen nach Koichi Hayashidas Kishōtenketsu und „Teach, test, twist“ –, und woran du erkennst, dass eine Abfolge zu viel auf einmal will oder eine Regel heimlich ändert.
place: unterwegs
goals:
  - Du beschreibst die vier Schritte von Kishōtenketsu nach Koichi Hayashida und vergleichst sie mit „Teach, test, twist“.
  - Du gestaltest eine sichere Erprobung mit niedrigem Preis für Fehler, ohne Zeitdruck und mit kurzem Rückweg.
  - Du zählst in einer Abfolge von Räumen die Neuheiten pro Raum und den Abstand zwischen Einführung und Wendung.
  - Du unterscheidest eine Wendung, die die Lage ändert, von einer Variation, die eine Regel stillschweigend bricht.
  - Du planst für eine selbst gewählte Möglichkeit eine Abfolge, die ohne Text auskommt.
resources:
  - title: Christian Nutt, „The Structure of Fun“, Interview mit Koichi Hayashida (Game Developer, 2012)
    url: https://www.gamedeveloper.com/design/the-structure-of-fun-learning-from-i-super-mario-3d-land-i-s-director
  - title: The Level Design Book · Pacing, Teach, test, twist
    url: https://book.leveldesignbook.com/process/preproduction/pacing#teach-test-twist
  - title: Kim Swift, Erik Wolpaw, „Integrating Narrative and Design – A Portal Post-Mortem“ (GDC 2008, Folien)
    url: https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf
  - title: Dan Taylor, „Ten Principles of Good Level Design“, Teil 1 (Game Developer, 2013)
    url: https://www.gamedeveloper.com/design/ten-principles-of-good-level-design-part-1-
lesson: |
  Koichi Hayashida, Director von Super Mario 3D Land, beschreibt, wie ein Level eine einzelne Spielmechanik lehrt: „First, you have to learn how to use that gameplay mechanic, and then the stage will offer you a slightly more complicated scenario in which you have to use it. And then the next step is something crazy happens that makes you think about it in a way you weren't expecting. And then you get to demonstrate, finally, what sort of mastery you've gained over it.“ ([Game Developer, 2012](https://www.gamedeveloper.com/design/the-structure-of-fun-learning-from-i-super-mario-3d-land-i-s-director)) Kein Satz davon spricht von Text. Das Level selbst ist der Unterricht.

  Dieses Modul nennt alles, was ein Spieler tun kann oder womit er umgehen muss, eine **Möglichkeit**: eine Fähigkeit der Figur, ein Objekt wie eine Druckplatte, ein Hindernis wie brüchiger Boden, das Verhalten eines Gegners. Es zeigt, wie ein Level eine Möglichkeit einführt, sicher erproben lässt, prüft, wendet und abschließt, und woran du erkennst, dass eine Abfolge zu viel auf einmal will. Die Beispiele sind veröffentlichte Spiele oder neutrale Lehrbeispiele. Welche Möglichkeiten dein Spiel hat, entscheidest du.

  ## Kishōtenketsu: vier Schritte für eine Möglichkeit

  Hayashida vergleicht den Ablauf mit Vier-Bild-Comics. Im Manga spreche man von „kishoutenketsu, where you introduce a concept, and then in the next panel you develop the idea a little bit more; in the third panel there's something of a change-up, and then in the fourth panel you have your conclusion.“ Übertragen auf ein Level:

  | Schritt | bei Hayashida | im Level |
  | --- | --- | --- |
  | einführen | „introduce a concept“ | Die Möglichkeit erscheint und lässt sich ohne Risiko benutzen. |
  | entwickeln | „develop the idea a little bit more“ | Eine etwas schwierigere Lage mit derselben Möglichkeit. |
  | wenden | „something of a change-up“ | Dieselbe Möglichkeit, aber in einer Lage, die anders darüber denken lässt. |
  | abschließen | „conclusion“ | Der Spieler zeigt, was er kann. |

  Den dritten Schritt nennt Hayashida „something of a doozy that throws them for a loop“. Er führt ihn auf Shigeru Miyamoto zurück, der als Kind Comics zeichnete: „That ten [twist] that really surprises people.“

  Dazu gehört ein zweiter Gedanke aus demselben Interview, ein Kernkonzept pro Level: „I do think it's really important to decide on a core concept in level design.“ In Super Mario Galaxy hatte noch jeder Planet etwas Neues, „So you would end up with lots of different gameplay concepts in a single stage.“ Bei Super Mario 3D Land dagegen „you have a clear concept in the beginning, and that's carried through absolutely all the way.“ Vier Schritte brauchen Platz. Wer in einem Abschnitt fünf Möglichkeiten einführt, hat für keine davon eine Wendung übrig.

  ## Teach, test, twist

  Das Level Design Book beschreibt ein verwandtes Muster: „Teach, test, twist is a common 3-beat pattern in level design“ ([Pacing](https://book.leveldesignbook.com/process/preproduction/pacing#teach-test-twist)). Die drei Takte sind dort genau definiert:

  - **Teach**: „teach the player about a game activity“.
  - **Test**: „test whether the player can repeat and recognize the activity, with prompting“.
  - **Twist**: „twist the frame of the activity; with less prompting, can the player recall it?“

  Der Unterschied zwischen Test und Twist liegt im Hinweis. Beim Test hilft der Raum noch beim Erkennen, bei der Wendung muss der Spieler sich selbst erinnern. Das Buch belegt das an Portal: In Kammer 10 lernt und übt der Spieler den „fling“, in Kammer 12 springt er von höher, in Kammer 15 schleudert er sich zweimal in der Luft, Kammer 18 endet mit einer „infinite fling“-Aufgabe. Dazu der Satz: „note how these "twist" beats are spaced out, and aren't immediately after the Test“.

  ```python run
  # Fling in Portal 1, Kammern
  # laut Level Design Book
  teach = 10
  twists = [12, 15, 18]
  print([k - teach for k in twists])
  ```

  Die Wendungen kommen zwei, fünf und acht Kammern nach der Einführung. Dazwischen spielt der Spieler anderes. Wer sich nach fünf Kammern noch an den Fling erinnert, hat ihn gelernt.

  Hayashidas Entwickeln entspricht dem Test; dieser Kurs nennt den Schritt auch Prüfung. Kishōtenketsu hat einen vierten Schritt, den Abschluss, „Teach, test, twist“ nicht. Beide Muster sagen dasselbe Wesentliche: erst lehren, dann prüfen, dann die Lage ändern. Dan Taylor fasst es als Prinzip: „A good level should either introduce a new game mechanic, or put a spin on an old one to make the player re-evaluate his or her established paradigm.“ ([Ten Principles, Teil 1](https://www.gamedeveloper.com/design/ten-principles-of-good-level-design-part-1-))

  > [!NOTE] Das Zelda-Muster, so wie Taylor es beschreibt
  > Taylor schreibt in einer Bildunterschrift: „every dungeon in every Zelda game is a tutorial for the new piece of equipment you find in it... with the dungeon’s boss being the final test (always with a clever little twist).“ Das ist seine Beschreibung als Level-Designer, keine Aussage von Nintendo. Sie zeigt die vier Schritte über einen ganzen Dungeon gestreckt: Gegenstand finden, damit Rätsel lösen, am Boss abschließen.

  ## Sicher erproben: Preis, Zeitdruck, Rückweg

  Valve schreibt in den Folien zum Post-Mortem von Portal über einen Raum mit dem Titel „Incineration Station – Boss Battle Training“. Als Gründe, warum er funktionierte, stehen dort unter anderem „Perfect Training Location.“ und „Players Learn Better When Not Stressed.“ ([Portal Post-Mortem, GDC 2008](https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf)) Auch das Level Design Book rät, ruhig anzufangen: „Even high action shooters like Doom or Quake begin with quiet rooms where players can test their controls and "warm up" before launching into combat.“ ([Start slow and quiet](https://book.leveldesignbook.com/process/preproduction/pacing#start-slow-and-quiet))

  Ob eine Erprobung sicher ist, hängt an drei Dingen. Die Einteilung ist ein Werkzeug dieses Kurses:

  - **Preis für Fehler.** Was kostet ein Fehlversuch? Nichts, etwas Schaden, verlorener Fortschritt, der Tod? Beim ersten Kontakt sollte er klein sein.
  - **Zeitdruck.** Gibt es Gegner, einen Countdown, eine Fläche, die einbricht? Beim ersten Kontakt sollte es keinen geben.
  - **Rückweg.** Wie weit muss der Spieler nach einem Fehler zurück? Mit 90 Pixeln pro Sekunde, dem Platzhalter dieses Kurses, sind 30 Tiles über fünf Sekunden Laufen, bei jedem Versuch.

  Dazu kommt Platz zum Ausprobieren, also genug Fläche, um die Möglichkeit ohne Kante und ohne Gegner zu benutzen. Wie du Flächen bemisst, steht in [Maßstab, Dichte und Freiflächen](/level-design/massstab-dichte).

  Sicher heißt nicht beliebig leicht. Hayashida erzählt von einer Testerin, einer Büroangestellten aus dem Nachbargebäude, die „had a lot of trouble jumping across even a small gap“. Mit einem Hilfsmittel kam sie ans Ende des Levels, aber das Team wollte etwas anderes sehen: „what we really wanted to see was her being able to jump this gap.“ Das Team zog daraus den Schluss, den Tanooki-Anzug als Hilfe früher anzubieten, „if people are having a particular amount of trouble with a certain stage“. Der Test zeigte, für wen die Erprobung zu schwer war.

  > [!PRAXIS] Valve senkt den Preis für einen Fehler
  > Für Portal plante Valve ein langes Level, in dem der Spieler einen Würfel mitnimmt und am Ende auf einen Knopf legt. Die Folien beschreiben die erste Fassung so: „Moving lift obstacle course over a goo-pit.“ „Players would destroy the box, and had to go back.“ „Frustrating and annoying.“ Die zweite Fassung: „Remove the lifts and the goo pit!“ und „Gameplay events where having the box is necessary.“ Als noch etwas fehlte, kam die Reihenfolge der Hilfen: „Try to hint using the environment. When all else fails great dialogue is an excellent hint.“ ([Portal Post-Mortem](https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf)) Valve nahm die Gefahr weg, die den Fortschritt zerstörte, und ließ den Würfel dort zählen, wo er gebraucht wird. Wie Ziele im Raum sichtbar bleiben, zeigt [Umgebung als Information](/level-design/umgebung-informiert).

  ## Eins nach dem anderen: Neuheiten zählen

  Die schnellste Prüfung einer Abfolge ist eine Zählung. Schreib für jeden Raum auf, welche Möglichkeiten darin vorkommen, und zähl, wie viele davon neu sind. Ein Lehrbeispiel:

  ```text
  Raum 1: Druckplatte
  Raum 2: Druckplatte, Druckplatte
  Raum 3: Druckplatte, Kiste
  Raum 4: Kiste
  ```

  Raum 3 führt die Kiste ein und verlangt sie zugleich zusammen mit der Druckplatte. Wer dort scheitert, weiß nicht, ob er die Kiste nicht versteht oder die Verbindung. Besser ist eine eigene Einführung der Kiste, erst danach die Verbindung. Eine Verbindung zweier bekannter Möglichkeiten ist selbst eine Neuheit. Sie kommt, wenn beide einzeln sitzen.

  Taylor beschreibt dieselbe Bauweise aus Sicht der Arbeit: „By applying simple modifiers to these modules you can create variation, building more levels with less work, and less risk.“ Die Module seien zugleich „a series of familiar encounters that the player can use to learn and master your mechanics, while the modifiers applied to these encounters keep them fresh by providing increased challenge and surprise“ ([Ten Principles, Teil 2](https://www.gamedeveloper.com/design/ten-principles-of-good-level-design-part-2-)). Ein bekannter Baustein mit einem Zusatz ist eine Neuheit, nicht fünf.

  > [!MERKE] Eine Neuheit pro Schritt
  > Jeder Raum bringt höchstens eine neue Möglichkeit oder eine neue Verbindung. Die Prüfung kommt nach der Einführung, die Wendung mit Abstand nach der Prüfung.

  ## Wenden, ohne die Regel zu brechen

  Eine Wendung ändert die Lage, nicht die Regel. Das Level Design Book sagt „twist the frame of the activity“: Dieselbe Möglichkeit erscheint in einem neuen Rahmen, etwa eine Druckplatte, die hinter dem Tor liegt, das sie öffnet, und die man nur über einen Umweg erreicht. Der Spieler denkt anders über sie nach, aber sie funktioniert wie vorher.

  Gefährlich ist eine Variation, die die Regel ändert, ohne es zu zeigen. Brechen graue Platten in den ersten Räumen nach zwei Sekunden ein und in Raum vier sofort, ohne anders auszusehen, lernt der Spieler vor allem, seinem Wissen nicht zu trauen. Willst du eine Regel ändern, gib der neuen Regel ein neues Aussehen. Taylor verlangt eine „consistent visual language, through the use of colour and form, that the player can learn“. Wie du eine solche Sprache für deinen Blockout festlegst, behandelt [Umgebung als Information](/level-design/umgebung-informiert).

  Eine gute Wendung macht aus Wissen Verständnis. Andrew Shouldice beschreibt für Tunic drei Phasen des Lernens, vom Nichtwissen über das Wissen, „where you know something exists, but you don't understand it“, bis zum Verstehen: „Understanding is closure. That's where something 'clicks.'“ ([Game Developer, 2023](https://www.gamedeveloper.com/design/video-how-the-tunic-developers-built-a-mysterious-world)) Der Abschluss einer Abfolge ist die Stelle, an der es klickt.

  ## Lehren ohne Text

  Eine Texttafel ist das billigste Werkzeug, eine Möglichkeit zu erklären, und das bequemste. Heart Machine wollte in Hyper Light Drifter ganz ohne Text auskommen. Alex Preston sagt über die Entscheidung des Kernteams: „No text. Don’t do it. We don’t wanna do it.“ ([Unwinnable, 2015](https://unwinnable.com/2015/12/02/interview-with-alex-preston-the-creator-of-hyper-light-drifter/)) Was das für die Umgebung bedeutet, behandelt [Umgebung als Information](/level-design/umgebung-informiert). Hier geht es um die Abfolge. Ohne Text muss sie die Lehre übernehmen.

  Mittel dafür, als Sammlung dieses Kurses:

  - **Zeigen, bevor der Spieler handelt.** Die Möglichkeit wirkt einmal von selbst, etwa eine Platte, die unter einem Gegner einbricht, bevor die Figur sie betritt.
  - **Ein Raum, der nur eine Lösung hat.** Wenn nur die neue Handlung weiterführt, probiert der Spieler sie aus.
  - **Das Ziel sichtbar machen.** Wer sieht, wohin er will, sucht nach dem Mittel dorthin.
  - **Erst ohne Preis, dann mit.** Der erste Kontakt kostet nichts, der zweite etwas.
  - **Wiederholen mit einer kleinen Änderung.** So erkennt der Spieler, was gleich bleibt.

  Valves Reihenfolge aus Portal gilt hier auch: erst die Umgebung, dann, wenn nichts anderes hilft, ein Satz. Ob die Lehre trägt, zeigt nur das Verhalten von Testern, die das Spiel nicht kennen ([Playtests beobachten](/level-design/playtest-methode)).

  > [!WARNING] Prüfung vor Einführung
  > Der häufigste Fehler in Abfolgen ist ein erster Kontakt, der schon eine Prüfung ist: eine neue Möglichkeit mitten im Kampf, unter Zeitdruck oder über einem Abgrund. Wer dort scheitert, lernt nur, dass er gescheitert ist. Zähl für jede Möglichkeit, wo sie zum ersten Mal vorkommt, und prüf, ob der Preis dort klein ist.

  > [!NOTE] Deine Möglichkeiten, deine Abfolge
  > Welche Möglichkeiten dein Spiel hat und in welcher Reihenfolge sie kommen, entscheidest du. Eine KI darf dir ein Skript schreiben, das in einer Liste von Räumen die Neuheiten zählt. Die Liste selbst ist deine Arbeit.

  > [!INTERVIEW] „Wie bringst du Spielern eine neue Mechanik bei, ohne Tutorialtext?“
  > Ich lege für den Abschnitt eine Möglichkeit fest und plane vier Schritte: einführen, entwickeln, wenden, abschließen. Beim ersten Kontakt ist der Preis für Fehler klein, es gibt keinen Zeitdruck und der Rückweg ist kurz. Ich zähle pro Raum die Neuheiten, höchstens eine, und lege die Wendung mit Abstand nach der Prüfung, wie Portal es mit dem Fling macht. Ändere ich eine Regel, bekommt sie ein neues Aussehen. Dann beobachte ich Tester, die das Spiel nicht kennen, und schaue, wo sie scheitern. Erst wenn die Umgebung nicht reicht, kommt ein Satz.

  ## Häufige Fehler

  - **Zwei Neuheiten zugleich.** Wer scheitert, weiß nicht, woran. Eine Möglichkeit nach der anderen, die Verbindung danach.
  - **Prüfung vor Einführung.** Der erste Kontakt findet unter Druck statt.
  - **Hoher Preis beim ersten Versuch.** Ein langer Rückweg oder verlorener Fortschritt macht aus dem Lernen eine Strafe, wie bei Valves erster Fassung des Würfel-Levels.
  - **Wendung direkt nach dem Test.** Ohne Abstand prüft sie das Kurzzeitgedächtnis, nicht das Gelernte.
  - **Regel heimlich geändert.** Gleiches Aussehen, anderes Verhalten.
  - **Einführung, die man verpassen kann.** Ein optionaler Seitenraum lehrt, was später Pflicht ist.
  - **Texttafel als erstes Mittel.** Sie ist bequem, aber sie ersetzt keinen Raum, in dem man die Möglichkeit ausprobiert.
  - **Kein Abschluss.** Die Abfolge endet mit der Wendung, und der Spieler zeigt nie, dass er die Möglichkeit beherrscht.

  ## Zusammenfassung

  - Kishōtenketsu nach Hayashida hat vier Schritte: einführen, entwickeln, wenden, abschließen. Ein Kernkonzept pro Abschnitt gibt ihnen Platz.
  - „Teach, test, twist“ unterscheidet Test und Wendung über den Hinweis. Beim Test hilft der Raum, bei der Wendung erinnert sich der Spieler selbst.
  - In Portal kommen die Wendungen zum Fling zwei, fünf und acht Kammern nach der Einführung.
  - Sicher erproben heißt kleiner Preis für Fehler, kein Zeitdruck, kurzer Rückweg und genug Platz.
  - Jeder Raum bringt höchstens eine Neuheit. Eine Verbindung zweier Möglichkeiten zählt als eigene.
  - Eine Wendung ändert die Lage, nicht die Regel. Eine neue Regel bekommt ein neues Aussehen.
  - Ohne Text übernimmt die Abfolge die Lehre. Erst die Umgebung, dann ein Satz.
exercises:
  - id: dritter-schritt
    type: choice
    title: Der dritte Schritt
    prompt: |
      Lehrbeispiel: Eine Abfolge lehrt eine Druckplatte, die ein Tor öffnet. Welcher Raum entspricht dem dritten Schritt von Kishōtenketsu, der Wendung?
    options:
      - text: Die Druckplatte liegt hinter dem Tor, das sie öffnet. Man sieht sie durch das Gitter und muss einen Umweg zu ihr finden.
        correct: true
        why: Dieselbe Möglichkeit mit derselben Regel, aber in einer Lage, die anders über sie nachdenken lässt. Das meint Hayashida mit „change-up“.
      - text: Eine einzelne Druckplatte liegt mitten im Raum, und das Tor gegenüber öffnet sich, sobald man sie betritt.
        correct: false
        why: Das ist die Einführung. Die Möglichkeit erscheint und lässt sich ohne Risiko benutzen.
      - text: Zwei Druckplatten müssen beide betreten werden, bevor das Tor aufgeht.
        correct: false
        why: Das ist eine Entwicklung. Die Lage wird etwas schwieriger, aber man denkt auf dieselbe Weise über die Platte nach.
      - text: Eine Druckplatte, die genauso aussieht wie die anderen, öffnet das Tor nur, solange man darauf steht.
        correct: false
        why: Hier ändert sich die Regel, ohne dass man es sieht. Das ist keine Wendung, sondern ein Bruch mit dem Gelernten.
    explanation: |
      Die Wendung behält die Regel und ändert den Rahmen. Der Spieler weiß, was die Platte tut, muss aber neu überlegen, wie er sie in dieser Lage nutzt. Eine heimlich geänderte Regel sieht aus wie eine Wendung, lehrt aber das Gegenteil, nämlich dass Gelerntes nicht gilt.
    hints:
      - Welcher Raum lässt die Regel gleich und ändert nur die Lage?
    resources:
      - title: Christian Nutt, „The Structure of Fun“ (Hayashida, Game Developer)
        url: https://www.gamedeveloper.com/design/the-structure-of-fun-learning-from-i-super-mario-3d-land-i-s-director

  - id: sichere-erprobung
    type: choice
    title: Der erste brüchige Boden
    prompt: |
      Lehrbeispiel: Ein Abschnitt führt Boden ein, der einbricht, wenn man zu lange darauf steht. Welche erste Begegnung erfüllt Preis, Zeitdruck und Rückweg einer sicheren Erprobung?
    options:
      - text: Der erste brüchige Boden liegt in einem ruhigen Raum über einer flachen Grube. Wer einbricht, steht sofort am Rand wieder auf.
        correct: true
        why: Kleiner Preis, kein Zeitdruck, kurzer Rückweg. Der Spieler kann den Boden so oft ausprobieren, wie er will.
      - text: Der erste brüchige Boden liegt mitten in einer Arena mit drei Gegnern.
        correct: false
        why: Die Gegner sind Zeitdruck und lenken ab. Wer einbricht, weiß nicht, ob er den Boden oder den Kampf falsch gelesen hat.
      - text: Der erste brüchige Boden liegt am Ende eines langen Gangs. Wer einbricht, beginnt am Anfang des Abschnitts neu.
        correct: false
        why: Der Rückweg ist teuer. Jeder Fehlversuch kostet einen langen Weg durch Bekanntes, wie bei Valves erster Fassung des Würfel-Levels.
      - text: Eine Texttafel erklärt den Boden, danach folgt eine Strecke aus brüchigen Tiles mit Zeitlimit.
        correct: false
        why: Der erste Kontakt ist schon eine Prüfung unter Zeitdruck. Die Tafel ersetzt den Raum, in dem man es ausprobiert.
    explanation: |
      Valve schreibt über Portal: „Players Learn Better When Not Stressed.“ Beim ersten Kontakt soll der Spieler herausfinden, was der Boden tut, nicht, ob er unter Druck damit zurechtkommt. Das kommt später, in der Entwicklung und der Wendung.
    hints:
      - Prüf jede Antwort auf drei Fragen. Was kostet ein Fehler, gibt es Zeitdruck, wie weit ist der Rückweg?
    resources:
      - title: Swift, Wolpaw, „A Portal Post-Mortem“ (GDC 2008, Folien)
        url: https://cdn.akamai.steamstatic.com/apps/valve/2008/GDC2008_PortalPostMortem.pdf

  - id: vier-raeume
    type: order
    title: Vier Räume, eine Druckplatte
    prompt: |
      Lehrbeispiel: vier Räume, die eine Druckplatte lehren. Bring sie in die Reihenfolge von Kishōtenketsu.
    lang: prose
    lines: |
      Eine einzelne Druckplatte liegt mitten im Raum, und das Tor gegenüber öffnet sich, sobald man sie betritt.
      Zwei Druckplatten an entgegengesetzten Enden des Raums müssen beide betreten werden, bevor das Tor aufgeht.
      Die Druckplatte liegt hinter dem Tor, das sie öffnet, und man erreicht sie nur über einen Umweg.
      Drei Druckplatten und drei Tore, deren Reihenfolge man ohne neue Elemente selbst herausfindet.
    explanation: |
      Die einzelne Platte führt ein, ohne Risiko. Zwei Platten entwickeln die Idee, die Lage wird etwas schwieriger. Die Platte hinter ihrem eigenen Tor ist die Wendung, die Regel bleibt, aber der Spieler muss anders denken. Der letzte Raum schließt ab: Er verlangt alles Gelernte und bringt nichts Neues. In einem echten Abschnitt stünden zwischen den Schritten oft andere Räume.
    hints:
      - Der letzte Raum bringt nichts Neues, er verlangt nur alles Gelernte.
    resources:
      - title: The Level Design Book · Teach, test, twist
        url: https://book.leveldesignbook.com/process/preproduction/pacing#teach-test-twist

  - id: neuheiten-zaehlen
    type: output
    title: Wie viel ist neu?
    prompt: |
      Lehrbeispiel: vier Räume als Mengen von Möglichkeiten, „Platte“ steht für die Druckplatte. Das Modell zählt pro Raum, wie viele davon neu sind. Was gibt es aus?
    lang: python
    code: |
      raeume = [
          {"Platte"},
          {"Platte"},
          {"Platte", "Kiste", "Falltür"},
          {"Kiste", "Falltür"},
      ]
      bekannt = set()
      for nr, r in enumerate(raeume, 1):
          print(nr, len(r - bekannt))
          bekannt |= r
    expected: |
      1 1
      2 0
      3 2
      4 0
    hints:
      - "`r - bekannt` ist alles, was im Raum vorkommt, aber vorher nirgends."
    explanation: |
      Raum 1 führt die Druckplatte ein, Raum 2 nichts Neues. Raum 3 bringt Kiste und Falltür zugleich, zwei Neuheiten, und das zusammen mit der Platte. Raum 4 ist danach nur noch Wiederholung. Die Zählung findet den Fehler sofort: Raum 3 sollte in zwei Räume zerfallen, je einen für Kiste und Falltür. Was das Modell nicht zählt, sind Verbindungen; dass Kiste und Falltür hier zum ersten Mal zusammen auftreten, ist eine weitere Neuheit.
    resources:
      - title: Python · set difference
        url: https://docs.python.org/3/library/stdtypes.html#frozenset.difference

  - id: wendung-abstand
    type: output
    title: Wie weit liegt die Wendung entfernt?
    prompt: |
      Lehrbeispiel: die Schritte einer Abfolge, ein Eintrag pro Raum. Das Modell rechnet, wie viele Räume nach der Einführung jede Wendung und der Abschluss kommen. Was gibt es aus?
    lang: python
    code: |
      folge = ["einführen", "prüfen",
               "prüfen", "anderes",
               "wenden", "anderes",
               "anderes", "wenden",
               "abschließen"]
      start = folge.index("einführen")
      w = [i - start
           for i, s in enumerate(folge)
           if s == "wenden"]
      ende = folge.index("abschließen")
      print(w, ende - start)
    expected: |
      [4, 7] 8
    hints:
      - "`folge.index` liefert die erste Stelle, gezählt ab 0."
    explanation: |
      Die Einführung steht an Stelle 0, die Wendungen an 4 und 7, der Abschluss an 8. Zwischen Prüfung und erster Wendung liegt ein Raum mit anderem Inhalt, wie das Level Design Book es an Portal beschreibt: Wendungen kommen „spaced out“, nicht direkt nach dem Test. Ob dein Abstand zwei oder sechs Räume ist, entscheidest du. Die Zählung zeigt nur, ob es überhaupt einen gibt.
    resources:
      - title: The Level Design Book · Teach, test, twist
        url: https://book.leveldesignbook.com/process/preproduction/pacing#teach-test-twist

  - id: rueckweg-sekunden
    type: output
    title: Was kostet ein Fehlversuch?
    prompt: |
      Lehrbeispiel: Wer an einer neuen Stelle scheitert, beginnt am Eingang des Raums, 30 Tiles entfernt. Tiles sind 16 Pixel, die Figur läuft 90 Pixel pro Sekunde (Platzhalter). Wie viele Sekunden läuft sie nach jedem Fehlversuch zurück? Runde auf eine Nachkommastelle und antworte mit der Zahl.
    lang: text
    code: |
      Sekunden = Tiles × 16 / 90
      Rückweg    30 Tiles
    expected: |
      5.3
    accept: ["5,3", "5,3 s", "5.3 s", "5,3 Sekunden"]
    explanation: |
      30 × 16 = 480 Pixel, 480 / 90 = 5,33 Sekunden. Beginnt der Spieler stattdessen am Rand der Stelle, 3 Tiles entfernt, sind es 0,5 Sekunden. Bei zehn Versuchen läuft der Spieler vom Eingang aus zusammen fast eine Minute, vom Rand aus keine sechs Sekunden. Beim ersten Kontakt mit einer Möglichkeit ist der kurze Rückweg die bessere Wahl. Wo ein langer Rückweg Absicht ist, etwa bei einer Prüfung, entscheidest du.

  - id: begriffe-lehren
    type: gap
    title: Vier Begriffe zum Lehren
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Das Level Design Book nennt das Muster ⟦teach⟧, test, twist. Hayashida beschreibt vier Schritte nach dem Aufbau von Vier-Bild-Comics und nennt sie ⟦Kishōtenketsu⟧. Der dritte Schritt ist die ⟦Wendung⟧. Valve schreibt über Portal: Players learn better when not ⟦stressed⟧.
    gaps:
      - label: erster Takt
        hint: Englisch für „lehren“.
        accept: ["Teach"]
      - label: vier Schritte
        hint: Das Interview schreibt das Wort „kishoutenketsu“.
        accept: ["kishoutenketsu", "Kishotenketsu", "kishotenketsu", "Kishoutenketsu"]
      - label: dritter Schritt
        hint: Englisch „twist“.
        accept: ["Twist", "Wende", "Umschwung", "Überraschung", "ten", "Ten", "Change-up", "change-up"]
      - label: Valve
        hint: Englisch für „gestresst“.
        accept: ["Stressed"]
    explanation: |
      Beide Muster beginnen mit dem Lehren und kommen über eine Prüfung zur Wendung. Kishōtenketsu ergänzt den Abschluss, an dem der Spieler zeigt, was er kann. Valves Satz aus Portal ist die Begründung für die sichere Erprobung am Anfang.
    resources:
      - title: The Level Design Book · Teach, test, twist
        url: https://book.leveldesignbook.com/process/preproduction/pacing#teach-test-twist

  - id: zwei-neuheiten
    type: bug
    title: Ein Raum will zu viel
    prompt: |
      Lehrbeispiel: Abfolge für einen Abschnitt. Tester scheitern an einem Raum immer wieder und können nicht sagen, woran. Finde die Zeile.
    lang: prose
    code: |
      Raum 1: Eine Kiste steht im Weg, man kann sie schieben.
      Raum 2: Zwei Kisten, eine davon muss in eine Nische.
      Raum 3: Eine Kiste muss auf eine Druckplatte, während der Boden um sie herum einbricht.
      Raum 4: Eine Druckplatte öffnet ein Tor.
      Raum 5: Kisten und Druckplatten, ohne brüchigen Boden.
    lines: [3]
    explanation: |
      Raum 3 bringt zwei Neuheiten auf einmal, die Druckplatte und den brüchigen Boden, und verlangt beide zusammen mit der Kiste unter Zeitdruck. Die Druckplatte wird außerdem erst in Raum 4 eingeführt, also nach ihrer ersten Prüfung. Wer in Raum 3 scheitert, kann nicht wissen, ob er die Platte, den Boden oder die Verbindung nicht verstanden hat. Abhilfe: Raum 4 vor Raum 3 setzen und den brüchigen Boden in einem eigenen, ruhigen Raum einführen.
    hints:
      - Zähl in jeder Zeile, was dort zum ersten Mal vorkommt.

  - id: regel-heimlich
    type: bug
    title: Dieselben Platten, eine andere Regel
    prompt: |
      Lehrbeispiel: Abfolge mit brüchigen grauen Platten. Tester sagen nach Raum 4, das Spiel sei „unfair“. Finde die Zeile.
    lang: prose
    code: |
      Raum 1: Graue Platten brechen ein, wenn man zwei Sekunden darauf steht.
      Raum 2: Ein Gang aus grauen Platten, durch den man zügig gehen muss.
      Raum 3: Graue Platten, dazwischen sichere Steine, die einen Umweg bilden.
      Raum 4: Graue Platten, die sofort einbrechen, sobald man sie betritt.
      Raum 5: Ein Raum mit grauen Platten und Steinen, der alles Gelernte verlangt.
    lines: [4]
    explanation: |
      In Raum 4 ändert sich die Regel, nicht die Lage. Die Platten sehen aus wie vorher, brechen aber sofort ein. Was der Spieler in drei Räumen gelernt hat, gilt plötzlich nicht mehr, und er hatte keine Möglichkeit, das vorher zu sehen. Willst du solche Platten, gib ihnen ein eigenes Aussehen und führ sie wie eine neue Möglichkeit ein, mit kleinem Preis beim ersten Kontakt.
    hints:
      - In welchem Raum gilt die Regel aus Raum 1 nicht mehr?
    resources:
      - title: Dan Taylor, „Ten Principles of Good Level Design“, Teil 1
        url: https://www.gamedeveloper.com/design/ten-principles-of-good-level-design-part-1-

  - id: hayashida-konzept
    type: explain
    title: Ein Konzept pro Level
    prompt: |
      Koichi Hayashida im Interview mit Christian Nutt (2012), wörtlich. Erkläre in drei bis fünf Sätzen, was sich zwischen Super Mario Galaxy und Super Mario 3D Land geändert hat und warum das mit den vier Schritten von Kishōtenketsu zusammenhängt.
    lang: prose
    code: |
      So you would be going through a galaxy, and every time you get to a new planet, there would be some new thing to play with there -- some new concept. So you would end up with lots of different gameplay concepts in a single stage.

      But it wasn't really until Super Mario 3D Land that I think I really became a lot more rigorous about enforcing that in level design, where you have a clear concept in the beginning, and that's carried through absolutely all the way.
    points:
      - In Galaxy brachte jeder Planet etwas Neues, ein Level hatte viele Konzepte.
      - In 3D Land steht ein klares Konzept am Anfang und trägt durch das ganze Level.
      - Vier Schritte brauchen Raum. Nur ein Konzept, das bleibt, kann eingeführt, entwickelt, gewendet und abgeschlossen werden.
      - Für einen eigenen Abschnitt heißt das, eine Möglichkeit festzulegen und die anderen als Bekanntes zu nutzen.
    explanation: |
      In Super Mario Galaxy gab es auf jedem Planeten etwas Neues, ein Level war eine Folge von Einführungen. In Super Mario 3D Land hat Hayashida ein Konzept pro Level durchgesetzt, das vom Anfang bis zum Ende trägt. Das passt zu den vier Schritten: Eine Möglichkeit, die nach einem Raum wieder verschwindet, wird nur eingeführt, nie entwickelt, gewendet oder abgeschlossen. Erst ein Konzept, das bleibt, gibt dem Spieler die Chance, es zu beherrschen. Für meinen Abschnitt heißt das, eine Möglichkeit festzulegen und alles andere nur als Bekanntes einzusetzen.
    hints:
      - Wie viele der vier Schritte bekommt ein Konzept, das nur auf einem Planeten vorkommt?
    resources:
      - title: Christian Nutt, „The Structure of Fun“ (Game Developer, 2012)
        url: https://www.gamedeveloper.com/design/the-structure-of-fun-learning-from-i-super-mario-3d-land-i-s-director

  - id: buero-testerin
    type: explain
    title: Die Lücke, über die sie nicht kam
    prompt: |
      Hayashida erzählt von einem Playtest für Super Mario 3D Land, wörtlich. Erkläre in drei bis fünf Sätzen, was das Team beobachtet hat, warum das Erreichen des Ziels nicht reichte und welche Antwort Nintendo gewählt hat.
    lang: prose
    code: |
      But what we realized was that she had a lot of trouble jumping across even a small gap. [...] When we eventually had her use the P-wing to get to the end of the level, we thought, "Well, okay, she got through to the end of the level, but what we really wanted to see was her being able to jump this gap." And so that's the sort of thing that made us realize we need to put in some access to the Tanooki suit a little bit earlier, if people are having a particular amount of trouble with a certain stage.
    points:
      - Der Test zeigte eine Stelle, an der eine Testerin an einer Grundfähigkeit scheiterte, einem kleinen Sprung.
      - Mit dem Hilfsmittel erreichte sie das Ziel, aber das Team wollte sehen, dass sie den Sprung schafft. Das Ziel war die Fähigkeit, nicht das Ende des Levels.
      - Die Antwort des Teams war, den Tanooki-Anzug früher anzubieten, wenn Spieler in einem Level besonders viel Mühe haben.
      - Für eine eigene Abfolge heißt das, beim Zusehen auf die Stelle des Scheiterns zu achten und Preis oder Hilfe dort anzupassen, ohne die Möglichkeit zu streichen.
    explanation: |
      Das Team sah, dass eine Testerin schon an einem kleinen Sprung scheiterte. Mit dem P-Flügel kam sie ans Ende, aber das war nicht die Absicht: Sie sollte den Sprung lernen. Die Antwort des Teams war, den Tanooki-Anzug als Hilfe früher anzubieten, wenn Spieler in einem Level besonders viel Mühe haben. Der Test hat so gezeigt, für wen die Erprobung zu schwer war. Für meine Abfolgen heißt das, die Stelle des Scheiterns genau zu notieren und dort Preis, Rückweg oder Hilfe zu ändern, statt die Möglichkeit selbst wegzunehmen.
    hints:
      - Was wollte das Team sehen, das Ende des Levels oder den Sprung?
    resources:
      - title: Christian Nutt, „The Structure of Fun“ (Game Developer, 2012)
        url: https://www.gamedeveloper.com/design/the-structure-of-fun-learning-from-i-super-mario-3d-land-i-s-director

  - id: einfuehrung-analysieren
    type: practice
    title: Wie hat das Spiel es dir beigebracht?
    prompt: |
      Wähle ein veröffentlichtes Top-down-Spiel und darin eine Möglichkeit, die es dir ohne lange Erklärung beigebracht hat, etwa eine Fähigkeit, ein Hindernis oder ein Gegnerverhalten. Notier in höchstens fünf Stichpunkten, wie die Abfolge aufgebaut war.
    lang: prose
    starter: |
      Spiel und Möglichkeit:
      Erster Kontakt (Preis, Zeitdruck, Rückweg):
      Prüfung:
      Wendung:
      Text oder Hinweise im Raum:
    checklist:
      - Spiel und Möglichkeit sind genannt.
      - Beim ersten Kontakt sind Preis für Fehler, Zeitdruck und Rückweg beschrieben.
      - Du nennst die Stelle, an der das Spiel die Möglichkeit zum ersten Mal geprüft hat.
      - Du nennst eine Wendung oder schreibst, dass du keine gefunden hast.
      - Du notierst, ob Text vorkam und wenn ja, wo.
    explanation: |
      Wer eine Abfolge in einem fremden Spiel zerlegt, sieht, welche Schritte dort wirklich vorkommen und welche fehlen. Fehlt die Wendung, endet das Lernen mit der Prüfung. Steht Text am Anfang, prüfe, ob der Raum ihn gebraucht hätte. Was du gesehen hast, trennst du von dem, was du vermutest, wie in [Level lesen](/level-design/raum-lesen).
    hints:
      - Erinnerst du dich nicht genau, sieh dir ein Video vom Anfang des Spiels an.
    resources:
      - title: The Level Design Book · Pacing
        url: https://book.leveldesignbook.com/process/preproduction/pacing

  - id: eigene-abfolge
    type: practice
    title: Deine Abfolge für eine Möglichkeit
    prompt: |
      Wähle eine Möglichkeit, aus deinem eigenen Projekt oder als neutrales Übungsbeispiel; welche, entscheidest du. Schreib für sie eine Abfolge aus vier Schritten, je eine kurze Zeile pro Raum. Was in den Räumen steht, legst du fest.
    lang: prose
    starter: |
      Möglichkeit:
      Einführen:
      Entwickeln (Prüfung):
      Dazwischen:
      Wenden:
      Abschließen:
    checklist:
      - Jeder Raum bringt höchstens eine Neuheit, und du hast sie gezählt.
      - Beim ersten Kontakt ist der Preis für Fehler klein, es gibt keinen Zeitdruck, und der Rückweg ist kurz.
      - Die Wendung behält die Regel und ändert die Lage, oder eine geänderte Regel hat ein neues Aussehen.
      - Zwischen Prüfung und Wendung liegt mindestens ein Raum mit anderem Inhalt, oder du begründest, warum nicht.
      - Die Abfolge kommt ohne Text aus.
    explanation: |
      Die vier Zeilen sind ein Plan, kein Beweis. Ob Spieler die Möglichkeit so lernen, zeigt erst ein Playtest, in dem du nichts erklärst. Notier dir vorher, woran du merkst, dass ein Schritt scheitert, etwa an wiederholten Fehlversuchen an derselben Stelle. Die Vorlage dafür ist die Absichtsnotiz aus [Absicht notieren, Layout skizzieren](/level-design/absicht-skizze).
    hints:
      - Fang mit dem Abschluss an. Was soll der Spieler am Ende können?
    resources:
      - title: The Level Design Book · Teach, test, twist
        url: https://book.leveldesignbook.com/process/preproduction/pacing#teach-test-twist
