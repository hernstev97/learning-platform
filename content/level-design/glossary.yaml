terms:
  - term: Absicht
    definition: Was der Spieler an einer Stelle tun, bemerken oder verstehen soll, als ein Satz notiert. Sie steht in keinem Spiel, sondern in deiner Notiz, und lässt sich nur über Verhalten prüfen.
  - term: Absichtsnotiz
    definition: Die feste Vorlage dieses Kurses für einen Abschnitt – Abschnitt, Absicht in einem Satz, erwarteter Weg, Hinweise, Zeichen für Erfolg und Scheitern. Du schreibst sie vor dem Bauen.
  - term: Hinweis
    definition: Alles im Raum, das Blick oder Weg lenken soll – Licht, Kontrast, Form, Weg, Öffnung, Landmarke, Bewegung. Englisch oft „cue“. Der einzige Teil des Grundmodells, den du direkt gestaltest.
  - term: Verhalten
    definition: Was Spieler tatsächlich tun – Weg, Halt, Umkehr, Blickrichtung, Gesagtes. Wird beobachtet und notiert, nicht gedeutet.
  - term: Draufsicht
    definition: Kamera über dem Spielfeld, ohne Horizont, englisch „top-down“. Was der Spieler sieht, begrenzt der Bildschirm. Viele Spiele zeichnen dabei eine 3/4-Ansicht.
  - term: 3/4-Ansicht
    definition: Darstellung, bei der Wände und Figuren von vorn, Böden und Dächer von oben zu sehen sind. Hohe Objekte verdecken, was hinter ihnen liegt, auch innerhalb des Bildausschnitts.
  - term: Bildausschnitt
    definition: Der Teil der Welt, den die Kamera gerade zeigt. Bei 320 × 180 Pixeln und 16-Pixel-Tiles sind es 20 × 11 volle Tiles.
  - term: Critical Path
    definition: Der beabsichtigte Hauptweg durch ein Level, auch „golden path“. Das Level Design Book betont, dass die meisten Spieler davon abweichen, trödeln oder sich verirren.
  - term: Flow
    definition: Wie sich Spieler durch ein Level bewegen. Guter Flow ist laut Level Design Book der, der die beabsichtigte Erfahrung unterstützt, nicht ein bestimmtes Muster.
  - term: Blickführung
    definition: Gestaltung, die bestimmt, wohin der Blick zuerst, zweitens und drittens geht – über Kontrast, Licht, Bewegung, Linien und Rahmung.
  - term: Tonwert
    definition: Wie hell oder dunkel eine Fläche ist, unabhängig von der Farbe. Tonwertkontrast lenkt den Blick stärker als Farbunterschiede gleicher Helligkeit.
  - term: Rahmung
    definition: Ein Ziel wird von Wänden, Öffnungen oder Objekten eingefasst, sodass der Blick darauf fällt.
  - term: Visuelles Rauschen
    definition: Viele gleich laute Details ohne Rangfolge. Hinweise gehen darin unter.
  - term: Unschärfetest
    definition: Ein Bildschirmfoto verkleinern oder verwischen und prüfen, was dann noch hervorsticht. Schnelle Probe für die Rangfolge eines Bildes, kein Ersatz für einen Playtest.
  - term: Wayfinding
    definition: Orientierung (wo bin ich?) und Navigation (wie komme ich zum Ziel?) zusammen. Das Level Design Book ordnet Hilfen dafür nach geschätzter Sicherheit von subtil bis direkt.
  - term: Weg (Lynch)
    definition: Eines der fünf Elemente nach Kevin Lynch – Kanäle, auf denen man sich bewegt, im Spiel etwa Pfade, Gänge, Brücken.
  - term: Kante (Lynch)
    definition: Eine Grenze, die man nicht oder kaum überquert und an der man sich entlang orientiert, etwa ein Fluss, eine Mauer, ein Abgrund.
  - term: Bereich (Lynch)
    definition: Ein Gebiet mit eigener, wiedererkennbarer Gestalt. Englisch „district“. Spieler wissen dadurch, in welchem Teil der Welt sie sind.
  - term: Knoten (Lynch)
    definition: Ein Punkt, an dem sich Wege treffen oder an dem man ankommt, etwa eine Kreuzung oder ein Platz. Englisch „node“, im Spiel oft „hub“.
  - term: Landmarke
    definition: Ein auffälliger Bezugspunkt, den man nicht betritt, sondern sieht. Gute Landmarken sind einzigartig, sichtbar und bleiben an ihrem Platz.
  - term: Mentale Karte
    definition: Das Bild eines Gebiets, das sich ein Spieler beim Durchqueren im Kopf baut. Lynch nennt die Eigenschaft eines Ortes, ein starkes Bild hervorzurufen, „imageability“.
  - term: Sichtlinie
    definition: Was der Spieler von einer Stelle aus sehen kann. In der Draufsicht begrenzen sie Bildrand, hohe Verdecker, Dächer und Dunkelheit.
  - term: Brotkrumen
    definition: Eine Reihe kleiner Hinweise, die einen Weg nachzeichnen, etwa Fundstücke, Spuren oder Lichter.
  - term: Schleife
    definition: Ein Weg, der zu einem bekannten Knoten zurückführt, oft mit einer Abkürzung, die erst von der anderen Seite zu öffnen ist.
  - term: Metriken
    definition: Maße eines Spiels – Größe, Tempo, Ausweichweite der Figur und die daraus abgeleiteten Breiten, Abstände und Flächen. Englisch „metrics“.
  - term: Maßstabsraum
    definition: Eine Testszene mit Gängen, Durchgängen und Flächen in bekannten Größen, in der du die Metriken deiner Figur ausmisst. Englisch oft „gym“ oder „metrics map“.
  - term: Freifläche
    definition: Eine große, offene Fläche ohne Hindernisse. Spieler lesen sie oft als Ort für eine Begegnung.
  - term: Enge und Weite
    definition: Der Wechsel zwischen engen und weiten Räumen. Nach der Enge wirkt die Weite größer; englisch „compression and release“.
  - term: Prospect und Refuge
    definition: Nach Christopher Totten offene, ungeschützte Flächen (Prospect) und geschützte Orte mit Überblick (Refuge). Das Level Design Book hält das Modell für begrenzt anwendbar.
  - term: Kishōtenketsu
    definition: Vierteiliger Aufbau aus einführen, entwickeln, wenden, abschließen, den Koichi Hayashida für die Level von Super Mario 3D Land beschreibt.
  - term: Teach, Test, Twist
    definition: Dreischritt aus dem Level Design Book – eine Möglichkeit zeigen, ihr Verständnis prüfen, sie in einer neuen Lage wenden.
  - term: Sichere Erprobung
    definition: Eine neue Möglichkeit zuerst dort zeigen, wo ein Fehler wenig kostet, ohne Zeitdruck und mit kurzem Rückweg.
  - term: Taktplan
    definition: Eine Folge von Takten eines Levels mit Tätigkeit, Dauer und Intensität, englisch oft „beat chart“. Zeigt vor dem Bauen, wo Ruhe und wo Spitzen liegen.
  - term: Takt
    definition: Ein Abschnitt im Rhythmus eines Levels mit einer vorherrschenden Tätigkeit – Bewegung, Beobachtung, Entdeckung oder Begegnung – und einer Dauer.
  - term: Pacing
    definition: Reihenfolge und Rhythmus von Tätigkeiten und Ereignissen in einem Level. Im Kurs eingedeutscht als Rhythmus.
  - term: AI Director
    definition: System in Left 4 Dead, das die Intensität für die Spieler misst und die Gegnerzahl in den Phasen Build Up, Sustain Peak, Peak Fade und Relax steuert.
  - term: Affordanz
    definition: Was ein Ding oder Ort möglich macht, etwa dass eine Kiste sich schieben lässt. Begriff von J. J. Gibson, in die Gestaltung gebracht von Don Norman.
  - term: Signifikant
    definition: Das wahrnehmbare Zeichen, das eine Möglichkeit anzeigt. Don Norman schreibt, Design müsse vor allem Signifikanten liefern; englisch „signifier“.
  - term: Visuelle Sprache
    definition: Feste Zuordnung von Aussehen und Bedeutung in einem Spiel, etwa für begehbar, blockiert, gefährlich und interaktiv. Sie muss überall gelten.
  - term: Signposting
    definition: Deutliche Markierungen, die Weg oder Möglichkeiten anzeigen, etwa gelbe Farbe an Kletterkanten. Stärker als leise Hinweise, kostet aber das Finden.
  - term: Blockout
    definition: Ein spielbarer Rohbau eines Levels aus einfachen Formen ohne Ausgestaltung, auch Greybox, Whitebox oder Blockmesh. Billig zu ändern und das, was man testet.
  - term: Blockout-Vokabel
    definition: Deine Liste, welche Form und welcher Tonwert im Blockout was bedeutet, im Kurs mit sechs Kategorien – begehbar, blockiert hoch, blockiert tief, gefährlich, benutzbar, Hinweis. Sie gilt im ganzen Projekt.
  - term: Platzhalter
    definition: Ein einfaches Element, das später ersetzt wird – ein flaches Tile, ein graues Rechteck, ein Wert aus dem Kurs statt eines eigenen.
  - term: Ausgestaltung
    definition: Die Grafik, die einen getesteten Blockout bekleidet, ohne Spielfluss und Hinweise zu verändern. Englisch „set dressing“ oder „art pass“.
  - term: Baukasten
    definition: Ein Satz zusammenpassender Teile im gleichen Raster, aus dem man Level baut. Joel Burgess beschreibt Kits für Skyrim als Systeme, die mehr ergeben als die Summe ihrer Teile.
  - term: TileMapLayer
    definition: Godot-Node für eine Ebene aus Tiles. Seit Godot 4.3 nimmt man für Boden, Wände, Hinweise und Ausgestaltung je einen eigenen TileMapLayer.
  - term: Playtest
    definition: Jemand spielt dein Level, und du siehst zu, ob es wirkt. Das Verhalten zählt mehr als die Rückmeldung.
  - term: Blind Playtest
    definition: Ein Test mit möglichst wenig Anleitung. Der Tester spielt, als wäre er allein, und du beobachtest, was er tut.
  - term: Lautes Denken
    definition: Testpersonen sprechen beim Spielen aus, was sie denken. Englisch „thinking aloud“. Ergänzt die Beobachtung, ersetzt sie nicht.
  - term: Frischer Tester
    definition: Jemand, der den Abschnitt noch nicht kennt. Nur frische Tester zeigen, ob eine Stelle ohne Vorwissen bemerkt wird.
  - term: Beobachtungsprotokoll
    definition: Notizen aus einem Playtest mit Zeit, Ort, Handlung und Gesagtem, getrennt von der Deutung.
  - term: Wegschreiber
    definition: Ein kleines Skript, das die Position der Figur in festen Abständen speichert und als Linie zeichnet. Macht Wege mehrerer Tester vergleichbar.
  - term: Abbruchregel
    definition: Vor dem Playtest festgelegte Bedingung, wann du eingreifst, etwa nach einer bestimmten Zahl Minuten ohne Fortschritt. Jeder Eingriff kommt mit Zeit ins Protokoll.
  - term: Hebel
    definition: Eine Stelle im Raum, an der du etwas änderst, um eine bestimmte Ursache zu treffen – Lage im Bild, Kontrast, Form, Breite, Reihenfolge, Stärke einer Markierung.
  - term: Iterationsprotokoll
    definition: Je Runde ein kurzer Block mit Stelle, Beobachtung, Art, Änderung, Erwartung und Ergebnis.
  - term: Regressionstest
    definition: Derselbe Test nach einer Änderung, die nichts verbessern soll, etwa der Ausgestaltung. Prüft, ob etwas kaputtgegangen ist, das vorher trug.
