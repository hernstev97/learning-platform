projects:
  - id: analyse-abschnitt
    title: Analyse eines Abschnitts aus einem veröffentlichten Top-down-Spiel
    level: 1
    hours: 5
    summary: Du liest einen kurzen Abschnitt aus einem Top-down-Spiel deiner Wahl so genau, dass ein anderer ihn nachvollziehen kann – Skizze im Raster, Hinweise, Orientierung, Rhythmus und vermutete Absicht, gegengeprüft mit einer Quelle oder einem zweiten Spieler.
    brief: |
      **Ausgangslage:** In den Modulen hast du einzelne Mittel an vielen Spielen gesehen. Hier liest du einen einzigen Abschnitt gründlich, einen, den du selbst gespielt hast. Die Analyse ist keine Kritik und keine Nacherzählung. Sie zeigt, wie der Abschnitt gebaut ist und warum du dich darin so bewegt hast, wie du es getan hast.

      **Anforderungen:**

      - Ein veröffentlichtes Top-down-Spiel deiner Wahl und darin ein Abschnitt von zwei bis vier Bildschirmen.
      - Eine Skizze im Raster, ein Kästchen pro Tile, mit Bildschirmrahmen, deinem ersten Weg und markierten Hinweisen.
      - Fünf Gesichtspunkte: Blickführung, Orientierung (Wege, Kanten, Knoten, Bereiche, Landmarken), Maßstab und Dichte, Rhythmus, Umgebung als Information.
      - Gesehenes und Gedeutetes sind getrennt. Jede Tatsache über das Spiel hat eine Quelle oder ist als eigene Beobachtung gekennzeichnet.
      - Die vermutete Absicht in einem Satz, gegengeprüft mit einer Entwicklerquelle oder mit dem Weg eines zweiten Spielers, dem du nichts erklärst.

      **Rahmen:** Notizen und Skizze gehen unterwegs auf Papier und am Handy, die Ausarbeitung am PC, zusammen etwa fünf Stunden. Grundlage sind [Level lesen](/level-design/raum-lesen), [Blickführung](/level-design/blickfuehrung), [Orientierung](/level-design/orientierung), [Maßstab und Dichte](/level-design/massstab-dichte) und [Rhythmus](/level-design/rhythmus). Die Analyse schreibst du selbst.
    skills: [analyse, skizze, blickfuehrung, orientierung, rhythmus, quellenarbeit]
    steps:
      - id: abschnitt-waehlen
        title: Spiel und Abschnitt wählen
        detail: Wähle einen Abschnitt, den du selbst gespielt hast, zwei bis vier Bildschirme groß. Notier sofort aus dem Gedächtnis, wo du beim ersten Mal entlanggegangen bist.
      - id: skizze-raster
        title: Im Raster skizzieren
        detail: Spiel die Stelle noch einmal oder halte ein Video an und skizzier sie auf Karopapier, ein Kästchen pro Tile, mit einem Rahmen für einen Bildschirm. Zähl Schritte oder vergleich mit der Figur, um Maße zu schätzen.
      - id: hinweise-markieren
        title: Hinweise markieren
        detail: Markier alles, was Blick oder Weg gelenkt hat, mit Ort und Art. Ordne die Orientierungselemente nach Lynch zu ([Orientierung](/level-design/orientierung)).
      - id: rhythmus-zeichnen
        title: Rhythmus als Taktplan
        detail: Schreib die Folge aus Bewegung, Beobachtung, Entdeckung und Begegnung mit geschätzter Dauer als Taktplan auf ([Rhythmus](/level-design/rhythmus)).
      - id: gesehen-gedeutet
        title: Gesehenes und Gedeutetes trennen
        detail: Geh deine Notizen durch und teil sie in zwei Spalten. Unter „Gesehen“ bleibt nur, was eine Kamera aufnehmen könnte.
      - id: absicht-pruefen
        title: Absicht vermuten und gegenprüfen
        detail: Formulier die vermutete Absicht in einem Satz. Such eine Entwicklerquelle oder lass eine zweite Person die Stelle spielen, ohne etwas zu erklären, und vergleich ihren Weg mit deinem Satz.
      - id: ausarbeiten
        title: Ausarbeiten
        detail: Fass alles auf zwei bis drei Seiten zusammen, mit Skizze, Quellenliste und einem Absatz, was du für eigene Abschnitte daraus mitnimmst.
    acceptance:
      - id: skizze-mit-rahmen
        text: Die Skizze zeigt den Abschnitt im Raster mit Bildschirmrahmen, erstem Weg und mindestens fünf markierten Hinweisen.
      - id: fuenf-gesichtspunkte
        text: Alle fünf Gesichtspunkte sind behandelt, jeder mit mindestens einer konkreten Stelle.
      - id: gesehen-getrennt
        text: Beobachtungen und Deutungen stehen getrennt; Tatsachen über das Spiel haben eine Quelle oder sind als eigene Beobachtung markiert.
      - id: absicht-gegengeprueft
        text: Die vermutete Absicht steht in einem Satz und ist mit einer Quelle oder einem zweiten Spieler gegengeprüft; das Ergebnis der Prüfung steht dabei, auch wenn es der Vermutung widerspricht.
    stretch:
      - Denselben Abschnitt nach einigen Wochen noch einmal lesen und vergleichen, was dir jetzt auffällt.
      - Einen zweiten Abschnitt aus einem anderen Spiel mit gleicher Aufgabe danebenlegen, etwa zwei erste Dungeonräume.
    portfolio: |
      Eine Analyse zeigt, dass du Level nicht nur spielst, sondern liest. Zeig die Skizze mit markierten Hinweisen und den Vergleich zwischen deiner Vermutung und dem, was der zweite Spieler getan hat. Im Gespräch fragen Designer gern, welches Level du zuletzt so gelesen hast und was du daraus gelernt hast.

  - id: massstab-baukasten
    title: Maßstabsraum und Blockout-Baukasten
    level: 2
    hours: 6
    summary: Am PC misst du die Werte deiner eigenen Spielfigur in einem Maßstabsraum aus und legst daraus einen Baukasten aus Platzhalter-Tiles mit deiner visuellen Sprache an, auf dem alle späteren Blockouts stehen.
    brief: |
      **Ausgangslage:** Bevor du Abschnitte baust, brauchst du Maße, denen du traust: Wie breit muss ein Gang für deine Figur sein, wie groß eine Fläche, in der sie zweimal ausweichen kann, wie viel zeigt ein Bildschirm? Dieses Projekt beantwortet das mit deiner Figur, nicht mit den Platzhaltern des Kurses.

      **Anforderungen:**

      - Eine Godot-Szene „Maßstabsraum“ mit Gängen in mehreren Breiten, Durchgängen, einer offenen Fläche und Abständen, die du in Tiles beschriftest.
      - Deine Figur mit deinen eigenen Werten für Tempo, Fußfläche und, wenn dein Spiel eins hat, Ausweichen. Woher die Werte kommen, entscheidest du; Platzhalter aus dem Kurs markierst du als solche.
      - Ein Platzhalter-TileSet mit deiner Blockout-Vokabel, je eine Tile für begehbar, blockiert hoch, blockiert tief, gefährlich, benutzbar und Hinweis ([Umgebung als Information](/level-design/umgebung-informiert)), als flache Tonwerte, wo nötig mit einfacher Formmarke, ohne Ausgestaltung.
      - Eine Tabelle `MASSE.md` mit gemessenen Werten und den Regeln, die du daraus ableitest, etwa „Gänge mindestens N Tiles“.

      **Rahmen:** Godot 4.7 am PC, etwa sechs Stunden. Skripte für Messhilfen darf eine KI schreiben; welche Maße du festlegst, entscheidest du. Grundlage sind [Maßstab und Dichte](/level-design/massstab-dichte), [Umgebung als Information](/level-design/umgebung-informiert) und [Blockout in Godot](/level-design/blockout). Wie ein TileSet entsteht, steht im Godot-Kurs ([2D-Level aus Tiles](/godot/level-tilemap)).
    skills: [metriken, godot, tilemaplayer, blockout, visuelle-sprache, dokumentation]
    steps:
      - id: werte-sammeln
        title: Werte der Figur sammeln
        detail: Schreib Tempo, Fußfläche, Ausweichweite und alles andere auf, was über Platz entscheidet. Rechne jeden Wert in Tiles und Sekunden um.
      - id: tileset-vokabel
        title: Platzhalter-TileSet mit deiner Vokabel
        detail: Leg für jede der sechs Kategorien deiner Blockout-Vokabel einen flachen Tonwert fest, wo nötig mit einer einfachen Formmarke. Prüf mit dem Unschärfetest, ob man sie unterscheidet ([Blickführung](/level-design/blickfuehrung)).
      - id: gaenge-bauen
        title: Gänge und Durchgänge bauen
        detail: Bau Gänge in mehreren Breiten und Durchgänge daneben. Lauf, weiche aus, dreh dich in jedem und notier, wo es eng wird.
      - id: flaeche-bauen
        title: Offene Fläche bauen
        detail: Bau eine offene Fläche und miss, wie viele Ausweichbewegungen sie quer und längs fasst und wie viel davon auf einen Bildschirm passt.
      - id: kamera-pruefen
        title: Kamera und Bildschirm prüfen
        detail: Setz Kameragrenzen und prüf, was am Rand der Fläche im Bild ist. Notier, wie viele Tiles du in jede Richtung siehst.
      - id: regeln-ableiten
        title: Regeln ableiten
        detail: Schreib in `MASSE.md` drei bis sechs Regeln mit Begründung aus deinen Messungen. Jede Regel nennt eine Zahl.
      - id: sichern
        title: In Git sichern
        detail: Commite Szene, TileSet und `MASSE.md` mit einer Nachricht, die die Figurwerte nennt. Ändern sich die Werte später, wiederholst du die Messungen.
    acceptance:
      - id: massstab-szene
        text: Die Szene startet in Godot 4.7 ohne Fehler und enthält Gänge in mindestens drei Breiten, Durchgänge und eine offene Fläche, jeweils in Tiles beschriftet.
      - id: masse-dokumentiert
        text: "`MASSE.md` nennt die Figurwerte mit Herkunft (gemessen, festgelegt oder Platzhalter) und mindestens drei abgeleitete Regeln mit Zahl und Begründung."
      - id: vokabel-unterscheidbar
        text: Das Platzhalter-TileSet hat für jede der sechs Kategorien der Blockout-Vokabel eine eigene Darstellung, die auch im unscharfen Bildschirmfoto zu unterscheiden ist.
      - id: nur-blockout
        text: Der Baukasten enthält keine Ausgestaltung; alle Tiles sind flache Tonwerte, höchstens mit einer einfachen Formmarke.
    stretch:
      - Eine zweite Figur oder ein Gegner mit anderer Größe im selben Raum, und welche Regeln sich dadurch ändern.
      - Ein kleines Skript, das Abstände zwischen zwei Markern in Tiles und Sekunden anzeigt.
    portfolio: |
      Ein Maßstabsraum zeigt, dass du Räume aus den Werten des Spiels ableitest statt nach Augenmaß. Zeig ein Bild des Raums mit Beschriftungen und die Tabelle der Regeln. Im Gespräch kommt oft die Frage, wie du vorgehst, wenn sich Tempo oder Größe der Figur spät im Projekt ändern.

  - id: einfuehrung-testen
    title: Eine Möglichkeit einführen, testen und variieren
    level: 2
    hours: 10
    summary: Du wählst eine Möglichkeit deines Spiels und baust als Blockout eine kurze Folge, die sie einführt, sicher ausprobieren lässt, prüft und variiert – getestet mit drei Personen, die sie nicht kennen, und einmal überarbeitet.
    brief: |
      **Ausgangslage:** Eine Mechanik, die niemand versteht, gibt es für den Spieler nicht. Dieses Projekt baut eine Folge von drei bis fünf kleinen Räumen, in der Spieler eine Möglichkeit ohne Text verstehen, ausprobieren und am Ende in einer neuen Lage anwenden.

      **Anforderungen:**

      - Eine Möglichkeit, die du selbst wählst: eine Bewegung, ein Gegenstand, eine Eigenschaft der Umgebung. Der Kurs schlägt keine vor.
      - Eine Absichtsnotiz für die ganze Folge und eine Zeile je Raum mit seiner Aufgabe (einführen, entwickeln, wenden, abschließen oder eine eigene Gliederung mit Begründung).
      - Ein Blockout in Godot 4.7 mit Platzhalter-Tiles, ohne Text auf dem Bildschirm, der die Möglichkeit erklärt.
      - Ein Test mit drei Personen, die die Folge nicht kennen, mit Protokoll, und eine Überarbeitungsrunde mit einer Änderung und neuen Testern.

      **Rahmen:** Godot 4.7 am PC, Skizzen und Auswertung auch unterwegs, etwa zehn Stunden. Technik darf eine KI übernehmen; Möglichkeit, Räume und Reihenfolge entscheidest du. Grundlage sind [Möglichkeiten einführen](/level-design/einfuehren-variieren), [Absicht und Skizze](/level-design/absicht-skizze), [Blockout](/level-design/blockout), [Playtests beobachten](/level-design/playtest-methode) und [Überarbeiten](/level-design/ueberarbeiten).
    skills: [einfuehrung, kishotenketsu, blockout, playtest, ueberarbeiten, godot]
    steps:
      - id: moeglichkeit-waehlen
        title: Möglichkeit wählen
        detail: Wähl eine Möglichkeit und schreib in einem Satz, was der Spieler am Ende damit können soll.
      - id: folge-planen
        title: Folge planen
        detail: Schreib je Raum eine Zeile mit Aufgabe, Preis eines Fehlers und dem, was neu ist. Pro Raum kommt höchstens eine Neuheit dazu.
      - id: skizzieren
        title: Räume skizzieren
        detail: Skizzier jeden Raum im Raster mit erwartetem Weg und Hinweisen.
      - id: blockout-bauen
        title: Blockout bauen
        detail: Bau die Räume mit deinem Baukasten. Prüf selbst nur, ob alles technisch geht, nicht ob es verständlich ist.
      - id: erster-test
        title: Erster Test
        detail: Drei Personen, die die Folge nicht kennen, spielen ohne Erklärung. Du notierst Weg, Halt, Versuche und Gesagtes je Raum.
      - id: auswerten
        title: Auswerten
        detail: Ordne jede Abweichung einer Art zu und wähl eine Stelle für die nächste Runde ([Überarbeiten](/level-design/ueberarbeiten)).
      - id: zweite-runde
        title: Zweite Runde
        detail: Eine Änderung mit schriftlicher Erwartung, dann mindestens zwei neue Tester.
      - id: zusammenfassen
        title: Zusammenfassen
        detail: Fass auf einer Seite zusammen, was die Folge lehren sollte, was Tester taten und was die Änderung bewirkt hat.
    acceptance:
      - id: ohne-text
        text: Die Folge erklärt die Möglichkeit nicht mit Text auf dem Bildschirm; Steuerungshinweise auf Tasten sind erlaubt und als solche gekennzeichnet.
      - id: eine-neuheit
        text: Jeder Raum hat eine notierte Aufgabe und bringt höchstens eine Neuheit; der erste Raum lässt die Möglichkeit ohne nennenswerten Preis eines Fehlers ausprobieren.
      - id: drei-tester
        text: Ein Protokoll von drei Testern, die die Folge nicht kannten, liegt vor, mit Weg und Verhalten je Raum.
      - id: eine-aenderung
        text: Die Überarbeitungsrunde ändert genau eine Sache, hat eine vorher notierte Erwartung und mindestens zwei neue Tester.
    stretch:
      - Eine zweite Variation am Ende, die die Möglichkeit mit einer bekannten anderen kombiniert.
      - Dieselbe Folge mit einem Tester, der die Möglichkeit aus einem anderen Spiel kennt, und ein Vergleich.
    portfolio: |
      Eine Einführungsfolge zeigt, dass du Lernen gestalten kannst. Zeig die Raumliste mit Aufgaben, ein Bild jedes Raums und eine Stelle, an der der Test dich überrascht hat. Im Gespräch fragen Designer, woran du merkst, dass ein Spieler eine Mechanik verstanden hat, und nicht nur, dass er weitergekommen ist.

  - id: abschluss-abschnitt
    title: "Abschlussprojekt: ein begehbarer Abschnitt mit Absicht und Beobachtung"
    capstone: true
    level: 3
    hours: 30
    summary: Ein kleines Studio schickt dir einen Level-Design-Test. Du baust in Godot einen eigenen begehbaren Abschnitt von zwei bis vier Bildschirmen – Absichtsnotiz, Skizze, Blockout, mindestens zwei Testrunden ohne Erklärung, aufgezeichnete Wege – und lieferst einen Vergleich zwischen Absicht und beobachtetem Verhalten. Alle Designentscheidungen triffst du.
    brief: |
      ## Auftrag

      Malte Kern leitet ein Indie-Studio mit fünf Leuten in Kassel. Das Studio arbeitet an einem Actionspiel in der Draufsicht mit Pixelart. Für die Stelle „Level Designer (m/w/d)“ schickt er dir einen Designtest. Seine Lage:

      - Die Tester des Prototyps verlaufen sich in den ersten Räumen, und das Team weiß nicht, ob es an der Grafik oder am Grundriss liegt.
      - Level entstehen bisher direkt in fertiger Grafik. Jede Änderung am Grundriss kostet Tage.
      - Niemand schreibt auf, was ein Raum bewirken soll. Diskussionen drehen sich um Geschmack.

      Gesucht ist kein fertiges Level, sondern ein Beleg, dass du einen Abschnitt mit einer prüfbaren Absicht baust, fremde Spieler beobachtest, ohne zu erklären, und gezielt überarbeitest. Was der Abschnitt zeigt und wohin er führt, gibt dir niemand vor. Wenn du willst, ist er ein erster Abschnitt für Project Delicate Flower; der Kurs schlägt dafür keinen Ort und keine Begegnung vor.

      ## Was du lieferst

      1. **Eine spielbare Szene** in Godot 4.7: ein Abschnitt von zwei bis vier Bildschirmen als Blockout mit Platzhalter-Tiles, getrennten Ebenen für Boden, Wände und Hinweise und einem Wegschreiber.
      2. **`ABSICHT.md`:** die Absichtsnotiz für den Abschnitt und für jede Stelle mit eigener Absicht, mit erwartetem Weg und beobachtbaren Zeichen; jede spätere Fassung mit Datum.
      3. **Die Skizze** auf Papier oder am Handy, als Foto oder Scan, mit Bildschirmrahmen.
      4. **`PROTOKOLL.md`:** mindestens zwei Testrunden mit zusammen mindestens fünf Testern, die den Abschnitt nicht kannten, Beobachtungsprotokoll je Tester und je Runde ein Eintrag im Iterationsprotokoll.
      5. **`VERGLEICH.md`:** Absicht und beobachtetes Verhalten Stelle für Stelle nebeneinander, mit den aufgezeichneten Wegen als Bild und einer ehrlichen Liste, was nicht aufging.
      6. **Ein Video** von höchstens zwei Minuten: der erwartete Weg und die aufgezeichneten Wege übereinander.

      ## Technischer Rahmen

      Godot 4.7, GDScript, Auflösung und Tilegröße nach deiner Wahl. Skripte wie den Wegschreiber oder Hilfen im Editor darf eine KI schreiben. Layout, Orte, Hinweise und jede Designentscheidung triffst du selbst; erzeugte Level oder Karten sind nicht erlaubt. Eine Ausgestaltung ist nicht verlangt. Machst du eine, kommt danach ein weiterer Test mit derselben Absicht dazu.

      Grundlage sind alle Module dieses Bereichs, besonders [Absicht und Skizze](/level-design/absicht-skizze), [Blockout](/level-design/blockout), [Playtest am PC](/level-design/playtest-godot), [Überarbeiten](/level-design/ueberarbeiten) und die [Werkstatt](/level-design/werkstatt-abschnitt).
    skills: [level-design, absicht, blockout, godot, playtest, wege-aufzeichnen, ueberarbeiten, dokumentation]
    steps:
      - id: umfang-festlegen
        title: Umfang festlegen
        detail: Leg fest, wie groß der Abschnitt ist, zwei bis vier Bildschirme, und wo er beginnt und endet. Schreib in einem Satz, was ein Spieler darin tun oder bemerken soll.
      - id: absicht-schreiben
        title: Absichtsnotiz schreiben
        detail: Fülle die Absichtsnotiz aus, für den Abschnitt und jede Stelle mit eigener Absicht. Jede Zeile „Zeichen, dass es klappt“ muss beim Zusehen abzuhaken sein.
      - id: skizzieren
        title: Skizzieren
        detail: Skizzier den Abschnitt im Raster mit Bildschirmrahmen, erwartetem Weg und Hinweisen. Prüf vor dem Bauen mit deinen Maßen, ob Gänge und Flächen passen.
      - id: blockout
        title: Blockout bauen
        detail: Bau den Abschnitt mit deinem Platzhalter-Baukasten, mit getrennten Ebenen und Kameragrenzen. Keine Ausgestaltung.
      - id: wegschreiber
        title: Wege aufzeichnen
        detail: Bau den Wegschreiber ein oder lass ihn bauen und prüf an einem eigenen Lauf, dass Datei und Spur stimmen ([Playtest am PC](/level-design/playtest-godot)).
      - id: runde-eins
        title: Erste Testrunde
        detail: Mindestens drei Personen, die den Abschnitt nicht kennen, spielen ohne Erklärung. Du protokollierst, sicherst die Wegdateien und fragst erst danach nach.
      - id: auswerten
        title: Auswerten
        detail: Leg die Wege über den erwarteten Weg, ordne jede Abweichung einer Art zu und entscheide, ob du das Level oder bewusst die Absicht änderst.
      - id: runde-zwei
        title: Zweite Testrunde
        detail: Eine Änderung mit schriftlicher Erwartung, dann mindestens zwei neue Tester. Halte das Ergebnis im Iterationsprotokoll fest.
      - id: vergleich-schreiben
        title: Vergleich schreiben
        detail: Stell Absicht und Verhalten Stelle für Stelle nebeneinander, mit Bildern der Wege. Schreib auch auf, was nicht aufging und was du als Nächstes testen würdest.
      - id: abgabe
        title: Abgabe zusammenstellen
        detail: Video, Dokumente, Skizze und ein README mit Godot-Version und Startanleitung. Lies alles einmal als Malte Kern.
    acceptance:
      - id: spielbar
        text: Die Szene startet mit Godot 4.7 ohne Fehler; der Abschnitt ist von Anfang bis Ende begehbar und umfasst zwei bis vier Bildschirme.
      - id: blockout-getrennt
        text: Boden, Wände und Hinweise liegen auf getrennten Ebenen aus Platzhalter-Tiles; eine Ausgestaltung, falls vorhanden, liegt auf einer eigenen Ebene und ändert keine Kollision.
      - id: absicht-pruefbar
        text: "`ABSICHT.md` nennt für den Abschnitt eine Absicht in einem Satz, den erwarteten Weg, die Hinweise und mindestens zwei beobachtbare Zeichen für Erfolg und Scheitern; Änderungen sind datiert."
      - id: tests-ohne-erklaerung
        text: "`PROTOKOLL.md` belegt mindestens zwei Runden mit zusammen mindestens fünf Testern, die den Abschnitt nicht kannten; Beobachtung und Deutung sind getrennt, Eingriffe sind vermerkt, Tester sind nicht namentlich genannt."
      - id: wege-aufgezeichnet
        text: Für jeden Tester gibt es eine aufgezeichnete Wegdatei, und `VERGLEICH.md` zeigt die Wege über dem erwarteten Weg.
      - id: eine-aenderung-je-runde
        text: Jede Überarbeitungsrunde ändert genau eine Sache und nennt eine vorher notierte, zählbare Erwartung und das Ergebnis.
      - id: ehrlicher-vergleich
        text: "`VERGLEICH.md` nennt mindestens eine Stelle, an der das Verhalten auch nach der Überarbeitung nicht der Absicht entspricht, oder begründet, warum es keine gibt."
      - id: git-verlauf
        text: Das Projekt liegt in Git; jede Runde ist ein eigener Commit mit Verweis auf ihren Eintrag im Protokoll.
    stretch:
      - Eine Ausgestaltung mit eigener Ebene und ein Regressionstest mit neuen Testern, der zeigt, ob die Hinweise noch tragen.
      - Eine dritte Runde, die eine andere Stelle als die zweite untersucht.
      - Eine Fassung, in der du eine Absicht bewusst änderst, und ein Test, der die neue Fassung prüft.
    portfolio: |
      Das Projekt ist eine vollständige Fallstudie: Absicht, Skizze, Blockout, Beobachtung, Überarbeitung, Vergleich. Zeig im Portfolio das Video mit den Wegen, die Skizze neben dem Blockout und eine Stelle, an der deine Erwartung falsch war. Im Gespräch fragen Designer, was du ohne Testergebnis geändert hättest, wie du entscheidest, ob du das Level oder die Absicht änderst, und wie du einem Artist erklärst, welche Hinweise die Ausgestaltung nicht verdecken darf.
