cards:
  - id: was-ist-level-design
    module: raum-lesen
    q: Was macht ein Level gut?
    a: |
      Dass das Verhalten der Spieler zur Absicht passt. Ein Level ist ein Raum mit Absicht: Der Spieler soll an einer Stelle etwas tun, bemerken oder verstehen. Ob das klappt, sehe ich nicht am Entwurf, sondern beim Zusehen. Schön kann er außerdem sein, aber ein schöner Raum, in dem niemand den Ausgang findet, verfehlt seine Absicht.
    tags: [grundlagen]
    level: 1
  - id: absicht-hinweis-verhalten
    module: raum-lesen
    q: Was unterscheidet Absicht, Hinweis und Verhalten?
    a: |
      Die Absicht steht in meiner Notiz, der Hinweis im Raum, das Verhalten beim Spieler. Gestalten kann ich nur die Hinweise, etwa Licht, Wege, Kontrast oder eine Landmarke. Prüfen kann ich nur am Verhalten. Die Lücke zwischen Absicht und Verhalten ist das, woran ich überarbeite.
    tags: [grundlagen]
    level: 1
  - id: level-analysieren
    module: raum-lesen
    q: Wie analysierst du ein Level aus einem anderen Spiel?
    a: |
      Ich spiele die Stelle einmal unvorbereitet und notiere sofort meinen Weg, weil das nur einmal geht. Dann skizziere ich sie im Raster, markiere jeden Hinweis und trenne, was zu sehen war, von dem, was ich daraus schließe. Am Ende steht die vermutete Absicht in einem Satz, und die prüfe ich gegen eine Entwicklerquelle oder den Weg eines zweiten Spielers.
    tags: [analyse, methode]
    level: 1
  - id: draufsicht-besonderheit
    module: raum-lesen
    q: Was ist in der Draufsicht anders als in einem Spiel mit Kamera hinter der Figur?
    a: |
      Es gibt keinen Horizont. Der Spieler sieht nur den Bildschirm, bei 320 × 180 Pixeln und 16-Pixel-Tiles sind das 20 × 11 Tiles. Ferne Landmarken muss er sich merken, statt sie zu sehen. Dazu ist der Blick nach oben und unten im Breitbild kürzer als zur Seite, und hohe Wände verdecken in der 3/4-Ansicht, was dahinter liegt.
    tags: [draufsicht]
    level: 2
  - id: blick-lenken
    module: blickfuehrung
    q: Mit welchen Mitteln lenkst du den Blick in einem Raum?
    a: |
      Vor allem mit Kontrast, und zwar zuerst im Tonwert, dann in Farbe und Sättigung. Dazu kommen Bewegung, Licht, Linien wie Wege und Kanten und Rahmung durch Öffnungen. Wichtig ist die Rangfolge: ein Hauptpunkt, wenige Nebenpunkte, viel Ruhe dazwischen. Wenn alles laut ist, fällt nichts auf.
    tags: [blickfuehrung, komposition]
    level: 1
  - id: unschaerfetest
    module: blickfuehrung
    q: Wie prüfst du schnell, ob ein Raum lesbar ist?
    a: |
      Mit einem Unschärfetest: Ich mache ein Bildschirmfoto, verkleinere oder verwische es und schaue, was dann noch hervorsticht. Bleibt der Ausgang erkennbar und das Wichtigste der hellste oder kontrastreichste Fleck, trägt die Komposition. Verschwimmt alles zu einer Fläche, fehlt die Rangfolge. Ersetzen kann der Test einen Playtest nicht.
    tags: [blickfuehrung, lesbarkeit]
    level: 2
  - id: licht-fuehrt
    module: blickfuehrung
    q: Warum folgen Spieler dem Licht?
    a: |
      Weil Kontrast den Blick zieht und Spieler dorthin gehen, wo sie hinschauen. Valve hat das für Left 4 Dead als Regel notiert: „Players tend to follow the light“. Für mich heißt das: Ein beleuchteter Ausgang in einem dunklen Raum ist ein starker Hinweis. Steht dort aber ein Fundstück statt des Weges, lenkt dasselbe Licht in die falsche Richtung.
    tags: [blickfuehrung, licht]
    level: 1
  - id: lynch-elemente
    module: orientierung
    q: Welche Elemente helfen Spielern, sich zu orientieren?
    a: |
      Ich nutze die fünf Elemente von Kevin Lynch: Wege, Kanten, Bereiche, Knoten und Landmarken. Wege und Kanten ordnen die Bewegung, Bereiche mit eigener Gestalt sagen, wo man ist, Knoten sind Kreuzungen und Treffpunkte, Landmarken sind auffällige Bezugspunkte. In der Draufsicht kommt dazu, dass eine Landmarke im Bild sein muss, um zu wirken, oder sich so einprägen muss, dass man sie wiedererkennt.
    tags: [orientierung, lynch]
    level: 2
  - id: gute-landmarke
    module: orientierung
    q: Was macht eine gute Landmarke aus?
    a: |
      Sie ist einzigartig, gut sichtbar und bleibt an ihrem Platz. Zwei gleiche Brunnen an zwei Kreuzungen sind keine Landmarken, sie verwirren. Ich unterscheide außerdem globale Landmarken, die über weite Strecken Richtung geben, von lokalen, die einen Knoten unverwechselbar machen.
    tags: [orientierung, landmarke]
    level: 1
  - id: sichtlinie-draufsicht
    module: orientierung
    q: Was ist eine Sichtlinie in einem Top-down-Spiel?
    a: |
      Weniger eine Linie durch den Raum als die Frage, was im Bildausschnitt ist und was verdeckt wird. Der Bildrand begrenzt die Sicht, hohe Wände und Dächer verdecken in der 3/4-Ansicht, Dunkelheit verbirgt. Eine Sichtlinie öffne ich, indem ich einen Durchgang so lege, dass das Ziel ins Bild kommt, bevor der Spieler entscheiden muss.
    tags: [orientierung, sichtlinie]
    level: 2
  - id: verlaufen-gewollt
    module: orientierung
    q: Ist es schlecht, wenn sich Spieler verlaufen?
    a: |
      Nicht immer. Erkunden darf Umwege enthalten, und ein Labyrinth darf verwirren, wenn das die Absicht ist. Schlecht ist ungewolltes Verlaufen: Der Spieler kennt sein Ziel, findet keinen Weg und gibt auf. Den Unterschied sehe ich im Test: Wer erkundet, schaut sich um und probiert; wer verloren ist, läuft dieselbe Runde mehrmals und kehrt um.
    tags: [orientierung, playtest]
    level: 2
  - id: metriken-zuerst
    module: massstab-dichte
    q: Warum legst du Maße fest, bevor du ein Level baust?
    a: |
      Weil jeder Raum aus den Werten der Figur folgt: Tempo, Größe, Ausweichweite. Das Level Design Book nennt das „build at the player's scale“. Ich messe die Werte in einem Maßstabsraum aus und leite Regeln ab, etwa eine Mindestbreite für Gänge. Ändert sich das Tempo spät, prüfe ich die Regeln neu, statt jeden Raum nach Gefühl anzupassen.
    tags: [metriken, blockout]
    level: 2
  - id: gangbreite
    module: massstab-dichte
    q: Wie breit sollte ein Gang sein?
    a: |
      So breit, wie die Absicht und die Figur es verlangen. Für Skyrim hat Bethesda als Untergrenze „a minimum of two character widths“ genannt. In einem Top-down-Spiel mit Bewegung in alle Richtungen und Ausweichen prüfe ich zusätzlich, ob die Figur in dem Gang an einem Gegner vorbei- oder ausweichen können soll. Enge Gänge sind erlaubt, wenn ich sie für Spannung oder Kontrast will.
    tags: [metriken]
    level: 2
  - id: enge-weite
    module: massstab-dichte
    q: Wozu nutzt du Wechsel zwischen engen und weiten Räumen?
    a: |
      Für Kontrast und Erwartung. Nach einem engen Gang wirkt eine offene Fläche größer, und Spieler lesen große, leere Flächen oft als Ort für eine Begegnung. Ich nutze das bewusst, und wenn eine Freifläche keine Begegnung hat, prüfe ich im Test, ob Spieler trotzdem eine erwarten.
    tags: [massstab, rhythmus]
    level: 2
  - id: groesse-wirken-lassen
    module: massstab-dichte
    q: Wie lässt du einen Raum in der Draufsicht groß wirken?
    a: |
      Über Bezugsgrößen und den Bildausschnitt. Bekannte Dinge wie Türen, Bäume oder die Figur selbst zeigen den Maßstab. Ein Raum, der nicht auf einen Bildschirm passt, wirkt groß, weil die Kamera fahren muss. Frei zoomen kann ich bei pixelgenauer Darstellung nicht, nur in ganzen Faktoren.
    tags: [massstab, kamera]
    level: 3
  - id: kishotenketsu
    module: einfuehren-variieren
    q: Wie führst du eine neue Mechanik in einem Level ein?
    a: |
      In vier Schritten, wie Koichi Hayashida es für Super Mario 3D Land beschrieben hat: einführen, entwickeln, wenden, abschließen. Zuerst kann der Spieler die Mechanik ohne großen Preis eines Fehlers ausprobieren. Dann wird sie schwieriger, dann kommt eine Wendung, die sie in neuem Licht zeigt. Pro Raum bringe ich höchstens eine Neuheit.
    tags: [einfuehrung, kishotenketsu]
    level: 2
  - id: sicher-erproben
    module: einfuehren-variieren
    q: Warum soll man eine neue Möglichkeit zuerst sicher ausprobieren können?
    a: |
      Weil Menschen unter Druck schlechter lernen. Valve schreibt im Post-Mortem zu Portal: „Players Learn Better When Not Stressed.“ Wer beim ersten Versuch stirbt, weiß nicht, ob er die Regel falsch verstanden oder nur schlecht ausgeführt hat. Also führe ich ohne Zeitdruck und mit kurzem Rückweg ein und prüfe erst danach.
    tags: [einfuehrung]
    level: 2
  - id: ohne-text-lehren
    module: einfuehren-variieren
    q: Kann man eine Mechanik ganz ohne Text erklären?
    a: |
      Oft ja, und es zwingt zu klarerem Design. Das Team von Hyper Light Drifter wollte von Anfang an keinen Text im Spiel und musste deshalb andere Wege finden. Ich zeige die Mechanik in einer Lage, in der sie die naheliegende Lösung ist, lasse sie ohne Risiko ausprobieren und prüfe im Test, ob Tester sie ohne Erklärung finden.
    tags: [einfuehrung, ohne-text]
    level: 2
  - id: rhythmus-warum
    module: rhythmus
    q: Warum braucht ein Level Ruhephasen?
    a: |
      Weil dauernde Spannung ermüdet und dauernde Ruhe langweilt. Valve hat das für den AI Director von Left 4 Dead als Phasen beschrieben: Build Up, Sustain Peak, Peak Fade, Relax. Für meine Abschnitte heißt das, nach einer Begegnung kommt Bewegung oder Entdeckung, und vor einer großen Begegnung ein Moment zum Überblicken.
    tags: [rhythmus, pacing]
    level: 2
  - id: beat-chart
    module: rhythmus
    q: Wie planst du den Rhythmus eines Abschnitts?
    a: |
      Mit einem Taktplan, englisch oft „beat chart“: eine Folge von Abschnitten mit Tätigkeit, Dauer und Intensität. Die Dauer rechne ich aus Weglänge und Tempo der Figur. So sehe ich vor dem Bauen, ob drei Begegnungen ohne Pause aufeinanderfolgen oder ob eine lange Strecke ohne Ereignis kommt. Ob der Rhythmus sich so anfühlt, zeigt erst der Test.
    tags: [rhythmus, planung]
    level: 2
  - id: aussichtspunkt
    module: rhythmus
    q: Wozu dient ein Aussichtspunkt vor einer Begegnung?
    a: |
      Er gibt dem Spieler einen Moment, die Lage zu lesen und einen Plan zu machen, bevor er sich festlegt. Christopher Totten beschreibt das mit Prospect und Refuge: geschützte Orte mit Überblick über eine offene Fläche. Das Level Design Book sieht das Modell kritisch, ich nutze es deshalb als Idee, nicht als Regel, und prüfe im Test, ob Spieler dort wirklich innehalten.
    tags: [rhythmus, prospect-refuge]
    level: 3
  - id: affordanz-signifikant
    module: umgebung-informiert
    q: Was ist der Unterschied zwischen Affordanz und Signifikant?
    a: |
      Eine Affordanz ist, was ein Ding möglich macht, etwa dass eine Kiste sich schieben lässt. Ein Signifikant ist das wahrnehmbare Zeichen, das das anzeigt. Don Norman schreibt, Design müsse vor allem Signifikanten liefern. Im Level heißt das: Was der Spieler tun kann, muss er sehen können, sonst gibt es die Möglichkeit für ihn nicht.
    tags: [umgebung, norman]
    level: 2
  - id: visuelle-sprache
    module: umgebung-informiert
    q: Was ist eine visuelle Sprache in einem Level?
    a: |
      Feste Zuordnungen zwischen Aussehen und Bedeutung: so sieht begehbar aus, so blockiert, so gefährlich, so interaktiv. Sie muss im ganzen Spiel gelten. Bricht ein Raum die Regel, etwa eine zerstörbare Wand, die aussieht wie jede andere, ohne dass das ein bewusstes Geheimnis ist, fühlt der Spieler sich zu Recht betrogen.
    tags: [umgebung, lesbarkeit]
    level: 2
  - id: gelbe-farbe
    module: umgebung-informiert
    q: Was hältst du von deutlichen Markierungen wie gelber Farbe an Kletterkanten?
    a: |
      Sie lösen ein echtes Problem: In detaillierter Grafik gehen leise Hinweise unter, und Spieler hängen fest. Sie kosten aber das Finden und die Glaubwürdigkeit der Welt. Ich fange mit leisen Mitteln an und werde deutlicher, wo der Test es verlangt, auf Pflichtwegen eher als bei Geheimnissen. Und ich halte die Markierung konsistent.
    tags: [umgebung, signposting]
    level: 2
  - id: information-oder-erzaehlung
    module: umgebung-informiert
    q: Wie unterscheidest du Umgebung als Information von Umgebung als Erzählung?
    a: |
      Information beantwortet „Was kann ich hier tun?“, Erzählung „Was ist hier passiert?“. Eine Blutspur kann beides: Sie zeigt einen Weg und erzählt von einem Kampf. Ich prüfe beides getrennt. Folgen Spieler der Spur, wirkt sie als Information; können sie hinterher sagen, was passiert ist, wirkt sie als Erzählung.
    tags: [umgebung, erzaehlen]
    level: 2
  - id: absichtsnotiz
    module: absicht-skizze
    q: Was steht bei dir in einer Absichtsnotiz?
    a: |
      Der Abschnitt, die Absicht in einem Satz, der erwartete Weg, die Hinweise mit Ort und Zweck und je ein beobachtbares Zeichen für Erfolg und Scheitern. Die Zeichen sind das Wichtigste: „soll geheimnisvoll wirken“ kann ich nicht abhaken, „wird am Seitengang langsamer“ schon. Ändere ich die Absicht später, kommt die neue Fassung mit Datum dazu.
    tags: [planung, absicht]
    level: 1
  - id: skizze-vs-blockout
    module: absicht-skizze
    q: Warum reicht eine gute Skizze nicht?
    a: |
      Weil niemand eine Skizze spielt. Das Level Design Book sagt es deutlich: „the player never plays your drawing.“ Die Skizze hilft mir, Absicht, Maße und Weg zu klären, bevor ich baue. Ob der Raum wirkt, zeigen erst Blockout und Playtest.
    tags: [planung, blockout]
    level: 1
  - id: umfang-klein
    module: absicht-skizze
    q: Wie groß sollte ein Abschnitt für den ersten eigenen Test sein?
    a: |
      Klein, zwei bis vier Bildschirme. Bei 90 Pixeln pro Sekunde sind drei Bildschirme in elf Sekunden durchquert. Ein kleiner Abschnitt lässt sich in einem Abend bauen, mit mehreren Testern prüfen und überarbeiten. Ein großer bleibt halb fertig, und ich lerne nichts über die einzelne Stelle.
    tags: [planung, umfang]
    level: 1
  - id: warum-blockout
    module: blockout
    q: Warum baust du zuerst einen Blockout?
    a: |
      Weil graue Formen billig zu ändern sind und fertige Grafik teuer. Im Blockout teste ich Grundriss, Maße und Hinweise, ohne dass Ausgestaltung das Urteil verfälscht. Das Level Design Book sagt: Eine Skizze kann man nicht testen, einen Blockout schon, und genau dafür ist er da.
    tags: [blockout]
    level: 1
  - id: ebenen-trennen
    module: blockout
    q: Wie organisierst du einen Blockout in Godot?
    a: |
      Mit getrennten TileMapLayer-Ebenen: Boden, Wände mit Kollision, eine Ebene für die beabsichtigten Hinweise und später eine eigene für die Ausgestaltung. So kann ich die Hinweise ausblenden, um zu prüfen, ob der Raum ohne sie trägt, und die Ausgestaltung ändern, ohne die Kollision anzufassen. Das TileSet ist eine Palette aus flachen Tonwerten mit meiner visuellen Sprache.
    tags: [blockout, godot]
    level: 2
  - id: ki-im-level
    module: blockout
    q: Wofür nutzt du KI bei der Level-Arbeit, und wofür nicht?
    a: |
      Für Technik: Skripte wie einen Wegschreiber, Editorhilfen, das Projektgerüst. Layouts, Orte und Hinweise entwerfe ich selbst. Ein erzeugter Raum würde mir nichts darüber sagen, ob meine Absicht trägt, und ich würde die Lücke zwischen Absicht und Verhalten an einem fremden Entwurf studieren.
    tags: [ki, arbeitsweise]
    level: 1
  - id: worauf-achten
    module: playtest-methode
    q: Worauf achtest du, wenn jemand dein Level spielt?
    a: |
      Auf das, was er tut: wo er hingeht, wo er stehen bleibt, wohin die Figur schaut, wo er umkehrt, an Wänden entlangläuft oder Kanten abtastet. Dazu notiere ich, was er sagt, getrennt. Valve hat es so formuliert: „Importance of what people do—not what they say“. Deutungen wie „verwirrt“ schreibe ich erst später dazu.
    tags: [playtest, beobachten]
    level: 1
  - id: nicht-helfen
    module: playtest-methode
    q: Was tust du, wenn ein Tester fragt, wohin er gehen soll?
    a: |
      Ich beantworte die Frage nicht, sondern gebe sie zurück: „Was denkst du?“ Die Nielsen Norman Group nennt das Boomerang. Jede Antwort von mir würde das Verhalten ändern, das ich beobachten will. Wann ich doch eingreife, lege ich vorher in einer Abbruchregel fest, etwa eine Zahl an Minuten ohne Fortschritt, und notiere jeden Eingriff mit Zeit.
    tags: [playtest, moderation]
    level: 2
  - id: erkunden-oder-verwirrt
    module: playtest-methode
    q: Wie unterscheidest du beim Zusehen Erkunden von Verwirrung?
    a: |
      Am Muster. Wer erkundet, wählt neue Wege, schaut in Ecken und kommt mit etwas zurück. Wer verwirrt ist, läuft dieselbe Runde mehrmals, kehrt um, ohne etwas gefunden zu haben, oder bleibt lange stehen. Sicher bin ich mir erst mit dem, was der Tester dazu sagt, und mit dem Vergleich zu anderen Testern.
    tags: [playtest, beobachten]
    level: 2
  - id: wie-viele-tester
    module: playtest-methode
    q: Wie viele Tester brauchst du?
    a: |
      Pro Runde wenige, dafür mehrere Runden. Jakob Nielsen hat für Usability-Tests geschrieben, die besten Ergebnisse kämen aus Tests mit höchstens fünf Personen und so vielen kleinen Runden wie möglich. Für Level gilt dasselbe: Nach jeder Runde ändere ich etwas, und für jede neue Runde brauche ich Leute, die den Abschnitt noch nicht kennen.
    tags: [playtest, planung]
    level: 2
  - id: wege-aufzeichnen
    module: playtest-godot
    q: Wie hältst du fest, welche Wege Tester gegangen sind?
    a: |
      Mit einem kleinen Wegschreiber im Spiel, der die Position der Figur in festen Abständen in eine Datei schreibt und als Linie über die Karte zeichnet. Den erwarteten Weg lege ich als zweite Linie daneben. Auf Papier mitzeichnen geht auch, ist aber ungenauer. Die Dateien sind anonym, ohne Namen.
    tags: [playtest, godot]
    level: 2
  - id: testversion
    module: playtest-godot
    q: Was bereitest du vor einem Playtest am PC vor?
    a: |
      Eine Testversion, die ohne Editor läuft, einen ruhigen Platz, die Absichtsnotiz für mich, den Wegschreiber und ein Protokollblatt. Ich sage dem Tester nur, was er steuern kann, nicht wohin er soll. Und ich frage vorher, ob ich Weg und Gesagtes notieren darf.
    tags: [playtest, vorbereitung]
    level: 1
  - id: kette-reisst
    module: ueberarbeiten
    q: Tester übersehen einen Hinweis. Was tust du?
    a: |
      Ich bestimme zuerst, wo die Kette reißt: nicht bemerkt, falsch gelesen, nicht befolgt oder eine Folge, die ich nicht wollte. Dazu nehme ich Ort, Zeit, Blickrichtung und Gesagtes aus dem Protokoll. Dann prüfe ich, ob meine Absicht noch stimmt, ändere eine Sache mit schriftlicher Erwartung und teste mit Leuten, die den Abschnitt nicht kennen.
    tags: [ueberarbeiten, diagnose]
    level: 2
  - id: vorschlag-tester
    module: ueberarbeiten
    q: Ein Tester sagt „Mach den Weg rot“. Was machst du damit?
    a: |
      Ich notiere es als Beobachtung: Er hat den Weg nicht als Weg gelesen. Ob Rot die Lösung ist, entscheide ich. Vielleicht reicht ein breiterer Durchgang oder ein anderer Boden. Der Vorschlag zeigt, wo das Problem liegt, nicht wie es zu lösen ist.
    tags: [ueberarbeiten, rueckmeldung]
    level: 1
  - id: eine-aenderung
    module: ueberarbeiten
    q: Warum änderst du pro Runde nur eine Sache?
    a: |
      Damit ich weiß, was gewirkt hat. Ändere ich Kontrast, Breite und Belohnung zugleich und jetzt finden alle den Gang, lerne ich nichts für den nächsten Raum. Valve beschreibt Designs als Hypothesen und Playtests als Experimente, und ein Experiment hat eine Variable.
    tags: [ueberarbeiten, methode]
    level: 2
  - id: wann-ausgestalten
    module: ausgestaltung
    q: Wann fängst du mit der Ausgestaltung an?
    a: |
      Wenn der Blockout getestet ist und die wichtigsten Stellen tragen. Das Level Design Book sagt, Environment Artists warten auf einen reifen Blockout. Vorher wäre jede Grafik, die ich nach einem Test wegwerfe, verlorene Arbeit, und schöne Grafik verdeckt Probleme im Grundriss.
    tags: [ausgestaltung, blockout]
    level: 2
  - id: hinweise-behalten
    module: ausgestaltung
    q: Wie stellst du sicher, dass die Ausgestaltung die Hinweise nicht verdeckt?
    a: |
      Die Kollision folgt dem Blockout, nicht der Grafik. Die Tonwertrangfolge bleibt: Was im Blockout hervorstach, sticht auch danach hervor. Und ich wiederhole denselben Test mit neuen Testern und vergleiche die Wege mit denen aus dem Blockout. Ein Hinweis, der im Grau trug und in Farbe untergeht, ist ein häufiger Fall.
    tags: [ausgestaltung, regressionstest]
    level: 3
  - id: atmosphaere-vs-lesbarkeit
    module: ausgestaltung
    q: Atmosphäre oder Lesbarkeit, was gewinnt?
    a: |
      Die Absicht entscheidet. Dunkelheit, Nebel und dichte Details können genau das sein, was ein Raum will, aber sie kosten Lesbarkeit. Ich lege fest, welche Hinweise auf jeden Fall lesbar bleiben müssen, und prüfe nach der Ausgestaltung, ob sie es sind. Alles andere darf Atmosphäre sein.
    tags: [ausgestaltung, atmosphaere]
    level: 3
  - id: werkstatt-vergleich
    module: werkstatt-abschnitt
    q: Wie zeigst du, ob ein Abschnitt seine Absicht erreicht hat?
    a: |
      Mit einem Vergleich Stelle für Stelle: links die Absicht und das erwartete Zeichen, rechts das, was Tester getan haben, mit den aufgezeichneten Wegen als Bild. Ich nenne auch die Stellen, an denen es nicht aufging. Ein ehrlicher Vergleich ist mehr wert als ein Abschnitt, der angeblich perfekt funktioniert.
    tags: [werkstatt, dokumentation]
    level: 2
  - id: absicht-aendern
    module: ueberarbeiten
    q: Wann änderst du die Absicht statt des Levels?
    a: |
      Wenn das beobachtete Verhalten für das Spiel besser ist als mein Plan. Gehen Tester zuerst in den Seitengang und haben dabei mehr vom Raum, ändere ich die Absicht bewusst, schreibe die neue Fassung mit Datum auf und teste gegen sie. Was ich nicht tue: die Absicht still an das anpassen, was gerade passiert ist.
    tags: [werkstatt, absicht]
    level: 3
  - id: designtest-level
    q: Du bekommst einen Level-Design-Test. Wie gehst du vor?
    a: |
      Ich kläre Rahmen, Zeit und was bewertet wird. Dann schreibe ich die Absicht auf, skizziere mit Maßen aus der Figur, baue einen Blockout und teste ihn mit mindestens zwei Personen, die nichts darüber wissen. Abgeben würde ich Blockout, Draufsicht mit Weg und Hinweisen, Protokoll und eine ehrliche Liste offener Punkte.
    tags: [karriere, designtest]
    level: 2
  - id: zusammenarbeit-art
    q: Ein Environment Artist will einen Durchgang mit Pflanzen zuwachsen lassen, weil es schöner aussieht. Was tust du?
    a: |
      Ich zeige ihm, welche Aufgabe der Durchgang hat und was der Test im Blockout gezeigt hat. Dann suchen wir eine Fassung, die beides schafft, etwa Pflanzen am Rand und eine freie, helle Mitte. Wenn wir uneinig bleiben, testen wir beide Fassungen mit neuen Leuten und entscheiden nach dem Verhalten.
    tags: [karriere, zusammenarbeit]
    level: 2
  - id: lieblingslevel
    q: Welches Level aus einem anderen Spiel hast du zuletzt genau gelesen, und was hast du gelernt?
    a: |
      Die Antwort ist persönlich. Eine gute Antwort nennt Spiel und Stelle, beschreibt einen Hinweis konkret, etwa „der einzige beleuchtete Durchgang im ersten Raum“, sagt, was der eigene Weg war, und was man daraus für eigene Abschnitte übernommen hat. Allgemeines Lob wie „das Level ist einfach gut gemacht“ zeigt nichts.
    tags: [karriere, analyse]
    level: 1
