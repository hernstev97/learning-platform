id: level-design
title: "Level-Design: Orientierung & Exploration"
short: Level-Design
tagline: Kleine begehbare Räume, in denen Spieler finden, was du ihnen zeigen willst.
description: >
  Komposition und Blickführung in der Draufsicht, Wege, Landmarken und Sichtlinien, Maßstab und
  Freiflächen, Einführung und Variation von Möglichkeiten, Rhythmus, Umgebung als Information,
  Blockout mit einfachen Formen und Playtests, in denen du zusiehst statt zu erklären. Du lernst an
  veröffentlichten Spielen und an eigenen kurzen Abschnitten. Jedes Layout, jeder Ort und jede
  Entscheidung ist deine; eine KI darf Skripte und Projektgerüst liefern, aber keine Level oder Karten.
  Module mit der Marke „Unterwegs“ gehen ganz am Handy, Skizzen auf Papier inklusive. „Am PC“ braucht
  Godot 4 am Rechner; lesen kannst du diese Lektionen auch unterwegs.
color: "#8EE06B"
order: 15
outcomes:
  - Du **liest Level veröffentlichter Spiele**, trennst Gesehenes von Gedeutetem und beschreibst Absicht, Hinweise und Spielerverhalten eines Abschnitts.
  - Du lenkst den Blick in der **Draufsicht** mit Kontrast, Rahmung, Linien und Bildausschnitt und rechnest aus, was ein Bildschirm zeigt.
  - Du baust **Orientierung** aus Wegen, Kanten, Knoten, Bereichen und Landmarken, setzt Sichtlinien und Schleifen bewusst und erkennst, wo sich Spieler unbeabsichtigt verlaufen.
  - Du legst **Maßstab und Dichte** aus den Werten deiner Spielfigur fest und nutzt Enge und Weite, Freiflächen und Rhythmus für deine Absicht.
  - Du **führst Möglichkeiten ein**, lässt sie sicher erproben und variierst sie, und du nutzt die Umgebung als Information, ohne jeden Schritt zu markieren.
  - Du baust einen **Blockout** in Godot mit Platzhalter-Tiles und getrennten Ebenen und hältst ihn getrennt von der späteren Ausgestaltung.
  - Du **beobachtest Playtests**, ohne zu erklären, zeichnest Wege auf, vergleichst sie mit deiner Absicht und überarbeitest gezielt eine Stelle nach der anderen.
tracks:
  - title: Räume lesen
    description: Ein Level als Absicht, Hinweis und Verhalten lesen, Blickführung in der Draufsicht, Orientierung mit Landmarken und Sichtlinien, Maßstab und Dichte.
    modules: [raum-lesen, blickfuehrung, orientierung, massstab-dichte]
  - title: Spielen lassen
    description: Möglichkeiten einführen und variieren, einen Rhythmus aus Bewegung, Beobachtung, Entdeckung und Begegnung bauen, die Umgebung informieren und erzählen lassen.
    modules: [einfuehren-variieren, rhythmus, umgebung-informiert]
  - title: Planen, bauen, beobachten
    description: Absicht notieren und auf Papier skizzieren, am PC einen Blockout in Godot bauen, Playtests planen, durchführen und Wege aufzeichnen.
    modules: [absicht-skizze, blockout, playtest-methode, playtest-godot]
  - title: Überarbeiten und ausgestalten
    description: Aus Beobachtungen Änderungen ableiten, den getesteten Blockout ausgestalten, ohne Hinweise zu verlieren, und zum Schluss einen eigenen Abschnitt vollständig durchlaufen.
    modules: [ueberarbeiten, ausgestaltung, werkstatt-abschnitt]
