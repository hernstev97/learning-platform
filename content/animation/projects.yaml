projects:
  - id: bewegungstagebuch
    title: Bewegungstagebuch für unterwegs
    level: 1
    hours: 6
    summary: Zwei Wochen lang beobachtest du Bewegungen im Alltag und in Clips, zählst Bilder, findest Schlüsselposen und hältst je Eintrag einen Thumbnail-Streifen auf Papier fest – zum Schluss fasst du zusammen, welche Muster du gefunden hast.
    brief: |
      **Ausgangslage:** Wer Bewegung aus dem Gedächtnis zeichnet, zeichnet, was er zu wissen glaubt. Dieses Projekt baut dir ein Archiv aus echten Beobachtungen, das du später bei jeder eigenen Animation aufschlägst. Es geht ganz unterwegs: Handy, ein kleines Heft, ein Bleistift.

      **Anforderungen:**

      - Zehn Einträge über mindestens zwei Wochen verteilt. Mindestens fünf stammen aus eigenen Aufnahmen (Menschen, Tiere, Gegenstände), die übrigen aus Clips veröffentlichter Spiele oder aus gemeinfreien Bildreihen wie den Tafeln von Muybridge.
      - Jeder Eintrag nennt Quelle, Bildrate und Länge, die Bildnummern der Schlüsselposen, die Dauer zwischen ihnen und eine Beobachtung zu Timing, Spacing, Gewicht oder Überlappung.
      - Zu jedem Eintrag gehört ein Streifen mit drei bis sechs Thumbnails auf Papier. Ins Tagebuch kommen ein Foto davon und deine Notizen.
      - Eine Zusammenfassung auf einer Seite: drei Muster, die in mehreren Einträgen auftauchen, mit Verweis auf die Einträge.

      **Rahmen:** Grundlage sind [Bewegung beobachten und in Schlüsselposen zerlegen](/animation/beobachten-schluesselposen), [Timing und Spacing](/animation/timing-spacing) und [Bögen, Nachziehen und Überlappung](/animation/boegen-ueberlappung). Fremde Aufnahmen verlinkst du nur, du lädst sie nicht neu hoch. Personen filmst du nur mit ihrem Einverständnis.
    skills: [beobachten, referenz, schluesselposen, timing, thumbnails]
    steps:
      - id: heft-anlegen
        title: Heft und Vorlage anlegen
        detail: |
          Leg eine Vorlage für Einträge an: Datum, Quelle, Bildrate, Länge, Keys mit Bildnummern, Dauer zwischen den Keys, Beobachtung, Foto des Thumbnail-Streifens. Halte sie so knapp, dass du sie im Bus ausfüllen kannst.
      - id: erste-aufnahme
        title: Erste eigene Aufnahme
        detail: |
          Film eine einfache Bewegung, etwa jemanden, der aufsteht oder eine Tasche hebt, mit Zeitlupe, wenn dein Handy sie hat. Geh die Aufnahme Bild für Bild durch und notiere die Keys.
      - id: thumbnails
        title: Thumbnails zum ersten Eintrag
        detail: |
          Zeichne drei bis sechs kleine Strichfiguren, eine pro Key, mit Handlungslinie. Keine Details, höchstens eine Minute pro Figur.
      - id: zehn-eintraege
        title: Zehn Einträge sammeln
        detail: |
          Verteil die Einträge über zwei Wochen. Wechsle bewusst zwischen schwer und leicht, schnell und langsam, Mensch, Tier und Gegenstand.
      - id: clips-vergleichen
        title: Zwei Clips aus Spielen vergleichen
        detail: |
          Wähle zwei Clips veröffentlichter Spiele mit einer ähnlichen Bewegung, etwa zwei Sprünge. Notiere bei beiden die Bildzahl bis zur ersten deutlichen Pose und die Haltezeiten.
      - id: muster-finden
        title: Muster finden und zusammenfassen
        detail: |
          Lies alle Einträge und such drei Beobachtungen, die mehrmals vorkommen. Schreib sie auf einer Seite auf, jeweils mit den Einträgen, die sie belegen.
    acceptance:
      - id: zehn-mit-quelle
        text: Zehn Einträge, jeder mit Quelle, Bildrate, Länge und Bildnummern der Schlüsselposen.
      - id: eigene-aufnahmen
        text: Mindestens fünf Einträge beruhen auf eigenen Aufnahmen.
      - id: thumbnails-zu-jedem
        text: Zu jedem Eintrag gibt es ein Foto eines eigenen Thumbnail-Streifens mit drei bis sechs Posen.
      - id: drei-muster
        text: Die Zusammenfassung nennt drei Muster, jedes mit Verweis auf mindestens zwei Einträge.
    stretch:
      - Ein Eintrag mit einer Aufnahme bei 120 oder 240 Bildern pro Sekunde, in der du eine Bewegung findest, die du bei normaler Bildrate nicht gesehen hast.
      - Ein Eintrag, der dieselbe Bewegung zweimal zeigt, einmal leicht und einmal mit Last.
    portfolio: |
      Ein Bewegungstagebuch zeigt, dass du von Beobachtung ausgehst, nicht von Formeln. In ein Portfolio gehören zwei, drei Seiten daraus neben der Animation, die aus ihnen entstanden ist. Im Gespräch fragen Animatoren oft, wie du Referenz sammelst und wie du sie nutzt, ohne abzupausen; das Tagebuch ist die Antwort.

  - id: studienreihe
    title: Studienreihe Ball, Mehlsack und Pendel
    level: 2
    hours: 10
    summary: Drei neutrale Studien im Editor, jede in mindestens zwei Varianten mit genau einer geänderten Größe, mit Bildlisten, Beobachtungstests und einem Studienblatt, das Absicht, Variante und Wahrnehmung nebeneinanderstellt.
    brief: |
      **Ausgangslage:** Bevor eine eigene Figur sich bewegt, lohnt sich das Handwerk an Gegenständen ohne Gesicht. Ein Ball zeigt Timing, Spacing und Material, ein Mehlsack Gewicht und Haltung, ein Pendel mit angehängtem Teil Überlappung. Weil sie neutral sind, siehst du an ihnen, was die Bewegung allein leistet.

      **Anforderungen:**

      - Drei Studien: ein Ball, der fällt und mehrmals abprallt, ein Mehlsack, der springt oder landet, und ein Pendel mit einem angehängten Teil, das nachschwingt.
      - Jede Studie in mindestens zwei Varianten. Zwischen zwei Varianten änderst du genau eine Größe, etwa Haltezeit, Spacing, Größe der Antizipation oder Material.
      - Zu jeder Variante eine Bildliste mit Dauern in Millisekunden und Ticks und ein Absichtssatz.
      - Für jede Studie ein Beobachtungstest mit mindestens einer anderen Person: Antworten wörtlich, ohne Vorrede gezeigt.
      - Ein Studienblatt (Markdown oder PDF), das je Studie Absicht, Varianten, geänderte Größe und Beobachtungen nebeneinanderstellt.

      **Rahmen:** Am PC mit Pixelorama, LibreSprite, Krita oder Aseprite ([Einzelbilder im Editor](/animation/editor-zeitleiste)). Grundlage sind [Neutrale Studien in Varianten](/animation/werkstatt-studien), [Gewicht zeigen](/animation/gewicht-aufprall) und [Bögen, Nachziehen und Überlappung](/animation/boegen-ueberlappung). Jede Zeichnung ist deine; eine KI darf höchstens Export-Befehle oder ein Skript für das Studienblatt beisteuern.
    skills: [timing, spacing, gewicht, ueberlappung, varianten, beobachtungstest, editor]
    steps:
      - id: absichten
        title: Absichtssätze schreiben
        detail: |
          Schreib für jede der drei Studien einen Absichtssatz, bevor du zeichnest. Halte darin fest, was ein Zuschauer lesen soll, nicht wie du es zeichnest.
      - id: ball
        title: Ball in zwei Materialien
        detail: |
          Animiere den Ball mit derselben Fallhöhe als zwei Materialien. Ändere dabei nur eine Größe zwischen den Varianten und notiere, welche.
      - id: sack
        title: Mehlsack mit Antizipation
        detail: |
          Animiere den Sack mit einer kleinen und einer großen Antizipation vor dem Sprung oder einem kurzen und einem langen Ausschwingen nach der Landung.
      - id: pendel
        title: Pendel mit Nachschwingen
        detail: |
          Animiere ein Pendel mit einem angehängten Teil, das ein bis zwei Bilder versetzt folgt. Prüf mit Onion Skinning, ob alle Teile auf Bögen laufen.
      - id: bildlisten
        title: Bildlisten und Ticks
        detail: |
          Schreib zu jeder Variante die Bildliste mit Dauern in ms und Ticks. Prüf, ob die Dauern auf ganzen Ticks aufgehen ([Timing und Spacing](/animation/timing-spacing)).
      - id: beobachten
        title: Beobachtungstests
        detail: |
          Zeig jeder Person die Varianten ohne Vorrede in Schleife und frag nur „Was passiert da?“. Notiere die Antworten wörtlich, bevor du etwas erklärst.
      - id: studienblatt
        title: Studienblatt zusammenstellen
        detail: |
          Stell je Studie Absicht, Varianten, geänderte Größe und Beobachtungen nebeneinander. Notiere, wo die Beobachtung deiner Absicht widerspricht.
    acceptance:
      - id: drei-studien
        text: Drei Studien liegen vor, jede in mindestens zwei Varianten, als Quelldatei und als Export.
      - id: eine-groesse
        text: Zwischen zwei Varianten derselben Studie unterscheidet sich genau eine benannte Größe.
      - id: bildlisten-ticks
        text: Jede Variante hat eine Bildliste mit Dauern in ms und Ticks.
      - id: beobachtung-woertlich
        text: Für jede Studie gibt es mindestens einen Beobachtungstest mit wörtlich notierten Antworten.
      - id: eigene-bilder
        text: Alle Bilder hast du selbst gezeichnet; keines stammt aus einem Bildgenerator oder ist abgepaust.
    stretch:
      - Eine dritte Variante je Studie, die eine zweite Größe untersucht.
      - Den Ball zusätzlich in der Draufsicht mit Schatten am Boden.
    portfolio: |
      Eine Studienreihe mit Varianten zeigt, dass du Wirkung gezielt erzeugst und prüfst. Zeig im Portfolio die Varianten nebeneinander als GIF in Originalgröße und ganzzahlig vergrößert, dazu das Studienblatt. In Art-Tests werden Ball und Mehlsack oft gefragt, weil sie ohne Zeichenstil zeigen, ob jemand Timing beherrscht.

  - id: zyklen-und-wechsel
    title: Zyklen und Zustandswechsel mit der Gliederpuppe
    level: 2
    hours: 12
    summary: Eine neutrale Gliederpuppe bekommt einen Ruhezyklus, einen Gehzyklus und einen Halt; im Prüfstand in Godot prüfst du Schleifen, Übergänge und Lesbarkeit in Originalgröße und dokumentierst eine Überarbeitung.
    brief: |
      **Ausgangslage:** Im Spiel stehen Animationen nie allein. Ein Zyklus läuft hundertmal, und jeder Wechsel kann aus jedem Bild kommen. Dieses Projekt übt das mit einer Figur, über die du nicht nachdenken musst: einer Gliederpuppe aus Kopf, Rumpf und Gliedern, 16 bis 32 Pixel hoch.

      **Anforderungen:**

      - Ein Ruhezyklus mit zwei bis sechs Bildern, ein Gehzyklus mit vier bis acht Bildern und ein Halt, der vom Gehen in die Ruhe führt.
      - Alle drei in SpriteFrames in Godot 4.7, abgespielt im Prüfstand aus [In der Testszene prüfen](/animation/testszene).
      - Ein Prüfprotokoll mit Lesbarkeit bei Zoom 1 vor drei Grautönen, allen Übergängen aus jedem Bild und den Zeiten aus dem Log.
      - Eine dokumentierte Überarbeitung (Fassung 1 → Fassung 2) an der Stelle, die im Prüfstand am stärksten springt oder stolpert.

      **Rahmen:** Grundlage sind [Gehen und Laufen in wenigen Bildern](/animation/gehen-laufen), [Form und Proportionen halten](/animation/form-konstanz) und [Körpersprache und Zustandswechsel](/animation/koerpersprache). Import und SpriteFrames stehen in [Eigene Sprites importieren](/godot/sprites-importieren) und [Animationen zuordnen](/godot/animationen). Das Skript des Prüfstands ist technisches Gerüst und darf von einer KI stammen; die Bilder zeichnest du.
    skills: [zyklen, uebergaenge, konstanz, godot, spriteframes, pruefprotokoll]
    steps:
      - id: puppe-modellblatt
        title: Gliederpuppe und Modellblatt
        detail: |
          Leg die Puppe mit Hilfslinien für Kopf, Schultern, Hüfte und Füße an. Diese Höhen gelten in jedem Bild.
      - id: ruhe
        title: Ruhezyklus
        detail: |
          Zwei bis sechs Bilder mit kleiner Bewegung. Prüf in der Schleife, ob man den Übergang vom letzten zum ersten Bild sieht.
      - id: gehen
        title: Gehzyklus
        detail: |
          Vier bis acht Bilder mit Kontakt, Tiefpunkt, Passing und Hochpunkt, so viele du davon brauchst. Prüf Bögen und Konstanz mit Onion Skinning.
      - id: halt
        title: Halt vom Gehen in die Ruhe
        detail: |
          Zeichne einen Halt, der in die erste Ruhepose führt. Entscheide, aus welchem Bild des Zyklus er beginnt, und notiere es.
      - id: in-godot
        title: In Godot einrichten
        detail: |
          Exportiere, importiere und leg SpriteFrames mit den Dauern aus deinen Bildlisten an. Prüf die Umrechnung in FPS und Frame-Dauer.
      - id: pruefen
        title: Im Prüfstand prüfen
        detail: |
          Lesbarkeit bei Zoom 1, alle Übergänge aus jedem Bild, Zeiten aus dem Log. Füll das Prüfprotokoll aus.
      - id: ueberarbeiten
        title: Eine Überarbeitung
        detail: |
          Wähl den stärksten Befund, ändere genau eine Sache und speichere sie als Fassung 2. Prüf neu und halt das Ergebnis im Überarbeitungsprotokoll fest.
    acceptance:
      - id: drei-animationen
        text: Ruhezyklus, Gehzyklus und Halt laufen im Prüfstand mit Godot 4.7 ohne Hinweis oder Fehler in der Ausgabe.
      - id: modellblatt
        text: Ein Modellblatt mit Hilfslinien liegt vor, und alle Bilder halten die Höhen ein oder weichen begründet ab.
      - id: protokoll-uebergaenge
        text: Das Prüfprotokoll nennt für jeden Übergang mindestens ein Ausgangsbild mit Befund und die Zeiten aus dem Log.
      - id: fassung-zwei
        text: Fassung 1 und Fassung 2 liegen getrennt vor; das Überarbeitungsprotokoll nennt Befund, Änderung, Grund und Ergebnis.
      - id: eigene-zeichnungen
        text: Alle Bilder hast du selbst gezeichnet; nur Skripte und Export-Befehle dürfen von einer KI stammen.
    stretch:
      - Ein Gehzyklus in zwei weiteren Blickrichtungen, mit Notiz, wo Spiegeln reicht.
      - Ein Anlauf vom Stand ins Gehen.
    portfolio: |
      Zyklen und Übergänge sind der Alltag eines Spielanimators. Zeig im Portfolio ein Video aus dem Prüfstand mit sichtbarer Anzeige, dazu die Tabelle der Übergänge und das Vorher-Nachher der Überarbeitung. Im Gespräch zeigt das, dass du weißt, wo Schleifen im Spiel brechen.

  - id: abschluss-animationstest
    title: "Abschlussprojekt: Animationstest für ein kleines Studio"
    capstone: true
    level: 3
    hours: 35
    summary: Ein kleines Studio schickt dir einen Animationstest. Du animierst eine eigene Figur mit einem kleinen Satz aus Ruhe, Fortbewegung, einer Aktion und einem Zustandswechsel, überarbeitest eine Animation zweimal dokumentiert, prüfst alles im Prüfstand in Godot und lieferst Quelldateien, Sprite-Sheet, Bildlisten und Protokolle. Jede Zeichnung und jede gestalterische Entscheidung ist deine.
    brief: |
      ## Auftrag

      Mira Hoffmann leitet ein Indie-Studio mit vier Leuten in Köln. Das Team baut ein Actionspiel in der Draufsicht mit Pixelart und Godot 4.7. Für die Stelle „Pixel Animator (m/w/d)“ schickt sie dir einen Animationstest. Ihre Lage:

      - Die bisherigen Animationen sehen als GIF gut aus, wirken im Spiel aber steif, und niemand kann sagen, ob es an den Zeichnungen, am Timing oder an der Einbindung liegt.
      - Die Programmierer brauchen Sprite-Sheets und Dauern, die sie ohne Rückfrage einbinden können.
      - Mira will sehen, wie du arbeitest, nicht nur ein Ergebnis: wie du planst, prüfst und überarbeitest.

      Welche Figur du animierst und welche Bewegungen sie bekommt, gibt dir niemand vor. Wenn du willst, ist sie eine Figur aus Project Delicate Flower; der Kurs schlägt dafür nichts vor.

      ## Was du lieferst

      1. **Vier Animationen einer eigenen Figur** in einer Blickrichtung (weitere Richtungen sind Zusatz): ein Ruhezyklus, eine Fortbewegung als Zyklus, eine Aktion mit Antizipation und Erholung und ein Zustandswechsel deiner Wahl.
      2. **Quelldateien** deines Editors (`.aseprite`, `.pxo`, `.kra` oder `.ase`), jede Fassung als eigene Datei oder eigener Commit.
      3. **Export:** ein Sprite-Sheet in Originalgröße mit einer Zeile pro Animation und gleich großen Feldern, dazu GIFs bei Zoom 1 und bei ganzzahliger Vergrößerung.
      4. **`BILDLISTEN.md`:** je Animation die Bildliste mit Pose, Dauer in ms und Ticks, Loop ja oder nein, und die Umrechnung in FPS und Frame-Dauer für Godot.
      5. **`UEBERARBEITUNG.md`:** für eine der vier Animationen zwei dokumentierte Überarbeitungen (Fassung 1 → 2 → 3) mit Absichtssatz, Beobachtung, Änderung, Grund und Ergebnis.
      6. **`PRUEFUNG.md`:** das Prüfprotokoll aus dem Prüfstand mit Lesbarkeit, Übergängen, Zeiten aus dem Log und Ton-Bildern, dazu die Beobachtungstests. Korrekturen nach dem Prüfstand stehen hier unter Entscheidung und Ergebnis, nicht in `UEBERARBEITUNG.md`.
      7. **Ein Video** von höchstens 90 Sekunden aus dem Prüfstand mit sichtbarer Anzeige.

      ## Technischer Rahmen

      Godot 4.7 mit dem Prüfstand aus [In der Testszene prüfen](/animation/testszene), 60 Physik-Ticks pro Sekunde, scharfe Pixel und ganzzahlige Skalierung. Editor nach deiner Wahl: Pixelorama, LibreSprite, Krita oder Aseprite. Skripte, Export-Befehle und das technische Gerüst darf eine KI schreiben. Jede Zeichnung, Pose, Animation und jedes Asset ist deine Arbeit; generierte Bilder oder Animationen sind weder Vorlage noch Ersatz.

      Grundlage sind alle Module dieses Bereichs, besonders [Timing und Spacing](/animation/timing-spacing), [Antizipation, Aktion, Erholung](/animation/antizipation-erholung), [Gehen und Laufen](/animation/gehen-laufen), [Körpersprache und Zustandswechsel](/animation/koerpersprache), [Form und Proportionen halten](/animation/form-konstanz), [Animation im Spiel](/animation/animation-im-spiel), [Eine eigene Figur, zwei Überarbeitungen](/animation/werkstatt-figur) und [In der Testszene prüfen](/animation/testszene).
    skills: [animation, timing, gewicht, zyklen, uebergaenge, godot, spriteframes, ueberarbeitung, beobachtungstest, dokumentation]
    steps:
      - id: figur-und-absicht
        title: Figur wählen und Absichtssätze schreiben
        detail: |
          Wähle eine eigene Figur, die du schon gezeichnet hast, und leg ein Modellblatt mit Hilfslinien an. Schreib für jede der vier Animationen einen Absichtssatz, bevor du eine Pose zeichnest.
      - id: referenz
        title: Referenz sammeln
        detail: |
          Film oder such Referenz zu jeder Bewegung und notiere Keys und Dauern wie im [Bewegungstagebuch](/animation/projekte/bewegungstagebuch). Referenz ist Beobachtung, keine Vorlage zum Abpausen.
      - id: thumbnails-keys
        title: Thumbnails und Keys
        detail: |
          Plane jede Animation in Thumbnails auf Papier, dann zeichne nur die Keys im Editor und gib ihnen Dauern. Das ist der Posentest, gespeichert als `-v1-keys` wie in [Eine eigene Figur, zwei Überarbeitungen](/animation/werkstatt-figur).
      - id: frueh-pruefen
        title: Keys früh im Prüfstand
        detail: |
          Bring den Posentest in den Prüfstand. Prüf Lesbarkeit bei Zoom 1 und die Zeit bis zur Erkennungspose der Aktion, bevor du Zwischenbilder zeichnest.
      - id: ausarbeiten
        title: Breakdowns und Zwischenbilder
        detail: |
          Arbeite die Animationen mit Breakdowns und Zwischenbildern aus und speichere sie als Fassung 1. Prüf Bögen, Spacing und Konstanz mit Onion Skinning.
      - id: beobachtung-eins
        title: Erster Beobachtungstest
        detail: |
          Zeig die Animationen mindestens einer Person ohne Vorrede, im Prüfstand mit fremder Hand an der Tastatur. Notiere die Antworten wörtlich.
      - id: ueberarbeitung-eins
        title: Erste Überarbeitung
        detail: |
          Wähl eine Animation und den stärksten Befund. Ändere eine Sache, speichere Fassung 2 und protokolliere Grund und Ergebnis.
      - id: ueberarbeitung-zwei
        title: Zweite Überarbeitung
        detail: |
          Zweiter Beobachtungstest mit einer anderen Person, dann Fassung 3 derselben Animation, wieder mit Protokoll.
      - id: uebergaenge
        title: Alle Übergänge prüfen
        detail: |
          Löse jeden Wechsel aus jedem Bild aus, prüf Sprünge in Export, Ursprung und Zeichnung und halte die Befunde im Prüfprotokoll fest.
      - id: einbindung
        title: Für die Programmierer aufbereiten
        detail: |
          Sprite-Sheet, Bildlisten mit FPS und Frame-Dauer, markierte Ton-Bilder. Prüf, ob jemand anderes die Animationen allein mit diesen Dateien einbinden könnte.
      - id: abgabe
        title: Abgabe zusammenstellen
        detail: |
          Video, Dateien und ein README mit Editor, Godot-Version und Startanleitung des Prüfstands. Lies alles einmal als Mira Hoffmann.
    acceptance:
      - id: vier-animationen
        text: Ruhe, Fortbewegung, eine Aktion und ein Zustandswechsel laufen im Prüfstand mit Godot 4.7 ohne Hinweis oder Fehler in der Ausgabe.
      - id: sheet-originalgroesse
        text: Das Sprite-Sheet ist in Originalgröße, alle Felder sind gleich groß, und die Figur springt beim Wechsel zwischen den Animationen nicht durch Export oder Ursprung.
      - id: bildlisten-vollstaendig
        text: "`BILDLISTEN.md` nennt für jede Animation Posen, Dauern in ms und Ticks, Loop und die Werte für SpriteFrames; die Werte im Projekt stimmen damit überein."
      - id: zwei-ueberarbeitungen
        text: "Für eine Animation liegen Fassung 1, 2 und 3 getrennt vor, und `UEBERARBEITUNG.md` nennt je Schritt Absichtssatz, Beobachtung, Änderung, Grund und Ergebnis."
      - id: beobachtungstests
        text: Mindestens zwei Beobachtungstests mit verschiedenen Personen sind wörtlich protokolliert und mit den Absichtssätzen verglichen.
      - id: pruefprotokoll
        text: "`PRUEFUNG.md` enthält Lesbarkeit bei Zoom 1 vor drei Grautönen, jeden Übergang mit Ausgangsbild und Befund und die Zeiten aus dem Log, gemessen mit Zeit 1,0."
      - id: eigene-arbeit
        text: Alle Zeichnungen, Posen und Animationen sind eigene Arbeit; Skripte und Export-Befehle, die von einer KI stammen, sind im README benannt.
    stretch:
      - Die Fortbewegung in vier oder acht Richtungen, mit Notiz, wo Spiegeln reicht und wo nicht.
      - Eine zweite Aktion mit deutlich anderem Gewicht und ein Vergleich im Beobachtungstest.
      - Ein Ton-Platzhalter auf den markierten Bildern, eingebunden nach [Audio zuordnen](/godot/audio).
    portfolio: |
      Das Projekt ist eine Fallstudie über Animation im Spiel: Absicht, Planung, Prüfung im Spieltakt, zwei Überarbeitungen mit Belegen. Zeig im Portfolio das Video aus dem Prüfstand, das Sprite-Sheet und Fassung 1 und 3 der überarbeiteten Animation nebeneinander, dazu die Beobachtungen, die zur Änderung geführt haben. Im Gespräch fragen Animatoren und Leads, welche Rückmeldung dich überrascht hat, wie du Lesbarkeit gegen Ausführlichkeit abwägst und wie du einem Programmierer eine Haltezeit erklärst.
