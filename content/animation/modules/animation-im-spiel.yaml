lesson: |
  Du hast eine Gliederpuppe gezeichnet, die auf Knopfdruck springt: Sie steht, geht in zwei Bildern in die Knie und hebt ab. Im Editor sieht das kräftig aus. Im Spiel drückst du die Taste, und eine Zehntelsekunde lang steht die Puppe da wie vorher. Abheben sieht man erst nach 300 ms, und jedes Mal fühlt es sich an, als hätte das Spiel deinen Druck zu spät bemerkt. Die Zeichnungen sind nicht falsch. Sie folgen den Regeln des Films, in dem der Zuschauer nur zusieht.

  Im Spiel ist der Zuschauer auch der, der die Figur steuert. Diese Lektion zeigt, wie Spielanimatoren zwischen ausführlicher Bewegung und direkter Steuerung abwägen, was das Spieltempo mit deinen Bildern macht, wo Übergänge und Unterbrechungen hingehören und wie du Bilder für einen Ton markierst. Gemessen wird später am PC, im Prüfstand aus [In der Testszene prüfen](/animation/testszene). Hier planst du auf Papier, was du dort prüfen willst.

  ## Steuerbarkeit gegen Ausführlichkeit

  Jonathan Cooper stellt in seinem Buch *Game Anim: Video Game Animation Explained* (2. Auflage 2021) den zwölf klassischen Prinzipien fünf eigene für Spiele zur Seite. Die Buchseite beschreibt das als „Reinterprets the classic 12 & sets out 5 new principles for great game animation“ ([Game Anim](https://www.gameanim.com/book/)). Auf seiner Website stehen die fünf mit ihren Unterpunkten ([The Five Fundamentals](https://www.gameanim.com/2020/04/04/the-five-fundamentals-of-video-game-animation/)):

  - **Feel:** Reaktion auf die Eingabe, Trägheit und Schwung, sichtbare Rückmeldung.
  - **Fluidity:** Übergänge, nahtlose Zyklen, Ausschwingen.
  - **Readability:** Posen für die Spielkamera, Silhouetten, Kollision und Schwerpunkt.
  - **Context:** Unterscheidbarkeit, Wiederholung, Platz auf dem Bildschirm.
  - **Elegance:** schlichter Aufbau, Wirkung pro Aufwand, gemeinsame Standards.

  Schon die Unterpunkte von Feel ziehen gegeneinander. Trägheit heißt: Ein Körper braucht Zeit, um loszulaufen und anzuhalten. Reaktion heißt: Der Spieler sieht sofort, dass sein Druck angekommen ist. Dan Root fasst in seinem Video zu Coopers Feel zusammen, dass man den Spieler nicht aussperren darf, die Figur aber trotzdem Gewicht behalten soll ([Game Animation Fundamentals: Feel](https://www.youtube.com/watch?v=Q-ZRKHOaAOw&t=70s), ab 1:10).

  David Rosen zeigt in seinem GDC-Vortrag von 2014 die beiden Pole. Bei Mario setzt die Eingabe fast direkt die Beschleunigung. In Prince of Persia schieben die rotoskopierten Übergänge Zeit zwischen Druck und Bewegung ([An Indie Approach to Procedural Animation](https://www.youtube.com/watch?v=LNidsMesxSE&t=55s), ab 0:55). Für seine eigenen Spiele formuliert er eine Grundregel: Die Animation darf dem Spiel zuerst einmal nicht schaden ([ab 4:21](https://www.youtube.com/watch?v=LNidsMesxSE&t=261s)). Tyriq Plummer sagt es in seinem Einführungsvortrag ähnlich: Animation im Spiel soll dem Spiel dienen und es nicht übergehen. Aktionen der Spielfigur bekommen bei ihm höchstens ein bis zwei Bilder Ausholen, oft gar keines ([2D Animation for Games: A Primer](https://www.youtube.com/watch?v=PKZJmHrG4Yw&t=949s), ab 15:49).

  Pixelartists sagen dasselbe in ihren Tutorials. Pedro Medeiros (Saint11) zu einem Angriff: „It's important that there's no anticipation frame or players will feel input lag“ ([Attack Sheet](https://saint11.art/blog/pixel-art-tutorials/#AttackSheet)). Raymond Schlitter (Slynyrd) nennt den Preis der anderen Seite: „The longer and more dramatic the wind up, the more impactful a strike can feel, but results in more input delay in the context of gameplay“ ([Pixelblog 56](https://www.slynyrd.com/blog/2025/5/23/pixelblog-56-top-down-character-attack-animation)).

  Bei Gegnern dreht sich die Rechnung um. Mariel Cartwright beschreibt für Skullgirls, dass die Bewegungen des Spielers fast sofort reagieren, Gegner dagegen lange ausholen, damit der Spieler reagieren kann ([Making Fluid and Powerful Animations For 'Skullgirls'](https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=193s), ab 3:13). Wie Wind-up, aktive Phase und Erholung als Spielmechanik zusammenhängen, steht in [Anatomie eines Angriffs](/combat/angriffsphasen). Wie viel Verzögerung ohnehin zwischen Daumen und Bildschirm liegt, steht in [Eingabe](/combat/eingabe).

  > [!MERKE]
  > Was der Spieler auslöst, zeigt sich im ersten Bild. Was der Spieler lesen und beantworten soll, darf sich ankündigen.

  ## Das erste Bild nach der Eingabe

  Für eine Aktion der Spielfigur zählen zwei Zeitpunkte. Wann sieht der Spieler das erste Bild, das sich von der Ruhe unterscheidet? Und wann sieht er die Pose, an der man erkennt, was die Figur tut, die **Erkennungspose**? Zwei Pläne für den Sprung der Gliederpuppe:

  ```text
  Plan A
  Bild  Dauer   Pose
   1    100 ms  Stand (wie Ruhe)
   2    100 ms  Knie halb
   3    100 ms  Hocke tief
   4     50 ms  Absprung
   5    150 ms  Luft
  ```

  ```text
  Plan B
  Bild  Dauer   Pose
   1     50 ms  Hocke tief
   2     50 ms  Absprung
   3    150 ms  Luft
  ```

  Das Spiel zeigt jedes Bild ab einem bestimmten Tick, gezählt ab dem Druck. Ein Tick ist 1/60 Sekunde ([Timing und Spacing](/animation/timing-spacing)). Das kleine Modell rechnet für jedes Bild aus, in welchem Tick es beginnt:

  ```python run
  a = [100, 100, 100, 50, 150]
  b = [50, 50, 150]

  def ab_tick(ms):
      t, s = 0, []
      for d in ms:
          s.append(t*60//1000)
          t += d
      return s

  print("A", ab_tick(a))
  print("B", ab_tick(b))
  ```

  In Plan A unterscheidet sich erst Bild 2 von der Ruhe, nach 6 Ticks oder 100 ms. Den Absprung sieht der Spieler nach 18 Ticks. In Plan B ändert sich das Bild sofort, und nach 3 Ticks hebt die Puppe ab. Dafür hat Plan B weniger Vorlauf: ein Bild Hocke mit 50 ms statt drei Bilder mit zusammen 300 ms vor dem Absprung.

  Zwei Wege bringen Ausholen und Reaktion zusammen. Sakurai lässt die Figur im Moment des Drucks weit in die Ausholpose springen, auch wenn der Übergang aus der Ruhe dadurch hart wird; die Einzelheiten stehen in [Anatomie eines Angriffs](/combat/angriffsphasen). Dan Root zeigt, wie ein Körperteil früh reagiert, etwa der Kopf, der sich schon dreht, während der Rest noch folgt ([Feel](https://www.youtube.com/watch?v=Q-ZRKHOaAOw&t=371s), ab 6:11). In beiden Fällen ist das erste Bild sichtbar anders als die Ruhe. Welcher Plan zu deiner Figur passt, entscheidest du. Die Rechnung sagt dir nur, wie lange der Spieler wartet.

  ## Spieltempo: Bilder, Ticks und Hitstop

  Im Editor bestimmt deine Bildliste allein, wie schnell etwas geht. Im Spiel bewegt außerdem der Code die Figur mit einer Geschwindigkeit über den Boden. Passt ein Laufzyklus nicht zu diesem Tempo, rutschen die Füße; die Rechnung dazu steht in [Animationen zuordnen](/godot/animationen). Rosen geht für seine Spiele den umgekehrten Weg: Die Laufanimation folgt der zurückgelegten Strecke, mit nur zwei Keys, Passing und weitestem Schritt, und kann deshalb nicht rutschen ([ab 5:29](https://www.youtube.com/watch?v=LNidsMesxSE&t=329s)). Ab 6:24 zeigt er außerdem, dass das Auf und Ab des Körpers bei schnellerem Laufen kleiner wird: Halbe Schrittzeit heißt ein Viertel der Fallhöhe. Das ist dieselbe Physik wie beim fallenden Ball.

  Timing ist im Spiel auch eine Stellschraube des Designs. Thomas Vasseur nimmt für Dead Cells als Beispiel eine Waffe, die zu stark ist und deshalb eine langsamere Angriffsanimation bekommen soll. Für solche Änderungen schreibt er: „If the timings are the issue, moving the keyframes in the timeline will do the trick.“ ([Art Design Deep Dive: Dead Cells](https://www.gamedeveloper.com/production/art-design-deep-dive-using-a-3d-pipeline-for-2d-animation-in-i-dead-cells-i-)). Wer Keys und Zwischenbilder sauber trennt, kann das Timing später ändern, ohne neu zu zeichnen.

  Bei einem Treffer halten viele Spiele für einige Frames an: Angreifer und Ziel frieren ein. Wie lange und mit welchem Zittern, steht in [Trefferfeedback](/combat/trefferfeedback). Für die Animation heißt das: Das Bild, das im **Hitstop** steht, sieht der Spieler länger als jedes andere Bild der Aktion. Sakurai beschreibt diese Pose als die, die im Gedächtnis bleibt ([Attack Poses](https://www.youtube.com/watch?v=99gdMDF7V2E&t=29s), ab 0:29). Cartwright erklärt, dass Treffer ohne dieses Einfrieren schwach und wässrig aussehen ([ab 12:43](https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=763s)). Medeiros hält in seinem Beispiel ein Bild vor dem Aufprall an und warnt: „Do not pause for too long“ ([Impact](https://saint11.art/blog/pixel-art-tutorials/#Impact)). Plan deshalb, welches Bild beim Treffer steht, und zeichne es als Key, nicht als Zwischenbild.

  Eine Figur in der Draufsicht ist klein, und bei kleinen Figuren gehen Bewegungen leicht unter; warum Sakurai deshalb übertreibt, steht in [Körpersprache und Zustandswechsel](/animation/koerpersprache). Ob eine Pose bei 1× lesbar bleibt, prüfst du im Prüfstand; zum Zusehen verlangsamst du dort das Spiel mit `Engine.time_scale` ([Bildrate und Simulation](/godot/bildrate-simulation)). Wie deine Figuren vor echten Level-Hintergründen bestehen, ist Stoff des späteren Kurses Leveldesign.

  ## Übergänge: Start, Stopp, Wende und Abbruch

  Coopers zweiter Grundsatz, Fluidity, handelt von den Stellen zwischen den Animationen. Jedes Übergangsbild kann eine Bewegung glaubwürdiger machen und kostet Ticks, in denen die Figur nicht tut, was der Spieler will. Zwei veröffentlichte Spiele haben das verschieden entschieden. Bei Owlboy fanden Leute, denen das Team die Demo zeigte, die Figur in Bewegung hölzern: Sie wechselte die Richtung sofort. Das Team ergänzte kleine Wendeanimationen, und die Figur bekam nach Aussage des Entwicklers etwas mehr Gewicht ([Owlboy, GDC 2017](https://www.youtube.com/watch?v=rOkq7fUdgYQ&t=574s), ab 9:34). Dead Cells geht in die andere Richtung. Schlägt der Spieler in die falsche Richtung, während ein Gegner hinter ihm steht, dreht das Spiel den Helden ohne Umweg um, und laut Sébastien Bénard bemerken Spieler das nicht ([Dead Cells, GDC 2019](https://www.youtube.com/watch?v=OfSpBoA6TWw&t=1129s), ab 18:49).

  Sakurai rät, schnell überzublenden, weil jedes zusätzliche Übergangsbild Schärfe kostet ([Animation Blending](https://www.youtube.com/watch?v=HYHajZ0wBfU&t=93s), ab 1:33). Rosen kommt mit zwei bis drei Keys pro Aktion aus, und jeder Übergang lässt sich sofort unterbrechen ([ab 18:00](https://www.youtube.com/watch?v=LNidsMesxSE&t=1080s)).

  Für deine Planung genügt eine **Animationsliste**. Sie hält für jede Animation fest, ob sie sich wiederholt, ab welchem Bild eine neue Eingabe sie abbrechen darf und was danach kommt:

  ```text
  Animation  Loop  Abbruch  danach
  ruhe       ja    sofort   –
  gehen      ja    sofort   ruhe
  sprung     nein  ab 4     landen
  landen     nein  ab 2     ruhe
  ```

  Drei Fragen helfen beim Ausfüllen. Wo ist der **Schleifenpunkt**? In einem Zyklus muss das letzte Bild ins erste übergehen, sonst springt die Figur bei jeder Wiederholung. Wo endet eine einmalige Aktion? Ihre letzte Pose sollte zu der Animation passen, die danach kommt; wie man Zustandswechsel lesbar macht, steht in [Körpersprache und Zustandswechsel](/animation/koerpersprache). Und ab welchem Bild darf der Spieler abbrechen? Das Abbruchfenster ist eine Entscheidung des Spieldesigns ([Anatomie eines Angriffs](/combat/angriffsphasen)). Die Animation folgt ihr: Die Pose in diesem Bild sollte schon aussehen, als könne die Figur jetzt etwas anderes tun.

  > [!PRAXIS] Vor, Mitte, Nach
  > Bei Klei Entertainment trugen Animationen Namen wie „knife pre“, „knife attack“ und „knife post“. An diesen Grenzen konnte die Zustandsmaschine des Spiels je nach Eingabe verzweigen ([2D Animation at Klei Entertainment](https://www.youtube.com/watch?v=8_KBjd0iaCU&t=442s), ab 7:22). Eine Aktion in Vorlauf, Hauptteil und Nachlauf zu schneiden, gibt dem Code Stellen zum Abbrechen und Weiterleiten, ohne dass du neu zeichnest.

  ## Ton: die Bilder markieren

  Ein Schritt klingt, wenn der Fuß aufsetzt, ein Aufprall, wenn der Körper den Boden trifft. Engines koppeln Töne deshalb an Bilder der Animation. In Unreal heißen solche Marken Notifies: „These events can be sounds (such as footsteps for walk or run animations)“ ([Animation Notifies](https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-notifies-in-unreal-engine#sound)). In Godot sendet ein AnimatedSprite2D bei jedem Bildwechsel das Signal `frame_changed` ([frame_changed](https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-signal-frame-changed)). Wie man daran einen Ton hängt, steht in [Audio zuordnen](/godot/audio).

  Deine Aufgabe als Animator ist hier nur, die Bilder zu markieren. In einem Gehzyklus mit acht Bildern sind das die beiden Kontaktbilder; die Phasen erklärt [Gehen und Laufen](/animation/gehen-laufen):

  ```text
  Bild  Phase      Ton
   1    Kontakt    Schritt
   2    Tiefpunkt
   3    Passing
   4    Hochpunkt
   5    Kontakt    Schritt
   6    Tiefpunkt
   7    Passing
   8    Hochpunkt
  ```

  Markier Bildnummern, keine Millisekunden. Änderst du später das Timing, wandert der Ton mit seinem Bild. Bei einem Treffer gehört der Ton in das Bild, in dem der Treffer zählt, nicht in das, in dem das Ausholen endet ([Trefferfeedback](/combat/trefferfeedback)). Wie die Töne klingen, wie laut sie sind und wie sie sich abwechseln, behandelt später der Kurs Sound.

  > [!INTERVIEW]
  > „Unsere Spielfigur sieht gut aus, fühlt sich aber träge an. Was schaust du dir an?“ Gute Antwort: Ich zähle die Ticks zwischen Eingabe und erstem veränderten Bild und bis zur Pose, an der man die Aktion erkennt. Steht vorn ein Bild, das wie die Ruhe aussieht, oder ein langes Ausholen, kürze ich es oder ersetze es durch eine starke erste Pose. Dann sehe ich mir Übergänge und Abbruchfenster an: Wie lange bindet jede Aktion die Figur, und welche Start-, Stopp- oder Wendeanimation hält den Spieler auf? Gewicht kann in Erholung und Nachschwingen bleiben. Jede Änderung messe ich im Spiel und lasse jemand anderen spielen, statt im Editor zu urteilen.

  ## Häufige Fehler

  - **Das erste Bild sieht aus wie die Ruhe.** Der Spieler wartet ein ganzes Bild lang auf nichts. Das erste Bild nach dem Druck zeigt eine sichtbare Änderung.
  - **Ausholen wie im Film.** Drei Bilder zu 100 ms vor einer Spieleraktion sind 18 Ticks Wartezeit. Für Gegner kann das richtig sein; für die Spielfigur zählst du nach.
  - **Übergänge für alles.** Start-, Stopp- und Wendeanimationen kosten jedes Mal Ticks. Leg für jede fest, ob sie den Spieler aufhalten darf.
  - **Nur die Schleife angesehen.** Eine Animation, die in sich rund läuft, kann beim Abbruch aus Bild 3 trotzdem springen.
  - **Zwischenbild im Hitstop.** Steht beim Treffer ein Wischbild still, sieht der Spieler den Weg statt der Pose.
  - **Ton in Millisekunden geplant.** Nach der nächsten Timing-Änderung sitzt er im falschen Bild. Markier Bildnummern.
  - **Gefühl behauptet.** Ob sich eine Figur schwer oder direkt anfühlt, sagt dir ein Mensch an der Tastatur, nicht der Editor.

  ## Zusammenfassung

  - Cooper stellt den zwölf Prinzipien fünf für Spiele zur Seite: Feel, Fluidity, Readability, Context, Elegance.
  - Reaktion und Trägheit ziehen gegeneinander. Was der Spieler auslöst, zeigt sich im ersten Bild; Gegner dürfen sich ankündigen.
  - Zähl zwei Zeitpunkte in Ticks ab dem Druck: das erste veränderte Bild und die Erkennungspose.
  - Im Spiel bewegt der Code die Figur. Zyklus und Tempo müssen zusammenpassen, und Timing ist auch eine Stellschraube des Designs.
  - Im Hitstop steht ein Bild länger als alle anderen. Plan dort einen Key.
  - Jede Animation bekommt in der Animationsliste Loop, Abbruch und Nachfolger. Jedes Übergangsbild kostet Ticks.
  - Töne markierst du als Bildnummern. Wie sie klingen, behandelt später der Kurs Sound.
exercises:
  - id: welcher-grundsatz
    type: choice
    title: Zu spät, aber wofür?
    prompt: |
      Ein Tester sagt über deine Figur: „Ich drücke, und sie reagiert zu spät.“ Zu welchem von Coopers fünf Grundsätzen gehört dieses Problem zuerst?
    options:
      - text: Feel
        correct: true
        why: Feel umfasst Reaktion auf die Eingabe, Trägheit und sichtbare Rückmeldung. Ein später erster Bildwechsel ist ein Problem der Reaktion.
      - text: Fluidity
        correct: false
        why: Fluidity betrifft Übergänge, Zyklen und Ausschwingen. Eine Startanimation kann die Ursache sein, das Symptom beschreibt aber die Reaktion.
      - text: Readability
        correct: false
        why: Lesbarkeit fragt, ob man Pose und Silhouette erkennt. Der Tester erkennt die Aktion, nur zu spät.
      - text: Elegance
        correct: false
        why: Elegance betrifft schlichten Aufbau und Wirkung pro Aufwand, nicht die Zeit bis zur Reaktion.
    explanation: |
      Coopers Feel bündelt Response, Inertia & Momentum und Visual Feedback. „Reagiert zu spät“ trifft den ersten Punkt. Die Ursache kann trotzdem in einem anderen Bereich liegen, etwa in einer langen Startanimation. Deshalb zählst du als Nächstes die Ticks bis zum ersten veränderten Bild.
    resources:
      - title: Game Anim · The Five Fundamentals
        url: https://www.gameanim.com/2020/04/04/the-five-fundamentals-of-video-game-animation/

  - id: quellen-richtig-lesen
    type: choice
    title: Was die Praktiker sagen
    prompt: |
      Welche Aussagen geben die Quellen der Lektion richtig wieder?
    options:
      - text: Saint11 verzichtet beim Angriff der Spielfigur auf ein Antizipationsbild, weil Spieler sonst Eingabeverzögerung spüren.
        correct: true
        why: So steht es auf seinem Attack Sheet, wörtlich mit „players will feel input lag“.
      - text: Cartwright gibt Gegnern in Skullgirls lange Wind-ups, damit der Spieler reagieren kann.
        correct: true
        why: Ab 3:13 trennt sie Spielerbewegungen, die fast sofort reagieren, von Gegnern, die lange ausholen.
      - text: Plummer gibt Aktionen der Spielfigur höchstens ein bis zwei Bilder Ausholen, oft keines.
        correct: true
        why: Das sagt er ab 15:49 in seinem Einführungsvortrag.
      - text: Slynyrd hält einen langen Wind-up für wirkungslos.
        correct: false
        why: Er schreibt das Gegenteil, ein längerer Wind-up könne wuchtiger wirken. Sein Einwand ist die längere Eingabeverzögerung.
      - text: Rosen empfiehlt rotoskopierte Übergänge, weil sie die Steuerung direkter machen.
        correct: false
        why: Rosen nennt die Übergänge in Prince of Persia als Beispiel für Verzögerung zwischen Druck und Bewegung.
    explanation: |
      Alle Quellen ziehen dieselbe Linie: Was der Spieler auslöst, reagiert sofort, was er beantworten soll, kündigt sich an. Slynyrd beschreibt den Preis ehrlich, Wucht gegen Verzögerung. Welche Seite du in deinem Spiel wählst, ist deine Entscheidung; die Quellen zeigen, worauf du dabei achtest.
    resources:
      - title: Saint11 · Attack Sheet
        url: https://saint11.art/blog/pixel-art-tutorials/#AttackSheet

  - id: vom-druck-bis-zur-ruhe
    type: order
    title: Was der Spieler nacheinander sieht
    prompt: |
      Bring die Momente einer Aktion der Spielfigur in die Reihenfolge, in der der Spieler sie sieht.
    lang: prose
    lines: |
      Der Spieler drückt die Taste.
      Das erste Bild, das sich sichtbar von der Ruhe unterscheidet, erscheint.
      Die Pose, an der man erkennt, was die Figur tut, erscheint.
      Der Höhepunkt der Aktion steht, bei einem Treffer im Hitstop gehalten.
      Die Erholung beginnt, die Figur fängt die Bewegung ab.
      Ab hier darf eine neue Eingabe die Erholung abbrechen.
      Die Figur ist zurück in Ruhe oder Bewegung.
    explanation: |
      Zwischen Druck und erstem veränderten Bild soll möglichst kein Tick liegen; das misst Feel. Die Erkennungspose kann mit dem ersten Bild zusammenfallen, kommt aber nie davor. Der Hitstop hält den Höhepunkt, danach beginnt die Erholung. Ein Abbruchfenster liegt in der Erholung und lässt den Spieler früher wieder handeln, als die Animation zu Ende wäre.
    resources:
      - title: Saint11 · Attack Sheet
        url: https://saint11.art/blog/pixel-art-tutorials/#AttackSheet

  - id: ticks-bis-zur-aenderung
    type: output
    title: Wie lange passiert nichts?
    prompt: |
      Bild 1 und 2 sehen aus wie die Ruhepose, erst Bild 3 zeigt eine Änderung. Nach wie vielen Ticks ab dem Druck erscheint Bild 3, bei 60 Ticks pro Sekunde? Antworte mit der Zahl.
    lang: text
    code: |
      Bild  Dauer   Pose
       1    100 ms  wie Ruhe
       2     50 ms  wie Ruhe
       3     50 ms  Knie gebeugt
       4    150 ms  Sprung
    expected: |
      9
    accept:
      - 9 Ticks
    explanation: |
      Bild 3 beginnt nach 100 + 50 = 150 ms, und 150 ms sind 150 × 60 / 1000 = 9 Ticks. So lange sieht der Spieler die Ruhe, obwohl die Aktion schon läuft. Die beiden ersten Bilder kosten Zeit, ohne etwas zu zeigen.
    resources:
      - title: Godot Docs · physics_ticks_per_second
        url: https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-physics-common-physics-ticks-per-second

  - id: ab-tick-vorhersagen
    type: output
    title: Ab welchem Tick?
    prompt: |
      Was gibt das Programm aus?
    lang: python
    code: |
      def ab_tick(ms):
          t, s = 0, []
          for d in ms:
              s.append(t*60//1000)
              t += d
          return s

      print(ab_tick([50,100,150,50]))
    expected: |
      [0, 3, 9, 18]
    explanation: |
      Jedes Bild beginnt, wenn alle Bilder davor abgelaufen sind. Bild 1 beginnt bei 0 ms, Bild 2 nach 50 ms (3 Ticks), Bild 3 nach 150 ms (9 Ticks), Bild 4 nach 300 ms (18 Ticks). Die Dauer des letzten Bildes taucht in der Liste nicht auf, weil nach ihm kein Bild mehr beginnt.

  - id: ton-bilder-lauf
    type: output
    title: Wo die Schritte klingen
    prompt: |
      Ein Laufzyklus mit sechs Bildern. Auf welche Bilder gehört ein Schrittton? Antworte mit den Nummern, etwa `2, 5`.
    lang: text
    code: |
      Bild  Phase
       1    Kontakt rechts
       2    Tiefpunkt
       3    Flug
       4    Kontakt links
       5    Tiefpunkt
       6    Flug
    expected: |
      1, 4
    accept:
      - 1,4
      - 1 4
      - 1 und 4
    explanation: |
      Ein Schritt ist zu hören, wenn ein Fuß aufsetzt, also in den Kontaktbildern 1 und 4. Im Tiefpunkt steht der Fuß schon und trägt das Gewicht, in der Flugphase berührt keiner den Boden. Weil du Bildnummern markierst, bleibt der Ton richtig, wenn du später die Dauern änderst.
    resources:
      - title: Unreal Engine · Animation Notifies, Sound
        url: https://dev.epicgames.com/documentation/en-us/unreal-engine/animation-notifies-in-unreal-engine#sound

  - id: begriffe-im-spiel
    type: gap
    title: Fünf Wörter für die Planung
    prompt: |
      Ergänze die fehlenden Wörter.
    lang: prose
    code: |
      Coopers Grundsatz für Reaktion, Trägheit und Rückmeldung heißt ⟦Feel⟧.
      Was der Spieler auslöst, zeigt sich im ⟦ersten⟧ Bild nach dem Druck.
      Beim Treffer friert der ⟦Hitstop⟧ eine Pose ein.
      In einem Zyklus muss das letzte Bild am ⟦Schleifenpunkt⟧ ins erste übergehen.
      Schrittgeräusche gehören auf die ⟦Kontaktbilder⟧.
    gaps:
      - label: Grundsatz
        hint: Der erste der fünf, englisch.
        accept: ["Gefühl"]
      - label: Welches Bild
        hint: Kein Bild davor darf aussehen wie die Ruhe.
        accept: ["1", "allerersten"]
      - label: Einfrieren
        hint: Englischer Begriff aus dem Trefferfeedback.
        accept: ["Hit-Stop", "Hit Stop", "Trefferstopp"]
      - label: Übergang im Zyklus
        hint: Die Stelle, an der die Wiederholung beginnt.
        accept: ["Loop-Punkt", "Looppunkt", "Schleifenübergang"]
      - label: Welche Bilder
        hint: Der Fuß setzt auf.
        accept: ["Kontakt-Bilder", "Kontakte", "Kontaktframes"]
    explanation: |
      Feel ist bei Cooper der Grundsatz für Reaktion und Gewicht. Das erste Bild nach dem Druck zeigt, dass die Eingabe ankam. Im Hitstop steht ein Bild länger als alle anderen, deshalb gehört dort ein Key hin. Am Schleifenpunkt entscheidet sich, ob ein Zyklus bei jeder Wiederholung springt, und die Kontaktbilder tragen den Schrittton.
    resources:
      - title: Game Anim · The Five Fundamentals
        url: https://www.gameanim.com/2020/04/04/the-five-fundamentals-of-video-game-animation/

  - id: ausweichsprung-wartet
    type: bug
    title: Erst passiert nichts
    prompt: |
      Eine Gliederpuppe soll auf Knopfdruck zur Seite springen. Testspieler sagen: „Ich drücke, und erst passiert nichts.“ Finde die Zeilen der Bildliste, die das verursachen.
    lang: text
    code: |
      Bild  Dauer   Pose
       1    100 ms  Stand wie in Ruhe
       2     50 ms  Stand wie in Ruhe
       3     50 ms  Knie gebeugt
       4     50 ms  Sprung zur Seite
       5    150 ms  Landung
    lines: [2, 3]
    hints:
      - Welches Bild ist das erste, das sich von der Ruhe unterscheidet?
    explanation: |
      Bild 1 und 2 zeigen dieselbe Pose wie die Ruhe. Der Spieler sieht 150 ms lang, also 9 Ticks, keine Reaktion auf seinen Druck. Bild 3 ist Ausholen, aber wenigstens sichtbar. Ob du die beiden Bilder streichst oder durch eine erste Pose ersetzt, die schon deutlich anders ist, entscheidest du; die Bildliste darf nur nicht mit Ruhe beginnen.
    resources:
      - title: Tyriq Plummer · GDC 2021 (ab 15:49)
        url: https://www.youtube.com/watch?v=PKZJmHrG4Yw&t=949s

  - id: schritt-in-der-luft
    type: bug
    title: Der Schritt klingt zur falschen Zeit
    prompt: |
      Ein Gehzyklus mit vier Bildern. Im Spiel ist der Schritt jedes Mal zu hören, wenn ein Bein gerade am anderen vorbeischwingt. Finde die Zeilen, in denen der Ton im falschen Bild steht.
    lang: text
    code: |
      Bild  Phase           Ton
       1    Kontakt rechts
       2    Passing         Schritt
       3    Kontakt links
       4    Passing         Schritt
    lines: [3, 5]
    explanation: |
      Beim Passing schwingt ein Bein frei am Standbein vorbei, kein Fuß setzt auf. Der Ton gehört in die Kontaktbilder 1 und 3. Wer den Ton nach Gefühl auf „irgendwo im Schritt“ setzt, landet oft eine halbe Phase daneben; die Phasen benennen hilft.
    resources:
      - title: Godot Docs · frame_changed
        url: https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-signal-frame-changed

  - id: saint11-ohne-ausholen
    type: explain
    title: Ein Angriff ohne Ausholen
    prompt: |
      Saint11 zeigt auf seinem Attack Sheet einen Angriff ohne Antizipationsbild. Erkläre in wenigen Sätzen, warum er für die Spielfigur so arbeitet, wo die Bewegung trotzdem Gewicht bekommt und was ein Gegner mit demselben Angriff anders bräuchte.
    lang: text
    code: |
      Saint11, Attack Sheet
      Bilder 1–3   Angriff
      Bilder 4–7   Erholung
      Kein Antizipationsbild.
      „It's important that there's
      no anticipation frame or
      players will feel input lag“
    points:
      - Ohne Antizipationsbild ist schon das erste Bild nach dem Druck Angriff; der Spieler sieht die Reaktion sofort.
      - Die Erholung hat mehr Bilder als der Angriff; dort bekommt die Bewegung Gewicht, ohne den Start zu verzögern.
      - Auch die Erholung bindet die Figur; ob ein Abbruch sie verkürzt, entscheidet das Spieldesign.
      - Ein Gegner mit demselben Angriff bräuchte eine Ankündigung, damit der Spieler reagieren kann.
    explanation: |
      Saint11 verschiebt das Gewicht vom Anfang ans Ende. Der Angriff beginnt sofort, deshalb sieht der Spieler seine Eingabe ohne Wartezeit. Die vier Bilder Erholung zeigen, dass Kraft im Spiel war, und kosten keine Reaktionszeit, wohl aber die Zeit, in der die Figur gebunden ist. Ein Gegner braucht das Gegenteil: Bei ihm ist das Ausholen die Zeit, in der der Spieler den Angriff liest und ausweicht, wie Cartwright für Skullgirls beschreibt.
    resources:
      - title: Saint11 · Attack Sheet
        url: https://saint11.art/blog/pixel-art-tutorials/#AttackSheet

  - id: wende-zwei-spiele
    type: practice
    title: Zwei Spiele, zwei Wenden
    prompt: |
      Sieh dir zwei Ausschnitte an, wenn du Netz hast: Owlboy ab 9:34 bis etwa 10:16 ([GDC 2017](https://www.youtube.com/watch?v=rOkq7fUdgYQ&t=574s)) und Dead Cells ab 18:49 bis etwa 19:40 ([GDC 2019](https://www.youtube.com/watch?v=OfSpBoA6TWw&t=1129s)). Notier für jedes Spiel in Stichpunkten, was die Figur bei einem Richtungswechsel tut, wie die Entwickler das begründen und was es kostet.
    lang: text
    starter: |
      Owlboy
      Richtungswechsel:
      Begründung:
      Preis:

      Dead Cells
      Richtungswechsel:
      Begründung:
      Preis:
    solution: |
      Owlboy
      Richtungswechsel:
        anfangs sofort, später mit
        kleinen Wendeanimationen
      Begründung:
        Wer die Demo sah, fand die
        Figur in Bewegung hölzern.
        Mit den Wenden bekam sie
        etwas mehr Gewicht.
      Preis:
        einige Bilder, bevor die Figur
        in die neue Richtung fliegt

      Dead Cells
      Richtungswechsel:
        Schlägt der Spieler in die
        falsche Richtung und steht ein
        Gegner hinter ihm, dreht das
        Spiel den Helden ohne Umweg um.
      Begründung:
        Der Spieler wollte den Gegner
        treffen. Laut Bénard bemerken
        Spieler die Hilfe nicht.
      Preis:
        keine sichtbare Wende, kein
        Gewicht in der Drehung; das
        Spiel entscheidet für ihn.
    checklist:
      - Für beide Spiele steht, was die Figur beim Richtungswechsel tut.
      - Die Begründung gibt wieder, was die Entwickler sagen, nicht deine Vermutung.
      - Für beide Spiele steht ein Preis, in Zeit oder in Glaubwürdigkeit.
      - Du hast notiert, welche Zeitmarke du dir angesehen hast.
    explanation: |
      Beide Spiele lösen dieselbe Frage verschieden, und beide begründen es mit dem, was Spieler erleben. Owlboy tauscht ein paar Bilder Reaktion gegen Gewicht, Dead Cells verzichtet auf jede sichtbare Wende zugunsten der Reaktion. Es gibt keine allgemeine Antwort, aber eine Frage, die du für jede eigene Übergangsanimation stellst: Was gewinnt der Spieler, und wie viele Ticks zahlt er dafür?
    resources:
      - title: Owlboy · GDC 2017 (ab 9:34)
        url: https://www.youtube.com/watch?v=rOkq7fUdgYQ&t=574s

  - id: eigene-animationsliste
    type: practice
    title: Deine Animationsliste
    prompt: |
      Nimm eine Figur, die du schon gezeichnet hast oder gerade planst, und schreib ihre Animationsliste in Stichpunkten. Welche Animationen sie hat, entscheidest du; der Kurs schlägt keine vor. Notier für jede Animation Loop, erstes verändertes Bild, Erkennungspose, Abbruch, Nachfolger und Ton-Bilder. Was du noch nicht weißt, markierst du als „offen“; das prüfst du später in der Testszene.
    lang: prose
    starter: |
      Figur:
      Animation 1 – Loop / erstes verändertes Bild / Erkennungspose / Abbruch ab / danach / Ton-Bilder:
      Animation 2 – …
      Offen für die Testszene:
    checklist:
      - Jede Animation hat einen Eintrag für Loop, Abbruch und Nachfolger, oder „offen“.
      - Bei jeder Animation, die der Spieler auslöst, steht, ob schon das erste Bild sich von der Ruhe unterscheidet.
      - Ton-Bilder sind als Bildnummern notiert, nicht in Millisekunden.
      - Mindestens ein offener Punkt ist für die Testszene vorgemerkt.
      - Alle Animationen stammen aus deiner eigenen Planung.
    explanation: |
      Die Liste ist der Vertrag zwischen deinen Zeichnungen und dem Code. Sie zwingt dich, für jede Animation zu entscheiden, wie sie anfängt, wie sie endet und ob der Spieler sie abbrechen darf, bevor du die Zwischenbilder zeichnest. Die offenen Punkte sind kein Mangel. Sie sind die Fragen, die du in [der Testszene](/animation/testszene) mit Ticks beantwortest.
    resources:
      - title: Klei Entertainment · GDC 2014 (ab 7:22)
        url: https://www.youtube.com/watch?v=8_KBjd0iaCU&t=442s
