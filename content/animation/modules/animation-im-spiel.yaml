id: animation-im-spiel
title: "Animation im Spiel: Tempo, Steuerbarkeit und Ton"
level: 3
minutes: 130
summary: Warum eine Animation im Spiel anderen Regeln folgt als im Editor, wie Spielanimatoren Ausführlichkeit gegen Steuerbarkeit abwägen, wo Übergänge und Unterbrechungen hingehören, was Spieltempo und Hitstop mit deinen Bildern machen und wie du die Bilder markierst, auf die später ein Ton gehört.
place: unterwegs
goals:
  - Du nennst Coopers fünf Grundsätze der Spielanimation und erklärst, warum Reaktion und Trägheit gegeneinander ziehen.
  - Du zählst in einer Bildliste die Ticks bis zum ersten veränderten Bild und bis zur Pose, an der man die Aktion erkennt.
  - Du legst in einer Animationsliste für jede Animation Loop, Abbruch und Nachfolger fest und begründest, wo ein Übergangsbild Steuerung kostet.
  - Du erklärst, warum im Hitstop eine Schlüsselpose stehen sollte und kein Zwischenbild.
  - Du markierst in einem Zyklus die Bilder, die einen Ton tragen, als Bildnummern, ohne den Ton selbst zu gestalten.
