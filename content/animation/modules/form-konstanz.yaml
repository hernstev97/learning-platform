lesson: |
  Du hast eine Figur, die du schon gezeichnet hast, in vier Bildern atmen lassen. Jedes Bild für sich sieht gut aus. In der Schleife pulsiert der Kopf, ein Auge zuckt ohne Grund, und an der Schulter flackert die Kontur. Kein einzelnes Bild ist falsch gezeichnet. Die Bilder passen nicht zueinander: Im dritten ist der Kopf einen Pixel breiter, im vierten sitzt das Auge eine Reihe tiefer, im zweiten ist die Kontur an einer Stelle doppelt. In der Schleife sieht man genau diese Unterschiede, weil sich alles andere nicht bewegt.

  Diese Lektion zeigt, was in jedem Bild gleich bleiben muss, welche Ein-Pixel-Fehler in Pixelart typisch sind, mit welchen Werkzeugen du die Form hältst, wie du eine Bewegung unter einem Pixel zeigst und wie du jedes Bild auf seine Silhouette prüfst. Die Bedienung der Editoren steht in [Einzelbilder im Editor](/animation/editor-zeitleiste).

  ## Auf Modell bleiben: was in jedem Bild gleich ist

  In Animationsstudios hält ein **Modellblatt** (Model Sheet) fest, wie eine Figur aussieht: Proportionen, Ansichten, Haltungen und Gesten, damit sie von Szene zu Szene gleich bleibt, egal wer zeichnet ([Model sheet](https://en.wikipedia.org/wiki/Model_sheet)). Eine Zeichnung, die davon abweicht, ist **off model**: „art that does not match the style, design, or proportions that have been previously established“ ([Off-model](https://en.wikipedia.org/wiki/Off-model)). Du zeichnest allein, aber das Problem bleibt: Bild 3 entsteht an einem anderen Tag als Bild 1. Wie du ein Modellblatt für eine Pixelfigur anlegst, steht in [Ansichten und Maßstab](/pixelart/ansichten-massstab).

  Thomas und Johnston nennen das Prinzip dahinter *Solid Drawing*: Formen im Raum denken, mit Volumen und Gewicht ([Solid drawing](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Solid_drawing)). Für eine Pixelfigur heißt das, in jedem Bild bleiben gleich:

  - **Maße:** Gesamthöhe, Kopfbreite und -höhe, Länge und Dicke von Armen und Beinen.
  - **Masse:** Wird ein Teil flacher, wird er breiter. Medeiros schreibt zu seinen Ruhezyklen: „Character doesn't change mass“ ([Character Idle](https://saint11.art/blog/pixel-art-tutorials/#characterIdle)).
  - **Details:** Augenabstand und Augenreihe, Zahl der Finger, Lage von Scheitel, Gürtel oder Tasche.
  - **Kontur:** überall gleich dick, meist ein Pixel.
  - **Licht:** dieselbe Lichtseite in jedem Bild.
  - **Palette:** dieselben Farben, keine neuen in einzelnen Bildern.

  Raymond Schlitter (Slynyrd) schreibt über seine Figur mit acht Richtungen: „The trick is keeping the thickness and length of appendages consistent. At such a small size, one pixel can make a huge difference.“ ([Pixelblog 55](https://www.slynyrd.com/blog/2025/3/24/pixelblog-55-top-down-character-animation)).

  Nicht jede Änderung ist ein Fehler. Ein Ball, der beim Aufprall breiter und flacher wird, ist gestaucht, und das ist gewollt ([Gewicht zeigen](/animation/gewicht-aufprall)). Ein Wischbild verzerrt die Form absichtlich ([Antizipation, Aktion, Erholung](/animation/antizipation-erholung)). Eine Drehung ändert die Ansicht. Auch Studios gehen manchmal bewusst vom Modell weg, und Wikipedia nennt off model ausdrücklich auch als absichtliche Entscheidung. Die Regel für dich: Eine Änderung ist gewollt, wenn du ihren Grund in die Bildliste schreiben kannst.

  > [!MERKE]
  > Maße, Masse, Details, Kontur, Licht und Palette bleiben von Bild zu Bild gleich. Was sich ändert, hat einen Grund, den du benennen kannst.

  ## Ein Pixel zu viel: typische Fehler in Pixelart

  Schlitter warnt in seiner Einführung: In einer Schleife „a single misplaced pixel can create an eyesore“, und weiter: „Respect the clusters of every single frame“ ([Pixelblog 8](https://www.slynyrd.com/blog/2018/8/19/pixelblog-8-intro-to-animation)). Ein **Cluster** ist eine zusammenhängende Gruppe gleichfarbiger Pixel. Medeiros schreibt für das Animieren: „Keep track of clusters“ und „I avoid breaking clusters“ ([Fundamentals 1](https://saint11.art/blog/pixel-art-tutorials/#Fundamentals)).

  Die häufigsten Abweichungen:

  - **Kopf wächst oder schrumpft** um einen Pixel, weil er in einem Bild neu gezeichnet wurde.
  - **Auge springt** eine Reihe nach oben oder unten.
  - **Kontur doppelt** an einer Stelle, oft an Schulter oder Knie.
  - **Lichtseite wechselt**, weil Glanzpunkt oder Schatten in einem Bild auf der anderen Seite sitzen.
  - **Kochen** (Boiling): Kanten, die in jedem Bild neu gezeichnet wurden, zittern, obwohl die Figur stillsteht.

  So sieht der wachsende Kopf aus, der obere Teil der Figur aus zwei Bildern:

  ```text
  Bild 1     Bild 2
  ...###...  ...####..
  ...###...  ...####..
  ...###...  ...####..
  ....#....  ....#....
  ..#####..  ..#####..
  .#.###.#.  .#.###.#.
  ```

  Im Standbild fällt der eine Pixel kaum auf. In der Schleife pumpt der Kopf.

  Kochende Linien können ein Stilmittel sein. Die Zeichentrickserie *Ed, Edd n Eddy* zeichnete jede Pose dreimal durch, damit die Konturen zittern; ihr Schöpfer Danny Antonucci sagt, das „helps keep the characters alive“ ([Ed, Edd n Eddy, Animation](https://en.wikipedia.org/wiki/Ed,_Edd_n_Eddy#Animation)). In Pixelart ist Kochen meist ungewollt. Schlitter nennt es Rauschen: „Any flickering pixels that draw the eye away from the overall motion I would describe as noise.“ Er findet es am leichtesten „when repeatedly playing back the cycle at full speed“, und als Abhilfe schlägt er vor, Farben zu reduzieren und Cluster zu vereinfachen ([Pixelblog 58](https://www.slynyrd.com/blog/2025/10/2/pixelblog-58-top-down-character-animation-part-3)).

  ## Werkzeuge, die die Form halten

  ### Onion Skinning

  **Onion Skinning** zeigt die Nachbarbilder durchscheinend unter dem aktuellen Bild. Der Name kommt von dünnem Zwiebelschalenpapier, das Zeichner früher über eine Lichtquelle legten, um die Zeichnung davor und danach zu sehen ([Onion skinning](https://en.wikipedia.org/wiki/Onion_skinning)). Aseprite, LibreSprite, Pixelorama und Krita haben es alle; wie du es einschaltest und wie viele Bilder es zeigt, steht in [Einzelbilder im Editor](/animation/editor-zeitleiste).

  Damit vergleichst du Kopfoberkante, Augenreihe und Kontur mit dem Bild davor. Schalt es aus, wenn du Farben eines Einzelbilds beurteilst, denn die Tönung verfälscht sie.

  ### Kopieren statt neu zeichnen

  Jedes Neuzeichnen ist eine Gelegenheit, vom Modell abzuweichen. Kopier deshalb das vorige Bild und änder nur, was sich bewegt. Teile, die sich nicht ändern, kannst du **verknüpfen**: Verknüpfte Cels teilen sich ein Bild, „When you modify one of these cels, all linked cels are modified“ ([Linked Cels](https://www.aseprite.org/docs/linked-cels/)). Was verknüpft ist, kann zwischen den Bildern nicht auseinanderlaufen. Alle vier Editoren können Bilder kopieren und Cels verknüpfen, Krita nennt verknüpfte Bilder Clone Frames; die Bedienung steht in [Einzelbilder im Editor](/animation/editor-zeitleiste). Verschieb Teile mit der Auswahl um ganze Pixel, statt sie nachzuzeichnen.

  ### Teile auf Ebenen, Details zuletzt

  Leg Teile, die sich unabhängig bewegen, auf eigene Ebenen. Schlitter animiert zuerst eine schlichte Grundfigur und legt Umhang und Ausrüstung auf eine eigene Ebene darüber (Pixelblog 55). In [Pixelblog 25](https://www.slynyrd.com/blog/2020/1/23/pixelblog-25-motion-cycles) begründet er die Reihenfolge: „The more detailed the design, the more difficult it will be to keep the movement clean.“ Eine weitere Ebene mit waagrechten **Hilfslinien** an Kopfoberkante, Augen, Schultern, Hüfte und Füßen zeigt dir in jedem Bild, ob etwas verrutscht ist. Beim Export blendest du sie aus. Auf Karopapier übernehmen die Linien des Papiers diese Aufgabe.

  ### Eine feste Palette

  Nimm in jedem Bild dieselben Farben. Eine neue Farbe in einem einzigen Bild flackert in der Schleife. Wie du eine Palette anlegst, steht in [Farbe und Paletten](/pixelart/farbe-paletten).

  > [!PRAXIS] Fehler, die man nebeneinander nicht sieht
  > Schlitter legte die acht Richtungen seiner Figur zuerst als Standbilder nebeneinander. Dann setzte er sie zu einer Drehung zusammen und spielte sie ab: „This revealed many errors and issues I could not see by looking at them next to each other.“ Beim Laufzyklus ordnete er alle Richtungen im Kreis an, ließ sie gleichzeitig laufen und prüfte Bild für Bild einen Körperteil nach dem anderen, besonders das Auf und Ab des Kopfes, den Drehpunkt der Schulter und den größten Ausschlag der Glieder (Pixelblog 55). Konstanz prüft man in Bewegung, nicht im Vergleich von Standbildern.

  ## Sub-Pixel-Animation: Bewegung unter einem Pixel

  Manchmal soll sich etwas weniger als einen Pixel bewegen, etwa der Brustkorb beim Atmen. Medeiros: „Wait, you can move things less than 1 pixel? No, you can't but you can fake some very subtle movements“ ([< 1 Pixel Movement](https://saint11.art/blog/pixel-art-tutorials/#Subpixel)). Der wichtigste Trick: „Fade colors for an illusion of <1 pixel movement“. Ein Mittelton zwischen Figur und Hintergrund liest das Auge als halben Schritt. Eine Kante, die in drei Bildern einen Pixel nach rechts wandert, `#` dunkel, `+` Mittelton:

  ```text
  Bild 1    Bild 2    Bild 3
  ####....  ####+...  #####...
  ####....  ####+...  #####...
  ####....  ####+...  #####...
  ```

  Medeiros nennt weitere Regeln: „Mostly move light, avoid moving shapes“ und „Note that the silhouette barely changes“. Eine Bewegung im Inneren, etwa ein Lichtfleck, der wandert, hält die Form konstant und bewegt trotzdem etwas. Seine Warnung: „Careful: too many colors makes everything look blurry“. In seinen Ruhezyklen mit sechs Bildern setzt er Sub-Pixel-Bewegung gezielt ein (Character Idle). Schlitter findet Rauschen oft gerade in den Sub-Pixeln (Pixelblog 58). Sub-Pixel ist ein Werkzeug für Ruhe und kleine Bewegungen, kein Ersatz für eine klare Pose.

  ## Jedes Bild lesbar: Silhouette pro Bild

  Konstanz heißt nicht, dass jedes Bild gleich aussieht, sondern dass jedes Bild dieselbe Figur zeigt und als Pose lesbar bleibt. Kyle Bunk (Firaxis) achtet darauf, dass jede Pose als Silhouette klar bleibt, und zeigt ein Gegenbeispiel: ein Bild mitten in einer Rolle, in dem die Figur zu einer schwarzen Kugel wird ([High Resolution Pixel Art and Animation, ab 10:23](https://www.youtube.com/watch?v=Ih65Kg4DTw8&t=623s)). Schlitter: „What looks best in one static position might become undefined noise in other frames of the animation“ (Pixelblog 55). Prüf deshalb jedes Bild für sich als schwarze Fläche; wie das geht, steht in [Silhouette und Formensprache](/pixelart/silhouette-formsprache) und [Prüfen, überarbeiten, dokumentieren](/pixelart/lesbarkeit-pruefen). Wischbilder sind die Ausnahme: Sie dürfen abstrakt sein, weil man sie nur im Vorbeigehen sieht.

  Weniger Details bedeuten weniger, was konstant bleiben muss. Tyriq Plummer zeigt eine Figur, deren Reißverschluss er auf eine Linie vereinfacht hat, weil er ihn sonst in jedem Bild neu ausarbeiten müsste ([Pixel Art and Animation in the Hi-Bit Age, ab 23:00](https://www.youtube.com/watch?v=ZR_JBgNEeVM&t=1380s)).

  Eine Prüfliste für jede Fassung:

  ```text
  Konstanz-Check, Fassung …
  [ ] Gesamthöhe gleich
  [ ] Kopf: Breite, Höhe gleich
  [ ] Augen: Reihe, Abstand
  [ ] Arme, Beine: Länge, Dicke
  [ ] Kontur überall 1 px
  [ ] Lichtseite gleich
  [ ] keine neuen Farben
  [ ] Silhouette je Bild lesbar
  [ ] jede Änderung mit Grund
  ```

  Prüf in dieser Reihenfolge: erst die Schleife in Originalgröße und voller Geschwindigkeit, mehrmals, und notier, wo etwas flackert. Dann die betroffenen Bilder mit Onion Skinning gegen ihre Nachbarn. Zuletzt misst du: Reihen und Spalten zählen geht im Editor mit Raster und auf Karopapier ohne Hilfsmittel.

  > [!TIP] Onion Skinning auf Papier
  > Leg das neue Blatt über das vorige und halt beides gegen ein Fenster. Bei Haftzetteln klappst du das obere Blatt hin und her und siehst, was springt. Genau so haben Zeichner gearbeitet, bevor es Editoren gab.

  > [!INTERVIEW]
  > „Was heißt ‚on model‘, und wie hältst du eine Pixelfigur über alle Bilder auf Modell?“ Gute Antwort: On model heißt, dass jedes Bild zur festgelegten Figur passt, in Proportionen, Details, Kontur, Licht und Farben. Ich arbeite mit einem Modellblatt, kopiere Bilder statt sie neu zu zeichnen, verknüpfe unveränderte Teile und lege bewegliche Teile auf Ebenen. Geprüft wird in der Schleife bei voller Geschwindigkeit, weil Flackern im Standbild nicht auffällt, dann mit Onion Skinning und Messen. Gewollte Änderungen wie Stauchen oder Wischbilder schreibe ich mit Grund in die Bildliste.

  ## Häufige Fehler

  - **Jedes Bild neu gezeichnet.** Die Kanten kochen. Kopier das vorige Bild und änder nur, was sich bewegt.
  - **Nur Standbilder verglichen.** Nebeneinander sieht alles gleich aus. Spiel die Schleife ab.
  - **Nur vergrößert geprüft.** Im Zoom siehst du Einzelheiten, in Originalgröße das, was ein Spieler sieht. Spiel die Schleife in Originalgröße ab.
  - **Masse ändert sich.** Die Figur wird beim Atmen kleiner, ohne breiter zu werden. Höhe und Breite gehören zusammen.
  - **Neue Farbe in einem Bild.** Ein Zwischenton, der nur einmal vorkommt, flackert.
  - **Zu viele Zwischentöne.** Sub-Pixel mit vielen Farben macht die Figur unscharf.
  - **Detail ohne Plan.** Ein Detail, das in jedem Bild neu gezeichnet werden muss, ist eine Stelle, an der die Form kippt. Vereinfach es vor dem Animieren.
  - **Gewollte Änderung nicht notiert.** Später weißt du nicht mehr, ob die Stauchung in Bild 3 Absicht oder Versehen war.

  ## Zusammenfassung

  - On model heißt: Jedes Bild passt zur festgelegten Figur. Ein Modellblatt hält sie fest.
  - Maße, Masse, Details, Kontur, Licht und Palette bleiben gleich, außer du änderst sie mit Grund.
  - Typische Fehler sind ein Pixel: Kopf wächst, Auge springt, Kontur doppelt, Licht wechselt, Kanten kochen.
  - Onion Skinning, Kopieren, verknüpfte Cels, Ebenen, Hilfslinien und eine feste Palette halten die Form, in jedem der vier Editoren.
  - Sub-Pixel-Bewegung entsteht durch Zwischentöne und wanderndes Licht. Zu viele Töne machen unscharf.
  - Jedes Bild braucht eine lesbare Silhouette, Wischbilder ausgenommen.
  - Geprüft wird in der Schleife bei voller Geschwindigkeit, dann mit Onion Skinning und Messen.
exercises:
  - id: fehler-oder-absicht
    type: choice
    title: Fehler oder Absicht?
    prompt: |
      Welche Unterschiede zwischen zwei Bildern einer Animation solltest du als möglichen Fehler prüfen?
    options:
      - text: Der Kopf ist in Bild 3 einen Pixel breiter, ohne dass sich die Figur dreht.
        correct: true
        why: Ohne Drehung gibt es keinen Grund für eine andere Kopfbreite. In der Schleife pumpt der Kopf.
      - text: Der Glanzpunkt sitzt in einem Bild links oben, im nächsten rechts oben, obwohl das Licht gleich bleibt.
        correct: true
        why: Die Lichtseite gehört zum Modell. Ein Wechsel ohne Grund flackert.
      - text: Im Kontaktbild ist der Ball breiter und flacher, bei etwa gleicher Fläche.
        correct: false
        why: Das ist Stauchen. Weil die Fläche gleich bleibt, bleibt die Masse gleich; die Änderung ist gewollt.
      - text: Ein Wischbild zeigt den Arm als gestreckte, helle Form.
        correct: false
        why: Wischbilder verzerren absichtlich und stehen nur kurz. Sie müssen nicht auf Modell sein.
      - text: Die Kontur ist in Bild 2 an der Schulter zwei Pixel dick, sonst überall einer.
        correct: true
        why: Eine doppelte Kontur an einer Stelle flackert in der Schleife, typisch nach dem Neuzeichnen.
    explanation: |
      Prüfen solltest du jede Änderung, für die du keinen Grund nennen kannst: Kopfbreite ohne Drehung, Lichtseite ohne neues Licht, Konturstärke ohne Absicht. Stauchen und Wischbilder ändern die Form ebenfalls, aber mit Grund, und gehören deshalb in die Bildliste statt in die Fehlerliste. Die Frage ist nie „ist es anders?“, sondern „weiß ich, warum es anders ist?“.
    resources:
      - title: Wikipedia · Off-model
        url: https://en.wikipedia.org/wiki/Off-model

  - id: konstanz-pruefen
    type: order
    title: Erst abspielen, dann messen
    prompt: |
      Bring die Schritte einer Konstanzprüfung in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Die Schleife in Originalgröße und voller Geschwindigkeit mehrmals abspielen.
      Notieren, wo etwas flackert, pulsiert oder springt.
      Die betroffenen Bilder mit Onion Skinning gegen ihre Nachbarn legen.
      Höhe, Kopfmaße, Augenreihe und Konturstärke zählen und mit dem Modell vergleichen.
      Den abweichenden Teil aus einem guten Bild kopieren, statt ihn neu zu zeichnen.
      Die Schleife erneut in voller Geschwindigkeit abspielen.
    explanation: |
      Zuerst die Schleife, weil Rauschen im Standbild nicht auffällt; Schlitter findet es am leichtesten beim wiederholten Abspielen in voller Geschwindigkeit. Onion Skinning und Messen grenzen die Ursache ein. Repariert wird durch Kopieren, weil ein neu gezeichneter Teil die nächste Abweichung mitbringt. Am Ende steht wieder die Schleife, denn nur dort zeigt sich, ob das Flackern weg ist.
    resources:
      - title: Slynyrd · Pixelblog 58
        url: https://www.slynyrd.com/blog/2025/10/2/pixelblog-58-top-down-character-animation-part-3

  - id: augen-reihe
    type: output
    title: Wohin ist das Auge?
    prompt: |
      Zwei Bilder eines Würfels mit Augen. Um wie viele Reihen sind die Augen in Bild 2 verrutscht? Antworte mit der Zahl.
    lang: text
    code: |
      Bild 1      Bild 2
      .######.    .######.
      #------#    #------#
      #-#--#-#    #------#
      #------#    #-#--#-#
      #++++++#    #++++++#
      .######.    .######.
    expected: |
      1
    accept:
      - 1 Reihe
      - eine
      - eine Reihe
    explanation: |
      In Bild 1 stehen die Augen in der dritten Reihe, in Bild 2 in der vierten: eine Reihe tiefer, während der Würfel gleich bleibt. In der Schleife zuckt das Auge auf und ab. Das passiert oft, wenn ein Bild neu gezeichnet statt kopiert wurde. Eine Hilfslinie auf Augenhöhe hätte es sofort gezeigt.
    resources:
      - title: Slynyrd · Pixelblog 8
        url: https://www.slynyrd.com/blog/2018/8/19/pixelblog-8-intro-to-animation

  - id: messtabelle
    type: output
    title: Wie viele Bilder sind off model?
    prompt: |
      Du hast einen Ruhezyklus mit sechs Bildern ausgemessen. Gestaucht wird nichts, die Figur dreht sich nicht. Wie viele Bilder weichen vom Modell ab? Antworte mit der Zahl.
    lang: text
    code: |
      Modell: Kopf 3×3, Augen Reihe 2,
      Kontur 1 px
      Bild  Kopf  Augen  Kontur
       1    3×3   2      1
       2    3×3   2      1
       3    3×4   2      1
       4    3×3   3      1
       5    3×3   2      1
       6    3×3   2      2
    expected: |
      3
    accept:
      - 3 Bilder
      - drei
    explanation: |
      Bild 3 hat einen Kopf mit 3 × 4 Pixeln, Bild 4 die Augen in Reihe 3, Bild 6 eine Kontur von 2 Pixeln. Drei Bilder, drei verschiedene Abweichungen. Weil es keine gewollte Stauchung und keine Drehung gibt, ist jede davon ein Kandidat für Flackern. Eine solche Tabelle ist mühsam, aber sie findet Fehler, die man beim Hinsehen übersieht.
    resources:
      - title: Wikipedia · Model sheet
        url: https://en.wikipedia.org/wiki/Model_sheet

  - id: subpixel-weg
    type: output
    title: Anderthalb Pixel
    prompt: |
      Eine Kante wandert in vier Bildern nach rechts. Wenn du den Mittelton `+` als halben Pixel liest: Um wie viele Pixel ist die Kante von Bild 1 bis Bild 4 gewandert? Antworte mit der Zahl.
    lang: text
    code: |
      Bild 1  ####....
      Bild 2  ####+...
      Bild 3  #####...
      Bild 4  #####+..
    expected: |
      1,5
    accept:
      - "1.5"
      - 1,5 px
      - 1,5 Pixel
      - anderthalb
    explanation: |
      Von Bild 1 zu 2 kommt ein halber Pixel dazu, von 2 zu 3 der zweite halbe, von 3 zu 4 wieder ein halber: zusammen 1,5 Pixel. Das Raster erlaubt nur ganze Pixel, der Mittelton täuscht den halben vor. So bewegt sich etwas in vier Bildern gleichmäßig, das ohne Mittelton nur in ganzen Pixeln springen könnte. Medeiros nennt das „Fade colors for an illusion of <1 pixel movement“.
    resources:
      - title: Saint11 · < 1 Pixel Movement
        url: https://saint11.art/blog/pixel-art-tutorials/#Subpixel

  - id: werkzeuge-begriffe
    type: gap
    title: Fünf Werkzeuge der Konstanz
    prompt: |
      Ergänze die fehlenden Wörter.
    lang: prose
    code: |
      Beim ⟦Onion Skinning⟧ siehst du die Nachbarbilder durchscheinend unter dem aktuellen Bild.
      ⟦Verknüpfte⟧ Cels teilen sich ein Bild: Änderst du eines, ändern sich alle.
      Ein Umhang auf einer eigenen ⟦Ebene⟧ lässt sich getrennt bearbeiten und ausblenden.
      Ein Blatt, das Proportionen und Ansichten einer Figur festhält, heißt ⟦Modellblatt⟧.
      Eine Bewegung unter einem Pixel täuschst du mit ⟦Zwischentönen⟧ vor.
    gaps:
      - label: Nachbarbilder sehen
        hint: Benannt nach dünnem Papier.
        accept: ["Onion-Skinning", "Zwiebelhaut"]
      - label: Geteiltes Bild
        hint: Auf Englisch linked.
        accept: ["Verlinkte", "Linked", "Gelinkte"]
      - label: Getrennt bearbeiten
        hint: Auf Englisch Layer.
        accept: ["Layer"]
      - label: Festgelegte Figur
        hint: Auf Englisch Model Sheet.
        accept: ["Model Sheet", "Model-Sheet", "Modellbogen"]
      - label: Farben zwischen Figur und Hintergrund
        hint: Weder ganz dunkel noch leer.
        accept: ["Mitteltönen", "Zwischenfarben", "Mittelton", "Zwischentöne", "Zwischenton", "Mitteltöne"]
    explanation: |
      Onion Skinning zeigt die Nachbarn, verknüpfte Cels verhindern, dass sich gleiche Teile auseinanderentwickeln, Ebenen trennen bewegliche Teile vom Rest. Das Modellblatt ist der Maßstab, an dem du jedes Bild misst. Zwischentöne zeigen Bewegungen unter einem Pixel, solange es wenige bleiben.
    resources:
      - title: Aseprite Docs · Linked Cels
        url: https://www.aseprite.org/docs/linked-cels/

  - id: kopf-pulsiert
    type: bug
    title: Der Kopf pulsiert
    prompt: |
      Ein Ruhezyklus mit drei Bildern läuft in Schleife. Bild 2 sinkt gewollt einen Pixel ab, Bild 3 soll Bild 1 gleichen. Beim Abspielen pulsiert der Kopf. Finde die Pixelreihe, in der Bild 3 vom Modell abweicht.
    lang: text
    code: |
      Bild 1     Bild 2     Bild 3
      .........  .........  ...###...
      ...###...  .........  ...###...
      ...###...  ...###...  ...###...
      ...###...  ...###...  ...###...
      ....#....  ...###...  ....#....
      ..#####..  ....#....  ..#####..
      .#.###.#.  ..#####..  .#.###.#.
      .#.###.#.  .#.###.#.  .#.###.#.
      ...###...  .#.###.#.  ...###...
      ...#.#...  ...###...  ...#.#...
      ...#.#...  ...#.#...  ...#.#...
      ...#.#...  ...#.#...  ...#.#...
      ...#.#...  ...#.#...  ...#.#...
    lines: [2]
    hints:
      - Vergleich Bild 3 Reihe für Reihe mit Bild 1, nicht mit Bild 2.
    explanation: |
      In der ersten Pixelreihe hat nur Bild 3 einen Kopf. Sein Kopf ist vier Reihen hoch statt drei, der Rest stimmt mit Bild 1 überein. In der Schleife wird der Kopf so bei jedem dritten Bild größer. Bild 2 weicht auch ab, aber gewollt und als Ganzes: Die Figur sinkt einen Pixel, der Kopf bleibt gleich groß. Bild 3 als Kopie von Bild 1 anzulegen, hätte den Fehler verhindert.
    resources:
      - title: Aseprite Docs · New Frame
        url: https://www.aseprite.org/docs/new-frame/

  - id: licht-wechselt
    type: bug
    title: Die Kiste blinkt
    prompt: |
      Eine Kiste landet und wird dabei gewollt gestaucht. Das Licht kommt immer von links. Beim Abspielen blinkt die Kiste im mittleren Bild. Klick die Beschriftung des Bildes an, das aus der Reihe fällt.
    lang: text
    code: |
      Bild 1
      ########
      #--++++#
      #--++++#
      #--++++#
      #--++++#
      ########
      Bild 2 (gestaucht)
      ##########
      #++++++--#
      #++++++--#
      #++++++--#
      ##########
      Bild 3
      ########
      #--++++#
      #--++++#
      #--++++#
      #--++++#
      ########
    lines: [8]
    explanation: |
      In Bild 2 liegt die helle Seite rechts, obwohl das Licht von links kommt. Die Stauchung selbst ist in Ordnung: 10 × 5 statt 8 × 6 Pixel, fast dieselbe Fläche. Gewollt war die Form, ungewollt der Lichtwechsel; in der Schleife springt die helle Fläche von links nach rechts und zurück. Beim Neuzeichnen einer gestauchten Pose passiert das leicht, wenn man das Licht nicht mitkopiert.
    resources:
      - title: Saint11 · Pixel Art Fundamentals 1
        url: https://saint11.art/blog/pixel-art-tutorials/#Fundamentals

  - id: kontur-doppelt
    type: bug
    title: Ein Rand flackert
    prompt: |
      Ein Ball soll in beiden Bildern gleich aussehen, nur der Glanz wandert. Beim Abspielen flackert der rechte Rand. Finde die Reihe und korrigiere sie so, dass Bild 2 wieder dieselbe Kontur hat wie Bild 1.
    lang: text
    code: |
      Bild 1    Bild 2
      ..####..  ..####..
      .#--++#.  .#+--+#.
      #--++++#  #+--+++#
      #-+++++#  #+-++++#
      #++++++#  #+++++##
      #++++++#  #++++++#
      .#++++#.  .#++++#.
      ..####..  ..####..
    lines: [6]
    fix:
      - line: 6
        answers:
          - "#++++++#  #++++++#"
    explanation: |
      In der fünften Pixelreihe ist die Kontur von Bild 2 rechts zwei Pixel dick, in Bild 1 einer. Das wandernde Licht ist gewollt, eine Sub-Pixel-Bewegung im Inneren, bei der die Silhouette gleich bleibt. Die doppelte Kontur dagegen ändert die Silhouette an einer einzigen Stelle und flackert. Die korrigierte Reihe ist in beiden Bildern gleich.
    resources:
      - title: Saint11 · < 1 Pixel Movement
        url: https://saint11.art/blog/pixel-art-tutorials/#Subpixel

  - id: subpixel-erklaeren
    type: explain
    title: Weniger als ein Pixel
    prompt: |
      Pedro Medeiros sammelt in einem Tutorial Tricks für Bewegungen unter einem Pixel. Erkläre in wenigen Sätzen, warum diese vier Regeln einer Figur helfen, auf Modell zu bleiben, und wo die Grenze liegt.
    lang: text
    code: |
      Saint11, < 1 Pixel Movement
      - Fade colors for an illusion
        of <1 pixel movement
      - Mostly move light, avoid
        moving shapes
      - Note that the silhouette
        barely changes
      - Careful: too many colors
        makes everything look blurry
    points:
      - Ein Zwischenton an der Kante liest das Auge als halben Schritt, ohne dass die Form neu gezeichnet wird.
      - Wer Licht statt Form bewegt, lässt Silhouette und Maße gleich; die Figur bleibt auf Modell.
      - Weil die Silhouette fast gleich bleibt, eignet sich Sub-Pixel für kleine Bewegungen wie Atmen, nicht für große.
      - Jeder zusätzliche Ton macht die Figur unschärfer und kann flackern; Schlitter findet Rauschen oft gerade in den Sub-Pixeln.
    explanation: |
      Sub-Pixel-Animation bewegt Farben, nicht Umrisse. Ein Mittelton an der Kante oder ein wandernder Lichtfleck zeigt Bewegung, während Silhouette, Maße und Kontur gleich bleiben, also genau die Dinge, die die Figur auf Modell halten. Die Grenze ist die Klarheit: Viele Zwischentöne verwischen die Figur, und Töne, die von Bild zu Bild auftauchen und verschwinden, werden zu Rauschen. Deshalb prüfst du Sub-Pixel-Bewegung immer in der Schleife bei voller Geschwindigkeit.
    resources:
      - title: Saint11 · < 1 Pixel Movement
        url: https://saint11.art/blog/pixel-art-tutorials/#Subpixel

  - id: drei-bilder-karopapier
    type: practice
    title: Drei Bilder auf Karopapier
    prompt: |
      Nimm eine Figur, die du schon gezeichnet hast, oder eine Gliederpuppe, und zeichne sie auf Karopapier in drei Bildern einer kleinen Bewegung, etwa Atmen oder Kopfnicken, ein Kästchen pro Pixel. Zieh vorher waagrechte Hilfslinien an Kopfoberkante, Augen, Schultern, Hüfte und Füßen. Übertrag Bild 1 als Kopie in Bild 2 und 3 und änder nur, was sich bewegt. Notiere hier die Maße jedes Bildes und was du absichtlich änderst.
    lang: prose
    starter: |
      Figur, Größe in Kästchen:
      Bewegung:
      Hilfslinien (Reihen):
      Bild 1, Maße (Höhe, Kopf, Augenreihe):
      Bild 2, Maße und gewollte Änderung:
      Bild 3, Maße und gewollte Änderung:
      Beim Hin- und Herblättern aufgefallen:
    checklist:
      - Für jedes Bild sind Gesamthöhe, Kopfmaße und Augenreihe notiert.
      - Jede Abweichung vom Bild 1 hat einen notierten Grund.
      - Kontur, Lichtseite und Farben sind in allen drei Bildern gleich.
      - Du hast die Bilder übereinander gegen ein Fenster gehalten oder hin- und hergeblättert und das Ergebnis notiert.
    explanation: |
      Hilfslinien und Kopieren machen Konstanz zur Gewohnheit, bevor du im Editor arbeitest. Die Maße für jedes Bild aufzuschreiben, wirkt pedantisch, findet aber genau den einen Pixel, den man sonst erst in der Schleife bemerkt. Welche Figur du nimmst und wie sie sich bewegt, entscheidest du; die Übung prüft nur, ob sie in allen drei Bildern dieselbe bleibt.
    resources:
      - title: Wikipedia · Onion skinning
        url: https://en.wikipedia.org/wiki/Onion_skinning

  - id: konstanz-check-anwenden
    type: practice
    title: Der Konstanz-Check an einer eigenen Animation
    prompt: |
      Nimm eine eigene Animation oder eine Studie aus diesem Kurs und arbeite den Konstanz-Check aus der Lektion ab. Spiel sie zuerst in Originalgröße und voller Geschwindigkeit, auf dem Handy etwa als GIF in der Galerie, und notier, wo etwas flackert. Geh danach Bild für Bild durch und notier jede Abweichung mit Bildnummer und Grund, falls es einen gibt.
    lang: prose
    starter: |
      Animation, Fassung:
      Beim Abspielen aufgefallen (wo, welches Bild):
      Abweichungen (Bild, was, gewollt ja/nein, Grund):
      Silhouette je Bild lesbar? Problembilder:
      Was ich in der nächsten Fassung ändere:
    checklist:
      - Du hast zuerst in Originalgröße und voller Geschwindigkeit abgespielt und das notiert.
      - Jede Abweichung steht mit Bildnummer da.
      - Jede Abweichung ist als gewollt mit Grund oder als ungewollt markiert.
      - Du hast jedes Bild einzeln auf seine Silhouette geprüft.
      - Die Änderungen für die nächste Fassung kommen in eine neue Datei; die alte Fassung bleibt erhalten.
    explanation: |
      Die Checkliste macht aus einem Eindruck („irgendwas flackert“) eine Liste mit Bildnummern. Die Reihenfolge, erst abspielen, dann einzeln prüfen, folgt Schlitters Erfahrung, dass Rauschen in Bewegung auffällt und im Standbild nicht. Weil jede Änderung eine neue Fassung bekommt, kannst du danach vergleichen, ob die Korrektur geholfen hat.
    resources:
      - title: Slynyrd · Pixelblog 55
        url: https://www.slynyrd.com/blog/2025/3/24/pixelblog-55-top-down-character-animation
