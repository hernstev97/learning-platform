id: form-konstanz
title: Form und Proportionen von Bild zu Bild halten
level: 2
minutes: 110
summary: Warum eine Figur in der Schleife pulsiert, flackert oder kocht, obwohl jedes Einzelbild stimmt, was in jedem Bild gleich bleiben muss, welche Werkzeuge im Editor und auf Papier dabei helfen und wie du eine Bewegung unter einem Pixel zeigst.
place: unterwegs
goals:
  - Du erkennst in einer Bildfolge, wo eine Figur vom Modell abweicht (Maße, Augen, Kontur, Lichtseite), und unterscheidest gewollte von ungewollten Änderungen.
  - Du findest in Pixelrastern die Reihe oder das Bild, das aus der Form fällt.
  - Du setzt Onion Skinning, verknüpfte Bilder, Ebenen, Hilfslinien und eine feste Palette gezielt ein, in einem freien Editor oder in Aseprite.
  - Du erklärst Sub-Pixel-Animation und wann Zwischentöne eine Bewegung unter einem Pixel zeigen, statt zu flimmern.
  - Du prüfst jedes Einzelbild auf eine lesbare Silhouette und arbeitest eine Konstanz-Checkliste ab.
