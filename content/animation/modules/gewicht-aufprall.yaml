id: gewicht-aufprall
title: "Gewicht zeigen: schwer, leicht, Stauchen und Aufprall"
level: 2
minutes: 120
summary: Warum schwere Dinge nicht schneller fallen und woran man Gewicht trotzdem sieht, wie du Stauchen und Strecken mit gleicher Fläche in Pixel umrechnest, wie ein Aufprall mit Rückprall und Ausschwingen aufgebaut ist und wie eine Figur zeigt, dass etwas schwer ist.
place: unterwegs
goals:
  - Du erklärst, warum schwere und leichte Gegenstände gleich schnell fallen, und nennst, woran ein Zuschauer Gewicht stattdessen abliest.
  - Du planst Squash & Stretch mit gleichbleibender Fläche und rechnest Breite und Höhe in ganzen Pixeln aus.
  - Du baust einen Aufprall aus letztem Fallbild, Kontaktbild mit Stauchung, Rückprall und Ausschwingen und rechnest Rückprallhöhen mit einem Faktor aus.
  - Du unterscheidest Gummiball, Bowlingkugel und Wasserballon über Verformung, Rückprall und Haltezeiten.
  - Du planst, wie eine Figur eine leichte und eine schwere Last hebt, und prüfst mit einem Beobachtungstest, ob der Unterschied gelesen wird.
