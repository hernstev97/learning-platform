lesson: |
  Du animierst zwei Bälle nebeneinander, eine Bowlingkugel und einen Gummiball. Beide fallen aus derselben Höhe, du hast das Spacing sauber nach [Timing und Spacing](/animation/timing-spacing) geplant, beide springen ab und kommen zur Ruhe. Du zeigst sie jemandem und fragst, welcher schwerer ist. Er zuckt mit den Schultern. Die Bälle unterscheiden sich nur in der Farbe.

  Gewicht steckt in der Animation weniger in der Zeichnung als in der Bewegung: wie etwas aufprallt, wie es sich verformt, wie hoch es zurückspringt, wie lange es liegen bleibt und wie sehr sich eine Figur anstrengt, um es zu bewegen. Diese Lektion geht diese Merkmale einzeln durch. Alles geht auf Papier und mit dem Handy.

  ## Schwere Dinge fallen nicht schneller

  Am Ende des letzten Mondspaziergangs von Apollo 15 ließ David Scott einen Hammer und eine Falkenfeder gleichzeitig fallen. Ohne Luft kamen beide gleichzeitig am Boden an, wie Galilei es vorhergesagt hatte: „all objects released together fall at the same rate regardless of mass“ ([NASA: The Apollo 15 Hammer-Feather Drop](https://nssdc.gsfc.nasa.gov/planetary/lunar/apollo_15_feather_drop.html)). Auf der Erde bremst die Luft eine Feder oder einen Luftballon stark, eine Bowlingkugel und einen Gummiball kaum. Im Fall unterscheiden sie sich deshalb nicht, das Spacing 1 : 3 : 5 : 7 aus [Timing und Spacing](/animation/timing-spacing) gilt für beide.

  Wo zeigt sich Gewicht dann? Der Wikipedia-Artikel zu den zwölf Prinzipien von Thomas und Johnston sagt zum Timing: „an object's weight determines how it reacts to an impetus, like a push: a lightweight object will react faster than a heavy one“ ([Timing](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Timing)). Jonathan Cooper führt „Inertia & Momentum“, also Trägheit und Schwung, als Teil des Spielgefühls ([Five Fundamentals](https://www.gameanim.com/2020/04/04/the-five-fundamentals-of-video-game-animation/)). Daraus ergeben sich fünf Stellen, an denen ein Zuschauer Gewicht abliest:

  - **Anfahren und Abbremsen:** Schweres braucht länger, um in Bewegung zu kommen und um anzuhalten.
  - **Verformung:** wie stark sich etwas beim Aufprall staucht.
  - **Rückprall:** wie hoch es zurückspringt und wie schnell es zur Ruhe kommt.
  - **Haltezeiten:** wie lange es nach dem Aufprall liegt, bevor sich wieder etwas regt.
  - **Umgebung und Figur:** ob der Boden reagiert, ob Staub aufsteigt, wie sehr sich jemand anstrengt.

  > [!MERKE]
  > Gewicht zeigt sich nicht im Fall, sondern an seinen Enden: beim Anfahren, beim Aufprall und beim Zur-Ruhe-Kommen.

  ## Squash & Stretch: andere Form, gleiche Menge

  Beim Stauchen und Strecken (Squash & Stretch) verformt sich ein Körper in Bewegungsrichtung. Der Wikipedia-Artikel zu den zwölf Prinzipien nennt als Zweck „a sense of weight and flexibility“, und das Wichtigste daran sei, „that an object's volume does not change“: Wird ein Ball senkrecht gestreckt, muss er waagerecht schmaler werden ([Squash and stretch](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Squash_and_stretch)). Pedro Medeiros (Saint11) formuliert dieselbe Regel für Pixelart: „When changing the width of an object, always change the height too, this way the mass is constant.“ Er nennt sie „the most important rule of squash and stretch“ ([Squash and Stretch](https://saint11.art/blog/pixel-art-tutorials/#Squash)). Masahiro Sakurai betont in seinem Video zu Stauchen und Skalieren ebenfalls, dass das Volumen gleich bleiben soll ([Squashing and Scaling](https://www.youtube.com/watch?v=Sm0LAm4sJKc&t=78s), ab 1:18).

  In einer Zeichnung ist das Volumen die Fläche: Breite mal Höhe bleibt ungefähr gleich. Für einen Ball von 16 × 16 Pixeln:

  ```python run
  # Ball 16 x 16 px
  flaeche = 16 * 16
  for h in (16, 15, 12, 20):
      b = flaeche / h
      print(h, round(b, 1),
            round(b))
  ```

  Schon ein Pixel Stauchung auf 15 Pixel Höhe verlangt 17 Pixel Breite. Auf 12 Pixel gestaucht wird er 21 breit, auf 20 gestreckt 13 schmal. In ganzen Pixeln geht die Rechnung selten genau auf, und der Umriss eines runden Balls folgt nicht exakt dem Rechteck. Zähl deshalb nach. Ein Ball von 8 Pixeln in drei Formen:

  ```text
  rund      gestaucht   gestreckt
                        ..##..
                        .####.
  ..####..              ######
  .######.              ######
  ########  ..######..  ######
  ########  .########.  ######
  ########  ##########  ######
  ########  ##########  ######
  .######.  .########.  .####.
  ..####..  ..######..  ..##..
  ```

  Rund sind es 52 Pixel, gestaucht und gestreckt je 48. Das ist nah genug; ein Ball, der beim Stauchen 30 Pixel verliert, schrumpft sichtbar.

  Wann welche Form? In seinem Aseprite-Beispiel staucht Medeiros den Ball im Kontaktbild und streckt ihn im letzten Bild des Falls und im ersten Bild des Aufstiegs, „when the ball is at their fastest“. Und: „Keeping the volume is very important so your object doesn't look like it got smaller or bigger“ ([A Basic Aseprite Animation](https://saint11.art/pixel_art_articles/article3/#squash-and-stretch)). Wie stark, hängt vom Material ab: „stiff objects do not deform as much“ ([Squash and Stretch](https://saint11.art/blog/pixel-art-tutorials/#Squash)). Ein Gummiball darf sich deutlich stauchen, eine Bowlingkugel kaum oder gar nicht.

  > [!WARNING] Stauchen in der Luft
  > Gestaucht wird erst, wenn der Ball den Boden berührt. Ein Ball, der schon ein Bild vorher breit und flach ist, prallt scheinbar gegen etwas Unsichtbares über dem Boden. Im Bild davor ist er am schnellsten und deshalb rund oder gestreckt.

  ## Der Aufprall: Kontakt, Rückprall, Ausschwingen

  Ein Aufprall hat eine feste Abfolge. Das letzte Bild vor dem Boden ist das schnellste, gestreckt oder rund. Im **Kontaktbild** berührt der Ball den Boden und ist am stärksten gestaucht. Dann folgt der **Rückprall**: gestreckt nach oben, langsamer werdend bis zum Scheitel. Danach fällt er wieder, prallt kleiner auf, und so weiter, bis er liegt. Das letzte Stück, in dem eine Bewegung immer kleiner wird und zur Ruhe kommt, heißt **Ausschwingen** (Settle).

  Wie hoch ein Ball zurückspringt, beschreibt die Physik mit der Stoßzahl (Coefficient of Restitution). Sie hängt von Ball und Boden gemeinsam ab, und für einen fallen gelassenen Ball ist sie die Wurzel aus dem Verhältnis von Rückprallhöhe zu Fallhöhe ([Coefficient of restitution](https://en.wikipedia.org/wiki/Coefficient_of_restitution)). Für die Animation reicht das Verhältnis der Höhen. Ein Beispiel dafür steht im selben Artikel: Ein Basketball muss nach den Regeln der FIBA aus 1800 mm Fallhöhe auf 1035 bis 1085 mm zurückspringen, also auf knapp 60 % ([Application in sports](https://en.wikipedia.org/wiki/Coefficient_of_restitution#Application_in_sports)).

  Mit einem Faktor von 0,6 und 48 Pixeln Fallhöhe rechnet das Modell jede Rückprallhöhe aus, bis sie unter ein Pixel fällt. Weil die Fallzeit mit der Wurzel der Höhe wächst (Weg ∝ Zeit², siehe Galilei in [Timing und Spacing](/animation/timing-spacing)), rechnet es auch aus, wie viele Bilder der Fall dauert, wenn der erste 8 Bilder braucht:

  ```python run
  from math import sqrt
  h = 48.0  # Fallhöhe, px
  while h >= 1:
      f = 8 * sqrt(h / 48)
      f = round(f)
      h1 = round(h, 1)
      print(h1, f)
      h = h * 0.6
  ```

  Die Sprünge werden flacher und kürzer: von 8 Bildern pro Fall auf 6, 5, 4 und schließlich eines. Nach acht Aufprallen ist der Ball weniger als ein Pixel hoch, in einem Sprite also in Ruhe. Mit Faktor 0,8 hüpft er länger, mit 0,1 bleibt er fast sofort liegen. Welcher Faktor zu welchem Material passt, entscheidest du und prüfst es am Zuschauer.

  Für drei Bälle gleicher Größe könnte ein Plan so aussehen. Die Werte sind Entscheidungen, keine Messungen:

  ```text
           Stauchung  Faktor Ruhe
  Gummi    stark      0,7    spät
  Bowling  kaum       0,05   sofort
  Wasser   sehr stark 0,1    wackelt
  ```

  Der Wasserballon braucht ein eigenes Ausschwingen: Er liegt schon, aber seine Form schwingt noch zwischen breit und hoch hin und her, mit kleiner werdendem Ausschlag. Der Wikipedia-Artikel zu Follow-through beschreibt Ähnliches für Körper: Teile mit viel Gewebe bewegen sich eigenständiger als knochige ([Follow through and overlapping action](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Follow_through_and_overlapping_action)). Wie man so ein Nachschwingen plant, steht in [Bögen, Nachziehen und Überlappung](/animation/boegen-ueberlappung).

  > [!PRAXIS] Gleiche Bilder, andere Haltezeiten
  > Tyriq Plummer zeigt in seinem GDC-Vortrag über 2D-Animation für Spiele dieselben Zeichnungen mit verschiedenen Haltezeiten und beschreibt, dass die Fassung mit längeren Haltezeiten schwerer wirkt ([2D Animation for Games: A Primer](https://www.youtube.com/watch?v=PKZJmHrG4Yw&t=1162s), ab 19:22). Für deine Bowlingkugel heißt das: Das Kontaktbild und die Ruhe danach dürfen lange stehen. Ob es bei deinem Zuschauer so ankommt, prüfst du im Beobachtungstest.

  Auch die Umgebung kann Gewicht zeigen. Medeiros erinnert bei Sprüngen an Staub und Partikel („Don't forget dust and particles!“, [Jump](https://saint11.art/blog/pixel-art-tutorials/#Jump)) und bei Treffern daran, das getroffene Objekt reagieren zu lassen ([Impact](https://saint11.art/blog/pixel-art-tutorials/#Impact)). Eine Staubwolke, ein Brett, das nachfedert, ein Gegenstand, der vom Tisch hüpft: All das sind Mittel, um zu zeigen, wie viel da gelandet ist.

  > [!NOTE] Einfrieren und Wackeln
  > Bildschirmwackeln und das kurze Einfrieren beim Treffer (Hitstop) sind Werkzeuge des Spiels, nicht der Zeichnung. Sie stehen in [Trefferfeedback](/combat/trefferfeedback).

  ## Eine Figur trägt Gewicht

  Hebt eine Figur etwas, zeigt sich das Gewicht der Last an der Figur. Bei einer schweren Last braucht sie länger, bis sich etwas bewegt: Sie greift, spannt an, und erst dann löst sich die Last vom Boden, langsam. Ihr Körper geht tiefer, die Hüfte weiter nach hinten (die Rechnung dazu steht in [Schwerpunkt, Gleichgewicht und Bodenkontakt](/animation/schwerpunkt-balance)). Wie Ausholen und Vorbereitung als Antizipation gezeichnet werden, vertieft [Antizipation, Aktion, Erholung](/animation/antizipation-erholung).

  Dieselben vier Zeichnungen einer Gliederpuppe, die eine Kiste hebt, können mit verschiedenen Dauern Verschiedenes zeigen:

  ```text
  Dauer in ms
  Bild  Pose           leicht schwer
   1    greift            100    300
   2    Kiste hebt ab      50    250
   3    Kiste am Bauch     50    150
   4    steht, trägt      200    400
  ```

  In der leichten Fassung liegt die Zeit am Ende, die Kiste fliegt fast hoch. In der schweren liegt sie am Anfang, beim Greifen und Anheben. Das folgt dem Satz von Thomas und Johnston: Leichtes reagiert schneller. Ob ein Zuschauer die schwere Fassung als schwer liest oder als zögerlich, sagt dir erst der **Beobachtungstest**: ohne Vorrede zeigen, „Was passiert da?“ fragen, die Antwort wörtlich notieren. Möglicherweise braucht „schwer“ neben dem Timing auch die tiefere Haltung.

  Ein klassisches Übungsobjekt für Gewicht ohne Gesicht ist der **Mehlsack**. Medeiros empfiehlt am Ende seines Aseprite-Artikels „the classic beginner's exercise of making an animated flour sack walking and jumping around“ ([A Basic Aseprite Animation](https://saint11.art/pixel_art_articles/article3/#now-what)). Ein Sack, der nach einem Sprung landet, staucht sich, sackt nach und schwingt aus, und alles, was er erzählt, steckt in Verformung und Timing.

  > [!INTERVIEW]
  > „Wie zeigst du, dass ein Ball schwer ist, ohne ihn größer zu zeichnen?“ Gute Antwort: Nicht über den Fall, denn schwere und leichte Bälle fallen gleich schnell. Ich zeige es beim Aufprall: wenig Verformung, wenig Rückprall, ein langes Kontaktbild und eine lange Ruhe danach, dazu eine Reaktion der Umgebung, etwa Staub oder ein nachfedernder Boden. Beim Verformen halte ich die Fläche konstant. Und ich prüfe mit einem Zuschauer, ob er den Ball wirklich als schwer liest.

  ## Häufige Fehler

  - **Gewicht über die Fallgeschwindigkeit.** Schwere und leichte Bälle fallen gleich schnell. Plan den Fall für beide gleich und zeig den Unterschied am Aufprall.
  - **Fläche nicht gehalten.** Der Ball wird breiter, aber nicht flacher, und wächst sichtbar. Breite mal Höhe nachrechnen, Pixel zählen.
  - **Stauchen in der Luft.** Gestaucht wird im Kontaktbild, nicht davor.
  - **Bowlingkugel wie Gummiball.** Gleiche Stauchung, gleicher Rückprall, gleiche Haltezeiten: Dann unterscheidet die beiden nur noch die Farbe.
  - **Rückprall ohne Verlust.** Ein Ball, der immer gleich hoch springt, ist eine Maschine. Jeder Rückprall ist niedriger und kürzer als der vorige.
  - **Kein Ende.** Ein Aufprall ohne Ausschwingen und Ruhe bricht ab. Die letzten Bilder, in denen fast nichts passiert, gehören dazu.
  - **Wirkung behauptet.** „Schwer“ steht im Absichtssatz, nicht in der Animation. Ob es ankommt, zeigt der Beobachtungstest.

  ## Zusammenfassung

  - Schwere und leichte Gegenstände fallen ohne Luftwiderstand gleich schnell. Gewicht zeigt sich beim Anfahren, beim Aufprall und beim Zur-Ruhe-Kommen.
  - Squash & Stretch ändert die Form, nicht die Fläche. In Pixeln: Breite mal Höhe nachrechnen und nachzählen.
  - Gestreckt im schnellsten Bild vor und nach dem Boden, gestaucht im Kontaktbild, nie in der Luft. Steife Dinge verformen sich kaum.
  - Jeder Rückprall erreicht einen festen Anteil der vorigen Höhe, ein Basketball knapp 60 %. Die Sprünge werden niedriger und kürzer, bis der Ball liegt.
  - Lange Haltezeiten nach dem Aufprall, wenig Verformung und wenig Rückprall sind Mittel für „schwer“; die Umgebung kann mitspielen.
  - Eine Figur zeigt Gewicht über Timing und Haltung: lange Vorbereitung, langsames Anheben, tiefer Körper. Ob es gelesen wird, prüft der Beobachtungstest.
exercises:
  - id: woran-gewicht
    type: choice
    title: Woran sieht man Gewicht?
    prompt: |
      Zwei Bälle gleicher Größe, gleicher Farbe, aus derselben Höhe fallen gelassen. Woran kann ein Zuschauer ablesen, welcher schwerer ist?
    options:
      - text: Wie stark sich der Ball beim Aufprall verformt.
        correct: true
        why: Material und Gewicht zeigen sich in der Stauchung. Ein harter, schwerer Ball verformt sich kaum.
      - text: Wie hoch er zurückspringt und wie schnell er zur Ruhe kommt.
        correct: true
        why: Der Rückprall ist eine Eigenschaft von Ball und Boden. Wenig Rückprall und eine schnelle Ruhe sind ein Mittel, um Schwere zu zeigen.
      - text: Wie lange er nach dem Aufprall liegt, bevor sich wieder etwas regt.
        correct: true
        why: Haltezeiten sind eines der billigsten Mittel. Tyriq Plummer beschreibt, dass dieselben Bilder mit längeren Haltezeiten schwerer wirken.
      - text: Wie schnell er fällt.
        correct: false
        why: Ohne nennenswerten Luftwiderstand fallen schwere und leichte Bälle gleich schnell. Das Spacing des Falls ist für beide gleich.
    explanation: |
      Der Fall verrät das Gewicht nicht, das hat der Hammer-Feder-Versuch auf dem Mond gezeigt. Gewicht zeigt sich an den Enden der Bewegung: beim Aufprall in Verformung und Rückprall, danach in der Haltezeit und im Ausschwingen. Deshalb planst du für zwei verschieden schwere Bälle denselben Fall und verschiedene Aufpralle.
    resources:
      - title: NASA · The Apollo 15 Hammer-Feather Drop
        url: https://nssdc.gsfc.nasa.gov/planetary/lunar/apollo_15_feather_drop.html

  - id: flaeche-halten
    type: choice
    title: Welche Stauchung passt?
    prompt: |
      Ein Ball ist 16 × 16 Pixel groß. Welche gestauchte Form behält ungefähr seine Fläche?
    options:
      - text: 20 × 13 Pixel
        correct: true
        why: 20 · 13 = 260, fast genau 16 · 16 = 256. Flacher und dafür breiter.
      - text: 20 × 16 Pixel
        correct: false
        why: Breiter, aber nicht flacher. Mit 320 Pixeln wächst der Ball um ein Viertel.
      - text: 16 × 12 Pixel
        correct: false
        why: Flacher, aber nicht breiter. Mit 192 Pixeln schrumpft er sichtbar.
      - text: 24 × 8 Pixel
        correct: false
        why: 192 Pixel, und die Form ist dreimal so breit wie hoch. Das ist eher ein Pfannkuchen als ein gestauchter Ball.
    explanation: |
      Beim Stauchen und Strecken ändert sich die Form, nicht die Menge. In einer Zeichnung heißt das: Breite mal Höhe bleibt ungefähr gleich. Medeiros nennt das die wichtigste Regel von Squash & Stretch, weil ein Ball sonst scheinbar wächst oder schrumpft. Für runde Formen zählst du die Pixel am Ende noch einmal nach.
    resources:
      - title: Saint11 · Squash and Stretch
        url: https://saint11.art/blog/pixel-art-tutorials/#Squash

  - id: aufprall-ordnen
    type: order
    title: Ein Aufprall in Phasen
    prompt: |
      Bring die Phasen eines Gummiballs, der aus der Höhe fällt und liegen bleibt, in die richtige Reihenfolge.
    lang: prose
    lines: |
      Letztes Bild vor dem Boden: am schnellsten, gestreckt.
      Kontaktbild: Der Ball berührt den Boden und ist am stärksten gestaucht.
      Erstes Bild nach oben: gestreckt, schnell.
      Scheitel des Rückpralls: rund, die Bilder liegen dicht.
      Zweiter, kleinerer Aufprall mit schwächerer Stauchung.
      Ausschwingen: kleine Hüpfer, dann liegt der Ball.
    explanation: |
      Vor und nach dem Boden ist der Ball am schnellsten, deshalb gestreckt. Im Kontaktbild kehrt er die Richtung um und staucht sich. Am Scheitel ist er langsam und rund. Jeder weitere Aufprall ist kleiner, und am Ende steht eine Ruhe, die zur Animation gehört.
    resources:
      - title: Saint11 · A Basic Aseprite Animation, Squash and Stretch
        url: https://saint11.art/pixel_art_articles/article3/#squash-and-stretch

  - id: ein-pixel-stauchung
    type: output
    title: Ein Pixel flacher
    prompt: |
      Was gibt das Programm aus?
    lang: python
    code: |
      flaeche = 16 * 16
      for h in (15, 14):
          print(h, round(flaeche / h))
    expected: |
      15 17
      14 18
    explanation: |
      256 / 15 = 17,07, gerundet 17. 256 / 14 = 18,29, gerundet 18. Schon ein Pixel weniger Höhe verlangt bei einem 16-Pixel-Ball ein Pixel mehr Breite. In Pixelart ist das die kleinste sichtbare Stauchung, und für einen harten Ball kann sie die einzige sein.
    resources:
      - title: Wikipedia · Twelve basic principles, Squash and stretch
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Squash_and_stretch

  - id: rueckprall-zweiter
    type: output
    title: Der zweite Rückprall
    prompt: |
      Ein Ball fällt aus 50 Pixeln Höhe. Jeder Rückprall erreicht 60 % der Höhe davor. Wie hoch steigt er nach dem zweiten Aufprall? Antworte mit der Zahl in Pixeln.
    lang: text
    code: |
      Fallhöhe       50 px
      Faktor         0,6
      1. Rückprall   ? px
      2. Rückprall   ? px
    expected: |
      18
    accept:
      - 18 px
      - 18 Pixel
      - "18.0"
    explanation: |
      Nach dem ersten Aufprall steigt der Ball auf 50 · 0,6 = 30 Pixel, nach dem zweiten auf 30 · 0,6 = 18. Der Faktor wirkt jedes Mal auf die vorige Höhe, nicht auf die Fallhöhe. Ein FIBA-Basketball erreicht etwa diesen Faktor. Für eine Bowlingkugel wählst du einen viel kleineren, für einen Flummi einen größeren.
    resources:
      - title: Wikipedia · Coefficient of restitution, Application in sports
        url: https://en.wikipedia.org/wiki/Coefficient_of_restitution#Application_in_sports

  - id: formen-eintragen
    type: gap
    title: Rund, gestreckt oder gestaucht?
    prompt: |
      Ein Gummiball fällt, prallt auf und steigt wieder. Trag für die markierten Bilder die Form ein: rund, gestreckt oder gestaucht.
    lang: text
    code: |
      Bild  Höhe  Form
       1     48   rund
       2     45   rund
       3     36   rund
       4     21   ⟦gestreckt⟧
       5      0   ⟦gestaucht⟧
       6     14   ⟦gestreckt⟧
       7     25   rund
       8     29   ⟦rund⟧
    gaps:
      - label: Bild 4
        hint: Das letzte und schnellste Bild vor dem Boden.
        accept: ["Stretch"]
      - label: Bild 5
        hint: Das Kontaktbild.
        accept: ["Squash"]
      - label: Bild 6
        hint: Das erste und schnellste Bild nach oben.
        accept: ["Stretch"]
      - label: Bild 8
        hint: Der Scheitel des Rückpralls.
    explanation: |
      Medeiros streckt den Ball im letzten Bild des Falls und im ersten des Aufstiegs, weil er dort am schnellsten ist, und staucht ihn im Kontaktbild. Am Scheitel ist der Ball langsam und bleibt rund. Die Bilder 1 bis 3 sind noch langsam genug für die runde Form. Wo die Grenze liegt, entscheidest du; die Reihenfolge rund, gestreckt, gestaucht, gestreckt, rund nicht.
    resources:
      - title: Saint11 · A Basic Aseprite Animation, Squash and Stretch
        url: https://saint11.art/pixel_art_articles/article3/#squash-and-stretch

  - id: begriffe-gewicht
    type: gap
    title: Fünf Wörter für Gewicht
    prompt: |
      Ergänze die fehlenden Begriffe.
    lang: prose
    code: |
      Verformung mit gleicher Fläche heißt ⟦Squash & Stretch⟧.
      Das Bild, in dem der Ball den Boden berührt, heißt ⟦Kontaktbild⟧.
      Das Hochspringen nach dem Aufprall heißt ⟦Rückprall⟧.
      Das Kleinerwerden der Bewegung, bis etwas liegt, heißt ⟦Ausschwingen⟧.
      Dass Schweres langsamer anfährt und anhält, liegt an seiner ⟦Trägheit⟧.
    gaps:
      - label: Stauchen und Strecken
        hint: Englisch, zwei Wörter mit S.
        accept: ["Squash and Stretch", "Squash und Stretch", "Stauchen und Strecken"]
      - label: Berührung
        hint: Englisch contact.
        accept: ["Kontakt", "Contact"]
      - label: Zurückspringen
        hint: Englisch rebound.
        accept: ["Abprall", "Rebound"]
      - label: Zur Ruhe kommen
        hint: Englisch settle.
        accept: ["Settle", "Auspendeln"]
      - label: Physik
        hint: Englisch inertia.
        accept: ["Masse", "Inertia"]
    explanation: |
      Squash & Stretch beschreibt die Verformung, Kontaktbild und Rückprall den Aufprall, das Ausschwingen sein Ende. Trägheit ist der Grund, warum Schweres langsamer reagiert, und damit der Grund für längere Haltezeiten und langsamere Starts. Mit diesen Wörtern lässt sich jeder Aufprall in einer Bildliste beschreiben.
    resources:
      - title: Wikipedia · Twelve basic principles, Timing
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Timing

  - id: kugel-als-gummiball
    type: bug
    title: „Ein Gummiball“
    prompt: |
      Diese Bildliste soll eine Bowlingkugel zeigen, die auf einen Holzboden fällt. Drei Zuschauer sagen ohne Vorrede: „Ein Gummiball.“ Finde die Zeilen, die das verursachen.
    lang: text
    code: |
      Bild  Höhe  B x H    Dauer
       1     48   16x16    50 ms
       2     37   16x16    50 ms
       3     21   16x16    50 ms
       4      0   22x12    50 ms
       5     28   16x16    50 ms
       6      0   16x16   400 ms
    lines: [5, 6]
    hints:
      - Der Fall ist für schwere und leichte Bälle gleich. Such nach dem Bild am Boden und dem danach.
    explanation: |
      Bild 4 staucht die Kugel auf 22 × 12, so stark wie einen Gummiball; eine harte Kugel verformt sich kaum, etwa 17 × 15 oder gar nicht. Bild 5 lässt sie auf 28 von 48 Pixeln zurückspringen, fast 60 % wie ein Basketball. Die Fallbilder 1 bis 3 sind richtig: Die Abstände 11, 16 und 21 wachsen gleichmäßig, und schwer und leicht fallen gleich. Für eine Bowlingkugel bleiben die Stauchung klein und der Rückprall winzig, und das Kontaktbild darf länger stehen.
    resources:
      - title: Saint11 · Squash and Stretch
        url: https://saint11.art/blog/pixel-art-tutorials/#Squash

  - id: stauchen-in-der-luft
    type: bug
    title: Gegen eine unsichtbare Wand
    prompt: |
      Ein Gummiball fällt auf den Boden. Zuschauer sagen, er pralle kurz über dem Boden gegen etwas, bevor er landet. Finde die Zeile und korrigiere die Form.
    lang: text
    code: |
      Bild  Höhe  Form
       1     48   rund
       2     37   rund
       3     21   gestaucht
       4      0   gestaucht
       5     14   gestreckt
    lines: [4]
    fix:
      - line: 4
        answers:
          - " 3     21   gestreckt"
          - " 3     21   rund"
    explanation: |
      In Bild 3 ist der Ball noch 21 Pixel über dem Boden, aber schon gestaucht. Stauchung zeigt einen Widerstand, und hier gibt es keinen; das Auge sucht deshalb etwas Unsichtbares. Im letzten Bild vor dem Boden ist der Ball am schnellsten und gehört gestreckt oder rund. Gestaucht wird er erst im Kontaktbild 4.
    resources:
      - title: Saint11 · A Basic Aseprite Animation, Squash and Stretch
        url: https://saint11.art/pixel_art_articles/article3/#squash-and-stretch

  - id: zwei-baelle-erklaeren
    type: explain
    title: Gleicher Fall, anderer Aufprall
    prompt: |
      Zwei Bildlisten für Bälle gleicher Größe. Erkläre in wenigen Sätzen, welche Unterschiede das Gewicht zeigen sollen und warum die ersten beiden Bilder in beiden gleich sind.
    lang: text
    code: |
      Gummiball
      Bild  Höhe  B x H   Dauer
       1     48   16x16   50 ms
       2     36   14x18   50 ms
       3      0   20x13   50 ms
       4     19   14x18   50 ms
       5     29   16x16  100 ms

      Bowlingkugel
      Bild  Höhe  B x H   Dauer
       1     48   16x16   50 ms
       2     36   16x16   50 ms
       3      0   17x15  150 ms
       4      2   16x16   50 ms
       5      0   16x16  400 ms
    points:
      - Der Fall (Bild 1 und 2) ist gleich, weil schwere und leichte Gegenstände gleich schnell fallen.
      - Der Gummiball staucht sich stark (20 × 13), die Kugel kaum (17 × 15); in beiden Fällen bleibt die Fläche etwa gleich.
      - Der Gummiball springt auf 29 von 48 Pixeln zurück, die Kugel nur auf 2.
      - Die Kugel bleibt lange im Kontaktbild (150 ms) und liegt danach lange still (400 ms); diese Haltezeiten sollen Schwere zeigen.
      - Der Gummiball ist im schnellsten Bild vor und nach dem Boden gestreckt, die Kugel nicht, weil sie steif ist.
    explanation: |
      Beide Listen teilen den Fall, denn das Gewicht ändert das Fallen nicht. Die Unterschiede beginnen am Boden. Der Gummiball verformt sich stark, streckt sich vor und nach dem Kontakt und springt auf rund 60 % zurück, alles in kurzen Bildern. Die Kugel staucht sich um ein Pixel, hüpft kaum und steht lange im Kontaktbild und in der Ruhe. Ob ein Zuschauer daraus „schwer“ liest, ist eine Frage für den Beobachtungstest, nicht für die Bildliste.
    resources:
      - title: Tyriq Plummer · 2D Animation for Games, A Primer (ab 19:22)
        url: https://www.youtube.com/watch?v=PKZJmHrG4Yw&t=1162s

  - id: drei-baelle
    type: practice
    title: Gummi, Bowling, Wasser
    prompt: |
      Plane drei Bälle gleicher Größe, die aus derselben Höhe auf denselben Boden fallen: einen Gummiball, eine Bowlingkugel und einen Wasserballon. Schreib für jeden einen Absichtssatz und eine Bildliste mit Höhe, Breite × Höhe und Dauer. Zeichne sie auf Haftzettel oder als Spacing-Chart. Zeig sie jemandem nacheinander ohne Vorrede und frag zu jedem: „Was passiert da?“ Danach, wenn du magst: „Woraus könnte der Ball sein?“
    lang: prose
    starter: |
      Gummiball, Absichtssatz und Bildliste:
      Bowlingkugel, Absichtssatz und Bildliste:
      Wasserballon, Absichtssatz und Bildliste:
      Zuschauer zu Ball 1, 2, 3 (wörtlich):
      Abweichung von meiner Absicht:
    checklist:
      - Die Fallbilder sind bei allen drei Bällen gleich, Höhen und Dauern.
      - In jeder gestauchten oder gestreckten Form weicht Breite mal Höhe höchstens 10 % von der runden Form ab.
      - Gestaucht wird nur im Kontaktbild, nie in einem Bild über dem Boden.
      - Die drei Bälle unterscheiden sich in mindestens zwei Größen nach dem Kontakt (Stauchung, Rückprall, Haltezeit, Ausschwingen).
      - Die Antworten des Zuschauers stehen wörtlich da; ohne Zuschauer hast du nach einer Nacht Abstand selbst geprüft und das markiert.
    hints:
      - Leg zuerst den Fall einmal fest und kopier ihn dreimal. Ändere nur, was ab dem Kontaktbild passiert.
    explanation: |
      Die Übung zwingt dich, Gewicht dort zu zeigen, wo es sichtbar wird: ab dem Kontaktbild. Weil der Fall gleich bleibt, kann der Zuschauer die Bälle nur am Aufprall unterscheiden. Seine Antworten zeigen dir, welches Mittel bei ihm ankommt. Weicht eine Antwort ab, ändere eine Größe und frag erneut, statt alles auf einmal umzubauen.
    resources:
      - title: Wikipedia · Coefficient of restitution
        url: https://en.wikipedia.org/wiki/Coefficient_of_restitution

  - id: leichte-schwere-kiste
    type: practice
    title: Leicht oder schwer gehoben
    prompt: |
      Zeichne vier Thumbnails einer Gliederpuppe, die eine Kiste vom Boden hebt. Plane dazu zwei Fassungen: eine für eine leichte, eine für eine schwere Kiste. Ändere zuerst nur die Dauern. Zeig beide Fassungen als Daumenkino ohne Vorrede und frag: „Was passiert da?“ Wenn die schwere Fassung nicht als schwer gelesen wird, ändere in einer dritten Fassung zusätzlich die Haltung und teste erneut.
    lang: prose
    starter: |
      Absichtssatz leicht:
      Absichtssatz schwer:
      Thumbnails (Bild, Pose):
      Dauern leicht / schwer:
      Zuschauer zu leicht (wörtlich):
      Zuschauer zu schwer (wörtlich):
      Fassung 3, was geändert, Zuschauer sagt:
    checklist:
      - Fassung 1 und 2 nutzen dieselben vier Zeichnungen, nur die Dauern unterscheiden sich.
      - In der schweren Fassung liegt mehr Zeit beim Greifen und Anheben als in der leichten.
      - Jede Fassung hat einen eigenen Absichtssatz, geschrieben vor dem Test.
      - Die Antworten stehen wörtlich da; ohne Zuschauer hast du nach einer Nacht Abstand selbst geprüft und das markiert.
      - Falls es eine dritte Fassung gibt, ist notiert, welche Zeichnung du geändert hast und warum.
    hints:
      - Leichtes reagiert schneller, Schweres langsamer. Verschieb die Zeit zwischen Anfang und Ende der Bewegung.
    explanation: |
      Die Übung trennt die Wirkung des Timings von der Wirkung der Haltung. Oft reicht Timing allein nicht: Eine langsame Bewegung kann auch als zögerlich oder müde gelesen werden. Animatoren nehmen deshalb oft eine tiefere, angestrengte Haltung dazu; ob das Bild dadurch eindeutiger wird, zeigt dir die dritte Fassung im Test. Was dein Zuschauer sagt, ist die Grundlage für die nächste Fassung, nicht ein Urteil über die erste.
    resources:
      - title: Wikipedia · Twelve basic principles, Timing
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Timing
