lesson: |
  Du hast einen Ball gezeichnet, der hüpft: acht Bilder, jedes 100 ms lang, die Abstände zwischen den Zeichnungen gleich groß. Er bewegt sich, aber er fällt nicht. Er schwebt auf und ab wie an einem Faden. An den Zeichnungen liegt es nicht, jede für sich ist ein runder Ball. Es liegt an zwei Zahlen, die du nicht bewusst gewählt hast: wie lange jede Zeichnung steht und wie weit sie von der vorigen entfernt ist.

  Diese beiden Zahlen heißen Timing und Spacing. Sie entscheiden, ob etwas beschleunigt oder bremst, ob eine Figur zögert oder zuschlägt. Diese Lektion trennt sie, zeigt, wie du sie auf Papier planst, und rechnet sie in die Takte um, in denen dein Spiel läuft. Alles hier geht unterwegs, mit Bleistift, Karopapier und dem Handy.

  ## Timing und Spacing: zwei verschiedene Fragen

  **Timing** ist die Zeit, die eine Bewegung bekommt: wie viele Bilder, wie viele Millisekunden. Frank Thomas und Ollie Johnston zählen es in *The Illusion of Life* (1981) zu den zwölf Grundprinzipien der Animation. Timing ist dort die Zahl der Zeichnungen für eine Handlung, und sie bestimmt das Tempo auf der Leinwand ([Twelve basic principles: Timing](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Timing)). **Spacing** ist der Abstand zwischen den Zeichnungen, also wie weit sich etwas von einem Bild zum nächsten bewegt. Der Pixelartist Pedro Medeiros (Saint11) fasst es in einem Satz: „The distance between drawings gives us the feeling of acceleration“ ([Easings](https://saint11.art/blog/pixel-art-tutorials/#Easings)).

  Ein Ball rollt in fünf Bildern von A nach B, jedes Bild gleich lang. Jeder Strich `|` ist eine Zeichnung:

  ```text
  A                           B
  |------|------|------|------|
  1      2      3      4      5
  ```

  Gleiche Abstände bei gleicher Dauer bedeuten ein konstantes Tempo. So bewegt sich ein Förderband, kein Ball. Dieselben fünf Bilder in derselben Gesamtzeit, anders verteilt:

  ```text
  A                           B
  |-|----|--------|-----------|
  1 2    3        4           5
  ```

  Jetzt liegen die ersten Zeichnungen dicht beieinander und die letzten weit auseinander: Der Ball beschleunigt. Gleiche Gesamtzeit, gleiche Bildzahl, andere Bewegung. Deshalb planst du beides getrennt. Die Dauer sagt, wie lange etwas dauert, der Abstand sagt, wie es sich dabei bewegt.

  > [!MERKE]
  > Timing: wie lange. Spacing: wie weit von Bild zu Bild. Dicht beieinander heißt langsam, weit auseinander heißt schnell.

  ## Haltezeiten, Einsen und Zweien

  Film läuft mit 24 Bildern pro Sekunde. Zeichentrickfilme zeichnen trotzdem selten 24 Zeichnungen pro Sekunde. Meist steht jede Zeichnung zwei Filmbilder lang. Das heißt „auf Zweien“ (on twos) und ergibt 12 Zeichnungen pro Sekunde. Schnelle Bewegungen kommen „auf Einsen“, langsame auch auf Dreien oder Vieren ([Inbetweening: Frame frequency](https://en.wikipedia.org/wiki/Inbetweening#Frame_frequency)).

  Pixelart-Editoren lassen jedes Bild verschieden lang stehen. In Aseprite und LibreSprite hat jedes Bild eine Dauer in Millisekunden, in Aseprite unter *Frame → Frame Properties*, Kürzel P ([Frame Duration](https://www.aseprite.org/docs/frame-duration/)). Pixelorama rechnet wie Godot mit einer Bildrate und einem Faktor je Bild ([Timeline: Frames](https://www.pixelorama.org/user_manual/user_interface/timeline#frames)). Krita zählt in Bildern einer festen Bildrate und hält jede Zeichnung, bis die nächste kommt ([Animation Timeline](https://docs.krita.org/en/reference_manual/dockers/animation_timeline.html#overview)). Die Bedienung steht in [Einzelbilder im Editor](/animation/editor-zeitleiste). Das Ergebnis ist überall dasselbe: Nicht jede Zeichnung muss gleich lang stehen.

  Eine Bildliste, auch Belichtungsblatt genannt, hält das fest. Ein Sprung mit fünf Zeichnungen:

  ```text
  Bild  Dauer   Pose
   1    200 ms  Hocke (Key)
   2     50 ms  Absprung
   3     50 ms  Streckung
   4    150 ms  Scheitel (Key)
   5    250 ms  Landung (Key)
  ```

  Die Schlüsselposen (Keys) stehen lange, damit das Auge sie liest. Die Zwischenbilder huschen vorbei. Sie zeigen den Weg, einzeln erkennen muss man sie nicht. Eine **Haltezeit** (Hold) ist genau das: eine Zeichnung, die länger stehen bleibt als ihre Nachbarn.

  > [!PRAXIS] Keys halten, Wischbilder kurz
  > Bei wenigen Zeichnungen ist die Dauer das billigste Werkzeug, das du hast: Eine Haltezeit kostet keine neue Zeichnung. Sprite-Animatoren halten deshalb die Schlüsselposen länger und lassen schnelle Zwischenbilder wie Wischbilder (Smears) nur kurz stehen, so beschreibt es Mariel Cartwright für Skullgirls ([GDC 2014, ab 11:59](https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=719s)); mehr in [Anatomie eines Angriffs](/combat/angriffsphasen).

  > [!TIP] Daumenkino im Bus
  > Ein Block Haftzettel ist ein Animationsprogramm ohne Akku. Zeichne auf das letzte Blatt zuerst, eine Zeichnung pro Blatt, und blättere mit dem Daumen von hinten nach vorn. Eine Haltezeit baust du, indem du dieselbe Zeichnung auf zwei oder drei Blätter überträgst.

  ## Spacing-Charts: Ease-in und Ease-out planen

  Animatoren notieren das Spacing zwischen zwei Keys als kleines Diagramm, den **Spacing-Chart** (oft auch Timing-Chart genannt): eine Linie von Key zu Key, ein Strich für jede Zeichnung. Thomas und Johnston nennen das Prinzip dahinter *slow in and slow out*. Körper brauchen Zeit, um zu beschleunigen und abzubremsen, deshalb liegen am Anfang und am Ende einer Bewegung mehr Zeichnungen als in der Mitte ([Slow in and slow out](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Slow_in_and_slow_out)). In der Animation heißt das Abbremsen in einen Key hinein **Ease-in** und das Anfahren aus einem Key heraus **Ease-out**. Vorsicht: Godots `Tween` und CSS benennen es umgekehrt, dort startet `EASE_IN` bzw. `ease-in` langsam und wird schneller ([Tween: EASE_IN](https://docs.godotengine.org/en/stable/classes/class_tween.html#class-tween-constant-ease-in), [MDN: ease-in](https://developer.mozilla.org/en-US/docs/Web/CSS/easing-function#ease-in)).

  Ein Abbremsen planst du klassisch durch Halbieren. Jedes Zwischenbild liegt in der Mitte zwischen dem vorigen und dem Ziel:

  ```python run
  # Keys A und B in Pixeln
  a, b = 0, 64
  x = a
  for i in range(1, 5):
      x = (x + b) / 2
      print(i, x)
  ```

  Die Abstände sind 32, 16, 8 und 4 Pixel, das letzte Stück bis B noch einmal 4. Als Chart, ein Zeichen für 2 Pixel:

  ```text
  |---------------|-------|---|-|-|
  A               1       2   3 4 B
  ```

  Ein Anfahren aus A ist das Spiegelbild. Für eine Bewegung, die anfährt und abbremst, halbierst du von beiden Keys zur Mitte hin. Eine Hand, die auf etwas zeigt, ein Kopf, der sich dreht, eine Tür, die zufällt: Fast alles beschleunigt und bremst. Ob ein Key mit Ease erreicht wird oder hart, entscheidest du. Der nächste Abschnitt zeigt einen Fall, in dem ein Ease falsch ist.

  ## Der fallende Ball: Die Physik liefert das Spacing

  Ein losgelassener Ball legt in gleichen Zeitabschnitten Wege zurück, die sich wie 1 : 3 : 5 : 7 verhalten. Galileo Galilei hat das 1638 in den *Discorsi* beschrieben: Die Wege in gleichen Zeitabschnitten verhalten sich „as the odd numbers beginning with unity“ ([Two New Sciences, Third Day](https://galileoandeinstein.phys.virginia.edu/tns_draft/tns_153to160.html)). Der Grund: Die Geschwindigkeit wächst gleichmäßig, also wächst auch der Weg pro Bild jedes Mal um dieselbe Menge.

  ```python run
  # Weg seit dem Loslassen
  vorher = 0
  for bild in range(1, 6):
      weg = bild * bild
      print(bild, weg,
            weg - vorher)
      vorher = weg
  ```

  Die dritte Spalte ist das Spacing: 1, 3, 5, 7, 9. Ein Pixelball, der in vier Schritten 48 Pixel fällt, liegt deshalb 3, 12, 27 und 48 Pixel unter dem Start, mit Abständen von 3, 9, 15 und 21 Pixeln. Als Höhe über dem Boden, ein `#` für 3 Pixel:

  ```text
  Bild  Höhe
   1    ################  48
   2    ###############   45
   3    ############      36
   4    #######           21
   5                       0
  ```

  In ganzen Pixeln wird daraus oft eine einfachere Reihe. Medeiros lässt den Ball in seinem Aseprite-Beispiel 4, 3, 2 und 1 Pixel steigen und hält ihn oben ein Bild lang ([A Basic Aseprite Animation](https://saint11.art/pixel_art_articles/article3/#timing)). Sakurai beschreibt für Sprünge dieselbe Idee: Die Schwerkraft ändert die Geschwindigkeit in jedem Frame um denselben Betrag ([Jump Physics](https://www.youtube.com/watch?v=noKsDZ-UPq8&t=21s), ab 0:21). Ob 1, 3, 5, 7 oder 1, 2, 3, 4: Gleichmäßig beschleunigt ist eine Bewegung, wenn der Abstand von Bild zu Bild immer um denselben Betrag wächst.

  Oben am Scheitel liegen die Zeichnungen dicht, unten weit auseinander. Ein hüpfender Ball bekommt sein Ease von der Schwerkraft: Er bremst zum höchsten Punkt hin ab und fährt aus ihm heraus wieder an. Am Boden gibt es dagegen kein Ease. Der Ball ist im Bild vor dem Kontakt am schnellsten und wechselt im Kontaktbild die Richtung. Wer hier aus Gewohnheit abbremst, setzt den Ball sanft ab, statt ihn aufprallen zu lassen. Wie der Aufprall selbst aussieht, mit Stauchen und Rückprall, steht in [Gewicht zeigen](/animation/gewicht-aufprall).

  > [!NOTE]
  > Ohne Luftwiderstand fallen schwere und leichte Bälle gleich schnell. Das Spacing des Falls verrät das Gewicht also nicht. Gewicht zeigt sich beim Aufprall, beim Rückprall und darin, wie schwer sich etwas in Bewegung setzen lässt; auch das steht in [Gewicht zeigen](/animation/gewicht-aufprall).

  ## Millisekunden und Spiel-Ticks

  Dein Spiel zeigt ein Bild nicht zu beliebigen Zeitpunkten. Godot rechnet die Physik standardmäßig 60-mal pro Sekunde, und ein 60-Hz-Bildschirm wechselt sein Bild 60-mal pro Sekunde ([Idle and Physics Processing](https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html)). Ein solcher Takt, ein **Tick**, dauert rund 16,7 ms. Eine Zeichnung ist im Spiel deshalb immer eine ganze Zahl von Ticks lang zu sehen. Liegt deine Dauer dazwischen, rundet das Spiel, und zwar nicht jedes Mal gleich. Das Modell hier rechnet für jede von fünf Zeichnungen den Tick `e`, in dem sie vorbei ist, und gibt aus, wie viele Ticks sie stand:

  ```python run
  from math import ceil

  tick = 1000 / 60   # ms
  ms = 80            # je Bild
  vorher = 0
  for n in range(1, 6):
      e = ceil(n * ms / tick)
      print(n, e - vorher)
      vorher = e
  ```

  Setz `ms` auf 100 oder 50 und lass den Block erneut laufen. 100 ms sind genau 6 Ticks, 50 ms genau 3. 80 ms sind 4,8 Ticks: Vier Zeichnungen stehen 5 Ticks, die fünfte nur 4. In einem gleichmäßigen Zyklus kann daraus ein kleines Stolpern im Takt werden. Ob du es siehst, prüfst du in [der Testszene](/animation/testszene), die jeden Bildwechsel mit seinem Tick protokolliert. Dauern, die aufgehen:

  ```text
  Ticks  genau     im Editor
    3     50 ms     50 ms
    4     66,7 ms   67 ms
    5     83,3 ms   83 ms
    6    100 ms    100 ms
    9    150 ms    150 ms
   12    200 ms    200 ms
  ```

  Bei 67 und 83 ms rundet schon der Editor, weil er ganze Millisekunden speichert. In Godot trägst du dann die gemeinten Ticks ein, etwa 12 FPS für 5 Ticks pro Bild; wie, zeigt [die Testszene](/animation/testszene). Film-Timing passt übrigens nicht: Auf Einsen bei 24 Bildern pro Sekunde steht jede Zeichnung 41,7 ms, also 2,5 Ticks. Animierst du in einem Programm mit Zeitleiste wie Krita, stell die Bildrate auf einen Teiler von 60: 12, 15, 20, 30 oder 60. Auf Bildschirmen mit 144 Hz rundet Godot auf deren Bildwechsel; die Details stehen in [Bildrate und Simulation](/godot/bildrate-simulation).

  ## Timing verändert, was eine Bewegung erzählt

  Dieselben Zeichnungen können Verschiedenes erzählen. Thomas und Johnston halten Timing für entscheidend, um Stimmung, Gefühl und Reaktion einer Figur zu zeigen ([Timing](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Timing)). Ein neutrales Beispiel: Eine Gliederpuppe dreht den Kopf von links nach rechts, drei Zeichnungen, zwei Bildlisten.

  ```text
  Fassung A        Fassung B
  Bild  Dauer      Bild  Dauer
   1    400 ms      1    150 ms
   2     50 ms      2    450 ms
   3    400 ms      3    150 ms
  ```

  In A springt der Kopf von einer Seite zur anderen, die Mitte huscht vorbei. In B verweilt er in der Mitte. Ob A wie ein schneller Blick wirkt und B wie Zögern, weißt du erst, wenn es jemand anderes sieht. Animatoren setzen solche Unterschiede bewusst ein, garantieren kann die Wirkung keiner. Deshalb gehören zu jeder Timing-Entscheidung zwei Dinge. Der **Absichtssatz** sagt vorher in einem Satz, was ein Zuschauer lesen soll. Im **Beobachtungstest** zeigst du beide Fassungen ohne Vorrede, fragst „Was passiert da?“ und schreibst die Antworten wörtlich auf. Wie man fragt, ohne die Antwort vorzugeben, steht in [Körpersprache und Zustandswechsel](/animation/koerpersprache).

  > [!INTERVIEW]
  > „Was ist der Unterschied zwischen Timing und Spacing?“ Gute Antwort: Timing ist, wie lange eine Bewegung dauert und wie lange jede Zeichnung steht. Spacing ist, wie weit die Zeichnungen auseinanderliegen. Bei gleichem Timing macht das Spacing aus einer gleichmäßigen Bewegung eine, die beschleunigt oder bremst. In Pixelart kommt dazu, dass jedes Bild seine eigene Dauer haben kann und dass im Spiel jede Dauer auf ganzen Ticks landet.

  ## Häufige Fehler

  - **Alle Bilder gleich lang.** Eine einheitliche Dauer ist eine Voreinstellung, keine Entscheidung. Keys länger, Zwischenbilder kürzer.
  - **Gleichmäßiges Spacing überall.** Es wirkt mechanisch. Frag bei jeder Bewegung, wo sie beschleunigt und wo sie bremst.
  - **Ease in den Aufprall.** Ein Ball, der vor dem Boden langsamer wird, landet nicht, er setzt auf.
  - **Timing geändert, Spacing gemeint.** Ruckelt eine Bewegung, weil ein Abstand doppelt so groß ist wie seine Nachbarn, hilft eine längere Dauer nicht. Erst den Chart ansehen.
  - **Dauern zwischen den Ticks.** 80 ms ergeben 4,8 Ticks, und eine von fünf Zeichnungen steht kürzer. 50, 100 und 150 ms gehen genau auf.
  - **24 Bilder pro Sekunde übernommen.** 41,7 ms pro Zeichnung sind 2,5 Ticks. Für ein Spiel mit 60 Ticks passen 12, 15, 20, 30 oder 60.
  - **Wirkung behauptet statt geprüft.** „Langsam wirkt traurig“ ist eine Konvention, kein Gesetz. Prüf es mit einem Zuschauer.

  ## Zusammenfassung

  - Timing ist die Dauer, Spacing der Abstand zwischen den Zeichnungen. Beide planst du getrennt.
  - Dicht beieinander heißt langsam, weit auseinander schnell. Ease-in und Ease-out legen mehr Zeichnungen an Ende und Anfang einer Bewegung.
  - Klassisch steht eine Zeichnung auf Zweien, 12 pro Sekunde. In Pixelart hat jedes Bild eine eigene Dauer: Keys lang, Zwischenbilder kurz.
  - Ein fallender Ball legt Wege im Verhältnis 1 : 3 : 5 : 7 zurück. Am Scheitel liegen die Zeichnungen dicht, am Boden weit, und in den Aufprall gehört kein Ease.
  - Im Spiel landet jede Dauer auf ganzen Ticks zu 16,7 ms. 50, 100 und 150 ms gehen genau auf, 80 ms nicht.
  - Timing verändert, was eine Bewegung erzählt. Ob sie es beim Zuschauer tut, zeigt erst der Beobachtungstest.
exercises:
  - id: timing-oder-spacing
    type: choice
    title: Dauer oder Abstand?
    prompt: |
      Welche Aussagen beschreiben Spacing?
    options:
      - text: Die Zeichnungen am Anfang einer Bewegung liegen enger beieinander als am Ende.
        correct: true
        why: Das ist der Abstand von Zeichnung zu Zeichnung, also Spacing. Hier beschleunigt die Bewegung.
      - text: Der Ball ist in Bild 4 doppelt so weit von Bild 3 entfernt wie Bild 3 von Bild 2.
        correct: true
        why: Auch das beschreibt Abstände zwischen den Zeichnungen. Bei gleicher Dauer heißt es, dass der Ball schneller wird.
      - text: Die Hocke vor dem Sprung steht 200 ms, die beiden Zwischenbilder je 50 ms.
        correct: false
        why: Das sind Dauern, also Timing. Wo die Zeichnungen liegen, sagt diese Angabe nicht.
      - text: Die ganze Bewegung dauert 600 ms und hat 8 Bilder.
        correct: false
        why: Gesamtdauer und Bildzahl sind Timing. Mit denselben 8 Bildern und 600 ms kann die Bewegung gleichmäßig sein, beschleunigen oder bremsen.
      - text: Die Animation läuft auf Zweien.
        correct: false
        why: Auf Zweien heißt, jede Zeichnung steht zwei Filmbilder lang. Das ist eine Angabe zur Dauer.
    explanation: |
      Timing beantwortet „wie lange“: Gesamtdauer, Bildzahl, Dauer pro Bild, auf Einsen oder Zweien. Spacing beantwortet „wie weit“: wie die Zeichnungen auf dem Weg verteilt sind. Beides zusammen ergibt die Geschwindigkeit in jedem Moment. Wer sie getrennt denkt, weiß bei einer Bewegung, die nicht stimmt, welche der beiden Zahlen er ändern muss.
    resources:
      - title: Wikipedia · Twelve basic principles, Timing
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Timing

  - id: ball-planen
    type: order
    title: Ein Hüpfer, Schritt für Schritt
    prompt: |
      Bring die Arbeitsschritte für einen Ball, der einmal auf den Boden fällt und abprallt, in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Absichtssatz schreiben: was ein Zuschauer lesen soll
      Keys festlegen: Startpunkt, Kontakt mit dem Boden, höchster Punkt danach
      Timing festlegen: wie viele Bilder und wie lange jedes steht
      Spacing-Chart zwischen den Keys zeichnen
      Zwischenbilder nach dem Chart zeichnen
      Abspielen und mit dem Absichtssatz vergleichen
    explanation: |
      Der Absichtssatz kommt zuerst, weil er der Maßstab für alles Weitere ist. Keys legen fest, wo die Bewegung hinwill, erst dann lohnt die Frage, wie lange sie dafür braucht. Der Chart braucht Keys und Bildzahl, und die Zwischenbilder brauchen den Chart. Wer Zwischenbilder ohne Chart zeichnet, landet fast immer bei gleichmäßigem Spacing.
    resources:
      - title: Wikipedia · Straight ahead action and pose to pose
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Straight_ahead_action_and_pose_to_pose

  - id: chart-lesen
    type: output
    title: Wo ist er am schnellsten?
    prompt: |
      Alle fünf Bilder stehen gleich lang. Zwischen welchen zwei Bildern bewegt sich der Ball am schnellsten? Antworte mit den beiden Nummern, etwa `1-2`.
    lang: text
    code: |
      A                           B
      |--|------|-----------|-----|
      1  2      3           4     5
    expected: |
      3-4
    accept:
      - 3 und 4
      - 3 4
      - 3–4
      - 3 - 4
      - 3 bis 4
      - zwischen 3 und 4
    explanation: |
      Bei gleicher Dauer pro Bild ist der größte Abstand die höchste Geschwindigkeit. Zwischen 3 und 4 liegen 12 Zeichen, mehr als zwischen allen anderen Paaren (3, 7 und 6). Die Bewegung fährt also an, ist in der Mitte am schnellsten und bremst zum Ende hin, nur nicht so gleichmäßig wie mit halbierten Abständen.
    resources:
      - title: Wikipedia · Slow in and slow out
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Slow_in_and_slow_out

  - id: halbieren-vorhersagen
    type: output
    title: Abbremsen durch Halbieren
    prompt: |
      Was gibt das Programm aus?
    lang: python
    code: |
      a, b = 0, 32
      x = a
      for zwischen in range(1, 4):
          x = (x + b) / 2
          print(zwischen, x)
    expected: |
      1 16.0
      2 24.0
      3 28.0
    explanation: |
      Jedes Zwischenbild liegt in der Mitte zwischen dem vorigen und dem Ziel: 16, dann 24, dann 28. Die Abstände halbieren sich (16, 8, 4), die Bewegung bremst in den Key B hinein. Das `.0` kommt von der Division mit `/`, die in Python immer eine Kommazahl liefert. Auf dem Papier legst du dieselben Punkte mit dem Lineal an: Mitte, Mitte der Mitte und so weiter.

  - id: ungerade-zahlen
    type: output
    title: Der dritte Schritt
    prompt: |
      Ein Ball fällt aus dem Stand, alle Bilder stehen gleich lang, und Bild 1 ist der Moment des Loslassens. Zwischen Bild 1 und Bild 2 legt er 2 Pixel zurück. Wie viele Pixel legt er zwischen Bild 3 und Bild 4 zurück, wenn du mit dem Verhältnis 1 : 3 : 5 : 7 aus der Lektion rechnest? Antworte mit der Zahl.
    lang: text
    code: |
      Bild 1 → 2   2 px
      Bild 2 → 3   ?
      Bild 3 → 4   ?
    expected: |
      10
    accept:
      - 10 px
      - 10 Pixel
    hints:
      - "Die Wege pro Bild verhalten sich wie 1 : 3 : 5 : 7."
    explanation: |
      Die Abstände wachsen wie die ungeraden Zahlen. Mit 2 Pixeln als Einheit sind das 2, 6 und 10 Pixel. Seit dem Loslassen hat der Ball dann 2, 8 und 18 Pixel zurückgelegt, also 2 mal 1, 4 und 9: Der Weg wächst mit dem Quadrat der Zeit. Auch die Reihe 2, 4, 6 wächst gleichmäßig, beginnt aber nicht im Moment des Loslassens; Pixelartists nutzen solche Reihen oft. Entscheidend ist in beiden Fällen, dass der Abstand von Bild zu Bild immer um denselben Betrag wächst.

  - id: ticks-zyklus
    type: output
    title: Fünf mal 80
    prompt: |
      Ein Zyklus hat 5 Bilder zu je 80 ms. Wie viele Ticks dauert ein ganzer Durchlauf bei 60 Ticks pro Sekunde? Antworte mit der Zahl.
    lang: text
    code: |
      Bild  1   2   3   4   5
      ms    80  80  80  80  80
    expected: |
      24
    accept:
      - 24 Ticks
    explanation: |
      5 × 80 ms sind 400 ms, und 400 ms × 60 / 1000 sind genau 24 Ticks. Auf die einzelnen Bilder lässt sich das nicht gleich verteilen, denn 24 / 5 = 4,8. Im Modell der Lektion stehen vier Bilder je 5 Ticks und eines 4. Mit 100 ms pro Bild wären es 30 Ticks, gleichmäßig 6 pro Bild.
    resources:
      - title: Godot Docs · Idle and Physics Processing
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html

  - id: begriffe-timing
    type: gap
    title: Fünf Wörter für den Werkzeugkasten
    prompt: |
      Ergänze die fehlenden Wörter.
    lang: prose
    code: |
      Steht jede Zeichnung zwei Filmbilder lang, animierst du auf ⟦Zweien⟧.
      Bei 24 Bildern pro Sekunde sind das ⟦12⟧ Zeichnungen pro Sekunde.
      Liegen Zeichnungen dicht beieinander, ist die Bewegung dort ⟦langsam⟧.
      Das Abbremsen in einen Key hinein heißt ⟦Ease-in⟧.
      Eine Zeichnung, die länger steht als ihre Nachbarn, ist eine ⟦Haltezeit⟧.
    gaps:
      - label: Auf …
        hint: On twos auf Deutsch.
        accept: ["twos", "zweiern"]
      - label: Zeichnungen pro Sekunde
        hint: 24 geteilt durch 2.
        accept: ["zwölf"]
      - label: Tempo
        hint: Wenig Weg pro Bild.
        accept: ["langsamer", "träge"]
      - label: Abbremsen
        hint: Auch slow in genannt.
        accept: ["Ease in", "slow in", "Slow-in"]
      - label: Länger stehen
        hint: Auf Englisch Hold.
        accept: ["Hold", "Haltepose", "Halt"]
    explanation: |
      Auf Zweien heißt 12 Zeichnungen pro Sekunde bei 24 Filmbildern. Dichte Zeichnungen bedeuten wenig Weg pro Bild, also langsam. Ease-in ist das Abbremsen in einen Key, Ease-out das Anfahren aus einem Key. Eine Haltezeit kostet keine neue Zeichnung und gibt dem Auge Zeit, eine Pose zu lesen.
    resources:
      - title: Wikipedia · Inbetweening, Frame frequency
        url: https://en.wikipedia.org/wiki/Inbetweening#Frame_frequency

  - id: zoegern-vor-dem-boden
    type: bug
    title: Ein Zögern vor dem Boden
    prompt: |
      Ein Ball soll aus dem Stand auf den Boden fallen, alle Bilder gleich lang. Beim Abspielen scheint er kurz vor dem Boden zu zögern und springt dann in den Kontakt. Finde die Zeile und korrigiere sie.
    lang: text
    code: |
      Bild  Höhe in px
       1    48
       2    45
       3    36
       4    27
       5     0
    lines: [5]
    fix:
      - line: 5
        answers:
          - " 4    21"
    hints:
      - Rechne die Abstände von Bild zu Bild aus.
      - "Im freien Fall wachsen die Abstände wie 1 : 3 : 5 : 7."
    explanation: |
      Die Abstände sind 3, 9, 9 und 27 Pixel. Zwischen Bild 3 und 4 wird der Ball nicht schneller, danach springt er um 27 Pixel. Im freien Fall müssten es 3, 9, 15 und 21 sein, Bild 4 also auf 48 − 27 = 21 Pixel Höhe. So steigt der Abstand gleichmäßig, und der schnellste Schritt kommt direkt vor dem Kontakt.
    resources:
      - title: Wikipedia · Slow in and slow out
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Slow_in_and_slow_out

  - id: hocke-verschluckt
    type: bug
    title: Die Hocke ist weg
    prompt: |
      Testleser sagen über deinen Sprung: „Er hebt einfach ab.“ Die Hocke vor dem Absprung ist gezeichnet, aber niemand bemerkt sie. Finde die Zeile in der Bildliste, die das verursacht.
    lang: text
    code: |
      Bild  Dauer   Pose
       1    150 ms  Stand
       2     50 ms  Hocke (Key)
       3     50 ms  Absprung
       4     50 ms  Streckung
       5    150 ms  Scheitel (Key)
       6    200 ms  Landung (Key)
    lines: [3]
    explanation: |
      Die Hocke ist ein Key, steht aber nur 50 ms, so kurz wie die Zwischenbilder davor und danach. Das Auge hat keine Zeit, sie zu lesen. Welche Dauer sie bekommt, entscheidest du; der Fehler ist, dass ein Key wie ein Zwischenbild getimt ist. Die Zeichnung zu ändern hilft hier nicht, die Dauer schon.
    resources:
      - title: Mariel Cartwright · GDC 2014 (ab 11:59)
        url: https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=719s

  - id: haltezeiten-erklaeren
    type: explain
    title: Lange Keys, kurze Wege
    prompt: |
      Ein Hammer schlägt auf einen Pflock, fünf Zeichnungen. Erkläre in wenigen Sätzen, warum die Dauern so verteilt sind und was passieren würde, wenn jedes Bild 100 ms stünde.
    lang: text
    code: |
      Bild  Dauer   Pose
       1    250 ms  ausgeholt (Key)
       2     33 ms  Wischbild
       3    200 ms  Aufschlag (Key)
       4     83 ms  Nachfedern
       5    300 ms  Ruhe (Key)
    points:
      - Die Keys (ausgeholt, Aufschlag, Ruhe) stehen lange, damit das Auge die Posen liest.
      - Das Wischbild steht kurz, es zeigt den Weg und muss nicht einzeln erkannt werden.
      - Der kurze Weg zwischen ausgeholt und Aufschlag macht den Schlag schnell, ohne dass er weniger Bilder braucht.
      - Mit 100 ms pro Bild stünde das Wischbild dreimal so lange wie hier, und der Schlag würde langsamer.
    explanation: |
      Die Dauern folgen dem, was das Auge lesen soll. Ausgeholt und Aufschlag sind die Posen, an denen man die Handlung erkennt, die Ruhe am Ende zeigt, dass sie vorbei ist. Das Wischbild ist ein Weg, kein Ziel, deshalb steht es nur 33 ms, also 2 Ticks. Mit 100 ms pro Bild würde aus dem Schlag ein gleichmäßiges Durchklicken. Mariel Cartwright beschreibt für Skullgirls genau diese Verteilung: Keys halten, Smears kurz.
    resources:
      - title: Mariel Cartwright · GDC 2014 (ab 11:59)
        url: https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=719s

  - id: ball-auf-papier
    type: practice
    title: Ein Ball auf Karopapier
    prompt: |
      Plan auf Karopapier einen Ball, der aus dem Stand auf den Boden fällt und einmal abprallt, nicht ganz so hoch wie vorher. Schreib zuerst den Absichtssatz. Zeichne dann die Keys, einen Spacing-Chart für den Fall und einen für den Aufstieg und darunter die Bildliste mit Dauern. Wenn du magst, übertrag es auf Haftzettel und blättere es als Daumenkino.

      Hier notierst du nur die Zahlen und was dir beim Abspielen auffällt.
    lang: prose
    starter: |
      Absichtssatz:
      Keys (Bild, Höhe):
      Spacing Fall (Abstände):
      Spacing Aufstieg (Abstände):
      Dauer pro Bild:
      Beim Abspielen aufgefallen:
    checklist:
      - Der Absichtssatz steht da, bevor du gezeichnet hast.
      - Die Abstände im Fall wachsen von Bild zu Bild, und der größte liegt direkt vor dem Kontakt.
      - Im Aufstieg werden die Abstände zum höchsten Punkt hin kleiner.
      - Der höchste Punkt nach dem Abprall liegt tiefer als der Startpunkt.
      - Die Dauern sind Vielfache von 50 ms oder als Ticks angegeben.
    explanation: |
      Die Übung trainiert, Spacing aus einer Ursache abzuleiten statt nach Gefühl zu verteilen. Fall und Aufstieg sind Spiegelbilder, beide mit dem Ease am Scheitel und ohne Ease am Boden. Dass der Ball nach dem Abprall weniger hoch kommt, ist der erste Hinweis auf Material und Gewicht; mehr dazu in [Gewicht zeigen](/animation/gewicht-aufprall). Das Daumenkino zeigt dir, ob dein Chart aufgeht, bevor du eine einzige Zeichnung im Editor machst.
    resources:
      - title: Wikipedia · Slow in and slow out
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Slow_in_and_slow_out

  - id: fall-filmen
    type: practice
    title: Einen echten Fall Bild für Bild ansehen
    prompt: |
      Lass einen kleinen Ball oder einen Radiergummi vor einer ruhigen Wand fallen und film es mit dem Handy, gern in Zeitlupe. Geh das Video Bild für Bild durch: auf dem Handy, indem du in der Galerie langsam durch die Zeitleiste schiebst, am PC etwa in VLC, wo die Taste E ein Bild weiterspringt ([VLC Hotkeys](https://wiki.videolan.org/QtHotkeys/)). Notier für das Stück vom Loslassen bis zum Aufprall, wie viele Bilder es sind und ob die Abstände von Bild zu Bild wachsen. Wenn das Video die Zeitlupe nachträglich verlangsamt, notier auch die Aufnahmerate.
    lang: prose
    starter: |
      Gegenstand, Fallhöhe (geschätzt):
      Aufnahmerate:
      Bilder vom Loslassen bis Kontakt:
      Abstände (wachsen sie?):
      Was mich überrascht hat:
    checklist:
      - Du hast die Zahl der Bilder vom Loslassen bis zum Kontakt gezählt, nicht geschätzt.
      - Du hast notiert, ob die Abstände von Bild zu Bild wachsen.
      - Du hast notiert, wie das Bild direkt vor dem Kontakt aussieht (scharf oder verwischt, Abstand zum Boden).
      - Deine Notiz beschreibt die Aufnahme, nicht wie du den Fall zeichnen würdest.
    explanation: |
      Eine echte Aufnahme schlägt jede Erinnerung. Aus dem Gedächtnis schätzt man einen Fall leicht länger und gleichmäßiger, als er ist; die gezählten Bilder zeigen dir, wie es bei dir war. Am Bild vor dem Kontakt siehst du oft Bewegungsunschärfe: Der Gegenstand ist dort am schnellsten. Diese Beobachtung ist die Grundlage für das Spacing ohne Ease am Boden. Mehr zum Arbeiten mit eigenen Referenzen steht in [Bewegung beobachten und in Schlüsselposen zerlegen](/animation/beobachten-schluesselposen).
    resources:
      - title: Wikipedia · Twelve basic principles, Timing
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Timing

  - id: zwei-timings
    type: practice
    title: Dieselben Zeichnungen, zwei Timings
    prompt: |
      Zeichne eine Gliederpuppe in drei Posen auf drei Haftzettel: Kopf links, Kopf in der Mitte, Kopf rechts. Plane zwei Bildlisten mit verschiedenen Dauern, wie Fassung A und B in der Lektion, aber mit deinen eigenen Werten. Schreib für jede Fassung einen Absichtssatz. Zeig beide Fassungen jemandem ohne Vorrede, indem du die Zettel im Takt der Dauern wechselst oder sie in einer App abspielst. Frag nur: „Was passiert da?“
    lang: prose
    starter: |
      Fassung A, Dauern:
      Absichtssatz A:
      Fassung B, Dauern:
      Absichtssatz B:
      Zuschauer zu A (wörtlich):
      Zuschauer zu B (wörtlich):
      Abweichung von meiner Absicht:
    checklist:
      - Beide Fassungen nutzen dieselben drei Zeichnungen, nur die Dauern unterscheiden sich.
      - Für jede Fassung steht vorher ein Absichtssatz.
      - Die Antworten des Zuschauers stehen wörtlich da, ohne deine Deutung.
      - Ist niemand da, hast du nach einer Nacht Abstand selbst geprüft und das markiert.
      - Du hast in einem Satz notiert, wo die Antwort von deiner Absicht abweicht.
    explanation: |
      Die Übung trennt die Wirkung des Timings von der Wirkung der Zeichnungen, weil nur das Timing sich ändert. Was der Zuschauer sagt, ist eine Beobachtung, kein Urteil über deine Arbeit. Weicht die Antwort von deiner Absicht ab, ist das die nützlichste Information der Übung. Eine einzelne Antwort beweist nichts; sie zeigt, wo du weiter ausprobierst.
    resources:
      - title: Wikipedia · Twelve basic principles, Timing
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Timing
