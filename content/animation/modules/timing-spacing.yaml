id: timing-spacing
title: "Timing und Spacing: wann und wie weit"
level: 1
minutes: 120
summary: Warum dieselben Zeichnungen schwer, leicht, zögernd oder hastig wirken können, wie du Dauer und Abstand der Bilder getrennt planst, warum ein fallender Ball dir das Spacing vorgibt und wie deine Millisekunden im Spiel auf ganzen Ticks landen.
place: unterwegs
goals:
  - Du unterscheidest Timing (wie lange) und Spacing (wie weit) und liest beides aus einer Bildliste und einem Spacing-Chart ab.
  - Du planst Ease-in und Ease-out mit einem Spacing-Chart und setzt Haltezeiten gezielt auf Schlüsselposen.
  - "Du leitest das Spacing eines fallenden Balls aus dem Verhältnis 1 : 3 : 5 : 7 ab und erkennst, wo ein Ease falsch ist."
  - Du rechnest Bilddauern in Spiel-Ticks zu 1/60 Sekunde um und wählst Dauern, die ohne Rundung aufgehen.
  - Du vergleichst zwei Timings derselben Zeichnungen mit einem Beobachtungstest, statt ihre Wirkung zu behaupten.
