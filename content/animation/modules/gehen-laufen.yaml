id: gehen-laufen
title: Gehen und Laufen in wenigen Bildern
level: 2
minutes: 130
summary: Aus welchen Posen ein Gangzyklus besteht, was die Flugphase beim Laufen ändert, welche Bilder bei vier, sechs oder acht Bildern bleiben, wie Gehen in der Draufsicht lesbar wird und wie ein Ruhezyklus lebt, ohne zu ticken.
place: unterwegs
goals:
  - Du benennst die Posen eines Gangzyklus (Kontakt, Tiefpunkt, Passing, Hochpunkt) und ordnest sie in einer Bildliste.
  - Du erklärst, was einen Laufzyklus vom Gehen unterscheidet, und wo der Körper beim Gehen und beim Laufen am tiefsten ist.
  - Du kürzt einen Zyklus auf vier, sechs oder acht Bilder, behältst die tragenden Posen und rechnest Zyklusdauer und Schritte pro Sekunde aus.
  - Du machst Gehen in der Draufsicht lesbar, mit Kopfbewegung, Staffelung und gespiegelten Bildern.
  - Du planst einen Ruhezyklus mit wenigen Bildern, gleicher Masse und ungleichen Dauern.
