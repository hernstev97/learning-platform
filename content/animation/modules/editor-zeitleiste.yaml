lesson: |
  Auf Papier hast du einen Ball geplant: Keys, einen Spacing-Chart und eine Bildliste mit Dauern ([Timing und Spacing](/animation/timing-spacing)). Jetzt soll er im Editor laufen, und dort heißt alles ein wenig anders. Aseprite spricht von Frames und Cels, Krita von Keyframes und Holds, Pixelorama rechnet mit Bildern pro Sekunde, wo Aseprite Millisekunden speichert. Wer die Begriffe nicht übersetzen kann, verliert sein Timing auf dem Weg vom Papier ins Spiel.

  Dieses Modul zeigt die Werkzeuge, die jede Animation im Editor braucht: Zeitleiste, Bilddauer, Tags, Vorschau, Onion Skinning und Export. Jeder Schritt steht für Aseprite 1.3.18.6 und für mindestens ein freies Programm: Pixelorama 1.2.3, LibreSprite 1.3 oder Krita. Aseprite brauchst du nicht; alles hier geht mit den freien Programmen. Installation, Leinwand, Palette und den Unterschied zwischen Speichern und Exportieren findest du in [Einen Pixel-Editor wählen und einrichten](/pixelart/editor-einrichten), den Import in Godot in [Eigene Sprites importieren](/godot/sprites-importieren).

  > [!NOTE] Krita 5.3 oder 6.0
  > `pacman -S krita` installiert unter CachyOS 6.0.4.1, Flathub und AppImage liefern 5.3.4.1. Laut Krita ist 6.0 derselbe Code wie 5.3, nur mit Qt 6 ([Release History](https://krita.org/en/release-history/)); das verlinkte Handbuch beschreibt 5.3. Für Pixel ist Krita nicht gebaut, seine Stärke hier ist die Zeitleiste mit Haltebildern.

  ## Die Zeitleiste: Bilder, Ebenen und Cels

  Alle vier Programme ordnen eine Animation als Raster. Spalten sind Bilder in zeitlicher Folge, Zeilen sind Ebenen. Ein einzelnes Feld heißt **Cel**, nach den Zelluloidfolien des Trickfilms. Aseprite definiert es so: „A cel (from celluloid) is one image in a specific frame and layer“ ([Cel](https://www.aseprite.org/docs/cel/)). Pixelorama beschreibt dasselbe Raster: Jede Kreuzung aus Bild und Ebene ist ein Cel ([The Timeline](https://www.pixelorama.org/user_manual/user_interface/timeline)). Ebenen trennen, was du getrennt ändern willst, etwa Figur, Schatten am Boden und eine Hilfslinie für den Boden.

  | Schritt | Aseprite 1.3.18.6 | LibreSprite 1.3 | Pixelorama 1.2.3 | Krita 5.3 / 6.0 |
  | --- | --- | --- | --- | --- |
  | Zeitleiste zeigen | Tab | Tab | immer unten | *Window › Workspace › Animation* |
  | Bild als Kopie anfügen | Alt+N | Alt+N | Rechtsklick auf die Bildnummer, Bild klonen | *Create Duplicate Frame* |
  | leeres Bild anfügen | Alt+B | Alt+B | Knopf oben in der Zeitleiste | *Create Blank Frame* |
  | Bild vor, zurück | `.` `,` oder Pfeiltasten | Pfeiltasten | Klick auf die Bildnummer | im Zeitlineal ziehen |
  | abspielen | Enter | Enter | F5, rückwärts F4 | Play im Docker |

  Quellen: Aseprite [New Frame](https://www.aseprite.org/docs/new-frame/) und [Animation](https://www.aseprite.org/docs/animation/#common-operations). LibreSprite hat keine Anleitung zur Animation; die Kürzel stammen aus seiner Tastaturbelegung ([gui.xml in v1.3](https://github.com/LibreSprite/LibreSprite/blob/v1.3/data/gui.xml)) und dem [Wiki](https://github.com/LibreSprite/libresprite.github.io/wiki/Know-your-workspace#animation). In Krita wird eine Ebene erst zur animierten Ebene, wenn du per Rechtsklick in die Zeitleiste ein erstes Bild anlegst ([Animating](https://docs.krita.org/en/reference_manual/dockers/animation_timeline.html#animating)).

  **Verknüpfte Cels** teilen sich ein Bild: „When you modify one of these cels, all linked cels are modified“ ([Linked Cels](https://www.aseprite.org/docs/linked-cels/)). In Aseprite und LibreSprite legst du sie mit Alt+M an, in Pixelorama per Rechtsklick auf das Cel. Krita nennt dasselbe **Clone Frames**, angelegt mit Alt und Ziehen ([Animation Timeline: Overview](https://docs.krita.org/en/reference_manual/dockers/animation_timeline.html#overview)). Sie passen, wenn eine Zeichnung mehrmals vorkommt, etwa eine Haltepose, die wiederkehrt. Zeichnest du versehentlich auf einem, änderst du alle.

  Der Kurs zählt Bilder ab 1, wie Aseprite in der Voreinstellung; dort lässt sich „First frame as 0“ einstellen ([Timeline: Preferences](https://www.aseprite.org/docs/timeline/#preferences)). Krita und die JSON-Daten aus dem Export zählen ab 0. Schreib in jede Bildliste, wie du zählst.

  ## Bilddauer: Timing ändern, ohne neu zu zeichnen

  Die Dauer eines Bildes ist eine Zahl, keine Zeichnung. Deshalb änderst du das Timing, ohne einen Pixel anzufassen. Jedes Programm speichert sie anders.

  **Aseprite und LibreSprite** speichern pro Bild Millisekunden: *Frame › Frame Properties* oder Taste P für das aktuelle Bild, für mehrere Bilder markieren und per Rechtsklick *Properties* ([Frame Duration](https://www.aseprite.org/docs/frame-duration/)). Das Feld heißt „Duration (milliseconds)“; die Doku nennt die Einheit nicht, die Oberfläche schon ([en.ini in 1.3.18.6](https://github.com/aseprite/aseprite/blob/v1.3.18.6/data/strings/en.ini)). *Frame › Constant Frame Rate* gibt allen Bildern dieselbe Dauer.

  **Pixelorama** rechnet wie Godot: eine Bildrate für die Zeitleiste, Standard 6, und je Bild ein Faktor. „By default, the duration of each frame is set to 1x, which means it will take exactly as much time as the timeline FPS“ ([Frames](https://www.pixelorama.org/user_manual/user_interface/timeline#frames)). Den Faktor setzt du per Rechtsklick auf die Bildnummer in den Eigenschaften des Bildes. Bei Bildrate 20 ist 1x genau 50 ms, und jedes Vielfache von 50 ms wird ein ganzer Faktor.

  **Krita** kennt keine Millisekunden. Das Handbuch betont, dass „frame timings are not based on units of time like seconds, but on frames“, und Krita „automatically holds each keyframe until the next keyframe on that layer“ ([Animation Timeline Docker](https://docs.krita.org/en/reference_manual/dockers/animation_timeline.html#overview)). Die Bildrate steht im Einstellungsmenü am rechten Ende der Docker-Leiste. Soll eine Zeichnung länger stehen, bekommt sie leere Felder dahinter: Rechtsklick, *Hold frames › Insert Hold Frame* ([Expanding upon your rough walk cycle](https://docs.krita.org/en/user_manual/animation.html#expanding-upon-your-rough-walk-cycle)). *Keyframes › Insert Multiple Keyframes* legt mehrere Bilder auf Einsen, Zweien oder Dreien an.

  Dieselbe Bildliste in allen vier Programmen:

  ```text
  Bildliste       Aseprite,      Pixelorama     Krita
                  LibreSprite    FPS 20         20 fps
  Bild 1  150 ms  150            3x             3 Felder
  Bild 2   50 ms   50            1x             1 Feld
  Bild 3   50 ms   50            1x             1 Feld
  Bild 4  100 ms  100            2x             2 Felder
  ```

  20 Bilder pro Sekunde teilen die 60 Ticks des Spiels ohne Rest ([Timing und Spacing](/animation/timing-spacing)). Die Umrechnung in FPS und Frame-Dauern von Godot steht in [In der Testszene prüfen](/animation/testszene).

  > [!TIP] Zeitlupe im Editor
  > Aseprite spielt unter *Frame › Playback* mit 0,25- oder 0,5-facher Geschwindigkeit ab (laut [en.ini](https://github.com/aseprite/aseprite/blob/v1.3.18.6/data/strings/en.ini)), Krita hat einen Regler für die Abspielgeschwindigkeit im Docker ([Overview](https://docs.krita.org/en/reference_manual/dockers/animation_timeline.html#overview)). In Zeitlupe siehst du, ob ein Abstand aus der Reihe fällt. Die gespeicherten Dauern bleiben gleich.

  > [!PRAXIS] So zeigt es Saint11
  > Pedro Medeiros lässt in seiner ersten Aseprite-Animation einen Ball 4, 3, 2 und 1 Pixel steigen, hält ihn oben ein Bild lang und verlängert danach einzelne Bilder über *Frame properties* ([A Basic Aseprite Animation](https://saint11.art/pixel_art_articles/article3/#timing)). Erst zeichnen, dann timen, abspielen, nachstellen: Die Dauer justierst du am häufigsten nach.

  ## Tags, Schleifen und Vorschau in Originalgröße

  Eine Figur hat mehrere Animationen. Du trennst sie in einer Datei mit **Tags**. In Aseprite markierst du die Bilder und wählst *Frame › Tags › New Tag* oder drückst zweimal F2 ([Tags](https://www.aseprite.org/docs/tags/)). Jeder Tag hat eine Abspielrichtung, „Forward, Reverse, or Ping-pong“, und ein Feld „Repeat“, bei dem 0 „plays infinite in UI, once on export“ heißt ([Tag.repeats](https://www.aseprite.org/api/tag#tagrepeats)). LibreSprite hat denselben Menüpunkt ohne Repeat. In Pixelorama legst du einen Tag per Rechtsklick auf eine Bildnummer an, mit Name, Farbe und Bereich ([Frame tags](https://www.pixelorama.org/user_manual/user_interface/timeline#frame-tags)). Die Schleifenart gilt dort für die ganze Zeitleiste: Cycle, Ping-pong oder No loop ([Loop modes](https://www.pixelorama.org/user_manual/user_interface/timeline#loop-modes)). Krita hat keine Tags; dort setzt du den Abspielbereich im Einstellungsmenü der Zeitleiste oder nimmst eine Datei je Animation.

  Gib jedem Tag den Namen, den die Animation im Spiel trägt; die Namen sind ein Vertrag mit dem Code ([Animationen zuordnen](/godot/animationen)).

  Gezeichnet wird vergrößert, beurteilt in Originalgröße. In Aseprite öffnet F7 das Vorschaufenster, Shift+Enter spielt dort „the sprite animation (or the current tag)“ ([Preview Window](https://www.aseprite.org/docs/preview-window/)); LibreSprite hat *View › Preview*, ebenfalls F7. Pixelorama hat ein Panel Canvas Preview mit Abspielknopf, das das Handbuch nicht beschreibt; versteckte Panels blendest du unter *Window › Panels* ein ([User Interface Basics](https://www.pixelorama.org/user_manual/user_interface/user_interface_basics)). Damit dort nur ein Tag läuft, schaltest du in den Optionen der Zeitleiste „Animation plays only on frames of the same tag“ ein. Krita spielt auf der Leinwand ab, bei Zoom 100 %. Bei Aseprite denk an die Bildschirmskalierung von 200 % ([Einen Pixel-Editor wählen und einrichten](/pixelart/editor-einrichten)).

  ## Onion Skinning: die Nachbarbilder durchscheinen lassen

  **Onion Skinning** zeigt die Bilder vor und nach dem aktuellen als blasse Schatten, wie dünnes Papier auf dem Leuchttisch der Trickfilmzeichner ([Onion Skin Docker](https://docs.krita.org/en/reference_manual/dockers/onion_skin.html#onion-skin-docker)). So zeichnest du ein Zwischenbild und siehst die Keys davor und danach.

  - **Aseprite:** F3 oder das Onion-Skin-Symbol in der Zeitleiste; im Zahnrad stellst du ein, wie viele Bilder davor und danach erscheinen, und schaltest die Rot-Blau-Tönung ein ([Onion Skinning](https://www.aseprite.org/docs/onion-skinning/)).
  - **LibreSprite:** F3 oder *View › Show Onion Skin*, mit denselben Einstellungen wie Aseprite.
  - **Pixelorama:** zwei Knöpfe links neben der Schleifenart, einer schaltet, einer öffnet die Einstellungen mit Zahl der Bilder und dem Blau-Rot-Modus. Eine Ebene schließt du über ihre Eigenschaften aus, „Ignore in onion skinning“ ([Onion skinning](https://www.pixelorama.org/user_manual/user_interface/timeline#onion-skinning)).
  - **Krita:** das Glühbirnen-Symbol an der animierten Ebene schaltet, der Onion Skin Docker regelt Deckkraft je Abstand, Tönung und Farben.

  Ein Ball rollt nach rechts und bremst ab. Bild 3 ist aktiv (`O`), die beiden Bilder davor (`v`) und das danach (`n`) erscheinen getönt. Welche Farbe wofür steht, hängt vom Programm ab: Pixelorama tönt die Bilder davor blau und danach rot, Krita davor rot und danach grün.

  ```text
  v               v           O       n
  1               2           3       4
  |-----16px------|---12px----|--8px--|
  ```

  Drei Prüfungen gehen nur so. **Spacing:** Die Abstände zwischen den Schatten sind dein Spacing-Chart, direkt auf der Leinwand. Hier werden sie kleiner, der Ball bremst. **Bögen:** Verbinde in Gedanken die Nasenspitze oder die Hand über alle Schatten; die Linie soll ein Bogen sein ([Bögen, Nachziehen und Überlappung](/animation/boegen-ueberlappung)). **Konstanz:** Ist der Kopf in einem Bild eine Reihe größer, siehst du es am Rand des Schattens ([Form und Proportionen halten](/animation/form-konstanz)).

  Schalt es aus, wenn du ein Einzelbild für sich beurteilst, etwa seine Silhouette, und wenn du abspielst. Dann lenken die Schatten ab.

  > [!WARNING] Krita zeigt keine Schatten
  > Krita zeigt Onion Skins nur auf Ebenen, die nicht deckend sind: „Krita will consider white to be white, not transparent“ ([Onion Skin Docker](https://docs.krita.org/en/reference_manual/dockers/onion_skin.html#onion-skin-docker)). Hast du beim Anlegen den Hintergrund als Rasterebene gewählt und darauf animiert, bleiben die Schatten aus. Leg eine neue, transparente Ebene für die Animation an.

  ## Export: Sprite-Sheet, Daten, Bildfolge und GIF

  Du exportierst für drei Empfänger. **Für das Spiel** ein Sprite-Sheet oder eine Bildfolge in 100 %, ohne abgeschnittene Ränder; welche Raster-Optionen Godot verträgt, steht in [Eigene Sprites importieren](/godot/sprites-importieren).

  - Aseprite: *File › Export › Export Sprite Sheet* (Ctrl+E). Im Dialog wählst du den Sheet Type, etwa „By Rows“, das laut Tooltip eine Zeile je Ebene oder Tag anlegt, und mit „Split Tags“ eine Zeile je Tag ([Sprite Sheet](https://www.aseprite.org/docs/sprite-sheet/#export)).
  - LibreSprite: *File › Export Sprite Sheet* (Ctrl+Alt+E), mit Sheet Type, „Per Tag“ und JSON-Daten.
  - Pixelorama: *File › Export* (Ctrl+E), Reiter für Bildfolge und Spritesheet; beim Sheet wählst du Zeilen und Spalten, unter „Frames“ einzelne Tags ([Save and Export](https://www.pixelorama.org/user_manual/save_and_export#export-a-spritesheet)).
  - Krita: *File › Render Animation*, „Export as Image Sequence“, eine PNG-Datei je Bild ([Render Animation](https://docs.krita.org/en/reference_manual/render_animation.html#export-as-image-sequence)).

  **Für das Timing** die Bilddauern. Aseprite und LibreSprite schreiben sie in eine JSON-Datei neben das Sheet, wenn du „JSON Data“ anhakst, mit der Meta-Angabe für Tags auch die Tags. In Aseprite geht das auch an der Kommandozeile ([CLI](https://www.aseprite.org/docs/cli/#data)):

  ```bash
  aseprite -b ball.aseprite \
    --sheet ball.png --data ball.json \
    --format json-array --list-tags
  ```

  `-b` startet ohne Oberfläche, `--format json-array` schreibt die Bilder als Liste, `--list-tags` legt die Tags unter `meta.frameTags` ab ([--list-tags](https://www.aseprite.org/docs/cli/#list-tags)). Pro Bild stehen in der Datei die Lage im Sheet (`frame`), Angaben zum Zuschnitt und die Dauer in Millisekunden (`duration`), wie in einem [Beispiel von Aseprite-Entwickler David Capello](https://gist.github.com/dacap/a32adb9248320326733a). Ein Tag steht als Name, Bereich und Richtung darin, mit gesetztem Repeat auch `"repeat"` ([doc_exporter.cpp](https://github.com/aseprite/aseprite/blob/v1.3.18.6/src/app/doc_exporter.cpp)). Bilder und Tags zählen ab 0. Das Skript rechnet die Länge jedes Tags aus, mit Daten, die auf die nötigen Felder gekürzt sind:

  ```python run
  import json

  daten = json.loads("""
  {"frames": [
    {"filename": "ball 0.aseprite", "duration": 150},
    {"filename": "ball 1.aseprite", "duration": 50},
    {"filename": "ball 2.aseprite", "duration": 50},
    {"filename": "ball 3.aseprite", "duration": 100},
    {"filename": "ball 4.aseprite", "duration": 200},
    {"filename": "ball 5.aseprite", "duration": 200}],
   "meta": {"frameTags": [
    {"name": "huepfen", "from": 0, "to": 3,
     "direction": "forward"},
    {"name": "wackeln", "from": 4, "to": 5,
     "direction": "pingpong"}]}}
  """)

  dauern = [f["duration"] for f in daten["frames"]]
  for tag in daten["meta"]["frameTags"]:
      teil = dauern[tag["from"]:tag["to"] + 1]
      print(tag["name"], teil, sum(teil), "ms")
  ```

  `huepfen` umfasst die Bilder 1 bis 4 und dauert 350 ms, `wackeln` die Bilder 5 und 6 mit 400 ms. Bei Ping-Pong läuft die Animation danach rückwärts, hin und zurück dauert also länger als die Summe.

  Pixelorama und Krita schreiben keine solche Datei. Pixelorama behält Bildrate und Faktoren in der `.pxo`-Datei; sein `--json` gibt die Projektdaten aus, keine Bildrechtecke ([CLI](https://www.pixelorama.org/user_manual/cli#options)). Krita schreibt beim Rendern für jedes Feld ein Bild, auch für Haltebilder, und das Timing steckt in der Zahl gleicher Bilder bei fester Bildrate. „Only Unique Frames“ lässt die Wiederholungen weg und damit dein Timing. Bei beiden gehört die Bildliste mit Dauern als Textdatei neben das Sheet.

  **Zum Zeigen** ein GIF oder APNG, um einen ganzen Faktor mit nächstem Nachbarn vergrößert, etwa für den Beobachtungstest am Handy. In Aseprite: *File › Export › Export As* (Ctrl+Alt+Shift+S), Dateiname `ball.gif`, „Resize“ auf 400 % ([Exporting](https://www.aseprite.org/docs/exporting/#automatic-resize-on-export)). Pixelorama exportiert GIF und APNG im selben Dialog wie die Bildfolge, vergrößert mit „Nearest“ und empfiehlt APNG, weil GIF dort langsam ist ([Export a sequence of images](https://www.pixelorama.org/user_manual/save_and_export#export-a-sequence-of-images)). LibreSprite exportiert GIF über *File › Export*. Krita rendert GIF oder Video mit dem Filter „Nearest Neighbour“, der laut Handbuch die Details von Pixelart besser erhält ([Export as Video](https://docs.krita.org/en/reference_manual/render_animation.html#export-as-video)). Ins Spiel geht immer der Export in 100 %.

  > [!INTERVIEW]
  > „Wie übergibst du eine Animation an die Programmierung, damit das Timing ankommt?“ Gute Antwort: Als Sprite-Sheet in Originalgröße mit festem Raster, eine Zeile je Animation, dazu die Bilddauern als JSON oder Bildliste. Die Tag-Namen sind die Animationsnamen im Spiel. Ich sage, ob die Bildnummern ab 0 oder 1 zählen und welche Animationen sich wiederholen, und prüfe das Ergebnis im Spiel statt in der Vorschau.

  ## Fassungen speichern und was eine KI hier darf

  Vor jeder größeren Änderung speicherst du unter neuem Namen: `ball-v1.aseprite`, dann `ball-v2.aseprite`. In Aseprite und LibreSprite mit *File › Save As*, in Pixelorama mit *Save as…* (Shift+Ctrl+S, [Saving](https://www.pixelorama.org/user_manual/save_and_export#saving)), in Krita mit *File › Incremental Backup*, das eine Kopie zum Weiterarbeiten anlegt ([Workflow](https://docs.krita.org/en/user_manual/animation.html#workflow)). Die alte Fassung überschreibst du nie; die Werkstätten bauen darauf auf.

  > [!MERKE] Skripte ja, Bilder nein
  > Export-Befehle und Skripte wie die beiden oben darf dir eine KI schreiben, erklären oder anpassen. Die Bilder nicht: keine generierte Figur als Vorlage, kein erzeugtes Zwischenbild, kein Werkzeug, das aus deinen Keys die Inbetweens rechnet. Jede Zeichnung, Pose und Bilddauer ist deine Arbeit.

  ## Häufige Fehler

  - **Dauer im falschen Bild.** Die Taste P ändert nur das aktuelle Bild. Für mehrere Bilder markierst du sie zuerst.
  - **Bildrate statt Faktor geändert.** In Pixelorama gilt die Bildrate für alle Bilder. Ein einzelnes längeres Bild bekommt einen höheren Faktor.
  - **„Only Unique Frames“ angehakt.** Krita lässt die Haltebilder weg, und alle Bilder stehen im Spiel gleich lang.
  - **Vergrößert exportiert.** 150 % macht aus jedem Pixel abwechselnd ein und zwei Pixel. Fürs Spiel immer 100 %.
  - **Ränder abgeschnitten.** Trim macht die Bilder verschieden groß, und die Figur springt beim Wechsel.
  - **Timing nur im Kopf.** Ohne JSON oder Bildliste rät die nächste Station die Dauern.

  ## Zusammenfassung

  - Spalten sind Bilder, Zeilen Ebenen, ein Feld ist ein Cel. Verknüpfte Cels (Krita: Clone Frames) teilen ein Bild.
  - Aseprite und LibreSprite speichern Millisekunden pro Bild, Pixelorama eine Bildrate mit Faktoren, Krita Felder einer festen Bildrate mit Haltebildern.
  - Mit 20 Bildern pro Sekunde in Pixelorama und Krita wird jedes Vielfache von 50 ms ein ganzer Faktor oder eine ganze Zahl Felder.
  - Tags trennen Animationen in einer Datei; ihr Name ist der Animationsname im Spiel.
  - Onion Skinning zeigt Spacing, Bögen und Konstanz. Zum Beurteilen eines Einzelbilds schaltest du es aus.
  - Fürs Spiel exportierst du in 100 % ohne Trim, mit JSON oder Bildliste. Zum Zeigen ein GIF mit ganzem Faktor.
  - Skripte darf eine KI schreiben, Bilder nicht.
exercises:
  - id: cel-bild-ebene
    type: choice
    title: Bild, Ebene, Cel
    prompt: |
      Welche Aussagen über die Zeitleiste stimmen?
    options:
      - text: Ein Cel ist das Bild einer Ebene in einem bestimmten Bild der Animation.
        correct: true
        why: So definieren es Aseprite und Pixelorama. Ein Bild der Animation besteht aus den Cels aller Ebenen.
      - text: Änderst du ein verknüpftes Cel, ändern sich alle damit verknüpften.
        correct: true
        why: Verknüpfte Cels teilen sich ein Bild. In Krita heißt dasselbe Clone Frame.
      - text: In Krita steht jede Zeichnung, bis auf derselben Ebene die nächste kommt.
        correct: true
        why: Krita hält jeden Keyframe automatisch bis zum nächsten. Haltezeit sind dort leere Felder hinter der Zeichnung.
      - text: In Pixelorama hat jedes Bild eine eigene Dauer in Millisekunden.
        correct: false
        why: Pixelorama hat eine Bildrate für die Zeitleiste und je Bild einen Faktor, Standard 1x. Millisekunden speichern Aseprite und LibreSprite.
      - text: Eine Ebene ist eine Spalte der Zeitleiste.
        correct: false
        why: Spalten sind Bilder in zeitlicher Folge, Ebenen sind Zeilen.
    explanation: |
      Die vier Programme ordnen dasselbe Raster an, nur mit anderen Wörtern und Zeiteinheiten. Wer weiß, dass Aseprites verknüpftes Cel Kritas Clone Frame ist und Pixeloramas Faktor Godots Frame-Dauer, kann zwischen Programmen wechseln, ohne sein Timing zu verlieren.
    resources:
      - title: Aseprite Docs · Cel
        url: https://www.aseprite.org/docs/cel/

  - id: ball-im-editor-ordnen
    type: order
    title: Vom Papier in den Editor
    prompt: |
      Bring die Arbeitsschritte für den Ball aus Timing und Spacing in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Die Keys als einzelne Bilder zeichnen.
      Jedem Key seine Dauer aus der Bildliste geben.
      Nur die Keys abspielen und das Timing prüfen.
      Onion Skinning einschalten und die Zwischenbilder zeichnen.
      Die Zwischenbilder timen und alles in Originalgröße abspielen.
      Sprite-Sheet und Bilddauern in 100 % exportieren.
    explanation: |
      Keys und ihr Timing kommen zuerst, weil sie die Bewegung tragen und sich am leichtesten ändern lassen. Erst wenn die Keys allein stimmen, lohnen Zwischenbilder; für sie brauchst du Onion Skinning, um die Abstände zu sehen. Beurteilt wird in Originalgröße, exportiert ganz am Ende, damit das Spiel die Fassung bekommt, die du geprüft hast.
    resources:
      - title: Krita Manual · Animation, Workflow
        url: https://docs.krita.org/en/user_manual/animation.html#workflow

  - id: tag-laenge
    type: output
    title: Wie lang ist der Tag?
    prompt: |
      Der Tag `aufprall` umfasst in Aseprite die Bilder 3 bis 6. Wie viele Millisekunden dauert ein Durchlauf? Antworte mit der Zahl.
    lang: text
    code: |
      Bild  Dauer
       1    100 ms
       2     50 ms
       3     50 ms
       4    150 ms
       5    100 ms
       6    250 ms
       7    100 ms
    expected: |
      550
    accept:
      - 550 ms
    explanation: |
      Bild 3 bis 6 sind 50 + 150 + 100 + 250 = 550 ms. Die Bilder davor und danach gehören zu anderen Tags. In der JSON-Datei stünde dieser Tag als `"from": 2, "to": 5`, weil dort ab 0 gezählt wird.
    resources:
      - title: Aseprite Docs · Tags
        url: https://www.aseprite.org/docs/tags/

  - id: tag-skript
    type: output
    title: Was das Skript ausgibt
    prompt: |
      Was gibt das Programm aus?
    lang: python
    code: |
      dauern = [100, 100, 50, 50, 300]
      tags = [
          {"name": "anlauf", "from": 0, "to": 1},
          {"name": "sprung", "from": 2, "to": 4},
      ]
      for tag in tags:
          teil = dauern[tag["from"]:tag["to"] + 1]
          print(tag["name"], sum(teil))
    expected: |
      anlauf 200
      sprung 400
    explanation: |
      `from` und `to` zählen ab 0 und schließen beide Enden ein. Deshalb steht im Slice `tag["to"] + 1`. `anlauf` umfasst die ersten beiden Dauern, 200 ms, `sprung` die übrigen drei, 50 + 50 + 300 = 400 ms. Ohne `+ 1` fiele das letzte Bild jedes Tags heraus.
    resources:
      - title: Aseprite Docs · CLI, --list-tags
        url: https://www.aseprite.org/docs/cli/#list-tags

  - id: krita-haltebilder
    type: output
    title: Drei Felder bei 12 Bildern pro Sekunde
    prompt: |
      In Krita steht die Bildrate auf 12. Ein Key liegt auf Feld 4, der nächste auf Feld 7. Wie viele Millisekunden steht der erste Key? Antworte mit der Zahl.
    lang: text
    code: |
      Feld   4    5    6    7
             K    -    -    K
      K = Keyframe, - = gehalten
    expected: |
      250
    accept:
      - 250 ms
    explanation: |
      Der Key auf Feld 4 hält über die Felder 5 und 6, bis auf Feld 7 der nächste kommt: drei Felder. Bei 12 Bildern pro Sekunde ist ein Feld 1000 / 12 ≈ 83,3 ms lang, drei Felder sind 250 ms. Im Spiel sind das genau 15 Ticks.
    resources:
      - title: Krita Manual · Animation Timeline Docker
        url: https://docs.krita.org/en/reference_manual/dockers/animation_timeline.html#term-Blank-Keyframe

  - id: cli-befehl
    type: gap
    title: Sheet und Daten in einem Befehl
    prompt: |
      Ergänze den Befehl so, dass Aseprite ohne Oberfläche aus `ball.aseprite` ein Sheet `ball.png` und eine JSON-Datei `ball.json` als Liste schreibt, mit den Tags unter `meta.frameTags`.
    lang: bash
    code: |
      aseprite ⟦-b⟧ ball.aseprite \
        ⟦--sheet⟧ ball.png ⟦--data⟧ ball.json \
        --format ⟦json-array⟧ ⟦--list-tags⟧
    gaps:
      - label: ohne Oberfläche
        hint: Kurzform von --batch.
        accept: ["--batch"]
      - label: Bilddatei
        hint: Die Option heißt wie das englische Wort für ein Blatt Papier.
      - label: JSON-Datei
        hint: Englisch für Daten.
      - label: Format
        hint: Nicht die Voreinstellung json-hash.
      - label: Tags
        hint: Die Option listet etwas auf.
    explanation: |
      `-b` beendet Aseprite nach den Befehlen. `--sheet` und `--data` geben die beiden Ausgaben an, `--format json-array` schreibt die Bilder als Liste in Abspielreihenfolge, die Voreinstellung wäre `json-hash`. `--list-tags` schreibt zusammen mit `--data` die Tags in die Meta-Daten. Solche Befehle darf dir eine KI schreiben; prüf sie trotzdem gegen die Doku, bevor du sie in ein Skript übernimmst.
    resources:
      - title: Aseprite Docs · CLI, Export an animation to a sprite sheet
        url: https://www.aseprite.org/docs/cli/#export-an-animation-to-a-sprite-sheet

  - id: werkzeugbegriffe
    type: gap
    title: Vier Programme, vier Wörter
    prompt: |
      Ergänze die fehlenden Wörter.
    lang: prose
    code: |
      Die Bilder davor und danach blass anzeigen heißt ⟦Onion⟧ Skinning.
      Was in Aseprite ein verknüpftes Cel ist, heißt in Krita ⟦Clone⟧ Frame.
      In Pixelorama steht ein Bild mit dem Faktor 2x ⟦doppelt⟧ so lange, wie die Bildrate vorgibt.
      In Krita verlängerst du eine Zeichnung mit Insert ⟦Hold⟧ Frame.
      Ein Tag, der vorwärts und dann rückwärts läuft, hat die Richtung ⟦Ping-pong⟧.
    gaps:
      - label: Zwiebel
        hint: Englisch für Zwiebel.
      - label: Krita-Begriff
        hint: Englisch für Klon.
      - label: Faktor 2x
        hint: Zweimal so lange.
        accept: ["zweimal"]
      - label: Haltebild
        hint: Englisch für halten.
      - label: Richtung
        hint: Wie das Tischtennis.
        accept: ["Pingpong"]
    explanation: |
      Onion Skinning kommt vom dünnen Papier auf dem Leuchttisch. Clone Frames teilen in Krita ein Bild wie verknüpfte Cels in Aseprite. Hold Frames sind leere Felder, über die Krita die Zeichnung davor hält. Ping-Pong läuft vor und zurück; für eine Aktion, die enden soll, ist das falsch, für ein Wackeln oder Atmen kann es passen.
    resources:
      - title: Krita Manual · Clone frames
        url: https://docs.krita.org/en/reference_manual/dockers/animation_timeline.html#term-Clone-frames

  - id: export-150
    type: bug
    title: Ungleiche Pixel
    prompt: |
      Im Spiel sind manche Pixel deiner Figur doppelt so breit wie andere, und die Kanten flimmern beim Laufen. Im Editor sieht alles sauber aus. Finde die Zeile in den Export-Einstellungen und korrigiere sie.
    lang: text
    code: |
      Sheet Type    By Rows, Split Tags
      Trim          aus
      Resize        150 %
      JSON Data     an, Array, Meta Tags
      Ausgabe       held.png, held.json
    lines: [3]
    fix:
      - line: 3
        answers:
          - Resize        100 %
    explanation: |
      Bei 150 % wird aus jedem Pixel im Mittel anderthalb. Weil es keine halben Pixel gibt, werden abwechselnd ein und zwei Pixel daraus. Vergrößert wird nur zum Zeigen und nur um ganze Faktoren; ins Spiel geht der Export in 100 %, skaliert wird dort ([Eigene Sprites importieren](/godot/sprites-importieren)).
    resources:
      - title: Aseprite Docs · Automatic Resize on Export
        url: https://www.aseprite.org/docs/exporting/#automatic-resize-on-export

  - id: krita-unique-frames
    type: bug
    title: Alle Bilder gleich schnell
    prompt: |
      Du hast in Krita bei 20 Bildern pro Sekunde animiert, mit langen Haltebildern auf den Keys. Im Spiel läuft die Animation mit 20 FPS, aber jede Zeichnung huscht gleich schnell vorbei, auch die Keys. Finde die Zeile in den Render-Einstellungen, die das verursacht.
    lang: text
    code: |
      First Frame         0
      Last Frame          11
      Export as Image Sequence   an
      File Format         PNG
      Only Unique Frames  an
    lines: [5]
    fix:
      - line: 5
        answers:
          - Only Unique Frames  aus
    explanation: |
      Krita schreibt normalerweise für jedes Feld ein Bild, auch für gehaltene; so steckt das Timing in der Zahl gleicher Bilder. „Only Unique Frames“ schreibt nur die Keyframes, um Platz zu sparen. Damit fehlen die Wiederholungen, und bei fester Bildrate steht jede Zeichnung ein Feld lang. Willst du trotzdem nur die Zeichnungen exportieren, brauchst du die Bildliste mit Dauern daneben.
    resources:
      - title: Krita Manual · Export as Image Sequence
        url: https://docs.krita.org/en/reference_manual/render_animation.html#export-as-image-sequence

  - id: json-erklaeren
    type: explain
    title: Was in der JSON-Datei steht
    prompt: |
      Ein Ausschnitt aus der Datei, die Aseprite mit `--format json-array --list-tags` geschrieben hat. Erkläre in wenigen Sätzen, was ein Programm daraus über Lage, Dauer und Abspielweise der Animation erfährt und worauf es beim Zählen achten muss.
    lang: json
    code: |
      { "frames": [
         { "filename": "sack 0.aseprite",
           "frame": { "x": 0, "y": 0, "w": 16, "h": 16 },
           "duration": 200 },
         { "filename": "sack 1.aseprite",
           "frame": { "x": 16, "y": 0, "w": 16, "h": 16 },
           "duration": 50 },
         { "filename": "sack 2.aseprite",
           "frame": { "x": 32, "y": 0, "w": 16, "h": 16 },
           "duration": 250 }
       ],
       "meta": {
         "frameTags": [
           { "name": "landen", "from": 0, "to": 2,
             "direction": "forward", "repeat": "1" }
         ]
       }
      }
    points:
      - "`frame` gibt die Lage jedes Bildes im Sheet an; hier liegen drei Bilder zu 16 × 16 Pixeln nebeneinander."
      - "`duration` ist die Dauer jedes Bildes in Millisekunden: 200, 50 und 250, zusammen 500 ms."
      - Der Tag `landen` umfasst die Bilder 0 bis 2, also alle drei, läuft vorwärts und laut `repeat` genau einmal.
      - Bilder und Tag-Grenzen zählen ab 0; das erste Bild der Bildliste im Kurs ist hier Bild 0.
    explanation: |
      Die Datei trennt Bild und Zeit: `frame` sagt, wo ein Bild im Sheet liegt, `duration`, wie lange es steht. Ein Importer kann daraus jede Animation mit ihrem Timing aufbauen, ohne dass jemand Dauern abtippt. `direction` und `repeat` sagen, wie der Tag abläuft; `repeat` erscheint nur, wenn du im Tag eine Zahl größer 0 gesetzt hast. Die Zählung ab 0 ist die häufigste Fehlerquelle beim Übertragen in eine Bildliste, die ab 1 zählt.
    resources:
      - title: Aseprite API · Tag.repeats
        url: https://www.aseprite.org/api/tag#tagrepeats

  - id: ball-anlegen-exportieren
    type: practice
    title: Der Ball vom Papier im Editor
    prompt: |
      Nimm deinen Ball aus der Übung „Ein Ball auf Karopapier“ in [Timing und Spacing](/animation/timing-spacing) oder plane einen neuen Hüpfer. Leg ihn in deinem Editor an: Keys zeichnen, Dauern eintragen, nur die Keys abspielen, mit Onion Skinning die Zwischenbilder zeichnen, einen Tag `huepfen` anlegen, in Originalgröße in Schleife abspielen. Exportiere dann ein Sheet in 100 % mit Bilddauern (JSON oder Bildliste) und ein GIF mit ganzem Faktor. Notier hier den Ablauf so, wie du ihn in deinem Programm gemacht hast.

      Alle Zeichnungen machst du selbst. Den Export-Befehl darf dir eine KI schreiben.
    lang: text
    starter: |
      Programm und Version:
      Datei (Fassung):
      Bildliste (Bild, Dauer, Key/Zwischenbild):
      Onion Skinning (Einstellung):
      Tag:
      Export Sheet (Größe, Raster, Daten):
      Export GIF (Faktor):
    solution: |
      Beispiel mit Aseprite 1.3.18.6; in LibreSprite gleich,
      andere Programme in Klammern.

      Programm: Aseprite 1.3.18.6
      Datei: ball-v1.aseprite
      Bildliste:
        1  150 ms  Key, oben
        2   50 ms  Zwischenbild
        3   50 ms  Zwischenbild
        4  100 ms  Key, Kontakt
        5   50 ms  Zwischenbild
        6  100 ms  Key, Rückprall oben
      Onion Skinning: F3, 1 Bild davor, 1 danach, Rot-Blau
        (Pixelorama: Knöpfe links der Schleifenart;
         Krita: Glühbirne an der Ebene, Onion Skin Docker)
      Dauern: P je Bild
        (Pixelorama: FPS 20, Faktoren 3, 1, 1, 2, 1, 2;
         Krita: 20 fps, Insert Hold Frame)
      Tag: Bilder 1–6, Frame › Tags › New Tag, huepfen
      Export Sheet: Ctrl+E, By Rows, kein Trim,
        JSON Data als Array mit Tags, 100 %
        (Pixelorama: File › Export, Spritesheet, plus
         Bildliste als Textdatei; Krita: Render
         Animation als Bildfolge, ohne Only Unique)
      Export GIF: Export As, ball.gif, Resize 400 %
    checklist:
      - Programm und Version stehen in deiner Notiz.
      - Die Keys haben andere Dauern als die Zwischenbilder.
      - Es gibt einen Tag oder einen festgelegten Abspielbereich mit Namen.
      - Das Sheet ist in 100 % exportiert, ohne Trim.
      - Die Bilddauern liegen als JSON oder Bildliste neben dem Sheet.
      - Das GIF ist um einen ganzen Faktor vergrößert.
    explanation: |
      Die Übung prüft das Werkzeug, nicht den Ball. Wenn Bildliste, Tag und Export einmal sitzen, kannst du jede spätere Studie in wenigen Minuten ins Spiel und aufs Handy bringen. Die Musterlösung zeigt nur die Bedienung; deine Bildliste und deine Zeichnungen sehen anders aus.
    resources:
      - title: Aseprite Docs · Sprite Sheet, Export
        url: https://www.aseprite.org/docs/sprite-sheet/#export

  - id: eigener-spickzettel
    type: practice
    title: Dein Programm, deine Kürzel
    prompt: |
      Wähle das Programm, mit dem du animieren willst, und probier jeden Schritt der Lektion darin aus. Schreib dir einen Spickzettel: zu jedem Schritt das Menü oder Kürzel, das bei dir funktioniert hat, und was anders war als in der Lektion. Notier die Version, die dein Programm unter *Help › About* oder einem ähnlichen Menüpunkt anzeigt.
    lang: prose
    starter: |
      Programm, Version:
      Bild anfügen (Kopie / leer):
      Bild vor, zurück, abspielen:
      Dauer eines Bildes ändern:
      Verknüpftes Cel / Clone Frame:
      Tag oder Abspielbereich:
      Vorschau in Originalgröße:
      Onion Skinning an, Einstellungen:
      Export Sheet mit Dauern:
      Export GIF:
      Anders als in der Lektion:
    checklist:
      - Die Version steht da, abgelesen im Programm.
      - Jeder Schritt hat ein Menü oder Kürzel, das du selbst ausprobiert hast.
      - Du hast notiert, wie dein Programm Dauern speichert (Millisekunden, Faktor oder Felder).
      - Du hast notiert, wo die Bilddauern beim Export landen.
      - Abweichungen von der Lektion sind festgehalten, oder „keine“.
    explanation: |
      Menüs ändern sich mit Versionen, die Begriffe dahinter nicht. Ein selbst geprüfter Zettel ist verlässlicher als jede Liste, auch diese Lektion. Die Frage, wo die Dauern beim Export landen, ist die wichtigste: An ihr hängt, ob dein Timing im Spiel ankommt.
    resources:
      - title: Pixelorama · Save and Export
        url: https://www.pixelorama.org/user_manual/save_and_export
