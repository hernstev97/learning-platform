id: editor-zeitleiste
title: "Einzelbilder im Editor: Zeitleiste, Onion Skinning, Vorschau, Export"
level: 1
minutes: 130
summary: Wie du eine geplante Bewegung in Aseprite, Pixelorama, LibreSprite oder Krita Bild für Bild anlegst, Dauern ohne neue Zeichnung änderst, mit Onion Skinning Spacing und Bögen siehst, Animationen mit Tags trennst und so exportierst, dass dein Timing beim nächsten Werkzeug ankommt.
place: pc
goals:
  - Du legst Bilder, Ebenen und verknüpfte Cels in der Zeitleiste deines Editors an und benennst die Entsprechungen in den anderen drei Programmen.
  - Du überträgst eine Bildliste mit Millisekunden in Bilddauern, Pixelorama-Faktoren oder Krita-Haltebilder, ohne das Timing zu verändern.
  - Du stellst Onion Skinning so ein, dass du Spacing, Bögen und Konstanz prüfen kannst, und weißt, wann du es ausschaltest.
  - Du trennst mehrere Animationen einer Figur mit Tags und spielst jede in Originalgröße in Schleife ab.
  - Du exportierst ein Sprite-Sheet in Originalgröße mit Bilddauern oder einer Bildliste und ein vergrößertes GIF zum Zeigen.
  - Du unterscheidest, welche Arbeit hier eine KI übernehmen darf und welche nicht.
