lesson: |
  Du zeichnest eine Gliederpuppe, die eine Kiste wirft. Vier Bilder: Die Puppe hält die Kiste vor dem Bauch, streckt die Arme nach vorn, die Kiste fliegt, die Puppe steht. Beim Abspielen fliegt die Kiste davon, aber geworfen sieht das nicht aus. Sie löst sich, als hätte jemand sie an einem Faden weggezogen. Die Zeichnungen sind sauber. Es fehlt, was vor und nach dem Wurf passiert: das Ausholen, in dem die Puppe Kraft sammelt, und das Nachgeben, wenn die Kraft verbraucht ist.

  Diese Lektion zerlegt kräftige Bewegungen in drei Phasen, Antizipation, Aktion und Erholung, und zeigt, wie du jede davon zeichnest und timest. Sie setzt [Timing und Spacing](/animation/timing-spacing) voraus. Wie ein Angriff als Spielmechanik in Wind-up, aktive Phase und Erholung zerfällt und was Frame-Daten darüber sagen, steht in [Anatomie eines Angriffs](/combat/angriffsphasen). Hier geht es um die Zeichnung: Was muss man sehen, damit Kraft lesbar wird?

  ## Drei Phasen: ausholen, handeln, nachgeben

  Frank Thomas und Ollie Johnston zählen die **Antizipation** in *The Illusion of Life* (1981) zu den zwölf Grundprinzipien der Animation. Sie bereitet das Publikum auf eine Handlung vor und lässt die Handlung echter wirken. Eine Tänzerin beugt die Knie, bevor sie abspringt, ein Golfer schwingt den Schläger zuerst zurück ([Twelve basic principles: Anticipation](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Anticipation)). Der Wikipedia-Artikel zum Prinzip trennt die Ausholpose von der Aktion und der Reaktion danach. Den Zweck fasst er so zusammen: Das Publikum weiß vielleicht nicht, *warum* eine Figur etwas tut, aber es weiß, *was* sie gleich tun wird ([Anticipation (animation)](https://en.wikipedia.org/wiki/Anticipation_%28animation%29)). Daraus ergeben sich die drei Phasen dieses Moduls:

  - **Antizipation** (Ausholen): die Bewegung vor der Bewegung. Sie sammelt Kraft und kündigt an, was kommt.
  - **Aktion**: der Moment, in dem die Kraft wirkt, also Wurf, Schlag oder Absprung.
  - **Erholung** (Reaktion): Der Körper fängt die Kraft ab, kommt über das Ziel hinaus, schwingt zurück und findet in eine Ruhepose.

  Pedro Medeiros (Saint11) teilt einen Aufprall in seinem Pixelart-Tutorial noch feiner: Idle, Anticipation, Motion, Overshoot, Rest ([Impact](https://saint11.art/blog/pixel-art-tutorials/#Impact)). Auf Deutsch: Ruhe, Ausholen, Aktion, Überschwingen, Ruhe. Für die Kiste aus der Einleitung sieht eine Bildliste damit so aus:

  ```text
  Bild  Dauer   Pose
   1    200 ms  Ruhe, Kiste vorn
   2    250 ms  ausgeholt (Key)
   3     50 ms  Wischbild
   4    100 ms  Kiste los (Key)
   5     50 ms  über das Ziel
   6    150 ms  zurück
   7    300 ms  Ruhe (Key)
  ```

  Bild 2 ist die Antizipation, die Bilder 3 und 4 sind die Aktion, 5 und 6 die Erholung. Von 1 100 ms dauert die Aktion 150. So verteilen sich viele kräftige Bewegungen: lang davor, sehr kurz in der Mitte, lang danach.

  > [!MERKE]
  > Antizipation sammelt Kraft und kündigt an. Die Aktion ist oft die kürzeste Phase. Die Erholung zeigt, wie viel Kraft im Spiel war, und führt in eine Ruhepose.

  ## Antizipation: Gegenbewegung, Größe, Dauer

  ### Erst in die Gegenrichtung

  Eine Antizipation geht fast immer gegen die Richtung der Aktion. Wer nach vorn wirft, nimmt die Arme zurück und verlagert das Gewicht aufs hintere Bein. Wer hochspringt, geht zuerst in die Hocke. Wikipedia beschreibt nach Thomas und Johnston einen Läufer vor dem Sprint, der sich duckt, „gathering like a spring“. Eadweard Muybridges Serienfotos eines Schmieds von 1887 zeigen dasselbe am Hammer: In der oberen Reihe steigt er über den Kopf, bevor er auf den Amboss fällt ([Animal Locomotion, Tafel 378](https://commons.wikimedia.org/wiki/File:Man_in_pelvis_cloth_hammering_an_anvil_%28rbm-QP301M8-1887-378%29.jpg)).

  In einer Bildliste erkennst du die Gegenbewegung an der Position. Ein Mehlsack springt hoch, hier die Höhe seiner Mitte über dem Boden, ein `#` für 2 Pixel:

  ```text
  Bild  Höhe
   1    ######       Stand
   2    ####         Hocke
   3    ###          tiefste Hocke
   4    ########     Absprung
   5    ############ Scheitel
  ```

  Zwei Bilder lang sinkt der Sack, obwohl er nach oben will. Fehlen diese Bilder, steigt er wie an einem Seil gezogen.

  ### Größe kündigt Kraft an

  Animatoren nutzen die Größe der Antizipation, um Kraft anzukündigen: ein kurzes Zurücknehmen vor einem leichten Wurf, ein weites Ausholen vor einem schweren. Raymond Schlitter (Slynyrd) schreibt über Angriffsanimationen: „The longer and more dramatic the wind up, the more impactful a strike can feel, but results in more input delay“ ([Pixelblog 56](https://www.slynyrd.com/blog/2025/5/23/pixelblog-56-top-down-character-attack-animation)). Achte auf das „can feel“: Er beschreibt eine Erfahrung, kein Gesetz; ob dein Zuschauer die Kraft liest, prüfst du selbst. Der zweite Teil seines Satzes betrifft dich als Spieleentwickler: Jede Millisekunde Ausholen verzögert die Aktion.

  ### Dauer: lang genug, um gelesen zu werden

  Die Ausholpose ist ein Key. Steht sie so kurz wie ein Zwischenbild, übersieht man sie; die Übung zur verschluckten Hocke in [Timing und Spacing](/animation/timing-spacing) zeigt das. Wie lang „lang genug“ ist, hängt von der Bewegung ab. Bei einem schwachen Schlag kann ein einziges Ausholbild reichen, wenn es eine klare Gegenpose zeigt ([Cartwright, ab 2:25](https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=145s)); mehr in [Anatomie eines Angriffs](/combat/angriffsphasen). Ein schwerer Schlag bekommt dagegen eine Ausholpose, die man bewusst wahrnimmt.

  ### Spielfigur und Gegner

  In einem Spiel hat die Antizipation einen Preis. Medeiros rät in seinem Sprung-Tutorial, sie bei Figuren, die der Spieler steuert, zu vermeiden ([Jump](https://saint11.art/blog/pixel-art-tutorials/#Jump)). Zu Angriffen schreibt er: „It's important that there's no anticipation frame or players will feel input lag“ ([Attack Sheet](https://saint11.art/blog/pixel-art-tutorials/#AttackSheet)). Bei Gegnern ist die Antizipation dagegen die Zeit, in der der Spieler reagiert; das behandeln [Anatomie eines Angriffs](/combat/angriffsphasen) und [Gegnermuster und Telegraphing](/combat/gegnermuster). Ob und wie lang deine Spielfigur ausholen darf, entscheidest du mit [Animation im Spiel](/animation/animation-im-spiel).

  ## Die Aktion: wenige Bilder, großer Weg

  In der Aktion passiert am meisten in der kürzesten Zeit. Medeiros rät im Impact-Tutorial: „Remove frames between rest and target position for a faster and stronger movement“. Zwischen Ausholpose und Ziel liegen deshalb oft nur ein oder zwei Bilder.

  Wird der Weg von einem Bild zum nächsten zu groß, verliert das Auge den Gegenstand. Kyle Bunk (Firaxis) zeigt in seinem GDC-Vortrag einen Schwerthieb, bei dem das Schwert von oben nach unten springt, ohne dass ein Bild den Weg dazwischen zeigt. Er nennt das irritierend und setzt dort ein **Wischbild** (Smear) ein ([High Resolution Pixel Art and Animation, ab 11:48](https://www.youtube.com/watch?v=Ih65Kg4DTw8&t=708s)). Ein Wischbild ist ein Bild zwischen zwei Keys, das eine schnelle Bewegung als gestreckte, verwischte Form zeigt ([Smear frame](https://en.wikipedia.org/wiki/Smear_frame)). Medeiros schreibt: „The motion blur smears the image, like it's trying to connect it to the previous frame“ ([Motion Blur](https://saint11.art/blog/pixel-art-tutorials/#MotionBlur)). Cartwright zeigt, wie ein einziges solches Bild Anfang, Weg und Ende einer Bewegung zusammenfasst ([ab 5:37](https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=337s)).

  Ein Ball, der in einem Bild von links nach rechts saust, als Pixelraster. `#` ist dunkel, `+` Mittelton, `-` hell, `.` leer:

  ```text
  Bild 1 (Start)
  .##.............
  ####............
  ####............
  .##.............
  Bild 2 (Wischbild)
  ......-+++##....
  ...---+++####...
  ...---+++####...
  ......-+++##....
  Bild 3 (Ziel)
  ...........##...
  ..........####..
  ..........####..
  ...........##...
  ```

  In Bild 2 springt der Ball nicht, er zieht sich über den Weg: dunkel vorn, wo er hinwill, hell hinten, wo er herkommt.

  Zwei Regeln halten Wischbilder im Zaum. Erstens kommen sie nur bei echtem Tempo vor. Tyriq Plummer erklärt in seinem GDC-Vortrag, dass Smears die Folge einer schnellen Bewegung sind: Ein Bild muss zusätzliche Information tragen, um das vorige mit dem nächsten zu verbinden. Er sieht oft das Gegenteil, eine langsame, gut lesbare Bewegung mit Schweif, weil schnelle Dinge eben Schweife haben ([2D Animation for Games: A Primer, ab 36:20](https://www.youtube.com/watch?v=PKZJmHrG4Yw&t=2180s)). Zweitens stehen sie kurz. Schlitter: „the smear frames should always be few and fast“ ([Pixelblog 9](https://www.slynyrd.com/blog/2018/9/8/pixelblog-9-melee-attacks)). Für Ausholen und Erholung rät er in Pixelblog 56 ganz davon ab, weil Wischbilder dort von der Vorwärtsbewegung ablenken.

  > [!WARNING] Ein Wischbild, das man sieht
  > Je länger ein Wischbild steht, desto eher liest man es als eigene Form statt als Bewegung. Wie lang zu lang ist, zeigt dir der Beobachtungstest: Beschreibt jemand einen Fleck oder Schlauch, ist das Wischbild sichtbar geworden. In Schlitters Beispielen steht jedes Wischbild 50 ms, im Spiel 3 Ticks.

  ## Erholung: über das Ziel hinaus und zurück

  Eine kräftige Bewegung endet selten genau im Ziel. Der Körper kommt ein Stück darüber hinaus und pendelt zurück. Schlitter beschreibt dieses **Überschwingen** (Overshoot) so: „an object stopping will slightly 'overshoot' the stop point before eventually stopping“. Bei einem Schlag verschiebt er dafür nach dem Erholungsbild die Haltung ein Bild lang um einen Pixel (Pixelblog 9). Medeiros lässt eine stürzende Figur beim Aufkommen über den Boden hinaus sinken, „Overshoot ground (+1 pixel down)“, dann federn die Arme nach, dann folgt die Ruhe ([Death](https://saint11.art/blog/pixel-art-tutorials/#Death)). Cartwright setzt bei Skullgirls ein Bild über die Schlagpose hinaus und lässt die Figur danach in die Pose zurückfinden ([ab 6:32](https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=392s)).

  Das Zurückpendeln heißt **Ausschwingen** (Settle). Jeder Ausschlag ist kleiner als der vorige, bis die Pose steht. Die Hand der Puppe nach dem Wurf, x-Position in Pixeln, Ziel bei 30:

  ```text
  Bild  Hand-x  Phase
   4    30      Kiste los (Key)
   5    33      über das Ziel
   6    29      zurück
   7    30      Ruhe
  ```

  Plus 3, dann minus 1, dann 0. In Pixelart reichen oft ein oder zwei Pixel. Wie lose Teile wie Haare oder Ärmel gegeneinander versetzt nachschwingen, ist ein eigenes Thema: [Bögen, Nachziehen und Überlappung](/animation/boegen-ueberlappung). Hier bewegt sich der ganze Körper.

  ### Die Erholung zeigt das Gewicht

  Was nach der Aktion passiert, verrät, wie viel Kraft im Spiel war. Schlitter hält in seinen Angriffen das Bild nach dem Schlag länger, „to emphasize the commitment of the attack, and weight of the weapon“ (Pixelblog 56). Masahiro Sakurai rät in [Follow-Throughs Make the Impact](https://www.youtube.com/watch?v=cIB0BUe6Ihk&t=199s) (ab 3:19), die Pose nach dem Treffer zu halten, statt die Figur gleichmäßig in die Ruhe zurückgleiten zu lassen. Nach der Haltezeit kehrt die Figur in eine Ruhepose zurück. Ihre letzte Pose muss zur ersten Pose der Ruhe passen, sonst springt sie beim Wechsel; wie du das prüfst, steht in [der Testszene](/animation/testszene). Lange Erholungen kosten im Spiel Kontrolle. Cartwright beschreibt, wie lange Rückwege in die Ruhe die Reaktion der Figur verschlechtern ([ab 13:10](https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=790s)).

  ## Phasen timen: Zahlen aus einem veröffentlichten Beispiel

  Schlitter gibt in Pixelblog 56 für drei Waffen dieselbe Bildfolge mit sechs Bildern an, jeweils mit eigenen Dauern. Ein Bild holt aus, drei kurze Bilder in der Mitte tragen den Schlag (Wischbilder, beim Hammer mit einem Rückprall), ein gehaltenes Bild folgt dem Schlag nach, ein Bild führt zurück. Das Modell rechnet Gesamtdauer und Anteil des Ausholens:

  ```python run
  # Slynyrd, Pixelblog 56
  # ms je Bild
  schwert = [100, 50, 50,
             50, 100, 50]
  speer = [200, 50, 50,
           50, 150, 50]
  hammer = [250, 50, 50,
            50, 300, 100]

  for d in (schwert, speer,
            hammer):
      gesamt = sum(d)
      anteil = d[0] / gesamt
      print(gesamt, d[0],
            round(anteil, 2))
  ```

  Das Ausholen wächst von 100 auf 250 ms, das gehaltene Bild nach dem Schlag von 100 auf 300 ms. Die drei Bilder in der Mitte bleiben bei je 50 ms. Die schwerere Waffe bekommt mehr Zeit vor und nach dem Schlag, der Schlag selbst wird nicht langsamer. Der Anteil des Ausholens wächst dabei nicht gleichmäßig mit dem Gewicht: 0,25, 0,36, 0,31. Beim Hammer wächst die Zeit danach stärker als die davor. In Pixelblog 9 fasst Schlitter das als Regel für schwere Waffen: langsameres Ausholen und Erholen, „However the smear frames should always be few and fast“.

  > [!PRAXIS] Gewicht über Haltezeiten, nicht über Bilder
  > Schlitter zeichnet für Schwert, Speer und Hammer jeweils sechs Bilder in fast denselben Phasen. Das Gewicht der Waffe steckt in den Dauern von Ausholen und Nachziehen. Die Unterschiede liegen dort, wo du sie im Editor änderst, ohne neu zu zeichnen. Für dich heißt das: Wenn eine Bewegung zu leicht wirkt, prüf zuerst die Dauern der Keys um die Aktion herum, bevor du Bilder hinzufügst.

  ## Prüfen, ob die Kraft ankommt

  Ob ein Wurf kräftig wirkt, steht in keiner Bildliste. Schreib vor dem Zeichnen einen **Absichtssatz**, etwa „Die Puppe wirft die schwere Kiste mit aller Kraft weg“. Zeig die fertige Studie dann im **Beobachtungstest**: ohne Vorrede, dreimal in Schleife, und frag nur „Was passiert da?“. Antwortet jemand „Sie schubst die Kiste weg“, ist das eine Information über deine Antizipation, kein Urteil über dich. Wie du fragst, ohne die Antwort vorzugeben, und was eine einzelne Antwort beweist, steht in [Körpersprache und Zustandswechsel](/animation/koerpersprache).

  Willst du wissen, was die Antizipation beiträgt, ändere nur sie. Zeichne drei Fassungen, die sich allein in der Tiefe der Ausholpose unterscheiden, und zeig sie in gemischter Reihenfolge. Ändert sich nebenbei auch die Dauer, weißt du hinterher nicht, was gewirkt hat. Wie man Varianten im Editor sauber baut, zeigt [Werkstatt: neutrale Studien in Varianten](/animation/werkstatt-studien).

  > [!TIP] Ausholen im Daumenkino tauschen
  > Zeichne die Ausholpose auf drei Haftzettel in drei Tiefen. Den Rest des Daumenkinos lässt du gleich und steckst nur den einen Zettel um. So vergleichst du im Bus drei Antizipationen mit einem Block.

  > [!INTERVIEW]
  > „Wie zeigst du in sechs Bildern, dass ein Schlag kräftig ist?“ Gute Antwort: Ich zeichne eine deutliche Gegenbewegung als Key und halte sie lange genug, dass man sie liest. Die Aktion bekommt ein, zwei kurze Bilder; ist der Weg dazwischen zu groß, setze ich ein Wischbild, das nur kurz steht. Danach kommt die Figur über das Ziel hinaus, schwingt zurück und hält die Endpose. Gewicht zeige ich über die Haltezeiten vor und nach dem Schlag, nicht über mehr Bilder. Ob der Schlag kräftig wirkt, prüfe ich mit jemandem, der ihn ohne Erklärung sieht, und im Spiel zusätzlich, wie viel Ausholen die Steuerung verträgt.

  ## Häufige Fehler

  - **Ausholen in Bewegungsrichtung.** Die Puppe nimmt die Kiste vor dem Wurf ein Stück nach vorn statt zurück, und der Wurf wirkt wie ein Schieben. Die Antizipation geht gegen die Aktion.
  - **Ausholpose wie ein Zwischenbild getimt.** Sie steht 50 ms, und niemand sieht sie. Ein Key braucht eine Haltezeit.
  - **Die Aktion mit Zwischenbildern gefüllt.** Fünf gleichmäßige Bilder zwischen Ausholen und Ziel machen den Schlag langsam. Streich Bilder und setz dort, wo der Weg zu groß wird, ein Wischbild.
  - **Wischbild am falschen Ort.** Ein Schweif an einer langsamen Bewegung ist Dekoration, kein Tempo. Steht ein Wischbild so lange wie ein Key, sieht man es als Form.
  - **Harter Halt im Ziel.** Die Figur kommt an und steht. Ein Bild Überschwingen um ein, zwei Pixel und ein Bild zurück lassen sie ankommen.
  - **Gewicht über mehr Bilder in der Aktion.** Ein schwerer Hammer schlägt bei Schlitter nicht langsamer zu. Er braucht länger, bevor er fällt, und länger, bis die Figur wieder steht.
  - **Endpose passt nicht zur Ruhe.** Nach der Erholung springt die Figur in die Ruhepose. Leg letzte Pose und erste Ruhepose übereinander.

  ## Zusammenfassung

  - Kräftige Bewegungen haben drei Phasen: Antizipation, Aktion, Erholung. Medeiros teilt feiner in Ruhe, Ausholen, Aktion, Überschwingen, Ruhe.
  - Die Antizipation geht gegen die Richtung der Aktion. Ihre Größe kündigt Kraft an, ihre Dauer entscheidet, ob man sie liest.
  - In Spielen kostet Antizipation Reaktionszeit. Bei der Spielfigur ist sie oft kurz oder fehlt, bei Gegnern ist sie die Zeit des Spielers.
  - Die Aktion ist oft die kürzeste Phase. Wischbilder verbinden große Wege, stehen kurz und kommen nur bei echtem Tempo vor.
  - In der Erholung schwingt der Körper über das Ziel hinaus und pendelt mit kleiner werdendem Ausschlag zurück. In Pixelart reichen ein, zwei Pixel.
  - Gewicht zeigt sich in den Haltezeiten vor und nach der Aktion. Bei Schlitter wachsen sie mit der Waffe, die Wischbilder bleiben bei 50 ms.
  - Ob die Kraft ankommt, prüfst du mit Absichtssatz und Beobachtungstest, nicht mit einer Regel.
exercises:
  - id: antizipation-aussagen
    type: choice
    title: Was stimmt über das Ausholen?
    prompt: |
      Welche Aussagen über die Antizipation stimmen?
    options:
      - text: Sie geht meist gegen die Richtung der Aktion, etwa Arme zurück vor einem Wurf nach vorn.
        correct: true
        why: Die Gegenbewegung sammelt Kraft und zeigt, wohin es gleich geht. Thomas und Johnston nennen als Beispiele das Kniebeugen vor dem Sprung und das Zurückschwingen des Golfschlägers.
      - text: Eine größere Ausholbewegung kündigt mehr Kraft an. Ob ein Zuschauer das so liest, prüfst du.
        correct: true
        why: Animatoren nutzen die Größe als Konvention. Schlitter schreibt, ein längeres Ausholen könne sich wuchtiger anfühlen, und knüpft daran keine Garantie.
      - text: Eine Antizipation muss mindestens drei Bilder lang sein, sonst sieht man sie nicht.
        correct: false
        why: Cartwright zeigt einen Skullgirls-Angriff mit genau einem Ausholbild. Entscheidend ist, dass das Bild als Pose lesbar ist und lange genug steht, nicht die Zahl der Bilder.
      - text: Lässt man sie weg, wo das Publikum sie erwartet, kann das überraschen.
        correct: true
        why: Der Wikipedia-Artikel zur Antizipation nennt das Weglassen als Mittel für Überraschung, bei Thomas und Johnston als „surprise gag“.
      - text: Antizipation gibt es nur im Zeichentrickfilm, in Spielen wird sie nicht gezeichnet.
        correct: false
        why: Auch Spiele zeichnen sie, bei Gegnern oft deutlich. Bei Spielfiguren halten Animatoren sie kurz, weil sie Reaktionszeit kostet.
    explanation: |
      Die Antizipation ist eine Gegenbewegung, die Kraft sammelt und ankündigt. Ihre Größe und Dauer wählst du nach der Kraft, die du zeigen willst, und nach dem, was das Spiel verträgt. Ein einziges Bild kann reichen, wenn es eine klare Pose ist. Ob Größe und Dauer beim Zuschauer ankommen, ist eine Frage an den Beobachtungstest, keine feste Regel.
    resources:
      - title: Wikipedia · Anticipation (animation)
        url: https://en.wikipedia.org/wiki/Anticipation_%28animation%29

  - id: wurf-ordnen
    type: order
    title: Eine Kiste, ein Wurf
    prompt: |
      Bring die Posen eines Kistenwurfs in die Reihenfolge, in der sie im Daumenkino stehen.
    lang: prose
    lines: |
      Die Puppe steht und hält die Kiste vor dem Bauch.
      Das Gewicht geht aufs hintere Bein, die Arme nehmen die Kiste nach hinten.
      Wischbild: Arme und Kiste auf dem Weg nach vorn.
      Die Arme sind gestreckt, die Kiste löst sich.
      Die Arme schwingen ein Stück über die Wurfrichtung hinaus.
      Die Arme pendeln ein kleines Stück zurück.
      Die Puppe steht ruhig und sieht der Kiste nach.
    explanation: |
      Erst die Ruhe, dann die Gegenbewegung nach hinten als Antizipation. Das Wischbild verbindet die Ausholpose mit dem Moment, in dem die Kiste loskommt; beide zusammen sind die Aktion. Danach kommt die Erholung: Überschwingen über die Wurfrichtung hinaus, Ausschwingen zurück, Ruhepose. Wer das Wischbild vor die Ausholpose setzt, verbindet Ruhe und Ausholen mit einem Schweif, und davon rät Schlitter ab.
    resources:
      - title: Saint11 · Impact
        url: https://saint11.art/blog/pixel-art-tutorials/#Impact

  - id: anteil-hammer
    type: output
    title: Wie viel ist Ausholen?
    prompt: |
      Schlitters Hammerschlag aus Pixelblog 56 hat sechs Bilder. Bild 1 ist das Ausholen. Wie viel Prozent der Gesamtdauer nimmt es ein? Antworte mit einer ganzen Zahl.
    lang: text
    code: |
      Bild   1    2   3   4    5    6
      ms    250  50  50  50  300  100
    expected: |
      31
    accept:
      - 31 %
      - 31%
      - 31 Prozent
    hints:
      - Rechne zuerst die Gesamtdauer aus.
    explanation: |
      Die Gesamtdauer ist 250 + 50 + 50 + 50 + 300 + 100 = 800 ms. 250 / 800 = 0,3125, gerundet 31 %. Beim Schwert sind es 100 von 400 ms, also 25 %. Der Anteil wächst mit der schweren Waffe nur wenig, weil beim Hammer auch das gehaltene Bild nach dem Schlag stark wächst. Die drei Bilder in der Mitte bleiben in allen drei Fassungen bei je 50 ms.
    resources:
      - title: Slynyrd · Pixelblog 56
        url: https://www.slynyrd.com/blog/2025/5/23/pixelblog-56-top-down-character-attack-animation

  - id: phasen-summieren
    type: output
    title: Millisekunden je Phase
    prompt: |
      Was gibt das Programm aus?
    lang: python
    code: |
      bilder = [("aus", 200),
                ("akt", 50),
                ("akt", 50),
                ("erh", 100),
                ("erh", 250)]
      summe = {}
      for phase, ms in bilder:
          alt = summe.get(phase, 0)
          summe[phase] = alt + ms
      for phase in summe:
          print(phase, summe[phase])
    expected: |
      aus 200
      akt 100
      erh 350
    explanation: |
      Das Programm addiert die Dauern je Phase und gibt danach eine Zeile pro Phase aus: Ausholen 200 ms, Aktion zweimal 50 ms, Erholung 100 und 250 ms. Ein Wörterbuch behält die Reihenfolge, in der die Schlüssel zuerst auftauchen, deshalb steht `aus` in der ersten Zeile. Das Ergebnis zeigt das typische Muster: Die Aktion ist mit 100 ms die kürzeste Phase, die Erholung die längste.

  - id: ueberschwingen-messen
    type: output
    title: Wie weit hinaus?
    prompt: |
      Die Hand der Puppe soll nach dem Wurf bei x = 40 stehen. Um wie viele Pixel schwingt sie über dieses Ziel hinaus? Antworte mit der Zahl.
    lang: text
    code: |
      Bild  Hand-x  Pose
       3    12      ausgeholt
       4    26      Wischbild
       5    40      Kiste los
       6    42      ?
       7    39      ?
       8    40      Ruhe
    expected: |
      2
    accept:
      - 2 px
      - 2 Pixel
    explanation: |
      In Bild 6 steht die Hand bei 42, also 2 Pixel hinter dem Ziel 40. Das ist das Überschwingen. In Bild 7 pendelt sie auf 39 zurück, einen Pixel vor das Ziel, und in Bild 8 steht sie. Die Ausschläge werden kleiner: plus 2, minus 1, 0. Genau dieses Abklingen unterscheidet ein Ausschwingen von einem Zittern.
    resources:
      - title: Slynyrd · Pixelblog 9, Melee Attacks
        url: https://www.slynyrd.com/blog/2018/9/8/pixelblog-9-melee-attacks

  - id: sprung-phasen
    type: gap
    title: Ein Mehlsack springt
    prompt: |
      Trag für jedes Bild die Phase ein: Antizipation, Aktion oder Erholung.
    lang: text
    code: |
      Sprung eines Mehlsacks
      1 Stand ........ Ruhe
      2 Hocke ........ ⟦Antizipation⟧
      3 Streckung .... ⟦Aktion⟧
      4 Flug ......... Aktion
      5 Landung, tief  ⟦Erholung⟧
      6 federt hoch .. Erholung
      7 Stand ........ Ruhe
    gaps:
      - label: Bild 2
        hint: Der Sack geht nach unten, obwohl er nach oben will.
        accept: ["antizipation", "Ausholen", "ausholen", "Anticipation"]
      - label: Bild 3
        hint: Hier wirkt die Kraft, die ihn hebt.
        accept: ["aktion", "Action"]
      - label: Bild 5
        hint: Der Sack sinkt tiefer, als er am Ende steht.
        accept: ["erholung", "Reaktion", "reaktion"]
    explanation: |
      Die Hocke ist die Gegenbewegung vor dem Sprung, also Antizipation. Streckung und Flug sind die Aktion. Bei der Landung sinkt der Sack tiefer als im Stand: Er schwingt über seine Ruhehöhe hinaus nach unten, federt zurück und steht. Das ist die Erholung, mit Überschwingen und Ausschwingen wie nach einem Wurf, nur in der Senkrechten.
    resources:
      - title: Saint11 · Jump
        url: https://saint11.art/blog/pixel-art-tutorials/#Jump

  - id: begriffe-kraft
    type: gap
    title: Fünf Wörter für Kraft
    prompt: |
      Ergänze die fehlenden Wörter.
    lang: prose
    code: |
      Vor einem Wurf nach vorn nimmt die Figur die Arme zurück. Diese ⟦Gegenbewegung⟧ ist die Antizipation.
      Ein Bild, das den Weg einer schnellen Bewegung als gestreckte, verwischte Form zeigt, heißt ⟦Wischbild⟧.
      Kommt der Körper über das Ziel hinaus, spricht man von ⟦Überschwingen⟧.
      Danach pendelt er mit kleiner werdendem Ausschlag zurück: Er schwingt ⟦aus⟧.
      Ein schwerer Hammer bekommt bei Schlitter längere Haltezeiten vor und ⟦nach⟧ dem Schlag, nicht mehr Bilder in der Aktion.
    gaps:
      - label: Bewegung vor der Bewegung
        hint: Sie geht in die andere Richtung als die Aktion.
        accept: ["Ausholbewegung", "Ausholen"]
      - label: Gestrecktes Bild
        hint: Auf Englisch Smear.
        accept: ["Smear", "Smear-Bild", "Smearbild", "Smear Frame"]
      - label: Über das Ziel
        hint: Auf Englisch Overshoot.
        accept: ["Overshoot", "Überschießen"]
      - label: Zurückpendeln
        hint: Auf Englisch Settle.
      - label: Zeitpunkt
        hint: Das Gegenteil von vor.
    explanation: |
      Antizipation ist eine Gegenbewegung, das Wischbild verbindet einen großen Weg, Überschwingen und Ausschwingen bringen die Bewegung zur Ruhe. Der letzte Satz fasst Schlitters Beispiel zusammen: Die drei Bilder in der Mitte bleiben bei 50 ms, Ausholen und das Bild nach dem Schlag wachsen mit dem Gewicht der Waffe.
    resources:
      - title: Wikipedia · Smear frame
        url: https://en.wikipedia.org/wiki/Smear_frame

  - id: wischbild-zu-lang
    type: bug
    title: Ein Schlauch in der Mitte
    prompt: |
      Eine Gliederpuppe wirft eine Kiste. Eine Testperson sagt nach dem dritten Durchlauf: „In der Mitte ist kurz so ein komischer Schlauch zu sehen.“ Die Zeichnungen stimmen. Finde die Zeile, die das verursacht.
    lang: text
    code: |
      Bild  Dauer   Pose
       1    200 ms  Ruhe
       2    250 ms  ausgeholt (Key)
       3    150 ms  Wischbild
       4    100 ms  Kiste los (Key)
       5     50 ms  über das Ziel
       6    300 ms  Ruhe (Key)
    lines: [4]
    hints:
      - Vergleich die Dauer des Wischbilds mit der Dauer der Keys.
    explanation: |
      Das Wischbild steht 150 ms, länger als die Pose, in der die Kiste loskommt. So lange liest das Auge es als eigene Form, und der Zuschauer beschreibt einen Schlauch statt einer Bewegung. Wischbilder stehen kurz, bei Schlitter 50 ms, also 3 Ticks. Welchen Wert du wählst, entscheidest du; der Fehler ist, dass ein Weg so lange steht wie ein Ziel.
    resources:
      - title: Slynyrd · Pixelblog 9, Melee Attacks
        url: https://www.slynyrd.com/blog/2018/9/8/pixelblog-9-melee-attacks

  - id: ausholen-falsche-richtung
    type: bug
    title: Geschoben statt geworfen
    prompt: |
      Die Puppe wirft eine Kiste nach rechts, x wächst nach rechts. Drei Testpersonen beschreiben den Wurf mit Wörtern wie „schubst“ und „schiebt“; ein Ausholen erwähnt niemand. Finde die Zeile, die das verursacht.
    lang: text
    code: |
      Wurf nach rechts, Hand-x in px
      Bild  x   Pose
       1    20  Ruhe
       2    26  ausgeholt (Key)
       3    40  Wischbild
       4    52  Kiste los (Key)
       5    55  über das Ziel
       6    52  Ruhe
    lines: [4]
    hints:
      - In welche Richtung bewegt sich die Hand zwischen Bild 1 und Bild 2?
    explanation: |
      Zwischen Ruhe (20) und Ausholpose (26) geht die Hand nach rechts, also schon in Wurfrichtung. Damit gibt es keine Gegenbewegung, und die Puppe beginnt den Wurf aus einer Pose, die schon halb vorn ist. Eine Antizipation liegt hier links vom Ruhewert, etwa bei 10. Wie weit, hängt von der Kraft ab, die du zeigen willst; die Richtung nicht.
    resources:
      - title: Wikipedia · Twelve basic principles, Anticipation
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Anticipation

  - id: drei-waffen-erklaeren
    type: explain
    title: Schwert, Speer, Hammer
    prompt: |
      Raymond Schlitter animiert in Pixelblog 56 drei Waffen mit je sechs Bildern und gibt diese Dauern an. Erkläre in wenigen Sätzen, wo das Gewicht der Waffen steckt und was gleich bleibt.
    lang: text
    code: |
      Slynyrd, Pixelblog 56, ms je Bild
      Bild     1    2   3   4    5    6
      Schwert 100  50  50  50  100   50
      Speer   200  50  50  50  150   50
      Hammer  250  50  50  50  300  100
      1 Ausholen, 2–4 Schlag,
      5 gehalten, 6 zurück
    points:
      - Die Bilder 2 bis 4 bleiben bei allen Waffen bei 50 ms; der Schlag selbst wird nicht langsamer.
      - Das Ausholen wächst mit dem Gewicht (100, 200, 250 ms).
      - Das gehaltene Bild nach dem Schlag wächst am stärksten (100, 150, 300 ms); dort zeigt Schlitter Wucht und Gewicht.
      - Längeres Ausholen kostet im Spiel Reaktionszeit, Schlitter nennt das selbst als Preis.
    explanation: |
      Alle drei Waffen haben dieselben Phasen, und die Bilder des Schlags stehen immer 50 ms. Das Gewicht steckt davor und danach. Das Ausholen wird länger, damit die Kraft angekündigt wird, und das Bild nach dem Schlag wird noch länger, weil eine schwere Waffe Zeit braucht, bis die Figur sie wieder im Griff hat. Schlitter schreibt dazu, ein längeres Ausholen könne sich wuchtiger anfühlen, bringe aber mehr Verzögerung nach der Eingabe. Für eine Spielfigur ist das eine Abwägung, die du in [Animation im Spiel](/animation/animation-im-spiel) triffst.
    resources:
      - title: Slynyrd · Pixelblog 56
        url: https://www.slynyrd.com/blog/2025/5/23/pixelblog-56-top-down-character-attack-animation

  - id: sprung-drei-ausholer
    type: practice
    title: Ein Sprung, drei Antizipationen
    prompt: |
      Plan auf Papier einen Mehlsack (oder eine Gliederpuppe), der hochspringt und landet, in drei Fassungen. Die Fassungen unterscheiden sich nur in der Tiefe der Hocke vor dem Absprung: flach, mittel, tief. Bildzahl, Dauern und alle anderen Posen bleiben gleich. Schreib vorher für jede Fassung einen Absichtssatz. Bau ein Daumenkino aus Haftzetteln, in dem du nur den Zettel mit der Hocke tauschst.

      Zeig die drei Fassungen danach jemandem im Beobachtungstest, in gemischter Reihenfolge, jede dreimal ohne Vorrede. Frag zu jeder „Was passiert da?“ und am Ende „Worin unterscheiden sich die drei?“. Notiere hier nur deine Pläne und die Antworten.
    lang: prose
    starter: |
      Absichtssatz flach:
      Absichtssatz mittel:
      Absichtssatz tief:
      Bildliste (Bild, Dauer, Pose):
      Reihenfolge beim Zeigen:
      Antworten (wörtlich, wer):
      Abweichung von meiner Absicht:
    checklist:
      - Für jede Fassung steht ein Absichtssatz, geschrieben vor dem Zeichnen.
      - Die drei Fassungen unterscheiden sich nur in der Tiefe der Hocke; Bildzahl und Dauern sind gleich.
      - In jeder Fassung geht der Sack vor dem Absprung nach unten.
      - Die Reihenfolge, in der du gezeigt hast, ist notiert.
      - Die Antworten stehen wörtlich da, mit Initialen der Person.
      - Du hast in einem Satz notiert, wo eine Antwort von deiner Absicht abweicht, ohne aus einer Antwort eine Regel zu machen.
    explanation: |
      Die Übung isoliert eine einzige Größe, die Tiefe der Antizipation. Weil alles andere gleich bleibt, kannst du einen Unterschied in den Antworten dieser Größe zuschreiben. Die gemischte Reihenfolge verhindert, dass der Zuschauer eine Steigerung erwartet. Ob „tief“ als kräftiger gelesen wird, beantwortet nicht diese Lektion, sondern deine Beobachtung; wie du dabei fragst, steht in [Körpersprache und Zustandswechsel](/animation/koerpersprache).
    resources:
      - title: Wikipedia · Anticipation (animation)
        url: https://en.wikipedia.org/wiki/Anticipation_%28animation%29

  - id: schmied-zaehlen
    type: practice
    title: Der Schmied von 1887
    prompt: |
      Öffne Muybridges [Tafel 378](https://commons.wikimedia.org/wiki/File:Man_in_pelvis_cloth_hammering_an_anvil_%28rbm-QP301M8-1887-378%29.jpg), ein Schmied schlägt mit beiden Händen auf einen Amboss, und vergrößere die obere Reihe. Zähl, in wie vielen Bildern der Hammer steigt, in wie vielen er oben ist und in wie vielen er fällt. Markiere das Bild, das dem Aufschlag am nächsten ist, und beschreib in Stichpunkten, was Oberkörper und Knie danach tun. Notiere zum Schluss, was du für eine eigene Hammerstudie mit sechs Bildern übernehmen würdest.
    lang: prose
    starter: |
      Bilder steigend:
      Bilder oben:
      Bilder fallend:
      Bild am nächsten am Aufschlag:
      Oberkörper und Knie danach:
      Für meine Studie mit 6 Bildern:
    checklist:
      - Du hast die Bilder gezählt, nicht geschätzt, und die Zählung gilt für die obere Reihe.
      - Du hast notiert, ob der Hammer länger steigt oder länger fällt.
      - Das Bild am nächsten am Aufschlag ist mit seiner Nummer in der Reihe markiert.
      - Du beschreibst die Haltung nach dem Aufschlag mit Körperteilen (Rücken, Knie, Arme), nicht mit Eindrücken.
      - Deine Notiz für die eigene Studie nennt, welche Phase welche Bilder bekommt.
    explanation: |
      Muybridges Fotos sind eine gemeinfreie Referenz. Ob die Abstände zwischen den Aufnahmen gleich lang waren, verrät die Tafel nicht, deshalb zählst du Bilder, keine Millisekunden. Was du siehst, ist die Gegenbewegung in echt: Der Hammer muss hoch, bevor er fallen kann, und der Körper gibt nach dem Aufschlag nach. Für eine Pixelart-Studie mit sechs Bildern wählst du daraus wenige Keys aus. Mehr zum Arbeiten mit Referenzen steht in [Bewegung beobachten und in Schlüsselposen zerlegen](/animation/beobachten-schluesselposen).
    resources:
      - title: Muybridge · Animal Locomotion, Tafel 378 (Wikimedia Commons)
        url: https://commons.wikimedia.org/wiki/File:Man_in_pelvis_cloth_hammering_an_anvil_%28rbm-QP301M8-1887-378%29.jpg
