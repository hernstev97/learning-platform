id: antizipation-erholung
title: "Antizipation, Aktion, Erholung: Kraft sichtbar machen"
level: 2
minutes: 110
summary: Wie du eine kräftige Bewegung in Ausholen, Aktion und Erholung zerlegst, warum die Aktion oft die kürzeste Phase ist, wann ein Wischbild den Weg verbindet und wie eine Figur über das Ziel hinausschwingt und zur Ruhe kommt.
place: unterwegs
goals:
  - Du zerlegst eine kräftige Bewegung in Antizipation, Aktion und Erholung und ordnest jedes Bild einer Bildliste einer Phase zu.
  - Du planst eine Antizipation als Gegenbewegung und wählst ihre Größe und Dauer nach der Kraft, die du zeigen willst.
  - Du setzt Wischbilder nur dort, wo der Weg zwischen zwei Bildern zu groß ist, und lässt sie kürzer stehen als die Keys.
  - Du zeichnest eine Erholung mit Überschwingen und Ausschwingen, die in eine Ruhepose zurückführt.
  - Du rechnest Phasenanteile aus Bilddauern aus und erklärst, warum Gewicht in den Haltezeiten vor und nach der Aktion steckt.
  - Du prüfst mit Absichtssatz und Beobachtungstest, ob ein Zuschauer die Kraft liest, statt sie zu behaupten.
