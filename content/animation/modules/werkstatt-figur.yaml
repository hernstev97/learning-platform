id: werkstatt-figur
title: "Werkstatt: eine eigene Figur, zwei Überarbeitungen"
level: 3
minutes: 180
summary: Du animierst eine selbst gewählte Bewegung einer eigenen Figur in 4 bis 12 Bildern, erst als Posentest, dann als Fassung 1, und überarbeitest sie zweimal nach Beobachtungstests, mit aufgehobenen Fassungen, einem Überarbeitungsprotokoll und der Übergabe an die Testszene.
place: pc
goals:
  - Du wählst Figur, Bewegung und Umfang selbst und hältst die Absicht in einem Absichtssatz fest, bevor du zeichnest.
  - Du timst zuerst nur die Keys als Posentest und ergänzt Breakdowns und Zwischenbilder erst, wenn die Keys tragen.
  - Du prüfst jede Fassung vom Großen zum Kleinen und holst vor jeder Überarbeitung einen Beobachtungstest ein.
  - Du dokumentierst zwei Überarbeitungen im Überarbeitungsprotokoll, mit Grund für jede Änderung und ohne eine Fassung zu überschreiben.
  - Du begründest, warum eine KI in dieser Werkstatt keine Bilder, Zwischenbilder oder Urteile liefert, und nennst, was sie übernehmen darf.
