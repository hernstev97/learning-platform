  - title: Thomas Vasseur · Art Design Deep Dive, Dead Cells
    url: https://www.gamedeveloper.com/production/art-design-deep-dive-using-a-3d-pipeline-for-2d-animation-in-i-dead-cells-i-
lesson: |
  Ab hier zeichnest du keine Bälle und Säcke mehr, sondern eine eigene Figur. Welche, entscheidest du, und welche Bewegung sie macht, auch. Der Kurs schlägt dir nichts vor: keine Figur, keine Bewegung, keinen Stil, auch nichts, was zu deinem Spiel passen könnte. Er gibt dir einen Ablauf, ein Protokoll und Fragen, mit denen du prüfst, ob die Bewegung zeigt, was du willst.

  Das Werkzeug dafür ist die Überarbeitung. Eine erste Fassung zeigt selten genau das, was du gemeint hast. Wie weit sie davon entfernt ist, erfährst du von Menschen, die sie ohne Erklärung sehen. In dieser Werkstatt überarbeitest du eine kleine Animation zweimal, Fassung 1 zu 2 zu 3, und hältst jeden Schritt so fest, dass du ihn später zeigen und begründen kannst.

  > [!NOTE] Zeit einplanen
  > Plan mindestens drei Sitzungen mit je einer Nacht dazwischen: Fassung 1, Überarbeitung 1, Überarbeitung 2. Die Beobachtungstests brauchen andere Menschen; verabrede sie früh. Die ersten acht Übungen gehen schnell, die letzten vier sind die Werkstatt.

  ## Figur, Bewegung und Ablauf

  ### Figur, Bewegung und Umfang wählen

  Nimm eine Figur, die du schon gezeichnet hast, etwa aus [Vom Entwurf zum Sprite](/pixelart/sprite-entwerfen). Dann übst du hier Bewegung und nicht nebenbei noch Figurendesign. Hast du ein Modellblatt, leg es neben die Zeitleiste; es hält Proportionen und Farben fest ([Ansichten, Maßstab und große Kreaturen](/pixelart/ansichten-massstab)).

  Für die Bewegung gibt der Kurs nur Grenzen für den Umfang vor, keine Inhalte:

  - **Eine Bewegung**, die du in einem Satz beschreiben kannst. Ob Zyklus oder einmalige Aktion, entscheidest du.
  - **4 bis 12 Bilder.** Weniger als vier tragen kaum Spacing, mehr als zwölf überarbeitest du nicht zweimal mit Sorgfalt.
  - **Eine Ansicht**, also eine Richtung. Weitere Richtungen kommen später ([Ansichten, Maßstab und große Kreaturen](/pixelart/ansichten-massstab)).

  Klein ist hier ein Vorteil. Du zeichnest drei Fassungen und holst zwei Beobachtungstests ein. Bei 40 Bildern würdest du nach der ersten Fassung nur noch flicken.

  ### Der Ablauf: vom Absichtssatz zur dritten Fassung

  1. **Absichtssatz:** was ein Zuschauer lesen soll.
  2. **Referenz:** dich selbst filmen oder eine gemeinfreie Aufnahme suchen, etwa eine Tafel von Eadweard Muybridge auf [Wikimedia Commons](https://commons.wikimedia.org/wiki/File:Man_in_pelvis_cloth_walking_%28rbm-QP301M8-1887-003%29.jpg), und Bild für Bild ansehen ([Bewegung beobachten und in Schlüsselposen zerlegen](/animation/beobachten-schluesselposen)).
  3. **Thumbnails und Keys** auf Papier.
  4. **Posentest:** nur die Keys im Editor, getimt.
  5. **Fassung 1:** Breakdowns und Zwischenbilder ergänzt.
  6. **Beobachtungstest 1**, dann **Überarbeitung 1** zu Fassung 2.
  7. **Beobachtungstest 2**, dann **Überarbeitung 2** zu Fassung 3.
  8. **Reflexion** und Übergabe an die Testszene.

  Jede Stufe liegt als eigene Datei vor. Exportierst du zu jeder Fassung ein GIF, hast du die Reihe auch auf dem Handy:

  ```text
  figur-v1-keys   Posentest, nur Keys
  figur-v1        Fassung 1
                  Beobachtungstest 1
  figur-v2        Fassung 2 (Überarbeitung 1)
                  Beobachtungstest 2
  figur-v3        Fassung 3 (Überarbeitung 2)
                  Reflexion, dann Testszene
  ```

  Statt neuer Dateien geht auch ein Commit je Fassung, mit dem Grund in der Commit-Nachricht ([git commit](https://git-scm.com/docs/git-commit)). In Krita legt *File › Incremental Backup* eine Kopie zum Weiterarbeiten an ([Workflow](https://docs.krita.org/en/user_manual/animation.html#workflow)). Wichtig ist nur, dass keine Fassung die vorige ersetzt.

  ## Posentest: erst die Keys, dann die Zwischenbilder

  Das Krita-Handbuch beschreibt den klassischen Ablauf in einem Satz: Man macht Keyframes, „which contain the important poses, and then draw frames in between“ ([Workflow](https://docs.krita.org/en/user_manual/animation.html#workflow)). Im **Posentest** spielst du nur diese Keys ab, jede mit ihrer geplanten Dauer. Liest man die Bewegung schon an ihnen? Stehen die Haltezeiten richtig? Änderungen kosten jetzt eine Zeichnung, später eine Zeichnung und alle Zwischenbilder um sie herum.

  Mariel Cartwright beschreibt für Skullgirls, dass zuerst die Keys kommen und die Zwischenbilder sich an ihnen orientieren; schon zwei Posen können eine schnelle Bewegung lesbar machen ([Making Fluid and Powerful Animations For 'Skullgirls'](https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=235s), ab 3:55). Später im Vortrag sagt sie sinngemäß, dass klare und gehaltene Keys wichtiger sind als besonders weiche Übergänge ([ab 19:04](https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=1144s)). Thomas Vasseur arbeitet bei Dead Cells genauso: „Once, and only once, the animation is convincing and correctly timed with the least amount of frames possible, I add interpolation frames before or after the key frames.“ ([Art Design Deep Dive](https://www.gamedeveloper.com/production/art-design-deep-dive-using-a-3d-pipeline-for-2d-animation-in-i-dead-cells-i-)).

  Danach kommen die **Breakdowns**, die Posen, die den Weg zwischen zwei Keys festlegen, und zuletzt die Zwischenbilder. Was Keys, Extreme und Breakdowns unterscheidet, steht in [Bewegung beobachten und in Schlüsselposen zerlegen](/animation/beobachten-schluesselposen). Den Posentest kannst du auch schon im Prüfstand abspielen ([In der Testszene prüfen](/animation/testszene)).

  > [!PRAXIS] Cuphead: Keys, Breakdowns, dann alles
  > Jake Clark von Studio MDHR beschreibt für Cuphead dieselbe Reihenfolge: erst die Keys, dann die Breakdowns, dann die vollständige Animation mit allen Zeichnungen auf Einsen ([Cuphead's Animation Process and Philosophy, GDC 2017](https://www.youtube.com/watch?v=RmGb-jU3uVQ&t=966s), ab 16:06). Die Reihenfolge schützt die aufwendigste Arbeit, die vielen Zwischenbilder, vor späten Änderungen an den Keys. Wer allein zeichnet, spart damit am meisten.

  ## Prüfreihenfolge: vom Großen zum Kleinen

  Bevor du eine Fassung zeigst und bevor du überarbeitest, gehst du sie mit dieser Liste durch, von oben nach unten:

  ```text
  1  Handlung    Liest man, was passiert? Keys, Silhouette
  2  Timing      Haltezeiten, Gesamtdauer, wo es stockt
  3  Spacing     Abstände, Ease, Bögen (Onion Skinning)
  4  Gewicht     Schwerpunkt, Bodenkontakt, Stauchung
  5  Überlappung Teile, die nachziehen oder vorauseilen
  6  Konstanz    Proportion, Volumen, Licht in jedem Bild
  7  Details     einzelne Pixel, Kanten, Zittern
  8  Lesbarkeit  bei 1× und vor dunklem und hellem Grund
  ```

  Die Punkte verweisen auf die Module des Kurses: Timing auf [Timing und Spacing](/animation/timing-spacing), Bögen und Überlappung auf [Bögen, Nachziehen und Überlappung](/animation/boegen-ueberlappung), Gewicht auf [Schwerpunkt, Gleichgewicht und Bodenkontakt](/animation/schwerpunkt-balance) und [Gewicht zeigen](/animation/gewicht-aufprall), Konstanz auf [Form und Proportionen halten](/animation/form-konstanz).

  Eine Überarbeitung arbeitet von oben nach unten. Wer bei Punkt 7 anfängt, poliert Pixel, die nach einer Timing-Änderung neu gezeichnet werden. Liest ein Zuschauer die Handlung nicht, ist kein Detail die Ursache. Das gilt auch, wenn das Detail dich am meisten stört.

  ## Beobachtungstest und Überarbeitungsprotokoll

  ### Der Beobachtungstest vor jeder Überarbeitung

  Vor jeder Überarbeitung holst du einen Beobachtungstest ein, so wie in [Körpersprache und Zustandswechsel](/animation/koerpersprache) beschrieben: ohne Vorrede, dreimal in Schleife, „Was passiert da?“, Antworten wörtlich, nichts erklären. In der Werkstatt kommen drei Punkte dazu.

  - **Wer sieht welche Fassung?** Ein neuer Zuschauer für Test 2 liest Fassung 2 unbefangen. Derselbe Zuschauer wie in Test 1 kann sagen, was sich geändert hat, hat aber Fassung 1 im Kopf. Beides ist nützlich. Notier, wen du gefragt hast.
  - **Abweichung ist Information.** Liest dein Zuschauer etwas anderes als dein Absichtssatz, ist das kein Urteil über dich, sondern der Ausgangspunkt der nächsten Überarbeitung.
  - **Die Absicht darf sich ändern, aber sichtbar.** Gefällt dir, was der Zuschauer gelesen hat, besser als dein Plan, darfst du den Absichtssatz ändern. Dann steht der alte im Protokoll daneben, mit Grund.

  Ist niemand da, siehst du die Fassung nach mindestens einer Nacht Abstand selbst an und markierst das. Ein einzelner Mensch ist kein Beleg; er zeigt dir, wo du genauer hinsiehst. Wie man Rückmeldungen sammelt, ohne sie zu lenken, steht in [Testlesen und Playtest](/narrative/testlesen-playtest).

  ### Das Überarbeitungsprotokoll

  Zu jeder Fassung ab Fassung 2 gehört ein Eintrag mit sieben Feldern: Fassung, Datum, Absichtssatz, Beobachtung, Änderung, Grund und Ergebnis. Dazu schreibst du den Dateinamen, damit klar ist, welche Datei der Eintrag beschreibt.

  ```text
  Fassung       2
  Datum         2026-11-03
  Datei         figur-v2 (figur-v1 bleibt)
  Absichtssatz  „…“ (unverändert / geändert, warum)
  Beobachtung   eigene: …
                Test 1 (wer, wann): „…“ (wörtlich)
  Änderung      Bild 3: Dauer 100 → 250 ms
                Bild 5: neu gezeichnet, …
  Grund         je Änderung: welche Beobachtung, welcher
                Teil des Absichtssatzes
  Ergebnis      eigener Blick nach der Änderung: …
                Test 2 (wer, wann): „…“
  ```

  Drei Regeln halten das Protokoll brauchbar. **Jede Änderung hat einen Grund**, und der Grund nennt eine Beobachtung oder einen Teil des Absichtssatzes, nicht „sah besser aus“. **Änderungen nennen Bilder und Zahlen**: welches Bild, welche Dauer vorher und nachher, was an der Zeichnung anders ist. **Das Ergebnis kommt aus einem neuen Blick**, nicht aus der Erwartung beim Ändern. Das Ergebnis von Test 2 trägst du nach, sobald du ihn gemacht hast; es ist zugleich die Beobachtung für Fassung 3.

  So entsteht aus drei Dateien und zwei Einträgen eine Geschichte, die du erzählen kannst: was du wolltest, was andere sahen, was du geändert hast und warum. Das gleiche Vorgehen für Texte zeigt [Überarbeiten mit eigenen Kriterien](/narrative/ueberarbeiten).

  > [!INTERVIEW]
  > „Zeig uns eine Animation und erzähl, wie sie entstanden ist.“ Gute Antwort: Ich zeige Fassung 1 und die letzte nebeneinander und sage, was ich zeigen wollte. Dann erzähle ich, was ein Zuschauer in Fassung 1 tatsächlich gesehen hat, welche Änderungen ich daraufhin gemacht habe, in welchen Bildern und warum, und was der zweite Test ergab. Ich nenne auch eine Änderung, die nichts gebracht hat, und eine Stelle, die ich bewusst gelassen habe.

  ## KI in der Werkstatt

  Figur, Posen, Keys, Breakdowns, Zwischenbilder und Timing stammen von dir. Keine generierten Bilder als Vorlage oder Referenz, keine erzeugten Zwischenbilder, kein Hochrechnen deiner Figur auf eine andere Auflösung. Eine KI darf hier nur technische Arbeit beschleunigen: ein Skript, das deine Fassungen als GIF exportiert und nebeneinanderlegt, Git-Befehle für Commits je Fassung, ein Export-Befehl für das Sheet.

  > [!WARNING] Auch Fragen sind Aufträge
  > „Was stimmt an meiner Animation nicht?“ oder „Wie wirkt sie schwerer?“ liefern von einer KI Vorschläge für Posen und Timing, also für die Arbeit, die du übst. Rückmeldung holst du dir von Menschen im Beobachtungstest. Ihre Antworten beschreiben, was sie sehen; was du daraus machst, entscheidest du.

  ## Übergabe an die Testszene

  Fassung 3 ist das Ende dieser Werkstatt, nicht das Ende der Animation. Im Editor siehst du sie isoliert und vergrößert. Wie sie im Spieltakt wirkt, in Originalgröße, mit Eingabe und Übergängen zu anderen Animationen, prüfst du in [In der Testszene prüfen](/animation/testszene). Was du dort findest, hältst du im Prüfprotokoll fest. Änderst du danach etwas, ist das eine Korrektur nach dem Prüfstand, keine dritte Überarbeitung.

  ## Häufige Fehler

  - **Zu groß angefangen.** Nach Fassung 1 fehlt die Kraft für zwei Überarbeitungen. Bleib bei 4 bis 12 Bildern.
  - **Zwischenbilder vor dem Posentest.** Jede Änderung an einem Key reißt die Bilder um ihn herum mit. Erst die Keys timen.
  - **Fassung überschrieben.** Ohne Fassung 1 kannst du nicht zeigen, was Überarbeitung 1 gebracht hat. Vor jeder Änderung unter neuem Namen speichern.
  - **Änderung ohne Grund.** „Sah besser aus“ ist kein Grund. Nenn die Beobachtung oder den Teil des Absichtssatzes.
  - **Pixel vor Timing.** Der Zuschauer liest die Handlung nicht, und du glättest Kanten. Arbeite die Prüfliste von oben ab.
  - **Absichtssatz still angepasst.** Er passt plötzlich genau zur Fassung, weil du ihn danach umgeschrieben hast. Den alten daneben stehen lassen.
  - **Test erklärt.** „Gleich siehst du, wie sie …“ vor dem Zeigen macht den Test wertlos. Erst zeigen, dann fragen.

  ## Zusammenfassung

  - Figur und Bewegung wählst du selbst: eine Bewegung, 4 bis 12 Bilder, eine Ansicht.
  - Absichtssatz, Referenz, Thumbnails und Keys kommen vor dem Editor.
  - Im Posentest spielst du nur die Keys mit ihrem Timing. Breakdowns und Zwischenbilder folgen, wenn die Keys tragen.
  - Jede Fassung ist eine eigene Datei oder ein eigener Commit: `-v1-keys`, `-v1`, `-v2`, `-v3`.
  - Vor jeder Überarbeitung ein Beobachtungstest; überarbeitet wird vom Großen zum Kleinen.
  - Das Protokoll hält Fassung, Datum, Absichtssatz, Beobachtung, Änderung, Grund und Ergebnis fest.
  - Bilder und Urteile kommen nicht von einer KI. Nach Fassung 3 geht die Animation in die Testszene.
exercises:
  - id: werkstatt-ablauf
    type: order
    title: Vom Satz zur dritten Fassung
    prompt: |
      Bring die Schritte der Werkstatt in die Reihenfolge, in der du sie machst.
    lang: prose
    lines: |
      Absichtssatz schreiben und eine Referenz suchen.
      Thumbnails auf Papier zeichnen und die Keys festlegen.
      Posentest: nur die Keys im Editor timen und abspielen.
      Breakdowns und Zwischenbilder ergänzen und als Fassung 1 speichern.
      Beobachtungstest 1, dann Überarbeitung 1 zu Fassung 2.
      Beobachtungstest 2, dann Überarbeitung 2 zu Fassung 3.
      Reflexion schreiben und Fassung 3 in der Testszene prüfen.
    explanation: |
      Der Absichtssatz kommt vor allem anderen, weil jede spätere Prüfung an ihm misst. Thumbnails und Keys auf Papier sind die billigste Stufe. Im Posentest prüfst du Keys und Timing, bevor Zwischenbilder jede Änderung teuer machen. Jede Überarbeitung beginnt mit einem Test, damit sie auf einer Beobachtung beruht. Die Testszene steht am Ende, weil sie fragt, ob die fertige Bewegung im Spieltakt besteht.
    resources:
      - title: Krita Manual · Animation, Workflow
        url: https://docs.krita.org/en/user_manual/animation.html#workflow

  - id: was-zuerst
    type: choice
    title: Was ändern, was lassen?
    prompt: |
      Ein neutrales Beispiel. Absichtssatz: „Die Figur hebt eine schwere Kiste vom Boden auf.“ Test 1 ergibt: „Sie bückt sich und steht wieder auf.“ Außerdem flackert in Bild 4 ein Pixel an der Hand. Was gehst du in Überarbeitung 1 zuerst an?
    options:
      - text: Keys und Timing des Moments, in dem die Kiste vom Boden kommt, damit man das Heben überhaupt liest.
        correct: true
        why: Der Zuschauer liest die Handlung nicht. Das ist Punkt 1 der Prüfliste; erst wenn das Heben ankommt, lohnen die kleineren Punkte.
      - text: Das flackernde Pixel in Bild 4 korrigieren.
        correct: false
        why: Ein Detail aus Punkt 7. Es stört, erklärt aber nicht, warum niemand das Heben sieht. Und ändert sich Bild 4 durch die Überarbeitung, zeichnest du es ohnehin neu.
      - text: Mehr Zwischenbilder einfügen, damit die Bewegung weicher läuft.
        correct: false
        why: Weichere Übergänge machen die Handlung nicht lesbarer. Wichtiger sind klare, gehaltene Keys.
      - text: Die Kiste dunkler färben, damit sie schwerer aussieht.
        correct: false
        why: Möglich, aber eine Änderung an der Farbe beantwortet nicht, warum das Heben fehlt. Außerdem wüsstest du nach einer Farbänderung nicht, ob Bewegung oder Farbe gewirkt hat.
    explanation: |
      Die Prüfreihenfolge geht vom Großen zum Kleinen, weil große Änderungen kleine mitreißen. Wer zuerst Pixel korrigiert, macht Arbeit, die die nächste Timing-Änderung zunichtemacht. Die Beobachtung „bückt sich und steht wieder auf“ sagt, dass ein Teil der Handlung fehlt; dort setzt die Überarbeitung an. Welche Pose oder Dauer du dafür änderst, entscheidest du.
    resources:
      - title: Mariel Cartwright · GDC 2014 (ab 19:04)
        url: https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=1144s

  - id: ki-auftrag
    type: choice
    title: Was die Maschine hier darf
    prompt: |
      Welcher Auftrag an eine KI passt zur Regel dieser Werkstatt?
    options:
      - text: Schreib ein Skript, das `figur-v1` bis `figur-v3` als GIF exportiert und nebeneinander auf eine HTML-Seite legt.
        correct: true
        why: Das ist technische Arbeit. Die Bilder darin stammen alle von dir; das Skript ordnet sie nur an.
      - text: Zeichne die Zwischenbilder zwischen meinen Keys.
        correct: false
        why: Zwischenbilder sind Teil der Animation. Sie zu zeichnen ist genau das, was du hier übst.
      - text: Sag mir, was an meiner Animation nicht stimmt.
        correct: false
        why: Die Antwort liefert Vorschläge für Posen und Timing. Rückmeldung holst du dir von Menschen im Beobachtungstest.
      - text: Erzeuge mir ein Referenzvideo der Bewegung.
        correct: false
        why: Auch eine generierte Referenz ist eine Vorlage, die dir Posen vorgibt. Referenz filmst du selbst oder nimmst gemeinfreie Aufnahmen.
    explanation: |
      Die Grenze verläuft zwischen Technik und Gestaltung. Ein Export-Skript hat eine richtige Lösung, die nicht von deiner Absicht abhängt. Posen, Zwischenbilder, Referenzen und Urteile hängen an ihr; wer sie abgibt, übt nicht mehr das Animieren, sondern das Auswählen.
    resources:
      - title: Krita Manual · Animation, Workflow
        url: https://docs.krita.org/en/user_manual/animation.html#workflow

  - id: dauer-fassung-2
    type: output
    title: Wie lang ist Fassung 2?
    prompt: |
      Fassung 1 hat die Bildliste unten. Überarbeitung 1 verlängert Bild 2 auf 200 ms und streicht Bild 4. Wie viele Millisekunden dauert Fassung 2? Antworte mit der Zahl.
    lang: text
    code: |
      Fassung 1
      Bild   1    2    3    4    5    6
      ms   150  100   50   50  200  100
    expected: |
      700
    accept:
      - 700 ms
    explanation: |
      Fassung 1 dauert 650 ms. Bild 2 wird 100 ms länger, Bild 4 fällt mit 50 ms weg: 650 + 100 − 50 = 700 ms. Fassung 2 hat dann fünf Bilder. Im Protokoll stehen beide Änderungen mit Bildnummer, vorher und nachher; die Nummern beziehen sich auf Fassung 1, deshalb schreibst du dazu, dass ab Bild 5 alles um eins nach vorn rückt.
    resources:
      - title: Aseprite Docs · Frame Duration
        url: https://www.aseprite.org/docs/frame-duration/

  - id: ticks-bis-pose
    type: output
    title: Wann sieht man die Pose?
    prompt: |
      In Fassung 2 ist Bild 3 die Pose, an der man erkennt, was die Figur tut. Nach wie vielen Ticks ab dem Start der Animation erscheint sie, bei 60 Ticks pro Sekunde? Antworte mit der Zahl.
    lang: text
    code: |
      Fassung 2
      Bild   1    2    3    4    5
      ms   150  200   50  200  100
    expected: |
      21
    accept:
      - 21 Ticks
    explanation: |
      Bild 3 beginnt nach 150 + 200 = 350 ms, und 350 ms sind 350 × 60 / 1000 = 21 Ticks. In der Testszene misst du diesen Wert nach, dort ab dem Tastendruck. Ob 21 Ticks für deine Bewegung passen, entscheidest du mit [Animation im Spiel](/animation/animation-im-spiel).
    resources:
      - title: Godot Docs · physics_ticks_per_second
        url: https://docs.godotengine.org/en/stable/classes/class_projectsettings.html#class-projectsettings-property-physics-common-physics-ticks-per-second

  - id: werkstatt-regeln
    type: gap
    title: Fünf Regeln der Werkstatt
    prompt: |
      Ergänze die fehlenden Wörter.
    lang: prose
    code: |
      Bevor du zeichnest, schreibst du einen ⟦Absichtssatz⟧.
      Im Posentest spielst du nur die ⟦Keys⟧ ab.
      Jede Fassung speicherst du als eigene Datei oder als eigenen ⟦Commit⟧.
      Jede Änderung im Protokoll hat einen ⟦Grund⟧.
      Überarbeitet wird vom Großen zum ⟦Kleinen⟧.
    gaps:
      - label: Vor dem Zeichnen
        hint: Ein Satz, was ein Zuschauer lesen soll.
      - label: Im Posentest
        hint: Die Schlüsselposen, englisch.
        accept: ["Schlüsselposen", "Key-Posen", "Keyframes"]
      - label: Fassung in Git
        hint: Ein Schnappschuss im Repository.
      - label: Zu jeder Änderung
        hint: Warum du sie gemacht hast.
        accept: ["Begründung"]
      - label: Reihenfolge
        hint: Gegenteil von groß.
    explanation: |
      Der Absichtssatz ist der Maßstab für jeden Test. Im Posentest prüfst du Keys und Timing, solange Änderungen billig sind. Eigene Dateien oder Commits halten jede Fassung zum Vergleich bereit. Ein Grund verbindet jede Änderung mit einer Beobachtung, und die Reihenfolge vom Großen zum Kleinen verhindert, dass du Details polierst, die die nächste große Änderung wieder umwirft.
    resources:
      - title: Jake Clark · Cuphead, GDC 2017 (ab 16:06)
        url: https://www.youtube.com/watch?v=RmGb-jU3uVQ&t=966s

  - id: protokoll-ohne-beleg
    type: bug
    title: Nichts mehr zu zeigen
    prompt: |
      Drei Wochen später willst du zeigen, was Überarbeitung 1 gebracht hat. Du kannst Fassung 1 nicht mehr abspielen, und eine der beiden Änderungen kannst du nicht erklären. Finde die zwei Zeilen im Protokoll, die das verursachen.
    lang: text
    code: |
      Fassung       2
      Datum         2026-11-03
      Datei         figur-v1, überschrieben
      Absichtssatz  „Sie hebt eine schwere Kiste auf.“
      Beobachtung   Test 1, Lea: „Sie bückt sich.“
      Änderung      Bild 3: 100 → 250 ms
      Grund         Lea las das Heben nicht; Bild 3 ist der Key.
      Änderung      Bild 5: Kopf 1 px tiefer
      Grund         –
      Ergebnis      eigener Blick: Heben in Bild 3 lesbar
    lines: [3, 9]
    explanation: |
      Zeile 3: Fassung 2 wurde unter dem Namen von Fassung 1 gespeichert, Fassung 1 ist weg. Richtig wäre `figur-v2`, und `figur-v1` bleibt liegen. Zeile 9: Die zweite Änderung hat keinen Grund. Ob sie aus einer Beobachtung kam oder aus einem Gefühl beim Zeichnen, weißt du nach drei Wochen nicht mehr. Die erste Änderung zeigt, wie es geht: Bild, Zahl vorher und nachher, und ein Grund, der die Beobachtung nennt.
    resources:
      - title: Krita Manual · Animation, Workflow (Incremental Backup)
        url: https://docs.krita.org/en/user_manual/animation.html#workflow

  - id: vasseur-erst-timing
    type: explain
    title: Erst überzeugend, dann weich
    prompt: |
      Thomas Vasseur beschreibt seine Arbeitsweise bei Dead Cells. Erkläre in wenigen Sätzen, was er erst tut und was danach, warum diese Reihenfolge Arbeit spart und was das für deinen Posentest heißt.
    lang: text
    code: |
      Once, and only once, the animation is convincing
      and correctly timed with the least amount of
      frames possible, I add interpolation frames
      before or after the key frames. Never in-between.
    points:
      - Erst muss die Animation mit möglichst wenigen Bildern überzeugen und richtig getimt sein.
      - Zwischenbilder kommen erst danach, und zwar vor oder nach den Keys, nicht genau zwischen sie.
      - Änderungen an Keys und Timing sind billig, solange es keine Zwischenbilder gibt, die mitgeändert werden müssten.
      - Für den Posentest heißt das, nur die Keys mit ihren Dauern abzuspielen und erst weiterzuzeichnen, wenn die Bewegung damit trägt.
    explanation: |
      Vasseur prüft erst, ob die Bewegung mit den wenigsten Bildern funktioniert. Das ist ein Posentest. Erst dann ergänzt er Bilder, und zwar vor oder nach den Keys, nicht in der Mitte zwischen ihnen. Man kann das so lesen, dass die Zusatzbilder sich an die Keys anlehnen und diese klar bleiben. Weil er später Timing-Änderungen bekommt, etwa um eine Waffe abzuschwächen, spart ihm die Reihenfolge Arbeit: Keys verschieben geht schnell, viele Zwischenbilder neu zeichnen nicht. Für deine Fassung 1 heißt das: erst `figur-v1-keys` zeigen und timen, dann ausbauen.
    resources:
      - title: Thomas Vasseur · Art Design Deep Dive, Dead Cells
        url: https://www.gamedeveloper.com/production/art-design-deep-dive-using-a-3d-pipeline-for-2d-animation-in-i-dead-cells-i-

  - id: wahl-und-plan
    type: practice
    title: Figur, Bewegung, Absicht
    prompt: |
      Wähle eine Figur, die du schon gezeichnet hast, und eine Bewegung für sie, 4 bis 12 Bilder, eine Ansicht. Der Kurs schlägt nichts vor. Schreib den Absichtssatz, bevor du etwas zeichnest. Such oder film eine Referenz und notier, welche Bilder darin die Keys sind. Zeichne Thumbnails auf Papier und leg die Keys mit geplanten Dauern fest.
    lang: prose
    starter: |
      Figur (Datei, Größe in px):
      Bewegung in einem Satz:
      Zyklus oder einmalige Aktion:
      Ansicht:
      Absichtssatz:
      Referenz (Quelle, was sie zeigt):
      Keys (Bild, Pose in Stichworten, geplante Dauer):
      Geplante Bildzahl insgesamt:
    checklist:
      - Figur und Bewegung hast du selbst gewählt; die Figur hast du schon vorher gezeichnet.
      - Die Bewegung passt in einen Satz, hat eine Ansicht und plant 4 bis 12 Bilder.
      - Der Absichtssatz beschreibt, was ein Zuschauer lesen soll, und steht vor den Thumbnails.
      - Die Referenz ist selbst gefilmt oder gemeinfrei und nicht generiert.
      - Jeder Key hat eine geplante Dauer in Millisekunden oder Ticks.
    explanation: |
      Die Grenzen beim Umfang sind der Grund, warum du zwei Überarbeitungen schaffst. Der Absichtssatz vor den Thumbnails verhindert, dass du ihn nachträglich an deine Zeichnung anpasst. Die Referenz zeigt dir, was in der Bewegung wirklich passiert, statt was du erinnerst ([Bewegung beobachten und in Schlüsselposen zerlegen](/animation/beobachten-schluesselposen)).
    resources:
      - title: Wikimedia Commons · Muybridge, Man in pelvis cloth walking (Plate 3)
        url: https://commons.wikimedia.org/wiki/File:Man_in_pelvis_cloth_walking_(rbm-QP301M8-1887-003).jpg

  - id: fassung-eins
    type: practice
    title: Posentest und Fassung 1
    prompt: |
      Leg die Keys im Editor an, gib ihnen ihre Dauern und speichere als `figur-v1-keys`. Spiel nur die Keys in Originalgröße ab und notier, was du siehst. Ergänze dann Breakdowns und Zwischenbilder und speichere als `figur-v1`. Geh die Prüfliste der Lektion von oben durch. Zeig Fassung 1 dann ohne Vorrede einem anderen Menschen, dreimal in Schleife, frag „Was passiert da?“ und schreib die Antwort wörtlich auf.
    lang: prose
    starter: |
      Posentest figur-v1-keys (Bild, Dauer, was ich sehe):

      Fassung 1 figur-v1, Bildliste (Bild, Dauer, Key/Breakdown/Zwischenbild):

      Prüfliste 1–8, eigene Notizen:

      Beobachtungstest 1 (wer, wann, wörtlich):
      Abweichung vom Absichtssatz:
    checklist:
      - "`figur-v1-keys` und `figur-v1` liegen als getrennte Dateien oder Commits vor."
      - Im Posentest hast du nur Keys abgespielt, mit ihren Dauern.
      - Die Bildliste von Fassung 1 kennzeichnet jedes Bild als Key, Breakdown oder Zwischenbild.
      - Die Antwort im Beobachtungstest steht wörtlich da, ohne deine Deutung, oder die Selbstprüfung nach einer Nacht ist markiert.
      - Die Abweichung vom Absichtssatz ist in einem Satz beschrieben, ohne schon eine Lösung zu nennen.
    explanation: |
      Der Posentest ist die billigste Stelle für große Änderungen. Was du dort siehst, notierst du, damit du später weißt, ob Fassung 1 die Keys gestärkt oder verwässert hat. Der Beobachtungstest liefert die Grundlage für Überarbeitung 1. Die Abweichung ohne Lösung zu beschreiben ist Absicht: Erst wenn du sie mit der Prüfliste ansiehst, entscheidest du, was du änderst.
    resources:
      - title: Mariel Cartwright · GDC 2014 (ab 3:55)
        url: https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=235s

  - id: ueberarbeitung-eins
    type: practice
    title: Überarbeitung 1 zu Fassung 2
    prompt: |
      Mindestens eine Nacht nach Test 1. Leg die Antwort aus Test 1 neben deinen Absichtssatz und geh die Prüfliste von oben durch. Entscheide, was du änderst, speichere Fassung 1 unverändert und arbeite in `figur-v2`. Füll das Überarbeitungsprotokoll aus. Zeig Fassung 2 dann in Beobachtungstest 2 und trag das Ergebnis nach.
    lang: prose
    starter: |
      Fassung: 2
      Datum:
      Datei: figur-v2 (figur-v1 bleibt)
      Absichtssatz (unverändert / geändert, warum):
      Beobachtung (eigene; Test 1, wer, wörtlich):
      Änderung 1 (Bild, vorher → nachher):
      Grund 1:
      Änderung 2 (Bild, vorher → nachher):
      Grund 2:
      Ergebnis (eigener Blick):
      Beobachtungstest 2 (wer, wann, wörtlich):
    checklist:
      - Zwischen Test 1 und dieser Überarbeitung lag mindestens eine Nacht.
      - Fassung 1 ist unverändert gespeichert, Fassung 2 als eigene Datei oder eigener Commit.
      - Jede Änderung nennt Bild und Zahlen vorher und nachher.
      - Jeder Grund nennt eine Beobachtung oder einen Teil des Absichtssatzes.
      - Die Änderungen setzen bei dem obersten Punkt der Prüfliste an, an dem Fassung 1 hakt.
      - Das Ergebnis von Test 2 steht wörtlich da, oder die Selbstprüfung ist markiert.
    explanation: |
      Die Nacht Abstand trennt Zeichnen und Prüfen. Die Prüfliste sorgt dafür, dass du beim größten Problem anfängst und nicht beim auffälligsten. Mit Bild, Zahlen und Grund kannst du jede Änderung später zeigen und zurücknehmen, falls sie nichts gebracht hat. Test 2 ist zugleich die Beobachtung, mit der Überarbeitung 2 beginnt.
    resources:
      - title: Krita Manual · Animation, Workflow
        url: https://docs.krita.org/en/user_manual/animation.html#workflow

  - id: ueberarbeitung-zwei
    type: practice
    title: Überarbeitung 2, Reflexion, Übergabe
    prompt: |
      Überarbeite Fassung 2 auf Grundlage von Test 2 zu `figur-v3`, mit Protokolleintrag wie in Überarbeitung 1. Schreib danach eine kurze Reflexion: Leg Fassung 1 und 3 nebeneinander, nenne zwei Änderungen mit Bild, vorher, nachher und Grund, eine Änderung, die nichts gebracht hat oder die du zurückgenommen hast, und eine Stelle, die du bewusst gelassen hast. Notier zum Schluss, was du in [der Testszene](/animation/testszene) prüfen willst.
    lang: prose
    starter: |
      Fassung: 3
      Datum:
      Datei: figur-v3 (figur-v2 bleibt)
      Absichtssatz:
      Beobachtung (eigene; Test 2, wer, wörtlich):
      Änderung (Bild, vorher → nachher):
      Grund:
      Ergebnis (eigener Blick):

      Reflexion
      Änderung A (Bild, vorher, nachher, Grund):
      Änderung B (Bild, vorher, nachher, Grund):
      Ohne Wirkung oder zurückgenommen:
      Bewusst gelassen, warum:

      Für die Testszene:
    checklist:
      - Fassung 1, 2 und 3 liegen getrennt vor; keine wurde überschrieben.
      - Der Protokolleintrag für Fassung 3 hat alle sieben Felder.
      - Die Reflexion nennt zwei Änderungen mit Bild, vorher, nachher und Grund.
      - Die Reflexion nennt eine Änderung ohne Wirkung oder eine zurückgenommene und eine bewusst gelassene Stelle.
      - Für die Testszene steht mindestens eine Frage, die sich dort messen oder beobachten lässt.
      - Alle Bilder in allen Fassungen hast du selbst gezeichnet und getimt.
    explanation: |
      Zwei dokumentierte Überarbeitungen zeigen, dass du nicht nach Gefühl änderst, sondern nach Beobachtung. Die Änderung ohne Wirkung ist kein Makel; sie zeigt, dass du geprüft statt angenommen hast. Die bewusst gelassene Stelle schützt vor dem Reflex, alles zu glätten. Die Fragen für die Testszene sind der Übergang vom Editor ins Spiel, wo Timing, Übergänge und Lesbarkeit in Originalgröße neu zur Probe stehen.
    resources:
      - title: Jake Clark · Cuphead, GDC 2017 (ab 16:06)
        url: https://www.youtube.com/watch?v=RmGb-jU3uVQ&t=966s
