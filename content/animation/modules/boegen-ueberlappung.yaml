id: boegen-ueberlappung
title: Bögen, Nachziehen und Überlappung
level: 2
minutes: 120
summary: Warum Hände, Köpfe und Füße auf Bögen laufen und wie du einen Bogen prüfst, warum lose Teile nach dem Körper zur Ruhe kommen und wie du dieses Nachziehen in wenigen Pixeln planst, ohne dass es flattert.
place: unterwegs
goals:
  - Du erklärst, warum das Ende eines drehenden Gelenks auf einem Bogen läuft, und erkennst Zwischenbilder, die den Bogen abkürzen.
  - Du prüfst einen Bewegungsbogen auf Papier oder mit Onion Skinning und findest in einer Koordinatenliste das Bild, das herausfällt.
  - Du unterscheidest Follow-through, Overlapping Action, Drag und Secondary Action an Beispielen.
  - Du planst eine Gliederkette mit einem Bild Versatz je Glied und ein Nachschwingen mit abnehmendem Ausschlag.
  - Du setzt Überlappung in Pixelart sparsam ein und erkennst, wann ein Teil flattert statt nachzuschwingen.
