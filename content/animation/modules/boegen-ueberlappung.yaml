lesson: |
  Deine Gliederpuppe winkt. Zwei Keys, Arm unten und Arm oben, dazwischen drei Zwischenbilder, genau in die Mitte gesetzt. Beim Abspielen zuckt die Hand in der Mitte der Bewegung zur Schulter hin, als würde der Arm kurz schrumpfen. Danach bleibt die Puppe stehen, und der Schal um ihren Hals bleibt im selben Bild stehen wie der Körper. Alles hält gleichzeitig an, wie aus einem Stück Holz.

  Beide Fehler haben mit Gelenken zu tun. Gelenke drehen, deshalb laufen die Enden von Armen und Beinen auf Bögen. Und lose Teile hängen am Körper und bewegen sich erst, wenn er sie zieht. Diese Lektion zeigt, wie du Bögen planst und prüfst, wie du Teile gegeneinander versetzt und wie viel davon in wenige Pixel passt.

  ## Bögen: Gelenke drehen, deshalb laufen Enden im Kreis

  Thomas und Johnston zählen den Bogen (Arc) zu den zwölf Grundprinzipien. Der Wikipedia-Artikel dazu beginnt mit „Most natural action tends to follow an arched trajectory“. Ein Glied, das um ein Gelenk dreht, beschreibt einen Bogen, ein geworfener Gegenstand eine Parabel. Die Ausnahme sind Maschinen, die sich oft auf geraden Linien bewegen ([Twelve basic principles: Arc](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Arc)).

  Der Grund ist Geometrie. Nimm einen gestreckten Arm mit fester Länge. Dreht er in der Schulter, bleibt die Hand immer gleich weit von der Schulter entfernt und läuft deshalb auf einem Kreis um sie. Setzt du die Zwischenbilder auf die gerade Linie zwischen zwei Keys, kürzt du den Kreis ab. Die Hand kommt der Schulter näher, und der Arm wird in diesen Bildern kürzer. Das Modell rechnet es für einen Arm von 10 Pixeln, der in der Schulter um 90 Grad dreht, in fünf Bildern:

  ```python run
  from math import cos, sin
  from math import hypot
  from math import radians

  r = 10  # Armlänge, px
  for i in range(5):
      w = radians(i * 22.5)
      x = r * cos(w)
      y = r * sin(w)
      b = round(hypot(x, y))
      g = i * 2.5
      s = hypot(r - g, g)
      s = round(s, 1)
      print(i + 1, b, s)
  ```

  Die zweite Spalte ist der Abstand der Hand zur Schulter auf dem Bogen: immer 10. Die dritte Spalte gilt für die Gerade: In der Mitte ist der Arm nur noch 7,1 Pixel lang, fast ein Drittel kürzer. Als Raster, `O` ist die Schulter, `#` die Hand auf dem Bogen, `+` die Hand auf der Geraden:

  ```text
  # . . . . . . . . . .
  . . . . # . . . . . .
  . . + . . . . . . . .
  . . . . . . . # . . .
  . . . . . . . . . . .
  . . . . . + . . . . .
  . . . . . . . . . # .
  . . . . . . . . . . .
  . . . . . . . . + . .
  . . . . . . . . . . .
  O . . . . . . . . . #
  ```

  > [!MERKE]
  > Ein Glied mit fester Länge dreht um sein Gelenk. Sein Ende läuft deshalb auf einem Bogen. Zwischenbilder auf der Geraden zwischen zwei Keys machen das Glied kürzer.

  Ein Bogen ist nicht immer ein Kreis um ein Gelenk. Der Kopf beim Gehen, der Hammerkopf beim Schlag, ein geworfener Ball: Alle laufen auf Kurven, weil mehrere Gelenke oder die Schwerkraft zusammenwirken. Je schneller eine Bewegung ist, desto flacher wird der Bogen nach vorn und desto weiter in Kurven, schreibt der Wikipedia-Artikel. Den Weg dazwischen bestimmt der Breakdown, wie in [Bewegung beobachten und in Schlüsselposen zerlegen](/animation/beobachten-schluesselposen) beschrieben.

  ## Bögen prüfen: einen Punkt durch alle Bilder verfolgen

  Klassische Animatoren zeichnen den Bogen leicht auf das Papier vor und radieren ihn später weg. Eine Bewegung, die ohne Grund aus ihrem Bogen fällt, wirkt sprunghaft statt fließend; als Beispiel nennt der Artikel einen zeigenden Finger, dessen Spitze in allen Zwischenbildern einem Bogen folgen soll ([Arc](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Arc)).

  Prüfen kannst du das unterwegs mit Haftzetteln. Leg sie übereinander gegen ein Fenster, wähle einen Punkt, etwa die Nasenspitze oder die Hand, und markiere ihn in jedem Bild auf einem obersten, leeren Zettel. Verbinde die Punkte. Eine glatte Kurve ist gut. Ein Knick, eine Zacke oder ein Punkt, der nach innen springt, zeigt das Bild, das du dir ansehen musst. Dieselbe Punktreihe zeigt dir auch das Spacing: Wo die Punkte eng liegen, ist die Bewegung langsam ([Timing und Spacing](/animation/timing-spacing)).

  Am Rechner übernimmt das **Onion Skinning**: Der Editor blendet die Bilder davor und danach durchscheinend ein. In Aseprite schaltest du es mit F3 um ([Onion Skinning](https://www.aseprite.org/docs/onion-skinning/)), in LibreSprite ebenfalls mit F3 ([Know your workspace](https://github.com/LibreSprite/libresprite.github.io/wiki/Know-your-workspace#animation)). Pixelorama hat es in der Zeitleiste ([Timeline: Onion Skinning](https://www.pixelorama.org/user_manual/user_interface/timeline#onion-skinning)), Krita im Onion-Skin-Docker ([Onion Skin Docker](https://docs.krita.org/en/reference_manual/dockers/onion_skin.html#onion-skin-docker)). Die Bedienung steht in [Einzelbilder im Editor](/animation/editor-zeitleiste).

  > [!TIP] Der Bildschirm als Leuchttisch
  > Hast du die Bewegung als Video, halte es an, leg ein Stück Backpapier auf den Bildschirm und setz für jedes Bild einen Punkt an die Hand. Nach zehn Bildern siehst du den Bogen, den deine Hand wirklich gemacht hat.

  ## Follow-through, Overlapping Action und Drag

  Der Wikipedia-Artikel fasst unter *Follow through and overlapping action* drei verwandte Techniken zusammen, die den Eindruck erzeugen, dass eine Figur der Trägheit folgt ([Follow through and overlapping action](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Follow_through_and_overlapping_action)):

  - **Follow-through:** Lose Teile bewegen sich weiter, nachdem die Figur angehalten hat, und werden dann zurückgezogen oder schwingen aus.
  - **Overlapping Action:** Teile des Körpers bewegen sich mit verschiedenem Timing, etwa der Arm anders als der Kopf.
  - **Drag:** Die Figur setzt sich in Bewegung, und Teile brauchen ein paar Bilder, um aufzuholen.

  Der Rumpf ist dabei der Kern. Arme, Beine, Kopf und Haare folgen seiner Bewegung, Kleidung und Gegenstände folgen den Gliedern. Daraus entsteht eine Kette: Hüfte, Schulter, Ellbogen, Hand, und am Ende ein Band oder Schal. Jedes Glied folgt dem vorigen mit einem kleinen Versatz. Richard Williams nennt das „successive breaking of joints“, das Abknicken der Gelenke nacheinander, und nutzt es, um Figuren biegsam wirken zu lassen ([AWN](https://www.awn.com/news/animators-survival-kit-now-available-mini-guides)).

  Eine Pendelkette aus drei Gliedern zeigt das in Zahlen. Glied 1 hängt oben, Glied 3 ist die Spitze. Die Werte sind Winkel in Grad. Jedes Glied übernimmt den Winkel des Glieds darüber aus dem Bild davor:

  ```text
  Bild  G1  G2  G3
   1     0   0   0
   2    20   0   0
   3    40  20   0
   4    45  40  20
   5    40  45  40
   6    40  40  45
   7    40  40  40
  ```

  Glied 1 schwingt über sein Ziel hinaus (45) und zurück (40). Glied 2 macht dasselbe ein Bild später, die Spitze zwei Bilder später. Das ganze Pendel steht erst in Bild 7 still. Im Spiel ist ein Versatz von einem Bild je Glied ein guter Startwert, weil wenige Bilder wenig Spielraum lassen.

  Kommt etwas zur Ruhe, schwingt es nicht ewig nach. Der Artikel spricht von Schwingungen mit verschiedener Dämpfung. Für die Zeichnung heißt das: Jeder Ausschlag ist kleiner als der vorige, bis er unter ein Pixel fällt. Ein Schalende, das zuerst 8 Pixel nach rechts schwingt und danach jeweils halb so weit zur anderen Seite:

  ```text
  Bild  links | rechts
   1          |########  8
   2      ####|          4
   3          |##        2
   4         #|          1
   5          |          0
  ```

  Nachbewegung gibt es auch am Ende einer ganzen Aktion: Der Körper schießt über die Zielpose hinaus und pendelt zurück. Das gehört zu [Antizipation, Aktion, Erholung](/animation/antizipation-erholung). Hier geht es um Teile, die gegeneinander versetzt sind.

  ## Secondary Action: eine zweite Handlung

  **Secondary Action** ist eine zusätzliche Handlung, die die Hauptbewegung stützt. Eine Figur geht und schwingt dabei die Arme, hat die Hände in den Taschen, spricht oder pfeift. Wichtig ist, dass sie die Hauptbewegung betont und nicht von ihr ablenkt; sonst lässt man sie weg ([Secondary action](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Secondary_action)).

  Der Unterschied zur Überlappung: Ein Schal, der nachschwingt, tut nichts von selbst, die Bewegung des Körpers treibt ihn. Eine Gliederpuppe, die im Gehen auf ihre Uhr schaut, tut etwas Eigenes. Die erste Frage lautet also: Wird das Teil bewegt, oder handelt die Figur?

  > [!NOTE] Ein Wort, zwei Bedeutungen
  > In Tutorials für Spiele heißt nachziehendes Haar oft „secondary animation“. Pedro Medeiros (Saint11) schreibt etwa, er füge bei sechs Bildern „secondary animations, like the hair lagging behind the head“ hinzu ([Character Idle](https://saint11.art/blog/pixel-art-tutorials/#characterIdle)). Bei Thomas und Johnston wäre das Overlapping Action. Lass dich vom Wort nicht verwirren, frag nach der Ursache der Bewegung.

  ## Überlappung in wenigen Pixeln

  In einem Sprite mit vier oder sechs Bildern ist ein Bild Versatz der kleinste mögliche Schritt, und er reicht oft. Medeiros nennt in seinem Tutorial zu Ruheposen zwei Tricks. Bei drei Bildern macht das mittlere den Übergang des Kopfes weicher, „by delaying the face movement“. Und: „move the contents of the face/body/etc after the silhouette has moved“, also erst den Umriss bewegen, das Innere ein Bild später ([Character Idle](https://saint11.art/blog/pixel-art-tutorials/#characterIdle)).

  Ein hängendes Seil, oben angefasst und in zwei Bildern um je einen Pixel nach rechts gezogen. Jede Reihe folgt der Reihe darüber ein Bild später. Weil sich benachbarte Reihen nie um mehr als einen Pixel unterscheiden, bleibt das Seil eine zusammenhängende Linie:

  ```text
  Bild 1   Bild 2   Bild 3   Bild 4
  ...#...  ....#..  .....#.  .....#.
  ...#...  ...#...  ....#..  .....#.
  ...#...  ...#...  ...#...  ....#..
  ...#...  ...#...  ...#...  ...#...
  ```

  Für Stoff im Wind beschreibt Medeiros eine Welle: „Fabric in the wind moves in a sine wave-like pattern“, und er stellt sich die Bewegung als Versatz in Windrichtung vor ([Fabric/Flags](https://saint11.art/blog/pixel-art-tutorials/#Fabric)). Das ist dieselbe Kette, nur dass die Welle immer weiterläuft.

  > [!PRAXIS] Skullgirls: Nachziehen statt Ausholen
  > Mariel Cartwright beschreibt in ihrem GDC-Vortrag, dass Bewegungen der Spielfigur fast sofort reagieren müssen ([ab 3:13](https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=193s)). Für Antizipation bleibt dann kaum Zeit. Die Information, die das Ausholen geliefert hätte, tragen bei *Skullgirls* deshalb Haare und Kleidung, die nachziehen ([Making Fluid and Powerful Animations For Skullgirls](https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=278s), ab 4:38). Das Nachziehen kostet keine Reaktionszeit, weil es nach der Bewegung kommt.

  Wenige Pixel haben eine Kehrseite. Springt ein Haarbüschel jedes Bild um ein Pixel hin und her, sieht das Auge kein Schwingen, sondern ein Flackern. Medeiros' Regel für Animationen: „Keep track of clusters“ und „I avoid breaking clusters“ ([Pixel Art Fundamentals](https://saint11.art/blog/pixel-art-tutorials/#Fundamentals)). Ein Teil, das nachschwingt, bleibt eine zusammenhängende Pixelgruppe und bewegt sich als Ganzes. Und es braucht einen abnehmenden Ausschlag, damit es zur Ruhe kommt. Tyriq Plummer rät, Details wegzulassen, die eigene Nachbewegung bräuchten ([Pixel Art and Animation in the Hi-Bit Age](https://www.youtube.com/watch?v=ZR_JBgNEeVM&t=1393s), ab 23:13). Jedes lose Teil ist Arbeit in jedem Bild.

  > [!INTERVIEW]
  > „Was ist der Unterschied zwischen Overlapping Action und Secondary Action?“ Gute Antwort: Overlapping Action heißt, dass Teile einer Figur mit versetztem Timing laufen, weil die Hauptbewegung sie mitzieht: Haare, Kleidung, die Hand nach dem Ellbogen. Secondary Action ist eine eigene, zusätzliche Handlung, etwa im Gehen auf die Uhr schauen. Sie soll die Hauptbewegung stützen, nicht von ihr ablenken. In Pixelart reicht für Überlappung oft ein Bild Versatz; ich achte darauf, dass der Ausschlag abnimmt, damit nichts flackert.

  ## Häufige Fehler

  - **Zwischenbilder auf der Geraden.** Die Hand zuckt zur Schulter, der Arm wird kurz kürzer. Verfolge einen Punkt durch alle Bilder und leg die Zwischenbilder auf den Bogen.
  - **Alles hält gleichzeitig an.** Körper, Kopf und Schal stoppen im selben Bild. Lass jedes lose Teil ein Bild später ankommen als das, an dem es hängt.
  - **Die Spitze führt.** Bewegt sich das Ende einer Kette vor ihrem Ansatz, sieht es aus, als zöge jemand daran. Die Bewegung läuft vom Rumpf nach außen.
  - **Nachschwingen ohne Ende.** Gleich große Ausschläge kommen nie zur Ruhe. Jeder Ausschlag ist kleiner als der vorige.
  - **Flattern statt Schwingen.** Ein Pixel hin, ein Pixel her, jedes Bild. Bewege Pixelgruppen als Ganzes und gib dem Ausschlag eine Richtung, die abnimmt.
  - **Secondary Action, die ablenkt.** Eine zweite Handlung, die mehr Aufmerksamkeit bekommt als die erste, gehört an den Anfang oder ans Ende oder weg.

  ## Zusammenfassung

  - Gelenke drehen, deshalb laufen Hände, Füße und Köpfe auf Bögen. Zwischenbilder auf der Geraden machen Glieder kürzer.
  - Bögen prüfst du, indem du einen Punkt durch alle Bilder verfolgst: auf Haftzetteln, auf Backpapier über einem Video oder mit Onion Skinning.
  - Follow-through: Lose Teile bewegen sich weiter, wenn die Figur hält. Overlapping Action: Teile haben verschiedenes Timing. Drag: Teile holen beim Losgehen auf.
  - Eine Kette folgt vom Rumpf nach außen, je Glied ein Bild Versatz, mit abnehmendem Nachschwingen.
  - Secondary Action ist eine eigene Handlung, die die Hauptbewegung stützt; Overlapping Action wird von ihr getrieben.
  - In Pixelart reicht oft ein Bild Versatz. Pixelgruppen bleiben zusammen, sonst flackert das Teil.
exercises:
  - id: was-laeuft-auf-boegen
    type: choice
    title: Bogen oder Gerade?
    prompt: |
      Welche dieser Bewegungen laufen auf einem Bogen?
    options:
      - text: Die Hand einer Gliederpuppe, die winkt.
        correct: true
        why: Der Unterarm dreht im Ellbogen, der Oberarm in der Schulter. Die Hand läuft deshalb auf einem Bogen.
      - text: Die Fußspitze beim Schritt nach vorn.
        correct: true
        why: Das Bein schwingt in der Hüfte und im Knie. Die Fußspitze beschreibt dabei eine Kurve, keine gerade Linie.
      - text: Ein Ball, der schräg nach oben geworfen wird.
        correct: true
        why: Ein geworfener Gegenstand fliegt auf einer Parabel. Auch das ist ein Bogen, nur ohne Gelenk.
      - text: Der Kolben in einem Zylinder.
        correct: false
        why: Mechanische Bewegungen laufen oft auf Geraden. Thomas und Johnston nennen sie ausdrücklich als Ausnahme.
      - text: Ein Ball, der aus dem Stand senkrecht losgelassen wird.
        correct: false
        why: Ohne seitlichen Anstoß fällt er auf einer senkrechten Linie. Sein Spacing ändert sich, die Bahn bleibt gerade.
    explanation: |
      Alles, was um ein Gelenk dreht, läuft auf einem Bogen, und Würfe folgen einer Parabel. Gerade Bahnen gibt es bei Maschinen und bei einem Fall ohne seitliche Bewegung. Wer eine Bahn plant, fragt deshalb zuerst: Was dreht hier, und um welchen Punkt?
    resources:
      - title: Wikipedia · Twelve basic principles, Arc
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Arc

  - id: secondary-oder-overlap
    type: choice
    title: Bewegt oder gehandelt?
    prompt: |
      Eine Gliederpuppe geht von links nach rechts. Welche dieser Zusätze sind Secondary Action und keine Overlapping Action?
    options:
      - text: Sie schaut im Gehen auf ihre Armbanduhr.
        correct: true
        why: Das ist eine eigene Handlung der Figur, die neben dem Gehen passiert.
      - text: Sie pfeift beim Gehen.
        correct: true
        why: Pfeifen ist eine zusätzliche Handlung. Der Wikipedia-Artikel nennt genau dieses Beispiel.
      - text: Ihr Schal schwingt nach, als sie stehen bleibt.
        correct: false
        why: Der Schal handelt nicht, der Körper zieht ihn. Das ist Follow-through, ein Teil der Overlapping Action.
      - text: Ihre Hand kommt ein Bild nach dem Ellbogen zur Ruhe.
        correct: false
        why: Das ist Versatz entlang einer Gelenkkette, also Overlapping Action.
    explanation: |
      Die Frage ist immer, was die Bewegung verursacht. Wird ein Teil von der Hauptbewegung mitgezogen, ist es Overlapping Action oder Follow-through. Tut die Figur etwas Eigenes, ist es Secondary Action. In Spiel-Tutorials heißt nachziehendes Haar trotzdem oft „secondary animation“; die Ursache entscheidet, nicht das Wort.
    resources:
      - title: Wikipedia · Twelve basic principles, Secondary action
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Secondary_action

  - id: kette-kommt-zur-ruhe
    type: order
    title: Wer hält zuerst an?
    prompt: |
      Eine Gliederpuppe schwingt den Arm nach vorn und hält ein Band in der Hand. Bring die Teile in die Reihenfolge, in der sie zur Ruhe kommen, das erste zuerst.
    lang: prose
    lines: |
      Der Oberkörper bleibt stehen.
      Der Oberarm kommt in der Schulter zur Ruhe.
      Der Unterarm kommt im Ellbogen zur Ruhe.
      Die Hand kommt im Handgelenk zur Ruhe.
      Das Band schwingt aus und hängt still.
    explanation: |
      Die Bewegung läuft vom Rumpf nach außen. Jedes Glied hängt am vorigen und kann erst stillstehen, wenn das vorige steht. Das Band am Ende hat keine eigene Kraft und schwingt am längsten. Dreht man die Reihenfolge um, geht die Bewegung von der Hand aus: Dann zieht etwas an der Hand, nicht der Körper am Arm.
    resources:
      - title: Wikipedia · Follow through and overlapping action
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Follow_through_and_overlapping_action

  - id: spitze-kommt-an
    type: output
    title: Wann steht die Spitze?
    prompt: |
      Eine Pendelkette hat drei Glieder. Jedes Glied übernimmt den Winkel des Glieds darüber aus dem Bild davor. In Bild 1 stehen alle auf 0 Grad. In welchem Bild erreicht Glied 3, die Spitze, ihre Endstellung von 40 Grad? Antworte mit der Bildnummer.
    lang: text
    code: |
      Bild    1   2   3   4   5   6
      Glied1  0  20  40  40  40  40
    expected: |
      5
    accept:
      - Bild 5
      - "5."
    hints:
      - Schreib zuerst die Zeile für Glied 2, dann die für Glied 3.
    explanation: |
      Glied 2 läuft Glied 1 ein Bild hinterher: 0, 0, 20, 40, 40, 40. Glied 3 läuft Glied 2 ein Bild hinterher: 0, 0, 0, 20, 40, 40. Die Spitze erreicht 40 Grad also in Bild 5, zwei Bilder nach dem Ansatz. Bei drei Gliedern und einem Bild Versatz braucht die Kette zwei Bilder länger als ihr oberstes Glied.
    resources:
      - title: Saint11 · Fabric/Flags
        url: https://saint11.art/blog/pixel-art-tutorials/#Fabric

  - id: ausschlag-halbiert
    type: output
    title: Ausschwingen in ganzen Pixeln
    prompt: |
      Das Modell lässt ein Schalende nachschwingen. Jeder Ausschlag geht halb so weit zur anderen Seite, Bruchteile fallen weg. Was gibt das Programm aus?
    lang: python
    code: |
      a = 8  # Ausschlag in px
      bild = 1
      while a != 0:
          print(bild, a)
          a = int(-a / 2)
          bild += 1
      print(bild, a)
    expected: |
      1 8
      2 -4
      3 2
      4 -1
      5 0
    explanation: |
      Das Minuszeichen wechselt die Seite, die Division halbiert den Ausschlag: 8, −4, 2, −1. Danach ergibt −(−1) / 2 = 0,5, und `int` schneidet auf 0 ab. In ganzen Pixeln ist das Schalende nach vier Ausschlägen in Ruhe. Mit einem Faktor nahe 1 statt 0,5 würde es viel länger schwingen; der Faktor ist deine Entscheidung, wie weich das Material ist.
    resources:
      - title: Wikipedia · Follow through and overlapping action
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Follow_through_and_overlapping_action

  - id: kette-ausfuellen
    type: gap
    title: Die Welle läuft weiter
    prompt: |
      Glied 1 schwingt über sein Ziel hinaus und zurück. Jedes Glied übernimmt den Winkel des Glieds darüber aus dem Bild davor. Ergänze die fehlenden Winkel.
    lang: text
    code: |
      Bild  G1  G2  G3
       1     0   0   0
       2    20   0   0
       3    40  20   0
       4    45  40  20
       5    40  ⟦45⟧  ⟦40⟧
       6    40  40  ⟦45⟧
       7    40  40  ⟦40⟧
    gaps:
      - label: G2 in Bild 5
        hint: G1 in Bild 4.
      - label: G3 in Bild 5
        hint: G2 in Bild 4.
      - label: G3 in Bild 6
        hint: G2 in Bild 5.
      - label: G3 in Bild 7
        hint: G2 in Bild 6.
    explanation: |
      Das Überschwingen von Glied 1 auf 45 Grad wandert als Welle die Kette hinunter: Glied 2 schwingt in Bild 5 über, die Spitze in Bild 6. Erst in Bild 7 steht alles auf 40. So entsteht der Eindruck, dass die Kette Masse hat und am oberen Glied hängt. Saint11 beschreibt Stoff im Wind mit demselben Bild: eine Welle, die in Windrichtung versetzt weiterläuft.
    resources:
      - title: Saint11 · Fabric/Flags
        url: https://saint11.art/blog/pixel-art-tutorials/#Fabric

  - id: begriffe-ueberlappung
    type: gap
    title: Fünf Wörter für Bewegung in Teilen
    prompt: |
      Ergänze die fehlenden Begriffe.
    lang: prose
    code: |
      Das Ende eines Glieds, das um ein Gelenk dreht, läuft auf einem ⟦Bogen⟧.
      Lose Teile, die sich weiterbewegen, nachdem die Figur angehalten hat, zeigen ⟦Follow-through⟧.
      Teile, die sich mit versetztem Timing bewegen, zeigen ⟦Overlapping Action⟧.
      Wenn Teile beim Losgehen ein paar Bilder brauchen, um aufzuholen, heißt das ⟦Drag⟧.
      Eine eigene, zusätzliche Handlung neben der Hauptbewegung heißt ⟦Secondary Action⟧.
    gaps:
      - label: Bahn
        hint: Englisch Arc.
        accept: ["Kreisbogen", "Arc"]
      - label: Weiterlaufen
        hint: Englisch, „durchziehen“.
        accept: ["Follow through", "Nachschwingen"]
      - label: Versetztes Timing
        hint: Englisch, „überlappende Handlung“.
        accept: ["Overlap", "Überlappung"]
      - label: Aufholen
        hint: Englisch, „Nachschleifen“.
        accept: ["Nachziehen"]
      - label: Zusatzhandlung
        hint: Englisch, „zweite Handlung“.
        accept: ["Sekundäre Handlung", "Secondary"]
    explanation: |
      Follow-through, Overlapping Action und Drag fasst *The Illusion of Life* als ein Prinzip zusammen: Teile einer Figur folgen der Trägheit. Follow-through betrifft das Anhalten, Drag das Losgehen, Overlapping Action das versetzte Timing dazwischen. Secondary Action ist etwas anderes, eine Handlung der Figur selbst.
    resources:
      - title: Wikipedia · Follow through and overlapping action
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Follow_through_and_overlapping_action

  - id: hand-zuckt
    type: bug
    title: Der Arm wird kurz kürzer
    prompt: |
      Eine Hand dreht um die Schulter bei (0, 0), der Arm ist 10 Pixel lang. Beim Abspielen zuckt die Hand in der Mitte der Bewegung zur Schulter hin. Finde das Bild und korrigiere es so, dass es auf dem Bogen liegt.
    lang: text
    code: |
      Bild   x   y
       1    10   0
       2     9   4
       3     5   5
       4     4   9
       5     0  10
    lines: [4]
    fix:
      - line: 4
        answers:
          - " 3     7   7"
    hints:
      - Rechne für jedes Bild aus, wie weit die Hand von der Schulter entfernt ist.
      - Bild 3 liegt genau in der Mitte zwischen 0 und 90 Grad, also bei 45 Grad.
    explanation: |
      Bild 3 liegt auf der Geraden zwischen Bild 1 und Bild 5. Sein Abstand zur Schulter ist nur √50 ≈ 7,1 Pixel, alle anderen liegen bei etwa 10. Auf dem Bogen bei 45 Grad liegt die Hand bei 10 · cos 45° ≈ 7,1 in x und y, gerundet (7, 7). Solche Zwischenbilder entstehen, wenn man in die Mitte zwischen zwei Keys zeichnet statt auf den Bogen.
    resources:
      - title: Wikipedia · Twelve basic principles, Arc
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Arc

  - id: spitze-fuehrt
    type: bug
    title: Wer zieht da?
    prompt: |
      Eine Pendelkette soll am oberen Glied mitgezogen werden, jedes Glied ein Bild später als das darüber. Beim Abspielen schwingen in einem Bild das mittlere Glied und die Spitze wie ein steifes Stück mit, statt nachzuhängen. Finde die Zeile.
    lang: text
    code: |
      Bild  G1  G2  G3
       1     0   0   0
       2    20   0   0
       3    40  20  20
       4    40  40  20
       5    40  40  40
    lines: [4]
    fix:
      - line: 4
        answers:
          - " 3    40  20   0"
    explanation: |
      In Bild 3 springt Glied 3 auf 20 Grad, im selben Bild wie Glied 2. Nach der Regel müsste es noch auf 0 stehen und erst in Bild 4 auf 20 gehen. Bewegt sich die Spitze so früh wie ihr Ansatz, wird sie nicht mehr mitgezogen; die Bewegung kommt dann nicht mehr vom oberen Glied. Die Richtung der Bewegung in einer Kette verrät, wo die Kraft sitzt.
    resources:
      - title: Wikipedia · Follow through and overlapping action
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Follow_through_and_overlapping_action

  - id: hammer-bogen
    type: explain
    title: Der Weg eines Hammerkopfs
    prompt: |
      Muybridge hat einen Schmied fotografiert, der mit beiden Händen auf einen Amboss schlägt (Tafel 378, Link unten). Die Liste beschreibt die seitliche Reihe. Erkläre in wenigen Sätzen, welchen Weg der Hammerkopf nimmt, warum, und was passieren würde, wenn du zwischen Bild 5 und Bild 9 Zwischenbilder auf der Geraden zeichnest.
    lang: text
    code: |
      Bild  Hammerkopf         Arme
       1    vorn, am Amboss    gestreckt
       2    vor der Brust      gebeugt
       3    neben dem Kopf     gebeugt
       4    hinter dem Kopf    gebeugt
       5    senkrecht oben     gestreckt
       6    oben, etwas vorn   gestreckt
       7    vorn über dem Kopf gestreckt
       8    vorn, Kopfhöhe     gestreckt
       9    am Amboss          gestreckt
      10    vor der Brust      gebeugt
    points:
      - Der Hammerkopf läuft auf einer gekrümmten Bahn, weil Schultern und Ellbogen drehen; das Ende der Gelenkkette beschreibt Bögen.
      - Beim Ausholen (2 bis 4) sind die Arme gebeugt, der Hammer bleibt nah am Kopf, der Bogen ist eng.
      - Beim Schlag (5 bis 9) sind die Arme gestreckt, der Hammer läuft auf einem weiten Bogen nach vorn unten.
      - Zwischenbilder auf der Geraden von 5 nach 9 würden den Hammer zum Körper hin ziehen; die Arme wirkten kürzer, der Schlag verlöre seinen Schwung.
    explanation: |
      Der Hammerkopf hängt am Ende einer Kette aus Schultern, Ellbogen und Handgelenken. Beim Ausholen beugt der Schmied die Arme, der Hammer bleibt nah am Kopf und beschreibt einen engen Bogen. Beim Schlag streckt er die Arme, und der Hammer läuft auf einem weiten Bogen zum Amboss. Eine Gerade von Bild 5 nach Bild 9 schneidet diesen Bogen ab: Der Hammer käme dem Körper näher, die gestreckten Arme müssten kürzer werden. Zeichne deshalb den Bogen vor und setz die Zwischenbilder darauf.
    resources:
      - title: Wikimedia Commons · Muybridge, Plate 378, Blacksmith hammering
        url: https://commons.wikimedia.org/wiki/File:Man_in_pelvis_cloth_hammering_an_anvil_(rbm-QP301M8-1887-378).jpg

  - id: handpfad-nachzeichnen
    type: practice
    title: Der Weg deiner Hand
    prompt: |
      Film dich von der Seite, wie du einen Ball wirfst oder einen Arm hebst und senkst. Halte das Video an, leg Backpapier auf den Bildschirm oder nimm Screenshots in eine Zeichen-App, und setz für jedes Bild einen Punkt an die Hand. Verbinde die Punkte. Notier, was du siehst.
    lang: prose
    starter: |
      Bewegung, Aufnahmerate:
      Zahl der markierten Bilder:
      Form des Pfads:
      Wo liegen die Punkte eng, wo weit:
      Knicke oder Sprünge (Bildnummer):
      Was ich anders erwartet hätte:
    checklist:
      - Du hast in jedem aufeinanderfolgenden Bild denselben Punkt an der Hand markiert, ohne Bilder zu überspringen.
      - Du hast die Form des Pfads beschrieben (gerade, Bogen, Schleife, S-Kurve).
      - Du hast notiert, wo die Punkte eng und wo sie weit liegen.
      - Knicke oder Sprünge sind mit Bildnummer notiert, oder du hast ausdrücklich notiert, dass es keine gibt.
    hints:
      - Wähle einen Punkt, den du in jedem Bild sicher wiederfindest, etwa den Knöchel des Zeigefingers.
    explanation: |
      Der nachgezeichnete Pfad zeigt Bogen und Spacing zugleich: die Form der Kurve und, über die Abstände der Punkte, wo die Hand schnell und wo sie langsam ist. Meist ist der echte Pfad runder und unregelmäßiger, als man ihn zeichnen würde. Den Pfad legst du später unter deine Keys, um die Zwischenbilder darauf zu setzen.
    resources:
      - title: Wikipedia · Twelve basic principles, Arc
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Arc

  - id: schal-daumenkino
    type: practice
    title: Ein Schal, der nachkommt
    prompt: |
      Zeichne eine Gliederpuppe mit einem Schal aus drei Gliedern auf Haftzettel: Sie geht drei Bilder lang nach rechts und bleibt stehen. Schreib zuerst den Absichtssatz. Plane den Schal mit einem Bild Versatz je Glied und einem Nachschwingen mit abnehmendem Ausschlag. Blättere das Daumenkino und zeig es jemandem ohne Vorrede. Frag nur: „Was passiert da?“
    lang: prose
    starter: |
      Absichtssatz:
      Bildliste (Bild, Puppe, Schal G1, G2, G3):
      Ausschläge beim Nachschwingen:
      Zuschauer sagt (wörtlich):
      Abweichung von meiner Absicht:
      Was ich ändere:
    checklist:
      - Der Absichtssatz stand fest, bevor du gezeichnet hast.
      - In der Bildliste kommt jedes Schalglied ein Bild nach dem Glied darüber zur Ruhe.
      - Jeder Ausschlag beim Nachschwingen ist kleiner als der vorige, und der letzte ist 0.
      - Die Antwort des Zuschauers steht wörtlich da; ohne Zuschauer hast du nach einer Nacht Abstand selbst geprüft und das markiert.
      - Du hast notiert, was du ändern würdest, und an welcher Zeile der Bildliste.
    hints:
      - Plane zuerst nur die Puppe, dann G1, dann G2 und G3, jedes aus der Zeile davor abgeleitet.
    explanation: |
      Die Übung verbindet Drag beim Losgehen und Follow-through beim Anhalten an einem einzigen Objekt. Die Bildliste macht den Versatz prüfbar, bevor du zeichnest. Was der Zuschauer sagt, zeigt, ob er den Schal als mitgezogen liest; ob die Bewegung „weich“ oder „schwer“ wirkt, ist seine Beobachtung, keine Garantie deines Plans.
    resources:
      - title: Saint11 · Character Idle
        url: https://saint11.art/blog/pixel-art-tutorials/#characterIdle
