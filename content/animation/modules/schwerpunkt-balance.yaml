id: schwerpunkt-balance
title: Schwerpunkt, Gleichgewicht und Bodenkontakt
level: 2
minutes: 110
summary: Wie der Schwerpunkt einer Figur über die Zeit wandert, warum er über der Stützfläche liegen muss, damit sie steht, warum ein tragender Fuß sich nicht bewegt und wie du in der Draufsicht mit dem Schatten zeigst, wo der Boden ist.
place: unterwegs
goals:
  - Du schätzt den Schwerpunkt einer Pose und prüfst mit dem Lot, ob er über der Stützfläche liegt.
  - Du planst, wie der Schwerpunkt vor einem Schritt, beim Aufstehen und beim Heben wandert, bevor sich die Füße bewegen.
  - Du rechnest den gemeinsamen Schwerpunkt aus Figur und Last aus und leitest daraus die Haltung ab.
  - Du hältst tragende Füße zwischen Kontaktbildern fest und findest rutschende Füße in einer Bildliste.
  - Du zeigst in einer Draufsicht Höhe über den Abstand zwischen Figur und Schatten und hältst den Schatten am Boden.
