lesson: |
  Deine Gliederpuppe steht von einem Stuhl auf, und in einem anderen Versuch hebt sie eine Kiste. Beide Male stimmt etwas nicht, ohne dass du sagen kannst, was. Beim Aufstehen schwebt sie nach oben, als hinge sie an einem Haken. Mit der Kiste in den Armen steht sie kerzengerade, als wöge die Kiste nichts. Und beim ersten Schritt danach rutscht der Fuß, auf dem sie steht, ein Stück mit.

  Alle drei Fehler haben dieselbe Ursache: Die Zeichnungen wissen nicht, wo das Gewicht ist. Richard Williams betont im Band *Flexibility and Weight* seines *Animator's Survival Kit*, wie wichtig es ist, „where the weight is in every drawing“ zu wissen: woher es kommt, worüber es wandert und wohin es geht ([AWN](https://www.awn.com/news/animators-survival-kit-now-available-mini-guides)). Wie eine einzelne Pose ihr Gewicht zeigt, steht in [Pose und Ausdruck](/pixelart/pose-ausdruck). Diese Lektion fragt, wie der Schwerpunkt **über die Zeit** wandert, und was die Füße dabei tun.

  ## Schwerpunkt, Lot und Stützfläche

  Der **Schwerpunkt** ist der Punkt, an dem du einen Körper unterstützen könntest, ohne dass er kippt. Für einen Körper aus mehreren Teilen ist er der nach Masse gewichtete Mittelwert ihrer Positionen ([Center of mass](https://en.wikipedia.org/wiki/Center_of_mass#A_system_of_particles)). Bei einem aufrecht stehenden Erwachsenen liegt er rund 10 cm über der Stelle, an der der Oberschenkel an der Hüfte ansetzt ([Center of mass: Body motion](https://en.wikipedia.org/wiki/Center_of_mass#Body_motion)). Bewegt sich ein Arm, ein Bein oder der Oberkörper, wandert der Schwerpunkt mit.

  Die **Stützfläche** ist die Fläche, auf der der Körper steht: beide Füße und alles dazwischen. Steht die Figur auf einem Bein, schrumpft sie auf diesen einen Fuß. Stützt sie sich mit der Hand an einer Wand ab, wächst sie bis zur Hand. Gleichgewicht heißt in der Biomechanik, das **Lot**, also die senkrechte Linie vom Schwerpunkt nach unten, innerhalb der Stützfläche zu halten ([Balance](https://en.wikipedia.org/wiki/Balance_(ability))).

  ```text
  Boden  ....[=========]....
  Lot A        ^         stabil
  Lot B                  ^ kippt
  ```

  Liegt das Lot neben der Stützfläche, kippt der Körper, bis ein Fuß oder eine Hand ihn auffängt. Beides kann gewollt sein: Ein Sturz beginnt so, und jeder Schritt nach vorn auch. Ungewollt ist es, wenn eine Figur stillsteht und das Lot daneben liegt. Dann steht sie, wie ein Mensch nicht stehen kann.

  > [!TIP] Das Lot auf dem Papier
  > Leg ein Lineal oder einen Faden senkrecht durch die Hüfte deiner Strichfigur. Markiere die Füße als Strecke auf der Bodenlinie. Fällt das Lot zwischen die Füße, steht die Figur. In einer Fotoserie kannst du dasselbe tun: Das Lot durch die Hüfte jedes Bilds zeigt dir, wann das Gewicht von einem Fuß auf den anderen geht.

  Jonathan Cooper zählt in seinen fünf Grundlagen der Spielanimation „Collision & Center of Mass/Balance“ zur Lesbarkeit ([Five Fundamentals](https://www.gameanim.com/2020/04/04/the-five-fundamentals-of-video-game-animation/)). Ein Zuschauer liest das Gleichgewicht einer Figur mit, auch wenn er es nicht benennen kann.

  > [!MERKE]
  > Steht eine Figur still, fällt das Lot von ihrem Schwerpunkt in die Stützfläche. Bevor ein Fuß sich hebt, muss das Gewicht über dem anderen sein.

  ## Der Schwerpunkt wandert, bevor die Füße es tun

  Willst du aus dem Stand einen Fuß heben, schrumpft die Stützfläche auf den anderen Fuß. Das Lot muss also vorher dorthin, sonst kippst du zur Seite. Von vorn gesehen wandert die Hüfte deshalb über den Standfuß, und erst danach hebt sich der andere, das **Spielbein**. Als Bildliste, x in Pixeln von links:

  ```text
  Bild  Hüfte  Fuß L  Fuß R
   1     16     12     20
   2     18     12     20
   3     20     12     20
   4     20    hebt    20
  ```

  In Bild 3 steht die Hüfte über dem rechten Fuß. Erst in Bild 4 hebt sich der linke. Zeichnest du das Heben schon in Bild 2, hängt das Gewicht über einer Stelle, an der kein Fuß mehr steht.

  Beim Aufstehen vom Stuhl ist es dasselbe in der Seitenansicht. Im Sitzen tragen Sitzfläche und Füße gemeinsam. Damit die Füße allein tragen können, muss der Oberkörper so weit nach vorn, dass das Lot über den Füßen liegt. Erst dann hebt das Gesäß ab und die Beine strecken sich. Fehlt diese Vorlage, steigt die Figur senkrecht auf und schwebt.

  Beim Gehen hebt sich der Schwerpunkt, wenn das Standbein senkrecht steht, und sinkt, wenn die Beine gespreizt sind; der Körper „vaults“ über das Bein am Boden ([Walking](https://en.wikipedia.org/wiki/Walking)). Wie du daraus einen Gangzyklus baust, steht in [Gehen und Laufen](/animation/gehen-laufen).

  ## Last tragen: ein gemeinsamer Schwerpunkt

  Hebt eine Figur eine Kiste, zählt der Schwerpunkt von Figur und Kiste zusammen. Hält sie die Kiste vor dem Bauch, zieht die Kiste ihn nach vorn. Damit das Lot über den Füßen bleibt, muss etwas nach hinten. Ein Modell mit Masse und waagerechter Position der Teile, die Füße bei x = 0:

  ```python run
  def sp(teile):
      m = mx = 0
      for masse, x in teile:
          m += masse
          mx += masse * x
      return mx / m

  # (kg, x in cm), Füße bei 0
  puppe = (60, 0)
  kiste = (20, 30)
  print(sp([puppe, kiste]))
  puppe = (60, -10)
  print(sp([puppe, kiste]))
  ```

  Mit der Kiste 30 cm vor dem Körper liegt der gemeinsame Schwerpunkt 7,5 cm vor den Füßen. Verlagert die Puppe ihr eigenes Gewicht um 10 cm nach hinten, steht das Lot wieder über den Füßen. Die Zahlen sind ein Modell, das Prinzip zeigt sich in jeder Aufnahme: Je schwerer die Last und je weiter sie vom Körper ist, desto mehr muss die Figur dagegenhalten. Daraus folgen zwei Dinge, die du zeichnest:

  - **Beim Bücken geht die Hüfte nach hinten**, während Kopf und Arme nach vorn gehen.
  - **Eine schwere Last bleibt nah am Körper**, und der Körper lehnt sich gegen sie. Trägt die Figur etwas auf einer Seite, neigt sie sich zur anderen.

  Muybridge hat einen Mann fotografiert, der einen 75 Pfund schweren Stein hebt und wegstößt, aus drei Blickwinkeln ([Plate 317](https://commons.wikimedia.org/wiki/File:Man_in_pelvis_cloth_throwing_rock_(rbm-QP301M8-1887-317).jpg)). In der seitlichen Reihe siehst du, wie weit die Hüfte beim Greifen hinter die Fersen geht. Wie eine Figur durch Haltung und Timing zeigt, dass etwas schwer ist, vertieft [Gewicht zeigen](/animation/gewicht-aufprall).

  ## Bodenkontakt: Ein tragender Fuß steht still

  Ein Fuß, der Gewicht trägt, bewegt sich nicht gegen den Boden. In der Zeichnung heißt das: Vom **Kontaktbild**, in dem er aufsetzt, bis zu dem Bild, in dem er sich hebt, bleibt er auf denselben Pixeln. Der Körper bewegt sich über ihm, der Fuß nicht. Rutscht er auch nur ein Pixel, sieht die Figur aus, als stünde sie auf Eis.

  ```text
  Bild  Standfuß  Spielbein  Hüfte
   1      20        10        15
   2      20        10        19
   3      20        16        21
   4      20        24        23
   5      20        30        26
  ```

  Der Standfuß bleibt bei x = 20, bis das Spielbein in Bild 5 aufsetzt. Erst danach darf er sich heben. Prüf das mit Onion Skinning oder mit übereinandergelegten Haftzetteln: Der tragende Fuß muss in allen Bildern deckungsgleich sein.

  Im Spiel kommt eine zweite Quelle für rutschende Füße dazu: Die Figur bewegt sich per Code über den Boden, und das Tempo passt nicht zur Schrittlänge der Animation. Wie du das ausrechnest, steht in [Animationen in Godot](/godot/animationen).

  > [!PRAXIS] Schritte nach Strecke statt nach Zeit
  > David Rosen erzählt in seinem GDC-Vortrag, dass sein Lauf nur zwei Keys hat und von der zurückgelegten Strecke angetrieben wird, nicht von der Zeit. Weil Animation und Bewegung über den Boden so aneinander hängen, rutschen die Füße nicht ([An Indie Approach to Procedural Animation](https://www.youtube.com/watch?v=LNidsMesxSE&t=329s), ab 5:29). Für gezeichnete Sprites ist das nicht direkt übertragbar, das Prinzip schon: Der Fuß am Boden gibt das Tempo vor.

  ## Draufsicht: Höhe und Boden auf derselben Achse

  In einer Seitenansicht ist oben oben. In einer Draufsicht, auch der schrägen 3/4-Ansicht vieler Top-down-Spiele, heißt „weiter oben auf dem Bildschirm“ zweierlei: weiter hinten auf dem Boden oder höher in der Luft. Das Auge braucht einen Anker, um beides zu trennen, und das ist der **Schatten**. Er bleibt am Boden, an der Stelle, über der die Figur ist.

  Pedro Medeiros (Saint11) beschreibt das für die Technik von Top-down-Spielen: Schwebende Objekte bekommen ihren Bezugspunkt dort, „they would touch the ground“, und Kollisionen sind „like a ground projection of what it would be in 3-D“ ([Top Down Tricks](https://saint11.art/blog/pixel-art-tutorials/#TopDownTricks)). Maßgeblich ist die Position auf dem Boden. Die Höhe zeichnest du als Abstand darüber. Ein Sprung:

  ```text
  Bild 1   Bild 2   Bild 3
                      o
             o       /|\
    o       /|\      / \
   /|\      / \
   / \
   ===      ===      ===
  ```

  Der Schatten bleibt in allen drei Bildern auf derselben Zeile, nur die Figur steigt. Als Bildliste mit Bildschirmzeilen: Figur y = Schatten y − Höhe.

  ```text
  Bild  Schatten  Höhe  Figur
   1      100       0    100
   2      100       6     94
   3      100      10     90
   4      100      12     88
  ```

  Dasselbe gilt im Kleinen. Medeiros' wippende Ruheposen bewegen den Körper um ein Pixel nach unten und wieder nach oben, mit gebeugten Knien, und „Character doesn't change mass“ ([Character Idle](https://saint11.art/blog/pixel-art-tutorials/#characterIdle)). Raymond Schlitter lässt den Körper in einem Top-down-Lauf aus sechs Bildern um −1, −1 und +2 Pixel wippen ([Pixelblog 55](https://www.slynyrd.com/blog/2025/3/24/pixelblog-55-top-down-character-animation)). Das Auf und Ab über festen Füßen und festem Schatten zeigt, dass Gewicht auf den Beinen liegt.

  Aus der Draufsicht sind Figuren oft klein, und kleine Figuren verlieren Bewegungsinformation; wie Animatoren das mit Übertreibung ausgleichen, steht in [Körpersprache und Zustandswechsel](/animation/koerpersprache). Für Gewicht heißt das: Ein Pixel Einsinken kann zu wenig sein. Ob es reicht, zeigt der Beobachtungstest. Damit der Schatten im Spiel am richtigen Fleck bleibt, gehört der Ursprung des Sprites an die Füße ([Sprites importieren](/godot/sprites-importieren)).

  > [!INTERVIEW]
  > „Wie zeigst du in einem Top-down-Spiel, dass eine Figur springt?“ Gute Antwort: Über den Abstand zum Schatten. Die Position der Figur ist der Punkt am Boden, dort bleibt der Schatten. Die Höhe zeichne ich als Versatz nach oben. Steigen Figur und Schatten gemeinsam, hat sich der Bodenpunkt verschoben: Das ist eine Bewegung nach hinten, kein Sprung. Beim Landen achte ich darauf, dass die Füße wieder genau auf den Schatten treffen, und prüfe, ob Zuschauer den Sprung als Sprung erkennen.

  ## Häufige Fehler

  - **Aufstehen ohne Vorbeugen.** Das Lot bleibt hinter den Füßen, die Figur schwebt nach oben. Erst den Oberkörper über die Füße, dann die Beine strecken.
  - **Fuß hebt, bevor das Gewicht verlagert ist.** Das Gewicht hängt über einer Stelle ohne Fuß. Die Hüfte wandert zuerst über den Standfuß.
  - **Last ohne Gegengewicht.** Eine Figur trägt eine schwere Kiste und steht kerzengerade. Hüfte nach hinten, Last nah an den Körper.
  - **Rutschender Standfuß.** Ein tragender Fuß verschiebt sich zwischen Kontakt und Abheben. Er bleibt auf denselben Pixeln.
  - **Schatten springt mit.** Steigt der Schatten mit der Figur, hat sie sich auf dem Boden nach hinten bewegt. Der Schatten bleibt am Boden.
  - **Gleichgewicht nur in den Keys geprüft.** Ein Zwischenbild, in dem das Lot neben den Füßen liegt, sieht man beim Abspielen als Wackeln. Prüf jedes Bild.

  ## Zusammenfassung

  - Steht eine Figur still, fällt das Lot von ihrem Schwerpunkt in die Stützfläche. Liegt es daneben, kippt sie, bis ein Fuß sie auffängt.
  - Der Schwerpunkt wandert vor den Füßen: Erst geht das Gewicht über den Standfuß, dann hebt sich das Spielbein. Beim Aufstehen geht der Oberkörper zuerst über die Füße.
  - Figur und Last haben einen gemeinsamen Schwerpunkt. Eine schwere Last zieht ihn weg, die Figur hält mit Hüfte oder Neigung dagegen.
  - Ein tragender Fuß bleibt vom Kontaktbild bis zum Abheben auf denselben Pixeln.
  - In der Draufsicht ist der Schatten der Boden. Höhe ist der Abstand zwischen Figur und Schatten, und der Schatten steigt nicht mit.
  - Kleine Figuren aus der Ferne brauchen deutlichere Bewegungen. Ob ein Pixel Einsinken reicht, prüfst du mit einem Zuschauer.
exercises:
  - id: kiste-im-gleichgewicht
    type: choice
    title: Bücken, ohne zu kippen
    prompt: |
      Eine Gliederpuppe bückt sich nach einer schweren Kiste und hebt sie an. Was hält sie dabei im Gleichgewicht?
    options:
      - text: Die Hüfte geht nach hinten, während Kopf und Arme nach vorn gehen.
        correct: true
        why: Das Gewicht hinter den Füßen gleicht das Gewicht vor den Füßen aus. Das Lot bleibt in der Stützfläche.
      - text: Die Kiste bleibt beim Anheben nah am Körper.
        correct: true
        why: Je näher die Last, desto weniger zieht sie den gemeinsamen Schwerpunkt nach vorn.
      - text: Die Knie bleiben durchgestreckt, nur der Oberkörper klappt nach vorn.
        correct: false
        why: Ohne Hüfte nach hinten liegt das Gewicht von Oberkörper und Kiste vor den Füßen. Die Puppe kippt nach vorn.
      - text: Die Arme strecken sich weit nach vorn, um die Kiste früh zu greifen.
        correct: false
        why: Weit vorgestreckte Arme mit Last ziehen den Schwerpunkt nach vorn, also aus der Stützfläche heraus.
    explanation: |
      Beim Heben haben Figur und Kiste einen gemeinsamen Schwerpunkt, und sein Lot muss über den Füßen bleiben. Alles, was vor den Füßen ist, braucht ein Gegengewicht dahinter, meist die Hüfte. Eine nahe Last braucht weniger davon als eine ferne. In Muybridges Tafel 317 siehst du beides: Gesäß weit hinten beim Greifen, Stein nah am Bauch beim Anheben.
    resources:
      - title: Wikimedia Commons · Muybridge, Plate 317
        url: https://commons.wikimedia.org/wiki/File:Man_in_pelvis_cloth_throwing_rock_(rbm-QP301M8-1887-317).jpg

  - id: sprung-von-oben
    type: choice
    title: Ein Sprung in der Draufsicht
    prompt: |
      In deinem Top-down-Spiel springt eine Figur auf der Stelle. Wie zeigst du in den Zeichnungen, dass sie in die Höhe geht und nicht nach hinten läuft?
    options:
      - text: Die Figur steigt auf dem Bildschirm nach oben, der Schatten bleibt auf seiner Zeile.
        correct: true
        why: Der Schatten markiert den Punkt am Boden. Der wachsende Abstand zu ihm zeigt Höhe.
      - text: Figur und Schatten steigen gemeinsam auf dem Bildschirm nach oben.
        correct: false
        why: Steigt der Bodenpunkt mit, hat sich die Figur auf dem Boden nach hinten bewegt, statt in die Höhe zu gehen.
      - text: Die Figur bleibt auf ihrer Zeile, der Schatten wandert nach unten.
        correct: false
        why: Der Abstand zum Schatten wächst zwar, aber der Bodenpunkt wandert nach vorn. So springt die Figur auf dich zu, nicht auf der Stelle.
      - text: Die Figur wird in jedem Bild ein Pixel breiter.
        correct: false
        why: Das ändert die Form, nicht die Höhe. Ohne Abstand zum Schatten gibt es keinen Hinweis auf einen Sprung.
    explanation: |
      In der Draufsicht teilen sich Höhe und Tiefe die senkrechte Bildschirmachse. Der Schatten trennt sie, weil er immer am Boden bleibt. Saint11 beschreibt dieselbe Idee für die Technik: Bezugspunkt eines schwebenden Objekts ist die Stelle, an der es den Boden berühren würde. Die Höhe ist der Abstand darüber.
    resources:
      - title: Saint11 · Top Down Tricks
        url: https://saint11.art/blog/pixel-art-tutorials/#TopDownTricks

  - id: aufstehen-ordnen
    type: order
    title: Vom Stuhl hoch
    prompt: |
      Bring die Phasen beim Aufstehen von einem Stuhl in die richtige Reihenfolge.
    lang: prose
    lines: |
      Die Puppe sitzt, Sitzfläche und Füße tragen gemeinsam.
      Der Oberkörper beugt sich vor, das Lot wandert Richtung Füße.
      Das Lot liegt über den Füßen, das Gesäß hebt ab.
      Die Beine strecken sich, der Oberkörper richtet sich auf.
      Die Puppe steht, das Lot fällt zwischen die Füße.
    explanation: |
      Solange die Sitzfläche mitträgt, darf das Lot hinter den Füßen liegen. Bevor das Gesäß abhebt, müssen die Füße allein tragen, also muss das Lot vorher über ihnen sein. Deshalb kommt das Vorbeugen vor dem Strecken. Wer die Reihenfolge umdreht, zeichnet eine Figur, die aus dem Stuhl schwebt.
    resources:
      - title: Wikipedia · Balance (ability)
        url: https://en.wikipedia.org/wiki/Balance_(ability)

  - id: welche-posen-stehen
    type: output
    title: Steht sie oder kippt sie?
    prompt: |
      Für vier Posen kennst du die Lage des Lots und die Stützfläche, beides in Pixeln von links. Welche Posen stehen, ohne dass die Figur einen Schritt machen oder sich festhalten muss? Antworte mit den Nummern, aufsteigend, durch Komma getrennt, etwa `2, 4`.
    lang: text
    code: |
      Pose  Lot bei x  Stützfläche
       1       12      10 bis 20
       2       22      10 bis 20
       3       15      14 bis 16
       4        9      10 bis 20
    expected: |
      1, 3
    accept:
      - "1,3"
      - 1 3
      - 1 und 3
    explanation: |
      Pose 1 hat das Lot bei 12, also zwischen 10 und 20. Pose 3 steht auf einer schmalen Fläche, etwa einem Bein, aber das Lot trifft sie genau. Bei Pose 2 liegt das Lot rechts neben den Füßen, bei Pose 4 links daneben; beide kippen, bis ein Fuß sie auffängt. Eine schmale Stützfläche ist wackelig, aber nicht falsch, solange das Lot darin liegt.
    resources:
      - title: Wikipedia · Balance (ability)
        url: https://en.wikipedia.org/wiki/Balance_(ability)

  - id: mehlsack-tragen
    type: output
    title: Ein Mehlsack vor dem Bauch
    prompt: |
      Eine Gliederpuppe trägt einen Mehlsack vor dem Bauch und lehnt sich dabei zurück. Was gibt das Programm aus?
    lang: python
    code: |
      def sp(teile):
          m = mx = 0
          for masse, x in teile:
              m += masse
              mx += masse * x
          return mx / m

      # (kg, x in cm), Füße bei 0
      puppe = (60, -5)
      sack = (30, 10)
      print(sp([puppe, sack]))
    expected: |
      0.0
    explanation: |
      60 · (−5) + 30 · 10 = −300 + 300 = 0, geteilt durch 90 kg ergibt 0. Der gemeinsame Schwerpunkt liegt genau über den Füßen. Ein halb so schwerer Sack, nur 15 kg statt 30, bräuchte für dasselbe Ergebnis nur halb so viel Zurücklehnen. Je schwerer die Last, desto deutlicher die Gegenbewegung, und genau die zeigt dem Zuschauer das Gewicht.
    resources:
      - title: Wikipedia · Center of mass, A system of particles
        url: https://en.wikipedia.org/wiki/Center_of_mass#A_system_of_particles

  - id: sprung-zeilen
    type: gap
    title: Wo steht die Figur?
    prompt: |
      Ein Sprung in der Draufsicht, in Bildschirmzeilen. Der Schatten bleibt auf Zeile 100, die Höhe steigt und fällt. Ergänze die Zeile der Figur nach der Regel Figur = Schatten − Höhe.
    lang: text
    code: |
      Bild  Schatten  Höhe  Figur
       1      100       0    100
       2      100       6     94
       3      100      10    ⟦90⟧
       4      100      12    ⟦88⟧
       5      100      10    ⟦90⟧
       6      100       6     94
       7      100       0    ⟦100⟧
    gaps:
      - label: Bild 3
        hint: 100 − 10.
      - label: Bild 4
        hint: 100 − 12.
      - label: Bild 5
        hint: Gleiche Höhe wie Bild 3.
      - label: Bild 7
        hint: Wieder am Boden.
    explanation: |
      Bildschirmzeilen zählen von oben, deshalb heißt höher eine kleinere Zahl. Die Figur steigt von 100 auf 88 und fällt zurück, während der Schatten auf 100 bleibt. In Bild 7 treffen Füße und Schatten wieder zusammen: Das ist der Kontakt. Das Spacing der Höhen (6, 4, 2 aufwärts) bremst zum Scheitel hin wie bei jedem Wurf.
    resources:
      - title: Saint11 · Top Down Tricks
        url: https://saint11.art/blog/pixel-art-tutorials/#TopDownTricks

  - id: begriffe-gleichgewicht
    type: gap
    title: Fünf Wörter fürs Gleichgewicht
    prompt: |
      Ergänze die fehlenden Begriffe.
    lang: prose
    code: |
      Der Punkt, an dem man einen Körper unterstützen könnte, ohne dass er kippt, heißt ⟦Schwerpunkt⟧.
      Die Fläche aus beiden Füßen und allem dazwischen heißt ⟦Stützfläche⟧.
      Die senkrechte Linie vom Schwerpunkt nach unten heißt ⟦Lot⟧.
      Das Bein, das das Gewicht trägt, während das andere schwingt, heißt ⟦Standbein⟧.
      Das Bild, in dem ein Fuß aufsetzt, heißt ⟦Kontaktbild⟧.
    gaps:
      - label: Ausgleichspunkt
        hint: Englisch center of mass.
        accept: ["Massenmittelpunkt", "Körperschwerpunkt"]
      - label: Fläche unter der Figur
        hint: Englisch base of support.
        accept: ["Unterstützungsfläche", "Standfläche"]
      - label: Senkrechte
        hint: Maurer prüfen damit Wände.
        accept: ["Schwerelot", "Lotlinie"]
      - label: Tragendes Bein
        hint: Gegenteil von Spielbein.
        accept: ["Standfuß"]
      - label: Aufsetzen
        hint: Englisch contact.
        accept: ["Kontakt", "Kontaktpose", "Contact"]
    explanation: |
      Schwerpunkt, Lot und Stützfläche sind das ganze Werkzeug für Gleichgewicht: Fällt das Lot in die Fläche, steht die Figur. Standbein und Kontaktbild sagen, welcher Fuß gerade trägt und ab wann. Mit diesen fünf Wörtern lässt sich jede Bildliste auf Gewicht prüfen.
    resources:
      - title: Wikipedia · Center of mass
        url: https://en.wikipedia.org/wiki/Center_of_mass#A_system_of_particles

  - id: standfuss-rutscht
    type: bug
    title: Wie auf Eis
    prompt: |
      Eine Gliederpuppe macht aus dem Stand einen Schritt nach vorn. Genau in dem Bild, in dem der vordere Fuß aufsetzt, rutscht die Figur, als stünde sie auf Eis. Finde die Zeile und korrigiere sie.
    lang: text
    code: |
      Bild  Standfuß  Spielbein  Hüfte
       1      20        10        15
       2      20        10        19
       3      20        16        21
       4      20        24        23
       5      23        30        26
    lines: [6]
    fix:
      - line: 6
        answers:
          - " 5      20        30        26"
    hints:
      - Welcher Fuß trägt in Bild 5 noch Gewicht?
    explanation: |
      In Bild 5 setzt das Spielbein gerade erst auf. Bis dahin trägt der Standfuß das ganze Gewicht und darf sich nicht bewegen. Er springt aber von 20 auf 23, also rutscht er unter der Figur weg. Richtig bleibt er bei 20 und hebt sich frühestens im nächsten Bild, wenn das vordere Bein das Gewicht übernommen hat.
    resources:
      - title: Pixelorama · Timeline, Onion Skinning
        url: https://www.pixelorama.org/user_manual/user_interface/timeline#onion-skinning

  - id: schatten-springt-mit
    type: bug
    title: Ein Hüpfer nach hinten
    prompt: |
      Eine Figur springt in der Draufsicht auf der Stelle. In Bild 3 sieht es aus, als hüpfe sie ein Stück nach hinten, statt nach oben zu gehen. Finde die Zeile und korrigiere sie.
    lang: text
    code: |
      Bild  Schatten  Höhe  Figur
       1      100       0    100
       2      100       6     94
       3       90      10     80
       4      100      12     88
       5      100       6     94
       6      100       0    100
    lines: [4]
    fix:
      - line: 4
        answers:
          - " 3      100      10     90"
    explanation: |
      In Bild 3 steigt der Schatten von Zeile 100 auf 90. Der Schatten ist der Punkt am Boden; steigt er, hat die Figur sich auf dem Boden nach hinten bewegt. Die Figur selbst steht dann mit Zeile 80 zu hoch. Richtig bleibt der Schatten auf 100 und die Figur steht bei 100 − 10 = 90.
    resources:
      - title: Saint11 · Top Down Tricks
        url: https://saint11.art/blog/pixel-art-tutorials/#TopDownTricks

  - id: stein-heben-lesen
    type: explain
    title: Ein Stein von 75 Pfund
    prompt: |
      Muybridge hat einen Mann fotografiert, der einen schweren Stein hebt und wegstößt (Tafel 317, Link unten). Die Liste beschreibt die seitliche Reihe. Erkläre in wenigen Sätzen, wo in den Bildern 2 bis 8 das Gewicht ist und warum der Mann die Haltungen so wählt.
    lang: text
    code: |
      Bild  Was zu sehen ist
       1    steht, Stein vor den Füßen
       2    beugt sich vor, Gesäß
            hinten, Hände greifen
       3    Knie tief gebeugt, Gesäß
            weit hinten, Hände am Stein
       4    Stein vor dem Bauch, nah am
            Körper, Oberkörper hebt sich
       5    Stein auf Kopfhöhe an der
            Schulter, Körper aufrecht
       6    Stein an der Schulter
       7    Stein an der Schulter, Knie
            tiefer gebeugt
       8    stößt ab, Gewicht auf einem
            Fuß, andere Ferse hebt ab
       9    Stein ist weg
      10    hinteres Bein schwingt vor
      11    Bein noch vorn in der Luft
      12    steht auf beiden Füßen
    points:
      - Beim Greifen (2 und 3) geht das Gesäß weit nach hinten, während Kopf und Arme nach vorn gehen; so bleibt das Lot über den Füßen.
      - Beim Anheben (4 und 5) bleibt der Stein nah am Körper; der gemeinsame Schwerpunkt von Mann und Stein bleibt so über der Stützfläche.
      - Mit dem Stein an der Schulter (6 und 7) liegt die Last über dem Körper; das tiefere Knie in Bild 7 holt Schwung für den Stoß.
      - Beim Stoß (8) verlagert er das Gewicht auf einen Fuß, die Stützfläche wird klein, und nach dem Abwurf (9 bis 12) findet er den Stand wieder.
    explanation: |
      In jedem Bild vor dem Stoß sorgt der Mann dafür, dass das Lot vom gemeinsamen Schwerpunkt aus Körper und Stein über seinen Füßen bleibt. Beim Greifen gleicht das Gesäß hinten den vorgebeugten Oberkörper aus, beim Heben bleibt der Stein dicht am Bauch, und an der Schulter liegt er fast über den Füßen. Das Einsinken in Bild 7 ist die Vorbereitung auf den Stoß; wie man so etwas als Antizipation zeichnet, steht in [Antizipation, Aktion, Erholung](/animation/antizipation-erholung). Erst beim Stoß gibt er das Gleichgewicht kurz auf und fängt sich danach.
    resources:
      - title: Wikimedia Commons · Muybridge, Plate 317
        url: https://commons.wikimedia.org/wiki/File:Man_in_pelvis_cloth_throwing_rock_(rbm-QP301M8-1887-317).jpg

  - id: aufstehen-thumbnails
    type: practice
    title: Das Lot beim Aufstehen
    prompt: |
      Zeichne auf Papier vier bis sechs Thumbnails einer Gliederpuppe, die von einem Stuhl aufsteht, von der Seite. Markiere in jedem Thumbnail den Schwerpunkt als Punkt, zieh das Lot nach unten und markiere die Stützfläche auf der Bodenlinie. Wenn du magst, film dich vorher selbst dabei.
    lang: prose
    starter: |
      Absichtssatz:
      Thumbnail 1 (Pose, Lot, Stützfläche):
      Thumbnail 2:
      Thumbnail 3:
      Thumbnail 4:
      Bild, in dem das Gesäß abhebt:
      Liegt das Lot dort über den Füßen?
    checklist:
      - Jedes Thumbnail hat einen markierten Schwerpunkt, ein Lot und eine markierte Stützfläche.
      - In dem Thumbnail, in dem das Gesäß abhebt, fällt das Lot auf die Füße.
      - Solange das Gesäß sitzt, ist die Sitzfläche Teil der Stützfläche und als solche markiert.
      - Im letzten Thumbnail fällt das Lot zwischen die Füße.
      - Hast du dich gefilmt, ist notiert, in welchem Videobild das Gesäß abhebt.
    hints:
      - Der Schwerpunkt liegt beim Stehen etwa auf Hüfthöhe. Beugt sich der Oberkörper vor, wandert er mit nach vorn.
    explanation: |
      Die Übung macht sichtbar, was die Erinnerung auslässt: das Vorbeugen vor dem Aufstehen. Mit Lot und Stützfläche in jedem Thumbnail prüfst du Gleichgewicht, bevor du einen einzigen Pixel setzt. Dieselbe Prüfung funktioniert für Hinsetzen, Bücken und den ersten Schritt aus dem Stand.
    resources:
      - title: Wikipedia · Balance (ability)
        url: https://en.wikipedia.org/wiki/Balance_(ability)

  - id: sprung-mit-schatten
    type: practice
    title: Ein Sprung von oben gesehen
    prompt: |
      Plane einen Sprung auf der Stelle in einer Draufsicht, mit einer Gliederpuppe oder einem Ball und einem Schatten darunter. Schreib den Absichtssatz, leg die Höhen für sechs bis acht Bilder fest und zeichne sie auf Haftzettel, den Schatten immer an derselben Stelle. Zeig das Daumenkino jemandem ohne Vorrede und frag nur: „Was passiert da?“
    lang: prose
    starter: |
      Absichtssatz:
      Bildliste (Bild, Höhe, Figur-Zeile):
      Schatten-Zeile:
      Zuschauer sagt (wörtlich):
      Abweichung von meiner Absicht:
      Was ich ändere:
    checklist:
      - Der Schatten steht auf allen Zetteln an derselben Stelle.
      - Für jedes Bild ist die Figur-Zeile als Schatten-Zeile minus Höhe ausgerechnet.
      - Die Höhen wachsen zum Scheitel hin in kleiner werdenden Schritten und fallen danach in wachsenden Schritten.
      - Im letzten Bild treffen Figur und Schatten wieder zusammen.
      - Die Antwort des Zuschauers steht wörtlich da; ohne Zuschauer hast du nach einer Nacht Abstand selbst geprüft und das markiert.
    hints:
      - Ein Bogen für die Höhen steht in Timing und Spacing beim fallenden Ball. Spiegle ihn für den Aufstieg.
    explanation: |
      Die Übung trennt die beiden Bedeutungen der senkrechten Achse in der Draufsicht. Bleibt der Schatten fest, kann der Zuschauer Höhe und Tiefe auseinanderhalten. Ob er es tut, zeigt seine Antwort: Sagt er „sie läuft nach hinten“, ist der Abstand zum Schatten zu klein oder der Schatten fehlt im Bild. Eine Antwort ist kein Beweis, sie zeigt dir, wo du nachbesserst.
    resources:
      - title: Saint11 · Top Down Tricks
        url: https://saint11.art/blog/pixel-art-tutorials/#TopDownTricks
