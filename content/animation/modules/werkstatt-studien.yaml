id: werkstatt-studien
title: "Werkstatt: neutrale Studien in Varianten"
level: 2
minutes: 150
summary: Drei neutrale Studien im Editor, Ball, Mehlsack und Pendel, je mit einer Basis und Varianten, die sich in genau einer Größe unterscheiden, dazu Timing-Varianten ohne neue Zeichnung, ein Beobachtungstest mit anderen Menschen und ein Protokoll, das festhält, welche Änderung was bewirkt hat.
place: pc
goals:
  - Du legst für eine Studie einen Absichtssatz und eine Basis fest und speicherst jede Variante als eigene Datei.
  - Du baust Varianten, die sich in genau einer Größe von der Basis unterscheiden, und erkennst Vergleiche, in denen sich zwei Größen geändert haben.
  - Du änderst das Timing einer Studie über die Bilddauern, ohne eine Zeichnung anzufassen.
  - Du führst einen Beobachtungstest mit zwei Varianten durch, ohne die Antwort vorzugeben, und notierst die Antworten wörtlich.
  - Du hältst Änderung, Beobachtung und Ergebnis jeder Variante in einem Protokoll fest.
resources:
  - title: Saint11 · A Basic Aseprite Animation
    url: https://saint11.art/pixel_art_articles/article3/
  - title: Slynyrd · Pixelblog 56, Top Down Character Attack Animation
    url: https://www.slynyrd.com/blog/2025/5/23/pixelblog-56-top-down-character-attack-animation
  - title: Walt Disney Family Museum · Animating a Sack Drop
    url: https://www.waltdisney.org/education/workshops/studio-series-animating-sack-drop-adult-session
  - title: Wikipedia · Twelve basic principles of animation
    url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation
lesson: |
  Du willst einen Ball schwerer wirken lassen und änderst drei Dinge auf einmal: Er staucht beim Aufprall stärker, bleibt länger am Boden und springt weniger hoch. Danach wirkt er anders. Aber welche der drei Änderungen hat das bewirkt? Und hat eine davon vielleicht gegen die anderen gearbeitet? Du weißt es nicht, weil du alles gleichzeitig geändert hast.

  Diese Werkstatt übt das Gegenteil. Du baust neutrale Studien und von jeder Varianten, in denen sich genau eine Größe unterscheidet. Ball, Mehlsack und Pendel haben kein Gesicht und keine Geschichte. Was ein Zuschauer in ihnen liest, kommt aus Timing, Spacing und Form. Die Regeln dazu kennst du aus den Unterwegs-Modulen; hier setzt du sie im Editor um und prüfst sie an anderen Menschen. Die Bedienung steht in [Einzelbilder im Editor](/animation/editor-zeitleiste).

  > [!NOTE] Zeit einplanen
  > Plan zwei bis drei Sitzungen am PC ein. Jede Studie braucht eine Basis, zwei Varianten und einen Beobachtungstest. Den Test machst du auch unterwegs, wenn du die GIFs auf dem Handy hast. Die ersten neun Übungen gehen schnell, die letzten drei sind die Werkstatt selbst.

  ## Der Ablauf einer Studie

  1. **Absichtssatz:** ein Satz, was ein Zuschauer lesen soll, etwa „Der Ball ist schwer und kommt nach dem Aufprall schnell zur Ruhe“.
  2. **Basis:** Keys, Timing, Zwischenbilder, gespeichert als eigene Datei, etwa `ball-basis.aseprite`.
  3. **Varianten:** eine Kopie der Basis, in der du genau eine Größe änderst, mit eigenem Namen, etwa `ball-halt.aseprite`.
  4. **Vergleich:** Basis und Variante nebeneinander abspielen und notieren, was du siehst.
  5. **Beobachtungstest:** beide Fassungen anderen zeigen, ohne Vorrede.
  6. **Protokoll:** was geändert ist, was beobachtet wurde, was daraus folgt.

  Die Basis ist der Bezugspunkt. Ohne sie vergleichst du zwei Varianten, die sich in Dingen unterscheiden, an die du dich nicht mehr erinnerst. Deshalb überschreibst du sie nie. Willst du die Basis selbst verbessern, entsteht `ball-basis-v2`, und die alte bleibt liegen.

  ## Eine Größe pro Variante

  Eine Variante ist ein kleines Experiment. Ändert sich nur eine Größe, kannst du jeden Unterschied in der Wirkung dieser Größe zuschreiben. Ändern sich zwei, kannst du es nicht mehr. Die Größen, die du in diesen Studien variierst:

  | Größe | Was du änderst | Neu zeichnen? |
  | --- | --- | --- |
  | Haltezeit | Dauer eines Keys | nein |
  | Gesamttempo | alle Dauern im selben Verhältnis | nein |
  | Spacing | Lage der Zwischenbilder zwischen gleichen Keys | nur Zwischenbilder |
  | Höhe oder Weite | Lage eines Keys, Zwischenbilder nach derselben Regel | Key und Zwischenbilder |
  | Stauchung | Form im Kontaktbild | ein Bild |
  | Ausholen | Tiefe der Ausholpose | ein Key |
  | Versatz | wie viele Bilder ein Teil nachzieht | die betroffenen Teile |

  Am billigsten sind Varianten, die nur Dauern ändern. Gleiche Zeichnungen, andere Zahlen: Das ist der reinste Vergleich, weil die Zeichnung als Ursache ausscheidet. In Aseprite und LibreSprite änderst du dafür die Millisekunden je Bild, in Pixelorama die Faktoren, in Krita die Zahl der Haltebilder. Die Wikipedia-Übersicht der zwölf Prinzipien beschreibt Timing auch als Frage des Gewichts: „a lightweight object will react faster than a heavy one“ ([Twelve basic principles: Timing](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Timing)). Ob dein Zuschauer das so liest, zeigt erst der Test.

  > [!PRAXIS] Ein Bild, verschiedene Dauern
  > Raymond Schlitter (Slynyrd) beschreibt die Ausholpose in seinem Angriffsbeispiel so: „This model uses 1 frame, at various delay durations.“ Das Ausholen ist also ein einziges Bild, das je nach Waffe verschieden lange steht: 100 ms beim Schwert, 200 beim Speer, 250 beim Hammer. Dazu nennt er den Preis: Je länger das Ausholen, desto wuchtiger kann der Schlag wirken, desto größer ist aber die Verzögerung im Spiel ([Pixelblog 56](https://www.slynyrd.com/blog/2025/5/23/pixelblog-56-top-down-character-attack-animation)). Genau so baust du Timing-Varianten.

  Zum Vergleichen spielst du Basis und Variante nebeneinander. Am schnellsten geht es über den Export: Jede Fassung als GIF mit ganzem Faktor, etwa 400 %, und beide nebeneinander im Browser oder Bildbetrachter öffnen ([Einzelbilder im Editor](/animation/editor-zeitleiste)). Die GIFs brauchst du ohnehin für den Beobachtungstest.

  > [!TIP] Varianten in einer Datei
  > Unterscheiden sich die Varianten nur in Zeichnungen, legst du sie auf eine breite Leinwand, jede Variante auf eine eigene Ebene, nebeneinander. Bei Timing-Varianten geht das so nicht, weil eine Bilddauer für alle Ebenen gilt. Dann gibst du jedem Bild denselben Grundtakt, etwa 50 ms, und baust Haltezeiten aus verknüpften Cels, die sich wiederholen ([Linked Cels](https://www.aseprite.org/docs/linked-cels/)): Ein Key, der 150 ms steht, belegt drei Bilder. Jede Ebene hat so ihr eigenes Timing. In Krita ist das die normale Arbeitsweise ([Animation Timeline Docker](https://docs.krita.org/en/reference_manual/dockers/animation_timeline.html#overview)).

  ## Studie 1: der Ball, Gummi oder Bowling

  Den hüpfenden Ball kennst du aus [Timing und Spacing](/animation/timing-spacing); wie Material und Gewicht beim Aufprall aussehen, steht in [Gewicht zeigen](/animation/gewicht-aufprall). Als Basis reicht ein kleiner Ball, etwa 8 bis 16 Pixel, der einmal fällt, aufprallt und zurückspringt. Pedro Medeiros zeigt in seinem Aseprite-Artikel einen Ball, der 4, 3, 2 und 1 Pixel steigt und oben ein Bild lang hält ([A Basic Aseprite Animation](https://saint11.art/pixel_art_articles/article3/#timing)). Das ist ein guter Start für das Spacing; dein Timing legst du selbst fest.

  Drei Varianten bieten sich an, jede mit genau einer Änderung:

  - **Haltezeit am Boden:** nur die Dauer des Kontaktbilds ändern.
  - **Höhe des Rückpralls:** den Key nach dem Aufprall höher oder tiefer setzen, die Zwischenbilder nach derselben Regel wie in der Basis, also mit Abständen, die zum Scheitel hin kleiner werden.
  - **Stauchung:** nur das Kontaktbild flacher und breiter zeichnen. Medeiros' Regel dafür: „When changing the width of an object, always change the height too.“ ([Squash](https://saint11.art/blog/pixel-art-tutorials/#Squash)).

  Ob ein Zuschauer in einer Variante Gummi oder Bowlingkugel sieht, sagt dir keine Regel im Voraus. Animatoren lassen schwere Körper oft niedriger zurückspringen und kürzer nachfedern. Das ist eine Konvention, die du prüfst, kein Gesetz.

  ## Studie 2: der Mehlsack springt oder landet

  Der Mehlsack ist eine alte Übung. Das Walt Disney Family Museum beschreibt sie so: „A popular animation exercise for animators features a sack of flour drawn in a variety of positions to show different movements.“ ([Animating a Sack Drop](https://www.waltdisney.org/education/workshops/studio-series-animating-sack-drop-adult-session)). Ein Sack hat kein Gesicht, keine Arme und keine Beine. Was er zeigt, zeigt er mit Haltung, Stauchung und Timing.

  Als Basis nimmst du einen Sack von etwa 16 Pixeln Höhe, der einen kleinen Sprung macht oder aus geringer Höhe landet. Schwerpunkt und Bodenkontakt kommen aus [Schwerpunkt, Gleichgewicht und Bodenkontakt](/animation/schwerpunkt-balance), Ausholen und Nachfedern aus [Antizipation, Aktion, Erholung](/animation/antizipation-erholung). Varianten:

  - **Tiefe der Hocke:** den Key vor dem Absprung flacher oder tiefer zeichnen, sonst nichts.
  - **Haltezeit der Hocke:** dieselbe Zeichnung, andere Dauer. Das ist die Stellschraube aus dem Slynyrd-Beispiel.
  - **Haltezeit nach der Landung:** wie lange der Sack gestaucht liegen bleibt, bevor er sich aufrichtet.

  Die zweite und dritte Variante brauchen keine neue Zeichnung. Mach sie zuerst; sie kosten Minuten.

  ## Studie 3: Pendel mit Schwanz

  Ein Pendel schwingt auf einem Bogen, an den Umkehrpunkten langsam, unten am schnellsten. An seinem Ende hängt ein weicher Teil, ein Schwanz oder ein Band. Er folgt der Bewegung mit Verzögerung. Wikipedia nennt das Prinzip „drag“, „where a character starts to move and parts of them take a few frames to catch up“ ([Follow through and overlapping action](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Follow_through_and_overlapping_action)). Mehr dazu in [Bögen, Nachziehen und Überlappung](/animation/boegen-ueberlappung).

  Plane die Basis als Winkelliste, bevor du zeichnest. Vereinfacht zeigt die Schwanzspitze bei einem Versatz von einem Bild den Winkel, den das Pendel ein Bild vorher hatte:

  ```text
  Pendel 8 Bilder, Versatz 1 Bild

  Bild   Pendel   Spitze
   1     -30°     -20°
   2     -20°     -30°
   3       0°     -20°
   4      20°       0°
   5      30°      20°
   6      20°      30°
   7       0°      20°
   8     -20°       0°
  ```

  Das Pendel erreicht sein rechtes Extrem in Bild 5, die Spitze erst in Bild 6. Die Varianten ändern nur den Versatz, 0, 1 oder 2 Bilder, und lassen das Pendel selbst unverändert. Bei Versatz 0 bewegt sich der Schwanz wie ein starrer Stab. Welcher Versatz zu einem weichen Band passt und welcher zu einem schweren Seil, prüfst du am Bildschirm und am Zuschauer.

  ## Beobachtungstest und Protokoll für Varianten

  ### Der Beobachtungstest mit zwei Fassungen

  Den Beobachtungstest kennst du aus [Körpersprache und Zustandswechsel](/animation/koerpersprache): ohne Vorrede zeigen, dreimal in Schleife, vom Offenen zum Gezielten fragen, wörtlich notieren, nichts erklären. Mit zwei Varianten kommen drei Regeln dazu.

  - **Neutrale Namen.** Nenn die Fassungen X und Y, nicht „schwer“ und „leicht“. Notier für dich, welche Datei X ist.
  - **Wechselnde Reihenfolge.** Zeig dem nächsten Zuschauer Y zuerst. Sonst misst du vielleicht nur, was als Zweites kam.
  - **Eine Vergleichsfrage.** Nach „Was passiert da?“ zu jeder Fassung fragst du „Was ist bei den beiden anders?“. Stellst du am Ende eine gezielte Frage wie „Welcher ist schwerer?“, notier, dass du sie gestellt hast.

  Eine Antwort ist kein Beleg. Zwei oder drei Zuschauer zeigen eher, ob eine Variante von verschiedenen Menschen gleich gelesen wird. Ist niemand da, siehst du dir die Fassungen nach mindestens einer Nacht Abstand selbst an und markierst das im Protokoll. Wie man Testpersonen beobachtet, ohne sie zu lenken, steht ausführlich in [Testlesen und Playtest](/narrative/testlesen-playtest).

  > [!INTERVIEW]
  > „Ein Lead sagt: Die Landung wirkt zu leicht. Wie gehst du vor?“ Gute Antwort: Ich frage zuerst, woran er das sieht, und schreibe mir einen Absichtssatz für die Landung. Dann baue ich zwei, drei Varianten, die jeweils nur eine Größe ändern, etwa die Haltezeit nach dem Aufprall, die Stauchung oder die Höhe des Nachfederns, und zeige sie ihm und einem zweiten Menschen nebeneinander, ohne zu sagen, was ich geändert habe. Was beide übereinstimmend lesen, übernehme ich, und ich behalte die Basis, falls keine Variante besser ankommt.

  ### Das Protokoll je Variante

  Zu jeder Variante gehört ein Eintrag. Er trennt, was du geändert hast, von dem, was beobachtet wurde, und beides von deinem Schluss:

  ```text
  Studie         Ball
  Absichtssatz   „…“
  Basis          ball-basis, 6 Bilder, 500 ms
  Variante       ball-halt
  Geändert       Bild 4 (Kontakt) 50 → 150 ms
  Sonst gleich   Zeichnungen, übrige Dauern
  Eigener Blick  …
  Test           wer, wann, X = ball-halt, Y = Basis
  Antworten      X: „…“  Y: „…“
  Gezielte Frage ja/nein, welche
  Ergebnis       …
  ```

  Die Zeile „Sonst gleich“ ist die wichtigste. Steht dort etwas anderes als „alles“, hast du zwei Größen geändert. Überarbeitest du später die Basis selbst, führst du das Überarbeitungsprotokoll aus [Werkstatt: eine eigene Figur](/animation/werkstatt-figur).

  > [!WARNING] Keine KI im Bild
  > Ball, Sack, Pendel und jede Variante zeichnest und timest du selbst. Keine generierten Bilder als Vorlage, keine erzeugten Zwischenbilder. Eine KI darf dir ein Skript schreiben, das alle Varianten als GIF exportiert und nebeneinander auf eine HTML-Seite legt. Welche Variante wirkt, sagt dir kein Programm, sondern dein Zuschauer.

  ## Häufige Fehler

  - **Zwei Größen auf einmal.** Längere Haltezeit und stärkere Stauchung in einer Variante. Trenn sie in zwei Varianten.
  - **Basis überschrieben.** Die Variante wurde unter dem Namen der Basis gespeichert. Speichere jede Variante zuerst unter neuem Namen und ändere erst dann.
  - **Gesamtdauer stillschweigend gleich gehalten.** Wer eine Haltezeit verlängert und dafür andere Bilder kürzt, ändert zwei Dinge. Willst du die Verteilung bei gleicher Länge testen, nenn genau das als Größe.
  - **Die Antwort vorgegeben.** „Welcher ist schwerer?“ als erste Frage legt das Thema fest. Zuerst offen fragen.
  - **Fassungen mit sprechenden Namen gezeigt.** Heißt eine Datei `ball-schwer.gif`, liest der Zuschauer mit.
  - **Eine Antwort als Beweis.** Ein Mensch ist ein Hinweis. Frag mehrere oder wiederhol den Test.

  ## Zusammenfassung

  - Jede Studie hat einen Absichtssatz, eine Basis und Varianten, jede als eigene Datei.
  - Eine Variante ändert genau eine Größe. Die Zeile „Sonst gleich“ im Protokoll zeigt, ob das stimmt.
  - Timing-Varianten brauchen keine neue Zeichnung und sind der reinste Vergleich.
  - Ball: Haltezeit, Rückprallhöhe, Stauchung. Mehlsack: Tiefe und Dauer der Hocke, Haltezeit nach der Landung. Pendel: Versatz des Schwanzes.
  - Im Beobachtungstest heißen die Fassungen X und Y, die Reihenfolge wechselt, und die Fragen gehen vom Offenen zum Gezielten.
  - Eine Antwort ist ein Hinweis, kein Beleg. Ohne Zuschauer prüfst du nach einer Nacht selbst und markierst das.
exercises:
  - id: studie-ablauf
    type: order
    title: Von der Absicht zum Protokoll
    prompt: |
      Bring die Schritte einer Studie in die Reihenfolge, in der du sie machst.
    lang: prose
    lines: |
      Einen Absichtssatz für die Studie schreiben.
      Die Basis zeichnen, timen und als eigene Datei speichern.
      Die Basis kopieren und in der Kopie genau eine Größe ändern.
      Basis und Variante nebeneinander abspielen und notieren, was du siehst.
      Beide Fassungen als X und Y zeigen und die Antworten wörtlich notieren.
      Im Protokoll Änderung, Beobachtung und Ergebnis festhalten.
    explanation: |
      Der Absichtssatz kommt zuerst, damit du die Antworten später an etwas messen kannst. Die Basis muss gespeichert sein, bevor du sie kopierst, sonst überschreibst du sie. Den eigenen Blick notierst du vor dem Test, damit die Antworten anderer ihn nicht färben. Das Protokoll fasst am Ende zusammen, was die Variante geändert und was der Test gezeigt hat.
    resources:
      - title: Saint11 · A Basic Aseprite Animation
        url: https://saint11.art/pixel_art_articles/article3/

  - id: saubere-variante
    type: choice
    title: Ein sauberer Vergleich
    prompt: |
      Du willst prüfen, ob eine längere Haltezeit im Kontaktbild beeinflusst, wie schwer ein Zuschauer den Ball findet. Welche Variante ist ein sauberer Vergleich mit der Basis?
    options:
      - text: Eine Kopie der Basis, in der nur das Kontaktbild 150 statt 50 ms steht.
        correct: true
        why: Nur die Haltezeit unterscheidet sich. Jeder Unterschied in den Antworten lässt sich ihr zuschreiben.
      - text: Eine Kopie, in der das Kontaktbild länger steht und der Ball dort stärker gestaucht ist.
        correct: false
        why: Hier ändern sich Haltezeit und Form. Liest der Zuschauer den Ball schwerer, weißt du nicht, welche Änderung es war.
      - text: Eine Kopie, in der das Kontaktbild länger steht und dafür zwei Zwischenbilder kürzer, damit die Gesamtdauer gleich bleibt.
        correct: false
        why: Damit ändern sich die Haltezeit und das Tempo der Zwischenbilder. Das kann eine eigene Variante sein, dann ist ihre Größe die Verteilung bei gleicher Länge.
      - text: Ein neu gezeichneter Ball mit längerem Kontaktbild.
        correct: false
        why: Neue Zeichnungen unterscheiden sich in vielen Pixeln von der Basis. Für eine Timing-Variante bleibt jede Zeichnung, wie sie ist.
    explanation: |
      Eine saubere Variante unterscheidet sich in genau einer Größe. Für Haltezeiten heißt das: dieselbe Datei kopieren, eine Dauer ändern, nichts zeichnen. Alles andere ist auch erlaubt, aber dann als eigene Variante mit eigener Größe im Protokoll.
    resources:
      - title: Wikipedia · Twelve basic principles, Timing
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Timing

  - id: erste-frage
    type: choice
    title: Die erste Frage
    prompt: |
      Du zeigst einem Freund die Varianten X und Y deines Balls, je dreimal in Schleife. Was fragst du zuerst?
    options:
      - text: „Was passiert da?“
        correct: true
        why: Die Frage gibt kein Thema vor. Was der Zuschauer von sich aus nennt, ist das, was er liest.
      - text: „Welcher Ball ist schwerer?“
        correct: false
        why: Die Frage legt das Thema Gewicht fest und unterstellt, dass einer schwerer ist. Stell sie, wenn überhaupt, zuletzt und notier, dass du sie gestellt hast.
      - text: „Siehst du, dass Y länger am Boden liegt?“
        correct: false
        why: Damit erklärst du die Änderung, bevor er sie selbst bemerkt. Danach siehst du nur noch, ob er dir zustimmt.
      - text: „Welcher gefällt dir besser?“
        correct: false
        why: Das fragt nach Geschmack, nicht nach dem, was er sieht. Für deinen Absichtssatz brauchst du eine Beschreibung, kein Urteil.
    explanation: |
      Der Beobachtungstest misst, was ein Mensch ohne Hilfe liest. Jede Frage, die ein Thema, eine Antwort oder ein Urteil vorgibt, ersetzt seine Wahrnehmung durch deine Absicht. Deshalb geht die Reihenfolge vom Offenen („Was passiert da?“) über den Vergleich („Was ist anders?“) zum Gezielten.
    resources:
      - title: Wikipedia · Twelve basic principles of animation
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation

  - id: tempo-variante
    type: output
    title: Alles anderthalbmal so lang
    prompt: |
      Die Variante „Gesamttempo“ multipliziert jede Dauer der Basis mit 1,5. Wie viele Millisekunden dauert ein Durchlauf der Variante? Antworte mit der Zahl.
    lang: text
    code: |
      Basis
      Bild   1    2    3    4    5    6
      ms   100   50   50   50  100  150
    expected: |
      750
    accept:
      - 750 ms
    explanation: |
      Die Basis dauert 500 ms, mal 1,5 sind es 750 ms. Bild für Bild werden aus 50 ms 75 ms. Das sind 4,5 Ticks, und ein solches Bild steht im Spiel abwechselnd 4 und 5 Ticks ([Timing und Spacing](/animation/timing-spacing)). Für den Vergleich im Editor stört das nicht; fürs Spiel wählst du später Dauern, die aufgehen.
    resources:
      - title: Aseprite Docs · Frame Duration
        url: https://www.aseprite.org/docs/frame-duration/

  - id: schwanz-extrem
    type: output
    title: Wann die Spitze umkehrt
    prompt: |
      Ein Pendel mit acht Bildern erreicht sein rechtes Extrem in Bild 5. In der Variante zieht die Schwanzspitze mit einem Versatz von zwei Bildern nach. In welchem Bild erreicht die Spitze ihr rechtes Extrem? Antworte mit der Zahl.
    lang: text
    code: |
      Bild    1    2    3    4    5    6    7    8
      Pendel -30  -20   0   20   30   20    0  -20
      Versatz 2 Bilder
    expected: |
      7
    accept:
      - Bild 7
    explanation: |
      Bei zwei Bildern Versatz zeigt die Spitze in jedem Bild den Winkel, den das Pendel zwei Bilder vorher hatte. Das Extrem von Bild 5 erscheint an der Spitze in Bild 7. Das Pendel ist dann schon auf dem Rückweg bei 0°. In dieser Gegenbewegung sieht man, dass der Teil weich ist; ob zwei Bilder zu viel sind, zeigt der Vergleich mit Versatz 1.
    resources:
      - title: Wikipedia · Follow through and overlapping action
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Follow_through_and_overlapping_action

  - id: protokoll-luecken
    type: gap
    title: Das Protokoll aus zwei Bildlisten
    prompt: |
      Vergleiche Basis und Variante und füll die Lücken im Protokoll mit Zahlen.
    lang: text
    code: |
      Basis     Bild  1    2    3    4    5    6
                ms  100   50   50   50  100  150
      Variante  Bild  1    2    3    4    5    6
                ms  100   50   50  150  100  150

      Geändert        Bild ⟦4⟧, ⟦50⟧ → ⟦150⟧ ms
      Gesamtdauer     ⟦500⟧ → ⟦600⟧ ms
      Neu gezeichnet  ⟦0⟧ Bilder
    gaps:
      - label: Welches Bild
        hint: Vergleiche die beiden Zeilen ms Spalte für Spalte.
      - label: Dauer vorher
        hint: Der Wert in der Basis.
      - label: Dauer nachher
        hint: Der Wert in der Variante.
      - label: Gesamtdauer Basis
        hint: Summe aller Dauern der Basis.
      - label: Gesamtdauer Variante
        hint: Basis plus die Differenz.
      - label: Neue Zeichnungen
        hint: Eine Timing-Variante.
        accept: ["keine"]
    explanation: |
      Nur Bild 4 unterscheidet sich: 50 ms in der Basis, 150 ms in der Variante. Dadurch wird der Durchlauf 100 ms länger, 600 statt 500 ms. Gezeichnet wurde nichts, die Zeile „Sonst gleich“ würde „alles“ heißen. Genau so sieht eine saubere Timing-Variante im Protokoll aus.
    resources:
      - title: Aseprite Docs · Frame Duration
        url: https://www.aseprite.org/docs/frame-duration/

  - id: zwei-groessen
    type: bug
    title: Ein Schluss, der nicht hält
    prompt: |
      Du willst aus diesem Protokoll schließen, dass die längere Haltezeit den Ball schwer wirken lässt. Finde die Zeile, die diesen Schluss unmöglich macht.
    lang: text
    code: |
      Studie         Ball
      Basis          ball-basis
      Variante       ball-schwer
      Geändert       Bild 4 (Kontakt) 50 → 150 ms
      Geändert       Bild 4 gestaucht, 2 px flacher
      Test           X = ball-schwer: „Der ist schwerer.“
      Schluss        Die Haltezeit macht den Ball schwer.
    lines: [5]
    explanation: |
      Die Variante ändert neben der Haltezeit auch die Form des Kontaktbilds. Die Antwort „Der ist schwerer“ kann von der Haltezeit kommen, von der Stauchung oder von beidem. Um den Schluss zu ziehen, brauchst du zwei Varianten: eine nur mit Haltezeit, eine nur mit Stauchung. Dazu kommt ein zweites Problem, das kein Fehler einer Zeile ist: Der Dateiname `ball-schwer` verrät dem Zuschauer die Absicht, falls er ihn sieht.
    resources:
      - title: Saint11 · Squash
        url: https://saint11.art/blog/pixel-art-tutorials/#Squash

  - id: starrer-schwanz
    type: bug
    title: Ein Moment wie ein Stab
    prompt: |
      Die Schwanzspitze soll genau ein Bild hinter dem Pendel herlaufen: In jedem Bild zeigt sie den Winkel, den das Pendel im Bild davor hatte. Beim Abspielen wirkt der Schwanz am rechten Umkehrpunkt einen Moment lang wie ein starrer Stab. Finde die Zeile und korrigiere sie.
    lang: text
    code: |
      Bild   Pendel   Spitze
       1     -30°     -20°
       2     -20°     -30°
       3       0°     -20°
       4      20°       0°
       5      30°      30°
       6      20°      30°
       7       0°      20°
       8     -20°       0°
    lines: [6]
    fix:
      - line: 6
        answers:
          - " 5      30°      20°"
          - 5 30° 20°
    explanation: |
      In Bild 5 zeigt die Spitze denselben Winkel wie das Pendel. Für diesen einen Moment hängt der Schwanz gerade in Verlängerung, ohne Verzögerung, also wie ein Stab. Nach der Regel muss er den Winkel aus Bild 4 zeigen, 20°. Dann erreicht er sein Extrem erst in Bild 6, ein Bild nach dem Pendel.
    resources:
      - title: Wikipedia · Follow through and overlapping action
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Follow_through_and_overlapping_action

  - id: slynyrd-dauern
    type: explain
    title: Ein Bild, verschiedene Dauern
    prompt: |
      Raymond Schlitter (Slynyrd) beschreibt die Ausholpose seines Angriffs so. Erkläre in wenigen Sätzen, warum diese Art zu variieren für eine Studie gut ist, was sie misst und was du zusätzlich prüfen musst, bevor du eine Dauer für dein Spiel wählst.
    lang: text
    code: |
      Anticipation- This phase expresses the wind up of
      the strike […] This model uses 1 frame, at various
      delay durations. The longer and more dramatic the
      wind up, the more impactful a strike can feel, but
      results in more input delay in the context of
      gameplay.
    points:
      - Dieselbe Zeichnung mit verschiedenen Dauern ändert genau eine Größe, die Haltezeit.
      - Weil keine Zeichnung neu ist, scheidet die Zeichnung als Ursache für einen Unterschied aus.
      - Die Varianten kosten Minuten statt Stunden, weil nur Zahlen geändert werden.
      - Wie wuchtig eine Dauer wirkt, prüft der Beobachtungstest; wie viel Verzögerung sie bringt, misst du im Spiel in Ticks.
    explanation: |
      Schlitter gibt der einen Ausholpose je nach Waffe eine andere Dauer. Weil bei ihm auch die Waffen verschieden gezeichnet sind, ist das noch kein sauberer Vergleich. In deiner Studie behältst du die Zeichnung und änderst nur die Dauer; dann ist jeder Unterschied in der Wirkung eine Folge der Dauer, nicht der Zeichnung. Er nennt beide Seiten: mehr mögliche Wucht, mehr Verzögerung. Für eine Studie heißt das: Die Wucht prüfst du mit Zuschauern, die Verzögerung rechnest du in Ticks aus oder misst sie in [der Testszene](/animation/testszene). Was davon in dein Spiel passt, entscheidest du.
    resources:
      - title: Slynyrd · Pixelblog 56
        url: https://www.slynyrd.com/blog/2025/5/23/pixelblog-56-top-down-character-attack-animation

  - id: studie-ball
    type: practice
    title: "Studie 1: Ball in drei Fassungen"
    prompt: |
      Zeichne einen Ball, der fällt, aufprallt und zurückspringt, als Basis. Schreib vorher den Absichtssatz. Bau dann zwei Varianten, die sich jeweils in genau einer Größe von der Basis unterscheiden; eine davon ändert nur Dauern. Exportiere alle drei als GIF mit ganzem Faktor und zeig Basis und je eine Variante als X und Y mindestens einem Menschen. Füll für jede Variante das Protokoll aus.
    lang: prose
    starter: |
      Absichtssatz:
      Basis (Datei, Bilder, Dauern):

      Variante A (Datei, geänderte Größe, vorher → nachher, sonst gleich):
      Variante B (Datei, geänderte Größe, vorher → nachher, sonst gleich):

      Eigener Blick (vor dem Test):
      Test (wer, wann, X = …, Y = …, Reihenfolge):
      Antworten wörtlich:
      Gezielte Frage gestellt? Welche?
      Ergebnis:
    checklist:
      - Der Absichtssatz steht da und ist älter als die Basis.
      - Basis und beide Varianten liegen als eigene Dateien vor; die Basis ist unverändert.
      - Jede Variante nennt genau eine geänderte Größe und unter „sonst gleich“ alles andere.
      - Eine Variante ändert nur Dauern, keine Zeichnung.
      - Die Antworten stehen wörtlich da, oder die Selbstprüfung nach einer Nacht ist als solche markiert.
      - Du hast notiert, ob du eine gezielte Frage gestellt hast.
    explanation: |
      Die Studie übt das Vorgehen, nicht den perfekten Ball. Mit einer Basis und zwei sauberen Varianten kannst du jede Beobachtung einer Größe zuordnen. Die reine Timing-Variante zeigt dir, wie viel du ohne neue Zeichnung verändern kannst. Weicht eine Antwort von deinem Absichtssatz ab, ist das die wertvollste Zeile im Protokoll.
    resources:
      - title: Saint11 · A Basic Aseprite Animation, Timing
        url: https://saint11.art/pixel_art_articles/article3/#timing

  - id: studie-mehlsack
    type: practice
    title: "Studie 2: Mehlsack mit Hocke"
    prompt: |
      Zeichne einen Mehlsack von etwa 16 Pixeln Höhe, der einen kleinen Sprung macht oder aus geringer Höhe landet. Absichtssatz zuerst, dann die Basis. Bau zwei Varianten: eine ändert nur die Tiefe der Hocke (ein neu gezeichneter Key), eine nur eine Haltezeit (keine neue Zeichnung). Vergleiche alle drei nebeneinander, zeig sie als X, Y und Z und füll das Protokoll aus.
    lang: prose
    starter: |
      Absichtssatz:
      Basis (Datei, Bilder, Dauern, Höhe in px):

      Variante Hocke (Datei, was am Key geändert, sonst gleich):
      Variante Haltezeit (Datei, welches Bild, vorher → nachher ms):

      Eigener Blick:
      Test (wer, wann, Zuordnung X/Y/Z, Reihenfolge):
      Antworten wörtlich:
      Ergebnis:
    checklist:
      - Der Sack hat kein Gesicht und keine Gliedmaßen; alles, was er zeigt, kommt aus Form und Timing.
      - Die Variante Hocke ändert genau einen Key; alle anderen Bilder sind gleich.
      - Die Variante Haltezeit ändert genau eine Dauer und keine Zeichnung.
      - Die Fassungen wurden mit neutralen Namen gezeigt, und die Reihenfolge ist notiert.
      - Die Antworten stehen wörtlich da, oder die Selbstprüfung ist markiert.
    explanation: |
      Hocke und Haltezeit sind zwei verschiedene Wege, Ausholen zu zeigen: Form und Dauer. Getrennt variiert, siehst du, welcher von beiden bei deinem Zuschauer mehr bewegt. Der Sack zwingt dich, ohne Gesicht auszukommen; was er an Gewicht oder Mühe zeigt, steckt in Stauchung und Timing.
    resources:
      - title: Walt Disney Family Museum · Animating a Sack Drop
        url: https://www.waltdisney.org/education/workshops/studio-series-animating-sack-drop-adult-session

  - id: studie-pendel
    type: practice
    title: "Studie 3: Pendel mit Versatz"
    prompt: |
      Plane ein Pendel mit einem weichen Teil am Ende als Winkelliste, dann zeichne es. Die Basis hat einen Versatz von einem Bild. Bau zwei Varianten mit Versatz 0 und 2, ohne das Pendel selbst zu verändern. Spiel alle drei nebeneinander ab, prüf die Bögen mit Onion Skinning und zeig die Fassungen mindestens einem Menschen.
    lang: prose
    starter: |
      Absichtssatz (was ist das weiche Teil, wie soll es wirken):
      Winkelliste Pendel:
      Winkelliste Spitze, Versatz 1:
      Variante Versatz 0 (Datei):
      Variante Versatz 2 (Datei):
      Onion Skinning (Bogen der Spitze, Auffälligkeiten):
      Test (wer, wann, Zuordnung, Reihenfolge):
      Antworten wörtlich:
      Ergebnis:
    checklist:
      - Die Winkelliste stand vor der ersten Zeichnung fest.
      - Das Pendel ist in allen drei Fassungen Bild für Bild gleich; nur der Versatz unterscheidet sich.
      - In jeder Fassung mit Versatz erreicht die Spitze ihr Extrem nach dem Pendel, um genau so viele Bilder wie der Versatz.
      - Du hast den Bogen der Spitze mit Onion Skinning geprüft und notiert, ob ein Bild aus dem Bogen fällt.
      - Die Antworten stehen wörtlich da, oder die Selbstprüfung ist markiert.
    explanation: |
      Der Versatz ist die Größe, die Überlappung steuert. Mit einem festen Pendel als Träger misst du nur ihn. Die Winkelliste vorab verhindert, dass du beim Zeichnen den Versatz in einzelnen Bildern verlierst, wie im Fehlerbeispiel. Onion Skinning zeigt dir, ob die Spitze auf einem Bogen läuft oder an einer Stelle springt ([Bögen, Nachziehen und Überlappung](/animation/boegen-ueberlappung)).
    resources:
      - title: Wikipedia · Follow through and overlapping action
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Follow_through_and_overlapping_action
