id: testszene
title: "In der Testszene prüfen: Lesbarkeit und Übergänge"
level: 3
minutes: 150
summary: Wie dein Timing unverändert in Godot ankommt, wie ein Prüfstand deine Animationen im Spieltakt abspielt, anhält und jeden Bildwechsel mit Tick protokolliert, und wie du damit Lesbarkeit in Originalgröße, Übergänge und die Zeit bis zur erkennbaren Pose prüfst.
place: pc
goals:
  - Du rechnest Bilddauern aus deinem Editor in FPS und Frame-Dauer einer SpriteFrames-Ressource um, ohne das Timing zu verändern.
  - Du richtest den Prüfstand mit deinen eigenen Animationen ein und startest ihn mit fester Bildrate.
  - Du liest aus dem Log ab, wie viele Ticks nach einer Eingabe eine Pose erscheint und wie lange jedes Bild steht.
  - Du prüfst Lesbarkeit in Originalgröße vor drei Grautönen, in Bewegung und mit einem zweiten Menschen an der Tastatur.
  - Du prüfst jeden Übergang aus jedem Bild heraus und trennst Sprünge durch Export oder Ursprung von Zeichenfehlern.
