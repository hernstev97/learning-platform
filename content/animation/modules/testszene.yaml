lesson: |
  Im Editor sieht deine Animation fertig aus: 400 % Zoom, heller Grund, eine Schleife, die du so oft abspielst, wie du willst. Im Spiel ist vieles anders. Die Figur steht in Originalgröße vor einem Boden, die Aktion startet mitten aus dem Laufen, und nach ihrem letzten Bild springt die Figur in die Ruhe zurück, in welches Bild der Ruhe auch immer. Ob eine Bewegung dort lesbar ist und ob ihre Übergänge sitzen, siehst du erst im Spiel.

  Dieses Modul baut dafür einen Prüfstand in Godot 4.7: eine Szene, die deine Animationen im Spieltakt abspielt, anhält, Bild für Bild weiterschaltet und jeden Bildwechsel mit Tick ins Log schreibt. Das Skript ist technisches Gerüst. So etwas darf dir eine KI schreiben, und hier steht es fertig, geprüft mit Godot 4.7.2. Die Bilder, ihr Timing und jede Änderung, zu der dich der Prüfstand bringt, sind deine Arbeit.

  ## Vom Editor nach Godot: das Timing mitnehmen

  Zwischen Editor und Prüfstand liegen drei Schritte, und alle drei stehen in anderen Modulen: der Export als Sprite-Sheet oder Bildfolge in [Einzelbilder im Editor](/animation/editor-zeitleiste), der Import mit scharfem Filter und dem Ursprung an den Füßen in [Eigene Sprites importieren](/godot/sprites-importieren) und die SpriteFrames-Ressource mit FPS, Loop und Frame-Dauer in [Animationen zuordnen](/godot/animationen). Hier geht es nur um eine Frage: Kommt dein Timing unverändert an?

  Dein Editor speichert für jedes Bild eine Dauer in Millisekunden. Godot rechnet anders. Eine Animation hat eine Geschwindigkeit in FPS, jedes Bild einen Faktor namens Frame-Dauer, und ein Bild steht Faktor geteilt durch FPS Sekunden lang ([get_frame_duration](https://docs.godotengine.org/en/stable/classes/class_spriteframes.html#class-spriteframes-method-get-frame-duration)). Die Umrechnung geht ohne Rundung, wenn du den größten gemeinsamen Teiler deiner Dauern als Grundtakt nimmst:

  ```python run
  from math import gcd
  from functools import reduce

  # Bilddauern aus deinem Editor
  dauern_ms = [100, 50, 150, 300]

  basis = reduce(gcd, dauern_ms)
  fps = 1000 / basis
  faktoren = [d // basis for d in dauern_ms]
  print(f"FPS {fps:g}, Frame-Dauer {faktoren}")
  for d in dauern_ms:
      print(f"{d} ms = {d * 60 / 1000:g} Ticks")
  ```

  20 FPS mit den Faktoren 2, 1, 3 und 6 ergeben genau 100, 50, 150 und 300 ms. Die Zeilen darunter zeigen, wie viele Spieltakte zu 1/60 Sekunde jedes Bild steht. Sind es ganze Zahlen, steht das Bild in jedem Durchlauf gleich lang. Bei 80 ms wären es 4,8 Ticks, und das Bild stünde mal 4, mal 5 Takte; warum, steht in [Timing und Spacing](/animation/timing-spacing). Krumme Werte wie 83 und 167 ms ergeben einen Grundtakt von 1 ms und 1000 FPS. Hast du mit 83 ms „5 Ticks“ gemeint, trag lieber 12 FPS und den Faktor 1 ein.

  > [!TIP]
  > Schreib die Dauern aus dem Editor ins Prüfprotokoll, bevor du sie in Godot einträgst. Wirkt die Animation im Spiel anders als im Editor, vergleichst du zuerst diese Zahlen.

  ## Der Prüfstand: Szene und Skript

  Nimm ein Godot-Projekt mit scharfen Pixeln und ganzzahliger Skalierung, etwa das Testgelände aus dem Godot-Kurs oder die Testszene aus Combat. Die Einstellungen stehen in [Godot-Start](/combat/godot-start) und [Pixelraster und Skalierung](/godot/pixelraster); die Positionen unten gehen von einem Bild mit 320 × 180 Pixeln aus. Leg eine neue Szene mit drei Nodes an:

  ```text
  Pruefstand (Node2D)            pruefstand.gd
  ├── Figur (AnimatedSprite2D)   Position (160, 100)
  │                              Sprite Frames: deine .tres
  └── Info (Label)               Position (4, 2)
                                 Font Sizes 8
  ```

  Bei der Figur wählst du im Inspektor unter *Sprite Frames* deine SpriteFrames-Ressource. Beim Label stellst du unter *Theme Overrides → Font Sizes* (im deutschen Editor *Theme-Überschreibungen → Schriftgrößen*) die Größe auf 8, sonst ist der Text breiter als das Bild. Das Skript hängst du an `Pruefstand`:

  ```gdscript title=pruefstand.gd
  extends Node2D

  ## Prüfstand für eigene Animationen. Technisches Gerüst, keine Gestaltung:
  ## Die Bilder kommen aus deinem Editor. Namen, Tempo und Tasten sind Platzhalter.
  ##
  ## Pfeiltasten  gedrückt halten: Figur läuft, Animation "bewegung"
  ## Leertaste    Aktion einmal abspielen, danach zurück
  ## 1 bis 9      eine Animation direkt abspielen (alphabetisch)
  ## P            anhalten und weiter
  ## , und .      angehalten: ein Bild zurück und vor
  ## T            Zeitlupe 1 → 0,5 → 0,25
  ## H            Hintergrund dunkel → mittel → hell
  ## Z            Zoom 1× bis 4×, nur ganze Faktoren

  @export var ruhe := &"ruhe"
  @export var bewegung := &"bewegung"
  @export var aktion := &"aktion"
  @export var tempo := 40.0       ## Pixel pro Sekunde, Platzhalter
  @export var spiegeln := true    ## Blick nach links = gespiegelt

  const HINTERGRUENDE := [Color("#202020"), Color("#7f7f7f"), Color("#e0e0e0")]
  const ZEITLUPEN := [1.0, 0.5, 0.25]

  @onready var figur: AnimatedSprite2D = $Figur
  @onready var info: Label = $Info

  var _ziel := &""        # Zustand, den die Eingabe verlangt
  var _druck := -1        # Tick der letzten Eingabe, die den Zustand geändert hat
  var _wunsch := &""      # per Taste verlangte Animation, startet im nächsten Tick
  var _frei := false      # true: Animation per Zifferntaste gewählt
  var _angehalten := false
  var _gemeldet := ""
  var _hg := 0
  var _zl := 0
  var _zoom := 1


  func _ready() -> void:
  	if figur.sprite_frames == null:
  		print("Figur hat keine SpriteFrames. Im Inspektor unter Sprite Frames zuweisen.")
  		set_process(false)
  		set_physics_process(false)
  		set_process_unhandled_input(false)
  		return
  	figur.frame_changed.connect(_melden)
  	figur.animation_changed.connect(_melden)
  	figur.animation_finished.connect(_fertig)
  	for anim in [ruhe, bewegung, aktion]:
  		if not figur.sprite_frames.has_animation(anim):
  			print("Fehlt in SpriteFrames: ", anim)
  	if figur.sprite_frames.get_animation_loop_mode(aktion) != SpriteFrames.LOOP_NONE:
  		print("Hinweis: ", aktion, " wiederholt sich und endet nie. Loop ausschalten.")
  	RenderingServer.set_default_clear_color(HINTERGRUENDE[_hg])
  	_waehlen(Vector2.ZERO)
  	_melden()


  func _physics_process(delta: float) -> void:
  	if _angehalten:
  		return
  	if _wunsch != &"":
  		_ziel = _wunsch
  		_wunsch = &""
  		_druck = Engine.get_physics_frames()
  		figur.play(_ziel)
  		return
  	var richtung := Input.get_vector("ui_left", "ui_right", "ui_up", "ui_down")
  	if _frei and richtung == Vector2.ZERO:
  		return  # Per Zifferntaste gewählt: läuft, bis du dich bewegst.
  	_frei = false
  	if figur.animation == aktion and figur.is_playing():
  		return  # Die Aktion läuft zu Ende, die Figur steht so lange.
  	_waehlen(richtung)
  	if richtung != Vector2.ZERO:
  		var rand := get_viewport_rect().size
  		figur.position = (figur.position + richtung * tempo * delta).clamp(Vector2.ZERO, rand)
  		if spiegeln and richtung.x != 0.0:
  			figur.flip_h = richtung.x < 0.0


  func _waehlen(richtung: Vector2) -> void:
  	var ziel := bewegung if richtung != Vector2.ZERO else ruhe
  	if ziel != _ziel:
  		if _ziel != &"":  # Wechsel durch Eingabe, nicht durch das Ende der Aktion
  			_druck = Engine.get_physics_frames()
  		_ziel = ziel
  	if figur.animation != _ziel or not figur.is_playing():
  		figur.play(_ziel)


  func _fertig() -> void:
  	if figur.animation == aktion and not _frei:
  		_ziel = &""
  		_waehlen(Input.get_vector("ui_left", "ui_right", "ui_up", "ui_down"))


  func _unhandled_input(event: InputEvent) -> void:
  	if event.is_action_pressed("ui_accept"):
  		if not _angehalten and not (figur.animation == aktion and figur.is_playing()):
  			_frei = false
  			_wunsch = aktion
  		return
  	var key := event as InputEventKey
  	if key == null or not key.pressed or key.echo:
  		return
  	var taste := key.keycode
  	if taste >= KEY_1 and taste <= KEY_9 and not _angehalten:
  		var namen := figur.sprite_frames.get_animation_names()
  		var nummer := taste - KEY_1
  		if nummer < namen.size():
  			_frei = true
  			_wunsch = namen[nummer]
  	match taste:
  		KEY_P:
  			_angehalten = not _angehalten
  			if _angehalten:
  				figur.pause()
  			else:
  				figur.play()
  		KEY_COMMA, KEY_PERIOD:
  			if _angehalten:
  				var anzahl := figur.sprite_frames.get_frame_count(figur.animation)
  				var schritt := 1 if taste == KEY_PERIOD else -1
  				figur.set_frame_and_progress(wrapi(figur.frame + schritt, 0, anzahl), 0.0)
  		KEY_T:
  			_zl = (_zl + 1) % ZEITLUPEN.size()
  			Engine.time_scale = ZEITLUPEN[_zl]
  		KEY_H:
  			_hg = (_hg + 1) % HINTERGRUENDE.size()
  			RenderingServer.set_default_clear_color(HINTERGRUENDE[_hg])
  		KEY_Z:
  			_zoom = _zoom % 4 + 1
  			figur.scale = Vector2.ONE * _zoom


  func _process(_delta: float) -> void:
  	var frames := figur.sprite_frames
  	var anim := figur.animation
  	var ms := frames.get_frame_duration(anim, figur.frame) / frames.get_animation_speed(anim) * 1000.0
  	info.text = "%s %d/%d %d ms\n%s Zeit %.2f Zoom %d" % [
  		anim, figur.frame + 1, frames.get_frame_count(anim), roundi(ms),
  		"Pause" if _angehalten else "läuft", Engine.time_scale, _zoom]


  ## Schreibt jeden Bildwechsel mit Physik-Tick in die Ausgabe,
  ## dahinter die Ticks seit der letzten Eingabe, die den Zustand geändert hat.
  func _melden() -> void:
  	var zeile := "%s %d" % [figur.animation, figur.frame + 1]
  	if zeile == _gemeldet:
  		return
  	_gemeldet = zeile
  	var seit := "" if _druck < 0 else "  +%d" % (Engine.get_physics_frames() - _druck)
  	print("%5d  %s%s" % [Engine.get_physics_frames(), zeile, seit])
  ```

  Die drei Namen oben sind Platzhalter. Heißen deine Animationen anders, trägst du sie im Inspektor ein. Welche Zustände du überhaupt prüfst, entscheidest du. Das Skript erledigt vier Dinge:

  - **Zustände wählen.** `_physics_process` läuft 60-mal pro Sekunde ([Idle and Physics Processing](https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html)). Hältst du eine Pfeiltaste, spielt `bewegung`, sonst `ruhe`. Leertaste und Ziffern setzen einen Wunsch, den der nächste Tick erfüllt. So beginnen alle Wechsel an derselben Stelle im Takt, und die Zahlen im Log lassen sich vergleichen.
  - **Die Aktion zu Ende spielen.** Solange `aktion` läuft, wartet die Bewegung. Am Ende sendet das Sprite `animation_finished`, und `_fertig` wählt sofort Ruhe oder Bewegung. Das Signal kommt nur, wenn die Animation nicht wiederholt wird ([animation_finished](https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-signal-animation-finished)). Deshalb prüft `_ready` den Loop-Modus. Godot 4.7 kennt dafür drei Zustände, in diesem Kurs Aus, Wiederholen und Ping-Pong genannt ([LoopMode](https://docs.godotengine.org/en/stable/classes/class_spriteframes.html#enum-spriteframes-loopmode)). Im SpriteFrames-Panel ist das ein einziger Loop-Knopf, der bei jedem Klick weiterschaltet: aus, Wiederholen, Ping-Pong. Bei Ping-Pong wechselt nur sein Symbol, wer zweimal klickt, landet also unbemerkt dort. Die ältere Abfrage `get_animation_loop` liefert bei Ping-Pong `false` (geprüft mit 4.7.2) und würde diesen Fall übersehen.
  - **Beobachten.** P hält an, Komma und Punkt schalten Bild für Bild über `set_frame_and_progress` ([set_frame_and_progress](https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-method-set-frame-and-progress)), T stellt `Engine.time_scale` auf halbe oder Viertelgeschwindigkeit ([time_scale](https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-property-time-scale)); die Anzeige schreibt den Wert mit Dezimalpunkt, etwa `Zeit 0.50`, im Text steht er deutsch als 1,0, 0,5 und 0,25, H wechselt die Löschfarbe des Bildschirms ([set_default_clear_color](https://docs.godotengine.org/en/stable/classes/class_renderingserver.html#class-renderingserver-method-set-default-clear-color)), Z vergrößert die Figur um ganze Faktoren. Die Ziffern spielen eine Animation direkt ab, in alphabetischer Reihenfolge, so wie `get_animation_names` die Namen liefert ([get_animation_names](https://docs.godotengine.org/en/stable/classes/class_spriteframes.html#class-spriteframes-method-get-animation-names)).
  - **Messen.** Jeder Bildwechsel landet mit Tick im Log, dahinter die Ticks seit der letzten Eingabe, die den Zustand geändert hat. `play` mit einer neuen Animation sendet `frame_changed` nur, wenn sich die Bildnummer ändert. Deshalb hört `_melden` auch auf `animation_changed` und schreibt jede Zeile nur einmal.

  > [!WARNING] Der Prüfstand ist kein Spiel
  > Tempo, Spiegeln und „die Aktion läuft immer zu Ende“ sind Platzhalter, damit sich etwas bewegt. Ob eine Aktion in deinem Spiel abbrechbar ist und wie schnell die Figur läuft, sind Designentscheidungen. Sie gehören in [Animation im Spiel](/animation/animation-im-spiel) und [Anatomie eines Angriffs](/combat/angriffsphasen). Spiegeln passt nur zu Figuren, die links und rechts gleich aussehen dürfen ([Ansichten, Maßstab und große Kreaturen](/pixelart/ansichten-massstab)).

  ## Das Log lesen: Ticks seit der Eingabe

  Starte die Szene im Editor mit F6 (*Aktuelle Szene abspielen*). Für Läufe, die du wiederholen und vergleichen willst, startest du sie aus dem Terminal mit fester Bildrate. `--fixed-fps` schaltet die Synchronisation mit der echten Zeit ab, jeder Durchlauf rechnet dann genau eine 1/60 Sekunde ([Command line tutorial](https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html)):

  ```console
  $ godot --path . --fixed-fps 60 res://pruefstand.tscn
  ```

  Der folgende Lauf stammt aus Godot 4.7.2. Die Animationen sind Platzhalter aus Rechtecken: `ruhe` mit 2 Bildern zu je 250 ms, `bewegung` mit 4 Bildern zu je 83 ms, `aktion` mit 5 Bildern zu 83, 167, 83, 83 und 250 ms, Loop aus. Alle drei laufen mit 12 FPS, die Frame-Dauern sind 3, 3 bei `ruhe`, 1, 1, 1, 1 bei `bewegung` und 1, 2, 1, 1, 3 bei `aktion`. Ein kleines Skript hat die Tasten in festen Ticks gedrückt:

  ```text
  --- Pfeil rechts gedrückt
     40  bewegung 1  +0
     44  bewegung 2  +4
     49  bewegung 3  +9
     54  bewegung 4  +14
     59  bewegung 1  +19
  --- Pfeil rechts losgelassen
     62  ruhe 1  +0
     76  ruhe 2  +14
     91  ruhe 1  +29
  --- Leertaste
    101  aktion 1  +0
    105  aktion 2  +4
    115  aktion 3  +14
    120  aktion 4  +19
    125  aktion 5  +24
    140  ruhe 1  +39
  ```

  Die erste Spalte ist der Physik-Tick ([get_physics_frames](https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-method-get-physics-frames)), dann folgen Animation und Bild, gezählt ab 1, dann die Ticks seit der Eingabe. Drei Dinge liest du daraus ab.

  **Wann eine Pose erscheint.** Das dritte Bild der Aktion steht 14 Ticks nach dem Druck da, rund 233 ms. Ist das die Pose, an der man die Aktion erkennt, wartet ein Zuschauer so lange auf sie.

  **Wie lange jedes Bild steht.** Ab dem zweiten Bild stimmen die Abstände mit den Dauern überein: 10 Ticks für 167 ms, 5 für 83 ms, 15 für 250 ms. Das erste Bild nach jedem Wechsel steht einen Tick kürzer, 4 statt 5 und 14 statt 15. Godot rechnet die Animation im selben Durchlauf schon weiter, in dem sie startet: Nach dem Tick mit `play` zieht der Prozess-Schritt bereits eine 1/60 Sekunde ab. Bei einer Ausholpose, die nur ein Bild lang steht, ist das ein Fünftel ihrer Zeit. Wenn du das weißt, suchst du den fehlenden Tick nicht in deiner Zeichnung.

  **Wie Übergänge liegen.** In Tick 62 springt die Figur aus `bewegung 1` in `ruhe 1`. Hättest du in Tick 52 losgelassen, käme der Wechsel aus `bewegung 3`. Der Prüfstand schneidet hart, aus jedem Bild heraus. Welches Bild es war, zeigt dir das Log, wie es aussieht, zeigt dir die Pause.

  > [!NOTE] Messen mit Zeit 1,0
  > In Zeitlupe läuft der Physik-Takt weiter mit 60 Ticks pro echter Sekunde, die Animation aber langsamer ([Bildrate und Simulation](/godot/bildrate-simulation)). Im selben Lauf mit Zeit 0,5 steht das zweite Bild der Aktion 20 statt 10 Ticks. Zum Zusehen ist das gut, zum Messen nicht.

  ## Lesbarkeit prüfen: Originalgröße, Grund, Bewegung

  Im Editor arbeitest du vergrößert. Im Spiel sieht man die Figur so groß, wie das Spiel sie zeigt. Prüf jede Animation deshalb zuerst mit Zoom 1 in deiner Spielauflösung. Ob eine Bewegung wirkt, misst kein Programm. Deine Fragen sind trotzdem beobachtbar:

  - Erkennst du nach einem Durchlauf, was die Figur tut, ohne den Namen in der Anzeige zu lesen?
  - Bleibt die Silhouette vor dunklem, mittlerem und hellem Grund erkennbar (Taste H)? Verschwindet ein Arm vor einem der drei, ist das ein Befund für [Form und Proportionen halten](/animation/form-konstanz) oder für die Tonwerte deiner Palette ([Licht, Schatten und Tonwerte](/pixelart/licht-werte)).
  - Liest sich die Bewegung noch, während die Figur läuft? Was im Stand klar ist, kann in Bewegung untergehen.
  - Rutschen die Füße? Das hängt an Tempo und Schrittweg; die Rechnung steht in [Animationen zuordnen](/godot/animationen). Den Platzhalter `tempo` änderst du im Inspektor.

  Wie deine Figuren vor echten Level-Hintergründen bestehen, behandelt später der Kurs Leveldesign. Hier reichen drei neutrale Grautöne.

  Der wichtigste Test braucht einen zweiten Menschen. Gib die Tastatur ab, nenn nur die Tasten und frag nach ein paar Sekunden: „Was macht die Figur, wenn du die Leertaste drückst?“ Schreib die Antwort wörtlich auf und erklär nichts. Das ist der Beobachtungstest aus [Körpersprache und Zustandswechsel](/animation/koerpersprache), diesmal mit Steuerung: Der andere sieht die Aktion so, wie ein Spieler sie sieht, ausgelöst von seiner eigenen Hand.

  > [!PRAXIS] Früh ins Spiel, nicht erst am Ende
  > Bei Cuphead kamen nach der Schilderung von Jake Clark (Studio MDHR) zuerst die Extreme einer Animation ins Spiel. Das Team prüfte dort, wie viele Frames bis zu der Pose vergehen, die dem Spieler tatsächlich schadet, und zeichnete erst danach aus ([Cuphead's Animation Process and Philosophy, GDC 2017](https://www.youtube.com/watch?v=RmGb-jU3uVQ&t=1096s), ab 18:16). Bei Klei gingen grobe Lauf- und Angriffsanimationen früh an die Designer ([2D Animation at Klei Entertainment](https://www.youtube.com/watch?v=8_KBjd0iaCU&t=142s), ab 2:22). Für dich heißt das: Schon der Posentest mit nur den Keys gehört in den Prüfstand.

  ## Übergänge prüfen: der Moment des Schnitts

  Ein Übergang besteht aus dem letzten Bild vor dem Wechsel und dem ersten danach. Löse jeden Wechsel mehrmals aus, aus verschiedenen Bildern, und sieh ihn in Zeitlupe 0,25 an. Springt etwas, liest du im Log ab, aus welchem Bild der Wechsel kam. Dann spielst du beide Animationen mit den Ziffern an, hältst an und schaltest zu den beiden Bildern. Oder du legst sie im Editor mit Onion Skinning übereinander.

  | Wechsel | Woraus | Worauf du achtest |
  | --- | --- | --- |
  | Ruhe → Bewegung | jedes Bild der Ruhe | Springt die Figur in Höhe oder Breite? |
  | Bewegung → Ruhe | jedes Bild des Zyklus, auch Fuß in der Luft | Kommt die Figur an, oder ploppt sie in die Ruhe? |
  | → Aktion | aus Ruhe und aus Bewegung | Unterscheidet sich das erste Bild sichtbar von der Ruhe? |
  | Aktion → zurück | in Ruhe, mit gehaltener Pfeiltaste in Bewegung | Passt die letzte Pose zur ersten danach? |

  Drei Befunde kommen oft vor. **Ein Sprung um ein, zwei Pixel** ist oft kein Zeichenfehler. Häufig wandert der Ursprung zwischen den Animationen, etwa weil der Export leere Ränder je Animation abgeschnitten hat und die Bilder danach verschieden groß sind. Prüf zuerst Leinwand und Ursprung ([Eigene Sprites importieren](/godot/sprites-importieren)). **Volumen oder Proportion springt**, wenn die letzte Pose der einen Animation anders gezeichnet ist als die erste der nächsten ([Form und Proportionen halten](/animation/form-konstanz)). **Die Aktion verschluckt ihren Anfang**, wenn ihr erstes Bild aussieht wie die Ruhe: Der Spieler sieht dann vier Ticks lang nichts. Sakurai lässt seine Figuren deshalb ab dem Druck weit in die Ausholpose springen ([Making Lead-ins Instant and Impactful](https://www.youtube.com/watch?v=E8DKndKkHw8), ab 0:46).

  Was du daraus machst, entscheidest du: ein Übergangsbild, eine Ruhepose, die näher an der letzten Pose der Aktion liegt, ein Zyklus, der dort endet, wo die Ruhe beginnt, oder ein harter Schnitt, der so bleiben darf. Der Prüfstand schlägt nichts vor. Er hält den Moment fest, über den du entscheidest. Was du daraufhin änderst, ist eine **Korrektur nach dem Prüfstand**, keine dritte Überarbeitung der Werkstatt: Du darfst sie als neue Datei oder als Commit speichern und hältst sie im Prüfprotokoll unter Entscheidung und Ergebnis fest.

  ## Spieltempo, Eingabe und Ton im Protokoll

  Für jede Aktion trägst du drei Werte aus dem Log ins Prüfprotokoll ein:

  1. **Ticks bis zum ersten veränderten Bild.** Im Prüfstand immer +0, weil er ab dem Tick zählt, in dem der Wechsel beginnt, dem ersten nach dem Druck. Die Frage ist, ob man ihn sieht.
  2. **Ticks bis zur Pose, an der man die Aktion erkennt.** So lange wartet ein Zuschauer. Ob das zu deinem Spiel passt, klärst du mit [Animation im Spiel](/animation/animation-im-spiel).
  3. **Ticks bis zurück in Ruhe oder Bewegung.** Solange die Aktion läuft, gehorcht die Figur keiner Richtung. Im Beispiel sind das 39 Ticks, rund 650 ms.

  Den Ton markierst du nur. Welche Bilder tragen einen Schritt, einen Aufprall, ein Ausholen? Notier ihre Nummern. Wie Godot einen Ton an ein Bild hängt, steht in [Audio zuordnen](/godot/audio). Wie der Ton klingt, ist Stoff des späteren Kurses Sound.

  ```text
  Prüfprotokoll   Datum, Godot 4.7.2
  Animation       aktion, Fassung 3
  Zoom 1, Grund   dunkel / mittel / hell
  erstes Bild     +0, anders als ruhe? ja/nein
  Erkennungspose  Bild 3, +14 Ticks (233 ms)
  zurück          +39 Ticks (650 ms)
  Übergänge       bewegung → aktion: 1 px Sprung
  Ton-Bilder      3 (Aufprall)
  Beobachtung     „…“ (wörtlich, wer, wann)
  Entscheidung    …
  Ergebnis        … (neuer Lauf nach der Korrektur)
  ```

  > [!INTERVIEW]
  > „Deine Animation sieht im Editor gut aus und wirkt im Spiel falsch. Wie gehst du vor?“ Gute Antwort: Zuerst trenne ich Timing, Darstellung und Zeichnung. Ich vergleiche die Dauern aus dem Editor mit dem, was das Spiel zeigt, in einem Log mit festen Ticks. Dann sehe ich mir die Figur in Originalgröße vor dem Spielhintergrund an und am Übergang Bild für Bild. Erst wenn Timing und Darstellung stimmen, ändere ich Zeichnungen, eine Sache pro Durchgang, und prüfe danach neu.

  ## Häufige Fehler

  - **Nur im Editor beurteilt.** 400 % Zoom und weißer Grund zeigen Details, die im Spiel niemand sieht, und verstecken Probleme, die jeder sieht.
  - **In Zeitlupe gemessen.** Ticks aus einem Lauf mit Zeit 0,5 sind doppelt so lang. Gemessen wird mit Zeit 1,0, zugesehen in Zeitlupe.
  - **Loop an der Aktion.** Die Figur kehrt nie zurück. Der Prüfstand meldet das beim Start, auch bei Ping-Pong.
  - **Krumme Dauern übernommen.** 83 und 167 ms ergeben 1000 FPS und Faktoren wie 83 und 167. Gemeinte 5 Ticks trägst du als 12 FPS ein.
  - **Ein Sprung für einen Zeichenfehler gehalten.** Erst Leinwand und Ursprung prüfen, dann zeichnen.
  - **Zwei Dinge auf einmal geändert.** Nach jeder Änderung neu prüfen und protokollieren. Sonst weißt du nicht, welche gewirkt hat.
  - **Den Prüfstand als Urteil genommen.** Er misst und zeigt. Ob 650 ms zu lang sind, sagt er nicht.

  ## Zusammenfassung

  - Aus Millisekunden im Editor werden in Godot FPS und Frame-Dauer. Grundtakt ist der größte gemeinsame Teiler der Dauern, FPS = 1000 / Grundtakt.
  - Ganze Ticks pro Bild halten das Timing in jedem Durchlauf gleich.
  - Der Prüfstand spielt Ruhe, Bewegung und eine Aktion, hält an, schaltet Bild für Bild und schreibt jeden Bildwechsel mit Tick ins Log.
  - Im Prüfstand mit Godot 4.7.2 steht das erste Bild nach einem Wechsel einen Tick kürzer.
  - Lesbarkeit prüfst du in Originalgröße, vor drei Grautönen, in Bewegung und mit einem zweiten Menschen an der Tastatur.
  - Übergänge prüfst du aus jedem Bild heraus. Sprünge kommen oft von Export oder Ursprung statt von der Zeichnung.
  - Gemessen wird mit Zeit 1,0. Was du an deiner Animation änderst, entscheidest du.
exercises:
  - id: editor-oder-pruefstand
    type: choice
    title: Was erst der Prüfstand zeigt
    prompt: |
      Welche dieser Fragen beantwortet dir der Prüfstand, die Vorschau im Editor aber nicht?
    options:
      - text: Aus welchem Bild der Bewegung die Figur in die Ruhe wechselt, wenn du loslässt, und wie dieser Schnitt aussieht.
        correct: true
        why: Der Wechsel hängt am Moment deiner Eingabe. Im Editor spielt jede Animation für sich; den Schnitt zwischen zwei Animationen gibt es dort nicht.
      - text: Wie viele Ticks nach dem Druck die Pose erscheint, an der man die Aktion erkennt.
        correct: true
        why: Das Log zählt ab der Eingabe im Spieltakt. Der Editor kennt weder Eingabe noch Ticks.
      - text: Ob die Bewegung lesbar bleibt, während die Figur durch das Bild läuft.
        correct: true
        why: Im Prüfstand bewegt sich die Figur mit `tempo` über den Grund. In der Vorschau steht sie auf der Stelle.
      - text: Ob ein Zuschauer die Aktion als schwer empfindet.
        correct: false
        why: Das misst kein Programm. Dafür brauchst du den Beobachtungstest mit einem zweiten Menschen; der Prüfstand liefert nur die Gelegenheit dazu.
      - text: Ob die Hand in der Aktion auf einem sauberen Bogen läuft.
        correct: false
        why: Bögen prüfst du besser im Editor mit Onion Skinning, wo du alle Bilder übereinander siehst. Der Prüfstand zeigt immer nur ein Bild.
    explanation: |
      Der Editor zeigt jede Animation isoliert, vergrößert und in Schleife. Der Prüfstand zeigt, was nur im Spiel entsteht: Eingabe, Spieltakt, Wechsel zwischen Animationen und Bewegung über den Grund. Wirkung und Zeichenqualität bleiben bei dir und deinen Zuschauern.
    resources:
      - title: Godot Docs · AnimatedSprite2D
        url: https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html

  - id: pruefablauf
    type: order
    title: Erst messen, dann ändern
    prompt: |
      Bring die Schritte einer Prüfrunde in die Reihenfolge, in der du sie machst.
    lang: prose
    lines: |
      Bilddauern aus dem Editor in FPS und Frame-Dauer umrechnen
      SpriteFrames zuweisen und den Loop der Aktion ausschalten
      Den Prüfstand mit Zeit 1,0 und fester Bildrate starten
      Abweichungen im Log suchen, bevor du eine Zeichnung änderst
      Eine einzige Sache an der Animation ändern
      Neu prüfen und ins Protokoll schreiben
    explanation: |
      Die Umrechnung kommt zuerst, weil sonst schon die Zahlen im Spiel nicht stimmen. Ohne ausgeschalteten Loop endet die Aktion nie, und das Log zeigt keine Rückkehr. Gemessen wird mit Zeit 1,0, und erst wenn das Log keine technische Ursache zeigt, ändert eine Zeichnung etwas. Eine Änderung pro Runde hält das Ergebnis zuordenbar.
    resources:
      - title: Godot Docs · get_frame_duration
        url: https://docs.godotengine.org/en/stable/classes/class_spriteframes.html#class-spriteframes-method-get-frame-duration

  - id: millisekunden-bis-pose
    type: output
    title: Wie lange wartet der Zuschauer?
    prompt: |
      Aus dem Lauf der Lektion. Wie viele Millisekunden nach dem Druck erscheint das dritte Bild der Aktion? Ein Tick ist 1/60 Sekunde. Antworte mit einer ganzen Zahl.
    lang: text
    code: |
      --- Leertaste
        101  aktion 1  +0
        105  aktion 2  +4
        115  aktion 3  +14
        120  aktion 4  +19
    expected: |
      233
    accept:
      - 233 ms
      - "233,3"
      - "233.3"
      - 233,3 ms
      - 233.3 ms
    explanation: |
      Die letzte Spalte zählt die Ticks seit der Eingabe: +14. 14 × 1000 / 60 ≈ 233 ms. Wer 115 − 101 rechnet, kommt auf dasselbe, denn die Aktion beginnt im Tick 101. Wer 115 / 60 rechnet, misst ab dem Start des Spiels statt ab dem Druck.
    resources:
      - title: Godot Docs · Engine.get_physics_frames
        url: https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-method-get-physics-frames

  - id: fps-aus-millisekunden
    type: output
    title: Vom Editor in die SpriteFrames
    prompt: |
      Was gibt das Programm aus?
    lang: python
    code: |
      from math import gcd
      from functools import reduce

      dauern_ms = [120, 40, 80, 200]

      basis = reduce(gcd, dauern_ms)
      fps = 1000 / basis
      faktoren = [d // basis for d in dauern_ms]
      print(f"FPS {fps:g}, Frame-Dauer {faktoren}")
    expected: |
      FPS 25, Frame-Dauer [3, 1, 2, 5]
    hints:
      - Welche größte Zahl teilt 120, 40, 80 und 200 ohne Rest?
    explanation: |
      Der größte gemeinsame Teiler ist 40 ms, also 1000 / 40 = 25 FPS. Jedes Bild bekommt seine Dauer geteilt durch 40 als Faktor: 3, 1, 2 und 5. Probe: 3 / 25 s = 120 ms. Mit einem kleineren Grundtakt wie 20 ms ginge es auch (50 FPS, Faktoren 6, 2, 4, 10); der größte gemeinsame Teiler liefert nur die kleinsten ganzen Faktoren.
    resources:
      - title: Godot Docs · get_frame_duration
        url: https://docs.godotengine.org/en/stable/classes/class_spriteframes.html#class-spriteframes-method-get-frame-duration

  - id: zeitlupe-ticks
    type: output
    title: Ein Bild in Zeitlupe
    prompt: |
      Ein Bild der Aktion dauert 250 ms. Du hast mit T auf Zeit 0,5 gestellt. Wie viele Ticks liegen im Log zwischen diesem Bild und dem nächsten? Das Bild ist nicht das erste nach einem Wechsel. Antworte mit der Zahl.
    lang: text
    code: |
      Dauer        250 ms
      Zeit         0,5
      Physik-Takt  60 Ticks pro Sekunde
    expected: |
      30
    accept:
      - 30 Ticks
    explanation: |
      250 ms sind bei Zeit 1,0 genau 15 Ticks. `Engine.time_scale` halbiert die Spielzeit pro Tick, die Zahl der Ticks pro echter Sekunde bleibt 60. Die Animation braucht also doppelt so viele Ticks: 30. Im selben Lauf wie in der Lektion, nach T, steht dieses Bild ab Tick 270 und `ruhe` ab 300. Deshalb misst du mit Zeit 1,0 und siehst in Zeitlupe nur zu.
    resources:
      - title: Godot Docs · Engine.time_scale
        url: https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-property-time-scale

  - id: spriteframes-eintragen
    type: gap
    title: Vier Dauern, eine Animation
    prompt: |
      Im Editor hat deine Aktion vier Bilder mit 100, 100, 200 und 100 ms und läuft einmal ab. Trag die Werte für die SpriteFrames-Ressource in Godot ein, mit den kleinsten ganzen Faktoren.
    lang: text
    code: |
      Animation    aktion
      Geschwindigkeit  ⟦10⟧ FPS
      Loop         ⟦aus⟧
      Frame-Dauer  Bild 1: ⟦1⟧
                   Bild 2: ⟦1⟧
                   Bild 3: ⟦2⟧
                   Bild 4: ⟦1⟧
    gaps:
      - label: FPS
        hint: Der größte gemeinsame Teiler der Dauern ist der Grundtakt.
        accept: ["10.0"]
      - label: Loop
        hint: Die Aktion soll enden, damit der Prüfstand zurückkehrt.
        accept: ["Aus", "LOOP_NONE", "0", "nein", "Nein"]
      - label: Bild 1
        hint: Dauer geteilt durch den Grundtakt.
        accept: ["1.0"]
      - label: Bild 2
        hint: Gleich lang wie Bild 1.
        accept: ["1.0"]
      - label: Bild 3
        hint: Doppelt so lang wie der Grundtakt.
        accept: ["2.0"]
      - label: Bild 4
        hint: Wieder der Grundtakt.
        accept: ["1.0"]
    explanation: |
      Grundtakt 100 ms, also 10 FPS. Die Faktoren sind die Dauern geteilt durch 100: 1, 1, 2, 1. Der Loop muss aus sein, sonst sendet das Sprite nie `animation_finished`, und die Figur kehrt nicht zurück. Probe: Bild 3 steht 2 / 10 s = 200 ms, im Spiel 12 Ticks.
    resources:
      - title: Godot Docs · SpriteFrames LoopMode
        url: https://docs.godotengine.org/en/stable/classes/class_spriteframes.html#enum-spriteframes-loopmode

  - id: aktion-endet-nie
    type: bug
    title: Hin und her, ohne Ende
    prompt: |
      Nach der Leertaste spielt die Aktion vorwärts, dann rückwärts, dann wieder vorwärts und kehrt nie in die Ruhe zurück. Finde die Zeile in der SpriteFrames-Übersicht und korrigiere sie.
    lang: text
    code: |
      Animation  FPS  Loop          Bilder
      ruhe       12   Wiederholen   2
      bewegung   12   Wiederholen   4
      aktion     12   Ping-Pong     5
    lines: [4]
    fix:
      - line: 4
        answers:
          - aktion     12   Aus           5
          - aktion 12 aus 5
          - aktion 12 LOOP_NONE 5
    explanation: |
      Ping-Pong ist ein Loop-Modus: Die Animation läuft vor und zurück, ohne zu enden, und `animation_finished` kommt nie. Ruhe und Bewegung dürfen wiederholen, sie laufen, bis eine Eingabe sie ablöst. Eine Aktion, nach der die Figur zurückkehren soll, braucht Loop aus. Der Prüfstand meldet den Fall beim Start, weil er `get_animation_loop_mode` abfragt; `get_animation_loop` hätte bei Ping-Pong `false` geliefert.
    resources:
      - title: Godot Docs · animation_finished
        url: https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-signal-animation-finished

  - id: figur-springt-beim-wechsel
    type: bug
    title: Zwei Pixel nach oben
    prompt: |
      Beim Wechsel von `ruhe` zu `bewegung` springt die Figur zwei Pixel nach oben. Im Editor stehen beide Animationen auf derselben Leinwand an derselben Stelle, und in Zeitlupe sieht jedes Bild für sich richtig aus. Du hast jede Animation einzeln mit diesen Einstellungen exportiert. Finde die Zeile, die den Sprung verursacht.
    lang: text
    code: |
      Export        Sprite-Sheet, eine Zeile
      Leinwand      32 × 32, in beiden Animationen gleich
      Ränder        leere Ränder abschneiden
      Abstand       0 Pixel
      Skalierung    100 %
    lines: [3]
    explanation: |
      Schneidet der Export leere Ränder ab, hängt die Bildgröße davon ab, wo in jeder Animation gezeichnet wurde. Hat die Bewegung oben vier leere Zeilen mehr als die Ruhe, sind ihre Bilder vier Pixel niedriger. Godot zentriert jedes Bild auf denselben Punkt ([centered](https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-property-centered)), also stehen die Füße der Bewegung zwei Pixel höher, und beim Wechsel springt die Figur. Exportierst du mit voller Leinwand, liegt die Figur in jedem Bild an derselben Stelle. Erst wenn das ausgeschlossen ist, lohnt der Blick in die Zeichnungen.
    resources:
      - title: Godot Docs · 2D sprite animation
        url: https://docs.godotengine.org/en/stable/tutorials/2d/2d_sprite_animation.html

  - id: log-erklaeren
    type: explain
    title: Was das Log über den Wechsel sagt
    prompt: |
      Erkläre in wenigen Sätzen, was in den Ticks 62 und 140 passiert, warum das jeweils erste Bild nach einem Wechsel im Log einen Tick kürzer steht und wie lange die Aktion die Figur bindet.
    lang: text
    code: |
      --- Pfeil rechts losgelassen
         62  ruhe 1  +0
         76  ruhe 2  +14
         91  ruhe 1  +29
      --- Leertaste
        101  aktion 1  +0
        105  aktion 2  +4
        115  aktion 3  +14
        120  aktion 4  +19
        125  aktion 5  +24
        140  ruhe 1  +39
    points:
      - In Tick 62 wechselt die Figur hart aus dem gerade laufenden Bild der Bewegung in das erste Bild der Ruhe; ein anderer Zeitpunkt hätte aus einem anderen Bild geschnitten.
      - In Tick 140 endet die Aktion, `animation_finished` löst die Wahl aus, und die Ruhe beginnt ohne Pause.
      - Das erste Bild nach einem Wechsel steht einen Tick kürzer, weil Godot die Animation im Starttick schon um 1/60 Sekunde weiterrechnet.
      - Die Aktion bindet die Figur 39 Ticks, rund 650 ms; so lange gehorcht sie keiner Richtung.
    explanation: |
      Beim Loslassen in Tick 62 wählt `_waehlen` die Ruhe und startet sie sofort, egal in welchem Bild die Bewegung gerade war. Hier war es Bild 1, ein anderer Moment hätte ein anderes Bild getroffen. Deshalb prüfst du Übergänge aus jedem Bild. In Tick 140 ist das letzte Bild der Aktion abgelaufen, das Sprite sendet `animation_finished`, und `_fertig` startet die Ruhe im selben Durchlauf. Dass `ruhe 2` nach 14 statt 15 Ticks kommt und `aktion 2` nach 4 statt 5, liegt an Godot: Der Prozess-Schritt im Starttick rechnet schon eine 1/60 Sekunde ab. Von 101 bis 140 sind es 39 Ticks, in denen die Figur keiner Eingabe folgt; ob das zu deinem Spiel passt, entscheidest du.
    resources:
      - title: Godot Docs · animation_finished
        url: https://docs.godotengine.org/en/stable/classes/class_animatedsprite2d.html#class-animatedsprite2d-signal-animation-finished

  - id: pruefstand-einrichten
    type: practice
    title: Den Prüfstand in Betrieb nehmen
    prompt: |
      Richte den Prüfstand in deinem Godot-Projekt ein, mit Szene und Skript aus der Lektion. Hast du noch keine eigene Animation in Godot, nimm eine Studie aus [Neutrale Studien in Varianten](/animation/werkstatt-studien), etwa den Ball als `aktion`, und lege für `ruhe` und `bewegung` je eine Animation mit einem einzigen Bild an.

      Starte die Szene aus dem Terminal mit `--fixed-fps 60`, drück jede Taste einmal und kopier die ersten Zeilen des Logs hierher. Notier die Godot-Version.
    lang: text
    starter: |
      Godot-Version:
      SpriteFrames-Datei:
      Animationen (Name, Bilder, FPS, Loop):

      Log (erste Zeilen):

    solution: |
      Beispiel für die Form, mit den Platzhaltern der Lektion:

      Godot-Version: 4.7.2
      SpriteFrames-Datei: res://figur/platzhalter.tres
      Animationen:
        aktion    5 Bilder, 12 FPS, Loop aus
        bewegung  4 Bilder, 12 FPS, Wiederholen
        ruhe      2 Bilder, 12 FPS, Wiederholen

      Log:
          0  ruhe 1
         15  ruhe 2
         30  ruhe 1
      --- Pfeil rechts gedrückt
         40  bewegung 1  +0
         44  bewegung 2  +4
    checklist:
      - Die Szene hat die Nodes `Pruefstand`, `Figur` und `Info` mit dem Skript am obersten Node.
      - Beim Start erscheint kein Hinweis auf fehlende Animationen oder einen Loop an der Aktion.
      - Das Log zeigt nach der Leertaste die Aktion und danach die Rückkehr in Ruhe oder Bewegung.
      - P, Komma, Punkt, T, H und Z tun, was die Tabelle im Skript sagt.
      - Godot-Version und die Werte der SpriteFrames stehen in deiner Notiz.
    explanation: |
      Die erste Runde prüft das Werkzeug, nicht deine Animation. Erst wenn das Log Ruhe, Bewegung, Aktion und Rückkehr zeigt, kannst du Zahlen aus späteren Läufen vertrauen. Die Version gehört in jede Notiz, weil sich Verhalten wie der kürzere erste Tick mit einer neuen Godot-Version ändern kann.
    resources:
      - title: Godot Docs · Command line tutorial
        url: https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html

  - id: lesbarkeit-protokoll
    type: practice
    title: In Originalgröße und mit fremder Hand
    prompt: |
      Nimm Fassung 3 deiner eigenen Figur aus [Werkstatt: eine eigene Figur](/animation/werkstatt-figur). Prüf nur die Zustände, die es in deinem Satz gibt. Hast du nur diese eine Animation, leg `ruhe` als Animation mit einem Bild an, aus ihrer ersten oder letzten Zeichnung, oder nimm die Gliederpuppe aus dem Projekt [Zyklen und Zustandswechsel](/animation/projekte/zyklen-und-wechsel); ist deine Animation ein Zyklus, trag sie als `bewegung` ein. Prüf sie im Prüfstand mit Zoom 1 vor allen drei Gründen, im Stand und, wenn es eine Bewegung gibt, in Bewegung. Dann gib die Tastatur einem anderen Menschen, nenn nur die Tasten und frag nach ein paar Durchläufen: „Was macht die Figur, wenn du die Leertaste drückst?“ Schreib die Antwort wörtlich auf und füll das Prüfprotokoll aus. Ist niemand da, prüf nach einer Nacht Abstand selbst und markier das.

      Die KI-Regel gilt: Ändern wirst du die Animation selbst. Hier sammelst du nur Befunde.
    lang: prose
    starter: |
      Prüfprotokoll, Datum, Godot-Version:
      Animation und Fassung:
      Absichtssatz:
      Animationen im Satz (Name, Bilder):
      Zoom 1, dunkel / mittel / hell:
      In Bewegung (falls vorhanden):
      Erkennungspose (Bild, Ticks, ms):
      Zurück nach (Ticks, ms):
      Ton-Bilder:
      Beobachtungstest (wer, wörtlich):
      Abweichung vom Absichtssatz:
    checklist:
      - Du hast bei Zoom 1 vor allen drei Gründen geprüft und für jeden notiert, ob die Silhouette erkennbar bleibt.
      - Erkennungspose und Rückkehr stehen mit Ticks und Millisekunden aus dem Log da, gemessen mit Zeit 1,0.
      - Die Antwort des Zuschauers steht wörtlich da, oder die Selbstprüfung ist als solche markiert.
      - Du hast die Antwort mit deinem Absichtssatz verglichen und die Abweichung in einem Satz beschrieben, ohne sie schon zu bewerten.
      - Die Ton-Bilder sind mit Nummern markiert.
    explanation: |
      Das Protokoll trennt Messung, Beobachtung und Entscheidung. Messwerte kommen aus dem Log, die Wirkung kommt aus dem, was ein anderer Mensch sagt, und beides vergleichst du mit deiner Absicht. Eine einzelne Antwort ist kein Beweis, aber sie zeigt dir, wo du genauer hinsehen solltest. Die Entscheidung, was du änderst, triffst du in der nächsten Übung.
    resources:
      - title: Godot Docs · Engine.time_scale
        url: https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-property-time-scale

  - id: uebergaenge-pruefen
    type: practice
    title: Jeder Schnitt, aus jedem Bild
    prompt: |
      Prüf die Übergänge nach der Tabelle der Lektion, aber nur die, die es in deinem Satz gibt. Hast du nur eine Animation, leg `ruhe` als Animation mit einem Bild aus ihrer ersten oder letzten Zeichnung an und prüf den Einstieg in die Aktion und den Ausstieg aus ihr, oder nimm die Gliederpuppe aus dem Projekt [Zyklen und Zustandswechsel](/animation/projekte/zyklen-und-wechsel). Löse jeden Wechsel aus mehreren Bildern aus, sieh ihn in Zeitlupe 0,25 an und notier, aus welchem Bild er kam.

      Wähl einen Befund, entscheide selbst, was du änderst, und ändere genau diese eine Sache im Editor. Das ist eine Korrektur nach dem Prüfstand, keine dritte Überarbeitung: Speichere sie als neue Datei oder als Commit, halt sie im Prüfprotokoll unter Entscheidung und Ergebnis fest und prüf neu.
    lang: prose
    starter: |
      Animationen im Satz (Name, Bilder):
      Wechsel / aus Bild / Befund (nur, was es gibt):
      Ruhe → Bewegung:
      Bewegung → Ruhe:
      → Aktion:
      Aktion → zurück:

      Gewählter Befund:
      Ursache geprüft (Export, Ursprung, Zeichnung):
      Entscheidung (welche Bilder, vorher, nachher):
      Korrektur gespeichert als (Datei oder Commit):
      Ergebnis (neuer Lauf):
    checklist:
      - Für jeden Wechsel, den es in deinem Satz gibt, steht mindestens ein Ausgangsbild mit Befund oder „kein Sprung“; bei nur einer Animation sind das Einstieg und Ausstieg über eine Ruhe mit einem Bild.
      - Bei einem Sprung hast du Export und Ursprung geprüft, bevor du eine Zeichnung geändert hast.
      - Du hast genau eine Sache geändert und als neue Datei oder Commit gespeichert, die vorige bleibt erhalten.
      - Entscheidung und Ergebnis stehen im Prüfprotokoll, als Korrektur nach dem Prüfstand und nicht als dritte Überarbeitung.
      - Das Ergebnis stammt aus einem neuen Lauf im Prüfstand.
      - Die Änderung hast du selbst gezeichnet oder getimt; keine Bilder stammen aus einem Generator.
    explanation: |
      Übergänge sind die Stellen, an denen eine Animation im Spiel am häufigsten bricht, und sie gibt es im Editor nicht. Wer aus jedem Bild prüft, findet den einen Schnitt, der nur in einem von vier Fällen springt. Die Reihenfolge Export, Ursprung, Zeichnung spart Arbeit, weil die ersten beiden schneller zu prüfen sind und oft die Ursache sind. Eine Änderung pro Runde hält das Ergebnis zuordenbar. Die zwei Überarbeitungen der Werkstatt bleiben abgeschlossen; was du hier änderst, belegt das Prüfprotokoll als Korrektur.
