    url: https://www.youtube.com/watch?v=Ivwt37x-2EU
lesson: |
  Du willst, dass deine Gliederpuppe müde geht. Du nimmst den Gangzyklus aus [Gehen und Laufen](/animation/gehen-laufen) und verdoppelst jede Dauer. Eine Freundin sieht ihn dreimal und sagt: „Die schleicht sich an jemanden ran.“ Langsamer heißt nicht müde. Ein Zuschauer liest einen Zustand aus mehr als dem Tempo: aus Haltung, Kopf, Armen, Schrittlänge und daraus, wo eine Bewegung verweilt. Was er liest, erfährst du erst, wenn du ihn fragst, und zwar so, dass du ihm die Antwort nicht in den Mund legst.

  Diese Lektion zeigt, welche Größen sich ändern lassen, wenn dieselbe Bewegung einen anderen Zustand zeigen soll, wie du den Wechsel von einem Zustand in den nächsten lesbar machst und wie der **Beobachtungstest** funktioniert, auf den die anderen Module dieses Kurses verweisen. Haltung, Handlungslinie und Ausdruck im Standbild stehen in [Pose und Ausdruck](/pixelart/pose-ausdruck). Hier geht es um die zeitliche Seite.

  ## Dieselbe Bewegung, ein anderer Zustand

  Der Wikipedia-Artikel zum Gangzyklus, als schwach belegt markiert, nennt Gewicht, Gleichgewicht, Timing und Rhythmus als Größen, mit denen Animatoren eine Bewegung glaubhaft machen, und schreibt: „Changes in these elements can also make the same basic walk communicate different personalities, such as confidence, sadness, or excitement.“ ([Walk cycle](https://en.wikipedia.org/wiki/Walk_cycle)). Thomas und Johnston fassen das Ziel unter *Staging*: eine Idee, ob Handlung, Persönlichkeit, Ausdruck oder Stimmung, „completely and unmistakably clear“ zu zeigen ([Staging](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Staging)).

  Für eine Bewegung, die du schon hast, stehen dir diese Stellschrauben zur Verfügung:

  ```text
  Größe       Frage
  Tempo       Zyklus kurz/lang?
  Verweilen   Welche Pose steht?
  Haltung     Rumpf vor, aufrecht?
  Kopf        hoch, tief, vorn?
  Schritt     weit oder kurz?
  Arme        Ausschlag groß/klein?
  Auf und Ab  stark oder flach?
  ```

  Eine einzige Größe kann eine Lesart verschieben. Raymond Schlitter (Slynyrd) gibt zwei gehenden Figuren verschieden weite Armschwünge. Den engeren beschreibt er als absichtlich steif und geschäftsmäßig, den weiteren als beschwingt ([Pixelblog 50](https://www.slynyrd.com/blog/2024/5/24/pixelblog-50-human-walk-cycle)). Medeiros übertreibt beim Laufen von oben die Arme, „to make it more expressive“ ([Top Down Run](https://saint11.art/blog/pixel-art-tutorials/#TopDownRun)).

  Aus solchen Größen bauen Animatoren Konventionen: ein tiefer Kopf und kleine Schritte für Erschöpfung, Vorlage und weite Schritte für Eile. Konventionen sind keine Gesetze. Ein hängender Kopf kann als müde, traurig oder suchend gelesen werden, je nachdem, was der übrige Körper tut. Schreib deshalb jede Änderung als Hypothese auf. Ein Plan für zwei Fassungen desselben Gangs mit acht Bildern, je Schritt:

  ```text
  Absicht     A ruhig    B müde?
  Kontakt     100 ms     200 ms
  Tiefpunkt   100 ms     250 ms
  Passing     100 ms     100 ms
  Hochpunkt   100 ms      50 ms
  Schritt     400 ms     600 ms
  Kopf        0          −1 px
  Armschwung  2 px       1 px
  ```

  B unterscheidet sich in mehr als dem Tempo. B verweilt unten, in Kontakt und Tiefpunkt, und huscht über den Hochpunkt. Der Kopf sitzt tiefer, die Arme schwingen weniger. Das Fragezeichen hinter „müde“ bleibt stehen, bis jemand die Fassung gesehen hat.

  ### Wo eine Bewegung verweilt

  Das Verweilen sagt oft mehr als das Tempo. In Schlitters Ruhezyklus stehen die Bilder um den höchsten Punkt 100 ms und die des Absinkens 50 ms; er will so die Schwerkraft betonen ([Pixelblog 52](https://www.slynyrd.com/blog/2024/9/26/pixelblog-52-idle-fighting-stance)). Dreh das um, und die Figur hängt unten und kommt nur kurz hoch. Gerade der Ruhezyklus trägt Zustände. Schlitter nennt ihn „one of the most effective means of displaying personality“ (Pixelblog 52), Medeiros schlägt für die Ruhe kleine Zusatzanimationen vor wie Blinzeln, Gähnen, Umsehen und Kratzen ([Character Idle](https://saint11.art/blog/pixel-art-tutorials/#characterIdle)).

  > [!PRAXIS] Eine Größe, eine Absicht
  > Als Schlitter seiner Figur Schwert und Schild gab, verkleinerte er im Laufzyklus den Armschwung, damit die Ausrüstung Gewicht bekommt ([Pixelblog 58](https://www.slynyrd.com/blog/2025/10/2/pixelblog-58-top-down-character-animation-part-3)). Er ändert eine einzige Größe und sagt dazu, welche Lesart er beabsichtigt. So arbeitest du auch: eine Änderung, ein Absichtssatz, ein Test. Wer drei Größen auf einmal ändert, weiß hinterher nicht, welche gewirkt hat.

  ## Zustandswechsel lesbar machen

  Ein Zustandswechsel ist der Moment, in dem eine Figur von einem Zustand in den nächsten geht: Sie geht ruhig, hört etwas, bleibt stehen und horcht. Drei Dinge machen ihn lesbar.

  **Kontrast.** Die neue Pose muss sich deutlich von der alten unterscheiden, am besten schon in der Silhouette ([Silhouette und Formensprache](/pixelart/silhouette-formsprache)). Masahiro Sakurai lässt eine getroffene Figur sofort in eine extreme Schmerzpose springen, weit weg von der Ruhepose ([Damage Animations](https://www.youtube.com/watch?v=0xHE3ypX96U&t=12s), ab 0:12). Medeiros schreibt über das Getroffenwerden: „The first frame is the strongest“ ([Death](https://saint11.art/blog/pixel-art-tutorials/#Death)).

  **Haltezeit.** Die neue Pose muss lange genug stehen, damit das Auge sie liest. Ein Wechsel, der in einem Zwischenbild steckt und gleich weiterläuft, ist kein Wechsel, sondern ein Zucken.

  **Übergang.** Ein harter Schnitt in die neue Pose ist schnell, ein Übergangsbild zeigt den Weg. Oft geht dabei der Kopf voraus. Thomas und Johnston nennen auch den Blick, der einer Handlung vorausgeht, eine Antizipation ([Anticipation](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Anticipation)). Ein Plan für die horchende Puppe:

  ```text
  Bild  Dauer   Pose
   1–8  Zyklus  geht ruhig
   9    100 ms  Kopf dreht (Key)
  10    150 ms  Schritt stockt
  11    500 ms  steht, horcht (Key)
  12    300 ms  Ruhe: horchen
  ```

  Auch eine Bewegung, die abbricht, kann einen Wechsel zeigen. Medeiros' Figur steht nach einem Treffer langsam wieder auf und gibt auf halbem Weg auf: „Stop recover in the middle“, die Knie beugen sich, Arme und Kopf ziehen nach. Der Zuschauer sieht eine Richtung, die nicht zu Ende geht.

  Übergänge kosten im Spiel Zeit, in der die Figur nicht tut, was der Spieler will. Wann du sie dir leistest, klärt [Animation im Spiel](/animation/animation-im-spiel); dort steht auch, wie ein Studio nach Rückmeldungen Wendeanimationen ergänzte. Wie du einen Wechsel Bild für Bild im Spiel prüfst, zeigt [die Testszene](/animation/testszene).

  ## Kleine Figuren, kleine Unterschiede

  In Pixelart ist ein Zustand oft ein, zwei Pixel. Sakurai erklärt, dass Bewegungen kleiner oder weit entfernter Figuren winzig aussehen, und übertreibt deshalb (ab 1:20 und 2:04 in [Exaggerate to Make Up for Information Loss](https://www.youtube.com/watch?v=Ivwt37x-2EU&t=80s)). Steht die Kamera weit über der Figur, wie oft in Top-down-Spielen, ist sie klein im Bild. Eine Gliederpuppe von der Seite, 12 Pixel hoch: aufrecht (A), Kopf einen Pixel tiefer und einen vor (B), Kopf zwei Pixel tiefer und zwei vor, Schultern und Arme einen tiefer (C):

  ```text
  Bild A   Bild B   Bild C
  ..###..  .......  .......
  ..###..  ...###.  .......
  ..###..  ...###.  ....###
  ...#...  ...###.  ....###
  ...#...  ...#...  ....###
  ...##..  ...##..  ...#...
  ...#.#.  ...#.#.  ...##..
  ...#.#.  ...#.#.  ...#.#.
  ...#...  ...#...  ...#.#.
  ..#.#..  ..#.#..  ..#.#..
  ..#.#..  ..#.#..  ..#.#..
  ..#.#..  ..#.#..  ..#.#..
  ```

  Zwischen A und B liegt ein Pixel am Kopf. Ob jemand diesen Unterschied in Originalgröße bemerkt, ist eine Frage für den Test. Zeig im Zweifel zuerst die deutlichere Fassung C und geh zurück, wenn sie übertrieben gelesen wird. Was C bedeutet, müde, traurig oder suchend, sagt dir das Raster nicht.

  ## Der Beobachtungstest: fragen, ohne die Antwort vorzugeben

  Du kennst deine Absicht, und sie färbt alles, was du in deiner Animation siehst. Der Beobachtungstest zeigt, was jemand sieht, der sie nicht kennt. Er dauert wenige Minuten. Die Methode stammt aus Testlesen und Usability-Tests; Hintergrund, lautes Denken und Protokollformen stehen in [Testlesen und Playtest](/narrative/testlesen-playtest). Hier die Fassung für Animationen, auf die alle Module dieses Kurses verweisen.

  ### 1. Vorher: Absicht und Fragen aufschreiben

  Schreib den **Absichtssatz** auf, für dich: einen Satz, was ein Zuschauer lesen soll, etwa „Die Puppe ist müde und schleppt sich weiter“. Leg die Fragen vorher fest, denn spontan formulierte Fragen rutschen leicht ins Suggestive. Bereite das Material so vor, dass nichts die Absicht verrät: kein Dateiname wie `puppe-muede.gif` im Bild, kein Titel, keine Notiz daneben. Ein Daumenkino, ein GIF in einer Handy-App oder der Prüfstand am PC genügen.

  ### 2. Zeigen: ohne Vorrede, dreimal

  Sag nur: „Ich zeig dir eine kurze Animation.“ Kein Wort darüber, was sie zeigt oder was du wissen willst. Lass sie dreimal in Schleife laufen. Kommentier nicht, zeig auf nichts und verzieh keine Miene.

  ### 3. Fragen: offen zuerst, gezielt zuletzt

  Die erste Frage ist offen: „Was passiert da?“. Geht es um einen Zustand, folgt: „Wie fühlt sich die Figur?“. Beide geben keine Antwort vor. Erst ganz am Ende, wenn dein Kriterium es verlangt, kommt eine gezielte Frage, etwa „Was ist zwischen dem ersten und dem zweiten Teil anders?“. So färbt sie die früheren Antworten nicht.

  Eine suggestive Frage enthält die Antwort oder eine Auswahl davon:

  - „Siehst du, wie müde sie ist?“ gibt die Antwort vor und lässt nur Ja oder Nein.
  - „Ist sie müde oder traurig?“ gibt zwei Antworten vor.
  - „Ist das zu langsam?“ gibt Größe und Wertung vor.
  - „Gefällt es dir?“ fragt nach Gefallen, nicht nach dem, was gelesen wird.

  Amy Schade von der Nielsen Norman Group warnt: „Leading questions result in biased or false answers, as respondents are prone to simply mimic the words of the interviewer.“ ([Avoid Leading Questions](https://www.nngroup.com/articles/leading-questions/)). Wer „müde“ sagt, hört „müde“ zurück. Fragt die Testperson zurück („Was soll das sein?“), gib die Frage zurück: „Was meinst du?“.

  ### 4. Notieren: wörtlich

  Schreib die Antworten wörtlich auf, in Anführungszeichen, auch Zögern, Lachen und Rückfragen. Dazu Fassung, Datum, Initialen und ob die Person eine frühere Fassung kennt. Korrigier nicht, erklär nicht, verteidige nichts. Wer nach der ersten Antwort erklärt, was gemeint war, bekommt danach Antworten auf seine Erklärung, nicht auf die Animation. Deine Deutung kommt in eine eigene Zeile.

  ```text
  Beobachtungstest
  Fassung   puppe-gang-v2
  Datum     …
  Absicht   „Die Puppe ist müde
            und schleppt sich
            weiter.“
  Gezeigt   3× Schleife, Handy,
            ohne Dateinamen
  Person    J., kennt v1 nicht
  Frage 1   „Was passiert da?“
  Antwort   „Die geht spazieren,
            ganz langsam.“
  Frage 2   „Wie fühlt sich die
            Figur?“
  Antwort   „Hm. Gelangweilt?“
  Vergleich müde: nicht genannt
            langsam: genannt
  Nächstes  meine Entscheidung
  ```

  ### 5. Vergleichen: Abweichung ist Information

  Leg die Antworten neben den Absichtssatz: getroffen, teilweise, anders. Eine Abweichung ist keine Note für dich und kein Fehler der Testperson. Sie zeigt, was deine Animation tatsächlich erzählt. Frag dich danach selbst, was in den Bildern zu dieser Lesart führen könnte: Hier wurde das Tempo gelesen, die Haltung nicht.

  Eine einzelne Antwort ist kein Beleg. Sie zeigt eine Lesart. Erst wenn mehrere Personen unabhängig voneinander Ähnliches sagen, hast du ein Muster. Wer eine frühere Fassung gesehen hat, sieht die neue nicht mehr unbefangen; für jede neue Fassung brauchst du deshalb möglichst eine neue Person. Ist niemand da, prüf selbst nach mindestens einer Nacht Abstand und markiere die Notiz als „eigener Blick“. Das ist schwächer als ein fremder Blick, aber besser als keiner. Was du nach dem Test änderst, entscheidest du. Der Test sagt dir, was gelesen wurde, nicht, was du tun sollst.

  > [!MERKE] Der Beobachtungstest in fünf Schritten
  > Absichtssatz aufschreiben und für dich behalten. Ohne Vorrede dreimal in Schleife zeigen. Offen fragen, „Was passiert da?“, gezielt erst zuletzt. Wörtlich notieren, nichts erklären. Mit dem Absichtssatz vergleichen: Eine Antwort ist ein Hinweis, kein Beweis.

  > [!WARNING] Die Antwort steckt im Material
  > Ein Dateiname, ein Ordner mit dem Namen „müde“, ein Satz wie „Ich hab da was Trauriges gemacht“: Jeder Hinweis vor dem Zeigen ist eine suggestive Frage. Prüf das Material, bevor du es zeigst.

  > [!INTERVIEW]
  > „Wie prüfst du, ob eine Animation den Zustand zeigt, den du meinst?“ Gute Antwort: Ich schreibe vorher einen Absichtssatz und zeige die Animation dann jemandem, der sie nicht kennt, ohne Vorrede und in Schleife. Ich frage offen, was passiert, und erst danach gezielt. Die Antworten notiere ich wörtlich und vergleiche sie mit meiner Absicht. Weicht eine ab, frage ich mich, was in den Bildern dazu führt. Eine Antwort ist ein Hinweis; ein Muster brauche ich von mehreren Personen, und für jede neue Fassung möglichst neue Leute.

  ## Häufige Fehler

  - **Nur das Tempo geändert.** Langsamer liest sich als langsam, nicht als müde. Ändere, wo die Bewegung verweilt, Haltung, Kopf und Arme.
  - **Der Unterschied ist ein Pixel.** Bei kleinen Figuren geht er unter. Zeig zuerst die deutlichere Fassung.
  - **Die neue Pose huscht vorbei.** Ein Zustandswechsel braucht eine Haltezeit auf der neuen Pose.
  - **Konvention als Garantie.** „Hängender Kopf heißt traurig“ ist eine Hypothese. Prüf sie.
  - **Suggestivfrage.** „Wirkt sie müde?“ liefert „müde“. Frag „Was passiert da?“.
  - **Die Absicht im Material.** Dateiname, Titel oder eine Vorbemerkung verraten die Antwort.
  - **Gedeutet statt notiert.** „Fand es zu schwach“ ist deine Zusammenfassung. Notier, was gesagt wurde.
  - **Eine Antwort als Urteil.** Eine Person zeigt eine Lesart, kein Gesetz.

  ## Zusammenfassung

  - Dieselbe Bewegung zeigt andere Zustände über Tempo, Verweilen, Haltung, Kopf, Schrittlänge, Arme und Auf und Ab.
  - Konventionen wie der hängende Kopf sind Hypothesen. Jede Änderung bekommt einen Absichtssatz und einen Test.
  - Ein Zustandswechsel wird lesbar durch Kontrast der Posen, eine Haltezeit auf der neuen Pose und, wo nötig, ein Übergangsbild. Oft geht der Kopf voraus.
  - Bei kleinen Pixelfiguren sind Unterschiede schnell zu klein. Sakurai übertreibt, um das auszugleichen.
  - Der Beobachtungstest: Absichtssatz, ohne Vorrede dreimal zeigen, offen fragen, wörtlich notieren, vergleichen.
  - Eine suggestive Frage oder ein verräterischer Dateiname macht den Test wertlos.
  - Eine Abweichung ist Information. Eine Antwort ist kein Beleg, ein Muster braucht mehrere unbefangene Personen.
exercises:
  - id: muede-kandidaten
    type: choice
    title: Erster Versuch für „müde“
    prompt: |
      Du willst, dass ein Gang müde gelesen wird. Welche Änderungen sind sinnvolle Kandidaten für einen ersten Versuch, den du danach im Beobachtungstest prüfst?
    options:
      - text: Kontakt und Tiefpunkt länger halten, den Hochpunkt kürzer
        correct: true
        why: Die Bewegung verweilt dann unten. Das ändert, wo der Gang Zeit verbringt. Das Tempo allein täte das nicht.
      - text: Kopf und Schultern etwas tiefer, Armschwung kleiner
        correct: true
        why: Haltung und Armausschlag sind übliche Stellschrauben. Ob sie als müde gelesen werden, zeigt der Test.
      - text: Jede Dauer verdoppeln und sonst nichts ändern
        correct: false
        why: Das ändert nur das Tempo. Ein langsamer Gang kann als vorsichtig, schleichend oder gemütlich gelesen werden.
      - text: Gleichmäßig verteilte Zwischenbilder einfügen
        correct: false
        why: Gleichmäßig verteilte Bilder machen eine Bewegung flüssiger, aber sie ändern weder die Haltung noch, wo die Bewegung verweilt.
      - text: Die Datei „puppe-muede“ nennen, damit der Zuschauer weiß, worauf er achten soll
        correct: false
        why: Damit gibst du die Antwort vor, und der Test misst nur noch, ob jemand lesen kann.
    explanation: |
      Ein Zustand zeigt sich in mehreren Größen gleichzeitig: wo die Bewegung verweilt, wie der Körper sich hält, wie weit die Arme schwingen. Nur das Tempo zu ändern, lässt viele Lesarten offen. Keine dieser Änderungen garantiert „müde“. Sie sind Kandidaten, und welcher funktioniert, zeigt erst ein Zuschauer, der die Absicht nicht kennt.
    resources:
      - title: Wikipedia · Walk cycle
        url: https://en.wikipedia.org/wiki/Walk_cycle

  - id: testablauf
    type: order
    title: Ein Test von vorn bis hinten
    prompt: |
      Bring die Schritte eines Beobachtungstests in die richtige Reihenfolge.
    lang: prose
    lines: |
      Absichtssatz und Fragen aufschreiben, ohne sie zu zeigen.
      Material prüfen: kein Dateiname, kein Titel, der die Absicht verrät.
      Ohne Vorrede sagen, dass du eine kurze Animation zeigst.
      Die Animation dreimal in Schleife zeigen.
      Fragen: „Was passiert da?“
      Antwort wörtlich notieren, ohne zu erklären.
      Zuletzt die gezielte Frage stellen, falls dein Kriterium sie braucht.
      Antworten mit dem Absichtssatz vergleichen und selbst entscheiden, was sich ändert.
    alternatives:
      - [2, 1, 3, 4, 5, 6, 7, 8]
    explanation: |
      Absicht und Fragen stehen vorher fest, damit du sie nicht unter dem Eindruck der ersten Reaktion umformulierst. Das Material kommt vor dem Zeigen dran, weil ein verräterischer Dateiname nicht mehr zurückzunehmen ist. Die offene Frage kommt vor der gezielten, damit diese die erste Antwort nicht färbt. Verglichen und entschieden wird erst danach und allein.
    resources:
      - title: Kara Pernice · Talking with Users in a Usability Test (NN/g)
        url: https://www.nngroup.com/articles/talking-to-users/

  - id: neutrale-fragen
    type: choice
    title: Welche Frage ist neutral?
    prompt: |
      Du zeigst eine Animation, in der eine Gliederpuppe stehen bleibt und horcht. Welche Fragen geben keine Antwort vor?
    options:
      - text: „Was passiert da?“
        correct: true
        why: Offen, ohne Wertung und ohne Begriff, den die Person übernehmen könnte.
      - text: „Wie fühlt sich die Figur?“
        correct: true
        why: Sie fragt nach dem Zustand, ohne einen zu nennen. Sie setzt nur voraus, dass die Figur etwas fühlt, deshalb kommt sie nach der ersten Frage.
      - text: „Siehst du, wie sie aufhorcht?“
        correct: false
        why: Die Antwort steckt in der Frage, und es bleibt nur Ja oder Nein.
      - text: „Ist sie erschrocken oder neugierig?“
        correct: false
        why: Zwei vorgegebene Antworten. Wer etwas Drittes gesehen hat, sagt es dann oft nicht.
      - text: „Ist der Halt zu kurz?“
        correct: false
        why: Die Frage nennt die Stelle und unterstellt ein Problem. Ob jemandem der Halt überhaupt auffällt, erfährst du so nicht.
    explanation: |
      Neutral ist eine Frage, die weder eine Antwort noch eine Wertung enthält. Laut Amy Schade (Nielsen Norman Group) übernehmen Befragte oft die Wörter der Fragenden; deshalb liefern suggestive Fragen verzerrte Antworten. Fang mit „Was passiert da?“ an, frag dann nach dem Zustand und stell gezielte Fragen ganz zum Schluss.
    resources:
      - title: Amy Schade · Avoid Leading Questions (NN/g)
        url: https://www.nngroup.com/articles/leading-questions/

  - id: zeit-bis-pose
    type: output
    title: Wann steht die neue Pose?
    prompt: |
      Die Puppe geht und bleibt dann horchend stehen. Wie viele Millisekunden vergehen vom Beginn von Bild 9 bis zu dem Moment, in dem die Pose „steht, horcht“ erscheint? Antworte mit der Zahl.
    lang: text
    code: |
      Bild  Dauer   Pose
       9    100 ms  Kopf dreht (Key)
      10    150 ms  Schritt stockt
      11    500 ms  steht, horcht (Key)
      12    300 ms  Ruhe: horchen
    expected: |
      250
    accept:
      - 250 ms
    explanation: |
      Bild 9 steht 100 ms, Bild 10 150 ms, danach erscheint Bild 11: 100 + 150 = 250 ms. Die 500 ms von Bild 11 zählen nicht mit, sie sind die Haltezeit auf der neuen Pose. Beide Zahlen sind für die Lesbarkeit wichtig: wie schnell der Wechsel kommt und wie lange die neue Pose danach steht.

  - id: kopf-tiefer
    type: output
    title: Wie viel tiefer?
    prompt: |
      Um wie viele Pixel liegt die Oberkante des Kopfes in Bild C tiefer als in Bild A? Antworte mit der Zahl.
    lang: text
    code: |
      Bild A   Bild C
      ..###..  .......
      ..###..  .......
      ..###..  ....###
      ...#...  ....###
      ...#...  ....###
      ...##..  ...#...
      ...#.#.  ...##..
      ...#.#.  ...#.#.
      ...#...  ...#.#.
      ..#.#..  ..#.#..
      ..#.#..  ..#.#..
      ..#.#..  ..#.#..
    expected: |
      2
    accept:
      - 2 px
      - 2 Pixel
    explanation: |
      In A beginnt der Kopf in der ersten Reihe, in C in der dritten: zwei Pixel tiefer, dazu zwei Pixel nach vorn. Bei einer 12 Pixel hohen Figur sind zwei Pixel ein Sechstel der Höhe. Wie viel davon in Originalgröße auffällt, entscheidet kein Raster, sondern ein Test mit jemandem, der die Fassungen nicht kennt.
    resources:
      - title: Masahiro Sakurai · Exaggerate to Make Up for Information Loss (ab 1:20)
        url: https://www.youtube.com/watch?v=Ivwt37x-2EU&t=80s

  - id: test-begriffe
    type: gap
    title: Fünf Wörter für den Test
    prompt: |
      Ergänze die fehlenden Wörter.
    lang: prose
    code: |
      Vor dem Test schreibst du einen ⟦Absichtssatz⟧: was ein Zuschauer lesen soll.
      Die Antworten notierst du ⟦wörtlich⟧, ohne sie zusammenzufassen.
      Eine Frage, die die Antwort vorgibt, ist ⟦suggestiv⟧.
      Eine einzelne Antwort ist ein Hinweis, kein ⟦Beweis⟧.
      Sagen mehrere unbefangene Personen Ähnliches, hast du ein ⟦Muster⟧.
    gaps:
      - label: Vorher
        hint: Ein Satz, den du für dich behältst.
      - label: Wie notieren?
        hint: Genau so, wie es gesagt wurde.
        accept: ["wortwörtlich", "im Wortlaut"]
      - label: Art der Frage
        hint: Auf Englisch leading.
        accept: ["suggestiv gestellt", "eine Suggestivfrage", "führend"]
      - label: Was eine Antwort nicht ist
        hint: Ein Wort aus dem Gericht.
        accept: ["Beleg"]
      - label: Mehrere Antworten
        hint: Etwas, das sich wiederholt.
        accept: ["Befund"]
    explanation: |
      Der Absichtssatz ist dein Maßstab, die wörtliche Notiz dein Material. Suggestive Fragen verfälschen das Material, bevor du es hast. Eine Antwort zeigt eine Lesart; erst mehrere unbefangene Personen ergeben ein Muster, nach dem du eine Änderung begründen kannst.
    resources:
      - title: "Jakob Nielsen · Thinking Aloud: The #1 Usability Tool (NN/g)"
        url: https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/

  - id: skript-mit-vorgabe
    type: bug
    title: Alle sagen „müde“
    prompt: |
      Nach deinem Test sagen alle drei Personen „müde“. Ein Freund wiederholt den Test mit drei anderen Personen, aber ohne dein Skript, und niemand sagt „müde“. Finde die Zeile im Skript, die die Ergebnisse verzerrt.
    lang: prose
    code: |
      Ich zeig dir eine kurze Animation, dreimal hintereinander.
      (Die Animation läuft dreimal in Schleife.)
      Was passiert da?
      Siehst du, wie müde die Puppe ist?
      Was ist dir sonst noch aufgefallen?
    lines: [4]
    explanation: |
      Die vierte Zeile enthält die Antwort. Wer sie hört, übernimmt das Wort „müde“, ob er es vorher gesehen hat oder nicht. Die anderen Zeilen sind neutral: Die Ansage verrät nichts, „Was passiert da?“ und „Was ist dir sonst noch aufgefallen?“ sind offen. Neutral wäre an der Stelle „Wie fühlt sich die Figur?“, nach der offenen Frage gestellt.
    resources:
      - title: Amy Schade · Avoid Leading Questions (NN/g)
        url: https://www.nngroup.com/articles/leading-questions/

  - id: protokoll-pruefen
    type: bug
    title: Zwei Zeilen zu viel gedeutet
    prompt: |
      Dieses Protokoll soll später zeigen, was eine Person gesehen hat. Zwei Zeilen verletzen die Regeln des Beobachtungstests. Finde sie.
    lang: prose
    code: |
      Fassung: kiste-wurf-v3
      Absicht: Die Puppe wirft die schwere Kiste mit aller Kraft.
      Person: M., hat keine frühere Fassung gesehen.
      Frage: Was passiert da?
      Antwort: Sie fand den Wurf zu schwach.
      Vergleich: Kraft nicht genannt, schwer nicht genannt.
      Ergebnis: Die Antizipation ist zu kurz, das ist damit bewiesen.
    lines: [5, 7]
    explanation: |
      Zeile 5 ist keine wörtliche Antwort, sondern deine Zusammenfassung; was M. gesagt hat, lässt sich später nicht mehr nachlesen. Zeile 7 macht aus einer Antwort einen Beweis und nennt gleich die Ursache. Eine Person zeigt eine Lesart, und warum sie so liest, ist deine Vermutung, die in einer eigenen Zeile als Vermutung stehen darf. Die übrigen Zeilen halten fest, was du vorher wolltest und was passiert ist.
    resources:
      - title: "Jakob Nielsen · Thinking Aloud: The #1 Usability Tool (NN/g)"
        url: https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/

  - id: sturz-erklaeren
    type: explain
    title: Erholen und aufgeben
    prompt: |
      Pedro Medeiros zeigt in seinem Tutorial „Death / Take Hit“, wie eine Figur getroffen wird, sich erholen will und aufgibt. Erkläre in wenigen Sätzen, wodurch die Wechsel zwischen diesen Zuständen lesbar werden.
    lang: text
    code: |
      Saint11, Death / Take Hit
      Impact   The first frame is
               the strongest
      Recover  Slowly get back to
               idle position
      Give up  Stop recover in the
               middle, bend the
               knees, arms and head
               lag behind
      Hit      Overshoot ground
      ground   (+1 pixel down),
               arm bounce, rest
    points:
      - Das erste Bild des Treffers ist die stärkste Pose, der Kontrast zur Ruhe macht den Wechsel sofort sichtbar.
      - Die Erholung ist langsam und hat eine Richtung, zurück zur Ruhe.
      - Das Aufgeben zeigt sich daran, dass diese Richtung mitten im Weg abbricht und die Knie nachgeben.
      - Arme und Kopf kommen später als der Rumpf und zeigen so, dass der Rumpf die Bewegung führt.
      - Der Aufprall endet mit Überschwingen und einer Ruhe, der neue Zustand steht.
    explanation: |
      Jeder Wechsel bekommt etwas, woran das Auge ihn festmacht. Der Treffer kommt mit der stärksten Pose im ersten Bild, also mit maximalem Kontrast. Die Erholung baut eine Erwartung auf, weil sie langsam in eine Richtung läuft, und genau diese Erwartung bricht das Aufgeben, wenn die Bewegung auf halbem Weg kippt. Nachziehende Arme und Kopf zeigen, dass der Rumpf führt. Das Ende mit Überschwingen und Ruhe gibt dem neuen Zustand eine Haltezeit. Ob das bei Medeiros' Zuschauern so gelesen wird, sagt das Tutorial nicht; es beschreibt, was er zeichnet.
    resources:
      - title: Saint11 · Death / Take Hit
        url: https://saint11.art/blog/pixel-art-tutorials/#Death

  - id: zwei-zustaende
    type: practice
    title: Eine Puppe, zwei Zustände
    prompt: |
      Zeichne auf Papier einen Gang einer Gliederpuppe mit vier bis acht Bildern in zwei Zuständen. Die Zustände wählst du, etwa eilig und vorsichtig, oder zwei eigene. Schreib für jede Fassung einen Absichtssatz und eine Liste der Größen, die du änderst. Bau beide als Daumenkino und zeig sie im Beobachtungstest mindestens einer Person, die sie nicht kennt, in zufälliger Reihenfolge. Ist niemand da, prüf nach einer Nacht selbst und markier das.
    lang: prose
    starter: |
      Zustand A, Absichtssatz:
      Zustand B, Absichtssatz:
      Geänderte Größen (A → B):
      Bildliste B (Bild, Dauer, Pose):
      Person, kennt die Fassungen? (ja/nein):
      Antworten zu A (wörtlich):
      Antworten zu B (wörtlich):
      Vergleich mit der Absicht:
    checklist:
      - Beide Fassungen zeigen dieselbe Bewegung mit derselben Bildzahl.
      - Die geänderten Größen sind einzeln aufgelistet, und es ist mehr als nur das Tempo.
      - Für jede Fassung stand der Absichtssatz vor dem Test fest.
      - Die Fragen waren „Was passiert da?“ und „Wie fühlt sich die Figur?“, und die Antworten stehen wörtlich da.
      - Du hast notiert, wo eine Antwort abweicht, ohne daraus eine Regel zu machen.
      - Ein eigener Blick ist als solcher markiert.
    explanation: |
      Die Übung verbindet beide Hälften des Moduls: Stellschrauben bewusst ändern und prüfen, was davon ankommt. Weil die Bewegung gleich bleibt, kannst du Unterschiede in den Antworten deinen Änderungen zuordnen. Wenn nur das Tempo gelesen wird, weißt du, welche Größe du als Nächstes verstärkst. Eine Person liefert eine Lesart; für ein Muster wiederholst du den Test mit weiteren.
    resources:
      - title: Wikipedia · Walk cycle
        url: https://en.wikipedia.org/wiki/Walk_cycle

  - id: wechsel-planen
    type: practice
    title: Die Puppe horcht auf
    prompt: |
      Plan einen Zustandswechsel: Eine Gliederpuppe geht ruhig, hört etwas und bleibt horchend stehen. Zeichne Thumbnails der Keys auf Papier und schreib eine Bildliste mit Dauern. Leg fest, in welchem Bild der Wechsel zum ersten Mal sichtbar wird, welche Pose den neuen Zustand zeigt und wie lange sie steht. Teste den Wechsel mit „Was passiert da?“.
    lang: prose
    starter: |
      Absichtssatz:
      Keys (Bild, Pose):
      Bildliste (Bild, Dauer, Pose):
      Erstes Bild mit sichtbarem Wechsel:
      Neue Pose, Haltezeit:
      Antwort (wörtlich, wer):
      Vergleich mit der Absicht:
    checklist:
      - Die Bildliste nennt das Bild, in dem der Wechsel beginnt, und eine Haltezeit für die neue Pose.
      - Die neue Pose unterscheidet sich von der Gangpose schon in der Silhouette, nicht erst in einem Detail.
      - Du hast entschieden und notiert, ob ein Übergangsbild zwischen Gang und neuer Pose steht.
      - Die Antwort steht wörtlich da, und du hast sie mit dem Absichtssatz verglichen.
    explanation: |
      Ein Wechsel braucht einen Anfang, eine neue Pose und Zeit auf dieser Pose. Wer das in der Bildliste festlegt, prüft im Test nicht mehr „irgendwie“, sondern eine konkrete Annahme: Ab Bild 9 sieht man es, ab Bild 11 steht es. Weicht die Antwort ab, siehst du an der Liste, wo du ansetzt, etwa beim Kontrast der Pose oder bei ihrer Haltezeit.
    resources:
      - title: Wikipedia · Twelve basic principles, Staging
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Staging

  - id: fragen-vorbereiten
    type: practice
    title: Dein Testzettel
    prompt: |
      Bereite den Zettel für deinen nächsten Beobachtungstest vor, zu einer Studie, die du schon hast. Schreib den Absichtssatz, die Ansage vor dem Zeigen, die offene Frage, die Frage nach dem Zustand und, falls nötig, eine gezielte Frage für den Schluss. Prüf jede Frage: Enthält sie ein Wort aus deinem Absichtssatz?
    lang: prose
    starter: |
      Studie und Fassung:
      Absichtssatz (nur für mich):
      Ansage:
      Frage 1:
      Frage 2:
      Gezielte Frage zuletzt:
      Wörter aus dem Absichtssatz in den Fragen:
      Material ohne verräterischen Namen? (ja/nein):
    checklist:
      - Keine Frage und nicht die Ansage enthält ein Wort aus deinem Absichtssatz.
      - Keine Frage lässt sich nur mit Ja oder Nein beantworten, außer der gezielten am Schluss.
      - Keine Frage bietet zwei Antworten zur Auswahl an.
      - Du hast notiert, wie du Dateiname und Titel versteckst.
    explanation: |
      Die meisten Fehler eines Beobachtungstests passieren vor dem Zeigen. Ein Wort aus dem Absichtssatz in der Frage reicht, damit die Testperson es zurückgibt. Wer den Zettel vorher schreibt und prüft, muss im Gespräch nichts improvisieren. Denselben Zettel kannst du für jede Fassung wieder benutzen, nur die Person sollte neu sein.
    resources:
      - title: Amy Schade · Avoid Leading Questions (NN/g)
        url: https://www.nngroup.com/articles/leading-questions/
