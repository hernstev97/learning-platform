id: koerpersprache
title: Körpersprache in Bewegung und lesbare Zustandswechsel
level: 2
minutes: 120
summary: Welche Größen sich ändern, wenn dieselbe Bewegung einen anderen Zustand zeigen soll, wie du einen Zustandswechsel mit Kontrast, Haltezeit und Übergang lesbar machst und wie der Beobachtungstest zeigt, was andere darin erkennen, ohne dass du die Antwort vorgibst.
place: unterwegs
goals:
  - Du nennst die Größen, die sich zwischen zwei Zuständen derselben Bewegung ändern lassen, und formulierst eine Änderung als Hypothese statt als Garantie.
  - Du planst einen Zustandswechsel mit deutlichem Posenkontrast, ausreichender Haltezeit und, wo nötig, einem Übergangsbild.
  - Du schätzt ab, ob ein Unterschied von ein, zwei Pixeln bei deiner Figurengröße groß genug für einen Test ist.
  - Du führst einen Beobachtungstest durch, vom Absichtssatz über die Vorführung ohne Vorrede bis zum wörtlichen Protokoll.
  - Du erkennst Fragen, die eine Antwort vorgeben, und formulierst sie offen und neutral.
  - Du wertest eine Abweichung vom Absichtssatz als Information und ziehst aus einer einzelnen Antwort keinen Schluss.
