id: beobachten-schluesselposen
title: Bewegung beobachten und in Schlüsselposen zerlegen
level: 1
minutes: 110
summary: Warum du Bewegungen filmst, statt sie dir auszudenken, wie du eine Aufnahme Bild für Bild liest und in Keys, Extreme, Breakdowns und Zwischenbilder zerlegst und wie du daraus einen Plan aus wenigen Strichfiguren machst.
place: unterwegs
goals:
  - Du filmst eine Referenz mit dem Handy, gehst sie Bild für Bild durch und rechnest gezählte Videobilder in Millisekunden um.
  - Du unterscheidest Schlüsselpose (Key), Extrem, Breakdown und Zwischenbild und findest sie in einer Bildliste oder Fotoserie.
  - Du entscheidest begründet, wann Pose-to-Pose und wann Straight Ahead passt.
  - Du planst eine Bewegung als drei bis sechs Thumbnails mit Handlungslinie, Bildnummern und Dauern.
  - Du nutzt eine Referenz als Beleg für Timing und Posen, ohne sie abzupausen.
