lesson: |
  Du zeichnest eine Gliederpuppe, die von einem Stuhl aufsteht. Aus dem Kopf sind das drei Bilder: sitzen, halb oben, stehen. Beim Abspielen schwebt die Figur senkrecht aus dem Stuhl, als zöge sie jemand an einem Faden nach oben. Dabei stehst du jeden Tag auf. Du hast nur nie hingesehen. Wer aufsteht, bringt zuerst den Oberkörper weit nach vorn, über die Füße, und erst dann strecken sich die Beine. Warum das so sein muss, steht in [Schwerpunkt, Gleichgewicht und Bodenkontakt](/animation/schwerpunkt-balance). Aus dem Gedächtnis kennst du Anfang und Ende einer Bewegung, den Weg dazwischen selten.

  Diese Lektion zeigt, wie du Bewegung beobachtest, statt sie zu erfinden: filmen, Bild für Bild durchgehen, die wichtigen Posen finden und daraus einen Plan auf Papier machen. Das ist die Grundlage für alle weiteren Module, und alles davon geht unterwegs mit Handy, Bleistift und Haftzetteln.

  ## Hinsehen statt erinnern: Referenz mit dem Handy

  Für schnelle Bewegungen ist das Auge zu langsam. 1872 sollte der Fotograf Eadweard Muybridge für den Eisenbahnunternehmer Leland Stanford klären, ob ein laufendes Pferd in einem Moment alle vier Hufe in der Luft hat. 1878 lieferte er die Antwort mit zwölf Kameras, die nacheinander auslösten ([The Horse in Motion, Wikimedia Commons](https://commons.wikimedia.org/wiki/File:The_Horse_in_Motion_high_res.jpg)). Seine späteren Serien aus *Animal Locomotion* (1887) sind gemeinfrei und liegen ebenfalls auf Wikimedia Commons. Eine davon, einen Weitsprung, liest du in den Übungen.

  Dein Handy nimmt in Zeitlupe mehr Bilder pro Sekunde auf als ein normales Video. Auf dem iPhone ist das der Modus Slo-mo; die Bildrate wählst du in den Einstellungen unter *Kamera* ([Apple: Record a slow-motion video](https://support.apple.com/guide/iphone/record-a-video-iph61f49e4bb/ios#iph67bdd501c)). Google-Pixel-Telefone bieten Zeitlupe in Stufen an; für sehr schnelle Bewegungen empfiehlt Google 1/8x ([Pixel-Kamera-Hilfe](https://support.google.com/pixelcamera/answer/7064897?hl=en#slowmo_video)). Die Faktoren erklärt das Android-Entwicklerblog: Eine Aufnahme mit 120 Bildern pro Sekunde, abgespielt mit 30, läuft mit einem Viertel der Geschwindigkeit, 240 mit einem Achtel ([CameraX 1.5](https://developer.android.com/blog/posts/high-speed-capture-and-slow-motion-video-with-camera-x-1-5)).

  So wird eine Aufnahme brauchbar:

  - Das Handy steht fest, etwa an ein Buch gelehnt. Es schwenkt nicht und zoomt nicht.
  - Du filmst von der Seite, mit dem ganzen Körper und den Füßen im Bild.
  - Hinter dir ist eine ruhige, helle Fläche, damit sich die Umrisse abheben.
  - Du nimmst die Bewegung drei- oder viermal auf und wählst danach die klarste Aufnahme.

  Danach gehst du die Aufnahme Bild für Bild durch. Am Computer geht das in VLC mit der Taste `E` für das nächste Bild ([VLC Hotkeys](https://wiki.videolan.org/QtHotkeys/)) und bei angehaltenen YouTube-Videos mit `.` und `,` ([YouTube-Tastenkürzel](https://support.google.com/youtube/answer/7631406?hl=en)). Am Handy hältst du das Video an und schiebst langsam durch die Zeitleiste der Galerie.

  Zähl die Bilder, statt die Dauer zu schätzen. Die Zeit ist die Zahl der Bilder geteilt durch die Aufnahmerate. Bei Zeitlupe zählt die Rate der Aufnahme, nicht die der Wiedergabe:

  ```python run
  # Videobilder in ms
  def ms(n, fps):
      return n * 1000 / fps

  # 18 Bilder, drei Raten
  for fps in (30, 120, 240):
      print(fps, ms(18, fps))
  ```

  Achtzehn Bilder sind bei 30 Bildern pro Sekunde 600 ms, in einer 240er-Zeitlupe nur 75 ms. Wer die Rate vergisst, plant eine Bewegung achtmal zu langsam. Wie aus Millisekunden die Ticks deines Spiels werden, steht in [Timing und Spacing](/animation/timing-spacing).

  > [!TIP] Ein Stapel Bücher als Stativ
  > Lehn das Handy an etwas Festes: Bücher, eine Tasse, die Rückenlehne eines Stuhls. Starte die Aufnahme, geh in Position und warte zwei Sekunden, bevor du dich bewegst. So hast du am Anfang ein ruhiges Bild zum Vergleichen.

  ## Eine Referenz ist ein Beleg, keine Vorlage

  Bewegungen aus Filmaufnahmen abzuzeichnen heißt **Rotoskopie**. Max Fleischer hat das Verfahren 1915 erfunden ([Rotoscoping](https://en.wikipedia.org/wiki/Rotoscoping)). Jordan Mechner hat es in seinen Spielen *Karateka* und *Prince of Persia* ausgiebig genutzt ([Rotoscoping: Uses by other studios](https://en.wikipedia.org/wiki/Rotoscoping#Uses_by_other_studios)). David Rosen nennt *Prince of Persia* in seinem GDC-Vortrag als Beispiel dafür, dass so gewonnene Übergänge detailreich wirken, die Figur aber verzögert auf die Eingabe reagieren lassen ([An Indie Approach to Procedural Animation](https://www.youtube.com/watch?v=LNidsMesxSE&t=55s), ab 0:55). Was das für ein Spiel bedeutet, steht in [Animation im Spiel](/animation/animation-im-spiel).

  Für Tanzszenen der 1930er-Jahre nutzte Fleischer die Aufnahmen „as a guide for timing and positioning“. Die Zeichentrickfiguren mit ganz anderen Proportionen wurden in diese Positionen gezeichnet ([Rotoscoping](https://en.wikipedia.org/wiki/Rotoscoping)). Genau so nutzt du eine Referenz:

  - **Timing:** Wie viele Bilder vergehen zwischen Ausholen und Treffen, wie lange bleibt der Körper unten?
  - **Posen:** Wo ist das Gewicht, welcher Körperteil bewegt sich zuerst, wohin zeigt der Oberkörper?

  Die Posen zeichnest du neu, mit den Proportionen deiner Figur. Du lässt weg, was nichts erzählt, und übertreibst, was im kleinen Bild verloren ginge.

  > [!PRAXIS] 72 Bilder Video, 8 Bilder Animation
  > Raymond Schlitter (Slynyrd) beschreibt, wie er einen Gangzyklus aus Videoreferenzen baut. Ein einzelner Zyklus der Aufnahme, mit 60 Bildern pro Sekunde, hat 72 Bilder, und „Several frames are identical at such a high frame rate“. Er sucht von Hand 8 Bilder heraus und passt die Dauern an, damit das Tempo dem Video entspricht. Danach vergleicht er mit weiteren Referenzen und ändert, was nicht zu seiner Figur passt ([Pixelblog 50](https://www.slynyrd.com/blog/2024/5/24/pixelblog-50-human-walk-cycle)). Die Referenz liefert die Auswahl der Posen, die Zeichnung bleibt seine.

  > [!WARNING] Abpausen und generierte Vorlagen
  > Pausierst du alle Bilder einer Aufnahme ab, erbst du jede Unschärfe, jedes Zittern und die Proportionen der gefilmten Person. Für diesen Kurs gilt außerdem: Keine KI-generierten Videos oder Bilder als Vorlage. Sie belegen nicht, wie sich ein Körper bewegt, und jede Pose, die du zeichnest, ist deine eigene Arbeit.

  ## Keys, Extreme, Breakdowns und Zwischenbilder

  Eine Animation besteht aus Zeichnungen mit verschiedenen Aufgaben. Die Begriffe stammen aus dem Zeichentrickstudio, und sie helfen dir, beim Planen die wichtigen Bilder von den Füllbildern zu trennen.

  Eine **Schlüsselpose (Key)** legt Anfang und Ende eines Bewegungsabschnitts fest. Die Folge der Keys bestimmt, welche Bewegung der Zuschauer sieht ([Key frame](https://en.wikipedia.org/wiki/Key_frame)). Pedro Medeiros (Saint11) beschreibt Keys als „frames that define an animation, important poses to describe an action“ ([Animation Planning](https://saint11.art/blog/pixel-art-tutorials/#Planning)). Wer nur die Keys sieht, versteht schon, was passiert.

  Ein **Extrem** ist die Pose, in der eine Bewegung am weitesten geht und umkehrt: der tiefste Punkt einer Hocke, der weiteste Punkt beim Ausholen. Viele Keys sind Extreme, aber nicht jeder.

  Ein **Breakdown** liegt zwischen zwei Keys und entscheidet, auf welchem Weg die Figur von einem zum anderen kommt. In großen Studios setzen Assistenten die Breakdowns, „which define the movement in more detail“ ([Inbetweening](https://en.wikipedia.org/wiki/Inbetweening#Traditional_animation)).

  Ein **Zwischenbild (Inbetween)** füllt den Rest des Weges, ohne etwas Neues zu erzählen. Medeiros' Notizen dazu: „Fill the gaps“ und „Copying pasting helps a lot“.

  Richard Williams' *The Animator's Survival Kit* arbeitet mit denselben Begriffen: Keys, Extreme, Breakdowns ([Rezension bei AWN](https://www.awn.com/animationworld/animators-survival-kit-most-valuable-how-animate-book-you-will-ever-want-own)). Für das Aufstehen vom Stuhl sieht eine Bildliste so aus, mit K für Key, B für Breakdown und Z für Zwischenbild:

  ```text
  Bild  Art  Pose
   1    K    sitzt aufrecht
   2    Z    Oberkörper geht vor
   3    B    Brust über den Knien,
             Gesäß hebt ab
   4    Z    Beine halb gestreckt
   5    K    steht
  ```

  Ersetz Bild 3 durch „Oberkörper aufrecht, Gesäß hebt ab“. Anfang und Ende bleiben gleich, aber die Figur steigt jetzt senkrecht auf: die schwebende Fassung aus dem Einstieg. Zwei Keys lassen viele Wege offen, der Breakdown wählt einen davon.

  Wie viele Keys eine Bewegung braucht, entscheidet die Handlung, nicht die Bildzahl. Schlitter zeigt seinen Gang mit 8, 6 und 4 Bildern; die 4er-Fassung „highlights the most important key frames“, wirkt allein aber etwas dünn ([Pixelblog 50](https://www.slynyrd.com/blog/2024/5/24/pixelblog-50-human-walk-cycle)). Mariel Cartwright beschreibt für *Skullgirls*, dass schon zwei gut gewählte Posen eine schnelle Bewegung tragen, wenn die Bilder dazwischen nah an den Keys liegen ([GDC 2014](https://www.youtube.com/watch?v=Mw0h9WmBlsw&t=235s), ab 3:55).

  > [!MERKE]
  > Key: was passiert. Breakdown: auf welchem Weg. Zwischenbild: füllt den Weg. Extrem: wo die Bewegung am weitesten geht und umkehrt.

  ## Pose-to-Pose oder Straight Ahead

  Frank Thomas und Ollie Johnston unterscheiden in *The Illusion of Life* zwei Arbeitsweisen. Bei **Straight Ahead** zeichnest du Bild für Bild vom Anfang bis zum Ende. Das ergibt fließende, lebendige Bewegung, aber Proportionen und genaue Posen gehen unterwegs leicht verloren. Bei **Pose-to-Pose** zeichnest du zuerst die Keys und füllst danach die Lücken. Oft werden beide kombiniert ([Straight ahead action and pose to pose](https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Straight_ahead_action_and_pose_to_pose)).

  In Spielen überwiegt Pose-to-Pose, aus einem praktischen Grund: Du kennst die Keys und ihr Timing, bevor das erste Zwischenbild existiert, und kannst sie schon im Spiel ausprobieren. Jake Clark beschreibt den Ablauf bei *Cuphead*: zuerst die Keys, dann die Breakdowns, dann die vollständige Animation ([Cuphead's Animation Process](https://www.youtube.com/watch?v=RmGb-jU3uVQ&t=966s), ab 16:06). Das Krita-Handbuch geht im Tutorial für einen Gangzyklus genauso vor: erst die Keys, dann die Zwischenbilder ([Animation with Krita](https://docs.krita.org/en/user_manual/animation.html#introduction-to-animation-how-to-make-a-walk-cycle)).

  Straight Ahead lohnt sich, wo der Weg nicht vorher feststehen muss: Rauch, eine Flamme, ein Tuch im Wind. Nimmst du Pose-to-Pose für den Körper und zeichnest ein flatterndes Tuch danach Bild für Bild dazu, kombinierst du beides.

  ## Thumbnails: die Bewegung auf Papier planen

  Ein **Thumbnail** ist eine briefmarkengroße Skizze. Für Bewegungen genügt eine Gliederpuppe: ein Kreis für den Kopf, Striche für Körper und Glieder. Zieh in jede Pose zuerst die Handlungslinie, die Linie, die die Richtung der ganzen Pose zeigt ([Pose und Ausdruck](/pixelart/pose-ausdruck)). Drei bis sechs Thumbnails reichen für eine Bewegung.

  Medeiros plant komplexe Animationen in Stufen: ein Standbild, dann grobe Skizzen („Make a basic plan of the animation“, „Try to get the timing right, but don't worry too much“), dann die Keys fertig zeichnen, zuletzt die Zwischenbilder ([Animation Planning](https://saint11.art/blog/pixel-art-tutorials/#Planning)). Für dich heißt das:

  1. **Absichtssatz:** ein Satz, was ein Zuschauer sehen soll, etwa „Die Puppe hebt eine schwere Kiste vom Boden“.
  2. **Referenz:** filmen, Keys suchen, ihre Bildnummern im Video notieren.
  3. **Thumbnails:** jeden Key als Strichfigur, darunter K oder B.
  4. **Dauern:** aus der Referenz ausrechnen, wie lange es von Key zu Key dauert.
  5. **Prüfen:** die Keys als Daumenkino blättern, bevor ein Zwischenbild existiert.

  Die Dauern zwischen den Keys liefert dir die Referenz. Hast du die Posen in einer Aufnahme mit 120 Bildern pro Sekunde bei Bild 1, 46, 70 und 118 gefunden:

  ```python run
  # Posen im Video, 120 fps
  k = [1, 46, 70, 118]
  for a, b in zip(k, k[1:]):
      ms = (b-a) * 1000 / 120
      print(a, "->", b, ms)
  ```

  Vom Stehen bis zum tiefsten Punkt vergehen 375 ms, das Anheben bis zur Brust dauert 200 ms, das Aufrichten 400 ms. Diese Zeiten verteilst du auf deine Zeichnungen, wie in [Timing und Spacing](/animation/timing-spacing) beschrieben. Als Plan unter den Thumbnails:

  ```text
  Bild  Art  Pose            Zeit
   1    K    steht vor Kiste 375 ms
   2    K    tief, greift    200 ms
   3    B    Kiste an Brust  400 ms
   4    K    steht, trägt    hält
  ```

  Die letzte Spalte ist die Zeit bis zur nächsten Pose, nicht die Dauer einer einzelnen Zeichnung. Ein Daumenkino aus vier Haftzetteln zeigt dir in einer Minute, ob die Keys die Handlung erzählen. Zeig es jemandem ohne Vorrede und frag „Was passiert da?“. Das ist der **Beobachtungstest**: Antwort wörtlich notieren, nicht korrigieren, mit dem Absichtssatz vergleichen. Erst wenn die Keys verstanden werden, lohnen sich Zwischenbilder.

  > [!INTERVIEW]
  > „Wie gehst du an eine neue Animation heran?“ Gute Antwort: Ich schreibe zuerst in einem Satz auf, was der Zuschauer lesen soll. Dann suche oder filme ich eine Referenz und zähle dort die Bilder zwischen den wichtigen Posen. Ich plane Pose-to-Pose: Thumbnails der Keys, Timing nur mit Keys, ein schneller Test, im Spiel oder als Daumenkino. Erst wenn die Keys lesbar sind, setze ich Breakdowns und Zwischenbilder. So kann ich Timing und Posen noch billig ändern.

  ## Häufige Fehler

  - **Aus dem Kopf animiert.** Die Bewegung hat den Anfang und das Ende, die du kennst, und einen erfundenen Weg dazwischen. Film die Bewegung, bevor du zeichnest.
  - **Zeitlupe falsch umgerechnet.** Gezählt in der Wiedergabe, geteilt durch 30 statt durch die Aufnahmerate: Die Bewegung wird vier- oder achtmal zu langsam geplant.
  - **Alles abgepaust.** 72 Bilder Referenz werden 72 Bilder Animation, mit den Proportionen der gefilmten Person. Wähle Keys aus und zeichne sie neu.
  - **Zu viele Keys.** Wenn jedes Bild ein Key ist, ist keines wichtiger als das andere. Frag bei jedem: Fehlt ohne ihn etwas?
  - **Keys ohne Breakdown.** Die Zwischenbilder nehmen dann den kürzesten Weg, und die Bewegung wird gerade und mechanisch. Mehr dazu in [Bögen, Nachziehen und Überlappung](/animation/boegen-ueberlappung).
  - **Zwischenbilder zuerst.** Wer gleich alle Bilder zeichnet, ändert das Timing später nur noch ungern. Erst die Keys timen und prüfen.
  - **Kamera bewegt.** Ein Handy, das mitgeht oder zoomt, macht jede Pose anders groß. Die Bilder lassen sich nicht mehr vergleichen.

  ## Zusammenfassung

  - Das Gedächtnis kennt Anfang und Ende einer Bewegung, die Referenz zeigt den Weg. Film mit festem Handy von der Seite, gern in Zeitlupe.
  - Zeit = Bildzahl geteilt durch die Aufnahmerate. Bei Zeitlupe zählt die Rate der Aufnahme.
  - Die Referenz ist Beleg für Timing und Posen. Du wählst aus, zeichnest neu und übertreibst; abgepaust wird nicht, generierte Vorlagen gibt es nicht.
  - Keys erzählen, was passiert, Extreme markieren Umkehrpunkte, Breakdowns legen den Weg fest, Zwischenbilder füllen ihn.
  - Pose-to-Pose plant Keys und Timing zuerst, Straight Ahead zeichnet durch. In Spielen überwiegt Pose-to-Pose, oft kombiniert mit Straight Ahead für Tuch, Rauch oder Flammen.
  - Thumbnails mit Handlungslinie, Bildnummern und Dauern sind der Plan. Ein Daumenkino nur aus Keys und ein Beobachtungstest prüfen ihn.
exercises:
  - id: was-macht-der-breakdown
    type: choice
    title: Die Pose dazwischen
    prompt: |
      Zwischen den Keys „sitzt“ und „steht“ zeichnest du eine Pose, in der die Brust über den Knien ist und das Gesäß abhebt. Was leistet diese Pose?
    options:
      - text: Sie legt fest, auf welchem Weg die Figur vom Sitzen zum Stehen kommt.
        correct: true
        why: Das ist die Aufgabe eines Breakdowns. Mit einer anderen Pose an dieser Stelle steigt die Figur senkrecht auf, bei gleichen Keys.
      - text: Sie ist die wichtigste Pose der Bewegung, ohne sie versteht niemand die Handlung.
        correct: false
        why: Das wären Keys. Sitzen und Stehen allein erzählen schon, dass jemand aufsteht; der Breakdown bestimmt, wie.
      - text: Sie liegt genau in der Mitte zwischen den Keys und füllt den Weg.
        correct: false
        why: So arbeitet ein Zwischenbild. Ein Breakdown muss nicht in der Mitte liegen und bringt eine neue Information, hier das Vorbeugen.
      - text: Sie ist der Punkt, an dem die Bewegung umkehrt.
        correct: false
        why: Das beschreibt ein Extrem. Beim Aufstehen kehrt an dieser Stelle nichts um, die Figur geht weiter nach oben.
    explanation: |
      Keys sagen, was passiert, der Breakdown entscheidet, auf welchem Weg. Zwei Keys lassen viele Wege offen: senkrecht hochschweben, nach vorn kippen und aufrichten, sich mit den Händen abstützen. Erst der Breakdown wählt einen davon. Deshalb ist er nach den Keys die wichtigste Zeichnung und kommt vor allen Zwischenbildern.
    resources:
      - title: Wikipedia · Inbetweening, Traditional animation
        url: https://en.wikipedia.org/wiki/Inbetweening#Traditional_animation

  - id: straight-ahead-wann
    type: choice
    title: Durchzeichnen oder planen?
    prompt: |
      Für welche dieser Aufgaben passt Straight Ahead besser als Pose-to-Pose?
    options:
      - text: Eine Flamme, die unregelmäßig flackert.
        correct: true
        why: Ihr Weg muss nicht vorher feststehen, und genaue Posen braucht sie nicht. Bild für Bild durchzuzeichnen ergibt hier eine lebendige Bewegung.
      - text: Rauch, der aus einem Schornstein aufsteigt und zerfasert.
        correct: true
        why: Auch Rauch hat keine feste Form. Jedes Bild entsteht aus dem vorigen, und kleine Abweichungen stören nicht.
      - text: Eine Gliederpuppe hebt eine Kiste, die Animation darf genau 6 Bilder haben.
        correct: false
        why: Bei fester Bildzahl willst du Keys und Timing zuerst festlegen. Straight Ahead endet oft mit mehr oder weniger Bildern als geplant.
      - text: Ein Hammerschlag, dessen Keys du zuerst im Spiel ausprobieren willst.
        correct: false
        why: Dafür brauchst du die Keys, bevor die Zwischenbilder existieren. Genau das bietet Pose-to-Pose.
    explanation: |
      Thomas und Johnston beschreiben Straight Ahead als fließend und lebendig, aber schwer zu kontrollieren, was Proportionen und genaue Posen angeht. Pose-to-Pose gibt dir Keys und Timing zuerst, und genau die brauchst du, wenn eine Animation eine feste Bildzahl hat oder im Spiel getestet wird. Formlose Dinge wie Flammen und Rauch zeichnest du deshalb oft durch, Figuren planst du.
    resources:
      - title: Wikipedia · Straight ahead action and pose to pose
        url: https://en.wikipedia.org/wiki/Twelve_basic_principles_of_animation#Straight_ahead_action_and_pose_to_pose

  - id: ablauf-planen
    type: order
    title: Von der Idee zum Zwischenbild
    prompt: |
      Bring die Arbeitsschritte für eine neue Bewegung in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Absichtssatz schreiben
      Referenz filmen und Bild für Bild durchgehen
      Keys in der Referenz finden und ihre Bildnummern notieren
      Thumbnails der Keys mit Handlungslinie zeichnen
      Dauern von Key zu Key ausrechnen und die Keys als Daumenkino prüfen
      Breakdowns einsetzen
      Zwischenbilder zeichnen
    explanation: |
      Der Absichtssatz ist der Maßstab für alles Weitere, deshalb steht er vorn. Die Referenz liefert Posen und Timing, die Thumbnails übersetzen sie in deine Figur. Das Daumenkino aus Keys zeigt, ob die Handlung lesbar ist, solange Änderungen noch wenig kosten. Breakdowns legen danach die Wege fest, und erst dann füllen Zwischenbilder die Lücken.
    resources:
      - title: Saint11 · Animation Planning
        url: https://saint11.art/blog/pixel-art-tutorials/#Planning

  - id: extrem-finden
    type: output
    title: Wo kehrt sie um?
    prompt: |
      Eine Gliederpuppe bückt sich nach einer Kiste und richtet sich wieder auf. Die Liste zeigt die Höhe ihrer Hüfte in jedem Bild. In welchem Bild liegt das Extrem nach unten? Antworte mit der Bildnummer.
    lang: text
    code: |
      Bild  Hüfte (px über Boden)
       1    20
       2    17
       3    12
       4     9
       5    10
       6    14
       7    20
    expected: |
      4
    accept:
      - Bild 4
      - "4."
    explanation: |
      Bis Bild 4 sinkt die Hüfte, ab Bild 5 steigt sie wieder. Bild 4 ist der Umkehrpunkt, also das Extrem. Hier greift die Puppe die Kiste; als Key gehört diese Pose fast immer in den Plan. In einer echten Aufnahme findest du das Extrem genauso: Du suchst das Bild, nach dem eine Richtung wechselt.
    resources:
      - title: AWN · Rezension The Animator's Survival Kit
        url: https://www.awn.com/animationworld/animators-survival-kit-most-valuable-how-animate-book-you-will-ever-want-own

  - id: sprung-gezaehlt
    type: output
    title: Vom Absprung bis zur Landung
    prompt: |
      Du hast einen Sprung mit 120 Bildern pro Sekunde gefilmt und in der Galerie Bild für Bild gezählt. Was gibt das Programm aus?
    lang: python
    code: |
      def ms(n, fps):
          return n * 1000 / fps

      absprung, landung = 37, 85
      n = landung - absprung
      print(n, ms(n, 120))
    expected: |
      48 400.0
    explanation: |
      Zwischen Bild 37 und Bild 85 liegen 48 Bilder. Bei 120 Bildern pro Sekunde sind das 48 / 120 = 0,4 Sekunden, also 400 ms. Hättest du durch 30 geteilt, weil die Zeitlupe mit 30 Bildern pro Sekunde abgespielt wird, kämen 1600 ms heraus, viermal zu viel. Die Kommazahl entsteht, weil `/` in Python immer eine Kommazahl liefert.
    resources:
      - title: Android Developers Blog · Slow-Motion Video with CameraX 1.5
        url: https://developer.android.com/blog/posts/high-speed-capture-and-slow-motion-video-with-camera-x-1-5

  - id: acht-aus-zweiundsiebzig
    type: output
    title: Acht Bilder, gleiche Zeit
    prompt: |
      Ein Zyklus aus einer Aufnahme mit 60 Bildern pro Sekunde hat 72 Bilder. Du wählst daraus 8 Bilder aus und willst, dass der Zyklus genauso lange dauert wie im Video. Wie viele Millisekunden steht jedes der 8 Bilder, wenn alle gleich lang stehen? Antworte mit der Zahl.
    lang: text
    code: |
      Aufnahme   72 Bilder, 60 fps
      Auswahl     8 Bilder
      Dauer je Bild   ? ms
    expected: |
      150
    accept:
      - 150 ms
      - 150ms
    explanation: |
      72 Bilder bei 60 pro Sekunde sind 1,2 Sekunden, also 1200 ms. Verteilt auf 8 Bilder steht jedes 150 ms. So beschreibt es Slynyrd für seinen Gangzyklus: weniger Bilder auswählen und die Dauern so anpassen, dass das Tempo dem Video entspricht. Gleich lang müssen die Bilder später nicht bleiben; Keys dürfen länger stehen.
    resources:
      - title: Slynyrd · Pixelblog 50, Human Walk Cycle
        url: https://www.slynyrd.com/blog/2024/5/24/pixelblog-50-human-walk-cycle

  - id: begriffe-zerlegen
    type: gap
    title: Sechs Wörter fürs Zerlegen
    prompt: |
      Ergänze die fehlenden Begriffe.
    lang: prose
    code: |
      Eine Pose, die Anfang oder Ende eines Bewegungsabschnitts festlegt, heißt ⟦Key⟧.
      Die Pose, die den Weg zwischen zwei Keys festlegt, heißt ⟦Breakdown⟧.
      Bilder, die den Rest des Weges füllen, heißen ⟦Zwischenbilder⟧.
      Wer zuerst die Keys zeichnet und dann die Lücken füllt, arbeitet ⟦Pose-to-Pose⟧.
      Wer vom ersten bis zum letzten Bild durchzeichnet, arbeitet ⟦Straight Ahead⟧.
      Eine briefmarkengroße Planungsskizze heißt ⟦Thumbnail⟧.
    gaps:
      - label: Wichtige Pose
        hint: Englisch, drei Buchstaben.
        accept: ["Schlüsselpose", "Keyframe", "Key Frame", "Schlüsselbild"]
      - label: Weg zwischen Keys
        hint: Englisch, wörtlich „Aufschlüsselung“.
      - label: Füllbilder
        hint: Englisch Inbetweens.
        accept: ["Inbetweens", "Inbetween", "In-betweens", "Zwischenbild", "Zwischenphasen"]
      - label: Keys zuerst
        hint: Von Pose zu Pose.
      - label: Durchzeichnen
        hint: Geradeaus.
        accept: ["Straight Ahead Action"]
      - label: Planungsskizze
        hint: Englisch, wörtlich Daumennagel.
        accept: ["Thumbnails", "Thumbnailskizze", "Thumbnail-Skizze"]
    explanation: |
      Key, Breakdown und Zwischenbild beschreiben die Aufgabe einer Zeichnung: was passiert, auf welchem Weg, und den Rest. Pose-to-Pose und Straight Ahead sind die beiden Arbeitsweisen aus *The Illusion of Life*. Thumbnails sind der billigste Ort, um Fehler zu finden: Eine Strichfigur neu zu zeichnen kostet Sekunden.
    resources:
      - title: Wikipedia · Key frame
        url: https://en.wikipedia.org/wiki/Key_frame

  - id: key-zu-viel
    type: bug
    title: Ein Blatt zu viel
    prompt: |
      Du blätterst deine Keys für „Kiste heben“ als Daumenkino. Ein Blatt bringt nichts Neues: Lässt du es weg, erzählt das Daumenkino dasselbe. Finde die Zeile und korrigiere ihre Art.
    lang: text
    code: |
      Bild  Art        Pose
       1    Key        steht vor Kiste
       2    Key        Hüfte halb unten
       3    Key        tief, greift
       4    Breakdown  Kiste vor Bauch
       5    Key        steht, trägt
    lines: [3]
    fix:
      - line: 3
        answers:
          - " 2    Zwischenbild  Hüfte halb unten"
          - " 2    Inbetween  Hüfte halb unten"
    hints:
      - Welche Pose liegt nur auf halbem Weg zwischen ihren Nachbarn?
    explanation: |
      „Hüfte halb unten“ liegt auf halbem Weg zwischen Stehen und dem tiefsten Punkt und erzählt nichts, was die Nachbarn nicht schon zeigen. Das ist ein Zwischenbild. Bild 4 ist dagegen ein echter Breakdown: Dass die Kiste nah am Bauch hochkommt, legt den Weg fest. Ein überzähliger Key kostet doppelt, weil du ihn ins Reine zeichnest und weil er beim Timing gleich wichtig behandelt wird wie die echten.
    resources:
      - title: Wikipedia · Key frame
        url: https://en.wikipedia.org/wiki/Key_frame

  - id: aufnahme-unbrauchbar
    type: bug
    title: Mal groß, mal klein
    prompt: |
      Du gehst deine Aufnahme Bild für Bild durch, aber die Posen lassen sich nicht vergleichen: Die Figur ist mal größer, mal kleiner, und der Boden springt im Bild. Welcher Satz in deinen Aufnahmenotizen erklärt das?
    lang: prose
    code: |
      Die Kamera filmt von der Seite, auf Hüfthöhe.
      Hinter mir ist eine helle, leere Wand.
      Ich gehe mit dem Handy mit und zoome nach, wenn ich mich entferne.
      Ich nehme die Bewegung dreimal auf.
      Am Anfang warte ich zwei Sekunden, bevor ich mich bewege.
    lines: [3]
    explanation: |
      Eine Kamera, die mitgeht und zoomt, verändert in jedem Bild Größe und Lage der Figur. Dann misst du nicht mehr die Bewegung, sondern die Kamera. Ein festes Handy und ein fester Ausschnitt machen jede Pose vergleichbar, auch Schrittlängen und Höhen. Muss die Bewegung weit gehen, stell das Handy weiter weg, statt mitzugehen.
    resources:
      - title: Apple · Record a video with your iPhone camera
        url: https://support.apple.com/guide/iphone/record-a-video-iph61f49e4bb/ios#iph67bdd501c

  - id: weitsprung-lesen
    type: explain
    title: Ein Weitsprung von 1887
    prompt: |
      Muybridge hat einen Weitsprung von der Seite fotografiert, acht Bilder (Tafel 160, Link unten). Die Liste beschreibt, was in jedem Bild zu sehen ist. Erkläre in wenigen Sätzen, welche Bilder du als Keys nehmen würdest, welche Extreme sind und welches Bild ein guter Breakdown wäre.
    lang: text
    code: |
      Bild  Was zu sehen ist
       1    unscharf, letzter Schritt
       2    Absprung: ein Fuß am Boden,
            Knie vorn hoch, Arme gebeugt
       3    in der Luft, hinteres Bein
            noch gestreckt
       4    Knie an der Brust,
            ganz zusammengekauert
       5    Beine strecken sich vor,
            Arme schwingen zurück
       6    Beine ganz gestreckt,
            Fersen kurz vor der Matte
       7    Landung, Knie tief gebeugt
       8    unscharf, nach der Landung
    points:
      - Absprung (2), Zusammenkauern in der Luft (4) und Landung (7) erzählen den Sprung; das sind die Keys.
      - Bild 4 ist ein Extrem (am stärksten zusammengezogen), Bild 6 das Extrem der Streckung.
      - Bild 5 ist ein guter Breakdown, weil es festlegt, dass die Beine nach vorn gehen, während die Arme zurückschwingen.
      - Die übrigen Bilder zeigen Wege zwischen den Posen und würden in einer Animation zu Zwischenbildern.
    explanation: |
      Wer nur Bild 2, 4 und 7 sieht, versteht den Weitsprung: abspringen, zusammenziehen, landen. Das macht sie zu Keys. Bild 4 und Bild 6 sind Extreme, weil die Beine dort am weitesten angezogen und am weitesten gestreckt sind; danach kehrt die Richtung um. Bild 5 zeigt, wie der Körper vom Zusammenkauern in die Streckung kommt, mit Armen und Beinen in entgegengesetzter Richtung, und ist damit der Breakdown zwischen 4 und 6. Die unscharfen Randbilder taugen als Referenz für den Weg, nicht als Pose.
    resources:
      - title: Wikimedia Commons · Muybridge, Plate 160, Running broad jump
        url: https://commons.wikimedia.org/wiki/File:Man_in_pelvis_cloth_running_and_jumping_(rbm-QP301M8-1887-160).jpg

  - id: eigene-referenz
    type: practice
    title: Eine Bewegung filmen und zerlegen
    prompt: |
      Film dich oder jemanden, der einverstanden ist, bei einer alltäglichen Bewegung: von einem Stuhl aufstehen, eine Kiste anheben oder einen Ball werfen. Stell das Handy fest hin, film von der Seite, gern in Zeitlupe. Geh die beste Aufnahme Bild für Bild durch und notier die Bildnummern der Keys, des tiefsten oder weitesten Punkts und eines Breakdowns. Rechne die Dauer von Key zu Key in ms aus.
    lang: prose
    starter: |
      Bewegung:
      Aufnahmerate (fps):
      Keys (Bildnummern, Pose):
      Extrem (Bildnummer):
      Breakdown (Bildnummer, Pose):
      Dauern von Key zu Key (ms):
      Was mich überrascht hat:
    checklist:
      - Das Handy stand fest, Ausschnitt und Zoom blieben während der Aufnahme gleich.
      - Die Aufnahmerate ist notiert, und die Dauern sind mit ihr berechnet, nicht mit der Wiedergaberate.
      - Jeder Key hat eine Bildnummer und eine kurze Beschreibung der Pose.
      - Du hast mindestens einen Breakdown benannt und notiert, welchen Weg er festlegt.
      - Unter „Was mich überrascht hat“ steht eine Beobachtung, die du vorher nicht erwartet hättest.
    hints:
      - Such zuerst die Bilder, in denen die Bewegung die Richtung wechselt. Das sind deine Extreme.
    explanation: |
      Die Übung trainiert das Hinsehen. Die Überraschung ist der wichtigste Eintrag: Sie zeigt die Stelle, an der deine Erinnerung von der Bewegung abweicht. Dauern aus einer Aufnahme sind ein Startwert; in der Animation darfst du sie verkürzen oder übertreiben. Die Notizen nimmst du in der nächsten Übung als Grundlage für deine Thumbnails.
    resources:
      - title: VideoLAN Wiki · QtHotkeys
        url: https://wiki.videolan.org/QtHotkeys/

  - id: thumbnails-kiste
    type: practice
    title: Vier Strichfiguren, eine Kiste
    prompt: |
      Plan auf Papier, wie eine Gliederpuppe eine Kiste vom Boden hebt, oder nimm die Bewegung aus deiner Referenz. Schreib zuerst den Absichtssatz. Zeichne drei bis sechs Thumbnails, jedes mit Handlungslinie, und schreib darunter Bildnummer, K oder B und die Dauer. Übertrag nur die Keys auf Haftzettel, blättere sie als Daumenkino und zeig es jemandem ohne Vorrede. Frag nur: „Was passiert da?“

      Hier notierst du den Plan als Text und die Antwort des Zuschauers.
    lang: prose
    starter: |
      Absichtssatz:
      Thumbnails (Bild, K/B, Pose, Dauer):
      Daumenkino nur aus Keys, Zuschauer sagt (wörtlich):
      Abweichung von meiner Absicht:
      Was ich vor den Zwischenbildern ändere:
    checklist:
      - Der Absichtssatz stand fest, bevor du die erste Strichfigur gezeichnet hast.
      - Es sind drei bis sechs Thumbnails, jedes mit eingezeichneter Handlungslinie.
      - Jedes Thumbnail ist als K oder B markiert und hat eine Dauer in ms.
      - Die Antwort des Zuschauers steht wörtlich da; ohne Zuschauer hast du nach einer Nacht Abstand selbst geprüft und das markiert.
      - Du hast notiert, was du ändern willst, bevor du Zwischenbilder zeichnest.
    hints:
      - Die Hüfte geht beim Heben nach hinten. Prüf in jedem Thumbnail, wo sie im Verhältnis zu den Füßen steht.
    explanation: |
      Die Übung trennt Planen und Zeichnen. Thumbnails sind schnell gemacht und schnell verworfen, deshalb probierst du hier Posen aus, nicht im Editor. Das Daumenkino nur aus Keys zeigt, ob die Handlung ohne Zwischenbilder lesbar ist. Was der Zuschauer sagt, ist eine Beobachtung, kein Urteil: Weicht sie von deiner Absicht ab, ändere Keys oder Dauern, bevor du weiterzeichnest.
    resources:
      - title: Saint11 · Animation Planning
        url: https://saint11.art/blog/pixel-art-tutorials/#Planning
