id: animation
title: "2D-Animation: Gewicht, Timing & Körpersprache"
short: Animation
tagline: Bewegungen zeichnen, die man liest und denen man das Gewicht glaubt.
description: >
  Schlüsselposen, Timing und Spacing, Bögen und Überlappung, Schwerpunkt und Bodenkontakt, schwer und
  leicht, Antizipation und Erholung, Gehen und Laufen, Körpersprache, Form über alle Bilder und Animation
  im Spieltempo. Du beginnst mit neutralen Studien wie Ball und Mehlsack und endest mit einer eigenen
  Figur in einer Godot-Testszene; ob eine Bewegung wirkt, zeigt dir, was andere darin erkennen. Jede
  Zeichnung, Pose und Animation ist deine, eine KI darf nur technische Arbeit wie das Gerüst der
  Testszene übernehmen.
color: "#4FE3C1"
order: 14
outcomes:
  - Du zerlegst Bewegungen aus Referenzen in **Schlüsselposen, Extreme und Zwischenbilder** und planst eigene Bewegungen als Thumbnails, bevor du ins Detail gehst.
  - Du steuerst **Timing und Spacing** bewusst, mit Haltezeiten, Bildern pro Zeichnung, Ease-in und Ease-out, und rechnest zwischen Bildern, Millisekunden und Spiel-Ticks um.
  - Du machst **Gewicht glaubwürdig** über Schwerpunkt, Stützfläche, Bodenkontakt, Stauchen und Strecken, Aufprall und Ausschwingen.
  - Du baust Bewegungen aus **Antizipation, Aktion und Erholung** mit Bögen, Nachziehen und Überlappung und animierst Gehen, Laufen und Ruhezyklen in wenigen Bildern.
  - Du zeigst **Zustände und Zustandswechsel** über Körpersprache und hältst Form, Volumen und Proportionen von Bild zu Bild konstant.
  - Du arbeitest im Editor mit **Zeitleiste, Bilddauer, Onion Skinning, Tags und Vorschau** und exportierst Sprite-Sheets, mit freien Programmen oder Aseprite.
  - Du prüfst eigene Animationen **im Spieltempo** in einer Testszene auf Lesbarkeit, Übergänge und Reaktion auf die Eingabe, dokumentierst Überarbeitungen und beobachtest, was andere erkennen.
tracks:
  - title: Bewegung sehen und planen
    description: Referenzen filmen und Bild für Bild lesen, Schlüsselposen, Timing und Spacing, Bögen und Überlappung. Alles mit Handy und Papier.
    modules: [beobachten-schluesselposen, timing-spacing, boegen-ueberlappung]
  - title: Gewicht und Kraft
    description: Schwerpunkt und Bodenkontakt, schwer und leicht, Antizipation und Erholung, Gehen und Laufen in wenigen Bildern.
    modules: [schwerpunkt-balance, gewicht-aufprall, antizipation-erholung, gehen-laufen]
  - title: Ausdruck und Konstanz
    description: Körpersprache und lesbare Zustandswechsel, Form über alle Bilder, Animation im Spieltempo mit Eingabe und Ton.
    modules: [koerpersprache, form-konstanz, animation-im-spiel]
  - title: Im Editor und in der Testszene
    description: Einzelbilder, Onion Skinning und Export im Editor, neutrale Studien in Varianten, eine eigene Figur mit zwei Überarbeitungen und der Prüfstand in Godot. Dafür brauchst du Godot und einen Editor wie Pixelorama, LibreSprite, Krita oder Aseprite; lesen kannst du die Lektionen auch unterwegs. Das Editor-Modul kannst du jederzeit vorziehen.
    modules: [editor-zeitleiste, werkstatt-studien, werkstatt-figur, testszene]
