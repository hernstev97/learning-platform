terms:
  - term: Absichtssatz
    definition: Ein Satz, den du vor einer Animation schreibst und der sagt, was ein Zuschauer lesen soll. Maßstab für Beobachtungstest und Überarbeitung.
  - term: Animationsliste
    definition: Liste aller Animationen einer Figur mit Loop, erstem veränderten Bild, Erkennungspose, Abbruchfenster, Nachfolger und Ton-Bildern. Vertrag zwischen Zeichnung und Code.
  - term: Antizipation
    definition: Die Bewegung vor der Bewegung, meist in die Gegenrichtung der Aktion, etwa Arme zurück vor einem Wurf. Sie sammelt Kraft und kündigt an, was kommt; in Spielen kostet sie Reaktionszeit.
  - term: Auf Zweien
    definition: Jede Zeichnung steht zwei Filmbilder lang, bei 24 fps also 12 Zeichnungen pro Sekunde. Englisch on twos; entsprechend auf Einsen und auf Dreien.
  - term: Ausschwingen (Settle)
    definition: Das letzte Stück einer Bewegung, in dem sie immer kleiner wird, bis etwas ruht, etwa die kleinen Hüpfer eines Balls oder das Nachwackeln eines Wasserballons.
  - term: Basis
    definition: Die Ausgangsfassung einer Studie, gegen die jede Variante verglichen wird. Sie wird nie überschrieben.
  - term: Beobachtungstest
    definition: Jemandem eine Animation ohne Vorrede dreimal in Schleife zeigen, offen fragen („Was passiert da?“), die Antworten wörtlich notieren und mit dem Absichtssatz vergleichen. Eine Antwort ist ein Hinweis, kein Beleg.
  - term: Bildliste
    definition: Tabelle mit Bildnummer, Dauer und Pose jeder Zeichnung einer Animation. Im Zeichentrick Belichtungsblatt (Exposure Sheet).
  - term: Bogen (Arc)
    definition: Die gekrümmte Bahn, auf der Hände, Füße und Köpfe laufen, weil Gelenke drehen. Zwischenbilder auf der Geraden zwischen zwei Keys machen ein Glied kürzer.
  - term: Breakdown
    definition: Die Pose zwischen zwei Keys, die festlegt, auf welchem Weg die Figur vom einen zum anderen kommt. Nach den Keys die wichtigste Zeichnung.
  - term: Cel
    definition: Das Bild einer Ebene in einem bestimmten Bild der Animation, nach den Zelluloidfolien des Trickfilms. Ein Bild der Animation besteht aus den Cels aller Ebenen.
  - term: Ease-in
    definition: Abbremsen in einen Key hinein, mit kleiner werdenden Abständen. Klassisch Slow in. Godots Tween und CSS benennen es umgekehrt, dort startet ease-in langsam und wird schneller.
  - term: Ease-out
    definition: Anfahren aus einem Key heraus, mit wachsenden Abständen. Klassisch Slow out.
  - term: Erholung
    definition: Die Phase nach der Aktion, in der der Körper die Kraft abfängt, überschwingt, ausschwingt und in eine Ruhepose zurückkehrt. Ihre Haltezeiten zeigen, wie viel Kraft im Spiel war.
  - term: Erkennungspose
    definition: Die Pose einer Aktion, an der ein Zuschauer erkennt, was die Figur tut. Im Spiel zählst du die Ticks vom Druck bis zu ihr.
  - term: Fassung
    definition: Ein gespeicherter Stand einer Animation, als eigene Datei oder eigener Commit, etwa figur-v1, figur-v2. Eine Fassung ersetzt nie die vorige.
  - term: Flugphase
    definition: Der Moment eines Laufzyklus, in dem kein Fuß den Boden berührt. Unterscheidet Laufen vom Gehen; der Körper ist dort am höchsten.
  - term: Follow-through
    definition: Lose Teile bewegen sich weiter, nachdem die Figur angehalten hat, und schwingen mit abnehmendem Ausschlag aus. Das Gegenstück beim Losgehen heißt Drag.
  - term: Frame-Dauer
    definition: In Godot der relative Faktor, mit dem ein Bild einer SpriteFrames-Animation länger oder kürzer steht. Dauer in Sekunden = Frame-Dauer / (FPS × Abspieltempo).
  - term: Gangzyklus (Walk Cycle)
    definition: Eine Bildfolge, die in Schleife einen Gang zeigt. Sie enthält zwei Schritte mit je den Posen Kontakt, Tiefpunkt, Passing und Hochpunkt.
  - term: Haltezeit
    definition: Eine Zeichnung, die länger steht als ihre Nachbarn, meist ein Key. Englisch Hold.
  - term: Kochen (Boiling)
    definition: Kanten, die in jedem Bild neu gezeichnet wurden und deshalb zittern, obwohl die Figur stillsteht. In manchen Zeichentrickserien Stilmittel, in Pixelart meist ungewolltes Rauschen.
  - term: Kontaktbild
    definition: Das Bild, in dem ein Fuß oder ein Ball den Boden berührt. Ein tragender Fuß bleibt vom Kontaktbild bis zum Abheben auf denselben Pixeln; ein Ball ist dort am stärksten gestaucht.
  - term: Lot
    definition: Die senkrechte Linie vom Schwerpunkt nach unten. Mit ihr prüfst du an einer Zeichnung, ob die Figur steht oder kippt.
  - term: Mehlsack
    definition: Klassische Animationsübung mit einem Sack ohne Gesicht und Gliedmaßen. Alles, was er zeigt, kommt aus Haltung, Stauchung und Timing. Englisch Flour Sack.
  - term: Modellblatt (Model Sheet)
    definition: Ein Blatt, das Proportionen, Ansichten und typische Posen einer Figur festhält, damit sie in jedem Bild gleich aussieht.
  - term: Notify
    definition: In Unreal eine Marke in einer Animation, die zu einem bestimmten Bild ein Ereignis auslöst, etwa einen Schrittton. In Godot entspricht dem etwa das Signal frame_changed mit einer Prüfung der Bildnummer.
  - term: On Model
    definition: Eine Zeichnung, die zur festgelegten Figur passt, in Proportionen, Details, Kontur, Licht und Farben. Das Gegenteil heißt off model und kann ein Fehler oder eine bewusste Entscheidung sein.
  - term: Onion Skinning
    definition: Anzeige der Bilder vor und nach dem aktuellen als blasse, oft getönte Schatten. Zeigt Spacing, Bögen und Formfehler beim Zeichnen.
  - term: Overlapping Action
    definition: Teile einer Figur bewegen sich mit versetztem Timing, weil die Hauptbewegung sie mitzieht, etwa die Hand ein Bild nach dem Ellbogen.
  - term: Passing
    definition: Die Pose eines Gangs, in der das freie Bein am Standbein vorbeischwingt. Beim Gehen steigt der Körper dort, der Kopf ist nicht am tiefsten.
  - term: Pose-to-Pose
    definition: Arbeitsweise, bei der zuerst die Keys entstehen und danach die Lücken gefüllt werden. Das Gegenstück Straight Ahead zeichnet Bild für Bild vom Anfang bis zum Ende durch.
  - term: Posentest
    definition: Abspielen nur der Keys mit ihren geplanten Dauern, bevor Breakdowns und Zwischenbilder entstehen. Prüft Lesbarkeit und Timing, solange Änderungen billig sind.
  - term: Prüfstand
    definition: Godot-Szene dieses Kurses, die eigene Animationen im Spieltakt abspielt, anhält, Bild für Bild weiterschaltet und jeden Bildwechsel mit Tick protokolliert.
  - term: Rückprallfaktor
    definition: Der Anteil der vorigen Höhe, den ein Ball nach jedem Aufprall wieder erreicht, etwa 0,6 für einen Basketball. In der Animation eine Entscheidung über das Material.
  - term: Ruhezyklus (Idle)
    definition: Die Schleife, die läuft, während eine Figur steht. Wenige Bilder, gleiche Masse, kleine Amplitude und ungleiche Dauern, damit sie nicht tickt.
  - term: Schleifenpunkt
    definition: Die Stelle, an der ein Zyklus vom letzten Bild ins erste übergeht. Passen beide nicht zueinander, springt die Figur bei jeder Wiederholung.
  - term: Schlüsselpose (Key)
    definition: Eine Pose, die Anfang oder Ende eines Bewegungsabschnitts festlegt. Die Folge der Keys erzählt, was passiert; wer nur sie sieht, versteht die Handlung.
  - term: Schwerpunkt
    definition: Der nach Masse gewichtete Mittelpunkt eines Körpers; beim aufrecht stehenden Erwachsenen rund 10 cm über dem Ansatz des Oberschenkels an der Hüfte. Er wandert mit jeder Bewegung von Gliedern und Last.
  - term: Secondary Action
    definition: Eine eigene, zusätzliche Handlung neben der Hauptbewegung, etwa im Gehen pfeifen. Sie soll die Hauptbewegung stützen, nicht ablenken.
  - term: Spacing
    definition: Der Abstand zwischen aufeinanderfolgenden Zeichnungen. Dicht beieinander heißt langsam, weit auseinander heißt schnell.
  - term: Spacing-Chart
    definition: Kleines Diagramm zwischen zwei Keys mit einem Strich für jede Zeichnung. Zeigt, wo eine Bewegung beschleunigt und bremst; oft auch Timing-Chart genannt.
  - term: Squash & Stretch
    definition: Stauchen und Strecken eines Körpers in Bewegungsrichtung, wobei seine Menge gleich bleibt. In einer Zeichnung bleibt Breite mal Höhe ungefähr konstant.
  - term: Stützfläche
    definition: Die Fläche, auf der ein Körper steht, bei zwei Füßen beide Füße und alles dazwischen. Steht eine Figur still, fällt das Lot von ihrem Schwerpunkt hinein.
  - term: Sub-Pixel-Animation
    definition: Eine Bewegung unter einem Pixel, vorgetäuscht durch Zwischentöne an Kanten oder wanderndes Licht im Inneren, während die Silhouette fast gleich bleibt.
  - term: Suggestivfrage
    definition: Eine Frage, die die Antwort oder eine Auswahl davon enthält, etwa „Wirkt sie müde?“. Befragte übernehmen dann oft die Wörter der Fragenden.
  - term: Tag
    definition: Benannter Bereich von Bildern in einer Animationsdatei, in Aseprite und LibreSprite mit Abspielrichtung (vorwärts, rückwärts, Ping-Pong). Trennt mehrere Animationen einer Figur; der Name wird zum Animationsnamen im Spiel.
  - term: Tick
    definition: Ein Takt der Spielphysik, in Godot standardmäßig 1/60 Sekunde oder rund 16,7 ms. Läuft das Spiel mit 60 Bildern pro Sekunde, steht jede Zeichnung eine ganze Zahl von Ticks.
  - term: Timing
    definition: Die Zeit, die eine Bewegung bekommt – Zahl der Bilder und Dauer jedes Bilds. Eines der zwölf Prinzipien von Thomas und Johnston.
  - term: Überarbeitungsprotokoll
    definition: Eintrag je Fassung mit Datum, Absichtssatz, Beobachtung (eigene und Beobachtungstest), Änderung mit Bildern und Zahlen, Grund und Ergebnis nach der Änderung.
  - term: Überschwingen (Overshoot)
    definition: Ein Körper kommt am Ende einer Bewegung ein Stück über das Ziel hinaus, bevor er zurückpendelt. In Pixelart oft ein Bild um ein, zwei Pixel.
  - term: Variante
    definition: Kopie der Basis, die sich in genau einer Größe unterscheidet, etwa einer Haltezeit, der Stauchung oder dem Versatz eines Teils.
  - term: Verknüpftes Cel
    definition: Cel, das sich ein Bild mit anderen Cels teilt; eine Änderung wirkt auf alle. In Krita Clone Frame genannt.
  - term: Versatz
    definition: Zahl der Bilder, um die ein weicher Teil wie ein Schwanz oder Band der Bewegung des Körpers nachläuft. Steuert die Überlappung.
  - term: Wischbild (Smear)
    definition: Ein Bild zwischen zwei Keys, das eine schnelle Bewegung als gestreckte, verwischte Form entlang ihres Weges zeigt. Steht kurz und kommt nur bei echtem Tempo vor.
  - term: Zustandswechsel
    definition: Der Moment, in dem eine Figur von einem Zustand in einen anderen geht, etwa vom ruhigen Gehen ins Horchen. Lesbar durch Posenkontrast, Haltezeit auf der neuen Pose und, wo nötig, ein Übergangsbild.
  - term: Zwischenbild (Inbetween)
    definition: Ein Bild, das den Weg zwischen Key und Breakdown füllt, ohne etwas Neues zu erzählen.
