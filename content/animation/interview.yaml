cards:
  - id: bs-key-breakdown-zwischenbild
    module: beobachten-schluesselposen
    q: Was ist der Unterschied zwischen Key, Breakdown und Zwischenbild?
    a: |
      Keys sind die Posen, die erzählen, was passiert; wer nur sie sieht, versteht die Handlung. Ein Breakdown liegt zwischen zwei Keys und legt fest, auf welchem Weg die Figur von einem zum anderen kommt. Zwischenbilder füllen den Rest, ohne etwas Neues zu zeigen. Beim Aufstehen vom Stuhl sind Sitzen und Stehen die Keys, die vorgebeugte Pose mit der Brust über den Knien ist der Breakdown; ohne ihn schwebt die Figur senkrecht hoch.
    tags: [schlüsselpose, breakdown, grundlagen]
    level: 1
  - id: bs-referenz-ohne-abpausen
    module: beobachten-schluesselposen
    q: Wie nutzt du eine Videoreferenz, ohne sie abzupausen?
    a: |
      Als Beleg für Timing und Posen, nicht als Vorlage. Ich gehe die Aufnahme Bild für Bild durch, notiere die Bildnummern der wichtigen Posen und rechne die Zeit dazwischen aus. Dann zeichne ich die Posen neu, mit den Proportionen meiner Figur, lasse weg und übertreibe. Slynyrd beschreibt genau das: 72 Bilder Video, 8 von Hand ausgewählt, Dauern angepasst, dann mit weiteren Referenzen verglichen.
    tags: [referenz, rotoskopie, arbeitsweise]
    level: 1
  - id: bs-pose-to-pose-im-spiel
    module: beobachten-schluesselposen
    q: Warum arbeiten Animatoren für Spiele meist Pose-to-Pose?
    a: |
      Weil Keys und Timing dann feststehen, bevor das erste Zwischenbild existiert. Ich kann die Keys im Spiel oder als Daumenkino testen und Timing und Posen billig ändern. Bei Cuphead kamen nach Jake Clark erst die Keys, dann die Breakdowns, dann die volle Animation. Straight Ahead nehme ich für Dinge ohne feste Form, etwa Rauch oder ein flatterndes Tuch, oft kombiniert mit Pose-to-Pose für den Körper.
    tags: [pose-to-pose, straight-ahead, arbeitsweise]
    level: 2
  - id: bs-zeitlupe-umrechnen
    module: beobachten-schluesselposen
    q: In einer Zeitlupe mit 120 Bildern pro Sekunde zählst du 36 Bilder für eine Bewegung. Wie lange dauert sie wirklich?
    a: |
      36 / 120 Sekunden, also 300 ms. Es zählt die Aufnahmerate, nicht die Wiedergaberate. Teile ich durch 30, weil das Video mit 30 Bildern pro Sekunde abgespielt wird, komme ich auf 1200 ms und plane die Bewegung viermal zu langsam.
    tags: [referenz, timing, rechnen]
    level: 1
  - id: ts-timing-spacing
    module: timing-spacing
    q: Was ist der Unterschied zwischen Timing und Spacing?
    a: |
      Timing ist, wie lange eine Bewegung dauert und wie lange jede Zeichnung steht. Spacing ist, wie weit die Zeichnungen auseinanderliegen. Bei gleicher Gesamtzeit und Bildzahl macht das Spacing aus einer gleichmäßigen Bewegung eine, die beschleunigt oder bremst. Wenn eine Bewegung nicht stimmt, frage ich deshalb zuerst, welche der beiden Größen falsch ist.
    tags: [timing, spacing, grundlagen]
    level: 1
  - id: ts-ball-ohne-ease
    module: timing-spacing
    q: Ein hüpfender Ball wirkt, als würde er sanft auf den Boden gesetzt. Woran liegt das meistens?
    a: |
      Am Spacing vor dem Kontakt. Im freien Fall wachsen die Abstände gleichmäßig, nach Galilei wie 1 : 3 : 5 : 7, und der größte Abstand liegt direkt vor dem Boden. Wer dort aus Gewohnheit abbremst, setzt einen Ease in den Aufprall. Der Scheitel bekommt das Ease, der Boden nicht.
    tags: [spacing, ball, gewicht]
    level: 1
  - id: ts-haltezeiten
    module: timing-spacing
    q: Warum sollten in einer Sprite-Animation nicht alle Bilder gleich lang stehen?
    a: |
      Weil Keys und Zwischenbilder verschiedene Aufgaben haben. Keys sind die Posen, an denen man die Handlung erkennt, sie brauchen Zeit, um gelesen zu werden. Zwischenbilder und Wischbilder zeigen den Weg und dürfen vorbeihuschen. Mariel Cartwright beschreibt für Skullgirls, dass gleich lange Haltezeiten Bilder verschwenden. Eine Haltezeit kostet keine neue Zeichnung.
    tags: [timing, haltezeit, pixelart]
    level: 1
  - id: ts-ticks
    module: timing-spacing
    q: Du hast im Editor 80 ms pro Bild eingestellt. Was passiert damit in einem Spiel mit 60 Ticks pro Sekunde?
    a: |
      80 ms sind 4,8 Ticks. Ein Bild kann im Spiel nur ganze Ticks lang stehen, also stehen manche Bilder 5 Ticks und manche 4. Über einen Zyklus aus fünf Bildern kommt es aufs Gleiche heraus, aber der Takt ist ungleichmäßig. Dauern wie 50, 100 oder 150 ms gehen genau auf; wenn ich 5 Ticks meine, trage ich in Godot 12 FPS ein statt 83 ms.
    tags: [timing, ticks, godot]
    level: 2
  - id: ts-wirkung-pruefen
    module: timing-spacing
    q: Du willst, dass eine Bewegung zögernd wirkt. Woher weißt du, ob dir das gelungen ist?
    a: |
      Nicht aus einer Regel, sondern aus Beobachtung. Ich schreibe vorher einen Absichtssatz, zeige die Animation jemandem ohne Vorrede und frage nur, was passiert. Die Antwort notiere ich wörtlich und vergleiche sie mit meiner Absicht. Timing-Konventionen helfen beim Entwerfen, aber erst ein Zuschauer zeigt, ob sie bei ihm ankommen.
    tags: [wirkung, beobachtungstest]
    level: 2
  - id: bu-gerade-zwischenbilder
    module: boegen-ueberlappung
    q: Ein Arm dreht von unten nach oben, und in der Mitte der Bewegung zuckt die Hand zur Schulter. Woran liegt das?
    a: |
      Die Zwischenbilder liegen auf der Geraden zwischen den Keys statt auf dem Bogen. Weil der Arm um die Schulter dreht, läuft die Hand auf einem Kreis; die Gerade schneidet ihn ab, und in der Mitte wird der Arm kürzer, bei 90 Grad um fast ein Drittel. Ich verfolge einen Punkt durch alle Bilder, auf Haftzetteln oder mit Onion Skinning, und setze die Zwischenbilder auf den Bogen.
    tags: [bogen, zwischenbild, fehlersuche]
    level: 2
  - id: bu-overlap-secondary
    module: boegen-ueberlappung
    q: Was ist der Unterschied zwischen Overlapping Action und Secondary Action?
    a: |
      Overlapping Action heißt, dass Teile einer Figur mit versetztem Timing laufen, weil die Hauptbewegung sie mitzieht: Haare, Kleidung, die Hand nach dem Ellbogen. Secondary Action ist eine eigene, zusätzliche Handlung, etwa im Gehen pfeifen oder auf die Uhr schauen. Sie soll die Hauptbewegung stützen, nicht ablenken. In Spiel-Tutorials heißt nachziehendes Haar trotzdem oft „secondary animation“; entscheidend ist, ob das Teil bewegt wird oder die Figur handelt.
    tags: [overlapping-action, secondary-action, begriffe]
    level: 2
  - id: bu-schal-wenige-bilder
    module: boegen-ueberlappung
    q: Wie planst du einen Schal, der nachschwingt, in einem Sprite mit wenigen Bildern?
    a: |
      Als Kette: Jedes Glied übernimmt die Stellung des Glieds darüber aus dem Bild davor, also ein Bild Versatz je Glied. Hält die Figur an, schwingt das Ende über und zurück, und jeder Ausschlag ist kleiner als der vorige, bis er unter ein Pixel fällt. Die Pixelgruppen des Schals bleiben dabei zusammen. Ich plane das zuerst als Bildliste mit Winkeln oder Pixeln, dann zeichne ich.
    tags: [follow-through, pixelart, planung]
    level: 2
  - id: bu-flattern
    module: boegen-ueberlappung
    q: Ein Haarbüschel in deiner Ruheanimation flackert, statt zu schwingen. Was prüfst du?
    a: |
      Ob es jedes Bild um ein Pixel hin und her springt, ohne Richtung und ohne Ende. Ein Nachschwingen braucht einen Ausschlag, der in eine Richtung geht und abnimmt, und es sollte ein Bild nach dem Kopf kommen, nicht gleichzeitig. Saint11 rät, Pixelgruppen nicht aufzubrechen; ich bewege das Büschel als Ganzes. Reicht das nicht, lasse ich das lose Teil weg.
    tags: [overlapping-action, pixelart, fehlersuche]
    level: 2
  - id: sb-lot-stuetzflaeche
    module: schwerpunkt-balance
    q: Wann steht eine Figur im Gleichgewicht, und wie prüfst du das an einer Zeichnung?
    a: |
      Wenn das Lot, die senkrechte Linie von ihrem Schwerpunkt nach unten, in die Stützfläche fällt, also auf die Füße oder zwischen sie. Ich schätze den Schwerpunkt, beim Stehen etwa auf Hüfthöhe, ziehe das Lot mit einem Lineal und markiere die Füße auf der Bodenlinie. Liegt das Lot daneben, kippt die Figur, bis ein Fuß sie auffängt; das ist bei einem Schritt gewollt, im Stand nicht.
    tags: [schwerpunkt, gleichgewicht, grundlagen]
    level: 1
  - id: sb-aufstehen-schwebt
    module: schwerpunkt-balance
    q: Eine animierte Figur schwebt beim Aufstehen senkrecht aus dem Stuhl. Was fehlt?
    a: |
      Die Gewichtsverlagerung vor dem Strecken. Im Sitzen tragen Sitzfläche und Füße gemeinsam. Damit die Füße allein tragen, muss der Oberkörper erst so weit nach vorn, dass das Lot über den Füßen liegt; erst dann hebt das Gesäß ab. Diese vorgebeugte Pose ist der Breakdown, der fehlt.
    tags: [schwerpunkt, breakdown, fehlersuche]
    level: 2
  - id: sb-draufsicht-sprung
    module: schwerpunkt-balance
    q: Wie zeigst du in einem Top-down-Spiel, dass eine Figur springt?
    a: |
      Über den Abstand zum Schatten. Der Schatten bleibt am Bodenpunkt der Figur, die Höhe zeichne ich als Versatz nach oben: Figur-Zeile gleich Schatten-Zeile minus Höhe. Steigen Figur und Schatten gemeinsam, hat sich der Bodenpunkt verschoben, und das ist eine Bewegung nach hinten. Den Ursprung des Sprites lege ich an die Füße, damit Schatten und Füße beim Landen zusammentreffen.
    tags: [draufsicht, schatten, top-down]
    level: 2
  - id: sb-rutschender-fuss
    module: schwerpunkt-balance
    q: Woran erkennst du in einer Bildliste einen rutschenden Standfuß?
    a: |
      Ein Fuß, der Gewicht trägt, hat vom Kontaktbild bis zum Abheben in jedem Bild dieselbe Position. Ändert sich sein x-Wert in diesem Abschnitt, rutscht er, oft genau in dem Bild, in dem das andere Bein aufsetzt. Im Editor prüfe ich das mit Onion Skinning: Der tragende Fuß muss deckungsgleich sein. Rutscht er erst im Spiel, passt das Tempo nicht zur Schrittlänge.
    tags: [bodenkontakt, fehlersuche, bildliste]
    level: 1
  - id: ga-fallen-gewicht
    module: gewicht-aufprall
    q: Fällt eine Bowlingkugel schneller als ein gleich großer Gummiball? Was heißt das für die Animation?
    a: |
      Nein, ohne nennenswerten Luftwiderstand fallen beide gleich schnell; das hat der Hammer-Feder-Versuch von Apollo 15 auf dem Mond gezeigt. Den Fall plane ich deshalb für beide gleich. Das Gewicht zeige ich an den Enden der Bewegung: Verformung und Rückprall beim Aufprall, Haltezeiten danach, die Reaktion der Umgebung und bei Figuren das Anfahren.
    tags: [gewicht, aufprall, grundlagen]
    level: 1
  - id: ga-squash-flaeche
    module: gewicht-aufprall
    q: Was ist die wichtigste Regel bei Squash & Stretch, und wie wendest du sie in Pixelart an?
    a: |
      Die Menge bleibt gleich, nur die Form ändert sich. In einer Zeichnung heißt das: Breite mal Höhe bleibt ungefähr konstant. Ein 16 × 16 Pixel großer Ball wird bei 12 Pixeln Höhe etwa 21 breit; schon ein Pixel flacher verlangt ein Pixel breiter. Bei runden Formen zähle ich die Pixel nach. Steife Gegenstände verformen sich kaum, und gestaucht wird nur im Kontaktbild, nie in der Luft.
    tags: [squash-and-stretch, pixelart, rechnen]
    level: 1
  - id: ga-rueckprall-planen
    module: gewicht-aufprall
    q: Wie planst du die Hüpfer eines Balls, bis er liegt?
    a: |
      Mit einem Rückprallfaktor: Jeder Rückprall erreicht einen festen Anteil der vorigen Höhe, ein Basketball nach FIBA-Regel knapp 60 %. Die Fallzeit wächst mit der Wurzel der Höhe, also werden die Hüpfer auch kürzer. Ich rechne die Höhen aus, bis sie unter ein Pixel fallen, und plane danach eine Ruhe. Den Faktor wähle ich nach Material und prüfe am Zuschauer, ob er das Material erkennt.
    tags: [aufprall, rückprall, rechnen]
    level: 2
  - id: ga-schwer-heben
    module: gewicht-aufprall
    q: Wie zeigst du, dass eine Figur etwas Schweres hebt und nicht etwas Leichtes?
    a: |
      Über Timing und Haltung. Schweres reagiert langsamer: mehr Zeit beim Greifen und Anheben, ein langsamer Start, die Last löst sich spät vom Boden. Die Figur geht tiefer, die Hüfte weiter nach hinten, die Last bleibt nah am Körper. Ob „schwer“ ankommt oder „zögerlich“, prüfe ich mit einem Beobachtungstest; oft reicht das Timing allein nicht, und ich ändere zusätzlich die Haltung.
    tags: [gewicht, timing, körpersprache]
    level: 2
  - id: ae-drei-phasen
    module: antizipation-erholung
    q: Aus welchen Phasen besteht eine kräftige Bewegung, und welche ist meistens die kürzeste?
    a: |
      Aus Antizipation, Aktion und Erholung. Die Antizipation holt in die Gegenrichtung aus und kündigt an, was kommt. Die Aktion ist der Moment, in dem die Kraft wirkt, und meist die kürzeste Phase, oft nur ein, zwei Bilder. In der Erholung kommt der Körper über das Ziel hinaus, schwingt zurück und findet in eine Ruhepose. Saint11 teilt einen Aufprall noch feiner in Ruhe, Ausholen, Aktion, Überschwingen, Ruhe.
    tags: [antizipation, erholung, timing]
    level: 1
  - id: ae-schieben-statt-werfen
    module: antizipation-erholung
    q: Deine Figur wirft eine Kiste, aber Zuschauer beschreiben ein Schieben. Was prüfst du zuerst?
    a: |
      Die Antizipation. Ich sehe nach, ob die Ausholpose gegen die Wurfrichtung geht, also Arme und Gewicht nach hinten, und ob sie lange genug steht, um gelesen zu werden. Liegt sie schon in Wurfrichtung oder steht sie so kurz wie ein Zwischenbild, fehlt die Gegenbewegung. Danach ändere ich nur diese eine Pose und zeige die neue Fassung jemandem, der die alte nicht kennt.
    tags: [antizipation, beobachtungstest]
    level: 2
  - id: ae-wischbild
    module: antizipation-erholung
    q: Wann setzt du ein Wischbild ein, und wie lange steht es?
    a: |
      Wenn der Weg zwischen zwei Keys so groß ist, dass der Gegenstand von einem Bild zum nächsten springt. Das Wischbild zeigt ihn als gestreckte Form entlang des Weges. Es steht kurz, kürzer als die Keys; bei Slynyrd sind es 50 ms, im Spiel 3 Ticks. An langsamen, gut lesbaren Bewegungen und beim Ausholen oder Zurückkehren lasse ich es weg, weil es dort nur ablenkt.
    tags: [smear, aktion, pixelart]
    level: 2
  - id: ae-gewicht-haltezeiten
    module: antizipation-erholung
    q: Wie zeigst du in Pixelart, dass eine Waffe oder ein Gegenstand schwer ist, ohne mehr Bilder zu zeichnen?
    a: |
      Über die Haltezeiten vor und nach der Aktion. Slynyrd animiert Schwert, Speer und Hammer mit je sechs Bildern; das Ausholen wächst von 100 auf 250 ms, das gehaltene Bild nach dem Schlag von 100 auf 300 ms, die Bilder des Schlags bleiben bei 50 ms. Der schwere Schlag kommt also nicht langsamer, er braucht länger, bevor er fällt, und länger, bis die Figur wieder steht. Ob das schwer gelesen wird, prüfe ich mit einem Zuschauer, und im Spiel kläre ich, wie viel Ausholen die Steuerung verträgt.
    tags: [gewicht, timing, haltezeit]
    level: 2
  - id: gl-gangposen
    module: gehen-laufen
    q: Welche Posen hat ein Gangzyklus, und wo ist der Kopf am tiefsten?
    a: |
      Ein Zyklus hat zwei Schritte, jeder mit Kontakt, Tiefpunkt, Passing und Hochpunkt. Tief ist der Kopf nahe dem Kontakt, wenn das vordere Bein das Gewicht abfängt, hoch um das Passing, wenn der Körper auf dem Standbein steht. Die Arme schwingen gegen die Beine, und der tragende Fuß wandert gleichmäßig nach hinten. Ein Kopf, der beim Passing am tiefsten ist, lässt die Figur bei jedem Schritt einknicken.
    tags: [gehen, zyklus, grundlagen]
    level: 1
  - id: gl-laufen-ist-kein-schneller-gang
    module: gehen-laufen
    q: Was unterscheidet einen Laufzyklus von einem Gangzyklus mit kürzeren Bilddauern?
    a: |
      Die Flugphase. Beim Laufen gibt es einen Moment ohne Bodenkontakt, und der höchste Punkt liegt in der Luft, während er beim Gehen oben auf dem Standbein liegt. Dazu kommen Vorlage und weitere Schrittposen. Ein beschleunigter Gang hat nichts davon; er wird hastig, aber er läuft nicht. Deshalb zeichne ich einen Laufzyklus eigens.
    tags: [laufen, zyklus]
    level: 2
  - id: gl-bilder-kuerzen
    module: gehen-laufen
    q: Du kürzt einen Zyklus von acht auf vier Bilder. Was behältst du, und was musst du anpassen?
    a: |
      Kontakt und Passing bleiben, sie tragen den Schritt; Slynyrd streicht zuerst das Rückfederbild, das dem Kontakt ähnelt, dann den Hochpunkt. Anpassen muss ich die Dauern: Mit gleichen Dauern wäre der Zyklus halb so lang und die Figur doppelt so schnell. Slynyrd stellt deshalb 160 statt 80 ms je Bild ein. Danach prüfe ich, ob das Auf und Ab des Kopfes noch da ist.
    tags: [zyklus, timing, pixelart]
    level: 2
  - id: gl-ruhezyklus
    module: gehen-laufen
    q: Wie verhinderst du, dass ein Ruhezyklus mechanisch tickt?
    a: |
      Mit ungleichen Dauern: Die Enden der Bewegung stehen länger als die Mitte, oben und unten nicht gleich lang. Ich halte die Masse gleich, also wird die Figur breiter, wenn sie sinkt, und ich bewege nicht nur senkrecht. Teile wie der Kopf dürfen ein Bild später folgen. Mehrere Schleifen auf einem Bild bekommen verschiedene Längen, damit man nicht sieht, wo sie neu beginnen.
    tags: [idle, zyklus, timing]
    level: 2
  - id: ks-beobachtungstest
    module: koerpersprache
    q: Wie läuft ein Beobachtungstest ab?
    a: |
      Vorher schreibe ich einen Absichtssatz und meine Fragen auf und prüfe, dass nichts im Material die Absicht verrät, auch kein Dateiname. Dann zeige ich die Animation ohne Vorrede dreimal in Schleife und frage offen: „Was passiert da?“, bei Zuständen danach „Wie fühlt sich die Figur?“, gezielte Fragen ganz zum Schluss. Die Antworten notiere ich wörtlich, ohne zu erklären oder zu korrigieren. Zum Schluss vergleiche ich sie mit dem Absichtssatz und entscheide selbst, was sich ändert.
    tags: [beobachtungstest, wirkung]
    level: 1
  - id: ks-suggestivfrage
    module: koerpersprache
    q: Warum fragst du im Test nicht „Wirkt die Figur müde?“
    a: |
      Weil die Frage die Antwort enthält. Befragte übernehmen oft die Wörter der Fragenden; die Nielsen Norman Group warnt, dass suggestive Fragen deshalb verzerrte Antworten liefern. Wer „müde“ fragt, hört „müde“ und weiß nicht, ob es jemand gesehen hätte. Ich frage zuerst „Was passiert da?“ und dann nach dem Zustand, ohne einen zu nennen.
    tags: [beobachtungstest, fragen]
    level: 2
  - id: ks-abweichung
    module: koerpersprache
    q: Eine Testperson liest deine Animation anders, als du sie gemeint hast. Was machst du damit?
    a: |
      Ich notiere die Antwort wörtlich und behandle sie als Information, nicht als Urteil. Dann frage ich mich, was in den Bildern zu dieser Lesart führen könnte, etwa ob nur das Tempo gelesen wurde und die Haltung nicht. Eine Antwort ist aber kein Beleg. Bevor ich eine Regel daraus mache, will ich ein Muster bei mehreren Personen sehen, die die Animation noch nicht kannten.
    tags: [beobachtungstest, ueberarbeiten]
    level: 2
  - id: ks-zustandswechsel
    module: koerpersprache
    q: Wie machst du einen Zustandswechsel lesbar, etwa eine Figur, die geht, etwas hört und stehen bleibt?
    a: |
      Mit drei Dingen. Kontrast: Die neue Pose unterscheidet sich deutlich von der alten, schon in der Silhouette. Haltezeit: Sie steht lange genug, damit man sie liest. Übergang: Ein Übergangsbild zeigt den Weg, oft geht der Kopf voraus. Bei kleinen Pixelfiguren übertreibe ich, weil ein Pixel leicht untergeht, und prüfe mit einem Beobachtungstest, ob der Wechsel gesehen wird.
    tags: [zustand, koerpersprache, pose]
    level: 2
  - id: fk-on-model
    module: form-konstanz
    q: Was heißt „on model“, und wie hältst du eine Pixelfigur über alle Bilder auf Modell?
    a: |
      On model heißt, dass jedes Bild zur festgelegten Figur passt: Maße, Masse, Details, Konturstärke, Lichtseite und Palette. Ich arbeite mit einem Modellblatt, kopiere Bilder, statt sie neu zu zeichnen, verknüpfe unveränderte Teile und lege bewegliche Teile auf eigene Ebenen. Gewollte Änderungen wie Stauchen oder Wischbilder schreibe ich mit Grund in die Bildliste.
    tags: [konstanz, modellblatt, pixelart]
    level: 1
  - id: fk-flackern-finden
    module: form-konstanz
    q: Deine Schleife flackert, aber jedes Einzelbild sieht gut aus. Wie findest du den Fehler?
    a: |
      Ich spiele die Schleife in Originalgröße und voller Geschwindigkeit mehrmals ab und notiere, wo es flackert. Dann lege ich die betroffenen Bilder mit Onion Skinning auf ihre Nachbarn und zähle Kopfmaße, Augenreihe und Konturstärke. Meist ist es ein Pixel: ein Kopf, der wächst, ein Auge, das springt, eine doppelte Kontur oder eine Farbe, die nur in einem Bild vorkommt. Repariert wird durch Kopieren aus einem guten Bild, danach spiele ich wieder ab.
    tags: [konstanz, fehlersuche, onion-skinning]
    level: 2
  - id: fk-subpixel
    module: form-konstanz
    q: Was ist Sub-Pixel-Animation, und wo liegt ihre Grenze?
    a: |
      Eine Bewegung unter einem Pixel, vorgetäuscht durch Zwischentöne an der Kante oder durch Licht, das im Inneren wandert, während die Silhouette fast gleich bleibt. Sie eignet sich für kleine Bewegungen wie Atmen. Die Grenze ist die Klarheit: Viele Zwischentöne machen die Figur unscharf, und Töne, die auftauchen und verschwinden, flackern. Ich prüfe sie deshalb immer in der Schleife.
    tags: [subpixel, pixelart, konstanz]
    level: 2
  - id: ais-reaktion-gegen-gewicht
    module: animation-im-spiel
    q: Wie bringst du eine ausdrucksstarke Animation und eine direkte Steuerung zusammen?
    a: |
      Ich trenne, was der Spieler auslöst, von dem, was er beantworten soll. Bei Aktionen der Spielfigur zeigt schon das erste Bild nach dem Druck eine sichtbare Änderung, Ausholen bleibt kurz oder wird durch eine starke erste Pose ersetzt. Gewicht kann in der Erholung und im Nachschwingen liegen, wie bei Saint11s Angriff ohne Antizipationsbild. Gegner dürfen lange ausholen, weil der Spieler darauf reagieren soll. Ob es passt, messe ich in Ticks und frage jemanden an der Tastatur.
    tags: [steuerung, antizipation, spielgefühl]
    level: 3
  - id: ais-zwei-zeitpunkte
    module: animation-im-spiel
    q: Welche zwei Zeitpunkte misst du bei einer Aktion der Spielfigur?
    a: |
      Erstens die Ticks vom Druck bis zum ersten Bild, das sich sichtbar von der Ruhe unterscheidet; daran merkt der Spieler, dass seine Eingabe ankam. Zweitens die Ticks bis zur Erkennungspose, an der man sieht, was die Figur tut. Beginnt eine Bildliste mit Bildern, die wie die Ruhe aussehen, verliert der erste Wert Zeit, ohne dass etwas zu sehen ist.
    tags: [ticks, eingabe, messen]
    level: 2
  - id: ais-uebergangsanimation
    module: animation-im-spiel
    q: Wann lohnt sich eine Wende- oder Startanimation, und was kostet sie?
    a: |
      Sie kann einer Figur Gewicht geben; bei Owlboy wirkte die Figur nach Aussage des Entwicklers mit kleinen Wendeanimationen schwerer als mit sofortigem Richtungswechsel. Sie kostet aber Ticks, in denen die Figur nicht tut, was der Spieler will. Dead Cells dreht den Helden in einem Fall sogar unbemerkt sofort um. Ich lege für jede Übergangsanimation fest, ob und ab welchem Bild der Spieler sie abbrechen darf, und prüfe die Wirkung mit Testspielern.
    tags: [übergänge, steuerung, abbruch]
    level: 3
  - id: ais-ton-markieren
    module: animation-im-spiel
    q: Wie bereitest du als Animator den Ton einer Animation vor?
    a: |
      Ich markiere die Bilder, die einen Ton tragen, als Bildnummern: Kontaktbilder für Schritte, das Aufprallbild für einen Aufprall, bei Treffern das Bild, in dem der Treffer zählt. Keine Millisekunden, damit der Ton beim nächsten Timing-Wechsel mit seinem Bild wandert. Engines hängen Töne an solche Marken, Unreal über Notifies, Godot zum Beispiel über das Signal frame_changed. Wie der Ton klingt, entscheidet die Tongestaltung.
    tags: [ton, kontaktbild, pipeline]
    level: 2
  - id: ez-cel-frame-ebene
    module: editor-zeitleiste
    q: Was ist der Unterschied zwischen Bild, Ebene und Cel in einer Animations-Zeitleiste?
    a: |
      Bilder sind die Spalten, also die Zeitpunkte der Animation; Ebenen sind die Zeilen, etwa Figur und Schatten. Ein Cel ist das Bild einer Ebene in einem bestimmten Bild der Animation. Verknüpfte Cels teilen sich ein Bild, in Krita heißen sie Clone Frames; wer eines ändert, ändert alle.
    tags: [editor, zeitleiste, grundlagen]
    level: 1
  - id: ez-dauer-je-programm
    module: editor-zeitleiste
    q: Wie speichern Aseprite, Pixelorama und Krita die Dauer eines Bildes?
    a: |
      Aseprite und LibreSprite speichern je Bild Millisekunden. Pixelorama hat eine Bildrate für die Zeitleiste und je Bild einen Faktor, wie Godots Frame-Dauer. Krita zählt Felder einer festen Bildrate und hält jede Zeichnung bis zur nächsten. Bei 20 Bildern pro Sekunde wird in Pixelorama und Krita jedes Vielfache von 50 ms ein ganzer Faktor oder eine ganze Zahl Felder.
    tags: [editor, timing, werkzeuge]
    level: 1
  - id: ez-onion-skinning
    module: editor-zeitleiste
    q: Wofür nutzt du Onion Skinning, und wann schaltest du es aus?
    a: |
      Damit sehe ich beim Zeichnen die Bilder davor und danach. Die Abstände zwischen den Schatten zeigen das Spacing, der Weg eines Punkts über alle Schatten zeigt, ob er auf einem Bogen läuft, und Größenunterschiede verraten Fehler in der Konstanz. Aus schalte ich es, wenn ich ein Einzelbild für sich beurteile, etwa seine Silhouette, und beim Abspielen. In Krita brauche ich dafür eine nicht deckende Ebene.
    tags: [onion-skinning, spacing, editor]
    level: 1
  - id: ez-export-timing
    module: editor-zeitleiste
    q: Wie exportierst du eine Animation so, dass ihr Timing im Spiel ankommt?
    a: |
      Als Sprite-Sheet in 100 % mit festem Raster und ohne Trim, eine Zeile je Animation, dazu die Bilddauern. Aseprite und LibreSprite schreiben sie in eine JSON-Datei, mit den Tags in den Meta-Daten; bei Pixelorama und Krita lege ich eine Bildliste daneben. Ich sage dazu, ob Bildnummern ab 0 oder 1 zählen. Vergrößerte GIFs sind nur zum Zeigen.
    tags: [export, json, pipeline]
    level: 2
  - id: ws-eine-groesse
    module: werkstatt-studien
    q: Warum änderst du in einer Variante nur eine Größe?
    a: |
      Weil ich sonst nicht weiß, was gewirkt hat. Verlängere ich die Haltezeit und staucht der Ball zugleich stärker, kann die Antwort „wirkt schwerer“ von beidem kommen. Mit einer Basis und Varianten, die sich in genau einer Größe unterscheiden, lässt sich jede Beobachtung einer Änderung zuordnen. Im Protokoll steht dafür eine Zeile „sonst gleich“.
    tags: [variante, experiment, arbeitsweise]
    level: 2
  - id: ws-timing-ohne-zeichnung
    module: werkstatt-studien
    q: Wie testest du verschiedene Timings, ohne neu zu zeichnen?
    a: |
      Ich kopiere die Basis und ändere nur Bilddauern: in Aseprite die Millisekunden, in Pixelorama die Faktoren, in Krita die Zahl der Haltebilder. Slynyrd zeichnet das Ausholen seines Angriffs als ein einziges Bild und gibt ihm je nach Waffe eine andere Dauer. Weil keine Zeichnung neu ist, scheidet sie als Ursache aus, und die Varianten kosten Minuten.
    tags: [timing, variante, editor]
    level: 2
  - id: ws-test-mit-varianten
    module: werkstatt-studien
    q: Wie zeigst du zwei Varianten, ohne die Antwort vorzugeben?
    a: |
      Mit neutralen Namen wie X und Y, in wechselnder Reihenfolge, je dreimal in Schleife. Ich frage zuerst „Was passiert da?“, dann „Was ist bei den beiden anders?“ und erst zuletzt, wenn überhaupt, gezielt, etwa „Welcher ist schwerer?“. Die Antworten schreibe ich wörtlich auf. Eine Person ist ein Hinweis, kein Beleg.
    tags: [beobachtungstest, variante, test]
    level: 2
  - id: wf-posentest
    module: werkstatt-figur
    q: Was ist ein Posentest, und warum machst du ihn vor den Zwischenbildern?
    a: |
      Ich spiele nur die Keys mit ihren geplanten Dauern ab. So sehe ich, ob die Bewegung schon an den Schlüsselposen lesbar ist und ob die Haltezeiten stimmen. Änderungen kosten jetzt eine Zeichnung; später müsste ich auch alle Zwischenbilder um einen Key herum neu machen. Cartwright, Clark bei Cuphead und Vasseur bei Dead Cells beschreiben dieselbe Reihenfolge.
    tags: [posentest, keys, arbeitsweise]
    level: 2
  - id: wf-ueberarbeitung-zeigen
    module: werkstatt-figur
    q: Zeig eine Animation und erzähl, wie du sie überarbeitet hast.
    a: |
      Ich zeige Fassung 1 und die letzte nebeneinander und sage, was ich zeigen wollte. Dann, was ein Zuschauer in Fassung 1 tatsächlich gesehen hat, welche Bilder ich daraufhin geändert habe, mit Dauer oder Pose vorher und nachher, und warum. Ich nenne das Ergebnis des zweiten Tests, eine Änderung ohne Wirkung und eine Stelle, die ich bewusst gelassen habe.
    tags: [überarbeitung, portfolio, protokoll]
    level: 3
  - id: wf-grosses-zuerst
    module: werkstatt-figur
    q: In welcher Reihenfolge prüfst du eine Fassung, bevor du sie überarbeitest?
    a: |
      Vom Großen zum Kleinen: erst ob man die Handlung liest, dann Timing, dann Spacing und Bögen, dann Gewicht und Bodenkontakt, Überlappung, Konstanz der Form und zuletzt einzelne Pixel. Am Ende prüfe ich die Lesbarkeit in Originalgröße. Wer mit Pixeln anfängt, poliert Bilder, die die nächste Timing-Änderung umwirft.
    tags: [überarbeitung, prüfung, arbeitsweise]
    level: 2
  - id: wf-ki-grenze
    module: werkstatt-figur
    q: Was darf eine KI in deiner Animationsarbeit übernehmen und was nicht?
    a: |
      Technische Arbeit: Export-Skripte, Befehle für Sprite-Sheets, Git-Befehle, ein Skript, das Fassungen als GIF nebeneinanderlegt. Nicht: Figuren, Posen, Zwischenbilder, Referenzen oder Urteile über meine Animation. Auch die Frage „Was stimmt nicht?“ liefert Gestaltungsvorschläge; Rückmeldung hole ich mir von Menschen im Beobachtungstest.
    tags: [ki, arbeitsweise, werkstatt]
    level: 1
  - id: tsz-editor-spiel
    module: testszene
    q: Deine Animation sieht im Editor gut aus und wirkt im Spiel falsch. Wie gehst du vor?
    a: |
      Erst trenne ich Timing, Darstellung und Zeichnung. Ich vergleiche die Dauern aus dem Editor mit dem, was das Spiel zeigt, in einem Log mit festen Ticks. Dann sehe ich mir die Figur in Originalgröße vor dem Spielhintergrund an und am Übergang Bild für Bild. Erst wenn Timing und Darstellung stimmen, ändere ich Zeichnungen, eine Sache pro Durchgang.
    tags: [testszene, pruefen, godot]
    level: 2
  - id: tsz-ms-zu-fps
    module: testszene
    q: Wie überträgst du Bilddauern von 100, 50 und 150 ms in eine SpriteFrames-Ressource von Godot?
    a: |
      Godot rechnet mit FPS und einer relativen Frame-Dauer je Bild. Ich nehme den größten gemeinsamen Teiler der Dauern als Grundtakt, hier 50 ms. Das ergibt 20 FPS und die Faktoren 2, 1 und 3. Probe: 2 / 20 Sekunden sind 100 ms. So kommt das Timing ohne Rundung an.
    tags: [godot, spriteframes, timing]
    level: 2
  - id: tsz-sprung-beim-wechsel
    module: testszene
    q: Beim Wechsel von einer Animation zur nächsten springt die Figur um zwei Pixel. Was prüfst du zuerst?
    a: |
      Export und Ursprung, bevor ich eine Zeichnung anfasse. Wenn der Export leere Ränder je Animation abschneidet, sind die Bilder verschieden groß, und der Ursprung liegt relativ zur Figur woanders. Mit voller Leinwand und dem Ursprung an den Füßen liegt die Figur in jedem Bild an derselben Stelle. Erst wenn das ausgeschlossen ist, vergleiche ich die beiden Posen am Schnitt.
    tags: [testszene, export, uebergaenge]
    level: 2
  - id: tsz-uebergaenge
    module: testszene
    q: Warum prüfst du einen Übergang aus jedem Bild der vorigen Animation heraus?
    a: |
      Weil der Spieler entscheidet, wann gewechselt wird. Lässt er die Richtung in einem anderen Moment los, schneidet das Spiel aus einem anderen Bild des Laufzyklus in die Ruhe. Ein Übergang, der aus Bild 1 sauber aussieht, kann aus Bild 3 springen. Deshalb löse ich jeden Wechsel mehrmals aus und lese im Log ab, aus welchem Bild er kam.
    tags: [testszene, uebergaenge, zyklen]
    level: 3
