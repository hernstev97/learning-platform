projects:
  - id: analyse-entscheidung
    title: Analyse einer Entscheidung aus einem veröffentlichten Spiel
    level: 2
    hours: 4
    summary: Am PC untersuchst du eine Entscheidung aus einem veröffentlichten Spiel deiner Wahl – Situation, Wissensstände, Anreize, Folgen und Verzweigungsmuster – und schreibst eine belegte Analyse mit 600–900 Wörtern.
    brief: |
      **Ausgangslage:** In den Modulen hast du viele Entscheidungen aus fremden Spielen kennengelernt. Hier untersuchst du eine einzige gründlich, und zwar eine, die du selbst gespielt hast. Die Analyse ist weder Kritik noch Nacherzählung. Sie zeigt, wie die Entscheidung gebaut ist und warum sie so wirkt, wie sie auf dich gewirkt hat.

      **Anforderungen:**

      - Ein veröffentlichtes Spiel deiner Wahl und darin eine Entscheidung, die du selbst getroffen hast.
      - Fünf Gesichtspunkte: die Situation, die Wissensstände von Spieler und Figur, die mechanischen Anreize, die erzählerischen Folgen (sofort und später) und das Muster der Verzweigung.
      - 600–900 Wörter. Jede Tatsache über das Spiel hat eine Quelle (Entwicklerseite, Vortrag, Interview, Lexikon) oder ist als eigene Beobachtung beim Spielen gekennzeichnet.
      - Deine Deutungen sind als Deutungen erkennbar und von den Fakten getrennt.
      - Eine Quellenliste mit Links.

      **Rahmen:** Arbeit am PC, rund vier Stunden. Grundlage sind die Module [Spielerwissen, Figurenwissen und verständliche Entscheidungen](/narrative/spielerwissen), [Erzählerische Folgen und mechanische Anreize](/narrative/folgen-anreize) und [Verzweigungen begrenzen, Folgen erlebbar machen](/narrative/verzweigungen). Du schreibst selbst; KI nutzt du höchstens für Rechtschreibung und Grammatik, wenn du das möchtest.
    skills: [analyse, wissensstaende, anreize, folgen, verzweigungsmuster, quellenarbeit]
    steps:
      - id: entscheidung-waehlen
        title: Spiel und Entscheidung wählen
        detail: |
          Wähle ein Spiel, das du selbst gespielt hast, und darin eine Entscheidung, an die du dich erinnerst. Spiel die Stelle noch einmal oder sieh sie dir in einem Video an und notiere, wo im Spiel sie liegt. Leg gleich zu Beginn eine Quellenliste an.
      - id: fakten-belegen
        title: Fakten sammeln und belegen
        detail: |
          Schreib auf, was du über die Entscheidung behaupten willst, und such zu jeder Tatsache eine Quelle: Entwicklerseite, Vortrag im [GDC Vault](https://gdcvault.com/), Interview oder Lexikon. Was du nicht belegen kannst, kennzeichnest du als eigene Beobachtung beim Spielen oder lässt es weg.
      - id: situation-und-wissen
        title: Situation und Wissensstände beschreiben
        detail: |
          Beschreibe in eigenen Worten, wer wählt und was zur Wahl steht. Halte fest, was der Spieler in diesem Moment weiß, was die Figur weiß und was beide nicht wissen. Die Checkliste aus [Spielerwissen](/narrative/spielerwissen) hilft dir dabei.
      - id: anreize-pruefen
        title: Anreize und Aussage vergleichen
        detail: |
          Liste die mechanischen Anreize auf, etwa Belohnungen, Werte, Anzeigen oder Abkürzungen, und daneben, was die Geschichte über die Entscheidung sagt. Begründe, ob beide zusammenpassen, ein beabsichtigtes Dilemma bilden oder sich widersprechen ([Erzählerische Folgen und mechanische Anreize](/narrative/folgen-anreize)).
      - id: folgen-und-muster
        title: Folgen und Verzweigungsmuster bestimmen
        detail: |
          Notiere für jede Option die unmittelbare und die spätere Folge und wo das Spiel sie zeigt. Ordne die Struktur einem der Muster von Sam Kabo Ashwell zu oder begründe, warum keines passt ([Verzweigungen](/narrative/verzweigungen)). Kennzeichne, was du selbst gesehen und was du nur gelesen hast.
      - id: analyse-schreiben
        title: Analyse schreiben und prüfen
        detail: |
          Schreib die Analyse in einem Zug und kürze sie in einem eigenen Durchgang auf 600–900 Wörter. Prüf zum Schluss jeden Satz mit einer Tatsachenbehauptung gegen deine Quellenliste.
    acceptance:
      - id: fuenf-gesichtspunkte
        text: Die Analyse behandelt Situation, Wissensstände, Anreize, Folgen und Verzweigungsmuster in je mindestens einem eigenen Absatz.
      - id: umfang
        text: Die Analyse hat 600–900 Wörter.
      - id: fakten-belegt
        text: Jede Tatsachenbehauptung über das Spiel hat eine verlinkte Quelle oder ist als eigene Beobachtung beim Spielen gekennzeichnet.
      - id: deutung-getrennt
        text: Deutungen sind als solche formuliert und stehen getrennt von den Fakten.
      - id: eigene-texte
        text: Alle Texte stammen von dir; KI hat höchstens Rechtschreibung oder Grammatik auf deinen Wunsch geprüft.
    stretch:
      - Spiel die Entscheidung mit der anderen Option noch einmal und vergleiche, welche Folgen und Rückbezüge sich unterscheiden.
      - Vergleiche die Entscheidung mit einer aus einem zweiten Spiel, das ein anderes Verzweigungsmuster nutzt.
      - Lass eine Person die Analyse testlesen, die das Spiel nicht kennt, und prüf, ob sie die Entscheidung danach in eigenen Worten beschreiben kann.
    portfolio: |
      Eine Analyse zeigt, wie du über Entscheidungen nachdenkst. Stell an den Anfang einen Satz, der die Entscheidung beschreibt, und einen, der deine zentrale Beobachtung nennt. Danach kommen die fünf Gesichtspunkte und die Quellenliste.

      Im Gespräch kannst du an diesem Beispiel erklären, woran du ein Dilemma von einer Dissonanz unterscheidest, welches Verzweigungsmuster du erkannt hast und was es die Entwickler vermutlich an Text und Tests gekostet hat. Trenne dabei, was belegt ist und was du vermutest.

  - id: drei-szenen
    title: Drei Szenen mit derselben Figur
    level: 2
    hours: 8
    summary: Am PC schreibst du drei kurze Szenen mit derselben Figur aus deinem eigenen Projekt, jede mit Szenenkarte und bewusst gewählter Perspektive, und überarbeitest sie in getrennten Durchgängen mit Änderungsprotokoll.
    brief: |
      **Ausgangslage:** Eine Figur zeigt sich über mehrere Szenen. In diesem Projekt schreibst du drei kurze Szenen mit derselben Figur aus deinem eigenen Projekt. Welche Figur, welche Szenen und was darin geschieht, entscheidest du allein. Das Projekt gibt nur Ablauf und Prüfpunkte vor.

      **Anforderungen:**

      - Eine Figur aus deinem eigenen Projekt mit Ziel, Motiv und Widerstand.
      - Drei Szenen mit je 300–600 Wörtern, jede mit einer Szenenkarte (Ziel, Widerstand, Wendung).
      - Für jede Szene eine bewusst gewählte Perspektive, begründet in einem Satz.
      - Überarbeitung in getrennten Durchgängen mit Änderungsprotokoll. Alle Fassungen bleiben erhalten.

      **Rahmen:** Arbeit am PC, rund acht Stunden, verteilt auf mindestens zwei Tage, damit zwischen Entwurf und Überarbeitung Abstand liegt. Schreib in deinem eigenen Editor und speichere jede Fassung als eigene Datei oder als Commit in Git ([Git](/git)). Grundlage sind [Figuren: Ziel, Motiv und Widerstand](/narrative/figuren-motivation), [Perspektive](/narrative/perspektive), [Konflikt und Szenenaufbau](/narrative/szenenaufbau), [Werkstatt: eine Szene schreiben und überarbeiten](/narrative/werkstatt-szene) und [Überarbeiten mit eigenen Kriterien](/narrative/ueberarbeiten). Du schreibst selbst; KI nutzt du höchstens für Rechtschreibung und Grammatik, wenn du das möchtest, nicht für Stilvorschläge.
    skills: [figuren, szenenkarte, perspektive, entwurf, ueberarbeiten, aenderungsprotokoll]
    steps:
      - id: figurenblatt
        title: Figurenblatt anlegen
        detail: |
          Halte für die Figur Ziel, Motiv und Widerstand in je einem Satz fest, außen und innen. Prüf beim Ziel, ob man sehen kann, ob die Figur es erreicht ([Figuren](/narrative/figuren-motivation)).
      - id: szenenkarten
        title: Drei Szenenkarten
        detail: |
          Leg für jede Szene eine Karte mit dem Ziel der Figur, dem Widerstand und der Wendung an. Notiere, was sich in jeder Szene ändert. Findest du keine Änderung, überarbeitest du die Karte, bevor du schreibst ([Konflikt und Szenenaufbau](/narrative/szenenaufbau)).
      - id: perspektive-festlegen
        title: Perspektive je Szene festlegen
        detail: |
          Entscheide für jede Szene, wer wahrnimmt und wer spricht, und schreib in einem Satz, warum. Liste auf, was die Fokalfigur in dieser Szene wissen kann und was nicht ([Perspektive](/narrative/perspektive)).
      - id: entwuerfe
        title: Drei Entwürfe in einem Zug
        detail: |
          Schreib jede Szene in einem Zug, ohne unterwegs zu korrigieren, und speichere sie als erste Fassung. Ziel sind 300–600 Wörter je Szene.
      - id: abstand-und-kriterien
        title: Abstand nehmen, Kriterien festlegen
        detail: |
          Lass die Entwürfe mindestens eine Nacht liegen. Schreib in dieser Zeit für jede Szene die beabsichtigte Wirkung auf und leite daraus zwei oder drei prüfbare Kriterien ab ([Überarbeiten mit eigenen Kriterien](/narrative/ueberarbeiten)).
      - id: durchgaenge
        title: Getrennte Überarbeitungsdurchgänge
        detail: |
          Geh die Szenen in getrennten Durchgängen durch: Ziel und Konflikt, Wendung, Perspektive, Anfang und Ende. In jedem Durchgang achtest du nur auf eine Sorte Problem ([Werkstatt: eine Szene](/narrative/werkstatt-szene)).
      - id: aenderungsprotokoll
        title: Änderungsprotokoll führen
        detail: |
          Notiere zu jeder Änderung, was du geändert hast und warum, mit Bezug auf ein Kriterium. Speichere jede Fassung getrennt.
      - id: laut-lesen
        title: Laut lesen und abschließen
        detail: |
          Lies alle drei Szenen laut, markiere die Stellen, an denen du stockst, und überarbeite sie. Prüf zum Schluss jede Szene gegen ihre Kriterien und vermerke im Protokoll, welche erfüllt sind und welche nicht.
    acceptance:
      - id: drei-szenenkarten
        text: Für jede der drei Szenen gibt es eine Szenenkarte mit Ziel, Widerstand und Wendung.
      - id: umfang-je-szene
        text: Jede Szene hat in der Endfassung 300–600 Wörter.
      - id: perspektive-begruendet
        text: Für jede Szene ist die Perspektive in einem Satz begründet, und die Szene hält sie ohne Perspektivbruch durch.
      - id: fassungen-erhalten
        text: Erste Fassung und Endfassung jeder Szene liegen getrennt vor.
      - id: protokoll-mit-kriterien
        text: Das Änderungsprotokoll nennt zu jeder Änderung den Grund und das Kriterium.
      - id: eigene-texte
        text: Alle Texte, Figuren und Ideen stammen von dir; KI hat höchstens Rechtschreibung oder Grammatik auf deinen Wunsch geprüft.
    stretch:
      - Lass eine Person die drei Szenen testlesen und vergleiche ihr Protokoll mit deinen Kriterien ([Testlesen und Playtest](/narrative/testlesen-playtest)).
      - Schreib eine der Szenen aus einer zweiten Perspektive und notiere, was sich am Wissensstand des Lesers ändert.
    portfolio: |
      Zeig nur, was du von deinem Projekt zeigen willst. Aussagekräftig ist eine Szene in erster Fassung und Endfassung nebeneinander, dazu ihre Szenenkarte und drei Einträge aus dem Änderungsprotokoll. So sieht man neben dem Ergebnis auch, wie du überarbeitest.

      Im Gespräch kannst du erklären, warum du für jede Szene diese Perspektive gewählt hast, welche Änderung du für entscheidend hältst und welches Kriterium du am Ende nicht erfüllt hast.

  - id: ort-erzaehlt
    title: Ein Ort, der ohne Text erzählt
    level: 2
    hours: 6
    summary: Am PC planst und skizzierst du einen Schauplatz aus deinem eigenen Projekt, der ohne Text erzählt, und prüfst mit einer Testperson, ob ankommt, was du beabsichtigt hast.
    brief: |
      **Ausgangslage:** Spieler können aus der Anordnung von Dingen erschließen, was an einem Ort geschehen ist. Harvey Smith und Matthias Worch haben das auf der GDC 2010 unter dem Titel „What Happened Here?“ beschrieben ([GDC Vault](https://gdcvault.com/play/1012647/What-Happened-Here-Environmental)). In diesem Projekt planst du einen solchen Ort für dein eigenes Projekt. Welcher Ort das ist und was dort geschehen ist, entscheidest du allein. Das Projekt gibt nur Ablauf und Prüfpunkte vor.

      **Anforderungen:**

      - Ein Schauplatz aus deinem eigenen Projekt.
      - Vor allem anderen eine schriftliche Absicht: was dort passiert ist und was der Spieler daraus schließen soll.
      - Eine Liste mit fünf bis acht Spuren, jede mit den Fragen „Was erzählt das?“ und „Was muss der Spieler daraus schließen?“.
      - Eine Skizze auf Papier oder in Pixeln, ohne lesbaren Text im Bild.
      - Ein Test mit mindestens einer Person, die dein Projekt nicht kennt, mit Protokoll, und danach ein Abgleich mit deiner Absicht.

      **Rahmen:** Arbeit am PC, rund sechs Stunden. Grundlage sind [Erzählen über Handlung, Umgebung und Folgen](/narrative/umgebung-erzaehlt), [Werkstatt: Dialog und Schauplatz](/narrative/werkstatt-dialog) und [Testlesen und Playtest](/narrative/testlesen-playtest). Orientierung und Wegführung gehören zum Level-Design und sind nicht Teil dieses Projekts. Ort, Spuren und Skizze stammen von dir; KI nutzt du höchstens für Rechtschreibung und Grammatik, wenn du das möchtest.
    skills: [environmental-storytelling, spuren, skizze, playtest, protokoll]
    steps:
      - id: absicht-festhalten
        title: Absicht vorab festhalten
        detail: |
          Schreib in zwei, drei Sätzen auf, was an diesem Ort passiert ist und was der Spieler daraus schließen soll. Formuliere daraus ein prüfbares Kriterium. Die Testperson bekommt diesen Text nie zu sehen.
      - id: spurenliste
        title: Spuren auflisten
        detail: |
          Liste fünf bis acht Gegenstände oder Spuren auf, jede mit „Was erzählt das?“ und „Was muss der Spieler daraus schließen?“. Markiere, welche Spur der Spieler zuerst sehen soll und welche eine andere nur bestätigt.
      - id: spuren-pruefen
        title: Spuren gegeneinander prüfen
        detail: |
          Prüf, ob sich zwei Spuren ohne Absicht widersprechen und ob eine Spur nur über Text funktioniert, etwa über eine Notiz oder ein Schild. Streich oder ersetze, was nicht zu deiner Absicht passt, und notiere, warum.
      - id: skizze
        title: Skizze anlegen
        detail: |
          Zeichne den Ort auf Papier oder als grobes Pixelbild in der Ansicht deines Projekts. Im Bild steht kein lesbarer Text; die Spuren müssen ohne Beschriftung erkennbar sein.
      - id: testperson
        title: Testperson beschreiben lassen
        detail: |
          Zeig die Skizze einer Person, die dein Projekt nicht kennt. Bitte sie, laut zu beschreiben, was sie sieht, und frag danach offen „Was ist hier passiert?“. Erkläre nichts und protokolliere in zwei Spalten, getrennt nach Beobachtung und Deutung.
      - id: abgleich
        title: Mit der Absicht abgleichen
        detail: |
          Lies das Protokoll gegen dein Kriterium und markiere jede Spur als angekommen, anders angekommen oder nicht bemerkt. Entscheide selbst, was du änderst, und halte die Gründe fest. Wenn du kannst, testest du die geänderte Skizze mit einer neuen Person.
    acceptance:
      - id: absicht-vorab
        text: Die Absicht und das Kriterium lagen schriftlich vor, bevor die Testperson die Skizze gesehen hat.
      - id: spuren-mit-zweck
        text: Die Liste enthält fünf bis acht Spuren, und für jede sind beide Fragen beantwortet.
      - id: skizze-ohne-text
        text: Die Skizze enthält keinen lesbaren Text.
      - id: testprotokoll
        text: Ein Protokoll mit getrennten Spalten für Beobachtung und Deutung liegt vor.
      - id: abgleich-begruendet
        text: Der Abgleich ordnet jede Spur einem Ergebnis zu und begründet jede Änderung.
      - id: eigene-ideen
        text: Ort, Spuren und Skizze stammen von dir; KI hat höchstens Rechtschreibung oder Grammatik auf deinen Wunsch geprüft.
    stretch:
      - Zeig dieselbe Skizze einer zweiten Person und vergleiche, welche Spuren beide bemerkt haben.
      - Bau den Ort in deiner Engine als begehbaren Rohbau ohne fertige Grafik nach und wiederhole den Test als Playtest.
    portfolio: |
      Zeig nur, was du von deinem Projekt zeigen willst. Stell die Skizze neben die Spurenliste und das Ergebnis des Abgleichs. Interessant ist besonders eine Spur, die anders ankam als geplant, und was du daraufhin geändert hast.

      Im Gespräch kannst du erklären, wie du die Spuren gewichtet hast, warum der Ort ohne Text auskommt und was der Test über deine Annahmen gezeigt hat.

  - id: abschluss-entscheidungsszene
    title: "Abschlussprojekt: deine eigene Entscheidungsszene"
    capstone: true
    level: 3
    hours: 25
    summary: Am PC machst du eine zentrale Entscheidung aus deinem eigenen Projekt verständlich und folgenreich – mit Kriterien, Wissensständen, Ablauf, Szene, Dialog, Schauplatz, Twine-Prototyp, Testlauf, Änderungsprotokoll und Reflexion.
    brief: |
      ## Ausgangslage

      Statt eines Auftraggebers steht hier dein eigenes Projekt. Darin soll eine zentrale Entscheidung verständlich und folgenreich werden. Der Spieler weiß genug, um zu wählen, und erlebt, was daraus folgt. Welche Entscheidung das ist, worum es darin geht und wie sie ausgeht, legst du selbst fest. Das Projekt gibt Ablauf, Nachweise und Abnahmekriterien vor, keine Inhalte.

      ## Was du lieferst

      1. **Absicht und Kriterien.** Die beabsichtigte Wirkung in wenigen Sätzen und daraus mindestens drei prüfbare Kriterien.
      2. **Figuren und Wissensstände.** Ziel, Motiv und Widerstand der beteiligten Figuren und eine Übersicht, was Spieler, Spielerfigur und andere Figuren vor der Wahl wissen.
      3. **Ablauf.** Ausgangslage, Voraussetzungen der Wahl, Optionen, unmittelbare und spätere Folgen und der Rückbezug über eine Variable, als Diagramm oder in Stichpunkten.
      4. **Szene und Dialog.** Ein Szenenentwurf mit 300–800 Wörtern und ein Dialog mit Subtext, dessen Repliken in deine Textbox-Grenze passen.
      5. **Schauplatz.** Fünf bis acht Spuren, die Vorgeschichte oder Folgen ohne Text zeigen.
      6. **Prototyp.** Ein Twine-Prototyp mit mindestens zwei Optionen und einer späteren Folge über eine Variable, veröffentlicht als HTML-Datei.
      7. **Testlauf.** Mindestens zwei Testpersonen einzeln, mit lautem Denken und je einem Protokoll.
      8. **Überarbeitung und Reflexion.** Ein Änderungsprotokoll mit Bezug auf die Kriterien und eine Reflexion mit 500–800 Wörtern.

      ## Rahmen

      - Arbeit am PC, rund 25 Stunden, verteilt über mehrere Wochen, damit zwischen Entwurf, Test und Überarbeitung Abstand liegt.
      - Twine 2.12.1 (Stand Oktober 2026) mit dem Standardformat Harlowe 3.3.9. Browser-Twine speichert im lokalen Speicher des Browsers; wer die Browserdaten löscht, verliert die Geschichten ([Twine Reference · Using a Web Browser](https://twinery.org/reference/en/getting-started/installing.html#using-a-web-browser)). Sichere deshalb regelmäßig ein Archiv der Bibliothek ([Archiving Your Library](https://twinery.org/reference/en/story-library/exporting.html#archiving-your-library)).
      - Alle Texte, Figuren und Ideen stammen von dir. KI nutzt du höchstens für Struktur und Checklisten und, wenn du das möchtest, für Rechtschreibung und Grammatik.
      - Grundlage sind alle Module dieses Bereichs, besonders [Spielerwissen](/narrative/spielerwissen), [Verzweigungen](/narrative/verzweigungen), [Werkstatt: eine Entscheidung als spielbarer Prototyp](/narrative/werkstatt-entscheidung) und [Testlesen und Playtest](/narrative/testlesen-playtest).
    skills: [figuren, wissensstaende, ablaufdiagramm, szene, dialog, subtext, environmental-storytelling, twine, harlowe, playtest, ueberarbeiten, reflexion]
    steps:
      - id: absicht-kriterien
        title: Absicht und Kriterien festlegen
        detail: |
          Beschreibe in wenigen Sätzen, was der Spieler vor, während und nach der Entscheidung wissen, erwarten und erleben soll. Leite daraus mindestens drei Kriterien ab, die sich an einer Textstelle oder an einer Testperson prüfen lassen; mindestens eines prüfst du im Testlauf ([Überarbeiten mit eigenen Kriterien](/narrative/ueberarbeiten)).
      - id: figuren-wissen
        title: Figuren und Wissensstände klären
        detail: |
          Halte für jede beteiligte Figur Ziel, Motiv und Widerstand fest ([Figuren](/narrative/figuren-motivation)). Leg eine Übersicht an, was Spieler, Spielerfigur und die anderen Figuren vor der Wahl wissen, und prüf die Entscheidung mit der Checkliste aus [Spielerwissen](/narrative/spielerwissen).
      - id: ablauf
        title: Ablauf mit Voraussetzungen und Folgen
        detail: |
          Zeichne den Ablauf von der Ausgangslage über die Voraussetzungen der Wahl und die Optionen bis zur unmittelbaren und zur späteren Folge. Markiere, welche Variable den Rückbezug trägt und wo der Spieler die Folge sieht. Prüf mit [Erzählerische Folgen und mechanische Anreize](/narrative/folgen-anreize), ob Mechanik und Aussage zusammenpassen, und mit [Verzweigungen](/narrative/verzweigungen), wie viele Wege du schreiben musst.
      - id: szenenentwurf
        title: Szene entwerfen
        detail: |
          Leg eine Szenenkarte an und schreib die Szene rund um die Entscheidung in einem Zug, mit 300–800 Wörtern. Wähle die Perspektive bewusst und notiere, warum ([Werkstatt: eine Szene](/narrative/werkstatt-szene)).
      - id: dialog
        title: Dialog mit Subtext
        detail: |
          Leg für jede Figur im Gespräch fest, was sie will, und prüf jede Replik auf ihre Absicht. Verteile nötige Informationen, statt sie im Block zu erklären, und miss die Repliken an deiner Textbox-Grenze ([Werkstatt: Dialog und Schauplatz](/narrative/werkstatt-dialog)).
      - id: schauplatz
        title: Schauplatz-Spuren
        detail: |
          Liste fünf bis acht Spuren am Ort der Entscheidung oder dort, wo die Folge sichtbar wird. Notiere zu jeder, was sie erzählt und was der Spieler daraus schließen soll ([Erzählen über Handlung, Umgebung und Folgen](/narrative/umgebung-erzaehlt)).
      - id: prototyp
        title: Twine-Prototyp bauen
        detail: |
          Bau den Ablauf in Twine mit Harlowe nach, mit mindestens zwei Optionen und einer späteren Folge, die über eine Variable auf die Wahl zurückverweist. Spiel jeden Weg selbst durch und führe eine Liste der Wege. Sichere ein Archiv und veröffentliche die Geschichte mit „Publish to File“ als HTML-Datei ([Twine Reference · Publishing a Story](https://twinery.org/reference/en/publishing/publishing.html#publishing-a-story)).
      - id: testlauf
        title: Testlauf mit mindestens zwei Personen
        detail: |
          Teste den Prototyp mit mindestens zwei Personen einzeln, die dein Projekt nicht kennen. Bitte um lautes Denken, hilf nicht, stell danach deine vorbereiteten offenen Fragen und protokolliere in zwei Spalten, getrennt nach Beobachtung und Deutung ([Testlesen und Playtest](/narrative/testlesen-playtest)).
      - id: ueberarbeitung
        title: Überarbeiten mit Änderungsprotokoll
        detail: |
          Lies die Protokolle gegen deine Kriterien. Entscheide selbst, was du änderst, und halte zu jeder Änderung fest, welche Beobachtung und welches Kriterium sie begründen. Bewahre die getestete Fassung auf und teste die neue mit einer weiteren Person, wenn das möglich ist.
      - id: reflexion
        title: Reflexion schreiben
        detail: |
          Schreib 500–800 Wörter darüber, welche Kriterien erfüllt sind, was der Test gezeigt hat, was du bewusst nicht geändert hast und was du beim nächsten Mal anders angehst.
    acceptance:
      - id: kriterien-pruefbar
        text: Mindestens drei Kriterien sind an einer Textstelle oder einer Testperson prüfbar, keines ist ein Geschmacksurteil, und mindestens eines prüft der Testlauf.
      - id: wissensstaende-dokumentiert
        text: Eine Übersicht zeigt, was Spieler, Spielerfigur und die beteiligten Figuren vor der Wahl wissen.
      - id: ablauf-dokumentiert
        text: Das Ablaufdiagramm zeigt Ausgangslage, Voraussetzungen, alle Optionen, unmittelbare und spätere Folgen und die Variable für den Rückbezug.
      - id: prototyp-spielbar
        text: Der Prototyp liegt als veröffentlichte HTML-Datei vor, jeder Weg ist durchgespielt, und die Liste der Wege zeigt, dass die spätere Folge von der Wahl abhängt.
      - id: testlauf-protokolliert
        text: Für mindestens zwei Testpersonen liegt je ein Protokoll mit getrennten Spalten für Beobachtung und Deutung vor.
      - id: aenderungen-begruendet
        text: Jede Änderung nach dem Test nennt die Beobachtung und das Kriterium, auf die sie sich stützt.
      - id: reflexion-vorhanden
        text: Die Reflexion hat 500–800 Wörter und nennt erfüllte und verfehlte Kriterien.
      - id: eigene-texte
        text: Alle Texte, Figuren und Ideen stammen von dir; KI hat höchstens bei Struktur und Checklisten geholfen und auf deinen Wunsch Rechtschreibung oder Grammatik geprüft.
    stretch:
      - Führe mit zwei weiteren Personen einen Critical Response Process zur überarbeiteten Fassung durch und vergleiche die Bedeutungsaussagen mit deinen Kriterien.
      - Teste die überarbeitete Fassung mit neuen Personen und vergleiche die Protokolle beider Runden.
      - Übertrage den Ablauf in das Dialogwerkzeug deiner Engine und notiere, was sich gegenüber dem Twine-Prototyp ändert.
    portfolio: |
      Zeig nur, was du von deinem Projekt zeigen willst. Für eine Probe im Bereich Narrative Design eignen sich drei Teile: der Prototyp als Link, das Ablaufdiagramm auf einer Seite und eine kurze Begründung deiner Entscheidungen mit den Kriterien, dem Ergebnis des Tests und den Änderungen, die daraus folgten. Twine veröffentlicht HTML-Dateien, die du per E-Mail schicken oder auf eine Website laden kannst; die Twine Reference nennt Borogove und itch.io als Hoster für Twine-Geschichten ([Now That I Have a Published File](https://twinery.org/reference/en/publishing/publishing.html#now-that-i-have-a-published-file-what-do-i-do)).

      Im Gespräch zeigt das Projekt, wie du arbeitest. Wie hast du die Verzweigung begrenzt? Woran hast du im Test gesehen, ob Spieler die Folge erkennen? Welche Rückmeldung hast du bewusst nicht umgesetzt, und warum? Sag offen, dass der Prototyp ein Prototyp ist, und nenne, was im fertigen Spiel dazukäme.
