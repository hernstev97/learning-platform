cards:
  # Track A: Figur, Perspektive, Szene
  - id: ziel-motiv-widerstand
    module: figuren-motivation
    q: Was meinen Ziel, Motiv und Widerstand bei einer Figur?
    a: |
      Das Ziel ist, was die Figur erreichen will, so konkret, dass man sehen kann, ob sie es schafft; das Motiv sagt, warum gerade jetzt, der Widerstand, was sie von außen oder innen aufhält. Debra Dixon beschreibt das als GMC: Goal, Motivation and Conflict.

      In Kafkas „Vor dem Gesetz“ will der Mann vom Lande in das Gesetz. Außen hält ihn der Türhüter auf, innen sein Entschluss, „lieber zu warten“.

      Abgrenzung: „Glücklich werden“ ist kein Ziel, weil keine Szene zeigen kann, ob es erreicht ist.
    tags: [figur, gmc]
    level: 1
  - id: ziel-und-bedarf
    module: figuren-motivation
    q: Was ist der Unterschied zwischen äußerem Ziel und innerem Bedarf?
    a: |
      Das äußere Ziel verfolgt die Figur bewusst, der innere Bedarf ist, was ihr fehlt, oft ohne dass sie es weiß (englisch want und need).

      In Celeste will Madeline auf den Gipfel; ihr Selbstzweifel tritt als „Badeline“ auf, und laut einer Game Narrative Review im GDC Vault gibt es die zweite Dash-Aufladung erst nach der Versöhnung mit ihr.

      Abgrenzung: Nicht jede Figur braucht beides. Hebels Braut in „Unverhofftes Wiedersehen“ lernt nichts dazu, ihre gleichbleibende Treue trägt den Text.
    tags: [figur, want-need]
    level: 1
  - id: einsatz-stakes
    module: figuren-motivation
    q: Was ist der Einsatz, und warum reicht ein Ziel allein nicht?
    a: |
      Der Einsatz (englisch stakes) ist, was die Figur verliert, wenn sie scheitert; ohne ihn bleibt ein Ziel ein Wunsch.

      In Hebels „Unverhofftes Wiedersehen“ steht eine Ehe auf dem Spiel, und der Verlust acht Tage vor der Hochzeit trägt die Erzählung über fünfzig Jahre.

      Abgrenzung: Der Einsatz muss nicht groß aussehen, aber für diese Figur zählen. Im Spiel muss der Spieler ihn kennen, bevor er wählt.
    tags: [figur, einsatz]
    level: 1
  - id: spielerziel-figurenziel
    module: figuren-motivation
    q: Was passiert, wenn das Ziel der Spielerfigur und das Ziel des Spielers auseinanderlaufen?
    a: |
      Der Spieler handelt nach dem, was das Spiel belohnt, und die Figur wirkt unglaubwürdig, etwa wenn sie es laut Dialog eilig hat, während der Spieler Schubladen durchsucht.

      Papers, Please koppelt beides. Der Grenzbeamte verteilt nach jedem Tag sein Geld auf Miete, Essen und Heizung für die Familie, und der Spieler will sie versorgen, weil er jeden Abend die Rechnung sieht.

      Abgrenzung: Ein Abstand kann gewollt sein; dann muss das Spiel ihn sichtbar machen.
    tags: [figur, spielerfigur]
    level: 1
  - id: fokalisierung
    module: perspektive
    q: Was ist Fokalisierung, und was unterscheidet sie von der Erzählstimme?
    a: |
      Fokalisierung beantwortet, wer wahrnimmt und wer was weiß. Gérard Genette unterscheidet Nullfokalisierung (der Erzähler weiß mehr als jede Figur), interne (nur, was eine Figur weiß) und externe Fokalisierung (weniger, nur Äußeres).

      Kafkas „Die Verwandlung“ spricht in der dritten Person und nimmt doch durch Gregor wahr, der seinen Bauch nur sieht, „wenn er den Kopf ein wenig hob“.

      Abgrenzung: Die Erzählstimme beantwortet, wer spricht. Stimme und Wahrnehmung können auseinanderfallen, deshalb prüfst du beide getrennt.
    tags: [perspektive, fokalisierung]
    level: 1
  - id: perspektivbruch
    module: perspektive
    q: Was ist ein Perspektivbruch, und wie findest du ihn im eigenen Text?
    a: |
      Ein Perspektivbruch (Kopfspringen) liegt vor, wenn eine an eine Fokalfigur gebundene Szene plötzlich weiß, was eine andere Figur denkt. Du findest ihn mit einer Frage an jeden Satz: Kann die Fokalfigur das jetzt wahrnehmen oder wissen?

      Goethes „Erlkönig“ wechselt ständig zwischen Vater und Sohn, ohne zu brechen, weil jeder Wechsel markiert ist und jede Stimme nur sagt, was sie selbst sieht.

      Abgrenzung: Ein Erzähler mit Nullfokalisierung darf in viele Köpfe sehen; ein Bruch entsteht erst, wenn der Text eine Bindung ohne Absicht aufgibt.
    tags: [perspektive, perspektivbruch]
    level: 1
  - id: erlkoenig-wissen
    module: perspektive
    q: Wer nimmt im „Erlkönig“ den Erlkönig wahr, und was weiß der Leser?
    a: |
      Nur der Sohn sieht und hört ihn; der Vater deutet jede Erscheinung als Natur, als „Nebelstreif“, als Wind „In dürren Blättern“ und als „alten Weiden“.

      Der Leser hört die Verse des Erlkönigs so unmittelbar wie der Sohn und weiß damit mehr als der Vater, aber nicht, wer recht hat. Die letzte Zeile nennt den Tod des Kindes, keine Ursache.

      Abgrenzung: Die Mehrdeutigkeit hält, weil jede Wahrnehmung bei einer Figur bleibt; ein erklärender Erzählersatz würde sie auflösen.
    tags: [perspektive, wissensstand]
    level: 1
  - id: kamera-wissen
    module: perspektive
    q: Warum weiß der Spieler in einer Draufsicht oft mehr als seine Figur?
    a: |
      Weil die Kamera die Rolle des Erzählers übernimmt. Eine Draufsicht zeigt oft Räume hinter Wänden oder Ecken, die die Figur nicht sehen kann.

      Disco Elysium verlegt Wahrnehmung dagegen in Text: 24 Fähigkeiten der Hauptfigur sprechen als innere Stimmen direkt zum Spieler.

      Abgrenzung: Der Vorsprung kann gewollt sein, damit der Spieler eine Gefahr kommen sieht. Seltsam wird er, wenn eine Textbox die Figur über etwas staunen lässt, das der Spieler längst gesehen hat.
    tags: [perspektive, kamera]
    level: 1
  - id: szene-folgeszene
    module: szenenaufbau
    q: Was sind Szene und Folgeszene nach Dwight V. Swain?
    a: |
      Die Szene folgt dem Muster Ziel – Konflikt – Rückschlag, die Folgeszene dem Muster Reaktion – Dilemma – Entscheidung, und die Entscheidung setzt das Ziel der nächsten Szene. Swain beschreibt das in „Techniques of the Selling Writer“, Randy Ingermanson erklärt es in „Writing the Perfect Scene“.

      Im Spiel fällt die Entscheidung oft dem Spieler zu. Den Abend in Papers, Please kann man als Folgeszene lesen, in der er Miete, Essen und Heizung gegeneinander abwägt.

      Abgrenzung: Das Muster ist ein Prüfwerkzeug; auch ein Sieg kann eine Szene beenden, wenn er etwas kostet oder eine neue Frage öffnet.
    tags: [szene, swain]
    level: 1
  - id: szene-oder-zustand
    module: szenenaufbau
    q: Woran erkennst du, ob ein Abschnitt eine Szene ist oder nur ein Zustand?
    a: |
      In einer Szene dreht sich ein Wert im Leben einer Figur, etwa Ansehen zu Spott. Robert McKee schlägt vor, den Wert am Anfang und am Ende zu notieren und beide zu vergleichen.

      Lessings „Der Esel und das Jagdpferd“ schafft die Drehung in drei Sätzen: Der Esel, der als schnell gelten wollte, verliert das Rennen, wird ausgelacht und erfindet einen Dorn im Fuß.

      Abgrenzung: Übergänge und Zusammenfassungen dürfen ohne Drehung sein; eine Seite Dialog verspricht aber, dass sich etwas dreht.
    tags: [szene, wendung]
    level: 1
  - id: erzaehlzeit-erzaehlte-zeit
    module: szenenaufbau
    q: Was ist der Unterschied zwischen Erzählzeit und erzählter Zeit?
    a: |
      Erzählzeit ist, wie lange das Erzählen dauert, erzählte Zeit, wie viel Zeit in der Handlung vergeht.

      Hebel rafft in „Unverhofftes Wiedersehen“ fünfzig Jahre in eine Kette von „und“-Sätzen und erzählt den Fund des Leichnams ausführlich. Kafka braucht für Jahre einen Satz: „Dort sitzt er Tage und Jahre.“

      Abgrenzung: Raffung passt für Zeit, in der sich nichts dreht; ein Fehler wird sie erst, wenn sie die Wendung überspringt.
    tags: [szene, zeit]
    level: 1
  - id: konflikt-ohne-streit
    module: szenenaufbau
    q: Kann eine Szene Konflikt haben, ohne dass jemand streitet?
    a: |
      Ja, denn Konflikt heißt, dass ein Ziel auf Widerstand trifft; Höflichkeit, Schweigen und Zustimmung können Widerstand sein.

      In Büchners „Woyzeck“ belehrt und verspottet der Hauptmann, und Woyzeck antwortet lange nur „Ja wohl, Herr Hauptmann!“. Erst als der Hauptmann sein Kind erwähnt, widerspricht Woyzeck, bis zu „Wir arme Leut!“.

      Abgrenzung: Lautstärke ist kein Maß; prüf, ob jemand etwas will, das der andere nicht gibt.
    tags: [szene, konflikt]
    level: 1
  - id: getrennte-durchgaenge
    module: werkstatt-szene
    q: Warum überarbeitest du eine Szene in getrennten Durchgängen?
    a: |
      Weil du pro Durchgang nur eine Sorte Problem zuverlässig siehst; wer auf alles zugleich achtet, bessert Kommas, während der Szene die Wendung fehlt.

      Die Reihenfolge geht von groß nach klein: Ziel und Konflikt, Wendung, Perspektive, Anfang und Ende, zum Schluss laut lesen.

      Abgrenzung: Ein Durchgang darf kurz sein. Es zählt die Reihenfolge, denn ein gestrichener Absatz braucht keinen Feinschliff.
    tags: [werkstatt, überarbeiten]
    level: 2
  - id: flacher-entwurf
    module: werkstatt-szene
    q: "Bewerbungsgespräch: Dein Szenenentwurf wirkt flach. Wo suchst du zuerst?"
    a: |
      Bei Ziel und Widerstand, also ob die Fokalfigur hier etwas Konkretes will und etwas sie aufhält. Danach bei der Wendung, also ob am Ende ein Wert anders steht.

      Lessings „Der Rabe und der Fuchs“ zeigt, wie wenig es braucht. Beide wollen das Fleisch, und die Schmeichelei des Fuchses dreht die Lage.

      Abgrenzung: Wortwahl und Rhythmus kommen zuletzt; sie verbessern eine Szene, die steht, und retten keine ohne Ziel.
    tags: [werkstatt, szene, interview]
    level: 2
  - id: spaet-hinein
    module: werkstatt-szene
    q: Warum beginnt Büchners Szene beim Hauptmann mitten in der Tätigkeit?
    a: |
      Weil sie der Faustregel „spät hinein, früh hinaus“ folgt: Der Leser kommt dazu, wenn der Konflikt läuft, und die Szene endet kurz nach der Wendung.

      Woyzeck rasiert schon, und die erste Replik ist eine Ermahnung, „Langsam, Wozzeck, langsam“ (zitiert nach Karl Emil Franzos, 1879, der „Wozzeck“ schreibt). Am Ende schickt der Hauptmann ihn weg.

      Abgrenzung: Zu spät ist auch ein Fehler; Büchner nennt vorher in einer Regieanweisung Ort, Personen und Tätigkeit.
    tags: [werkstatt, szene]
    level: 2
  - id: entwurf-mit-abstand
    module: werkstatt-szene
    q: Warum schreibst du den Entwurf in einem Zug und überarbeitest erst nach einer Pause?
    a: |
      Weil Schreiben und Prüfen verschiedene Tätigkeiten sind; wer beim Schreiben prüft, bricht ab, bevor die Szene steht.

      Mit Abstand, mindestens einer Nacht, liest du, was dasteht, statt was du gemeint hast. Eine aufgehobene Fassung (eigene Datei oder Git) zeigt dir später, was deine Änderungen bewirkt haben.

      Abgrenzung: „In einem Zug“ heißt nicht „ohne Plan“; die Szenenkarte mit Ziel, Widerstand und Wendung liegt vorher fest.
    tags: [werkstatt, entwurf]
    level: 2

  # Track B: Dialog und Welt
  - id: subtext
    module: dialog-subtext
    q: Was ist Subtext?
    a: |
      Subtext ist, was eine Replik meint, ohne es zu sagen; der Leser erschließt es aus Lage, Wissen und Absicht der Figur.

      In Fontanes „Effi Briest“ kündigt Frau von Briest den Antrag Innstettens an und schweigt über ihre eigene frühere Geschichte mit ihm, die der Leser aus dem ersten Kapitel kennt. Ihr dreimaliges „Ich muß dir nämlich sagen“ redet um sie herum.

      Abgrenzung: Subtext braucht einen Text, der etwas anderes sagt; eine Figur, die ausspricht, was sie fühlt, hat keinen.
    tags: [dialog, subtext]
    level: 2
  - id: dialog-ist-handlung
    module: dialog-subtext
    q: Was heißt „Dialog ist Handlung“?
    a: |
      Jede Replik will beim Gegenüber etwas erreichen; Robert McKee nennt Dialog im Untertitel seines Buchs „The Art of Verbal Action“.

      Lessings Fuchs grüßt den Raben als „Vogel des Jupiters“, weil er das Fleisch will, und der geschmeichelte Rabe lässt es fallen. Prüfen kannst du das mit einem Verb neben jeder Replik, etwa bitten, ausweichen, beschämen.

      Abgrenzung: Auch Plaudern ist Handlung, wenn jemand damit etwas will; Büchners Hauptmann redet über das Wetter und führt dabei vor, wer das Sagen hat.
    tags: [dialog, absicht]
    level: 2
  - id: as-you-know-bob
    module: dialog-subtext
    q: Was ist „As you know, Bob“, und wie vermeidest du es?
    a: |
      So heißt eine Replik, in der eine Figur der anderen erzählt, was beide wissen, nur damit der Leser es erfährt. Ein Lehrbeispiel: „Wie du weißt, Bob, sitzen wir seit zehn Jahren in diesem Büro.“

      Besser liegt die Information im Konflikt, bei einer Figur, die sie nicht kennt, an einem Ort, oder sie kommt erst, wenn sie gebraucht wird.

      Abgrenzung: Bekanntes darf fallen, wenn der Sprecher damit etwas will; Büchners Hauptmann erinnert Woyzeck an sein uneheliches Kind, um ihn zu beschämen.
    tags: [dialog, exposition]
    level: 2
  - id: dialogwahl-im-spiel
    module: dialog-subtext
    q: Welche Mittel hat Dialog im Spiel, die ein Buch nicht hat?
    a: |
      Der Spieler wählt Repliken, und das Spiel bestimmt, wann und wie.

      In Firewatch wählt Henry Antworten im Funkgespräch mit seiner Vorgesetzten Delilah. In Oxenfree laufen Gespräche beim Gehen, und man kann andere ausreden lassen, ihnen ins Wort fallen oder schweigen.

      Abgrenzung: Wählbarer Dialog braucht Optionen, deren Ton der Spieler vor der Wahl erkennt, und Repliken, die in eine Textbox passen.
    tags: [dialog, spiel]
    level: 2
  - id: environmental-storytelling
    module: umgebung-erzaehlt
    q: Was ist Environmental Storytelling?
    a: |
      Erzählen über den Raum: Der Spieler schließt aus Gegenständen, Spuren und ihrer Anordnung, was hier geschehen ist.

      Harvey Smith und Matthias Worch nannten ihren GDC-Vortrag 2010 nach dieser Frage, „What Happened Here?“. In Gone Home rekonstruiert man über Gegenstände, Notizen und Tagebucheinträge, was in einem leeren Haus passiert ist.

      Abgrenzung: Orientierung und Wegführung gehören zum Level-Design; hier geht es darum, was ein Raum bedeutet.
    tags: [umgebung, environmental-storytelling]
    level: 2
  - id: jenkins-vier-arten
    module: umgebung-erzaehlt
    q: Welche vier Arten räumlichen Erzählens unterscheidet Henry Jenkins?
    a: |
      Jenkins (2004) nennt Räume, die bekannte Geschichten aufrufen (evoked), Bühnen für Ereignisse (enacted), Räume mit eingebetteter Information (embedded) und Räume, die Material für eigene Geschichten der Spieler liefern (emergent). Er folgert, Designer seien weniger Geschichtenerzähler als „narrative architects“.

      Gone Home ist vor allem eingebettetes Erzählen: Die Vorgeschichte liegt in den Dingen und wartet darauf, gefunden zu werden.

      Abgrenzung: Die Arten schließen sich nicht aus; ein Raum kann Bühne sein und zugleich Spuren tragen.
    tags: [umgebung, jenkins]
    level: 2
  - id: tagebuch-erklaert-alles
    module: umgebung-erzaehlt
    q: Warum ist ein Tagebuch, das alles erklärt, schwaches Environmental Storytelling?
    a: |
      Weil es dem Spieler die Schlussfolgerung abnimmt; aus Spurenlesen wird Lesen, und das Tagebuch ist Exposition in anderer Form.

      Stärker ist eine Anordnung, aus der der Spieler selbst schließt, und ein Text, der nur ergänzt oder eine Frage öffnet. Gone Home nutzt Notizen und Tagebucheinträge, aber zusammen mit Gegenständen in einem Haus, das der Spieler selbst erkundet.

      Abgrenzung: Texte am Ort sind erlaubt; prüf, ob die übrigen Spuren ohne sie noch etwas erzählen.
    tags: [umgebung, exposition]
    level: 2
  - id: zeigen-und-zusammenfassen
    module: umgebung-erzaehlt
    q: Gilt „Show, don't tell“ immer?
    a: |
      Nein. Zeigen lässt den Leser schließen, Zusammenfassen spart Erzählzeit für das, was zählt; Hebel fasst in „Unverhofftes Wiedersehen“ fünfzig Jahre in wenigen Sätzen zusammen und zeigt das Wiedersehen ausführlich.

      Ein Gefühl benennt er dabei nicht. Er schreibt, dass die Braut das Halstuch weglegte, um ihn weinte „und vergaß ihn nie“.

      Abgrenzung: Der Fehler ist das doppelte Sagen, wenn eine Szene ein Gefühl zeigt und der Erzähler es danach noch einmal nennt.
    tags: [umgebung, zeigen]
    level: 2
  - id: textbox-grenze
    module: werkstatt-dialog
    q: Wie lang darf eine Replik in einer Textbox sein?
    a: |
      So lang, wie die Textbox deines eigenen Projekts sauber fasst. Die Zahl hängt von Schrift, Auflösung und Boxgröße ab; du misst sie selbst.

      Ist eine Replik länger, prüf, ob sie zwei Absichten enthält, und teil sie sonst am Satzende, denn jedes Boxende ist eine Pause.

      Abgrenzung: Die Grenze ist ein Maß, kein Verbot. Woyzeck antwortet lange nur „Ja wohl, Herr Hauptmann“, und gerade deshalb fällt auf, wenn er mehrere Sätze am Stück spricht.
    tags: [werkstatt, textbox]
    level: 2
  - id: alle-klingen-gleich
    module: werkstatt-dialog
    q: Alle Figuren in deinem Dialog klingen gleich. Was prüfst du?
    a: |
      Meist sprechen alle mit der Stimme des Autors, mit gleichem Wortschatz, gleicher Satzlänge und gleicher Höflichkeit.

      Bei Büchner redet der Hauptmann sprunghaft über Zeit, Ewigkeit und Moral, Woyzeck antwortet knapp und spricht, wenn er länger wird, über Geld: „Wir arme Leut!“ Zum Prüfen deckst du die Namen ab und schaust, ob du trotzdem erkennst, wer spricht.

      Abgrenzung: Ein Lieblingswort hilft beim Wiedererkennen, ersetzt aber keine eigene Absicht der Figur.
    tags: [werkstatt, stimme]
    level: 2
  - id: schauplatz-spuren
    module: werkstatt-dialog
    q: Wie prüfst du eine Liste von Spuren für einen Schauplatz, bevor du sie baust?
    a: |
      Zu jeder Spur gehören zwei Antworten: was sie erzählt und was der Spieler daraus schließen soll. Eine Spur ohne Schluss ist Ausstattung.

      Jede tragende Spur prüfst du außerdem in Kamera und Auflösung deines Spiels, denn was der Spieler nicht erkennt, erzählt ihm nichts.

      Abgrenzung: Die Liste ist eine Vorhersage; ob die Schlüsse ankommen, zeigt erst ein Testlauf.
    tags: [werkstatt, umgebung]
    level: 2
  - id: exposition-verteilen
    module: werkstatt-dialog
    q: Im Entwurf steht ein Block Vorgeschichte. Was tust du damit?
    a: |
      Markier jeden Satz, der eine Tatsache mitteilt, und frag, wer in der Szene sie nicht kennt oder einen Grund hat, sie auszusprechen. Ohne Grund legst du sie in den Konflikt, gibst sie einer Figur, die sie nicht kennt, oder an den Ort, oder du verschiebst oder streichst sie.

      Kleists „Marquise von O...“ zeigt, wie Vorgeschichte zur Antwort wird. Die Zeitungsanzeige verrät das Ergebnis, und alles Weitere beantwortet, wie es dazu kam.

      Abgrenzung: Exposition ist kein Fehler, solange sie die Handlung nicht anhält.
    tags: [werkstatt, exposition]
    level: 2

  # Track C: Interaktive Entscheidungen
  - id: raetsel-vs-spannung
    module: spielerwissen
    q: Was ist der Unterschied zwischen Rätsel und Spannung?
    a: |
      Beim Rätsel weiß der Leser weniger und sucht die Ursache („Was ist passiert?“), bei der Spannung weiß er mehr als die Figur und fürchtet, was kommt („Was wird passieren?“).

      Kleists „Marquise von O...“ beginnt als Rätsel, mit dem Ergebnis in der Zeitung. Rotkäppchen beim Wolf ist Spannung mit dramatischer Ironie, weil der Leser weiß, wer im Bett liegt.

      Abgrenzung: Überraschung wirkt einen Augenblick, Spannung kann eine ganze Szene tragen.
    tags: [wissen, spannung]
    level: 2
  - id: meaningful-play
    module: spielerwissen
    q: Was meinen Salen und Zimmerman mit Meaningful Play?
    a: |
      In „Rules of Play“ (2003) ist Spielen bedeutsam, wenn die Beziehung zwischen Handlung und Ergebnis erkennbar (discernable) und in den Zusammenhang des Spiels eingebunden (integrated) ist. Erkennbar heißt, der Spieler sieht, dass seine Wahl etwas bewirkt; eingebunden, dass es später noch zählt.

      Telltales Einblendung, eine Figur werde sich „erinnern“, macht eine Wahl erkennbar. Ob sie eingebunden ist, zeigt erst der weitere Verlauf.

      Abgrenzung: „Meaningful“ heißt hier nicht tiefsinnig; auch ein Sprung über eine Grube kann bedeutsam sein.
    tags: [wissen, meaningful-play]
    level: 2
  - id: verstaendliche-entscheidung
    module: spielerwissen
    q: Wann ist eine Entscheidung für den Spieler verständlich?
    a: |
      Wenn er Optionen und Einsatz kennt und eine begründete Erwartung hat, ohne das Ergebnis zu kennen. Fünf Fragen prüfen das: was zur Wahl steht, was der Spieler weiß, was die Figur weiß, was der Spieler erwartet und wann er sieht, was passiert.

      Fehlende Information kann Absicht sein. Am „Gate“ in Spec Ops: The Line setzt der Trupp weißen Phosphor ein und tötet Zivilisten, und laut Wikipedia wollte das Team, dass Spieler sich über die Entwickler ärgern, die sie dazu gezwungen haben.

      Abgrenzung: Fehlt Information aus Versehen, liest der Spieler die Folge als Willkür.
    tags: [wissen, entscheidung]
    level: 2
  - id: telegraphing
    module: spielerwissen
    q: Was ist Telegraphing, und wie kündigst du an, ohne zu verraten?
    a: |
      Telegraphing heißt in der Spielebranche, anzukündigen, was kommt, im Kampf etwa durch die Ausholbewegung. In der Erzählung kündigst du den Einsatz an, nicht das Ergebnis: „Der Anschlusszug wartet heute nicht“ lässt abwägen, „Wenn du Kaffee holst, verpasst du den Zug“ nimmt die Entscheidung weg (Lehrbeispiel).

      Abgrenzung: Bleibt danach nur eine vernünftige Option, hat die Ankündigung das Ergebnis verraten. Verwandt, aber nicht dasselbe: Tschechows Gewehr verlangt, dass Eingeführtes eingelöst wird.
    tags: [wissen, telegraphing]
    level: 2
  - id: ludonarrative-dissonanz
    module: folgen-anreize
    q: Was ist ludonarrative Dissonanz?
    a: |
      Ein Widerspruch zwischen dem, was ein Spiel als Spiel sagt, und dem, was es als Geschichte sagt; Clint Hocking prägte den Begriff 2007 an BioShock.

      Er stellt einen spielerischen Vertrag („seek power and you will progress“) neben einen erzählerischen („help Atlas and you will progress“). Den Bruch sieht er zwischen beiden: Die Mechanik lässt die Wahl, aus Eigeninteresse zu ernten oder zu retten, die Geschichte lässt keine Wahl, ob man Atlas hilft.

      Abgrenzung: Greift ein Spiel den Widerspruch absichtlich auf, ist er ein Dilemma oder ein Stilmittel.
    tags: [anreize, dissonanz]
    level: 3
  - id: bioshock-little-sisters
    module: folgen-anreize
    q: Wie stellt BioShock bei den Little Sisters Anreiz und Moral gegeneinander?
    a: |
      Ernten bringt 160 ADAM, Retten 80, aber nach jeweils drei Rettungen liegt ein Geschenk von Tenenbaum im nächsten Gatherer's-Garden-Automaten. Wer alle rettet, sieht das gute Ende, wer eine oder mehrere erntet, das schlechte.

      Der Anreiz spricht sofort für das Ernten, Ausgleich und Ende sprechen später für das Retten.

      Abgrenzung: Je mehr das Geschenk ausgleicht, desto weniger kostet die Moral. Hocking schreibt, Retten sei auch über die Zeit nicht das bessere Geschäft.
    tags: [anreize, bioshock]
    level: 3
  - id: dilemma-vs-dissonanz
    module: folgen-anreize
    q: Was unterscheidet ein Dilemma von ludonarrativer Dissonanz?
    a: |
      Im Dilemma stellt das Design Anreiz und Wert absichtlich gegeneinander, und jede Option kostet etwas. Dissonanz entsteht, wenn die Mechanik belohnt, was die Geschichte verurteilt, und das Spiel den Widerspruch nicht bearbeitet.

      Frostpunk baut das Dilemma in seine Gesetze: Kinderarbeit oder 24-Stunden-Schichten steigern die Produktion und kosten Zufriedenheit.

      Abgrenzung: Derselbe Widerspruch kann beides sein; entscheidend ist, ob das Spiel ihn kennt und Folgen daran knüpft.
    tags: [anreize, dilemma]
    level: 3
  - id: moralmeter
    module: folgen-anreize
    q: Was ist das Problem eines Moralmeters?
    a: |
      Ein Moralmeter zählt Entscheidungen als Punkte und lädt dazu ein, nach dem Balken zu wählen statt nach der Lage. In Mass Effect (2007) schalten Paragon- und Renegade-Punkte besondere Dialogoptionen frei, also lohnt es sich, auf einer Seite zu sammeln.

      Pentiment geht den anderen Weg und löst nicht auf, welche Antwort richtig war; Game Director Josh Sawyer sagt, „there cannot be a right answer“.

      Abgrenzung: Ein Meter kann Haltung sichtbar machen; problematisch wird er, wo er die moralische Frage durch Rechnen ersetzt.
    tags: [anreize, moralmeter]
    level: 3
  - id: alle-waehlen-gleich
    module: folgen-anreize
    q: "Bewerbungsgespräch: Im Testlauf wählen alle Testpersonen dieselbe Option. Woran kann das liegen?"
    a: |
      Naheliegend ist, dass eine Option mechanisch lohnender oder moralisch eindeutig ist oder die anderen nicht als Optionen erkennbar sind.

      Frag neutral „Warum hast du so gewählt?“ und vergleich die Antworten mit dem, was die Mechanik belohnt. In BioShock bringt Ernten sofort doppelt so viel ADAM wie Retten.

      Abgrenzung: Eine einseitige Wahl kann gewollt sein; soll sie etwas kosten, muss jede Option erkennbar etwas bieten.
    tags: [anreize, playtest, interview]
    level: 3
  - id: kombinatorische-explosion
    module: verzweigungen
    q: Was ist kombinatorische Explosion?
    a: |
      Jede Entscheidung, die nicht zurückführt, vervielfacht die Wege um die Zahl ihrer Optionen: Drei Entscheidungen mit je zwei Optionen ergeben acht Wege, zehn schon 1.024.

      Jeder Weg kostet Text, Grafik und Testzeit. 80 Days von inkle enthält rund 750.000 Wörter, von denen ein Durchgang etwa zwei Prozent zeigt.

      Abgrenzung: Führst du Zweige zusammen und merkst dir die Wahl in einer Variable, wächst der Aufwand langsamer.
    tags: [verzweigung, umfang]
    level: 3
  - id: branch-and-bottleneck
    module: verzweigungen
    q: Wie funktioniert Branch and Bottleneck, und was kostet es?
    a: |
      Die Zweige laufen regelmäßig an Ereignissen zusammen, die in jeder Fassung vorkommen, und Zustandsvariablen merken sich, was der Spieler getan hat.

      Sam Kabo Ashwell (2015) beschreibt das Muster als geeignet, die Entwicklung der Spielerfigur zu zeigen, während der Plot beherrschbar bleibt. Es kostet viele Variablen und eine gewisse Länge.

      Abgrenzung: Ohne Variable wird daraus ein Gauntlet, denn nach dem Engpass ist die Wahl vergessen.
    tags: [verzweigung, ashwell]
    level: 3
  - id: verzweigungen-begrenzen
    module: verzweigungen
    q: "Bewerbungsgespräch: Wie begrenzt du Verzweigungen, ohne Entscheidungen zu entwerten?"
    a: |
      Ich halte die Zahl getrennter Wege klein und lege den Aufwand in Zustand und Rückbezüge: wenige große Verzweigungen, viele kleine Reaktionen, Zweige an Engpässen zusammengeführt, die Wahl in einer Variable.

      The Witcher 3 zeigt die verzögerte Folge. Was Geralt in „The Whispering Hillock“ mit dem Geist tut, entscheidet erst später über Anna und die Waisen.

      Abgrenzung: Begrenzen heißt nicht entwerten; jede Wahl braucht mindestens eine Folge, die der Spieler sieht und zuordnen kann.
    tags: [verzweigung, interview]
    level: 3
  - id: rueckbezug
    module: verzweigungen
    q: Was ist ein Rückbezug, und warum ist er günstiger als ein neuer Zweig?
    a: |
      Eine spätere Stelle, die auf eine frühere Wahl reagiert, etwa eine Zeile, ein Gegenstand oder eine veränderte Begrüßung. Sie kostet wenig und zeigt, dass das Spiel zuhört.

      Telltales The Walking Dead meldet nach Entscheidungen, eine Figur werde sich „erinnern“; Matthew Byrd argumentiert bei Den of Geek, die großen Folgen stünden trotzdem weitgehend fest.

      Abgrenzung: Ein Rückbezug wirkt nur, wenn der Spieler die Wahl wiedererkennt; liegt viel Zeit dazwischen, erinnere ihn vorher.
    tags: [verzweigung, rückbezug]
    level: 3
  - id: twine-grundbegriffe
    module: werkstatt-entscheidung
    q: Was sind in Twine Passage, Link und Story-Format?
    a: |
      Eine Passage ist ein Textabschnitt, den der Spieler in einem Moment sieht. `[[Annehmen->Gespräch]]` zeigt „Annehmen“ und führt zur Passage „Gespräch“, die Twine leer anlegt, falls es sie noch nicht gibt; Passagennamen unterscheiden Groß- und Kleinschreibung.

      Das Story-Format bestimmt Syntax und Verhalten; Standard ist Harlowe, in Twine 2.12.1 die Version 3.3.9.

      Abgrenzung: Variablen sind Sache des Formats. SugarCube schreibt `<<if $hasKey>>`, Harlowe `(if: $hasKey)[…]`.
    tags: [werkzeug, twine]
    level: 2
  - id: harlowe-variable
    module: werkstatt-entscheidung
    q: Wie merkt sich ein Harlowe-Prototyp eine Entscheidung?
    a: |
      Mit einer Variable, die die Optionspassage setzt, etwa `(set: $angenommen to true)`. Eine spätere Passage zeigt mit `(if: $angenommen)[…](else:)[…]` je nach Wert einen anderen Text; `$`-Variablen gelten über Passagen hinweg, `_`-Variablen nur in Passage oder Hook.

      Abgrenzung: `(if:)` nimmt nur Wahrheitswerte an und wertet einmal aus, wenn die Passage erscheint. Eine nie gesetzte `$`-Variable hat in Harlowe 3 den Wert 0, und `(if: $angenommen)` meldet dann einen Fehler.
    tags: [werkzeug, harlowe]
    level: 3
  - id: twine-sichern
    module: werkstatt-entscheidung
    q: Warum sicherst du Twine-Geschichten regelmäßig als Datei?
    a: |
      Browser-Twine speichert alles im lokalen Speicher von Browser und Profil, und wer Browserdaten löscht, verliert die Geschichten. Die Twine-Referenz verlangt deshalb regelmäßige Backups, etwa mit „Archive“ im Reiter „Library“; auf iOS muss Twine auf dem Home-Bildschirm liegen, sonst ist nach einer Woche ohne Nutzung alles weg.

      Abgrenzung: Das Archiv ist eine Sicherung. Für Testpersonen erzeugt „Publish to File“ im Reiter „Build“ eine HTML-Datei.
    tags: [werkzeug, twine]
    level: 2
  - id: engine-werkzeuge
    module: werkstatt-entscheidung
    q: Welche Werkzeuge kommen infrage, wenn verzweigter Dialog in eine Engine soll?
    a: |
      Stand Oktober 2026: ink von inkle (1.2.1, Editor Inky 0.15.2), Yarn Spinner (Kern 3.2.2, Unity 3.2.8; für Godot eine C#-Fassung 0.3.23 ohne offiziellen Support und eine GDScript-Fassung im Early Access) und der Dialogue Manager von Nathan Hoad (4.1.0, für Godot 4.6 und neuer).

      Für den Prototyp einer Entscheidung reicht Twine. Die Engine-Werkzeuge lohnen sich, wenn Text, Variablen und Spielzustand zusammenkommen.

      Abgrenzung: Begriffe und Ablauf übertragen sich, die Syntax nicht.
    tags: [werkzeug, engine]
    level: 3

  # Track D: Überarbeiten und Testen
  - id: ueberarbeiten-redigieren-korrigieren
    module: ueberarbeiten
    q: Was unterscheidet Überarbeiten, Redigieren und Korrigieren?
    a: |
      Überarbeiten verändert Aufbau und Szenen, Redigieren arbeitet an Satz und Wort, Korrigieren beseitigt Fehler in Rechtschreibung, Grammatik und Zeichensetzung.

      Die Reihenfolge geht von groß nach klein, weil ein gestrichener Absatz keinen Feinschliff mehr braucht.

      Abgrenzung: Die Grenzen sind fließend, aber wer mit den Kommas anfängt, poliert leicht Sätze, die er später streicht.
    tags: [überarbeiten, begriffe]
    level: 2
  - id: pruefbare-kriterien
    module: ueberarbeiten
    q: Wie machst du aus einer beabsichtigten Wirkung ein prüfbares Kriterium?
    a: |
      Du fragst, was der Leser nach der Szene wissen, fühlen oder fragen soll, und formulierst es als etwas, das du an einer Textstelle oder an der Reaktion eines Lesers beobachten kannst. „Der Text ist spannend“ ist ein Geschmacksurteil, „Der Leser kann nach der Szene sagen, was die Figur will“ ein Kriterium.

      Für Hebels „Unverhofftes Wiedersehen“ könnte eines lauten: Der Leser weiß vor dem Fund des Leichnams, dass die Braut nie aufgehört hat zu trauern.

      Abgrenzung: Andere Deutungen sind kein Fehler, solange die beabsichtigte Wirkung ankommt.
    tags: [überarbeiten, kriterien]
    level: 2
  - id: murder-your-darlings
    module: ueberarbeiten
    q: Woher stammt „Murder your darlings“, und was ist gemeint?
    a: |
      Arthur Quiller-Couch sagte es am 28. Januar 1914 in der Vorlesung „On Style“, gedruckt 1916 in „On the Art of Writing“. Wer den Drang zu einem Stück besonders feinen Schreibens verspüre, solle ihm folgen und es vor dem Druck löschen.

      Er sagt das dort, wo er erklärt, dass Stil kein aufgesetzter Schmuck sein kann. Gemeint ist die Stelle, die du schreibst, um schön zu schreiben.

      Abgrenzung: Eine Lieblingsstelle, die der beabsichtigten Wirkung dient, bleibt; die übrigen streichst du und notierst den Grund.
    tags: [überarbeiten, kürzen]
    level: 2
  - id: rueckwaertsgliederung
    module: ueberarbeiten
    q: Was ist eine Rückwärtsgliederung, und was zeigt sie?
    a: |
      Nach dem Entwurf schreibst du je Szene oder Abschnitt einen Satz auf, was dort passiert und was sich ändert (englisch reverse outline). So siehst du, was der Text tut, nicht was du geplant hast.

      Für Hebels „Unverhofftes Wiedersehen“ ergeben sich sechs Zeilen von den Hochzeitsplänen bis zum Begräbnis, und jede verschiebt die Lage. Doppelte Szenen oder Abschnitte ohne Änderung fallen in so einer Liste sofort auf.

      Abgrenzung: Sie ersetzt keine Planung, sie prüft, ob der Entwurf den Plan einlöst.
    tags: [überarbeiten, aufbau]
    level: 2
  - id: ki-nur-korrektur
    module: ueberarbeiten
    q: Warum lässt du KI deine Texte höchstens auf Rechtschreibung und Grammatik prüfen?
    a: |
      Weil Stilvorschläge deine Formulierungen durch naheliegende ersetzen und damit die eigene Stimme verschieben, oft unbemerkt; Rechtschreibung und Grammatik betreffen nur, ob ein Satz korrekt ist.

      In diesem Kurs hilft KI deshalb nur bei Struktur, Checklisten und auf Wunsch bei der Korrektur. Ideen, Figuren und Formulierungen stammen von dir.

      Abgrenzung: Auch die Wirkung beurteilt keine Maschine für dich; die prüfst du an deinen Kriterien und an Menschen im Testlauf.
    tags: [überarbeiten, ki]
    level: 2
  - id: lautes-denken
    module: testlesen-playtest
    q: Was ist lautes Denken im Testlauf, und was ist deine Rolle dabei?
    a: |
      Die Testperson liest oder spielt und spricht laufend aus, was sie denkt; Jakob Nielsen nennt die Methode im Titel seines Artikels das Usability-Werkzeug Nummer eins.

      Deine Rolle ist zu schweigen, nicht zu helfen und höchstens mit „Was denkst du gerade?“ ans Weitersprechen zu erinnern. Jeder Satz von dir steht nicht in deinem Text.

      Abgrenzung: Menschen filtern, was sie laut sagen; was sie tun, etwa zurückblättern oder vor einer Wahl zögern, ergänzt ihre Worte.
    tags: [testen, lautes-denken]
    level: 3
  - id: beobachtung-und-deutung
    module: testlesen-playtest
    q: Warum trennst du im Testprotokoll Beobachtung und Deutung?
    a: |
      Beobachtung ist, was die Person getan oder gesagt hat („scrollt zum Anfang zurück“), Deutung deine Erklärung dafür („ist verwirrt“); auch ein „weil“ ist fast immer Deutung. Mischst du beides, prüfst du später deine Vermutungen statt der Ereignisse, deshalb führst du zwei Spalten.

      Abgrenzung: Eine einzelne Beobachtung ist kein Urteil. Wiederholt sie sich bei der nächsten Person, hast du ein Muster, und was du änderst, entscheidest du selbst.
    tags: [testen, protokoll]
    level: 3
  - id: critical-response-process
    module: testlesen-playtest
    q: Wie läuft Liz Lermans Critical Response Process ab?
    a: |
      Lerman hat ihn 1990 entwickelt. Eine Moderation führt durch vier Schritte: Bedeutungsaussagen der Antwortenden, Fragen des Autors, neutrale Fragen und zuletzt Meinungen nur mit Erlaubnis („Ich habe eine Meinung zu …, möchtest du sie hören?“).

      Die Reihenfolge lässt die Kontrolle beim Autor, der bestimmt, worüber gesprochen wird, und eine Meinung ablehnen darf.

      Abgrenzung: Der Prozess ordnet Rückmeldung; ob jemand eine Entscheidung versteht, beobachtest du vorher im Testlauf.
    tags: [testen, crp]
    level: 3
  - id: neutrale-fragen
    module: testlesen-playtest
    q: Welche Fragen stellst du nach einem Testlauf, und welche nicht?
    a: |
      Offene, neutrale Fragen wie „Was ist passiert?“, „Was hast du erwartet?“ und „Warum hast du so gewählt?“. Neutral ist eine Frage nach Lerman, wenn keine Meinung in ihr steckt.

      „Hast du gemerkt, dass die Wahl wichtig war?“ verrät deine Absicht und lässt nur Ja oder Nein zu; „Hat es dir gefallen?“ sammelt Geschmack statt Verständnis.

      Abgrenzung: Eine gezielte Detailfrage zu deinem Kriterium stellst du zuletzt, damit sie die früheren Antworten nicht färbt.
    tags: [testen, fragen]
    level: 3
