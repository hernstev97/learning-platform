id: werkstatt-szene
title: "Werkstatt: eine Szene schreiben und überarbeiten"
level: 2
minutes: 240
summary: Du schreibst eine Szene für dein eigenes Projekt und überarbeitest sie in getrennten Durchgängen, mit Szenenkarte, aufgehobenen Fassungen und einer Reflexion über deine Änderungen.
place: pc
goals:
  - Du legst vor dem Schreiben auf einer Szenenkarte fest, welcher Wert sich in deiner Szene dreht und durch wessen Augen der Leser sieht.
  - Du schreibst einen Entwurf von 300 bis 600 Wörtern in einem Zug, ohne dabei zu überarbeiten.
  - Du überarbeitest in getrennten Durchgängen (Ziel und Konflikt, Wendung, Perspektive, Anfang und Ende) und begründest jede Änderung.
  - Du hebst jede Fassung auf und vergleichst sie, als eigene Datei oder mit Git.
  - Du begründest, warum KI in dieser Werkstatt höchstens Rechtschreibung und Grammatik prüft.
