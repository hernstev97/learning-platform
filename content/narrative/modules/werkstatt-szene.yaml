  - title: Heinrich von Kleist · Das Erdbeben in Chili (Projekt Gutenberg-DE)
    url: https://projekt-gutenberg.org/authors/heinrich-von-kleist/books/heinrich-v-kleist-das-erdbeben-in-chili/chapter/1
lesson: |
  Du setzt dich hin, um eine Szene zu schreiben, und nach einer Stunde hast du den ersten Absatz fünfmal umformuliert. Der Rest fehlt. Randy Ingermanson beschreibt genau diese Lage: Man starrt auf den Bildschirm und traut sich nicht weiter, weil man eine Regel brechen könnte ([Writing the Perfect Scene](https://www.advancedfictionwriting.com/articles/writing-the-perfect-scene/)). Das Problem sind nicht die Regeln. Das Problem ist, sie beim Schreiben anzuwenden statt danach.

  In diesem Modul schreibst du eine Szene für dein eigenes Projekt und überarbeitest sie. Die Lektion erklärt den Ablauf und warum er so gebaut ist. Die Übungen sind die Arbeitsschritte, einer nach dem anderen. Es gibt keine Mustertexte und keine Vorschläge für den Inhalt: Was in deiner Szene passiert, entscheidest du.

  > [!NOTE] Zeit einplanen
  > Plan mindestens zwei Sitzungen am PC ein, mit einer Nacht dazwischen. In der ersten entstehen Szenenkarte und Entwurf, in der zweiten (oder in mehreren kürzeren) die Durchgänge und die Reflexion. Die ersten sechs Übungen gehen schnell, die letzten sechs sind die Werkstatt selbst.

  ## Der Ablauf im Überblick

  1. **Szenenkarte** – Ziel, Widerstand, Wendung, Wert vorher und nachher, Perspektive.
  2. **Entwurf** – in einem Zug, 300–600 Wörter.
  3. **Abstand** – mindestens eine Nacht.
  4. **Durchgänge** – Ziel und Konflikt, dann Wendung, dann Perspektive, dann Anfang und Ende.
  5. **Laut lesen.**
  6. **Reflexion** – drei Änderungen und warum.

  Die Reihenfolge geht vom Großen zum Kleinen. Fehlt der Szene die Wendung, ist jede Mühe an einzelnen Sätzen verschwendet, denn beim Umbau fallen sie ohnehin. Die Kriterien kennst du aus den ersten drei Modulen: Ziel und Widerstand aus [Figuren: Ziel, Motiv und Widerstand](/narrative/figuren-motivation), Fokalisierung aus [Perspektive](/narrative/perspektive), Wertewechsel, Swains Muster und „spät hinein, früh hinaus“ aus [Konflikt und Szenenaufbau](/narrative/szenenaufbau). Wie du eigene Kriterien aus der beabsichtigten Wirkung ableitest, steht ausführlicher in [Überarbeiten mit eigenen Kriterien](/narrative/ueberarbeiten).

  ## Die Szenenkarte: festlegen, was sich dreht

  Die Szenenkarte ist eine halbe Seite Stichpunkte, bevor du einen Satz Szene schreibst. Sie hält fest, wer die Szene trägt, was diese Figur will, was dagegen steht, welcher Wert sich dreht und durch wessen Augen der Leser sieht. Die Frage nach dem Wert stammt von Robert McKee: Wo steht er am Anfang, wo am Ende ([Do your scenes turn?](https://mckeestory.com/do-your-scenes-turn/))?

  Die Karte ist der Maßstab für alle Durchgänge. Ohne Karte prüfst du den Entwurf gegen ein Gefühl, mit Karte gegen deine eigene Absicht. Sie darf sich ändern. Merkst du beim Schreiben, dass die Szene etwas anderes will, schreib weiter und pass die Karte danach an. Notier die Änderung aber neben der alten Fassung, statt sie zu überschreiben, sonst misst du den Entwurf an einer Karte, die du ihm nachträglich angepasst hast.

  ## Der Entwurf in einem Zug

  Den Entwurf schreibst du in einer Sitzung bis zum Ende, 300 bis 600 Wörter. Das reicht für Ziel, Konflikt und Wendung und lässt sich in einer Sitzung schaffen. In einem Zug heißt: nicht zurückspringen, nichts löschen, um es zu verbessern. Fehlt dir ein Wort oder eine Information, setz eine Markierung wie `[XX]` und schreib weiter.

  Wer jeden Satz sofort prüft, kommt selten bis zur Wendung. Ohne Wendung aber haben die Durchgänge nichts, woran sie ansetzen können. Ein schwacher Entwurf mit Ende ist für die Überarbeitung mehr wert als ein polierter erster Absatz.

  > [!PRAXIS] Erschaffen, liegen lassen, zerlegen
  > Ingermanson trennt in „Writing the Perfect Scene“ drei Phasen. Beim Erschaffen rät er, alle Regeln zu vergessen und so zu schreiben, wie es kommt. Danach soll der Text eine Weile liegen, während man etwas anderes tut. Erst dann folgt die Analyse, die er das Gegenteil des Erschaffens nennt: Der Text wird auseinandergenommen und neu zusammengesetzt, geprüft an Swains Muster von Szene und Folgeszene. Für ihn sind es Gegensätze, die man nacheinander erledigt, nicht gleichzeitig.

  ## Abstand und getrennte Durchgänge

  Leg den Entwurf mindestens eine Nacht weg. Direkt nach dem Schreiben liest du, was du gemeint hast. Mit Abstand liest du eher, was dasteht.

  Dann liest du den Entwurf mehrmals, jedes Mal mit nur einer Frage, denn pro Durchgang siehst du nur eine Sorte Problem. Wer gleichzeitig auf Wendung, Perspektive und Kommas achtet, findet die Kommas, weil sie am leichtesten zu sehen sind, und übersieht, dass die Wendung fehlt.

  > [!MERKE]
  > Ein Durchgang, eine Frage. Notier zu jeder Änderung, was du änderst und warum.

  ### Durchgang 1: Ziel und Konflikt

  Wo erkennt der Leser, was die Figur will? Wo stößt das Ziel auf Widerstand? Markier beide Stellen. Absätze, in denen nichts dem Ziel im Weg steht, sind Kandidaten zum Kürzen oder für mehr Widerstand.

  ### Durchgang 2: Wendung

  Lies Anfang und Ende gegeneinander. Steht der Wert am Ende woanders als am Anfang, und in welchem Satz dreht er sich? Findest du den Satz nicht, fehlt die Wendung, oder sie steckt in einem Nebensatz und braucht mehr Erzählzeit.

  ### Durchgang 3: Perspektive

  Markier jeden Satz, in dem die Erzählung etwas weiß oder wahrnimmt, was die Fokalfigur nicht wissen oder wahrnehmen kann ([Living Handbook of Narratology: Focalization](https://www-archiv.fdm.uni-hamburg.de/lhn/node/18.html)). Markier außerdem Sätze, die ein Gefühl der Figur benennen, das die Szene schon zeigt.

  ### Durchgang 4: Anfang und Ende

  Streich probeweise den ersten Satz, dann den ersten Absatz, und frag, ob dem Leser danach etwas fehlt. Am Ende dasselbe: Steht nach der Wendung ein Satz, der nur erklärt, was passiert ist? Wie Büchner das in der Szene beim Hauptmann löst, steht in [Konflikt und Szenenaufbau](/narrative/szenenaufbau); einen Anfang von Kleist untersuchst du in den Übungen ([Projekt Gutenberg-DE](https://projekt-gutenberg.org/authors/heinrich-von-kleist/books/heinrich-v-kleist-das-erdbeben-in-chili/chapter/1)).

  ## Laut lesen

  Zum Schluss liest du die ganze Szene laut, in normalem Tempo. Das Ohr hört, was das Auge überspringt: Sätze, bei denen dir die Luft ausgeht, Wörter, die sich wiederholen, Dialog, den so niemand sagen würde. Korrigier beim Lesen nicht. Mach an jeder Stelle, an der du stolperst, ein Zeichen, und arbeite die Zeichen danach ab.

  ## Fassungen aufheben

  Heb jede Fassung auf. Ohne die alte Fassung kannst du in der Reflexion nicht zeigen, was sich geändert hat, und du kannst eine Änderung nicht zurücknehmen, die die Szene schlechter macht. Zwei Wege:

  - Eine Datei je Fassung, mit Nummer und Datum im Namen, etwa `szene-v1-2026-10-17.md`.
  - Ein Git-Repository für deine Texte, ein Commit je Durchgang, die Commit-Nachricht nennt den Grund. Die Grundlagen stehen in [Git-Grundlagen: drei Bereiche](/git/git-einstieg).

  > [!TIP] Prosa mit Git vergleichen
  > Git vergleicht zeilenweise. In einer Textdatei ist ein Absatz oft eine einzige Zeile, und eine kleine Änderung markiert dann den ganzen Absatz. `git diff --word-diff` zeigt stattdessen die geänderten Wörter ([git-diff](https://git-scm.com/docs/git-diff#Documentation/git-diff.txt---word-diffmode)).

  Die Plattform speichert, was du in ein Übungsfeld schreibst, als Entwurf. Für lange Texte ist dein eigener Editor trotzdem der bessere Ort. Ändert sich eine Übung später, lädt die Plattform deinen alten Entwurf nicht automatisch in die neue Fassung der Übung; exportieren lässt er sich weiterhin. Schreib deshalb in deiner Datei und füg den Text in die Übung ein.

  ## KI in der Werkstatt

  Szenenkarte, Entwurf und jede Überarbeitung stammen von dir. KI nutzt du hier höchstens für Rechtschreibung und Grammatik, und nur, wenn du das willst; das Textfeld der Übungen prüft die Rechtschreibung schon im Browser. Stilvorschläge lässt du weg. Ein Vorschlag, der einen Satz „flüssiger“ macht, ersetzt deine Wortwahl und deinen Satzrhythmus durch fremde. Nach einigen solchen Durchgängen klingt die Szene nicht mehr nach dir, und du weißt nicht mehr, welche Entscheidung von dir stammt.

  > [!WARNING] Auch Fragen sind Aufträge
  > „Was fehlt hier?“ oder „Ist die Szene gut so?“ liefert dir von einer KI Vorschläge für den Inhalt. Diese Fragen beantwortest du in den Durchgängen selbst, mit deiner Szenenkarte als Maßstab, und später beobachtest du echte Leser dabei ([Testlesen und Playtest](/narrative/testlesen-playtest)).

  ## Häufige Fehler

  - **Beim Entwurf schon überarbeitet.** Der erste Absatz hat fünf Fassungen, das Ende fehlt. Schreib mit Markierungen weiter und heb dir die Korrektur für die Durchgänge auf.
  - **Alles in einem Durchgang.** Deine Notizen betreffen nur Wörter und Kommas, obwohl die Wendung fehlt. Trenn die Durchgänge und fang beim Großen an.
  - **Karte stillschweigend angepasst.** Karte und Entwurf passen genau zusammen, weil du die Karte nach dem Entwurf umgeschrieben hast. Heb die erste Karte auf und notier, was sich geändert hat.
  - **Keine alte Fassung.** In der Reflexion kannst du Änderungen nur aus dem Gedächtnis nennen. Speichere vor jedem Durchgang eine Fassung.
  - **Überarbeiten heißt nur kürzen.** Die Szene wird kürzer, aber der Wert dreht sich immer noch nicht. Prüf zuerst Ziel, Konflikt und Wendung, dann die Länge.
  - **Stilvorschläge übernommen.** Die Sätze klingen glatter, aber nicht mehr nach dir. Geh zur Fassung vor dem Vorschlag zurück und entscheide selbst.

  ## Zusammenfassung

  - Erst die Szenenkarte: Ziel, Widerstand, Wendung, Wert vorher und nachher, Fokalfigur.
  - Der Entwurf entsteht in einem Zug, 300 bis 600 Wörter, Lücken markiert statt gesucht.
  - Zwischen Entwurf und Überarbeitung liegt mindestens eine Nacht.
  - Jeder Durchgang stellt eine Frage, vom Großen zum Kleinen: Ziel und Konflikt, Wendung, Perspektive, Anfang und Ende.
  - Laut lesen findet, was das Auge überspringt. Beim Lesen markieren, danach korrigieren.
  - Jede Fassung bleibt erhalten, als Datei oder als Commit; jede Änderung hat einen notierten Grund.
  - KI prüft höchstens Rechtschreibung und Grammatik, auf deinen Wunsch. Stil und Inhalt bleiben bei dir.
exercises:
  - id: ablauf-ordnen
    type: order
    title: Was kommt wann?
    prompt: |
      Bring die Arbeitsschritte der Werkstatt in die Reihenfolge, in der du sie machst.
    lang: prose
    lines: |
      Szenenkarte ausfüllen
      Entwurf in einem Zug schreiben
      Mindestens eine Nacht Abstand
      Durchgang: Ziel und Konflikt
      Durchgang: Wendung
      Durchgang: Perspektive
      Durchgang: Anfang und Ende
    explanation: |
      Die Karte kommt vor dem Entwurf, weil sie der Maßstab für alle Durchgänge ist. Der Abstand trennt Schreiben und Prüfen. Ziel und Konflikt stehen vor der Wendung, denn ohne Ziel und Widerstand gibt es nichts, das sich drehen könnte. Perspektive und Anfang/Ende arbeiten an einzelnen Sätzen und kommen deshalb nach dem Umbau. Anfang und Ende stehen zuletzt, weil die früheren Durchgänge sie oft noch verschieben; erst wenn Inhalt und Perspektive stehen, lohnt sich das Kürzen.
    hints:
      - Vom Großen zum Kleinen. Was würde ein späterer Durchgang wieder zunichtemachen?
    resources:
      - title: Randy Ingermanson · Writing the Perfect Scene
        url: https://www.advancedfictionwriting.com/articles/writing-the-perfect-scene/

  - id: entwurf-wirkt-flach
    type: choice
    title: Am nächsten Morgen
    prompt: |
      Du liest deinen Entwurf nach einer Nacht, und er wirkt flach. Was tust du zuerst?
    options:
      - text: Die Szenenkarte neben den Entwurf legen und prüfen, ob der Wert am Ende woanders steht als am Anfang.
        correct: true
        why: „Flach“ ist ein Gefühl. Die Karte macht daraus eine prüfbare Frage, und eine fehlende Wendung ist eine typische Ursache dafür, dass eine Szene stillsteht.
      - text: Stärkere Verben und genauere Adjektive einsetzen.
        correct: false
        why: Das ist Arbeit an Sätzen. Dreht sich kein Wert, bleibt die Szene mit besseren Verben genauso flach.
      - text: Eine KI bitten, den Text lebendiger zu formulieren.
        correct: false
        why: Das ist ein Stilvorschlag. Er ersetzt deine Stimme und beantwortet nicht, warum die Szene flach wirkt.
      - text: Den Entwurf verwerfen und eine neue Szene anfangen.
        correct: false
        why: Möglich, aber erst nach der Diagnose. Ohne sie wiederholst du im neuen Entwurf vermutlich dasselbe Problem.
      - text: Mehr Dialog einfügen, damit mehr passiert.
        correct: false
        why: Dialog ohne Ziel und Widerstand ist Gerede. Mehr davon macht die Szene länger, nicht bewegter.
    explanation: |
      Der erste Durchgang beginnt beim Großen, und das Große ist der Wertewechsel. McKees Test mit zwei Notizen (wo steht der Wert am Anfang, wo am Ende?) sagt dir, ob der Entwurf ein Strukturproblem hat. Erst wenn sich der Wert dreht, lohnt sich die Arbeit an Sätzen.
    resources:
      - title: Robert McKee · Do your scenes turn?
        url: https://mckeestory.com/do-your-scenes-turn/

  - id: ki-auftrag
    type: choice
    title: Was darf die Maschine?
    prompt: |
      Welcher Auftrag an eine KI passt zur Regel dieser Werkstatt?
    options:
      - text: Prüf die Rechtschreibung in diesem Text und ändere sonst nichts.
        correct: true
        why: Rechtschreibung und Grammatik auf Wunsch sind erlaubt. Wortwahl, Satzbau und Inhalt bleiben, wie du sie geschrieben hast.
      - text: Formulier die Dialoge natürlicher.
        correct: false
        why: Das ist ein Stilvorschlag. Er ersetzt deine Wortwahl durch fremde und verschiebt deine Stimme.
      - text: Schlag drei mögliche Wendungen für diese Szene vor.
        correct: false
        why: Die Wendung ist der Kern der kreativen Arbeit an einer Szene. Ein Vorschlag nimmt dir genau die Entscheidung ab, die du üben willst.
      - text: Sag mir, ob die Szene gut ist und was fehlt.
        correct: false
        why: Die Antwort liefert Inhaltsvorschläge und ersetzt deine Kriterien. Das beantwortest du mit deiner Szenenkarte und später mit echten Testlesern.
    explanation: |
      Die Grenze verläuft zwischen Korrektur und Gestaltung. Rechtschreibung hat eine richtige Antwort, die nicht von dir abhängt. Stil, Wendung und Urteil hängen an deiner Absicht; wer sie abgibt, übt nicht mehr das Schreiben, sondern das Auswählen.

  - id: werkstatt-begriffe
    type: gap
    title: Vier Regeln der Werkstatt
    prompt: |
      Ergänze die Wörter.
    lang: prose
    code: |
      Die Szenenkarte hält fest, welcher ⟦Wert⟧ sich in der Szene dreht.
      Den Entwurf schreibst du in einem ⟦Zug⟧ und korrigierst dabei nichts.
      In jedem Durchgang suchst du nur eine ⟦Sorte⟧ Problem.
      Für Anfang und Ende gilt: spät ⟦hinein⟧, früh ⟦hinaus⟧.
    gaps:
      - label: Was sich dreht
        hint: McKees Begriff, ein Gegensatzpaar wie Nähe oder Fremdheit.
      - label: In einem …
        hint: Ohne Unterbrechung, von Anfang bis Ende.
        accept: ["Rutsch", "Stück"]
      - label: Welche Probleme
        hint: Ein anderes Wort für Art.
        accept: ["Art"]
      - label: Einstieg
        hint: Steig ein, wenn der Konflikt schon läuft.
        accept: ["rein"]
      - label: Ausstieg
        hint: Hör auf, sobald sich der Wert gedreht hat.
        accept: ["raus"]
    explanation: |
      Der Wert ist der Maßstab, an dem du Entwurf und Durchgänge misst. „In einem Zug“ trennt Schreiben von Prüfen, „eine Sorte Problem“ trennt die Durchgänge voneinander. „Spät hinein, früh hinaus“ ist die Frage des letzten Durchgangs.

  - id: wer-denkt-hier
    type: bug
    title: Ein Blick zu viel
    prompt: |
      Ein Lehrbeispiel, intern fokalisiert auf Ines: Der Leser nimmt nur wahr, was Ines wahrnimmt. So sieht der Durchgang Perspektive im Kleinen aus. Finde die Zeile, in der die Erzählung weiß, was eine andere Figur denkt.
    lang: prose
    code: |
      Ines legte die Fahrkarte auf den Tresen, noch bevor der Mann aufsah.
      „Umtausch geht nur bis eine Stunde vor Abfahrt“, sagte er.
      Auf der Anzeige hinter ihm sprang die Abfahrt auf 14:12.
      Er fand, sie sehe aus wie jemand, der diesen Satz nicht zum ersten Mal hörte.
      Ines schob ihren Ausweis neben die Karte.
      Er tippte etwas ein, ohne sie anzusehen.
    lines: [4]
    explanation: |
      Zeile 4 springt in den Kopf des Mannes am Schalter: Was er „fand“, kann Ines nicht wahrnehmen. Alle anderen Zeilen zeigen, was Ines sieht und hört, auch Zeile 6, denn dass er nicht aufsieht, kann sie beobachten. Im Durchgang Perspektive markierst du solche Sätze und entscheidest dann selbst, ob du sie streichst, in etwas Sichtbares übersetzt oder die Perspektive bewusst wechselst.
    hints:
      - Frag bei jeder Zeile, ob Ines das sehen oder hören kann.
      - Eine Zeile beschreibt keine Handlung, sondern ein Urteil.
    resources:
      - title: Living Handbook of Narratology · Focalization
        url: https://www-archiv.fdm.uni-hamburg.de/lhn/node/18.html

  - id: kleist-spaeter-einstieg
    type: explain
    title: Im Augenblick der Erschütterung
    prompt: |
      Der erste Absatz von Kleists „Das Erdbeben in Chili“ (Erstdruck 1807 als „Jeronimo und Josephe“, Buchfassung 1810), in modernisierter Schreibung nach Projekt Gutenberg-DE. Kleist hätte ein Jahr früher anfangen können, als Jeronimo noch Lehrer im Haus des Don Henrico war. Erkläre in vier bis sechs Sätzen, warum er im Augenblick des Erdbebens einsetzt, wie der Leser trotzdem die Orientierung behält und wohin die Vorgeschichte rückt. Schließ mit dem, was du daraus für den Durchgang „Anfang und Ende“ prüfst.
    lang: prose
    code: |
      In St. Jago, der Hauptstadt des Königreichs Chili, stand gerade in dem Augenblicke der großen Erderschütterung vom Jahre 1647, bei welcher viele tausend Menschen ihren Untergang fanden, ein junger, auf ein Verbrechen angeklagter Spanier, namens Jeronimo Rugera, an einem Pfeiler des Gefängnisses, in welches man ihn eingesperrt hatte, und wollte sich erhenken.
      Don Henrico Asteron, einer der reichsten Edelleute der Stadt, hatte ihn ungefähr ein Jahr zuvor aus seinem Hause, wo er als Lehrer angestellt war, entfernt, weil er sich mit Donna Josephe, seiner einzigen Tochter, in einem zärtlichen Einverständnis befunden hatte.
      Eine geheime Bestellung, die dem alten Don, nachdem er die Tochter nachdrücklich gewarnt hatte, durch die hämische Aufmerksamkeit seines stolzen Sohnes verraten worden war, entrüstete ihn dergestalt, daß er sie in dem Karmeliterkloster unsrer lieben Frauen vom Berge daselbst unterbrachte.
    points:
      - Kleist setzt ein, als zwei Katastrophen zusammenfallen, das Erdbeben und Jeronimos Versuch, sich zu erhängen. Der Konflikt läuft schon, bevor der Leser die Figur kennt.
      - Derselbe Satz gibt die Orientierung, die ein später Einstieg braucht, nämlich Ort, Jahr, Ereignis, Name und Lage der Figur.
      - Die Vorgeschichte folgt erst danach als knapper Rückblick („ungefähr ein Jahr zuvor“), zu einem Zeitpunkt, an dem der Leser schon wissen will, wie es dazu kam.
      - Der Einstieg öffnet zwei Fragen, was Jeronimo getan hat und ob er überlebt; die Rückblende beginnt, die erste zu beantworten, die zweite bleibt offen.
      - Für den Durchgang prüfst du, ob deine Szene im Moment des Widerstands beginnen kann und welche Vorgeschichte später in einem Satz kommen kann oder ganz wegfällt.
    explanation: |
      Hätte Kleist mit dem Hauslehrer und der Tochter begonnen, läse man ein Jahr lang eine Liebesgeschichte und wartete darauf, dass etwas geschieht. So aber beginnt der erste Satz in dem Augenblick, in dem die Stadt bebt und Jeronimo am Pfeiler seines Gefängnisses steht und sich erhenken will. Die Orientierung geht dabei nicht verloren, denn derselbe Satz nennt St. Jago, das Jahr 1647, das Erdbeben, den Namen und die Anklage. Erst der zweite Satz springt „ungefähr ein Jahr zuvor“ zurück und trägt die Vorgeschichte knapp nach. Sie ist jetzt kein Anlauf mehr, sondern die Antwort auf eine Frage, die der Leser schon stellt. Für die eigene Szene heißt das: Was du als Anlauf geschrieben hast, kann oft später in einem Satz kommen oder entfallen. Das Ende zeigt dieser Absatz nicht; dafür bleibt im Durchgang die Frage, ob nach der Wendung noch Sätze stehen, die nur erklären.
    hints:
      - Was müsste vor dem ersten Satz erzählt werden, wenn die Erzählung ein Jahr früher begänne?
      - Zähl, wie viele Angaben zur Orientierung im ersten Satz stecken.
    resources:
      - title: Heinrich von Kleist · Das Erdbeben in Chili (Projekt Gutenberg-DE)
        url: https://projekt-gutenberg.org/authors/heinrich-von-kleist/books/heinrich-v-kleist-das-erdbeben-in-chili/chapter/1

  - id: szenenkarte
    type: practice
    title: Die Karte vor der Szene
    prompt: |
      Wähle eine Szene aus deinem eigenen Projekt, die du noch nicht ausgeschrieben hast. Füll die Szenenkarte in Stichpunkten aus. Schreib noch keinen Szenentext.

      Hast du zu dieser Szene schon Notizen aus [Perspektive](/narrative/perspektive) (Übung „Wer weiß was in deiner Szene?“) oder aus [Konflikt und Szenenaufbau](/narrative/szenenaufbau) (Übung „Später rein, früher raus“), kannst du sie hier weiterverwenden.

      Speichere die Karte auch in deinem eigenen Ordner (etwa `szene-karte-v1.md`). Du brauchst sie in jedem Durchgang.
    lang: prose
    starter: |
      Szene (Arbeitstitel):
      Fokalfigur (durch wessen Augen):
      Ziel der Figur in dieser Szene:
      Widerstand (wer oder was steht im Weg):
      Wert am Anfang:
      Wert am Ende:
      Wendung (was den Wert dreht):
      Spielbar oder Zwischensequenz:
    checklist:
      - Das Ziel ist so formuliert, dass man am Ende der Szene sehen kann, ob die Figur es erreicht hat.
      - Der Widerstand nennt eine Person, eine Sache oder einen Umstand.
      - Wert am Anfang und Wert am Ende sind verschieden.
      - Die Fokalfigur ist festgelegt.
      - Die Karte enthält nur Stichpunkte, keinen ausformulierten Szenentext.
    explanation: |
      Die Karte macht deine Absicht prüfbar, bevor der Entwurf sie überdeckt. Ein beobachtbares Ziel und zwei verschiedene Werte sind die Grundlage für die ersten beiden Durchgänge, die Fokalfigur für den dritten. Das Feld „Spielbar oder Zwischensequenz“ hält fest, ob der Spieler in der Wendung handelt; das beeinflusst, wie viel davon der Text überhaupt tragen muss.
    resources:
      - title: Robert McKee · Do your scenes turn?
        url: https://mckeestory.com/do-your-scenes-turn/

  - id: entwurf-in-einem-zug
    type: practice
    title: Bis zum Ende, ohne zurückzuspringen
    prompt: |
      Schreib die Szene von deiner Karte in einer Sitzung, 300 bis 600 Wörter. Schreib in deinem eigenen Editor und speichere die Datei als Fassung 1 (etwa `szene-v1.md` oder als ersten Commit).

      Korrigier nichts während des Schreibens. Fehlt dir ein Wort oder eine Information, setz `[XX]` und schreib weiter. Füg den Entwurf danach hier ein. Den nächsten Schritt machst du frühestens morgen.
    lang: prose
    starter: |
      Fassung 1, Datum:

    checklist:
      - Der Entwurf hat 300 bis 600 Wörter.
      - Du hast ihn in einer Sitzung bis zum letzten Satz geschrieben.
      - Fehlende Wörter und Informationen sind markiert, statt dass du nach ihnen gesucht hast.
      - Fassung 1 liegt als eigene Datei oder als Commit vor, mit Datum.
      - Hast du die Szenenkarte beim Schreiben geändert, steht die Änderung neben der ersten Karte.
    explanation: |
      Ein vollständiger Entwurf ist das Material für alle Durchgänge. Wer schon beim Schreiben prüft, kommt oft nicht bis zur Wendung, und ohne Wendung haben die ersten beiden Durchgänge nichts, woran sie ansetzen. Die Markierungen halten fest, wo du später recherchieren oder ein Wort suchen musst, ohne den Fluss zu unterbrechen. Die Nacht Abstand gehört zum Schritt: Am nächsten Tag liest du eher, was dasteht, und weniger, was du gemeint hast.
    resources:
      - title: Randy Ingermanson · Writing the Perfect Scene
        url: https://www.advancedfictionwriting.com/articles/writing-the-perfect-scene/

  - id: durchgang-ziel-konflikt-wendung
    type: practice
    title: Zwei Fragen, zwei Lesungen
    prompt: |
      Mindestens eine Nacht nach dem Entwurf. Lies Fassung 1 zweimal, jedes Mal mit nur einer Frage, und notiere, was dir auffällt. Ändere erst danach.

      1. **Ziel und Konflikt.** Wo erkennt der Leser, was die Figur will? Wo trifft das Ziel auf Widerstand? Welche Absätze haben keinen Widerstand?
      2. **Wendung.** Wo steht der Wert am Anfang, wo am Ende, und in welchem Satz dreht er sich?

      Schreib dann Fassung 2 und speichere sie getrennt von Fassung 1. Füg hier deine Notizen, die Liste der Änderungen und Fassung 2 ein. Zu jeder Änderung gehört ein Satz, warum.
    lang: prose
    starter: |
      Durchgang Ziel und Konflikt (Notizen):

      Durchgang Wendung (Notizen):

      Änderungen (was, warum):

      Fassung 2:

    checklist:
      - Zwischen Entwurf und diesem Durchgang lag mindestens eine Nacht.
      - Du hast notiert, an welcher Stelle das Ziel für den Leser erkennbar wird, oder dass es fehlt.
      - Du hast den Satz notiert, in dem sich der Wert dreht, oder dass es ihn nicht gibt.
      - Jede Änderung in Fassung 2 steht mit einem Grund in der Liste.
      - Fassung 1 ist unverändert gespeichert, Fassung 2 als eigene Datei oder eigener Commit.
    explanation: |
      Ziel, Konflikt und Wendung sind das Gerüst der Szene; deshalb kommen sie zuerst. Zwei getrennte Lesungen verhindern, dass die leichtere Frage die schwerere verdrängt. Die Notiz „gibt es nicht“ ist ein gültiges Ergebnis: Sie sagt dir, dass Fassung 2 kein Feinschliff wird, sondern ein Umbau. Die Gründe brauchst du in der Reflexion, und sie zwingen dich, jede Änderung an deiner Karte zu messen statt am Gefühl.
    resources:
      - title: Robert McKee · Do your scenes turn?
        url: https://mckeestory.com/do-your-scenes-turn/

  - id: durchgang-perspektive
    type: practice
    title: Durch wessen Augen?
    prompt: |
      Nimm Fassung 2 und lies sie nur auf die Perspektive. Markiere

      - jeden Satz, in dem die Erzählung etwas weiß oder wahrnimmt, was die Fokalfigur nicht wissen oder wahrnehmen kann, und
      - jeden Satz, der ein Gefühl der Fokalfigur benennt.

      Entscheide bei jedem markierten Satz: streichen, umschreiben oder bewusst behalten. Schreib Fassung 3 und füg die Liste und Fassung 3 hier ein.
    lang: prose
    starter: |
      Fokalfigur laut Karte:

      Sätze außerhalb ihrer Wahrnehmung (Satz – Entscheidung – Grund):

      Benannte Gefühle (Satz – Entscheidung – Grund):

      Fassung 3:

    checklist:
      - Jeder markierte Satz steht mit einer Entscheidung (streichen, umschreiben, behalten) in der Liste.
      - Jede Entscheidung „behalten“ hat einen Grund.
      - In Fassung 3 enthält die Erzählung nur, was die Fokalfigur wissen oder wahrnehmen kann, außer an Stellen, die du begründet behalten hast.
      - Fassung 3 ist gespeichert, Fassung 2 unverändert.
    explanation: |
      Perspektivfehler sind Satzfehler. Sie fallen erst auf, wenn das Gerüst steht, und gehen beim Lesen auf Ziel und Wendung unter. Ein benanntes Gefühl ist nicht immer falsch: Manchmal ist der kürzeste Weg der richtige, etwa wenn die Szene das Gefühl nicht anders zeigen kann. Deshalb steht „bewusst behalten“ als Möglichkeit in der Liste. Entscheidend ist, dass es eine Entscheidung ist und kein Versehen.
    resources:
      - title: Living Handbook of Narratology · Focalization
        url: https://www-archiv.fdm.uni-hamburg.de/lhn/node/18.html

  - id: anfang-ende-laut-lesen
    type: practice
    title: Später rein, früher raus, dann laut
    prompt: |
      Nimm Fassung 3.

      1. **Anfang.** Streich probeweise den ersten Satz, dann den ersten Absatz. Notiere, was der Leser dadurch verliert und ob er es an anderer Stelle bekommt.
      2. **Ende.** Markiere den Satz, in dem sich der Wert dreht. Prüfe jeden Satz danach: Zeigt er etwas Neues, oder erklärt er nur?
      3. **Laut lesen.** Lies die ganze Szene laut. Mach an jeder Stelle, an der du stolperst, ein Zeichen, und korrigiere erst danach.

      Schreib Fassung 4 und füg deine Notizen und Fassung 4 hier ein.
    lang: prose
    starter: |
      Wörter in Fassung 3:

      Anfang (was gestrichen, was der Leser dadurch verliert):

      Ende (Sätze nach der Wendung, Entscheidung):

      Stolperstellen beim lauten Lesen:

      Wörter in Fassung 4:

      Fassung 4:

    checklist:
      - Du hast mindestens einen späteren Einstieg ausprobiert und notiert, was dabei wegfällt.
      - Jeder Satz nach der Wendung ist geprüft; Sätze, die nur erklären, sind gestrichen oder mit Grund behalten.
      - Du hast die ganze Szene laut gelesen und die Stolperstellen notiert.
      - Die Wortzahl vor und nach diesem Durchgang ist notiert.
      - Fassung 4 ist gespeichert, Fassung 3 unverändert.
    explanation: |
      Anfang und Ende kommen zuletzt, weil frühere Durchgänge sie oft verschieben. Das probeweise Streichen ist billig: Du kannst jederzeit zu Fassung 3 zurück. Die Frage „Was verliert der Leser?“ verhindert, dass du so spät einsteigst, dass die Orientierung fehlt. Laut lesen fängt, was die stillen Durchgänge nicht sehen: Rhythmus, Wiederholungen, Sätze, die sich nicht sprechen lassen. Die Wortzahlen machen sichtbar, wie viel nur Anlauf war.
    resources:
      - title: Heinrich von Kleist · Das Erdbeben in Chili (Projekt Gutenberg-DE)
        url: https://projekt-gutenberg.org/authors/heinrich-von-kleist/books/heinrich-v-kleist-das-erdbeben-in-chili/chapter/1

  - id: reflexion
    type: practice
    title: Drei Änderungen und warum
    prompt: |
      Leg Fassung 1 und deine letzte Fassung nebeneinander. Mit Git zeigt `git diff --word-diff` die Unterschiede Wort für Wort.

      Schreib eine Reflexion mit 300 bis 500 Wörtern. Wähle drei Änderungen und nenne zu jeder die Stelle, wie sie vorher und nachher aussah und warum du sie gemacht hast. Nenne außerdem eine Stelle, die du bewusst nicht geändert hast, und was du bei der nächsten Szenenkarte anders festlegst.
    lang: prose
    starter: |
      Änderung 1 – Stelle, vorher, nachher, Grund:

      Änderung 2 – Stelle, vorher, nachher, Grund:

      Änderung 3 – Stelle, vorher, nachher, Grund:

      Bewusst nicht geändert:

      Für die nächste Szenenkarte:

    checklist:
      - Die Reflexion hat 300 bis 500 Wörter.
      - Jede der drei Änderungen nennt Stelle, vorher, nachher und Grund.
      - Jeder Grund bezieht sich auf die Szenenkarte oder auf eine Frage aus einem Durchgang.
      - Du nennst eine Stelle, die du bewusst nicht geändert hast, mit Grund.
      - Du nennst mindestens einen Punkt, den du bei der nächsten Szenenkarte anders festlegst.
    explanation: |
      Die Reflexion macht aus einer einzelnen Szene ein Werkzeug für die nächste. Gründe, die sich auf deine Karte oder einen Durchgang beziehen, zeigen dir, welche Fragen bei dir am meisten bewegen. Die bewusst unveränderte Stelle schützt vor dem Reflex, alles zu glätten. Der Punkt für die nächste Karte fließt in deine nächste Szene ein; in [Überarbeiten mit eigenen Kriterien](/narrative/ueberarbeiten) baust du daraus eigene Kriterien.
    resources:
      - title: git-diff · --word-diff
        url: https://git-scm.com/docs/git-diff#Documentation/git-diff.txt---word-diffmode
