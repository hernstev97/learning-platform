id: werkstatt-dialog
title: "Werkstatt: Dialog und Schauplatz"
level: 2
minutes: 210
summary: Du schreibst für dein eigenes Projekt eine Dialogszene mit Subtext, prüfst sie in getrennten Durchgängen auf Absicht, Exposition und Textbox-Länge und legst für ihren Ort eine Liste von Spuren an, aus denen der Spieler schließt, was dort geschehen ist.
place: pc
goals:
  - Du legst vor dem Schreiben fest, was eine Dialogszene ändern soll und was jede beteiligte Figur in ihr will.
  - Du schreibst einen Dialogentwurf von 300 bis 600 Wörtern in einem Zug und überarbeitest ihn danach in getrennten Durchgängen.
  - Du markierst jede Replik mit der Absicht, die sie verfolgt, und streichst oder änderst Repliken ohne Absicht.
  - Du findest Exposition im eigenen Dialog und verteilst sie auf Konflikt, Figuren, den Ort oder spätere Szenen.
  - Du bestimmst die Zeichengrenze deiner eigenen Textbox und misst jede Replik daran.
  - Du legst für einen Ort fünf bis acht Spuren an, jede mit dem, was sie erzählt, und dem Schluss, den der Spieler daraus ziehen soll.
resources:
  - title: Georg Büchner, „Wozzeck“ (= Woyzeck), Ausgabe Franzos 1879 (Wikisource)
    url: https://de.wikisource.org/wiki/Wozzeck
  - title: Theodor Fontane, „Effi Briest“, Kapitel 2 (Projekt Gutenberg-DE)
    url: https://projekt-gutenberg.org/authors/theodor-fontane/books/effi-briest/chapter/2
  - title: "Robert McKee, „Dialogue: The Art of Verbal Action for Page, Stage, and Screen“ (Hachette, 2016)"
    url: https://www.hachettebookgroup.com/titles/robert-mckee/dialogue/9781455591916/
  - title: Harvey Smith, Matthias Worch, „What Happened Here? Environmental Storytelling“ (GDC Vault, 2010)
    url: https://gdcvault.com/play/1012647/What-Happened-Here-Environmental
  - title: Henry Jenkins, „Game Design as Narrative Architecture“ (2004)
    url: https://web.mit.edu/~21fms/People/henry3/games&narrative.html
lesson: |
  Im Skript liest sich ein Gespräch flüssig. Im Spiel steht dieselbe Replik in drei Textboxen, der Spieler klickt weiter, bevor der wichtige Halbsatz kommt, und die Information für die nächste Entscheidung erzählt eine Figur einer anderen, die sie längst kennt. Am Schreibtisch fällt das nicht auf, weil du weißt, was gemeint ist. Es fällt auf, wenn du Box für Box liest und fragst, was jede Figur gerade will.

  In dieser Werkstatt schreibst du eine Dialogszene für dein eigenes Projekt, prüfst sie in getrennten Durchgängen und legst für ihren Ort eine Liste von Spuren an. Die Werkzeuge kennst du aus [Dialog, Subtext und notwendige Informationen](/narrative/dialog-subtext) und [Erzählen über Handlung, Umgebung und Folgen](/narrative/umgebung-erzaehlt). Plan zwei Sitzungen am PC ein, mit mindestens einer Nacht dazwischen.

  ## Der Ablauf: planen, schreiben, in Durchgängen prüfen

  Die Übungen sind die Arbeitsschritte:

  ```text
  1. Szenenziel und Absicht jeder Figur festlegen
  2. Entwurf in einem Zug (300–600 Wörter)
  3. Abstand: mindestens eine Nacht
  4. Durchgang Absicht: jede Replik markieren, laut lesen
  5. Durchgang Exposition: Informationen finden und verteilen
  6. Schauplatz: fünf bis acht Spuren für den Ort der Szene
  7. Durchgang Textbox, Schlusslesung, Reflexion
  ```

  Die Schritte 6 und 7 darfst du tauschen; die Schauplatzliste braucht nur den Expositionsdurchgang. In einem Durchgang siehst du eine Sorte Problem. Wer auf alles zugleich achtet, bleibt an der Länge hängen, weil sie leicht zu sehen ist. Deshalb gehen die Durchgänge von groß nach klein. Abstand und Fassungen kennst du aus [Werkstatt: eine Szene schreiben und überarbeiten](/narrative/werkstatt-szene). Schreib im eigenen Editor, füg den Text in die Übung ein und sichere jede Fassung als Datei oder mit [Git](/git).

  > [!NOTE] KI in dieser Werkstatt
  > Du schreibst und überarbeitest selbst. Rechtschreibung und Grammatik darfst du am Ende prüfen lassen, wenn du willst. Umformulierungen, Stilvorschläge und Ideen für die Szene holst du dir nicht; die Begründung steht in [Werkstatt: eine Szene schreiben und überarbeiten](/narrative/werkstatt-szene).

  ## Absicht: was jede Replik erreichen will

  Robert McKee nennt Dialog im Untertitel seines Buchs „verbal action“, Handlung mit Worten ([Dialogue, 2016](https://www.hachettebookgroup.com/titles/robert-mckee/dialogue/9781455591916/)). Jede Replik soll also beim Gegenüber etwas bewirken. Du prüfst das mit einem Verb neben jeder Replik, etwa bitten, ausweichen, prüfen, beschämen, ablenken. Fällt dir nur ein Thema ein („redet über das Wetter“), fehlt die Absicht.

  In Büchners „Woyzeck“ rasiert Wozzeck den Hauptmann. Zitiert nach der Ausgabe von Karl Emil Franzos (1879), die den Namen ‚Wozzeck‘ schreibt:

  > **Hauptmann.** […] Wozzeck, ich kann kein Mühlrad mehr sehen, oder ich werd’ melancholisch!\
  > **Wozzeck.** Ja wohl, Herr Hauptmann!\
  > **Hauptmann.** Wozzeck, Er sieht immer so verhetzt aus! […] Red’ Er doch was, Wozzeck. Was ist heut für Wetter?\
  > **Wozzeck.** Schlimm, Herr Hauptmann, schlimm. Wind!

  Georg Büchner, „Woyzeck“, Szene „Zimmer“, [Wikisource](https://de.wikisource.org/wiki/Wozzeck)

  Das Thema ist das Wetter. Der Hauptmann aber verlangt Unterhaltung von einem Untergebenen, der nicht ablehnen kann, und Wozzeck weicht aus, so knapp, wie der Rang es erlaubt. Sein „Ja wohl“ beendet jede Runde, ohne zu widersprechen.

  Leg die Absichten vor dem Entwurf fest, für jede Figur getrennt, auch für Nebenfiguren. Im Absichtsdurchgang liest du die Szene laut, Figur für Figur, und hörst, ob alle gleich klingen und wo du stockst.

  > [!MERKE]
  > Neben jede Replik gehört ein Verb, kein Thema. Findest du keins, streich die Replik oder gib der Figur einen Grund, sie zu sagen.

  ## Exposition: Informationen finden und verteilen

  Exposition ist, was der Spieler wissen muss, um die Szene zu verstehen. Du findest sie, indem du jeden Satz markierst, der eine Tatsache mitteilt: wer wer ist, was früher geschah, was auf dem Spiel steht. Dann fragst du je Markierung, wer in der Szene das noch nicht weiß oder wer einen Grund hat, es auszusprechen.

  Bekanntes auszusprechen ist für sich kein Fehler. Büchners Hauptmann erinnert Wozzeck an etwas, das dieser längst weiß:

  > **Hauptmann.** […] Wozzeck, Er ist ein guter Mensch, aber (mit Würde), Wozzeck, Er hat keine Moral! […] Er hat ein Kind ohne den Segen der Kirche, wie unser hochwürdiger Herr Garnisonsprediger sagt, „ohne den Segen der Kirche“ - das Wort ist nicht von mir.

  Georg Büchner, „Woyzeck“, Szene „Zimmer“, [Wikisource](https://de.wikisource.org/wiki/Wozzeck)

  Der Leser erfährt, dass Wozzeck ein Kind hat und nicht verheiratet ist. Der Satz funktioniert, weil der Hauptmann damit belehrt und beschämt; das harte Wort schiebt er dem Garnisonsprediger zu. Die Information kommt als Angriff, und Wozzeck antwortet zum ersten Mal mit mehr als ein paar Wörtern. Bei „As you know, Bob“ erzählen Figuren einander Bekanntes, ohne damit etwas zu wollen.

  Für jede Information ohne solchen Grund hast du vier Wege:

  - **In den Konflikt legen.** Eine Figur benutzt sie, um beim Gegenüber etwas zu erreichen.
  - **Einer Figur geben, die sie nicht kennt.** Dann darf jemand fragen.
  - **An den Ort geben.** Sie wird zu Spuren in deiner Schauplatzliste.
  - **Verschieben oder streichen.** Was der Spieler erst später braucht, kommt später. Was er nie braucht, fällt weg.

  ## Die Textbox als Maß für Repliken

  Wie viel in eine Textbox passt, hängt von Schrift, Schriftgröße, Auflösung und Boxgröße deines Spiels ab. Eine Zahl für alle Spiele gibt es nicht, und dieser Kurs gibt dir keine vor. Du misst deine eigene:

  1. Bau eine Box in der Größe deines Spiels, in deiner Engine oder als Bild in der Zielauflösung.
  2. Füll sie mit gewöhnlichem deutschem Text in deiner Schrift und zähl die Zeichen samt Leerzeichen.
  3. Wiederhol das mit zwei, drei anderen Sätzen und nimm die kleinste Zahl. Sind die Buchstaben deiner Schrift unterschiedlich breit, schwankt sie.
  4. Notier die Zahl mit Schrift, Auflösung und Boxgröße. Ändert sich eins davon, misst du neu.

  Ist eine Replik länger, prüf zuerst, ob sie zwei Absichten enthält. Dann werden zwei Repliken daraus, oft mit einer Reaktion des Gegenübers dazwischen. Sonst streichst du, was sie wiederholt. Läuft eine Replik über mehrere Boxen, teil sie am Satzende, denn jedes Boxende ist für den Spieler eine Pause.

  Die Grenze ist ein Maß und kein Verbot. Wozzeck antwortet lange nur mit „Ja wohl, Herr Hauptmann“ oder ein paar Wörtern; dass er danach mehrere Sätze am Stück spricht, fällt deshalb auf. Eine seltene, bewusst gesetzte lange Replik wirkt in deinem Spiel genauso.

  ## Schauplatz: Spuren, aus denen der Spieler schließt

  Ein Ort kann tragen, was im Dialog nach Exposition klänge. Harvey Smith und Matthias Worch haben auf der GDC 2010 unter der Frage „What happened here?“ beschrieben, wie Spieler vergangene Ereignisse selbst aus der Umgebung erschließen, aus Requisiten, Texturen, Licht, Komposition und Spielsystemen, die reagieren ([GDC Vault](https://gdcvault.com/play/1012647/What-Happened-Here-Environmental)). In Gone Home rekonstruiert man über Gegenstände, Notizen und Tagebucheinträge, was in einem leeren Haus geschehen ist ([Wikipedia](https://en.wikipedia.org/wiki/Gone_Home)).

  Jede Spur in deiner Liste beantwortet zwei Fragen. „Was erzählt das?“ beschreibt, was der Gegenstand zeigt. „Was muss der Spieler daraus schließen?“ nennt den Schluss, den deine Szene braucht. Eine Spur ohne Schluss ist Ausstattung. Die darf es geben, aber du solltest wissen, welche Spuren tragen und welche schmücken.

  Henry Jenkins schreibt, wichtige Information müsse mehrfach über Räume und Gegenstände verteilt sein, weil man nicht voraussetzen kann, dass der Spieler ein bestimmtes Element findet oder seine Bedeutung erkennt ([Game Design as Narrative Architecture](https://web.mit.edu/~21fms/People/henry3/games&narrative.html)). Stütz deshalb jeden nötigen Schluss auf mehr als eine Spur. Prüf außerdem jede Spur in Kameraperspektive und Auflösung deines Spiels. Was der Spieler nicht erkennt, erzählt ihm nichts.

  > [!WARNING] Notizen, die alles erklären
  > Ein Brief oder Tagebuch am Ort ist erlaubt. Spricht er aus, was der Spieler aus den anderen Spuren schließen soll, ist er Exposition in anderer Form.

  ## Häufige Fehler

  - **Absichten erst beim Überarbeiten suchen.** Im Absichtsdurchgang findest du für viele Repliken kein Verb. Leg die Absichten vor dem Entwurf fest.
  - **Alles in einem Durchgang.** Du kürzt Repliken, die du später streichst. Halte die Reihenfolge ein.
  - **Alle klingen gleich.** Deckst du beim Lesen die Namen ab, weißt du nicht mehr, wer spricht. Gib jeder Figur eigene Wörter und eigene Satzlängen.
  - **Exposition nur verschoben.** Der Brief am Ort enthält dieselben Sätze wie vorher der Dialog. Mach Spuren daraus.
  - **Zeichengrenze geschätzt.** Die Zahl stammt aus einem anderen Spiel oder aus dem Kopf. Miss sie selbst.

  > [!PRAXIS] Auch die Nebenfigur will etwas
  > Meg Jayanth war Lead Writer von 80 Days (inkle, 2014). Auf der GDC 2016 sprach sie darüber, Nebenfiguren eigenen Antrieb und eigene Motive zu geben, auch wenn sie damit die Möglichkeiten der Hauptfigur einschränken ([GDC Vault](https://gdcvault.com/play/1023062/Forget-Protagonists-Writing-NPCs-with)); mehr dazu in [Figuren: Ziel, Motiv und Widerstand](/narrative/figuren-motivation). Im Absichtsdurchgang prüfst du deshalb die Repliken der Nebenfigur so streng wie die der Spielerfigur. Antwortet sie nur, damit die Spielerfigur weiterkommt, findest du für ihre Repliken kein Verb.

  ## Zusammenfassung

  - Leg Szenenziel und Absichten fest, bevor du schreibst, und überarbeite erst nach mindestens einer Nacht.
  - Prüf in getrennten Durchgängen von groß nach klein: Absicht, Exposition, Textbox; der Schauplatz folgt auf die Exposition.
  - Neben jede Replik gehört ein Verb. Repliken ohne Absicht streichst du oder gibst ihnen einen Grund.
  - Bekanntes darf gesagt werden, wenn der Sprecher damit etwas erreichen will.
  - Deine Zeichengrenze misst du selbst, mit deiner Schrift in deiner Auflösung.
  - Jede Spur am Ort hat einen Schluss, den der Spieler ziehen soll; wichtige Schlüsse stützt du auf mehrere Spuren.
exercises:
  - id: ablauf-ordnen
    type: order
    title: Was kommt zuerst?
    prompt: |
      Bring die Arbeitsschritte dieser Werkstatt in die Reihenfolge, in der du sie erledigst.
    lang: prose
    lines: |
      Szenenziel und Absicht jeder Figur festlegen
      Entwurf in einem Zug schreiben
      Mindestens eine Nacht Abstand
      Durchgang Absicht: jede Replik mit einem Verb markieren
      Durchgang Exposition: Informationen finden und verteilen
      Schauplatzliste für den Ort der Szene anlegen
      Durchgang Textbox: jede Replik an der Zeichengrenze messen
    alternatives:
      - [1, 2, 3, 4, 5, 7, 6]
    hints:
      - Die Absichten brauchst du schon beim Schreiben.
      - Was du kürzt, sollte vorher feststehen. Und was aus dem Dialog an den Ort wandert, entscheidet ein bestimmter Durchgang.
    explanation: |
      Die Absichten stehen am Anfang, weil der Entwurf sie tragen soll; wer sie erst beim Überarbeiten sucht, findet für viele Repliken keine. Nach dem Abstand gehen die Durchgänge von groß nach klein. Erst klärst du, welche Repliken bleiben, dann, welche Informationen sie tragen. Was der Expositionsdurchgang aus dem Dialog an den Ort schiebt, landet in der Schauplatzliste; sie braucht diesen Durchgang, aber nicht den Textbox-Durchgang, deshalb gelten am Ende beide Reihenfolgen. Die Länge misst du nach Absicht und Exposition, weil diese beiden Durchgänge Repliken streichen oder ändern.

  - id: bekanntes-aussprechen
    type: choice
    title: Wann darf Bekanntes gesagt werden?
    prompt: |
      Zwei Figuren wissen beide, was eine von ihnen gleich ausspricht. Wann ist das kein „As you know, Bob“?
    options:
      - text: Wenn der Sprecher damit beim Gegenüber etwas erreichen will, etwa beschämen oder unter Druck setzen.
        correct: true
        why: Dann ist die Replik eine Handlung. So benutzt Büchners Hauptmann das Kind „ohne den Segen der Kirche“ gegen Wozzeck.
      - text: Wenn der Spieler die Information noch nicht kennt.
        correct: false
        why: Das ist der Grund, warum der Autor den Satz schreibt. Er erklärt nicht, warum die Figur ihn sagt.
      - text: Wenn die Information in einen kurzen Satz passt.
        correct: false
        why: Die Länge ändert nichts. Auch ein kurzer Satz ohne Absicht bleibt Exposition, die nur für den Leser da ist.
      - text: Wenn die Figur den Satz mit „Wie du weißt“ einleitet.
        correct: false
        why: Diese Einleitung ist ein typisches Kennzeichen des Fehlers. Sie gibt zu, dass das Gegenüber die Information nicht braucht.
    hints:
      - Frag nicht, wer die Information braucht, sondern wer etwas mit ihr will.
    explanation: |
      „As you know, Bob“ beschreibt Figuren, die einander erzählen, was beide wissen, nur damit der Leser es erfährt. Das Problem ist die fehlende Absicht, nicht das gemeinsame Wissen. Menschen sprechen Bekanntes aus, wenn sie damit etwas erreichen wollen: erinnern, vorwerfen, Druck machen. Büchners Hauptmann sagt Wozzeck nichts Neues, als er das Kind erwähnt. Er beschämt ihn damit, und der Leser erfährt die Tatsache nebenbei.
    resources:
      - title: Georg Büchner, „Wozzeck“, Szene „Zimmer“ (Wikisource)
        url: https://de.wikisource.org/wiki/Wozzeck

  - id: zu-lang-fuer-die-box
    type: choice
    title: Eine Replik sprengt die Box
    prompt: |
      Eine Replik in deinem Entwurf ist deutlich länger als die Zeichengrenze, die du für deine Textbox gemessen hast. Was prüfst du zuerst?
    options:
      - text: Ob die Replik zwei Absichten enthält
        correct: true
        why: Dann werden zwei Repliken daraus, oft mit einer Reaktion des Gegenübers dazwischen. Das löst die Länge und macht aus dem Block einen Wechsel.
      - text: Ob die Replik mit einer kleineren Schrift in eine Box passt
        correct: false
        why: Deine Grenze kommt aus Schrift und Auflösung, die dein Spiel überall verwendet. Eine kleinere Schrift für eine einzelne Replik fällt auf und ist schwerer zu lesen.
      - text: Welche Wörter du streichen kannst, bis die Zahl stimmt
        correct: false
        why: Kürzen kommt danach. Wer nur auf die Zahl schaut, streicht womöglich den Teil, der die Absicht trägt.
      - text: Ob die Engine den Text automatisch auf mehrere Boxen verteilt
        correct: false
        why: Eine automatische Teilung trennt dort, wo die Box voll ist, und nicht dort, wo ein Gedanke endet. Wo der Spieler eine Pause macht, entscheidest dann nicht du.
    explanation: |
      Die Länge ist oft ein Symptom. Eine Replik, die zwei Dinge will, wird lang, weil zwei Repliken in ihr stecken. Teilst du sie und gibst dem Gegenüber dazwischen eine Reaktion, wird der Dialog zum Wechsel, und jede Box trägt eine Absicht. Erst wenn die Replik nur eine Absicht hat, streichst du Wörter. Schrift und automatische Teilung lösen das Problem an der falschen Stelle.

  - id: begriffe-der-werkstatt
    type: gap
    title: Vier Wörter für die Werkstatt
    prompt: |
      Ergänze die Begriffe, mit denen du in diesem Modul arbeitest.
    lang: prose
    code: |
      Was eine Figur mit einer Replik beim Gegenüber erreichen will, ist ihre ⟦Absicht⟧. Was sie meint, ohne es auszusprechen, ist der ⟦Subtext⟧. Alles, was der Spieler wissen muss, um eine Szene zu verstehen, heißt ⟦Exposition⟧. Henry Jenkins nennt Geschichten, die in der Ausstattung eines Raums liegen und auf ihre Entdeckung warten, ⟦embedded⟧ narratives.
    gaps:
      - label: Was die Replik will
        hint: Im Absichtsdurchgang schreibst du dafür ein Verb neben die Replik.
        accept: [Intention]
      - label: Das Ungesagte
        hint: Das, was unter dem Text liegt.
      - label: Notwendige Information
        hint: Ein Begriff aus dem Drama für den Teil, der die Ausgangslage vermittelt.
      - label: Jenkins' Begriff
        hint: Jenkins' englischer Begriff; die deutsche Übersetzung zählt auch.
        accept: [eingebettete, eingebettet]
    explanation: |
      Absicht und Subtext gehören zusammen. Die Absicht ist, was die Figur erreichen will, der Subtext, was sie dabei nicht ausspricht. Exposition ist Information, die irgendwo stehen muss; die Werkstatt fragt, wo sie stehen soll. Jenkins unterscheidet vier Arten räumlichen Erzählens; die eingebettete ist die, mit der deine Schauplatzliste arbeitet.
    resources:
      - title: Henry Jenkins, „Game Design as Narrative Architecture“ (2004)
        url: https://web.mit.edu/~21fms/People/henry3/games&narrative.html

  - id: markierung-ohne-absicht
    type: bug
    title: Eine Markierung nennt nur das Thema
    prompt: |
      Jemand hat neben einzelne Repliken aus Büchners Szene beim Hauptmann geschrieben, was die Figur damit tut. Eine Markierung nennt nur das Thema der Replik und nicht, was die Figur beim Gegenüber erreichen will. Finde sie.
    lang: prose
    code: |
      Hauptmann: „Langsam, Wozzeck, langsam“ – bremst ihn
      Wozzeck: „Ja wohl, Herr Hauptmann!“ – weicht aus
      Hauptmann: „Red’ Er doch was, Wozzeck.“ – verlangt Unterhaltung
      Hauptmann: „Er hat ein Kind ohne den Segen der Kirche“ – beschämt ihn
      Wozzeck: „Wir arme Leut!“ – redet über Geld
      Hauptmann: „Geh’ Er jetzt“ – schickt ihn weg
    lines: [5]
    hints:
      - Frag bei jeder Zeile, was beim Gegenüber passieren soll.
      - Eine Zeile beschreibt, worüber gesprochen wird.
    explanation: |
      „Redet über Geld“ nennt das Thema. Wozzecks Rede über „arme Leut“ antwortet auf den Vorwurf, er habe keine Moral. Er verteidigt sich und hält dem Hauptmann entgegen, dass Moral eine Frage des Geldes ist. Ein Verb wie „verteidigt sich“ oder „widerspricht“ würde die Absicht markieren. Die anderen Zeilen nennen jeweils, was die Replik mit dem Gegenüber macht.
    resources:
      - title: Georg Büchner, „Wozzeck“, Szene „Zimmer“ (Wikisource)
        url: https://de.wikisource.org/wiki/Wozzeck

  - id: fontane-wer-traegt-was
    type: explain
    title: Wer trägt welche Information?
    prompt: |
      Effi hat mit ihren Freundinnen im Garten gespielt, die Mutter hat sie hereingerufen. Im ersten Kapitel hat Effi den Freundinnen erzählt, dass Innstetten früher um ihre Mutter geworben hat und so alt ist wie sie.

      Geh den Ausschnitt durch wie in deinem Expositionsdurchgang. Welche Informationen bekommt der Leser, wer oder was trägt sie, und mit welcher Absicht? Nenne außerdem eine Information, die hier als „As you know, Bob“ hätte enden können, und sag, wo Fontane sie stattdessen untergebracht hat.

      Der Text folgt Projekt Gutenberg-DE (modernisierte Schreibung, Zeichen wie auf der Seite).
    lang: prose
    code: |
      »Mama, du darfst mich nicht schelten. Es ist wirklich erst halb. Warum kommt er so früh? Kavaliere kommen nicht zu spät, aber noch weniger zu früh.«
      Frau von Briest war in sichtlicher Verlegenheit; Effi aber schmiegte sich liebkosend an sie und sagte: »Verzeih, ich will mich nun eilen; du weißt, ich kann auch rasch sein, und in fünf Minuten ist Aschenputtel in eine Prinzessin verwandelt. So lange kann er warten oder mit dem Papa plaudern.«
      […]
      »... Ich muß dir nämlich sagen, Effi, daß Baron Innstetten eben um deine Hand angehalten hat.«
      »Um meine Hand angehalten? Und im Ernst?«
      »Es ist keine Sache, um einen Scherz daraus zu machen. Du hast ihn vorgestern gesehen, und ich glaube, er hat dir auch gut gefallen. Er ist freilich älter als du, was alles in allem ein Glück ist, dazu ein Mann von Charakter, von Stellung und guten Sitten, und wenn du nicht nein sagst, was ich mir von meiner klugen Effi kaum denken kann, so stehst du mit zwanzig Jahren da, wo andere mit vierzig stehen. Du wirst deine Mama weit überholen.«
      Effi schwieg und suchte nach einer Antwort.
    points:
      - Dass Innstetten früher da ist als erwartet und Effi noch nicht zurechtgemacht ist, steckt in Effis Entschuldigung; sie will die Mutter beschwichtigen.
      - Die Verlegenheit der Mutter nennt der Erzähler einmal, ohne ihren Grund zu sagen.
      - Den Antrag erfährt die einzige Figur, die ihn nicht kennt, und er ändert ihre Lage („Und im Ernst?“).
      - Alter, Charakter und Stellung Innstettens kommen als Werbung der Mutter, die ein Ja will.
      - Die frühere Geschichte von Mutter und Innstetten kennen beide Figuren; ausgesprochen wäre sie „As you know, Bob“. Fontane hat sie ins erste Kapitel gelegt, wo Effi sie Freundinnen erzählt, die sie nicht kennen.
    hints:
      - Geh Replik für Replik vor und frag, was der Leser danach mehr weiß als vorher.
      - Wer in der Szene kennt die Vergangenheit der Mutter, und wer im ersten Kapitel nicht?
    explanation: |
      Fontane verteilt die Informationen auf verschiedene Träger. Was der Leser über die Lage wissen muss, steckt in Effis Entschuldigung („Es ist wirklich erst halb. Warum kommt er so früh?“) und in ihrem Scherz über Aschenputtel. Effi will die Mutter beschwichtigen, und der Leser erfährt nebenbei, dass Innstetten zu früh kommt und sie noch nicht umgezogen ist. Die Verlegenheit der Mutter benennt der Erzähler einmal, ihren Grund verschweigt er. Den Antrag spricht die Mutter aus, weil Effi ihn als Einzige nicht kennt, und die Nachricht ändert Effis Lage. Innstettens Alter, Charakter und Stellung kommen als Werbung: Die Mutter will ein Ja, deshalb nennt sie das Alter „alles in allem ein Glück“. Ihre eigene Vergangenheit mit Innstetten kennen beide; in dieser Szene ausgesprochen, wäre sie „As you know, Bob“. Fontane hat sie ins erste Kapitel verschoben, wo Effi sie Freundinnen erzählt, die sie nicht kennen, und hier bleibt nur ein Anklang in „Du wirst deine Mama weit überholen“.
    resources:
      - title: Theodor Fontane, „Effi Briest“, Kapitel 2 (Projekt Gutenberg-DE)
        url: https://projekt-gutenberg.org/authors/theodor-fontane/books/effi-briest/chapter/2

  - id: szene-planen
    type: practice
    title: Bevor das erste Wort steht
    prompt: |
      Wähle eine Dialogszene aus deinem eigenen Projekt mit zwei, höchstens drei Figuren. Leg fest, was die Szene ändern soll und was jede Figur in ihr will. Schreib noch keine Repliken. Die Felder sind leer; was hineinkommt, entscheidest du. Bei drei Figuren ergänzt du die Felder für Figur C.
    lang: prose
    starter: |
      Ort der Szene:
      Was nach der Szene anders ist als vorher:

      Figur A will in dieser Szene:
      Figur A sagt nicht offen:

      Figur B will in dieser Szene:
      Figur B sagt nicht offen:

      Warum nicht beide bekommen können, was sie wollen:
      Was der Spieler nach der Szene wissen muss (je ein Satz):
    checklist:
      - Die Änderung am Ende der Szene ist beobachtbar, etwa eine Handlung, eine Entscheidung oder ein neues Wissen.
      - Jede Figur hat ein eigenes Ziel in dieser Szene, und mindestens zwei Ziele stehen einander im Weg.
      - Für jede Figur steht fest, was sie nicht offen ausspricht.
      - Jede Information, die der Spieler nach der Szene wissen muss, steht als eigener Satz da.
    explanation: |
      Absichten, die vor dem Entwurf feststehen, geben jeder Replik eine Richtung. Im Feld „sagt nicht offen“ entsteht der Subtext. Was eine Figur verschweigt, bestimmt, wie sie um ihr Ziel herumredet. Die Liste der Informationen brauchst du im Expositionsdurchgang, um zu prüfen, ob jede ankommt und wo sie steht. Stehen zwei Ziele einander nicht im Weg, hat die Szene keinen Konflikt, und der Dialog wird zum Austausch von Nachrichten.
    resources:
      - title: "Meg Jayanth, „Forget Protagonists: Writing NPCs with Agency for '80 Days' and Beyond“ (GDC Vault, 2016)"
        url: https://gdcvault.com/play/1023062/Forget-Protagonists-Writing-NPCs-with

  - id: entwurf-in-einem-zug
    type: practice
    title: Einmal durchschreiben
    prompt: |
      Schreib die Szene aus deinem Plan als Dialog, 300 bis 600 Wörter, in einem Zug. Kurze Regieanweisungen sind erlaubt; die Szene trägt der Dialog. Korrigier nichts, bis du am Ende bist. Fehlt dir eine Stelle, setz eine eckige Klammer mit einem Stichwort und schreib weiter.

      Schreib im eigenen Editor, sichere die Datei als Fassung 1 und füg den Text hier ein. Danach legst du ihn mindestens eine Nacht weg.
    lang: prose
    checklist:
      - Der Entwurf hat 300 bis 600 Wörter.
      - Du hast ihn ohne Überarbeitung zu Ende geschrieben; offene Stellen sind in eckigen Klammern markiert.
      - Jede Figur aus deinem Plan spricht mindestens zweimal.
      - Mindestens eine Figur verfolgt ihr Ziel, ohne es auszusprechen.
      - Fassung 1 ist als eigene Datei oder als Commit gesichert.
    explanation: |
      Wer beim Schreiben korrigiert, wechselt ständig zwischen Erfinden und Prüfen und kommt mit keinem voran. Der Entwurf in einem Zug liefert dir Material, das du danach mit Abstand beurteilst. Markierte Lücken halten den Fluss, ohne dass du die Stelle vergisst. Fassung 1 brauchst du am Ende, um zu sehen, was die Durchgänge verändert haben.

  - id: durchgang-absicht
    type: practice
    title: Ein Verb für jede Replik
    prompt: |
      Nimm deinen Entwurf nach dem Abstand. Lies ihn laut, eine Figur nach der anderen, und markiere jede Stelle, an der du stockst. Schreib dann hinter jede Replik in eckigen Klammern ein Verb, das sagt, was die Figur damit beim Gegenüber erreichen will. Repliken ohne Verb streichst du oder gibst ihnen eine Absicht.

      Füg die markierte Fassung ein und notier darunter, was du geändert hast und warum.
    lang: prose
    checklist:
      - Hinter jeder Replik steht ein Verb, kein Thema („weicht aus“, nicht „redet über die Arbeit“).
      - Jede Replik ohne Absicht ist gestrichen oder so geändert, dass sie eine hat.
      - Jede Stelle, an der du beim lauten Lesen gestockt hast, ist geändert oder mit Grund belassen.
      - Unter der Fassung stehen mindestens drei Änderungen, jede mit einem Satz zum Warum.
      - Die neue Fassung ist getrennt von Fassung 1 gesichert.
    hints:
      - Wenn dir nur ein Thema einfällt, frag, was die Figur sich vom Gegenüber erhofft, wenn sie den Satz sagt.
    explanation: |
      Das Verb zwingt dich zu sagen, was eine Replik tut, und nicht nur, worüber sie spricht. Repliken ohne Verb sind oft Exposition oder Füllung; sie fallen hier weg, bevor du Zeit in ihre Länge steckst. Lautes Lesen, Figur für Figur, zeigt, ob die Figuren unterscheidbar klingen und wo sich ein Satz nicht sprechen lässt. Die Notizen zu deinen Änderungen brauchst du für die Reflexion am Ende.
    resources:
      - title: "Robert McKee, „Dialogue: The Art of Verbal Action for Page, Stage, and Screen“ (Hachette)"
        url: https://www.hachettebookgroup.com/titles/robert-mckee/dialogue/9781455591916/

  - id: durchgang-exposition
    type: practice
    title: Wer muss das gerade sagen?
    prompt: |
      Markiere in deiner aktuellen Fassung jeden Satz, der dem Spieler eine Tatsache mitteilt: wer wer ist, was vorher geschah, was auf dem Spiel steht. Leg darunter eine Liste an, je Information ein Eintrag. Entscheide für jede: Sie bleibt (mit dem Grund, aus dem die Figur sie ausspricht), sie wandert in den Konflikt, sie geht an eine Figur, die sie nicht kennt, sie kommt an den Ort, sie kommt später, oder sie fällt weg.

      Ändere danach die Szene und füg Liste und neue Fassung ein.
    lang: prose
    starter: |
      Information:
      Steht jetzt in Replik:
      Entscheidung und Grund:

      Information:
      Steht jetzt in Replik:
      Entscheidung und Grund:
    checklist:
      - Jede Information aus deinem Plan und jede weitere, die du im Text gefunden hast, steht in der Liste.
      - Für jede Information ist eine Entscheidung mit Grund notiert.
      - Keine Figur sagt etwas, das beide Figuren wissen, ohne damit etwas zu wollen.
      - Was der Spieler nach der Szene wissen muss, steht noch in der Szene oder ist für den Ort vorgemerkt.
    explanation: |
      Die Liste zeigt, wie viel Information die Szene trägt und wo sie steht. Viele Informationen gehören an eine andere Stelle: zu einer Figur, die fragen darf, an den Ort oder in eine spätere Szene. Was im Dialog bleibt, braucht einen Grund, den die Figur hat, nicht einen, den du als Autor hast. Der letzte Punkt der Checkliste verhindert, dass beim Verteilen eine Information verloren geht, die der Spieler braucht.
    resources:
      - title: Georg Büchner, „Wozzeck“, Szene „Zimmer“ (Wikisource)
        url: https://de.wikisource.org/wiki/Wozzeck

  - id: schauplatz-spuren
    type: practice
    title: Was ist hier passiert?
    prompt: |
      Nimm den Ort deiner Dialogszene oder einen anderen Ort aus deinem eigenen Projekt. Schreib zuerst für dich in einem Satz, was dort vorher geschehen ist; der Satz erscheint nicht im Spiel. Leg dann fünf bis acht Spuren an. Als Mittel nennen Smith und Worch unter anderem Requisiten, Texturen, Licht und Komposition. Nimm die Informationen auf, die du im Expositionsdurchgang an den Ort verschoben hast.

      Beantworte für jede Spur die zwei Fragen und markiere sie als „trägt“ (der Spieler braucht den Schluss) oder „schmückt“. Die Vorlage hat fünf Einträge; ergänze bis zu drei weitere.
    lang: prose
    starter: |
      Ort:
      Was hier vorher geschehen ist (nur für dich):

      Spur 1:
      Was erzählt das?
      Was muss der Spieler daraus schließen?
      trägt / schmückt:

      Spur 2:
      Was erzählt das?
      Was muss der Spieler daraus schließen?
      trägt / schmückt:

      Spur 3:
      Was erzählt das?
      Was muss der Spieler daraus schließen?
      trägt / schmückt:

      Spur 4:
      Was erzählt das?
      Was muss der Spieler daraus schließen?
      trägt / schmückt:

      Spur 5:
      Was erzählt das?
      Was muss der Spieler daraus schließen?
      trägt / schmückt:
    checklist:
      - Die Liste hat fünf bis acht Spuren, und für jede sind beide Fragen beantwortet.
      - Keine Spur nennt ein Gefühl beim Namen; jede beschreibt etwas, das man sehen oder finden kann.
      - Jeder Schluss, den der Spieler ziehen muss, stützt sich auf mindestens zwei Spuren.
      - Jede Spur ist als „trägt“ oder „schmückt“ markiert.
      - Kein Text am Ort (Brief, Notiz, Schild) spricht einen Schluss aus, den die anderen Spuren nahelegen sollen.
    explanation: |
      Die Trennung von „erzählt“ und „schließen“ zeigt, ob eine Spur eine Aufgabe hat. Der Satz nur für dich hält die Spuren zusammen, ohne dass er im Spiel steht. Jenkins begründet die Redundanz damit, dass man nicht voraussetzen kann, dass der Spieler ein bestimmtes Element findet oder versteht. Die Markierung „trägt“ oder „schmückt“ zeigt dir, welche Spuren du später im Playtest beobachten musst.
    resources:
      - title: Harvey Smith, Matthias Worch, „What Happened Here? Environmental Storytelling“ (GDC Vault, 2010)
        url: https://gdcvault.com/play/1012647/What-Happened-Here-Environmental
      - title: Henry Jenkins, „Game Design as Narrative Architecture“ (2004)
        url: https://web.mit.edu/~21fms/People/henry3/games&narrative.html

  - id: durchgang-textbox
    type: practice
    title: Box für Box
    prompt: |
      Bestimm zuerst deine Zeichengrenze, wie in der Lektion beschrieben: eine Box in der Größe deines Spiels, deine Schrift, deine Zielauflösung, mehrere Sätze, die kleinste Zahl. Miss dann jede Replik deiner aktuellen Fassung. Prüf bei jeder Replik über der Grenze zuerst, ob sie zwei Absichten enthält, und teile oder kürze sie dann.

      Lies die fertige Szene zum Schluss noch einmal laut. Schreib darunter eine kurze Reflexion über alle Durchgänge.
    lang: prose
    starter: |
      Zeichengrenze:
      Gemessen mit (Schrift, Größe, Auflösung, Boxgröße):
      Repliken über der Grenze und was du getan hast:

      Reflexion
      Änderung 1 (Durchgang) und Grund:
      Änderung 2 (Durchgang) und Grund:
      Änderung 3 (Durchgang) und Grund:
      Bewusst unverändert und warum:
    checklist:
      - Die Zeichengrenze steht als Zahl da, zusammen mit Schrift, Größe, Auflösung und Boxgröße, aus denen sie stammt.
      - Jede Replik ist gemessen; länger als die Grenze sind nur Repliken, die du bewusst über mehrere Boxen laufen lässt.
      - Jede Replik über mehrere Boxen ist an einem Satzende geteilt.
      - Die drei Änderungen stammen aus mindestens zwei verschiedenen Durchgängen und haben je einen Grund.
      - Die Endfassung ist als eigene Fassung gesichert.
    explanation: |
      Eine gemessene Grenze macht aus „zu lang“ eine Zahl, die du prüfen kannst. Ihre Herkunft gehört dazu, weil sie sich mit Schrift oder Auflösung ändert. Die Teilung am Satzende hält jede Box als Einheit lesbar. Die Reflexion mit Durchgang und Grund zeigt dir, welche Sorte Problem in deinen Entwürfen am häufigsten vorkommt; daran arbeitest du beim nächsten Entwurf zuerst.
