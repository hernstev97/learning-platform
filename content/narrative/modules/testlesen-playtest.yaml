lesson: |
  Ein Lehrbeispiel: Du hast einen Prototyp gebaut, in dem jemand beim Umzug einen Anruf annimmt oder das Telefon klingeln lässt. Eine Freundin spielt ihn durch, und du fragst: „War alles verständlich?“ Sie sagt: „Ja, klar.“ Beim Kaffee danach erzählt sie, wie unfreundlich sie den Vermieter am Telefon fand. In deinem Text ruft der Bruder an.

  Ihre Antwort war ehrlich und trotzdem falsch, denn ein Missverständnis, das man nicht bemerkt, kann man nicht melden. Dieses Modul zeigt, wie du beobachtest, was Leser und Spieler verstehen, statt Meinungen einzusammeln. **Testlesen** heißt, dass jemand deinen Text liest und du zusiehst; ein **Playtest** ist dasselbe mit etwas Spielbarem, etwa deinem Twine-Prototyp aus [Werkstatt: eine Entscheidung als spielbarer Prototyp](/narrative/werkstatt-entscheidung). Du prüfst dabei die Kriterien aus [Überarbeiten mit eigenen Kriterien](/narrative/ueberarbeiten), und was du danach änderst, entscheidest du selbst.

  ## Beobachten statt Meinungen sammeln

  Nach einem Test willst du wissen, ob es gut war. Die Frage danach liefert wenig. Wer dich kennt, ist höflich. Wer nicht höflich ist, erzählt dir, was er anders geschrieben hätte. Beides sagt mehr über die Testperson als über deinen Text.

  Brauchbar ist der Abstand zwischen deiner Absicht und dem, was ankommt. Du kennst deinen Text zu gut, um ihn so zu lesen wie jemand, der ihn zum ersten Mal sieht. Eine Testperson kann ihn genau einmal zum ersten Mal lesen. Dieser eine Durchgang ist das Material deines Tests.

  Deshalb beginnt jeder Test mit einem Kriterium, etwa: „Nach der Szene kann die Testperson sagen, wer anruft.“ Das Kriterium bestimmt, worauf du beim Zusehen achtest und was du danach fragst. Ohne Kriterium sammelst du Eindrücke und weißt hinterher nicht, welcher zählt.

  Meinungen sind nicht wertlos. Sie kommen zuletzt und nur, wenn du sie hören willst. Wie das geordnet geht, zeigt der Critical Response Process weiter unten.

  > [!MERKE] Verständnis, nicht Gefallen
  > Ein Test misst, was ankommt. Du vergleichst, was die Testperson tut und sagt, mit dem, was dein Kriterium verlangt.

  ## Lautes Denken: zusehen, ohne zu helfen

  Die Usability-Forschung hat dafür eine Methode. Beim **lauten Denken** (Thinking Aloud) benutzen Testpersonen ein System und sprechen dabei ununterbrochen aus, was sie denken. So beschreibt es Jakob Nielsen von der [Nielsen Norman Group](https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/). Sein Ablauf hat drei Teile: passende Testpersonen finden, ihnen passende Aufgaben geben, dann den Mund halten. Im Original heißt der dritte Teil „Shut up and let the users do the talking.“

  Bei einem Text liest die Testperson halblaut oder sagt, was ihr beim Lesen durch den Kopf geht. Beim Playtest kommentiert sie, was sie sieht und was sie vorhat. Du hörst, wo sie stockt und wen sie für wen hält.

  Lautes Denken ist unnatürlich, und Nielsen nennt das selbst als Nachteil, denn kaum jemand redet den ganzen Tag mit sich. Die Testleitung muss deshalb meist nachhelfen, damit die Person weiterspricht. Dafür genügt ein kurzer Anstoß wie „Was denkst du gerade?“. Er fragt nach ihrem Gedanken, nicht nach deinem; Nielsen warnt davor, der Person Worte in den Mund zu legen.

  Auch Verhalten ist ein Befund. Achte darauf, wo die Testperson zurückblättert, einen Satz zweimal liest, lacht, schneller wird oder vor einer Wahl lange wartet. Testpersonen filtern ihre Gedanken, bevor sie sie aussprechen; auch das nennt Nielsen als Grenze der Methode. Was sie tun, ergänzt, was sie sagen.

  > [!DEEP] Was ein Testlauf nicht leistet
  > Nielsen schreibt, lautes Denken eigne sich nicht für genaue Statistik. Für die entscheidenden Erkenntnisse reiche aber eine Handvoll Testpersonen. Er spricht über Benutzeroberflächen, nicht über Geschichten. Auf Geschichten übertragen zeigt dir ein Testlauf, wo Verständnis bricht. Wie viele deiner späteren Spieler das betrifft, zeigt er nicht.

  ### Nicht helfen, nicht erklären

  Beim Test fällt vor allem das Schweigen schwer. Die Testperson stockt, du weißt, was sie übersehen hat, und willst es sagen. Jeder Satz, den du jetzt sagst, steht nicht in deinem Text. Der nächste Leser hat dich nicht neben sich.

  Kara Pernice von der Nielsen Norman Group rät, im Zweifel still bis zehn zu zählen ([Talking with Participants During a Usability Test](https://www.nngroup.com/articles/talking-to-users/)). Zuerst prüfst du, ob die Person überhaupt eine Frage an dich hat oder nur laut denkt. Eine echte Frage beantwortest du nicht, sondern gibst sie zurück. Pernice beschreibt dafür drei Techniken:

  - **Echo.** Du wiederholst das letzte Wort der Person mit leicht fragendem Ton. („Der Bruder?“)
  - **Boomerang.** Du gibst die Frage mit einer allgemeinen Gegenfrage zurück, etwa „Was würdest du normalerweise tun?“.
  - **Columbo.** Du stellst dich unwissend, beginnst eine Frage und lässt sie offen ausklingen. Wer weniger sagt, lenkt die Person weniger.

  Halte fest, wo du helfen wolltest. Diese Stelle ist ein Befund, denn dort reicht der Text allein nicht. Hängt der Prototyp dagegen technisch, etwa weil ein Link ins Leere führt, hilfst du weiter und notierst den Fehler. Ein kaputter Link sagt nichts über deine Geschichte.

  > [!WARNING] Nicht verteidigen
  > Erklärst du nach dem Test, was du gemeint hast, antwortet die Testperson danach auf deine Fassung und nicht mehr auf ihre. Schreib deine Absicht vor dem Test auf und behalte sie für dich.

  ## Offene und neutrale Fragen nach dem Test

  Nach dem Lesen oder Spielen fragst du nach. Brauchbare Fragen sind offen. Man kann sie nicht mit Ja oder Nein beantworten. Pernice warnt ausdrücklich vor geschlossenen Fragen, die nur Ja oder Nein zulassen. Außerdem sind sie neutral, sie enthalten also weder eine Antwort noch eine Wertung.

  Diese drei Fragen passen zu den meisten Testläufen:

  - „Was ist passiert?“ zeigt, ob die Handlung angekommen ist.
  - „Was hast du an dieser Stelle erwartet?“ zeigt, welche Erwartung dein Text geweckt hat.
  - „Warum hast du so gewählt?“ zeigt, welche Gründe die Person gesehen hat.

  Eine suggestive Frage verrät, was du hören willst. „Hast du gemerkt, dass der Bruder anruft?“ enthält die Antwort und lässt nur Ja oder Nein zu. Neutral wäre „Wer hat angerufen?“. Wertungen verstecken sich oft in der Frage. „Warum war die Wahl so schwer?“ setzt voraus, dass sie schwer war.

  Die Regel hat eine Grenze. Manchmal verlangt dein Kriterium eine gezielte Frage, weil du ein bestimmtes Detail prüfen willst. Dann stellst du sie zuletzt, nach den offenen Fragen, damit sie die früheren Antworten nicht färbt.

  ## Critical Response Process: Rückmeldung in vier Schritten

  Liz Lerman hat den Critical Response Process (CRP) 1990 entwickelt, als Verfahren für Rückmeldung auf unfertige kreative Arbeit ([lizlerman.com](https://lizlerman.com/critical-response-process/)). Er kennt drei Rollen: die Person, die das Werk gemacht hat, die Antwortenden und eine Moderation. Die Moderation eröffnet jeden Schritt und hält das Gespräch in der Spur.

  1. **Bedeutungsaussagen** (Statements of Meaning): Die Antwortenden sagen, was ihnen am Werk bedeutsam, anregend, interessant oder auffällig erschien.
  2. **Fragen des Autors** (Artist as Questioner): Du fragst, was du wissen willst. Die Antwortenden bleiben bei deiner Frage und dürfen hier eine Meinung äußern, wenn die Frage danach verlangt.
  3. **Neutrale Fragen** (Neutral Questions): Die Antwortenden fragen, du antwortest. Lerman nennt eine Frage neutral, wenn keine Meinung in ihr steckt.
  4. **Meinungen mit Erlaubnis** (Permissioned Opinions): Wer eine Meinung hat, fragt erst: „Ich habe eine Meinung zu …, möchtest du sie hören?“ Du darfst Nein sagen.

  Die Reihenfolge lässt die Kontrolle bei dir. Du hörst zuerst, was angekommen ist, bevor jemand urteilt. Du bestimmst, worüber gesprochen wird. Meinungen erreichen dich nur, wenn du zustimmst. Das passt zu diesem Kurs, in dem du alle Entscheidungen über deinen Text selbst triffst.

  Bei einem Testlauf mit einer einzigen Person übernimmst du Autor und Moderation zugleich. Schreib die vier Schritte vorher auf, damit du die Reihenfolge hältst. Im Testlauf kommt der CRP nach dem Zusehen und den offenen Fragen. Nach Schritt vier sieht Lerman als Möglichkeit vor, über deinen nächsten Arbeitsschritt zu sprechen.

  > [!TIP] Bedeutungsaussagen als Verständnisprobe
  > Nennt die Testperson im ersten Schritt etwas als bedeutsam, das du nur am Rand gemeint hast, ist das ein Befund für dein Kriterium. Notiere es wörtlich.

  ## Protokoll: Beobachtung und Deutung trennen

  Beim Zusehen schreibst du mit, in zwei Spalten. Links steht, was die Person tut und sagt, mit Uhrzeit oder Stelle im Text. Rechts steht, was du daraus schließt. Wörter wie „verwirrt“, „gelangweilt“ oder „genervt“ gehören nach rechts. Auch ein „weil“ ist fast immer Deutung.

  Zwei Zeilen aus einem Protokoll zum Lehrbeispiel:

  | Beobachtung | Deutung |
  | --- | --- |
  | 1:10 scrollt zum Anfang zurück | sucht den Namen? |
  | 1:25 sagt: „Ach, das ist der Bruder.“ | Name kommt zu spät |

  Die Trennung schützt dich vor dir selbst. Deutungen entstehen schnell, und sie können zu dem passen, was du vorher dachtest, statt zu dem, was passiert ist. Die linke Spalte kannst du später neu lesen, auch mit einem anderen Kriterium.

  Danach vergleichst du die linke Spalte mit deinem Kriterium. Verlangt es „Nach der Szene kann die Testperson sagen, wer anruft“, ist die Zeile von 1:25 ein Teilerfolg. Die Testperson weiß es, aber erst nach dem Zurückscrollen. Eine einzelne Beobachtung ist kein Urteil. Wiederholt sie sich bei der nächsten Person, hast du ein Muster.

  Vorschläge der Testperson („Schreib den Namen doch gleich an den Anfang“) notierst du auch. Sie zeigen dir, wo ein Problem liegt. Die Lösung bleibt deine Arbeit, und sie darf ganz anders aussehen als der Vorschlag.

  ## Ein Testlauf mit Prototyp oder Ausdruck

  **Material.** Für einen Playtest nimmst du deinen Twine-Prototyp. „Publish to File“ erzeugt eine HTML-Datei, die sich in einem Browser öffnen lässt ([Twine Reference · Publishing a Story](https://twinery.org/reference/en/publishing/publishing.html#publishing-a-story)). Mit „Play“ geht es auch an deinem Rechner, die Adresse im Browser funktioniert aber nur dort ([Twine Reference · Playing a Story](https://twinery.org/reference/en/publishing/playing.html#playing-a-story)).

  Für ein Testlesen genügt ein Ausdruck. Auf deinem eigenen Exemplar markierst du, wo die Person stockt, zurückliest oder nachfragt.

  **Personen.** Nimm zwei bis fünf Testpersonen, einzeln nacheinander. Einzeln, weil niemand die Kommentare der anderen hören soll. Wer deinen Text schon kennt, kann ihn nicht mehr zum ersten Mal lesen. Für eine neue Fassung brauchst du deshalb auch neue Leute.

  **Ablauf.**

  1. Kriterium festlegen und daraus die Fragen für danach ableiten.
  2. Einweisen: Du testest den Text, nicht die Person. Bitte um lautes Denken und sag nichts über die Geschichte.
  3. Lesen oder spielen lassen, zusehen, protokollieren, nicht helfen.
  4. Offene Fragen stellen, danach bei Bedarf die Schritte des CRP.
  5. Protokoll gegen das Kriterium lesen und selbst entscheiden, was sich ändert.
  6. Überarbeiten und mit einer neuen Person wieder testen.

  Testen gehört in den Entwurf und nicht erst ans Ende. Tracy Fullerton stellt in „Game Design Workshop“ (5. Auflage 2024) das Kapitel „Playtesting“ in den Teil „Designing a Game“, direkt nach den Kapiteln über Prototypen ([Routledge](https://www.routledge.com/Game-Design-Workshop-A-Playcentric-Approach-to-Creating-Innovative-Games/Fullerton/p/book/9781032607009)). Laut Verlag lässt das Buch dich eigene Spiele als Prototyp bauen, testen und überarbeiten („prototyping, playtesting, and revising“).

  Ein früher Test an einem groben Prototyp kostet wenig. Ein später Test am fertigen Text findet dieselben Probleme, aber dann ist jede Änderung teuer. Ob ein Spieler die Folge seiner Wahl erkennt, prüfst du in fast jedem Playtest; was dazu gehört, steht in [Spielerwissen, Figurenwissen und verständliche Entscheidungen](/narrative/spielerwissen).

  ## Häufige Fehler

  - **Nach Gefallen fragen.** Du erkennst es an Notizen voller Adjektive wie „gut“ oder „zu lang“. Frag stattdessen, was passiert ist und was die Person erwartet hat.
  - **Helfen, sobald es stockt.** Im Protokoll stehen deine eigenen Sätze. Zähl bis zehn, gib Fragen zurück und notiere die Stelle.
  - **Erklären und verteidigen.** Nach dem Test redest du mehr als die Testperson. Schreib deine Absicht vorher auf und sprich sie nicht aus.
  - **Deutung in der linken Spalte.** Dort stehen „verwirrt“ oder „weil“. Schreib auf, was zu sehen oder zu hören war, und setz die Vermutung nach rechts.
  - **Jeden Vorschlag umsetzen.** Deine Änderungsliste nennt kein Kriterium. Prüf jeden Punkt gegen dein Kriterium; ein Vorschlag zeigt das Problem, nicht die Lösung.
  - **Mit Leuten testen, die den Text kennen.** Sie lesen nicht mehr zum ersten Mal. Hol für jede neue Fassung mindestens eine neue Person dazu.

  > [!PRAXIS] Wirkung so beschreiben, dass man sie sehen kann
  > Paweł Sasko hat für The Witcher 3 die Questreihe „Family Matters“ entworfen, bekannt als „The Bloody Baron“. Gegenüber PC Gamer erzählt er, dass man den Baron mal mag und mal verabscheut und dass das den Entscheidungen der Quest mehr Gewicht gibt. Sein Satz dazu: „You hesitate when presented with a choice.“ ([PC Gamer, 2020](https://www.pcgamer.com/how-the-witcher-3s-best-quest-was-made/)). Der Artikel sagt nur, dass getestet und abgenommen wurde, nicht wie. Die Formulierung zeigt aber, wie eine beabsichtigte Wirkung als Verhalten klingt. Ob jemand vor einer Wahl zögert, kannst du im Playtest sehen, ohne zu fragen.

  ## Zusammenfassung

  - Ein Test beobachtet Verständnis. Gefallen und Verbesserungsvorschläge sind Nebensache.
  - Jeder Testlauf beginnt mit einem Kriterium aus deiner beabsichtigten Wirkung.
  - Beim lauten Denken spricht die Testperson aus, was sie denkt. Du schweigst, hilfst nicht und gibst Fragen mit Echo oder Boomerang zurück.
  - Fragen danach sind offen und neutral: „Was ist passiert?“, „Was hast du erwartet?“, „Warum hast du so gewählt?“.
  - Der Critical Response Process ordnet Rückmeldung: Bedeutungsaussagen, Fragen des Autors, neutrale Fragen, Meinungen nur mit Erlaubnis.
  - Das Protokoll trennt Beobachtung (links) von Deutung (rechts).
  - Du vergleichst die Beobachtungen mit deinem Kriterium und entscheidest selbst, was sich ändert. Du verteidigst nichts.
  - Teste früh am groben Prototyp, einzeln und mit Personen, die den Text noch nicht kennen.
exercises:
  - id: beobachtung-erkennen
    type: choice
    title: Links oder rechts?
    prompt: |
      Diese Notizen stammen aus einem Testlauf zum Lehrbeispiel mit dem Anruf beim Umzug. Welche Einträge sind Beobachtungen und gehören in die linke Spalte?
    options:
      - text: Liest den Satz mit dem Namen zweimal.
        correct: true
        why: Das kann jeder sehen, der danebensitzt. Es ist ein Verhalten, keine Vermutung.
      - text: Ist vom Anfang gelangweilt.
        correct: false
        why: Langeweile siehst du nicht. Du schließt sie aus etwas, das du gesehen hast. Das Gesehene gehört nach links, der Schluss nach rechts.
      - text: "Sagt: „Ach, das ist der Bruder.“"
        correct: true
        why: Ein wörtliches Zitat ist eine Beobachtung. Es zeigt dir sogar, wann die Person den Anrufer erkannt hat.
      - text: Versteht den Schluss nicht.
        correct: false
        why: Ob sie etwas versteht, ist eine Folgerung. Beobachtbar wäre etwa, dass sie fragt, was passiert ist.
      - text: Zögert, weil sie die Folgen fürchtet.
        correct: false
        why: Das Zögern könntest du sehen, den Grund nicht. Das „weil“ macht den Eintrag zur Deutung.
    explanation: |
      In die linke Spalte gehört nur, was zu sehen oder zu hören war. Gefühle, Gründe und Urteile über Verständnis sind Schlüsse daraus. Getrennt notiert kannst du die Beobachtungen später mit einem anderen Kriterium neu lesen, und deine Vermutungen bleiben als Vermutungen erkennbar.
    hints:
      - Frag bei jedem Eintrag, ob eine zweite Person im Raum dasselbe notieren würde.
      - Wörter für Gefühle und das Wort „weil“ zeigen eine Deutung an.
    resources:
      - title: "Jakob Nielsen · Thinking Aloud: The #1 Usability Tool"
        url: https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/

  - id: neutrale-frage
    type: choice
    title: Eine Frage, die nichts verrät
    prompt: |
      Welche Frage prüft nach dem Testlauf das Verständnis, ohne eine Antwort oder eine Wertung vorzugeben?
    options:
      - text: Was ist passiert, nachdem das Telefon geklingelt hat?
        correct: true
        why: Die Frage ist offen, nennt keine Antwort und wertet nicht. Die Person muss in eigenen Worten wiedergeben, was sie verstanden hat.
      - text: Hast du verstanden, wer angerufen hat?
        correct: false
        why: Die Frage lässt nur Ja oder Nein zu, und „Ja“ ist die höfliche Antwort. Ob die Person den Anrufer richtig erkannt hat, erfährst du so nicht.
      - text: Warum war die Entscheidung so schwer für dich?
        correct: false
        why: Die Frage setzt voraus, dass die Entscheidung schwer war. Damit steckt deine Wertung schon darin.
      - text: Fandest du den Schluss zu kurz?
        correct: false
        why: Hier steckt eine Meinung in der Frage, und die Antwort ist Ja oder Nein. Im Critical Response Process ist das keine neutrale Frage.
      - text: Wie hat es dir gefallen?
        correct: false
        why: Die Frage ist offen, aber sie fragt nach einem Urteil. Über das Verständnis sagt die Antwort wenig.
    explanation: |
      Eine brauchbare Frage nach dem Test ist offen und neutral. Offen heißt, man kann sie nicht mit Ja oder Nein beantworten. Neutral heißt, in ihr steckt weder die gesuchte Antwort noch eine Meinung. Nur dann hörst du, was bei der Person angekommen ist, und nicht, was sie glaubt, dass du hören willst.
    hints:
      - Streich alle Fragen, die man mit Ja oder Nein beantworten kann.
      - Prüf bei den übrigen, ob sie eine Wertung voraussetzen oder nach Gefallen fragen.
    resources:
      - title: Kara Pernice · Talking with Participants During a Usability Test
        url: https://www.nngroup.com/articles/talking-to-users/

  - id: crp-schritte
    type: order
    title: Erst hören, dann urteilen
    prompt: |
      Bring die Schritte des Critical Response Process nach Liz Lerman in die richtige Reihenfolge. Der letzte Schritt ist eine Möglichkeit, die Lerman nach den vier Kernschritten vorsieht.
    lang: prose
    lines: |
      Bedeutungsaussagen: Was war bedeutsam, anregend oder auffällig?
      Fragen des Autors: Der Autor fragt, was er wissen will.
      Neutrale Fragen: Die Antwortenden fragen ohne versteckte Meinung.
      Meinungen mit Erlaubnis: „Ich habe eine Meinung zu …, möchtest du sie hören?“
      Nächster Schritt: Der Autor sagt, was er als Nächstes tut.
    explanation: |
      Der Prozess beginnt mit dem, was angekommen ist, und endet mit Meinungen, die der Autor ausdrücklich zulässt. So hört der Autor zuerst, wie das Werk wirkt, bevor jemand urteilt. In Schritt zwei bestimmt er selbst das Thema, und in Schritt vier darf er eine Meinung ablehnen. Diese Reihenfolge lässt die Entscheidung über das Werk bei ihm.
    hints:
      - Meinungen kommen so spät wie möglich.
      - Bevor die Antwortenden fragen, darf der Autor fragen.
    resources:
      - title: Liz Lerman · Critical Response Process
        url: https://lizlerman.com/critical-response-process/

  - id: testlauf-ablauf
    type: order
    title: Ein Testlauf von vorn bis hinten
    prompt: |
      Bring die Schritte eines Testlaufs in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Ein Kriterium aus der beabsichtigten Wirkung festlegen.
      Aus dem Kriterium die Fragen für nach dem Test ableiten.
      Die Testperson einweisen und um lautes Denken bitten.
      Zusehen und protokollieren, ohne zu helfen.
      Offene Fragen stellen, danach bei Bedarf die Schritte des CRP.
      Das Protokoll mit dem Kriterium vergleichen und selbst entscheiden.
      Überarbeiten und mit einer neuen Person wieder testen.
    explanation: |
      Das Kriterium steht am Anfang, weil es bestimmt, worauf du achtest und was du fragst. Die Fragen bereitest du vor, damit du sie nach dem Test nicht spontan formulierst und dabei die Antwort hineinlegst. Erst kommt das Beobachten, dann das Fragen, denn jede Frage verändert, was die Person danach erzählt. Am Ende testest du die neue Fassung mit jemandem, der den Text noch nicht kennt.
    hints:
      - Ohne Kriterium weißt du nicht, was du fragen sollst.
      - Fragen stellst du erst, wenn das Lesen oder Spielen vorbei ist.
    resources:
      - title: "Jakob Nielsen · Thinking Aloud: The #1 Usability Tool"
        url: https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/

  - id: frage-mitten-im-test
    type: choice
    title: „Muss ich jetzt rangehen?“
    prompt: |
      Mitten im Playtest des Lehrbeispiels hält die Testperson inne und fragt dich: „Muss ich jetzt rangehen?“ Was antwortest du?
    options:
      - text: „Was würdest du normalerweise tun?“
        correct: true
        why: Das ist ein Boomerang nach Kara Pernice. Du gibst die Frage zurück und erfährst, was die Person ohne dich tun würde.
      - text: „Nein, du kannst es auch klingeln lassen.“
        correct: false
        why: Du hilfst und verrätst nebenbei, welche Optionen es gibt. Ob der Text die Wahl allein verständlich macht, weißt du danach nicht mehr.
      - text: „Der Anruf ist wichtig, das merkst du gleich.“
        correct: false
        why: Du erklärst deine Absicht. Die Person spielt danach deine Deutung weiter und nicht ihre eigene.
      - text: „Das erkläre ich dir nach dem Test.“
        correct: false
        why: Das hilft nicht, liefert aber auch keinen Befund; der Boomerang zeigt dir, was die Person ohne dich täte.
    explanation: |
      Eine echte Frage im Test beantwortest du nicht, du gibst sie zurück. Pernice nennt dafür das Echo (du wiederholst „Rangehen?“ mit fragendem Ton) und den Boomerang (eine allgemeine Gegenfrage). Die Frage selbst notierst du im Protokoll. Sie zeigt eine Stelle, an der der Text die Wahl noch nicht klar genug anbietet.
    hints:
      - Welche Antwort lässt die Person selbst entscheiden?
      - Jede Information, die du gibst, steht nicht im Text.
    resources:
      - title: Kara Pernice · Talking with Participants During a Usability Test
        url: https://www.nngroup.com/articles/talking-to-users/

  - id: begriffe-testlauf
    type: gap
    title: Fünf Begriffe für einen Testlauf
    prompt: |
      Ergänze die fehlenden Begriffe.
    lang: prose
    code: |
      Beim ⟦lauten Denken⟧ spricht die Testperson aus, was ihr beim Lesen oder Spielen durch den Kopf geht.
      Im Protokoll steht links die ⟦Beobachtung⟧ und rechts die ⟦Deutung⟧.
      Im Critical Response Process hört der Autor ⟦Meinungen⟧ nur mit seiner Erlaubnis.
      Eine Frage ist ⟦neutral⟧, wenn keine Meinung in ihr steckt.
    gaps:
      - label: Methode
        hint: Auf Englisch heißt sie Thinking Aloud.
        accept: ["lautes Denken", "lautem Denken", "Thinking Aloud", "Think Aloud"]
      - label: Linke Spalte
        hint: Was man sehen oder hören kann.
        accept: ["Beobachtungen"]
      - label: Rechte Spalte
        hint: Was du daraus schließt.
        accept: ["Deutungen", "Interpretation", "Interpretationen", "Vermutung", "Vermutungen"]
      - label: Schritt vier im CRP
        hint: Lerman nennt den Schritt Permissioned Opinions.
        accept: ["Meinung"]
      - label: Art der Frage
        hint: Lerman nennt Schritt drei Neutral Questions.
    explanation: |
      Lautes Denken macht sichtbar, wie jemand deinen Text versteht. Das Protokoll trennt, was passiert ist, von dem, was du daraus schließt. Der Critical Response Process lässt Meinungen erst zu, wenn der Autor zustimmt, und nennt Fragen neutral, wenn sie keine Meinung enthalten.
    resources:
      - title: Liz Lerman · Critical Response Process
        url: https://lizlerman.com/critical-response-process/

  - id: fragen-neutral-umschreiben
    type: practice
    title: Zwei Fragen entschärfen
    prompt: |
      Diese zwei Fragen stammen aus einem Testlauf zum Lehrbeispiel. Der Anrufer heißt Jonas und ist der Bruder.

      1. „Hast du gemerkt, dass Jonas der Bruder ist?“
      2. „Fandest du die Wahl am Ende schwer?“

      Schreib jede so um, dass sie offen und neutral ist. Eine Zeile je Frage genügt.
    lang: prose
    starter: |
      Frage 1 neu:
      Frage 2 neu:
    checklist:
      - Keine der beiden Fragen lässt sich mit Ja oder Nein beantworten.
      - Frage 1 enthält das Wort „Bruder“ nicht.
      - Frage 2 enthält kein wertendes Wort wie „schwer“, „leicht“ oder „gut“.
      - Beide Fragen beginnen mit einem Fragewort wie wer, was, wie, woran oder warum.
    explanation: |
      Die erste Frage verrät die Antwort und lässt nur Ja oder Nein zu. Die zweite legt dir ein Gefühl in den Mund, das die Person vielleicht gar nicht hatte. Offen gefragt erzählt die Person selbst, wen sie am Telefon gehört hat und was ihr vor der Wahl durch den Kopf ging. Das ist das Material, das du mit deinem Kriterium vergleichen kannst.
    hints:
      - Frag nach dem, was die Person weiß, nicht danach, ob sie etwas gemerkt hat.
      - Frag nach dem, was vor der Wahl in ihrem Kopf passiert ist, statt nach einem Urteil darüber.
    resources:
      - title: Kara Pernice · Talking with Participants During a Usability Test
        url: https://www.nngroup.com/articles/talking-to-users/

  - id: protokoll-deutung
    type: bug
    title: Ein Eintrag weiß zu viel
    prompt: |
      Ein Protokoll aus dem Playtest zum Lehrbeispiel. Finde die Zeile, die eine Deutung als Beobachtung ausgibt.
    lang: prose
    code: |
      0:20 Liest den ersten Absatz halblaut.
      0:50 Scrollt zum Anfang zurück.
      1:05 Sagt: „Wer ist Jonas?“
      1:40 Bewegt den Zeiger zwischen beiden Links hin und her.
      2:10 Klickt „Klingeln lassen“, weil der Anruf sie nervt.
      2:30 Fragt: „War das jetzt falsch?“
    lines: [5]
    explanation: |
      Zeile 5 enthält zwei Dinge. Den Klick hast du gesehen, den Grund nicht. „Weil der Anruf sie nervt“ ist eine Vermutung und gehört in die rechte Spalte. Steht sie links, liest du das Protokoll später, als hätte die Person das gesagt. Ob sie genervt war, kannst du nach dem Test mit „Warum hast du so gewählt?“ erfragen.
    hints:
      - Achte auf ein Wort, das einen Grund angibt.
      - Die Zeitangaben und Zitate sind nicht das Problem.
    resources:
      - title: "Jakob Nielsen · Thinking Aloud: The #1 Usability Tool"
        url: https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/

  - id: suggestive-frage
    type: bug
    title: Eine Frage zu viel
    prompt: |
      Diese Fragen hast du für die Zeit nach einem Testlauf vorbereitet. Finde die Frage, die der Testperson die Antwort vorgibt.
    lang: prose
    code: |
      Was ist in der Szene passiert?
      Wer hat angerufen?
      Was hast du erwartet, als das Telefon klingelte?
      Warum hast du so gewählt?
      Hast du gemerkt, dass Jonas Hilfe braucht?
      Was weißt du jetzt über Jonas?
    lines: [5]
    explanation: |
      Frage 5 verrät, was die Person verstanden haben soll, und lässt nur Ja oder Nein zu. Wer nicht gemerkt hat, dass Jonas Hilfe braucht, erfährt es durch die Frage und kann trotzdem „ja“ sagen. Frage 6 prüft dasselbe Kriterium offen. Die gezielte Frage 2 ist nicht suggestiv, denn sie nennt keine Antwort.
    hints:
      - Welche Frage kann man mit Ja oder Nein beantworten?
      - Welche Frage enthält schon die Information, die du prüfen willst?
    resources:
      - title: Liz Lerman · Critical Response Process
        url: https://lizlerman.com/critical-response-process/

  - id: gustl-erster-absatz
    type: explain
    title: Wo sind wir hier?
    prompt: |
      So beginnt Arthur Schnitzlers „Leutnant Gustl“, zitiert nach der Ausgabe von 1906, die „Lieutenant Gustl“ schreibt. Du lässt jemanden diesen Ausschnitt testlesen. Was muss die Testperson danach sagen können, und wie prüfst du das, ohne die Antwort in die Frage zu legen? Zwei bis vier Sätze genügen.
    lang: prose
    code: |
      Wie lange wird denn das noch dauern? Ich muß auf die Uhr schauen … schickt sich wahrscheinlich nicht in einem so ernsten Konzert. Aber wer sieht’s denn? Wenn’s einer sieht, so paßt er gerade so wenig auf, wie ich, und vor dem brauch’ ich mich nicht zu genieren … Erst viertel auf zehn? … Mir kommt vor, ich sitz’ schon drei Stunden in dem Konzert. Ich bin’s halt nicht gewohnt … Was ist es denn eigentlich? Ich muß das Programm anschauen … Ja, richtig: Oratorium! Ich hab’ gemeint: Messe. Solche Sachen gehören doch nur in die Kirche! Die Kirche hat auch das Gute, daß man jeden Augenblick fortgehen kann. – Wenn ich wenigstens einen Ecksitz hätt’! – Also Geduld, Geduld! Auch Oratorien nehmen ein End’!
    points:
      - Es gibt keinen Erzähler; der Leser hört nur die Gedanken einer Figur, als inneren Monolog.
      - Die Testperson sollte danach sagen können, wo der Sprecher ist (in einem Konzert, einem Oratorium) und dass er sich langweilt.
      - Du prüfst das mit offenen Fragen wie „Wo sind wir?“ und „Wer spricht hier?“, nicht mit einer Frage, die das Konzert schon nennt.
      - Beim lauten Denken zeigt die Stelle, an der die Person den Ort zum ersten Mal nennt, wie viel Text sie dafür braucht.
      - Ob die Testperson den Titel sieht, legst du vorher fest, denn er nennt Namen und Rang.
    explanation: |
      Der Ausschnitt hat keinen Erzähler. Alles kommt aus dem Kopf eines Mannes, der in einem Konzert sitzt, auf die Uhr schauen will und die Zeit nicht herumbringt. Ort und Lage setzt der Leser aus Bruchstücken zusammen: „Konzert“, „viertel auf zehn“, „Programm“, „Oratorium“. Ein Kriterium könnte lauten: „Nach dem Ausschnitt kann die Testperson sagen, wo der Sprecher ist und wie es ihm dort geht.“ Du prüfst es offen, mit „Wo sind wir?“ und „Wer spricht hier?“, und nicht mit „Hast du gemerkt, dass er im Konzert sitzt?“. Beim lauten Denken siehst du außerdem, an welcher Stelle die Person den Ort zum ersten Mal nennt und ob sie zwischen „Messe“, „Oratorium“ und „Kirche“ den Faden verliert. Ob die Testperson den Titel sieht, entscheidest du vorher, denn er verrät Namen und Rang des Sprechers.
    hints:
      - Woran merkst du im Text, wo der Sprecher sitzt?
      - Formuliere die Frage so, dass sie weder den Ort noch den Sprecher nennt.
    resources:
      - title: Schnitzler, „Lieutenant Gustl“ (1906) auf Wikisource
        url: https://de.wikisource.org/wiki/Lieutenant_Gustl

  - id: rotkaeppchen-vorwissen
    type: explain
    title: Ein Märchen, das alle kennen
    prompt: |
      Die erste Frage aus Rotkäppchens Gespräch mit der „Großmutter“, zitiert nach der Ausgabe der Brüder Grimm von 1857, die „Rothkäppchen“ schreibt. Du willst die Szene testlesen lassen. Warum ist das mit diesem Text schwierig, und was folgt daraus für die Wahl deiner Testpersonen und deiner Kriterien? Zwei bis vier Sätze genügen.
    lang: prose
    code: |
      „Ei, Großmutter, was hast du für große Ohren!“ „Daß ich dich besser hören kann.“
    points:
      - Wer das Märchen kennt, kann es nicht mehr zum ersten Mal lesen; ein Test misst dann Wiedererkennen statt Verständnis.
      - Für eigene Tests folgt daraus, Testpersonen zu wählen, die die Fassung nicht kennen, und Vorwissen vor dem Test zu erfragen.
      - Ein Kriterium, das auch Kenner prüfen lässt, fragt nach der Fassung, nicht nach dem Ausgang.
    explanation: |
      Die Stelle wirkt, weil der Leser weiß, wer im Bett liegt, und Rotkäppchen nicht; wie solche Wissensstände arbeiten, behandelt [Spielerwissen](/narrative/spielerwissen). Viele kennen das Märchen aber seit ihrer Kindheit. Ihre Reaktion beim Testlesen zeigt dann, dass sie die Stelle wiedererkennen, nicht, ob der Text den Wissensvorsprung allein aufbaut. Mit Kennern kannst du trotzdem etwas prüfen, wenn das Kriterium nach der Fassung fragt und nicht nach dem Ausgang, etwa danach, was an dieser Fassung anders ist als an der bekannten. Für deine eigenen Tests heißt das: Frag vorher, was die Person schon kennt, und nimm für jede neue Fassung jemanden, der sie noch nicht gelesen hat.
    hints:
      - Was weiß fast jeder schon, bevor er diese Zeile liest?
      - Was lässt sich an einem bekannten Text noch prüfen, wenn der Ausgang feststeht?
    resources:
      - title: Grimm, „Rothkäppchen“ (1857) auf Wikisource
        url: https://de.wikisource.org/wiki/Rothk%C3%A4ppchen_(1857)

  - id: lets-play-protokoll
    type: practice
    title: Fünf Minuten zusehen
    prompt: |
      Wähle ein Video, in dem jemand ein Spiel zum ersten Mal spielt und dabei spricht, etwa ein Let's Play eines Spiels, das du kennst. Sieh etwa fünf Minuten zu und protokolliere drei Beobachtungen, jede mit einer kurzen Deutung. Stichpunkte genügen.
    lang: prose
    starter: |
      Video und Spiel:
      Beobachtung 1 (Zeit):
      Deutung 1:
      Beobachtung 2 (Zeit):
      Deutung 2:
      Beobachtung 3 (Zeit):
      Deutung 3:
    checklist:
      - Du hast drei Beobachtungen notiert, jede mit einer Zeitangabe aus dem Video.
      - Keine Beobachtung enthält ein Gefühlswort oder ein „weil“.
      - Jede Deutung steht getrennt von ihrer Beobachtung.
      - Mindestens eine Beobachtung gibt wörtlich oder sinngemäß wieder, was die Person über das Spiel sagt oder vermutet.
    explanation: |
      Ein Let's Play ist kein sauberer Test. Die Person spricht für ein Publikum, und Nielsen nennt schon beim gewöhnlichen lauten Denken die unnatürliche Situation und gefilterte Aussagen als Grenzen. Zum Üben der Trennung reicht es trotzdem. Du lernst, schnell zu notieren, was zu sehen und zu hören ist, und deine Vermutung getrennt danebenzustellen.
    hints:
      - Achte auf Stellen, an denen die Person stockt, zurückgeht oder etwas vermutet.
      - Schreib zuerst nur die linke Spalte und ergänze die Deutungen danach.
    resources:
      - title: "Jakob Nielsen · Thinking Aloud: The #1 Usability Tool"
        url: https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/

  - id: drei-fragen-ein-kriterium
    type: practice
    title: Dein nächster Testlauf
    prompt: |
      Für dein eigenes Projekt: Nimm ein Kriterium, das du für einen eigenen Text oder Prototyp festgelegt hast (zum Beispiel in [Überarbeiten mit eigenen Kriterien](/narrative/ueberarbeiten)), oder formuliere eines. Schreib drei neutrale Fragen auf, die du nach dem nächsten Testlauf stellen willst, um dieses Kriterium zu prüfen.
    lang: prose
    starter: |
      Kriterium:
      Frage 1:
      Frage 2:
      Frage 3:
    checklist:
      - Das Kriterium beschreibt, was die Testperson nach dem Lesen oder Spielen sagen oder tun kann.
      - Keine Frage lässt sich mit Ja oder Nein beantworten.
      - Keine Frage enthält die Antwort, die du hören willst, oder eine Wertung.
      - Mindestens eine Frage fragt nach einer Erwartung oder nach dem Grund für eine Wahl.
      - Du kannst zu jeder Frage sagen, welchen Teil des Kriteriums sie prüft.
    explanation: |
      Vorbereitete Fragen schützen dich davor, nach dem Test spontan zu fragen und dabei deine Absicht hineinzulegen. Weil sie aus dem Kriterium kommen, prüfen sie, was du wissen musst, und nicht, was gerade nahe liegt. Fragen nach Erwartung und Gründen zeigen dir, wie die Person gedacht hat, bevor sie etwas getan hat.
    hints:
      - Schreib das Kriterium so, dass am Ende die Testperson etwas sagen oder tun kann.
      - Die drei Fragen aus der Lektion sind ein Anfang, passe sie an dein Kriterium an.
    resources:
      - title: Liz Lerman · Critical Response Process
        url: https://lizlerman.com/critical-response-process/
