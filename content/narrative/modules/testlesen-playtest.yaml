id: testlesen-playtest
title: "Testlesen und Playtest: Verständlichkeit beobachten"
level: 3
minutes: 85
summary: Du lernst, Leser und Spieler beim Verstehen zu beobachten, neutral nachzufragen und Rückmeldung so zu ordnen, dass die Entscheidung über deinen Text bei dir bleibt.
place: unterwegs
goals:
  - Du planst einen Testlauf, der Verständnis beobachtet statt Meinungen einzusammeln, und leitest ihn aus einem eigenen Kriterium ab.
  - Du leitest lautes Denken an, ohne zu helfen oder zu erklären, und gibst Fragen der Testperson an sie zurück.
  - Du stellst nach dem Test offene, neutrale Fragen und erkennst Fragen, die eine Antwort vorgeben.
  - Du führst ein Protokoll, das Beobachtung und Deutung trennt, und vergleichst es mit deinen Kriterien.
  - Du nennst die vier Schritte des Critical Response Process und erklärst, warum sie die Entscheidung beim Autor lassen.
