id: werkstatt-entscheidung
title: "Werkstatt: eine Entscheidung als spielbarer Prototyp"
level: 3
minutes: 210
summary: Du beschreibst eine Entscheidung aus deinem eigenen Projekt als Ablauf mit Voraussetzungen und Folgen und baust sie in Twine mit Harlowe als klickbaren Prototyp, den andere spielen können.
place: pc
goals:
  - Du beschreibst eine Entscheidung aus deinem eigenen Projekt als Ablauf mit Ausgangslage, Voraussetzungen, Optionen, unmittelbarer und späterer Folge.
  - Du baust die Entscheidung in Twine 2.12 mit Harlowe 3.3.9 als klickbaren Prototyp aus Passagen und Links.
  - Du merkst dir die Wahl mit `(set:)` und fragst sie in einer späteren Passage mit `(if:)` und `(else:)` ab.
  - Du spielst jeden Weg von der Startpassage aus durch und findest Tippfehler in Links und Variablennamen.
  - Du sicherst den Prototyp als Archiv und als HTML-Datei außerhalb des Browsers.
resources:
  - title: Twine Reference · Archiving and Exporting Stories
    url: https://twinery.org/reference/en/story-library/exporting.html#archiving-your-library
  - title: Twine Reference · Testing a Story
    url: https://twinery.org/reference/en/publishing/testing.html#testing-a-story
  - title: Harlowe-Handbuch · (set:)
    url: https://twine2.neocities.org/#macro_set
  - title: Harlowe-Handbuch · (if:)
    url: https://twine2.neocities.org/#macro_if
lesson: |
  Auf dem Papier wirkt eine Entscheidung oft klar: zwei Optionen, zwei Folgen, eine spätere Szene, die darauf zurückkommt. Ob ein Spieler sie versteht, zeigt sich erst, wenn jemand sie spielt: ob er weiß, was zur Wahl steht, und ob er die spätere Folge mit seiner Wahl verbindet. Dafür muss die Entscheidung spielbar sein, lange bevor sie in einer Engine steckt. Twine baut daraus einen klickbaren Prototyp aus Textpassagen und Links, ohne Grafik und ohne Programmierprojekt.

  In diesem Modul beschreibst du eine Entscheidung aus deinem eigenen Projekt als Ablauf, baust sie in Twine nach, spielst jeden Weg selbst und sicherst die Datei. Was du baust, entscheidest du. Die Beispiele zeigen nur die Technik an einem Lehrbeispiel, einem Anruf am Bahnsteig. Der fertige Prototyp ist das Material für [Testlesen und Playtest](/narrative/testlesen-playtest). Die Strukturfragen kennst du aus [Verzweigungen](/narrative/verzweigungen), die Frage, was der Spieler vor der Wahl wissen muss, aus [Spielerwissen](/narrative/spielerwissen).

  ## Ablaufdiagramm vor dem Prototyp

  Schreib den Ablauf auf, bevor du Twine öffnest. Sonst denkst du über Passagen nach statt über die Entscheidung. Das Diagramm hat fünf Teile:

  1. **Ausgangslage**: Wo steht der Spieler, was ist gerade passiert?
  2. **Voraussetzungen**: Was muss der Spieler wissen oder haben, um zu verstehen, was zur Wahl steht? In welcher Passage erfährt er es?
  3. **Optionen**: zwei oder drei, jede mit dem Wert, den sie in einer Variable hinterlässt.
  4. **Unmittelbare Folge**: was direkt nach der Wahl passiert.
  5. **Spätere Folge**: wo die Geschichte die Wahl über die Variable wieder aufgreift.

  Für das Lehrbeispiel sieht das so aus:

  ```text
  Ausgangslage   Bahnsteig, das Telefon klingelt, unbekannte Nummer
  Voraussetzung  Spieler sieht: unbekannte Nummer (Passage Bahnsteig)
  Optionen       Annehmen   -> $angenommen = true
                 Ignorieren -> $angenommen = false
  Sofort         Passage Gespräch | Passage Mailbox
  Später         Passage Abend: ein Satz hängt vom Wert ab
  ```

  ## Twine 2.12 und Harlowe 3.3.9

  Twine ist ein Werkzeug für verzweigte Geschichten. Version 2.12.1 erschien am 6. Oktober 2026 ([twinery.org](https://twinery.org/)). Du kannst Twine installieren oder ohne Installation im Browser nutzen.

  Neue Geschichten verwenden das Story-Format Harlowe, Twine 2.12.1 bringt Harlowe 3.3.9 mit. Das Story-Format bestimmt, wie die Geschichte im Browser läuft und wie Variablen geschrieben werden ([Twine Reference: Story Formats](https://twinery.org/reference/en/getting-started/basic-concepts.html#story-formats)). Welches Format eine Geschichte nutzt, siehst du unter Story → Details. Die Menünamen hier stammen aus der englischen Oberfläche (Sprache: Twine → Preferences).

  > [!WARNING] Browser-Twine speichert nur im Browser
  > Twine im Browser legt alles im Speicher dieses Browsers und Profils ab. Löschst du die Browserdaten oder das Profil, sind alle Geschichten weg. Das gilt auch, wenn du Twine als Web-App installiert hast. Die Referenz verlangt deshalb regelmäßige Sicherungen und rät von Safari auf dem Mac ab ([Twine Reference: Using a Web Browser](https://twinery.org/reference/en/getting-started/installing.html#using-a-web-browser)).

  Zwei Sicherungen gehören ans Ende jeder Arbeitssitzung ([Archiving and Exporting Stories](https://twinery.org/reference/en/story-library/exporting.html#archiving-your-library)). Im Reiter Library speichert **Archive** alle Geschichten in eine Datei, die du wieder importieren kannst. Im Reiter Build speichert **Publish to File** die aktuelle Geschichte als HTML-Datei, die jeder Browser abspielt. Für Fassungen in Git ([Git-Grundlagen](/git/git-einstieg)) empfiehlt die Referenz das Textformat Twee, weil Twine das HTML komprimiert ([Working With Source Control](https://twinery.org/reference/en/limitations/source-control.html)).

  ## Passagen und Links

  Eine Twine-Geschichte besteht aus Passagen. Eine Passage ist ein Stück Text, das der Spieler in einem Moment sieht. Eine davon ist die Startpassage, im Story-Plan mit einer grünen Rakete markiert. Links verbinden die Passagen ([Twine Reference: Linking Passages](https://twinery.org/reference/en/editing-stories/linking-passages.html#linking-passages)). Die Startpassage „Bahnsteig“:

  ```text
  Dein Telefon klingelt. Auf dem Display steht eine unbekannte Nummer.
  [[Annehmen->Gespräch]]
  [[Ignorieren->Mailbox]]
  ```

  Vor dem Pfeil steht der Text, den der Spieler anklickt, dahinter der Name der Zielpassage. `[[Mailbox]]` ohne Pfeil zeigt den Passagennamen selbst als Linktext ([Harlowe: Link markup](https://twine2.neocities.org/#markup_link)). Gibt es die Zielpassage noch nicht, legt Twine sie leer an. Passagennamen unterscheiden Groß- und Kleinschreibung. Ein Link `[[Weiter->abend]]` führt deshalb nicht zur Passage „Abend“, sondern legt eine neue, leere Passage „abend“ an. Leere Passagen zeigt der Story-Plan halb durchsichtig mit gepunktetem Rand.

  ## Variablen: die Wahl merken und abfragen

  Damit eine spätere Passage weiß, wie der Spieler gewählt hat, setzt jede Optionspassage eine Variable ([Harlowe: set](https://twine2.neocities.org/#macro_set)). Die Passage „Gespräch“:

  ```text
  (set: $angenommen to true)
  Eine Frau fragt nach Herrn Weber. Du sagst ihr, dass sie sich verwählt hat.
  [[Weiter->Abend]]
  ```

  In „Mailbox“ steht entsprechend `(set: $angenommen to false)`, dazu ein eigener Satz und derselbe Link. Variablen mit `$` gelten in der ganzen Geschichte, Variablen mit `_` nur in der Passage oder dem Hook, in dem sie entstehen. Beide Wege münden in „Abend“, und dort fragt `(if:)` den Wert ab ([Harlowe: if](https://twine2.neocities.org/#macro_if)):

  ```text
  Am Abend liegt ein Brief im Kasten, adressiert an einen Herrn Weber.
  (if: $angenommen)[Den Namen hast du heute schon einmal gehört.](else:)[Der Name sagt dir nichts.]
  ```

  Der Text in eckigen Klammern ist ein Hook. `(if:)` zeigt ihn nur, wenn die Bedingung wahr ist. `(else:)` zeigt seinen Hook, wenn der vorige verborgen blieb, und braucht deshalb einen Hook davor; fehlt er, meldet Harlowe einen Fehler. Für mehr als zwei Werte gibt es `(else-if:)` und den Vergleich mit `is` ([Harlowe: else-if](https://twine2.neocities.org/#macro_else-if)):

  ```text
  (if: $antwort is "angenommen")[Den Namen kennst du.](else-if: $antwort is "ignoriert")[Du denkst an den Anruf.](else:)[Der Name sagt dir nichts.]
  ```

  Drei Eigenheiten von Harlowe 3 führen oft zu Fehlern. `(if:)` nimmt nur Wahrheitswerte an und prüft einmal, wenn die Passage erscheint. Variablennamen unterscheiden Groß- und Kleinschreibung, `$Brief` und `$brief` sind zwei Variablen; Makronamen wie `set` dagegen nicht. Und eine `$`-Variable, die nie gesetzt wurde, hat den Wert 0 ([Harlowe: Variable markup](https://twine2.neocities.org/#markup_variable)). Ein Tippfehler im Namen erzeugt beim Vergleich mit `is` deshalb keine Fehlermeldung, sondern führt still in den `(else:)`-Hook.

  > [!NOTE] Versionsangabe im Handbuch
  > Das Handbuch heißt im Titel noch „Harlowe 3.3.8 manual“, beschreibt aber schon 3.3.9 vom 16. Juni 2024, für die alle Beispiele hier gelten.

  ## Testen: jeden Weg selbst spielen

  **Build → Test** startet die Geschichte an der Startpassage im Debug Mode von Harlowe. Im Panel unten rechts öffnet der Knopf Variables eine Tabelle aller Variablen mit Wert ([Harlowe: Debug Mode](https://twine2.neocities.org/#interface_debug-mode)). **Build → Play** zeigt die Geschichte so, wie Spieler sie sehen.

  **Test From Here** im Reiter Passage startet an der gewählten Passage. Die Referenz warnt: Die Geschichte verhält sich dann, als wäre diese Passage die erste ([Twine Reference: Testing a Story](https://twinery.org/reference/en/publishing/testing.html#testing-a-story-from-a-specific-passage)). Variablen, die eine frühere Passage setzt, fehlen also. Testest du „Abend“ auf diese Weise, hat `$angenommen` den Wert 0, und `(if:)` zeigt eine Fehlermeldung, weil es nur Wahrheitswerte annimmt.

  > [!TIP] Startwerte in eine startup-Passage
  > Harlowe führt Passagen mit dem Tag `startup` beim Start immer zuerst aus. Das Handbuch empfiehlt, Variablen für die ganze Geschichte dort anzulegen, damit du von jeder Passage aus testen kannst ([Harlowe: startup tag](https://twine2.neocities.org/#passagetag_startup)).

  Spiel zum Schluss jeden Weg einmal von der Startpassage aus und schreib die Wege als Liste auf. Unter Story → Details zählt Twine Passagen, Links und kaputte Links ([Twine Reference: Story Statistics](https://twinery.org/reference/en/editing-stories/stats.html#viewing-story-statistics)).

  ## Später in der Engine: ink, Yarn Spinner, Dialogue Manager

  Für den Schritt in die Engine gibt es Werkzeuge mit demselben Denkmodell aus Abschnitten, Wahlen und Variablen. Die Skriptsprache ink von inkle liegt in Version 1.2.1 vor, der Editor Inky in 0.15.2, beide vom 5. Mai 2026 ([ink](https://www.inklestudios.com/ink/)). Yarn Spinner steht im Kern bei 3.2.2. Für Godot gibt es eine C#-Fassung (0.3.23), für die der Hersteller keinen offiziellen Support anbietet, und eine GDScript-Fassung im Early Access ([Yarn Spinner: Install](https://yarnspinner.dev/install/)). Dialogue Manager von Nathan Hoad ist ein Add-on für Godot 4.6 und neuer, aktuell v4.1.0 ([GitHub](https://github.com/nathanhoad/godot_dialogue_manager)). Die aktuelle Godot-Version ist 4.7.2. Ablauf und Variablen aus dem Prototyp nimmst du in jedes dieser Werkzeuge mit.

  ## Häufige Fehler

  - **Variable vergessen.** Eine Optionspassage setzt ihren Wert nicht. Im Debug-Panel fehlt die Variable nach dieser Wahl. Jede Optionspassage beginnt mit ihrem `(set:)`.
  - **Tippfehler im Variablennamen.** `$Brief` statt `$brief`: Die Abfrage vergleicht mit 0 und landet still im `(else:)`-Hook. Vergleich die Schreibweise mit dem Debug-Panel.
  - **Tippfehler im Link.** Twine legt eine leere Passage mit dem falschen Namen an. Halb durchsichtige Karten mit gepunktetem Rand im Story-Plan verraten ihn.
  - **Wert ohne eigenen Hook.** Eine Option setzt einen Wert, den keine Abfrage vorsieht, und der Spieler sieht den `(else:)`-Text, der zu seinem Weg nicht passt. Prüf für jeden Wert, welchen Hook er zeigt.
  - **Nur mit Test From Here getestet.** Werte aus früheren Passagen fehlen. Spiel jeden Weg einmal vom Start.

  > [!PRAXIS] Defensive Logik bei inkle
  > Jon Ingold von inkle zeigte auf der GDC 2017, wie das Studio für Sorcery! eine Geschichte schreibt, die Spieler in beliebiger Reihenfolge erleben und die trotzdem stimmig bleibt. Sein Stichwort dafür ist „defensive logic“ ([GDC Vault](https://gdcvault.com/play/1023989/Narrative-Sorcery-Coherent-Storytelling-in)). Übertragen auf deinen Prototyp: Eine Passage prüft den Zustand, statt sich darauf zu verlassen, auf welchem Weg der Spieler gekommen ist.

  ## Zusammenfassung

  - Erst das Ablaufdiagramm: Ausgangslage, Voraussetzungen, Optionen, unmittelbare und spätere Folge.
  - Browser-Twine speichert nur im Browser. Sichere nach jeder Sitzung mit Archive und Publish to File.
  - Links schreibst du als `[[Text->Passage]]`. Passagennamen unterscheiden Groß- und Kleinschreibung.
  - `(set: $name to …)` merkt die Wahl, `(if:)`, `(else-if:)` und `(else:)` fragen sie ab.
  - Nie gesetzte `$`-Variablen haben in Harlowe 3 den Wert 0. Tippfehler fallen deshalb nicht von selbst auf.
  - Spiel jeden Weg mit Build → Test vom Start aus und kontrolliere die Variablen im Debug-Panel.
exercises:
  - id: arbeitsschritte
    type: order
    title: Vom Diagramm zur Datei
    prompt: Bring die Arbeitsschritte für den Prototyp in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Ablaufdiagramm mit Voraussetzungen, Optionen und Folgen schreiben
      Neue Geschichte anlegen und unter Story → Details Harlowe prüfen
      Entscheidungspassage mit einem Link je Option schreiben
      In jeder Optionspassage die Variable mit (set:) setzen
      Spätere Passage schreiben, die die Variable mit (if:) abfragt
      Jeden Weg mit Build → Test von der Startpassage aus spielen
      Die geprüfte Fassung mit Archive und Publish to File sichern
    alternatives:
      - [1, 2, 3, 5, 4, 6, 7]
    hints:
      - Was du in Twine baust, folgt aus dem Diagramm.
      - Optionspassagen entstehen, sobald du die Links schreibst.
    explanation: |
      Das Diagramm kommt zuerst, weil es die Entscheidung festlegt, bevor die Arbeit mit Passagen beginnt. Die Links der Entscheidungspassage legen die Optionspassagen an, erst dann gibt es einen Ort für `(set:)`. Ob du zuerst die Variablen setzt oder zuerst die spätere Passage schreibst, ist gleich. Getestet wird vom Start aus, weil nur so alle Variablen gesetzt sind. Gesichert wird die geprüfte Fassung, denn diese Datei bekommen Testspieler.
    resources:
      - title: Twine Reference · Testing a Story
        url: https://twinery.org/reference/en/publishing/testing.html#testing-a-story-from-the-beginning
  - id: sicher-speichern
    type: choice
    title: Wenn der Browser aufräumt
    prompt: Du baust den Prototyp im Browser-Twine und hast Twine als Web-App installiert. Was schützt deine Arbeit, wenn du die Browserdaten löschst?
    options:
      - text: Regelmäßig mit Archive die Bibliothek und mit Publish to File die Geschichte als Datei speichern
        correct: true
        why: Beide Dateien liegen außerhalb des Browserspeichers. Das Archiv lässt sich wieder importieren, die HTML-Datei spielt jeder Browser.
      - text: Nichts weiter, denn Twine speichert jede Änderung automatisch
        correct: false
        why: Twine speichert automatisch, aber in den Speicher des Browsers. Genau der verschwindet beim Löschen.
      - text: Die Installation als Web-App, weil sie getrennt vom Browser speichert
        correct: false
        why: Die Twine-Referenz sagt ausdrücklich, dass auch Web-Apps ihre Daten verlieren, wenn du die Browserdaten löschst.
      - text: Ein Lesezeichen auf die Adresse, die Build → Play im Browser öffnet
        correct: false
        why: Diese Adresse funktioniert nur auf deinem Rechner und zeigt auf die Daten im Browser. Eine Sicherung ist sie nicht.
    hints:
      - Gesucht ist etwas, das außerhalb des Browsers liegt.
    explanation: |
      Browser-Twine speichert alles im lokalen Speicher von Browser und Profil, auch als installierte Web-App. Die Referenz nennt regelmäßige Sicherungen deshalb ein Muss. Archive sichert die ganze Bibliothek in einer Datei, Publish to File die einzelne Geschichte als spielbares HTML. Auf iOS kommt hinzu, dass Safari den Speicher einer Seite nach einer Woche ohne Besuch löscht, wenn Twine nicht auf dem Home-Bildschirm liegt.
    resources:
      - title: Twine Reference · Using a Web Browser
        url: https://twinery.org/reference/en/getting-started/installing.html#using-a-web-browser
      - title: Twine Reference · Archiving Your Library
        url: https://twinery.org/reference/en/story-library/exporting.html#archiving-your-library
  - id: abend-nach-rueckruf
    type: output
    title: Der dritte Wert
    prompt: |
      Der Spieler ignoriert den Anruf. Die Passage „Mailbox“ setzt `(set: $antwort to "ignoriert")`. Danach ruft er zurück, und die Passage „Rückruf“ setzt `(set: $antwort to "zurückgerufen")`. Dann erreicht er die Passage „Abend“.

      Welchen Text zeigt „Abend“? Gib nur diesen Text ein.
    lang: harlowe
    code: |
      (if: $antwort is "angenommen")[Den Namen hast du heute schon einmal gehört.]
      (else-if: $antwort is "ignoriert")[Du denkst an den Anruf von heute Mittag.]
      (else:)[Der Name sagt dir nichts.]
    expected: Der Name sagt dir nichts.
    accept: ["Der Name sagt dir nichts"]
    hints:
      - Welchen Wert hat `$antwort`, wenn der Spieler „Abend“ erreicht?
      - Der letzte `(set:)` gewinnt. Passt dieser Wert zu einer der beiden Bedingungen?
    explanation: |
      `$antwort` hat zuletzt den Wert `"zurückgerufen"`. Weder `(if:)` noch `(else-if:)` prüfen auf diesen Wert, also zeigt `(else:)` seinen Hook: „Der Name sagt dir nichts.“ Inhaltlich ist das falsch, denn wer zurückgerufen hat, kennt den Namen. Harlowe meldet hier keinen Fehler, weil `(else:)` jeden Wert auffängt, den du nicht vorgesehen hast. Prüf deshalb für jeden Wert, den eine Option setzen kann, welchen Hook er zeigt.
    resources:
      - title: Harlowe-Handbuch · (else-if:)
        url: https://twine2.neocities.org/#macro_else-if
  - id: brief-mit-link
    type: gap
    title: Merken und weiterführen
    prompt: |
      Lehrbeispiel: Der Spieler hat einen Brief geöffnet. Die Passage soll sich das merken und zwei Links anbieten. Ergänze:

      1. Setze die Variable `$briefGelesen` auf `true`.
      2. Schreib einen Link mit dem Text „Antworten“ zur Passage „Antwort“.
    lang: harlowe
    code: |
      ⟦(set: $briefGelesen to true)⟧
      Im Umschlag liegt eine Einladung, unterschrieben mit „Weber“.
      ⟦[[Antworten->Antwort]]⟧
      [[Brief weglegen->Nacht]]
    gaps:
      - label: Variable setzen
        hint: "Makro `(set:)`, dann die Variable, `to` und der Wert. Makronamen klein schreiben."
        accept: ["(put: true into $briefGelesen)"]
      - label: Link
        hint: Linktext vor dem Pfeil `->`, Passagenname dahinter, alles in doppelten eckigen Klammern.
        accept: ["[[Antwort<-Antworten]]", "(link-goto: \"Antworten\", \"Antwort\")", "(link-goto: 'Antworten', 'Antwort')"]
    explanation: |
      `(set: $briefGelesen to true)` legt eine Variable an, die über Passagen hinweg gilt, weil sie mit `$` beginnt. Der Link `[[Antworten->Antwort]]` zeigt „Antworten“ und führt zur Passage „Antwort“; die umgekehrte Schreibweise `[[Antwort<-Antworten]]` wirkt genauso, ebenso `(link-goto: "Antworten", "Antwort")`. Statt `(set:)` geht auch `(put: true into $briefGelesen)`. Der Passagenname muss auch in der Groß- und Kleinschreibung stimmen, sonst legt Twine eine neue, leere Passage an.
    resources:
      - title: Harlowe-Handbuch · Link markup
        url: https://twine2.neocities.org/#markup_link
      - title: Harlowe-Handbuch · (set:)
        url: https://twine2.neocities.org/#macro_set
  - id: ankunft-mit-if
    type: gap
    title: Wer wartet am Bahnsteig?
    prompt: |
      Lehrbeispiel: `$zugVerpasst` ist `true`, wenn der Spieler den früheren Zug verpasst hat, sonst `false`. Ergänze die beiden Makros: Der erste Hook soll nur erscheinen, wenn `$zugVerpasst` wahr ist, der zweite in allen anderen Fällen.
    lang: harlowe
    code: |
      Der Zug hält. Du steigst aus.
      ⟦(if: $zugVerpasst)⟧[Auf dem Bahnsteig wartet niemand mehr.]⟦(else:)⟧[Deine Schwester winkt dir zu.]
    gaps:
      - label: Bedingung
        hint: Ein Makro, das den Hook nur zeigt, wenn der Wert wahr ist.
        accept: ["(if: $zugVerpasst is true)"]
      - label: Gegenstück
        hint: Ein Makro ohne Bedingung, das zeigt, wenn der vorige Hook verborgen blieb.
        accept: ["(unless: $zugVerpasst)", "(else-if: not $zugVerpasst)", "(if: not $zugVerpasst)", "(if: $zugVerpasst is false)", "(else-if: $zugVerpasst is false)"]
    explanation: |
      `(if: $zugVerpasst)` zeigt den ersten Hook nur, wenn die Variable `true` enthält. `(else:)` zeigt den zweiten, wenn der vorige verborgen blieb. Das Handbuch schreibt `(else: )` mit Leerzeichen, das Cookbook `(else:)`; beides ist gültig. `(unless: $zugVerpasst)` oder `(if: not $zugVerpasst)` funktionieren hier ebenfalls, weil die Variable nur `true` oder `false` enthält. `(else:)` hat den Vorteil, dass er jeden anderen Fall auffängt.
    resources:
      - title: Harlowe-Handbuch · (if:)
        url: https://twine2.neocities.org/#macro_if
      - title: Harlowe-Handbuch · (else:)
        url: https://twine2.neocities.org/#macro_else
  - id: brief-gross-geschrieben
    type: bug
    title: Offen und trotzdem zu
    prompt: |
      Lehrbeispiel: Die Passagen „Öffnen“ und „Liegen lassen“ setzen `(set: $brief to "offen")` beziehungsweise `(set: $brief to "zu")` und führen beide zur Passage „Abend“.

      Beim Testen nach „Öffnen“ zeigt „Abend“ in der zweiten Zeile korrekt „Der Brief ist offen.“, darunter aber „Du hältst ihn gegen das Licht.“ statt „Du faltest ihn zusammen.“ Harlowe meldet keinen Fehler. Finde die Zeile mit dem Tippfehler im Variablennamen und korrigiere sie.
    lang: harlowe
    code: |
      Am Abend sitzt du am Küchentisch.
      Der Brief ist $brief.
      (if: $Brief is "offen")[Du faltest ihn zusammen.]
      (else:)[Du hältst ihn gegen das Licht.]
      [[Schlafen gehen->Nacht]]
    lines: [3]
    fix:
      - line: 3
        answers: ["(if: $brief is \"offen\")[Du faltest ihn zusammen.]", "(if: $brief is 'offen')[Du faltest ihn zusammen.]"]
    hints:
      - Zeile 2 zeigt den richtigen Wert. Die Variable ist also gesetzt.
      - Vergleich die Schreibweise der Variable in Zeile 2 und Zeile 3 Buchstabe für Buchstabe.
    explanation: |
      Variablennamen unterscheiden in Harlowe Groß- und Kleinschreibung. `$Brief` in Zeile 3 ist eine andere Variable als `$brief`, und sie wurde nie gesetzt. Harlowe 3 gibt ihr deshalb den Wert 0, `0 is "offen"` ist falsch, und `(else:)` zeigt seinen Hook. Eine Fehlermeldung gibt es nicht, weil der Vergleich mit `is` gültig ist. Die Tabelle unter Variables im Debug-Panel listet nur `$brief`, eine Variable `$Brief` gibt es dort nicht. Daran erkennst du den Tippfehler.
    resources:
      - title: Harlowe-Handbuch · Variable markup
        url: https://twine2.neocities.org/#markup_variable
  - id: abend-als-engpass
    type: explain
    title: Eine Passage für zwei Wege
    prompt: |
      Die Passagen „Gespräch“ und „Mailbox“ setzen `$angenommen` auf `true` beziehungsweise `false` und führen beide mit `[[Weiter->Abend]]` hierher. Erkläre in drei bis fünf Sätzen, welche Rolle die Passage „Abend“ im Ablauf spielt und was du dir mit der Variable gegenüber zwei getrennten Abend-Passagen sparst.
    lang: harlowe
    code: |
      Am Abend liegt ein Brief im Kasten, adressiert an einen Herrn Weber.
      (if: $angenommen)[Den Namen hast du heute schon einmal gehört.](else:)[Der Name sagt dir nichts.]
      [[Brief öffnen->Nacht]]
    points:
      - „Abend“ ist ein Engpass, an dem beide Wege zusammenlaufen.
      - Die Variable trägt die Wahl über den Engpass hinaus; ohne sie wäre die Wahl hier vergessen.
      - Der gemeinsame Text und der Link stehen nur einmal da, nur ein Satz hängt vom Wert ab.
      - Mit zwei getrennten Abend-Passagen müsstest du jede spätere Passage ebenfalls doppelt schreiben.
      - "`(if:)` prüft beim Anzeigen der Passage, der Wert muss also vorher gesetzt sein."
    hints:
      - Denk an das Muster Branch and Bottleneck aus dem Modul Verzweigungen.
    explanation: |
      „Abend“ ist ein Engpass im Sinne von Branch and Bottleneck: Beide Wege laufen hier wieder zusammen, und ab hier gibt es nur noch eine Fassung der Geschichte. Die Variable `$angenommen` sorgt dafür, dass die Wahl trotzdem nicht verloren geht. Ein einziger Satz hängt von ihr ab und nimmt den Namen aus dem Anruf als Rückbezug wieder auf. Der übrige Text, der Brief und der Link, steht nur einmal da. Ohne Variable bräuchtest du zwei Abend-Passagen, und jede Passage danach müsstest du wieder doppelt anlegen. Weil `(if:)` nur einmal beim Anzeigen prüft, muss die Optionspassage den Wert vorher gesetzt haben.
    resources:
      - title: Harlowe-Handbuch · (if:)
        url: https://twine2.neocities.org/#macro_if
  - id: ablaufdiagramm-eigene-entscheidung
    type: practice
    title: Die Entscheidung auf einer Seite
    prompt: |
      Wähle eine Entscheidung aus deinem eigenen Projekt. Beschreibe sie als Ablauf mit den fünf Teilen aus der Lektion. Stichpunkte reichen. Schreib so genau, dass jemand anderes daraus Passagen bauen könnte.

      Schreib in einem eigenen Editor, wenn du mehr Platz brauchst, und füge das Ergebnis hier ein.
    lang: prose
    starter: |
      Entscheidung (ein Satz):
      Ausgangslage:
      Was der Spieler vorher wissen muss, und wo er es erfährt:
      Was der Spieler vorher haben oder getan haben muss:
      Option 1 und Wert der Variable:
      Option 2 und Wert der Variable:
      Unmittelbare Folge von Option 1:
      Unmittelbare Folge von Option 2:
      Variable (Name und mögliche Werte):
      Spätere Folge (Passage und was sich je nach Wert ändert):
    checklist:
      - Jedes Feld der Vorlage ist ausgefüllt.
      - Jede Voraussetzung nennt die Passage oder Szene, in der der Spieler sie erfährt.
      - Jede Option hinterlässt in derselben Variable einen eigenen Wert.
      - Die spätere Folge liegt in einer Passage, die erst nach den unmittelbaren Folgen kommt.
      - Der Variablenname ist so geschrieben, wie du ihn in Twine verwenden wirst, mit `$` und ohne Leerzeichen.
    explanation: |
      Das Diagramm trennt die Entscheidung von ihrer Umsetzung. Die Voraussetzungen prüfst du später im Testlauf: Weiß der Spieler an dieser Stelle, was du hier notiert hast? Die Variable mit ihren Werten ist die Brücke zwischen Wahl und späterer Folge. Legst du Namen und Werte jetzt fest, vermeidest du Tippfehler beim Bauen.
    resources:
      - title: Twine Cookbook · Story Variables
        url: https://twinery.org/cookbook/terms/terms_variables.html#story-variables-harlowe-and-sugarcube
  - id: prototyp-bauen
    type: practice
    title: Klickbar machen
    prompt: |
      Bau dein Ablaufdiagramm in Twine nach. Halte dich an die Syntax aus der Lektion: Links mit `->`, `(set:)` in jeder Optionspassage, `(if:)` und `(else:)` in der späteren Passage.

      Schreib hier anschließend auf, was du gebaut hast: jede Passage mit Namen, ihren Links und den Variablen, die sie setzt oder abfragt. Eine Musterlösung gibt es nicht, die Checkliste prüft den Aufbau.
    lang: prose
    starter: |
      Startpassage:
      Passagen (Name, Links nach, setzt, fragt ab):
      -
      -
      -
      Variablen:
    checklist:
      - Unter Story → Details steht Harlowe 3.3.9 als Story-Format.
      - Die Entscheidungspassage hat mindestens zwei Links, jeder zu einer eigenen Optionspassage.
      - Jede Optionspassage setzt dieselbe Variable mit `(set:)` auf einen eigenen Wert.
      - Eine Passage, die erst nach den Optionspassagen kommt, fragt die Variable mit `(if:)` ab und hat einen `(else:)`-Hook.
      - Story → Details meldet keinen kaputten Link, und im Story-Plan gibt es keine leere Passage.
    explanation: |
      Der Prototyp soll eine Frage beantworten: Versteht ein Spieler die Entscheidung und bemerkt er die Folge? Dafür reichen wenige Passagen. Die Beschreibung hier hilft dir beim Durchspielen, weil du jeden Weg mit deiner Liste vergleichen kannst.
    resources:
      - title: Twine Reference · Linking Passages
        url: https://twinery.org/reference/en/editing-stories/linking-passages.html#linking-passages
      - title: Twine Reference · Story Statistics
        url: https://twinery.org/reference/en/editing-stories/stats.html#viewing-story-statistics
  - id: alle-wege-spielen
    type: practice
    title: Jeder Weg, einmal
    prompt: |
      Spiel deinen Prototyp mit Build → Test von der Startpassage aus, einmal für jede Kombination von Wahlen. Schreib jeden Weg als Folge von Passagennamen auf. Notiere dazu, welchen Wert die Variable am Ende hat (Debug-Panel unten rechts, Knopf Variables) und welchen Satz die spätere Passage zeigt.
    lang: prose
    starter: |
      Weg 1:
      Wert am Ende:
      Satz in der späteren Passage:

      Weg 2:
      Wert am Ende:
      Satz in der späteren Passage:
    checklist:
      - Die Liste enthält so viele Wege, wie dein Ablaufdiagramm Kombinationen von Wahlen hat.
      - Jeden Weg hast du von der Startpassage aus gespielt, nicht mit Test From Here.
      - Zu jedem Weg stehen der Wert aus dem Debug-Panel und der Satz, den die spätere Passage zeigt.
      - Jeder Weg zeigt den Satz, den dein Ablaufdiagramm für seinen Wert vorsieht. Abweichungen hast du behoben und den Weg danach neu gespielt.
    explanation: |
      Beim Durchspielen findest du die stillen Fehler: falsch geschriebene Variablen, die den Wert 0 haben, Werte ohne eigenen Hook, Links zu leeren Passagen. Die Liste der Wege ist zugleich deine Grundlage für den Testlauf, denn du siehst dort, welche Wege Testspieler nehmen können.
    resources:
      - title: Harlowe-Handbuch · Debug Mode
        url: https://twine2.neocities.org/#interface_debug-mode
  - id: prototyp-sichern
    type: practice
    title: Raus aus dem Browser
    prompt: |
      Sichere den geprüften Prototyp außerhalb des Browsers. Notiere, wo die Dateien liegen und wie sie heißen.
    lang: prose
    starter: |
      Archiv (Library → Archive), Dateiname und Ort:
      HTML-Datei (Build → Publish to File), Dateiname und Ort:
      Zweiter Speicherort:
    checklist:
      - Im Reiter Library hast du mit Archive ein Archiv aller Geschichten gespeichert.
      - Mit Build → Publish to File hast du den Prototyp als HTML-Datei gespeichert.
      - Du hast die HTML-Datei in einem Browser geöffnet und einen Weg bis zum Ende gespielt.
      - Beide Dateien liegen zusätzlich an einem zweiten Ort außerhalb dieses Rechners.
    explanation: |
      Das Archiv sichert die ganze Bibliothek und lässt sich in jedes Twine importieren. Die HTML-Datei ist die spielbare Fassung für Testspieler; sie läuft in jedem Browser, ohne dass jemand Twine installieren muss. Der zweite Speicherort schützt vor dem Verlust des Rechners. Wer Git nutzt, kann zusätzlich eine Twee-Datei einchecken, die sich als Text vergleichen lässt.
    resources:
      - title: Twine Reference · Archiving and Exporting Stories
        url: https://twinery.org/reference/en/story-library/exporting.html#archiving-your-library
  - id: bewusst-weggelassen
    type: practice
    title: Was fehlt, und warum
    prompt: |
      Ein Prototyp lässt absichtlich vieles weg. Schreib eine Notiz von 300 bis 500 Wörtern für dich und deine Testspieler: Welche Frage soll dein Prototyp beantworten, und was fehlt mit Absicht? Die Notiz begleitet den Prototyp in den Testlauf ([Testlesen und Playtest](/narrative/testlesen-playtest)).
    lang: prose
    starter: |
      Frage, die der Prototyp beantworten soll:

      Was fehlt absichtlich, und warum es für diese Frage nicht nötig ist:
      -
      -
      -

      Was Testspieler vorher wissen müssen, weil der Prototyp es nicht zeigt:
    checklist:
      - Die Notiz nennt genau eine Frage, die ein Testlauf beantworten kann.
      - Mindestens drei fehlende Teile stehen da, jeder mit einem Satz, warum der Prototyp ihn für diese Frage nicht braucht.
      - Die Notiz trennt, was Testspieler vorab erfahren, von dem, was sie im Prototyp selbst herausfinden sollen.
      - Die Notiz verrät nicht, welche Folge welche Option hat.
    explanation: |
      Ohne diese Notiz verwechseln Testspieler Lücken mit Fehlern und kommentieren das Fehlende statt der Entscheidung. Eine einzige Frage hält den Testlauf eng: Du beobachtest, ob die Entscheidung verständlich ist, nicht, ob das ganze Spiel gefällt. Die Folgen gehören nicht in die Notiz, weil du sonst nicht mehr beobachten kannst, was Spieler erwarten.
    resources:
      - title: Twine Reference · Publishing a Story
        url: https://twinery.org/reference/en/publishing/publishing.html
