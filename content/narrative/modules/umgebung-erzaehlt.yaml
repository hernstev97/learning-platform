id: umgebung-erzaehlt
title: Erzählen über Handlung, Umgebung und Folgen
level: 2
minutes: 80
summary: Räume, Gegenstände und Taten erzählen, ohne zu erklären – du lernst, wann du zeigst und wann du raffst, wie Spieler aus Spuren auf Geschehenes schließen und wie eine Welt die Folgen von Entscheidungen sichtbar macht.
place: unterwegs
goals:
  - Du entscheidest begründet, wann du eine Szene zeigst und wann du Zeit raffst, im Text wie im Raum.
  - Du erklärst Environmental Storytelling nach Don Carson sowie Harvey Smith und Matthias Worch und ordnest Räume den vier Arten von Henry Jenkins zu.
  - Du liest Spuren in einem Raum und prüfst, ob sie zusammenpassen, eine Rangfolge haben und etwas bedeuten.
  - Du erkennst, wie Gegenstände und Spuren von Taten eine Figur zeigen, die nicht im Raum ist.
  - Du unterscheidest eine Folge, die die Welt zeigt, von einer Folge, die nur angekündigt wird.
resources:
  - title: Henry Jenkins, „Game Design as Narrative Architecture“ (2004, Volltext)
    url: https://web.mit.edu/~21fms/People/henry3/games&narrative.html
  - title: Don Carson, „Environmental Storytelling“ (2000, Game Developer)
    url: https://www.gamedeveloper.com/design/environmental-storytelling-creating-immersive-3d-worlds-using-lessons-learned-from-the-theme-park-industry
  - title: Harvey Smith, Matthias Worch, „What Happened Here? Environmental Storytelling“ (GDC 2010)
    url: https://gdcvault.com/play/1012647/What-Happened-Here-Environmental
  - title: Giant Sparrow, „What Remains of Edith Finch“ (offizielle Seite)
    url: https://www.giantsparrow.com/games/finch/
  - title: Lewis Shiner, Bruce Sterling, „Turkey City Lexicon“, Eintrag „Show, not Tell“ (SFWA)
    url: https://www.sfwa.org/2009/06/turkey-city-lexicon-a-primer-for-sf-workshops/
lesson: |
  Gone Home (The Fullbright Company, 2013) beginnt am 7. Juni 1995 um 1:15 Uhr nachts. Katie kommt nach einem Jahr im Ausland nach Hause und erwartet ihre Familie, aber das Haus ist leer. An der Tür hängt eine Nachricht ihrer Schwester Sam, die Katie bittet, nicht nachzuforschen, was passiert ist ([gonehome.com](https://gonehome.com/), [Wikipedia](https://en.wikipedia.org/wiki/Gone_Home)). Niemand erzählt dir die Geschichte. Du öffnest Schubladen und Türen, hebst Dinge auf und setzt sie selbst zusammen.

  Jeder Raum mit Spuren stellt dieselbe Frage: Was ist hier passiert? Dieses Modul zeigt, wie Umgebung, Handlung und Folgen erzählen, wann Zeigen mehr leistet als Erzählen und wann eine knappe Zusammenfassung besser ist.

  ## Zeigen und Erzählen: wann Raffung besser ist

  „Show, don't tell“ heißt: Zeig dem Leser, was geschieht, statt ihm zu sagen, was er davon halten soll. Das „Turkey City Lexicon“, ein Glossar für Schreibwerkstätten, begründet die Regel so: „The reader should be allowed to react naturally to the evidence presented in the story, not instructed in how to react by the author.“ Im selben Eintrag steht ihre Grenze: „Rigid adherence to show-don’t-tell can become absurd. Minor matters are sometimes best gotten out of the way in a swift, straightforward fashion.“ ([SFWA](https://www.sfwa.org/2009/06/turkey-city-lexicon-a-primer-for-sf-workshops/))

  Raffung heißt, viel Zeit in wenigen Sätzen zusammenzufassen. Wie Hebel in „Unverhofftes Wiedersehen“ fünfzig Jahre so erzählt und das Wiedersehen danach als Szene, zeigt das Modul [Konflikt und Szenenaufbau](/narrative/szenenaufbau). Für Räume im Spiel gilt dieselbe Abwägung. Was der Spieler selbst erschließen soll, legst du als Spur in den Raum. Was er nur wissen muss, damit die Szene funktioniert, darf ein Satz erledigen, eine Texttafel oder eine Zeile Dialog.

  > [!MERKE] Zeigen oder raffen
  > Zeig, was der Leser selbst erschließen soll. Raffe, was nur vergehen oder bekannt sein muss.

  ## Environmental Storytelling: Räume, die erzählen

  Im Spiel geht der Spieler selbst durch den Raum, und der Raum kann erzählen. Don Carson hat im Jahr 2000 für Spieleentwickler beschrieben, was er aus der Gestaltung von Themenparks gelernt hatte. Als Geheimnis dieser Branche nennt er, dass „the story element is infused into the physical space a guest walks or rides through“ ([Game Developer](https://www.gamedeveloper.com/design/environmental-storytelling-creating-immersive-3d-worlds-using-lessons-learned-from-the-theme-park-industry)). Sein Artikel trägt den Begriff im Titel, Environmental Storytelling, also Erzählen über die Umgebung.

  Ein Werkzeug dafür nennt Carson „cause and effect“-Vignetten, „staged areas that lead the game player to come to their own conclusions about a previous event“. Seine Beispiele sind aufgebrochene Türen, die Spuren einer Explosion oder ein verunglücktes Fahrzeug. Der Spieler sieht die Wirkung und schließt auf die Ursache.

  Harvey Smith (Arkane Studios) und Matthias Worch (LucasArts) haben das Thema 2010 auf der Game Developers Conference (GDC) unter dem Titel „What Happened Here?“ behandelt. Ihr Vortrag stellt die Umgebung gegen die klassische Exposition, denn der Spieler holt sich die Information selbst. Ziel sind „game spaces that invite the player's mind to piece together implied events“ ([GDC Vault](https://gdcvault.com/play/1012647/What-Happened-Here-Environmental)). Als Werkzeuge nennen sie Requisiten, geskriptete Ereignisse, Texturen, Licht und Bildaufbau, dazu Spielsysteme, mit denen die Umgebung auf den Spieler reagiert. Der Spieler wird so nach ihren Worten „an active participant in narrative“.

  > [!NOTE] Bedeutung, nicht Wegführung
  > Carson behandelt auch Orientierung („Where am I?“) und Details, die den Spieler in den nächsten Raum ziehen. Das gehört zum Level-Design, siehe [Wege, Landmarken und Sichtlinien](/level-design/orientierung) und [Umgebung als Information](/level-design/umgebung-informiert). Hier geht es darum, was ein Raum bedeutet.

  ## Vier Arten nach Henry Jenkins

  Henry Jenkins unterscheidet in „Game Design as Narrative Architecture“ (2004) vier Wege, auf denen Räume eine Geschichte vorbereiten ([Volltext](https://web.mit.edu/~21fms/People/henry3/games&narrative.html)). Die Namen sind seine Abschnittsüberschriften:

  - **Evocative Spaces** rufen Geschichten auf, die du schon kennst. Jenkins' Beispiel ist American McGee's Alice.
  - **Enacting Stories** machen den Raum zur Bühne für Ereignisse, die du spielst, etwa in einem Star-Wars-Spiel.
  - **Embedded Narratives** bergen eine fertige Geschichte in der Ausstattung, wie in Myst.
  - **Emergent Narratives** liefern Stoff für Geschichten, die erst beim Spielen entstehen, wie in The Sims.

  Spuren im Raum gehören zur dritten Art. Jenkins erklärt sie mit dem Detektivroman, der zwei Geschichten erzählt: die Ermittlung, ungefähr in zeitlicher Folge, und das Verbrechen, „radically out of sequence“. Im Spiel spielst du die erste und setzt die zweite aus Fundstücken zusammen. Der Raum wird dabei zu „a memory palace“.

  Jenkins benennt auch ein Problem. Spieler übersehen Dinge. Er vergleicht das mit Seifenopern im Fernsehen, die einkalkulieren, dass Zuschauer Folgen verpassen, und mit einer Regel des klassischen Hollywood-Kinos, jeden wichtigen Handlungspunkt auf mindestens drei Wegen zu vermitteln. Sein Schluss ist, man solle Spieleentwickler „less as storytellers than as narrative architects“ sehen.

  ## Gegenstände und Taten: was Figuren hinterlassen

  In einem Raum ohne Menschen sind Figuren über das anwesend, was sie getan und zurückgelassen haben. Ein Zimmer zeigt seine Bewohner durch Auswahl, durch das, was sie aufhängen, aufheben, verstecken oder liegen lassen. Jenkins nennt dafür das Melodram als Vorbild. Man liest „letters and diaries“ und stöbert „in bedroom drawers and closets, in search of secrets which might shed light on the relationships between characters“.

  What Remains of Edith Finch (Giant Sparrow, 2017) baut darauf ein ganzes Spiel. Edith erkundet das Haus ihrer Familie. Die Zimmer verstorbener Familienmitglieder sind seit deren Tod unverändert erhalten, und Gegenstände darin öffnen je eine kurze spielbare Geschichte darüber, wie die Person starb ([Wikipedia](https://en.wikipedia.org/wiki/What_Remains_of_Edith_Finch)).

  Laut Entwicklungsgeschichte merkte das Team erst beim vorletzten Zimmer, wie viel die Einrichtung über eine Figur sagen kann. Lewis' Zimmer war voller Poster und anderer Dinge, die auf seinen Drogenkonsum hindeuteten, und das erzählte viel über ihn, ohne Erzählstimme. In den letzten Monaten vor der Veröffentlichung überarbeitete das Team deshalb alle früheren Zimmer.

  Ein Gegenstand bekommt zusätzliches Gewicht, wenn der Spieler seine Herkunft kennt. Ein Lehrbeispiel: In der ersten Szene hängen an der Garderobe einer Wohngemeinschaft vier Schlüssel, einer davon mit rotem Anhänger. In der letzten Szene hängen dort drei. Es braucht keinen Satz, um zu sagen, dass jemand fehlt.

  So funktioniert ein Gegenstand mit Geschichte. Er taucht auf, bekommt eine Bedeutung und kehrt zurück, wenn sie zählt. Tschechow hat die Kehrseite beschrieben: Man dürfe kein geladenes Gewehr auf die Bühne stellen, wenn niemand vorhabe, damit zu schießen (Brief an A. S. Lazarev, 1. November 1889, [Akademie-Ausgabe](https://chehov-lit.ru/chehov/letters/1888-1889/letter-707.htm)). Ein Gegenstand, den der Text hervorhebt, verspricht eine Folge.

  ## Folgen zeigen: Die Welt antwortet

  Im Spiel kommt eine Quelle von Spuren hinzu, die ein gedruckter Text nicht hat, nämlich das, was der Spieler selbst getan hat. Carson schreibt, dass „cause and effect“-Elemente auch vergangene Zeit zeigen können. Eine Figur kehrt an einen bekannten Ort zurück und findet ihn verändert, und die Veränderung kann direkt von den Handlungen des Spielers ausgelöst sein. Smith und Worch sprechen von Spielsystemen, die „the player's agency“ spiegeln.

  Shadow of the Colossus (Team Ico, 2005) zeigt Folgen am Körper der Spielerfigur. Mit jedem getöteten Koloss verfällt Wander sichtbar ([Wikipedia](https://en.wikipedia.org/wiki/Shadow_of_the_Colossus)). Die Folge der Kämpfe steht nicht in einer Textbox, man sieht sie an der Figur, Kampf für Kampf.

  Den Gegenpol bildet eine Einblendung in Telltales The Walking Dead (2012). Nach bestimmten Antworten teilt eine kurze Meldung mit, dass sich eine Figur an die Wahl „erinnern“ wird ([The Encyclopedia of Science Fiction](https://sf-encyclopedia.com/entry/walking_dead_the_game)). Die Meldung bestätigt, dass die Wahl zählt, und kündigt eine Folge an. Erleben kann der Spieler die Folge erst, wenn sich die Welt oder eine Figur anders verhält. Beides hat seinen Platz.

  Wie Folgen mit Belohnungen zusammenspielen, behandelt [Erzählerische Folgen und mechanische Anreize](/narrative/folgen-anreize). Was jede Folge an Text und Arbeit kostet, zeigt [Verzweigungen begrenzen, Folgen erlebbar machen](/narrative/verzweigungen).

  ## Häufige Fehler

  - **Notizen und Tagebücher erklären alles.** Ein Fundstück fasst zusammen, was der Raum schon zeigt, oder erklärt Gefühle. Lass ein Dokument lieber eine Frage öffnen. Sams Nachricht in Gone Home bittet darum, nicht nachzuforschen, und stellt damit die Frage, der der Spieler folgt.
  - **Spuren widersprechen sich ohne Absicht.** Eine Tageszeitung von heute liegt in einem Haus, das seit Jahren verlassen sein soll. Carson warnt, dass Besucher sich betrogen fühlen, wenn eine Welt ihre eigenen Regeln bricht („your visitors will feel cheated“). Leg vorher in einem Satz fest, was passiert ist, und prüf jede Spur dagegen.
  - **Zu viele Spuren, keine Rangfolge.** Alles ist gleich laut, nichts fällt auf. Carson zitiert das Motto „Less Is More“ und rät, schmuckvolle Details für die Stellen aufzuheben, zu denen der Blick gehen soll. Entscheide, welche Spur zuerst auffällt. Der Rest belohnt das Suchen.
  - **Gefühle benannt statt gezeigt.** „Das Zimmer wirkte einsam.“ Ersetze das Gefühlswort durch den Gegenstand oder Zustand, der das Gefühl auslöst.
  - **Spuren ohne Bedeutung.** Ein Detail steht da, weil es gut aussieht. Carson nennt es eine vergebene Gelegenheit, ein Element nur einzubauen, weil es „cool“ ist. Frag bei jeder Spur, was der Spieler daraus schließen soll.

  > [!TIP] Frag, was hier passiert ist
  > Zeig einen Raum oder eine Raumbeschreibung jemandem, der die Geschichte nicht kennt, und frag nur: „Was ist hier passiert?“ Stimmt die Antwort mit deinem Satz überein, tragen die Spuren. Wie du solche Tests führst, ohne zu helfen, zeigt [Testlesen und Playtest: Verständlichkeit beobachten](/narrative/testlesen-playtest).

  > [!PRAXIS] Wie Fullbright Gone Home gebaut hat
  > Fullbright hielt Gone Home bewusst klein, mit „no other people, no other characters, [just] you in a single environment“. Dass die Familie gerade erst eingezogen ist, hat einen Grund. Steve Gaynor fürchtete, dass Spieler in einem lange bewohnten Haus die wichtigen Dinge zwischen allen anderen nicht erkennen, und nach einem Umzug ist nur ausgepackt, was gerade gebraucht wird. Weil nicht jeder Spieler jede Spur findet, musste die Geschichte außerdem auch ohne alle Fundstücke verständlich bleiben ([Wikipedia: Gone Home](https://en.wikipedia.org/wiki/Gone_Home)).

  ## Zusammenfassung

  - Zeig, was der Leser selbst erschließen soll, und raffe, was nur vergehen muss. Ein Satz kann Jahre erledigen, ein veränderter Raum kann sie zeigen.
  - Bei Environmental Storytelling erzählt die Umgebung. Der Spieler schließt aus Wirkungen auf Ursachen.
  - Jenkins unterscheidet Evocative Spaces, Enacting Stories, Embedded Narratives und Emergent Narratives. Spuren im Raum sind Embedded Narratives.
  - Spieler übersehen Dinge. Wichtiges braucht mehr als eine Spur.
  - Gegenstände und Spuren von Taten zeigen Figuren, die nicht im Raum sind. Ein hervorgehobener Gegenstand verspricht eine Folge.
  - Folgen werden erlebbar, wenn sich Ort, Figur oder Reaktionen sichtbar ändern. Eine Einblendung kündigt sie nur an.
  - Prüf Spuren auf Widersprüche, Rangfolge und Bedeutung.
exercises:
  - id: jenkins-einordnen
    type: choice
    title: Ein Büro ohne Menschen
    prompt: |
      Lehrbeispiel: Du betrittst in einem Spiel ein Büro. Auf dem Schreibtisch liegt ein angebissenes Brot, der Bildschirm zeigt einen halb geschriebenen Brief, die Jacke hängt noch über dem Stuhl. Welcher von Jenkins' vier Arten entspricht dieser Raum?
    options:
      - text: Embedded Narratives
        correct: true
        why: Eine Geschichte steckt in der Ausstattung des Raums und wartet darauf, dass du sie aus Fundstücken zusammensetzt.
      - text: Evocative Spaces
        correct: false
        why: Ein Evocative Space ruft eine Geschichte oder ein Genre auf, das du schon kennst, etwa Alice im Wunderland. Hier gibt es keine bekannte Vorlage.
      - text: Enacting Stories
        correct: false
        why: Dabei spielst du Ereignisse selbst oder siehst sie geschehen. Hier ist das Ereignis schon vorbei.
      - text: Emergent Narratives
        correct: false
        why: Emergente Geschichten entstehen erst beim Spielen aus dem System, wie in The Sims. Diese Spuren hat jemand absichtlich gelegt.
    explanation: |
      Der Raum erzählt eine Geschichte, die schon passiert ist: Jemand hat das Büro plötzlich verlassen, mitten in einem Brief und ohne Jacke. Jenkins nennt das Embedded Narrative und vergleicht es mit dem Detektivroman, in dem die Geschichte des Verbrechens aus Spuren rekonstruiert wird. Du spielst die Ermittlung, der Raum enthält die Tat.
    hints:
      - Ist das Ereignis schon vorbei, oder geschieht es gerade?
    resources:
      - title: Henry Jenkins, „Game Design as Narrative Architecture“
        url: https://web.mit.edu/~21fms/People/henry3/games&narrative.html

  - id: drei-jahre-raffen
    type: choice
    title: Drei Jahre zwischen zwei Kapiteln
    prompt: |
      Lehrbeispiel: Zwischen zwei Kapiteln eines Spiels vergehen drei Jahre. Die Spielerfigur arbeitet in dieser Zeit in einer Fahrradwerkstatt und wird besser in ihrem Handwerk, sonst ändert sich für die Geschichte nichts. Welche Lösungen passen?
    options:
      - text: Eine kurze Texttafel rafft die drei Jahre, danach geht es mit einer Szene weiter.
        correct: true
        why: In diesen Jahren ändert sich für die Geschichte nichts. Ein Satz reicht, damit der Spieler weiß, dass Zeit vergangen ist.
      - text: "Die Werkstatt sieht im neuen Kapitel anders aus: neue Werkzeuge an der Wand, eine abgenutzte Werkbank, ein Kalender mit einer neuen Jahreszahl."
        correct: true
        why: Der Raum zeigt die vergangene Zeit, und der Spieler schließt selbst darauf. Carson nennt genau das als Möglichkeit von „cause and effect“-Elementen.
      - text: Die drei Jahre werden als Reihe spielbarer Szenen erzählt, eine für jeden Monat.
        correct: false
        why: Das kostet viel Arbeit für Zeit, in der sich nichts ändert, und der Spieler spielt Wiederholung.
      - text: Im neuen Kapitel erzählen sich zwei Kollegen ausführlich, was sie beide in den drei Jahren erlebt haben.
        correct: false
        why: Beide wissen das schon. Sie erzählen es nur für den Spieler, und das ist „As you know, Bob“.
    explanation: |
      Das „Turkey City Lexicon“ nennt die Grenze von „Show, not Tell“: Nebensächliches darf schnell erzählt werden. Drei Jahre, in denen sich nur das Können der Figur ändert, sind so ein Fall. Die Texttafel rafft sie offen. Der veränderte Raum rafft sie auch, lässt den Spieler die Zeit aber selbst ablesen. Welche Lösung besser passt, hängt davon ab, ob der Spieler aus der vergangenen Zeit etwas schließen soll.
    hints:
      - Zwei Lösungen sind richtig.
      - Frag bei jeder Lösung, wie viel Arbeit sie kostet und ob sich in der gezeigten Zeit etwas ändert.
    resources:
      - title: Turkey City Lexicon, „Show, not Tell“ (SFWA)
        url: https://www.sfwa.org/2009/06/turkey-city-lexicon-a-primer-for-sf-workshops/
      - title: Don Carson, „Environmental Storytelling“, Abschnitt „Storytelling Through Cause and Effect“
        url: https://www.gamedeveloper.com/design/environmental-storytelling-creating-immersive-3d-worlds-using-lessons-learned-from-the-theme-park-industry

  - id: leiter-zurueck
    type: choice
    title: Die geliehene Leiter
    prompt: |
      Lehrbeispiel: In einer früheren Szene hat der Spieler entschieden, dem Nachbarn die geliehene Leiter nicht zurückzugeben. Welche Lösung zeigt die Folge in der Welt, ohne sie zu erklären?
    options:
      - text: Beim nächsten Besuch lehnt am Zaun des Nachbarn eine neue Leiter, an der noch das Preisschild hängt.
        correct: true
        why: Die Welt hat sich verändert, und der Spieler schließt selbst, was das über den Nachbarn und die alte Leiter sagt.
      - text: "Eine Einblendung erscheint: „Dein Nachbar wird sich das merken.“"
        correct: false
        why: Die Einblendung kündigt eine Folge an. Gezeigt wird noch nichts.
      - text: "Der Nachbar sagt: „Ich bin enttäuscht, dass du mir die Leiter nicht zurückgegeben hast.“"
        correct: false
        why: Er nennt sein Gefühl und wiederholt, was der Spieler schon weiß.
      - text: "Eine Erzählerstimme fasst zusammen: „Seit der Sache mit der Leiter ist das Verhältnis abgekühlt.“"
        correct: false
        why: Das ist Raffung. Sie kann für Nebensächliches reichen, aber sie zeigt die Folge nicht.
    explanation: |
      Eine gezeigte Folge verändert etwas, das der Spieler sehen kann, und überlässt ihm den Schluss. Die neue Leiter mit Preisschild sagt, dass der Nachbar die alte aufgegeben hat, und vielleicht auch etwas über seine Haltung, ohne dass jemand es ausspricht. Carson beschreibt Orte, die sich durch die Handlungen des Spielers verändern, als eigenes Mittel.
    hints:
      - Welche Lösung kommt ohne einen einzigen erklärenden Satz aus?
    resources:
      - title: Don Carson, „Environmental Storytelling“, Abschnitt „Storytelling Through Cause and Effect“
        url: https://www.gamedeveloper.com/design/environmental-storytelling-creating-immersive-3d-worlds-using-lessons-learned-from-the-theme-park-industry

  - id: spuren-planen
    type: order
    title: Ein Raum mit Vergangenheit
    prompt: |
      Du planst einen Raum, der von einem vergangenen Ereignis erzählt. Bring die Arbeitsschritte in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Leg in einem Satz fest, was hier passiert ist.
      Sammle die Handlungen, die dabei Spuren hinterlassen haben.
      Wähl für jede Handlung einen Gegenstand, der die Spur trägt.
      Ordne die Spuren danach, welche zuerst auffällt und welche man erst beim Suchen findet.
      Zeig den Raum jemandem und frag nur, was hier passiert ist.
    explanation: |
      Der Satz am Anfang ist der Maßstab. Gegen ihn prüfst du später jede Spur auf Widersprüche. Aus dem Ereignis folgen die Handlungen, aus den Handlungen die Gegenstände. Erst wenn die Spuren feststehen, kannst du ihre Rangfolge planen. Der Test steht am Ende, weil er zeigt, ob ein Fremder denselben Satz aus dem Raum herausliest.
    hints:
      - Womit vergleichst du am Ende die Antwort deines Testers?
    resources:
      - title: Harvey Smith, Matthias Worch, „What Happened Here?“ (GDC 2010)
        url: https://gdcvault.com/play/1012647/What-Happened-Here-Environmental

  - id: begriffe-umgebung
    type: gap
    title: Vier Begriffe aus der Lektion
    prompt: |
      Ergänze die Begriffe.
    lang: prose
    code: |
      Erzählt die Umgebung, was vorher geschah, spricht die Spielebranche von ⟦Environmental Storytelling⟧. Don Carson übertrug den Begriff aus der Gestaltung von ⟦Themenparks⟧. Liegt eine fertige Geschichte in der Ausstattung eines Raums und wartet auf Entdeckung, nennt Henry Jenkins das ⟦embedded⟧ narrative. Fasst ein Text viele Jahre in wenigen Sätzen zusammen, heißt das ⟦Raffung⟧.
    gaps:
      - label: englischer Fachbegriff
        hint: Zwei englische Wörter, das erste heißt „umgebungsbezogen“.
        accept: ["Umgebungserzählen", "Erzählen über die Umgebung"]
      - label: Carsons Herkunft
        hint: Dort fahren Besucher durch gestaltete Welten.
        accept: ["Themenpark", "Freizeitparks", "Freizeitpark", "Vergnügungsparks", "Vergnügungspark", "theme parks", "theme park"]
      - label: Jenkins' dritte Art
        hint: Englisch für „eingebettet“.
        accept: ["eingebettete", "eingebettet"]
      - label: Zeit zusammenfassen
        hint: Ein deutsches Wort, verwandt mit „Zeitraffer“.
        accept: ["Zeitraffung", "Zusammenfassung", "Raffen"]
    explanation: |
      Carson brachte Environmental Storytelling aus dem Themenpark-Design in die Spieleentwicklung. Jenkins ordnet Spuren im Raum als embedded narratives ein, als Geschichten, die in der Ausstattung stecken. Raffung ist das Gegenstück aus der Erzähltechnik: Sie fasst zusammen, was nicht gezeigt werden muss.
    resources:
      - title: Don Carson, „Environmental Storytelling“ (Game Developer)
        url: https://www.gamedeveloper.com/design/environmental-storytelling-creating-immersive-3d-worlds-using-lessons-learned-from-the-theme-park-industry

  - id: wartezimmer
    type: practice
    title: Ohne das Wort „trostlos“
    prompt: |
      Lehrbeispiel: „Das Wartezimmer wirkte trostlos.“ Schreib zwei bis drei Sätze über dieses Wartezimmer, die den Eindruck über Dinge und Zustände vermitteln. Welche Dinge das sind, entscheidest du.
    lang: prose
    checklist:
      - Kein Gefühls- oder Wertungswort wie „trostlos“, „traurig“, „öde“ oder „bedrückend“.
      - Mindestens zwei konkrete Gegenstände.
      - Mindestens ein Detail zeigt Zeit oder Gebrauch, etwa Abnutzung, Staub, ein Datum oder einen Rest.
      - Höchstens drei Sätze.
    explanation: |
      Ein Gefühlswort sagt dem Leser, was er empfinden soll. Gegenstände und Zustände geben ihm das Material, aus dem er den Eindruck selbst bildet. Das Detail zu Zeit oder Gebrauch sorgt dafür, dass der Raum neben einer Einrichtung auch eine Vergangenheit bekommt.
    hints:
      - Frag dich, woran du an einem echten Ort merkst, dass er trostlos ist.

  - id: kueche-nach-dem-auszug
    type: bug
    title: Die Küche am Tag danach
    prompt: |
      Lehrbeispiel: Raumbeschreibung einer Küche am Tag nach einem Auszug. Finde die Zeile, die ein Gefühl benennt, statt es über Dinge zu zeigen.
    lang: prose
    code: |
      Auf der Arbeitsplatte steht ein einzelner Becher, innen ein brauner Rand.
      An der Wand sind vier helle Rechtecke, wo Bilder hingen.
      Im Kühlschrank liegt nur noch ein Senfglas, die Tür steht einen Spalt offen.
      Die Küche fühlt sich traurig und verlassen an.
      Auf dem Boden liegt ein Zettel mit einer Telefonnummer und „Danke für alles“.
      Neben der Tür lehnt ein Besen, die Kehrschaufel fehlt.
    lines: [4]
    explanation: |
      Zeile 4 sagt dem Leser, was er empfinden soll, und wiederholt damit, was die anderen Zeilen schon zeigen. Die hellen Rechtecke, das Senfglas und der einzelne Becher lassen den Leser selbst auf den Auszug und die Leere schließen. Der Zettel ist ein Fundstück, das eine Frage öffnet: Wer bedankt sich bei wem? Ohne Zeile 4 wird der Raum nicht ärmer, er wird genauer.
    hints:
      - Such die Zeile ohne einen einzigen Gegenstand.

  - id: frischer-topf
    type: bug
    title: Seit Wochen leer
    prompt: |
      Lehrbeispiel: Die Beschreibung soll zeigen, dass in dieser Wohnung seit Wochen niemand mehr wohnt. Eine Spur widerspricht dem, ohne dass der Text das als Rätsel anlegt. Finde sie.
    lang: prose
    code: |
      Hinter der Tür liegt ein Stapel Werbeprospekte, der unterste vergilbt.
      Auf dem Fensterbrett stehen drei Töpfe mit vertrockneter Erde.
      Der Wandkalender in der Küche zeigt noch den Februar.
      Auf dem Herd steht ein Topf, aus dem es noch dampft.
      Über dem Sofa liegt eine Staubschicht, in der keine Abdrücke sind.
      Die Uhr über der Tür ist stehen geblieben.
    lines: [4]
    explanation: |
      Ein dampfender Topf heißt, dass vor Minuten jemand gekocht hat. Alle anderen Spuren sagen, dass seit Wochen niemand hier war. Carson warnt, dass Besucher sich betrogen fühlen, wenn eine Welt ihre eigenen Regeln bricht. Ein Widerspruch kann auch Absicht sein, etwa als Hinweis, dass doch jemand hier ist. Dann muss er die eine auffällige Ausnahme sein, und die Szene muss auf ihn reagieren.
    hints:
      - Welche Spur ist jünger als eine Stunde?
    resources:
      - title: Don Carson, „Environmental Storytelling“, Abschnitt „The Importance of Story“
        url: https://www.gamedeveloper.com/design/environmental-storytelling-creating-immersive-3d-worlds-using-lessons-learned-from-the-theme-park-industry

  - id: rotkaeppchen-stube
    type: explain
    title: Die Tür steht auf
    prompt: |
      Rotkäppchen kommt bei der Großmutter an. Der Leser weiß an dieser Stelle schon, wer im Bett liegt. Erkläre in zwei bis vier Sätzen, welche Spuren Rotkäppchen bemerkt, was der Leser daraus macht und warum es hier nicht stört, dass Rotkäppchen sein Gefühl ausspricht. Zitiert nach der Ausgabe von 1857, die „Rothkäppchen“ schreibt.
    lang: prose
    code: |
      Es wunderte sich daß die Thüre aufstand, und wie es in die Stube trat, so kam es ihm so seltsam darin vor, daß es dachte „ei, du mein Gott, wie ängstlich wird mirs heute zu Muth, und bin sonst so gerne bei der Großmutter!“ Es rief „guten Morgen,“ bekam aber keine Antwort. Darauf gieng es zum Bett und zog die Vorhänge zurück: da lag die Großmutter, und hatte die Haube tief ins Gesicht gesetzt und sah so wunderlich aus.
    points:
      - Die offene Tür und die fehlende Antwort auf „guten Morgen“ weichen vom Gewohnten ab.
      - Vorhänge und tief ins Gesicht gezogene Haube verdecken, wer im Bett liegt. Der Raum versteckt etwas.
      - Der Leser liest jede Spur als Bestätigung dessen, was er schon weiß. Rotkäppchen fehlt dieses Wissen.
      - Rotkäppchen nennt sein Gefühl („ängstlich“), aber keine Ursache. Das Gefühl zeigt, dass es die Spuren spürt und trotzdem nicht versteht.
    explanation: |
      Bevor der Wolf ein Wort sagt, erzählt die Stube, dass etwas nicht stimmt. Die Tür steht offen, der Gruß bleibt ohne Antwort, und die Haube verdeckt das Gesicht. Für den Leser bestätigt jede dieser Spuren, was er weiß, für Rotkäppchen sind sie nur „seltsam“ und „wunderlich“. Das ausgesprochene Gefühl stört hier nicht, weil es kein Ersatz für die Spuren ist. Es zeigt eine Figur, die etwas ahnt und es nicht deutet, und genau dieser Abstand zum Wissen des Lesers erzeugt die Spannung vor dem Wortwechsel am Bett.
    hints:
      - Zähl auf, was in der Stube anders ist als bei einem normalen Besuch.
      - Was weiß der Leser, was Rotkäppchen nicht weiß?
    resources:
      - title: Brüder Grimm, „Rothkäppchen“ (1857, Wikisource)
        url: https://de.wikisource.org/wiki/Rothk%C3%A4ppchen_%281857%29

  - id: marquise-anzeige
    type: explain
    title: Eine Anzeige in der Zeitung
    prompt: |
      Kleists Novelle „Die Marquise von O...“ beginnt so. Erkläre in zwei bis vier Sätzen, was die Zeitungsanzeige verrät, welche Frage sie offenlässt und was daraus für Notizen, Briefe und Tagebücher in Spielen folgt.
    lang: prose
    code: |
      In M..., einer bedeutenden Stadt im oberen Italien, ließ die verwitwete Marquise von O..., eine Dame von vortrefflichem Ruf, und Mutter von mehreren wohlerzogenen Kindern, durch die Zeitungen bekannt machen: daß sie, ohne ihr Wissen, in andre Umstände gekommen sei, daß der Vater zu dem Kinde, das sie gebären würde, sich melden solle; und daß sie, aus Familienrücksichten, entschlossen wäre, ihn zu heiraten. Die Dame, die einen so sonderbaren, den Spott der Welt reizenden Schritt, beim Drang unabänderlicher Umstände, mit solcher Sicherheit tat, war die Tochter des Herrn von G..., Kommandanten der Zitadelle bei M...
    points:
      - Die Anzeige verrät das Ergebnis. Die Marquise ist schwanger, weiß nicht, von wem, und will den Vater heiraten.
      - Offen bleibt, wie es dazu kam. Die Novelle läuft auf diese Frage zu, die Wirkung steht vor der Ursache.
      - Die Handlung zeigt die Figur. Eine Dame von gutem Ruf geht „mit solcher Sicherheit“ an die Öffentlichkeit, obwohl der Schritt den Spott der Welt reizt.
      - Ein gutes Fundstück im Spiel öffnet eine Frage, der der Spieler folgen will, statt alle Fragen zu beantworten.
    explanation: |
      Kleist beginnt mit einem Dokument, das in der erzählten Welt existiert und dort gelesen wird. Es nennt das Unerhörte offen, schwanger ohne ihr Wissen, und verschweigt alles, was der Leser jetzt wissen will. Diese Lücke trägt den Text. Zugleich ist die Anzeige eine Handlung, die mehr über die Marquise sagt als jede Beschreibung, denn sie riskiert ihren Ruf, um eine Lage zu klären. Für Notizen in Spielen heißt das, dass ein Fund dann trägt, wenn er eine Frage stellt. Ein Tagebuch, das alles erklärt, beendet die Suche, die der Raum begonnen hat.
    hints:
      - Lies die Anzeige als Antwort und frag, welche Frage dazu fehlt.
      - Was sagt der Schritt über die Frau, die ihn tut?
    resources:
      - title: Kleist, „Die Marquise von O...“ (Projekt Gutenberg-DE)
        url: https://projekt-gutenberg.org/authors/heinrich-von-kleist/books/kleist-die-marquise-von-o-1/chapter/1

  - id: gone-home-ankunft
    type: explain
    title: Ein Haus voller Kartons
    prompt: |
      Hier ist die Ausgangslage eines Spiels in eigenen Worten beschrieben. Erkläre in zwei bis vier Sätzen, welche Frage diese Lage stellt und wie Haus und Nachricht die Erzählung übernehmen, die sonst eine Figur liefern würde.
    lang: prose
    code: |
      Gone Home (The Fullbright Company, 2013): 7. Juni 1995, 1:15 Uhr nachts. Katie kommt nach einem Jahr im Ausland nach Hause. Das Haus ist leer. Die Familie ist erst vor Kurzem eingezogen, vieles steckt noch in Umzugskartons. An der Tür hängt eine Nachricht ihrer jüngeren Schwester Sam. Katie soll nicht nachforschen, was passiert ist. Man kann jede Schublade und Tür öffnen und Gegenstände aufheben. Andere Figuren treten nicht auf.
    points:
      - Das leere Haus stellt die Frage „Was ist hier passiert?“, bevor jemand etwas erklärt.
      - Sams Nachricht verbietet das Nachforschen und macht es damit zum Ziel. Sie öffnet eine Frage, statt sie zu beantworten.
      - Ohne andere Figuren tragen Gegenstände, Notizen und Räume die Geschichte, und der Spieler setzt sie selbst zusammen.
    explanation: |
      Die Lage ersetzt den Erzähler. Ein leeres Haus in der Nacht wirft sofort die Frage nach den Bewohnern auf, und Sams Nachricht verstärkt sie, weil sie das Nachforschen verbietet. Da keine andere Figur auftritt, muss jede Information aus Dingen kommen, die der Spieler selbst findet. Warum Fullbright die Familie gerade erst einziehen ließ, steht im Praxis-Kasten der Lektion. Das Jahr 1995 wählte das Team, weil Kommunikation damals noch nicht überwiegend digital war und das Team so nicht berücksichtigen musste, wie digitale Kommunikation die Geschichte verändert hätte.
    hints:
      - Was tut ein Spieler, dem man sagt, er solle nicht nachforschen?
      - Überleg, was die Kartons mit der Menge der sichtbaren Gegenstände machen.
    resources:
      - title: Wikipedia, „Gone Home“ (Plot und Development)
        url: https://en.wikipedia.org/wiki/Gone_Home
      - title: Offizielle Seite von Gone Home
        url: https://gonehome.com/

  - id: drei-spuren
    type: practice
    title: Was hier vorher geschah
    prompt: |
      Wähle einen Raum, den du gut kennst, zum Beispiel eine Küche, ein Treppenhaus oder ein Büro. Notiere drei Spuren, die verraten, was dort vorher passiert ist, ohne ein Gefühl zu nennen. Schreib darunter in einem Satz, was passiert ist.
    lang: prose
    starter: |
      Raum:
      Spur 1:
      Spur 2:
      Spur 3:
      Was passiert ist (ein Satz):
    checklist:
      - Jede der drei Spuren hängt an einem konkreten Gegenstand oder Zustand.
      - Keine Spur enthält ein Gefühlswort.
      - Mindestens eine Spur zeigt eine Handlung, also etwas, das bewegt, benutzt oder zurückgelassen wurde.
      - Die drei Spuren widersprechen sich nicht.
      - Der Satz am Ende nennt ein Ereignis, das alle drei Spuren erklärt.
    explanation: |
      Der Satz am Ende ist dein Maßstab. Erklärt er alle drei Spuren, passen sie zusammen. Wenn du die Spuren ohne den Satz jemandem zeigst und er dasselbe Ereignis nennt, haben sie getragen. So gehen auch Smith und Worch vor, wenn sie Räume als „What happened here?“ denken.
    hints:
      - Fang mit dem Ereignis an und frag dann, was es zurückgelassen hätte.

  - id: ort-im-spiel
    type: practice
    title: Ein Ort, der dir etwas erzählt hat
    prompt: |
      Wähle ein Spiel, das du gut kennst, und darin einen Ort, an dem dir die Umgebung etwas erzählt hat. Vorschläge: Gone Home, What Remains of Edith Finch oder Return of the Obra Dinn. Notiere in höchstens fünf Stichpunkten, was du dort gesehen hast, was du daraus geschlossen hast und ob ein Text den Schluss bestätigt hat.
    lang: prose
    starter: |
      Spiel und Ort:
      Gesehen:
      Geschlossen:
      Bestätigt durch:
      Art nach Jenkins:
    checklist:
      - Spiel und Ort sind genannt.
      - Du nennst mindestens zwei konkrete Dinge (Gegenstand, Zustand, Geräusch, Licht) ohne Deutung.
      - Ein Stichpunkt sagt, was du daraus geschlossen hast.
      - Du hast notiert, ob ein Text (Notiz, Dialog, Einblendung) den Schluss bestätigt hat oder ob der Raum allein reichte.
      - Du ordnest den Ort einer der vier Arten von Jenkins zu.
    explanation: |
      Die Trennung von „gesehen“ und „geschlossen“ zeigt dir, wie der Ort gearbeitet hat. Steht unter „bestätigt durch“ immer ein Text, verlässt sich das Spiel auf Erklärungen. Steht dort nichts, und du warst dir trotzdem sicher, hat der Raum allein erzählt.
    hints:
      - Schreib unter „Gesehen“ nur, was eine Kamera aufnehmen könnte.
    resources:
      - title: Henry Jenkins, „Game Design as Narrative Architecture“
        url: https://web.mit.edu/~21fms/People/henry3/games&narrative.html
