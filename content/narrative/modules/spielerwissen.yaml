  - title: Meaningful Play, Meaningful Choices · Experimental Game Design (Carnegie Mellon University)
    url: https://mycours.es/egd/meaningful-play-meaningful-choices/
  - title: The Encyclopedia of Science Fiction · Outer Wilds
    url: https://sf-encyclopedia.com/entry/outer_wilds
