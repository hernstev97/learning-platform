    url: https://www.gdcvault.com/play/1015756/Interesting
lesson: |
  In Telltales The Walking Dead (2012) erscheint nach einer Wahl eine kleine Einblendung: Die Figur werde sich an deine Entscheidung „erinnern“ ([The Encyclopedia of Science Fiction](https://sf-encyclopedia.com/entry/walking_dead_the_game)). Die Zeile sagt nicht, was daraus folgt, nur dass etwas folgen wird. Das reicht, damit du die nächste Antwort länger abwägst.

  Ob du eine Wahl als Entscheidung erlebst, hängt davon ab, wer was weiß. Weiß der Spieler zu wenig, rät er. Weiß er alles, löst er eine Rechenaufgabe. Dieses Modul trennt die Wissensstände von Spieler, Figur und Designer und endet mit fünf Fragen, mit denen du jede Entscheidung prüfen kannst.

  ## Drei Wissensstände: Spieler, Figur, Designer

  In jedem Spiel mit einer Geschichte wissen drei Instanzen Verschiedenes.

  - Der **Designer** kennt alle Wege, alle Folgen und das Ende.
  - Die **Spielerfigur** kennt ihre Welt, ihre Vergangenheit und das, was sie in der Szene wahrnimmt.
  - Der **Spieler** kennt, was ihm das Spiel bis jetzt gezeigt hat, und alles, was er mitbringt: frühere Durchgänge, Erfahrung mit dem Genre, vielleicht eine Komplettlösung aus dem Netz.

  Für das Verhältnis von Erzähler und Figur nutzt Gérard Genette drei Formeln, die auf Tzvetan Todorov zurückgehen. Burkhard Niederhoff erklärt sie im Living Handbook of Narratology ([„Focalization“](https://www-archiv.fdm.uni-hamburg.de/lhn/node/18.html)).

  > [!NOTE] Genettes drei Formeln
  > - Erzähler > Figur: Der Erzähler sagt mehr, als irgendeine Figur weiß (Nullfokalisierung).
  > - Erzähler = Figur: Er sagt nur, was eine bestimmte Figur weiß (interne Fokalisierung).
  > - Erzähler < Figur: Er sagt weniger, als die Figur weiß (externe Fokalisierung).
  >
  > Die Begriffe selbst behandelt das Modul [Perspektive](/narrative/perspektive).

  Im Spiel übernimmt alles die Rolle des Erzählers, was dem Spieler Information gibt: Kamera, Karte, Textboxen, Menüs. Eine Draufsicht zeigt oft den Raum hinter der nächsten Ecke, den die Figur nicht sehen kann. Dann weiß der Spieler mehr als seine Figur, ohne dass ein Satz Text das verursacht hat.

  Am leichtesten übersiehst du den Abstand zwischen Designer und Spieler. Wer eine Szene schreibt, kennt die Auflösung. Hinweise, die dir deutlich vorkommen, übersieht der Spieler, und Hinweise, die dir versteckt vorkommen, verraten ihm alles. Diesen Abstand misst du nur im Testlauf mit anderen ([Testlesen und Playtest](/narrative/testlesen-playtest)).

  ## Rätsel, Spannung und dramatische Ironie

  Ein Wissensunterschied erzeugt eine Frage, und die Frage hält Leser und Spieler bei der Sache. Welche Frage entsteht, hängt davon ab, wer mehr weiß.

  ### Rätsel: der Leser weiß weniger

  Beim Rätsel kennt der Leser eine Wirkung und sucht die Ursache. Heinrich von Kleist stellt in „Die Marquise von O...“ das Ergebnis in den ersten Satz:

  > In M..., einer bedeutenden Stadt im oberen Italien, ließ die verwitwete Marquise von O..., eine Dame von vortrefflichem Ruf, und Mutter von mehreren wohlerzogenen Kindern, durch die Zeitungen bekannt machen: daß sie, ohne ihr Wissen, in andre Umstände gekommen sei, daß der Vater zu dem Kinde, das sie gebären würde, sich melden solle; und daß sie, aus Familienrücksichten, entschlossen wäre, ihn zu heiraten.

  Heinrich von Kleist, „Die Marquise von O...“ (1808), nach der Ausgabe bei Reclam (1991) auf [Projekt Gutenberg-DE](https://projekt-gutenberg.org/authors/heinrich-von-kleist/books/kleist-die-marquise-von-o-1/chapter/1)

  Die Marquise weiß selbst nicht, wie es dazu kam („ohne ihr Wissen“). Die Erzählung weiß mehr als sie und als der Leser. Die Frage lautet: Wie konnte das geschehen, und wer ist der Vater? Ein Rätsel braucht Hinweise, die der Leser nach der Auflösung wiedererkennt. Fehlen sie, wirkt die Auflösung wie Willkür.

  ### Spannung: der Leser weiß mehr

  Bei der Spannung sieht der Leser eine Gefahr kommen, die die Figur noch nicht sieht. Die Frage heißt dann „Was wird passieren?“ statt „Was ist passiert?“. Wer die Bedrohung erst im Moment des Angriffs zeigt, erzeugt Überraschung. Überraschung wirkt im Augenblick, Spannung kann eine ganze Szene tragen.

  ### Dramatische Ironie: Worte mit doppeltem Boden

  Bei der dramatischen Ironie klingen die Worte der Figuren für den Leser anders als für sie selbst, weil er mehr weiß. Im „Rotkäppchen“ der Brüder Grimm hat der Leser im Absatz davor gelesen, wie der Wolf zum Haus der Großmutter geht und sich in ihr Bett legt. Rotkäppchen weiß das nicht:

  > „Ei, Großmutter, was hast du für große Ohren!“\
  > „Daß ich dich besser hören kann.“

  Brüder Grimm, „Rothkäppchen“, Kinder- und Haus-Märchen, Ausgabe letzter Hand (1857), [Wikisource](https://de.wikisource.org/wiki/Rothk%C3%A4ppchen_%281857%29). Der Druck schreibt „Rothkäppchen“ und setzt das Gespräch in einen Absatz; der Zeilenumbruch ist hier eingefügt.

  Für Rotkäppchen ist die Antwort eine Erklärung, für den Leser eine Drohung. Wie die ganze Szene gebaut ist, behandelt das Modul [Konflikt und Szenenaufbau](/narrative/szenenaufbau).

  Im Spiel entsteht dramatische Ironie, wenn der Spieler etwas gesehen hat, das die Figur nicht weiß, etwa durch einen Schnitt zum Gegenspieler. Hier liegt eine Grenze: Der Spieler steuert die Figur. Weiß er von einer Gefahr, will er handeln. Lässt ihn das Spiel nicht, kann sich das wie Bevormundung anfühlen. Ironie ohne Handlungsmöglichkeit kann deshalb in Zwischensequenzen leichter wirken.

  ## Meaningful Play: wann eine Wahl verständlich ist

  Katie Salen und Eric Zimmerman definieren in „Rules of Play“ (MIT Press 2003), wann Spielen bedeutsam ist:

  > „Meaningful play occurs when the relationships between actions and outcomes in a game are both discernable and integrated into the larger context of the game.“

  Katie Salen, Eric Zimmerman, „Rules of Play“ (2003), S. 34, zitiert nach [Katarina Borg Gyllenbäck (2009)](https://arxiv.org/pdf/0905.3070); ausführlicher erklärt auf einer Kursseite der [Carnegie Mellon University](https://mycours.es/egd/meaningful-play-meaningful-choices/)

  Das sind zwei Bedingungen. **Erkennbar** (discernable) heißt, der Spieler sieht, dass seine Handlung etwas bewirkt hat. **Eingebunden** (integrated) heißt, die Folge zählt über den Moment hinaus. Eine Folge, die der Spieler nie bemerkt, erfüllt die erste Bedingung nicht. Eine Rückmeldung, auf die nichts folgt, erfüllt die zweite nicht.

  Die Telltale-Einblendung macht eine Wahl erkennbar. Ob sie auch eingebunden ist, zeigt erst der weitere Verlauf. Eine Bestätigung weckt eine Erwartung, und die muss das Spiel später einlösen. Wie Spiele das tun und wo sie es nicht tun, behandelt [Verzweigungen begrenzen, Folgen erlebbar machen](/narrative/verzweigungen).

  Bevor der Spieler wählt, braucht er die **Optionen** (was steht zur Wahl?), den **Einsatz** (was kann er mit jeder Option gewinnen oder verlieren?) und eine **Erwartung** (was glaubt er, wird passieren?). Das Ergebnis kennt er nicht. Kennt er es, fragt die Wahl nur noch ab, was er lieber hätte.

  > [!MERKE] Verständliche Entscheidung
  > Der Spieler kennt die Optionen und den Einsatz und hat eine begründete Erwartung. Das Ergebnis kennt er nicht. Nach der Wahl sieht er, dass sie etwas bewirkt hat, und später, dass sie gezählt hat.

  ### Ankündigen, ohne zu verraten

  Telegraphing heißt in der Spielebranche, dass ein Spiel ankündigt, was kommt. Im Kampf ist das die Ausholbewegung vor dem Schlag. In der Erzählung ist es alles, was vor einer Wahl den Einsatz sichtbar macht: eine Bemerkung, ein Gegenstand, eine frühere Szene, in der etwas Ähnliches schiefging.

  Eine Ankündigung zeigt, was auf dem Spiel steht. Ein Verrat nennt das Ergebnis. Ein Lehrbeispiel: Eine Figur steht am Bahnhof und könnte noch Kaffee holen, bevor der Anschlusszug fährt.

  > Durchsage: „Der Anschlusszug wartet heute nicht.“\
  > Hinweistext: „Wenn du Kaffee holst, verpasst du den Zug.“

  Lehrbeispiel

  Die Durchsage nennt den Einsatz und lässt offen, ob die Zeit reicht. Der Hinweistext nimmt die Entscheidung weg. Wer ihn liest, wägt nicht mehr ab.

  > [!TIP] Der Ergebnistest
  > Stell dir zwei Spieler vor, die nach deiner Ankündigung verschieden wählen. Haben beide gute Gründe? Bleibt nur eine Option vernünftig, verrät die Ankündigung das Ergebnis.

  ## Wenn Spieler und Figur Unterschiedliches wissen

  ### Der Spieler weiß mehr als die Figur

  Das passiert beim zweiten Durchgang, nach einem Blick in eine Komplettlösung oder durch die Kamera. Der Spieler wählt dann mit Wissen, das die Figur nicht haben kann. Oft lässt ein Spiel das stehen, und das ist legitim. Schwierig wird es, wenn eine Szene nur davon lebt, dass der Spieler etwas nicht weiß. Dann trägt sie genau einmal.

  Manche Spiele reagieren auf frühere Durchgänge. In Undertale verändert der Genocide-Weg, wenn man ihn beendet, dauerhaft das spätere True-Pacifist-Ende ([Wikipedia](https://en.wikipedia.org/wiki/Undertale)). Mehr dazu im Modul [Erzählerische Folgen und mechanische Anreize](/narrative/folgen-anreize).

  ### Die Figur weiß mehr als der Spieler

  Eine Spielerfigur mit Vergangenheit kennt Namen, Orte und alte Rechnungen, die der Spieler erst lernen muss. Schweigt sie darüber, wirkt sie leer. Erzählt sie alles, hält sie einen Vortrag. Der bequemste Ausweg ist der Gedächtnisverlust: Die Figur weiß nichts, also muss der Spieler auch nichts wissen. Das gleicht die Wissensstände an und kostet die Vergangenheit der Figur als Antrieb.

  > [!WARNING] Gedächtnisverlust als Ausrede
  > Prüf, ob eine Figur ihr Gedächtnis aus einem Grund der Geschichte verliert oder nur, damit niemand etwas erklären muss. Im zweiten Fall gibt es andere Wege: Die Figur handelt nach ihrem Wissen, und der Spieler holt an den Reaktionen der anderen auf. Oder sie spricht erst, wenn die Information gebraucht wird (siehe [Dialog und Subtext](/narrative/dialog-subtext)).

  ### Handeln ohne Information

  Spec Ops: The Line (Yager Development, 2012) lässt den Spieler an einer Stelle handeln, bevor er die Folge kennen kann, und zeigt erst danach, was geschehen ist. Laut Wikipedia hofften die Entwickler, dass Spieler sich über sie ärgern ([Wikipedia](https://en.wikipedia.org/wiki/Spec_Ops:_The_Line)). Die Szene untersuchst du in einer Übung.

  Ob man das gelungen findet, ist eine Wertung. Fürs Handwerk zählt, dass das Team die fehlende Information eingeplant hat, weil es eine bestimmte Reaktion wollte. Fehlt eine Information aus Versehen, liest der Spieler die Folge als Willkür und gibt dem Spiel die Schuld, nicht seiner Wahl.

  ## Wissen als Fortschritt: Outer Wilds und Obra Dinn

  Outer Wilds (Mobius Digital, 2019) kommt ohne Gegenstände zum Sammeln und ohne Erfahrungspunkte aus. Die Encyclopedia of Science Fiction schreibt, der Fortschritt sei „limited only by the player's knowledge, rather than in-game character progression“ ([SFE](https://sf-encyclopedia.com/entry/outer_wilds)). Die Welt läuft in einer Zeitschleife von 22 Minuten ab ([Wikipedia](https://en.wikipedia.org/wiki/Outer_Wilds)). Die Figur wird nicht stärker, der Spieler versteht mehr.

  Return of the Obra Dinn (Lucas Pope, 2018) macht den Spieler zum Versicherungsinspektor. Er bestimmt durch Schlussfolgern für alle 60 Personen an Bord Name und Todesursache oder Verbleib. Sein Hilfsmittel ist die Taschenuhr „Memento Mortem“ ([Wikipedia](https://en.wikipedia.org/wiki/Return_of_the_Obra_Dinn)). Das Spiel ist ein Rätsel im Sinn dieses Moduls: Die Wirkung steht fest, die Ursachen muss der Spieler erschließen.

  In beiden Spielen ist eine Entscheidung eine Behauptung über die Welt, etwa „so muss es gewesen sein“. Das lässt sich auf kleinere Momente übertragen: Wer etwas herausgefunden hat, sollte damit etwas tun können. Sonst bleibt das Wissen Dekoration.

  ## Fünf Fragen an eine Entscheidung

  Die Fragen passen an jede Entscheidung, an eine aus einem Spiel, das du gespielt hast, oder an eine aus deinem eigenen Projekt.

  1. **Was steht zur Wahl?** Die Optionen und was jede kosten oder bringen kann.
  2. **Was weiß der Spieler?** Nur das, was das Spiel bis zu diesem Moment gezeigt hat.
  3. **Was weiß die Figur?** Und deckt sich das mit dem Wissen des Spielers?
  4. **Was erwartet der Spieler?** Welche Folge hält er für wahrscheinlich, und woher hat er das?
  5. **Was passiert, und wann sieht er es?** Sofort, später oder nie.

  Die zweite Frage ist die schwerste, weil du selbst mehr weißt. Schreib dort nur auf, was der Spieler gesehen oder gehört hat, mit der Stelle, an der das passiert. Bei der fünften gilt: Eine Folge, die der Spieler nie sieht, ist für ihn keine. Wie man Folgen sichtbar macht und Verzweigungen begrenzt, behandelt dasselbe Modul.

  ## Häufige Fehler

  - **Der Einsatz steht nur in deinen Notizen.** Du kannst ihn erklären, aber keine Stelle nennen, an der der Spieler ihn erfährt. Notiere für jede Option, wo der Spieler erfährt, was sie kosten kann.
  - **Die Ankündigung verrät das Ergebnis.** Nach dem Hinweis bleibt nur eine vernünftige Option. Kündige an, was auf dem Spiel steht, nicht wie es ausgeht.
  - **Die Folge bleibt unsichtbar.** Testspieler können nach der Wahl nicht sagen, was sie bewirkt hat. Leg einen Ort und einen Zeitpunkt fest, an dem der Spieler die Folge sieht.
  - **Die Figur handelt nach Wissen, das der Spieler nie bekommt.** Der Spieler versteht nicht, warum seine Figur etwas tut. Zeig die Information vorher, oder lass Reaktionen anderer Figuren sie nachliefern.
  - **Designerwissen rutscht in die Planung.** Unter „Was weiß der Spieler?“ steht etwas, das erst später vorkommt. Streich alles, was der Spieler zu diesem Zeitpunkt nicht gesehen haben kann.

  > [!PRAXIS] Interessante Entscheidungen
  > Sid Meier (Firaxis Games) griff auf der GDC 2012 seinen Satz von 1989 auf, ein Spiel sei „a series of interesting decisions“ ([Game Developer](https://www.gamedeveloper.com/business/gdc-vault-adds-free-gdc-2012-videos-featuring-meier-metrics-and-more)). Der Vortrag behandelt, welche Entscheidungen interessant sind, wie man sie verstärkt und welche Rolle Tempo und Feedback spielen ([GDC Vault](https://www.gdcvault.com/play/1015756/Interesting)). Die Telltale-Einblendung ist solches Feedback: eine Zeile Interface, die eine Wahl erkennbar macht.

  ## Zusammenfassung

  - Spieler, Spielerfigur und Designer wissen Verschiedenes. Am leichtesten übersiehst du den Abstand zwischen dir und dem Spieler.
  - Beim Rätsel weiß der Leser weniger und fragt nach der Ursache. Bei der Spannung weiß er mehr und fürchtet, was kommt. Dramatische Ironie gibt den Worten der Figuren einen zweiten Sinn.
  - Meaningful Play nach Salen und Zimmerman verlangt Folgen, die erkennbar und eingebunden sind.
  - Eine verständliche Entscheidung braucht Optionen, Einsatz und eine Erwartung, aber kein bekanntes Ergebnis.
  - Kündige den Einsatz an, nicht das Ergebnis.
  - Fehlende Information ist ein Werkzeug, wenn sie Absicht ist. Aus Versehen wirkt sie wie Willkür.
  - Die fünf Fragen: Was steht zur Wahl, was weiß der Spieler, was weiß die Figur, was erwartet der Spieler, was passiert und wann sieht er es?

exercises:
  - id: raetsel-spannung-ironie
    type: choice
    title: Wer weiß hier mehr?
    prompt: |
      Drei Lehrbeispiele, jedes ein, zwei Sätze lang. Welche Zuordnung stimmt: Rätsel, Spannung oder dramatische Ironie?
    lang: prose
    code: |
      A: Die Figur kommt am Montag ins Büro. Ihr Schreibtisch ist leergeräumt, und niemand sagt ihr, warum.
      B: Der Leser hat gesehen, wie der Hausmeister die Haustür abschließt. Die Figur trägt noch Kisten hinaus, ihr Schlüssel liegt oben in der Wohnung.
      C: Der Leser weiß, dass der Sohn das Familienessen absagen wird. Die Mutter deckt den Tisch und sagt: „Heute sind wir endlich wieder alle zusammen.“
    options:
      - text: A Rätsel, B Spannung, C dramatische Ironie
        correct: true
        why: In A sucht der Leser mit der Figur die Ursache. In B sieht er eine Gefahr kommen, die die Figur nicht sieht. In C klingt ein Satz für ihn anders als für die Mutter.
      - text: A Spannung, B Rätsel, C dramatische Ironie
        correct: false
        why: In A weiß der Leser nicht mehr als die Figur, er sucht eine Ursache. In B kennt er die Ursache schon und fragt, was passieren wird.
      - text: A Rätsel, B dramatische Ironie, C Spannung
        correct: false
        why: In B sagt niemand etwas, das einen zweiten Sinn bekommt. In C liegt der Vorsprung des Lesers in einem Satz, der für die Mutter harmlos klingt.
      - text: A dramatische Ironie, B Spannung, C Rätsel
        correct: false
        why: Ironie braucht einen Vorsprung des Lesers, den es in A nicht gibt. In C kennt der Leser die Ursache schon, es bleibt nichts zu erraten.
    explanation: |
      Entscheidend ist, wer mehr weiß und welche Frage daraus entsteht. Beim Rätsel weiß der Leser weniger als die Erzählung und fragt „Was ist passiert?“. Bei der Spannung weiß er mehr als die Figur und fragt „Was wird passieren?“. Dramatische Ironie ist der Sonderfall, in dem dieser Vorsprung den Worten einer Figur einen zweiten Sinn gibt.
    hints:
      - Frag bei jedem Beispiel, ob der Leser mehr oder weniger weiß als die Figur.
      - Nur in einem Beispiel spricht eine Figur.
    resources:
      - title: Living Handbook of Narratology · „Focalization“
        url: https://www-archiv.fdm.uni-hamburg.de/lhn/node/18.html

  - id: folge-ohne-zusammenhang
    type: choice
    title: Geholfen, aber warum?
    prompt: |
      Lehrbeispiel: Im ersten Kapitel kann die Spielerfigur einer Nachbarin ihre Bohrmaschine leihen oder nicht. Das Spiel merkt sich die Wahl still. Im fünften Kapitel hilft die Nachbarin beim Umzug oder eben nicht. Nirgends zeigt oder erwähnt das Spiel den Zusammenhang.

      Welche Bedingung von Meaningful Play nach Salen und Zimmerman ist hier verletzt?
    options:
      - text: Erkennbar – der Spieler kann die Hilfe im fünften Kapitel nicht auf seine Wahl zurückführen.
        correct: true
        why: Die Folge existiert, aber die Beziehung zwischen Handlung und Ergebnis bleibt für den Spieler unsichtbar.
      - text: Eingebunden – die Wahl hat keinen Einfluss auf den weiteren Verlauf.
        correct: false
        why: Die Wahl beeinflusst das fünfte Kapitel. Eingebunden ist sie also, nur sieht der Spieler das nicht.
      - text: Keine, denn die Folge existiert ja.
        correct: false
        why: Dass eine Folge im System existiert, reicht nicht. Salen und Zimmerman verlangen, dass der Spieler die Beziehung erkennen kann.
      - text: Beide, weil die Folge zu spät kommt.
        correct: false
        why: Eine späte Folge kann eingebunden sein. Das Problem ist nicht der Abstand, sondern dass nichts den Zusammenhang zeigt.
    explanation: |
      Erkennbar und eingebunden sind zwei getrennte Bedingungen. Dieses Lehrbeispiel ist das Gegenstück zur Telltale-Einblendung: Dort ist die Wahl sofort erkennbar, und ob sie eingebunden ist, zeigt sich später. Hier ist sie eingebunden, aber nie erkennbar. Ein Satz der Nachbarin, der an die Bohrmaschine erinnert, würde reichen, um die Beziehung sichtbar zu machen.
    hints:
      - Gibt es im fünften Kapitel eine Folge der Wahl?
      - Kann der Spieler diese Folge mit seiner Wahl verbinden?
    resources:
      - title: Meaningful play (Wikipedia)
        url: https://en.wikipedia.org/wiki/Meaningful_play

  - id: ankuendigung-kueche
    type: choice
    title: Was steht heute auf dem Spiel?
    prompt: |
      Lehrbeispiel: Eine Figur kocht für Gäste. Sie kann das Rezept nehmen, das sie gut kennt, oder ein neues ausprobieren. Welche Zeile kündigt den Einsatz an, ohne das Ergebnis zu verraten?
    options:
      - text: "Am Telefon sagt der Partner: „Meine Mutter kommt heute doch mit. Sie war früher Köchin.“"
        correct: true
        why: Die Zeile zeigt, was auf dem Spiel steht (das Urteil einer Fachfrau), und lässt offen, welches Rezept gelingt.
      - text: "Ein Hinweis erscheint: „Das neue Rezept wird dir heute misslingen.“"
        correct: false
        why: Das ist ein Verrat. Wer den Hinweis liest, hat keinen Grund mehr, das neue Rezept zu wählen.
      - text: "Nach dem Essen erscheint: „Deine Schwiegermutter wird sich das merken.“"
        correct: false
        why: Das ist eine Bestätigung nach der Wahl. Sie macht die Wahl erkennbar, kündigt aber vorher nichts an.
      - text: Die Wahl erscheint als „Rezept A“ und „Rezept B“, ohne weiteren Text.
        correct: false
        why: Hier fehlt der Einsatz ganz. Der Spieler weiß nicht, was er gewinnen oder verlieren kann.
    explanation: |
      Eine Ankündigung zeigt, was auf dem Spiel steht, und lässt beide Optionen vernünftig. Ein Verrat nimmt die Entscheidung weg, weil nur noch eine Option sinnvoll bleibt. Eine Bestätigung kommt erst nach der Wahl und gehört zur Frage, wann der Spieler die Folge sieht. Ohne jeden Hinweis rät der Spieler nur.
    hints:
      - Welche Zeile kommt vor der Wahl und lässt beide Rezepte offen?

  - id: fuenf-fragen-ordnen
    type: order
    title: In welcher Reihenfolge prüfen?
    prompt: |
      Bring die fünf Fragen an eine Entscheidung in eine Reihenfolge, in der jede auf der vorigen aufbauen kann.
    lang: prose
    lines: |
      Was steht zur Wahl, und was kann jede Option kosten?
      Was weiß der Spieler bis zu diesem Moment?
      Was weiß die Figur, und deckt sich das mit dem Spielerwissen?
      Was erwartet der Spieler, und woher hat er die Erwartung?
      Was passiert, und wann sieht der Spieler die Folge?
    alternatives:
      - [1, 3, 2, 4, 5]
    explanation: |
      Die Optionen kommen zuerst, weil sich alle anderen Fragen auf sie beziehen. Das Wissen von Spieler und Figur steht vor der Erwartung, denn eine Erwartung entsteht aus dem, was jemand weiß. Ob du zuerst den Spieler oder die Figur prüfst, ist gleich. Die Folge steht am Ende, weil du erst dann vergleichen kannst, ob sie zur Erwartung passt.
    hints:
      - Worauf beziehen sich alle anderen Fragen?
      - Woraus entsteht eine Erwartung?
    resources:
      - title: Meaningful Play, Meaningful Choices · Experimental Game Design (CMU)
        url: https://mycours.es/egd/meaningful-play-meaningful-choices/

  - id: begriffe-wissensstaende
    type: gap
    title: Wer weiß hier mehr?
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Kennt der Leser eine Wirkung und sucht die Ursache, entsteht ein ⟦Rätsel⟧. Weiß er mehr als die Figur und klingen ihre Worte für ihn anders als für sie, spricht man von ⟦dramatischer Ironie⟧. Salen und Zimmerman verlangen, dass die Folgen einer Handlung ⟦erkennbar⟧ und ⟦eingebunden⟧ sind.
    gaps:
      - label: Leser weiß weniger
        hint: Die Marquise von O... ist ein Beispiel dafür.
      - label: Worte mit doppeltem Boden
        hint: Zwei Wörter, das zweite beginnt mit I.
        accept: ["dramatische Ironie"]
      - label: Erste Bedingung
        hint: Der Spieler sieht, dass seine Handlung etwas bewirkt hat (englisch discernable).
        accept: ["discernable", "discernible"]
      - label: Zweite Bedingung
        hint: Die Folge zählt im größeren Zusammenhang (englisch integrated).
        accept: ["integrated", "integriert"]
    explanation: |
      Rätsel und dramatische Ironie unterscheiden sich darin, wer mehr weiß. Beim Rätsel fehlt dem Leser etwas, bei der Ironie hat er einen Vorsprung. Erkennbar und eingebunden sind die beiden Bedingungen, unter denen eine Handlung im Spiel Bedeutung bekommt: Der Spieler sieht die Folge, und die Folge zählt später.
    resources:
      - title: Katarina Borg Gyllenbäck (2009), mit dem Zitat aus „Rules of Play“ (PDF)
        url: https://arxiv.org/pdf/0905.3070

  - id: ankuendigen-begriffe
    type: gap
    title: Vorher und nachher
    prompt: |
      Ergänze die Begriffe aus dem Abschnitt über Telegraphing.
    lang: prose
    code: |
      Eine Ankündigung zeigt vor der Wahl den ⟦Einsatz⟧. Ein Verrat nennt das ⟦Ergebnis⟧. Ein Hinweis nach der Wahl, dass sie gezählt hat, ist eine ⟦Bestätigung⟧.
    gaps:
      - label: Was auf dem Spiel steht
        hint: Beim Glücksspiel legt man ihn auf den Tisch.
        accept: ["Stakes"]
      - label: Was nicht verraten werden soll
        hint: Wie die Wahl ausgeht.
        accept: ["Resultat", "Ende"]
      - label: Rückmeldung danach
        hint: Telltales „… will remember that“ ist eine.
        accept: ["Rückmeldung", "Feedback"]
    explanation: |
      Die drei Begriffe trennen, wann eine Information kommt und was sie enthält. Der Einsatz gehört vor die Wahl, das Ergebnis nicht. Eine Bestätigung danach macht die Wahl erkennbar, ersetzt aber keine Folge, die später sichtbar wird.

  - id: wissensstaende-in-einer-szene
    type: practice
    title: Wer hat den Vorsprung?
    prompt: |
      Wähle eine Szene aus einem Spiel, Buch oder Film, das du gut kennst, in der eine Figur oder das Publikum mehr weiß als eine andere Figur. Füll die Vorlage in Stichpunkten aus.
    lang: prose
    starter: |
      Werk und Szene:
      Wer weiß mehr:
      Was genau:
      Wer weiß weniger:
      Frage, die beim Publikum entsteht:
      Art (Rätsel, Spannung, dramatische Ironie):
    checklist:
      - Werk und Szene sind so genau genannt, dass jemand anderes die Stelle finden kann.
      - Du sagst in einem Satz, wer mehr weiß und was genau.
      - Die Frage beim Publikum steht als Frage mit Fragezeichen da.
      - Die Zuordnung zu Rätsel, Spannung oder dramatischer Ironie ist mit dem Wissensunterschied begründet.
    explanation: |
      Wissensunterschiede siehst du leichter an fremden Werken, weil du dort nicht mehr weißt als das Publikum. Die Frage beim Publikum ist der Prüfstein. „Was ist passiert?“ deutet auf ein Rätsel, „Was wird passieren?“ auf Spannung. Wenn sich Sätze der Figuren für das Publikum anders anhören als für sie selbst, ist es dramatische Ironie.
    hints:
      - Szenen mit Verkleidung, Verrat oder einem Geheimnis eignen sich gut.
    resources:
      - title: Living Handbook of Narratology · „Focalization“
        url: https://www-archiv.fdm.uni-hamburg.de/lhn/node/18.html

  - id: einsatz-behauptet
    type: bug
    title: Was steht hier auf dem Spiel?
    prompt: |
      Lehrbeispiel: eine Entscheidungskarte aus der Planung eines Spiels über einen Umzugstag. Finde die Zeile, die den Einsatz nur behauptet, statt zu sagen, was verloren gehen kann.
    lang: prose
    code: |
      Situation: Der Transporter ist voll. Eine Kiste bleibt bis morgen im Hausflur.
      Optionen: die Kiste mit dem Geschirr oder die Kiste mit den Akten.
      Spieler weiß: Die Schwester braucht die Akten morgen früh für einen Termin.
      Figur weiß: dasselbe, sie hat das Telefonat selbst geführt.
      Einsatz: Diese Wahl ist für die Figur sehr wichtig.
      Erwartung: Der Spieler rechnet damit, dass die Schwester morgen nachfragt.
      Folge sichtbar: am nächsten Morgen im ersten Gespräch mit der Schwester.
    lines: [5]
    explanation: |
      Zeile 5 sagt, dass die Wahl wichtig ist, aber nicht, was mit jeder Option verloren gehen kann. Ein Einsatz nennt einen möglichen Verlust, für jede Option einzeln. Hier fehlt besonders, was dem Geschirr im Flur passieren könnte und warum das der Figur etwas bedeutet. Ohne diese Angabe hat der Spieler nur einen Grund für eine der beiden Kisten, und die Wahl ist keine.
    hints:
      - Welche Zeile könnte wörtlich in jeder anderen Entscheidungskarte stehen?
      - Ein Einsatz nennt, was man verlieren kann.

  - id: designerwissen
    type: bug
    title: Woher weiß der Spieler das?
    prompt: |
      Lehrbeispiel: eine Entscheidungskarte aus der Planung eines Spiels, das in einem Büro spielt. In die Karte hat sich Designerwissen eingeschlichen. Finde die Zeile, die der Spieler zum Zeitpunkt der Wahl nicht wissen kann.
    lang: prose
    code: |
      Situation: Die Figur soll morgen früh die Quartalszahlen präsentieren.
      Optionen: heute Abend proben oder zur Abschiedsfeier der Kollegin gehen.
      Spieler weiß: Die Kollegin hat die Figur eingearbeitet und geht nach zwölf Jahren.
      Spieler weiß: Die Präsentation wird morgen ohnehin verschoben.
      Figur weiß: Die Chefin prüft bei Präsentationen jede Zahl.
      Erwartung: Wer nicht probt, gerät morgen bei den Zahlen ins Stocken.
      Folge sichtbar: in der Besprechung am nächsten Morgen.
    lines: [4]
    explanation: |
      Zeile 4 beschreibt ein Ereignis von morgen. Das weiß nur der Designer. Steht es unter „Spieler weiß“, rechnest du mit einem Wissen, das der Spieler nicht hat, und planst die Erwartung falsch. Wüsste der Spieler es, wäre die Wahl außerdem leer, denn das Proben hätte keinen Einsatz mehr.
    hints:
      - Welche Zeile spricht über etwas, das noch nicht passiert ist?
    resources:
      - title: Living Handbook of Narratology · „Focalization“ (Wer weiß was?)
        url: https://www-archiv.fdm.uni-hamburg.de/lhn/node/18.html

  - id: rotkaeppchen-wer-weiss
    type: explain
    title: Was der Leser hört
    prompt: |
      Lies den Ausschnitt aus dem „Rotkäppchen“ der Brüder Grimm (Ausgabe 1857; die Zeilenumbrüche sind eingefügt, im Druck steht alles in einem Absatz). Der Leser weiß aus dem Absatz davor, dass der Wolf im Bett liegt.

      Erkläre in zwei bis vier Sätzen, wer in dieser Szene was weiß und wessen Wahrnehmung der Erzähler folgt. Sag außerdem, was sich ändern müsste, damit die Szene ein Rätsel statt dramatischer Ironie wird.
    lang: prose
    code: |
      Es wunderte sich daß die Thüre aufstand, und wie es in die Stube trat, so kam es ihm so seltsam darin vor, daß es dachte „ei, du mein Gott, wie ängstlich wird mirs heute zu Muth, und bin sonst so gerne bei der Großmutter!“
      Es rief „guten Morgen,“ bekam aber keine Antwort.
      Darauf gieng es zum Bett und zog die Vorhänge zurück: da lag die Großmutter, und hatte die Haube tief ins Gesicht gesetzt und sah so wunderlich aus.
      „Ei, Großmutter, was hast du für große Ohren!“
      „Daß ich dich besser hören kann.“
    points:
      - Der Leser weiß, dass der Wolf im Bett liegt, Rotkäppchen nicht.
      - Rotkäppchen spürt, dass etwas nicht stimmt (offene Tür, „ängstlich“, keine Antwort), deutet es aber nicht.
      - "„da lag die Großmutter“: Der Erzähler bleibt bei Rotkäppchens Wahrnehmung, obwohl der Leser es besser weiß."
      - Für ein Rätsel müsste der Absatz davor fehlen; der Leser sähe nur die Zeichen (offene Tür, Haube, wunderliches Aussehen) und fragte nach der Ursache.
    explanation: |
      Die Szene lebt von dramatischer Ironie. Der Leser kennt den Wolf, Rotkäppchen ahnt nur etwas: Die Tür steht offen, niemand antwortet, sie fühlt sich „ängstlich“. Der Erzähler bleibt trotzdem bei ihrer Wahrnehmung und schreibt „da lag die Großmutter“, nicht „da lag der Wolf“. Deshalb hört der Leser schon die erste Antwort doppelt. Ließe man den Absatz weg, in dem der Wolf ins Haus geht, stünde der Leser auf Rotkäppchens Stand. Die offene Tür und die tief sitzende Haube wären dann Hinweise in einem Rätsel, und die Frage hieße „Was ist hier passiert?“ statt „Wann merkt sie es?“.
    hints:
      - Wessen Sicht übernimmt der Satz „da lag die Großmutter“?
      - Für ein Rätsel muss der Leser weniger wissen. Welcher Teil des Märchens gibt ihm seinen Vorsprung?
    resources:
      - title: Brüder Grimm, „Rothkäppchen“ (Wikisource, Ausgabe 1857)
        url: https://de.wikisource.org/wiki/Rothk%C3%A4ppchen_(1857)

  - id: spec-ops-fuenf-fragen
    type: explain
    title: Erst handeln, dann wissen
    prompt: |
      Hier ist eine Szene aus Spec Ops: The Line (Yager Development, 2012), nach Wikipedia zusammengefasst. Leg die fünf Fragen der Lektion an diese Szene. Erkläre in zwei bis vier Sätzen, was der Spieler wann weiß und was die Entwickler damit erreichen wollten.
    lang: prose
    code: |
      An einer Stelle, dem „Gate“, setzt das Team der Spielerfigur weißen Phosphor ein, um die stark bewachte Stellung am Gate zu überwinden.
      Erst danach erkennt das Team, dass es dabei eine Gruppe Zivilisten getötet hat.
      Die Entwickler hofften, Spieler würden sich über sie ärgern, weil sie die Spieler zum Töten von Zivilisten „gezwungen“ hätten.
      Die Ladebildschirme zeigen anfangs Spieltipps, werden im Lauf des Spiels zunehmend feindselig gegenüber den Taten der Spielerfigur und sprechen teils den Spieler an.
    points:
      - Nach Aussage der Entwickler ist die Handlung erzwungen; der Spieler wählt hier nicht.
      - Der Spieler erfährt erst nach der Handlung, wen sie getroffen hat; Wissen kommt nach dem Handeln.
      - Die fehlende Information ist Absicht; die Entwickler planten den Ärger des Spielers ein.
      - Die Ladebildschirme kommentieren im weiteren Verlauf die Taten der Spielerfigur zunehmend feindselig.
    explanation: |
      Nach den fünf Fragen ist diese Szene keine Entscheidung. Nach Aussage der Entwickler ist die Handlung erzwungen, und der Spieler weiß im Moment der Handlung nicht, was er auslöst. Die Folge sieht er sofort danach; im weiteren Verlauf kommentieren die Ladebildschirme die Taten der Spielerfigur zunehmend feindselig. Das Gefälle zwischen Handeln und Wissen war geplant: Laut Wikipedia hofften die Entwickler, dass sich der Ärger der Spieler gegen sie richtet, weil sie die Spieler gezwungen hätten. Ob man das als Spieler gelungen findet, ist eine Wertung. Als Handwerk zeigt die Szene, dass fehlende Information eine Wirkung hat, die man planen kann.
    hints:
      - Geh die fünf Fragen der Reihe nach durch und notiere jeweils ein Stichwort.
      - Wann erfährt der Spieler, wen der Einsatz getroffen hat?
    resources:
      - title: "Spec Ops: The Line (Wikipedia)"
        url: https://en.wikipedia.org/wiki/Spec_Ops:_The_Line

  - id: eine-gespielte-entscheidung
    type: practice
    title: Was wusstest du damals?
    prompt: |
      Wähle eine Entscheidung aus einem Spiel, das du gespielt hast. Beantworte die fünf Fragen aus deiner Erinnerung, je mit einem Satz oder Stichpunkt.
    lang: prose
    starter: |
      Spiel und Entscheidung:
      Zur Wahl stand:
      Ich wusste:
      Meine Figur wusste:
      Ich erwartete:
      Es passierte, und ich sah es (sofort, später, nie):
    checklist:
      - Jedes Feld ist ausgefüllt, mit höchstens einem Satz.
      - Unter „Ich wusste“ steht nur, was das Spiel bis zu diesem Moment gezeigt hatte, nichts aus späteren Szenen.
      - Du hältst fest, ob deine Erwartung eingetroffen ist.
      - Du sagst, ob du die Folge sofort, später oder gar nicht gesehen hast.
    explanation: |
      Die eigene Erinnerung ist ein Testlauf mit dir als Testperson. Schwierig ist das Feld „Ich wusste“, weil du heute mehr weißt als damals. Wenn deine Erwartung nicht eintraf, lohnt ein zweiter Blick, ob das Spiel dich überrascht hat (Absicht) oder ob dir eine Information fehlte (Versehen).
    hints:
      - Eine Wahl, über die du dich geärgert oder lange nachgedacht hast, eignet sich gut.
    resources:
      - title: Sid Meier, „Interesting Decisions“ (GDC 2012)
        url: https://www.gdcvault.com/play/1015756/Interesting

  - id: eigene-entscheidung-pruefen
    type: practice
    title: Fünf Fragen an deine Entscheidung
    prompt: |
      Für dein eigenes Projekt: Nimm eine Entscheidung, die du geplant oder schon geschrieben hast, und prüfe sie mit den fünf Fragen. Schreib Stichpunkte, keinen Fließtext.
    lang: prose
    starter: |
      Zur Wahl steht (und was jede Option kosten kann):
      Der Spieler weiß (und wo er es erfährt):
      Die Figur weiß:
      Der Spieler erwartet:
      Es passiert, und der Spieler sieht es (wann, wo):
    checklist:
      - Für jede Option steht, was sie kosten kann.
      - Zu jedem Punkt unter „Der Spieler weiß“ steht die Stelle, an der er es erfährt.
      - Unter „Der Spieler weiß“ steht nichts, was erst nach der Entscheidung vorkommt.
      - Für die Folge steht ein Zeitpunkt oder ein Ort, an dem der Spieler sie sieht.
      - Falls du eine Frage noch nicht beantworten kannst, steht dort „offen“ statt einer Vermutung.
    explanation: |
      Bei deinem eigenen Projekt weißt du mehr als jeder Spieler. Die Spalte „wo er es erfährt“ zwingt dich, dein Wissen von seinem zu trennen. Offene Fragen sind kein Fehler. Sie zeigen dir, was du vor einem Testlauf noch klären musst.
    hints:
      - Wenn dir zu „Der Spieler weiß“ keine Stelle einfällt, gehört der Punkt wahrscheinlich zu dir, nicht zu ihm.
