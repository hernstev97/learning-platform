id: spielerwissen
title: Spielerwissen, Figurenwissen und verständliche Entscheidungen
level: 2
minutes: 80
summary: Eine Wahl wird erst zur Entscheidung, wenn der Spieler Optionen, Einsatz und mögliche Folgen einschätzen kann – du lernst, die Wissensstände von Spieler, Figur und Designer zu trennen und jede Entscheidung mit fünf Fragen zu prüfen.
place: unterwegs
goals:
  - Du trennst die Wissensstände von Spieler, Spielerfigur und Designer und sagst für eine Szene, wer mehr weiß.
  - Du unterscheidest Rätsel, Spannung und dramatische Ironie danach, wer was weiß.
  - Du erklärst Meaningful Play nach Salen und Zimmerman und leitest daraus ab, wann eine Entscheidung verständlich ist.
  - Du unterscheidest eine Ankündigung, die den Einsatz zeigt, von einer, die das Ergebnis verrät.
  - Du prüfst eine Entscheidung mit fünf Fragen nach Optionen, Wissen, Erwartung und sichtbarer Folge.
