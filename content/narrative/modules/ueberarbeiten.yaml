lesson: |
  Regeln aus Schreibratgebern sind schnell zur Hand, etwa „Zeigen statt erzählen“ oder „Kurze Sätze“. Jede hat eine Grenze. Johann Peter Hebel rafft in „Unverhofftes Wiedersehen“ fünfzig Jahre in eine Aufzählung ([Living Handbook of Narratology, „Time“](https://www-archiv.fdm.uni-hamburg.de/lhn/node/106.html)), und eine Überarbeitung nach „Zeigen statt erzählen“ würde genau die Stelle streichen, die die Geschichte trägt. Das Beispiel steht ausführlich in [Konflikt und Szenenaufbau](/narrative/szenenaufbau).

  Ob eine Regel einem Text hilft, entscheidet die Wirkung, die er haben soll. Dieses Modul zeigt, wie du aus dieser Wirkung eigene Kriterien ableitest und den Text Schritt für Schritt daran prüfst. Auf dem Handy liest, markierst und notierst du. Umschreiben ist Arbeit für den PC, in den Werkstätten für [Szene](/narrative/werkstatt-szene) und [Dialog](/narrative/werkstatt-dialog).

  ## Überarbeiten, Redigieren, Korrigieren

  Die drei Wörter bezeichnen Arbeiten an verschiedenen Ebenen des Textes:

  - **Überarbeiten** betrifft Aufbau und Szenen: was in welcher Reihenfolge passiert, welche Szene fehlt, welche wegfallen kann, wo eine Szene beginnt und endet.
  - **Redigieren** betrifft Sätze und Wörter: Klarheit, Wiederholungen, Rhythmus, das genaue Wort.
  - **Korrigieren** betrifft Rechtschreibung, Zeichensetzung und Grammatik.

  Du arbeitest von groß nach klein: Aufbau, Szene, Satz, Wort. Jeder Satz, den du feilst, bevor du weißt, ob seine Szene bleibt, kann mit der Szene verschwinden. Außerdem sieht, wer an Wörtern arbeitet, keine Szenen. Der Blick bleibt an dem hängen, was leicht zu sehen ist, und ein Tippfehler ist leichter zu sehen als eine fehlende Wendung.

  > [!MERKE] Von groß nach klein
  > Erst Aufbau, dann Szene, dann Satz, dann Wort. Korrigieren kommt zuletzt, wenn der Text steht.

  ## Kriterien aus der beabsichtigten Wirkung

  Ein Kriterium ist eine Frage an den Text, die du mit Ja oder Nein beantwortest. Damit es zu deinem Text passt, leitest du es aus der Wirkung ab, die er haben soll. Dafür stellst du für jede Szene drei Fragen:

  - Was soll der Leser nach der Szene **wissen**?
  - Was soll er **fühlen**?
  - Was soll er sich **fragen**?

  Aus jeder Antwort wird ein Kriterium, das du prüfen kannst. Prüfbar heißt: Du zeigst auf eine Stelle im Text, oder du stellst einem Leser eine Frage und vergleichst seine Antwort mit deiner Absicht. „Der Leser kann nach der Szene sagen, was die Figur will“ ist prüfbar. „Die Szene ist spannend“ ist es nicht, denn es sagt nicht, woran du die Spannung im Text festmachst.

  Bei Gefühlen ist das schwierig. Ob jemand etwas fühlt, kannst du nicht prüfen. Du kannst aber prüfen, ob der Text die Mittel einsetzt, die du dafür gewählt hast, und ob er sie selbst zunichtemacht. „Kein Satz nennt das Gefühl der Figur beim Namen“ ist so ein Kriterium, „Der Leser erfährt vor der Figur, was ihr droht“ ein anderes.

  So wird aus einem Geschmacksurteil ein prüfbares Kriterium:

  - „Die Figur ist sympathisch“ wird zu „Der Leser kann sagen, was die Figur will und warum“.
  - „Der Dialog wirkt natürlich“ wird zu „Jede Replik hat eine Absicht, die du benennen kannst“.
  - „Der Anfang packt“ wird zu „Der erste Absatz wirft eine Frage auf, die erst später beantwortet wird“.
  - „Das Ende sitzt“ wird zu „Das Ende greift etwas auf, das früher im Text steht“.

  ### Ein Beispiel: das Ende von „Vor dem Gesetz“

  Franz Kafkas „Vor dem Gesetz“ endet mit der Antwort des Türhüters:

  > „Hier konnte niemand sonst Einlaß erhalten, denn dieser Eingang war nur für dich bestimmt. Ich gehe jetzt und schließe ihn.“

  Franz Kafka, „Vor dem Gesetz“ (1915), [Wikisource](https://de.wikisource.org/wiki/Vor_dem_Gesetz)

  Nimm an, die beabsichtigte Wirkung sei diese: Der Leser versteht erst mit dem letzten Satz, dass der Eingang nur für diesen Mann bestimmt war, und liest das Warten vor dem offenen Tor danach anders. Daraus lassen sich Kriterien ableiten, die du am Text prüfst:

  - Das Tor steht offen, bevor der Mann sich zum Warten entschließt. Ja: „Da das Tor zum Gesetz offen steht wie immer“, bückt er sich und sieht hinein.
  - Die Frage, die die Antwort auslöst, stellt der Mann erst am Ende. Ja: Seine Erfahrungen sammeln sich „zu einer Frage, die er bisher an den Türhüter noch nicht gestellt hat“.
  - Der Mann bemerkt erst zuletzt, dass niemand sonst gekommen ist. Ja: „wieso kommt es, daß in den vielen Jahren niemand außer mir Einlaß verlangt hat?“

  Alle drei beantwortest du, indem du auf eine Stelle zeigst. „Das Ende überrascht“ ließe sich nur mit einem Leser prüfen, und selbst dann wüsstest du nicht, was du ändern sollst, wenn es nicht wirkt. Deine Kriterien sind später auch die Fragen für den Testlauf: In [Testlesen und Playtest](/narrative/testlesen-playtest) prüfst du sie an Lesern, die den Text zum ersten Mal sehen.

  ## Rückwärtsgliederung: lesen, was dasteht

  Eine Gliederung schreibst du vor dem Entwurf, eine Rückwärtsgliederung (englisch Reverse Outline) danach. Du gehst den fertigen Text Abschnitt für Abschnitt durch und notierst je Abschnitt eine Zeile: was dort passiert und was sich ändert. Du notierst, was auf der Seite steht, nicht was du geplant hast.

  Die Liste zeigt Probleme, die beim Lesen im Fluss verschwinden: zwei Abschnitte, die dasselbe leisten; ein Abschnitt, in dem sich nichts ändert; ein Schritt, der fehlt, weil er nur in deinem Kopf stattfand. Auf dem Handy geht das gut, weil du nur liest und kurze Zeilen tippst.

  Hebels Text ([Wikisource](https://de.wikisource.org/wiki/Seite:Schatzkaestlein_des_rheinischen_Hausfreundes.djvu/300)), rückwärts gegliedert, in eigenen Worten:

  1. Ein Bergmann und seine Braut planen die Hochzeit.
  2. Nach dem zweiten Aufgebot kommt der Bergmann nicht aus dem Bergwerk zurück.
  3. Fünfzig Jahre vergehen in Ereignissen der Weltgeschichte und der Arbeit.
  4. Bergleute finden 1809 einen unversehrten Leichnam; niemand erkennt ihn.
  5. Die alte Braut kommt und erkennt ihren Verlobten.
  6. Sie begräbt ihn, als wäre es ihre Hochzeit.

  In jeder Zeile ändert sich etwas. Zeile 3 ist die einzige, in der die beiden Hauptfiguren nicht vorkommen. Im Fließtext wirkt sie wie ein Abschweifen, in der Liste sieht man ihre Aufgabe. In ihr vergehen die fünfzig Jahre, die der Text sonst nur nennt.

  ## Abstand, laut lesen, kürzen

  **Abstand.** Direkt nach dem Schreiben liest du, was du gemeint hast, nicht was dasteht. Mindestens eine Nacht zwischen Entwurf und Überarbeitung macht dich zu einem fremderen Leser. Für die Busfahrt eignet sich deshalb ein Text, den du vor ein paar Tagen geschrieben hast.

  **Laut lesen.** Du hörst, was das Auge überspringt: Wiederholungen, einen Satz, der für einen Atemzug zu lang ist, eine Replik, die niemand so sagen würde. Im Bus reicht es, halblaut zu lesen oder die Lippen zu bewegen. Lies so langsam, dass jedes Wort einzeln kommt.

  **Kürzen.** Fang am Anfang und am Ende einer Szene an. Oft beginnt sie vor dem ersten Satz, der etwas ändert, und endet nach dem letzten. Streich außerdem Erklärungen, die wiederholen, was die Szene schon gezeigt hat.

  Den Rat „Murder your darlings“ gab Arthur Quiller-Couch in seiner Vorlesung „On Style“ vom 28. Januar 1914, an einer Stelle, an der er erklärt, dass Stil nie aufgesetzter Schmuck sein kann:

  > Whenever you feel an impulse to perpetrate a piece of exceptionally fine writing, obey it—whole-heartedly—and delete it before sending your manuscript to press. Murder your darlings.

  Arthur Quiller-Couch, „On Style“ (1914), gedruckt in „On the Art of Writing“ (1916), [Project Gutenberg](https://www.gutenberg.org/cache/epub/17470/pg17470-images.html#id00822)

  Auf Deutsch etwa: Wenn du den Drang spürst, eine besonders schöne Stelle zu schreiben, gib ihm nach, von ganzem Herzen, und streich sie, bevor das Manuskript in den Druck geht. Gemeint ist die Stelle, die du schreibst, um schön zu schreiben, nicht jede Stelle, die du magst. Prüf deshalb Lieblingsstellen an deinen Kriterien. Trägt eine zur beabsichtigten Wirkung bei, bleibt sie; steht sie nur da, weil sie dir gefällt, streich sie.

  > [!TIP] Gestrichenes aufheben
  > Leg eine Datei für gestrichene Stellen an. Streichen fällt leichter, wenn nichts verloren geht, und manche Stelle passt später an einen anderen Ort.

  ## Fassungen, Protokoll und Notizen für den PC

  Heb jede Fassung auf, bevor du sie überarbeitest, als eigene Datei mit Nummer oder Datum oder mit [Git](/git). Dann kannst du zurück, wenn eine Änderung die Wirkung verschlechtert, und zwei Fassungen nebeneinander lesen.

  Zu jeder Fassung gehört ein kurzes Änderungsprotokoll. Jeder Eintrag sagt, was du geändert hast, warum, und welches Kriterium dahintersteht:

  - **Was:** ersten Absatz gestrichen
  - **Warum:** Die Szene begann vor dem Konflikt.
  - **Kriterium:** Im ersten Absatz will die Figur schon etwas.

  Ohne das Warum taugt das Protokoll wenig. Ohne Grund änderst du dieselbe Stelle in der nächsten Runde zurück. Mit Grund siehst du nach einigen Texten, welche Fehler bei dir wiederkehren, und hast deine eigene Liste für den nächsten Entwurf.

  Unterwegs schreibst du Notizen für Änderungen statt der Änderungen selbst. Auf dem Handy umzuschreiben heißt, an einer kleinen Tastatur Sätze zu bauen, ohne den Zusammenhang zu sehen. Das Handy taugt zum Lesen, Markieren und Notieren. Eine Notiz nennt die Stelle, was du siehst, und das Kriterium, etwa „Absatz 3, Figur nennt ihr Gefühl, Kriterium 2“. Am PC arbeitest du die Notizen in getrennten Durchgängen ab.

  > [!NOTE] Lange Notizen
  > Wird eine Notiz länger als ein paar Zeilen, schreib sie in deine Notizen-App. Hast du die Plattform ohne Netz gestartet, gelten Eingaben hier nur bis zum Neuladen.

  ## Warum KI hier nur korrigiert

  Ein Sprachprogramm kann einen Absatz in Sekunden umformulieren. Jede übernommene Formulierung ist aber ein Satz, den du nicht geschrieben hast. Nach vielen übernommenen Vorschlägen klingt der Text nach dem Werkzeug statt nach dir, und du hast nicht gelernt, die Stelle selbst zu lösen. Stilvorschläge verschieben so die eigene Stimme, auch wenn jeder einzelne harmlos aussieht.

  Dasselbe gilt für Urteile über die Wirkung. Sagt ein Programm, die Szene sei „spannend“, hast du ein Geschmacksurteil, das du nicht prüfen kannst, und deine eigenen Kriterien bleiben ungenutzt. In diesem Kurs kommen Kriterien, Markierungen und Änderungen deshalb von dir. Rechtschreibung, Zeichensetzung und Grammatik darfst du auf Wunsch prüfen lassen, ganz am Ende. Das ist Korrigieren, die kleinste der drei Arbeiten, und es ändert nicht, was du sagst.

  ## Häufige Fehler

  - **Bei den Wörtern anfangen.** Du feilst einen Absatz zum dritten Mal und weißt noch nicht, ob die Szene bleibt. Mach zuerst die Rückwärtsgliederung.
  - **Kriterien, die Geschmack messen.** Bei „flüssig“, „stimmig“ oder „packend“ kannst du auf keine Stelle zeigen, die das Kriterium erfüllt oder verletzt. Frag dich, woran ein Leser es merken würde, und schreib das auf.
  - **Fremde Regeln ungeprüft übernehmen.** „Zeigen statt erzählen“ ist eine Regel mit Grenze, wie Hebel zeigt. Prüf jede Regel an der Wirkung, die dein Text haben soll.
  - **Alles auf einmal prüfen.** Du suchst in einem Durchgang Lücken im Aufbau, Wiederholungen und Kommas und findest vor allem Kommas. Nimm dir je Durchgang eine Ebene vor.
  - **Kein Ende finden.** Ohne Kriterien hörst du auf, wenn du müde bist. Mit Kriterien bist du fertig, wenn alle erfüllt sind.
  - **Fassungen überschreiben.** Du willst zu einer früheren Lösung zurück und hast sie nicht mehr. Sichere vor jedem Durchgang.

  > [!PRAXIS] Erst der Ablauf, dann der Ton
  > Bei der Questreihe „Family Matters“ in The Witcher 3, bekannt als „The Bloody Baron“, entwarf Paweł Sasko den Ablauf und skriptete ihn in der Engine; Karolina Stachyra schrieb Dialoge und Zwischensequenzen. Danach wurde die Quest getestet, und die Projektleiter nahmen sie ab. Laut PC Gamer änderte sich die Quest gegenüber Saskos erster Fassung auf Papier wenig. Sasko sagt, später habe sich der Ton kleiner Dinge geändert, und Dutzende Ideen aus dem Team seien eingeflossen ([PC Gamer, 2020](https://www.pcgamer.com/how-the-witcher-3s-best-quest-was-made/)). Der Ablauf stand also früh, die späteren Änderungen betrafen Einzelheiten.

  ## Zusammenfassung

  - Überarbeiten betrifft Aufbau und Szenen, Redigieren Sätze und Wörter, Korrigieren Rechtschreibung und Grammatik.
  - Arbeite von groß nach klein: Aufbau, Szene, Satz, Wort.
  - Kriterien leitest du aus der beabsichtigten Wirkung ab: Was soll der Leser wissen, fühlen, fragen?
  - Ein Kriterium ist prüfbar, wenn du auf eine Textstelle zeigen oder einem Leser eine Frage stellen kannst.
  - Die Rückwärtsgliederung zeigt, was im Entwurf steht, nicht was du geplant hast.
  - „Murder your darlings“ meint Stellen, die nur schön sein wollen; Lieblingsstellen prüfst du an deinen Kriterien.
  - Jede Änderung bekommt im Protokoll einen Grund.
  - KI prüft auf Wunsch Rechtschreibung und Grammatik, sonst nichts.
exercises:
  - id: von-gross-nach-klein
    type: order
    title: Wo fängst du an?
    prompt: |
      Bring die Prüfschritte in die Reihenfolge, in der du einen Entwurf durchgehst.
    lang: prose
    lines: |
      Aufbau: Stimmt die Reihenfolge der Szenen, fehlt eine, kann eine weg?
      Szene: Ändert sich in jeder Szene etwas?
      Satz: Braucht die Szene jeden Satz?
      Wort: Steht da das genaue Wort?
      Korrigieren: Rechtschreibung, Zeichensetzung, Grammatik
    hints:
      - Was du zuerst prüfst, sollte dir die meiste Arbeit ersparen.
      - Ein Komma in einem Absatz, der später wegfällt, war umsonst gesetzt.
    explanation: |
      Jede Ebene enthält die nächste. Fällt eine Szene weg, fallen ihre Sätze und Wörter mit, und jede Arbeit daran war umsonst. Deshalb prüfst du zuerst die Ebene, auf der die größten Änderungen möglich sind, und korrigierst ganz am Ende, wenn der Text steht. Außerdem schützt die Reihenfolge den Blick. Wer mit Kommas beginnt, sieht keine fehlende Szene mehr.

  - id: welche-arbeit
    type: choice
    title: Was tust du gerade?
    prompt: |
      Du streichst die ersten beiden Absätze einer Szene, weil sie vor dem Konflikt beginnen. Welche Arbeit ist das?
    options:
      - text: Überarbeiten
        correct: true
        why: Wo eine Szene beginnt und endet, gehört zum Aufbau. Du änderst, was die Szene enthält, nicht wie ein Satz klingt.
      - text: Redigieren
        correct: false
        why: Redigieren arbeitet an Sätzen und Wörtern einer Szene, deren Aufbau bleibt.
      - text: Korrigieren
        correct: false
        why: Korrigieren betrifft Rechtschreibung, Zeichensetzung und Grammatik. Die Absätze können fehlerfrei sein und die Szene trotzdem zu früh beginnen lassen.
    explanation: |
      Die drei Arbeiten unterscheiden sich durch die Ebene, an der sie ansetzen. Streichen allein sagt noch nichts. Wer ein Wort streicht, redigiert; wer zwei Absätze am Szenenanfang streicht, ändert den Aufbau. Entscheidend ist der Grund. Hier geht es darum, wo die Szene beginnt, also um ihren Aufbau.

  - id: pruefbar-oder-geschmack
    type: choice
    title: Woran lässt sich das prüfen?
    prompt: |
      Welche Kriterien kannst du prüfen, indem du auf eine Textstelle zeigst oder einem Leser eine Frage stellst?
    options:
      - text: Der Leser kann nach der Szene sagen, was die Figur will.
        correct: true
        why: Du fragst einen Leser und vergleichst seine Antwort mit deiner Absicht.
      - text: Kein Satz nennt das Gefühl der Figur beim Namen.
        correct: true
        why: Du gehst den Text durch und zeigst auf jeden Satz, der es tut, oder findest keinen.
      - text: Die Szene ist spannend.
        correct: false
        why: Spannung ist eine Wirkung. Das Kriterium sagt nicht, woran du sie im Text festmachst, und wenn sie fehlt, weißt du nicht, was du ändern sollst.
      - text: Der Dialog wirkt natürlich.
        correct: false
        why: „Natürlich“ ist ein Eindruck. Prüfbar wird er erst, wenn du sagst, woran er hängt, etwa mit dem Kriterium „Jede Replik hat eine Absicht, die du benennen kannst“.
      - text: Der Text hat einen guten Rhythmus.
        correct: false
        why: Was „gut“ ist, bleibt offen. Prüfbar wäre zum Beispiel, ob beim lauten Lesen ein Satz zu lang für einen Atemzug ist.
    hints:
      - Stell dir vor, du müsstest jemandem zeigen, dass das Kriterium erfüllt ist. Worauf würdest du zeigen?
    resources:
      - title: "Jakob Nielsen · Thinking Aloud: The #1 Usability Tool (Nielsen Norman Group)"
        url: https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/
    explanation: |
      Ein prüfbares Kriterium sagt dir, wo du hinsehen oder was du fragen musst, und es sagt dir auch, was zu tun ist, wenn es nicht erfüllt ist. „Spannend“, „natürlich“ und „guter Rhythmus“ beschreiben, wie ein Text auf jemanden wirkt, aber nicht, woran diese Wirkung im Text hängt. Du kannst sie prüfbar machen, indem du fragst, woran ein Leser die Wirkung merken würde.

  - id: murder-your-darlings
    type: choice
    title: Was ist mit „darlings“ gemeint?
    prompt: |
      Arthur Quiller-Couch sagte 1914 in seiner Vorlesung „On Style“: „Murder your darlings.“ Was meint er im Zusammenhang der Stelle?
    options:
      - text: Streich Stellen, die du geschrieben hast, um besonders schön zu schreiben, bevor der Text in den Druck geht.
        correct: true
        why: Der Satz davor rät, „a piece of exceptionally fine writing“ zu schreiben und vor dem Druck zu streichen. Gemeint ist Schmuck, den der Text nicht braucht.
      - text: Streich jede Stelle, die dir gefällt.
        correct: false
        why: Er zielt auf die Stelle, die nur schön sein will. Eine Stelle, die du magst und die der Wirkung dient, bleibt.
      - text: Lass deine Lieblingsfiguren sterben.
        correct: false
        why: Das Wort „darlings“ lädt zu dieser Lesart ein. In der Vorlesung geht es um Stil, nicht um Figuren oder Handlung.
      - text: Unterdrück den Drang, schön zu schreiben.
        correct: false
        why: Er rät das Gegenteil. Man soll dem Drang nachgeben („obey it“) und erst vor dem Druck streichen.
    explanation: |
      Quiller-Couch gibt den Rat an einer Stelle, an der er erklärt, dass Stil nie aufgesetzter Schmuck sein kann. Der ganze Satz lautet: „Whenever you feel an impulse to perpetrate a piece of exceptionally fine writing, obey it—whole-heartedly—and delete it before sending your manuscript to press.“ Erst danach folgt „Murder your darlings.“ Für deine Überarbeitung heißt das: Prüf Lieblingsstellen an der Wirkung, die der Text haben soll, nicht an deinem Gefallen.
    resources:
      - title: Arthur Quiller-Couch, „On Style“ (1914), in „On the Art of Writing“ (Project Gutenberg)
        url: "https://www.gutenberg.org/cache/epub/17470/pg17470-images.html#id00822"

  - id: begriffe-ueberarbeiten
    type: gap
    title: Drei Arbeiten, ein Werkzeug
    prompt: |
      Ergänze die Begriffe.
    lang: prose
    code: |
      Wer Aufbau und Szenen ändert, ⟦überarbeitet⟧. Wer Sätze und Wörter verbessert, ⟦redigiert⟧. Wer Rechtschreibung und Zeichensetzung prüft, ⟦korrigiert⟧. Eine Zeile je Abschnitt, nach dem Entwurf notiert, ergibt eine ⟦Rückwärtsgliederung⟧.
    gaps:
      - label: Aufbau und Szenen
        hint: Die größte der drei Arbeiten.
        accept: [ueberarbeitet]
      - label: Sätze und Wörter
        hint: Das tut eine Redaktion mit einem Text.
        accept: [lektoriert]
      - label: Rechtschreibung
        hint: Die kleinste der drei Arbeiten.
      - label: Gliederung nach dem Entwurf
        hint: Eine Gliederung in die andere Richtung.
        accept: [Reverse Outline, Rueckwaertsgliederung]
    explanation: |
      Die drei Verben trennen die Ebenen: Aufbau und Szene, Satz und Wort, Rechtschreibung und Zeichensetzung. Die Rückwärtsgliederung ist das Werkzeug für die oberste Ebene. Sie zeigt, was im Entwurf passiert, und damit, ob Aufbau und Szenen stimmen, bevor du an Sätzen arbeitest.

  - id: wirkung-benennen
    type: practice
    title: Wissen, fühlen, fragen
    prompt: |
      Wähle einen eigenen Text, den du überarbeiten willst, etwa eine Szene aus deinem eigenen Projekt. Schreib in je einem Satz, was der Leser danach wissen, fühlen und sich fragen soll. Den Text selbst schreibst du hier nicht ab.
    lang: prose
    starter: |
      Text:
      Wissen:
      Fühlen:
      Fragen:
    checklist:
      - Jede der drei Zeilen ist ein ganzer Satz über den Leser.
      - Die Zeile „Wissen“ nennt etwas, das der Text mitteilt oder zeigt.
      - Die Zeile „Fragen“ endet mit einem Fragezeichen.
    explanation: |
      Die drei Sätze beschreiben die Wirkung, an der du den Text später misst. Sie sind noch keine Kriterien; daraus machst du in der Übung „Aus Wirkung werden Kriterien“ Fragen, die du mit Ja oder Nein beantwortest. Wer die Wirkung nicht benennt, prüft am Ende nach Gefühl oder nach fremden Regeln.

  - id: kriterium-geschmack
    type: bug
    title: Ein Kriterium, das nichts prüft
    prompt: |
      Kriterien für eine Szene, in der eine Mitarbeiterin an ihrem letzten Arbeitstag den Schreibtisch räumt (Lehrbeispiel). Die beabsichtigte Wirkung: Der Leser merkt, dass sie nicht freiwillig geht, und fragt sich, wie es für sie weitergeht. Eine Zeile der Liste ist ein Geschmacksurteil, das man weder an einer Textstelle noch mit einer Frage an einen Leser prüfen kann. Finde sie.
    lang: prose
    code: |
      Der Leser kann nach der Szene sagen, dass sie nicht freiwillig geht.
      Kein Satz nennt ihr Gefühl beim Namen.
      Der Kollege, der sie verabschiedet, erwähnt den Grund nicht.
      Die Szene hat eine angenehm melancholische Stimmung.
      Ein Testleser fragt nach der Szene von sich aus, wohin sie geht.
    lines: [4]
    hints:
      - Bei welcher Zeile könntest du nicht auf eine Stelle zeigen?
    explanation: |
      „Angenehm melancholisch“ beschreibt einen Eindruck. Ob die Szene so wirkt, lässt sich weder an einer Stelle zeigen noch so erfragen, dass du wüsstest, was du ändern sollst. Die Zeilen 2 und 3 prüfst du am Text, indem du die Sätze durchgehst. Die Zeilen 1 und 5 prüfst du mit einem Testleser: Du fragst ihn, oder du beobachtest, ob er die Frage von sich aus stellt. Um Zeile 4 prüfbar zu machen, müsstest du sagen, woran die Stimmung im Text hängt.
    resources:
      - title: Liz Lerman, Critical Response Process
        url: https://lizlerman.com/critical-response-process/

  - id: protokoll-ohne-grund
    type: bug
    title: Ein Eintrag ohne Warum
    prompt: |
      Ein Änderungsprotokoll (Lehrbeispiel). Jeder Eintrag soll sagen, was geändert wurde und warum. Finde den Eintrag, dem der Grund fehlt.
    lang: prose
    code: |
      Ersten Absatz gestrichen – die Szene begann vor dem Konflikt.
      Zweite Replik gekürzt – sie passte nicht in eine Textbox.
      Beschreibung des Treppenhauses umgeschrieben.
      Namen der Nachbarin vereinheitlicht – er stand zweimal verschieden da.
      „Sie war wütend“ gestrichen – die zugeschlagene Tür zeigt es schon.
    lines: [3]
    hints:
      - Lies jeden Eintrag nach dem Gedankenstrich.
    explanation: |
      Zeile 3 sagt, was geändert wurde, aber nicht warum. In zwei Wochen weißt du nicht mehr, ob die neue Beschreibung ein Problem gelöst hat oder nur anders ist, und änderst sie womöglich zurück. Die anderen Einträge nennen den Grund nach dem Gedankenstrich. Commit-Nachrichten folgen demselben Gedanken: Pro Git rät, darin die Motivation für eine Änderung zu erklären.
    resources:
      - title: Pro Git · Commit Guidelines
        url: "https://git-scm.com/book/en/v2/Distributed-Git-Contributing-to-a-Project#_commit_guidelines"

  - id: hebel-wiedererkennen
    type: explain
    title: Niemand kennt ihn, bis sie kommt
    prompt: |
      In diesem Ausschnitt aus Hebels „Unverhofftes Wiedersehen“ (der Erstdruck von 1811 schreibt „Unverhoftes“) wird der Bergmann nach fünfzig Jahren gefunden. Welche Wirkung ist hier beabsichtigt, und woran würdest du prüfen, ob der Text sie erreicht? Antworte in zwei bis vier Sätzen und nenne mindestens ein Kriterium.
    lang: prose
    code: |
      Als man ihn aber zu Tag ausgefördert hatte, Vater und Mutter, Gefreundte und Bekannte waren schon lange todt, kein Mensch wollte den schlafenden Jüngling kennen oder etwas von seinem Unglück wissen, bis die ehemalige Verlobte des Bergmanns kam, der eines Tages auf die Schicht gegangen war und nimmer zurückkehrte.
      Grau und Zusammengeschrumpft kam sie an einer Krücke an den Platz und erkannte ihren Bräutigam; und mehr mit freudigem Entzücken als mit Schmerz sank sie auf die geliebte Leiche nieder, und erst als sie sich von einer langen heftigen Bewegung des Gemüths erholt hatte, „es ist mein Verlobter,“ sagte sie endlich, „um den ich fünfzig Jahre lang getrauert hatte, und den mich Gott noch einmal sehen läßt vor meinem Ende. Acht Tage vor der Hochzeit ist er unter die Erde gegangen und nimmer herauf gekommen.“
    points:
      - Der Text lässt fragen, ob noch jemand den Toten erkennt, und hält die Antwort zurück („kein Mensch wollte den schlafenden Jüngling kennen“).
      - Die gealterte Verlobte neben dem „schlafenden Jüngling“ macht die fünfzig Jahre sichtbar.
      - Ihre Freude statt Schmerz widerspricht der Erwartung und lenkt den Blick auf ihre Treue.
      - Ein prüfbares Kriterium zeigt auf eine Stelle, etwa, dass zwischen Fund und Erkennen ein Satz steht, in dem ihn niemand erkennt.
    hints:
      - Was weiß der Leser schon, was die Umstehenden nicht wissen?
      - Vergleich, wie Hebel die beiden beschreibt.
    explanation: |
      Der Ausschnitt baut auf eine Frage: Wird ihn noch jemand erkennen? Hebel hält die Antwort zurück. Erst zählt er auf, wer schon tot ist, dann heißt es „kein Mensch wollte den schlafenden Jüngling kennen“, und erst danach kommt die Verlobte. Ihr Auftritt, „Grau und Zusammengeschrumpft kam sie an einer Krücke“, stellt die fünfzig Jahre neben den Jüngling, und der Leser sieht die Zeit an zwei Körpern. Dass sie „mehr mit freudigem Entzücken als mit Schmerz“ niedersinkt, widerspricht der Erwartung und richtet den Blick auf ihre Treue. Prüfbare Kriterien wären etwa: Zwischen Fund und Erkennen steht ein Satz, in dem niemand ihn kennt. Oder: Ihr Alter und seine Jugend stehen im selben Absatz.
    resources:
      - title: Johann Peter Hebel, „Unverhoftes Wiedersehen“ (Erstdruck 1811, Wikisource)
        url: https://de.wikisource.org/wiki/Seite:Schatzkaestlein_des_rheinischen_Hausfreundes.djvu/300

  - id: wiederholung-kuerzen
    type: explain
    title: Zweimal dieselbe Frage
    prompt: |
      Ein Lehrbeispiel mit einer Wiederholung. Jemand will beim Kürzen die zweite Frage der Mutter streichen, weil sie nur wiederholt, was schon dasteht. Was ginge verloren? Nenne die Wirkung der Wiederholung und ein Kriterium, mit dem du die Kürzung prüfst. Zwei bis vier Sätze.
    lang: prose
    code: |
      Der Zug hat zwanzig Minuten Verspätung.
      „Fährst du wirklich?“, fragt die Mutter.
      „Ja“, sagt Jonas.
      Die Anzeige springt auf dreißig Minuten.
      „Fährst du wirklich?“, fragt die Mutter.
      „Ja“, sagt Jonas und nimmt den Koffer in die andere Hand.
    points:
      - Die zweite Frage wiederholt den Wortlaut, aber nicht die Lage, denn die Verspätung ist inzwischen gewachsen.
      - Durch die Wiederholung wird aus der Frage eine Bitte; die Mutter hofft auf eine andere Antwort, ohne das zu sagen.
      - Jonas' Antwort bleibt gleich, nur seine Geste ändert sich; die Spannung steckt in diesem Unterschied.
      - Ob die Wiederholung bleibt, entscheidet die beabsichtigte Wirkung, nicht die Regel „Wiederholungen streichen“.
      - Ein Kriterium für die Kürzung lässt sich mit einem Leser prüfen, etwa ob er sagen kann, was die Mutter will, obwohl sie es nicht ausspricht.
    hints:
      - Was hat sich zwischen den beiden Fragen geändert?
      - Lies beide Antworten von Jonas genau.
    explanation: |
      Beim ersten Mal ist „Fährst du wirklich?“ eine Frage. Beim zweiten Mal, nach der längeren Verspätung, ist sie eine Bitte: Die Mutter nutzt die gewonnene Zeit, um es noch einmal zu versuchen, und sagt dabei nicht, dass sie ihn halten will. Jonas antwortet mit demselben Wort, aber der Griff zum Koffer zeigt, dass die Frage ihn erreicht. Streichst du die zweite Frage, bleibt eine Auskunft übrig, und der Subtext ist weg. Ein Kriterium wäre: Ein Testleser kann nach der Szene sagen, was die Mutter will. Mit der Wiederholung steht die Antwort im Text, ohne sie hängt sie an der Deutung des Lesers. Wiederholungen streichst du, wenn sie nichts tragen; diese trägt die Szene.
    resources:
      - title: Arthur Quiller-Couch, „On Style“ (1914), in „On the Art of Writing“ (Project Gutenberg)
        url: "https://www.gutenberg.org/cache/epub/17470/pg17470-images.html#id00822"

  - id: drei-kriterien
    type: practice
    title: Aus Wirkung werden Kriterien
    prompt: |
      Nimm deine drei Sätze aus „Wissen, fühlen, fragen“. Mach aus jedem ein Kriterium, das du mit Ja oder Nein beantworten kannst, indem du auf eine Stelle im Text zeigst oder einem Leser eine Frage stellst.
    lang: prose
    starter: |
      Kriterium aus „wissen“:
      Kriterium aus „fühlen“:
      Kriterium aus „fragen“:
    checklist:
      - Jedes Kriterium lässt sich mit Ja oder Nein beantworten.
      - Kein Kriterium enthält ein Geschmackswort wie „spannend“, „flüssig“ oder „stimmig“.
      - Für jedes Kriterium weißt du, ob du es am Text oder mit einem Leser prüfst.
      - Das Kriterium aus „fühlen“ beschreibt ein Mittel im Text, nicht das Gefühl selbst.
    hints:
      - Frag bei jedem Kriterium, ob du auf eine Stelle zeigen kannst oder einen Leser fragen musst.
    explanation: |
      Ein Kriterium, das aus der eigenen Wirkung kommt, passt zu deinem Text. Die Ja-Nein-Form zwingt dich, genau zu sagen, was du prüfst. Beim Gefühl prüfst du das Mittel, weil sich das Gefühl selbst nicht prüfen lässt. Dieselben Kriterien nimmst du später in den Testlauf mit; im Critical Response Process von Liz Lerman stellt der Autor seine eigenen Fragen, und das sind diese.
    resources:
      - title: Liz Lerman, Critical Response Process
        url: https://lizlerman.com/critical-response-process/

  - id: rueckwaertsgliederung
    type: practice
    title: Was steht wirklich da?
    prompt: |
      Nimm einen eigenen Text, den du vor mindestens einem Tag geschrieben hast, am besten den aus „Wissen, fühlen, fragen“. Lies ihn und schreib für höchstens fünf Abschnitte je eine Zeile: was dort passiert und was sich ändert. Ist der Text länger, nimm die ersten fünf Abschnitte. Notier, was dasteht, nicht was du geplant hast.
    lang: prose
    starter: |
      1.
      2.
      3.
      4.
      5.
      Aufgefallen:
    checklist:
      - Jede Zeile beschreibt einen Abschnitt in einem Satz.
      - Jede Zeile nennt, was sich im Abschnitt ändert, oder ist mit „keine Änderung“ markiert.
      - Unter „Aufgefallen“ steht eine Stelle, die doppelt ist, in der sich nichts ändert oder vor der ein Schritt fehlt, oder der Satz, dass du keine gefunden hast.
    explanation: |
      Beim Lesen im Fluss füllt dein Kopf die Lücken mit dem, was du geplant hast. Eine Zeile pro Abschnitt zwingt dich, nur aufzuschreiben, was auf der Seite steht. Abschnitte ohne Änderung, doppelte Abschnitte und fehlende Schritte sieht man in der Liste, nicht im Text. Was dir auffällt, ist Material für die nächste Übung.
    resources:
      - title: Johann Peter Hebel, „Unverhoftes Wiedersehen“ (Erstdruck 1811, Wikisource)
        url: https://de.wikisource.org/wiki/Seite:Schatzkaestlein_des_rheinischen_Hausfreundes.djvu/300

  - id: notizen-fuer-den-pc
    type: practice
    title: Markieren statt umschreiben
    prompt: |
      Lies denselben Text noch einmal mit deinen drei Kriterien. Notier höchstens fünf Stellen, die ein Kriterium verletzen, je in einer Zeile: wo, was du siehst, welches Kriterium. Formulier nichts um; das machst du am PC in [Werkstatt: eine Szene schreiben und überarbeiten](/narrative/werkstatt-szene) oder [Werkstatt: Dialog und Schauplatz](/narrative/werkstatt-dialog).
    lang: prose
    starter: |
      Stelle – was ich sehe – Kriterium:
    checklist:
      - Jede Notiz nennt eine Stelle, die du wiederfindest, etwa Absatz und Satzanfang.
      - Jede Notiz nennt eins deiner Kriterien.
      - Keine Notiz enthält einen umformulierten Satz.
      - Die Notizen liegen dort, wo du sie am PC wiederfindest.
    explanation: |
      Unterwegs hast du Zeit zum Lesen, aber keinen Platz zum Umschreiben. Eine Notiz mit Stelle und Kriterium hält fest, was du gesehen hast, ohne dass du an einer kleinen Tastatur Sätze baust. Das Kriterium in der Notiz sagt dir am PC, in welchem Durchgang du die Stelle bearbeitest, und später im Protokoll, warum du sie geändert hast.
