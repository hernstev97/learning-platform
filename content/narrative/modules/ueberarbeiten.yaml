id: ueberarbeiten
title: Überarbeiten mit eigenen Kriterien
level: 2
minutes: 75
summary: Du leitest aus der Wirkung, die ein Text haben soll, prüfbare Kriterien ab und überarbeitest von groß nach klein, mit Rückwärtsgliederung, Abstand, lautem Lesen, Kürzen und einem Protokoll, das festhält, was du geändert hast und warum.
place: unterwegs
goals:
  - Du unterscheidest Überarbeiten, Redigieren und Korrigieren und arbeitest von groß nach klein.
  - Du leitest aus der beabsichtigten Wirkung eines Textes Kriterien ab, die du an einer Textstelle oder mit einer Frage an einen Leser prüfen kannst.
  - Du erkennst Kriterien, die nur ein Geschmacksurteil sind.
  - Du setzt Rückwärtsgliederung, Abstand, lautes Lesen und Kürzen gezielt ein.
  - Du führst Fassungen und ein Änderungsprotokoll, in dem jede Änderung einen Grund hat.
  - Du begründest, warum KI beim Überarbeiten höchstens Rechtschreibung und Grammatik prüft.
