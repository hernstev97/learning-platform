id: folgen-anreize
title: Erzählerische Folgen und mechanische Anreize
level: 3
minutes: 85
summary: Was ein Spiel belohnt, erzählt mit – du lernst an BioShock, Undertale, Frostpunk und anderen Spielen, wann Anreiz und Geschichte einander widersprechen und wie Design den Widerspruch absichtlich zum Dilemma macht.
place: unterwegs
goals:
  - Du bestimmst für eine Entscheidung den mechanischen Anreiz und die erzählerische Aussage und prüfst, ob beide in dieselbe Richtung zeigen.
  - Du erklärst ludonarrative Dissonanz an Clint Hockings Kritik an BioShock und sagst, wo Hocking den Widerspruch sieht.
  - Du unterscheidest ein gewolltes Dilemma von einer Dissonanz, die das Spiel nicht bearbeitet.
  - Du beschreibst, wie Undertale, Papers, Please und Frostpunk moralische Kosten in Mechanik übersetzen.
  - Du begründest, was ein Moralmeter mit einer Wahl macht und was ein Spiel ohne richtige Antwort wie Pentiment anders macht.
resources:
