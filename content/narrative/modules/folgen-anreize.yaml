    url: https://web.archive.org/web/20240112180255/https://clicknothing.typepad.com/click_nothing/2007/10/ludonarrative-d.html
  - title: Undertale · About (offizielle Seite)
    url: https://undertale.com/about/
  - title: Frostpunk · Steam-Seite von 11 bit studios
    url: https://store.steampowered.com/app/323190/Frostpunk/
  - title: Shacknews · Josh Sawyer über die fehlende richtige Antwort in Pentiment
    url: https://www.shacknews.com/article/146276/pentiment-josh-sawyer-no-correct-answer
  - title: DiGRA · Miguel Sicart, „Beyond Choices“ (2013)
    url: https://digra.org/book-beyond-choices-the-design-of-ethical-gameplay-by-miguel-sicart/
lesson: |
  In BioShock (2007) steht der Spieler mehrmals vor derselben Wahl: Er kann eine Little Sister ernten oder retten. Ernten bringt 160 ADAM, Retten 80 ([GameBanshee](https://www.gamebanshee.com/bioshock/denizens/littlesister.php)). Unabhängig davon, was die Geschichte über diese Wahl erzählt, bringt Ernten das Doppelte.

  Wer auf Fortschritt hin spielt, liest Belohnungen als Rat. Ein Anreiz wirkt bei jeder Wiederholung, ein Satz im Dialog einmal. Dieses Modul zeigt an veröffentlichten Spielen, wie Anreize eine Geschichte stützen oder ihr widersprechen und wie Designer beides mit Absicht gegeneinander stellen. Ob der Spieler genug weiß, um überhaupt zu wählen, behandelt das Modul [Spielerwissen](/narrative/spielerwissen).

  ## Anreiz und Aussage: was das System belohnt

  Jede Wahl im Spiel hat zwei Seiten. Der **Anreiz** ist, was die Mechanik dafür gibt oder nimmt: Ressourcen, Fähigkeiten, Zeit, Zugang. Die **Aussage** ist, was die Geschichte über die Wahl erzählt: wie Figuren reagieren, welches Ende folgt, was als richtig erscheint.

  Zeigen beide in dieselbe Richtung, lohnt sich die gute Tat auch mechanisch. Der Spieler muss nichts abwägen, die Wahl ist leicht. Das kann gewollt sein, etwa wenn eine Szene vor allem zeigen soll, wer die Figur ist. Zeigen Anreiz und Aussage in verschiedene Richtungen, gibt es zwei Fälle.

  - Das Spiel will den Widerspruch. Der Spieler soll zwischen Vorteil und Wert wählen und spüren, was es ihn kostet. Das ist ein **Dilemma**.
  - Das Spiel will ihn nicht oder bearbeitet ihn nicht. Mechanik und Geschichte sagen Verschiedenes, und der Spieler muss sich aussuchen, welcher Stimme er glaubt. Das ist **Dissonanz**.

  Der Unterschied liegt nicht in der Mechanik. Er liegt darin, ob das Spiel den Widerspruch kennt und aufgreift: Figuren reagieren auf den Preis, ein Ende rechnet ihn ab, eine Anzeige macht ihn sichtbar.

  > [!MERKE] Dilemma oder Dissonanz
  > Ein Dilemma stellt Anreiz und Wert absichtlich gegeneinander und greift den Preis in der Geschichte auf. Eine Dissonanz entsteht, wenn Mechanik und Geschichte Verschiedenes sagen und das Spiel den Widerspruch nicht bearbeitet.

  > [!TIP] Der Optimierer-Test
  > Stell dir einen Spieler vor, der nur auf Zahlen und Fortschritt schaut. Welche Option wählt er? Ist es die Option, die die Geschichte als falsch darstellt, und greift die Geschichte das nirgends auf, liegt eine Dissonanz vor.

  ## Ludonarrative Dissonanz: Hocking über BioShock

  Clint Hocking beschrieb 2007 in seinem Blog „Click Nothing“ eine „ludonarrative dissonance“ in BioShock. Er schreibt ausdrücklich eine Kritik, keine Rezension, und lobt das Spiel im selben Text. Sein Argument beruht auf zwei Verträgen, die das Spiel mit dem Spieler schließt.

  Den spielerischen (ludischen) Vertrag fasst er als „seek power and you will progress“: Wer Macht sucht, kommt voran. Die Little Sisters machen diesen Vertrag erlebbar. Wer erntet, bekommt mehr ADAM und handelt aus Eigeninteresse. Hocking schreibt, er habe das Thema des Spiels an dieser Stelle über die Mechanik gespürt. Für ihn funktioniert dieser Teil.

  Den erzählerischen Vertrag fasst er als „help Atlas and you will progress“: Wer der Figur Atlas hilft, kommt voran. Hier sieht Hocking den Bruch. Die Mechanik lässt dem Spieler die Freiheit, Little Sisters zu retten oder zu ernten. Die Geschichte lässt ihm keine Wahl, ob er Atlas hilft; wer weiterspielen will, tut, was Atlas sagt. Hocking fasst zusammen:

  > „Bioshock seems to suffer from a powerful dissonance between what it is about as a game, and what it is about as a story.“

  Clint Hocking, „Ludonarrative Dissonance in Bioshock“ (7. Oktober 2007), [Click Nothing, archivierte Fassung](https://web.archive.org/web/20240112180255/https://clicknothing.typepad.com/click_nothing/2007/10/ludonarrative-d.html)

  Fürs Handwerk zählt, wo Hocking die Dissonanz verortet. Sie liegt bei ihm im Verhältnis zwischen der Freiheit der Mechanik und dem Zwang der Geschichte, nicht in der Little-Sister-Wahl selbst.

  Die Little-Sister-Wahl verteilt Anreiz und Aussage über die Zeit. Nach jeweils drei geretteten Little Sisters liegt ein Geschenk von Tenenbaum im nächsten Gatherer's-Garden-Automaten, „a gift of Adam and other goodies“ ([GameBanshee](https://www.gamebanshee.com/bioshock/denizens/littlesister.php)). Retten kostet sofort und gibt später einen Teil zurück. Hocking hält es auch auf lange Sicht nicht für das mechanisch bessere Geschäft und verweist dafür auf eine Datenauswertung.

  Erzählerisch bewertet das Ende die Wahl. Wer alle rettet, sieht das gute Ende. Wer eine oder mehrere erntet, sieht das schlechte, und dessen Ton wird mit der Zahl der Ernten härter ([Wikipedia](https://en.wikipedia.org/wiki/BioShock)). Der Vorteil des Erntens kommt sofort, die Rechnung der Geschichte am Schluss.

  ## Gnade als Mechanik: Undertale

  Undertale (Toby Fox, 2015) wirbt auf seiner offiziellen Seite mit dem Satz „In this RPG, you don't have to kill anyone.“ ([undertale.com](https://undertale.com/about/)). Jeder Kampf lässt sich ohne Töten beenden. Gewaltfreiheit ist hier eine Regel des Kampfsystems und kein Text, den eine Figur aufsagt.

  Dazu deutet das Spiel die Zahlen um, die in Rollenspielen sonst Fortschritt bedeuten. Im Neutral-Weg erklärt die Figur Sans vor dem Kampf mit Asgore, dass „EXP“ für „execution points“ steht und „LOVE“ für „level of violence“. LV ist die Anzeige für LOVE ([Wikipedia](https://en.wikipedia.org/wiki/Undertale)).

  Der Wert, den ein Spieler aus Gewohnheit steigert, misst nach dieser Erklärung Gewalt. Das Spiel schafft den Anreiz nicht ab. Es gibt ihm einen Namen, der ein Urteil enthält.

  Lessings Fabel „Der Rabe und der Fuchs“ (1759) kennt das Prinzip einer Belohnung, die das Urteil schon enthält: Der Fuchs bekommt durch Schmeichelei genau das Fleisch, das er wollte, und der Leser weiß seit dem ersten Satz, dass es vergiftet ist. Die Fabel selbst untersucht das Modul [Dialog, Subtext und notwendige Informationen](/narrative/dialog-subtext).

  Die Wege Neutral, True Pacifist und Genocide („No Mercy“) verändern Dialoge, Figuren und Ende. Wie weit diese Folgen reichen, untersuchst du in einer Übung.

  > [!NOTE] Genau formulieren
  > „Jeder Kampf lässt sich ohne Töten beenden“ stimmt. „Jeder Kampf endet über die Menüpunkte ACT und MERCY“ stimmt nicht. Bei manchen Bosskämpfen muss man überleben, bis die Figur ihren Dialog beendet hat, und man kann Gegner auch bei niedriger HP verschonen. Prüf solche Details an einer Quelle, bevor du sie in einer Analyse weitergibst.

  ## Kosten spürbar machen: Papers, Please und Frostpunk

  Papers, Please (Lucas Pope, 2013) macht den Spieler zum Grenzbeamten in Arstotzka. Wie das Geld am Ende jedes Tages die Familie zum Ziel macht, zeigt das Modul [Figuren: Ziel, Motiv und Widerstand](/narrative/figuren-motivation). Hier zählt ein zweiter Strang: Entscheidungen zu den EZIC-Agenten verändern das Ende, von dem es 20 gibt ([Wikipedia](https://en.wikipedia.org/wiki/Papers,_Please)). Die offizielle Seite zitiert Rock Paper Shotgun mit „a fascinating exploration of morality versus progress“ ([papersplea.se](https://papersplea.se/)). Was der Spieler am Schalter tut, rechnet das Spiel also auch erzählerisch ab, im Ende.

  Frostpunk (11 bit studios, 2018) arbeitet mit Gesetzen, die das Leben der wachsenden Gesellschaft regeln. Auf der Steam-Seite verlangt der Hersteller, Hoffnung und Zufriedenheit zu erhalten („Maintain their hope and contentment“, [Steam](https://store.steampowered.com/app/323190/Frostpunk/)). Laut Wikipedia soll der Spieler Hope hoch und Discontent niedrig halten. Gesetze wie Kinderarbeit oder 24-Stunden-Schichten steigern die Produktion und kosten Zufriedenheit ([Wikipedia](https://en.wikipedia.org/wiki/Frostpunk)).

  Beide Spiele stellen Vorankommen gegen Moral und lassen den Preis im Spiel selbst auftauchen, als sinkende Zufriedenheit oder als anderes Ende. Das ist ein Dilemma im Sinn dieses Moduls: Anreiz und Wert zeigen in verschiedene Richtungen, und das Spiel weiß es. Die Kehrseite untersuchst du am Frostpunk-Beispiel in einer Übung. Ein moralischer Preis, der als Zahl erscheint, lässt sich verrechnen.

  ## Zahlen zeigen oder verbergen: Mass Effect und Pentiment

  Mass Effect (BioWare, 2007) misst Moral mit Paragon-Punkten (charm, Charme) und Renegade-Punkten (intimidate, Einschüchterung). Die Punkte schalten besondere Dialogoptionen frei ([Wikipedia](https://en.wikipedia.org/wiki/Mass_Effect_%28video_game%29)). Ein solches Moralmeter macht sichtbar, dass Haltung zählt. Es setzt aber einen eigenen Anreiz.

  Wenn Punkte Optionen öffnen, lohnt es sich, auf einer Seite zu sammeln. Neben die Frage „Was ist hier richtig?“ tritt dann die Frage „Welche Seite baue ich gerade aus?“. Das ist eine Analyse des Anreizes, keine Messung, wie Spieler tatsächlich wählen.

  Miguel Sicarts Buch „Beyond Choices: The Design of Ethical Gameplay“ (MIT Press 2013) setzt Ethik im Spiel als Frage des Game Designs an; schon der Titel zielt über einzelne Wahlmomente hinaus ([DiGRA](https://digra.org/book-beyond-choices-the-design-of-ethical-gameplay-by-miguel-sicart/)). Belegt sind hier nur Titel und Ankündigung. Wenn dich das Thema trägt, lies das Buch selbst.

  Pentiment (Obsidian Entertainment, 2022) verzichtet auf eine richtige Antwort. Das Spiel spielt im fiktiven Alpenort Tassing und im Kloster Kiersau, in drei Akten 1518, 1525 und 1543 ([Wikipedia](https://en.wikipedia.org/wiki/Pentiment_%28video_game%29)).

  Im ersten Akt soll der Spieler als der Künstler Andreas Maler einen Mord aufklären, um seinen Freund Piero zu entlasten. Wie viele Spuren er auch findet, eindeutig wird nichts ([Shacknews](https://www.shacknews.com/article/146276/pentiment-josh-sawyer-no-correct-answer)). Trotzdem soll er jemanden beschuldigen. Wikipedia beschreibt das Ende des Akts so: Andreas legt seine Beweise vor, und einer der Verdächtigen wird hingerichtet.

  Das Spiel sagt nicht, ob der Spieler richtig lag, weil es kein Richtig gibt. Damit fällt das Optimieren weg, denn es gibt nichts, worauf man hinspielen könnte. Der Spieler wählt nach Überzeugung und trägt eine Folge, die das Spiel nicht auflöst.

  > [!WARNING] Ein Balken erzählt mit
  > Eine sichtbare Moralanzeige sagt dem Spieler bei jeder Wahl, wie das Spiel sie einordnet. Das kann die Szene stützen oder ihr widersprechen. Wenn ein Spiel Zahlen zeigt, prüf, ob die Zahl dasselbe sagt wie die Szene.

  ## Vier Fragen für den Entwurf

  Aus den Beispielen ergeben sich vier Fragen, die du beim Entwurf jeder Entscheidung stellen kannst. Sie schreiben keine Lösung vor. Sie machen sichtbar, was du entschieden hast.

  ### Stehen Anreiz und Wert absichtlich gegeneinander?

  Frostpunk und Papers, Please wollen, dass Vorteil und Wert auseinanderfallen. Ein Dilemma braucht zwei Optionen, die beide etwas Gutes haben. Mach den Optimierer-Test und prüf, ob das Spiel den Preis später aufgreift.

  ### Zahlen zeigen oder verbergen?

  Mass Effect zeigt Punkte, Pentiment sagt nie, ob eine Wahl richtig war. Sichtbare Zahlen machen eine Wahl erkennbar und laden zum Rechnen ein. Verborgene Werte lassen Raum für Überzeugung, machen die Folge aber schwerer zu sehen.

  ### Wann kommt die Folge?

  BioShock gibt den Vorteil des Erntens sofort und die Antwort der Geschichte am Ende. Undertale trägt eine Folge bis in einen späteren Durchgang. Eine verzögerte Folge wirkt nur, wenn der Spieler sie seiner Wahl zuordnen kann. Wie das geht, behandelt [Verzweigungen begrenzen](/narrative/verzweigungen).

  ### Kosten beide Optionen etwas?

  Kostet nur eine Option etwas, ist die andere die richtige, und der Spieler sucht sie, statt abzuwägen. In Frostpunk kostet das Gesetz Zufriedenheit, der Verzicht die zusätzliche Produktion.

  ## Häufige Fehler

  - **Die gute Tat zahlt sich mechanisch am meisten aus.** Der Optimierer und der Spieler mit Gewissen wählen dasselbe. Gib der anderen Option einen echten Vorteil, oder entscheide bewusst, dass die Wahl leicht sein soll.
  - **Die Mechanik belohnt, was die Geschichte verurteilt, und niemand im Spiel merkt es.** Keine Figur und kein Ende greifen den Widerspruch auf. Hol ihn in die Geschichte, dann wird er zum Dilemma, oder ändere den Anreiz.
  - **Das Moralmeter ersetzt die Frage.** In Testläufen begründen Spieler ihre Wahl mit dem Balken statt mit der Situation. Prüf, ob die Zahl nötig ist oder ob Reaktionen der Figuren reichen.
  - **Die Folge kommt so spät, dass niemand sie zuordnet.** Testspieler halten sie für Zufall. Erinnere im Moment der Folge an die Wahl.
  - **Nur eine Option kostet etwas.** Der Spieler sucht die richtige Antwort, statt abzuwägen. Gib beiden Optionen einen Preis.

  > [!PRAXIS] Keine Antwort, auch nicht für das Team
  > Josh Sawyer, Game Director von Pentiment, sagte gegenüber PC Gamer, „there cannot be a right answer“. Als Leute im Team und bei Xbox wissen wollten, wer der Täter war, antwortete er „No! There isn't!“ (zitiert nach [Shacknews](https://www.shacknews.com/article/146276/pentiment-josh-sawyer-no-correct-answer)). Manche Figuren wirkten verdächtiger, sagte er, aber das heiße nicht, dass sie es getan hätten. Sawyer hielt die offene Frage also auch gegenüber dem eigenen Team durch.

  ## Zusammenfassung

  - Jede Wahl hat einen Anreiz (was die Mechanik gibt oder nimmt) und eine Aussage (was die Geschichte erzählt).
  - Stellt ein Spiel beide absichtlich gegeneinander und greift den Preis auf, ist das ein Dilemma. Widersprechen sie sich, ohne dass das Spiel darauf eingeht, ist es Dissonanz.
  - Hocking sieht die Dissonanz in BioShock zwischen der Freiheit der Mechanik und dem Zwang, Atlas zu helfen.
  - Undertale benennt den Fortschrittswert um, EXP und LOVE messen Gewalt. Die Belohnung bleibt, ihr Name trägt das Urteil.
  - Papers, Please und Frostpunk machen moralische Kosten in Geld und Zufriedenheit sichtbar.
  - Ein Moralmeter macht Haltung erkennbar und setzt einen eigenen Anreiz.
  - Pentiment verzichtet auf eine richtige Antwort und damit auf etwas, worauf man optimieren kann.
  - Vier Fragen für den Entwurf: Stehen Anreiz und Wert absichtlich gegeneinander, zeigst du Zahlen, wann kommt die Folge, kosten beide Optionen etwas?
exercises:
  - id: dilemma-erkennen
    type: choice
    title: Gewollt oder passiert?
    prompt: |
      Welche dieser Beschreibungen zeigen ein gewolltes Dilemma und keine Dissonanz?
    options:
      - text: In Frostpunk steigert ein Gesetz wie 24-Stunden-Schichten die Produktion und kostet Zufriedenheit.
        correct: true
        why: Das Spiel führt den moralischen Preis als eigenen Wert, den der Spieler im Blick behalten soll. Der Widerspruch ist Absicht.
      - text: In Papers, Please bringt Bestechung Geld für Miete und Heizung der Familie und verletzt die Pflicht des Grenzbeamten; das Spiel knüpft das Risiko einer Verhaftung daran.
        correct: true
        why: Der Anreiz (Geld für die Familie) und der Wert (die Pflicht des Beamten) zeigen in verschiedene Richtungen. Das Spiel kennt den Widerspruch und greift ihn mit dem Risiko einer Verhaftung auf.
      - text: In BioShock belohnt die Mechanik nach Hocking Eigeninteresse, während die Geschichte den Spieler zwingt, Atlas zu helfen.
        correct: false
        why: Genau diesen Widerspruch beschreibt Hocking als Dissonanz zwischen dem, worum es im Spiel als Spiel und als Geschichte geht.
      - text: Ein Bürospiel (Lehrbeispiel) lobt in Dialogen Hilfsbereitschaft unter Kollegen, zahlt Prämien aber nur für eigene erledigte Aufgaben, und keine Figur erwähnt das.
        correct: false
        why: Mechanik und Geschichte sagen Verschiedenes, und das Spiel greift den Widerspruch nirgends auf. Das ist Dissonanz.
    explanation: |
      Ob ein Widerspruch zwischen Anreiz und Wert ein Dilemma oder eine Dissonanz ist, entscheidet nicht die Mechanik allein. Es zählt, ob das Spiel den Widerspruch kennt und aufgreift. Frostpunk und Papers, Please machen den Preis zum Teil des Spiels. Im Bürospiel bleibt er stumm, und bei BioShock beschreibt Hocking einen Bruch zwischen der Freiheit der Mechanik und dem Zwang der Geschichte.
    hints:
      - Frag bei jeder Beschreibung, ob das Spiel den Preis selbst sichtbar macht.
    resources:
      - title: Frostpunk (Wikipedia)
        url: https://en.wikipedia.org/wiki/Frostpunk
      - title: Papers, Please (Wikipedia)
        url: https://en.wikipedia.org/wiki/Papers,_Please

  - id: exp-umgedeutet
    type: choice
    title: Was ein Name ändert
    prompt: |
      In Undertale erklärt die Figur Sans im Neutral-Weg vor dem Kampf mit Asgore, dass EXP für „execution points“ und LOVE für „level of violence“ steht. Was macht diese Erklärung mit dem Anreiz?
    options:
      - text: Sie deutet einen vertrauten Fortschrittswert als Maß für Gewalt um, ohne ihn abzuschaffen.
        correct: true
        why: Der Wert bleibt, was er war. Neu ist, was er für den Spieler bedeutet.
      - text: Sie schafft den Anreiz ab, weil sie die Regeln des Spiels ändert.
        correct: false
        why: Die Erklärung ist Dialog. Sie ändert nicht die Regeln, sondern die Bedeutung eines Werts.
      - text: Sie ist ein Beispiel für ludonarrative Dissonanz.
        correct: false
        why: Hier greift die Geschichte die Mechanik ausdrücklich auf. Mechanik und Geschichte arbeiten zusammen.
      - text: Sie sagt dem Spieler schon vor dem ersten Kampf, was seine Werte bedeuten.
        correct: false
        why: Die Erklärung kommt spät, vor dem Kampf mit Asgore. Bis dahin hat der Spieler den Wert schon gesteigert oder nicht.
    explanation: |
      Undertale lässt den Anreiz stehen und gibt ihm nachträglich eine Bedeutung. Der Spieler hat seine Werte aus Gewohnheit gesteigert, wie in vielen Rollenspielen, und erfährt spät, dass die Anzeige Gewalt misst. So wird eine vertraute Mechanik zur Aussage der Geschichte, statt ihr zu widersprechen.
    hints:
      - Ändert ein Satz im Dialog die Regeln oder die Bedeutung?
    resources:
      - title: Undertale (Wikipedia)
        url: https://en.wikipedia.org/wiki/Undertale

  - id: moralmeter-anreiz
    type: choice
    title: Der zweite Grund für eine Antwort
    prompt: |
      In Mass Effect (BioWare, 2007) gibt es Paragon- und Renegade-Punkte, die besondere Dialogoptionen freischalten. Welchen zusätzlichen Anreiz setzt dieses Moralmeter?
    options:
      - text: Punkte auf einer Seite zu sammeln, um deren Optionen zu öffnen.
        correct: true
        why: Wenn Punkte Optionen freischalten, lohnt sich Beständigkeit auf einer Seite. Das ist ein Anreiz neben der Frage, was in der Situation richtig ist.
      - text: Jede Entscheidung für sich zu treffen, unabhängig von früheren.
        correct: false
        why: Das Meter verbindet die Entscheidungen. Jede zahlt auf einen Stand ein, der spätere Optionen bestimmt.
      - text: Keinen, weil die Punkte nur angezeigt werden.
        correct: false
        why: Die Punkte schalten Optionen frei. Damit haben sie eine mechanische Wirkung.
      - text: Renegade-Antworten zu meiden, weil nur Paragon belohnt wird.
        correct: false
        why: Beide Seiten schalten besondere Optionen frei. Der Anreiz zieht zu einer Seite, nicht zu einer bestimmten.
    explanation: |
      Ein Moralmeter macht Haltung erkennbar, setzt aber einen eigenen Anreiz. Neben die Frage „Was ist hier richtig?“ tritt „Welche Seite baue ich aus?“. Das ist eine Analyse der Anreizstruktur, keine Aussage darüber, wie jeder Spieler tatsächlich wählt. Wer ein solches System entwirft, sollte wissen, dass es diese zweite Frage stellt.
    hints:
      - Was passiert mit den Punkten, wenn sie eine Schwelle erreichen?
    resources:
      - title: Mass Effect (Wikipedia)
        url: https://en.wikipedia.org/wiki/Mass_Effect_(video_game)

  - id: anreiz-pruefen-ordnen
    type: order
    title: Eine Wahl Schritt für Schritt prüfen
    prompt: |
      Bring die Schritte in eine Reihenfolge, mit der du eine Entscheidung in einem Spiel auf Anreiz und Aussage prüfst.
    lang: prose
    lines: |
      Notiere, was jede Option mechanisch bringt oder kostet.
      Notiere, was die Geschichte über jede Option erzählt.
      Prüfe, ob Anreiz und Aussage in dieselbe Richtung zeigen.
      Prüfe bei einem Widerspruch, ob das Spiel ihn aufgreift.
      Ordne die Wahl ein, als leicht, als Dilemma oder als Dissonanz.
    alternatives:
      - [2, 1, 3, 4, 5]
    explanation: |
      Anreiz und Aussage sammelst du zuerst, in beliebiger Reihenfolge. Erst dann kannst du vergleichen. Die Frage, ob das Spiel den Widerspruch aufgreift, stellt sich nur, wenn es einen gibt. Die Einordnung am Ende stützt sich auf alle vier Schritte davor.
    hints:
      - Was brauchst du, bevor du vergleichen kannst?
    resources:
      - title: Clint Hocking, „Ludonarrative Dissonance in Bioshock“ (archiviert)
        url: https://web.archive.org/web/20240112180255/https://clicknothing.typepad.com/click_nothing/2007/10/ludonarrative-d.html

  - id: begriffe-anreize
    type: gap
    title: Drei Begriffe
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Sagen Mechanik und Geschichte Verschiedenes, ohne dass das Spiel den Widerspruch aufgreift, spricht man von ⟦ludonarrativer Dissonanz⟧. Stellt ein Spiel Anreiz und Wert absichtlich gegeneinander, entsteht ein ⟦Dilemma⟧. Eine Anzeige, die Moral in Punkte übersetzt, heißt ⟦Moralmeter⟧.
    gaps:
      - label: Widerspruch ohne Absicht
        hint: Clint Hocking schrieb 2007 über sie, am Beispiel BioShock. Zwei Wörter.
        accept: ["ludonarrative Dissonanz"]
      - label: Gewollter Widerspruch
        hint: Eine Wahl zwischen zwei Optionen, die beide etwas kosten.
      - label: Anzeige für Moral
        hint: Mass Effect hat eins mit Paragon und Renegade.
        accept: ["Moral-Meter", "Moralanzeige"]
    explanation: |
      Dissonanz und Dilemma beschreiben beide einen Widerspruch zwischen Anreiz und Wert. Der Unterschied liegt darin, ob das Spiel ihn will und aufgreift. Ein Moralmeter ist ein Werkzeug, das Haltung messbar macht und damit selbst zum Anreiz wird.
    resources:
      - title: Clint Hocking, „Ludonarrative Dissonance in Bioshock“ (archiviert)
        url: https://web.archive.org/web/20240112180255/https://clicknothing.typepad.com/click_nothing/2007/10/ludonarrative-d.html

  - id: vier-fragen-entwurf
    type: gap
    title: Vier Hebel beim Entwurf
    prompt: |
      Hinter den vier Fragen im letzten Abschnitt der Lektion stehen vier Hebel. Ergänze sie.
    lang: prose
    code: |
      Beim Entwurf einer Entscheidung kannst du Anreiz und Wert absichtlich ⟦gegeneinander⟧ stellen, Zahlen zeigen oder ⟦verbergen⟧, die Folge ⟦verzögern⟧ und dafür sorgen, dass ⟦beide⟧ Optionen etwas kosten.
    gaps:
      - label: Anreiz und Wert
        hint: So stehen sie in einem Dilemma zueinander.
      - label: Zahlen
        hint: Das Gegenteil von zeigen, wie in der Überschrift der Lektion.
        accept: ["verstecken"]
      - label: Folge
        hint: BioShock macht das mit dem Ende.
        accept: ["hinauszögern", "aufschieben", "verschieben"]
      - label: Kosten
        hint: Wie viele Optionen sollen etwas kosten?
        accept: ["alle"]
    explanation: |
      Die vier Hebel schreiben keine Lösung vor. Sie machen sichtbar, welche Entscheidungen im Design schon gefallen sind, oft ohne dass man es gemerkt hat. Wer eine Folge verzögert, muss später dafür sorgen, dass der Spieler sie seiner Wahl zuordnen kann.

  - id: optimierer-test
    type: practice
    title: Was würde ein Optimierer tun?
    prompt: |
      Wähle eine Entscheidung aus einem Spiel, das Moral oder Ruf als Zahl zeigt, etwa als Punkte, Balken oder Rufwert. Mach den Optimierer-Test in zwei, drei Sätzen.
    lang: prose
    starter: |
      Spiel und Entscheidung:
      Angezeigte Zahl und wie die Wahl sie ändert:
      Der Optimierer wählt, weil:
      Die Geschichte stellt als richtig dar:
    checklist:
      - Du nennst die Zahl oder Anzeige und sagst, wie sie sich durch die Wahl ändert.
      - Für die Wahl des Optimierers steht ein konkreter mechanischer Vorteil (Ressource, Fähigkeit, Zeit oder Zugang).
      - Die Haltung der Geschichte ist mit einer Reaktion, einer Szene oder einem Ende belegt.
      - Du sagst ausdrücklich, ob beide Antworten dieselbe Option nennen.
    explanation: |
      Der Optimierer-Test trennt zwei Fragen, die beim Spielen verschwimmen: Was lohnt sich, und was ist richtig? Wenn beide Antworten dieselbe Option nennen, ist die Wahl leicht. Nennen sie verschiedene, lohnt der Blick, ob das Spiel den Widerspruch aufgreift.
    hints:
      - Moralmeter, Ruf bei Fraktionen oder Zustimmungswerte von Begleitern sind solche Zahlen.

  - id: kurier-designnotiz
    type: bug
    title: Die Belohnung am Wochenende
    prompt: |
      Lehrbeispiel: eine Designnotiz zu einem Spiel über einen Fahrradkurierdienst. Die Absicht steht in Zeile 1, und Kosten fürs Helfen sind gewollt. Finde die Zeile, die das Gegenteil der beabsichtigten Aussage belohnt.
    lang: prose
    code: |
      Absicht: Hilfe unter Kollegen kostet Zeit und trägt das Team durch die Woche.
      Wahl: einer Kollegin mit Platten helfen oder die eigene Tour weiterfahren.
      Helfen kostet acht Minuten, die nächste Lieferung kommt zu spät.
      Wer geholfen hat, dem nimmt die Kollegin am Freitag eine Tour ab.
      Wer die ganze Woche niemandem hilft, schaltet das schnellste Rad frei.
      Am Montag grüßt die Kollegin zuerst, wenn man ihr geholfen hat.
      Der Dienstplan am Wochenende zeigt, wer wem Touren abgenommen hat.
    lines: [5]
    explanation: |
      Zeile 5 belohnt genau das Verhalten, das die Absicht als schlechter darstellt. Ein Spieler, der auf das schnellste Rad hinspielt, hilft nie, und keine andere Zeile greift diesen Widerspruch auf. Zeile 3 ist dagegen ein gewollter Preis: Helfen soll etwas kosten, sonst gäbe es nichts abzuwägen. Die übrigen Zeilen zeigen die Folge des Helfens, mechanisch (Zeile 4) und erzählerisch (Zeilen 6 und 7).
    hints:
      - Mach mit jeder Zeile den Optimierer-Test.
      - Welche Zeile macht „nie helfen“ zur besten Strategie?

  - id: bioshock-anreiz-aussage
    type: explain
    title: Ernten oder retten
    prompt: |
      Hier ist die Little-Sister-Wahl aus BioShock, nach den Quellen der Lektion zusammengefasst. Prüf sie auf Anreiz und Aussage. Erkläre in zwei bis vier Sätzen, was die Mechanik wann belohnt und was die Geschichte sagt. Ordne die Wahl mit den Begriffen der Lektion ein (leicht, Dilemma, Dissonanz).
    lang: prose
    code: |
      Der Spieler kann jede Little Sister ernten oder retten.
      Ernten bringt 160 ADAM, Retten 80 ADAM.
      Nach jeweils drei Rettungen liegt ein Geschenk von Tenenbaum im nächsten Gatherer's-Garden-Automaten.
      Wer alle rettet, sieht das gute Ende.
      Wer eine oder mehrere erntet, sieht das schlechte Ende; sein Ton wird mit der Zahl der Ernten härter.
    points:
      - Sofort belohnt die Mechanik das Ernten mit doppelt so viel ADAM.
      - Das Geschenk nach drei Rettungen gibt später einen Teil zurück; der Anreiz ist über die Zeit verteilt.
      - Die Geschichte bewertet die Wahl am Ende, und nur wer alle rettet, sieht das gute Ende.
      - Anreiz und Aussage zeigen absichtlich in verschiedene Richtungen, und das Ende greift den Preis auf; das spricht für ein Dilemma.
      - Hocking verortet die Dissonanz von BioShock an anderer Stelle, im Zwang, Atlas zu helfen.
    explanation: |
      Die Mechanik belohnt das Ernten sofort mit doppelt so viel ADAM. Tenenbaums Geschenk nach jeweils drei Rettungen verkleinert den Abstand, aber erst später, und Hocking hält Retten auch auf lange Sicht nicht für das bessere Geschäft. Die Geschichte rechnet am Schluss ab: Nur wer alle rettet, sieht das gute Ende, und jede Ernte macht den Ton des schlechten Endes härter. Anreiz und Aussage zeigen also in verschiedene Richtungen, und das Spiel greift den Preis selbst auf. Das spricht für ein gewolltes Dilemma. Hocking schreibt, er habe das Thema des Spiels gerade an dieser Stelle über die Mechanik gespürt; die Dissonanz sieht er im erzählerischen Zwang, Atlas zu helfen.
    hints:
      - Trenne, was sofort passiert, von dem, was am Ende passiert.
      - Wo sieht Hocking selbst den Bruch?
    resources:
      - title: GameBanshee · Little Sister (BioShock)
        url: https://www.gamebanshee.com/bioshock/denizens/littlesister.php
      - title: BioShock (Wikipedia)
        url: https://en.wikipedia.org/wiki/BioShock

  - id: undertale-wege
    type: explain
    title: Eine Folge, die bleibt
    prompt: |
      Hier sind die Wege von Undertale, nach den Quellen der Lektion zusammengefasst. Erkläre in zwei bis vier Sätzen, wie weit die Folgen reichen und was das für eine einzelne Entscheidung im Kampf bedeutet.
    lang: prose
    code: |
      Jeder Kampf lässt sich ohne Töten beenden.
      Die Wege Neutral, True Pacifist und Genocide („No Mercy“) verändern Dialoge, Figuren und Ende.
      Im Genocide-Weg fliehen viele Figuren.
      Wer den Genocide-Weg beendet, verändert damit dauerhaft das spätere True-Pacifist-Ende.
    points:
      - Weil jeder Kampf einen Ausweg ohne Töten hat, ist Gewalt in jedem Kampf eine Wahl und keine Pflicht.
      - Der Weg ist keine einzelne Menüwahl, er ergibt sich daraus, wie der Spieler die Kämpfe beendet.
      - Die Folgen sind erkennbar, denn Dialoge, Figuren und Ende ändern sich, und im Genocide-Weg fliehen Figuren.
      - Die Folge des Genocide-Wegs reicht über den Durchgang hinaus; ein neuer Durchgang macht sie nicht ungeschehen.
    explanation: |
      Undertale macht aus vielen kleinen Entscheidungen eine große. Weil jeder Kampf ohne Töten enden kann, ist jede Gewalt eine Wahl, und der Weg entsteht aus der Summe dieser Wahlen. Die Folgen sind erkennbar, weil sich Dialoge, Figuren und Ende ändern und im Genocide-Weg sichtbar Figuren fliehen. Eingebunden sind sie über das Ende eines Durchgangs hinaus: Wer den Genocide-Weg beendet, verändert dauerhaft das spätere True-Pacifist-Ende. Damit verliert der Neustart seine übliche Rolle als Ausweg, und jede einzelne Entscheidung bekommt mehr Gewicht.
    hints:
      - Was passiert, wenn der Spieler nach dem Genocide-Weg neu beginnt?
    resources:
      - title: Undertale · About (offizielle Seite)
        url: https://undertale.com/about/

  - id: frostpunk-preis
    type: explain
    title: Moral als Zahl
    prompt: |
      Hier ist die Gesetzesmechanik von Frostpunk, nach Steam-Seite und Wikipedia zusammengefasst. Erkläre in zwei bis vier Sätzen, was Anreiz und was Wert ist und was es bedeutet, dass das Spiel den moralischen Preis als Zahl führt.
    lang: prose
    code: |
      Gesetze regeln das Leben der wachsenden Gesellschaft.
      Der Spieler soll Hope hoch und Discontent niedrig halten.
      Gesetze wie Kinderarbeit oder 24-Stunden-Schichten steigern die Produktion.
      Sie kosten Zufriedenheit.
      Der Hersteller schreibt auf Steam „Maintain their hope and contentment“.
    points:
      - Der Anreiz ist die Produktion, also das Überleben der Gesellschaft.
      - Der Wert ist der Schutz von Kindern und Arbeitenden, den das Gesetz verletzt.
      - Beide Optionen kosten etwas; das Gesetz kostet Zufriedenheit, der Verzicht die zusätzliche Produktion.
      - Als Zahl wird der moralische Preis sichtbar und zugleich verrechenbar, gegen Produktion abwägbar wie jede Ressource.
    explanation: |
      Frostpunk stellt Überleben und Moral absichtlich gegeneinander. Ein Gesetz wie Kinderarbeit bringt Produktion, also einen Vorteil für das Überleben, und verletzt einen Wert, den das Spiel selbst als Zufriedenheit misst. Beide Optionen kosten etwas, und das macht die Wahl zum Dilemma. Die Zahl hat eine Kehrseite: Was als Wert auf dem Bildschirm steht, kann ein Spieler gegen andere Werte verrechnen. Der moralische Preis wird dann zu einer Ressource, die man so lange ausgibt, wie sie reicht. Ob ein Spiel das will, ist eine Entscheidung des Designs.
    hints:
      - Was misst das Spiel, und was steht nur in der Geschichte?
      - Was kann ein Spieler mit einem Wert tun, der als Zahl dasteht?
    resources:
      - title: Frostpunk · Steam-Seite von 11 bit studios
        url: https://store.steampowered.com/app/323190/Frostpunk/
      - title: Frostpunk (Wikipedia)
        url: https://en.wikipedia.org/wiki/Frostpunk

  - id: anreiz-und-folge
    type: practice
    title: Passen Anreiz und Folge zusammen?
    prompt: |
      Wähle eine Entscheidung aus einem Spiel deiner Wahl. Nenne in Stichpunkten Anreiz und erzählerische Folge jeder Option und ob beides zusammenpasst.
    lang: prose
    starter: |
      Spiel und Entscheidung:
      Anreiz je Option (was die Mechanik gibt oder nimmt):
      Erzählerische Folge je Option (und wann sie sichtbar wird):
      Einordnung (leicht, Dilemma, Dissonanz):
      Woran ich das festmache:
    checklist:
      - Für jede Option stehen ein mechanischer Anreiz und eine erzählerische Folge.
      - Für jede Folge steht, wann der Spieler sie sieht.
      - Die Einordnung stützt sich auf eine konkrete Stelle im Spiel.
      - Bei einem Widerspruch steht, ob das Spiel ihn aufgreift.
    explanation: |
      Die Vorlage trennt, was in einer Analyse oft zusammenfällt. Anreiz und Folge sind zwei Spalten, und erst der Vergleich zeigt, ob die Wahl leicht, ein Dilemma oder eine Dissonanz ist. Der Zeitpunkt der Folge gehört dazu, weil ein später Preis anders wirkt als ein sofortiger.
    hints:
      - Wenn du eine Option nicht mechanisch beschreiben kannst, schreib „kein Anreiz“. Auch das ist ein Befund.

  - id: eigene-entscheidung-anreize
    type: practice
    title: Was belohnt deine Entscheidung?
    prompt: |
      Für dein eigenes Projekt: Nimm eine Entscheidung, die du geplant hast. Trag für jede Option ein, was die Mechanik gibt oder nimmt und was die Geschichte darüber erzählt. Schreib Stichpunkte.
    lang: prose
    starter: |
      Entscheidung:
      Option 1, Mechanik gibt oder nimmt:
      Option 1, Geschichte erzählt:
      Option 2, Mechanik gibt oder nimmt:
      Option 2, Geschichte erzählt:
      Der Optimierer wählt:
      Gleiche Richtung, Dilemma oder Dissonanz:
    checklist:
      - Für jede Option steht ein konkreter mechanischer Effekt oder ausdrücklich „keiner“.
      - Für jede Option steht, woran der Spieler die Haltung der Geschichte erkennt (Reaktion, Szene oder Ende).
      - Du hast den Optimierer-Test gemacht und notiert, welche Option er wählt.
      - Wenn Anreiz und Aussage auseinandergehen, steht da, ob das Absicht ist.
    explanation: |
      Die Vorlage gibt keine Antwort vor, sie macht sichtbar, was du schon entschieden hast. Häufig steht in der Spalte „Mechanik“ zunächst nichts, weil man über Belohnungen erst spät nachdenkt. Auch das ist ein Ergebnis: Eine Entscheidung ohne Anreiz wird allein über die Geschichte gewichtet.
    hints:
      - Hat dein Projekt noch keine Mechanik für die Entscheidung, schreib „noch offen“ und mach den Optimierer-Test später.
