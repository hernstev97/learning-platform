id: dialog-subtext
title: Dialog, Subtext und notwendige Informationen
level: 2
minutes: 80
summary: Dialog ist Handlung – jede Replik will etwas, das Wichtigste bleibt oft ungesagt, und Informationen kommen dann, wenn eine Figur sie braucht, nicht als Vortrag für den Leser.
place: unterwegs
goals:
  - Du bestimmst für jede Replik eines Dialogs, was die Figur damit bei ihrem Gegenüber erreichen will.
  - Du erkennst Subtext, also den Abstand zwischen Gesagtem und Gemeintem, und benennst, woran der Leser ihn bemerkt.
  - Du beschreibst an Büchners „Woyzeck“, wie ein Dialog ein Machtgefälle zeigt, ohne es zu benennen.
  - Du findest „As you know, Bob“-Zeilen und kennst Wege, notwendige Informationen anders in eine Szene zu bringen.
  - Du erklärst, wie Auswahlantworten, Schweigen, Unterbrechen und Fristen in Spielen Subtext ermöglichen, und prüfst Repliken auf Textbox-Länge.
