lesson: |
  Ein Händler in einem Rollenspiel begrüßt dich, und dann folgen sechs Textboxen: wie die Stadt gegründet wurde, dass er seinen Bruder vermisst, wohin du als Nächstes gehen sollst. Du klickst weiter. Der Händler will nichts von dir, er spricht nur, damit du etwas erfährst.

  Lessings Fuchs macht es anders. Er will das Fleisch eines Raben und redet kein Wort über Fleisch, nur über Adler und Götter. Jede seiner Repliken will etwas, und der Leser durchschaut ihn sofort. Dieses Modul zeigt, wie Dialog handelt, wie Subtext entsteht und wie notwendige Informationen in eine Szene kommen, ohne dass Figuren dem Leser einen Vortrag halten.

  ## Dialog ist Handlung: Jede Replik will etwas

  Figuren sprechen, um bei ihrem Gegenüber etwas zu erreichen. Sie wollen überzeugen, ablenken, sich schützen, prüfen oder kränken. Robert McKee nennt Dialog im Untertitel seines Buchs „Dialogue“ (2016) „verbal action“, also Handlung mit Worten ([Verlagsseite](https://www.hachettebookgroup.com/titles/robert-mckee/dialogue/9781455591916/)). Daraus folgt eine Prüffrage für jede Replik: Was will die Figur mit diesem Satz bei der anderen Figur erreichen?

  Lautet die ehrliche Antwort „den Leser informieren“, spricht dort der Autor. Lautet sie „nichts“, kann die Replik meist weg. Auch Ausweichen ist ein Ziel. Wer über das Wetter redet, um nicht über etwas anderes zu reden, will etwas.

  Lessings Fabel „Der Rabe und der Fuchs“ zeigt das in wenigen Zeilen. Der Rabe trägt ein Stück Fleisch, und so beginnt der Fuchs:

  > Sei mir gesegnet, Vogel des Jupiters! – Für wen siehst du mich an? fragte der Rabe. – Für wen ich dich ansehe? erwiderte der Fuchs. Bist du nicht der rüstige Adler, der täglich von der Rechte des Zeus auf diese Eiche herabkömmt, mich Armen zu speisen?

  Gotthold Ephraim Lessing, „Der Rabe und der Fuchs“, Fabeln (1759), Text nach [Projekt Gutenberg-DE](https://projekt-gutenberg.org/authors/gotthold-ephraim-lessing/books/gotthold-ephraim-lessing-fabeln/chapter/47)

  Der Fuchs lobt nicht ins Blaue. Er bietet dem Raben die Rolle des Adlers an, der Gaben bringt. Wer diese Rolle annimmt, muss die Gabe fallen lassen. Die Schmeichelei zielt auf den Wunsch des Raben, für mehr gehalten zu werden, und erreicht auf diesem Umweg das Fleisch. Wie die Fabel ausgeht und was der Rabe dabei denkt, untersuchst du in den Übungen.

  ## Subtext: Gesagtes und Gemeintes

  Subtext ist der Abstand zwischen dem, was eine Figur sagt, und dem, was sie meint oder will. Der Leser bemerkt ihn, weil Worte und Lage nicht zusammenpassen. Typische Signale sind Wiederholung, Ausweichen, ein plötzlicher Themenwechsel, zu viel Lob oder Höflichkeit an einer Stelle, an der man Ärger erwartet.

  Ernest Hemingway hat das Weglassen mit einem Eisberg verglichen: „The dignity of movement of an ice-berg is due to only one-eighth of it being above water.“ (aus „Death in the Afternoon“, 1932, zitiert nach [Wikipedia: Iceberg theory](https://en.wikipedia.org/wiki/Iceberg_theory)). Gleich danach zieht er eine Grenze. Wer weglässt, was er nicht weiß, erzeugt nur Löcher. Subtext funktioniert, wenn du genau weißt, was unter der Oberfläche liegt, und der Leser genug davon erfahren hat.

  Fontanes „Effi Briest“ zeigt, woher dieses Wissen kommen kann. Im ersten Kapitel erzählt Effi ihren Freundinnen, dass Baron Innstetten als junger Mann um ihre Mutter warb, bevor sie Herrn von Briest heiratete. Er sei „geradeso alt wie Mama, auf den Tag“. Im zweiten Kapitel muss die Mutter ihr sagen, dass derselbe Mann um Effis Hand angehalten hat:

  > »[…] Ich muß dir nämlich sagen, meine süße Effi ...«, und sie nahm ihres Kindes beide Hände, »... ich muß dir nämlich sagen ...«\
  > »Aber Mama, was hast du nur? Mir wird ja ganz angst und bange. «\
  > »... Ich muß dir nämlich sagen, Effi, daß Baron Innstetten eben um deine Hand angehalten hat.«

  Theodor Fontane, „Effi Briest“ (1896), Kapitel 2, Text nach [Projekt Gutenberg-DE](https://projekt-gutenberg.org/authors/theodor-fontane/books/effi-briest/chapter/2)

  Die Mutter setzt dreimal an. Fontane nennt sie „in sichtlicher Verlegenheit“, sagt aber nicht, warum. Sie lobt den Bewerber als „Mann von Charakter, von Stellung und guten Sitten“ und schließt mit dem Satz „Du wirst deine Mama weit überholen.“ Das klingt wie ein Glückwunsch. Wer das erste Kapitel kennt, hört darin auch die Geschichte der Mutter mit diesem Mann. Effi antwortet nicht: „Effi schwieg und suchte nach einer Antwort.“

  > [!MERKE] Subtext braucht ein Fundament
  > Der Leser hört nur, was ungesagt bleibt, wenn er es vorher erfahren hat oder aus der Lage erschließen kann. Leg dieses Wissen früher an, dann darf die Szene schweigen.

  ## Status und Machtgefälle: wer reden darf

  Status heißt hier: Wer darf reden, wer muss zuhören, wer bestimmt das Thema. Wie Büchner in der Szene „Zimmer“ aus „Woyzeck“ einen Konflikt ohne Streit baut, zeigt das Modul [Konflikt und Szenenaufbau](/narrative/szenenaufbau). Für Dialog ist an derselben Szene etwas anderes lehrreich, nämlich wie das Gefälle in den Stimmen steckt.

  Der Hauptmann spricht Wozzeck mit „Er“ an, Wozzeck sagt „Herr Hauptmann“. Der Hauptmann redet lang, wiederholt sich, springt von der Ewigkeit zum Wetter und greift zu großen Wörtern wie „Moral“ und „Tugend“. Wozzeck antwortet meist mit einer Formel. Wenn er doch länger spricht, wird er konkret und redet von „Geld“, von „Fleisch und Blut“, von Hut, Uhr und Augenglas. Zitiert wird nach der Ausgabe von Karl Emil Franzos (1879), die den Namen „Wozzeck“ schreibt ([Wikisource](https://de.wikisource.org/wiki/Wozzeck)).

  In dieser Szene darf, wer oben steht, abstrakt, lang und sprunghaft reden. Wer unten steht, fasst sich kurz, und seine Kritik kommt nur verpackt. Wie Wozzeck über Tugend und Geld spricht, ohne dem Hauptmann zu widersprechen, untersuchst du in der Übung „Hut, Uhr und Augenglas“.

  > [!TIP] Namen abdecken
  > Deck in einem Dialog die Sprechernamen ab und lies ihn. Erkennst du die Sprecher noch an Satzlänge, Wortwahl und Tempo, haben deine Figuren eigene Stimmen. Erkennst du sie nicht, klingen alle gleich.

  ## Dialog als Ritual: Rotkäppchen und der Vorsprung des Lesers

  Manche Dialoge folgen einem festen Muster, und das Muster selbst erzeugt Spannung. Bei den Brüdern Grimm fragt Rotkäppchen am Bett der Großmutter nach immer demselben Schema:

  > „Ei, Großmutter, was hast du für große Ohren!“\
  > „Daß ich dich besser hören kann.“\
  > „Ei, Großmutter, was hast du für große Augen!“\
  > „Daß ich dich besser sehen kann.“\
  > „Ei, Großmutter, was hast du für große Hände!“\
  > „Daß ich dich besser packen kann.“\
  > „Aber, Großmutter, was hast du für ein entsetzlich großes Maul!“\
  > „Daß ich dich besser fressen kann.“

  Brüder Grimm, „Rothkäppchen“ (so die Schreibung der Ausgabe von 1857), Kinder- und Haus-Märchen, [Wikisource](https://de.wikisource.org/wiki/Rothk%C3%A4ppchen_%281857%29). Im Druck steht der Wortwechsel in einem einzigen Absatz; die Zeilen sind hier getrennt.

  Der Leser weiß, wer im Bett liegt, Rotkäppchen weiß es nicht. Deshalb hat jede Antwort zwei Bedeutungen. Für Rotkäppchen klingt sie nach Großmutter, für den Leser ist sie eine Drohung, die von Antwort zu Antwort offener wird, von hören und sehen über packen bis fressen. Die vierte Frage bricht das Muster mit „Aber“ und „entsetzlich“, und mit diesem Bruch endet das Ritual. Wie solche Wissensvorsprünge Entscheidungen im Spiel prägen, behandelt [Spielerwissen, Figurenwissen und verständliche Entscheidungen](/narrative/spielerwissen).

  ## Notwendige Informationen ohne „As you know, Bob“

  Manche Informationen braucht der Leser, um eine Szene zu verstehen: wer wem etwas schuldet, was gestern passiert ist, was auf dem Spiel steht. Bequem ist es, eine Figur all das aufsagen zu lassen. Das „Turkey City Lexicon“, ein Glossar für Schreibwerkstätten, nennt das „As You Know Bob“ und beschreibt es so: „characters tell each other things they already know, for the sake of getting the reader up-to-speed“ ([SFWA](https://www.sfwa.org/2009/06/turkey-city-lexicon-a-primer-for-sf-workshops/)). Ein Lehrbeispiel:

  > „Wie du weißt, Jonas, haben wir die Werkstatt vor zehn Jahren von Vater übernommen.“\
  > „Ja, und seitdem schreiben wir rote Zahlen.“

  Beide wissen das. Die Zeilen sind für den Leser geschrieben, und er merkt es. Diese Wege tragen besser:

  - **Konflikt:** Zwei Figuren bewerten dieselbe Tatsache verschieden und streiten darüber. Die Information fällt nebenbei, weil eine Figur sie als Argument braucht.
  - **Eine Figur, die es nicht weiß:** eine neue Kollegin, ein Gast, ein Kind. Im Spiel ist das oft die Spielerfigur. Die Figur braucht einen Grund zu fragen und die andere einen Grund zu antworten.
  - **Gegenstände:** ein Brief, ein Kassenbuch, ein Zettel an der Tür. Wie Dinge erzählen, zeigt [Erzählen über Handlung, Umgebung und Folgen](/narrative/umgebung-erzaehlt).
  - **Der richtige Zeitpunkt:** Gib die Information erst, wenn der Leser sie braucht, etwa kurz vor der Entscheidung, die von ihr abhängt.
  - **Information als Belohnung:** Der Spieler fragt nach, sucht oder kombiniert. Dann beantwortet die Information eine Frage, die er schon hat.

  Erzählen ist kein Fehler. Kleist packt in den ersten Satz von „Das Erdbeben in Chili“ Ort, Jahr, Katastrophe und die Lage seiner Hauptfigur ([Projekt Gutenberg-DE](https://projekt-gutenberg.org/authors/heinrich-von-kleist/books/heinrich-v-kleist-das-erdbeben-in-chili/chapter/1)). Der Fehler beginnt erst dort, wo Figuren so tun, als sprächen sie miteinander, und dabei für den Leser reden.

  ## Dialog im Spiel: Auswahl, Schweigen, Zeitdruck

  Im Spiel redet der Spieler mit. Das verschiebt, wo Subtext entsteht.

  - In **Firewatch** (Campo Santo, 2016) spricht Henry über Funk mit seiner Vorgesetzten Delilah. Der Spieler wählt eine von mehreren Antworten oder antwortet gar nicht. Seine Wahl prägt den Ton der Beziehung ([Wikipedia](https://en.wikipedia.org/wiki/Firewatch)).
  - In **Oxenfree** (Night School Studio, 2016) laufen Gespräche, während die Spielerfigur Alex geht. Über ihrem Kopf erscheinen zwei oder drei Antworten. Der Spieler kann jederzeit wählen, die anderen ausreden lassen, ihnen ins Wort fallen oder schweigen ([Wikipedia](https://en.wikipedia.org/wiki/Oxenfree)).
  - In **The Walking Dead** (Telltale Games, 2012) haben manche Gespräche eine Frist. Lässt der Spieler sie verstreichen, schweigt die Spielerfigur Lee, und andere Figuren reagieren darauf ([Wikipedia](https://en.wikipedia.org/wiki/The_Walking_Dead_%28video_game%29)).

  In allen drei Spielen ist Schweigen eine Antwort. Wer nichts sagt, teilt trotzdem etwas mit, und der Spieler hat es selbst entschieden. Die Autoren bauen dann Lagen, in denen die Wahl des Spielers Subtext bekommt.

  Auswahlantworten haben eine eigene Schwierigkeit, denn der Spieler liest die Option, bevor die Figur spricht. Steht dort „Lügen“, bleibt kein Subtext übrig. Ist die Option zu vage, sagt die Figur etwas anderes, als der Spieler wollte.

  ### Textboxen sind klein

  Eine Textbox fasst wenige Zeilen. Eine lange Replik zerfällt in mehrere Boxen, und zwischen zwei Klicks verliert der Satz seinen Bogen. Eine brauchbare Regel ist ein Gedanke pro Box. Wie viele Zeichen in deine Box passen, hängt von Schrift und Auflösung deines Spiels ab. Diese Grenze bestimmst du am PC in [Werkstatt: Dialog und Schauplatz](/narrative/werkstatt-dialog).

  ## Häufige Fehler

  - **Figuren sagen, was sie fühlen.** Du erkennst es an Gefühlswörtern in wörtlicher Rede („Ich bin enttäuscht, weil …“). Streich den Satz und prüf, ob die Szene das Gefühl ohne ihn zeigt. Wenn nicht, gib der Figur etwas zu tun oder etwas zu verschweigen. Am Wendepunkt kann ein offener Satz treffen, gerade weil die Figur vorher geschwiegen hat, wie Wozzecks „Wir arme Leut!“.
  - **Exposition im Block.** Eine Replik erzählt über mehrere Sätze Vorgeschichte. Behalte nur, was die Szene jetzt braucht.
  - **Alle klingen gleich.** Deck die Namen ab. Erkennst du die Sprecher nicht mehr, gib jeder Figur eigene Wörter und ein eigenes Tempo.
  - **Repliken sprengen die Textbox.** Eine Replik braucht mehr als eine Box. Teil sie in zwei Repliken mit einer Reaktion des Gegenübers dazwischen, oder kürz sie auf einen Gedanken.
  - **Der Begleitsatz erklärt die Replik.** Das „Turkey City Lexicon“ nennt das „Countersinking“ und gibt als Beispiel „‘Let’s get out of here,’ he said, urging her to leave.“ Wiederholt der Satz nach der wörtlichen Rede deren Absicht, streich ihn.

  > [!WARNING] Weglassen ist kein Verstecken
  > Wer zu viel weglässt, schreibt Rätsel. Kann der Leser das Gemeinte aus nichts in der Szene oder davor erschließen, liest er nur eine unpassende Antwort. Ob Subtext ankommt, prüfst du im Testlauf ([Testlesen und Playtest: Verständlichkeit beobachten](/narrative/testlesen-playtest)).

  > [!PRAXIS] Wie Studios an Dialog arbeiten
  > Jon Ingold von inkle beschrieb auf der GDC 2015 in „Adventures in Text: Innovating in Interactive Fiction“, wie das Studio seine eigene Skriptsprache darauf ausgerichtet hat, schnell große Mengen „highly-contextual, high-quality text“ zu schreiben, und wie es in stark verzweigten Texten Konsistenz und Story-Logik sichert ([GDC Vault](https://gdcvault.com/play/1021775/Adventures-in-Text-Innovating-in)). Wie groß diese Mengen werden, zeigt inkles 80 Days. Nach Angaben der Entwickler sieht man bei einer Reise um die Welt etwa 2 % der rund 750.000 Wörter ([Wikipedia](https://en.wikipedia.org/wiki/80_Days_%282014_video_game%29)). Bei Telltale begründete Firmenchef Dan Connors die Antwortfrist in The Walking Dead damit, dass klassischen Gesprächssystemen ein „believable rhythm“ fehle ([Wikipedia: The Walking Dead](https://en.wikipedia.org/wiki/The_Walking_Dead_%28video_game%29)).

  ## Zusammenfassung

  - Jede Replik will etwas beim Gegenüber. Informiert sie nur den Leser, spricht der Autor.
  - Subtext ist der Abstand zwischen Gesagtem und Gemeintem. Er braucht Wissen, das der Leser vorher bekommen hat.
  - Status zeigt sich daran, wer redet, wer das Thema bestimmt und wer nur zustimmen kann.
  - Ein festes Muster im Dialog baut Erwartung auf, sein Bruch setzt die Wendung.
  - Bei „As you know, Bob“ erzählen Figuren einander, was beide wissen. Konflikt, eine unwissende Figur, Gegenstände, der richtige Zeitpunkt und Information als Belohnung tragen besser.
  - Im Spiel ist Schweigen eine Antwort. Auswahl, Unterbrechen und Fristen geben dem Spieler Anteil am Subtext.
  - Ein Gedanke pro Textbox. Die Zeichengrenze hängt von deinem Spiel ab.
exercises:
  - id: esel-und-dorn
    type: choice
    title: Woran es gelegen hat
    prompt: |
      Lies den Anfang von Lessings Fabel „Der Esel und das Jagdpferd“. Was tut der Esel mit seiner Replik?
    lang: prose
    code: |
      Ein Esel vermaß sich, mit einem Jagdpferde um die Wette zu laufen. Die Probe fiel erbärmlich aus, und der Esel ward ausgelacht. Ich merke nun wohl, sagte der Esel, woran es gelegen hat; ich trat mir vor einigen Monaten einen Dorn in den Fuß, und der schmerzt mich noch.
    options:
      - text: Er schützt sein Bild von sich selbst. Der Dorn soll die Niederlage erklären, ohne dass er langsamer sein muss.
        correct: true
        why: Die Replik richtet sich an die, die ihn auslachen. Der Dorn verschiebt die Ursache weg von seinen Fähigkeiten.
      - text: Er liefert dem Leser eine Vorgeschichte, die man zum Verständnis der Wette braucht.
        correct: false
        why: Der Dorn taucht erst nach der Niederlage auf und spielt für die Wette vorher keine Rolle. Gerade der späte Zeitpunkt macht ihn zur Ausrede.
      - text: Er gibt die Niederlage offen zu und bittet um Nachsicht.
        correct: false
        why: „Ich merke nun wohl“ klingt nach Einsicht, aber die Einsicht betrifft einen Dorn, nicht seine Geschwindigkeit.
      - text: Er fordert das Jagdpferd zu einem zweiten Rennen heraus.
        correct: false
        why: Davon steht nichts im Text. Der Esel will die Niederlage deuten, nicht wiederholen.
    explanation: |
      Die Replik ist Handlung: Sie soll das Gelächter umlenken. Gesagt wird eine Ursache, gemeint ist „Ich bin nicht schlechter als das Pferd“. Der Leser durchschaut die Ausrede, weil sie zu spät kommt und zu bequem ist. Lessing stellt der Fabel einen Prediger gegenüber, der seine schwache Predigt mit einem heiseren Hals entschuldigt, und zeigt so, dass Menschen dasselbe Muster benutzen.
    hints:
      - Frag, wen der Esel mit dem Satz erreichen will.
      - Wann erwähnt er den Dorn, vor oder nach dem Rennen?
    resources:
      - title: Lessing, „Der Esel und das Jagdpferd“ (Projekt Gutenberg-DE)
        url: https://projekt-gutenberg.org/authors/gotthold-ephraim-lessing/books/gotthold-ephraim-lessing-fabeln/chapter/6

  - id: subtext-beim-umzug
    type: choice
    title: Zwei Stunden zu spät
    prompt: |
      Lehrbeispiel: Lea hat versprochen, ihrem Bruder beim Umzug zu helfen, und kommt zwei Stunden zu spät. Der Bruder hat die schweren Kisten inzwischen allein getragen. Welche Antwort des Bruders hat Subtext?
    options:
      - text: „Ich bin sauer, weil du zu spät bist.“
        correct: false
        why: Er nennt Gefühl und Grund. Gesagtes und Gemeintes sind dasselbe.
      - text: „Die Kisten mit den Büchern stehen schon oben. Kaffee ist noch warm, falls du einen willst.“
        correct: true
        why: Die Verspätung kommt nicht vor. Dass die schweren Kisten schon oben stehen, ist der Vorwurf, das Kaffeeangebot hält die Form höflich.
      - text: „Wie du weißt, hast du mir versprochen, um neun hier zu sein.“
        correct: false
        why: Er spricht den Vorwurf offen aus; „Wie du weißt“ macht ihn nur spitzer. Subtext bleibt keiner.
      - text: „Du bist zu spät. Ich habe die Kisten allein getragen, das war anstrengend.“
        correct: false
        why: Jede Information steht offen da. Es bleibt nichts zu erschließen.
    explanation: |
      Subtext entsteht, wenn eine Replik etwas anderes will, als ihr Wortlaut sagt. In der richtigen Antwort steckt der Vorwurf in einer Sachinformation, und die Höflichkeit verstärkt ihn, weil sie nicht zur Lage passt. Der Leser versteht das, weil er die Lage kennt: Er weiß von der Verspätung und von den schweren Kisten.
    hints:
      - Such die Antwort, in der die Verspätung nicht erwähnt wird.
    resources:
      - title: Wikipedia, „Iceberg theory“ (Hemingway)
        url: https://en.wikipedia.org/wiki/Iceberg_theory

  - id: werkstatt-schliesst
    type: choice
    title: Wer braucht die Auskunft?
    prompt: |
      Lehrbeispiel: In einer Szene in einer Autowerkstatt soll der Leser erfahren, dass die Werkstatt Ende des Monats schließt. Die beiden Mechaniker wissen es seit Wochen. Welche Lösungen vermeiden „As you know, Bob“?
    options:
      - text: Ein Kunde will sein Auto für einen Termin im nächsten Monat anmelden, und einer der beiden muss ihn abweisen.
        correct: true
        why: Der Kunde weiß es nicht. Die Information wird nötig, weil jemand sie braucht.
      - text: Einer sagt zum anderen „Wie du weißt, schließen wir Ende des Monats.“
        correct: false
        why: Beide wissen es. Die Zeile ist nur für den Leser da.
      - text: "Die beiden streiten über eine neue Hebebühne. Einer fragt: „Eine neue Hebebühne? Für die zwei Wochen, die wir noch aufhaben?“"
        correct: true
        why: Die Information steckt in einem Argument. Der Leser erschließt sie aus dem Streit.
      - text: An der Tür hängt ein Zettel „Räumungsverkauf wegen Geschäftsaufgabe“.
        correct: true
        why: Ein Gegenstand trägt die Information, ohne dass jemand sie erklärt.
      - text: Ein Mechaniker erzählt dem anderen ausführlich, wie es zur Schließung kam.
        correct: false
        why: Das ist Exposition im Block zwischen zwei Leuten, die beide Bescheid wissen.
    explanation: |
      Eine Information braucht in der Szene einen Grund, ausgesprochen zu werden. Den liefert eine Figur, die sie nicht kennt, ein Konflikt, in dem sie als Argument dient, oder ein Gegenstand, an dem man sie abliest. Die falschen Lösungen lassen Figuren einander erklären, was beide wissen. Das „Turkey City Lexicon“ nennt genau das „As You Know Bob“.
    hints:
      - Prüf bei jeder Lösung, ob jemand in der Szene die Information noch nicht kennt oder sie für etwas braucht.
      - Drei Lösungen sind richtig.
    resources:
      - title: Turkey City Lexicon, „As You Know Bob“ (SFWA)
        url: https://www.sfwa.org/2009/06/turkey-city-lexicon-a-primer-for-sf-workshops/

  - id: zuege-des-fuchses
    type: order
    title: Fünf Züge bis zur Beute
    prompt: |
      Bring die fünf Züge aus Lessings Fabel „Der Rabe und der Fuchs“ in die Reihenfolge der Fabel. Achte darauf, wie jeder Zug den nächsten vorbereitet.
    lang: prose
    lines: |
      Sei mir gesegnet, Vogel des Jupiters!
      Für wen siehst du mich an? fragte der Rabe.
      Bist du nicht der rüstige Adler, … mich Armen zu speisen?
      Ich muß, dachte er, den Fuchs aus diesem Irrtume nicht bringen.
      Großmütig dumm ließ er ihm also seinen Raub herabfallen und flog stolz davon.
    explanation: |
      Der Fuchs beginnt mit einem Lob, das eine Frage auslöst. Erst die Frage des Raben gibt ihm die Gelegenheit, die Rolle des Adlers auszumalen, der Gaben bringt. Der Gedanke des Raben zeigt, dass er den Irrtum erkennt und ihn trotzdem stehen lässt, und erst danach folgt die Tat. Jeder Zug des Fuchses will etwas, und keiner nennt das Fleisch.
    hints:
      - Wer stellt die einzige Frage, und worauf antwortet sie?
      - Der Rabe denkt, bevor er handelt.
    resources:
      - title: Lessing, „Der Rabe und der Fuchs“ (Projekt Gutenberg-DE)
        url: https://projekt-gutenberg.org/authors/gotthold-ephraim-lessing/books/gotthold-ephraim-lessing-fabeln/chapter/47

  - id: replik-pruefen
    type: order
    title: Eine verdächtige Zeile
    prompt: |
      In einem Dialog klingt eine Replik nach Exposition. Bring die Prüfschritte in eine sinnvolle Reihenfolge.
    lang: prose
    lines: |
      Markiere, welche Information die Replik transportiert.
      Frag, ob die angesprochene Figur diese Information schon kennt.
      Frag, ob der Leser sie in dieser Szene braucht.
      Braucht er sie nicht, streich sie oder verschieb sie in eine spätere Szene.
      Braucht er sie, such eine Figur, die sie nicht kennt, oder einen Konflikt dafür.
      Lies die neue Fassung laut und prüf, ob jede Replik noch etwas will.
    alternatives:
      - [1, 3, 2, 4, 5, 6]
      - [1, 2, 3, 5, 4, 6]
      - [1, 3, 2, 5, 4, 6]
    explanation: |
      Erst musst du wissen, um welche Information es geht. Dann prüfst du zwei Dinge, deren Reihenfolge egal ist: ob die Figur sie schon kennt (dann ist es „As you know, Bob“) und ob der Leser sie jetzt braucht. Die beiden Folgerungen schließen einander aus, deshalb dürfen auch sie die Plätze tauschen. Laut lesen kommt zuletzt, weil du damit die neue Fassung prüfst.
    hints:
      - Die erste Zeile legt fest, worüber du überhaupt sprichst.
      - Zwei Zeilen beginnen mit „Braucht er sie“, sie folgen aus den Fragen davor.
    resources:
      - title: Turkey City Lexicon, „As You Know Bob“ und „Infodump“ (SFWA)
        url: https://www.sfwa.org/2009/06/turkey-city-lexicon-a-primer-for-sf-workshops/

  - id: begriffe-dialog
    type: gap
    title: Vier Wörter fürs Handwerk
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Eine Replik ist ⟦Handlung⟧, wenn die Figur damit beim Gegenüber etwas erreichen will. Was eine Figur meint, aber nicht ausspricht, heißt ⟦Subtext⟧. Informationen über Vorgeschichte und Lage, die der Leser zum Verstehen braucht, heißen ⟦Exposition⟧. Wer im Gespräch das Thema bestimmt und wer nur zustimmen darf, zeigt den ⟦Status⟧ der Figuren.
    gaps:
      - label: Dialog als …
        hint: McKee nennt Dialog „verbal action“.
        accept: ["Aktion", "verbale Handlung", "Handeln"]
      - label: das Ungesagte
        hint: Wörtlich der Text unter dem Text.
      - label: Vorgeschichte und Lage
        hint: Fängt mit E an. Das englische Wort steckt in „expository lump“, einem anderen Namen für Infodump.
      - label: Rang im Gespräch
        hint: Ein kurzes Wort für Rang oder Stellung.
        accept: ["Rang", "Machtgefälle", "Statusgefälle", "Machtverhältnis"]
    explanation: |
      Die vier Begriffe hängen zusammen. Weil jede Replik Handlung ist, kann sie etwas anderes wollen, als sie sagt, und daraus entsteht Subtext. Exposition wird zum Problem, wenn sie keine Handlung ist und nur den Leser informiert. Status zeigt sich darin, wer reden darf und wer nur zustimmen kann.

  - id: information-verteilen
    type: practice
    title: Die Werkstatt schließt
    prompt: |
      Lehrbeispiel aus der Übung „Wer braucht die Auskunft?“: Der Leser soll erfahren, dass eine Autowerkstatt Ende des Monats schließt. Schreib zwei bis drei Repliken, in denen diese Information ankommt, ohne dass jemand sie einem anderen erklärt, der sie schon kennt. Figuren, Ton und Weg wählst du selbst.
    lang: prose
    starter: |
      Weg (Konflikt, Figur ohne Wissen, Gegenstand oder anderer):

      Repliken:
    checklist:
      - Höchstens drei Repliken, jede höchstens zwei Sätze.
      - Keine Figur sagt der anderen etwas, das beide schon wissen.
      - Die Schließung wird höchstens einmal direkt ausgesprochen.
      - Für jede Replik kannst du in einem Wort sagen, was die Figur damit will.
    explanation: |
      Die Übung trennt zwei Fragen, die oft zusammenfallen: was der Leser erfahren muss und warum eine Figur es in diesem Moment sagt. Wenn du für jede Replik ein Ziel benennen kannst, ist die Information Teil einer Handlung. Wenn nicht, spricht wieder der Autor.
    hints:
      - Überleg zuerst, wer in der Szene die Information noch nicht hat oder sie als Argument braucht.

  - id: wie-du-weisst
    type: bug
    title: Wer erzählt hier wem?
    prompt: |
      Lehrbeispiel: Zwei Geschwister packen am Umzugstag die letzten Kisten. Finde die Zeile, in der eine Figur der anderen etwas erzählt, das beide schon wissen.
    lang: prose
    code: |
      Mira: Der Umzugswagen steht schon seit zehn Minuten unten.
      Tom: Dann soll er warten. Wo ist das Klebeband?
      Mira: Auf dem Kühlschrank. Wo es immer ist.
      Tom: Wie du weißt, ziehen wir um, weil Papa die Miete nicht mehr zahlen kann.
      Mira: Nimm die Kiste mit den Gläsern zuerst. Die ist schwer.
      Tom: Ich trag die Gläser nicht. Das letzte Mal ist alles kaputtgegangen.
    lines: [4]
    explanation: |
      Zeile 4 ist „As you know, Bob“: Mira weiß, warum sie umziehen, Tom sagt es nur für den Leser. Die übrigen Zeilen wollen etwas, sie drängen, weichen aus, verteilen Arbeit oder wehren sie ab. Zeile 3 hat sogar Subtext, denn „Wo es immer ist“ sagt auch, dass Tom so etwas nie weiß. Den Grund für den Umzug könnte die Szene über einen Gegenstand oder über einen Streit zeigen, statt ihn zu erklären.
    hints:
      - Such die Zeile, die mit einer Formel beginnt, mit der man Bekanntes ankündigt.
    resources:
      - title: Turkey City Lexicon, „As You Know Bob“ (SFWA)
        url: https://www.sfwa.org/2009/06/turkey-city-lexicon-a-primer-for-sf-workshops/

  - id: regieanweisung-zu-viel
    type: bug
    title: Eine Zeile zu deutlich
    prompt: |
      In diesen Ausschnitt aus Büchners Szene (Ausgabe Franzos 1879) ist eine Zeile eingefügt, die nicht von Büchner stammt. Finde die Zeile, die ausspricht, was die Szene sonst nur zeigt. Ein „…“ am Rand einer Replik markiert eine Auslassung.
    lang: prose
    code: |
      Hauptmann. Langsam, Wozzeck, langsam; eins nach dem Andern. Er macht mir ganz schwindlich. …
      Wozzeck. Ja wohl, Herr Hauptmann!
      Hauptmann. Es wird mir ganz angst um die Welt, wenn ich an die Ewigkeit denke. …
      (Wozzeck ärgert sich über das Gerede, aber er widerspricht nicht, weil er vom Hauptmann abhängt.)
      Wozzeck. Ja wohl, Herr Hauptmann!
      Hauptmann. … Red’ Er doch was, Wozzeck. Was ist heut für Wetter?
      Wozzeck. Schlimm, Herr Hauptmann, schlimm. Wind!
    lines: [4]
    explanation: |
      Zeile 4 ist eingefügt. Sie benennt Wozzecks Gefühl und erklärt das Machtgefälle, das die Szene über das wiederholte „Ja wohl, Herr Hauptmann!“ zeigt. Damit entscheidet sie auch, was Büchner offenlässt: ob Wozzeck nicht widersprechen will oder nicht darf. Büchners eigene Regieanweisungen sagen zu Beginn, wer sitzt und wer rasiert, und geben sonst kurze Angaben zum Sprechen wie „(Pfiffig.)“ oder „(mit Würde)“. Sie sagen dem Schauspieler, wie er spricht, und erklären keine Motive.
    hints:
      - Büchners Regieanweisungen in dieser Szene sind sehr kurz.
      - Such die Zeile, die einen Grund nennt.
    resources:
      - title: Georg Büchner, „Wozzeck“, Szene „Zimmer“ (Wikisource)
        url: https://de.wikisource.org/wiki/Wozzeck

  - id: rabe-und-fuchs
    type: explain
    title: Zwei Rollen, ein Stück Fleisch
    prompt: |
      Das ist Lessings ganze Fabel „Der Rabe und der Fuchs“. Erkläre in zwei bis vier Sätzen, was der Fuchs will und was er sagt, warum der Rabe das Fleisch fallen lässt und was das Ende aus der Schmeichelei macht.
    lang: prose
    code: |
      Ein Rabe trug ein Stück vergiftetes Fleisch, das der erzürnte Gärtner für die Katzen seines Nachbars hingeworfen hatte, in seinen Klauen fort.
      Und eben wollte er es auf einer alten Eiche verzehren, als sich ein Fuchs herbeischlich und ihm zurief: Sei mir gesegnet, Vogel des Jupiters! – Für wen siehst du mich an? fragte der Rabe. – Für wen ich dich ansehe? erwiderte der Fuchs. Bist du nicht der rüstige Adler, der täglich von der Rechte des Zeus auf diese Eiche herabkömmt, mich Armen zu speisen? Warum verstellst du dich? Sehe ich denn nicht in der siegreichen Klaue die erflehte Gabe, die mir dein Gott durch dich zu schicken noch fortfährt?
      Der Rabe erstaunte und freuete sich innig, für einen Adler gehalten zu werden. Ich muß, dachte er, den Fuchs aus diesem Irrtume nicht bringen. – Großmütig dumm ließ er ihm also seinen Raub herabfallen und flog stolz davon.
      Der Fuchs fing das Fleisch lachend auf und fraß es mit boshafter Freude. Doch bald verkehrte sich die Freude in ein schmerzhaftes Gefühl; das Gift fing an zu wirken, und er verreckte.
      Möchtet ihr euch nie etwas anders als Gift erloben, verdammte Schmeichler!
    points:
      - Der Fuchs will das Fleisch, sagt aber nur Lob. Sein Lob bietet dem Raben die Rolle des Adlers an, der Gaben bringt.
      - Die Rolle verlangt eine Handlung, denn wer der Adler sein will, muss die „Gabe“ fallen lassen.
      - Der Rabe weiß, dass er kein Adler ist („aus diesem Irrtume nicht bringen“), und spielt mit, weil ihm das Bild gefällt.
      - Der Leser weiß von Anfang an, dass das Fleisch vergiftet ist. Der Erfolg der Schmeichelei wird so zur Strafe des Schmeichlers.
    explanation: |
      Beide Figuren spielen eine Rolle, und beide wissen es. Der Fuchs redet vom Adler, von Zeus und von der Gabe in der „siegreichen Klaue“ und meint das Fleisch. Der Rabe merkt den Irrtum, beschließt aber, ihn nicht aufzuklären, weil er sich „innig“ freut. Die Schmeichelei wirkt also, weil sie einen Wunsch des Raben trifft, nicht weil er dumm ist. Lessing schreibt trotzdem „Großmütig dumm ließ er ihm also seinen Raub herabfallen“ und lässt ihn „stolz“ davonfliegen. Der erste Satz hat dem Leser verraten, dass das Fleisch vergiftet ist, und das wissen beide Figuren nicht. Deshalb liest der Leser die ganze Szene mit einem Vorsprung, und die Moral am Ende richtet sich an die Schmeichler.
    hints:
      - Vergleich, was der Fuchs sagt, mit dem, was er am Ende tut.
      - Lies den Gedanken des Raben genau. Glaubt er selbst, ein Adler zu sein?
    resources:
      - title: Lessing, „Der Rabe und der Fuchs“ (Projekt Gutenberg-DE)
        url: https://projekt-gutenberg.org/authors/gotthold-ephraim-lessing/books/gotthold-ephraim-lessing-fabeln/chapter/47

  - id: tugend-und-geld
    type: explain
    title: Hut, Uhr und Augenglas
    prompt: |
      Kurz zuvor hat Wozzeck gesagt: „Man hat auch sein Fleisch und Blut!“ Erkläre in zwei bis vier Sätzen, was der Hauptmann hier über sich verrät, ohne es zu merken, und was Wozzeck mit seiner höflichen Antwort sagt, ohne es auszusprechen. Zitiert nach der Ausgabe Franzos (1879).
    lang: prose
    code: |
      Hauptmann. Wozzeck! Er hat keine Tugend, Er ist kein tugendhafter Mensch! Fleisch und Blut? Wenn ich am Fenster lieg’, wenn’s geregnet hat, und den weißen Strümpfen so nachseh’, wie sie über die Gasse springen — verdammt! Wozzeck, da kommt mir die Liebe! Ich hab’ auch Fleisch und Blut! Aber Wozzeck, die Tugend! die Tugend! Wie sollte ich dann die Zeit herumbringen? — ich sag’ mir immer: du bist ein tugendhafter Mensch, (gerührt) ein guter Mensch, ein guter Mensch!
      Wozzeck. Ja, Herr Hauptmann, die Tugend — ich hab’s noch nicht so aus. Seh’n Sie, wir gemeine Leut’ — das hat keine Tugend; es kommt einem nur so die Natur. Aber wenn ich ein Herr wär und hätt’ einen Hut und eine Uhr und ein Augenglas und könnt’ vornehm reden, ich wollt’ schon tugendhaft sein. Es muß was Schönes sein um die Tugend, Herr Hauptmann, aber ich bin ein armer Kerl.
    points:
      - Der Hauptmann predigt Tugend und gesteht im selben Atemzug sein eigenes Verlangen („den weißen Strümpfen so nachseh’“), ohne den Widerspruch zu bemerken.
      - Wozzeck widerspricht nicht offen. Er bleibt beim „Herr Hauptmann“ und lobt die Tugend sogar.
      - Hut, Uhr, Augenglas und vornehmes Reden machen Tugend zu einer Frage des Geldes. Darin steckt der Vorwurf.
      - Das Gefälle bleibt bestehen, denn Wozzeck kann seine Kritik nur als Bescheidenheit verpacken („aber ich bin ein armer Kerl“).
    explanation: |
      Der Hauptmann wirft Wozzeck fehlende Tugend vor und erzählt dabei selbst, wie ihn beim Anblick der „weißen Strümpfe“ die Liebe überkommt. Er entlarvt sich, ohne dass ihn jemand darauf hinweist, und lobt sich danach „gerührt“ als guten Menschen. Wozzeck antwortet höflich und scheinbar demütig. Seine Aufzählung von Hut, Uhr und Augenglas sagt aber, dass Tugend etwas ist, das man sich leisten können muss. Ein offener Vorwurf wäre in diesem Machtgefälle nicht möglich, also steckt er in einem Bekenntnis zur eigenen Armut. Der Leser hört beides, das Gesagte und das Gemeinte.
    hints:
      - Lies, wovon der Hauptmann erzählt, bevor er wieder „die Tugend“ ruft.
      - Was haben Hut, Uhr und Augenglas gemeinsam?
    resources:
      - title: Georg Büchner, „Wozzeck“, Szene „Zimmer“ (Wikisource)
        url: https://de.wikisource.org/wiki/Wozzeck

  - id: schweigen-als-antwort
    type: explain
    title: Ins Wort fallen erlaubt
    prompt: |
      Hier ist das Gesprächssystem eines Spiels in eigenen Worten beschrieben. Vergleich es mit Textboxen, die man nacheinander wegklickt. Erkläre in zwei bis vier Sätzen, was dieses System für Subtext bedeutet.
    lang: prose
    code: |
      Oxenfree (Night School Studio, 2016): Die Spielerfigur Alex und die anderen Figuren reden, während sie gehen. Für Gespräche gibt es keine Zwischensequenzen. Über Alex' Kopf erscheinen in Sprechblasen zwei oder drei Antworten. Der Spieler kann jederzeit wählen. Er kann die anderen ausreden lassen, ihnen ins Wort fallen oder gar nichts sagen.
    points:
      - Schweigen ist eine eigene Antwort. Wer nichts sagt, teilt trotzdem etwas mit.
      - Ins Wort fallen zeigt Ungeduld oder Rang, ohne dass eine Figur es benennt.
      - Der Spieler erzeugt Subtext durch Zeitpunkt und Auswahl selbst. Die Autoren schaffen die Lage, in der das möglich ist.
      - Gespräche müssen auch unterbrochen oder ohne Antwort weitergehen. Das kostet Text und Planung.
    explanation: |
      Bei Textboxen, die man wegklickt, bestimmt allein der Autor, was gesagt wird und was ungesagt bleibt. In Oxenfree wählt der Spieler auch den Zeitpunkt. Wer einer Figur ins Wort fällt, zeigt Ungeduld oder beansprucht das Gespräch, und wer schweigt, sagt etwas, ohne ein Wort zu verwenden. Damit liegt ein Teil des Subtexts beim Spieler. Für die Autoren heißt das, dass jedes Gespräch auch abgebrochen oder ohne Antwort funktionieren muss. Night School Studio war ein kleines Team und achtete laut Entwicklungsgeschichte darauf, dass die verzweigten Gespräche nicht ausuferten.
    hints:
      - Was teilt eine Figur mit, wenn der Spieler gar keine Antwort wählt?
      - Denk neben der Wirkung beim Spieler auch an die Arbeit der Autoren.
    resources:
      - title: Wikipedia, „Oxenfree“ (Gameplay und Development)
        url: https://en.wikipedia.org/wiki/Oxenfree

  - id: bitte-ohne-bitte
    type: practice
    title: Eine Bitte, die nicht fällt
    prompt: |
      Schreib eine Replik von höchstens drei Sätzen, in der eine Figur um etwas bittet, ohne die Bitte auszusprechen. Figur, Gegenüber und Lage wählst du selbst, aus deinem eigenen Projekt oder aus dem Alltag. Schreib darunter einen Satz, worum die Figur bittet.
    lang: prose
    starter: |
      Lage (ein Satz):

      Replik:

      Gemeint ist:
    checklist:
      - Die Replik hat höchstens drei Sätze.
      - Sie enthält keine Bitte-Form, also kein „bitte“, kein „kannst du“, kein „ich möchte“ und kein „ich brauche“.
      - In der Replik steht mindestens ein konkreter Gegenstand, Ort oder Zeitpunkt, an dem man die Bitte erkennen kann.
      - Der Satz darunter nennt die Bitte in eigenen Worten.
      - Du hast die Replik laut gelesen.
    explanation: |
      Eine unausgesprochene Bitte ist Subtext in kleinster Form. Damit der Leser sie versteht, braucht die Replik einen Anker in der Lage, etwa einen Gegenstand oder einen Termin. Der Satz darunter ist nur für dich. Mit ihm prüfst du später im Testlauf, ob ein Leser dasselbe heraushört.
    hints:
      - Denk an Lessings Fuchs. Er redet über den Raben, nicht über das Fleisch.
