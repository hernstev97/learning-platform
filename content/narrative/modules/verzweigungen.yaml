id: verzweigungen
title: Verzweigungen begrenzen, Folgen erlebbar machen
level: 3
minutes: 80
summary: Jeder Zweig kostet Text, Grafik und Testzeit – mit Strukturmustern, Variablen und Rückbezügen hältst du Verzweigungen klein und sorgst dafür, dass Spieler die Folgen ihrer Wahl bemerken.
place: unterwegs
goals:
  - Du rechnest aus, wie viele Wege eine Folge von Entscheidungen erzeugt, und benennst, was jeder Zweig kostet.
  - Du erkennst Ashwells Strukturmuster an einem Spiel und nennst Stärke und Kosten des Musters.
  - Du unterscheidest den Verzweigungsbaum von qualitätsbasierten, salienzbasierten und wegpunktbasierten Strukturen nach Emily Short.
  - Du verfolgst Variablen durch einen Ablauf und sagst vorher, welche Szene ein Spieler bei einer Folge von Wahlen sieht.
  - Du wählst zwischen Zustandsvariable, Zusammenführen, verzögerter Folge und Rückbezug, damit eine Entscheidung spürbar bleibt, ohne dass der Baum wächst.
resources:
  - title: Sam Kabo Ashwell, „Standard Patterns in Choice-Based Games“ (2015)
    url: https://heterogenoustasks.wordpress.com/2015/01/26/standard-patterns-in-choice-based-games/
  - title: Emily Short, „Beyond Branching – Quality-Based, Salience-Based, and Waypoint Narrative Structures“ (2016)
    url: https://emshort.blog/2016/04/12/beyond-branching-quality-based-and-salience-based-narrative-structures/
  - title: The Encyclopedia of Science Fiction, „The Walking Dead“ (Spiel)
    url: https://sf-encyclopedia.com/entry/walking_dead_the_game
  - title: Matthew Byrd, „The Walking Dead – The False Promises of Telltale’s Masterpiece“ (Den of Geek, 2018)
    url: https://www.denofgeek.com/games/the-walking-dead-false-promises-telltale/
lesson: |
  In *80 Days* von inkle reist du in achtzig Tagen um die Welt und entscheidest selbst über Route, Handel und den Verlauf der Geschichten unterwegs. Das Spiel enthält rund 750.000 Wörter. Eine vollständige Weltumrundung zeigt dir davon nach Schätzung der Entwickler etwa zwei Prozent ([Wikipedia: 80 Days](https://en.wikipedia.org/wiki/80_Days_(2014_video_game))). Der Rest wurde geschrieben, eingebaut und getestet, ohne dass du ihn in diesem Durchgang zu sehen bekommst.

  So rechnet jede verzweigte Geschichte. Jede Option, die etwas ändert, kostet Arbeit, auch wenn die meisten Spieler sie nie sehen. Dieses Modul zeigt dir, wie du Verzweigungen begrenzt, ohne Entscheidungen zu entwerten, und wie du Folgen so platzierst, dass der Spieler sie bemerkt. Es baut auf [Spielerwissen](/narrative/spielerwissen) und [Folgen und Anreize](/narrative/folgen-anreize) auf. Am PC setzt du es in der [Werkstatt Entscheidung](/narrative/werkstatt-entscheidung) um.

  ## Kombinatorische Explosion: was jeder Zweig kostet

  Nimm drei Entscheidungen hintereinander, jede mit zwei Optionen. Führt keine Option zurück, gibt es nach der ersten Wahl zwei Wege, nach der zweiten vier, nach der dritten acht. Bei zehn solchen Entscheidungen wären es 1.024. Das heißt kombinatorische Explosion: Mit jeder Entscheidung, die nicht zurückführt, vervielfacht sich die Zahl der Wege um die Zahl ihrer Optionen.

  ```text
  Start
  ├─ A
  │  ├─ AA → AAA, AAB
  │  └─ AB → ABA, ABB
  └─ B
     ├─ BA → BAA, BAB
     └─ BB → BBA, BBB
  ```

  Jeder dieser acht Wege braucht eigenen Text, oft eigene Bilder, Animationen oder Stimmen. Und jemand muss jeden Weg durchspielen, um Fehler zu finden. Je mehr Zweige du baust, desto kleiner wird der Anteil, den ein einzelner Spieler sieht.

  Verzweigte Spiele lassen ihre Wege deshalb wieder zusammenlaufen und merken sich, was der Spieler gewählt hat. Wie das aussehen kann, haben Sam Kabo Ashwell und Emily Short beschrieben.

  > [!MERKE]
  > Jede Entscheidung, die nicht zurückführt, vervielfacht die Wege um die Zahl ihrer Optionen. Drei Entscheidungen mit je zwei Optionen ergeben acht Wege.

  ## Ashwells Muster: acht Formen, eine Geschichte zu verzweigen

  Sam Kabo Ashwell hat 2015 in „Standard Patterns in Choice-Based Games“ wiederkehrende Strukturen von Entscheidungsspielen benannt ([Ashwell 2015](https://heterogenoustasks.wordpress.com/2015/01/26/standard-patterns-in-choice-based-games/)). Er betont, dass es keine sauberen Kategorien sind. Viele Werke mischen mehrere Muster. Hier je Muster ein Satz, dazu Stärke und Kosten.

  - **Time Cave**: verzweigt stark, führt kaum zusammen, hat viele Enden und braucht deshalb kaum Variablen. Stärke: Freiheit, kurze Durchgänge, Anreiz zum Wiederspielen. Kosten: Die meisten Spieler verpassen einen großen Teil des Inhalts.
  - **Gauntlet**: ein fast linearer Strang, dessen Seitenäste schnell enden, durch Scheitern, Umkehr oder baldige Rückkehr. Stärke: lässt sich planen wie eine lineare Geschichte, fast jeder sieht das Wichtige. Kosten: Der Spieler merkt, dass sein Pfad eng ist.
  - **Branch and Bottleneck** (Zweig und Engpass): Die Zweige laufen regelmäßig an Ereignissen zusammen, die in jeder Fassung der Geschichte vorkommen. Stärke: Der Spieler formt seine eigene Geschichte, der Plot bleibt beherrschbar. Kosten: Das Muster braucht viele Variablen und ein längeres Werk, damit sich Unterschiede ansammeln.
  - **Quest**: Die Zweige ordnen sich nach Orten. Kleine Gruppen von Szenen bieten viele Wege durch dieselbe Situation und führen zu wenigen Enden. Stärke: Erkundung einer stimmigen Welt. Kosten: Das Muster braucht viel Umfang, die Erzählung zerfällt in Episoden.
  - **Open Map**: Wege zwischen den Orten gehen in beide Richtungen, die Welt wartet, bis der Spieler sie erkundet. Stärke: Zeit, die Welt zu verstehen. Kosten: Die Geschichte wird langsamer und weniger gerichtet.
  - **Sorting Hat**: Der Anfang verzweigt und führt viel zusammen, bis feststeht, auf welche große Route der Spieler kommt. Die Routen laufen dann eher linear. Stärke: ein Kompromiss aus Breite und Tiefe. Kosten: Die Autorin schreibt am Ende mehrere Spiele.
  - **Floating Modules**: Es gibt keinen Stamm. Einzelne Begegnungen werden je nach Zustand oder Zufall verfügbar. Stärke: Neue Module lassen sich einfügen. Kosten: Eine Szene kann wenig über das Vorher annehmen, und mit zu wenig Inhalt kippt das Muster in einen linearen Ablauf.
  - **Loop and Grow**: Der Hauptstrang kehrt immer wieder an denselben Punkt zurück, und mit jeder Runde öffnen oder schließen Variablen Optionen. Stärke: eine verlässliche Welt, die trotzdem vorankommt. Kosten: Die Wiederholung braucht einen Grund in der Geschichte. Eine Variante ist Spoke and Hub: Ausflüge, die von einem zentralen Ort ausgehen und dorthin zurückführen.

  Für die Übungen kannst du an Spiele denken, die du gut kennst. Ashwell selbst ordnet zum Beispiel 80 Days der Quest zu. Auch The Walking Dead oder ein Twine-Werk, das du gespielt hast, eignen sich zum Vergleich.

  > [!NOTE] Gauntlets in Twine
  > Ashwell unterscheidet tödliche und freundliche Gauntlets. Bei freundlichen führen die Seitenäste schnell zurück, statt im Scheitern zu enden. Nach seiner Beobachtung machen freundliche Gauntlets einen großen Teil der Twine-Werke aus.

  ## Jenseits des Baums: Storylets, Salienz und Wegpunkte

  Emily Short wendet sich 2016 gegen die Gewohnheit, jede nichtlineare Geschichte „verzweigt“ zu nennen ([Short 2016](https://emshort.blog/2016/04/12/beyond-branching-quality-based-and-salience-based-narrative-structures/)). Sie stellt drei andere Antworten auf dieselbe Frage vor: Welches Stück Inhalt zeige ich als Nächstes?

  **Qualitätsbasiert (Quality-Based Narrative, QBN).** Den Begriff hat Failbetter Games geprägt, Shorts Hauptbeispiel ist deren Fallen London. Die Geschichte besteht aus Storylets: kurzen Abschnitten mit einer Wahl und ihrem Ergebnis. Zahlenwerte, die Qualities, schalten sie frei.

  Short rechnet vor, was das spart. Sollen drei Hinweise in beliebiger Reihenfolge gefunden werden, muss ein Baum jede Reihenfolge einzeln ausschreiben. Mit Storylets sind es drei Hinweise und eine Anklage, die erst offen ist, wenn alle drei gefunden sind.

  **Salienzbasiert.** Das System wählt selbst den Inhalt, der zur aktuellen Lage passt. Shorts Beispiel sind Sätze für eine Küche: Ein allgemeiner Satz gilt immer, ein speziellerer nur, wenn außerdem die Speisekammer leer ist. Passen mehrere, gewinnt der speziellere. So arbeitet nach Short Elan Ruskins Dialogsystem für Left 4 Dead, und Firewatch hat das Prinzip übernommen.

  **Wegpunkte.** In Shorts Spiel Glass steuern die Figuren im Gespräch Themen an, die die Geschichte weiterbringen. Lenkt der Spieler um, suchen sie einen neuen Weg zum nächsten Wegpunkt. Short beschreibt das als Gegenteil der kombinatorischen Explosion: Mehr Inhalt macht die Rückkehr zur geplanten Szene geschmeidiger, statt neue Pflichten zu erzeugen.

  > [!DEEP] Warum Salienz klein anfangen kann
  > Short nennt einen Vorteil salienzbasierter Systeme: Du beginnst mit breiten Standardsätzen und ergänzt nach und nach speziellere für einzelne Situationen. Du musst nie jede mögliche Lage abdecken, weil immer ein allgemeiner Satz greift.

  ## Zustand statt Zweig: Techniken, die Text sparen

  Viele Entscheidungen brauchen keinen eigenen Zweig. Es genügt, dass das Spiel sie sich merkt und an der richtigen Stelle darauf zurückkommt.

  - **Zustandsvariable.** Die Wahl setzt einen Wert, etwa `zug = verpasst`. Spätere Szenen fragen ihn ab und ändern einen Satz, eine Reaktion oder ein Bild. Der Weg bleibt derselbe.
  - **Zusammenführen** (englisch oft *Foldback*). Zwei Zweige münden nach kurzer Zeit in dieselbe Szene. Ohne Variable ist die Wahl danach vergessen, mit Variable bleibt sie erhalten. Genau daran unterscheidet Ashwell Branch and Bottleneck vom Gauntlet.
  - **Verzögerte Folge.** Die Wahl wirkt erst später. Dan Fabulich von Choice of Games nennt das Prinzip hinter Branch and Bottleneck laut Ashwell „delayed branching“. Bis zur Folge laufen alle Wege gemeinsam, das spart Text.
  - **Bestätigung kleiner Entscheidungen.** Telltales The Walking Dead blendet nach Entscheidungen eine kleine Meldung ein: Eine Figur wird sich an die Wahl „erinnern“ ([Encyclopedia of Science Fiction](https://sf-encyclopedia.com/entry/walking_dead_the_game)). Die Meldung kostet kaum Text und macht die Wahl spürbar.
  - **Kosmetisch oder folgenreich.** Eine kosmetische Wahl ändert, wie etwas erzählt wird. Eine folgenreiche ändert, was passiert. Kosmetische Wahlen geben der Spielerfigur eine Stimme und kosten wenig, folgenreiche verändern die Lage und kosten viel.
  - **Wenige große, viele kleine.** Ein paar echte Verzweigungen tragen die Struktur. Viele kleine Rückbezüge zeigen dem Spieler, dass das Spiel ihm zuhört.

  > [!WARNING] Eine Bestätigung ist ein Versprechen
  > Matthew Byrd argumentiert bei Den of Geek, dass die großen Folgen in The Walking Dead weitgehend feststehen. Die berühmte Meldung „Clementine will remember that“ verspreche deshalb mehr, als das Spiel einlöst ([Den of Geek, 2018](https://www.denofgeek.com/games/the-walking-dead-false-promises-telltale/)). Kündige nur an, was später sichtbar wird.

  ## Ablaufnotation: Zustand lesen

  Um Abläufe ohne Werkzeug zu prüfen, nutzen die Übungen eine kleine Notation. Sie lehnt sich an Skriptsprachen wie ink an, die Wahlen mit `*` und Sprünge mit `->` schreiben ([Writing with ink](https://github.com/inkle/ink/blob/master/Documentation/WritingWithInk.md#2-choices)), ist aber stark vereinfacht.

  ```text
  # Bahnsteig
  * Einsteigen: zug = erreicht
    -> Abteil
  * Kaffee holen: zug = verpasst
    -> Wartehalle
  # Abteil
  -> Ankunft
  # Wartehalle
  -> Ankunft
  # Ankunft
  wenn zug = verpasst
    -> Taxi
  sonst
    -> Abholung
  ```

  - `# Name` beginnt eine Szene.
  - `* Text` ist eine Wahl, die der Spieler sieht. Steht dahinter `: name = wert`, setzt die Wahl diese Variable.
  - `->` in der Zeile darunter führt zur nächsten Szene. Steht der Pfeil direkt unter dem Szenennamen, geht es ohne Wahl weiter.
  - `wenn` prüft eine Bedingung, `und` verlangt, dass beide Teile zutreffen. Der Ablauf liest die Bedingungen von oben nach unten, die erste, die zutrifft, gilt. `sonst` gilt, wenn keine zutrifft.
  - Eine Variable, die auf dem bisherigen Weg keine Wahl gesetzt hat, hat keinen Wert. Jede Bedingung mit ihr ist falsch. Gesetzte Werte bleiben bis zum Ende erhalten.

  Im Beispiel ist `Ankunft` der Engpass. Beide Wege kommen dort an, und die Variable entscheidet, wie es weitergeht.

  ## Folgen erlebbar machen

  Eine Folge, die der Spieler nicht bemerkt, wirkt wie keine. Drei Regeln helfen dir, Folgen sichtbar zu platzieren.

  **Zeig die Folge dort, wo der Spieler hinsieht.** Ein geänderter Satz in einem Menü geht unter, eine Figur, die anders reagiert, nicht. Short beschreibt, dass Firewatch für einige Gespräche sichtbare Rückbezüge in der Spielwelt anlegt.

  **Erinnere an den Moment der Entscheidung.** Ein Rückbezug nimmt ein Detail aus der Wahl wieder auf: dieselben Worte, denselben Gegenstand, denselben Ort. So verbindet der Spieler Folge und Ursache, ohne dass das Spiel es erklären muss.

  **Überbrücke großen Abstand.** Je länger die Wahl zurückliegt, desto eher braucht der Spieler eine Erinnerung, etwa eine Figur, die das Thema kurz vor der Folge erwähnt. The Walking Dead trägt Entscheidungen sogar über Staffeln hinweg: Wer auf demselben Gerät spielt, bringt Entscheidungen aus der Episode „400 Days“ in die zweite Staffel mit, und sie bestimmen, welche wiederkehrenden Figuren auftauchen ([Encyclopedia of Science Fiction](https://sf-encyclopedia.com/entry/walking_dead_the_game)).

  > [!TIP] Rückbezug prüfen
  > Geh jede spätere Folge in deinem Ablauf durch und frag: Erkennt jemand, der die Wahl vor einer Stunde getroffen hat, woher diese Folge kommt? Fällt die Antwort nein aus, fehlt ein Rückbezug oder eine Erinnerung kurz davor.

  ## Häufige Fehler

  - **Der Baum wächst ungebremst.** Du erkennst es daran, dass sich die offenen Enden in deinem Plan mit jeder Entscheidung verdoppeln. Führ Zweige zusammen und speichere die Wahl in einer Variable.
  - **Zusammenführen löscht die Wahl.** Zwei Zweige münden in denselben Engpass, und danach fragt keine Szene mehr ab, wie der Spieler gewählt hat. Ergänze mindestens einen Rückbezug.
  - **Abfrage vor dem Setzen.** Eine Szene prüft eine Variable, die auf keinem Weg dorthin gesetzt wird. Die Bedingung ist dann immer falsch, und die Szene dahinter sieht niemand. Prüf für jede Abfrage alle Wege, die zu ihr führen.
  - **Falsche Reihenfolge der Bedingungen.** Treffen zwei Bedingungen zugleich zu, gewinnt die obere. Steht die allgemeine oben, kommt die speziellere nie zum Zug.
  - **Versprechen ohne Folge.** Eine Meldung kündigt Konsequenzen an, die nie erscheinen. Streich die Meldung oder bau die Folge.
  - **Folge ohne Verbindung.** Die Folge kommt so spät oder so leise, dass niemand sie der Wahl zuordnet. Setz einen Rückbezug oder eine Erinnerung davor.

  > [!PRAXIS] Kleine Rückbezüge in Fallen London
  > Emily Short hat selbst Geschichten für Fallen London geschrieben. Sie berichtet, dass einige davon eigene Optionen öffnen, wenn der Spieler genau die passenden Gegenstände aus einem früheren Abenteuer besitzt. Diese Optionen erreichen meist dasselbe Ziel wie die übrigen, aber auf eigene Art, mit eigenem Text und manchmal einer kleinen Belohnung. Der Weg bleibt gleich, nur der Text erkennt an, was der Spieler früher getan hat.

  ## Zusammenfassung

  - Jede Entscheidung, die nicht zurückführt, vervielfacht die Wege. Drei Wahlen mit je zwei Optionen ergeben acht Wege, und jeder kostet Text, Grafik und Testzeit.
  - Ashwells acht Muster benennen Strukturen mit eigener Stärke und eigenen Kosten. Branch and Bottleneck ist ein verbreiteter Kompromiss, braucht aber Variablen.
  - Emily Short beschreibt Alternativen zum Baum: Storylets, die Qualities freischalten, Auswahl nach Salienz und Gespräche, die Wegpunkte ansteuern.
  - Zustandsvariablen, Zusammenführen und verzögerte Folgen sparen Text, ohne die Wahl zu löschen.
  - Eine Bestätigung wie „… will remember that“ ist ein Versprechen, das eine spätere Folge einlösen muss.
  - Folgen wirken, wenn der Spieler sie sieht, mit der Wahl verbindet und bei großem Abstand vorher erinnert wird.
  - Bevor eine Szene eine Variable abfragt, prüfst du, auf welchen Wegen sie gesetzt wird und welche Bedingung zuerst greift.
exercises:
  - id: muster-umzug
    type: choice
    title: Viele Wahlen, dann drei Wege
    prompt: |
      Lehrbeispiel: In einem Spiel über einen Umzug triffst du in der ersten Stunde viele kleine Entscheidungen. Sie laufen immer wieder in gemeinsamen Szenen zusammen. Danach kommst du in eine von drei Wohnungen, und jede Wohnung erzählt ihren eigenen Abschnitt fast ohne weitere Wahl.

      Welches Muster nach Ashwell passt zu diesem Aufbau?
    options:
      - text: Sorting Hat
        correct: true
        why: Der verzweigte Anfang entscheidet, auf welche große Route du kommst. Die Routen laufen danach eher linear. So beschreibt Ashwell den Sorting Hat.
      - text: Time Cave
        correct: false
        why: Eine Time Cave führt kaum zusammen und hat viele Enden. Hier laufen die frühen Wahlen ständig zusammen, und es gibt nur drei Routen.
      - text: Branch and Bottleneck
        correct: false
        why: Der Anfang sieht so aus. Danach teilt sich das Spiel aber in drei getrennte Routen, statt immer wieder in einen gemeinsamen Strang zurückzukehren.
      - text: Loop and Grow
        correct: false
        why: Nichts kehrt an denselben Punkt zurück. Loop and Grow lebt von Runden, in denen sich neue Optionen öffnen.
    hints:
      - Achte darauf, was nach der ersten Stunde passiert.
      - Welches Muster teilt Spieler auf feste Routen auf?
    explanation: |
      Ashwell beschreibt den Sorting Hat so: Der Anfang verzweigt stark und führt stark zusammen, oft nach dem Muster Branch and Bottleneck, und legt dabei fest, auf welche große Route der Spieler kommt. Diese Routen sind meist linear. Der Preis: Die Autorin schreibt praktisch mehrere Spiele. Ashwell hält es außerdem für wichtig, dem Spieler den Charakter der Routen anzudeuten, weil er die Linearität der zweiten Hälfte bemerkt.
    resources:
      - title: Ashwell, „Standard Patterns in Choice-Based Games“
        url: https://heterogenoustasks.wordpress.com/2015/01/26/standard-patterns-in-choice-based-games/
  - id: nachricht-zwei-wege
    type: choice
    title: Eine Nachricht, zwei Wege
    prompt: |
      Lehrbeispiel: Am Bahnhof entscheidet der Spieler, ob er seiner Schwester schreibt, dass er später kommt. Die Wahl soll spürbar bleiben, aber für zwei getrennte Geschichten fehlt dir die Zeit.

      Welche Lösung passt?
    options:
      - text: Beide Wege führen in die nächste Szene zurück. Eine Variable merkt sich die Wahl, die Begrüßung der Schwester und eine spätere Szene greifen sie auf.
        correct: true
        why: Zusammenführen hält den Text klein, die Variable bewahrt die Wahl, und zwei Rückbezüge machen sie sichtbar.
      - text: Ab der Wahl laufen zwei vollständige Stränge bis zum Ende, damit jede Option ihre eigene Geschichte bekommt.
        correct: false
        why: Das verdoppelt allen Text ab dieser Stelle. Für eine kleine Wahl ist das unverhältnismäßig teuer.
      - text: Beide Wege führen in die nächste Szene zurück. Das Spiel merkt sich nicht, wie gewählt wurde, und erzählt gleich weiter.
        correct: false
        why: Das ist billig, aber danach ist die Wahl vergessen. Nach Ashwell entsteht so ein Gauntlet, dessen Seitenäste folgenlos zurückkehren.
      - text: "Beide Wege führen zurück, und eine Meldung erscheint: „Deine Schwester wird sich das merken.“ Danach kommt das Spiel nie wieder darauf zurück."
        correct: false
        why: Die Meldung verspricht eine Folge, die nie kommt. Spätestens beim zweiten Durchgang merkt der Spieler das.
    hints:
      - Gesucht ist die Lösung, die wenig Text kostet und die Wahl trotzdem erhält.
    explanation: |
      Branch and Bottleneck mit einer Zustandsvariable ist hier der Mittelweg: Die Wege laufen sofort wieder zusammen, aber das Spiel weiß noch, wie gewählt wurde. Zwei kleine Rückbezüge, die Begrüßung und eine spätere Szene, machen die Wahl erlebbar. Getrennte Stränge vervielfachen den Text, Zusammenführen ohne Variable löscht die Wahl, und eine Meldung ohne spätere Folge ist ein gebrochenes Versprechen.
    resources:
      - title: Ashwell, Abschnitt „Branch and Bottleneck“
        url: https://heterogenoustasks.wordpress.com/2015/01/26/standard-patterns-in-choice-based-games/
  - id: nach-der-kueche
    type: output
    title: Wer telefoniert, sieht …
    prompt: |
      Notation: `#` beginnt eine Szene, `*` ist eine Wahl, `: name = wert` setzt eine Variable, `->` führt weiter. Steht der Pfeil direkt unter dem Szenennamen, geht es ohne Wahl weiter. `wenn` prüft eine Variable, `sonst` gilt, wenn die Bedingung nicht zutrifft. Eine Variable, die keine Wahl gesetzt hat, hat keinen Wert.

      Der Spieler wählt „Telefonieren“. Welche Szene sieht er nach der Küche? Antworte nur mit dem Szenennamen.
    lang: ablauf
    code: |
      # Treppenhaus
      * Kisten tragen: hilfe = ja
        -> Keller
      * Telefonieren
        -> Balkon
      # Keller
      -> Küche
      # Balkon
      -> Küche
      # Küche
      wenn hilfe = ja
        -> Pizza
      sonst
        -> Abwasch
      # Pizza
      -> Abend
      # Abwasch
      -> Abend
    expected: Abwasch
    accept: ["abwasch", "Abwasch."]
    hints:
      - „Telefonieren“ setzt keine Variable.
      - Welchen Wert hat `hilfe` in der Küche?
    explanation: |
      „Telefonieren“ führt auf den Balkon und setzt nichts. Vom Balkon geht es ohne Wahl in die Küche, den ersten Engpass. Dort hat `hilfe` keinen Wert, die Bedingung ist falsch, und `sonst` führt zum Abwasch. Danach enden beide Wege im Abend, dem zweiten Engpass. Küche und Abend sieht jeder Spieler, Keller, Balkon, Pizza und Abwasch nur ein Teil.
  - id: zug-verpasst
    type: output
    title: Kaffee statt Zug
    prompt: |
      Notation: `#` beginnt eine Szene, `*` ist eine Wahl, `: name = wert` setzt eine Variable, `->` führt weiter. Bedingungen mit `wenn` werden von oben nach unten geprüft, die erste, die zutrifft, gilt. `und` verlangt beide Teile. Eine Variable ohne Wert macht jede Bedingung falsch.

      Der Spieler wählt erst „Kaffee holen“, dann „Lesen“. Welche Szene sieht er nach der Ankunft? Antworte nur mit dem Szenennamen.
    lang: ablauf
    code: |
      # Bahnsteig
      * Einsteigen: zug = erreicht
        -> Abteil
      * Kaffee holen: zug = verpasst
        -> Wartehalle
      # Abteil
      * Anrufen: anruf = ja
        -> Ankunft
      * Lesen
        -> Ankunft
      # Wartehalle
      * Anrufen: anruf = ja
        -> Ankunft
      * Lesen
        -> Ankunft
      # Ankunft
      wenn zug = verpasst und anruf = ja
        -> Abholung
      wenn zug = verpasst
        -> Taxi
      sonst
        -> Bahnhofsplatz
    expected: Taxi
    accept: ["taxi", "Taxi."]
    hints:
      - Schreib dir die beiden Variablen auf, nachdem der Spieler gewählt hat.
      - "`anruf` hat keinen Wert, weil „Lesen“ nichts setzt."
    explanation: |
      „Kaffee holen“ setzt `zug = verpasst`, „Lesen“ setzt nichts. In der Ankunft scheitert die erste Bedingung, weil `anruf` keinen Wert hat. Die zweite trifft zu, also folgt das Taxi. Die Ankunft ist ein Engpass: Abteil und Wartehalle führen beide dorthin, und erst die Variablen entscheiden, wie es weitergeht. Mit zwei Variablen entstehen drei Ausgänge, ohne dass die Geschichte vorher in vier Stränge zerfällt.
  - id: erste-bedingung-gewinnt
    type: output
    title: Zwei Bedingungen, eine Szene
    prompt: |
      Gleiche Notation wie in der vorigen Übung. Bedingungen werden von oben nach unten geprüft, die erste, die zutrifft, gilt.

      Der Spieler wählt „Brief öffnen“, dann „Nachbarin anrufen“. Welche Szene folgt auf das Treppenhaus? Antworte nur mit dem Szenennamen.
    lang: ablauf
    code: |
      # Flur
      * Brief öffnen: brief = gelesen
        -> Küche
      * Brief liegen lassen
        -> Küche
      # Küche
      * Nachbarin anrufen: nachbarin = ja
        -> Treppenhaus
      * Kochen
        -> Treppenhaus
      # Treppenhaus
      wenn nachbarin = ja
        -> Gespräch
      wenn brief = gelesen
        -> Paket
      sonst
        -> Stille
    expected: Gespräch
    accept: ["gespräch", "Gespraech", "gespraech"]
    hints:
      - Beide Variablen sind gesetzt.
      - Welche Bedingung steht weiter oben?
    explanation: |
      Beide Bedingungen treffen zu. Der Ablauf nimmt die erste, also das Gespräch. Wer beide Variablen gesetzt hat, sieht das Paket nie, obwohl er den Brief geöffnet hat. Ob das Absicht ist, entscheidest du beim Entwurf: Die Reihenfolge der Bedingungen ist eine Designentscheidung. Harlowe arbeitet mit `(else-if:)` genauso, das nutzt du in der [Werkstatt Entscheidung](/narrative/werkstatt-entscheidung).
  - id: musternamen
    type: gap
    title: Vier Muster, vier Namen
    prompt: Ergänze die Namen der Muster aus Ashwells Liste.
    lang: prose
    code: |
      Verzweigt eine Geschichte stark, führt kaum zusammen und hat viele Enden, nennt Ashwell das Muster ⟦Time Cave⟧.
      Laufen die Zweige regelmäßig an gemeinsamen Ereignissen zusammen, und das Spiel merkt sich die Wahl, heißt das Muster ⟦Branch and Bottleneck⟧.
      Kehrt der Hauptstrang immer wieder an denselben Punkt zurück und öffnet dabei neue Optionen, ist es ⟦Loop and Grow⟧.
      Enden alle Seitenäste schnell und kehren auf einen fast linearen Strang zurück, ist es ein ⟦Gauntlet⟧.
    gaps:
      - label: Viele Enden
        hint: Zwei englische Wörter, das zweite heißt „Höhle“.
        accept: ["Timecave"]
      - label: Zweig und Engpass
        hint: Drei englische Wörter.
        accept: ["Branch & Bottleneck", "Zweig und Engpass"]
      - label: Runde um Runde
        hint: Drei englische Wörter, das letzte heißt „wachsen“.
        accept: ["Loop & Grow"]
      - label: Enger Pfad
        hint: Ein englisches Wort für einen Spießrutenlauf.
    explanation: |
      Die Namen stammen von Sam Kabo Ashwell. Time Cave und Gauntlet sind die beiden Gegenpole: breit mit vielen Enden gegen lang und schmal. Branch and Bottleneck liegt dazwischen und funktioniert nur mit Variablen. Loop and Grow kann sich mit anderen Mustern verbinden, etwa als Gauntlet, der sich in Runden wiederholt.
    resources:
      - title: Ashwell, „Standard Patterns in Choice-Based Games“
        url: https://heterogenoustasks.wordpress.com/2015/01/26/standard-patterns-in-choice-based-games/
  - id: techniken-benennen
    type: gap
    title: Was Text spart
    prompt: Ergänze die Techniken aus der Lektion.
    lang: prose
    code: |
      Statt einen eigenen Zweig zu bauen, speichert der Ablauf die Wahl in einer ⟦Variable⟧.
      Zwei Zweige, die wieder in dieselbe Szene münden, werden ⟦zusammengeführt⟧.
      Wirkt eine Wahl erst viele Szenen später, ist es eine ⟦verzögerte⟧ Folge.
      Eine Szene, die ein Detail aus dem Moment der Wahl wieder aufnimmt, ist ein ⟦Rückbezug⟧.
    gaps:
      - label: Speicher
        hint: Ein Wert, den spätere Szenen abfragen.
        accept: ["Zustandsvariable", "Variablen"]
      - label: Wieder vereint
        hint: Partizip, im Englischen oft „foldback“.
        accept: ["zusammengefuehrt", "wieder zusammengeführt"]
      - label: Später
        hint: Ein Adjektiv, englisch „delayed“.
        accept: ["verzoegerte", "spätere"]
      - label: Erinnerung
        hint: Ein Wort mit „Rück-“.
        accept: ["Rückverweis", "Callback"]
    explanation: |
      Variable, Zusammenführen und verzögerte Folge arbeiten zusammen: Die Wege laufen gemeinsam weiter, die Variable trägt die Wahl mit, und die Folge erscheint später an einer Stelle, die alle Wege teilen. Der Rückbezug sorgt dafür, dass der Spieler die Folge mit seiner Wahl verbindet.
    resources:
      - title: Short, „Beyond Branching“
        url: https://emshort.blog/2016/04/12/beyond-branching-quality-based-and-salience-based-narrative-structures/
  - id: abfrage-vor-dem-setzen
    type: bug
    title: Eine Szene, die niemand sieht
    prompt: |
      Gleiche Notation wie in den Vorhersage-Übungen. In diesem Ablauf fragt eine Bedingung eine Variable ab, die auf keinem Weg dorthin gesetzt sein kann. Die Szene dahinter sieht deshalb nie jemand. Finde die Zeile mit dieser Abfrage.
    lang: ablauf
    code: |
      # Keller
      * Kisten beschriften: plan = ja
        -> Flur
      * Kisten stapeln
        -> Flur
      # Flur
      wenn plan = ja
        -> Ordnung
      sonst
        -> Suche
      # Suche
      * Nachbarn fragen: hilfe = ja
        -> Wohnzimmer
      # Ordnung
      wenn hilfe = ja
        -> Pause
      sonst
        -> Wohnzimmer
    lines: [15]
    hints:
      - Es gibt zwei Abfragen. Verfolge für jede, auf welchen Wegen man zu ihr kommt.
      - Zur Ordnung kommt nur, wer „Kisten beschriften“ gewählt hat. Wo wird `hilfe` gesetzt?
    explanation: |
      Zeile 15 fragt `hilfe` ab. In die Ordnung kommt aber nur, wer im Keller „Kisten beschriften“ gewählt hat, und auf diesem Weg setzt niemand `hilfe`. Gesetzt wird die Variable nur in der Suche, die auf dem anderen Weg liegt. Die Bedingung ist also immer falsch, und die Pause ist toter Inhalt: geschrieben, aber unerreichbar. Die Abfrage in Zeile 7 ist in Ordnung, denn `plan` wird auf einem Weg gesetzt, und `sonst` fängt den anderen ab.
  - id: engpass-braucht-zustand
    type: explain
    title: Warum der Engpass ein Gedächtnis braucht
    prompt: Erkläre in zwei bis vier Sätzen, warum ein Engpass ohne Variablen die Entscheidungen davor entwertet und warum das Muster ein längeres Werk braucht.
    lang: prose
    code: |
      Ashwell beschreibt Branch and Bottleneck so: Die Geschichte verzweigt, aber die Zweige treffen sich regelmäßig wieder, meist an Ereignissen, die in jeder Fassung der Geschichte vorkommen. Damit frühere Wahlen dabei nicht ausgelöscht werden, verfolgen solche Werke fast immer viele Variablen. Tun sie das nicht, hat man es nach Ashwell eher mit einem Gauntlet zu tun. Das Muster braucht nach seiner Beobachtung ein größeres Werk, weil sich Veränderungen erst ansammeln müssen.
    points:
      - Am Engpass stehen alle Spieler wieder an derselben Stelle. Ohne gespeicherten Zustand verhält sich das Spiel ab dort für alle gleich.
      - Variablen tragen die Wahl über den Engpass hinaus, sodass spätere Szenen sie aufgreifen können.
      - Ohne Variablen bleibt ein Gauntlet mit Seitenästen, die folgenlos zurückkehren.
      - Unterschiede werden erst sichtbar, wenn sich mehrere Wahlen angesammelt haben. Dafür braucht es Länge.
    hints:
      - Was weiß das Spiel am Engpass noch über den Weg dorthin?
    explanation: |
      Am Engpass laufen alle Wege zusammen, und von dort an gibt es nur noch eine Fassung der Geschichte. Ohne Variablen weiß das Spiel nicht mehr, wie jemand dorthin gekommen ist. Die Seitenäste waren dann Umwege ohne Folge, und Ashwell würde das Ganze einen Gauntlet nennen. Mit Variablen trägt jeder Spieler seine Wahl über den Engpass hinaus, und spätere Szenen können sie in einem Satz, einer Reaktion oder einem eigenen Abschnitt aufgreifen. Weil ein einzelner Rückbezug kaum auffällt, braucht das Muster Länge: Erst wenn sich mehrere Wahlen angesammelt haben, unterscheiden sich zwei Durchgänge spürbar. Ashwell beobachtet dazu, dass Durchgänge am Anfang oft sehr ähnlich sind und erst später auseinanderlaufen.
    resources:
      - title: Ashwell, Abschnitt „Branch and Bottleneck“
        url: https://heterogenoustasks.wordpress.com/2015/01/26/standard-patterns-in-choice-based-games/
  - id: clementine-erinnert-sich
    type: explain
    title: Was sich Clementine merkt
    prompt: Erkläre in zwei bis vier Sätzen, was die Meldung für den Spieler leistet, was sie die Entwickler kostet und warum sie kritisiert wird.
    lang: prose
    code: |
      The Walking Dead, Season One (Telltale Games, 2012): Kurz nachdem du entschieden hast, wie du mit dem Mädchen Clementine sprichst, erscheint eine kleine Meldung auf dem Bildschirm: Clementine wird sich das merken. Solche Meldungen erscheinen nach vielen Entscheidungen im Spiel. Was genau sie sich merkt, sagt die Meldung nicht.
    points:
      - Die Meldung bestätigt die Wahl sofort und macht bewusst, dass sie zählt.
      - Sie kostet kaum Text, weil sie keine neue Szene braucht.
      - Sie lässt offen, was die Figur sich merkt, und weckt so die Erwartung einer späteren Folge.
      - Matthew Byrd kritisiert, dass die großen Folgen weitgehend feststehen und die Meldung mehr verspricht, als das Spiel einlöst.
    hints:
      - Denk an den Moment direkt nach der Wahl und an das Ende des Spiels.
    explanation: |
      Die Meldung ist eine sehr günstige Form der Folge: Sie braucht keinen neuen Zweig und keine neue Szene, trotzdem spürt der Spieler sofort, dass seine Antwort registriert wurde. Weil sie offenlässt, was Clementine sich merkt, erzeugt sie Erwartung. Byrd beschreibt bei Den of Geek genau diese Unklarheit („What will she remember?“) als Grund, warum die Meldung so bekannt wurde. Zugleich ist sie ein Versprechen. Byrd argumentiert, dass die großen Folgen weitgehend feststehen, und nennt die Meldung deshalb im Rückblick eine Täuschung. Für den Entwurf heißt das: Eine Bestätigung wirkt, solange spätere Rückbezüge sie einlösen.
    resources:
      - title: Encyclopedia of Science Fiction, „The Walking Dead“
        url: https://sf-encyclopedia.com/entry/walking_dead_the_game
      - title: Byrd, „The False Promises of Telltale’s Masterpiece“ (Den of Geek)
        url: https://www.denofgeek.com/games/the-walking-dead-false-promises-telltale/
  - id: muster-in-einem-spiel
    type: practice
    title: Welches Muster steckt darin?
    prompt: |
      Wähle ein Spiel mit Entscheidungen, das du gut kennst. Skizziere in höchstens fünf Stichpunkten, welches Muster nach Ashwell es nutzt und woran du das erkennst. Die Vorlage gibt dir die Stichpunkte vor.
    lang: prose
    starter: |
      Spiel:
      Muster:
      Woran ich es erkenne:
      Wo Wege zusammenlaufen:
      Was sich das Spiel merkt:
    checklist:
      - Du nennst eins der acht Muster aus Ashwells Liste oder zwei, wenn das Spiel sie mischt.
      - Das Erkennungszeichen nennt eine Stelle im Spiel, die du benennen kannst (Kapitel, Ort oder Szene).
      - Du nennst mindestens einen Punkt, an dem Wege zusammenlaufen, oder hältst fest, dass es keinen gibt.
      - Du nennst mindestens eine Wahl, die das Spiel sich merkt, und wo sie später sichtbar wird.
    explanation: |
      Muster erkennst du an zwei Stellen: dort, wo Wege zusammenlaufen, und dort, wo das Spiel eine frühere Wahl wieder aufgreift. Mischformen sind normal; Ashwell betont selbst, dass seine Muster keine sauberen Kategorien sind. Wenn du ein Muster benennen kannst, siehst du auch seine Kosten, etwa die vielen Routen eines Sorting Hat oder die Variablen eines Branch and Bottleneck.
    resources:
      - title: Ashwell, „Standard Patterns in Choice-Based Games“
        url: https://heterogenoustasks.wordpress.com/2015/01/26/standard-patterns-in-choice-based-games/
  - id: rueckbezug-im-spiel
    type: practice
    title: Wann hast du die Folge gesehen?
    prompt: |
      Wähle eine Entscheidung aus einem Spiel deiner Wahl, deren Folge du später gesehen hast. Notiere in Stichpunkten, wo, wann und wie das Spiel dir die Folge gezeigt hat.
    lang: prose
    starter: |
      Spiel und Entscheidung:
      Wo die Folge sichtbar wurde:
      Abstand zur Wahl:
      Detail, das an die Wahl erinnert:
      Erinnerung kurz vor der Folge:
    checklist:
      - Du nennst den Ort oder die Szene, in der die Folge sichtbar wird.
      - Du gibst den Abstand zur Wahl in Szenen, Kapiteln oder Spielzeit an, auch geschätzt.
      - Du nennst ein Detail, das die Folge mit der Wahl verbindet, oder hältst fest, dass es keins gibt.
      - Du notierst, ob das Spiel dich vor der Folge an die Wahl erinnert hat.
    explanation: |
      Die drei Regeln aus der Lektion lassen sich an jedem Spiel prüfen: Wo zeigt es die Folge, verbindet ein Detail sie mit der Wahl, und hilft eine Erinnerung über großen Abstand? Wenn du eine Folge erst beim Nachlesen in einer Komplettlösung erkannt hast, fehlt meist einer dieser Punkte. Notiere das; es ist ein Befund, kein Fehler deiner Analyse.
    resources:
      - title: Short, „Beyond Branching“ (Abschnitt zu Firewatch und Rückbezügen)
        url: https://emshort.blog/2016/04/12/beyond-branching-quality-based-and-salience-based-narrative-structures/
