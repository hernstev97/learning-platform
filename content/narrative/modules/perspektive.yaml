id: perspektive
title: "Perspektive: Wer sieht, wer spricht, wer weiß was"
level: 1
minutes: 80
summary: Perspektive legt fest, was der Leser erfährt und was nicht. Du trennst Wahrnehmung und Erzählstimme, bestimmst Fokalisierung und Erzählsituation an gemeinfreien Texten und erkennst Perspektivbrüche.
place: unterwegs
goals:
  - Du trennst die Fragen „Wer nimmt wahr?“ (Fokalisierung) und „Wer spricht?“ (Erzählstimme) und beantwortest sie für einen Textausschnitt.
  - Du bestimmst Null-, interne und externe Fokalisierung nach Genette und ordnest Stanzels auktoriale, personale und Ich-Erzählsituation grob zu.
  - Du beschreibst an Goethes „Erlkönig“, welche Figur was wahrnimmt und was der Leser am Ende weiß.
  - Du erklärst, wie Kamera, Textboxen und innere Stimmen im Spiel die Perspektive verschieben.
  - Du findest Kopfspringen, unmögliches Wissen der Fokalfigur und erklärte Gefühle in einem Text.
resources:
  - title: Burkhard Niederhoff, „Focalization“ (Living Handbook of Narratology)
    url: https://www-archiv.fdm.uni-hamburg.de/lhn/node/18.html
  - title: Wolf Schmid, „Erzählperspektive“ (ICN Hamburg, PDF)
    url: https://www-archiv.fdm.uni-hamburg.de/icn/sites/default/files/download/publications/w_schmid_erzaehlperspektive.pdf
  - title: Johann Wolfgang von Goethe, „Erlkönig“ (Wikisource)
    url: https://de.wikisource.org/wiki/Erlk%C3%B6nig
  - title: Franz Kafka, „Die Verwandlung“ (Wikisource, Erstdruck 1915)
    url: https://de.wikisource.org/wiki/Die_Verwandlung_%28Franz_Kafka%29
  - title: Arthur Schnitzler, „Lieutenant Gustl“ (Wikisource, Ausgabe 1906)
    url: https://de.wikisource.org/wiki/Lieutenant_Gustl
lesson: |
  Ein Vater reitet mit seinem Sohn durch die Nacht. Der Sohn sieht eine Gestalt mit Krone und Schweif, der Vater sieht einen Nebelstreif. Beide sind zur selben Zeit am selben Ort und nehmen Verschiedenes wahr. Goethes „Erlkönig“ baut aus diesem Unterschied seine Spannung, und am Ende weißt du als Leser so wenig wie vorher, wer recht hatte.

  Perspektive entscheidet, was der Leser erfährt, wann er es erfährt und durch wessen Augen. Sie gehört zu den ersten Entscheidungen beim Schreiben, nicht zum Feinschliff. Wer sie nicht bewusst trifft, springt zwischen Köpfen und verrät Dinge, die die Szene zurückhalten wollte. Im Spiel kommt eine zweite Ebene dazu, denn die Kamera zeigt oft mehr, als die Figur sieht.

  ## Zwei Fragen: wer nimmt wahr, wer spricht

  Ältere Begriffe wie „Perspektive“ oder „point of view“ vermischen zwei Fragen. Der Erzählforscher Gérard Genette hat sie 1972 in „Discours du récit“ getrennt, als Frage „Wer sieht?“ und Frage „Wer spricht?“. Für die erste führte er den Begriff Fokalisierung ein, die zweite betrifft die Stimme des Erzählers ([Living Handbook of Narratology, „Focalization“](https://www-archiv.fdm.uni-hamburg.de/lhn/node/18.html)).

  Die Trennung zeigt sich an einem Ich-Erzähler, der als Erwachsener von seiner Kindheit erzählt. Die Stimme gehört dem Erwachsenen, er wählt die Wörter. Wahrgenommen wird aber oft, was das Kind damals sah und wusste. Beide Fragen haben dann verschiedene Antworten. Die Figur, durch deren Wahrnehmung eine Szene läuft, heißt Fokalfigur.

  Für das eigene Schreiben folgt daraus eine doppelte Entscheidung. Du legst fest, durch wessen Wahrnehmung die Szene läuft. Unabhängig davon legst du fest, wer sie formuliert, mit welchem Wortschatz und mit wie viel Abstand. Was einen Erzähler ausmacht, beschreibt der Artikel „Narrator“ im [Living Handbook of Narratology](https://www-archiv.fdm.uni-hamburg.de/lhn/node/44.html).

  > [!MERKE]
  > Fokalisierung beantwortet „Wer nimmt wahr, wer weiß was?“. Die Erzählstimme beantwortet „Wer spricht?“. Prüf beide Fragen getrennt.

  ## Fokalisierung nach Genette: null, intern, extern

  Genette misst Fokalisierung daran, wie viel der Erzähler im Vergleich zu einer Figur sagt. Die deutschen Bezeichnungen folgen Wolf Schmid ([„Erzählperspektive“, PDF](https://www-archiv.fdm.uni-hamburg.de/icn/sites/default/files/download/publications/w_schmid_erzaehlperspektive.pdf)).

  - **null** (Erzähler > Figur): Der Erzähler sagt mehr, als irgendeine Figur weiß.
  - **intern** (Erzähler = Figur): Er sagt nur, was eine Figur weiß.
  - **extern** (Erzähler < Figur): Er sagt weniger, als die Figur weiß.

  **Nullfokalisierung** heißt, der Erzähler überblickt alles. Kleists „Erdbeben in Chili“ beginnt so:

  > In St. Jago, der Hauptstadt des Königreichs Chili, stand gerade in dem Augenblicke der großen Erderschütterung vom Jahre 1647, bei welcher viele tausend Menschen ihren Untergang fanden, ein junger, auf ein Verbrechen angeklagter Spanier, namens Jeronimo Rugera, an einem Pfeiler des Gefängnisses, in welches man ihn eingesperrt hatte, und wollte sich erhenken.

  Heinrich von Kleist, „Das Erdbeben in Chili“ (Erstdruck 1807 als „Jeronimo und Josephe“, Buchfassung 1810), in moderner Schreibung nach [Projekt Gutenberg-DE](https://projekt-gutenberg.org/authors/heinrich-von-kleist/books/heinrich-v-kleist-das-erdbeben-in-chili/chapter/1)

  Der Satz weiß, was keine Figur in diesem Augenblick wissen kann: das Jahr, die Zahl der Toten, die Anklage und den Plan des Mannes. Ort, Zeit, Katastrophe und Hauptfigur stehen in einem einzigen Satzgefüge. Danach springt der Erzähler ein Jahr zurück und bewertet sogar den Bruder, durch dessen „hämische Aufmerksamkeit“ der Vater von einem heimlichen Treffen erfuhr.

  **Interne Fokalisierung** bindet die Erzählung an eine Figur. Kafkas „Verwandlung“ erzählt in der dritten Person und bleibt trotzdem bei Gregor:

  > Als Gregor Samsa eines Morgens aus unruhigen Träumen erwachte, fand er sich in seinem Bett zu einem ungeheueren Ungeziefer verwandelt. Er lag auf seinem panzerartig harten Rücken und sah, wenn er den Kopf ein wenig hob, seinen gewölbten, braunen, von bogenförmigen Versteifungen geteilten Bauch, auf dessen Höhe sich die Bettdecke, zum gänzlichen Niedergleiten bereit, kaum noch erhalten konnte.

  Franz Kafka, „Die Verwandlung“ (Erstdruck 1915 in „Die Weißen Blätter“), [Wikisource](https://de.wikisource.org/wiki/Die_Verwandlung_%28Franz_Kafka%29)

  Der Erzähler sieht nur, was Gregor sieht, und von dort, wo Gregor liegt: den Bauch nur, „wenn er den Kopf ein wenig hob“. Das Unerhörte steht im ersten Satz als nüchterne Tatsache. Im ersten Absatz wundert sich weder der Erzähler noch Gregor, und diese Ruhe macht den Anfang unheimlich.

  **Externe Fokalisierung** zeigt Figuren nur von außen. Die erste Strophe des „Erlkönigs“ ist so gebaut. Ein Beobachter fragt, wer da reitet, und antwortet mit dem, was man sieht:

  > Wer reitet so spät durch Nacht und Wind?\
  > Es ist der Vater mit seinem Kind;\
  > Er hat den Knaben wohl in dem Arm,\
  > Er faßt ihn sicher, er hält ihn warm.

  Johann Wolfgang von Goethe, „Erlkönig“ (1782), [Wikisource](https://de.wikisource.org/wiki/Erlk%C3%B6nig)

  Was Vater und Kind denken, sagt die Strophe nicht. In der letzten Strophe ändert sich das, denn „Dem Vater grauset’s“ blickt in den Vater hinein. Die Fokalisierung kann also innerhalb eines Textes wechseln. Genettes Begriffe beschreiben deshalb oft Abschnitte, nicht ganze Werke.

  > [!TIP] Die Prüffrage für jeden Satz
  > Frag bei einem Satz: Kann die Fokalfigur das in diesem Moment wahrnehmen oder wissen? Wenn nicht, sagt der Satz mehr, als die interne Fokalisierung erlaubt.

  ## Stanzels Erzählsituationen und wie sie zu Genette passen

  Bekannter sind im Deutschen oft die Begriffe des Grazer Anglisten Franz K. Stanzel. Wolf Schmid schreibt, dass seine Trias bis heute große Popularität genießt. Stanzel unterscheidet drei Erzählsituationen:

  - **Auktorial:** Ein Erzähler steht außerhalb der Geschichte, überblickt sie und kommentiert. Die Außenperspektive dominiert.
  - **Personal:** Der Erzähler tritt zurück. Du erlebst das Geschehen durch das Bewusstsein einer Figur, die Stanzel Reflektor nennt.
  - **Ich-Erzählsituation:** Der Erzähler gehört selbst zur erzählten Welt.

  Grob zugeordnet:

  - **auktorial** entspricht meist der Nullfokalisierung, Beispiel Kleist.
  - **personal** entspricht meist der internen Fokalisierung, Beispiel Kafka.
  - **Ich-Erzählsituation** betrifft bei Genette die Stimme, nicht die Fokalisierung; Schnitzlers „Gustl“ ist ein Grenzfall.

  Die Zuordnung ist grob. Stanzel bündelt in einem Begriff mehrere Merkmale, nämlich wer erzählt, von wo aus und ob ein Erzähler oder ein Reflektor im Vordergrund steht. Genette trennt diese Merkmale. Deshalb hat die Ich-Erzählsituation bei Genette keinen festen Partner. Ein Ich kann als Erwachsener mit Überblick erzählen oder ganz im Moment bleiben.

  > [!DEEP] Beide Modelle haben Lücken
  > Wolf Schmid kritisiert beide Typologien. Bei Stanzel stecken drei Gegensatzpaare in einem Begriff (Person, Perspektive, Modus). Bei Genette vermischen sich Wissen, Introspektion und Perspektive des Erzählers in der Dreiteilung ([PDF](https://www-archiv.fdm.uni-hamburg.de/icn/sites/default/files/download/publications/w_schmid_erzaehlperspektive.pdf)). Für das Schreiben genügt es, die zwei Grundfragen getrennt zu halten.

  ## Innerer Monolog: alles durch einen Kopf

  Schnitzlers „Leutnant Gustl“ (1900) treibt die interne Fokalisierung bis zum Ende. So beginnt der Text:

  > Wie lange wird denn das noch dauern? Ich muß auf die Uhr schauen … schickt sich wahrscheinlich nicht in einem so ernsten Konzert. Aber wer sieht’s denn? Wenn’s einer sieht, so paßt er gerade so wenig auf, wie ich, und vor dem brauch’ ich mich nicht zu genieren … Erst viertel auf zehn? … Mir kommt vor, ich sitz’ schon drei Stunden in dem Konzert.

  Arthur Schnitzler, „Lieutenant Gustl“ (so der Titel der zitierten Ausgabe, S. Fischer 1906), [Wikisource](https://de.wikisource.org/wiki/Lieutenant_Gustl)

  Hier erzählt niemand. Der Text ist das, was Gustl im Konzert denkt, Satz für Satz, im Präsens. Kein Erzähler erklärt, wer die Leute sind, an die Gustl denkt, oder warum er unruhig ist. Du setzt die Lage aus Bruchstücken zusammen, und am Ende dieses ersten Absatzes fällt ein Gedanke über „übermorgen“, der alles Vorherige in ein anderes Licht rückt.

  Der Leser weiß nur, woran Gustl gerade denkt. Was er verdrängt oder für selbstverständlich hält, fehlt. Daraus entsteht eine Wirkung, die ein Erzähler mit Überblick nicht hätte. Du erkennst an Gustl Dinge, die er selbst nicht sieht.

  ## Wissensstände im „Erlkönig“

  Ab der zweiten Strophe verschwindet der Erzähler des „Erlkönigs“:

  > Mein Sohn, was birgst du so bang dein Gesicht? —\
  > Siehst, Vater, du den Erlkönig nicht?\
  > Den Erlenkönig mit Kron’ und Schweif? —\
  > Mein Sohn, es ist ein Nebelstreif. —

  Johann Wolfgang von Goethe, „Erlkönig“ (1782), [Wikisource](https://de.wikisource.org/wiki/Erlk%C3%B6nig)

  Vater und Sohn sprechen ohne Redebegleitsatz. Nur die Anreden und die Gedankenstriche am Versende zeigen den Wechsel. Der Erlkönig spricht in Anführungszeichen, und nur der Sohn reagiert auf ihn. Der Vater erklärt jede Erscheinung mit der Natur, als Nebelstreif, als Wind in dürren Blättern, als alte Weiden.

  Dadurch entstehen verschiedene Wissensstände. Der Sohn sieht und hört den Erlkönig. Der Vater sieht Nebel und Weiden und hört den Wind. Der Leser hört die Verse des Erlkönigs so unmittelbar wie der Sohn, also mehr als der Vater.

  Ob die Stimme von außen kommt oder aus der Angst des Kindes, entscheidet das Gedicht nicht. Die letzte Zeile sagt, dass das Kind tot ist, aber nicht, warum.

  ## Perspektive im Spiel: Kamera, Textbox, innere Stimme

  Im Spiel nimmt der Spieler selbst wahr, über die Kamera. Eine Draufsicht zeigt oft mehr, als die Figur sehen könnte, etwa den Raum hinter einer Wand. Der Spieler weiß dann mehr als seine Figur. Das kann gewollt sein, wenn der Spieler eine Gefahr kommen sehen soll. Es wirkt seltsam, wenn eine Textbox die Figur ausführlich staunen lässt, obwohl der Spieler alles längst gesehen hat.

  Textboxen beantworten die Frage, wer spricht, meist mit einem Namen oder einem Porträt. Fehlt beides, muss der Spieler die Stimme erschließen, wie im „Erlkönig“ ab der zweiten Strophe. Eine Textbox ohne Sprecher kann auch eine Erzählstimme sein, die über der Szene steht.

  *Disco Elysium* (ZA/UM, 2019) spaltet die Innenperspektive auf. Die 24 Fähigkeiten der Hauptfigur stehen für verschiedene Seiten ihrer Persönlichkeit, und jede kann direkt zum Spieler sprechen und seine Entscheidungen beeinflussen ([Wikipedia](https://en.wikipedia.org/wiki/Disco_Elysium)). Die innere Stimme wird so zu einer Figur im Dialog. Wer spricht, ist ein Teil des Kopfes, durch den du die Welt wahrnimmst.

  Wie Spielerwissen und Figurenwissen eine Entscheidung verständlich machen, behandelt das Modul [Spielerwissen, Figurenwissen und verständliche Entscheidungen](/narrative/spielerwissen).

  ## Häufige Fehler

  **Kopfspringen.** Eine intern fokalisierte Szene weiß plötzlich, was eine andere Figur denkt. Das ist ein Perspektivbruch, im Englischen head-hopping. Ein Lehrbeispiel:

  > Mara steht am Gleis und zählt die Wagen. Ihr Koffer drückt gegen ihr Knie. Der Schaffner findet sie unhöflich, weil sie nicht grüßt.

  Die ersten zwei Sätze nehmen wahr, was Mara wahrnimmt. Der dritte steckt im Kopf des Schaffners, und der Leser weiß einen Moment nicht, wessen Szene er liest. Markier für jede Szene die Fokalfigur und prüf jeden Satz mit innerem Inhalt darauf, ob er ihr gehört. Was andere denken, zeigst du über das, was die Fokalfigur sieht und hört.

  Die Regel hat eine Grenze. Ein Erzähler mit Nullfokalisierung darf in viele Köpfe sehen, Kleist tut es im ersten Absatz mehrmals. Der Bruch entsteht erst, wenn der Text eine Perspektive aufgebaut hat und sie ohne Absicht verlässt.

  **Unmögliches Wissen.** Die Fokalfigur kennt den Namen eines Fremden, weiß, was hinter einer geschlossenen Tür geschieht, oder kennt ein Ereignis, bei dem sie nicht war. Frag bei jeder Information, woher die Figur sie hat. Gibt es in der Szene keine Quelle, gib ihr eine oder streich die Information.

  **Erklärte Gefühle.** Die Szene zeigt ein Gefühl über Handlung und Details, und der Erzähler sagt es danach noch einmal („Sie war gekränkt“). Streich den erklärenden Satz und prüf, ob die Szene ohne ihn verständlich bleibt. Die Grenze: Wo die Szene ein Gefühl nicht zeigt, darf der Erzähler es nennen. Der Fehler ist das doppelte Sagen.

  > [!PRAXIS] Figurenwissen über Wege hinweg
  > Jon Ingold von inkle beschrieb 2017 auf der GDC in „Narrative Sorcery: Coherent Storytelling in an Open World“, wie das Studio für *Sorcery!* mit „defensive logic“ schreibt. Die Geschichte wird in beliebiger Reihenfolge erlebt und soll trotzdem stimmig bleiben ([GDC Vault](https://gdcvault.com/play/1023989/Narrative-Sorcery-Coherent-Storytelling-in)). Übertragen auf die Perspektive heißt das: Eine Zeile darf nur voraussetzen, was die Spielerfigur an dieser Stelle sicher erlebt hat. In verzweigten Texten prüfst du Figurenwissen deshalb für jeden Weg einzeln.

  ## Zusammenfassung

  - Perspektive besteht aus zwei Fragen: Wer nimmt wahr (Fokalisierung), und wer spricht (Erzählstimme)?
  - Genette unterscheidet Null-, interne und externe Fokalisierung danach, ob der Erzähler mehr, gleich viel oder weniger sagt, als eine Figur weiß.
  - Stanzels auktoriale, personale und Ich-Erzählsituation lassen sich grob zuordnen, bündeln aber mehrere Merkmale in einem Begriff.
  - Im inneren Monolog wie in „Leutnant Gustl“ gibt es keinen Erzähler; der Leser setzt die Lage aus Gedanken zusammen.
  - Im „Erlkönig“ wissen Sohn, Vater und Leser Verschiedenes, und das Gedicht entscheidet nicht, wer recht hat.
  - Im Spiel zeigt die Kamera oft mehr, als die Figur weiß; Textboxen und innere Stimmen legen fest, wer spricht.
  - Ein Perspektivbruch entsteht, wenn eine intern fokalisierte Szene ohne Absicht in einen anderen Kopf springt.
exercises:
  - id: kleist-fokalisierung
    type: choice
    title: Wer weiß das alles?
    prompt: |
      Diese Sätze folgen bei Kleist direkt auf den ersten Satz. Welche Fokalisierung liegt vor?
    lang: prose
    code: |
      Don Henrico Asteron, einer der reichsten Edelleute der Stadt, hatte ihn ungefähr ein Jahr zuvor aus seinem Hause, wo er als Lehrer angestellt war, entfernt, weil er sich mit Donna Josephe, seiner einzigen Tochter, in einem zärtlichen Einverständnis befunden hatte.
      Eine geheime Bestellung, die dem alten Don, nachdem er die Tochter nachdrücklich gewarnt hatte, durch die hämische Aufmerksamkeit seines stolzen Sohnes verraten worden war, entrüstete ihn dergestalt, daß er sie in dem Karmeliterkloster unsrer lieben Frauen vom Berge daselbst unterbrachte.
    options:
      - text: Nullfokalisierung
        correct: true
        why: Der Erzähler kennt Vorgeschichte, Gründe und Gefühle mehrerer Figuren und urteilt über den Sohn. So viel weiß keine einzelne Figur.
      - text: Interne Fokalisierung bei Jeronimo
        correct: false
        why: Die Sätze bleiben nicht bei Jeronimos Wahrnehmung. Sie erklären, was zwischen Vater, Sohn und Tochter geschah, und wie der Vater sich fühlte.
      - text: Interne Fokalisierung beim alten Don
        correct: false
        why: Der Don wird von außen eingeordnet („einer der reichsten Edelleute der Stadt“), und der Erzähler springt danach zu anderen Figuren.
      - text: Externe Fokalisierung
        correct: false
        why: Ein externer Erzähler sagt weniger, als die Figuren wissen, und zeigt kein Inneres. Hier steht, was den Vater „entrüstete“.
    hints:
      - Zähl, von wie vielen Figuren der Ausschnitt Gründe, Gefühle oder Absichten kennt.
    explanation: |
      Kleists Erzähler hat Überblick über Zeit und Figuren. Er springt ein Jahr zurück, kennt die Gefühle des Vaters und nennt die Aufmerksamkeit des Sohnes hämisch. Das ist Nullfokalisierung, bei Stanzel auktorial. Der Leser bekommt in zwei Sätzen eine Vorgeschichte, für die eine intern fokalisierte Erzählung Szenen bräuchte.
    resources:
      - title: Heinrich von Kleist, „Das Erdbeben in Chili“ (Projekt Gutenberg-DE)
        url: https://projekt-gutenberg.org/authors/heinrich-von-kleist/books/heinrich-v-kleist-das-erdbeben-in-chili/chapter/1

  - id: kamera-weiss-mehr
    type: choice
    title: Hinter dem Kiosk
    prompt: |
      Ein Spiel mit Draufsicht (Lehrbeispiel). Die Spielerfigur läuft durch eine Bahnhofshalle. Hinter einem Kiosk, für die Figur verdeckt, auf dem Bildschirm aber sichtbar, steht ein Mann mit ihrem verlorenen Koffer. Welche Aussage stimmt?
    options:
      - text: Der Spieler weiß, dass der Mann dort steht, die Figur weiß es nicht.
        correct: true
        why: Die Kamera zeigt den Raum hinter dem Kiosk. Die Figur hat keinen Blick dorthin. Spieler und Figur haben verschiedene Wissensstände.
      - text: Was auf dem Bildschirm zu sehen ist, weiß auch die Figur.
        correct: false
        why: Die Kamera ist nicht das Auge der Figur. Eine Draufsicht zeigt oft mehr, als die Figur aus ihrer Position sehen kann.
      - text: Die Figur darf später nicht überrascht reagieren, weil der Spieler den Mann schon gesehen hat.
        correct: false
        why: Die Figur reagiert nach ihrem eigenen Wissen. Ihre Überraschung ist folgerichtig; du musst nur entscheiden, ob der Abstand zum Spielerwissen gewollt ist.
      - text: Eine Draufsicht ist neutral und hat keine Perspektive.
        correct: false
        why: Auch die Kamera wählt aus, was sichtbar ist. Damit legt sie fest, was der Spieler weiß.
    hints:
      - Trenne, was die Kamera zeigt, von dem, was die Figur von ihrem Standort aus sieht.
    explanation: |
      Im Spiel gibt es zwei Wahrnehmende, die Figur und den Spieler. Die Kamera bestimmt, was der Spieler sieht, und das ist oft mehr als das, was die Figur sehen kann. Daraus kann Spannung entstehen, weil der Spieler etwas kommen sieht. Es kann auch stören, wenn Texte der Figur so tun, als wüsste der Spieler nichts. Wie man Wissensstände für Entscheidungen plant, behandelt [Spielerwissen](/narrative/spielerwissen).

  - id: erlkoenig-deutungen
    type: order
    title: Was der Vater sieht
    prompt: |
      Bring die Verse in die Reihenfolge, in der sie im „Erlkönig“ stehen. Achte darauf, wie sich die Haltung des Vaters verändert.
    lang: prose
    lines: |
      Mein Sohn, es ist ein Nebelstreif. —
      In dürren Blättern säuselt der Wind. —
      Es scheinen die alten Weiden so grau. —
      Mein Vater, mein Vater, jetzt faßt er mich an!
      Dem Vater grauset’s; er reitet geschwind,
    hints:
      - Jede Antwort des Vaters folgt auf eine Frage des Sohnes und erklärt etwas aus der Natur.
      - Die Zeile, in der ein Erzähler über den Vater spricht, gehört zur letzten Strophe.
    explanation: |
      Der Vater erklärt jede Wahrnehmung des Sohnes mit der Natur, erst mit dem Nebel, dann mit dem Wind, dann mit den Weiden. Die Erklärungen kommen jeweils nach einer Frage des Sohnes. Nach dem Schrei des Sohnes kippt die Perspektive, und „Dem Vater grauset’s“ zeigt zum ersten Mal sein Inneres. Ob er nun auch etwas wahrnimmt oder nur die Angst des Kindes spürt, sagt das Gedicht nicht.
    resources:
      - title: Johann Wolfgang von Goethe, „Erlkönig“ (Wikisource)
        url: https://de.wikisource.org/wiki/Erlk%C3%B6nig

  - id: genette-begriffe
    type: gap
    title: Wer sieht, wer spricht, wie viel
    prompt: |
      Ergänze die Begriffe nach Genette.
    lang: prose
    code: |
      Die Frage, wer wahrnimmt, beantwortet die ⟦Fokalisierung⟧; die Frage, wer spricht, die ⟦Erzählstimme⟧.
      Sagt der Erzähler mehr, als irgendeine Figur weiß, heißt das ⟦Nullfokalisierung⟧.
      Sagt er nur, was eine Figur weiß, ist die Fokalisierung ⟦intern⟧.
      Sagt er weniger, als die Figur weiß, ist sie ⟦extern⟧.
    gaps:
      - label: Wahrnehmung
        hint: Genettes Ersatz für „Perspektive“, beginnt mit F.
        accept: [Fokalisation, Focalisation, Focalization]
      - label: Sprechen
        hint: Im Englischen voice, hier mit „Erzähl-“ davor.
        accept: [Stimme, Erzählerstimme, Erzählinstanz, Voice]
      - label: Erzähler > Figur
        hint: Genette nennt sie focalisation zéro.
        accept: [Null-Fokalisierung, Nullfokalisation, Zero]
      - label: Erzähler = Figur
        hint: Die Erzählung bleibt in einer Figur.
        accept: [interne]
      - label: Erzähler < Figur
        hint: Die Figur wird nur von außen gezeigt.
        accept: [externe]
    explanation: |
      Genette trennt die Frage nach der Wahrnehmung (Fokalisierung) von der Frage nach der Stimme. Die drei Typen der Fokalisierung messen, wie viel der Erzähler im Vergleich zu einer Figur sagt: mehr (null), gleich viel (intern) oder weniger (extern). Die Formeln mit >, = und < helfen, die Typen auseinanderzuhalten.
    resources:
      - title: Living Handbook of Narratology, „Focalization“
        url: https://www-archiv.fdm.uni-hamburg.de/lhn/node/18.html

  - id: stanzel-begriffe
    type: gap
    title: Die Schulbegriffe
    prompt: |
      Ergänze Stanzels Begriffe.
    lang: prose
    code: |
      Ein Erzähler steht über der Geschichte, überblickt und kommentiert sie. Das ist die ⟦auktoriale⟧ Erzählsituation.
      Der Erzähler tritt zurück, du siehst durch das Bewusstsein einer Figur. Das ist die ⟦personale⟧ Erzählsituation.
      Der Erzähler gehört selbst zur erzählten Welt. Das ist die ⟦Ich⟧-Erzählsituation.
      Die Figur, durch deren Bewusstsein du siehst, nennt Stanzel ⟦Reflektor⟧.
    gaps:
      - label: Überblick
        hint: Von lateinisch auctor, Urheber.
        accept: [auktorial]
      - label: Durch eine Figur
        hint: Von Person.
        accept: [personal]
      - label: Erzähler in der Welt
        hint: Das Pronomen, mit dem er von sich spricht.
      - label: Bewusstsein
        hint: Er spiegelt das Geschehen, statt es zu erzählen.
        accept: [Reflektorfigur]
    explanation: |
      Stanzels drei Erzählsituationen sind im Deutschen verbreitet. Auktorial entspricht grob Genettes Nullfokalisierung, personal grob der internen Fokalisierung. Die Ich-Erzählsituation betrifft vor allem die Stimme: Der Erzähler gehört zur erzählten Welt, und was er wahrnimmt, kann er im Rückblick oder im Moment erzählen.
    resources:
      - title: Wolf Schmid, „Erzählperspektive“ (PDF)
        url: https://www-archiv.fdm.uni-hamburg.de/icn/sites/default/files/download/publications/w_schmid_erzaehlperspektive.pdf

  - id: ort-zwei-sichten
    type: practice
    title: Neu hier, jeden Tag hier
    prompt: |
      Wähle einen Ort, den du gut kennst. Schreib zwei Sätze aus der Sicht von jemandem, der zum ersten Mal dort ist. Dann zwei Sätze über denselben Ort aus der Sicht von jemandem, der jeden Tag dort ist.
    lang: prose
    starter: |
      Ort:
      Zum ersten Mal dort:
      Jeden Tag dort:
    checklist:
      - Beide Fassungen beschreiben denselben Ort und haben je zwei Sätze.
      - Die erste Fassung nennt mindestens ein Detail, das in der zweiten fehlt.
      - Die zweite Fassung enthält mindestens eine Sache, die nur jemand mit Ortskenntnis wissen kann.
      - Jede Fassung bleibt bei einer Person; kein Satz gibt Gedanken einer anderen Person wieder.
      - Kein Satz nennt das Gefühl der Person beim Namen.
    explanation: |
      Wer neu ist, bemerkt, was auffällt. Wer jeden Tag da ist, bemerkt Abweichungen und weiß Dinge, die man nicht sieht. Dieselbe Umgebung ergibt so zwei verschiedene Texte, ohne dass du ein Gefühl nennen musst. Die Wahl der Fokalfigur bestimmt, welche Details überhaupt in die Szene kommen.

  - id: verwandlung-eingefuegt
    type: bug
    title: Wer schaut da mit?
    prompt: |
      In diesen Ausschnitt ist eine Zeile eingefügt, die nicht von Kafka stammt. Sie bricht die interne Fokalisierung. Finde sie. Die Zeilenumbrüche sind für das Handy gesetzt; im Original ist es ein durchgehender Absatz.
    lang: prose
    code: |
      Als Gregor Samsa eines Morgens aus unruhigen Träumen erwachte,
      fand er sich in seinem Bett zu einem ungeheueren Ungeziefer verwandelt.
      Er lag auf seinem panzerartig harten Rücken und sah,
      wenn er den Kopf ein wenig hob,
      seinen gewölbten, braunen, von bogenförmigen Versteifungen geteilten Bauch,
      auf dessen Höhe sich die Bettdecke, zum gänzlichen Niedergleiten bereit,
      kaum noch erhalten konnte.
      In der Küche ahnte die Mutter noch nichts davon.
      Seine vielen, im Vergleich zu seinem sonstigen Umfang kläglich dünnen Beine
      flimmerten ihm hilflos vor den Augen.
    lines: [8]
    hints:
      - Prüf jede Zeile mit der Frage, ob Gregor das von seinem Bett aus wahrnehmen kann.
    explanation: |
      Zeile 8 ist eingefügt. Gregor liegt im Bett und kann weder sehen, was in der Küche geschieht, noch wissen, was die Mutter ahnt. Die Zeile springt in einen anderen Raum und in einen anderen Kopf. Alle übrigen Zeilen bleiben bei dem, was Gregor an sich selbst sieht, bis zu den Beinen, die „ihm“ vor den Augen flimmern.
    resources:
      - title: Franz Kafka, „Die Verwandlung“ (Wikisource)
        url: https://de.wikisource.org/wiki/Die_Verwandlung_%28Franz_Kafka%29

  - id: kueche-gefuehl-erklaert
    type: bug
    title: Die saubere Tasse
    prompt: |
      Eine kurze Szene (Lehrbeispiel). Finde die Zeile, die ein Gefühl ausspricht, das die übrigen Zeilen schon zeigen.
    lang: prose
    code: |
      Tom legt den Schlüssel auf den Küchentisch.
      Er schiebt ihn ein Stück zu ihr hin.
      Sie sieht nicht auf und spült weiter dieselbe Tasse.
      Er wartet, die Jacke schon an.
      Sie ist gekränkt und will, dass er das merkt.
      Die Tasse ist längst sauber.
    lines: [5]
    hints:
      - Welche Zeile könnte man streichen, ohne dass der Leser etwas Neues verliert?
    explanation: |
      Zeile 5 erklärt, was die Tasse, das Nicht-Aufsehen und das Warten schon zeigen. Der Satz nimmt dem Leser die Arbeit ab, die Szene zu deuten. Außerdem springt er in ihren Kopf, während die übrigen Zeilen beide Figuren nur von außen zeigen. Ohne Zeile 5 bleibt die Szene verständlich und lässt offen, wie genau sie sich fühlt.

  - id: erlkoenig-wer-sieht
    type: explain
    title: Drei Stimmen in einer Nacht
    prompt: |
      Wer nimmt den Erlkönig wahr, wie deutet der Vater, was weiß der Leser am Ende, und wann zeigt das Gedicht das Innere des Vaters? Antworte in zwei bis vier Sätzen.
    lang: prose
    code: |
      „Du liebes Kind, komm, geh mit mir!
      Gar schöne Spiele spiel’ ich mit dir;
      Manch’ bunte Blumen sind an dem Strand,
      Meine Mutter hat manch gülden Gewand.“ —

      Mein Vater, mein Vater, und hörest du nicht,
      Was Erlenkönig mir leise verspricht? —
      Sei ruhig, bleibe ruhig, mein Kind;
      In dürren Blättern säuselt der Wind. —
      […]
      Dem Vater grauset’s; er reitet geschwind,
      Er hält in Armen das ächzende Kind,
      Erreicht den Hof mit Mühe und Not;
      In seinen Armen das Kind war tot.
    points:
      - Nur der Sohn sagt, dass er den Erlkönig hört und sieht.
      - Der Vater erklärt die Wahrnehmung des Sohnes mit der Natur, hier mit dem Wind in dürren Blättern.
      - Der Leser hört die Verse des Erlkönigs direkt, in Anführungszeichen und ohne Sprecherangabe.
      - Die letzte Strophe sagt, dass das Kind tot ist, aber nicht, ob der Erlkönig da war.
      - Mit „Dem Vater grauset’s“ zeigt das Gedicht zum ersten Mal das Innere des Vaters.
    hints:
      - Achte darauf, wer in welcher Strophe spricht und woran du das erkennst.
      - Lies die letzte Zeile genau. Was sagt sie, und was sagt sie nicht?
    explanation: |
      Den Erlkönig nimmt nur der Sohn wahr; er fragt den Vater, ob er ihn hört. Der Vater beruhigt ihn und erklärt die Stimme mit dem Wind in den Blättern. Der Leser hört die Verse des Erlkönigs ohne Vermittlung, so wie der Sohn sie hört, und weiß damit mehr als der Vater. In der letzten Strophe blickt der Erzähler in den Vater hinein („Dem Vater grauset’s“), aber er erklärt nichts. Das Kind ist tot, und ob der Erlkönig von außen kam oder aus der Angst des Kindes, bleibt offen. Auf dieser Lücke beruht die Wirkung des Schlusses.
    resources:
      - title: Johann Wolfgang von Goethe, „Erlkönig“ (Wikisource)
        url: https://de.wikisource.org/wiki/Erlk%C3%B6nig

  - id: verwandlung-anfang
    type: explain
    title: Ein Bauch, von unten gesehen
    prompt: |
      Woran erkennst du, dass dieser Absatz bei Gregor fokalisiert ist, und was erfährst du nicht? Antworte in zwei bis vier Sätzen.
    lang: prose
    code: |
      Als Gregor Samsa eines Morgens aus unruhigen Träumen erwachte, fand er sich in seinem Bett zu einem ungeheueren Ungeziefer verwandelt.
      Er lag auf seinem panzerartig harten Rücken und sah, wenn er den Kopf ein wenig hob, seinen gewölbten, braunen, von bogenförmigen Versteifungen geteilten Bauch, auf dessen Höhe sich die Bettdecke, zum gänzlichen Niedergleiten bereit, kaum noch erhalten konnte.
      Seine vielen, im Vergleich zu seinem sonstigen Umfang kläglich dünnen Beine flimmerten ihm hilflos vor den Augen.
    points:
      - Der Erzähler spricht in der dritten Person, nimmt aber nur wahr, was Gregor wahrnimmt.
      - Was Gregor sieht, hängt an seiner Lage im Bett („wenn er den Kopf ein wenig hob“).
      - Die Beine flimmern „ihm“ vor den Augen; der Blick ist Gregors Blick.
      - Die Verwandlung steht als Tatsache da, ohne Erklärung und ohne Staunen.
      - Was niemand in Gregors Lage wissen kann, fehlt, etwa wie es zur Verwandlung kam.
    hints:
      - Such Stellen, an denen die Wahrnehmung von Gregors Lage im Bett abhängt.
    explanation: |
      Der Absatz ist in der dritten Person erzählt, bleibt aber an Gregors Wahrnehmung gebunden. Den Bauch sieht er nur, „wenn er den Kopf ein wenig hob“, und die Beine flimmern „ihm“ vor den Augen. Auch das Wort „kläglich“ ist eine Bewertung aus Gregors Blick auf den eigenen Körper. Die Verwandlung selbst steht im ersten Satz als Tatsache, ohne dass Erzähler oder Figur sich wundern. Was Gregor nicht wissen kann, fehlt: wie und warum es geschah, und was die anderen im Haus gerade tun.
    resources:
      - title: Franz Kafka, „Die Verwandlung“ (Wikisource)
        url: https://de.wikisource.org/wiki/Die_Verwandlung_%28Franz_Kafka%29

  - id: gustl-zusammensetzen
    type: explain
    title: Übermorgen
    prompt: |
      In diesem inneren Monolog erklärt niemand die Lage. Was erfährst du trotzdem über Gustls Situation, und wie erfährst du es? Antworte in zwei bis vier Sätzen.
    lang: prose
    code: |
      Hätt’ ich die Karte lieber dem Benedek geschenkt, dem machen solche Sachen Spaß; er spielt ja selber Violine.
      Aber da wär’ der Kopetzky beleidigt gewesen.
      Es war ja sehr lieb von ihm, wenigstens gut gemeint.
      […]
      Seine Schwester singt ja mit unter denen da oben.
      […]
      Übermorgen könnt’ ich eigentlich wieder hineingeh’n, zur „Traviata“.
      Ja, übermorgen bin ich vielleicht schon eine tote Leiche!
      Ah, Unsinn, das glaub’ ich selber nicht!
      Warten S’ nur, Herr Doktor, Ihnen wird’s vergeh’n, solche Bemerkungen zu machen!
      Das Nasenspitzel hau’ ich Ihnen herunter …
    points:
      - Es gibt keinen Erzähler; der Text gibt nur Gustls Gedanken im Moment wieder.
      - Woher die Karte stammt und wer Kopetzky ist, erschließt du aus Nebenbemerkungen.
      - Der Satz über „übermorgen“ und die Drohung an einen Doktor deuten eine Gefahr an, die Gustl nicht erklärt.
      - Gustl schiebt den Gedanken sofort weg und lenkt ihn in eine Drohung um; das bemerkst du, er selbst nicht.
    hints:
      - Achte auf Namen, die ohne Erklärung auftauchen.
      - Was denkt Gustl über übermorgen, und wie reagiert er gleich danach auf seinen eigenen Gedanken?
    explanation: |
      Niemand erzählt hier, du hörst nur, was Gustl im Konzert durch den Kopf geht. Aus Nebenbemerkungen setzt du zusammen, dass die Karte von Kopetzky stammt, dessen Schwester im Chor singt. Der Gedanke, übermorgen „vielleicht schon eine tote Leiche“ zu sein, und die Drohung „Warten S’ nur, Herr Doktor“ deuten auf einen bevorstehenden Kampf, wohl ein Duell, ohne dass Gustl es benennt. Er wischt den Gedanken mit „Ah, Unsinn“ weg und wird sofort aggressiv. Weil kein Erzähler eingreift, siehst du diese Abwehr selbst, und genau daran erkennst du mehr über Gustl, als er über sich weiß.
    resources:
      - title: Arthur Schnitzler, „Lieutenant Gustl“ (Wikisource)
        url: https://de.wikisource.org/wiki/Lieutenant_Gustl

  - id: eigene-szene-wissen
    type: practice
    title: Wer weiß was in deiner Szene?
    prompt: |
      Wähle eine Szene aus deinem eigenen Projekt, die du schon im Kopf oder auf Papier hast. Notiere in Stichpunkten, wer sie wahrnimmt, wer spricht und wer was weiß.
    lang: prose
    starter: |
      Szene:
      Wer nimmt wahr (Fokalfigur):
      Wer spricht (Erzählstimme, Textbox, innere Stimme):
      Was die Fokalfigur nicht wissen kann:
      Was der Spieler mehr oder weniger weiß als die Figur:
    checklist:
      - Du hast eine Fokalfigur benannt oder notiert, warum die Szene keine hat.
      - Die Felder „Wer nimmt wahr“ und „Wer spricht“ sind getrennt ausgefüllt.
      - Du hast mindestens eine Sache notiert, die die Fokalfigur in dieser Szene nicht wissen kann.
      - Du hast notiert, ob die Kamera dem Spieler mehr zeigt, als die Figur sieht.
      - Jedes Feld enthält höchstens einen Stichpunkt.
    explanation: |
      Diese Übung hat keine Musterlösung, weil die Szene dir gehört. Sie trennt die zwei Fragen der Lektion und macht sichtbar, wo Spieler und Figur Verschiedenes wissen. Die Liste dessen, was die Fokalfigur nicht wissen kann, ist später deine Prüfliste gegen Kopfspringen, wenn du die Szene im Modul [Werkstatt: eine Szene schreiben und überarbeiten](/narrative/werkstatt-szene) ausschreibst.
