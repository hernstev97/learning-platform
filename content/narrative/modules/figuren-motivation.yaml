lesson: |
  Du sprichst in einem Spiel mit einer Figur. Sie gibt dir einen Auftrag, bedankt sich und steht danach an derselben Stelle wie vorher. Eine Stunde später weißt du ihren Namen nicht mehr. Eine andere Figur gibt dir einen ähnlichen Auftrag, aber sie will dabei etwas für sich, sie hat einen Grund, es gerade jetzt zu wollen, und etwas steht ihr im Weg. An diese Figur erinnerst du dich, und du willst wissen, wie es mit ihr ausgeht.

  Der Unterschied liegt selten im Aussehen. Er liegt darin, ob die Figur etwas will. Franz Kafka braucht in „Vor dem Gesetz“ einen einzigen Wunsch – ein Mann will in das Gesetz eingelassen werden –, und dieser Wunsch trägt den Text bis zum letzten Satz. Dieses Modul zeigt dir, wie du eine Figur über Ziel, Motiv und Widerstand beschreibst und prüfst, ob sie eine Geschichte tragen kann.

  > [!NOTE] So ist dieser Kurs gebaut
  > - **Unterwegs oder am PC.** Module mit der Marke „Unterwegs“ gehen auf dem Handy: lesen, analysieren, kurze Schreibaufgaben. „Am PC“ heißt längeres Schreiben oder ein Werkzeug; plan dafür Zeit am Rechner ein.
  > - **Offline.** Reißt unterwegs die Verbindung ab, behält die Plattform deine Eingaben und überträgt sie, sobald du wieder Netz hast; schließ die Seite bis dahin nicht. Startest du die App ohne Netz („Offline weiterlesen“), kannst du lesen und üben, aber Antworten und Texte gelten nur bis zum Neuladen. Längere Gedanken schreibst du dann in deine Notizen-App.
  > - **Du schreibst selbst.** Es gibt keine Mustertexte; Checklisten helfen dir, deinen Text zu prüfen. KI nutzt du hier höchstens für Struktur, Checklisten und, wenn du willst, Rechtschreibung und Grammatik.
  > - **Du wählst die Beispiele.** Werke für Analysen suchst du dir selbst aus; die Lektionen machen Vorschläge.

  ## Ziel, Motiv, Widerstand: das Gerüst einer Figur

  Die Autorin Debra Dixon hat dafür ein Werkzeug mit drei Begriffen beschrieben, nach dem Titel ihres Buchs kurz GMC: Goal, Motivation and Conflict. Der Verlag nennt diese drei Elemente die Grundlage von allem, was in der erzählten Welt geschieht ([Bell Bridge Books](https://bellebooks.com/categories/p/gmc)). Das Ziel ist, was die Figur erreichen will. Das Motiv ist ihr Grund dafür. Der Widerstand (bei Dixon conflict) ist alles, was sie davon abhalten kann ([Zusammenfassung von Maris Soule](https://marissoule.com/building-a-character-gmc/)).

  **Das Ziel** taugt nur, wenn man von außen sehen kann, ob die Figur es erreicht. Ein Lehrbeispiel: „Sie will ihr Leben in den Griff bekommen“ lässt sich nicht beobachten. „Sie will bis Freitag den Mietvertrag für die Wohnung am Bahnhof unterschreiben“ schon. Am Freitagabend ist der Vertrag unterschrieben oder nicht. Ein beobachtbares Ziel gibt jeder Szene eine Richtung, weil du bei jedem Schritt fragen kannst, ob er die Figur näher heranbringt.

  **Das Motiv** beantwortet, warum die Figur das Ziel will, und vor allem, warum gerade jetzt. Die Wohnung am Bahnhof wird dringend, wenn die alte Wohnung zum Monatsende gekündigt ist. Ohne diesen Anlass könnte die Figur auch nächstes Jahr suchen.

  **Der Widerstand** kommt von außen oder von innen. Außen stehen Personen, Regeln, Dinge und Fristen: ein Vermieter, der lieber an jemand anderen vermietet, ein fehlendes Dokument. Innen steht, was die Figur selbst bremst. Sie bittet ungern um Hilfe, oder sie traut ihrem eigenen Urteil nicht. Oft greifen beide ineinander, etwa wenn der innere Widerstand die Figur daran hindert, den äußeren zu überwinden.

  Für eine Figur, die du prüfen willst, gehst du die Begriffe in einer festen Reihenfolge durch:

  1. Ziel als Ereignis aufschreiben, das man sehen kann.
  2. Prüfen, ob ein Zuschauer am Ende „erreicht“ oder „nicht erreicht“ sagen könnte.
  3. Motiv notieren: Warum will die Figur das gerade jetzt?
  4. Äußeren und inneren Widerstand benennen.
  5. Einsatz festhalten: Was verliert die Figur, wenn sie scheitert?

  > [!MERKE]
  > Das Ziel sagt, was die Figur will, und man kann sehen, ob sie es erreicht. Das Motiv sagt, warum jetzt. Der Widerstand sagt, warum es nicht sofort klappt.

  ## Äußeres Ziel und innerer Bedarf

  Ein verbreitetes Begriffspaar trennt, was eine Figur will (englisch want), von dem, was sie bräuchte (need). Das äußere Ziel verfolgt sie bewusst. Der innere Bedarf ist ihr oft nicht klar, und manchmal steht er dem Ziel im Weg. Die Unterscheidung hilft, wenn eine Figur handelt, aber flach bleibt.

  Kafkas „Vor dem Gesetz“ zeigt, wie weit ein einziges äußeres Ziel trägt. So beginnt der Text:

  > Vor dem Gesetz steht ein Türhüter. Zu diesem Türhüter kommt ein Mann vom Lande und bittet um Eintritt in das Gesetz. Aber der Türhüter sagt, daß er ihm jetzt den Eintritt nicht gewähren könne. Der Mann überlegt und fragt dann, ob er also später werde eintreten dürfen. „Es ist möglich,“ sagt der Türhüter, „jetzt aber nicht.“

  Franz Kafka, „Vor dem Gesetz“ (Erstdruck 1915 in der Wochenschrift „Selbstwehr“), [Wikisource](https://de.wikisource.org/wiki/Vor_dem_Gesetz)

  Das Ziel ist konkret. Der Mann will durch dieses Tor. Der äußere Widerstand ist der Türhüter. Er droht mit weiteren, mächtigeren Türhütern, aber er versperrt nichts mit Gewalt. Das Tor steht offen, und der Türhüter fordert den Mann sogar auf, es trotz des Verbots zu versuchen. Als der Mann sich den Türhüter genauer ansieht, „entschließt er sich doch lieber zu warten, bis er die Erlaubnis zum Eintritt bekommt“. Ab hier arbeitet der innere Widerstand. Er wartet auf eine Erlaubnis, statt zu handeln.

  „Dort sitzt er Tage und Jahre.“ Er bittet, er besticht, am Ende bittet er die Flöhe im Pelzkragen des Türhüters um Hilfe. Das Ziel bleibt ein Leben lang dasselbe, nur die Mittel werden kleiner. Ein ausgeführtes Motiv gibt Kafka ihm nicht. Der Mann denkt nur, das Gesetz solle „doch jedem und immer zugänglich sein“. Das genügt, weil die Geschichte nicht fragt, warum er hinein will, sondern was ihn draußen hält.

  Am Ende sagt der Türhüter, dieser Eingang sei „nur für dich bestimmt“ gewesen. Der Satz verändert rückwirkend, wie du den Widerstand liest. Was wie ein Hindernis von außen aussah, war vielleicht zu großen Teilen das eigene Warten. Der Text sagt das nicht ausdrücklich; den Schluss ziehst du selbst, in einer Übung genauer.

  > [!WARNING] Nicht jede Figur braucht einen inneren Bedarf
  > Want und need sind ein Werkzeug, keine Pflicht. Manche Figuren ändern sich nicht und tragen trotzdem eine Geschichte. Die Braut in Hebels „Unverhofftem Wiedersehen“ (nächster Abschnitt) lernt nichts dazu. Ihre Treue bleibt fünfzig Jahre gleich, und genau darauf baut der Text. Prüf das Begriffspaar an deiner Figur und lass es weg, wenn es nichts erklärt.

  ## Einsatz: was verloren geht

  Ein Ziel wird für den Leser erst wichtig, wenn klar ist, was die Figur verliert, wenn sie scheitert. Im Englischen heißt das stakes, auf Deutsch spricht man vom Einsatz. Ein hoher Einsatz muss nicht groß aussehen. Eine verpasste Verabredung kann schwerer wiegen als ein verlorenes Vermögen, wenn der Text zeigt, warum.

  Johann Peter Hebel zeigt in „Unverhofftes Wiedersehen“, wie ein Einsatz fünfzig Jahre trägt. Ein junger Bergmann in Falun und seine Braut wollen zu Sanct Luciä heiraten. Hebel lässt die Braut den Einsatz gleich am Anfang aussprechen:

  > „Und Friede und Liebe soll darinn wohnen,“ sagte die schöne Braut mit holdem Lächeln, „denn du bist mein Einziges und Alles, und ohne dich möchte ich lieber im Grab seyn, als an einem andern Ort.“

  Johann Peter Hebel, „Unverhoftes Wiedersehen“ (so die Schreibung des Erstdrucks), in: „Schatzkästlein des rheinischen Hausfreundes“, Tübingen 1811, [Wikisource](https://de.wikisource.org/wiki/Seite:Schatzkaestlein_des_rheinischen_Hausfreundes.djvu/300)

  Kurz darauf kommt der Bergmann „nimmer aus dem Bergwerk zurück“. Der Verlust ist eingetreten, bevor das Ziel erreicht war. Hebel erzählt die folgenden fünfzig Jahre Weltgeschichte in wenigen Sätzen. Im Jahr 1809 graben Bergleute den Leichnam aus, unverwest, und eine alte Frau an einer Krücke erkennt ihren Bräutigam. Wer den Satz vom Anfang kennt, versteht ohne weitere Erklärung, was diese fünfzig Jahre für sie waren. Wie Hebel die Zeit dazwischen rafft, ist Thema im Modul [Konflikt und Szenenaufbau](/narrative/szenenaufbau).

  Im Spiel gilt dasselbe mit einer Verschärfung. Der Spieler muss den Einsatz kennen, bevor er entscheidet, nicht erst danach. Wie du das sicherstellst, behandelt das Modul [Spielerwissen](/narrative/spielerwissen).

  ## Charakter zeigt sich in Entscheidungen unter Druck

  Was eine Figur über sich sagt, glaubt der Leser nur halb. Was sie wählt, wenn es etwas kostet, glaubt er. Robert McKee, Autor des Drehbuch-Lehrbuchs „Story“, schreibt auf der Seite zu seinem Buch „Character“ sinngemäß, dass man Figuren in der Tiefe nur über ihre Entscheidungen unter Druck kennenlernt, gleichgültig, was sie sagen oder wie sie auftreten ([mckeestory.com](https://mckeestory.com/books/character/)).

  Druck heißt hier, dass jede Möglichkeit etwas kostet. Die Wahl zwischen einer guten und einer schlechten Option verrät wenig. Die Wahl zwischen zwei Dingen, die der Figur beide wichtig sind, zeigt, was ihr wichtiger ist. Kafkas Mann vom Lande steht am Anfang vor dem Hineingehen gegen das Verbot und dem Warten auf Erlaubnis. Er wählt das Warten, und diese Wahl sagt mehr über ihn als jede Beschreibung.

  Auch eine Entscheidung, die niemand von der Figur verlangt, zeigt Charakter. Als kein Mensch den Toten kennen will, lässt Hebels Braut ihn „als die einzige, die ihm angehöre“, in ihr Stüblein tragen.

  > [!TIP] Die Prüffrage für jede Szene
  > Frag bei einer Szene: Was entscheidet die Figur hier, und was gibt sie dafür auf? Findest du keine Entscheidung, zeigt die Szene vielleicht Informationen, aber keinen Charakter.

  ## Figuren im Spiel: Spielerfigur, Nebenfigur, Gegenspieler

  Im Spiel kommt zu den Figuren der Spieler hinzu. Die **Spielerfigur** ist die Figur, die er steuert. Alle Figuren, die das Spiel steuert, heißen in der Branche NPC (non-player character); dazu gehören die **Nebenfiguren** und meist der **Gegenspieler**, also die Figur, deren Ziel dem der Spielerfigur im Weg steht. Ziel, Motiv und Widerstand gelten für alle drei. Bei der Spielerfigur kommt eine Frage dazu: Will der Spieler, was die Figur will?

  Laufen beide Ziele auseinander, hat es die Figur laut Dialog eilig, während der Spieler in Ruhe jede Schublade durchsucht. Das ist nicht immer ein Fehler, aber es schwächt jede Szene, die auf Dringlichkeit baut.

  *Papers, Please* (Lucas Pope, 2013) bringt beide Ziele über die Mechanik zusammen. Du prüfst als Grenzbeamter im fiktiven Staat Arstotzka die Papiere von Einreisenden. Am Ende jedes Tages verteilst du dein Geld auf Miete, Essen, Heizung und weitere Bedürfnisse deiner Familie ([Wikipedia](https://en.wikipedia.org/wiki/Papers,_Please)). Das Spiel muss dir nicht erklären, dass die Figur ihre Familie versorgen will. Du willst es selbst, weil du jeden Abend die Rechnung siehst.

  Nebenfiguren existieren dagegen oft nur für den Spieler. Die Questreihe „Family Matters“ in *The Witcher 3: Wild Hunt* (CD Projekt Red, 2015), bekannt als „The Bloody Baron“, zeigt eine Nebenfigur mit eigenem Ziel. Der Baron verspricht Geralt Auskunft über die gesuchte Ciri. Dafür soll Geralt Anna und Tamara finden, die verschwundene Frau und die Tochter des Barons. Die Entwickler legten ihn als Kontrastfigur zu Geralt an, weil beide Männer ihre Familie suchen. Im Lauf der Quest gibt der Baron zu, seine Frau geschlagen zu haben ([Wikipedia](https://en.wikipedia.org/wiki/The_Bloody_Baron)). Er hat ein Ziel, ein Motiv, das du nachvollziehen kannst, und eine Schuld, die es dir schwer macht, auf seiner Seite zu stehen.

  ## Häufige Fehler

  **Vage Ziele.** Das Ziel enthält Wörter wie „glücklich“, „frei“, „endlich Ruhe“ oder „Anerkennung“, und du kannst keine Szene nennen, in der man das Erreichen sehen würde. Frag, woran die Figur selbst merken würde, dass sie es geschafft hat, und schreib dieses sichtbare Ereignis als Ziel auf.

  **Motiv nur behauptet.** Der Grund steht in einem Satz des Figurenblatts („Sie ist ehrgeizig“) und kommt in keiner Szene vor. Gib dem Motiv einen Anlass, den der Leser erlebt oder von dem er erfährt, und frag, warum er gerade jetzt drängt.

  **Gegenspieler ohne Grund.** Die Figur handelt gegen die Hauptfigur, weil die Handlung es braucht, und ihr Blatt sagt „ist böse“. Schreib für den Gegenspieler Ziel, Motiv und Widerstand auf, als wäre er die Hauptfigur seiner eigenen Geschichte.

  **Funktionsfigur.** Die Figur existiert nur, um eine Information zu liefern oder eine Tür zu öffnen. Prüf, ob sie ohne den Spieler heute etwas vorhätte. Wenn nicht, gib ihr ein eigenes Ziel, das mit ihrer Aufgabe reibt, oder streich sie und vermittle die Information anders.

  **Alle wollen dasselbe.** Drei Figuren wollen, dass die Hauptfigur Erfolg hat, und unterscheiden sich nur im Namen. Leg die Ziele nebeneinander. Wo zwei gleich sind, entsteht zwischen ihnen kein Konflikt; verschieb eines, bis es mit dem anderen kollidiert.

  > [!PRAXIS] Nebenfiguren mit eigenem Antrieb
  > Meg Jayanth, Lead Writer von *80 Days* (inkle, 2014), sprach 2016 beim Game Narrative Summit der GDC darüber, Nebenfiguren eigene „agency, drive and motivation“ zu geben, auch wenn sie dadurch die Möglichkeiten der Hauptfigur einschränken. Ihr Vortrag heißt „Forget Protagonists“ ([GDC Vault](https://gdcvault.com/play/1023062/Forget-Protagonists-Writing-NPCs-with)). Bei CD Projekt Red gab Designer Paweł Sasko dem Bloody Baron Charisma und Humor, damit Spieler bei ihm zwiegespalten sind ([Wikipedia](https://en.wikipedia.org/wiki/The_Bloody_Baron)). In beiden Fällen ist die Nebenfigur eine Person mit eigenem Ziel und kein Auskunftsschalter.

  ## Zusammenfassung

  - Eine Figur trägt eine Geschichte, wenn sie etwas will. Dixons GMC zerlegt das in Ziel, Motiv und Widerstand.
  - Ein Ziel ist brauchbar, wenn man beobachten kann, ob die Figur es erreicht.
  - Das Motiv erklärt, warum die Figur das Ziel gerade jetzt verfolgt.
  - Widerstand kommt von außen (Personen, Regeln, Dinge, Fristen) und von innen (was die Figur selbst bremst).
  - Der Einsatz sagt, was verloren geht. Der Leser und im Spiel der Spieler müssen ihn kennen, bevor entschieden wird.
  - Charakter zeigt sich in Entscheidungen, die etwas kosten.
  - Im Spiel prüfst du zusätzlich, ob der Spieler will, was die Spielerfigur will, und ob Nebenfiguren ein eigenes Ziel haben.
exercises:
  - id: ziel-beobachtbar
    type: choice
    title: Woran sieht man es?
    prompt: |
      Vier Ziele für dieselbe Figur (Lehrbeispiele). Welches ist so formuliert, dass man am Ende sehen kann, ob die Figur es erreicht hat?
    options:
      - text: Lena will vor ihrem Umzug am Samstag die Waschmaschine an die Nachbarin verkaufen.
        correct: true
        why: Ergebnis und Frist sind sichtbar. Am Samstagabend steht die Maschine bei der Nachbarin oder noch in Lenas Küche.
      - text: Lena will in der neuen Stadt endlich ankommen.
        correct: false
        why: „Ankommen“ ist ein innerer Zustand. Es gibt keinen Moment, an dem ein Zuschauer sagen kann, dass er erreicht ist.
      - text: Lena will, dass ihr Bruder sie mehr respektiert.
        correct: false
        why: Respekt ist ein Gefühl des Bruders. Beobachtbar wird das Ziel erst, wenn du eine Handlung festlegst, an der es sich zeigt, etwa dass er sie um Rat fragt.
      - text: Lena will ihr Leben neu ordnen.
        correct: false
        why: Das ist eine Überschrift für viele mögliche Ziele. Welche Szene das Erreichen zeigt, bleibt offen.
    hints:
      - Stell dir das Ende der Szene vor. Bei welchem Ziel kann ein Zuschauer sagen, ob es geschafft ist?
    explanation: |
      Ein beobachtbares Ziel hat ein Ereignis, an dem sich Erfolg oder Scheitern zeigt, und oft eine Frist. Die drei anderen Ziele beschreiben Zustände oder Gefühle. Sie können als innerer Bedarf hinter einem Ziel stehen, taugen aber nicht als Ziel einer Szene, weil kein Zuschauer sie abhaken kann.
    resources:
      - title: Maris Soule über Debra Dixons GMC
        url: https://marissoule.com/building-a-character-gmc/

  - id: was-haelt-ihn-auf
    type: choice
    title: Das offene Tor
    prompt: |
      Was hält den Mann vom Lande in diesem Moment davon ab, hineinzugehen?
    lang: prose
    code: |
      Da das Tor zum Gesetz offen steht wie immer und der Türhüter beiseite tritt, bückt sich der Mann, um durch das Tor in das Innere zu sehen.
      Als der Türhüter das merkt, lacht er und sagt: „Wenn es dich so lockt, versuche es doch trotz meines Verbotes hineinzugehen. Merke aber: Ich bin mächtig. Und ich bin nur der unterste Türhüter. Von Saal zu Saal stehen aber Türhüter, einer mächtiger als der andere. Schon den Anblick des Dritten kann nicht einmal ich mehr ertragen.“
      Solche Schwierigkeiten hat der Mann vom Lande nicht erwartet; das Gesetz soll doch jedem und immer zugänglich sein, denkt er, aber als er jetzt den Türhüter in seinem Pelzmantel genauer ansieht, seine große Spitznase, den langen, dünnen, schwarzen tartarischen Bart, entschließt er sich doch lieber zu warten, bis er die Erlaubnis zum Eintritt bekommt.
    options:
      - text: Er entschließt sich nach dem Blick auf den Türhüter selbst zu warten; niemand hält ihn körperlich auf.
        correct: true
        why: Das Tor steht offen, der Türhüter tritt beiseite und fordert ihn sogar auf, es zu versuchen. Die Drohung wirkt, aber das Warten ist die Entscheidung des Mannes.
      - text: Der Türhüter versperrt ihm mit seinem Körper den Weg.
        correct: false
        why: Der Türhüter „tritt beiseite“. Er verbietet und droht, aber er stellt sich nicht in den Weg.
      - text: Das Tor ist verschlossen.
        correct: false
        why: Das Tor „steht offen wie immer“. Erst im letzten Satz kündigt der Türhüter an, es zu schließen.
      - text: Er hat das Interesse am Gesetz verloren.
        correct: false
        why: Er will weiterhin hinein. Er wartet ja ausdrücklich auf die Erlaubnis zum Eintritt.
    hints:
      - Lies genau, in welchem Zustand das Tor ist und was der Türhüter mit seinem Körper tut.
    explanation: |
      Kafka trennt hier äußeren und inneren Widerstand sehr genau. Von außen kommen Verbot und Drohung, aber kein körperliches Hindernis. Den Ausschlag gibt der Blick auf Pelzmantel, Spitznase und Bart, also ein Eindruck, den der Mann selbst deutet. Daraus wird seine Entscheidung zu warten, und diese Entscheidung hält ihn den Rest seines Lebens vor dem Tor.
    resources:
      - title: Franz Kafka, „Vor dem Gesetz“ (Wikisource)
        url: https://de.wikisource.org/wiki/Vor_dem_Gesetz

  - id: figur-und-spieler
    type: choice
    title: Wer will hier was?
    prompt: |
      In welcher Spielsituation (Lehrbeispiele) laufen das Ziel der Spielerfigur und das Ziel des Spielers auseinander?
    options:
      - text: Die Figur muss laut Dialog in zehn Minuten am Bahnhof sein. Das Spiel misst keine Zeit, und in jeder Straße liegen Sammelgegenstände.
        correct: true
        why: Der Text behauptet Eile, die Mechanik belohnt das Trödeln. Der Spieler verfolgt ein anderes Ziel als die Figur.
      - text: Die Figur will ihre Miete bezahlen. Das Spiel rechnet jeden Abend Einnahmen und Ausgaben ab und zeigt den Kontostand.
        correct: false
        why: Hier stützt die Mechanik das Ziel der Figur, ähnlich wie in Papers, Please. Der Spieler will dasselbe wie die Figur.
      - text: Die Figur sucht ihren verlorenen Schlüssel, und der Spieler durchsucht die Wohnung nach genau diesem Schlüssel.
        correct: false
        why: Figur und Spieler verfolgen dasselbe Ziel mit derselben Handlung.
      - text: Die Figur will eine Prüfung bestehen, und der Spieler übt im Spiel die Prüfungsaufgaben, bis er sie löst.
        correct: false
        why: Das Üben des Spielers ist genau der Weg der Figur zum Ziel.
    hints:
      - Frag bei jeder Situation, was die Mechanik belohnt, und vergleich es mit dem, was die Figur laut Text will.
    explanation: |
      Ziel der Figur und Ziel des Spielers decken sich, wenn die Mechanik belohnt, was die Figur will. Behauptet der Text etwas anderes als die Mechanik, folgen Spieler oft der Mechanik. Das ist nicht verboten, aber dann wirkt jede Zeile, die Dringlichkeit behauptet, unglaubwürdig. Wie Belohnungen Entscheidungen formen, behandelt das Modul [Erzählerische Folgen und mechanische Anreize](/narrative/folgen-anreize).
    resources:
      - title: Papers, Please (Wikipedia)
        url: https://en.wikipedia.org/wiki/Papers,_Please

  - id: figur-pruefen
    type: order
    title: Eine Figur durchgehen
    prompt: |
      Bring die Schritte, mit denen du eine Figur prüfst, in die Reihenfolge aus der Lektion. Sie folgt Dixons Kürzel GMC, also Ziel, Motiv, Widerstand, und endet mit dem Einsatz.
    lang: prose
    lines: |
      Ziel als Ereignis aufschreiben, das man sehen kann
      Prüfen, ob ein Zuschauer „erreicht“ oder „nicht erreicht“ sagen könnte
      Motiv notieren: Warum will die Figur das gerade jetzt?
      Äußeren Widerstand benennen: Person, Regel, Ding oder Frist
      Inneren Widerstand benennen: was die Figur selbst bremst
      Einsatz festhalten: Was verliert die Figur, wenn sie scheitert?
    alternatives:
      - [1, 2, 3, 5, 4, 6]
    hints:
      - Alles andere bezieht sich auf das Ziel.
      - Den Einsatz kannst du erst bestimmen, wenn klar ist, was die Figur will und was sie aufhält.
    explanation: |
      Das Ziel kommt zuerst, weil alles andere sich darauf bezieht. Die Prüfung auf Beobachtbarkeit folgt direkt, damit du nicht auf einem vagen Ziel weiterbaust. Motiv und Widerstand hängen beide nur vom Ziel ab; dass das Motiv vor dem Widerstand steht, folgt Dixons Reihenfolge G–M–C. Ob du den äußeren oder den inneren Widerstand zuerst notierst, ist gleich. Der Einsatz steht am Ende, weil er erst klar ist, wenn du weißt, was die Figur will und was sie aufhält.

  - id: gmc-begriffe
    type: gap
    title: Vier Wörter für eine Figur
    prompt: |
      Ergänze die vier Begriffe aus der Lektion.
    lang: prose
    code: |
      Was die Figur erreichen will, ist ihr ⟦Ziel⟧.
      Warum sie es gerade jetzt will, ist ihr ⟦Motiv⟧.
      Wer oder was ihr im Weg steht, ist der ⟦Widerstand⟧.
      Was sie verliert, wenn sie scheitert, ist der ⟦Einsatz⟧.
    gaps:
      - label: Was sie will
        hint: Bei Dixon goal.
        accept: [Goal, Wunsch]
      - label: Warum jetzt
        hint: Bei Dixon motivation.
        accept: [Motivation, Beweggrund, Grund, Anlass]
      - label: Was im Weg steht
        hint: Bei Dixon conflict; er kommt von außen oder innen.
        accept: [Konflikt, Hindernis, Conflict]
      - label: Was verloren geht
        hint: Englisch stakes.
        accept: [Stakes]
    explanation: |
      Die drei ersten Begriffe sind Dixons GMC auf Deutsch, der vierte ergänzt, was auf dem Spiel steht. Fehlt einer, merkst du es an der Szene. Ohne Widerstand erreicht die Figur ihr Ziel sofort, ohne Einsatz ist es dem Leser gleich, ob sie es erreicht.
    resources:
      - title: Debra Dixon, „GMC“ (Verlagsseite)
        url: https://bellebooks.com/categories/p/gmc

  - id: figur-aus-werk
    type: practice
    title: Eine Figur, die du kennst
    prompt: |
      Wähle eine Figur aus einem Spiel oder Buch, das du gut kennst. Fülle die Felder mit je einem Satz. Vorschläge aus der Lektion sind der Mann vom Lande oder die Spielerfigur in Papers, Please, aber eine eigene Wahl übt mehr. Gibt das Werk etwas nicht her, schreib „bleibt offen“.
    lang: prose
    starter: |
      Werk:
      Figur:
      Ziel:
      Motiv (warum jetzt):
      Widerstand außen:
      Widerstand innen:
    checklist:
      - Das Ziel beschreibt ein Ereignis, bei dem man sehen kann, ob es eintritt.
      - Das Motiv nennt einen Anlass aus dem Werk, oder du hast „bleibt offen“ notiert.
      - Der äußere Widerstand ist eine Person, Regel, Sache oder Frist.
      - Der innere Widerstand liegt in der Figur selbst, nicht in ihrer Umgebung, oder du hast „bleibt offen“ notiert.
      - Jedes Feld enthält höchstens einen Satz.
    explanation: |
      Die Felder zwingen dich, die Figur in ihre Teile zu zerlegen. Fällt dir für ein Feld nichts ein, ist das ein Befund. Viele Figuren haben nur einen äußeren Widerstand, und manches Motiv bleibt im Werk offen wie bei Kafka. Notier dann „bleibt offen“, statt etwas zu erfinden.
    resources:
      - title: Maris Soule über Debra Dixons GMC
        url: https://marissoule.com/building-a-character-gmc/

  - id: figurenblatt-ziele
    type: bug
    title: Vier Szenen, ein Ausreißer
    prompt: |
      Ein Figurenblatt (Lehrbeispiel) listet, was die Figur in vier Szenen will. Finde die Zeile, die kein beobachtbares Ziel nennt.
    lang: prose
    code: |
      Figur: Jana, 34, Fahrradmechanikerin, eröffnet eine eigene Werkstatt
      Szene 1: Jana will den Mietvertrag für die Halle bis Freitag unterschreiben.
      Szene 2: Jana will ihren Bruder als Bürgen für den Kredit gewinnen.
      Szene 3: Jana will endlich mit sich im Reinen sein.
      Szene 4: Jana will die alte Hebebühne ihres Chefs für 800 Euro kaufen.
    lines: [4]
    hints:
      - Stell dir für jede Zeile das Ende der Szene vor. Wo kann ein Zuschauer nicht sagen, ob Jana es geschafft hat?
    explanation: |
      Zeile 4 beschreibt einen inneren Zustand. Am Ende der Szene kann niemand sehen, ob Jana „mit sich im Reinen“ ist. Die anderen Zeilen haben ein sichtbares Ergebnis: einen unterschriebenen Vertrag, eine Zusage des Bruders, einen Kauf. Der Wunsch in Zeile 4 kann als innerer Bedarf hinter den Szenen stehen, aber die Szene selbst braucht ein Ziel, das man abhaken kann.

  - id: gegenspieler-ohne-grund
    type: bug
    title: Der Hausverwalter
    prompt: |
      Ein Blatt für einen Gegenspieler (Lehrbeispiel). Finde die Zeile, die ein Verhalten behauptet, ohne einen Grund in der Figur zu nennen.
    lang: prose
    code: |
      Gegenspieler: Herr Albers, Hausverwalter
      Ziel: Die Wohnung bis zum Monatsersten neu vermieten
      Motiv: Der Eigentümer droht, ihm die Verwaltung zu entziehen
      Mittel: Er legt die Wohnungsübergabe auf Montag, 7 Uhr
      Haltung zur Mieterin: Er schikaniert sie, weil er ein schlechter Mensch ist
      Widerstand: Die Mieterin gibt die Schlüssel erst gegen die Kaution heraus
    lines: [5]
    hints:
      - Achte auf das Wort „weil“. Nicht jedes „weil“ nennt ein Motiv.
    explanation: |
      Zeile 5 sieht aus wie eine Begründung, ist aber ein Urteil über die Figur. „Ein schlechter Mensch“ erklärt nichts, was Albers will. Zeile 3 zeigt, wie es anders geht: Der Druck des Eigentümers erklärt, warum Albers drängt, und daraus folgt auch das Mittel in Zeile 4. Ein Gegenspieler wird glaubwürdig, wenn sein Verhalten aus seinem eigenen Ziel folgt.

  - id: tuerhueter-schluss
    type: explain
    title: Nur für dich bestimmt
    prompt: |
      Was will der Mann vom Lande, was hält ihn auf, und wie verändert der letzte Satz des Türhüters dein Bild vom Widerstand? Antworte in zwei bis vier Sätzen.
    lang: prose
    code: |
      Dort sitzt er Tage und Jahre.
      Er macht viele Versuche eingelassen zu werden und ermüdet den Türhüter durch seine Bitten.
      […]
      Während der vielen Jahre beobachtet der Mann den Türhüter fast ununterbrochen.
      Er vergißt die andern Türhüter und dieser erste scheint ihm das einzige Hindernis für den Eintritt in das Gesetz.
      […]
      „Alle streben doch nach dem Gesetz,“ sagt der Mann, „wieso kommt es, daß in den vielen Jahren niemand außer mir Einlaß verlangt hat?“
      Der Türhüter erkennt, daß der Mann schon an seinem Ende ist und, um sein vergehendes Gehör noch zu erreichen, brüllt er ihn an:
      „Hier konnte niemand sonst Einlaß erhalten, denn dieser Eingang war nur für dich bestimmt. Ich gehe jetzt und schließe ihn.“
    points:
      - Das Ziel bleibt bis zum Tod dasselbe, der Einlass in das Gesetz.
      - Der Mann hält den ersten Türhüter für das einzige Hindernis und richtet alle Versuche auf ihn.
      - Niemand hält ihn mit Gewalt auf; er wartet auf eine Erlaubnis, statt hineinzugehen.
      - Der letzte Satz stellt infrage, ob allein der Türhüter das Hindernis war.
      - Die Wendung kommt zu spät, um für die Figur etwas zu ändern; sie wirkt auf den Leser.
    hints:
      - Achte darauf, wen der Mann für das einzige Hindernis hält.
      - Lies den letzten Satz und frag, für wen der Eingang da war und warum der Mann nie hindurchging.
    explanation: |
      Der Mann will ein Leben lang dasselbe, den Eintritt in das Gesetz. Der erste Türhüter scheint ihm „das einzige Hindernis für den Eintritt in das Gesetz“, und er vergisst darüber die anderen. Also richtet er Bitten, Beobachtung und Bestechung auf diese eine Person. Der Türhüter verbietet, aber er hindert ihn nicht körperlich; der Mann wartet auf eine Erlaubnis, die er sich nie nimmt. Der letzte Satz, der Eingang sei „nur für dich bestimmt“ gewesen, legt eine Lesart nahe, nach der ein Teil des Hindernisses im Warten selbst lag. Kafka spricht das nicht aus, und der Text erlaubt andere Deutungen. Sicher ist, dass die Wendung für den Mann zu spät kommt und deshalb beim Leser wirkt, der jetzt die ganze Geschichte neu liest.
    resources:
      - title: Franz Kafka, „Vor dem Gesetz“ (Wikisource)
        url: https://de.wikisource.org/wiki/Vor_dem_Gesetz

  - id: hebel-einsatz
    type: explain
    title: Was fünfzig Jahre hält
    prompt: |
      Was steht für die Braut auf dem Spiel, und womit hält Hebel diesen Einsatz über fünfzig Jahre wach? Antworte in zwei bis vier Sätzen.
    lang: prose
    code: |
      „Und Friede und Liebe soll darinn wohnen,“ sagte die schöne Braut mit holdem Lächeln, „denn du bist mein Einziges und Alles, und ohne dich möchte ich lieber im Grab seyn, als an einem andern Ort.“
      […]
      Er kam nimmer aus dem Bergwerk zurück, und sie saumte vergeblich selbigen Morgen ein schwarzes Halstuch mit rothem Rand für ihn zum Hochzeittag, sondern als er nimmer kam, legte sie es weg, und weinte um ihn und vergaß ihn nie.
      […]
      Den andern Tag, als das Grab gerüstet war auf dem Kirchhof und ihn die Bergleute holten, schloß sie ein Kästlein auf legte sie ihm das schwarzseidene Halstuch mit rothen Streifen um, und begleitete ihn alsdann in ihrem Sonntagsgewand, als wenn es ihr Hochzeittag und nicht der Tag seiner Beerdigung wäre.
    points:
      - Der Einsatz wird am Anfang ausgesprochen; ohne den Bräutigam wäre sie „lieber im Grab“.
      - Der Verlust tritt ein, bevor die Hochzeit stattfindet.
      - Das Halstuch für den Hochzeitstag verbindet Anfang und Ende als Gegenstand.
      - Am Ende handelt sie, als wäre es ihr Hochzeitstag, und löst damit ein, was der Anfang versprochen hat.
    hints:
      - Such einen Gegenstand, der am Anfang und am Ende vorkommt.
    explanation: |
      Auf dem Spiel steht für die Braut das gemeinsame Leben mit dem Bergmann, und sie sagt selbst, dass sie ohne ihn „lieber im Grab“ wäre. Der Verlust kommt, bevor die Hochzeit stattfindet. Hebel hält den Einsatz über einen Gegenstand wach: das Halstuch, das sie für den Hochzeitstag säumt, weglegt und fünfzig Jahre später dem Toten umlegt. Sie begleitet ihn im Sonntagsgewand, „als wenn es ihr Hochzeittag“ wäre, und so schließt das Ende an den Satz vom Anfang an. Dass das Tuch zuerst „mit rothem Rand“ und am Ende „mit rothen Streifen“ beschrieben wird, steht so im Erstdruck von 1811.
    resources:
      - title: Johann Peter Hebel, „Unverhoftes Wiedersehen“ (Wikisource, Erstausgabe 1811)
        url: https://de.wikisource.org/wiki/Seite:Schatzkaestlein_des_rheinischen_Hausfreundes.djvu/300

  - id: papers-please-mechanik
    type: explain
    title: Die Abrechnung am Abend
    prompt: |
      Die Beschreibung fasst die Spielmechanik von Papers, Please in eigenen Worten zusammen. Benenne Ziel, Einsatz und Widerstand der Spielerfigur und zeig, wo eine Entscheidung unter Druck entsteht. Antworte in zwei bis vier Sätzen.
    lang: prose
    code: |
      Papers, Please (Lucas Pope, 2013):
      Du prüfst als Grenzbeamter im fiktiven Staat Arstotzka die Papiere von Einreisenden.
      Für jede richtig abgefertigte Person bekommst du Geld, für Fehler gibt es Strafabzüge.
      Am Ende jedes Tages teilst du das Geld auf Miete, Essen, Heizung und weitere Bedürfnisse deiner Familie auf.
      Gerätst du in Schulden, ist das Spiel vorbei.
      Wer Bestechungsgeld annimmt, riskiert, entdeckt und eingesperrt zu werden.
    points:
      - Das Ziel ist, die Familie zu versorgen; der Spieler sieht es jeden Abend in der Abrechnung.
      - Der Einsatz ist sichtbar, weil Schulden das Spiel beenden.
      - Widerstand kommt aus der Arbeit selbst, denn jeder Fehler kostet Geld.
      - Bestechung ist eine Entscheidung unter Druck, mehr Geld für die Familie gegen das Risiko der Haft.
    hints:
      - Frag, was am Ende jedes Tages auf dem Bildschirm passiert.
      - Bei welcher Handlung gewinnt die Figur etwas und riskiert zugleich etwas?
    explanation: |
      Das Ziel der Figur ist, die Familie durchzubringen, und der Spieler übernimmt es, weil er jeden Abend selbst das Geld verteilen muss. Der Einsatz steht im Regelwerk: Wer in Schulden gerät, verliert das Spiel. Der Widerstand liegt in der Arbeit, denn jeder Fehler bei der Prüfung kostet Geld. Bestechung macht daraus eine Entscheidung unter Druck: Das Geld hilft dem Ziel, das Risiko von Entdeckung und Haft bedroht es. Beide Möglichkeiten kosten etwas, deshalb sagt die Wahl etwas über die Figur und über den Spieler.
    resources:
      - title: Papers, Please (Wikipedia)
        url: https://en.wikipedia.org/wiki/Papers,_Please
      - title: Papers, Please (offizielle Seite)
        url: https://papersplea.se/

  - id: eigene-figur
    type: practice
    title: Eine Figur aus deinem Projekt
    prompt: |
      Wähle eine Figur aus deinem eigenen Projekt. Fülle die Felder mit je einem Satz oder Stichpunkt. Das letzte Feld füllst du nur aus, wenn es die Spielerfigur ist.
    lang: prose
    starter: |
      Figur:
      Ziel:
      Motiv (warum jetzt):
      Widerstand (außen / innen):
      Einsatz:
      Will der Spieler das auch?
    checklist:
      - Das Ziel beschreibt ein Ereignis, bei dem man sehen kann, ob es eintritt.
      - Das Motiv nennt einen Anlass, der erklärt, warum die Figur jetzt handelt.
      - Beim Widerstand stehen ein äußerer und ein innerer, die sich unterscheiden, oder du hast bei einem davon „keiner“ notiert.
      - Der Einsatz nennt, was die Figur konkret verliert, wenn sie scheitert.
      - Ist es die Spielerfigur, hast du notiert, ob die Mechanik dasselbe Ziel belohnt; sonst bleibt das Feld leer.
    explanation: |
      Diese Übung hat keine Musterlösung, weil die Figur dir gehört. Die Checkliste prüft nur die Form: ob das Ziel beobachtbar ist, ob das Motiv einen Anlass hat und ob der Einsatz konkret ist. Bleibt ein Feld leer, weißt du, wo du an der Figur weiterarbeiten kannst.
