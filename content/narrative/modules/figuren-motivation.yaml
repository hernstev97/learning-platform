id: figuren-motivation
title: "Figuren: Ziel, Motiv und Widerstand"
level: 1
minutes: 75
summary: Was eine Figur will, warum gerade jetzt und was ihr im Weg steht – mit Ziel, Motiv, Widerstand und Einsatz prüfst du Figuren in Büchern, Spielen und deinem eigenen Projekt.
place: unterwegs
goals:
  - Du beschreibst eine Figur über Ziel, Motiv und Widerstand und formulierst ihr Ziel so, dass man sehen kann, ob sie es erreicht.
  - Du unterscheidest an Kafkas „Vor dem Gesetz“ äußeren und inneren Widerstand.
  - Du benennst den Einsatz einer Figur und erklärst an Hebels „Unverhofftem Wiedersehen“, wie er eine Geschichte trägt.
  - Du prüfst bei Spielfiguren, ob Spieler und Spielerfigur dasselbe wollen und ob Nebenfiguren ein eigenes Ziel haben.
  - Du erkennst in einem Figurenblatt vage Ziele und Gegenspieler ohne Grund.
