id: szenenaufbau
title: Konflikt und Szenenaufbau
level: 1
minutes: 80
summary: Du lernst, woran du eine Szene erkennst, in der sich etwas dreht, wie Ziel, Konflikt, Rückschlag und Entscheidung Szenen zu einer Kette verbinden und wann eine Zusammenfassung die bessere Wahl ist.
place: unterwegs
goals:
  - Du prüfst am Anfang und am Ende einer Szene, ob sich ein Wert im Leben einer Figur gedreht hat.
  - Du ordnest Szene und Folgeszene nach Swain (Ziel, Konflikt, Rückschlag; Reaktion, Dilemma, Entscheidung) und erklärst, wie die Entscheidung das nächste Ziel setzt.
  - Du findest in einer Szene den spätesten Einstieg und den frühesten Ausstieg.
  - Du erkennst Konflikt auch dort, wo niemand streitet, etwa in einem Machtgefälle.
  - Du unterscheidest Szene, Zusammenfassung, Ellipse und Pause über Erzählzeit und erzählte Zeit.
  - Du beschreibst einen Abschnitt aus einem Spiel deiner Wahl mit Ziel, Widerstand und Wendung.
