lesson: |
  Der erste Absatz von Lessings Fabel „Der Esel und das Jagdpferd“ erzählt eine ganze Szene in drei Sätzen:

  > Ein Esel vermaß sich, mit einem Jagdpferde um die Wette zu laufen. Die Probe fiel erbärmlich aus, und der Esel ward ausgelacht. Ich merke nun wohl, sagte der Esel, woran es gelegen hat; ich trat mir vor einigen Monaten einen Dorn in den Fuß, und der schmerzt mich noch.

  Gotthold Ephraim Lessing, „Der Esel und das Jagdpferd“ (Fabeln, 1759), zitiert nach [Projekt Gutenberg-DE](https://projekt-gutenberg.org/authors/gotthold-ephraim-lessing/books/gotthold-ephraim-lessing-fabeln/chapter/6) in modernisierter Schreibung

  Der Esel will etwas, versucht es, scheitert vor Zuschauern und zeigt dann, wie er mit der Niederlage umgeht: Er erfindet einen Dorn. Am Ende steht er anders da als am Anfang. Er wollte als schnell gelten, jetzt lacht man über ihn, und die Ausrede macht es nicht besser. Viele Entwürfe haben das Gegenteil. Zwei Figuren sitzen in einer Küche, reden, trinken Kaffee, und am Ende sitzen sie da wie vorher. Der Text kann sauber geschrieben sein und steht trotzdem still.

  Dieses Modul zeigt dir, wie du das erkennst und änderst. In [Werkstatt: eine Szene schreiben und überarbeiten](/narrative/werkstatt-szene) wendest du es danach am PC auf eine eigene Szene an.

  ## Die Szene: eine Einheit, in der sich etwas dreht

  Robert McKee beschreibt die Szene in seinem Buch „Story“ als Handlung, die durch Konflikt hindurch und in ungefähr zusammenhängender Zeit und Ort die Lage einer Figur in mindestens einem Wert spürbar verändert ([McKee: Do your scenes turn?](https://mckeestory.com/do-your-scenes-turn/)). Ein Wert ist hier ein Gegensatzpaar, das für die Figur zählt: Ansehen oder Spott, Nähe oder Fremdheit, Sicherheit oder Gefahr, Wissen oder Unwissen. Beim Esel ist es das Ansehen.

  Steht der Wert am Ende dort, wo er am Anfang stand, ist nichts Bedeutsames passiert, auch wenn viel geredet und getan wurde. McKee nennt so eine Szene ein Nichtereignis. Meist steht sie nur da, um Informationen zu liefern, und diese Informationen gehören dann in eine andere Szene.

  > [!TIP] Der Test mit zwei Notizen
  > Schreib neben jede Szene zwei Wörter: wo der Wert am Anfang steht und wo am Ende. Sind beide Notizen gleich, frag dich, warum die Szene im Text ist. Den Test schlägt McKee selbst vor.

  Die Regel hat eine Grenze. Nicht jede Passage muss eine Szene sein. Beschreibungen, Übergänge und Zusammenfassungen verbinden Szenen, und nach einer Wendung kann eine ruhige Passage dem Leser Luft geben. Wer aber Figuren eine Seite lang miteinander reden lässt, verspricht dem Leser, dass sich dabei etwas dreht.

  > [!MERKE]
  > Eine Szene dreht einen Wert im Leben einer Figur. Ohne diese Drehung ist sie eine Zustandsbeschreibung, gleich wie viel darin passiert.

  ## Szene und Folgeszene nach Swain

  Dwight V. Swain beschreibt in „Techniques of the Selling Writer“ ([University of Oklahoma Press](https://www.oupress.com/9780806111919/techniques-of-the-selling-writer/)) zwei Bausteine, die sich abwechseln: die Szene und die Folgeszene (englisch *scene* und *sequel*). Randy Ingermanson erklärt sie in seinem Artikel „Writing the Perfect Scene“ und nennt Swain ausdrücklich als Quelle ([Advanced Fiction Writing](https://www.advancedfictionwriting.com/articles/writing-the-perfect-scene/)).

  ```text
  Szene
   Ziel → Konflikt → Rückschlag
  Folgeszene
   Reaktion → Dilemma → Entscheidung
   ↓ setzt das neue Ziel
  Szene
   neues Ziel → …
  ```

  - **Ziel** – was die Figur zu Beginn der Szene will.
  - **Konflikt** – die Hindernisse auf dem Weg dorthin.
  - **Rückschlag** – die Figur erreicht ihr Ziel nicht (bei Ingermanson *Disaster*).
  - **Reaktion** – wie die Figur den Rückschlag aufnimmt, zuerst im Gefühl.
  - **Dilemma** – eine Lage, in der keine Möglichkeit gut ist.
  - **Entscheidung** – die Wahl zwischen diesen Möglichkeiten.

  Die Entscheidung am Ende der Folgeszene setzt das Ziel der nächsten Szene. So folgt jede Szene aus der vorigen, und der Leser will wissen, ob das neue Ziel gelingt. Ingermanson begründet den Rückschlag mit dem Leser: Gewinnt die Figur, hat er keinen Grund weiterzulesen. Das ist eine Faustregel. Auch ein Sieg kann eine Szene beenden, wenn er etwas kostet oder eine neue Frage öffnet; dann dreht sich ebenfalls ein Wert.

  Die Folgeszene kann eine Seite lang sein oder in einem Satz stecken. Beim Esel ist die Ausrede Reaktion und Entscheidung zugleich. Er erkennt die Niederlage nicht an und wählt die Ausflucht.

  ### Die Entscheidung gehört oft dem Spieler

  Für Spiele passt das Muster auffällig gut, denn die Entscheidung der Folgeszene ist oft der Moment, in dem der Spieler handelt. In Papers, Please arbeitest du als Grenzbeamter. Jeder Tag ist eine Schicht mit begrenzter echter Zeit. Du bekommst Geld für jeden Einreisenden, den du richtig abfertigst, Verstöße gegen die Vorschriften kosten Abzüge, und am Abend teilst du das Geld auf Miete, Essen, Heizung und weitere Bedürfnisse deiner Familie auf ([Wikipedia: Papers, Please](https://en.wikipedia.org/wiki/Papers,_Please)).

  Man kann die Schicht als Szene lesen (Ziel, Widerstand durch Regeln und Uhr, Rückschlag durch Abzüge) und den Abend als Folgeszene, deren Dilemma der Spieler selbst löst. Seine Entscheidung legt fest, mit welcher Lage er in den nächsten Tag geht.

  ## Spät hinein, früh hinaus

  Eine verbreitete Faustregel lautet: Steig so spät wie möglich in eine Szene ein und so früh wie möglich wieder aus. Spät heißt, der Konflikt läuft schon, wenn der Leser dazukommt. Früh heißt, die Szene endet, sobald sich der Wert gedreht hat. Ankommen, Begrüßen und Platznehmen davor, Verabschieden und Nachbesprechen danach drehen meist keinen Wert.

  Büchners „Woyzeck“ zeigt den späten Einstieg. Die Szene „Zimmer“ beginnt mitten in einer Tätigkeit: Woyzeck rasiert den Hauptmann, und der Hauptmann ermahnt ihn schon im ersten Satz, langsamer zu machen. Niemand tritt ein, niemand grüßt. Die Szene endet kurz nach ihrer Wendung mit einem Befehl.

  Auch die Brüder Grimm halten sich nicht mit dem Weg auf. Rotkäppchen hat Blumen gesammelt, ihm fällt die Großmutter wieder ein, und im nächsten Satz tritt es in die Stube. Am Bett liegt die Großmutter mit der Haube tief im Gesicht, und die Szene steigert sich in vier Fragen:

  > „Ei, Großmutter, was hast du für große Ohren!“ „Daß ich dich besser hören kann.“ „Ei, Großmutter, was hast du für große Augen!“ „Daß ich dich besser sehen kann.“ „Ei, Großmutter, was hast du für große Hände!“ „Daß ich dich besser packen kann.“ „Aber, Großmutter, was hast du für ein entsetzlich großes Maul!“ „Daß ich dich besser fressen kann.“ Kaum hatte der Wolf das gesagt, so that er einen Satz aus dem Bette und verschlang das arme Rothkäppchen.

  Brüder Grimm, „Rotkäppchen“ (Kinder- und Haus-Märchen, 7. Auflage 1857, dort „Rothkäppchen“ geschrieben), [Wikisource](https://de.wikisource.org/wiki/Rothk%C3%A4ppchen_%281857%29)

  Hören und Sehen sind harmlos, Packen ist eine Drohung, Fressen ist die Tat. Der Leser weiß längst, wer im Bett liegt, Rotkäppchen weiß es nicht, und jede Antwort vergrößert den Abstand zwischen beiden. Das „Aber“ vor der vierten Frage bricht das Muster. Unmittelbar danach kippt der Wert von Sicherheit zu Gefahr, und die Szene endet mit diesem Satz, ohne zu erklären.

  > [!WARNING] Zu spät ist auch ein Fehler
  > Steigt eine Szene so spät ein, dass der Leser nicht weiß, wo er ist und wer spricht, verliert er die Orientierung. Büchner gibt mit einer Regieanweisung Ort, Personen und Tätigkeit an, bevor das erste Wort fällt. Im Spiel kommt etwas dazu: Der Spieler muss wissen, was er tun kann.

  ## Konflikt ohne Streit

  Konflikt heißt: Ein Ziel trifft auf Widerstand. Das kann ein Streit sein, muss es aber nicht. In der Szene beim Hauptmann wird nicht gestritten. Der Hauptmann sitzt, redet und urteilt, Woyzeck rasiert ihn und antwortet fast immer gleich:

  > **Hauptmann.** Wozzeck, Er sieht immer so verhetzt aus! Ein guter Mensch thut das nicht, ein guter Mensch, der sein gutes Gewissen hat, thut Alles langsam … Red’ Er doch was, Wozzeck. Was ist heut für Wetter?\
  > **Wozzeck.** Schlimm, Herr Hauptmann, schlimm. Wind!\
  > **Hauptmann.** Ich spür’s schon, ’s ist so was Geschwindes draußen; so ein Wind macht mir den Effect, wie eine Maus. (Pfiffig.) Ich glaub’, wir haben so was aus Süd-Nord?\
  > **Wozzeck.** Ja wohl, Herr Hauptmann.\
  > **Hauptmann.** Ha! ha! ha! Süd-Nord! Ha! ha! ha! O Er ist dumm, ganz abscheulich dumm!

  Georg Büchner, „Woyzeck“, Szene „Zimmer“, zitiert nach der Ausgabe von Karl Emil Franzos (1879), die den Namen ‚Wozzeck‘ schreibt, [Wikisource](https://de.wikisource.org/wiki/Wozzeck)

  Den Widerstand bildet hier ein Machtgefälle. Achte im Zitat darauf, wer fragt, wer urteilt und wer nur zustimmen darf. Etwas später antwortet Woyzeck zum ersten Mal anders, und das Gespräch dreht sich. Was dort passiert, untersuchst du in der Übung „Ja wohl, Herr Hauptmann“.

  Für eigene Szenen heißt das: Prüf nicht, ob die Figuren laut werden, sondern ob ein Ziel auf Widerstand trifft. Höflichkeit, Schweigen und Zustimmung können Widerstand sein.

  ## Szene und Zusammenfassung: Erzählzeit und erzählte Zeit

  Günther Müller unterscheidet zwei Zeiten: die Erzählzeit, die das Erzählen braucht (gemessen etwa in Seiten), und die erzählte Zeit, die die Handlung umfasst. Gérard Genette nennt vier Verhältnisse zwischen beiden: Pause, Szene, Zusammenfassung und Ellipse ([Living Handbook of Narratology: Time](https://www-archiv.fdm.uni-hamburg.de/lhn/node/106.html)).

  - **Szene:** Text und Handlung dauern etwa gleich lang. Beispiel: Rotkäppchens Fragen.
  - **Zusammenfassung (Raffung):** wenig Text, viel Zeit. Beispiel: Hebels fünfzig Jahre.
  - **Ellipse:** kein Text, aber Zeit vergeht. Beispiel: der Sprung zwischen zwei Akten.
  - **Pause:** Text, aber keine Zeit vergeht. Beispiel: die Beschreibung eines Raums.

  Hebels „Unverhofftes Wiedersehen“ wechselt das Tempo mit Absicht. Ein junger Bergmann in Falun klopft am Morgen ans Fenster seiner Braut, sagt ihr „guten Morgen, aber keinen guten Abend mehr“ und kommt nicht aus dem Bergwerk zurück. Dann vergehen fünfzig Jahre in einer Kette von „und“:

  > Unterdessen wurde die Stadt Lissabon in Portugall durch ein Erdbeben zerstört, und der siebenjährige Krieg gieng vorüber, und Kayser Franz der erste starb, und der JesuitenOrden wurde aufgehoben und Polen getheilt, und die Kaiserin Maria Theresia starb, und der Struensee wurde hingerichtet, Amerika wurde frey, und die vereinigte französische und spanische Macht konnte Gibraltar nicht erobern.

  Johann Peter Hebel, „Unverhofftes Wiedersehen“ (Schatzkästlein des rheinischen Hausfreundes, 1811; der Erstdruck schreibt „Unverhoftes Wiedersehen“), [Wikisource](https://de.wikisource.org/wiki/Seite:Schatzkaestlein_des_rheinischen_Hausfreundes.djvu/300)

  Die Raffung hat einen Grund. In diesen fünfzig Jahren dreht sich für die Braut kein Wert: Sie trauert und vergisst ihn nie. Was die Welt erschüttert, ändert an ihrer Lage nichts, und die gleichförmigen „und“ lassen das hören. Erst als die Bergleute 1809 den Leichnam finden, wird Hebel langsam. Er beschreibt das unverwesene Gesicht, die alte Frau an der Krücke, ihre Worte und das Halstuch, das sie ihm zum Begräbnis umlegt. Wo sich der Wert dreht, bekommt der Text Erzählzeit.

  Daraus folgt eine Grenze der Regel „Show, don't tell“ (zeigen statt behaupten). Zusammenfassung ist kein Fehler. Sie ist das richtige Werkzeug für Zeit, in der sich nichts dreht. Ein Fehler wird sie erst, wenn sie den Moment überspringt, in dem sich der Wert ändert. Spiele springen ebenso: Pentiment spielt in drei Akten in den Jahren 1518, 1525 und 1543 ([Wikipedia: Pentiment](https://en.wikipedia.org/wiki/Pentiment_%28video_game%29)), zwischen den Akten liegen also Jahre.

  ## Szenen im Spiel

  Im Spiel heißt die Szene oft anders: Quest-Abschnitt (ein Teil eines Auftrags), Level, Begegnung, Tag. Das Werkzeug bleibt gleich. Frag bei jedem Abschnitt, was die Spielerfigur will, was dagegen steht und was am Ende anders ist.

  Dazu kommt eine Frage, die es im Buch nicht gibt: Was will der Spieler in diesem Abschnitt? Ziel der Figur und Ziel des Spielers können zusammenfallen oder auseinanderlaufen. Die Figur hat es vielleicht eilig, während der Spieler erst jede Ecke absuchen will. Mehr dazu steht in [Figuren: Ziel, Motiv und Widerstand](/narrative/figuren-motivation).

  Wichtig ist auch, wer in der Wendung handelt. In einer Zwischensequenz (englisch *cutscene*) sieht der Spieler zu, während sich der Wert dreht, in einer spielbaren Szene dreht er ihn selbst. Beides hat seinen Platz. Liegt aber jede Wendung in Zwischensequenzen, sieht der Spieler bei allem Wichtigen nur zu.

  > [!PRAXIS] Gespräche beim Gehen
  > In Oxenfree von Night School Studio laufen die Gespräche beim Gehen statt in Zwischensequenzen. Der Spieler kann jederzeit eine Antwort wählen, die anderen ausreden lassen, ihnen ins Wort fallen oder schweigen ([Wikipedia: Oxenfree](https://en.wikipedia.org/wiki/Oxenfree)). So bleibt eine Szene spielbar, die fast nur aus Dialog besteht.

  ## Häufige Fehler

  - **Die Szene ändert nichts.** Beim Test mit zwei Notizen steht am Anfang und am Ende dasselbe. Streich die Szene oder gib ihr einen Wert, der sich dreht; ihre Informationen wandern in eine andere Szene.
  - **Konflikt nur als Streit verstanden.** Die Figuren werden laut, aber keine will etwas, das die andere verhindert. Frag nach Ziel und Widerstand statt nach Lautstärke.
  - **Zu früher Einstieg.** Die ersten Absätze zeigen Ankunft, Begrüßung und Wetter. Lass die Szene probeweise mit dem ersten Satz beginnen, in dem das Ziel auf Widerstand trifft, und prüf, ob dem Leser etwas fehlt.
  - **Das Ende erklärt.** Nach der Wendung folgt ein Satz, der sagt, was sie bedeutet, etwa „Da wusste sie, dass alles vorbei war“ (Lehrbeispiel). Grimm beendet die Szene mit dem Satz, in dem der Wolf zuschnappt. Streich die Erklärung und lies, ob die Wendung allein trägt.
  - **Wichtiges gerafft, Unwichtiges gedehnt.** Die Wendung steht in einem Nebensatz, der Weg dorthin bekommt eine Seite. Vergleich die Länge der Abschnitte mit der Stelle, an der sich der Wert dreht.

  ## Zusammenfassung

  - Eine Szene dreht einen Wert im Leben einer Figur. Ohne Drehung ist sie eine Zustandsbeschreibung.
  - McKees Test: Wert am Anfang notieren, Wert am Ende notieren, vergleichen.
  - Swain: Szene = Ziel, Konflikt, Rückschlag. Folgeszene = Reaktion, Dilemma, Entscheidung. Die Entscheidung setzt das nächste Ziel.
  - Im Spiel fällt die Entscheidung der Folgeszene oft dem Spieler zu.
  - Spät hinein, früh hinaus: Beginne, wenn der Konflikt läuft, und hör kurz nach der Wendung auf.
  - Konflikt braucht Ziel und Widerstand, keinen Streit.
  - Zusammenfassung passt für Zeit, in der sich nichts dreht. Die Wendung bekommt Erzählzeit.
  - Im Spiel frag zusätzlich, was der Spieler will und ob er in der Wendung handelt oder zusieht.
exercises:
  - id: aendert-sich-etwas
    type: choice
    title: Passiert hier etwas?
    prompt: |
      Vier kurze Szenenbeschreibungen (Lehrbeispiele). In welcher dreht sich ein Wert im Leben einer Figur?
    options:
      - text: Ein Koch sitzt nach Feierabend in der leeren Küche und zählt auf, welche Messer er besitzt.
        correct: false
        why: Am Ende sitzt er da wie am Anfang. Das ist eine Zustandsbeschreibung, auch wenn sie viel über ihn verrät.
      - text: Ein Bewerber will die Stelle, merkt im Gespräch, dass der Chef einen anderen will, und zieht seine Bewerbung selbst zurück.
        correct: true
        why: Am Anfang hat er Aussicht auf die Stelle, am Ende hat er sie aufgegeben, und zwar durch seine eigene Entscheidung. Der Wert hat sich gedreht.
      - text: Zwei Kollegen streiten laut über die Urlaubsplanung und gehen mit derselben Planung auseinander, mit der sie gekommen sind.
        correct: false
        why: Lautstärke ist kein Wertewechsel. Die Planung ist unverändert, und zwischen den beiden hat sich nichts verschoben.
      - text: Ein Zug fährt durch zehn Bahnhöfe, und der Erzähler nennt jeden Ort, an dem er hält.
        correct: false
        why: Das fasst eine Fahrt zusammen. So eine Passage kann zwischen Szenen stehen, dreht aber selbst keinen Wert.
    explanation: |
      McKees Test hilft hier: Notiere den Wert am Anfang und am Ende. Nur beim Bewerber stehen zwei verschiedene Notizen da („Aussicht auf die Stelle“ und „Bewerbung zurückgezogen“). Der Streit der Kollegen ist die typische Verwechslung: Er sieht nach Konflikt aus, ändert aber nichts. Eine Szene braucht Bewegung im Wert, keine Bewegung im Raum oder in der Lautstärke.
    hints:
      - Achte darauf, was am Ende anders ist als am Anfang, nicht darauf, wie viel passiert.
      - Nur in einer Beschreibung trifft die Figur eine Entscheidung, die ihre Lage verändert.
    resources:
      - title: Robert McKee · Do your scenes turn?
        url: https://mckeestory.com/do-your-scenes-turn/

  - id: kette-nach-swain
    type: order
    title: Erst die Szene, dann die Folge
    prompt: |
      Ein Lehrbeispiel in sechs Sätzen: eine Szene und ihre Folgeszene nach Swain. Bring die Sätze in die Reihenfolge Ziel, Konflikt, Rückschlag, Reaktion, Dilemma, Entscheidung.
    lang: prose
    lines: |
      Mara will ihre Kaution heute beim Auszug zurückbekommen.
      Der Vermieter findet an jeder Wand einen neuen Kratzer.
      Er behält die Hälfte der Kaution ein und geht.
      Mara setzt sich auf einen Umzugskarton und starrt auf die Quittung.
      Ein Streit vor Gericht kostet Monate, Schweigen kostet sie das Geld.
      Sie ruft bei der Mieterberatung an und vereinbart einen Termin.
    explanation: |
      Die ersten drei Sätze sind die Szene: Mara will etwas, der Vermieter steht im Weg, sie verliert die Hälfte. Die letzten drei sind die Folgeszene: Sie nimmt den Verlust auf, steht vor zwei schlechten Möglichkeiten und wählt eine. Die Entscheidung setzt das Ziel der nächsten Szene, den Termin bei der Beratung. So hängt jede Szene an der vorigen.
    hints:
      - Der Rückschlag beendet die Szene; danach kommt zuerst das Gefühl, nicht der Plan.
      - Das Dilemma nennt zwei Möglichkeiten, die beide etwas kosten.
    resources:
      - title: Randy Ingermanson · Writing the Perfect Scene
        url: https://www.advancedfictionwriting.com/articles/writing-the-perfect-scene/

  - id: tempo-bei-kafka
    type: choice
    title: Wie schnell vergeht die Zeit?
    prompt: |
      In Kafkas „Vor dem Gesetz“ bittet ein Mann vom Lande um Einlass, und der Türhüter lässt ihn warten. Welches Tempo hat der zweite Satz dieses Ausschnitts nach Genette?
    lang: prose
    code: |
      Der Türhüter gibt ihm einen Schemel und läßt ihn seitwärts von der Tür sich niedersetzen. Dort sitzt er Tage und Jahre. Er macht viele Versuche eingelassen zu werden und ermüdet den Türhüter durch seine Bitten.
    options:
      - text: Zusammenfassung (Raffung)
        correct: true
        why: Jahre vergehen in einem kurzen Satz. Die Erzählzeit ist winzig, die erzählte Zeit lang.
      - text: Szene
        correct: false
        why: In der Szene laufen Erzählzeit und erzählte Zeit ungefähr gleich schnell. Das trifft auf den ersten Satz mit dem Schemel zu, nicht auf den zweiten.
      - text: Ellipse
        correct: false
        why: Eine Ellipse lässt Zeit aus, ohne sie zu erzählen. Kafka erzählt die Jahre in einem raffenden Satz, und die folgenden Sätze berichten, was der Mann in dieser Zeit immer wieder tut.
      - text: Pause
        correct: false
        why: In einer Pause steht die Handlung still, etwa für eine Beschreibung. Hier vergeht so viel Zeit wie nirgends sonst im Text.
    explanation: |
      Der erste Satz ist noch szenisch, eine einzelne Handlung. „Dort sitzt er Tage und Jahre“ rafft dann ein halbes Leben. Die Jahre des Wartens bekommen danach einen raffenden Abschnitt aus wiederkehrenden Handlungen: Verhöre, Bitten, Bestechung, die Flöhe im Pelzkragen, das schwache Augenlicht. Tod und letzte Frage erzählt Kafka wieder szenisch, mit wörtlicher Rede und einzelnen Gesten. Wie bei Hebel wird der Text dort langsam, wo sich der Wert dreht.
    hints:
      - Vergleich, wie lange das Lesen dauert und wie viel Zeit in der Geschichte vergeht.
    resources:
      - title: Franz Kafka · Vor dem Gesetz (Wikisource)
        url: https://de.wikisource.org/wiki/Vor_dem_Gesetz
      - title: Living Handbook of Narratology · Time
        url: https://www-archiv.fdm.uni-hamburg.de/lhn/node/106.html

  - id: antworten-steigern
    type: order
    title: Was der Wolf antwortet
    prompt: |
      Ein Satz und die vier Antworten des Wolfs aus „Rotkäppchen“ (Ausgabe 1857, Schreibung der Quelle) sind gemischt. Bring sie in eine Reihenfolge, die die Steigerung zeigt.
    lang: prose
    lines: |
      Es rief „guten Morgen,“ bekam aber keine Antwort.
      „Daß ich dich besser hören kann.“
      „Daß ich dich besser sehen kann.“
      „Daß ich dich besser packen kann.“
      „Daß ich dich besser fressen kann.“
    alternatives:
      - [1, 3, 2, 4, 5]
    explanation: |
      Die Szene beginnt mit einem Gruß ohne Antwort, schon das ist ein Warnzeichen. Dann steigen die Antworten: Hören und Sehen sind Wahrnehmung, Packen ist eine Drohung, Fressen ist die Tat. Jede Stufe bringt die Szene näher an die Wendung, und der Leser, der den Wolf kennt, sieht sie kommen. Im Text fragt Rotkäppchen erst nach den Ohren, dann nach den Augen; für die Steigerung sind beide gleichwertig, deshalb zählt auch die umgekehrte Reihenfolge.
    hints:
      - Erst nimmt der Wolf wahr, dann greift er zu.
    resources:
      - title: Brüder Grimm · Rothkäppchen (1857, Wikisource)
        url: https://de.wikisource.org/wiki/Rothk%C3%A4ppchen_%281857%29

  - id: begriffe-der-szene
    type: gap
    title: Sechs Wörter für eine Szene
    prompt: |
      Ergänze die Begriffe aus der Lektion.
    lang: prose
    code: |
      Eine Szene dreht einen ⟦Wert⟧ im Leben einer Figur.
      Nach Swain endet eine Szene mit einem ⟦Rückschlag⟧ und die Folgeszene mit einer ⟦Entscheidung⟧.
      Die Zeit, die das Erzählen braucht, heißt ⟦Erzählzeit⟧, die Zeitspanne der Handlung ⟦erzählte Zeit⟧.
      Vergeht viel Handlungszeit in wenig Text, spricht man von ⟦Raffung⟧.
    gaps:
      - label: Was sich dreht
        hint: Ein Gegensatzpaar wie Ansehen oder Spott.
      - label: Ende der Szene
        hint: Die Figur erreicht ihr Ziel nicht. Bei Ingermanson heißt es Disaster.
        accept: ["Disaster", "Katastrophe", "Fehlschlag", "Misserfolg", "Niederlage"]
      - label: Ende der Folgeszene
        hint: Die Wahl, die das nächste Ziel setzt.
        accept: ["Decision", "Wahl"]
      - label: Zeit des Erzählens
        hint: Gemessen etwa in Seiten.
      - label: Zeit der Handlung
        hint: Zwei Wörter, das Gegenstück zum vorigen Begriff.
        accept: ["Handlungszeit"]
      - label: Viel Zeit, wenig Text
        hint: Das deutsche Wort für Zusammenfassung in diesem Sinn.
        accept: ["Zeitraffung", "Zusammenfassung", "Zeitraffer"]
    explanation: |
      Der Wert ist das, was der Test mit zwei Notizen misst. Rückschlag und Entscheidung sind die Gelenke zwischen Szene und Folgeszene: Der eine beendet die Szene, die andere setzt das nächste Ziel. Erzählzeit und erzählte Zeit stammen von Günther Müller; ihr Verhältnis bestimmt, ob ein Abschnitt als Szene oder als Raffung wirkt.
    resources:
      - title: Living Handbook of Narratology · Time
        url: https://www-archiv.fdm.uni-hamburg.de/lhn/node/106.html

  - id: wert-vorher-nachher
    type: practice
    title: Wo steht der Wert am Ende?
    prompt: |
      Wähle eine Szene aus einem Buch, Film oder Spiel, das du gut kennst. Mach McKees Test in Stichpunkten: Welcher Wert steht auf dem Spiel, wo steht er am Anfang, wo am Ende, und bei welchem Ereignis dreht er sich? Höchstens fünf Zeilen.
    lang: prose
    starter: |
      Werk und Szene:
      Wert:
      Am Anfang:
      Am Ende:
      Die Drehung passiert, als:
    checklist:
      - Du nennst den Wert als Gegensatzpaar, nicht als einzelnes Wort.
      - Anfang und Ende stehen an verschiedenen Seiten des Gegensatzpaars, oder du hast notiert, dass sich nichts dreht.
      - Die Drehung hängt an einem Ereignis, das man in der Szene sehen oder hören kann.
      - Du hast höchstens fünf Zeilen geschrieben.
    explanation: |
      Ein Gegensatzpaar zwingt dich, eine Richtung anzugeben. „Vertrauen“ allein sagt nichts darüber, ob es wächst oder zerbricht. Wenn du das Ereignis der Drehung benennen kannst, weißt du auch, wo die Szene ihre Erzählzeit braucht. Findest du keine Drehung, hast du vielleicht eine Zusammenfassung oder eine Pause erwischt. Auch das ist ein Ergebnis.
    resources:
      - title: Robert McKee · Do your scenes turn?
        url: https://mckeestory.com/do-your-scenes-turn/

  - id: szene-ohne-drehung
    type: bug
    title: Eine Szene zu viel
    prompt: |
      Eine Folge von Szenenkarten (Lehrbeispiel), eine Zeile pro Szene. Finde die Szene, in der sich kein Wert dreht.
    lang: prose
    code: |
      Szene 1 – Jonas will den Transporter für Samstag, der Verleih hat nur noch Sonntag frei.
      Szene 2 – Er bittet seine Schwester um Hilfe; sie sagt zu, wenn er ihr Sofa mitnimmt.
      Szene 3 – Die beiden packen Bücher in Kisten und reden über den Wetterbericht.
      Szene 4 – Das Sofa passt nicht durchs Treppenhaus, und die Schwester will absagen.
      Szene 5 – Jonas lässt sein eigenes Bett zurück, damit das Sofa in den Wagen passt.
    lines: [3]
    explanation: |
      Jede andere Zeile endet anders, als sie beginnt: Der Plan verschiebt sich, die Hilfe kommt mit Bedingung, die Hilfe wackelt, Jonas bringt ein Opfer. In Szene 3 ist am Ende alles wie am Anfang. Das ist McKees Nichtereignis. Ob du so eine Szene streichst oder ihr einen Wert gibst, der sich dreht, entscheidest du beim Überarbeiten.
    hints:
      - Mach für jede Zeile den Test mit zwei Notizen.
      - Eine Zeile beschreibt Tätigkeit, aber keine veränderte Lage.
    resources:
      - title: Robert McKee · Do your scenes turn?
        url: https://mckeestory.com/do-your-scenes-turn/

  - id: hebel-erklaert-zu-viel
    type: bug
    title: Ein Satz, den Hebel nicht braucht
    prompt: |
      Das Ende von Hebels „Unverhofftes Wiedersehen“ (Schreibung des Erstdrucks 1811), nach Sinnabschnitten auf Zeilen verteilt. In diesen Ausschnitt ist eine Zeile eingefügt, die nicht von Hebel stammt. Sie erklärt, was die Szene schon zeigt. Finde sie.
    lang: prose
    code: |
      Den andern Tag, als das Grab gerüstet war auf dem Kirchhof und ihn die Bergleute holten,
      schloß sie ein Kästlein auf legte sie ihm das schwarzseidene Halstuch mit rothen Streifen um,
      und begleitete ihn alsdann in ihrem Sonntagsgewand,
      als wenn es ihr Hochzeittag und nicht der Tag seiner Beerdigung wäre.
      Ihre Liebe hatte die fünfzig Jahre überdauert.
      Denn als man ihn auf dem Kirchhof ins Grab legte, sagte sie:
      „Schlafe nun wohl, noch einen Tag oder zehen im kühlen Hochzeitbett,
      und laß dir die Zeit nicht lange werden.
      Ich habe nur noch wenig zu thun, und komme bald, und bald wirds wieder Tag.
    lines: [5]
    explanation: |
      Zeile 5 ist eingefügt. Halstuch, Sonntagsgewand und „Hochzeitbett“ zeigen schon, dass die Braut ihn noch liebt und das Begräbnis als Hochzeit begeht. Der eingefügte Satz sagt dasselbe noch einmal als Behauptung und nimmt dem Leser den Schluss ab, den er selbst ziehen sollte. Beim Fund benennt Hebel das Gefühl durchaus („die Flamme der jugendlichen Liebe“). In diesem Abschnitt erklärt Hebel nichts; er lässt die Braut handeln und sprechen. Das ist der Fehler „Das Ende erklärt“ aus der Lektion.
    hints:
      - Such die Zeile, die ein Gefühl benennt, statt es durch eine Handlung oder einen Gegenstand zu zeigen.
      - Achte auch auf die Schreibung. Eine Zeile klingt nicht nach 1811.
    resources:
      - title: Johann Peter Hebel · Unverhoftes Wiedersehen (Wikisource, Druckseiten 293–294)
        url: https://de.wikisource.org/wiki/Seite:Schatzkaestlein_des_rheinischen_Hausfreundes.djvu/301

  - id: hebel-fuenfzig-jahre
    type: explain
    title: Vom Kaiser zum Müller
    prompt: |
      Das ist das Ende der Raffung in Hebels „Unverhofftes Wiedersehen“ (Schreibung des Erstdrucks 1811). Die Kette beginnt einige Sätze vorher mit dem Erdbeben von Lissabon und dem Siebenjährigen Krieg; der Ausschnitt endet mitten im Satz. Erkläre in zwei bis vier Sätzen, warum die Raffung bei Müllern, Schmieden und Bergleuten endet und was sich mit „Als aber“ am Tempo ändert.
    lang: prose
    code: |
      Der König Gustav von Schweden eroberte russisch Finnland, und die französische Revolution und der lange Krieg fieng an, und der Kaiser Leopold der zweyte gieng auch ins Grab.
      Napoleon eroberte Preußen, und die Engländer bombardirten Koppenhagen, und die Ackerleute säeten und schnitten.
      Der Müller mahlte, und die Schmiede hämmerten, und die Bergleute gruben nach den Metalladern in ihrer unterirrdischen Werkstatt.
      Als aber die Bergleute in Falun im Jahr 1809 etwas vor oder nach Johannis zwischen zwey Schachten eine Oeffnung durchgraben wollten,
    points:
      - Die Raffung erzählt Jahrzehnte in wenigen Sätzen, weil sich für die Braut in dieser Zeit kein Wert dreht.
      - Die Kette wechselt von Weltgeschichte zu Alltagsarbeit und zeigt, dass das Leben gleichförmig weitergeht.
      - Die Bergleute am Ende der Kette führen zurück nach Falun und unter die Erde, wo der Fund geschieht.
      - Mit „Als aber“ und der genauen Zeitangabe wechselt Hebel von der Zusammenfassung zur Szene; der Text wird langsamer, weil sich jetzt ein Wert dreht.
    explanation: |
      Hebel reiht Kriege, Kaiser und Revolutionen mit demselben „und“ aneinander wie Ackerleute, Müller und Schmiede. Für die Braut wiegt das alles gleich wenig, denn ihre Lage ändert sich in fünfzig Jahren nicht. Am Ende der Kette rückt der Blick von der Welt in eine einzige Werkstatt unter der Erde, die Werkstatt der Bergleute. Damit ist der Leser wieder in Falun, ohne dass Hebel einen Ortswechsel ansagen muss. „Als aber“ bricht die gleichförmige Reihe, die Jahreszahl 1809 und der Ort zwischen zwei Schachten machen aus der Zusammenfassung wieder eine Szene. Ab hier dehnt Hebel die Zeit, bis zur Grabrede der Braut.
    hints:
      - Vergleich die Ereignisse am Anfang des Ausschnitts mit denen am Ende.
      - Wo kommt die Erzählung nach den Bergleuten an?
    resources:
      - title: Johann Peter Hebel · Unverhoftes Wiedersehen (Wikisource, Druckseiten 292–293)
        url: https://de.wikisource.org/wiki/Seite:Schatzkaestlein_des_rheinischen_Hausfreundes.djvu/300

  - id: woyzeck-beim-hauptmann
    type: explain
    title: Ja wohl, Herr Hauptmann
    prompt: |
      Ein Ausschnitt aus der Szene „Zimmer“ in Büchners „Woyzeck“, zitiert nach der Ausgabe von Karl Emil Franzos (1879), die den Namen „Wozzeck“ schreibt. Bis hierhin hat Woyzeck auf jede Rede des Hauptmanns kurz geantwortet, dreimal mit „Ja wohl, Herr Hauptmann“. Niemand wird laut. Erkläre in zwei bis vier Sätzen, worin der Konflikt besteht und an welcher Stelle sich die Szene dreht.
    lang: prose
    code: |
      Hauptmann. Ha! ha! ha! Süd-Nord! Ha! ha! ha! O Er ist dumm, ganz abscheulich dumm! (Gerührt.) Wozzeck, Er ist ein guter Mensch, aber (mit Würde), Wozzeck, Er hat keine Moral! Moral, das ist, wenn man moralisch ist, versteht Er? Es ist ein gutes Wort. Er hat ein Kind ohne den Segen der Kirche, wie unser hochwürdiger Herr Garnisonsprediger sagt, „ohne den Segen der Kirche“ - das Wort ist nicht von mir.
      Wozzeck. Herr Hauptmann! Der liebe Gott wird den armen Wurm nicht d’rum ansehen, ob das Amen darüber gesagt ist, eh’ er gemacht wurde. Der Herr sprach: Lasset die Kleinen zu mir kommen!
      Hauptmann. Was sagt Er da? Was ist das für eine kuriose Antwort? Er macht mich ganz confus mit seiner Antwort. Wenn ich sage: Er, so meine ich Ihn, Ihn …
      Wozzeck. Wir arme Leut! Sehen Sie, Herr Hauptmann, Geld, Geld! Wer kein Geld hat! - Da setz’ einmal einer Seinesgleichen auf die moralische Art in die Welt! Man hat auch sein Fleisch und Blut! Unsereins ist doch einmal unselig in dieser und der anderen Welt! Ich glaub’, wenn wir in den Himmel kämen, so müßten wir donnern helfen.
    points:
      - Der Konflikt liegt im Machtgefälle, nicht in einem Streit. Der Hauptmann redet, urteilt und spricht Woyzeck mit „Er“ an.
      - Der Hauptmann führt Woyzeck vor. Er lacht über dessen Zustimmung und spricht ihm die Moral ab.
      - Die Szene dreht sich, als Woyzeck widerspricht, erst mit einem Bibelwort, dann mit „Wir arme Leut!“.
      - Der Hauptmann verliert für einen Moment die Führung im Gespräch („Er macht mich ganz confus“).
      - Woyzeck stellt die Moral des Hauptmanns als Frage des Geldes dar.
    explanation: |
      Der Hauptmann hat die Macht im Raum. Er sitzt, Woyzeck rasiert ihn, und nur einer von beiden darf urteilen. Den Widerstand gegen Woyzeck bildet diese Ordnung selbst: Er soll zustimmen, und er tut es, sogar beim Unsinn mit „Süd-Nord“. Als der Hauptmann sein uneheliches Kind anspricht, antwortet Woyzeck zum ersten Mal mit eigenen Gedanken, zuerst mit einem Bibelwort, dann mit dem Satz über die armen Leute und das Geld. Der Hauptmann ist „confus“ und stammelt über „Er“ und „Ihn“. Der Wert, der sich dreht, ist die Deutungshoheit: Für einen Augenblick bestimmt Woyzeck, was Moral heißt. Am Ende der Szene holt sich der Hauptmann sie zurück, indem er ihn wegschickt.
    hints:
      - Frag nicht, wer lauter ist, sondern wer bestimmen darf, worüber geredet wird.
      - An welcher Stelle antwortet Woyzeck zum ersten Mal mit eigenen Gedanken statt mit einer Formel?
    resources:
      - title: Georg Büchner · Wozzeck (Franzos 1879, Wikisource)
        url: https://de.wikisource.org/wiki/Wozzeck

  - id: szenenkarte-aus-einem-spiel
    type: practice
    title: Eine Karte für eine fremde Szene
    prompt: |
      Wähle ein Spiel, das du gut kennst, und darin einen Abschnitt, an den du dich genau erinnerst: eine Begegnung, einen Auftrag, einen Tag. Füll die Szenenkarte in Stichpunkten aus. Höchstens fünf Zeilen.
    lang: prose
    starter: |
      Spiel und Abschnitt:
      Ziel (wer will was?):
      Widerstand:
      Wendung (was ist am Ende anders?):
      Spielbar oder Zwischensequenz:
    checklist:
      - Das Ziel ist so formuliert, dass man sehen kann, ob die Figur oder der Spieler es erreicht.
      - Der Widerstand nennt eine Person, eine Sache oder einen Umstand.
      - Die Wendung nennt einen Zustand am Ende, der sich vom Anfang unterscheidet.
      - Du hast notiert, ob der Spieler in der Wendung handelt oder zusieht.
      - Du hast höchstens fünf Zeilen geschrieben.
    explanation: |
      Die Karte ist dasselbe Werkzeug, das du in der Werkstatt für deine eigene Szene benutzt, hier an einem Werk, das du von außen betrachtest. Das Feld „Spielbar oder Zwischensequenz“ trennt die Szene im Spiel von der Szene im Buch: Es zeigt dir, ob die Wendung dem Spieler gehört. Wenn Ziel der Figur und Ziel des Spielers in deinem Beispiel auseinanderlaufen, notier beide.
    hints:
      - Ein Abschnitt mit einem klaren Anfang und Ende ist leichter als ein ganzes Kapitel.
    resources:
      - title: Randy Ingermanson · Writing the Perfect Scene
        url: https://www.advancedfictionwriting.com/articles/writing-the-perfect-scene/

  - id: einstieg-und-ausstieg
    type: practice
    title: Später rein, früher raus
    prompt: |
      Nimm eine Szene, die du für dein eigenes Projekt geplant oder schon geschrieben hast. Notiere in Stichpunkten, welcher Wert sich dreht, wo die Szene spätestens beginnen und wo sie frühestens enden könnte und was dabei wegfällt. Schreib keinen Szenentext, nur Stichpunkte. Höchstens fünf Zeilen.
    lang: prose
    starter: |
      Szene (Arbeitstitel):
      Wert vorher → nachher:
      Spätester Einstieg:
      Frühester Ausstieg:
      Was dabei wegfällt:
    checklist:
      - Wert vorher und nachher sind verschieden, oder du hast notiert, dass die Szene keinen Wert dreht.
      - Der späteste Einstieg liegt an einer Stelle, an der das Ziel der Figur schon auf Widerstand trifft.
      - Der früheste Ausstieg liegt nach der Wendung, nicht davor.
      - Du hast notiert, welche Information beim späteren Einstieg wegfällt.
      - Du hast höchstens fünf Zeilen geschrieben.
    explanation: |
      Der späteste Einstieg und der früheste Ausstieg sind Grenzen, keine Pflicht. Du musst die Szene dort nicht beginnen lassen, aber du weißt jetzt, was davor nur Anlauf ist. Was beim späten Einstieg wegfällt, prüfst du später: Braucht der Leser es, und bekommt er es an anderer Stelle? In der [Werkstatt](/narrative/werkstatt-szene) wird aus diesen Stichpunkten eine ausgeschriebene Szene.
