terms:
  - term: Ziel, Motiv, Widerstand (GMC)
    definition: >-
      Werkzeug zur Beschreibung einer Figur nach Debra Dixon, „GMC: Goal, Motivation and Conflict“
      ([Verlagsseite](https://bellebooks.com/categories/p/gmc)). Das Ziel ist, was die Figur erreichen
      will, so konkret, dass man sehen kann, ob sie es schafft; das Motiv sagt, warum gerade jetzt; der
      Widerstand, was sie von außen oder von innen aufhält.
  - term: Einsatz
    definition: >-
      Was eine Figur verliert, wenn sie ihr Ziel verfehlt (englisch stakes). Ohne Einsatz bleibt ein
      Ziel ein Wunsch. Im Spiel muss der Spieler den Einsatz kennen, bevor er entscheidet.
  - term: Funktionsfigur
    definition: >-
      Figur, die nur existiert, um der Handlung oder dem Spieler etwas zu liefern – eine Information,
      einen Gegenstand, eine offene Tür – und kein eigenes Ziel hat. Prüffrage: Hätte sie heute etwas
      vor, wenn der Spieler nicht käme? Meg Jayanth warb auf der GDC 2016 für Nebenfiguren mit eigenem
      Antrieb ([GDC Vault](https://gdcvault.com/play/1023062/Forget-Protagonists-Writing-NPCs-with)).
  - term: Fokalisierung
    definition: >-
      Antwort auf die Frage, wer wahrnimmt und wer was weiß. Gérard Genette unterscheidet
      Nullfokalisierung (der Erzähler sagt mehr, als irgendeine Figur weiß), interne (nur, was eine
      Figur weiß) und externe Fokalisierung (weniger, als die Figur weiß). Die Figur, durch deren
      Wahrnehmung eine Szene läuft, heißt Fokalfigur
      ([Living Handbook of Narratology](https://www-archiv.fdm.uni-hamburg.de/lhn/node/18.html)).
  - term: Erzählstimme
    definition: >-
      Antwort auf die Frage, wer spricht, also wessen Wörter der Leser liest. Getrennt von der
      Fokalisierung: Eine Stimme in der dritten Person kann eng an eine Figur gebunden wahrnehmen, wie
      in Kafkas „Die Verwandlung“, und ein erwachsener Ich-Erzähler kann erzählen, was er als Kind sah.
  - term: Auktoriale Erzählsituation
    definition: >-
      Bei Franz K. Stanzel erzählt ein Erzähler von außerhalb der Geschichte, überblickt sie und
      kommentiert. Entspricht grob Genettes Nullfokalisierung; ein Beispiel ist der erste Satz von
      Kleists „Das Erdbeben in Chili“ mit Ort, Jahr, Katastrophe und Hauptfigur.
  - term: Personale Erzählsituation
    definition: >-
      Bei Stanzel tritt der Erzähler zurück, und der Leser erlebt das Geschehen durch das Bewusstsein
      einer Figur, die Stanzel Reflektor nennt. Entspricht grob der internen Fokalisierung.
  - term: Ich-Erzählung
    definition: >-
      Der Erzähler gehört selbst zur erzählten Welt (bei Stanzel Ich-Erzählsituation). Bei Genette ist
      das eine Frage der Stimme, nicht der Fokalisierung: Das erzählende Ich kann mehr wissen als das
      erlebende Ich zur Zeit der Handlung.
  - term: Innerer Monolog
    definition: >-
      Wiedergabe von Gedanken ohne Erzähler, in der ersten Person und im Präsens, Satz für Satz, wie
      sie der Figur durch den Kopf gehen. Schnitzlers „Leutnant Gustl“ (1900) ist so gebaut; der
      Leser setzt die Lage aus Bruchstücken zusammen.
  - term: Perspektivbruch
    definition: >-
      Unbeabsichtigter Wechsel der Fokalisierung in einer Szene, etwa wenn eine an eine Figur gebundene
      Szene plötzlich weiß, was eine andere denkt (Kopfspringen, englisch head-hopping). Prüffrage an
      jeden Satz: Kann die Fokalfigur das in diesem Moment wahrnehmen oder wissen?
  - term: Szene
    definition: >-
      Erzähleinheit, in der sich ein Wert im Leben einer Figur dreht, etwa Ansehen zu Spott oder
      Sicherheit zu Gefahr; Robert McKee nennt eine Szene ohne Drehung ein Nichtereignis
      ([mckeestory.com](https://mckeestory.com/do-your-scenes-turn/)). Bei Dwight V. Swain folgt sie
      dem Muster Ziel, Konflikt, Rückschlag.
  - term: Folgeszene
    definition: >-
      Bei Dwight V. Swain der Baustein nach einer Szene (englisch sequel): Reaktion auf den Rückschlag,
      Dilemma, Entscheidung. Die Entscheidung setzt das Ziel der nächsten Szene; im Spiel fällt sie
      oft dem Spieler zu ([Randy Ingermanson](https://www.advancedfictionwriting.com/articles/writing-the-perfect-scene/)).
  - term: Wendepunkt
    definition: >-
      Moment, in dem sich die Richtung einer Szene oder Geschichte ändert, durch eine Entdeckung, eine
      Handlung oder eine Entscheidung; in diesem Kurs meist Wendung genannt. In Lessings „Der Rabe und
      der Fuchs“ gibt es zwei: Der Rabe lässt das Fleisch fallen, und das Gift wirkt beim Fuchs.
  - term: Erzählzeit
    definition: >-
      Zeit, die das Erzählen braucht, gemessen in Seiten, Lese- oder Spielzeit. Gegenbegriff zur
      erzählten Zeit (Günther Müller); ihr Verhältnis bestimmt das Tempo
      ([Living Handbook of Narratology](https://www-archiv.fdm.uni-hamburg.de/lhn/node/106.html)).
  - term: Erzählte Zeit
    definition: >-
      Zeit, die in der Handlung vergeht. Hebels „Unverhofftes Wiedersehen“ umfasst über fünfzig Jahre
      auf rund 760 Wörtern.
  - term: Raffung
    definition: >-
      Viel erzählte Zeit auf wenig Text (Zusammenfassung), etwa Kafkas „Dort sitzt er Tage und Jahre.“
      Genette nennt neben der Zusammenfassung die Szene (Text etwa so lang wie die Handlung), die
      Ellipse (Zeit vergeht ohne Text) und die Pause (Text ohne vergehende Zeit).
  - term: Subtext
    definition: >-
      Was eine Replik oder Szene meint, ohne es zu sagen; der Leser erschließt es aus Lage, Wissen und
      Absicht der Figuren. In Fontanes „Effi Briest“ kündigt die Mutter den Heiratsantrag an und
      schweigt über ihre eigene frühere Geschichte mit Innstetten.
  - term: Exposition
    definition: >-
      Informationen, die Leser oder Spieler brauchen, um eine Lage zu verstehen: wer wer ist, was früher
      geschah, was auf dem Spiel steht. Gut verteilt kommt sie im Konflikt, über eine Figur, die sie nicht
      kennt, über den Ort oder erst dann, wenn sie gebraucht wird.
  - term: „As you know, Bob“
    definition: >-
      Fehlerbild der Exposition: Figuren erzählen einander, was beide längst wissen, nur damit der Leser
      es erfährt. Bekanntes auszusprechen ist in Ordnung, wenn der Sprecher damit etwas erreichen will,
      etwa beschämen oder drohen.
  - term: Environmental Storytelling
    definition: >-
      Erzählen über den Raum: Spieler erschließen aus Gegenständen, Spuren, Licht und Anordnung, was
      geschehen ist. Don Carson beschrieb es 2000 mit Lehren aus dem Themenpark-Design, Harvey Smith und
      Matthias Worch 2010 auf der GDC unter der Frage „What Happened Here?“
      ([GDC Vault](https://gdcvault.com/play/1012647/What-Happened-Here-Environmental)). Henry Jenkins
      unterscheidet aufrufende, inszenierende, eingebettete und emergente Räume (evoked, enacted,
      embedded, emergent).
  - term: Dramatische Ironie
    definition: >-
      Leser oder Spieler wissen etwas, das eine Figur nicht weiß, und hören ihre Worte deshalb doppelt.
      Beispiel: Rotkäppchens Fragen an die „Großmutter“, während der Leser weiß, dass der Wolf im Bett
      liegt.
  - term: Rätsel
    definition: >-
      Wissensstand, in dem der Leser weniger weiß als die Erzählung und zu einer bekannten Wirkung die
      Ursache sucht (englisch mystery). Kleists „Die Marquise von O...“ beginnt so: Das Ergebnis steht in
      der Zeitung, offen ist, wie es dazu kam.
  - term: Spannung
    definition: >-
      Wissensstand, in dem der Leser mehr weiß oder ahnt als die Figur und fürchtet, was kommt (englisch
      suspense). Anders als die Überraschung, die nur einen Augenblick wirkt, kann Spannung eine ganze
      Szene tragen.
  - term: Meaningful Play
    definition: >-
      Nach Katie Salen und Eric Zimmerman („Rules of Play“, 2003) bedeutsames Spielen: Die Beziehung
      zwischen Handlung und Ergebnis ist erkennbar (discernable) und in den größeren Zusammenhang des
      Spiels eingebunden (integrated). Für Entscheidungen heißt das: Der Spieler sieht, dass seine Wahl
      etwas bewirkt, und erlebt, dass sie später zählt.
  - term: Telegraphing
    definition: >-
      In der Spielebranche das Ankündigen dessen, was kommt, im Kampf etwa die Ausholbewegung vor dem
      Schlag. In der Erzählung kündigt man den Einsatz an, nicht das Ergebnis; bleibt nach der
      Ankündigung nur eine vernünftige Option, hat sie das Ergebnis verraten.
  - term: Tschechows Gewehr
    definition: >-
      Grundsatz nach Anton Tschechow, dass alles deutlich Eingeführte eine Folge verspricht. In einem
      Brief vom 1. November 1889 schreibt er, man dürfe kein geladenes Gewehr auf die Bühne stellen, wenn
      niemand vorhat, damit zu schießen, und man dürfe nichts versprechen
      ([Brief, russisch](https://chehov-lit.ru/chehov/letters/1888-1889/letter-707.htm)).
  - term: Ludonarrative Dissonanz
    definition: >-
      Widerspruch zwischen dem, was ein Spiel mechanisch belohnt, und dem, was seine Geschichte erzählt.
      Clint Hocking prägte den Begriff 2007 an BioShock: Der spielerische Vertrag („seek power and you
      will progress“) passe nicht zum erzählerischen („help Atlas and you will progress“)
      ([Archiv](https://web.archive.org/web/20240112180255/https://clicknothing.typepad.com/click_nothing/2007/10/ludonarrative-d.html)).
  - term: Dilemma
    definition: >-
      Entscheidung, bei der jede Option etwas kostet, das dem Spieler oder der Figur wichtig ist. Im
      Design stellt man dafür Anreiz und Wert absichtlich gegeneinander und greift den Preis in der
      Geschichte auf; bei der ludonarrativen Dissonanz will das Spiel den Widerspruch nicht oder bearbeitet
      ihn nicht. Bei Swain ist das Dilemma der mittlere Teil der Folgeszene.
  - term: Moralmeter
    definition: >-
      Anzeige, die moralische Entscheidungen als Punkte auf einer Skala zählt, etwa Paragon und Renegade
      in Mass Effect (2007), wo die Punkte besondere Dialogoptionen freischalten. Risiko: Spieler wählen
      nach dem Balken statt nach der Lage.
  - term: Kombinatorische Explosion
    definition: >-
      Jede Entscheidung, die nicht zurückführt, vervielfacht die Zahl der Wege um die Zahl ihrer
      Optionen: Drei Entscheidungen mit je zwei Optionen ergeben acht Wege, zehn schon 1.024. Gegenmittel
      sind Zusammenführen, Zustandsvariablen und Rückbezüge.
  - term: Branch and Bottleneck
    definition: >-
      Muster nach Sam Kabo Ashwell (2015): Die Zweige laufen regelmäßig an Ereignissen zusammen, die in
      jeder Fassung vorkommen (Engpässe), und Zustandsvariablen merken sich die Unterschiede. Geeignet,
      die Entwicklung der Spielerfigur zu zeigen; braucht viele Variablen und eine gewisse Länge
      ([Ashwell](https://heterogenoustasks.wordpress.com/2015/01/26/standard-patterns-in-choice-based-games/)).
  - term: Time Cave
    definition: >-
      Muster nach Ashwell: stark verzweigt, kaum zusammengeführt, viele Enden. Breit statt lang, lädt
      zum Wiederspielen ein; die meisten Spieler sehen nur einen kleinen Teil des Inhalts.
  - term: Gauntlet
    definition: >-
      Muster nach Ashwell: ein fast linearer Strang, dessen Seitenäste schnell enden, durch Scheitern,
      Umkehr oder baldige Rückkehr. Leicht zu planen, fast jeder sieht das Wichtige; Spieler merken aber
      oft, dass ihr Pfad eng ist.
  - term: Foldback
    definition: >-
      Zusammenführen von Zweigen nach einer Entscheidung in einer gemeinsamen Szene. Hält den Aufwand
      klein; damit die Wahl nicht verschwindet, merkt sich eine Zustandsvariable, welcher Zweig gespielt
      wurde, und mindestens ein Rückbezug greift sie später auf.
  - term: Zustandsvariable
    definition: >-
      Gespeicherter Wert, der festhält, was der Spieler getan oder gewählt hat, etwa `$angenommen` in
      Harlowe. Spätere Szenen fragen ihn ab und ändern einen Satz, eine Reaktion oder ein Ende, statt
      dass sich der Weg dauerhaft teilt.
  - term: Quality-Based Narrative
    definition: >-
      Kurz QBN: Struktur aus Storylets, kurzen Abschnitten mit einer Wahl, die über Qualities
      freigeschaltet werden, also Werte für Besitz, Fähigkeiten oder Fortschritt. Der Begriff stammt von
      Failbetter Games (Fallen London); Emily Short beschreibt ihn in
      [„Beyond Branching“](https://emshort.blog/2016/04/12/beyond-branching-quality-based-and-salience-based-narrative-structures/) (2016).
  - term: Salienzbasiertes Erzählen
    definition: >-
      Das System wählt aus einem Pool das Inhaltsstück, das zur aktuellen Lage passt; passen
      mehrere, gewinnt das speziellere. Emily Short nennt das Dialogsystem von Left 4 Dead und Firewatch
      als Beispiele.
  - term: Rückbezug
    definition: >-
      Spätere Stelle, die auf eine frühere Wahl reagiert: eine Zeile, ein Gegenstand, eine veränderte
      Begrüßung. Kostet weniger als ein neuer Zweig und wirkt nur, wenn der Spieler die frühere Wahl
      wiedererkennt.
  - term: Twine
    definition: >-
      Werkzeug für verzweigte, klickbare Geschichten, im Browser oder als Desktop-App; Stand Oktober
      2026 Version 2.12.1 ([twinery.org](https://twinery.org/)). Browser-Twine speichert im lokalen
      Speicher des Browsers; sichern über „Archive“ im Reiter „Library“, weitergeben über „Publish to
      File“ im Reiter „Build“.
  - term: Passage
    definition: >-
      Abschnitt einer Twine-Geschichte mit Text, Links und Code des Story-Formats. `[[Text->Passage]]`
      verbindet Passagen; gibt es das Ziel noch nicht, legt Twine eine leere Passage an. Passagennamen
      unterscheiden Groß- und Kleinschreibung.
  - term: Story-Format
    definition: >-
      Legt in Twine fest, welche Syntax gilt und wie die veröffentlichte Geschichte läuft. Twine 2.12.1
      bringt unter anderem Harlowe 3.3.9, SugarCube 2.37.3, Chapbook 2.3.1 und Snowman mit; das
      Standardformat wirkt nur auf neue Geschichten.
  - term: Harlowe
    definition: >-
      Standard-Story-Format von Twine, in Twine 2.12.1 Version 3.3.9. Makros stehen in runden Klammern,
      etwa `(set: $x to true)` oder `(if: $x)[…](else:)[…]`, der Text dahinter in eckigen Klammern
      (Hook) ([Handbuch](https://twine2.neocities.org/)).
  - term: ink
    definition: >-
      Skriptsprache von inkle für verzweigten Text, mit dem Editor Inky, MIT-Lizenz; Stand Oktober 2026
      ink 1.2.1 und Inky 0.15.2. Wahlen beginnen mit `*`, Abschnitte (Knots) mit `===`, Sprünge (Diverts)
      mit `->` ([Writing with ink](https://github.com/inkle/ink/blob/master/Documentation/WritingWithInk.md)).
  - term: Überarbeiten
    definition: >-
      Arbeit an Aufbau und Inhalt eines Entwurfs: Szenen umstellen, streichen, neu schreiben. Kommt vor
      dem Redigieren und Korrigieren, denn die Reihenfolge geht von groß nach klein.
  - term: Redigieren
    definition: >-
      Arbeit an Satz und Wort: Klarheit, Wiederholungen, Rhythmus, Wortwahl. Kommt nach dem
      Überarbeiten und vor dem Korrigieren.
  - term: Korrigieren
    definition: >-
      Letzter Arbeitsgang am Text: Fehler in Rechtschreibung, Grammatik und Zeichensetzung beseitigen.
      Anders als Überarbeiten (Aufbau, Szenen) und Redigieren (Satz, Wort) ändert es nicht, was der Text
      sagt. In diesem Kurs der einzige Schritt, für den du auf Wunsch KI einsetzen darfst.
  - term: Rückwärtsgliederung
    definition: >-
      Nach dem Entwurf je Szene oder Abschnitt einen Satz notieren: was dort passiert und was sich
      ändert (englisch reverse outline). Zeigt, was der Text tatsächlich tut, etwa doppelte Szenen oder
      Abschnitte ohne Änderung.
  - term: Lautes Denken
    definition: >-
      Testmethode, bei der die Testperson beim Lesen oder Spielen laufend ausspricht, was sie denkt
      (englisch thinking aloud). Die Testleitung schweigt, hilft nicht und erinnert höchstens ans
      Weitersprechen ([Nielsen Norman Group](https://www.nngroup.com/articles/thinking-aloud-the-1-usability-tool/)).
  - term: Critical Response Process
    definition: >-
      Gesprächsverfahren von Liz Lerman (1990) für Rückmeldung auf unfertige Arbeit, in vier Schritten:
      Bedeutungsaussagen, Fragen des Autors, neutrale Fragen, Meinungen nur mit Erlaubnis. Die Kontrolle
      bleibt bei der Person, die das Werk gemacht hat ([lizlerman.com](https://lizlerman.com/critical-response-process/)).
  - term: Playtest
    definition: >-
      Testlauf, bei dem Menschen einen Prototyp spielen, während du beobachtest, was sie verstehen und
      tun; beim Testlesen ist es ein Text. Tracy Fullerton stellt Playtesting in „Game Design Workshop“
      in den Teil über das Entwerfen eines Spiels, nicht ans Ende.
