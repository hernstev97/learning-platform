id: narrative
title: Erzählhandwerk & interaktive Entscheidungen
short: Erzählen
tagline: Figuren, Szenen und Entscheidungen, die Spieler verstehen und spüren.
description: >
  Figurenmotivation, Perspektive, Konflikt und Szenenaufbau, Dialog mit Subtext, Erzählen über
  Umgebung und Folgen, verständliche Entscheidungen, mechanische Anreize und begrenzte Verzweigungen.
  Du lernst an veröffentlichten Texten und Spielen und schreibst selbst: Jede Schreibaufgabe lässt
  die kreative Lösung offen, Mustertexte gibt es nicht. Module mit der Marke „Unterwegs“ gehen auf dem
  Handy, „Am PC“ braucht einen Rechner.
color: "#F4A3FF"
order: 10
outcomes:
  - Du entwickelst **Figuren aus Ziel, Motiv und Widerstand** und erkennst, wo eine Figur nur der Handlung dient.
  - Du wählst **Perspektive und Wissensstand** bewusst und hältst sie in einer Szene durch.
  - Du baust **Szenen mit Ziel, Konflikt und Wendung** und schreibst Dialog, der mehr meint, als er sagt.
  - Du erzählst über **Handlung, Umgebung und Folgen**, statt Informationen zu erklären.
  - "Du machst **Entscheidungen verständlich**: Der Spieler weiß genug, um zu wählen, und erlebt, was daraus folgt."
  - Du stimmst **erzählerische Folgen und mechanische Anreize** aufeinander ab und begrenzt Verzweigungen, ohne Entscheidungen zu entwerten.
  - Du **überarbeitest eigene Texte** mit selbst gewählten Kriterien und beobachtest im Testlauf, was Leser und Spieler verstehen.
tracks:
  - title: Figur, Perspektive, Szene
    description: Was eine Figur will, wer erzählt und wie eine Szene sich dreht. Am Ende schreibst du am PC eine eigene Szene.
    modules: [figuren-motivation, perspektive, szenenaufbau, werkstatt-szene]
  - title: Dialog und Welt
    description: Dialog mit Subtext, nötige Informationen und eine Welt, die über Dinge und Folgen erzählt. Mit Werkstatt am PC.
    modules: [dialog-subtext, umgebung-erzaehlt, werkstatt-dialog]
  - title: Interaktive Entscheidungen
    description: Was Spieler wissen, was Anreize bewirken und wie Verzweigungen beherrschbar bleiben. Am PC baust du eine Entscheidung als spielbaren Prototyp.
    modules: [spielerwissen, folgen-anreize, verzweigungen, werkstatt-entscheidung]
  - title: Überarbeiten und Testen
    description: Eigene Texte mit eigenen Kriterien überarbeiten und beobachten, was Leser und Spieler verstehen.
    modules: [ueberarbeiten, testlesen-playtest]
