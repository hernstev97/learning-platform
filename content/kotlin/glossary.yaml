terms:
- term: Activity
  definition: Android-Komponente für einen Nutzerinteraktionspunkt. Ihre Instanz kann bei Konfigurationsänderungen
    neu entstehen.
- term: Application Context
  definition: Context mit Prozess- beziehungsweise Application-Lebensdauer. Er ersetzt keinen benötigten UI-Kontext
    für jede Operation.
- term: Backstack
  definition: Verlauf von Navigationseinträgen. Entfernen eines Eintrags kann auch die Lebensdauer seines ViewModels
    beenden.
- term: Callback
  definition: Übergebene Funktion, die ein Ereignis oder Ergebnis meldet. Compose-Komponenten melden damit Änderungswünsche
    nach oben.
- term: Cancellation
  definition: Kooperativer Abbruch einer Coroutine. Suspend-Funktionen und explizite Prüfungen machen den Abbruch
    wirksam.
- term: Cold Flow
  definition: Flow, dessen Produzent pro Sammlung neu ausgeführt wird. Mehrere Collector können daher Arbeit mehrfach
    starten.
- term: Collector
  definition: Verbraucher eines Flow. Er empfängt dessen emittierte Werte innerhalb seiner Coroutine.
- term: Composable
  definition: Mit `@Composable` markierte Funktion, die an Compose-Verarbeitung teilnimmt und beispielsweise UI
    beschreibt.
- term: Composition
  definition: Von Compose verwaltete Struktur der aufgerufenen Composables und ihres zugehörigen Zustands.
- term: Coroutine
  definition: Kooperativ unterbrechbare Arbeitseinheit mit Kontext und Lebensdauer. Sie ist kein eigener Betriebssystem-Thread.
- term: CoroutineScope
  definition: Besitzer eines Coroutine-Kontexts und der darin gestarteten Arbeit. Sein Job strukturiert die Lebensdauer.
- term: Data Class
  definition: Kotlin-Klasse mit erzeugten datenbezogenen Methoden wie `copy`, `equals` und `componentN`.
- term: DataStore
  definition: Jetpack-Speicher für Einstellungen oder typisierte Konfigurationsdaten. Komplexe relationale Abfragen
    gehören eher zu Room.
- term: Deep Link
  definition: Externer oder interner Verweis auf ein konkretes App-Ziel. Plattformregistrierung und fachliche Validierung
    bleiben erforderlich.
- term: Delegation
  definition: Weitergabe einer Implementierungsaufgabe an ein anderes Objekt, etwa Klassen- oder Property-Delegation
    mit `by`.
- term: Dependency Injection
  definition: Bereitstellen von Abhängigkeiten von außen. Das macht ihre Herkunft und Austauschbarkeit sichtbar.
- term: Dispatcher
  definition: Teil des Coroutine-Kontexts, der die Ausführung auf Threads oder Threadpools steuert.
- term: DisposableEffect
  definition: Compose-Effekt für eine Registrierung mit zugehörigem `onDispose`-Aufräumen.
- term: DTO
  definition: Data Transfer Object an einer Transportgrenze. Es muss nicht identisch mit Datenbank- oder UI-Modellen
    sein.
- term: Elvis-Operator
  definition: '`?:` liefert eine Alternative, wenn die linke Seite null ist. Die Alternative wird nur dann ausgewertet.'
- term: Extension Function
  definition: Funktion mit Empfängertyp außerhalb dessen Klassendefinition. Ihre Auflösung richtet sich nach dem
    statischen Typ.
- term: Flow
  definition: Asynchroner Strom von Werten. Verhalten und Lebensdauer hängen davon ab, ob er kalt oder geteilt ist.
- term: Hilt
  definition: Android-Bibliothek für Dependency Injection. Komponenten und Scopes organisieren die Lebensdauer bereitgestellter
    Abhängigkeiten.
- term: Idempotenz
  definition: Eigenschaft einer Operation, deren Wiederholung die fachliche Wirkung nicht unerwünscht vervielfacht.
- term: Job
  definition: Coroutine-Kontextelement für Lebensdauer, Abschluss und Cancellation. `launch` liefert einen Job zurück.
- term: LaunchedEffect
  definition: Compose-Effekt, der eine Coroutine mit der Lebensdauer seiner Composition-Position und Keys verwaltet.
- term: Lifecycle
  definition: Zustandsmodell einer Android-Komponente. Lifecyclebewusste Sammlung passt aktive Arbeit an deren Sichtbarkeit
    beziehungsweise Aktivität an.
- term: Modifier
  definition: Verkettbare Beschreibung von Layout-, Darstellungs- und Interaktionsverhalten. Die Reihenfolge beeinflusst
    das Ergebnis.
- term: MVVM
  definition: Trennung von Model, View und ViewModel. Konkrete Datenflüsse und Zuständigkeiten müssen zusätzlich
    festgelegt werden.
- term: Navigation Route
  definition: Vertrag für ein Ziel mit kleinen benötigten Argumenten, beispielsweise einer Datensatz-ID.
- term: Null-Safety
  definition: Typsystemunterstützung, die nullable und nicht nullable Werte unterscheidet. Unsichere Behauptungen
    wie `!!` bleiben möglich.
- term: Recomposition
  definition: Erneute Ausführung betroffener Composables nach relevanten Änderungen. Sie ist nicht gleichbedeutend
    mit komplettem Neuzeichnen.
- term: remember
  definition: Bewahrt einen Wert an einer Position der Composition. Es persistiert ihn nicht dauerhaft.
- term: rememberSaveable
  definition: Verknüpft kleinen UI-Zustand mit dem Saved-State-Mechanismus. Es ersetzt keine Datenbank.
- term: Repository
  definition: Fachliche Schnittstelle zu Daten und ihren Änderungen. Es koordiniert Datenquellen und einen definierten
    Konsistenzvertrag.
- term: Room
  definition: Jetpack-Abstraktion über SQLite mit Entities, DAOs und geprüften Abfragen.
- term: SavedStateHandle
  definition: Kleiner Schlüssel-Wert-Speicher zur Wiederherstellung zustandsrelevanter Daten eines ViewModels.
- term: Sealed Type
  definition: Typ mit kontrollierter direkter Unterklassenmenge. Er eignet sich für modellierte Alternativen und
    vollständige Fallbehandlung.
- term: SharedFlow
  definition: Heißer, konfigurierbarer Broadcast-Flow. Replay, Puffer und Collector bestimmen, welche Werte wann
    ankommen.
- term: Single Source of Truth
  definition: Eindeutig festgelegte maßgebliche Quelle für einen Datentyp. Andere Darstellungen werden daraus abgeleitet.
- term: Smart Cast
  definition: Automatische Typverengung nach einer Prüfung, wenn der Compiler die Stabilität der Annahme beweisen
    kann.
- term: State Hoisting
  definition: Verschieben von Zustand zum benötigten gemeinsamen Besitzer und Weitergabe als Wert plus Ereignis-Callbacks.
- term: StateFlow
  definition: Heißer Flow mit aktuellem Wert. Er eignet sich für beobachtbaren Zustand und fasst gleiche Zustände
    zusammen.
- term: Structured Concurrency
  definition: Hierarchische Bindung nebenläufiger Arbeit an einen Scope. Abschluss und Abbruch werden dadurch nachvollziehbar.
- term: suspend
  definition: Markierung einer Funktion, die eine Coroutine unterbrechen kann. Sie garantiert keinen Threadwechsel.
- term: UDF
  definition: 'Unidirectional Data Flow: Zustand fließt zur UI, Ereignisse zum zuständigen Besitzer.'
- term: ViewModel
  definition: Screen-State-Holder mit Owner-bezogener Lebensdauer. Er kann Konfigurationsänderungen, aber allein
    keinen Prozessverlust überleben.
- term: WorkManager
  definition: Jetpack-Werkzeug für persistente, verschiebbare Hintergrundarbeit unter Constraints. Es garantiert
    keine exakten Uhrzeiten.
