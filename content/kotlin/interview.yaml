cards:
- id: val-var
  module: kotlin-grundlagen
  level: 1
  tags:
  - sprache
  q: Was garantiert `val`?
  a: |
    `val` verhindert eine erneute Zuweisung der Referenz. Eine darüber erreichbare MutableList kann sich trotzdem ändern. Für unveränderlichen Zustand brauche ich zusätzlich passende Datenstrukturen und darf keine veränderbaren Aliase offenlegen.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/home.html).
- id: null-safety
  module: null-safety
  level: 1
  tags:
  - sprache
  q: Was unterscheidet `String` und `String?`?
  a: |
    `String?` erlaubt zusätzlich null und verlangt eine passende Behandlung. `?.` führt einen Zugriff nur bei vorhandenem Wert aus; `?:` bietet eine Alternative. `!!` überprüft diese Annahme nicht vorab, sondern kann zur Laufzeit scheitern.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/home.html).
- id: smart-cast
  module: null-safety
  level: 1
  tags:
  - sprache
  q: Wann funktioniert ein Smart Cast?
  a: |
    Nach einer passenden Typ- oder Nullprüfung kann der Compiler einen stabilen Wert enger typisieren. Ein veränderbares Feld mit möglicher zwischenzeitlicher Änderung erfüllt diese Voraussetzung nicht immer. Eine lokale unveränderliche Bindung kann den Vertrag klar machen.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/home.html).
- id: data-class
  module: klassen-objekte
  level: 1
  tags:
  - sprache
  q: Was erzeugt eine Data Class?
  a: |
    Kotlin erzeugt unter anderem equals, hashCode, toString, componentN und copy aus den Properties des primären Konstruktors. `copy` ist flach. Eine enthaltene MutableList wird dadurch nicht automatisch unabhängig dupliziert.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/home.html).
- id: sealed
  module: klassen-objekte
  level: 1
  tags:
  - sprache
  q: Wann verwendest du ein Sealed Interface?
  a: |
    Es modelliert eine kontrollierte Menge von Alternativen, etwa Loading, Ready und Error. Ein vollständiges when kann die Fälle absichern. Für frei erweiterbare Plugins wäre ein normales Interface passender.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/home.html).
- id: equality
  module: klassen-objekte
  level: 1
  tags:
  - sprache
  q: Was ist der Unterschied zwischen `==` und `===`?
  a: |
    `==` prüft strukturelle Gleichheit über equals, `===` Referenzidentität. Zwei verschiedene Data-Class-Instanzen können strukturell gleich sein. Referenzidentität ist deshalb kein allgemeiner Vergleich fachlicher Inhalte.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/home.html).
- id: extensions
  module: funktionen-lambdas
  level: 2
  tags:
  - sprache
  q: Ersetzen Extension Functions dynamische Methoden?
  a: |
    Nein, Extensions werden anhand des statischen Empfängertyps aufgelöst. Sie erweitern die aufrufbare Syntax, verändern aber die Klasse nicht. Ein echtes Mitglied mit passender Signatur hat Vorrang.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/home.html).
- id: scope-functions
  module: funktionen-lambdas
  level: 1
  tags:
  - sprache
  q: Wie wählst du zwischen let und apply?
  a: |
    `let` gibt das Lambda-Ergebnis zurück und verwendet normalerweise `it`. `apply` gibt den Empfänger zurück und verwendet `this`. Ich wähle nach dem gewünschten Ergebnis und vermeide verschachtelte Scopes, die den Bezug unklar machen.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/home.html).
- id: variance
  module: generics-delegation
  level: 2
  tags:
  - sprache
  q: Was bedeuten out und in bei Generics?
  a: |
    `out` erlaubt kovariante Verwendung, passend für Produzenten. `in` erlaubt kontravariante Verwendung, passend für Konsumenten. Der Compiler begrenzt die erlaubten Positionen des Typparameters, damit diese Umwandlungen sicher bleiben.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/home.html).
- id: sequence
  module: collections
  level: 2
  tags:
  - sprache
  q: Wann ist eine Sequence sinnvoll?
  a: |
    Sie verarbeitet Zwischenschritte lazy und kann bei langen Pipelines oder frühem Abbruch Zwischenlisten vermeiden. Für kleine Listen kann der zusätzliche Iteratoraufwand unvorteilhaft sein. Ich messe einen relevanten Fall statt Sequence pauschal schneller zu nennen.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/home.html).
- id: suspend
  module: coroutines
  level: 1
  tags:
  - coroutines
  q: Bedeutet suspend automatisch Hintergrundthread?
  a: |
    Nein. Suspend erlaubt einer Funktion, ihre Coroutine kooperativ zu unterbrechen. Auf welchem Thread sie läuft, bestimmt der Kontext; blockierende Arbeit muss ausdrücklich an eine geeignete Grenze wie Dispatchers.IO verlagert werden.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/coroutines-guide.html).
- id: launch-async
  module: coroutines
  level: 2
  tags:
  - coroutines
  q: Wann launch, wann async?
  a: |
    `launch` liefert einen Job für Arbeit ohne Ergebniswert. `async` liefert Deferred, dessen Wert mit await abgeholt wird. Beide brauchen einen passenden Scope; ein unbeobachtetes Deferred ist keine sinnvolle Fehlerstrategie.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/coroutines-guide.html).
- id: structured
  module: coroutines
  level: 2
  tags:
  - coroutines
  q: Was bringt Structured Concurrency?
  a: |
    Kind-Coroutines hängen an einer klaren Lebensdauer und können gemeinsam beendet werden. Der Besitzer wartet auf seine Kinder. Dadurch verschwinden Hintergrundarbeiten nicht unbeobachtet aus dem Zuständigkeitsbereich.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/coroutines-guide.html).
- id: cancellation
  module: coroutines
  level: 2
  tags:
  - coroutines
  q: Warum darfst du CancellationException nicht verschlucken?
  a: |
    Sie signalisiert kooperativen Abbruch. Ein pauschales catch, das daraus einen normalen Fehler macht und weiterarbeitet, bricht die Lebensdauervereinbarung. Ich werfe sie weiter und behandle fachliche Fehler getrennt.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/coroutines-guide.html).
- id: supervision
  module: coroutines
  level: 3
  tags:
  - coroutines
  q: Was leistet SupervisorJob nicht?
  a: |
    Er verhindert, dass ein fehlgeschlagenes Kind automatisch seine Geschwister mit abbricht. Er macht den Fehler nicht unsichtbar oder automatisch behandelt. Die übergeordnete Cancellation gilt weiterhin für die Kinder.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/coroutines-guide.html).
- id: dispatcher
  module: coroutines
  level: 2
  tags:
  - coroutines
  q: Die App ruckelt beim Dateilesen. Was prüfst du?
  a: |
    Ich messe den Main-Thread und suche blockierende I/O-Arbeit. Eine suspend-Markierung allein verschiebt sie nicht. Die Datenquelle muss main-safe arbeiten; erst danach prüfe ich zusätzliche Ursachen wie große Transformationen oder häufige UI-Arbeit.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/coroutines-guide.html).
- id: cold-flow
  module: flow
  level: 2
  tags:
  - flow
  q: Was bedeutet ein kalter Flow?
  a: |
    Der Flow-Builder beginnt seine Arbeit pro Collector. Zwei Collector können dadurch zwei Requests auslösen. Soll ein Produzent gemeinsam genutzt werden, brauche ich eine passende Sharing-Strategie mit klarer Lebensdauer.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/flow.html).
- id: state-shared
  module: flow
  level: 2
  tags:
  - flow
  q: Wann StateFlow, wann SharedFlow?
  a: |
    StateFlow hält einen aktuellen Wert und eignet sich für beobachtbaren Zustand. SharedFlow ist allgemeiner konfigurierbarer Broadcast. Beide garantieren nicht automatisch die fachlich einmalige Verarbeitung eines Ereignisses.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/flow.html).
- id: stateflow-update
  module: flow
  level: 2
  tags:
  - flow
  q: Warum MutableStateFlow.update statt read-modify-write?
  a: |
    `update` führt die Zustandsänderung atomar relativ zu anderen Updates aus. Eine getrennte Lese- und Schreiboperation kann Änderungen verlieren. Die Lambda sollte keine Nebenwirkungen enthalten, weil sie bei Konkurrenz erneut ausgeführt werden kann.

    [Offizielle Dokumentation](https://kotlinlang.org/docs/flow.html).
- id: collect-lifecycle
  module: flow
  level: 2
  tags:
  - compose
  q: Warum collectAsStateWithLifecycle auf Android?
  a: |
    Es verbindet Flow mit beobachtbarem Compose-State und sammelt lifecyclebewusst. Unsichtbare UI braucht meist keine aktive Sammlung. Ob ein heißer Produzent upstream weiterläuft, entscheidet zusätzlich dessen eigener Scope und Sharing-Vertrag.

    [Offizielle Dokumentation](https://developer.android.com/develop/ui/compose/state).
- id: activity-process
  module: android-grundlagen
  level: 1
  tags:
  - android
  q: Unterschied zwischen Activity-Neuerzeugung und Prozessverlust?
  a: |
    Bei einer Konfigurationsänderung kann ein ViewModel seines Owners erhalten bleiben. Bei Prozessverlust entsteht es neu. Kleine Wiederherstellungsdaten brauchen Saved State; dauerhaft relevante Daten brauchen echte Persistenz.

    [Offizielle Dokumentation](https://developer.android.com/guide/components/activities/activity-lifecycle).
- id: rotation-debug
  module: android-grundlagen
  level: 2
  tags:
  - android
  q: Die Eingabe verschwindet beim Drehen. Dein Vorgehen?
  a: |
    Ich reproduziere den Verlust und identifiziere den Besitzer. Lokaler remember-State reicht für Activity-Neuerzeugung nicht. Je nach fachlicher Lebensdauer verwende ich rememberSaveable, SavedStateHandle oder Datenbank und prüfe danach gezielt die Wiederherstellung.

    [Offizielle Dokumentation](https://developer.android.com/guide/components/activities/activity-lifecycle).
- id: context-leak
  module: android-grundlagen
  level: 2
  tags:
  - android
  q: Warum ist eine Activity-Referenz im langlebigen Objekt riskant?
  a: |
    Das Objekt kann die alte Activity über deren benötigte Lebensdauer hinaus festhalten. Dadurch bleiben UI und Ressourcen erreichbar. Ich verwende die kleinste passende Abhängigkeit und Application-Context nur für Aufgaben, die dessen Lebensdauer wirklich benötigen.

    [Offizielle Dokumentation](https://developer.android.com/guide/components/activities/activity-lifecycle).
- id: recomposition
  module: compose-grundlagen
  level: 1
  tags:
  - compose
  q: Was ist Recomposition?
  a: |
    Compose führt betroffene Composables erneut aus, wenn relevanter beobachtbarer Zustand wechselt. Nicht jede Recomposition zeichnet den ganzen Bildschirm neu. Der Körper muss deshalb ohne unkontrollierte Nebenwirkungen bleiben.

    [Offizielle Dokumentation](https://developer.android.com/develop/ui/compose/state).
- id: remember-saveable
  module: compose-state
  level: 1
  tags:
  - compose
  q: remember oder rememberSaveable?
  a: |
    remember erhält ein Objekt in der Composition. rememberSaveable kann kleine unterstützte Werte über den Saved-State-Mechanismus wiederherstellen. Keines ist eine Datenbank oder eine Garantie nach bewusstem Entfernen der Aufgabe.

    [Offizielle Dokumentation](https://developer.android.com/develop/ui/compose/state).
- id: state-hoisting
  module: compose-state
  level: 1
  tags:
  - compose
  q: Was bedeutet State Hoisting?
  a: |
    Ich verschiebe gemeinsam benötigten Zustand zum passenden gemeinsamen Besitzer. Kinder bekommen Werte und Ereignis-Callbacks. Es gibt dadurch eine Datenquelle, ohne jede UI-Kleinigkeit zwingend ins ViewModel zu verschieben.

    [Offizielle Dokumentation](https://developer.android.com/develop/ui/compose/state).
- id: mutable-list
  module: compose-state
  level: 2
  tags:
  - compose
  q: Die Liste ändert sich, die UI nicht. Mögliche Ursache?
  a: |
    Eine normale MutableList in remember meldet ihre internen Änderungen nicht an Compose. Ich ersetze den beobachteten Listenwert oder verwende eine Snapshot-State-Collection. Danach prüfe ich, ob die UI den tatsächlich geänderten State liest.

    [Offizielle Dokumentation](https://developer.android.com/develop/ui/compose/state).
- id: effect-key
  module: compose-state
  level: 2
  tags:
  - compose
  q: Wie wählst du LaunchedEffect-Keys?
  a: |
    Der Key beschreibt die Identität der laufenden Operation, etwa eine Datensatz-ID. Bei Änderung wird die alte Coroutine abgebrochen. Für aktualisierte Callbacks ohne Neustart kann rememberUpdatedState geeignet sein.

    [Offizielle Dokumentation](https://developer.android.com/develop/ui/compose/state).
- id: disposable-effect
  module: compose-state
  level: 2
  tags:
  - compose
  q: Wann DisposableEffect statt LaunchedEffect?
  a: |
    DisposableEffect passt zu Registrierungen mit symmetrischem Aufräumen, etwa einem Listener. onDispose entfernt die Registrierung. LaunchedEffect verwaltet dagegen eine Coroutine und deren Abbruch.

    [Offizielle Dokumentation](https://developer.android.com/develop/ui/compose/state).
- id: list-keys
  module: compose-grundlagen
  level: 2
  tags:
  - compose
  q: Warum stabile Keys in LazyColumn?
  a: |
    Keys binden lokalen Elementzustand an die Identität statt nur die Position. Nach Einfügen oder Umsortieren bleibt Zustand beim richtigen Datensatz. Eindeutigkeit und Wiederherstellbarkeit des Key-Typs müssen trotzdem passen.

    [Offizielle Dokumentation](https://developer.android.com/develop/ui/compose/state).
- id: route-id
  module: navigation
  level: 2
  tags:
  - navigation
  q: Warum nur eine ID zum Detail navigieren?
  a: |
    Die ID identifiziert den Datensatz, aktuelle Daten kommen aus dem Repository. Ein großes mitgeschicktes Objekt kann veralten. Typsichere Routen ersetzen dabei weder Existenz- noch Berechtigungsprüfung.

    [Offizielle Dokumentation](https://developer.android.com/guide/navigation/design/type-safety).
- id: single-top
  module: navigation
  level: 2
  tags:
  - navigation
  q: Was garantiert launchSingleTop?
  a: |
    Es verhindert eine zusätzliche Kopie eines bereits oben liegenden Ziels. Es macht nicht jedes Ziel im gesamten Backstack einzigartig. Den gewünschten Verlauf und den Rückweg prüfe ich separat.

    [Offizielle Dokumentation](https://developer.android.com/guide/navigation/design/type-safety).
- id: udf
  module: architektur
  level: 1
  tags:
  - architektur
  q: Erkläre Unidirectional Data Flow.
  a: |
    Zustand fließt zur UI, Ereignisse zum Besitzer. Der Besitzer verändert die Datenquelle und daraus entsteht neuer Zustand. Das macht sichtbar, welche Operation zu welcher Darstellung geführt hat.

    [Offizielle Dokumentation](https://developer.android.com/topic/architecture).
- id: repository
  module: architektur
  level: 2
  tags:
  - architektur
  q: Was sollte ein Repository leisten?
  a: |
    Es bietet eine fachlich brauchbare Datenschnittstelle und koordiniert Datenquellen. UI-Code muss damit nicht entscheiden, ob ein Wert aus Room oder Netzwerk kommt. Eine Repository-Klasse allein garantiert jedoch keine konsistente Single Source of Truth.

    [Offizielle Dokumentation](https://developer.android.com/topic/architecture).
- id: di-hilt
  module: architektur
  level: 2
  tags:
  - architektur
  q: Was löst Dependency Injection?
  a: |
    Abhängigkeiten werden von außen bereitgestellt statt versteckt erzeugt. Tests können passende Fakes einsetzen. Hilt automatisiert die Verdrahtung; Scopes müssen trotzdem zur fachlichen Lebensdauer passen.

    [Offizielle Dokumentation](https://developer.android.com/topic/architecture).
- id: room-transaction
  module: daten-netzwerk
  level: 2
  tags:
  - daten
  q: Wofür brauchst du eine Room-Transaktion?
  a: |
    Mehrere zusammengehörige Datenbankoperationen werden atomar ausgeführt. Ein Fehler verhindert einen halbfertigen lokalen Zustand. Ein externer HTTP-Aufruf wird dadurch nicht Teil derselben atomaren Transaktion.

    [Offizielle Dokumentation](https://developer.android.com/topic/architecture/data-layer).
- id: datastore-room
  module: daten-netzwerk
  level: 1
  tags:
  - daten
  q: Wann DataStore, wann Room?
  a: |
    DataStore passt zu kleinen Einstellungs- oder typisierten Konfigurationsdaten. Room passt zu strukturierten Daten mit Abfragen, Beziehungen und Änderungen einzelner Datensätze. Die Wahl richtet sich nach Zugriffsmuster und Modell, nicht nur Dateigröße.

    [Offizielle Dokumentation](https://developer.android.com/topic/architecture/data-layer).
- id: workmanager
  module: daten-netzwerk
  level: 2
  tags:
  - daten
  q: Garantiert WorkManager einen exakten Ausführungszeitpunkt?
  a: |
    Nein. Es plant persistente, verschiebbare Hintergrundarbeit unter Plattformbedingungen und Constraints. Für Synchronisation muss ich Verzögerung und Wiederholung einplanen; exakte Erinnerungszeit ist ein anderer Anwendungsfall.

    [Offizielle Dokumentation](https://developer.android.com/topic/architecture/data-layer).
- id: offline-sync
  module: daten-netzwerk
  level: 3
  tags:
  - daten
  q: Wie verhinderst du doppelte Aktionen bei einem Retry?
  a: |
    Ich gebe einer fachlichen Operation eine stabile Identität und mache Wiederholung idempotent, soweit der Serververtrag es erlaubt. Lokaler Status und Fehler bleiben nachvollziehbar. Ein zufälliger neuer Request-Identifier pro Retry erfüllt diesen Zweck nicht.

    [Offizielle Dokumentation](https://developer.android.com/topic/architecture/data-layer).
- id: http-errors
  module: daten-netzwerk
  level: 2
  tags:
  - daten
  q: Wie modellierst du einen fehlgeschlagenen Netzwerkaufruf?
  a: |
    Ich unterscheide Transportfehler, HTTP-Fehler und ungültige Nutzdaten soweit daraus andere Entscheidungen folgen. Die UI bekommt verständlichen Zustand, keine rohen Geheimnisse oder Stacktraces. Wiederholung ist nur für geeignete Fehler und Operationen sinnvoll.

    [Offizielle Dokumentation](https://developer.android.com/topic/architecture/data-layer).
- id: viewmodel-tests
  module: testing
  level: 2
  tags:
  - testing
  q: Was prüfst du an einem ViewModel?
  a: |
    Ich prüfe Ereignis, resultierende Zustände und Interaktion mit einem kontrollierten Repository. Coroutine-Zeit und Dispatcher werden steuerbar. Ein Test, der nur den Konstruktor aufruft, belegt weder Fehler- noch Ladeverhalten.

    [Offizielle Dokumentation](https://developer.android.com/training/testing).
- id: compose-tests
  module: testing
  level: 2
  tags:
  - testing
  q: Warum über Semantik statt Pixelposition testen?
  a: |
    Semantik beschreibt die Bedeutung und Bedienbarkeit der UI. Ein Test kann damit einen benannten Button bedienen und Zustand prüfen. Visuelle Fehler brauchen ergänzende Sichtprüfung; semantische Tests ersetzen sie nicht.

    [Offizielle Dokumentation](https://developer.android.com/training/testing).
- id: signing
  module: gradle-release
  level: 2
  tags:
  - release
  q: Was unterscheidet Debug- und Release-Signierung?
  a: |
    Eine signierte Release-Artefaktkette ist Teil der Veröffentlichung und Updates. Debug-Schlüssel dienen der Entwicklung. Schlüsselmaterial und Kennwörter gehören außerhalb des Repositorys in geeignete Secret-Verwaltung.

    [Offizielle Dokumentation](https://developer.android.com/studio/publish/app-signing).
- id: security-review
  level: 2
  tags:
  - release
  q: Welche Sicherheitsfragen stellst du vor einem Release?
  a: |
    Ich prüfe Geheimnisse in Code und Logs, notwendige Berechtigungen, exportierte Komponenten und fachliche Zugriffsprüfungen. Ein versteckter Button ist keine Zugriffskontrolle. Ich begründe jede externe Angriffsfläche am konkreten App-Ablauf.

    [Offizielle Dokumentation](https://developer.android.com/studio/publish/app-signing).
- id: review-feedback
  level: 2
  tags:
  - praxis
  q: Ein Review widerspricht deiner Architektur. Wie reagierst du?
  a: |
    Ich lasse mir das konkrete Risiko und ein Szenario erklären. Dann vergleiche ich die Optionen an Testbarkeit, Lebensdauer und Änderungsbedarf. Ich dokumentiere die gemeinsame Entscheidung und behaupte keine Gewissheit, die noch kein Test belegt.

    [Offizielle Dokumentation](https://developer.android.com/topic/architecture/recommendations).
- id: bug-communication
  level: 2
  tags:
  - praxis
  q: Wie berichtest du einen schwer reproduzierbaren Fehler?
  a: |
    Ich trenne Beobachtung, Vermutung und getestete Ursache. Ich liefere Gerät, Schritte, relevante Logs ohne Geheimnisse und die nächste überprüfbare Hypothese. Nach der Reparatur ergänze ich einen Regressionstest und benenne verbleibende Grenzen.

    [Offizielle Dokumentation](https://developer.android.com/topic/architecture/recommendations).
- id: ai-ownership
  level: 2
  tags:
  - praxis
  q: Wie präsentierst du mit KI entstandenen Code?
  a: |
    Ich sage offen, welche Teile unterstützt entstanden sind und welche Entscheidungen ich selbst überprüft habe. Ich kann den Ablauf erklären, Varianten abwägen und Fehler beheben. Ein grüner Build allein belegt dieses Verständnis nicht.

    [Offizielle Dokumentation](https://developer.android.com/topic/architecture/recommendations).
- id: tradeoff-deadline
  level: 3
  tags:
  - praxis
  q: Wie schneidest du unter Zeitdruck einen Release?
  a: |
    Ich sichere einen vollständigen wichtigsten Nutzerpfad inklusive Fehlerzuständen und Tests. Unfertige Zusatzfunktionen werden klar außerhalb der Abnahme gehalten. Die Entscheidung erkläre ich mit Nutzbarkeit und überprüfbaren Risiken, nicht mit einer bloßen Feature-Anzahl.

    [Offizielle Dokumentation](https://developer.android.com/topic/architecture/recommendations).
