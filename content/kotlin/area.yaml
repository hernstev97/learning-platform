id: kotlin
title: Kotlin & Android
short: Kotlin
tagline: Moderne Android-Apps – von der ersten Zeile bis in den Play Store.
description: >
  Kotlin als Sprache, Coroutines und Flow, Jetpack Compose, Architektur mit
  ViewModel und Repository, Room, Netzwerk, Tests und Release. Dazu der
  Praxis-Track mit 100 Aufgaben aus dem echten Code von Bear.
color: "#A98BFF"
order: 1
outcomes:
  - Du schreibst idiomatisches Kotlin mit Null-Sicherheit, Datenklassen, Sealed Types und Collections-Operationen.
  - Du baust Oberflächen mit **Jetpack Compose** und verstehst Zustand, Recomposition und Side Effects.
  - Du strukturierst Apps nach **MVVM** und Unidirectional Data Flow mit ViewModel, StateFlow und Repository.
  - Du speicherst Daten mit Room und DataStore und sprichst APIs mit Retrofit oder Ktor an.
  - Du testest ViewModels, Coroutines und Compose-UI und veröffentlichst signierte Releases.
  - Du kannst typische Android-Interviewfragen sicher beantworten.
tracks:
  - title: Kotlin – die Sprache
    description: Syntax, Typsystem, Funktionen, Collections, Generics und Nebenläufigkeit mit Coroutines und Flow.
    modules: [kotlin-grundlagen, null-safety, klassen-objekte, funktionen-lambdas, collections, generics-delegation, coroutines, flow]
  - title: Android & Jetpack Compose
    description: Plattform-Grundlagen, deklarative Oberflächen, Zustand und Navigation.
    modules: [android-grundlagen, compose-grundlagen, compose-state, navigation]
  - title: Architektur, Daten & Qualität
    description: Wie professionelle Android-Apps aufgebaut, getestet und ausgeliefert werden.
    modules: [architektur, daten-netzwerk, testing, gradle-release]
  - title: "Praxis: Kotlin mit Bear"
    description: 100 Aufgaben aus dem echten Code von Bear – von einzelnen Zeilen bis zu langen Funktionen.
    bear: bear/bear-course.json
