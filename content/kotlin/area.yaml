id: kotlin
title: Kotlin & Android
short: Kotlin
tagline: Moderne Android-Apps – von der ersten Zeile bis in den Play Store.
description: >
  Kotlin als Sprache, Coroutines und Flow, Jetpack Compose bis zu eigenen
  Layouts und Animationen, Architektur mit Modulen, Room, Paging und Netzwerk,
  Tests, Performance und Release. Dazu der Praxis-Track mit 100 Aufgaben aus
  dem echten Code von Bear.
color: "#A98BFF"
order: 1
outcomes:
  - Du schreibst idiomatisches Kotlin mit Null-Sicherheit, Datenklassen, Sealed Types und Collections-Operationen.
  - Du baust Oberflächen mit **Jetpack Compose** und verstehst Zustand, Recomposition und Side Effects – bis zu Animationen, eigenen Layouts, Gesten und adaptiven Layouts.
  - Du strukturierst Apps nach **MVVM** und Unidirectional Data Flow mit ViewModel, StateFlow und Repository.
  - Du speicherst Daten mit Room und DataStore, lädst lange Listen mit Paging und sprichst APIs mit Retrofit und OkHttp an, samt Token-Refresh.
  - Du testest ViewModels, Coroutines, HTTP, Worker und Compose-UI und veröffentlichst signierte Releases aus einem modularen Build.
  - Du liest Compiler-Reports, Traces und Stacktraces, misst mit Macrobenchmark und belegst die Wirkung eines Baseline Profiles.
  - Du kannst typische Android-Interviewfragen sicher beantworten.
tracks:
  - title: Kotlin – die Sprache
    description: Syntax, Typsystem, Funktionen, Collections, Generics und Nebenläufigkeit mit Coroutines und Flow.
    modules: [kotlin-grundlagen, null-safety, klassen-objekte, funktionen-lambdas, collections, generics-delegation, coroutines, flow]
  - title: Android & Jetpack Compose
    description: Plattform-Grundlagen, deklarative Oberflächen, Zustand, Navigation und fortgeschrittenes Compose.
    modules: [android-grundlagen, compose-grundlagen, compose-state, navigation, compose-fortgeschritten]
  - title: Architektur, Daten & Qualität
    description: Wie professionelle Android-Apps aufgebaut, getestet, gemessen und ausgeliefert werden.
    modules: [architektur, daten-netzwerk, testing, performance-diagnose, performance-messen, gradle-release]
  - title: "Praxis: Kotlin mit Bear"
    description: 100 Aufgaben aus dem echten Code von Bear – von einzelnen Zeilen bis zu langen Funktionen.
    bear: bear/bear-course.json
