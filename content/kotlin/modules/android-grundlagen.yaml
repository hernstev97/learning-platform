id: android-grundlagen
title: "Android-Grundlagen: App, Lebenszyklus, Prozess"
level: 1
minutes: 130
summary: Wie eine Android-App aufgebaut ist, wer ihren Prozess startet und beendet und warum Zustand bei Drehung und Process Death verloren geht – das Fundament, auf dem Compose, ViewModel und Navigation aufsetzen.
goals:
  - Du erklärst, wofür `build.gradle.kts`, `AndroidManifest.xml`, Ressourcen und die Klasse `R` zuständig sind, und unterscheidest `minSdk`, `targetSdk` und `compileSdk`.
  - Du ordnest die vier App-Komponenten ihren heutigen Aufgaben zu und startest Komponenten mit expliziten und impliziten Intents sowie mit einem `PendingIntent`.
  - Du sagst voraus, welcher Zustand eine Drehung, Process Death und das Schließen der App überlebt, und testest Process Death mit `adb`.
  - Du erkennst Context-Leaks und Arbeit auf dem Main Thread, die zu einem ANR führt.
  - Du fragst Runtime Permissions aus Compose heraus korrekt an und richtest eine Single-Activity-App mit Edge-to-Edge ein.
