lesson: |
  Im klassischen View-System hast du Oberflächen *verändert*: `textView.text = "3 Gedanken"`, `button.isEnabled = false`, `list.adapter.notifyItemRemoved(2)`. Jede dieser Zeilen muss zur richtigen Zeit laufen, sonst zeigt der Bildschirm etwas anderes als die Daten. Je mehr Zustand, desto mehr solcher Stellen – und desto mehr Fehler der Art „der Zähler stimmt nicht mehr“.

  Compose dreht das um. Du beschreibst, *wie* die Oberfläche für einen bestimmten Zustand aussieht, und Compose kümmert sich darum, sie bei jeder Änderung anzupassen. Dieses Modul baut das Denkmodell dazu auf und führt durch die Bausteine, aus denen Bears Bildschirme bestehen: Layouts, Modifier, Text und Eingabe, Listen, Material 3, Previews und Barrierefreiheit. Wie Zustand selbst funktioniert – `remember`, State Hoisting, Side Effects – vertieft danach `compose-state`.

  ## Das Denkmodell: UI als Funktion des Zustands

  Eine Composable ist eine Kotlin-Funktion mit der Annotation `@Composable`. Sie gibt nichts zurück, sondern *beschreibt* UI, indem sie andere Composables aufruft ([Thinking in Compose](https://developer.android.com/develop/ui/compose/mental-model#simple-example)):

  ```kotlin
  @Composable
  fun Greeting(name: String, openThoughts: Int) {
      Column {
          Text("Hallo, $name")
          if (openThoughts > 0) {
              Text("$openThoughts Gedanken warten auf dich")
          }
      }
  }
  ```

  Beim ersten Aufruf baut Compose daraus die **Composition** – einen Baum, der festhält, welche Composables an welcher Stelle aufgerufen wurden. Ändert sich ein Wert, den eine Composable liest, ruft Compose sie erneut auf: **Recomposition**. Das `if` ist dabei kein Sonderfall: Ist `openThoughts` beim nächsten Mal `0`, verschwindet der zweite `Text` aus der Composition. Du schreibst keine Anweisung „Text ausblenden“, die UI folgt dem Zustand.

  Damit das effizient bleibt, nimmt sich Compose [Freiheiten](https://developer.android.com/develop/ui/compose/mental-model#recomposition), die du kennen musst:

  - **Recomposition überspringt, was sich nicht geändert hat.** Hat eine Composable dieselben Parameter wie beim letzten Mal, kann Compose sie auslassen.
  - **Composables können sehr oft laufen** – im Extremfall bei jedem Frame einer Animation.
  - **Die Reihenfolge ist nicht garantiert.** Compose kann Geschwister in beliebiger Reihenfolge ausführen und Arbeit abbrechen, wenn sich der Zustand währenddessen erneut ändert.

  Daraus folgt die wichtigste Regel: **Composables sind schnell, idempotent und frei von Nebenwirkungen.** Kein Netzwerkaufruf, kein Schreiben in globale Variablen, kein Zählen „nebenbei“. Die Doku zeigt das an einem Beispiel, das einen Zähler beim Zeichnen der Zeilen hochzählt – er zeigt falsche Werte, weil die Zeilen unabhängig vom Zähler neu laufen oder übersprungen werden ([ListWithBug](https://developer.android.com/develop/ui/compose/mental-model#any-order)). Nebenwirkungen gehören in Event-Handler wie `onClick` oder in die Effekt-APIs aus `compose-state`.

  > [!MERKE]
  > UI = f(Zustand). Eine Composable liest Zustand und beschreibt UI. Sie verändert nichts – außer über Callbacks, die ein Nutzer auslöst.

  ## Layouts: Column, Row, Box

  Drei [Standard-Layouts](https://developer.android.com/develop/ui/compose/layouts/basics#standard-layouts) decken die meisten Bildschirme ab: `Column` ordnet untereinander an, `Row` nebeneinander, `Box` übereinander (Schichten). Die Verteilung steuerst du mit zwei Parametern:

  - **Arrangement** gilt entlang der Hauptachse (bei `Row` horizontal): `Start`, `Center`, `SpaceBetween` oder `spacedBy(12.dp)` für feste Abstände.
  - **Alignment** gilt quer dazu (bei `Row` vertikal): `Alignment.CenterVertically`, `Top`, `Bottom`.

  ```kotlin
  @Composable
  fun ThoughtRow(thought: Thought, onOpen: (String) -> Unit, modifier: Modifier = Modifier) {
      Row(
          modifier = modifier
              .fillMaxWidth()
              .clickable(onClickLabel = "Gedanken öffnen") { onOpen(thought.id) }
              .padding(horizontal = 16.dp, vertical = 12.dp),
          horizontalArrangement = Arrangement.spacedBy(12.dp),
          verticalAlignment = Alignment.CenterVertically,
      ) {
          Icon(painterResource(R.drawable.ic_thought), contentDescription = null)
          Text(
              thought.text,
              modifier = Modifier.weight(1f),
              maxLines = 2,
              overflow = TextOverflow.Ellipsis,
          )
          Text(thought.ageLabel, style = MaterialTheme.typography.labelSmall)
      }
  }
  ```

  `Modifier.weight(1f)` verteilt den Platz, der nach allen Kindern ohne Gewicht und nach den Abständen übrig bleibt, im Verhältnis der Gewichte. Hier bekommt der Gedankentext alles, was Icon und Altersangabe nicht brauchen. Ohne `weight` würde ein langer Text die Altersangabe aus der Zeile schieben.

  Unter der Haube misst Compose jedes Kind **genau einmal**: Der Parent gibt Constraints (minimale und maximale Größe) nach unten, jedes Kind wählt eine Größe innerhalb dieser Grenzen und meldet sie nach oben, dann platziert der Parent ([The layout model](https://developer.android.com/develop/ui/compose/layouts/basics#model)). Diese Einmal-Regel macht tiefe Verschachtelung in Compose billig – anders als bei verschachtelten `LinearLayout`s mit Gewichten im View-System.

  ## Modifier: Die Reihenfolge ist Bedeutung

  Ein `Modifier` dekoriert eine Composable: Größe, Abstand, Hintergrund, Klick, Semantik. Modifier werden verkettet, und **jeder umhüllt alles, was nach ihm kommt**. Lies eine Kette deshalb von außen nach innen ([Order of modifiers matters](https://developer.android.com/develop/ui/compose/modifiers#order-modifier-matters)):

  ```kotlin
  // Ganze Fläche inkl. Rand ist klickbar: clickable umhüllt padding
  Modifier.clickable { open() }.padding(16.dp)

  // Nur der Inhalt ist klickbar: padding liegt außerhalb von clickable
  Modifier.padding(16.dp).clickable { open() }
  ```

  Dasselbe gilt für Hintergründe: `background(…).padding(16.dp)` färbt auch den Rand, `padding(16.dp).background(…)` nur die Fläche innerhalb. Und `size(48.dp).padding(16.dp)` legt die Gesamtgröße auf 48 dp fest, sodass für den Inhalt nur 16 × 16 dp bleiben.

  Zwei Konventionen aus den offiziellen API-Richtlinien gehören in jede eigene Composable:

  1. **Jede Composable, die UI ausgibt, nimmt `modifier: Modifier = Modifier` an** – als ersten optionalen Parameter – und gibt ihn an ihr äußerstes Element weiter. Nur so kann der Aufrufer Abstand, Größe oder Testtags setzen.
  2. **Modifier sind scope-sicher.** `weight` gibt es nur in `RowScope` und `ColumnScope`, `align` in `BoxScope`. Der Compiler verhindert, dass du sie an der falschen Stelle benutzt ([Scope safety](https://developer.android.com/develop/ui/compose/modifiers#scope-safety)).

  > [!TIP] Parameter-Modifier zuerst
  > Schreibe `modifier.fillMaxWidth().padding(…)` und nicht `Modifier.padding(…).then(modifier)`. So wirken die Wünsche des Aufrufers außen, deine internen Abstände innen – das erwartet jeder, der deine Composable benutzt.

  ## Die wichtigsten Bausteine

  **Text** zeigt Strings an; Styles kommen aus dem Theme: `Text("Heute", style = MaterialTheme.typography.titleMedium)`. Texte, die Nutzer lesen, gehören in `strings.xml` und werden mit `stringResource(R.string.today)` geladen – dann funktionieren Übersetzungen.

  **Button**, `TextButton`, `OutlinedButton` und `IconButton` nehmen `onClick` und einen Inhalt als Lambda. Das ist das **Slot-Muster**: Die Komponente bestimmt Form und Verhalten, du bestimmst, was darin steht.

  **TextField** gibt es in zwei Varianten ([Choose TextField](https://developer.android.com/develop/ui/compose/text/user-input#choose-textfield)). Die ältere, wertbasierte Variante bekommt `value` und `onValueChange` – du hältst den Text selbst. Die neuere, zustandsbasierte Variante bekommt ein `TextFieldState`, das Text, Cursor und Auswahl gemeinsam verwaltet; Google empfiehlt sie für neuen Code.

  ```kotlin
  @Composable
  fun CaptureField(onSave: (String) -> Unit, modifier: Modifier = Modifier) {
      val draft = rememberTextFieldState()
      Row(modifier, verticalAlignment = Alignment.CenterVertically) {
          TextField(
              state = draft,
              modifier = Modifier.weight(1f),
              placeholder = { Text("Was soll ich mir merken?") },
          )
          IconButton(onClick = {
              onSave(draft.text.toString())
              draft.clearText()
          }) {
              Icon(painterResource(R.drawable.ic_send), contentDescription = "Speichern")
          }
      }
  }
  ```

  Bear nutzt die wertbasierte Variante; beide wirst du in echten Codebasen sehen.

  **Image** und **Icon** zeigen Grafiken. Das Paket `material-icons` empfiehlt Google nicht mehr – Material3 1.4 bringt es nicht mehr mit. Lade stattdessen Material Symbols als Vector Drawable herunter und zeige sie mit `painterResource` an. Beide verlangen eine `contentDescription` – dazu gleich mehr.

  ## Listen mit LazyColumn

  `Column` mit einer Schleife komponiert *alle* Elemente, auch die unsichtbaren. Für Listen beliebiger Länge gibt es [LazyColumn und LazyRow](https://developer.android.com/develop/ui/compose/lists): Sie komponieren nur, was sichtbar ist, und du beschreibst den Inhalt mit einer DSL.

  ```kotlin
  LazyColumn(contentPadding = PaddingValues(vertical = 8.dp)) {
      item {
          Text("Heute", style = MaterialTheme.typography.titleMedium)
      }
      items(thoughts, key = { it.id }) { thought ->
          ThoughtRow(thought, onOpen = onOpen)
      }
  }
  ```

  Der Parameter `key` ist nicht optional im Geiste. Ohne Key identifiziert Compose ein Element über seine *Position*. Löschst du den zweiten Eintrag, rutscht der dritte an Position zwei – und erbt dessen Zustand: aufgeklappte Details, eine laufende Animation, eine Scrollposition. Mit einem stabilen Key wie der Datenbank-ID wandert der Zustand mit dem Element ([Item keys](https://developer.android.com/develop/ui/compose/lists#item-keys)). Keys müssen eindeutig sein – doppelte Keys lassen die App abstürzen – und sich in einem `Bundle` speichern lassen, damit die Scrollposition eine Neuerzeugung der Activity übersteht. Strings, Zahlen und `Long`-IDs erfüllen das.

  Zwei weitere Regeln: Verschachtle keine Listen, die in dieselbe Richtung scrollen (eine `LazyColumn` in einer `Column` mit `verticalScroll` stürzt mit „infinity maximum height constraints“ ab). Und bei gemischten Elementen hilft `contentType`, damit Compose Elemente gleichen Typs wiederverwenden kann.

  ## Material 3: Scaffold, Theme, Dynamic Color

  `Scaffold` ist das Grundgerüst eines Material-Bildschirms mit Slots für `topBar`, `bottomBar`, `floatingActionButton` und `snackbarHost` ([Scaffold](https://developer.android.com/develop/ui/compose/components/scaffold)):

  ```kotlin
  @OptIn(ExperimentalMaterial3Api::class)
  @Composable
  fun ThoughtsScreen(thoughts: List<Thought>, onAdd: () -> Unit, onOpen: (String) -> Unit) {
      Scaffold(
          topBar = { TopAppBar(title = { Text("Gedanken") }) },
          floatingActionButton = {
              FloatingActionButton(onClick = onAdd) {
                  Icon(painterResource(R.drawable.ic_add), contentDescription = "Gedanken festhalten")
              }
          },
      ) { innerPadding ->
          LazyColumn(contentPadding = innerPadding) {
              items(thoughts, key = { it.id }) { thought ->
                  ThoughtRow(thought, onOpen = onOpen)
              }
          }
      }
  }
  ```

  `innerPadding` enthält den Platz, den Top-Bar, Bottom-Bar und bei Edge-to-Edge auch die Systemleisten belegen. Wendest du ihn nicht an, verschwindet der erste Eintrag unter der Top-Bar. Bei Listen gibst du ihn als `contentPadding` weiter statt als `Modifier.padding`: Dann scrollen die Einträge hinter die Leisten, starten aber sichtbar. Ob `TopAppBar` ein `@OptIn(ExperimentalMaterial3Api::class)` braucht, hängt von der Material3-Version ab; bis Version 1.3 war es Pflicht.

  Das **Theme** stellt Farben, Typografie und Formen bereit. Composables lesen sie über `MaterialTheme.colorScheme.primary` oder `MaterialTheme.typography.bodyLarge`, nie über fest verdrahtete Farben – so funktionieren Dark Mode und Markenfarben an einer Stelle. **Dynamic Color** leitet ab Android 12 (API 31) das Farbschema aus dem Hintergrundbild ab ([Dynamic color schemes](https://developer.android.com/develop/ui/compose/designsystems/material3#dynamic_color_schemes)):

  ```kotlin
  @Composable
  fun BearTheme(darkTheme: Boolean = isSystemInDarkTheme(), content: @Composable () -> Unit) {
      val context = LocalContext.current
      val colors = when {
          Build.VERSION.SDK_INT >= Build.VERSION_CODES.S ->
              if (darkTheme) dynamicDarkColorScheme(context) else dynamicLightColorScheme(context)
          darkTheme -> BearDarkColors
          else -> BearLightColors
      }
      MaterialTheme(colorScheme = colors, typography = BearTypography, content = content)
  }
  ```

  Ob eine App Dynamic Color nutzt, ist eine Designentscheidung: Bear hat eine eigene Papier-und-Tinte-Palette und verzichtet darauf.

  ## Previews und Barrierefreiheit

  Mit `@Preview` zeigt Android Studio eine Composable ohne Emulator an ([Previews](https://developer.android.com/develop/ui/compose/tooling/previews)). Previews funktionieren am besten mit **zustandslosen** Composables, die alle Daten als Parameter bekommen – ein Grund mehr, Bildschirme in einen Teil mit ViewModel und einen reinen Anzeigeteil zu trennen (`compose-state`). Mehrere Varianten auf einmal liefern Multipreview-Annotationen wie `@PreviewLightDark` oder `@PreviewFontScale`.

  ```kotlin
  @PreviewLightDark
  @Composable
  private fun ThoughtRowPreview() {
      BearTheme {
          ThoughtRow(Thought(id = "1", text = "Linear-Sync testen", ageLabel = "vor 2 h"), onOpen = {})
      }
  }
  ```

  Barrierefreiheit beginnt bei drei Gewohnheiten ([Accessibility API defaults](https://developer.android.com/develop/ui/compose/accessibility/api-defaults)):

  - **`contentDescription`** beschreibt, was ein Icon *tut* („Gedanken löschen“), nicht wie es aussieht („Mülleimer“). Rein dekorative Grafiken bekommen `null`, damit TalkBack sie überspringt.
  - **Touch Targets** sind mindestens 48 × 48 dp groß. Material-Komponenten sorgen selbst dafür; bei eigenen klickbaren Elementen hilft `Modifier.minimumInteractiveComponentSize()`.
  - **Semantik** macht Struktur hörbar: `Modifier.semantics { heading() }` markiert Überschriften, `clickable(onClickLabel = "Gedanken öffnen")` ersetzt das generische „Zum Aktivieren doppeltippen“, und `Modifier.semantics(mergeDescendants = true) { }` fasst eine Karte zu einem Element zusammen ([Semantics](https://developer.android.com/develop/ui/compose/accessibility/semantics)).

  > [!INTERVIEW] „Was ist Recomposition, und wann passiert sie?“
  > Kernsatz: Recomposition ist das erneute Ausführen von Composables, deren gelesener Zustand sich geändert hat. Dann das Wie: Compose verfolgt, welche Composable welchen `State` liest, und führt gezielt nur diese erneut aus; Composables mit unveränderten Parametern werden übersprungen. Abgrenzung: Recomposition ist kein Neuzeichnen des ganzen Bildschirms, und sie kann häufig, in beliebiger Reihenfolge und abgebrochen laufen – deshalb keine Nebenwirkungen im Composable-Körper.

  ## Häufige Fehler

  - **Modifier-Parameter ignoriert.** Die Composable nimmt `modifier` an, benutzt innen aber `Modifier.` – das Padding des Aufrufers verpufft. Symptom: „Mein Abstand wirkt nicht.“
  - **Falsche Modifier-Reihenfolge.** `padding` vor `clickable` verkleinert die Klickfläche, `padding` vor `background` lässt einen ungefärbten Rand.
  - **`innerPadding` vergessen.** Erster Listeneintrag unter der Top-Bar, letzter unter der Navigationsleiste. Android Studio warnt, wenn der Parameter ungenutzt bleibt.
  - **Listen ohne Key.** Zustand springt nach Löschen oder Umsortieren zum falschen Eintrag.
  - **Verschachtelte Scroll-Container** in dieselbe Richtung: Absturz beim Messen.
  - **Harte Farben und Strings.** `Color(0xFF…)` und `Text("Speichern")` im Code brechen Dark Mode und Übersetzungen.
  - **Arbeit im Composable-Körper.** Formatieren großer Listen, Datenbankzugriffe oder Logging bei jeder Recomposition.

  > [!PRAXIS] Wie Bear seine Bildschirme schneidet
  > Bears `HomeScreen.kt` trennt `HomeRoute` (hält Entwurf und Stimmung des Bären, reagiert auf Tippen) von `HomeContent` (zeigt nur an, was es als Parameter bekommt). `HomeContent` hat sogar Parameter wie `animate` und `menuOpen`, damit Previews und Screenshot-Tests jeden Zustand festnageln können. Genau dieses Muster erwartet ein Reviewer bei jedem Bildschirm. Die Compose-Aufgaben 41–50 im Praxis-Track rekonstruieren solche Stellen.

  ## Zusammenfassung

  - Composables beschreiben UI für einen Zustand; Recomposition führt sie bei Zustandsänderungen erneut aus und überspringt Unverändertes.
  - Composables sind schnell, idempotent und ohne Nebenwirkungen, weil sie oft, in beliebiger Reihenfolge und abbrechbar laufen.
  - `Column`, `Row`, `Box` plus `Arrangement` (Hauptachse), `Alignment` (Querachse) und `weight` (Restplatz) tragen die meisten Layouts.
  - Modifier umhüllen alles, was nach ihnen kommt – die Reihenfolge ändert Größe, Hintergrund und Klickfläche.
  - Jede UI-Composable nimmt `modifier: Modifier = Modifier` an und gibt ihn an ihr äußerstes Element weiter.
  - `LazyColumn` mit `key = { it.id }` für jede Liste, deren Inhalt sich ändert.
  - `Scaffold` liefert `innerPadding`, das Theme liefert Farben und Typografie; Dynamic Color gibt es ab API 31.
  - Previews brauchen zustandslose Composables; Barrierefreiheit braucht `contentDescription`, 48 dp und Semantik.
exercises:
  - id: denkmodell-aussagen
    type: choice
    title: Was darf Compose mit deinem Code tun?
    prompt: Welche Aussagen über Composables stimmen?
    options:
      - text: Eine Composable kann bei jedem Frame einer Animation erneut ausgeführt werden.
        correct: true
        why: Die Doku nennt das ausdrücklich. Teure Arbeit im Composable-Körper führt dann zu Ruckeln.
      - text: Compose führt Geschwister-Composables immer in der Reihenfolge des Quelltexts aus.
        correct: false
        why: Die Reihenfolge ist nicht garantiert. Code, der sich darauf verlässt, dass `A()` vor `B()` läuft, ist fehlerhaft.
      - text: Eine Composable gibt ein View-Objekt zurück, das Compose später aktualisiert.
        correct: false
        why: Composables geben `Unit` zurück und *beschreiben* UI. Es gibt kein Objekt, das du festhalten und ändern könntest.
      - text: Haben sich die Parameter einer Composable nicht geändert, kann Compose ihren Aufruf bei einer Recomposition überspringen.
        correct: true
        why: Das ist Skipping – der Grund, warum Recomposition billig ist. Details zu Stabilität folgen in `compose-state`.
      - text: Eine lokale Variable beim Zeichnen von Listenzeilen hochzuzählen, um darunter „N Einträge“ anzuzeigen, ist unbedenklich.
        correct: false
        why: Das ist das Beispiel `ListWithBug` aus der Doku. Die Zeilen können übersprungen oder mehrfach ausgeführt werden; die Anzeige wird falsch. Die Anzahl leitest du aus den Daten ab (`thoughts.size`).
    explanation: |
      Compose behandelt Composables wie reine Funktionen von Zustand zu UI. Nur dann darf es sie überspringen, wiederholen, umordnen oder abbrechen, ohne dass sich das Ergebnis ändert. Alles, was diese Annahme bricht – Schreiben in Variablen außerhalb, Netzwerk, Logging mit Folgen –, führt zu Fehlern, die nur manchmal auftreten.
    resources:
      - title: "Thinking in Compose: Recomposition"
        url: https://developer.android.com/develop/ui/compose/mental-model#recomposition

  - id: lazycolumn-parsons
    type: order
    title: Eine Liste mit Überschrift
    prompt: |
      Bring die Zeilen in die richtige Reihenfolge: Eine `LazyColumn` füllt den Bildschirm, hat 16 dp Innenabstand, zeigt oben die Überschrift „Heute“ und darunter alle Gedanken mit ihrer ID als Key.
    lang: kotlin
    lines: |
      LazyColumn(
          modifier = Modifier.fillMaxSize(),
          contentPadding = PaddingValues(16.dp),
      ) {
          item {
              Text("Heute", style = MaterialTheme.typography.titleMedium)
          }
          items(thoughts, key = { it.id }) { thought ->
              ThoughtRow(thought, onOpen = onOpen)
          }
      }
    alternatives:
      - [1, 3, 2, 4, 5, 6, 7, 8, 9, 10, 11]
    explanation: |
      `LazyColumn` nimmt Modifier und Innenabstand als Parameter und den Inhalt als Lambda mit Empfänger `LazyListScope`. Darin beschreibst du Elemente mit `item { }` für Einzelnes und `items(liste, key = …) { }` für viele. `contentPadding` statt `Modifier.padding` sorgt dafür, dass die Einträge beim Scrollen bis an den Rand laufen, aber mit Abstand beginnen und enden.
    resources:
      - title: LazyListScope DSL
        url: https://developer.android.com/develop/ui/compose/lists#lazylistscope
      - title: Content padding
        url: https://developer.android.com/develop/ui/compose/lists#content-padding

  - id: modifier-reihenfolge-flaeche
    type: output
    title: Wie groß ist die rote Fläche?
    prompt: |
      Drei Boxen stehen jeweils allein in einem großen Bildschirm (der Parent schränkt sie nicht ein). Wie groß ist jeweils die **rot gefärbte** Fläche in dp? Antworte im Format `A: 80x80`, eine Zeile pro Box.
    lang: kotlin
    code: |
      // A
      Box(Modifier.background(Color.Red).padding(16.dp).size(48.dp))
      // B
      Box(Modifier.padding(16.dp).background(Color.Red).size(48.dp))
      // C
      Box(Modifier.size(48.dp).padding(16.dp).background(Color.Red))
    expected: |
      A: 80x80
      B: 48x48
      C: 16x16
    accept:
      - |
        A: 80 x 80
        B: 48 x 48
        C: 16 x 16
    explanation: |
      Jeder Modifier umhüllt den Rest der Kette. **A:** `background` umhüllt Padding und Größe: 48 dp Inhalt + 2 × 16 dp Padding = 80 dp, alles rot. **B:** Das Padding liegt außen und bleibt ungefärbt; `background` umhüllt nur die 48 dp. **C:** `size(48.dp)` legt die Gesamtgröße fest, `padding(16.dp)` nimmt davon 32 dp weg, und `background` färbt nur die verbleibenden 16 × 16 dp. Dieselbe Logik bestimmt, wie groß eine Klickfläche mit `clickable` ist.
    resources:
      - title: Order of modifiers matters
        url: https://developer.android.com/develop/ui/compose/modifiers#order-modifier-matters
      - title: Padding and size
        url: https://developer.android.com/develop/ui/compose/modifiers#padding-and-size

  - id: weight-verteilung
    type: output
    title: Wer bekommt wie viel Platz?
    prompt: |
      Wie breit wird jede der drei Boxen in dp? Antworte in einer Zeile mit drei Zahlen, getrennt durch Leerzeichen, von links nach rechts.
    lang: kotlin
    code: |
      Row(
          modifier = Modifier.width(300.dp).height(40.dp),
          horizontalArrangement = Arrangement.spacedBy(12.dp),
      ) {
          Box(Modifier.width(60.dp).fillMaxHeight().background(Color.Gray))
          Box(Modifier.weight(1f).fillMaxHeight().background(Color.Blue))
          Box(Modifier.weight(2f).fillMaxHeight().background(Color.Green))
      }
    expected: 60 72 144
    explanation: |
      Die `Row` misst zuerst die Kinder ohne Gewicht (60 dp) und zieht die Abstände ab: zwei Lücken à 12 dp = 24 dp. Übrig bleiben 300 − 60 − 24 = 216 dp. Dieser Rest wird im Verhältnis 1 : 2 verteilt: 72 dp und 144 dp. Wer `spacedBy` vergisst, rechnet mit 240 dp und kommt auf 80 und 160 – ein typischer Fehler beim Nachbauen eines Designs.
    resources:
      - title: Weight in Row and Column
        url: https://developer.android.com/develop/ui/compose/modifiers#weight-in-row-and-column
      - title: Arrangement.spacedBy
        url: https://developer.android.com/reference/kotlin/androidx/compose/foundation/layout/Arrangement

  - id: scaffold-ergaenzen
    type: gap
    title: Ein Bildschirm mit Scaffold
    prompt: |
      Ergänze den Bildschirm: Titel in der Top-Bar, ein Floating Action Button, der `onAdd` aufruft, das Padding des Scaffolds für die Liste und einen stabilen Key für jeden Gedanken.
    lang: kotlin
    code: |
      @OptIn(ExperimentalMaterial3Api::class)
      @Composable
      fun ThoughtsScreen(thoughts: List<Thought>, onAdd: () -> Unit, onOpen: (String) -> Unit) {
          Scaffold(
              topBar = { ⟦TopAppBar⟧(title = { Text("Gedanken") }) },
              ⟦floatingActionButton⟧ = {
                  FloatingActionButton(onClick = ⟦onAdd⟧) {
                      Icon(painterResource(R.drawable.ic_add), contentDescription = "Gedanken festhalten")
                  }
              },
          ) { innerPadding ->
              LazyColumn(contentPadding = ⟦innerPadding⟧) {
                  items(thoughts, key = ⟦{ it.id }⟧) { thought ->
                      ThoughtRow(thought, onOpen = onOpen)
                  }
              }
          }
      }
    gaps:
      - label: Komponente der Top-Bar
        hint: Material 3 nennt die kleine Standard-Leiste oben so.
      - label: Slot-Name
        hint: Der Parameter heißt wie die Komponente, in camelCase.
      - label: Klick-Handler
        hint: Du kannst die Funktionsreferenz direkt übergeben.
        accept: ["{ onAdd() }"]
      - label: Abstand für die Liste
        hint: Der Parameter des Content-Lambdas.
      - label: Key
        hint: Ein Lambda, das die ID des Gedankens liefert.
        accept: ["{ thought -> thought.id }", "{ t -> t.id }"]
    explanation: |
      `Scaffold` ordnet die Slots nach Material-Richtlinien an und reicht den belegten Platz als `innerPadding` an den Inhalt weiter. Bei einer Liste gehört er in `contentPadding`, damit die Einträge beim Scrollen hinter Top-Bar und Systemleisten laufen, aber sichtbar beginnen. `onClick = onAdd` übergibt die Funktion selbst; `{ onAdd() }` wäre ein gleichwertiges Lambda. Der Key sorgt dafür, dass Zustand und Animationen am Gedanken hängen und nicht an seiner Position.
    resources:
      - title: Scaffold
        url: https://developer.android.com/develop/ui/compose/components/scaffold
      - title: Item keys
        url: https://developer.android.com/develop/ui/compose/lists#item-keys

  - id: theme-dynamic-color
    type: gap
    title: Ein Theme mit Dynamic Color
    prompt: |
      Ergänze `BearTheme`: Ab Android 12 sollen die Farben aus dem Hintergrundbild kommen (hell und dunkel), sonst Bears eigene Paletten. Zum Schluss stellt das Theme alles für die Kinder bereit.
    lang: kotlin
    code: |
      @Composable
      fun BearTheme(
          darkTheme: Boolean = isSystemInDarkTheme(),
          dynamicColor: Boolean = true,
          content: @Composable () -> Unit,
      ) {
          val context = LocalContext.current
          val colors = when {
              dynamicColor && Build.VERSION.SDK_INT >= Build.VERSION_CODES.⟦S⟧ ->
                  if (darkTheme) ⟦dynamicDarkColorScheme(context)⟧ else dynamicLightColorScheme(context)
              darkTheme -> BearDarkColors
              else -> BearLightColors
          }
          ⟦MaterialTheme⟧(colorScheme = ⟦colors⟧, typography = BearTypography, content = content)
      }
    gaps:
      - label: Versionskonstante für Android 12
        hint: Android 12 hat den Codenamen „Snow Cone“; die Konstante ist ein einzelner Buchstabe.
      - label: Dunkles dynamisches Schema
        hint: Das Gegenstück zu `dynamicLightColorScheme(context)`.
      - label: Theme-Composable
        hint: Die Composable, über deren Companion du später `.colorScheme` liest.
      - label: Farbschema
        hint: Die Variable aus dem `when`.
    explanation: |
      `dynamicDarkColorScheme` und `dynamicLightColorScheme` sind mit `@RequiresApi(31)` markiert – ohne die Prüfung auf `Build.VERSION_CODES.S` stürzt die App auf Android 11 und älter ab. `isSystemInDarkTheme()` liest die Systemeinstellung, und weil ein Wechsel ein Configuration Change ist, wird das Theme dabei neu berechnet. `MaterialTheme` stellt Farben, Typografie und Formen über CompositionLocals bereit; darum kann jede Composable darunter `MaterialTheme.colorScheme.primary` lesen, ohne dass du Farben durchreichst.
    resources:
      - title: Dynamic color schemes
        url: https://developer.android.com/develop/ui/compose/designsystems/material3#dynamic_color_schemes
      - title: Color scheme
        url: https://developer.android.com/develop/ui/compose/designsystems/material3#color-scheme

  - id: textfield-state
    type: gap
    title: Ein Eingabefeld mit TextFieldState
    prompt: |
      Ergänze die Schnellerfassung mit dem zustandsbasierten `TextField`: Zustand anlegen, an das Feld übergeben, beim Senden den Text als `String` weitergeben und das Feld danach leeren.
    lang: kotlin
    code: |
      @Composable
      fun CaptureField(onSave: (String) -> Unit, modifier: Modifier = Modifier) {
          val draft = ⟦rememberTextFieldState()⟧
          Row(modifier, verticalAlignment = Alignment.CenterVertically) {
              TextField(
                  ⟦state⟧ = draft,
                  modifier = Modifier.weight(1f),
                  placeholder = { Text("Was soll ich mir merken?") },
              )
              IconButton(onClick = {
                  onSave(⟦draft.text.toString()⟧)
                  draft.⟦clearText()⟧
              }) {
                  Icon(painterResource(R.drawable.ic_send), contentDescription = "Speichern")
              }
          }
      }
    gaps:
      - label: Zustand erzeugen
        hint: "`remember…State()` für Textfelder."
      - label: Parametername
        hint: Das zustandsbasierte `TextField` hat kein `value` und kein `onValueChange`.
      - label: Text als String
        hint: "`draft.text` ist eine `CharSequence`."
      - label: Feld leeren
        hint: Eine Erweiterungsfunktion von `TextFieldState`, die den Inhalt löscht.
    explanation: |
      `rememberTextFieldState()` legt ein `TextFieldState` an, das Text, Cursor und Auswahl verwaltet und über `rememberSaveable` auch Drehung und Process Death übersteht. Das Feld schreibt selbst hinein, deshalb gibt es kein `onValueChange` mehr – und keine Chance, durch eine verzögerte Aktualisierung Tastenanschläge zu verlieren, ein bekanntes Problem der wertbasierten Variante. `text` ist eine `CharSequence`; für die Weitergabe machst du daraus mit `toString()` einen `String`.
    resources:
      - title: Choose TextField implementation
        url: https://developer.android.com/develop/ui/compose/text/user-input#choose-textfield
      - title: Manage text field state
        url: https://developer.android.com/develop/ui/compose/text/user-input#manage-tf-state

  - id: barrierefreiheit-bewerten
    type: choice
    title: Was hört TalkBack?
    prompt: Welche dieser Umsetzungen sind für Screenreader richtig?
    options:
      - text: "`IconButton(onClick = onDelete) { Icon(painterResource(R.drawable.ic_trash), contentDescription = \"Gedanken löschen\") }`"
        correct: true
        why: Die Beschreibung sagt, was passiert. TalkBack liest „Gedanken löschen, Schaltfläche“.
      - text: "Die Bär-Illustration neben der Begrüßung bekommt `contentDescription = \"Bär\"`."
        correct: false
        why: Eine rein dekorative Grafik bekommt `null`. Sonst muss der Nutzer bei jedem Besuch ein bedeutungsloses „Bär“ anhören.
      - text: "Ein eigenes Icon, das per `Modifier.size(24.dp).clickable { … }` klickbar ist, reicht als Touch Target."
        correct: false
        why: 24 dp liegen unter dem Minimum von 48 dp. `IconButton` oder `Modifier.minimumInteractiveComponentSize()` vergrößern die Klickfläche.
      - text: "Die Abschnittsüberschrift „Heute“ bekommt `Modifier.semantics { heading() }`."
        correct: true
        why: TalkBack-Nutzer springen damit von Überschrift zu Überschrift, statt jede Zeile einzeln anzuhören.
    explanation: |
      Barrierefreiheit in Compose läuft über den Semantics-Baum, den TalkBack liest. `contentDescription` füllt ihn für Grafiken, `null` hält Dekoration heraus, `heading()` gibt Struktur, und Material-Komponenten bringen Rollen („Schaltfläche“) und ausreichend große Touch Targets selbst mit. Prüfen kannst du das mit TalkBack auf dem Gerät oder mit dem Accessibility Scanner.
    resources:
      - title: Minimum touch target sizes
        url: https://developer.android.com/develop/ui/compose/accessibility/api-defaults#minimum-target-sizes
      - title: Semantic properties
        url: https://developer.android.com/develop/ui/compose/accessibility/semantics#properties

  - id: liste-ohne-key
    type: bug
    title: Die Details springen zum Nachbarn
    prompt: |
      Jede `ThoughtCard` hat intern einen Zustand „Details aufgeklappt“. Der Nutzer klappt beim zweiten Gedanken die Details auf und löscht dann den **ersten** Gedanken. Danach ist beim neuen zweiten Eintrag (vorher der dritte) alles aufgeklappt, beim eigentlich aufgeklappten Gedanken nicht mehr. Finde die Ursache und korrigiere die Zeile.
    lang: kotlin
    code: |
      @Composable
      fun ThoughtList(thoughts: List<Thought>, onDelete: (String) -> Unit) {
          LazyColumn {
              items(thoughts) { thought ->
                  ThoughtCard(thought, onDelete = { onDelete(thought.id) })
              }
          }
      }
    lines: [4]
    fix:
      - line: 4
        answers:
          - "items(thoughts, key = { it.id }) { thought ->"
          - "items(thoughts, key = { thought -> thought.id }) { thought ->"
          - "items(items = thoughts, key = { it.id }) { thought ->"
    explanation: |
      Ohne Key identifiziert die `LazyColumn` Elemente über ihren Index. Nach dem Löschen steht der frühere zweite Gedanke an Index 0 und bekommt den Zustand, der zu Index 0 gehörte; an Index 1 steht der frühere dritte und erbt „aufgeklappt“. Mit `key = { it.id }` hängt der Zustand an der ID, und er wandert mit, wenn sich Positionen verschieben. Nebenbei animiert `Modifier.animateItem()` nur mit Keys korrekt.
    resources:
      - title: Item keys
        url: https://developer.android.com/develop/ui/compose/lists#item-keys
      - title: Add extra information to help smart recompositions
        url: https://developer.android.com/develop/ui/compose/lifecycle#add-info-smart-recomposition

  - id: modifier-ignoriert
    type: bug
    title: Das Padding kommt nicht an
    prompt: |
      Der Aufrufer schreibt `SettingRow("Name", "Bär", onClick = { … }, modifier = Modifier.padding(horizontal = 24.dp))`, aber die Zeile klebt weiter am Bildschirmrand. Außerdem lässt sich im UI-Test der Testtag, den der Aufrufer per Modifier setzt, nicht finden. Korrigiere die fehlerhafte Zeile.
    lang: kotlin
    code: |
      @Composable
      fun SettingRow(
          title: String,
          value: String,
          onClick: () -> Unit,
          modifier: Modifier = Modifier,
      ) {
          Row(
              modifier = Modifier.fillMaxWidth().clickable(onClick = onClick).padding(16.dp),
              horizontalArrangement = Arrangement.SpaceBetween,
          ) {
              Text(title, style = MaterialTheme.typography.bodyLarge)
              Text(value, style = MaterialTheme.typography.bodyMedium)
          }
      }
    lines: [9]
    fix:
      - line: 9
        answers:
          - "modifier = modifier.fillMaxWidth().clickable(onClick = onClick).padding(16.dp),"
          - "modifier = modifier.fillMaxWidth().clickable { onClick() }.padding(16.dp),"
    explanation: |
      Die Funktion nimmt `modifier` an, beginnt die Kette aber mit dem leeren Companion `Modifier`. Alles, was der Aufrufer übergibt – Padding, Testtag, Größe –, geht verloren. Der Parameter muss der Anfang der Kette am äußersten Element sein: `modifier.fillMaxWidth()…`. Tückisch: Der Code kompiliert, und in der Preview fällt nichts auf. Compose-Lint meldet einen ungenutzten `modifier`-Parameter, deshalb lohnt es sich, die Lint-Checks ernst zu nehmen.
    resources:
      - title: Modifier parameter convention
        url: https://developer.android.com/develop/ui/compose/modifiers
      - title: Compose API guidelines (Elements accept and respect a Modifier parameter)
        url: https://github.com/androidx/androidx/blob/androidx-main/compose/docs/compose-api-guidelines.md

  - id: quick-capture-erklaeren
    type: explain
    title: Bears Schnellerfassung lesen
    prompt: |
      `QuickCaptureContent` zeigt Bears Schnellerfassung, die über eine Kachel in den Schnelleinstellungen geöffnet wird. Erkläre wie im Code-Review: Warum bekommt die Funktion `draft`, `saved` und zwei Callbacks als Parameter, was bewirkt die Reihenfolge der Modifier an der `Column`, und warum ist `Arrangement.Bottom` hier sinnvoll?
    lang: kotlin
    code: |
      @Composable
      fun QuickCaptureContent(
          draft: String,
          saved: Boolean,
          onDraft: (String) -> Unit,
          onSave: () -> Unit,
          animate: Boolean = true,
      ) {
          val p = Bear.palette
          Column(
              Modifier.fillMaxSize().background(p.paper.copy(alpha = 0.96f)).safeDrawingPadding().padding(16.dp),
              verticalArrangement = Arrangement.Bottom,
              horizontalAlignment = Alignment.CenterHorizontally,
          ) {
              BearFigure(
                  when {
                      saved -> BearMood.LegtAb
                      draft.isNotBlank() -> BearMood.HoertZu
                      else -> BearMood.Ruhig
                  },
                  Modifier.width(112.dp), animate = animate,
              )
              Spacer(Modifier.height(16.dp))
              if (saved) {
                  Text("Liegt sicher bei mir.", style = MaterialTheme.typography.headlineSmall, color = p.ink)
              } else {
                  BearTextField(value = draft, onValueChange = onDraft, placeholder = "Was soll ich mir merken?")
              }
          }
      }
    points:
      - Die Composable ist zustandslos – Zustand kommt als Parameter herein, Ereignisse gehen als Callbacks hinaus. Das macht sie in Previews und Tests mit jedem Zustand darstellbar.
      - "`background` steht vor `safeDrawingPadding`: Die Papierfarbe füllt den ganzen Bildschirm inklusive der Bereiche hinter Systemleisten, der Inhalt hält aber Abstand zu Leisten, Kamera-Aussparung und Tastatur."
      - "`Arrangement.Bottom` legt Bär und Eingabefeld nach unten – nahe an Daumen und Tastatur, passend zur schnellen Eingabe."
      - Die Stimmung des Bären wird aus dem Zustand abgeleitet (`when` über `saved` und `draft`), nicht separat gespeichert.
      - "`animate` ist ein Schalter für Previews und Screenshot-Tests, damit Animationen dort nicht stören."
    explanation: |
      `QuickCaptureContent` ist der Anzeigeteil eines Bildschirms: Er hält keinen eigenen Zustand, sondern bekommt Entwurf und Speicherstatus hereingereicht und meldet Eingaben über `onDraft` und `onSave` nach oben. Den Zustand hält `QuickCaptureRoute` darüber. Die Modifier-Kette liest sich von außen nach innen: Fläche füllen, Hintergrund malen, dann erst die Insets abziehen und 16 dp Rand – so ist der Hintergrund randlos, der Inhalt aber sicher sichtbar. `safeDrawing` umfasst Systemleisten, Display-Aussparungen und die Tastatur. `Arrangement.Bottom` packt die Kinder an das untere Ende der Spalte. Die Stimmung als abgeleiteter Wert statt als eigene Variable verhindert, dass beide auseinanderlaufen.
    resources:
      - title: About window insets
        url: https://developer.android.com/develop/ui/compose/system/insets
      - title: State hoisting
        url: https://developer.android.com/develop/ui/compose/state-hoisting

  - id: gedanken-bildschirm-bauen
    type: practice
    title: Bears Gedankenliste
    prompt: |
      Baue den Anzeigeteil von Bears Gedankenliste.

      Gegeben ist `data class Thought(val id: Long, val text: String, val ageLabel: String, val synced: Boolean)`.

      1. `ThoughtCard(thought, onOpen, modifier)`: eine `Card` mit Text (höchstens drei Zeilen, danach „…“), darunter links die Altersangabe und rechts – nur wenn `synced` falsch ist – ein kleines Icon mit einer sinnvollen `contentDescription`. Die ganze Karte ist klickbar und hat ein `onClickLabel`.
      2. `ThoughtsScreen(thoughts, onAdd, onOpen)`: `Scaffold` mit Top-Bar „Gedanken“, FAB zum Hinzufügen und einer `LazyColumn` mit Keys, 8 dp Abstand zwischen den Karten und korrekt angewendetem `innerPadding`. Ist die Liste leer, steht stattdessen mittig „Noch nichts festgehalten.“
      3. Eine Preview mit `@PreviewLightDark` für eine Liste mit drei Gedanken.

      Keine festen Farben, alle Stile aus `MaterialTheme`.
    lang: kotlin
    starter: |
      data class Thought(val id: Long, val text: String, val ageLabel: String, val synced: Boolean)

      @Composable
      fun ThoughtCard(thought: Thought, onOpen: (Long) -> Unit, modifier: Modifier = Modifier) {
          // Dein Code
      }

      @Composable
      fun ThoughtsScreen(thoughts: List<Thought>, onAdd: () -> Unit, onOpen: (Long) -> Unit) {
          // Dein Code
      }
    solution: |
      data class Thought(val id: Long, val text: String, val ageLabel: String, val synced: Boolean)

      @Composable
      fun ThoughtCard(thought: Thought, onOpen: (Long) -> Unit, modifier: Modifier = Modifier) {
          Card(
              modifier = modifier
                  .fillMaxWidth()
                  .clickable(onClickLabel = "Gedanken öffnen") { onOpen(thought.id) },
          ) {
              Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  Text(
                      thought.text,
                      style = MaterialTheme.typography.bodyLarge,
                      maxLines = 3,
                      overflow = TextOverflow.Ellipsis,
                  )
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically,
                  ) {
                      Text(
                          thought.ageLabel,
                          style = MaterialTheme.typography.labelMedium,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                      )
                      if (!thought.synced) {
                          Icon(
                              painterResource(R.drawable.ic_cloud_off),
                              contentDescription = "Noch nicht mit Linear abgeglichen",
                              modifier = Modifier.size(18.dp),
                              tint = MaterialTheme.colorScheme.onSurfaceVariant,
                          )
                      }
                  }
              }
          }
      }

      @OptIn(ExperimentalMaterial3Api::class)
      @Composable
      fun ThoughtsScreen(thoughts: List<Thought>, onAdd: () -> Unit, onOpen: (Long) -> Unit) {
          Scaffold(
              topBar = { TopAppBar(title = { Text("Gedanken") }) },
              floatingActionButton = {
                  FloatingActionButton(onClick = onAdd) {
                      Icon(painterResource(R.drawable.ic_add), contentDescription = "Gedanken festhalten")
                  }
              },
          ) { innerPadding ->
              if (thoughts.isEmpty()) {
                  Box(
                      modifier = Modifier.fillMaxSize().padding(innerPadding),
                      contentAlignment = Alignment.Center,
                  ) {
                      Text("Noch nichts festgehalten.", style = MaterialTheme.typography.bodyLarge)
                  }
              } else {
                  LazyColumn(
                      contentPadding = innerPadding,
                      verticalArrangement = Arrangement.spacedBy(8.dp),
                  ) {
                      items(thoughts, key = { it.id }) { thought ->
                          ThoughtCard(thought, onOpen, Modifier.padding(horizontal = 16.dp))
                      }
                  }
              }
          }
      }

      @PreviewLightDark
      @Composable
      private fun ThoughtsScreenPreview() {
          BearTheme {
              ThoughtsScreen(
                  thoughts = listOf(
                      Thought(1, "Linear-Sync mit schlechtem Netz testen", "vor 5 min", synced = false),
                      Thought(2, "Rundenfenster am Wochenende später legen", "gestern", synced = true),
                      Thought(3, "Widget: zuletzt geöffneten Eintrag zeigen", "vor 3 Tagen", synced = true),
                  ),
                  onAdd = {},
                  onOpen = {},
              )
          }
      }
    checklist:
      - "`ThoughtCard` nimmt `modifier: Modifier = Modifier` an und beginnt damit die Kette an der `Card`."
      - Die Klickfläche umfasst die ganze Karte und hat ein `onClickLabel`.
      - Der Text ist mit `maxLines = 3` und `TextOverflow.Ellipsis` begrenzt.
      - Das Sync-Icon erscheint nur bei `synced == false` und beschreibt den Zustand, nicht das Bild.
      - "`items` hat `key = { it.id }`, der Abstand kommt aus `Arrangement.spacedBy(8.dp)`."
      - "`innerPadding` wird im Listen- und im Leerzustand angewendet."
      - Alle Farben und Stile kommen aus `MaterialTheme`, nicht aus festen Werten.
      - Die Preview zeigt helle und dunkle Variante mit Beispieldaten.
    explanation: |
      Die Lösung trennt Anzeige und Zustand: Beide Composables bekommen nur Daten und Callbacks, deshalb funktioniert die Preview ohne ViewModel. Der Leerzustand ist eine eigene Verzweigung, damit ein neuer Nutzer nicht auf einen leeren Bildschirm starrt. `verticalArrangement = Arrangement.spacedBy(8.dp)` funktioniert auch in `LazyColumn` und ist sauberer als ein Padding an jeder Karte. Das horizontale Padding der Karten reicht der Bildschirm über den `modifier`-Parameter hinein – genau dafür ist er da.
    resources:
      - title: Cards
        url: https://developer.android.com/develop/ui/compose/components/card
      - title: Multipreview templates
        url: https://developer.android.com/develop/ui/compose/tooling/previews#multipreview-templates
