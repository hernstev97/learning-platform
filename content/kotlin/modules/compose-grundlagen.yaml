id: compose-grundlagen
title: "Jetpack Compose: Denkmodell, Layouts, Material 3"
level: 1
minutes: 140
summary: Wie Compose aus Zustand eine Oberfläche macht, warum die Reihenfolge von Modifiern Bedeutung trägt und wie du mit Layouts, Listen, Material 3 und Previews barrierefreie Bildschirme baust.
goals:
  - Du erklärst das deklarative Denkmodell von Compose – Composition, Recomposition, Skipping – und warum Composables frei von Nebenwirkungen sein müssen.
  - Du baust Layouts mit `Column`, `Row` und `Box` und sagst voraus, wie `Arrangement`, `Alignment` und `weight` den Platz verteilen.
  - Du liest eine Modifier-Kette von außen nach innen und sagst voraus, wie ihre Reihenfolge Größe, Hintergrund und Klickfläche verändert.
  - Du baust Listen mit `LazyColumn` und stabilen Keys sowie Bildschirme mit `Scaffold`, `TopAppBar` und `FloatingActionButton`.
  - Du richtest ein Material-3-Theme mit Dynamic Color ein, schreibst Previews und machst Composables für TalkBack bedienbar.
