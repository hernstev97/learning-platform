- id: tab-ohne-savestate
  type: bug
  title: Das Detail ist nach dem Tabwechsel weg
  prompt: Wer in Gedanken ein Detail öffnet, zu Themen wechselt und zurückwechselt, sieht wieder die Liste statt des Details. `restoreState` ist gesetzt. Finde die Zeile und korrigiere sie.
  lang: kotlin
  code: |-
    fun NavController.switchTab(route: Any) {
        navigate(route) {
            popUpTo(graph.findStartDestination().id)
            launchSingleTop = true
            restoreState = true
        }
    }
  lines:
  - 3
  fix:
  - line: 3
    answers:
    - popUpTo(graph.findStartDestination().id) { saveState = true }
  explanation: "`restoreState` kann nur wiederherstellen, was vorher gespeichert wurde. Ohne `saveState = true` wirft `popUpTo` den Verlauf des Gedanken-Bereichs beim Wechsel weg. Erst beide Optionen zusammen geben jedem Bereich einen eigenen Backstack."
  resources:
  - title: Android · Multiple back stacks
    url: https://developer.android.com/guide/navigation/backstack/multi-back-stacks#navoptions
- id: nav-callback
  type: explain
  title: Warum kein Controller im Screen?
  prompt: Erkläre den Vorteil dieses Screen-Vertrags und wo der Controller benutzt wird.
  lang: kotlin
  code: |-
    @Composable
    fun ThoughtRow(id: String, onOpen: (String) -> Unit) {
        Button(onClick = { onOpen(id) }) { Text("Öffnen") }
    }
  points:
  - Die Zeile meldet nur eine Öffnen-Absicht mit ID.
  - Der Aufrufer verbindet den Callback mit Navigation.
  - Ein UI-Test kann die gemeldete ID ohne Graph prüfen.
  - Die Komponente bleibt in anderen Navigationskontexten nutzbar.
  explanation: Die Darstellung muss keine Navigationsinfrastruktur kennen. Der Graph besitzt den Controller und
    übersetzt den Callback in eine Route. Dadurch lassen sich Darstellung und Graph-Vertrag getrennt prüfen.
  resources:
  - *id001
- id: zurueck-abfangen
  type: explain
  title: Warum nur mit Entwurf?
  prompt: Erkläre, was dieser Handler tut, warum `enabled` vom Entwurf abhängt und was bei `enabled = true` passieren würde.
  lang: kotlin
  code: |-
    @Composable
    fun CaptureScreen(draft: String, onDiscardRequest: () -> Unit) {
        BackHandler(enabled = draft.isNotBlank()) {
            onDiscardRequest()
        }
        // …
    }
  points:
  - Ist ein Entwurf da, fängt der Handler Zurück ab und fragt, ob verworfen werden soll.
  - Ohne Entwurf ist der Handler aus, und `NavHost` oder das System übernimmt Zurück.
  - Nur ohne aktiven Handler kann das System die Vorschau der Zurück-Geste zeigen.
  - Mit `enabled = true` fiele die Predictive-Back-Animation auf diesem Bildschirm immer weg, auch wenn es nichts zu schützen gibt.
  explanation: Der Handler schützt einen ungespeicherten Entwurf. Solange einer da ist, gehört die Zurück-Geste dem Handler, und der Bildschirm fragt nach. Ohne Entwurf ist er abgeschaltet; dann kann das System während der Geste zeigen, wohin Zurück führt, und `NavHost` geht zum vorherigen Ziel. Ein dauerhaft aktiver Handler nähme dem Nutzer diese Vorschau und zwänge jede Zurück-Geste durch eigenen Code.
  resources:
  - title: Predictive back in Compose
    url: https://developer.android.com/guide/navigation/custom-back/predictive-back-gesture#compose-back
- id: liste-detail-graph
  type: practice
  title: Liste, Detail und Zurück
  prompt: Baue einen minimalen typisierten Graphen mit Liste und Detail. Liste bietet ID 7 an; Detail zeigt die
    ID und einen Zurück-Button. Prüfe den Rückweg und registriere beide Ziele.
  lang: kotlin
  solution: |-
    @Serializable object ListRoute
    @Serializable data class DetailRoute(val id: String)

    @Composable
    fun DemoNavigation() {
        val nav = rememberNavController()
        NavHost(navController = nav, startDestination = ListRoute) {
            composable<ListRoute> {
                Button(onClick = { nav.navigate(DetailRoute("7")) }) { Text("Gedanke 7") }
            }
            composable<DetailRoute> { entry ->
                val route = entry.toRoute<DetailRoute>()
                Column {
                    Text("Gedanke ${route.id}")
                    Button(onClick = { nav.popBackStack() }) { Text("Zurück") }
                }
            }
        }
    }
  checklist:
  - Serialization-Plugin und Navigation-Compose sind im Android-Projekt eingerichtet.
  - Beide Routen sind registriert und serialisierbar.
  - Der Detailbildschirm zeigt die übergebene ID.
  - Zurück zeigt die Liste wieder.
  - Ein erneutes Öffnen erzeugt den erwarteten Verlauf.
  explanation: Das Projektstück verbindet Route, Argumente und Backstack in einem überschaubaren Ablauf. Das produktive
    Detail würde statt des Textlabels Daten laden und den nicht gefundenen Fall anzeigen.
  resources:
  - *id001
