id: navigation
title: Navigation mit Compose
level: 2
minutes: 150
summary: Typisierte Ziele, Argumente und Backstack so verbinden, dass Hinweg, Rückweg und externe Einstiege verlässlich
  funktionieren.
goals:
- Du definierst typisierte Routen mit kleinen Argumenten.
- Du verdrahtest NavHost und Screens über Callbacks.
- Du erklärst popBackStack, popUpTo und launchSingleTop.
- Du prüfst Deep Links, fehlende Daten und Wiederherstellung.
resources:
- &id001
  title: Android · Type-safe navigation
  url: https://developer.android.com/guide/navigation/design/type-safety
- title: Android · Backstack
  url: https://developer.android.com/guide/navigation/backstack
- title: Android · Navigation testing
  url: https://developer.android.com/guide/navigation/testing
- title: Android · App Links
  url: https://developer.android.com/training/app-links
lesson: |
  In einer Gedanken-App öffnest du aus der Liste einen Eintrag, wechselst zu dessen Bearbeitung und gehst zurück. Die Liste soll wieder am erwarteten Ort erscheinen. Ein Link von außen soll denselben Eintrag öffnen können, auch wenn vorher kein Listenbildschirm sichtbar war. Navigation ist deshalb mehr als ein wechselnder String: Sie verwaltet Ziele, Argumente, Verlauf und die Lebensdauer der zugehörigen Zustände.

  Dieses Modul verwendet Navigation Compose mit `NavHost` und den typisierten APIs der Navigation-2-Linie. Das passt zur bestehenden Compose- und ViewModel-Architektur des Kurses. Typisierte Routen sind seit Navigation 2.8 verfügbar. Die separat dokumentierte Navigation 3 verfolgt ein anderes Backstack-Modell; sie wird hier nicht mit diesen APIs vermischt. Entscheidend ist zuerst, den Vertrag eines Ziels und das erwartete Zurück-Verhalten sauber zu verstehen.

  ## Ein Ziel ist ein Vertrag

  Eine Route beschreibt, welche Seite geöffnet wird und welche kleinen Argumente sie benötigt. Ein Listenbildschirm braucht vielleicht keine Argumente, eine Detailansicht braucht eine ID. Übertrage keine vollständigen Datenbankobjekte: Sie können veralten, groß werden oder nach Prozessverlust nicht mehr sinnvoll rekonstruierbar sein. Der Zielbildschirm lädt die aktuellen Daten über seine ID.

  ```kotlin
  import kotlinx.serialization.Serializable

  @Serializable
  object Thoughts

  @Serializable
  data class ThoughtDetail(val id: String)

  @Serializable
  object Settings
  ```

  Die [typisierten Routen](https://developer.android.com/guide/navigation/design/type-safety) nutzen Kotlin Serialization. Im Gradle-Projekt müssen das Serialization-Plugin und die Navigation-Compose-Abhängigkeit über die bestehenden Versionskatalogeinträge eingerichtet sein. Ein Plugin-Alias ist nur verfügbar, wenn der Katalog ihn definiert; kopiere deshalb keine unbekannten Aliase blind in eine fremde Codebasis.

  Eine ID als `String` verhindert nicht, dass der Eintrag fehlt oder dem Nutzer nicht zugänglich ist. Typsicherheit prüft die Form des Aufrufs. Fachliche Existenz und Berechtigung prüft weiterhin die Datenschicht. Eine Detailansicht braucht deshalb einen „nicht gefunden“-Zustand und einen brauchbaren Rückweg.

  ## NavController und NavHost verbinden Ziele

  `rememberNavController()` erzeugt einen zur Composition passenden Controller. `NavHost` verbindet diesen Controller mit dem Graphen. Ein `composable<T>`-Eintrag legt fest, wie ein Ziel gerendert wird. Die [Navigation-Dokumentation](https://developer.android.com/guide/navigation) ordnet diese Bausteine ein.

  ```kotlin
  @Composable
  fun AppNavigation() {
      val navController = rememberNavController()
      NavHost(navController = navController, startDestination = Thoughts) {
          composable<Thoughts> {
              ThoughtsScreen(
                  onOpen = { id -> navController.navigate(ThoughtDetail(id)) },
                  onSettings = { navController.navigate(Settings) },
              )
          }
          composable<ThoughtDetail> { entry ->
              val route = entry.toRoute<ThoughtDetail>()
              ThoughtDetailScreen(
                  id = route.id,
                  onBack = { navController.popBackStack() },
              )
          }
          composable<Settings> {
              SettingsScreen(onBack = { navController.popBackStack() })
          }
      }
  }
  ```

  Die Navigations-Imports kommen aus `androidx.navigation` beziehungsweise `androidx.navigation.compose`. `toRoute` rekonstruiert das passende Routenobjekt aus den Argumenten. Die gezeigten Screen-Funktionen sind deine eigenen Darstellungskomponenten; die Navigationsbibliothek erzeugt sie nicht.

  Gib den `NavController` nicht an jede Schaltfläche weiter. Ein `onOpen: (String) -> Unit` benennt die Absicht genauer und lässt sich im UI-Test mit einer Variablen beobachten. Die Verdrahtung bleibt an einer Stelle. Das ist dieselbe Trennung von Anzeige und Verantwortung, die du beim State Hoisting kennengelernt hast.

  > [!PRAXIS]
  > Prüfe eine Navigation auf zwei Ebenen: Die Schaltfläche meldet die richtige ID, und der Graph öffnet für diese ID die passende Route. Ein einzelner Screenshot beweist keinen funktionierenden Navigationsvertrag.

  ## Der Backstack ist ein Verlauf

  Ein reguläres `navigate` legt ein weiteres Ziel auf den Verlauf. `popBackStack()` entfernt den obersten Eintrag und kehrt zum vorherigen zurück. Das [Backstack-Kapitel](https://developer.android.com/guide/navigation/backstack) zeigt auch den wichtigen Randfall: Wenn kein sinnvoller Eintrag mehr übrig bleibt, muss die App einen definierten Umgang damit haben. Erzeuge nicht versehentlich einen leeren Bildschirm durch wiederholtes Poppen des Startziels.

  ```text
  Start:       [Thoughts]
  Detail 7:    [Thoughts, ThoughtDetail(7)]
  Settings:    [Thoughts, ThoughtDetail(7), Settings]
  Zurück:      [Thoughts, ThoughtDetail(7)]
  ```

  Das ist ein Denkmodell des sichtbaren Verlaufs, keine vollständige interne Darstellung aller Graph-Einträge. `navigateUp()` folgt dem hierarchischen Aufwärtsmodell und kann insbesondere nach externen Einstiegen anders wirken als ein simples Zurück. Entscheide deshalb bewusst, ob deine Top-Bar einen Verlaufsschritt oder die übergeordnete Ebene meint.

  Mehrfaches Tippen kann dasselbe Ziel wiederholt hinzufügen. `launchSingleTop = true` verhindert eine zusätzliche Kopie, wenn das angesprochene Ziel bereits oben liegt. Es durchsucht nicht automatisch den gesamten Stack nach einem alten Exemplar und ersetzt auch keine fachliche Sperre gegen doppelte Speicheroperationen.

  ```kotlin
  navController.navigate(Settings) {
      launchSingleTop = true
  }
  ```

  Für einen abgeschlossenen Teilablauf kannst du Einträge gezielt entfernen. Beispiel: Nach dem Fertigstellen einer einmaligen Einrichtung soll Zurück nicht wieder deren letzte Seite öffnen. `popUpTo` bestimmt die Grenze; `inclusive = true` entfernt die Grenze selbst mit. Die genaue Wirkung gehört in einen Test, weil falsche Grenzen viel weiter zurückspringen können als beabsichtigt.

  ```kotlin
  // Setup ist eine weitere @Serializable-Route im Graphen.
  navController.navigate(Thoughts) {
      popUpTo<Setup> { inclusive = true }
      launchSingleTop = true
  }
  ```

  > [!MERKE]
  > Eine neue Darstellung und ein neuer Verlaufseintrag sind unterschiedliche Dinge. Lege zuerst fest, was Zurück nach dem nächsten Schritt bedeuten soll.

  ## Argumente und ViewModel haben eine Lebensdauer

  Ein Destination-Eintrag kann Owner eines ViewModels sein. Wird dieser Eintrag endgültig entfernt, endet die zugehörige ViewModel-Lebensdauer. Eine Neuerzeugung der Activity ist dagegen nicht automatisch ein neuer fachlicher Screen. Die ID lässt sich aus dem `SavedStateHandle` typisiert lesen:

  ```kotlin
  class DetailViewModel(
      savedStateHandle: SavedStateHandle,
      repository: ThoughtRepository,
  ) : ViewModel() {
      private val route = savedStateHandle.toRoute<ThoughtDetail>()
      val thought = repository.observeThought(route.id)
  }
  ```

  Die Factory beziehungsweise Dependency Injection muss Repository und SavedStateHandle passend bereitstellen. Das Beispiel zeigt den Vertrag, keine vollständige DI-Konfiguration. Der [Zugriff auf Routen im ViewModel](https://developer.android.com/guide/navigation/design/type-safety) bewahrt die Trennung: Der Screen muss nicht das gesamte geladene Objekt durch seine Navigation tragen.

  Wird ein Eintrag während der Anzeige gelöscht, darf `observeThought` einen fehlenden Zustand liefern. Behalte dann nicht eine alte Route plus veraltete Objektkopie als angeblich aktuellen Datensatz. ID, angezeigte Daten und editierbarer Entwurf sind unterschiedliche Zustände mit unterschiedlichen Besitzern.

  Für mehrere Hauptbereiche mit jeweils eigenem Verlauf unterstützt die Navigationskomponente [mehrere Backstacks](https://developer.android.com/guide/navigation/backstack/multi-back-stacks). `saveState` und `restoreState` können beim Wechsel zusammenarbeiten. Beginne damit erst, wenn die App tatsächlich mehrere solche Bereiche hat; für Liste, Detail und Einstellungen genügt ein nachvollziehbarer einfacher Graph.

  ## Deep Links sind externe Eingaben

  Ein Deep Link verbindet eine URI mit einem Ziel. Für Navigation Compose kann die Route das Muster und die Argumente beschreiben:

  ```kotlin
  composable<ThoughtDetail>(
      deepLinks = listOf(
          navDeepLink<ThoughtDetail>(basePath = "https://example.org/thought")
      ),
  ) { entry ->
      val route = entry.toRoute<ThoughtDetail>()
      ThoughtDetailScreen(id = route.id, onBack = { navController.navigateUp() })
  }
  ```

  Dieses Beispiel ist ein Integrationsausschnitt innerhalb eines `NavHost`-Builders. Ein deklarierter Graph-Link allein macht die Activity nicht automatisch von außen erreichbar. Dazu gehört ein passender Intent-Filter im Manifest. Für verifizierte HTTPS-App-Links braucht die kontrollierte Domain zusätzlich die korrekte Zuordnung. Nutze beim Nachbauen deine eigene Testdomain; `example.org` ist hier nur eine Dokumentationsadresse. Die [App-Link-Dokumentation](https://developer.android.com/training/app-links) beschreibt die Verifikation.

  Externe Links sind Eingaben. Prüfe fehlende IDs, unbekannte Datensätze und nicht erlaubte Operationen. Ein Link darf keine vertrauliche Aktion automatisch auslösen, nur weil er syntaktisch passt. Teste sowohl einen bereits laufenden Prozess als auch den Start der App über den Link. Die zugrunde liegenden Daten müssen auch im zweiten Fall allein aus persistenter Quelle und Argumenten rekonstruierbar sein.

  ## Navigation nachvollziehbar testen

  Baue zuerst Screen-Tests ohne echten Controller: Tippe eine Zeile und prüfe den gemeldeten Wert. Für den Graphen ist ein `TestNavHostController` mit `ComposeNavigator` vorgesehen. Danach kannst du das Ziel und seine Argumente untersuchen. Die [Testanleitung](https://developer.android.com/guide/navigation/testing) beschreibt die Hilfsmittel.

  ```kotlin
  // In einem Compose-UI-Test nach erfolgreicher Navigation:
  val route = navController.currentBackStackEntry
      ?.toRoute<ThoughtDetail>()
  assertEquals("7", route?.id)
  ```

  Teste nicht nur „Detail öffnet“. Gehe zurück, öffne einen zweiten Datensatz, drehe das Gerät und prüfe den fehlenden Datensatz. Bei Deep Links prüfst du einen Kaltstart. Eine zentrale Regel ist dabei, Navigation nur aus einem konkreten Event oder einem bewusst behandelten Zustand auszulösen. `if (saved) navController.navigate(...)` direkt im Composable-Körper kann bei Recomposition erneut laufen. Behandle den Abschluss kontrolliert und verhindere eine erneute Verarbeitung desselben Ereignisses.

  > [!INTERVIEW]
  > Beschreibe Navigation als Zustands- und Lebensdauermodell. Eine Route trägt kleine Identitätsdaten, der Backstack beschreibt Verlauf, ein Destination-Owner begrenzt Screen-Zustand. Typsicherheit ersetzt weder Existenzprüfung noch einen Test des Zurück-Verhaltens.

  ## Häufige Fehler

  - **Große Objekte als Route:** Du transportierst veraltete Daten und erschwerst Wiederherstellung.
  - **Controller überall weiterreichen:** Einzelne Komponenten werden schwer testbar.
  - **`launchSingleTop` als globale Eindeutigkeit verstehen:** Es verhindert nur das zusätzliche obere Exemplar.
  - **Navigation während Composition:** Ein Zustand kann mehrfach denselben Übergang starten.
  - **Nur warmen Deep Link testen:** Der Kaltstart deckt fehlende Initialisierung auf.

  ## Zusammenfassung

  - Routen sind kleine Verträge mit benötigten Argumenten.
  - `NavHost` verbindet typisierte Ziele mit Darstellung.
  - Callbacks halten Screens unabhängig vom Controller.
  - Backstack-Operationen bestimmen das Zurück-Verhalten.
  - Screen-Zustand gehört zu einem passenden Owner.
  - Deep Links benötigen Plattformkonfiguration und fachliche Prüfung.
  - Tests müssen Hinweg, Rückweg und externe Einstiege abdecken.
exercises:
- id: route-inhalt
  type: choice
  title: Was reist zum Detail?
  prompt: Ein Gedanke liegt im Repository. Was gehört in seine Detailroute?
  options:
  - text: Eine stabile Gedanken-ID.
    correct: true
    why: Das Ziel kann damit aktuelle Daten laden.
  - text: Das vollständige Objekt plus jede Zwischenkopie.
    correct: false
    why: Das erhöht Größe und Risiko veralteter Daten.
  - text: Ein NavController im serialisierten Argument.
    correct: false
    why: Der Controller ist Infrastruktur, kein Zielargument.
  explanation: Die Route beschreibt Identität. Der Screen lädt den aktuellen Zustand aus seiner Datenquelle und
    behandelt fehlende Datensätze.
  resources:
  - *id001
- id: route-ablauf
  type: order
  title: Eine Zeile öffnet Details
  prompt: Ordne den Ablauf.
  lang: text
  lines: |-
    Nutzer tippt den Gedanken mit ID 7
    Listen-Screen ruft onOpen("7") auf
    Navigation ruft navigate(ThoughtDetail("7")) auf
    NavHost aktiviert das Detailziel
    Detail lädt aktuelle Daten für ID 7
  explanation: Das UI meldet eine fachliche Absicht. Die zentrale Navigation erzeugt das Ziel und die Detailseite
    lädt anhand der ID.
  resources:
  - *id001
- id: stack-modell
  type: output
  title: Ein vereinfachter Verlauf
  prompt: Was gibt dieses Programm aus? Gib jede Ausgabezeile an.
  lang: kotlin
  code: |-
    fun main() {
        val stack = mutableListOf("Liste")
        stack.add("Detail")
        stack.add("Einstellungen")
        stack.removeAt(stack.lastIndex)
        println(stack.joinToString(" > "))
    }
  expected: Liste > Detail
  explanation: Das Programm modelliert nur sichtbare Ziele als Liste. Das Entfernen des obersten Eintrags macht
    das vorherige Ziel sichtbar; es ist kein Test der Android-Implementierung.
  resources:
  - *id001
- id: route-copy
  type: output
  title: Identität eines neuen Ziels
  prompt: Was gibt dieses Programm aus? Gib jede Ausgabezeile an.
  lang: kotlin
  code: |-
    data class Detail(val id: String)
    fun main() {
        val first = Detail("7")
        val next = first.copy(id = "9")
        println(first.id)
        println(next.id)
    }
  expected: |-
    7
    9
  explanation: Die neue Routeninstanz verändert die alte nicht. Ein Screen-Wechsel sollte die neue ID verwenden,
    statt eine alte Datenkopie weiterzureichen.
  resources:
  - *id001
- id: serializable-route
  type: gap
  title: Ein typisiertes Ziel
  prompt: Ergänze die Serialization-Annotation und einen String-Parameter mit dem Namen id.
  lang: kotlin
  code: |-
    import kotlinx.serialization.Serializable
    @⟦Serializable⟧
    data class ThoughtDetail(⟦val id: String⟧)
  gaps:
  - label: Lücke 1
    hint: Die Annotation kommt aus kotlinx.serialization.
  - label: Lücke 2
    hint: Data-Class-Parameter benötigen val oder var; hier ist val richtig.
  explanation: Die serialisierbare Routenklasse definiert den Vertrag. Das Serialization-Plugin muss zusätzlich
    im Projekt konfiguriert sein.
  resources:
  - *id001
- id: route-lesen
  type: gap
  title: Argumente rekonstruieren
  prompt: Ergänze Zieltyp und Konvertierungsaufruf.
  lang: kotlin
  code: |-
    composable<⟦ThoughtDetail⟧> { entry ->
        val route = entry.⟦toRoute<ThoughtDetail>()⟧
        Text(route.id)
    }
  gaps:
  - label: Lücke 1
    hint: Das Ziel heißt ThoughtDetail.
  - label: Lücke 2
    hint: Die Extension toRoute bekommt denselben Typparameter.
  explanation: Die Zielregistrierung und das Lesen verwenden dieselbe Routenklasse. So hängt die ID nicht an frei
    geschriebenen Argumentnamen.
  resources:
  - *id001
- id: single-top
  type: gap
  title: Doppeltes oberstes Ziel vermeiden
  prompt: Ergänze die Navigationsoption, die eine weitere Kopie des schon oben liegenden Settings-Ziels vermeidet.
  lang: kotlin
  code: |-
    navController.navigate(Settings) {
        ⟦launchSingleTop⟧ = true
    }
  gaps:
  - label: Lücke 1
    hint: Der Name beginnt mit launch und endet mit SingleTop.
  explanation: Die Option wirkt am oberen Ende des Backstacks. Ein weiter unten liegendes Settings-Ziel wird dadurch
    nicht automatisch ausgewählt.
  resources:
  - *id001
- id: falsches-argument
  type: bug
  title: Jede Zeile öffnet denselben Gedanken
  prompt: Beim Tippen auf ID 9 öffnet sich weiterhin ID 7. Repariere den Handler, sodass er die angeklickte ID verwendet.
  lang: kotlin
  code: |-
    ThoughtsScreen(
        onOpen = { id ->
            navController.navigate(ThoughtDetail("7"))
        },
        onSettings = { navController.navigate(Settings) },
    )
  lines:
  - 3
  fix:
  - line: 3
    answers:
    - navController.navigate(ThoughtDetail(id))
  explanation: Der Callback liefert bereits die richtige ID. Der feste String ignoriert diese Eingabe; die Route
    muss den Parameter übernehmen.
  resources:
  - *id001
- id: nav-callback
  type: explain
  title: Warum kein Controller im Screen?
  prompt: Erkläre den Vorteil dieses Screen-Vertrags und wo der Controller benutzt wird.
  lang: kotlin
  code: |-
    @Composable
    fun ThoughtRow(id: String, onOpen: (String) -> Unit) {
        Button(onClick = { onOpen(id) }) { Text("Öffnen") }
    }
  points:
  - Die Zeile meldet nur eine Öffnen-Absicht mit ID.
  - Der Aufrufer verbindet den Callback mit Navigation.
  - Ein UI-Test kann die gemeldete ID ohne Graph prüfen.
  - Die Komponente bleibt in anderen Navigationskontexten nutzbar.
  explanation: Die Darstellung muss keine Navigationsinfrastruktur kennen. Der Graph besitzt den Controller und
    übersetzt den Callback in eine Route. Dadurch lassen sich Darstellung und Graph-Vertrag getrennt prüfen.
  resources:
  - *id001
- id: liste-detail-graph
  type: practice
  title: Liste, Detail und Zurück
  prompt: Baue einen minimalen typisierten Graphen mit Liste und Detail. Liste bietet ID 7 an; Detail zeigt die
    ID und einen Zurück-Button. Prüfe den Rückweg und registriere beide Ziele.
  lang: kotlin
  solution: |-
    @Serializable object ListRoute
    @Serializable data class DetailRoute(val id: String)

    @Composable
    fun DemoNavigation() {
        val nav = rememberNavController()
        NavHost(navController = nav, startDestination = ListRoute) {
            composable<ListRoute> {
                Button(onClick = { nav.navigate(DetailRoute("7")) }) { Text("Gedanke 7") }
            }
            composable<DetailRoute> { entry ->
                val route = entry.toRoute<DetailRoute>()
                Column {
                    Text("Gedanke ${route.id}")
                    Button(onClick = { nav.popBackStack() }) { Text("Zurück") }
                }
            }
        }
    }
  checklist:
  - Serialization-Plugin und Navigation-Compose sind im Android-Projekt eingerichtet.
  - Beide Routen sind registriert und serialisierbar.
  - Der Detailbildschirm zeigt die übergebene ID.
  - Zurück zeigt die Liste wieder.
  - Ein erneutes Öffnen erzeugt den erwarteten Verlauf.
  explanation: Das Projektstück verbindet Route, Argumente und Backstack in einem überschaubaren Ablauf. Das produktive
    Detail würde statt des Textlabels Daten laden und den nicht gefundenen Fall anzeigen.
  resources:
  - *id001
