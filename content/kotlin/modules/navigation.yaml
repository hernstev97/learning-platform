- id: verschachtelter-graph
  type: gap
  title: Ein Ablauf als eigener Graph
  prompt: Ergänze den verschachtelten Graphen mit dem Startziel `Welcome` und die Navigation am Ende, die den ganzen Ablauf vom Backstack nimmt.
  lang: kotlin
  code: |-
    fun NavGraphBuilder.onboardingGraph(navController: NavController) {
        ⟦navigation⟧<Onboarding>(startDestination = ⟦Welcome⟧) {
            composable<Welcome> { WelcomeScreen() }
            composable<Permissions> {
                PermissionsScreen(onDone = {
                    navController.navigate(Thoughts) {
                        popUpTo<⟦Onboarding⟧> { ⟦inclusive = true⟧ }
                    }
                })
            }
        }
    }
  gaps:
  - label: Builder
    hint: Die Funktion für einen verschachtelten Graphen im `NavGraphBuilder`.
  - label: Startziel
    hint: Die erste Seite des Ablaufs.
  - label: Grenze
    hint: Nicht die erste Seite, sondern der Graph selbst.
  - label: Option
    hint: Die Grenze soll mit entfernt werden.
  explanation: "`navigation<Onboarding>` legt einen Graphen mit eigener Route an; wer zu `Onboarding` navigiert, landet auf `Welcome`. Der Graph hat einen eigenen Eintrag unter seinen Seiten. `popUpTo<Onboarding> { inclusive = true }` entfernt deshalb alle Seiten des Ablaufs und den Graphen selbst, egal wie viele Seiten offen waren."
  resources:
  - title: Android · Nested graphs
    url: https://developer.android.com/guide/navigation/design/nested-graphs#compose
- id: graph-viewmodel
  type: gap
  title: Ein ViewModel für den ganzen Ablauf
  prompt: Alle Seiten des Onboardings sollen dasselbe `OnboardingViewModel` bekommen. Ergänze den Owner und den Aufruf.
  lang: kotlin
  code: |-
    composable<Permissions> { entry ->
        val parent = remember(entry) {
            navController.⟦getBackStackEntry<Onboarding>()⟧
        }
        val viewModel: OnboardingViewModel = ⟦viewModel(parent)⟧
        PermissionsScreen(name = viewModel.name)
    }
  gaps:
  - label: Graph-Eintrag
    hint: Der Backstack-Eintrag des Graphen, typisiert über seine Route.
  - label: ViewModel
    hint: Die Funktion aus `lifecycle-viewmodel-compose` mit einem anderen Owner als dem eigenen Eintrag.
    accept:
    - viewModel(viewModelStoreOwner = parent)
    - hiltViewModel(parent)
  explanation: "`getBackStackEntry<Onboarding>()` liefert den Eintrag des Graphen, und `viewModel(parent)` verwendet ihn als Owner. Jede Seite, die so fragt, bekommt dieselbe Instanz; sie endet, wenn der Graph den Backstack verlässt. `remember(entry)` verhindert, dass der Eintrag bei jeder Recomposition neu gesucht wird. Mit Hilt lautet der Aufruf `hiltViewModel(parent)`."
  resources:
  - title: Hilt and Navigation
    url: https://developer.android.com/develop/ui/compose/libraries#hilt-navigation
- id: ergebnis-zurueck
  type: gap
  title: Das gewählte Thema zurückgeben
  prompt: Die Themenauswahl soll das Thema an den Bildschirm darunter zurückgeben und sich schließen.
  lang: kotlin
  code: |-
    fun pick(topic: String) {
        navController.⟦previousBackStackEntry⟧
            ?.⟦savedStateHandle⟧
            ?.set(PICKED_TOPIC, topic)
        navController.⟦popBackStack()⟧
    }
  gaps:
  - label: Eintrag
    hint: Der Eintrag unter dem aktuellen.
  - label: Speicher
    hint: Jeder Eintrag hat einen eigenen Saved State.
  - label: Schließen
    hint: Zurück zum Aufrufer.
    accept:
    - navigateUp()
  explanation: Eine Route trägt Argumente nur nach vorn. Für den Rückweg schreibt die Auswahl in den `SavedStateHandle` des vorherigen Eintrags und geht zurück. Der Aufrufer liest den Wert mit `getStateFlow` aus seinem eigenen Eintrag und entfernt ihn nach dem Verarbeiten.
  resources:
  - title: Android · Returning a result
    url: https://developer.android.com/guide/navigation/use-graph/programmatic#returning_a_result
- id: falsches-argument
  type: bug
  title: Jede Zeile öffnet denselben Gedanken
  prompt: Beim Tippen auf ID 9 öffnet sich weiterhin ID 7. Repariere den Handler, sodass er die angeklickte ID verwendet.
  lang: kotlin
