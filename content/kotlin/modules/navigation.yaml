id: navigation
title: Navigation mit Compose
level: 2
minutes: 220
place: pc
summary: Typisierte Ziele, verschachtelte Graphen, Ergebnisse, Bereiche mit eigenem Verlauf und die Zurück-Geste so verbinden,
  dass Hinweg, Rückweg und externe Einstiege verlässlich funktionieren.
goals:
- Du definierst typisierte Routen mit kleinen Argumenten und verdrahtest NavHost und Screens über Callbacks.
- Du erklärst popBackStack, popUpTo und launchSingleTop und sagst den Backstack nach einer Folge von Aufrufen voraus.
- Du bündelst Abläufe in verschachtelten Graphen und gibst ihnen ein ViewModel mit dem Graphen als Owner.
- Du gibst Ergebnisse über den SavedStateHandle an den Aufrufer zurück.
- Du baust eine Bottom-Bar, bei der jeder Bereich mit saveState und restoreState seinen Verlauf behält.
- Du setzt BackHandler so ein, dass Predictive Back ab targetSdk 36 funktioniert, und prüfst Deep Links und Wiederherstellung.
