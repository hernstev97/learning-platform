lesson: |
  In einer Gedanken-App öffnest du aus der Liste einen Eintrag, wechselst zu dessen Bearbeitung und gehst zurück. Die Liste soll wieder am erwarteten Ort erscheinen. Ein Link von außen soll denselben Eintrag öffnen können, auch wenn vorher kein Listenbildschirm sichtbar war. Unten wechselt eine Leiste zwischen Gedanken und Themen, und jeder Bereich soll seinen eigenen Verlauf behalten. Navigation ist deshalb mehr als ein wechselnder String: Sie verwaltet Ziele, Argumente, Verlauf und die Lebensdauer der zugehörigen Zustände.

  Dieses Modul verwendet Navigation Compose 2.10 mit `NavHost` und typisierten Routen. Das passt zur bestehenden Compose- und ViewModel-Architektur des Kurses. Typisierte Routen sind seit Navigation 2.8 verfügbar. Daneben gibt es inzwischen stabil [Navigation 3](https://developer.android.com/guide/navigation/navigation-3/basics#create-back): Dort besitzt deine App den Backstack selbst als Liste von Schlüsseln, und `NavDisplay` zeigt das oberste Element an. Die [Übersicht der Navigation-Doku](https://developer.android.com/guide/navigation#framework-options) empfiehlt für reine Compose-Apps weiterhin Navigation Compose. Die beiden APIs werden hier nicht vermischt. Die Denkmodelle – Route als Vertrag, Backstack als Verlauf, Lebensdauer von Zustand – gelten für beide.

  ## Ein Ziel ist ein Vertrag

  Eine Route beschreibt, welche Seite geöffnet wird und welche kleinen Argumente sie benötigt. Ein Listenbildschirm braucht vielleicht keine Argumente, eine Detailansicht braucht eine ID. Übertrage keine vollständigen Datenbankobjekte: Sie können veralten, groß werden oder nach Prozessverlust nicht mehr sinnvoll rekonstruierbar sein. Der Zielbildschirm lädt die aktuellen Daten über seine ID.

  ```kotlin
  import kotlinx.serialization.Serializable

  @Serializable
  object Thoughts

  @Serializable
  data class ThoughtDetail(val id: String)

  @Serializable
  object Settings
  ```

  Die [typisierten Routen](https://developer.android.com/guide/navigation/design/type-safety) nutzen Kotlin Serialization. Im Gradle-Projekt müssen das Serialization-Plugin und die Navigation-Compose-Abhängigkeit über die bestehenden Versionskatalogeinträge eingerichtet sein. Ein Plugin-Alias ist nur verfügbar, wenn der Katalog ihn definiert; kopiere deshalb keine unbekannten Aliase blind in eine fremde Codebasis.

  Eine ID als `String` verhindert nicht, dass der Eintrag fehlt oder dem Nutzer nicht zugänglich ist. Typsicherheit prüft die Form des Aufrufs. Fachliche Existenz und Berechtigung prüft weiterhin die Datenschicht. Eine Detailansicht braucht deshalb einen „nicht gefunden“-Zustand und einen brauchbaren Rückweg.

  ## NavController und NavHost verbinden Ziele

  `rememberNavController()` erzeugt einen zur Composition passenden Controller. `NavHost` verbindet diesen Controller mit dem Graphen. Ein `composable<T>`-Eintrag legt fest, wie ein Ziel gerendert wird. Die [Navigation-Dokumentation](https://developer.android.com/guide/navigation) ordnet diese Bausteine ein.

  ```kotlin
  @Composable
  fun AppNavigation() {
      val navController = rememberNavController()
      NavHost(navController = navController, startDestination = Thoughts) {
          composable<Thoughts> {
              ThoughtsScreen(
                  onOpen = { id -> navController.navigate(ThoughtDetail(id)) },
                  onSettings = { navController.navigate(Settings) },
              )
          }
          composable<ThoughtDetail> { entry ->
              val route = entry.toRoute<ThoughtDetail>()
              ThoughtDetailScreen(
                  id = route.id,
                  onBack = { navController.popBackStack() },
              )
          }
          composable<Settings> {
              SettingsScreen(onBack = { navController.popBackStack() })
          }
      }
  }
  ```

  Die Navigations-Imports kommen aus `androidx.navigation` beziehungsweise `androidx.navigation.compose`. `toRoute` rekonstruiert das passende Routenobjekt aus den Argumenten. Die gezeigten Screen-Funktionen sind deine eigenen Darstellungskomponenten; die Navigationsbibliothek erzeugt sie nicht.

  Gib den `NavController` nicht an jede Schaltfläche weiter. Ein `onOpen: (String) -> Unit` benennt die Absicht genauer und lässt sich im UI-Test mit einer Variablen beobachten. Die Verdrahtung bleibt an einer Stelle. Das ist dieselbe Trennung von Anzeige und Verantwortung, die du beim State Hoisting kennengelernt hast.

  > [!PRAXIS]
  > Prüfe eine Navigation auf zwei Ebenen: Die Schaltfläche meldet die richtige ID, und der Graph öffnet für diese ID die passende Route. Ein einzelner Screenshot beweist keinen funktionierenden Navigationsvertrag.

  ## Der Backstack ist ein Verlauf

  Ein reguläres `navigate` legt ein weiteres Ziel auf den Verlauf. `popBackStack()` entfernt den obersten Eintrag und kehrt zum vorherigen zurück. Das [Backstack-Kapitel](https://developer.android.com/guide/navigation/backstack) zeigt auch den wichtigen Randfall: Wenn kein sinnvoller Eintrag mehr übrig bleibt, muss die App einen definierten Umgang damit haben. Erzeuge nicht versehentlich einen leeren Bildschirm durch wiederholtes Poppen des Startziels.

  ```text
  Start:       [Thoughts]
  Detail 7:    [Thoughts, ThoughtDetail(7)]
  Settings:    [Thoughts, ThoughtDetail(7), Settings]
  Zurück:      [Thoughts, ThoughtDetail(7)]
  ```

  Das ist ein Denkmodell der sichtbaren Ziele. Intern liegen dazwischen noch Einträge für Graphen, dazu gleich mehr. `navigateUp()` folgt dem hierarchischen Aufwärtsmodell und kann insbesondere nach externen Einstiegen anders wirken als ein simples Zurück. Entscheide deshalb bewusst, ob deine Top-Bar einen Verlaufsschritt oder die übergeordnete Ebene meint.

  Mehrfaches Tippen kann dasselbe Ziel wiederholt hinzufügen. `launchSingleTop = true` verhindert eine zusätzliche Kopie, wenn das angesprochene Ziel bereits oben liegt. Es durchsucht nicht automatisch den gesamten Stack nach einem alten Exemplar und ersetzt auch keine fachliche Sperre gegen doppelte Speicheroperationen.

  ```kotlin
  navController.navigate(Settings) {
      launchSingleTop = true
  }
  ```

  Für einen abgeschlossenen Teilablauf kannst du Einträge gezielt entfernen. Beispiel: Nach dem Fertigstellen einer einmaligen Einrichtung soll Zurück nicht wieder deren letzte Seite öffnen. `popUpTo` bestimmt die Grenze; `inclusive = true` entfernt die Grenze selbst mit. Die genaue Wirkung gehört in einen Test, weil falsche Grenzen viel weiter zurückspringen können als beabsichtigt.

  ```kotlin
  // Setup ist eine weitere @Serializable-Route im Graphen.
  navController.navigate(Thoughts) {
      popUpTo<Setup> { inclusive = true }
      launchSingleTop = true
  }
  ```

  > [!MERKE]
  > Eine neue Darstellung und ein neuer Verlaufseintrag sind unterschiedliche Dinge. Lege zuerst fest, was Zurück nach dem nächsten Schritt bedeuten soll.

  ## Argumente und ViewModel haben eine Lebensdauer

  Ein Destination-Eintrag kann Owner eines ViewModels sein. Wird dieser Eintrag endgültig entfernt, endet die zugehörige ViewModel-Lebensdauer. Eine Neuerzeugung der Activity ist dagegen nicht automatisch ein neuer fachlicher Screen. Die ID lässt sich aus dem `SavedStateHandle` typisiert lesen:

  ```kotlin
  class DetailViewModel(
      savedStateHandle: SavedStateHandle,
      repository: ThoughtRepository,
  ) : ViewModel() {
      private val route = savedStateHandle.toRoute<ThoughtDetail>()
      val thought = repository.observeThought(route.id)
  }
  ```

  Die Factory beziehungsweise Dependency Injection muss Repository und SavedStateHandle passend bereitstellen. Das Beispiel zeigt den Vertrag, keine vollständige DI-Konfiguration. Der [Zugriff auf Routen im ViewModel](https://developer.android.com/guide/navigation/design/type-safety) bewahrt die Trennung: Der Screen muss nicht das gesamte geladene Objekt durch seine Navigation tragen.

  Wird ein Eintrag während der Anzeige gelöscht, darf `observeThought` einen fehlenden Zustand liefern. Behalte dann nicht eine alte Route plus veraltete Objektkopie als angeblich aktuellen Datensatz. ID, angezeigte Daten und editierbarer Entwurf sind unterschiedliche Zustände mit unterschiedlichen Besitzern.

  ## Verschachtelte Graphen bündeln Abläufe

  Die Einrichtung beim ersten Start besteht aus drei Seiten: Willkommen, Berechtigungen, Name des Bären. Sie gehören zusammen, haben einen eigenen Einstieg und werden am Ende als Ganzes verlassen. Ein [verschachtelter Graph](https://developer.android.com/guide/navigation/design/nested-graphs#compose) macht genau das sichtbar:

  ```kotlin
  @Serializable object Onboarding
  @Serializable object Welcome
  @Serializable object Permissions

  fun NavGraphBuilder.onboardingGraph(navController: NavController) {
      navigation<Onboarding>(startDestination = Welcome) {
          composable<Welcome> {
              WelcomeScreen(onNext = { navController.navigate(Permissions) })
          }
          composable<Permissions> {
              PermissionsScreen(
                  onDone = {
                      navController.navigate(Thoughts) {
                          popUpTo<Onboarding> { inclusive = true }
                      }
                  },
              )
          }
      }
  }
  ```

  Wer den Ablauf startet, navigiert zum Graphen, nicht zu seiner ersten Seite: `navController.navigate(Onboarding)` öffnet `Welcome`. Der Graph legt dabei einen eigenen Eintrag auf den Backstack, unter seine Seiten. Darum entfernt `popUpTo<Onboarding> { inclusive = true }` am Ende den ganzen Ablauf auf einmal, egal wie viele Seiten er hatte.

  Die Extension-Funktion auf `NavGraphBuilder` ist das übliche Muster, um Graphen zu verteilen. Im `NavHost` steht dann nur noch `onboardingGraph(navController)`. In einer App mit Feature-Modulen liefert jedes Modul so seinen Teilgraphen, und nur das App-Modul kennt alle; mehr dazu im Modul „App-Architektur“.

  Ein Graph-Eintrag kann auch Owner eines ViewModels sein. Das ist der richtige Ort für Zustand, den mehrere Seiten eines Ablaufs teilen, etwa den Namen, den die Einrichtung über drei Seiten sammelt:

  ```kotlin
  composable<Permissions> { entry ->
      val parent = remember(entry) {
          navController.getBackStackEntry<Onboarding>()
      }
      val viewModel: OnboardingViewModel = viewModel(parent)
      PermissionsScreen(name = viewModel.name)
  }
  ```

  Alle Seiten, die so mit dem Graph-Eintrag als Owner fragen, bekommen dieselbe Instanz. Sie lebt, solange der Graph auf dem Backstack liegt, und endet mit `popUpTo<Onboarding> { inclusive = true }`. Mit Hilt heißt der Aufruf `hiltViewModel(parent)`, seit androidx.hilt 1.3 aus dem Paket `androidx.hilt.lifecycle.viewmodel.compose` ([Hilt und Navigation](https://developer.android.com/develop/ui/compose/libraries#hilt-navigation)). Ein ViewModel mit der Activity als Owner wäre zu groß: Es überlebte den Ablauf und trüge den alten Namen in die nächste Einrichtung.

  ## Ergebnisse an den Aufrufer zurückgeben

  Beim Erfassen eines Gedankens öffnet Bear eine Themenauswahl. Das gewählte Thema soll zurück in die Erfassung. Eine Route kann nur Argumente *nach vorn* tragen. Für den Rückweg hat jeder Backstack-Eintrag einen eigenen `SavedStateHandle`; die Auswahl schreibt in den des vorherigen Eintrags und geht zurück ([Returning a result](https://developer.android.com/guide/navigation/use-graph/programmatic#returning_a_result)).

  ```kotlin
  const val PICKED_TOPIC = "picked_topic"

  // In der Themenauswahl:
  fun pick(topic: String) {
      navController.previousBackStackEntry
          ?.savedStateHandle
          ?.set(PICKED_TOPIC, topic)
      navController.popBackStack()
  }
  ```

  ```kotlin
  // In der Erfassung:
  composable<Capture> { entry ->
      val picked by entry.savedStateHandle
          .getStateFlow<String?>(PICKED_TOPIC, null)
          .collectAsStateWithLifecycle()
      LaunchedEffect(picked) {
          picked?.let { topic ->
              viewModel.onTopicPicked(topic)
              entry.savedStateHandle.remove<String>(PICKED_TOPIC)
          }
      }
  }
  ```

  Das Ergebnis überlebt Drehung und Prozessverlust, weil es im Saved State des Eintrags liegt. Darum gelten dieselben Regeln wie für Argumente: kleine Werte, keine Objekte. Nach dem Verarbeiten entfernst du den Wert, sonst übernimmt die Erfassung dasselbe Thema nach der nächsten Drehung erneut. Teilen mehrere Seiten viel Zustand, ist ein ViewModel am gemeinsamen Graphen klarer als eine Kette von Ergebnissen.

  ## Bottom-Bar mit mehreren Backstacks

  Bear hat unten zwei Bereiche: Gedanken und Themen. Wer in Gedanken ein Detail öffnet, zu Themen wechselt und zurückkommt, erwartet das Detail wieder. Jeder Bereich braucht also einen eigenen Verlauf. Navigation Compose speichert dafür beim Wechsel den Backstack des alten Bereichs und stellt den des neuen wieder her ([Multiple back stacks](https://developer.android.com/guide/navigation/backstack/multi-back-stacks#navoptions)):

  ```kotlin
  fun NavController.switchTab(route: Any) {
      navigate(route) {
          popUpTo(graph.findStartDestination().id) {
              saveState = true
          }
          launchSingleTop = true
          restoreState = true
      }
  }
  ```

  Jede Zeile hat eine Aufgabe. `popUpTo` bis zum Startziel des ganzen Graphen räumt den aktuellen Bereich ab, damit sich Bereiche nicht übereinanderstapeln. `saveState = true` speichert die abgeräumten Einträge samt Saved State, statt sie zu verwerfen. `restoreState = true` holt einen früher gespeicherten Stand des Zielbereichs zurück. `launchSingleTop` verhindert eine zweite Kopie, wenn man auf den aktiven Bereich tippt. Fehlt `saveState`, ist das Detail nach dem Wechsel weg, obwohl `restoreState` gesetzt ist: Es gibt nichts wiederherzustellen.

  Jeder Bereich ist ein eigener verschachtelter Graph. Welcher Eintrag in der Leiste markiert ist, ergibt sich aus der Hierarchie des aktuellen Ziels:

  ```kotlin
  @Composable
  fun BearBottomBar(navController: NavHostController) {
      val entry by navController.currentBackStackEntryAsState()
      val current = entry?.destination
      NavigationBar {
          tabs.forEach { tab ->
              val selected = current?.hierarchy
                  ?.any { it.hasRoute(tab.route::class) } == true
              NavigationBarItem(
                  selected = selected,
                  onClick = { navController.switchTab(tab.route) },
                  icon = { Icon(tab.icon, contentDescription = null) },
                  label = { Text(tab.label) },
              )
          }
      }
  }
  ```

  `hierarchy` läuft vom aktuellen Ziel über alle umschließenden Graphen nach oben. Liegt `ThoughtDetail` im Graphen `ThoughtsTab`, bleibt „Gedanken“ markiert, auch wenn das Detail offen ist. Ein Vergleich nur mit dem aktuellen Ziel würde die Markierung im Detail verlieren. Für Apps, die auf großen Bildschirmen eine Navigation Rail statt der Leiste brauchen, wechselt `NavigationSuiteScaffold` aus Material 3 Adaptive automatisch.

  ## Zurück-Geste und Predictive Back

  Mit Predictive Back zeigt Android während der Wischgeste eine Vorschau, wohin Zurück führt: zum vorherigen Bildschirm, zur vorherigen App oder zum Startbildschirm. Seit Android 15 laufen diese System-Animationen für Apps, die die Geste unterstützen. Für Apps mit `targetSdk` 36 sind sie auf Android 16 Standard: `onBackPressed()` wird dann nicht mehr aufgerufen, und `KEYCODE_BACK` kommt nicht mehr an ([Behavior changes](https://developer.android.com/about/versions/16/behavior-changes-16#predictive-back)). `android:enableOnBackInvokedCallback="false"` schaltet das nur noch vorübergehend ab.

  `NavHost` unterstützt die Geste seit Navigation Compose 2.8 ohne eigenen Code; 2.10 bringt eigene Übergänge dafür (`predictivePopEnterTransition`). Eigenen Code brauchst du, wenn ein Bildschirm Zurück abfangen will, etwa bei einem ungespeicherten Entwurf:

  ```kotlin
  @Composable
  fun CaptureScreen(
      draft: String,
      onDiscardRequest: () -> Unit,
  ) {
      BackHandler(enabled = draft.isNotBlank()) {
          onDiscardRequest()
      }
      // …
  }
  ```

  `enabled` ist hier keine Nebensache. Solange ein Handler aktiv ist, gehört die Geste ihm, und das System kann keine Vorschau des Ziels zeigen. Ein dauerhaft aktiver `BackHandler` macht die Zurück-Animation für diesen Bildschirm kaputt. Aktiviere ihn nur, wenn es etwas zu schützen gibt. Wer selbst eine Animation zur Geste zeigen will, etwa ein Blatt, das mit dem Finger schrumpft, nimmt `PredictiveBackHandler`: Er liefert den Fortschritt der Geste als `Flow` ([Predictive back in Compose](https://developer.android.com/guide/navigation/custom-back/predictive-back-gesture#compose-back)). Apps, die noch `onBackPressed()` in der Activity überschreiben, müssen auf `OnBackPressedDispatcher` oder `BackHandler` umziehen, bevor sie `targetSdk` 36 setzen.

  ## Deep Links sind externe Eingaben

  Ein Deep Link verbindet eine URI mit einem Ziel. Für Navigation Compose kann die Route das Muster und die Argumente beschreiben:

  ```kotlin
  composable<ThoughtDetail>(
      deepLinks = listOf(
          navDeepLink<ThoughtDetail>(basePath = "https://example.org/thought")
      ),
  ) { entry ->
      val route = entry.toRoute<ThoughtDetail>()
      ThoughtDetailScreen(id = route.id, onBack = { navController.navigateUp() })
  }
  ```

  Dieses Beispiel ist ein Integrationsausschnitt innerhalb eines `NavHost`-Builders. Ein deklarierter Graph-Link allein macht die Activity nicht automatisch von außen erreichbar. Dazu gehört ein passender Intent-Filter im Manifest. Für verifizierte HTTPS-App-Links braucht die kontrollierte Domain zusätzlich die korrekte Zuordnung. Nutze beim Nachbauen deine eigene Testdomain; `example.org` ist hier nur eine Dokumentationsadresse. Die [App-Link-Dokumentation](https://developer.android.com/training/app-links) beschreibt die Verifikation.

  Externe Links sind Eingaben. Prüfe fehlende IDs, unbekannte Datensätze und nicht erlaubte Operationen. Ein Link darf keine vertrauliche Aktion automatisch auslösen, nur weil er syntaktisch passt. Teste sowohl einen bereits laufenden Prozess als auch den Start der App über den Link. Die zugrunde liegenden Daten müssen auch im zweiten Fall allein aus persistenter Quelle und Argumenten rekonstruierbar sein.

  ## Navigation nachvollziehbar testen

  Baue zuerst Screen-Tests ohne echten Controller: Tippe eine Zeile und prüfe den gemeldeten Wert. Für den Graphen ist ein `TestNavHostController` mit `ComposeNavigator` vorgesehen. Danach kannst du das Ziel und seine Argumente untersuchen. Die [Testanleitung](https://developer.android.com/guide/navigation/testing) beschreibt die Hilfsmittel.

  ```kotlin
  // In einem Compose-UI-Test nach erfolgreicher Navigation:
  val route = navController.currentBackStackEntry
      ?.toRoute<ThoughtDetail>()
  assertEquals("7", route?.id)
  ```

  Teste nicht nur „Detail öffnet“. Gehe zurück, öffne einen zweiten Datensatz, drehe das Gerät und prüfe den fehlenden Datensatz. Bei Bereichen mit eigener Leiste wechselst du hin und zurück und prüfst, ob der Verlauf noch da ist. Bei Deep Links prüfst du einen Kaltstart. Eine zentrale Regel ist dabei, Navigation nur aus einem konkreten Event oder einem bewusst behandelten Zustand auszulösen. `if (saved) navController.navigate(...)` direkt im Composable-Körper kann bei Recomposition erneut laufen. Behandle den Abschluss kontrolliert und verhindere eine erneute Verarbeitung desselben Ereignisses.

  > [!INTERVIEW]
  > Beschreibe Navigation als Zustands- und Lebensdauermodell. Eine Route trägt kleine Identitätsdaten, der Backstack beschreibt Verlauf, ein Destination- oder Graph-Eintrag begrenzt Screen-Zustand. Bei Bereichen mit eigener Leiste erklärst du `saveState` und `restoreState`: Ohne Speichern gibt es nichts wiederherzustellen. Typsicherheit ersetzt weder Existenzprüfung noch einen Test des Zurück-Verhaltens.

  ## Häufige Fehler

  - **Große Objekte als Route:** Du transportierst veraltete Daten und erschwerst Wiederherstellung.
  - **Controller überall weiterreichen:** Einzelne Komponenten werden schwer testbar.
  - **`launchSingleTop` als globale Eindeutigkeit verstehen:** Es verhindert nur das zusätzliche obere Exemplar.
  - **Navigation während Composition:** Ein Zustand kann mehrfach denselben Übergang starten.
  - **Zum ersten Ziel statt zum Graphen navigieren:** `popUpTo` des Graphen greift dann nicht, und der Ablauf lässt Reste auf dem Backstack.
  - **Bereichswechsel ohne `saveState`:** Der Verlauf eines Bereichs geht beim Wechsel verloren.
  - **Ergebnis nicht entfernen:** Nach der nächsten Drehung wird es erneut übernommen.
  - **`BackHandler` immer aktiv:** Die Vorschau der Zurück-Geste fällt für den Bildschirm weg.
  - **Nur warmen Deep Link testen:** Der Kaltstart deckt fehlende Initialisierung auf.

  ## Zusammenfassung

  - Routen sind kleine Verträge mit benötigten Argumenten.
  - `NavHost` verbindet typisierte Ziele mit Darstellung; Callbacks halten Screens unabhängig vom Controller.
  - Backstack-Operationen bestimmen das Zurück-Verhalten.
  - Verschachtelte Graphen bündeln Abläufe, ihr Eintrag kann ViewModels für den ganzen Ablauf besitzen.
  - Ergebnisse gehen über den `SavedStateHandle` des vorherigen Eintrags zurück und werden nach dem Verarbeiten entfernt.
  - Mehrere Bereiche mit eigener Leiste brauchen `popUpTo` zum Startziel mit `saveState`, dazu `restoreState` und `launchSingleTop`.
  - Ab `targetSdk` 36 ist Predictive Back Standard; `BackHandler` ist nur aktiv, wenn es etwas zu schützen gibt.
  - Deep Links benötigen Plattformkonfiguration und fachliche Prüfung.
  - Tests müssen Hinweg, Rückweg, Bereichswechsel und externe Einstiege abdecken.
exercises:
- id: route-inhalt
  type: choice
  title: Was reist zum Detail?
  prompt: Ein Gedanke liegt im Repository. Was gehört in seine Detailroute?
  options:
  - text: Eine stabile Gedanken-ID.
    correct: true
    why: Das Ziel kann damit aktuelle Daten laden.
  - text: Das vollständige Objekt plus jede Zwischenkopie.
    correct: false
    why: Das erhöht Größe und Risiko veralteter Daten.
  - text: Ein NavController im serialisierten Argument.
    correct: false
    why: Der Controller ist Infrastruktur, kein Zielargument.
  explanation: Die Route beschreibt Identität. Der Screen lädt den aktuellen Zustand aus seiner Datenquelle und
    behandelt fehlende Datensätze.
  resources:
  - *id001
- id: route-ablauf
  type: order
  title: Eine Zeile öffnet Details
  prompt: Ordne den Ablauf.
  lang: text
  lines: |-
    Nutzer tippt den Gedanken mit ID 7
    Listen-Screen ruft onOpen("7") auf
    Navigation ruft navigate(ThoughtDetail("7")) auf
    NavHost aktiviert das Detailziel
    Detail lädt aktuelle Daten für ID 7
  explanation: Das UI meldet eine fachliche Absicht. Die zentrale Navigation erzeugt das Ziel und die Detailseite
    lädt anhand der ID.
  resources:
  - *id001
- id: zurueck-ab-api-36
  type: choice
  title: Was ändert targetSdk 36 an Zurück?
  prompt: Bear setzt `targetSdk` auf 36 und läuft auf Android 16. Welche Aussage stimmt?
  options:
  - text: "`onBackPressed()` in der Activity wird nicht mehr aufgerufen; Zurück läuft über `OnBackPressedDispatcher` und Handler wie `BackHandler`."
    correct: true
    why: Mit `targetSdk` 36 sind die Predictive-Back-Animationen Standard, und der alte Callback entfällt.
  - text: Ohne `android:enableOnBackInvokedCallback="true"` im Manifest gibt es keine Zurück-Animation.
    correct: false
    why: Mit `targetSdk` 36 ist die Geste ohne dieses Attribut aktiv. Mit `false` lässt sie sich nur noch vorübergehend abschalten.
  - text: "`BackHandler` ist veraltet und muss durch `PredictiveBackHandler` ersetzt werden."
    correct: false
    why: "`BackHandler` ist nicht veraltet. `PredictiveBackHandler` brauchst du nur, wenn du den Fortschritt der Geste selbst animieren willst."
  - text: "`NavHost` braucht eigenen Code, damit zwischen zwei Zielen die Vorschau läuft."
    correct: false
    why: "`NavHost` unterstützt Predictive Back seit Navigation Compose 2.8 von selbst."
  explanation: Auf Android 16 sind die Predictive-Back-Animationen für Apps mit `targetSdk` 36 Standard. `onBackPressed()` und `KEYCODE_BACK` kommen nicht mehr an. Wer Zurück abfangen will, registriert einen Callback beim `OnBackPressedDispatcher`, in Compose mit `BackHandler`; `NavHost` erledigt das Zurück zwischen Zielen selbst.
  resources:
  - title: Android 16 · Predictive back
    url: https://developer.android.com/about/versions/16/behavior-changes-16#predictive-back
- id: backstack-popupto
  type: output
  title: Was bleibt nach popUpTo?
  prompt: |
    `printScreens()` gibt die Bildschirm-Ziele auf dem Backstack von unten nach oben aus, getrennt durch ` > `. Graph-Einträge zählt es nicht mit. Was gibt der Ablauf aus?
  lang: kotlin
  code: |-
    NavHost(nav, startDestination = Thoughts) {
        composable<Thoughts> { ThoughtsScreen() }
        navigation<Onboarding>(startDestination = Welcome) {
            composable<Welcome> { WelcomeScreen() }
            composable<Permissions> { PermissionsScreen() }
        }
        composable<Done> { DoneScreen() }
    }

    // später, nacheinander:
    nav.navigate(Onboarding)
    nav.navigate(Permissions)
    printScreens()
    nav.navigate(Done) { popUpTo<Welcome>() }
    printScreens()
    nav.popBackStack()
    printScreens()
  expected: |-
    Thoughts > Welcome > Permissions
    Thoughts > Welcome > Done
    Thoughts > Welcome
  hints:
  - Wer zum Graphen navigiert, landet auf seinem Startziel.
  - "`popUpTo` ohne `inclusive` entfernt alles **über** der Grenze, die Grenze selbst bleibt."
  explanation: "`navigate(Onboarding)` öffnet das Startziel des Graphen, also `Welcome`. `popUpTo<Welcome>()` entfernt alles über `Welcome`, hier `Permissions`, und legt dann `Done` oben auf. Ohne `inclusive = true` bleibt `Welcome` liegen, deshalb führt Zurück von `Done` auf `Welcome` und nicht auf `Thoughts`. Für „ganzen Ablauf verlassen“ wäre `popUpTo<Onboarding> { inclusive = true }` richtig gewesen."
  resources:
  - title: Android · Back stack · popUpTo
    url: https://developer.android.com/guide/navigation/backstack#pop
- id: tab-backstack
  type: output
  title: Was ist nach dem Tabwechsel offen?
  prompt: |
    `ThoughtsTab` und `TopicsTab` sind verschachtelte Graphen mit den Startzielen `Thoughts` und `Topics`; `ThoughtsTab` ist das Startziel des `NavHost`. `printScreens()` arbeitet wie in der vorigen Übung. Was gibt der Ablauf aus?
  lang: kotlin
  code: |-
    fun NavController.switchTab(route: Any) {
        navigate(route) {
            popUpTo(graph.findStartDestination().id) {
                saveState = true
            }
            launchSingleTop = true
            restoreState = true
        }
    }

    // App startet auf Thoughts, dann nacheinander:
    nav.navigate(ThoughtDetail("7"))
    nav.switchTab(TopicsTab)
    nav.switchTab(ThoughtsTab)
    printScreens()
    nav.popBackStack()
    printScreens()
  expected: |-
    Thoughts > ThoughtDetail
    Thoughts
  explanation: Beim Wechsel zu Themen räumt `popUpTo` den Gedanken-Bereich bis zum Startziel ab, und `saveState = true` merkt sich dabei `ThoughtDetail`. Beim Zurückwechseln stellt `restoreState = true` diesen Stand wieder her, das Detail ist also wieder offen. Zurück entfernt es danach wie gewohnt.
  resources:
  - title: Android · Multiple back stacks
    url: https://developer.android.com/guide/navigation/backstack/multi-back-stacks#navoptions
