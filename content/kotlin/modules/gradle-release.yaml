id: gradle-release
title: "Gradle, Signieren und Release"
level: 3
minutes: 160
summary: Wie aus Quellcode ein signiertes, optimiertes App Bundle wird, das über Testspuren und gestaffelte Rollouts in den Play Store kommt – automatisch gebaut und getestet in GitHub Actions.
goals:
  - Du liest und änderst `settings.gradle.kts`, Build-Dateien und einen Version Catalog und erklärst, was Plugins und Tasks sind.
  - Du konfigurierst Build Types, Product Flavors und `BuildConfig`-Felder und sagst voraus, welche Varianten daraus entstehen.
  - Du aktivierst R8 für Release-Builds und schreibst eine Keep-Regel, wenn Code per Reflection geladen wird.
  - Du erklärst Upload Key und App Signing Key bei Play App Signing und hältst Keystores und Passwörter aus dem Repository heraus.
  - Du planst einen Release über Testspuren und gestaffelten Rollout und automatisierst Tests, Lint und signierte Builds mit GitHub Actions.
