  - id: edit-queue-erklaeren
    type: explain
    title: Die Outbox mit Versionsnummer
    prompt: |
      Bear sammelt Änderungen an Themen in der Tabelle `edits`, bevor sie an Linear gehen. Erkläre, was `record` und `done` tun und welches Problem die Spalte `version` löst. Warum steht `version` in der `WHERE`-Klausel?
    lang: kotlin
    code: |
      @Entity(tableName = "edits")
      data class EditEntity(
          @PrimaryKey val issueId: String,
          val title: String? = null,
          val block: Boolean = false,
          val version: Int = 1,
          val updatedAt: Long,
      )

      // EditDao
      /** Removes the row only if nothing new came in while it was being sent. */
      @Query("DELETE FROM edits WHERE issueId = :issueId AND version = :version")
      suspend fun done(issueId: String, version: Int): Int

      // EditQueue
      suspend fun record(issueId: String, title: String? = null, block: Boolean = false) {
          val old = db.edits().get(issueId)
          db.edits().upsert(
              EditEntity(
                  issueId = issueId,
                  title = title ?: old?.title,
                  block = block || old?.block == true,
                  version = (old?.version ?: 0) + 1,
                  updatedAt = System.currentTimeMillis(),
              ),
          )
          enqueue(issueId)
      }
    points:
      - Pro Thema gibt es höchstens eine Zeile; `record` verschmilzt neue Änderungen mit den offenen (neuer Titel ersetzt, `block` bleibt gesetzt).
      - Jede Änderung erhöht `version` und stößt einen Sync-Auftrag an.
      - Der Worker merkt sich die Version, die er gelesen hat, und löscht nach dem Senden nur, wenn die Zeile noch diese Version hat.
      - Kommt während des Sendens eine neue Änderung, ist die Version gestiegen; `done` löscht nichts (Rückgabe 0), und die neue Änderung geht nicht verloren.
      - Die Tabelle ist Teil der Single Source of Truth – nach einem Neustart weiß die App, was noch zu Linear muss.
    explanation: |
      `edits` ist eine Outbox: Sie hält fest, was noch nicht bei Linear angekommen ist. `record` liest die offene Zeile und verschmilzt die neue Änderung hinein – ein neuer Titel ersetzt den alten, ein geändertes Merksatz-Feld bleibt markiert –, erhöht `version` und plant einen Sync. Der Worker liest die Zeile, sendet und ruft danach `done(issueId, version)` mit der Version auf, die er gesendet hat. Die Bedingung `version = :version` ist eine optimistische Nebenläufigkeitskontrolle: Hat der Nutzer während des Sendens erneut etwas geändert, ist die Version inzwischen höher, der `DELETE` trifft keine Zeile und liefert 0. Die neue Änderung bleibt stehen und wird im nächsten Lauf gesendet. Ohne diese Bedingung würde der Worker eine Änderung löschen, die er nie gesehen hat.
    resources:
      - title: Offline-first · Synchronization and conflict resolution
        url: https://developer.android.com/topic/architecture/data-layer/offline-first#synchronization-and
      - title: Room · Query functions
        url: https://developer.android.com/training/data-storage/room/accessing-data#query
  - id: offline-first-repository
    type: practice
    title: Ein Offline-first-Repository
    prompt: |
      Schreibe `OfflineFirstTopicRepository` für eine REST-API. Gegeben sind:

      ```kotlin
      interface TopicApi { suspend fun topics(): List<TopicDto> }

      @Dao
      abstract class TopicDao {
          @Query("SELECT * FROM topics ORDER BY title")
          abstract fun observeAll(): Flow<List<TopicEntity>>
          @Transaction
          open suspend fun replaceAll(topics: List<TopicEntity>) { /* … */ }
      }

      data class Topic(val id: String, val title: String)
      ```

      Anforderungen:

      - `observeTopics(): Flow<List<Topic>>` liest ausschließlich aus Room und bildet Entities auf das Domain-Modell ab.
      - `refresh(): RefreshResult` lädt von der API, schreibt in einer Transaktion in Room und liefert ein fachliches Ergebnis.
      - `RefreshResult` unterscheidet Erfolg, keine Verbindung, vom Server abgelehnt (mit HTTP-Code) und unlesbare Antwort.
      - Abbrüche der Coroutine werden nicht verschluckt.
      - Schreibe die Mapping-Funktionen `TopicDto.toEntity()` und `TopicEntity.toDomain()` als Erweiterungsfunktionen.
    lang: kotlin
    starter: |
      sealed interface RefreshResult {
          // Fälle
      }

      class OfflineFirstTopicRepository(
          private val api: TopicApi,
          private val dao: TopicDao,
      ) {
          fun observeTopics(): Flow<List<Topic>> = TODO()

          suspend fun refresh(): RefreshResult = TODO()
      }
    solution: |
      import kotlinx.coroutines.flow.Flow
      import kotlinx.coroutines.flow.map
      import kotlinx.serialization.SerializationException
      import retrofit2.HttpException
      import java.io.IOException

      sealed interface RefreshResult {
          data object Success : RefreshResult
          data object Offline : RefreshResult
          data class Rejected(val httpCode: Int) : RefreshResult
          data class InvalidResponse(val detail: String) : RefreshResult
      }

      fun TopicDto.toEntity(): TopicEntity = TopicEntity(issueId = id, title = title)

      fun TopicEntity.toDomain(): Topic = Topic(id = issueId, title = title)

      class OfflineFirstTopicRepository(
          private val api: TopicApi,
          private val dao: TopicDao,
      ) {
          fun observeTopics(): Flow<List<Topic>> =
              dao.observeAll().map { entities -> entities.map { it.toDomain() } }

          suspend fun refresh(): RefreshResult = try {
              val remote = api.topics()
              dao.replaceAll(remote.map { it.toEntity() })
              RefreshResult.Success
          } catch (e: IOException) {
              RefreshResult.Offline
          } catch (e: HttpException) {
              RefreshResult.Rejected(e.code())
          } catch (e: SerializationException) {
              RefreshResult.InvalidResponse(e.message ?: "unbekanntes Format")
          }
      }
    checklist:
      - "`observeTopics()` nutzt nur `dao.observeAll()` – kein Netzwerkaufruf im Lesepfad."
      - "`refresh()` schreibt über `replaceAll` (eine Transaktion) in Room und gibt die Daten nicht direkt zurück."
      - "`RefreshResult` ist ein Sealed Interface mit vier Fällen; `Success` und `Offline` sind `data object`."
      - "`IOException`, `HttpException` und `SerializationException` werden getrennt gefangen."
      - "Es gibt kein `catch (e: Exception)`, kein `catch (e: Throwable)` und kein `runCatching` – `CancellationException` läuft durch."
      - DTO und Entity verlassen das Repository nicht; nach außen gibt es nur `Topic` und `RefreshResult`.
    explanation: |
      Der Lesepfad kommt ausschließlich aus Room, deshalb zeigt die App offline den letzten Stand, und nach einem erfolgreichen `refresh()` liefert der Flow die neue Liste von selbst. `refresh()` gibt keine Daten zurück, sondern nur, ob es geklappt hat – die Daten fließen über die Datenbank. Die drei `catch`-Blöcke entsprechen den drei Fehlerarten; eine `CancellationException` ist keine davon (sie erbt von `IllegalStateException`) und wird deshalb weitergereicht. Das ViewModel übersetzt `RefreshResult` in eine Meldung im UI-State. Im Modul „Testing“ testest du genau dieses Repository mit einem Fake für die API und einer In-Memory-Datenbank.
    resources:
      - title: Data layer · Expose errors
        url: https://developer.android.com/topic/architecture/data-layer#expose-errors
      - title: Offline-first · Reads
        url: https://developer.android.com/topic/architecture/data-layer/offline-first#reads
