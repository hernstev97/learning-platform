id: daten-netzwerk
title: "Daten & Netzwerk: Room, DataStore, Retrofit, WorkManager"
level: 3
minutes: 180
summary: Wie eine App Daten lokal speichert, mit einem Server spricht, Fehler sauber unterscheidet und Änderungen auch ohne Netz zuverlässig ausliefert – offline-first mit Room als Single Source of Truth.
goals:
  - Du modellierst Tabellen mit Room (Entity, DAO, Database), liest sie als `Flow` und schreibst mit `suspend`-Funktionen und Transaktionen.
  - Du änderst ein bestehendes Datenbankschema mit einer automatischen oder manuellen Migration, ohne Nutzerdaten zu verlieren.
  - Du speicherst Einstellungen mit DataStore und begründest, warum nicht mit `SharedPreferences`.
  - Du sprichst eine REST-API mit Retrofit und kotlinx.serialization an und bildest Netzwerk-, HTTP- und Parsing-Fehler auf fachliche Ergebnisse ab.
  - Du planst garantierte Hintergrundarbeit mit WorkManager – mit Constraints, Backoff, Unique Work und idempotenten Workern.
