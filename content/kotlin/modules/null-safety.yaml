id: null-safety
title: Null-Safety
level: 1
minutes: 150
summary: Wie Kotlin `null` ins Typsystem holt – und wie du Abwesenheit so modellierst, dass keine NullPointerException mehr bis zum Nutzer durchrutscht.
goals:
  - Du unterscheidest nullable und nicht-nullable Typen und liest `String?`, `List<String?>` und `List<String>?` korrekt.
  - Du setzt `?.`, `?:`, `!!` und `let` gezielt ein und erkennst, wann `?.let { } ?:` ein falsches Ergebnis liefert.
  - Du erklärst, wann ein Smart Cast funktioniert und warum er bei `var`-Properties scheitert.
  - Du wählst begründet zwischen `lateinit`, `by lazy`, nullable Property und `requireNotNull`/`checkNotNull`.
  - Du erkennst Platform Types aus Java-Code und sicherst sie an der Grenze ab.
  - Du modellierst Abwesenheit mit einem Sealed Result, wenn `null` den Grund verschweigen würde.
resources:
  - title: Kotlin-Doku · Null safety
    url: https://kotlinlang.org/docs/null-safety.html
  - title: Kotlin-Doku · Type checks and casts (Smart casts)
    url: https://kotlinlang.org/docs/typecasts.html#smart-casts
  - title: Kotlin-Doku · Nullability in Java and Kotlin
    url: https://kotlinlang.org/docs/java-to-kotlin-nullability-guide.html
  - title: Kotlin-Doku · Calling Java from Kotlin (Platform types)
    url: https://kotlinlang.org/docs/java-interop.html#null-safety-and-platform-types
lesson: |
  Bear holt Aufgaben aus Linear. Ein Issue hat einen Titel, aber nicht unbedingt eine Beschreibung, eine zugewiesene Person oder ein Fälligkeitsdatum. In Java wäre jedes dieser Felder eine Referenz, die `null` sein *kann* – und der Compiler würde dich nicht warnen, wenn du `issue.getAssignee().getEmail()` schreibst. Der Absturz kommt zur Laufzeit, oft erst beim Nutzer, und der Stacktrace zeigt die Zeile, an der `null` benutzt wurde, nicht die, an der es entstand.

  Kotlin holt diese Unterscheidung ins Typsystem. Ob ein Wert fehlen darf, steht im Typ, und der Compiler zwingt dich, den fehlenden Fall zu behandeln. Aus TypeScript kennst du das von `strictNullChecks`: `string | null` statt `string`, dazu `?.` und `??`. Kotlin geht zwei Schritte weiter: Es gibt keinen Schalter, um das abzuschalten, und an der Grenze zu Java musst du selbst entscheiden, wem du traust. Dieses Modul zeigt die Operatoren, die Regeln hinter Smart Casts und – am wichtigsten – wann `null` das falsche Werkzeug ist.

  ## Nullable und nicht-nullable Typen

  ```kotlin
  var titel: String = "Steuer"
  // titel = null                  // Fehler: null cannot be a value of a non-null type 'String'.

  var beschreibung: String? = null  // das ? erlaubt null
  beschreibung = "Belege sammeln"
  ```

  `String` und `String?` sind verschiedene Typen. Jeder `String` ist auch ein `String?`, umgekehrt nicht. Auf einem `String?` darfst du keine Methoden direkt aufrufen:

  ```kotlin
  fun laenge(text: String?) = text.length
  // Fehler: only safe (?.) or non-null asserted (!!.) calls are allowed
  //         on a nullable receiver of type 'String?'.
  ```

  Das Denkmodell: Ein `String?` ist eine Schachtel, die einen String enthält oder leer ist. Bevor du den Inhalt benutzt, musst du nachsehen. Der Compiler verfolgt, ob du nachgesehen hast ([Nullable types and non-nullable types](https://kotlinlang.org/docs/null-safety.html#nullable-types-and-non-nullable-types)). Das kostet zur Laufzeit nichts: Auf der JVM ist ein `String?` eine ganz normale Referenz. Die Prüfung findet beim Kompilieren statt.

  Der einfachste Weg, nachzusehen, ist ein `if`:

  ```kotlin
  fun laenge(text: String?): Int {
      if (text == null) return 0
      return text.length        // Smart Cast: hier ist text ein String
  }
  ```

  Nach der Prüfung behandelt der Compiler `text` als `String`. Das heißt **Smart Cast**, und es funktioniert genauso nach `is`-Prüfungen.

  ## Die Operatoren ?. ?: und !!

  **Safe Call `?.`** ruft nur auf, wenn der Wert nicht `null` ist, und liefert sonst `null` ([Safe call operator](https://kotlinlang.org/docs/null-safety.html#safe-call-operator)). Ketten brechen beim ersten `null` ab:

  ```kotlin
  val email: String? = issue.assignee?.email   // null, wenn niemand zugewiesen ist
  val kurz: Int? = issue.beschreibung?.trim()?.length
  ```

  **Elvis `?:`** liefert einen Ersatz, wenn links `null` steht ([Elvis operator](https://kotlinlang.org/docs/null-safety.html#elvis-operator)). Weil `return` und `throw` in Kotlin Ausdrücke vom Typ `Nothing` sind, kannst du damit früh aussteigen – das ist das idiomatische Gegenstück zum Guard-Clause-Muster:

  ```kotlin
  fun kontakt(issue: Issue): String {
      val email = issue.assignee?.email ?: return "Keine E-Mail hinterlegt"
      return "Mail an $email"     // email ist hier ein String
  }

  fun pflichtTitel(issue: Issue?): String =
      issue?.titel ?: throw IllegalStateException("Issue fehlt")
  ```

  `Nothing` ist der Typ eines Ausdrucks, der nie normal zurückkehrt. Weil `Nothing` Subtyp jedes Typs ist, passt `?: return …` in jede Zuweisung ([The Nothing type](https://kotlinlang.org/docs/exceptions.html#the-nothing-type)).

  **Not-null Assertion `!!`** sagt dem Compiler: „Vertrau mir, das ist nicht `null`.“ Liegt er falsch, wirft Kotlin eine `NullPointerException` ([Not-null assertion operator](https://kotlinlang.org/docs/null-safety.html#not-null-assertion-operator)). `!!` ist kein Werkzeug, um Compilerfehler wegzuklicken. Jedes `!!` ist eine Stelle, an der du die Garantie des Typsystems gegen eine Laufzeitannahme tauschst.

  > [!WARNING] Null in String-Templates
  > `"Hallo $name"` mit `name = null` ergibt `Hallo null` – ohne Fehler ([Nullable values in string templates](https://kotlinlang.org/docs/strings.html#nullable-values-in-string-templates)). In einer Benachrichtigung „Fällig: null“ fällt das erst dem Nutzer auf. Schreib `${name ?: "unbekannt"}` oder `name.orEmpty()`.

  ## let, Smart Casts und ihre Grenzen

  `let` führt einen Block mit dem Wert als `it` aus. Zusammen mit `?.` läuft der Block nur, wenn der Wert nicht `null` ist ([let function](https://kotlinlang.org/docs/null-safety.html#let-function)):

  ```kotlin
  issue.beschreibung?.let { text ->
      zeigeVorschau(text.take(80))
  }
  ```

  Warum braucht man das, wenn es `if (x != null)` gibt? Weil Smart Casts nur funktionieren, wenn der Compiler **beweisen** kann, dass sich der Wert zwischen Prüfung und Benutzung nicht ändert. Die Regeln ([Smart cast prerequisites](https://kotlinlang.org/docs/typecasts.html#smart-cast-prerequisites)):

  | Was wird geprüft? | Smart Cast? |
  | --- | --- |
  | lokales `val` | immer |
  | lokales `var` | wenn es zwischen Prüfung und Benutzung nicht geändert und nicht von einem Lambda verändert wird |
  | `val`-Property im selben Modul, ohne eigenen Getter, nicht `open` | ja |
  | `var`-Property | **nie** |

  Bei einer `var`-Property könnte ein anderer Thread oder eine aufgerufene Funktion den Wert zwischen Prüfung und Benutzung ändern:

  ```kotlin
  class SyncService(private val client: ApiClient) {
      var token: String? = null

      fun sync() {
          if (token == null) return
          client.send(token)
          // Fehler: smart cast to 'String' is impossible, because 'token'
          //         is a mutable property that could be mutated concurrently.
      }
  }
  ```

  Die Lösung ist immer dieselbe Idee: Lies den Wert **einmal** in eine lokale Variable und arbeite mit dieser Kopie.

  ```kotlin
  fun sync() {
      val aktuell = token ?: return
      client.send(aktuell)
  }
  // oder: token?.let { client.send(it) }
  ```

  `?.let` liest den Wert ebenfalls genau einmal und übergibt ihn als `it`. Was `let` sonst noch kann und wie es sich von `apply`, `also` und `run` unterscheidet, behandelt das Modul Funktionen & Lambdas.

  > [!WARNING] Die Falle `?.let { … } ?: …`
  > `a?.let { f(it) } ?: b` ist **kein** if-else. Der Elvis-Zweig läuft auch dann, wenn `a` vorhanden ist, `f(it)` aber `null` liefert. Wenn beide Fälle getrennt behandelt werden müssen, schreib ein `if`/`else` oder ein `when`.

  ## Vorbedingungen: require, check und error

  Oft ist `null` an einer Stelle kein erwarteter Fall, sondern ein Programmierfehler oder eine kaputte Konfiguration. Dann willst du nicht still mit einem Ersatzwert weiterlaufen, sondern früh und mit guter Meldung scheitern. Die Standardbibliothek hat dafür Funktionen, die gleichzeitig einen Smart Cast liefern ([Precondition functions](https://kotlinlang.org/docs/exceptions.html#throw-exceptions-with-precondition-functions)):

  ```kotlin
  fun start(env: Map<String, String>) {
      val token = requireNotNull(env["LINEAR_TOKEN"]) { "LINEAR_TOKEN fehlt" }
      // token ist String; sonst IllegalArgumentException
  }

  fun inkrementell(): String {
      val seit = checkNotNull(letzterSync) { "start() wurde nicht aufgerufen" }
      // seit ist Long; sonst IllegalStateException
      return client.aenderungenSeit(seit)
  }

  val farbe = when (status) {
      "offen" -> Farbe.BLAU
      "erledigt" -> Farbe.GRUEN
      else -> error("Unbekannter Status: $status")   // IllegalStateException
  }
  ```

  Die Faustregel: [`require`/`requireNotNull`](https://kotlinlang.org/api/core/kotlin-stdlib/kotlin/require-not-null.html) prüfen **Argumente**, die der Aufrufer falsch übergeben hat. [`check`/`checkNotNull`](https://kotlinlang.org/api/core/kotlin-stdlib/kotlin/check-not-null.html) prüfen den **Zustand** des Objekts. [`error()`](https://kotlinlang.org/api/core/kotlin-stdlib/kotlin/error.html) wirft sofort eine `IllegalStateException` und hat den Rückgabetyp `Nothing`. Im Stacktrace erkennst du so an der Exception-Klasse, wer schuld ist.

  ## lateinit und lazy

  Manche Werte stehen nicht im Konstruktor fest, sind aber danach immer vorhanden: ein per Dependency Injection gesetzter Client, ein Objekt, das ein Test in `@BeforeTest` erzeugt. Sie als `String?` zu deklarieren, würde dich überall zu `?.` zwingen. Dafür gibt es `lateinit` ([Late-initialized properties](https://kotlinlang.org/docs/properties.html#late-initialized-properties-and-variables)):

  ```kotlin
  class SyncWorkerTest {
      lateinit var repository: FakeRepository

      @BeforeTest
      fun setUp() {
          repository = FakeRepository()
      }
  }
  ```

  `lateinit` geht nur mit `var`, nur mit nicht-nullable Typen und nicht mit primitiven Typen wie `Int` oder `Boolean`. Greifst du zu früh zu, wirft Kotlin eine `UninitializedPropertyAccessException: lateinit property repository has not been initialized` – immerhin mit dem Namen der Property statt einer anonymen NPE. Mit `::repository.isInitialized` kannst du nachsehen, brauchst du das oft, ist eine nullable Property ehrlicher.

  `by lazy` ist das Gegenstück für **unveränderliche** Werte, die teuer sind und erst beim ersten Zugriff berechnet werden sollen ([Lazy properties](https://kotlinlang.org/docs/delegated-properties.html#lazy-properties)):

  ```kotlin
  class Einstellungen(private val datei: File) {
      val zeitzone: String by lazy {
          println("lese Zeitzone")   // läuft genau einmal
          datei.readText().trim()
      }
  }
  ```

  Der erste Zugriff führt den Block aus und merkt sich das Ergebnis, jeder weitere liefert das gespeicherte Ergebnis. Standardmäßig ist `lazy` synchronisiert: Auch bei gleichzeitigen Zugriffen aus mehreren Threads läuft der Block nur einmal ([LazyThreadSafetyMode](https://kotlinlang.org/api/core/kotlin-stdlib/kotlin/-lazy-thread-safety-mode/)).

  | | `lateinit var` | `val … by lazy` | `var x: T? = null` |
  | --- | --- | --- | --- |
  | Wer setzt den Wert? | jemand von außen, später | der Lazy-Block selbst | beliebig, auch wieder `null` |
  | Veränderbar? | ja | nein | ja |
  | Zugriff zu früh | `UninitializedPropertyAccessException` | unmöglich | du musst `null` behandeln |
  | Typisch für | DI, Test-Setup | teure Berechnung, Konfiguration | Wert, der legitim fehlen kann |

  ## Java-Interop: Platform Types

  Java-Code sagt dem Compiler nicht, ob eine Referenz `null` sein darf. Kotlin behandelt solche Werte als **Platform Type**, in Fehlermeldungen und der IDE als `String!` notiert: „`String` oder `String?`, ich weiß es nicht“ ([Null-safety and platform types](https://kotlinlang.org/docs/java-interop.html#null-safety-and-platform-types)). Für Platform Types schaltet der Compiler die Null-Prüfung ab:

  ```kotlin
  val home = System.getenv("BEAR_HOME")   // Typ String! – Java-Methode ohne Annotation
  println(home.length)                     // kompiliert; NullPointerException, wenn die Variable fehlt

  val sicher: String? = System.getenv("BEAR_HOME")   // du entscheidest: kann fehlen
  val pflicht: String = System.getenv("BEAR_HOME")   // wirft sofort, falls null:
  // NullPointerException: getenv(...) must not be null
  ```

  Die Regel für die Praxis: **Gib Werten aus Java an der Grenze einen expliziten Kotlin-Typ.** Dann prüft entweder der Compiler (`String?`) oder Kotlin wirft direkt bei der Zuweisung eine aussagekräftige Exception (`String`) – nicht zehn Aufrufe später. Java-Bibliotheken, die Nullability-Annotationen wie JSpecify `@Nullable`/`@NonNull` tragen, liefern echte Kotlin-Typen ([Nullability annotations](https://kotlinlang.org/docs/java-interop.html#nullability-annotations)). Die Android-SDK-APIs sind großteils annotiert; ältere Bibliotheken oft nicht.

  ## Nullability in Collections

  Das `?` kann an zwei Stellen stehen, und beide bedeuten etwas anderes ([Collections of a nullable type](https://kotlinlang.org/docs/null-safety.html#collections-of-a-nullable-type)):

  | Typ | Die Liste … | Die Elemente … |
  | --- | --- | --- |
  | `List<String>` | existiert immer | sind nie `null` |
  | `List<String?>` | existiert immer | können `null` sein |
  | `List<String>?` | kann fehlen | sind nie `null` |
  | `List<String?>?` | kann fehlen | können `null` sein |

  Die Standardbibliothek hilft beim Übergang: `filterNotNull()` macht aus `List<String?>` eine `List<String>`, `mapNotNull { }` bildet ab und wirft `null`-Ergebnisse weg, `firstOrNull()` und `getOrNull(i)` liefern `null` statt einer Exception, und `map[key]` hat immer einen nullable Rückgabetyp, weil der Schlüssel fehlen kann.

  ```kotlin
  // Nur Einträge, die schon mit Linear verknüpft sind:
  val ids: List<String> = eintraege.mapNotNull { it.linearId }
  ```

  Eine `List<String>?` ist fast immer ein Designfehler. Eine leere Liste drückt „nichts da“ genauso gut aus und erspart jedem Aufrufer den `null`-Fall. Gib `emptyList()` zurück statt `null`.

  ## Abwesenheit explizit modellieren

  `null` sagt „nichts da“, aber nicht **warum**. Gibt `findeAufgabe(id)` den Wert `null` zurück, weiß der Aufrufer nicht: Gibt es die Aufgabe nicht? War die ID leer? Ist die Datenbank kaputt? Sobald die Gründe unterschiedlich behandelt werden müssen, modellierst du sie als eigene Typen:

  ```kotlin
  sealed interface Suche {
      data class Gefunden(val eintrag: Eintrag) : Suche
      data object NichtGefunden : Suche
      data class Fehler(val grund: String) : Suche
  }

  fun finde(id: String, lokal: Map<String, Eintrag>): Suche {
      if (id.isBlank()) return Suche.Fehler("Leere ID")
      val eintrag = lokal[id] ?: return Suche.NichtGefunden
      return Suche.Gefunden(eintrag)
  }

  fun beschreibe(s: Suche): String = when (s) {
      is Suche.Gefunden -> "Gefunden: ${s.eintrag.titel}"
      Suche.NichtGefunden -> "Keine Aufgabe mit dieser ID"
      is Suche.Fehler -> "Fehler: ${s.grund}"
  }
  ```

  Der Compiler kennt alle Untertypen eines `sealed interface`. Das `when` braucht deshalb kein `else`, und kommt ein vierter Fall dazu, meldet er jede Stelle, die ihn nicht behandelt. Innerhalb eines Zweigs ist `s` per Smart Cast der passende Untertyp ([Sealed classes and when](https://kotlinlang.org/docs/sealed-classes.html#use-sealed-classes-with-when-expression)). Die Details zu `sealed`, `data class` und `data object` folgen im Modul Klassen & Objekte.

  Nicht jede Abwesenheit braucht einen eigenen Typ. `null` ist richtig, wenn es genau **einen** Grund für das Fehlen gibt und der Aufrufer ihn kennt: `map[key]`, `firstOrNull()`, eine optionale Beschreibung. Ein Sealed Type lohnt sich, sobald es mehrere Gründe gibt oder der Grund zur Fehlermeldung gehört.

  ## Häufige Fehler

  - **`!!` zum Wegklicken von Compilerfehlern.** Symptom: NPE in Produktion an einer Zeile mit `!!`. Lösung: den `null`-Fall behandeln (`?:`, `if`, `?.let`) oder mit `requireNotNull` eine klare Meldung werfen.
  - **Smart Cast auf `var`-Property.** Symptom: `smart cast to 'String' is impossible, because 'token' is a mutable property …`. Lösung: lokale Kopie (`val t = token ?: return`) oder `token?.let { … }`.
  - **`?.let { } ?: …` als if-else.** Symptom: Der Ersatzwert erscheint, obwohl der Wert vorhanden war. Lösung: `if`/`else` oder `when`.
  - **`null` im Template.** Symptom: „Fällig: null“ in der UI. Lösung: `?:` oder `orEmpty()`.
  - **Platform Types weitergereicht.** Symptom: NPE weit weg vom Java-Aufruf. Lösung: expliziter Typ an der Grenze.
  - **`lateinit` auf `Int` oder `String?`.** Symptom: `'lateinit' modifier is not allowed on properties of primitive types.` Lösung: Default-Wert (`var versuche = 0`) oder nullable Property.
  - **`if (flag)` mit `Boolean?`.** Kompiliert nicht. Schreib `if (flag == true)`, wenn `null` wie `false` zählen soll ([Coding conventions](https://kotlinlang.org/docs/coding-conventions.html#nullable-boolean-values-in-conditions)).

  > [!PRAXIS]
  > In Android-Code-Reviews fällt `!!` fast immer auf, oft mit der Frage „Was passiert, wenn das doch null ist?“. Typische Stellen: `arguments!!.getString(…)`, `intent.extras!!`, Werte aus JSON. Gute Codebasen verschieben die `null`-Behandlung an die **Grenze**: Der Netzwerk- oder Datenbankcode wandelt nullable Rohdaten einmal in saubere Domänenobjekte um, und alles dahinter arbeitet mit nicht-nullable Typen oder Sealed Results. Im Praxis-Track Bear siehst du an echtem Code, wie die Linear-Sync mit fehlenden Feldern umgeht.

  > [!INTERVIEW] Wann nimmst du `lateinit`, wann `lazy`, wann eine nullable Property?
  > „`lateinit var` für Werte, die nach der Konstruktion von außen gesetzt werden und danach immer da sind – Dependency Injection, Test-Setup. `val … by lazy` für unveränderliche Werte, die teuer sind und erst beim ersten Zugriff berechnet werden; standardmäßig thread-sicher. Eine nullable Property, wenn der Wert auch im normalen Betrieb fehlen kann – dann will ich, dass der Compiler mich an jeder Stelle dazu zwingt, den Fall zu behandeln. Und wenn es mehrere Gründe für das Fehlen gibt, modelliere ich sie als Sealed Type statt `null`.“

  ## Zusammenfassung

  - `T?` darf `null` sein, `T` nicht. Der Compiler erzwingt die Behandlung; zur Laufzeit kostet das nichts.
  - `?.` bricht bei `null` ab, `?:` liefert einen Ersatz oder steigt mit `return`/`throw` aus, `!!` tauscht Compiler-Garantie gegen Laufzeitrisiko.
  - Smart Casts brauchen einen Wert, der sich nicht ändern kann: lokale Variablen ja, `var`-Properties nie. Lösung: lokale Kopie oder `?.let`.
  - `requireNotNull` für Argumente, `checkNotNull` für Zustand, `error()` für unmögliche Fälle – alle mit Smart Cast und klarer Exception.
  - `lateinit` für später gesetzte Werte, `by lazy` für teure unveränderliche Werte, nullable für Werte, die wirklich fehlen dürfen.
  - Platform Types (`T!`) aus Java bekommen an der Grenze einen expliziten Kotlin-Typ.
  - `List<T?>` und `List<T>?` sind verschiedene Dinge; statt `null`-Listen gibt es `emptyList()`.
  - Hat das Fehlen mehrere Gründe, modelliere sie als Sealed Type statt `null`.
exercises:
  - id: was-kompiliert
    type: choice
    title: Welche Zeilen kompilieren?
    prompt: Gegeben ist die Deklaration unten. Welche Anweisungen kompilieren? (Mehrere Antworten richtig.)
    lang: kotlin
    code: |
      class Nutzer(val name: String, val email: String?)
      val nutzer: Nutzer? = ladeNutzer()
    options:
      - text: "`val n: Int? = nutzer?.email?.length`"
        correct: true
        why: Jeder Schritt ist ein Safe Call, das Ergebnis ist `Int?`.
      - text: "`val n: Int = nutzer?.name?.length ?: 0`"
        correct: true
        why: "Der Elvis-Operator ersetzt `null` durch `0`, das Ergebnis ist `Int`. Das zweite `?.` wäre nicht nötig (`name` ist `String`), schadet aber nicht."
      - text: "`val n: Int = nutzer.name.length`"
        correct: false
        why: "`nutzer` ist `Nutzer?`. Ohne Prüfung ist kein direkter Aufruf erlaubt."
      - text: "`val n: Int = nutzer?.email.length`"
        correct: false
        why: "`nutzer?.email` ist `String?` – `.length` darauf braucht wieder `?.`."
    explanation: |
      Der Typ jedes Teilausdrucks entscheidet. `nutzer?.name` ist `String?`, obwohl `name` selbst `String` ist – der Safe Call macht das Ergebnis nullable, weil `nutzer` fehlen kann. Jeder weitere Zugriff auf einen nullable Wert braucht `?.`, oder du beendest die Kette mit `?:`.
    resources:
      - title: Kotlin-Doku · Safe call operator
        url: https://kotlinlang.org/docs/null-safety.html#safe-call-operator
  - id: null-ausgabe
    type: output
    title: Was steht in der Ausgabe?
    prompt: Was gibt dieses Programm aus?
    lang: kotlin
    code: |
      fun main() {
          val titel: String? = null
          val beschreibung: String? = "  Steuererklärung  "
          println("Titel: $titel")
          println(titel?.length)
          println(titel?.length ?: -1)
          println(beschreibung?.trim()?.length)
          println(titel.orEmpty().isEmpty())
          println(titel == null)
      }
    expected: |
      Titel: null
      null
      -1
      15
      true
      true
    explanation: |
      Ein `null` im Template wird zum Text `null`. `titel?.length` ist selbst `null`, und `println(null)` gibt `null` aus. Mit `?: -1` greift der Ersatzwert. `trim()` entfernt die Leerzeichen, „Steuererklärung“ hat 15 Zeichen. `orEmpty()` macht aus `null` einen leeren String. `== null` ist ein normaler Vergleich und liefert `true`.
    resources:
      - title: Kotlin-Doku · Nullable values in string templates
        url: https://kotlinlang.org/docs/strings.html#nullable-values-in-string-templates
  - id: let-elvis-falle
    type: output
    title: Der Cache, der nicht hilft
    prompt: Was gibt dieses Programm aus? Achte genau darauf, wann der Elvis-Zweig greift.
    lang: kotlin
    code: |
      class Eintrag(val titel: String, val notiz: String?)

      fun notizFuer(cache: Map<String, Eintrag>, id: String): String =
          cache[id]?.let { it.notiz } ?: "aus dem Netz geladen"

      fun main() {
          val cache = mapOf(
              "BEAR-1" to Eintrag("Steuer", "Belege sammeln"),
              "BEAR-2" to Eintrag("Laufen", null),
          )
          println(notizFuer(cache, "BEAR-1"))
          println(notizFuer(cache, "BEAR-2"))
          println(notizFuer(cache, "BEAR-3"))
      }
    expected: |
      Belege sammeln
      aus dem Netz geladen
      aus dem Netz geladen
    explanation: |
      Für `BEAR-2` ist der Eintrag im Cache, aber `let` liefert `it.notiz`, also `null`. Der Elvis-Operator sieht nur „links steht `null`“ und greift – er kann nicht unterscheiden, ob `cache[id]` oder das Ergebnis des Blocks `null` war. In echtem Code würde das für jeden Eintrag ohne Notiz einen unnötigen Netzwerkaufruf auslösen. Wenn „kein Eintrag“ und „Eintrag ohne Notiz“ verschieden behandelt werden müssen, schreib ein `if`/`else` oder `when`.
    resources:
      - title: Kotlin-Doku · Elvis operator
        url: https://kotlinlang.org/docs/null-safety.html#elvis-operator
  - id: lateinit-lazy-ausgabe
    type: output
    title: Wann läuft was?
    prompt: Was gibt dieses Programm aus?
    lang: kotlin
    code: |
      class Einstellungen {
          lateinit var nutzer: String
          val zeitzone: String by lazy {
              println("lese Zeitzone")
              "Europe/Berlin"
          }

          fun zeige() {
              println(if (::nutzer.isInitialized) nutzer else "kein Nutzer")
          }
      }

      fun main() {
          val e = Einstellungen()
          println("erzeugt")
          e.zeige()
          e.nutzer = "Steven"
          e.zeige()
          println(e.zeitzone)
          println(e.zeitzone)
      }
    expected: |
      erzeugt
      kein Nutzer
      Steven
      lese Zeitzone
      Europe/Berlin
      Europe/Berlin
    explanation: |
      Der Lazy-Block läuft nicht beim Erzeugen des Objekts, sondern beim ersten Zugriff auf `zeitzone` – deshalb steht „lese Zeitzone“ erst nach „Steven“. Der zweite Zugriff liefert den gespeicherten Wert, ohne den Block erneut auszuführen. `::nutzer.isInitialized` prüft, ob die `lateinit`-Property schon gesetzt wurde; ein direkter Zugriff vorher hätte eine `UninitializedPropertyAccessException` geworfen.
