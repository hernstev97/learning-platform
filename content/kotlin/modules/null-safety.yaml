  - id: elvis-return-throw
    type: gap
    title: Früh aussteigen mit Elvis
    prompt: |
      Ergänze die Lücken. `kontakt` soll früh `"Keine E-Mail hinterlegt"` zurückgeben, wenn niemand zugewiesen ist oder die Person keine E-Mail hat. `kurzbeschreibung` soll `"(keine Beschreibung)"` liefern, wenn die Beschreibung fehlt. `pflichtTitel` soll eine `IllegalStateException` werfen, wenn das Issue fehlt.
    lang: kotlin
    code: |
      class Nutzer(val name: String, val email: String?)
      class Issue(val titel: String, val beschreibung: String?, val assignee: Nutzer?)

      fun kontakt(issue: Issue): String {
          val email = issue.assignee⟦?.⟧email ⟦?: return "Keine E-Mail hinterlegt"⟧
          return "Mail an $email"
      }

      fun kurzbeschreibung(issue: Issue): String =
          issue.beschreibung?.take(40) ⟦?: "(keine Beschreibung)"⟧

      fun pflichtTitel(issue: Issue?): String =
          issue?.titel ⟦?: throw IllegalStateException("Issue fehlt")⟧
    gaps:
      - label: Zugriff auf assignee
        hint: "`assignee` ist `Nutzer?`."
      - label: Früher Ausstieg
        hint: "`return` ist in Kotlin ein Ausdruck und passt rechts vom Elvis-Operator."
      - label: Ersatzwert
        hint: Der Elvis-Operator mit einem String-Literal.
      - label: Exception werfen
        hint: "`throw` ist ebenfalls ein Ausdruck. Es gibt auch eine Standardfunktion, die genau diese Exception wirft."
        accept: ['?: error("Issue fehlt")']
    explanation: |
      `?.` verkettet den Zugriff, `?:` behandelt den `null`-Fall. Weil `return` und `throw` den Typ `Nothing` haben, passen sie überall dort, wo ein Wert erwartet wird. Nach `val email = … ?: return …` ist `email` ein `String` – der Compiler weiß, dass die Funktion sonst schon verlassen wurde. `error("…")` ist eine Kurzform für `throw IllegalStateException("…")`.
    resources:
      - title: Kotlin-Doku · Elvis operator
        url: https://kotlinlang.org/docs/null-safety.html#elvis-operator
      - title: Kotlin-Doku · The Nothing type
        url: https://kotlinlang.org/docs/exceptions.html#the-nothing-type
  - id: vorbedingungen
    type: gap
    title: Argumente und Zustand prüfen
    prompt: |
      Ergänze die Lücken. `client` wird erst in `start` gesetzt, ist danach aber nie `null`. Ein fehlendes `LINEAR_TOKEN` ist ein **falsches Argument** (`IllegalArgumentException`). Ruft jemand `inkrementell()` vor `start()` auf, ist das ein **falscher Zustand** (`IllegalStateException`). Nutze jeweils die passende Funktion der Standardbibliothek, die gleich einen Smart Cast liefert.
    lang: kotlin
    code: |
      class SyncWorker {
          ⟦lateinit⟧ var client: LinearClient
          private var letzterSync: Long? = null

          fun start(env: Map<String, String>) {
              val token = ⟦requireNotNull⟧(env["LINEAR_TOKEN"]) { "LINEAR_TOKEN fehlt" }
              client = LinearClient(token)
              letzterSync = 0L
          }

          fun inkrementell(): String {
              val seit = ⟦checkNotNull⟧(letzterSync) { "start() wurde nicht aufgerufen" }
              return client.aenderungenSeit(seit)
          }
      }
    gaps:
      - label: Später initialisiert
        hint: Ein Modifier für `var`-Properties mit nicht-nullable Typ, die nicht im Konstruktor gesetzt werden.
      - label: Argument prüfen
        hint: "`require…` prüft Argumente."
      - label: Zustand prüfen
        hint: "`check…` prüft den Zustand."
    explanation: |
      `lateinit` erlaubt eine nicht-nullable `var` ohne Initialwert; ein Zugriff vor `start()` würde mit `UninitializedPropertyAccessException` scheitern. `requireNotNull` wirft bei `null` eine `IllegalArgumentException`, `checkNotNull` eine `IllegalStateException`. Beide geben den Wert als nicht-nullable Typ zurück, `token` ist also `String` und `seit` ein `Long`. Die Lambda-Meldung wird nur im Fehlerfall erzeugt.
    resources:
      - title: Kotlin-API · requireNotNull
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin/require-not-null.html
      - title: Kotlin-API · checkNotNull
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin/check-not-null.html
  - id: sealed-suche
    type: gap
    title: Drei Gründe statt null
    prompt: |
      Ergänze das Sealed Interface und den `when`-Ausdruck. `NichtGefunden` hat keine Daten und existiert nur einmal. Das `when` soll ohne `else` auskommen.
    lang: kotlin
    code: |
      sealed interface Suche {
          data class Gefunden(val eintrag: Eintrag) : ⟦Suche⟧
          ⟦data object⟧ NichtGefunden : Suche
          data class Fehler(val grund: String) : Suche
      }

      fun finde(id: String, lokal: Map<String, Eintrag>): Suche {
          if (id.isBlank()) return Suche.Fehler("Leere ID")
          val eintrag = lokal[id] ?: return ⟦Suche.NichtGefunden⟧
          return Suche.Gefunden(eintrag)
      }

      fun beschreibe(s: Suche): String = when (s) {
          ⟦is Suche.Gefunden⟧ -> "Gefunden: ${s.eintrag.titel}"
          Suche.NichtGefunden -> "Keine Aufgabe mit dieser ID"
          is Suche.Fehler -> "Fehler: ${s.grund}"
      }
    gaps:
      - label: Obertyp
        hint: Jede Variante implementiert das Sealed Interface.
      - label: Singleton ohne Daten
        hint: Zwei Schlüsselwörter; das zweite kennst du aus `data class`.
        accept: ["object"]
      - label: Rückgabe bei fehlendem Eintrag
        hint: Der Wert, der „nicht gefunden“ ausdrückt.
      - label: Typprüfung
        hint: Mit dieser Prüfung wird `s` im Zweig zum passenden Untertyp gecastet.
    explanation: |
      Alle Varianten implementieren `Suche`. `data object` ist ein Singleton mit lesbarem `toString()`; ein einfaches `object` funktioniert auch. `lokal[id] ?: return Suche.NichtGefunden` steigt aus, wenn der Schlüssel fehlt. Im `when` macht `is Suche.Gefunden` aus `s` per Smart Cast ein `Gefunden`, deshalb ist `s.eintrag` erreichbar. Für das Objekt reicht der Vergleich ohne `is`. Weil der Compiler alle Varianten kennt, ist das `when` ohne `else` erschöpfend.
    resources:
      - title: Kotlin-Doku · Sealed classes and when
        url: https://kotlinlang.org/docs/sealed-classes.html#use-sealed-classes-with-when-expression
  - id: smart-cast-var
    type: bug
    title: Der Compiler traut dem Token nicht
    prompt: |
      Der Code kompiliert nicht. Die Fehlermeldung zu Zeile 6 lautet: `smart cast to 'String' is impossible, because 'token' is a mutable property that could be mutated concurrently.` Finde die fehlerhafte Zeile und korrigiere sie, ohne `!!` zu verwenden und ohne die Property zu ändern.
    lang: kotlin
    code: |
      class SyncService(private val client: ApiClient) {
          var token: String? = null

          fun sync() {
              if (token == null) return
              client.send(token)
          }
      }
    lines: [6]
    fix:
      - line: 6
        answers:
          - "token?.let { client.send(it) }"
          - "token?.let { t -> client.send(t) }"
          - "client.send(token ?: return)"
    explanation: |
      `token` ist eine `var`-Property. Zwischen der Prüfung in Zeile 5 und der Benutzung in Zeile 6 könnte ein anderer Thread sie auf `null` setzen, deshalb verweigert der Compiler den Smart Cast. `token?.let { … }` liest den Wert genau einmal und übergibt ihn als `it`. Noch klarer ist es, beide Zeilen durch `val aktuell = token ?: return` und `client.send(aktuell)` zu ersetzen. `token!!` würde kompilieren, macht aus dem Compilerfehler aber ein Laufzeitrisiko.
    resources:
      - title: Kotlin-Doku · Smart cast prerequisites
        url: https://kotlinlang.org/docs/typecasts.html#smart-cast-prerequisites
  - id: linear-ids
    type: bug
    title: Nur verknüpfte Aufgaben
    prompt: |
      `verknuepfteIds` soll die Linear-IDs aller lokalen Einträge liefern, die schon mit Linear verknüpft sind. Einträge ohne `linearId` sollen einfach fehlen. Der Code kompiliert nicht: `return type mismatch: expected 'String', actual 'String?'.` Finde die fehlerhafte Zeile und korrigiere sie.
    lang: kotlin
    code: |
      class Eintrag(val titel: String, val linearId: String?)

      fun verknuepfteIds(eintraege: List<Eintrag>): List<String> =
          eintraege.map { it.linearId }
    lines: [4]
    fix:
      - line: 4
        answers:
          - "eintraege.mapNotNull { it.linearId }"
          - "eintraege.mapNotNull(Eintrag::linearId)"
          - "eintraege.map { it.linearId }.filterNotNull()"
    explanation: |
      `map { it.linearId }` erzeugt eine `List<String?>`, die Funktion verspricht aber `List<String>`. `mapNotNull` bildet ab und lässt alle `null`-Ergebnisse weg – genau die gewünschte Semantik in einem Schritt. `map { … }.filterNotNull()` ist gleichwertig, baut aber eine Zwischenliste. `map { it.linearId!! }` würde kompilieren und beim ersten unverknüpften Eintrag abstürzen.
    resources:
      - title: Kotlin-API · mapNotNull
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.collections/map-not-null.html
      - title: Kotlin-Doku · Collections of a nullable type
        url: https://kotlinlang.org/docs/null-safety.html#collections-of-a-nullable-type
  - id: profil-cache-erklaeren
    type: explain
    title: Warum die lokale Kopie?
    prompt: |
      Erkläre in eigenen Worten, wie `profil()` arbeitet. Warum steht dort `val vorhanden = cache` statt `if (cache != null) return cache`? Was bewirkt `?: error(…)`, und welche Garantie bekommt der Aufrufer? Nenne auch eine Schwäche, die dir im Code-Review auffallen würde.
    lang: kotlin
    code: |
      class ProfilRepository(private val api: ProfilApi) {
          private var cache: Profil? = null

          fun profil(): Profil {
              val vorhanden = cache
              if (vorhanden != null) return vorhanden
              val geladen = api.lade() ?: error("API lieferte kein Profil für ${api.nutzerId}")
              cache = geladen
              return geladen
          }
      }
    points:
      - "`cache` ist eine `var`-Property; ein Smart Cast darauf ist unmöglich. Die lokale Kopie `vorhanden` lässt sich smart casten."
      - "`?: error(…)` wirft eine `IllegalStateException`, wenn die API `null` liefert; danach ist `geladen` ein nicht-nullable `Profil`."
      - Der Rückgabetyp `Profil` ohne `?` verspricht dem Aufrufer, dass er nie `null` behandeln muss.
      - Das Profil wird nach dem ersten erfolgreichen Laden zwischengespeichert.
      - "Schwäche: nicht thread-sicher – zwei gleichzeitige Aufrufe können beide laden; außerdem wird ein fehlendes Profil als Exception statt als Ergebnis-Typ gemeldet."
    explanation: |
      `profil()` ist ein einfacher Cache. Weil `cache` eine `var`-Property ist, kann der Compiler nach `cache != null` keinen Smart Cast machen – ein anderer Thread könnte den Wert inzwischen ändern. Die lokale Kopie `vorhanden` kann sich nicht mehr ändern, also ist sie nach der Prüfung ein `Profil`. `api.lade() ?: error(…)` behandelt den `null`-Fall als Fehler: `error` wirft eine `IllegalStateException` mit Nutzer-ID in der Meldung, und weil `error` den Typ `Nothing` hat, ist `geladen` danach nicht-nullable. Der Aufrufer bekommt die Garantie „entweder ein Profil oder eine Exception, nie `null`“. Im Review würde ich fragen, ob gleichzeitige Aufrufe möglich sind – ohne Synchronisierung laden dann beide – und ob „kein Profil“ wirklich ein Programmierfehler ist oder ein erwarteter Fall, der besser als Sealed Result modelliert wäre.
    resources:
      - title: Kotlin-Doku · Smart cast prerequisites
        url: https://kotlinlang.org/docs/typecasts.html#smart-cast-prerequisites
      - title: Kotlin-API · error
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin/error.html
  - id: lazy-waehlen
    type: choice
    title: Die passende Deklaration
    prompt: |
      Ein Markdown-Parser ist teuer zu erzeugen. Er soll erst beim ersten Rendern entstehen und danach wiederverwendet werden. Er wird nie ersetzt. Welche Deklaration passt am besten?
    options:
      - text: "`private val parser: MarkdownParser by lazy { MarkdownParser() }`"
        correct: true
        why: Erzeugt den Parser beim ersten Zugriff, genau einmal, thread-sicher, und die Property ist unveränderlich.
      - text: "`lateinit var parser: MarkdownParser`"
        correct: false
        why: "`lateinit` erzeugt nichts selbst – jemand müsste den Parser von außen zuweisen. Außerdem wäre die Property veränderbar."
      - text: "`var parser: MarkdownParser? = null`"
        correct: false
        why: Jeder Zugriff müsste `null` behandeln und das Erzeugen selbst erledigen – genau das, was `lazy` dir abnimmt.
      - text: "`private val parser = MarkdownParser()`"
        correct: false
        why: Erzeugt den Parser sofort beim Erzeugen des Objekts, auch wenn nie gerendert wird.
    explanation: |
      `by lazy` verbindet verzögerte Erzeugung mit Unveränderlichkeit: Der Block läuft beim ersten Zugriff, das Ergebnis wird gespeichert, und standardmäßig synchronisiert Kotlin den ersten Zugriff. `lateinit` passt, wenn der Wert von außen kommt (Dependency Injection, Test-Setup). Eine nullable Property ist richtig, wenn der Wert im Betrieb legitim fehlen kann.
    resources:
      - title: Kotlin-Doku · Lazy properties
        url: https://kotlinlang.org/docs/delegated-properties.html#lazy-properties
      - title: Kotlin-API · LazyThreadSafetyMode
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin/-lazy-thread-safety-mode/
  - id: konfig-laden
    type: practice
    title: Sync-Konfiguration ohne null nach außen
    prompt: |
      Bear liest die Sync-Konfiguration aus Umgebungsvariablen (`Map<String, String>`). Schreibe `ladeKonfig(env)`, die **kein** `null` zurückgibt, sondern ein Sealed Result:

      - `Ok(konfig)` mit `SyncKonfig(token, teamId, intervallMinuten)`.
      - `Fehlt(schluessel)` mit **allen** fehlenden oder leeren Pflichtschlüsseln (`LINEAR_TOKEN`, `LINEAR_TEAM`).
      - `Ungueltig(meldung)`, wenn `SYNC_INTERVALL` keine Zahl oder kleiner als 15 ist. Fehlt `SYNC_INTERVALL`, gilt 15.

      Schreibe außerdem `beschreibe(ergebnis)` mit einem erschöpfenden `when` ohne `else` und teste in `main` alle drei Fälle. Kein `!!`.
    lang: kotlin
    starter: |
      data class SyncKonfig(val token: String, val teamId: String, val intervallMinuten: Long)

      sealed interface KonfigErgebnis {
          // Ok, Fehlt, Ungueltig
      }

      fun ladeKonfig(env: Map<String, String>): KonfigErgebnis {
          TODO()
      }

      fun main() {
          // mindestens vier Aufrufe: gültig, beide Schlüssel fehlen, Intervall "fünf", Intervall "5"
      }
    solution: |
      data class SyncKonfig(val token: String, val teamId: String, val intervallMinuten: Long)

      sealed interface KonfigErgebnis {
          data class Ok(val konfig: SyncKonfig) : KonfigErgebnis
          data class Fehlt(val schluessel: List<String>) : KonfigErgebnis
          data class Ungueltig(val meldung: String) : KonfigErgebnis
      }

      fun ladeKonfig(env: Map<String, String>): KonfigErgebnis {
          val token = env["LINEAR_TOKEN"]
          val teamId = env["LINEAR_TEAM"]
          if (token.isNullOrBlank() || teamId.isNullOrBlank()) {
              val fehlend = mutableListOf<String>()
              if (token.isNullOrBlank()) fehlend += "LINEAR_TOKEN"
              if (teamId.isNullOrBlank()) fehlend += "LINEAR_TEAM"
              return KonfigErgebnis.Fehlt(fehlend)
          }
          // Smart Cast: token und teamId sind ab hier String
          val intervallText = env["SYNC_INTERVALL"] ?: "15"
          val intervall = intervallText.toLongOrNull()
              ?: return KonfigErgebnis.Ungueltig("SYNC_INTERVALL ist keine Zahl: $intervallText")
          if (intervall < 15) return KonfigErgebnis.Ungueltig("SYNC_INTERVALL muss mindestens 15 sein")
          return KonfigErgebnis.Ok(SyncKonfig(token, teamId, intervall))
      }

      fun beschreibe(e: KonfigErgebnis): String = when (e) {
          is KonfigErgebnis.Ok -> "Sync alle ${e.konfig.intervallMinuten} min für Team ${e.konfig.teamId}"
          is KonfigErgebnis.Fehlt -> "Es fehlen: ${e.schluessel.joinToString()}"
          is KonfigErgebnis.Ungueltig -> "Ungültig: ${e.meldung}"
      }

      fun main() {
          println(beschreibe(ladeKonfig(mapOf("LINEAR_TOKEN" to "lin_api_x", "LINEAR_TEAM" to "BEAR"))))
          // Sync alle 15 min für Team BEAR
          println(beschreibe(ladeKonfig(mapOf("LINEAR_TOKEN" to " "))))
          // Es fehlen: LINEAR_TOKEN, LINEAR_TEAM
          println(beschreibe(ladeKonfig(mapOf("LINEAR_TOKEN" to "x", "LINEAR_TEAM" to "BEAR", "SYNC_INTERVALL" to "fünf"))))
          // Ungültig: SYNC_INTERVALL ist keine Zahl: fünf
          println(beschreibe(ladeKonfig(mapOf("LINEAR_TOKEN" to "x", "LINEAR_TEAM" to "BEAR", "SYNC_INTERVALL" to "5"))))
          // Ungültig: SYNC_INTERVALL muss mindestens 15 sein
      }
    checklist:
      - "`ladeKonfig` hat den Rückgabetyp `KonfigErgebnis` ohne `?`, und im ganzen Code steht kein `!!`."
      - Fehlen beide Pflichtschlüssel, meldet `Fehlt` **beide** – nicht nur den ersten.
      - Leere oder nur aus Leerzeichen bestehende Werte zählen als fehlend (`isNullOrBlank()`).
      - "`toLongOrNull()` mit `?: return …` behandelt ungültige Zahlen ohne try/catch."
      - Nach der Prüfung nutzt du `token` und `teamId` per Smart Cast als `String`, ohne erneute Prüfung.
      - "`beschreibe` hat ein `when` ohne `else`, und alle vier Testaufrufe liefern die erwarteten Meldungen."
    explanation: |
      Die Funktion wandelt unsichere Rohdaten an einer einzigen Stelle in einen sauberen Typ um. `isNullOrBlank()` hat einen Contract: Liefert es `false`, weiß der Compiler, dass der Wert nicht `null` ist. Deshalb sind `token` und `teamId` nach dem `if` mit `return` ohne weiteres Zutun `String`. `toLongOrNull()` liefert `null` statt einer `NumberFormatException`, und `?: return` macht daraus ein `Ungueltig`. Die 15 Minuten entsprechen dem kürzesten Intervall, das WorkManager für periodische Arbeit erlaubt. Der Aufrufer bekommt drei klar benannte Fälle statt eines `null`, das nichts erklärt.
    resources:
      - title: Kotlin-API · isNullOrBlank
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.text/is-null-or-blank.html
      - title: Kotlin-API · toLongOrNull
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.text/to-long-or-null.html
