    hint: Der vorhandene Parameter kann direkt weitergereicht werden.
  explanation: Die Komponente liest einen Wert und meldet Änderungswünsche. Sie kennt weder Speicherort noch Geschäftslogik.
  resources:
  - *id001
- id: effekt-key
  type: gap
  title: Die aktuelle ID laden
  prompt: Ergänze die Effekt-API und den Key. Ein ID-Wechsel soll die laufende Ladeoperation ersetzen.
  lang: kotlin
  code: |-
    @Composable
    fun Detail(id: String, load: suspend (String) -> Unit) {
        val latestLoad by rememberUpdatedState(load)
        ⟦LaunchedEffect⟧(⟦id⟧) { latestLoad(id) }
    }
  gaps:
  - label: Lücke 1
    hint: Die Compose-API startet eine Coroutine mit Composition-Lebensdauer.
  - label: Lücke 2
    hint: Verwende die Kennung der geladenen Daten.
  explanation: Die ID definiert die Identität der Arbeit. Bei Änderung wird die alte Coroutine abgebrochen; der
    Callback bleibt aktuell, ohne allein einen Neustart auszulösen.
  resources:
  - *id001
- id: filter-saver
  type: gap
  title: Ein State Holder übersteht die Drehung
  prompt: Ergänze den `Saver`, der `FilterState` in einfache Werte zerlegt und wieder aufbaut, und die Funktion, die ihn benutzt.
  lang: kotlin
  code: |-
    companion object {
        val Saver = ⟦listSaver⟧<FilterState, Any>(
            save = { listOf(it.query, it.onlyPinned) },
            restore = { FilterState(it[0] as String, it[1] as Boolean) },
        )
    }

    @Composable
    fun rememberFilterState(): FilterState =
        ⟦rememberSaveable⟧(saver = ⟦FilterState.Saver⟧) { FilterState() }
  gaps:
  - label: Saver-Fabrik
    hint: Sie zerlegt in eine Liste.
  - label: remember-Variante
    hint: Die Variante, die über Configuration Changes und Prozessverlust hinweg wiederherstellt.
  - label: Saver
    hint: Das Objekt aus dem Companion.
  explanation: "`rememberSaveable` legt Werte in ein `Bundle`. Eine eigene Klasse passt da nicht hinein, deshalb braucht sie einen `Saver`: `listSaver` speichert `query` und `onlyPinned` als Liste und baut daraus beim Wiederherstellen ein neues `FilterState`. Ohne `saver` gäbe es zur Laufzeit einen Fehler."
  resources:
  - title: Android · Ways to store state
    url: https://developer.android.com/develop/ui/compose/state-saving#ui-logic
- id: lifecycle-abmelden
  type: gap
  title: Anmelden und wieder abmelden
  prompt: Ergänze den Effekt für eine Registrierung mit Aufräumen und das Abmelden.
  lang: kotlin
  code: |-
    val lifecycleOwner = LocalLifecycleOwner.current
    ⟦DisposableEffect⟧(lifecycleOwner) {
        val observer = LifecycleEventObserver { _, event ->
            if (event == Lifecycle.Event.ON_RESUME) latestOnResume()
        }
        lifecycleOwner.lifecycle.addObserver(observer)
        ⟦onDispose⟧ {
            lifecycleOwner.lifecycle.⟦removeObserver(observer)⟧
        }
    }
  gaps:
  - label: Effekt
    hint: Der Effekt, der einen Aufräumblock verlangt.
  - label: Aufräumblock
    hint: Er läuft beim Verlassen der Composition oder bei neuem Key.
  - label: Abmelden
    hint: Das Gegenstück zu `addObserver`.
  explanation: "`DisposableEffect` verlangt am Ende `onDispose`, sonst kompiliert der Block nicht. Dort meldest du ab, was du angemeldet hast. Wechselt der `lifecycleOwner`, etwa weil die Composable in einen anderen Navigationseintrag wandert, meldet Compose beim alten ab und beim neuen an."
  resources:
  - title: Android · DisposableEffect
    url: https://developer.android.com/develop/ui/compose/side-effects#disposableeffect
