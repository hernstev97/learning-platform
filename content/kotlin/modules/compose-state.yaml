id: compose-state
title: Compose State & Side Effects
level: 2
minutes: 210
place: pc
summary: Beobachtbaren Zustand richtig besitzen, wiederherstellen und mit kontrollierten Effekten verbinden – von remember mit
  Keys über eigene State Holder bis zu produceState und snapshotFlow.
goals:
- Du unterscheidest remember, remember mit Keys, Saved State und dauerhafte Speicherung.
- Du hebst gemeinsam benötigten Zustand zu einem eindeutigen Besitzer und baust eigene State Holder mit Saver.
- Du liest Flow lifecyclebewusst und wählst Effekt-Keys begründet.
- Du wählst zwischen LaunchedEffect, DisposableEffect, rememberCoroutineScope, produceState und snapshotFlow nach Lebensdauer und Auslöser.
- Du erkennst unbeobachtbare Mutationen, eingefrorene Werte und veraltete Closures.
