- id: avatar-veraltet
  type: bug
  title: Der alte Avatar bleibt stehen
  prompt: Wechselt der Nutzer in der Detailansicht zum nächsten Kontakt, ändert sich `url`, aber das Bild zeigt weiter den ersten Kontakt. Finde die Zeile und korrigiere sie.
  lang: kotlin
  code: |-
    @Composable
    fun Avatar(url: String, loader: ImageLoader) {
        val image by produceState<Bitmap?>(initialValue = null) {
            value = loader.load(url)
        }
        if (image == null) Placeholder() else Image(image!!.asImageBitmap(), null)
    }
  lines:
  - 3
  fix:
  - line: 3
    answers:
    - val image by produceState<Bitmap?>(initialValue = null, url) {
    - val image by produceState<Bitmap?>(null, url) {
    - val image by produceState<Bitmap?>(initialValue = null, key1 = url) {
  explanation: "`produceState` startet seinen Block wie `LaunchedEffect` nur beim Betreten der Composition und bei neuen Keys. Ohne `url` als Key lädt er einmal und nie wieder. Mit Key bricht Compose den alten Ladevorgang ab und startet einen neuen, sobald sich die Adresse ändert."
