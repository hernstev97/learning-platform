id: compose-state
title: Compose State & Side Effects
level: 2
minutes: 160
summary: Beobachtbaren Zustand richtig besitzen, wiederherstellen und mit kontrollierten Effekten verbinden.
goals:
- Du unterscheidest remember, Saved State und dauerhafte Speicherung.
- Du hebst gemeinsam benötigten Zustand zu einem eindeutigen Besitzer.
- Du liest Flow lifecyclebewusst und wählst Effekt-Keys begründet.
- Du erkennst unbeobachtbare Mutationen und veraltete Closures.
resources:
- &id001
  title: Android · State in Compose
  url: https://developer.android.com/develop/ui/compose/state
- title: Android · State hoisting
  url: https://developer.android.com/develop/ui/compose/state-hoisting
- title: Android · Save UI state
  url: https://developer.android.com/develop/ui/compose/state-saving
- title: Android · Side effects
  url: https://developer.android.com/develop/ui/compose/side-effects
lesson: |
  Bears Eingabefeld enthält einen noch nicht gespeicherten Gedanken. Du tippst, öffnest einen Hinweis und drehst das Gerät. Der Text soll weiterhin da sein; ein bereits ausgelöster Speichervorgang soll dagegen nicht bei jeder Neuberechnung der Oberfläche erneut starten. Beide Anforderungen betreffen Zustand, haben aber unterschiedliche Lebensdauern und Verantwortlichkeiten.

  Compose macht Oberflächen aus Zustand. Damit das zuverlässig funktioniert, muss eine Änderung beobachtbar sein, der Besitzer eindeutig feststehen und eine Nebenwirkung kontrolliert gestartet werden. Dieses Modul ergänzt die Layout-Grundlagen um genau diese Mechanik. Die Beispiele verwenden die wertbasierte TextField-API, die auch im Bear-Track vorkommt. Die Imports stammen aus `androidx.compose.runtime`, `runtime.saveable`, Material 3 und den jeweils genannten Lifecycle-Bibliotheken.

  ## Beobachtbarer Zustand und remember

  Eine gewöhnliche lokale Variable ist keine dauerhafte UI-Datenquelle. Bei erneutem Aufruf der Composable würde sie wieder initialisiert. `remember` bewahrt ein Objekt an einer Position der Composition. `mutableStateOf` erzeugt einen beobachtbaren Wert. Erst die Kombination löst beide Probleme: erhalten und Änderungen bemerken.

  ```kotlin
  @Composable
  fun Counter() {
      var count by remember { mutableStateOf(0) }
      Button(onClick = { count += 1 }) {
          Text("$count")
      }
  }
  ```

  Die Property-Delegation mit `by` benötigt die Runtime-Imports `getValue` und `setValue`. Ohne Delegation schreibst du `count.value`. Compose verfolgt, wo ein `State` gelesen wird. Ändert sich sein Wert, kann der lesende Bereich erneut ausgeführt werden. Die [State-Dokumentation](https://developer.android.com/develop/ui/compose/state) beschreibt diese Verbindung.

  ```kotlin
  @Composable
  fun SimpleCounter() {
      val count = remember { mutableStateOf(0) }
      Button(onClick = { count.value += 1 }) {
          Text("${count.value}")
      }
  }
  ```

  `remember` allein macht ein beliebiges Objekt nicht beobachtbar. Eine `MutableList` in `remember` lässt sich zwar verändern, doch `add` informiert Compose nicht automatisch. Entweder ersetzt du einen beobachtbaren, unveränderlich behandelten Listenwert oder verwendest eine Snapshot-State-Collection. Für einen Screen-State ist die erste Variante oft leichter nachzuvollziehen:

  ```kotlin
  var thoughts by remember { mutableStateOf(listOf<String>()) }
  // Im onClick-Handler:
  thoughts = thoughts + "Backup prüfen"
  ```

  Eine Mutation am Inneren eines normalen Objekts wird nicht durch ein äußeres `mutableStateOf` magisch sichtbar. Neue Werte mit `copy` oder neue Listen halten die Zustandsübergänge explizit. Dabei ist Kotlin `List` eine lesende Schnittstelle, keine Garantie, dass nirgendwo sonst eine veränderbare Referenz auf denselben Container existiert.

  ## Lebensdauer: remember, rememberSaveable, ViewModel

  `remember` lebt mit seiner Position in der Composition. Verlässt die Composable diese Position, verschwindet der Wert. Eine Konfigurationsänderung mit Neuerzeugung der Activity ist deshalb eine andere Grenze als Recomposition. Für kleinen wiederherstellbaren UI-Zustand gibt es `rememberSaveable`:

  ```kotlin
  @Composable
  fun DraftField() {
      var draft by rememberSaveable { mutableStateOf("") }
      TextField(value = draft, onValueChange = { draft = it })
  }
  ```

  Der Text kann über Androids Saved-State-Mechanismus wiederhergestellt werden. Das gilt für unterstützte Wiederherstellungsfälle, etwa systembedingte Prozessneuerzeugung, nicht als Garantie nach bewusstem Entfernen der Aufgabe. Es ist kein Ersatz für dauerhaftes Speichern. Große Listen und komplette Datenbankobjekte gehören nicht in das Bundle. Speichere kleine Schlüssel, Filter oder Eingaben und lade fachliche Daten erneut. Die [Saved-State-Empfehlungen](https://developer.android.com/develop/ui/compose/state-saving) erläutern Grenzen und Größenrisiken.

  | Bedarf | Geeigneter Besitzer |
  | --- | --- |
  | Aufgeklappte lokale Darstellung | `remember`, bei gewünschter Wiederherstellung `rememberSaveable` |
  | Kleiner Entwurf im UI | `rememberSaveable` oder ein State Holder mit Saved State |
  | Screen-Zustand und Geschäftslogik | ViewModel |
  | Dauerhaft gespeicherte Gedanken | Repository und Datenbank |

  Ein ViewModel überlebt Konfigurationsänderungen seines Owners, aber keinen Prozessverlust aus eigener Kraft. `SavedStateHandle` speichert kleine Wiederherstellungsdaten. Ob ein ungespeicherter Gedanke bei jedem Start zurückkommen soll, ist eine Produktentscheidung; erst danach wählst du die passende Persistenz. Mehr dazu folgt im Architekturmodul.

  ## State Hoisting: ein Besitzer, klare Ereignisse

  Wenn Eingabefeld und Speicherbutton denselben Text brauchen, dürfen sie keine unabhängigen Kopien halten. Verschiebe den Zustand zu ihrem gemeinsamen Besitzer. Übergib nach unten einen Wert und einen Callback für Änderungswünsche. Diese Technik heißt [State Hoisting](https://developer.android.com/develop/ui/compose/state-hoisting).

  ```kotlin
  @Composable
  fun DraftInput(
      value: String,
      onValueChange: (String) -> Unit,
      onSave: () -> Unit,
      modifier: Modifier = Modifier,
  ) {
      Column(modifier) {
          TextField(value = value, onValueChange = onValueChange)
          Button(onClick = onSave, enabled = value.isNotBlank()) {
              Text("Speichern")
          }
      }
  }
  ```

  Diese Komponente muss weder einen ViewModel-Typ noch eine Datenbank kennen. Eine Preview kann einen festen Zustand einsetzen; ein UI-Test kann den Callback beobachten. Der Besitzer darf Eingaben validieren oder begrenzen. Das Kind fordert eine Änderung an, es setzt sie nicht heimlich an einer zweiten Stelle durch.

  ```kotlin
  @Composable
  fun DraftDemo() {
      var draft by rememberSaveable { mutableStateOf("") }
      DraftInput(
          value = draft,
          onValueChange = { draft = it },
          onSave = { draft = "" },
      )
  }
  ```

  Die Demo leert nur lokal und speichert noch nichts. In einer echten App leerst du den Entwurf nach erfolgreicher Übernahme durch den zuständigen State Holder, damit ein Fehler keinen Text verliert. Hoisting bedeutet auch nicht „jeder Zustand ins ViewModel“: Reine Scroll- oder Animationslogik darf nahe der UI bleiben.

  > [!PRAXIS]
  > Trenne eine Route, die Daten und ViewModel verbindet, von einer Screen-Composable mit Zustand und Callbacks. So lassen sich Ladezustand, leere Liste und Fehlerbild direkt als Preview und UI-Test aufbauen.

  ## Flow lifecyclebewusst lesen und Zustand ableiten

  Ein ViewModel kann `StateFlow<UiState>` bereitstellen. Auf Android liest die UI diesen Flow mit `collectAsStateWithLifecycle()` aus `androidx.lifecycle.compose`. Der Collector folgt dem Lifecycle und sammelt standardmäßig nur im aktiven Bereich ab `STARTED`. Die [Compose-Integration für beobachtbare Typen](https://developer.android.com/develop/ui/compose/state) nennt die benötigte Dependency.

  ```kotlin
  @Composable
  fun ThoughtsRoute(viewModel: ThoughtsViewModel) {
      val state by viewModel.uiState.collectAsStateWithLifecycle()
      ThoughtsScreen(state = state, onRetry = viewModel::retry)
  }
  ```

  Ein zweites `remember { mutableStateOf(state) }` wäre keine Integration, sondern eine beim ersten Aufruf eingefrorene Kopie. Verwende den gelieferten Zustand direkt. Änderungen am Lifecycle beenden außerdem nicht automatisch jede upstream laufende Arbeit: Ob ein heißer Flow weiter produziert, hängt von seinem Besitzer und seiner Sharing-Strategie ab.

  Mancher Eingabezustand verändert sich viel häufiger als die sichtbare Entscheidung. Beim Scrollen brauchst du möglicherweise nur die Antwort „weit genug unten?“. Dafür kann `derivedStateOf` nützlich sein:

  ```kotlin
  val listState = rememberLazyListState()
  val showJumpButton by remember {
      derivedStateOf { listState.firstVisibleItemIndex > 0 }
  }
  ```

  Das [Effekt-Kapitel zu derivedStateOf](https://developer.android.com/develop/ui/compose/side-effects#derivedstateof) warnt vor unnötigem Einsatz. Ein gewöhnliches `val label = "$count Gedanken"` braucht kein eigenes abgeleitetes State-Objekt. Nutze es, wenn die beobachteten Eingaben häufiger wechseln als das benötigte Ergebnis, und miss bei Performancefragen den tatsächlichen Effekt.

  ## Side Effects folgen Identität und Lebensdauer

  Ein Composable-Körper darf mehrfach oder ohne abschließend sichtbares Ergebnis laufen. Starte dort keine unkontrollierten Requests. `LaunchedEffect(key)` startet eine Coroutine, wenn der Effekt in die Composition kommt; bei einem neuen Key wird die alte abgebrochen und eine neue gestartet. Beim Verlassen wird ebenfalls abgebrochen.

  ```kotlin
  @Composable
  fun DelayedHint(thoughtId: String, onReady: (String) -> Unit) {
      val latestOnReady by rememberUpdatedState(onReady)
      LaunchedEffect(thoughtId) {
          delay(800)
          latestOnReady(thoughtId)
      }
  }
  ```

  Hier bestimmt die ID, welche Warteoperation gemeint ist. Ein neuer Callback soll die Wartezeit nicht von vorne starten; `rememberUpdatedState` liefert dessen aktuelle Fassung. Würde die ID fehlen, könnte nach einem Wechsel noch die alte ID verwendet werden. Ein konstanter Key wie `Unit` bedeutet „für diese Effektinstanz“, nicht „einmal für die gesamte App“. Siehe [LaunchedEffect und Effekt-Keys](https://developer.android.com/develop/ui/compose/side-effects#restarting-effects).

  Für einen expliziten Klick ist `rememberCoroutineScope` passend: Der Handler startet dann die konkrete UI-Aktion, beispielsweise `snackbarHostState.showSnackbar(...)`. Für eine Registrierung mit Aufräumen ist `DisposableEffect` zuständig. Ein Listener wird angemeldet und in `onDispose` wieder entfernt. `SideEffect` veröffentlicht Zustand an nicht von Compose verwalteten Code nach erfolgreicher Composition. Wähle nach Lebensdauer, nicht danach, welche API am kürzesten aussieht.

  > [!INTERVIEW]
  > Erkläre `remember` und `LaunchedEffect` getrennt: `remember` erhält ein Objekt, `LaunchedEffect` verwaltet eine Coroutine. Keys bestimmen ihre Identität. Keines von beiden speichert Daten dauerhaft oder ersetzt die Fachlogik eines ViewModels.

  ## Häufige Fehler

  - **Liste intern mutiert:** Compose sieht die Änderung nicht. Ersetze den beobachteten Wert oder nutze eine State-Collection.
  - **Eingangswert mit `remember` eingefroren:** Verwende Parameter direkt oder definiere bewusst passende Keys.
  - **Request im Composable-Körper:** Recomposition startet doppelte Arbeit. Nutze einen fachlichen Owner oder einen passenden Effekt.
  - **Falsche Effekt-Keys:** Alte Daten oder unnötige Neustarts sind die Folge.
  - **Entwurf vor Erfolg gelöscht:** Bei Fehlern verliert der Nutzer seine Arbeit.

  ## Zusammenfassung

  - Zustand braucht einen beobachtbaren Wert und einen passenden Besitzer.
  - `remember` erhält Composition-Zustand; Saved State stellt kleine Werte wieder her.
  - State Hoisting verbindet einen Besitzer mit Werten und Callbacks.
  - Flows werden auf Android lifecyclebewusst gelesen.
  - `derivedStateOf` ist ein gezieltes Werkzeug für unterschiedlich häufige Änderungen.
  - Effekte brauchen bewusst gewählte Keys und Aufräumregeln.
  - Persistenz und erfolgreicher Abschluss sind fachliche Entscheidungen.
exercises:
- id: zustand-besitzer
  type: choice
  title: Wer hält den Entwurf?
  prompt: TextField und Speicherbutton benötigen denselben Entwurf. Welche Lösung erhält eine eindeutige Datenquelle?
  options:
  - text: Ein gemeinsamer Besitzer übergibt Text und Callbacks.
    correct: true
    why: Beide Kinder lesen denselben Zustand.
  - text: Jedes Kind merkt sich seine eigene Kopie.
    correct: false
    why: Die Kopien können auseinanderlaufen.
  - text: Die TextField-Composable schreibt bei jedem Aufruf in die Datenbank.
    correct: false
    why: Composition ist kein zuverlässiger Auslöser für Speicheraktionen.
  explanation: State Hoisting verschiebt den Zustand zur gemeinsamen benötigten Ebene. Es dupliziert ihn nicht und
    legt die Änderungsrechte offen.
  resources:
  - *id001
- id: udf-ablauf
  type: order
  title: Eine Eingabe wird sichtbar
  prompt: Sortiere den Ablauf ab dem Tippen einer neuen Eingabe.
  lang: text
  lines: |-
    Nutzer tippt neuen Text
    onValueChange meldet den Text
    Besitzer aktualisiert beobachtbaren Zustand
    Compose plant betroffene Recomposition
    TextField erhält den neuen Wert
  explanation: Die UI meldet einen Wunsch, der Besitzer ändert den Wert. Die neue Darstellung ergibt sich aus dem
    neuen Zustand.
  resources:
  - *id001
- id: immutable-copy
  type: output
  title: Neue Liste, alter Wert
  prompt: Was gibt dieses Programm aus? Gib jede Ausgabezeile an.
  lang: kotlin
  code: |-
    fun main() {
        val old = listOf("A")
        val next = old + "B"
        println(old.size)
        println(next.size)
    }
  expected: |-
    1
    2
  explanation: '`+` erzeugt hier eine neue Liste. Der alte Wert bleibt unverändert, was explizite UI-Zustandsübergänge
    erleichtert.'
  resources:
  - *id001
- id: data-copy
  type: output
  title: Eine Zustandskopie
  prompt: Was gibt dieses Programm aus? Gib jede Ausgabezeile an.
  lang: kotlin
  code: |-
    data class UiState(val draft: String, val saving: Boolean)
    fun main() {
        val before = UiState("Plan", false)
        val after = before.copy(saving = true)
        println(before.saving)
        println(after.draft)
    }
  expected: |-
    false
    Plan
  explanation: '`copy` erzeugt ein neues Objekt und übernimmt unveränderte Felder. Das Original wird nicht verändert.'
  resources:
  - *id001
- id: remember-saveable
  type: gap
  title: Kleinen Entwurf wiederherstellen
  prompt: Ergänze die API für kleinen wiederherstellbaren UI-Zustand und den beobachtbaren Anfangswert.
  lang: kotlin
  code: |-
    @Composable
    fun Draft() {
        var text by ⟦rememberSaveable⟧ { ⟦mutableStateOf("")⟧ }
        TextField(value = text, onValueChange = { text = it })
    }
  gaps:
  - label: Lücke 1
    hint: Die API erweitert remember um Saved State.
  - label: Lücke 2
    hint: Gesucht ist ein MutableState mit leerem String.
  explanation: Der Saved-State-Mechanismus kann diesen String wiederherstellen. Die State-Hülle sorgt für Beobachtbarkeit;
    dauerhafte Ablage ist damit nicht gemeint.
  resources:
  - *id001
- id: state-hoisting
  type: gap
  title: Ereignisse nach oben geben
  prompt: Ergänze den Callback-Typ und verwende den Callback direkt im TextField.
  lang: kotlin
  code: |-
    @Composable
    fun Draft(value: String, onChange: ⟦(String) -> Unit⟧) {
        TextField(value = value, onValueChange = ⟦onChange⟧)
    }
  gaps:
  - label: Lücke 1
    hint: Der Callback nimmt String und liefert Unit.
  - label: Lücke 2
    hint: Der vorhandene Parameter kann direkt weitergereicht werden.
  explanation: Die Komponente liest einen Wert und meldet Änderungswünsche. Sie kennt weder Speicherort noch Geschäftslogik.
  resources:
  - *id001
- id: effekt-key
  type: gap
  title: Die aktuelle ID laden
  prompt: Ergänze die Effekt-API und den Key. Ein ID-Wechsel soll die laufende Ladeoperation ersetzen.
  lang: kotlin
  code: |-
    @Composable
    fun Detail(id: String, load: suspend (String) -> Unit) {
        val latestLoad by rememberUpdatedState(load)
        ⟦LaunchedEffect⟧(⟦id⟧) { latestLoad(id) }
    }
  gaps:
  - label: Lücke 1
    hint: Die Compose-API startet eine Coroutine mit Composition-Lebensdauer.
  - label: Lücke 2
    hint: Verwende die Kennung der geladenen Daten.
  explanation: Die ID definiert die Identität der Arbeit. Bei Änderung wird die alte Coroutine abgebrochen; der
    Callback bleibt aktuell, ohne allein einen Neustart auszulösen.
  resources:
  - *id001
- id: liste-beobachten
  type: bug
  title: Der Zähler bleibt stehen
  prompt: Nach Klick ändert sich die normale MutableList, die Oberfläche bekommt aber keine State-Änderung. Ersetze
    die Deklaration durch eine Snapshot-State-Liste.
  lang: kotlin
  code: |-
    @Composable
    fun Counter() {
        val values = remember { mutableListOf<String>() }
        Button(onClick = { values.add("A") }) { Text("${values.size}") }
    }
  lines:
  - 3
  fix:
  - line: 3
    answers:
    - val values = remember { mutableStateListOf<String>() }
  explanation: '`remember` bewahrt nur das Objekt. `mutableStateListOf` macht strukturelle Änderungen der Liste
    für Compose beobachtbar.'
  resources:
  - *id001
- id: effekt-callback
  type: explain
  title: Neuer Callback ohne neue Wartezeit
  prompt: Erkläre Key, aktuelle Callback-Referenz und Abbruchverhalten.
  lang: kotlin
  code: |-
    @Composable
    fun Hint(id: String, onDone: () -> Unit) {
        val latest by rememberUpdatedState(onDone)
        LaunchedEffect(id) { delay(500); latest() }
    }
  points:
  - Ein neuer id-Wert ersetzt den Effekt.
  - rememberUpdatedState hält den Callback aktuell.
  - Eine reine Callback-Änderung startet die Verzögerung nicht neu.
  - Verlassen der Composition bricht die Effekt-Coroutine ab.
  explanation: Die ID beschreibt, zu welcher Sache die Warteoperation gehört. Der Callback ist austauschbares Verhalten
    innerhalb derselben Operation. Diese Trennung verhindert veraltete Closures und unnötige Neustarts.
  resources:
  - *id001
- id: entwurf-screen
  type: practice
  title: Eine kontrollierte Eingabemaske
  prompt: Baue eine zustandslose `DraftScreen`-Composable und einen lokalen Demo-Besitzer. Leere Eingaben dürfen
    nicht abgesendet werden. Die Demo zeigt zuletzt übernommene Eingabe an; sie behauptet keine Datenbankpersistenz.
  lang: kotlin
  solution: |-
    @Composable
    fun DraftScreen(value: String, onChange: (String) -> Unit, onSave: () -> Unit) {
        Column {
            TextField(value = value, onValueChange = onChange)
            Button(onClick = onSave, enabled = value.isNotBlank()) { Text("Übernehmen") }
        }
    }
    @Composable
    fun DraftDemo() {
        var draft by rememberSaveable { mutableStateOf("") }
        var accepted by rememberSaveable { mutableStateOf("") }
        Column {
            DraftScreen(draft, { draft = it }, {
                accepted = draft.trim()
                draft = ""
            })
            Text(accepted)
        }
    }
  checklist:
  - DraftScreen hält keine zweite Entwurfskopie.
  - Leerraum allein deaktiviert den Button.
  - Die lokale Übernahme kopiert den Inhalt vor dem Leeren.
  - Drehung mit gefülltem Entwurf wurde im Emulator geprüft.
  - Preview oder Test zeigt leeren und gefüllten Zustand.
  explanation: Die Screen-Composable ist wiederverwendbar und kontrolliert. Der Demo-Besitzer übernimmt den Zustand
    lokal. In einer Repository-Integration darf der Entwurf erst nach bestätigter Übernahme geleert werden.
  resources:
  - *id001
