  - title: Android · produceState
    url: https://developer.android.com/develop/ui/compose/side-effects#producestate
- id: effekt-callback
  type: explain
  title: Neuer Callback ohne neue Wartezeit
  prompt: Erkläre Key, aktuelle Callback-Referenz und Abbruchverhalten.
  lang: kotlin
  code: |-
    @Composable
    fun Hint(id: String, onDone: () -> Unit) {
        val latest by rememberUpdatedState(onDone)
        LaunchedEffect(id) { delay(500); latest() }
    }
  points:
  - Ein neuer id-Wert ersetzt den Effekt.
  - rememberUpdatedState hält den Callback aktuell.
  - Eine reine Callback-Änderung startet die Verzögerung nicht neu.
  - Verlassen der Composition bricht die Effekt-Coroutine ab.
  explanation: Die ID beschreibt, zu welcher Sache die Warteoperation gehört. Der Callback ist austauschbares Verhalten
    innerhalb derselben Operation. Diese Trennung verhindert veraltete Closures und unnötige Neustarts.
  resources:
  - *id001
- id: snapshotflow-erklaeren
  type: explain
  title: Ein Ereignis aus dem Scrollzustand
  prompt: Erkläre, was dieser Effekt meldet, wie oft, und welche Rolle `snapshotFlow` und `distinctUntilChanged` spielen.
  lang: kotlin
  code: |-
    LaunchedEffect(listState) {
        snapshotFlow { listState.firstVisibleItemIndex }
            .map { it > 0 }
            .distinctUntilChanged()
            .filter { it }
            .collect { analytics.log("thoughts_scrolled") }
    }
  points:
  - "`snapshotFlow` macht aus dem Compose-State `firstVisibleItemIndex` einen Flow, der bei jeder Änderung einen Wert sendet."
  - "`map` und `distinctUntilChanged` machen daraus nur noch die Wechsel zwischen „oben“ und „weiter unten“."
  - "`filter` lässt nur den Wechsel nach unten durch; jedes Verlassen des Listenanfangs meldet einmal."
  - Der Effekt lebt mit der Composition und startet nur neu, wenn sich `listState` ändert.
  explanation: "`snapshotFlow` liest den Block, merkt sich die gelesenen States und sendet einen neuen Wert, wenn sich einer ändert. Beim Scrollen wären das Dutzende Werte pro Sekunde. `map { it > 0 }` reduziert sie auf „oben“ oder „nicht oben“, `distinctUntilChanged` lässt nur Wechsel durch, `filter` nur den nach unten. So meldet die Statistik einmal pro Verlassen des Listenanfangs, nicht bei jedem Pixel. Weil es im `LaunchedEffect` läuft, endet das Sammeln automatisch mit dem Bildschirm."
  resources:
  - title: Android · snapshotFlow
    url: https://developer.android.com/develop/ui/compose/side-effects#snapshotFlow
- id: entwurf-screen
  type: practice
  title: Eine kontrollierte Eingabemaske
  prompt: Baue eine zustandslose `DraftScreen`-Composable und einen lokalen Demo-Besitzer. Leere Eingaben dürfen
    nicht abgesendet werden. Die Demo zeigt zuletzt übernommene Eingabe an; sie behauptet keine Datenbankpersistenz.
  lang: kotlin
  solution: |-
    @Composable
    fun DraftScreen(value: String, onChange: (String) -> Unit, onSave: () -> Unit) {
        Column {
            TextField(value = value, onValueChange = onChange)
            Button(onClick = onSave, enabled = value.isNotBlank()) { Text("Übernehmen") }
        }
    }
    @Composable
    fun DraftDemo() {
        var draft by rememberSaveable { mutableStateOf("") }
        var accepted by rememberSaveable { mutableStateOf("") }
        Column {
            DraftScreen(draft, { draft = it }, {
                accepted = draft.trim()
                draft = ""
            })
            Text(accepted)
        }
    }
  checklist:
  - DraftScreen hält keine zweite Entwurfskopie.
  - Leerraum allein deaktiviert den Button.
  - Die lokale Übernahme kopiert den Inhalt vor dem Leeren.
  - Drehung mit gefülltem Entwurf wurde im Emulator geprüft.
  - Preview oder Test zeigt leeren und gefüllten Zustand.
  explanation: Die Screen-Composable ist wiederverwendbar und kontrolliert. Der Demo-Besitzer übernimmt den Zustand
    lokal. In einer Repository-Integration darf der Entwurf erst nach bestätigter Übernahme geleert werden.
  resources:
  - *id001
