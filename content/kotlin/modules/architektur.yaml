id: architektur
title: "App-Architektur: MVVM, UDF, Dependency Injection und Module"
level: 2
minutes: 210
place: pc
summary: Wie du eine Android-App in Schichten teilst, Zustand in eine Richtung fließen lässt und Abhängigkeiten von außen hereinreichst – damit sie testbar und änderbar bleibt.
goals:
  - Du erklärst die vier Architekturprinzipien des offiziellen Guides und ordnest Code der UI-, Domain- oder Datenschicht zu.
  - Du baust ein ViewModel, das einen `StateFlow<UiState>` mit `stateIn` und `WhileSubscribed(5_000)` bereitstellt, und wählst begründet zwischen Data Class und Sealed Interface.
  - Du behandelst einmalige Ereignisse wie Snackbars als Zustand und begründest, warum `Channel` und `SharedFlow` dafür riskant sind.
  - Du verdrahtest Abhängigkeiten manuell mit einem `AppContainer` und mit Hilt und erklärst, was ein Scope bewirkt.
  - Du schneidest eine App in Feature- und Core-Module, wählst zwischen `api` und `implementation` und hältst Implementierungen mit `internal` hinter ihren Interfaces.
  - Du erkennst typische Architekturfehler im Code-Review, etwa `Context` im ViewModel, einen vergessenen Scope oder ein Feature, das an einem anderen Feature hängt.
