id: performance-diagnose
title: "Performance & Debugging: Spuren lesen"
level: 3
minutes: 170
place: unterwegs
summary: Compiler-Reports, Traces, Logcat, Stacktraces, StrictMode- und Leak-Meldungen lesen und daraus die Ursache ableiten – bevor du etwas misst oder änderst.
goals:
  - Du liest den Klassen- und Composable-Report des Compose-Compilers und erklärst, welche Parameter Compose per Identität und welche per `equals` vergleicht.
  - Du machst Klassen stabil – mit `val`, einem eigenen UI-Modell, `@Immutable` oder einer Stabilitätsdatei – und begründest die Wahl.
  - Du findest in einem Trace-Ausschnitt den Frame über dem Budget und den Slice, der ihn verursacht.
  - Du unterscheidest TTID und TTFD und meldest mit `ReportDrawnWhen`, wann ein Bildschirm wirklich fertig ist.
  - Du liest Stacktraces bis zur letzten `Caused by`-Zeile, StrictMode-Meldungen und LeakCanary-Spuren und benennst die Zeile, die du änderst.
  - Du ordnest Android vitals und Crash-Reports nach dem Release ein.
