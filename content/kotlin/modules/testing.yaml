id: testing
title: "Testing: ViewModels, Coroutines, Room und Compose"
level: 3
minutes: 170
summary: Wie du eine Android-App so testest, dass Tests schnell, stabil und aussagekräftig sind – mit Fakes statt Mocks, virtueller Zeit für Coroutines, In-Memory-Datenbanken und Compose-UI-Tests.
goals:
  - Du ordnest Tests in die Testpyramide ein und entscheidest, ob ein Test lokal auf der JVM oder instrumentiert auf dem Gerät läuft.
  - Du schreibst Fakes für Repositories und begründest, warum Google Fakes gegenüber Mocks bevorzugt.
  - Du testest Coroutines mit `runTest`, erklärst den Unterschied zwischen `StandardTestDispatcher` und `UnconfinedTestDispatcher` und ersetzt `Dispatchers.Main` über eine Rule.
  - Du testest ViewModels über ihren `StateFlow` und Flows mit Turbine.
  - Du schreibst Compose-UI-Tests mit Findern, Aktionen und Assertions und nutzt `testTag`, wo Texte nicht eindeutig sind.
