  - id: geteilter-fake
    type: bug
    title: Einzeln grün, zusammen rot
    prompt: |
      Jeder der beiden Tests besteht, wenn du ihn einzeln startest. Startest du die ganze Klasse, schlägt `blankTextIsNotSaved` fehl: `expected:<[]> but was:<[Milch kaufen]>`. Finde die zwei Zeilen, die das verursachen, und korrigiere sie.
    lang: kotlin
    code: |
      object FakeThoughtRepository : ThoughtRepository {
          val captured = mutableListOf<String>()
          override suspend fun capture(text: String) { captured += text }
      }

      class CaptureViewModelTest {
          @get:Rule
          val mainDispatcherRule = MainDispatcherRule()
          private val repository = FakeThoughtRepository

          @Test
          fun savingStoresText() = runTest {
              val viewModel = CaptureViewModel(repository)
              viewModel.onTextChange("Milch kaufen")
              viewModel.onSaveClicked()
              assertEquals(listOf("Milch kaufen"), repository.captured)
          }

          @Test
          fun blankTextIsNotSaved() = runTest {
              val viewModel = CaptureViewModel(repository)
              viewModel.onTextChange("   ")
              viewModel.onSaveClicked()
              assertEquals(emptyList<String>(), repository.captured)
          }
      }
    lines: [1, 9]
    fix:
      - line: 1
        answers: ["class FakeThoughtRepository : ThoughtRepository {"]
      - line: 9
        answers: ["private val repository = FakeThoughtRepository()"]
    hints:
      - JUnit erzeugt für jeden Test eine neue Instanz der Testklasse. Gilt das auch für `repository`?
      - Wie viele Instanzen gibt es von einem Kotlin-`object`?
    explanation: |
      Ein `object` ist ein Singleton: Es gibt genau eine Instanz im ganzen Testlauf. Läuft `savingStoresText` zuerst, bleibt „Milch kaufen“ in `captured` stehen, und `blankTextIsNotSaved` sieht es. Einzeln gestartet fällt das nicht auf – ein klassischer reihenfolgeabhängiger Test. Als `class` mit `FakeThoughtRepository()` in der Property bekommt jeder Test einen frischen Fake, weil JUnit für jeden Test eine neue Instanz der Testklasse erzeugt. Faustregel: Tests teilen keinen veränderlichen Zustand.
    resources:
      - title: Test doubles · Example using a fake
        url: https://developer.android.com/training/testing/fundamentals/test-doubles#example-fake
      - title: Object declarations (Kotlin-Doku)
        url: https://kotlinlang.org/docs/object-declarations.html
  - id: zwei-knoten
    type: bug
    title: Zwei Knoten, ein Klick
    prompt: |
      `CaptureScreen` hat eine Top-App-Bar mit dem Titel „Speichern“ und darunter einen Button, ebenfalls mit „Speichern“ beschriftet; der Button trägt `Modifier.testTag("save-button")`. Der Test bricht ab mit: `Expected exactly '1' node but found '2' nodes that satisfy: (Text + InputText + EditableText contains 'Speichern' (ignoreCase: false))`. Finde die fehlerhafte Zeile und korrigiere sie so, dass eindeutig der Button getroffen wird.
    lang: kotlin
    code: |
      @Test
      fun saveButtonCallsOnSave() {
          var saved = false
          composeTestRule.setContent {
              CaptureScreen(
                  uiState = CaptureUiState(text = "Milch kaufen"),
                  onTextChange = {},
                  onSave = { saved = true },
              )
          }
          composeTestRule.onNodeWithText("Speichern").performClick()
          assertTrue(saved)
      }
    lines: [11]
    fix:
      - line: 11
        answers:
          - "composeTestRule.onNodeWithTag(\"save-button\").performClick()"
          - "composeTestRule.onNode(hasText(\"Speichern\") and hasClickAction()).performClick()"
          - "composeTestRule.onNode(hasTestTag(\"save-button\")).performClick()"
    hints:
      - Der Button hat eine Eigenschaft, die der Titel nicht hat.
    explanation: |
      `onNodeWithText` erwartet genau einen Treffer; hier passen Titel und Button. Die robusteste Lösung ist der Test-Tag, den der Button schon trägt: `onNodeWithTag("save-button")`. Alternativ kombinierst du Matcher: `hasText("Speichern") and hasClickAction()` trifft nur den klickbaren Knoten. `onAllNodesWithText(...)[1]` würde auch funktionieren, hängt aber an der Reihenfolge im Baum und bricht beim nächsten Layout-Umbau.
    resources:
      - title: Compose testing APIs · Finders
        url: https://developer.android.com/develop/ui/compose/testing/apis#finders
      - title: Semantics in Compose tests
        url: https://developer.android.com/develop/ui/compose/testing/semantics
  - id: widget-pick-test-erklaeren
    type: explain
    title: Bears WidgetPickTest
    prompt: |
      Das sind echte Tests aus Bear (Auszug) und die getestete Funktion. Erkläre, was an diesen Tests gut gemacht ist: Wie werden Zeit und Zufall testbar gemacht, welche Randfälle sind abgedeckt, und warum laufen die Zufallstests in einer Schleife?
    lang: kotlin
    code: |
      object WidgetPick {
          const val HOURS = 4
          fun slot(now: LocalDateTime): Long =
              now.toLocalDate().toEpochDay() * (24 / HOURS) + now.hour / HOURS

          fun pick(ids: List<String>, current: String?, currentSlot: Long?, slot: Long, random: Random = Random.Default): String? {
              if (current != null && currentSlot == slot && current in ids) return current
              if (ids.isEmpty()) return null
              return ids.filter { it != current }.ifEmpty { ids }.random(random)
          }
      }

      class WidgetPickTest {
          private val ids = listOf("a", "b", "c", "d")

          @Test fun slotsStartEveryFourHours() {
              val day = LocalDateTime.of(2026, 9, 27, 0, 0)
              assertEquals(WidgetPick.slot(day), WidgetPick.slot(day.withHour(3).withMinute(59)))
              assertEquals(WidgetPick.slot(day) + 1, WidgetPick.slot(day.withHour(4)))
              assertEquals(WidgetPick.slot(day) + 6, WidgetPick.slot(day.plusDays(1)))
          }

          @Test fun aNewSlotBringsAnotherEntry() {
              repeat(50) { assertNotEquals("b", WidgetPick.pick(ids, "b", 7, 8, Random(it))) }
          }

          @Test fun aSingleEntryStaysAndNoEntryGivesNothing() {
              assertEquals("a", WidgetPick.pick(listOf("a"), "a", 7, 8))
              assertNull(WidgetPick.pick(emptyList(), "a", 7, 8))
          }
      }
    points:
      - Zeit und Zufall kommen als Parameter herein (`LocalDateTime`, `Random`) statt über `now()` und `Random.Default` – die Funktion ist rein und deterministisch testbar.
      - Die Grenzen sind exakt getestet – 3:59 gehört noch zum alten Slot, 4:00 zum neuen, Mitternacht zum nächsten Tag.
      - "`repeat(50)` mit `Random(it)` prüft die Eigenschaft über 50 verschiedene, aber reproduzierbare Seeds – ein Fehler wäre bei jedem Lauf gleich sichtbar."
      - Randfälle wie ein einziger Eintrag und eine leere Liste sind eigene Tests.
      - Die Testnamen beschreiben Verhalten in ganzen Sätzen, sodass ein roter Test sofort sagt, welche Regel verletzt ist.
    explanation: |
      Die wichtigste Entscheidung steckt im Produktionscode: `pick` und `slot` bekommen Uhrzeit und Zufallsgenerator als Parameter. Dadurch sind sie reine Funktionen, und die Tests brauchen weder Warten noch Mocks. `slotsStartEveryFourHours` prüft genau die Grenzen, an denen Off-by-one-Fehler entstehen: 3:59 gegen 4:00 und Mitternacht. Die Zufallstests laufen mit 50 festen Seeds; das ist ein kleiner eigenschaftsbasierter Test („bei neuem Slot nie derselbe Eintrag“), der trotzdem bei jedem Lauf dasselbe Ergebnis liefert – wackelige Tests sind ausgeschlossen. Der leere und der einelementige Fall haben eigene Assertions, weil dort `ifEmpty { ids }` und `return null` greifen. Und die Namen lesen sich wie Anforderungen: Schlägt `aNewSlotBringsAnotherEntry` fehl, weißt du ohne Blick in den Code, welche Regel gebrochen ist.
    resources:
      - title: Build local unit tests
        url: https://developer.android.com/training/testing/local-tests
      - title: kotlin.random.Random (API-Referenz)
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.random/-random/
  - id: capture-viewmodel-testen
    type: practice
    title: Tests für das Capture-ViewModel
    prompt: |
      Schreibe die Tests für das `CaptureViewModel` aus dem Modul „App-Architektur“ (Übung „Das Capture-ViewModel“). Zur Erinnerung: `onSaveClicked()` ignoriert leeren Text und setzt eine Meldung, sperrt sich mit `isSaving` gegen doppelte Tipps, leert nach dem Speichern das Feld und setzt „Gespeichert“; `userMessageShown()` setzt die Meldung auf `null`.

      Anforderungen:

      - Ein `FakeThoughtRepository`, das gespeicherte Texte in einer Liste sammelt und dessen `capture` sich per `CompletableDeferred` anhalten lässt.
      - Mindestens diese Tests: Speichern speichert den getrimmten Text und leert das Feld; leerer Text wird nicht gespeichert und erzeugt eine Meldung; ein zweiter Tipp während des Speicherns speichert nicht doppelt; `userMessageShown()` entfernt die Meldung.
      - `MainDispatcherRule` und `runTest`; keine Mocks, kein `Thread.sleep`.
    lang: kotlin
    starter: |
      class FakeThoughtRepository : ThoughtRepository {
          // captured, gate
      }

      class CaptureViewModelTest {
          // Rule, Tests
      }
    solution: |
      import kotlinx.coroutines.CompletableDeferred
      import kotlinx.coroutines.test.advanceUntilIdle
      import kotlinx.coroutines.test.runTest
      import org.junit.Assert.assertEquals
      import org.junit.Assert.assertFalse
      import org.junit.Assert.assertNull
      import org.junit.Assert.assertTrue
      import org.junit.Rule
      import org.junit.Test

      class FakeThoughtRepository : ThoughtRepository {
          val captured = mutableListOf<String>()
          /** Wenn gesetzt, wartet capture, bis der Test das Gate öffnet. */
          var gate: CompletableDeferred<Unit>? = null

          override suspend fun capture(text: String) {
              gate?.await()
              captured += text
          }
      }

      class CaptureViewModelTest {
          @get:Rule
          val mainDispatcherRule = MainDispatcherRule()

          private val repository = FakeThoughtRepository()
          private val viewModel = CaptureViewModel(repository)

          @Test
          fun savingStoresTrimmedTextAndClearsField() = runTest {
              viewModel.onTextChange("  Milch kaufen ")
              viewModel.onSaveClicked()
              advanceUntilIdle()

              assertEquals(listOf("Milch kaufen"), repository.captured)
              assertEquals("", viewModel.uiState.value.text)
              assertEquals("Gespeichert", viewModel.uiState.value.userMessage)
              assertFalse(viewModel.uiState.value.isSaving)
          }

          @Test
          fun blankTextIsNotSavedAndShowsMessage() = runTest {
              viewModel.onTextChange("   ")
              viewModel.onSaveClicked()
              advanceUntilIdle()

              assertTrue(repository.captured.isEmpty())
              assertEquals("Leerer Gedanke – nichts gespeichert", viewModel.uiState.value.userMessage)
          }

          @Test
          fun secondTapWhileSavingDoesNotSaveTwice() = runTest {
              val gate = CompletableDeferred<Unit>()
              repository.gate = gate
              viewModel.onTextChange("Milch kaufen")

              viewModel.onSaveClicked()
              assertTrue(viewModel.uiState.value.isSaving)
              viewModel.onSaveClicked()

              gate.complete(Unit)
              advanceUntilIdle()

              assertEquals(listOf("Milch kaufen"), repository.captured)
              assertFalse(viewModel.uiState.value.isSaving)
          }

          @Test
          fun userMessageShownClearsMessage() = runTest {
              viewModel.onTextChange("Milch kaufen")
              viewModel.onSaveClicked()
              advanceUntilIdle()

              viewModel.userMessageShown()

              assertNull(viewModel.uiState.value.userMessage)
          }
      }
    checklist:
      - Der Fake ist eine `class`, keine `object`-Deklaration; jeder Test bekommt eine frische Instanz.
      - "`capture` im Fake wartet auf ein `CompletableDeferred`, sodass der Test den Zustand „speichert gerade“ festhalten kann."
      - Die Tests nutzen `@get:Rule val mainDispatcherRule = MainDispatcherRule()` und `runTest`.
      - Jeder Test prüft Zustand (`uiState.value`, `repository.captured`), nicht Aufrufe.
      - Der Doppeltipp-Test prüft `isSaving` zwischen den beiden Tipps und die Anzahl gespeicherter Texte danach.
      - Die Testnamen beschreiben das erwartete Verhalten.
    explanation: |
      Der Fake ist der Schlüssel: Er sammelt Texte (Zustand statt Aufrufzählung), und das `CompletableDeferred` hält `capture` an, bis der Test es freigibt. So lässt sich der Moment „speichert gerade“ einfrieren und der zweite Tipp genau dort ausführen. Mit der `MainDispatcherRule` und ihrem `UnconfinedTestDispatcher` läuft der `launch` im ViewModel sofort bis zum `await`; `advanceUntilIdle()` nach `complete` lässt ihn zu Ende laufen. Die Tests prüfen nur, was ein Nutzer bemerken würde: was gespeichert wurde, was im Feld steht, welche Meldung erscheint. Deshalb überleben sie jedes Refactoring des ViewModels, das dieses Verhalten beibehält.
