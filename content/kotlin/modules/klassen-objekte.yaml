id: klassen-objekte
title: Klassen & Objekte
level: 2
minutes: 180
summary: Wie du eine Domäne in Kotlin modellierst – mit Properties statt Gettern, Data Classes, Enums, Sealed Types, Objekten und Value Classes – und welche Fallen jedes Werkzeug mitbringt.
goals:
  - Du schreibst Klassen mit primärem Konstruktor, `init`-Blöcken und Properties mit eigenen Gettern und Settern und erklärst das Backing Field.
  - Du erklärst, warum Klassen standardmäßig `final` sind, und wählst passend zwischen `open`, `abstract` und Interface.
  - Du setzt die vier Sichtbarkeiten `public`, `internal`, `protected` und `private` gezielt ein.
  - Du weißt, was eine Data Class generiert, aus welchen Properties, und erkennst ihre Fallen.
  - Du modellierst abgeschlossene Zustände mit Enums und Sealed Types und nutzt erschöpfende `when`-Ausdrücke ohne `else`.
  - Du nutzt `object`, `companion object` und `value class` für Singletons, Factory-Funktionen und typsichere IDs.
