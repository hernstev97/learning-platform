lesson: |
  Eine App wie Bear besteht zum größten Teil aus Modellen: eine Aufgabe mit Titel und Priorität, der Status eines Sync-Laufs, der Zustand eines Bildschirms („lädt“, „zeigt Inhalt“, „Fehler“). Wie gut du diese Modelle schneidest, entscheidet, wie viele Fehler der Compiler für dich findet. Eine Aufgaben-ID als `String` lässt sich mit jedem anderen String verwechseln. Ein Bildschirmzustand aus drei Booleans (`isLoading`, `hasError`, `isEmpty`) erlaubt acht Kombinationen, von denen die Hälfte keinen Sinn ergibt.

  Aus TypeScript kennst du Klassen, Interfaces und Union Types. Kotlin hat für jeden dieser Zwecke ein eigenes, präziseres Werkzeug: Data Classes für Werte, Sealed Types für „genau einer von diesen Fällen“, Value Classes für typsichere IDs ohne Laufzeitkosten. Dieses Modul zeigt, was jedes davon generiert, warum Kotlin manche Dinge verbietet, die Java erlaubt, und welche Fallen im Code-Review auffallen.

  ## Klassen, Konstruktoren und init

  ```kotlin
  class Aufgabe(val titel: String, var erledigt: Boolean = false) {
      val kurztitel = titel.take(10)

      init {
          require(titel.isNotBlank()) { "Titel darf nicht leer sein" }
      }
  }

  val a = Aufgabe("Steuer vorbereiten")   // kein new
  ```

  Der **primäre Konstruktor** steht direkt im Klassenkopf. Parameter mit `val` oder `var` werden gleichzeitig zu Properties – das ersetzt in Java Feld, Konstruktorzuweisung und Getter. Parameter ohne `val`/`var` sind nur im Initialisierungscode sichtbar ([Constructors and initializer blocks](https://kotlinlang.org/docs/classes.html#constructors-and-initializer-blocks)).

  Beim Erzeugen laufen Property-Initialisierer und `init`-Blöcke **in der Reihenfolge, in der sie im Klassenkörper stehen**. Ein `init`-Block, der eine weiter unten deklarierte Property liest, sieht deshalb noch keinen Wert. **Sekundäre Konstruktoren** (`constructor(…) : this(…)`) müssen an den primären delegieren; ihr Körper läuft erst, nachdem alle Initialisierer und `init`-Blöcke fertig sind ([Secondary constructors](https://kotlinlang.org/docs/classes.html#secondary-constructors)). In der Praxis brauchst du sie selten: Default-Argumente ersetzen die meisten Überladungen.

  ## Properties: Getter, Setter und Backing Field

  In Kotlin gibt es keine öffentlichen Felder. Jede Property ist ein Getter (bei `var` plus Setter), hinter dem ein gespeichertes Feld stehen **kann** ([Properties](https://kotlinlang.org/docs/properties.html)). Das erlaubt, Verhalten später zu ändern, ohne die Aufrufer anzufassen:

  ```kotlin
  class Fokus {
      var minuten: Int = 25
          set(value) {
              require(value in 5..120) { "5 bis 120 Minuten, nicht $value" }
              field = value              // field = das gespeicherte Backing Field
          }

      var zyklen: Int = 0
          private set                    // lesen darf jeder, schreiben nur die Klasse

      val istLang: Boolean
          get() = minuten > 45           // kein Feld, wird bei jedem Zugriff berechnet

      fun zyklusFertig() { zyklen++ }
  }
  ```

  `field` ist nur in Getter und Setter verfügbar und bezeichnet den gespeicherten Wert ([Backing fields](https://kotlinlang.org/docs/properties.html#backing-fields)). Schreibst du im Setter den Property-Namen statt `field`, ruft der Setter sich selbst auf – bis zum `StackOverflowError`.

  Achte auf den Unterschied zwischen Initialisierer und Getter: `val a = berechne()` rechnet **einmal** beim Erzeugen, `val a get() = berechne()` rechnet **bei jedem Zugriff**. Beides sieht für den Aufrufer gleich aus.

  Ein häufiges Muster: Die Klasse verändert eine Liste, nach außen soll sie nur lesbar sein. Klassisch löst man das mit einer privaten **Backing Property** `_eintraege` und einem öffentlichen Getter. Seit Kotlin 2.4 ist dafür ein **Explicit Backing Field** stabil ([Explicit backing fields](https://kotlinlang.org/docs/properties.html#explicit-backing-fields)):

  ```kotlin
  class Verlauf {
      val eintraege: List<String>        // öffentlicher Typ: nur lesbar
          field = mutableListOf()         // privates Feld: veränderbar

      fun merke(eintrag: String) {
          eintraege.add(eintrag)          // in der Klasse: Smart Cast zu MutableList
      }
  }
  ```

  Das ist genau das Muster, das Android-ViewModels für `MutableStateFlow` intern und `StateFlow` nach außen nutzen – dazu mehr im Modul Architektur.

  ## Sichtbarkeit, final und Vererbung

  | Modifier | Sichtbar für |
  | --- | --- |
  | `public` (Standard) | alle |
  | `internal` | dasselbe Modul – in Gradle ein Modul wie `:app` oder `:sync` |
  | `protected` | die Klasse und ihre Unterklassen (nicht auf oberster Ebene) |
  | `private` | die Klasse; auf oberster Ebene: dieselbe Datei |

  Anders als Java kennt Kotlin kein „package-private“. `internal` ist das Werkzeug, um Implementierungsdetails eines Gradle-Moduls zu verstecken ([Visibility modifiers](https://kotlinlang.org/docs/visibility-modifiers.html#modules)).

  Klassen und Methoden sind in Kotlin **standardmäßig `final`**. Von einer Klasse erben darf nur, wer sie mit `open` markiert, und jede überschreibbare Methode braucht ebenfalls `open` ([Inheritance](https://kotlinlang.org/docs/inheritance.html#open-keyword)):

  ```kotlin
  open class Quelle(val name: String) {
      open fun beschreibung() = "Quelle $name"
      fun id() = name.lowercase()                 // final: nicht überschreibbar
  }

  class LinearQuelle : Quelle("Linear") {
      override fun beschreibung() = "Linear-API"  // override ist Pflicht
  }
  ```

  Warum? Vererbung koppelt Unterklassen an Implementierungsdetails der Oberklasse. Eine Klasse, die nicht für Vererbung entworfen wurde, soll auch nicht beerbt werden. Ohne `open` meldet der Compiler `this type is final, so it cannot be extended.` Das zwingt dich, Erweiterungspunkte bewusst zu setzen.

  **Abstrakte Klassen** (`abstract class`) dürfen Zustand und Konstruktoren haben und lassen einzelne Mitglieder offen (`abstract fun lade(): List<Aufgabe>`). **Interfaces** haben keinen Zustand, aber abstrakte Properties und Methoden mit Default-Implementierung ([Interfaces](https://kotlinlang.org/docs/interfaces.html)):

  ```kotlin
  interface Synchronisierbar {
      val quelle: String                                    // abstrakt, kein Feld
      fun beschreibung(): String = "Synchronisiert mit $quelle"  // Default-Methode
  }
  ```

  Eine Klasse erbt von höchstens einer Klasse, implementiert aber beliebig viele Interfaces. Die Faustregel: Interface für eine Fähigkeit („ist synchronisierbar“), abstrakte Klasse nur, wenn Unterklassen wirklich gemeinsamen Zustand teilen. In modernem Kotlin ist Komposition – ein Objekt bekommt ein anderes als Konstruktorparameter – meist besser als tiefe Vererbung.

  ## Data Classes

  ```kotlin
  data class Notiz(val titel: String, val tags: List<String>)
  ```

  Für `data class` generiert der Compiler `equals()`/`hashCode()`, ein lesbares `toString()` (`Notiz(titel=…, tags=[…])`), `copy()` und `component1()`, `component2()` … für Destructuring ([Data classes](https://kotlinlang.org/docs/data-classes.html)). Die entscheidende Regel: **Nur Properties aus dem primären Konstruktor zählen.** Eine Property im Klassenkörper taucht weder in `equals` noch in `toString` noch in `copy` auf ([Properties declared in the class body](https://kotlinlang.org/docs/data-classes.html#properties-declared-in-the-class-body)).

  ```kotlin
  val notiz = Notiz("Einkauf", listOf("privat"))
  val kopie = notiz.copy(titel = "Wocheneinkauf")   // neues Objekt, ein Feld geändert
  val (titel, tags) = notiz                         // Destructuring über componentN()
  println(notiz == Notiz("Einkauf", listOf("privat")))  // true – Wertgleichheit
  ```

  Die Fallen:

  - **`copy()` kopiert flach.** Enthält die Data Class eine `MutableList`, teilen Original und Kopie dieselbe Liste. Nutze unveränderliche Typen (`List`, nicht `MutableList`).
  - **`var` in einer Data Class, die als Schlüssel dient.** Ändert sich eine Property, während das Objekt in einem `HashSet` oder als `HashMap`-Schlüssel liegt, ändert sich der `hashCode` – das Objekt ist dann „verloren“: `contains` liefert `false`, `remove` tut nichts. Data Classes mit `val` vermeiden das.
  - **Arrays als Property** vergleichen per Referenz, nicht per Inhalt. Nimm `List`.
  - Data Classes können nicht `open`, `abstract` oder `sealed` sein, dürfen aber Interfaces implementieren und von Sealed Types erben.

  > [!MERKE]
  > Data Class = Wert. Zwei Objekte mit gleichem Inhalt **sind** gleich. Deshalb sollten alle Properties `val` sein und unveränderliche Typen haben – Änderungen laufen über `copy()`.

  ## Enums, Sealed Types und erschöpfendes when

  Ein **Enum** hat eine feste Menge von Instanzen. Jede Konstante kann Properties und Methoden haben ([Enum classes](https://kotlinlang.org/docs/enum-classes.html)):

  ```kotlin
  enum class Prioritaet(val label: String, val gewicht: Int) {
      NIEDRIG("Niedrig", 1),
      MITTEL("Mittel", 2),
      HOCH("Hoch", 3);                  // Semikolon vor weiteren Mitgliedern

      fun istDringend() = this == HOCH
  }

  Prioritaet.entries                    // alle Konstanten als List
  Prioritaet.valueOf("HOCH")            // wirft bei unbekanntem Namen
  ```

  Nimm `entries` statt des älteren `values()`: `entries` liefert eine unveränderliche Liste, `values()` erzeugt bei jedem Aufruf ein neues Array.

  Ein Enum reicht nicht, wenn die Fälle **unterschiedliche Daten** tragen. Dafür gibt es **Sealed Types**: eine Klasse oder ein Interface, dessen direkte Untertypen alle zur Compile-Zeit bekannt sind – sie müssen im selben Modul und Paket stehen ([Sealed classes and interfaces](https://kotlinlang.org/docs/sealed-classes.html)). Das ist Kotlins Gegenstück zu Discriminated Unions in TypeScript:

  ```kotlin
  sealed interface UiState {
      data object Laden : UiState
      data class Inhalt(val aufgaben: List<Aufgabe>) : UiState
      data class Fehler(val meldung: String) : UiState
  }

  fun render(state: UiState): String = when (state) {
      UiState.Laden -> "Lade …"
      is UiState.Inhalt -> "${state.aufgaben.size} Aufgaben"   // Smart Cast
      is UiState.Fehler -> "Fehler: ${state.meldung}"
  }
  ```

  Statt drei Booleans mit acht Kombinationen gibt es genau drei gültige Zustände, und jeder trägt nur die Daten, die zu ihm passen. Weil der Compiler alle Untertypen kennt, ist das `when` ohne `else` erschöpfend. Kommt `UiState.Leer` dazu, meldet er jede Stelle: `'when' expression must be exhaustive. Add the 'Leer' branch or an 'else' branch.` ([Sealed classes with when](https://kotlinlang.org/docs/sealed-classes.html#use-sealed-classes-with-when-expression)).

  > [!WARNING] else macht den Compiler blind
  > Ein `else`-Zweig in einem `when` über ein Enum oder einen Sealed Type fängt auch **zukünftige** Fälle ab – still und mit dem Verhalten, das beim Schreiben für die damals bekannten Fälle gedacht war. Zähle die Fälle einzeln auf, dann meldet der Compiler neue.

  `sealed interface` ist meist die bessere Wahl als `sealed class`, weil ein Typ mehrere Interfaces implementieren kann. `sealed class` brauchst du, wenn alle Fälle gemeinsamen Zustand im Konstruktor teilen.

  ## object, companion object und value class

  `object` deklariert eine Klasse und ihre **einzige Instanz** in einem Schritt – ein Singleton, thread-sicher beim ersten Zugriff initialisiert ([Object declarations](https://kotlinlang.org/docs/object-declarations.html#object-declarations-overview)). `data object` ergänzt ein lesbares `toString()` (`Laden` statt `UiState$Laden@1b6d3586`) und ist die Standardwahl für datenlose Fälle eines Sealed Types ([Data objects](https://kotlinlang.org/docs/object-declarations.html#data-objects)).

  Kotlin hat kein `static`. Was in Java statisch wäre, steht auf oberster Ebene oder in einem **Companion Object** – einem Objekt, das zur Klasse gehört und über den Klassennamen erreichbar ist ([Companion objects](https://kotlinlang.org/docs/object-declarations.html#companion-objects)):

  ```kotlin
  class LinearIssue private constructor(val id: IssueId, val titel: String) {
      companion object {
          const val MAX_TITEL = 255

          fun aus(id: String, titel: String): LinearIssue =
              LinearIssue(IssueId(id), titel.take(MAX_TITEL))
      }
  }

  val issue = LinearIssue.aus("BEAR-12", "Steuer vorbereiten")
  ```

  Der private Konstruktor plus Factory-Funktion im Companion erzwingt, dass jedes `LinearIssue` durch die Validierung geht. Aus Java erreichst du Companion-Mitglieder über `LinearIssue.Companion.aus(…)`, mit [`@JvmStatic`](https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.jvm/-jvm-static/) direkt als `LinearIssue.aus(…)`.

  **Value Classes** wickeln genau einen Wert in einen eigenen Typ ([Inline value classes](https://kotlinlang.org/docs/inline-classes.html)):

  ```kotlin
  @JvmInline
  value class IssueId(val wert: String) {
      init {
          require(wert.matches(Regex("[A-Z]+-\\d+"))) { "Ungültige Issue-ID: $wert" }
      }
  }

  fun lade(id: IssueId, team: TeamId) { /* … */ }
  // lade(teamId, issueId)   // Fehler: Typen vertauscht – mit zwei Strings wäre das durchgerutscht
  ```

  Zur Compile-Zeit ist `IssueId` ein eigener Typ; im erzeugten Code steht, wo möglich, direkt der `String`. Die Hülle entsteht nur, wenn der Wert als anderer Typ benutzt wird – als `IssueId?`, als generischer Typ `T` oder als Interface ([Representation](https://kotlinlang.org/docs/inline-classes.html#representation)). Du bekommst Typsicherheit für IDs, Beträge und Einheiten fast ohne Laufzeitkosten.

  ## Häufige Fehler

  - **Rekursiver Setter.** `set(value) { titel = value }` ruft sich selbst auf. Symptom: `StackOverflowError`. Lösung: `field = value`.
  - **Vererbung von einer `final`-Klasse.** Symptom: `this type is final, so it cannot be extended.` Lösung: `open`, wenn Vererbung gewollt ist – oder besser Komposition.
  - **Property im Körper einer Data Class** zählt nicht für `equals` und `copy`. Symptom: zwei „verschiedene“ Objekte sind gleich. Lösung: in den primären Konstruktor verschieben.
  - **`var`-Property als Hash-Schlüssel verändert.** Symptom: `contains` liefert `false`, obwohl das Objekt im Set liegt. Lösung: `val` und `copy()`.
  - **`else` im `when` über Enum oder Sealed Type.** Symptom: neuer Fall wird still falsch behandelt. Lösung: alle Fälle aufzählen.
  - **Getter statt Initialisierer (oder umgekehrt).** `val zeit get() = System.currentTimeMillis()` liefert jedes Mal einen neuen Wert, `val zeit = …` nur einmal den beim Erzeugen.

  > [!PRAXIS]
  > In Android-Codebasen sind Sealed Interfaces für UI-Zustände, Navigationsereignisse und Ergebnisse von Repository-Aufrufen Standard; Data Classes modellieren API-Antworten und Room-Entities. Im Review fallen auf: `MutableList` in Data Classes, `else` in `when` über Sealed Types, `open` ohne Grund und Companion Objects voller Hilfsfunktionen, die besser auf oberster Ebene stünden. Im Praxis-Track Bear siehst du an echtem Code, wie Bear seine Modelle und Enums schneidet.

  > [!INTERVIEW] Wann nimmst du eine Sealed Class statt eines Enums?
  > „Ein Enum hat eine feste Menge von Instanzen, die alle dieselbe Form haben – zum Beispiel Prioritäten. Ein Sealed Type hat eine feste Menge von **Untertypen**, und jeder Untertyp kann eigene Daten tragen: `Inhalt` hat eine Liste, `Fehler` eine Meldung, `Laden` gar nichts. In beiden Fällen kennt der Compiler alle Fälle, deshalb schreibe ich das `when` ohne `else` und bekomme bei einem neuen Fall einen Compilerfehler statt eines Bugs.“

  ## Zusammenfassung

  - Der primäre Konstruktor mit `val`/`var` erzeugt Properties. Initialisierer und `init` laufen von oben nach unten, sekundäre Konstruktoren danach.
  - Properties sind Getter/Setter; `field` ist der gespeicherte Wert. `private set` und Explicit Backing Fields (Kotlin 2.4) trennen innere und äußere Sicht.
  - Klassen und Methoden sind `final`, bis du sie `open` machst. Interfaces für Fähigkeiten, abstrakte Klassen nur für gemeinsamen Zustand.
  - `internal` = sichtbar im Gradle-Modul, `private` auf oberster Ebene = sichtbar in der Datei.
  - Data Classes generieren `equals`, `hashCode`, `toString`, `copy` und `componentN` – nur aus dem primären Konstruktor. Halte sie unveränderlich.
  - Enums für gleichförmige Konstanten, Sealed Types für Fälle mit eigenen Daten. `when` ohne `else` lässt den Compiler neue Fälle melden.
  - `object` für Singletons, `data object` für datenlose Fälle, `companion object` für Factory-Funktionen und Konstanten, `value class` für typsichere IDs.
exercises:
  - id: data-class-generiert
    type: choice
    title: Was generiert der Compiler?
    prompt: Welche Aussagen über diese Data Class stimmen? (Mehrere Antworten richtig.)
    lang: kotlin
    code: |
      data class Termin(val titel: String, val datum: String) {
          var erinnert: Boolean = false
      }
    options:
      - text: Zwei `Termin`-Objekte mit gleichem Titel und Datum sind per `==` gleich, auch wenn sich `erinnert` unterscheidet.
        correct: true
        why: "`equals` wird nur aus den Properties des primären Konstruktors generiert."
      - text: "`termin.copy(datum = \"2026-10-01\")` übernimmt den Wert von `erinnert` aus dem Original."
        correct: false
        why: "`copy` ruft den primären Konstruktor auf. `erinnert` bekommt in der Kopie wieder den Initialwert `false`."
      - text: "`val (titel, datum) = termin` funktioniert, weil `component1()` und `component2()` generiert werden."
        correct: true
        why: Für jede Property des primären Konstruktors gibt es eine `componentN`-Funktion in Deklarationsreihenfolge.
      - text: "`toString()` liefert `Termin(titel=…, datum=…, erinnert=…)`."
        correct: false
        why: Auch `toString` berücksichtigt nur den primären Konstruktor – `erinnert` fehlt.
    explanation: |
      Alle generierten Funktionen einer Data Class – `equals`, `hashCode`, `toString`, `copy`, `componentN` – beziehen sich ausschließlich auf den primären Konstruktor. Properties im Klassenkörper sind für sie unsichtbar. Das ist manchmal gewollt (etwa für einen Cache-Wert), meistens aber eine Falle.
    resources:
      - title: Kotlin-Doku · Properties declared in the class body
        url: https://kotlinlang.org/docs/data-classes.html#properties-declared-in-the-class-body
  - id: timer-sortieren
    type: order
    title: Ein Timer, den nur er selbst herunterzählt
    prompt: |
      Bring die Zeilen in eine gültige Reihenfolge. `verbleibend` soll von außen lesbar, aber nur innerhalb der Klasse veränderbar sein.
    lang: kotlin
    lines: |
      class Timer(private val dauerSekunden: Int) {
          var verbleibend: Int = dauerSekunden
              private set
          fun tick() {
              if (verbleibend > 0) verbleibend--
          }
      }
    alternatives:
      - [1, 4, 5, 6, 2, 3, 7]
    explanation: |
      `private set` gehört direkt unter die Property, deren Setter es einschränkt. Der Getter bleibt öffentlich. Die Reihenfolge von Property und Funktion im Klassenkörper ist frei; nur Initialisierer und `init`-Blöcke laufen in Deklarationsreihenfolge. `dauerSekunden` ist eine private Property aus dem primären Konstruktor und steht im Initialisierer zur Verfügung.
    resources:
      - title: Kotlin-Doku · Custom getters and setters
        url: https://kotlinlang.org/docs/properties.html#custom-getters-and-setters
  - id: init-reihenfolge
    type: output
    title: In welcher Reihenfolge wird initialisiert?
    prompt: Was gibt dieses Programm aus?
    lang: kotlin
    code: |
      class Pomodoro(minuten: Int) {
          val sekunden = minuten * 60
          init { println("init 1: $sekunden") }
          val label = "Pomodoro ${sekunden / 60} min".also { println("label: $it") }
          init { println("init 2: $label") }
          constructor() : this(25) { println("sekundärer Konstruktor") }
      }

      fun main() {
          Pomodoro()
      }
    expected: |
      init 1: 1500
      label: Pomodoro 25 min
      init 2: Pomodoro 25 min
      sekundärer Konstruktor
    explanation: |
      Der sekundäre Konstruktor delegiert zuerst an den primären (`this(25)`). Der primäre führt Property-Initialisierer und `init`-Blöcke in der Reihenfolge aus, in der sie im Klassenkörper stehen: `sekunden`, `init 1`, `label` (mit dem `also`-Seiteneffekt), `init 2`. Erst danach läuft der Körper des sekundären Konstruktors.
    resources:
      - title: Kotlin-Doku · Initializer blocks
        url: https://kotlinlang.org/docs/classes.html#initializer-blocks
      - title: Kotlin-Doku · Secondary constructors
        url: https://kotlinlang.org/docs/classes.html#secondary-constructors
  - id: getter-vs-initialisierer
    type: output
    title: Einmal oder jedes Mal?
    prompt: Was gibt dieses Programm aus?
    lang: kotlin
    code: |
      class Uhr {
          private var zaehler = 0
          val beimErzeugen = ++zaehler
          val beiJedemZugriff: Int
              get() = ++zaehler
      }

      fun main() {
          val uhr = Uhr()
          println(uhr.beimErzeugen)
          println(uhr.beimErzeugen)
          println(uhr.beiJedemZugriff)
          println(uhr.beiJedemZugriff)
      }
    expected: |
      1
      1
      2
      3
    explanation: |
      `beimErzeugen` hat einen Initialisierer: `++zaehler` läuft einmal beim Erzeugen, das Ergebnis 1 liegt im Backing Field. `beiJedemZugriff` hat einen eigenen Getter und kein Feld: Jeder Zugriff führt `++zaehler` erneut aus. Für den Aufrufer sehen beide Properties gleich aus – der Unterschied steckt nur in der Deklaration.
    resources:
      - title: Kotlin-Doku · Custom getters and setters
        url: https://kotlinlang.org/docs/properties.html#custom-getters-and-setters
  - id: data-class-kopie
    type: output
    title: Gleich, identisch, geteilt
    prompt: Was gibt dieses Programm aus?
    lang: kotlin
    code: |
      data class Notiz(val titel: String, val tags: MutableList<String>) {
          var gelesen: Boolean = false
      }

      fun main() {
          val a = Notiz("Einkauf", mutableListOf("privat"))
          val b = Notiz("Einkauf", mutableListOf("privat"))
          b.gelesen = true
          println(a == b)
          println(a === b)
          val c = a.copy(titel = "Wocheneinkauf")
          c.tags.add("wichtig")
          println(a.tags)
          println(c)
      }
    expected: |
      true
      false
      [privat, wichtig]
      Notiz(titel=Wocheneinkauf, tags=[privat, wichtig])
    explanation: |
      `==` ruft das generierte `equals` auf, das nur `titel` und `tags` vergleicht – `gelesen` steht im Klassenkörper und zählt nicht. `===` vergleicht Referenzen, und `a` und `b` sind zwei Objekte. `copy` kopiert flach: `c.tags` ist **dieselbe** `MutableList` wie `a.tags`, deshalb taucht „wichtig“ auch in `a` auf. `toString` zeigt ebenfalls nur die Konstruktor-Properties.
    resources:
      - title: Kotlin-Doku · Copying
        url: https://kotlinlang.org/docs/data-classes.html#copying
      - title: Kotlin-Doku · Equality
        url: https://kotlinlang.org/docs/equality.html
  - id: hashset-verloren
    type: output
    title: Der verlorene Tag
    prompt: Was gibt dieses Programm aus?
    lang: kotlin
    code: |
      data class Tag(var name: String)

      fun main() {
          val tag = Tag("arbeit")
          val aktiv = hashSetOf(tag)
          println(tag in aktiv)
          tag.name = "Arbeit"
          println(tag in aktiv)
          println(aktiv)
          println(Tag("Arbeit") == tag)
      }
    expected: |
      true
      false
      [Tag(name=Arbeit)]
      true
    explanation: |
      Ein `HashSet` legt jedes Element in dem Fach ab, das zu seinem `hashCode` beim Einfügen passt. Nach der Umbenennung hat `tag` einen anderen `hashCode`, `contains` sucht im falschen Fach und findet nichts – obwohl das Objekt sichtbar im Set liegt. `equals` funktioniert weiterhin. Deshalb sollten Data Classes, die als Schlüssel oder in Sets landen, nur `val`-Properties haben; Änderungen erzeugen mit `copy()` ein neues Objekt.
    resources:
      - title: Kotlin-API · Any.equals (Vertrag mit hashCode)
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin/-any/equals.html
  - id: setter-backing-field
    type: gap
    title: Validierender Setter
    prompt: |
      Ergänze die Klasse: `minuten` soll beim Setzen geprüft und dann gespeichert werden. `zyklen` ist von außen nur lesbar. `istLang` hat kein eigenes Feld und wird bei jedem Zugriff berechnet.
    lang: kotlin
    code: |
      class Fokus {
          var minuten: Int = 25
              ⟦set(value)⟧ {
                  require(value in 5..120) { "5 bis 120 Minuten, nicht $value" }
                  ⟦field = value⟧
              }

          var zyklen: Int = 0
              ⟦private set⟧

          val istLang: Boolean
              ⟦get() = minuten > 45⟧

          fun zyklusFertig() { zyklen++ }
      }
    gaps:
      - label: Setter-Kopf
        hint: Der Setter bekommt den neuen Wert als Parameter; der übliche Name ist `value`.
      - label: Speichern
        hint: Nicht `minuten = value` – das wäre ein rekursiver Aufruf.
      - label: Setter einschränken
        hint: Sichtbarkeits-Modifier plus Schlüsselwort, ohne Körper.
      - label: Berechneter Getter
        hint: Ein Getter mit Ausdruckskörper.
        accept: ["get() { return minuten > 45 }"]
    explanation: |
      Im Setter ist `field` das Backing Field; `minuten = value` würde den Setter erneut aufrufen. `private set` lässt den Getter öffentlich und macht nur das Schreiben privat. Eine `val` mit eigenem Getter ohne Initialisierer hat kein Backing Field – der Wert wird bei jedem Zugriff aus `minuten` berechnet und bleibt so immer konsistent.
    resources:
      - title: Kotlin-Doku · Backing fields
        url: https://kotlinlang.org/docs/properties.html#backing-fields
  - id: enum-prioritaet
    type: gap
    title: Prioritäten als Enum mit Daten
    prompt: |
      Ergänze das Enum. Jede Konstante hat ein Label und ein Gewicht, das Enum hat eine Methode. `alleLabels` soll die Labels in Deklarationsreihenfolge liefern – nutze die empfohlene Property statt `values()`.
    lang: kotlin
    code: |
      enum class Prioritaet(⟦val label: String⟧, val gewicht: Int) {
          NIEDRIG("Niedrig", 1),
          MITTEL("Mittel", 2),
          HOCH("Hoch", 3)⟦;⟧

          fun istDringend() = this == HOCH
      }

      fun farbe(p: Prioritaet): String = when (p) {
          Prioritaet.NIEDRIG -> "grau"
          Prioritaet.MITTEL -> "gelb"
          Prioritaet.HOCH -> "rot"
      }

      fun alleLabels(): List<String> = Prioritaet.⟦entries⟧.map { it.label }
    gaps:
      - label: Konstruktor-Property
        hint: Wie bei jeder Klasse – `val`, Name, Typ.
      - label: Trenner vor Mitgliedern
        hint: Folgen nach den Konstanten weitere Mitglieder, braucht es ein Satzzeichen.
      - label: Alle Konstanten
        hint: Seit Kotlin 1.9 die empfohlene Alternative zu `values()`.
    explanation: |
      Enum-Konstanten rufen den Konstruktor des Enums auf, deshalb stehen die Properties wie bei einer normalen Klasse im Kopf. Das Semikolon trennt die Konstantenliste von Methoden und Properties; ohne es kompiliert das Enum nicht. `entries` liefert eine unveränderliche `List`, `values()` jedes Mal ein neues Array. Das `when` in `farbe` braucht kein `else`, weil alle Konstanten aufgezählt sind.
    resources:
      - title: Kotlin-Doku · Enum classes
        url: https://kotlinlang.org/docs/enum-classes.html
  - id: companion-value-class
    type: gap
    title: Typsichere Issue-IDs
    prompt: |
      Ergänze die Lücken. `IssueId` soll zur Compile-Zeit ein eigener Typ sein, zur Laufzeit aber möglichst nur ein `String`. `LinearIssue` lässt sich nur über die Factory-Funktion `LinearIssue.aus(…)` erzeugen.
    lang: kotlin
    code: |
      ⟦@JvmInline⟧
      ⟦value⟧ class IssueId(val wert: String) {
          init {
              require(wert.matches(Regex("[A-Z]+-\\d+"))) { "Ungültige Issue-ID: $wert" }
          }
      }

      class LinearIssue ⟦private constructor⟧(val id: IssueId, val titel: String) {
          ⟦companion object⟧ {
              const val MAX_TITEL = 255

              fun aus(id: String, titel: String): LinearIssue =
                  LinearIssue(IssueId(id), titel.take(MAX_TITEL))
          }
      }
    gaps:
      - label: Annotation für die JVM
        hint: Auf der JVM braucht eine Value Class diese Annotation.
      - label: Art der Klasse
        hint: Eine Klasse, die genau einen Wert umhüllt.
      - label: Konstruktor verstecken
        hint: Sichtbarkeit plus Schlüsselwort, direkt vor der Parameterliste.
      - label: Mitglieder auf Klassenebene
        hint: Kotlin hat kein `static`.
    explanation: |
      `@JvmInline value class` erzeugt einen eigenen Typ, den der Compiler wo möglich durch den umhüllten `String` ersetzt. Der `init`-Block validiert jede ID. `private constructor` verhindert `LinearIssue(…)` von außen; das Companion Object gehört zur Klasse, darf den privaten Konstruktor aufrufen und ist über `LinearIssue.aus(…)` erreichbar. So kann kein `LinearIssue` mit ungeprüfter ID oder zu langem Titel entstehen.
    resources:
      - title: Kotlin-Doku · Inline value classes
        url: https://kotlinlang.org/docs/inline-classes.html
      - title: Kotlin-Doku · Companion objects
        url: https://kotlinlang.org/docs/object-declarations.html#companion-objects
  - id: setter-rekursion
    type: bug
    title: Der Setter, der nie fertig wird
    prompt: |
      Beim Umbenennen einer Erinnerung stürzt die App mit `java.lang.StackOverflowError` ab; der Stacktrace zeigt hunderte Aufrufe von `Erinnerung.setTitel`. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: kotlin
    code: |
      class Erinnerung(titel: String) {
          var titel: String = titel
              set(value) {
                  titel = value.trim()
              }
      }
    lines: [4]
    fix:
      - line: 4
        answers:
          - "field = value.trim()"
    explanation: |
      Innerhalb des Setters ist `titel = …` ein Aufruf des Setters selbst – endlose Rekursion, bis der Stack voll ist. Das gespeicherte Feld erreichst du nur über `field`. Kotlin generiert ein Backing Field, sobald ein Getter oder Setter `field` benutzt oder der Standard-Accessor verwendet wird.
    resources:
      - title: Kotlin-Doku · Backing fields
        url: https://kotlinlang.org/docs/properties.html#backing-fields
  - id: else-verschluckt-fall
    type: bug
    title: Archivierte Aufgaben tauchen wieder auf
    prompt: |
      Seit der Status `ARCHIVIERT` dazugekommen ist, erscheinen archivierte Aufgaben wieder in der Liste. Der Code kompiliert ohne Warnung. Finde die fehlerhafte Zeile und korrigiere sie so, dass der Compiler künftige neue Status meldet.
    lang: kotlin
    code: |
      enum class Status { OFFEN, IN_ARBEIT, ERLEDIGT, ARCHIVIERT }

      fun istSichtbar(status: Status): Boolean = when (status) {
          Status.OFFEN, Status.IN_ARBEIT -> true
          Status.ERLEDIGT -> true
          else -> true
      }
    lines: [6]
    fix:
      - line: 6
        answers:
          - "Status.ARCHIVIERT -> false"
    explanation: |
      Der `else`-Zweig stammt aus einer Zeit, in der er nur für die bekannten Status galt. Er fängt still jeden neuen Status ab – auch `ARCHIVIERT`. `else -> false` würde das Symptom beheben, behält aber das Problem: Der nächste neue Status landet wieder unbemerkt im `else`. Zählst du alle Konstanten auf, ist das `when` ohne `else` erschöpfend, und beim nächsten neuen Status meldet der Compiler `'when' expression must be exhaustive`.
    resources:
      - title: Kotlin-Doku · When expressions (exhaustiveness)
        url: https://kotlinlang.org/docs/control-flow.html#expressions
  - id: verlauf-erklaeren
    type: explain
    title: Ein Verlauf mit begrenzter Länge
    prompt: |
      Erkläre in eigenen Worten, wie `Verlauf` funktioniert: Welchen Typ sieht ein Aufrufer bei `eintraege`, welchen die Klasse selbst? Was passiert beim 51. Eintrag? Wozu dient das Companion Object? Nenne eine Grenze dieses Schutzes.
    lang: kotlin
    code: |
      class Verlauf {
          val eintraege: List<String>
              field = mutableListOf()

          fun merke(eintrag: String) {
              eintraege.add(eintrag)
              if (eintraege.size > MAX) eintraege.removeAt(0)
          }

          companion object {
              private const val MAX = 50
          }
      }
    points:
      - "`eintraege` hat ein Explicit Backing Field (stabil seit Kotlin 2.4): nach außen `List<String>`, innen eine `MutableList<String>`."
      - Innerhalb der Klasse macht der Compiler einen Smart Cast auf `MutableList`, deshalb sind `add` und `removeAt` erlaubt.
      - Beim 51. Eintrag wird der älteste (Index 0) entfernt – der Verlauf hält höchstens 50 Einträge.
      - "`MAX` ist eine private Compile-Zeit-Konstante im Companion Object, die zur Klasse und nicht zu einer Instanz gehört."
      - "Grenze: Die Liste ist zur Laufzeit veränderbar – ein Aufrufer kann mit `as MutableList<String>` casten; außerdem ist die Klasse nicht thread-sicher."
    explanation: |
      `Verlauf` merkt sich die letzten 50 Einträge. Die Property `eintraege` nutzt ein Explicit Backing Field: Außen ist sie eine `List<String>`, also nur lesbar, innen speichert die Klasse eine `MutableList`, auf die der Compiler per Smart Cast zugreift. Früher hätte man dafür eine private `_eintraege` und einen öffentlichen Getter geschrieben. `merke` hängt an und entfernt beim Überschreiten der Grenze das älteste Element am Anfang – ein einfacher Ringpuffer. `MAX` ist als `private const val` im Companion Object eine Konstante der Klasse. Die Einschränkung ist eine Compile-Zeit-Sicht: Das Objekt ist weiterhin eine `MutableList`, ein Cast hebelt den Schutz aus, und bei gleichzeitigen Aufrufen aus mehreren Threads kann die Liste kaputtgehen. `removeAt(0)` verschiebt außerdem alle Elemente; bei 50 Einträgen ist das egal, bei großen Listen wäre `ArrayDeque` besser.
    resources:
      - title: Kotlin-Doku · Explicit backing fields
        url: https://kotlinlang.org/docs/properties.html#explicit-backing-fields
  - id: sichtbarkeit
    type: choice
    title: Wer darf das sehen?
    prompt: |
      Bear hat die Gradle-Module `:app` und `:sync`. In `:sync` steht in der Datei `LinearMapper.kt` die Deklaration `internal class LinearMapper`. Welche Aussage stimmt?
    options:
      - text: Jede Datei im Modul `:sync` kann `LinearMapper` benutzen, Code in `:app` nicht.
        correct: true
        why: "`internal` bedeutet: sichtbar im selben Kotlin-Modul, also in derselben Gradle-Kompilationseinheit."
      - text: Nur Code im selben Paket wie `LinearMapper` kann die Klasse benutzen.
        correct: false
        why: Eine paketbezogene Sichtbarkeit wie Javas „package-private“ gibt es in Kotlin nicht.
      - text: Nur Code in `LinearMapper.kt` kann die Klasse benutzen.
        correct: false
        why: Das wäre `private` auf oberster Ebene.
      - text: "`:app` kann die Klasse benutzen, wenn es `:sync` als Abhängigkeit hat."
        correct: false
        why: Eine Abhängigkeit macht nur öffentliche Deklarationen zugänglich. Genau dafür ist `internal` da.
    explanation: |
      Kotlin hat vier Sichtbarkeiten: `public` (Standard), `internal` (Modul), `protected` (Klasse und Unterklassen) und `private` (Klasse bzw. Datei). `internal` ist das Werkzeug, um Implementierungsdetails eines Gradle-Moduls zu verstecken, sodass andere Module nur die gewollte API sehen.
    resources:
      - title: Kotlin-Doku · Visibility modifiers (Modules)
        url: https://kotlinlang.org/docs/visibility-modifiers.html#modules
  - id: domaene-modellieren
    type: practice
    title: Bears Sync-Domäne modellieren
    prompt: |
      Modelliere einen Ausschnitt von Bears Linear-Sync ohne Strings und Booleans an den falschen Stellen:

      1. `IssueId` als Value Class, die IDs wie `BEAR-7` validiert.
      2. `Status` als Enum mit einer Property `sichtbar` (`ARCHIVIERT` ist unsichtbar).
      3. `Aufgabe` als unveränderliche Data Class mit `id`, `titel`, `prioritaet` (Default `MITTEL`) und `status` (Default `OFFEN`); der Titel darf nicht leer sein. Eine Methode `erledigen()` liefert eine Kopie mit Status `ERLEDIGT`.
      4. `SyncErgebnis` als Sealed Interface mit `Erfolg(hochgeladen, heruntergeladen)`, `Konflikt(lokal, remote)`, `Fehler(meldung, wiederholbar)` und `Offline`.
      5. `zusammenfassung(ergebnis)` mit einem `when` ohne `else`.

      Nutze das `Prioritaet`-Enum aus der Übung oben. Teste alle Fälle in `main`.
    lang: kotlin
    starter: |
      enum class Prioritaet(val label: String) { NIEDRIG("Niedrig"), MITTEL("Mittel"), HOCH("Hoch") }

      // IssueId, Status, Aufgabe, SyncErgebnis, zusammenfassung

      fun main() {
      }
    solution: |
      enum class Prioritaet(val label: String) { NIEDRIG("Niedrig"), MITTEL("Mittel"), HOCH("Hoch") }

      @JvmInline
      value class IssueId(val wert: String) {
          init {
              require(wert.matches(Regex("[A-Z]+-\\d+"))) { "Ungültige Issue-ID: $wert" }
          }
      }

      enum class Status(val sichtbar: Boolean) {
          OFFEN(true), IN_ARBEIT(true), ERLEDIGT(true), ARCHIVIERT(false)
      }

      data class Aufgabe(
          val id: IssueId,
          val titel: String,
          val prioritaet: Prioritaet = Prioritaet.MITTEL,
          val status: Status = Status.OFFEN,
      ) {
          init {
              require(titel.isNotBlank()) { "Titel darf nicht leer sein" }
          }

          fun erledigen(): Aufgabe = copy(status = Status.ERLEDIGT)
      }

      sealed interface SyncErgebnis {
          data class Erfolg(val hochgeladen: Int, val heruntergeladen: Int) : SyncErgebnis
          data class Konflikt(val lokal: Aufgabe, val remote: Aufgabe) : SyncErgebnis
          data class Fehler(val meldung: String, val wiederholbar: Boolean) : SyncErgebnis
          data object Offline : SyncErgebnis
      }

      fun zusammenfassung(ergebnis: SyncErgebnis): String = when (ergebnis) {
          is SyncErgebnis.Erfolg -> "↑ ${ergebnis.hochgeladen} ↓ ${ergebnis.heruntergeladen}"
          is SyncErgebnis.Konflikt ->
              "Konflikt bei ${ergebnis.lokal.id.wert}: „${ergebnis.lokal.titel}“ vs. „${ergebnis.remote.titel}“"
          is SyncErgebnis.Fehler ->
              if (ergebnis.wiederholbar) "Fehler, neuer Versuch später: ${ergebnis.meldung}"
              else "Fehler: ${ergebnis.meldung}"
          SyncErgebnis.Offline -> "Offline – Sync wird nachgeholt"
      }

      fun main() {
          val lokal = Aufgabe(IssueId("BEAR-7"), "Steuer vorbereiten", Prioritaet.HOCH)
          val remote = lokal.copy(titel = "Steuer abgeben")
          println(lokal.erledigen())
          listOf(
              SyncErgebnis.Erfolg(hochgeladen = 3, heruntergeladen = 5),
              SyncErgebnis.Konflikt(lokal, remote),
              SyncErgebnis.Fehler("HTTP 503", wiederholbar = true),
              SyncErgebnis.Offline,
          ).forEach { println(zusammenfassung(it)) }
          println(Status.entries.filter { it.sichtbar })
      }
    checklist:
      - "`IssueId` ist eine `@JvmInline value class` mit Validierung im `init`-Block."
      - "`Status` trägt `sichtbar` als Konstruktor-Property; es gibt kein separates `when` für die Sichtbarkeit."
      - "`Aufgabe` hat nur `val`-Properties im primären Konstruktor und `erledigen()` nutzt `copy`."
      - "`SyncErgebnis` ist ein `sealed interface`; der datenlose Fall ist ein `data object`."
      - "`zusammenfassung` hat ein `when` ohne `else`, und `main` ruft es für alle vier Fälle auf."
      - Benannte Argumente machen Aufrufe wie `Fehler("HTTP 503", wiederholbar = true)` lesbar.
    explanation: |
      Jedes Werkzeug hat hier seinen Platz: Die Value Class verhindert, dass eine Team-ID oder ein beliebiger String als Issue-ID durchgeht. Das Enum bündelt Status und Sichtbarkeit, sodass ein neuer Status seine Sichtbarkeit gleich mitbringen muss. Die Data Class ist unveränderlich und ändert sich nur über `copy` – das passt später direkt zu `StateFlow` und Compose. Das Sealed Interface beschreibt genau vier mögliche Ergebnisse, jedes mit seinen eigenen Daten, und das `when` ohne `else` garantiert, dass ein fünfter Fall an jeder Stelle auffällt.
    resources:
      - title: Kotlin-Doku · Sealed classes (Use case scenarios)
        url: https://kotlinlang.org/docs/sealed-classes.html#use-case-scenarios
      - title: Kotlin-Doku · Data classes
        url: https://kotlinlang.org/docs/data-classes.html
