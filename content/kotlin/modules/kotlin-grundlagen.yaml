lesson: |
  Du kennst TypeScript. Kotlin sieht auf den ersten Blick vertraut aus: `val` statt `const`, der Typ hinter einem Doppelpunkt, Lambdas in geschweiften Klammern. Die Unterschiede sitzen genau dort, wo TypeScript großzügig ist. Kotlin macht aus einem `Int` nie still einen `Long`, `if` liefert einen Wert, und ein `when` ohne passenden Zweig kompiliert gar nicht erst.

  Diese Strenge hat einen praktischen Grund. Stell dir vor, Bear berechnet, wie lange gelöschte Aufgaben im Papierkorb bleiben: `tage * 24 * 60 * 60 * 1000`. Mit 7 Tagen stimmt das Ergebnis. Mit 30 Tagen kommt eine negative Zahl heraus, und die Aufgaben verschwinden sofort. Wer versteht, wie Kotlin mit Typen und Ausdrücken umgeht, findet solche Fehler beim Lesen statt im Bugreport. Dieses Modul legt dafür das Fundament: wie ein Programm startet, wie Werte und Typen funktionieren, warum fast alles ein Ausdruck ist und wie du Funktionen schreibst, die sich gut aufrufen lassen.

  ## Wo Kotlin läuft und wie ein Programm startet

  Kotlin ist eine statisch typisierte Sprache von JetBrains. Für die JVM erzeugt der Compiler Java-kompatiblen Bytecode; für JavaScript, WebAssembly und native Plattformen (über LLVM) gibt es eigene Backends ([FAQ: What does Kotlin compile down to?](https://kotlinlang.org/docs/faq.html#what-does-kotlin-compile-down-to)). Auf Android ist Kotlin seit der Google I/O 2019 die bevorzugte Sprache ([Android's Kotlin-first approach](https://developer.android.com/kotlin/first)) – Jetpack Compose und die meisten neuen Jetpack-Bibliotheken sind zuerst für Kotlin gebaut. Mit [Kotlin Multiplatform](https://kotlinlang.org/docs/multiplatform/kmp-overview.html) teilst du Code zwischen Android, iOS, Desktop, Web und Server. Bear ist eine Android-App: Dein Kotlin-Code wird zu JVM-Bytecode kompiliert und im Build in DEX-Code für die Android Runtime umgewandelt. Alles in diesem Modul gilt für jede Plattform.

  Ein Kotlin-Programm startet in `main`:

  ```kotlin
  fun main() {
      println("Bear synchronisiert …")
  }
  ```

  `main` ist eine **Top-Level-Funktion**: Sie steht direkt in der Datei, ohne umschließende Klasse. Die zweite erlaubte Form `fun main(args: Array<String>)` bekommt die Kommandozeilenargumente ([Program entry point](https://kotlinlang.org/docs/basic-syntax.html#program-entry-point)). In einer Android-App schreibst du kein `main` – dort startet das System deine `Activity`. Für Experimente und die Übungen hier reicht eine Datei mit `main`, die du in IntelliJ IDEA, Android Studio (als Scratch File) oder im [Kotlin Playground](https://play.kotlinlang.org) ausführst.

  > [!DEEP] Top-Level-Funktionen auf der JVM
  > Die JVM kennt keine Funktionen außerhalb von Klassen. Der Compiler packt deshalb alle Top-Level-Deklarationen einer Datei `Zeitformat.kt` in eine generierte Klasse `ZeitformatKt`, eine sogenannte File Facade ([Coding conventions: Source file names](https://kotlinlang.org/docs/coding-conventions.html#source-file-names)). Aus Kotlin merkst du davon nichts. Aus Java rufst du `ZeitformatKt.formatiere(…)` auf, und in Stacktraces taucht der Name `ZeitformatKt` auf.

  ## val, var und Typinferenz

  ```kotlin
  val appName = "Bear"              // Typ String, vom Compiler abgeleitet
  var offeneAufgaben = 3            // Typ Int, abgeleitet
  offeneAufgaben += 1               // erlaubt: var darf neu zugewiesen werden
  // appName = "Bär"                // Fehler: 'val' cannot be reassigned.

  val intervallMinuten: Long = 15   // Typ ausdrücklich angegeben
  ```

  `val` deklariert eine Variable, die genau einmal zugewiesen wird. `var` darf später neu zugewiesen werden. Das Denkmodell: Eine Variable ist ein Etikett, das auf ein Objekt zeigt. Bei `val` klebt das Etikett fest. Das Objekt dahinter kann trotzdem veränderlich sein:

  ```kotlin
  val erledigt = mutableListOf("Einkaufen")
  erledigt.add("Steuer")              // erlaubt: die Liste ändert sich, das Etikett nicht
  // erledigt = mutableListOf()       // Fehler: 'val' cannot be reassigned.
  ```

  Das entspricht `const` in TypeScript. „Unveränderlich“ im Sinne von „der Inhalt bleibt gleich“ bekommst du erst mit unveränderlichen Typen wie `List` statt `MutableList` – das vertieft das Modul Collections.

  **Typinferenz** heißt: Der Compiler leitet den Typ aus dem Initialisierer ab und legt ihn zur Compile-Zeit fest. `var zaehler = 0` ist für immer ein `Int`; `zaehler = "drei"` scheitert. Kotlin ist also nicht dynamisch, du schreibst den Typ nur seltener hin. Schreib ihn trotzdem aus, wenn der abgeleitete Typ nicht der gewünschte ist (`val limit: Long = 15`), wenn eine Property keinen Initialisierer hat oder wenn eine Funktion Teil einer öffentlichen API ist.

  Für echte Konstanten gibt es `const val`. Der Wert muss zur Compile-Zeit feststehen, der Typ ein primitiver Typ oder `String` sein, und die Deklaration steht auf oberster Ebene oder in einem `object` ([Compile-time constants](https://kotlinlang.org/docs/properties.html#compile-time-constants)). Der Compiler setzt den Wert direkt an jeder Verwendungsstelle ein.

  > [!MERKE]
  > Standard ist `val`. Nimm `var` nur, wenn sich der Wert wirklich ändern muss. Die [Coding Conventions](https://kotlinlang.org/docs/coding-conventions.html#immutability) verlangen das ausdrücklich: Jedes `val` ist eine Stelle weniger, an der du beim Lesen nachverfolgen musst, wer wann zuweist.

  ## Grundtypen und explizite Konvertierung

  | Typ | Literale | Hinweis |
  | --- | --- | --- |
  | `Int` | `42`, `1_000_000` | 32 Bit, Standard für ganze Zahlen |
  | `Long` | `42L`, `3_000_000_000` | 64 Bit; Literale jenseits des `Int`-Bereichs werden automatisch `Long` |
  | `Double` | `3.14`, `1e-3` | 64-Bit-Gleitkommazahl, Standard für Kommazahlen |
  | `Float` | `2.5f` | 32 Bit, selten nötig |
  | `Boolean` | `true`, `false` | |
  | `Char` | `'B'`, `'\n'` | ein UTF-16-Zeichen, **keine** Zahl |
  | `String` | `"Bear"` | unveränderlich; jede Operation liefert einen neuen String |

  Aus Sicht der Sprache ist alles ein Objekt, du kannst `42.toString()` schreiben. Auf der JVM erzeugt der Compiler trotzdem primitive `int`- und `long`-Werte, solange der Typ nicht nullable oder generisch ist ([Boxing on the JVM](https://kotlinlang.org/docs/numbers.html#boxing-and-caching-numbers-on-the-jvm)).

  Der wichtigste Unterschied zu Java und TypeScript: **Zahlentypen werden nie implizit erweitert.** Ein `Int` ist kein `Long`:

  ```kotlin
  val versuche: Int = 3
  val timeoutMs: Long = versuche            // Fehler: initializer type mismatch: expected 'Long', actual 'Int'.
  val timeoutOk: Long = versuche.toLong()   // OK: explizite Konvertierung
  val wartezeit: Long = 15                  // OK: das Literal wird direkt als Long gelesen
  ```

  Die Doku begründet das mit stillem Datenverlust und überraschendem Verhalten ([Type conversion](https://kotlinlang.org/docs/numbers.html#type-conversion)). Bei gemischten Rechnungen hilft Kotlin dir: `Int + Long` ergibt `Long`, weil die Operatoren für jede Kombination überladen sind. Nur Zuweisung und Funktionsargumente brauchen die Konvertierung mit `toLong()`, `toInt()`, `toDouble()` und Co.

  Zwei Eigenschaften von Ganzzahlen kosten in der Praxis am meisten Zeit:

  ```kotlin
  println(7 / 2)              // 3 – Ganzzahldivision, der Rest fällt weg
  println(7 / 2.0)            // 3.5 – ein Double-Operand macht die Division zur Gleitkommadivision
  println(7 % 2)              // 1 – Rest
  println(Int.MAX_VALUE + 1)  // -2147483648 – Überlauf ohne Fehlermeldung
  ```

  Ganzzahldivision rundet zur Null hin ([Integer division](https://kotlinlang.org/docs/numbers.html#integer-division)). Überläufe wirft die JVM nicht als Fehler, die Zahl springt ans andere Ende des Wertebereichs ([Overflow in operations](https://kotlinlang.org/docs/numbers.html#overflow-in-operations)). Genau das passiert in `tage * 24 * 60 * 60 * 1000`: Alle Operanden sind `Int`, also rechnet Kotlin in `Int`, und ab 25 Tagen läuft das Ergebnis über. Ein einziger `Long`-Operand am Anfang (`tage * 24L * …`) hebt die ganze Rechnung auf 64 Bit. Noch lesbarer ist [`kotlin.time.Duration`](https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.time/-duration/): `30.days.inWholeMilliseconds`.

  `Char` ist keine Zahl. `'a' + 1` ergibt das Zeichen `'b'`, den Zahlenwert liefert `'a'.code` (97), und `val c: Int = 'a'` kompiliert nicht ([Characters](https://kotlinlang.org/docs/characters.html)). Gleichheit prüfst du mit `==`; das ruft `equals` auf und vergleicht bei Strings den Inhalt. `===` prüft, ob zwei Referenzen auf dasselbe Objekt zeigen ([Equality](https://kotlinlang.org/docs/equality.html)).

  ## Strings: Templates und Raw Strings

  ```kotlin
  val name = "Steven"
  val offen = 4
  println("Hallo, $name! Du hast $offen offene Aufgaben.")
  println("Das sind ${offen * 25} Minuten Fokuszeit.")
  println("$name.length")      // Steven.length – eingesetzt wird nur name
  println("${name.length}")    // 6
  ```

  Nach `$` liest Kotlin den längsten gültigen Bezeichner. Alles, was mehr ist als ein einfacher Name – ein Property-Zugriff, ein Aufruf, eine Rechnung –, gehört in `${…}` ([String templates](https://kotlinlang.org/docs/strings.html#string-templates)). Ist der eingesetzte Wert `null`, landet der Text `null` im String. Wie du das verhinderst, zeigt das Modul Null-Safety.

  **Raw Strings** in dreifachen Anführungszeichen kennen keine Escape-Sequenzen und behalten Zeilenumbrüche. Mit `trimIndent()` entfernst du die gemeinsame Einrückung, mit `trimMargin()` alles bis einschließlich eines Randzeichens (Standard `|`) ([Multiline strings](https://kotlinlang.org/docs/strings.html#multiline-strings)). Das passt gut zu GraphQL-Abfragen, wie Bear sie an die Linear-API schickt. GraphQL-Variablen beginnen aber mit `$` – und das würde Kotlin als Template lesen. Seit Kotlin 2.2 löst **Multi-Dollar-Interpolation** das: Mit `$$` vor dem String startet erst `$$` eine Ersetzung, ein einzelnes `$` bleibt Text ([Multi-dollar string interpolation](https://kotlinlang.org/docs/strings.html#multi-dollar-string-interpolation)).

  ```kotlin
  val teamId = "BEAR"
  val query = $$"""
      query Issues($first: Int!) {
        team(id: "$$teamId") { issues(first: $first) { nodes { id title } } }
      }
  """.trimIndent()
  // $first bleibt stehen, $$teamId wird zu BEAR
  ```

  In älterem Code findest du stattdessen `${'$'}` für ein einzelnes Dollarzeichen.

  ## if und when sind Ausdrücke

  Kotlin hat keinen ternären Operator `a ? b : c`, weil `if` selbst einen Wert liefert:

  ```kotlin
  val status = if (offen == 0) "Alles erledigt" else "$offen offen"
  ```

  Als Ausdruck braucht `if` immer einen `else`-Zweig, sonst meldet der Compiler `'if' must have both main and 'else' branches when used as an expression.` Besteht ein Zweig aus einem Block, ist der letzte Ausdruck im Block sein Wert ([If expression](https://kotlinlang.org/docs/control-flow.html#if-expression)).

  `when` ersetzt `switch` und lange `else if`-Ketten. Es gibt keinen Fall-through: Kotlin prüft die Zweige von oben nach unten, und der **erste** passende Zweig gewinnt.

  ```kotlin
  fun beschreibe(statusCode: Int): String = when (statusCode) {
      200, 204 -> "OK"
      in 400..499 -> "Fehler in der Anfrage"
      in 500..599 -> "Serverfehler, später erneut versuchen"
      else -> "Unerwarteter Status $statusCode"
  }
  ```

  Ohne Subjekt ist jeder Zweig eine beliebige Bedingung:

  ```kotlin
  val hinweis = when {
      akku < 15 -> "Sync pausiert: Akku niedrig"
      !online -> "Offline – Änderungen bleiben lokal gespeichert"
      else -> "Synchronisiere"
  }
  ```

  Als Ausdruck muss `when` **erschöpfend** sein: Für jeden möglichen Wert muss ein Zweig passen ([When expressions and statements](https://kotlinlang.org/docs/control-flow.html#when-expressions-and-statements)). Bei `Int` oder `String` geht das nur mit `else`. Bei `Boolean`, Enums und Sealed Types kennt der Compiler alle Fälle und verzichtet auf `else`. Kommt später ein Enum-Wert dazu, meldet er jede Stelle, die ihn nicht behandelt: `'when' expression must be exhaustive. Add the 'HOCH' branch or an 'else' branch.` Das ist einer der größten Vorteile von Kotlin; das Modul Klassen & Objekte baut darauf auf.

  ## Ranges und Schleifen

  ```kotlin
  for (i in 1..3) print(i)                    // 123  – Ende inklusive
  for (i in 0..<3) print(i)                   // 012  – Ende exklusive
  for (i in 10 downTo 1 step 3) print("$i ")  // 10 7 4 1
  for (aufgabe in aufgaben) println(aufgabe)
  for ((index, aufgabe) in aufgaben.withIndex()) println("$index: $aufgabe")
  for (i in aufgaben.indices) println(aufgaben[i])
  repeat(3) { versuch -> println("Versuch $versuch") }
  ```

  `a..b` ist ein geschlossener Bereich, `a..<b` (gleichbedeutend mit `a until b`) lässt das Ende weg ([Ranges and progressions](https://kotlinlang.org/docs/ranges.html)). `downTo` zählt rückwärts, `step` ändert die Schrittweite. Kotlin hat keine C-artige Schleife `for (i = 0; i < n; i++)`. `for` läuft über alles, was einen Iterator liefert: Ranges, Listen, Strings (Zeichen für Zeichen), Maps. Für Indizes nimmst du `indices` oder `withIndex()`, dann kann der Index nicht über das Ende hinauslaufen.

  Ranges funktionieren auch als Bedingung: `if (stunde in 9..17)`. Dazu kommen `while` und `do { … } while (…)` sowie `break` und `continue`, die sich mit Labels auch auf äußere Schleifen beziehen können ([Returns and jumps](https://kotlinlang.org/docs/returns.html)).

  ## Funktionen

  ```kotlin
  fun fokusMinuten(pomodoros: Int, minutenProPomodoro: Int = 25): Int {
      return pomodoros * minutenProPomodoro
  }
  ```

  Parameter tragen immer einen Typ. Besteht der Körper aus einem einzigen Ausdruck, schreibst du ihn mit `=` und lässt `return` und meist auch den Rückgabetyp weg ([Single-expression functions](https://kotlinlang.org/docs/functions.html#single-expression-functions)):

  ```kotlin
  fun fokusMinuten(pomodoros: Int, minutenProPomodoro: Int = 25) = pomodoros * minutenProPomodoro
  ```

  Funktionen ohne sinnvollen Rückgabewert liefern `Unit`. Das ähnelt `void`, ist aber ein echtes Objekt, das du nicht hinschreiben musst ([Unit-returning functions](https://kotlinlang.org/docs/functions.html#unit-returning-functions)).

  **Default- und benannte Argumente** ersetzen in Kotlin die Überladungsketten und Builder aus Java:

  ```kotlin
  fun planeSync(
      intervallMinuten: Long = 15,
      nurWlan: Boolean = true,
      maxVersuche: Int = 3,
  ) { /* … */ }

  planeSync()                                        // alle Defaults
  planeSync(nurWlan = false)                         // nur ein Wert anders
  planeSync(intervallMinuten = 60, maxVersuche = 5)  // Reihenfolge frei wählbar
  ```

  Vergleiche das mit `planeSync(60, false, 5)`: Niemand weiß beim Lesen, was `false` bedeutet. Benannte Argumente machen den Aufruf selbsterklärend und bleiben richtig, wenn jemand die Parameterreihenfolge ändert ([Named arguments](https://kotlinlang.org/docs/functions.html#named-arguments)). Das Komma nach dem letzten Parameter (Trailing Comma) ist erlaubt und macht Diffs kleiner.

  Hilfsfunktionen legst du als Top-Level-Funktionen in eine Datei, die nach ihrem Inhalt heißt, etwa `Zeitformat.kt`. Eine Klasse `Utils` mit statischen Methoden wie in Java brauchst du nicht.

  ## Coding Conventions

  Die offiziellen [Kotlin Coding Conventions](https://kotlinlang.org/docs/coding-conventions.html) sind in IntelliJ IDEA und Android Studio als Formatierungsstil hinterlegt. Android ergänzt sie im [Kotlin style guide](https://developer.android.com/kotlin/style-guide). Die Regeln, die im Review am häufigsten auffallen:

  - Einrückung mit vier Leerzeichen, keine Tabs.
  - `PascalCase` für Klassen und Objekte, `camelCase` für Funktionen, Properties und lokale Variablen, `SCREAMING_SNAKE_CASE` für `const val` und tief unveränderliche Top-Level-Werte ([Naming rules](https://kotlinlang.org/docs/coding-conventions.html#naming-rules)).
  - `if` für zwei Fälle, `when` ab drei ([if versus when](https://kotlinlang.org/docs/coding-conventions.html#if-versus-when)).
  - Ausdruckskörper für kurze Funktionen, String-Templates statt `+`, Default-Argumente statt Überladungen.
  - Dateien mit einer Klasse heißen wie die Klasse; andere Dateien beschreiben ihren Inhalt, ohne Füllwörter wie `Util`.

  Automatisch prüfen lässt sich das mit [ktlint](https://github.com/pinterest/ktlint) oder [detekt](https://detekt.dev/) in der CI.

  ## Häufige Fehler

  - **`if` ohne `else` als Ausdruck.** Symptom: `'if' must have both main and 'else' branches when used as an expression.` Lösung: `else` ergänzen oder `if` als Anweisung nutzen.
  - **Überlauf bei Zeitrechnungen.** Symptom: negative oder viel zu kleine Werte, nur bei großen Eingaben. Lösung: früh auf `Long` wechseln (`24L`) oder `Duration` nutzen.
  - **Ganzzahldivision bei Prozenten.** `erledigt / gesamt * 100` ergibt für 3 von 4 Aufgaben `0`, weil `3 / 4` schon `0` ist. Lösung: erst multiplizieren (`erledigt * 100 / gesamt`) oder in `Double` rechnen.
  - **`0..liste.size` als Indexbereich.** Symptom: `IndexOutOfBoundsException: Index 3 out of bounds for length 3`. Lösung: `liste.indices` oder `0..<liste.size`.
  - **`"$aufgabe.titel"`** setzt `aufgabe.toString()` ein und hängt `.titel` als Text an. Lösung: `"${aufgabe.titel}"`.
  - **`Int` an eine Funktion übergeben, die `Long` erwartet.** Symptom: `argument type mismatch: actual type is 'Int', but 'Long' was expected.` Lösung: an der Grenze mit `toLong()` konvertieren, nicht den Parametertyp aufweichen.

  > [!PRAXIS]
  > Android-APIs rechnen Zeit fast immer in `Long` – Millisekunden bei `System.currentTimeMillis()`, das Intervall bei WorkManager. Kotlin zwingt dich, die Konvertierung sichtbar zu machen, und im Code-Review fällt jede `Int`-Rechnung mit Zeitwerten auf. Ebenso typisch sind Review-Kommentare zu `var`, wo `val` reicht, zu magischen Zahlen statt `const val` und zu Aufrufen wie `planeSync(60, false, 5)`, die ohne benannte Argumente niemand versteht. Im Praxis-Track Bear siehst du an echtem Code, wie Konstanten, String-Templates und `when` dort eingesetzt sind.

  > [!INTERVIEW] Was ist der Unterschied zwischen `val`, `var` und `const val`?
  > „`var` darf neu zugewiesen werden, `val` genau einmal. `val` macht aber nur die Referenz fest, nicht das Objekt – eine `val`-Variable kann auf eine `MutableList` zeigen. `const val` ist eine Compile-Zeit-Konstante: nur primitive Typen und `String`, nur auf oberster Ebene oder in einem `object`, und der Compiler setzt den Wert direkt an der Aufrufstelle ein. Ich nehme standardmäßig `val` und wechsle nur zu `var`, wenn sich der Wert wirklich ändern muss.“

  ## Zusammenfassung

  - Ein Programm startet in `fun main()`. Funktionen dürfen auf oberster Ebene stehen; auf der JVM landen sie in einer generierten Klasse `DateinameKt`.
  - `val` ist Standard, `var` die Ausnahme. `val` fixiert die Referenz, nicht den Inhalt.
  - Typinferenz legt den Typ zur Compile-Zeit fest. Zahlentypen werden nie implizit erweitert; konvertiere mit `toLong()`, `toDouble()` usw.
  - Ganzzahldivision schneidet ab, Überläufe passieren still. Zeitrechnungen gehören in `Long` oder `Duration`.
  - Templates: `$name` für Namen, `${…}` für alles andere. Raw Strings mit `trimIndent()`, `$$"""…"""` für Text mit Dollarzeichen.
  - `if` und `when` sind Ausdrücke. Als Ausdruck braucht `if` ein `else`, und `when` muss erschöpfend sein; der erste passende Zweig gewinnt.
  - `..` schließt das Ende ein, `..<` nicht. Für Indizes nimmst du `indices` oder `withIndex()`.
  - Default- und benannte Argumente ersetzen Überladungen und machen Aufrufe mit mehreren Parametern lesbar.
exercises:
  - id: val-bedeutung
    type: choice
    title: Was verspricht val?
    prompt: Welche Aussagen über diesen Code stimmen? (Mehrere Antworten richtig.)
    lang: kotlin
    code: |
      val eintraege = mutableListOf("Lesen")
      eintraege.add("Laufen")
    options:
      - text: Der Code kompiliert. `val` verhindert nur, dass `eintraege` später auf eine andere Liste zeigt.
        correct: true
        why: "`val` fixiert die Referenz. Die Liste selbst ist eine `MutableList` und darf verändert werden."
      - text: Der Typ von `eintraege` steht zur Compile-Zeit fest (`MutableList<String>`), obwohl er nicht dasteht.
        correct: true
        why: Typinferenz leitet den Typ aus dem Initialisierer ab. Kotlin ist statisch typisiert, auch ohne Typangabe.
      - text: Der Code kompiliert nicht, weil `val` die Liste unveränderlich macht.
        correct: false
        why: Unveränderlichkeit des Inhalts kommt vom Typ (`List` statt `MutableList`), nicht von `val`.
      - text: "`val` und `const val` sind austauschbar; beide werden zur Compile-Zeit ausgewertet."
        correct: false
        why: "`val` wird zur Laufzeit zugewiesen und darf jeden Typ haben. `const val` erlaubt nur primitive Typen und `String` mit einem Wert, der beim Kompilieren feststeht."
    explanation: |
      `val` ist ein Etikett, das fest an einem Objekt klebt. Ob sich das Objekt verändern lässt, entscheidet sein Typ: `mutableListOf` liefert eine `MutableList`, also ist `add` erlaubt. Der Typ steht trotzdem fest – Typinferenz spart nur das Hinschreiben. `const val` ist ein Sonderfall für Compile-Zeit-Konstanten.
    resources:
      - title: Kotlin-Doku · Variables
        url: https://kotlinlang.org/docs/basic-syntax.html#variables
      - title: Kotlin-Doku · Compile-time constants
        url: https://kotlinlang.org/docs/properties.html#compile-time-constants
  - id: when-reihenfolge
    type: order
    title: Die Ampel für die Auslastung
    prompt: |
      Bring die Zeilen in die richtige Reihenfolge. `ampel(95)` soll `Auslastung 95 %: rot` liefern und `ampel(75)` soll `Auslastung 75 %: gelb` liefern.
    lang: kotlin
    lines: |
      fun ampel(auslastung: Int): String {
          val farbe = when {
              auslastung >= 90 -> "rot"
              auslastung >= 70 -> "gelb"
              else -> "grün"
          }
          return "Auslastung $auslastung %: $farbe"
      }
    explanation: |
      `when` prüft die Zweige von oben nach unten, der erste passende gewinnt. Stünde `auslastung >= 70` vor `auslastung >= 90`, bekäme auch 95 die Farbe „gelb“, weil 95 schon die erste Bedingung erfüllt. `else` muss der letzte Zweig sein – sonst meldet der Compiler `'else' entry must be the last one in a 'when' expression.` Das `when` ist ein Ausdruck, sein Wert landet in `farbe`.
    resources:
