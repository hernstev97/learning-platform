  - id: string-templates
    type: output
    title: Was landet im String?
    prompt: Was gibt dieses Programm aus? Die Zeilen im Raw String sind im Quelltext mit acht bzw. zehn Leerzeichen eingerückt.
    lang: kotlin
    code: |
      fun main() {
          val titel = "Steuer"
          val minuten = 90
          println("$titel.length")
          println("${titel.length} Zeichen")
          println("Dauer: ${minuten / 60} h ${minuten % 60} min")
          println("Kosten: ${'$'}5")
          val raw = """
              Zeile\n
                eingerückt
          """.trimIndent()
          println(raw)
      }
    expected: |
      Steuer.length
      6 Zeichen
      Dauer: 1 h 30 min
      Kosten: $5
      Zeile\n
        eingerückt
    explanation: |
      Nach `$` liest Kotlin nur den Namen `titel`; `.length` bleibt Text. Mit `${…}` wird der ganze Ausdruck ausgewertet. `${'$'}` setzt das Zeichen `$` ein. Raw Strings kennen keine Escape-Sequenzen: `\n` bleibt als Backslash und `n` stehen. `trimIndent()` entfernt die gemeinsame Einrückung aller nicht leeren Zeilen und die leere erste und letzte Zeile; die zusätzliche Einrückung von „eingerückt“ bleibt erhalten.
