id: kotlin-grundlagen
title: Kotlin-Grundlagen
level: 1
minutes: 150
summary: Werte, Typen, Ausdrücke und Funktionen – das Fundament, auf dem jede Zeile Android-Code steht.
goals:
  - Du entscheidest begründet zwischen `val`, `var` und `const val` und erklärst, was Typinferenz leistet.
  - Du konvertierst Zahlentypen explizit und erkennst Ganzzahldivision und Überläufe, bevor sie Daten kosten.
  - Du nutzt `if` und `when` als Ausdrücke und weißt, wann der Compiler einen `else`-Zweig verlangt.
  - Du schreibst Schleifen über Ranges ohne Off-by-one-Fehler.
  - Du schreibst Funktionen mit Ausdruckskörper, Default- und benannten Argumenten.
  - Du formatierst und benennst Code nach den offiziellen Kotlin Coding Conventions.
