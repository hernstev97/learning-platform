  - id: when-statuscodes
    type: gap
    title: Statuscodes der Linear-API übersetzen
    prompt: |
      Ergänze die Funktion so, dass sie für jeden HTTP-Statuscode eine Meldung liefert. `401` soll eine eigene Meldung bekommen, alle anderen 4xx-Codes die allgemeine. Die Funktion hat einen Ausdruckskörper.
    lang: kotlin
    code: |
      fun meldung(statusCode: Int): String = ⟦when⟧ (statusCode) {
          200, 204 -> "Gespeichert"
          401 -> "Bitte neu anmelden"
          ⟦in 400..499⟧ -> "Anfrage fehlerhaft ($statusCode)"
          in 500..599 -> "Linear ist gerade nicht erreichbar"
          ⟦else⟧ -> "Unerwarteter Status $statusCode"
      }
    gaps:
      - label: Ausdruck mit Subjekt
        hint: Das Kotlin-Gegenstück zu `switch`, aber als Ausdruck.
      - label: Bereich 400 bis 499
        hint: Mit `in` prüfst du, ob der Wert in einem Range liegt.
        accept: ["in 400..<500", "in 400 until 500"]
      - label: Alle übrigen Fälle
        hint: Ein `Int` hat unendlich viele Werte – ohne diesen Zweig ist das `when` nicht erschöpfend.
    explanation: |
      `when (statusCode)` vergleicht das Subjekt mit jedem Zweig. `in 400..499` prüft die Zugehörigkeit zum Range. `401` muss **vor** dem Range stehen, weil der erste passende Zweig gewinnt. Als Ausdruck muss `when` erschöpfend sein; bei `Int` geht das nur mit `else`.
    resources:
      - title: Kotlin-Doku · Other ways to use when
        url: https://kotlinlang.org/docs/control-flow.html#other-ways-to-use-when
  - id: defaults-benannt
    type: gap
    title: Pomodoros mit Standardlänge
    prompt: |
      Ergänze die Funktion: `minutenProPomodoro` soll standardmäßig 25 sein, und der Körper soll ein Ausdruckskörper ohne `return` sein. Im zweiten Aufruf übergibst du 50 als **benanntes** Argument.
    lang: kotlin
    code: |
      fun fokusMinuten(pomodoros: Int, minutenProPomodoro: Int ⟦= 25⟧) ⟦=⟧ pomodoros * minutenProPomodoro

      fun main() {
          println(fokusMinuten(4))                            // 100
          println(fokusMinuten(4, ⟦minutenProPomodoro = 50⟧)) // 200
      }
    gaps:
      - label: Default-Wert
        hint: Der Default steht mit `=` direkt hinter dem Typ.
      - label: Ausdruckskörper
        hint: Statt `{ return … }` reicht ein Zeichen. Den Rückgabetyp darfst du ergänzen.
        accept: [": Int ="]
      - label: Benanntes Argument
        hint: Name des Parameters, Gleichheitszeichen, Wert.
    explanation: |
      Ein Default-Wert macht den Parameter optional, deshalb funktioniert `fokusMinuten(4)`. Ein Ausdruckskörper mit `=` ersetzt Block und `return`; der Rückgabetyp `Int` wird abgeleitet. Das benannte Argument `minutenProPomodoro = 50` macht an der Aufrufstelle klar, was die 50 bedeutet – bei zwei `Int`-Parametern hintereinander ist das Gold wert.
    resources:
      - title: Kotlin-Doku · Parameters with default values
        url: https://kotlinlang.org/docs/functions.html#parameters-with-default-values
      - title: Kotlin-Doku · Named arguments
        url: https://kotlinlang.org/docs/functions.html#named-arguments
  - id: explizit-konvertieren
    type: gap
    title: Int, Long und Double sauber trennen
    prompt: |
      Ergänze den Code so, dass er kompiliert. `STANDARD_INTERVALL_MINUTEN` ist eine Compile-Zeit-Konstante, `planeSync` erwartet ein `Long`, und `quote` soll `0.75` sein (nicht `0.0`). Konvertiere explizit.
    lang: kotlin
    code: |
      ⟦const val⟧ STANDARD_INTERVALL_MINUTEN = 15L

      fun planeSync(intervallMinuten: Long) {
          println("Sync alle $intervallMinuten Minuten")
      }

      fun main() {
          val ausEinstellungen: Int = "30".toInt()
          planeSync(⟦ausEinstellungen.toLong()⟧)
          planeSync(STANDARD_INTERVALL_MINUTEN)

          val erledigt = 3
          val gesamt = 4
          val quote: Double = ⟦erledigt.toDouble()⟧ / gesamt
          println("Quote: $quote")
      }
    gaps:
      - label: Compile-Zeit-Konstante
        hint: Zwei Schlüsselwörter; das zweite kennst du von normalen Variablen.
      - label: Int zu Long
        hint: Jeder Zahlentyp hat Funktionen der Form `toXxx()`.
      - label: Int zu Double
        hint: Ist ein Operand ein `Double`, wird die ganze Division zur Gleitkommadivision.
        accept: ["erledigt * 1.0"]
    explanation: |
      `const val` markiert eine Konstante, deren Wert der Compiler direkt einsetzt. Ein `Int` wird nie still zum `Long`, deshalb braucht der Aufruf `toLong()`. Bei `quote` reicht es, **einen** Operanden zu konvertieren: `3.0 / 4` ergibt `0.75`. `(erledigt / gesamt).toDouble()` wäre falsch – das konvertiert erst nach der Ganzzahldivision und liefert `0.0`.
    resources:
      - title: Kotlin-Doku · Type conversion
        url: https://kotlinlang.org/docs/numbers.html#type-conversion
  - id: papierkorb-ueberlauf
    type: bug
    title: Der Papierkorb leert sich zu früh
    prompt: |
      `aufbewahrungMillis(tage)` berechnet, wie lange gelöschte Aufgaben im Papierkorb bleiben. `aufbewahrungMillis(7)` liefert korrekt `604800000`. `aufbewahrungMillis(30)` liefert aber `-1702967296`, und Bear löscht die Aufgaben sofort endgültig. Finde die fehlerhafte Zeile und korrigiere sie, ohne die Signatur zu ändern.
    lang: kotlin
    code: |
      fun aufbewahrungMillis(tage: Int): Long {
          val millis = tage * 24 * 60 * 60 * 1000
          return millis.toLong()
      }
    lines: [2]
    fix:
      - line: 2
        answers:
          - "val millis = tage * 24L * 60 * 60 * 1000"
          - "val millis = tage.toLong() * 24 * 60 * 60 * 1000"
          - "val millis: Long = tage.toLong() * 24 * 60 * 60 * 1000"
          - "val millis: Long = tage * 24L * 60 * 60 * 1000"
          - "val millis = tage * 24 * 60 * 60 * 1000L"
          - "val millis = 1000L * 60 * 60 * 24 * tage"
    explanation: |
      Alle Operanden in Zeile 2 sind `Int`, also rechnet Kotlin in 32 Bit. 30 Tage sind 2 592 000 000 ms, mehr als `Int.MAX_VALUE` (2 147 483 647) – der Wert läuft still über und wird negativ. `toLong()` in Zeile 3 kommt zu spät, weil der Überlauf schon passiert ist. Ein `Long`-Operand am Anfang der Rechnung (`24L` oder `tage.toLong()`) hebt jede folgende Multiplikation auf 64 Bit. Noch lesbarer: `tage.days.inWholeMilliseconds` mit `kotlin.time.Duration`.
    hints:
      - Wie groß ist `Int.MAX_VALUE` ungefähr, und wie viele Millisekunden hat ein Monat?
    resources:
      - title: Kotlin-Doku · Overflow in operations
        url: https://kotlinlang.org/docs/numbers.html#overflow-in-operations
      - title: Kotlin-API · Duration
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.time/-duration/
  - id: liste-off-by-one
    type: bug
    title: Die nummerierte Liste stürzt ab
    prompt: |
      `druckeListe` soll Aufgaben nummeriert ausgeben. Mit drei Aufgaben erscheinen alle drei Zeilen korrekt, danach stürzt das Programm ab: `java.lang.ArrayIndexOutOfBoundsException: Index 3 out of bounds for length 3`. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: kotlin
    code: |
      fun druckeListe(aufgaben: List<String>) {
          for (i in 0..aufgaben.size) {
              println("${i + 1}. ${aufgaben[i]}")
          }
      }
    lines: [2]
    fix:
      - line: 2
        answers:
          - "for (i in aufgaben.indices) {"
          - "for (i in 0..<aufgaben.size) {"
          - "for (i in 0 until aufgaben.size) {"
          - "for (i in 0..aufgaben.lastIndex) {"
          - "for (i in 0..aufgaben.size - 1) {"
    explanation: |
      `0..aufgaben.size` schließt das Ende ein. Bei drei Elementen läuft `i` von 0 bis 3, gültige Indizes sind aber nur 0 bis 2. `aufgaben.indices` liefert genau den gültigen Bereich und drückt die Absicht aus; `0..<aufgaben.size` ist gleichwertig. Noch direkter: `for ((i, aufgabe) in aufgaben.withIndex())` – dann brauchst du gar keinen Indexzugriff mehr.
    resources:
      - title: Kotlin-Doku · Ranges and progressions
        url: https://kotlinlang.org/docs/ranges.html
      - title: Kotlin-API · indices
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.collections/indices.html
  - id: dauer-erklaeren
    type: explain
    title: Wie formatiert diese Funktion Dauern?
    prompt: |
      Erkläre in eigenen Worten, wie `formatiereDauer` arbeitet und was `formatiereDauer(90)`, `formatiereDauer(3000)` und `formatiereDauer(3000, kurz = true)` liefern. Gehe auf die Reihenfolge der `when`-Zweige und auf `${tage}d` ein.
    lang: kotlin
    code: |
      const val MINUTEN_PRO_TAG = 24 * 60

      fun formatiereDauer(minuten: Int, kurz: Boolean = false): String {
          val tage = minuten / MINUTEN_PRO_TAG
          val stunden = minuten % MINUTEN_PRO_TAG / 60
          val rest = minuten % 60
          return when {
              kurz && tage > 0 -> "${tage}d"
              tage > 0 -> "$tage T $stunden h"
              stunden > 0 -> "$stunden h $rest min"
              else -> "$rest min"
          }
      }
    points:
      - Ganzzahldivision und `%` zerlegen die Minuten in Tage, Stunden und Restminuten.
      - "`when` ohne Subjekt prüft die Bedingungen von oben; deshalb steht `kurz && tage > 0` vor `tage > 0`."
      - "`kurz` hat einen Default-Wert und wird am besten benannt übergeben (`kurz = true`)."
      - "`${tage}d` braucht die Klammern, sonst würde `$taged` als Bezeichner gelesen."
      - "Ergebnisse: `1 h 30 min`, `2 T 2 h` und `2d`."
    explanation: |
      Die Funktion zerlegt die Minuten mit Ganzzahldivision und Rest: `3000 / 1440` ergibt 2 Tage, `3000 % 1440` sind 120 übrige Minuten, davon `/ 60` also 2 Stunden. `%` und `/` haben dieselbe Priorität und werden von links ausgewertet. Das `when` ohne Subjekt ist ein Ausdruck, dessen Wert direkt zurückgegeben wird. Die Zweige laufen von oben nach unten, der erste wahre gewinnt – die Kurzform muss deshalb vor der Langform stehen, sonst würde sie nie erreicht. `kurz` ist optional; benannt aufgerufen (`kurz = true`) ist klar, was das `true` bedeutet. In `"${tage}d"` trennen die Klammern den Namen vom folgenden Buchstaben. `MINUTEN_PRO_TAG` ist eine `const val`, die der Compiler direkt einsetzt. So kommen `1 h 30 min`, `2 T 2 h` und `2d` heraus.
    resources:
      - title: Kotlin-Doku · When expressions and statements
        url: https://kotlinlang.org/docs/control-flow.html#when-expressions-and-statements
  - id: passwort-regeln
    type: practice
    title: Passwortregeln prüfen
    prompt: |
      Schreibe `pruefePasswort(passwort: String, minLaenge: Int = 12): String`. Die Funktion gibt `"OK"` zurück oder eine Meldung für die **erste** verletzte Regel, in dieser Reihenfolge:

      1. Mindestens `minLaenge` Zeichen – Meldung mit Soll- und Ist-Länge, z. B. `Mindestens 12 Zeichen (aktuell 4)`.
      2. Keine Leerzeichen (`isWhitespace()`).
      3. Mindestens eine Ziffer (`isDigit()`).
      4. Mindestens ein Großbuchstabe (`isUpperCase()`).

      Laufe mit einer `for`-Schleife einmal über die Zeichen des Passworts und entscheide danach mit einem `when`-Ausdruck. Teste mit den Aufrufen in `main`. Führe das Programm im Kotlin Playground oder in einer Scratch-Datei aus.
    lang: kotlin
    starter: |
      fun pruefePasswort(passwort: String, minLaenge: Int = 12): String {
          // 1. Mit einer for-Schleife Ziffern, Großbuchstaben und Leerzeichen erfassen
          // 2. Mit when die erste verletzte Regel zurückgeben
          TODO()
      }

      fun main() {
          println(pruefePasswort("kurz"))                 // Mindestens 12 Zeichen (aktuell 4)
          println(pruefePasswort("Langes Passwort1"))     // Keine Leerzeichen erlaubt
          println(pruefePasswort("LangesPasswort"))       // Mindestens eine Ziffer
          println(pruefePasswort("langespasswort1"))      // Mindestens ein Großbuchstabe
          println(pruefePasswort("LangesPasswort1"))      // OK
          println(pruefePasswort("Kurz1", minLaenge = 4)) // OK
      }
    solution: |
      fun pruefePasswort(passwort: String, minLaenge: Int = 12): String {
          var ziffern = 0
          var grossbuchstaben = 0
          var leerzeichen = false
          for (zeichen in passwort) {
              if (zeichen.isDigit()) ziffern++
              if (zeichen.isUpperCase()) grossbuchstaben++
              if (zeichen.isWhitespace()) leerzeichen = true
          }
          return when {
              passwort.length < minLaenge -> "Mindestens $minLaenge Zeichen (aktuell ${passwort.length})"
              leerzeichen -> "Keine Leerzeichen erlaubt"
              ziffern == 0 -> "Mindestens eine Ziffer"
              grossbuchstaben == 0 -> "Mindestens ein Großbuchstabe"
              else -> "OK"
          }
      }

      fun main() {
          println(pruefePasswort("kurz"))
          println(pruefePasswort("Langes Passwort1"))
          println(pruefePasswort("LangesPasswort"))
          println(pruefePasswort("langespasswort1"))
          println(pruefePasswort("LangesPasswort1"))
          println(pruefePasswort("Kurz1", minLaenge = 4))
      }
    checklist:
      - Die Funktion hat den Default-Wert `minLaenge = 12`, und der letzte Aufruf übergibt `minLaenge` benannt.
      - Du läufst genau einmal mit `for (zeichen in passwort)` über das Passwort.
      - Die Regeln stehen als Zweige eines `when`-Ausdrucks ohne Subjekt in der geforderten Reihenfolge, `else` liefert `"OK"`.
      - Die Längenmeldung nutzt ein String-Template mit `${passwort.length}`.
      - Alle sechs Aufrufe in `main` liefern die Meldungen aus den Kommentaren.
      - "`var` kommt nur für die Zähler vor, die sich in der Schleife ändern; alles andere ist `val` oder ein Ausdruck."
    explanation: |
      Die Schleife sammelt alle Informationen in einem Durchlauf, das `when` ohne Subjekt entscheidet danach. Weil der erste wahre Zweig gewinnt, bestimmt die Reihenfolge der Zweige, welche Regel gemeldet wird. `for (zeichen in passwort)` läuft über die `Char`s des Strings; `isDigit()`, `isUpperCase()` und `isWhitespace()` sind Funktionen der Standardbibliothek auf `Char`. Mit den Collection-Funktionen aus einem späteren Modul wird daraus `passwort.any { it.isDigit() }` – die Logik bleibt dieselbe.
    resources:
      - title: Kotlin-API · isDigit
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.text/is-digit.html
      - title: Kotlin-Doku · Characters
        url: https://kotlinlang.org/docs/characters.html
