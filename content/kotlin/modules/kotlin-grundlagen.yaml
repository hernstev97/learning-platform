        url: https://kotlinlang.org/docs/control-flow.html#when-expressions-and-statements
  - id: ganzzahl-division
    type: output
    title: Wie viel Prozent sind erledigt?
    prompt: Was gibt dieses Programm aus? Rechne jede Zeile im Kopf durch, bevor du tippst.
    lang: kotlin
    code: |
      fun main() {
          val erledigt = 3
          val gesamt = 4
          println(erledigt / gesamt * 100)
          println(erledigt * 100 / gesamt)
          println(erledigt / gesamt.toDouble() * 100)
          println(7 % 3)
      }
    expected: |
      0
      75
      75.0
      1
    explanation: |
      `erledigt / gesamt` ist eine Division zweier `Int`-Werte: `3 / 4` ergibt `0`, und `0 * 100` bleibt `0`. Multiplizierst du zuerst, rechnet Kotlin `300 / 4 = 75`. Sobald ein Operand ein `Double` ist, wird die ganze Division zur Gleitkommadivision – das Ergebnis `75.0` ist ein `Double` und wird mit Nachkommastelle ausgegeben. `%` liefert den Rest der Ganzzahldivision.
