  - id: ranges-schleifen
    type: output
    title: Zählen mit Ranges
    prompt: Was gibt dieses Programm aus? Achte auf inklusive und exklusive Enden.
    lang: kotlin
    code: |
      fun main() {
          for (i in 1..3) print(i)
          println()
          for (i in 0..<3) print(i)
          println()
          for (i in 10 downTo 0 step 4) print("$i ")
          println()
          val tage = listOf("Mo", "Di", "Mi")
          for ((index, tag) in tage.withIndex()) {
              if (index == 1) continue
              print("$index:$tag ")
          }
      }
    expected: |
      123
      012
      10 6 2
      0:Mo 2:Mi
    explanation: |
      `1..3` schließt die 3 ein, `0..<3` lässt sie weg. `10 downTo 0 step 4` beginnt bei 10 und zieht jeweils 4 ab: 10, 6, 2 – die nächste Zahl wäre −2 und liegt außerhalb. `withIndex()` liefert Paare aus Index und Wert, die das `for` direkt in `index` und `tag` zerlegt. `continue` überspringt den Rest des Schleifenkörpers für Index 1.
    hints:
      - "`step` ändert nur die Schrittweite, nicht Start oder Ende."
