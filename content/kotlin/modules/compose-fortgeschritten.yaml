id: compose-fortgeschritten
title: "Compose fortgeschritten: Animation, Layout, Zeichnen, Gesten"
level: 3
minutes: 180
place: unterwegs
summary: Was hinter den fertigen Bausteinen steckt – Animationen aus Zustand, eigene Layouts, Zeichnen, Gesten, CompositionLocal, adaptive Layouts und Views in Compose.
goals:
  - Du ordnest Composition, Layout und Zeichnen als drei Phasen ein und sagst, welche Phase ein State-Read auslöst.
  - Du wählst zwischen `animate*AsState`, `AnimatedVisibility` und `AnimatedContent` und vermeidest den Fehler mit dem äußeren Zustand in `AnimatedContent`.
  - Du schreibst ein eigenes Layout mit `Layout`, das jedes Kind einmal misst und dann platziert, und zeichnest mit `Canvas`, `drawBehind` und `drawWithCache`.
  - Du schreibst Gesten mit `pointerInput` und wählst den Key so, dass der Handler keine veralteten Werte benutzt.
  - Du entscheidest begründet, wann eine eigene `CompositionLocal` passt, und schaltest Layouts nach WindowSizeClass um.
  - Du bettest eine View mit `AndroidView` ein und erklärst `factory`, `update` und `onRelease`.
