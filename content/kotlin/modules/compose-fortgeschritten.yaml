lesson: |
  Bear läuft inzwischen auch auf einem Tablet. Dort steht die Gedankenliste links und das Detail rechts. Ein kleiner Ring zeigt, wie viele Gedanken heute schon wiederholt sind. Neue Einträge gleiten in die Liste, statt hineinzuspringen. Ein Doppeltipp heftet einen Gedanken an. Nichts davon liefern `Column`, `Row` und `Button` fertig. Du brauchst die Werkzeuge eine Ebene tiefer.

  Dieses Modul baut auf „Compose-Grundlagen“ und „Compose State & Side Effects“ auf. Es zeigt keine API-Liste, sondern die Denkmodelle, mit denen du Animation, Layout, Zeichnen und Gesten selbst baust. Die Beispiele sind für das Handy schmal gesetzt: zwei Leerzeichen Einrückung, kurze Zeilen. Android Studio formatiert sie mit Strg+Alt+L auf die üblichen vier Leerzeichen.

  ## Drei Phasen: Composition, Layout, Zeichnen

  Compose baut jeden Frame in [drei Phasen](https://developer.android.com/develop/ui/compose/phases): In der **Composition** laufen deine Composables und legen fest, *was* angezeigt wird. Im **Layout** misst jedes Element seine Kinder und platziert sie, es entscheidet also *wo* und *wie groß*. Beim **Zeichnen** malt jedes Element seine Pixel.

  Wichtig ist, in welcher Phase du einen `State` liest. Compose merkt sich jeden Lesezugriff und wiederholt nur die Phase, in der er stattfand, und alles danach. Liest du einen Wert im Körper einer Composable, läuft bei jeder Änderung die Composition erneut. Liest du ihn erst im Lambda von `Modifier.offset { … }`, wiederholt Compose nur Layout und Zeichnen. Liest du ihn in `drawBehind { … }`, wird nur neu gezeichnet.

  ```kotlin
  // Composition: Text läuft neu
  Text("$progress")

  // Nur Zeichnen läuft neu
  Canvas(Modifier.size(48.dp)) {
    drawArc(
      color = color,
      startAngle = -90f,
      sweepAngle = 360f * progress,
      useCenter = false,
    )
  }
  ```

  Für Animationen, Gesten und Zeichnen ist das der Unterschied zwischen 60 ruhigen Frames und einer ruckelnden Liste. Wie du solche Probleme misst, zeigt das Modul „Performance & Debugging“. Hier reicht die Regel: Werte, die sich bei jedem Frame ändern, liest du so spät wie möglich.

  ## Animationen folgen dem Zustand

  Eine Animation in Compose ist kein Befehl „blende jetzt aus“. Du änderst einen Zielwert, und Compose rechnet die Zwischenwerte aus. Das passt zum Denkmodell UI = f(Zustand). Unterbricht ein neuer Zielwert eine laufende Animation, setzt sie an der aktuellen Stelle fort, statt zu springen.

  Der einfachste Baustein ist [`animate*AsState`](https://developer.android.com/develop/ui/compose/animation/value-based): `animateFloatAsState`, `animateDpAsState`, `animateColorAsState` und weitere. Du gibst den Zielwert, du bekommst einen `State`, der sich dorthin bewegt.

  ```kotlin
  @Composable
  fun SyncBadge(pending: Int) {
    val target =
      if (pending > 0) 1f else 0.3f
    val alpha by
      animateFloatAsState(
        target,
        label = "syncAlpha",
      )
    Text(
      "$pending offen",
      Modifier.graphicsLayer {
        this.alpha = alpha
      },
    )
  }
  ```

  Das `label` unterscheidet die Animation von anderen in den Animationswerkzeugen von Android Studio. `graphicsLayer { … }` liest `alpha` im Lambda der Ebene. Ändert sich der Wert, aktualisiert Compose nur die Ebene, ohne Composition und ohne Layout. `Modifier.alpha(alpha)` sähe kürzer aus, läse den Wert aber in der Composition.

  Soll ein Element erscheinen und verschwinden, nimmst du [`AnimatedVisibility`](https://developer.android.com/develop/ui/compose/animation/composables-modifiers#animatedvisibility). Anders als ein Alpha von 0 gibt es den Platz frei, wenn es weg ist, und die Nachbarn rücken nach.

  ```kotlin
  @Composable
  fun SavedHint(visible: Boolean) {
    AnimatedVisibility(
      visible = visible,
      enter = fadeIn(),
      exit = fadeOut(),
    ) {
      Text("Gespeichert")
    }
  }
  ```

  Wechselt ein Inhalt gegen einen anderen, etwa eine Zahl gegen die nächste, ist [`AnimatedContent`](https://developer.android.com/develop/ui/compose/animation/composables-modifiers#animatedcontent) richtig. Während des Übergangs sind alter und neuer Inhalt gleichzeitig in der Composition. Deshalb bekommt das Inhalts-Lambda den Zustand als Parameter, und genau diesen musst du anzeigen.

  ```kotlin
  @Composable
  fun OpenCount(count: Int) {
    AnimatedContent(
      targetState = count,
      transitionSpec = {
        fadeIn() togetherWith
          fadeOut()
      },
      label = "openCount",
    ) { shown ->
      Text("$shown offen")
    }
  }
  ```

  `togetherWith` verbindet die Animation für den neuen Inhalt mit der für den alten. Mit `slideInVertically { -it }` und `slideOutVertically { it }` statt der Blenden käme die neue Zahl von oben und schöbe die alte nach unten. Schreibst du im Lambda `count` statt `shown`, zeigen beide Hälften des Übergangs den neuen Wert. Der alte Inhalt gleitet dann mit der falschen Zahl hinaus.

  In einer `LazyColumn` animiert `Modifier.animateItem()` Einfügen, Entfernen und Umsortieren eines Eintrags. Das funktioniert nur mit stabilen Keys, wie du sie aus den Grundlagen kennst ([Item animations](https://developer.android.com/develop/ui/compose/lists#item-animations)).

  > [!TIP] Welche Animation?
  > Ein Wert ändert sich → `animate*AsState`. Etwas erscheint oder verschwindet → `AnimatedVisibility`. Ein Inhalt ersetzt einen anderen → `AnimatedContent`. Mehrere Werte hängen am selben Zustand → `updateTransition`.

  ## Eigene Layouts: messen, dann platzieren

  Jedes Layout in Compose folgt demselben Ablauf: Der Elternknoten gibt Constraints nach unten, also minimale und maximale Breite und Höhe. Jedes Kind misst sich innerhalb dieser Grenzen und meldet seine Größe nach oben. Dann platziert der Elternknoten die Kinder. Jedes Kind wird dabei **genau einmal** gemessen. Diese Regel macht Compose schnell, auch bei tief verschachtelten Bäumen; ein zweites `measure` auf demselben Kind wirft eine Exception ([Custom layouts](https://developer.android.com/develop/ui/compose/layouts/custom)).

  Bear zeigt bei geteilten Gedanken die Avatare der Beteiligten überlappend nebeneinander. Mit `Layout` schreibst du das selbst:

  ```kotlin
  @Composable
  fun OverlapRow(
    overlap: Dp,
    modifier: Modifier = Modifier,
    content: @Composable () -> Unit,
  ) {
    Layout(content, modifier) {
        measurables, constraints ->
      val loose = constraints.copy(
        minWidth = 0,
        minHeight = 0,
      )
      val placeables =
        measurables.map {
          it.measure(loose)
        }
      val step = overlap.roundToPx()
      val width = placeables.sumOf {
        it.width - step
      } + step
      val height = placeables
        .maxOfOrNull { it.height }
        ?: 0
      layout(
        width.coerceIn(
          constraints.minWidth,
          constraints.maxWidth,
        ),
        height,
      ) {
        var x = 0
        placeables.forEach {
          it.placeRelative(x, 0)
          x += it.width - step
        }
      }
    }
  }
  ```

  Drei Stellen verdienen einen zweiten Blick. `loose` nimmt die Mindestgröße weg: Ein Elternteil mit `fillMaxWidth()` gibt `minWidth` gleich `maxWidth` weiter, und ohne Lockerung würde jeder Avatar die ganze Breite einnehmen. `roundToPx()` rechnet `dp` in Pixel um, denn im Layout zählt alles in Pixeln. `placeRelative` spiegelt die Position in Sprachen mit Schreibrichtung von rechts nach links, `place` täte das nicht.

  Für ein einzelnes Element reicht `Modifier.layout { measurable, constraints -> … }`. Damit verschiebst du etwa ein Element und meldest eine angepasste Größe, ohne eine eigene Composable zu bauen. Für Layouts, die erst nach dem Messen wissen, welche Kinder sie brauchen, gibt es `SubcomposeLayout`; `BoxWithConstraints` und `LazyColumn` bauen darauf auf. Es kostet mehr und ist selten nötig.

  ## Zeichnen mit Canvas, drawBehind und drawWithCache

  Zeichnen passiert in einem [`DrawScope`](https://developer.android.com/develop/ui/compose/graphics/draw/overview). Er kennt die Größe des Elements in Pixeln (`size`, `center`) und hat Funktionen wie `drawCircle`, `drawArc`, `drawLine` und `drawRect`. `Canvas` ist ein Element, das nur zeichnet; technisch ist es ein `Spacer` mit `drawBehind`.

  ```kotlin
  @Composable
  fun ReviewRing(
    progress: Float,
    modifier: Modifier = Modifier,
  ) {
    val color = MaterialTheme
      .colorScheme.primary
    Canvas(modifier.size(48.dp)) {
      val stroke = 6.dp.toPx()
      val sweep = 360f * progress
      inset(stroke / 2) {
        drawArc(
          color = color,
          startAngle = -90f,
          sweepAngle = sweep,
          useCenter = false,
          style = Stroke(stroke),
        )
      }
    }
  }
  ```

  `MaterialTheme.colorScheme` ist eine Composable-Abfrage. Im `DrawScope` darfst du sie nicht aufrufen, er ist keine Composable. Lies Farben und andere Theme-Werte deshalb davor. `inset(stroke / 2)` zieht die Fläche um die halbe Strichbreite ein. Ein Strich liegt mittig auf seiner Linie, ohne `inset` ragt seine äußere Hälfte über das Element hinaus. Winkel zählen im Uhrzeigersinn ab drei Uhr, `-90f` beginnt also oben.

  Willst du hinter einen vorhandenen Inhalt zeichnen, brauchst du kein `Canvas`. `Modifier.drawBehind { … }` malt hinter den Inhalt, `drawWithContent { … }` bestimmt selbst, wann `drawContent()` kommt, und kann also auch darüber malen.

  ```kotlin
  @Composable
  fun Marked(text: String) {
    val mark = MaterialTheme
      .colorScheme.tertiary
    Text(
      text,
      Modifier.drawBehind {
        val r = 4.dp.toPx()
        drawRoundRect(
          color = mark,
          cornerRadius =
            CornerRadius(r),
        )
      },
    )
  }
  ```

  Objekte wie ein `Brush` mit Verlauf oder ein `Path` solltest du nicht bei jedem Zeichnen neu erzeugen. [`drawWithCache`](https://developer.android.com/develop/ui/compose/graphics/draw/modifiers#drawwithcache) hält sie, bis sich die Größe ändert oder ein darin gelesener State.

  ```kotlin
  fun Modifier.fadeEdge(
    color: Color,
  ) = drawWithCache {
    val brush =
      Brush.verticalGradient(
        0f to Color.Transparent,
        1f to color,
        startY = size.height * 0.7f,
      )
    onDrawWithContent {
      drawContent()
      drawRect(brush)
    }
  }
  ```

  ## Gesten mit pointerInput

  Für die meisten Fälle gibt es fertige Modifier: `clickable`, `combinedClickable` für langes Drücken, `draggable`, `anchoredDraggable` und in Material 3 `SwipeToDismissBox`. Sie bringen Semantik für TalkBack, Ripple und Tastaturbedienung mit. Greif erst zu [`pointerInput`](https://developer.android.com/develop/ui/compose/touch-input/pointer-input/understand-gestures), wenn du eine Geste brauchst, die es so nicht gibt, etwa einen Doppeltipp auf einer Karte, die auch scrollt.

  ```kotlin
  @Composable
  fun ThoughtCard(
    thought: Thought,
    onPin: (String) -> Unit,
  ) {
    val pin = Modifier.pointerInput(
      thought.id,
    ) {
      detectTapGestures(
        onDoubleTap = {
          onPin(thought.id)
        },
      )
    }
    Text(thought.text, pin)
  }
  ```

  Der Block von `pointerInput` ist eine Coroutine, die auf Eingaben wartet. Sie startet einmal und läuft weiter, auch wenn die Composable neu komponiert wird. Nur wenn sich ein Key ändert, bricht Compose sie ab und startet sie neu. Mit `pointerInput(Unit)` würde der Block die erste `thought.id` für immer behalten. In einer `LazyColumn`, die Karten wiederverwendet, heftet dann ein Doppeltipp den falschen Gedanken an. Nimm als Key, was der Block liest, oder lies sich ändernde Callbacks über `rememberUpdatedState`.

  Beim Ziehen meldet `detectDragGestures` die Verschiebung seit dem letzten Ereignis. `change.consume()` sagt den Eltern, dass dieses Ereignis verbraucht ist; eine scrollende Liste darüber reagiert dann nicht zusätzlich.

  ```kotlin
  @Composable
  fun DragChip(label: String) {
    var x by remember {
      mutableFloatStateOf(0f)
    }
    val drag =
      Modifier.pointerInput(Unit) {
        detectDragGestures {
            change, delta ->
          change.consume()
          x += delta.x
        }
      }
    Text(
      label,
      Modifier
        .offset {
          val px = x.roundToInt()
          IntOffset(px, 0)
        }
        .then(drag),
    )
  }
  ```

  Hier ist `Unit` als Key richtig: Der Block liest nur `x`, und das ist ein State, kein eingefangener Wert. `offset { … }` liest `x` erst im Layout, das Ziehen löst also keine Composition aus. Eine eigene Geste hat keine Semantik. Gib ihr über `Modifier.semantics` eine Aktion, sonst erreicht TalkBack sie nicht.

  ## CompositionLocal: Werte, die durch den Baum fließen

  `MaterialTheme.colorScheme` funktioniert, ohne dass du Farben durch jede Funktion reichst. Dahinter stecken [CompositionLocals](https://developer.android.com/develop/ui/compose/compositionlocal): Werte, die ein Vorfahr für seinen Teilbaum bereitstellt und die jeder Nachfahre über `.current` liest.

  ```kotlin
  @Immutable
  data class Spacing(
    val small: Dp = 4.dp,
    val medium: Dp = 8.dp,
    val large: Dp = 16.dp,
  )

  val LocalSpacing =
    staticCompositionLocalOf {
      Spacing()
    }

  @Composable
  fun Section(title: String) {
    val gap =
      LocalSpacing.current.medium
    Text(
      title,
      Modifier.padding(gap),
    )
  }
  ```

  Bereitgestellt wird mit `CompositionLocalProvider(LocalSpacing provides Spacing(…)) { … }`. Gelesen wird immer der Wert des **nächsten** Providers darüber, ohne Provider der Standardwert aus der Fabrik.

  Es gibt zwei Fabriken. `compositionLocalOf` merkt sich, wer den Wert liest; ändert er sich, läuft nur bei diesen Lesern die Composition neu. `staticCompositionLocalOf` merkt sich das nicht und komponiert bei einer Änderung den ganzen Teilbaum neu. Das ist billiger, solange sich der Wert praktisch nie ändert, wie bei Abständen.

  Die Doku nennt klare Grenzen ([When to use](https://developer.android.com/develop/ui/compose/compositionlocal#deciding)). Eine CompositionLocal braucht einen sinnvollen Standardwert, und sie gilt für einen ganzen Teilbaum, nicht für ein paar einzelne Composables. Ein ViewModel oder Daten, die eine Komponente zum Arbeiten braucht, gehören in Parameter. Sonst sieht man der Signatur nicht mehr an, wovon eine Composable abhängt, und jede Preview braucht einen Provider.

  ## Adaptive Layouts mit WindowSizeClass

  „Tablet“ ist keine Eigenschaft, nach der du fragen solltest. Was zählt, ist das Fenster deiner App: Auf einem Faltgerät ändert es sich beim Aufklappen, im Split-Screen ist es halb so breit wie das Gerät, auf dem Desktop kann der Nutzer es frei ziehen. Seit Android 16 ignoriert das System auf großen Bildschirmen Sperren für Ausrichtung und Größenänderung, sobald eine App `targetSdk` 36 setzt ([Behavior changes](https://developer.android.com/about/versions/16/behavior-changes-16#ignore-orientation)). Jede App muss also mit breiten Fenstern umgehen.

  [Window Size Classes](https://developer.android.com/develop/ui/compose/layouts/adaptive/use-window-size-classes) teilen die Breite in Bereiche ein: kompakt unter 600 dp, mittel ab 600 dp, erweitert ab 840 dp. Du fragst, ob die Breite mindestens eine Grenze erreicht:

  ```kotlin
  @Composable
  fun ThoughtsAdaptive(
    thoughts: List<Thought>,
  ) {
    var open by rememberSaveable {
      mutableStateOf<String?>(null)
    }
    val info =
      currentWindowAdaptiveInfo()
    val wide = info.windowSizeClass
      .isWidthAtLeastBreakpoint(
        WIDTH_DP_MEDIUM_LOWER_BOUND,
      )
    if (wide) {
      Row {
        ThoughtPane(thoughts) {
          open = it
        }
        DetailPane(open)
      }
    } else if (open == null) {
      ThoughtPane(thoughts) {
        open = it
      }
    } else {
      DetailPane(open)
    }
  }
  ```

  Die Auswahl steht **über** der Verzweigung. Klappt jemand das Gerät zu, während ein Detail offen ist, wechselt die App in den schmalen Zweig und zeigt dasselbe Detail weiter. Läge `open` in `ThoughtPane`, wäre es nach dem Wechsel weg. Eine Größenänderung ist ein Configuration Change; `rememberSaveable` hält die Auswahl auch dann, wenn die Activity dabei neu entsteht.

  Für echte Apps bringt Material 3 Adaptive fertige Gerüste: `NavigationSuiteScaffold` wechselt zwischen Bottom-Bar und Navigation Rail, `ListDetailPaneScaffold` ordnet Liste und Detail an und kümmert sich um Zurück. Die Abfrage oben ist das Denkmodell darunter.

  ## Views in Compose: AndroidView

  Manche Bausteine gibt es nur als View, etwa `WebView` oder die View einer Bibliothek. [`AndroidView`](https://developer.android.com/develop/ui/compose/migrate/interoperability-apis/views-in-compose) bettet sie ein.

  ```kotlin
  @Composable
  fun HelpPage(
    url: String,
    modifier: Modifier = Modifier,
  ) {
    AndroidView(
      factory = { WebView(it) },
      update = { view ->
        if (view.url != url) {
          view.loadUrl(url)
        }
      },
      onRelease = { it.destroy() },
      modifier = modifier,
    )
  }
  ```

  `factory` läuft einmal und erzeugt die View. `update` läuft danach und bei jeder Recomposition, die neue Werte bringt; hier übertragen sich Compose-Zustand und View-Zustand. Alles, was sich ändern kann, gehört deshalb nach `update`. Ein `loadUrl` in `factory` lädt nur die erste Adresse. `onRelease` räumt auf, wenn die View die Composition endgültig verlässt. In einer `LazyColumn` gibt es zusätzlich `onReset`: Ist es gesetzt, verwendet Compose die View für andere Einträge wieder, statt sie wegzuwerfen.

  Den umgekehrten Weg, Compose in einer bestehenden View-Hierarchie, geht `ComposeView`. So migrieren große Apps Bildschirm für Bildschirm.

  > [!PRAXIS]
  > In Code-Reviews fallen bei eigenen Gesten, Zeichnungen und Layouts immer dieselben Punkte auf: Ein State wird zu früh gelesen und die Liste ruckelt. `pointerInput(Unit)` benutzt veraltete Parameter. Die eigene Geste hat keine Semantik, und TalkBack kommt nicht heran. Ein `Path` wird bei jedem Frame neu gebaut. Prüfe diese vier, bevor du über Optimierungen nachdenkst.

  > [!INTERVIEW]
  > „Wie würdest du ein eigenes Layout in Compose bauen?“ – Mit `Layout`: Constraints gehen nach unten, jedes Kind misst sich genau einmal, dann platziere ich die `Placeable`s in `layout(width, height)`. Ich achte darauf, die Constraints für die Kinder zu lockern, wo sie nicht die volle Breite bekommen sollen, und nutze `placeRelative` für RTL. Für ein einzelnes Element reicht `Modifier.layout`.

  ## Häufige Fehler

  - **Äußerer Zustand in `AnimatedContent`:** Beide Hälften des Übergangs zeigen den neuen Wert. Nimm den Parameter des Inhalts-Lambdas.
  - **`pointerInput(Unit)` mit eingefangenen Parametern:** Der Handler benutzt den ersten Wert für immer. Nimm den Parameter als Key.
  - **Theme im `DrawScope` lesen:** Der Compiler meldet „@Composable invocations can only happen from the context of a @Composable function“. Lies den Wert vor dem Zeichnen.
  - **Kind zweimal messen:** Laufzeitfehler. Miss jedes Kind einmal oder nutze Intrinsics.
  - **Constraints nicht lockern:** Kinder werden so breit wie der Elternknoten.
  - **Geräteprüfung statt Fenstergröße:** Split-Screen und Faltgeräte bekommen das falsche Layout.
  - **Veränderlichen Wert in `factory` setzen:** Spätere Änderungen kommen nie in der View an.

  ## Zusammenfassung

  - Compose arbeitet in Composition, Layout und Zeichnen. Ein State-Read löst die Phase aus, in der er steht.
  - Animationen folgen Zielwerten. `AnimatedContent` zeigt den Zustand aus seinem Lambda-Parameter.
  - Eigene Layouts messen jedes Kind einmal und platzieren es danach.
  - Im `DrawScope` zeichnest du in Pixeln. Composable-Werte liest du vorher, teure Objekte hält `drawWithCache`.
  - `pointerInput` startet nur bei neuem Key neu. Fertige Gesten-Modifier bringen Semantik mit.
  - Eine CompositionLocal braucht einen Standardwert und gilt für einen Teilbaum. Abhängigkeiten gehören in Parameter.
  - Layouts richten sich nach der Fensterbreite, nicht nach dem Gerät. Gemeinsamer Zustand steht über der Verzweigung.
  - `AndroidView` erzeugt in `factory`, gleicht in `update` ab und räumt in `onRelease` auf.
exercises:
  - id: animation-waehlen
    type: choice
    title: Ein Hinweis, der Platz macht
    prompt: |
      Unter dem Eingabefeld soll nach dem Speichern „Gespeichert“ erscheinen und nach zwei Sekunden verschwinden. Wenn der Hinweis weg ist, soll die Liste darunter wieder nach oben rücken. Welche API passt?
    options:
      - text: "`AnimatedVisibility` mit `visible = saved`"
        correct: true
        why: Sie animiert Erscheinen und Verschwinden und gibt den Platz frei, sobald das Element weg ist.
      - text: "`animateFloatAsState` für ein Alpha von 1 auf 0"
        correct: false
        why: Ein unsichtbares Element belegt weiter seinen Platz. Die Liste rückt nicht nach.
      - text: "`AnimatedContent` mit dem Text als Zustand"
        correct: false
        why: "`AnimatedContent` tauscht einen Inhalt gegen einen anderen. Für „da oder nicht da“ ist es das falsche Werkzeug."
      - text: "`Modifier.animateItem()` am Text"
        correct: false
        why: Der Modifier wirkt nur auf Einträge einer Lazy-Liste.
    explanation: |
      `AnimatedVisibility` nimmt das Element nach der Exit-Animation aus dem Layout. Ein Alpha von 0 macht es nur durchsichtig, es belegt aber weiter seinen Platz. Die Faustregel: Wert ändert sich → `animate*AsState`, etwas erscheint oder verschwindet → `AnimatedVisibility`, Inhalt wechselt → `AnimatedContent`.
    resources:
      - title: AnimatedVisibility
        url: https://developer.android.com/develop/ui/compose/animation/composables-modifiers#animatedvisibility

  - id: phase-erkennen
    type: choice
    title: Welche Phase läuft neu?
    prompt: |
      `offsetX` ist ein `State<Float>`, der sich beim Ziehen bei jedem Frame ändert. Welche Phasen wiederholt Compose bei jeder Änderung?
    lang: kotlin
    code: |
      Box(
        Modifier
          .offset {
            IntOffset(
              offsetX.value.roundToInt(),
              0,
            )
          }
          .size(48.dp),
      )
    options:
      - text: Layout und Zeichnen, aber keine Composition
        correct: true
        why: Der Wert wird erst im Lambda von `offset` gelesen, und das läuft in der Layout-Phase.
      - text: Composition, Layout und Zeichnen
        correct: false
        why: Das wäre so bei `Modifier.offset(x = …)` mit einem Wert, der in der Composition gelesen wird.
      - text: Nur Zeichnen
        correct: false
        why: Eine Verschiebung ändert die Platzierung, also das Layout. Nur Zeichnen gälte für einen Read in `drawBehind`.
    explanation: |
      Compose wiederholt die Phase, in der ein State gelesen wurde, und alle Phasen danach. Die Lambda-Variante von `offset` liest im Layout, also laufen Layout und Zeichnen neu. Die Composition bleibt unberührt, was bei Änderungen in jedem Frame den Unterschied macht.
    resources:
      - title: Compose phases · State reads
        url: https://developer.android.com/develop/ui/compose/phases#state-reads

  - id: layout-ablauf
    type: order
    title: Ein Layout, das stapelt
    prompt: |
      `Stack` legt alle Kinder untereinander und ist so hoch wie alle zusammen. `ms` sind die Measurables, `cs` die Constraints. Bring die Zeilen in die richtige Reihenfolge.
    lang: kotlin
    lines: |
      Layout(content) { ms, cs ->
        val ps = ms.map {
          it.measure(cs)
        }
        val h = ps.sumOf { it.height }
        layout(cs.maxWidth, h) {
          var y = 0
          ps.forEach {
            it.placeRelative(0, y)
            y += it.height
          }
        }
      }
    explanation: |
      Erst messen, dann die eigene Größe bestimmen, dann in `layout(…)` platzieren. Die Höhe kann erst feststehen, wenn alle Kinder gemessen sind, und platzieren geht nur innerhalb von `layout`. Die Variable `y` läuft mit, damit jedes Kind unter dem vorigen landet. In einem echten Layout begrenzt du `h` noch auf `cs.maxHeight`.
    resources:
      - title: Custom layouts · Using the layout modifier
        url: https://developer.android.com/develop/ui/compose/layouts/custom

  - id: ueberlapp-positionen
    type: output
    title: Wo landen die Avatare?
    prompt: |
      Die Funktion rechnet dieselben x-Positionen aus wie `OverlapRow` aus der Lektion. Was gibt `main` aus?
    lang: kotlin
    code: |
      fun positions(
        widths: List<Int>,
        step: Int,
      ): List<Int> {
        var x = 0
        return widths.map { w ->
          val at = x
          x += w - step
          at
        }
      }

      fun main() {
        println(positions(
          listOf(40, 40, 40), 12))
        println(positions(
          listOf(30, 50), 10))
      }
    expected: |
      [0, 28, 56]
      [0, 20]
    explanation: |
      Jedes Kind beginnt dort, wo das vorige endet, abzüglich der Überlappung. Bei drei Avataren mit 40 px und 12 px Überlappung liegen sie bei 0, 28 und 56. Die Gesamtbreite ist 56 + 40 = 96 px, also drei Breiten minus zwei Überlappungen; genau das rechnet `sumOf { it.width - step } + step` aus.
    resources:
      - title: Custom layouts
        url: https://developer.android.com/develop/ui/compose/layouts/custom

  - id: local-naechster
    type: output
    title: Wer liefert den Wert?
    prompt: |
      Welche Texte zeigt `Screen` von oben nach unten? Gib einen pro Zeile an.
    lang: kotlin
    code: |
      val LocalSource =
        compositionLocalOf { "Standard" }

      @Composable
      fun Label() {
        Text(LocalSource.current)
      }

      @Composable
      fun Inner() {
        CompositionLocalProvider(
          LocalSource provides "Detail",
        ) {
          Label()
        }
      }

      @Composable
      fun Screen() {
        Column {
          Label()
          CompositionLocalProvider(
            LocalSource provides "Liste",
          ) {
            Label()
            Inner()
            Label()
          }
        }
      }
    expected: |
      Standard
      Liste
      Detail
      Liste
    explanation: |
      `.current` liefert den Wert des nächsten Providers darüber, auch über Funktionsgrenzen hinweg. Das erste `Label` hat keinen Provider und bekommt den Standardwert. Der Provider in `Inner` gilt nur für seinen Block; das letzte `Label` steht wieder nur unter „Liste“.
    resources:
      - title: CompositionLocal
        url: https://developer.android.com/develop/ui/compose/compositionlocal

  - id: visibility-ergaenzen
    type: gap
    title: Ein Fehlerbanner blendet sich ein
    prompt: |
      Das Banner soll sichtbar sein, solange `error` nicht `null` ist, und dabei ein- und ausblenden.
    lang: kotlin
    code: |
      @Composable
      fun ErrorBanner(error: String?) {
        ⟦AnimatedVisibility⟧(
          visible = ⟦error != null⟧,
          enter = ⟦fadeIn()⟧,
          exit = fadeOut(),
        ) {
          Text(error.orEmpty())
        }
      }
    gaps:
      - label: Composable
        hint: Sie animiert Erscheinen und Verschwinden.
      - label: Bedingung
        hint: Sichtbar, solange es einen Fehler gibt.
        accept: ["null != error"]
      - label: Einblenden
        hint: Das Gegenstück zu `fadeOut()`.
    explanation: |
      `AnimatedVisibility` steuert über `visible`, ob der Inhalt da ist. `fadeIn()` und `fadeOut()` animieren das Alpha. Während der Exit-Animation ist `error` schon `null`; `orEmpty()` verhindert, dass `Text` dann einen nullbaren Wert bekommt.
    resources:
      - title: AnimatedVisibility
        url: https://developer.android.com/develop/ui/compose/animation/composables-modifiers#animatedvisibility

  - id: animated-content-spec
    type: gap
    title: Die Zahl blendet über
    prompt: |
      Beim Wechsel soll die neue Zahl einblenden, während die alte ausblendet. Ergänze die Verbindung der beiden Animationen und den Wert, den `Text` zeigt.
    lang: kotlin
    code: |
      @Composable
      fun Count(count: Int) {
        AnimatedContent(
          targetState = count,
          transitionSpec = {
            fadeIn() ⟦togetherWith⟧
              fadeOut()
          },
          label = "count",
        ) { value ->
          Text("$⟦value⟧")
        }
      }
    gaps:
      - label: Verbindung
        hint: Eine Infix-Funktion, die Enter- und Exit-Animation zu einem `ContentTransform` verbindet.
      - label: Angezeigter Wert
        hint: Der Parameter des Inhalts-Lambdas, nicht der Parameter der Funktion.
    explanation: |
      `togetherWith` baut aus `EnterTransition` und `ExitTransition` ein `ContentTransform`. Im Inhalts-Lambda steht der Zustand, zu dem dieser Inhalt gehört. Der alte Inhalt bekommt während des Übergangs den alten Wert, der neue den neuen. Mit `count` zeigten beide den neuen.
    resources:
      - title: AnimatedContent
        url: https://developer.android.com/develop/ui/compose/animation/composables-modifiers#animatedcontent

  - id: ring-zeichnen
    type: gap
    title: Ein Fortschrittsring
    prompt: |
      Der Ring beginnt oben und füllt sich mit `progress` von 0 bis 1 im Uhrzeigersinn. Ergänze Startwinkel, Winkel und Strichstil.
    lang: kotlin
    code: |
      Canvas(Modifier.size(48.dp)) {
        val stroke = 6.dp.toPx()
        inset(stroke / 2) {
          drawArc(
            color = color,
            startAngle = ⟦-90f⟧,
            sweepAngle = ⟦360f * progress⟧,
            useCenter = false,
            style = ⟦Stroke(stroke)⟧,
          )
        }
      }
    gaps:
      - label: Startwinkel
        hint: 0 Grad liegt bei drei Uhr. Oben ist eine Vierteldrehung dagegen.
        accept: ["270f"]
      - label: Winkel
        hint: Ein voller Kreis mal Anteil.
        accept: ["progress * 360f", "360 * progress", "progress * 360"]
      - label: Strichstil
        hint: Ohne Stil füllt `drawArc` die Fläche.
        accept: ["Stroke(width = stroke)"]
    explanation: |
      `drawArc` zählt Winkel ab drei Uhr im Uhrzeigersinn. `-90f` und `270f` beginnen beide oben. Ohne `style = Stroke(…)` zeichnet `drawArc` ein gefülltes Segment. `inset(stroke / 2)` sorgt dafür, dass der Strich nicht über den Rand ragt.
    resources:
      - title: DrawScope · drawArc
        url: https://developer.android.com/reference/kotlin/androidx/compose/ui/graphics/drawscope/DrawScope#drawArc(androidx.compose.ui.graphics.Color,kotlin.Float,kotlin.Float,kotlin.Boolean,androidx.compose.ui.geometry.Offset,androidx.compose.ui.geometry.Size,kotlin.Float,androidx.compose.ui.graphics.drawscope.DrawStyle,androidx.compose.ui.graphics.ColorFilter,androidx.compose.ui.graphics.BlendMode)

  - id: fenster-breite
    type: gap
    title: Ab wann zwei Spalten?
    prompt: |
      Ab der mittleren Fensterbreite (600 dp) sollen Liste und Detail nebeneinanderstehen. Ergänze die Abfrage.
    lang: kotlin
    code: |
      val info =
        ⟦currentWindowAdaptiveInfo()⟧
      val wide = info.windowSizeClass
        .⟦isWidthAtLeastBreakpoint⟧(
          ⟦WIDTH_DP_MEDIUM_LOWER_BOUND⟧,
        )
    gaps:
      - label: Fensterinfo
        hint: Eine Composable aus Material 3 Adaptive, die Größe und Haltung des Fensters liefert.
      - label: Abfrage
        hint: Sie prüft, ob die Breite mindestens eine Grenze erreicht.
      - label: Grenze
        hint: Die untere Grenze der mittleren Breite, als Konstante aus `WindowSizeClass`.
        accept: ["WindowSizeClass.WIDTH_DP_MEDIUM_LOWER_BOUND", "600"]
    explanation: |
      `currentWindowAdaptiveInfo()` liefert die WindowSizeClass des aktuellen Fensters, nicht des Geräts. `isWidthAtLeastBreakpoint` vergleicht mit einer Grenze in dp. Die Konstante macht die Absicht lesbar; 600 funktioniert auch, sagt aber nicht, welche Grenze gemeint ist.
    resources:
      - title: Use window size classes
        url: https://developer.android.com/develop/ui/compose/layouts/adaptive/use-window-size-classes

  - id: alter-status
    type: bug
    title: Der alte Status gleitet falsch hinaus
    prompt: |
      Wechselt der Status von „Synchronisiert“ auf „Offline“, gleitet unten ein Text hinaus und oben einer herein. Beide zeigen aber „Offline“. Finde die Zeile und korrigiere sie.
    lang: kotlin
    code: |
      @Composable
      fun StatusText(status: String) {
        AnimatedContent(
          targetState = status,
          label = "status",
        ) { shown ->
          Text(status)
        }
      }
    lines: [7]
    fix:
      - line: 7
        answers:
          - Text(shown)
          - Text(text = shown)
    explanation: |
      Während des Übergangs sind zwei Inhalte in der Composition: der alte mit `shown = "Synchronisiert"` und der neue mit `shown = "Offline"`. `status` ist der Parameter der Funktion und hat zu diesem Zeitpunkt schon den neuen Wert. Wer im Lambda `status` liest, zeigt deshalb zweimal den neuen Text.
    resources:
      - title: AnimatedContent
        url: https://developer.android.com/develop/ui/compose/animation/composables-modifiers#animatedcontent

  - id: doppeltipp-veraltet
    type: bug
    title: Der Doppeltipp heftet den falschen Gedanken an
    prompt: |
      In der Liste heftet ein Doppeltipp manchmal einen anderen Gedanken an als den angetippten, vor allem nach dem Scrollen. Finde die Zeile und korrigiere sie.
    lang: kotlin
    code: |
      @Composable
      fun ThoughtCard(
        thought: Thought,
        onPin: (String) -> Unit,
      ) {
        Text(
          thought.text,
          Modifier.pointerInput(Unit) {
            detectTapGestures(
              onDoubleTap = {
                onPin(thought.id)
              },
            )
          },
        )
      }
    lines: [8]
    fix:
      - line: 8
        answers:
          - Modifier.pointerInput(thought.id) {
          - Modifier.pointerInput(thought) {
    hints:
      - Die `LazyColumn` verwendet Karten für andere Einträge wieder.
      - Wann startet der Block von `pointerInput` neu?
    explanation: |
      Der Block von `pointerInput` ist eine langlebige Coroutine. Mit `Unit` als Key startet sie nie neu und behält das `thought` aus dem ersten Aufruf. Bekommt die wiederverwendete Karte einen anderen Gedanken, meldet der Doppeltipp weiter die alte ID. Mit `thought.id` als Key bricht Compose den Block bei einem neuen Gedanken ab und startet ihn mit dem aktuellen Wert.
    resources:
      - title: pointerInput
        url: https://developer.android.com/develop/ui/compose/touch-input/pointer-input/understand-gestures#add-custom

  - id: webview-update
    type: bug
    title: Die Hilfe zeigt immer dieselbe Seite
    prompt: |
      Wählt der Nutzer ein anderes Hilfethema, ändert sich `url`, aber die WebView zeigt weiter die erste Seite. Finde die Zeile und korrigiere sie, ohne bei jeder Recomposition neu zu laden.
    lang: kotlin
    code: |
      @Composable
      fun HelpPage(url: String) {
        AndroidView(
          factory = { WebView(it) },
          update = { view ->
            if (view.url == null) {
              view.loadUrl(url)
            }
          },
        )
      }
    lines: [6]
    fix:
      - line: 6
        answers:
          - if (view.url != url) {
          - if (url != view.url) {
    explanation: |
      `update` läuft nach `factory` und wieder, wenn neue Werte ankommen. Die Bedingung `view.url == null` stimmt nur vor dem ersten Laden; danach blockiert sie jede neue Adresse. Vergleiche mit der gewünschten Adresse: Dann lädt die View neu, wenn sich `url` ändert, und sonst nicht.
    resources:
      - title: Using views in Compose
        url: https://developer.android.com/develop/ui/compose/migrate/interoperability-apis/views-in-compose

  - id: cache-erklaeren
    type: explain
    title: Was hält drawWithCache fest?
    prompt: |
      Erkläre, wann der Verlauf neu entsteht, wann nur gezeichnet wird und warum das besser ist als ein `Brush` in `drawBehind`.
    lang: kotlin
    code: |
      fun Modifier.fadeEdge(
        color: Color,
      ) = drawWithCache {
        val brush =
          Brush.verticalGradient(
            0f to Color.Transparent,
            1f to color,
            startY = size.height * 0.7f,
          )
        onDrawWithContent {
          drawContent()
          drawRect(brush)
        }
      }
    points:
      - Der äußere Block erzeugt den `Brush` und läuft nur, wenn sich die Größe oder ein darin gelesener State ändert.
      - "`onDrawWithContent` läuft bei jedem Zeichnen und benutzt den gespeicherten `Brush`."
      - Erst kommt der Inhalt, dann der Verlauf darüber; er blendet das untere Drittel aus.
      - In `drawBehind` entstünde der `Brush` bei jedem Frame neu und erzeugte Arbeit für den Garbage Collector.
    explanation: |
      `drawWithCache` trennt Vorbereitung und Zeichnen. Der äußere Block baut den Verlauf, der von der Höhe abhängt, und Compose hält ihn, bis sich die Größe ändert. `onDrawWithContent` zeichnet erst den Inhalt und dann ein Rechteck mit dem Verlauf darüber, das unten in die Hintergrundfarbe übergeht. Läge das `Brush.verticalGradient` in `drawBehind`, entstünde bei jedem Frame ein neues Objekt; beim Scrollen sind das Hunderte pro Sekunde.
    resources:
      - title: drawWithCache
        url: https://developer.android.com/develop/ui/compose/graphics/draw/modifiers#drawwithcache

  - id: liste-detail-skizze
    type: practice
    title: Liste und Detail für jede Breite
    prompt: |
      Schreibe `NotesAdaptive(notes: List<Note>)`. Breiter als 600 dp: Liste und Detail nebeneinander. Schmaler: entweder Liste oder Detail. Die Auswahl übersteht das Aufklappen eines Faltgeräts. `NotePane(notes, onOpen)` und `NoteDetail(id)` gibt es schon. Halte dich an kurze Zeilen, das geht auch auf dem Handy.
    lang: kotlin
    solution: |
      @Composable
      fun NotesAdaptive(
        notes: List<Note>,
      ) {
        var open by rememberSaveable {
          mutableStateOf<String?>(null)
        }
        val size =
          currentWindowAdaptiveInfo()
            .windowSizeClass
        val wide = size
          .isWidthAtLeastBreakpoint(
            WIDTH_DP_MEDIUM_LOWER_BOUND,
          )
        val id = open
        when {
          wide -> Row {
            NotePane(notes) { open = it }
            NoteDetail(id)
          }
          id == null ->
            NotePane(notes) { open = it }
          else -> NoteDetail(id)
        }
      }
    checklist:
      - Die Auswahl steht über der Verzweigung, nicht in `NotePane`.
      - Die Auswahl nutzt `rememberSaveable`, damit sie einen Configuration Change übersteht.
      - Die Entscheidung hängt an der Fensterbreite, nicht an einer Geräteeigenschaft.
      - Der schmale Zweig zeigt das Detail, wenn eine Auswahl besteht, sonst die Liste.
    explanation: |
      Der Kern ist, wo die Auswahl lebt. Steht sie über der Verzweigung, bleibt sie beim Wechsel zwischen breitem und schmalem Zweig erhalten. Die lokale Variable `id` macht aus dem delegierten `var` einen Wert, den der Compiler im `else`-Zweig als nicht-`null` kennt. Eine echte App bräuchte im schmalen Detail noch einen Zurück-Weg; `ListDetailPaneScaffold` bringt den mit.
    resources:
      - title: Build a list-detail layout
        url: https://developer.android.com/develop/ui/compose/layouts/adaptive/list-detail
