lesson: |
  In Jetpack Compose übergibst du ständig Funktionen: `Button(onClick = { viewModel.speichern() })`. Collections filterst du mit `aufgaben.filter { !it.erledigt }`, und ein Sync-Aufruf soll bei einem Netzwerkfehler dreimal wiederholt werden – ohne dass du die Wiederholungslogik in jede Funktion kopierst. All das beruht auf einer Idee: Funktionen sind Werte. Du kannst sie in Variablen speichern, als Argument übergeben und aus Funktionen zurückgeben.

  Aus TypeScript kennst du das: Arrow Functions, Callbacks, `array.map(x => …)`. Kotlin fügt drei Dinge hinzu, die du verstehen musst, um fremden Code zu lesen: Lambdas mit Empfänger (die Grundlage von `apply` und von DSLs wie Compose), Extension Functions (Methoden, die eine Klasse von außen bekommt) und `inline` (der Compiler kopiert Funktion und Lambda an die Aufrufstelle). Dieses Modul erklärt die Mechanik dahinter, damit du nicht nur Muster nachahmst.

  ## Funktionstypen und Lambdas

  Ein **Funktionstyp** beschreibt Parameter und Rückgabetyp ([Function types](https://kotlinlang.org/docs/lambdas.html#function-types)):

  | Typ | Bedeutung |
  | --- | --- |
  | `() -> Unit` | keine Parameter, kein sinnvolles Ergebnis – typisch für `onClick` |
  | `(String) -> Int` | ein `String` rein, ein `Int` raus |
  | `(Aufgabe, Boolean) -> Unit` | zwei Parameter |
  | `(String) -> Int?` | Ergebnis darf `null` sein |
  | `((String) -> Int)?` | die **Funktion selbst** darf fehlen |
  | `StringBuilder.() -> Unit` | Funktion mit Empfänger: im Körper ist `this` ein `StringBuilder` |

  Ein **Lambda** ist ein Funktionswert in geschweiften Klammern. Parameter stehen vor `->`, der **letzte Ausdruck** ist das Ergebnis – ein `return` gibt es im Lambda normalerweise nicht ([Lambda expression syntax](https://kotlinlang.org/docs/lambdas.html#lambda-expression-syntax)):

  ```kotlin
  val multipliziere: (Int, Int) -> Int = { a, b -> a * b }
  val istLang = { titel: String -> titel.length > 40 }   // Typ wird abgeleitet
  val quadrat: (Int) -> Int = { it * it }                // ein Parameter: it
  println(multipliziere(3, 4))                           // 12

  val beiKlick: ((String) -> Unit)? = null
  beiKlick?.invoke("Speichern")                          // nullable Funktion aufrufen
  ```

  Hat ein Lambda genau einen Parameter, darfst du ihn weglassen und `it` benutzen ([it: implicit name](https://kotlinlang.org/docs/lambdas.html#it-implicit-name-of-a-single-parameter)). Bei verschachtelten Lambdas wird `it` schnell mehrdeutig – dann gib Namen. Unbenutzte Parameter heißen `_`.

  **Trailing Lambdas:** Ist der letzte Parameter eine Funktion, darf das Lambda hinter den Klammern stehen; ist es das einzige Argument, fallen die Klammern ganz weg ([Passing trailing lambdas](https://kotlinlang.org/docs/lambdas.html#passing-trailing-lambdas)):

  ```kotlin
  aufgaben.filter({ a -> !a.erledigt })   // möglich, aber unüblich
  aufgaben.filter { !it.erledigt }        // idiomatisch
  repeat(3) { versuch -> println(versuch) }
  ```

  Diese eine Regel erklärt, warum Compose-Code wie eine eigene Sprache aussieht: `Column { Text("Hallo") }` ist ein Funktionsaufruf mit einem Lambda als letztem Argument.

  ## Higher-Order Functions und Funktionsreferenzen

  Eine **Higher-Order Function** nimmt Funktionen als Parameter oder gibt eine zurück. So kapselst du wiederkehrende Abläufe – etwa Wiederholungsversuche für einen Netzwerkaufruf:

  ```kotlin
  fun <T> wiederhole(versuche: Int, block: (versuch: Int) -> T): T {
      var letzterFehler: Exception? = null
      for (versuch in 1..versuche) {
          try {
              return block(versuch)
          } catch (e: Exception) {
              letzterFehler = e
          }
      }
      throw IllegalStateException("Nach $versuche Versuchen gescheitert", letzterFehler)
  }

  val issues = wiederhole(3) { versuch ->
      println("Versuch $versuch")
      linearApi.ladeIssues()
  }
  ```

  Der Name `versuch` im Funktionstyp dient nur der Dokumentation. Die Wiederholungslogik steht an einer Stelle, das „Was“ kommt vom Aufrufer.

  Statt eines Lambdas, das nur eine vorhandene Funktion aufruft, übergibst du eine **Funktionsreferenz** mit `::` ([Callable references](https://kotlinlang.org/docs/reflection.html#callable-references)):

  ```kotlin
  fun istKurz(titel: String) = titel.length < 20

  titel.filter(::istKurz)                 // Top-Level-Funktion
  titel.map(String::length)               // Member-Funktion oder Property, Empfänger wird 1. Parameter
  zeilen.forEach(logger::info)            // gebundene Referenz: an das Objekt logger gebunden
  val erzeuge: (String) -> Aufgabe = ::Aufgabe   // Konstruktor
  ```

  In Android-Code findest du das oft als `onClick = viewModel::speichern`. Ist die Funktion überladen, braucht die Referenz einen erwarteten Typ, damit der Compiler weiß, welche Überladung gemeint ist.

  ## Closures

  Ein Lambda sieht die Variablen des Bereichs, in dem es entsteht, und nimmt sie mit – es ist eine **Closure**. Anders als in Java darf es auch `var`s verändern ([Closures](https://kotlinlang.org/docs/lambdas.html#closures)):

  ```kotlin
  fun zaehler(): () -> Int {
      var n = 0
      return { ++n }      // das Lambda hält n am Leben
  }

  val a = zaehler()
  val b = zaehler()
  println(a()); println(a()); println(b())   // 1, 2, 1
  ```

  Jeder Aufruf von `zaehler()` erzeugt ein eigenes `n`, und das zurückgegebene Lambda hält genau dieses `n` fest. Das Denkmodell: Die eingefangene Variable lebt so lange wie das Lambda, nicht so lange wie der Funktionsaufruf. Auf der JVM packt der Compiler eine eingefangene `var` dafür in ein kleines Hilfsobjekt.

  Das hat zwei Folgen, die im Android-Alltag zählen. Erstens: Ein Lambda, das lange lebt (ein Listener, ein Callback in einem Singleton), hält alles fest, was es einfängt – auch eine `Activity`. Das ist eine klassische Ursache für Speicherlecks. Zweitens: Wenn mehrere Threads über dasselbe Lambda eine eingefangene `var` verändern, gibt es keine Synchronisierung.

  ## Extension Functions und Properties

  Mit einer **Extension** gibst du einem Typ eine Funktion, ohne ihn zu ändern oder zu beerben ([Extension functions](https://kotlinlang.org/docs/extensions.html#extension-functions)):

  ```kotlin
  fun String?.oderStrich(): String = if (this.isNullOrBlank()) "–" else this

  val String.woerter: Int
      get() = trim().split(Regex("\\s+")).size

  val beschreibung: String? = null
  println(beschreibung.oderStrich())       // –
  println("Steuer bis Freitag".woerter)    // 3
  ```

  Im Körper ist `this` der **Empfänger**. Extensions auf nullable Typen dürfen auch auf `null` aufgerufen werden ([Nullable receivers](https://kotlinlang.org/docs/extensions.html#nullable-receivers)). Extension Properties haben kein Backing Field, sie brauchen immer einen Getter.

  Das Wichtigste zum Verstehen: Eine Extension verändert die Klasse **nicht**. Der Compiler macht daraus eine statische Funktion, die den Empfänger als ersten Parameter bekommt. Daraus folgen zwei Regeln ([Extension or member functions?](https://kotlinlang.org/docs/extensions.html#extension-or-member-functions)):

  1. **Extensions werden statisch aufgelöst.** Welche Extension aufgerufen wird, entscheidet der **deklarierte** Typ zur Compile-Zeit, nicht das tatsächliche Objekt zur Laufzeit. Es gibt kein Überschreiben wie bei `open`-Methoden.
  2. **Member gewinnt.** Hat die Klasse eine Methode mit derselben Signatur, wird immer die Methode aufgerufen; der Compiler warnt: `this extension is shadowed by a member`.

  ```kotlin
  open class Form
  class Kreis : Form()
  fun Form.name() = "Form"
  fun Kreis.name() = "Kreis"

  val f: Form = Kreis()
  println(f.name())       // Form – deklarierter Typ entscheidet
  ```

  Extensions sind ideal für Hilfsfunktionen auf fremden Typen (`String`, `Instant`, Android-`Context`) und um eine Klasse schlank zu halten. Sie ersetzen aber keine Polymorphie: Wenn das Verhalten vom Laufzeittyp abhängen soll, gehört es als Methode in die Klasse.

  ## Scope Functions: let, run, with, apply, also

  Die fünf Scope Functions führen einen Block im Kontext eines Objekts aus. Sie unterscheiden sich in genau zwei Punkten: Wie heißt das Objekt im Block (`this` oder `it`), und was gibt der Aufruf zurück ([Distinctions](https://kotlinlang.org/docs/scope-functions.html#distinctions))?

  | Funktion | Objekt im Block | Rückgabe | typischer Einsatz |
  | --- | --- | --- | --- |
  | `let` | `it` | Ergebnis des Blocks | `x?.let { … }`: nur bei nicht-`null` etwas tun; Wert umwandeln |
  | `run` | `this` | Ergebnis des Blocks | auf einem Objekt rechnen und ein Ergebnis liefern |
  | `with(x)` | `this` | Ergebnis des Blocks | mehrere Aufrufe auf einem Objekt, das kein Ergebnis zurückgibt |
  | `apply` | `this` | das Objekt selbst | ein Objekt konfigurieren („Builder“) |
  | `also` | `it` | das Objekt selbst | Nebeneffekt einschieben: Logging, Validierung |

  ```kotlin
  val anfrage = Anfrage().apply {           // Konfiguration, Ergebnis ist die Anfrage
      headers["Authorization"] = "Bearer $token"
      timeoutMs = 10_000
  }

  val aufgabe = repository.lade(id)
      .also { log.debug("geladen: ${it.titel}") }   // Nebeneffekt, Wert bleibt

  val anzeige = issue.beschreibung?.let { text -> text.take(80) } ?: "–"
  ```

  Dazu gehören `takeIf { }` und `takeUnless { }`: Sie liefern das Objekt, wenn die Bedingung stimmt (bzw. nicht stimmt), sonst `null` ([takeIf and takeUnless](https://kotlinlang.org/docs/scope-functions.html#takeif-and-takeunless)).

  Die häufigste Verwechslung: `let` oder `run` statt `apply`. Weil `let` das Ergebnis des Blocks zurückgibt und eine Zuweisung kein Wert ist, hat `Anfrage().let { it.headers[…] = … }` den Typ `Unit`. Und die häufigste Übertreibung: drei verschachtelte Scope Functions, in denen niemand mehr weiß, was `this` und `it` gerade sind. Ein `val` mit gutem Namen ist oft lesbarer.

  > [!TIP] Entscheidungshilfe
  > Brauchst du danach **das Objekt** zurück? Dann `apply` (Konfiguration) oder `also` (Nebeneffekt). Brauchst du **ein Ergebnis** aus dem Block? Dann `let` (vor allem mit `?.`) oder `run`. Die Doku hat dazu eine eigene Tabelle ([Function selection](https://kotlinlang.org/docs/scope-functions.html#function-selection)).

  ## inline, noinline, crossinline und reified

  Ein Lambda ist auf der JVM normalerweise ein Objekt. Fängt es Variablen ein, entsteht bei jedem Aufruf ein neues. Bei Funktionen wie `filter` oder `forEach`, die in Schleifen millionenfach laufen, wäre das teuer. Deshalb sind sie `inline`: Der Compiler kopiert den Körper der Funktion **und** das übergebene Lambda direkt an die Aufrufstelle ([Inline functions](https://kotlinlang.org/docs/inline-functions.html)). Es entsteht kein Lambda-Objekt.

  Das hat eine sichtbare Folge: **Non-local return.** In einem Lambda, das an eine `inline`-Funktion geht, verlässt ein nacktes `return` die **umschließende Funktion** – weil der Lambda-Code nach dem Inlining direkt in ihr steht ([Non-local jump expressions](https://kotlinlang.org/docs/inline-functions.html#non-local-jump-expressions)):

  ```kotlin
  fun ersterLeererIndex(zeilen: List<String>): Int {
      zeilen.forEachIndexed { i, zeile ->
          if (zeile.isBlank()) return i          // verlässt ersterLeererIndex
      }
      return -1
  }

  zeilen.forEach {
      if (it.isBlank()) return@forEach           // nur dieses Element überspringen
      verarbeite(it)
  }
  ```

  `return@forEach` springt nur aus dem aktuellen Lambda-Aufruf – wie `continue` in einer Schleife ([Return to labels](https://kotlinlang.org/docs/returns.html#return-to-labels)). Bei einer nicht-`inline`-Funktion ist ein nacktes `return` im Lambda verboten: `'return' is prohibited here.`

  Zwei Modifier steuern Ausnahmen ([noinline](https://kotlinlang.org/docs/inline-functions.html#noinline)):

  - **`noinline`** für einen Lambda-Parameter, den die Funktion speichern oder an eine nicht-`inline`-Funktion weitergeben will. Dafür braucht es ein echtes Objekt.
  - **`crossinline`** für einen Lambda-Parameter, den die Funktion in einem anderen Kontext aufruft – in einem `object`, einem `Runnable` oder einem anderen Lambda. Dort wäre ein non-local `return` unmöglich, deshalb verbietet `crossinline` es. Ohne den Modifier meldet der Compiler: `cannot inline 'block: () -> Unit' here: it might contain non-local returns. Add 'crossinline' modifier …`

  **`reified`** löst ein Problem der JVM: Generische Typen sind zur Laufzeit gelöscht (Type Erasure), `x is T` geht normalerweise nicht. In einer `inline`-Funktion setzt der Compiler den konkreten Typ an jeder Aufrufstelle ein, deshalb darfst du `T` dort wie eine echte Klasse benutzen ([Reified type parameters](https://kotlinlang.org/docs/inline-functions.html#reified-type-parameters)):

  ```kotlin
  inline fun <reified T> Map<String, Any?>.wertOderNull(schluessel: String): T? =
      this[schluessel] as? T

  val einstellungen: Map<String, Any?> = mapOf("intervall" to 15L)
  einstellungen.wertOderNull<Long>("intervall")     // 15
  einstellungen.wertOderNull<String>("intervall")   // null – echte Typprüfung
  ```

  Das ist die Technik hinter `filterIsInstance<T>()` und hinter `viewModel<MeinViewModel>()` in Compose. `inline` ist aber kein Performance-Schalter für jede Funktion: Ohne Lambda-Parameter bringt es fast nichts und vergrößert den Code an jeder Aufrufstelle.

  ## operator und infix in Kürze

  Mit `operator` gibst du einer Funktion eine Operator-Syntax: `plus` für `+`, `get` für `a[i]`, `invoke` für `a()`, `contains` für `in` ([Operator overloading](https://kotlinlang.org/docs/operator-overloading.html)). Mit `infix` darf eine Funktion mit einem Parameter ohne Punkt und Klammern stehen – `"id" to 42` ist die Infix-Funktion [`to`](https://kotlinlang.org/api/core/kotlin-stdlib/kotlin/to.html), die ein `Pair` baut ([Infix notation](https://kotlinlang.org/docs/functions.html#infix-notation)).

  ```kotlin
  data class Dauer(val minuten: Int) {
      operator fun plus(andere: Dauer) = Dauer(minuten + andere.minuten)
  }
  val gesamt = Dauer(25) + Dauer(5)     // Dauer(minuten=30)
  ```

  Setz beides sparsam ein: nur dort, wo die Bedeutung eines Operators offensichtlich ist.

  ## Häufige Fehler

  - **`let` statt `apply` zum Konfigurieren.** Symptom: `return type mismatch: expected 'Anfrage', actual 'Unit'.` Lösung: `apply { … }` oder `also { … }`.
  - **Nacktes `return` in `forEach`.** Symptom: Die Funktion bricht beim ersten übersprungenen Element komplett ab. Lösung: `return@forEach` oder eine normale `for`-Schleife mit `continue`.
  - **Erwartete Polymorphie bei Extensions.** Symptom: Die Extension der Oberklasse läuft, obwohl das Objekt eine Unterklasse ist. Lösung: Methode in der Klasse (`open`/`override`) statt Extension.
  - **`it` in verschachtelten Lambdas.** Das innere `it` verdeckt das äußere. Lösung: Parameter benennen.
  - **Lange lebende Lambdas fangen `Context` oder `Activity` ein.** Symptom: Speicherleck, sichtbar etwa mit LeakCanary. Lösung: nur die benötigten Werte einfangen, Listener wieder abmelden.
  - **`inline` überall.** Der Compiler warnt bei Funktionen ohne Lambda-Parameter, dass der Nutzen gering ist; der Code wird nur größer.

  > [!PRAXIS]
  > In Android-Code begegnen dir diese Werkzeuge in jeder Datei: Compose-Parameter wie `onClick: () -> Unit` und `onValueChange: (String) -> Unit`, `Modifier`-Ketten, `apply` beim Konfigurieren von Objekten, `also` für Logging, Extensions wie `Context.dataStore` oder `Flow<T>.stateIn(…)`. Im Code-Review fallen auf: Scope Functions ohne Grund verschachtelt, `?.let { … } ?: …` statt eines klaren `if`, und Callbacks, die ein `ViewModel` statt eines Lambdas an eine Composable weiterreichen. Im Praxis-Track Bear siehst du an echtem Code, wie Bear Extensions und Lambdas einsetzt.

  > [!INTERVIEW] Was macht `inline`, und warum darf man in `forEach` mit `return` die Funktion verlassen?
  > „`inline` kopiert den Körper der Funktion und die übergebenen Lambdas an die Aufrufstelle. Dadurch entsteht kein Lambda-Objekt – das lohnt sich bei Higher-Order Functions, die oft aufgerufen werden. Weil der Lambda-Code danach direkt in meiner Funktion steht, kann ein `return` darin meine Funktion verlassen: ein non-local return. Will ich nur das aktuelle Element überspringen, schreibe ich `return@forEach`. `noinline` brauche ich, wenn ich ein Lambda speichern will, `crossinline`, wenn ich es in einem anderen Kontext aufrufe, und `reified` erlaubt mir in einer inline-Funktion, den generischen Typ zur Laufzeit zu prüfen.“

  ## Zusammenfassung

  - Funktionen sind Werte mit Typen wie `(String) -> Int`. `((T) -> Unit)?` ist eine nullable Funktion, `T.() -> Unit` eine Funktion mit Empfänger.
  - Im Lambda ist der letzte Ausdruck das Ergebnis; `it` für einen einzelnen Parameter; Trailing Lambdas stehen hinter den Klammern.
  - Higher-Order Functions kapseln Abläufe, Funktionsreferenzen (`::f`, `Typ::f`, `objekt::f`, `::Klasse`) ersetzen triviale Lambdas.
  - Closures halten eingefangene Variablen am Leben – praktisch für Zähler, gefährlich für `Activity`-Referenzen.
  - Extensions sind statische Funktionen mit Empfänger: Der deklarierte Typ entscheidet, und Member gewinnen.
  - Scope Functions: `apply`/`also` geben das Objekt zurück, `let`/`run`/`with` das Ergebnis des Blocks; `it` bei `let`/`also`, `this` bei den anderen.
  - `inline` kopiert Funktion und Lambda an die Aufrufstelle und erlaubt non-local `return`. `noinline` zum Speichern, `crossinline` für fremde Kontexte, `reified` für Typprüfungen zur Laufzeit.
exercises:
  - id: scope-rueckgabe
    type: choice
    title: Wer gibt das Objekt zurück?
    prompt: Welche Scope Functions liefern das **Objekt selbst** zurück, auf dem sie aufgerufen werden – unabhängig davon, was im Block steht? (Mehrere Antworten richtig.)
    options:
      - text: "`apply`"
        correct: true
        why: "`apply` gibt den Empfänger zurück; im Block ist er `this`. Ideal zum Konfigurieren."
      - text: "`also`"
        correct: true
        why: "`also` gibt ebenfalls das Objekt zurück; im Block heißt es `it`. Ideal für Nebeneffekte wie Logging."
      - text: "`let`"
        correct: false
        why: "`let` gibt das Ergebnis des Blocks zurück, also den letzten Ausdruck."
      - text: "`run`"
        correct: false
        why: "`run` gibt wie `let` das Ergebnis des Blocks zurück, nur mit `this` statt `it`."
      - text: "`with`"
        correct: false
        why: "`with(x) { … }` liefert das Ergebnis des Blocks."
    explanation: |
      Die fünf Scope Functions unterscheiden sich in zwei Achsen: Kontextobjekt (`this` bei `run`, `with`, `apply`; `it` bei `let`, `also`) und Rückgabewert (Objekt bei `apply` und `also`, Ergebnis des Blocks bei den anderen). Wer die zwei Achsen kennt, muss die Tabelle nicht auswendig lernen.
    resources:
      - title: Kotlin-Doku · Scope functions (Return value)
        url: https://kotlinlang.org/docs/scope-functions.html#return-value
  - id: wiederhole-sortieren
    type: order
    title: Eine Funktion für Wiederholungsversuche
    prompt: |
      Bring die Zeilen in die richtige Reihenfolge. `wiederhole` ruft `block` bis zu `versuche`-mal auf, gibt das erste erfolgreiche Ergebnis zurück und wirft am Ende eine Exception mit dem letzten Fehler als Ursache.
    lang: kotlin
    lines: |
      fun <T> wiederhole(versuche: Int, block: (versuch: Int) -> T): T {
          var letzterFehler: Exception? = null
          for (versuch in 1..versuche) {
              try {
                  return block(versuch)
              } catch (e: Exception) {
                  letzterFehler = e
              }
          }
          throw IllegalStateException("Nach $versuche Versuchen gescheitert", letzterFehler)
      }
    explanation: |
      `letzterFehler` muss vor der Schleife stehen, damit er nach der Schleife noch sichtbar ist. Im `try` beendet `return block(versuch)` die Funktion beim ersten Erfolg. Das `throw` steht nach der Schleife und wird nur erreicht, wenn jeder Versuch scheiterte. `block` ist ein Funktionstyp-Parameter, `T` macht die Funktion für jeden Ergebnistyp nutzbar.
    resources:
      - title: Kotlin-Doku · Higher-order functions
        url: https://kotlinlang.org/docs/lambdas.html#higher-order-functions
  - id: extension-statisch
    type: output
    title: Welche Extension gewinnt?
    prompt: Was gibt dieses Programm aus?
    lang: kotlin
    code: |
      open class Form
      class Kreis : Form()

      fun Form.name() = "Form"
      fun Kreis.name() = "Kreis"

      class Knopf {
          fun beschriftung() = "Mitglied"
      }
      fun Knopf.beschriftung() = "Extension"

      fun main() {
          val f: Form = Kreis()
          println(f.name())
          println(Kreis().name())
          println(Knopf().beschriftung())
      }
    expected: |
      Form
      Kreis
      Mitglied
    explanation: |
      Extensions werden statisch aufgelöst: Für `f.name()` zählt der deklarierte Typ `Form`, nicht das Objekt `Kreis` dahinter. `Kreis().name()` hat den statischen Typ `Kreis`, also greift die spezifischere Extension. Hat eine Klasse eine Member-Funktion mit derselben Signatur, gewinnt immer das Member – der Compiler warnt, dass die Extension verdeckt ist.
    resources:
      - title: Kotlin-Doku · Extension or member functions?
        url: https://kotlinlang.org/docs/extensions.html#extension-or-member-functions
  - id: closure-zaehler
    type: output
    title: Zwei Zähler
    prompt: Was gibt dieses Programm aus?
    lang: kotlin
    code: |
      fun zaehler(): () -> Int {
          var n = 0
          return { ++n }
      }

      fun main() {
          val a = zaehler()
          val b = zaehler()
          println(a())
          println(a())
          println(b())
          println(a())
      }
    expected: |
      1
      2
      1
      3
    explanation: |
      Jeder Aufruf von `zaehler()` erzeugt ein neues `n` und ein Lambda, das genau dieses `n` einfängt. `a` und `b` haben also getrennte Zähler. Die eingefangene Variable lebt so lange wie das Lambda – auch nachdem `zaehler()` längst zurückgekehrt ist.
    resources:
      - title: Kotlin-Doku · Closures
