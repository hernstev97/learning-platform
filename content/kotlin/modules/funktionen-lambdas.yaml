  - id: scope-werte
    type: output
    title: Was liefern die Scope Functions?
    prompt: Was gibt dieses Programm aus? Achte auf die Reihenfolge der Ausgaben.
    lang: kotlin
    code: |
      fun main() {
          val a = "bear".let { it.uppercase() }
          val b = "bear".also { println("log: $it") }
          val c = "bear".run { length }
          val d = mutableListOf(1, 2).apply { add(3) }
          val e = with(d) { sum() }
          val f = "Tee".takeIf { it.length > 3 }
          println(a)
          println(b)
          println(c)
          println(d)
          println(e)
          println(f)
      }
    expected: |
      log: bear
      BEAR
      bear
      4
      [1, 2, 3]
      6
      null
    explanation: |
      `also` führt seinen Block sofort aus, deshalb steht „log: bear“ zuerst, und gibt den unveränderten String zurück. `let` und `run` liefern das Ergebnis des Blocks (`"BEAR"` bzw. die Länge 4). `apply` gibt die Liste selbst zurück, nachdem `add(3)` gelaufen ist. `with(d) { sum() }` liefert die Summe. `takeIf` gibt `null` zurück, weil „Tee“ nicht länger als 3 Zeichen ist.
    resources:
      - title: Kotlin-Doku · Scope functions (Distinctions)
        url: https://kotlinlang.org/docs/scope-functions.html#distinctions
  - id: funktionstyp-trailing
    type: gap
    title: Funktionstyp und Trailing Lambda
    prompt: |
      Ergänze die Lücken. `block` bekommt die Nummer des Versuchs und liefert einen `T`. Der Aufruf unten übergibt das Lambda als Trailing Lambda und benennt den Parameter `versuch`.
    lang: kotlin
    code: |
      fun <T> wiederhole(versuche: Int, block: ⟦(versuch: Int) -> T⟧): T {
          var letzterFehler: Exception? = null
          for (versuch in 1..versuche) {
              try {
                  return ⟦block(versuch)⟧
              } catch (e: Exception) {
                  letzterFehler = e
              }
          }
          throw IllegalStateException("Nach $versuche Versuchen gescheitert", letzterFehler)
      }

      fun main() {
          val ergebnis = wiederhole(3) ⟦{ versuch ->⟧
              if (versuch < 3) error("Timeout") else "ok nach $versuch"
          }
          println(ergebnis)   // ok nach 3
      }
    gaps:
      - label: Funktionstyp
        hint: Parameter in Klammern, dann `->`, dann der Rückgabetyp.
        accept: ["(Int) -> T"]
      - label: Lambda aufrufen
        hint: Eine Variable vom Funktionstyp rufst du wie eine Funktion auf.
        accept: ["block.invoke(versuch)"]
      - label: Lambda-Kopf
        hint: Geschweifte Klammer, Parametername, Pfeil.
    explanation: |
      `(versuch: Int) -> T` ist ein Funktionstyp; der Parametername ist optional und dient der Lesbarkeit. Eine Funktionsvariable rufst du mit `block(versuch)` oder `block.invoke(versuch)` auf. Weil `block` der letzte Parameter ist, steht das Lambda hinter `wiederhole(3)`. Der letzte Ausdruck im Lambda – hier das `if` – ist sein Ergebnis; `error(…)` hat den Typ `Nothing` und passt deshalb in jeden Zweig. `T` wird aus dem Lambda als `String` abgeleitet.
    resources:
      - title: Kotlin-Doku · Function types
        url: https://kotlinlang.org/docs/lambdas.html#function-types
      - title: Kotlin-Doku · Passing trailing lambdas
        url: https://kotlinlang.org/docs/lambdas.html#passing-trailing-lambdas
  - id: extension-schreiben
    type: gap
    title: Hilfsfunktionen als Extensions
    prompt: |
      Ergänze die Lücken. `oderStrich` soll auch auf `null` aufrufbar sein und dann `–` liefern. `woerter` ist eine Extension **Property** auf `String`.
    lang: kotlin
    code: |
      fun ⟦String?.⟧oderStrich(): String = if (this.isNullOrBlank()) "–" else ⟦this⟧

      ⟦val String.woerter: Int⟧
          get() = trim().split(Regex("\\s+")).size

      fun main() {
          val beschreibung: String? = null
          println(beschreibung.oderStrich())       // –
          println("Steuer bis Freitag".woerter)    // 3
      }
    gaps:
      - label: Empfängertyp
        hint: Der Typ, auf dem die Funktion aufgerufen wird, steht vor dem Namen – mit Punkt. Er muss `null` zulassen.
      - label: Rückgabe im else-Zweig
        hint: Der Empfänger selbst – nach der Prüfung per Smart Cast ein `String`.
      - label: Kopf der Extension Property
        hint: "`val`, Empfängertyp mit Punkt, Name, Typ."
    explanation: |
      Der Empfängertyp `String?` erlaubt den Aufruf auf `null`; im Körper ist `this` der Empfänger. `isNullOrBlank()` hat einen Contract, deshalb ist `this` im `else`-Zweig ein `String`. Extension Properties haben kein Backing Field und brauchen einen Getter. Beides sind im erzeugten Bytecode statische Funktionen mit dem Empfänger als erstem Parameter.
    resources:
      - title: Kotlin-Doku · Nullable receivers
        url: https://kotlinlang.org/docs/extensions.html#nullable-receivers
      - title: Kotlin-Doku · Extension properties
        url: https://kotlinlang.org/docs/extensions.html#extension-properties
  - id: inline-reified
    type: gap
    title: Typsicher aus einer Map lesen
    prompt: |
      Ergänze die Funktion so, dass `T` zur Laufzeit bekannt ist und ein Wert vom falschen Typ `null` statt einer `ClassCastException` liefert.
    lang: kotlin
    code: |
      ⟦inline⟧ fun <⟦reified⟧ T> Map<String, Any?>.wertOderNull(schluessel: String): T? =
          this[schluessel] ⟦as? T⟧

      fun main() {
          val einstellungen: Map<String, Any?> = mapOf("intervall" to 15L, "nurWlan" to true)
          println(einstellungen.wertOderNull<Long>("intervall"))    // 15
          println(einstellungen.wertOderNull<String>("intervall"))  // null
          println(einstellungen.wertOderNull<Boolean>("nurWlan"))   // true
      }
    gaps:
      - label: Modifier der Funktion
        hint: Ohne diesen Modifier ist ein konkreter Typparameter zur Laufzeit unmöglich.
      - label: Modifier des Typparameters
        hint: Er sorgt dafür, dass `T` an der Aufrufstelle durch den echten Typ ersetzt wird.
      - label: Sicherer Cast
        hint: Ein Cast, der bei falschem Typ `null` liefert.
    explanation: |
      Auf der JVM sind Typparameter zur Laufzeit gelöscht. Bei einer `inline`-Funktion mit `reified T` setzt der Compiler an jeder Aufrufstelle den konkreten Typ ein, deshalb prüft `as? T` wirklich gegen `Long`, `String` oder `Boolean`. Ohne `reified` wäre `as? T` ein ungeprüfter Cast, der den falschen Typ durchlässt und später mit einer `ClassCastException` knallt.
    resources:
      - title: Kotlin-Doku · Reified type parameters
        url: https://kotlinlang.org/docs/inline-functions.html#reified-type-parameters
  - id: let-statt-apply
    type: bug
    title: Die Anfrage ist Unit
    prompt: |
      Der Code kompiliert nicht: `return type mismatch: expected 'Anfrage', actual 'Unit'.` (Zeile 5). Die Anfrage soll mit gesetztem Authorization-Header zurückgegeben werden. Finde die Zeile, die den Fehler verursacht, und korrigiere sie.
    lang: kotlin
    code: |
      class Anfrage { val headers = mutableMapOf<String, String>() }

      fun baueAnfrage(token: String): Anfrage {
          val anfrage = Anfrage().let { it.headers["Authorization"] = "Bearer $token" }
          return anfrage
      }
    lines: [4]
    fix:
      - line: 4
        answers:
          - 'val anfrage = Anfrage().apply { headers["Authorization"] = "Bearer $token" }'
          - 'val anfrage = Anfrage().also { it.headers["Authorization"] = "Bearer $token" }'
          - 'val anfrage = Anfrage().apply { this.headers["Authorization"] = "Bearer $token" }'
    explanation: |
      Der Fehler wird in Zeile 5 gemeldet, entsteht aber in Zeile 4. `let` gibt das Ergebnis des Blocks zurück; eine Zuweisung ist in Kotlin kein Ausdruck, also ist das Ergebnis `Unit` – und `anfrage` hat den Typ `Unit`. `apply` gibt das Objekt selbst zurück und stellt es im Block als `this` bereit, deshalb reicht `headers[…]`. `also` gibt ebenfalls das Objekt zurück, nennt es aber `it`.
    resources:
      - title: Kotlin-Doku · apply
        url: https://kotlinlang.org/docs/scope-functions.html#apply
  - id: return-in-foreach
    type: bug
    title: Nach der ersten Leerzeile ist Schluss
    prompt: |
      `bereinige` soll leere Zeilen überspringen und alle anderen getrimmt zurückgeben. Für `listOf(" Steuer", "", "Laufen ")` kommt aber nur `[Steuer]` heraus statt `[Steuer, Laufen]`. Finde die fehlerhafte Zeile und korrigiere sie, ohne die `forEach`-Struktur aufzugeben.
    lang: kotlin
    code: |
      fun bereinige(zeilen: List<String>): List<String> {
          val ergebnis = mutableListOf<String>()
          zeilen.forEach {
              if (it.isBlank()) return ergebnis
              ergebnis += it.trim()
          }
          return ergebnis
      }
    lines: [4]
    fix:
      - line: 4
        answers:
          - "if (it.isBlank()) return@forEach"
    explanation: |
      `forEach` ist `inline`, deshalb verlässt ein nacktes `return` im Lambda die ganze Funktion `bereinige` – ein non-local return. Die erste Leerzeile beendet also die Verarbeitung. `return@forEach` springt nur aus dem aktuellen Lambda-Aufruf zurück und macht mit dem nächsten Element weiter, wie `continue` in einer `for`-Schleife. Eine `for`-Schleife mit `continue` oder `zeilen.filter { it.isNotBlank() }.map { it.trim() }` wäre hier noch klarer.
    resources:
      - title: Kotlin-Doku · Return to labels
        url: https://kotlinlang.org/docs/returns.html#return-to-labels
      - title: Kotlin-Doku · Non-local jump expressions
        url: https://kotlinlang.org/docs/inline-functions.html#non-local-jump-expressions
  - id: messe-erklaeren
    type: explain
    title: Messen mit inline und finally
    prompt: |
      Erkläre in eigenen Worten, was `messe` macht und was beim Aufruf in `ladeAufgaben` passiert. Warum ist das `return dao.alle()` im Lambda erlaubt, und wohin springt es? Wird die Zeit auch in diesem Fall gemessen?
    lang: kotlin
    code: |
      inline fun <T> messe(label: String, block: () -> T): T {
          val start = System.nanoTime()
          try {
              return block()
          } finally {
              val ms = (System.nanoTime() - start) / 1_000_000
              println("$label: $ms ms")
          }
      }

      fun ladeAufgaben(dao: AufgabenDao, nurOffene: Boolean): List<Aufgabe> {
          return messe("laden") {
              if (!nurOffene) return dao.alle()
              dao.offene()
          }
      }
    points:
      - "`messe` ist eine generische Higher-Order Function: Sie führt `block` aus, gibt dessen Ergebnis vom Typ `T` zurück und misst die Dauer."
      - "`inline` kopiert `messe` und das Lambda an die Aufrufstelle; es entsteht kein Lambda-Objekt."
      - "`return dao.alle()` ist ein non-local return und verlässt `ladeAufgaben` – nur erlaubt, weil `messe` inline ist."
      - "`finally` läuft immer – bei normalem Ende, bei non-local return und bei einer Exception –, deshalb wird die Zeit in jedem Fall ausgegeben."
      - Im normalen Fall ist `dao.offene()` als letzter Ausdruck das Ergebnis des Lambdas.
    explanation: |
      `messe` nimmt einen Namen und einen Block, merkt sich die Startzeit, führt den Block aus und gibt dessen Ergebnis zurück. Der generische Typ `T` sorgt dafür, dass `messe` für jedes Ergebnis funktioniert – hier `List<Aufgabe>`. Weil `messe` `inline` ist, kopiert der Compiler den Körper samt Lambda direkt in `ladeAufgaben`. Deshalb darf im Lambda ein nacktes `return` stehen: Es verlässt `ladeAufgaben` mit `dao.alle()`. Bei einer nicht-inline-Funktion wäre das ein Compilerfehler. Das `finally` läuft auch bei diesem frühen Ausstieg und bei Exceptions, die Messung geht also nie verloren. Im normalen Pfad liefert das Lambda `dao.offene()` als letzten Ausdruck.
    resources:
      - title: Kotlin-Doku · Inline functions
        url: https://kotlinlang.org/docs/inline-functions.html
      - title: Kotlin-Doku · Returns (non-local)
        url: https://kotlinlang.org/docs/inline-functions.html#returns
  - id: inline-modifier
    type: choice
    title: noinline, crossinline, inline
    prompt: Welche Aussagen stimmen? (Mehrere Antworten richtig.)
    options:
      - text: "`noinline` brauchst du, wenn eine inline-Funktion ein Lambda speichern oder an eine nicht-inline-Funktion weitergeben will."
        correct: true
        why: Zum Speichern oder Weitergeben braucht es ein echtes Funktionsobjekt – genau das erzeugt `noinline`.
      - text: "`crossinline` markiert ein Lambda, das in einem anderen Kontext aufgerufen wird (etwa in einem `Runnable`), und verbietet darin non-local returns."
        correct: true
        why: Aus einem anderen Ausführungskontext kann ein `return` die äußere Funktion nicht mehr verlassen. Der Compiler verlangt dann `crossinline`.
      - text: "`crossinline` erlaubt non-local returns auch in Lambdas, die in einem `object` aufgerufen werden."
        correct: false
        why: Umgekehrt – `crossinline` **verbietet** non-local returns, damit das Inlining in fremde Kontexte möglich wird.
      - text: Jede Funktion sollte `inline` sein, weil Inlining immer schneller ist.
        correct: false
        why: Ohne Lambda-Parameter bringt `inline` kaum etwas und vergrößert den Code an jeder Aufrufstelle. Der Compiler warnt in diesem Fall.
    explanation: |
      `inline` lohnt sich für Funktionen mit Lambda-Parametern: Das Lambda-Objekt entfällt, non-local returns und `reified` werden möglich. `noinline` nimmt einzelne Lambdas vom Inlining aus, `crossinline` erlaubt das Inlining in verschachtelte Kontexte, verbietet dort aber `return` aus der äußeren Funktion.
    resources:
      - title: Kotlin-Doku · noinline
        url: https://kotlinlang.org/docs/inline-functions.html#noinline
  - id: validierungsregeln
    type: practice
    title: Validierungsregeln als Funktionen
    prompt: |
      Bear prüft Aufgabentitel mit mehreren Regeln. Baue das mit Funktionen als Werten:

      1. `typealias Regel = (String) -> String?` – eine Regel liefert eine Fehlermeldung oder `null`.
      2. `nichtLeer` als Lambda-Wert, `mindestens(n)` und `ohne(zeichen)` als Funktionen, die eine `Regel` **zurückgeben** (Closure über `n` bzw. `zeichen`).
      3. `keineUrl(text: String): String?` als normale Funktion, die du per Funktionsreferenz in die Regelliste aufnimmst.
      4. Eine Extension `String.pruefe(regeln: List<Regel>): List<String>`, die alle Fehlermeldungen sammelt.

      Erwartete Ausgabe für die Regeln `nichtLeer, mindestens(3), ohne('#'), keineUrl`:

      ```text
      "" → [Darf nicht leer sein, Mindestens 3 Zeichen]
      "Steuer #2026" → [Kein '#' erlaubt]
      "https://linear.app" → [Keine Links im Titel]
      "Steuer 2026" → []
      ```
    lang: kotlin
    starter: |
      typealias Regel = (String) -> String?

      // nichtLeer, mindestens, ohne, keineUrl, pruefe

      fun main() {
          val titelRegeln: List<Regel> = listOf(/* … */)
          for (titel in listOf("", "Steuer #2026", "https://linear.app", "Steuer 2026")) {
              println("\"$titel\" → ${titel.pruefe(titelRegeln)}")
          }
      }
    solution: |
      typealias Regel = (String) -> String?

      val nichtLeer: Regel = { if (it.isBlank()) "Darf nicht leer sein" else null }

      fun mindestens(n: Int): Regel = { eingabe ->
          if (eingabe.length < n) "Mindestens $n Zeichen" else null
      }

      fun ohne(zeichen: Char): Regel = { if (zeichen in it) "Kein '$zeichen' erlaubt" else null }

      fun keineUrl(text: String): String? = if ("://" in text) "Keine Links im Titel" else null

      fun String.pruefe(regeln: List<Regel>): List<String> = regeln.mapNotNull { regel -> regel(this) }

      fun main() {
          val titelRegeln: List<Regel> = listOf(nichtLeer, mindestens(3), ohne('#'), ::keineUrl)
          for (titel in listOf("", "Steuer #2026", "https://linear.app", "Steuer 2026")) {
              println("\"$titel\" → ${titel.pruefe(titelRegeln)}")
          }
      }
    checklist:
      - "`Regel` ist ein `typealias` für den Funktionstyp `(String) -> String?`."
      - "`mindestens` und `ohne` geben ein Lambda zurück, das `n` bzw. `zeichen` einfängt (Closure)."
      - "`keineUrl` steht als normale Funktion im Code und landet mit `::keineUrl` in der Liste."
      - "`pruefe` ist eine Extension auf `String` und sammelt mit `mapNotNull` nur die Fehlermeldungen."
      - Die vier Testtitel liefern genau die erwarteten Listen.
    explanation: |
      Jede Regel ist ein Wert vom Typ `(String) -> String?`, deshalb passen Lambdas, zurückgegebene Closures und Funktionsreferenzen in dieselbe Liste. `mindestens(3)` erzeugt ein neues Lambda, das `n = 3` festhält – dasselbe Prinzip wie beim Zähler. `pruefe` wendet jede Regel auf den Empfänger `this` an und verwirft mit `mapNotNull` die `null`-Ergebnisse. Neue Regeln kommen dazu, ohne `pruefe` anzufassen. So sind auch Validierungsbibliotheken und Compose-Modifier aufgebaut.
    resources:
      - title: Kotlin-Doku · Type aliases
        url: https://kotlinlang.org/docs/type-aliases.html
      - title: Kotlin-Doku · Function references
        url: https://kotlinlang.org/docs/reflection.html#function-references
