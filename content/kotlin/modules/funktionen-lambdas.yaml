id: funktionen-lambdas
title: Funktionen & Lambdas
level: 2
minutes: 180
summary: Funktionen als Werte – Funktionstypen, Lambdas, Extensions, Scope Functions und `inline` – und wie du sie liest und schreibst, ohne dass der Code unlesbar wird.
goals:
  - Du liest und schreibst Funktionstypen wie `(String) -> Int?` und `((Aufgabe) -> Unit)?` und rufst Lambdas mit Trailing-Lambda-Syntax auf.
  - Du schreibst eigene Higher-Order Functions und übergibst Funktionsreferenzen mit `::`.
  - Du erklärst, was ein Lambda aus seiner Umgebung einfängt (Closure), und erkennst die Folgen.
  - Du schreibst Extension Functions und Properties und erklärst, warum sie statisch aufgelöst werden.
  - Du wählst zwischen `let`, `run`, `with`, `apply` und `also` nach Kontextobjekt und Rückgabewert.
  - Du erklärst `inline`, non-local `return`, `noinline`, `crossinline` und `reified`.
