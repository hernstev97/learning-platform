        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.collections/to-list.html
  - id: sequence-reihenfolge
    type: output
    title: Wer wird wann aufgerufen?
    prompt: Was gibt das Programm aus? Achte auf die Reihenfolge der Zeilen.
    lang: kotlin
    code: |
      fun main() {
          val result = listOf(4, 1, 7, 2, 9)
              .asSequence()
              .filter { println("filter $it"); it > 3 }
              .map { println("map $it"); it * 10 }
              .first()
          println(result)
      }
    expected: |
      filter 4
      map 4
      40
    explanation: |
      Eine Sequence schickt jedes Element einzeln durch die ganze Kette. Die `4` passiert `filter`, wird in `map` zu `40`, und `first()` hat damit sein Ergebnis – die übrigen Elemente werden nie angefasst. Ohne `asSequence()` würde `filter` erst alle fünf Zahlen prüfen, `map` dann `4`, `7` und `9` umwandeln, und erst danach nähme `first()` das erste Element.
