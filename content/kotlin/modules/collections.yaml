  - id: leere-listen
    type: output
    title: Nichts ist auch ein Ergebnis
    prompt: Was gibt dieses Programm aus?
    lang: kotlin
    code: |
      fun main() {
          val empty = emptyList<Int>()
          println(empty.all { it > 100 })
          println(empty.any { it > 100 })
          println(empty.sumOf { it })
          println(empty.maxOrNull())
          println(listOf(3, 7, 2).fold("") { acc, n -> acc + n })
      }
    expected: |
      true
      false
      0
      null
      372
    explanation: |
      `all` fragt: „Gibt es ein Element, das die Bedingung verletzt?“ – bei einer leeren Liste nicht, also `true`. `any` braucht mindestens ein passendes Element, also `false`. `sumOf` startet bei `0`, `maxOrNull` hat nichts zum Vergleichen und liefert `null`. `fold` beginnt mit dem Anfangswert `""` und hängt jede Zahl an einen String an – das Ergebnis ist `"372"`, keine Summe. Genau diese Randfälle entscheiden im echten Code darüber, ob ein leerer Bildschirm funktioniert oder abstürzt.
