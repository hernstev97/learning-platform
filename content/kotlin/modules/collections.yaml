  - id: collections-erzeugen
    type: gap
    title: Nachschlagen, Konfiguration, Menü
    prompt: |
      Ergänze die Lücken:

      1. `usersById` soll ein Nachschlagen per ID in konstanter Zeit ermöglichen.
      2. `limits` ist eine feste Map von Tarif zu Projektlimit.
      3. `menu` wird bedingt zusammengebaut und ist danach read-only.
    lang: kotlin
    code: |
      data class User(val id: String, val name: String)

      val users = listOf(User("u1", "Ada"), User("u2", "Linus"))
      val usersById: Map<String, User> = users.⟦associateBy⟧ { it.id }

      val limits: Map<String, Int> = ⟦mapOf⟧("free" ⟦to⟧ 3, "pro" to 50)

      fun menu(isAdmin: Boolean): List<String> = ⟦buildList⟧ {
          add("Übersicht")
          if (isAdmin) add("Benutzerverwaltung")
      }
    gaps:
      - label: Liste → Map mit ID als Schlüssel
        hint: Die Funktion ordnet jedem Element einen Schlüssel zu, das Element selbst wird zum Wert.
      - label: feste Map erzeugen
        hint: Das Gegenstück zu `listOf` für Maps.
      - label: Paar bilden
        hint: Eine Infix-Funktion aus zwei Buchstaben, die ein `Pair` erzeugt.
      - label: Liste bauen
        hint: Ein Builder, in dessen Lambda `add` verfügbar ist und der eine read-only `List` zurückgibt.
    explanation: |
      `associateBy { it.id }` baut einmalig eine `Map<String, User>`; danach ist `usersById["u1"]` ein Hash-Lookup statt einer Suche durch die Liste. Bei doppelten IDs gewinnt das letzte Element. `mapOf` mit `to` ist die idiomatische Map-Schreibweise – `to` erzeugt ein `Pair`. `buildList` gibt dir im Lambda eine `MutableList` als Empfänger und liefert am Ende eine `List` zurück, sodass niemand das Ergebnis über diese Referenz verändern kann.
