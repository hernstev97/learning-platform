id: collections
title: Collections und Daten-Pipelines
level: 2
minutes: 150
summary: Wie Kotlins Collections aufgebaut sind, warum read-only nicht unveränderlich heißt und wie du Daten mit map, groupBy, fold und Sequences in lesbare und effiziente Pipelines verwandelst.
goals:
  - Du erklärst, warum `List` nur eine read-only Sicht ist, und entscheidest bewusst zwischen `List`, `MutableList` und einer Kopie.
  - Du baust Pipelines mit `filter`, `map`, `groupBy`, `associateBy`, `partition` und `fold` und sagst ihr Ergebnis voraus – auch für leere Listen.
  - Du sortierst nach mehreren Kriterien mit `sortedWith(compareBy { … }.thenBy { … })` und kennst den Unterschied zwischen `sorted…` und `sort…`.
  - Du begründest, wann eine `Sequence` hilft und wann sie nur Overhead ist.
  - Du erkennst quadratische Laufzeitfallen und ersetzt Suchen in Listen durch Maps oder Sets.
