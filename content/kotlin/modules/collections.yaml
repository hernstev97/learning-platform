  - id: defensive-kopie
    type: gap
    title: Den Warenkorb schützen
    prompt: |
      `Cart` soll seine Positionen intern verändern, nach außen aber nur einen **Schnappschuss** herausgeben. Aufrufer dürfen die interne Liste weder verändern noch durch einen Cast an sie herankommen. Ergänze die Lücken.
    lang: kotlin
    code: |
      data class Item(val sku: String, val quantity: Int)

      class Cart {
          private val _items = ⟦mutableListOf⟧<Item>()

          val items: ⟦List⟧<Item>
              get() = _items.⟦toList()⟧

          fun add(item: Item) {
              _items.add(item)
          }
      }
    gaps:
      - label: interne, veränderliche Liste
        hint: Eine leere, veränderliche Liste mit explizitem Typargument.
      - label: öffentlicher Typ
        hint: Das read-only Interface.
      - label: Schnappschuss
        hint: Eine Funktion, die eine neue Liste mit denselben Elementen erzeugt.
        accept: ["toList( )"]
    explanation: |
      Das Muster „privat veränderlich, öffentlich read-only“ kennst du später von `MutableStateFlow`/`StateFlow`. Würde der Getter `_items` direkt zurückgeben, wäre der Typ zwar `List`, aber ein Aufrufer könnte mit `cart.items as MutableList<Item>` an die interne Liste gelangen – und er sähe spätere Änderungen mit. `toList()` erzeugt bei jedem Zugriff eine Kopie. Das kostet O(n) pro Aufruf; für einen Warenkorb ist das egal, für eine Liste mit 100 000 Einträgen, die in einer Schleife abgefragt wird, nicht.
    resources:
      - title: Kotlin Docs · Collections overview
        url: https://kotlinlang.org/docs/collections-overview.html
  - id: mehrstufig-sortieren
    type: gap
    title: Das Board sortieren
    prompt: |
      Sortiere die Issues so: **offene zuerst** (`done == false`), innerhalb davon nach Punkten **absteigend**, bei Gleichstand nach `key` **aufsteigend**. Die Originalliste bleibt unverändert.
    lang: kotlin
    code: |
      val board: List<Issue> = issues.⟦sortedWith⟧(
          ⟦compareBy⟧<Issue> { it.done }
              .⟦thenByDescending⟧ { it.points }
              .⟦thenBy⟧ { it.key }
      )
    gaps:
      - label: neue sortierte Liste mit Comparator
        hint: Die Variante, die einen `Comparator` annimmt und eine neue Liste zurückgibt.
      - label: erster Comparator
        hint: Baut einen Comparator aus einer Selektor-Lambda.
      - label: zweites Kriterium, absteigend
        hint: "`thenBy`, aber in umgekehrter Richtung."
      - label: drittes Kriterium
        hint: Aufsteigend, als weiteres Kriterium angehängt.
    explanation: |
      `sortedWith` nimmt einen `Comparator` und gibt eine neue Liste zurück; `sortWith` würde eine `MutableList` an Ort und Stelle sortieren. `compareBy { it.done }` sortiert `false` vor `true`, weil `Boolean` `Comparable` ist und `false < true` gilt. `thenByDescending` und `thenBy` greifen nur, wenn alle vorherigen Kriterien Gleichstand melden. Die Typangabe `compareBy<Issue>` ist nötig, weil der Compiler den Typ von `it` sonst nicht ableiten kann, bevor `thenBy…` angehängt wird.
    resources:
      - title: Kotlin Docs · Custom orders
        url: https://kotlinlang.org/docs/collection-ordering.html#custom-orders
      - title: Kotlin API · thenBy
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.comparisons/then-by.html
  - id: stuecke-und-fenster
    type: gap
    title: Batches, Fenster, Differenzen
    prompt: |
      Ergänze die drei Aufrufe:

      1. Die API nimmt höchstens **50** IDs pro Anfrage – teile `ids` in Batches.
      2. Glätte die Messwerte mit einem gleitenden Durchschnitt über je **3** aufeinanderfolgende Werte.
      3. Berechne die Differenz zwischen jeweils zwei aufeinanderfolgenden Zählerständen.
    lang: kotlin
    code: |
      val ids: List<String> = (1..120).map { "ISS-$it" }
      val batches: List<List<String>> = ids.⟦chunked(50)⟧

      val readings = listOf(20.0, 22.0, 30.0, 26.0, 24.0)
      val smoothed: List<Double> = readings.⟦windowed(3)⟧ { it.average() }

      val counters = listOf(100, 104, 111, 111)
      val deltas: List<Int> = counters.⟦zipWithNext⟧ { a, b -> b - a }
    gaps:
      - label: Batches
        hint: Teilt eine Liste in nicht überlappende Stücke fester Größe.
        accept: ["chunked(size = 50)"]
      - label: gleitendes Fenster
        hint: Überlappende Fenster, Schrittweite 1 ist der Standard.
        accept: ["windowed(size = 3)", "windowed(3, 1)", "windowed(3, step = 1)", "windowed(size = 3, step = 1)"]
      - label: Nachbarpaare
        hint: Wie `zip`, aber mit dem jeweils nächsten Element derselben Liste.
    explanation: |
      `chunked(50)` liefert nicht überlappende Stücke – hier `[50, 50, 20]` Elemente; das letzte Stück darf kleiner sein. `windowed(3)` liefert überlappende Fenster mit Schrittweite 1, also `[20, 22, 30]`, `[22, 30, 26]`, `[30, 26, 24]`, und die Lambda macht aus jedem Fenster direkt einen Durchschnitt. `zipWithNext` bildet Paare aus Nachbarn, das Ergebnis ist `[4, 7, 0]`. Alle drei gibt es auch auf Sequences.
    resources:
      - title: Kotlin Docs · Retrieve collection parts
        url: https://kotlinlang.org/docs/collection-parts.html
      - title: Kotlin API · windowed
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.collections/windowed.html
  - id: sortiert-aber-nicht
    type: bug
    title: Die Top 3 sind zufällig
    prompt: |
      `topThree` soll die drei Issues mit den meisten Punkten liefern. Für `A(1), B(5), C(3), D(2)` kommt aber `[A, B, C]` heraus statt `[B, C, D]`. Der Code kompiliert und wirft keinen Fehler. Finde die fehlerhafte Zeile und korrigiere sie so, dass `sorted` danach wirklich sortiert ist.
    lang: kotlin
    code: |
      fun topThree(issues: List<Issue>): List<Issue> {
          val sorted = issues.toMutableList()
          sorted.sortedByDescending { it.points }
          return sorted.take(3)
      }
    lines: [3]
    fix:
      - line: 3
        answers:
          - "sorted.sortByDescending { it.points }"
          - "sorted.sortBy { -it.points }"
          - "sorted.sortWith(compareByDescending { it.points })"
    explanation: |
      `sortedByDescending` gibt eine **neue** sortierte Liste zurück und lässt `sorted` unverändert – das Ergebnis wird hier weggeworfen. Die In-place-Variante heißt `sortByDescending` und existiert nur auf `MutableList`. Wer aus JavaScript kommt, kennt `array.sort()` als verändernde Operation und fällt hier besonders leicht herein. Noch einfacher wäre der ganze Körper als `issues.sortedByDescending { it.points }.take(3)` – ohne Kopie und ohne veränderlichen Zustand.
    resources:
      - title: Kotlin Docs · List write operations (sort)
        url: https://kotlinlang.org/docs/list-operations.html#sort
  - id: leere-reduktion
    type: bug
    title: Absturz bei erledigten Teams
    prompt: |
      Der Bildschirm „Offene Punkte“ stürzt ab, sobald ein Team **alle** Issues erledigt hat:

      ```text
      java.lang.UnsupportedOperationException: Empty collection can't be reduced.
      ```

      Finde die Zeile und korrigiere sie, sodass für eine leere Liste `0` herauskommt.
    lang: kotlin
    code: |
      fun openPoints(issues: List<Issue>): Int =
          issues
              .filter { !it.done }
              .map { it.points }
              .reduce { total, points -> total + points }
    lines: [5]
    fix:
      - line: 5
        answers:
          - ".sum()"
          - ".fold(0) { total, points -> total + points }"
          - ".fold(0) { acc, points -> acc + points }"
          - ".fold(0) { acc, p -> acc + p }"
          - ".fold(0, Int::plus)"
          - ".reduceOrNull { total, points -> total + points } ?: 0"
    explanation: |
      `reduce` nimmt das erste Element als Startwert. Gibt es keines, gibt es kein sinnvolles Ergebnis – also wirft `reduce`. `fold(0) { … }` startet mit einem expliziten Anfangswert und liefert bei leerer Liste genau diesen. Für Summen ist `sum()` am klarsten; noch kürzer wäre es, `map` und `reduce` durch `sumOf { it.points }` zu ersetzen. Die Regel: `reduce` nur, wenn eine leere Collection fachlich unmöglich ist.
    resources:
      - title: Kotlin Docs · Fold and reduce
        url: https://kotlinlang.org/docs/collection-aggregate.html#fold-and-reduce
  - id: join-erklaeren
    type: explain
    title: Autoren zuordnen
    prompt: |
      Ein Kollege hat diese Funktion geschrieben, die jedem Issue seinen Autor zuordnet. Erkläre im Code-Review, **wie** sie arbeitet, **welche Laufzeit** sie hat und welches **Verhalten bei Sonderfällen** (unbekannte oder doppelte User-IDs) sie zeigt.
    lang: kotlin
    code: |
      data class Issue(val key: String, val authorId: String)
      data class User(val id: String, val name: String)
      data class IssueWithAuthor(val issue: Issue, val author: User)

      fun attachAuthors(issues: List<Issue>, users: List<User>): List<IssueWithAuthor> {
          val usersById = users.associateBy { it.id }
          return issues.mapNotNull { issue ->
              val author = usersById[issue.authorId] ?: return@mapNotNull null
              IssueWithAuthor(issue, author)
          }
      }
    points:
      - "`associateBy` baut einmal eine Map von ID zu User – O(m) für m User."
      - Jedes Nachschlagen in der Map ist im Mittel O(1), insgesamt also O(n + m) statt O(n · m) mit `users.find { … }` pro Issue.
      - "`return@mapNotNull null` verlässt nur die Lambda für dieses Issue; `mapNotNull` lässt `null` weg, Issues ohne bekannten Autor fallen also still heraus."
      - Bei doppelten User-IDs gewinnt der letzte User in der Liste, ohne Fehlermeldung.
    explanation: |
      Die Funktion ist ein Hash-Join: `users.associateBy { it.id }` erzeugt einmal eine `Map<String, User>` (O(m)), danach kostet jedes Nachschlagen im Mittel O(1). Insgesamt ist das O(n + m). Die naive Variante mit `users.find { it.id == issue.authorId }` für jedes Issue wäre O(n · m) – bei 1 000 Issues und 1 000 Usern eine Million Vergleiche. `return@mapNotNull null` ist ein Label-Return: Er beendet nur die aktuelle Lambda-Ausführung, nicht `attachAuthors`. Weil `mapNotNull` `null`-Ergebnisse verwirft, verschwinden Issues mit unbekanntem Autor kommentarlos – im Review würde ich fragen, ob das fachlich gewollt ist oder ob man sie loggen oder als „Unbekannt“ anzeigen sollte. Doppelte User-IDs führen dazu, dass der letzte User gewinnt, weil `associateBy` bei gleichen Schlüsseln überschreibt.
    resources:
      - title: Kotlin API · associateBy
        url: https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.collections/associate-by.html
      - title: Kotlin Docs · Return to labels
        url: https://kotlinlang.org/docs/returns.html#return-to-labels
  - id: zeiterfassung
    type: practice
    title: Wochenbericht aus der Zeiterfassung
    prompt: |
      Ein Team erfasst Zeiten pro Issue. Schreibe drei Funktionen – ohne `for`-Schleifen, nur mit Collection-Operationen:

      1. `minutesPerTeam(entries)` liefert eine `Map<String, Int>` mit der Summe der Minuten pro Team, **absteigend** nach Minuten sortiert.
      2. `topIssues(entries, n)` liefert die `n` Issues mit den meisten Minuten als `List<Pair<String, Int>>`; bei Gleichstand entscheidet der Issue-Key alphabetisch.
      3. `splitValid(entries)` trennt gültige Einträge (1 bis 600 Minuten) von ungültigen und gibt beides als `Pair` zurück.

      Teste mit dem `main` aus dem Startcode. Leere Listen dürfen nicht abstürzen. Du kannst den Code in IntelliJ IDEA, Android Studio oder im [Kotlin Playground](https://play.kotlinlang.org/) ausführen.
    lang: kotlin
    starter: |
      data class TimeEntry(val issueKey: String, val team: String, val minutes: Int)

      fun minutesPerTeam(entries: List<TimeEntry>): Map<String, Int> = TODO()

      fun topIssues(entries: List<TimeEntry>, n: Int): List<Pair<String, Int>> = TODO()

      fun splitValid(entries: List<TimeEntry>): Pair<List<TimeEntry>, List<TimeEntry>> = TODO()

      fun main() {
          val entries = listOf(
              TimeEntry("APP-1", "app", 90),
              TimeEntry("WEB-4", "web", 45),
              TimeEntry("APP-1", "app", 30),
              TimeEntry("APP-7", "app", 120),
              TimeEntry("WEB-2", "web", 0),
              TimeEntry("OPS-3", "ops", 720),
          )
          println(minutesPerTeam(entries))  // {ops=720, app=240, web=45}
          println(topIssues(entries, 2))    // [(OPS-3, 720), (APP-1, 120)] – APP-1 und APP-7 gleichauf
          println(splitValid(entries).second.map { it.issueKey })  // [WEB-2, OPS-3]
          println(minutesPerTeam(emptyList()))  // {}
      }
    solution: |
      data class TimeEntry(val issueKey: String, val team: String, val minutes: Int)

      fun minutesPerTeam(entries: List<TimeEntry>): Map<String, Int> =
          entries
              .groupBy { it.team }
              .mapValues { (_, teamEntries) -> teamEntries.sumOf { it.minutes } }
              .toList()
              .sortedByDescending { (_, minutes) -> minutes }
              .toMap()

      fun topIssues(entries: List<TimeEntry>, n: Int): List<Pair<String, Int>> =
          entries
              .groupingBy { it.issueKey }
              .fold(0) { total, entry -> total + entry.minutes }
              .toList()
              .sortedWith(
                  compareByDescending<Pair<String, Int>> { it.second }
                      .thenBy { it.first }
              )
              .take(n)

      fun splitValid(entries: List<TimeEntry>): Pair<List<TimeEntry>, List<TimeEntry>> =
          entries.partition { it.minutes in 1..600 }

      fun main() {
          val entries = listOf(
              TimeEntry("APP-1", "app", 90),
              TimeEntry("WEB-4", "web", 45),
              TimeEntry("APP-1", "app", 30),
              TimeEntry("APP-7", "app", 120),
              TimeEntry("WEB-2", "web", 0),
              TimeEntry("OPS-3", "ops", 720),
          )
          println(minutesPerTeam(entries))  // {ops=720, app=240, web=45}
          println(topIssues(entries, 2))    // [(OPS-3, 720), (APP-1, 120)]
          println(splitValid(entries).second.map { it.issueKey })  // [WEB-2, OPS-3]
          println(minutesPerTeam(emptyList()))  // {}
      }
    checklist:
      - Keine `for`-Schleife und keine `MutableList` – nur Collection-Operationen.
      - "`minutesPerTeam` gruppiert, summiert mit `sumOf` und sortiert über `toList()`/`toMap()`, weil sich eine `Map` nicht direkt sortieren lässt."
      - "`topIssues` summiert **pro Issue** (nicht pro Eintrag) und sortiert mit einem zweistufigen `Comparator`."
      - "`splitValid` nutzt `partition` mit einem Bereich `1..600` statt zweier `filter`-Aufrufe."
      - Die Ausgabe von `main` stimmt mit den Kommentaren überein, auch für die leere Liste.
    explanation: |
      `groupBy` + `mapValues` + `sumOf` ist das Standardmuster für „Summe pro Schlüssel“. Die Musterlösung zeigt für `topIssues` eine Alternative: `groupingBy { … }.fold(0) { … }` aggregiert direkt, ohne für jede Gruppe erst eine Liste anzulegen – bei großen Datenmengen spart das Speicher. Eine `Map` hat keine Sortierfunktion; der Umweg über `toList()` und `toMap()` erzeugt eine `LinkedHashMap`, die die sortierte Reihenfolge behält. `partition` durchläuft die Liste nur einmal, zwei `filter`-Aufrufe zweimal. Weil keine Funktion `reduce`, `first()` oder `maxOf` benutzt, funktionieren alle drei auch mit leeren Listen.
    resources:
      - title: Kotlin Docs · Grouping (groupingBy)
        url: https://kotlinlang.org/docs/collection-grouping.html
      - title: Kotlin Docs · Partition
        url: https://kotlinlang.org/docs/collection-filtering.html#partition
