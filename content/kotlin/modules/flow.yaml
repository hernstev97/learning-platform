id: flow
title: Flow, StateFlow und SharedFlow
level: 3
minutes: 180
summary: Werte über die Zeit – kalte Flows und ihre Operatoren, Kontext und Fehler, heiße StateFlows und SharedFlows, stateIn mit WhileSubscribed und sicheres Sammeln auf Android.
goals:
  - Du erklärst den Unterschied zwischen kalten und heißen Flows und sagst voraus, wann ein Flow-Block ausgeführt wird.
  - Du baust Pipelines mit `map`, `filter`, `debounce`, `distinctUntilChanged`, `combine` und `flatMapLatest` und behandelst Fehler mit `catch` und `retry`.
  - Du nutzt `flowOn` statt `withContext` im Flow und erklärst Kontexterhaltung.
  - Du modellierst UI-Zustand mit `StateFlow`, kennst Konflation und equals-basierte Deduplizierung und vermeidest veränderliche Objekte im State.
  - Du wandelst kalte Flows mit `stateIn(…, WhileSubscribed(5_000), …)` in UI-Zustand um und sammelst sie lebenszyklusbewusst mit `repeatOnLifecycle` oder `collectAsStateWithLifecycle`.
