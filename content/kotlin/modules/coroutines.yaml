id: coroutines
title: Coroutines
level: 2
minutes: 180
summary: Nebenläufigkeit ohne Callback-Chaos – suspend-Funktionen, Scopes, launch und async, Structured Concurrency, kooperative Cancellation, Dispatcher und Fehlerbehandlung, so wie sie in Android-Apps eingesetzt werden.
goals:
  - Du erklärst, was `suspend` bedeutet und was es **nicht** bedeutet (kein Threadwechsel, kein Hintergrund).
  - Du startest Coroutines mit `launch` und `async` in einem passenden Scope und sagst die Ausführungsreihenfolge voraus.
  - Du erklärst Structured Concurrency und nutzt `coroutineScope` und `supervisorScope` bewusst.
  - Du schreibst abbrechbaren Code mit `ensureActive`, `finally` und `NonCancellable` und verschluckst nie eine `CancellationException`.
  - Du wählst den richtigen Dispatcher, machst Funktionen mit `withContext` main-safe und erkennst typische Fehler wie `GlobalScope` oder blockierende Aufrufe.
