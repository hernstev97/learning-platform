projects:
- id: gedanken-editor
  title: Gedanken-Editor mit Compose
  level: 1
  hours: 6
  summary: Ein kleiner Editor mit kontrolliertem Zustand, Validierung und Wiederherstellung.
  capstone: false
  brief: |-
    Du baust eine lokale Übungs-App für das Erfassen eines Gedankens. Sie zeigt einen Entwurf, eine Zeichenzahl und den zuletzt übernommenen Text. Die Übernahme ist eine lokale Demonstration und keine Datenbankpersistenz.

    Leere Eingaben dürfen nicht übernommen werden. Ein gespeicherter Demo-Zustand und der aktuelle Entwurf müssen klar unterscheidbar sein. Verwende Compose Material 3 und keine Netzwerkabfragen. Halte die Darstellung unabhängig vom Besitzer des Zustands.
  skills:
  - Compose
  - State Hoisting
  - rememberSaveable
  - Semantik
  steps:
  - id: schritt-1
    title: Vertrag und Zustände festlegen
    detail: Skizziere leer, ausgefüllt und übernommen. Lege fest, wann die Eingabe geleert wird.
  - id: schritt-2
    title: Zustandslose Darstellung bauen
    detail: Übergib Entwurf und Callbacks. Nutze eine zentrale Quelle statt doppelter lokaler Kopien.
  - id: schritt-3
    title: Besitzer und Validierung ergänzen
    detail: Lass den Besitzer trimmen und übernehmen. Der Button darf bei reinem Leerraum nicht auslösen.
  - id: schritt-4
    title: Wiederherstellung prüfen
    detail: Verwende geeigneten Saved State und teste Drehung mit noch nicht übernommenem Entwurf.
  - id: schritt-5
    title: Bedienbarkeit und Nachweis
    detail: Prüfe TalkBack-Beschriftung, große Schrift und Tastatur. Dokumentiere zwei reproduzierbare UI-Tests.
  acceptance:
  - id: abnahme-1
    text: Leerraum allein deaktiviert die Übernahme.
  - id: abnahme-2
    text: Der Entwurf übersteht die getestete Activity-Neuerzeugung.
  - id: abnahme-3
    text: Eine Preview zeigt leeren und gefüllten Zustand.
  - id: abnahme-4
    text: UI-Tests prüfen Callback und sichtbares Ergebnis.
  stretch:
  - Eigener Saver für mehrere kleine Eingabefelder.
  - Zurücksetzen mit Bestätigung nur bei ungespeichertem Inhalt.
  portfolio: Zeige einen kurzen Ablauf und den Datenfluss zwischen Besitzer und Darstellung. Erkläre im Gespräch,
    welche Wiederherstellung geprüft wurde und warum das keine dauerhafte Speicherung ist.
- id: lokale-leseliste
  title: Lokale Leseliste mit Room und Flow
  level: 1
  hours: 10
  summary: Datensätze offline anlegen, filtern und ändern – mit Room als Datenquelle.
  capstone: false
  brief: |-
    Eine kleine persönliche Leseliste speichert Titel, Autor und Status lokal. Du kannst hinzufügen, als gelesen markieren und nach Status filtern. Es gibt keine Anmeldung und kein Netzwerk.

    Room ist die maßgebliche Datenquelle. Die UI liest einen vom ViewModel bereitgestellten Zustand; Schreibaktionen laufen über ein Repository. Fehler dürfen einen noch nicht übernommenen Entwurf nicht löschen.
  skills:
  - Room
  - DAO
  - Flow
  - ViewModel
  - Repository
  steps:
  - id: schritt-1
    title: Datenmodell anlegen
    detail: Definiere stabile IDs und gültige Statuswerte. Lege sinnvolle Leer- und Fehlerzustände fest.
  - id: schritt-2
    title: DAO und Datenbank prüfen
    detail: Schreibe Einfügen, Ändern und beobachtbare Abfrage. Teste das DAO mit einer isolierten Datenbank.
  - id: schritt-3
    title: Repository bereitstellen
    detail: Expose Flow für Änderungen und suspend-Funktionen für Aktionen. Vermeide eine zweite maßgebliche In-Memory-Liste.
  - id: schritt-4
    title: UI verbinden
    detail: Nutze lifecyclebewusste Sammlung und einen zustandslosen Screen. Leite Filter und Leerzustand nachvollziehbar
      ab.
  - id: schritt-5
    title: Persistenz und Fehler testen
    detail: Beende die App und starte neu. Prüfe leere Titel, Statuswechsel und Fehler ohne Eingabeverlust.
  - id: schritt-6
    title: Anleitung erstellen
    detail: Dokumentiere Schema, Datenfluss, Testbefehle und den offline ausführbaren Nutzerpfad.
  acceptance:
  - id: abnahme-1
    text: Einträge bleiben nach Neustart vorhanden.
  - id: abnahme-2
    text: Statusfilter aktualisiert sich nach Änderungen.
  - id: abnahme-3
    text: DAO- und ViewModel-Tests prüfen mindestens einen Fehlerpfad.
  - id: abnahme-4
    text: Die UI verwendet keine eigenständige zweite Datenquelle.
  stretch:
  - Ein einfaches Schema-Upgrade mit Migrationstest.
  - Export in ein vom Nutzer gewähltes Dokument.
  portfolio: Zeige die App im Flugmodus und den Weg einer Änderung bis zur neuen Liste. Begründe, warum Room beobachtet
    wird statt nach jedem Klick mehrere UI-Variablen manuell anzupassen.
- id: katalog-suche
  title: Katalogsuche mit sauberer Fehlerbehandlung
  level: 2
  hours: 18
  summary: Eine öffentliche Such-API anbinden und ein robustes Listen-Detail-Erlebnis bauen.
  capstone: false
  brief: |-
    Baue eine Android-Suche für Bücher über die [Open Library Search API](https://openlibrary.org/dev/docs/api/search). Nutze kleine Ergebnislimits und beachte die dokumentierten Nutzungsregeln. DTOs sind von deinem App-Modell getrennt.

    Der Ablauf umfasst Suchtext, Suchauslösung, Ladezustand, Trefferliste, leeres Ergebnis und Fehler mit Wiederholung. Ein Detailziel erhält nur die Buch-ID. Tests verwenden feste Fake-Antworten und sind nicht von der öffentlichen API abhängig.
  skills:
  - Retrofit oder Ktor
  - DTO-Mapping
  - Coroutines
  - Navigation
  - Tests
  steps:
  - id: schritt-1
    title: API-Vertrag reduzieren
    detail: Wähle nur ID, Titel und Autor. Lege den Umgang mit fehlenden Feldern fest.
  - id: schritt-2
    title: Datenquelle isolieren
    detail: Stelle die HTTP-Grenze hinter eine kleine Schnittstelle. Verwende Timeout und verständliche Fehlerarten.
  - id: schritt-3
    title: Suchzustand modellieren
    detail: Definiere Idle, Loading, Empty, Ready und Error. Verhindere, dass alte Ergebnisse eine neuere Suche
      überschreiben.
  - id: schritt-4
    title: Liste und Detail verdrahten
    detail: Nutze typisierte ID-Routen und unabhängige Screen-Composables. Prüfe Zurück und nicht gefundene Datensätze.
  - id: schritt-5
    title: Fehlerpfade automatisieren
    detail: Teste Transportfehler, leere Antwort und unvollständiges DTO mit Fakes. Prüfe Wiederholung ohne doppelte
      laufende Arbeit.
  - id: schritt-6
    title: Geräteprüfung und Dokumentation
    detail: Teste schmale Breite, große Schrift und langsames Netz. Dokumentiere, welche Daten ohne Verbindung verfügbar
      sind.
  acceptance:
  - id: abnahme-1
    text: Eine neue Suche verdrängt veraltete Ergebnisse kontrolliert.
  - id: abnahme-2
    text: Lade-, Leer- und Fehlerzustände sind bedienbar.
  - id: abnahme-3
    text: Ein Detailziel wird mit einer ID geöffnet.
  - id: abnahme-4
    text: Die automatisierten Tests benötigen kein Internet.
  - id: abnahme-5
    text: Ein API-Ausfall führt nicht zu einer unbehandelten Exception.
  stretch:
  - Pagination mit explizitem Ende und Wiederholung.
  - Temporärer Suchcache mit dokumentierter Gültigkeit.
  portfolio: Präsentiere zuerst den normalen Pfad und danach einen simulierten Ausfall. Erläutere Mapping und Cancellation
    anhand eines konkreten Suchwechsels.
- id: abschluss-leseliste
  title: 'Abschlussprojekt: Offline-Leseliste für ein Bibliotheksteam'
  level: 3
  hours: 60
  summary: Eine auslieferbare Android-App mit lokalem Bestand, öffentlichem Katalog, überprüfbarem Offline-Verhalten und einem Release wie im Team.
  capstone: true
  brief: |-
    Auftrag: Ein kleines Bibliotheksteam möchte Bücher für eine kommende Veranstaltung sammeln. Die Mitarbeitenden suchen im öffentlichen Katalog, übernehmen Treffer in eine lokale Liste und ergänzen private Notizen sowie den Bearbeitungsstatus. Während der Veranstaltung ist das Netz unzuverlässig.

    Baue eine Compose-App mit Room als Single Source of Truth, ViewModel/UDF, Repository und Hilt. Nutze die [Open Library Search API](https://openlibrary.org/dev/docs/api/search) ausschließlich zum Lesen. Private Notizen und Status bleiben lokal und werden nicht an den öffentlichen Katalog gesendet. WorkManager aktualisiert bei verfügbarer Verbindung die übernommenen Katalogmetadaten; exakte Ausführungszeiten werden nicht versprochen.

    Pflichtabläufe: Suchen und übernehmen, lokale Liste filtern, Detail bearbeiten, App ohne Netz neu starten, fehlgeschlagenes Aktualisieren erkennen und erneut anstoßen. Ein Katalog-Refresh darf keine lokale Notiz überschreiben. Verwende eine aktuelle stabile Toolchain und dokumentiere die tatsächlich eingesetzten Versionen.

    Das Team will die App wie ein echtes Produkt betreiben: getrennte Module mit gemeinsamer Build-Logik, eine Testversion neben der echten, ein optimierter Release mit gemessener Startzeit, eine CI, die schlechten Code aufhält, und ein Upload in den internen Test-Track von Google Play. Die Suche lädt Treffer seitenweise. Für den Upload brauchst du ein Konto in der Play Console.
  skills:
  - Compose
  - Navigation
  - Room
  - StateFlow
  - MVVM/UDF
  - Hilt
  - WorkManager
  - Testing
  - Release
  - Modularisierung
  - Paging
  - Baseline Profiles
  steps:
  - id: schritt-1
    title: Abnahmefälle und Datenfluss festlegen
    detail: Schreibe die Pflichtabläufe als Given/When/Then. Zeichne UI, ViewModel, Repository, Room und Katalogquelle
      mit Leserichtung.
  - id: schritt-2
    title: Schema und Datenhoheit entwerfen
    detail: Trenne externe Metadaten von lokalen Notizen. Verwende stabile Katalog-IDs und entscheide die Duplikatregel
      beim Übernehmen.
  - id: module-schneiden
    title: Module und Build-Logik anlegen
    detail: Lege mindestens `:app`, zwei Feature-Module und `:core:data` sowie `:core:model` an. Schreibe Convention Plugins
      in `build-logic` für Android-Bibliothek, Compose und Hilt. Prüfe, dass kein Feature an einem anderen hängt.
  - id: schritt-3
    title: Lokalen vertikalen Pfad bauen
    detail: Implementiere zunächst Liste, Detail und Statusänderung ohne Netzwerk. Belege die Persistenz nach Neustart.
  - id: schritt-4
    title: Katalogquelle anbinden
    detail: Mappe ein kleines DTO-Modell und klassifiziere Transport-, HTTP- und Datenfehler. Tests laufen gegen
      Fakes.
  - id: schritt-5
    title: Suche und Übernahme integrieren
    detail: Lade Suchtreffer seitenweise mit Paging 3 und einer festen Seitengröße. Übernehme Ergebnisse transaktional in
      Room. Die sichtbare Liste kommt danach aus der lokalen Quelle.
  - id: schritt-6
    title: Metadaten-Aktualisierung ergänzen
    detail: Nutze eindeutige WorkManager-Arbeit mit Netzwerk-Constraint. Definiere Retry, letzten erfolgreichen
      Stand und unveränderte lokale Notizen.
  - id: schritt-7
    title: Navigation und Zustände abschließen
    detail: Prüfe IDs, Zurück, Lade-/Leer-/Fehlerbilder, Entwürfe und Activity-Neuerzeugung. Fehlende Einträge brauchen
      einen Rückweg.
  - id: schritt-8
    title: Automatisierte Tests schreiben
    detail: Decke Parser/Mapping, DAO, ViewModel und die wichtigsten Compose-Flows ab. Prüfe explizit Refresh ohne
      Notizverlust.
  - id: startzeit-belegen
    title: Release optimieren und Startzeit belegen
    detail: Aktiviere R8 im Release und prüfe die Kernabläufe im Release-Build auf einem Gerät. Erzeuge ein Baseline Profile
      für Start und Suche und miss mit einem Macrobenchmark `CompilationMode.None()` gegen `Partial(BaselineProfileMode.Require)`.
  - id: schritt-9
    title: CI und Release vorbereiten
    detail: Lege die Flavors `staging` und `prod` an. Lasse Tests, Android Lint und einen statischen Kotlin-Check in GitHub
      Actions laufen und mach sie zur Bedingung für den Merge. Erzeuge ein signiertes App Bundle über geschützte Secrets
      und lade es in den internen Test-Track; niemals Schlüssel committen.
  - id: schritt-10
    title: Geräteabnahme und Übergabe
    detail: Prüfe Flugmodus-Neustart, langsames Netz und große Schrift. Ergänze README, Architekturdiagramm, Demo,
      Installation und bekannte Grenzen.
  acceptance:
  - id: abnahme-1
    text: Ein zuvor übernommenes Buch lässt sich nach App-Neustart im Flugmodus lesen und bearbeiten.
  - id: abnahme-2
    text: Metadaten-Refresh verändert keine lokale Notiz und erzeugt keine Duplikate.
  - id: abnahme-3
    text: Fehler, leere Suche und laufende Aktualisierung haben bedienbare UI-Zustände.
  - id: abnahme-4
    text: Unit-, DAO-, ViewModel- und Compose-Tests laufen in CI ohne öffentliche API-Abhängigkeit.
  - id: abnahme-5
    text: Ein signiertes Release lässt sich auf einem Testgerät installieren; Schlüssel und Tokens fehlen im Repository.
  - id: abnahme-6
    text: Navigation und Entwurfswiederherstellung sind auf einem Gerät oder Emulator geprüft.
  - id: abnahme-7
    text: README dokumentiert Architektur, Versionen, API-Nutzung, Installation und Grenzen des Background-Sync.
  - id: abnahme-8
    text: TalkBack-Beschriftungen und große Schrift sind im Kernablauf überprüft.
  - id: module-und-konventionen
    text: Die App besteht mindestens aus `:app`, zwei Feature-Modulen, `:core:data` und `:core:model`. Kein Feature hängt
      an einem anderen, Implementierungen in `:core:data` sind `internal`, und gemeinsame Build-Einstellungen kommen aus
      Convention Plugins in `build-logic`.
  - id: flavors-staging-prod
    text: Die Flavors `staging` und `prod` unterscheiden mindestens Basis-URL und App-Namen, und die staging-Variante lässt
      sich neben der prod-Variante installieren.
  - id: r8-release
    text: Der Release-Build läuft mit R8. Die Kernabläufe sind im Release-Build auf einem Gerät geprüft, nötige Keep-Regeln
      sind begründet, und die `mapping.txt` jeder hochgeladenen Version ist aufbewahrt.
  - id: baseline-profile-gemessen
    text: Ein Baseline Profile für Start und Suche liegt im Repository. Ein Macrobenchmark mit zehn Iterationen auf einem
      echten Gerät vergleicht `CompilationMode.None()` mit `Partial(BaselineProfileMode.Require)`; beide Mediane der
      Startzeit stehen im README.
  - id: ci-qualitaetstor
    text: Die CI führt bei jedem Pull Request Unit-Tests, Android Lint und einen statischen Kotlin-Check (detekt oder ktlint)
      aus. Ein Befund blockiert den Merge; bewusste Ausnahmen stehen in einer eingecheckten Baseline-Datei.
  - id: internal-track
    text: Ein signiertes App Bundle der Variante `prodRelease` ist im internen Test-Track der Play Console verfügbar,
      hochgeladen aus der CI oder mit nachvollziehbaren Schritten im README.
  stretch:
  - Export der lokalen Liste über Androids Dokumentauswahl.
  - Migrationstest für ein zweites Schema.
  - Adaptives Zweispaltenlayout, nachdem der Kernpfad abgenommen ist.
  - Lokale Liste mit `RemoteMediator` aus Paging 3, wenn der Katalog große Ergebnislisten liefert.
  - Crash-Reporting mit einem eigenen Endpunkt oder Crashlytics, ohne Notizen oder persönliche Daten.
  portfolio: |-
    GitHub-Präsentation: Füge eine kurze Demo, Architekturdiagramm, synthetische Beispieldaten und CI-Nachweis hinzu. Erkläre in fünf Minuten den Offline-Ablauf und zeige einen fehlgeschlagenen Refresh.

    Im Gespräch begründest du Datenhoheit, Retry-Grenzen, Testauswahl und den Modulschnitt und zeigst die gemessene Startzeit mit und ohne Baseline Profile. Stelle nachvollziehbar dar, welche Teile du selbst entworfen und welche du mit Unterstützung erstellt hast. Lege keine realen Teamnotizen oder Signing-Geheimnisse bei.
