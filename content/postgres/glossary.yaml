terms:
  - term: ACID
    definition: >-
      Die vier Garantien einer Transaktion: Atomarität (alles oder nichts), Konsistenz (Constraints gelten
      danach wieder), Isolation (gleichzeitige Transaktionen stören sich nur so weit, wie die
      [Isolationsstufe](https://www.postgresql.org/docs/current/transaction-iso.html) erlaubt) und
      Dauerhaftigkeit (nach `COMMIT` übersteht die Änderung einen Absturz, dank Write-Ahead-Log).
  - term: Advisory Lock
    definition: >-
      Eine Sperre auf eine frei gewählte Zahl statt auf eine Zeile, etwa `pg_advisory_xact_lock(hashtext('monatsabrechnung'))`.
      PostgreSQL kennt ihre Bedeutung nicht; die Anwendung nutzt sie, um zum Beispiel einen Cronjob nur einmal
      gleichzeitig laufen zu lassen. [Advisory Locks](https://www.postgresql.org/docs/current/explicit-locking.html#ADVISORY-LOCKS)
  - term: Autovacuum
    definition: >-
      Hintergrundprozess, der `VACUUM` und `ANALYZE` automatisch startet, sobald genug Zeilen geändert wurden.
      Er räumt tote Zeilenversionen ab und hält die Statistik aktuell; abschalten verursacht Bloat und
      schlechte Pläne. [Autovacuum](https://www.postgresql.org/docs/current/routine-vacuuming.html#AUTOVACUUM)
  - term: B-Baum
    definition: >-
      Der Standard-Indextyp (B-Tree): sortierte Schlüssel in einem flachen Baum, Suche in logarithmischer Zeit.
      Er unterstützt `=`, `<`, `>`, Bereiche, `ORDER BY` und `LIKE 'präfix%'`, Letzteres nur bei der Sortierung `C`
      oder mit der Operatorklasse `text_pattern_ops`.
      [B-Tree](https://www.postgresql.org/docs/current/indexes-types.html#INDEXES-TYPES-BTREE)
  - term: Bloat
    definition: >-
      Platz in Tabellen und Indexen, der von toten Zeilenversionen belegt ist. Entsteht durch viele `UPDATE`
      und `DELETE`, wenn `VACUUM` nicht hinterherkommt oder eine lange offene Transaktion das Aufräumen
      verhindert. [Recovering Disk Space](https://www.postgresql.org/docs/current/routine-vacuuming.html#VACUUM-FOR-SPACE-RECOVERY)
  - term: Connection Pool
    definition: >-
      Eine Menge offener Datenbankverbindungen, die sich Anfragen teilen, weil jede PostgreSQL-Verbindung
      ein eigener Prozess ist. In der App etwa der Pool von SQLAlchemy (`pool_size`), davor oft PgBouncer.
      Verbindungen, die nicht zurückgegeben werden, erschöpfen ihn.
  - term: Covering Index
    definition: >-
      Ein Index, der alle Spalten einer Abfrage enthält, oft mit `INCLUDE` als Nutzlast:
      `CREATE INDEX ON buchungen (mitglied_id, beginn) INCLUDE (preis)`. Mit ihm sind Index-Only Scans möglich.
  - term: CTE
    definition: >-
      Common Table Expression, eine benannte Teilabfrage mit `WITH name AS (…)`. Seit PostgreSQL 12 werden
      CTEs, die nur einmal genutzt werden, in die Hauptabfrage eingebettet; `MATERIALIZED` erzwingt die getrennte
      Auswertung. [WITH Queries](https://www.postgresql.org/docs/current/queries-with.html)
  - term: Deadlock
    definition: >-
      Zwei Transaktionen warten gegenseitig auf eine Sperre der anderen. PostgreSQL erkennt das nach
      `deadlock_timeout` und bricht eine mit SQLSTATE `40P01` ab. Vorbeugen: Zeilen immer in derselben
      Reihenfolge sperren. [Deadlocks](https://www.postgresql.org/docs/current/explicit-locking.html#LOCKING-DEADLOCKS)
  - term: DEFERRABLE
    definition: >-
      Eigenschaft eines Constraints, dessen Prüfung mit `INITIALLY DEFERRED` oder `SET CONSTRAINTS` bis zum
      `COMMIT` aufgeschoben werden kann, etwa wenn zwei Zeilen kurzzeitig dieselbe Position haben. Nur
      `UNIQUE`, `PRIMARY KEY`, `EXCLUDE` und Fremdschlüssel. [SET CONSTRAINTS](https://www.postgresql.org/docs/current/sql-set-constraints.html)
  - term: DISTINCT ON
    definition: >-
      PostgreSQL-Erweiterung, die je Wert der Klammerausdrücke die erste Zeile nach `ORDER BY` behält, etwa die
      letzte Buchung je Mitglied. Das `ORDER BY` muss mit denselben Ausdrücken beginnen.
      [DISTINCT-Klausel](https://www.postgresql.org/docs/current/sql-select.html#SQL-DISTINCT)
  - term: Dreiwertige Logik
    definition: >-
      In SQL ist ein Vergleich wahr, falsch oder unbekannt (`NULL`). `WHERE` behält nur wahre Zeilen, `CHECK`
      verwirft nur falsche. Deshalb findet `preis = NULL` nichts und `CHECK (preis > 0)` lässt `NULL` durch.
  - term: Exclusion Constraint
    definition: >-
      Constraint, der verbietet, dass zwei Zeilen bei allen angegebenen Operatoren zutreffen, etwa
      `EXCLUDE USING gist (raum_id WITH =, zeitraum WITH &&)` gegen Doppelbuchungen. Für `=` auf `int` braucht
      GiST die Erweiterung `btree_gist`; Verstöße melden SQLSTATE `23P01`.
      [Exclusion Constraints](https://www.postgresql.org/docs/current/ddl-constraints.html#DDL-CONSTRAINTS-EXCLUSION)
  - term: Expand and Contract
    definition: >-
      Muster für Schemaänderungen ohne Ausfall (auch *Parallel Change*): neue Struktur hinzufügen, doppelt
      schreiben, Daten nachziehen, Lesezugriffe umstellen, alte Struktur entfernen – verteilt auf mehrere
      Deployments, damit alte und neue App-Version gleichzeitig laufen können.
      [Martin Fowler: ParallelChange](https://martinfowler.com/bliki/ParallelChange.html)
  - term: EXPLAIN ANALYZE
    definition: >-
      Führt eine Anweisung aus und zeigt den Plan mit echten Zeilenzahlen, Schleifen und Zeiten neben den
      Schätzungen; seit PostgreSQL 18 auch mit Buffers. Bei `INSERT`, `UPDATE` oder `DELETE` in `BEGIN` …
      `ROLLBACK` einpacken. [EXPLAIN ANALYZE](https://www.postgresql.org/docs/current/using-explain.html#USING-EXPLAIN-ANALYZE)
  - term: Fremdschlüssel
    definition: >-
      Spalte, deren Werte in einer anderen Tabelle als Schlüssel vorkommen müssen (`REFERENCES`). PostgreSQL legt
      dafür auf der verweisenden Seite keinen Index an; den braucht man meist selbst.
      [Foreign Keys](https://www.postgresql.org/docs/current/ddl-constraints.html#DDL-CONSTRAINTS-FK)
  - term: Generierte Spalte
    definition: >-
      Spalte, deren Wert aus anderen Spalten derselben Zeile berechnet wird: `GENERATED ALWAYS AS (…)`.
      Seit PostgreSQL 18 ist `VIRTUAL` (beim Lesen berechnet) der Standard; `STORED` speichert den Wert und
      lässt sich indizieren. [Generated Columns](https://www.postgresql.org/docs/current/ddl-generated-columns.html)
  - term: GIN
    definition: >-
      Generalized Inverted Index: speichert je Element (JSON-Schlüssel, Array-Wert, Wort, Trigramm), in welchen
      Zeilen es vorkommt. Index der Wahl für `jsonb @>`, Arrays, Volltextsuche und `pg_trgm`.
      [GIN](https://www.postgresql.org/docs/current/indexes-types.html#INDEXES-TYPES-GIN)
  - term: GiST
    definition: >-
      Generalized Search Tree: Index-Infrastruktur für Daten, die sich überlappen können, etwa Ranges und
      Geometrien. Grundlage von Exclusion Constraints gegen überlappende Zeiträume.
      [GiST](https://www.postgresql.org/docs/current/indexes-types.html#INDEXES-TYPE-GIST)
  - term: Hash Join
    definition: >-
      Join-Algorithmus: baut aus der kleineren Seite eine Hashtabelle im Speicher (`work_mem`) und prüft jede
      Zeile der größeren Seite dagegen. Gut für große, ungeordnete Mengen mit Gleichheitsbedingung.
  - term: HOT-Update
    definition: >-
      Heap-Only Tuple: Ändert ein `UPDATE` keine indizierte Spalte und passt die neue Version auf dieselbe
      Seite, braucht kein Index einen neuen Eintrag. Jeder zusätzliche Index auf einer oft geänderten Spalte
      verhindert solche Updates. [Heap-Only Tuples](https://www.postgresql.org/docs/current/storage-hot.html)
  - term: Identity-Spalte
    definition: >-
      Ganzzahlspalte mit eigener Sequenz nach SQL-Standard: `GENERATED ALWAYS AS IDENTITY` lehnt eigene Werte
      ab, `BY DEFAULT` erlaubt sie. Ersetzt das ältere `serial`.
      [Identity Columns](https://www.postgresql.org/docs/current/ddl-identity-columns.html)
  - term: Idle in Transaction
    definition: >-
      Zustand einer Verbindung, die eine Transaktion geöffnet hat, aber nichts tut – etwa weil die App
      zwischendurch eine HTTP-Anfrage stellt. Sie hält Sperren und blockiert das Aufräumen durch `VACUUM`;
      `idle_in_transaction_session_timeout` beendet sie.
  - term: Index-Only Scan
    definition: >-
      Scan, der die Antwort allein aus dem Index liefert, weil alle benötigten Spalten darin stehen und die
      Visibility Map die Seiten als sichtbar markiert. `Heap Fetches` im Plan zeigt, wie oft doch der Heap
      gelesen wurde. [Index-Only Scans](https://www.postgresql.org/docs/current/indexes-index-only-scans.html)
  - term: Isolationsstufe
    definition: >-
      Legt fest, welche Änderungen gleichzeitiger Transaktionen eine Transaktion sieht. PostgreSQL bietet Read
      Committed (Standard), Repeatable Read und Serializable; Dirty Reads gibt es auf keiner Stufe.
      [Transaction Isolation](https://www.postgresql.org/docs/current/transaction-iso.html)
  - term: JSONB
    definition: >-
      Binär gespeichertes JSON: Schlüssel sortiert und ohne Duplikate, mit Operatoren wie `->`, `->>`, `@>` und
      GIN-Indexen. Gut für flexible Zusatzdaten; Spalten bleiben besser für alles, wonach gefiltert,
      gejoint oder was mit Constraints geprüft wird. [JSON Types](https://www.postgresql.org/docs/current/datatype-json.html)
  - term: Keyset-Paginierung
    definition: >-
      Blättern über den Schlüssel der letzten Zeile statt über `OFFSET`: `WHERE (beginn, id) > ($1, $2)
      ORDER BY beginn, id LIMIT 20`. Jede Seite ist mit passendem Index gleich schnell, und neue Zeilen
      verschieben nichts. [Use The Index, Luke: No Offset](https://use-the-index-luke.com/no-offset)
  - term: LATERAL
    definition: >-
      Erlaubt einer Unterabfrage im `FROM`, auf Spalten der Tabellen links davon zuzugreifen. Typisch für
      Top-N je Gruppe, etwa die drei letzten Buchungen je Mitglied.
      [LATERAL Subqueries](https://www.postgresql.org/docs/current/queries-table-expressions.html#QUERIES-LATERAL)
  - term: Lock-Warteschlange
    definition: >-
      Sperranfragen werden der Reihe nach bedient. Wartet ein `ALTER TABLE` auf `ACCESS EXCLUSIVE`, weil eine
      lange Abfrage läuft, müssen alle späteren Abfragen auf diese Tabelle hinter ihm warten. Deshalb setzt
      jede Migration `lock_timeout`.
  - term: lock_timeout
    definition: >-
      Höchstzeit, die eine Anweisung auf eine Sperre wartet, bevor sie mit SQLSTATE `55P03` abbricht. In
      Migrationen ein paar Sekunden, damit eine wartende DDL nicht den Betrieb blockiert.
      [lock_timeout](https://www.postgresql.org/docs/current/runtime-config-client.html#GUC-LOCK-TIMEOUT)
  - term: Lost Update
    definition: >-
      Zwei Transaktionen lesen denselben Wert, rechnen in der App und schreiben zurück; die zweite überschreibt
      die erste. Abhilfe: atomares `UPDATE … SET x = x + 1`, `SELECT … FOR UPDATE` oder optimistisches Locking.
  - term: Materialisierte Sicht
    definition: >-
      Eine Sicht, deren Ergebnis gespeichert und mit `REFRESH MATERIALIZED VIEW` neu berechnet wird. Mit
      `CONCURRENTLY` blockiert das Auffrischen keine Leser, braucht aber einen Unique-Index auf der Sicht.
      [Materialized Views](https://www.postgresql.org/docs/current/rules-materializedviews.html)
  - term: MERGE
    definition: >-
      Anweisung, die eine Quelle mit einer Zieltabelle abgleicht und je Fall einfügt, ändert oder löscht (seit
      PostgreSQL 15, mit `RETURNING` seit 17). Für ein einfaches Upsert unter Last bleibt `ON CONFLICT` die
      robustere Wahl. [MERGE](https://www.postgresql.org/docs/current/sql-merge.html)
  - term: MVCC
    definition: >-
      Multiversion Concurrency Control: Ein `UPDATE` schreibt eine neue Zeilenversion, die alte bleibt für
      laufende Transaktionen sichtbar. Leser blockieren deshalb keine Schreiber und umgekehrt; die Spalten
      `xmin` und `xmax` zeigen, welche Transaktion eine Version angelegt bzw. beendet hat.
      [MVCC](https://www.postgresql.org/docs/current/mvcc-intro.html)
  - term: N+1-Problem
    definition: >-
      Eine Abfrage lädt N Objekte, danach löst jedes beim Zugriff auf eine Beziehung eine eigene Abfrage aus –
      N+1 Rundreisen statt einer oder zwei. Typisch für Lazy Loading im ORM; behoben mit `selectinload`,
      `joinedload` oder Prismas `include`.
  - term: Nested Loop
    definition: >-
      Join-Algorithmus: für jede Zeile der äußeren Seite wird die innere durchsucht, idealerweise per Index.
      Schnell bei wenigen äußeren Zeilen, teuer, wenn der Planer deren Zahl stark unterschätzt.
  - term: Normalform
    definition: >-
      Regeln gegen Redundanz: 1NF verlangt atomare Werte ohne Wiederholungsgruppen, 2NF keine Abhängigkeit von
      einem Teil eines zusammengesetzten Schlüssels, 3NF keine Abhängigkeit zwischen Nicht-Schlüsselspalten.
      Ziel ist, dass jede Tatsache an genau einer Stelle steht.
  - term: NOT VALID
    definition: >-
      Option für `CHECK`, Fremdschlüssel und seit PostgreSQL 18 `NOT NULL`: Der Constraint gilt sofort für neue
      Zeilen, bestehende werden erst mit `VALIDATE CONSTRAINT` unter einer schwächeren Sperre geprüft.
      [VALIDATE CONSTRAINT](https://www.postgresql.org/docs/current/sql-altertable.html#SQL-ALTERTABLE-DESC-VALIDATE-CONSTRAINT)
  - term: Optimistisches Locking
    definition: >-
      Statt zu sperren, trägt jede Zeile eine `version`. Das `UPDATE` verlangt die gelesene Version
      (`WHERE id = $1 AND version = $2`) und erhöht sie; trifft es 0 Zeilen, hat jemand anderes zwischendurch
      geändert, und die App meldet einen Konflikt.
  - term: Partieller Index
    definition: >-
      Index nur über die Zeilen, die eine Bedingung erfüllen, etwa `WHERE status = 'bestaetigt'`. Kleiner und
      schneller; als Unique-Index erzwingt er Eindeutigkeit nur in dieser Teilmenge, etwa bei Soft Delete.
      [Partial Indexes](https://www.postgresql.org/docs/current/indexes-partial.html)
  - term: Partitionierung
    definition: >-
      Eine große Tabelle wird in Teiltabellen aufgeteilt, etwa `checkins` je Monat. Abfragen mit passender
      Bedingung lesen nur die nötigen Partitionen, alte Daten lassen sich per `DETACH` und `DROP` entfernen.
      [Table Partitioning](https://www.postgresql.org/docs/current/ddl-partitioning.html)
  - term: PgBouncer
    definition: >-
      Leichtgewichtiger Verbindungs-Pooler vor PostgreSQL. Im Transaction Mode bekommt ein Client eine
      Serververbindung nur für die Dauer einer Transaktion; Sitzungszustand wie `SET`, Session-Advisory-Locks
      oder `LISTEN` gilt dann nicht verlässlich. [PgBouncer Features](https://www.pgbouncer.org/features.html)
  - term: Prepared Statement
    definition: >-
      Eine Anweisung mit Platzhaltern (`$1`), die der Server einmal plant und mit verschiedenen Werten ausführt.
      Werte werden getrennt vom SQL-Text übertragen, was SQL-Injection verhindert.
      [PREPARE](https://www.postgresql.org/docs/current/sql-prepare.html)
  - term: Query-Plan
    definition: >-
      Der Ausführungsplan, den der Planer aus vielen Möglichkeiten nach geschätzten Kosten wählt: Scan-Arten,
      Join-Reihenfolge und -Algorithmen. `EXPLAIN` zeigt ihn als Baum, der von innen nach außen ausgeführt wird.
  - term: Range-Typ
    definition: >-
      Datentyp für einen Bereich, etwa `tstzrange` oder `daterange`, standardmäßig halboffen `[)`. Operatoren
      wie `&&` (überlappt) und `@>` (enthält) machen Zeitraumlogik kurz und indizierbar.
      [Range Types](https://www.postgresql.org/docs/current/rangetypes.html)
  - term: RETURNING
    definition: >-
      Liefert aus `INSERT`, `UPDATE`, `DELETE` oder `MERGE` die betroffenen Zeilen zurück, etwa die neue `id`.
      Seit PostgreSQL 18 auch alte und neue Werte mit `old.` und `new.`.
      [Returning Data](https://www.postgresql.org/docs/current/dml-returning.html)
  - term: Savepoint
    definition: >-
      Markierung innerhalb einer Transaktion, zu der `ROLLBACK TO SAVEPOINT` zurückkehrt, ohne die ganze
      Transaktion zu verlieren. ORMs nutzen sie für verschachtelte Transaktionen, etwa SQLAlchemys
      `begin_nested()`. [SAVEPOINT](https://www.postgresql.org/docs/current/sql-savepoint.html)
  - term: Serialisierungsfehler
    definition: >-
      SQLSTATE `40001`: Unter Repeatable Read oder Serializable bricht PostgreSQL eine Transaktion ab, deren
      Ergebnis nicht zu einer seriellen Ausführung passen würde. Die App wiederholt dann die ganze
      Transaktion. [Serializable](https://www.postgresql.org/docs/current/transaction-iso.html#XACT-SERIALIZABLE)
  - term: SKIP LOCKED
    definition: >-
      Zusatz zu `SELECT … FOR UPDATE`, der gesperrte Zeilen überspringt statt zu warten. Damit holen sich
      mehrere Worker verschiedene Jobs aus derselben Tabelle.
      [Locking-Klausel](https://www.postgresql.org/docs/current/sql-select.html#SQL-FOR-UPDATE-SHARE)
  - term: Soft Delete
    definition: >-
      Zeilen werden nicht gelöscht, sondern mit `geloescht_am` markiert. Kostet Sorgfalt: Jede Abfrage braucht
      den Filter, Unique-Constraints werden zu partiellen Unique-Indexen, und Fremdschlüssel schützen nicht
      mehr vor Verweisen auf „gelöschte“ Zeilen.
  - term: SQL-Injection
    definition: >-
      Angriff, bei dem Eingaben als SQL-Code ausgeführt werden, weil sie per String-Verkettung in die Abfrage
      gelangen. Abhilfe ist Parameterbindung, nie Escapen von Hand.
      [OWASP Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html)
  - term: SQLSTATE
    definition: >-
      Fünfstelliger Fehlercode, den Treiber mitliefern, etwa `23505` (Unique verletzt) oder `40001`
      (Serialisierung). Die App reagiert auf den Code, nicht auf den Text der Meldung.
      [Error Codes](https://www.postgresql.org/docs/current/errcodes-appendix.html)
  - term: Statistik
    definition: >-
      Zusammenfassungen je Spalte (häufige Werte, Histogramm, Anzahl verschiedener Werte), die `ANALYZE`
      sammelt und der Planer für Schätzungen nutzt. Für abhängige Spalten gibt es erweiterte Statistiken mit
      `CREATE STATISTICS`. [Planner Statistics](https://www.postgresql.org/docs/current/planner-stats.html)
  - term: Surrogatschlüssel
    definition: >-
      Künstlicher Schlüssel ohne fachliche Bedeutung, etwa eine Identity-Spalte oder UUID. Er bleibt stabil,
      wenn sich fachliche Werte wie die E-Mail ändern; der natürliche Schlüssel bekommt trotzdem einen
      `UNIQUE`-Constraint.
  - term: timestamptz
    definition: >-
      `timestamp with time zone`: speichert einen Zeitpunkt in UTC und zeigt ihn in der Zeitzone der Sitzung
      an. Der richtige Typ für Ereignisse wie Buchungsbeginn; `timestamp` ohne Zone kennt keinen Zeitpunkt,
      nur eine Wanduhrzeit. [Time Zones](https://www.postgresql.org/docs/current/datatype-datetime.html#DATATYPE-TIMEZONES)
  - term: Transaktionales DDL
    definition: >-
      In PostgreSQL lassen sich `CREATE`, `ALTER` und `DROP` in einer Transaktion zurückrollen. Eine Migration
      läuft dadurch ganz oder gar nicht; Ausnahmen wie `CREATE INDEX CONCURRENTLY` laufen außerhalb.
  - term: Unit of Work
    definition: >-
      Muster, nach dem ein ORM Änderungen an Objekten sammelt und beim Flush gebündelt als SQL schickt. In
      SQLAlchemy ist die `Session` die Unit of Work.
      [Session Basics](https://docs.sqlalchemy.org/en/21/orm/session_basics.html)
  - term: Upsert
    definition: >-
      Einfügen oder, falls der Schlüssel schon existiert, ändern – in PostgreSQL mit
      `INSERT … ON CONFLICT (…) DO UPDATE SET … = EXCLUDED.…`. Atomar auch bei gleichzeitigen Aufrufen; das
      Konfliktziel braucht einen passenden Unique-Index. [ON CONFLICT](https://www.postgresql.org/docs/current/sql-insert.html#SQL-ON-CONFLICT)
  - term: VACUUM
    definition: >-
      Entfernt tote Zeilenversionen, macht ihren Platz wiederverwendbar und pflegt die Visibility Map für
      Index-Only Scans. `VACUUM FULL` schreibt die Tabelle neu und sperrt sie dabei vollständig.
      [Routine Vacuuming](https://www.postgresql.org/docs/current/routine-vacuuming.html)
  - term: Write Skew
    definition: >-
      Zwei Transaktionen lesen dieselben Daten, prüfen eine Regel und schreiben verschiedene Zeilen – jede für
      sich korrekt, zusammen verletzen sie die Regel, etwa zwei Buchungen, die beide „Raum frei“ gesehen haben.
      Repeatable Read verhindert das nicht; Serializable oder ein Constraint schon.
