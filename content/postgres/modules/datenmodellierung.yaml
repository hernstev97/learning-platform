id: datenmodellierung
title: Datenmodellierung
level: 2
minutes: 150
summary: Fachliche Anforderungen in ein PostgreSQL-Schema übersetzen – Kardinalitäten, Verbindungstabellen, Historie, Soft Delete, polymorphe Beziehungen, Geld, Wertelisten und Mandanten – so, dass die Datenbank die Regeln selbst durchsetzt.
goals:
  - Du leitest aus einer Anforderung Entitäten und Kardinalitäten ab und setzt 1:n, 1:1 und n:m mit Fremdschlüsseln, `UNIQUE` und Verbindungstabellen um.
  - Du modellierst Zustände, die sich über die Zeit ändern, als Historie mit `daterange` und verhinderst Überschneidungen mit `WITHOUT OVERLAPS`.
  - Du wägst Soft Delete gegen echtes Löschen ab und hältst E-Mail-Adressen trotzdem eindeutig, mit einem partiellen Unique-Index.
  - Du ersetzt polymorphe Assoziationen durch Modelle mit echten Fremdschlüsseln und begründest, wann Spalten, JSONB oder Lookup-Tabellen passen.
  - Du wählst Typen für Geld und Zeitpunkte richtig und sicherst Mandantengrenzen mit zusammengesetzten Fremdschlüsseln.
