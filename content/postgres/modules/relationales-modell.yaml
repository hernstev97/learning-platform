id: relationales-modell
title: Das relationale Modell
level: 1
minutes: 120
summary: Was eine Tabelle in PostgreSQL ist – eine Menge von Zeilen mit Schlüsseln, Typen und Regeln – und was dein ORM-Modell davon abbildet, am Schema von Deskwerk, das dich durch den ganzen Kurs begleitet.
goals:
  - Du erklärst Relation, Tupel und Attribut und begründest, warum eine Abfrage ohne `ORDER BY` keine Reihenfolge garantiert.
  - Du unterscheidest Primär-, Kandidaten- und Fremdschlüssel und wählst begründet zwischen natürlichem und künstlichem Schlüssel (`identity` oder `uuid`).
  - Du sagst das Ergebnis von Vergleichen mit `NULL` nach der dreiwertigen Logik vorher und prüfst mit `IS NULL` und `IS DISTINCT FROM`.
  - Du wählst PostgreSQL-Typen für Text, Ganzzahlen, Geld, Zeitpunkte und Datumswerte und erkennst die Fallen von Gleitkommazahlen und `timestamp` ohne Zeitzone.
  - Du liest ein Schema mit `\d` und `information_schema` und erkennst, welche Tabelle ein SQLAlchemy- oder Prisma-Modell erzeugt.
