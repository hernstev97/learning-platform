id: normalisierung
title: Normalisierung – jede Tatsache an genau einer Stelle
level: 2
minutes: 130
summary: Warum eine breite Buchungsliste beim Ändern, Einfügen und Löschen Fehler produziert, wie funktionale Abhängigkeiten und die Normalformen sie beseitigen, wie du eine Legacy-Tabelle sicher zerlegst und wann du bewusst denormalisierst.
goals:
  - Du erkennst Einfüge-, Änderungs- und Löschanomalien in einer Tabelle und führst sie auf Redundanz zurück.
  - Du formulierst funktionale Abhängigkeiten und prüfst mit SQL, ob die Daten sie verletzen.
  - Du ordnest Verstöße der ersten, zweiten, dritten und Boyce-Codd-Normalform zu und begründest Arrays und JSONB als bewusste Ausnahme.
  - Du zerlegst eine Legacy-Tabelle mit `INSERT … SELECT DISTINCT` in Tabellen mit Schlüsseln und Fremdschlüsseln und weist nach, dass nichts verloren ging.
  - Du unterscheidest bewusste Denormalisierung – Snapshot-Preise, Zählerspalten, materialisierte Sichten – von Redundanz aus Versehen.
