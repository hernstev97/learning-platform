id: migrationen
title: Schema-Migrationen ohne Ausfall
level: 3
minutes: 160
summary: Schemaänderungen als versionierte Migrationen ausliefern, ohne dass die laufende App an Sperren hängen bleibt – mit lock_timeout, Spalten ohne Rewrite, NOT VALID und VALIDATE, CREATE INDEX CONCURRENTLY und Expand and Contract für Umbenennungen und Typwechsel.
goals:
  - Du erklärst, wie Alembic, Prisma Migrate und Flyway Migrationen versionieren und anwenden, und liest das SQL, das sie ausführen.
  - Du bestimmst die Sperre einer DDL-Anweisung, erkennst die Sperrwarteschlange als Ursache eines Ausfalls und begrenzt sie mit `lock_timeout`.
  - Du sagst vorher, welche `ALTER TABLE`-Anweisungen die Tabelle neu schreiben, und fügst Spalten mit Default ohne Rewrite hinzu.
  - Du rüstest NOT NULL, CHECK und Fremdschlüssel mit `NOT VALID` und `VALIDATE CONSTRAINT` nach und baust Indexe mit `CREATE INDEX CONCURRENTLY`.
  - Du planst Umbenennungen und Typwechsel als Expand and Contract mit Backfill in Batches und passender Deployment-Reihenfolge.
