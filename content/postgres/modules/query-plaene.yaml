      - title: PostgreSQL Wiki · Inlining of SQL functions
        url: https://wiki.postgresql.org/wiki/Inlining_of_SQL_functions
      - title: PostgreSQL · Using EXPLAIN
        url: https://www.postgresql.org/docs/current/using-explain.html
