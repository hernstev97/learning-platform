        url: https://www.postgresql.org/docs/current/planner-stats.html#PLANNER-STATS-EXTENDED
      - title: PostgreSQL · CREATE STATISTICS
        url: https://www.postgresql.org/docs/current/sql-createstatistics.html

  - id: planer-nachrechnen
    type: sql
    lang: postgres
    title: Die Schätzung aus pg_stats nachrechnen
    prompt: |
      Rechne nach, wie der Planer `WHERE status = 'storniert' AND raum_id = 7` schätzt – mit einer Abfrage auf `pg_stats` und `pg_class`.

      In `pg_stats` (Tabelle `buchungen`) stehen je Spalte `most_common_vals` (Typ `anyarray`) und `most_common_freqs` (`real[]`). Den Anteil eines Werts findest du über seine Position: `most_common_vals::text::text[]` macht aus dem `anyarray` ein Textarray, `array_position` liefert die Position. Die Zahl der Zeilen steht in `pg_class.reltuples`.

      Spalten: `anteil_status` (Anteil von `storniert`), `anteil_raum` (Anteil von `7` in `raum_id`), `geschaetzte_zeilen` (`reltuples` × beide Anteile, auf eine ganze Zahl gerundet).
    schema: |
      CREATE TABLE buchungen (
        id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        raum_id     int NOT NULL,
        mitglied_id int NOT NULL,
        beginn      timestamptz NOT NULL,
        status      text NOT NULL,
        preis       numeric(8,2)
      );
      INSERT INTO buchungen (raum_id, mitglied_id, beginn, status, preis)
      SELECT i % 30 + 1, i * 7 % 2000 + 1,
             timestamptz '2026-01-02 08:00+01' + i / 60 * interval '1 day' + i % 10 * interval '1 hour',
             CASE WHEN i % 20 = 0 THEN 'storniert' ELSE 'bestaetigt' END,
             (i % 5 + 1) * 12.50
      FROM generate_series(1, 20000) AS i;
      ANALYZE buchungen;
    starter: |
      SELECT attname, most_common_vals, most_common_freqs
      FROM pg_stats
      WHERE tablename = 'buchungen' AND attname IN ('status', 'raum_id');
    solution: |
      WITH s AS (
        SELECT most_common_freqs[array_position(most_common_vals::text::text[], 'storniert')] AS anteil
        FROM pg_stats WHERE tablename = 'buchungen' AND attname = 'status'
      ), r AS (
        SELECT most_common_freqs[array_position(most_common_vals::text::text[], '7')] AS anteil
        FROM pg_stats WHERE tablename = 'buchungen' AND attname = 'raum_id'
      )
      SELECT s.anteil AS anteil_status,
             r.anteil AS anteil_raum,
             round((c.reltuples * s.anteil * r.anteil)::numeric) AS geschaetzte_zeilen
      FROM s, r, pg_class AS c
      WHERE c.relname = 'buchungen';
    hints:
      - "Für eine Spalte: `SELECT most_common_freqs[array_position(most_common_vals::text::text[], 'storniert')] FROM pg_stats WHERE tablename = 'buchungen' AND attname = 'status'`."
      - Der Wert `7` steht im Textarray als `'7'`.
      - "Verbinde die beiden Anteile und `pg_class` (`relname = 'buchungen'`) und runde mit `round(…::numeric)`."
    explanation: |
      Für `status = 'storniert'` findet der Planer den Wert in der Liste der häufigsten Werte und nimmt dessen Anteil 0.05, für `raum_id = 7` den Anteil 0.03335. Weil er die Spalten für unabhängig hält, multipliziert er: 20 000 × 0.05 × 0.03335 = 33.35, also 33 – genau das `rows=33` aus `EXPLAIN`. Werte, die nicht in der Liste stehen, schätzt er aus dem restlichen Anteil, geteilt durch die Zahl der übrigen verschiedenen Werte, Bereiche aus dem Histogramm. Die Dokumentation rechnet diese Fälle Schritt für Schritt vor. Wer die Rechnung einmal nachvollzogen hat, liest Fehlschätzungen im Plan nicht mehr als Rätsel.
    resources:
      - title: PostgreSQL · Row Estimation Examples
        url: https://www.postgresql.org/docs/current/row-estimation-examples.html
      - title: PostgreSQL · pg_stats
        url: https://www.postgresql.org/docs/current/view-pg-stats.html

  - id: decimal-parameter
    type: bug
    title: Der Index wird nicht benutzt
    prompt: |
      Auf `buchungen` liegt ein Index auf `(mitglied_id, beginn)`. Trotzdem zeigt `auto_explain` für diese Funktion einen Seq Scan über alle Buchungen:

      ```text
      ->  Seq Scan on buchungen b
            Filter: ((mitglied_id)::numeric = '42'::numeric)
      ```

      psycopg 3 schickt Parameter mit ihrem Typ an den Server. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      from decimal import Decimal

      def meine_buchungen(conn, mitglied_id):
          return conn.execute(
              """
              SELECT b.id, b.beginn, r.name
              FROM buchungen AS b
              JOIN raeume AS r ON r.id = b.raum_id
              WHERE b.mitglied_id = %s
              ORDER BY b.beginn DESC
              LIMIT 10
              """,
              (Decimal(mitglied_id),),
          ).fetchall()
    lines: [13]
    fix:
      - line: 13
        answers:
          - "(mitglied_id,),"
          - "(int(mitglied_id),),"
          - "[mitglied_id],"
          - "[int(mitglied_id)],"
    hints:
      - "Im Plan steht `(mitglied_id)::numeric`. Wer hat entschieden, dass verglichen wird, als wäre es `numeric`?"
      - Welchen PostgreSQL-Typ bekommt ein Python-`Decimal`?
    explanation: |
      psycopg 3 übergibt ein `Decimal` als `numeric`. Für `integer = numeric` gibt es keinen passenden Operator im Index, also wandelt PostgreSQL die Spalte nach `numeric` um und vergleicht dann – Zeile für Zeile im Seq Scan. Mit einem `int` als Parameter steht die Bedingung als `Index Cond: (mitglied_id = 42)` im Plan. Solche Casts schleichen sich über Typen der Anwendung ein: `Decimal` aus einer JSON-Bibliothek, ein Python-`float` (wird `double precision`), `bigint`-Spalten gegen `numeric`-Parameter. Im Plan verrät sie der Cast auf der Spaltenseite der Bedingung.
    resources:
      - title: PostgreSQL · Operator Type Conversion
        url: https://www.postgresql.org/docs/current/typeconv-oper.html
      - title: psycopg 3 · Adapting basic Python types
        url: https://www.psycopg.org/psycopg3/docs/basic/adapt.html

  - id: fehlschaetzung-nach-import
    type: explain
    title: 681 Durchläufe statt zwei
    prompt: |
      Der Bericht „Wer hat ab dem 20. November gebucht, und wann war die Person im Haus?“ ist nach dem nächtlichen Import langsam. `ANALYZE` lief zuletzt vor dem Import. Erkläre den Plan: Wie liest du ihn, wo liegt das Problem, warum hat der Planer so entschieden, und was tust du?
    lang: text
    code: |
      EXPLAIN (ANALYZE, TIMING OFF, SUMMARY OFF, BUFFERS OFF)
      SELECT b.id, b.beginn, c.zeitpunkt
      FROM buchungen AS b
      JOIN checkins AS c ON c.mitglied_id = b.mitglied_id
      WHERE b.beginn >= '2026-11-20';

      Nested Loop  (cost=4.30..450.84 rows=5 width=24) (actual rows=1648.00 loops=1)
        ->  Seq Scan on buchungen b  (cost=0.00..429.15 rows=2 width=20) (actual rows=681.00 loops=1)
              Filter: (beginn >= '2026-11-20 00:00:00+01'::timestamp with time zone)
              Rows Removed by Filter: 19319
        ->  Bitmap Heap Scan on checkins c  (cost=4.30..10.82 rows=2 width=12) (actual rows=2.42 loops=681)
              Recheck Cond: (mitglied_id = b.mitglied_id)
              Heap Blocks: exact=1648
              ->  Bitmap Index Scan on checkins_mitglied_idx  (cost=0.00..4.30 rows=2 width=0) (actual rows=2.42 loops=681)
                    Index Cond: (mitglied_id = b.mitglied_id)
                    Index Searches: 681
    points:
      - Gelesen von innen nach außen; die innere Seite des Nested Loop läuft einmal je Zeile der äußeren (`loops=681`), 2.42 Zeilen je Lauf ergeben die 1 648 Zeilen des Joins.
      - "Die Fehlschätzung sitzt im Seq Scan auf `buchungen`: geschätzt 2 Zeilen, tatsächlich 681."
      - Ursache ist die veraltete Statistik – das Histogramm von `beginn` endet vor den importierten Buchungen, Werte dahinter hält der Planer für fast leer.
      - Bei zwei äußeren Zeilen ist ein Nested Loop mit Index innen billig; bei 681 wäre ein Hash Join die bessere Wahl gewesen.
      - "Abhilfe: `ANALYZE buchungen` am Ende des Imports und danach erneut messen."
    explanation: |
      Ich lese den Plan von innen nach außen. Außen liest ein Seq Scan alle Buchungen und behält die ab dem 20. November. Für jede davon sucht der Nested Loop über den Index auf `checkins.mitglied_id` die Check-ins des Mitglieds: Der innere Teil läuft 681-mal mit durchschnittlich 2.42 Zeilen, zusammen 1 648 Zeilen – das ist die Zahl am Nested Loop. Der Fehler sitzt am äußeren Seq Scan: geschätzt 2 Zeilen, tatsächlich 681. Das Histogramm von `beginn` stammt aus der Zeit vor dem Import und endet im Oktober, also hält der Planer alles nach dem 20. November für fast leer. Für zwei Zeilen ist ein Nested Loop mit 2 Indexsuchen ideal, für 681 sind es 681 Suchen – ein Hash Join über beide Tabellen hätte jede nur einmal gelesen. Auf diesen kleinen Tabellen ist der Unterschied gering, bei Millionen Zeilen wird aus derselben Fehlschätzung ein Bericht, der Minuten statt Sekunden braucht. Die Abhilfe ist `ANALYZE buchungen` als letzter Schritt des Imports. Danach messe ich noch einmal: Mit frischer Statistik schätzt der Planer 688 Zeilen und wählt einen Hash Join.
    resources:
      - title: PostgreSQL · Using EXPLAIN – Caveats
        url: https://www.postgresql.org/docs/current/using-explain.html#USING-EXPLAIN-CAVEATS

  - id: monatsbericht-beschleunigen
    type: sql
    lang: postgres
    title: Der Monatsbericht soll den Index nutzen
    prompt: |
      Der Monatsbericht ruft `umsatz_je_standort(monat)` auf (siehe Schema). Die Funktion liest jedes Mal alle Buchungen, obwohl sie nur einen Monat braucht.

      Sorge dafür, dass `SELECT * FROM umsatz_je_standort('2026-03-01')` `buchungen` über einen Index liest. Du darfst Indexe anlegen und die Funktion mit `CREATE OR REPLACE FUNCTION` neu schreiben; Signatur, `LANGUAGE sql STABLE` und Ergebnis bleiben gleich. Die Prüfabfrage vergleicht die Ergebnisse für März und Oktober (`standort:buchungen:umsatz`) und meldet anhand von `plan_knoten`, ob `buchungen` per Seq Scan gelesen wird und ob ein Index-Knoten auf `buchungen` vorkommt.
    schema: |
      CREATE TABLE raeume (id int PRIMARY KEY, standort text NOT NULL, name text NOT NULL);
      INSERT INTO raeume
      SELECT i, (ARRAY['Plagwitz', 'Südvorstadt', 'Zentrum'])[i % 3 + 1], 'Raum ' || i
      FROM generate_series(1, 30) AS i;
      CREATE TABLE buchungen (
        id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        raum_id     int NOT NULL,
        mitglied_id int NOT NULL,
        beginn      timestamptz NOT NULL,
        status      text NOT NULL,
        preis       numeric(8,2)
      );
      INSERT INTO buchungen (raum_id, mitglied_id, beginn, status, preis)
      SELECT i % 30 + 1, i * 7 % 2000 + 1,
             timestamptz '2026-01-02 08:00+01' + i / 60 * interval '1 day' + i % 10 * interval '1 hour',
             CASE WHEN i % 20 = 0 THEN 'storniert' ELSE 'bestaetigt' END,
             (i % 5 + 1) * 12.50
      FROM generate_series(1, 20000) AS i;
      -- Nachtveranstaltungen an Monatsgrenzen
      INSERT INTO buchungen (raum_id, mitglied_id, beginn, status, preis) VALUES
        (1, 11, '2026-03-31 23:30+02', 'bestaetigt', 80.00),
        (2, 12, '2026-04-01 00:00+02', 'bestaetigt', 80.00),
        (3, 13, '2026-10-31 23:30+01', 'bestaetigt', 80.00),
        (4, 14, '2026-11-01 00:00+01', 'bestaetigt', 80.00);
      ANALYZE;
      CREATE FUNCTION umsatz_je_standort(monat date)
      RETURNS TABLE (standort text, buchungen bigint, umsatz numeric)
      LANGUAGE sql STABLE AS $$
        SELECT r.standort, count(*), sum(b.preis)
        FROM buchungen AS b
        JOIN raeume AS r ON r.id = b.raum_id
        WHERE date_trunc('month', b.beginn) = monat
          AND b.status = 'bestaetigt'
        GROUP BY r.standort
      $$;
      -- Hilfsfunktion: die Knoten des Plans ohne Einrückung und ohne Bedingungszeilen
      CREATE FUNCTION plan_knoten(abfrage text) RETURNS SETOF text LANGUAGE plpgsql AS $$
      DECLARE zeile text;
      BEGIN
        FOR zeile IN EXECUTE 'EXPLAIN (COSTS OFF) ' || abfrage LOOP
          zeile := ltrim(zeile, ' ->');
          IF zeile !~ '^[A-Z][A-Za-z ]*: ' THEN RETURN NEXT zeile; END IF;
        END LOOP;
      END $$;
    starter: |
      -- Plan ansehen: SELECT plan_knoten($$SELECT * FROM umsatz_je_standort('2026-03-01')$$);
      CREATE OR REPLACE FUNCTION umsatz_je_standort(monat date)
      RETURNS TABLE (standort text, buchungen bigint, umsatz numeric)
      LANGUAGE sql STABLE AS $$
        SELECT r.standort, count(*), sum(b.preis)
        FROM buchungen AS b
        JOIN raeume AS r ON r.id = b.raum_id
        WHERE date_trunc('month', b.beginn) = monat
          AND b.status = 'bestaetigt'
        GROUP BY r.standort
      $$;
    solution: |
      CREATE INDEX buchungen_beginn_idx ON buchungen (beginn);
      CREATE OR REPLACE FUNCTION umsatz_je_standort(monat date)
      RETURNS TABLE (standort text, buchungen bigint, umsatz numeric)
      LANGUAGE sql STABLE AS $$
        SELECT r.standort, count(*), sum(b.preis)
        FROM buchungen AS b
        JOIN raeume AS r ON r.id = b.raum_id
        WHERE b.beginn >= monat
          AND b.beginn < monat + interval '1 month'
          AND b.status = 'bestaetigt'
        GROUP BY r.standort
      $$;
    check: |
      SELECT (SELECT string_agg(u.standort || ':' || u.buchungen || ':' || u.umsatz, ', ' ORDER BY u.standort)
              FROM umsatz_je_standort('2026-03-01') AS u) AS maerz,
             (SELECT string_agg(u.standort || ':' || u.buchungen || ':' || u.umsatz, ', ' ORDER BY u.standort)
              FROM umsatz_je_standort('2026-10-01') AS u) AS oktober,
             bool_or(k LIKE 'Seq Scan on buchungen%') AS seq_scan_buchungen,
             bool_or(k LIKE '%Scan%on buchungen%' AND k NOT LIKE 'Seq Scan%') AS index_auf_buchungen
      FROM plan_knoten($$SELECT * FROM umsatz_je_standort('2026-03-01')$$) AS k;
    hints:
      - "`SELECT plan_knoten(…)` zeigt den Plan. Eine `LANGUAGE sql`-Funktion mit `STABLE` wird in die Abfrage eingebettet, deshalb siehst du ihre Tabellen."
      - "`date_trunc('month', b.beginn) = monat` kann keinen Index auf `beginn` nutzen. Wie sieht derselbe Monat als halboffener Bereich aus?"
      - Es gibt Buchungen, die genau um Mitternacht am Monatsersten beginnen. Gehören sie zum alten oder zum neuen Monat?
      - "`CREATE INDEX … ON buchungen (beginn);` und in der Funktion `WHERE b.beginn >= monat AND b.beginn < monat + interval '1 month'`."
    explanation: |
      Zwei Dinge fehlen: ein Index auf `beginn` und eine Bedingung, die ihn nutzen kann. `date_trunc('month', b.beginn) = monat` rechnet für jede Zeile den Monatsanfang aus; ein Index auf `beginn` passt dazu nicht. Als halboffener Bereich `b.beginn >= monat AND b.beginn < monat + interval '1 month'` steht die Bedingung als `Index Cond` im Plan. `monat + interval '1 month'` ergibt einen Zeitpunkt in der Zeitzone der Sitzung, genau wie der Vergleich mit `date_trunc` – deshalb bleiben die Ergebnisse gleich, auch für die Nachtveranstaltungen an den Monatsgrenzen und im Oktober mit dem Ende der Sommerzeit. `BETWEEN monat AND monat + interval '1 month'` wäre falsch: Es schließt die obere Grenze ein und zählt die Buchung, die am 1. April um 0:00 Uhr beginnt, zum März. Ein partieller Index `ON buchungen (beginn) WHERE status = 'bestaetigt'` besteht die Prüfung ebenso. Bleibt die Funktion `STABLE` und `LANGUAGE sql`, bettet PostgreSQL ihren Rumpf in die aufrufende Abfrage ein; als `VOLATILE` oder in PL/pgSQL wäre sie für `EXPLAIN` eine Blackbox (`Function Scan`).
