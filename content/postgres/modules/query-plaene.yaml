      - title: PostgreSQL · CREATE STATISTICS
        url: https://www.postgresql.org/docs/current/sql-createstatistics.html
      - title: PostgreSQL · EXPLAIN
        url: https://www.postgresql.org/docs/current/sql-explain.html

  - id: statistik-nach-import
    type: sql
    lang: postgres
    title: Die Schätzung nach dem Import
    prompt: |
      Um 2:00 Uhr importiert ein Job die Buchungen ab Ende Oktober, um 2:01 Uhr läuft der Bericht – bevor Autovacuum die Statistik aktualisiert hat. Der Planer schätzt für `WHERE beginn >= '2026-11-20'` zwei Zeilen, es sind 681, und wählt deshalb für den Bericht einen Nested Loop mit 681 Durchläufen.

      Sorge dafür, dass die Schätzung stimmt, ohne Abfrage oder Daten zu ändern. Die Prüfabfrage liefert, ob die Schätzung (Hilfsfunktion `schaetzung`, siehe Schema) höchstens 10 % neben der tatsächlichen Zeilenzahl liegt, und die tatsächliche Zahl.
    schema: |
      CREATE TABLE buchungen (
        id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        raum_id     int NOT NULL,
        mitglied_id int NOT NULL,
        beginn      timestamptz NOT NULL,
        status      text NOT NULL,
        preis       numeric(8,2)
      );
      -- Bestand bis Ende Oktober, danach die Statistik
      INSERT INTO buchungen (raum_id, mitglied_id, beginn, status, preis)
      SELECT i % 30 + 1, i * 7 % 2000 + 1,
             timestamptz '2026-01-02 08:00+01' + i / 60 * interval '1 day' + i % 10 * interval '1 hour',
             CASE WHEN i % 20 = 0 THEN 'storniert' ELSE 'bestaetigt' END,
             (i % 5 + 1) * 12.50
      FROM generate_series(1, 18000) AS i;
      ANALYZE buchungen;
      -- Der nächtliche Import
      INSERT INTO buchungen (raum_id, mitglied_id, beginn, status, preis)
      SELECT i % 30 + 1, i * 7 % 2000 + 1,
             timestamptz '2026-01-02 08:00+01' + i / 60 * interval '1 day' + i % 10 * interval '1 hour',
             CASE WHEN i % 20 = 0 THEN 'storniert' ELSE 'bestaetigt' END,
             (i % 5 + 1) * 12.50
      FROM generate_series(18001, 20000) AS i;
      -- Hilfsfunktion: geschätzte Zeilen des obersten Plan-Knotens
      CREATE FUNCTION schaetzung(abfrage text) RETURNS numeric LANGUAGE plpgsql AS $$
      DECLARE plan json;
      BEGIN
        EXECUTE 'EXPLAIN (FORMAT JSON) ' || abfrage INTO plan;
        RETURN (plan -> 0 -> 'Plan' ->> 'Plan Rows')::numeric;
      END $$;
    starter: |
      -- Was weiß der Planer über die neuen Buchungen?
      SELECT schaetzung($$SELECT * FROM buchungen WHERE beginn >= '2026-11-20'$$);
    solution: |
      ANALYZE buchungen;
    check: |
      SELECT abs(schaetzung($$SELECT * FROM buchungen WHERE beginn >= '2026-11-20'$$) - count(*)) <= count(*) * 0.1 AS schaetzung_passt,
             count(*) AS tatsaechlich
      FROM buchungen
      WHERE beginn >= '2026-11-20';
    hints:
      - Welche Statistik kennt der Planer? Sie stammt aus der Zeit vor dem Import.
      - Das Histogramm von `beginn` endet Ende Oktober. Alles danach hält der Planer für fast leer.
      - "`ANALYZE buchungen;`"
    explanation: |
      Das Histogramm in `pg_stats` beschreibt `beginn` so, wie es beim letzten `ANALYZE` war: bis Ende Oktober. Werte jenseits des letzten Histogrammwerts schätzt der Planer als fast leer, hier zwei Zeilen. `ANALYZE buchungen` liest die Tabelle neu ein, danach liegt die Schätzung bei den tatsächlichen 681 Zeilen. Autovacuum hätte das bald selbst getan – der Import ändert mehr als 50 Zeilen plus 10 % der Tabelle –, aber nicht vor dem Bericht um 2:01 Uhr. Deshalb gehört `ANALYZE` ans Ende jedes größeren Imports. Ein Index auf `beginn` mildert das Problem nur: Dann schaut der Planer für Werte am Rand des Histogramms im Index nach dem tatsächlichen Maximum, und die Schätzung steigt hier von 2 auf 68 – immer noch zehnmal zu wenig.
    resources:
      - title: PostgreSQL · ANALYZE
        url: https://www.postgresql.org/docs/current/sql-analyze.html
      - title: PostgreSQL · Updating Planner Statistics
        url: https://www.postgresql.org/docs/current/routine-vacuuming.html#VACUUM-FOR-STATISTICS

  - id: abhaengige-spalten
    type: sql
    lang: postgres
    title: Raum und Preis hängen zusammen
    prompt: |
      Jede Buchung dauert zwei Stunden, ihr Preis hängt also nur am Raum. Für `WHERE raum_id = 7 AND preis = 25.00` schätzt der Planer 133 Zeilen, es sind 667.

      Bring dem Planer den Zusammenhang bei, ohne Abfrage oder Daten zu ändern. Die Prüfabfrage meldet, ob die Schätzung (Hilfsfunktion `schaetzung`, siehe Schema) höchstens 10 % neben der tatsächlichen Zeilenzahl liegt und ob es für `buchungen` eine erweiterte Statistik gibt.
    schema: |
      CREATE TABLE buchungen (
        id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        raum_id     int NOT NULL,
        mitglied_id int NOT NULL,
        beginn      timestamptz NOT NULL,
        status      text NOT NULL,
        preis       numeric(8,2)
      );
      INSERT INTO buchungen (raum_id, mitglied_id, beginn, status, preis)
      SELECT i % 30 + 1, i * 7 % 2000 + 1,
             timestamptz '2026-01-02 08:00+01' + i / 60 * interval '1 day' + i % 10 * interval '1 hour',
             CASE WHEN i % 20 = 0 THEN 'storniert' ELSE 'bestaetigt' END,
             (i % 5 + 1) * 12.50
      FROM generate_series(1, 20000) AS i;
      ANALYZE buchungen;
      -- Hilfsfunktion: geschätzte Zeilen des obersten Plan-Knotens
      CREATE FUNCTION schaetzung(abfrage text) RETURNS numeric LANGUAGE plpgsql AS $$
      DECLARE plan json;
      BEGIN
        EXECUTE 'EXPLAIN (FORMAT JSON) ' || abfrage INTO plan;
        RETURN (plan -> 0 -> 'Plan' ->> 'Plan Rows')::numeric;
      END $$;
    starter: |
      SELECT schaetzung($$SELECT * FROM buchungen WHERE raum_id = 7 AND preis = 25.00$$);
    solution: |
      CREATE STATISTICS buchungen_raum_preis (dependencies) ON raum_id, preis FROM buchungen;
      ANALYZE buchungen;
    check: |
      SELECT abs(schaetzung($$SELECT * FROM buchungen WHERE raum_id = 7 AND preis = 25.00$$) - count(*)) <= count(*) * 0.1 AS schaetzung_passt,
             (SELECT count(*) > 0 FROM pg_statistic_ext WHERE stxrelid = 'buchungen'::regclass) AS erweiterte_statistik
      FROM buchungen
      WHERE raum_id = 7 AND preis = 25.00;
    hints:
      - Ein erneutes `ANALYZE` allein hilft nicht. Die Statistik je Spalte weiß nichts über die andere Spalte.
      - "`CREATE STATISTICS name (art) ON spalte1, spalte2 FROM tabelle;` – und danach?"
      - "`CREATE STATISTICS … (dependencies) ON raum_id, preis FROM buchungen;` und `ANALYZE buchungen;`"
    explanation: |
      Ohne erweiterte Statistik multipliziert der Planer die Anteile 0.03335 und 0.2, als wären die Spalten unabhängig. `CREATE STATISTICS … (dependencies)` misst beim nächsten `ANALYZE`, dass `raum_id` den Preis vollständig bestimmt, und der Planer rechnet dann nur noch mit dem Anteil von Raum 7: 667 Zeilen. Ohne das `ANALYZE` danach bleibt die Statistik leer. `(mcv)` besteht die Prüfung ebenso und schätzt auch unmögliche Kombinationen wie `raum_id = 7 AND preis = 12.50` richtig; `dependencies` nimmt an, dass die Werte zusammenpassen, und schätzt dort wieder 667. Ohne Art legt PostgreSQL alle Arten an.
