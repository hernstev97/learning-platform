id: query-plaene
title: Query-Pläne lesen
level: 3
minutes: 170
summary: EXPLAIN und EXPLAIN ANALYZE lesen wie ein Profi – Knoten, Kosten und Zeilenschätzungen, Scan-Arten und Join-Algorithmen, work_mem, die Statistik des Planers und die Muster, an denen ein Index scheitert.
goals:
  - Du liest einen Plan von innen nach außen und erklärst Kosten (`startup..total`), `rows`, `width`, `actual rows` und `loops`.
  - Du misst mit `EXPLAIN (ANALYZE, BUFFERS)` sicher, auch bei `UPDATE` und `DELETE`.
  - Du erkennst Seq Scan, Index Scan, Index-Only Scan und Bitmap Scan sowie Nested Loop, Hash Join und Merge Join und begründest, wann der Planer welchen wählt.
  - Du findest Fehlschätzungen, führst sie auf veraltete Statistik oder abhängige Spalten zurück und behebst sie mit `ANALYZE` und `CREATE STATISTICS`.
  - Du erkennst Funktionen auf indizierten Spalten, implizite Casts, `OR` über mehrere Spalten und `LIKE '%…'` im Plan und schreibst die Abfrage um.
