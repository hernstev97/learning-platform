id: indexe
title: Indexe
level: 2
minutes: 170
summary: Warum eine Abfrage nach einem Jahr Betrieb langsam wird und welcher Index sie wieder schnell macht – B-Baum und Selektivität, Spaltenreihenfolge, partielle und Ausdrucksindexe, Covering Index, GIN und GiST, und was jeder Index beim Schreiben kostet.
goals:
  - Du erklärst, wie PostgreSQL eine Zeile über Heap und B-Baum findet und warum ein Seq Scan oft die richtige Wahl ist.
  - Du legst zusammengesetzte Indexe in der passenden Spaltenreihenfolge an – Gleichheit vor Bereich – und nutzt sie für `ORDER BY … LIMIT`.
  - Du setzt partielle Indexe, Ausdrucksindexe, Unique-Indexe und Covering Indexe mit `INCLUDE` gezielt ein.
  - Du wählst GIN für JSONB und Teilwortsuche mit `pg_trgm` und GiST für Zeiträume.
  - Du wägst den Nutzen eines Index gegen seine Kosten beim Schreiben ab und findest Fremdschlüssel ohne Index.
