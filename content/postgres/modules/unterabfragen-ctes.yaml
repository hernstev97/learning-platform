id: unterabfragen-ctes
title: Unterabfragen, CTEs und LATERAL
level: 2
minutes: 150
summary: Abfragen in Abfragen so schreiben, dass sie richtig rechnen und PostgreSQL sie gut planen kann – skalare und korrelierte Unterabfragen, EXISTS, ANY und ALL, CTEs mit und ohne Materialisierung, rekursive CTEs für Hierarchien und LATERAL für „die letzten N je Gruppe“.
goals:
  - Du setzt skalare und korrelierte Unterabfragen ein und sagst vorher, wann sie `NULL` liefern und wann sie mit „more than one row“ scheitern.
  - Du wählst zwischen `EXISTS`, `IN`, `= ANY` und `<> ALL` und erkennst am Query-Plan, ob PostgreSQL einen Semi- oder Anti-Join daraus macht.
  - Du erklärst, wann PostgreSQL seit Version 12 einen CTE in die Abfrage faltet und wann er materialisiert wird, und steuerst das mit `MATERIALIZED`.
  - Du durchläufst Hierarchien mit `WITH RECURSIVE` und fängst Zyklen mit `CYCLE` ab.
  - Du holst die letzten N Zeilen je Gruppe mit `LEFT JOIN LATERAL` in einer Abfrage statt in einer Schleife.
