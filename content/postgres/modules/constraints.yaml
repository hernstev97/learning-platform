id: constraints
title: Constraints – Regeln, die die Datenbank durchsetzt
level: 2
minutes: 150
summary: NOT NULL, CHECK, UNIQUE, Fremdschlüssel und Exclusion Constraints halten die Regeln der Fachlichkeit fest – auch dann, wenn zwei Anfragen gleichzeitig kommen und die Prüfung in der App längst vorbei ist.
goals:
  - Du sicherst Spalten mit `NOT NULL`, `CHECK` und Domains ab und erklärst, warum `NULL` einen `CHECK` besteht.
  - Du setzt `UNIQUE` und Primärschlüssel richtig ein, auch mit `NULL`-Werten, `NULLS NOT DISTINCT` und Unique-Indexen auf Ausdrücken.
  - Du wählst für jeden Fremdschlüssel die passende Aktion (`NO ACTION`, `RESTRICT`, `CASCADE`, `SET NULL`) und begründest sie fachlich.
  - Du verschiebst die Prüfung mit `DEFERRABLE` an das Ende der Anweisung oder der Transaktion, wenn ein Zwischenzustand die Regel verletzen muss.
  - Du verhinderst Doppelbuchungen mit einem Exclusion Constraint über `tstzrange` und `btree_gist`.
  - Du begründest, warum eine Prüfung in der App den Constraint nicht ersetzt, und übersetzt SQLSTATE-Fehler in passende HTTP-Antworten.
