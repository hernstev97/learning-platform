id: transaktionen
title: Transaktionen
level: 2
minutes: 140
summary: Mehrere Änderungen als Einheit schreiben – mit BEGIN, COMMIT und ROLLBACK, Savepoints, transaktionalem DDL und Transaktionsgrenzen in psycopg, SQLAlchemy und Prisma, die kurz bleiben und keine Verbindung blockieren.
goals:
  - Du erklärst ACID an einer Buchung mit Rechnungsbetrag und sagst, welche Eigenschaft welchen Fehler verhindert.
  - Du steuerst Transaktionen mit `BEGIN`, `COMMIT` und `ROLLBACK` und erkennst, wann ein Treiber im Autocommit arbeitet und wann er still eine Transaktion öffnet.
  - Du erkennst eine abgebrochene Transaktion (SQLSTATE 25P02) und nimmst mit `SAVEPOINT` und `ROLLBACK TO SAVEPOINT` gezielt Teilschritte zurück.
  - Du nutzt transaktionales DDL für Migrationen und weißt, was ein `ROLLBACK` nicht zurücknimmt.
  - Du setzt Transaktionsgrenzen in psycopg, SQLAlchemy und Prisma so, dass keine Sitzung „idle in transaction“ hängen bleibt.
