id: abfragen
title: Abfragen für Anwendungen
level: 1
minutes: 150
summary: SELECT, JOIN und GROUP BY so schreiben, wie eine App sie braucht – Listenansichten über Fremdschlüssel, Zähler mit LEFT JOIN und FILTER, stabile Sortierung, Paginierung per Keyset, DISTINCT ON und Zeitfilter, die auch um die Sommerzeitumstellung stimmen.
goals:
  - Du baust Listenansichten mit `JOIN` über Fremdschlüssel und zählst mit `LEFT JOIN`, `count(spalte)` und `FILTER (WHERE …)`, ohne Mitglieder ohne Buchung zu verlieren.
  - Du fasst Werte einer Gruppe mit `string_agg` und `array_agg` zusammen und filterst Gruppen mit `HAVING`.
  - Du sortierst deterministisch mit eindeutigem Tiebreaker und paginierst lange Listen per Keyset statt mit `OFFSET`.
  - Du unterscheidest `DISTINCT` und `DISTINCT ON` und holst damit den neuesten Datensatz je Gruppe.
  - Du filterst Zeiträume mit halboffenen Intervallen und rechnest Tage und Monate mit `AT TIME ZONE` und `date_trunc` in der Zeitzone der Fachlichkeit.
