id: performance
title: "Performance: messen statt raten"
level: 3
minutes: 160
summary: Langsame Anwendungen systematisch untersuchen und die typischen Bremsen lösen – zu viele Roundtrips, große OFFSETs, teure Zählungen, Schleifen statt Batches, zu viele Verbindungen, Bloat und Tabellen, die über Jahre wachsen.
goals:
  - Du gehst bei langsamen Abfragen nach einer Methode vor – Last mit `pg_stat_statements`, Logs und Statistik-Sichten messen, nach Gesamtzeit priorisieren, eine Änderung messen.
  - Du ersetzt große `OFFSET`-Seiten durch Keyset-Paginierung und exakte Zählungen durch Schätzungen, wo die Oberfläche das erlaubt.
  - Du fasst Einzelanweisungen zu Batches zusammen (`unnest`, `UPDATE … FROM`, `COPY`) und teilst große Änderungen in kurze Transaktionen.
  - Du dimensionierst Connection Pools, kennst die Grenzen von PgBouncer im Transaktionsmodus und setzt `statement_timeout`, `lock_timeout` und `idle_in_transaction_session_timeout` gezielt.
  - Du erklärst tote Zeilen, VACUUM, Bloat und HOT-Updates und liest sie in `pg_stat_user_tables` ab.
  - Du partitionierst eine wachsende Tabelle nach Monat und prüfst im Plan, dass nur die nötigen Partitionen gelesen werden.
