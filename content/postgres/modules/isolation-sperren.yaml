  - id: jobs-abholen
    type: sql
    lang: postgres
    title: Der nächste Worker holt sich Arbeit
    prompt: |
      `worker-2` holt sich die **zwei ältesten offenen** Jobs (`status = 'offen'`, kleinstes `erstellt_am` zuerst) und markiert sie für sich: `status = 'laeuft'`, `worker = 'worker-2'`, `versuche` um 1 erhöht. Andere Worker laufen gleichzeitig. Jobs, die gerade ein anderer Worker sperrt, sollen übersprungen werden, statt zu warten.

      Schreibe **eine** Anweisung, die die Jobs abholt und `id`, `art`, `status`, `worker` und `versuche` der abgeholten Jobs zurückgibt.
    schema: |
      CREATE TABLE jobs (
        id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        art         text NOT NULL,
        status      text NOT NULL DEFAULT 'offen',
        worker      text,
        versuche    int NOT NULL DEFAULT 0,
        erstellt_am timestamptz NOT NULL
      );
      INSERT INTO jobs (art, status, worker, versuche, erstellt_am) VALUES
        ('rechnung_pdf',    'erledigt',       'worker-1', 1, '2026-03-02 07:58'),
        ('erinnerung_mail', 'laeuft',         'worker-1', 1, '2026-03-02 08:00'),
        ('rechnung_pdf',    'offen',          NULL,       0, '2026-03-02 08:04'),
        ('rechnung_pdf',    'fehlgeschlagen', 'worker-3', 3, '2026-03-02 07:30'),
        ('erinnerung_mail', 'offen',          NULL,       0, '2026-03-02 08:02'),
        ('rechnung_pdf',    'offen',          NULL,       1, '2026-03-02 08:10'),
        ('export_csv',      'offen',          NULL,       0, '2026-03-02 08:02');
    starter: |
      SELECT id, art, status, worker, versuche
      FROM jobs
      WHERE status = 'offen'
      ORDER BY erstellt_am
      LIMIT 2
      FOR UPDATE SKIP LOCKED;
    solution: |
      WITH naechste AS (
        SELECT id
        FROM jobs
        WHERE status = 'offen'
        ORDER BY erstellt_am, id
        LIMIT 2
        FOR UPDATE SKIP LOCKED
      )
      UPDATE jobs
      SET status = 'laeuft', worker = 'worker-2', versuche = versuche + 1
      FROM naechste
      WHERE jobs.id = naechste.id
      RETURNING jobs.id, jobs.art, jobs.status, jobs.worker, jobs.versuche;
    hints:
      - Das `SELECT … FOR UPDATE SKIP LOCKED` findet und sperrt die richtigen Jobs, ändert sie aber nicht. Pack es in einen CTE.
      - "`UPDATE jobs SET … FROM naechste WHERE jobs.id = naechste.id RETURNING jobs.id, jobs.art, jobs.status, jobs.worker, jobs.versuche`."
    explanation: |
      Der CTE wählt die zwei ältesten offenen Jobs und sperrt sie. `SKIP LOCKED` überspringt Zeilen, die ein anderer Worker gerade gesperrt hat, sodass sich mehrere Worker nicht gegenseitig blockieren und keiner einen Job doppelt bekommt. Das `UPDATE` markiert genau diese Zeilen, `RETURNING` liefert sie an den Worker. Weil das Abholen eine kurze, eigene Anweisung ist, ist die Sperre nach dem Commit wieder frei, und der Status `laeuft` hält andere Worker fern. Stürzt ein Worker ab, bleibt der Job auf `laeuft` stehen; ein Aufräumjob setzt solche Jobs nach einer Frist zurück. Der Job von 7:30 Uhr ist `fehlgeschlagen` und zählt nicht. Ergebnis: Job 5 und Job 7, beide von 8:02 Uhr, jetzt `laeuft` bei `worker-2` mit `versuche = 1`. Ob `SKIP LOCKED` in deiner Anweisung steht, kann die Prüfung in einer einzelnen Sitzung nicht erkennen – das gehört ins Code-Review.
    resources:
      - title: PostgreSQL · SELECT – The Locking Clause (SKIP LOCKED)
        url: https://www.postgresql.org/docs/current/sql-select.html#SQL-FOR-UPDATE-SHARE

  - id: lost-update-orm
    type: bug
    title: Das Drehkreuz zählt mehr als die Datenbank
    prompt: |
      Am Freitag zählte das Drehkreuz in Zentrum 412 Check-ins, `standorte.checkins_heute` stand abends bei 377. Im Test mit einem einzelnen Check-in stimmt der Zähler immer. Mehrere Instanzen der API rufen die Funktion gleichzeitig auf. Finde die Zeile, in der Check-ins verloren gehen, und korrigiere sie so, dass **PostgreSQL selbst hochzählt**.
    lang: python
    code: |
      def checkin_zaehlen(engine, standort_id: int, zeitpunkt) -> None:
          with Session(engine) as session, session.begin():
              standort = session.get(Standort, standort_id)
              standort.checkins_heute = standort.checkins_heute + 1
              session.add(Checkin(standort_id=standort_id, zeitpunkt=zeitpunkt))
    lines: [4]
    fix:
      - line: 4
        answers:
          - standort.checkins_heute = Standort.checkins_heute + 1
          - standort.checkins_heute = 1 + Standort.checkins_heute
          - session.execute(update(Standort).where(Standort.id == standort_id).values(checkins_heute=Standort.checkins_heute + 1))
          - session.execute(update(Standort).values(checkins_heute=Standort.checkins_heute + 1).where(Standort.id == standort_id))
    hints:
      - Welchen Wert schickt SQLAlchemy im `UPDATE`, wenn zwei Requests gleichzeitig 376 gelesen haben?
      - SQLAlchemy erlaubt, einem Attribut einen SQL-Ausdruck zuzuweisen. Ein Ausdruck über die Spalte entsteht aus der Klasse, nicht aus dem Objekt.
    explanation: |
      `standort.checkins_heute + 1` rechnet in Python mit dem Wert, den `session.get` gelesen hat. SQLAlchemy schickt dann `UPDATE standorte SET checkins_heute = 377`. Zwei gleichzeitige Requests lesen beide 376 und schreiben beide 377, ein klassischer Lost Update. `Standort.checkins_heute + 1` ist dagegen ein SQL-Ausdruck über die Spalte. SQLAlchemy schickt `SET checkins_heute = checkins_heute + 1`, und PostgreSQL rechnet beim Schreiben mit dem aktuellen Wert, auch wenn ein anderer Request gerade gezählt hat. Nach dem Flush ist das Attribut abgelaufen und wird bei Bedarf neu geladen. Gleichwertig ist ein ORM-`UPDATE` mit `session.execute(update(Standort).where(…).values(checkins_heute=Standort.checkins_heute + 1))`. Eine Alternative ist `session.get(Standort, standort_id, with_for_update=True)` in Zeile 3. Das sperrt die Zeile beim Lesen, lässt Check-ins desselben Standorts aber aufeinander warten, solange die Transaktion läuft.
    resources:
      - title: SQLAlchemy 2.1 · Embedding SQL Insert/Update Expressions into a Flush
        url: https://docs.sqlalchemy.org/en/21/orm/persistence_techniques.html#embedding-sql-insert-update-expressions-into-a-flush

  - id: write-skew-erklaeren
    type: explain
    title: Zwei Buchungen, beide geprüft
    prompt: |
      Diese Zeitleiste stammt aus einem echten Lauf mit zwei Sitzungen. Am Ende ist das Loft am 2. März von 10:30 bis 11:30 doppelt gebucht, obwohl beide Transaktionen vorher geprüft haben und in Repeatable Read liefen. Erkläre, warum keine Prüfung angeschlagen hat, was Serializable hier ändern würde und wie du das Problem dauerhaft löst.
    lang: text
    code: |
      A> BEGIN ISOLATION LEVEL REPEATABLE READ;
      B> BEGIN ISOLATION LEVEL REPEATABLE READ;
      A> SELECT count(*) FROM buchungen WHERE raum_id = 2
           AND beginn < '2026-03-02 12:00' AND ende > '2026-03-02 10:00';
         0
      B> SELECT count(*) FROM buchungen WHERE raum_id = 2
           AND beginn < '2026-03-02 11:30' AND ende > '2026-03-02 10:30';
         0
      A> INSERT INTO buchungen (raum_id, mitglied_id, beginn, ende)
           VALUES (2, 7, '2026-03-02 10:00', '2026-03-02 12:00');
         INSERT 0 1
      B> INSERT INTO buchungen (raum_id, mitglied_id, beginn, ende)
           VALUES (2, 9, '2026-03-02 10:30', '2026-03-02 11:30');
         INSERT 0 1
      A> COMMIT;
      B> COMMIT;
    points:
      - Jede Transaktion prüft gegen ihren eigenen Snapshot. Die Buchung der anderen ist darin nicht sichtbar, weil sie beim Prüfen noch nicht committet war.
      - Beide fügen neue, verschiedene Zeilen ein. Es gibt keine gemeinsame Zeile, auf deren Sperre eine warten müsste, deshalb blockiert nichts und kein Fehler entsteht (Write Skew).
      - "In Serializable bricht PostgreSQL eine der beiden spätestens beim Commit mit SQLSTATE 40001 ab. Die Anwendung muss die ganze Transaktion wiederholen, inklusive der Prüfung."
      - "Dauerhafte Lösung: ein Exclusion Constraint auf `raum_id` und `tstzrange(beginn, ende)`, der für jeden Client gilt. Alternativ die Raumzeile mit `FOR UPDATE` sperren, bevor geprüft wird."
    explanation: |
      Beide Transaktionen prüfen, ob sich eine Buchung überschneidet, und jede sieht dabei nur ihren Snapshot. Darin fehlt die Buchung der anderen, denn die ist zum Zeitpunkt der Prüfung noch nicht committet. Danach schreiben beide eine neue Zeile. Es gibt keine Zeile, die beide ändern wollen, also wartet niemand, und auch Repeatable Read meldet nichts. Repeatable Read schützt vor Konflikten auf derselben Zeile, nicht vor Entscheidungen auf Grundlage veralteter Lesezugriffe. Das ist Write Skew. Serializable verfolgt, wer was gelesen hat. Es erkennt, dass kein serieller Ablauf beide Buchungen erlaubt hätte, und bricht eine der beiden ab, in diesem Ablauf B beim Commit mit `could not serialize access due to read/write dependencies among transactions`. Dann muss die App die ganze Transaktion wiederholen. Dauerhaft löse ich es in der Datenbank: Ein Exclusion Constraint `EXCLUDE USING gist (raum_id WITH =, tstzrange(beginn, ende) WITH &&)` lehnt die zweite Buchung ab, egal welcher Client sie schreibt. Ohne Constraint sperre ich vor der Prüfung die Raumzeile mit `SELECT … FROM raeume WHERE id = 2 FOR UPDATE`, dann laufen Buchungen desselben Raums nacheinander.
    resources:
      - title: PostgreSQL · Serializable Isolation Level
        url: https://www.postgresql.org/docs/current/transaction-iso.html#XACT-SERIALIZABLE
      - title: PostgreSQL · Data Consistency Checks at the Application Level
        url: https://www.postgresql.org/docs/current/applevel-consistency.html#APPLEVEL-CONSISTENCY

  - id: deadlock-im-log
    type: explain
    title: Ein Deadlock im Serverlog
    prompt: |
      Nachts findet das Monitoring diesen Eintrag im Log von PostgreSQL. Prozess 262 und 263 sind zwei Requests der API, die Guthaben zwischen Mitgliedern eines Teams übertragen. Erkläre, was passiert ist, was die beiden Requests davon gemerkt haben und wie du den Code änderst.
    lang: text
    code: |
      2026-10-06 12:30:04.967 CEST [262] ERROR:  deadlock detected
      2026-10-06 12:30:04.967 CEST [262] DETAIL:  Process 262 waits for ShareLock on transaction 794; blocked by process 263.
      	Process 263 waits for ShareLock on transaction 793; blocked by process 262.
      	Process 262: UPDATE mitglieder SET guthaben = guthaben + 10 WHERE id = 3;
      	Process 263: UPDATE mitglieder SET guthaben = guthaben + 5 WHERE id = 7;
      2026-10-06 12:30:04.967 CEST [262] HINT:  See server log for query details.
      2026-10-06 12:30:04.967 CEST [262] CONTEXT:  while updating tuple (0,1) in relation "mitglieder"
      2026-10-06 12:30:04.967 CEST [262] STATEMENT:  UPDATE mitglieder SET guthaben = guthaben + 10 WHERE id = 3;
    points:
      - 262 hatte Mitglied 7 gesperrt und wollte 3, 263 hatte 3 gesperrt und wollte 7. Jeder wartete auf das Ende der Transaktion des anderen, ein Zyklus.
      - PostgreSQL erkennt den Zyklus nach `deadlock_timeout` und bricht eine Transaktion ab (hier 262, SQLSTATE 40P01). Die andere läuft weiter und committet.
      - Der Request von 262 bekommt einen Fehler, seine ganze Transaktion ist zurückgerollt. Ohne Retry sieht der Nutzer einen Fehler.
      - "Abhilfe: beide Zeilen zu Beginn in fester Reihenfolge sperren (`WHERE id IN (3, 7) ORDER BY id FOR UPDATE`) und bei 40P01 die ganze Transaktion wiederholen."
    explanation: |
      Die beiden Transaktionen haben dieselben zwei Zeilen in umgekehrter Reihenfolge gesperrt. 262 hat zuerst Mitglied 7 geändert und hält dessen Zeilensperre, 263 hält die von Mitglied 3. Danach will jeder die Zeile des anderen. „Waits for ShareLock on transaction 794“ heißt: 262 wartet auf das Ende der Transaktion 794, die die Zeile gesperrt hat. Nach `deadlock_timeout`, standardmäßig einer Sekunde, findet PostgreSQL den Zyklus und bricht 262 mit `deadlock detected` (SQLSTATE 40P01) ab. Damit fällt die Sperre auf Mitglied 7 weg, 263 läuft weiter und committet. Der Request hinter 262 bekommt eine Exception, seine Übertragung ist komplett zurückgerollt. Ich würde in der Übertragung zuerst beide Zeilen mit `SELECT … WHERE id IN (quelle, ziel) ORDER BY id FOR UPDATE` sperren. Dann sperren alle Übertragungen in derselben Reihenfolge, und die zweite wartet schon beim ersten Zugriff. Zusätzlich fängt der Code `40P01` ab und wiederholt die Transaktion, weil Deadlocks auch an anderen Stellen entstehen können.
    resources:
      - title: PostgreSQL · Deadlocks
        url: https://www.postgresql.org/docs/current/explicit-locking.html#LOCKING-DEADLOCKS
      - title: PostgreSQL · deadlock_timeout
        url: https://www.postgresql.org/docs/current/runtime-config-locks.html#GUC-DEADLOCK-TIMEOUT

  - id: werkzeug-waehlen
    type: choice
    title: Welches Werkzeug für welchen Fall?
    prompt: |
      Das Team plant die Nebenläufigkeit in der Deskwerk-App. Welche Zuordnungen sind sinnvoll?
    options:
      - text: "Tageszähler für Check-ins: `UPDATE … SET anzahl = anzahl + 1` bzw. ein Upsert, ohne vorheriges Lesen."
        correct: true
        why: Die Datenbank rechnet mit dem aktuellen Wert. Gleichzeitige Check-ins warten kurz aufeinander, keiner geht verloren.
      - text: "Profil im Formular bearbeiten: beim Öffnen des Formulars `SELECT … FOR UPDATE`, beim Speichern `COMMIT`."
        correct: false
        why: Die Transaktion bliebe offen, solange das Formular offen ist, mit gesperrter Zeile und belegter Verbindung. Für Formulare passt optimistisches Locking mit einer `version`-Spalte.
      - text: "Mehrere Worker arbeiten `jobs` ab: `SELECT … FOR UPDATE SKIP LOCKED` in einer kurzen Transaktion."
        correct: true
        why: Jeder Worker bekommt einen freien Job, ohne auf andere zu warten, und kein Job wird doppelt abgeholt.
      - text: "Keine Doppelbuchung eines Raums: Exclusion Constraint über Raum und Zeitraum."
        correct: true
        why: Der Constraint gilt für jede Sitzung und jeden Client. Gleichzeitige Inserts, die sich überschneiden, scheitern mit SQLSTATE 23P01.
      - text: "Der Monatsabschluss darf nur einmal gleichzeitig laufen: `pg_advisory_lock` auf Sitzungsebene, weil er bei einem `ROLLBACK` automatisch frei wird."
        correct: false
        why: Sitzungs-Advisory-Locks überleben ein `ROLLBACK` und bleiben bis `pg_advisory_unlock` oder zum Ende der Verbindung. Automatisch mit der Transaktion endet nur `pg_advisory_xact_lock`.
    explanation: |
      Jedes Werkzeug passt zu einem Muster. Rechnen in der Datenbank für Zähler und Salden. Kurze Zeilensperren, wenn die Anwendung zwischen Lesen und Schreiben rechnen muss. `SKIP LOCKED` für Warteschlangen. Optimistisches Locking, wenn ein Mensch zwischen Lesen und Speichern Zeit braucht. Constraints für Regeln, die für alle Clients gelten müssen. Bei Advisory Locks entscheidet die Lebensdauer: Die Sitzungsvariante überlebt Transaktionen und `ROLLBACK`, in einem Connection Pool hängt sie dann an einer fremden Anfrage.
    resources:
      - title: PostgreSQL · Advisory Locks
        url: https://www.postgresql.org/docs/current/explicit-locking.html#ADVISORY-LOCKS
      - title: PostgreSQL · Advisory Lock Functions
        url: https://www.postgresql.org/docs/current/functions-admin.html#FUNCTIONS-ADVISORY-LOCKS

  - id: doppelbuchung-ausschliessen
    type: sql
    lang: postgres
    title: Die Race Condition hat schon zugeschlagen
    prompt: |
      Am 9. März ist das Loft (`raum_id = 2`) doppelt vergeben: Zwei **bestätigte** Buchungen überschneiden sich, entstanden durch zwei gleichzeitige Requests. Räume diese Daten auf und sorge dafür, dass es nie wieder passiert – in **einer Transaktion**, die am Ende committet ist:

      1. Storniere von den beiden überlappenden Buchungen die **später angelegte** (größere `id`): `status = 'storniert'`.
      2. Schließe für alle Sitzungen aus, dass sich zwei **bestätigte** Buchungen desselben Raums zeitlich überschneiden. Zeiträume sind halboffen: Eine Buchung bis 12:00 und eine ab 12:00 überschneiden sich nicht. Stornierte Buchungen blockieren nichts.

      Geprüft werden der Status aller Buchungen, Probe-Inserts (überlappend, direkt danach, storniert überlappend, anderer Raum) und ob die Transaktion abgeschlossen ist.
    schema: |
      CREATE TABLE raeume (
        id   int PRIMARY KEY,
        name text NOT NULL
      );
      CREATE TABLE buchungen (
        id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        raum_id     int NOT NULL REFERENCES raeume (id),
        mitglied_id int NOT NULL,
        beginn      timestamptz NOT NULL,
        ende        timestamptz NOT NULL,
        status      text NOT NULL DEFAULT 'bestaetigt',
        CHECK (ende > beginn)
      );
      INSERT INTO raeume VALUES (2, 'Loft'), (4, 'Atelier');
      INSERT INTO buchungen (raum_id, mitglied_id, beginn, ende, status) VALUES
        (2, 4, '2026-03-09 09:00', '2026-03-09 10:00', 'bestaetigt'),
        (2, 7, '2026-03-09 10:00', '2026-03-09 12:00', 'bestaetigt'),
        (2, 9, '2026-03-09 10:30', '2026-03-09 11:30', 'bestaetigt'),
        (2, 3, '2026-03-09 13:00', '2026-03-09 15:00', 'storniert'),
        (2, 5, '2026-03-09 14:00', '2026-03-09 15:00', 'bestaetigt'),
        (4, 9, '2026-03-09 10:30', '2026-03-09 11:30', 'bestaetigt');
    starter: |
      BEGIN;
      -- 1. Überschneidung finden und die spätere Buchung stornieren

      -- 2. Doppelbuchungen für alle Sitzungen ausschließen

      COMMIT;
    solution: |
      BEGIN;
      UPDATE buchungen AS spaeter
      SET status = 'storniert'
      FROM buchungen AS frueher
      WHERE spaeter.raum_id = frueher.raum_id
        AND spaeter.id > frueher.id
        AND spaeter.status = 'bestaetigt'
        AND frueher.status = 'bestaetigt'
        AND tstzrange(spaeter.beginn, spaeter.ende) && tstzrange(frueher.beginn, frueher.ende);
      CREATE EXTENSION IF NOT EXISTS btree_gist;
      ALTER TABLE buchungen ADD CONSTRAINT keine_doppelbuchung
        EXCLUDE USING gist (raum_id WITH =, tstzrange(beginn, ende) WITH &&)
        WHERE (status = 'bestaetigt');
      COMMIT;
    check: |
      SELECT (SELECT string_agg(id || ':' || status, ', ' ORDER BY id) FROM buchungen) AS buchungen,
             lp.versuch($$INSERT INTO buchungen (raum_id, mitglied_id, beginn, ende) VALUES (2, 8, '2026-03-09 11:30', '2026-03-09 12:30')$$) AS ueberschneidung,
             lp.versuch($$INSERT INTO buchungen (raum_id, mitglied_id, beginn, ende) VALUES (2, 8, '2026-03-09 12:00', '2026-03-09 13:00')$$) AS direkt_danach,
             lp.versuch($$INSERT INTO buchungen (raum_id, mitglied_id, beginn, ende, status) VALUES (2, 8, '2026-03-09 11:00', '2026-03-09 12:00', 'storniert')$$) AS storniert_ueberlappend,
             lp.versuch($$INSERT INTO buchungen (raum_id, mitglied_id, beginn, ende) VALUES (4, 8, '2026-03-09 09:00', '2026-03-09 10:30')$$) AS anderer_raum,
             now() = statement_timestamp() AS abgeschlossen;
    hints:
      - "Finde die Überschneidung mit einem Self-Join: gleicher Raum, beide bestätigt, `tstzrange(a.beginn, a.ende) && tstzrange(b.beginn, b.ende)`, `a.id < b.id`."
      - Ein Exclusion Constraint auf `raum_id` (mit `=`) und dem Zeitraum (mit `&&`) braucht für `=` auf `int` in einem GiST-Index die Erweiterung `btree_gist`.
      - "`EXCLUDE USING gist (raum_id WITH =, tstzrange(beginn, ende) WITH &&) WHERE (status = 'bestaetigt')`. Ohne das Stornieren vorher scheitert er an den vorhandenen Daten."
    explanation: |
      Die Überschneidung liegt zwischen Buchung 2 (10:00–12:00) und Buchung 3 (10:30–11:30), also wird 3 storniert. Buchung 5 überschneidet sich nur mit der stornierten 4 und bleibt, Buchung 6 liegt im Atelier. Erst danach lässt sich der Exclusion Constraint anlegen, vorher scheitert er mit `could not create exclusion constraint`. Weil beides in einer Transaktion steht, bleibt bei einem Fehler auch die Stornierung ungeschehen, und das Schema ist nie halb umgebaut. `tstzrange(beginn, ende)` ist standardmäßig halboffen `[)`, deshalb ist die Buchung ab 12:00 erlaubt. `WHERE (status = 'bestaetigt')` nimmt Stornierungen aus. Der Constraint löst das Problem aus diesem Modul an der Wurzel: Er gilt auch für zwei gleichzeitige Transaktionen. Die zweite wartet auf die erste und scheitert nach deren Commit mit `exclusion_violation` (SQLSTATE 23P01). `abgeschlossen` vergleicht Transaktionsbeginn und Anweisungsbeginn. Beide sind nur gleich, wenn die Prüfabfrage eine eigene Transaktion ist, also keine von dir mehr offen war.
    resources:
      - title: PostgreSQL · Exclusion Constraints
        url: https://www.postgresql.org/docs/current/ddl-constraints.html#DDL-CONSTRAINTS-EXCLUSION
      - title: PostgreSQL · btree_gist
        url: https://www.postgresql.org/docs/current/btree-gist.html
