id: isolation-sperren
title: Isolation und Sperren
level: 3
minutes: 180
summary: Was gleichzeitige Transaktionen voneinander sehen und wie du Lost Updates, Write Skew und Deadlocks verhinderst – mit MVCC, Isolationsstufen, atomaren Updates, Zeilensperren, optimistischem Locking, SKIP LOCKED und Advisory Locks.
goals:
  - Du erklärst MVCC mit `xmin` und `xmax` und begründest, warum Leser in PostgreSQL keine Schreiber blockieren.
  - Du sagst für Read Committed, Repeatable Read und Serializable vorher, was eine Transaktion von gleichzeitigen Änderungen sieht und welche Fehler die Anwendung behandeln muss.
  - Du erkennst Lost Updates in Read-Modify-Write-Code und behebst sie mit atomaren Updates, `SELECT … FOR UPDATE` oder einer `version`-Spalte.
  - Du verhinderst Write Skew wie Doppelbuchungen mit Constraints, Sperren auf einer Elternzeile oder Serializable mit Wiederholung bei SQLSTATE 40001.
  - Du baust Job-Warteschlangen mit `FOR UPDATE SKIP LOCKED`, setzt Advisory Locks und `lock_timeout` gezielt ein und vermeidest Deadlocks durch eine feste Sperrreihenfolge.
