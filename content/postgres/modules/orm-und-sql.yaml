id: orm-und-sql
title: SQL hinter dem ORM
level: 2
minutes: 150
summary: Sehen, welches SQL SQLAlchemy und Prisma erzeugen, N+1 im Log erkennen und beheben, Eingaben nur als Parameter übergeben und wissen, wann die Session schreibt, wie lange Transaktion und Verbindung offen sind und wann Raw SQL die bessere Wahl ist.
goals:
  - Du schaltest das SQL-Logging in SQLAlchemy und Prisma ein und liest das erzeugte SQL samt Parametern.
  - Du erkennst N+1 im Log, sagst die Zahl der Abfragen vorher und behebst es mit `selectinload`, `joinedload` oder `include`.
  - Du übergibst Eingaben nur als gebundene Parameter und findest SQL-Injection in `text()`, `$queryRawUnsafe` und dynamischem `ORDER BY`.
  - Du erklärst, wann die Session flusht und committet, und hältst Transaktion und Verbindung im Web-Request kurz.
  - Du schreibst das SQL, das ein ORM-Aufruf schicken sollte – Liste mit Join, Zählung, Massen-Update, Upsert – selbst.
