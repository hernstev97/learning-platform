lesson: |
  Die Deskwerk-App wächst. Mitglieder wollen Sprache und Benachrichtigungen einstellen, die Raumsuche soll nach Ausstattung und freien Zeiten filtern und Tippfehler verzeihen, und das Dashboard zeigt den Umsatz je Raum. Ein ORM bildet so etwas gern mit Textspalten, Hilfstabellen und Python-Schleifen ab. PostgreSQL bringt für genau diese Aufgaben eigene Typen und Funktionen mit. Jede davon hat eine Falle, die du kennen musst, bevor sie in Produktion geht.

  Ob sich ein solcher Typ statt einer Tabelle lohnt, entscheidest du mit den Fragen aus [Datenmodellierung](/postgres/datenmodellierung). Die Indexe, die diese Typen schnell machen (GIN, GiST), behandelt [Indexe](/postgres/indexe). Hier steht, wie die Features sich verhalten.

  ## JSONB: Dokumente in einer Spalte

  PostgreSQL hat zwei JSON-Typen. `json` speichert den Text unverändert. `jsonb` zerlegt ihn beim Speichern in ein Binärformat: Leerzeichen und Schlüsselreihenfolge gehen verloren, bei doppelten Schlüsseln gewinnt der letzte, dafür sind Abfragen schnell und indexierbar. In Anwendungen nimmst du fast immer `jsonb`.

  ```postgres run
  CREATE TABLE mitglieder (
    id            int GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    name          text  NOT NULL,
    einstellungen jsonb NOT NULL DEFAULT '{}'
  );
  INSERT INTO mitglieder (name, einstellungen) VALUES
    ('Anna Krüger',   '{"sprache": "de", "benachrichtigungen": {"email": true, "push": false}, "lieblingsraeume": [3, 7]}'),
    ('Mehmet Yılmaz', '{"sprache": "en", "benachrichtigungen": {"email": false}}'),
    ('Lena Vogel',    '{}');

  SELECT name,
         einstellungen -> 'benachrichtigungen'          AS als_jsonb,
         einstellungen ->> 'sprache'                    AS sprache,
         einstellungen #>> '{benachrichtigungen,email}' AS email,
         einstellungen ? 'sprache'                      AS hat_sprache
  FROM mitglieder
  ORDER BY id;

  -- Wer will E-Mails? Containment mit @>
  SELECT name FROM mitglieder
  WHERE einstellungen @> '{"benachrichtigungen": {"email": true}}';

  -- Lieblingsraum 7, mit jsonpath
  SELECT name FROM mitglieder
  WHERE einstellungen @? '$.lieblingsraeume[*] ? (@ == 7)';

  -- Einen Pfad ändern, ohne den Rest zu überschreiben
  UPDATE mitglieder
  SET einstellungen = jsonb_set(einstellungen, '{benachrichtigungen,push}', 'true')
  WHERE id IN (2, 3)
  RETURNING name, einstellungen;
  ```

  `->` liefert wieder `jsonb`, `->>` Text; `#>` und `#>>` folgen einem Pfad ([JSONB-Operatoren](https://www.postgresql.org/docs/current/functions-json.html#FUNCTIONS-JSONB-OP-TABLE)). `?` prüft, ob ein Schlüssel auf oberster Ebene existiert. `@>` fragt, ob das linke Dokument das rechte enthält, und ist typgenau: `{"email": true}` passt nicht auf `{"email": "true"}` ([Containment](https://www.postgresql.org/docs/current/datatype-json.html#JSON-CONTAINMENT)). Für komplexere Bedingungen gibt es jsonpath mit `@?` und `jsonb_path_query`. Das `UPDATE` zeigt die Falle von `jsonb_set`: Bei Mehmet setzt es `push`, bei Lena bleibt `{}` stehen, weil der Zwischenschlüssel `benachrichtigungen` fehlt. `jsonb_set` legt nur das letzte Pfadelement an.

  Wann JSONB? Für Daten, deren Struktur sich oft ändert und die die App vor allem als Ganzes liest: Einstellungen, Rohdaten eines Webhooks, optionale Zusatzangaben. Alles, was einen Fremdschlüssel, einen Typ mit Rechenregeln (`numeric` für Preise) oder einen `CHECK` braucht, gehört in Spalten. Die Doku empfiehlt auch für JSON eine halbwegs feste Struktur und kleine Dokumente, weil jedes Update die ganze Zeile sperrt und neu schreibt ([Designing JSON Documents](https://www.postgresql.org/docs/current/datatype-json.html#JSON-DOC-DESIGN)). `@>`, `?` und `@?` kann ein GIN-Index beschleunigen.

  > [!PRAXIS] JSONB im ORM
  > SQLAlchemy erkennt Änderungen *innerhalb* eines JSON-Dicts nicht: `mitglied.einstellungen["sprache"] = "en"` und `commit()` schreiben nichts. Entweder du weist ein neues Dict zu, oder du deklarierst die Spalte mit `MutableDict.as_mutable(JSONB)` ([SQLAlchemy · JSON](https://docs.sqlalchemy.org/en/21/core/type_basics.html#sqlalchemy.types.JSON)). `MutableDict` bemerkt nur Änderungen auf oberster Ebene; `einstellungen["benachrichtigungen"]["push"] = True` bleibt auch damit unbemerkt. Im Review fällt der Fehler auf, wenn ein Test nur das Python-Objekt prüft statt neu zu laden.

  ## Arrays und Ranges: Listen und Zeiträume als ein Wert

  Jeder Typ hat einen Array-Typ: `text[]`, `int[]`. Für kurze Etikettenlisten ohne eigene Attribute ist das bequemer als eine Verbindungstabelle:

  ```postgres run
  CREATE TABLE raeume (
    id          int GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    name        text   NOT NULL,
    ausstattung text[] NOT NULL DEFAULT '{}'
  );
  INSERT INTO raeume (name, ausstattung) VALUES
    ('Atelier', '{beamer,whiteboard}'),
    ('Loft',    '{beamer,stehtisch,whiteboard}'),
    ('Box 1',   '{}');

  SELECT name, ausstattung[1] AS erstes, cardinality(ausstattung) AS anzahl
  FROM raeume ORDER BY id;
  SELECT name FROM raeume WHERE 'beamer' = ANY (ausstattung) ORDER BY name;
  SELECT name FROM raeume WHERE ausstattung @> '{beamer,stehtisch}';
  -- Eine Zeile je Element, dann je Merkmal wieder eingesammelt
  SELECT a.merkmal, array_agg(r.name ORDER BY r.name) AS raeume
  FROM raeume AS r
  CROSS JOIN unnest(r.ausstattung) AS a (merkmal)
  GROUP BY a.merkmal
  ORDER BY a.merkmal;
  ```

  Arrays zählen ab 1. `= ANY (…)` prüft ein Element, `@>` „enthält alle“, `&&` „mindestens eines gemeinsam“. `unnest` macht aus einem Array Zeilen, `array_agg` aus Zeilen ein Array. Die Doku warnt selbst: „Arrays are not sets“ – wer oft nach einzelnen Elementen sucht, braucht vielleicht eine eigene Tabelle ([Searching in Arrays](https://www.postgresql.org/docs/current/arrays.html#ARRAYS-SEARCHING)). Elemente eines Arrays können außerdem keinen Fremdschlüssel tragen.

  Ein **Range** speichert einen Zeitraum als einen Wert mit unterer und oberer Grenze. `tstzrange(beginn, ende)` ist standardmäßig halboffen, `[)`: Der Beginn gehört dazu, das Ende nicht ([Inclusive and Exclusive Bounds](https://www.postgresql.org/docs/current/rangetypes.html#RANGETYPES-INCLUSIVITY)). Damit stoßen zwei Buchungen 9–11 und 11–12:30 aneinander, ohne sich zu überschneiden.

  ```postgres run
  CREATE TABLE buchungen (
    id       bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    raum_id  int       NOT NULL,
    zeitraum tstzrange NOT NULL
  );
  INSERT INTO buchungen (raum_id, zeitraum) VALUES
    (1, '[2026-03-02 09:00, 2026-03-02 11:00)'),
    (1, tstzrange('2026-03-02 11:00', '2026-03-02 12:30')),
    (2, '[2026-03-28 22:00, 2026-03-29 06:00)');

  SELECT id, zeitraum, upper(zeitraum) - lower(zeitraum) AS dauer
  FROM buchungen ORDER BY id;

  SELECT b1.zeitraum && b2.zeitraum  AS ueberlappen,
         b1.zeitraum -|- b2.zeitraum AS grenzen_aneinander,
         b1.zeitraum @> timestamptz '2026-03-02 11:00' AS enthaelt_11_uhr
  FROM buchungen AS b1, buchungen AS b2
  WHERE b1.id = 1 AND b2.id = 2;

  -- Belegte und freie Zeiten von Raum 1 zwischen 8 und 18 Uhr
  SELECT range_agg(zeitraum) AS belegt,
         tstzmultirange(tstzrange('2026-03-02 08:00', '2026-03-02 18:00')) - range_agg(zeitraum) AS frei
  FROM buchungen WHERE raum_id = 1;
  ```

  Die Nachtbuchung vom 28. auf den 29. März dauert sieben Stunden, nicht acht: In der Nacht beginnt die Sommerzeit, und `timestamptz` rechnet mit echten Zeitpunkten. `&&` (überlappt), `@>` (enthält) und `-|-` (grenzt an) sind die wichtigsten Range-Operatoren. Seit PostgreSQL 14 fasst `range_agg` Ranges zu einer Multirange zusammen; die Differenz liefert die freien Lücken. Den Schutz gegen Doppelbuchungen mit einem Exclusion Constraint auf `&&` zeigt [Constraints](/postgres/constraints).

  ## Generierte Spalten, Identity und uuidv7

  Eine **generierte Spalte** berechnet PostgreSQL aus anderen Spalten derselben Zeile. `STORED` (seit PostgreSQL 12) rechnet beim Schreiben und speichert das Ergebnis. `VIRTUAL` (seit PostgreSQL 18 und dort der Standard) rechnet beim Lesen und belegt keinen Platz ([Generated Columns](https://www.postgresql.org/docs/current/ddl-generated-columns.html)). Eine **Identity-Spalte** zieht ihre Werte aus einer Sequenz und ersetzt das ältere `serial`.

  ```postgres run fails
  CREATE TABLE buchungen (
    id              bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    oeffentliche_id uuid NOT NULL DEFAULT uuidv7() UNIQUE,
    beginn          timestamptz  NOT NULL,
    ende            timestamptz  NOT NULL,
    netto           numeric(8,2) NOT NULL,
    brutto          numeric(8,2) GENERATED ALWAYS AS (round(netto * 1.19, 2)) VIRTUAL,
    zeitraum        tstzrange    GENERATED ALWAYS AS (tstzrange(beginn, ende)) STORED
  );
  INSERT INTO buchungen (beginn, ende, netto)
  VALUES ('2026-03-02 09:00+01', '2026-03-02 11:30+01', 60.00)
  RETURNING id, brutto, zeitraum, uuid_extract_version(oeffentliche_id) AS uuid_version;
  UPDATE buchungen SET netto = 80.00 WHERE id = 1 RETURNING netto, brutto;
  -- Eine eigene id: abgelehnt
  INSERT INTO buchungen (id, beginn, ende, netto)
  VALUES (99, '2026-03-03 09:00+01', '2026-03-03 10:00+01', 30.00);
  ```

  Generierte Spalten lassen sich nicht schreiben (`column "brutto" can only be updated to DEFAULT`), und der Ausdruck darf nur `IMMUTABLE`-Funktionen verwenden. `now()` scheitert deshalb mit `generation expression is not immutable`, ebenso `concat_ws`. In PostgreSQL 18 lässt sich eine virtuelle Spalte nicht indexieren (`indexes on virtual generated columns are not supported`). Deshalb ist `zeitraum` hier `STORED`: Er soll einen GiST-Index tragen.

  `GENERATED ALWAYS AS IDENTITY` lehnt eigene Werte ab, außer mit `OVERRIDING SYSTEM VALUE`. `BY DEFAULT` nimmt sie an, die Sequenz weiß aber nichts davon: Nach einem Import mit festen IDs scheitert das nächste normale `INSERT` mit `duplicate key`, bis jemand die Sequenz nachzieht ([Identity Columns](https://www.postgresql.org/docs/current/ddl-identity-columns.html)).

  `uuidv7()` ist neu in PostgreSQL 18 ([UUID Functions](https://www.postgresql.org/docs/current/functions-uuid.html)). Anders als `gen_random_uuid()` (Version 4, rein zufällig) beginnt eine UUIDv7 mit einem Zeitstempel in Millisekunden. Neue Werte landen im B-Baum-Index deshalb am Ende statt an zufälligen Stellen, das hält den Index kompakt. Der Preis: `uuid_extract_timestamp(id)` verrät jedem, der die ID sieht, wann der Datensatz entstand.

  > [!INTERVIEW] „bigint oder UUID als Primärschlüssel?“
  > `bigint` mit Identity ist klein, schnell und lesbar, verrät aber Reihenfolge und Menge (`/buchungen/1042`). UUIDs lassen sich ohne Datenbank erzeugen, etwa offline im Client, und sind nicht erratbar. Zufällige UUIDv4 verteilen Einfügungen über den ganzen Index; UUIDv7 ist zeitlich sortiert und vermeidet das, legt aber den Erstellungszeitpunkt offen. Ein verbreiteter Mittelweg: intern `bigint`, nach außen eine zusätzliche `uuid`-Spalte mit `UNIQUE`.

  ## Enum-Typen

  Ein Enum ist ein eigener Typ mit fester, geordneter Werteliste:

  ```postgres run fails
  CREATE TYPE buchungsstatus AS ENUM ('angefragt', 'bestaetigt', 'storniert');
  CREATE TABLE buchungen (
    id     int PRIMARY KEY,
    status buchungsstatus NOT NULL DEFAULT 'angefragt'
  );
  INSERT INTO buchungen VALUES (1, 'storniert'), (2, 'bestaetigt'), (3, DEFAULT);
  -- Sortiert in der Reihenfolge der Definition, nicht alphabetisch
  SELECT id, status FROM buchungen ORDER BY status;
  ALTER TYPE buchungsstatus ADD VALUE 'abgeschlossen' AFTER 'bestaetigt';
  SELECT enum_range(NULL::buchungsstatus);
  INSERT INTO buchungen VALUES (4, 'Storniert');
  ```

  Ein Enum-Wert belegt vier Bytes, Vergleiche folgen der Definitionsreihenfolge, und Groß-/Kleinschreibung zählt. Werte lassen sich mit `ALTER TYPE … ADD VALUE` ergänzen, aber nicht entfernen oder umsortieren, ohne den Typ neu anzulegen. Ein in einer Transaktion hinzugefügter Wert ist erst nach dem `COMMIT` benutzbar, was manche Migrationswerkzeuge stolpern lässt. Prisma-`enum` und SQLAlchemys `Enum` legen solche Typen an. Wann ein `CHECK` oder eine Lookup-Tabelle besser passt, steht in [Datenmodellierung](/postgres/datenmodellierung).

  ## Volltextsuche und unscharfe Suche

  `LIKE '%whiteboards%'` findet das „große Whiteboard“ nicht: `LIKE` vergleicht Zeichen, keine Wörter, und unterscheidet Groß- und Kleinschreibung. Mit führendem `%` kann es außerdem keinen B-Baum-Index nutzen. Die Volltextsuche zerlegt Text in normalisierte Wortstämme (`tsvector`) und vergleicht sie mit einer Suchanfrage (`tsquery`). Die Konfiguration `german` entfernt Stoppwörter und reduziert Wörter auf ihren Stamm.

  ```postgres run
  CREATE EXTENSION pg_trgm;
  CREATE TABLE raeume (
    id           int GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    name         text NOT NULL,
    beschreibung text NOT NULL,
    suche        tsvector GENERATED ALWAYS AS (to_tsvector('german', name || ' ' || beschreibung)) STORED
  );
  CREATE INDEX raeume_suche ON raeume USING gin (suche);
  INSERT INTO raeume (name, beschreibung) VALUES
    ('Atelier', 'Heller Meetingraum mit großem Whiteboard und Beamer'),
    ('Loft',    'Ruhige Ecke unter dem Dach, zwei Whiteboards, kein Beamer'),
    ('Box 1',   'Schallgedämmte Telefonbox für Videocalls');

  SELECT to_tsvector('german', 'Ruhige Ecke unter dem Dach, zwei Whiteboards');
  SELECT websearch_to_tsquery('german', 'ruhig whiteboard -telefon');
  SELECT name FROM raeume
  WHERE suche @@ websearch_to_tsquery('german', '"zwei whiteboards" OR videocall')
  ORDER BY name;
  -- Tippfehler: Volltext findet nichts, Trigramme schon
  SELECT count(*) FROM raeume WHERE suche @@ websearch_to_tsquery('german', 'Ateleir');
  SELECT name, round(similarity(name, 'Ateleir')::numeric, 2) AS aehnlichkeit
  FROM raeume
  WHERE name % 'Ateleir';
  ```

  `websearch_to_tsquery` versteht die Syntax eines Suchfelds: Anführungszeichen für Phrasen, `OR`, `-` für „nicht“. Es wirft bei Eingaben von Nutzern keine Syntaxfehler, anders als `to_tsquery` ([Parsing Queries](https://www.postgresql.org/docs/current/textsearch-controls.html#TEXTSEARCH-PARSING-QUERIES)). Die gespeicherte `tsvector`-Spalte mit GIN-Index ist das übliche Muster ([Creating Indexes](https://www.postgresql.org/docs/current/textsearch-tables.html#TEXTSEARCH-TABLES-INDEX)). Ein Ausdrucksindex auf `to_tsvector('german', …)` geht auch und spart Platz, greift aber nur, wenn die Abfrage genau denselben Ausdruck wiederholt. Zwei Grenzen: Der Stemmer zerlegt keine Komposita, „Telefonbox“ wird nicht zu „telefon“, und Tippfehler findet die Volltextsuche nicht.

  Für Tippfehler gibt es die Erweiterung `pg_trgm`. Sie zerlegt Text in Dreiergruppen von Zeichen (Trigramme) und misst die Ähnlichkeit zweier Texte von 0 bis 1. `%` ist wahr, wenn die Ähnlichkeit über der Schwelle `pg_trgm.similarity_threshold` liegt (Standard 0,3). Ein GIN-Index mit `gin_trgm_ops` beschleunigt `%` und auch `LIKE '%…%'` ([pg_trgm](https://www.postgresql.org/docs/current/pgtrgm.html)). Erweiterungen aktivierst du je Datenbank mit `CREATE EXTENSION`; welche verfügbar sind, zeigt `pg_available_extensions`.

  ## Views, Materialized Views und LISTEN/NOTIFY

  Eine **View** ist eine gespeicherte Abfrage: Sie enthält keine Daten und zeigt immer den aktuellen Stand. Eine **Materialized View** speichert das Ergebnis wie eine Tabelle; sie bleibt auf dem alten Stand, bis jemand `REFRESH` ausführt.

  ```postgres run
  CREATE TABLE buchungen (
    id     int PRIMARY KEY,
    raum   text NOT NULL,
    status text NOT NULL,
    preis  numeric(8,2) NOT NULL
  );
  INSERT INTO buchungen VALUES
    (1, 'Atelier', 'bestaetigt', 90.00), (2, 'Loft', 'bestaetigt', 120.00),
    (3, 'Atelier', 'storniert', 45.00),  (4, 'Atelier', 'bestaetigt', 45.00);

  CREATE VIEW bestaetigte_buchungen AS
    SELECT id, raum, preis FROM buchungen WHERE status = 'bestaetigt';
  CREATE MATERIALIZED VIEW umsatz_je_raum AS
    SELECT raum, count(*) AS buchungen, sum(preis) AS umsatz
    FROM bestaetigte_buchungen
    GROUP BY raum;

  INSERT INTO buchungen VALUES (5, 'Loft', 'bestaetigt', 60.00);
  SELECT count(*) AS in_der_view FROM bestaetigte_buchungen;
  SELECT * FROM umsatz_je_raum ORDER BY raum;

  CREATE UNIQUE INDEX ON umsatz_je_raum (raum);
  REFRESH MATERIALIZED VIEW CONCURRENTLY umsatz_je_raum;
  SELECT * FROM umsatz_je_raum ORDER BY raum;
  ```

  Ein normales `REFRESH` sperrt die Materialized View, Leser warten. `CONCURRENTLY` berechnet neu und tauscht nur die geänderten Zeilen aus, Leser sehen währenddessen den alten Stand. Dafür braucht PostgreSQL einen Unique-Index auf Spalten, ohne `WHERE` und ohne Ausdruck ([REFRESH MATERIALIZED VIEW](https://www.postgresql.org/docs/current/sql-refreshmaterializedview.html)). Fehlt er, meldet es `cannot refresh materialized view … concurrently`. Wer den Refresh auslöst (Cronjob, Worker nach jeder Buchung), entscheidet die Anwendung.

  `LISTEN` und `NOTIFY` schicken Nachrichten zwischen Sitzungen, etwa „neue Buchung“ an einen Dienst, der Bestätigungsmails versendet. Mit psycopg sieht der Empfänger so aus:

  ```python
  import psycopg

  with psycopg.connect(DSN, autocommit=True) as conn:
      conn.execute("LISTEN buchungen")
      for notify in conn.notifies():
          versende_bestaetigung(int(notify.payload))
  ```

  Gesendet wird mit `NOTIFY buchungen, '1042'` oder `pg_notify('buchungen', …)`, gern aus einem Trigger. Nachrichten kommen erst beim `COMMIT` an und werden nicht gespeichert: Wer gerade nicht lauscht, verpasst sie ([NOTIFY](https://www.postgresql.org/docs/current/sql-notify.html)). Hinter PgBouncer im Transaction-Modus funktioniert `LISTEN` nicht. Für Aufgaben, die nicht verloren gehen dürfen, ist eine Job-Tabelle mit `FOR UPDATE SKIP LOCKED` robuster ([Isolation und Sperren](/postgres/isolation-sperren)); `NOTIFY` kann sie zusätzlich wecken.

  > [!WARNING] Materialized Views sind Caches
  > Eine Materialized View zeigt den Stand des letzten `REFRESH`. Steht im Dashboard „Umsatz heute“, muss daneben stehen, wie alt die Zahl ist. Für Werte, die sofort stimmen müssen, nimm eine normale View oder eine Abfrage mit passendem Index.

  ## Häufige Fehler

  - **`->` statt `->>` im Vergleich.** `einstellungen -> 'sprache' = 'de'` scheitert mit `invalid input syntax for type json`, weil `'de'` als JSON gelesen wird. Für Text `->>`, für JSON-Werte `@>`.
  - **Strings statt Booleans in JSON.** `{"email": "true"}` passt nicht auf `@> '{"email": true}'`. Validiere JSON in der App oder mit einem `CHECK`.
  - **`jsonb_set` auf fehlendem Zwischenpfad.** Das Dokument bleibt unverändert, ohne Fehler. Zwischenobjekte vorher anlegen oder mit `||` zusammenführen.
  - **Arrays statt Tabellen.** Listen mit eigenen Attributen oder Verweisen auf andere Tabellen gehören in eine Verbindungstabelle.
  - **Geschlossene Ranges.** `tstzrange(beginn, ende, '[]')` lässt aneinandergrenzende Buchungen überlappen. Bleib bei `[)`.
  - **Virtuelle Spalte mit Index.** Geht in PostgreSQL 18 nicht. Spalten, die einen Index brauchen, als `STORED` anlegen.
  - **`BY DEFAULT`-Identity und Import.** Feste IDs beim Import bringen die Sequenz durcheinander. `ALWAYS` nehmen oder die Sequenz nach dem Import mit `setval` nachziehen.
  - **Enum-Wert entfernen.** Geht nicht. Für Listen, die schrumpfen, eine Lookup-Tabelle wählen.
  - **Volltext-Spalte ohne `coalesce`.** Ist eine Teilspalte `NULL`, wird der ganze Ausdruck `NULL`, und die Zeile ist unauffindbar.
  - **`REFRESH … CONCURRENTLY` ohne Unique-Index.** Index auf Spalten anlegen, ohne `WHERE`.

  ## Zusammenfassung

  - `jsonb` für flexible Dokumente, Spalten für alles mit Typ, Fremdschlüssel oder Regel. `->` liefert JSON, `->>` Text, `@>` prüft typgenau.
  - Arrays für kurze Etikettenlisten: `ANY`, `@>`, `unnest`, `array_agg`. Arrays zählen ab 1.
  - Ranges speichern Zeiträume halboffen `[)`. `&&`, `@>` und `-|-` vergleichen sie; `timestamptz` rechnet über die Zeitumstellung richtig.
  - Generierte Spalten: `STORED` für Indexe, `VIRTUAL` (Standard seit PostgreSQL 18) spart Platz. Nur `IMMUTABLE`-Ausdrücke.
  - Identity statt `serial`; `uuidv7()` (PostgreSQL 18) für zeitlich sortierte UUIDs, die den Erstellungszeitpunkt verraten.
  - Enums sind geordnet und erweiterbar, aber nicht verkleinerbar.
  - Volltext: `to_tsvector('german', …) @@ websearch_to_tsquery('german', …)` mit gespeicherter `tsvector`-Spalte und GIN-Index; Tippfehler mit `pg_trgm`.
  - Views sind immer aktuell, Materialized Views sind Caches; `REFRESH … CONCURRENTLY` braucht einen Unique-Index. `NOTIFY` weckt, speichert aber nichts.
