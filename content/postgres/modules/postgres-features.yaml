id: postgres-features
title: PostgreSQL-Features
level: 2
minutes: 160
summary: Was PostgreSQL über Standard-SQL hinaus mitbringt – JSONB, Arrays, Ranges, generierte Spalten, Identity, uuidv7, Enums, Volltextsuche, pg_trgm, Views und Materialized Views – und wann es das Modell klarer macht statt nur bequemer.
goals:
  - Du liest und änderst JSONB mit `->`, `->>`, `@>`, `?` und `jsonb_set` und begründest, welche Daten in JSONB gehören und welche in Spalten.
  - Du filterst Arrays mit `ANY` und `@>`, zerlegst sie mit `unnest` und rechnest mit halboffenen `tstzrange`-Zeiträumen, auch über die Zeitumstellung.
  - Du setzt generierte Spalten (`STORED` und `VIRTUAL`), Identity-Spalten und `uuidv7()` gezielt ein und kennst ihre Grenzen.
  - Du baust eine deutsche Volltextsuche mit `to_tsvector` und `websearch_to_tsquery` und ergänzt sie um unscharfe Suche mit `pg_trgm`.
  - Du unterscheidest View und Materialized View und richtest `REFRESH … CONCURRENTLY` ein.
