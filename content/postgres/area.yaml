id: postgres
title: SQL & PostgreSQL für Anwendungsentwickler
short: PostgreSQL
tagline: Verstehen, was unter dem ORM passiert – vom Datenmodell bis zum Query-Plan.
description: >
  Das relationale Modell, Abfragen, Unterabfragen und CTEs, Datenänderungen mit RETURNING
  und Upsert. Danach Constraints, Normalisierung, Datenmodellierung und was PostgreSQL
  über Standard-SQL hinaus kann. Transaktionen, Isolation und Sperren, SQL aus dem ORM,
  Indexe, Query-Pläne, Performance und Schema-Migrationen ohne Ausfall. Ein echtes
  PostgreSQL 18 läuft direkt im Browser.
color: "#FF9F1C"
order: 9
outcomes:
  - Du erklärst das **relationale Modell** – Relationen, Schlüssel, NULL und Mengen – und liest Tabellen so, wie PostgreSQL sie sieht.
  - 'Du schreibst **Abfragen für Anwendungen** sicher: Joins, Aggregation, Unterabfragen, CTEs, Paginierung und Änderungen mit `RETURNING` und `ON CONFLICT`.'
  - 'Du entwirfst **Datenmodelle**, die Fehler verhindern: normalisiert, mit Constraints, die die Regeln der Fachlichkeit in der Datenbank festhalten.'
  - Du nutzt **PostgreSQL-Features** wie JSONB, Arrays, Ranges, Exclusion Constraints und generierte Spalten dort, wo sie das Modell einfacher machen.
  - Du beherrschst **Transaktionen, Isolationsstufen und Sperren** und verhinderst Lost Updates und Doppelbuchungen.
  - Du liest **Query-Pläne**, setzt Indexe gezielt und findest die Ursache langsamer Abfragen – auch hinter einem ORM.
  - Du planst **Schema-Migrationen**, die im laufenden Betrieb ohne Ausfall durchgehen.
tracks:
  - title: Relationen und Abfragen
    description: Das relationale Modell, Abfragen für Listen und Berichte, Unterabfragen und CTEs, Daten schreiben mit RETURNING und Upsert.
    modules: [relationales-modell, abfragen, unterabfragen-ctes, daten-aendern]
  - title: Datenmodell und Integrität
    description: Constraints als letzte Verteidigungslinie, Normalisierung, Modellierung fachlicher Anforderungen und die Werkzeuge, die PostgreSQL dafür mitbringt.
    modules: [constraints, normalisierung, datenmodellierung, postgres-features]
  - title: Transaktionen und Anwendung
    description: Atomare Änderungen, Isolationsstufen, Sperren und Nebenläufigkeit, und was ein ORM daraus an SQL macht.
    modules: [transaktionen, isolation-sperren, orm-und-sql]
  - title: Performance und Betrieb
    description: Indexe, Query-Pläne, typische Performance-Probleme und Schema-Migrationen ohne Ausfall.
    modules: [indexe, query-plaene, performance, migrationen]
