projects:
  - id: legacy-normalisieren
    title: Die alte Buchungsliste normalisieren und migrieren
    level: 2
    hours: 10
    summary: Eine gewachsene Buchungstabelle aus dem Excel-Zeitalter wird in ein normalisiertes Schema mit Constraints überführt – mit Staging-Import, Bereinigung, nachprüfbarem Abgleich und einer Sicht, über die alte Berichte weiterlaufen.
    brief: |
      **Ausgangslage:** Bevor Deskwerk eine App hatte, standen alle Buchungen in einer Tabelle, die später eins zu eins nach PostgreSQL kopiert wurde: `buchungen_alt` mit den Spalten `datum`, `von`, `bis`, `standort`, `raum`, `raumart`, `stundenpreis`, `mitglied_name`, `mitglied_email`, `tarif`, `betrag` und `storniert`. Alles ist `text`. Die Buchhaltung exportiert daraus noch heute Monatsberichte. Seit Monaten widersprechen sich Zahlen, weil derselbe Raum mit zwei Preisen und dasselbe Mitglied mit drei Schreibweisen vorkommt.

      **Anforderungen:**

      - Erzeuge zuerst eine realistische Altdatei mit rund 5 000 Zeilen und eingebauten Fehlern: Preise mit Komma (`25,00`), Uhrzeiten als `9:00` und `09:00`, E-Mails in gemischter Schreibweise, ein Raum mit zwei Standorten, `storniert` als `ja`, `x` und leer, einige Zeilen ohne E-Mail und Buchungen über die Zeitumstellung am 29. 3. 2026.
      - Zielschema in 3NF: `standorte`, `raeume`, `mitglieder`, `buchungen` mit Primär- und Fremdschlüsseln, `NOT NULL`, `CHECK`, `UNIQUE` und `timestamptz` für Zeitpunkte in `Europe/Berlin`. Der Preis zum Buchungszeitpunkt bleibt als Snapshot in `buchungen.preis`.
      - Migration als wiederholbares SQL-Skript: Staging, Bereinigung, `INSERT … SELECT DISTINCT` in die Stammdaten, Buchungen mit Join auf die neuen IDs. Das Skript läuft in einer Transaktion und bricht beim ersten Fehler ab.
      - Zeilen, die sich nicht eindeutig zuordnen lassen, landen in einer Tabelle `migration_konflikte` mit Grund, statt still zu verschwinden.
      - Ein Abgleich belegt, dass nichts verloren ging: Zeilenzahl und Umsatzsumme je Monat vorher und nachher.
      - Eine View `buchungen_alt_v` liefert für die alten Berichte dieselben Spalten wie früher, aber aus den neuen Tabellen.

      **Rahmen:** PostgreSQL 18 lokal (Docker oder nativ) und psql; kein ORM. Grundlage sind die Module [Normalisierung](/postgres/normalisierung), [Constraints](/postgres/constraints), [Daten ändern](/postgres/daten-aendern) und [Das relationale Modell](/postgres/relationales-modell).
    skills: [normalisierung, constraints, insert-select, copy, datenbereinigung, transaktionen, views]
    steps:
      - id: altdaten-erzeugen
        title: Altdaten mit echten Fehlern erzeugen
        detail: Schreibe ein kleines Skript in Python oder SQL mit `generate_series`, das die Altdatei als CSV erzeugt, und notiere jeden Fehler, den du absichtlich einbaust. Diese Liste ist später deine Checkliste für die Bereinigung. Lade die Datei mit `\copy buchungen_alt FROM 'buchungen_alt.csv' CSV HEADER` in eine Tabelle, deren Spalten alle `text` sind.
      - id: abhaengigkeiten-finden
        title: Funktionale Abhängigkeiten und Anomalien belegen
        detail: "Prüfe mit `GROUP BY … HAVING count(DISTINCT …) > 1`, welche Abhängigkeiten in den Daten tatsächlich gelten, etwa Raum → Standort, Raum → Stundenpreis, E-Mail → Name. Jede Verletzung ist entweder ein Datenfehler oder eine Regel, die du falsch angenommen hast. Halte die Ergebnisse als Tabelle im README fest."
      - id: zielschema
        title: Zielschema mit Constraints entwerfen
        detail: Zeichne das Schema als Text-ER-Diagramm und schreibe das DDL. Begründe jede Entscheidung, die nicht offensichtlich ist – etwa ob die E-Mail per `lower()` eindeutig sein soll und warum `buchungen.preis` trotz `raeume.preis_pro_stunde` bleibt.
      - id: bereinigung
        title: Staging bereinigen
        detail: Normalisiere in einer Staging-Tabelle Schreibweisen, Zahlen und Zeiten mit `trim`, `lower`, `replace` und Casts. Baue die Zeitpunkte aus Datum und Uhrzeit mit `(datum || ' ' || von)::timestamp AT TIME ZONE 'Europe/Berlin'` und prüfe die Zeilen am 29. 3. 2026 von Hand. Was sich nicht reparieren lässt, schreibst du mit Grund nach `migration_konflikte`.
      - id: migrationsskript
        title: Migrationsskript in einer Transaktion
        detail: Fülle die Stammdaten mit `INSERT … SELECT DISTINCT … RETURNING` und die Buchungen per Join über die natürlichen Schlüssel. Das Skript beginnt mit `\set ON_ERROR_STOP on` und `BEGIN`, endet mit `COMMIT` und lässt sich auf einer frischen Datenbank beliebig oft ausführen.
      - id: abgleich
        title: Abgleich vorher und nachher
        detail: Vergleiche je Monat Anzahl, Summe und Zahl der Stornos zwischen `buchungen_alt` und dem neuen Schema, ergänzt um die Konflikte. Jede Differenz muss erklärt sein. Lege die Abfrage als `abgleich.sql` ab, damit die Buchhaltung sie selbst ausführen kann.
      - id: kompatibilitaets-view
        title: Alte Berichte über eine View weiterbetreiben
        detail: Baue `buchungen_alt_v` so, dass ein alter Monatsbericht unverändert läuft, und weise mit einem Vergleich nach, dass er für bereinigte Monate dasselbe Ergebnis liefert. Halte im README fest, wann die View entfallen kann.
    acceptance:
      - id: schema-3nf
        text: Das Zielschema ist in 3NF; jede bewusste Ausnahme wie der Preis-Snapshot ist im README begründet.
      - id: constraints-greifen
        text: "`NOT NULL`, `CHECK`, `UNIQUE` und Fremdschlüssel sind gesetzt; ein Testskript zeigt für jede Regel eine abgelehnte Zeile."
      - id: skript-wiederholbar
        text: Das Migrationsskript läuft auf einer leeren Datenbank zweimal hintereinander fehlerfrei und mit demselben Ergebnis.
      - id: nichts-verloren
        text: Der Abgleich zeigt je Monat dieselbe Zahl an Buchungen und dieselbe Umsatzsumme wie vorher, abzüglich der dokumentierten Konflikte.
      - id: zeitumstellung
        text: Buchungen am 29. 3. 2026 haben nach der Migration die richtigen Zeitpunkte in `Europe/Berlin`.
    stretch:
      - Ergänze eine Historie der Raumpreise mit `daterange` und Exclusion Constraint und leite `buchungen.preis` für alte Buchungen daraus ab.
      - Spiele die Migration als Expand and Contract durch, so als liefe die alte Excel-Anbindung noch zwei Wochen parallel.
    portfolio: |
      Zeige zuerst das Problem in Zahlen: wie viele Schreibweisen eines Mitglieds, wie viele Räume mit widersprüchlichen Preisen, wie viel die Monatsberichte voneinander abwichen. Dann das Schema als Diagramm und die Abgleichstabelle vorher und nachher.

      Im Gespräch zeigt das Projekt, dass du Normalisierung als Werkzeug gegen echte Fehler verstehst, nicht als Theorie. Erwartbare Fragen: Warum 3NF und nicht mehr? Was ist mit Zeilen passiert, die nicht passten? Wie stellst du sicher, dass das Skript in Produktion dasselbe tut wie lokal?

  - id: slow-query-jagd
    title: Slow-Query-Jagd auf einer Million Buchungen
    level: 3
    hours: 14
    summary: Auf einem mit `generate_series` erzeugten, realistisch verteilten Datensatz findest du die langsamsten Abfragen einer Buchungs-App, machst sie mit Indexen und Umformulierungen schnell und belegst jede Verbesserung mit Plänen und Messwerten.
    brief: |
      **Ausgangslage:** Die Deskwerk-App ist mit dem dritten Standort langsam geworden. Niemand weiß, welche Abfragen schuld sind. Das Team hat Indexe nach Gefühl angelegt, einige davon doppelt. Du baust eine Datenbank mit Produktionsgröße nach, misst und behebst die Ursachen.

      **Anforderungen:**

      - Ein Seed-Skript nur in SQL erzeugt mit `generate_series` drei Standorte, 120 Räume, 20 000 Mitglieder, rund eine Million Buchungen über zwei Jahre ohne Überlappungen je Raum (8 % storniert, mehr Buchungen an Werktagen und am Vormittag) und fünf Millionen Check-ins. `mitglieder.einstellungen` ist `jsonb`. Das Skript ist deterministisch, etwa durch `setseed()` oder Werte, die aus der Laufnummer berechnet werden.
      - Die App schickt diese Abfragen; sie sind dein Ausgangspunkt:
        1. Buchungen eines Mitglieds, neueste zuerst, Seite 1 und Seite 200 per `OFFSET`.
        2. Freie Räume eines Standorts in einem Zeitfenster.
        3. Mitglied per E-Mail finden, ohne Rücksicht auf Groß- und Kleinschreibung.
        4. Monatsumsatz je Standort für einen Monat in `Europe/Berlin`, gefiltert mit `date_trunc` auf der Spalte.
        5. Mitglieder mit Newsletter-Einwilligung aus `einstellungen`.
        6. Check-ins der letzten 7 Tage je Standort.
        7. „Anzahl Buchungen gesamt“ für die Admin-Übersicht.
      - Je Abfrage: Plan und Zeit vorher, Ursache in einem Satz, Änderung (Index, Umformulierung oder beides), Plan und Zeit nachher.
      - Prüfe die Kosten deiner Indexe: Größe, Schreibzeit für 10 000 neue Buchungen vorher und nachher, unbenutzte oder doppelte Indexe.

      **Rahmen:** PostgreSQL 18 mit `pg_stat_statements` (in `shared_preload_libraries` eintragen, dann `CREATE EXTENSION`). Gemessen wird mit `EXPLAIN (ANALYZE, BUFFERS)` nach einem Warmlauf, jede Zahl als Median aus mindestens fünf Läufen. Grundlage sind die Module [Indexe](/postgres/indexe), [Query-Pläne lesen](/postgres/query-plaene) und [Performance](/postgres/performance).
    skills: [explain, indexe, generate-series, pg-stat-statements, keyset-paginierung, statistik, jsonb]
    steps:
      - id: datensatz-erzeugen
        title: Realistischen Datensatz erzeugen
        detail: Erzeuge Buchungen aus einem Raster Raum × Tag × Stunde und wähle daraus per Bedingung auf einem berechneten Wert aus. So entstehen keine Überlappungen, und die Verteilung bleibt steuerbar. Lege die Indexe der Fremdschlüssel erst nach dem Laden an, dann `ANALYZE`. Notiere Laufzeit und Größe der Datenbank.
      - id: messen
        title: Ausgangslage messen
        detail: Setze `pg_stat_statements_reset()`, führe ein Lastskript mit allen sieben Abfragen und wechselnden Parametern aus (`pgbench -f` mit eigenen Skripten oder ein kleines Python-Programm) und sortiere nach `total_exec_time`. Die Reihenfolge, in der du die Abfragen angehst, folgt dieser Liste, nicht deinem Gefühl.
      - id: plaene-lesen
        title: Pläne lesen und Ursachen benennen
        detail: Speichere für jede Abfrage den Plan als Textdatei. Markiere den teuersten Knoten, vergleiche geschätzte und echte Zeilen und benenne die Ursache in einem Satz, etwa „Funktion auf der Spalte verhindert den Index“ oder „OFFSET liest 4 000 Zeilen, um 20 zu zeigen“.
      - id: indexe-gezielt
        title: Indexe gezielt anlegen
        detail: Wähle für jede Abfrage den kleinsten passenden Index – mehrspaltig mit der richtigen Reihenfolge, partiell, auf einen Ausdruck, GIN für `jsonb`, GiST für Zeiträume. Lege sie mit `CREATE INDEX CONCURRENTLY` an, als wäre die Datenbank in Betrieb. Prüfe, ob ein Index mehrere Abfragen bedient.
      - id: umformulieren
        title: Abfragen umformulieren
        detail: Manche Abfragen werden nur durch Umschreiben schnell – Keyset statt `OFFSET`, ein halboffenes Intervall statt `date_trunc` auf der Spalte, eine Schätzung aus `pg_class.reltuples` statt `count(*)`. Prüfe für jede Umformulierung mit einem Vergleich der Ergebnisse auf dem vollen Datensatz, dass sie dasselbe liefert.
      - id: kosten-pruefen
        title: Kosten der Indexe prüfen
        detail: Miss die Zeit für 10 000 neue Buchungen vor und nach deinen Indexen und vergleiche die Größe aller Indexe mit der Tabellengröße. Suche mit `pg_stat_user_indexes` unbenutzte und mit einem Vergleich der Spaltenlisten in `pg_index` doppelte Indexe und entferne sie.
      - id: statistik-fall
        title: Eine falsche Schätzung reparieren
        detail: Baue einen Fall nach, in dem korrelierte Spalten die Schätzung um mindestens den Faktor 10 verfehlen, etwa Mitglieder, die fast immer am selben Standort einchecken. Behebe ihn mit `CREATE STATISTICS` und zeige den Plan vorher und nachher.
      - id: bericht
        title: Bericht mit Vorher-nachher-Tabelle
        detail: Das README enthält je Abfrage eine Zeile mit Zeit vorher, Zeit nachher, Ursache und Maßnahme, dazu die Plan-Dateien im Repository. Nenne Hardware, PostgreSQL-Version und Messmethode, damit jemand die Zahlen nachprüfen kann.
    acceptance:
      - id: seed-deterministisch
        text: Das Seed-Skript erzeugt bei jedem Lauf denselben Datensatz und braucht auf einem Laptop weniger als zehn Minuten.
      - id: jede-abfrage-belegt
        text: Für alle sieben Abfragen liegen Plan und Messwert vorher und nachher als Datei vor.
      - id: ergebnisse-gleich
        text: Jede umformulierte Abfrage liefert nachweislich dasselbe Ergebnis wie das Original, oder die Abweichung ist begründet, etwa bei der Schätzung statt `count(*)`.
      - id: zielwerte
        text: Die Abfragen 1 bis 3 und 5 laufen nach der Optimierung in unter 10 ms, die Seite 200 der Buchungsliste ist nicht langsamer als Seite 1.
      - id: index-bilanz
        text: Der Bericht nennt Größe und Schreibkosten jedes neuen Index; unbenutzte und doppelte Indexe sind entfernt.
    stretch:
      - Partitioniere `checkins` nach Monat und zeige an Abfrage 6, wie Partition Pruning im Plan aussieht.
      - Aktiviere `auto_explain` mit `log_min_duration` und finde damit eine Abfrage, die nur bei bestimmten Parametern langsam ist.
      - Vergleiche Abfrage 2 mit einem Exclusion-Constraint-Index auf `(raum_id, tstzrange(beginn, ende))` gegen einen B-Baum auf `(raum_id, beginn)`.
    portfolio: |
      Zeig zuerst die Vorher-nachher-Tabelle: sieben Zeilen mit Ursache, Maßnahme und zwei Zahlen. Darunter ein ausgewählter Plan mit Markierungen, an dem du zeigst, wie du liest.

      Im Gespräch werden dir echte Pläne vorgelegt, und genau das hast du hier geübt. Rechne mit Fragen wie: Warum nutzt PostgreSQL deinen Index bei Abfrage 4 nicht? Was kostet ein Index beim Schreiben? Wie würdest du dieselbe Analyse auf einer Produktionsdatenbank machen, ohne sie zu belasten?

  - id: job-queue
    title: Job-Queue mit FOR UPDATE SKIP LOCKED
    level: 3
    hours: 12
    summary: Eine Warteschlange für Hintergrundaufgaben direkt in PostgreSQL – mit sicherer Abholung durch mehrere Worker, Wiederholungen mit Backoff, Aufräumen hängender Jobs und einem Test, der zeigt, dass kein Job doppelt verarbeitet wird.
    brief: |
      **Ausgangslage:** Deskwerk verschickt Buchungsbestätigungen, Erinnerungen und Monatsrechnungen. Bisher erledigt das ein Cronjob, der Mails doppelt sendet, sobald zwei Instanzen laufen. Einen Message Broker möchte das kleine Team nicht betreiben. Du baust die Queue mit PostgreSQL.

      **Anforderungen:**

      - Tabelle `jobs` mit `art`, `nutzdaten jsonb`, `status` (`offen`, `laeuft`, `erledigt`, `fehlgeschlagen`), `worker`, `versuche`, `erstellt_am`, `faellig_am`, `gestartet_am`, `letzter_fehler` und einem optionalen `eindeutig`-Schlüssel, der doppelte Aufträge verhindert.
      - **Einreihen in derselben Transaktion** wie die fachliche Änderung: Wird eine Buchung zurückgerollt, entsteht auch kein Bestätigungsjob (Outbox-Muster).
      - **Abholen** mit `FOR UPDATE SKIP LOCKED` in Batches; mehrere Worker blockieren sich nicht und bekommen nie denselben Job gleichzeitig.
      - **Wiederholen** mit exponentiellem Backoff über `faellig_am`, nach fünf Versuchen `fehlgeschlagen` mit Fehlermeldung.
      - **Aufräumen:** Jobs, die länger als fünf Minuten auf `laeuft` stehen, weil ein Worker abgestürzt ist, werden wieder `offen`.
      - **Wecken:** `LISTEN`/`NOTIFY` verkürzt die Wartezeit nach dem Einreihen; ohne Benachrichtigung fragt der Worker spätestens alle fünf Sekunden nach.
      - Ein Lasttest mit vier Worker-Prozessen und 10 000 Jobs zeigt, dass jeder Job genau einmal erledigt wurde.

      **Rahmen:** Python 3.14 mit psycopg 3 oder TypeScript mit dem Paket `pg`; kein ORM für die Queue-Abfragen. Die Arbeit selbst ist simuliert (zufällige Dauer, gelegentliche Ausnahmen). Grundlage sind die Module [Transaktionen](/postgres/transaktionen), [Isolation und Sperren](/postgres/isolation-sperren) und [Indexe](/postgres/indexe).
    skills: [skip-locked, transaktionen, outbox, listen-notify, psycopg, nebenläufigkeit, partieller-index]
    steps:
      - id: tabelle-und-index
        title: Tabelle und Indexe entwerfen
        detail: Lege `jobs` mit Constraints an, etwa einen `CHECK` auf die erlaubten Status und einen partiellen Unique-Index auf `eindeutig` für offene Jobs. Die Abholung braucht einen partiellen Index, der genau die Zeilen enthält, die ein Worker sucht. Überlege, welche Spalten in welcher Reihenfolge hineingehören.
      - id: einreihen
        title: Einreihen in der fachlichen Transaktion
        detail: Schreibe `einreihen(conn, art, nutzdaten)`, die keine eigene Transaktion öffnet, sondern die des Aufrufers nutzt. Teste, dass ein Rollback der Buchung auch den Job verwirft. Doppelte Aufträge mit gleichem `eindeutig` werden mit `ON CONFLICT DO NOTHING` ignoriert.
      - id: abholen
        title: Abholen mit SKIP LOCKED
        detail: Eine Anweisung holt bis zu N fällige Jobs, setzt sie auf `laeuft` und gibt sie mit `RETURNING` zurück. Der Commit folgt sofort. Die eigentliche Arbeit läuft außerhalb der Transaktion, damit keine Sperre und keine Verbindung lange gehalten wird.
      - id: abschliessen-wiederholen
        title: Abschließen, Fehler und Backoff
        detail: "Nach Erfolg `erledigt`, nach einer Ausnahme `offen` mit `faellig_am = now() + Wartezeit` und Fehlermeldung, ab dem fünften Versuch `fehlgeschlagen`. Die Wartezeit wächst exponentiell, etwa 10 s, 20 s, 40 s. Prüfe, dass das Update nur greift, wenn der Job noch dem Worker gehört, damit ein zurückgesetzter Job nicht doppelt abgeschlossen wird."
      - id: haenger-aufraeumen
        title: Hängende Jobs zurücksetzen
        detail: Ein Aufräumschritt setzt Jobs zurück, die zu lange laufen. Überlege, was passiert, wenn der ursprüngliche Worker danach doch noch fertig wird, und warum die Arbeit selbst deshalb idempotent sein muss – etwa über einen Idempotenzschlüssel beim Mailversand.
      - id: listen-notify
        title: Worker mit LISTEN/NOTIFY wecken
        detail: Ein Trigger oder die Einreihefunktion ruft `pg_notify('jobs', art)` auf. Benachrichtigungen kommen erst nach dem `COMMIT` an. Der Worker wartet mit Timeout auf eine Benachrichtigung und fragt danach immer die Tabelle ab, denn eine verpasste Benachrichtigung darf keinen Job verlieren.
      - id: lasttest
        title: Lasttest mit mehreren Prozessen
        detail: Starte vier Worker als eigene Prozesse und reihe 10 000 Jobs ein, von denen ein Teil absichtlich scheitert. Jeder Worker protokolliert in einer Tabelle `verarbeitet (job_id, worker, versuch)`. Prüfe danach per SQL, dass jeder erfolgreiche Job genau einen erfolgreichen Eintrag hat und keiner verloren ging.
      - id: betrieb-readme
        title: Betriebssicht und README
        detail: Schreibe Abfragen für die wichtigsten Kennzahlen – offene Jobs je Art, ältester offener Job, Fehlerquote der letzten Stunde – und beschreibe, wie erledigte Jobs aufgeräumt werden, damit die Tabelle nicht aufbläht. Das README erklärt Garantien und Grenzen der Queue.
    acceptance:
      - id: kein-doppel
        text: Der Lasttest mit vier Workern und 10 000 Jobs zeigt, dass jeder Job genau einmal erfolgreich verarbeitet wurde.
      - id: outbox-rollback
        text: Ein Test belegt, dass ein Rollback der fachlichen Transaktion keinen Job hinterlässt.
      - id: kurze-transaktionen
        text: Während der Verarbeitung hält kein Worker eine offene Transaktion; `pg_stat_activity` zeigt im Lasttest keine Verbindung „idle in transaction“.
      - id: wiederholung
        text: Gescheiterte Jobs werden mit wachsender Wartezeit wiederholt und nach fünf Versuchen mit Fehlermeldung als `fehlgeschlagen` markiert.
      - id: abholung-indexiert
        text: "`EXPLAIN` der Abholabfrage zeigt mit 100 000 erledigten und 1 000 offenen Jobs einen Index Scan auf dem partiellen Index."
    stretch:
      - Ergänze Prioritäten und zeige, dass niedrige Prioritäten trotzdem nicht verhungern.
      - Vergleiche deine Queue mit einer fertigen Bibliothek wie Procrastinate (Python) oder pg-boss (Node.js) und beschreibe die Unterschiede in der Abholung.
      - Ergänze geplante, wiederkehrende Jobs wie den Monatsabschluss mit einem Advisory Lock, damit er nur einmal startet.
    portfolio: |
      Zeige die Abholabfrage, den partiellen Index und das Ergebnis des Lasttests in einer Zeile: 10 000 Jobs, vier Worker, null doppelt. Ein Diagramm der Zustände eines Jobs hilft beim Erklären.

      Im Gespräch kommen sicher die Fragen: Warum nicht Redis oder RabbitMQ? Was passiert, wenn ein Worker mitten in der Arbeit abstürzt? Warum gibt es trotzdem kein „genau einmal“ für die Mail? Bis zu welcher Last trägt eine Queue in PostgreSQL? Ehrliche Antworten mit Grenzen überzeugen hier mehr als Superlative.

  - id: abschluss-buchungs-backend
    title: "Abschlussprojekt: Buchungs-Backend für Deskwerk"
    capstone: true
    level: 3
    hours: 45
    summary: Deskwerk braucht ein Buchungs-Backend, das Doppelbuchungen unmöglich macht, korrekt abrechnet und auch mit einer Million Buchungen schnell bleibt. Du lieferst es wie eine Take-Home-Aufgabe – mit Schema und Constraints, versionierten Migrationen, Berichten, belegten Indexen, Nebenläufigkeitstests, Performance-Budget und README.
    brief: |
      ## Auftrag

      Katrin Hoffmann leitet die Entwicklung bei Deskwerk, einer Coworking-Kette mit drei Standorten in Leipzig. Sie schreibt dir:

      > Unser Buchungssystem ist mit uns gewachsen und an seine Grenzen gekommen. Im letzten Quartal gab es elf Doppelbuchungen von Meetingräumen, zweimal stand die Monatsabrechnung falsch in den Rechnungen, und die Übersicht „Meine Buchungen“ braucht für langjährige Mitglieder mehrere Sekunden. Migrationen spielen wir von Hand ein, einmal stand die App dabei zehn Minuten still. Bitte bau uns den Kern neu – so, dass ein zweites Team ihn übernehmen kann.

      Die Aufgabe ist bewusst wie eine Take-Home-Aufgabe geschnitten. Bewertet wird weniger der Umfang der API als die Datenbankarbeit darunter und wie du deine Entscheidungen begründest.

      ## Fachliche Anforderungen

      | Endpunkt | Zweck | Erfolg | Fachliche Fehler |
      | --- | --- | --- | --- |
      | `GET /standorte/{id}/freie-raeume?beginn=…&ende=…&art=…` | freie Räume im Zeitraum | 200 | 404, 422 ungültiger Zeitraum |
      | `POST /buchungen` | Raum für `[beginn, ende)` buchen; Preis wird berechnet und gespeichert | 201 mit `Location` | 409 belegt, 422 Regel verletzt |
      | `PATCH /buchungen/{id}` | Zeitraum ändern, mit Versionsnummer | 200 | 409 belegt oder zwischenzeitlich geändert |
      | `POST /buchungen/{id}/storno` | stornieren | 200 | 404, 409 schon storniert oder begonnen |
      | `GET /mitglieder/{id}/buchungen?nach=…` | Buchungen eines Mitglieds, neueste zuerst, 20 je Seite | 200 mit Cursor | 404 |
      | `POST /abrechnungen/{monat}` | Monatsrechnungen aller Mitglieder erzeugen oder aktualisieren | 200 mit Anzahl | 409 Abrechnung läuft schon |
      | `GET /berichte/auslastung?monat=…` | Auslastung je Raum und Woche in Prozent der Öffnungszeit | 200 | 422 |

      **Regeln:**

      - Buchungen sind halboffene Intervalle, mindestens 30 Minuten, höchstens 10 Stunden lang, Beginn und Ende auf Viertelstunden. Bestätigte Buchungen eines Raums dürfen sich nicht überlappen; stornierte zählen nicht.
      - Preis = Stundenpreis des Raums × Dauer, für Tarif `team` 10 % Rabatt, kaufmännisch auf Cent gerundet. Er wird bei der Buchung gespeichert; spätere Preisänderungen ändern alte Buchungen nicht.
      - Die Monatsabrechnung summiert die bestätigten Buchungen je Mitglied, deren Beginn im Monat liegt, in `Europe/Berlin`. Sie ist idempotent: Ein zweiter Lauf ändert offene Rechnungen, bezahlte bleiben unangetastet, und zwei gleichzeitige Läufe sind ausgeschlossen.
      - Die Auslastung rechnet mit Öffnungszeiten von 7 bis 22 Uhr Ortszeit. Auch am 29. 3. 2026, der nur 23 Stunden hat, sind das 15 Stunden. Wer die Öffnungszeit mit einem festen Versatz zu UTC berechnet, verschiebt sie ab diesem Tag um eine Stunde.

      ## Technischer Rahmen

      Wähle einen der beiden Stacks von Deskwerk: Python 3.14 mit FastAPI, SQLAlchemy 2.1, Alembic und psycopg 3, oder TypeScript mit Node 24, Prisma und Prisma Migrate. PostgreSQL 18 läuft lokal per Docker Compose und in der CI als Service-Container. Für Abfragen, die das ORM schlecht ausdrückt – Berichte, Upserts, Sperren –, schreibst du SQL mit gebundenen Parametern. Was das ORM nicht modellieren kann, etwa den Exclusion Constraint in Prisma, steht als handgeschriebenes SQL in einer Migration.

      Grundlage sind alle Module dieses Bereichs, besonders [Constraints](/postgres/constraints), [Datenmodellierung](/postgres/datenmodellierung), [Isolation und Sperren](/postgres/isolation-sperren), [SQL hinter dem ORM](/postgres/orm-und-sql), [Indexe](/postgres/indexe), [Query-Pläne](/postgres/query-plaene), [Performance](/postgres/performance) und [Migrationen](/postgres/migrationen). Für die Tests lohnt ein Blick in [Integrationstests](/testing/integrationstests).

      ## Was du lieferst

      1. Repository mit Code, Migrationen, Seed-Skript und Tests; ein Befehl startet alles (`docker compose up`, `make test` o. ä.).
      2. `docs/schema.md` mit ER-Diagramm als Text und einer Begründung für jeden Constraint.
      3. `docs/explain/` mit Plänen der wichtigsten Abfragen vor und nach den Indexen.
      4. `docs/performance.md` mit Budget, Messmethode und Ergebnissen.
      5. README für das übernehmende Team: Start, Architektur, Entscheidungen, bekannte Grenzen.
    skills: [schema-design, constraints, exclusion-constraint, migrationen, alembic, prisma, sqlalchemy, explain, indexe, nebenläufigkeit, optimistisches-locking, keyset-paginierung, upsert, github-actions]
    steps:
      - id: anforderungen-fragen
        title: Anforderungen klären und Annahmen festhalten
        detail: Lies den Auftrag wie in einer echten Take-Home-Aufgabe und schreibe offene Fragen und deine Annahmen auf – etwa ob eine Buchung über Mitternacht erlaubt ist oder ob Storno nach Beginn noch geht. Lege eine Datei `docs/annahmen.md` an; im Gespräch zeigt sie, dass du nachfragst, statt zu raten.
      - id: datenmodell
        title: Datenmodell entwerfen
        detail: Entwirf Tabellen, Schlüssel und Beziehungen als Text-ER-Diagramm. Entscheide bewusst über Schlüsseltyp, Geldtyp, Zeittypen, die Abbildung der Tarife und ob `zeitraum` als generierte Spalte oder als Ausdruck im Constraint lebt. Halte jede Entscheidung mit einem Satz Begründung fest.
      - id: migrationen-aufsetzen
        title: Versionierte Migrationen aufsetzen
        detail: Richte Alembic oder Prisma Migrate ein und lege das Schema in kleinen, benannten Migrationen an. Lies jede generierte Migration und ergänze von Hand, was das Werkzeug nicht kennt – `CREATE EXTENSION btree_gist`, Exclusion Constraint, partielle Indexe. Die CI spielt alle Migrationen auf einer leeren Datenbank ein und vergleicht das Ergebnis mit dem ORM-Modell.
      - id: constraints-umsetzen
        title: Regeln als Constraints umsetzen
        detail: Setze jede Regel, die die Datenbank prüfen kann, als Constraint um – Dauer, Viertelstundenraster, keine Überlappung, eine Rechnung je Mitglied und Monat, kein negativer Betrag. Schreibe für jeden Constraint einen Test, der eine verbotene Zeile einfügt und den SQLSTATE prüft.
      - id: fehler-auf-http
        title: Datenbankfehler auf HTTP abbilden
        detail: Übersetze SQLSTATE an einer Stelle in Problem Details nach [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457.html) – `23P01` und `23505` zu 409, `23514` zu 422, `40001` und `40P01` zu einem Retry der Transaktion. Prüfe, dass nach einem Fehler keine Session in einer abgebrochenen Transaktion weiterverwendet wird.
      - id: seed-generator
        title: Testdaten mit generate_series
        detail: "Schreibe zwei Seeds: einen kleinen, von Hand nachrechenbaren für die Berichtstests (Mitglied ohne Buchung, Storno, Buchung über die Zeitumstellung, Teamrabatt mit Rundung) und einen großen mit rund einer Million Buchungen ohne Überlappungen für die Performance. Beide sind deterministisch."
      - id: buchen-und-aendern
        title: Buchen, Ändern, Stornieren
        detail: Setze die Schreibendpunkte mit kurzen Transaktionen um. Die Änderung einer Buchung nutzt optimistisches Locking mit einer `version`-Spalte; ein veralteter Stand führt zu 409. Prüfe im SQL-Log, wie viele Anweisungen ein Request erzeugt, und begründe jede.
      - id: nebenlaeufigkeit-testen
        title: Nebenläufigkeit beweisen
        detail: "Schreibe Integrationstests mit zwei echten Verbindungen: Zwei überlappende Buchungen desselben Raums gleichzeitig ergeben genau eine 201 und eine 409. Zwei gleichzeitige Änderungen derselben Buchung ergeben genau einen Erfolg. Zwei gleichzeitige Abrechnungsläufe ergeben eine Abrechnung, etwa mit Advisory Lock. Synchronisiere die Verbindungen gezielt – die erste schreibt, ohne zu committen, die zweite wartet –, statt auf zufälliges Timing zu hoffen."
      - id: berichte
        title: Abrechnung und Auslastung in SQL
        detail: Schreibe die Monatsabrechnung als ein `INSERT … SELECT … ON CONFLICT DO UPDATE … WHERE bezahlt_am IS NULL` und die Auslastung als Abfrage mit halboffenen Intervallen in `Europe/Berlin`. Teste beide gegen den kleinen Seed mit von Hand gerechneten Erwartungswerten.
      - id: indexe-belegen
        title: Indexe mit EXPLAIN belegen
        detail: Miss jede Leseabfrage auf dem großen Seed mit `EXPLAIN (ANALYZE, BUFFERS)`. Lege nur Indexe an, die eine gemessene Abfrage brauchen, und speichere die Pläne vorher und nachher unter `docs/explain/`. Die Liste „Meine Buchungen“ nutzt Keyset-Paginierung; zeige, dass Seite 1 und Seite 100 gleich schnell sind.
      - id: migration-ohne-ausfall
        title: Eine Migration ohne Ausfall durchspielen
        detail: "Spiele eine Änderung nach dem Start durch, als liefe die App schon: etwa `buchungen.notiz` in eine eigene Tabelle auslagern oder `preis` in Cent als `bigint` umstellen. Setze sie als Expand and Contract in mehreren Migrationen mit `lock_timeout`, Backfill in Batches und `NOT VALID` plus `VALIDATE` um. Beschreibe die Reihenfolge von Migrationen und Deployments."
      - id: ci-und-uebergabe
        title: CI, Performance-Budget und README
        detail: Eine GitHub-Actions-Pipeline startet PostgreSQL 18 als Service, spielt die Migrationen ein, führt Lint, Typprüfung und alle Tests aus und prüft das Performance-Budget auf einem mittelgroßen Seed. Das README führt in fünf Minuten durch Start, Architektur, Entscheidungen und Grenzen.
    acceptance:
      - id: keine-doppelbuchung
        text: Ein Exclusion Constraint verhindert überlappende bestätigte Buchungen eines Raums; ein Test mit zwei gleichzeitigen Verbindungen erzeugt genau eine Buchung und eine 409.
      - id: regeln-in-der-datenbank
        text: Dauer, Raster, Eindeutigkeit der Monatsrechnung und nicht negative Beträge sind als Constraints umgesetzt und je mit einem Test belegt, der den SQLSTATE prüft.
      - id: migrationen-reproduzierbar
        text: Alle Schemaänderungen liegen als versionierte Migrationen vor; die CI baut die Datenbank von leer bis zum aktuellen Stand auf und findet keine Abweichung zum ORM-Modell.
      - id: migration-ohne-ausfall-belegt
        text: Mindestens eine Änderung ist als Expand and Contract mit `lock_timeout`, Backfill in Batches und dokumentierter Deployment-Reihenfolge umgesetzt.
      - id: kein-lost-update
        text: Gleichzeitige Änderungen derselben Buchung überschreiben sich nicht; der zweite Schreiber bekommt 409.
      - id: abrechnung-korrekt
        text: Die Monatsabrechnung stimmt auf dem kleinen Seed mit den von Hand gerechneten Werten überein, inklusive Teamrabatt, Storno, Zeitumstellung und Mitglied ohne Buchung, und ein zweiter Lauf ändert keine bezahlte Rechnung.
      - id: explain-belege
        text: Für jede Leseabfrage liegt ein Plan auf dem großen Seed vor; jeder angelegte Index ist mit einem Vorher-nachher-Plan begründet.
      - id: performance-budget
        text: "Auf dem großen Seed gilt im Median aus fünf Läufen: Seite der eigenen Buchungen unter 10 ms, freie Räume unter 25 ms, Buchung anlegen unter 25 ms, Monatsabrechnung für alle Mitglieder unter 5 s; Hardware und Messmethode stehen in `docs/performance.md`."
      - id: kein-n-plus-1
        text: Ein Test begrenzt die Zahl der SQL-Anweisungen je Request für die Listenendpunkte; Lazy Loading in Listen schlägt fehl.
      - id: parameter-gebunden
        text: Kein SQL entsteht durch String-Verkettung mit Eingaben; dynamische Sortierungen nutzen eine Allowlist.
      - id: ci-gruen
        text: Die Pipeline mit Migrationen, Lint, Typprüfung, Tests und Performance-Prüfung läuft auf GitHub Actions grün.
      - id: readme-uebergabe
        text: Das README erklärt Start mit einem Befehl, Datenmodell, Entscheidungen mit Begründung und bekannte Grenzen; eine zweite Person hat das Projekt allein damit gestartet.
    stretch:
      - Ersetze den Exclusion Constraint testweise durch Serializable mit Retry und vergleiche Durchsatz und Fehlerrate unter Last.
      - Partitioniere `checkins` nach Monat und ergänze einen Bericht „No-Show-Quote“ – gebuchte Meetingräume ohne Check-in am Standort.
      - Ergänze ein Audit-Log mit `jsonb`, das alte und neue Werte jeder Buchungsänderung festhält, gefüllt mit `RETURNING old.*, new.*` aus PostgreSQL 18.
      - Setze PgBouncer im Transaction Mode davor und dokumentiere, was du in der App dafür ändern musstest.
    portfolio: |
      Beginne im README mit den Zahlen der Auftraggeberin: elf Doppelbuchungen, zwei falsche Abrechnungen, mehrere Sekunden für „Meine Buchungen“. Zeige dann je Problem die Antwort in der Datenbank: den Exclusion Constraint und den Test mit zwei Verbindungen, die idempotente Abrechnung als eine SQL-Anweisung, einen Plan vorher und nachher mit Messwert. Diese drei Belege sagen in zwei Minuten mehr als jede Featureliste.

      Im Gespräch wirst du nach Entscheidungen gefragt, und genau dafür ist `docs/schema.md` da. Warum ein Constraint und nicht eine Prüfung in der App? Warum Read Committed und nicht Serializable? Warum genau diese Indexe, und was kosten sie beim Schreiben? Was passiert, wenn zwei Abrechnungsläufe gleichzeitig starten? Wie würdest du `preis` auf Cent umstellen, ohne die App anzuhalten?

      Sei offen, dass Daten und Last simuliert sind, und nenne, was in Produktion dazukäme: Backups mit Point-in-Time-Recovery, Monitoring mit `pg_stat_statements`, ein Pooler, Datenschutz für Mitgliederdaten in Testumgebungen.
