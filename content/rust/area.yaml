id: rust
title: Rust
short: Rust
tagline: Systemnah, sicher, schnell – ohne Garbage Collector.
description: >
  Ownership und Borrowing, Traits und Generics, Fehlerbehandlung, Iteratoren,
  Nebenläufigkeit ohne Data Races, Dateien, Prozesse und Netzwerk, async mit Tokio,
  Performance messen und professionelles Arbeiten mit Cargo. Vom ersten cargo new
  bis zum eigenen CLI-Werkzeug. Module mit der Marke „Unterwegs“ gehen auf dem Handy,
  „Am PC“ braucht einen Rechner mit Cargo.
color: "#FF6A3D"
order: 2
outcomes:
  - Du verstehst **Ownership, Borrowing und Lifetimes** und liest Fehlermeldungen des Borrow Checkers souverän.
  - Du modellierst Daten mit Structs, Enums und Pattern Matching und behandelst Fehler mit `Result` und `?`.
  - Du schreibst generischen Code mit Traits und nutzt Iteratoren und Closures idiomatisch.
  - Du schreibst nebenläufigen und asynchronen Code mit Threads, Channels, `Arc<Mutex<T>>` und Tokio.
  - Du arbeitest mit **Dateien, Prozessen und TCP-Verbindungen** aus der Standardbibliothek und **misst Performance, bevor du optimierst** – mit Release-Build, Benchmark, Flamegraph und Allokationszählung.
  - Du organisierst Projekte mit Cargo, Modulen, Tests, Clippy und rustfmt.
  - Du baust ein vollständiges CLI-Werkzeug und kannst Rust-Interviewfragen beantworten.
tracks:
  - title: Fundament
    description: Werkzeuge, Syntax und das Ownership-Modell, das Rust ausmacht.
    modules: [rust-einstieg, ownership, structs-enums, fehlerbehandlung]
  - title: Abstraktion
    description: Collections, Traits, Generics, Lifetimes, Closures und Iteratoren.
    modules: [collections-strings, traits-generics, lifetimes, closures-iteratoren]
  - title: Systeme & Praxis
    description: Projekte strukturieren, Speicher verwalten, nebenläufig und asynchron arbeiten, testen und ausliefern.
    modules: [module-cargo, smart-pointer, nebenlaeufigkeit, ein-ausgabe, async-rust, testen-qualitaet, rust-praxis]
  - title: Performance
    description: Erst unterwegs Messwerte, Benchmark-Ausgaben und Flamegraphs lesen, dann am PC selbst messen, profilieren und optimieren.
    modules: [performance-messen, profiling-werkstatt]
