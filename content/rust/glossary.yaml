terms:
- term: Allocation
  definition: Reservierung von Speicher, häufig auf dem Heap. Sie kann Laufzeitkosten und Fehler- beziehungsweise
    Größenfragen verursachen.
- term: Arc
  definition: Atomar referenzgezählter gemeinsamer Besitz. Die Threadsicherheit des Inhalts benötigt zusätzlich
    passende Typen und Synchronisation.
- term: Associated Type
  definition: Typ, den eine konkrete Trait-Implementierung festlegt, etwa `Iterator::Item`.
- term: Async
  definition: Programmierung mit Futures und kooperativen Wartepunkten. Sie bedeutet nicht automatisch CPU-Parallelität.
- term: Backpressure
  definition: Rückmeldung begrenzter Verarbeitungskapazität an den Produzenten, etwa durch einen vollen bounded
    Channel.
- term: Borrow Checker
  definition: Compilerprüfung der Gültigkeit und erlaubten Überlappung von Referenzen.
- term: Borrowing
  definition: Zeitweises Nutzen eines Werts über Referenzen, ohne seinen Besitz zu übernehmen.
- term: Box
  definition: Eigener Besitz an einem Wert über eine Heap-Indirektion. Nützlich unter anderem für rekursive Typen.
- term: Cargo
  definition: Rusts Werkzeug für Pakete, Builds, Abhängigkeiten, Tests und weitere Entwicklungsaufgaben.
- term: Channel
  definition: Nachrichtenkanal zwischen Ausführungseinheiten. Er kann Besitz übertragen und durch Kapazität Arbeit
    begrenzen.
- term: Clone
  definition: Explizite typspezifische Duplizierung. Sie kann allokieren oder bei Referenzzählern geteilten Besitz
    erzeugen.
- term: Closure
  definition: Anonymer Funktionswert, der Werte aus seiner Umgebung einfangen kann.
- term: Copy
  definition: Marker-Trait für implizit kopierbare Werte. Zuweisung konsumiert die ursprüngliche Bindung dann nicht.
- term: Crate
  definition: Übersetzungseinheit in Rust, etwa eine Library oder ein Binary. Ein Cargo-Paket kann mehrere Crate-Targets
    enthalten.
- term: Data Race
  definition: Nicht ausreichend synchronisierter gleichzeitiger Speicherzugriff mit mindestens einem Schreiber.
    Sichere Rust-Abstraktionen verhindern ihn.
- term: Drop
  definition: Aufräumen eines Werts beim Ende seines Besitzes. Der Trait erlaubt benutzerdefinierte Ressourcenfreigabe.
- term: Dyn Trait
  definition: Trait-Objekt für dynamische Dispatch. Es ermöglicht passende konkrete Typen hinter einer gemeinsamen
    Schnittstelle.
- term: Enum
  definition: Typ mit alternativen Varianten, die jeweils unterschiedliche Nutzdaten tragen können.
- term: Error Source
  definition: Ursprünglicher Fehler hinter einem kontextreichen Fehler. `Error::source` kann diese Kette zugänglich
    machen.
- term: Feature
  definition: Benannte Cargo-Option zur Aktivierung optionaler Teile einer Crate oder ihrer Abhängigkeiten.
- term: FnOnce
  definition: Closure-Trait für einen Aufruf, der eingefangene Werte konsumieren darf. Jede Closure implementiert
    zumindest FnOnce.
- term: Future
  definition: Wert, der eine noch nicht abgeschlossene Berechnung beschreibt und durch Polling vorangetrieben wird.
- term: Generic
  definition: Code mit Typparametern, dessen erlaubte Operationen durch Constraints beziehungsweise Trait Bounds
    festgelegt sind.
- term: Heap
  definition: Speicherbereich für dynamisch verwaltete Allokationen. Ownership regelt auch die Verantwortung für
    diese Ressourcen.
- term: Interior Mutability
  definition: Veränderbarkeit hinter einer geteilten äußeren Referenz durch kontrollierende Typen wie RefCell oder
    Mutex.
- term: Iterator
  definition: Schnittstelle, die Elemente schrittweise über `next` liefert. Adapter werden gewöhnlich erst durch
    Verbrauch ausgeführt.
- term: JoinHandle
  definition: Handle zum Beobachten des Abschlusses eines Threads oder einer Task. Die Drop-Semantik hängt von der
    konkreten API ab.
- term: Lifetime
  definition: Gültigkeitsbeziehung geliehener Referenzen. Eine Annotation verlängert keine tatsächliche Lebensdauer
    von Daten.
- term: Match Guard
  definition: Zusätzliche Bedingung an einem Match-Arm. Sie ergänzt ein Muster, ersetzt aber keine vollständige
    Fallabdeckung.
- term: Monomorphisierung
  definition: Spezialisierung generischen Codes für konkrete verwendete Typen bei der Übersetzung.
- term: Move
  definition: Übertragung von Ownership. Die alte Bindung kann den verschobenen nicht kopierbaren Wert danach nicht
    weiterverwenden.
- term: Mutex
  definition: Synchronisationsobjekt für exklusiven Zugriff. Ein Guard hält das Lock bis zu seiner Freigabe.
- term: Newtype
  definition: Eigener Wrapper-Typ um eine vorhandene Repräsentation. Er schafft eine zusätzliche semantische und
    typgeprüfte Grenze.
- term: Option
  definition: Enum aus `Some(T)` und `None` für einen vorhandenen oder fehlenden Wert.
- term: Orphan Rule
  definition: Regel, welche Crate eine Trait-Implementierung definieren darf. Sie hält Implementierungen über Crate-Grenzen
    kohärent.
- term: Ownership
  definition: Zuständigkeit für einen Wert und seine Ressourcen. Besitz kann übertragen oder kontrolliert geteilt
    werden.
- term: Panic
  definition: Abbruch des normalen Kontrollflusses wegen einer verletzten Annahme. Je nach Strategie erfolgt Unwinding
    oder Prozessabbruch.
- term: Pin
  definition: API zur Einschränkung des Bewegens bestimmter Werte nach dem Pinnen. Relevant unter anderem für selbstreferenzielle
    Future-Zustände.
- term: RAII
  definition: Ressourcenverwaltung über Objektlebensdauer. Freigabe wird an das Ende des Besitzes gekoppelt.
- term: Rc
  definition: Nicht atomar referenzgezählter gemeinsamer Besitz für passende einthreadige Kontexte.
- term: RefCell
  definition: Typ für innere Veränderbarkeit mit zur Laufzeit geprüften Leihregeln. Regelverletzung kann paniken.
- term: Result
  definition: Enum aus `Ok(T)` und `Err(E)` für Erfolg oder konkrete Fehlerursache.
- term: Send
  definition: Marker-Trait, der sicheren Besitztransfer eines Typs zwischen Threads ausdrückt.
- term: Slice
  definition: Geliehene Sicht auf eine zusammenhängende Folge von Elementen. Ein Slice besitzt nicht den zugrunde
    liegenden Puffer.
- term: Sync
  definition: Marker-Trait, der sicheren threadübergreifenden Gebrauch geteilter Referenzen auf einen Typ ausdrückt.
- term: Trait
  definition: Vertrag für Verhalten mit Methoden und gegebenenfalls assoziierten Typen oder Konstanten.
- term: Unsafe
  definition: Bereich für bestimmte zusätzliche Operationen mit manuell einzuhaltenden Sicherheitsinvarianten. Normale
    Typregeln gelten weiterhin.
- term: Workspace
  definition: Cargo-Verbund mehrerer Pakete mit gemeinsamer Verwaltung und abgestimmter Abhängigkeitsauflösung.
