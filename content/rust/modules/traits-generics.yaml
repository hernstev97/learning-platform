    type: choice
    title: Statisch oder dynamisch?
    prompt: |
      Welche Aussagen über `fn melde(p: &impl Pruefung)` und `fn melde(p: &dyn Pruefung)` stimmen? **Mehrere Antworten richtig.**
    options:
      - text: Die `impl`-Variante wird für jeden konkreten Typ, mit dem sie aufgerufen wird, einzeln kompiliert.
        correct: true
        why: "`impl Trait` im Argument ist ein anonymer Typparameter. Der Compiler monomorphisiert die Funktion pro Typ."
      - text: "`p` ist in der `dyn`-Variante ein Zeiger aus zwei Teilen: Datenzeiger und vtable-Zeiger."
        correct: true
        why: So sieht ein Fat Pointer auf ein Trait-Objekt aus. Die vtable enthält die Methodenadressen des konkreten Typs.
      - text: Die `dyn`-Variante funktioniert mit jedem Trait, auch mit einem, der eine generische Methode hat.
        correct: false
        why: Traits mit generischen Methoden sind nicht dyn compatible (E0038), weil die vtable für jede Methode genau eine Adresse braucht.
      - text: Die `impl`-Variante erlaubt es, in einem `Vec` Werte verschiedener Typen zu sammeln.
        correct: false
        why: Ein `Vec<T>` hat genau einen Elementtyp. Für verschiedene Typen brauchst du `Vec<Box<dyn Pruefung>>`.
      - text: Die `dyn`-Variante erzeugt beim Aufruf automatisch eine Heap-Allokation.
        correct: false
        why: "`&dyn Pruefung` ist nur eine Referenz auf einen vorhandenen Wert. Eine Heap-Allokation entsteht erst, wenn du selbst `Box::new` aufrufst."
    explanation: |
      Beide Varianten akzeptieren jeden Typ, der `Pruefung` implementiert. Der Unterschied liegt im erzeugten Code: `impl` bzw. Generics lösen den Methodenaufruf zur Compile-Zeit auf (statische Dispatch, pro Typ eine Kopie), `dyn` zur Laufzeit über die vtable (dynamische Dispatch, eine Kopie für alle). Dafür erlaubt nur `dyn` heterogene Collections und Typen, die erst zur Laufzeit feststehen.
    resources:
      - title: The Rust Book · Performing Dynamic Dispatch
        url: https://doc.rust-lang.org/book/ch18-02-trait-objects.html#performing-dynamic-dispatch
      - title: The Rust Reference · Trait objects
        url: https://doc.rust-lang.org/reference/types/trait-object.html

  - id: orphan-rule
    type: choice
    title: Welche Implementierung ist erlaubt?
    prompt: |
      Du schreibst ein Crate mit `struct Kunde(String);` und `trait Beschreibbar`. Welche Implementierungen akzeptiert der Compiler? **Mehrere Antworten richtig.**
    options:
      - text: "`impl fmt::Display for Kunde`"
        correct: true
        why: Der Trait ist fremd, aber der Typ `Kunde` ist lokal. Das reicht.
      - text: "`impl Beschreibbar for Vec<u8>`"
        correct: true
        why: Der Typ ist fremd, aber der Trait ist lokal. Auch das reicht.
      - text: "`impl fmt::Display for Vec<u8>`"
        correct: false
        why: Trait und Typ stammen beide aus der Standardbibliothek. Der Compiler meldet E0117. Ausweg ist ein Newtype.
      - text: "`impl From<Kunde> for String`"
        correct: true
        why: "`String` und `From` sind fremd, aber der Typparameter `Kunde` ist lokal. Die Orphan Rule verlangt nur, dass irgendwo in der Implementierung ein lokaler Typ an der richtigen Stelle vorkommt."
    explanation: |
      Die Orphan Rule sichert Kohärenz: Für jede Kombination aus Trait und Typ darf es weltweit höchstens eine Implementierung geben. Das garantiert der Compiler, indem er verlangt, dass dein Crate an der Implementierung „beteiligt“ ist – als Besitzer des Traits, des Typs oder eines lokalen Typs in den Typparametern des Traits. Die vierte Option überrascht viele, ist aber gängige Praxis: So lässt sich ein eigener Typ in einen `String` umwandeln.
    resources:
      - title: The Rust Reference · Orphan rules
        url: https://doc.rust-lang.org/reference/items/implementations.html#orphan-rules
      - title: Error-Index · E0117
        url: https://doc.rust-lang.org/error_codes/E0117.html

  - id: vtable-ablauf
    type: order
    title: Ein Aufruf über die vtable
    prompt: |
      `let p: &dyn Pruefung = &platte;` und danach `p.ok()`. Bring die Schritte in die Reihenfolge, in der sie passieren – vom Kompilieren bis zum Aufruf.
    lang: text
    lines: |
      Der Compiler erzeugt für die Kombination Festplatte + Pruefung eine vtable mit den Methodenadressen.
      Beim Zuweisen an p entsteht ein Fat Pointer aus der Adresse von platte und der Adresse der vtable.
      Beim Aufruf p.ok() liest das Programm den vtable-Zeiger aus dem Fat Pointer.
      Aus der vtable holt es die Adresse der Methode ok an ihrer festen Position.
      Es springt zu dieser Adresse und übergibt den Datenzeiger als self.
    explanation: |
      Die vtable entsteht zur Compile-Zeit, einmal pro Paar aus konkretem Typ und Trait. Zur Laufzeit wird nur noch der Fat Pointer gebaut (beim Umwandeln von `&Festplatte` in `&dyn Pruefung`) und beim Aufruf über die Tabelle indirekt gesprungen. Deshalb kostet dynamische Dispatch pro Aufruf einen zusätzlichen Speicherzugriff und verhindert Inlining, aber keine Suche nach Methodennamen wie in dynamischen Sprachen.
    resources:
      - title: The Rust Reference · Trait objects
        url: https://doc.rust-lang.org/reference/types/trait-object.html

  - id: default-methoden-ausgabe
    type: output
    title: Default-Methode oder eigene?
    prompt: Was gibt dieses Programm aus?
    lang: rust
    code: |
      trait Gruss {
          fn name(&self) -> String;
          fn hallo(&self) -> String {
              format!("Hallo, {}!", self.name())
          }
      }

      struct Nutzer;
      struct Admin;

      impl Gruss for Nutzer {
          fn name(&self) -> String {
              String::from("Nutzer")
          }
      }

      impl Gruss for Admin {
          fn name(&self) -> String {
              String::from("Admin")
          }
          fn hallo(&self) -> String {
              format!("Willkommen zurück, {}.", self.name())
          }
      }

      fn begruesse(g: &dyn Gruss) {
          println!("{}", g.hallo());
      }

      fn main() {
          begruesse(&Nutzer);
          begruesse(&Admin);
          let alle: Vec<Box<dyn Gruss>> = vec![Box::new(Admin), Box::new(Nutzer)];
          for g in &alle {
              println!("{}", g.name());
          }
      }
    expected: |
      Hallo, Nutzer!
      Willkommen zurück, Admin.
      Admin
      Nutzer
    hints:
      - "`Nutzer` implementiert `hallo` nicht selbst. Welche Version bekommt er?"
      - Die vtable eines Typs enthält seine überschriebenen Methoden.
    explanation: |
      `Nutzer` bekommt die Default-Methode `hallo`, die intern `self.name()` aufruft – und dieses `name` ist die Implementierung von `Nutzer`. `Admin` überschreibt `hallo`, also enthält die vtable von `Admin` dessen eigene Version. Obwohl `begruesse` nur `&dyn Gruss` sieht, landet jeder Aufruf bei der richtigen Implementierung. Der `Vec` behält die Einfügereihenfolge.
    resources:
      - title: The Rust Book · Default Implementations
        url: https://doc.rust-lang.org/book/ch10-02-traits.html#using-default-implementations

  - id: derive-ord-ausgabe
    type: output
    title: Wie sortiert derive(Ord)?
    prompt: Was gibt dieses Programm aus?
    lang: rust
    code: |
      #[derive(Debug, PartialEq, Eq, PartialOrd, Ord, Clone, Copy)]
      enum Prio {
          Hoch,
          Mittel,
          Niedrig,
      }

      #[derive(Debug, PartialEq, Eq, PartialOrd, Ord)]
      struct Ticket {
          prio: Prio,
          nummer: u32,
      }

      fn main() {
          println!("{}", Prio::Hoch < Prio::Niedrig);
          let mut tickets = vec![
              Ticket { prio: Prio::Niedrig, nummer: 1 },
              Ticket { prio: Prio::Hoch, nummer: 7 },
              Ticket { prio: Prio::Hoch, nummer: 3 },
          ];
          tickets.sort();
          for t in &tickets {
              println!("{:?} #{}", t.prio, t.nummer);
          }
          println!("{:?}", tickets.iter().max().map(|t| t.nummer));
      }
    expected: |
      true
      Hoch #3
      Hoch #7
      Niedrig #1
      Some(1)
    hints:
      - Abgeleitetes `Ord` auf einem Enum vergleicht die Position der Varianten in der Deklaration, nicht ihre Bedeutung.
      - Bei Structs vergleicht es Feld für Feld, von oben nach unten.
    explanation: |
      Für Enums ordnet `derive(PartialOrd, Ord)` die Varianten nach ihrer Reihenfolge im Quelltext: `Hoch` ist die erste und damit die **kleinste**. Das Wort „Hoch“ hat für den Compiler keine Bedeutung. Structs werden lexikografisch verglichen: erst `prio`, bei Gleichstand `nummer`. Deshalb stehen die beiden `Hoch`-Tickets vorne, sortiert nach Nummer. `max()` liefert das größte Ticket, also das mit `Niedrig`. Wer „höchste Priorität zuerst“ meint, muss die Varianten entsprechend anordnen oder `Ord` von Hand implementieren.
    resources:
      - title: std · Ord (Abschnitt Derivable)
        url: https://doc.rust-lang.org/std/cmp/trait.Ord.html
      - title: Rust by Example · Derive
        url: https://doc.rust-lang.org/rust-by-example/trait/derive.html

  - id: add-from-ausgabe
    type: output
    title: Plus, From und into
    prompt: Was gibt dieses Programm aus?
    lang: rust
    code: |
      use std::ops::Add;

      #[derive(Debug, Clone, Copy, PartialEq)]
      struct Dauer {
          sekunden: u32,
      }

      impl Add for Dauer {
          type Output = Dauer;
          fn add(self, rhs: Dauer) -> Dauer {
              Dauer { sekunden: self.sekunden + rhs.sekunden }
          }
      }

      impl From<u32> for Dauer {
          fn from(minuten: u32) -> Self {
              Dauer { sekunden: minuten * 60 }
          }
      }

      fn main() {
          let a = Dauer { sekunden: 30 };
          let b: Dauer = 2.into();
          let c = a + b;
          println!("{}", c.sekunden);
          println!("{}", a == Dauer::from(0) + a);
          println!("{:?}", b + b + a);
      }
    expected: |
      150
      true
      Dauer { sekunden: 270 }
    hints:
      - "`2.into()` ruft hier `Dauer::from(2)` auf. Was macht `from` mit der Zahl?"
      - Weil `Dauer` `Copy` ist, bleiben `a` und `b` nach `+` benutzbar.
    explanation: |
      `2.into()` nutzt die automatische `Into`-Implementierung, die aus `From<u32> for Dauer` entsteht; `from` interpretiert die Zahl als Minuten, also 120 Sekunden. `a + b` ruft `Add::add` auf: 30 + 120 = 150. `Dauer::from(0)` ist 0 Sekunden, plus `a` ergibt wieder `a`, und das abgeleitete `PartialEq` vergleicht feldweise. `b + b + a` ist 120 + 120 + 30 = 270. Ohne `Copy` wären `a` und `b` nach dem ersten `+` verbraucht, weil `add` `self` per Wert nimmt.
    resources:
      - title: std · Add
        url: https://doc.rust-lang.org/std/ops/trait.Add.html
      - title: Rust by Example · From and Into
        url: https://doc.rust-lang.org/rust-by-example/conversion/from_into.html

  - id: bounds-ergaenzen
    type: gap
    title: Die richtigen Bounds
    prompt: |
      Ergänze die Trait Bounds so, dass beide Funktionen kompilieren – nicht mehr als nötig. `zusammenfassen` braucht `to_string()`, `hoechster_wert` vergleicht mit `>` und kopiert Werte aus dem Slice.
    lang: rust
    code: |
      use std::fmt::Display;

      fn zusammenfassen<T>(werte: &[T], trenner: &str) -> String
      ⟦where⟧
          T: ⟦Display⟧,
      {
          let mut teile = Vec::new();
          for w in werte {
              teile.push(w.to_string());
          }
          teile.join(trenner)
      }

      fn hoechster_wert<T: ⟦PartialOrd + Copy⟧>(werte: &[T]) -> Option<T> {
          let mut max = *werte.first()?;
          for &w in werte {
              if w > max {
                  max = w;
              }
          }
          Some(max)
      }

      fn main() {
          println!("{}", zusammenfassen(&[200, 404, 500], ", "));
          println!("{:?}", hoechster_wert(&[1.5, 9.25, 3.0]));
      }
    gaps:
      - label: Schlüsselwort für die Bound-Klausel
        hint: Die Klausel zwischen Signatur und Rumpf.
      - label: Bound für to_string
        hint: "`to_string()` gibt es für jeden Typ, der sich mit `{}` ausgeben lässt."
      - label: Bounds für > und das Kopieren
        hint: "Zwei Traits, verbunden mit `+`. Welcher erlaubt `>`, welcher `*werte.first()?` und `for &w`?"
        accept: ["Copy + PartialOrd"]
    explanation: |
      `to_string()` stammt aus `ToString`, das die Standardbibliothek für jedes `T: Display` implementiert – der Bound `Display` genügt also. `>` braucht `PartialOrd`; `Ord` wäre zu streng, weil `f64` es wegen `NaN` nicht implementiert und der Aufruf mit `[1.5, 9.25, 3.0]` dann scheitern würde. `*werte.first()?` und das Muster `for &w` kopieren Werte aus dem Slice heraus, dafür braucht es `Copy`. Die `where`-Klausel ist gleichwertig zu `<T: Display>` und lohnt sich, sobald Bounds lang werden.
    resources:
      - title: The Rust Book · Clearer Trait Bounds with where Clauses
        url: https://doc.rust-lang.org/book/ch10-02-traits.html#clearer-trait-bounds-with-where-clauses
      - title: Rust by Example · Bounds
        url: https://doc.rust-lang.org/rust-by-example/generics/bounds.html

  - id: display-und-from
    type: gap
    title: Display und From für eine Version
    prompt: |
      `Version` soll sich als `v1.98.1` ausgeben lassen und aus einem Tupel `(u32, u32, u32)` per `.into()` entstehen. Ergänze die Trait-Namen und das Makro.
    lang: rust
    code: |
      use std::fmt;

      struct Version {
          major: u32,
          minor: u32,
          patch: u32,
      }

      impl fmt::⟦Display⟧ for Version {
          fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
              ⟦write!⟧(f, "v{}.{}.{}", self.major, self.minor, self.patch)
          }
      }

      impl ⟦From<(u32, u32, u32)>⟧ for Version {
          fn from(t: (u32, u32, u32)) -> Self {
              Version { major: t.0, minor: t.1, patch: t.2 }
          }
      }

      fn main() {
          let v: Version = (1, 98, 1).into();
          println!("{v}");
          let text = v.to_string();
          println!("{}", text.len());
      }
    gaps:
      - label: Trait für {}
        hint: Der Trait für Ausgaben, die Menschen lesen.
      - label: In den Formatter schreiben
        hint: Wie `format!`, aber mit einem Ziel als erstem Argument.
      - label: Konvertierungs-Trait
        hint: Implementiere die Richtung „Version aus Tupel“; die Gegenrichtung `into` entsteht automatisch. Der Typparameter ist das Tupel.
    explanation: |
      `Display` bestimmt, was `{}` ausgibt, und schenkt dir über die generische `ToString`-Implementierung `to_string()`. `write!` schreibt formatiert in den `Formatter` und gibt das nötige `fmt::Result` zurück. `From<(u32, u32, u32)> for Version` erzeugt automatisch `Into<Version> for (u32, u32, u32)`; deshalb funktioniert `(1, 98, 1).into()`, sobald der Zieltyp bekannt ist. `Into` direkt zu implementieren wäre möglich, verschenkt aber diese Symmetrie.
    resources:
      - title: std · Display
        url: https://doc.rust-lang.org/std/fmt/trait.Display.html
      - title: std · From
        url: https://doc.rust-lang.org/std/convert/trait.From.html

  - id: add-implementieren
    type: gap
    title: Punkte addieren
    prompt: "Implementiere `+` für `Punkt`. Erwartete Ausgabe `Punkt { x: 21, y: 0 }`."
    lang: rust
    code: |
      use std::ops::Add;

      #[derive(Debug, Clone, Copy, PartialEq)]
      struct Punkt {
          x: i32,
          y: i32,
      }

      impl ⟦Add⟧ for Punkt {
          type ⟦Output⟧ = Punkt;

          fn ⟦add⟧(self, rhs: Punkt) -> Self::Output {
              Punkt { x: self.x + rhs.x, y: self.y + rhs.y }
          }
      }

      fn main() {
          let start = Punkt { x: 1, y: 2 };
          let schritt = Punkt { x: 10, y: -1 };
          println!("{:?}", start + schritt + schritt);
      }
    gaps:
      - label: Trait aus std::ops
        hint: Er steht schon im `use`.
      - label: Assoziierter Typ
        hint: Der Typ des Ergebnisses von `a + b`.
      - label: Methodenname
        hint: Klein geschrieben, wie der Trait.
    explanation: |
      `a + b` ist Syntax für `Add::add(a, b)`. Der assoziierte Typ `Output` legt fest, was dabei herauskommt – er muss nicht `Self` sein, `Instant + Duration` ergibt etwa wieder ein `Instant`. Weil `add` `self` per Wert nimmt, braucht `start + schritt + schritt` den `Copy`-Derive: Ohne ihn wäre `schritt` nach dem ersten `+` verbraucht.
    resources:
      - title: The Rust Book · Operator Overloading
        url: https://doc.rust-lang.org/book/ch20-02-advanced-traits.html#using-default-generic-parameters-and-operator-overloading
      - title: Rust by Example · Operator Overloading
        url: https://doc.rust-lang.org/rust-by-example/trait/ops.html

  - id: fehlender-bound
    type: bug
    title: Generisch, aber nicht vergleichbar
    prompt: |
      `groesstes` soll für Zahlen und Strings funktionieren. Der Compiler meldet:

      ```text
      error[E0369]: binary operation `>` cannot be applied to type `&T`
      ```

      Finde die Zeile, die den Fehler verursacht (nicht die Zeile, auf die die Meldung zeigt), und korrigiere sie.
    lang: rust
    code: |
      fn groesstes<T>(liste: &[T]) -> &T {
          let mut max = &liste[0];
          for wert in liste {
              if wert > max {
                  max = wert;
              }
          }
          max
      }

      fn main() {
          println!("{}", groesstes(&[3, 17, 8]));
          println!("{}", groesstes(&["beta", "alpha"]));
      }
    lines: [1]
    fix:
      - line: 1
        answers:
          - "fn groesstes<T: PartialOrd>(liste: &[T]) -> &T {"
          - "fn groesstes<T: std::cmp::PartialOrd>(liste: &[T]) -> &T {"
          - "fn groesstes<T: Ord>(liste: &[T]) -> &T {"
    hints:
      - Der Vergleich in Zeile 4 ist korrekt geschrieben. Was weiß der Compiler über `T`?
    explanation: |
      Rust prüft generischen Code gegen seine Bounds. Ohne Bound darf `T` jeder Typ sein, auch einer ohne Vergleichsoperator – also lehnt der Compiler `>` ab, obwohl die konkreten Aufrufe mit `i32` und `&str` vergleichbar wären. `T: PartialOrd` verspricht den Operator. `Ord` funktioniert für diese beiden Aufrufe auch, schließt aber `f64` aus. Die Meldung zeigt auf Zeile 4, die Ursache steht in der Signatur: ein typisches Muster bei Bound-Fehlern.
    resources:
      - title: Error-Index · E0369
        url: https://doc.rust-lang.org/error_codes/E0369.html
      - title: The Rust Book · Trait Bound Syntax
        url: https://doc.rust-lang.org/book/ch10-02-traits.html#trait-bound-syntax

  - id: impl-trait-zwei-typen
    type: bug
    title: Formatierer je nach Flag
    prompt: |
      Mit `--json` soll das Programm JSON loggen, sonst Klartext. Der Compiler meldet:

      ```text
      error[E0308]: `if` and `else` have incompatible types
        expected `Json`, found `Klartext`
      ```

      Beide Typen implementieren `Formatierer`. Finde die drei Zeilen, die geändert werden müssen, und korrigiere sie so, dass die Auswahl zur Laufzeit funktioniert.
    lang: rust
    code: |
      trait Formatierer {
          fn formatiere(&self, meldung: &str) -> String;
      }

      struct Json;
      struct Klartext;

      impl Formatierer for Json {
          fn formatiere(&self, meldung: &str) -> String {
              format!("{{\"msg\":\"{meldung}\"}}")
          }
      }

      impl Formatierer for Klartext {
          fn formatiere(&self, meldung: &str) -> String {
              format!("msg={meldung}")
          }
      }

      fn waehle(json: bool) -> impl Formatierer {
          if json {
              Json
          } else {
              Klartext
          }
      }

      fn main() {
          let f = waehle(std::env::args().any(|a| a == "--json"));
          println!("{}", f.formatiere("gestartet"));
      }
    lines: [20, 22, 24]
    fix:
      - line: 20
        answers: ["fn waehle(json: bool) -> Box<dyn Formatierer> {"]
      - line: 22
        answers: ["Box::new(Json)"]
      - line: 24
        answers: ["Box::new(Klartext)"]
    hints:
      - "`impl Formatierer` in der Rückgabe heißt: genau **ein** konkreter Typ."
      - Welcher Typ kann zur Laufzeit mal ein `Json` und mal ein `Klartext` enthalten?
    explanation: |
      `impl Trait` als Rückgabetyp steht für genau einen verborgenen Typ, den der Compiler aus dem Rumpf ableitet. Zwei verschiedene Typen passen nicht hinein, auch wenn beide den Trait implementieren. `Box<dyn Formatierer>` ist ein Trait-Objekt: Zeiger auf den Heap plus vtable. Jetzt dürfen die Zweige verschiedene Typen liefern, solange beide in eine Box gepackt werden. Steht die Menge der Varianten fest, ist ein `enum Formatierer { Json, Klartext }` mit `match` eine Alternative ohne Heap und vtable.
    resources:
      - title: The Rust Book · Returning Types That Implement Traits
        url: https://doc.rust-lang.org/book/ch10-02-traits.html#returning-types-that-implement-traits
