id: traits-generics
title: Traits & Generics
level: 2
minutes: 180
summary: Generischer Code ohne Laufzeitkosten, gemeinsames Verhalten über Traits und die Wahl zwischen statischer und dynamischer Dispatch – das Werkzeug, mit dem Rust-Bibliotheken ihre APIs bauen.
goals:
  - Du schreibst generische Funktionen, Structs und `impl`-Blöcke und erklärst, was Monomorphisierung kostet und bringt.
  - "Du definierst Traits mit Pflicht- und Default-Methoden und formulierst Trait Bounds mit `T: Trait`, `+` und `where`."
  - Du entscheidest begründet zwischen `impl Trait`, Generics und `dyn Trait` und erklärst, was eine vtable ist.
  - Du leitest die wichtigsten Standard-Traits per `derive` ab und implementierst `Display`, `From` und `Add` von Hand.
  - Du erklärst die Orphan Rule und umgehst sie mit dem Newtype-Muster.
