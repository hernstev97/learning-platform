lesson: |
  Dein Monitoring-Tool prüft Festplatten, Dienste und Zertifikate. Jede Prüfung hat einen Namen und ein Ergebnis, aber jede ermittelt es anders. Später sollen Benachrichtigungen per Mail, Slack oder in eine Datei gehen – je nach Konfiguration. In TypeScript würdest du dafür Interfaces schreiben, in Kotlin ebenfalls. In Rust heißen sie **Traits**. Dazu kommen **Generics**: Funktionen und Typen, die für viele konkrete Typen funktionieren, ohne dass du sie für jeden Typ kopierst.

  Das Besondere an Rust: Du entscheidest selbst, ob der Compiler für jeden konkreten Typ eigenen Maschinencode erzeugt (schnell, größeres Binary) oder ob zur Laufzeit über eine Tabelle von Funktionszeigern aufgerufen wird (flexibel, ein indirekter Sprung). Diese Entscheidung zu verstehen, trennt Leute, die Rust-Code schreiben können, von Leuten, die Rust-APIs entwerfen können.

  ## Generics: ein Stück Code für viele Typen

  Eine Funktion, die das größte Element eines Slices findet, sieht für `i32`, `f64` und `&str` gleich aus. Mit einem Typparameter `T` schreibst du sie einmal:

  ```rust
  fn groesstes<T: PartialOrd>(liste: &[T]) -> Option<&T> {
      let mut max = liste.first()?;
      for wert in liste {
          if wert > max {
              max = wert;
          }
      }
      Some(max)
  }

  fn main() {
      println!("{:?}", groesstes(&[3, 17, 8]));           // Some(17)
      println!("{:?}", groesstes(&[0.5, -1.0]));          // Some(0.5)
      println!("{:?}", groesstes(&["beta", "alpha"]));    // Some("beta")
      println!("{:?}", groesstes::<u8>(&[]));             // None
  }
  ```

  `T: PartialOrd` ist ein **Trait Bound**: `T` darf jeder Typ sein, der sich mit `<` und `>` vergleichen lässt. Ohne diesen Bound weiß der Compiler nicht, ob `>` für `T` existiert, und meldet [E0369](https://doc.rust-lang.org/error_codes/E0369.html): `binary operation > cannot be applied to type &T`. Das ist der zentrale Unterschied zu C++-Templates: Rust prüft den generischen Code **einmal gegen die Bounds**, nicht erst beim Einsetzen jedes Typs. Was im Bound steht, darfst du benutzen – mehr nicht.

  Structs und Enums können ebenfalls generisch sein. `Option<T>` und `Result<T, E>` kennst du schon. In `impl`-Blöcken kannst du Methoden für alle `T` anbieten oder nur für bestimmte Typen:

  ```rust
  #[derive(Debug)]
  struct Messwert<T> {
      wert: T,
      einheit: &'static str,
  }

  impl<T: std::fmt::Display> Messwert<T> {
      fn anzeigen(&self) -> String {
          format!("{} {}", self.wert, self.einheit)
      }
  }

  impl Messwert<f64> {
      fn in_prozent(&self) -> f64 {
          self.wert * 100.0
      }
  }

  fn main() {
      let temp = Messwert { wert: 21.5, einheit: "°C" };
      let anfragen = Messwert { wert: 1200_u32, einheit: "req/s" };
      let quote = Messwert { wert: 0.25, einheit: "" };
      println!("{} | {}", temp.anzeigen(), anfragen.anzeigen());
      println!("{}", quote.in_prozent()); // nur für Messwert<f64> vorhanden
  }
  ```

  ### Monomorphisierung: was der Compiler daraus macht

  Rust erzeugt für jeden konkreten Typ, mit dem du eine generische Funktion aufrufst, eine eigene Kopie: `groesstes::<i32>`, `groesstes::<f64>`, `groesstes::<&str>`. Das heißt **Monomorphisierung** ([Book: Performance of Code Using Generics](https://doc.rust-lang.org/book/ch10-01-syntax.html#performance-of-code-using-generics)). Jede Kopie ist so schnell wie handgeschriebener Code für genau diesen Typ; der Optimierer kann Aufrufe inlinen. Der Preis: längere Compile-Zeiten und ein größeres Binary, wenn eine große generische Funktion mit vielen Typen benutzt wird.

  ## Traits: gemeinsames Verhalten beschreiben

  Ein Trait legt fest, welche Methoden ein Typ anbieten muss. Methoden mit Rumpf sind **Default-Methoden**: Jeder Typ bekommt sie geschenkt und darf sie überschreiben. Default-Methoden dürfen die Pflichtmethoden aufrufen – so baust du viel Verhalten auf wenig Implementierungsaufwand ([Book: Default Implementations](https://doc.rust-lang.org/book/ch10-02-traits.html#using-default-implementations)).

  ```rust
  trait Benachrichtigung {
      // Pflichtmethode: jeder Typ muss sie implementieren
      fn kanal(&self) -> String;

      // Default-Methode: darf überschrieben werden, nutzt die Pflichtmethode
      fn senden(&self, text: &str) -> String {
          format!("[{}] {text}", self.kanal())
      }
  }

  struct Email {
      an: String,
  }

  struct Slack {
      channel: String,
  }

  impl Benachrichtigung for Email {
      fn kanal(&self) -> String {
          format!("mail:{}", self.an)
      }
  }

  impl Benachrichtigung for Slack {
      fn kanal(&self) -> String {
          format!("slack:#{}", self.channel)
      }
      fn senden(&self, text: &str) -> String {
          format!("[{}] :rotating_light: {text}", self.kanal())
      }
  }

  fn main() {
      let mail = Email { an: String::from("ops@firma.de") };
      let slack = Slack { channel: String::from("alerts") };
      println!("{}", mail.senden("Backup fehlgeschlagen"));
      println!("{}", slack.senden("Backup fehlgeschlagen"));
  }
  ```

  Anders als bei Interfaces in Kotlin steht die Implementierung in einem **eigenen** `impl Trait for Typ`-Block, nicht in der Typdefinition. Deshalb kannst du eigene Traits auch für fremde Typen wie `Vec<u8>` oder `i32` implementieren – mit einer Einschränkung, der Orphan Rule, weiter unten.

  ### Trait Bounds: T: Trait, + und where

  Es gibt vier Schreibweisen, die dasselbe ausdrücken können ([Book: Traits as Parameters](https://doc.rust-lang.org/book/ch10-02-traits.html#using-traits-as-parameters)):

  ```rust
  use std::fmt::{Debug, Display};

  // 1. Trait Bound direkt am Typparameter
  fn protokolliere<T: Display>(wert: T) {
      println!("LOG {wert}");
  }

  // 2. Mehrere Bounds mit +
  fn pruefe<T: Display + PartialOrd>(wert: T, grenze: T) {
      if wert > grenze {
          println!("{wert} liegt über {grenze}");
      }
  }

  // 3. where-Klausel, wenn die Signatur sonst unleserlich wird
  fn bericht<K, V>(eintraege: &[(K, V)]) -> String
  where
      K: Display,
      V: Debug,
  {
      let mut s = String::new();
      for (k, v) in eintraege {
          s.push_str(&format!("{k}={v:?} "));
      }
      s
  }

  // 4. impl Trait in Argument-Position: Kurzform für Variante 1
  fn protokolliere_kurz(wert: impl Display) {
      println!("LOG {wert}");
  }

  fn main() {
      protokolliere(42);
      pruefe(95.5, 90.0);
      println!("{}", bericht(&[("port", 8080), ("workers", 4)]));
      protokolliere_kurz("fertig");
  }
  ```

  `impl Display` im Argument ist laut Referenz ein [anonymer Typparameter](https://doc.rust-lang.org/reference/types/impl-trait.html#anonymous-type-parameters): Die Funktion bleibt generisch und wird monomorphisiert. Unterschied zur Langform: Der Aufrufer kann den Typ nicht per Turbofish (`protokolliere::<i32>(…)`) angeben, und zwei `impl Display`-Parameter dürfen verschiedene Typen haben, während `fn f<T: Display>(a: T, b: T)` denselben Typ erzwingt.

  ### impl Trait als Rückgabetyp

  In Rückgabe-Position bedeutet `impl Trait` etwas anderes: „Ich gebe **einen** bestimmten Typ zurück, verrate aber nicht welchen“ ([Reference: Abstract return types](https://doc.rust-lang.org/reference/types/impl-trait.html#abstract-return-types)). Das ist ideal für Typen, die man nicht hinschreiben kann oder will, etwa Iteratoren mit Closures:

  ```rust
  fn gerade_zahlen(bis: u32) -> impl Iterator<Item = u32> {
      (0..=bis).filter(|n| n % 2 == 0)
  }

  fn main() {
      let summe: u32 = gerade_zahlen(10).sum();
      println!("{summe}"); // 30
  }
  ```

  Der Haken: Es bleibt **ein** konkreter Typ. Gibt ein `if` im einen Zweig `Json` und im anderen `Klartext` zurück, scheitert das mit `if and else have incompatible types` – auch wenn beide denselben Trait implementieren. Dafür brauchst du dynamische Dispatch.

  ## dyn Trait: dynamische Dispatch

  Manchmal steht der Typ erst zur Laufzeit fest: Die Konfiguration entscheidet, ob JSON oder Klartext geloggt wird. Oder du willst Werte verschiedener Typen in einem `Vec` sammeln. Dafür gibt es **Trait-Objekte**: `&dyn Trait` oder `Box<dyn Trait>` ([Book: Trait Objects](https://doc.rust-lang.org/book/ch18-02-trait-objects.html)).

  ```rust
  trait Pruefung {
      fn name(&self) -> &str;
      fn ok(&self) -> bool;
  }

  struct Festplatte { frei_prozent: u8 }
  struct Dienst { name: String, laeuft: bool }

  impl Pruefung for Festplatte {
      fn name(&self) -> &str { "festplatte" }
      fn ok(&self) -> bool { self.frei_prozent >= 10 }
  }

  impl Pruefung for Dienst {
      fn name(&self) -> &str { &self.name }
      fn ok(&self) -> bool { self.laeuft }
  }

  fn main() {
      // Verschiedene Typen in einem Vec: nur als Trait-Objekte möglich
      let pruefungen: Vec<Box<dyn Pruefung>> = vec![
          Box::new(Festplatte { frei_prozent: 4 }),
          Box::new(Dienst { name: String::from("nginx"), laeuft: true }),
      ];

      for p in &pruefungen {
          let status = if p.ok() { "OK" } else { "FEHLER" };
          println!("{:<12} {status}", p.name()); // Aufruf über die vtable
      }
  }
  ```

  Was passiert im Speicher? Ein `&dyn Pruefung` ist ein **Fat Pointer** aus zwei Zeigern: einer auf die Daten, einer auf eine **vtable** ([Reference: Trait objects](https://doc.rust-lang.org/reference/types/trait-object.html)). Die vtable erzeugt der Compiler einmal pro Kombination aus konkretem Typ und Trait. Sie enthält die Adressen der Methoden, dazu Größe, Ausrichtung und den Destruktor des Typs. `p.ok()` liest die Adresse aus der vtable und springt dorthin. Der konkrete Typ ist hinter dem Zeiger „vergessen“ – deshalb braucht ein `dyn Trait` immer einen Zeiger wie `&` oder `Box`: Seine Größe ist zur Compile-Zeit unbekannt.

  > [!DEEP] Dyn compatibility
  > Nicht jeder Trait taugt für `dyn`. Die vtable braucht für jede Methode genau eine Adresse. Eine generische Methode `fn f<T>(&self, t: T)` hätte unendlich viele Varianten, und eine Methode, die `Self` zurückgibt, bräuchte die unbekannte Größe von `Self`. Solche Traits sind nicht **dyn compatible** (früher „object safe“), der Compiler meldet [E0038](https://doc.rust-lang.org/error_codes/E0038.html). Die genauen Regeln stehen in der [Referenz](https://doc.rust-lang.org/reference/items/traits.html#dyn-compatibility). `Clone` ist aus diesem Grund nicht dyn compatible.

  ### Statisch oder dynamisch?

  | | Generics / `impl Trait` | `dyn Trait` |
  | --- | --- | --- |
  | Auflösung | zur Compile-Zeit | zur Laufzeit über die vtable |
  | Laufzeitkosten | keine, Inlining möglich | ein indirekter Aufruf, kein Inlining über die Grenze |
  | Code-Größe | eine Kopie pro Typ | eine Kopie insgesamt |
  | Verschiedene Typen in einer Collection | nein | ja |
  | Typ steht erst zur Laufzeit fest | nein | ja |
  | Einschränkungen | keine | Trait muss dyn compatible sein |

  Faustregel: Generics sind der Standard. `dyn` nimmst du, wenn du heterogene Collections brauchst, der Typ von der Laufzeit abhängt oder ein Plugin-artiges System ohne Code-Explosion entstehen soll. Die Kosten eines vtable-Aufrufs sind in den meisten Anwendungen nicht messbar – die Entscheidung ist meist eine Design-Frage, keine Performance-Frage.

  > [!INTERVIEW] „Was ist der Unterschied zwischen impl Trait und dyn Trait?“
  > `impl Trait` ist statische Dispatch: Der Compiler kennt den konkreten Typ und erzeugt passenden Code (Monomorphisierung). In Rückgabe-Position steht es für genau einen verborgenen Typ. `dyn Trait` ist dynamische Dispatch: ein Fat Pointer aus Datenzeiger und vtable-Zeiger, der Methodenaufruf geht zur Laufzeit über die vtable. Damit kann eine Funktion je nach Laufzeitbedingung verschiedene Typen zurückgeben oder ein `Vec` verschiedene Typen halten. Kosten: ein indirekter Aufruf und meist eine Heap-Allokation für `Box`.

  ## Die wichtigsten Traits der Standardbibliothek

  Viele Traits der Standardbibliothek lassen sich mit `#[derive(…)]` automatisch implementieren ([Rust by Example: Derive](https://doc.rust-lang.org/rust-by-example/trait/derive.html)):

  | Trait | Bedeutung | Anmerkung |
  | --- | --- | --- |
  | `Debug` | Ausgabe mit `{:?}` für Entwickler | fast immer ableiten |
  | `Clone` | explizite Kopie mit `.clone()` | kann teuer sein (Heap) |
  | `Copy` | implizite Bit-Kopie statt Move | nur für Typen ohne Heap-Daten, verlangt `Clone` |
  | `PartialEq` / `Eq` | `==` | `Eq` verspricht Reflexivität, `f64` ist wegen `NaN` nur `PartialEq` |
  | `PartialOrd` / `Ord` | `<`, `>`, `sort()` | abgeleitet: Felder von oben nach unten, Varianten in Deklarationsreihenfolge |
  | `Hash` | als Schlüssel in `HashMap`/`HashSet` | muss zu `Eq` passen |
  | `Default` | Standardwert mit `Default::default()` | Zahlen 0, `String` leer, `Option` `None` |

  `Display` (Ausgabe mit `{}` für Menschen) lässt sich **nicht** ableiten – wie ein Wert für Nutzer aussieht, musst du entscheiden. Wer `Display` implementiert, bekommt `.to_string()` geschenkt, weil die Standardbibliothek `ToString` für jedes `T: Display` implementiert.

  ```rust
  use std::collections::HashSet;
  use std::fmt;

  #[derive(Debug, Clone, Copy, PartialEq, Eq, Hash, PartialOrd, Ord, Default)]
  enum Level {
      #[default]
      Info,
      Warn,
      Error,
  }

  #[derive(Debug, Clone, PartialEq)]
  struct Ereignis {
      level: Level,
      text: String,
  }

  impl fmt::Display for Ereignis {
      fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
          write!(f, "{:?}: {}", self.level, self.text)
      }
  }

  fn main() {
      let e = Ereignis { level: Level::Error, text: String::from("Platte voll") };
      println!("{e}");     // Display: Error: Platte voll
      println!("{e:?}");   // Debug: Ereignis { level: Error, text: "Platte voll" }
      println!("{}", Level::Error > Level::Warn); // true: Reihenfolge der Varianten
      println!("{:?}", Level::default());         // Info

      let mut gesehen = HashSet::new();           // braucht Hash + Eq
      gesehen.insert(Level::Warn);
      println!("{}", gesehen.contains(&Level::Warn));
  }
  ```

  > [!WARNING] Hash und Eq müssen zusammenpassen
  > Wenn `a == b`, dann muss auch `hash(a) == hash(b)` gelten ([std: Hash and Eq](https://doc.rust-lang.org/std/hash/trait.Hash.html#hash-and-eq)). Implementierst du `PartialEq` von Hand (etwa ohne Groß-/Kleinschreibung), aber leitest `Hash` ab, findet eine `HashMap` gleiche Schlüssel nicht wieder. Entweder beide ableiten oder beide von Hand schreiben.

  ### Konvertierungen: From, Into und AsRef

  Implementierst du [`From<A> for B`](https://doc.rust-lang.org/std/convert/trait.From.html), bekommst du `Into<B> for A` automatisch – die Standardbibliothek hat dafür eine generische Implementierung. Deshalb implementiert man immer `From` und benutzt in Signaturen gern `Into`. [`AsRef`](https://doc.rust-lang.org/std/convert/trait.AsRef.html) ist die billige Variante: eine geliehene Sicht ohne Kopie.

  ```rust
  use std::path::Path;

  struct Port(u16);

  impl From<u16> for Port {
      fn from(n: u16) -> Self {
          Port(n)
      }
  }

  struct Server {
      name: String,
  }

  impl Server {
      // akzeptiert &str und String – dank Into<String>
      fn new(name: impl Into<String>) -> Self {
          Server { name: name.into() }
      }
  }

  // akzeptiert &str, String, &Path, PathBuf …
  fn endung<P: AsRef<Path>>(pfad: P) -> Option<String> {
      let ext = pfad.as_ref().extension()?;
      Some(ext.to_string_lossy().into_owned())
  }

  fn main() {
      let p = Port::from(8080);
      let q: Port = 443.into(); // Into gibt es gratis, weil From implementiert ist
      let a = Server::new("alpha");
      let b = Server::new(String::from("beta"));
      println!("{} {} {} {}", p.0, q.0, a.name, b.name);
      println!("{:?}", endung("config.toml")); // Some("toml")
  }
  ```

  Auch `Iterator` ist ein Trait mit einer Pflichtmethode (`next`) und Dutzenden Default-Methoden wie `map`, `filter` und `sum`. Ihm ist das Modul Closures & Iteratoren gewidmet.

  ## Orphan Rule und Operator-Überladung

  Du darfst `impl Trait for Typ` nur schreiben, wenn der **Trait oder der Typ aus deinem Crate** stammt ([Reference: Orphan rules](https://doc.rust-lang.org/reference/items/implementations.html#orphan-rules)). `impl Display for Vec<u8>` scheitert mit [E0117](https://doc.rust-lang.org/error_codes/E0117.html), weil beide aus der Standardbibliothek stammen. Der Grund heißt **Kohärenz**: Gäbe es zwei Crates, die beide `Display for Vec<u8>` implementieren, wüsste der Compiler nicht, welche Implementierung gilt – und ein Update einer Abhängigkeit könnte deinen Code brechen.

  Der übliche Ausweg ist ein **Newtype**: ein Tupel-Struct mit einem Feld, das den fremden Typ einpackt ([Book: Newtype Pattern](https://doc.rust-lang.org/book/ch20-02-advanced-traits.html#implementing-external-traits-with-the-newtype-pattern)). Der Newtype ist dein Typ, also darfst du jeden Trait für ihn implementieren.

  Operatoren wie `+` sind in Rust Traits aus [`std::ops`](https://doc.rust-lang.org/std/ops/index.html). `a + b` ist Syntax für `Add::add(a, b)`. Wer `Add` implementiert, bekommt `+` für seinen Typ:

  ```rust
  use std::fmt;
  use std::ops::Add;

  #[derive(Debug, Clone, Copy, PartialEq)]
  struct Cent(u64);

  impl Add for Cent {
      type Output = Cent;

      fn add(self, rhs: Cent) -> Cent {
          Cent(self.0 + rhs.0)
      }
  }

  // Newtype: eigener Typ um Vec<String>, damit Display erlaubt ist
  struct Tags(Vec<String>);

  impl fmt::Display for Tags {
      fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
          write!(f, "#{}", self.0.join(" #"))
      }
  }

  fn main() {
      let summe = Cent(1999) + Cent(500);
      println!("{summe:?}"); // Cent(2499)
      let tags = Tags(vec![String::from("rust"), String::from("cli")]);
      println!("{tags}");    // #rust #cli
  }
  ```

  `type Output` ist ein **assoziierter Typ**: Der Implementierer legt fest, welcher Typ bei `a + b` herauskommt. `add` nimmt `self` per Wert, deshalb ist `Cent` hier `Copy` – sonst wäre `a` nach `a + b` verbraucht, wie beim `String`-Plus aus dem Collections-Modul.

  > [!PRAXIS] Newtypes als Werkzeug für Korrektheit
  > In echten Codebasen sind Newtypes nicht nur ein Trick gegen die Orphan Rule. `struct Cent(u64)`, `struct UserId(u64)` und `struct OrderId(u64)` machen Verwechslungen zu Compile-Fehlern: Eine Funktion `fn storniere(id: OrderId)` nimmt keine `UserId` an. Zur Laufzeit kostet das nichts, der Newtype hat dieselbe Größe wie der eingepackte Wert. In Code-Reviews ist „nackter `u64` für Geld“ ein häufiger Kommentar.

  ## Häufige Fehler

  - **Bound vergessen.** `binary operation > cannot be applied to type &T` ([E0369](https://doc.rust-lang.org/error_codes/E0369.html)) oder `T doesn't implement Display` ([E0277](https://doc.rust-lang.org/error_codes/E0277.html)). Die Hilfe des Compilers schlägt den fehlenden Bound meist wörtlich vor.
  - **Verschiedene Typen hinter `impl Trait` zurückgeben.** `if and else have incompatible types`. Lösung: `Box<dyn Trait>`, oder ein Enum, wenn die Varianten feststehen.
  - **`dyn Trait` ohne Zeiger.** `Vec<dyn Pruefung>` geht nicht, weil die Größe unbekannt ist. Richtig: `Vec<Box<dyn Pruefung>>`.
  - **Trait nicht dyn compatible.** [E0038](https://doc.rust-lang.org/error_codes/E0038.html). Die generische Methode in einen eigenen Trait auslagern oder mit `where Self: Sized` aus der vtable ausnehmen.
  - **Fremder Trait für fremden Typ.** [E0117](https://doc.rust-lang.org/error_codes/E0117.html). Newtype drumherum bauen.
  - **`Into` statt `From` implementieren.** Funktioniert, verschenkt aber die automatische Gegenrichtung. Immer `From` implementieren.
  - **Blind alles ableiten.** `Copy` auf einem großen Struct macht jede Übergabe zur Kopie; `Default` auf einem Typ ohne sinnvollen Standardwert lädt zu ungültigen Zuständen ein.

  ## Zusammenfassung

  - Generics werden monomorphisiert: eine Kopie pro konkretem Typ, keine Laufzeitkosten, dafür mehr Compile-Zeit und Binary-Größe.
  - Trait Bounds (`T: Trait`, `+`, `where`) legen fest, was generischer Code mit `T` tun darf. Rust prüft den generischen Code gegen die Bounds, nicht gegen jeden Typ einzeln.
  - Traits haben Pflicht- und Default-Methoden; Implementierungen stehen in eigenen `impl Trait for Typ`-Blöcken.
  - `impl Trait` im Argument ist ein anonymer Typparameter, in der Rückgabe genau ein verborgener Typ.
  - `dyn Trait` ist ein Fat Pointer mit vtable: flexibel zur Laufzeit, ein indirekter Aufruf, nur für dyn-compatible Traits.
  - `derive` liefert `Debug`, `Clone`, `Copy`, `PartialEq`, `Eq`, `PartialOrd`, `Ord`, `Hash`, `Default`; `Display` schreibst du selbst.
  - `From` implementieren, `Into` benutzen; `AsRef` für billige Sichten.
  - Orphan Rule: Trait oder Typ muss lokal sein. Newtypes lösen das und machen Code typsicherer.
