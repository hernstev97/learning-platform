        url: https://doc.rust-lang.org/rust-by-example/trait/dyn.html

  - id: blanket-impl-erklaeren
    type: explain
    title: Ein Trait für alle Typen
    prompt: Erkläre, was die `impl`-Zeile bewirkt, warum `42.protokoll()` ohne eigene Implementierung für `i32` funktioniert und was passiert, wenn du zusätzlich `impl Protokoll for i32 { … }` schreibst.
    lang: rust
    code: |
      use std::fmt::Display;

      trait Protokoll {
          fn protokoll(&self) -> String;
      }

      impl<T: Display + ?Sized> Protokoll for T {
          fn protokoll(&self) -> String {
              format!("LOG: {self}")
          }
      }

      fn main() {
          println!("{}", 42.protokoll());
          println!("{}", "start".protokoll());
      }
    points:
      - Das ist eine Blanket Implementation – `Protokoll` gilt für jeden Typ `T`, der `Display` implementiert.
      - "`i32` und `str` implementieren `Display`, deshalb haben sie die Methode automatisch; `?Sized` schließt unsized Typen wie `str` ein."
      - "Die Standardbibliothek nutzt dasselbe Muster, um `to_string()` für jedes `T: Display` anzubieten."
      - Eine zweite Implementierung für `i32` scheitert mit E0119 (conflicting implementations), weil `i32` schon abgedeckt ist.
    explanation: |
      `impl<T: Display + ?Sized> Protokoll for T` ist eine Blanket Implementation: eine Implementierung für alle Typen, die den Bound erfüllen. `42` ist ein `i32`, `"start"` ein `&str` und damit ein Zeiger auf `str` – beide implementieren `Display`, also haben sie `protokoll()`. `?Sized` hebt den impliziten Bound `Sized` auf, damit auch `str` selbst gemeint ist. Genauso implementiert die Standardbibliothek `ToString` für jedes `T: Display`, weshalb du `to_string()` nie selbst schreibst. Weil `i32` schon abgedeckt ist, würde `impl Protokoll for i32` eine zweite Implementierung für dieselbe Kombination erzeugen – der Compiler lehnt das als `conflicting implementations` (E0119) ab. Aufgerufen wird statisch: Pro Typ entsteht eine monomorphisierte Kopie.
    resources:
      - title: std · ToString (Blanket Implementation)
        url: https://doc.rust-lang.org/std/string/trait.ToString.html#impl-ToString-for-T
      - title: Error-Index · E0119
        url: https://doc.rust-lang.org/error_codes/E0119.html

  - id: rabatt-regeln
    type: practice
    title: Rabattregeln für einen Shop
    prompt: |
      Ein Shop berechnet Endpreise in Cent. Baue ein kleines Regelwerk:

      - Trait `Rabatt` mit der Pflichtmethode `fn anwenden(&self, cent: u64) -> u64` und der Default-Methode `fn beschreibung(&self) -> String`, die `"Rabatt"` liefert.
      - `Prozent(u8)`: zieht den Prozentsatz ab (Werte über 100 wie 100 behandeln). Beschreibung `"10 %"`.
      - `Festbetrag(u64)`: zieht einen Betrag in Cent ab, der Preis wird nie negativ. Beschreibung `"-2,50 €"` für 250.
      - `Kette(Vec<Box<dyn Rabatt>>)`: wendet alle Regeln nacheinander an und implementiert selbst `Rabatt`. Beschreibung: die Einzelbeschreibungen, verbunden mit `", dann "`.
      - `fn endpreis(cent: u64, regel: &dyn Rabatt) -> u64`.

      Die Tests zeigen das erwartete Verhalten. Lass sie im Playground über **Test** laufen.
    lang: rust
    starter: |
      trait Rabatt {
          // Pflichtmethode und Default-Methode
      }

      struct Prozent(u8);
      struct Festbetrag(u64);
      struct Kette(Vec<Box<dyn Rabatt>>);

      fn endpreis(cent: u64, regel: &dyn Rabatt) -> u64 {
          todo!()
      }

      fn main() {
          let aktion = Kette(vec![Box::new(Prozent(10)), Box::new(Festbetrag(500))]);
          println!("{}: {} Cent", aktion.beschreibung(), endpreis(10_000, &aktion));
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn prozent_rabatt() {
              assert_eq!(Prozent(20).anwenden(5_000), 4_000);
          }

          #[test]
          fn festbetrag_nie_negativ() {
              assert_eq!(Festbetrag(1_000).anwenden(300), 0);
          }

          #[test]
          fn kette_in_reihenfolge() {
              let erst_prozent = Kette(vec![Box::new(Prozent(10)), Box::new(Festbetrag(500))]);
              let erst_betrag = Kette(vec![Box::new(Festbetrag(500)), Box::new(Prozent(10))]);
              assert_eq!(endpreis(10_000, &erst_prozent), 8_500);
              assert_eq!(endpreis(10_000, &erst_betrag), 8_550);
          }

          #[test]
          fn beschreibung_der_kette() {
              let k = Kette(vec![Box::new(Prozent(10)), Box::new(Festbetrag(250))]);
              assert_eq!(k.beschreibung(), "10 %, dann -2,50 €");
          }

          #[test]
          fn leere_kette_aendert_nichts() {
              assert_eq!(Kette(Vec::new()).anwenden(999), 999);
          }
      }
    solution: |
      trait Rabatt {
          fn anwenden(&self, cent: u64) -> u64;

          fn beschreibung(&self) -> String {
              String::from("Rabatt")
          }
      }

      struct Prozent(u8);
      struct Festbetrag(u64);
      struct Kette(Vec<Box<dyn Rabatt>>);

      impl Rabatt for Prozent {
          fn anwenden(&self, cent: u64) -> u64 {
              let prozent = u64::from(self.0.min(100));
              cent - cent * prozent / 100
          }
          fn beschreibung(&self) -> String {
              format!("{} %", self.0)
          }
      }

      impl Rabatt for Festbetrag {
          fn anwenden(&self, cent: u64) -> u64 {
              cent.saturating_sub(self.0)
          }
          fn beschreibung(&self) -> String {
              format!("-{},{:02} €", self.0 / 100, self.0 % 100)
          }
      }

      impl Rabatt for Kette {
          fn anwenden(&self, cent: u64) -> u64 {
              let mut preis = cent;
              for regel in &self.0 {
                  preis = regel.anwenden(preis);
              }
              preis
          }
          fn beschreibung(&self) -> String {
              let mut teile = Vec::new();
              for regel in &self.0 {
                  teile.push(regel.beschreibung());
              }
              teile.join(", dann ")
          }
      }

      fn endpreis(cent: u64, regel: &dyn Rabatt) -> u64 {
          regel.anwenden(cent)
      }

      fn main() {
          let aktion = Kette(vec![Box::new(Prozent(10)), Box::new(Festbetrag(500))]);
          println!("{}: {} Cent", aktion.beschreibung(), endpreis(10_000, &aktion));
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn prozent_rabatt() {
              assert_eq!(Prozent(20).anwenden(5_000), 4_000);
          }

          #[test]
          fn festbetrag_nie_negativ() {
              assert_eq!(Festbetrag(1_000).anwenden(300), 0);
          }

          #[test]
          fn kette_in_reihenfolge() {
              let erst_prozent = Kette(vec![Box::new(Prozent(10)), Box::new(Festbetrag(500))]);
              let erst_betrag = Kette(vec![Box::new(Festbetrag(500)), Box::new(Prozent(10))]);
              assert_eq!(endpreis(10_000, &erst_prozent), 8_500);
              assert_eq!(endpreis(10_000, &erst_betrag), 8_550);
          }

          #[test]
          fn beschreibung_der_kette() {
              let k = Kette(vec![Box::new(Prozent(10)), Box::new(Festbetrag(250))]);
              assert_eq!(k.beschreibung(), "10 %, dann -2,50 €");
          }

          #[test]
          fn leere_kette_aendert_nichts() {
              assert_eq!(Kette(Vec::new()).anwenden(999), 999);
          }
      }
    checklist:
      - "`Rabatt` hat genau eine Pflichtmethode; `beschreibung` hat einen Default-Rumpf."
      - "`Festbetrag` kann nicht unter 0 fallen – du nutzt `saturating_sub` oder eine Prüfung, keine Subtraktion, die bei `u64` paniken würde."
      - "`Kette` hält `Vec<Box<dyn Rabatt>>` und implementiert selbst `Rabatt` – eine Kette kann also wieder in einer Kette stecken."
      - "`endpreis` nimmt `&dyn Rabatt` und funktioniert mit einzelnen Regeln und mit Ketten."
      - Alle fünf Tests laufen grün.
    hints:
      - "`u64::from(self.0)` wandelt das `u8` verlustfrei um; `self.0.min(100)` begrenzt vorher."
      - "`format!(\"{:02}\", 5)` ergibt `05`."
    explanation: |
      Die Aufgabe kombiniert beide Dispatch-Arten sinnvoll: Die Regeln kennen ihren Typ, die `Kette` sammelt verschiedene Typen und braucht deshalb `Box<dyn Rabatt>`. Weil `Kette` selbst `Rabatt` implementiert, lassen sich Regeln beliebig verschachteln – das Composite-Muster, in Rust über Traits statt Vererbung. Der Test `kette_in_reihenfolge` zeigt, warum die Reihenfolge fachlich zählt: 10 % von 100 € und dann 5 € ergibt 85 €, umgekehrt 85,50 €. `saturating_sub` verhindert einen Überlauf bei `u64`, der im Debug-Build paniken würde.
    resources:
      - title: The Rust Book · Using Trait Objects
        url: https://doc.rust-lang.org/book/ch18-02-trait-objects.html
      - title: std · u64::saturating_sub
        url: https://doc.rust-lang.org/std/primitive.u64.html#method.saturating_sub
