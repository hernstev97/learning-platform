id: closures-iteratoren
title: Closures & Iteratoren
level: 2
minutes: 180
summary: Closures fangen ihre Umgebung ein, Iteratoren verarbeiten Daten Schritt für Schritt und erst bei Bedarf – zusammen ergeben sie den idiomatischen, lesbaren und trotzdem schnellen Rust-Stil.
goals:
  - Du erklärst, wie eine Closure Variablen einfängt (per `&`, per `&mut`, per Wert) und was `move` daran ändert.
  - Du wählst für Closure-Parameter den passenden Bound `Fn`, `FnMut` oder `FnOnce` und begründest ihn.
  - Du gibst Closures als `impl Fn` zurück und speicherst verschiedene Closures als `Box<dyn Fn>`.
  - Du baust Iterator-Ketten aus Adaptern und Konsumenten, sagst ihr Verhalten dank Laziness vorher und sammelst mit `collect` in `Vec`, `HashMap`, `String` und `Result<Vec<_>, _>`.
  - Du implementierst `Iterator` für einen eigenen Typ und erklärst, warum Iterator-Ketten eine Zero-Cost Abstraction sind.
