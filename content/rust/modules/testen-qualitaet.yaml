- id: falsche-erwartung
  type: bug
  title: Der Test erlaubt den Bug
  prompt: Die Fachregel verlangt mindestens drei Zeichen. Der folgende Test akzeptiert zwei. Korrigiere die fehlerhafte
    Assertion.
  lang: rust
  code: |-
    fn gueltig(text: &str) -> bool { text.chars().count() >= 3 }
    #[test]
    fn mindestlaenge() {
        assert!(gueltig("ab"));
        assert!(gueltig("abc"));
    }
  lines:
  - 4
  fix:
  - line: 4
    answers:
    - assert!(!gueltig("ab"));
    - assert_eq!(gueltig("ab"), false);
  explanation: Zwei Zeichen liegen unter der Grenze und müssen abgelehnt werden. Der zweite Test hält den ersten
    gültigen Wert fest.
  resources:
  - *id001
- id: property-tautologie
  type: bug
  title: Immer grün, nie hilfreich
  prompt: |
    Im Review fällt auf, dass `sortiere` doppelte Werte entfernt. Das soll es nicht: Die Funktion soll sortieren wie `Vec::sort`. Der Property-Test daneben lief trotzdem in jedem CI-Lauf grün, mit 256 Listen pro Lauf. Repariere nicht `sortiere`, sondern den Test: Finde die Zeile, die ihn wertlos macht, und korrigiere sie so, dass er `sortiere` mit der Standardsortierung vergleicht.
  lang: rust
  code: |-
    use proptest::prelude::*;

    fn sortiere(mut werte: Vec<u32>) -> Vec<u32> {
        werte.sort();
        werte.dedup();
        werte
    }

    proptest! {
        #[test]
        fn sortiert_wie_std(werte in prop::collection::vec(0u32..10, 0..20)) {
            let ergebnis = sortiere(werte.clone());
            let mut erwartet = ergebnis.clone();
            erwartet.sort();
            prop_assert_eq!(ergebnis, erwartet);
        }
    }
  lines:
  - 13
  fix:
  - line: 13
    answers:
    - let mut erwartet = werte.clone();
    - let mut erwartet = werte;
    - let mut erwartet = werte.to_vec();
  hints:
  - Woraus wird `erwartet` berechnet – aus der Eingabe oder aus dem Ergebnis?
  - Ein sortiertes Ergebnis noch einmal zu sortieren ändert nichts.
  explanation: |
    Die Erwartung wird aus dem Ergebnis berechnet. Ein schon sortiertes `ergebnis` bleibt nach `sort` gleich, also prüft der Test nur „sortiert ist sortiert“ – auch eine Liste, aus der Werte verschwunden sind, ist sortiert. Mit `erwartet` aus der Eingabe `werte` wird der Test zum Vergleich mit einer Referenz, und genau den braucht die Eigenschaft. Lokal blieb die fehlerhafte Fassung grün, die korrigierte scheiterte sofort mit einem geschrumpften Gegenbeispiel wie `werte = [7, 7]`. Dass der Bereich `0u32..10` ist, hilft: Unter zufälligen `u32` aus dem ganzen Wertebereich kämen Duplikate fast nie vor.
  resources:
  - title: proptest-Buch · Shrinking
    url: https://proptest-rs.github.io/proptest/proptest/tutorial/shrinking-basics.html
  - title: prop::collection::vec
    url: https://docs.rs/proptest/latest/proptest/collection/fn.vec.html
- id: reader-test
  type: explain
  title: Warum Cursor statt Festplatte?
  prompt: Erkläre, welche Aussagen dieser Test ermöglicht und welche Grenze noch ungetestet ist.
  lang: rust
  code: |-
    fn auswerten(reader: impl std::io::BufRead) -> std::io::Result<usize> {
        reader.lines().try_fold(0, |n, line| line.map(|_| n + 1))
    }
    #[test]
    fn zwei_zeilen() {
        assert_eq!(auswerten(std::io::Cursor::new("a
    b
    ")).unwrap(), 2);
    }
  points:
  - Die Verarbeitung hängt an einer kleinen Reader-Schnittstelle.
  - Cursor liefert deterministische Daten ohne gemeinsame Datei.
  - Der Test prüft die Zeilenverarbeitung.
  - Öffnen von Pfaden und CLI-Argumente benötigen zusätzliche Integrationstests.
  explanation: Die I/O-Abstraktion trennt Verarbeitung vom Ursprung der Bytes. Der Test bleibt schnell und isoliert.
    Er ersetzt keinen Test der äußeren Dateigrenze.
  resources:
  - title: std::io::Cursor
    url: https://doc.rust-lang.org/std/io/struct.Cursor.html
- id: shrinking-lesen
  type: explain
  title: Was proptest gefunden hat
  prompt: |
    Nach der Korrektur aus der vorigen Übung meldet `cargo test` für `sortiert_wie_std` das Folgende (gekürzt, Pfad abgekürzt). Erkläre einer Kollegin, was die Meldung über `sortiere` sagt, wie das Gegenbeispiel zustande kam, warum es `[7, 7]` und nicht `[0, 0]` ist und was mit der Datei aus der ersten Zeile geschehen soll.
  lang: text
  code: |-
    proptest: Saving this and future failures in …/tests/props_tautologie_fixed.proptest-regressions
    cc dac5fb658dc44b9bb5bef54b88d5eb58ef2db4ecdfffb5efe54b053ad9c0da13

    thread 'sortiert_wie_std' (1482343) panicked at testen/tests/props_tautologie_fixed.rs:9:1:
    Test failed: assertion failed: `(left == right)`
      left: `[7]`,
     right: `[7, 7]` at testen/tests/props_tautologie_fixed.rs:15.
    minimal failing input: werte = [
        7,
        7,
    ]
  points:
  - "`left` ist das Ergebnis von `sortiere`, `right` die Referenz aus `sort`: Aus `[7, 7]` wird `[7]`, ein Duplikat verschwindet."
  - Proptest hat eine zufällige scheiternde Liste gefunden und sie verkleinert, solange der Test weiter scheiterte (Shrinking).
  - Die Zahl 7 ist Zufall; proptest verkleinert Elemente einzeln, und jede einzelne Verkleinerung würde die beiden Werte ungleich und den Test grün machen.
  - Die `cc …`-Zeile ist der gespeicherte Seed; proptest spielt ihn bei jedem Lauf zuerst ab, die `.proptest-regressions`-Datei gehört ins Repository.
  explanation: |
    Die Assertion vergleicht `ergebnis` (links) mit `erwartet` (rechts): `sortiere` macht aus `[7, 7]` ein `[7]`, entfernt also Duplikate. Proptest hat zuerst irgendeine Liste aus dem Bereich `0..10` gefunden, die scheitert, und sie dann geschrumpft: Elemente weglassen und einzelne Werte verkleinern, solange der Test rot bleibt. Bei zwei gleichen Werten endet das früh, denn jede Verkleinerung eines einzelnen Elements macht die Werte ungleich, und ohne Duplikat ist der Test grün. Deshalb steht da `[7, 7]` und in einem anderen Lauf vielleicht `[6, 6]` – minimal im Sinn von proptest, nicht das kleinste denkbare Beispiel. Die erste Zeile nennt die Datei, in der proptest den Seed (`cc …`) abgelegt hat. Spätere Läufe prüfen diesen Fall zuerst, bevor neue Eingaben entstehen; committet, prüfen CI und Kollegen ihn auch.
  resources:
  - title: proptest-Buch · Failure Persistence
    url: https://proptest-rs.github.io/proptest/proptest/failure-persistence.html
  - title: proptest-Buch · Shrinking
    url: https://proptest-rs.github.io/proptest/proptest/tutorial/shrinking-basics.html
- id: grenzen-testen
  type: practice
  title: Eine Validierung gegen Gegenbeispiele absichern
  prompt: 'Schreibe `name_gueltig`: Nach trim müssen 3 bis 12 Unicode-Skalarwerte vorhanden sein. Schreibe Tests
    für darunter, beide Grenzen, darüber, Leerraum und Umlaute.'
  lang: rust
  solution: |-
    fn name_gueltig(text: &str) -> bool {
        (3..=12).contains(&text.trim().chars().count())
    }
    #[test]
    fn grenzen() {
        assert!(!name_gueltig("ab"));
        assert!(name_gueltig("abc"));
        assert!(name_gueltig("abcdefghijkl"));
        assert!(!name_gueltig("abcdefghijklm"));
    }
    #[test]
    fn leerraum_und_unicode() {
        assert!(name_gueltig("  äöü  "));
        assert!(!name_gueltig("   "));
    }
    fn main() {}
  checklist:
  - Beide zulässigen Grenzen werden separat geprüft.
  - Zu kurzer und zu langer Text werden abgelehnt.
  - Leerraum wird vor der Längenprüfung entfernt.
  - Die Prüfung zählt chars und keine UTF-8-Bytes.
  - Du erklärst die Abgrenzung zwischen Unicode-Skalarwerten und sichtbaren Graphemen.
  explanation: Der Vertrag nennt bewusst Unicode-Skalarwerte. `chars().count()` erfüllt ihn; `len()` würde Bytes
    zählen. Die Tests unterscheiden Off-by-one, vergessenen trim und Bytezählung.
  resources:
  - *id001
- id: cli-test-tempdir
  type: practice
  title: logwerk von außen testen
  prompt: |
    `logwerk zaehlen DATEI` gibt für jede vorkommende Stufe eine Zeile `STUFE ANZAHL` aus (Reihenfolge INFO, WARN, ERROR). Eine ungültige Zeile ergibt `logwerk: Zeile N: …` auf stderr und Status 1; ein fehlendes Argument ergibt eine Zeile mit `Aufruf` auf stderr und Status 2.

    Schreibe `tests/cli.rs` mit assert_cmd 2.2, predicates und tempfile:

    - gültige Datei: Status 0, exakte Ausgabe auf stdout, stderr leer
    - Datei mit einer ungültigen zweiten Zeile `DEBUG nein`: Status 1, stdout leer, stderr nennt Zeile 2 und die Stufe
    - Aufruf ohne Datei: Status 2

    Jeder Test bekommt sein eigenes Temp-Verzeichnis. Eine Hilfsfunktion legt die Logdatei an. Lass die Tests mit `cargo test` laufen und prüfe, dass sie auch scheitern, wenn du im Programm den Status 1 durch 0 ersetzt.
  lang: rust
  solution: |-
    use std::fs;

    use assert_cmd::cargo::cargo_bin_cmd;
    use predicates::prelude::*;
    use tempfile::TempDir;

    fn mit_log(inhalt: &str) -> (TempDir, String) {
        let dir = tempfile::tempdir().unwrap();
        let pfad = dir.path().join("app.log");
        fs::write(&pfad, inhalt).unwrap();
        let pfad = pfad.to_str().unwrap().to_owned();
        (dir, pfad) // dir zurückgeben, sonst löscht der Drop das Verzeichnis sofort
    }

    #[test]
    fn gueltige_datei() {
        let (_dir, pfad) = mit_log("INFO start\nERROR db\n\nINFO ende\n");
        cargo_bin_cmd!("logwerk")
            .args(["zaehlen", &pfad])
            .assert()
            .success()
            .stdout("INFO 2\nERROR 1\n")
            .stderr(predicate::str::is_empty());
    }

    #[test]
    fn kaputte_zeile() {
        let (_dir, pfad) = mit_log("INFO start\nDEBUG nein\n");
        cargo_bin_cmd!("logwerk")
            .args(["zaehlen", &pfad])
            .assert()
            .code(1)
            .stdout(predicate::str::is_empty())
            .stderr(predicate::str::contains("Zeile 2").and(predicate::str::contains("DEBUG")));
    }

    #[test]
    fn fehlendes_argument() {
        cargo_bin_cmd!("logwerk")
            .arg("zaehlen")
            .assert()
            .code(2)
            .stderr(predicate::str::contains("Aufruf"));
    }
  checklist:
  - "Die Tests nutzen `cargo_bin_cmd!(\"logwerk\")` oder `Command::new(env!(\"CARGO_BIN_EXE_logwerk\"))` statt eines festen Pfads."
  - Jeder Test prüft Status, stdout und stderr getrennt.
  - Jeder Test legt seine Datei in einem eigenen `tempdir()` an; kein fester Dateiname unter `/tmp`.
  - Das `TempDir` lebt, bis der Prozess gelaufen ist (nicht in der Hilfsfunktion gedroppt).
  - Der Fehlerfall prüft `code(1)` und den Inhalt von stderr, nicht nur `failure()`.
  - Du hast gesehen, dass mindestens ein Test rot wird, wenn das Programm bei kaputter Zeile mit 0 endet.
  verify: false
  hints:
  - "Die Hilfsfunktion kann `(TempDir, String)` zurückgeben; der Aufrufer bindet das Verzeichnis an `_dir`, nicht an `_`."
  - "`predicate::str::contains(\"Zeile 2\").and(predicate::str::contains(\"DEBUG\"))` verknüpft zwei Erwartungen."
  explanation: |
    `cargo_bin_cmd!` liefert den Pfad, den Cargo für Integrationstests setzt, und `assert()` sammelt Status und Ausgaben ein. Jede Assertion schaut auf einen Kanal: `success()` oder `code(n)` auf den Status, `stdout(…)` und `stderr(…)` auf die Ströme. Die Hilfsfunktion gibt das `TempDir` mit zurück; bindet der Test es an `_dir`, lebt das Verzeichnis bis zum Ende der Testfunktion. Mit `let (_, pfad) = …` würde es am Ende der Anweisung gedroppt, und `logwerk` fände die Datei nicht – lokal ausprobiert endete das mit Status 1 und „No such file or directory“. Weil jeder Test sein eigenes Verzeichnis hat, laufen die Tests parallel, ohne sich Dateien zu überschreiben. Lokal liefen alle drei Tests grün; mit Status 0 bei kaputter Zeile scheiterte `kaputte_zeile`.
  resources:
  - title: assert_cmd · cargo_bin_cmd!
    url: https://docs.rs/assert_cmd/latest/assert_cmd/cargo/macro.cargo_bin_cmd.html
  - title: assert_cmd · Assert
    url: https://docs.rs/assert_cmd/latest/assert_cmd/assert/struct.Assert.html
  - title: tempfile · Early drop pitfall
    url: https://docs.rs/tempfile/latest/tempfile/#early-drop-pitfall
