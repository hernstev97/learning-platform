- id: bin-exe-pfad
  type: gap
  title: Das gebaute Binary finden
  prompt: |
    Diese Hilfsfunktionen stehen in `tests/cli.rs` und werden aus den Testfunktionen aufgerufen. Ergänze den Pfad zum Binary `logwerk`, den Cargo für Integrationstests bereitstellt, den Aufruf, der das Programm ausführt und stdout und stderr einsammelt, sowie die beiden Prüfungen: Exit-Status 1 und Fehlermeldung auf stderr. Nur die Standardbibliothek.
  lang: rust
  code: |-
    use std::process::{Command, Output};

    fn logwerk(args: &[&str]) -> Output {
        Command::new(⟦env!("CARGO_BIN_EXE_logwerk")⟧)
            .args(args)
            .⟦output()⟧
            .expect("logwerk startet")
    }

    // wird aus den Testfunktionen in tests/cli.rs aufgerufen
    fn pruefe_fehlende_datei() {
        let aus = logwerk(&["zaehlen", "fehlt.log"]);
        assert_eq!(aus.status.⟦code()⟧, Some(1));
        assert!(aus.stdout.is_empty());
        assert!(String::from_utf8_lossy(&aus.⟦stderr⟧).contains("fehlt.log"));
    }
  gaps:
  - label: Pfad zum Binary
    hint: Cargo setzt beim Bauen von Integrationstests eine Umgebungsvariable `CARGO_BIN_EXE_<name>`. Welches Makro liest sie beim Kompilieren?
  - label: Ausführen und einsammeln
    hint: "`status()` liefert nur den Status, `spawn()` ein laufendes Kind. Die dritte Methode wartet und sammelt beide Ausgaben."
  - label: Exit-Status als Zahl
    hint: "`ExitStatus` hat eine Methode, die `Option<i32>` liefert."
  - label: Fehlerkanal
    hint: "`Output` hat die Felder `status`, `stdout` und …"
  explanation: |
    Cargo baut für Integrationstests jedes Binary des Pakets und setzt `CARGO_BIN_EXE_logwerk` auf dessen absoluten Pfad; `env!` liest den Wert beim Kompilieren, ein falscher Name ist also ein Compilerfehler. `output()` startet den Prozess, wartet auf sein Ende und liefert `Output` mit `status`, `stdout` und `stderr` als Bytes. `status.code()` ist `Option<i32>`, weil ein Prozess unter Unix auch durch ein Signal enden kann und dann keinen Code hat. Drei getrennte Prüfungen halten den Vertrag fest: Status 1, nichts auf stdout, Meldung mit Dateinamen auf stderr. Der Code hat keine `main` und läuft nur als Integrationstest; lokal war der Test im Paket `logwerk` grün. Im echten Test setzt du zusätzlich `current_dir` auf ein leeres temporäres Verzeichnis, wie in der Lektion: Sonst hängt das Ergebnis davon ab, ob zufällig eine `fehlt.log` im Paketverzeichnis liegt.
  resources:
  - title: Cargo · CARGO_BIN_EXE_<name>
    url: https://doc.rust-lang.org/cargo/reference/environment-variables.html#environment-variables-cargo-sets-for-crates
  - title: Command::output
    url: https://doc.rust-lang.org/std/process/struct.Command.html#method.output
  - title: ExitStatus::code
    url: https://doc.rust-lang.org/std/process/struct.ExitStatus.html#method.code
