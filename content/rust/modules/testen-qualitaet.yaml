id: testen-qualitaet
title: Tests & Code-Qualität
level: 3
minutes: 240
summary: Fachliche Verträge, Fehlerpfade und Programmgrenzen mit aussagekräftigen Tests und reproduzierbaren Werkzeugprüfungen
  sichern.
place: pc
goals:
- Du leitest Testfälle aus Regeln und Grenzwerten ab.
- Du unterscheidest Unit-, Integrations- und Dokumentationstests und testest ein CLI über Exit-Status, stdout und stderr.
- Du isolierst I/O, gibst jedem Test mit `tempfile` ein eigenes Verzeichnis und vermeidest reihenfolgeabhängige Tests.
- Du formulierst Property-Tests mit proptest und liest ein geschrumpftes Gegenbeispiel.
- Du setzt Snapshot-Tests mit insta gezielt ein und filterst zufällige Werte.
- Du setzt cargo test, rustfmt und Clippy mit klaren Aussagen ein.
