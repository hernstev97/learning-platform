id: testen-qualitaet
title: Tests & Code-Qualität
level: 3
minutes: 170
summary: Fachliche Verträge, Fehlerpfade und Programmgrenzen mit aussagekräftigen Tests und reproduzierbaren Werkzeugprüfungen
  sichern.
goals:
- Du leitest Testfälle aus Regeln und Grenzwerten ab.
- Du unterscheidest Unit-, Integrations- und Dokumentationstests.
- Du isolierst I/O und vermeidest reihenfolgeabhängige Tests.
- Du setzt cargo test, rustfmt und Clippy mit klaren Aussagen ein.
resources:
- &id001
  title: Rust Book · Tests schreiben
  url: https://doc.rust-lang.org/book/ch11-01-writing-tests.html
- title: Rust Book · Testorganisation
  url: https://doc.rust-lang.org/book/ch11-03-test-organization.html
- title: Cargo · cargo test
  url: https://doc.rust-lang.org/cargo/commands/cargo-test.html
- title: Clippy · Usage
  url: https://doc.rust-lang.org/clippy/usage.html
- title: rustdoc · Documentation tests
  url: https://doc.rust-lang.org/rustdoc/write-documentation/documentation-tests.html
lesson: |
  Ein Parser kompiliert, Clippy meldet nichts und der normale Beispieldatensatz wird richtig verarbeitet. Trotzdem kann ein leerer Datensatz paniken oder eine Zahl am Rand des zulässigen Bereichs falsch behandelt werden. Der Compiler prüft viele strukturelle Eigenschaften. Er weiß aber nicht, welchen fachlichen Vertrag du deinem Nutzer versprochen hast.

  Tests beschreiben diesen Vertrag anhand überprüfbarer Fälle. Gute Tests erhöhen die Freiheit, die Implementierung später zu ändern, weil sie das beobachtbare Verhalten festhalten. Schlechte Tests bilden jede interne Schleife nach und werden bei jeder sinnvollen Änderung zu zusätzlicher Arbeit. Dieses Modul verbindet Rusts eingebaute Tests mit Fehlerdiagnose, reproduzierbaren Werkzeugprüfungen und einer kleinen CI-Strategie.

  ## Ein Test braucht eine überprüfbare Behauptung

  `#[test]` markiert eine Testfunktion. `cargo test` baut einen Testrunner und führt die Tests aus. Eine fehlschlagende Assertion lässt den Test scheitern. Das [Testkapitel](https://doc.rust-lang.org/book/ch11-01-writing-tests.html) beschreibt Einrichtung, Aktion und Erwartung als die drei grundlegenden Schritte.

  ```rust
  fn rabatt(preis: u32) -> u32 {
      if preis >= 100 { 10 } else { 0 }
  }

  #[cfg(test)]
  mod tests {
      use super::*;
      #[test]
      fn rabatt_beginnt_bei_hundert() {
          assert_eq!(rabatt(99), 0);
          assert_eq!(rabatt(100), 10);
      }
  }

  fn main() {
      println!("{}", rabatt(100));
  }
  ```

  Die Werte 99 und 100 sind gewählt, weil dort die Regel wechselt. Zehn beliebige Werte weit oberhalb der Grenze wären weniger aussagekräftig. Ein Testname erklärt die Fachregel, nicht nur „test_1“. `assert_eq!` zeigt bei einem Fehler beide verglichenen Werte; `assert!` eignet sich für eine Bedingung. Für Vergleiche eigener Typen sind `Debug` und meist `PartialEq` hilfreich.

  Eine Erwartung darf nicht denselben fehleranfälligen Algorithmus nachbauen. Wenn die Implementierung einen Rabatt falsch berechnet und der Test dieselbe Formel kopiert, bestätigen sich beide gegenseitig. Nimm unabhängige, von der Anforderung hergeleitete Beispiele. Bei einer komplexen Formel kann eine kleine, klar lesbare Referenzimplementierung für begrenzte Eingaben sinnvoll sein.

  ## Randfälle und Fehlerarten gezielt abdecken

  Teile den Eingaberaum in sinnvolle Klassen: leer, gültig, Grenze, ungültige Syntax, unzulässiger Wertebereich. Bei Text kommen Unicode und Zeilenenden hinzu; bei Collections oft null, ein und mehrere Elemente. Nicht jede Kombination verdient einen eigenen Test, aber jede unterschiedliche Entscheidung sollte belegbar sein.

  ```rust
  #[derive(Debug, PartialEq)]
  enum Fehler { Leer, Zahl }

  fn lesen(text: &str) -> Result<u32, Fehler> {
      if text.trim().is_empty() { return Err(Fehler::Leer); }
      text.trim().parse().map_err(|_| Fehler::Zahl)
  }

  #[test]
  fn unterscheidet_fehler() {
      assert_eq!(lesen("  "), Err(Fehler::Leer));
      assert_eq!(lesen("abc"), Err(Fehler::Zahl));
      assert_eq!(lesen(" 7 "), Ok(7));
  }

  fn main() { println!("{:?}", lesen("7")); }
  ```

  Ein bloßes `is_err()` würde hier nicht prüfen, ob Leerraum die fachlich richtige Variante erhält. Es ist ausreichend, wenn alle Fehler dieselbe Bedeutung haben; andernfalls teste die konkrete Variante. `#[should_panic]` ist für APIs gedacht, deren Vertrag einen Panic erwartet. Es ist kein Ersatz für die Fehlerprüfung einer `Result`-Funktion. Mit `expected` lässt sich die erwartete Panic-Meldung eingrenzen, damit nicht irgendein anderer Panic den Test zufällig grün macht.

  > [!PRAXIS]
  > Für einen gemeldeten Bug schreibst du zuerst den kleinsten Test, der den beobachteten Fehler zeigt. Prüfe, dass er vor der Reparatur scheitert. Erst danach zeigt ein grüner Lauf, dass die Reparatur den konkreten Fehler erfasst.

  ## Unit-, Integrations- und Dokumentationstests

  Unit-Tests liegen häufig als `#[cfg(test)] mod tests` beim Code. Über `use super::*` können sie auch private Implementierungsteile erreichen. Das ist nützlich für kleine Parserregeln, aber kein Auftrag, jede private Hilfsfunktion direkt zu testen.

  Integrationstests unter `tests/` werden als externe Nutzer deiner Library gebaut. Sie erreichen deren öffentliche API. Deshalb lohnt sich bei einem CLI die Trennung: Fachlogik in `src/lib.rs`, Argumente und Prozessstatus in `src/main.rs`. Das [Kapitel zur Testorganisation](https://doc.rust-lang.org/book/ch11-03-test-organization.html) erklärt die unterschiedlichen Sichtbarkeiten.

  ```text
  src/
    lib.rs          # Parser und fachliche Operationen
    main.rs         # CLI-Grenze
   tests/
    cli.rs          # Aufruf und sichtbares Verhalten des Programms
  ```

  Ein CLI-Integrationstest prüft Exit-Status, Standardausgabe und Fehlerausgabe. Ein erfolgreiches Ergebnis auf stdout kann falsch sein, wenn der Prozess trotzdem mit Fehler endet. Umgekehrt kann eine Fehlermeldung korrekt sein, aber ein Erfolgsstatus die automatisierte Nutzung täuschen.

  Dokumentationstests prüfen Rust-Beispiele in `///`-Kommentaren. Sie sichern, dass ein öffentlich erklärter Aufruf noch übersetzt und funktioniert. Das [rustdoc-Testkapitel](https://doc.rust-lang.org/rustdoc/write-documentation/documentation-tests.html) beschreibt auch `compile_fail` für absichtlich unzulässige Beispiele. Verwechsle das nicht mit `ignore`: Ignorieren nimmt dir die Prüfung weg.

  ```rust
  /// Liefert die doppelte Anzahl.
  ///
  /// Liefert None, wenn die Verdopplung nicht in u32 passt.
  pub fn doppelt(n: u32) -> Option<u32> {
      n.checked_mul(2)
  }

  fn main() {
      assert_eq!(doppelt(3), Some(6));
      assert_eq!(doppelt(u32::MAX), None);
  }
  ```

  Für deine echte Library ergänzst du im Doc-Kommentar ein Beispiel mit ihrem Crate-Namen. Das Beispiel sollte außerdem den Rückgabevertrag korrekt erklären: Hier liefert ein Überlauf `None`, er ist kein vom Aufrufer unerlaubt herbeigeführter Zustand.

  ## Determinismus entsteht durch passende Grenzen

  Tests sollten nicht auf eine echte Uhr, einen zufälligen freien Port oder ein produktives Netzwerk angewiesen sein, wenn sie nur Fachlogik prüfen. Reiche Abhängigkeiten hinein: einen Reader, einen Writer, eine Uhrfunktion oder einen kleinen Trait. So bleibt der wichtige Mechanismus sichtbar, ohne eine große Mock-Infrastruktur aufzubauen.

  ```rust
  use std::io::{self, BufRead};

  fn nichtleere_zeilen(reader: impl BufRead) -> io::Result<usize> {
      let mut anzahl = 0;
      for line in reader.lines() {
          if !line?.trim().is_empty() { anzahl += 1; }
      }
      Ok(anzahl)
  }

  #[test]
  fn ignoriert_leerzeilen() {
      let daten = std::io::Cursor::new("eins\n\nzwei\n");
      assert_eq!(nichtleere_zeilen(daten).unwrap(), 2);
  }

  fn main() {}
  ```

  `Cursor` erfüllt die I/O-Schnittstelle, arbeitet aber vollständig mit lokalen Bytes. Ein zusätzlicher Integrationstest mit einer echten temporären Datei prüft die Dateigrenze. Diese beiden Ebenen ergänzen sich. Ein reiner Speichertest beweist nicht, dass Argumente und Pfade korrekt verdrahtet sind.

  Tests können parallel laufen. Vermeide gemeinsame feste Dateinamen, globale veränderbare Zustände und Abhängigkeiten von Testreihenfolgen. `--test-threads=1` ist als Diagnose nützlich, behebt aber keine unsaubere Isolation. Tokios [Testdokumentation](https://tokio.rs/tokio/topics/testing) beschreibt für Timer außerdem kontrollierbare Zeit; pauschales langes Schlafen macht Tests langsam und trotzdem unzuverlässig.

  ## Werkzeugprüfungen haben verschiedene Aufgaben

  `cargo fmt` vereinheitlicht Formatierung. `cargo clippy` untersucht zusätzliche Fehler- und Qualitätsmuster. `cargo test` prüft die von dir formulierten Verträge. Ein Release-Build prüft noch eine andere Konfiguration. Keine einzelne dieser Stufen beweist, dass die Anwendung vollständig richtig ist.

  ```bash
  cargo fmt --all -- --check
  cargo clippy --all-targets -- -D warnings
  cargo test --locked
  cargo build --release --locked
  ```

  Die [Clippy-Anleitung](https://doc.rust-lang.org/clippy/usage.html) erklärt das Weiterreichen von Optionen nach `--`. `-D warnings` macht Warnungen in diesem Lauf zu Fehlern. Das ist eine Teamentscheidung und sollte für die festgelegte Toolchain reproduzierbar sein. Schalte nicht ohne Anlass sämtliche Pedantic-Lints ein, wenn daraus nur Ausnahmeattribute ohne Verständnis entstehen.

  [`cargo test --locked`](https://doc.rust-lang.org/cargo/commands/cargo-test.html) verhindert eine unerwartete Änderung der Auflösung im Lockfile. Für ein ausführbares Anwendungsprojekt gehört das Lockfile deshalb in den nachvollziehbaren Stand. Eine festgelegte Toolchain und dokumentierte Feature-Kombinationen machen lokale und CI-Ergebnisse vergleichbarer. `--all-features` ist nur passend, wenn die Features zusammen unterstützt werden; manche Projekte haben sich ausschließende Optionen.

  ## Von grünem Test zu belastbarer Aussage

  Ein grüner Lauf sagt: Diese Tests haben mit dieser Konfiguration bestanden. Er sagt nicht: alle Fehlerfälle sind geprüft, alle Plattformen funktionieren oder die reale Nutzbarkeit ist abgenommen. Schreibe in einen PR, welche Verhaltenspfade du geprüft hast und welche Grenzen offen bleiben. Bei einer CLI gehören mindestens normaler Aufruf, Hilfe, ungültige Argumente, fehlende Datei und kaputte Eingabedaten dazu.

  Bei Performanceproblemen brauchst du Messungen unter vergleichbaren Bedingungen. Ein Unit-Test mit einer knappen Zeitgrenze ist kein verlässlicher Benchmark auf beliebiger CI-Hardware. Verwende Release-Builds, repräsentative Datensätze und wiederholte Messungen. Eine vermeintliche Optimierung lohnt sich erst, wenn sie ein gemessenes Problem verbessert und den Vertrag erhält.

  > [!INTERVIEW]
  > Erkläre einen Testfall über das Risiko: „Dieser Grenzwert deckt den Wechsel von kostenlos zu kostenpflichtig ab.“ Das ist aussagekräftiger als die Anzahl der Tests oder eine hohe Coverage-Zahl ohne Erklärung.

  ## Häufige Fehler und Zusammenfassung

  - Tests prüfen beobachtbare Regeln statt die aktuelle Codeform.
  - Grenzwerte und Fehlerarten liefern mehr als viele ähnliche Normalfälle.
  - Integrationstests prüfen die öffentliche Grenze; Unit-Tests isolieren Logik.
  - Gemeinsame Dateien und echte Wartezeiten erzeugen unnötige Instabilität.
  - Formatierung, Lints, Tests und Release-Build haben unterschiedliche Aussagen.
  - Eine nachweislich rote Regression vor der Reparatur erhöht die Aussagekraft.
  - Dokumentiere überprüfte Pfade und verbleibende Grenzen ehrlich.
exercises:
- id: grenzwert
  type: choice
  title: Welcher Test findet den Grenzfehler?
  prompt: Rabatt gilt ab Preis 100. Eine fehlerhafte Implementierung verwendet > 100. Welcher Fall unterscheidet
    sie von der richtigen?
  options:
  - text: Preis 100 erwartet Rabatt.
    correct: true
    why: Genau hier unterscheiden sich > und >=.
  - text: Preis 500 erwartet Rabatt.
    correct: false
    why: Beide Implementierungen erfüllen diesen Fall.
  - text: Preis 0 erwartet keinen Rabatt.
    correct: false
    why: Auch hier stimmen beide überein.
  explanation: Ein aussagekräftiger Test unterscheidet korrekte und plausible falsche Implementierungen. Der Grenzwert
    erfüllt genau diese Aufgabe.
  resources:
  - *id001
- id: regression-ablauf
  type: order
  title: Einen Bug belegbar reparieren
  prompt: Ordne den Arbeitsablauf.
  lang: text
  lines: |-
    Fehler reproduzieren und erwartetes Verhalten bestimmen
    Kleinen Regressionstest schreiben
    Scheitern des Tests am ursprünglichen Code prüfen
    Ursache gezielt reparieren
    Regression und relevante bestehende Tests ausführen
  explanation: Der zunächst rote Test zeigt, dass die Prüfung den Bug erkennt. Nach der gezielten Reparatur sichern
    die übrigen Tests bestehende Verträge.
  resources:
  - *id001
- id: assert-ausgabe
  type: output
  title: Assertions und Ausgabe
  prompt: Was gibt dieses Programm aus? Gib jede Ausgabezeile an.
  lang: rust
  code: |-
    fn main() {
        assert_eq!(2 + 2, 4);
        println!("grün");
        assert!(true);
    }
  expected: grün
  explanation: Erfolgreiche Assertions schreiben hier nichts. Sie würden bei verletzter Bedingung paniken.
  resources:
  - *id001
- id: randfall-checked
  type: output
  title: Überlauf als Wert
  prompt: Was gibt dieses Programm aus? Gib jede Ausgabezeile an.
  lang: rust
  code: |-
    fn main() {
        println!("{:?}", 3_u8.checked_mul(2));
        println!("{:?}", 200_u8.checked_mul(2));
    }
  expected: |-
    Some(6)
    None
  explanation: checked_mul beschreibt Überlauf explizit als None. Das Verhalten hängt dadurch nicht von einer zufälligen
    Debug- oder Release-Annahme ab.
  resources:
  - *id001
- id: test-markieren
  type: gap
  title: Eine Regression registrieren
  prompt: Ergänze das Testattribut und die Assertion mit erwarteter Länge 0.
  lang: rust
  code: |-
    fn anzahl(text: &str) -> usize { text.split_whitespace().count() }
    #[⟦test⟧]
    fn leerer_text() {
        ⟦assert_eq!(anzahl(""), 0)⟧;
    }
  gaps:
  - label: Lücke 1
    hint: 'Der Testrunner erkennt #[test].'
  - label: Lücke 2
    hint: Nutze assert_eq! für Ergebnis und Erwartung.
  explanation: Das Attribut registriert den Test. Die konkrete Erwartung prüft den leeren Randfall statt nur, dass
    die Funktion aufrufbar ist.
  resources:
  - *id001
- id: fehlervariante
  type: gap
  title: Nicht irgendein Fehler
  prompt: Ergänze die konkrete erwartete Fehler-Variante.
  lang: rust
  code: |-
    #[derive(Debug, PartialEq)]
    enum Fehler { Leer }
    fn lesen(s: &str) -> Result<&str, Fehler> {
        if s.is_empty() { Err(Fehler::Leer) } else { Ok(s) }
    }
    #[test]
    fn leer() { assert_eq!(lesen(""), ⟦Err(Fehler::Leer)⟧); }
  gaps:
  - label: Lücke 1
    hint: Das Ergebnis muss die Variante Leer in Err enthalten.
  explanation: Die Assertion beschreibt den Rückgabevertrag einschließlich Fehlerart. is_err alleine wäre weniger
    genau.
  resources:
  - *id001
- id: cargo-format
  type: command
  title: Formatierung nur prüfen
  prompt: Schreibe den Cargo-Befehl, der alle Workspace-Pakete formatiert prüfen soll, ohne Dateien zu verändern.
  answers:
  - cargo fmt --all -- --check
  explanation: '`--check` wird nach dem Trenner an rustfmt weitergegeben. `--all` erweitert die Prüfung auf den
    Workspace.'
  resources:
  - *id001
- id: falsche-erwartung
  type: bug
  title: Der Test erlaubt den Bug
  prompt: Die Fachregel verlangt mindestens drei Zeichen. Der folgende Test akzeptiert zwei. Korrigiere die fehlerhafte
    Assertion.
  lang: rust
  code: |-
    fn gueltig(text: &str) -> bool { text.chars().count() >= 3 }
    #[test]
    fn mindestlaenge() {
        assert!(gueltig("ab"));
        assert!(gueltig("abc"));
    }
  lines:
  - 4
  fix:
  - line: 4
    answers:
    - assert!(!gueltig("ab"));
    - assert_eq!(gueltig("ab"), false);
  explanation: Zwei Zeichen liegen unter der Grenze und müssen abgelehnt werden. Der zweite Test hält den ersten
    gültigen Wert fest.
  resources:
  - *id001
- id: reader-test
  type: explain
  title: Warum Cursor statt Festplatte?
  prompt: Erkläre, welche Aussagen dieser Test ermöglicht und welche Grenze noch ungetestet ist.
  lang: rust
  code: |-
    fn auswerten(reader: impl std::io::BufRead) -> std::io::Result<usize> {
        reader.lines().try_fold(0, |n, line| line.map(|_| n + 1))
    }
    #[test]
    fn zwei_zeilen() {
        assert_eq!(auswerten(std::io::Cursor::new("a
    b
    ")).unwrap(), 2);
    }
  points:
  - Die Verarbeitung hängt an einer kleinen Reader-Schnittstelle.
  - Cursor liefert deterministische Daten ohne gemeinsame Datei.
  - Der Test prüft die Zeilenverarbeitung.
  - Öffnen von Pfaden und CLI-Argumente benötigen zusätzliche Integrationstests.
  explanation: Die I/O-Abstraktion trennt Verarbeitung vom Ursprung der Bytes. Der Test bleibt schnell und isoliert.
    Er ersetzt keinen Test der äußeren Dateigrenze.
  resources:
  - *id001
- id: grenzen-testen
  type: practice
  title: Eine Validierung gegen Gegenbeispiele absichern
  prompt: 'Schreibe `name_gueltig`: Nach trim müssen 3 bis 12 Unicode-Skalarwerte vorhanden sein. Schreibe Tests
    für darunter, beide Grenzen, darüber, Leerraum und Umlaute.'
  lang: rust
  solution: |-
    fn name_gueltig(text: &str) -> bool {
        (3..=12).contains(&text.trim().chars().count())
    }
    #[test]
    fn grenzen() {
        assert!(!name_gueltig("ab"));
        assert!(name_gueltig("abc"));
        assert!(name_gueltig("abcdefghijkl"));
        assert!(!name_gueltig("abcdefghijklm"));
    }
    #[test]
    fn leerraum_und_unicode() {
        assert!(name_gueltig("  äöü  "));
        assert!(!name_gueltig("   "));
    }
    fn main() {}
  checklist:
  - Beide zulässigen Grenzen werden separat geprüft.
  - Zu kurzer und zu langer Text werden abgelehnt.
  - Leerraum wird vor der Längenprüfung entfernt.
  - Die Prüfung zählt chars und keine UTF-8-Bytes.
  - Du erklärst die Abgrenzung zwischen Unicode-Skalarwerten und sichtbaren Graphemen.
  explanation: Der Vertrag nennt bewusst Unicode-Skalarwerte. `chars().count()` erfüllt ihn; `len()` würde Bytes
    zählen. Die Tests unterscheiden Off-by-one, vergessenen trim und Bytezählung.
  resources:
  - *id001
