lesson: |
  Ein Parser kompiliert, Clippy meldet nichts, und der Beispieldatensatz wird richtig verarbeitet. Trotzdem kann ein leerer Datensatz paniken oder eine Zahl am Rand des zulässigen Bereichs falsch behandelt werden. Der Compiler prüft viele strukturelle Eigenschaften, aber er kennt den fachlichen Vertrag nicht, den du deinem Nutzer versprochen hast.

  Tests beschreiben diesen Vertrag an überprüfbaren Fällen. Gute Tests halten beobachtbares Verhalten fest und geben dir die Freiheit, die Implementierung zu ändern. Schlechte Tests bilden jede interne Schleife nach und werden bei jeder sinnvollen Änderung zur Last. Dieses Modul geht von Rusts eingebauten Tests über CLI-Integrationstests bis zu Property- und Snapshot-Tests.

  ## Ein Test braucht eine überprüfbare Behauptung

  `#[test]` markiert eine Testfunktion, `cargo test` baut einen Testrunner und führt sie aus, eine fehlschlagende Assertion lässt den Test scheitern. Das [Testkapitel](https://doc.rust-lang.org/book/ch11-01-writing-tests.html) beschreibt Einrichtung, Aktion und Erwartung als Grundschritte.

  ```rust
  fn rabatt(preis: u32) -> u32 {
      if preis >= 100 { 10 } else { 0 }
  }

  #[cfg(test)]
  mod tests {
      use super::*;
      #[test]
      fn rabatt_beginnt_bei_hundert() {
          assert_eq!(rabatt(99), 0);
          assert_eq!(rabatt(100), 10);
      }
  }

  fn main() {
      println!("{}", rabatt(100));
  }
  ```

  Die Werte 99 und 100 stehen da, weil dort die Regel wechselt; zehn Werte weit oberhalb der Grenze sagen weniger. Der Testname erklärt die Fachregel. `assert_eq!` zeigt bei einem Fehler beide Werte, `assert!` prüft eine Bedingung. Eine Erwartung darf nicht denselben fehleranfälligen Algorithmus nachbauen: Kopiert der Test die Formel der Implementierung, bestätigen sich beide gegenseitig. Nimm Beispiele, die du aus der Anforderung herleitest.

  ## Randfälle und Fehlerarten gezielt abdecken

  Teile den Eingaberaum in Klassen: leer, gültig, Grenze, ungültige Syntax, unzulässiger Wertebereich. Bei Text kommen Unicode und Zeilenenden dazu, bei Collections null, ein und viele Elemente. Nicht jede Kombination braucht einen Test, aber jede unterschiedliche Entscheidung sollte belegt sein.

  ```rust
  #[derive(Debug, PartialEq)]
  enum Fehler { Leer, Zahl }

  fn lesen(text: &str) -> Result<u32, Fehler> {
      if text.trim().is_empty() { return Err(Fehler::Leer); }
      text.trim().parse().map_err(|_| Fehler::Zahl)
  }

  #[test]
  fn unterscheidet_fehler() {
      assert_eq!(lesen("  "), Err(Fehler::Leer));
      assert_eq!(lesen("abc"), Err(Fehler::Zahl));
      assert_eq!(lesen(" 7 "), Ok(7));
  }

  fn main() { println!("{:?}", lesen("7")); }
  ```

  Ein bloßes `is_err()` würde nicht prüfen, ob Leerraum die richtige Variante bekommt. `#[should_panic]` ist für APIs gedacht, deren Vertrag einen Panic verlangt, und kein Ersatz für die Fehlerprüfung einer `Result`-Funktion; mit `expected` grenzt du die Meldung ein, damit nicht irgendein anderer Panic den Test grün macht.

  > [!PRAXIS]
  > Für einen gemeldeten Bug schreibst du zuerst den kleinsten Test, der den Fehler zeigt, und prüfst, dass er vor der Reparatur scheitert. Erst dann beweist ein grüner Lauf, dass die Reparatur genau diesen Fehler erfasst.

  ## Unit-, Integrations- und Dokumentationstests

  Unit-Tests liegen als `#[cfg(test)] mod tests` beim Code und erreichen über `use super::*` auch private Teile. Integrationstests unter `tests/` baut Cargo als externe Nutzer deiner Library; sie sehen nur die öffentliche API. Bei einem CLI lohnt deshalb die Trennung: Fachlogik in `src/lib.rs`, Argumente und Prozessstatus in `src/main.rs` ([Testorganisation](https://doc.rust-lang.org/book/ch11-03-test-organization.html)).

  ```text
  src/
    lib.rs          # Parser und fachliche Operationen
    main.rs         # CLI-Grenze
  tests/
    cli.rs          # Aufruf und sichtbares Verhalten des Binarys
    props.rs        # Property-Tests gegen die Library
    snapshots/      # von insta verwaltete .snap-Dateien
  ```

  Dokumentationstests prüfen Rust-Beispiele in `///`-Kommentaren und sichern, dass ein öffentlich erklärter Aufruf noch funktioniert. `compile_fail` markiert absichtlich unzulässige Beispiele; `ignore` nimmt dir die Prüfung weg ([rustdoc](https://doc.rust-lang.org/rustdoc/write-documentation/documentation-tests.html)).

  ```rust
  /// Liefert die doppelte Anzahl oder `None`,
  /// wenn das Ergebnis nicht in `u32` passt.
  ///
  /// ```
  /// assert_eq!(logwerk::doppelt(3), Some(6));
  /// assert_eq!(logwerk::doppelt(u32::MAX), None);
  /// ```
  pub fn doppelt(n: u32) -> Option<u32> {
      n.checked_mul(2)
  }

  fn main() {
      assert_eq!(doppelt(3), Some(6));
  }
  ```

  Das Beispiel zwischen den Zäunen im Doc-Kommentar ist der Doc-Test. `cargo test` übersetzt es als eigenes kleines Programm, das deine Library wie ein fremdes Crate benutzt – deshalb der volle Pfad `logwerk::doppelt`, und deshalb funktionieren Doc-Tests nur für Library-Crates, nicht für `src/main.rs`. Das Beispiel dokumentiert den Rückgabevertrag mit: Ein Überlauf ist hier ein erwarteter Fall und liefert `None`.

  ## Determinismus: Grenzen, Uhren und temporäre Dateien

  Tests sollten nicht von einer echten Uhr, einem zufälligen Port oder einem produktiven Netz abhängen, wenn sie nur Fachlogik prüfen. Reiche Abhängigkeiten hinein: einen Reader, einen Writer, eine Uhrfunktion.

  ```rust
  use std::io::{self, BufRead};

  fn nichtleere_zeilen(reader: impl BufRead) -> io::Result<usize> {
      let mut anzahl = 0;
      for line in reader.lines() {
          if !line?.trim().is_empty() { anzahl += 1; }
      }
      Ok(anzahl)
  }

  #[test]
  fn ignoriert_leerzeilen() {
      let daten = std::io::Cursor::new("eins\n\nzwei\n");
      assert_eq!(nichtleere_zeilen(daten).unwrap(), 2);
  }

  fn main() {}
  ```

  `Cursor` erfüllt die I/O-Schnittstelle mit Bytes im Speicher. Ob Pfade und Argumente richtig verdrahtet sind, beweist das nicht; dafür braucht es echte Dateien. Und hier beginnt das Problem: `cargo test` lässt Tests parallel in Threads laufen. Zwei Tests, die dieselbe feste Datei `/tmp/logwerk-test.log` schreiben und dann `logwerk` darauf starten, waren bei 50 von 50 Läufen rot, mit `--test-threads=1` bei 0 von 50. Die Option ist eine Diagnose, keine Reparatur.

  Die Reparatur ist ein eigenes Verzeichnis pro Test. [`tempfile::tempdir()`](https://docs.rs/tempfile/latest/tempfile/fn.tempdir.html) legt eins mit zufälligem Namen an, und der Drop des `TempDir` löscht es samt Inhalt; [`NamedTempFile`](https://docs.rs/tempfile/latest/tempfile/struct.NamedTempFile.html) macht dasselbe für eine einzelne Datei. Zwei Fallen: Lässt du das `TempDir` zu früh fallen, etwa weil eine Hilfsfunktion nur den Pfad zurückgibt, ist das Verzeichnis weg, bevor das Programm läuft ([Early drop pitfall](https://docs.rs/tempfile/latest/tempfile/#early-drop-pitfall)). Und bei SIGINT oder einem `process::exit` läuft kein Destruktor, das Verzeichnis bleibt liegen. Zur Fehlersuche hältst du es mit [`TempDir::keep()`](https://docs.rs/tempfile/latest/tempfile/struct.TempDir.html#method.keep) absichtlich fest; der alte Name `into_path` ist veraltet. Für Timer gilt dasselbe Prinzip: Tokio hält die Uhr in Tests an ([Async Rust](/rust/async-rust)), statt dass Tests echt warten.

  ## CLI-Integrationstests: das Binary von außen prüfen

  Ein CLI hat drei Ausgänge, und jeder gehört zum Vertrag: Exit-Status, stdout, stderr. Ein richtiger Bericht auf stdout mit Status 1 ist genauso falsch wie eine gute Fehlermeldung mit Status 0. Für Integrationstests setzt Cargo `CARGO_BIN_EXE_<name>` auf den absoluten Pfad des gebauten Binarys und baut es vor dem Test ([Cargo: Umgebungsvariablen](https://doc.rust-lang.org/cargo/reference/environment-variables.html#environment-variables-cargo-sets-for-crates)). Mit `env!` und `std::process::Command` reicht die Standardbibliothek:

  ```rust
  use std::io::Write;
  use std::process::{Command, Output, Stdio};

  fn logwerk(args: &[&str], eingabe: &str) -> Output {
      let mut kind = Command::new(env!("CARGO_BIN_EXE_logwerk"))
          .args(args)
          .stdin(Stdio::piped())
          .stdout(Stdio::piped())
          .stderr(Stdio::piped())
          .spawn()
          .expect("logwerk startet");
      kind.stdin.take().unwrap().write_all(eingabe.as_bytes()).unwrap();
      kind.wait_with_output().expect("logwerk endet")
  }

  #[test]
  fn zaehlt_stufen_von_stdin() {
      let aus = logwerk(&["zaehlen", "-"], "INFO start\nERROR db\nINFO ende\n");
      assert!(aus.status.success());
      assert_eq!(String::from_utf8_lossy(&aus.stdout), "INFO 2\nERROR 1\n");
      assert!(aus.stderr.is_empty());
  }

  #[test]
  fn meldet_kaputte_zeile_mit_nummer() {
      let aus = logwerk(&["zaehlen", "-"], "INFO start\n\nDEBUG x\n");
      assert_eq!(aus.status.code(), Some(1));
      assert!(aus.stdout.is_empty());
      let fehler = String::from_utf8_lossy(&aus.stderr);
      assert!(fehler.contains("Zeile 3"), "stderr war: {fehler}");
  }
  ```

  `env!` liest die Variable beim Kompilieren: Ein Tippfehler im Namen ist ein Compilerfehler, kein roter Test. `take()` holt die stdin-Pipe aus dem `Child`. Am Ende der Anweisung wird sie gedroppt, die Pipe schließt, und `logwerk` sieht das Dateiende.

  [assert_cmd](https://docs.rs/assert_cmd/latest/assert_cmd/) 2.2 kürzt das ab und liefert lesbare Fehlermeldungen; [predicates](https://docs.rs/predicates/latest/predicates/str/index.html) beschreibt Erwartungen an Text. Das Makro [`cargo_bin_cmd!`](https://docs.rs/assert_cmd/latest/assert_cmd/cargo/macro.cargo_bin_cmd.html) baut auf demselben `env!` auf; `Command::cargo_bin("logwerk")` sucht den Pfad erst zur Laufzeit und liefert ein `Result`. Veraltet ist in 2.2 nur `crate_name!` (ersetzt durch `pkg_name!`). Die Abhängigkeiten gehören in `[dev-dependencies]`:

  ```toml
  [dev-dependencies]
  assert_cmd = "2.2"
  predicates = "3.1"
  tempfile = "3.27"
  proptest = "1.12"
  insta = { version = "1.49", features = ["filters"] }
  ```

  ```rust
  use std::fs;

  use assert_cmd::cargo::cargo_bin_cmd;
  use predicates::prelude::*;

  #[test]
  fn zaehlt_datei() {
      let dir = tempfile::tempdir().unwrap();
      let log = dir.path().join("app.log");
      fs::write(&log, "INFO start\nWARN platte\nINFO ende\n").unwrap();

      cargo_bin_cmd!("logwerk")
          .args(["zaehlen", log.to_str().unwrap()])
          .assert()
          .success()
          .stdout("INFO 2\nWARN 1\n")
          .stderr(predicate::str::is_empty());
  }

  #[test]
  fn fehlende_datei_ist_fehler() {
      let dir = tempfile::tempdir().unwrap();
      cargo_bin_cmd!("logwerk")
          .args(["zaehlen", "fehlt.log"])
          .current_dir(dir.path())
          .assert()
          .code(1)
          .stdout(predicate::str::is_empty())
          .stderr(predicate::str::contains("fehlt.log").and(predicate::str::contains("os error 2")));
  }
  ```

  `dir` lebt bis zum Ende der Testfunktion, das Verzeichnis also auch. `current_dir` lässt das Programm im leeren Temp-Verzeichnis laufen, damit kein zufällig vorhandenes `fehlt.log` im Projekt den Test verfälscht.

  Endet `logwerk` bei einer kaputten Zeile versehentlich mit 0, meldet ein Test mit `.code(1)` (Pfad zum Binary gekürzt):

  ```text
  Unexpected return code, failed var == 1
  └── var: 0

  command=`"…/target/debug/logwerk" "zaehlen" "/tmp/.tmpy8M7jo/app.log"`
  code=0
  stdout=""
  stderr="logwerk: Zeile 2: unbekannte Stufe `DEBUG`\n"
  ```

  Die Meldung nennt die verletzte Erwartung, den vollständigen Aufruf und alle drei Ausgänge. Das reicht meist, um den Fehler ohne Debugger zu sehen.

  ## Property-Tests: Eigenschaften statt Beispiele

  Ein Beispieltest prüft die Fälle, an die du gedacht hast. Ein Property-Test beschreibt eine Eigenschaft, die für alle gültigen Eingaben gilt, und [proptest](https://docs.rs/proptest/latest/proptest/) erzeugt standardmäßig 256 zufällige Eingaben dafür ([Config::cases](https://docs.rs/proptest/latest/proptest/test_runner/struct.Config.html#structfield.cases)). Drei Arten von Eigenschaften tragen weit: ein Roundtrip (`parse(format(x)) == x`), eine Invariante (die Summe aller Zähler ist die Zahl der Zeilen) und der Vergleich mit einer einfachen Referenz (eigene Sortierung gegen `sort`). Ein erster Versuch für `logwerk`:

  ```rust
  proptest! {
      #[test]
      fn format_und_parse_passen_zusammen(stufe in stufe(), meldung in "[a-zA-Z0-9 ]{1,30}") {
          let zeile = format_zeile(stufe, &meldung);
          prop_assert_eq!(parse_zeile(&zeile), Ok(Some((stufe, meldung))));
      }
  }
  ```

  Ein String-Literal ist in proptest eine Strategie: Es erzeugt Texte, die auf den regulären Ausdruck passen ([string_regex](https://docs.rs/proptest/latest/proptest/string/fn.string_regex.html)). `cargo test` meldete (gekürzt):

  ```text
  proptest: Saving this and future failures in …/testen/tests/props_roundtrip.proptest-regressions
  Test failed: assertion failed: `(left == right)`
    left: `Err(MeldungFehlt)`,
   right: `Ok(Some((Info, " ")))` at testen/tests/props_roundtrip.rs:12.
  minimal failing input: stufe = Info, meldung = " "
  	successes: 1
  ```

  Das ist Shrinking: Proptest fand eine scheiternde Eingabe und verkleinerte sie, solange der Test weiter scheiterte – bis zu einer Meldung, die nur aus einem Leerzeichen besteht ([Shrinking](https://proptest-rs.github.io/proptest/proptest/tutorial/shrinking-basics.html)). Der Fund ist echt: `parse_zeile` trimmt, also überlebt eine Meldung mit Leerzeichen am Rand den Roundtrip nicht. Hier ist die Eigenschaft richtig und die Strategie zu weit; gültige Meldungen beginnen und enden mit einem Zeichen, das kein Leerzeichen ist. Die korrigierte Fassung samt Invariante:

  ```rust
  use logwerk::{format_zeile, parse_zeile, zaehlen, Stufe};
  use proptest::prelude::*;

  fn stufe() -> impl Strategy<Value = Stufe> {
      prop_oneof![Just(Stufe::Info), Just(Stufe::Warn), Just(Stufe::Error)]
  }

  proptest! {
      // Roundtrip: Was format_zeile schreibt, liest parse_zeile unverändert zurück.
      #[test]
      fn format_und_parse_passen_zusammen(
          stufe in stufe(),
          meldung in "[a-zA-Z0-9äöü]([a-zA-Z0-9äöü ]{0,28}[a-zA-Z0-9äöü])?",
      ) {
          let zeile = format_zeile(stufe, &meldung);
          prop_assert_eq!(parse_zeile(&zeile), Ok(Some((stufe, meldung))));
      }

      // Invariante: Jede gültige Zeile wird genau einmal gezählt.
      #[test]
      fn summe_ist_zeilenzahl(zeilen in prop::collection::vec((stufe(), "[a-z]{1,8}"), 0..50)) {
          let text: String = zeilen.iter().map(|(s, m)| format_zeile(*s, m) + "\n").collect();
          let summe: usize = zaehlen(&text).unwrap().values().sum();
          prop_assert_eq!(summe, zeilen.len());
      }
  }
  ```

  Weitere Strategien: `any::<u32>()` für den ganzen Wertebereich, `0u32..10` für einen Bereich, `prop::collection::vec` für Listen. Wähle den Bereich so, dass interessante Fälle oft vorkommen: Unter 50 zufälligen `u32` ist ein Duplikat fast ausgeschlossen, unter 50 Werten aus `0..10` die Regel. Den Seed jedes Fehlschlags speichert proptest in einer `proptest-regressions`-Datei (bei Integrationstests neben der Testdatei) und spielt ihn bei jedem Lauf zuerst ab. Committe sie, damit CI und Kollegen denselben Fall prüfen ([Failure Persistence](https://proptest-rs.github.io/proptest/proptest/failure-persistence.html)).

  ## Snapshot-Tests mit insta

  Manche Ausgaben sind groß und stabil: ein Bericht, ein Hilfetext, eine generierte Konfiguration. Sie Zeile für Zeile in `assert_eq!` abzutippen ist mühsam. [insta](https://docs.rs/insta/latest/insta/) speichert die Ausgabe beim ersten Lauf als `.snap`-Datei und vergleicht spätere Läufe damit; `assert_snapshot!` nimmt Text, `assert_debug_snapshot!` die `Debug`-Ausgabe eines Werts.

  ```rust
  use std::fs;

  use insta::assert_snapshot;

  #[test]
  fn bericht_fuer_beispieldatei() {
      let dir = tempfile::tempdir().unwrap();
      let pfad = dir.path().join("app.log");
      fs::write(&pfad, "INFO start\nWARN platte\nERROR db\nINFO ende\n").unwrap();
      let text = fs::read_to_string(&pfad).unwrap();
      let bericht = logwerk::bericht(&pfad.display().to_string(), &text).unwrap();

      // Der Pfad ist bei jedem Lauf anders: ersetzen, bevor insta vergleicht.
      let temp = dir.path().display().to_string();
      insta::with_settings!({filters => vec![(temp.as_str(), "[TEMP]")]}, {
          assert_snapshot!(bericht);
      });
  }
  ```

  Der erste Lauf scheitert absichtlich und legt `tests/snapshots/snapshots__bericht_fuer_beispieldatei.snap.new` an. Du prüfst den Inhalt und nimmst ihn mit `cargo insta review` an (Werkzeug `cargo-insta`) oder ohne Werkzeug mit `INSTA_UPDATE=always cargo test` ([Updating snapshots](https://docs.rs/insta/latest/insta/#updating-snapshots)). Die angenommene Datei gehört ins Repository:

  ```text
  ---
  source: tests/snapshots.rs
  expression: bericht
  ---
  Bericht für [TEMP]/app.log
    INFO      2
    WARN      1
    ERROR     1
  Zeilen gesamt: 4
  ```

  Ohne den Filter stünde dort `/tmp/.tmpXXXXXX/app.log`, und jeder Lauf wäre rot. Filter ersetzen per regulärem Ausdruck Pfade, Zeitstempel oder IDs ([Filters](https://insta.rs/docs/filters/)); für serialisierte Werte gibt es Redactions, die einzelne Felder ersetzen ([Redactions](https://insta.rs/docs/redactions/)). Den Pfad als Ausdruck zu nehmen geht hier, weil die Punkte darin auf jedes Zeichen passen, also auch auf sich selbst. Noch besser ist oft, gar keinen zufälligen Wert auszugeben: relative Pfade und `current_dir`. Ausprobiert: Aus `Zeilen gesamt` wurde im Code `Zeilen insgesamt`, und der nächste Lauf zeigte einen Diff mit `-Zeilen gesamt: 4` und `+Zeilen insgesamt: 4`.

  Snapshots helfen bei großen, stabilen Ausgaben, bei denen eine Änderung auffallen soll. Für eine einzelne Zahl oder einen kurzen String bleibt `assert_eq!` klarer.

  > [!WARNING] Blind angenommen ist nicht getestet
  > Mit `INSTA_UPDATE=always` überschreibt insta jeden abweichenden Snapshot, und der Lauf endet grün – auch der, der gerade einen Fehler zeigt. Nutze es nur nach einer bewussten Prüfung, nie als Alias oder in CI, und lies im Review den Diff der `.snap`-Datei wie Code.

  ## Werkzeuge, CI und belastbare Aussagen

  `cargo fmt` vereinheitlicht Formatierung, `cargo clippy` sucht zusätzliche Fehler- und Qualitätsmuster, `cargo test` prüft deine Verträge, ein Release-Build eine weitere Konfiguration. Keine Stufe allein beweist, dass die Anwendung richtig ist.

  ```bash
  cargo fmt --all -- --check
  cargo clippy --all-targets -- -D warnings
  cargo test --locked
  cargo build --release --locked
  ```

  Die [Clippy-Anleitung](https://doc.rust-lang.org/clippy/usage.html) erklärt das Weiterreichen von Optionen nach `--`; `-D warnings` macht Warnungen in diesem Lauf zu Fehlern. [`cargo test --locked`](https://doc.rust-lang.org/cargo/commands/cargo-test.html) verhindert, dass sich die Auflösung im Lockfile unbemerkt ändert; bei Anwendungen gehört `Cargo.lock` ins Repository. `--all-features` passt nur, wenn alle Features zusammen funktionieren.

  Ein grüner Lauf sagt: Diese Tests haben mit dieser Konfiguration bestanden. Schreib in den PR, welche Pfade du geprüft hast und welche offen bleiben; bei einem CLI mindestens normaler Aufruf, Hilfe, ungültige Argumente, fehlende Datei und kaputte Eingabe. Performance gehört nicht in Unit-Tests mit knapper Zeitgrenze, die auf CI-Hardware zufällig scheitern. Dafür gibt es Benchmarks mit Release-Build und wiederholten Messungen ([Performance messen](/rust/performance-messen)).

  > [!INTERVIEW]
  > Erkläre einen Testfall über das Risiko: „Dieser Grenzwert deckt den Wechsel von kostenlos zu kostenpflichtig ab.“ Auf die Frage nach Property-Tests: „Ich beschreibe eine Eigenschaft wie den Roundtrip von Formatieren und Parsen, proptest sucht ein Gegenbeispiel und schrumpft es; den Seed committe ich.“ Das ist mehr wert als eine Coverage-Zahl ohne Erklärung.

  ## Häufige Fehler

  - **Test prüft die Implementierung gegen sich selbst.** Eine Erwartung, die aus dem Ergebnis berechnet wird, ist immer grün.
  - **Feste Dateinamen in parallelen Tests.** Rot bei 50 von 50 Läufen; `tempdir()` pro Test.
  - **`TempDir` zu früh gedroppt.** Hilfsfunktion gibt nur den Pfad zurück, das Verzeichnis ist weg, bevor das Programm läuft.
  - **Nur stdout geprüft.** Exit-Status und stderr gehören zum Vertrag eines CLI.
  - **Strategie verfehlt die interessanten Fälle.** `any::<u32>()` erzeugt kaum Duplikate; Bereiche passend wählen.
  - **`proptest-regressions` nicht committet.** Der gefundene Fall verschwindet beim nächsten Klon.
  - **Snapshots blind angenommen.** `.snap`-Diffs im Review lesen; zufällige Werte filtern.

  ## Zusammenfassung

  - Tests prüfen beobachtbare Regeln an Grenzwerten und Fehlerarten, nicht die aktuelle Codeform.
  - Integrationstests sehen die öffentliche API; ein CLI testest du über `CARGO_BIN_EXE_<name>` mit Status, stdout und stderr.
  - `assert_cmd` mit `cargo_bin_cmd!` und `predicates` kürzt CLI-Tests ab, `tempfile` gibt jedem Test ein eigenes Verzeichnis.
  - Property-Tests beschreiben Roundtrips, Invarianten und Referenzvergleiche; Shrinking liefert ein kleines Gegenbeispiel, der Seed wird committet.
  - Snapshots passen zu großen, stabilen Ausgaben; Filter entfernen Pfade und Zeiten, Diffs werden gelesen.
  - Formatierung, Lints, Tests und Release-Build machen unterschiedliche Aussagen; Performance misst ein Benchmark.
  - Eine nachweislich rote Regression vor der Reparatur erhöht die Aussagekraft.
exercises:
- id: grenzwert
