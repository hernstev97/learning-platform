        url: https://doc.rust-lang.org/book/ch16-02-message-passing.html#creating-multiple-producers
  - id: guard-lebensdauer
    type: output
    title: Solange der Guard lebt
    prompt: Was gibt dieses Programm aus? `try_lock` wartet nicht, sondern liefert sofort `Err`, wenn der Mutex gerade gesperrt ist.
    lang: rust
    code: |
      use std::sync::Mutex;

      fn main() {
          let zaehler = Mutex::new(0);
          {
              let mut guard = zaehler.lock().unwrap();
              *guard += 1;
              println!("{}", zaehler.try_lock().is_err());
          }
          println!("{}", zaehler.try_lock().is_ok());
          *zaehler.lock().unwrap() += 1;
          println!("{}", zaehler.into_inner().unwrap());
      }
    expected: |
      true
      true
      2
    explanation: |
      Die Sperre gehört dem Guard. Solange `guard` lebt, ist der Mutex gesperrt – auch für denselben Thread, deshalb schlägt `try_lock` fehl. Am Blockende wird `guard` gedroppt und gibt die Sperre frei. In `*zaehler.lock().unwrap() += 1` ist der Guard ein Temporärwert und lebt nur bis zum Semikolon. `into_inner` verbraucht den Mutex und gibt den Wert heraus. Ein zweites `lock()` statt `try_lock()` im inneren Block hätte das Programm für immer blockiert oder eine Panic ausgelöst.
    resources:
      - title: std::sync::Mutex::try_lock
        url: https://doc.rust-lang.org/std/sync/struct.Mutex.html#method.try_lock
      - title: Rust Book · The API of Mutex<T>
        url: https://doc.rust-lang.org/book/ch16-03-shared-state.html#the-api-of-mutext
  - id: scoped-threads
    type: gap
    title: Parallel zählen ohne move der Daten
    prompt: Ergänze den Code so, dass vier Threads je 250 Zeilen **ausleihen**, ihre Fehler zählen und `main` die Summe (`142`) ausgibt. `zeilen` soll `main` gehören bleiben.
    lang: rust
    code: |
      use std::thread;

      fn main() {
          let zeilen: Vec<String> = (1..=1000)
              .map(|i| if i % 7 == 0 { format!("ERROR {i}") } else { format!("INFO {i}") })
              .collect();

          let fehler: usize = ⟦thread::scope⟧(|s| {
              let handles: Vec<_> = zeilen
                  .chunks(250)
                  .map(|teil| ⟦s.spawn⟧(move || teil.iter().filter(|z| z.starts_with("ERROR")).count()))
                  .collect();
              handles.into_iter().map(|h| ⟦h.join().unwrap()⟧).sum()
          });

          println!("{fehler} Fehler in {} Zeilen", zeilen.len());
      }
    gaps:
      - label: Scope öffnen
        hint: Die Funktion aus `std::thread`, deren Threads lokale Daten ausleihen dürfen.
      - label: Thread im Scope starten
        hint: Gestartet wird über das Scope-Objekt `s`, nicht über `thread::spawn`.
      - label: Ergebnis eines Threads
        hint: Auf das Ende warten und den `Result` auspacken.
        accept: ["h.join().expect(\"Thread abgestürzt\")"]
    explanation: |
      `thread::scope` garantiert, dass alle mit `s.spawn` gestarteten Threads beendet sind, bevor die Funktion zurückkehrt. Deshalb dürfen sie `&[String]`-Stücke von `zeilen` ausleihen, ohne dass `'static` nötig ist. `move` verschiebt nur die Referenz `teil` in den Closure. Mit `thread::spawn` statt `s.spawn` lehnte der Compiler die Ausleihe ab, weil `spawn` `'static` verlangt.
