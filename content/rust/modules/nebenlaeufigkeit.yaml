        url: https://doc.rust-lang.org/book/ch16-02-message-passing.html#sending-multiple-values
  - id: join-und-panic
    type: output
    title: Ein Thread stürzt ab
    prompt: Was gibt dieses Programm auf der **Standardausgabe** aus? (Die Panic-Meldung des Threads landet auf stderr und zählt hier nicht.)
    lang: rust
    code: |
      use std::thread;

      fn main() {
          let zeilen = vec!["INFO a", "ERROR b", "ERROR c", "WARN d"];
          let zaehler = thread::spawn(move || {
              zeilen.iter().filter(|z| z.starts_with("ERROR")).count()
          });
          let pruefer = thread::spawn(|| -> u32 { "zwölf".parse().unwrap() });

          println!("Fehler: {}", zaehler.join().unwrap());
          match pruefer.join() {
              Ok(wert) => println!("Wert: {wert}"),
              Err(_) => println!("Prüfer abgestürzt"),
          }
          println!("main läuft weiter");
      }
    expected: |
      Fehler: 2
      Prüfer abgestürzt
      main läuft weiter
    explanation: |
      Die Ausgaben stehen alle in `main` und hängen jeweils von einem `join()` ab, deshalb ist die Reihenfolge fest. `"zwölf".parse::<u32>()` schlägt fehl, `unwrap()` löst im Prüfer-Thread eine Panic aus. Die beendet nur diesen Thread; `join()` liefert `Err` mit der Panic-Nutzlast, und `main` kann reagieren. Hätte `main` `pruefer.join().unwrap()` geschrieben, wäre die Panic in den Hauptthread weitergereicht worden.
