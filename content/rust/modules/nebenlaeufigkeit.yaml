    type: gap
    title: Anfragen zählen ohne Mutex
    prompt: Ergänze einen globalen, atomaren Zähler. Vier Threads erhöhen ihn je 1 000-mal, danach soll `4000` erscheinen. Es handelt sich um einen reinen Zähler, von dem keine anderen Daten abhängen.
