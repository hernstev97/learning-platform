id: nebenlaeufigkeit
title: Nebenläufigkeit mit Threads
level: 3
minutes: 180
summary: Threads, Channels, Mutex und Atomics – und warum Rust Data Races schon beim Übersetzen verhindert, Deadlocks und Race Conditions aber nicht.
goals:
  - Du startest Threads mit `thread::spawn` und `thread::scope`, sammelst Ergebnisse über `join` ein und erklärst, warum `spawn` `move` und `'static` verlangt.
  - Du verteilst Arbeit über `mpsc`-Channels und sorgst dafür, dass Empfangsschleifen enden.
  - Du teilst Zustand mit `Arc<Mutex<T>>`, `RwLock` und Atomics und hältst Lock-Guards so kurz wie möglich.
  - Du erklärst `Send` und `Sync` und begründest, warum `Rc` nicht `Send` und `RefCell` nicht `Sync` ist.
  - Du unterscheidest Data Races von Race Conditions und vermeidest Deadlocks durch eine feste Lock-Reihenfolge.
