      Ein `static` braucht einen Typ, der ohne `mut` über `&` veränderbar und `Sync` ist – genau das ist `AtomicUsize`. `fetch_add` ist ein unteilbares Read-Modify-Write, deshalb geht kein Inkrement verloren. `Relaxed` genügt, weil nur die Zahl selbst zählt; `SeqCst` wäre ebenfalls korrekt, nur minimal teurer. Das Ergebnis ist trotz `Relaxed` garantiert 4000: `thread::scope` joint alle Threads, und das Join stellt die nötige Ordnung her.
