  - id: channel-schliesst
    type: output
    title: Wann ist der Channel leer?
    prompt: Was gibt dieses Programm aus?
    lang: rust
    code: |
      use std::sync::mpsc;
      use std::thread;

      fn main() {
          let (tx, rx) = mpsc::channel();
          let mut handles = Vec::new();
          for id in 1..=3 {
              let tx = tx.clone();
              handles.push(thread::spawn(move || {
                  tx.send(id * 10).unwrap();
              }));
          }
          drop(tx);

          let mut werte: Vec<i32> = rx.iter().collect();
          werte.sort();
          println!("{werte:?}");
          println!("{}", rx.recv().is_err());
          for handle in handles {
              handle.join().unwrap();
          }
      }
    expected: |
      [10, 20, 30]
      true
    explanation: |
      Jeder Worker bekommt einen geklonten Sender und droppt ihn, sobald sein Closure endet. Nach `drop(tx)` existiert kein Sender mehr außerhalb der Worker. `rx.iter()` liefert alle drei Werte und endet, sobald der letzte Sender weg und der Channel leer ist. Die Ankunftsreihenfolge ist zufällig, `sort` macht die Ausgabe deterministisch. Ein weiteres `recv()` liefert sofort `Err(RecvError)` statt zu blockieren, weil der Channel getrennt ist.
