  - id: sender-nicht-gedroppt
    type: bug
    title: Das Programm hängt nach der dritten Meldung
    prompt: |
      Erwartet: drei Meldungen der Worker, danach `alle fertig`. Tatsächlich erscheinen die drei Meldungen, dann hängt das Programm, bis man es mit Strg+C abbricht. Es gibt keine Fehlermeldung. Finde die Zeile und korrigiere sie.
    lang: rust
    code: |
      use std::sync::mpsc;
      use std::thread;

      fn main() {
          let (tx, rx) = mpsc::channel();
          for id in 0..3 {
              let tx = tx.clone();
              thread::spawn(move || {
                  tx.send(format!("Worker {id} fertig")).unwrap();
              });
          }
          let _ = tx; // Sender freigeben, damit die Schleife endet

          for nachricht in rx {
              println!("{nachricht}");
          }
          println!("alle fertig");
      }
    lines: [12]
    fix:
      - line: 12
        answers: ["drop(tx);", "std::mem::drop(tx);"]
    explanation: |
      `for nachricht in rx` endet erst, wenn **alle** Sender gedroppt sind. Die Klone in den Workern verschwinden mit deren Ende, das Original `tx` lebt aber in `main` weiter. `let _ = tx;` sieht aus wie ein Freigeben, tut es aber nicht: Das Muster `_` bindet nichts, also wird `tx` weder verschoben noch gedroppt – nach dieser Zeile ist `tx` sogar noch benutzbar. Erst `drop(tx)` beendet den Besitz. Alternativ kannst du den Klon für den letzten Worker weglassen und `tx` selbst hineinverschieben.
    resources:
      - title: Rust Book · Creating Multiple Producers
        url: https://doc.rust-lang.org/book/ch16-02-message-passing.html#creating-multiple-producers
      - title: Reference · Wildcard pattern
        url: https://doc.rust-lang.org/reference/patterns.html#wildcard-pattern
  - id: verlorene-updates
    type: bug
    title: 40 000 Anfragen, 31 874 gezählt
    prompt: |
      Vier Threads bearbeiten je 10 000 Anfragen und zählen sie mit. Das Programm kompiliert ohne Warnung, aber die Ausgabe schwankt von Lauf zu Lauf, zum Beispiel `31874` oder `38090`. Nur selten stimmt sie. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: rust
    code: |
      use std::sync::atomic::{AtomicUsize, Ordering};
      use std::thread;

      static ANFRAGEN: AtomicUsize = AtomicUsize::new(0);

      fn bearbeite_anfrage() {
          // … eigentliche Arbeit …
          ANFRAGEN.store(ANFRAGEN.load(Ordering::SeqCst) + 1, Ordering::SeqCst);
      }

      fn main() {
          thread::scope(|s| {
              for _ in 0..4 {
                  s.spawn(|| {
                      for _ in 0..10_000 {
                          bearbeite_anfrage();
                      }
                  });
              }
          });
          println!("{}", ANFRAGEN.load(Ordering::SeqCst));
      }
    lines: [8]
    fix:
      - line: 8
        answers:
          - ANFRAGEN.fetch_add(1, Ordering::SeqCst);
          - ANFRAGEN.fetch_add(1, Ordering::Relaxed);
          - ANFRAGEN.fetch_add(1, Ordering::AcqRel);
    explanation: |
      `load` und `store` sind jeweils atomar, die Kombination aber nicht. Zwei Threads können denselben Wert lesen, beide `+ 1` rechnen und beide dasselbe Ergebnis schreiben – ein Inkrement geht verloren. Das ist kein Data Race (jeder Zugriff ist synchronisiert, `SeqCst` sogar maximal), sondern eine Race Condition in der Logik, die Rust nicht verhindern kann. `fetch_add` macht Lesen, Addieren und Schreiben zu einer unteilbaren Operation. Dasselbe Muster gibt es mit `Mutex`: Wer unter einer Sperre liest und unter einer zweiten schreibt, verliert Updates.
    resources:
      - title: std::sync::atomic::AtomicUsize
        url: https://doc.rust-lang.org/std/sync/atomic/type.AtomicUsize.html
      - title: Rustonomicon · Data Races and Race Conditions
        url: https://doc.rust-lang.org/nomicon/races.html
  - id: worker-pool-erklaeren
    type: explain
    title: Ein Worker-Pool aus Bordmitteln
    prompt: |
      So startet ein kleiner Webserver seine Worker (angelehnt an das Abschlussprojekt des Rust Books). Erkläre: Warum steckt der `Receiver` in `Arc<Mutex<…>>`? Wie lange hält ein Worker die Sperre? Warum die Schranken `Send + 'static` am Job-Typ? Und wie beendet man den Pool sauber?
    lang: rust
    code: |
      use std::sync::{mpsc, Arc, Mutex};
      use std::thread;

      type Job = Box<dyn FnOnce() + Send + 'static>;

      fn starte_worker(anzahl: usize) -> (mpsc::Sender<Job>, Vec<thread::JoinHandle<()>>) {
          let (tx, rx) = mpsc::channel::<Job>();
          let rx = Arc::new(Mutex::new(rx));
          let handles = (0..anzahl)
              .map(|_| {
                  let rx = Arc::clone(&rx);
                  thread::spawn(move || loop {
                      let job = rx.lock().unwrap().recv();
                      match job {
                          Ok(job) => job(),
                          Err(_) => break,
                      }
                  })
              })
              .collect();
          (tx, handles)
      }
    points:
      - Ein `mpsc`-Channel hat genau einen Empfänger, der sich nicht klonen lässt; damit mehrere Worker aus derselben Queue ziehen, wird er über `Arc` geteilt und mit `Mutex` geschützt.
      - Der `MutexGuard` in `rx.lock().unwrap().recv()` ist ein Temporärwert und wird am Ende der `let`-Anweisung freigegeben – der Job läuft also ohne Sperre, andere Worker können parallel Jobs holen.
      - "`Send + 'static` ist nötig, weil der Job an einen anderen Thread übergeben wird und unbestimmt lange leben kann; `Box<dyn FnOnce()>` erlaubt beliebige Closures, die genau einmal laufen."
      - "Sauberes Beenden: den `Sender` droppen, dann liefert `recv()` `Err`, jeder Worker verlässt die Schleife, und die `JoinHandle`s werden gejoint."
    explanation: |
      Der Channel ist die Job-Queue. Weil `mpsc` nur einen Empfänger kennt und `Receiver` nicht `Sync` ist, teilen sich die Worker ihn über `Arc<Mutex<Receiver<Job>>>`: `Arc` für mehrere Besitzer, `Mutex` dafür, dass immer nur einer gleichzeitig `recv` aufruft. Entscheidend ist, dass die Sperre nur für `recv` gehalten wird. Der Guard ist ein Temporärwert der `let`-Anweisung und verschwindet am Semikolon, deshalb läuft `job()` ohne Lock. Hätte man `while let Ok(job) = rx.lock().unwrap().recv()` geschrieben, lebte der Guard durch den ganzen Schleifenrumpf, und die Worker würden nacheinander statt parallel arbeiten. `Box<dyn FnOnce() + Send + 'static>` ist ein beliebiger Closure, der einmal läuft, an einen anderen Thread übergeben werden darf und keine kurzlebigen Ausleihen enthält. Zum Herunterfahren droppt man den Sender: `recv` liefert dann `Err`, jeder Worker bricht aus der Schleife aus, und man joint die Handles.
    resources:
      - title: Rust Book · Kapitel 21 – Turning Our Single-Threaded Server into a Multithreaded Server
        url: https://doc.rust-lang.org/book/ch21-02-multithreaded.html
      - title: std::sync::mpsc::Receiver::recv
        url: https://doc.rust-lang.org/std/sync/mpsc/struct.Receiver.html#method.recv
  - id: parallele-log-analyse
    type: practice
    title: Log-Level parallel zählen
    prompt: |
      Schreibe `zaehle_parallel(zeilen: &[&str], threads: usize) -> HashMap<String, usize>`. Sie zählt, wie oft jedes Log-Level (das erste Wort jeder Zeile) vorkommt, und verteilt die Arbeit auf `threads` Threads.

      Vorgaben:

      1. Nutze `thread::scope`, damit die Threads `zeilen` ausleihen können.
      2. Jeder Thread zählt in **seine eigene** `HashMap`; zusammengeführt wird erst nach dem `join`. Kein `Mutex`.
      3. Das Ergebnis ist identisch mit der sequenziellen Funktion `zaehle_level`.
      4. Randfälle: leere Eingabe, mehr Threads als Zeilen, `threads == 0`.
      5. Schreibe Tests für diese Fälle.

      Zusatzfrage: Warum ist „jeder Thread zählt für sich, dann zusammenführen“ hier besser als eine gemeinsame `Arc<Mutex<HashMap>>`?
    lang: rust
    starter: |
      use std::collections::HashMap;
      use std::thread;

      fn zaehle_level(zeilen: &[&str]) -> HashMap<String, usize> {
          let mut karte = HashMap::new();
          for zeile in zeilen {
