      fn zaehle_parallel(zeilen: &[&str], threads: usize) -> HashMap<String, usize> {
          todo!()
      }

      fn main() {
          let log = ["INFO start", "ERROR db", "WARN platte", "ERROR netz", "INFO ende"];
          println!("{:?}", zaehle_parallel(&log, 2));
      }
    solution: |
      use std::collections::HashMap;
      use std::thread;

      fn zaehle_level(zeilen: &[&str]) -> HashMap<String, usize> {
          let mut karte = HashMap::new();
          for zeile in zeilen {
              if let Some(level) = zeile.split_whitespace().next() {
                  *karte.entry(level.to_string()).or_insert(0) += 1;
              }
          }
          karte
      }

      fn zaehle_parallel(zeilen: &[&str], threads: usize) -> HashMap<String, usize> {
          let threads = threads.max(1);
          let teilgroesse = zeilen.len().div_ceil(threads).max(1);
          thread::scope(|s| {
              let handles: Vec<_> = zeilen
                  .chunks(teilgroesse)
                  .map(|teil| s.spawn(move || zaehle_level(teil)))
                  .collect();
              let mut gesamt = HashMap::new();
              for handle in handles {
                  for (level, anzahl) in handle.join().expect("Zähl-Thread abgestürzt") {
                      *gesamt.entry(level).or_insert(0) += anzahl;
                  }
              }
              gesamt
          })
      }

      fn main() {
          let log = ["INFO start", "ERROR db", "WARN platte", "ERROR netz", "INFO ende"];
          let mut ergebnis: Vec<_> = zaehle_parallel(&log, 2).into_iter().collect();
          ergebnis.sort();
          println!("{ergebnis:?}");
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          fn beispiel() -> Vec<&'static str> {
              (0..1000)
                  .map(|i| match i % 5 {
                      0 => "ERROR kaputt",
                      1 | 2 => "INFO ok",
                      3 => "WARN langsam",
                      _ => "",
                  })
                  .collect()
          }

          #[test]
          fn gleich_wie_sequenziell() {
              let zeilen = beispiel();
              for threads in [1, 2, 3, 7, 16] {
                  assert_eq!(zaehle_parallel(&zeilen, threads), zaehle_level(&zeilen), "threads = {threads}");
              }
          }

          #[test]
          fn leere_eingabe() {
              assert!(zaehle_parallel(&[], 4).is_empty());
          }

          #[test]
          fn mehr_threads_als_zeilen() {
              let ergebnis = zaehle_parallel(&["ERROR a", "INFO b"], 8);
              assert_eq!(ergebnis["ERROR"], 1);
              assert_eq!(ergebnis["INFO"], 1);
          }

          #[test]
          fn null_threads_heisst_einer() {
              assert_eq!(zaehle_parallel(&["WARN x"], 0)["WARN"], 1);
          }
      }
    checklist:
      - "`thread::scope` statt `thread::spawn`; `zeilen` wird nur ausgeliehen, nicht geklont."
      - Jeder Thread gibt seine eigene `HashMap` zurück; `main` führt sie nach dem `join` zusammen. Kein `Mutex`, kein `Arc`.
      - Die Teilgröße wird aufgerundet (`div_ceil`) und ist mindestens 1 – `chunks(0)` würde eine Panic auslösen.
      - "`threads == 0` wird wie 1 behandelt, leere Eingabe liefert eine leere Map."
      - Ein Test vergleicht das Ergebnis für mehrere Thread-Zahlen mit `zaehle_level`.
      - Du kannst die Zusatzfrage beantworten.
    explanation: |
      Die Lösung teilt die Daten, nicht den Zustand. Jeder Thread arbeitet ohne jede Synchronisation auf seinem eigenen Stück und seiner eigenen Map; synchronisiert wird nur einmal, beim `join`. Eine gemeinsame `Arc<Mutex<HashMap>>` wäre ebenfalls korrekt, aber jeder Thread müsste für jede Zeile die Sperre holen – die Threads würden sich gegenseitig ausbremsen, und im schlimmsten Fall wäre die parallele Version langsamer als die sequenzielle. Diese Form („map, dann reduce“) ist genau das, was `rayon` mit `par_iter().fold(…).reduce(…)` automatisiert. Die Randfälle sind keine Kosmetik: `chunks(0)` löst eine Panic aus, und `len / threads` ohne Aufrunden würde bei 5 Zeilen und 2 Threads drei statt zwei Stücke erzeugen – nicht falsch, aber nicht das, was der Aufrufer wollte.
    resources:
      - title: std::thread::scope
        url: https://doc.rust-lang.org/std/thread/fn.scope.html
      - title: slice::chunks
        url: https://doc.rust-lang.org/std/primitive.slice.html#method.chunks
