    type: gap
    title: Eine Statistik für alle Threads
    prompt: Ergänze den geteilten Zustand, den Besitzanteil pro Thread und das Sperren, sodass beide Threads in dieselbe `HashMap` zählen.
    lang: rust
    code: |
      use std::collections::HashMap;
      use std::sync::{Arc, Mutex};
      use std::thread;

      fn main() {
          let statistik = ⟦Arc::new(Mutex::new(HashMap::new()))⟧;
          let mut handles = Vec::new();

          for datei in ["api.log", "db.log"] {
              let statistik = ⟦Arc::clone(&statistik)⟧;
              handles.push(thread::spawn(move || {
                  let mut karte = ⟦statistik.lock().unwrap()⟧;
                  *karte.entry(datei).or_insert(0) += 1;
              }));
          }

          for handle in handles {
              handle.join().unwrap();
          }
          println!("{} Dateien", statistik.lock().unwrap().len());
      }
    gaps:
      - label: Geteilter Zustand
        hint: Von außen nach innen – thread-sicherer Mehrfachbesitz, darin die Sperre, darin die Daten.
      - label: Anteil für den Thread
        hint: Ein weiterer Zeiger auf dieselbe Allokation, kein neuer Mutex.
        accept: ["statistik.clone()"]
      - label: Sperren
        hint: Sperre anfordern und das `Result` (Poisoning) auspacken.
        accept: ["statistik.lock().expect(\"Mutex vergiftet\")"]
    explanation: |
      `Arc` gibt jedem Thread einen Besitzanteil, `Mutex` sorgt dafür, dass immer nur einer die `HashMap` verändert. `Arc::clone` erhöht nur den atomaren Zähler. `lock()` liefert ein `Result`, weil der Mutex vergiftet sein kann; der `MutexGuard` in `karte` gibt die Sperre am Ende des Closures frei. Ein `Rc` statt `Arc` oder eine `RefCell` statt `Mutex` würde an `Send` bzw. `Sync` scheitern.
