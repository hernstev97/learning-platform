id: lifetimes
title: Lifetimes
level: 3
minutes: 150
summary: Lifetime-Annotationen beschreiben, wie lange Referenzen zueinander gültig sein müssen – wer das Denkmodell dahinter versteht, liest Borrow-Checker-Fehler und behebt sie mit Absicht statt mit Raten.
goals:
  - Du erklärst, warum Rust Lifetimes braucht und warum Annotationen nichts an der Lebensdauer eines Werts ändern.
  - Du annotierst Funktionen, die Referenzen zurückgeben, und begründest, welche Parameter eine Lifetime brauchen und welche nicht.
  - Du wendest die drei Elisionsregeln an und sagst vorher, wann der Compiler eine Annotation verlangt.
  - Du schreibst Structs und `impl`-Blöcke mit Lifetime-Parametern und unterscheidest `&'a str` von einer an `&self` gebundenen Rückgabe.
  - "Du unterscheidest `&'static str` vom Bound `T: 'static` und behebst die Fehler E0106, E0515 und E0597 mit passenden Umbauten."
