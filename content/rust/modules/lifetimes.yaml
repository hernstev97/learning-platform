lesson: |
  Du schreibst einen Parser für Logzeilen. Die Datei ist 2 GB groß, und jede Zeile in drei neue `String`s zu kopieren, kostet Zeit und Speicher. Also soll der Parser Slices zurückgeben, die direkt in den Eingabetext zeigen. Sobald du das versuchst, fragt der Compiler: **Wie lange sind diese Referenzen gültig?** Die Antwort schreibst du mit Lifetime-Annotationen wie `'a` hin.

  Lifetimes gelten als das schwierigste Thema in Rust. Das liegt selten an der Syntax, sondern an einem falschen Denkmodell. Wer glaubt, `'a` verlängere die Lebensdauer eines Werts, kämpft endlos mit dem Compiler. Wer versteht, dass `'a` eine **Beziehung** zwischen Referenzen beschreibt, liest die Fehlermeldungen wie Hinweise.

  ## Warum es Lifetimes gibt

  Jede Referenz ist nur gültig, solange der Wert lebt, auf den sie zeigt. Der Borrow Checker prüft das für jede Referenz im Programm ([Book: The Borrow Checker](https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#the-borrow-checker)):

  ```rust nocheck
  fn main() {
      let r;
      {
          let x = 5;
          r = &x;
      } // x wird hier freigegeben
      println!("{r}"); // r würde ins Leere zeigen
  }
  ```

  ```text
  error[E0597]: `x` does not live long enough
    |
  5 |         r = &x;
    |             ^^ borrowed value does not live long enough
  6 |     }
    |     - `x` dropped here while still borrowed
  7 |     println!("{r}");
    |                - borrow later used here
  ```

  Die **Lifetime** einer Referenz ist der Bereich im Code, in dem sie gültig sein muss. Innerhalb einer Funktion ermittelt der Compiler das selbst. Seit den Non-Lexical Lifetimes (Edition 2018) endet eine Leihe beim letzten Gebrauch, nicht erst am Ende des Blocks – deshalb kompiliert Code, der eine Referenz nicht mehr benutzt, bevor er den Wert ändert ([Book: Mutable References](https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#mutable-references)).

  Schwierig wird es an **Funktionsgrenzen**. Der Compiler prüft jede Funktion für sich und schaut beim Aufrufer nur auf die Signatur, nicht in den Rumpf. Gibt eine Funktion eine Referenz zurück, muss die Signatur sagen, woher diese Referenz geliehen ist. Genau dafür gibt es Lifetime-Annotationen.

  ## Annotationen beschreiben Beziehungen

  Die klassische Funktion aus dem Book gibt den längeren von zwei Strings zurück. Ohne Annotation lehnt der Compiler sie ab:

  ```rust nocheck
  fn laengste(a: &str, b: &str) -> &str {
      if a.len() >= b.len() { a } else { b }
  }
  ```

  ```text
  error[E0106]: missing lifetime specifier
    = help: this function's return type contains a borrowed value, but the
            signature does not say whether it is borrowed from `a` or `b`
  ```

  Die Hilfe sagt es präzise: Ob `a` oder `b` zurückkommt, entscheidet sich erst zur Laufzeit. Der Aufrufer muss aber zur Compile-Zeit wissen, wie lange er das Ergebnis benutzen darf. Die Lösung ([E0106](https://doc.rust-lang.org/error_codes/E0106.html)):

  ```rust
  fn laengste<'a>(a: &'a str, b: &'a str) -> &'a str {
      if a.len() >= b.len() { a } else { b }
  }

  fn main() {
      let standard = String::from("config.toml");
      {
          let lokal = String::from("config.local.toml");
          let datei = laengste(&standard, &lokal);
          println!("lade {datei}"); // ok: beide leben hier noch
      }
  }
  ```

  Lies `<'a>` als: „Es gibt einen Bereich `'a`. Beide Eingaben sind mindestens in diesem Bereich gültig, und das Ergebnis ist in diesem Bereich gültig.“ Beim Aufruf setzt der Compiler für `'a` den **kürzesten** Bereich ein, in dem beide Argumente noch leben ([Book: Lifetime Annotations in Function Signatures](https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-function-signatures)). Benutzt du `datei` nach dem Block, in dem `lokal` stirbt, meldet er E0597 – auch wenn zur Laufzeit zufällig `standard` zurückgekommen wäre. Die Signatur ist ein Vertrag, und der Compiler prüft gegen den Vertrag.

  > [!MERKE]
  > Lifetime-Annotationen ändern nicht, wie lange ein Wert lebt. Sie beschreiben, wie die Gültigkeitsbereiche von Referenzen zusammenhängen, damit der Compiler das an beiden Seiten der Funktionsgrenze prüfen kann.

  ### Nur annotieren, was zusammenhängt

  Eine Annotation gehört nur an die Parameter, von denen das Ergebnis tatsächlich leiht ([Book: Thinking in Terms of Lifetimes](https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#relationships)):

  ```rust
  // Rückgabe hängt nur von `zeile` ab – `trenner` bekommt keine Lifetime
  fn erstes_feld<'a>(zeile: &'a str, trenner: &str) -> &'a str {
      zeile.split(trenner).next().unwrap_or(zeile)
  }

  fn main() {
      let zeile = String::from("4711;Steven;Köln");
      let id;
      {
          let trenner = String::from(";");
          id = erstes_feld(&zeile, &trenner);
      } // trenner stirbt hier – egal, id leiht nur von zeile
      println!("{id}");
  }
  ```

  Hätte auch `trenner` die Lifetime `'a`, würde der Aufrufer unnötig eingeschränkt: `id` dürfte nicht länger leben als `trenner`. Umgekehrt prüft der Compiler den Rumpf gegen die Signatur: Würde `erstes_feld` versuchen, `trenner` zurückzugeben, lehnte er das ab. Gute Signaturen sind so präzise wie möglich.

  ## Die drei Elisionsregeln

  Warum brauchte `fn erstes_wort(s: &str) -> &str` aus dem Ownership-Modul keine Annotation? Weil der Compiler in eindeutigen Fällen Lifetimes selbst einsetzt. Die Regeln heißen **Lifetime Elision** und stehen in der [Referenz](https://doc.rust-lang.org/reference/lifetime-elision.html#lifetime-elision-in-functions) und im [Book](https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#lifetime-elision):

  1. Jede ausgelassene Lifetime in den Parametern wird ein **eigener** Lifetime-Parameter.
  2. Gibt es in den Parametern **genau eine** Lifetime, bekommen alle ausgelassenen Rückgabe-Lifetimes diese.
  3. Ist ein Parameter `&self` oder `&mut self`, bekommen alle ausgelassenen Rückgabe-Lifetimes die Lifetime von `self`.

  Bleibt danach eine Rückgabe-Lifetime unbestimmt, meldet der Compiler E0106. Durchgespielt:

  | Du schreibst | Nach Regel 1 | Ergebnis |
  | --- | --- | --- |
  | `fn f(s: &str) -> &str` | `fn f<'a>(s: &'a str) -> &str` | Regel 2: `-> &'a str` |
  | `fn f(a: &str, b: &str) -> &str` | `fn f<'a, 'b>(a: &'a str, b: &'b str) -> &str` | keine Regel greift: E0106 |
  | `fn f(&self, key: &str) -> &str` | `fn f<'a, 'b>(&'a self, key: &'b str) -> &str` | Regel 3: `-> &'a str` |
  | `fn f(s: &str) -> String` | `fn f<'a>(s: &'a str) -> String` | keine Referenz in der Rückgabe, nichts zu tun |

  Regel 3 ist eine Vermutung, die meistens stimmt: Methoden geben meist etwas aus `self` zurück. Gibt deine Methode aber etwas aus einem anderen Parameter zurück, musst du annotieren – sonst meldet der Compiler einen Fehler im Rumpf.

  ## Structs mit Referenzen

  Ein Struct darf Referenzen halten, braucht dann aber einen Lifetime-Parameter. `Anfrage<'a>` heißt: „Diese Anfrage darf nicht länger leben als die Daten, auf die ihre Felder zeigen“ ([Book: Lifetime Annotations in Struct Definitions](https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-struct-definitions)).

  ```rust
  struct Anfrage<'a> {
      methode: &'a str,
      pfad: &'a str,
  }

  impl<'a> Anfrage<'a> {
      fn parse(zeile: &'a str) -> Option<Anfrage<'a>> {
          let mut teile = zeile.split_whitespace();
          let methode = teile.next()?;
          let pfad = teile.next()?;
          Some(Anfrage { methode, pfad })
      }

      fn beschreibung(&self) -> String {
          format!("{} auf {}", self.methode, self.pfad)
      }

      // Explizit 'a: Rückgabe lebt so lange wie der Eingabetext
      fn pfad(&self) -> &'a str {
          self.pfad
      }
  }

  fn main() {
      let rohdaten = String::from("GET /api/users HTTP/1.1");
      let pfad;
      {
          let anfrage = Anfrage::parse(&rohdaten).unwrap();
          println!("{}", anfrage.beschreibung());
          pfad = anfrage.pfad(); // leiht von rohdaten, nicht von anfrage
      }
      println!("{pfad}");
  }
  ```

  `impl<'a> Anfrage<'a>` deklariert `'a` für den ganzen Block, ähnlich wie `impl<T>` bei Generics. Der interessante Teil ist `fn pfad(&self) -> &'a str`. Mit Elision (`-> &str`) würde Regel 3 die Rückgabe an `&self` binden – also an die `Anfrage`. Dann dürfte `pfad` nicht länger leben als `anfrage`, und `main` würde nicht kompilieren. Mit `&'a str` sagst du: Das Ergebnis leiht vom **ursprünglichen Text**, die `Anfrage` ist nur der Weg dorthin. Diese Unterscheidung ist bei Parsern und Iteratoren über geliehene Daten entscheidend ([Book: Lifetime Annotations in Method Definitions](https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-method-definitions)).

  Brauchst du `'a` im Block nicht, kannst du `impl Anfrage<'_>` schreiben. `'_` ist die „anonyme“ Lifetime: „Hier gibt es eine, ihr Name ist egal.“

  > [!PRAXIS] Referenzen in Structs sparsam einsetzen
  > In Anwendungscode halten Structs meist eigene Daten (`String`, `Vec<T>`). Das kostet ein paar Kopien und macht den Code deutlich einfacher zu ändern: Ein Struct ohne Lifetime-Parameter lässt sich speichern, zurückgeben und an Threads übergeben. Structs mit Referenzen lohnen sich für kurzlebige Sichten auf große Daten: Parser, Tokenizer, Iteratoren. Bibliotheken wie `serde` bieten beides an – `String`-Felder für den Normalfall, `&'a str`-Felder für Zero-Copy-Deserialisierung, wenn Profiling zeigt, dass es sich lohnt.

  ## 'static: zwei verschiedene Bedeutungen

  `'static` ist die einzige Lifetime mit festem Namen. Sie taucht in zwei Formen auf, die oft verwechselt werden ([Book: The Static Lifetime](https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#the-static-lifetime), [Rust by Example: static](https://doc.rust-lang.org/rust-by-example/scope/lifetime/static_lifetime.html)):

  - **`&'static T` als Referenz:** Die Daten leben bis zum Programmende. String-Literale sind `&'static str`, weil sie im Binary stehen.
  - **`T: 'static` als Bound:** Der Typ `T` enthält **keine Referenzen mit kürzerer Lifetime**. Jeder Typ, der seine Daten besitzt, erfüllt das: `String`, `Vec<i32>`, `u64`. Ein `String` lebt deshalb nicht ewig – er *könnte* nur so lange behalten werden, wie der Besitzer will, weil er von niemandem leiht.

  ```rust
  use std::fmt::Debug;

  // T: 'static heißt: T enthält keine Referenzen mit kürzerer Lifetime
  fn merke<T: Debug + 'static>(wert: T) -> Box<dyn Debug> {
      Box::new(wert)
  }

  fn main() {
      let version: &'static str = "1.98.1"; // liegt im Binary
      let name = String::from("steven");    // lebt nicht ewig, erfüllt aber 'static

      let a = merke(version);
      let b = merke(name);          // ok: String besitzt seine Daten
      let c = merke(vec![1, 2, 3]); // ok: Vec<i32> ebenso
      println!("{a:?} {b:?} {c:?}");

      let lokal = String::from("temp");
      let r = &lokal;
      // merke(r);                  // Fehler: `lokal` does not live long enough
      println!("{r}");
  }
  ```

  Den Bound `T: 'static` wirst du bei `std::thread::spawn` wiedersehen: Ein Thread kann länger laufen als die Funktion, die ihn startet, also darf er nichts von deren lokalen Variablen leihen.

  > [!WARNING] 'static ist selten die Lösung
  > Der Compiler schlägt manchmal `'static` vor. Wer daraufhin `&'static str` in eine Signatur schreibt, verschiebt das Problem meist nur zum Aufrufer: Jetzt passen nur noch Literale, keine Strings aus Dateien oder Nutzereingaben. Frag dich stattdessen, wem die Daten gehören sollen – oft ist ein eigener `String` die richtige Antwort.

  ## Lifetime-Fehler lesen und beheben

  Fast alle Lifetime-Fehler folgen einem Muster: Eine Referenz soll länger benutzt werden, als ihr Besitzer lebt. Die Meldung zeigt dir drei Stellen – wo geliehen wird, wo der Besitzer stirbt, wo die Referenz danach noch benutzt wird. Die Lösung liegt fast nie in einer anderen Annotation, sondern in einer von vier Umbauten:

  | Umbau | Wann | Beispiel |
  | --- | --- | --- |
  | Eigene Daten zurückgeben | Funktion erzeugt einen neuen Wert | `-> String` statt `-> &str` |
  | Besitzer verschieben | Wert stirbt in einem zu kleinen Block | `let` eine Ebene höher ziehen |
  | Reihenfolge ändern | Leihe überlappt mit Änderung | erst fertig lesen, dann ändern |
  | Bewusst kopieren | Wert wird wirklich länger gebraucht | `.to_string()` oder `.clone()`, mit Kommentar warum |

  Der häufigste Fall für den ersten Umbau ist [E0515](https://doc.rust-lang.org/error_codes/E0515.html): eine Referenz auf eine lokale Variable zurückgeben.

  ```rust nocheck
  fn normalisiere(name: &str) -> &str {
      let klein = name.trim().to_lowercase(); // neuer String, gehört der Funktion
      &klein // Fehler E0515: cannot return reference to local variable `klein`
  }
  ```

  `klein` wird am Ende der Funktion freigegeben. Keine Annotation der Welt kann eine Referenz darauf gültig machen. Die Funktion **erzeugt** Daten, also muss sie sie auch **übergeben**:

  ```rust
  fn normalisiere(name: &str) -> String {
      name.trim().to_lowercase()
  }

  fn main() {
      let n = normalisiere("  Steven ");
      println!("[{n}]");
  }
  ```

  Eine zweite, subtilere Meldung lautet `lifetime may not live long enough`. Sie kommt, wenn der Rumpf nicht zur Signatur passt – etwa wenn eine Funktion mit `-> &'a str` einen Parameter mit Lifetime `'b` zurückgibt. Hier ist tatsächlich die Signatur falsch: Sie behauptet eine Beziehung, die der Code nicht einhält.

  > [!INTERVIEW] „Was bedeutet 'a in fn laengste<'a>(a: &'a str, b: &'a str) -> &'a str?“
  > `'a` ist ein generischer Lifetime-Parameter. Die Signatur verspricht: Das Ergebnis ist gültig, solange **beide** Argumente gültig sind; der Compiler setzt beim Aufruf den kürzeren der beiden Bereiche ein. Die Annotation ändert keine Lebensdauer, sie beschreibt eine Beziehung, damit der Borrow Checker Aufrufer und Rumpf getrennt prüfen kann. Nötig ist sie hier, weil zwei Referenzen hineingehen und die Elisionsregeln nicht entscheiden können, von welcher das Ergebnis leiht.

  ## Häufige Fehler

  - **`'a` für eine Verlängerung halten.** Eine Annotation kann einen Wert nicht länger leben lassen. Wenn der Besitzer zu früh stirbt, muss sich der Code ändern, nicht die Annotation.
  - **Alle Parameter mit derselben Lifetime versehen.** Das schränkt Aufrufer unnötig ein. Nur Parameter annotieren, von denen das Ergebnis leiht.
  - **Referenz auf lokale Daten zurückgeben** ([E0515](https://doc.rust-lang.org/error_codes/E0515.html)). Eigene Daten zurückgeben: `String`, `Vec<T>`.
  - **Wert in einem inneren Block anlegen und danach benutzen** ([E0597](https://doc.rust-lang.org/error_codes/E0597.html)). Den Besitzer eine Ebene höher deklarieren.
  - **Rückgabe einer Methode unbeabsichtigt an `&mut self` binden.** Dann blockiert jedes Ergebnis weitere Aufrufe ([E0499](https://doc.rust-lang.org/error_codes/E0499.html)). Explizit die Lifetime der Daten (`&'a str`) angeben.
  - **Temporäre Werte leihen.** `let s = String::from("x").as_str();` leiht von einem Wert, der am Ende der Anweisung freigegeben wird ([E0716](https://doc.rust-lang.org/error_codes/E0716.html)). Den `String` erst an eine Variable binden.
  - **`'static` als Pflaster.** Macht die API unbrauchbar für Laufzeitdaten.

  ## Zusammenfassung

  - Jede Referenz hat eine Lifetime: den Bereich, in dem sie gültig sein muss. Innerhalb von Funktionen leitet der Compiler sie ab.
  - Annotationen wie `'a` beschreiben Beziehungen an Funktionsgrenzen. Sie verlängern nichts.
  - `fn f<'a>(a: &'a T, b: &'a T) -> &'a T`: Das Ergebnis ist gültig, solange beide Argumente gültig sind.
  - Die drei Elisionsregeln: eigene Lifetime pro Eingabe; eine Eingabe-Lifetime geht an die Ausgabe; `&self` geht an die Ausgabe.
  - Structs mit Referenzen brauchen `<'a>` und dürfen ihre Daten nicht überleben. `-> &'a str` statt `-> &str` entkoppelt Ergebnisse von `&self`.
  - `&'static str` sind Daten bis zum Programmende; `T: 'static` heißt nur: keine kurzlebigen Referenzen in `T`.
  - Lifetime-Fehler löst du mit Umbauten: eigene Daten zurückgeben, Besitzer verschieben, Reihenfolge ändern oder bewusst kopieren.
exercises:
  - id: was-laengste-verspricht
    type: choice
    title: Was verspricht die Signatur?
    prompt: |
      Welche Aussagen über `fn laengste<'a>(a: &'a str, b: &'a str) -> &'a str` stimmen? **Mehrere Antworten richtig.**
    options:
      - text: Das Ergebnis darf nur so lange benutzt werden, wie beide Argumente gültig sind.
        correct: true
        why: Der Compiler setzt für `'a` den Bereich ein, in dem beide Argumente leben – also den kürzeren der beiden.
      - text: Die Annotation sorgt dafür, dass `a` und `b` gleich lange leben.
        correct: false
        why: Annotationen ändern keine Lebensdauer. Die Argumente dürfen verschieden lange leben; `'a` ist nur der gemeinsame Bereich.
      - text: Der Compiler prüft den Rumpf gegen die Signatur und den Aufrufer gegen die Signatur, getrennt voneinander.
        correct: true
        why: Genau deshalb braucht es die Annotation. Der Aufrufer sieht nur die Signatur, nicht den Rumpf.
      - text: Wenn zur Laufzeit immer `a` zurückkommt, darf der Aufrufer das Ergebnis auch nach dem Ende von `b` benutzen.
        correct: false
        why: Der Compiler kennt keine Laufzeitwerte. Die Signatur sagt, das Ergebnis könnte von `b` stammen, also gilt die Einschränkung immer.
    explanation: |
      Eine Lifetime-Annotation ist ein Vertrag zwischen Funktion und Aufrufer. Die Funktion verspricht, nur etwas zurückzugeben, das mindestens im Bereich `'a` gültig ist; der Aufrufer verspricht, das Ergebnis nur in diesem Bereich zu benutzen. Beides prüft der Compiler statisch – Laufzeitverhalten spielt keine Rolle.
    resources:
      - title: The Rust Book · Lifetime Annotations in Function Signatures
        url: https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-function-signatures

  - id: static-bound
    type: choice
    title: Wer erfüllt T 'static?
    prompt: |
      Eine Funktion hat den Bound `T: 'static`. Mit welchen Argumenten kannst du sie aufrufen? **Mehrere Antworten richtig.**
    lang: rust
    code: |
      fn speichere<T: std::fmt::Debug + 'static>(wert: T) { /* … */ }

      fn beispiel(eingabe: &str) {
          let name = String::from("steven");
          // Welche Aufrufe kompilieren?
      }
    options:
      - text: "`speichere(name.clone())`"
        correct: true
        why: Ein `String` besitzt seine Daten und enthält keine Referenzen. Damit erfüllt er `'static`, auch wenn er nicht ewig lebt.
      - text: "`speichere(\"literal\")`"
        correct: true
        why: String-Literale sind `&'static str` – sie stehen im Binary.
      - text: "`speichere(eingabe)`"
        correct: false
        why: "`eingabe` hat eine Lifetime, die der Aufrufer bestimmt. Der Compiler kann nicht garantieren, dass sie `'static` ist."
      - text: "`speichere(vec![1, 2, 3])`"
        correct: true
        why: "`Vec<i32>` besitzt seine Elemente und enthält keine Referenzen."
      - text: "`speichere(&name)`"
        correct: false
        why: "`&name` leiht von einer lokalen Variable, die am Ende von `beispiel` freigegeben wird."
    explanation: |
      `T: 'static` heißt nicht „lebt bis zum Programmende“, sondern „enthält keine Referenzen, die vor dem Programmende ungültig werden könnten“. Alle besitzenden Typen erfüllen das automatisch. Nur Referenzen (und Typen, die Referenzen enthalten) müssen tatsächlich auf `'static`-Daten zeigen. Diese Unterscheidung wird bei `thread::spawn` und bei `Box<dyn Error>` wichtig.
    resources:
      - title: Rust by Example · static als Trait Bound
        url: https://doc.rust-lang.org/rust-by-example/scope/lifetime/static_lifetime.html#trait-bound
      - title: The Rust Reference · Lifetime bounds
        url: https://doc.rust-lang.org/reference/trait-bounds.html#lifetime-bounds

  - id: elision-durchspielen
    type: order
    title: Elision Schritt für Schritt
    prompt: |
      Der Compiler sieht die Methode `fn wert(&self, schluessel: &str) -> &str`. Bring die Schritte der Lifetime-Elision in die richtige Reihenfolge.
    lang: text
    lines: |
      Regel 1 gibt jeder Eingabe-Referenz eine eigene Lifetime: &'a self und schluessel: &'b str.
      Regel 2 greift nicht, weil es zwei Eingabe-Lifetimes gibt.
      Regel 3 greift, weil ein Parameter &self ist.
      Die Rückgabe bekommt die Lifetime von self: -> &'a str.
      Der Compiler prüft den Rumpf gegen diese Signatur; gibt er schluessel zurück, meldet er einen Fehler.
    explanation: |
      Die Regeln laufen der Reihe nach: Erst bekommt jede Eingabe eine eigene Lifetime, dann wird geprüft, ob es genau eine gibt (Regel 2), dann, ob `&self` dabei ist (Regel 3). Erst nach der Elision steht die vollständige Signatur fest, gegen die der Rumpf geprüft wird. Soll die Methode `schluessel` zurückgeben dürfen, musst du die Signatur selbst annotieren.
    resources:
      - title: The Rust Reference · Lifetime elision in functions
        url: https://doc.rust-lang.org/reference/lifetime-elision.html#lifetime-elision-in-functions

  - id: zeilen-parser-ausgabe
    type: output
    title: Ein Parser, der nichts kopiert
    prompt: Was gibt dieses Programm aus? Beachte die Leerzeile im Text.
    lang: rust
    code: |
      struct Zeilen<'a> {
          rest: &'a str,
      }

      impl<'a> Zeilen<'a> {
          fn naechste(&mut self) -> Option<&'a str> {
              if self.rest.is_empty() {
                  return None;
              }
              match self.rest.split_once('\n') {
                  Some((zeile, rest)) => {
                      self.rest = rest;
                      Some(zeile)
                  }
                  None => {
                      let zeile = self.rest;
                      self.rest = "";
                      Some(zeile)
                  }
              }
          }
      }

      fn main() {
          let text = String::from("host=db01\nport=5432\n\nuser=app");
          let mut zeilen = Zeilen { rest: &text };
          let erste = zeilen.naechste();
          let zweite = zeilen.naechste();
          println!("{erste:?} {zweite:?}");
          while let Some(zeile) = zeilen.naechste() {
              println!("[{zeile}]");
          }
      }
    expected: |
      Some("host=db01") Some("port=5432")
      []
      [user=app]
    hints:
      - "`split_once('\\n')` teilt am ersten Zeilenumbruch. Was bleibt nach „port=5432“ übrig?"
      - Die Leerzeile ist eine eigene, leere Zeile.
    explanation: |
      Jeder Aufruf schneidet die nächste Zeile vorne ab und merkt sich den Rest – alles als Slices in `text`, ohne eine Kopie. Nach „port=5432“ ist der Rest `"\nuser=app"`; `split_once` liefert die leere Zeile `""` und den Rest `"user=app"`. Der letzte Aufruf findet keinen Umbruch mehr und gibt den ganzen Rest zurück. Dass `erste` und `zweite` gleichzeitig existieren dürfen, liegt an `-> Option<&'a str>`: Die Ergebnisse leihen von `text`, nicht von der `&mut`-Leihe auf `zeilen`.
    resources:
      - title: std · str::split_once
        url: https://doc.rust-lang.org/std/primitive.str.html#method.split_once
      - title: The Rust Book · Lifetime Annotations in Method Definitions
        url: https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-method-definitions

  - id: nll-ausgabe
    type: output
    title: Kompiliert das überhaupt?
    prompt: |
      Das Programm leiht aus `log`, ändert `log` und leiht erneut. Es kompiliert. Was gibt es aus?
    lang: rust
    code: |
      fn laengste<'a>(a: &'a str, b: &'a str) -> &'a str {
          if a.len() >= b.len() { a } else { b }
      }

      fn main() {
          let mut log = vec![String::from("start")];
          let erster = &log[0];
          println!("{erster}");
          log.push(String::from("neustart"));
          let l = laengste(&log[0], &log[1]);
          println!("{l}");
          let fest = laengste("ab", "cd");
          println!("{fest} {}", log.len());
      }
    expected: |
      start
      neustart
      ab 2
    hints:
      - Wo wird `erster` zum letzten Mal benutzt?
      - Bei gleicher Länge gewinnt laut Bedingung `>=` das erste Argument.
    explanation: |
      Die Leihe `erster` endet mit ihrer letzten Benutzung im ersten `println!` (Non-Lexical Lifetimes), deshalb ist das `push` danach erlaubt. `laengste(&log[0], &log[1])` vergleicht „start“ (5) mit „neustart“ (8). Bei „ab“ und „cd“ sind beide gleich lang, `>=` wählt das erste Argument. Die beiden Literale sind `&'static str`; `'a` wird hier zu einem beliebigen Bereich, in dem beide gültig sind.
    resources:
      - title: The Rust Book · Mutable References (Scope von Leihen)
        url: https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#mutable-references

  - id: signaturen-annotieren
    type: gap
    title: Signaturen richtig annotieren
    prompt: |
      Ergänze die Lifetimes so, dass alles kompiliert und die Signaturen so präzise wie möglich sind. `wert_oder_standard` gibt entweder einen Wert aus der Map oder das Literal `"-"` zurück; der Schlüssel wird nur zum Nachschlagen gebraucht.
    lang: rust
    code: |
      use std::collections::HashMap;

      fn laengste⟦<'a>⟧(a: ⟦&'a str⟧, b: &'a str) -> &'a str {
          if a.len() >= b.len() { a } else { b }
      }

      fn wert_oder_standard<'a>(config: ⟦&'a HashMap<String, String>⟧, schluessel: ⟦&str⟧) -> ⟦&'a str⟧ {
          match config.get(schluessel) {
              Some(wert) => wert,
              None => "-",
          }
      }

      fn main() {
          let mut config = HashMap::new();
          config.insert(String::from("host"), String::from("db01"));
          let host;
          {
              let schluessel = String::from("host");
              host = wert_oder_standard(&config, &schluessel);
          }
          println!("{host} {}", laengste("ab", "abc"));
      }
    gaps:
      - label: Lifetime-Parameter deklarieren
        hint: Lifetime-Parameter stehen wie Typparameter in spitzen Klammern hinter dem Funktionsnamen.
      - label: Typ von a
        hint: Wie `b`.
      - label: Typ von config
        hint: Das Ergebnis leiht aus der Map.
      - label: Typ von schluessel
        hint: Das Ergebnis leiht nicht vom Schlüssel. Braucht er dann eine benannte Lifetime?
        accept: ["&'_ str", "&'b str"]
      - label: Rückgabetyp
        hint: So lange gültig wie die Map.
    explanation: |
      Bei `laengste` kann das Ergebnis von beiden Parametern stammen, also tragen beide `'a`. Bei `wert_oder_standard` leiht das Ergebnis aus der Map (`&'a HashMap`) – oder ist das Literal `"-"`, das als `&'static str` in jeden kürzeren Bereich passt. Der Schlüssel bekommt **keine** `'a`: Dadurch darf `schluessel` in `main` vor `host` sterben. Mit `schluessel: &'a str` würde `main` mit E0597 scheitern. `&'b str` mit einem eigenen Parameter `'b` wäre ebenfalls korrekt, müsste dann aber in `<'a, 'b>` deklariert werden.
    resources:
      - title: The Rust Book · Thinking in Terms of Lifetimes
        url: https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#relationships
      - title: Rust by Example · Functions mit Lifetimes
        url: https://doc.rust-lang.org/rust-by-example/scope/lifetime/fn.html

  - id: struct-mit-lifetime
    type: gap
    title: Ein Struct, das in den Text zeigt
    prompt: |
      `Anfrage` soll auf Teile der Anfragezeile zeigen, ohne sie zu kopieren. `pfad()` soll ein Ergebnis liefern, das auch nach dem Ende der `Anfrage` gültig bleibt, solange die Zeile lebt. Ergänze die Lifetimes.
    lang: rust
    code: |
      struct Anfrage⟦<'a>⟧ {
          methode: &'a str,
          pfad: &'a str,
      }

      impl⟦<'a>⟧ Anfrage<'a> {
          fn parse(zeile: &'a str) -> Option<Anfrage<'a>> {
              let mut teile = zeile.split_whitespace();
              Some(Anfrage { methode: teile.next()?, pfad: teile.next()? })
          }

          fn pfad(&self) -> ⟦&'a str⟧ {
              self.pfad
          }
      }

      fn main() {
          let zeile = String::from("POST /api/login HTTP/1.1");
          let pfad;
          {
              let anfrage = Anfrage::parse(&zeile).unwrap();
              println!("{}", anfrage.methode);
              pfad = anfrage.pfad();
          }
          println!("{pfad}");
      }
    gaps:
      - label: Lifetime-Parameter am Struct
        hint: Das Struct hält Referenzen und braucht deshalb einen Lifetime-Parameter.
      - label: Lifetime im impl deklarieren
        hint: Wie `impl<T>` bei Generics.
      - label: Rückgabetyp von pfad
        hint: Mit `&str` würde Elisionsregel 3 die Rückgabe an `&self` binden. An wen soll sie gebunden sein?
    explanation: |
      `struct Anfrage<'a>` sagt, dass die Felder aus einem Bereich `'a` leihen und die Anfrage nicht länger leben darf als diese Daten. `impl<'a>` deklariert den Parameter für den Block. Entscheidend ist `-> &'a str`: Die Rückgabe leiht aus der Zeile, nicht aus der `Anfrage`. Mit `-> &str` würde Regel 3 sie an `&self` binden, und `main` scheiterte mit „`anfrage` does not live long enough“, weil `pfad` nach dem Block noch benutzt wird.
    resources:
      - title: The Rust Book · Lifetime Annotations in Struct Definitions
        url: https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-struct-definitions
      - title: Rust by Example · Structs mit Lifetimes
        url: https://doc.rust-lang.org/rust-by-example/scope/lifetime/struct.html

  - id: referenz-auf-lokales
    type: bug
    title: Normalisieren schlägt fehl
    prompt: |
      `normalisiere` soll einen Nutzernamen ohne Leerraum und in Kleinbuchstaben liefern. Der Compiler meldet:

      ```text
      error[E0515]: cannot return reference to local variable `klein`
      ```

      Finde die beiden Zeilen, die geändert werden müssen, und korrigiere sie. Eine Lifetime-Annotation hilft hier nicht.
    lang: rust
    code: |
      fn normalisiere(name: &str) -> &str {
          let klein = name.trim().to_lowercase();
          &klein
      }

      fn main() {
          let eingabe = String::from("  Steven ");
          let n = normalisiere(&eingabe);
          println!("[{n}]");
      }
    lines: [1, 3]
    fix:
      - line: 1
        answers: ["fn normalisiere(name: &str) -> String {"]
      - line: 3
        answers: ["klein"]
    hints:
      - "`to_lowercase()` erzeugt einen neuen `String`. Wem gehört er, und wann wird er freigegeben?"
      - Wenn eine Funktion neue Daten erzeugt, gibt sie sie per Wert zurück.
    explanation: |
      `klein` ist ein neuer `String`, der der Funktion gehört und an ihrem Ende freigegeben wird. Eine Referenz darauf wäre danach ungültig, und keine Annotation kann das ändern – Lifetimes beschreiben nur, sie verlängern nichts. Die Funktion muss den Besitz übergeben: Rückgabetyp `String`, Rückgabewert `klein`. Das kostet keine Kopie, denn der `String` wird nur verschoben. Faustregel: Gibt eine Funktion etwas zurück, das sie selbst erzeugt, ist der Rückgabetyp ein besitzender Typ.
    resources:
      - title: Error-Index · E0515
        url: https://doc.rust-lang.org/error_codes/E0515.html
      - title: The Rust Book · Dangling References
        url: https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html#dangling-references

  - id: falsche-beziehung
    type: bug
    title: Zwei Lifetimes, eine zu viel
    prompt: |
      Jemand wollte `laengste` „flexibler“ machen und hat zwei Lifetimes eingeführt. Der Compiler meldet:

      ```text
      error: lifetime may not live long enough
        |
      1 | fn laengste<'a, 'b>(a: &'a str, b: &'b str) -> &'a str {
        |             --  -- lifetime `'b` defined here
        |             |
        |             lifetime `'a` defined here
      2 |     if a.len() >= b.len() { a } else { b }
        |                                        ^ function was supposed to return data
        |                                          with lifetime `'a` but it is returning
        |                                          data with lifetime `'b`
      ```

      Korrigiere die Signatur so, dass sie beschreibt, was der Rumpf tut.
    lang: rust
    code: |
      fn laengste<'a, 'b>(a: &'a str, b: &'b str) -> &'a str {
          if a.len() >= b.len() { a } else { b }
      }

      fn main() {
          let x = String::from("kurz");
          let y = String::from("etwas länger");
          println!("{}", laengste(&x, &y));
      }
    lines: [1]
    fix:
      - line: 1
        answers:
          - "fn laengste<'a>(a: &'a str, b: &'a str) -> &'a str {"
          - "fn laengste<'a, 'b: 'a>(a: &'a str, b: &'b str) -> &'a str {"
    hints:
      - Die Meldung zeigt auf `b` im Rumpf. Behauptet die Signatur, dass das Ergebnis von `b` stammen kann?
    explanation: |
      Die Signatur verspricht: Das Ergebnis leiht nur von `a`. Der Rumpf gibt aber manchmal `b` zurück, das nur für `'b` gültig ist. Weil `'a` und `'b` nichts miteinander zu tun haben, kann der Compiler nicht garantieren, dass `b` lange genug lebt. Die ehrliche Signatur gibt beiden dieselbe Lifetime `'a`. Der Vorschlag des Compilers, `'b: 'a` („`'b` lebt mindestens so lange wie `'a`“), ist gleichwertig, aber schwerer zu lesen. Die Meldung „lifetime may not live long enough“ bedeutet fast immer: Signatur und Rumpf widersprechen sich.
    resources:
      - title: The Rust Book · Lifetime Annotations in Function Signatures
        url: https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#in-function-signatures

  - id: erstes-feld-erklaeren
    type: explain
    title: Warum darf trenner früher sterben?
    prompt: |
      Erkläre, warum dieses Programm kompiliert, obwohl `trenner` vor der Ausgabe von `id` freigegeben wird. Was würde sich ändern, wenn `trenner` ebenfalls den Typ `&'a str` hätte? Und warum könnte `erstes_feld` mit dieser Signatur nicht `trenner` zurückgeben?
    lang: rust
    code: |
      fn erstes_feld<'a>(zeile: &'a str, trenner: &str) -> &'a str {
          zeile.split(trenner).next().unwrap_or(zeile)
      }

      fn main() {
          let zeile = String::from("4711;Steven;Köln");
          let id;
          {
              let trenner = String::from(";");
              id = erstes_feld(&zeile, &trenner);
          }
          println!("{id}");
      }
    points:
      - Die Signatur bindet nur `zeile` und das Ergebnis an `'a`; `trenner` hat eine eigene, davon unabhängige Lifetime.
      - Deshalb muss beim Aufruf nur `zeile` so lange leben wie `id` – das ist erfüllt.
      - Mit `trenner &'a str` wäre `'a` auf den inneren Block beschränkt, und `main` scheiterte mit E0597.
      - Der Compiler prüft den Rumpf gegen die Signatur; `trenner` zurückzugeben widerspräche dem Vertrag und wäre ein Compile-Fehler.
    explanation: |
      Die Signatur erzählt dem Aufrufer: „Das Ergebnis leiht von `zeile`, nicht von `trenner`.“ `trenner` bekommt durch Elision eine eigene, anonyme Lifetime, die mit `'a` nichts zu tun hat. In `main` lebt `zeile` bis zum Ende, also darf `id` bis zum `println!` benutzt werden, obwohl `trenner` vorher freigegeben wird. Hätte `trenner` ebenfalls `&'a str`, müsste `'a` in den Bereich passen, in dem beide Argumente leben – also in den inneren Block – und die Benutzung von `id` danach wäre E0597. Umgekehrt schützt die Signatur auch die Implementierung: Würde der Rumpf `trenner` zurückgeben, lehnte der Compiler das ab, weil `trenner` nicht für `'a` garantiert ist. Präzise Signaturen machen Funktionen für Aufrufer flexibler.
    resources:
      - title: The Rust Book · Thinking in Terms of Lifetimes
        url: https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#relationships
      - title: Error-Index · E0597
        url: https://doc.rust-lang.org/error_codes/E0597.html

  - id: log-parser-zero-copy
    type: practice
    title: Ein Log-Parser ohne Kopien
    prompt: |
      Schreibe einen Parser für Logzeilen im Format `ZEIT LEVEL TEXT`, zum Beispiel `10:00:02 ERROR db timeout`. Kein Feld darf kopiert werden – alle Felder sind Slices in den Eingabetext.

      - `struct LogEintrag<'a>` mit den Feldern `zeit`, `level`, `text` (alle `&'a str`).
      - `LogEintrag::parse(zeile: &'a str) -> Option<LogEintrag<'a>>`: `None`, wenn die Zeile keine drei Teile hat.
      - `fn fehler(log: &str) -> Vec<LogEintrag<'_>>`: alle gültigen Einträge mit Level `ERROR`.
      - `fn haeufigster_text<'a>(eintraege: &[LogEintrag<'a>]) -> Option<&'a str>`: der häufigste Text; bei Gleichstand der alphabetisch kleinste. Das Ergebnis muss die Liste überleben dürfen (siehe Test `haeufigster_text_ueberlebt_die_liste`).
    lang: rust
    starter: |
      use std::collections::HashMap;

      #[derive(Debug, PartialEq)]
      struct LogEintrag /* Lifetime? */ {
          // zeit, level, text
      }

      // impl mit parse

      // fn fehler(log: &str) -> Vec<LogEintrag<'_>>

      // fn haeufigster_text<'a>(eintraege: &[LogEintrag<'a>]) -> Option<&'a str>

      fn main() {
          let log = String::from(
              "10:00:01 INFO start\n10:00:02 ERROR db timeout\nkaputt\n10:00:05 ERROR disk full\n10:00:09 ERROR db timeout",
          );
          let text;
          {
              let fehlerliste = fehler(&log);
              println!("{} Fehler", fehlerliste.len());
              text = haeufigster_text(&fehlerliste);
          }
          println!("{text:?}");
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn parst_gueltige_zeile() {
              let e = LogEintrag::parse("10:00:02 ERROR db timeout").unwrap();
              assert_eq!(e, LogEintrag { zeit: "10:00:02", level: "ERROR", text: "db timeout" });
          }

          #[test]
          fn verwirft_kaputte_zeile() {
              assert_eq!(LogEintrag::parse("kaputt"), None);
          }

          #[test]
          fn filtert_nur_fehler() {
              let log = "1 INFO a\n2 ERROR b\n3 WARN c\n4 ERROR d";
              let texte: Vec<&str> = fehler(log).iter().map(|e| e.text).collect();
              assert_eq!(texte, vec!["b", "d"]);
          }

          #[test]
          fn haeufigster_text_ueberlebt_die_liste() {
              let log = String::from("1 ERROR x\n2 ERROR y\n3 ERROR y");
              let text;
              {
                  let liste = fehler(&log);
                  text = haeufigster_text(&liste);
              }
              assert_eq!(text, Some("y"));
          }

          #[test]
          fn leere_liste() {
              assert_eq!(haeufigster_text(&[]), None);
          }
      }
    solution: |
      use std::collections::HashMap;

      #[derive(Debug, PartialEq)]
      struct LogEintrag<'a> {
          zeit: &'a str,
          level: &'a str,
          text: &'a str,
      }

      impl<'a> LogEintrag<'a> {
          fn parse(zeile: &'a str) -> Option<LogEintrag<'a>> {
              let (zeit, rest) = zeile.split_once(' ')?;
              let (level, text) = rest.split_once(' ')?;
              if zeit.is_empty() || level.is_empty() {
                  return None;
              }
              Some(LogEintrag { zeit, level, text: text.trim() })
          }
      }

      fn fehler(log: &str) -> Vec<LogEintrag<'_>> {
          let mut ergebnis = Vec::new();
          for zeile in log.lines() {
              if let Some(eintrag) = LogEintrag::parse(zeile) {
                  if eintrag.level == "ERROR" {
                      ergebnis.push(eintrag);
                  }
              }
          }
          ergebnis
      }

      fn haeufigster_text<'a>(eintraege: &[LogEintrag<'a>]) -> Option<&'a str> {
          let mut zaehler: HashMap<&'a str, usize> = HashMap::new();
          for e in eintraege {
              *zaehler.entry(e.text).or_insert(0) += 1;
          }
          let mut bester: Option<(&'a str, usize)> = None;
          for (text, n) in zaehler {
              let besser = match bester {
                  None => true,
                  Some((b_text, b_n)) => n > b_n || (n == b_n && text < b_text),
              };
              if besser {
                  bester = Some((text, n));
              }
          }
          bester.map(|(text, _)| text)
      }

      fn main() {
          let log = String::from(
              "10:00:01 INFO start\n10:00:02 ERROR db timeout\nkaputt\n10:00:05 ERROR disk full\n10:00:09 ERROR db timeout",
          );
          let text;
          {
              let fehlerliste = fehler(&log);
              println!("{} Fehler", fehlerliste.len());
              text = haeufigster_text(&fehlerliste);
          } // fehlerliste ist weg, text leiht aber von log
          println!("{text:?}");
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn parst_gueltige_zeile() {
              let e = LogEintrag::parse("10:00:02 ERROR db timeout").unwrap();
              assert_eq!(e, LogEintrag { zeit: "10:00:02", level: "ERROR", text: "db timeout" });
          }

          #[test]
          fn verwirft_kaputte_zeile() {
              assert_eq!(LogEintrag::parse("kaputt"), None);
          }

          #[test]
          fn filtert_nur_fehler() {
              let log = "1 INFO a\n2 ERROR b\n3 WARN c\n4 ERROR d";
              let texte: Vec<&str> = fehler(log).iter().map(|e| e.text).collect();
              assert_eq!(texte, vec!["b", "d"]);
          }

          #[test]
          fn haeufigster_text_ueberlebt_die_liste() {
              let log = String::from("1 ERROR x\n2 ERROR y\n3 ERROR y");
              let text;
              {
                  let liste = fehler(&log);
                  text = haeufigster_text(&liste);
              }
              assert_eq!(text, Some("y"));
          }

          #[test]
          fn leere_liste() {
              assert_eq!(haeufigster_text(&[]), None);
          }
      }
    checklist:
      - "`LogEintrag` hat einen Lifetime-Parameter, und kein Feld ist ein `String`."
      - "`parse` nutzt `split_once` oder `splitn` und gibt bei kaputten Zeilen `None` zurück, ohne zu paniken."
      - "`fehler` kommt mit `'_` aus, weil Elisionsregel 2 greift (genau eine Eingabe-Lifetime)."
      - "`haeufigster_text` gibt `Option<&'a str>` zurück – gebunden an die Log-Daten, nicht an den Slice `eintraege`."
      - Der Gleichstand wird deterministisch aufgelöst, unabhängig von der Reihenfolge der `HashMap`.
      - Alle fünf Tests laufen grün.
    hints:
      - "`haeufigster_text(eintraege: &[LogEintrag<'a>])` hat zwei Lifetimes in der Eingabe: die des Slices und `'a`. Deshalb greift Regel 2 nicht, und du musst die Rückgabe selbst annotieren."
      - "Die `HashMap` kann `&'a str` als Schlüssel halten – ebenfalls ohne Kopie."
    explanation: |
      Der Kern ist die Signatur von `haeufigster_text`. Sie hat zwei Eingabe-Lifetimes: die des Slices (`&[…]`, anonym) und `'a` in den Einträgen. Elision kann nicht entscheiden, also schreibst du `-> Option<&'a str>` – das Ergebnis leiht aus dem Logtext, nicht aus der Liste. Deshalb darf `text` in `main` und im Test die Liste überleben. Bei `fehler` gibt es nur eine Eingabe-Lifetime, `'_` genügt. Weil alle Felder Slices sind, alloziert der Parser pro Zeile nichts außer dem Platz im `Vec` – der Grund, warum Parser in Rust oft so gebaut werden.
    resources:
      - title: The Rust Book · Lifetime Elision
        url: https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html#lifetime-elision
      - title: Rust by Example · Methods mit Lifetimes
        url: https://doc.rust-lang.org/rust-by-example/scope/lifetime/methods.html
