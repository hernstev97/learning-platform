id: collections-strings
title: Collections & Strings
level: 2
minutes: 150
summary: Vec, String, HashMap und ihre Verwandten – wie sie im Speicher aussehen, warum Strings keine Indizes haben und welche Collection zu welchem Problem passt.
goals:
  - Du erklärst, was bei `push` auf einen vollen `Vec` im Speicher passiert und warum das Referenzen ungültig machen würde.
  - Du wählst bewusst zwischen `v[i]` und `v.get(i)` und zwischen Iteration per Wert, per `&` und per `&mut`.
  - Du begründest, warum `String` keinen Indexzugriff hat, und schneidest Strings, ohne an Zeichengrenzen zu paniken.
  - Du zählst und gruppierst Daten mit der Entry-API von `HashMap` und kennst die Folgen der zufälligen Iterationsreihenfolge.
  - Du wählst für ein gegebenes Problem zwischen `Vec`, `VecDeque`, `HashMap`, `BTreeMap` und `HashSet` und begründest die Wahl.
