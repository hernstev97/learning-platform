id: module-cargo
title: Module, Crates & Cargo
level: 2
minutes: 150
summary: Wie du Rust-Projekte in Packages, Crates und Module gliederst, Sichtbarkeit bewusst steuerst und mit Cargo Abhängigkeiten, Versionen, Workspaces und Werkzeuge im Griff behältst.
goals:
  - Du unterscheidest Package, Crate und Modul und erklärst, wie der Modulbaum aus `mod`-Deklarationen entsteht.
  - Du steuerst Sichtbarkeit mit `pub`, `pub(crate)` und `pub(super)` und schützt Invarianten mit privaten Feldern.
  - Du schreibst Pfade mit `crate::`, `super::` und `self::` und gestaltest mit `pub use` eine öffentliche API.
  - Du teilst ein Programm in `lib.rs` und eine dünne `main.rs` auf und vermeidest doppelt deklarierte Module.
  - Du liest und schreibst `Cargo.toml` (Abhängigkeiten, Features, Profile) und entscheidest, wann `Cargo.lock` ins Repository gehört.
  - Du setzt `cargo fmt`, `cargo clippy`, Doc-Kommentare und Workspaces so ein, wie es in professionellen Projekten üblich ist.
