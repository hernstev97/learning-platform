lesson: |
  Solange ein Programm in eine `main.rs` passt, braucht es keine Struktur. Das ändert sich schnell: Dein Log-Analyse-Werkzeug bekommt einen Parser, eine Statistik, eine Ausgabe als Tabelle und als JSON, dazu Tests. Nach ein paar Wochen hat `main.rs` 1 500 Zeilen, jede Funktion sieht jede andere, und eine Kollegin möchte deinen Parser in ihrem Webdienst wiederverwenden – ohne deine Kommandozeilenlogik.

  Rust gibt dir dafür Werkzeuge auf drei Ebenen: **Module** gliedern Code innerhalb eines Crates und ziehen Sichtbarkeitsgrenzen, **Crates** sind die Einheiten, die der Compiler übersetzt, und **Packages** bündeln Crates samt Abhängigkeiten in einer `Cargo.toml`. Wer diese Ebenen auseinanderhält, versteht die meisten Fehlermeldungen rund um `mod`, `use` und `pub` – und genau diese Fehler kosten beim Umstieg auf Rust viel Zeit.

  ## Package, Crate, Modul: drei Ebenen

  Ein **Crate** ist die kleinste Einheit, die `rustc` auf einmal übersetzt. Jedes Crate hat eine **Crate-Wurzel** (crate root): die Datei, bei der der Compiler anfängt. Ein **Binary Crate** hat eine `fn main` und wird zu einem ausführbaren Programm. Ein **Library Crate** hat keine `main` und stellt Typen und Funktionen für andere Crates bereit.

  Ein **Package** ist ein Verzeichnis mit einer `Cargo.toml`. Es enthält höchstens ein Library Crate und beliebig viele Binary Crates ([Rust Book, Kap. 7.1](https://doc.rust-lang.org/book/ch07-01-packages-and-crates.html)). Die Crate-Wurzeln findet Cargo über Konventionen:

  ```text
  logscan/
  ├── Cargo.toml
  ├── Cargo.lock
  └── src/
      ├── lib.rs          # Wurzel des Library Crates "logscan"
      ├── main.rs         # Wurzel des Binary Crates "logscan"
      └── bin/
          └── export.rs   # weiteres Binary Crate "export"
  ```

  Zusätzlich erkennt Cargo die Verzeichnisse `tests/`, `examples/` und `benches/`; jede Datei dort ist ein eigenes Crate ([Cargo Book: Target auto-discovery](https://doc.rust-lang.org/cargo/reference/cargo-targets.html#target-auto-discovery)).

  **Module** gliedern den Code *innerhalb* eines Crates. Sie bilden einen Baum, dessen Wurzel das Modul `crate` ist – der Inhalt der Crate-Wurzel.

  > [!MERKE]
  > Package = `Cargo.toml` + Crates. Crate = Übersetzungseinheit mit genau einer Wurzeldatei. Modul = Namensraum und Sichtbarkeitsgrenze innerhalb eines Crates.

  ## Der Modulbaum entsteht durch `mod`, nicht durch Dateien

  Aus TypeScript kennst du: Jede Datei ist ein Modul, und `import` verweist auf einen Dateipfad. In Rust ist es umgekehrt. Der Compiler liest **nur** die Crate-Wurzel. Jede weitere Datei wird erst Teil des Crates, wenn ihr Elternmodul sie mit `mod name;` deklariert. Eine Datei, die niemand deklariert, existiert für den Compiler nicht – auch wenn sie im Ordner liegt.

  ```rust nocheck
  // src/main.rs
  mod config; // lädt src/config.rs als Modul crate::config
  mod netz;   // lädt src/netz.rs als Modul crate::netz

  fn main() {
      let cfg = config::laden();
      netz::http::abrufen(&cfg.url);
  }
  ```

  ```rust
  // src/netz.rs
  pub mod http; // lädt src/netz/http.rs als Modul crate::netz::http
  ```

  Die zugehörige Dateistruktur:

  ```text
  src/
  ├── main.rs        # crate
  ├── config.rs      # crate::config
  ├── netz.rs        # crate::netz
  └── netz/
      └── http.rs    # crate::netz::http
  ```

  Für ein Modul `netz` sucht der Compiler `src/netz.rs` oder – im älteren Stil – `src/netz/mod.rs` ([Reference: Module source filenames](https://doc.rust-lang.org/reference/items/modules.html#module-source-filenames)). Beide Stile funktionieren. Beide gleichzeitig für dasselbe Modul ergeben `error[E0761]: file for module netz found at both …`. Das Rust Book empfiehlt den neueren Stil, weil sonst im Editor viele Tabs namens `mod.rs` offen sind ([Kap. 7.5](https://doc.rust-lang.org/book/ch07-05-separating-modules-into-different-files.html#alternate-file-paths)).

  Module können auch inline stehen. Das siehst du vor allem bei Unit-Tests:

  ```rust
  pub fn fehler_zaehlen(log: &str) -> usize {
      log.lines().filter(|zeile| zeile.starts_with("ERROR")).count()
  }

  #[cfg(test)]
  mod tests {
      use super::*;

      #[test]
      fn zaehlt_nur_fehler() {
          assert_eq!(fehler_zaehlen("INFO start\nERROR db\nERROR netz"), 2);
      }
  }
  ```

  `mod tests { … }` ist ein gewöhnliches Modul ohne eigene Datei. `#[cfg(test)]` sorgt dafür, dass es nur bei `cargo test` übersetzt wird.

  ## Sichtbarkeit: privat ist der Standard

  In Rust ist zunächst alles **privat**: Funktionen, Structs, Felder, Module, Konstanten. Die Regel dahinter ist kurz ([Reference: Visibility and privacy](https://doc.rust-lang.org/reference/visibility-and-privacy.html)):

  - Ein privates Element ist im eigenen Modul **und in allen Nachfahren** sichtbar.
  - Ein `pub`-Element ist überall sichtbar, wo auch sein Elternmodul erreichbar ist.

  Ein Kindmodul sieht also die privaten Elemente seiner Vorfahren, aber nicht umgekehrt. Deshalb kann `mod tests` private Funktionen testen, während `main` nicht in die Interna von `config` greifen kann. Zwischen „privat“ und „überall“ gibt es Abstufungen ([`pub(in path)`, `pub(crate)`, `pub(super)`](https://doc.rust-lang.org/reference/visibility-and-privacy.html#pubin-path-pubcrate-pubsuper-and-pubself)):

  | Sichtbarkeit | Sichtbar in |
  | --- | --- |
  | (nichts) | aktuelles Modul und seine Nachfahren |
  | `pub(super)` | Elternmodul und dessen Nachfahren |
  | `pub(in crate::netz)` | das angegebene Vorfahrenmodul |
  | `pub(crate)` | das ganze Crate, aber nicht außerhalb |
  | `pub` | überall, auch in anderen Crates |

  Bei Structs gilt die Sichtbarkeit **pro Feld**. Ein `pub struct` mit privaten Feldern kann außerhalb seines Moduls niemand per Struct-Literal bauen – nur über Funktionen, die das Modul anbietet. Genau darum geht es: Das Modul entscheidet, welche Werte entstehen können.

  ```rust
  mod bank {
      pub struct Konto {
          pub inhaber: String,
          saldo_cent: i64, // privat: nur `bank` darf es ändern
      }

      impl Konto {
          pub fn eroeffnen(inhaber: &str) -> Self {
              Self { inhaber: inhaber.to_string(), saldo_cent: 0 }
          }

          pub fn einzahlen(&mut self, cent: i64) -> Result<(), String> {
              if cent <= 0 {
                  return Err(format!("ungültiger Betrag: {cent}"));
              }
              self.saldo_cent += cent;
              Ok(())
          }

          pub fn saldo_cent(&self) -> i64 {
              self.saldo_cent
          }
      }
  }

  fn main() {
      let mut konto = bank::Konto::eroeffnen("Steven");
      konto.einzahlen(2_500).unwrap();
      println!("{}: {} Cent", konto.inhaber, konto.saldo_cent());
      // konto.saldo_cent = -100; // error[E0616]: field `saldo_cent` of struct `Konto` is private
  }
  ```

  Die Invariante „der Saldo entsteht nur durch gültige Einzahlungen“ kann außerhalb von `bank` niemand brechen. Bei Enums ist es anders: Ist das Enum `pub`, sind alle Varianten öffentlich ([Rust Book, Kap. 7.3](https://doc.rust-lang.org/book/ch07-03-paths-for-referring-to-an-item-in-the-module-tree.html#making-structs-and-enums-public)).

  > [!INTERVIEW] „Warum sind Felder in Rust standardmäßig privat?“
  > Sichtbarkeit ist die Grenze, an der Invarianten geschützt werden. Private Felder zwingen Aufrufer durch Konstruktoren und Methoden, die prüfen können. Außerdem darfst du alles Private jederzeit umbauen, ohne Nutzer deines Crates zu brechen: Nur die `pub`-Oberfläche ist deine API und fällt unter SemVer.

  ## Pfade, `use` und Re-Exports

  Jedes Element hat einen Pfad im Modulbaum. Absolute Pfade beginnen mit `crate::` (eigenes Crate) oder mit dem Namen eines externen Crates (`std::`, `serde::`). Relative Pfade beginnen mit `self::` (aktuelles Modul), `super::` (Elternmodul) oder direkt mit einem Namen, der im aktuellen Modul bekannt ist ([Reference: Path qualifiers](https://doc.rust-lang.org/reference/paths.html#path-qualifiers)).

  `use` erzeugt eine Abkürzung: einen lokalen Namen für einen Pfad. Diese Abkürzung gilt **nur in dem Modul, in dem das `use` steht**. Ein `use std::collections::HashMap;` oben in `main.rs` hilft einem Inline-Modul `mod statistik { … }` darunter nicht; dort brauchst du ein eigenes `use` oder `use super::*;` wie in Tests. `use` lädt auch keine Dateien – das tut nur `mod`.

  Die üblichen Konventionen ([Rust Book, Kap. 7.4](https://doc.rust-lang.org/book/ch07-04-bringing-paths-into-scope-with-the-use-keyword.html#creating-idiomatic-use-paths)):

  ```rust
  use std::collections::HashMap;     // Structs, Enums: bis zum Typnamen importieren
  use std::fmt;                      // Funktionen und Traits oft über das Modul: fmt::Display
  use std::io::{self, BufRead};      // verschachtelt: io selbst und io::BufRead
  use std::fmt::Result as FmtResult; // umbenennen bei Namenskonflikten
  ```

  `pub use` importiert einen Namen **und** macht ihn unter dem neuen Pfad öffentlich (Re-Export). Damit trennst du die interne Dateistruktur von der öffentlichen API:

  ```rust
  // src/lib.rs
  mod parser;    // privat: Nutzer sehen die interne Aufteilung nicht
  mod statistik;

  pub use parser::{LogEintrag, parse_zeile};
  pub use statistik::Zusammenfassung;
  ```

  Nutzer schreiben `logscan::parse_zeile`, nicht `logscan::parser::zeile::parse_zeile`. Du kannst `parser` später in drei Dateien aufteilen, ohne dass sich für sie etwas ändert ([Rust Book, Kap. 14.2](https://doc.rust-lang.org/book/ch14-02-publishing-to-crates-io.html#exporting-a-convenient-public-api)). Die Standardbibliothek arbeitet genauso.

  ## `lib.rs` und `main.rs` in einem Package

  Die übliche Struktur für Werkzeuge: fast die ganze Logik in `lib.rs`, dazu eine dünne `main.rs`, die Argumente liest, die Bibliothek aufruft und Fehler in Exit-Codes übersetzt.

  ```rust nocheck
  // src/main.rs
  use std::process::ExitCode;

  fn main() -> ExitCode {
      let pfad = std::env::args().nth(1).unwrap_or_else(|| "app.log".into());
      match logscan::analysiere_datei(&pfad) {
          Ok(zusammenfassung) => {
              println!("{zusammenfassung}");
              ExitCode::SUCCESS
          }
          Err(e) => {
              eprintln!("Fehler: {e}");
              ExitCode::FAILURE
          }
      }
  }
  ```

  Warum lohnt sich das?

  - `main.rs` und `lib.rs` sind **zwei verschiedene Crates**. `main.rs` nutzt die Bibliothek über den Package-Namen (`logscan::…`; Bindestriche werden zu Unterstrichen) und sieht nur deren `pub`-API – wie ein fremdes Projekt. Du bist damit selbst der erste Nutzer deiner API ([Rust Book, Kap. 7.3](https://doc.rust-lang.org/book/ch07-03-paths-for-referring-to-an-item-in-the-module-tree.html#best-practices-for-packages-with-a-binary-and-a-library)).
  - Integrationstests in `tests/` können nur Library Crates importieren. Logik, die in `main.rs` steckt, ist dort nicht testbar ([Kap. 11.3](https://doc.rust-lang.org/book/ch11-03-test-organization.html#integration-tests-for-binary-crates)).
  - Ein zweites Frontend, etwa ein Webdienst, nutzt dieselbe Bibliothek.

  > [!WARNING] Zwei Fallen beim Aufteilen
  > In `main.rs` bedeutet `crate::` das **Binary Crate**, nicht die Bibliothek: `crate::parse_zeile` scheitert mit ``error[E0425]: cannot find function `parse_zeile` in the crate root``. Und deklariere ein Modul der Bibliothek nie zusätzlich mit `mod parser;` in `main.rs`. Dann wird die Datei zweimal übersetzt, und `logscan::parser::LogEintrag` und `crate::parser::LogEintrag` sind zwei verschiedene, inkompatible Typen.

  ## `Cargo.toml`: Abhängigkeiten, Features, Profile

  ```toml
  [package]
  name = "logscan"
  version = "0.3.1"
  edition = "2024"

  [dependencies]
  regex = "1.11"
  serde = { version = "1.0", features = ["derive"] }
  serde_json = { version = "1.0", optional = true }

  [dev-dependencies]
  tempfile = "3"

  [features]
  json = ["dep:serde_json"]

  [profile.release]
  lto = true
  codegen-units = 1
  ```

  - **`[dependencies]`** landen im fertigen Programm. `cargo add regex` trägt die aktuelle Version ein ([Cargo Book: Specifying dependencies](https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html)).
  - **`[dev-dependencies]`** gibt es nur für Tests, Beispiele und Benchmarks ([Development dependencies](https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html#development-dependencies)). Ein Testwerkzeug wie `tempfile` gehört hierher: Es landet nicht im Release-Binary, und Nutzer deiner Bibliothek müssen es nicht übersetzen.
  - **Features** schalten optionalen Code und optionale Abhängigkeiten ein. `json = ["dep:serde_json"]` heißt: Das Feature `json` aktiviert die Abhängigkeit `serde_json`. Im Code fragst du es mit `#[cfg(feature = "json")]` ab, beim Bauen aktivierst du es mit `cargo build --features json` ([Cargo Book: Features](https://doc.rust-lang.org/cargo/reference/features.html#optional-dependencies)).

  Features müssen **additiv** sein. Nutzen zwei Crates in deinem Abhängigkeitsbaum dieselbe Bibliothek mit unterschiedlichen Features, übersetzt Cargo sie nur einmal – mit der Vereinigung aller Features ([Feature unification](https://doc.rust-lang.org/cargo/reference/features.html#feature-unification)). Ein Feature, das Funktionalität *entfernt*, bricht deshalb andere Nutzer.

  **Profile** steuern, wie übersetzt wird ([Cargo Book: Default profiles](https://doc.rust-lang.org/cargo/reference/profiles.html#default-profiles)). `cargo build` nutzt `dev`: keine Optimierung, Debug-Infos, `debug-assertions` und Überlaufprüfungen an. `cargo build --release` nutzt `release`: `opt-level = 3`, Prüfungen aus. Das hat eine Folge, die du kennen musst: Ein Integer-Überlauf löst im `dev`-Profil eine Panic aus, im `release`-Profil rechnet das Programm standardmäßig mit Wrapping weiter ([Rust Book: Integer Overflow](https://doc.rust-lang.org/book/ch03-02-data-types.html#integer-overflow)). Wo Überlauf möglich ist, entscheide dich ausdrücklich für `checked_add`, `wrapping_add` oder `saturating_add`.

  ## SemVer und `Cargo.lock`

  Rust-Crates folgen [Semantic Versioning](https://semver.org/lang/de/): `MAJOR.MINOR.PATCH`. Eine Angabe wie `regex = "1.11"` ist eine **Anforderung**, keine feste Version. Sie bedeutet `>=1.11.0, <2.0.0`: Jede kompatible Version ist erlaubt. Bei `0.x`-Versionen verschiebt Cargo die Grenze: `"0.4"` bedeutet `>=0.4.0, <0.5.0`, weil vor 1.0 jede Minor-Version inkompatibel sein darf ([Cargo Book: Default requirements](https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html#default-requirements)).

  Welche Version tatsächlich gewählt wurde, steht in **`Cargo.lock`**: exakte Versionen und Prüfsummen des ganzen Abhängigkeitsbaums. Cargo schreibt sie beim ersten Build und hält sich danach daran, bis du `cargo update` ausführst (alles im Rahmen der Anforderungen aktualisieren) oder `cargo update regex` (nur ein Paket).

  Gehört `Cargo.lock` ins Git-Repository? `cargo new` versioniert sie standardmäßig. Für Programme ist die Antwort klar ja: Nur so baut die CI heute und in einem Jahr dasselbe, und `git bisect` findet echte Regressionen statt zufälliger Updates. Bei Bibliotheken wirkt die Lock-Datei nur auf deine eigenen Builds und Tests. Wer deine Bibliothek einbindet, bekommt Versionen nach deiner `Cargo.toml`, nicht nach deiner `Cargo.lock` ([Cargo FAQ](https://doc.rust-lang.org/cargo/faq.html#why-have-cargolock-in-version-control)). Viele Bibliotheken committen sie trotzdem und testen in der CI zusätzlich gegen die neuesten Versionen.

  Für deine **eigene** Versionsnummer heißt SemVer: Alles, was die `pub`-API bricht, verlangt eine neue Major-Version (bei `0.x` eine neue Minor-Version). Dazu gehört mehr, als man denkt – etwa ein neues Feld in einem Struct, dessen Felder alle `pub` sind, denn Nutzer könnten es per Struct-Literal bauen ([Cargo Book: SemVer Compatibility](https://doc.rust-lang.org/cargo/reference/semver.html#struct-add-public-field-when-no-private)).

  ## Workspaces: mehrere Packages, ein Build

  Wächst ein Projekt auf mehrere Packages – etwa Kernbibliothek, CLI und Webdienst –, fasst ein **Workspace** sie zusammen ([Rust Book, Kap. 14.3](https://doc.rust-lang.org/book/ch14-03-cargo-workspaces.html)). Alle Mitglieder teilen sich eine `Cargo.lock` und ein `target/`-Verzeichnis, also dieselben Abhängigkeitsversionen und bereits übersetzte Artefakte.

  ```toml title=Cargo.toml_(Workspace-Wurzel)
  [workspace]
  members = ["crates/*"]
  resolver = "3"

  [workspace.dependencies]
  serde = { version = "1.0", features = ["derive"] }
  ```

  ```toml title=crates/cli/Cargo.toml
  [package]
  name = "cli"
  version = "0.1.0"
  edition = "2024"

  [dependencies]
  kern = { path = "../kern" }
  serde = { workspace = true }
  ```

  Eine Wurzel-`Cargo.toml` ohne `[package]` heißt **virtueller Workspace**. Dort setzt du `resolver = "3"` selbst; sonst warnt Cargo und fällt auf den alten Resolver `"1"` zurück ([Cargo Book: Resolver versions](https://doc.rust-lang.org/cargo/reference/resolver.html#resolver-versions)). `[workspace.dependencies]` legt Versionen zentral fest, Mitglieder übernehmen sie mit `workspace = true`. Befehle wirken mit `-p` auf ein Mitglied (`cargo test -p kern`) oder mit `--workspace` auf alle.

  ## Dokumentation, Clippy und rustfmt

  Rust kennt zwei Arten von Doc-Kommentaren ([Reference: Doc comments](https://doc.rust-lang.org/reference/comments.html#doc-comments)): `///` dokumentiert das **folgende** Element, `//!` das **umschließende** – typischerweise ganz oben in `lib.rs` das Crate oder oben in einer Moduldatei das Modul.

  ```rust
  //! Auswertung von Server-Logs: Zeilen parsen, Fehler zählen, Berichte bauen.

  /// Zählt die Zeilen, die mit `ERROR` beginnen.
  ///
  /// # Examples
  ///
  /// ```
  /// let log = "INFO start\nERROR db down";
  /// assert_eq!(logscan::fehler_zaehlen(log), 1);
  /// ```
  pub fn fehler_zaehlen(log: &str) -> usize {
      log.lines().filter(|zeile| zeile.starts_with("ERROR")).count()
  }
  ```

  `cargo doc --open` erzeugt daraus HTML im Stil von docs.rs. Codeblöcke in Doc-Kommentaren sind **Doctests**: `cargo test` übersetzt und startet sie ([Rust Book, Kap. 14.2](https://doc.rust-lang.org/book/ch14-02-publishing-to-crates-io.html#documentation-comments-as-tests)). Beispiele in der Doku können so nicht unbemerkt veralten. Übliche Abschnitte sind `# Examples`, `# Errors` (wann ein `Err` zurückkommt), `# Panics` und `# Safety` für `unsafe`-Funktionen.

  Zwei Werkzeuge gehören in jedes Projekt:

  - **rustfmt** formatiert Code einheitlich. `cargo fmt` schreibt, `cargo fmt --check` prüft nur und schlägt bei Abweichungen fehl – die Variante für die CI ([rustfmt](https://github.com/rust-lang/rustfmt)).
  - **Clippy** ist ein Linter mit Hunderten Regeln gegen unidiomatischen oder fehleranfälligen Code ([Clippy: Usage](https://doc.rust-lang.org/clippy/usage.html)). `cargo clippy --all-targets -- -D warnings` prüft auch Tests und Beispiele und macht jede Warnung zum Fehler. `cargo clippy --fix` wendet sichere Vorschläge automatisch an.

  Projektweite Lint-Regeln stehen seit Rust 1.74 in der `Cargo.toml` ([Cargo Book: `[lints]`](https://doc.rust-lang.org/cargo/reference/manifest.html#the-lints-section)):

  ```toml
  [lints.rust]
  unsafe_code = "forbid"

  [lints.clippy]
  unwrap_used = "warn"
  ```

  > [!PRAXIS] So sieht die CI eines Rust-Projekts aus
  > Fast jedes professionelle Rust-Repository prüft bei jedem Pull Request dieselben Schritte: `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings` und `cargo test`. Reviewer diskutieren dann über Design statt über Einrückung. Für dein Portfolio heißt das: Ein Projekt mit genau dieser grünen CI signalisiert, dass du wie im Team arbeitest.

  Veröffentlichen auf crates.io geht mit `cargo publish` ([Cargo Book: Publishing](https://doc.rust-lang.org/cargo/reference/publishing.html)). Du brauchst ein Konto, ein API-Token (`cargo login`), einen freien Namen sowie `description` und `license` in `[package]`. `cargo publish --dry-run` baut das Paket probeweise. Eine veröffentlichte Version ist **dauerhaft**: Mit `cargo yank` sperrst du sie für neue Lock-Dateien, löschen oder überschreiben kannst du sie nicht.

  ## Häufige Fehler

  - **Datei angelegt, `mod` vergessen.** `src/config.rs` existiert, aber `config::laden()` liefert ``error[E0433]: cannot find module or crate `config` in this scope``. Lösung: `mod config;` im Elternmodul. Umgekehrt meldet `mod config;` ohne Datei `error[E0583]: file not found for module`.
  - **`use` statt `mod`.** `use` lädt keine Datei; es setzt voraus, dass das Modul schon im Baum hängt.
  - **Importe des Elternmoduls erwartet.** Jedes Modul hat seinen eigenen Namensraum; ein `use` gilt nicht für Kindmodule.
  - **Private Felder von außen setzen.** `E0451` beim Struct-Literal, `E0616` beim Feldzugriff. Das ist Absicht – nutze den Konstruktor.
  - **`pub(crate)` für Integrationstests.** Dateien in `tests/` sind eigene Crates. Für sie ist `pub(crate)` privat (`error[E0603]`).
  - **Modul in `main.rs` und `lib.rs` deklariert.** Doppelt übersetzt, zwei verschiedene Typen gleichen Namens.
  - **Abhängigkeit in der falschen Tabelle.** Ein Crate aus `[dev-dependencies]` fehlt bei `cargo build`; ein Testwerkzeug in `[dependencies]` bläht das Binary auf.

  ## Zusammenfassung

  - Package → Crates → Module. Ein Package hat höchstens ein Library Crate und beliebig viele Binary Crates.
  - Der Modulbaum entsteht durch `mod`-Deklarationen, ausgehend von der Crate-Wurzel. Dateien ohne `mod` sieht der Compiler nicht.
  - Alles ist privat, bis du es mit `pub`, `pub(crate)` oder `pub(super)` öffnest. Private Felder schützen Invarianten.
  - `use` erzeugt Abkürzungen im aktuellen Modul; `pub use` formt die öffentliche API unabhängig von der Dateistruktur.
  - Logik in `lib.rs`, dünne `main.rs`: testbar, wiederverwendbar, saubere API.
  - Versionsangaben in `Cargo.toml` sind Bereiche, `Cargo.lock` hält die exakten Versionen fest. Für Programme gehört sie ins Repository.
  - Workspaces teilen `Cargo.lock` und `target/`; im virtuellen Workspace `resolver = "3"` setzen.
  - `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings` und `cargo test` inklusive Doctests gehören in jede CI.
exercises:
  - id: package-crate-modul
    type: choice
    title: Drei Ebenen auseinanderhalten
    prompt: Welche Aussagen über Packages, Crates und Module stimmen?
    options:
      - text: Ein Package darf `src/lib.rs` und `src/main.rs` gleichzeitig enthalten; daraus entstehen zwei Crates.
        correct: true
        why: Ein Package hat höchstens ein Library Crate und beliebig viele Binary Crates. `lib.rs` und `main.rs` sind zwei getrennte Crate-Wurzeln.
      - text: Jede `.rs`-Datei unter `src/` wird automatisch Teil des Crates.
        correct: false
        why: Der Compiler liest nur die Crate-Wurzel und folgt `mod`-Deklarationen. Eine nicht deklarierte Datei wird ignoriert. (Ausnahme sind Dateien in `src/bin/`, aber die werden eigene Crates, keine Module.)
      - text: Ein Package kann mehrere Library Crates enthalten, zum Beispiel `src/lib.rs` und `src/lib2.rs`.
        correct: false
        why: Höchstens ein Library Crate pro Package. Brauchst du mehrere Bibliotheken, legst du mehrere Packages an, zum Beispiel in einem Workspace.
      - text: "`mod tests { … }` in `lib.rs` ist ein Modul innerhalb des Library Crates."
        correct: true
        why: Inline-Module sind gewöhnliche Module ohne eigene Datei. `tests` ist ein Kind der Crate-Wurzel und sieht deshalb auch deren private Elemente.
      - text: "`use crate::config;` lädt die Datei `src/config.rs`."
        correct: false
        why: "`use` erzeugt nur eine Abkürzung für einen Pfad, der schon existiert. Dateien lädt ausschließlich `mod config;`."
    explanation: |
      Package, Crate und Modul sind drei verschiedene Ebenen. Cargo arbeitet mit Packages, `rustc` übersetzt Crates, und innerhalb eines Crates bilden Module einen Baum, der ausschließlich durch `mod`-Deklarationen entsteht. Wer „Datei = Modul“ aus TypeScript mitbringt, stolpert genau an dieser Stelle.
    resources:
      - title: Rust Book · Packages and Crates
        url: https://doc.rust-lang.org/book/ch07-01-packages-and-crates.html
      - title: Rust Book · Modules Cheat Sheet
        url: https://doc.rust-lang.org/book/ch07-02-defining-modules-to-control-scope-and-privacy.html#modules-cheat-sheet
  - id: versionsbereich
    type: choice
    title: Welche Updates sind erlaubt?
    prompt: |
      In deiner `Cargo.toml` steht:

      ```toml
      [dependencies]
      regex = "1.10"
      chrono = "0.4.38"
      ```

      Inzwischen gibt es `regex 1.12.0`, `regex 2.0.0`, `chrono 0.4.40` und `chrono 0.5.0`. Welche dieser Versionen darf `cargo update` wählen?
    options:
      - text: "`regex 1.12.0`"
        correct: true
        why: "`\"1.10\"` bedeutet `>=1.10.0, <2.0.0`. 1.12.0 liegt im Bereich."
      - text: "`regex 2.0.0`"
        correct: false
        why: Ein Major-Sprung ist laut SemVer inkompatibel. Dafür musst du die Anforderung in der `Cargo.toml` selbst ändern.
      - text: "`chrono 0.4.40`"
        correct: true
        why: "`\"0.4.38\"` bedeutet `>=0.4.38, <0.5.0`. Patch-Updates innerhalb von 0.4 sind erlaubt."
      - text: "`chrono 0.5.0`"
        correct: false
        why: Vor 1.0 behandelt Cargo die Minor-Version wie eine Major-Version. 0.4 → 0.5 gilt als inkompatibel.
    explanation: |
      Versionsangaben ohne Operator sind Caret-Anforderungen: Erlaubt ist alles, was dieselbe am weitesten links stehende Stelle ungleich null hat. Bei `1.x` ist das die Major-Version, bei `0.x` die Minor-Version. `cargo update` bewegt sich nur innerhalb dieser Bereiche und schreibt das Ergebnis in `Cargo.lock`.
    resources:
      - title: Cargo Book · Default requirements
        url: https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html#default-requirements
      - title: Cargo Book · SemVer compatibility im Resolver
        url: https://doc.rust-lang.org/cargo/reference/resolver.html#semver-compatibility
  - id: profil-ueberlauf
    type: choice
    title: Gleicher Code, zwei Profile
    prompt: Was passiert, wenn du dieses Programm mit `cargo run` und mit `cargo run --release` startest?
    lang: rust
    code: |
      fn naechste_id(letzte: u8) -> u8 {
          letzte + 1
      }

      fn main() {
          println!("{}", naechste_id(255));
      }
    options:
      - text: "`cargo run` bricht mit „attempt to add with overflow“ ab, `cargo run --release` gibt `0` aus."
        correct: true
        why: Im `dev`-Profil sind Überlaufprüfungen an und lösen eine Panic aus. Im `release`-Profil sind sie standardmäßig aus, `u8` läuft von 255 auf 0 über.
      - text: Beide geben `0` aus.
        correct: false
        why: Im `dev`-Profil ist `overflow-checks = true`. Der Überlauf wird erkannt und führt zur Panic.
      - text: Beide brechen mit einer Panic ab.
        correct: false
        why: Das `release`-Profil hat `overflow-checks = false`. Wer Panics auch dort will, setzt es in `[profile.release]` auf `true`.
      - text: Der Compiler lehnt das Programm in beiden Profilen ab.
        correct: false
        why: Der Compiler erkennt nur Überläufe in Ausdrücken, deren Werte er schon beim Übersetzen kennt, etwa `255u8 + 1`. Hier kommt der Wert als Parameter herein.
    explanation: |
      Profile ändern nicht nur die Geschwindigkeit, sondern auch Verhalten: `debug-assertions` und `overflow-checks` sind im `dev`-Profil an, im `release`-Profil aus. Code, der auf Überlauf angewiesen ist, drückt das ausdrücklich aus – `wrapping_add` für gewolltes Umlaufen, `checked_add` für einen `Option`-Rückgabewert, `saturating_add` für Deckeln am Maximum.
    resources:
      - title: Cargo Book · Default profiles
        url: https://doc.rust-lang.org/cargo/reference/profiles.html#default-profiles
      - title: Rust Book · Integer Overflow
        url: https://doc.rust-lang.org/book/ch03-02-data-types.html#integer-overflow
  - id: pfade-super
    type: output
    title: Wer schreibt hier?
    prompt: Was gibt dieses Programm aus? Achte darauf, welches `schreibe` an welcher Stelle gemeint ist.
    lang: rust
    code: |
      mod log {
          pub fn schreibe(text: &str) {
              println!("[log] {text}");
          }

          pub mod http {
              pub fn schreibe(text: &str) {
                  println!("[http] {text}");
                  super::schreibe("weitergeleitet");
              }

              pub fn status() {
                  schreibe("200 OK");
              }
          }
      }

      use log::http;

      fn main() {
          http::status();
          crate::log::schreibe("fertig");
      }
    expected: |
      [http] 200 OK
      [log] weitergeleitet
      [log] fertig
    explanation: |
      Ein Name ohne Präfix wird zuerst im **aktuellen** Modul gesucht. In `status` ist das `log::http::schreibe`, nicht die gleichnamige Funktion in `log`. Diese erreicht `http` nur über `super::schreibe`. `use log::http;` macht in `main` den Namen `http` verfügbar, und `crate::log::schreibe` ist der absolute Pfad derselben Funktion, die `super::schreibe` aufruft.
    resources:
      - title: Rust Book · Starting Relative Paths with super
        url: https://doc.rust-lang.org/book/ch07-03-paths-for-referring-to-an-item-in-the-module-tree.html#starting-relative-paths-with-super
      - title: Rust by Example · super and self
        url: https://doc.rust-lang.org/rust-by-example/mod/super.html
  - id: namen-aufloesen
    type: output
    title: Zwei Konstanten gleichen Namens
    prompt: Was gibt dieses Programm aus?
    lang: rust
    code: |
      mod config {
          pub const MODUS: &str = "prod";

          pub mod test {
              pub const MODUS: &str = "test";

              pub fn aktiv() -> &'static str {
                  MODUS
              }

              pub fn standard() -> &'static str {
                  super::MODUS
              }
          }

          pub use test::aktiv as aktueller_modus;
      }

      use config::test::MODUS as TEST_MODUS;

      fn main() {
          println!("{}", config::MODUS);
          println!("{TEST_MODUS}");
          println!("{}", config::aktueller_modus());
          println!("{}", config::test::standard());
      }
    expected: |
      prod
      test
      test
      prod
    explanation: |
      Jedes Modul ist ein eigener Namensraum, deshalb kollidieren `config::MODUS` und `config::test::MODUS` nicht. `use … as TEST_MODUS` gibt der inneren Konstante in `main` einen neuen Namen. `pub use test::aktiv as aktueller_modus` ist ein Re-Export: Dieselbe Funktion ist zusätzlich unter `config::aktueller_modus` erreichbar – sie liefert weiterhin das `MODUS` ihres eigenen Moduls. `super::MODUS` springt eine Ebene nach oben und liefert `"prod"`.
    resources:
      - title: Rust Book · Re-exporting Names with pub use
        url: https://doc.rust-lang.org/book/ch07-04-bringing-paths-into-scope-with-the-use-keyword.html#re-exporting-names-with-pub-use
      - title: Reference · use declarations
        url: https://doc.rust-lang.org/reference/items/use-declarations.html#as-renames
  - id: sichtbarkeit-ergaenzen
    type: gap
    title: Ein Lager mit Regeln
    prompt: |
      Ergänze den Code so, dass er kompiliert und diese Regeln gelten:

      1. Der Name eines Artikels ist von außen lesbar, der Bestand nur über Methoden.
      2. `protokoll::notieren` nutzt die **private** Hilfsfunktion `format_zeile` aus dem Elternmodul `lager`.
      3. `main` spricht den Typ ohne Modulpräfix als `Artikel` an.
    lang: rust
    code: |
      mod lager {
          pub struct Artikel {
              ⟦pub⟧ name: String,
              bestand: u32,
          }

          impl Artikel {
              pub fn neu(name: &str) -> Self {
                  Self { name: name.to_string(), bestand: 0 }
              }

              pub fn einlagern(&mut self, menge: u32) {
                  self.bestand += menge;
                  protokoll::notieren(&self.name, menge);
              }

              pub fn bestand(&self) -> u32 {
                  self.bestand
              }
          }

          mod protokoll {
              pub fn notieren(name: &str, menge: u32) {
                  println!("{}", ⟦super::format_zeile⟧(name, menge));
              }
          }

          fn format_zeile(name: &str, menge: u32) -> String {
              format!("+{menge} {name}")
          }
      }

      ⟦use lager::Artikel;⟧

      fn main() {
          let mut artikel = Artikel::neu("Tastatur");
          artikel.einlagern(3);
          println!("{}: {}", artikel.name, artikel.bestand());
      }
    gaps:
      - label: Sichtbarkeit des Feldes
        hint: "`main` liest `artikel.name` direkt."
      - label: Pfad zur Hilfsfunktion
        hint: "`format_zeile` liegt eine Ebene über `protokoll`."
        accept: ["crate::lager::format_zeile", "self::super::format_zeile"]
      - label: Import in main
        hint: Eine `use`-Deklaration auf Ebene der Crate-Wurzel.
        accept: ["use crate::lager::Artikel;", "use self::lager::Artikel;"]
    explanation: |
      `name` braucht `pub`, weil `main` das Feld direkt liest; `bestand` bleibt privat und ist nur über `einlagern` änderbar. Dass `protokoll` die private Funktion `format_zeile` aufrufen darf, ist kein Versehen: Private Elemente sind im eigenen Modul **und in allen Nachfahren** sichtbar, und `protokoll` ist ein Kind von `lager`. Umgekehrt darf `lager` `notieren` nur aufrufen, weil sie `pub` ist – `protokoll` selbst bleibt privat, nach außen ist `notieren` also trotzdem nicht erreichbar.
    resources:
      - title: Reference · Visibility and privacy
        url: https://doc.rust-lang.org/reference/visibility-and-privacy.html
      - title: Rust by Example · Struct visibility
        url: https://doc.rust-lang.org/rust-by-example/mod/struct_visibility.html
  - id: cargo-toml-ergaenzen
    type: gap
    title: Ein Manifest nach Vorgabe
    prompt: |
      Ergänze die `Cargo.toml`:

      - `serde` wird mit seinem Feature `derive` gebraucht.
      - `serde_json` soll nur übersetzt werden, wenn jemand das Feature `json` einschaltet.
      - `tempfile` wird ausschließlich in Tests benutzt.
      - Release-Builds nutzen Link-Time-Optimization.
    lang: toml
    code: |
      [package]
      name = "logscan"
      version = "0.2.0"
      edition = "2024"

      [dependencies]
      regex = "1.11"
      serde = { version = "1.0", ⟦features = ["derive"]⟧ }
      serde_json = { version = "1.0", ⟦optional = true⟧ }

      ⟦[dev-dependencies]⟧
      tempfile = "3"

      [features]
      json = [⟦"dep:serde_json"⟧]

      ⟦[profile.release]⟧
      lto = true
    gaps:
      - label: Feature von serde
        hint: Der Schlüssel heißt wie die Tabelle, in der Features definiert werden, und nimmt eine Liste.
        accept: ["features = ['derive']"]
      - label: serde_json nur auf Wunsch
        hint: Eine Abhängigkeit, die standardmäßig nicht gebaut wird, ist …
      - label: Tabelle für Test-Abhängigkeiten
        hint: Wie `[dependencies]`, mit einem Präfix für „development“.
      - label: Was das Feature json aktiviert
        hint: Optionale Abhängigkeiten werden in Features mit dem Präfix `dep:` angesprochen.
        accept: ["'dep:serde_json'", "\"serde_json\""]
      - label: Tabelle für das Release-Profil
        hint: Profile stehen unter `[profile.<name>]`.
    explanation: |
      `features = ["derive"]` schaltet ein Feature einer Abhängigkeit ein. `optional = true` sorgt dafür, dass `serde_json` nur gebaut wird, wenn ein Feature es anfordert; `"dep:serde_json"` ist die ausdrückliche Schreibweise dafür und verhindert, dass automatisch ein gleichnamiges Feature entsteht (die kurze Form `"serde_json"` funktioniert auch). `[dev-dependencies]` sind nur für Tests, Beispiele und Benchmarks da. `[profile.release]` überschreibt die Voreinstellungen von `cargo build --release`.
    resources:
      - title: Cargo Book · Optional dependencies
        url: https://doc.rust-lang.org/cargo/reference/features.html#optional-dependencies
      - title: Cargo Book · Development dependencies
        url: https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html#development-dependencies
      - title: Cargo Book · Profiles
        url: https://doc.rust-lang.org/cargo/reference/profiles.html
  - id: neue-bibliothek
    type: command
    title: Eine Bibliothek anlegen
    prompt: Lege im aktuellen Verzeichnis ein neues Package `logscan` an, dessen Wurzel eine Bibliothek (`src/lib.rs`) ist – kein Programm.
    context: Du bist in `~/projekte`.
    answers: ["cargo new --lib logscan", "cargo new logscan --lib"]
    output: |
          Creating library `logscan` package
    explanation: |
      `cargo new` legt ohne Option ein Binary Crate mit `src/main.rs` an. `--lib` erzeugt stattdessen `src/lib.rs` mit einem Beispieltest. In beiden Fällen entstehen `Cargo.toml` mit `edition = "2024"`, ein Git-Repository und eine `.gitignore`, die `/target` ausschließt – aber nicht `Cargo.lock`. Eine `main.rs` kannst du später jederzeit ergänzen; dann hat das Package zwei Crates.
    resources:
      - title: Cargo Book · cargo new
        url: https://doc.rust-lang.org/cargo/commands/cargo-new.html
  - id: abhaengigkeit-mit-feature
    type: command
    title: Abhängigkeit per Befehl
    prompt: Füge `serde` mit dem Feature `derive` als Abhängigkeit hinzu – mit einem einzigen Befehl, ohne die `Cargo.toml` von Hand zu bearbeiten.
    context: Du bist im Package-Verzeichnis `~/projekte/logscan`.
    answers:
      - cargo add serde --features derive
      - cargo add serde -F derive
      - cargo add serde --features=derive
      - cargo add --features derive serde
      - cargo add -F derive serde
    explanation: |
      `cargo add` sucht die aktuelle Version im Registry-Index und trägt `serde = { version = "…", features = ["derive"] }` in `[dependencies]` ein. Mit `--dev` landet eine Abhängigkeit in `[dev-dependencies]`, mit `--optional` wird sie optional. Von Hand geschriebene Einträge sind gleichwertig; `cargo add` spart das Nachschlagen der Versionsnummer.
    resources:
      - title: Cargo Book · cargo add
        url: https://doc.rust-lang.org/cargo/commands/cargo-add.html
  - id: clippy-in-der-ci
    type: command
    title: Clippy ohne Gnade
    prompt: Deine CI soll Clippy über **alle Targets** (auch Tests und Beispiele) laufen lassen und bei **jeder** Warnung fehlschlagen. Wie lautet der Befehl?
    answers:
      - cargo clippy --all-targets -- -D warnings
      - cargo clippy --all-targets -- -Dwarnings
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
    explanation: |
      Ohne `--all-targets` prüft Clippy nur Bibliothek und Binaries, nicht aber Tests, Beispiele und Benchmarks. Alles nach `--` geht nicht an Cargo, sondern an den Compiler-Treiber: `-D warnings` macht jede Warnung zum Fehler (deny). Lokal lässt du `-D warnings` meist weg, in der CI verhindert es, dass Warnungen sich ansammeln.
    resources:
      - title: Clippy · Usage
        url: https://doc.rust-lang.org/clippy/usage.html
      - title: Clippy · Configuration
        url: https://doc.rust-lang.org/clippy/configuration.html
  - id: privates-feld
    type: bug
    title: Das Konto lässt sich nicht anlegen
    prompt: |
      Das Modul `bank` gehört einem anderen Team und darf nicht verändert werden. Beim Übersetzen meldet der Compiler:

      ```text
      error[E0451]: field `saldo_cent` of struct `Konto` is private
      ```

      Finde die fehlerhafte Zeile und korrigiere sie so, dass das Programm wie gedacht funktioniert.
    lang: rust
    code: |
      mod bank {
          pub struct Konto {
              pub inhaber: String,
              saldo_cent: i64,
          }

          impl Konto {
              pub fn eroeffnen(inhaber: &str) -> Self {
                  Self { inhaber: inhaber.to_string(), saldo_cent: 0 }
              }

              pub fn saldo_cent(&self) -> i64 {
                  self.saldo_cent
              }
          }
      }

      fn main() {
          let konto = bank::Konto { inhaber: String::from("Steven"), saldo_cent: 0 };
          println!("{}: {} Cent", konto.inhaber, konto.saldo_cent());
      }
    lines: [19]
    fix:
      - line: 19
        answers:
          - let konto = bank::Konto::eroeffnen("Steven");
          - let konto = bank::Konto::eroeffnen(&String::from("Steven"));
    explanation: |
      Ein Struct-Literal muss **alle** Felder setzen, und das darf nur Code, der alle Felder sieht. `saldo_cent` ist privat, also nur in `bank` und dessen Nachfahren zugänglich; `main` liegt außerhalb. Die richtige Lösung ist der Konstruktor `eroeffnen`, den das Modul genau dafür anbietet. `saldo_cent` einfach `pub` zu machen würde die Invariante des Moduls aushebeln – und war hier ausdrücklich verboten.
    resources:
      - title: Rust Book · Making Structs and Enums Public
        url: https://doc.rust-lang.org/book/ch07-03-paths-for-referring-to-an-item-in-the-module-tree.html#making-structs-and-enums-public
      - title: Rust Error Codes · E0451
        url: https://doc.rust-lang.org/error_codes/E0451.html
  - id: doppeltes-modul
    type: bug
    title: LogEintrag ist nicht LogEintrag
    prompt: |
      Im Package `logscan` enthält `src/lib.rs` die Zeile `pub mod eintrag;` und eine Funktion `pub fn parse_zeile(zeile: &str) -> Option<eintrag::LogEintrag>`. Die `src/main.rs` unten übersetzt nicht:

      ```text
      error[E0308]: mismatched types
        |
      11 |         ausgeben(&eintrag);
        |                  ^^^^^^^^ expected `eintrag::LogEintrag`, found `logscan::eintrag::LogEintrag`
      ```

      Finde die Zeile, die das Problem verursacht, und ändere **genau diese eine** Zeile.
    lang: rust
    code: |
      mod eintrag;

      use eintrag::LogEintrag;

      fn ausgeben(eintrag: &LogEintrag) {
          println!("[{}] {}", eintrag.level, eintrag.text);
      }

      fn main() {
          if let Some(eintrag) = logscan::parse_zeile("ERROR Datenbank nicht erreichbar") {
              ausgeben(&eintrag);
          }
      }
    lines: [1]
    fix:
      - line: 1
        answers: ["use logscan::eintrag;", "use ::logscan::eintrag;"]
    verify: false
    explanation: |
      `mod eintrag;` in `main.rs` hängt `src/eintrag.rs` ein **zweites Mal** ein – diesmal in das Binary Crate. Dieselbe Datei wird also zweimal übersetzt, und es entstehen zwei verschiedene Typen: `crate::eintrag::LogEintrag` im Binary und `logscan::eintrag::LogEintrag` in der Bibliothek. `parse_zeile` liefert den zweiten, `ausgeben` erwartet den ersten. Mit `use logscan::eintrag;` greift `main.rs` auf das Modul der Bibliothek zu, und die folgende Zeile `use eintrag::LogEintrag;` löst sich über diesen Import auf. Genauso richtig wäre, Zeile 1 zu löschen und Zeile 3 in `use logscan::eintrag::LogEintrag;` zu ändern. Regel: Der Modulbaum gehört in `lib.rs`, `main.rs` benutzt ihn nur über den Crate-Namen.
    resources:
      - title: Rust Book · Best Practices for Packages with a Binary and a Library
        url: https://doc.rust-lang.org/book/ch07-03-paths-for-referring-to-an-item-in-the-module-tree.html#best-practices-for-packages-with-a-binary-and-a-library
      - title: Rust Book · Separating Modules into Different Files
        url: https://doc.rust-lang.org/book/ch07-05-separating-modules-into-different-files.html
  - id: fassade-erklaeren
    type: explain
    title: Die Fassade einer Bibliothek
    prompt: |
      Das ist die komplette `src/lib.rs` einer Bibliothek. Erkläre wie im Code-Review: Welche Rolle spielen `mod` ohne `pub`, die `pub use`-Zeilen, `pub(crate)` und die beiden Kommentararten? Was bedeutet das für Nutzer und für spätere Änderungen?
    lang: rust
    code: |
      //! logscan – Server-Logs parsen und auswerten.

      mod parser;
      mod statistik;

      pub use parser::{Level, LogEintrag, parse_zeile};
      pub use statistik::Zusammenfassung;

      pub(crate) const MAX_ZEILENLAENGE: usize = 8 * 1024;

      /// Parst alle lesbaren Zeilen und fasst sie zusammen.
      /// Zeilen, die nicht dem Format entsprechen, werden übersprungen.
      pub fn analysiere(log: &str) -> Zusammenfassung {
          let eintraege: Vec<LogEintrag> = log.lines().filter_map(parse_zeile).collect();
          Zusammenfassung::aus(&eintraege)
      }
    points:
      - "`mod parser;` und `mod statistik;` sind privat: Nutzer können die Module nicht direkt ansprechen, die Dateistruktur ist ein internes Detail."
      - "`pub use` re-exportiert ausgewählte Elemente unter `logscan::…` und bildet eine flache, bewusst gewählte öffentliche API."
      - Interne Umbauten (Module aufteilen, umbenennen) brechen keine Nutzer, solange die re-exportierten Namen bleiben – wichtig für SemVer.
      - "`pub(crate)` macht die Konstante im ganzen Crate nutzbar, ohne sie zur öffentlichen API zu machen."
      - "`//!` dokumentiert das Crate selbst (Startseite von `cargo doc`), `///` die folgende Funktion."
    explanation: |
      Diese Datei ist eine Fassade. Die Module `parser` und `statistik` sind privat, also sieht ein Nutzer nur, was die `pub use`-Zeilen ausdrücklich freigeben: `logscan::parse_zeile`, `logscan::LogEintrag`, `logscan::Zusammenfassung` und die Funktion `analysiere`. Dadurch ist die öffentliche API klein und flach, und ich kann `parser.rs` später in mehrere Dateien zerlegen, ohne eine neue Major-Version zu brauchen – die Pfade der Nutzer bleiben gleich. `MAX_ZEILENLAENGE` ist `pub(crate)`: Parser und Statistik dürfen sie verwenden, für Nutzer existiert sie nicht, also kann ich den Wert jederzeit ändern. `//!` beschreibt das Crate als Ganzes und erscheint auf der Startseite von `cargo doc`, `///` dokumentiert `analysiere`.
    resources:
      - title: Rust Book · Exporting a Convenient Public API
        url: https://doc.rust-lang.org/book/ch14-02-publishing-to-crates-io.html#exporting-a-convenient-public-api
      - title: Rust Book · Contained Item Comments
        url: https://doc.rust-lang.org/book/ch14-02-publishing-to-crates-io.html#contained-item-comments
  - id: log-werkzeug-strukturieren
    type: practice
    title: Ein Log-Werkzeug in Module gliedern
    prompt: |
      Baue ein kleines Log-Werkzeug mit klarer Modulstruktur. Damit du es im Playground testen kannst, schreibst du die Module zunächst **inline** in eine Datei – so, wie sie später auf Dateien verteilt würden.

      Anforderungen:

      1. Modul `eintrag`: `pub enum Level { Info, Warnung, Fehler }` und `pub struct LogEintrag { pub level: Level, pub nachricht: String }`.
      2. Modul `parser`: `pub fn parse_zeile(zeile: &str) -> Option<LogEintrag>` für Zeilen wie `ERROR Datenbank nicht erreichbar` (Level `INFO`, `WARN`, `ERROR`, dann Leerzeichen, dann Nachricht). Die Umwandlung des Level-Texts steckt in einer **privaten** Hilfsfunktion `parse_level`.
      3. Modul `statistik`: `pub fn zaehle(eintraege: &[LogEintrag], level: Level) -> usize`.
      4. Die Crate-Wurzel re-exportiert `Level`, `LogEintrag`, `parse_zeile` und `zaehle` mit `pub use`, sodass `main` und die Tests keine Modulpfade brauchen.
      5. Ein Testmodul in `parser` testet die private Funktion `parse_level`, ein Testmodul in der Wurzel testet `parse_zeile` und `zaehle`.

      Überlege zum Schluss, auf welche Dateien du die Module in einem echten Package verteilen würdest.
    lang: rust
    starter: |
      mod eintrag {
          // Level und LogEintrag
      }

      mod parser {
          // parse_zeile (pub) und parse_level (privat)
      }

      mod statistik {
          // zaehle
      }

      // pub use …

      fn main() {
          let log = "INFO Server gestartet\nERROR Datenbank nicht erreichbar\nkaputt\nWARN Speicher knapp";
          // Einträge parsen und Fehler zählen
      }
    solution: |
      mod eintrag {
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          pub enum Level {
              Info,
              Warnung,
              Fehler,
          }

          #[derive(Debug, PartialEq, Eq)]
          pub struct LogEintrag {
              pub level: Level,
              pub nachricht: String,
          }
      }

      mod parser {
          use crate::eintrag::{Level, LogEintrag};

          pub fn parse_zeile(zeile: &str) -> Option<LogEintrag> {
              let (level, nachricht) = zeile.split_once(' ')?;
              Some(LogEintrag {
                  level: parse_level(level)?,
                  nachricht: nachricht.trim().to_string(),
              })
          }

          fn parse_level(text: &str) -> Option<Level> {
              match text {
                  "INFO" => Some(Level::Info),
                  "WARN" => Some(Level::Warnung),
                  "ERROR" => Some(Level::Fehler),
                  _ => None,
              }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn erkennt_bekannte_level() {
                  assert_eq!(parse_level("WARN"), Some(Level::Warnung));
                  assert_eq!(parse_level("DEBUG"), None);
              }
          }
      }

      mod statistik {
          use crate::eintrag::{Level, LogEintrag};

          pub fn zaehle(eintraege: &[LogEintrag], level: Level) -> usize {
              eintraege.iter().filter(|e| e.level == level).count()
          }
      }

      pub use eintrag::{Level, LogEintrag};
      pub use parser::parse_zeile;
      pub use statistik::zaehle;

      fn main() {
          let log = "INFO Server gestartet\nERROR Datenbank nicht erreichbar\nkaputt\nWARN Speicher knapp";
          let eintraege: Vec<LogEintrag> = log.lines().filter_map(parse_zeile).collect();
          println!("{} Einträge, {} Fehler", eintraege.len(), zaehle(&eintraege, Level::Fehler));
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn ueberspringt_kaputte_zeilen() {
              let eintraege: Vec<LogEintrag> = "kaputt\nINFO ok".lines().filter_map(parse_zeile).collect();
              assert_eq!(eintraege.len(), 1);
              assert_eq!(eintraege[0].nachricht, "ok");
          }

          #[test]
          fn zaehlt_nur_das_gewuenschte_level() {
              let eintraege: Vec<LogEintrag> = "ERROR a\nERROR b\nINFO c".lines().filter_map(parse_zeile).collect();
              assert_eq!(zaehle(&eintraege, Level::Fehler), 2);
              assert_eq!(zaehle(&eintraege, Level::Warnung), 0);
          }
      }
    checklist:
      - "`parse_level` ist privat, wird aber im Testmodul von `parser` über `use super::*;` getestet."
      - "`parser` und `statistik` greifen mit `use crate::eintrag::…` auf die Typen zu, nicht über Kopien."
      - Die Wurzel re-exportiert die vier Namen mit `pub use`; `main` und die Wurzel-Tests kommen ohne Modulpfade aus.
      - "`cargo test` (oder „Test“ im Playground) läuft mit drei grünen Tests; `main` gibt `3 Einträge, 1 Fehler` aus."
      - "Du kannst die Dateiaufteilung benennen: `src/lib.rs` mit `mod`-Deklarationen und `pub use`, `src/eintrag.rs`, `src/parser.rs`, `src/statistik.rs` und eine `src/main.rs`, die nur `logscan::…` aufruft."
    explanation: |
      Die Lösung trennt Datenmodell, Parsing und Auswertung. Jede Datei hätte eine klare Aufgabe, und die Wurzel legt fest, was öffentlich ist. `parse_level` bleibt privat, weil es ein Implementierungsdetail ist; das Testmodul darf es trotzdem aufrufen, weil es ein Nachfahre von `parser` ist. In einem echten Package wandern die Module in eigene Dateien, die Wurzel wird zu `src/lib.rs`, und `main.rs` enthält nur noch `fn main`, die `logscan::parse_zeile` und `logscan::zaehle` benutzt. Der Modulbaum bleibt dabei identisch – nur der Ort des Codes ändert sich.
    resources:
      - title: Rust Book · Separating Modules into Different Files
        url: https://doc.rust-lang.org/book/ch07-05-separating-modules-into-different-files.html
      - title: "Rust Book · The Tests Module and #[cfg(test)]"
        url: https://doc.rust-lang.org/book/ch11-03-test-organization.html#the-tests-module-and-cfgtest
