id: performance-messen
title: Performance messen und lesen
level: 3
minutes: 150
summary: Messwerte, Benchmark-Ausgaben und Flamegraphs richtig lesen und daraus die nächste Handlung ableiten, statt zu raten, welche Zeile langsam ist.
goals:
  - Du arbeitest nach dem Ablauf Hypothese, Messung, eine Änderung, erneute Messung und schätzt mit Amdahls Gesetz ab, was eine Optimierung höchstens bringt.
  - Du misst mit `Instant` und `black_box` und begründest, warum eine Einzelmessung und ein Debug-Build nichts beweisen.
  - "Du liest criterion-, divan- und hyperfine-Ausgaben: Konfidenzintervall, Ausreißer, `change` mit p-Wert, Rauschschwelle, Mittelwert ± σ."
  - Du liest einen Flamegraph mit Breite, Selbstzeit und x-Achse richtig und erkennst, wo Inlining Funktionen versteckt.
  - Du erkennst typische Allokationsquellen in heißen Schleifen und zählst Allokationen mit einem eigenen `GlobalAlloc`.
