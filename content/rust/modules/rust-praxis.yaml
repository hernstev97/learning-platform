id: rust-praxis
title: 'Rust in der Praxis: ein robustes CLI'
level: 3
minutes: 240
summary: Ownership, Fehler, I/O und Tests zu einem kleinen, nachvollziehbar auslieferbaren Kommandozeilenwerkzeug
  verbinden.
place: pc
goals:
- Du formulierst Eingabe-, Ausgabe- und Fehlerverträge für ein CLI, einschließlich der Exit-Status 0, 1, 2 und 130.
- Du trennst Parser, I/O und Prozessgrenze und liest Datei und stdin über dieselbe `BufRead`-Schnittstelle.
- Du baust Subcommands und Optionen mit clap und legst den Vorrang von Kommandozeile, Umgebung, TOML-Datei und Standardwert fest.
- Du schreibst Ausgaben gepuffert, behandelst `BrokenPipe` und beendest bei Strg+C geordnet.
- Du lieferst reproduzierbare Beispiele, Tests und dokumentierte Grenzen.
