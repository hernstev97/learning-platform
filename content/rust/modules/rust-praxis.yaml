lesson: |
  Du sollst für ein kleines Betriebsteam ein CLI liefern, das Logdateien nach Schweregrad zusammenfasst. Das Team will es im Terminal benutzen, in Skripten aufrufen und hinter `| head` hängen. „Es kompiliert“ reicht dafür nicht: Eine fehlende Datei darf keinen kryptischen Panic auslösen, kaputte Zeilen dürfen nicht als Erfolg verschwinden, Strg+C darf keinen halben Bericht hinterlassen, und die Ausgabe muss sich zuverlässig weiterverarbeiten lassen.

  Dieses Modul verbindet die bisherigen Themen zu einem vertikalen Ablauf: Argumente und Konfiguration lesen, Daten einlesen, fachlich parsen, auswerten, ausgeben und Fehler an der Prozessgrenze behandeln. Dateien, Puffer und Prozesse aus der Standardbibliothek kennst du aus [Ein- und Ausgabe](/rust/ein-ausgabe). Du baust eine synchrone Version; Async oder Threads kommen erst bei gemessenem Bedarf dazu.

  ## Anforderungen werden zu einem überprüfbaren Vertrag

  Definiere vor dem Implementieren ein kleines Eingabeformat. Jede nicht leere Zeile enthält eine Stufe, ein Leerzeichen und eine Meldung. Erlaubt sind `INFO`, `WARN` und `ERROR`. Leere Zeilen werden ignoriert; unbekannte Stufen und leere Meldungen sind Fehler. Das ist eine bewusste Formatentscheidung, keine Aussage über alle Logdateien.

  ```text
  INFO Worker gestartet
  WARN Wenig Speicher
  ERROR Upload fehlgeschlagen
  INFO Worker beendet
  ```

  Die strenge Variante bricht bei einem ungültigen Datensatz mit Zeilennummer ab und liefert keinen scheinbar vollständigen Erfolgsbericht. Lege außerdem fest: Ergebnisse gehen auf stdout, Diagnosen auf stderr, Erfolg, Fehler und Nutzungsfehler haben unterscheidbare Exit-Status. Wer das erst beim Testen errät, bekommt widersprüchliche Erwartungen zwischen Parser, Oberfläche und Skript. Das [CLI-Kapitel des Rust Book](https://doc.rust-lang.org/book/ch12-03-improving-error-handling-and-modularity.html) zeigt die Trennung von Konfiguration, Verarbeitung und Fehlerbehandlung.

  ## Ein Parser braucht noch keine Datei

  Die kleinste fachliche Funktion nimmt einen `&str` und liefert ein Ergebnis. Sie weiß nichts über Dateipfade oder Konsolenausgabe und ist deshalb direkt testbar.

  ```rust
  #[derive(Debug, PartialEq)]
  enum Stufe { Info, Warn, Error }

  fn parse_zeile(text: &str) -> Result<Option<Stufe>, &'static str> {
      let text = text.trim();
      if text.is_empty() { return Ok(None); }
      let (stufe, meldung) = text.split_once(' ').ok_or("Meldung fehlt")?;
      if meldung.trim().is_empty() { return Err("Meldung fehlt"); }
      let stufe = match stufe {
          "INFO" => Stufe::Info,
          "WARN" => Stufe::Warn,
          "ERROR" => Stufe::Error,
          _ => return Err("Unbekannte Stufe"),
      };
      Ok(Some(stufe))
  }

  fn main() {
      println!("{:?}", parse_zeile("WARN Wenig Speicher"));
  }
  ```

  `Result<Option<Stufe>, E>` bildet drei Ergebnisse ab: gültige Zeile, bewusst ignorierte Leerzeile, Fehler. Ein einzelnes `Option` würde ignorierte und ungültige Zeilen zusammenwerfen. Die Zeilennummer gehört nicht in diese Funktion, sie kennt die Position im Dokument nicht; die äußere Leseschicht ergänzt diesen Kontext.

  ## Reader, Writer und stdin als austauschbare Grenzen

  Für größere Logs liest du zeilenweise über [`BufRead::lines`](https://doc.rust-lang.org/std/io/trait.BufRead.html#method.lines). Jede Zeile ist ein `Result<String, io::Error>`; das `?` ist Pflicht, denn `filter_map(Result::ok)` ließe unlesbare Daten still verschwinden. Unix-Werkzeuge lesen nach Konvention von stdin, wenn statt eines Dateinamens `-` steht. Weil [`Stdin::lock`](https://doc.rust-lang.org/std/io/struct.Stdin.html#method.lock) ein `StdinLock<'static>` liefert, das `BufRead` implementiert, deckt eine Funktion beide Quellen ab:

  ```rust
  use std::fs::File;
  use std::io::{self, BufRead, BufReader};
  use std::path::Path;

  fn oeffnen(pfad: &Path) -> io::Result<Box<dyn BufRead>> {
      if pfad == Path::new("-") {
          Ok(Box::new(io::stdin().lock()))
      } else {
          Ok(Box::new(BufReader::new(File::open(pfad)?)))
      }
  }

  fn main() -> io::Result<()> {
      let mut anzahl = 0;
      for zeile in oeffnen(Path::new("-"))?.lines() {
          if !zeile?.trim().is_empty() {
              anzahl += 1;
          }
      }
      println!("{anzahl} Zeilen");
      Ok(())
  }
  ```

  Mit `INFO start`, einer Leerzeile, `WARN platte` und `ERROR db` auf stdin gibt das Beispiel `3 Zeilen` aus. Der Rest des Programms sieht nur `Box<dyn BufRead>` – und Tests übergeben ein `io::Cursor` mit Bytes im Speicher. Dasselbe gilt für die Ausgabe: Eine Funktion, die `impl Write` nimmt, schreibt in stdout, eine Datei oder einen `Vec<u8>` im Test. Schreiben liefert ein `Result`, denn auch eine volle Platte oder eine geschlossene Pipe ist ein Fehler ([`Write`](https://doc.rust-lang.org/std/io/trait.Write.html)).

  Streaming begrenzt den Speicher nicht automatisch: Eine einzelne riesige Zeile belegt trotzdem viel Platz. Für unkontrollierte Eingaben legst du eine Zeilenlängengrenze fest, statt im README konstante Speichernutzung zu behaupten.

  ## Argumente mit clap: Subcommands, Werte, Umgebung

  Dateipfade sind keine Texte. [`args_os`](https://doc.rust-lang.org/std/env/fn.args_os.html) liefert Argumente als `OsString`, auch wenn ein Pfad kein gültiges Unicode ist; halte sie als `PathBuf`. Ab zwei Optionen lohnt sich [clap](https://docs.rs/clap/latest/clap/_derive/index.html) mit Derive (`clap = { version = "4.6", features = ["derive", "env"] }`):

  ```rust
  use std::path::PathBuf;

  use clap::{Parser, Subcommand, ValueEnum};

  /// Fasst Logdateien nach Schweregrad zusammen.
  #[derive(Parser)]
  #[command(name = "logwerk", version)]
  struct Cli {
      #[command(subcommand)]
      befehl: Befehl,
  }

  #[derive(Subcommand)]
  enum Befehl {
      /// Zählt die Zeilen je Stufe
      Zaehlen {
          /// Logdatei, `-` liest von stdin
          datei: PathBuf,
      },
      /// Gibt nur Zeilen ab einer Mindeststufe aus
      Filtern {
          /// Mindeststufe
          #[arg(long, value_enum, env = "LOGWERK_STUFE", default_value_t = Stufe::Warn)]
          stufe: Stufe,
          /// Logdatei, `-` liest von stdin
          datei: PathBuf,
      },
  }

  #[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord, ValueEnum)]
  enum Stufe {
      Info,
      Warn,
      Error,
  }

  fn main() {
      let cli = Cli::parse();
      match cli.befehl {
          Befehl::Zaehlen { datei } => println!("zähle {}", datei.display()),
          Befehl::Filtern { stufe, datei } => {
              println!("filtere {} ab {stufe:?}", datei.display())
          }
      }
  }
  ```

  Die Doc-Kommentare werden zum Hilfetext ([Doc Comments](https://docs.rs/clap/latest/clap/_derive/index.html#doc-comments)), Enum-Varianten zu Subcommands in kebab-case, `ValueEnum` zur Liste erlaubter Werte, und `env` liest die Umgebungsvariable, wenn die Option fehlt ([Arg-Attribute](https://docs.rs/clap/latest/clap/_derive/index.html#arg-attributes)). So sieht das aus:

  ```console
  $ logwerk filtern --help
  Gibt nur Zeilen ab einer Mindeststufe aus

  Usage: logwerk filtern [OPTIONS] <DATEI>

  Arguments:
    <DATEI>  Logdatei, `-` liest von stdin

  Options:
        --stufe <STUFE>  Mindeststufe [env: LOGWERK_STUFE=] [default: warn] [possible values: info, warn, error]
    -h, --help           Print help
  $ logwerk filtern --stufe fatal app.log
  error: invalid value 'fatal' for '--stufe <STUFE>'
    [possible values: info, warn, error]

  For more information, try '--help'.
  $ echo $?
  2
  $ LOGWERK_STUFE=error logwerk filtern app.log
  filtere app.log ab Error
  ```

  Bei Nutzungsfehlern schreibt clap auf stderr und endet mit Status 2, bei `--help` und `--version` auf stdout mit 0 ([`Error::exit`](https://docs.rs/clap/latest/clap/error/struct.Error.html#method.exit)). Reserviere deshalb 1 für fachliche Fehler, dann unterscheidet ein Skript „falsch aufgerufen“ von „Datei kaputt“. clap prüft Syntax, Typen und erlaubte Werte. Ob die Datei existiert, ob `--max-zeilen 0` sinnvoll ist oder ob zwei Optionen fachlich zusammenpassen, bleibt deine Validierung nach dem Parsen.

  > [!WARNING] `process::exit` räumt nicht auf
  > [`process::exit`](https://doc.rust-lang.org/std/process/fn.exit.html) mitten im Programm beendet sofort: Kein `Drop` läuft, ein `BufWriter` wird nicht geleert, Temp-Dateien bleiben liegen. Gib einen [`ExitCode`](https://doc.rust-lang.org/std/process/struct.ExitCode.html) aus `main` zurück und lass Fehler per `?` dorthin wandern.

  ## Konfiguration: Umgebung, TOML-Datei und Vorrang

  [`env::var`](https://doc.rust-lang.org/std/env/fn.var.html) liefert `Result<String, VarError>`: `VarError::NotPresent`, wenn die Variable fehlt, und `VarError::NotUnicode(OsString)`, wenn ihr Wert kein gültiges UTF-8 ist ([VarError](https://doc.rust-lang.org/std/env/enum.VarError.html)). Für Pfade nimmst du [`env::var_os`](https://doc.rust-lang.org/std/env/fn.var_os.html), das `Option<OsString>` ohne Umwandlung liefert. Ein gesetzter, aber leerer Wert (`LOGWERK_STUFE=`) ist `Ok("")` – entscheide bewusst, ob er zählt.

  Seit Edition 2024 ist `env::set_var` `unsafe`: Ohne `unsafe`-Block meldet der Compiler ``error[E0133]: call to unsafe function `set_var` is unsafe and requires unsafe block``. Der Grund steht in der [Safety-Doku](https://doc.rust-lang.org/std/env/fn.set_var.html#safety): Auf Linux darf kein anderer Thread die Umgebung gleichzeitig lesen, und `cargo test` lässt Tests parallel in Threads laufen. Tests setzen deshalb keine Umgebungsvariablen im eigenen Prozess. Übergib die Werte als Parameter oder setze sie für einen Kindprozess mit `Command::env` ([Edition Guide](https://doc.rust-lang.org/edition-guide/rust-2024/newly-unsafe-functions.html)).

  Für eine Konfigurationsdatei ist TOML mit serde üblich (`serde = { version = "1", features = ["derive"] }`, `toml = "1.1"`):

  ```rust
  use serde::Deserialize;

  #[derive(Debug, Deserialize)]
  #[serde(default, deny_unknown_fields)]
  struct Konfig {
      stufe: String,
      farbe: bool,
      max_zeilenlaenge: usize,
  }

  impl Default for Konfig {
      fn default() -> Self {
          Konfig { stufe: "warn".into(), farbe: true, max_zeilenlaenge: 4096 }
      }
  }

  fn main() {
      let gut = "stufe = \"error\"\nmax_zeilenlaenge = 512\n";
      let konfig: Konfig = toml::from_str(gut).expect("gültige Konfiguration");
      println!("{konfig:?}");

      let vertippt = "stufe = \"error\"\nmax_zeilenlange = 512\n";
      if let Err(fehler) = toml::from_str::<Konfig>(vertippt) {
          eprintln!("logwerk.toml: {fehler}");
      }
  }
  ```

  `#[serde(default)]` füllt fehlende Felder aus `Default`, `deny_unknown_fields` macht aus einem Tippfehler einen Fehler statt eines still ignorierten Schlüssels ([Container-Attribute](https://serde.rs/container-attrs.html#deny_unknown_fields)). Die erste Zeile gibt `Konfig { stufe: "error", farbe: true, max_zeilenlaenge: 512 }` aus, der Tippfehler ergibt:

  ```text
  logwerk.toml: TOML parse error at line 2, column 1
    |
  2 | max_zeilenlange = 512
    | ^^^^^^^^^^^^^^^
  unknown field `max_zeilenlange`, expected one of `stufe`, `farbe`, `max_zeilenlaenge`
  ```

  Ein falscher Typ (`max_zeilenlaenge = "512"`) meldet `invalid type: string "512", expected usize` mit Zeile und Spalte. Gib diese Meldung unverändert mit dem Dateinamen weiter; sie zeigt dem Nutzer die Stelle.

  Bleibt die Frage, welcher Wert gewinnt. Die übliche Regel lautet: Kommandozeile vor Umgebungsvariable vor Datei vor Standardwert. Schreib sie als reine Funktion; dann testest du sie ohne Dateien und ohne `set_var`:

  ```rust
  fn waehle<T>(cli: Option<T>, umgebung: Option<T>, datei: Option<T>, standard: T) -> T {
      cli.or(umgebung).or(datei).unwrap_or(standard)
  }

  #[test]
  fn cli_schlaegt_alles() {
      assert_eq!(waehle(Some("debug"), Some("error"), Some("info"), "warn"), "debug");
      assert_eq!(waehle(None, None, Some("info"), "warn"), "info");
      assert_eq!(waehle(None, None, None, "warn"), "warn");
  }

  fn main() {
      println!("{}", waehle(None, Some("error"), Some("info"), "warn"));
  }
  ```

  Mit clap und `env` sind die ersten beiden Stufen schon zusammengelegt. Mach das Feld dafür zu `Option<Stufe>` ohne `default_value_t`: clap füllt es aus Option oder Variable, und deine Funktion ergänzt nur noch Datei und Standard.

  ## Ausgabe auf stdout: Puffer, Sperre und Broken Pipe

  `println!` sperrt stdout bei jedem Aufruf ([print!](https://doc.rust-lang.org/std/macro.print.html)), und stdout ist zeilengepuffert: Laut [Doku](https://doc.rust-lang.org/std/io/struct.Stdout.html) leert der Handle am Terminal bei jedem `\n`. Ausprobiert mit Rust 1.99.1 gilt das auch an einer Pipe – zwei `println!` im Abstand von 500 ms kamen beim Leser im Abstand von 500 ms an. Jede Zeile kostet also einen Systemaufruf. Gemessen mit `hyperfine -N --warmup 3 --output=pipe`, 1 000 000 Zeilen, Release-Build, ein Linux-Rechner (Mittelwerte, gekürzt):

  | Variante | Zeit |
  | --- | --- |
  | `println!` in der Schleife | 364 ms |
  | `let mut out = io::stdout().lock();` + `writeln!` | 376 ms |
  | `BufWriter::new(io::stdout().lock())` + `writeln!` + `flush` | 23 ms |

  Die Sperre allein bringt nichts; die Zeit steckt im Leeren nach jeder Zeile. Erst der [`BufWriter`](https://doc.rust-lang.org/std/io/struct.BufWriter.html) sammelt 8 KiB und schreibt sie am Stück – hier 15-mal schneller. Am Ende rufst du `flush()` selbst auf: Der Drop des `BufWriter` versucht es zwar auch, verschluckt aber einen Fehler dabei.

  Hängt das Werkzeug hinter `| head -1`, schließt `head` die Pipe nach der ersten Zeile. Rust setzt SIGPIPE vor `main` auf „ignorieren“, deshalb beendet der Kernel den Prozess nicht, sondern das nächste `write` scheitert mit `EPIPE`, in Rust `ErrorKind::BrokenPipe` ([on-broken-pipe](https://doc.rust-lang.org/unstable-book/compiler-flags/on-broken-pipe.html)). `println!` panikt bei jedem Schreibfehler. Ein Testprogramm, das 100 000 Zeilen mit `println!` schreibt, hinter `head -1`:

  ```console
  $ ./logwerk | head -1
  INFO request 1 ok

  thread 'main' (1415760) panicked at library/std/src/io/stdio.rs:1168:9:
  failed printing to stdout: Broken pipe (os error 32)
  note: run with `RUST_BACKTRACE=1` environment variable to display a backtrace
  ```

  Der Exit-Status war 101; mit diesem Code endet ein Rust-Programm, dessen `main` panikt. Mit `writeln!` kommt der Fehler als `io::Error` zurück, und eine geschlossene Pipe ist für ein Filterwerkzeug kein Fehler – der Leser hat, was er wollte:

  ```rust
  use std::io::{self, BufWriter, ErrorKind, Write};
  use std::process::ExitCode;

  fn ausgeben(zeilen: impl Iterator<Item = String>) -> io::Result<()> {
      let mut out = BufWriter::new(io::stdout().lock());
      for zeile in zeilen {
          writeln!(out, "{zeile}")?;
      }
      out.flush()
  }

  fn main() -> ExitCode {
      let zeilen = (1..=100_000).map(|n| format!("INFO request {n} ok"));
      match ausgeben(zeilen) {
          Ok(()) => ExitCode::SUCCESS,
          Err(e) if e.kind() == ErrorKind::BrokenPipe => ExitCode::SUCCESS,
          Err(e) => {
              eprintln!("logwerk: {e}");
              ExitCode::FAILURE
          }
      }
  }
  ```

  Mit `| head -1` gibt diese Fassung eine Zeile aus und endet mit 0. Andere Schreibfehler, etwa eine volle Platte, landen weiter als Meldung auf stderr mit Status 1.

  ## Strg+C: Signale und sauberes Beenden

  Bei Strg+C schickt das Terminal SIGINT an die Prozesse im Vordergrund. Ohne eigenen Handler beendet der Kernel den Prozess sofort, es laufen keine Destruktoren, und der Inhalt eines `BufWriter` geht verloren. Ausprobiert mit einer Schleife, die alle 5 ms eine Zeile in einen `BufWriter` schreibt, nach 0,5 s per SIGINT beendet: Die Ausgabedatei blieb leer, obwohl rund hundert Zeilen verarbeitet waren. Die Shell meldet Status 130, denn für ein Signal N setzt Bash 128 + N, und SIGINT ist 2 ([Bash: Exit Status](https://www.gnu.org/software/bash/manual/html_node/Exit-Status.html)).

  Die Crate [ctrlc](https://docs.rs/ctrlc/latest/ctrlc/) (`ctrlc = "3.5"`) installiert einen Handler, der in einem eigenen Thread läuft. Er setzt nur ein Flag; die Hauptschleife prüft es und endet geordnet:

  ```rust
  use std::io::{self, BufWriter, Write};
  use std::process::ExitCode;
  use std::sync::Arc;
  use std::sync::atomic::{AtomicBool, Ordering};
  use std::{thread, time::Duration};

  use ctrlc::set_handler;

  fn verarbeiten(abbruch: &AtomicBool) -> io::Result<bool> {
      let mut out = BufWriter::new(io::stdout().lock());
      for n in 1..=1000 {
          if abbruch.load(Ordering::Relaxed) {
              out.flush()?;
              return Ok(false);
          }
          writeln!(out, "Zeile {n} verarbeitet")?;
          thread::sleep(Duration::from_millis(5)); // steht für Arbeit
      }
      out.flush()?;
      Ok(true)
  }

  fn main() -> ExitCode {
      let abbruch = Arc::new(AtomicBool::new(false));
      let signal = Arc::clone(&abbruch);
      set_handler(move || signal.store(true, Ordering::Relaxed))
          .expect("Ctrl-C-Handler setzen");

      match verarbeiten(&abbruch) {
          Ok(true) => ExitCode::SUCCESS,
          Ok(false) => {
              eprintln!("logwerk: abgebrochen, Ausgabe bis hier vollständig");
              ExitCode::from(130)
          }
          Err(e) => {
              eprintln!("logwerk: {e}");
              ExitCode::FAILURE
          }
      }
  }
  ```

  Derselbe Versuch ergab jetzt 99 vollständige Zeilen in der Datei und Status 130. Den Code 130 setzt das Programm selbst, damit Skripte den Abbruch weiter von einem Erfolg unterscheiden. `Relaxed` reicht, weil nur das Flag selbst zählt (siehe [Nebenläufigkeit](/rust/nebenlaeufigkeit)). Für SIGTERM, das `kill` und systemd schicken, schaltest du das Feature `termination` ein. In async-Programmen wartest du stattdessen mit `tokio::signal::ctrl_c()` in einem `select!` ([Async Rust](/rust/async-rust)).

  ## Eine vollständige Scheibe, Qualität und Übergabe

  Verbinde Parser, Reader und Bericht zuerst für genau eine Datei und prüfe das ganze Verhalten mit einer kleinen Fixture: richtige Datei geöffnet, Zeilen verarbeitet, Bericht wie erwartet, Status 0. Danach dieselbe Grenze mit fehlendem Pfad, ungültiger Zeile und `| head -1`. Erst dann kommen Filter und weitere Ausgabeformate. Für stabile Ausgabe zählst du in einer `BTreeMap`, die in Schlüsselreihenfolge iteriert; eine `HashMap` müsstest du vorher sortieren. JSON erzeugt ein Serializer, keine Stringverkettung.

  Halte `main` klein und die Kernlogik unabhängig vom Prozess. Teste leere Eingabe, jede Stufe, unbekannte Stufe, fehlende Meldung, CRLF und einen Fehler in einer späteren Zeile. Wie du das Binary selbst mit Exit-Status, stdout und stderr testest, zeigt [Tests & Code-Qualität](/rust/testen-qualitaet). Im README stehen Installation, Format, Beispiele, Exit-Status, Konfigurationsvorrang und bekannte Grenzen; `cargo fmt`, Clippy und Tests laufen in CI. Produktive Logdateien mit Geheimnissen gehören nicht ins Repository, synthetische Beispiele reichen.

  > [!PRAXIS]
  > Eine professionelle Abgabe enthält mehr als Code. Lege eine gültige und eine ungültige Fixture bei, dokumentiere beide Aufrufe und die Exit-Status 0, 1, 2 und 130. Ein Reviewer probiert als Erstes `--help`, einen Tippfehler in der Konfiguration und `| head` – alle drei sollten verständlich enden.

  > [!INTERVIEW]
  > Präsentiere den Ablauf aus Nutzersicht, dann eine Abwägung und einen Fehlerfall. Etwa: „Ich schreibe über einen `BufWriter` auf stdout, weil `println!` an einer Pipe jede Zeile einzeln schreibt – gemessen 15-mal langsamer. Dafür muss ich `flush` aufrufen und eine geschlossene Pipe als normales Ende behandeln.“

  ## Häufige Fehler

  - **`println!` für die Hauptausgabe.** Langsam an Pipes und ein Panic bei `| head`. `BufWriter` plus `writeln!(…)?`.
  - **`flush` vergessen.** Der Drop leert zwar, verschluckt aber Fehler, und bei SIGINT oder `process::exit` läuft er gar nicht.
  - **Lesefehler verwerfen.** `filter_map(Result::ok)` macht kaputte Eingaben unsichtbar.
  - **Fachliche Validierung clap überlassen.** clap prüft Syntax und Werte, nicht ob die Kombination sinnvoll ist.
  - **`set_var` in Tests.** Seit Edition 2024 `unsafe` und bei parallelen Tests unsound; Werte als Parameter übergeben.
  - **Unbekannte Konfigurationsschlüssel still ignorieren.** `deny_unknown_fields` macht den Tippfehler zur Meldung mit Zeile.
  - **Diagnosen auf stdout.** Sie verunreinigen den Ergebnisstrom; Meldungen gehören auf stderr.

  ## Zusammenfassung

  - Gültige, ignorierte und fehlerhafte Daten sind getrennt definiert; der Parser kennt weder Datei noch Konsole.
  - `Box<dyn BufRead>` vereint Datei und stdin (`-`); Tests übergeben einen `Cursor`.
  - clap übernimmt Syntax, Hilfe und Nutzungsfehler (Status 2); fachliche Prüfung bleibt bei dir.
  - Vorrang CLI > Umgebung > Datei > Standard als reine, getestete Funktion; TOML mit `deny_unknown_fields`.
  - `BufWriter::new(io::stdout().lock())` mit explizitem `flush` statt `println!` in Schleifen.
  - `BrokenPipe` ist für Filterwerkzeuge ein normales Ende, kein Panic.
  - Strg+C setzt ein Flag, das Programm leert seine Puffer und endet mit 130.
