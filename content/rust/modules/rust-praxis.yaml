id: rust-praxis
title: 'Rust in der Praxis: ein robustes CLI'
level: 3
minutes: 180
summary: Ownership, Fehler, I/O und Tests zu einem kleinen, nachvollziehbar auslieferbaren Kommandozeilenwerkzeug
  verbinden.
goals:
- Du formulierst Eingabe-, Ausgabe- und Fehlerverträge für ein CLI.
- Du trennst Parser, I/O und Prozessgrenze.
- Du verarbeitest Zeilen ohne stillen Datenverlust.
- Du lieferst reproduzierbare Beispiele, Tests und dokumentierte Grenzen.
resources:
- &id001
  title: Rust Book · CLI-Struktur
  url: https://doc.rust-lang.org/book/ch12-03-improving-error-handling-and-modularity.html
- title: Standardbibliothek · BufRead
  url: https://doc.rust-lang.org/std/io/trait.BufRead.html
- title: Standardbibliothek · Write
  url: https://doc.rust-lang.org/std/io/trait.Write.html
- title: Standardbibliothek · args_os
  url: https://doc.rust-lang.org/std/env/fn.args_os.html
- title: Standardbibliothek · ExitCode
  url: https://doc.rust-lang.org/std/process/struct.ExitCode.html
lesson: |
  Du sollst für ein kleines Betriebsteam ein CLI liefern, das Logdateien nach Schweregrad zusammenfasst. Das Team will es im Terminal benutzen und später in einem Skript aufrufen. „Es kompiliert“ reicht dafür nicht: Eine fehlende Datei darf keinen kryptischen Panic verursachen, kaputte Zeilen dürfen nicht als Erfolg verschwinden und die Ausgabe muss zuverlässig weiterverarbeitbar sein.

  Dieses Modul verbindet die bisherigen Themen zu einem kleinen vertikalen Ablauf: Argumente lesen, Daten einlesen, fachlich parsen, auswerten, Ergebnis ausgeben und Fehler an der Prozessgrenze behandeln. Du baust zuerst eine synchrone Version. Async oder mehrere Threads kommen erst hinzu, wenn ein konkret gemessener Bedarf entsteht. Das Abschlussprojekt im Projektbereich erweitert denselben Arbeitsstil zu einem vollständigen Portfolio-Werkzeug.

  ## Anforderungen werden zu einem überprüfbaren Vertrag

  Definiere vor dem Implementieren ein kleines Eingabeformat. In unserem Beispiel enthält jede nicht leere Zeile eine Stufe, ein Leerzeichen und eine Meldung. Erlaubt sind `INFO`, `WARN` und `ERROR`. Leere Zeilen werden ignoriert; unbekannte Stufen und leere Meldungen sind Fehler. Das ist eine bewusste Formatentscheidung, keine allgemeine Behauptung über alle Logdateien.

  ```text
  INFO Worker gestartet
  WARN Wenig Speicher
  ERROR Upload fehlgeschlagen
  INFO Worker beendet
  ```

  Die Zusammenfassung zählt jede gültige Stufe. Bei einem ungültigen Datensatz bricht die strenge Variante mit einer Zeilennummer ab und liefert keinen scheinbar vollständigen Erfolgsbericht. Eine spätere tolerante Variante müsste Fehleranzahl und teilweise Verarbeitung ausdrücklich ausgeben. Lege außerdem fest: Ergebnisse gehen auf stdout, Diagnosen auf stderr, Erfolg und Fehler haben unterscheidbare Exit-Status.

  Diese Entscheidungen sind klein, aber wichtig. Wenn man sie erst beim Testen errät, entstehen widersprüchliche Erwartungen zwischen Parser, Oberfläche und Skript. Das [CLI-Kapitel des Rust Book](https://doc.rust-lang.org/book/ch12-03-improving-error-handling-and-modularity.html) zeigt die Trennung von Konfiguration, Verarbeitung und Fehlerbehandlung.

  ## Ein Parser braucht noch keine Datei

  Die kleinste fachliche Funktion nimmt einen `&str` und liefert ein Ergebnis. Sie weiß nichts über Dateipfade oder Konsolenausgabe. Das macht sie direkt testbar und wiederverwendbar.

  ```rust
  #[derive(Debug, PartialEq)]
  enum Stufe { Info, Warn, Error }

  fn parse_zeile(text: &str) -> Result<Option<Stufe>, &'static str> {
      let text = text.trim();
      if text.is_empty() { return Ok(None); }
      let (stufe, meldung) = text.split_once(' ').ok_or("Meldung fehlt")?;
      if meldung.trim().is_empty() { return Err("Meldung fehlt"); }
      let stufe = match stufe {
          "INFO" => Stufe::Info,
          "WARN" => Stufe::Warn,
          "ERROR" => Stufe::Error,
          _ => return Err("Unbekannte Stufe"),
      };
      Ok(Some(stufe))
  }

  fn main() {
      println!("{:?}", parse_zeile("WARN Wenig Speicher"));
  }
  ```

  `Result<Option<Stufe>, E>` bildet drei Ergebnisse ab: eine gültige Zeile, eine bewusst ignorierte Leerzeile oder einen Fehler. Ein einzelnes `Option` würde ignorierte und ungültige Zeilen zusammenwerfen. Der Parser leiht den Text; nur die Stufe wird als eigenes kleines Enum zurückgegeben. Möchtest du die Meldung später behalten, entscheide bewusst zwischen geliehenem Ausschnitt und eigenem String.

  Für größere Fehlermodelle verwendest du ein eigenes Fehler-Enum statt statischer Texte. Die Zeilennummer gehört aber nicht in diese Funktion, denn sie kennt die Position im Dokument nicht. Die äußere Leseschicht ergänzt den Kontext, statt dem Parser unnötige Zuständigkeiten zu geben.

  ## Reader und Writer machen Grenzen austauschbar

  Eine ganze Datei als String zu laden ist für kleine Eingaben verständlich. Für größere Logs ist zeilenweises Lesen über [`BufRead`](https://doc.rust-lang.org/std/io/trait.BufRead.html#method.lines) passender. `BufReader` puffert eine Datei; `Cursor` liefert dieselbe Schnittstelle für Bytes im Speicher.

  ```rust
  use std::io::{self, BufRead};

  fn zeilen(reader: impl BufRead) -> io::Result<usize> {
      let mut anzahl = 0;
      for line in reader.lines() {
          let line = line?;
          if !line.trim().is_empty() { anzahl += 1; }
      }
      Ok(anzahl)
  }

  fn main() -> io::Result<()> {
      let daten = io::Cursor::new("INFO Start\n\nWARN Speicher\n");
      println!("{}", zeilen(daten)?);
      Ok(())
  }
  ```

  `lines()` liefert pro Zeile ein `Result<String, io::Error>`. Das `?` ist wichtig: `filter_map(Result::ok)` würde defekte oder unlesbare Daten still verschwinden lassen. Der Iterator entfernt die Zeilenenden, damit dein Parser nicht selbst zwischen LF und CRLF unterscheiden muss. Ungültiges UTF-8 ist für diese String-Schnittstelle ein Fehler; binäre Formate benötigen eine andere Verarbeitung.

  Streaming begrenzt den Speicher nicht automatisch auf eine feste Größe. Eine einzelne riesige Zeile kann weiterhin viel Speicher belegen. Für unkontrollierte Eingaben definierst du daher Dateigrößen- oder Zeilenlängengrenzen und prüfst sie bewusst. Behaupte im README keine konstante Speichernutzung, wenn die längste Zeile unbegrenzt ist.

  ```rust
  use std::io::{self, Write};

  fn bericht(mut out: impl Write, anzahl: usize) -> io::Result<()> {
      writeln!(out, "Zeilen: {anzahl}")
  }

  fn main() -> io::Result<()> {
      let mut bytes = Vec::new();
      bericht(&mut bytes, 3)?;
      assert_eq!(bytes, b"Zeilen: 3\n");
      Ok(())
  }
  ```

  Der Writer erlaubt Tests ohne globale Umleitung von stdout. Er macht außerdem Schreibfehler sichtbar: Auch eine volle Platte oder geschlossene Pipe ist eine fehlgeschlagene Operation. Die [`Write`-Dokumentation](https://doc.rust-lang.org/std/io/trait.Write.html) erklärt, warum Schreiben einen Result-Wert liefert.

  ## Argumente und Prozessstatus bleiben am Rand

  Eine kleine `Config` enthält den geprüften Aufruf. Dateipfade sind keine fachlichen Texte. [`args_os`](https://doc.rust-lang.org/std/env/fn.args_os.html) erhält die plattformspezifische Argumentdarstellung, auch wenn ein Pfad nicht gültiges Unicode enthält. Verwende für Pfade `PathBuf`, statt sie früh verlustbehaftet in Strings zu verwandeln.

  ```rust
  use std::{ffi::OsString, path::PathBuf};

  fn eingabe(mut args: impl Iterator<Item = OsString>) -> Result<PathBuf, &'static str> {
      let _programm = args.next();
      let pfad = args.next().ok_or("Aufruf: logwerk DATEI")?;
      if args.next().is_some() { return Err("Zu viele Argumente"); }
      Ok(PathBuf::from(pfad))
  }

  fn main() {
      let args = [OsString::from("logwerk"), OsString::from("app.log")];
      println!("{}", eingabe(args.into_iter()).unwrap().display());
  }
  ```

  Bei mehr Optionen lohnt sich eine etablierte Argumentbibliothek wie [clap](https://docs.rs/clap/latest/clap/). Sie übernimmt Syntax, Hilfetext und Validierungsmechanik, aber nicht deine fachlichen Entscheidungen. Die erste Version braucht noch keine verschachtelten Subcommands oder Plugin-Architektur. Halte die CLI so klein, dass ihr Verhalten mit wenigen Integrationstests vollständig nachvollziehbar bleibt.

  [`ExitCode`](https://doc.rust-lang.org/std/process/struct.ExitCode.html) lässt `main` den Status zurückgeben. Anders als ein tiefer Aufruf von `process::exit` bewahrt die normale Rückkehr einen klaren Aufräumpfad.

  ```rust
  use std::process::ExitCode;

  fn run() -> Result<(), &'static str> {
      Ok(())
  }

  fn main() -> ExitCode {
      match run() {
          Ok(()) => ExitCode::SUCCESS,
          Err(error) => {
              eprintln!("logwerk: {error}");
              ExitCode::FAILURE
          }
      }
  }
  ```

  ## Eine vollständige Scheibe zuerst

  Verbinde nun Parser, Reader und Bericht für genau eine Datei. Prüfe mit einer kleinen Fixture zuerst das gesamte Verhalten: Der Aufruf öffnet die richtige Datei, verarbeitet ihre Zeilen, erzeugt den erwarteten Bericht und endet erfolgreich. Danach prüfst du dieselbe Grenze mit fehlendem Pfad und ungültiger Zeile. Erst wenn diese Scheibe funktioniert, ergänzt du Filter oder weitere Ausgabeformate.

  Ein `BTreeMap` liefert eine deterministische Schlüsselreihenfolge. Eine HashMap hat diese Garantie nicht; sortiere ihre Ergebnisse vor stabiler Ausgabe. JSON solltest du mit einem Serializer erzeugen, nicht durch Stringverkettung: Anführungszeichen, Steuerzeichen und Unicode machen selbst gebaute Escaping-Regeln fehleranfällig.

  ```rust
  use std::collections::BTreeMap;

  fn main() {
      let mut counts = BTreeMap::new();
      for stufe in ["WARN", "INFO", "INFO"] {
          *counts.entry(stufe).or_insert(0_u32) += 1;
      }
      for (stufe, anzahl) in counts {
          println!("{stufe} {anzahl}");
      }
  }
  ```

  > [!PRAXIS]
  > Eine professionelle Abgabe enthält nicht nur Code. Lege eine kleine gültige und eine ungültige Fixture bei, dokumentiere beide Aufrufe und erkläre die Exit-Status. Ein Reviewer sollte den Nutzen in wenigen Minuten selbst überprüfen können.

  ## Qualität und Übergabe gehören zum Produkt

  Halte `main` klein und die Kernlogik unabhängig vom Prozess. Schreibe Tests für leere Eingabe, jede Stufe, unbekannte Stufe, fehlende Meldung, CRLF und einen Fehler in einer späteren Zeile. Der spätere Fehlerfall prüft, dass ein bereits teilweise berechnetes Ergebnis nicht unbemerkt als vollständig ausgegeben wird.

  Im README stehen Installation, unterstütztes Format, Beispiele, Fehlerverhalten und bekannte Grenzen. `cargo fmt`, Clippy und Tests laufen in CI. Ein Release-Build wird mit denselben Fixtures geprüft. Speichere keine produktiven Logdateien mit Geheimnissen im Repository; synthetische Beispieldaten reichen aus und lassen sich dauerhaft erklären.

  Entscheidungen sollen begründet sein: Warum synchron? Weil eine einzelne lokale Datei zuerst keinen Task-Overhead braucht. Warum ein Enum? Weil die erlaubten Stufen endlich und explizit sind. Warum ein Reader-Parameter? Weil Fachlogik ohne Dateisystem testbar sein soll. Diese Antworten sind im Gespräch wertvoller als eine lange Liste eingesetzter Crates.

  > [!INTERVIEW]
  > Präsentiere den Ablauf aus Nutzersicht, dann eine technische Abwägung und einen Fehlerfall. Zeige etwa, wie eine ungültige Zeile mit Nummer gemeldet wird und warum kein Erfolgsbericht danebensteht. Das belegt Verständnis von Datenintegrität und Schnittstellen.

  ## Häufige Fehler und Zusammenfassung

  - Definiere gültige, ignorierte und fehlerhafte Daten getrennt.
  - Parser benötigen weder Dateisystem noch Konsolenausgabe.
  - Reader und Writer halten I/O testbar und Fehler sichtbar.
  - Verwirf keine Lesefehler mit `filter_map(Result::ok)`.
  - CLI-Argumente, Hilfetext und Exit-Status sind Teil des Vertrags.
  - Stabile Ausgabe braucht eine definierte Reihenfolge.
  - Liefere Fixtures, Tests und eine nachvollziehbare Anleitung mit.
exercises:
- id: teilbericht
  type: choice
  title: Eine kaputte dritte Zeile
  prompt: Die strenge Variante liest zwei gültige Zeilen, dann eine ungültige. Welches Verhalten erfüllt den Vertrag?
  options:
  - text: Fehler mit Zeilennummer und Fehlerstatus; kein vollständiger Erfolgsbericht.
    correct: true
    why: Die Datei konnte nicht vollständig gemäß Format verarbeitet werden.
  - text: Die ungültige Zeile unbemerkt überspringen.
    correct: false
    why: Das würde unvollständige Daten als vollständiges Ergebnis verkaufen.
  - text: Mit Erfolg nur die ersten zwei Zeilen melden.
    correct: false
    why: Ein Aufrufer könnte den Teilbericht nicht erkennen.
  explanation: Strenge Verarbeitung muss einen Fehler sichtbar bewahren. Eine tolerante Variante braucht einen eigenen
    dokumentierten Vertrag für Teilberichte.
  resources:
  - *id001
- id: cli-schichten
  type: order
  title: Von Argumenten zum Ergebnis
  prompt: Ordne den regulären Erfolgsablauf.
  lang: text
  lines: |-
    Argumente in Config validieren
    Eingabedatei öffnen
    Zeilen lesen und fachlich parsen
    Zusammenfassung fertigstellen
    Bericht auf stdout schreiben
    Erfolgsstatus zurückgeben
  explanation: Argumente werden vor dem Dateiöffnen geprüft. Erst die vollständig erfolgreiche Auswertung erlaubt
    den abschließenden Bericht.
  resources:
  - *id001
- id: sortierte-ausgabe
  type: output
  title: Stabile Zusammenfassung
  prompt: Was gibt dieses Programm aus? Gib jede Ausgabezeile an.
  lang: rust
  code: |-
    use std::collections::BTreeMap;
    fn main() {
        let mut counts = BTreeMap::new();
        for s in ["WARN", "INFO", "WARN"] { *counts.entry(s).or_insert(0) += 1; }
        for (s, n) in counts { println!("{s} {n}"); }
    }
  expected: |-
    INFO 1
    WARN 2
  explanation: BTreeMap iteriert in Schlüsselreihenfolge. Dadurch bleibt die Ausgabe unabhängig von der Reihenfolge
    des ersten Auftretens stabil.
  resources:
  - *id001
- id: zeilennummer
  type: output
  title: Menschen zählen ab eins
  prompt: Was gibt dieses Programm aus? Gib jede Ausgabezeile an.
  lang: rust
  code: |-
    fn main() {
        for (index, text) in "a

    c".lines().enumerate() {
            if !text.is_empty() { println!("{}:{text}", index + 1); }
        }
    }
  expected: |-
    1:a
    3:c
  explanation: enumerate zählt auch die später ignorierte Leerzeile mit. Die Addition von eins macht daraus physische
    Zeilennummern für Nutzer.
  resources:
  - *id001
- id: reader-fehler
  type: gap
  title: Lesefehler erhalten
  prompt: Ergänze die Fehlerweitergabe beim Lesen.
  lang: rust
  code: |-
    use std::io::{self, BufRead};
    fn anzahl(reader: impl BufRead) -> io::Result<usize> {
        let mut n = 0;
        for line in reader.lines() {
            let text = line⟦?⟧;
            if !text.is_empty() { n += 1; }
        }
        Ok(n)
    }
    fn main() {}
  gaps:
  - label: Lücke 1
    hint: Verwende den Operator zur Result-Weitergabe.
  explanation: Jede gelesene Zeile kann fehlschlagen. Der Operator beendet die Auswertung mit der Ursache, statt
    den Datensatz wegzufiltern.
  resources:
  - *id001
- id: writer-bericht
  type: gap
  title: Ausgabe als überprüfbare Grenze
  prompt: Ergänze den Writer-Trait und das Makro für eine formatierte Zeile.
  lang: rust
  code: |-
    use std::io::{self, Write};
    fn bericht(mut out: impl ⟦Write⟧, n: usize) -> io::Result<()> {
        ⟦writeln!⟧(out, "Anzahl: {n}")
    }
    fn main() {}
  gaps:
  - label: Lücke 1
    hint: Die importierte I/O-Schnittstelle heißt Write.
  - label: Lücke 2
    hint: Die Variante mit Zeilenende lautet writeln!.
  explanation: Write erlaubt Datei, stdout oder einen Bytepuffer. Das Result bewahrt Fehler beim Schreiben.
  resources:
  - *id001
- id: release-start
  type: command
  title: Argumente an das Binary geben
  prompt: Starte mit Cargo den Release-Build und übergib `app.log` als Argument an das Programm.
  answers:
  - cargo run --release -- app.log
  explanation: Der Trenner `--` beendet die Cargo-Optionen. Danach folgen Argumente für das ausgeführte Binary.
  resources:
  - *id001
- id: diagnose-strom
  type: bug
  title: Eine Pipe erhält Fehlertext als Nutzdaten
  prompt: Die Fehlermeldung landet auf stdout und verunreinigt einen maschinenlesbaren Bericht. Korrigiere die Ausgabezeile.
  lang: rust
  code: |-
    fn main() {
        let error = "Datei fehlt";
        println!("logwerk: {error}");
    }
  lines:
  - 3
  fix:
  - line: 3
    answers:
    - 'eprintln!("logwerk: {error}");'
  explanation: Diagnosen gehören auf stderr. Das hält stdout für den dokumentierten Ergebnisstrom nutzbar; zusätzlich
    benötigt das echte Programm einen passenden Fehlerstatus.
  resources:
  - *id001
- id: result-option
  type: explain
  title: Drei fachliche Ausgänge
  prompt: Erkläre, warum der Parser Result<Option<Stufe>, Fehler> statt Option<Stufe> zurückgibt.
  lang: rust
  code: |-
    enum Stufe { Info, Warn, Error }
    enum Fehler { UnbekannteStufe, MeldungFehlt }
    fn parse_zeile(text: &str) -> Result<Option<Stufe>, Fehler> {
        if text.is_empty() { return Ok(None); }
        Ok(Some(Stufe::Info)) // verkürzter Erfolgsfall
    }
  points:
  - Ok(Some) steht für eine gültige auswertbare Zeile.
  - Ok(None) steht für eine bewusst ignorierte Zeile.
  - Err bewahrt eine ungültige Eingabe mit Ursache.
  - Ein Option allein könnte ignoriert und fehlerhaft nicht unterscheiden.
  explanation: Der Typ bildet die drei fachlichen Ergebnisse direkt ab. Die äußere Schleife kann Leerzeilen überspringen
    und bei Fehlern mit Kontext abbrechen. Der gezeigte Funktionsrumpf ist bewusst nur ein gekürztes Vertragsschema.
  resources:
  - *id001
- id: logzaehler
  type: practice
  title: Eine strenge Mini-Auswertung
  prompt: Schreibe eine Funktion, die Textzeilen mit INFO, WARN oder ERROR und nicht leerer Meldung zählt. Leere
    Zeilen werden ignoriert. Ungültige Zeilen liefern ihre physische Zeilennummer. Teste normale Daten und einen
    Fehler nach einer Leerzeile.
  lang: rust
  solution: |-
    fn zaehlen(text: &str) -> Result<usize, usize> {
        let mut count = 0;
        for (index, line) in text.lines().enumerate() {
            let line = line.trim();
            if line.is_empty() { continue; }
            let Some((level, message)) = line.split_once(' ') else { return Err(index + 1); };
            if !matches!(level, "INFO" | "WARN" | "ERROR") || message.trim().is_empty() {
                return Err(index + 1);
            }
            count += 1;
        }
        Ok(count)
    }
    #[test]
    fn gueltig() {
        assert_eq!(zaehlen("INFO Start

    ERROR Ende
    "), Ok(2));
        assert_eq!(zaehlen(""), Ok(0));
    }
    #[test]
    fn fehlerposition() {
        assert_eq!(zaehlen("INFO Start

    DEBUG Nein"), Err(3));
        assert_eq!(zaehlen("WARN "), Err(1));
    }
    fn main() { println!("{:?}", zaehlen("INFO Start")); }
  checklist:
  - INFO, WARN und ERROR werden akzeptiert.
  - Leere Zeilen verändern die Anzahl nicht.
  - Ungültige Daten beenden die Verarbeitung mit physischer Zeilennummer.
  - Eine leere Meldung ist ungültig.
  - Tests prüfen Erfolg, leere Eingabe und späten Fehler.
  explanation: Der Parser zählt alle physischen Zeilen, entscheidet aber nur für gültige Daten über den Erfolgszähler.
    Der frühe Fehler verhindert einen scheinbar vollständigen Teilbericht.
  resources:
  - *id001
