- id: clap-subcommand
  type: gap
  title: Zwei Befehle und eine Umgebungsvariable
  prompt: |
    `logwerk` soll die Subcommands `zaehlen` und `filtern` haben. Ohne `--stufe` liest `filtern` die Mindeststufe aus der Umgebungsvariable `LOGWERK_STUFE`, sonst gilt `warn`. Ergänze das Attribut am Feld, das Derive des Enums und die Angabe im `#[arg]`-Attribut. Die Abhängigkeit ist `clap = { version = "4.6", features = ["derive", "env"] }`.
  lang: rust
  code: |-
    use std::path::PathBuf;
    use clap::{Parser, Subcommand};

    #[derive(Parser)]
    #[command(name = "logwerk")]
    struct Cli {
        #[command(⟦subcommand⟧)]
        befehl: Befehl,
    }

    #[derive(⟦Subcommand⟧)]
    enum Befehl {
        /// Zählt die Zeilen je Stufe
        Zaehlen { datei: PathBuf },
        /// Gibt nur Zeilen ab einer Mindeststufe aus
        Filtern {
            #[arg(long, ⟦env = "LOGWERK_STUFE"⟧, default_value = "warn")]
            stufe: String,
            datei: PathBuf,
        },
    }

    fn main() {
        match Cli::parse().befehl {
            Befehl::Zaehlen { datei } => println!("zähle {}", datei.display()),
            Befehl::Filtern { stufe, datei } => println!("{} ab {stufe}", datei.display()),
        }
    }
  gaps:
  - label: Feld für den Befehl
    hint: Das Attribut sagt clap, dass hier ein Subcommand-Enum eingebettet ist. Es heißt wie das Konzept, kleingeschrieben.
  - label: Derive des Enums
    hint: Der Trait ist schon importiert.
  - label: Umgebungsvariable
    hint: "`env` allein würde den Namen aus dem Feld ableiten (`STUFE`). Gib den Namen ausdrücklich an."
  explanation: |
    `#[command(subcommand)]` bettet ein Enum ein, dessen Varianten `#[derive(Subcommand)]` zu Befehlen macht; clap schreibt sie in kebab-case, aus `Zaehlen` wird `zaehlen`. Die Doc-Kommentare der Varianten erscheinen in `logwerk --help`. `env = "LOGWERK_STUFE"` liest die Variable, wenn `--stufe` fehlt, und zeigt sie in der Hilfe als `[env: LOGWERK_STUFE=]`; das braucht das Feature `env`. Ein bloßes `env` hätte den Namen aus dem Feld abgeleitet, hier `STUFE`. Lokal ergab `LOGWERK_STUFE=error logwerk filtern app.log` die Ausgabe `app.log ab error`, ohne Variable `app.log ab warn`.
  resources:
  - title: clap Derive · Arg-Attribute
    url: https://docs.rs/clap/latest/clap/_derive/index.html#arg-attributes
  - title: clap Derive · Subcommand-Typen
    url: https://docs.rs/clap/latest/clap/_derive/index.html#subcommand-types
