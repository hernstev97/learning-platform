    url: https://doc.rust-lang.org/std/macro.eprintln.html
- id: broken-pipe
  type: bug
  title: Panik hinter head
  prompt: |
    `logwerk filtern gross.log | head -1` zeigt die erste Zeile und danach:

    ```text
    thread 'main' (1427964) panicked at library/std/src/io/stdio.rs:1168:9:
    failed printing to stdout: Broken pipe (os error 32)
    ```

    Der Exit-Status ist 101, obwohl `main` den Fall `BrokenPipe` ausdrücklich behandelt. Außerdem ist die Ausgabe an Pipes langsam. Finde die Zeile und korrigiere sie.
  lang: rust
  code: |-
    use std::io::{self, BufWriter, ErrorKind, Write};

    fn ausgeben(zeilen: &[String]) -> io::Result<()> {
        let mut out = BufWriter::new(io::stdout().lock());
        for zeile in zeilen {
            println!("{zeile}");
        }
        out.flush()
    }

    fn main() {
        let zeilen: Vec<String> = (1..=100_000).map(|n| format!("WARN disk {n}")).collect();
        match ausgeben(&zeilen) {
            Ok(()) => {}
            Err(e) if e.kind() == ErrorKind::BrokenPipe => {}
            Err(e) => eprintln!("logwerk: {e}"),
        }
    }
  lines:
  - 6
  fix:
  - line: 6
    answers:
    - writeln!(out, "{zeile}")?;
    - writeln!(out, "{}", zeile)?;
    - writeln!(&mut out, "{zeile}")?;
  hints:
  - Wohin schreibt `println!`, und wofür wurde `out` angelegt?
  - "`println!` panikt bei einem Schreibfehler. Welches Makro liefert den Fehler als `io::Result`?"
  explanation: |
    `println!` schreibt an `out` vorbei direkt auf stdout und panikt, sobald `head` die Pipe geschlossen hat; der `match` in `main` sieht den Fehler nie. Der `BufWriter` bleibt leer und bringt nichts, also läuft jede Zeile einzeln durch den zeilengepufferten stdout. `writeln!(out, "{zeile}")?` schreibt in den Puffer und reicht `ErrorKind::BrokenPipe` als `io::Error` nach oben, wo `main` es als normales Ende behandelt. Lokal endete die korrigierte Fassung hinter `head -1` mit Status 0, die fehlerhafte mit 101.
  resources:
  - title: std::print! · Panics und Sperre
    url: https://doc.rust-lang.org/std/macro.print.html#panics
  - title: ErrorKind::BrokenPipe
    url: https://doc.rust-lang.org/std/io/enum.ErrorKind.html#variant.BrokenPipe
- id: result-option
  type: explain
  title: Drei fachliche Ausgänge
  prompt: Erkläre, warum der Parser Result<Option<Stufe>, Fehler> statt Option<Stufe> zurückgibt.
  lang: rust
  code: |-
    enum Stufe { Info, Warn, Error }
    enum Fehler { UnbekannteStufe, MeldungFehlt }
    fn parse_zeile(text: &str) -> Result<Option<Stufe>, Fehler> {
        if text.is_empty() { return Ok(None); }
        Ok(Some(Stufe::Info)) // verkürzter Erfolgsfall
    }
  points:
  - Ok(Some) steht für eine gültige auswertbare Zeile.
  - Ok(None) steht für eine bewusst ignorierte Zeile.
  - Err bewahrt eine ungültige Eingabe mit Ursache.
  - Ein Option allein könnte ignoriert und fehlerhaft nicht unterscheiden.
  explanation: Der Typ bildet die drei fachlichen Ergebnisse direkt ab. Die äußere Schleife kann Leerzeilen überspringen
    und bei Fehlern mit Kontext abbrechen. Der gezeigte Funktionsrumpf ist bewusst nur ein gekürztes Vertragsschema.
  resources:
  - *id001
- id: logzaehler
  type: practice
  title: Eine strenge Mini-Auswertung
  prompt: Schreibe eine Funktion, die Textzeilen mit INFO, WARN oder ERROR und nicht leerer Meldung zählt. Leere
    Zeilen werden ignoriert. Ungültige Zeilen liefern ihre physische Zeilennummer. Teste normale Daten und einen
    Fehler nach einer Leerzeile.
  lang: rust
  solution: |-
    fn zaehlen(text: &str) -> Result<usize, usize> {
        let mut count = 0;
        for (index, line) in text.lines().enumerate() {
            let line = line.trim();
            if line.is_empty() { continue; }
            let Some((level, message)) = line.split_once(' ') else { return Err(index + 1); };
            if !matches!(level, "INFO" | "WARN" | "ERROR") || message.trim().is_empty() {
                return Err(index + 1);
            }
            count += 1;
        }
        Ok(count)
    }
    #[test]
    fn gueltig() {
        assert_eq!(zaehlen("INFO Start

    ERROR Ende
    "), Ok(2));
        assert_eq!(zaehlen(""), Ok(0));
    }
    #[test]
    fn fehlerposition() {
        assert_eq!(zaehlen("INFO Start

    DEBUG Nein"), Err(3));
        assert_eq!(zaehlen("WARN "), Err(1));
    }
    fn main() { println!("{:?}", zaehlen("INFO Start")); }
  checklist:
  - INFO, WARN und ERROR werden akzeptiert.
  - Leere Zeilen verändern die Anzahl nicht.
  - Ungültige Daten beenden die Verarbeitung mit physischer Zeilennummer.
  - Eine leere Meldung ist ungültig.
  - Tests prüfen Erfolg, leere Eingabe und späten Fehler.
  explanation: Der Parser zählt alle physischen Zeilen, entscheidet aber nur für gültige Daten über den Erfolgszähler.
    Der frühe Fehler verhindert einen scheinbar vollständigen Teilbericht.
  resources:
  - *id001
- id: konfig-schichten
  type: practice
  title: Stufe aus Kommandozeile, Umgebung und Datei
  prompt: |
    Baue für `logwerk` die Auswahl der Mindeststufe. Quellen in dieser Reihenfolge: `--stufe`, die Umgebungsvariable `LOGWERK_STUFE`, das Feld `stufe` in `logwerk.toml` (Pfad per `--konfig` änderbar), sonst `warn`.

    - Erlaubt sind `info`, `warn`, `error`, auf der Kommandozeile wie in der Datei.
    - Fehlt die Datei, gilt das als leere Konfiguration. Eine kaputte Datei oder ein unbekannter Schlüssel ist ein Fehler mit Dateiname und Position auf stderr und Status 1.
    - Die Vorrangregel steckt in einer reinen Funktion mit Tests, die weder Dateien noch Umgebungsvariablen anfassen.
    - Das Programm gibt `Stufe: Warn` (bzw. die gewählte Stufe) aus.

    Abhängigkeiten: `clap` 4.6 mit `derive` und `env`, `serde` 1 mit `derive`, `toml` 1.1. Probiere es mit und ohne Datei, mit `LOGWERK_STUFE=error` und mit einem Tippfehler in der Datei aus.
  lang: rust
  solution: |-
    use std::path::{Path, PathBuf};
    use std::process::ExitCode;

    use clap::{Parser, ValueEnum};
    use serde::Deserialize;

    #[derive(Clone, Copy, Debug, PartialEq, Eq, Deserialize, ValueEnum)]
    #[serde(rename_all = "lowercase")]
    enum Stufe {
        Info,
        Warn,
        Error,
    }

    /// Filtert Logzeilen ab einer Mindeststufe.
    #[derive(Parser)]
    #[command(name = "logwerk")]
    struct Cli {
        /// Mindeststufe, schlägt Umgebung und Datei
        #[arg(long, value_enum, env = "LOGWERK_STUFE")]
        stufe: Option<Stufe>,
        /// Konfigurationsdatei
        #[arg(long, default_value = "logwerk.toml")]
        konfig: PathBuf,
    }

    #[derive(Debug, Default, Deserialize)]
    #[serde(default, deny_unknown_fields)]
    struct Datei {
        stufe: Option<Stufe>,
    }

    fn stufe_waehlen(cli_oder_env: Option<Stufe>, datei: Option<Stufe>) -> Stufe {
        cli_oder_env.or(datei).unwrap_or(Stufe::Warn)
    }

    fn datei_lesen(pfad: &Path) -> Result<Datei, String> {
        match std::fs::read_to_string(pfad) {
            Ok(text) => toml::from_str(&text).map_err(|e| format!("{}: {e}", pfad.display())),
            Err(e) if e.kind() == std::io::ErrorKind::NotFound => Ok(Datei::default()),
            Err(e) => Err(format!("{}: {e}", pfad.display())),
        }
    }

    fn main() -> ExitCode {
        let cli = Cli::parse();
        match datei_lesen(&cli.konfig) {
            Ok(datei) => {
                println!("Stufe: {:?}", stufe_waehlen(cli.stufe, datei.stufe));
                ExitCode::SUCCESS
            }
            Err(fehler) => {
                eprintln!("logwerk: {fehler}");
                ExitCode::FAILURE
            }
        }
    }

    #[cfg(test)]
    mod tests {
        use super::*;

        #[test]
        fn vorrang() {
            assert_eq!(stufe_waehlen(Some(Stufe::Error), Some(Stufe::Info)), Stufe::Error);
            assert_eq!(stufe_waehlen(None, Some(Stufe::Info)), Stufe::Info);
            assert_eq!(stufe_waehlen(None, None), Stufe::Warn);
        }

        #[test]
        fn datei_streng() {
            assert!(toml::from_str::<Datei>("stuffe = \"info\"").is_err());
            let datei: Datei = toml::from_str("stufe = \"error\"").unwrap();
            assert_eq!(datei.stufe, Some(Stufe::Error));
        }
    }
  checklist:
  - Ein Enum mit `ValueEnum` und `Deserialize` (`rename_all = "lowercase"`) beschreibt die drei Stufen für beide Quellen.
  - "Das clap-Feld ist `Option<Stufe>` mit `env = \"LOGWERK_STUFE\"` und ohne Standardwert, damit die Datei noch greifen kann."
  - "Die Dateistruktur nutzt `#[serde(default, deny_unknown_fields)]`."
  - Eine fehlende Datei (`ErrorKind::NotFound`) ergibt die Standardkonfiguration, jeder andere Lese- oder Parsefehler einen Fehler mit Dateinamen.
  - Die Vorrangfunktion ist rein und hat Tests für alle drei Stufen der Regel.
  - "`main` gibt `ExitCode` zurück: 0 bei Erfolg, 1 bei Konfigurationsfehlern; Nutzungsfehler meldet clap mit 2."
  verify: false
  hints:
  - Lässt du `default_value_t` weg und machst das Feld zu `Option<Stufe>`, erledigt clap die ersten beiden Quellen und liefert `None`, wenn beide fehlen.
  - "`std::fs::read_to_string` liefert bei fehlender Datei einen Fehler mit `kind() == ErrorKind::NotFound`."
  - "`Option::or` und `unwrap_or` reichen für die Vorrangfunktion."
  explanation: |
    clap legt Kommandozeile und Umgebung zusammen; mit `Option<Stufe>` und ohne Standardwert bleibt erkennbar, ob eine der beiden Quellen etwas geliefert hat. Datei und Standard verbindet die reine Funktion `stufe_waehlen`, die ohne Dateisystem und ohne `set_var` testbar ist. `deny_unknown_fields` macht aus `stuffe = "info"` die Meldung ``unknown field `stuffe`, expected `stufe` `` mit Zeile und Spalte, statt den Schlüssel zu ignorieren. Eine fehlende Datei ist der Normalfall bei frischen Installationen und darf keinen Fehler auslösen. Lokal ergaben die Läufe ohne Datei `Warn`, mit `stufe = "info"` `Info`, mit `LOGWERK_STUFE=error` `Error` und mit zusätzlichem `--stufe warn` wieder `Warn`; `--stufe laut` endete mit Status 2.
  resources:
  - title: serde · deny_unknown_fields
    url: https://serde.rs/container-attrs.html#deny_unknown_fields
  - title: toml::from_str
    url: https://docs.rs/toml/latest/toml/fn.from_str.html
  - title: clap Derive · Arg-Attribute
    url: https://docs.rs/clap/latest/clap/_derive/index.html#arg-attributes
