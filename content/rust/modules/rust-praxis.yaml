- id: vorrang-regel
  type: output
  title: Wer gewinnt die Stufe?
  prompt: |
    `waehle` setzt die Vorrangregel Kommandozeile vor Umgebung vor Datei vor Standard um. Was gibt das Programm aus? Gib jede Ausgabezeile an.
  lang: rust
  code: |-
    fn waehle<'a>(cli: Option<&'a str>, env: Option<&'a str>, datei: Option<&'a str>) -> &'a str {
        cli.or(env).or(datei).unwrap_or("warn")
    }

    fn main() {
        println!("[{}]", waehle(None, Some("error"), Some("info")));
        println!("[{}]", waehle(Some("debug"), None, Some("info")));
        println!("[{}]", waehle(None, Some(""), Some("info")));
        println!("[{}]", waehle(None, None, None));
    }
  expected: |-
    [error]
    [debug]
    []
    [warn]
  hints:
  - "`a.or(b)` liefert `a`, wenn es `Some` ist, sonst `b`."
  - Ist `Some("")` ein Wert oder keiner?
  explanation: |
    `Option::or` nimmt den ersten Wert, der `Some` ist, `unwrap_or` greift nur, wenn alle drei `None` sind. Die dritte Zeile ist die Falle: `Some("")` ist ein Wert, also schlägt die leere Umgebung die Datei, und die Ausgabe ist `[]`. Genau das passiert mit `LOGWERK_STUFE=` in der Shell, denn `env::var` liefert dafür `Ok("")`, nicht `NotPresent`. Soll ein leerer Wert nicht zählen, filtere ihn vorher: `env.filter(|s| !s.is_empty())`. Weil die Regel eine reine Funktion ist, prüfst du solche Fälle ohne Dateien und ohne `set_var`.
  resources:
  - title: Option::or
    url: https://doc.rust-lang.org/std/option/enum.Option.html#method.or
  - title: std::env::var
    url: https://doc.rust-lang.org/std/env/fn.var.html
