  type: order
  title: Ein Objekt fertigstellen
  prompt: Sortiere die voneinander abhängigen Zeilen.
  lang: rust
  lines: |-
    struct Auftrag { fertig: bool }
    fn main() {
        let mut auftrag = Auftrag { fertig: false };
        auftrag.fertig = true;
        println!("{}", auftrag.fertig);
    }
  explanation: Erst existiert der Typ, dann wird der Wert erzeugt und geändert. Die Ausgabe liest den geänderten
    Zustand.
  resources:
  - *id001
- id: enum-ausgabe
  type: output
  title: Die erste passende Variante
  prompt: Was gibt dieses Programm aus? Gib jede Ausgabezeile an.
  lang: rust
  code: |-
    fn main() {
        let wert = Some(9);
        let text = match wert {
            Some(n) if n > 10 => "hoch",
            Some(_) => "normal",
            None => "leer",
        };
        println!("{text}");
    }
  expected: normal
  explanation: Der Guard des ersten Arms ist falsch. Der zweite Arm behandelt alle übrigen Some-Werte.
  resources:
  - *id001
- id: struct-update
  type: output
  title: Ein Feld überschreiben
  prompt: Was gibt dieses Programm aus? Gib jede Ausgabezeile an.
  lang: rust
  code: |-
    #[derive(Clone, Copy)]
    struct Punkt { x: i32, y: i32 }
    fn main() {
        let a = Punkt { x: 2, y: 3 };
        let b = Punkt { x: 9, ..a };
        println!("{} {}", a.x, b.y);
    }
  expected: 2 3
  explanation: '`x` wird für `b` ersetzt, `y` aus `a` übernommen. Der Typ ist Copy, deshalb bleibt `a` vollständig
    nutzbar.'
  resources:
  - *id001
- id: methode-borrow
  type: gap
  title: Ein lesender Zugriff
  prompt: Ergänze den Methodenempfänger für einen ausschließlich lesenden Zugriff.
  lang: rust
  code: |-
    struct Auftrag { fertig: bool }
    impl Auftrag {
        fn offen(⟦&self⟧) -> bool { !self.fertig }
    }
    fn main() {
        let a = Auftrag { fertig: false };
        println!("{} {}", a.offen(), a.offen());
    }
  gaps:
  - label: Lücke 1
    hint: Die Methode braucht eine geteilte Referenz auf self.
  explanation: '`&self` leiht das Objekt geteilt. Die Methode kann mehrfach aufgerufen werden, ohne Besitz zu verlieren.'
  resources:
  - *id001
- id: option-match
  type: gap
  title: Fehlende Auswahl behandeln
  prompt: Ergänze ausschließlich die beiden Variantenmuster.
  lang: rust
  code: |-
    fn titel(id: Option<u64>) -> String {
        match id {
            ⟦Some(id)⟧ => format!("Auftrag {id}"),
            ⟦None⟧ => "Keine Auswahl".to_owned(),
        }
    }
    fn main() { println!("{}", titel(Some(2))); }
  gaps:
  - label: Lücke 1
    hint: Die vorhandene ID steckt in Some.
  - label: Lücke 2
    hint: Der fehlende Fall heißt None.
  explanation: Der Some-Arm bindet die Nutzdaten an `id`. Der None-Arm behandelt das legitime Fehlen explizit.
  resources:
  - *id001
- id: let-else
  type: gap
  title: Den Erfolgsfall im Blick behalten
  prompt: Ergänze Muster und frühen Ausstieg.
  lang: rust
  code: |-
    fn zeige(wert: Option<i32>) {
        let ⟦Some(n)⟧ = wert else { ⟦return⟧; };
        println!("{n}");
    }
    fn main() { zeige(Some(4)); }
  gaps:
  - label: Lücke 1
    hint: Zerlege Some und binde die Zahl als n.
  - label: Lücke 2
    hint: Verlasse die Funktion ohne Rückgabewert.
  explanation: Der else-Zweig verlässt die Funktion. Danach ist `n` garantiert gebunden und kann ohne weitere Verschachtelung
    genutzt werden.
  resources:
  - *id001
- id: falscher-status
  type: bug
  title: Ein erledigter Auftrag bleibt offen
  prompt: Nach dem Aufruf meldet `offen()` weiterhin true. Korrigiere die einzige falsche Zustandsänderung.
  lang: rust
  code: |-
    struct Auftrag { fertig: bool }
    impl Auftrag {
        fn abschliessen(&mut self) {
            self.fertig = false;
        }
        fn offen(&self) -> bool { !self.fertig }
    }
    fn main() {
        let mut a = Auftrag { fertig: false };
        a.abschliessen();
        println!("{}", a.offen());
    }
  lines:
  - 4
  fix:
  - line: 4
    answers:
    - self.fertig = true;
  explanation: Die Methode soll in den fertigen Zustand wechseln. `offen()` ist korrekt als Negation implementiert;
    die Änderung muss deshalb true setzen.
  resources:
  - *id001
- id: referenz-match
  type: explain
  title: Daten lesen, ohne sie zu nehmen
  prompt: Warum kann der aufrufende Code den Zustand nach dieser Funktion weiterverwenden?
  lang: rust
  code: |-
    enum Zustand { Bereit(String), Leer }
    fn laenge(zustand: &Zustand) -> usize {
        match zustand {
            Zustand::Bereit(text) => text.len(),
            Zustand::Leer => 0,
        }
    }
  points:
  - Der Parameter leiht Zustand geteilt.
  - Der Match bindet text als geliehenen String.
  - Es wird kein String geklont oder konsumiert.
  - Beide Varianten werden abgedeckt.
  explanation: Die Funktion hat nur `&Zustand`. Beim Zerlegen werden die enthaltenen Daten daher geliehen. Die berechnete
    Länge ist ein eigenständiger usize-Wert; der ursprüngliche Zustand bleibt beim Aufrufer.
  resources:
  - *id001
- id: auftrag-zustand
  type: practice
  title: Einen Arbeitsablauf modellieren
  prompt: Definiere `Auftrag` mit ID und einem Status-Enum `Offen`, `Erledigt`, `Blockiert(String)`. Implementiere
    eine lesende Methode `anzeige()`, die alle Fälle erklärt. Teste die blockierte Variante.
  lang: rust
  solution: |
    enum Status { Offen, Erledigt, Blockiert(String) }
    struct Auftrag { id: u64, status: Status }
    impl Auftrag {
        fn anzeige(&self) -> String {
            let status = match &self.status {
                Status::Offen => "offen".to_owned(),
                Status::Erledigt => "erledigt".to_owned(),
                Status::Blockiert(grund) => format!("blockiert: {grund}"),
            };
            format!("{}: {status}", self.id)
        }
    }
    fn main() {
        let a = Auftrag { id: 3, status: Status::Offen };
        println!("{}", a.anzeige());
    }
    #[test]
    fn blockierung_enthaelt_grund() {
        let a = Auftrag { id: 9, status: Status::Blockiert("Zugang fehlt".into()) };
        assert_eq!(a.anzeige(), "9: blockiert: Zugang fehlt");
    }
  checklist:
  - Blockiert trägt zwingend einen Grund.
  - Die Anzeige behandelt jede Variante ohne pauschalen Restarm.
  - Die Methode leiht das Objekt und erhält seine Nutzbarkeit.
  - Ein Test prüft ID und Ursache gemeinsam.
  explanation: Das Enum koppelt den Blockierungsgrund an den blockierten Zustand. Die Methode kapselt die Darstellung,
    ohne den Status zu konsumieren. Ein weiteres Statusfeld oder parallele Booleans wären redundant.
  resources:
  - *id001
