id: structs-enums
title: Structs, Enums & Pattern Matching
level: 1
minutes: 150
summary: Fachliche Daten so modellieren, dass zusammengehörige Werte und alternative Zustände im Typ sichtbar werden.
goals:
- Du definierst Structs und Methoden mit passenden self-Empfängern.
- Du modellierst alternative Zustände mit Enum-Nutzdaten.
- Du zerlegst Werte vollständig mit match und gezielt mit if let.
- Du behandelst fehlende Werte mit Option und let else.
resources:
- &id001
  title: Rust Book · Structs
  url: https://doc.rust-lang.org/book/ch05-01-defining-structs.html
- title: Rust Book · Methods
  url: https://doc.rust-lang.org/book/ch05-03-method-syntax.html
- title: Rust Book · Enums
  url: https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html
- title: Rust Book · Pattern Matching
  url: https://doc.rust-lang.org/book/ch06-02-match.html
lesson: |
  Ein Dienst meldet entweder „bereit“, „lädt gerade“ oder „fehlgeschlagen“. Modellierst du das mit drei Booleans und einem optionalen Fehlertext, entstehen widersprüchliche Kombinationen: bereit und gleichzeitig fehlgeschlagen, Fehlerstatus ohne Meldung oder Erfolg ohne Ergebnis. Der Code muss diese Kombinationen dann überall nachträglich abfangen.

  Rust bietet zwei zusammengehörende Werkzeuge: Structs bündeln Werte, die zusammengehören, und Enums beschreiben Alternativen. Pattern Matching zerlegt diese Modelle wieder und zwingt dich, die relevanten Fälle zu behandeln. Ein gutes Modell macht einen Teil der Fehler bereits beim Erzeugen unmöglich. In diesem Modul baust du deshalb keinen Stammbaum aus Klassen, sondern kleine Datentypen mit klaren Zuständen und Übergängen.

  ## Structs bündeln zusammengehörige Felder

  Ein benannter Struct gibt jedem Feld einen fachlichen Namen. Das macht Aufrufe lesbarer als ein Tupel aus mehreren gleichartigen Strings. Die [Struct-Dokumentation](https://doc.rust-lang.org/book/ch05-01-defining-structs.html) zeigt die vollständige Syntax und die Kurzschreibweise bei gleichen Namen.

  ```rust
  #[derive(Debug)]
  struct Auftrag {
      id: u64,
      titel: String,
      erledigt: bool,
  }

  fn main() {
      let titel = String::from("Backup prüfen");
      let auftrag = Auftrag { id: 7, titel, erledigt: false };
      println!("{}: {}", auftrag.id, auftrag.titel);
  }
  ```

  `titel` im Konstruktor ist kurz für `titel: titel`. Der String wird in den Struct verschoben. Der Struct besitzt ihn nun und räumt ihn auf. `#[derive(Debug)]` erzeugt eine technische Darstellung für `{:?}`. Sie ist zum Prüfen und Entwickeln gedacht, nicht als stabiles Dateiformat oder verbindliche Ausgabe einer API.

  Rust macht nicht einzelne Struct-Felder mit `mut` veränderbar. Du deklarierst die Bindung veränderbar und veränderst darüber Felder. Ob fremder Code die Felder überhaupt sehen darf, steuerst du später mit Modulgrenzen und `pub`.

  ```rust
  struct Zaehler { wert: u32 }

  fn main() {
      let mut zaehler = Zaehler { wert: 0 };
      zaehler.wert += 1;
      println!("{}", zaehler.wert);
  }
  ```

  Bei der Update-Syntax `NeuerTyp { feld: wert, ..alt }` kommen alle nicht genannten Felder aus `alt`. Das ist keine pauschale tiefe Kopie: Nicht kopierbare Felder können verschoben werden. Nutzt du anschließend das ganze alte Objekt, kann der Compiler einen partiellen Move melden. Eine explizite `clone()`-Operation ist nur sinnvoll, wenn du tatsächlich ein zweites unabhängiges Objekt brauchst.

  ## Methoden drücken erlaubte Operationen aus

  Ein `impl`-Block enthält Funktionen, die zu einem Typ gehören. Eine Funktion mit einem `self`-Parameter ist eine Methode; eine ohne `self` ist eine assoziierte Funktion. `new` ist lediglich ein verbreiteter Name und kein reservierter Konstruktor. Die [Methodensyntax](https://doc.rust-lang.org/book/ch05-03-method-syntax.html) verbindet das mit Ownership.

  ```rust
  #[derive(Debug)]
  struct Auftrag { titel: String, erledigt: bool }

  impl Auftrag {
      fn new(titel: String) -> Self {
          Self { titel, erledigt: false }
      }
      fn ist_offen(&self) -> bool {
          !self.erledigt
      }
      fn abschliessen(&mut self) {
          self.erledigt = true;
      }
      fn in_titel(self) -> String {
          self.titel
      }
  }

  fn main() {
      let mut auftrag = Auftrag::new("Review".to_owned());
      println!("{}", auftrag.ist_offen());
      auftrag.abschliessen();
      println!("{}", auftrag.in_titel());
  }
  ```

  `&self` liest, `&mut self` verändert exklusiv und `self` konsumiert das Objekt. Beim Methodenaufruf fügt Rust geeignete Referenzen automatisch hinzu; du musst nicht `(&auftrag).ist_offen()` schreiben. `in_titel` gibt den String heraus, ohne ihn zu kopieren. Danach ist `auftrag` als Ganzes nicht mehr nutzbar. Solche konsumierenden Methoden passen zu Umwandlungen und finalen Schritten eines Builders.

  > [!PRAXIS]
  > Lass Methoden fachliche Operationen ausdrücken. `abschliessen()` dokumentiert eine erlaubte Handlung besser als wiederholtes Schreiben auf mehrere Statusfelder. Wenn ein Übergang scheitern kann, bekommt die Methode im nächsten Modul einen `Result`-Rückgabewert.

  Tuple-Structs eignen sich für kleine neue Typen: `struct AuftragId(u64);` und `struct KundenId(u64);` verhindern, dass zwei Zahlen gleicher Repräsentation versehentlich vertauscht werden. Ein Typalias würde diese Trennung nicht herstellen. Unit-Structs ohne Felder sind dagegen nützlich, wenn ein Typ Verhalten, aber keine eigenen Daten trägt.

  ## Enums verbinden Alternative und Nutzdaten

  Ein Enum-Wert hat genau eine Variante. Jede Variante darf andere Nutzdaten tragen. Im Unterschied zu einem bloßen Statuscode bleibt die Information damit direkt an den passenden Zustand gebunden. Die [Enum-Einführung](https://doc.rust-lang.org/book/ch06-01-defining-an-enum.html) zeigt dieses Modell auch an `Option<T>`.

  ```rust
  #[derive(Debug)]
  enum Ladezustand {
      Leer,
      Laedt,
      Bereit { anzahl: usize },
      Fehler(String),
  }

  fn beschreibung(zustand: &Ladezustand) -> String {
      match zustand {
          Ladezustand::Leer => "Noch nicht geladen".to_owned(),
          Ladezustand::Laedt => "Lädt".to_owned(),
          Ladezustand::Bereit { anzahl } => format!("{anzahl} Einträge"),
          Ladezustand::Fehler(meldung) => format!("Fehler: {meldung}"),
      }
  }

  fn main() {
      let zustand = Ladezustand::Bereit { anzahl: 3 };
      println!("{}", beschreibung(&zustand));
  }
  ```

  Hier gibt es keinen Zustand „Bereit ohne Anzahl“. Ein Fehler muss eine Meldung tragen. Das heißt nicht, dass jeder fachliche Fehler unmöglich ist: Eine leere Fehlermeldung wäre weiterhin konstruierbar. Typen drücken die wichtigsten strukturellen Regeln aus; zusätzliche Regeln benötigen validierende Funktionen.

  Ein Enum ist nicht automatisch „kostenlos wie ein Integer“. Es muss im Allgemeinen Platz für seine größte Variante und eine Unterscheidung vorhalten; der Compiler kann bestimmte Layouts optimieren. Leite aus der Lesbarkeit des Modells keine exakte Speichergröße ab. Für gewöhnliche Anwendungsmodelle ist zunächst die korrekte Darstellung der Fälle entscheidend.

  ## Pattern Matching ist vollständiges Zerlegen

  `match` ist ein Ausdruck: Jeder Arm liefert einen Wert desselben passenden Ergebnistyps. Der Compiler prüft die Vollständigkeit. Ergänzt du später eine Enum-Variante, zeigen dir fehlende Arme die Stellen, an denen eine fachliche Entscheidung nötig ist. Ein pauschaler `_`-Arm kann diese nützliche Rückmeldung verdecken. Siehe [Exhaustiveness](https://doc.rust-lang.org/book/ch06-02-match.html#matches-are-exhaustive).

  ```rust
  fn kategorie(punkte: u32) -> &'static str {
      match punkte {
          0 => "leer",
          1..=4 => "klein",
          _ => "groß",
      }
  }

  fn main() {
      println!("{}", kategorie(4));
  }
  ```

  Arme werden von oben nach unten betrachtet. Ein früher allgemeiner Arm würde spätere spezielle Fälle unerreichbar machen. Muster können Tupel, Structs und Enum-Nutzdaten gleichzeitig zerlegen. Ein Match Guard `if bedingung` ergänzt eine Bedingung, zählt aber nicht wie ein vollständiges Muster zur Abdeckung aller möglichen Werte.

  ```rust
  fn main() {
      let messung = Some(12);
      let text = match messung {
          Some(wert) if wert > 10 => "hoch",
          Some(_) => "normal",
          None => "fehlt",
      };
      println!("{text}");
  }
  ```

  Beim Match auf einen eigenen `String` können gebundene Nutzdaten verschoben werden. Beim Match auf `&enum_wert` werden sie typischerweise geliehen. Wähle zuerst, ob du das Original später noch brauchst. Mit `match &zustand` lässt sich eine Anzeige ableiten, ohne das Modell zu konsumieren. Das verhindert viele unnötige Klone in Render- und Logging-Funktionen.

  ## Option, if let und let else

  `Option<T>` beschreibt entweder `Some(T)` oder `None`. Es ersetzt fehlende Werte, ohne dass jeder `T` automatisch auch null sein kann. Du musst das Fehlen sichtbar behandeln. Ein Standardwert kann sinnvoll sein, darf aber keinen relevanten Unterschied verschlucken: „kein Messwert“ ist fachlich oft etwas anderes als „Messwert null“.

  ```rust
  fn main() {
      let ids = [4_u64, 8];
      match ids.first() {
          Some(id) => println!("Erste ID: {id}"),
          None => println!("Keine Aufträge"),
      }
  }
  ```

  Wenn nur eine Variante interessant ist, verkürzt `if let` das Muster. Wenn der restliche Funktionskörper einen erfolgreichen Fall voraussetzt, macht `let else` einen frühen Ausstieg lesbar. Der `else`-Zweig muss den aktuellen Kontrollfluss verlassen, etwa mit `return`. Die [Dokumentation zu if let und let else](https://doc.rust-lang.org/book/ch06-03-if-let.html) erklärt diesen Unterschied.

  ```rust
  fn zeige(id: Option<u64>) {
      let Some(id) = id else {
          println!("Keine Auswahl");
          return;
      };
      println!("Auftrag {id}");
  }

  fn main() {
      zeige(None);
      zeige(Some(7));
  }
  ```

  > [!INTERVIEW]
  > Bei „Enum oder mehrere Booleans?“ beginne mit den erlaubten Zuständen. Drei Booleans ermöglichen acht Kombinationen. Sind fachlich nur vier sinnvoll, bildet ein Enum diese vier direkt ab und trägt pro Zustand genau die benötigten Daten.

  ## Häufige Fehler

  - **Update-Syntax als Kopie lesen:** Kontrolliere, ob nicht kopierbare Felder aus dem alten Struct verschoben werden.
  - **Status und Daten auseinanderhalten:** Ein separates `error: bool` plus `message: Option<String>` erlaubt widersprüchliche Werte.
  - **`unwrap()` auf `Option` als Standardlösung:** Kläre den legitimen Fall ohne Wert und behandle ihn sichtbar.
  - **Jeden Match mit `_` beenden:** Bei geschlossenen fachlichen Enums ist explizite Vollständigkeit oft wartbarer.
  - **Match konsumiert versehentlich Nutzdaten:** Matche auf eine Referenz, wenn du nur lesen willst.

  ## Zusammenfassung

  - Structs bündeln gleichzeitig vorhandene Felder.
  - Methoden drücken lesende, verändernde und konsumierende Operationen aus.
  - Enums beschreiben alternative Formen mit passenden Nutzdaten.
  - `match` zerlegt Werte und prüft Vollständigkeit.
  - `Option` macht das Fehlen eines Werts explizit.
  - `if let` behandelt einen interessanten Fall; `let else` vereinfacht frühe Ausstiege.
  - Ein gutes Modell reduziert gültige, aber unsinnige Kombinationen.
exercises:
- id: zustand-modellieren
  type: choice
  title: Widersprüche vermeiden
  prompt: Ein Download ist wartend, erfolgreich mit Dateipfad oder gescheitert mit Ursache. Welches Modell verhindert
    Erfolg ohne Pfad?
  options:
  - text: enum Download { Wartend, Fertig(String), Fehler(String) }
    correct: true
    why: Jede Variante trägt die für sie erforderlichen Daten.
  - text: 'struct Download { fertig: bool, fehler: bool, pfad: Option<String> }'
    correct: false
    why: Fertig kann true sein, während der Pfad fehlt.
  - text: type Download = String;
    correct: false
    why: Ein String unterscheidet die fachlichen Zustände nicht.
  explanation: Ein Enum koppelt die Variante an ihre Nutzdaten. Zusätzliche Inhaltsregeln wie ein nicht leerer Pfad
    benötigen trotzdem Validierung.
  resources:
  - *id001
