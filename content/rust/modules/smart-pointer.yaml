    title: RefCell führt Buch
    prompt: Was gibt dieses Programm aus?
    lang: rust
    code: |
      use std::cell::RefCell;

      fn main() {
          let warteschlange = RefCell::new(vec![1, 2]);
          {
              let lesend = warteschlange.borrow();
              println!("{}", lesend.len());
              println!("{}", warteschlange.try_borrow_mut().is_err());
