      - title: std::rc::Rc::strong_count
        url: https://doc.rust-lang.org/std/rc/struct.Rc.html#method.strong_count
      - title: std::rc::Weak::upgrade
        url: https://doc.rust-lang.org/std/rc/struct.Weak.html#method.upgrade
