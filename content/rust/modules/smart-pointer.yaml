  - id: eigener-smart-pointer
    type: gap
    title: Ein eigener Smart Pointer
    prompt: |
      `Messung<T>` soll sich wie eine Referenz auf den eingepackten Wert benutzen lassen und beim Aufräumen „Import fertig“ ausgeben. Ergänze die fehlenden Teile von `Deref` und `Drop`.
    lang: rust
    code: |
      use std::ops::Deref;

      struct Messung<T> {
          name: &'static str,
          wert: T,
      }

      impl<T> ⟦Deref⟧ for Messung<T> {
          type Target = ⟦T⟧;

          fn deref(&self) -> &T {
              ⟦&self.wert⟧
          }
      }

      impl<T> Drop for Messung<T> {
          fn ⟦drop(&mut self)⟧ {
              println!("{} fertig", self.name);
          }
      }

      fn zeichen(text: &str) -> usize {
          text.chars().count()
      }

      fn main() {
          let m = Messung { name: "Import", wert: String::from("daten.csv") };
          println!("{}", zeichen(&m));
      }
    gaps:
      - label: Trait
        hint: Der Trait aus `std::ops`, der `*` und Deref-Coercion ermöglicht.
      - label: Zieltyp
        hint: Worauf soll `*m` zeigen?
      - label: Rückgabe von deref
        hint: Eine Referenz auf das eingepackte Feld.
      - label: Signatur von drop
        hint: "`drop` bekommt den Wert veränderbar ausgeliehen."
    explanation: |
      `Deref` mit `type Target = T` sagt dem Compiler, dass `&Messung<T>` bei Bedarf zu `&T` wird. Im Aufruf `zeichen(&m)` geht er zwei Schritte: `&Messung<String>` → `&String` → `&str`. `drop(&mut self)` läuft automatisch, wenn `m` am Ende von `main` ungültig wird – nach der Ausgabe der Länge. Genau so arbeiten `Box`, `String` und `MutexGuard`.
    resources:
      - title: Rust Book · Implementing the Deref Trait
        url: https://doc.rust-lang.org/book/ch15-02-deref.html#implementing-the-deref-trait
      - title: std::ops::Drop
        url: https://doc.rust-lang.org/std/ops/trait.Drop.html
  - id: guard-zu-lange
    type: bug
    title: „RefCell already borrowed“
    prompt: |
      `abarbeiten` soll den ersten Auftrag ausgeben und aus der Warteschlange entfernen. Das Programm übersetzt, bricht aber zur Laufzeit ab:

      ```text
      bearbeite backup
      thread 'main' panicked at src/main.rs:12:24:
      RefCell already borrowed
      ```

      Finde die beiden Zeilen, die zusammen das Problem verursachen, und korrigiere sie so, dass nur **eine** Ausleihe nötig ist.
    lang: rust
    code: |
      use std::cell::RefCell;

      struct Warteschlange {
          auftraege: RefCell<Vec<String>>,
      }

      impl Warteschlange {
          fn abarbeiten(&self) -> Option<String> {
              let auftraege = self.auftraege.borrow();
              let erster = auftraege.first()?.clone();
              println!("bearbeite {erster}");
              self.auftraege.borrow_mut().remove(0);
              Some(erster)
          }
      }

      fn main() {
          let w = Warteschlange { auftraege: RefCell::new(vec!["backup".into(), "report".into()]) };
          w.abarbeiten();
          println!("{:?}", w.auftraege.borrow());
      }
    lines: [9, 12]
    fix:
      - line: 9
        answers: ["let mut auftraege = self.auftraege.borrow_mut();"]
      - line: 12
        answers: ["auftraege.remove(0);"]
    explanation: |
      Zeile 9 erzeugt einen `Ref`-Guard, der bis zum Ende der Funktion lebt. Zeile 12 fordert währenddessen eine exklusive Ausleihe an – dieselbe Regel, die der Borrow Checker bei `&` und `&mut` durchsetzt, nur prüft `RefCell` sie erst zur Laufzeit und löst eine Panic aus. Mit einem einzigen `RefMut`-Guard von Anfang an gibt es nur eine Ausleihe. Eine andere korrekte Lösung: den ersten Auftrag in **einer** Anweisung lesen (`let erster = self.auftraege.borrow().first()?.clone();`), dann ist der Guard am Ende dieser Anweisung schon wieder weg.
    resources:
      - title: std::cell::RefCell::borrow_mut
        url: https://doc.rust-lang.org/std/cell/struct.RefCell.html#method.borrow_mut
      - title: Rust Book · Enforcing Borrowing Rules at Runtime
        url: https://doc.rust-lang.org/book/ch15-05-interior-mutability.html#enforcing-borrowing-rules-at-runtime
  - id: zyklus-leck
    type: bug
    title: Der Baum wird nie freigegeben
    prompt: |
      Beim Programmende sollte für jeden Knoten `… freigegeben` erscheinen. Tatsächlich endet das Programm ohne jede Ausgabe, und in einem Langzeitdienst wächst der Speicherverbrauch mit jedem Baum. Finde die beiden Zeilen, die das Leck verursachen, und korrigiere sie. Die nötigen Importe sind vorhanden.
    lang: rust
    code: |
      use std::cell::RefCell;
      use std::rc::{Rc, Weak};

      struct Knoten {
          name: String,
          eltern: RefCell<Option<Rc<Knoten>>>,
          kinder: RefCell<Vec<Rc<Knoten>>>,
      }

      impl Drop for Knoten {
          fn drop(&mut self) {
              println!("{} freigegeben", self.name);
          }
      }

      fn knoten(name: &str) -> Rc<Knoten> {
          Rc::new(Knoten { name: name.into(), eltern: RefCell::new(None), kinder: RefCell::new(Vec::new()) })
      }

      fn main() {
          let wurzel = knoten("wurzel");
          let blatt = knoten("blatt");
          *blatt.eltern.borrow_mut() = Some(Rc::clone(&wurzel));
          wurzel.kinder.borrow_mut().push(Rc::clone(&blatt));
      }
    lines: [6, 23]
    fix:
      - line: 6
        answers: ["eltern: RefCell<Option<Weak<Knoten>>>,"]
      - line: 23
        answers: ["*blatt.eltern.borrow_mut() = Some(Rc::downgrade(&wurzel));"]
    explanation: |
      Die Wurzel besitzt das Blatt (über `kinder`), und das Blatt besitzt über `eltern` die Wurzel. Am Ende von `main` fallen beide Zähler nur von 2 auf 1 – keiner erreicht null, `Drop` läuft nie, der Speicher bleibt belegt. Mit `Weak` als Elternzeiger zählt der Rückverweis nicht als Besitz: Die Wurzel fällt auf 0 und wird freigegeben, dabei ihr Vektor und damit das letzte `Rc` auf das Blatt. Die Ausgabe lautet dann `wurzel freigegeben`, `blatt freigegeben`. Zugriff auf die Eltern geht künftig über `upgrade()`.
    resources:
      - title: Rust Book · Reference Cycles Can Leak Memory
        url: https://doc.rust-lang.org/book/ch15-06-reference-cycles.html
      - title: std::rc::Rc::downgrade
        url: https://doc.rust-lang.org/std/rc/struct.Rc.html#method.downgrade
  - id: warenkorb-erklaeren
    type: explain
    title: Ein geteilter Warenkorb
    prompt: |
      Eine Kollegin hat den Warenkorb einer Desktop-App so gebaut. Erkläre wie im Code-Review, was `Rc` und `RefCell` hier jeweils leisten, wann Ausleihen beginnen und enden, welchen Preis das Muster hat und was du als Alternative vorschlagen würdest.
    lang: rust
    code: |
      use std::cell::RefCell;
      use std::rc::Rc;

      type Geteilt<T> = Rc<RefCell<T>>;

      struct Warenkorb {
          positionen: Vec<(String, u32)>,
      }

      struct Steuerung {
          korb: Geteilt<Warenkorb>,
      }

      struct Ansicht {
          korb: Geteilt<Warenkorb>,
      }

      impl Steuerung {
          fn hinzufuegen(&self, artikel: &str, cent: u32) {
              self.korb.borrow_mut().positionen.push((artikel.to_string(), cent));
          }
      }

      impl Ansicht {
          fn summe(&self) -> u32 {
              self.korb.borrow().positionen.iter().map(|(_, cent)| cent).sum()
          }
      }
    points:
      - "`Rc` erlaubt, dass `Steuerung` und `Ansicht` denselben Warenkorb besitzen; er lebt, bis der letzte Besitzer weg ist."
      - "`RefCell` erlaubt Veränderung über `&self`, weil `Rc` nur geteilte Referenzen herausgibt."
      - Die Guards aus `borrow()` und `borrow_mut()` leben nur bis zum Ende der jeweiligen Anweisung; zwei überlappende Ausleihen würden zur Laufzeit eine Panic auslösen, statt beim Übersetzen aufzufallen.
      - "Preis: Zähler- und Ausleihprüfungen zur Laufzeit, versteckter Datenfluss, nur ein Thread (`Rc` ist `!Send`; für Threads `Arc<Mutex<T>>`)."
      - "Alternative: einen Besitzer für den Warenkorb festlegen (etwa die App) und `&mut Warenkorb` bzw. `&Warenkorb` gezielt an `hinzufuegen` und `summe` übergeben."
    explanation: |
      `Rc` löst das Besitzproblem: Steuerung und Ansicht halten beide einen starken Zeiger, der Warenkorb verschwindet erst mit dem letzten. Weil `Rc` nur `&Warenkorb` herausgibt, braucht es für `hinzufuegen` die `RefCell`, die Veränderung hinter einer geteilten Referenz erlaubt. Die Guards sind hier Temporärwerte und leben nur bis zum Ende ihrer Anweisung, deshalb kollidiert nichts. Würde aber zum Beispiel die Ansicht während einer Iteration eine Methode der Steuerung aufrufen, gäbe es eine Panic zur Laufzeit – der Compiler hilft nicht mehr. Dazu kommen Laufzeitkosten und die Beschränkung auf einen Thread. Ich würde prüfen, ob die App den Warenkorb allein besitzen und `&mut Warenkorb` an die Steuerung sowie `&Warenkorb` an die Ansicht übergeben kann. Wenn nicht, ist das Muster in Ordnung, aber gekapselt hinter wenigen Methoden.
    resources:
      - title: Rust Book · Allowing Multiple Owners of Mutable Data
        url: https://doc.rust-lang.org/book/ch15-05-interior-mutability.html#allowing-multiple-owners-of-mutable-data
      - title: std::cell · When to choose interior mutability
        url: https://doc.rust-lang.org/std/cell/index.html#when-to-choose-interior-mutability
  - id: ereignis-bus
    type: practice
    title: Ein Ereignis-Bus mit schwachen Abonnenten
    prompt: |
      Baue einen kleinen Ereignis-Bus für eine Desktop-App. Komponenten abonnieren Ereignisse, aber der Bus soll sie **nicht** am Leben halten: Wird eine Komponente geschlossen (gedroppt), bekommt sie keine Ereignisse mehr und verschwindet aus der Liste.

      1. Trait `Abonnent` mit `fn empfange(&self, ereignis: &str)`.
      2. `Bus` speichert `RefCell<Vec<Weak<dyn Abonnent>>>`.
      3. `fn abonnieren<A: Abonnent + 'static>(&self, abonnent: &Rc<A>)`.
      4. `fn veroeffentlichen(&self, ereignis: &str) -> usize` räumt tote Einträge weg, stellt das Ereignis allen lebenden Abonnenten zu und gibt deren Anzahl zurück.
      5. Ein `Protokoll`-Abonnent schreibt empfangene Ereignisse in ein `RefCell<Vec<String>>`.
      6. Tests: Zustellung an zwei Abonnenten; nach `drop` eines Abonnenten nur noch einer.

      Zusatzfrage: Was passiert in deiner Lösung, wenn ein Abonnent **während** `empfange` selbst `bus.abonnieren(…)` aufruft?
    lang: rust
    starter: |
      use std::cell::RefCell;
      use std::rc::{Rc, Weak};

      trait Abonnent {
          fn empfange(&self, ereignis: &str);
      }

      #[derive(Default)]
      struct Bus {
          abonnenten: RefCell<Vec<Weak<dyn Abonnent>>>,
      }

      impl Bus {
          // abonnieren und veroeffentlichen
      }

      fn main() {
          let bus = Bus::default();
          // Abonnenten anlegen, Ereignisse veröffentlichen
      }
    solution: |
      use std::cell::RefCell;
      use std::rc::{Rc, Weak};

      trait Abonnent {
          fn empfange(&self, ereignis: &str);
      }

      #[derive(Default)]
      struct Bus {
          abonnenten: RefCell<Vec<Weak<dyn Abonnent>>>,
      }

      impl Bus {
          fn abonnieren<A: Abonnent + 'static>(&self, abonnent: &Rc<A>) {
              let schwach: Weak<A> = Rc::downgrade(abonnent);
              self.abonnenten.borrow_mut().push(schwach);
          }

          fn veroeffentlichen(&self, ereignis: &str) -> usize {
              // Erst lebende Abonnenten einsammeln, dann den Guard loslassen,
              // damit Abonnenten während `empfange` wieder abonnieren dürfen.
              let lebende: Vec<Rc<dyn Abonnent>> = {
                  let mut liste = self.abonnenten.borrow_mut();
                  liste.retain(|w| w.strong_count() > 0);
                  liste.iter().filter_map(Weak::upgrade).collect()
              };
              for abonnent in &lebende {
                  abonnent.empfange(ereignis);
              }
              lebende.len()
          }
      }

      #[derive(Default)]
      struct Protokoll {
          eintraege: RefCell<Vec<String>>,
      }

      impl Abonnent for Protokoll {
          fn empfange(&self, ereignis: &str) {
              self.eintraege.borrow_mut().push(ereignis.to_string());
          }
      }

      fn main() {
          let bus = Bus::default();
          let statusleiste = Rc::new(Protokoll::default());
          let verlauf = Rc::new(Protokoll::default());
          bus.abonnieren(&statusleiste);
          bus.abonnieren(&verlauf);

          println!("{}", bus.veroeffentlichen("Datei gespeichert"));
          drop(verlauf);
          println!("{}", bus.veroeffentlichen("Export fertig"));
          println!("{:?}", statusleiste.eintraege.borrow());
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn stellt_an_alle_lebenden_zu() {
              let bus = Bus::default();
              let a = Rc::new(Protokoll::default());
              let b = Rc::new(Protokoll::default());
              bus.abonnieren(&a);
              bus.abonnieren(&b);
              assert_eq!(bus.veroeffentlichen("start"), 2);
              assert_eq!(*a.eintraege.borrow(), vec!["start"]);
              assert_eq!(*b.eintraege.borrow(), vec!["start"]);
          }

          #[test]
          fn vergisst_gedroppte_abonnenten() {
              let bus = Bus::default();
              let a = Rc::new(Protokoll::default());
              let b = Rc::new(Protokoll::default());
              bus.abonnieren(&a);
              bus.abonnieren(&b);
              drop(b);
              assert_eq!(bus.veroeffentlichen("x"), 1);
              assert_eq!(bus.abonnenten.borrow().len(), 1);
              assert_eq!(Rc::strong_count(&a), 1);
          }
      }
    checklist:
      - Der Bus speichert nur `Weak`-Zeiger; `Rc::strong_count` eines Abonnenten bleibt nach dem Abonnieren bei 1.
      - "`Weak<A>` wird beim Einfügen in den Vektor automatisch zu `Weak<dyn Abonnent>` (Unsizing-Coercion)."
      - "`veroeffentlichen` entfernt tote Einträge (`retain` mit `strong_count() > 0` oder über `upgrade()`)."
      - Der `RefMut`-Guard auf die Abonnentenliste ist freigegeben, bevor `empfange` aufgerufen wird.
      - Beide Tests laufen grün, und `main` gibt `2`, dann `1` aus.
      - Du kannst die Zusatzfrage beantworten.
    explanation: |
      `Weak` ist hier genau richtig: Der Bus beobachtet nur, er besitzt nicht. Ohne `Weak` bliebe eine geschlossene Komponente im Speicher, solange der Bus lebt – ein typisches Leck bei Beobachter-Mustern. Die wichtigste Detailentscheidung ist der Block in `veroeffentlichen`: Er sammelt die lebenden Abonnenten als `Rc` ein und gibt den `RefMut`-Guard frei, **bevor** Code von außen läuft. Würde die Schleife den Guard halten und ein Abonnent in `empfange` erneut `abonnieren` aufrufen, gäbe es „RefCell already borrowed“. Die eingesammelten `Rc` halten die Abonnenten zudem für die Dauer der Zustellung sicher am Leben.
