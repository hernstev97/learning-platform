  - id: drop-reihenfolge
    type: output
    title: Wer schließt wann?
    prompt: Was gibt dieses Programm aus? Achte besonders auf die Zeile mit `let _`.
    lang: rust
    code: |
      struct Verbindung(&'static str);

      impl Drop for Verbindung {
          fn drop(&mut self) {
              println!("schließe {}", self.0);
          }
      }

      fn main() {
          let _db = Verbindung("Datenbank");
          let _ = Verbindung("Metriken");
          let cache = Verbindung("Cache");
          {
              let _tmp = Verbindung("Temp");
              println!("Block endet");
          }
          drop(cache);
          println!("main endet");
      }
    expected: |
      schließe Metriken
      Block endet
      schließe Temp
      schließe Cache
      main endet
      schließe Datenbank
    explanation: |
      `let _ = …` bindet den Wert an **keine** Variable; der neu erzeugte Wert ist ein Temporärwert und wird am Ende der Anweisung sofort gedroppt. `_tmp` lebt bis zum Ende des inneren Blocks, `drop(cache)` räumt vorzeitig auf, und `_db` ist die letzte verbliebene Variable von `main`. Für Guards gilt deshalb: `let _guard = …` hält, `let _ = …` gibt sofort frei.
    resources:
      - title: Rust Book · Running Code on Cleanup with the Drop Trait
        url: https://doc.rust-lang.org/book/ch15-03-drop.html
      - title: Reference · Drop scopes
        url: https://doc.rust-lang.org/reference/destructors.html#drop-scopes
  - id: zaehler-lesen
    type: output
    title: Starke und schwache Zeiger zählen
    prompt: Was gibt dieses Programm aus?
    lang: rust
    code: |
      use std::rc::Rc;

      fn main() {
          let a = Rc::new(String::from("Konfiguration"));
          let b = Rc::clone(&a);
          let w = Rc::downgrade(&a);
          println!("{} {}", Rc::strong_count(&a), Rc::weak_count(&a));
          {
              let c = a.clone();
              println!("{} {}", Rc::strong_count(&c), Rc::ptr_eq(&a, &c));
          }
          drop(a);
          println!("{} {}", Rc::strong_count(&b), w.upgrade().is_some());
          drop(b);
          println!("{:?}", w.upgrade());
      }
    expected: |
      2 1
      3 true
      1 true
      None
    explanation: |
      `a` und `b` sind zwei starke Zeiger, `w` ist ein schwacher: `2 1`. `a.clone()` auf einem `Rc` ist dasselbe wie `Rc::clone(&a)`: kein neuer String, sondern ein dritter Zeiger auf **denselben** Wert, deshalb `ptr_eq` → `true`. Nach dem Block und `drop(a)` bleibt nur `b`; der Wert lebt, `upgrade()` gelingt. Nach `drop(b)` ist der Strong-Zähler null, der String ist freigegeben, und `upgrade()` liefert `None`.
