  - id: elternzeiger-waehlen
    type: choice
    title: Der Weg zurück zum Elternknoten
    prompt: |
      Ein Verzeichnisbaum: Jeder Ordner besitzt seine Unterordner als `RefCell<Vec<Rc<Ordner>>>`. Jetzt soll jeder Ordner zusätzlich seinen Elternordner kennen. Welcher Typ passt für das Feld `eltern`?
    options:
      - text: "`RefCell<Weak<Ordner>>`"
        correct: true
        why: Der Elternzeiger besitzt nicht. Die Wurzel wird freigegeben, sobald niemand sie mehr besitzt, und `upgrade()` zeigt, ob der Elternordner noch lebt.
      - text: "`RefCell<Rc<Ordner>>`"
        correct: false
        why: Eltern und Kind hielten sich gegenseitig über starke Zähler am Leben. Kein Zähler fiele je auf null, der ganze Baum würde nie freigegeben.
      - text: "`Box<Ordner>`"
        correct: false
        why: Eine Box besitzt ihren Inhalt exklusiv. Der Elternordner gehört aber schon seinem eigenen Elternteil oder der Wurzelvariable – er kann nicht zusätzlich in jedem Kind stecken.
      - text: "`&'a Ordner` mit einer Lifetime-Angabe am Struct"
        correct: false
        why: Die Kinder liegen in einem `Rc` im Elternordner. Eine Referenz auf den Elternordner, gespeichert in dessen eigenem Inhalt, lässt der Borrow Checker so nicht zu – der Baum würde sich selbst ausleihen.
    explanation: |
      Die Faustregel für Bäume und Graphen mit Referenzzählung: Besitz zeigt in eine Richtung, von oben nach unten. Alle Rückverweise sind `Weak`. Die `RefCell` braucht es, weil der Elternzeiger erst gesetzt wird, nachdem beide Knoten schon in `Rc` stecken.
