  - id: box-liste
    type: gap
    title: Eine verkettete Liste mit Box
    prompt: Ergänze den Typ des rekursiven Felds, den Aufruf im rekursiven Fall und den Aufbau der Liste `1 → 2 → Ende`. Das Programm soll `3` ausgeben.
    lang: rust
    code: |
      enum Liste {
          Knoten(u32, ⟦Box<Liste>⟧),
          Ende,
      }

      use Liste::{Ende, Knoten};

      fn summe(liste: &Liste) -> u32 {
          match liste {
              Knoten(wert, rest) => wert + summe(⟦rest⟧),
              Ende => 0,
          }
      }

      fn main() {
          let liste = Knoten(1, ⟦Box::new(Knoten(2, Box::new(Ende)))⟧);
          println!("{}", summe(&liste));
      }
    gaps:
      - label: Rekursives Feld
        hint: Ein Zeiger mit einem einzigen Besitzer, der auf den Heap zeigt.
      - label: Argument für den rekursiven Aufruf
        hint: "`rest` hat den Typ `&Box<Liste>`, `summe` erwartet `&Liste`. Deref-Coercion erledigt den Rest."
        accept: ["&rest", "&**rest", "rest.as_ref()"]
      - label: Rest der Liste
        hint: Jede Ebene braucht ihr eigenes `Box::new(…)`, die innerste enthält `Ende`.
    explanation: |
      `Box<Liste>` gibt dem rekursiven Feld eine feste Größe. Im Match ist `rest` eine `&Box<Liste>`; weil `Box` `Deref<Target = Liste>` implementiert, wandelt der Compiler sie beim Aufruf automatisch in `&Liste` um. `&**rest` schreibt dieselbe Umwandlung von Hand aus. Beim Aufbau braucht jeder Knoten außer dem äußersten eine eigene Box.
