id: smart-pointer
title: Smart Pointer
level: 3
minutes: 150
summary: Box, Rc, RefCell, Cell, Weak und Arc – wann Rusts Ein-Besitzer-Modell nicht reicht, welcher Zeiger das Problem löst und welchen Preis du dafür zahlst.
goals:
  - Du setzt `Box<T>` für rekursive Typen und Trait-Objekte ein und erklärst, warum es dort nötig ist.
  - Du erklärst, was `Deref` und `Drop` leisten, und sagst die Drop-Reihenfolge eines Programms vorher.
  - Du teilst Besitz mit `Rc<T>` und liest `strong_count` und `weak_count` richtig.
  - Du nutzt `RefCell<T>` und `Cell<T>` für Interior Mutability und erkennst Code, der zur Laufzeit mit „already borrowed“ abstürzt.
  - Du vermeidest Referenzzyklen mit `Weak<T>`, etwa in Bäumen mit Elternzeigern.
  - Du wählst begründet zwischen `Box`, `Rc`, `Arc`, `RefCell`, `Cell` und einer Umgestaltung ohne Smart Pointer.
