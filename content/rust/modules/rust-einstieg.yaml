lesson: |
  Du kommst aus TypeScript und Kotlin. Beide Sprachen verzeihen zur Laufzeit viel: Ein Garbage Collector räumt den Speicher auf, und eine vergessene Prüfung fällt erst auf, wenn ein Nutzer auf den falschen Knopf drückt. Rust verschiebt diese Arbeit in den Compiler. In den ersten Tagen fühlt sich das nach Gegenwind an, weil `rustc` Code ablehnt, den Kotlin längst ausgeführt hätte. Dafür fallen ganze Fehlerklassen weg, bevor das Programm überhaupt startet.

  Dieses Modul legt das Fundament: Werkzeuge, Variablen, Typen, Funktionen und Kontrollfluss. Ein Gedanke zieht sich durch alles: In Rust ist fast alles ein **Ausdruck** mit Wert und Typ. Wer das verstanden hat, versteht auch, warum `if` einen Wert liefert, warum `loop` etwas zurückgeben kann und warum ein Semikolon am Ende einer Funktion einen Typfehler auslöst.

  ## Werkzeuge: rustup, Cargo und crates.io

  Für die tägliche Arbeit brauchst du wenige Werkzeuge:

  - **rustup** installiert und aktualisiert Toolchains: den Compiler `rustc`, Cargo, die Standardbibliothek, `rustfmt` und Clippy. Das Profil `default` bringt all das mit ([rustup: Profiles](https://rust-lang.github.io/rustup/concepts/profiles.html)). Alle sechs Wochen erscheint eine neue stabile Version, `rustup update` holt sie.
  - **Cargo** ist Build-System und Paketmanager in einem – ungefähr Gradle und npm zusammen.
  - **crates.io** ist die öffentliche Registry für Bibliotheken, die in Rust „Crates“ heißen. Die Dokumentation jeder Crate liegt auf docs.rs.

  Auf CachyOS gibt es zwei Wege: das Paket `rust` aus den Repositories oder das Paket `rustup`. Die beiden Pakete schließen sich gegenseitig aus. Das [ArchWiki](https://wiki.archlinux.org/title/Rust#Installation) empfiehlt `rustup`, sobald du selbst Rust programmierst, weil du dann Toolchains pro Projekt festlegen und Komponenten nachinstallieren kannst. Nach `sudo pacman -S rustup` fehlt noch die Toolchain selbst: `rustup default stable`.

  Ein neues Projekt legst du mit `cargo new` an ([Book: Hello, Cargo!](https://doc.rust-lang.org/book/ch01-03-hello-cargo.html#creating-a-project-with-cargo)):

  ```console
  $ cargo new logstat
      Creating binary (application) `logstat` package
  $ cd logstat
  $ cargo run
     Compiling logstat v0.1.0 (/home/steven/projekte/logstat)
      Finished `dev` profile [unoptimized + debuginfo] target(s) in 0.14s
       Running `target/debug/logstat`
  Hello, world!
  ```

  Cargo erzeugt ein festes Layout ([Cargo Book: Package Layout](https://doc.rust-lang.org/cargo/guide/project-layout.html)):

  ```text
  logstat/
  ├── Cargo.toml     # Manifest: Name, Version, Edition, Abhängigkeiten
  ├── Cargo.lock     # exakte Versionen aller Abhängigkeiten (entsteht beim ersten Build)
  ├── .gitignore     # enthält /target
  ├── src/
  │   └── main.rs    # Einstiegspunkt eines Programms
  └── target/        # Build-Ausgabe, gehört nie ins Repository
  ```

  `cargo new` legt außerdem ein Git-Repository an, sofern du nicht schon in einem bist. In `Cargo.toml` steht `edition = "2024"`. Die Edition legt fest, welche Sprachregeln für dein Crate gelten. Alle Beispiele auf dieser Plattform nutzen Edition 2024.

  | Befehl | Was er tut | Wann |
  | --- | --- | --- |
  | `cargo check` | prüft Typen und Borrowing, erzeugt kein Binary | ständig beim Schreiben – viel schneller als `build` |
  | `cargo build` | baut nach `target/debug` | wenn du das Binary brauchst |
  | `cargo run` | baut bei Bedarf und startet | Programm ausprobieren |
  | `cargo run --release` | optimierter Build nach `target/release` | messen, ausliefern |
  | `cargo test` | kompiliert und startet alle Tests | vor jedem Commit |
  | `cargo fmt` | formatiert den Code mit rustfmt | vor jedem Commit, meist automatisch im Editor |
  | `cargo clippy` | Linter mit mehreren hundert Regeln | vor jedem Commit und in CI |
  | `cargo add <crate>` | trägt eine Abhängigkeit in `Cargo.toml` ein | Bibliothek hinzufügen |

  > [!PRAXIS] So sieht CI in Rust-Projekten aus
  > Eine typische Pipeline in GitHub Actions führt `cargo fmt --check`, `cargo clippy -- -D warnings` und `cargo test` aus. `-D warnings` macht aus jeder Clippy-Warnung einen Fehler. Lass diese drei Befehle lokal laufen, bevor du pushst. Ein Pull Request mit Clippy-Warnungen wirkt im Review nachlässig, auch wenn der Code funktioniert.

  ## Variablen: unveränderlich als Standard

  ```rust
  fn main() {
      let dateiname = "server.log"; // unveränderlich
      let mut zeilen = 0;           // veränderlich
      zeilen += 1;
      println!("{dateiname}: {zeilen} Zeile(n)");
  }
  ```

  `let` entspricht Kotlins `val`, `let mut` entspricht `var`. Anders als bei TypeScripts `const` gilt die Unveränderlichkeit in Rust auch für den Inhalt: Bei `let v = vec![1, 2];` kannst du weder `v` neu zuweisen noch `v.push(3)` aufrufen. Ein `const`-Array in TypeScript dürftest du dagegen verändern. Vergisst du `mut`, meldet der Compiler [E0384](https://doc.rust-lang.org/error_codes/E0384.html) („cannot assign twice to immutable variable“) oder E0596 („cannot borrow as mutable“) und schlägt `let mut` direkt vor.

  Warum unveränderlich als Standard? Wenn eine Variable kein `mut` trägt, weißt du beim Lesen sofort, dass sich ihr Wert nicht ändert. `mut` markiert die Stellen, an denen Zustand wechselt – und dort entstehen die meisten Fehler.

  ### Shadowing

  Ein zweites `let` mit demselben Namen erzeugt eine **neue** Variable, die die alte verdeckt ([Book: Shadowing](https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing)):

  ```rust
  fn main() {
      let port = "  8080 ";      // Text aus einer Konfigurationsdatei
      let port = port.trim();    // immer noch Text, ohne Leerzeichen
      let port: u16 = port.parse().expect("Port muss eine Zahl sein");
      println!("Server lauscht auf Port {port}");
  }
  ```

  Shadowing darf den Typ wechseln, `mut` nicht. Das Muster oben ist idiomatisch: Ein Wert durchläuft mehrere Verarbeitungsschritte, und du brauchst keine Namen wie `port_str` und `port_num`. Jede Stufe bleibt für sich unveränderlich. Ein Shadowing innerhalb eines Blocks `{ … }` endet mit dem Block, danach ist wieder die äußere Variable sichtbar. `expect` beendet das Programm mit der Nachricht, falls das Parsen scheitert. Im Modul [Fehlerbehandlung](/rust/fehlerbehandlung) lernst du, wie das besser geht.

  ### Konstanten

  ```rust
  const MAX_VERSUCHE: u32 = 3;
  const TIMEOUT_MS: u64 = 30 * 1000;
  ```

  Konstanten brauchen immer eine Typangabe, heißen in `SCREAMING_SNAKE_CASE` und dürfen außerhalb von Funktionen stehen. Ihr Wert muss zur Compile-Zeit feststehen: `30 * 1000` geht, das Lesen einer Datei nicht. Der Compiler setzt den Wert an jeder Verwendungsstelle ein ([Reference: Constant items](https://doc.rust-lang.org/reference/items/constant-items.html)).

  ## Datentypen

  Rust ist statisch typisiert, leitet Typen aber meistens selbst ab. Angeben musst du sie in Funktionssignaturen und dort, wo mehrere Typen passen würden – etwa bei `parse`, das in jeden Zahlentyp parsen kann.

  | Typ | Beispiele | Hinweis |
  | --- | --- | --- |
  | Ganzzahl mit Vorzeichen | `i8`, `i16`, `i32`, `i64`, `i128` | Standard ist `i32` |
  | Ganzzahl ohne Vorzeichen | `u8` … `u128` | `u8` für Bytes |
  | Zeigergröße | `isize`, `usize` | `usize` für Indizes und Längen |
  | Gleitkomma | `f32`, `f64` | Standard ist `f64` |
  | Wahrheitswert | `bool` | nur `true`/`false`, keine „truthy“-Werte |
  | Zeichen | `char` | ein Unicode-Skalarwert, 4 Byte groß |

  Rust wandelt Zahlentypen nie stillschweigend um. `i32 + i64` kompiliert nicht. Du konvertierst ausdrücklich mit `i64::from(x)` (verlustfrei) oder `u8::try_from(x)` (kann scheitern und liefert ein `Result`). `as` konvertiert auch, schneidet aber still ab: `300_i32 as u8` ergibt `44` ([Rust by Example: Casting](https://doc.rust-lang.org/rust-by-example/types/cast.html)).

  Tupel und Arrays haben eine feste Länge ([Book: Compound Types](https://doc.rust-lang.org/book/ch03-02-data-types.html#compound-types)):

  ```rust
  fn main() {
      let antwort: (u16, &str) = (404, "Not Found"); // Tupel: gemischte Typen
      let (code, text) = antwort;                    // Destructuring
      println!("{code} {text} / {}", antwort.0);

      let latenzen_ms = [120, 95, 310, 88];          // Array vom Typ [i32; 4]
      let puffer = [0u8; 16];                        // 16 Nullbytes
      println!("{} Messwerte, erster: {}", latenzen_ms.len(), latenzen_ms[0]);
      println!("{puffer:?}");
  }
  ```

  Ein Array `[T; N]` hat eine zur Compile-Zeit feste Länge und liegt direkt auf dem Stack. Für Listen, die wachsen, gibt es `Vec<T>` (Modul [Collections & Strings](/rust/collections-strings)). Ein Zugriff außerhalb der Grenzen wie `latenzen_ms[10]` beendet das Programm mit einer Panic, statt fremden Speicher zu lesen. Ist der Index eine Konstante, lehnt schon der Compiler den Code ab.

  ### Integer-Overflow

  Was passiert, wenn ein `u8` den Wert 255 hat und du 1 addierst? Das hängt vom Build-Profil ab ([Book: Integer Overflow](https://doc.rust-lang.org/book/ch03-02-data-types.html#integer-overflow)):

  - Im **Debug-Build** (`cargo build`, `cargo run`) prüft Rust jede Rechnung und beendet das Programm mit `attempt to add with overflow`.
  - Im **Release-Build** (`--release`) fehlt diese Prüfung. Der Wert läuft im Zweierkomplement um: 255 + 1 ergibt 0.

  Gesteuert wird das über die Profil-Einstellung [`overflow-checks`](https://doc.rust-lang.org/cargo/reference/profiles.html#overflow-checks). Verlass dich auf keins der beiden Verhalten. Wenn ein Überlauf möglich ist, entscheide dich ausdrücklich:

  ```rust
  fn main() {
      let zaehler: u8 = 250;
      let zuwachs: u8 = 10;
      println!("{:?}", zaehler.checked_add(zuwachs));     // None
      println!("{}", zaehler.saturating_add(zuwachs));    // 255
      println!("{}", zaehler.wrapping_add(zuwachs));      // 4
      println!("{:?}", zaehler.overflowing_add(zuwachs)); // (4, true)
  }
  ```

  | Methode | Ergebnis bei Überlauf | Typischer Einsatz |
  | --- | --- | --- |
  | `checked_add` | `None` | Geldbeträge, Eingaben von außen – Überlauf ist ein Fehler |
  | `saturating_add` | bleibt am Maximum oder Minimum stehen | Zähler, Lautstärke, Fortschrittsanzeigen |
  | `wrapping_add` | läuft um | Hashes, Prüfsummen, Ringpuffer-Indizes |
  | `overflowing_add` | `(Ergebnis, bool)` | wenn du beides brauchst |

  Die Varianten gibt es für alle Rechenarten (`_sub`, `_mul`, …) und alle Ganzzahltypen ([std: `u8::checked_add`](https://doc.rust-lang.org/std/primitive.u8.html#method.checked_add)). Ein Detail, über das du beim Ausprobieren stolperst: Bei `let x: u8 = 255; let y = x + 1;` bricht schon der Compiler ab, weil er den Überlauf aus den Konstanten ausrechnen kann (Lint `arithmetic_overflow`). Zur Laufzeit zeigt sich der Unterschied erst bei Werten, die der Compiler nicht kennt, etwa bei Eingaben oder Funktionsparametern.

  ## Funktionen, Ausdrücke und das Semikolon

  ```rust
  fn netto_in_cent(brutto_cent: u64, steuersatz_prozent: u64) -> u64 {
      brutto_cent * 100 / (100 + steuersatz_prozent)
  }

  fn main() {
      let netto = netto_in_cent(11_900, 19);
      println!("{netto}"); // 10000
  }
  ```

  Funktionen heißen in `snake_case`. Parameter brauchen immer einen Typ, der Rückgabetyp steht hinter `->`. Innerhalb einer Funktion leitet Rust Typen ab, an der Signatur nie. Das ist Absicht: Die Signatur ist ein Vertrag, den du lesen kannst, ohne den Rumpf zu kennen. Eine Änderung im Rumpf kann diesen Vertrag nicht still verändern.

  Die Funktion hat kein `return`. Hier kommt die wichtigste Unterscheidung dieses Moduls ([Book: Statements and Expressions](https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#statements-and-expressions)):

  - Ein **Ausdruck** (Expression) ergibt einen Wert: `5`, `a + b`, ein Funktionsaufruf, ein Block `{ … }`, ein `if`.
  - Eine **Anweisung** (Statement) führt etwas aus und ergibt keinen Wert: `let x = 5;` oder ein Ausdruck mit Semikolon dahinter.

  Ein Block ist ein Ausdruck. Sein Wert ist der Wert des letzten Ausdrucks **ohne** Semikolon, der sogenannten Tail-Expression. Ein Funktionsrumpf ist ein Block, also ist die letzte Zeile ohne Semikolon der Rückgabewert:

  ```rust
  fn main() {
      let basis = 10;
      let ergebnis = {
          let zuschlag = 5;
          basis + zuschlag // kein Semikolon: Wert des Blocks
      };
      println!("{ergebnis}"); // 15
  }
  ```

  Setzt du hinter die letzte Zeile ein Semikolon, wird aus dem Ausdruck eine Anweisung. Der Block hat dann den Wert `()`, den [Unit-Typ](https://doc.rust-lang.org/std/primitive.unit.html). Das ist Rusts „kein sinnvoller Wert“, vergleichbar mit `Unit` in Kotlin oder `void` in TypeScript. Die Funktion verspricht aber `i32`:

  ```rust nocheck
  fn quadrat(x: i32) -> i32 {
      x * x;
  }
  ```

  ```text
  error[E0308]: mismatched types
   --> src/main.rs:1:23
    |
  1 | fn quadrat(x: i32) -> i32 {
    |    -------            ^^^ expected `i32`, found `()`
    |    |
    |    implicitly returns `()` as its body has no tail or `return` expression
  2 |     x * x;
    |          - help: remove this semicolon to return this value
  ```

  `return` gibt es trotzdem, und zwar für den vorzeitigen Ausstieg mitten in der Funktion. Am Ende einer Funktion schreibt man in idiomatischem Rust kein `return`. Clippy meldet das als [`needless_return`](https://rust-lang.github.io/rust-clippy/master/index.html#needless_return).

  > [!MERKE]
  > Semikolon heißt Anweisung, der Wert ist weg. Kein Semikolon am Ende eines Blocks heißt: Dieser Wert ist das Ergebnis des Blocks.

  ## Kontrollfluss: if, loop, while, for

  ### if ist ein Ausdruck

  Die Bedingung muss ein `bool` sein. `if offene_tickets { … }` mit einer Zahl kompiliert nicht (`expected bool, found integer`), denn anders als in TypeScript gibt es keine „truthy“-Werte. Weil `if` ein Ausdruck ist, ersetzt es den ternären Operator, den Rust nicht hat ([Book: Using if in a let Statement](https://doc.rust-lang.org/book/ch03-05-control-flow.html#using-if-in-a-let-statement)):

  ```rust
  fn main() {
      let latenz_ms = 340;
      let status = if latenz_ms < 200 {
          "schnell"
      } else if latenz_ms < 500 {
          "akzeptabel"
      } else {
          "langsam"
      };
      println!("{latenz_ms} ms: {status}");
  }
  ```

  Alle Zweige müssen denselben Typ liefern, sonst meldet der Compiler `` `if` and `else` have incompatible types ``. Ein `if` ohne `else` hat den Typ `()` und taugt deshalb nur als Anweisung.

  ### loop, while und for

  `loop` wiederholt so lange, bis ein `break` kommt, und `break` kann einen Wert mitnehmen. Damit schreibst du Wiederholungsversuche ohne Hilfsvariable für das Ergebnis ([Book: Returning Values from Loops](https://doc.rust-lang.org/book/ch03-05-control-flow.html#returning-values-from-loops)):

  ```rust
  fn main() {
      let mut versuch = 0;
      let verbindung = loop {
          versuch += 1;
          println!("Verbindungsversuch {versuch}");
          if versuch == 3 {
              break format!("verbunden nach {versuch} Versuchen");
          }
      };
      println!("{verbindung}");
  }
  ```

  `while` prüft eine Bedingung vor jedem Durchlauf. `for` iteriert über alles, was einen Iterator liefert: Bereiche, Arrays, später Vektoren und Maps.

  ```rust
  fn main() {
      for tag in 1..=7 {            // 1 bis einschließlich 7
          print!("{tag} ");
      }
      println!();
      for sekunde in (1..4).rev() { // 3, 2, 1 – die 4 ist ausgeschlossen
          println!("Neustart in {sekunde} …");
      }
      let latenzen_ms = [120, 95, 310];
      for ms in latenzen_ms {       // direkt über die Elemente
          println!("{ms} ms");
      }
  }
  ```

  `a..b` schließt `b` aus, `a..=b` schließt es ein. Iteriere über die Elemente statt über Indizes. Eine Schleife `for ms in latenzen_ms` kann keinen Index außerhalb der Grenzen erzeugen, und bei einer Indexschleife fügt der Compiler zusätzlich in jedem Durchlauf eine Grenzprüfung ein ([Book: Looping Through a Collection with for](https://doc.rust-lang.org/book/ch03-05-control-flow.html#looping-through-a-collection-with-for)). Bei verschachtelten Schleifen bricht `break 'aussen;` mit einem [Label](https://doc.rust-lang.org/book/ch03-05-control-flow.html#disambiguating-with-loop-labels) die äußere Schleife ab.

  ## Ausgabe mit println! und format!

  Das `!` zeigt, dass `println!` ein Makro ist und keine Funktion. Makros prüfen den Format-String zur Compile-Zeit: Ein Platzhalter ohne passendes Argument ist ein Compile-Fehler und kein Laufzeitfehler ([std::fmt](https://doc.rust-lang.org/std/fmt/index.html#usage)).

  ```rust
  fn main() {
      let dienst = "auth";
      let fehlerquote = 0.0371;
      let codes = [200, 404, 500];
      println!("{dienst}: {:.2} %", fehlerquote * 100.0); // auth: 3.71 %
      println!("[{dienst:>8}]");                           // [    auth]
      println!("{codes:?}");                               // [200, 404, 500]
      let zeile = format!("{dienst}={}", codes.len());     // String statt Ausgabe
      eprintln!("Warnung: {zeile}");                       // auf stderr
  }
  ```

  - `{}` nutzt das Trait `Display`, gedacht für Ausgaben an Menschen. Zahlen und Strings haben es, Arrays nicht.
  - `{:?}` nutzt `Debug`, gedacht für Entwickler. `{:#?}` formatiert mehrzeilig.
  - `{name}` setzt eine Variable direkt ein. Das geht nur mit Namen, nicht mit Ausdrücken: `{x + 1}` ist ein Fehler. Schreib `{}` und übergib `x + 1` als Argument.
  - `{:.2}` legt Nachkommastellen fest, `{:>8}` richtet rechtsbündig auf 8 Zeichen aus.
  - `format!` liefert einen `String`, `eprintln!` schreibt auf stderr.

  Beim Debuggen hilft [`dbg!`](https://doc.rust-lang.org/std/macro.dbg.html): `dbg!(x * 2)` schreibt Datei, Zeile, Ausdruck und Wert auf stderr und gibt den Wert zurück. Du kannst es also mitten in einen Ausdruck setzen. Vor dem Commit fliegt es wieder raus.

  ## Compilerfehler lesen

  In den ersten Rust-Wochen liest du viele Fehlermeldungen. Sie folgen immer demselben Aufbau:

  ```text
  error[E0384]: cannot assign twice to immutable variable `zaehler`
   --> src/main.rs:3:5
    |
  2 |     let zaehler = 0;
    |         ------- first assignment to `zaehler`
  3 |     zaehler += 1;
    |     ^^^^^^^^^^^^ cannot assign twice to immutable variable
    |
  help: consider making this binding mutable
    |
  2 |     let mut zaehler = 0;
    |         +++
  ```

  1. **Erste Zeile:** Fehlercode und Kurzbeschreibung. Den Code schlägst du mit `rustc --explain E0384` oder im [Index der Fehlercodes](https://doc.rust-lang.org/error_codes/error-index.html) nach. Dort steht ein Minimalbeispiel samt Lösung.
  2. **`-->`:** Datei, Zeile, Spalte. Im Editor springst du per Klick dorthin.
  3. **Markierungen:** `^^^` zeigt die Fehlerstelle, `---` die Stellen, die dazu geführt haben. Lies beide, denn die Ursache steht oft in der `---`-Zeile.
  4. **`help:`** mit `+++`: ein konkreter Änderungsvorschlag. Meistens stimmt er. Beim Borrow Checker (nächstes Modul) lohnt ein zweiter Blick, denn „füge `.clone()` ein“ macht Code kompilierbar, aber nicht unbedingt richtig.

  Arbeite Fehler von oben nach unten ab. Ein früher Fehler löst oft Folgefehler aus, die mit ihm verschwinden. Nimm `cargo check` statt `cargo build`, das verkürzt jede Runde. rust-analyzer zeigt dieselben Meldungen direkt beim Tippen im Editor.

  > [!INTERVIEW] „Warum ist der Rust-Compiler so streng?“
  > Rust verschiebt Fehler von der Laufzeit in die Compile-Zeit. Was `rustc` in sicherem Rust (ohne `unsafe`) ablehnt – Typverwechslungen, vergessene Fälle in einem `match`, Zugriffe auf freigegebenen Speicher, Data Races –, kann in Produktion nicht passieren. Der Preis sind eine steilere Lernkurve und längere Compile-Zeiten. Nenne ein konkretes Beispiel, etwa dass Rust Zahlentypen nie still umwandelt oder dass Variablen ohne `mut` unveränderlich sind.

  ## Häufige Fehler

  - **Semikolon hinter dem Rückgabewert.** Symptom: `E0308 mismatched types … expected i32, found ()`. Lösung: das Semikolon in der letzten Zeile entfernen.
  - **`mut` vergessen.** Symptom: `E0384` oder `E0596`. Lösung: `let mut` – oder Shadowing, wenn du nur einen neuen Wert aus dem alten berechnest.
  - **Zahlentypen gemischt.** `anzahl_i32 + groesse_i64` scheitert mit `mismatched types` und `cannot add i64 to i32`. Konvertiere ausdrücklich, möglichst mit `i64::from` statt `as`.
  - **Ganzzahldivision statt Kommazahl.** `7 / 2` ist `3`. Für `3.5` müssen beide Seiten Gleitkommazahlen sein: `7.0 / 2.0` oder `a as f64 / b as f64`.
  - **Off-by-one bei Bereichen.** `1..7` endet bei 6. Wer „bis einschließlich“ meint, schreibt `1..=7`.
  - **Ausdrücke im Format-String.** `println!("{x + 1}")` kompiliert nicht, `println!("{}", x + 1)` schon.

  ## Zusammenfassung

  - `cargo check`, `run`, `test`, `fmt` und `clippy` sind dein Alltag. `check` ist der schnelle Zwischencheck, `clippy -- -D warnings` die Messlatte in CI.
  - Variablen sind standardmäßig unveränderlich. `mut` markiert wechselnden Zustand. Shadowing erzeugt eine neue Variable und darf den Typ wechseln.
  - Rust wandelt Zahlentypen nie automatisch um. Integer-Overflow führt im Debug-Build zur Panic und läuft im Release-Build um. Entscheide dich mit `checked_`, `saturating_` oder `wrapping_` ausdrücklich.
  - Blöcke, `if` und `loop` sind Ausdrücke. Der letzte Ausdruck ohne Semikolon ist der Wert eines Blocks und damit der Rückgabewert einer Funktion.
  - `if` braucht ein `bool`, und alle Zweige liefern denselben Typ. `loop` gibt per `break wert` ein Ergebnis zurück.
  - `for x in sammlung` ist sicherer als eine Indexschleife. `a..b` schließt `b` aus, `a..=b` schließt es ein.
  - `{}` formatiert für Menschen (`Display`), `{:?}` für Entwickler (`Debug`).
  - Fehlermeldungen liest du von oben nach unten: Code, Ort, Markierungen, `help`. `rustc --explain` erklärt jeden Code.
exercises:
  - id: cargo-befehle
    type: choice
    title: Was macht Cargo wirklich?
    prompt: Welche Aussagen über Cargo stimmen?
    options:
      - text: "`cargo check` prüft Typen und Borrowing, erzeugt aber kein ausführbares Programm."
        correct: true
        why: Genau deshalb ist es schneller als `cargo build` – der Schritt der Code-Erzeugung entfällt.
      - text: "`cargo build` erzeugt ohne weitere Optionen einen optimierten Release-Build."
        correct: false
        why: Ohne `--release` baut Cargo das Profil `dev` nach `target/debug` – unoptimiert, mit Debug-Informationen und Overflow-Prüfungen.
      - text: "`cargo run` baut das Programm bei Bedarf neu und startet es danach."
        correct: true
        why: "`run` ist `build` plus Start. Hat sich nichts geändert, startet Cargo sofort das vorhandene Binary."
      - text: "`cargo clippy` formatiert den Code nach dem offiziellen Stil."
        correct: false
        why: Formatieren übernimmt `cargo fmt` (rustfmt). Clippy ist ein Linter und findet verdächtige oder unidiomatische Konstrukte.
      - text: "`Cargo.lock` gehört bei Anwendungen ins Git-Repository."
        correct: true
        why: Die Datei hält die exakten Versionen aller Abhängigkeiten fest. Nur so bauen CI und Kolleginnen dasselbe Programm wie du.
    explanation: |
      `check`, `build` und `run` bauen aufeinander auf: `check` endet nach der Analyse, `build` erzeugt zusätzlich das Binary, `run` startet es. Der Standard ist immer das Debug-Profil, optimiert wird nur mit `--release`. Formatierung (`fmt`) und Linting (`clippy`) sind getrennte Werkzeuge. Zu `Cargo.lock` empfiehlt das Cargo Book, die Datei zu versionieren, damit Builds reproduzierbar sind.
    resources:
      - title: Book · Building and Running a Cargo Project
        url: https://doc.rust-lang.org/book/ch01-03-hello-cargo.html#building-and-running-a-cargo-project
      - title: Cargo FAQ · Why have Cargo.lock in version control?
        url: https://doc.rust-lang.org/cargo/faq.html#why-have-cargolock-in-version-control
  - id: projekt-anlegen
    type: command
    title: Ein neues Werkzeug beginnen
    prompt: Lege ein neues ausführbares Rust-Projekt namens `logstat` an.
    context: Du bist in `~/projekte` in der fish-Shell.
    answers: ["cargo new logstat", "cargo new --bin logstat", "cargo new logstat --bin"]
    output: |2
          Creating binary (application) `logstat` package
      note: see more `Cargo.toml` keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
    explanation: |
      `cargo new` legt das Verzeichnis mit `Cargo.toml`, `src/main.rs`, `.gitignore` und einem Git-Repository an. Ausführbare Programme (`--bin`) sind der Standard, deshalb ist die Option überflüssig. Für eine Bibliothek schreibst du `cargo new --lib name`. Ohne neues Verzeichnis, also im aktuellen Ordner, hilft `cargo init`.
    resources:
      - title: Cargo Book · cargo new
        url: https://doc.rust-lang.org/cargo/commands/cargo-new.html
  - id: clippy-ci
    type: command
    title: Streng wie die Pipeline
    prompt: Lass Clippy so laufen, wie es in CI üblich ist – jede Warnung soll als Fehler zählen, damit der Befehl mit einem Fehlercode endet.
    context: Du bist im Projektverzeichnis `~/projekte/logstat`.
    answers: ["cargo clippy -- -D warnings", "cargo clippy -- --deny warnings", "cargo clippy --all-targets -- -D warnings", "cargo clippy --all-targets -- --deny warnings"]
    output: |
          Checking logstat v0.1.0 (/home/steven/projekte/logstat)
          Finished `dev` profile [unoptimized + debuginfo] target(s) in 0.12s
    hints:
      - Alles hinter `--` geht nicht an Cargo, sondern an Clippy selbst.
      - Die Option heißt „deny“, kurz `-D`, und bekommt die Lint-Gruppe `warnings`.
    explanation: |
      Die Argumente vor `--` gelten für `cargo clippy`, die dahinter für den Linter. `-D warnings` stuft alle Warnungen zu Fehlern hoch, sodass der Befehl mit einem Exit-Code ungleich 0 endet und die Pipeline rot wird. `--all-targets` prüft zusätzlich Tests und Beispiele. Genau diese Zeile steht in den meisten Rust-Workflows, lokal ausgeführt ersparst du dir rote Builds.
    resources:
      - title: Clippy · Usage
        url: https://doc.rust-lang.org/clippy/usage.html
      - title: Cargo Book · cargo clippy
        url: https://doc.rust-lang.org/cargo/commands/cargo-clippy.html
  - id: shadowing-bloecke
    type: output
    title: Drei x, drei Werte
    prompt: Was gibt dieses Programm aus?
    lang: rust
    code: |
      fn main() {
          let x = 5;
          let x = x + 1;
          {
              let x = x * 2;
              println!("innen: {x}");
          }
          println!("außen: {x}");
          let x = "fertig";
          println!("{x}");
      }
    expected: |
      innen: 12
      außen: 6
      fertig
    hints:
      - Jedes `let` erzeugt eine neue Variable. Welche ist nach dem Block noch sichtbar?
    explanation: |
      `let x = x + 1;` erzeugt ein neues `x` mit dem Wert 6. Im Block verdeckt ein drittes `x` (12) das äußere, aber nur bis zur schließenden Klammer. Danach ist wieder das `x` mit 6 sichtbar – nichts wurde verändert, es gab nie ein `mut`. Das letzte `let` wechselt sogar den Typ von `i32` zu `&str`, was nur mit Shadowing geht, nicht mit `mut`.
    resources:
      - title: Book · Shadowing
        url: https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing
      - title: Rust by Example · Scope and Shadowing
        url: https://doc.rust-lang.org/rust-by-example/variable_bindings/scope.html
  - id: alles-ist-ausdruck
    type: output
    title: Schleife mit Rückgabewert
    prompt: Was gibt dieses Programm aus?
    lang: rust
    code: |
      fn main() {
          let mut versuch = 0;
          let ergebnis = loop {
              versuch += 1;
              if versuch == 3 {
                  break versuch * 10;
              }
          };
          let stufe = if ergebnis > 25 { "hoch" } else { "niedrig" };
          let summe = {
              let a = 2;
              a + ergebnis
          };
          println!("{ergebnis} {stufe} {summe}");
      }
    expected: "30 hoch 32"
    explanation: |
      Die Schleife läuft dreimal, `break versuch * 10` beendet sie und macht 30 zum Wert des `loop`-Ausdrucks. `if` ist ebenfalls ein Ausdruck: 30 > 25, also `"hoch"`. Der Block am Ende hat als Wert seine letzte Zeile ohne Semikolon, `2 + 30 = 32`. Stünde hinter `a + ergebnis` ein Semikolon, wäre `summe` vom Typ `()` und das `println!` würde nicht kompilieren.
    resources:
      - title: Book · Returning Values from Loops
        url: https://doc.rust-lang.org/book/ch03-05-control-flow.html#returning-values-from-loops
  - id: ueberlauf-methoden
    type: output
    title: Wenn u8 nicht reicht
    prompt: |
      Was gibt dieses Programm aus? Achte auf `{:?}` und `{}` und auf die Division.
    lang: rust
    code: |
      fn main() {
          let zaehler: u8 = 250;
          println!("{:?}", zaehler.checked_add(10));
          println!("{}", zaehler.wrapping_add(10));
          println!("{}", zaehler.saturating_add(10));
          println!("{:?}", zaehler.checked_add(5));
          println!("{}", 7 / 2);
          println!("{}", 7.0 / 2.0);
      }
    expected: |
      None
      4
      255
      Some(255)
      3
      3.5
    hints:
      - "`u8` reicht von 0 bis 255."
      - "`wrapping_add` rechnet modulo 256: 260 − 256."
    explanation: |
      250 + 10 = 260 passt nicht in `u8`. `checked_add` meldet das als `None`, `wrapping_add` läuft um (260 − 256 = 4), `saturating_add` bleibt bei 255 stehen. 250 + 5 = 255 passt genau, also `Some(255)`. Die letzten beiden Zeilen zeigen die zweite Zahlenfalle: `7 / 2` ist Ganzzahldivision und schneidet ab, erst mit Gleitkommazahlen kommt `3.5` heraus.
    resources:
      - title: std · u8::checked_add
        url: https://doc.rust-lang.org/std/primitive.u8.html#method.checked_add
      - title: Book · Integer Overflow
        url: https://doc.rust-lang.org/book/ch03-02-data-types.html#integer-overflow
  - id: fahrenheit-funktion
    type: gap
    title: Eine Funktion ohne return
    prompt: |
      Vervollständige die Funktion `fahrenheit` nach der Formel F = C · 9/5 + 32. Parametertyp und Rückgabetyp sind `f64`. Schreibe den Rumpf idiomatisch als Tail-Expression, also ohne `return` und ohne Semikolon.
    lang: rust
    code: |
      fn fahrenheit(celsius: ⟦f64⟧) ⟦-> f64⟧ {
          ⟦celsius * 9.0 / 5.0 + 32.0⟧
      }

      fn main() {
          let messwerte = [-10.0, 0.0, 37.5];
          for c in messwerte {
              println!("{c} °C = {:.1} °F", fahrenheit(c));
          }
      }
    gaps:
      - label: Parametertyp
        hint: Parameter brauchen in Rust immer einen Typ – hier eine 64-Bit-Gleitkommazahl.
      - label: Rückgabetyp
        hint: Der Rückgabetyp steht hinter einem Pfeil.
      - label: Rumpf
        hint: "Achte auf Gleitkomma-Literale: `9.0`, nicht `9`."
        accept: ["celsius * 1.8 + 32.0", "32.0 + celsius * 9.0 / 5.0", "32.0 + celsius * 1.8", "(celsius * 9.0 / 5.0) + 32.0", "celsius / 5.0 * 9.0 + 32.0", "celsius * 9.0 / 5.0 + 32.", "celsius * (9.0 / 5.0) + 32.0"]
    explanation: |
      Parameter- und Rückgabetypen stehen immer in der Signatur, auch wenn der Compiler sie ableiten könnte. Der Rumpf ist ein Block, und seine letzte Zeile ohne Semikolon ist der Rückgabewert. Wichtig sind die Literale: `celsius * 9 / 5` kompiliert nicht, weil Rust `f64` und Ganzzahlen nicht mischt – `9.0` ist ein `f64`, `9` ein `i32`.
    resources:
      - title: Book · Functions with Return Values
        url: https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#functions-with-return-values
  - id: backoff-schleife
    type: gap
    title: Exponentielles Backoff
    prompt: |
      Ein HTTP-Client soll bei Fehlern mit wachsender Wartezeit neu versuchen: 100 ms, 200 ms, 400 ms … Ergänze die Lücken, sodass für `versuche = 4` die Versuche 1 bis einschließlich 4 ausgegeben werden und sich die Wartezeit jedes Mal verdoppelt.
    lang: rust
    code: |
      fn plane_wiederholungen(versuche: u32) {
          ⟦let mut⟧ wartezeit_ms = 100;
          for versuch in ⟦1..=versuche⟧ {
              println!("Versuch {versuch}: warte {wartezeit_ms} ms");
              wartezeit_ms ⟦*=⟧ 2;
          }
      }

      fn main() {
          plane_wiederholungen(4);
      }
    gaps:
      - label: Bindung
        hint: Die Wartezeit ändert sich in der Schleife.
      - label: Bereich
        hint: Der Bereich soll die Obergrenze einschließen.
        accept: ["1..versuche + 1", "1..(versuche + 1)"]
      - label: Operator
        hint: Ein zusammengesetzter Zuweisungsoperator für „mal nehmen und speichern“.
    explanation: |
      `wartezeit_ms` wird in jedem Durchlauf überschrieben, braucht also `let mut`. `1..=versuche` schließt die 4 ein, `1..versuche` würde nach Versuch 3 aufhören – ein klassischer Off-by-one. `*=` verdoppelt in place. Shadowing hilft hier nicht, weil ein `let` innerhalb der Schleife nur bis zum Ende des Durchlaufs lebt.
    resources:
      - title: Book · Looping Through a Collection with for
        url: https://doc.rust-lang.org/book/ch03-05-control-flow.html#looping-through-a-collection-with-for
      - title: Rust by Example · for and range
        url: https://doc.rust-lang.org/rust-by-example/flow_control/for.html
  - id: verbindung-parsons
    type: order
    title: Wiederholen bis verbunden
    prompt: |
      Bring die Zeilen in eine Reihenfolge, die kompiliert und `verbunden nach 3 Versuchen` ausgibt. Die Schleife soll ihr Ergebnis per `break` zurückgeben.
    lang: rust
    lines: |
      fn main() {
          let mut versuch = 0;
          let antwort = loop {
              versuch += 1;
              if versuch == 3 {
                  break "verbunden";
              }
          };
          println!("{antwort} nach {versuch} Versuchen");
      }
    explanation: |
      Der Zähler muss vor der Schleife existieren und veränderlich sein. `loop` ist ein Ausdruck, darum steht er rechts von `let antwort =` und endet mit `};` – das Semikolon beendet die `let`-Anweisung. `break "verbunden"` macht den String zum Wert der Schleife. Nach der Schleife ist `versuch` 3, weil die Variable außerhalb deklariert wurde.
    resources:
      - title: Reference · break and loop values
        url: https://doc.rust-lang.org/reference/expressions/loop-expr.html#break-and-loop-values
  - id: semikolon-zu-viel
    type: bug
    title: Der Durchschnitt kompiliert nicht
    prompt: |
      `durchschnitt` soll den Mittelwert von vier Antwortzeiten liefern. Der Compiler meldet:

      ```text
      error[E0308]: mismatched types
        |
      1 | fn durchschnitt(werte: [u32; 4]) -> u32 {
        |    ------------                     ^^^ expected `u32`, found `()`
      ```

      Finde die fehlerhafte Zeile und korrigiere sie.
    lang: rust
    code: |
      fn durchschnitt(werte: [u32; 4]) -> u32 {
          let mut summe = 0;
          for w in werte {
              summe += w;
          }
          summe / 4;
      }

      fn main() {
          println!("{}", durchschnitt([120, 80, 100, 100]));
      }
    lines: [6]
    fix:
      - line: 6
        answers: ["summe / 4", "summe / werte.len() as u32", "return summe / 4;"]
    explanation: |
      Das Semikolon macht aus `summe / 4` eine Anweisung. Der Funktionsrumpf endet dann ohne Tail-Expression und hat den Wert `()`, versprochen ist aber `u32`. Ohne Semikolon ist die Division der Rückgabewert. `return summe / 4;` funktioniert auch, ist am Funktionsende aber unidiomatisch (Clippy: `needless_return`).
    resources:
      - title: Book · Statements and Expressions
        url: https://doc.rust-lang.org/book/ch03-03-how-functions-work.html#statements-and-expressions
      - title: rustc · E0308
        url: https://doc.rust-lang.org/error_codes/E0308.html
  - id: bericht-off-by-one
    type: bug
    title: Ein Tag fehlt im Bericht
    prompt: |
      Das Programm soll für jeden Tag von 1 bis einschließlich `tage` eine Zeile ausgeben. Für `tage = 3` erscheinen aber nur „Tag 1“ und „Tag 2“. Finde die Zeile mit dem Fehler und korrigiere sie.
    lang: rust
    code: |
      fn main() {
          let tage = 3;
          for tag in 1..tage {
              println!("Bericht für Tag {tag}");
          }
      }
    lines: [3]
    fix:
      - line: 3
        answers: ["for tag in 1..=tage {", "for tag in 1..tage + 1 {", "for tag in 1..(tage + 1) {"]
    explanation: |
      `1..tage` ist ein halboffener Bereich und endet vor `tage`. `1..=tage` schließt die Obergrenze ein. Die halboffene Form ist praktisch für Indizes (`0..len`), bei „von 1 bis n“ brauchst du die geschlossene Form.
    resources:
      - title: Rust by Example · for and range
        url: https://doc.rust-lang.org/rust-by-example/flow_control/for.html
  - id: fehlermeldung-lesen
    type: explain
    title: Was sagt dir der Compiler?
    prompt: |
      Eine Kollegin schickt dir diese Fehlermeldung und fragt, was los ist. Erkläre ihr, was der Compiler bemängelt, warum Rust das nicht erlaubt und wie sie es behebt. Nutze dabei die Teile der Meldung (Code, Ort, Markierungen).
    lang: text
    code: |
      error[E0308]: `if` and `else` have incompatible types
       --> src/main.rs:3:57
        |
      3 |     let hinweis = if temperatur > 30 { "Hitze" } else { 0 };
        |                                        -------          ^ expected `&str`, found integer
        |                                        |
        |                                        expected because of this
    points:
      - "`if` ist in Rust ein Ausdruck, `hinweis` bekommt seinen Wert – und hat genau einen Typ."
      - Die `---`-Markierung zeigt, woher die Erwartung `&str` kommt (erster Zweig), `^` zeigt den widersprechenden Zweig mit einer Ganzzahl.
      - "`-->` nennt Datei, Zeile 3 und Spalte 57; E0308 lässt sich mit `rustc --explain E0308` nachschlagen."
      - Lösung – beide Zweige liefern denselben Typ, etwa `""` statt `0`, oder man modelliert „kein Hinweis“ mit `Option<&str>`.
    explanation: |
      „Weil `if` hier ein Ausdruck ist, muss das Ganze einen Typ haben – `hinweis` kann nicht mal Text und mal Zahl sein. Der Compiler nimmt den Typ aus dem ersten Zweig, das zeigt die `---`-Markierung unter `"Hitze"`: erwartet wird `&str`. Die `^`-Markierung zeigt auf die `0` im `else`-Zweig, eine Ganzzahl. Datei und Stelle stehen hinter `-->`, Details liefert `rustc --explain E0308`. Beheben kannst du es, indem beide Zweige Text liefern, zum Beispiel `""`. Sauberer ist oft `Option<&str>`: `Some("Hitze")` oder `None` – das kommt im Modul zu Structs und Enums.“
    resources:
      - title: Book · Using if in a let Statement
        url: https://doc.rust-lang.org/book/ch03-05-control-flow.html#using-if-in-a-let-statement
      - title: Reference · if expressions
        url: https://doc.rust-lang.org/reference/expressions/if-expr.html
  - id: antwortzeiten-auswerten
    type: practice
    title: Antwortzeiten auswerten
    prompt: |
      Ein Monitoring-Job liefert die Antwortzeiten der letzten sechs Requests in Millisekunden. Schreibe eine Funktion `auswerten`, die ein `[u32; 6]` bekommt und ein Tupel `(minimum, maximum, durchschnitt, langsame)` zurückgibt:

      - `minimum` und `maximum` als `u32`,
      - `durchschnitt` als `f64`,
      - `langsame` als `u32`: die Anzahl der Werte über dem SLA von 300 ms (als `const`).

      `main` destrukturiert das Tupel und gibt einen Bericht aus, zum Beispiel `min 88 ms, max 410 ms, Ø 210.5 ms, 2 über SLA` – mit einer Nachkommastelle. Hänge eine Zeile `Status: ok` oder `Status: kritisch` an (kritisch ab zwei langsamen Requests) und bestimme sie mit einem `if`-Ausdruck. Schreibe zusätzlich einen Test mit `#[test]` und prüfe ihn mit `cargo test`. Nutze nur, was du in diesem Modul gelernt hast, keine Iterator-Methoden wie `min()` oder `sum()`.
    lang: rust
    starter: |
      const SLA_MS: u32 = 300;

      fn auswerten(zeiten: [u32; 6]) -> (u32, u32, f64, u32) {
          todo!()
      }

      fn main() {
          let zeiten = [120, 410, 95, 88, 350, 200];
          // Tupel destrukturieren und Bericht ausgeben
      }
    solution: |
      const SLA_MS: u32 = 300;

      fn auswerten(zeiten: [u32; 6]) -> (u32, u32, f64, u32) {
          let mut minimum = u32::MAX;
          let mut maximum = 0;
          let mut summe: u64 = 0;
          let mut langsame = 0;
          for ms in zeiten {
              if ms < minimum {
                  minimum = ms;
              }
              if ms > maximum {
                  maximum = ms;
              }
              summe += u64::from(ms);
              if ms > SLA_MS {
                  langsame += 1;
              }
          }
          let durchschnitt = summe as f64 / zeiten.len() as f64;
          (minimum, maximum, durchschnitt, langsame)
      }

      fn main() {
          let zeiten = [120, 410, 95, 88, 350, 200];
          let (minimum, maximum, durchschnitt, langsame) = auswerten(zeiten);
          println!("min {minimum} ms, max {maximum} ms, Ø {durchschnitt:.1} ms, {langsame} über SLA");
          let status = if langsame >= 2 { "kritisch" } else { "ok" };
          println!("Status: {status}");
      }

      #[test]
      fn wertet_beispiel_aus() {
          let (minimum, maximum, durchschnitt, langsame) = auswerten([120, 410, 95, 88, 350, 200]);
          assert_eq!(minimum, 88);
          assert_eq!(maximum, 410);
          assert!((durchschnitt - 210.5).abs() < 1e-9);
          assert_eq!(langsame, 2);
      }
    checklist:
      - "`SLA_MS` ist eine `const` mit Typangabe, keine magische Zahl im Code."
      - Die Schleife läuft mit `for ms in zeiten` über die Elemente, nicht über Indizes.
      - Die Summe liegt in einem größeren Typ (`u64`) oder du hast begründet, warum `u32` nicht überlaufen kann.
      - Der Durchschnitt entsteht per Gleitkommadivision, nicht per Ganzzahldivision.
      - "`auswerten` endet mit dem Tupel als Tail-Expression, ohne `return`."
      - "`main` destrukturiert das Tupel mit `let (…) = …` und formatiert mit `{:.1}`."
      - Der Status entsteht mit einem `if`-Ausdruck, beide Zweige liefern `&str`.
      - "`cargo test` läuft grün, `cargo clippy` meldet nichts."
    explanation: |
      Die Musterlösung startet das Minimum bei `u32::MAX`, damit jeder echte Wert kleiner ist. Die Summe liegt in `u64`: Sechs `u32`-Werte könnten zusammen über `u32::MAX` liegen – im Debug-Build wäre das eine Panic, im Release-Build ein falsches Ergebnis. `u64::from` konvertiert verlustfrei. Erst beim Durchschnitt wird zu `f64` gewechselt, sonst würde `1263 / 6` zu `210` abgeschnitten. Floats vergleicht der Test mit einer Toleranz statt mit `==`. Mit Iteratoren (Modul Closures & Iteratoren) wird das später kürzer, die Logik bleibt dieselbe.
    resources:
      - title: Book · Data Types
        url: https://doc.rust-lang.org/book/ch03-02-data-types.html
      - title: Book · Writing Tests
        url: https://doc.rust-lang.org/book/ch11-01-writing-tests.html
