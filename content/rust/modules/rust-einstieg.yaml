id: rust-einstieg
title: "Einstieg: Cargo, Typen und Ausdrücke"
level: 1
minutes: 150
summary: Du richtest Rust mit Cargo ein, schreibst die ersten Programme und lernst, warum in Rust fast alles ein Ausdruck ist – und warum ein einzelnes Semikolon den Rückgabewert kosten kann.
goals:
  - Du legst mit Cargo ein Projekt an und nutzt `check`, `run`, `test`, `fmt` und `clippy` jeweils im richtigen Moment.
  - Du unterscheidest `let`, `let mut`, Shadowing und `const` und begründest, wann du was nimmst.
  - Du wählst passende Zahlentypen und behandelst Integer-Overflow bewusst mit `checked_`, `saturating_` oder `wrapping_`.
  - Du erklärst den Unterschied zwischen Ausdruck und Anweisung und nutzt Blöcke, `if` und `loop` als Ausdrücke.
  - Du liest eine Fehlermeldung von `rustc` von oben nach unten und findest Ursache und Lösungsvorschlag.
