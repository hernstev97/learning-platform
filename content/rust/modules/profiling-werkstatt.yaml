    output: |
      logauswertung/auswerten_50k
                              time:   [12.653 ms 12.674 ms 12.697 ms]
                              change: [−25.113% −24.883% −24.603%] (p = 0.00 < 0.05)
                              Performance has improved.
      Found 1 outliers among 10 measurements (10.00%)
        1 (10.00%) high mild
    explanation: |
      `--baseline vorher` vergleicht mit der benannten Baseline statt mit dem letzten Lauf. So kannst du mehrere Versuche gegen denselben Ausgangspunkt messen. `--save-baseline` würde sie dagegen überschreiben. Die Ausgabe oben stammt aus Runde 2 gegen Runde 1 (50 000 Zeilen): Die Baseline `vorher` war nach Runde 1 neu gespeichert worden, damit jede Runde gegen die direkt vorherige misst. Ergebnis −24,9 %, das ganze Intervall weit jenseits der Rauschschwelle.
