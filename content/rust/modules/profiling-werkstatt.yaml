  - id: baseline-speichern
    type: command
    title: Die Baseline sichern
    prompt: |
      Lass nur den criterion-Benchmark `benches/auswerten.rs` laufen und speichere das Ergebnis als Baseline mit dem Namen `vorher`.
    context: In der `Cargo.toml` steht `[[bench]] name = "auswerten"` mit `harness = false`.
    answers:
      - cargo bench --bench auswerten -- --save-baseline vorher
      - cargo bench --bench auswerten -- --save-baseline=vorher
      - cargo bench --bench=auswerten -- --save-baseline vorher
      - cargo bench --bench=auswerten -- --save-baseline=vorher
    hints:
      - Optionen für criterion stehen hinter `--`.
      - Ohne `--bench auswerten` startet Cargo zuerst das eingebaute Test-Gerüst, das die Option nicht kennt.
    explanation: |
      Alles vor `--` gehört Cargo, alles dahinter dem Benchmark-Programm. `--bench auswerten` startet nur diesen Benchmark; ohne die Angabe startet Cargo auch das Test-Gerüst von `src/lib.rs` und bricht mit `Unrecognized option: 'save-baseline'` ab. `--save-baseline vorher` legt die Messung unter `target/criterion/…/vorher/` ab. Sie bleibt dort, bis du sie mit demselben Namen überschreibst.
