  - id: allokationen-halbieren
    type: practice
    title: Allokationen mindestens halbieren
    prompt: |
      Ausgangspunkt ist der Stand nach der ersten Änderung (`auswerten_vorher`, zwölf Allokationen pro Zeile). Schreibe `auswerten` so um, dass sie **höchstens halb so viele** Allokationen braucht und denselben Bericht liefert.

      1. Zähle mit einem eigenen `GlobalAlloc`. Weil Tests parallel in eigenen Threads laufen, zählt der Zähler pro Thread (`thread_local!` mit `Cell<usize>`).
      2. Ein Test vergleicht die Berichte und prüft `nachher * 2 <= vorher`.
      3. Geh in Runden vor: Nimm dir die größten Allokationsquellen aus dem Profil zuerst vor und miss nach jeder Änderung.
      4. Notiere für jede Runde die Allokationen und die hyperfine-Zeit.
    lang: rust
    starter: |
      use std::alloc::{GlobalAlloc, Layout, System};
      use std::cell::Cell;
      use std::collections::HashMap;
      use std::fmt::Write;

      // Zählt Allokationen pro Thread: Tests laufen parallel in eigenen Threads.
      thread_local! {
          static ALLOKATIONEN: Cell<usize> = const { Cell::new(0) };
      }

      struct Zaehler;

      unsafe impl GlobalAlloc for Zaehler {
          unsafe fn alloc(&self, layout: Layout) -> *mut u8 {
              let _ = ALLOKATIONEN.try_with(|n| n.set(n.get() + 1));
              unsafe { System.alloc(layout) }
          }
          unsafe fn dealloc(&self, ptr: *mut u8, layout: Layout) {
              unsafe { System.dealloc(ptr, layout) }
          }
      }

      #[global_allocator]
      static GLOBAL: Zaehler = Zaehler;

      /// Allokationen, die `f` im aktuellen Thread auslöst.
      fn zaehle<T>(f: impl FnOnce() -> T) -> (T, usize) {
          let vorher = ALLOKATIONEN.with(Cell::get);
          let ergebnis = f();
          let nachher = ALLOKATIONEN.with(Cell::get);
          (ergebnis, nachher - vorher)
      }

