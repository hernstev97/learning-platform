        url: https://github.com/sharkdp/hyperfine#warmup-runs-and-preparation-commands

  - id: samply-aufnahme
    type: command
    title: Ein Profil aufnehmen
    prompt: |
      Nimm das Binary `target/profiling/logauswertung` mit samply auf, ohne Argumente (es nutzt dann 200 000 Zeilen).
    context: Du bist im Projektverzeichnis, `perf_event_paranoid` steht auf 1.
    answers:
      - samply record ./target/profiling/logauswertung
      - samply record target/profiling/logauswertung
      - samply record -- ./target/profiling/logauswertung
      - samply record -- target/profiling/logauswertung
    explanation: |
      `samply record` startet das Kommando als Kindprozess, nimmt standardmäßig mit 1000 Hz auf und öffnet danach den Firefox Profiler mit einem lokalen Server, der Symbole und Quelltext liefert ([samply](https://github.com/mstange/samply#description)). Mit `--save-only -o datei.json.gz` speichert samply nur, `samply load datei.json.gz` öffnet die Aufnahme später. Steht `perf_event_paranoid` auf 2, bricht samply mit einer Meldung ab, die den nötigen Befehl nennt.
