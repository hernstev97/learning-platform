      /// Stand nach der ersten Änderung (p95 nach der Schleife).
      fn auswerten_vorher(log: &str) -> Bericht {
          let mut pfade: HashMap<String, Pfad> = HashMap::new();
          let mut status: HashMap<String, u32> = HashMap::new();

          for zeile in log.lines() {
              let zeile = zeile.to_string();
              let teile: Vec<String> = zeile.split(' ').map(|t| t.to_string()).collect();
              if teile.len() != 6 {
                  continue;
              }
              let schluessel = format!("{} {}", teile[2], teile[3]);
              let code = teile[4].clone();
              let ms: u32 = teile[5].trim_end_matches("ms").parse().unwrap_or(0);

              if !pfade.contains_key(&schluessel) {
                  pfade.insert(schluessel.clone(), Pfad::default());
              }
              let pfad = pfade.get_mut(&schluessel).unwrap();
              pfad.anfragen += 1;
              if code.starts_with('5') {
                  pfad.fehler += 1;
              }
              pfad.latenzen.push(ms);

              if status.contains_key(&code) {
                  *status.get_mut(&code).unwrap() += 1;
              } else {
                  status.insert(code.clone(), 1);
              }
          }

          for pfad in pfade.values_mut() {
              pfad.latenzen.sort();
              let rang = (pfad.latenzen.len() * 95).div_ceil(100);
              pfad.p95 = pfad.latenzen[rang - 1];
          }

          let mut pfade: Vec<(String, Pfad)> = pfade.into_iter().collect();
          pfade.sort_by(|a, b| b.1.anfragen.cmp(&a.1.anfragen).then(a.0.cmp(&b.0)));
          let mut status: Vec<(String, u32)> = status.into_iter().collect();
          status.sort();
          Bericht { pfade, status }
      }

      /// Derselbe Bericht wie `auswerten_vorher`, mit höchstens halb so vielen Allokationen.
      fn auswerten(log: &str) -> Bericht {
          todo!()
      }

      fn main() {
          let log = erzeuge_log(200_000, 42);
          let (_, vorher) = zaehle(|| auswerten_vorher(&log));
          let (_, nachher) = zaehle(|| auswerten(&log));
          println!("vorher {vorher} Allokationen, nachher {nachher}");
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn gleicher_bericht() {
              for (zeilen, seed) in [(0, 1), (1, 7), (5_000, 42)] {
                  let log = erzeuge_log(zeilen, seed);
                  assert_eq!(auswerten(&log), auswerten_vorher(&log));
              }
          }

          #[test]
          fn hoechstens_halb_so_viele_allokationen() {
              let log = erzeuge_log(20_000, 42);
              let (a, vorher) = zaehle(|| auswerten_vorher(&log));
              let (b, nachher) = zaehle(|| auswerten(&log));
              assert_eq!(a, b);
              println!("vorher {vorher}, nachher {nachher}");
              assert!(nachher * 2 <= vorher, "vorher {vorher}, nachher {nachher}");
          }
      }
    solution: |
      use std::alloc::{GlobalAlloc, Layout, System};
      use std::cell::Cell;
      use std::collections::HashMap;
      use std::fmt::Write;

      // Zählt Allokationen pro Thread: Tests laufen parallel in eigenen Threads.
      thread_local! {
          static ALLOKATIONEN: Cell<usize> = const { Cell::new(0) };
      }

      struct Zaehler;

      unsafe impl GlobalAlloc for Zaehler {
          unsafe fn alloc(&self, layout: Layout) -> *mut u8 {
              let _ = ALLOKATIONEN.try_with(|n| n.set(n.get() + 1));
              unsafe { System.alloc(layout) }
          }
          unsafe fn dealloc(&self, ptr: *mut u8, layout: Layout) {
              unsafe { System.dealloc(ptr, layout) }
          }
      }

      #[global_allocator]
      static GLOBAL: Zaehler = Zaehler;

      /// Allokationen, die `f` im aktuellen Thread auslöst.
      fn zaehle<T>(f: impl FnOnce() -> T) -> (T, usize) {
          let vorher = ALLOKATIONEN.with(Cell::get);
          let ergebnis = f();
          let nachher = ALLOKATIONEN.with(Cell::get);
          (ergebnis, nachher - vorher)
      }

      /// Erzeugt `zeilen` synthetische Access-Log-Zeilen. Gleicher `seed`, gleiche Zeilen.
      /// Format: `2026-10-24T08:15:02Z 10.0.3.17 GET /api/orders 200 87ms`
      pub fn erzeuge_log(zeilen: usize, seed: u64) -> String {
          // (Pfad, Anteil in Prozent, POST möglich, typische Latenz in ms)
          const PFADE: [(&str, u64, bool, u64); 12] = [
              ("/health", 22, false, 2),
              ("/static/app.js", 14, false, 6),
              ("/static/app.css", 12, false, 5),
              ("/api/orders", 10, true, 40),
              ("/api/orders/:id", 9, false, 25),
              ("/api/search", 8, false, 90),
              ("/api/users/:id", 7, false, 20),
              ("/api/cart", 6, true, 35),
              ("/login", 4, true, 60),
              ("/api/users", 3, false, 45),
              ("/api/checkout", 3, true, 120),
              ("/logout", 2, true, 15),
          ];
          let mut x = seed.max(1);
          let mut log = String::with_capacity(zeilen * 64);
          for i in 0..zeilen {
              // xorshift64: schnell, deterministisch, kein Crate nötig
              x ^= x << 13;
              x ^= x >> 7;
              x ^= x << 17;
              let mut wahl = x % 100;
              let mut eintrag = PFADE[0];
              for p in PFADE {
                  if wahl < p.1 {
                      eintrag = p;
                      break;
                  }
                  wahl -= p.1;
              }
              let (pfad, _, post_moeglich, basis) = eintrag;
              let methode = if post_moeglich && (x >> 4) % 3 == 0 { "POST" } else { "GET" };
              let status = match (x >> 8) % 100 {
                  0..=88 => 200,
                  89..=93 => 404,
                  94..=97 => 500,
                  _ => 503,
              };
              // jede 12. Anfrage hängt bis zu 1,5 s länger (langer Schwanz für p95)
              let extra = if (x >> 24) % 12 == 0 { (x >> 32) % 1500 } else { 0 };
              let ms = basis + (x >> 16) % (2 * basis) + extra;
              let _ = writeln!(
                  log,
                  "2026-10-24T{:02}:{:02}:{:02}Z 10.0.{}.{} {methode} {pfad} {status} {ms}ms",
                  (i / 3600) % 24,
                  (i / 60) % 60,
                  i % 60,
                  (x >> 40) % 256,
                  (x >> 48) % 256,
              );
          }
          log
      }

      #[derive(Debug, Clone, PartialEq, Default)]
      pub struct Pfad {
          pub anfragen: u32,
          pub fehler: u32,
          pub latenzen: Vec<u32>,
          pub p95: u32,
      }

      #[derive(Debug, PartialEq)]
      pub struct Bericht {
          /// ("GET /api/orders", Statistik), meiste Anfragen zuerst
          pub pfade: Vec<(String, Pfad)>,
          /// ("200", Anzahl), aufsteigend nach Code
          pub status: Vec<(String, u32)>,
      }

      /// Stand nach der ersten Änderung (p95 nach der Schleife).
      fn auswerten_vorher(log: &str) -> Bericht {
          let mut pfade: HashMap<String, Pfad> = HashMap::new();
          let mut status: HashMap<String, u32> = HashMap::new();

          for zeile in log.lines() {
              let zeile = zeile.to_string();
              let teile: Vec<String> = zeile.split(' ').map(|t| t.to_string()).collect();
              if teile.len() != 6 {
                  continue;
              }
              let schluessel = format!("{} {}", teile[2], teile[3]);
              let code = teile[4].clone();
              let ms: u32 = teile[5].trim_end_matches("ms").parse().unwrap_or(0);

              if !pfade.contains_key(&schluessel) {
                  pfade.insert(schluessel.clone(), Pfad::default());
              }
              let pfad = pfade.get_mut(&schluessel).unwrap();
              pfad.anfragen += 1;
              if code.starts_with('5') {
                  pfad.fehler += 1;
              }
              pfad.latenzen.push(ms);

              if status.contains_key(&code) {
                  *status.get_mut(&code).unwrap() += 1;
              } else {
                  status.insert(code.clone(), 1);
              }
          }

          for pfad in pfade.values_mut() {
              pfad.latenzen.sort();
              let rang = (pfad.latenzen.len() * 95).div_ceil(100);
              pfad.p95 = pfad.latenzen[rang - 1];
          }

          let mut pfade: Vec<(String, Pfad)> = pfade.into_iter().collect();
          pfade.sort_by(|a, b| b.1.anfragen.cmp(&a.1.anfragen).then(a.0.cmp(&b.0)));
          let mut status: Vec<(String, u32)> = status.into_iter().collect();
          status.sort();
          Bericht { pfade, status }
      }

      /// Teile als &str, Schlüssel geliehen, entry statt contains_key + insert.
      fn auswerten(log: &str) -> Bericht {
          let mut pfade: HashMap<(&str, &str), Pfad> = HashMap::new();
          let mut status: HashMap<&str, u32> = HashMap::new();

          for zeile in log.lines() {
              let teile: Vec<&str> = zeile.split(' ').collect();
              if teile.len() != 6 {
                  continue;
              }
              let code = teile[4];
              let ms: u32 = teile[5].trim_end_matches("ms").parse().unwrap_or(0);

              let pfad = pfade.entry((teile[2], teile[3])).or_default();
              pfad.anfragen += 1;
              if code.starts_with('5') {
                  pfad.fehler += 1;
              }
              pfad.latenzen.push(ms);
              *status.entry(code).or_insert(0) += 1;
          }

          for pfad in pfade.values_mut() {
              pfad.latenzen.sort();
              let rang = (pfad.latenzen.len() * 95).div_ceil(100);
              pfad.p95 = pfad.latenzen[rang - 1];
          }

          let mut pfade: Vec<(String, Pfad)> = pfade
              .into_iter()
              .map(|((methode, pfad), s)| (format!("{methode} {pfad}"), s))
              .collect();
          pfade.sort_by(|a, b| b.1.anfragen.cmp(&a.1.anfragen).then(a.0.cmp(&b.0)));
          let mut status: Vec<(String, u32)> =
              status.into_iter().map(|(c, n)| (c.to_string(), n)).collect();
          status.sort();
          Bericht { pfade, status }
      }

      fn main() {
          let log = erzeuge_log(200_000, 42);
          let (_, vorher) = zaehle(|| auswerten_vorher(&log));
          let (_, nachher) = zaehle(|| auswerten(&log));
          println!("vorher {vorher} Allokationen, nachher {nachher}");
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn gleicher_bericht() {
              for (zeilen, seed) in [(0, 1), (1, 7), (5_000, 42)] {
                  let log = erzeuge_log(zeilen, seed);
                  assert_eq!(auswerten(&log), auswerten_vorher(&log));
              }
          }

          #[test]
          fn hoechstens_halb_so_viele_allokationen() {
              let log = erzeuge_log(20_000, 42);
              let (a, vorher) = zaehle(|| auswerten_vorher(&log));
              let (b, nachher) = zaehle(|| auswerten(&log));
              assert_eq!(a, b);
              println!("vorher {vorher}, nachher {nachher}");
              assert!(nachher * 2 <= vorher, "vorher {vorher}, nachher {nachher}");
          }
      }
    checklist:
      - Der Zähler zählt pro Thread und liest den Stand nur vor und nach dem gemessenen Aufruf.
      - Der Test vergleicht die Berichte von `auswerten_vorher` und `auswerten` und prüft die Halbierung mit einer Meldung, die beide Zahlen nennt.
      - Die Teile der Zeile werden geliehen (`&str`), nicht kopiert.
      - Die Maps sind mit geliehenen Schlüsseln und `entry` gebaut; `format!` läuft nur noch beim Erstellen des Berichts.
      - Du hast pro Runde Allokationen und Laufzeit notiert und kannst sagen, welche Änderung wie viel gebracht hat.
    explanation: |
      Die Musterlösung leiht alle Teile der Zeile, nutzt `(&str, &str)` und `&str` als Schlüssel mit `entry` und baut die Strings des Berichts erst am Ende, einmal pro Pfad. Mit 200 000 Zeilen fiel die Zahl von 2 400 254 auf 400 271. Übrig sind zwei pro Zeile für den `Vec<&str>`, der beim `collect` einmal wächst. Wer auch ihn ersetzt, landet bei 271. Der Zähler pro Thread ist wichtig: Ein globaler Zähler würde Allokationen anderer Tests mitzählen, die gleichzeitig laufen. `try_with` statt `with` vermeidet eine Panik, falls während des Thread-Endes noch alloziert wird.
    resources:
      - title: std · GlobalAlloc
        url: https://doc.rust-lang.org/std/alloc/trait.GlobalAlloc.html
      - title: std · LocalKey::try_with
        url: https://doc.rust-lang.org/std/thread/struct.LocalKey.html#method.try_with
      - title: Perf Book · Heap Allocations
        url: https://nnethercote.github.io/perf-book/heap-allocations.html

  - id: messprotokoll-werkstatt
    type: practice
    title: Dein Messprotokoll
    prompt: |
      Schreibe das Messprotokoll deiner eigenen Werkstatt-Runden, so wie es in einen Pull Request gehört. Nimm deine Zahlen, nicht die aus der Lektion. Mindestens: Messaufbau, Baseline mit Streuung, jede Runde mit Hypothese aus dem Profil, Änderung, Nachweis gleicher Ergebnisse und Messung, dazu eine Entscheidung, wann du aufgehört hast.
    lang: text
    starter: |
      Messaufbau:
      Baseline:
      Runde 1:
      Entscheidung:
    solution: |
      Messaufbau: Testrechner, Linux, Rust 1.99.1, Profil profiling
      (inherits = "release", debug = true), 200 000 erzeugte Zeilen
      (seed 42), hyperfine 2.0 mit --warmup 3, criterion 0.8 mit
      50 000 Zeilen, Allokationen mit examples/allokationen.rs.

      Baseline: 3,142 s ± 0,009 s; criterion 210,87 ms; 2 582 829
      Allokationen. 50 000 Zeilen 0,21 s, 200 000 Zeilen 3,1 s: wächst
      stärker als die Eingabe.

      Runde 1: Profil 97,0 % in slice::sort aus auswerten (Sortieren
      nach jeder Zeile). Änderung: p95 nach der Schleife. Bericht
      gleich (Test und diff). 103 ms ± 2 ms (30,4-mal schneller),
      criterion −91,9 %.
      Runde 2: Profil zeigt collect (Vec<String>) mit malloc/realloc
      als größten Posten in auswerten. Änderung: Teile als &str.
      Bericht gleich (Test). 89,3 ms ± 2,2 ms (−13,4 %),
      800 254 Allokationen.
      Runde 3: Profil zeigt hashmap, format! und to_string für die
      Schlüssel. Änderung: entry und geliehene Schlüssel. Bericht
      gleich (Test). 70,6 ms ± 2,5 ms (−21,1 %), 400 271 Allokationen.
      Runde 4: Profil zeigt noch collect mit malloc für den Vec<&str>
      pro Zeile. Änderung: Felder direkt aus dem Iterator. Bericht
      gleich (Test). 63,5 ms ± 2,3 ms (−10,3 %), 271 Allokationen.

      Entscheidung: Stand von Runde 4 behalten. Mehr als die Hälfte
      der Samples liegt jetzt in erzeuge_log (Testgerüst). Weitere
      Arbeit an auswerten lohnt erst mit einer neuen Anforderung.
    checklist:
      - Jemand anderes könnte deine Messung mit den Angaben im Messaufbau wiederholen (Profil, Eingabe, Werkzeuge mit Optionen).
      - Die Baseline steht mit Streuung da, bevor die erste Änderung beschrieben wird.
      - Jede Runde nennt den Befund aus dem Profil, der sie begründet, nicht nur die Änderung.
      - Jede Runde enthält genau eine Änderung und einen Nachweis, dass der Bericht gleich bleibt.
      - Jede Messung ist gegen die direkt vorherige Fassung im selben hyperfine-Lauf oder gegen eine benannte criterion-Baseline gemacht.
      - Die Entscheidung zum Aufhören ist mit dem letzten Profil begründet.
    explanation: |
      Die Musterlösung zeigt das Protokoll mit den Zahlen des Testrechners. Deine Zahlen weichen ab, die Struktur sollte gleich sein. Ein gutes Protokoll lässt sich prüfen: Jede Aussage hat eine Messung, jede Änderung eine Begründung aus dem Profil, und das Ende ist eine Entscheidung, keine Erschöpfung. Genau so liest ein Reviewer eine Performance-Änderung, und genau so erzählst du sie im Vorstellungsgespräch.
    resources:
      - title: The Rust Performance Book · Benchmarking
        url: https://nnethercote.github.io/perf-book/benchmarking.html
