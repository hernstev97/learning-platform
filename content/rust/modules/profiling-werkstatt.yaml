  - id: hyperfine-vergleich
    type: command
    title: Vorher gegen nachher
    prompt: |
      Du hast die alte Fassung nach `./logauswertung-vorher` kopiert und die neue gebaut. Vergleiche beide mit hyperfine, mit **drei Aufwärmläufen**, die alte Fassung als Referenz.
    context: Du bist im Projektverzeichnis. Die neue Fassung liegt unter `target/profiling/logauswertung`.
    answers:
      - hyperfine --warmup 3 ./logauswertung-vorher target/profiling/logauswertung
      - hyperfine --warmup 3 ./logauswertung-vorher ./target/profiling/logauswertung
      - hyperfine -w 3 ./logauswertung-vorher target/profiling/logauswertung
      - hyperfine -w 3 ./logauswertung-vorher ./target/profiling/logauswertung
      - hyperfine --warmup=3 ./logauswertung-vorher target/profiling/logauswertung
      - hyperfine --warmup=3 ./logauswertung-vorher ./target/profiling/logauswertung
      - hyperfine ./logauswertung-vorher target/profiling/logauswertung --warmup 3
      - hyperfine ./logauswertung-vorher target/profiling/logauswertung -w 3
    output: |
      Benchmark 1: ./logauswertung-vorher (28 runs)
                      mean     ±       σ          min     …     max
        Wall Time    103.1 ms  ±     2.2 ms     100.2 ms  …   108.0 ms
        Memory        15.8 MiB ±     0.1 MiB     15.5 MiB …    15.9 MiB

      Benchmark 2: target/profiling/logauswertung (33 runs)
                      mean     ±       σ          min     …     max
        Wall Time     89.3 ms  ±     2.2 ms      86.9 ms  …    96.7 ms           -13.4%
        Memory        15.9 MiB ±     0.2 MiB     15.6 MiB …    16.1 MiB           +0.7%
    hints:
      - Die Option für Aufwärmläufe heißt `--warmup` oder kurz `-w`.
      - Das erste Kommando ist die Referenz, mit der alle weiteren verglichen werden.
    explanation: |
      `--warmup 3` startet jedes Kommando vor der Messung dreimal, damit Binary und Daten im Cache liegen. hyperfine vergleicht jedes weitere Kommando mit dem ersten; die Prozentzahl in der Zeile von Benchmark 2 bezieht sich also auf `logauswertung-vorher`. Beide Kommandos laufen im selben Aufruf und damit unter möglichst gleichen Bedingungen. Seit hyperfine 2.0 werden sie direkt gestartet, ohne Shell.
    resources:
