id: profiling-werkstatt
title: "Werkstatt: Profilieren und optimieren"
level: 3
minutes: 240
summary: Ein absichtlich langsames Rust-Programm Schritt für Schritt schneller machen, mit Baseline, Benchmark, Profil, genau einer Änderung pro Runde und einem Messprotokoll.
goals:
  - Du legst ein Cargo-Profil für Messungen an und begründest, warum Profile auf einem Release-Build mit Debug-Infos beruhen.
  - Du misst eine Baseline mit hyperfine und einen criterion-Benchmark mit gespeicherter Baseline und vergleichst danach jede Änderung damit.
  - Du nimmst ein Programm mit samply auf, findest im Profil die teure Stelle und schätzt mit Amdahls Gesetz ab, welche Änderung zuerst kommt.
  - Du zählst Allokationen mit einem eigenen `GlobalAlloc` und senkst sie gezielt, ohne das Ergebnis zu ändern.
  - Du schreibst ein Messprotokoll, das Messaufbau, Befund, Änderung und Entscheidung belegt.
