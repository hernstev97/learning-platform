  - id: wachstum-messen
    type: practice
    title: Wie wächst die Laufzeit?
    prompt: |
      In Schritt 2 hast du aus zwei Zahlen geschlossen, dass etwas schneller wächst als die Eingabe. Mach daraus eine Messung: Schreibe einen zweiten criterion-Benchmark `benches/wachstum.rs`, der `auswerten` für 10 000, 20 000 und 50 000 Zeilen misst und den Durchsatz in Zeilen pro Sekunde anzeigt.

      1. Trag `[[bench]] name = "wachstum"` mit `harness = false` in die `Cargo.toml` ein.
      2. Nutze eine `BenchmarkGroup`, `Throughput::Elements` und `bench_with_input` mit `BenchmarkId::from_parameter`.
      3. Erzeuge die Logs außerhalb der Messung.
      4. Lass ihn für die Ausgangsfassung und nach der ersten Änderung laufen (`cargo bench --bench wachstum`) und notiere die `thrpt`-Zeilen.
      5. Erkläre in zwei, drei Sätzen, was der Durchsatz über die Komplexität verrät.
    lang: rust
    starter: |
      use criterion::{BenchmarkId, Criterion, Throughput, criterion_group, criterion_main};
      use logauswertung::{auswerten, erzeuge_log};
      use std::hint::black_box;

      fn wachstum(c: &mut Criterion) {
          let mut gruppe = c.benchmark_group("wachstum");
          // …
          gruppe.finish();
      }

      criterion_group!(benches, wachstum);
      criterion_main!(benches);
    solution: |
      use criterion::{BenchmarkId, Criterion, Throughput, criterion_group, criterion_main};
      use logauswertung::{auswerten, erzeuge_log};
      use std::hint::black_box;

      fn wachstum(c: &mut Criterion) {
          let mut gruppe = c.benchmark_group("wachstum");
          gruppe.sample_size(10);
          for zeilen in [10_000, 20_000, 50_000] {
              let log = erzeuge_log(zeilen, 42);
              gruppe.throughput(Throughput::Elements(zeilen as u64));
              gruppe.bench_with_input(BenchmarkId::from_parameter(zeilen), &log, |b, log| {
                  b.iter(|| auswerten(black_box(log)))
              });
          }
          gruppe.finish();
      }

      criterion_group!(benches, wachstum);
      criterion_main!(benches);
    verify: false
    checklist:
      - Die Logs entstehen vor `bench_with_input`, nicht in der gemessenen Closure.
      - "`gruppe.throughput(Throughput::Elements(zeilen as u64))` steht vor jedem `bench_with_input`, damit criterion Zeilen pro Sekunde ausgibt."
      - Die Eingabe läuft durch `black_box`.
      - Du hast beide Fassungen gemessen und die drei `thrpt`-Werte je Fassung notiert.
      - Deine Erklärung sagt, dass sinkender Durchsatz bei wachsender Eingabe auf mehr als lineare Arbeit hindeutet und gleichbleibender Durchsatz auf lineare.
    explanation: |
      Auf dem Testrechner fiel der Durchsatz der Ausgangsfassung von 893,6 über 520,8 auf 237,6 Kelem/s, also Tausend Zeilen pro Sekunde. Je mehr Zeilen, desto teurer wird jede einzelne: Das passt zum Sortieren nach jeder Zeile, dessen Arbeit mit der Länge der Liste wächst. Nach der ersten Änderung blieb er bei 2,98, 2,88 und 2,91 Melem/s, die Arbeit pro Zeile ist also konstant. `Throughput::Elements` rechnet die Zeit pro Iteration in Elemente pro Sekunde um; `BenchmarkId::from_parameter` benennt die Messungen nach der Zeilenzahl.
    resources:
      - title: criterion · BenchmarkGroup::bench_with_input
        url: https://docs.rs/criterion/latest/criterion/struct.BenchmarkGroup.html#method.bench_with_input
      - title: criterion · Throughput
        url: https://docs.rs/criterion/latest/criterion/enum.Throughput.html

  - id: profil-erbt-falsch
    type: bug
    title: Fünfmal langsamer unter dem Profiler
    prompt: |
      Ein Kollege hat das Messprofil angelegt. Seitdem misst hyperfine für `target/profiling/logauswertung` 350,9 ms ± 6,3 ms. Dasselbe Programm aus `cargo build --release` braucht 62,8 ms ± 2,4 ms. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: toml
    code: |
      [profile.profiling]
      inherits = "dev"
      debug = true
    lines: [2]
    fix:
      - line: 2
        answers:
          - inherits = "release"
          - inherits = 'release'
    explanation: |
      Ein eigenes Profil braucht `inherits` und übernimmt alle Einstellungen des genannten Profils ([Custom profiles](https://doc.rust-lang.org/cargo/reference/profiles.html#custom-profiles)). Mit `inherits = "dev"` entsteht ein Debug-Build mit `opt-level = 0`, Überlaufprüfungen und `debug-assertions`. Auf dem Testrechner war das Binary damit 5,6-mal langsamer als mit `inherits = "release"` (62,6 ms ± 2,1 ms). Ein Profil davon zeigt Kosten von Funktionen, die der Release-Build einbaut oder ganz wegoptimiert. `debug = true` allein macht keinen Debug-Build; es legt nur Debug-Infos dazu.
    resources:
      - title: Cargo Book · Custom profiles
        url: https://doc.rust-lang.org/cargo/reference/profiles.html#custom-profiles
      - title: Cargo Book · Default profiles
        url: https://doc.rust-lang.org/cargo/reference/profiles.html#default-profiles

