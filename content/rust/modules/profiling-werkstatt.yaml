      }

      #[derive(Debug, Clone, PartialEq, Default)]
      pub struct Pfad {
          pub anfragen: u32,
          pub fehler: u32,
          pub latenzen: Vec<u32>,
          pub p95: u32,
      }

      #[derive(Debug, PartialEq)]
      pub struct Bericht {
          /// ("GET /api/orders", Statistik), meiste Anfragen zuerst
          pub pfade: Vec<(String, Pfad)>,
          /// ("200", Anzahl), aufsteigend nach Code
          pub status: Vec<(String, u32)>,
      }

      /// Die Ausgangsfassung aus der Lektion, unverändert.
      fn auswerten_langsam(log: &str) -> Bericht {
          let mut pfade: HashMap<String, Pfad> = HashMap::new();
          let mut status: HashMap<String, u32> = HashMap::new();

          for zeile in log.lines() {
              let zeile = zeile.to_string();
              let teile: Vec<String> = zeile.split(' ').map(|t| t.to_string()).collect();
              if teile.len() != 6 {
                  continue;
              }
              let schluessel = format!("{} {}", teile[2], teile[3]);
              let code = teile[4].clone();
              let ms: u32 = teile[5].trim_end_matches("ms").parse().unwrap_or(0);

              if !pfade.contains_key(&schluessel) {
                  pfade.insert(schluessel.clone(), Pfad::default());
              }
              let pfad = pfade.get_mut(&schluessel).unwrap();
              pfad.anfragen += 1;
              if code.starts_with('5') {
                  pfad.fehler += 1;
              }
              pfad.latenzen.push(ms);
              pfad.latenzen.sort();
              let rang = (pfad.latenzen.len() * 95).div_ceil(100);
              pfad.p95 = pfad.latenzen[rang - 1];

              if status.contains_key(&code) {
                  *status.get_mut(&code).unwrap() += 1;
              } else {
                  status.insert(code.clone(), 1);
              }
          }

          let mut pfade: Vec<(String, Pfad)> = pfade.into_iter().collect();
          pfade.sort_by(|a, b| b.1.anfragen.cmp(&a.1.anfragen).then(a.0.cmp(&b.0)));
          let mut status: Vec<(String, u32)> = status.into_iter().collect();
          status.sort();
          Bericht { pfade, status }
      }

      /// p95 erst nach der Schleife: einmal sortieren je Pfad statt nach jeder Zeile.
      fn auswerten(log: &str) -> Bericht {
          let mut pfade: HashMap<String, Pfad> = HashMap::new();
          let mut status: HashMap<String, u32> = HashMap::new();

          for zeile in log.lines() {
              let zeile = zeile.to_string();
              let teile: Vec<String> = zeile.split(' ').map(|t| t.to_string()).collect();
              if teile.len() != 6 {
                  continue;
              }
              let schluessel = format!("{} {}", teile[2], teile[3]);
              let code = teile[4].clone();
              let ms: u32 = teile[5].trim_end_matches("ms").parse().unwrap_or(0);

              if !pfade.contains_key(&schluessel) {
                  pfade.insert(schluessel.clone(), Pfad::default());
              }
              let pfad = pfade.get_mut(&schluessel).unwrap();
              pfad.anfragen += 1;
              if code.starts_with('5') {
                  pfad.fehler += 1;
              }
              pfad.latenzen.push(ms);

              if status.contains_key(&code) {
                  *status.get_mut(&code).unwrap() += 1;
              } else {
                  status.insert(code.clone(), 1);
              }
          }

          for pfad in pfade.values_mut() {
              pfad.latenzen.sort();
              let rang = (pfad.latenzen.len() * 95).div_ceil(100);
              pfad.p95 = pfad.latenzen[rang - 1];
          }

          let mut pfade: Vec<(String, Pfad)> = pfade.into_iter().collect();
          pfade.sort_by(|a, b| b.1.anfragen.cmp(&a.1.anfragen).then(a.0.cmp(&b.0)));
          let mut status: Vec<(String, u32)> = status.into_iter().collect();
          status.sort();
          Bericht { pfade, status }
      }

      fn main() {
          let log = erzeuge_log(200_000, 42);
          let bericht = auswerten(&log);
          println!("{} Pfade, Status: {:?}", bericht.pfade.len(), bericht.status);
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn gleicher_bericht_wie_vorher() {
              for (zeilen, seed) in [(0, 1), (1, 7), (3_000, 42), (10_000, 3)] {
                  let log = erzeuge_log(zeilen, seed);
                  assert_eq!(auswerten(&log), auswerten_langsam(&log), "{zeilen} Zeilen, seed {seed}");
              }
          }

          #[test]
          fn p95_und_kaputte_zeilen() {
              let mut log = String::from("kaputte Zeile\n\n");
              for ms in 1..=20 {
                  log.push_str(&format!("2026-10-24T00:00:00Z 10.0.0.1 GET /health 200 {ms}ms\n"));
              }
              let b = auswerten(&log);
              assert_eq!(b.pfade.len(), 1);
              assert_eq!(b.pfade[0].1.anfragen, 20);
              assert_eq!(b.pfade[0].1.p95, 19);
              assert_eq!(b, auswerten_langsam(&log));
          }
      }
    checklist:
      - Nur die p95-Berechnung ist verschoben; Schlüssel, Allokationen und Sortierung des Berichts sind unverändert.
      - Ein Test vergleicht `auswerten` und `auswerten_langsam` auf denselben erzeugten Logs, auch mit 0 Zeilen.
      - Ein Test prüft p95 an einem Fall, den du von Hand nachrechnen kannst, und überspringt kaputte Zeilen.
      - Du hast hyperfine (vorher gegen nachher im selben Lauf) und criterion (`--baseline vorher`) gemessen und beide Zahlen notiert.
      - Du kannst erklären, warum der Faktor im Benchmark mit 50 000 Zeilen kleiner ausfällt als im Programm mit 200 000 Zeilen.
    explanation: |
      Die Musterlösung verschiebt drei Zeilen: Sortieren und p95 laufen einmal pro Pfad in einer eigenen Schleife über `pfade.values_mut()`. Das Ergebnis ist gleich, weil der p95-Wert nur vom Endstand der Liste abhängt; der Zwischenstand nach jeder Zeile wurde nie gebraucht. Die Tests sichern genau das ab, auch für die Randfälle leeres Log und kaputte Zeilen. Auf dem Testrechner fiel das Programm von 3,143 s auf 0,103 s (30,4-mal schneller), der Benchmark mit 50 000 Zeilen um 91,9 %. Der Unterschied kommt daher, dass die quadratische Arbeit mit der Zahl der Zeilen pro Pfad wächst.
