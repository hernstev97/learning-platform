  - id: p95-aus-der-schleife
    type: practice
    title: Die heiße Funktion umbauen
    prompt: |
      Schreibe `auswerten` so um, dass p95 erst nach der Schleife berechnet wird. Der Bericht muss exakt gleich bleiben. Die Ausgangsfassung bleibt als `auswerten_langsam` im Code, damit ein Test beide auf denselben Daten vergleicht.

      1. Ändere nur die p95-Berechnung, sonst nichts (eine Änderung pro Runde).
      2. Ergänze die Tests: gleicher Bericht für mehrere Größen und Seeds, darunter ein leeres Log, und ein Fall mit bekanntem p95 und kaputten Zeilen.
      3. Übertrag die neue Funktion in dein Projekt und miss mit hyperfine gegen `logauswertung-vorher` und mit criterion gegen die Baseline `vorher`.
      4. Halte im Messprotokoll fest: Befund aus dem Profil, Änderung, beide Messungen, Testergebnis.
    lang: rust
    starter: |
      use std::collections::HashMap;
      use std::fmt::Write;

      /// Erzeugt `zeilen` synthetische Access-Log-Zeilen. Gleicher `seed`, gleiche Zeilen.
      /// Format: `2026-10-24T08:15:02Z 10.0.3.17 GET /api/orders 200 87ms`
      pub fn erzeuge_log(zeilen: usize, seed: u64) -> String {
          // (Pfad, Anteil in Prozent, POST möglich, typische Latenz in ms)
          const PFADE: [(&str, u64, bool, u64); 12] = [
              ("/health", 22, false, 2),
              ("/static/app.js", 14, false, 6),
              ("/static/app.css", 12, false, 5),
              ("/api/orders", 10, true, 40),
              ("/api/orders/:id", 9, false, 25),
              ("/api/search", 8, false, 90),
              ("/api/users/:id", 7, false, 20),
              ("/api/cart", 6, true, 35),
              ("/login", 4, true, 60),
              ("/api/users", 3, false, 45),
              ("/api/checkout", 3, true, 120),
              ("/logout", 2, true, 15),
          ];
          let mut x = seed.max(1);
          let mut log = String::with_capacity(zeilen * 64);
          for i in 0..zeilen {
              // xorshift64: schnell, deterministisch, kein Crate nötig
              x ^= x << 13;
              x ^= x >> 7;
              x ^= x << 17;
              let mut wahl = x % 100;
              let mut eintrag = PFADE[0];
              for p in PFADE {
                  if wahl < p.1 {
                      eintrag = p;
                      break;
                  }
                  wahl -= p.1;
              }
              let (pfad, _, post_moeglich, basis) = eintrag;
              let methode = if post_moeglich && (x >> 4) % 3 == 0 { "POST" } else { "GET" };
              let status = match (x >> 8) % 100 {
                  0..=88 => 200,
                  89..=93 => 404,
                  94..=97 => 500,
                  _ => 503,
              };
              // jede 12. Anfrage hängt bis zu 1,5 s länger (langer Schwanz für p95)
              let extra = if (x >> 24) % 12 == 0 { (x >> 32) % 1500 } else { 0 };
              let ms = basis + (x >> 16) % (2 * basis) + extra;
              let _ = writeln!(
                  log,
                  "2026-10-24T{:02}:{:02}:{:02}Z 10.0.{}.{} {methode} {pfad} {status} {ms}ms",
                  (i / 3600) % 24,
                  (i / 60) % 60,
                  i % 60,
                  (x >> 40) % 256,
                  (x >> 48) % 256,
              );
          }
          log
      }

      #[derive(Debug, Clone, PartialEq, Default)]
      pub struct Pfad {
          pub anfragen: u32,
          pub fehler: u32,
          pub latenzen: Vec<u32>,
          pub p95: u32,
      }

      #[derive(Debug, PartialEq)]
      pub struct Bericht {
          /// ("GET /api/orders", Statistik), meiste Anfragen zuerst
          pub pfade: Vec<(String, Pfad)>,
          /// ("200", Anzahl), aufsteigend nach Code
          pub status: Vec<(String, u32)>,
      }

      /// Die Ausgangsfassung aus der Lektion, unverändert.
      fn auswerten_langsam(log: &str) -> Bericht {
          let mut pfade: HashMap<String, Pfad> = HashMap::new();
          let mut status: HashMap<String, u32> = HashMap::new();

          for zeile in log.lines() {
              let zeile = zeile.to_string();
              let teile: Vec<String> = zeile.split(' ').map(|t| t.to_string()).collect();
              if teile.len() != 6 {
                  continue;
              }
              let schluessel = format!("{} {}", teile[2], teile[3]);
              let code = teile[4].clone();
              let ms: u32 = teile[5].trim_end_matches("ms").parse().unwrap_or(0);

              if !pfade.contains_key(&schluessel) {
                  pfade.insert(schluessel.clone(), Pfad::default());
              }
              let pfad = pfade.get_mut(&schluessel).unwrap();
              pfad.anfragen += 1;
              if code.starts_with('5') {
                  pfad.fehler += 1;
              }
              pfad.latenzen.push(ms);
              pfad.latenzen.sort();
              let rang = (pfad.latenzen.len() * 95).div_ceil(100);
              pfad.p95 = pfad.latenzen[rang - 1];

              if status.contains_key(&code) {
                  *status.get_mut(&code).unwrap() += 1;
              } else {
                  status.insert(code.clone(), 1);
              }
          }

          let mut pfade: Vec<(String, Pfad)> = pfade.into_iter().collect();
          pfade.sort_by(|a, b| b.1.anfragen.cmp(&a.1.anfragen).then(a.0.cmp(&b.0)));
          let mut status: Vec<(String, u32)> = status.into_iter().collect();
          status.sort();
          Bericht { pfade, status }
      }

      /// p95 erst nach der Schleife berechnen; der Bericht muss gleich bleiben.
      fn auswerten(log: &str) -> Bericht {
          todo!()
      }

      fn main() {
          let log = erzeuge_log(200_000, 42);
          let bericht = auswerten(&log);
          println!("{} Pfade, Status: {:?}", bericht.pfade.len(), bericht.status);
      }

      #[cfg(test)]
      mod tests {
          use super::*;

          #[test]
          fn gleicher_bericht_wie_vorher() {
              let log = erzeuge_log(5_000, 42);
              assert_eq!(auswerten(&log), auswerten_langsam(&log));
              // weitere Größen und Seeds, auch ein leeres Log
          }

          #[test]
          fn p95_und_kaputte_zeilen() {
              // ein Log, dessen p95 du von Hand nachrechnen kannst, plus kaputte Zeilen
              todo!()
          }
      }
