      - Nach jeder Zeile wird die ganze bisherige Liste des Pfads sortiert. Die Arbeit pro Zeile wächst mit der Länge der Liste, insgesamt also quadratisch mit den Zeilen pro Pfad. Viermal so viele Zeilen kosten deshalb rund fünfzehnmal so viel Zeit.
