lesson: |
  In [Performance messen und lesen](/rust/performance-messen) hast du Ausgaben gelesen. Jetzt erzeugst du sie selbst. Das Werkstück ist `logauswertung`, ein kleines Programm ohne fremde Crates. Es erzeugt 200 000 Zeilen eines Access-Logs und berechnet daraus Anfragen, Serverfehler (5xx) und die p95-Latenz je Methode und Pfad. Auf einem Testrechner braucht es dafür gut drei Sekunden. Am Ende dieser Werkstatt sind es 63 ms, und du kannst für jeden Schritt belegen, warum.

  Der Code enthält mehrere Bremsen, wie sie in echten Codebasen vorkommen. Such sie nicht durch Lesen. Der Sinn der Werkstatt ist, dass Messung und Profil dir sagen, wo du anfängst. Alle Zahlen in dieser Lektion stammen aus Läufen auf dem Testrechner. Deine werden anders aussehen; die Verhältnisse sollten ähnlich sein.

  ## Das Werkstück: eine absichtlich langsame Log-Auswertung

  Leg das Projekt an und ersetze den Inhalt der Dateien:

  ```console
  $ cargo new logauswertung
  $ cd logauswertung
  ```

  `Cargo.toml`, mit allem, was diese Werkstatt braucht:

  ```toml
  [package]
  name = "logauswertung"
  version = "0.1.0"
  edition = "2024"

  [dev-dependencies]
  criterion = "0.8"

  [[bench]]
  name = "auswerten"
  harness = false

  [profile.profiling]
  inherits = "release"
  debug = true
  ```

  `src/lib.rs` enthält den Generator für das Log, die Datentypen und die Auswertung:

  ```rust
  use std::collections::HashMap;
  use std::fmt::{self, Write};

  /// Erzeugt `zeilen` synthetische Access-Log-Zeilen. Gleicher `seed`, gleiche Zeilen.
  /// Format: `2026-10-24T08:15:02Z 10.0.3.17 GET /api/orders 200 87ms`
  pub fn erzeuge_log(zeilen: usize, seed: u64) -> String {
      // (Pfad, Anteil in Prozent, POST möglich, typische Latenz in ms)
      const PFADE: [(&str, u64, bool, u64); 12] = [
          ("/health", 22, false, 2),
          ("/static/app.js", 14, false, 6),
          ("/static/app.css", 12, false, 5),
          ("/api/orders", 10, true, 40),
          ("/api/orders/:id", 9, false, 25),
          ("/api/search", 8, false, 90),
          ("/api/users/:id", 7, false, 20),
          ("/api/cart", 6, true, 35),
          ("/login", 4, true, 60),
          ("/api/users", 3, false, 45),
          ("/api/checkout", 3, true, 120),
          ("/logout", 2, true, 15),
      ];
      let mut x = seed.max(1);
      let mut log = String::with_capacity(zeilen * 64);
      for i in 0..zeilen {
          // xorshift64: schnell, deterministisch, kein Crate nötig
          x ^= x << 13;
          x ^= x >> 7;
          x ^= x << 17;
          let mut wahl = x % 100;
          let mut eintrag = PFADE[0];
          for p in PFADE {
              if wahl < p.1 {
                  eintrag = p;
                  break;
              }
              wahl -= p.1;
          }
          let (pfad, _, post_moeglich, basis) = eintrag;
          let methode = if post_moeglich && (x >> 4) % 3 == 0 { "POST" } else { "GET" };
          let status = match (x >> 8) % 100 {
              0..=88 => 200,
              89..=93 => 404,
              94..=97 => 500,
              _ => 503,
          };
          // jede 12. Anfrage hängt bis zu 1,5 s länger (langer Schwanz für p95)
          let extra = if (x >> 24) % 12 == 0 { (x >> 32) % 1500 } else { 0 };
          let ms = basis + (x >> 16) % (2 * basis) + extra;
          let _ = writeln!(
              log,
              "2026-10-24T{:02}:{:02}:{:02}Z 10.0.{}.{} {methode} {pfad} {status} {ms}ms",
              (i / 3600) % 24,
              (i / 60) % 60,
              i % 60,
              (x >> 40) % 256,
              (x >> 48) % 256,
          );
      }
      log
  }

  #[derive(Debug, Clone, PartialEq, Default)]
  pub struct Pfad {
      pub anfragen: u32,
      pub fehler: u32,
      pub latenzen: Vec<u32>,
      pub p95: u32,
  }

  #[derive(Debug, PartialEq)]
  pub struct Bericht {
      /// ("GET /api/orders", Statistik), meiste Anfragen zuerst
      pub pfade: Vec<(String, Pfad)>,
      /// ("200", Anzahl), aufsteigend nach Code
      pub status: Vec<(String, u32)>,
  }

  impl fmt::Display for Bericht {
      fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
          for (name, p) in &self.pfade {
              writeln!(
                  f,
                  "{name:<24} {:>7} Anfragen {:>6} Fehler  p95 {:>5} ms",
                  p.anfragen, p.fehler, p.p95
              )?;
          }
          let codes: Vec<String> = self.status.iter().map(|(c, n)| format!("{c}={n}")).collect();
          writeln!(f, "Status: {}", codes.join(" "))
      }
  }

  /// Wertet das Log aus: Anfragen, Fehler (5xx) und p95-Latenz je Methode und Pfad,
  /// dazu die Häufigkeit jedes Statuscodes.
  pub fn auswerten(log: &str) -> Bericht {
      let mut pfade: HashMap<String, Pfad> = HashMap::new();
      let mut status: HashMap<String, u32> = HashMap::new();

      for zeile in log.lines() {
          let zeile = zeile.to_string();
          let teile: Vec<String> = zeile.split(' ').map(|t| t.to_string()).collect();
          if teile.len() != 6 {
              continue;
          }
          let schluessel = format!("{} {}", teile[2], teile[3]);
          let code = teile[4].clone();
          let ms: u32 = teile[5].trim_end_matches("ms").parse().unwrap_or(0);

          if !pfade.contains_key(&schluessel) {
              pfade.insert(schluessel.clone(), Pfad::default());
          }
          let pfad = pfade.get_mut(&schluessel).unwrap();
          pfad.anfragen += 1;
          if code.starts_with('5') {
              pfad.fehler += 1;
          }
          pfad.latenzen.push(ms);
          pfad.latenzen.sort();
          let rang = (pfad.latenzen.len() * 95).div_ceil(100);
          pfad.p95 = pfad.latenzen[rang - 1];

          if status.contains_key(&code) {
              *status.get_mut(&code).unwrap() += 1;
          } else {
              status.insert(code.clone(), 1);
          }
      }

      let mut pfade: Vec<(String, Pfad)> = pfade.into_iter().collect();
      pfade.sort_by(|a, b| b.1.anfragen.cmp(&a.1.anfragen).then(a.0.cmp(&b.0)));
      let mut status: Vec<(String, u32)> = status.into_iter().collect();
      status.sort();
      Bericht { pfade, status }
  }
  ```

  `src/main.rs` liest optional die Zeilenzahl und druckt den Bericht:

  ```rust
  use logauswertung::{auswerten, erzeuge_log};
  use std::env;
  use std::process::ExitCode;

  fn main() -> ExitCode {
      let zeilen: usize = match env::args().nth(1) {
          None => 200_000,
          Some(arg) => match arg.parse() {
              Ok(n) => n,
              Err(_) => {
                  eprintln!("Aufruf: logauswertung [zeilen]");
                  return ExitCode::from(2);
              }
          },
      };
      let log = erzeuge_log(zeilen, 42);
      let bericht = auswerten(&log);
      print!("{bericht}");
      ExitCode::SUCCESS
  }
  ```

  Das Log entsteht im Programm selbst und ist für denselben `seed` immer gleich. So misst jeder Lauf exakt dieselbe Arbeit, und du brauchst keine echte Logdatei mit echten IP-Adressen.

  ## Schritt 1: Messprofil und Baseline

  Gemessen wird nie im Debug-Build. Wie groß der Unterschied ist, zeigt die fertig optimierte Fassung vom Ende dieser Werkstatt: 349,0 ms im Debug-Build, 62,8 ms im Release-Build. Funktionsnamen findet der Profiler auch so, denn `release` entfernt die Symbole standardmäßig nicht (`strip = "none"`). Für eingebaute (inlined) Funktionen und Quellzeilen braucht er zusätzlich Debug-Infos. Das leistet das Profil `profiling` aus der `Cargo.toml` oben: Es erbt alle Einstellungen von `release` und legt Debug-Infos dazu ([Cargo Book: Custom profiles](https://doc.rust-lang.org/cargo/reference/profiles.html#custom-profiles), [debug](https://doc.rust-lang.org/cargo/reference/profiles.html#debug)). Das samply-README empfiehlt genau dieses Profil ([Turn on debug info](https://github.com/mstange/samply#turn-on-debug-info-for-full-stacks)). Bauen und kurz prüfen (Ausgabe gekürzt):

  ```console
  $ cargo build --profile profiling
      Finished `profiling` profile [optimized + debuginfo] target(s) in 0.57s
  $ target/profiling/logauswertung | head -3
  GET /health                43922 Anfragen   2579 Fehler  p95   565 ms
  GET /static/app.js         27882 Anfragen   1667 Fehler  p95   578 ms
  GET /static/app.css        24222 Anfragen   1516 Fehler  p95   601 ms
  ```

  Das Binary liegt unter `target/profiling/`, getrennt von `target/release/`. `debug = true` ändert die Optimierung nicht, nur die Größe der Datei. Profile wirken nur in der `Cargo.toml` an der Wurzel eines Workspace oder in einer `.cargo/config.toml` (dort schlägt das samply-README das Profil für alle Projekte vor). In einem Mitglied meldet Cargo `profiles for the non root package will be ignored` ([Cargo Book: Profiles](https://doc.rust-lang.org/cargo/reference/profiles.html)).

  Bevor du etwas änderst, hältst du fest, wo du stehst. hyperfine misst das ganze Programm ([hyperfine](https://github.com/sharkdp/hyperfine#basic-benchmarks)). Danach kopierst du das Binary weg, denn jeder Build überschreibt `target/profiling/logauswertung`, und spätere Vergleiche sollen gegen genau dieses Programm laufen:

  ```console
  $ hyperfine --warmup 3 target/profiling/logauswertung
  Benchmark 1: target/profiling/logauswertung (10 runs)
                  mean     ±       σ          min     …     max
    Wall Time    3.142 s   ±   0.009 s      3.129 s   …   3.157 s
    Memory        15.6 MiB ±     0.2 MiB     15.2 MiB …    15.8 MiB
  $ cp target/profiling/logauswertung logauswertung-vorher
  ```

  3,142 s ± 0,009 s, sehr geringe Streuung. Das ist die Baseline.

  ## Schritt 2: ein criterion-Benchmark für die heiße Funktion

  hyperfine misst alles, auch das Erzeugen des Logs. Für die Funktion, um die es geht, legst du einen criterion-Benchmark an. Die Einträge in der `Cargo.toml` stehen schon oben. `benches/auswerten.rs`:

  ```rust
  use criterion::{Criterion, criterion_group, criterion_main};
  use logauswertung::{auswerten, erzeuge_log};
  use std::hint::black_box;

  fn bench_auswerten(c: &mut Criterion) {
      let log = erzeuge_log(50_000, 42);
      let mut gruppe = c.benchmark_group("logauswertung");
      gruppe.sample_size(10);
      gruppe.bench_function("auswerten_50k", |b| {
          b.iter(|| auswerten(black_box(&log)))
      });
      gruppe.finish();
  }

  criterion_group!(benches, bench_auswerten);
  criterion_main!(benches);
  ```

  Eine Iteration der Ausgangsfassung dauert mit 50 000 Zeilen rund 200 ms. Mit den üblichen 100 Stichproben würde criterion sehr lange messen, deshalb senkt `sample_size(10)` die Zahl auf das erlaubte Minimum ([sample_size](https://docs.rs/criterion/latest/criterion/struct.BenchmarkGroup.html#method.sample_size)). Gespeichert wird das Ergebnis unter einem Namen, damit du später gezielt dagegen vergleichen kannst ([Command-Line Options](https://bheisler.github.io/criterion.rs/book/user_guide/command_line_options.html)). Der naheliegende Aufruf scheitert (Ausgabe gekürzt):

  ```console
  $ cargo bench -- --save-baseline vorher
       Running unittests src/lib.rs (target/release/deps/logauswertung-c3c50f6602f2758b)
  error: Unrecognized option: 'save-baseline'
  error: bench failed, to rerun pass `--lib`
  ```

  `cargo bench` startet zuerst das eingebaute Test-Gerüst für `src/lib.rs` und `src/main.rs`, und das kennt `--save-baseline` nicht. Die criterion-FAQ nennt zwei Auswege: nur den criterion-Benchmark starten oder für Bibliothek und Binary `bench = false` setzen ([FAQ](https://bheisler.github.io/criterion.rs/book/faq.html), [Cargo Book: bench field](https://doc.rust-lang.org/cargo/reference/cargo-targets.html#the-bench-field)). Mit `--bench auswerten` (Ausgabe gekürzt):

  ```console
  $ cargo bench --bench auswerten -- --save-baseline vorher
  logauswertung/auswerten_50k
                          time:   [210.45 ms 210.87 ms 211.28 ms]
  ```

  Ein erster Befund steckt schon in den beiden Zahlen. Das ganze Programm mit 200 000 Zeilen braucht 3,1 s, die Auswertung von 50 000 Zeilen 0,21 s. Viermal so viele Zeilen kosten also rund fünfzehnmal so viel Zeit. Irgendetwas wächst schneller als die Eingabe.

  ## Schritt 3: die Aufnahme mit samply

  [samply](https://github.com/mstange/samply) ist ein Sampling-Profiler. Er startet das Programm, nimmt standardmäßig 1000-mal pro Sekunde den Stack auf und öffnet danach das Ergebnis im Firefox Profiler im Browser. Die Daten bleiben auf deinem Rechner, bis du sie selbst hochlädst. Installiert wird samply mit `cargo install --locked samply` oder über die Installer im README.

  ```console
  $ samply record ./target/profiling/logauswertung
  ```

  Unter Linux braucht samply Zugriff auf Performance-Events des Kernels. Ist das normalen Benutzern verboten, bricht samply sofort ab. So sah es auf dem Testrechner aus:

  ```text
  '/proc/sys/kernel/perf_event_paranoid' is currently set to 2.
  In order for samply to work with a non-root user, this level needs
  to be set to 1 or lower.
  You can execute the following command and then try again:
      echo '1' | sudo tee /proc/sys/kernel/perf_event_paranoid
  ```

  Der Wert 2 verbietet unprivilegierten Benutzern das Profilieren des Kernels, samply verlangt 1 oder weniger ([Kernel-Doku: perf_event_paranoid](https://docs.kernel.org/admin-guide/sysctl/kernel.html#perf-event-paranoid)). Der Befehl aus der Meldung gilt bis zum nächsten Neustart; `sudo sysctl kernel.perf_event_paranoid=1` wirkt genauso. Auf einem eigenen Entwicklungsrechner ist das üblich. Auf geteilten Servern oder in Containern entscheidet der Administrator.

  > [!WARNING] Systemeinstellung, nicht Projekteinstellung
  > `perf_event_paranoid` gilt für alle Benutzer des Rechners. Setz ihn nur dort herunter, wo du allein arbeitest, und nur so lange, wie du profilierst. Eine dauerhafte Änderung über `/etc/sysctl.d/` gehört nicht in ein Projekt-README.

  Im Firefox Profiler zeigen drei Ansichten dieselben Daten unterschiedlich ([UI Tour](https://github.com/firefox-devtools/profiler/blob/main/docs-user/guide-ui-tour-panels.md)):

  - **Call Tree**: Aufrufe als Baum mit Gesamt- und Selbstzeit. Mit „Invert call stack“ stehen die Funktionen mit der meisten Selbstzeit oben ([Filtering call trees](https://github.com/firefox-devtools/profiler/blob/main/docs-user/guide-filtering-call-trees.md)).
  - **Flame Graph**: derselbe Baum als Flamegraph, gelesen wie in [Performance messen und lesen](/rust/performance-messen).
  - **Stack Chart**: die Stacks in zeitlicher Reihenfolge, passend zur Zeitleiste oben.

  Eine Aufnahme der Ausgangsfassung ergibt 3151 Samples, hier gefaltet und auf eine Ebene unter `auswerten` vereinfacht. Die Zahlen in dieser Lektion stammen aus [pprof-rs](https://docs.rs/pprof/latest/pprof/), einem Sampling-Profiler, der im Prozess selbst läuft (ebenfalls 1000 Hz, Profil `profiling`), weil samply auf dem Testrechner nicht messen durfte. Im Call Tree von samply suchst du nach denselben Funktionsnamen.

  ```text
  main;auswerten;sort 3057       # 97,0 %
  main;erzeuge_log 32            #  1,0 %
  main;auswerten;collect 30      #  1,0 %
  main;auswerten;hashmap 15      #  0,5 %
  main;auswerten;format! 8       #  0,3 %
  main;auswerten;… 9             #  0,3 %
  ```

  Fast jedes Sample endet im Sortieren. Der Stack darunter, gekürzt um die Typparameter:

  ```text
  logauswertung::auswerten
    <[u32]>::sort
      alloc::slice::stable_sort
        core::slice::sort::stable::sort
          core::slice::sort::stable::driftsort_main
            core::slice::sort::stable::drift::sort
              core::slice::sort::stable::drift::logical_merge
                core::slice::sort::stable::merge::merge
                  MergeState::merge_down        # 3049 Samples
  ```

  `<[u32]>::sort` wird nur an einer Stelle aufgerufen: `pfad.latenzen.sort()` in der Schleife über die Zeilen. Nach jeder Zeile sortiert das Programm alle bisherigen Latenzen dieses Pfads neu, um den p95-Wert aktuell zu halten. Der Pfad `/health` hat 43 922 Anfragen; seine Liste wird 43 922-mal sortiert, jedes Mal ein Stück länger. Die Arbeit wächst damit quadratisch mit der Zahl der Zeilen pro Pfad. Das erklärt den Befund aus Schritt 2.

  Amdahl sagt dir auch, was du nicht tun solltest: Die Allokationen durch `to_string`, `collect` und `format!` sind im Code gut sichtbar. Im Profil stecken `collect`, `format!`, `drop` und `clone` zusammen in 44 von 3151 Samples, also in 1,4 %. Sie zuerst zu entfernen, würde höchstens 1,4 % sparen.

  ## Schritt 4: genau eine Änderung, dann neu messen

  Die erste Änderung verschiebt die p95-Berechnung hinter die Schleife. Jeder Pfad wird einmal sortiert, mehr nicht:

  ```diff
           pfad.latenzen.push(ms);
  -        pfad.latenzen.sort();
  -        let rang = (pfad.latenzen.len() * 95).div_ceil(100);
  -        pfad.p95 = pfad.latenzen[rang - 1];

           if status.contains_key(&code) {
               *status.get_mut(&code).unwrap() += 1;
           } else {
               status.insert(code.clone(), 1);
           }
       }

  +    for pfad in pfade.values_mut() {
  +        pfad.latenzen.sort();
  +        let rang = (pfad.latenzen.len() * 95).div_ceil(100);
  +        pfad.p95 = pfad.latenzen[rang - 1];
  +    }
  +
       let mut pfade: Vec<(String, Pfad)> = pfade.into_iter().collect();
  ```

  Das Ergebnis muss gleich bleiben. Weil die Ausgabe deterministisch ist, reicht ein Vergleich der beiden Programme: `diff <(./logauswertung-vorher) <(target/profiling/logauswertung)` darf nichts ausgeben. Besser ist ein Test, der alte und neue Funktion auf denselben Daten vergleicht; das übst du in den Aufgaben. Dann misst du gegen die Baseline (criterion-Ausgabe gekürzt):

  ```console
  $ cargo build --profile profiling
  $ hyperfine --warmup 3 ./logauswertung-vorher target/profiling/logauswertung
  Benchmark 1: ./logauswertung-vorher (10 runs)
                  mean     ±       σ          min     …     max
    Wall Time    3.143 s   ±   0.004 s      3.134 s   …   3.147 s
    Memory        15.6 MiB ±     0.1 MiB     15.3 MiB …    15.8 MiB

  Benchmark 2: target/profiling/logauswertung (29 runs)
                  mean     ±       σ          min     …     max
    Wall Time    0.103 s   ±   0.002 s      0.100 s   …   0.107 s            -96.7%  (30.4x faster)
    Memory        15.8 MiB ±     0.1 MiB     15.5 MiB …    15.9 MiB           +1.2%
  $ cargo bench --bench auswerten -- --baseline vorher
  logauswertung/auswerten_50k
                          time:   [17.018 ms 17.032 ms 17.051 ms]
                          change: [−91.937% −91.919% −91.900%] (p = 0.00 < 0.05)
                          Performance has improved.
  ```

  Das ganze Programm ist 30,4-mal schneller. Der Benchmark mit 50 000 Zeilen zeigt nur Faktor 12: Bei weniger Zeilen pro Pfad fiel das quadratische Sortieren weniger ins Gewicht. Der Benchmark hat die Richtung richtig gezeigt, das Ausmaß im Betrieb hängt aber von der Eingabegröße ab. Miss mit Daten in der Größenordnung, die das Programm wirklich sieht.

  > [!MERKE]
  > Eine Runde ist immer: messen, genau eine Änderung, Ergebnis prüfen, gegen dieselbe Baseline messen, festhalten. Danach wird das neue Programm die nächste Baseline.

  ## Schritt 5: neues Profil, Allokationen zählen

  Nach der ersten Änderung sieht das Profil ganz anders aus. Damit genug Samples zusammenkommen, wurde es mit 2 000 000 Zeilen aufgenommen (974 Samples, vereinfacht, kleine Posten zusammengefasst):

  ```text
  main;erzeuge_log 314                    # 32,2 %
  main;auswerten;collect 144              # 14,8 %
  main;auswerten;collect;malloc 107       # 11,0 %
  main;auswerten;collect;realloc 38       #  3,9 %
  main;auswerten;hashmap 95               #  9,8 %
  main;auswerten;parse 75                 #  7,7 %
  main;auswerten;format! 57               #  5,9 %
  main;auswerten;lines 42                 #  4,3 %
  main;auswerten;drop;free 33             #  3,4 %
  main;auswerten;to_string 32             #  3,3 %
  main;auswerten;… 37                     #  3,8 %
  ```

  `erzeuge_log` ist das Testgerüst und nicht Teil der Aufgabe. In `auswerten` fällt `collect` auf: die Zeile `zeile.split(' ').map(|t| t.to_string()).collect()`, die jede Zeile in einen `Vec<String>` kopiert, mit `malloc` und `realloc` darunter. Zusammen mit `format!`, `to_string` und `free` sind Allokationen jetzt der größte Posten in `auswerten`. Ab hier lohnt es sich, sie zu zählen. Der Zähler aus dem Lese-Modul kommt als Beispiel ins Projekt, `examples/allokationen.rs`:

  ```rust
  //! Zählt Heap-Allokationen nur während `auswerten` (nicht beim Erzeugen, nicht beim Drucken).
  use logauswertung::{auswerten, erzeuge_log};
  use std::alloc::{GlobalAlloc, Layout, System};
  use std::sync::atomic::{AtomicUsize, Ordering::Relaxed};

  struct Zaehler;
  static ALLOKATIONEN: AtomicUsize = AtomicUsize::new(0);

  unsafe impl GlobalAlloc for Zaehler {
      unsafe fn alloc(&self, layout: Layout) -> *mut u8 {
          ALLOKATIONEN.fetch_add(1, Relaxed);
          unsafe { System.alloc(layout) }
      }
      unsafe fn dealloc(&self, ptr: *mut u8, layout: Layout) {
          unsafe { System.dealloc(ptr, layout) }
      }
  }

  #[global_allocator]
  static GLOBAL: Zaehler = Zaehler;

  fn main() {
      let zeilen: usize = std::env::args().nth(1).map_or(200_000, |a| a.parse().unwrap());
      let log = erzeuge_log(zeilen, 42);
      let vorher = ALLOKATIONEN.load(Relaxed);
      let bericht = auswerten(&log);
      let nachher = ALLOKATIONEN.load(Relaxed);
      std::hint::black_box(&bericht);
      println!("{} Allokationen in auswerten ({zeilen} Zeilen)", nachher - vorher);
  }
  ```

  ```console
  $ cargo run --profile profiling --example allokationen
  2400254 Allokationen in auswerten (200000 Zeilen)
  ```

  Zwölf Allokationen pro Zeile. Die nächsten drei Runden folgen demselben Muster, je eine Änderung:

  1. **Teile als `&str`.** `zeile.to_string()` fällt weg, `teile` wird ein `Vec<&str>`, der auf die Zeile zeigt.
  2. **Geliehene Schlüssel und `entry`.** Die Maps bekommen `(&str, &str)` und `&str` als Schlüssel, `entry(…).or_default()` ersetzt `contains_key` plus `insert`. `format!` läuft nur noch einmal pro Pfad beim Erstellen des Berichts.
  3. **Kein `Vec` pro Zeile.** Die sechs Felder kommen mit `let (Some(_), …, None) = (teile.next(), …) else { continue };` direkt aus dem Iterator.

  ## Schritt 6: das Messprotokoll

  Jede Zeile stammt aus einem hyperfine-Vergleich von vorheriger und neuer Fassung im selben Lauf (`--warmup 3`), die Allokationen aus `examples/allokationen.rs`:

  Die Prozentangaben vergleichen mit der vorherigen Fassung im selben hyperfine-Lauf; deshalb weichen sie leicht von dem ab, was du aus den gerundeten Zeilen nachrechnest.

  | Runde | Änderung | Wall Time | Allokationen |
  | --- | --- | --- | --- |
  | 0 | Ausgangsfassung | 3,142 s ± 0,009 s | 2 582 829 |
  | 1 | p95 nach der Schleife | 103 ms ± 2 ms (−96,7 %) | 2 400 254 |
  | 2 | Teile als `&str` | 89,3 ms ± 2,2 ms (−13,4 %) | 800 254 |
  | 3 | `entry`, geliehene Schlüssel | 70,6 ms ± 2,5 ms (−21,1 %) | 400 271 |
  | 4 | kein `Vec` pro Zeile | 63,5 ms ± 2,3 ms (−10,3 %) | 271 |

  Die erste Runde hat 97 % der Zeit gespart, die drei weiteren zusammen knapp 40 % des Rests. Nach Runde 4 steckt in der Aufnahme mehr als die Hälfte der Samples in `erzeuge_log`. Die Auswertung selbst ist kein großer Posten mehr. Hier hörst du auf, es sei denn, eine Anforderung verlangt mehr. Ein Messprotokoll sollte enthalten:

  - **Messaufbau:** Rechner (allgemein), Build-Profil, Eingabe, Werkzeuge mit Version und Optionen.
  - **Baseline** mit Streuung, bevor etwas geändert wurde.
  - **Pro Runde:** Hypothese aus dem Profil, genau eine Änderung, Nachweis, dass das Ergebnis gleich bleibt, Messung gegen die vorherige Fassung.
  - **Entscheidung:** behalten oder verwerfen, und wann du aufhörst.

  ## Häufige Fehler

  - **Debug-Build profilieren.** 349 statt 63 ms bei der fertigen Fassung, und das Profil zeigt Kosten, die es im Release-Build nicht gibt, weil nichts eingebaut wird.
  - **Ohne Debug-Infos profilieren.** Eingebaute Funktionen verschwinden, ihre Zeit erscheint beim Aufrufer.
  - **`cargo bench -- --save-baseline …`** ohne `--bench`: `Unrecognized option`, weil das eingebaute Test-Gerüst die Option nicht kennt.
  - **Das alte Binary nicht aufheben.** Nach dem nächsten Build gibt es nichts mehr, wogegen du vergleichen kannst.
  - **Zwei Änderungen in einer Runde.** Dann bleibt offen, welche wie viel gebracht hat.
  - **Benchmark mit zu kleiner Eingabe.** Mit 50 000 Zeilen zeigte die erste Änderung Faktor 12, im Programm mit 200 000 Zeilen Faktor 30.
  - **Das Testgerüst optimieren.** `erzeuge_log` dominiert am Ende das Profil, gehört aber nicht zur Aufgabe.
  - **Zahlen von verschiedenen Tagen vergleichen.** Last, Takt und Temperatur ändern sich. Vorher und nachher gehören in denselben hyperfine-Lauf.

  > [!PRAXIS] Baselines im Team
  > In Projekten mit Performance-Anforderungen läuft ein criterion-Vergleich gegen die Baseline des Hauptzweigs vor jedem Release, immer auf derselben Maschine. Auf geteilten CI-Runnern teilen sich mehrere Jobs dieselbe Hardware, dort schwanken Messungen stärker als auf einer festen Maschine. Jede Optimierung bekommt einen eigenen Commit mit dem Messprotokoll in der Beschreibung. So lässt sich eine einzelne Änderung zurücknehmen, wenn sie später Ärger macht.

  > [!INTERVIEW] „Erzähl von einer Optimierung, die du gemacht hast.“
  > Antworte mit dem Protokoll statt mit dem Trick: „Das Programm brauchte 3,1 Sekunden. Ich habe zuerst eine Baseline mit hyperfine genommen und dann mit samply profiliert. 97 % der Samples lagen im Sortieren, weil nach jeder Zeile neu sortiert wurde. Ich habe nur das geändert, ein Test hat bestätigt, dass der Bericht gleich bleibt, und die Laufzeit fiel auf 103 ms. Danach habe ich in drei weiteren Runden die Allokationen von zwölf pro Zeile auf fast null gesenkt und bei 63 ms aufgehört, weil der Rest im Testgerüst lag.“ Interviewer hören dabei auf drei Dinge: Messung vor Änderung, eine Änderung pro Runde, ein begründeter Schluss.

  ## Zusammenfassung

  - Gemessen und profiliert wird ein Release-Build mit Debug-Infos, am einfachsten über ein eigenes Profil `profiling` mit `inherits = "release"` und `debug = true`.
  - Zuerst die Baseline: hyperfine für das ganze Programm, das alte Binary aufheben, criterion mit `--bench name -- --save-baseline vorher` für die heiße Funktion.
  - samply braucht unter Linux `perf_event_paranoid` ≤ 1. Call Tree mit „Invert call stack“ zeigt Selbstzeit, Flame Graph die Struktur, Stack Chart den zeitlichen Verlauf.
  - Das Profil entscheidet die Reihenfolge. Hier lagen 97 % im Sortieren, die gut sichtbaren Allokationen bei 1,4 %.
  - Eine Runde ist: eine Änderung, Ergebnis per Test prüfen, gegen dieselbe Baseline messen, festhalten.
  - Allokationen zählt ein eigener `GlobalAlloc` stabil. `&str` statt `String`, `entry` und Iteratoren statt Zwischen-`Vec` senkten sie von 2,4 Millionen auf 271.
  - Aufhören, wenn das Profil keinen lohnenden Posten im eigenen Code mehr zeigt.
exercises:
  - id: profil-wahl
    type: choice
    title: Welches Binary kommt unter den Profiler?
    prompt: |
      Du willst `logauswertung` mit samply aufnehmen und danach im Call Tree nachsehen, welche Zeile im Quelltext teuer ist. Welches Binary nimmst du?
    options:
      - text: "`target/profiling/logauswertung`, gebaut mit `inherits = \"release\"` und `debug = true`."
        correct: true
        why: Optimiert wie das ausgelieferte Programm, und die Debug-Infos ordnen Samples Funktionen, eingebauten Funktionen und Quellzeilen zu.
      - text: "`target/debug/logauswertung` aus `cargo build`."
        correct: false
        why: Im Debug-Build war die fertige Fassung 5,6-mal langsamer, und ohne Optimierung verteilt sich die Zeit anders. Du würdest Stellen optimieren, die im Release-Build kein Problem sind.
      - text: "`target/release/logauswertung` ohne Debug-Infos."
        correct: false
        why: Die Zeiten stimmen, aber eingebaute Funktionen verschwinden im Stack, und die Quelltext-Ansicht findet keine Zeilen.
      - text: "Das Binary, das `cargo run --release` gerade baut, aufgenommen mit `samply record cargo run --release`."
        correct: false
        why: Dann nimmt samply auch Cargo selbst auf, samt Prüfung, ob neu gebaut werden muss. Nimm das fertige Binary direkt auf.
    explanation: |
      Ein Profil soll zeigen, wo das ausgelieferte Programm Zeit verbringt. Das verlangt die Optimierungen von `release`. Damit der Profiler die Samples Funktionen und Zeilen zuordnen kann, braucht er Debug-Infos. Das eigene Profil `profiling` liefert beides, ohne `release` selbst zu verändern. Das samply-README empfiehlt genau diesen Aufbau.
    resources:
      - title: samply · Turn on debug info for full stacks
        url: https://github.com/mstange/samply#turn-on-debug-info-for-full-stacks
      - title: Cargo Book · debug
        url: https://doc.rust-lang.org/cargo/reference/profiles.html#debug

  - id: entry-allokationen
    type: output
    title: Drei Wege zur selben Zählung
    prompt: |
      Der Zähler zählt jeden Aufruf von `alloc`. Die drei Maps haben vorab Platz für acht Einträge, wachsen also nicht. Was gibt das Programm aus?
    lang: rust
    code: |
      use std::alloc::{GlobalAlloc, Layout, System};
      use std::collections::HashMap;
      use std::sync::atomic::{AtomicUsize, Ordering::Relaxed};

      struct Zaehler;
      static N: AtomicUsize = AtomicUsize::new(0);

      unsafe impl GlobalAlloc for Zaehler {
          unsafe fn alloc(&self, layout: Layout) -> *mut u8 {
              N.fetch_add(1, Relaxed);
              unsafe { System.alloc(layout) }
          }
          unsafe fn dealloc(&self, ptr: *mut u8, layout: Layout) {
              unsafe { System.dealloc(ptr, layout) }
          }
      }

      #[global_allocator]
      static A: Zaehler = Zaehler;

      fn main() {
          let methoden = ["GET", "POST", "GET", "GET", "DELETE", "GET"];

          // A: entry mit eigenem String-Schlüssel
          let mut a: HashMap<String, u32> = HashMap::with_capacity(8);
          let t = N.load(Relaxed);
          for m in methoden {
              *a.entry(m.to_string()).or_insert(0) += 1;
          }
          let na = N.load(Relaxed) - t;

          // B: erst nachsehen, nur neue Schlüssel kopieren
          let mut b: HashMap<String, u32> = HashMap::with_capacity(8);
          let t = N.load(Relaxed);
          for m in methoden {
              if let Some(n) = b.get_mut(m) {
                  *n += 1;
              } else {
                  b.insert(m.to_string(), 1);
              }
          }
          let nb = N.load(Relaxed) - t;

          // C: geliehene Schlüssel
          let mut c: HashMap<&str, u32> = HashMap::with_capacity(8);
          let t = N.load(Relaxed);
          for m in methoden {
              *c.entry(m).or_insert(0) += 1;
          }
          let nc = N.load(Relaxed) - t;

          println!("{na} {nb} {nc}");
          println!("{} {} {}", a["GET"], b["GET"], c["GET"]);
      }
    expected: |
      6 3 0
      4 4 4
    hints:
      - "`entry` nimmt den Schlüssel als Wert. Bei `HashMap<String, _>` muss er also vorher ein `String` sein."
      - "`get_mut` sucht mit einem `&str`, ohne etwas anzulegen."
    explanation: |
      Variante A ruft für jede der sechs Methoden `m.to_string()` auf, bevor `entry` überhaupt nachsieht. Das sind sechs Allokationen, auch für die vier Treffer, deren String danach sofort wieder freigegeben wird. Variante B sucht zuerst mit `get_mut(m)`; das geht mit `&str`, weil `String` sich als `str` ausleihen lässt. Nur die drei neuen Schlüssel GET, POST und DELETE werden kopiert. Variante C leiht die Schlüssel aus dem Array und alloziert nie. In allen drei Fällen zählt GET viermal.
    resources:
      - title: std · HashMap::entry
        url: https://doc.rust-lang.org/std/collections/hash_map/struct.HashMap.html#method.entry
      - title: std · HashMap::get_mut
        url: https://doc.rust-lang.org/std/collections/hash_map/struct.HashMap.html#method.get_mut

  - id: profil-bauen
