id: ein-ausgabe
title: "Ein- und Ausgabe: Dateien, Prozesse, Netzwerk"
level: 2
minutes: 170
summary: Dateien, Kindprozesse und TCP-Verbindungen mit der Standardbibliothek – was dabei im Kernel passiert, wo Daten verloren gehen und warum Programme hängen bleiben.
place: unterwegs
goals:
  - Du wählst passende `OpenOptions`, setzt `BufWriter` gezielt ein und machst Schreibfehler mit `flush`, `into_inner` und `sync_all` sichtbar.
  - Du ersetzt eine Konfigurationsdatei atomar über eine temporäre Datei, `sync_all` und `rename` und begründest jeden Schritt.
  - Du startest Prozesse mit `Command` ohne Shell, wählst zwischen `status`, `output` und `spawn` und wertest Exit-Code, Signal, stdout und stderr aus.
  - Du erkennst die typischen Hänger mit Pipes – fehlendes EOF und volle Pipe-Puffer – und vermeidest sie.
  - Du baust Server und Client für ein Zeilenprotokoll über TCP mit Timeout und sauberem Verbindungsende und erklärst, warum TCP Framing braucht.
