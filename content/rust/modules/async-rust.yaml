goals:
- Du erklärst Future, Runtime, `.await` und `spawn` getrennt und liest den Fehler „future cannot be sent between threads safely“.
- Du sammelst Task-Ergebnisse mit `JoinHandle` und `JoinSet` und trennst `JoinError` vom fachlichen Fehler.
- Du setzt `select!` mit gepinntem Timer und `biased;` ein und prüfst die Cancellation Safety jedes Zweigs.
- Du beendest Tasks kooperativ mit `CancellationToken` und `TaskTracker` statt mit `abort()`.
- Du wählst den passenden Kanal und begrenzt Arbeit mit Backpressure und `Semaphore`.
- Du testest Timer-Logik mit `#[tokio::test(start_paused = true)]` ohne echte Wartezeit.
