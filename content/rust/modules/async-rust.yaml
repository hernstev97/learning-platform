  solution: |-
    use std::time::Duration;
    use tokio_util::sync::CancellationToken;

    pub async fn heartbeat(token: CancellationToken) -> u32 {
        let mut gesendet = 0;
        let mut takt = tokio::time::interval(Duration::from_secs(10));
        takt.tick().await; // der erste Tick kommt sofort
        loop {
            tokio::select! {
                _ = token.cancelled() => return gesendet,
                _ = takt.tick() => gesendet += 1,
            }
        }
    }

    #[tokio::test(start_paused = true)]
    async fn zaehlt_bis_zum_abbruch() {
        let token = CancellationToken::new();
        let task = tokio::spawn(heartbeat(token.clone()));
        tokio::time::sleep(Duration::from_secs(35)).await;
        token.cancel();
        assert_eq!(task.await.unwrap(), 3);
    }
  checklist:
  - Der Takt entsteht einmal vor der Schleife (`interval`), nicht als neuer `sleep` in jeder Runde.
  - "`select!` wartet auf `token.cancelled()` und auf `takt.tick()`."
  - Der sofortige erste Tick wird vor der Schleife verbraucht und nicht gezählt.
  - Der Test nutzt `start_paused = true` und läuft in Millisekunden statt 35 Sekunden.
  - Der Test bricht das Token ab und prüft das Ergebnis der Task über ihren JoinHandle.
  verify: false
  hints:
  - "`tokio::time::interval` liefert beim ersten `tick()` sofort; danach im eingestellten Abstand."
  - Bei angehaltener Zeit springt die Uhr zum nächsten Timer, sobald alle Tasks warten. Nach 35 Sekunden sind die Ticks bei 10, 20 und 30 Sekunden durch.
  explanation: |
    `interval` behält seinen Takt über alle Runden; ein `sleep` im Zweig würde in jeder Runde neu beginnen und bei häufigen anderen Ereignissen nie feuern. `token.cancelled()` ist cancel-safe, darf also in jeder Runde neu entstehen. Im Test steht die Uhr: Wartet die Test-Task auf `sleep(35 s)` und die Heartbeat-Task auf den nächsten Tick, springt Tokio von Timer zu Timer, bis 35 Sekunden vergangen sind. Ticks bei 10, 20 und 30 Sekunden ergeben 3. Lokal lief der Test in 0,00 s; ohne `start_paused` dauert er 35 echte Sekunden.
