- id: guard-block
  type: bug
  title: Der Block steht, und trotzdem kein Send
  prompt: |
    `melden` soll den Zähler unter der Sperre erhöhen und den neuen Stand danach über den Kanal melden. Der Block soll die Sperre vor dem `.await` beenden. `cargo build` meldet trotzdem (gekürzt):

    ```text
    error: future cannot be sent between threads safely
      --> src/main.rs:17:18
       |
    17 |     tokio::spawn(melden(zaehler, tx));
       |                  ^^^^^^^^^^^^^^^^^^^ future returned by `melden` is not `Send`
    note: future is not `Send` as this value is used across an await
      --> src/main.rs:10:19
       |
     5 |     let mut stand = zaehler.lock().unwrap();
       |         --------- has type `std::sync::MutexGuard<'_, u32>` which is not `Send`
    ...
    10 |     log.send(neu).await.unwrap();
       |                   ^^^^^ await occurs here, with `mut stand` maybe used later
    ```

    Finde die Zeilen, die die Sperre zu lange leben lassen, und korrigiere sie.
  lang: rust
  code: |-
    use std::sync::{Arc, Mutex};
    use tokio::sync::mpsc;

    async fn melden(zaehler: Arc<Mutex<u32>>, log: mpsc::Sender<u32>) {
        let mut stand = zaehler.lock().unwrap();
        let neu = {
            *stand += 1;
            *stand
        };
        log.send(neu).await.unwrap();
    }

    #[tokio::main]
    async fn main() {
        let zaehler = Arc::new(Mutex::new(0));
        let (tx, mut rx) = mpsc::channel(1);
        tokio::spawn(melden(zaehler, tx));
        println!("{:?}", rx.recv().await);
    }
  lines:
  - 5
  - 6
  fix:
  - line: 5
    answers:
    - let neu = {
  - line: 6
    answers:
    - let mut stand = zaehler.lock().unwrap();
  hints:
  - Die Notiz nennt Zeile 5 und Zeile 10. Wo beginnt und wo endet der Gültigkeitsbereich von `stand`?
  - Ein Guard endet am Ende des Blocks, in dem er gebunden wurde. In welchem Block steht `let mut stand` gerade?
  - Die beiden Zeilen 5 und 6 stehen in der falschen Reihenfolge.
  explanation: |
    `stand` wird in Zeile 5 im Funktionskörper gebunden, nicht im Block. Der Block liest den Guard nur, er besitzt ihn nicht, und so lebt der `MutexGuard` bis zum Ende der Funktion – über das `.await` in Zeile 10 hinweg. Der std-Guard ist nicht `Send`, also ist die ganze Future nicht `Send`, und `tokio::spawn` lehnt sie ab. Gehört `let mut stand = …` in den Block, endet die Sperre an dessen `}`; nach der Korrektur gibt das Programm `Some(1)` aus. Ein `drop(stand)` vor dem `.await` würde der Compiler nicht anerkennen, er entscheidet über Gültigkeitsbereiche. Selbst ohne `spawn` wäre der lange Guard falsch: Eine zweite Task auf demselben Thread, die sperren will, blockiert ihn.
  resources:
  - title: Tokio · Holding a MutexGuard across an .await
    url: https://tokio.rs/tokio/tutorial/shared-state#holding-a-mutexguard-across-an-await
  - title: Tokio · Spawning, Send bound
    url: https://tokio.rs/tokio/tutorial/spawning#send-bound
- id: timeout-handle
  type: explain
  title: Was läuft nach dem Zeitlimit?
  prompt: Ein JoinHandle wird in timeout verschoben. Erkläre, warum ein Timeout die Task nicht sicher beendet.
  lang: rust
  code: |-
    let handle = tokio::spawn(async { do_work().await });
    let result = tokio::time::timeout(duration, handle).await;
  points:
  - timeout wartet auf die Future des Handles.
  - Das Fallenlassen eines JoinHandle löst die Task nicht automatisch auf.
  - Die Task kann nach dem Timeout weiterarbeiten.
  - Ein geplanter Abbruch benötigt Handle, abort oder kooperatives Signal und Abschlussbeobachtung.
  explanation: Der Handle ist die Beobachtung einer gestarteten Task. Sein Verlust ist kein Rückruf ihrer Arbeit.
    Bewahre ihn, wenn du die Task nach dem Zeitlimit beenden und ihren Abschluss beobachten musst.
  resources:
  - title: JoinHandle::abort
    url: https://docs.rs/tokio/latest/tokio/task/struct.JoinHandle.html#method.abort
  - title: tokio::time::timeout
    url: https://docs.rs/tokio/latest/tokio/time/fn.timeout.html
- id: channel-worker
  type: practice
  title: Einen begrenzten Verarbeitungspfad bauen
  prompt: Baue einen Produzenten für die Werte 1 bis 5 und einen Consumer, der ihre Summe berechnet. Nutze Channel-Kapazität
    2, gib alle Sender frei und warte auf den Produzenten. Führe den Code in einem Cargo-Projekt mit Tokio aus.
  lang: rust
  solution: |-
    use tokio::sync::mpsc;
    #[tokio::main]
    async fn main() -> Result<(), Box<dyn std::error::Error>> {
        let (tx, mut rx) = mpsc::channel(2);
        let producer = tokio::spawn(async move {
            for n in 1..=5_u32 {
                if tx.send(n).await.is_err() { break; }
            }
        });
        let mut summe = 0;
        while let Some(n) = rx.recv().await { summe += n; }
        producer.await?;
        assert_eq!(summe, 15);
        println!("{summe}");
        Ok(())
    }
  checklist:
  - Die Cargo-Dependency aktiviert rt-multi-thread, macros und sync.
  - Die Kapazität ist 2 und send wird abgewartet.
  - Kein Sender bleibt außerhalb des Produzenten übrig.
  - Die Empfangsschleife endet und liefert 15.
  - Ein Task-Fehler wird nicht still ignoriert.
  verify: false
  explanation: Der Produzent besitzt den einzigen Sender. Nach seiner Schleife wird dieser freigegeben; der Consumer
    leert den Puffer und erhält None. Der JoinHandle macht das Ende beobachtbar.
  resources:
  - *id001
- id: heartbeat-abbrechen
  type: practice
  title: Ein Heartbeat, der auf Abbruch hört
  prompt: |
    Ein Dienst sendet alle 10 Sekunden einen Heartbeat an das Monitoring. Schreibe `async fn heartbeat(token: CancellationToken) -> u32`, die mit `tokio::time::interval` taktet, bei jedem Takt einen Heartbeat zählt (das Senden selbst darfst du weglassen) und bei Abbruch des Tokens die Zahl gesendeter Heartbeats zurückgibt. Der erste, sofortige Tick des Intervalls zählt nicht.

    Schreibe dazu einen Test mit `#[tokio::test(start_paused = true)]`: Task starten, 35 Sekunden warten, Token abbrechen, Ergebnis 3 erwarten. Der Test darf keine echten 35 Sekunden dauern. Du brauchst `tokio` mit `test-util` in den `[dev-dependencies]` und `tokio-util`.
  lang: rust
  starter: |-
