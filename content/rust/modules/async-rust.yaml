lesson: |
  Ein Werkzeug fragt 200 Dienste nach ihrem Health-Status und wartet fast die ganze Zeit auf das Netz. Ein Thread pro Anfrage kostet je einen Stack und Kontextwechsel im Kernel; asynchroner Code verwaltet viele wartende Operationen auf wenigen Threads. CPU-lastige Arbeit wird dadurch nicht schneller, und ein blockierender Aufruf bleibt blockierend, auch in einer `async fn`.

  Threads, Channels und `Send`/`Sync` kennst du aus [Nebenläufigkeit](/rust/nebenlaeufigkeit), Dateien und TCP mit der Standardbibliothek aus [Ein- und Ausgabe](/rust/ein-ausgabe). Hier geht es um die Lebensdauer nebenläufiger Arbeit: Wer startet sie, wer wartet auf das Ergebnis, wann endet sie, und wie begrenzt du Überlast?

  ## Futures beschreiben noch nicht abgeschlossene Arbeit

  Der Aufruf einer `async fn` erzeugt eine Future. Ihr Körper läuft dadurch noch nicht. Eine Runtime ruft `poll` auf, und die Future liefert ihr Ergebnis oder `Pending`. Im zweiten Fall hat sie einen Waker hinterlegt, über den sie meldet, wann sich ein neuer Versuch lohnt ([Tokio: Async in depth](https://tokio.rs/tokio/tutorial/async)).

  ```rust
  async fn meldung() {
      println!("ausgeführt");
  }

  fn main() {
      let future = meldung();
      println!("erzeugt");
      drop(future);
  }
  ```

  Hier erscheint nur `erzeugt`, denn niemand hat die Future gepollt. `.await` heißt: die innere Future bis zum Ergebnis treiben und, solange sie `Pending` liefert, den Thread für andere Tasks freigeben. Es heißt weder „neuer Thread“ noch „garantierte Unterbrechung“; eine fertige Future liefert sofort.

  Die Sprache stellt `Future` und `async` bereit, Tokio Executor, Timer, Netzwerk und Synchronisation:

  ```toml
  [dependencies]
  tokio = { version = "1.54", features = ["full"] }
  tokio-util = { version = "0.7", features = ["rt"] }
  tokio-stream = { version = "0.1", features = ["io-util"] }
  ```

  `full` schaltet alle stabilen Features außer `test-util` ein; Bibliotheken wählen gezielt aus der [Feature-Liste](https://docs.rs/tokio/latest/tokio/#feature-flags). Die Plattform kompiliert Tokio-Code nicht, jedes Beispiel hier ist lokal mit Tokio 1.54 gelaufen.

  ## Await-Reihenfolge und gemeinsame Ausführung

  Zwei aufeinanderfolgende `.await` laufen nacheinander. Sind die Operationen unabhängig, treibe beide Futures gemeinsam voran. `tokio::join!` tut das innerhalb derselben Task; es verspricht keine parallele Ausführung auf zwei Kernen.

  ```rust
  use tokio::time::{sleep, Duration};

  async fn wert(n: u32) -> u32 {
      sleep(Duration::from_millis(5)).await;
      n
  }

  #[tokio::main]
  async fn main() {
      let (a, b) = tokio::join!(wert(2), wert(3));
      println!("{}", a + b);
  }
  ```

  Beide Zweige warten gleichzeitig. Das Tupel folgt der Argumentreihenfolge, nicht der Abschlussreihenfolge. `try_join!` kehrt beim ersten Fehler zurück und droppt die übrigen Futures; schon versendete Anfragen macht das nicht rückgängig. Ein blockierender Zweig hält alle anderen Zweige derselben Task an ([join!](https://docs.rs/tokio/latest/tokio/macro.join.html)).

  ## Spawn: Tasks brauchen Besitzer, Ergebnis und `Send`

  `tokio::spawn` startet eine eigenständig geplante Task. Die Future muss `Send + 'static` sein: `Send`, weil die Runtime die Task zwischen ihren Worker-Threads verschieben darf, `'static`, weil sie keine kurzlebigen Leihgaben des Aufrufers halten darf. `async move` übernimmt die benötigten Werte.

  ```rust
  #[tokio::main]
  async fn main() {
      let name = String::from("Backup");
      let task = tokio::spawn(async move { name.len() });
      let laenge = task.await.expect("Demo-Task darf nicht paniken");
      println!("{laenge}");
  }
  ```

  Der [`JoinHandle`](https://tokio.rs/tokio/tutorial/spawning) liefert beim Await einen `JoinError`, wenn die Task panikt oder abgebrochen wird. Gibt die Task selbst `Result<T, E>` zurück, gibt es zwei Fehlerebenen: Lief die Task zu Ende, und war ihre Arbeit erfolgreich? Behandle beide getrennt. Einen JoinHandle fallen zu lassen bricht die Task nicht ab. Ein [`JoinSet`](https://docs.rs/tokio/latest/tokio/task/struct.JoinSet.html) sammelt mehrere Tasks, liefert mit `join_next` den jeweils nächsten Abschluss und bricht beim Drop die übrigen ab.

  ```rust
  use tokio::task::JoinSet;

  #[tokio::main]
  async fn main() {
      let mut jobs = JoinSet::new();
      for n in 1..=3 {
          jobs.spawn(async move { n * 2 });
      }
      let mut ergebnisse = Vec::new();
      while let Some(result) = jobs.join_next().await {
          ergebnisse.push(result.expect("Demo-Task"));
      }
      ergebnisse.sort();
      println!("{ergebnisse:?}");
  }
  ```

  > [!PRAXIS]
  > Ein Task-Start ohne klaren Ergebnis- und Abbruchpfad ist im Review ein Warnsignal. Notiere den Owner, die Fehlerbehandlung und das Verhalten beim Herunterfahren, bevor du weitere Arbeit auslagerst.

  ### „future cannot be sent between threads safely“ lesen

  Was über ein `.await` hinweg lebt, speichert der Compiler in der Future. Geht sie an `spawn`, muss jeder dieser Werte `Send` sein. Der häufigste Verstoß ist ein `std::sync::MutexGuard` oder ein `Rc` über einem `.await`:

  ```rust nocheck
  use std::sync::{Arc, Mutex};
  use tokio::time::{sleep, Duration};

  async fn zaehlen(zaehler: Arc<Mutex<u64>>) {
      let mut stand = zaehler.lock().unwrap();
      *stand += 1;
      sleep(Duration::from_millis(10)).await;
      println!("Stand: {}", *stand);
  }

  #[tokio::main]
  async fn main() {
      let zaehler = Arc::new(Mutex::new(0));
      tokio::spawn(zaehlen(zaehler)).await.unwrap();
  }
  ```

  `cargo build` mit Rust 1.99.1 (gekürzt, Pfad zur Tokio-Quelle abgekürzt):

  ```text
  error: future cannot be sent between threads safely
     --> src/main.rs:14:18
      |
   14 |     tokio::spawn(zaehlen(zaehler)).await.unwrap();
      |                  ^^^^^^^^^^^^^^^^ future returned by `zaehlen` is not `Send`
      |
      = help: within `impl Future<Output = ()>`, the trait `Send` is not implemented for `std::sync::MutexGuard<'_, u64>`
  note: future is not `Send` as this value is used across an await
     --> src/main.rs:7:38
      |
    5 |     let mut stand = zaehler.lock().unwrap();
      |         --------- has type `std::sync::MutexGuard<'_, u64>` which is not `Send`
    6 |     *stand += 1;
    7 |     sleep(Duration::from_millis(10)).await;
      |                                      ^^^^^ await occurs here, with `mut stand` maybe used later
  note: required by a bound in `tokio::spawn`
     --> …/tokio-1.54.1/src/task/spawn.rs:176:21
      |
  176 |         F: Future + Send + 'static,
      |                     ^^^^ required by this bound in `spawn`
  ```

  Lies sie in drei Schritten: Zeile 14 und die letzte Notiz sagen, wo und warum `Send` verlangt wird. Die `help`-Zeile nennt den Typ, dem `Send` fehlt. Die mittlere Notiz zeigt den Mechanismus: `stand` aus Zeile 5 lebt über das `.await` in Zeile 7, an dem die Runtime die Task auf einen anderen Thread verschieben darf.

  Die meist richtige Lösung: Der Guard endet vor dem `.await`. Ein `drop(stand)` davor reicht dem Compiler nicht – die Meldung bleibt in Rust 1.99.1, weil er laut [Tokio-Tutorial](https://tokio.rs/tokio/tutorial/shared-state#holding-a-mutexguard-across-an-await) nur Gültigkeitsbereiche auswertet. Ein Block reicht:

  ```rust
  async fn zaehlen(zaehler: Arc<Mutex<u64>>) {
      let neu = {
          let mut stand = zaehler.lock().unwrap();
          *stand += 1;
          *stand
      }; // Guard endet hier, vor dem .await
      sleep(Duration::from_millis(10)).await;
      println!("Stand: {neu}");
  }
  ```

  `tokio::sync::Mutex` ist die zweite Lösung, aber nur, wenn die Sperre wirklich über ein `.await` reichen muss, etwa weil Tasks dieselbe Verbindung nacheinander beschreiben. Für kurze Änderungen an Zählern oder Maps empfiehlt Tokio den std-Mutex ([std- oder Tokio-Mutex](https://tokio.rs/tokio/tutorial/shared-state#on-using-stdsyncmutex-and-tokiosyncmutex)). Eine Runtime ohne `Send`-Pflicht verschiebt das Problem nur: Will eine zweite Task auf demselben Thread sperren, blockiert sie ihn, und die erste kommt nie zum Freigeben.

  ## select!: das erste Ergebnis gewinnt, der Rest wird gedroppt

  `tokio::select!` wartet in derselben Task auf mehrere Futures. Sobald eine fertig ist und ihr Muster passt, läuft deren Zweig, und alle anderen Futures dieses Durchlaufs werden gedroppt ([select!](https://docs.rs/tokio/latest/tokio/macro.select.html)). Eine gedroppte Operation endet an ihrem letzten `.await`, ohne Ergebnis und ohne Fehler. Was sie bis dahin getan hat, bleibt getan.

  ```rust
  use tokio::sync::mpsc;
  use tokio::time::{sleep, Duration};

  #[tokio::main]
  async fn main() {
      let (tx, mut rx) = mpsc::channel::<String>(16);
      tokio::spawn(async move {
          for n in 1..=3 {
              let _ = tx.send(format!("event {n}")).await;
              sleep(Duration::from_millis(40)).await;
          }
      });

      let frist = sleep(Duration::from_millis(100));
      tokio::pin!(frist);
      loop {
          tokio::select! {
              biased;
              _ = &mut frist => {
                  println!("Frist erreicht");
                  break;
              }
              nachricht = rx.recv() => match nachricht {
                  Some(text) => println!("{text}"),
                  None => break,
              },
          }
      }
  }
  ```

  Ausgabe: `event 1` bis `event 3`, dann `Frist erreicht`. Zwei Details tragen das Beispiel:

  - **Der Timer entsteht einmal.** `sleep(…)` steht vor der Schleife, `tokio::pin!` heftet die Future fest, und `&mut frist` übergibt in jeder Runde dieselbe. Stünde `sleep(…)` im Zweig, begänne in jeder Runde ein neuer Timer, und bei einem Event alle 40 ms liefe die Frist nie ab. `&mut` auf eine Future verlangt `Unpin`, daher das Pinnen.
  - **`biased;` legt die Reihenfolge fest.** Ohne prüft `select!` die Zweige in zufälliger Reihenfolge, damit kein ständig bereiter Zweig die anderen aushungert ([Fairness](https://docs.rs/tokio/latest/tokio/macro.select.html#fairness)). Mit `biased;` gilt oben vor unten; Frist und Shutdown gehören dann nach oben.

  ### Cancellation Safety: Was geht beim Drop verloren?

  In einer Schleife wird jeder Verlierer-Zweig verworfen und in der nächsten Runde neu erzeugt. Das ist nur korrekt, wenn ein Neubeginn nichts verliert. Tokio nennt das Cancellation Safety, vermerkt sie bei den einzelnen Methoden und sammelt die häufigsten im Abschnitt [Cancellation safety](https://docs.rs/tokio/latest/tokio/macro.select.html#cancellation-safety):

  | Methode | cancel-safe | Grund |
  | --- | --- | --- |
  | `mpsc::Receiver::recv` | ja | Eine Nachricht verlässt den Kanal erst mit dem Ergebnis. |
  | `TcpListener::accept` | ja | Die Verbindung wartet weiter in der Queue des Kernels. |
  | `AsyncReadExt::read_exact` | nein | Schon entnommene Bytes sind weg, ihre Zahl kennst du nicht. |
  | `AsyncWriteExt::write_all` | nein | Ein Teil ist vielleicht schon gesendet. |
  | `Mutex::lock`, `Semaphore::acquire` | nein | Der Platz in der fairen Warteschlange geht verloren. |

  Beim Herunterfahren ist ein halb gelesener Datensatz oft egal, in einer `select!`-Schleife verlierst du damit Daten. Lege solche Operationen in eine eigene Task, erzeuge sie einmal vor der Schleife und selecte auf `&mut`, oder nimm eine cancel-safe Variante wie `Lines::next_line`.

  > [!MERKE]
  > `select!` droppt jeden Zweig, der nicht gewinnt. In eine `select!`-Schleife gehört nur, was einen Neubeginn ohne Verlust übersteht – das steht in der Doku jeder Tokio-Methode unter „Cancel safety“.

  [`timeout`](https://docs.rs/tokio/latest/tokio/time/fn.timeout.html) ist ein `select!` zwischen deiner Future und einem Timer. Er begrenzt das Warten, unterbricht aber keinen CPU-Code: Gibt eine Future nie Kontrolle ab, wird die Grenze überschritten. Und `timeout(handle)` auf einem JoinHandle droppt nach Ablauf nur den Handle; die Task arbeitet weiter.

  ## Kooperativ beenden: CancellationToken und TaskTracker

  [`JoinHandle::abort`](https://docs.rs/tokio/latest/tokio/task/struct.JoinHandle.html#method.abort) bricht eine Task am nächsten `.await` ab. Danach laufen nur noch die `Drop`-Implementierungen ihrer Werte, das Await auf den Handle liefert meist einen „cancelled“-`JoinError`. Für Arbeit, die aufräumen muss – Datei abschließen, Abmeldung senden –, ist das zu grob. Ein [`CancellationToken`](https://docs.rs/tokio-util/latest/tokio_util/sync/struct.CancellationToken.html) aus `tokio-util` macht den Abbruch kooperativ: Der Auslöser ruft `cancel()`, jede Task wartet in ihrem `select!` zusätzlich auf `cancelled()` und entscheidet selbst, wie sie endet.

  ```rust
  use std::time::Duration;
  use tokio_util::sync::CancellationToken;
  use tokio_util::task::TaskTracker;

  async fn worker(name: &'static str, token: CancellationToken) {
      let mut runden = 0;
      loop {
          tokio::select! {
              _ = token.cancelled() => {
                  println!("{name}: räume auf nach {runden} Runden");
                  return;
              }
              _ = tokio::time::sleep(Duration::from_millis(200)) => runden += 1,
          }
      }
  }

  #[tokio::main]
  async fn main() {
      let token = CancellationToken::new();
      let tracker = TaskTracker::new();
      for name in ["import", "export"] {
          tracker.spawn(worker(name, token.child_token()));
      }
      tracker.close();

      tokio::signal::ctrl_c().await.expect("Signal-Handler");
      token.cancel();
      tracker.wait().await;
      println!("sauber beendet");
  }
  ```

  Mit SIGINT nach 0,7 Sekunden (per `kill -INT`, wirkt wie Strg+C) meldeten beide Worker `räume auf nach 3 Runden`, dann kam `sauber beendet`.

  - [`child_token()`](https://docs.rs/tokio-util/latest/tokio_util/sync/struct.CancellationToken.html#method.child_token) bricht mit dem Elterntoken ab, lässt sich aber auch allein abbrechen. So beendest du einen Teilbaum, etwa alle Tasks einer Verbindung.
  - [`TaskTracker`](https://docs.rs/tokio-util/latest/tokio_util/task/task_tracker/struct.TaskTracker.html) wartet mit `wait()`, bis er geschlossen und leer ist. Anders als ein `JoinSet` speichert er keine Rückgabewerte und bricht beim Drop nichts ab.
  - `tokio::signal::ctrl_c()` ist der async-Signal-Handler; synchrone CLIs lösen dasselbe in [Rust in der Praxis](/rust/rust-praxis) mit einem Flag.

  Die [Shutdown-Anleitung](https://tokio.rs/tokio/topics/shutdown) beschreibt dieselben drei Schritte: Auslöser erkennen, alle Teile benachrichtigen, auf ihr Ende warten.

  ## Kanäle, Backpressure und Semaphore

  Tokio hat vier Kanalarten ([Übersicht](https://docs.rs/tokio/latest/tokio/sync/index.html#message-passing)). Die Wahl hängt an drei Fragen: Wie viele senden, wie viele lesen, und muss jede Nachricht ankommen?

  | Kanal | Sender → Leser | Was ankommt | Einsatz |
  | --- | --- | --- | --- |
  | `oneshot` | einer → einer | genau ein Wert | Antwort auf eine Anfrage |
  | `mpsc` | viele → einer | jede Nachricht, in Reihenfolge | Aufträge an einen Worker |
  | `broadcast` | viele → viele | jede Nachricht an jeden Leser | Ereignisse für alle |
  | `watch` | viele → viele | nur der letzte Wert | Konfiguration, Shutdown-Flag |

  Ein `watch`-Leser überspringt Zwischenstände, gewollt: Von einer Konfiguration zählt der aktuelle Stand. `broadcast` hält jede Nachricht, bis alle Leser sie haben, aber höchstens so viele, wie die Kapazität erlaubt. Wer zurückfällt, bekommt `RecvError::Lagged(n)` und liest ab der ältesten vorhandenen Nachricht weiter ([Lagging](https://docs.rs/tokio/latest/tokio/sync/broadcast/index.html#lagging)); ausprobiert mit Kapazität 2 und fünf Werten vor dem ersten Lesen: `Lagged(3)`, dann 4 und 5. Behandle `Lagged`, statt es per `unwrap` zum Absturz zu machen.

  Ein begrenzter [`mpsc`-Kanal](https://docs.rs/tokio/latest/tokio/sync/mpsc/index.html) (`mpsc::channel(2)`) macht Kapazität sichtbar: Ist der Puffer voll, wartet `send().await` auf Platz. Das ist Backpressure – Überlast wandert zurück zur Quelle, statt sich als wachsender Speicherverbrauch zu verstecken. Sind alle Sender weg und der Puffer leer, liefert `recv` `None`; ein vergessener Sender-Klon verhindert dieses Ende.

  Ein begrenzter Kanal begrenzt aber die Warteschlange, nicht die Zahl laufender Tasks. Wer für jede Nachricht eine Task startet, umgeht die Grenze. Ein [`Semaphore`](https://docs.rs/tokio/latest/tokio/sync/struct.Semaphore.html) zählt Erlaubnisse (Permits): `acquire` wartet, bis eine frei ist, und der Drop des Permits gibt sie zurück.

  ```rust
  use std::sync::Arc;
  use tokio::sync::Semaphore;
  use tokio::task::JoinSet;
  use tokio::time::{sleep, Duration};

  async fn health_check(host: &str) -> String {
      sleep(Duration::from_millis(20)).await; // steht für einen HTTP-Aufruf
      format!("{host} ok")
  }

  #[tokio::main]
  async fn main() {
      let limit = Arc::new(Semaphore::new(2));
      let mut jobs = JoinSet::new();
      for host in ["web-1", "web-2", "web-3", "web-4", "web-5"] {
          // wartet, solange schon zwei Prüfungen laufen
          let permit = Arc::clone(&limit).acquire_owned().await.unwrap();
          jobs.spawn(async move {
              let antwort = health_check(host).await;
              drop(permit); // Platz für die nächste Prüfung
              antwort
          });
      }
      while let Some(antwort) = jobs.join_next().await {
          println!("{}", antwort.unwrap());
      }
  }
  ```

  Ein Zähler für aktive Prüfungen ergab nie mehr als zwei gleichzeitig. [`acquire_owned`](https://docs.rs/tokio/latest/tokio/sync/struct.Semaphore.html#method.acquire_owned) verbraucht einen `Arc<Semaphore>` und liefert ein Permit ohne Lifetime, das in die `'static`-Task wandern darf; `acquire` würde den Semaphore nur leihen. Das Permit kommt vor `spawn`, also wartet schon die Schleife und nicht erst die fünfte Task – dasselbe Muster zeigt die Doku für eingehende Verbindungen ([Beispiel](https://docs.rs/tokio/latest/tokio/sync/struct.Semaphore.html#limit-the-number-of-incoming-requests-being-handled-at-the-same-time)). Das Permit kehrt auch bei Panik oder Abbruch zurück; `drop(permit)` markiert nur die Stelle.

  Blockierende Arbeit gehört hinter [`spawn_blocking`](https://docs.rs/tokio/latest/tokio/task/fn.spawn_blocking.html): Sie läuft auf einem eigenen Thread-Pool, und die Worker-Threads pollen weiter. Gestartete `spawn_blocking`-Arbeit lässt sich nicht abbrechen. `std::thread::sleep`, `std::fs` in einer Schleife oder eine Regex über 50 MB kompilieren in einer `async fn` ohne Warnung; das Symptom zeigt sich erst unter Last, wenn Timer zu spät feuern und andere Verbindungen hängen. Miss in diesem Fall zuerst ([Performance messen](/rust/performance-messen)).

  ## Netzwerk, Dateien und Streams

  Der Zeilenserver aus [Ein- und Ausgabe](/rust/ein-ausgabe) bediente seine Verbindung in einem eigenen Thread; bei vielen Clients wäre das ein Thread pro Verbindung. Mit `tokio::net` wird daraus eine Task pro Verbindung, und tausend wartende Clients kosten tausend kleine Futures statt tausend Stacks.

  ```rust
  use tokio::io::{AsyncBufReadExt, AsyncWriteExt, BufReader};
  use tokio::net::{TcpListener, TcpStream};

  #[tokio::main]
  async fn main() -> std::io::Result<()> {
      let listener = TcpListener::bind("127.0.0.1:7878").await?;
      loop {
          let (verbindung, adresse) = listener.accept().await?;
          tokio::spawn(async move {
              if let Err(fehler) = bedienen(verbindung).await {
                  eprintln!("{adresse}: {fehler}");
              }
          });
      }
  }

  async fn bedienen(verbindung: TcpStream) -> std::io::Result<()> {
      let (lesen, mut schreiben) = verbindung.into_split();
      let mut zeilen = BufReader::new(lesen).lines();
      while let Some(zeile) = zeilen.next_line().await? {
          let antwort = format!("{} Zeichen\n", zeile.chars().count());
          schreiben.write_all(antwort.as_bytes()).await?;
      }
      Ok(())
  }
  ```

  Mit drei Zeilen über Bashs `/dev/tcp` getestet, antwortete der Server `11 Zeichen`, `10 Zeichen`, `5 Zeichen`. [`into_split`](https://docs.rs/tokio/latest/tokio/net/struct.TcpStream.html#method.into_split) teilt die Verbindung in zwei eigene Hälften, die in verschiedene Tasks wandern dürfen, etwa ein Leser für Befehle und ein Schreiber für Antworten aus einem `mpsc`-Kanal. [`lines()`](https://docs.rs/tokio/latest/tokio/io/trait.AsyncBufReadExt.html#method.lines) liefert mit `next_line().await` ein `io::Result<Option<String>>`; `Ok(None)` heißt, die Gegenseite hat geschlossen. `next_line` ist cancel-safe und passt in eine `select!`-Schleife mit Shutdown-Zweig.

  Dateien sind anders. Die meisten Betriebssysteme haben keine asynchrone Datei-API, deshalb führt [`tokio::fs`](https://docs.rs/tokio/latest/tokio/fs/index.html) jede Operation per `spawn_blocking` aus. Viele kleine Operationen kosten je einen Wechsel in den Pool und sind nicht schneller als `std::fs`; die Doku rät, Zugriffe zu bündeln ([Tuning](https://docs.rs/tokio/latest/tokio/fs/index.html#tuning-your-file-io)). Ein abgebrochenes `write` läuft im Pool weiter, und `tokio::fs::File` braucht nach dem Schreiben `flush().await`.

  Ein Stream ist ein asynchroner Iterator. `for` geht dafür nicht; du schreibst `while let Some(x) = stream.next().await`. [`StreamExt`](https://docs.rs/tokio-stream/latest/tokio_stream/trait.StreamExt.html) aus `tokio-stream` bringt `next`, `map`, `filter` und `timeout`, die Wrapper in `tokio_stream::wrappers` machen aus Tokio-Typen Streams. `LinesStream` gibt es nur mit dem Feature `io-util` von `tokio-stream`, deshalb steht es oben in der `Cargo.toml`:

  ```rust
  use tokio::io::{AsyncBufReadExt, BufReader};
  use tokio_stream::{wrappers::LinesStream, StreamExt};

  #[tokio::main]
  async fn main() -> std::io::Result<()> {
      let eingabe: &[u8] = b"INFO start\nERROR db\nINFO ok\nERROR netz\n";
      let mut fehler = LinesStream::new(BufReader::new(eingabe).lines())
          .filter(|zeile| match zeile {
              Ok(text) => text.starts_with("ERROR"),
              Err(_) => true, // Lesefehler nicht verschlucken
          });
      while let Some(zeile) = fehler.next().await {
          println!("{}", zeile?);
      }
      Ok(())
  }
  ```

  Ausgabe: `ERROR db`, `ERROR netz`. Ein stabiles Gegenstück in der Standardbibliothek fehlt: `std::async_iter::AsyncIterator` ist auch in Rust 1.99 nightly-only ([AsyncIterator](https://doc.rust-lang.org/std/async_iter/trait.AsyncIterator.html)). Bibliotheken nutzen deshalb den Trait `Stream` aus `futures-core`, den `tokio-stream` re-exportiert.

  ## Async-Code testen mit kontrollierter Zeit

  [`#[tokio::test]`](https://docs.rs/tokio/latest/tokio/attr.test.html) startet für jeden Test eine eigene Runtime, standardmäßig Current-Thread; `flavor = "multi_thread"` gibt echte Parallelität. Für Timer-Logik gibt es `start_paused = true`: Die Tokio-Uhr steht, und sobald die Runtime nichts zu tun hat, springt sie zum nächsten Timer ([Auto-advance](https://docs.rs/tokio/latest/tokio/time/fn.pause.html#auto-advance)). Das braucht `tokio = { version = "1.54", features = ["test-util"] }` in den `[dev-dependencies]`.

  ```rust
  use std::time::Duration;
  use tokio::time::{self, Instant};

  async fn mit_wiederholung(versuche: u32) -> u32 {
      let mut n = 0;
      while n < versuche {
          n += 1;
          time::sleep(Duration::from_secs(30)).await; // Backoff
      }
      n
  }

  #[tokio::test(start_paused = true)]
  async fn wartet_zwischen_versuchen() {
      let start = Instant::now();
      assert_eq!(mit_wiederholung(3).await, 3);
      assert_eq!(start.elapsed(), Duration::from_secs(90));
  }
  ```

  Der Test prüft 90 Sekunden Backoff auf die Sekunde genau; `cargo test` meldete `finished in 0.00s`. `tokio::time::pause()` schaltet dasselbe mitten im Test ein; `std::time::Instant` läuft in beiden Fällen weiter. Mehr zu Teststrategien steht in [Tests & Code-Qualität](/rust/testen-qualitaet).

  > [!INTERVIEW]
  > Async organisiert Wartezeiten, Threads stellen Rechenkapazität bereit. Eine Future ist eine Zustandsmaschine, `.await` eine mögliche kooperative Unterbrechung, `spawn` eine neue Task. Fragt jemand nach den anderen Zweigen von `select!`, antwortest du: Sie werden gedroppt, ihre Arbeit endet am letzten `.await`, deshalb prüfe ich die Cancellation Safety jedes Zweigs.

  ## Häufige Fehler

  - **Future nie gepollt.** Es passiert nichts. Für `f();` ohne `.await` warnt der Compiler „unused implementer of `Future` that must be used“.
  - **std-Guard über `.await`.** „future cannot be sent between threads safely“. Block um die Sperre; `drop()` reicht nicht.
  - **Timer im `select!`-Zweig.** Die Frist läuft nie ab, solange ein anderer Zweig regelmäßig gewinnt.
  - **`read_exact` oder `write_all` in einer `select!`-Schleife.** Daten gehen verloren, sobald ein anderer Zweig gewinnt.
  - **Timeout oder fallengelassener Handle als Abbruch verstanden.** Die Task läuft weiter.
  - **Unbegrenzt Tasks starten.** Ein Semaphore vor `spawn` begrenzt laufende Arbeit.

  ## Zusammenfassung

  - Eine Future ist eine Zustandsmaschine; ohne Polling passiert nichts.
  - `join!` und `JoinSet` lassen unabhängige Operationen gleichzeitig warten; Task-Fehler und Fachfehler sind zwei Ebenen.
  - Was über ein `.await` lebt, muss für `spawn` `Send` sein. Sperren endet per Block davor.
  - `select!` droppt die Verlierer: Timer einmal erzeugen und pinnen, `biased;` für feste Reihenfolge, Cancellation Safety nachschlagen.
  - `CancellationToken` und `TaskTracker` beenden Tasks kooperativ; nach `abort()` laufen nur noch die `Drop`-Implementierungen.
  - Kanal nach Zweck: `oneshot`, `mpsc`, `broadcast`, `watch`. Begrenzte Kanäle und Permits vor `spawn` begrenzen Arbeit.
  - Blockierendes gehört hinter `spawn_blocking`; `tokio::fs` läuft selbst darüber.
  - `#[tokio::test(start_paused = true)]` testet Zeitlogik ohne Wartezeit.
