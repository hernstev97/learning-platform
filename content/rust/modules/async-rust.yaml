- id: select-biased
  type: output
  title: Wer zuerst geprüft wird
  prompt: |
    Vor der Schleife liegen zwei Aufträge im Kanal, und das Stopp-Signal ist schon gesetzt. Beide Zweige von `select!` sind also in der ersten Runde bereit. Was gibt das Programm aus? Gib jede Ausgabezeile an.
  lang: rust
  code: |-
    use tokio::sync::{mpsc, watch};

    #[tokio::main]
    async fn main() {
        let (tx, mut rx) = mpsc::channel(4);
        let (stopp_tx, mut stopp_rx) = watch::channel(false);
        tx.send("deploy").await.unwrap();
        tx.send("backup").await.unwrap();
        stopp_tx.send(true).unwrap();
        loop {
            tokio::select! {
                biased;
                _ = stopp_rx.changed() => {
                    println!("stopp");
                    break;
                }
                Some(job) = rx.recv() => println!("job {job}"),
            }
        }
        println!("offen: {}", rx.len());
    }
  expected: |-
    stopp
    offen: 2
  verify: false
  hints:
  - Was bedeutet `biased;` für die Reihenfolge, in der `select!` die Zweige prüft?
  - "`changed()` kehrt sofort zurück, wenn der aktuelle Wert noch nicht als gesehen markiert ist."
  - Was passiert mit der `recv`-Future, wenn der erste Zweig gewinnt – und mit den Nachrichten im Kanal?
  explanation: |
    Mit `biased;` prüft `select!` die Zweige von oben nach unten. In der ersten Runde ist `stopp_rx.changed()` schon bereit, also gewinnt dieser Zweig, und die Schleife endet. Die `recv`-Future wird gedroppt, ohne etwas aus dem Kanal genommen zu haben – `recv` ist cancel-safe –, deshalb liegen beide Aufträge noch darin und `rx.len()` ist 2. Ohne `biased;` wählt `select!` die Startreihenfolge zufällig: In 40 Läufen ohne `biased;` kamen drei verschiedene Ausgaben heraus, mit null, einem oder zwei Aufträgen vor `stopp`. Für einen Shutdown-Zweig ist die feste Reihenfolge meist gewollt; sie entscheidet aber auch, dass offene Arbeit liegen bleibt.
  resources:
  - title: tokio::select! · Fairness
    url: https://docs.rs/tokio/latest/tokio/macro.select.html#fairness
  - title: watch::Receiver::changed
    url: https://docs.rs/tokio/latest/tokio/sync/watch/struct.Receiver.html#method.changed
