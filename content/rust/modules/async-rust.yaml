- id: semaphore-permit
  type: gap
  title: Höchstens zwei Prüfungen gleichzeitig
  prompt: |
    Höchstens zwei Health-Checks sollen gleichzeitig laufen. Ergänze die Methode, die ein Permit liefert, das in die Task wandern darf, und die Zeile, die das Permit nach getaner Arbeit ausdrücklich zurückgibt.
  lang: rust
  code: |-
    use std::sync::Arc;
    use tokio::sync::Semaphore;
    use tokio::task::JoinSet;

    #[tokio::main]
    async fn main() {
        let limit = Arc::new(Semaphore::new(2));
        let mut jobs = JoinSet::new();
        for host in ["web-1", "web-2", "web-3"] {
            let permit = Arc::clone(&limit).⟦acquire_owned⟧().await.unwrap();
            jobs.spawn(async move {
                let antwort = format!("{host} ok");
                ⟦drop(permit)⟧;
                antwort
            });
        }
        let mut antworten = Vec::new();
        while let Some(ergebnis) = jobs.join_next().await {
            antworten.push(ergebnis.unwrap());
        }
        antworten.sort();
        println!("{antworten:?}");
    }
  gaps:
  - label: Permit, das die Task besitzen kann
    hint: "`acquire` liefert ein geliehenes Permit mit Lifetime. Die Variante für `Arc<Semaphore>` trägt einen Zusatz im Namen."
  - label: Permit zurückgeben
    hint: Ein Permit gibt seine Erlaubnis im Drop zurück. Welche Funktion beendet einen Wert sofort?
    accept:
    - std::mem::drop(permit)
  explanation: |
    `acquire_owned` verbraucht einen `Arc<Semaphore>` und liefert ein `OwnedSemaphorePermit` ohne Lifetime; nur so darf es in die `'static`-Task von `spawn` wandern. Setzt du `acquire` ein, leiht das Permit den Semaphore, und die `'static`-Task darf keine Leihe halten: Bei `Arc::clone(&limit).acquire()` meldet der Compiler E0716 („temporary value dropped while borrowed“), bei `limit.acquire()` E0597 („`limit` does not live long enough“). Weil das Permit vor `spawn` geholt wird, wartet die Schleife selbst, sobald zwei Prüfungen laufen – die Grenze wirkt bis zur Quelle. `drop(permit)` gibt die Erlaubnis zurück; ohne die Zeile geschähe das am Ende der Task, auch bei Panik oder Abbruch. Ausgabe im lokalen Lauf: `["web-1 ok", "web-2 ok", "web-3 ok"]`.
  resources:
  - title: Semaphore::acquire_owned
    url: https://docs.rs/tokio/latest/tokio/sync/struct.Semaphore.html#method.acquire_owned
  - title: Semaphore · eingehende Anfragen begrenzen
    url: https://docs.rs/tokio/latest/tokio/sync/struct.Semaphore.html#limit-the-number-of-incoming-requests-being-handled-at-the-same-time
- id: sleep-blockiert
  type: bug
  title: Der Runtime-Thread wartet mit
  prompt: Diese async-Funktion blockiert während der Pause ihren ausführenden Thread. Ersetze die Wartezeile durch
    Tokios kooperativen Timer.
  lang: rust
  code: |-
    async fn pause() {
        std::thread::sleep(std::time::Duration::from_millis(20));
    }
  lines:
  - 2
  fix:
