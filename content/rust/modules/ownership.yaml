id: ownership
title: Ownership & Borrowing
level: 1
minutes: 150
summary: Besitz, Move und Leihen verstehen und daraus sichere, passende Funktionssignaturen ableiten.
goals:
- Du erklärst Besitztransfer, Copy und Clone an konkreten Werten.
- Du unterscheidest geteilte und exklusive Referenzen.
- Du behebst Borrow-Checker-Fehler ohne unnötige Kopien.
- Du formulierst lesende APIs mit String- und Collection-Slices.
resources:
- &id001
  title: Rust Book · Ownership
  url: https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html
- title: Rust Book · References and Borrowing
  url: https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html
- title: Rust Book · Slices
  url: https://doc.rust-lang.org/book/ch04-03-slices.html
lesson: |
  Ein Log-Parser lädt eine Datei, sucht interessante Zeilen und gibt daraus einen Bericht zurück. Die Datei soll weder für jede Hilfsfunktion kopiert noch zu früh freigegeben werden. In vielen Sprachen regelt ein Garbage Collector, wann die Daten verschwinden. Rust lässt dich die Zuständigkeit im Typ ausdrücken und prüft den Zugriff vor dem Start des Programms.

  Ownership ist deshalb kein Zusatzwissen für Optimierungen. Es beantwortet bei jeder Funktion drei konkrete Fragen: Wer besitzt diesen Wert? Wer darf ihn gerade lesen oder verändern? Wie lange bleibt er gültig? Du lernst diese Fragen zunächst an `String` und `Vec`. Dieselben Regeln gelten später für Dateien, Sockets und selbst definierte Typen. Die Beispiele brauchen nur die Standardbibliothek und laufen im Rust Playground.

  ## Ownership: Verantwortung für einen Wert

  Ein Wert hat einen Besitzer. Verlässt dieser Besitzer seinen Gültigkeitsbereich, wird der Wert aufgeräumt, sofern er nicht vorher weitergegeben wurde. Das [Ownership-Kapitel](https://doc.rust-lang.org/book/ch04-01-what-is-ownership.html#ownership-rules) beschreibt diese Regeln. Bei einem `String` gehören die verwalteten Textbytes zu dieser Verantwortung; bei einer Datei gehört das Schließen des Handles dazu. Aufräumen erfolgt über `Drop`, nicht über einen regelmäßig suchenden Garbage Collector.

  ```rust
  fn main() {
      let titel = String::from("Bericht");
      {
          let entwurf = String::from("Noch nicht fertig");
          println!("{entwurf}");
      }
      println!("{titel}");
  }
  ```

  `entwurf` steht nur im inneren Block zur Verfügung. Am Blockende wird sein Speicher freigegeben. `titel` gehört zum äußeren Block und bleibt dort gültig. Das ist unabhängig davon, ob beide Werte zufällig gleich lang sind. Ownership beschreibt Zuständigkeiten, keine Optimierungsentscheidung über Textlängen.

  Ein `String` verwaltet einen Heap-Puffer und speichert dazu Zeiger, Länge und Kapazität. Ein Move des `String` muss die Textbytes nicht duplizieren. Verwechsle das Modell nicht mit „alles auf dem Stack wird kopiert“. Auch ein Array auf dem Stack kann nicht kopierbare Elemente besitzen. Entscheidend ist der Typ und insbesondere, ob er `Copy` implementiert.

  ## Move, Copy und Clone unterscheiden

  Zuweisung, Funktionsargumente und Rückgabewerte können Besitz übertragen. Nach einem Move darfst du die alte Bindung nicht mehr als vollständigen Wert benutzen. Das verhindert unter anderem, dass zwei vermeintliche Besitzer denselben Puffer aufräumen.

  ```rust
  fn main() {
      let eingang = String::from("Deploy fertig");
      let archiv = eingang;
      println!("{archiv}");
  }
  ```

  Hier besitzt `archiv` den String. Ein anschließendes `println!("{eingang}")` würde [E0382](https://doc.rust-lang.org/error_codes/E0382.html) auslösen: Verwendung eines verschobenen Werts. Der Fehler nennt den Move und die spätere Verwendung. Lies beide Stellen, bevor du `clone()` ergänzt. Häufig sollte die empfangende Funktion lediglich leihen.

  ```rust
  fn main() {
      let versuche = 3_u32;
      let kopie = versuche;
      println!("{versuche} {kopie}");

      let original = String::from("Notiz");
      let mut duplikat = original.clone();
      duplikat.push('!');
      println!("{original} / {duplikat}");
  }
  ```

  `u32` implementiert [`Copy`](https://doc.rust-lang.org/std/marker/trait.Copy.html): Die Zuweisung lässt den ursprünglichen Wert nutzbar. `String` implementiert `Clone`, aber nicht `Copy`. `clone()` erstellt hier einen unabhängigen Textpuffer und macht die zusätzliche Arbeit sichtbar. Allgemein bedeutet `Clone` jedoch nicht immer eine tiefe Kopie: Bei späteren Referenzzählern wie `Rc` wird beispielsweise ein gemeinsamer Besitzanteil erzeugt. Beurteile daher den konkreten Typ.

  > [!MERKE]
  > Übergib Besitz, wenn der Empfänger den Wert behalten soll. Leihe, wenn er nur damit arbeiten soll. Klone, wenn du tatsächlich einen zusätzlichen Wert brauchst.

  ## Borrowing: Daten nutzen, ohne sie zu besitzen

  Eine Referenz mit `&` leiht einen Wert. Die Funktion bekommt Zugriff, übernimmt aber nicht die Verantwortung für dessen Lebensdauer. Für lesenden Textzugriff ist `&str` häufig passender als `&String`: Es akzeptiert auch Stringliterale und Ausschnitte.

  ```rust
  fn woerter(text: &str) -> usize {
      text.split_whitespace().count()
  }

  fn main() {
      let notiz = String::from("Review morgen vorbereiten");
      println!("{}", woerter(&notiz));
      println!("{notiz}");
      println!("{}", woerter("zwei Worte"));
  }
  ```

  Beim Aufruf wird `&String` passend zu `&str` umgewandelt. Die Textbytes werden nicht kopiert. Nach der Rückkehr existiert `notiz` unverändert weiter. Mehrere geteilte Referenzen dürfen gleichzeitig lesen. Die [Borrowing-Regeln](https://doc.rust-lang.org/book/ch04-02-references-and-borrowing.html) gelten dabei für tatsächlich überlappende Zugriffe, nicht bloß für Namen, die irgendwo im Quelltext stehen.

  Zum Verändern brauchst du eine exklusive Referenz `&mut T`. Sowohl die ursprüngliche Bindung als auch die Übergabe müssen das erlauben:

  ```rust
  fn mit_punkt(text: &mut String) {
      if !text.ends_with('.') {
          text.push('.');
      }
  }

  fn main() {
      let mut notiz = String::from("Backup prüfen");
      mit_punkt(&mut notiz);
      println!("{notiz}");
  }
  ```

  Exklusiv heißt: Während dieser Zugriff aktiv ist, gibt es keinen anderen benutzbaren Zugriff auf dieselben Daten. Die Funktion darf dadurch beispielsweise den Puffer vergrößern, ohne dass gleichzeitig eine Referenz auf einen alten Puffer weiterliest. `mut` alleine bedeutet dagegen nur, dass eine Bindung oder ein Zugriff veränderbar ist; es erzeugt keine Referenz und keinen gemeinsamen Besitzer.

  ## Leihdauern und typische Konflikte

  Rust verfolgt häufig die letzte Nutzung einer Referenz. Eine Leihe kann daher vor dem Ende des Blocks enden. Das nennt man nichtlexikalische Lifetimes. Du brauchst für normale lokale Fälle keine expliziten Lifetime-Parameter.

  ```rust
  fn main() {
      let mut notiz = String::from("Start");
      let leser = &notiz;
      println!("{leser}");
      notiz.push_str(" fertig");
      println!("{notiz}");
  }
  ```

  `leser` wird vor der Änderung letztmals verwendet. Drehst du die letzten beiden Operationen um und liest danach noch `leser`, überlappen geteilte und exklusive Leihe. Rust lehnt das ab. Die sinnvolle Reparatur hängt vom Bedarf ab: Verwende den geliehenen Wert früher, verlagere die Änderung nach hinten oder erzeuge ausdrücklich eine unabhängige Kopie. Zusätzliche Klammern sind hilfreich, wenn sie den logischen Arbeitsabschnitt tatsächlich abbilden.

  ```rust nocheck
  fn main() {
      let mut zahlen = vec![10, 20];
      let erste = &zahlen[0];
      zahlen.push(30);
      println!("{erste}");
  }
  ```

  `push` könnte den Puffer verlegen. Die Referenz auf das erste Element wäre dann ungültig. Wenn du nur die Zahl brauchst, schreibe `let erste = zahlen[0];`: `i32` ist `Copy`, daher hältst du einen unabhängigen Wert. Der Compiler verhindert hier einen möglichen Speicherfehler, obwohl auf deinem Rechner zufällig noch Kapazität frei sein könnte.

  > [!INTERVIEW]
  > Auf „Warum sind mehrere Leser, aber nur ein Schreiber erlaubt?“ antwortest du mit der Gültigkeit von Referenzen: Eine Änderung kann Daten und Speicherorte verändern. Rust verhindert überlappende Zugriffe, die ungültige Referenzen oder Data Races ermöglichen würden. Logische Fehler verhindert das nicht automatisch.

  ## Slices und sinnvolle Funktionsgrenzen

  Ein Slice ist eine geliehene Sicht auf zusammenhängende Elemente. `&[T]` enthält Informationen über Anfang und Länge, besitzt aber nicht den Puffer. Ein String-Slice `&str` muss gültiges UTF-8 beschreiben. Im [Slice-Kapitel](https://doc.rust-lang.org/book/ch04-03-slices.html) wird gezeigt, warum diese Sichten sicherer sind als ein selbst verwalteter Index ohne Bezug zur Quelle.

  ```rust
  fn summe(werte: &[i32]) -> i32 {
      werte.iter().sum()
  }

  fn main() {
      let messungen = vec![2, 4, 6, 8];
      println!("{}", summe(&messungen[1..3]));
      println!("{}", summe(&[5, 7]));
  }
  ```

  Die Funktion verlangt keinen `Vec`, weil sie dessen Änderbarkeit und Kapazität nicht benötigt. Das macht sie zugleich flexibler und genauer. Bei Text darfst du nicht blind Bytepositionen als Zeichenpositionen verwenden: `"Grün"` enthält ein mehrbyteiges `ü`. `get(..grenze)` liefert bei ungültigen Grenzen `None`, während direktes Indexieren eines Stringbereichs paniken kann. Für Wörter helfen `split_whitespace`, für Unicode-Skalarwerte `chars`.

  Eine Funktion darf keine Referenz auf einen eigenen lokalen String zurückgeben: Dieser würde beim Verlassen der Funktion aufgeräumt. Gib in diesem Fall den `String` selbst zurück. Soll das Ergebnis dagegen einen Ausschnitt aus einem Parameter leihen, muss dessen Quelle lange genug leben. Die genaue Notation lernst du im Modul Lifetimes; das Denkmodell beginnt hier.

  > [!PRAXIS]
  > Prüfe in einem Review die Signaturen vor dem Funktionsrumpf. `&str` zeigt lesenden Textzugriff, `&mut Vec<T>` eine Änderung am vorhandenen Container und `Vec<T>` eine Besitzübernahme. Eine passende Signatur erspart oft mehrere nachträgliche Klone.

  ## Häufige Fehler

  - **Nach dem Move weiterlesen:** Folge in der Fehlermeldung dem ersten Besitztransfer. Eine reine Anzeige braucht meist eine Referenz statt Besitz.
  - **`clone()` an jeder roten Stelle:** Das kann korrekt sein, verdeckt aber schlechte Zuständigkeiten. Kläre zuerst, ob zwei unabhängige Werte nötig sind.
  - **Referenz länger behalten als gebraucht:** Berechne den benötigten Wert und beende den Zugriff vor einer Containeränderung.
  - **`&mut` mit mehreren Besitzern verwechseln:** Exklusives Leihen gibt den Besitz nach Ende der Leihe wieder frei, es dupliziert ihn nicht.
  - **Referenz auf lokale Daten zurückgeben:** Gib einen eigenen Wert zurück oder leihe aus einem Eingabeparameter.

  ## Zusammenfassung

  - Ownership legt fest, wer einen Wert aufräumt.
  - Ein Move überträgt Besitz; `Copy` erhält die ursprüngliche Bindung.
  - `clone()` ist eine explizite, typspezifische Operation mit möglichen Kosten.
  - `&T` leiht geteilt, `&mut T` leiht exklusiv.
  - Leihen dürfen die Gültigkeit ihrer Quelle nicht überschreiten.
  - Slices beschreiben geliehene Ausschnitte ohne neue Allokation.
  - Gute Signaturen drücken den tatsächlichen Zugriff aus.
exercises:
- id: zugriff-waehlen
  type: choice
  title: Der Parser liest nur
  prompt: Eine Funktion zählt Zeilen, speichert den Text nicht und verändert ihn nicht. Welche Signatur passt am
    besten?
  options:
  - text: 'fn zeilen(text: &str) -> usize'
    correct: true
    why: Die Funktion leiht Text unabhängig von dessen Besitzer.
  - text: 'fn zeilen(text: String) -> usize'
    correct: false
    why: Damit übernimmt sie unnötig den Besitz.
  - text: 'fn zeilen(text: &mut String) -> usize'
    correct: false
    why: Exklusiver Schreibzugriff ist zum Zählen unnötig.
  explanation: Eine lesende Schnittstelle sollte nur lesenden Zugriff verlangen. `&str` akzeptiert geliehenen String-Inhalt
    und Literale ohne Kopie.
  resources:
  - *id001
- id: besitzfolge
  type: order
  title: Vom Erzeugen zum Aufräumen
  prompt: Ordne die Schritte des Lebenszyklus dieses Strings.
  lang: text
  lines: |-
    String mit Besitzer eingang erzeugen
    Besitz von eingang nach archiv verschieben
    String über archiv lesen
    archiv verlässt seinen Gültigkeitsbereich
    String-Puffer wird aufgeräumt
  explanation: Die Zuweisung verschiebt den String nach `archiv`. Nur dessen Ende räumt anschließend den Wert auf.
  resources:
  - *id001
- id: copy-zahlen
  type: output
  title: Zwei Zahlen
  prompt: Was gibt dieses Programm aus? Gib jede Ausgabezeile an.
  lang: rust
  code: |-
    fn main() {
        let a = 4;
        let mut b = a;
        b += 3;
        println!("{a} {b}");
    }
  expected: 4 7
  explanation: Ganzzahlen sind `Copy`. Die Änderung von `b` betrifft nicht den ursprünglichen Wert `a`.
  resources:
  - *id001
- id: clone-text
  type: output
  title: Unabhängiger Entwurf
  prompt: Was gibt dieses Programm aus? Gib jede Ausgabezeile an.
  lang: rust
  code: |-
    fn main() {
        let original = String::from("Plan");
        let mut entwurf = original.clone();
        entwurf.push_str(" B");
        println!("{original}");
        println!("{entwurf}");
    }
  expected: |-
    Plan
    Plan B
  explanation: '`String::clone` erstellt einen eigenen Textpuffer. Die Erweiterung des Entwurfs verändert das Original
    nicht.'
  resources:
  - *id001
- id: lesen-leihen
  type: gap
  title: Eine Eingabe mehrfach lesen
  prompt: Ergänze einen geliehenen Textparameter und übergib eine Referenz auf `text`.
  lang: rust
  code: |-
    fn anzahl(text: ⟦&str⟧) -> usize { text.len() }
    fn main() {
        let text = String::from("abc");
        println!("{}", anzahl(⟦&text⟧));
        println!("{text}");
    }
  gaps:
  - label: Lücke 1
    hint: Gesucht ist ein geteilter String-Slice.
  - label: Lücke 2
    hint: Mit & leihst du statt zu verschieben.
  explanation: Der Aufruf leiht den String und lässt ihn beim Besitzer. `len()` zählt hier drei Bytes.
  resources:
  - *id001
- id: mutierend-leihen
  type: gap
  title: Vorhandenen Text ergänzen
  prompt: Ergänze das Schlüsselwort für eine veränderbare Bindung und die exklusive Referenz.
  lang: rust
  code: |-
    fn main() {
        let ⟦mut⟧ text = String::from("Start");
        let zugriff = ⟦&mut text⟧;
        zugriff.push_str("!");
        println!("{text}");
    }
  gaps:
  - label: Lücke 1
    hint: Veränderbare Bindungen verwenden mut.
  - label: Lücke 2
    hint: Gesucht ist &mut plus der Variablenname.
  explanation: Die Veränderung erfolgt durch eine exklusive Leihe. Nach der letzten Nutzung von `zugriff` kann `text`
    wieder gelesen werden.
  resources:
  - *id001
- id: slice-parameter
  type: gap
  title: Keine unnötige Containerbindung
  prompt: Ergänze den Slice-Typ für geliehene `i32`-Werte und den Bereich, der nur 20 und 30 auswählt.
  lang: rust
  code: |-
    fn summe(werte: ⟦&[i32]⟧) -> i32 { werte.iter().sum() }
    fn main() {
        let werte = vec![10, 20, 30, 40];
        println!("{}", summe(&werte[⟦1..3⟧]));
    }
  gaps:
  - label: Lücke 1
    hint: Ein geteilter Slice wird mit &[Elementtyp] geschrieben.
  - label: Lücke 2
    hint: Index 1 ist enthalten, Index 3 nicht.
    accept:
    - 1..=2
  explanation: Ein Slice verlangt keinen konkreten Besitzer wie `Vec`. Die obere Bereichsgrenze ist exklusiv.
  resources:
  - *id001
- id: vector-referenz
  type: bug
  title: Ein Puffer könnte umziehen
  prompt: Der Compiler lehnt die Verwendung von `erste` nach `push` ab. Du brauchst nur den Zahlenwert. Repariere
    ausschließlich dessen Bindung.
  lang: rust
  code: |-
    fn main() {
        let mut zahlen = vec![10, 20];
        let erste = &zahlen[0];
        zahlen.push(30);
        println!("{erste}");
    }
  lines:
  - 3
  fix:
  - line: 3
    answers:
    - let erste = zahlen[0];
  explanation: Eine Referenz könnte durch die Vergrößerung ungültig werden. Ein `i32` lässt sich kopieren; dadurch
    hängt `erste` nicht mehr am Puffer.
  resources:
  - *id001
- id: signaturen-erklaeren
  type: explain
  title: Drei unterschiedliche Verträge
  prompt: Erkläre, welche Zugriffe die drei Funktionen erhalten und wann du sie wählen würdest.
  lang: rust
  code: |-
    fn anzeigen(text: &str) {}
    fn ergaenzen(text: &mut String) {}
    fn archivieren(text: String) {}
  points:
  - anzeigen leiht den Text nur lesend.
  - ergaenzen darf den vorhandenen String exklusiv verändern.
  - archivieren übernimmt den Besitz.
  - Keine Signatur erfordert automatisch eine Kopie des Textpuffers.
  explanation: '`anzeigen` benötigt nur eine Sicht auf den Text. `ergaenzen` arbeitet am ursprünglichen String und
    kann ihn vergrößern. `archivieren` darf den Wert behalten oder aufräumen; der Aufrufer verliert bei einem Move
    den Zugriff über die alte Bindung.'
  resources:
  - *id001
- id: notiz-normalisieren
  type: practice
  title: Einen Entwurf normalisieren
  prompt: 'Schreibe `normalisieren(text: &mut String)`: Schneide Leerraum außen ab und ersetze den vorhandenen Inhalt.
    Eine leere Eingabe bleibt leer. Schreibe Tests für Ränder und leere Eingabe.'
  lang: rust
  solution: |
    fn normalisieren(text: &mut String) {
        *text = text.trim().to_owned();
    }
    fn main() {
        let mut text = String::from("  Backup prüfen  ");
        normalisieren(&mut text);
        println!("{text}");
    }
    #[test]
    fn raender_und_leer() {
        let mut text = String::from("  Plan  ");
        normalisieren(&mut text);
        assert_eq!(text, "Plan");
        let mut leer = String::from("  ");
        normalisieren(&mut leer);
        assert_eq!(leer, "");
    }
  checklist:
  - Die Funktion nimmt &mut String und keinen Besitz entgegen.
  - Führender und nachgestellter Leerraum wird entfernt.
  - Ein Test deckt eine nur aus Leerraum bestehende Eingabe ab.
  - Du kannst erklären, weshalb to_owned hier einen neuen String erzeugt.
  explanation: '`trim()` leiht einen Ausschnitt. `to_owned()` erzeugt den Ersatzwert, bevor die Zuweisung den alten
    String ersetzt. So bleibt während des Lesens die Quelle gültig.'
  resources:
  - *id001
