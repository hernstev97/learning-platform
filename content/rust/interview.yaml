cards:
- id: owner
  module: ownership
  level: 1
  tags:
  - ownership
  q: Was regelt Ownership?
  a: |
    Ownership legt fest, wer für einen Wert und dessen Aufräumen verantwortlich ist. Besitz kann verschoben werden; Referenzen leihen Zugriff. So kann der Compiler ungültige Zugriffe verhindern, ohne einen allgemeinen Garbage Collector zu benötigen.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch04-00-understanding-ownership.html).
- id: move
  module: ownership
  level: 1
  tags:
  - ownership
  q: Was passiert bei einem Move eines String?
  a: |
    Der Besitz am String wird übertragen, ohne dass dafür die Textbytes dupliziert werden müssen. Die alte Bindung darf danach nicht mehr als vollständiger Wert verwendet werden. Das verhindert mehrere unabhängige Aufräumer desselben Puffers.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch04-00-understanding-ownership.html).
- id: copy-clone
  module: ownership
  level: 1
  tags:
  - ownership
  q: 'Copy und Clone: der Unterschied?'
  a: |
    Copy erlaubt implizites Kopieren bei Zuweisung und Übergabe. Clone ist ein expliziter typspezifischer Vorgang, der Arbeit verursachen kann. Ein Clone von String dupliziert Text; ein Clone eines Referenzzählers kann dagegen denselben Wert teilen.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch04-00-understanding-ownership.html).
- id: borrow-rule
  module: ownership
  level: 1
  tags:
  - ownership
  q: Warum mehrere Leser oder ein exklusiver Schreiber?
  a: |
    Ein schreibender Zugriff kann Daten und Speicherorte verändern. Gleichzeitig benutzte Referenzen könnten dadurch ungültig werden. Rust beschränkt überlappende Zugriffe; daraus folgt aber keine Garantie gegen fachliche Race Conditions.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch04-00-understanding-ownership.html).
- id: string-str
  module: ownership
  level: 1
  tags:
  - ownership
  q: Wann String, wann &str?
  a: |
    String besitzt veränderbaren UTF-8-Text. &str leiht eine Textsicht ohne Besitzübernahme. Eine nur lesende Funktion sollte häufig &str akzeptieren, damit Literale und String-Ausschnitte ebenfalls passen.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch04-00-understanding-ownership.html).
- id: slices
  module: ownership
  level: 1
  tags:
  - ownership
  q: Warum &[T] statt &Vec<T>?
  a: |
    Ein Slice beschreibt den benötigten lesenden Zugriff auf Elemente, ohne einen bestimmten Container zu verlangen. Dadurch funktionieren auch Arrays und Ausschnitte. Wenn die Funktion Kapazität oder Änderungen am Vec braucht, gilt ein anderer Vertrag.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch04-00-understanding-ownership.html).
- id: lifetime-purpose
  module: lifetimes
  level: 2
  tags:
  - ownership
  q: Was tun Lifetime-Annotationen?
  a: |
    Sie beschreiben Beziehungen zwischen Referenzen für die Prüfung. Sie verlängern nicht die Lebensdauer der Werte. Ein zurückgegebener Ausschnitt muss aus einer Quelle stammen, die während seiner Nutzung noch lebt.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch04-00-understanding-ownership.html).
- id: static
  module: lifetimes
  level: 2
  tags:
  - ownership
  q: 'Bedeutet T: ''static, dass T nie freigegeben wird?'
  a: |
    Nein. Der Typ enthält keine geliehenen Abhängigkeiten, die kürzer leben müssten. Ein eigener String kann die Grenze erfüllen und trotzdem nach kurzer Zeit gedroppt werden.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch04-00-understanding-ownership.html).
- id: borrow-restructure
  module: ownership
  level: 2
  tags:
  - ownership
  q: Der Borrow Checker lehnt push während einer Leihe ab. Was tust du?
  a: |
    Ich kläre, welche Information noch gebraucht wird. Bei einem Copy-Wert kann ich die Information vorher kopieren, sonst den Zugriff verkürzen oder die Änderung verschieben. Erst wenn unabhängige Daten nötig sind, ist clone die passende Lösung.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch04-00-understanding-ownership.html).
- id: struct-enum
  module: structs-enums
  level: 1
  tags:
  - typen
  q: Struct oder Enum?
  a: |
    Ein Struct bündelt gleichzeitig vorhandene Felder. Ein Enum beschreibt alternative Formen mit jeweils passenden Nutzdaten. Ladezustände sind häufig ein Enum, weil Fehler und Erfolg unterschiedliche Daten benötigen.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch06-00-enums.html).
- id: option-result
  module: fehlerbehandlung
  level: 1
  tags:
  - fehler
  q: Option oder Result?
  a: |
    Option beschreibt vorhandenen oder fehlenden Wert. Result beschreibt Erfolg oder eine Ursache. Wenn Fehlen normal ist, ein Leseversuch aber scheitern kann, kann Result<Option<T>, E> beide Unterschiede erhalten.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch09-00-error-handling.html).
- id: question-mark
  module: fehlerbehandlung
  level: 1
  tags:
  - fehler
  q: Was macht der Operator ? bei Result?
  a: |
    Er liefert bei Ok den Wert und kehrt bei Err früh aus der Funktion zurück. Der Fehler kann passend konvertiert werden. Das ist Weitergabe, keine Reparatur und kein stilles Ignorieren.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch09-00-error-handling.html).
- id: panic-policy
  module: fehlerbehandlung
  level: 2
  tags:
  - fehler
  q: Wann darf eine Funktion paniken?
  a: |
    Für gebrochene Programmannahmen kann ein Panic angemessen sein. Reguläre Datei-, Netzwerk- und Eingabefehler gehören gewöhnlich in Result. Die API muss ihren Vertrag erklären; expect benötigt eine begründete Invariante.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch09-00-error-handling.html).
- id: error-strategy
  module: fehlerbehandlung
  level: 2
  tags:
  - fehler
  q: thiserror oder anyhow?
  a: |
    thiserror hilft beim Definieren strukturierter Fehlertypen, die Aufrufer unterscheiden können. anyhow eignet sich für kontextreiche Fehlerweitergabe in Anwendungen. Die Bibliothek ersetzt nicht die Entscheidung, welche Fälle fachlich unterscheidbar bleiben müssen.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch09-00-error-handling.html).
- id: error-context
  module: fehlerbehandlung
  level: 2
  tags:
  - fehler
  q: Eine Meldung sagt nur „Datei fehlt“. Was fehlt?
  a: |
    Der Nutzer braucht den betroffenen Pfad und den Arbeitsschritt. Die ursprüngliche Ursache sollte erhalten bleiben. Ich ergänze Kontext an der zuständigen Grenze und vermeide geheime Inhalte in Logs.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch09-00-error-handling.html).
- id: generic-bounds
  module: traits-generics
  level: 2
  tags:
  - traits
  q: Warum Trait Bounds?
  a: |
    Generischer Code darf nur Operationen verwenden, die seine Bounds garantieren. Der Vertrag wird unabhängig von einer zufälligen konkreten Instanziierung überprüft. Enge notwendige Bounds halten APIs wiederverwendbar.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch10-00-generics.html).
- id: impl-dyn
  module: traits-generics
  level: 2
  tags:
  - traits
  q: impl Trait oder dyn Trait?
  a: |
    impl Trait bezeichnet einen vom Compiler bestimmten konkreten Typ mit passendem Verhalten. dyn Trait ermöglicht dynamische Dispatch über ein Trait-Objekt. Die Wahl betrifft Flexibilität, Indirektion und mögliche Codegröße.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch10-00-generics.html).
- id: monomorph
  module: traits-generics
  level: 2
  tags:
  - traits
  q: Was kostet Monomorphisierung?
  a: |
    Der Compiler erzeugt spezialisierten Code für verwendete konkrete Typen. Das ermöglicht statische Dispatch und Optimierung. Viele große Spezialisierungen können Compile-Zeit und Binary-Größe erhöhen.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch10-00-generics.html).
- id: orphan
  module: traits-generics
  level: 2
  tags:
  - traits
  q: Was verhindert die Orphan Rule?
  a: |
    Sie begrenzt konkurrierende Trait-Implementierungen über Crate-Grenzen. Vereinfacht muss der Trait oder ein beteiligter implementierender Typ lokal sein. Ein eigener Wrapper kann eine kontrollierte Integration fremder Typen ermöglichen.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch10-00-generics.html).
- id: associated-type
  module: traits-generics
  level: 2
  tags:
  - traits
  q: Assoziierter Typ oder generischer Trait-Parameter?
  a: |
    Ein assoziierter Typ wird durch eine konkrete Trait-Implementierung festgelegt, etwa Iterator::Item. Ein generischer Parameter kann mehrere unterschiedlich parametrisierte Implementierungen erlauben. Die gewünschte Eindeutigkeit des Vertrags entscheidet.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch10-00-generics.html).
- id: iterator-lazy
  module: closures-iteratoren
  level: 1
  tags:
  - iteratoren
  q: Warum passiert nach map noch nichts?
  a: |
    Iterator-Adapter sind lazy. Erst ein Consumer wie collect, sum oder eine Schleife fordert Elemente an. Nebenwirkungen in einer nie konsumierten Pipeline werden daher nicht ausgeführt.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch13-00-functional-features.html).
- id: iter-into
  module: closures-iteratoren
  level: 1
  tags:
  - iteratoren
  q: iter, iter_mut und into_iter?
  a: |
    iter leiht Elemente geteilt, iter_mut exklusiv. into_iter konsumiert den Empfänger gemäß dessen Implementierung. Bei einem eigenen Vec werden typischerweise die Elemente verschoben; bei einer Referenz ist der Empfänger selbst geliehen.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch13-00-functional-features.html).
- id: fn-traits
  module: closures-iteratoren
  level: 2
  tags:
  - iteratoren
  q: Fn, FnMut und FnOnce?
  a: |
    FnOnce kann eingefangene Werte konsumieren, FnMut darf sie verändern und Fn kann ohne solche Veränderung aufgerufen werden. Die konkrete Closure implementiert die Traits gemäß ihrer Nutzung der Umgebung. move allein bedeutet nicht automatisch nur FnOnce.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch13-00-functional-features.html).
- id: collect-result
  module: closures-iteratoren
  level: 2
  tags:
  - iteratoren
  q: Was bewirkt collect auf Iterator<Item = Result<T,E>>?
  a: |
    Die Sammlung zu Result<Vec<T>, E> endet beim ersten Fehler. Bei Erfolg enthält sie alle Werte. Fehler werden dadurch bewahrt, anders als bei filter_map(Result::ok).

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch13-00-functional-features.html).
- id: box
  module: smart-pointer
  level: 1
  tags:
  - pointer
  q: Wann Box<T>?
  a: |
    Box besitzt einen Wert über eine Heap-Allokation. Es hilft bei rekursiven Typen oder dynamisch großen Typen hinter einer Indirektion. Es erzeugt keine geteilte Ownership und macht einen Typ nicht automatisch threadsicher.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch15-00-smart-pointers.html).
- id: rc-arc
  module: smart-pointer
  level: 2
  tags:
  - pointer
  q: Rc oder Arc?
  a: |
    Beide ermöglichen referenzgezählten geteilten Besitz. Arc verwendet atomare Zählung und kann passende Inhalte über Threads teilen. Arc macht aber den inneren Typ nicht automatisch sicher gleichzeitig veränderbar.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch15-00-smart-pointers.html).
- id: refcell
  module: smart-pointer
  level: 2
  tags:
  - pointer
  q: Was prüft RefCell zur Laufzeit?
  a: |
    RefCell ermöglicht innere Veränderbarkeit und prüft dynamisch die Leihregeln. Ein verletzter Leihvertrag kann paniken. Es ist kein allgemeines Werkzeug für geteilte Änderung über Threads.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch15-00-smart-pointers.html).
- id: weak
  module: smart-pointer
  level: 2
  tags:
  - pointer
  q: Wozu Weak?
  a: |
    Weak verweist auf referenzgezählten Inhalt, ohne dessen starke Besitzanzahl zu erhöhen. So können Rückverweise Besitzzyklen vermeiden. upgrade liefert Option, weil der Inhalt bereits freigegeben sein kann.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch15-00-smart-pointers.html).
- id: drop
  module: smart-pointer
  level: 2
  tags:
  - pointer
  q: Wozu ein eigener Drop-Handler?
  a: |
    Er räumt Ressourcen beim Ende der Ownership auf. Die Operation sollte verlässlich und möglichst unproblematisch sein; ein explizit fehlschlagender Abschluss verdient oft eine eigene Methode. Prozessabbruch garantiert nicht in jedem Fall die Ausführung aller Destruktoren.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch15-00-smart-pointers.html).
- id: send-sync
  module: nebenlaeufigkeit
  level: 2
  tags:
  - concurrency
  q: Was bedeuten Send und Sync?
  a: |
    Send erlaubt den Besitztransfer eines Werts zwischen Threads. Sync bedeutet, dass geteilte Referenzen auf den Typ zwischen Threads sicher nutzbar sind. Diese Eigenschaften sagen nichts darüber, ob der fachliche Algorithmus korrekt ist.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch16-00-concurrency.html).
- id: mutex-rwlock
  module: nebenlaeufigkeit
  level: 2
  tags:
  - concurrency
  q: Mutex oder RwLock?
  a: |
    Ein Mutex erlaubt einen exklusiven Guard. Ein RwLock erlaubt mehrere Leser oder einen Schreiber. Mehr Lesezugriffe machen RwLock nicht automatisch schneller; Kontention, Guard-Dauer und Workload entscheiden.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch16-00-concurrency.html).
- id: channels
  module: nebenlaeufigkeit
  level: 2
  tags:
  - concurrency
  q: Wann Channel statt Arc<Mutex<T>>?
  a: |
    Ein Channel kann Ownership und Zuständigkeit über Nachrichten übertragen. Gemeinsamer Zustand braucht dagegen eine klare Synchronisationsregel. Ich wähle nach dem Datenfluss und plane Kapazität sowie Ende des Channels.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch16-00-concurrency.html).
- id: races
  module: nebenlaeufigkeit
  level: 2
  tags:
  - concurrency
  q: Verhindert Rust jede Race Condition?
  a: |
    Nein. Sichere Typen verhindern Data Races, aber nicht jede falsche Reihenfolge oder doppelte fachliche Aktion. Deadlocks und logisch konkurrierende Updates brauchen weiterhin einen passenden Algorithmus und Tests.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch16-00-concurrency.html).
- id: lock-await
  module: async-rust
  level: 3
  tags:
  - async
  q: Warum keinen gewöhnlichen Lock-Guard über await halten?
  a: |
    Die Task kann während exklusiven Zugriffs warten und andere blockieren; zusätzlich kann die Future nicht Send sein. Ich halte den kritischen Abschnitt kurz und warte danach. Ein async-Mutex beseitigt keine fachlichen Deadlocks.

    [Offizielle Dokumentation](https://tokio.rs/tokio/tutorial).
- id: future-lazy
  module: async-rust
  level: 1
  tags:
  - async
  q: Was passiert beim Aufruf einer async fn?
  a: |
    Es entsteht eine Future, deren Arbeit noch gepollt werden muss. await oder Spawn in einer Runtime treiben sie voran. Der Aufruf erzeugt nicht automatisch einen eigenen Thread.

    [Offizielle Dokumentation](https://tokio.rs/tokio/tutorial).
- id: blocking
  module: async-rust
  level: 2
  tags:
  - async
  q: Ein async-Dienst hängt trotz vieler Tasks. Was prüfst du?
  a: |
    Ich suche blockierende I/O-Aufrufe, CPU-Schleifen und lange kritische Abschnitte. Async ist kooperativ. Synchrone Arbeit braucht eine kontrollierte Grenze wie spawn_blocking und gegebenenfalls eine zusätzliche Parallelitätsbegrenzung.

    [Offizielle Dokumentation](https://tokio.rs/tokio/tutorial).
- id: handle-drop
  module: async-rust
  level: 2
  tags:
  - async
  q: Beendet Drop eines Tokio-JoinHandle die Task?
  a: |
    Nein, der Handle wird getrennt und die Task kann weiterlaufen. Für kontrollierten Abschluss muss der Owner warten oder einen geplanten Abbruch auslösen. Ein Timeout um den Handle allein ist deshalb keine sichere Beendigung.

    [Offizielle Dokumentation](https://tokio.rs/tokio/tutorial).
- id: cancellation
  module: async-rust
  level: 3
  tags:
  - async
  q: Ist Cancellation eine Rückabwicklung?
  a: |
    Nein. Drop einer Future macht bereits ausgeführte externe Nebenwirkungen nicht rückgängig. Ich prüfe Cancellation Safety und mache wiederholte Operationen dort idempotent, wo der fachliche Vertrag es verlangt.

    [Offizielle Dokumentation](https://tokio.rs/tokio/tutorial).
- id: workspace
  module: module-cargo
  level: 2
  tags:
  - cargo
  q: Was bringt ein Cargo-Workspace?
  a: |
    Er organisiert mehrere Pakete mit gemeinsamer Projektverwaltung und gemeinsamem Lockfile. Das erleichtert abgestimmte Entwicklung. Zusätzliche Crates sollten trotzdem nachvollziehbare API- oder Zuständigkeitsgrenzen haben.

    [Offizielle Dokumentation](https://doc.rust-lang.org/cargo/).
- id: features
  module: module-cargo
  level: 2
  tags:
  - cargo
  q: Was sind Cargo-Features?
  a: |
    Features steuern optionale Teile einer Crate und optionaler Abhängigkeiten. Ihre Kombination muss unterstützt und getestet werden. Sie ersetzen keine Laufzeitkonfiguration, und all-features ist bei widersprüchlichen Optionen nicht automatisch sinnvoll.

    [Offizielle Dokumentation](https://doc.rust-lang.org/cargo/).
- id: lockfile
  module: module-cargo
  level: 1
  tags:
  - cargo
  q: Warum Cargo.lock bei einer Anwendung?
  a: |
    Es hält die aufgelösten Abhängigkeitsversionen fest. Das erhöht die Reproduzierbarkeit zwischen Entwicklung und CI. Es ersetzt weder eine festgelegte Toolchain noch die Prüfung neuer Sicherheits- oder Kompatibilitätsprobleme.

    [Offizielle Dokumentation](https://doc.rust-lang.org/cargo/).
- id: unsafe
  level: 3
  tags:
  - unsafe
  q: Was erlaubt unsafe nicht?
  a: |
    unsafe hebt den Borrow Checker nicht pauschal auf. Es erlaubt bestimmte zusätzliche Operationen, deren Sicherheitsinvarianten der Programmierer einhalten muss. Eine sichere öffentliche Hülle muss diese Invarianten für jeden erlaubten Aufruf gewährleisten.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch20-01-unsafe-rust.html).
- id: zero-cost
  module: closures-iteratoren
  level: 2
  tags:
  - traits
  q: Was heißt Zero-Cost Abstraction?
  a: |
    Die Abstraktion soll keinen unvermeidbaren Zusatzaufwand gegenüber einer entsprechenden direkten Implementierung erzeugen. Das ist keine Garantie, dass jede generische Pipeline optimal ist. Allokationen, Datenlayout und tatsächliche Messungen bleiben relevant.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch10-00-generics.html).
- id: atomar-ersetzen
  module: ein-ausgabe
  level: 2
  tags:
  - io
  q: Wie ersetzt du eine Konfigurationsdatei so, dass ein Absturz keine halbe Datei hinterlässt?
  a: |
    Ich schreibe den neuen Inhalt in eine temporäre Datei im selben Verzeichnis, rufe `flush` und `sync_all` auf und ersetze das Ziel dann mit `fs::rename`. Auf demselben Dateisystem ist `rename` unter POSIX atomar: Ein Leser sieht die alte oder die neue Fassung, nie eine Mischung. Liegt die temporäre Datei auf einem anderen Dateisystem, etwa unter `/tmp`, scheitert `rename` mit `EXDEV`. Wer auch nach einem Stromausfall sicher sein will, synchronisiert zusätzlich das Verzeichnis.

    [std::fs::rename](https://doc.rust-lang.org/std/fs/fn.rename.html) · [rename(2)](https://man7.org/linux/man-pages/man2/rename.2.html)
- id: command-ohne-shell
  module: ein-ausgabe
  level: 2
  tags:
  - io
  - sicherheit
  q: Warum `Command::new("git").args(["log", pfad])` statt `sh -c` mit zusammengesetztem String?
  a: |
    `Command` übergibt jedes Argument als eigenen Eintrag an das Programm, ohne Shell dazwischen. Ein Dateiname mit Leerzeichen, `;` oder `$(…)` bleibt ein Dateiname, es gibt keine Injection, kein Globbing und keine Variablenexpansion. Brauche ich doch Shell-Funktionen, schreibe ich ein festes Skript für `sh -c` und reiche die Daten als Positionsargumente durch. Danach prüfe ich den Exit-Status, denn ein gestartetes Programm ist noch kein erfolgreiches.

    [std::process::Command](https://doc.rust-lang.org/std/process/struct.Command.html)
- id: tcp-bytestrom
  module: ein-ausgabe
  level: 2
  tags:
  - io
  - netzwerk
  q: Ein TCP-Client bekommt manchmal nur halbe Nachrichten. Warum, und was tust du?
  a: |
    TCP liefert einen Bytestrom ohne Nachrichtengrenzen. Ein `read` gibt zurück, was gerade angekommen ist, also auch eine halbe oder anderthalb Nachrichten. Das Protokoll braucht deshalb Framing: ein Trennzeichen wie `\n`, das ich mit `BufReader::read_line` lese, oder eine Längenangabe vor jeder Nachricht, die ich mit `read_exact` lese. Dazu ein Lese-Timeout, damit eine stumme Gegenstelle den Thread nicht ewig blockiert.

    [std::net::TcpStream](https://doc.rust-lang.org/std/net/struct.TcpStream.html) · [BufRead::read_line](https://doc.rust-lang.org/std/io/trait.BufRead.html#method.read_line)
- id: langsamer-release
  module: performance-messen
  level: 3
  tags:
  - performance
  q: Ein Dienst ist nach dem Release spürbar langsamer. Wie gehst du vor?
  a: |
    Erst reproduzieren: Release-Build, dieselben Daten, alte und neue Version unter gleichen Bedingungen gemessen, mit hyperfine für den ganzen Lauf oder criterion mit Baseline für die verdächtige Funktion. Liegt der Unterschied außerhalb der Streuung, profiliere ich mit einem Sampling-Profiler und lese den Flamegraph: Wo ist der neue breite Balken? Daraus wird eine Hypothese, ich ändere genau eine Sache und messe erneut. Ohne Messung vorher und nachher gibt es keine Optimierung, nur eine Vermutung.

    [The Rust Performance Book](https://nnethercote.github.io/perf-book/)
- id: flamegraph-breite
  module: performance-messen
  level: 2
  tags:
  - performance
  q: Was zeigt die Breite eines Balkens im Flamegraph – und was nicht?
  a: |
    Die Breite ist der Anteil der Samples, in denen diese Funktion auf dem Stack lag, ihre Kinder eingeschlossen. Die freie Oberkante über einem Balken ist Selbstzeit, also Arbeit in der Funktion selbst. Die x-Achse ist keine Zeitachse: Stacks werden zusammengefasst und sortiert, die Farben tragen keine Bedeutung. Ein On-CPU-Profiler zeigt außerdem keine Wartezeit auf I/O oder Locks.

    [The Rust Performance Book · Profiling](https://nnethercote.github.io/perf-book/profiling.html)
- id: black-box
  module: performance-messen
  level: 3
  tags:
  - performance
  q: Dein Benchmark meldet 0,3 ns für eine Funktion mit einer Schleife. Was ist passiert?
  a: |
    Der Optimierer hat die Arbeit entfernt oder zur Compile-Zeit ausgerechnet, weil das Ergebnis nie benutzt wird oder die Eingabe konstant ist. Gemessen wird dann ein leerer Aufruf. `std::hint::black_box` um Eingabe und Ergebnis verhindert das nach bestem Bemühen – die Doku verspricht ausdrücklich keine Garantie. Ich prüfe solche Werte gegen eine Größenordnungsschätzung, bevor ich ihnen glaube.

    [std::hint::black_box](https://doc.rust-lang.org/std/hint/fn.black_box.html)
- id: allokationen-reduzieren
  module: profiling-werkstatt
  level: 3
  tags:
  - performance
  q: Ein Profil zeigt viel Zeit in `malloc` und `free`. Wie gehst du vor?
  a: |
    Ich suche im Flamegraph die Aufrufer der Allokationen und zähle sie, etwa mit einem zählenden `GlobalAlloc` oder dhat. Typische Quellen in heißen Schleifen sind `to_string`, `format!`, `collect` in Zwischen-Vecs und `String`-Schlüssel. Abhilfe: `&str` statt `String`, Puffer mit `clear` wiederverwenden, `with_capacity`, die `entry`-API. Danach messe ich Zeit und Zahl der Allokationen erneut.

    [The Rust Performance Book · Heap Allocations](https://nnethercote.github.io/perf-book/heap-allocations.html)
- id: select-verlierer
  module: async-rust
  level: 3
  tags:
  - async
  q: Was passiert in `tokio::select!` mit den Zweigen, die nicht gewinnen?
  a: |
    Sobald ein Zweig fertig ist, droppt `select!` die übrigen Futures. Arbeit, die sie bis zum letzten `.await` erledigt hatten, kann dabei verloren gehen, etwa schon gelesene Bytes in einem internen Puffer. Deshalb prüfe ich die Cancellation Safety jeder Methode, die ich in einer `select!`-Schleife verwende; die Tokio-Doku nennt sie je Methode. Ohne `biased;` wählt `select!` unter bereiten Zweigen zufällig.

    [tokio::select!](https://docs.rs/tokio/latest/tokio/macro.select.html)
- id: semaphore-grenze
  module: async-rust
  level: 3
  tags:
  - async
  q: Du musst 1.000 Endpunkte prüfen, aber höchstens 20 gleichzeitig. Wie?
  a: |
    Eine `Arc<Semaphore>` mit 20 Permits. Vor jeder Prüfung hole ich mit `acquire_owned().await` ein Permit und verschiebe es in die Task; es wird beim Drop am Ende der Task zurückgegeben, auch bei Fehler oder Panic. Die Tasks sammle ich in einem `JoinSet`. Ein begrenzter Channel allein reicht nicht, wenn der Consumer für jede Nachricht beliebig viele Tasks startet.

    [tokio::sync::Semaphore](https://docs.rs/tokio/latest/tokio/sync/struct.Semaphore.html)
- id: broken-pipe
  module: rust-praxis
  level: 2
  tags:
  - cli
  q: Warum panikt `mein-cli | head -1`, und wie behebst du es?
  a: |
    `head` beendet sich nach der ersten Zeile und schließt die Pipe. Rust-Programme ignorieren SIGPIPE standardmäßig, der nächste Schreibversuch liefert deshalb einen `io::Error` mit `ErrorKind::BrokenPipe`, und `println!` panikt bei jedem Schreibfehler. Ich schreibe mit `writeln!` auf einen gepufferten, gesperrten stdout, reiche Fehler mit `?` nach oben und behandle `BrokenPipe` in `main` als normales Ende.

    [std::io::ErrorKind::BrokenPipe](https://doc.rust-lang.org/std/io/enum.ErrorKind.html#variant.BrokenPipe)
- id: property-snapshot
  module: testen-qualitaet
  level: 3
  tags:
  - tests
  q: Wann nimmst du einen Property-Test, wann einen Snapshot-Test?
  a: |
    Einen Property-Test, wenn sich eine Regel für alle Eingaben formulieren lässt: Roundtrip `parse(format(x)) == x`, Sortierung bleibt sortiert, kein Panic bei beliebigem Text. proptest erzeugt Eingaben und verkleinert ein gefundenes Gegenbeispiel, solange der Test weiter scheitert. Einen Snapshot-Test für große, stabile Ausgaben wie Hilfetext oder Bericht, die ich nicht Feld für Feld prüfen will; jede Änderung schaue ich dann bewusst an, statt sie blind zu akzeptieren. Beide ergänzen Beispieltests, sie ersetzen sie nicht.

    [proptest](https://docs.rs/proptest/latest/proptest/) · [insta](https://docs.rs/insta/latest/insta/)
- id: non-exhaustive
  module: traits-generics
  level: 3
  tags:
  - api
  q: Wie machst du ein öffentliches Fehler-Enum erweiterbar?
  a: |
    Mit `#[non_exhaustive]`, und zwar beim ersten Release oder beim nächsten Major-Release – nachträglich angebracht bricht das Attribut selbst jedes vorhandene `match`. Danach brauchen Crates, die meine Bibliothek nutzen, in jedem `match` einen `_`-Arm, und eine neue Variante ist kein Breaking Change mehr. Im eigenen Crate wirkt das Attribut nicht. Dazu gehören private Felder in öffentlichen Structs und versiegelte Traits, wenn nur meine Bibliothek sie implementieren soll.

    [Reference · non_exhaustive](https://doc.rust-lang.org/reference/attributes/type_system.html#the-non_exhaustive-attribute)
- id: language-choice
  level: 2
  tags:
  - praxis
  q: Warum Rust statt Go oder C++?
  a: |
    Ich beginne mit Anforderungen: Kontrolle über Speicher und Ressourcen, Integrationsbedarf, Teamkenntnis und Auslieferung. Rust bietet starke compile-time Sicherheitsprüfungen, kostet aber Einarbeitung. Eine Entscheidung ohne konkreten Workload und Betriebskontext wäre nur eine Präferenz.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch12-00-an-io-project.html).
- id: review-disagreement
  level: 2
  tags:
  - praxis
  q: Ein Reviewer fordert weniger generischen Code. Deine Reaktion?
  a: |
    Ich prüfe, welche reale zweite Verwendung die Abstraktion trägt. Dann vergleiche ich Lesbarkeit, API-Vertrag und Änderungsbedarf. Eine konkrete einfachere Lösung ist besser als ein nur hypothetischer Wiederverwendungsgewinn.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch12-00-an-io-project.html).
- id: bug-report
  level: 2
  tags:
  - praxis
  q: Wie bearbeitest du einen Produktionsfehler?
  a: |
    Ich sichere reproduzierbare Eingaben ohne Geheimnisse und trenne Beobachtung von Vermutung. Ein Regressionstest soll vor der Reparatur scheitern. Danach dokumentiere ich Ursache, Auswirkung und überprüfte Grenzen der Lösung.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch12-00-an-io-project.html).
- id: ai-contribution
  level: 2
  tags:
  - praxis
  q: Wie erklärst du KI-Unterstützung im Portfolio?
  a: |
    Ich benenne Unterstützung offen und zeige, welche Verträge ich selbst überprüft habe. Ich kann Ownership, Fehlerfälle und Tests im Code erklären. Fremd erzeugte Zeilen ohne dieses Verständnis sind kein belastbarer Kompetenznachweis.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch12-00-an-io-project.html).
- id: deadline
  level: 3
  tags:
  - praxis
  q: Wie priorisierst du kurz vor Abgabe?
  a: |
    Ich sichere den vollständigen Kernablauf, Fehlermeldungen und reproduzierbare Tests. Optionale Performancearbeit kommt erst nach korrekten Ergebnissen. Offene Grenzen dokumentiere ich so, dass ein Reviewer die Abgabe selbst beurteilen kann.

    [Offizielle Dokumentation](https://doc.rust-lang.org/book/ch12-00-an-io-project.html).
