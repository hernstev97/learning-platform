projects:
- id: textstatistik
  title: Textstatistik-CLI
  level: 1
  hours: 6
  summary: Zeilen und Wörter zählen, ohne Fehler still verschwinden zu lassen.
  capstone: false
  brief: |-
    Baue ein CLI für genau eine Textdatei. Es zählt physische Zeilen, nicht leere Zeilen und durch Whitespace getrennte Wörter. Definiere ausdrücklich, wie leere Dateien und fehlendes abschließendes Newline behandelt werden.

    Nutzdaten gehen auf stdout, Fehler auf stderr. Der Parser muss ohne Dateisystem testbar sein. Keine Netzwerkzugriffe und keine Nebenläufigkeit in dieser ersten Version.
  skills:
  - Ownership
  - Strings
  - BufRead
  - Result
  - CLI
  steps:
  - id: schritt-1
    title: Zählregeln definieren
    detail: Schreibe Beispiele für leer, Leerzeile, Unicode und fehlendes letztes Newline.
  - id: schritt-2
    title: Kernfunktion schreiben
    detail: Nimm einen Reader oder geliehenen Text entgegen. Halte die Funktion unabhängig von Prozessargumenten.
  - id: schritt-3
    title: CLI-Grenze verbinden
    detail: Validiere genau einen Pfad. Erhalte I/O-Fehler und gib einen passenden Prozessstatus zurück.
  - id: schritt-4
    title: Randfälle prüfen
    detail: Nutze Speichertests und einen Integrationstest mit einer temporären Fixture.
  - id: schritt-5
    title: Auslieferbare Anleitung schreiben
    detail: Dokumentiere Aufruf, Format und Fehlerstatus. Prüfe ein Release-Binary mit denselben Fixtures.
  acceptance:
  - id: abnahme-1
    text: Leere Dateien liefern einen definierten Nullbericht.
  - id: abnahme-2
    text: Fehlende Dateien führen zu Fehlerstatus und stderr.
  - id: abnahme-3
    text: Unicode-Text wird nach den dokumentierten Wortregeln verarbeitet.
  - id: abnahme-4
    text: Tests laufen ohne reale Nutzerdaten.
  stretch:
  - stdin über einen expliziten Parameter unterstützen.
  - Maschinenlesbares JSON mit Serializer anbieten.
  portfolio: Zeige einen gültigen Aufruf und eine fehlende Datei. Erläutere, weshalb String-Bytes und sichtbare
    Zeichen unterschiedliche Größen sind.
- id: aufgaben-datei
  title: Aufgabenverwaltung mit Datei-Persistenz
  level: 1
  hours: 10
  summary: Ein kleines CLI mit stabilen IDs und verlässlichem Speichern.
  capstone: false
  brief: |-
    Baue `add`, `list` und `done` für lokale Aufgaben. Jede Aufgabe hat eine stabile ID, einen Titel und einen Status. Das Dateiformat ist dokumentiertes JSON über einen Serializer.

    Verhindere, dass eine ungültige vorhandene Datei als leere Liste behandelt und überschrieben wird. Die erste Version unterstützt ausdrücklich nur einen schreibenden Prozess zur Zeit; eine Mehrprozessgarantie ist kein stilles Versprechen.
  skills:
  - Structs/Enums
  - Serde
  - Dateien
  - Fehler
  - Tests
  steps:
  - id: schritt-1
    title: Datenmodell festlegen
    detail: Definiere ID-Erzeugung und erlaubte Statusübergänge. Titel aus Leerraum sind ungültig.
  - id: schritt-2
    title: Befehle parsen
    detail: Trenne Argumentfehler von nicht gefundenen IDs. Gib verständliche Hilfe aus.
  - id: schritt-3
    title: Lesen und Serialisieren isolieren
    detail: Teste gültige und kaputte Dokumente ohne produktive Dateien.
  - id: schritt-4
    title: Schreibstrategie umsetzen
    detail: Schreibe zuerst eine temporäre Datei im Zielverzeichnis und prüfe die dokumentierte Ersetzungsstrategie
      auf deinem Zielsystem.
  - id: schritt-5
    title: Fehlerfälle testen
    detail: Kaputte Datei und unbekannte ID dürfen bestehende Daten nicht verlieren.
  - id: schritt-6
    title: Betriebsgrenzen dokumentieren
    detail: Beschreibe Sicherung, Dateipfad und die fehlende Mehrprozessunterstützung im README.
  acceptance:
  - id: abnahme-1
    text: IDs bleiben bei erneutem Laden stabil.
  - id: abnahme-2
    text: Kaputte Eingabedaten werden nicht durch eine leere Liste ersetzt.
  - id: abnahme-3
    text: Unbekannte IDs liefern einen Fehler ohne Datenänderung.
  - id: abnahme-4
    text: Add/list/done sind durch Integrationsfälle belegt.
  stretch:
  - Dateisperre mit einem getesteten plattformspezifischen Vertrag.
  - Versioniertes Schema mit Migration vorhandener Daten.
  portfolio: Präsentiere einen normalen Durchlauf und anschließend eine beschädigte Datei. Erläutere, was deine
    Schreibstrategie garantiert und welche Crash- oder Mehrprozessfälle noch offen sind.
- id: parallele-dateipruefung
  title: Parallele Dateiprüfung
  level: 2
  hours: 20
  summary: Mehrere Dateien begrenzt nebenläufig hashen und Ergebnisse stabil ausgeben.
  capstone: false
  brief: |-
    Baue ein CLI, das explizit angegebene Dateien mit SHA-256 prüft. Verwende eine gepflegte Hash-Bibliothek und keine eigene Kryptografie. Eine feste Workergrenze verhindert unbegrenzte Thread-Erzeugung.

    Ergebnisse sind nach Pfad stabil geordnet; Lesefehler werden mit Pfad gemeldet. Dateien werden nicht verändert. Die Prüfsumme erkennt Inhaltsunterschiede, beweist aber ohne vertrauenswürdige Referenz keine Herkunft.
  skills:
  - Threads
  - Channels
  - Ownership
  - BufRead
  - Fehler
  - Integrationstests
  steps:
  - id: schritt-1
    title: Schnittstelle und Grenzen definieren
    detail: Lege Workerzahl, Ausgabeformat und Verhalten bei Fehlern fest. Rekursion bleibt zunächst außerhalb des
      Scopes.
  - id: schritt-2
    title: Eine Datei zuverlässig verarbeiten
    detail: Lies in Blöcken und prüfe leere sowie große Dateien. Behalte Pfade als PathBuf.
  - id: schritt-3
    title: Worker begrenzen
    detail: Verteile Aufträge über einen nachvollziehbaren Kanal. Sammle jeden Thread-Abschluss.
  - id: schritt-4
    title: Stabile Ausgabe erzeugen
    detail: Trenne Abschlussreihenfolge von Ausgabereihenfolge. Zeige Lesefehler ausdrücklich.
  - id: schritt-5
    title: Parallelität testen
    detail: Vergleiche Ergebnisse mit einem seriellen Lauf. Prüfe mehr Dateien als Worker und fehlende Dateien.
  - id: schritt-6
    title: Messen und dokumentieren
    detail: Vergleiche Release-Läufe bei kontrolliertem Datensatz. Beschreibe I/O-Grenzen statt pauschaler Geschwindigkeitsversprechen.
  acceptance:
  - id: abnahme-1
    text: Die maximale Workerzahl wird eingehalten.
  - id: abnahme-2
    text: Serieller und paralleler Lauf liefern gleiche Hashes.
  - id: abnahme-3
    text: Die Ausgabe ist unabhängig von Scheduling stabil.
  - id: abnahme-4
    text: Alle Threads werden abgeschlossen oder kontrolliert beendet.
  - id: abnahme-5
    text: Lesefehler verschwinden nicht aus dem Gesamtergebnis.
  stretch:
  - Manifestvergleich mit fehlenden und geänderten Dateien.
  - Graceful Shutdown mit sauber dokumentierter Teilausgabe.
  portfolio: Zeige eine gemessene Abwägung zu Workerzahl und Datenträgerlast. Erkläre Ownership-Transfer und warum
    mehr Threads nicht unbegrenzt schneller sind.
- id: healthchecker
  title: Healthchecker für Dienste
  level: 3
  hours: 28
  summary: Dienste per TCP, HTTP und Prozessaufruf prüfen – begrenzt nebenläufig, abbrechbar, mit atomar geschriebenem Bericht und Messprotokoll.
  capstone: false
  brief: |-
    Auftrag: Ein Plattformteam rollt jeden Dienstag um 6 Uhr aus. Vorher soll ein Werkzeug prüfen, ob alle Abhängigkeiten erreichbar sind: die Datenbank, zwei interne HTTP-APIs und ein lokales Prüfwerkzeug wie `pg_isready`. Heute klickt jemand die Liste von Hand ab. Das Team will einen Befehl, der in einer Pipeline läuft, einen klaren Exit-Status liefert und einen Bericht für das Deployment-Protokoll ablegt.

    Baue `healthcheck` mit Tokio. Die Ziele stehen in einer TOML-Datei; jedes hat einen Namen, eine Art (`tcp`, `http` oder `befehl`) und einen Timeout:

    ```toml
    [[ziel]]
    name = "datenbank"
    art = "tcp"
    adresse = "10.0.0.5:5432"
    timeout_ms = 500

    [[ziel]]
    name = "api"
    art = "http"
    adresse = "10.0.0.7:8080"
    pfad = "/health"
    timeout_ms = 1000

    [[ziel]]
    name = "pg-bereit"
    art = "befehl"
    programm = "pg_isready"
    argumente = ["-h", "10.0.0.5", "-p", "5432"]
    timeout_ms = 2000
    ```

    Pflicht: TCP-Prüfung über Verbindungsaufbau; HTTP-Prüfung mit einer selbst geschriebenen, minimalen HTTP/1.1-Anfrage über `tokio::net::TcpStream` (nur `http://`, nur die Statuszeile auswerten, 2xx gilt als gesund – die Grenzen stehen im README); Prozessprüfung über `tokio::process::Command` mit Argumentliste, ohne Shell. Höchstens `--parallel N` Prüfungen gleichzeitig, jede mit eigenem Timeout. Strg+C bricht laufende Prüfungen ab und hinterlässt keine Kindprozesse. Der Textbericht geht auf stdout, Diagnosen auf stderr, ein JSON-Bericht wird atomar in eine Datei geschrieben. Exit-Status: 0 alle gesund, 1 mindestens ein Ziel ungesund, 2 Konfigurations- oder Aufruffehler. Dazu Tests, ein Benchmark und ein Messprotokoll.

    Rahmen: Keine echten Firmenadressen im Repository, alle Tests laufen gegen lokale Fake-Dienste auf Port 0. Ein HTTP-Client wie reqwest wäre im Betrieb die bessere Wahl; hier schreibst du die Anfrage selbst, weil es um das Denkmodell Bytestrom, Framing und Timeout geht. KI darf dir Boilerplate wie das CI-YAML abnehmen. Parser, Nebenläufigkeitsmodell, Tests und Messprotokoll schreibst und begründest du selbst.
  skills:
  - Tokio
  - select! und Timeouts
  - Semaphore
  - CancellationToken
  - tokio::net
  - tokio::process
  - serde/toml
  - clap
  - Atomares Schreiben
  - Integrationstests
  - criterion
  - hyperfine
  steps:
  - id: vertrag
    title: Vertrag, Konfiguration und Fake-Dienste festlegen
    detail: Schreibe das TOML-Format, die Exit-Status, das Berichtsformat (Text und JSON) und das Verhalten bei Strg+C auf, bevor du Code schreibst. Plane die lokalen Fake-Dienste für die Tests – gesund, langsam, HTTP 503, Port geschlossen – und welches Ergebnis jeder liefern muss.
  - id: konfig-laden
    title: Konfiguration laden und prüfen
    detail: "`#[derive(Deserialize)]` mit `deny_unknown_fields` und einem Enum für die Art. Prüfe fachliche Regeln (Timeout größer 0, Programm nicht leer, Namen eindeutig) in einer `TryFrom`-Umwandlung in deine internen Typen. clap liefert `--konfig`, `--parallel` und `--bericht`; ein Fehler endet mit Status 2 und einer Meldung mit Datei und Ursache."
  - id: tcp-pruefung
    title: TCP-Prüfung mit Zeitlimit
    detail: "`TcpStream::connect` innerhalb von `tokio::time::timeout`. Miss die Dauer mit `Instant` und unterscheide Zeitlimit, verweigerte Verbindung und Namensauflösung im Ergebnis. Teste gegen einen `TcpListener` auf `127.0.0.1:0` und gegen einen Port, der gerade frei geworden ist."
  - id: http-pruefung
    title: Minimale HTTP-Prüfung
    detail: Sende `GET <pfad> HTTP/1.1` mit `Host` und `Connection close`, lies bis zum Ende der ersten Zeile und parse die Statuszeile in einer reinen Funktion ohne I/O. Die Funktion bekommt einen Property-Test mit proptest. Dokumentiere, was du bewusst nicht kannst (TLS, Weiterleitungen, Chunked Encoding).
  - id: befehl-pruefung
    title: Prozessprüfung ohne Shell
    detail: "`tokio::process::Command` mit `args`, `kill_on_drop(true)` und Timeout. Werte `ExitStatus` aus, nimm einen gekürzten stderr-Auszug in den Bericht und unterscheide „Programm nicht gefunden“ von „Programm meldet Fehler“."
  - id: begrenzt-nebenlaeufig
    title: Begrenzt nebenläufig prüfen
    detail: Starte jede Prüfung in einem `JoinSet` und begrenze die gleichzeitigen mit einer `Semaphore` (Permit wandert in die Task). Trenne Task-Fehler (`JoinError`) von fachlichen Fehlschlägen und sortiere die Ergebnisse vor der Ausgabe nach Namen.
  - id: abbruch
    title: Strg+C und Abbruch
    detail: "`tokio::signal::ctrl_c` löst ein `CancellationToken` aus; jede Prüfung wartet per `select!` auf Ergebnis oder Abbruch. Prüfe, dass nach Strg+C kein Kindprozess weiterläuft, und lege fest, ob ein abgebrochener Lauf einen markierten Teilbericht schreibt."
  - id: bericht-atomar
    title: Bericht schreiben, ohne Halbes zu hinterlassen
    detail: Textbericht über `BufWriter` auf gesperrtem stdout, Broken Pipe beendet still. Den JSON-Bericht schreibst du in eine temporäre Datei im Zielverzeichnis, rufst `flush` und `sync_all` auf und ersetzt das Ziel per `rename`.
  - id: tests
    title: Tests gegen Fake-Dienste
    detail: "Integrationstests mit lokalen Fake-Diensten, Timeouts mit `#[tokio::test(start_paused = true)]`, wo die Zeit simuliert werden kann. Ein CLI-Test mit assert_cmd und tempfile prüft Exit-Status, stdout und die Berichtsdatei. Ein insta-Snapshot hält den Textbericht fest; Dauern filterst du heraus, damit der Snapshot stabil bleibt."
  - id: messen
    title: Messen und Messprotokoll
    detail: Ein criterion-Benchmark misst Statuszeilen-Parser und Berichtserzeugung. hyperfine misst einen ganzen Lauf gegen 50 lokale Fake-Dienste mit `--parallel 1`, `8` und `32`. Halte Hypothese, Werte (Release-Build), Streuung und deine Entscheidung für den Standardwert von `--parallel` im README fest.
  acceptance:
  - id: exit-status
    text: Exit-Status 0, 1 und 2 verhalten sich wie im README beschrieben; je ein automatisierter Test belegt jeden Status.
  - id: grenze-eingehalten
    text: Nie laufen mehr als `--parallel` Prüfungen gleichzeitig; ein Test mit zählendem Fake-Dienst belegt das.
  - id: timeout-greift
    text: Ein hängender Dienst wird nach seinem Timeout als ungesund gemeldet, und der Lauf endet trotzdem.
  - id: keine-shell
    text: Prozessprüfungen laufen mit Argumentliste ohne Shell; nach Timeout oder Strg+C bleibt kein Kindprozess zurück.
  - id: bericht-ganz-oder-gar-nicht
    text: Die JSON-Datei ist nach jedem Lauf entweder die alte oder die neue vollständige Fassung; die temporäre Datei liegt im Zielverzeichnis.
  - id: stdout-sauber
    text: stdout enthält nur den Bericht, Diagnosen gehen auf stderr; `healthcheck … | head -1` endet ohne Panic.
  - id: tests-ci
    text: "`cargo fmt --check`, `cargo clippy --all-targets -- -D warnings` und alle Tests (Integration, Property, Snapshot) laufen in CI grün."
  - id: messprotokoll
    text: Das README enthält criterion- und hyperfine-Ergebnisse aus dem Release-Build mit Hypothese, Streuung und begründeter Entscheidung.
  stretch:
  - HTTPS über einen gepflegten Client (reqwest mit rustls) als zusätzliche Art `https`, die minimale Implementierung bleibt für `http`.
  - Wiederholungen mit Backoff und Jitter, sichtbar im Bericht.
  - Ausgabe im Prometheus-Textformat für einen Node-Exporter-Textfile-Collector.
  - Konfiguration bei SIGHUP neu laden und über einen `watch`-Kanal an laufende Prüfungen verteilen.
  portfolio: |-
    Zeige eine kurze Demo gegen lokale Fake-Dienste: alles gesund, dann ein langsamer Dienst, dann Strg+C mitten im Lauf. Zeige den Exit-Status und den JSON-Bericht.

    Erkläre im Gespräch drei Entscheidungen: warum die Nebenläufigkeit mit einer Semaphore begrenzt ist und nicht mit der Zahl der Threads, wie Abbruch und Kindprozesse zusammenhängen, und welcher Messwert deinen Standard für `--parallel` begründet. Nenne die Grenzen der eigenen HTTP-Prüfung offen.

- id: abschluss-logwerk
  title: 'Abschlussprojekt: Logwerk für den Betrieb'
  level: 3
  hours: 42
  summary: Ein belastbares CLI für begrenzte parallele Loganalyse mit Tests, Diagnose und Release.
  capstone: true
  brief: |-
    Auftrag: Ein Betriebsteam erhält mehrere Logdateien aus einem fehlgeschlagenen nächtlichen Lauf. Es braucht eine nachvollziehbare Zusammenfassung pro Datei und insgesamt, die sowohl im Terminal als auch in einer CI-Pipeline funktioniert.

    Baue `logwerk` für explizit angegebene UTF-8-Dateien mit den Stufen INFO, WARN und ERROR. Jede Datenzeile hat Stufe und nicht leere Meldung; Leerzeilen werden ignoriert. Unbekannte Stufen, ungültiges UTF-8 oder Lesefehler führen zu einem Fehler mit Datei und Zeilennummer, soweit verfügbar. Die strenge Version liefert keinen als vollständig dargestellten Teilbericht.

    Pflicht: konfigurierbare, begrenzte Workerzahl, deterministische Text- und JSON-Ausgabe, strukturierte Diagnosen mit tracing auf stderr, dokumentierte Konfiguration, Unit- und CLI-Integrationstests, CI und Release-Binary. Eingabedateien bleiben unverändert. Verwende Tokio nur, wenn du eine konkrete asynchrone Grenze begründen kannst; ein begrenzter Threadpool ist für lokale Dateien zulässig.
  skills:
  - Ownership
  - Enums
  - Result
  - Iteratoren
  - I/O
  - Threads/Channels
  - tracing
  - Cargo
  - Tests
  steps:
  - id: schritt-1
    title: Vertrag und Fixtures schreiben
    detail: Definiere gültige Zeilen, Fehlerstatus, Ausgabe und Grenzen. Erzeuge kleine synthetische Fixtures für
      alle Abnahmefälle.
  - id: schritt-2
    title: Parser und Fehlertypen modellieren
    detail: Halte Parser frei von Prozess-I/O. Unterscheide Leerzeile, gültige Stufe und Fehlerursache.
  - id: schritt-3
    title: Streaming-Auswertung bauen
    detail: Verarbeite eine Datei mit Reader-Schnittstelle. Ergänze physische Zeilennummern und eine dokumentierte
      Größenbegrenzung.
  - id: schritt-4
    title: CLI und Konfiguration ergänzen
    detail: Validiere Eingaben und Workerzahl. Dokumentiere eindeutig, welche Quelle bei CLI- und Konfigurationswerten
      Vorrang hat.
  - id: schritt-5
    title: Begrenzte Parallelität integrieren
    detail: Starte höchstens die vereinbarte Zahl Worker. Sammle Fehler und alle Abschlüsse, ohne Sender oder Handles
      zu verlieren.
  - id: schritt-6
    title: Berichte stabil serialisieren
    detail: Text und JSON müssen dieselbe fachliche Zusammenfassung abbilden. Schreibe JSON mit Serializer und halte
      stdout frei von Logs.
  - id: schritt-7
    title: Diagnosen und Abbruch ergänzen
    detail: Nutze tracing auf stderr ohne ganze vertrauliche Logzeilen. Plane den Umgang mit Ausgabe- und Verarbeitungsfehlern.
  - id: schritt-8
    title: Unit- und Integrationstests abschließen
    detail: Teste alle Stufen, CRLF, Leerdatei, späten Parserfehler, fehlende Datei, ungültige Argumente und serielle/parallele
      Gleichheit.
  - id: schritt-9
    title: CI und Release erstellen
    detail: Prüfe fmt, clippy mit -D warnings, Tests und Release-Build. Stelle ein überprüfbares Binary für dein
      Zielsystem bereit.
  - id: schritt-10
    title: Abnahme und Portfolio dokumentieren
    detail: Führe die Fixtures mit dem Release-Artefakt aus. README zeigt Installation, CLI-Beispiele, Architektur,
      Exit-Status und bekannte Grenzen.
  acceptance:
  - id: abnahme-1
    text: Text- und JSON-Bericht stimmen fachlich überein und haben deterministische Reihenfolge.
  - id: abnahme-2
    text: Ungültige Daten oder fehlende Dateien führen zu Fehlerstatus mit Kontext, ohne vollständigen Erfolgsbericht
      vorzutäuschen.
  - id: abnahme-3
    text: stdout enthält ausschließlich dokumentierte Nutzdaten; tracing-Diagnosen gehen auf stderr.
  - id: abnahme-4
    text: Workerzahl und Größenbegrenzungen sind implementiert und durch Tests beziehungsweise Messung belegt.
  - id: abnahme-5
    text: Unit- und CLI-Integrationstests laufen in CI zusammen mit fmt und clippy -D warnings.
  - id: abnahme-6
    text: Ein Release-Binary verarbeitet die mitgelieferten Fixtures gemäß README.
  - id: abnahme-7
    text: Eingabedateien bleiben unverändert; das Repository enthält nur synthetische Logs.
  - id: abnahme-8
    text: README erklärt Konfigurationspriorität, Fehlerverhalten, Parallelitätsmodell und nicht garantierte Fälle.
  stretch:
  - Toleranter Modus mit ausdrücklich markiertem Teilbericht und Fehleranzahl.
  - Benchmark einer konkreten Parser- oder I/O-Grenze.
  - Rekursive Pfadauswahl mit definiertem Symlink-Verhalten.
  portfolio: |-
    Präsentiere im Repository eine zweiminütige Demo, kleine Fixtures, einen CI-Lauf und die installierbare Release-Datei. Zeige anschließend bewusst einen Fehler in einer späteren Zeile.

    Erkläre im Gespräch drei Entscheidungen: strenge Datenintegrität, begrenzte Parallelität und Trennung von stdout/stderr. Zeige einen Regressionstest und sage, welche Performance-Aussage du tatsächlich gemessen hast. Keine Produktivlogs oder erfundenen Lastzahlen verwenden.
