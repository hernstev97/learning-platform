cards:
  # Fundament: Unit-Tests
  - id: warum-automatisierte-tests
    module: unit-tests
    q: Warum schreibst du automatisierte Tests, wenn du den Code ohnehin von Hand ausprobierst?
    a: |
      Weil ein Test die Prüfung bei jeder Änderung wiederholt, ohne dass jemand daran denken muss. Er meldet in Sekunden, ob ich etwas kaputt gemacht habe, und erst damit wird Refactoring sicher. Außerdem hält er fest, was der Code tun soll: `test_fahrt_bis_fuenf_minuten_kostet_nichts` beschreibt die Fehlstart-Regel als ausführbares Beispiel, und dieses Beispiel veraltet nicht still wie eine Wiki-Seite.

      Von Hand probiere ich einen Fall einmal aus. Nach zwanzig Änderungen in drei Monaten weiß niemand mehr, ob die 5-Minuten-Grenze noch stimmt.

      Abgrenzung: Tests zeigen die Anwesenheit von Fehlern, nicht ihre Abwesenheit (Dijkstra). Eine grüne Suite heißt nur, dass die geprüften Fälle stimmen. Deshalb wähle ich die Fälle systematisch und teste dort zusätzlich explorativ, wo ich nicht weiß, wonach ich suchen soll.
    tags: [grundlagen, motivation]
    level: 1
  - id: testfaelle-systematisch
    module: unit-tests
    q: Wie findest du die Testfälle für `mietpreis(minuten)` – City-Rad, 150 Cent je angefangene 30 Minuten, bis einschließlich 5 Minuten kostenlos?
    a: |
      Ich teile die Eingaben in Äquivalenzklassen und prüfe dann die Grenzen. Die Klassen: Fehlstart (0–5 Minuten → 0 Cent), erste halbe Stunde (6–30 → 150), jede weitere angefangene halbe Stunde (31–60 → 300 und so weiter) und ungültige Eingaben wie negative Minuten.

      Die wichtigsten Fälle liegen an den Grenzen: 5 und 6, 30 und 31, 60 und 61. Dort sitzen die typischen Fehler – `<` statt `<=` bei der Fehlstart-Regel, abgerundet statt aufgerundet. Dazu 0 Minuten und `-1`. Ich schreibe das als eine parametrisierte Tabelle mit sprechenden IDs wie `fehlstart-grenze`, damit ein roter Fall die Regel nennt.

      Sobald mehrere Bedingungen zusammenspielen – Rad-Typ, Abo, Tageshöchstpreis –, reicht die Tabelle für eine Eingabe nicht. Dann nehme ich eine Entscheidungstabelle für die Kombinationen und eine Property wie „nie mehr als der Tageshöchstpreis“ für den großen Rest.
    tags: [testfälle, grenzwerte]
    level: 1
  - id: test-mit-vielen-gruenden
    module: unit-tests
    q: |
      Code-Review: Was stört dich an diesem Test?

      ```python
      def test_tarif():
          t = Tarif()
          assert t._runde_auf(31) == 60
          assert t.preis(31) == 300
          assert t.preis(5) == 0
          t.setze_abo(True)
          assert t.preis(31) == 150
      ```
    a: |
      Drei Dinge. Erstens prüft er die private Hilfsmethode `_runde_auf`. Benenne ich sie um oder rechne ich anders, wird der Test rot, obwohl jeder Preis stimmt. Ich teste über die öffentliche Schnittstelle, hier `preis`.

      Zweitens hat er viele Gründe zu scheitern. Bricht die erste Zusicherung, sehe ich die übrigen nicht, und `test_tarif` sagt nicht, welche Regel verletzt ist. Ich teile ihn auf in `test_fahrt_bis_fuenf_minuten_kostet_nichts`, `test_angefangene_halbe_stunde_zaehlt_voll` und `test_abo_macht_die_ersten_30_minuten_kostenlos`. Die Namen lesen sich dann wie der Tarif.

      Drittens ändert er mitten im Test den Zustand (`setze_abo`). Das ist ein zweiter Act-Abschnitt und gehört in einen eigenen Test mit eigenem Arrange.

      Abgrenzung: „Ein `assert` pro Test“ ist keine Pflicht. Mehrere Zusicherungen auf dasselbe Ergebnis, etwa Status und Body einer Antwort, sind in Ordnung, solange sie ein Verhalten prüfen.
    tags: [review, lesbarkeit]
    level: 1
  - id: entscheidungstabelle-gutschein
    module: unit-tests
    q: Ein Gutschein wird angenommen, wenn das Format stimmt, er nicht abgelaufen ist und die Kundin ihn noch nicht eingelöst hat. Wie leitest du daraus Tests ab?
    a: |
      Mit einer Entscheidungstabelle. Drei Bedingungen mit je zwei Werten ergeben acht Kombinationen, die Regel hat aber nur einen Erfolgsfall: alle drei erfüllt. Für die Ablehnung nehme ich je einen Fall, in dem genau eine Bedingung verletzt ist. So sehe ich, dass jede Bedingung für sich wirkt, und komme mit vier statt acht Tests aus.

      Dazu kommen die Grenzen jeder Bedingung. Ablaufdatum heute ist noch gültig („bis einschließlich“), gestern nicht, und „heute“ heißt in `Europe/Berlin`, nicht in UTC. Beim Format `RW-` plus sechs Großbuchstaben oder Ziffern prüfe ich `RW-AB12C` (fünf Zeichen) und `RW-ab12cd` (Kleinbuchstaben) als ungültige Vertreter.

      Wenn Bedingungen sich gegenseitig beeinflussen, etwa ein Rabatt, der vom Abo abhängt, teste ich mehr Kombinationen. Bei vielen unabhängigen Parametern helfen paarweise Kombinationen (Pairwise Testing) statt des vollen Kreuzprodukts.
    tags: [testfälle, entscheidungstabelle]
    level: 2

  # Fundament: Testpyramide
  - id: testpyramide-kritik
    module: testpyramide
    q: Was sagt die Testpyramide, und was wird an ihr kritisiert?
    a: |
      Mike Cohns Pyramide sagt: viele schnelle Unit-Tests, weniger Service- oder Integrationstests, wenige UI-Tests. Der Grund ist die Kostenkurve. Je höher die Ebene, desto langsamer und teurer in der Wartung ist ein Test, desto eher wird er flaky und desto schlechter zeigt er bei Rot, wo der Fehler sitzt.

      Kritisiert wird vor allem die Form. Die Testing Trophy von Kent C. Dodds legt für Frontends den Schwerpunkt auf Integrationstests, weil isolierte Komponententests wenig über die Nutzung sagen. Spotifys Honeycomb argumentiert ähnlich für Microservices, deren Risiko oft im Zusammenspiel liegt. Und die Namen der Ebenen bedeuten in jedem Team etwas anderes.

      Für mich ist die Pyramide eine Faustregel für Kosten, keine Quote. Ich frage pro Risiko, welche Ebene es am günstigsten verlässlich zeigt. Das Anti-Muster, das alle Modelle vermeiden wollen, ist die Eistüte: viele manuelle und E2E-Tests, kaum schnelle.
    tags: [testebenen, pyramide]
    level: 1
  - id: was-ist-ein-unit-test
    module: testpyramide
    q: Was ist für dich ein Unit-Test – eine Klasse, bei der alles andere gemockt wird?
    a: |
      Für mich ist ein Unit-Test schnell, deterministisch und prüft ein Verhalten über eine öffentliche Schnittstelle. Die „Unit“ ist eine Verhaltenseinheit, nicht zwingend eine Klasse. Den Tarif teste ich zusammen mit den Value Objects, die er nutzt. Ersetzt wird nur, was langsam oder geteilt ist: Datenbank, Netzwerk, Uhr.

      Das ist die klassische Schule (Detroit) mit sociable Tests. Die Mockist-Schule (London) isoliert jede Klasse und ersetzt alle Kollaborateure durch Mocks, das sind solitary Tests. Ihr Vorteil: Ein roter Test zeigt auf genau eine Klasse. Ihr Nachteil: Die Tests kennen die Zusammenarbeit der Klassen und brechen bei Refactorings, die das Verhalten nicht ändern.

      Weil die Begriffe so verschieden benutzt werden, frage ich in einem neuen Team nach, was dort „Unit“ heißt. Oder ich spreche wie Google von small, medium und large: ein Prozess ohne I/O, eine Maschine, mehrere Maschinen.
    tags: [testebenen, begriffe]
    level: 2
  - id: ebene-tageshoechstpreis
    module: testpyramide
    q: Wie würdest du den Tageshöchstpreis testen? Er gilt je Kalendertag in `Europe/Berlin`. Auf welcher Ebene, und warum dort?
    a: |
      Die Regel teste ich mit Unit-Tests an der reinen Preisfunktion. Sie bekommt Fahrten mit Zeitpunkten und gibt Cent zurück. Dort sind die riskanten Fälle billig: Fahrten über Mitternacht, die Tage der Zeitumstellung Ende März und Ende Oktober, eine Fahrt um 00:30 Uhr deutscher Zeit, die in UTC noch am Vortag liegt. Das sind etwa zehn parametrisierte Fälle in Millisekunden, dazu eine Property „pro Kalendertag nie mehr als 1 500 Cent“.

      Voraussetzung: Die Funktion liest weder die Uhr noch die Zeitzone der Maschine. Zeitpunkte kommen als aware `datetime` herein, die Zone ist `ZoneInfo("Europe/Berlin")`.

      Darüber teste ich diese Regel nicht noch einmal. Ein Integrationstest prüft, dass Zeitstempel mit Zeitzone aus der Datenbank zurückkommen. Ein E2E-Test für den Tageshöchstpreis müsste die Uhr des ganzen Systems verstellen, wäre langsam und würde bei Rot nicht sagen, wo der Fehler sitzt.
    tags: [testebenen, entscheidung, zeit]
    level: 2
  - id: eistuete-umbauen
    module: testpyramide
    q: Ein Team hat 400 E2E-Tests und 30 Unit-Tests, die Pipeline braucht 50 Minuten und ist oft rot. Was schlägst du vor?
    a: |
      Kein Umbau auf einen Schlag, sondern messen und schrittweise nach unten verschieben. Zuerst: Welche Tests sind langsam, welche flaky, welche haben in den letzten Monaten überhaupt einen Fehler gefunden? Die CI-Daten beantworten das.

      Dann gehe ich die E2E-Tests nach dem Risiko durch, das sie abdecken. Viele prüfen Regeln über den Browser – Validierung, Preise, Berechtigungen. Die schreibe ich als Unit- oder API-Tests neu und lösche den E2E-Fall erst, wenn der Ersatz grün ist und nachweislich einen eingebauten Fehler fängt. Übrig bleiben 10 bis 20 Journeys für die kritischen Abläufe: anmelden, reservieren, bezahlen.

      Parallel dazu kommen flaky Tests mit Ticket in Quarantäne, die E2E-Suite wird gesharded, und die volle Suite läuft zusätzlich nachts. Für neuen Code gilt ab sofort: jedes Risiko auf der niedrigsten Ebene, die es verlässlich zeigt.

      Das ist kein Feldzug gegen E2E-Tests. Einige davon sind die einzige Stelle, an der Frontend, Backend und Konfiguration zusammen geprüft werden.
    tags: [testebenen, entscheidung, ci]
    level: 2

  # Fundament: Test Doubles
  - id: mock-oder-fake
    module: test-doubles
    q: Mock oder Fake – was nimmst du für das Reservierungs-Repository in Tests des Buchungsdienstes?
    a: |
      Einen Fake: `InMemoryReservierungen` mit derselben Schnittstelle wie das echte Repository, intern ein `dict`. Der Test bucht und fragt danach über die Schnittstelle ab, was gespeichert ist. Ich prüfe also Zustand und Ergebnis, nicht welche Methoden in welcher Reihenfolge liefen. Refactorings im Dienst brechen den Test nicht.

      Ein Mock würde Aufrufe wie `repo.speichere(reservierung)` erwarten. Stelle ich den Dienst auf `speichere_alle([…])` um, wird der Test rot, obwohl das Verhalten gleich bleibt.

      Damit der Fake nicht lügt, laufen dieselben Vertragstests gegen Fake und echtes Repository mit PostgreSQL. Einen Mock nehme ich für Kommandos nach außen, bei denen der Aufruf selbst das Ergebnis ist: „Es ging genau eine Bestätigungsmail an Kundin k-17 raus“ – und auch das am eigenen Mail-Adapter, nicht am SMTP-Client.
    tags: [test-doubles, fake, mock]
    level: 2
  - id: stub-vs-mock
    module: test-doubles
    q: Was unterscheidet einen Stub von einem Mock?
    a: |
      Ein Stub liefert vorbereitete Antworten, damit der getestete Code laufen kann, etwa eine Uhr, die immer `2026-03-29 01:59` meldet. Der Test prüft danach das Ergebnis des Codes. Das ist Zustandsprüfung.

      Ein Mock trägt Erwartungen an die Aufrufe, die er bekommt, und der Test prüft genau diese: `paystream.belaste.assert_called_once_with(kunde="k-17", cent=450)`. Das ist Verhaltensprüfung.

      In Python ist beides oft dasselbe Objekt, `unittest.mock.Mock`. Den Unterschied macht, was der Test damit tut. Meine Regel: Abfragen werden gestubbt und nie auf Aufrufe geprüft, Kommandos an Systemgrenzen dürfen gemockt werden. Martin Fowlers Artikel „Mocks Aren't Stubs“ beschreibt den Unterschied ausführlich.
    tags: [test-doubles, begriffe]
    level: 1
  - id: wo-patchen
    module: test-doubles
    q: |
      `buchung.py` beginnt mit `from radwerk.mail import sende_bestaetigung`. Der Test patcht `radwerk.mail.sende_bestaetigung`, trotzdem geht eine echte Mail raus. Warum?
    a: |
      `from … import` bindet den Namen `sende_bestaetigung` beim Import in den Namensraum von `radwerk.buchung`. `patch("radwerk.mail.sende_bestaetigung")` ersetzt nur das Attribut im Modul `radwerk.mail`; `buchung` hält weiter die Referenz auf die echte Funktion.

      Gepatcht wird dort, wo der Name nachgeschlagen wird: `patch("radwerk.buchung.sende_bestaetigung")`. Hätte `buchung.py` `import radwerk.mail` geschrieben und `radwerk.mail.sende_bestaetigung(…)` aufgerufen, wäre der ursprüngliche Patch richtig gewesen. Die Python-Dokumentation hat dafür einen eigenen Abschnitt, „Where to patch“.

      Muss ich überhaupt patchen, ist das oft ein Hinweis aufs Design. Bekommt `buche` den Mail-Adapter als Parameter, übergibt der Test einen Spy und braucht kein `patch`. Wenn doch, dann mit `autospec=True`, damit ein Tippfehler im Methodennamen nicht still grün bleibt.
    tags: [test-doubles, mock, python]
    level: 2
  - id: ueber-mocking-review
    module: test-doubles
    q: In einem PR prüft ein Test des Buchungsdienstes mit fünf Mocks, welche Methoden in welcher Reihenfolge aufgerufen werden. Was sagst du im Review?
    a: |
      Ich frage, welches Verhalten der Test absichert. Meist lautet die ehrliche Antwort: dass der Code so aussieht, wie er aussieht. Solche Tests spiegeln die Implementierung. Sie brechen bei jedem Refactoring und bleiben grün, wenn die Logik falsch ist, solange die Aufrufe stimmen.

      Mein Vorschlag: Domänenlogik ohne Mocks testen, mit echten Value Objects und einem Fake-Repository, und das Ergebnis prüfen – Reservierung gespeichert, Preis richtig, Rad belegt. Mocks bleiben für Kommandos nach außen, deren Aufruf das Ergebnis ist: die Zahlung bei Paystream, die Bestätigungsmail. Eine Reihenfolge prüfe ich nur, wenn sie fachlich zählt, etwa erst belasten, dann bestätigen.

      Fünf Mocks in einem Test deuten oft auf ein Designproblem. Die Klasse hat zu viele Abhängigkeiten, und ein Schnitt in Kern und Hülle hilft mehr als ein besserer Test.
    tags: [test-doubles, review, design]
    level: 2
  - id: dont-mock-what-you-dont-own
    module: test-doubles
    q: Was bedeutet „Don't mock what you don't own“ am Beispiel des Paystream-SDK?
    a: |
      Ich mocke keine Typen fremder Bibliotheken direkt. Ein Mock von `paystream.Client.create_charge` bildet nur meine Annahme über das SDK ab. Verstehe ich die Fehlerfälle falsch oder ändert Paystream das Verhalten, bleiben meine Tests grün und die Produktion bricht.

      Stattdessen schreibe ich einen schmalen eigenen Adapter in der Sprache der Domäne, `Zahlungen.belaste(kunde, cent) -> Zahlungsergebnis`. Die Domäne teste ich gegen einen Fake dieses Adapters. Den Adapter selbst prüfen Integrationstests gegen die Sandbox von Paystream oder gegen aufgezeichnete echte Antworten, einschließlich Timeouts und Ablehnungen.

      Das gilt genauso für die Datenbank – ein eigenes Repository zu faken ist in Ordnung, eine SQLAlchemy-Session zu mocken nicht. Für Webhooks, die Paystream an uns schickt, sichern Schema- oder Contract-Tests das Format ab.
    tags: [test-doubles, adapter, design]
    level: 3

  # Fundament: Testbares Design
  - id: datetime-now-testbar
    module: testbares-design
    q: Eine Funktion prüft mit `datetime.now()`, ob ein Gutschein abgelaufen ist. Wie machst du sie testbar?
    a: |
      Ich hole die Zeit aus der Funktion heraus. Der kleinste Schritt: Der Zeitpunkt wird ein Parameter, `ist_gueltig(gutschein, jetzt: datetime) -> bool`. Dann ist die Funktion rein, und Tests übergeben genau die Zeitpunkte, um die es geht: Ablauftag 23:59 in Berlin, eine Minute nach Mitternacht, der Tag der Zeitumstellung.

      Braucht ein Dienst die Uhr an vielen Stellen, bekommt er sie im Konstruktor, als `Callable[[], datetime]` oder kleines Protocol, und der Test eine feste Uhr. Die echte Uhr ruft nur die äußere Hülle auf.

      `freezegun` oder `time-machine` frieren die Zeit global ein und retten Altcode ohne Umbau. Für neuen Code ist das eine Notlösung, weil die Abhängigkeit versteckt bleibt. `datetime.datetime.now` direkt mit `monkeypatch` zu ersetzen scheitert übrigens: `datetime.datetime` ist ein eingebauter Typ, dessen Attribute sich nicht setzen lassen.
    tags: [design, zeit, dependency-injection]
    level: 1
  - id: functional-core-rueckgabe
    module: testbares-design
    q: Erkläre „Functional Core, Imperative Shell“ am Beispiel der Rückgabe eines Rads.
    a: |
      Ich trenne Entscheiden von Ausführen. Der Kern ist eine reine Funktion, `abrechnen(fahrt, rueckgabe, abo, bisher_heute_cent) -> Abrechnung`. Sie berechnet Dauer, Fehlstart, Tarif, Abo und Tageshöchstpreis und gibt einen Wert zurück, ohne Datenbank, Uhr oder Netzwerk.

      Die Hülle ist der Handler. Er liest Fahrt und Tagessumme aus der Datenbank, holt die aktuelle Zeit, ruft den Kern auf, speichert das Ergebnis und stößt die Zahlung an. Eigene Logik enthält er kaum.

      Für Tests heißt das: Den Kern prüfe ich mit vielen Unit- und Property-Tests ohne einen einzigen Mock. Die Hülle bekommt wenige Integrationstests, die zeigen, dass die Teile verbunden sind.

      Das ist kein Dogma. Besteht die Logik vor allem aus Datenbankabfragen, liegt das Risiko im SQL, und dann gehören die Tests dorthin.
    tags: [design, architektur]
    level: 2
  - id: altcode-ohne-tests
    module: testbares-design
    q: Du sollst in einer 600-Zeilen-Funktion ohne Tests die Gutscheinlogik ändern. Wie gehst du vor?
    a: |
      Erst absichern, dann ändern. Ich schreibe Characterization Tests: Eingaben, die die Funktion heute bekommt, und das, was sie heute ausgibt, auch wenn es falsch aussieht. Gute Quellen sind Produktionslogs und echte, anonymisierte Buchungen. Ist die Ausgabe groß, halte ich sie als Golden Master fest. Die Coverage zeigt mir, welche Zweige meine Eingaben noch nicht erreichen.

      Dann suche ich Seams, um Abhängigkeiten zu ersetzen. Datenbankzugriffe und `now()` ziehe ich mit kleinen, mechanischen Refactorings in Parameter. Die neue Gutscheinlogik schreibe ich als eigene, getestete Funktion (Sprout Method) und rufe sie aus der alten auf, statt in den 600 Zeilen weiterzubauen.

      Characterization Tests schützen das Bestehende, auch seine Fehler. Fällt mir einer auf, notiere ich ihn und behebe ihn in einem eigenen Schritt mit eigenem Test, nicht im selben Refactoring. Die Techniken stammen aus Michael Feathers' „Working Effectively with Legacy Code“.
    tags: [design, legacy, refactoring]
    level: 3

  # Testebenen: Integrationstests
  - id: repository-gegen-echte-db
    module: integrationstests
    q: Testest du ein Repository mit gemockter Datenbankverbindung oder gegen eine echte Datenbank?
    a: |
      Gegen eine echte Datenbank. Das Risiko eines Repositorys steckt im SQL, im Mapping und in den Constraints: Findet die Abfrage überlappende Reservierungen, greift der Unique-Index, kommen Zeitstempel mit Zeitzone zurück? Ein Mock der Verbindung prüft nur, dass ich einen String übergebe, den ich selbst hineingeschrieben habe.

      Konkret lege ich das Schema einmal pro Session an. Jeder Test läuft in einer Transaktion, die die Fixture am Ende zurückrollt. Testdaten entstehen über kleine Builder, mit genau den Feldern, auf die es ankommt. So bleiben die Tests isoliert und schnell, meist wenige Millisekunden je Test.

      Abgrenzung: Die Domänenlogik darüber teste ich nicht gegen die Datenbank, sondern mit einem Fake-Repository. Integrationstests sind schmal und prüfen genau eine Grenze, hier Code und Datenbank.
    tags: [integration, datenbank, entscheidung]
    level: 2
  - id: sqlite-statt-postgres
    module: integrationstests
    q: Produktion läuft auf PostgreSQL. Reichen Tests gegen SQLite?
    a: |
      Für einfaches SQL oft, als einzige Absicherung nicht. SQLite verhält sich in wichtigen Punkten anders. Spalten haben flexible Typen, eine `INTEGER`-Spalte nimmt auch einen String auf. Fremdschlüssel greifen erst nach `PRAGMA foreign_keys = ON`. Es gibt keinen Typ für Zeitstempel mit Zeitzone, keine Exclusion Constraints und ein anderes Sperrverhalten bei gleichzeitigen Schreibzugriffen. Genau dort liegen die Risiken eines Buchungsdienstes.

      Deshalb laufen die Repository-Tests gegen PostgreSQL in derselben Hauptversion wie in Produktion, lokal mit Testcontainers, in GitHub Actions als Service-Container. Den Start von ein paar Sekunden bezahle ich einmal pro Session.

      Für Domänentests brauche ich gar keine Datenbank. Und für Anwendungen, die wirklich SQLite einsetzen, ist SQLite im Test genau richtig.
    tags: [integration, datenbank, postgres]
    level: 2
  - id: integrationstests-isolation
    module: integrationstests
    q: Eure Integrationstests sind einzeln grün, zusammen oder mit `pytest -n auto` aber manchmal rot. Woran liegt das, und was tust du?
    a: |
      Fast immer an geteiltem Zustand. Tests schreiben in dieselbe Datenbank, verlassen sich auf Daten eines vorherigen Tests oder nutzen feste IDs und E-Mail-Adressen, die unter Parallelität kollidieren. Einzeln laufen sie, weil der Zustand dann zufällig passt.

      Zum Nachweis lasse ich die Suite mit `pytest-randomly` in zufälliger Reihenfolge laufen und notiere den Seed des roten Laufs; mit `--randomly-seed` wird er reproduzierbar. Die Lösung heißt Isolation. Jeder Test legt seine Daten selbst an und läuft in einer Transaktion mit Rollback, eindeutige Werte liefert ein Builder mit `uuid4`. Unter pytest-xdist bekommt jeder Worker eine eigene Datenbank, benannt nach der Fixture `worker_id`.

      Eine Session-Fixture für das Schema ist in Ordnung, weil sie nur gelesen wird. Veränderliche Daten gehören in Fixtures mit Scope `function`.
    tags: [integration, isolation, flaky]
    level: 2

  # Testebenen: API-Tests
  - id: status-401-403
    module: api-tests
    q: Wann antwortet eine API mit 401, wann mit 403 – und was bei der Reservierung einer anderen Kundin?
    a: |
      401 Unauthorized heißt: nicht authentifiziert, also kein oder ein ungültiges Token. Die Antwort trägt einen `WWW-Authenticate`-Header. 403 Forbidden heißt: Die API weiß, wer du bist, aber du darfst das nicht, etwa eine Kundin am Admin-Endpunkt.

      Bei fremden Ressourcen antworten viele APIs bewusst mit 404 statt 403. `GET /reservierungen/res-99` einer anderen Kundin liefert „nicht gefunden“, damit niemand durch Ausprobieren erfährt, welche IDs existieren. Welche Variante gilt, legt das Team fest, und der Test prüft genau sie.

      In die Tests jedes geschützten Endpunkts gehören alle drei Fälle: ohne Token, mit Token ohne Recht, mit Token für eine fremde Ressource. Der Zugriff auf fremde Objekte steht in der OWASP API Security Top 10 auf Platz 1 (Broken Object Level Authorization).
    tags: [api, http, sicherheit]
    level: 1
  - id: post-reservierungen-testen
    module: api-tests
    q: Wie würdest du `POST /reservierungen` testen, und was prüfst du auf welcher Schicht?
    a: |
      Ich prüfe jede Regel genau einmal, dort, wo sie wohnt.

      - **Domäne (Unit):** keine Überlappung bei halboffenen Intervallen `[start, ende)`, höchstens 7 Tage im Voraus, Ende nach Start. Viele Grenzfälle, parametrisiert, dazu eine Property für die Überlappung.
      - **Repository (Integration mit echter DB):** Die Abfrage findet Überschneidungen, ein Constraint verhindert Doppelbuchungen auch bei zwei gleichzeitigen Anfragen.
      - **HTTP (API-Test mit `TestClient`):** 201 mit `Location`-Header und Body-Form, 422 bei ungültigem Body, 401 ohne Token, 409 bei belegtem Rad, Fehler als Problem Details. Hier prüfe ich, dass Regeln auf Statuscodes abgebildet werden, nicht jede Regel noch einmal.
      - **Vertrag (Pact):** die Felder, die die Android-App wirklich liest.

      Einen E2E-Test bekommt nur der ganze Ablauf „Rad finden, reservieren, bezahlen“. Wer alle Überlappungsfälle über HTTP testet, bekommt langsame Tests, die bei Rot nicht sagen, ob die Regel oder ihre Abbildung kaputt ist.
    tags: [api, testebenen, entscheidung]
    level: 2
  - id: idempotency-key-testen
    module: api-tests
    q: Der Endpunkt, der eine Zahlung startet, unterstützt einen `Idempotency-Key`. Wie würdest du testen, dass er ihn richtig umsetzt?
    a: |
      Aus Sicht des Clients: Dieselbe Anfrage mit demselben Schlüssel zweimal gesendet führt zu genau einer Belastung, und die zweite Antwort entspricht der ersten – gleicher Status, gleiche Zahlungs-ID. Im API-Test zähle ich die Belastungen an einem Fake des Paystream-Adapters, der jede Belastung mitschreibt. Aufrufe zu prüfen ist hier richtig, weil der Aufruf das Ergebnis ist.

      Dann die Randfälle. Gleicher Schlüssel mit anderem Body muss einen Fehler liefern statt still die alte Antwort. Ein anderer Schlüssel startet eine neue Zahlung, und Schlüssel verschiedener Kundinnen dürfen sich nicht vermischen. Am kritischsten ist die Wiederholung, während die erste Anfrage noch läuft. Die teste ich am Dienst mit zwei gleichzeitigen Aufrufen gegen die echte Datenbank, weil nur ein Unique-Constraint oder eine Sperre das verlässlich verhindert.

      `PUT` und `DELETE` sind nach der HTTP-Semantik idempotent. Für `POST` ist der Schlüssel eine Vereinbarung, die die API selbst durchsetzen muss – deshalb braucht sie eigene Tests.
    tags: [api, idempotenz, zahlung]
    level: 3

  # Testebenen: Contract Testing
  - id: contract-statt-e2e
    module: contract-testing
    q: Warum Contract Tests statt E2E-Tests zwischen der Android-App und der Buchungs-API?
    a: |
      Weil E2E-Tests über Dienste nicht skalieren. Sie brauchen eine Umgebung, in der passende Versionen aller Beteiligten gleichzeitig laufen, mit Testdaten in allen Systemen. Sie sind langsam und flaky, und wenn sie rot werden, weiß niemand, welche Seite die Schnittstelle gebrochen hat. Jeder weitere Dienst macht es schlimmer.

      Ein Contract Test zerlegt die Frage in zwei schnelle, unabhängige Hälften. Die App beschreibt in ihrem Consumer-Test, welche Anfragen sie stellt und welche Felder sie liest; daraus entsteht der Vertrag. Die API spielt ihn in ihrer eigenen CI gegen den echten Dienst ab. Beide Seiten deployen getrennt, und `can-i-deploy` sagt vorher, ob die Versionen zusammenpassen.

      Abgrenzung: Contract Tests prüfen Form und Bedeutung der Schnittstelle, nicht die Geschäftslogik. Ob der Preis stimmt, gehört in die Unit-Tests des Providers; im Vertrag steht nur, dass `preis_cent` eine ganze Zahl ist.
    tags: [contract, microservices, entscheidung]
    level: 2
  - id: pact-ablauf
    module: contract-testing
    q: Beschreibe den Ablauf mit Pact von der App bis zum Deployment der API.
    a: |
      1. Der Consumer-Test der App läuft gegen einen Pact-Mock-Server und beschreibt jede Interaktion: Request, erwartete Antwort, nötiger Provider State wie „Rad r-17 ist frei“. Ergebnis ist eine Pact-Datei.
      2. Die CI der App veröffentlicht sie im Pact Broker, mit Version (Commit-SHA) und Branch.
      3. Ein Webhook stößt die Verifikation beim Provider an. Die API startet, ein State Handler legt die Testdaten an, Pact spielt jede Interaktion ab und vergleicht die Antworten mit den Matchern. Das Ergebnis geht an den Broker.
      4. Vor jedem Deployment fragen beide Seiten `pact-broker can-i-deploy --pacticipant … --version … --to-environment production`.
      5. Danach meldet `record-deployment`, welche Version wo läuft. Für die App nimmt man `record-release`, weil mehrere Versionen gleichzeitig in den Stores und auf Handys sind.

      Der Punkt, der in Gesprächen oft fehlt: Der Provider verifiziert neben dem neuesten Vertrag auch die Verträge der App-Versionen, die noch im Umlauf sind. Alte Apps bleiben monatelang installiert.
    tags: [contract, pact, ci]
    level: 2
  - id: feld-umbenennen
    module: contract-testing
    q: Das Backend will das Feld `preis` in `preis_cent` umbenennen. Wie gehst du vor, ohne die Android-App zu brechen?
    a: |
      In Schritten, die jeweils für sich kompatibel sind (Expand and Contract). Zuerst liefert die API beide Felder. Dann stellt die App auf `preis_cent` um, und ihr neuer Vertrag verlangt nur noch dieses Feld. Erst wenn keine App-Version im Umlauf mehr `preis` liest, entfernt die API das alte Feld.

      Contract Tests machen den letzten Schritt sicher. Der Broker kennt die Verträge aller veröffentlichten App-Versionen. Entferne ich `preis` zu früh, scheitert die Verifikation gegen eine alte Version, und `can-i-deploy` verweigert das Deployment. Ohne Verträge müsste ich raten oder Zugriffslogs auswerten.

      Abgrenzung: Additive Änderungen wie ein neues optionales Feld brechen niemanden, solange Clients als Tolerant Reader unbekannte Felder ignorieren. Umbenennen, Typwechsel oder ein neues Pflichtfeld im Request brauchen diesen Weg oder eine neue API-Version mit Deprecation-Frist.
    tags: [contract, kompatibilität, api]
    level: 3

  # Testebenen: Frontend-Tests
  - id: getbyrole-statt-testid
    module: frontend-tests
    q: "Warum `getByRole('button', { name: 'Reservieren' })` statt `getByTestId('reservieren-btn')`?"
    a: |
      Weil der Test die Seite so finden soll, wie Menschen sie finden. Rolle und Name sind das, was ein Screenreader ansagt und was Sehende als beschrifteten Button erkennen. Der Leitsatz von Testing Library lautet sinngemäß: Je mehr die Tests der Nutzung ähneln, desto mehr Vertrauen geben sie.

      Das bringt zwei Vorteile. Der Test bricht nicht, wenn sich Markup oder CSS-Klassen ändern, solange der Button gleich heißt. Und er prüft Barrierefreiheit mit: Wird aus dem Button ein `div` mit Klick-Handler, findet `getByRole` ihn nicht mehr – zu Recht, denn per Tastatur ist er dann auch nicht bedienbar.

      `getByTestId` ist der letzte Ausweg, etwa für einen Bereich ohne passende Rolle oder mit dynamischem Text. Die empfohlene Reihenfolge: Role, LabelText, PlaceholderText, Text, DisplayValue, dann AltText und Title, zuletzt TestId.
    tags: [frontend, testing-library, barrierefreiheit]
    level: 1
  - id: user-event-vs-fireevent
    module: frontend-tests
    q: Was unterscheidet `user-event` von `fireEvent`?
    a: |
      `fireEvent.click(button)` löst genau ein DOM-Ereignis aus. `await user.click(button)` spielt nach, was bei einem echten Klick passiert: Pointer-Ereignisse, `mousedown`, Fokuswechsel, `mouseup`, `click`. `user.type` tippt Zeichen für Zeichen mit `keydown`, `keypress`, `input` und `keyup` und beachtet dabei `disabled`, `maxlength` und den Fokus.

      Dadurch fallen Fehler auf, die `fireEvent` übersieht, etwa ein Element mit `pointer-events: none` oder ein Feld, das bei `keydown` validiert. Seit Version 14 erzeuge ich die Instanz mit `const user = userEvent.setup()` vor dem `render`, und jede Aktion ist `async`.

      Abgrenzung: `fireEvent` bleibt nützlich für Ereignisse, die `user-event` nicht abbildet, etwa `scroll`, oder wenn ich bewusst genau ein Ereignis prüfen will.
    tags: [frontend, testing-library]
    level: 2
  - id: msw-statt-fetch-mock
    module: frontend-tests
    q: Warum MSW, statt in Komponententests `fetch` zu mocken?
    a: |
      MSW fängt Anfragen auf Netzwerkebene ab und antwortet mit echten `Response`-Objekten. Die Komponente nutzt ihren normalen Datenweg – `fetch`, einen API-Client, eine Query-Bibliothek –, und der Test hängt nicht davon ab, welcher es ist. Ein `vi.fn()` für `fetch` kennt dagegen Aufrufform und Reihenfolge der Implementierung. Wechselt das Team den Client, brechen alle Tests, obwohl die Seite gleich funktioniert.

      Dazu kommt Wiederverwendung. Dieselben Handler laufen in Vitest über `setupServer` und im Browser über einen Service Worker, etwa für die lokale Entwicklung ohne Backend. Fehlerfälle stelle ich je Test mit `server.use(…)` ein, zum Beispiel ein 409 für ein belegtes Rad.

      Abgrenzung: MSW-Handler sind selbst eine Annahme über die API. Ob sie stimmt, sichert ein Contract Test oder ein aus dem OpenAPI-Schema erzeugter Typ, nicht der Komponententest.
    tags: [frontend, msw, test-doubles]
    level: 2
  - id: snapshot-tests-abwaegen
    module: frontend-tests
    q: Wann helfen Snapshot-Tests im Frontend, wann schaden sie?
    a: |
      Sie helfen bei kleinen, stabilen Ausgaben, deren genaue Form zählt und die sich schwer anders prüfen lassen: eine formatierte Preiszeile, eine serialisierte Konfiguration, eine Fehlermeldung. Inline-Snapshots mit `toMatchInlineSnapshot` stehen direkt im Test, sodass sie im Review gelesen werden.

      Sie schaden, wenn ganze Komponentenbäume als Snapshot landen. Jede Änderung an Markup oder Klassen macht sie rot, der Diff hat 200 Zeilen, und nach dem dritten Mal aktualisiert jemand mit `-u`, ohne hinzusehen. Dann prüft der Test nichts mehr und kostet trotzdem Zeit. Außerdem sagt ein Snapshot nicht, was er absichern soll.

      Für Verhalten nehme ich gezielte Assertions über Rollen und Texte, für das Aussehen visuelle Regressionstests im echten Browser, etwa `toHaveScreenshot` in Playwright – für wenige, stabile Seiten.
    tags: [frontend, snapshot, review]
    level: 2

  # Testebenen: E2E-Tests
  - id: e2e-journeys-auswaehlen
    module: e2e-tests
    q: Für die Radwerk-Website sollst du E2E-Tests planen. Welche schreibst du, welche bewusst nicht?
    a: |
      Wenige, entlang der Abläufe, die Geld oder Vertrauen kosten, wenn sie brechen: anmelden und ein Rad reservieren, Fahrt beenden und bezahlen, Gutschein im Bezahlschritt einlösen. Jede Journey zeigt, dass Frontend, Backend, Datenbank und Konfiguration zusammen funktionieren. Das zeigt kein anderer Test.

      Bewusst nicht als E2E: Validierungsregeln, Preisberechnung, alle Fehlermeldungen des Formulars, jede Kombination von Gutschein und Abo. Das prüfen Unit-, API- und Komponententests schneller und mit genauerem Fehlerort. Paystream binde ich über die Sandbox oder einen Fake-Dienst an, nie über echte Zahlungen.

      Die Zahl der Journeys hängt vom Produkt ab, die Begründung nicht. Für jede kann ich das Risiko nennen, das nur sie abdeckt. Kann ich das nicht, gehört der Fall eine Ebene tiefer.
    tags: [e2e, testebenen, entscheidung]
    level: 2
  - id: wait-for-timeout-review
    module: e2e-tests
    q: |
      Code-Review: Was stimmt hier nicht?

      ```ts
      await page.click('#reservieren');
      await page.waitForTimeout(3000);
      expect(await page.locator('.status').textContent()).toBe('Reserviert');
      ```
    a: |
      Die Pause rät, wie lange das Backend braucht. Auf einem schnellen Rechner verschenkt sie drei Sekunden pro Test, in einer ausgelasteten CI reichen sie manchmal nicht, und der Test wird flaky. Die Assertion prüft außerdem genau einmal: `textContent()` liest den aktuellen Wert, `toBe` wartet nicht.

      Besser mit Locators und einer web-first Assertion, die so lange erneut prüft, bis der Text da ist oder das Timeout abläuft:

      ```ts
      await page.getByRole('button', { name: 'Reservieren' }).click();
      await expect(page.getByRole('status')).toHaveText('Reserviert');
      ```

      Rolle und Name ersetzen dabei die CSS-Selektoren `#reservieren` und `.status`, die bei jedem Umbau des Markups brechen. Für `page.click(selector)` empfiehlt die Playwright-Doku ohnehin die Locator-Variante `locator.click()`.
    tags: [e2e, playwright, review, flaky]
    level: 1
  - id: e2e-login-storage-state
    module: e2e-tests
    q: Jeder E2E-Test meldet sich über das Login-Formular an. Was ist das Problem, und wie machst du es besser?
    a: |
      Es kostet in jedem Test Sekunden, prüft das Login hundertfach ohne neue Information und macht jeden Test von einem Formular abhängig, das mit seinem Zweck nichts zu tun hat. Ist das Login kaputt, ist die ganze Suite rot.

      In Playwright meldet sich ein Setup-Projekt einmal an und speichert Cookies und Local Storage mit `page.context().storageState({ path })`. Die übrigen Projekte hängen per `dependencies: ['setup']` davon ab und starten mit `use: { storageState: … }` bereits angemeldet – jeder Test trotzdem in einem eigenen, frischen Browserkontext. Für Tests, die Daten ändern, nutze ich je Worker eigene Testkonten.

      Testdaten lege ich genauso über die API an statt über die Oberfläche: Die Reservierung, die ein Test stornieren will, entsteht per `request.post(…)` in Millisekunden. Das Login-Formular selbst bekommt genau einen eigenen Test.
    tags: [e2e, playwright, testdaten]
    level: 2
  - id: e2e-nur-in-ci-rot
    module: e2e-tests
    q: Ein Playwright-Test ist in der CI ab und zu rot, lokal nie. Welche Werkzeuge von Playwright helfen dir, die Ursache zu finden?
    a: |
      Zuerst der Trace. Mit `trace: 'on-first-retry'` zeichnet Playwright beim ersten Wiederholungsversuch alles auf, mit `'retain-on-first-failure'` den ersten, gescheiterten Lauf selbst. Ich lade den Trace als Artefakt herunter und öffne ihn mit `npx playwright show-trace`. Dort sehe ich jede Aktion mit DOM-Schnappschuss davor und danach, die Netzwerkanfragen und die Konsole. Oft ist die Ursache dann sichtbar: eine langsame API-Antwort, ein Cookie-Banner, das nur in der CI erscheint, ein Test, der Daten eines anderen sieht.

      Lokal versuche ich, den Fehler zu provozieren: `--repeat-each=20`, mehr Worker als sonst, `CI=1` für die CI-Zweige der Konfiguration, gedrosselte CPU. Die üblichen Verdächtigen sind feste Pausen, Assertions ohne Warten, geteilte Testkonten unter Parallelität und Zeitabhängigkeiten.

      Der HTML-Bericht führt Tests, die erst im Retry grün werden, als „flaky“. Diese Liste ist mein Arbeitsvorrat, kein Grund, sich über den grünen Haken zu freuen.
    tags: [e2e, playwright, debugging, flaky]
    level: 2

  # Tests, die tragen: Property-based Testing
  - id: pbt-erklaeren
    module: property-based-testing
    q: Was ist Property-based Testing, und wie unterscheidet es sich von Tests mit Beispielen?
    a: |
      Ein Beispieltest sagt: 31 Minuten kosten 300 Cent. Ein Property-Test sagt: Für jede Dauer gilt eine Eigenschaft, etwa dass eine längere Fahrt nie weniger kostet als eine kürzere. Hypothesis erzeugt dafür Hunderte Eingaben, auch solche, an die ich nicht denke: 0, sehr große Zahlen, Zeitpunkte an der Zeitumstellung.

      Findet Hypothesis ein Gegenbeispiel, verkleinert es dieses schrittweise (Shrinking), bis der einfachste Fall übrig bleibt, und zeigt ihn im Fehlerbericht. Den Fall halte ich danach mit `@example(...)` dauerhaft fest.

      Abgrenzung: Properties ersetzen Beispiele nicht. Eine Property wie „Preis ≥ 0“ erfüllt auch eine Funktion, die immer 0 zurückgibt. Deshalb kombiniere ich wenige, gut gewählte Beispiele für die fachlichen Regeln mit Properties für den großen Eingaberaum.
    tags: [property-based, hypothesis]
    level: 1
  - id: properties-finden
    module: property-based-testing
    q: Wie würdest du die Radwerk-Reservierungen mit Properties testen? Welche Properties findest du?
    a: |
      Ich gehe die üblichen Muster durch und frage, welches passt.

      - **Symmetrie:** `ueberlappen(a, b) == ueberlappen(b, a)`.
      - **Invariante:** Nach beliebig vielen erfolgreichen Buchungen hat kein Rad zwei überlappende Reservierungen.
      - **Orakel:** Die schnelle Prüfung über sortierte Intervalle liefert dasselbe wie eine naive, die jedes Paar vergleicht.
      - **Metamorphe Relation:** Verschiebe ich beide Reservierungen um dieselbe Zeitspanne, ändert sich das Ergebnis nicht.
      - **Round Trip:** Eine Reservierung nach JSON und zurück ergibt dieselbe Reservierung.

      Den Fall `ende == start` des anderen Intervalls – halboffen, also keine Überlappung – nehme ich zusätzlich als `@example`, weil zufällige Zeitpunkte ihn selten genau treffen. Für Abläufe aus Buchen und Stornieren lohnt sich ein `RuleBasedStateMachine`: Er erzeugt zufällige Folgen von Aktionen und prüft nach jedem Schritt die Invariante.
    tags: [property-based, hypothesis, reservierung]
    level: 2
  - id: assume-oder-filter
    module: property-based-testing
    q: "`assume()` oder `.filter()` – und warum ist manchmal beides die falsche Wahl?"
    a: |
      Beide verwerfen ungültige Eingaben. `.filter(p)` sortiert beim Erzeugen aus, `assume(bedingung)` im Testkörper, wenn die Bedingung von mehreren Werten abhängt, etwa „Ende nach Start“. Hypothesis zählt die Verwerfungen. Werden es zu viele, schlägt der HealthCheck `filter_too_much` an, und in Wahrheit prüft der Test nur wenige Fälle.

      Besser ist oft, gültige Werte direkt zu konstruieren. Statt zwei Zeitpunkte zu ziehen und `assume(ende > start)` zu schreiben, ziehe ich Start und eine positive Dauer und rechne das Ende aus, mit `@st.composite` oder `st.builds`. Statt `st.text().filter(passt_zum_muster)` nehme ich `st.from_regex(r"RW-[A-Z0-9]{6}", fullmatch=True)`.

      Abgrenzung: Für seltene Ausschlüsse sind `filter` und `assume` in Ordnung, etwa „nicht genau Mitternacht“. Problematisch wird es, wenn die gültigen Werte nur einen kleinen Teil des erzeugten Raums ausmachen.
    tags: [property-based, hypothesis, strategien]
    level: 3
  - id: pbt-in-der-ci
    module: property-based-testing
    q: Kann Property-based Testing die CI flaky machen? Wie hältst du die Läufe reproduzierbar?
    a: |
      Ja, wenn jeder Lauf andere Zufallseingaben bekommt. Dann wird ein PR rot, der mit dem Tarif nichts zu tun hat, weil Hypothesis zufällig einen alten Fehler findet. Der Fehler ist echt, aber der Zeitpunkt falsch.

      Hypothesis bringt dafür das Profil `ci` mit. Es ist automatisch aktiv, wenn die Umgebungsvariable `CI` gesetzt ist, wie in GitHub Actions: `derandomize=True` (dieselben Beispiele bei jedem Lauf, solange Test und Version gleich bleiben), keine Deadline, keine Beispieldatenbank und `print_blob=True`. Mit dem ausgegebenen `@reproduce_failure` stelle ich einen Fehlschlag lokal nach. Gefundene Fehler halte ich zusätzlich mit `@example(...)` fest.

      Die zufällige Suche läuft trotzdem, nachts mit einem eigenen Profil, mehr Beispielen und ohne `derandomize`. Was dort auffällt, wird ein Ticket und ein `@example`, kein roter PR einer unbeteiligten Kollegin.
    tags: [property-based, hypothesis, ci, flaky]
    level: 3

  # Tests, die tragen: Debugging
  - id: roter-test-vorgehen
    module: tests-debuggen
    q: In deinem PR ist ein Test rot, den du nicht angefasst hast. Wie gehst du vor?
    a: |
      Erst lesen, dann denken, dann ändern. Ich lese die Meldung von oben: welcher Test, welche Zeile, welcher Diff. pytest zeigt bei `assert` die eingesetzten Werte, mit `-vv` den vollständigen Diff, mit `-l` die lokalen Variablen.

      Dann reproduziere ich lokal, so eng wie möglich: genau dieser Test über seine Node-ID, etwa `pytest "tests/test_tarif.py::test_preis[31-300]"`, danach die zuletzt roten mit `--lf -x`. Ist er lokal grün, wird die Umgebung meine erste Hypothese.

      Ich stelle Hypothesen auf und prüfe sie einzeln: Ist der Test falsch, der Code oder die Umgebung? Mein Diff zeigt, ob ich Code berührt habe, den der Test indirekt nutzt. Geändert wird erst, wenn ich die Ursache erklären kann – und nie der Test, nur damit er grün wird.
    tags: [debugging, pytest]
    level: 1
  - id: nur-in-der-ci-rot
    module: tests-debuggen
    q: Ein Test ist lokal grün, in der CI rot. Welche Ursachen prüfst du?
    a: |
      Ich suche den Unterschied zwischen den Umgebungen und stelle ihn lokal nach.

      - **Zeitzone:** CI-Runner laufen meist in UTC. `TZ=UTC pytest` zeigt, ob ein Test deutsche Zeit annimmt.
      - **Locale:** Zahlen- und Datumsformate, Sortierung; lokal mit `LC_ALL=C.UTF-8` nachstellen.
      - **Reihenfolge und geteilter Zustand:** In der CI laufen mehr Tests zusammen. Den Seed von `pytest-randomly` finde ich im Log.
      - **Parallelität:** `-n auto` mit mehr Workern als lokal.
      - **Versionen:** Lockfile nicht genutzt, andere Python-Version in der Matrix.
      - **Umgebung:** ein Secret, das lokal in `.env` steht; Groß- und Kleinschreibung von Dateinamen auf Linux.
      - **Last:** langsamere Maschine, zu knappe Timeouts.

      Oft grenzt die Fehlermeldung das schon ein. Hilft das nicht, lasse ich den CI-Job Umgebung und Paketversionen ausgeben und vergleiche sie mit meinen.
    tags: [debugging, ci]
    level: 2
  - id: git-bisect-run
    module: tests-debuggen
    q: Ein Test ist rot, vor drei Wochen war er grün, dazwischen liegen 120 Commits. Wie findest du den Commit, der ihn gebrochen hat?
    a: |
      Mit `git bisect run`. Ich markiere den aktuellen Stand als schlecht und einen Tag von vor drei Wochen als gut, und Git halbiert den Bereich in jedem Schritt. Bei 120 Commits sind das etwa sieben Läufe.

      ```bash
      git bisect start HEAD v2.4.0
      git bisect run uv run pytest -x -q tests/test_tarif.py::test_tageshoechstpreis
      git bisect reset
      ```

      `git bisect run` wertet den Exit-Code aus: 0 heißt gut, 1 bis 127 außer 125 schlecht, 125 überspringen – etwa für Commits, die nicht bauen –, ab 128 bricht Bisect ab. pytest endet auch bei Sammelfehlern oder ohne gefundenen Test mit einem Code von 2 bis 5. Das wäre für Bisect „schlecht“, deshalb bilde ich diese Codes in einem kleinen Skript auf 125 ab. Wichtig ist ein Test, der nur das gesuchte Problem prüft. Ist er flaky, findet Bisect einen zufälligen Commit.

      Gibt es den Test in den alten Commits noch nicht, lege ich ihn als Datei außerhalb des Repositorys ab und rufe ihn mit absolutem Pfad auf.
    tags: [debugging, git]
    level: 2

  # Tests, die tragen: Flaky Tests
  - id: ci-zehn-prozent-rot
    module: flaky-tests
    q: Die CI ist seit zwei Wochen zu 10 % rot, ein Neustart hilft meistens. Was tust du?
    a: |
      Ich behandle das als Vorfall, nicht als Wetter. Jeder unnötige Neustart kostet Zeit, und schlimmer: Das Team lernt, Rot zu ignorieren, bis ein echter Fehler im Rauschen untergeht.

      1. **Daten statt Gefühl:** JUnit-XML der letzten Läufe auswerten. Welche Tests scheitern, wie oft, auf welchem Commit grün und rot zugleich? Meist sind es wenige.
      2. **Zeitpunkt eingrenzen:** Was hat sich vor zwei Wochen geändert – neue Tests, Parallelisierung, eine Abhängigkeit, ein anderes Runner-Image?
      3. **Sofort entlasten:** Die auffälligsten Tests gehen mit Ticket, verantwortlicher Person und Frist in Quarantäne. Sie laufen weiter, blockieren aber nicht.
      4. **Ursachen beheben:** reproduzieren mit `--count`, `--randomly-seed` und `-n`, dann die typischen Muster prüfen – Uhr, Reihenfolge, geteilte Daten, Netzwerk, feste Wartezeiten.
      5. **Vorbeugen:** Flake-Rate je Test sichtbar machen, neue Tests vor dem Merge mehrfach laufen lassen, die Quarantäne-Liste in jeder Retro ansehen.

      Am Ende steht eine Zahl: der Anteil der PR-Läufe, die ohne Neustart grün werden. Die sollte wieder nahe 100 % liegen.
    tags: [flaky, ci, vorgehen]
    level: 3
  - id: flaky-ursachen
    module: flaky-tests
    q: Nenne die häufigsten Ursachen für Flaky Tests und je eine Gegenmaßnahme.
    a: |
      - **Zeit:** `now()`, Mitternacht, Monatsende, Sommerzeit. Uhr injizieren, Grenzzeitpunkte gezielt testen.
      - **Reihenfolge und geteilter Zustand:** Tests verlassen sich auf Daten oder Globals anderer Tests. Frische Fixtures, Rollback je Test, `pytest-randomly` zum Aufdecken.
      - **Asynchronität:** Der Test prüft, bevor Oberfläche oder Worker fertig sind. Auf Zustände warten – `findBy…`, web-first Assertions –, nie feste Pausen.
      - **Zufall ohne Seed:** Seed als Parameter, Hypothesis mit festen Beispielen in der CI.
      - **Netzwerk und externe Dienste:** Fakes oder MSW im PR-Lauf, echte Dienste nur in eigenen, nicht blockierenden Suites.
      - **Ressourcen:** feste Ports, gemeinsame Dateien, dieselben Testkonten unter Parallelität. Port `0`, `tmp_path`, eindeutige Testdaten.
      - **Reihenfolge in Mengen, Gleitkomma:** sortieren, `pytest.approx`, Geld als `int` in Cent.

      Abgrenzung: Manchmal ist nicht der Test flaky, sondern der Code – eine echte Race Condition. Bevor ich einen Test „stabilisiere“, prüfe ich, ob er einen Fehler zeigt, den Nutzer auch erleben.
    tags: [flaky, ursachen]
    level: 2
  - id: retries-als-pflaster
    module: flaky-tests
    q: Sollte man fehlgeschlagene Tests in der CI automatisch wiederholen?
    a: |
      Sichtbar und begrenzt ja, stillschweigend nein. Für E2E-Tests im echten Browser sind ein oder zwei Retries in der CI üblich. Playwright meldet einen Test, der erst beim Wiederholen grün wird, ausdrücklich als „flaky“, und mit `trace: 'on-first-retry'` gibt es genau dann einen Trace. Diese Information muss jemand auswerten.

      Unit- und Integrationstests wiederhole ich nicht automatisch. Ist dort ein Test flaky, hat das fast immer eine behebbare Ursache – Zeit, Zufall, Reihenfolge –, und ein Retry versteckt sie. `pytest-rerunfailures` setze ich höchstens gezielt mit `--only-rerun` für bekannte Infrastrukturfehler ein und messe dabei mit.

      Retries können echte Fehler verdecken. Eine Race Condition, die jeden zehnten Lauf trifft, trifft auch jede zehnte Nutzerin. Deshalb zählt die Flake-Rate als Kennzahl, nicht nur das Endergebnis.
    tags: [flaky, ci, retries]
    level: 2
  - id: mitternachts-test-review
    module: flaky-tests
    q: |
      Code-Review: Dieser Test ist in der CI im Sommer jeden Abend zwischen 22 und 24 Uhr UTC rot. Warum, und wie reparierst du ihn?

      ```python
      def test_gutschein_heute_noch_gueltig():
          gutschein = Gutschein("RW-AB12CD", gueltig_bis=date.today())
          assert gutschein.ist_gueltig()
      ```
    a: |
      Zwei Uhren widersprechen sich. Der Test nimmt mit `date.today()` das Datum der Maschine, und der CI-Runner läuft in UTC. `ist_gueltig()` bestimmt „heute“ korrekt in `Europe/Berlin`. Zwischen 22 und 24 Uhr UTC ist in Berlin im Sommer schon der nächste Tag, also gilt der Gutschein dort als abgelaufen.

      Die Reparatur macht den Zeitpunkt zum Parameter, und der Test wählt ihn selbst – genau an der Grenze, die vorher nur zufällig getroffen wurde:

      ```python
      BERLIN = ZoneInfo("Europe/Berlin")

      def test_gutschein_gilt_bis_einschliesslich_ablauftag():
          gutschein = Gutschein("RW-AB12CD", gueltig_bis=date(2026, 7, 31))
          assert gutschein.ist_gueltig(jetzt=datetime(2026, 7, 31, 23, 59, tzinfo=BERLIN))
          assert not gutschein.ist_gueltig(jetzt=datetime(2026, 8, 1, 0, 0, tzinfo=BERLIN))
      ```

      `TZ=Europe/Berlin` in der CI zu setzen oder den Test nachts zu überspringen, verschiebt das Problem nur. Der Test hinge weiter von Uhrzeit und Maschine ab.
    tags: [flaky, zeit, review]
    level: 2

  # Tests, die tragen: Regressionsstrategien
  - id: bug-zuerst-test
    module: regression-strategien
    q: Eine Kundin mit „Radwerk Plus“ hat für eine 25-Minuten-Fahrt 150 Cent bezahlt. Was tust du zuerst, und auf welcher Ebene schreibst du den Test?
    a: |
      Erst einen Test, der den Fehler zeigt, dann die Reparatur. Der Test muss aus dem gemeldeten Grund rot sein. So weiß ich, dass ich die Ursache gefunden habe, und er bleibt danach als Regressionstest in der Suite.

      Die Ebene folgt der Ursache, nicht dem Ort der Meldung. Ich prüfe zuerst die Preisfunktion: 25 Minuten mit Abo müssen 0 Cent ergeben, weil die ersten 30 Minuten kostenlos sind. Ist dieser Unit-Test grün, liegt der Fehler davor, beim Ermitteln des Abostatus oder beim Weiterreichen an die Preisfunktion. Dann gehört der Test an genau diese Stelle, meist als Integrationstest des Dienstes mit einer Kundin, deren Abo in der Datenbank aktiv ist.

      Danach frage ich, warum die vorhandenen Tests das nicht gefunden haben, und ergänze die ganze Klasse von Fällen, nicht nur diesen einen – etwa alle Wege, auf denen der Abostatus in die Preisberechnung gelangt.
    tags: [regression, bugfix, entscheidung]
    level: 1
  - id: coverage-als-ziel
    module: regression-strategien
    q: Die Teamleitung will 90 % Coverage als Pflicht in der CI. Was hältst du davon?
    a: |
      Coverage ist ein gutes Werkzeug, um ungetestete Stellen zu finden, und ein schlechtes Ziel. Sie misst, welche Zeilen während der Tests liefen, nicht, ob ein Test das Ergebnis geprüft hat. Ein Test ohne `assert` erzeugt Coverage. Wird die Zahl zur Pflicht, entstehen genau solche Tests, und die Zahl steigt, ohne dass die Qualität steigt (Goodharts Gesetz).

      Mein Gegenvorschlag: Branch Coverage statt Line Coverage, weil ein `if` ohne `else` sonst als vollständig gilt. Statt einer globalen Schwelle Diff Coverage für neuen Code, damit der Altbestand nicht bestraft wird und niemand für eine Zahl Getter testet. Lücken im Review ansehen: Fehlt dort ein Test für einen wichtigen Fall? Für die kritischen Module – Preise, Zahlung – zusätzlich Mutation Testing, das zeigt, ob die Tests Fehler bemerken.

      Eine Untergrenze gegen Verfall ist in Ordnung, etwa „die Coverage sinkt nicht“. Gefährlich wird eine hohe Zielzahl, an der Menschen gemessen werden.
    tags: [coverage, metriken, regression]
    level: 2
  - id: mutation-testing-erklaeren
    module: regression-strategien
    q: Was ist Mutation Testing, und wann lohnt es sich?
    a: |
      Ein Werkzeug wie mutmut verändert den Code in vielen kleinen Schritten – `<=` wird `<`, `+ 1` wird `- 1`, ein Rückgabewert wird ein anderer – und führt für jede Variante die Tests aus. Wird ein Test rot, ist der Mutant getötet. Bleiben alle grün, hat er überlebt: Kein Test bemerkt diese Änderung. Der Mutationsscore ist der Anteil getöteter Mutanten.

      Am Radwerk-Tarif zeigt sich schnell, was Coverage verschweigt. Zwei Tests mit 3 und 45 Minuten erreichen 100 % Line und Branch Coverage der Funktion, lassen aber den Mutanten `minuten < 5` statt `minuten <= 5` überleben, weil niemand genau 5 Minuten prüft. Der überlebende Mutant nennt mir den fehlenden Grenzwerttest.

      Mutation Testing ist teuer, jeder Mutant kostet einen Testlauf. Ich setze es gezielt ein: auf Kernmodulen mit viel Logik, nachts oder nur für geänderte Dateien. Manche Mutanten sind äquivalent, ändern also das Verhalten gar nicht. Die markiere ich, statt ihnen nachzujagen.
    tags: [mutation-testing, metriken, regression]
    level: 3
  - id: netze-nach-dem-release
    module: regression-strategien
    q: Welche Sicherheitsnetze gibt es nach dem Release, und ersetzen sie Tests?
    a: |
      - **Smoke Tests** direkt nach dem Deployment: Health-Endpoint, Startseite, eine Anmeldung mit einem Testkonto. Rot heißt zurückrollen.
      - **Canary Release:** Die neue Version bekommt erst einen kleinen Teil des Verkehrs, etwa 5 %. Fehlerrate und Antwortzeiten werden mit der alten verglichen, bevor alle sie bekommen.
      - **Feature Flags:** Neues Verhalten ist deployt, aber aus. Es wird erst für Testkonten, dann für Teile der Nutzer eingeschaltet und lässt sich ohne Deployment wieder abschalten.
      - **Monitoring und Alarme** auf fachliche Kennzahlen, nicht nur auf CPU: Anteil fehlgeschlagener Zahlungen, Reservierungen pro Minute.

      Sie ersetzen Tests nicht. Sie fangen, was Tests vor dem Release nicht sehen können: echte Daten, echte Last, die Konfiguration der Produktion. Jeder Fehler, der so auffällt, endet in der Post-mortem-Frage, welcher Test ihn früher gefunden hätte – und dieser Test wird geschrieben.
    tags: [regression, release, monitoring]
    level: 2

  # Qualität im Team: Statische Analyse
  - id: typen-statt-tests
    module: statische-analyse
    q: Ersetzen statische Typen Tests?
    a: |
      Zum Teil. Typen zeigen für alle Eingaben auf einmal, was Tests nur für Beispiele zeigen: dass `mietpreis` nie mit `None` aufgerufen wird, dass jeder Fall von `Literal["city", "ebike"]` behandelt ist (mit `assert_never`), dass ein umbenanntes Feld überall angepasst wurde. Tests, die nur so etwas prüfen – „wirft `TypeError` bei einem String“ –, kann ich mit `mypy --strict` streichen.

      Falsche Werte desselben Typs sehen Typen nicht. `int` sagt nicht, ob es Cent oder Euro sind, ob 5 Minuten noch kostenlos sind oder ob aufgerundet wird. Dafür bleiben Tests nötig. Ein Stück weiter helfen eigene Typen wie `Cent = NewType("Cent", int)`, damit Euro und Cent nicht verwechselt werden.

      Abgrenzung: An Systemgrenzen – JSON aus der App, Webhooks von Paystream – sind Annotationen nur Behauptungen. Dort brauche ich Validierung zur Laufzeit, etwa mit Pydantic, und Tests mit kaputten Eingaben.
    tags: [statische-analyse, typen]
    level: 2
  - id: linter-im-altcode
    module: statische-analyse
    q: Du willst Ruff und mypy in ein Projekt mit 80 000 Zeilen Altcode einführen. Der erste Lauf meldet 4 000 Probleme. Wie gehst du vor?
    a: |
      Weder alles auf einmal reparieren noch alles abschalten. Ich ziehe eine Grenze, die sich nur noch verschärft: Neuer Code muss sauber sein, Altcode darf nicht schlechter werden.

      Für Ruff zeigt `ruff check --statistics`, welche Regeln die meisten Treffer haben. Sichere Autofixes mit `--fix` kommen in einen eigenen PR, der nur das enthält. Den Rest markiere ich mit `ruff check --add-noqa` als Baseline und begründe das im PR; neue Verstöße schlagen in der CI sofort an. Wer eine Datei anfasst, räumt dort auf.

      Für mypy gilt zuerst `strict` für neue und kritische Pakete wie `radwerk.tarif`. Altmodule nehme ich über `[[tool.mypy.overrides]]` aus und Modul für Modul auf. Die Liste der Ausnahmen darf nur schrumpfen; das prüft die CI.

      Für Ausnahmen gilt: `# noqa` und `# type: ignore` nur mit Regelcode und Grund. Ein nacktes `# type: ignore` verschluckt auch künftige Fehler in dieser Zeile.
    tags: [statische-analyse, legacy, ruff, mypy]
    level: 2
  - id: sast-grenzen
    module: statische-analyse
    q: Was findet SAST, was nicht, und wie gehst du mit Fehlalarmen um?
    a: |
      SAST-Werkzeuge wie Semgrep, CodeQL, Bandit oder Ruffs `S`-Regeln suchen im Quellcode nach bekannten Mustern: SQL aus Strings zusammengesetzt, `subprocess` mit `shell=True`, `pickle` auf fremden Daten, hart codierte Schlüssel, `random` für Tokens. Sie laufen schnell bei jedem PR und finden Fehler, bevor jemand den Code ausführt.

      Logikfehler finden sie nicht. Dass eine Kundin die Reservierung einer anderen stornieren kann, ist korrekt geschriebener Code mit falscher Regel. Das zeigen nur Tests, für jeden Endpunkt ein Fall mit fremder Ressource. Bekannte Lücken in Abhängigkeiten finden wiederum pip-audit, `npm audit` oder Dependabot.

      Fehlalarme unterdrücke ich einzeln, mit Regelcode und Begründung im Code, etwa `# noqa: S311  # Zufall nur für Testdaten`. Eine Regel pauschal abzuschalten, bespreche ich mit dem Team.
    tags: [statische-analyse, sicherheit]
    level: 2

  # Qualität im Team: CI
  - id: pipeline-aufbauen
    module: ci-pipelines
    q: Wie würdest du die CI-Pipeline für den Radwerk-Buchungsdienst aufbauen?
    a: |
      Ziel ist ein schnelles, verlässliches Signal für jeden PR, möglichst in unter zehn Minuten. Ich ordne die Prüfungen nach Kosten und lasse unabhängige Jobs parallel laufen.

      1. **Statisch, unter einer Minute:** `ruff format --check`, `ruff check`, `mypy`. Scheitert das, ist die Ursache sofort klar.
      2. **Unit- und Property-Tests** mit `pytest -n auto`, wenige Minuten; Hypothesis nutzt in der CI das Profil `ci`.
      3. **Integration und API** gegen PostgreSQL als Service-Container mit Health-Check.
      4. **Contract:** Verifikation der Pact-Verträge der App, Ergebnis an den Broker.
      5. **E2E:** die wenigen Journeys in Chromium, auf Shards verteilt. Nur dieser teure Job wartet per `needs` auf die billigen.

      Jeder Job hat ein Timeout und lädt JUnit-XML, Coverage und Traces mit `if: ${{ !cancelled() }}` hoch, also gerade dann, wenn er rot ist. `concurrency` bricht überholte PR-Läufe ab. Pflicht ist ein einziger Gate-Job mit `if: always()`, der die Ergebnisse aller Jobs prüft; gemergt wird über die Merge Queue. Nachts laufen die breiten Dinge: Firefox und WebKit, Hypothesis mit vielen Beispielen, Mutation Testing, pip-audit.

      Abgrenzung: „Fail fast“ heißt für mich, dass der billigste Job zuerst antwortet, nicht, dass alles nacheinander läuft. Wartet die Testphase auf das Linting, wird jeder PR um genau diese Zeit langsamer.
    tags: [ci, pipeline, entscheidung]
    level: 2
  - id: ci-zu-langsam
    module: ci-pipelines
    q: Die CI braucht 35 Minuten, das Team klagt. Was tust du?
    a: |
      Erst messen, wo die Zeit bleibt: Welcher Job liegt auf dem kritischen Pfad, wie lange dauert er im Median und an schlechten Tagen, wie oft wird neu gestartet? Die langsamsten Tests zeigt `pytest --durations=20`. Meist sind es wenige Ursachen.

      Was dann meistens hilft, grob nach Aufwand sortiert:

      - **Überholte Läufe abbrechen:** `concurrency` mit `cancel-in-progress` für PR-Läufe.
      - **Caching** der Abhängigkeiten (`setup-uv`, `setup-node` mit `cache: npm`). Die Playwright-Browser zu cachen bringt laut Playwright-Doku kaum etwas.
      - **Parallelisieren:** unabhängige Jobs ohne `needs`, `pytest -n auto`, E2E-Shards über eine Matrix, verteilt nach gemessener Dauer statt nach Anzahl.
      - **Langsame Tests umbauen:** ein `sleep` im Test, eine frische Datenbank pro Test statt Rollback, ein E2E-Test für eine Regel, die ein Unit-Test zeigen kann.
      - **Breite Suiten nachts:** weitere Browser, Mutation Testing, lange Property-Läufe.
      - **Pfadfilter auf Job-Ebene:** etwa Frontend-Jobs nur bei Änderungen unter `frontend/`. Auf Workflow-Ebene bliebe ein Pflicht-Check auf „Pending“ hängen.
      - **Flaky Tests reparieren:** Jeder Re-run kostet die volle Laufzeit noch einmal.

      Tests zu löschen oder Pflicht-Checks zu streichen, nur damit es schneller geht, kauft Geschwindigkeit mit Vertrauen. Ein gutes Ziel für den PR-Lauf sind zehn Minuten.
    tags: [ci, performance]
    level: 2
  - id: pull-request-target
    module: ci-pipelines
    q: Warum ist `pull_request_target` gefährlich, wenn der Workflow den Code des Pull Requests auscheckt?
    a: |
      `pull_request_target` läuft im Kontext des Basis-Repositorys, nicht des Forks. Der Workflow hat deshalb Zugriff auf Secrets und ein `GITHUB_TOKEN` mit Schreibrechten, auch bei PRs aus fremden Forks. Das ist gewollt, etwa um Labels zu setzen oder Kommentare zu schreiben.

      Checkt derselbe Workflow den Code des PRs aus und führt ihn aus – `npm install` mit Install-Skripten, `pytest` mit einer manipulierten `conftest.py` –, läuft fremder Code mit diesen Rechten. Ein Angreifer liest Secrets aus oder pusht ins Repository. GitHub Security Lab nennt das „pwn request“. `actions/checkout` v7 verweigert diesen Checkout deshalb, solange niemand `allow-unsafe-pr-checkout: true` setzt.

      Sicher ist: Tests fremder PRs laufen mit `pull_request`, ohne Secrets. Braucht ein Folgeschritt Rechte, etwa für einen Kommentar mit Testergebnissen, holt ein getrennter Workflow über `workflow_run` nur die Artefakte und führt keinen PR-Code aus. Dazu `permissions` so knapp wie möglich setzen.
    tags: [ci, sicherheit, github-actions]
    level: 3

  # Qualität im Team: Teststrategie
  - id: gutscheine-testen
    module: teststrategie
    q: Wie würdest du das Feature „Gutscheincodes im Buchungsprozess“ testen?
    a: |
      Ich beginne bei den Regeln, nicht bei den Werkzeugen: Code `RW-` plus sechs Großbuchstaben oder Ziffern, einmal pro Kunde, gültig bis einschließlich Ablaufdatum, Rabatt in Prozent oder als fester Betrag, der Preis fällt nie unter 0. Mit Product Owner und Team mache ich daraus konkrete Beispiele. Dabei fallen Fragen auf wie die Zeitzone des Ablaufdatums, die Rundung beim Prozentrabatt und eine Buchung, die durch den Gutschein 0 Cent kostet. Dann bewerte ich die Risiken nach Wahrscheinlichkeit und Auswirkung. Oben stehen falsche Preise, doppelt eingelöste Codes, erratene Codes und eine App, die die neue Antwort nicht versteht.

      Jedes Risiko kommt auf die niedrigste Ebene, die es zuverlässig zeigt:

      - **Unit:** Format, Ablauf an der Tagesgrenze in `Europe/Berlin`, Rabatt mit Grenzwerten (Betrag größer als der Preis, 100 %, Abrundung), dazu die Property „Endpreis zwischen 0 und Ausgangspreis“. Bei 0 Cent autorisiert der Buchungsdienst keine Zahlung, geprüft mit einem Fake-Zahlungsadapter.
      - **Integration gegen PostgreSQL:** „einmal pro Kunde“ bei zwei gleichzeitigen Einlösungen; das verhindert zuverlässig erst ein Constraint in der Datenbank.
      - **API:** Statuscode und Problem Details je Ablehnungsgrund, 429 nach zu vielen Fehlversuchen.
      - **Contract:** die Felder und Fehlertypen, die die Android-App liest.
      - **E2E:** ein Durchstich – Code eingeben, buchen, Bestätigung sehen.

      Dazu kommen ein Lasttest vor der Kampagne und eine explorative Session mit Charter. Ablehnungsgründe und Rabattkombinationen lasse ich im Browser bewusst weg: Dort kostet jeder Fall Sekunden, und ein roter Test sagt nicht, wo der Fehler liegt.
    tags: [teststrategie, entscheidung, gutschein]
    level: 3
  - id: strategie-verteidigen
    module: teststrategie
    q: "Im Interview kommt der Einwand: „Warum keine E2E-Tests für die Gutscheinregeln? Nur die zeigen doch, dass es für die Nutzer funktioniert.“ Was antwortest du?"
    a: |
      Ich stimme dem Ziel zu und erkläre die Abwägung. Eine E2E-Journey mit Gutschein gibt es: Sie zeigt, dass Oberfläche, API, Datenbank und Zahlung zusammenspielen. Regeln prüfen kann sie schlecht. Die Gutscheinregeln haben gut zwanzig relevante Fälle. Als E2E-Tests wären das zwanzig Browser-Läufe von je mehreren Sekunden, abhängig von Testdaten, anfälliger für Flakiness, und ein roter Test sagt nicht, ob Formatprüfung, Rabatt oder Datenbank kaputt ist.

      Als Unit-Tests laufen dieselben Fälle in Millisekunden, jeder rote Test zeigt auf genau eine Regel, und ich kann mir Grenzfälle leisten, die ich im Browser weglassen würde. Dass die Regeln an der Oberfläche ankommen, zeigen der API-Test und die eine Journey.

      Dann sage ich, woran ich merken würde, dass die Strategie nicht trägt: Escaped Defects im Gutscheinbereich, Flake-Rate, Laufzeit der Pipeline. Taucht ein Fehler auf, den nur ein E2E-Test gefunden hätte, ergänze ich dort einen Fall. Die Regel dahinter: jedes Risiko auf der niedrigsten Ebene, die es verlässlich zeigt.
    tags: [teststrategie, entscheidung, interview]
    level: 3
  - id: kennzahlen-fuer-tests
    module: teststrategie
    q: An welchen Kennzahlen erkennst du, ob die Tests eines Teams etwas taugen?
    a: |
      An Wirkungen, nicht an Mengen.

      - **Escaped Defects:** Fehler, die erst in Produktion auffallen, mit Schwere. Zu jedem frage ich, auf welcher Ebene ihn ein Test gefunden hätte.
      - **Change Failure Rate:** Anteil der Deployments, die einen Rollback oder Hotfix brauchen, eine der DORA-Kennzahlen.
      - **Laufzeit der PR-Pipeline:** Ist sie zu lang, umgehen Menschen sie.
      - **Flake-Rate:** Wie oft wird ein Lauf ohne Codeänderung beim Neustart grün?
      - **Mutationsscore** für Kernmodule, wenn er gemessen wird.

      Coverage nutze ich als Suchwerkzeug für Lücken, nicht als Ziel. Keine dieser Zahlen taugt als Vorgabe für Einzelne; sie zeigen dem Team, wo es nachbessern sollte.
    tags: [teststrategie, metriken]
    level: 2
  - id: tests-im-review
    module: teststrategie
    q: Worauf achtest du, wenn du in einem Pull Request die Tests reviewst?
    a: |
      Ich lese die Tests vor dem Code. Verstehe ich aus ihnen nicht, was die Änderung tun soll, fehlt etwas. Dann gehe ich diese Fragen durch:

      - **Prüft der Test das Risiko der Änderung?** Würde er rot, wenn ich die entscheidende Zeile kaputt mache? Sind die Grenzwerte dabei?
      - **Richtige Ebene?** Eine Regel im E2E-Test oder ein SQL-Problem mit gemockter Datenbank sind beide ein Hinweis.
      - **Verhalten statt Implementierung:** öffentliche Schnittstelle, keine privaten Methoden, Mocks nur an Systemgrenzen.
      - **Lesbarkeit:** Der Name beschreibt die Regel, AAA ist erkennbar, im Test stehen nur relevante Testdaten.
      - **Determinismus:** keine echte Uhr, kein Zufall ohne Seed, keine festen Pausen, keine Abhängigkeit von anderen Tests.
      - **Fehlerfälle:** nicht nur der glückliche Pfad.

      Bei einem Bugfix frage ich nach dem Test, der vorher rot war. Fehlt er, ist nicht belegt, dass der Fix den gemeldeten Fehler behebt.
    tags: [teststrategie, review]
    level: 2

  # Praxis ohne Modulbezug
  - id: team-ohne-tests
    q: Du kommst in ein Team, das kaum Tests schreibt. Wie überzeugst du es?
    a: |
      Nicht mit einem Vortrag über die Testpyramide, sondern an einem konkreten Problem des Teams. Ich frage, was zuletzt wehgetan hat: ein Hotfix am Freitagabend, ein Modul, das niemand anfassen will, eine Regel, die dreimal kaputtging. Für genau diese Stelle schreibe ich Tests, zeige im nächsten PR, welchen Fehler sie gefangen haben, und halte die Suite schnell, damit niemand sie umgehen will.

      Dann mache ich es leicht: ein Testgerüst mit Fixtures und Buildern, ein Befehl, der in Sekunden läuft, eine CI, die jeden PR prüft. Im Review frage ich freundlich nach Tests für Bugfixes und schreibe beim Pairing selbst welche. Regeln wie eine Coverage-Schwelle kommen, wenn überhaupt, später.

      Altcode muss nicht nachträglich durchgetestet werden. „Was du anfasst, sicherst du ab“ reicht, damit die riskanten Stellen mit der Zeit abgedeckt sind.
    tags: [praxis, team]
    level: 2
  - id: deadline-ohne-tests
    q: Der Product Owner will das Feature morgen live haben, die Tests könne man nachreichen. Was sagst du?
    a: |
      Ich mache die Abwägung sichtbar, statt Nein zu sagen. Welche Risiken hat das Feature? Mit einer neuen Sortierung der Stationsliste, wenigen Tests und einem Feature Flag kann ich gut leben. Bei Gutscheinlogik, die Preise ändert, nicht: Ein Fehler dort kostet Geld und Vertrauen und lässt sich nicht still zurückdrehen, weil Buchungen schon bezahlt sind.

      Dann schlage ich vor, was in der Zeit geht: Unit-Tests für die Preisregeln, die mich ohnehin schneller machen als Ausprobieren, ein API-Test für den Bezahlschritt, das Feature hinter einem Flag zuerst nur für Testkonten. Was dann noch fehlt, kommt als Ticket mit Datum in den nächsten Sprint, nicht auf „später“.

      Nachgereichte Tests sind meiner Erfahrung nach die, die nie geschrieben werden. Das sage ich auch so, freundlich und mit einem Beispiel.
    tags: [praxis, kommunikation]
    level: 2
