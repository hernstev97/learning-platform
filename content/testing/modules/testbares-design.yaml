    solution: |
      from datetime import datetime, time, timedelta
      from typing import Protocol
      from zoneinfo import ZoneInfo

      BERLIN = ZoneInfo("Europe/Berlin")


      # --- Kern: rein, ohne Uhr und ohne I/O ---

      def morgen(jetzt: datetime) -> tuple[datetime, datetime]:
          tag = jetzt.astimezone(BERLIN).date() + timedelta(days=1)
          start = datetime.combine(tag, time(0), tzinfo=BERLIN)
          ende = datetime.combine(tag + timedelta(days=1), time(0), tzinfo=BERLIN)
          return start, ende


      def erinnerungstexte(reservierungen) -> list[tuple[str, str]]:
          return [
              (r.telefon, f"Erinnerung: Dein Rad {r.rad_id} wartet morgen ab {r.start.astimezone(BERLIN):%H:%M} Uhr.")
              for r in sorted(reservierungen, key=lambda r: r.start)
          ]


      # --- Ports ---

      class Reservierungen(Protocol):
          def zwischen(self, start: datetime, ende: datetime) -> list: ...


      class Sms(Protocol):
          def sende(self, telefon: str, text: str) -> None: ...


      class Clock(Protocol):
          def now(self) -> datetime: ...


      # --- Hülle ---

      class Erinnerungsjob:
          def __init__(self, reservierungen: Reservierungen, sms: Sms, uhr: Clock):
              self._reservierungen = reservierungen
              self._sms = sms
              self._uhr = uhr

          def lauf(self) -> int:
              start, ende = morgen(self._uhr.now())
              texte = erinnerungstexte(self._reservierungen.zwischen(start, ende))
              for telefon, text in texte:
                  self._sms.sende(telefon, text)
              return len(texte)


      # Testplan:
      # - Kern, viele Unit-Tests ohne Doubles: morgen() um 18 Uhr, kurz vor und kurz nach
      #   Mitternacht, am 24.10.2026 (der 25.10. dauert 25 Stunden: 22:00 UTC bis 23:00 UTC
      #   am Folgetag) und vor der Umstellung im März (23 Stunden). erinnerungstexte():
      #   Uhrzeit in Berliner Zeit, Sortierung, leere Liste.
      # - Hülle, ein bis zwei Tests mit FesteUhr, InMemoryReservierungen und SmsSpy:
      #   fragt das richtige Intervall ab und sendet jede Erinnerung genau einmal.
      # - Adapter PostgresReservierungen.zwischen: Integrationstest gegen PostgreSQL,
      #   halboffene Grenzen (Start genau um Mitternacht gehört zum Tag, Ende nicht).
      # - Verdrahtung und Cron um 18 Uhr Berliner Zeit: ein Smoke Test nach dem Deployment.
      # - Nicht getestet: ob der SMS-Anbieter zustellt – das zeigt sein Monitoring.
    checklist:
      - "`morgen` und `erinnerungstexte` sind rein: keine Uhr, keine Datenbank, kein Versand."
      - Der Kern rechnet den Kalendertag in `Europe/Berlin` aus, das Intervall ist halboffen `[start, ende)`.
      - Ein geplanter Test prüft die Nacht der Zeitumstellung, der 25. Oktober 2026 dauert 25 Stunden.
      - Die Uhrzeit in der SMS ist Berliner Zeit, nicht UTC.
      - "`Erinnerungsjob` bekommt Reservierungen, SMS und Uhr über den Konstruktor und trifft selbst keine Fachentscheidung."
      - Der Testplan ordnet Kern, Hülle, Adapter und Verdrahtung je einer Ebene zu und begründet das.
    explanation: |
      Der Kern beantwortet die beiden schwierigen Fragen – welcher Zeitraum ist „morgen“, und wie lautet die Nachricht – ohne jede Abhängigkeit. Deshalb lassen sich gerade die heiklen Fälle mit einer Zeile pro Test prüfen: Am 25. Oktober 2026 liegt Mitternacht in Berlin um 22:00 UTC am 24., die nächste Mitternacht um 23:00 UTC am 25. Der Tag dauert 25 Stunden, und ein Job, der „jetzt plus 24 Stunden“ rechnet, verpasst die letzte Stunde. Vorsicht beim Nachrechnen: Python subtrahiert zwei Zeiten mit demselben `tzinfo` nach Wanduhr und meldet einen Tag; erst nach `astimezone(UTC)` siehst du 25 Stunden. Die Hülle verbindet nur noch Uhr, Repository und SMS und braucht ein, zwei Tests mit Fakes. Ob die SQL-Abfrage die halboffenen Grenzen richtig umsetzt, zeigt nur die echte Datenbank.
