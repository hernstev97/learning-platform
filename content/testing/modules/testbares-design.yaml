id: testbares-design
title: Testbarkeit durch Design
level: 2
minutes: 150
summary: Code, der sich Zeit, Konfiguration, Datenbank und Netz selbst holt, lässt sich nur mit Tricks testen. Wer Abhängigkeiten hereinreicht und Entscheidungen von Ein- und Ausgabe trennt, testet mit festen Werten – und weiß, wann eine Abstraktion mehr kostet, als sie bringt.
goals:
  - Du erkennst versteckte Abhängigkeiten – globale Konfiguration, `datetime.now()`, Zufall, Singletons, I/O mitten in der Logik – und erklärst, was sie im Test anrichten.
  - Du machst Abhängigkeiten ohne Framework austauschbar, über Parameter, Konstruktor-Injektion und ein `Clock`-Protokoll, und testest Zeitgrenzen in `Europe/Berlin` mit fester Uhr.
  - Du trennst einen funktionalen Kern von einer dünnen imperativen Hülle und schneidest Ports und Adapter an den Systemgrenzen.
  - Du sicherst Legacy-Code über Seams und Charakterisierungstests ab, bevor du ihn umbaust.
  - Du wägst Testbarkeit gegen Test-induced Design Damage ab und begründest, wo eine Indirektion ihr Geld nicht wert ist.
