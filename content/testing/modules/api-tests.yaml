id: api-tests
title: Backend- und API-Tests
level: 2
minutes: 150
summary: Eine HTTP-API als Versprechen an ihre Clients testen – Statuscodes, Header, Body und Problem Details, 401, 403 und 404, Idempotenz und Konflikte –, in-process mit einem Testclient und mit klarer Aufteilung, was Handler, Service und Repository jeweils abdecken.
goals:
  - Du benennst, was eine HTTP-API ihren Clients verspricht, und prüfst Statuscodes, Header, Body und Fehlerformat nach RFC 9457.
  - Du testest eine API in-process mit einem Testclient und wägst ab, wann ein Test gegen einen laufenden Server nötig ist.
  - Du unterscheidest 401, 403 und 404 und prüfst, dass fremde Ressourcen unsichtbar bleiben.
  - Du testest Idempotenz mit `Idempotency-Key` und Konflikte mit 409.
  - Du verteilst Tests begründet auf Handler, Service und Repository und wiederholst Grenzfälle nicht auf HTTP-Ebene.
