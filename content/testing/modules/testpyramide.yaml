lesson: |
  Dienstag bei Radwerk. Ein Pull Request braucht in der CI 38 Minuten, 31 davon für 180 Browser-Tests gegen eine Staging-Umgebung mit der Sandbox des Zahlungsdienstleisters Paystream. Letzte Woche wurde derselbe Pull Request dreimal rot, weil die Sandbox nicht antwortete. Beim vierten Versuch war er grün, und niemand hat nachgesehen, warum. Zur selben Zeit ist ein echter Fehler durchgerutscht: Fahrten, die kurz nach Mitternacht beginnen, landeten beim Tageshöchstpreis auf dem Vortag. Die Browser-Tests laufen immer vormittags.

  In der Retrospektive stehen zwei Sätze gegeneinander. „Nur End-to-End-Tests zeigen, dass das Ganze funktioniert.“ – „End-to-End-Tests sind langsam und flaky, wir brauchen Unit-Tests.“ Beide stimmen zum Teil, und keiner beantwortet die Frage, um die es geht: Welches Risiko prüfst du auf welcher Ebene? Dieses Modul gibt dir dafür ein Kostenmodell, die bekannten Bilder – Pyramide, Trophy, Honeycomb, Eistüte – samt ihrer Kritik und eine Entscheidungsregel. Wie man Integrations-, API-, Contract- und End-to-End-Tests schreibt, zeigen die späteren Module.

  ## Was ein Test kostet und was er zeigt

  Jeder Test kauft ein Stück Vertrauen zu einem Preis. Fünf Eigenschaften bestimmen, wie viel und wie teuer:

  - **Geschwindigkeit.** Ein Unit-Test der Tariffunktion läuft in Millisekunden. Ein Test gegen eine echte Datenbank braucht Aufbau und Abbau, ein Browser-Test Sekunden. Wartet ein Pull Request 38 Minuten, laufen Tests seltener, und Fehler fallen später auf.
  - **Determinismus.** Jeder weitere Prozess, jede Netzwerkverbindung, jede Uhr und jeder Thread kann einen Test flaky machen – mal grün, mal rot bei gleichem Code. Google beschreibt in „Software Engineering at Google“, dass Tests an Wert verlieren, sobald der Anteil solcher Ausreißer gegen 1 % geht: Rote Läufe nimmt dann niemand mehr ernst.
  - **Aussagekraft.** Wie nah ist der Test an der echten Nutzung? Ein Unit-Test mit einem Fake für Paystream sagt nichts darüber, ob Paystream die Anfrage annimmt. Ein Browser-Test, der eine Fahrt beendet, prüft Frontend, API, Datenbank und Zahlung zusammen.
  - **Wartung.** Tests, die an Struktur hängen – CSS-Selektoren, interne Hilfsfunktionen, die genaue Reihenfolge von Aufrufen –, brechen bei Umbauten, die nichts kaputt machen.
  - **Fehlerlokalisierung.** Ein roter Unit-Test nennt Funktion und Fall. Ein roter Browser-Test sagt: Irgendwo zwischen Klick und Datenbank stimmt etwas nicht.

  Dieselbe Regel – eine E-Bike-Fahrt von 31 Minuten kostet 600 Cent – sieht auf drei Ebenen so aus:

  ```python
  # Unit: eine Funktion, ein Prozess, Millisekunden
  def test_e_bike_31_minuten():
      assert mietpreis(31, "ebike") == 600


  # API: HTTP-Schicht, Serialisierung, Datenbank
  def test_beenden_liefert_preis(client, fahrt_e_bike):
      antwort = client.post(f"/fahrten/{fahrt_e_bike}/beenden", json={"minuten": 31})
      assert antwort.json()["preis_cent"] == 600
  ```

  ```typescript
  // End-to-End: Browser, Frontend, API, Datenbank, Paystream-Sandbox
  import { expect, test } from "@playwright/test";

  test("E-Bike-Fahrt zeigt den Preis", async ({ page }) => {
    await page.goto("/fahrten/4711");
    await page.getByRole("button", { name: "Fahrt beenden" }).click();
    await expect(page.getByText("6,00 €")).toBeVisible();
  });
  ```

  Für die Rechenregel liefern alle drei dieselbe Information. Der erste ist um Größenordnungen billiger und zeigt im Fehlerfall direkt auf `mietpreis`. Die anderen beiden lohnen sich für das, was nur sie sehen: dass der Endpunkt den Tarif aufruft und das Ergebnis richtig ausliefert, dass der Button im Browser eine Fahrt wirklich beendet.

  | | Unit | Integration | End-to-End |
  | --- | --- | --- | --- |
  | Laufzeit pro Test | Millisekunden | Zehntelsekunden bis Sekunden | Sekunden bis Minuten |
  | Determinismus | hoch | mittel: Datenbank, Dateien, Prozesse | niedrig: Netz, Browser, fremde Dienste |
  | Aussagekraft über das Ganze | gering | mittel | hoch |
  | Bruch bei Umbauten | je nach Stil gering bis hoch | mittel | hoch |
  | Fehlerlokalisierung | genau | mittel | grob |

  ## Die Testpyramide und ihre Kritik

  Mike Cohn beschrieb 2009 in „Succeeding with Agile“ die Test Automation Pyramid: viele Unit-Tests unten, eine Schicht Service-Tests in der Mitte, wenige UI-Tests oben ([Cohn: The Forgotten Layer](https://www.mountaingoatsoftware.com/blog/the-forgotten-layer-of-the-test-automation-pyramid)). Martin Fowler begründet die Form damit, dass Tests durch die Oberfläche „brittle, expensive to write, and time consuming to run“ sind ([TestPyramid](https://martinfowler.com/bliki/TestPyramid.html)). Ham Vocke fasst in „The Practical Test Pyramid“ zusammen, was davon bleibt ([Vocke 2018](https://martinfowler.com/articles/practical-test-pyramid.html#TheTestPyramid)): Schreib Tests mit unterschiedlicher Granularität, und je höher die Ebene, desto weniger Tests. Google nannte 2015 als ersten Richtwert 70 % Unit-, 20 % Integrations- und 10 % End-to-End-Tests, das Buch „Software Engineering at Google“ 2020 rund 80/15/5.

  ```text
  Pyramide (Cohn)                  Trophy (Dodds)
    UI              ██               End-to-End     ██
    Service         ████             Integration    ████████
    Unit            ████████         Unit           ████
                                     Statisch       ██████

  Honeycomb (Spotify)              Eistüte (Anti-Muster)
    Integrated      █                manuell        ████████
    Integration     ████████         UI             ██████
    Impl. Detail    ██               Integration    ███
                                     Unit           █
  ```

  Die Balken zeigen grob, wo der Aufwand liegt, keine exakten Anteile. Drei Einwände gegen die Pyramide solltest du kennen:

  **Die Form folgt aus einer Kostenannahme.** Fowler schreibt selbst, dass die Pyramide darauf beruht, dass breite Tests teurer, langsamer und brüchiger sind als fokussierte. Sind höhere Tests schnell, verlässlich und billig zu ändern, braucht es weniger tiefe. Werkzeuge haben diese Kosten verschoben: Testclients, die eine Web-App im selben Prozess aufrufen, Datenbanken in Containern, Browser-Tests, die von selbst auf Elemente warten.

  **Die Namen der Schichten tragen nicht.** „Service-Test“ versteht jeder anders, und UI heißt nicht End-to-End: Eine React-Komponente lässt sich isoliert testen, wie Vocke betont. Fowler beobachtet außerdem, dass Teams End-to-End, UI und „aus Kundensicht“ in einen Topf werfen, obwohl das drei unabhängige Eigenschaften sind.

  **Quoten sind kein Ziel.** 70/20/10 zählt Tests, nicht Risiken. Fowler zitiert dazu Justin Searls: „People love debating what percentage of which type of tests to write, but it's a distraction. Nearly zero teams write expressive tests that establish clear boundaries, run quickly & reliably, and only fail for useful reasons. Focus on that instead.“

  ## Testing Trophy, Honeycomb und Eistüte

  **Testing Trophy.** Kent C. Dodds stellte sie 2018 für Frontend-Code vor ([The Testing Trophy and Testing Classifications](https://kentcdodds.com/blog/the-testing-trophy-and-testing-classifications)). Unten liegt statische Analyse mit Typen und Lintern, darauf wenige Unit-Tests, der dickste Teil sind Integrationstests, oben stehen wenige End-to-End-Tests. Das Motto stammt von Guillermo Rauch: „Write tests. Not too many. Mostly integration.“ Dodds' Leitsatz dazu: „The more your tests resemble the way your software is used, the more confidence they can give you.“ Entscheidend sind seine Begriffe. Ein Unit-Test ersetzt bei ihm die Abhängigkeiten einer Einheit durch Mocks, ein Integrationstest lässt mehrere Einheiten zusammenarbeiten, etwa eine ganze Seite mit gemocktem HTTP. Er schreibt selbst, dass er an einzelne Codebasen dachte, nicht an Microservices.

  **Testing Honeycomb.** André Schaffer und Rickard Dybeck beschrieben 2018 bei Spotify die Wabe für Microservices ([Testing of Microservices](https://engineering.atspotify.com/2018/01/testing-of-microservices)). Ihr Argument: Die Komplexität eines kleinen Dienstes steckt in seinen Interaktionen, nicht in seinem Inneren. Den Großteil bilden deshalb Integrationstests: der Dienst mit echter Datenbank, geprüft über seine API. „Implementation Detail Tests“ gibt es nur für Teile mit eigener Komplexität, ihr Beispiel ist ein Parser für Build-Logs. „Integrated Tests“, deren Ergebnis von der Korrektheit eines anderen Systems abhängt, sollen gegen null gehen. Den Preis nennen sie selbst: Die Suite braucht Sekunden statt Millisekunden, und bei einem roten Test folgen sie Stacktraces durch den Dienst.

  **Eistüte.** Das Gegenbild ist eine Warnung: viele manuelle und UI-Tests oben, wenige Unit-Tests unten. Fowler beschreibt, wie Teams dort landen. Aufgezeichnete Klicktests sind am Anfang bequem, dann langsam, an Lizenzen und bestimmte Rechner gebunden und nach jeder Änderung neu aufzunehmen. Google nennt daneben die Sanduhr: viele Unit- und viele End-to-End-Tests, kaum etwas dazwischen ([Just Say No to More End-to-End Tests](https://testing.googleblog.com/2015/04/just-say-no-to-more-end-to-end-tests.html)).

  Fowler hat 2021 untersucht, worüber die Lager streiten ([On the Diverse And Fantastical Shapes of Testing](https://martinfowler.com/articles/2021-test-shapes.html)). Sein Befund: Wer die Wabe vertritt, meint mit „Unit-Test“ meist einen Test, der alle Mitspieler durch Mocks ersetzt, und mit „Integrationstest“ etwas, das Fowler einen sociable Unit-Test nennt. Der Streit um die Form ist zu großen Teilen ein Streit um Wörter. Frag deshalb immer zuerst, was dein Gegenüber mit „Unit“ und „Integration“ meint.

  > [!INTERVIEW] „Was hältst du von der Testpyramide?“
  > Ich nutze sie als Faustregel für Kosten, nicht als Quote. Sie nimmt an, dass breite Tests langsamer, brüchiger und teurer sind; wo das stimmt, schreibe ich viele kleine und wenige breite Tests. Trophy und Honeycomb setzen andere Schwerpunkte, weil in Frontends und Microservices mehr Risiko im Zusammenspiel liegt, und weil sie „Unit“ anders definieren. Ich entscheide pro Risiko: Auf welcher niedrigsten Ebene zeigt sich dieser Fehler zuverlässig?

  ## Was ist eine Unit? Solitary, sociable und Googles Testgrößen

  „Unit“ hat keine feste Definition. Fowler erzählt von einem Testexperten, der am ersten Morgen seines Kurses 24 Definitionen vorstellte ([UnitTest](https://martinfowler.com/bliki/UnitTest.html#SolitaryOrSociable)). Für die Praxis zählen zwei Unterscheidungen.

  **Solitary oder sociable** – die Begriffe stammen von Jay Fields. Ein solitary Unit-Test ersetzt alle Mitspieler der getesteten Einheit durch Test Doubles. Ein sociable Unit-Test lässt echte Mitspieler mitlaufen und ersetzt nur, was langsam, nicht deterministisch oder fremd ist: Netz, Zahlung, Uhr. Dahinter stehen zwei Schulen ([Mocks Aren't Stubs](https://martinfowler.com/articles/mocksArentStubs.html#ClassicalAndMockistTesting)). Die klassische oder Detroit-Schule nimmt echte Objekte, wo es geht, und prüft den Zustand danach. Die Mockist- oder London-Schule ersetzt jeden Mitspieler mit eigenem Verhalten und prüft die Interaktionen. Wie Test Doubles im Einzelnen funktionieren, zeigt [Test Doubles und Mocks](/testing/test-doubles).

  Im folgenden Block rechnet `mietpreis` das E-Bike absichtlich mit dem City-Satz. Führ ihn aus und sieh dir an, welcher Test es bemerkt.

  ```python pytest fails
  SATZ = {"city": 150, "ebike": 150}  # Fehler: das E-Bike kostet 300 Cent


  def mietpreis(minuten: int, rad: str) -> int:
      if minuten <= 5:
          return 0
      return (minuten + 29) // 30 * SATZ[rad]


  class FakeZahlung:
      """Ersetzt Paystream: merkt sich Buchungen, statt Geld zu bewegen."""

      def __init__(self):
          self.buchungen = []

      def buche(self, kunde_id: str, cent: int) -> None:
          self.buchungen.append((kunde_id, cent))


  class Fahrtabschluss:
      def __init__(self, tarif, zahlung):
          self.tarif = tarif
          self.zahlung = zahlung

      def beende(self, kunde_id: str, minuten: int, rad: str) -> int:
          cent = self.tarif(minuten, rad)
          if cent > 0:
              self.zahlung.buche(kunde_id, cent)
          return cent


  def test_mietpreis_e_bike_zwei_bloecke():
      assert mietpreis(31, "ebike") == 600


  def test_solitary_tarif_und_zahlung_ersetzt():
      zahlung = FakeZahlung()
      Fahrtabschluss(lambda minuten, rad: 600, zahlung).beende("K-17", 31, "ebike")
      assert zahlung.buchungen == [("K-17", 600)]


  def test_sociable_echter_tarif_nur_zahlung_ersetzt():
      zahlung = FakeZahlung()
      Fahrtabschluss(mietpreis, zahlung).beende("K-17", 31, "ebike")
      assert zahlung.buchungen == [("K-17", 600)]
  ```

  Der solitary Test bleibt grün. Er prüft nur, dass `Fahrtabschluss` bucht, was der Tarif liefert, und sein Lambda ignoriert die Argumente. Er bliebe auch grün, wenn `Fahrtabschluss` den Tarif mit Sekunden statt Minuten aufriefe. Der sociable Test bemerkt den Fehler, zeigt aber nicht, wo er liegt; das tut der Unit-Test von `mietpreis`, der gleichzeitig rot ist. Beide Stile haben ihren Platz, und die Wahl entscheidet, welche Fehler eine Suite sieht.

  **Testgrößen.** Google umgeht den Streit um Wörter und teilt Tests nach ihren Ressourcen ein ([Software Engineering at Google, Test Size](https://abseil.io/resources/swe-book/html/ch11.html#test_size)):

  | | small | medium | large |
  | --- | --- | --- | --- |
  | Prozesse | einer, oft ein Thread | mehrere auf einer Maschine | mehrere Maschinen |
  | Netzwerk | nein | nur `localhost` | ja |
  | Dateisystem, Datenbank | nein | ja | ja |
  | `sleep`, blockierende Aufrufe | nein | ja | ja |

  Größe (wie ein Test läuft) und Umfang (wie viel Code er prüft) sind zwei Achsen. Ein Test für eine einzelne Funktion, die eine Datei liest, hat kleinen Umfang, aber mittlere Größe. Google empfiehlt die kleinste Größe, die für das Risiko reicht, weil kleine Tests fast von selbst schnell und deterministisch sind, und lässt die Testinfrastruktur die Grenzen teilweise erzwingen. In pytest machst du Größen mit Markern sichtbar ([Marker registrieren](https://docs.pytest.org/en/stable/how-to/mark.html#registering-marks)); seit pytest 9.0 auch in der nativen TOML-Konfiguration:

  ```toml
  [tool.pytest]
  markers = [
      "medium: braucht Dateisystem, Datenbank oder Prozesse auf dieser Maschine",
      "large: braucht andere Maschinen, etwa die Paystream-Sandbox",
  ]
  strict_markers = true
  ```

  ```console
  $ pytest -m "not medium and not large" -q
  ..                                                       [100%]
  2 passed, 2 deselected in 0.10s
  ```

  `strict_markers` macht aus einem Tippfehler wie `@pytest.mark.mediun` einen Fehler, statt einen Marker anzulegen, den nie jemand auswählt. Die Einteilung ist aber nur so ehrlich wie die Tests: Ein Test ohne Marker, der `datetime.now()`, `open()`, einen HTTP-Client oder `time.sleep` benutzt, ist kein small Test, auch wenn er im Ordner `unit/` liegt.

  ## Testgrenzen an Architekturgrenzen ziehen

  Wo ein Test aufhört, entscheidest du am besten an den Grenzen, die die Architektur schon hat. So sieht das Radwerk-Backend aus:

  ```text
   Website, Android-App, Paystream-Webhooks
          │  HTTP und JSON                     ← Prozessgrenze
   ┌──────▼────────────────────────────────────────┐
   │ API-Schicht   Routen, Validierung, Statuscodes │
   │ Fachlogik     Tarif, Gutschein, Reservierung  │ ← ohne I/O
   │ Adapter       Repository · Paystream · Mail   │
   └──────┬──────────────┬──────────────┬──────────┘
          ▼              ▼              ▼
     PostgreSQL     Paystream-API   Mail und SMS    ← fremde Systeme
  ```

  - **Fachlogik** hat keine I/O. Hier liegen die meisten Regeln und damit die meisten Fälle: Äquivalenzklassen, Grenzwerte, Entscheidungstabellen, alles als small Tests.
  - **Adapter** übersetzen zwischen Fachlogik und Systemen, die du nicht kontrollierst. Ihr Risiko steckt in der Übersetzung: SQL, Spaltentypen, Format der Anfrage, Fehlercodes von Paystream. Ein Test, der den Datenbanktreiber mockt, prüft den Mock. Adapter bekommen wenige Tests gegen das echte Gegenüber oder einen treuen Nachbau ([Integrationstests](/testing/integrationstests)).
  - **Prozessgrenzen** wie HTTP zwischen App und API oder Webhooks von Paystream haben eigene Risiken: Serialisierung, Statuscodes, Authentifizierung, Kompatibilität mit älteren App-Versionen ([API-Tests](/testing/api-tests), [Contract Testing](/testing/contract-testing)).
  - **Das Ganze** prüfen wenige End-to-End-Tests für die Abläufe, die Geld bringen oder teuer sind, wenn sie brechen ([End-to-End-Tests](/testing/e2e-tests)).

  Je sauberer die Fachlogik von den Adaptern getrennt ist, desto mehr Risiken lassen sich small testen. Liest die Tageslogik selbst die Uhr und die Datenbank, wird jeder Test dafür medium und hängt an der Tageszeit – genau so ist der Mitternachtsfehler durchgerutscht. Wie du Code dafür schneidest, zeigt [Testbarkeit durch Design](/testing/testbares-design).

  ## Die Entscheidungsregel: so tief wie möglich, so hoch wie nötig

  > [!MERKE]
  > Teste jedes Risiko auf der niedrigsten Ebene, die es noch zuverlässig zeigt. Prüfe dasselbe nicht noch einmal auf einer höheren Ebene.

  Die Regel hat zwei Hälften. „Niedrigste Ebene“ heißt: schnell, deterministisch, genaue Fehlermeldung. „Zuverlässig zeigt“ heißt: Der Test muss an genau diesem Fehler scheitern können. Ein Unit-Test mit gemockter Datenbank kann keinen falschen Spaltentyp zeigen, und ein Browser-Test um 10 Uhr kann den Mitternachtsfehler nicht zeigen. Für das Feature „Fahrt beenden und abrechnen“ ergibt das:

  | Risiko | Wo entsteht der Fehler? | Niedrigste zuverlässige Ebene |
  | --- | --- | --- |
  | Preis an Blockgrenzen falsch | Tariffunktion | Unit |
  | Fahrt kurz nach Mitternacht dem Vortag zugerechnet | Tageslogik mit Zeitzone | Unit mit festen Zeitpunkten |
  | Cent-Betrag kommt verändert aus PostgreSQL | Repository, Spaltentyp | Integration mit echter Datenbank |
  | Schon beendete Fahrt wird nicht mit 409 abgewiesen | API-Schicht | API-Test |
  | App versteht die Antwort nach einer Feldumbenennung nicht | Vertrag App und API | Contract Test |
  | Abgelehnte Zahlung lässt die Fahrt nicht offen | Fachlogik mit Zahlungs-Adapter | sociable Test mit Fake-Paystream |
  | Ausleihen, fahren, bezahlen klappt im Browser | alles zusammen | ein End-to-End-Test |

  Gegen doppelte Prüfungen nennt Vocke zwei Regeln ([Avoid Test Duplication](https://martinfowler.com/articles/practical-test-pyramid.html#AvoidTestDuplication)). Findet ein höherer Test einen Fehler, den kein tieferer Test bemerkt, schreibst du den tieferen Test. Und du schiebst Tests so weit nach unten wie möglich. Ein höherer Test prüft dann, was die unteren nicht sehen können, die Verdrahtung, und nicht noch einmal alle Fälle:

  ```python
  # tests/api/test_fahrten_api.py – prüft die Verdrahtung, nicht den Tarif
  def test_beenden_liefert_den_preis_aus_dem_tarif(client, fahrt_e_bike):
      antwort = client.post(f"/fahrten/{fahrt_e_bike}/beenden", json={"minuten": 31})
      assert antwort.status_code == 200
      assert antwort.json() == {"fahrt_id": fahrt_e_bike, "preis_cent": 600, "status": "beendet"}
      # Fehlstart, Blockgrenzen, Abo und Tageshöchstpreis: tests/unit/test_tarif.py
  ```

  Die Gegenrichtung gilt auch. „So tief wie möglich“ heißt nicht „alles als Unit-Test“. Wer die Datenbank mockt, um eine SQL-Abfrage zu testen, prüft seinen Mock. Dodds' Satz über Tests, die der echten Nutzung ähneln, ist hier das Gegengewicht.

  > [!PRAXIS] Radwerk nach dem Aufräumen
  > Das Team geht die 180 Browser-Tests Risiko für Risiko durch. 140 prüfen Tarif- und Gutscheinregeln; sie werden gelöscht, wo es Unit-Tests schon gibt, sonst zu Unit-Tests. 25 prüfen Statuscodes und Fehlermeldungen und wandern in API-Tests, 9 prüfen die Anzeige von Preisen und werden Komponententests im Frontend. Sechs Abläufe bleiben im Browser, darunter Ausleihen bis Quittung und eine abgelehnte Zahlung. Der Mitternachtsfehler bekommt einen Unit-Test mit festen Zeitpunkten in `Europe/Berlin`. Die Pipeline braucht danach 9 statt 38 Minuten, und niemand startet rote Läufe mehr neu, ohne nachzusehen.

  > [!WARNING] Quoten als Kennzahl
  > Steht „70 % Unit-Tests“ als Ziel im Dashboard, entstehen Tests, die die Quote füllen: Getter-Tests, Tests gegen Mocks, Tests ohne Assertion. Miss lieber, was das Team spürt – Laufzeit der Suite, Anteil flaky Läufe, Fehler, die erst in Produktion auffallen.

  ## Häufige Fehler

  - **Ebenen nach Quote füllen.** Die Frage ist nicht „Wie viele Tests pro Ebene?“, sondern „Welches Risiko, und wo zeigt es sich am billigsten zuverlässig?“.
  - **Dieselben Fälle auf jeder Ebene.** Tarifgrenzen im Unit-Test, im API-Test und im Browser kosten dreimal Laufzeit, und ein Fehler macht drei Tests rot, von denen nur einer die Ursache nennt.
  - **Die Eistüte.** Vertrauen nur in Browser-Tests führt zu langsamen Pipelines, neu gestarteten roten Läufen und Fehlern in Randfällen, die im Browser niemand durchspielt.
  - **Unit-Tests mit versteckter Uhr, Datei oder Netz.** Sie liegen im schnellen Teil der Suite und werden zu bestimmten Uhrzeiten, auf frischen CI-Runnern oder ohne Netz rot.
  - **Die Grenze auf der falschen Seite.** Der Datenbanktreiber ist gemockt, einen Test gegen die echte Datenbank gibt es nicht. Das SQL ist damit ungetestet.
  - **Solitary um jeden Preis.** Wenn jeder Mitspieler gemockt ist, prüfen Tests Aufrufe statt Verhalten und brechen bei jedem Umbau.
  - **Begriffe nicht klären.** „Integrationstest“ heißt im einen Team „gegen echte Datenbank“, im anderen „mehrere Klassen zusammen“. Schreibt auf, was ihr meint.

  ## Zusammenfassung

  - Jeder Test kauft Vertrauen zu einem Preis aus Laufzeit, Determinismus, Wartung und Fehlerlokalisierung. Höhere Ebenen sagen mehr über das Ganze und kosten mehr.
  - Die Testpyramide ist eine Faustregel, die auf einer Kostenannahme beruht. Trophy und Honeycomb setzen für Frontends und Microservices andere Schwerpunkte und definieren „Unit“ anders.
  - Die Eistüte – und die Sanduhr – sind Anti-Muster: zu viel Vertrauen in langsame, breite Tests.
  - Solitary Tests ersetzen alle Mitspieler, sociable Tests nur die schwierigen. Googles Testgrößen messen Ressourcen, nicht Umfang.
  - Testgrenzen folgen Architekturgrenzen: Fachlogik small und gründlich, Adapter gegen das echte Gegenüber, Prozessgrenzen mit API- und Contract-Tests, wenige End-to-End-Abläufe.
  - Teste jedes Risiko auf der niedrigsten Ebene, die es zuverlässig zeigt, und wiederhole es oben nicht.
  - Findet ein höherer Test einen Fehler, schreib dafür einen tieferen Test.
exercises:
  - id: annahme-der-pyramide
    type: choice
    title: Worauf die Pyramide beruht
    prompt: |
      Die Testpyramide empfiehlt viele Unit-Tests und wenige End-to-End-Tests. Auf welcher Annahme beruht diese Empfehlung?
    options:
      - text: Breite Tests über viele Schichten sind langsamer, brüchiger und teurer zu pflegen als fokussierte Tests.
        correct: true
        why: Fowler nennt genau das als Grundlage. Sind die höheren Tests in einem Projekt schnell, verlässlich und billig zu ändern, verschiebt sich die sinnvolle Form.
      - text: Unit-Tests finden mehr Fehler als End-to-End-Tests.
        correct: false
        why: End-to-End-Tests finden Fehler im Zusammenspiel, die kein Unit-Test sieht. Die Pyramide argumentiert mit Kosten pro Vertrauen, nicht mit der Zahl gefundener Fehler.
      - text: Eine Suite ist gesund, wenn mindestens 70 % ihrer Tests Unit-Tests sind.
        correct: false
        why: Quoten wie 70/20/10 sind grobe Startwerte. Sie zählen Tests, nicht abgedeckte Risiken.
      - text: Benutzeroberflächen lassen sich nur mit End-to-End-Tests prüfen.
        correct: false
        why: UI und End-to-End sind verschiedene Eigenschaften. Komponenten lassen sich isoliert testen, wie Vocke in „The Practical Test Pyramid“ betont.
    explanation: |
      Die Pyramide ist ein Kostenargument: Breite Tests über die Oberfläche waren langsam, flaky und bei jeder Änderung zu reparieren, also sollten sie die Ausnahme sein. Fowler schreibt dazu in einer Fußnote, dass niedrigere Tests weniger nötig sind, wenn höhere Tests schnell, verlässlich und billig zu ändern sind. Deshalb lohnt es sich, die Annahme im eigenen Projekt zu prüfen, statt die Form zu übernehmen. Trophy und Honeycomb sind genau solche Neubewertungen für andere Umgebungen.
    resources:
      - title: Martin Fowler · TestPyramid
        url: https://martinfowler.com/bliki/TestPyramid.html
      - title: The Practical Test Pyramid · The Test Pyramid
        url: https://martinfowler.com/articles/practical-test-pyramid.html#TheTestPyramid

  - id: testgroesse-bestimmen
    type: choice
    title: Klein im Umfang, aber welche Größe?
    prompt: |
      Bei Google entscheiden die Ressourcen eines Tests über seine Größe, nicht die Menge des geprüften Codes. Welche Größe hat dieser Test?
    lang: python
    code: |
      def test_export_enthaelt_alle_fahrten(tmp_path):
          ziel = tmp_path / "fahrten.csv"
          exportiere([(1204, 300), (1205, 0)], ziel)
          assert ziel.read_text(encoding="utf-8").count("\n") == 3
    options:
      - text: small
        correct: false
        why: Small Tests dürfen kein Dateisystem benutzen. Dieser Test schreibt und liest eine echte Datei.
      - text: medium
        correct: true
        why: Er bleibt auf einer Maschine, braucht aber das Dateisystem. Das ist genau der Bereich von medium.
      - text: large
        correct: false
        why: Large Tests brauchen mehrere Maschinen oder entfernte Systeme. Hier ist nichts davon im Spiel.
      - text: small, weil nur eine einzige Funktion geprüft wird
        correct: false
        why: Das verwechselt Größe mit Umfang. Der Umfang ist klein, die Größe richtet sich nach den Ressourcen.
    explanation: |
      Google trennt zwei Achsen. Der Umfang sagt, wie viel Code ein Test prüft – hier eine Funktion. Die Größe sagt, was der Test braucht: small heißt ein Prozess ohne Netz, ohne Dateisystem und ohne `sleep`, medium erlaubt alles auf einer Maschine inklusive `localhost`, large auch andere Maschinen. Der Export braucht das Dateisystem und ist damit medium. Das ist nicht schlecht, aber es gehört in den Teil der Suite, der mit Dateien rechnet; die Formatierung jeder Zeile ließe sich ohne Datei small testen.
    resources:
      - title: Software Engineering at Google · Test Size
        url: https://abseil.io/resources/swe-book/html/ch11.html#test_size
      - title: Google Testing Blog · Test Sizes
        url: https://testing.googleblog.com/2010/12/test-sizes.html

  - id: hoher-test-findet-fehler
    type: order
    title: Wenn der Browser-Test den Fehler findet
    prompt: |
      Ein End-to-End-Test meldet: Eine E-Bike-Fahrt über 31 Minuten zeigt 3,00 € statt 6,00 €. Kein Unit-Test ist rot. Bring die Schritte in die Reihenfolge, die der Entscheidungsregel folgt.
    lang: text
    lines: |
      Den Ablauf aus dem End-to-End-Test nachstellen und die Abweichung bestätigen
      Eingrenzen, welche Komponente den falschen Wert liefert
      Einen Unit-Test schreiben, der den Fehler zeigt, und ihn rot sehen
      Den Fehler im Code beheben
      Unit-Test und End-to-End-Test grün sehen
      Prüfen, ob der End-to-End-Test noch etwas zeigt, das tiefere Tests nicht zeigen
    explanation: |
      Fowler rät, einen Fehler aus einem höheren Test zuerst mit einem Unit-Test nachzustellen, bevor du ihn behebst. Der rote Unit-Test beweist, dass er den Fehler trifft, und hält ihn künftig in Millisekunden fest. Erst danach kommt die Korrektur. Der letzte Schritt verhindert Doppelungen: Prüft der Browser-Test nur noch die Tarifregel, die jetzt unten steht, darf er gehen; prüft er den Ablauf als Ganzes, bleibt er.
    resources:
      - title: Martin Fowler · TestPyramid
        url: https://martinfowler.com/bliki/TestPyramid.html

  - id: refactoring-bricht-tests
    type: output
    title: Welche Tests überleben das Refactoring?
    prompt: |
      Beim Refactoring wurde die Hilfsfunktion `_runde_auf` in `bloecke` umbenannt, und `Quittung` hat ein neues Feld `waehrung` mit Standardwert bekommen. Das Verhalten von `abrechnen` ist unverändert. Das Programm führt vier Tests aus, die vor dem Refactoring alle grün waren. Was gibt es aus?
    lang: python
    code: |
      from dataclasses import dataclass

      SATZ = {"city": 150, "ebike": 300}


      @dataclass
      class Quittung:
          fahrt_id: int
          cent: int
          waehrung: str = "EUR"  # neu


      def bloecke(minuten):  # hieß vorher _runde_auf
          return (minuten + 29) // 30


      def abrechnen(fahrt_id, minuten, rad):
          cent = 0 if minuten <= 5 else bloecke(minuten) * SATZ[rad]
          return Quittung(fahrt_id, cent)


      def test_preis():
          assert abrechnen(1204, 31, "ebike").cent == 600

      def test_quittung_als_text():
          assert str(abrechnen(1204, 31, "ebike")) == "Quittung(fahrt_id=1204, cent=600)"

      def test_quittung_gleich():
          assert abrechnen(1204, 31, "ebike") == Quittung(1204, 600)

      def test_hilfsfunktion():
          assert _runde_auf(31) == 2


      for test in [test_preis, test_quittung_als_text, test_quittung_gleich, test_hilfsfunktion]:
          try:
              test()
              print(test.__name__, "grün")
          except AssertionError:
              print(test.__name__, "rot")
          except Exception as fehler:
              print(test.__name__, "Fehler:", type(fehler).__name__)
    expected: |
      test_preis grün
      test_quittung_als_text rot
      test_quittung_gleich grün
      test_hilfsfunktion Fehler: NameError
    explanation: |
      `test_preis` prüft Verhalten über die öffentliche Funktion und übersteht jeden Umbau, der den Preis nicht ändert. `test_quittung_als_text` hängt an der Textdarstellung: Die Dataclass erzeugt jetzt `Quittung(fahrt_id=1204, cent=600, waehrung='EUR')`, und der Test wird rot, ohne dass ein Fehler im Code steckt. `test_quittung_gleich` bleibt grün, weil der Vergleichswert ebenfalls den Standardwert `"EUR"` bekommt. `test_hilfsfunktion` ruft einen Namen auf, den es nicht mehr gibt. In pytest zählen rot und Fehler gleich: zwei Fehlalarme bei null echten Fehlern. Je mehr ein Test über Struktur und Darstellung weiß, desto teurer wird jeder Umbau.
    resources:
      - title: Python · dataclasses
        url: https://docs.python.org/3/library/dataclasses.html
      - title: The Practical Test Pyramid · What to Test?
        url: https://martinfowler.com/articles/practical-test-pyramid.html#WhatToTest

  - id: ein-fehler-viele-rote-tests
    type: output
    title: Ein Fehler, mehrere rote Tests
    prompt: |
      Die Funktionen unten stehen stark vereinfacht für drei Ebenen: `mietpreis` für die Fachlogik, `api_fahrt_beenden` für den Endpunkt und `browser_quittung` für das, was der Browser anzeigt. Im Tarif steckt ein Fehler. Was gibt das Programm aus?
    lang: python
    code: |
      SATZ = {"city": 150, "ebike": 150}  # Fehler: das E-Bike kostet 300 Cent


      def mietpreis(minuten, rad):
          return 0 if minuten <= 5 else (minuten + 29) // 30 * SATZ[rad]


      def api_fahrt_beenden(minuten, rad):
          return {"status": 200, "preis_cent": mietpreis(minuten, rad)}


      def browser_quittung(minuten, rad):
          cent = api_fahrt_beenden(minuten, rad)["preis_cent"]
          return f"{cent // 100},{cent % 100:02d} €"


      tests = [
          ("unit", "city 31 min", lambda: mietpreis(31, "city") == 300),
          ("unit", "e-bike 31 min", lambda: mietpreis(31, "ebike") == 600),
          ("unit", "e-bike fehlstart", lambda: mietpreis(5, "ebike") == 0),
          ("api", "status 200", lambda: api_fahrt_beenden(31, "ebike")["status"] == 200),
          ("api", "e-bike preis", lambda: api_fahrt_beenden(31, "ebike")["preis_cent"] == 600),
          ("e2e", "city quittung", lambda: browser_quittung(45, "city") == "3,00 €"),
          ("e2e", "e-bike quittung", lambda: browser_quittung(31, "ebike") == "6,00 €"),
      ]
      rot = [f"{ebene}: {name}" for ebene, name, pruefung in tests if not pruefung()]
      print(len(rot), "von", len(tests), "rot")
      for zeile in rot:
          print(zeile)
    expected: |
      3 von 7 rot
      unit: e-bike 31 min
      api: e-bike preis
      e2e: e-bike quittung
    explanation: |
      Mit dem falschen Satz kostet die E-Bike-Fahrt von 31 Minuten 300 statt 600 Cent. Rot werden alle drei Tests, die genau diesen Preis prüfen, auf jeder Ebene einer. Die Fehlstart-Prüfung bleibt grün, weil 0 mal irgendein Satz 0 ist, ebenso Status und City-Quittung. Nur der Unit-Test nennt die Ursache genau; der API- und der Browser-Test sagen dasselbe noch einmal, langsamer und ungenauer. Sie lohnen sich für das, was nur sie zeigen – Statuscode, Format der Anzeige –, nicht als Wiederholung der Tarifregel.
    resources:
      - title: The Practical Test Pyramid · Avoid Test Duplication
        url: https://martinfowler.com/articles/practical-test-pyramid.html#AvoidTestDuplication

  - id: sociable-test
    type: code
    title: Ein Test, der die Einheit bemerkt
    prompt: |
      `abrechnung.py` enthält:

      - `mietpreis(minuten: int, rad: str) -> int`: 0 Cent bis einschließlich 5 Minuten, sonst je angefangene 30 Minuten 150 Cent (`"city"`) oder 300 Cent (`"ebike"`).
      - `Fahrtabschluss(tarif, zahlung)` mit der Methode `beende(kunde_id: str, sekunden: int, rad: str) -> int`. Die App meldet die Dauer in Sekunden. `beende` rechnet sie in angefangene Minuten um (301 Sekunden sind 6 Minuten), berechnet den Preis mit `tarif(minuten, rad)`, bucht ihn mit `zahlung.buche(kunde_id, cent)` – aber nur, wenn er größer als 0 ist – und gibt ihn zurück.

      `fakes.py` enthält `FakeZahlung`: Ihre Methode `buche` hängt `(kunde_id, cent)` an die Liste `buchungen` an.

      Der Test im Editor ist solitary: Er ersetzt den Tarif durch eine feste Funktion und bemerkt deshalb viele Fehler nicht. Schreibe sociable Tests – mit dem echten `mietpreis` und nur der Zahlung ersetzt –, die gegen die richtige Implementierung grün sind und jede fehlerhafte Variante rot werden lassen.
    lang: python
    setup: |
      from pathlib import Path

      RICHTIG = '''
      SATZ = {"city": 150, "ebike": 300}


      def mietpreis(minuten: int, rad: str) -> int:
          if minuten <= 5:
              return 0
          return (minuten + 29) // 30 * SATZ[rad]


      class Fahrtabschluss:
          def __init__(self, tarif, zahlung):
              self.tarif = tarif
              self.zahlung = zahlung

          def beende(self, kunde_id: str, sekunden: int, rad: str) -> int:
              minuten = (sekunden + 59) // 60
              cent = self.tarif(minuten, rad)
              if cent > 0:
                  self.zahlung.buche(kunde_id, cent)
              return cent
      '''
      FAKES = '''
      class FakeZahlung:
          def __init__(self):
              self.buchungen = []

          def buche(self, kunde_id, cent):
              self.buchungen.append((kunde_id, cent))
      '''
      MUTANTEN = {
          "sekunden": RICHTIG.replace("cent = self.tarif(minuten, rad)", "cent = self.tarif(sekunden, rad)"),
          "abgerundet": RICHTIG.replace("minuten = (sekunden + 59) // 60", "minuten = sekunden // 60"),
          "nullbuchung": RICHTIG.replace("        if cent > 0:\n            self.zahlung.buche", "        self.zahlung.buche"),
          "tarif": RICHTIG.replace('"ebike": 300', '"ebike": 150'),
      }
      assert all(m != RICHTIG for m in MUTANTEN.values()), "Ein Mutant ist identisch mit der richtigen Version."
      Path("abrechnung.py").write_text(RICHTIG, encoding="utf-8")
      Path("fakes.py").write_text(FAKES, encoding="utf-8")
    starter: |
      from abrechnung import Fahrtabschluss, mietpreis
      from fakes import FakeZahlung


      def fester_tarif(minuten, rad):
          return 150


      def test_beende_bucht_den_preis():
          zahlung = FakeZahlung()
          abschluss = Fahrtabschluss(fester_tarif, zahlung)
          assert abschluss.beende("K-17", 600, "city") == 150
          assert zahlung.buchungen == [("K-17", 150)]
    solution: |
      import pytest

      from abrechnung import Fahrtabschluss, mietpreis
      from fakes import FakeZahlung


      @pytest.fixture
      def zahlung():
          return FakeZahlung()


      @pytest.fixture
      def abschluss(zahlung):
          return Fahrtabschluss(mietpreis, zahlung)


      @pytest.mark.parametrize(
          "sekunden, rad, cent",
          [
              pytest.param(300, "city", 0, id="genau-5-minuten-fehlstart"),
              pytest.param(301, "city", 150, id="angefangene-6-minute-kostet"),
              pytest.param(1800, "city", 150, id="30-minuten-ein-block"),
              pytest.param(1801, "ebike", 600, id="e-bike-zweiter-block"),
          ],
      )
      def test_preis_aus_sekunden(abschluss, sekunden, rad, cent):
          assert abschluss.beende("K-17", sekunden, rad) == cent


      def test_preis_wird_gebucht(abschluss, zahlung):
          abschluss.beende("K-17", 1801, "ebike")
          assert zahlung.buchungen == [("K-17", 600)]


      def test_fehlstart_bucht_nichts(abschluss, zahlung):
          abschluss.beende("K-17", 120, "city")
          assert zahlung.buchungen == []
    tests:
      - name: Grün gegen die richtige Implementierung
        code: |
          lauf = run_pytest({"abrechnung.py": RICHTIG, "fakes.py": FAKES})
          assert lauf.ok, lauf.output
      - name: Fängt einen Fehler bei der Einheit der Dauer
        code: |
          lauf = run_pytest({"abrechnung.py": MUTANTEN["sekunden"], "fakes.py": FAKES})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl der Tarif jetzt mit Sekunden statt Minuten aufgerufen wird."
      - name: Fängt einen Fehler beim Umrechnen in Minuten
        code: |
          lauf = run_pytest({"abrechnung.py": MUTANTEN["abgerundet"], "fakes.py": FAKES})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl angefangene Minuten jetzt abgerundet werden."
      - name: Fängt eine Buchung, die es nicht geben darf
        code: |
          lauf = run_pytest({"abrechnung.py": MUTANTEN["nullbuchung"], "fakes.py": FAKES})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl jetzt auch 0 Cent bei Paystream gebucht werden."
      - name: Fängt einen Fehler im Tarif selbst
        code: |
          lauf = run_pytest({"abrechnung.py": MUTANTEN["tarif"], "fakes.py": FAKES})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl das E-Bike jetzt den falschen Satz kostet."
    hints:
      - "Übergib `mietpreis` selbst als Tarif: `Fahrtabschluss(mietpreis, FakeZahlung())`."
      - "Die Umrechnung hat eigene Grenzen: 300 Sekunden sind genau 5 Minuten, 301 Sekunden schon 6. Kombiniere sie mit den Grenzen des Tarifs."
      - Prüf neben dem Rückgabewert auch `zahlung.buchungen` – einmal für eine bezahlte Fahrt, einmal für einen Fehlstart. Und nimm mindestens einmal das E-Bike.
    explanation: |
      Der solitary Test im Editor prüft nur, dass `beende` weiterreicht, was der Tarif liefert. Weil sein Tarif die Argumente ignoriert, sieht er weder Sekunden statt Minuten noch eine falsche Rundung noch einen Fehler in `mietpreis`. Mit dem echten Tarif fallen alle drei auf, sobald die Testwerte an den Grenzen liegen: 300 und 301 Sekunden für die Umrechnung und den Fehlstart, 1801 Sekunden mit dem E-Bike für den Satz. Der Fake ersetzt nur Paystream, das langsam und fremd ist; an seiner Liste `buchungen` siehst du, ob gebucht wurde, auch dass bei 0 Cent nichts gebucht wird. Wird ein solcher sociable Test wegen eines Tariffehlers rot, zeigen die Unit-Tests von `mietpreis` daneben, wo der Fehler sitzt.
    resources:
      - title: Martin Fowler · UnitTest – Solitary or Sociable?
        url: https://martinfowler.com/bliki/UnitTest.html#SolitaryOrSociable
      - title: The Practical Test Pyramid · Sociable and Solitary
        url: https://martinfowler.com/articles/practical-test-pyramid.html#SociableAndSolitary

  - id: fokussierter-test
    type: code
    title: Vom Rundum-Test zu fokussierten Tests
    prompt: |
      `radwerk.py` enthält `mietpreis(minuten, rad)` – 0 Cent bis einschließlich 5 Minuten, sonst je angefangene 30 Minuten 150 Cent (`"city"`) oder 300 Cent (`"ebike"`) – und die Klasse `Kasse(zahlung, postfach)`. `Kasse.fahrt_beenden(fahrt_id, kunde_id, minuten, rad)` berechnet den Preis mit `mietpreis`, bucht ihn mit `zahlung.buche(kunde_id, cent)`, wenn er größer als 0 ist, hängt eine Bestätigung an die Liste `postfach` an und gibt den Preis zurück. Die Bestätigung enthält immer den Betrag im Format `3,00 €`; ihren übrigen Wortlaut ändert das Marketing regelmäßig. `FakeZahlung` aus `fakes.py` sammelt Buchungen als `(kunde_id, cent)` in `buchungen`.

      Der Test im Editor prüft alles in einem Durchgang. Er bricht, sobald sich der Text der Bestätigung ändert, und prüft den Tarif nur mit 45 und 3 Minuten. Ersetze ihn durch fokussierte Tests: die Tarifregeln mit ihren Grenzen direkt an `mietpreis`, das Zusammenspiel in der `Kasse` mit wenigen Tests, die nicht vom Wortlaut der Bestätigung abhängen.
    lang: python
    setup: |
      from pathlib import Path

      RICHTIG = '''
      SATZ = {"city": 150, "ebike": 300}


      def mietpreis(minuten, rad):
          if minuten <= 5:
              return 0
          return (minuten + 29) // 30 * SATZ[rad]


      def bestaetigung(fahrt_id, cent):
          return f"Danke für deine Fahrt {fahrt_id}! Betrag: {cent // 100},{cent % 100:02d} €"


      class Kasse:
          def __init__(self, zahlung, postfach):
              self.zahlung = zahlung
              self.postfach = postfach

          def fahrt_beenden(self, fahrt_id, kunde_id, minuten, rad):
              cent = mietpreis(minuten, rad)
              if cent > 0:
                  self.zahlung.buche(kunde_id, cent)
              self.postfach.append(bestaetigung(fahrt_id, cent))
              return cent
      '''
      FAKES = '''
      class FakeZahlung:
          def __init__(self):
              self.buchungen = []

          def buche(self, kunde_id, cent):
              self.buchungen.append((kunde_id, cent))
      '''
      NEUER_TEXT = RICHTIG.replace(
          'f"Danke für deine Fahrt {fahrt_id}! Betrag: {cent // 100},{cent % 100:02d} €"',
          'f"Fahrt {fahrt_id} beendet – {cent // 100},{cent % 100:02d} €. Bis zum nächsten Mal bei Radwerk!"',
      )
      MUTANTEN = {
          "blockgrenze": RICHTIG.replace("(minuten + 29) // 30", "(minuten // 30 + 1)"),
          "fehlstart": RICHTIG.replace("if minuten <= 5:", "if minuten < 5:"),
          "nullbuchung": RICHTIG.replace("        if cent > 0:\n            self.zahlung.buche", "        self.zahlung.buche"),
      }
      assert NEUER_TEXT != RICHTIG and all(m != RICHTIG for m in MUTANTEN.values()), "Eine Variante ist identisch mit der richtigen Version."
      Path("radwerk.py").write_text(RICHTIG, encoding="utf-8")
      Path("fakes.py").write_text(FAKES, encoding="utf-8")
    starter: |
      from fakes import FakeZahlung
      from radwerk import Kasse, mietpreis


      def test_fahrt_beenden():
          zahlung, postfach = FakeZahlung(), []
          kasse = Kasse(zahlung, postfach)
          assert kasse.fahrt_beenden(1204, "K-17", 45, "city") == 300
          assert zahlung.buchungen == [("K-17", 300)]
          assert postfach == ["Danke für deine Fahrt 1204! Betrag: 3,00 €"]
          assert kasse.fahrt_beenden(1205, "K-17", 3, "ebike") == 0
          assert zahlung.buchungen == [("K-17", 300)]
          assert postfach[-1] == "Danke für deine Fahrt 1205! Betrag: 0,00 €"
    solution: |
      import pytest

      from fakes import FakeZahlung
      from radwerk import Kasse, mietpreis


      @pytest.mark.parametrize(
          "minuten, rad, cent",
          [
              pytest.param(5, "city", 0, id="fehlstart-letzte-minute"),
              pytest.param(6, "city", 150, id="erste-bezahlte-minute"),
              pytest.param(30, "city", 150, id="ein-block-voll"),
              pytest.param(31, "city", 300, id="zweiter-block-beginnt"),
              pytest.param(31, "ebike", 600, id="e-bike-zweiter-block"),
          ],
      )
      def test_mietpreis(minuten, rad, cent):
          assert mietpreis(minuten, rad) == cent


      @pytest.fixture
      def zahlung():
          return FakeZahlung()


      @pytest.fixture
      def postfach():
          return []


      @pytest.fixture
      def kasse(zahlung, postfach):
          return Kasse(zahlung, postfach)


      def test_bezahlte_fahrt_wird_gebucht(kasse, zahlung):
          assert kasse.fahrt_beenden(1204, "K-17", 45, "city") == 300
          assert zahlung.buchungen == [("K-17", 300)]


      def test_fehlstart_wird_nicht_gebucht(kasse, zahlung):
          kasse.fahrt_beenden(1205, "K-17", 3, "ebike")
          assert zahlung.buchungen == []


      def test_bestaetigung_nennt_den_betrag(kasse, postfach):
          kasse.fahrt_beenden(1204, "K-17", 45, "city")
          assert len(postfach) == 1
          assert "3,00 €" in postfach[0]
    tests:
      - name: Grün gegen die richtige Implementierung
        code: |
          lauf = run_pytest({"radwerk.py": RICHTIG, "fakes.py": FAKES})
          assert lauf.ok, lauf.output
      - name: Grün, wenn sich nur der Wortlaut der Bestätigung ändert
        code: |
          lauf = run_pytest({"radwerk.py": NEUER_TEXT, "fakes.py": FAKES})
          assert lauf.ok, "Deine Tests brechen, obwohl sich nur der Text der Bestätigung geändert hat:\n" + lauf.output
      - name: Fängt einen Fehler an einer Blockgrenze
        code: |
          lauf = run_pytest({"radwerk.py": MUTANTEN["blockgrenze"], "fakes.py": FAKES})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl eine Fahrt, die genau auf einer Blockgrenze endet, einen Block zu viel kostet."
      - name: Fängt einen Fehler an der Fehlstart-Grenze
        code: |
          lauf = run_pytest({"radwerk.py": MUTANTEN["fehlstart"], "fakes.py": FAKES})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl eine Fahrt an der Fehlstart-Grenze jetzt etwas kostet."
      - name: Fängt eine Buchung über 0 Cent
        code: |
          lauf = run_pytest({"radwerk.py": MUTANTEN["nullbuchung"], "fakes.py": FAKES})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl Fehlstarts jetzt mit 0 Cent gebucht werden."
    hints:
      - "Trenne zwei Fragen: Rechnet der Tarif richtig? Und: Tut die `Kasse` mit dem Preis das Richtige?"
      - Die Tarifregeln gehören in einen parametrisierten Test von `mietpreis` mit Werten an den Grenzen 5/6 und 30/31.
      - Für die Bestätigung prüfst du nur, was zugesagt ist – dass es eine gibt und dass der Betrag darin steht, etwa mit `"3,00 €" in postfach[0]`.
    explanation: |
      Der Rundum-Test hat drei Schwächen. Er prüft die Tarifregeln nur mit 45 und 3 Minuten, also mitten in ihren Klassen, und übersieht deshalb beide Grenzfehler. Er hängt am vollen Wortlaut der Bestätigung und bricht bei jeder Textänderung des Marketings. Und wenn er rot wird, sagt sein Name nicht, welche der sechs Prüfungen gemeint ist. Fokussierte Tests trennen die Fragen: Die Tarifregeln stehen mit Grenzwerten an `mietpreis`, die `Kasse` bekommt je einen Test für Buchung, Fehlstart ohne Buchung und Bestätigung. Für die Bestätigung prüfst du nur, was zugesagt ist.
    resources:
      - title: The Practical Test Pyramid · Writing Clean Test Code
        url: https://martinfowler.com/articles/practical-test-pyramid.html#WritingCleanTestCode
      - title: pytest · How to use fixtures
        url: https://docs.pytest.org/en/stable/how-to/fixtures.html

  - id: suite-aufraeumen
    type: choice
    title: Doppelt oder am falschen Ort?
    prompt: |
      So sieht ein Ausschnitt der Radwerk-Suite aus. Die Unit-Tests decken alle Tarifgrenzen für City-Rad und E-Bike ab, aber keine Fahrt über Mitternacht. Welche Tests würdest du streichen oder auf eine tiefere Ebene verschieben?
    lang: text
    code: |
      tests/unit/test_tarif.py                12 Tests      0,04 s
      tests/unit/test_tagespreis.py            2 Tests      0,01 s
        test_tageshoechstpreis_city
        test_tageshoechstpreis_e_bike
      tests/api/test_fahrten_api.py            4 Tests      1,90 s
        test_beenden_liefert_200_und_preis
        test_beenden_e_bike_31_minuten_kostet_600
        test_beenden_ohne_token_liefert_401
        test_beenden_zweimal_liefert_409
      tests/e2e/ausleihe.spec.ts               3 Tests     71,00 s
        Ausleihe bis Quittung mit dem City-Rad
        E-Bike: 31 Minuten kosten 6,00 €
        Fahrt über Mitternacht zählt zum Starttag
    options:
      - text: "`test_beenden_e_bike_31_minuten_kostet_600`"
        correct: true
        why: Dieselbe Tarifregel steht schon im Unit-Test. Dass der Endpunkt den Tarif benutzt, zeigt bereits `test_beenden_liefert_200_und_preis`.
      - text: „E-Bike – 31 Minuten kosten 6,00 €“ im Browser
        correct: true
        why: Wiederholt die Tarifregel zum dritten Mal, zum höchsten Preis. Ob der Preis richtig formatiert angezeigt wird, prüft ein Komponententest im Frontend genauer.
      - text: „Fahrt über Mitternacht zählt zum Starttag“ im Browser
        correct: true
        why: Am falschen Ort. Das ist Tageslogik mit Zeitzone, ein Unit-Test mit festen Zeitpunkten zeigt sie zuverlässig. Im Browser hängt das Ergebnis davon ab, wann der Test läuft – und auf Unit-Ebene fehlt der Fall bisher ganz.
      - text: "`test_beenden_ohne_token_liefert_401`"
        correct: false
        why: Authentifizierung passiert in der HTTP-Schicht. Der API-Test ist die niedrigste Ebene, die das zeigt.
      - text: "`test_beenden_zweimal_liefert_409`"
        correct: false
        why: Der Statuscode für einen Konflikt ist eine Zusage der API an ihre Clients. Auch das zeigt erst der API-Test.
      - text: „Ausleihe bis Quittung mit dem City-Rad“ im Browser
        correct: false
        why: Der eine Ablauf, der beweist, dass Frontend, API, Datenbank und Zahlung zusammen funktionieren. Den behältst du.
    explanation: |
      Zwei Tests wiederholen eine Regel, die tiefer schon geprüft ist: Sie kosten Laufzeit und machen bei einem Tariffehler drei Tests rot, von denen nur der Unit-Test die Ursache nennt. Einer prüft Logik auf einer Ebene, die sie nicht zuverlässig zeigen kann; er gehört als Unit-Test mit festen Zeitpunkten nach unten. Die übrigen Tests prüfen jeweils etwas, das nur auf ihrer Ebene sichtbar wird: Statuscodes und Authentifizierung in der API, das Zusammenspiel aller Teile im Browser.
    resources:
      - title: The Practical Test Pyramid · Avoid Test Duplication
        url: https://martinfowler.com/articles/practical-test-pyramid.html#AvoidTestDuplication

  - id: versteckte-abhaengigkeit
    type: bug
    title: Small Tests, die keine sind
    prompt: |
      Diese Datei liegt in `tests/unit/` und läuft im schnellen Teil der Suite. Dort gilt die Team-Regel für small Tests: kein Netz, keine Dateien, keine echte Uhr. Auf deinem Laptop ist sie grün. In der CI ist sie heute, am 3. Oktober 2026, rot, und auf einem frischen Runner kommt noch ein `FileNotFoundError` dazu.

      Klick die Zeilen an, die heimlich von Uhr oder Dateisystem abhängen. Korrigiere danach die Zeile mit der Uhr so, dass der Test einen festen Werktag prüft: Dienstag, den 6. Oktober 2026.
    lang: python
    code: |
      from datetime import date
      from pathlib import Path

      from radwerk.tarif import ist_feiertag, lade_saetze, mietpreis


      def test_fehlstart_ist_kostenlos():
          assert mietpreis(5, "city") == 0


      def test_normaler_werktag_ist_kein_feiertag():
          assert ist_feiertag(date.today()) is False


      def test_e_bike_satz_aus_der_konfiguration():
          saetze = lade_saetze(Path.home() / "radwerk" / "saetze.json")
          assert saetze["ebike"] == 300
    lines: [12, 16]
    fix:
      - line: 12
        answers:
          - assert ist_feiertag(date(2026, 10, 6)) is False
          - assert not ist_feiertag(date(2026, 10, 6))
          - assert ist_feiertag(date(year=2026, month=10, day=6)) is False
          - assert not ist_feiertag(date(year=2026, month=10, day=6))
          - assert ist_feiertag(date.fromisoformat("2026-10-06")) is False
          - assert not ist_feiertag(date.fromisoformat("2026-10-06"))
    explanation: |
      `date.today()` macht das Ergebnis vom Kalender abhängig: Der 3. Oktober ist der Tag der Deutschen Einheit, also ist „heute“ ein Feiertag und der Test rot. Mit einem festen Datum prüft er jeden Tag dasselbe. `Path.home()` liest eine Datei aus dem Home-Verzeichnis des Rechners, auf dem der Test läuft – auf deinem Laptop liegt sie dort, auf einem frischen CI-Runner nicht. Ein small Test bekommt seine Daten direkt: Prüfe das Einlesen mit einem Text statt einer Datei, oder markiere den Test als medium und lege die Datei mit `tmp_path` selbst an. Nur `test_fehlstart_ist_kostenlos` ist ein echter small Test.
    resources:
      - title: Software Engineering at Google · Small tests
        url: https://abseil.io/resources/swe-book/html/ch11.html#small_tests
      - title: Python · datetime.date.today
        url: https://docs.python.org/3/library/datetime.html#datetime.date.today

  - id: formen-vergleichen
    type: explain
    title: Pyramide gegen Wabe?
    prompt: |
      Ein Kollege sagt: „Spotify hat gezeigt, dass die Testpyramide falsch ist. Wir löschen unsere Unit-Tests und schreiben nur noch Integrationstests.“ Erkläre ihm, was die Testing Honeycomb empfiehlt, warum sie der Pyramide weniger widerspricht, als es aussieht, und was du für das Radwerk-Backend daraus mitnimmst. Die Wabe in Spotifys eigenen Worten:
    lang: text
    code: |
      Integrated Tests        wenige, am besten keine: Ergebnis hängt von einem anderen System ab
      Integration Tests       die meisten: der Dienst mit echter Datenbank, geprüft über seine API
      Implementation Detail   wenige: isolierte Teile mit eigener Komplexität, etwa ein Log-Parser
    points:
      - Die Wabe ist für Microservices gedacht, deren Komplexität in den Interaktionen liegt, nicht im Inneren.
      - Spotifys „Integration Test“ ähnelt dem, was Fowler einen sociable Unit-Test des ganzen Dienstes nennt; der Streit ist zu großen Teilen einer um Begriffe.
      - Beide Bilder wollen dasselbe vermeiden – Tests, die von fremden Systemen abhängen, langsam oder flaky sind.
      - Auch Spotify behält Implementation Detail Tests für Teile mit eigener Komplexität; beim Radwerk-Tarif sind das die vielen Grenzfälle.
      - Die Wabe nimmt langsamere Suiten und gröbere Fehlermeldungen in Kauf – entscheiden sollte das Risiko, nicht die Form.
    explanation: |
      Die Honeycomb ist eine Antwort auf Microservices: Ein kleiner Dienst hat wenig eigene Logik, sein Risiko liegt darin, wie er Anfragen annimmt, Daten speichert und mit anderen spricht. Deshalb testet Spotify ihn meist als Ganzes, mit echter Datenbank, über seine API. Fowler weist darauf hin, dass diese „Integrationstests“ dem entsprechen, was er sociable Unit-Tests nennt, und dass die Kritik an Unit-Tests sich vor allem gegen solitary Tests mit vielen Mocks richtet. Beide Bilder lehnen Tests ab, die vom Zustand fremder Systeme abhängen. Für Radwerk heißt das: Der Tarif hat viel eigene Logik und braucht seine vielen kleinen Tests – genau dafür behält auch Spotify Implementation Detail Tests. Der Endpunkt „Fahrt beenden“ bekommt dagegen Tests mit echter Datenbank über die API, statt jeden Mitspieler zu mocken.
    resources:
      - title: Spotify Engineering · Testing of Microservices
        url: https://engineering.atspotify.com/2018/01/testing-of-microservices
      - title: Martin Fowler · On the Diverse And Fantastical Shapes of Testing
        url: https://martinfowler.com/articles/2021-test-shapes.html

  - id: grenze-ziehen
    type: code
    title: Die Fachlogik aus dem Adapter lösen
    prompt: |
      Radwerk berechnet pro Kunde, was er je Kalendertag zahlt. Regel (vereinfacht, nur City-Rad): Die Preise aller Fahrten, die an einem Kalendertag in `Europe/Berlin` beginnen, werden addiert; mehr als 1 500 Cent pro Tag werden nie berechnet.

      `tagesabrechnung(pfad)` liest die Fahrten aus einer JSON-Datei und rechnet im selben Schritt. Testen lässt sie sich nur mit Dateien, und sie nimmt das Datum so, wie es im Zeitstempel steht – bei Zeitstempeln in UTC also den UTC-Tag. Das ist der Mitternachtsfehler aus der Lektion.

      Zieh die Grenze zwischen Adapter und Fachlogik:

      - Schreibe die reine Funktion `tagesbetraege(fahrten: list[tuple[datetime, int]]) -> dict[date, int]`. Jedes Element ist `(startzeit, cent)`, die Startzeit hat immer eine Zeitzone. Ergebnis: Kalendertag in Berlin → Betrag, höchstens 1 500. Ohne Fahrten ist das Ergebnis `{}`.
      - `tagesabrechnung(pfad)` liest danach nur noch die Datei – eine Liste von Objekten mit `"start"` (ISO 8601 mit Zeitzone) und `"cent"` – und ruft `tagesbetraege` auf.
    lang: python
    starter: |
      import json
      from datetime import date, datetime
      from pathlib import Path
      from zoneinfo import ZoneInfo

      BERLIN = ZoneInfo("Europe/Berlin")
      TAGESHOECHSTPREIS = 1500


      def tagesabrechnung(pfad):
          fahrten = json.loads(Path(pfad).read_text(encoding="utf-8"))
          summen = {}
          for fahrt in fahrten:
              tag = datetime.fromisoformat(fahrt["start"]).date()
              summen[tag] = summen.get(tag, 0) + fahrt["cent"]
          return {tag: min(betrag, TAGESHOECHSTPREIS) for tag, betrag in summen.items()}


      def tagesbetraege(fahrten):
          ...
    solution: |
      import json
      from datetime import date, datetime
      from pathlib import Path
      from zoneinfo import ZoneInfo

      BERLIN = ZoneInfo("Europe/Berlin")
      TAGESHOECHSTPREIS = 1500


      def tagesbetraege(fahrten):
          summen = {}
          for start, cent in fahrten:
              tag = start.astimezone(BERLIN).date()
              summen[tag] = summen.get(tag, 0) + cent
          return {tag: min(betrag, TAGESHOECHSTPREIS) for tag, betrag in summen.items()}


      def tagesabrechnung(pfad):
          daten = json.loads(Path(pfad).read_text(encoding="utf-8"))
          return tagesbetraege([(datetime.fromisoformat(f["start"]), f["cent"]) for f in daten])
    tests:
      - name: Fahrten eines Tages werden addiert
        code: |
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          berlin = ZoneInfo("Europe/Berlin")
          fahrten = [(datetime(2026, 10, 5, 8, 0, tzinfo=berlin), 300), (datetime(2026, 10, 5, 17, 30, tzinfo=berlin), 450)]
          ergebnis = tagesbetraege(fahrten)
          assert ergebnis == {date(2026, 10, 5): 750}, f"erwartet {{date(2026, 10, 5): 750}}, bekommen {ergebnis!r}"
      - name: Der Tageshöchstpreis greift
        code: |
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          berlin = ZoneInfo("Europe/Berlin")
          fahrten = [(datetime(2026, 10, 5, h, 0, tzinfo=berlin), cent) for h, cent in [(8, 900), (12, 600), (18, 300)]]
          ergebnis = tagesbetraege(fahrten)
          assert ergebnis == {date(2026, 10, 5): 1500}, f"900 + 600 + 300 Cent an einem Tag ergeben höchstens 1500, bekommen {ergebnis!r}"
      - name: Der Kalendertag gilt in Europe/Berlin
        code: |
          from datetime import date, datetime, timezone
          fahrten = [(datetime(2026, 10, 4, 22, 30, tzinfo=timezone.utc), 300), (datetime(2026, 10, 5, 21, 30, tzinfo=timezone.utc), 150)]
          ergebnis = tagesbetraege(fahrten)
          assert ergebnis == {date(2026, 10, 5): 450}, f"22:30 UTC am 4. Oktober ist 0:30 Uhr am 5. Oktober in Berlin – bekommen {ergebnis!r}"
      - name: Ohne Fahrten kein Betrag
        code: |
          ergebnis = tagesbetraege([])
          assert ergebnis == {}, f"erwartet {{}}, bekommen {ergebnis!r}"
      - name: Das Einlesen nutzt die Fachlogik
        code: |
          import json
          from datetime import date
          from pathlib import Path
          Path("fahrten.json").write_text(json.dumps([
              {"start": "2026-10-04T22:30:00+00:00", "cent": 900},
              {"start": "2026-10-05T10:00:00+02:00", "cent": 900},
          ]), encoding="utf-8")
          ergebnis = tagesabrechnung("fahrten.json")
          assert ergebnis == {date(2026, 10, 5): 1500}, f"Beide Fahrten beginnen am 5. Oktober in Berlin – bekommen {ergebnis!r}"
    hints:
      - "`datetime.astimezone(BERLIN)` rechnet eine Startzeit mit Zeitzone in Berliner Zeit um; `.date()` liefert danach den Kalendertag."
      - Summiere erst je Tag in einem Dictionary und begrenze danach jeden Betrag mit `min(betrag, TAGESHOECHSTPREIS)`.
      - "`tagesabrechnung` baut aus der JSON-Liste die Paare `(datetime.fromisoformat(f[\"start\"]), f[\"cent\"])` und gibt sie an `tagesbetraege` weiter."
    explanation: |
      Die Grenze trennt, was die Datei betrifft, von dem, was die Regel betrifft. `tagesbetraege` hat keine I/O und keine Uhr; jeder Fall – Summe, Höchstpreis, Mitternacht, keine Fahrten – ist ein small Test mit festen Zeitpunkten. `.date()` direkt auf einer UTC-Zeit liefert den UTC-Tag; erst `astimezone(BERLIN)` macht aus 22:30 UTC am 4. Oktober den 5. Oktober, 0:30 Uhr. Für den Adapter `tagesabrechnung` bleibt ein einziger medium Test mit Datei, der prüft, dass Einlesen und Weitergabe zusammenpassen. Die Regeln testest du nicht noch einmal über die Datei.
    resources:
      - title: Python · datetime.astimezone
        url: https://docs.python.org/3/library/datetime.html#datetime.datetime.astimezone
      - title: Python · zoneinfo
        url: https://docs.python.org/3/library/zoneinfo.html

  - id: risiken-zuordnen
    type: choice
    title: Risiko trifft Ebene
    prompt: |
      Welche Zuordnungen folgen der Regel „jedes Risiko auf der niedrigsten Ebene, die es zuverlässig zeigt“?
    options:
      - text: Fehlstart-Grenze bei 5 und 6 Minuten → Unit-Test von `mietpreis`
        correct: true
        why: Reine Rechenregel. Ein Unit-Test zeigt sie in Millisekunden und nennt die gebrochene Grenze.
      - text: Tageshöchstpreis bei Fahrten über Mitternacht in `Europe/Berlin` → End-to-End-Test im Browser
        correct: false
        why: Das ist Tageslogik mit Zeitzone. Ein Unit-Test mit festen Zeitpunkten zeigt sie zuverlässig; im Browser hängt das Ergebnis davon ab, wann der Test läuft.
      - text: Das Repository speichert Cent-Beträge in PostgreSQL und liest sie unverändert zurück → Integrationstest gegen eine echte PostgreSQL
        correct: true
        why: Das Risiko steckt in Spaltentyp, Treiber und SQL. Ein Mock der Datenbank kann es nicht zeigen.
      - text: Die Android-App versteht die Antwort der Buchungs-API nach einer Feldumbenennung → Unit-Test des Python-Serializers
        correct: false
        why: Der Serializer-Test kennt nur die Sicht des Backends. Was die App erwartet, sichert ein Contract Test zwischen App und API.
      - text: Eine Kundin leiht auf der Website ein Rad aus, beendet die Fahrt und sieht ihre Quittung → ein End-to-End-Test für genau diesen Ablauf
        correct: true
        why: Dass alle Teile zusammen funktionieren, zeigt nur ein Test durch das ganze System. Ein Ablauf dieser Art reicht.
      - text: Die Signatur eines Paystream-Webhooks wird geprüft → End-to-End-Test gegen die Paystream-Sandbox
        correct: false
        why: Die Signaturprüfung ist eine reine Funktion. Ein Unit-Test mit einer aufgezeichneten Nachricht und einem Testschlüssel zeigt sie schnell und deterministisch; die Sandbox brauchst du dafür nicht.
    explanation: |
      Die Regel fragt zweimal: Wo entsteht der Fehler, und welche Ebene kann an genau diesem Fehler scheitern? Rechen- und Zeitlogik zeigt ein Unit-Test am besten, wenn Zeitpunkte als Parameter kommen. Was erst im Zusammenspiel mit einer echten Datenbank entsteht, braucht die echte Datenbank. Erwartungen eines anderen Teams oder einer anderen App sichert ein Vertrag. Und ein einzelner Ablauf durch das ganze System zeigt, dass alles zusammenpasst. Zu hoch gewählt wird es langsam und unzuverlässig, zu tief gewählt kann der Test den Fehler gar nicht sehen.
    resources:
      - title: The Practical Test Pyramid · Avoid Test Duplication
        url: https://martinfowler.com/articles/practical-test-pyramid.html#AvoidTestDuplication
      - title: Software Engineering at Google · Test Scope
        url: https://abseil.io/resources/swe-book/html/ch11.html#test_scope

  - id: teststrategie-reservierung
    type: practice
    title: Testebenen für die Reservierung
    prompt: |
      Radwerk baut Reservierungen: Eine Reservierung ist ein halboffenes Intervall `[start, ende)`, höchstens 7 Tage im Voraus, und ein Rad hat keine überlappenden Reservierungen. Die Android-App und die Website legen Reservierungen über `POST /reservierungen` an, gespeichert wird in PostgreSQL. Zwei Kundinnen können dasselbe Rad gleichzeitig reservieren wollen.

      Schreib eine Tabelle mit sechs bis acht Risiken. Nenne zu jedem Risiko, wo der Fehler entsteht, die niedrigste Ebene, die ihn zuverlässig zeigt, und einen Satz, warum keine tiefere reicht. Markiere, was du bewusst nicht auf einer höheren Ebene wiederholst.
    lang: text
    solution: |
      1. Ende einer Reservierung = Start der nächsten ist kein Konflikt
         Entsteht in: Fachlogik (Intervallvergleich)
         Ebene: Unit, Werte auf beiden Seiten der Grenze
         Warum nicht tiefer: ist bereits die tiefste Ebene

      2. Genau 7 Tage im Voraus erlaubt, 7 Tage und 1 Minute nicht
         Entsteht in: Fachlogik (Vorlauf)
         Ebene: Unit, "jetzt" als Parameter statt echter Uhr
         Warum nicht tiefer: ist bereits die tiefste Ebene

      3. Ende vor Start wird abgelehnt
         Entsteht in: Fachlogik (Regel) und API-Schicht (Antwort)
         Ebene: Unit für die Regel, ein API-Test für 422
         Warum nicht tiefer: den Statuscode zeigt erst die HTTP-Schicht

      4. Zwei gleichzeitige Anfragen reservieren dasselbe Rad überlappend
         Entsteht in: Datenbank (Constraint, Transaktion, Sperre)
         Ebene: Integration gegen echte PostgreSQL mit zwei Verbindungen
         Warum nicht tiefer: Constraints und Sperren gibt es nur in der echten Datenbank

      5. Konflikt liefert 409 mit dem vereinbarten Fehlerformat
         Entsteht in: API-Schicht
         Ebene: API-Test
         Warum nicht tiefer: das Antwortformat ist eine Zusage an die Clients

      6. Die App versteht die Antwort nach einer Änderung der API
         Entsteht in: Vertrag zwischen App und API
         Ebene: Contract Test
         Warum nicht tiefer: was die App erwartet, weiß das Backend allein nicht

      7. Reservieren, Rad an der Station sehen, Fahrt starten
         Entsteht in: allen Teilen zusammen
         Ebene: ein End-to-End-Test
         Warum nicht tiefer: nur das ganze System zeigt den Ablauf

      Bewusst nicht wiederholt: die Intervall- und Vorlaufregeln (1, 2) in API- und End-to-End-Tests.
      Der API-Test prüft 201, 409 und 422 mit je einem Beispiel.
    checklist:
      - Jede Regel der Reservierung – Intervallgrenze, 7 Tage, keine Überlappung – hat Unit-Tests mit Werten auf beiden Seiten der Grenze.
      - Die Überlappung bei gleichzeitigen Anfragen steht auf Integrationsebene mit echter Datenbank, nicht im Unit-Test.
      - Statuscodes und Fehlerformat stehen bei den API-Tests, ohne die Regelfälle zu wiederholen.
      - Die Zusammenarbeit mit der Android-App ist als Vertrag abgesichert.
      - Es gibt höchstens ein oder zwei End-to-End-Abläufe, jeweils mit Begründung.
      - Zu jeder Zeile steht, warum keine tiefere Ebene reicht.
    explanation: |
      Die Regeln selbst sind reine Logik und gehören mit Grenzwerten in Unit-Tests: Ende gleich Start ist kein Konflikt, sieben Tage sind erlaubt, eine Minute mehr nicht. Die gefährlichste Lücke liegt woanders: Zwei gleichzeitige Anfragen können beide die Prüfung bestehen und trotzdem überlappen. Das verhindert erst ein Constraint oder eine Sperre in PostgreSQL, und zeigen kann es nur ein Test gegen die echte Datenbank mit zwei Verbindungen. Die API-Tests prüfen, was die Clients sehen – Statuscodes und Fehlerformat –, der Vertrag sichert die App ab, und ein einziger Ablauf im Browser zeigt, dass alles zusammenpasst. Jede Regel steht genau einmal, auf der tiefsten Ebene, die sie zeigt.
