id: testpyramide
title: Testpyramide und Testgrenzen
level: 1
minutes: 120
summary: Was ein Test kostet und was er zeigt – Pyramide, Trophy, Honeycomb und Eistüte als Faustregeln mit ihren Annahmen, dazu Testgrößen, Testgrenzen an der Architektur und die Regel, jedes Risiko auf der niedrigsten Ebene zu prüfen, die es zuverlässig zeigt.
goals:
  - Du vergleichst Testebenen nach Geschwindigkeit, Determinismus, Aussagekraft, Wartung und Fehlerlokalisierung.
  - Du erklärst Testpyramide, Testing Trophy und Testing Honeycomb mit ihren Annahmen und Kritikpunkten und erkennst die Eistüte als Anti-Muster.
  - Du unterscheidest solitary und sociable Unit-Tests sowie Googles Testgrößen small, medium und large von der Frage nach dem Umfang eines Tests.
  - Du ziehst Testgrenzen an Architekturgrenzen – Fachlogik, Adapter, Prozessgrenzen – und findest Tests, die heimlich Uhr, Dateisystem oder Netz brauchen.
  - Du ordnest Risiken begründet der niedrigsten Ebene zu, die sie zuverlässig zeigt, und streichst doppelte Prüfungen auf höheren Ebenen.
