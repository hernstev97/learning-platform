id: teststrategie
title: Teststrategie für ein Feature
level: 3
minutes: 180
summary: Ein Feature von der Anforderung bis zum Betrieb durchdenken – Beispiele statt vager Regeln, Risiken nach Wahrscheinlichkeit und Auswirkung, für jedes Risiko die passende Ebene, ein Testplan auf einer Seite, nichtfunktionale und explorative Tests, Review und Kennzahlen. Am Beispiel „Gutscheincodes im Buchungsprozess“.
goals:
  - Du übersetzt vage Anforderungen mit Product Owner und Team in konkrete Beispiele und findest dabei offene Fragen, bevor Code entsteht.
  - Du bewertest die Risiken eines Features nach Wahrscheinlichkeit und Auswirkung und leitest daraus ab, wo Tests sich lohnen und wo nicht.
  - Du ordnest jedem Risiko begründet die niedrigste Testebene zu, die es zuverlässig zeigt, und benennst, was bewusst ungetestet bleibt.
  - Du schreibst einen Testplan auf einer Seite mit nichtfunktionalen Prüfungen und explorativen Sessions.
  - Du beurteilst Tests im Code-Review danach, ob sie Fehler finden, und misst den Erfolg einer Strategie mit Escaped Defects, Change Failure Rate, Laufzeit und Flake-Rate.
  - Du vertrittst deine Teststrategie im Interview in wenigen Minuten, strukturiert von den Risiken her.
