id: contract-testing
title: Contract Testing
level: 3
minutes: 150
summary: Verträge zwischen Diensten prüfen, ohne alle Dienste gemeinsam zu starten – consumer-driven mit Pact, schema-basiert mit OpenAPI, dazu Regeln für Änderungen, die keinen Client brechen.
goals:
  - Du erklärst, warum eine gemeinsame E2E-Umgebung für mehrere Dienste langsam und flaky wird und welche Frage ein Contract Test stattdessen beantwortet.
  - Du beschreibst den Ablauf von Pact – Consumer-Test, Pact-Datei, Provider-Verifikation mit Provider States, Broker und `can-i-deploy` – und schreibst einen Consumer-Test mit Matchern.
  - Du entscheidest zwischen consumer-driven und schema-basierten Verträgen, auch für Drittanbieter wie einen Zahlungsdienst.
  - Du beurteilst, ob eine API-Änderung rückwärtskompatibel ist, und planst einen Breaking Change mit Expand and Contract.
  - Du benennst, was Contract Tests nicht prüfen, und ordnest diese Risiken anderen Testebenen zu.
