      - title: Ruff · The Ruff Formatter
        url: https://docs.astral.sh/ruff/formatter/

  - id: mypy-strict
    type: command
    title: Einmal streng hinschauen
    prompt: Prüfe das Paket unter `src/radwerk` **einmalig** im strengen Modus von mypy, ohne die Konfiguration zu ändern.
    context: mypy ist als Dev-Abhängigkeit im uv-Projekt installiert. Die `pyproject.toml` enthält bisher nur `[tool.mypy]` ohne Optionen.
    answers:
      - uv run mypy --strict src/radwerk
      - uv run mypy --strict src/radwerk/
      - uv run mypy src/radwerk --strict
      - uv run mypy src/radwerk/ --strict
      - mypy --strict src/radwerk
      - mypy --strict src/radwerk/
      - mypy src/radwerk --strict
      - mypy src/radwerk/ --strict
    output: |
      src/radwerk/tarif.py:4: error: Function is missing a type annotation  [no-untyped-def]
      src/radwerk/fahrten.py:13: error: Unsupported left operand type for - ("None")  [operator]
      src/radwerk/fahrten.py:13: note: Left operand is of type "datetime | None"
      src/radwerk/fahrten.py:16: error: Function is missing a type annotation  [no-untyped-def]
      src/radwerk/abrechnung.py:4: error: Function is missing a type annotation  [no-untyped-def]
      Found 4 errors in 3 files (checked 4 source files)
    explanation: |
      `--strict` schaltet eine Reihe von Prüfungen ein, darunter `disallow_untyped_defs`, `check_untyped_defs`, `warn_unused_ignores` und `warn_return_any`. Die drei `no-untyped-def`-Meldungen sind der typische erste Eindruck in gewachsenem Code: Ohne Annotationen hat mypy diese Funktionen bisher gar nicht geprüft. Ein einmaliger Lauf zeigt, wie weit der Weg zu `strict = true` ist; danach entscheidest du, welche Module zuerst streng werden.
    resources:
      - title: mypy · --strict
        url: https://mypy.readthedocs.io/en/stable/command_line.html#cmdoption-mypy-strict

  - id: naive-zeit-regel
    type: code
    title: Eine Lint-Regel gegen naive Zeitpunkte
    prompt: |
      Nach dem Abrechnungsfehler will das Radwerk-Team eine eigene Prüfung, die auch in Skripten außerhalb des Ruff-Laufs greift. Schreibe `naive_zeitpunkte(quelltext: str) -> list[int]`. Sie gibt die Zeilennummern aller Aufrufe zurück, die einen Zeitpunkt ohne Zeitzone erzeugen:

      - `….now()` auf `datetime` oder `datetime.datetime`, wenn **kein** Zeitzonen-Argument übergeben wird oder das Argument die Konstante `None` ist. Das Zeitzonen-Argument ist das erste Positionsargument oder das Schlüsselwort `tz`.
      - `….utcnow()` und `….today()` auf `datetime` oder `datetime.datetime` – immer, denn beide liefern naive Zeitpunkte.
      - Aufrufe auf anderen Objekten (`uhr.now()`, `date.today()`, `self.datetime.now()`) werden nicht gemeldet. Importe unter anderem Namen musst du nicht auflösen.
      - Die Liste ist aufsteigend sortiert; zwei Treffer in einer Zeile ergeben die Zeile zweimal.

      Nutze `ast.parse` und `ast.walk` oder einen `ast.NodeVisitor`.
    lang: python
    starter: |
      import ast


      def naive_zeitpunkte(quelltext: str) -> list[int]:
          zeilen: list[int] = []
          for knoten in ast.walk(ast.parse(quelltext)):
              ...
          return sorted(zeilen)
    solution: |
      import ast


      def _ist_datetime_klasse(knoten: ast.expr) -> bool:
          if isinstance(knoten, ast.Name):
              return knoten.id == "datetime"
          return (
              isinstance(knoten, ast.Attribute)
              and knoten.attr == "datetime"
              and isinstance(knoten.value, ast.Name)
              and knoten.value.id == "datetime"
          )


      def _zeitzone(aufruf: ast.Call) -> ast.expr | None:
          if aufruf.args:
              return aufruf.args[0]
          for argument in aufruf.keywords:
              if argument.arg == "tz":
                  return argument.value
          return None


      def naive_zeitpunkte(quelltext: str) -> list[int]:
          zeilen: list[int] = []
          for knoten in ast.walk(ast.parse(quelltext)):
              if not isinstance(knoten, ast.Call) or not isinstance(knoten.func, ast.Attribute):
                  continue
              if not _ist_datetime_klasse(knoten.func.value):
                  continue
              methode = knoten.func.attr
              if methode in ("utcnow", "today"):
                  zeilen.append(knoten.lineno)
              elif methode == "now":
                  zeitzone = _zeitzone(knoten)
                  if zeitzone is None or (isinstance(zeitzone, ast.Constant) and zeitzone.value is None):
                      zeilen.append(knoten.lineno)
          return sorted(zeilen)
    tests:
      - name: now() ohne Argument wird gemeldet
        code: |
          ergebnis = naive_zeitpunkte("from datetime import datetime\njetzt = datetime.now()\n")
          assert ergebnis == [2], f"erwartet [2], bekommen {ergebnis}"
      - name: Mit Zeitzone bleibt es still
        code: |
          quelle = "from datetime import datetime, UTC\na = datetime.now(UTC)\nb = datetime.now(tz=UTC)\n"
          ergebnis = naive_zeitpunkte(quelle)
          assert ergebnis == [], f"Aufrufe mit Zeitzone sind in Ordnung, bekommen {ergebnis}"
      - name: Voll qualifiziert und tz=None
        code: |
          quelle = (
              "import datetime\n"
              "a = datetime.datetime.now()\n"
              "b = datetime.datetime.now(datetime.UTC)\n"
              "c = datetime.datetime.now(tz=None)\n"
              "d = datetime.datetime.now(None)\n"
          )
          ergebnis = naive_zeitpunkte(quelle)
          assert ergebnis == [2, 4, 5], f"erwartet [2, 4, 5], bekommen {ergebnis}"
      - name: utcnow und today zählen, andere Objekte nicht
        code: |
          quelle = (
              "a = datetime.utcnow()\n"
              "b = datetime.today()\n"
              "c = date.today()\n"
              "d = uhr.now()\n"
              "e = self.datetime.now()\n"
          )
          ergebnis = naive_zeitpunkte(quelle)
          assert ergebnis == [1, 2], f"erwartet [1, 2], bekommen {ergebnis}"
      - name: Zwei Treffer in einer Zeile, Treffer in Funktionen
        code: |
          quelle = '''from datetime import datetime
          from zoneinfo import ZoneInfo

          BERLIN = ZoneInfo("Europe/Berlin")


          def stichtag():
              return datetime.now(BERLIN).date()


          def protokoll(text):
              print(datetime.now(), text)
              start, ende = datetime.now(), datetime.utcnow()
          '''
          ergebnis = naive_zeitpunkte(quelle)
          assert ergebnis == [12, 13, 13], f"erwartet [12, 13, 13], bekommen {ergebnis}"
    hints:
      - "Ein Aufruf ist ein `ast.Call`. Bei `datetime.now()` ist `func` ein `ast.Attribute` mit `attr == \"now\"` und `value` = `ast.Name(id=\"datetime\")`."
      - "Für `datetime.datetime.now()` ist `func.value` selbst ein `ast.Attribute` mit `attr == \"datetime\"`, dessen `value` der Name `datetime` ist."
      - "Das Zeitzonen-Argument steht in `aufruf.args[0]` oder in einem Element von `aufruf.keywords` mit `arg == \"tz\"`. `None` im Code ist ein `ast.Constant` mit `value is None`."
    explanation: |
      Eine Lint-Regel ist eine Funktion über dem Syntaxbaum: Knotentyp prüfen, Struktur vergleichen, Zeile melden. `ast.walk` besucht jeden Knoten, auch in Funktionen und Ausdrücken; die Reihenfolge ist nicht die des Quelltexts, deshalb das `sorted`. Die Regel arbeitet nur mit der Struktur, nicht mit Werten: `datetime.now(BERLIN)` gilt als in Ordnung, egal was `BERLIN` ist. Diese Grenze hat auch Ruffs DTZ005. `import datetime as dt` übersieht deine Regel dagegen; Ruff löst solche Importe über sein semantisches Modell auf und meldet auch `dt.datetime.now()`. Für so etwas lohnt sich eine eigene Regel, wenn eine Fehlerklasse euch wiederholt trifft und kein fertiges Werkzeug sie abdeckt.
    resources:
      - title: Python · ast.walk
        url: https://docs.python.org/3/library/ast.html#ast.walk
      - title: Python · datetime.datetime.now
        url: https://docs.python.org/3/library/datetime.html#datetime.datetime.now

  - id: zahlung-an-der-grenze
    type: code
    title: Repariere die Grenze zu Paystream
    prompt: |
      Der Webhook-Handler übergibt das geparste JSON einer Paystream-Zahlung an `parse_zahlung(daten: object) -> Zahlung`. Die aktuelle Version benutzt `cast` und glaubt alles. Repariere sie, sodass hinter der Funktion die Typen stimmen:

      - `daten` muss ein `dict` sein.
      - Pflichtfelder: `id` (nicht leerer `str`), `betrag_cent` (`int`, **kein** `bool`, nicht negativ), `status` (`"bezahlt"` oder `"abgelehnt"`).
      - Bei jedem Verstoß wirfst du `UngueltigeZahlung` (eine Unterklasse von `ValueError`) – auch bei fehlenden Feldern, nicht `KeyError`. Die Meldung nennt das betroffene Feld.
      - Zusätzliche Felder werden ignoriert, denn Paystream darf neue Felder ergänzen.
    lang: python
    starter: |
      from dataclasses import dataclass
      from typing import Any, Literal, cast

      Status = Literal["bezahlt", "abgelehnt"]


      class UngueltigeZahlung(ValueError):
          """Die Nachricht von Paystream passt nicht zum vereinbarten Format."""


      @dataclass(frozen=True)
      class Zahlung:
          id: str
          betrag_cent: int
          status: Status


      def parse_zahlung(daten: object) -> Zahlung:
          roh = cast(dict[str, Any], daten)
          return Zahlung(id=roh["id"], betrag_cent=roh["betrag_cent"], status=roh["status"])
    solution: |
      from dataclasses import dataclass
      from typing import Literal

      Status = Literal["bezahlt", "abgelehnt"]


      class UngueltigeZahlung(ValueError):
          """Die Nachricht von Paystream passt nicht zum vereinbarten Format."""


      @dataclass(frozen=True)
      class Zahlung:
          id: str
          betrag_cent: int
          status: Status


      def parse_zahlung(daten: object) -> Zahlung:
          if not isinstance(daten, dict):
              raise UngueltigeZahlung(f"Zahlung muss ein Objekt sein, nicht {type(daten).__name__}")
          for feld in ("id", "betrag_cent", "status"):
              if feld not in daten:
                  raise UngueltigeZahlung(f"Feld fehlt: {feld}")
          zahlungs_id = daten["id"]
          if not isinstance(zahlungs_id, str) or not zahlungs_id:
              raise UngueltigeZahlung("id muss ein nicht leerer Text sein")
          betrag = daten["betrag_cent"]
          if isinstance(betrag, bool) or not isinstance(betrag, int):
              raise UngueltigeZahlung(f"betrag_cent muss eine ganze Zahl sein, nicht {betrag!r}")
          if betrag < 0:
              raise UngueltigeZahlung(f"betrag_cent darf nicht negativ sein: {betrag}")
          status = daten["status"]
          if status == "bezahlt" or status == "abgelehnt":
              return Zahlung(zahlungs_id, betrag, status)
          raise UngueltigeZahlung(f"unbekannter status: {status!r}")
    tests:
      - name: Gültige Zahlung mit Zusatzfeld
        code: |
          ergebnis = parse_zahlung({"id": "p-1", "betrag_cent": 300, "status": "bezahlt", "waehrung": "EUR"})
          assert ergebnis == Zahlung("p-1", 300, "bezahlt"), f"bekommen {ergebnis!r}"
      - name: Betrag als Text, Kommazahl oder bool wird abgelehnt
        code: |
          for falsch in ["300", 299.5, True]:
              try:
                  parse_zahlung({"id": "p-2", "betrag_cent": falsch, "status": "bezahlt"})
              except UngueltigeZahlung as fehler:
                  assert "betrag_cent" in str(fehler), f"Die Meldung sollte das Feld nennen: {fehler}"
              else:
                  raise AssertionError(f"betrag_cent={falsch!r} wurde akzeptiert – erwartet war UngueltigeZahlung.")
      - name: Negativer Betrag und unbekannter Status
        code: |
          for daten, feld in [
              ({"id": "p-3", "betrag_cent": -150, "status": "bezahlt"}, "betrag_cent"),
              ({"id": "p-4", "betrag_cent": 150, "status": "offen"}, "status"),
              ({"id": "", "betrag_cent": 150, "status": "bezahlt"}, "id"),
          ]:
              try:
                  parse_zahlung(daten)
              except UngueltigeZahlung as fehler:
                  assert feld in str(fehler), f"Die Meldung sollte {feld} nennen: {fehler}"
              else:
                  raise AssertionError(f"{daten} wurde akzeptiert – erwartet war UngueltigeZahlung.")
      - name: Fehlendes Feld ist kein KeyError
        code: |
          try:
              parse_zahlung({"betrag_cent": 150, "status": "bezahlt"})
          except UngueltigeZahlung as fehler:
              assert "id" in str(fehler), f"Die Meldung sollte das fehlende Feld nennen: {fehler}"
          except KeyError:
              raise AssertionError("KeyError statt UngueltigeZahlung – der Handler könnte das nicht von einem Programmfehler unterscheiden.")
          else:
              raise AssertionError("Eine Zahlung ohne id wurde akzeptiert.")
      - name: Kein Objekt
        code: |
          try:
              parse_zahlung([{"id": "p-5"}])
          except UngueltigeZahlung:
              pass
          else:
              raise AssertionError("Eine Liste wurde als Zahlung akzeptiert.")
    hints:
      - "`isinstance(daten, dict)` grenzt `object` für mypy auf ein `dict` ein; danach darfst du indexieren."
      - "`isinstance(True, int)` ist `True`, weil `bool` eine Unterklasse von `int` ist. Prüfe `bool` zuerst."
      - Prüfe `status` gegen beide erlaubten Werte, bevor du `Zahlung` erzeugst. Werte aus dem geprüften `dict` sind für mypy `Any` – ohne eigene Prüfung ginge jeder Status durch.
    explanation: |
      Das ist die typisierte Grenze aus der Lektion: einmal zur Laufzeit prüfen, danach gelten die Typen, und mypy trägt sie weiter. `cast` hätte jeden der Testfälle durchgelassen – auch `299.5`, das sonst als halber Cent in der Abrechnung landet. Der `bool`-Fall ist die klassische Falle: `True` besteht `isinstance(x, int)`. Eine eigene Ausnahmeklasse lässt den Handler gezielt mit 400 antworten, statt jeden `KeyError` wie einen Programmfehler zu behandeln; nebenbei bleibt Ruff still, denn TRY004 meldet `raise ValueError` direkt nach einer `isinstance`-Prüfung. In echten Projekten übernimmt oft pydantic diese Arbeit – den Test mit echten Beispielnachrichten brauchst du trotzdem.
    resources:
      - title: mypy · Type narrowing
        url: https://mypy.readthedocs.io/en/stable/type_narrowing.html
      - title: Ruff · type-check-without-type-error (TRY004)
        url: https://docs.astral.sh/ruff/rules/type-check-without-type-error/

  - id: vertauschte-argumente
    type: bug
    title: Alle Fahrten gratis
    prompt: |
      Die Monatsrechnung zeigt für jeden Kunden 0 Cent. Die Unit-Tests für `fahrtpreis` sind grün, für `monatsrechnung` gibt es noch keine. `mypy --strict` meldet für diese Datei einen Fehler mit dem Code `arg-type`. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      from dataclasses import dataclass


      @dataclass
      class Fahrt:
          kunde_id: str
          minuten: int
          e_bike: bool


      def fahrtpreis(minuten: int, e_bike: bool) -> int:
          if minuten <= 5:
              return 0
          return -(-minuten // 30) * (300 if e_bike else 150)


      def monatsrechnung(fahrten: list[Fahrt]) -> dict[str, int]:
          summen: dict[str, int] = {}
          for fahrt in fahrten:
              preis = fahrtpreis(fahrt.e_bike, fahrt.minuten)
              summen[fahrt.kunde_id] = summen.get(fahrt.kunde_id, 0) + preis
          return summen
    lines: [20]
    fix:
      - line: 20
        answers:
          - preis = fahrtpreis(fahrt.minuten, fahrt.e_bike)
          - preis = fahrtpreis(minuten=fahrt.minuten, e_bike=fahrt.e_bike)
          - preis = fahrtpreis(e_bike=fahrt.e_bike, minuten=fahrt.minuten)
          - preis = fahrtpreis(fahrt.minuten, e_bike=fahrt.e_bike)
    explanation: |
      mypy meldet `Argument 2 to "fahrtpreis" has incompatible type "int"; expected "bool"`. Das erste Argument meldet es nicht: `bool` ist in Python eine Unterklasse von `int`, `False` ist also ein gültiges `minuten`. Zur Laufzeit gilt `False <= 5`, und jede Fahrt kostet 0 Cent. Ein Test hätte den Fehler nur gefunden, wenn er `monatsrechnung` aufruft; mypy findet ihn an dieser und jeder künftigen Aufrufstelle. Schlüsselwortargumente (`e_bike=fahrt.e_bike`) machen solche Vertauschungen auch für Leser sichtbar; Ruff kann mit den `FBT`-Regeln sogar verlangen, dass `bool`-Parameter nur per Schlüsselwort übergeben werden.
    resources:
      - title: mypy · Error codes (arg-type)
        url: https://mypy.readthedocs.io/en/stable/error_code_list.html#check-argument-types-arg-type
      - title: Ruff · flake8-boolean-trap (FBT)
        url: https://docs.astral.sh/ruff/rules/#flake8-boolean-trap-fbt

  - id: vergessenes-await
    type: bug
    title: Bestätigt, aber nie gespeichert
    prompt: |
      Im Radwerk-Frontend bekommen Kundinnen manchmal eine Buchungsbestätigung für eine Buchung, die nicht existiert. Im Log steht dann eine unbehandelte Promise-Ablehnung aus der Datenbankschicht. Die Unit-Tests mit Fake-Speicher und Fake-Mailer sind grün, `tsc --strict` meldet nichts. ESLint mit `tseslint.configs.recommendedTypeChecked` meldet einen Fehler in dieser Datei. Finde die Zeile und korrigiere sie.
    lang: typescript
    code: |
      export type Buchung = { id: string; radId: string; kundeId: string };

      export interface Speicher {
        speichere(buchung: Buchung): Promise<void>;
      }

      export interface Mailer {
        sendeBestaetigung(kundeId: string, buchungId: string): Promise<void>;
      }

      export async function buchen(b: Buchung, speicher: Speicher, mailer: Mailer): Promise<string> {
        speicher.speichere(b);
        await mailer.sendeBestaetigung(b.kundeId, b.id);
        return b.id;
      }
    lines: [12]
    fix:
      - line: 12
        answers:
          - await speicher.speichere(b);
    explanation: |
      Ohne `await` startet `speichere` und `buchen` läuft sofort weiter: Die Mail geht raus, bevor feststeht, ob gespeichert wurde. Scheitert das Speichern, lehnt ein Promise ab, auf das niemand wartet – `buchen` meldet trotzdem Erfolg. Der Compiler erlaubt das, denn ein unbenutzter Rückgabewert ist kein Typfehler. `@typescript-eslint/no-floating-promises` braucht die Typinformation, um zu erkennen, dass hier ein Promise liegen bleibt. Ein `void` davor würde die Meldung zum Schweigen bringen, den Fehler aber behalten. Der Fake-Speicher im Test löst sofort erfolgreich auf, deshalb fällt die Reihenfolge dort nie auf.
    resources:
      - title: typescript-eslint · no-floating-promises
        url: https://typescript-eslint.io/rules/no-floating-promises/

  - id: review-ausnahmen
    type: explain
    title: Die CI ist wieder grün
    prompt: |
      Ein Kollege will mit diesem Pull Request die rote CI nach dem Einschalten von `extend-select = ["S"]` und strengeren mypy-Regeln wieder grün bekommen. Erkläre im Review, was jede der vier Änderungen bewirkt, welche du akzeptierst und was du bei den anderen stattdessen vorschlägst. `kunde_id` kommt aus dem Pfad der HTTP-Anfrage.
    lang: diff
    code: |2
       [tool.ruff.lint.per-file-ignores]
      -"tests/**" = []
      +"tests/**" = ["S101"]
      +"src/radwerk/**" = ["DTZ"]

       [[tool.mypy.overrides]]
      -module = ["radwerk.legacy.*"]
      +module = ["radwerk.legacy.*", "radwerk.abrechnung"]
       ignore_errors = true

       # src/radwerk/repo.py
      -    sql = f"SELECT id, minuten FROM fahrten WHERE kunde_id = '{kunde_id}'"
      +    sql = f"SELECT id, minuten FROM fahrten WHERE kunde_id = '{kunde_id}'"  # noqa: S608
    points:
      - "`S101` für `tests/**` ist in Ordnung: `assert` ist in pytest das Prüfwerkzeug; die Ausnahme gilt nur dort, wo die Regel fachlich nicht passt."
      - "`DTZ` für das ganze Paket schaltet genau die Regel ab, die den Abrechnungsfehler mit der Zeitzone gefunden hätte. Stattdessen die Aufrufe mit `ZoneInfo(\"Europe/Berlin\")` reparieren oder einzelne Zeilen mit Begründung ausnehmen."
      - "`radwerk.abrechnung` in `ignore_errors` nimmt das geschäftskritischste Modul aus der Typprüfung. Die Ausnahmeliste darf nur schrumpfen; neue Fehler beheben oder einzeln mit `# type: ignore[code]` und Grund markieren."
      - "`# noqa: S608` ohne Begründung versteckt eine echte SQL-Injection, weil `kunde_id` aus der Anfrage kommt. Die Abfrage braucht einen Parameter (`… WHERE kunde_id = ?`); `noqa` nur bei Fehlalarmen und mit Grund."
      - Der PR misst Erfolg an der grünen CI statt an behobenen Problemen; eine Baseline mit Ratchet wäre der ehrliche Weg, bestehende Befunde vorübergehend zu dulden.
    explanation: |
      Ich würde nur die erste Änderung annehmen. `assert` in Tests ist kein Sicherheitsproblem; S101 soll verhindern, dass Produktionscode sich auf `assert` verlässt, das unter `python -O` verschwindet. Die zweite Änderung schaltet DTZ für den ganzen Produktionscode ab – also genau die Regel, die den Fehler mit den falschen Kalendertagen gefunden hätte. Die dritte nimmt die Abrechnung, das Modul mit dem meisten Geld, aus der Typprüfung; die Liste der Ausnahmen soll schrumpfen, nicht wachsen. Die vierte ist die gefährlichste: `kunde_id` kommt aus der URL, die Zeile ist eine echte SQL-Injection, und der Kommentar sorgt dafür, dass kein Werkzeug sie je wieder meldet. Hier gehört ein Parameter hin. Wenn die Menge der Befunde zu groß für einen PR ist, ist der ehrliche Weg eine Baseline (`ruff check --add-noqa` für Bestand) plus Ratchet – sichtbar, zählbar und mit dem Ziel, sie abzubauen.
    resources:
      - title: Ruff · Error suppression
        url: https://docs.astral.sh/ruff/linter/#error-suppression
      - title: mypy · Silencing errors based on error codes
        url: https://mypy.readthedocs.io/en/stable/error_codes.html#silencing-errors-based-on-error-codes

  - id: ratchet-pruefen
    type: code
    title: Die Zahl darf nur sinken
    prompt: |
      Das Radwerk-Team hat für den Bestand eine Baseline gespeichert: wie viele Ruff-Befunde jede Datei haben darf. Schreibe den CI-Schritt dazu als Funktion `pruefe_ratchet(befunde, baseline)`:

      - `befunde` sind Ausgabezeilen von `ruff check --output-format concise`, etwa `src/radwerk/repo.py:6:11: S608 Possible SQL injection …`. Zeilen, die nicht mit `Pfad:Zeile:Spalte: ` beginnen (`Found 3 errors.`, `All checks passed!`), ignorierst du.
      - `baseline` ordnet Dateien die erlaubte Zahl zu. Fehlt eine Datei, ist 0 erlaubt.
      - Rückgabe ist ein Tupel `(verstoesse, neue_baseline)`.
      - `verstoesse`: für jede Datei mit mehr Befunden als erlaubt ein Text `"<datei>: <anzahl> statt höchstens <erlaubt>"`, nach Dateiname sortiert.
      - `neue_baseline`: für jede Datei der alten Baseline das Minimum aus erlaubt und aktuell. Einträge mit 0 fallen weg, neue Dateien kommen nicht hinzu. Die Baseline wird also nie lockerer.
    lang: python
    starter: |
      def pruefe_ratchet(befunde: list[str], baseline: dict[str, int]) -> tuple[list[str], dict[str, int]]:
          verstoesse: list[str] = []
          neue_baseline = dict(baseline)
          return verstoesse, neue_baseline
    solution: |
      import re
      from collections import Counter

      BEFUND = re.compile(r"^(?P<datei>.+?):\d+:\d+: ")


      def pruefe_ratchet(befunde: list[str], baseline: dict[str, int]) -> tuple[list[str], dict[str, int]]:
          aktuell = Counter(
              treffer["datei"] for zeile in befunde if (treffer := BEFUND.match(zeile))
          )
          verstoesse = [
              f"{datei}: {anzahl} statt höchstens {baseline.get(datei, 0)}"
              for datei, anzahl in sorted(aktuell.items())
              if anzahl > baseline.get(datei, 0)
          ]
          neue_baseline = {
              datei: min(erlaubt, aktuell[datei])
              for datei, erlaubt in baseline.items()
              if min(erlaubt, aktuell[datei]) > 0
          }
          return verstoesse, neue_baseline
    setup: |
      BEFUNDE = [
          "src/radwerk/abrechnung.py:4:35: DTZ005 `datetime.datetime.now()` called without a `tz` argument",
          "src/radwerk/abrechnung.py:10:13: E722 Do not use bare `except`",
          "src/radwerk/repo.py:6:11: S608 Possible SQL injection vector through string-based query construction",
          "Found 3 errors.",
      ]
    tests:
      - name: Unverändert bleibt alles grün
        code: |
          baseline = {"src/radwerk/abrechnung.py": 2, "src/radwerk/repo.py": 1}
          ergebnis = pruefe_ratchet(BEFUNDE, baseline)
          assert ergebnis == ([], baseline), f"bekommen {ergebnis}"
      - name: Weniger Befunde verschärfen die Baseline
        code: |
          baseline = {"src/radwerk/abrechnung.py": 5, "src/radwerk/repo.py": 1, "src/radwerk/alt.py": 4}
          verstoesse, neu = pruefe_ratchet(BEFUNDE, baseline)
          assert verstoesse == [], f"Keine Datei hat mehr Befunde als erlaubt, bekommen {verstoesse}"
          assert neu == {"src/radwerk/abrechnung.py": 2, "src/radwerk/repo.py": 1}, (
              f"abrechnung.py hat nur noch 2 Befunde, alt.py keinen mehr – bekommen {neu}"
          )
      - name: Mehr Befunde und neue Dateien sind Verstöße
        code: |
          verstoesse, neu = pruefe_ratchet(BEFUNDE, {"src/radwerk/abrechnung.py": 1})
          assert verstoesse == [
              "src/radwerk/abrechnung.py: 2 statt höchstens 1",
              "src/radwerk/repo.py: 1 statt höchstens 0",
          ], f"bekommen {verstoesse}"
          assert neu == {"src/radwerk/abrechnung.py": 1}, f"Die Baseline darf nicht lockerer werden, bekommen {neu}"
      - name: Zusammenfassungszeilen zählen nicht
        code: |
          ergebnis = pruefe_ratchet(["All checks passed!"], {"src/radwerk/repo.py": 3})
          assert ergebnis == ([], {}), f"bekommen {ergebnis}"
    hints:
      - "Mit `re.match(r\"^(.+?):\\d+:\\d+: \", zeile)` bekommst du den Dateinamen als erste Gruppe; `collections.Counter` zählt je Datei."
      - Für die neue Baseline gehst du über die **alte** Baseline, nicht über die aktuellen Befunde – sonst kämen neue Dateien hinzu.
    explanation: |
      Ein Ratchet macht aus einer Baseline ein Ziel: Bestehende Befunde sind geduldet, neue nicht, und jede Verbesserung wird sofort festgeschrieben. Deshalb geht die neue Baseline nur über die alten Einträge und nimmt das Minimum – sie wird nie lockerer. Pro Datei zu zählen ist ein Kompromiss: Wer einen Befund innerhalb einer Datei verschiebt, fällt nicht auf, wer Code zwischen Dateien verschiebt, muss die Baseline bewusst anpassen. Die CI schreibt die neue Baseline zurück, zum Beispiel als Commit eines Bots oder als Hinweis im PR.
    resources:
      - title: basedpyright · Baseline
        url: https://docs.basedpyright.com/latest/benefits-over-pyright/baseline/
      - title: Python · collections.Counter
        url: https://docs.python.org/3/library/collections.html#collections.Counter
