id: statische-analyse
title: Linting, Typechecking und statische Analyse
level: 2
minutes: 150
summary: Welche Fehlerklasse Formatter, Linter, Typchecker, Sicherheitsscanner und Tests jeweils am billigsten finden – und wie du Ruff, mypy, tsc und ESLint so einführst, dass das Team ihren Meldungen glaubt.
goals:
  - Du ordnest einen Fehler der Prüfschicht zu, die ihn am frühesten und billigsten findet, und begründest, wann trotzdem ein Test nötig ist.
  - Du konfigurierst Ruff und mypy in `pyproject.toml` (Regelauswahl, Ausnahmen pro Datei, Strenge pro Modul) und liest ihre Meldungen.
  - Du erklärst, welche Tests ein strenger Typchecker erspart und welche nicht – mit `Any`, `cast` und Daten von außen, in Python und mit `tsc --strict`.
  - Du setzt SAST- und Abhängigkeitsscanner (Ruff-`S`-Regeln, Semgrep, CodeQL, pip-audit, npm audit, Dependabot) gezielt ein und bewertest ihre Befunde.
  - Du führst statische Analyse in gewachsenen Code ein – mit Baseline, Ratchet, begründeten Ausnahmen und klarer Arbeitsteilung zwischen pre-commit und CI.
  - Du schreibst eine eigene kleine Lint-Regel mit `ast`.
