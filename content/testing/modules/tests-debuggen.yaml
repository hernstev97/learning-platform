id: tests-debuggen
title: Fehlgeschlagene Tests debuggen
level: 2
minutes: 120
summary: Ein roter Test ist ein Messergebnis, kein Urteil – du liest den Bericht, reproduzierst lokal, prüfst Hypothesen über Test, Code und Umgebung, grenzt mit einem minimalen Test und git bisect run ein und behebst erst dann.
goals:
  - Du liest Assertion-Diff, Traceback und Kurzfassung eines pytest-Berichts und unterscheidest einen fehlgeschlagenen Test von einem Fehler in der Vorbereitung.
  - Du reproduzierst einen roten Test gezielt mit Node-ID, `-k`, `--lf` und `-x` und untersuchst ihn mit `-vv`, `-l`, `--pdb`, `caplog` und `capsys`.
  - Du entscheidest begründet, ob Test, Code oder Umgebung falsch ist, und prüfst je Experiment genau eine Hypothese.
  - Du stellst Fehler, die nur in der CI auftreten, lokal nach – Zeitzone, Locale, Reihenfolge, Parallelität, Versionen, Umgebungsvariablen, Dateisystem.
  - Du machst aus einem Fehlerbericht zuerst einen minimalen roten Test und findest den verursachenden Commit mit `git bisect run`.
