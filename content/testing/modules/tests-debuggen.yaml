  - id: bugreport-zu-test
    type: code
    title: Vom Bugreport zum roten Test
    prompt: |
      Ein Ticket aus dem Support:

      > Kundennummer 48213, App 4.12 auf Android 15, Zahlung per PayPal. Am Samstag, 3. Oktober: 9:12 Uhr E-Bike ab Hauptbahnhof, 8 Minuten. 10:05 Uhr City-Rad ab Altstadt, 4 Stunden 10 Minuten. 16:40 Uhr City-Rad ab Uni-Campus, 3 Stunden. Abgebucht wurden 25,50 €. Laut Preisliste kostet das City-Rad höchstens 15 € am Tag, und E-Bike bin ich nur 8 Minuten gefahren.

      `tagespreis(fahrten)` aus `abrechnung.py` berechnet den Preis eines Kalendertags in Cent. `fahrten` ist eine Liste von Paaren `(rad, minuten)` in der Reihenfolge der Fahrten, `rad` ist `"city"` oder `"ebike"`. Die Regeln:

      - City-Rad 150 Cent, E-Bike 300 Cent je angefangene 30 Minuten.
      - Fahrten bis einschließlich 5 Minuten kosten 0 Cent.
      - Tageshöchstpreis je Radtyp: Die City-Rad-Fahrten eines Tages kosten zusammen höchstens 1 500 Cent, die E-Bike-Fahrten höchstens 3 000 Cent.

      Bevor jemand den Code anfasst, schreibst du einen **minimalen** pytest-Test, der den Fehler aus dem Ticket zeigt: rot gegen den aktuellen Code, grün gegen eine korrigierte Fassung. Lass weg, was für den Fehler keine Rolle spielt. Die Prüfung führt deinen Test gegen beide Fassungen aus.
    lang: python
    setup: |
      from pathlib import Path

      RICHTIG = '''
      TAKT_CENT = {"city": 150, "ebike": 300}
      DECKEL_CENT = {"city": 1500, "ebike": 3000}


      def fahrtpreis(rad, minuten):
          if minuten <= 5:
              return 0
          return -(-minuten // 30) * TAKT_CENT[rad]


      def tagespreis(fahrten):
          gesamt = 0
          for rad, deckel in DECKEL_CENT.items():
              summe = sum(fahrtpreis(r, minuten) for r, minuten in fahrten if r == rad)
              gesamt += min(summe, deckel)
          return gesamt
      '''
      AKTUELL = RICHTIG.replace(
          '''    gesamt = 0
          for rad, deckel in DECKEL_CENT.items():
              summe = sum(fahrtpreis(r, minuten) for r, minuten in fahrten if r == rad)
              gesamt += min(summe, deckel)
          return gesamt''',
          '''    summe = sum(fahrtpreis(rad, minuten) for rad, minuten in fahrten)
          deckel = DECKEL_CENT[fahrten[0][0]] if fahrten else 0
          return min(summe, deckel)''',
      )
      assert AKTUELL != RICHTIG, "Die fehlerhafte Fassung ist identisch mit der richtigen."
      Path("abrechnung.py").write_text(RICHTIG)
    starter: |
      from abrechnung import tagespreis


      def test_tageshoechstpreis_city_rad():
          ...
    solution: |
      from abrechnung import tagespreis


      def test_city_deckel_gilt_auch_nach_einer_ebike_fahrt():
          # E-Bike zuerst: 300 Cent. City-Rad 330 Minuten: 11 Takte = 1650, gedeckelt auf 1500.
          assert tagespreis([("ebike", 10), ("city", 330)]) == 1800
    tests:
      - name: Grün gegen die korrigierte Abrechnung
        code: |
          lauf = run_pytest({"abrechnung.py": RICHTIG})
          assert lauf.ok, lauf.output
      - name: Rot gegen den Code aus dem Ticket
        code: |
          lauf = run_pytest({"abrechnung.py": AKTUELL})
          assert not lauf.ok, "Dein Test bleibt gegen den aktuellen Code grün. Er zeigt den Fehler aus dem Ticket also nicht. Welche Angabe aus dem Ticket hast du weggelassen, die doch eine Rolle spielt?"
    hints:
      - Rechne das Ticket nach den Regeln nach. Was hätte die Kundin zahlen müssen, und wie kommt man auf 25,50 €?
      - 25,50 € ist die Summe aller drei Fahrten ohne jeden Deckel – und sie liegt unter 30 €, dem Deckel des E-Bikes. Welche Fahrt war die erste des Tages?
      - Zwei Fahrten genügen, eine E-Bike-Fahrt zuerst, dann eine City-Rad-Fahrt über 1 500 Cent, etwa `[("ebike", 10), ("city", 330)]` → 300 + 1 500 = 1 800.
    explanation: |
      Nach den Regeln kostet der Tag 300 Cent für das E-Bike und 1 500 Cent für das City-Rad (1 350 + 900, gedeckelt), zusammen 18,00 €. 25,50 € ist die ungedeckelte Summe: Der aktuelle Code nimmt den Deckel des **ersten** Rads des Tages für alle Fahrten. Weil die Kundin mit dem E-Bike begann, galten 3 000 Cent, und die lagen über der Summe. Für den Test unwichtig sind Kundennummer, App-Version, Zahlungsart, Stationen und Uhrzeiten; wichtig sind die Reihenfolge der Radtypen und eine City-Summe über dem Deckel. Ein Test nur mit City-Fahrten bleibt grün, weil dann der richtige Deckel zufällig der erste ist. Der Name des Tests beschreibt die Regel, nicht das Ticket – so versteht ihn auch, wer das Ticket nie gesehen hat.
    resources:
      - title: The Debugging Book · Reducing Failure-Inducing Inputs
        url: https://www.debuggingbook.org/html/DeltaDebugger.html

  - id: test-oder-code
    type: code
    title: Test falsch oder Code falsch?
    prompt: |
      Nach einem Refactoring der E-Bike-Preise meldet die CI zwei rote Fälle:

      ```console
      $ pytest tests/test_tarif.py -q --tb=short
      .F..F.                                                                   [100%]
      =================================== FAILURES ===================================
      _________________________ test_ebike_preis[6-False-0] __________________________
      tests/test_tarif.py:18: in test_ebike_preis
          assert ebike_preis(minuten, plus) == cent
      E   assert 300 == 0
      E    +  where 300 = ebike_preis(6, False)
      ________________________ test_ebike_preis[33-True-300] _________________________
      tests/test_tarif.py:18: in test_ebike_preis
          assert ebike_preis(minuten, plus) == cent
      E   assert 0 == 300
      E    +  where 0 = ebike_preis(33, True)
      =========================== short test summary info ============================
      FAILED tests/test_tarif.py::test_ebike_preis[6-False-0] - assert 300 == 0
      FAILED tests/test_tarif.py::test_ebike_preis[33-True-300] - assert 0 == 300
      2 failed, 4 passed in 0.10s
      ```

      Die Regeln für `ebike_preis(minuten, plus)` aus `tarif.py`:

      - 300 Cent je angefangene 30 Minuten.
      - Fehlstart: Fahrten bis einschließlich 5 Minuten kosten 0 Cent. Gemeint ist die Dauer der ganzen Fahrt.
      - Mit dem Abo „Radwerk Plus“ (`plus=True`) sind die ersten 30 Minuten jeder Fahrt kostenlos; berechnet werden die angefangenen 30 Minuten danach.

      Entscheide für jeden roten Fall, ob der Test oder der Code falsch ist. Korrigiere den Test dort, wo **er** falsch ist. Einen Fall, der einen echten Fehler im Code zeigt, lässt du rot – den Code behebt eine Kollegin in einem eigenen Commit. Die Prüfung führt deinen Test gegen den aktuellen Code, gegen die korrigierte Fassung und gegen weitere fehlerhafte Varianten aus.
    lang: python
    setup: |
      from pathlib import Path

      RICHTIG = '''
      def ebike_preis(minuten: int, plus: bool = False) -> int:
          if minuten <= 5:
              return 0
          abrechenbar = max(0, minuten - 30) if plus else minuten
          return -(-abrechenbar // 30) * 300
      '''
      AKTUELL = '''
      def ebike_preis(minuten: int, plus: bool = False) -> int:
          abrechenbar = max(0, minuten - 30) if plus else minuten
          if abrechenbar <= 5:
              return 0
          return -(-abrechenbar // 30) * 300
      '''
      FEHLSTART_6 = RICHTIG.replace("minuten <= 5", "minuten <= 6")
      OHNE_PLUS = RICHTIG.replace("max(0, minuten - 30) if plus else minuten", "minuten")
      for variante in (AKTUELL, FEHLSTART_6, OHNE_PLUS):
          assert variante != RICHTIG, "Eine Variante ist identisch mit der richtigen Fassung."
      Path("tarif.py").write_text(RICHTIG)
    starter: |
      import pytest

      from tarif import ebike_preis


      @pytest.mark.parametrize(
          "minuten, plus, cent",
          [
              (5, False, 0),
              (6, False, 0),
              (31, False, 600),
              (30, True, 0),
              (33, True, 300),
              (65, True, 600),
          ],
      )
      def test_ebike_preis(minuten, plus, cent):
          assert ebike_preis(minuten, plus) == cent
    solution: |
      import pytest

      from tarif import ebike_preis


      @pytest.mark.parametrize(
          "minuten, plus, cent",
          [
              (5, False, 0),
              (6, False, 300),
              (31, False, 600),
              (30, True, 0),
              (33, True, 300),
              (65, True, 600),
          ],
      )
      def test_ebike_preis(minuten, plus, cent):
          assert ebike_preis(minuten, plus) == cent
    tests:
      - name: Grün gegen die korrigierte Fassung
        code: |
          lauf = run_pytest({"tarif.py": RICHTIG})
          assert lauf.ok, lauf.output
      - name: Zeigt den echten Fehler im aktuellen Code weiterhin
        code: |
          lauf = run_pytest({"tarif.py": AKTUELL})
          assert not lauf.ok, "Gegen den aktuellen Code ist dein Test grün. Einer der beiden roten Fälle hat einen echten Fehler gezeigt – den darfst du nicht wegkorrigieren."
      - name: Prüft die Fehlstart-Grenze weiterhin
        code: |
          lauf = run_pytest({"tarif.py": FEHLSTART_6})
          assert not lauf.ok, "Eine Variante, in der Fahrten bis 6 Minuten kostenlos sind, bleibt grün. Hast du den Fall an der Fehlstart-Grenze gelöscht statt korrigiert?"
      - name: Prüft das Abo weiterhin
        code: |
          lauf = run_pytest({"tarif.py": OHNE_PLUS})
          assert not lauf.ok, "Eine Variante, die Radwerk Plus ignoriert, bleibt grün."
    hints:
      - Rechne beide roten Fälle nach den Regeln im Auftrag nach, nicht nach dem Code und nicht nach dem Test.
      - 6 Minuten sind mehr als 5 – kein Fehlstart. 33 Minuten mit Plus sind ebenfalls kein Fehlstart; berechnet werden 3 Minuten, also eine angefangene halbe Stunde.
      - Nur `(6, False, 0)` ist falsch; richtig ist `(6, False, 300)`. `(33, True, 300)` bleibt, wie er ist.
    explanation: |
      Der Fall `6-False-0` ist ein Fehler im Test: Sechs Minuten sind kein Fehlstart, der Code liefert zu Recht 300 Cent. Der Fall `33-True-300` zeigt einen Fehler im Code: Er zieht erst die 30 freien Minuten ab und wendet dann die Fehlstart-Regel auf den Rest an. Laut Regel zählt aber die Dauer der ganzen Fahrt, also kosten die 3 Minuten nach der Freizeit eine angefangene halbe Stunde. Ein Test, der jetzt im aktuellen Code noch rot ist, ist genau richtig: Er ist der rote Test, mit dem der Fix beginnt. Wer stattdessen beide Fälle löscht oder `33-True-300` auf 0 setzt, macht die CI grün und versteckt den Fehler. Die Entscheidung „Test oder Code“ fällt an der Anforderung, nie an der Frage, welche Seite sich leichter ändern lässt.
    resources:
      - title: pytest · Parametrizing tests
        url: https://docs.pytest.org/en/stable/how-to/parametrize.html

  - id: falsches-objekt
    type: bug
    title: Der Rabatt, der nicht ankommt
    prompt: |
      Ein Test aus dem Buchungsmodul ist rot:

      ```text
      >       assert buchung.preis_cent == 1350
      E       AssertionError: assert 1500 == 1350
      E        +  where 1500 = Buchung(kunde='lena', preis_cent=1500, gutschein=None).preis_cent
      ```

      Ein Kollege hat schon eine Stunde in `gutschein_anwenden` nach dem Fehler gesucht, weil „der Rabatt nicht abgezogen wird“. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      from dataclasses import dataclass, replace


      @dataclass(frozen=True)
      class Buchung:
          kunde: str
          preis_cent: int
          gutschein: str | None = None


      def gutschein_anwenden(buchung: Buchung, code: str, prozent: int) -> Buchung:
          rabatt = buchung.preis_cent * prozent // 100
          return replace(buchung, preis_cent=buchung.preis_cent - rabatt, gutschein=code)


      def test_gutschein_senkt_den_preis():
          buchung = Buchung(kunde="lena", preis_cent=1500)
          neu = gutschein_anwenden(buchung, "RW-HERBST", prozent=10)
          assert neu.gutschein == "RW-HERBST"
          assert buchung.preis_cent == 1350
    lines: [20]
    fix:
      - line: 20
        answers: ["assert neu.preis_cent == 1350", "assert 1350 == neu.preis_cent"]
    hints:
      - Lies den `where`-Teil genau. Von welchem Objekt stammt die 1500, und welchen Gutschein hat es?
      - "`replace` erzeugt bei einer `frozen` Dataclass ein neues Objekt. Das alte bleibt unverändert."
    explanation: |
      Der Code ist richtig, der Test vergleicht das falsche Objekt. `Buchung` ist unveränderlich (`frozen=True`), `gutschein_anwenden` liefert mit `dataclasses.replace` eine neue Buchung zurück. Der Test prüft danach das alte Objekt, und das kostet weiter 1 500 Cent. Die Meldung „1500 == 1350“ klingt nach „Rabatt nicht abgezogen“, der `where`-Teil verrät den Fehler aber: Das geprüfte Objekt hat `gutschein=None`, während die vorige Zeile `neu.gutschein == "RW-HERBST"` bestanden hat. Bei jeder Meldung, die unmöglich wirkt, lohnt die Frage, ob der Test überhaupt das Ergebnis des Aufrufs ansieht.
    resources:
      - title: Python · dataclasses.replace
        url: https://docs.python.org/3/library/dataclasses.html#dataclasses.replace
      - title: pytest · Assertion introspection
        url: https://docs.pytest.org/en/stable/how-to/assert.html#assert-details

  - id: verschluckte-datei
    type: bug
    title: Auf dem Mac grün, in der CI 0 Cent
    prompt: |
      Auf Lenas Mac ist der Test grün. In der CI (Ubuntu) ist er rot:

      ```text
      tests/test_tarif.py:19: in test_angefangene_halbe_stunde_zaehlt_voll
          assert fahrtpreis(tarif, "city", 31) == 300
      E   AssertionError: assert 0 == 300
      E    +  where 0 = fahrtpreis(Tarif(city_cent=0, ebike_cent=0), 'city', 31)
      ```

      `git ls-files tests/daten` zeigt `tests/daten/Tarife.json`. Den Dateinamen korrigiert Lena gleich danach mit `git mv`. Deine Aufgabe ist eine andere: Die Meldung „0 == 300“ hat das Team auf die falsche Fährte gelockt. Finde die beiden Zeilen, die Fehler in den Testdaten verschleiern, und ändere sie so, dass der Test an der wirklichen Ursache scheitert.
    lang: python
    code: |
      import json
      from pathlib import Path

      import pytest

      from radwerk.tarif import Tarif, fahrtpreis

      DATEN = Path(__file__).parent / "daten"


      @pytest.fixture
      def tarif():
          pfad = DATEN / "tarife.json"
          werte = json.loads(pfad.read_text(encoding="utf-8")) if pfad.exists() else {}
          return Tarif(city_cent=werte.get("city", 0), ebike_cent=werte.get("ebike", 0))


      def test_angefangene_halbe_stunde_zaehlt_voll(tarif):
          assert fahrtpreis(tarif, "city", 31) == 300
    lines: [14, 15]
    fix:
      - line: 14
        answers: ["werte = json.loads(pfad.read_text(encoding=\"utf-8\"))", "werte = json.loads(pfad.read_text())", "werte = json.loads(pfad.read_text(\"utf-8\"))", "werte = json.loads(pfad.read_bytes())", "werte = json.load(pfad.open(encoding=\"utf-8\"))"]
      - line: 15
        answers: ["return Tarif(city_cent=werte[\"city\"], ebike_cent=werte[\"ebike\"])", "return Tarif(ebike_cent=werte[\"ebike\"], city_cent=werte[\"city\"])"]
    hints:
      - Was passiert in der Fixture, wenn die Datei unter genau diesem Namen nicht existiert? Und was, wenn ein Schlüssel fehlt?
      - "Zwei Zeilen ersetzen einen Fehler durch einen Standardwert: `if pfad.exists() else {}` und `.get(…, 0)`."
    explanation: |
      macOS unterscheidet im Dateisystem standardmäßig nicht zwischen `tarife.json` und `Tarife.json`, Linux schon. In der CI existiert der Pfad also nicht, und Zeile 14 macht daraus still ein leeres Dictionary. Zeile 15 macht aus jedem fehlenden Schlüssel einen Tarif von 0 Cent. Der Test scheitert dann an einer Rechnung, die nie das Problem war. Ohne die Ausweichwerte endet die Fixture mit `FileNotFoundError: … tests/daten/tarife.json` – als `ERROR at setup`, also eindeutig als Problem der Vorbereitung, mit dem Pfad in der Meldung. Fixtures und Testdaten sollen laut scheitern: Ein Standardwert, der einen Fehler ersetzt, verlegt die Fehlermeldung an eine Stelle, die nichts damit zu tun hat.
    resources:
      - title: pytest · Fixtures – errors during setup
        url: https://docs.pytest.org/en/stable/how-to/fixtures.html
      - title: git-config · core.ignoreCase
        url: https://git-scm.com/docs/git-config#Documentation/git-config.txt-coreignoreCase

  - id: bisect-skript
    type: explain
    title: Ein Prüfskript für Bisect
    prompt: |
      Für eine Bisect-Suche über 300 Commits hat Lena dieses Skript geschrieben und mit `git bisect run ../pruefe_tagesgrenze.sh` gestartet. Erkläre einem Kollegen, was jede Zeile bewirkt und warum sie so dasteht. Nenne auch eine Schwachstelle.
    lang: bash
    code: |
      #!/bin/sh
      # ../pruefe_tagesgrenze.sh – Aufruf: git bisect run ../pruefe_tagesgrenze.sh
      uv sync --quiet --frozen || exit 125
      uv run python -m pytest -q ../test_zeitzone.py
      status=$?
      if [ "$status" -le 1 ]; then
          exit "$status"
      fi
      exit 125
    points:
      - Skript und Test liegen außerhalb des Repositorys, weil Bisect alte Commits auscheckt, in denen beide nicht existieren.
      - "`uv sync … || exit 125` installiert die Abhängigkeiten des jeweiligen Commits; klappt das nicht, wird der Commit übersprungen statt als schlecht gezählt."
      - "`python -m pytest` setzt das Repository auf `sys.path`, damit der Test außerhalb `radwerk` importieren kann."
      - "pytest-Exit-Codes 0 (grün) und 1 (rote Tests) gehen unverändert an Bisect; 2 bis 5 (Sammelfehler, interner Fehler, Bedienfehler, keine Tests) werden zu 125, damit sie nicht als „schlecht“ zählen."
      - "Schwachstelle: Verursacht der gesuchte Fehler selbst einen Sammelfehler, etwa einen kaputten Import, wird der schuldige Commit übersprungen statt gefunden."
    explanation: |
      Das Skript übersetzt zwischen pytest und Bisect. Bisect kennt drei Antworten: 0 gut, 125 überspringen, 1 bis 127 sonst schlecht. pytest kennt mehr Exit-Codes, und nur 0 und 1 sagen etwas über den Fehler aus. Fehler beim Sammeln (2), interne Fehler (3), Bedienfehler wie eine fehlende Datei (4) und „keine Tests gefunden“ (5) heißen nur „konnte nicht prüfen“ – dafür ist 125 da. Dasselbe gilt für Commits, deren Abhängigkeiten sich nicht installieren lassen. Codes ab 128 darf das Skript nie weiterreichen: Damit bricht Bisect die ganze Suche ab. `--frozen` installiert genau das, was im `uv.lock` des Commits steht, ohne es zu aktualisieren. Die Schwachstelle: Wenn der gesuchte Fehler den Import selbst bricht, überspringt das Skript ihn. Bisect meldet dann am Ende mehrere Kandidaten statt eines Commits – das ist ehrlicher als ein falscher Schuldiger, aber du musst die Kandidaten von Hand ansehen.
    resources:
      - title: git-bisect · bisect run
        url: https://git-scm.com/docs/git-bisect#_bisect_run
      - title: pytest · Exit codes
        url: https://docs.pytest.org/en/stable/reference/exit-codes.html

  - id: eingabe-minimieren
    type: code
    title: Weglassen, bis nur der Fehler übrig ist
    prompt: |
      Schreibe `minimiere(eingabe, scheitert)`. `eingabe` ist eine Liste, `scheitert(liste)` eine Funktion, die `True` liefert, wenn der Fehler mit dieser Liste auftritt.

      - Gilt `scheitert(eingabe)` nicht, wirft die Funktion `ValueError`.
      - Sonst liefert sie eine Teilliste von `eingabe` – die Reihenfolge der übrigen Elemente bleibt erhalten –, für die `scheitert` weiterhin `True` liefert und aus der sich **kein einzelnes Element** mehr entfernen lässt, ohne dass der Fehler verschwindet.
      - `eingabe` selbst bleibt unverändert.

      Mit dieser Funktion schrumpft ein Bugreport mit vielen Fahrten automatisch auf die Fahrten, die den Fehler auslösen. Die Prüfung verwendet dafür zum Beispiel `scheitert = lambda f: tagespreis_alt(f) != tagespreis_neu(f)`.
    lang: python
    setup: |
      TAKT = {"city": 150, "ebike": 300}
      DECKEL = {"city": 1500, "ebike": 3000}


      def fahrtpreis(rad, minuten):
          return 0 if minuten <= 5 else -(-minuten // 30) * TAKT[rad]


      def tagespreis_neu(fahrten):
          return sum(min(sum(fahrtpreis(r, m) for r, m in fahrten if r == rad), DECKEL[rad]) for rad in DECKEL)


      def tagespreis_alt(fahrten):
          summe = sum(fahrtpreis(r, m) for r, m in fahrten)
          return min(summe, DECKEL[fahrten[0][0]]) if fahrten else 0


      def ist_1_minimal(ergebnis, scheitert):
          return all(not scheitert(ergebnis[:i] + ergebnis[i + 1:]) for i in range(len(ergebnis)))
    starter: |
      def minimiere(eingabe: list, scheitert) -> list:
          if not scheitert(eingabe):
              raise ValueError("Die Eingabe zeigt den Fehler nicht.")
          return eingabe
    solution: |
      def minimiere(eingabe: list, scheitert) -> list:
          aktuell = list(eingabe)
          if not scheitert(aktuell):
              raise ValueError("Die Eingabe zeigt den Fehler nicht.")
          geaendert = True
          while geaendert:
              geaendert = False
              i = 0
              while i < len(aktuell):
                  kandidat = aktuell[:i] + aktuell[i + 1:]
                  if scheitert(kandidat):
                      aktuell = kandidat
                      geaendert = True
                  else:
                      i += 1
          return aktuell
    tests:
      - name: Zwei nötige Elemente bleiben in ihrer Reihenfolge übrig
        code: |
          raeder = ["R-101", "R-117", "R-150", "R-204", "R-233"]
          ergebnis = minimiere(raeder, lambda l: "R-117" in l and "R-204" in l)
          assert ergebnis == ["R-117", "R-204"], f"erwartet ['R-117', 'R-204'], bekommen {ergebnis!r}"
      - name: Ein Fahrtenprotokoll schrumpft auf die auslösenden Fahrten
        code: |
          fahrten = [("ebike", 8), ("city", 20), ("city", 250), ("ebike", 4), ("city", 180), ("city", 12), ("ebike", 45)]
          scheitert = lambda f: tagespreis_alt(f) != tagespreis_neu(f)
          ergebnis = minimiere(fahrten, scheitert)
          assert scheitert(ergebnis), f"Mit {ergebnis!r} tritt der Fehler nicht mehr auf."
          assert ist_1_minimal(ergebnis, scheitert), f"Aus {ergebnis!r} lässt sich noch eine Fahrt entfernen, ohne dass der Fehler verschwindet."
          assert all(f in fahrten for f in ergebnis), f"{ergebnis!r} enthält Fahrten, die nicht in der Eingabe standen."
      - name: Ergebnis ist eine Teilliste mit erhaltener Reihenfolge
        code: |
          zahlen = [9, 4, 7, 1, 8, 3, 6]
          ergebnis = minimiere(zahlen, lambda l: sum(l) >= 20)
          it = iter(zahlen)
          assert all(z in it for z in ergebnis), f"{ergebnis!r} ist keine Teilliste von {zahlen!r} in derselben Reihenfolge."
          assert sum(ergebnis) >= 20 and ist_1_minimal(ergebnis, lambda l: sum(l) >= 20), f"{ergebnis!r} ist nicht minimal."
      - name: Eingabe bleibt unverändert
        code: |
          raeder = ["R-101", "R-117", "R-150"]
          minimiere(raeder, lambda l: "R-117" in l)
          assert raeder == ["R-101", "R-117", "R-150"], f"Die Eingabe wurde verändert: {raeder!r}"
      - name: ValueError, wenn die Eingabe den Fehler nicht zeigt
        code: |
          try:
              minimiere([("city", 10)], lambda l: False)
          except ValueError:
              pass
          else:
              raise AssertionError("Erwartet war ValueError, wenn scheitert(eingabe) False ist.")
    hints:
      - Versuche nacheinander, jedes Element einzeln wegzulassen. Bleibt der Fehler, behältst du die kürzere Liste.
      - "Nach dem Entfernen von Element `i` rückt das nächste auf Position `i` nach – erhöhe den Index dann nicht. Arbeite auf einer Kopie: `aktuell = list(eingabe)`."
      - "Wiederhole den ganzen Durchlauf, bis er nichts mehr entfernt hat. Erst dann ist garantiert, dass kein einzelnes Element mehr wegkann."
    explanation: |
      Das ist die Grundform von Delta Debugging: Element für Element weglassen und behalten, was den Fehler weiter auslöst. Das Ergebnis ist „1-minimal“ – kein einzelnes Element lässt sich mehr entfernen –, aber nicht unbedingt die kürzeste mögliche Liste; die zu finden kostet im schlimmsten Fall exponentiell viele Versuche. Andreas Zellers `ddmin` entfernt zuerst große Blöcke und halbiert dann, das spart bei langen Eingaben viele Aufrufe. Der Durchlauf wird wiederholt, weil das Weglassen eines späteren Elements ein früheres überflüssig machen kann. Aus dem Fahrtenprotokoll bleibt mit der Musterlösung `[("city", 250), ("ebike", 45)]` übrig, eine zweite Erscheinungsform desselben Fehlers: Beginnt der Tag mit dem City-Rad, deckelt der alte Code auch die E-Bike-Fahrt bei 1 500 Cent, und Radwerk berechnet zu wenig. Wer zwei Fassungen vergleicht und minimiert, findet so Fälle, die in keinem Ticket standen.
    resources:
      - title: The Debugging Book · Reducing Failure-Inducing Inputs
        url: https://www.debuggingbook.org/html/DeltaDebugger.html

  - id: nur-in-der-ci-rot
    type: practice
    title: Umlaute in der CI
    prompt: |
      Radwerks Stationsübersicht sortiert Stationen nach Namen. Der Test ist auf allen Laptops des Teams grün, in der CI rot:

      ```text
      >       assert stationen_sortiert(namen) == ["Altstadt", "Ärztehaus", "Bahnhof", "Uni-Campus"]
      E       AssertionError: assert ['Altstadt', 'Bahnhof', 'Uni-Campus', 'Ärztehaus'] == ['Altstadt', 'Ärztehaus', 'Bahnhof', 'Uni-Campus']
      ```

      Der Code:

      ```python
      import locale

      locale.setlocale(locale.LC_ALL, "")


      def stationen_sortiert(namen: list[str]) -> list[str]:
          return sorted(namen, key=locale.strxfrm)
      ```

      Schreibe ein kurzes Debugging-Protokoll, wie es in ein Ticket gehört: Hypothesen zu Test, Code und Umgebung, das Experiment, mit dem du den Fehler lokal siehst, einen Test, der auf jedem Rechner rot ist, solange der Fehler besteht, und einen Vorschlag für den Fix mit Begründung. Sag auch, auf welcher Ebene du den Test schreibst und warum.
    lang: text
    solution: |
      Beobachtung
        CI: ['Altstadt', 'Bahnhof', 'Uni-Campus', 'Ärztehaus'], Laptops: Ä nach A.
        Gleicher Code, gleicher Test – die Umgebung unterscheidet sich.

      Hypothesen
        Test falsch?  Nein: Nutzer erwarten „Ärztehaus“ zwischen „Altstadt“ und „Bahnhof“ (DIN 5007).
        Code falsch?  Ja, mittelbar: Die Sortierung hängt über setlocale(LC_ALL, "") von der
                      Umgebung des Prozesses ab statt von einer Produktentscheidung.
        Umgebung?     Vermutung: Laptops de_DE.UTF-8, CI C.UTF-8. Vorhersage: Mit
                      LC_ALL=C.UTF-8 ist der Test auch lokal rot.

      Experiment
        $ LC_ALL=C.UTF-8 pytest tests/test_stationen.py -q   -> rot, Hypothese bestätigt
        $ LC_ALL=de_DE.UTF-8 pytest tests/test_stationen.py -q -> grün
        Zusätzlich: Die CI schreibt ab jetzt `locale` ins Log.

      Roter Test (Unit-Ebene, reine Funktion; stellt die Sortierregeln des Prozesses auf "C")
        @pytest.fixture
        def c_locale():
            alt = locale.setlocale(locale.LC_COLLATE)
            locale.setlocale(locale.LC_COLLATE, "C")
            yield
            locale.setlocale(locale.LC_COLLATE, alt)

        def test_umlaute_sortieren_wie_ihr_grundbuchstabe(c_locale):
            assert stationen_sortiert(["Bahnhof", "Ärztehaus", "Altstadt", "Uni-Campus"]) == [
                "Altstadt", "Ärztehaus", "Bahnhof", "Uni-Campus"]
        Mit dem alten Code auf jedem Rechner rot, mit dem Fix überall grün.

      Fix
        Kein setlocale beim Import. Sortierschlüssel explizit und unabhängig von der Umgebung,
        z. B. Umlaute auf den Grundbuchstaben abbilden und casefold():
            def sortierschluessel(name):
                zerlegt = unicodedata.normalize("NFD", name.casefold())
                return "".join(z for z in zerlegt if not unicodedata.combining(z)), name
        Alternative: PyICU mit Collator „de“, falls mehr Sprachen dazukommen.
        Nicht als Fix: de_DE in der CI installieren – dann hängt das Ergebnis weiter am Server.

      Ebene
        Unit-Test der Sortierfunktion: Die Regel steckt in einer reinen Funktion, der Test
        läuft in Millisekunden und zeigt im Fehlerfall genau die Sortierung. Ein UI-Test der
        Stationsliste würde dasselbe Risiko teurer und langsamer prüfen.
    checklist:
      - Du nennst für Test, Code und Umgebung je eine Hypothese und begründest, warum die Erwartung des Tests stimmt.
      - Die Umgebungshypothese sagt eine Beobachtung vorher, und du nennst das Experiment dazu (`LC_ALL=C.UTF-8` oder eine andere Locale vor dem Befehl).
      - Dein roter Test hängt nicht davon ab, welche Locale auf dem Rechner eingestellt ist.
      - Dein Fix macht die Sortierung zu einer Entscheidung im Code, statt sie der Umgebung zu überlassen – und du begründest, warum „Locale in der CI installieren“ nicht reicht.
      - Du wählst die Testebene und begründest sie mit Kosten und Aussagekraft.
      - Du schlägst vor, dass die CI künftig Locale und Zeitzone ins Log schreibt.
    explanation: |
      `locale.setlocale(locale.LC_ALL, "")` übernimmt die Locale aus den Umgebungsvariablen des Prozesses. `locale.strxfrm` sortiert dann nach deren Regeln: Unter `de_DE.UTF-8` steht „Ä“ bei „A“, unter `C.UTF-8` nach Codepunkt, also hinter „Z“. Der Test hat recht, der Code überlässt eine fachliche Regel der Umgebung. Ein Fix, der nur die CI anpasst, macht den Fehler unsichtbar, bis ein Server mit anderer Locale startet. Die bessere Lösung legt die Sortierung im Code fest und testet sie als reine Funktion. Der rote Test im Musterprotokoll stellt die Sortierregeln des Prozesses für seine Dauer auf `C` – wie die Zeitzonen-Fixture in der Lektion: Mit dem alten Code ist er dann auf jedem Rechner rot, mit dem Fix überall grün.
    resources:
      - title: Python · locale.strxfrm
        url: https://docs.python.org/3/library/locale.html#locale.strxfrm
      - title: Python · unicodedata.normalize
        url: https://docs.python.org/3/library/unicodedata.html#unicodedata.normalize
