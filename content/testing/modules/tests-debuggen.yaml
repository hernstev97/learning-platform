lesson: |
  Freitag, 16:40 Uhr. Lenas Pull Request „Tageshöchstpreis für E-Bikes“ hat sein Approval, nur die CI ist rot: `test_tageshoechstpreis_gilt_je_kalendertag` schlägt fehl. Auf ihrem Laptop ist derselbe Test grün. Drei Reaktionen liegen nahe, und alle drei vernichten Information: den Lauf neu starten, bis er grün wird; den Test mit `@pytest.mark.skip` abschalten; die erwartete Zahl an die Ausgabe anpassen. Danach ist die CI grün, der Fehler bleibt, und kein Test zeigt ihn mehr.

  Dieses Modul zeigt ein Vorgehen, das bei jedem roten Test gleich bleibt, und für jeden Schritt das passende Werkzeug aus pytest und Git. Tests, die ohne Codeänderung mal rot und mal grün sind, behandelt das Modul [Flaky Tests](/testing/flaky-tests).

  ## Die Methode: vom roten CI-Lauf zum Fix

  Ein fehlschlagender Test sagt: „Ich habe X erwartet und Y beobachtet.“ Drei Beteiligte kommen als Ursache in Frage:

  - **Der Test** erwartet etwas Falsches: eine falsch gerechnete Zahl, eine Annahme ohne Grundlage in der Anforderung, Zustand aus einem anderen Test.
  - **Der Code** verhält sich falsch – der Fall, für den der Test existiert.
  - **Die Umgebung** ist anders als gedacht: Zeitzone, Sprache, Python-Version, Reihenfolge, fehlende Variablen.

  Wer sofort den Code ändert, hat sich auf die zweite Möglichkeit festgelegt, ohne die anderen zu prüfen. Das Vorgehen hat fünf Schritte:

  | Schritt | Frage | Werkzeuge |
  | --- | --- | --- |
  | 1. Lesen | Welcher Test, welche Zeile, welcher Wert gegen welchen? | Assertion-Diff, Traceback, `-vv`, `-l` |
  | 2. Reproduzieren | Sehe ich denselben Fehler lokal, schnell und jedes Mal? | Node-ID, `-k`, `--lf`, `-x`, Umgebung der CI nachstellen |
  | 3. Hypothesen prüfen | Test, Code oder Umgebung? Was müsste ich sehen, wenn meine Vermutung stimmt? | `--pdb`, `breakpoint()`, `caplog`, `capsys` |
  | 4. Eingrenzen | Welche kleinste Eingabe, welcher Commit zeigt den Fehler? | minimaler Test, `git bisect run` |
  | 5. Beheben | Ist der Test vor der Änderung rot und danach grün? | erst der rote Test, dann der Fix, dann die ganze Suite |

  Eine Hypothese taugt nur, wenn sie eine Beobachtung vorhersagt, die du in einer Minute prüfen kannst. „Irgendwas mit Zeitzonen“ sagt nichts vorher. „Die Fahrt um 0:30 Uhr landet in UTC auf dem Vortag, also enthält das Ergebnis einen Eintrag für den 2. Oktober“ schon. Prüfe pro Experiment eine Vermutung und ändere zwischen zwei Läufen nur eine Sache, sonst weißt du hinterher nicht, was geholfen hat.

  > [!MERKE]
  > Ein roter Test ist ein Messergebnis, kein Urteil über den Code. Erst lesen und reproduzieren, dann vermuten, dann eine Vermutung nach der anderen prüfen. Geändert wird erst, wenn du die Ursache zeigen kannst.

  ## Den Fehlerbericht lesen: Assertion-Diff und Traceback

  So steht der Fehler im Log der CI. GitHub Actions setzt `CI=true`, und pytest kürzt Vergleiche dann nicht, sondern hängt den vollständigen Diff an ([pytest · CI Pipelines](https://docs.pytest.org/en/stable/explanation/ci.html)):

  ```console
  $ pytest
  ============================= test session starts ==============================
  …
  collected 6 items

  tests/test_abrechnung.py ....F.                                          [100%]

  =================================== FAILURES ===================================
  __________________ test_tageshoechstpreis_gilt_je_kalendertag __________________

      def test_tageshoechstpreis_gilt_je_kalendertag():
          fahrten = [
              {"start": ts("2026-10-03T00:30+02:00"), "rad": "ebike", "minuten": 180},
              {"start": ts("2026-10-03T19:00+02:00"), "rad": "ebike", "minuten": 180},
              {"start": ts("2026-10-04T09:00+02:00"), "rad": "ebike", "minuten": 40},
          ]
  >       assert tageskosten(fahrten) == {date(2026, 10, 3): 3000, date(2026, 10, 4): 600}
  E       assert {datetime.dat..., 10, 4): 600} == {datetime.dat..., 10, 4): 600}
  E
  E         Omitting 1 identical items, use -vv to show
  E         Differing items:
  E         {datetime.date(2026, 10, 3): 1800} != {datetime.date(2026, 10, 3): 3000}
  E         Left contains 1 more item:
  E         {datetime.date(2026, 10, 2): 1800}
  E
  E         Full diff:
  E           {
  E         -     datetime.date(2026, 10, 3): 3000,
  E         ?                             ^   ^^
  E         +     datetime.date(2026, 10, 2): 1800,
  E         ?                             ^   ^^
  E         +     datetime.date(2026, 10, 3): 1800,
  E               datetime.date(2026, 10, 4): 600,
  E           }

  tests/test_abrechnung.py:27: AssertionError
  =========================== short test summary info ============================
  FAILED tests/test_abrechnung.py::test_tageshoechstpreis_gilt_je_kalendertag - assert …
  ========================= 1 failed, 5 passed in 0.10s ==========================
  ```

  Fang unten an: ein Test rot, fünf grün, darüber die Node-ID, mit der du ihn gleich reproduzierst. Im Abschnitt `FAILURES` markiert `>` die gescheiterte Zeile, die `E`-Zeilen erklären den Vergleich. Links vom `==` steht hier das Ergebnis, rechts die Erwartung; im `Full diff` steht `-` für die rechte Seite, `+` für die linke.

  Den entscheidenden Hinweis gibt „Left contains 1 more item“: Das Ergebnis enthält einen 2. Oktober, obwohl alle Fahrten am 3. und 4. Oktober deutscher Zeit stattfanden. Es geht also um die Zuordnung von Fahrten zu Kalendertagen, nicht um den Preis.

  > [!WARNING] Die Erwartung nicht an die Ausgabe anpassen
  > `{date(2026, 10, 2): 1800, …}` als neue Erwartung einzutragen, macht die CI grün und den Test zu einer Beschreibung des Fehlers. Ändere eine Erwartung nur, wenn du an der Anforderung zeigen kannst, dass sie falsch war.

  Nicht jeder rote Test scheitert an einer Assertion. `FAILED` heißt, der Test selbst ist gescheitert – an einem `assert` oder an einer Exception im getesteten Code. `ERROR` heißt, schon die Vorbereitung ist gescheitert, meist eine Fixture; der Test hat nie begonnen. Führe den Block aus und vergleiche die beiden Abschnitte im Bericht:

  ```python pytest fails
  import json

  import pytest


  def rabatt_cent(preis_cent: int, code: str, gutscheine: dict) -> int:
      gutschein = gutscheine[code]
      if gutschein["art"] == "prozent":
          return preis_cent * gutschein["wert"] // 100
      return min(gutschein["wert"], preis_cent)


  @pytest.fixture
  def gutscheine():
      return json.loads('{"RW-HERBST": {"art": "prozent", "wert": 10},}')


  def test_fester_betrag_hoechstens_preis():
      gutscheine = {"RW-500EUR": {"art": "betrag", "wert": 50000}}
      assert rabatt_cent(1500, "RW-500EUR", gutscheine) == 1500


  def test_prozent_rabatt():
      gutscheine = {"RW-HERBST": {"art": "prozent", "wert": 10}}
      assert rabatt_cent(1500, "rw-herbst", gutscheine) == 150


  def test_gutscheine_aus_datei(gutscheine):
      assert rabatt_cent(1500, "RW-HERBST", gutscheine) == 150
  ```

  Bei `test_prozent_rabatt` führt der Traceback vom Test in `rabatt_cent`, wo `KeyError: 'rw-herbst'` entsteht. Die unterste Zeile nennt die Exception, die Ebene darüber den Ort. Wo es knallt, liegt aber nicht automatisch der Fehler: Ob Gutscheincodes auch kleingeschrieben gelten, entscheidet die Anforderung, und der Test kann genauso falsch sein wie der Code. `test_gutscheine_aus_datei` ist dagegen nie gelaufen: `ERROR at setup` zeigt, dass die Fixture an einem Komma im JSON scheitert. Bei `ERROR` suchst du in Fixtures, `conftest.py` und Testdaten.

  Die Menge an Details steuerst du mit `--tb=auto|long|short|line|native|no`, mit `-l` (`--showlocals`, lokale Variablen je Frame) und `-vv` (Vergleiche ungekürzt) ([Traceback-Ausgabe](https://docs.pytest.org/en/stable/how-to/output.html#modifying-python-traceback-printing)).

  ## Reproduzieren: denselben Test schnell wieder rot sehen

  Kopiere die Node-ID aus dem Bericht und führe genau diesen Test aus. Sie besteht aus Pfad, `::` und Testname, bei parametrisierten Tests gefolgt von der ID in eckigen Klammern:

  ```console
  $ pytest tests/test_abrechnung.py::test_tageshoechstpreis_gilt_je_kalendertag -q
  .                                                                        [100%]
  1 passed in 0.09s
  $ TZ=UTC pytest -q --tb=line
  ....F.                                                                   [100%]
  =================================== FAILURES ===================================
  E   assert {datetime.dat..., 10, 4): 600} == {datetime.dat..., 10, 4): 600}
  …
  FAILED tests/test_abrechnung.py::test_tageshoechstpreis_gilt_je_kalendertag
  1 failed, 5 passed in 0.09s
  ```

  Lokal grün, in der CI rot, bei gleichem Code: Also unterscheidet sich die Umgebung. Lenas Laptop läuft in `Europe/Berlin`, der Runner in UTC. Mit `TZ=UTC` vor dem Befehl ist der Fehler lokal da. Erst jetzt lohnt die Suche nach der Ursache: Einen Fehler, den du nicht auslösen kannst, kannst du auch nicht als behoben nachweisen.

  Dann folgt die Schleife aus Ändern und Ausführen ([Fehlgeschlagene Tests erneut ausführen](https://docs.pytest.org/en/stable/how-to/cache.html#rerunning-only-failures-or-failures-first)):

  | Option | Wirkung |
  | --- | --- |
  | `--lf` (`--last-failed`) | nur die Tests, die im letzten Lauf rot waren |
  | `--ff` (`--failed-first`) | alle Tests, die zuletzt roten zuerst |
  | `-x` (`--exitfirst`) | beim ersten Fehler aufhören |
  | `-k "ausdruck"` | nur Tests, deren Name passt; mit `and`, `or`, `not` |
  | `-s` | `print`-Ausgaben sofort zeigen statt mitschneiden |
  | `--sw` (`--stepwise`) | beim ersten Fehler aufhören und im nächsten Lauf dort weitermachen |

  ```console
  $ TZ=UTC pytest --lf -x --tb=no
  …
  collected 1 item
  run-last-failure: rerun previous 1 failure

  tests/test_abrechnung.py F

  =========================== short test summary info ============================
  FAILED tests/test_abrechnung.py::test_tageshoechstpreis_gilt_je_kalendertag
  !!!!!!!!!!!!!!!!!!!!!!!!!! stopping after 1 failures !!!!!!!!!!!!!!!!!!!!!!!!!!!
  ============================== 1 failed in 0.09s ===============================
  ```

  > [!TIP] Woher `--lf` die roten Tests kennt
  > pytest merkt sich die Ergebnisse in `.pytest_cache`. In einer frischen CI-Umgebung fehlt es, und `--lf` führt alle Tests aus.

  ## Nur in der CI rot: die Umgebung als Verdächtige

  Ist ein Test lokal grün und in der CI rot, liegt der Unterschied fast immer in der Umgebung. Stelle eine Größe nach der anderen lokal nach:

  | Ursache | Typisches Symptom | Lokal nachstellen |
  | --- | --- | --- |
  | Zeitzone | Datumsgrenzen verschieben sich; `date.today()`, `datetime.now()` oder `fromtimestamp()` ohne `tz` nutzen die Zeit des Rechners | `TZ=UTC pytest …` |
  | Locale | Sortierung mit Umlauten, Zahlen- und Datumsformate, Standard-Encoding von `open()` unter Windows | `LC_ALL=C.UTF-8 pytest …` |
  | Reihenfolge | Test allein grün, in der ganzen Suite rot | dieselbe Testauswahl wie die CI, bei zufälliger Reihenfolge derselbe Seed |
  | Parallelität | Tests teilen Dateien, Ports oder Datenbankzeilen; nur die CI läuft mit `pytest -n auto` (pytest-xdist) | mit denselben Worker-Optionen ausführen |
  | Versionen | anderes Python, Abhängigkeiten ohne Lockfile, anderes Betriebssystem | Versionen aus dem Log vergleichen, `uv sync --locked` |
  | Umgebungsvariablen | Secrets fehlen bei Pull Requests aus Forks; Code verhält sich mit `CI=true` anders | Variablen aus dem Log setzen oder entfernen |
  | Dateisystem | `daten/Tarife.json` gegen `daten/tarife.json`: macOS und Windows unterscheiden Groß- und Kleinschreibung standardmäßig nicht, Linux schon | `git ls-files` mit dem Pfad im Code vergleichen |

  Bei Dateinamen schützt dich Python nur beim Import: `import Tarif` findet `tarif.py` auch auf macOS nicht, solange `PYTHONCASEOK` nicht gesetzt ist ([PYTHONCASEOK](https://docs.python.org/3/using/cmdline.html#envvar-PYTHONCASEOK)). Pfade in Strings und Testdaten prüft niemand.

  > [!PRAXIS] Eine CI, die beim Debuggen hilft
  > Radwerks Pipeline schreibt vor den Tests `python -VV`, `uv pip freeze`, `date` und `locale` ins Log; der Vergleich mit dem Laptop dauert dann Sekunden. pytest läuft mit `-ra` (Kurzfassung aller nicht bestandenen und übersprungenen Tests mit Grund) und `--junitxml`, dessen Bericht die CI als Artefakt aufbewahrt. `-l` nur, wenn in lokalen Variablen keine Secrets stehen können – sonst landen sie im Log.

  ## Hypothesen prüfen: Debugger, Logs und mitgeschnittene Ausgaben

  Für Lenas Test prüfst du die Verdächtigen der Reihe nach. **Test falsch?** Der Tageshöchstpreis gilt je Kalendertag in `Europe/Berlin`; eine Fahrt um 0:30 Uhr am 3. Oktober gehört zum 3. Oktober. Die Erwartung stimmt. **Umgebung?** In UTC rot, in Berlin grün – das erklärt, *wann* der Fehler auftritt, nicht *warum*. **Code?** Vermutung: `tageskosten` rechnet in die lokale Zeit des Rechners um statt nach Berlin. Vorhersage: In UTC hat die erste Fahrt das Datum 2. Oktober.

  `--pdb` öffnet bei einem Fehler den Debugger an der Stelle, an der der Test scheiterte. `p` gibt einen Ausdruck aus, `q` beendet die Sitzung ([--pdb und breakpoint()](https://docs.pytest.org/en/stable/how-to/failures.html#pdb-option)):

  ```console
  $ TZ=UTC pytest --lf --pdb -q
  F
  >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> traceback >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
  …
  >>>>>>>>>>>>>>>>>> PDB post_mortem (IO-capturing turned off) >>>>>>>>>>>>>>>>>>>
  > …/tests/test_abrechnung.py(27)test_tageshoechstpreis_gilt_je_kalendertag()
  -> assert tageskosten(fahrten) == {date(2026, 10, 3): 3000, date(2026, 10, 4): 600}
  (Pdb) p [datetime.fromtimestamp(f["start"]) for f in fahrten]
  [datetime.datetime(2026, 10, 2, 22, 30), datetime.datetime(2026, 10, 3, 17, 0), datetime.datetime(2026, 10, 4, 7, 0)]
  (Pdb) q
  =========================== short test summary info ============================
  FAILED tests/test_abrechnung.py::test_tageshoechstpreis_gilt_je_kalendertag
  !!!!!!!!!!!!!!!!!!! _pytest.outcomes.Exit: Quitting debugger !!!!!!!!!!!!!!!!!!!
  1 failed in 0.24s
  ```

  Die erste Fahrt beginnt um 22:30 Uhr am 2. Oktober – die Vorhersage trifft zu. Im Code steht `datetime.fromtimestamp(fahrt["start"]).date()`, und ohne `tz` liefert `fromtimestamp` die lokale Zeit des Rechners ([datetime.fromtimestamp](https://docs.python.org/3/library/datetime.html#datetime.datetime.fromtimestamp)). Willst du schon im getesteten Code anhalten, schreib dort `breakpoint()`; pytest schaltet dann das Mitschneiden ab und öffnet seinen Debugger. In der CI gibt es keinen Debugger; dort zeigt `-l` die lokalen Variablen direkt im Bericht.

  Oft steckt der Beweis in Ausgaben, die pytest ohnehin mitschneidet: Logmeldungen, `stdout` und `stderr` jedes Tests erscheinen bei einem Fehler unter dem Traceback. Mit den Fixtures `caplog` und `capsys` machst du eine solche Beobachtung zur Assertion ([caplog](https://docs.pytest.org/en/stable/how-to/logging.html#caplog-fixture)):

  ```python pytest fails
  import logging

  log = logging.getLogger("radwerk.webhooks")


  def verarbeite(ereignis: dict, zahlungen: dict) -> None:
      zahlung = ereignis["data"]["id"]
      if zahlung not in zahlungen:
          log.warning("Webhook für unbekannte Zahlung %s ignoriert", zahlung)
          return
      print(f"{zahlung}: {zahlungen[zahlung]} -> {ereignis['type']}")
      zahlungen[zahlung] = ereignis["type"].removeprefix("payment.")


  def test_unbekannte_zahlung_wird_gemeldet(caplog):
      verarbeite({"type": "payment.succeeded", "data": {"id": "pay_0000"}}, {})
      assert "unbekannte Zahlung pay_0000" in caplog.text


  def test_erfolgreiche_zahlung(capsys):
      zahlungen = {"pay_7f3a": "offen"}
      verarbeite({"type": "payment.succeeded", "data": {"id": "pay_7f3a"}}, zahlungen)
      assert capsys.readouterr().out == "pay_7f3a: offen -> payment.succeeded\n"
      assert zahlungen == {"pay_7f3a": "succeeded"}


  def test_webhook_aus_dem_ci_log():
      zahlungen = {"pay_7f3a": "offen"}
      verarbeite({"type": "payment.succeeded", "data": {"id": "pay_7F3A"}}, zahlungen)
      assert zahlungen == {"pay_7f3a": "succeeded"}
  ```

  Die Assertion des dritten Tests sagt nur, dass der Status `offen` blieb. Wer allein sie liest, sucht in der Statuslogik. Den Grund nennt `Captured log call`: Der Webhook kam mit `pay_7F3A`, gespeichert ist `pay_7f3a`. Standardmäßig erscheinen nur Meldungen ab `WARNING`; für `DEBUG` und `INFO` brauchst du `--log-level=DEBUG` oder `caplog.set_level(logging.DEBUG)`.

  ## Eingrenzen: minimaler Test und git bisect run

  Entferne die drei Fahrten aus Lenas Test einzeln und prüfe jedes Mal, ob der Fehler bleibt. Übrig bleibt eine Fahrt um 0:30 Uhr, für die `tageskosten` in UTC `{date(2026, 10, 2): 1800}` liefert. Der Tageshöchstpreis spielte nie eine Rolle. Dieses systematische Weglassen heißt Delta Debugging ([Reducing Failure-Inducing Inputs](https://www.debuggingbook.org/html/DeltaDebugger.html)); Hypothesis erledigt es beim Shrinking automatisch (siehe [Property-based Testing](/testing/property-based-testing)).

  Der minimale Test soll auf jedem Rechner rot sein, nicht nur in UTC. Deshalb stellt eine Fixture die Zeitzone des Prozesses um; `time.tzset()` übernimmt die geänderte Variable `TZ` und existiert nur unter Unix ([time.tzset](https://docs.python.org/3/library/time.html#time.tzset)):

  ```python
  import time
  from datetime import date, datetime

  import pytest

  from radwerk.abrechnung import tageskosten


  @pytest.fixture(params=["UTC", "Europe/Berlin", "America/New_York"])
  def rechner_zeitzone(request):
      with pytest.MonkeyPatch.context() as mp:
          mp.setenv("TZ", request.param)
          time.tzset()
          yield request.param
      time.tzset()


  def test_fahrt_kurz_nach_mitternacht_zaehlt_zum_neuen_tag(rechner_zeitzone):
      start = datetime.fromisoformat("2026-10-03T00:30+02:00").timestamp()
      fahrten = [{"start": start, "rad": "ebike", "minuten": 180}]
      assert tageskosten(fahrten) == {date(2026, 10, 3): 1800}
  ```

  Der zweite `tzset()` stellt den Prozess nach dem `with`-Block zurück. Auf dem Laptop in Berlin ist der Test jetzt zweimal rot:

  ```console
  $ pytest tests/test_zeitzone.py -q --tb=no
  F.F                                                                      [100%]
  =========================== short test summary info ============================
  FAILED tests/test_zeitzone.py::test_fahrt_kurz_nach_mitternacht_zaehlt_zum_neuen_tag[UTC]
  FAILED tests/test_zeitzone.py::test_fahrt_kurz_nach_mitternacht_zaehlt_zum_neuen_tag[America/New_York]
  2 failed, 1 passed in 0.09s
  ```

  Seit wann gibt es den Fehler? Release `v1.4.0` hat richtig abgerechnet. `git bisect run` sucht binär zwischen einem guten und einem schlechten Commit und führt bei jedem Schritt einen Befehl aus: Exit-Code 0 heißt gut, 125 überspringen, 1 bis 127 sonst schlecht. Ab 128, etwa wenn ein Signal den Befehl beendet, bricht Git die ganze Suche ab ([git-bisect · bisect run](https://git-scm.com/docs/git-bisect#_bisect_run), Grundlagen im Modul [Bisect und Historie](/git/bisect-historie)). pytest endet mit 0, wenn alles grün ist, und mit 1 bei roten Tests – aber auch mit 2 bei Fehlern beim Sammeln, 3 bei internen Fehlern, 4 bei Bedienfehlern wie einer fehlenden Datei und 5, wenn kein Test gefunden wurde ([Exit codes](https://docs.pytest.org/en/stable/reference/exit-codes.html)). Für Bisect ist all das „schlecht“.

  ```console
  $ cp tests/test_zeitzone.py ..
  $ git bisect start HEAD v1.4.0
  Bisecting: 3 revisions left to test after this (roughly 2 steps)
  [9b19311261615009c697967dc8f6c486877c39c2] Abrechnung: Tag in Hilfsfunktion auslagern
  $ git bisect run python -m pytest -q --tb=no ../test_zeitzone.py
  running 'python' '-m' 'pytest' '-q' '--tb=no' '../test_zeitzone.py'
  F.F                                                                      [100%]
  …
  Bisecting: 0 revisions left to test after this (roughly 1 step)
  [8d326a0c327a4883a7b355be710bd4d9ac60e3cb] Gutscheincodes prüfen
  running 'python' '-m' 'pytest' '-q' '--tb=no' '../test_zeitzone.py'
  ...                                                                      [100%]
  3 passed in 0.09s
  9b19311261615009c697967dc8f6c486877c39c2 is the first 'bad' commit
  commit 9b19311261615009c697967dc8f6c486877c39c2
  …
      Abrechnung: Tag in Hilfsfunktion auslagern
  …
  bisect found first 'bad' commit
  $ git bisect reset
  ```

  Zwei Details entscheiden über das Ergebnis. Der Test liegt als Kopie außerhalb des Repositorys, denn er steckt nur im neuesten Commit; mit `tests/test_zeitzone.py` endet pytest in älteren Commits mit Exit-Code 4. Und es heißt `python -m pytest`. Im Projekt macht `pythonpath = ["."]` in der `pyproject.toml` das Paket `radwerk` importierbar. Für eine Testdatei außerhalb des Repositorys sucht pytest seine Konfiguration aber von `..` aus nach oben und findet diese Datei nicht. Mit `pytest` allein scheitert `import radwerk` deshalb beim Sammeln, Exit-Code 2. `python -m` setzt dagegen das aktuelle Verzeichnis auf `sys.path` ([python -m pytest](https://docs.pytest.org/en/stable/how-to/usage.html#invoke-python)). Beide Fehler führen zum selben falschen Ergebnis: Bisect beschuldigt „README ergänzt“, den ersten Commit nach `v1.4.0`.

  Der gefundene Commit hat die Tagesberechnung in `_tag()` ausgelagert und dabei die Zeitzone verloren. Erst jetzt kommt der Fix, mit einem Test, der vorher rot war:

  ```diff
   def _tag(zeitstempel: float) -> date:
  -    return datetime.fromtimestamp(zeitstempel).date()
  +    return datetime.fromtimestamp(zeitstempel, BERLIN).date()
  ```

  Danach läuft die ganze Suite, auch in UTC: `TZ=UTC pytest -q` meldet `9 passed`. Der Regressionstest bleibt. Er beschreibt eine Regel („eine Fahrt zählt zum Kalendertag in Berlin“) und schlägt auf jedem Rechner an, sobald jemand die Zeitzone wieder vergisst.

  > [!INTERVIEW] „Ein Test ist in der CI rot und lokal grün. Wie gehst du vor?“
  > Ich lese den vollständigen Bericht und führe lokal den Befehl der CI mit den Versionen aus dem Lockfile aus. Ist er grün, variiere ich eine Größe nach der anderen – Zeitzone, Locale, Testauswahl, Parallelität, Umgebungsvariablen –, bis ich den Fehler sehe. Dann prüfe ich Hypothesen mit je einem Experiment. Vor dem Fix schreibe ich einen minimalen Test, der auf jedem Rechner rot ist; bei einer Regression finde ich den Commit mit `git bisect run`. Zum Schluss schreibt die CI ihre Umgebung ins Log.

  ## Häufige Fehler

  - **Neu starten, bis die CI grün ist.** Ein grüner zweiter Lauf beweist nichts, wenn der Fehler von Uhrzeit, Reihenfolge oder Last abhängt.
  - **Die Erwartung an die Ausgabe anpassen.** Der Test beschreibt danach den Fehler. Eine Erwartung ändert sich nur mit einem Beleg aus der Anforderung.
  - **Nur den einzelnen Test ausführen.** Ein Test, der in der Suite rot ist, kann allein grün sein, weil ein anderer Test Zustand hinterlässt. Reproduziere mit der Testauswahl der CI.
  - **Beim ersten Frame des Tracebacks stehen bleiben.** Die Ursache steht meist im letzten Frame deines eigenen Codes – oder gar nicht im Traceback, sondern in einer Fixture (`ERROR at setup`) oder in den mitgeschnittenen Logs.
  - **`git bisect run pytest` ohne Blick auf die Exit-Codes.** Fehlt der Test in alten Commits oder scheitert der Import, meldet pytest 2 bis 5, und Bisect beschuldigt einen unschuldigen Commit.
  - **Fix ohne roten Test.** Wer den Test nie rot gesehen hat, weiß nicht, ob er den Fehler überhaupt zeigt.

  ## Zusammenfassung

  - Ein roter Test meldet eine Abweichung zwischen Erwartung und Verhalten. Verdächtig sind Test, Code und Umgebung; prüfe alle drei, bevor du etwas änderst.
  - Den Bericht von unten lesen; die `E`-Zeilen zeigen beide Seiten des Vergleichs. `FAILED` heißt Test gescheitert, `ERROR` Vorbereitung gescheitert.
  - Reproduzieren mit Node-ID, `-k`, `--lf`, `--ff` und `-x`; untersuchen mit `-vv`, `-l`, `--tb=…`, `-s`, `--pdb`, `breakpoint()`, `caplog` und `capsys`.
  - Lokal grün, CI rot: Zeitzone, Locale, Reihenfolge, Parallelität, Versionen, Umgebungsvariablen und Groß-/Kleinschreibung einzeln nachstellen.
  - Eine Hypothese sagt eine Beobachtung vorher. Minimiere durch Weglassen; der minimale Test ist auf jedem Rechner rot.
  - `git bisect run python -m pytest ../test.py` findet den verursachenden Commit. Endet pytest mit 2 bis 5, zählt Bisect den Commit als „schlecht“; ein kleines Skript übersetzt diese Codes in 125 (überspringen).
  - Erst der rote Test, dann der Fix, dann die ganze Suite. Der Test bleibt.
exercises:
  - id: erster-schritt
    type: choice
    title: Rot in der CI, grün auf dem Laptop
    prompt: |
      Freitagnachmittag. In der CI ist `test_gutschein_gilt_bis_einschliesslich_ablaufdatum` rot, auf deinem Laptop grün. Der Pull Request soll heute noch gemergt werden. Welche Schritte sind jetzt sinnvoll?
    options:
      - text: Den vollständigen Bericht im CI-Log lesen – welche Werte verglichen wurden und in welcher Zeile.
        correct: true
        why: Der Bericht enthält die Node-ID, den Vergleich und oft schon den entscheidenden Hinweis. Alles Weitere baut darauf auf.
      - text: Lokal mit dem Befehl, der Python-Version und den Abhängigkeiten der CI ausführen und dann Unterschiede wie Zeitzone oder Locale einzeln nachstellen.
        correct: true
        why: Lokal grün bei gleichem Code heißt, dass sich die Umgebung unterscheidet. Bei einem Ablaufdatum ist eine Datumsgrenze in UTC ein naheliegender Kandidat.
      - text: Den Job neu starten. Ist er dann grün, war es ein Ausreißer.
        correct: false
        why: Ein zweiter grüner Lauf beweist nichts. Ein Datumsfehler ist nach Mitternacht UTC wieder da – dann vielleicht schon in Produktion.
      - text: Die erwartete Zahl im Test durch den Wert aus dem CI-Log ersetzen.
        correct: false
        why: Dann beschreibt der Test den Fehler, und auf deinem Laptop wird er rot. Eine Erwartung ändert sich nur mit einem Beleg aus der Anforderung.
      - text: Den Test mit `skipif` überspringen, sobald die Umgebungsvariable `CI` gesetzt ist.
        correct: false
        why: Die CI läuft wie die Server in Produktion unter Linux und meist in UTC. Wer den Test dort abschaltet, versteckt den Fehler genau in der Umgebung, die zählt.
    explanation: |
      Der rote Lauf in der CI ist die wertvollste Information, die du gerade hast. Neu starten, Erwartung anpassen und Überspringen löschen sie. Lesen und Reproduzieren kosten ein paar Minuten und sagen dir, ob Test, Code oder Umgebung schuld ist. Gerade bei Datumsregeln wie „gültig bis einschließlich Ablaufdatum“ liegt die Ursache oft in der Zeitzone: Auf dem Laptop läuft Europe/Berlin, in der CI UTC.
    resources:
      - title: pytest · CI Pipelines
        url: https://docs.pytest.org/en/stable/explanation/ci.html

  - id: ebene-fuer-den-repro-test
    type: choice
    title: Wo gehört der rote Test hin?
    prompt: |
      Die Buchhaltung meldet: Eine Fahrt mit dem City-Rad am 25. Oktober 2026 (Ende der Sommerzeit) dauerte laut Server-Log von `2026-10-25T01:50+02:00` bis `2026-10-25T02:20+01:00`, also 90 Minuten. Berechnet wurden 150 Cent. Regel: 150 Cent je angefangene 30 Minuten.

      Du hast schon herausgefunden: Die App schickt beide Zeitpunkte korrekt mit Offset, die API speichert sie korrekt. Die Funktion `fahrtdauer_minuten(start, ende)` wandelt beide nach `Europe/Berlin` um und zieht sie voneinander ab. Welchen Test schreibst du zuerst?
    options:
      - text: Einen Unit-Test für `fahrtdauer_minuten` mit genau diesen beiden Zeitpunkten, Erwartung 90.
        correct: true
        why: Die Ursache liegt in einer reinen Funktion. Der Test läuft in Millisekunden, ist deterministisch, zeigt im Fehlerfall genau die Regel und läuft in jedem Pull Request.
      - text: Einen API-Test, der die Fahrt per HTTP anlegt und den Preis in der Antwort prüft.
        correct: false
        why: Er würde den Fehler auch zeigen, bringt aber Datenbank, Authentifizierung und Serialisierung mit, die nachweislich funktionieren. Er lohnt sich, wenn der Offset an der API-Grenze verloren gehen kann – das hast du schon ausgeschlossen.
      - text: Einen End-to-End-Test auf einem Android-Emulator mit Gerätezeit am 25. Oktober.
        correct: false
        why: Teuer, langsam und anfällig. Er prüft dasselbe Risiko mit viel mehr beweglichen Teilen, und wenn er rot wird, weißt du nicht, wo.
      - text: Keinen neuen Test – die Ursache ist bekannt, der Fix ist eine Zeile.
        correct: false
        why: Ohne roten Test weißt du nicht, ob der Fix wirkt, und nichts hält die nächste Änderung davon ab, den Fehler zurückzubringen.
    explanation: |
      Teste ein Risiko auf der niedrigsten Ebene, die es zuverlässig zeigt. Die Eingrenzung hat ergeben, dass die Zeitpunkte richtig ankommen und der Fehler in der Rechnung steckt. Python rechnet die Differenz zweier `datetime`-Werte mit **derselben** `tzinfo` als Wanduhrzeit: 02:20 minus 01:50 ergibt 30 Minuten, obwohl dazwischen die Uhr zurückgestellt wurde. Ein Unit-Test mit den beiden Zeitpunkten aus dem Log ist rot, bis die Funktion in UTC rechnet, und bleibt als Regressionstest für jede Zeitumstellung stehen.
    resources:
      - title: Python · datetime-Objekte (Arithmetik)
        url: https://docs.python.org/3/library/datetime.html#datetime-objects

  - id: utc-oder-berlin
    type: output
    title: Welcher Tag ist es?
    prompt: |
      Fahrten werden in UTC gespeichert, der Tageshöchstpreis gilt je Kalendertag in Berlin. Was gibt das Programm aus?
    lang: python
    code: |
      from datetime import datetime, timezone
      from zoneinfo import ZoneInfo

      BERLIN = ZoneInfo("Europe/Berlin")
      for start in [
          datetime(2026, 10, 2, 22, 30, tzinfo=timezone.utc),
          datetime(2026, 12, 2, 22, 30, tzinfo=timezone.utc),
          datetime(2026, 12, 2, 23, 30, tzinfo=timezone.utc),
      ]:
          print(start.date(), start.astimezone(BERLIN).date())
    expected: |
      2026-10-02 2026-10-03
      2026-12-02 2026-12-02
      2026-12-02 2026-12-03
    explanation: |
      `start.date()` liefert das Datum in der Zeitzone des Objekts, hier UTC. Erst `astimezone(BERLIN)` rechnet um. Anfang Oktober gilt in Berlin Sommerzeit (UTC+2), 22:30 UTC ist also 0:30 Uhr am nächsten Tag. Im Dezember gilt Winterzeit (UTC+1): 22:30 UTC ist 23:30 Uhr am selben Tag, erst 23:30 UTC rutscht über Mitternacht. Ein Test, der eine Fahrt um 22:30 UTC am heutigen Tag anlegt, zeigt einen Fehler bei der Tageszuordnung deshalb nur im Sommerhalbjahr. Solche Fehler fallen auf, wenn ein Test zufällig zur „richtigen“ Jahreszeit läuft, und verschwinden dann wieder. Feste Daten aus beiden Hälften des Jahres zeigen sie jedes Mal.
    resources:
      - title: Python · datetime.astimezone
        url: https://docs.python.org/3/library/datetime.html#datetime.datetime.astimezone
      - title: Python · zoneinfo
        url: https://docs.python.org/3/library/zoneinfo.html#using-zoneinfo

  - id: geteilte-standardliste
    type: output
    title: Allein grün, zusammen rot
    prompt: |
      Die beiden Funktionen `test_…` stehen für zwei Tests derselben Suite, die nacheinander im selben Prozess laufen. Was gibt das Programm aus?
    lang: python
    code: |
      def neue_buchung(kunde, gutscheine=[]):
          return {"kunde": kunde, "gutscheine": gutscheine}


      def test_ohne_gutschein():
          buchung = neue_buchung("tom")
          return buchung["gutscheine"] == []


      def test_mit_gutschein():
          buchung = neue_buchung("lena")
          buchung["gutscheine"].append("RW-HERBST")
          return buchung["gutscheine"] == ["RW-HERBST"]


      print(test_ohne_gutschein(), test_mit_gutschein())
      print(test_mit_gutschein(), test_ohne_gutschein())
      print(neue_buchung("mia"))
    expected: |
      True True
      False False
      {'kunde': 'mia', 'gutscheine': ['RW-HERBST', 'RW-HERBST']}
    explanation: |
      Der Standardwert `[]` entsteht einmal beim Definieren der Funktion, nicht bei jedem Aufruf; alle Buchungen ohne eigene Liste teilen sich dieselbe. In der ersten Zeile ist sie noch leer, `test_mit_gutschein` hängt `RW-HERBST` an. In der zweiten Zeile hängt derselbe Test einen zweiten Code an, und `test_ohne_gutschein` sieht zwei Einträge. Rot wird also `test_ohne_gutschein`, obwohl er nichts verändert, und einzeln ist jeder Test grün – deshalb reproduzierst du mit der Testauswahl der CI. Der Fix: `gutscheine=None` und im Rumpf `gutscheine = [] if gutscheine is None else gutscheine`.
    resources:
      - title: Python-Tutorial · Standardwerte von Argumenten
        url: https://docs.python.org/3/tutorial/controlflow.html#default-argument-values

  - id: nur-die-roten
    type: command
    title: Nur die Roten, und schnell
    prompt: |
      Du arbeitest an einem Fix. Führe nur die Tests aus, die im letzten Lauf fehlgeschlagen sind, und brich beim ersten Fehler ab.
