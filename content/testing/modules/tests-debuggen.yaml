    explanation: |
      `--lf` (`--last-failed`) liest aus `.pytest_cache`, welche Tests zuletzt rot waren, und führt nur diese aus. `-x` (`--exitfirst`, gleichwertig `--maxfail=1`) hört beim ersten Fehler auf. Zusammen ergibt das die kürzeste Schleife beim Beheben: ändern, `pytest --lf -x`, wieder ändern. Sind alle Roten grün, führt `--lf` beim nächsten Mal wieder alle Tests aus – dann läuft die ganze Suite, und du siehst, ob der Fix etwas anderes kaputt gemacht hat.
