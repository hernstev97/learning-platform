id: frontend-tests
title: Frontend-Tests
level: 2
minutes: 150
summary: Komponenten so testen, wie Kundinnen sie bedienen – mit Vitest, Testing Library, user-event und MSW –, Logik in reine Funktionen ziehen und für jedes Risiko im Browser die günstigste Ebene wählen.
goals:
  - Du entscheidest für ein Risiko im Frontend, ob eine reine Funktion, ein Komponententest in jsdom, ein Test im echten Browser oder ein E2E-Test es am günstigsten zeigt.
  - Du findest Elemente mit Testing Library über Rolle, Namen und Label und begründest, warum `getByTestId` die letzte Wahl ist.
  - Du simulierst Eingaben mit `user-event` und wartest mit `findBy*` und `waitFor` auf asynchrone Änderungen statt auf feste Zeiten.
  - Du ersetzt das Backend im Test mit MSW auf Netzwerkebene, statt `fetch` zu mocken, und steuerst Zeit mit Fake-Timern und `act`.
  - Du ordnest axe-Prüfungen, Snapshot-Tests und visuelle Regressionstests ein und kennst ihre Grenzen.
