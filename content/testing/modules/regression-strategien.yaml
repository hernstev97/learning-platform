id: regression-strategien
title: Regressionsstrategien
level: 3
minutes: 150
summary: Damit ein behobener Fehler behoben bleibt – reproduzierende Tests auf der richtigen Ebene, Golden Master vor dem Umbau, gezielte Testauswahl, Coverage und Mutation Testing als Prüfung der Tests und ein Sicherheitsnetz nach dem Release.
goals:
  - Du schreibst zu jedem Bug zuerst einen Test, der aus dem richtigen Grund rot wird, und wählst dafür die niedrigste Ebene, auf der der Fehler zuverlässig auftritt.
  - Du hältst das Verhalten von Altcode mit Characterization Tests und einem Golden Master fest und kennst die Schwächen von Snapshot-Tests.
  - Du entscheidest, welche Tests pro Pull Request, nach dem Merge und nachts laufen, und wählst Tests nach geänderten Dateien aus, ohne blinde Flecken zu übersehen.
  - Du liest Line-, Branch- und Diff-Coverage richtig und nutzt Coverage als Lückenfinder statt als Ziel.
  - Du deutest überlebende Mutanten aus mutmut und schreibst Tests, die sie töten.
  - Du ordnest Smoke Tests, Canary Releases, Feature Flags und Monitoring als Sicherheitsnetz nach dem Release ein und machst aus einem Post-Mortem neue Tests.
