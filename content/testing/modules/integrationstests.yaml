id: integrationstests
title: Integrationstests
level: 2
minutes: 150
summary: Repositories gegen eine echte Datenbank testen statt gegen Mocks – mit Fixtures, die Schema und Transaktionen im Griff haben, Testdaten aus Buildern, Dateien in tmp_path und einem ehrlichen Blick darauf, wo SQLite nicht PostgreSQL ist.
goals:
  - Du unterscheidest schmale und breite Integrationstests und begründest, welche Fehler nur ein Test gegen die echte Datenbank zeigt.
  - Du testest ein Repository gegen echtes SQLite und deckst die Grenzfälle halboffener Zeitintervalle ab.
  - Du wählst zwischen frischem Schema pro Test und Rollback pro Test und setzt Fixture-Scopes passend ein.
  - Du hältst Testdaten mit Buildern und Factory-Fixtures klein und testest Dateizugriffe mit `tmp_path`.
  - Du benennst, wo SQLite sich anders verhält als PostgreSQL, und testest gegen echtes PostgreSQL mit Testcontainers.
