id: property-based-testing
title: Property-based Testing
level: 3
minutes: 150
summary: Eigenschaften statt einzelner Beispiele – Hypothesis erzeugt Hunderte Eingaben, findet Grenzfälle wie Mitternacht und Zeitumstellung und verkleinert jeden Fehler auf das kleinste Gegenbeispiel.
goals:
  - Du formulierst für eine Funktion Eigenschaften nach den Mustern Round Trip, Invariante, Idempotenz, Orakel, metamorphe Relation und „stürzt nicht ab“.
  - Du baust Strategien mit `sampled_from`, `builds`, `@st.composite` und `datetimes` mit Zeitzone und entscheidest zwischen `assume` und `.filter`.
  - Du liest ein geschrumpftes Gegenbeispiel und hältst es mit `@example` als Regression fest.
  - Du schreibst Eigenschaften, die Fehler an Stellen fangen, die du von Hand selten prüfst – über Mitternacht, an der Zeitumstellung, oberhalb des Tageshöchstpreises.
  - Du erklärst, wie Hypothesis lokal, in der CI und auf dieser Plattform deterministisch oder zufällig läuft, und wann sich Property-based Testing lohnt.
