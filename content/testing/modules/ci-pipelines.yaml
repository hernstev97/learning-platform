id: ci-pipelines
title: Tests in der CI
level: 2
minutes: 150
summary: Eine Pipeline, deren Rot etwas bedeutet und deren Grün schnell kommt – Jobs von schnell nach langsam, Postgres als Service, JUnit-Berichte, Playwright-Shards, ein robuster Pflicht-Check, Flaky Tests und sichere Workflows für das Radwerk-Projekt.
goals:
  - Du entscheidest begründet, welche Prüfung im Pull Request, in der Merge Queue und im Nachtlauf läuft.
  - Du entwirfst eine Pipeline von schnell nach langsam mit `needs`, Matrix, `concurrency`, Timeouts und Pfadfiltern auf Job-Ebene.
  - Du schreibst GitHub-Actions-Jobs für pytest mit Postgres-Service, JUnit-XML und Coverage-Artefakt sowie für Playwright mit Shards und zusammengeführtem Bericht.
  - Du machst den Pflicht-Check robust gegen übersprungene Jobs und gehst mit Flaky Tests in der CI um, statt Läufe blind neu zu starten.
  - Du sicherst Workflows ab – minimale `permissions`, keine Secrets für Fork-Code, kein `pull_request_target` mit fremdem Code, gepinnte Actions.
