id: e2e-tests
title: End-to-End-Tests mit Playwright
level: 2
minutes: 150
summary: Wenige kritische Abläufe – Registrierung, Buchen und Bezahlen, Rückgabe – im echten Browser absichern, mit Locators und Web-first-Assertions, isolierten Kontexten und Testdaten aus der API, und alles andere bewusst tiefer testen.
goals:
  - Du wählst die wenigen Journeys, die einen E2E-Test rechtfertigen, und begründest für andere Prüfungen eine tiefere Ebene.
  - Du schreibst Playwright-Tests mit nutzernahen Locators und Web-first-Assertions, die ohne feste Wartezeiten auskommen.
  - Du isolierst Tests über Browser-Kontexte, eine gespeicherte Anmeldung aus einem Setup-Projekt und eigene Testdaten aus der API.
  - Du setzt `page.route`, Fixtures und Page Objects gezielt ein und kennst ihre Kosten.
  - Du beschleunigst eine Suite mit Parallelität und Sharding und untersuchst rote Läufe mit Retries und dem Trace Viewer.
