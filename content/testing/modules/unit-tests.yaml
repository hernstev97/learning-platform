lesson: |
  Montagmorgen bei Radwerk, einem Fahrradverleih mit 40 Stationen in drei Städten. Der Support hat seit Samstag 37 Beschwerden gesammelt, alle mit demselben Inhalt: Wer genau 30 oder 60 Minuten mit dem City-Rad gefahren ist, hat eine halbe Stunde zu viel bezahlt. Die Ursache steckt im Pull Request vom Freitag. Jemand hat die Preisfunktion „lesbarer“ gemacht:

  ```diff
   def mietpreis(minuten: int) -> int:
       if minuten <= 5:
           return 0
  -    return (minuten + 29) // 30 * 150
  +    return (minuten // 30 + 1) * 150
  ```

  Die Regel lautet: 150 Cent je angefangene 30 Minuten, Fahrten bis einschließlich 5 Minuten kosten nichts. Für 45 Minuten liefern beide Varianten 300 Cent. Für genau 30 Minuten liefert die neue 300 statt 150. Die Testsuite war grün. Sie enthielt zwei Tests, `assert mietpreis(3) == 0` und `assert mietpreis(45) == 300`, und beide liefen vor und nach der Änderung durch. Jede Zeile der Funktion wurde dabei ausgeführt.

  Radwerk begleitet dich durch den ganzen Kurs: eine Website in TypeScript, eine Android-App, ein Python-Backend mit PostgreSQL, der Zahlungsdienstleister Paystream und ein kleines Team, das jeden Tag ausliefern will. Beträge rechnet Radwerk immer in Cent als `int`. Dieses Modul beginnt ganz unten, bei Unit-Tests für einzelne Funktionen mit pytest. Was du aus [Testen mit pytest](/python/testen-pytest) kennst – AAA, `parametrize`, Fixtures –, wiederholt es knapp. Neu ist die Frage, die diese beiden Tests nie gestellt haben: Welche Testfälle braucht eine Regel, damit plausible Fehler auffallen?

  ## Wozu automatisierte Tests – und was sie nicht beweisen

  Ein automatisierter Test ist Code, der eine Erwartung an anderen Code prüft und ohne Menschen läuft. Er bringt dir drei Dinge:

  - **Schnelles Feedback.** Die Tarif-Tests laufen in Zehntelsekunden. Du erfährst von einem Fehler, solange die Änderung noch in deinem Kopf ist, und nicht drei Tage später vom Support.
  - **Ein Sicherheitsnetz gegen Regressionen.** Eine Regression ist ein Fehler in etwas, das schon funktioniert hat. Wer refaktoriert, verlässt sich darauf, dass die Tests genau die Regeln prüfen, die eine Änderung brechen kann. Die Tests mit 3 und 45 Minuten taten das nicht.
  - **Eine ausführbare Spezifikation.** `test_genau_30_minuten_sind_ein_block` erklärt einer neuen Kollegin den Tarif besser als ein Wiki-Eintrag. Und er veraltet nicht still: Ändert sich das Verhalten, wird er rot.

  Was Tests nicht leisten, hat Edsger W. Dijkstra 1969 in seinen „Notes on Structured Programming“ notiert: „Program testing can be used to show the presence of bugs, but never to show their absence!“ ([EWD 249](https://www.cs.utexas.edu/~EWD/transcriptions/EWD02xx/EWD249/EWD249.html)). Ein grüner Lauf sagt: Die geprüften Beispiele verhalten sich wie erwartet. Über alle anderen Eingaben sagt er nichts. Der Wert einer Suite hängt deshalb an der Auswahl der Beispiele, nicht an ihrer Zahl.

  Tests kosten auch etwas: Zeit beim Schreiben, Zeit bei jedem Lauf und Pflege, wenn sich Code ändert. Ein Test lohnt sich, wenn er einen plausiblen Fehler fängt, den sonst niemand rechtzeitig sieht. Diese Frage – würde ein realistischer Fehler meinen Test rot machen? – zieht sich durch den Kurs. Die Code-Übungen stellen sie wörtlich: Sie lassen deine Tests gegen absichtlich fehlerhafte Varianten des Codes laufen, sogenannte Mutanten.

  > [!NOTE] Coverage zeigt Lücken, keine Qualität
  > Die Suite aus der Einleitung hatte 100 % Zeilenabdeckung. Werkzeuge wie [coverage.py](https://coverage.readthedocs.io/en/latest/branch.html) messen, welche Zeilen und Verzweigungen ein Lauf ausgeführt hat. Eine nie ausgeführte Zeile ist sicher ungetestet. Eine ausgeführte Zeile ist aber noch nicht geprüft: Ob eine Assertion den Unterschied zwischen 150 und 300 Cent bemerkt, misst Coverage nicht. Wie du Coverage richtig liest und mit Mutation Testing ergänzt, zeigt das Modul [Regressionsstrategien](/testing/regression-strategien).

  ## Ein guter Test: Arrange, Act, Assert und ein Name, der die Regel nennt

  Fast jeder Test hat drei Teile. **Arrange** baut die Ausgangslage auf, **Act** führt die eine Aktion aus, um die es geht, **Assert** prüft das Ergebnis. In der Sprache von Behaviour-Driven Development heißt dasselbe [Given-When-Then](https://martinfowler.com/bliki/GivenWhenThen.html): Gegeben eine Fahrt von 30 Minuten, wenn sie abgerechnet wird, dann kostet sie 150 Cent. Im ersten Test markieren Kommentare die drei Teile; in kurzen Tests reicht die Reihenfolge.

  ```python pytest
  def mietpreis(minuten: int) -> int:
      """City-Rad: 150 Cent je angefangene 30 Minuten, bis 5 Minuten kostenlos."""
      if minuten <= 5:
          return 0
      return (minuten + 29) // 30 * 150


  def test_genau_30_minuten_sind_ein_block():
      # Arrange: eine Fahrt, die genau auf der Blockgrenze endet
      minuten = 30
      # Act
      preis = mietpreis(minuten)
      # Assert
      assert preis == 150


  def test_minute_31_beginnt_den_zweiten_block():
      assert mietpreis(31) == 300


  def test_fahrt_bis_5_minuten_ist_kostenlos():
      assert mietpreis(5) == 0
  ```

  Führ den Block aus: pytest listet jeden Test mit seinem Namen, und die Liste liest sich wie die Tarifregeln. Dahinter stehen drei Gewohnheiten.

  **Der Name nennt Regel und Fall.** `test_genau_30_minuten_sind_ein_block` sagt, was gelten soll. `test_mietpreis_2` sagt nur, dass es einen ersten gab. Wird der Test rot, liest du im Report, welche Zusage gebrochen ist, ohne den Code zu öffnen.

  **Ein Grund zu scheitern.** Ein Test prüft ein Verhalten. Mehrere `assert` sind in Ordnung, solange sie dasselbe Verhalten von mehreren Seiten ansehen, etwa alle Felder einer Quittung. Prüft ein Test Fehlstart, E-Bike und Abo nacheinander, verdeckt das erste rote `assert` die übrigen, und kein Name beschreibt, worum es geht.

  **Über die öffentliche Schnittstelle testen.** Die Tests rufen `mietpreis` auf, keine interne Hilfsfunktion wie `_bloecke`. Ein Test der Hilfsfunktion legt fest, *wie* der Preis entsteht. Ein Refactoring ohne jeden Fehler macht ihn trotzdem rot, und nach ein paar solchen Fehlalarmen nimmt das Team rote Tests nicht mehr ernst.

  ## pytest: Discovery, assert und Fehlermeldungen, die etwas sagen

  pytest findet Tests über Namenskonventionen ([Test Discovery](https://docs.pytest.org/en/stable/explanation/goodpractices.html#conventions-for-python-test-discovery)): Dateien `test_*.py` oder `*_test.py`, darin Funktionen, deren Name mit `test` beginnt, und Methoden in Klassen mit `Test`-Präfix ohne `__init__`. Was nicht passt, wird nicht ausgeführt, und zwar ohne Fehlermeldung. Eine Funktion `pruefe_fehlstart()` ist für pytest ein gewöhnlicher Helfer.

  Mit dem Refactoring aus der Einleitung und sechs Tests in `tests/test_tarif.py` sieht ein Lauf so aus:

  ```console
  $ pytest -q
  ..F...                                                   [100%]
  =========================== FAILURES ===========================
  _____________ test_genau_30_minuten_sind_ein_block _____________

      def test_genau_30_minuten_sind_ein_block():
  >       assert mietpreis(30) == 150
  E       assert 300 == 150
  E        +  where 300 = mietpreis(30)

  tests/test_tarif.py:15: AssertionError
  =================== short test summary info ====================
  FAILED tests/test_tarif.py::test_genau_30_minuten_sind_ein_block
  1 failed, 5 passed in 0.09s
  $ pytest -q -k block --tb=no
  .F..                                                     [100%]
  =================== short test summary info ====================
  FAILED tests/test_tarif.py::test_genau_30_minuten_sind_ein_block
  1 failed, 3 passed, 2 deselected in 0.09s
  ```

  pytest zeigt mehr als „AssertionError“. Es schreibt die `assert`-Anweisungen in Testmodulen beim Import um und berichtet die Werte beider Seiten ([Assertion Introspection](https://docs.pytest.org/en/stable/how-to/assert.html#assert-details)); `where 300 = mietpreis(30)` nennt den Aufruf, der den falschen Wert lieferte. `-k block` wählt Tests über einen Teil ihres Namens aus, `tests/test_tarif.py::test_genau_30_minuten_sind_ein_block` startet genau einen Test über seine Node-ID.

  Wie hilfreich eine Meldung ist, entscheidest du mit der Form des `assert`. Der folgende Block scheitert absichtlich: `quittung` vergisst den E-Bike-Satz. Vergleich die beiden Meldungen.

  ```python pytest fails
  SATZ = {"city": 150, "ebike": 300}


  def quittung(minuten: int, rad: str) -> dict:
      bloecke = 0 if minuten <= 5 else (minuten + 29) // 30
      return {"rad": rad, "minuten": minuten, "bloecke": bloecke, "cent": bloecke * 150}


  def ist_e_bike_preis(q: dict) -> bool:
      return q["cent"] == q["bloecke"] * SATZ["ebike"]


  def test_quittung_e_bike_45_minuten():
      assert quittung(45, "ebike") == {"rad": "ebike", "minuten": 45, "bloecke": 2, "cent": 600}


  def test_quittung_e_bike_mit_hilfsfunktion():
      assert ist_e_bike_preis(quittung(45, "ebike"))
  ```

  Der erste Test vergleicht das ganze Ergebnis mit dem erwarteten Wert, und pytest meldet genau das abweichende Feld: `{'cent': 300} != {'cent': 600}`. Der zweite verpackt die Prüfung in eine Funktion, die nur `True` oder `False` liefert. Du siehst die Quittung, aber nicht, was erwartet war, und musst es selbst nachrechnen. Vergleiche deshalb Werte mit Werten. Eine eigene Meldung (`assert x == y, "…"`) lohnt sich, wenn sie Kontext ergänzt, den die Werte nicht zeigen.

  Fehlerfälle gehören zum Vertrag. `pytest.raises` prüft, dass der Block eine Exception des Typs oder eines Untertyps auslöst; `match` prüft zusätzlich die Meldung. Für Kommazahlen gibt es [`pytest.approx`](https://docs.pytest.org/en/stable/reference/reference.html#pytest-approx), denn `0.1 + 0.2 == 0.3` ist in Python `False`. Ohne Angabe gilt eine relative Toleranz von 10⁻⁶, für Werte nahe 0 zusätzlich eine absolute von 10⁻¹².

  ```python pytest
  import re

  import pytest


  def mietpreis(minuten: int) -> int:
      if minuten < 0:
          raise ValueError(f"Dauer darf nicht negativ sein (war {minuten} min)")
      if minuten <= 5:
          return 0
      return (minuten + 29) // 30 * 150


  def durchschnittliche_dauer(fahrten: list[int]) -> float:
      return sum(fahrten) / len(fahrten)


  def test_negative_dauer_wird_abgelehnt():
      with pytest.raises(ValueError, match="nicht negativ"):
          mietpreis(-1)


  def test_meldung_nennt_den_wert():
      with pytest.raises(ValueError, match=re.escape("(war -7 min)")) as fehler:
          mietpreis(-7)
      assert "Dauer" in str(fehler.value)


  def test_durchschnitt_mit_toleranz():
      assert durchschnittliche_dauer([12, 7, 3]) == pytest.approx(7.3333, rel=1e-4)
      assert 0.1 + 0.2 == pytest.approx(0.3)
  ```

  Im `with`-Block steht nur der Aufruf, der scheitern soll. Steht dort auch der Aufbau, kann eine Exception aus dem Aufbau den Test grün machen. Dass Radwerk Cent als `int` speichert, zahlt sich hier aus: Preise vergleichst du exakt, `approx` brauchst du nur für echte Messwerte wie Durchschnitte.

  > [!WARNING] `match` ist ein regulärer Ausdruck
  > pytest sucht das Muster mit `re.search` in `str(exception)` ([Referenz](https://docs.pytest.org/en/stable/reference/reference.html#pytest-raises)). Klammern, Punkte und `+` haben dort eine Bedeutung: `match="(war -7 min)"` sucht eine Gruppe und findet den Text mit Klammern nicht. Feste Texte mit Sonderzeichen packst du in `re.escape(…)`.

  ## Testfälle systematisch finden: Äquivalenzklassen und Grenzwerte

  Die Werte 3 und 45 Minuten sahen vernünftig aus und waren trotzdem nutzlos gegen den Fehler. Testfälle aus dem Bauch sind meist Werte aus der Mitte. Fehler sitzen aber an den Rändern: `<` statt `<=`, eine Grenze um eins verschoben, ein vergessenes Aufrunden. Zwei Techniken machen die Auswahl systematisch.

  **Äquivalenzklassen.** Teile die Eingaben in Klassen, die die Regel gleich behandelt. Für `mietpreis` sind das: negative Dauer (ungültig, `ValueError`), 0 bis 5 Minuten (Fehlstart), 6 bis 30 Minuten (ein Block), 31 bis 60 Minuten (zwei Blöcke) und so weiter. Aus jeder Klasse genügt im Prinzip ein Vertreter, denn die Spezifikation behandelt alle Werte einer Klasse gleich. Ungültige Eingaben sind eigene Klassen und brauchen eigene Tests.

  **Grenzwerte.** Ob die Implementierung die Klassen genauso schneidet wie die Spezifikation, zeigt sich nur an den Grenzen. Teste an jeder Grenze den letzten Wert der einen Klasse und den ersten der nächsten:

  ```text
  Klasse     ungültig | Fehlstart | 1 Block  | 2 Blöcke | 3 Blöcke …
  Minuten    … -1     | 0 … 5     | 6 … 30   | 31 … 60  | 61 …
  Preis      Fehler   | 0         | 150      | 300      | 450
  Testwerte     -1      0     5     6    30    31    60    61
  ```

  Mit 30 und 31 wäre der Fehler aus der Einleitung sofort aufgefallen. 3 und 45 liegen mitten in ihren Klassen und liefern für die richtige und die falsche Implementierung dasselbe. Die erwarteten Werte liest du aus der Regel ab, nie aus dem Code: Ein Test, der `(minuten // 30 + 1) * 150` als Erwartung ausrechnet, wiederholt den Fehler, den er finden soll.

  > [!MERKE]
  > Teste jede Grenze von beiden Seiten. Leite Erwartungen aus der Spezifikation ab, nicht aus der Implementierung.

  Für Werte, an die du nicht denkst, gibt es Property-based Testing: Hypothesis erzeugt Hunderte Eingaben und sucht gezielt Grenzfälle. Das ist ein eigenes Modul, [Property-based Testing](/testing/property-based-testing). Die Klassen und Grenzen bleiben trotzdem dein erstes Werkzeug, weil sie dir sagen, *welche* Eigenschaften du prüfen musst.

  ## Entscheidungstabellen und Parametrisierung mit IDs

  Hängt das Ergebnis von mehreren Bedingungen gleichzeitig ab, reichen Klassen pro Eingabe nicht. Ein Radwerk-Gutschein wird abgelehnt, wenn das Format falsch ist, wenn das Ablaufdatum vorbei ist oder wenn derselbe Kunde ihn schon eingelöst hat. Gültig ist er bis einschließlich Ablaufdatum. Eine Entscheidungstabelle schreibt jede Kombination von Bedingungen als Regel auf; „–“ heißt „spielt keine Rolle“:

  | Bedingung | R1 | R2 | R3 | R4 |
  | --- | --- | --- | --- | --- |
  | Format `RW-` + 6 Zeichen | nein | ja | ja | ja |
  | heute ≤ Ablaufdatum | – | nein | ja | ja |
  | vom Kunden schon eingelöst | – | – | ja | nein |
  | **Ergebnis** | ungültig | abgelaufen | bereits eingelöst | ok |

  Drei Bedingungen mit je zwei Werten ergeben acht Kombinationen. Die Striche fassen Kombinationen mit gleichem Ergebnis zusammen, übrig bleiben vier Regeln. Jede Spalte wird ein Testfall, und innerhalb einer Spalte wählst du wieder Grenzwerte: R2 läuft gestern ab, R4 heute.

  Mit [`@pytest.mark.parametrize`](https://docs.pytest.org/en/stable/how-to/parametrize.html#pytest-mark-parametrize-parametrizing-test-functions) wird die Tabelle zum Test. Ohne weitere Angaben baut pytest die Namen der Fälle aus den Parametern zusammen:

  ```console
  $ pytest -v tests/test_gutschein.py
  …
  tests/test_gutschein.py::test_gutschein[RW-AB12C-ablauf0-False-ung\xfcltig] PASSED [ 25%]
  tests/test_gutschein.py::test_gutschein[RW-AB12CD-ablauf1-False-abgelaufen] PASSED [ 50%]
  tests/test_gutschein.py::test_gutschein[RW-AB12CD-ablauf2-True-bereits eingel\xf6st] PASSED [ 75%]
  tests/test_gutschein.py::test_gutschein[RW-AB12CD-ablauf3-False-ok] PASSED [100%]
  ```

  `ablauf0` und `ung\xfcltig` sagen niemandem etwas. Gib jedem Fall eine ID, die die Regel nennt, mit `pytest.param(…, id=…)` oder einer Liste `ids=[…]` ([Optionen für Test-IDs](https://docs.pytest.org/en/stable/example/parametrize.html#different-options-for-test-ids)):

  ```python pytest
  import re
  from datetime import date

  import pytest

  CODE = re.compile(r"RW-[A-Z0-9]{6}")


  def pruefe_gutschein(code: str, ablauf: date, heute: date, schon_eingeloest: bool) -> str:
      if not CODE.fullmatch(code):
          return "ungültig"
      if heute > ablauf:
          return "abgelaufen"
      if schon_eingeloest:
          return "bereits eingelöst"
      return "ok"


  HEUTE = date(2026, 10, 3)


  @pytest.mark.parametrize(
      "code, ablauf, eingeloest, erwartet",
      [
          pytest.param("RW-AB12C", HEUTE, False, "ungültig", id="R1-format-falsch"),
          pytest.param("RW-AB12CD", date(2026, 10, 2), False, "abgelaufen", id="R2-seit-gestern-abgelaufen"),
          pytest.param("RW-AB12CD", HEUTE, True, "bereits eingelöst", id="R3-schon-eingeloest"),
          pytest.param("RW-AB12CD", HEUTE, False, "ok", id="R4-letzter-gueltiger-tag"),
      ],
  )
  def test_gutschein_einloesen(code, ablauf, eingeloest, erwartet):
      assert pruefe_gutschein(code, ablauf, HEUTE, eingeloest) == erwartet
  ```

  Jeder Fall wird einzeln berichtet. Scheitert R2, laufen R3 und R4 trotzdem, anders als bei einer Schleife mit mehreren `assert` in einem Test. Seit pytest 9.0 macht die Option `strict_parametrization_ids` doppelte IDs zum Fehler; ohne sie hängt pytest still `0`, `1` … an.

  > [!PRAXIS] Radwerk: Tabellen im Review
  > Ändert ein Pull Request eine Tarif- oder Gutscheinregel, hängt die Autorin die Entscheidungstabelle in die Beschreibung, und jede Spalte taucht als ID im parametrisierten Test auf. Im Review prüft das Team zwei Dinge: Gibt es für jede Spalte einen Fall, und steht an jeder Grenze ein Wert von beiden Seiten? Die Standardfrage dazu lautet: „Welcher plausible Fehler würde deine Tests überleben?“

  ## Fixtures: Aufbau, Abbau, tmp_path und capsys

  Eine Fixture stellt bereit, was ein Test braucht. Der Test fordert sie über einen Parameter mit ihrem Namen an. Standardmäßig entsteht sie für jeden Test neu, deshalb teilen sich Tests keinen veränderlichen Zustand. Braucht eine Ressource einen Abbau, schreibst du die Fixture mit [`yield`](https://docs.pytest.org/en/stable/how-to/fixtures.html#yield-fixtures-recommended): Der Code vor `yield` baut auf, der Test läuft an der Stelle von `yield`, der Code danach räumt auf – auch wenn der Test scheitert. Mehrere Fixtures räumen in umgekehrter Reihenfolge ab.

  Zwei eingebaute Fixtures brauchst du ständig. [`tmp_path`](https://docs.pytest.org/en/stable/how-to/tmp_path.html#the-tmp-path-fixture) ist ein frisches Verzeichnis als `pathlib.Path`, eines pro Test. [`capsys`](https://docs.pytest.org/en/stable/how-to/capture-stdout-stderr.html#accessing-captured-output-from-a-test-function) fängt, was der Code auf stdout und stderr schreibt; `capsys.readouterr()` liefert beides als `out` und `err`.

  ```python pytest
  import pytest


  class Fahrtenbuch:
      """Hängt abgerechnete Fahrten an eine CSV-Datei an."""

      def __init__(self, pfad):
          self.datei = open(pfad, "a", encoding="utf-8")

      def eintragen(self, fahrt_id: int, cent: int) -> None:
          self.datei.write(f"{fahrt_id};{cent}\n")
          self.datei.flush()

      def close(self) -> None:
          self.datei.close()


  def drucke_quittung(fahrt_id: int, cent: int) -> None:
      print(f"Fahrt {fahrt_id}: {cent // 100},{cent % 100:02d} €")


  @pytest.fixture
  def fahrtenbuch(tmp_path):
      buch = Fahrtenbuch(tmp_path / "fahrten.csv")  # Aufbau
      yield buch                                     # hier läuft der Test
      buch.close()                                   # Abbau, auch nach einem roten Test


  def test_eintrag_landet_in_der_datei(fahrtenbuch, tmp_path):
      fahrtenbuch.eintragen(1204, 300)
      assert (tmp_path / "fahrten.csv").read_text(encoding="utf-8") == "1204;300\n"


  def test_quittung_zeigt_cent_zweistellig(capsys):
      drucke_quittung(1204, 305)
      assert capsys.readouterr().out == "Fahrt 1204: 3,05 €\n"
  ```

  Die Fixture `fahrtenbuch` fordert selbst `tmp_path` an. Der Test bekommt dasselbe Verzeichnis, weil eine Fixture innerhalb eines Tests nur einmal entsteht. Fixtures, die mehrere Testdateien brauchen, legst du in eine `conftest.py`; pytest findet sie dort ohne Import. Einen größeren `scope` (Modul, Session) wählst du nur für teure Ressourcen, die kein Test verändert. Wie echte Datenbanken in Fixtures aussehen, zeigt das Modul [Integrationstests](/testing/integrationstests).

  > [!INTERVIEW] „Wie findest du die Testfälle für eine neue Funktion?“
  > Ich lese die Regel und teile die Eingaben in Äquivalenzklassen, gültige und ungültige. An jeder Grenze teste ich beide Seiten, weil Off-by-one-Fehler dort sitzen. Hängt das Ergebnis von mehreren Bedingungen ab, schreibe ich eine Entscheidungstabelle und mache jede Spalte zu einem parametrisierten Fall mit sprechender ID. Zum Schluss frage ich, welcher plausible Fehler meine Tests überleben würde, etwa `<` statt `<=`, und ergänze genau dafür einen Fall.

  ## Häufige Fehler

  - **Nur Werte aus der Mitte.** 45 Minuten testet die Klasse, nicht die Grenze. Zu jeder Grenze gehören zwei Werte.
  - **Erwartung mit derselben Formel berechnet.** `assert mietpreis(m) == (m + 29) // 30 * 150` prüft den Code gegen sich selbst. Schreib die erwarteten Cent-Beträge als Zahlen hin.
  - **`assert` mit Klammern.** `assert(mietpreis(30) == 150, "…")` prüft ein Tupel, und ein nicht leeres Tupel ist immer wahr. Der Test bleibt grün. pytest warnt mit `assertion is always true, perhaps remove parentheses?`, aber nur in dem Lauf, in dem es die Datei neu übersetzt. Ruff meldet die Zeile bei jedem Lauf als `F631`.
  - **Zu breites `pytest.raises`.** `pytest.raises(Exception)` fängt jeden Fehler, auch einen Tippfehler im Test. Nimm den genauen Typ, `match` für die Meldung und nur den einen Aufruf im `with`-Block.
  - **Tests, die nicht gefunden werden.** Eine Datei `tarif_tests.py` oder eine Funktion `pruefe_fehlstart` läuft nie. Achte darauf, dass die Zahl der Tests im Report steigt, wenn du einen schreibst.
  - **Tests gegen Interna.** Wer `_bloecke` testet, bekommt nach jedem Refactoring rote Tests ohne Fehler im Verhalten.
  - **Geteilter Zustand.** Eine Liste auf Modulebene, die ein Test füllt und ein anderer liest, macht die Suite von der Reihenfolge abhängig. Fixtures mit Funktions-Scope geben jedem Test einen frischen Zustand.

  ## Zusammenfassung

  - Tests geben schnelles Feedback, schützen vor Regressionen und dokumentieren Regeln. Sie zeigen Fehler, nie deren Abwesenheit.
  - Ein Test hat Arrange, Act und Assert, einen Namen, der Regel und Fall nennt, und einen Grund zu scheitern.
  - Teste über die öffentliche Schnittstelle. Tests gegen Interna brechen bei Refactorings ohne Fehler.
  - Äquivalenzklassen sagen, welche Fälle die Regel unterscheidet. Grenzwerte auf beiden Seiten finden Off-by-one-Fehler. Entscheidungstabellen decken Kombinationen von Bedingungen ab.
  - Vergleiche ganze Werte mit erwarteten Werten, dann zeigt pytest die genaue Abweichung. `pytest.raises` mit `match` prüft Fehlerfälle, `pytest.approx` Kommazahlen.
  - `parametrize` mit IDs macht aus einer Tabelle einzeln berichtete, lesbare Fälle.
  - Fixtures mit `yield` bauen auf und räumen auf; `tmp_path` und `capsys` prüfen Dateien und Ausgaben ohne Spuren.
  - Ein guter Test fängt einen plausiblen Fehler. Coverage zeigt nur, welche Zeilen liefen.
exercises:
  - id: gruener-lauf
    type: choice
    title: Was ein grüner Lauf beweist
    prompt: |
      Nach deinem Refactoring des Radwerk-Tarifs meldet pytest: 214 Tests bestanden, 0 fehlgeschlagen. Das Coverage-Werkzeug zeigt 100 % Zeilenabdeckung für `tarif.py`. Welche Aussagen stimmen?
    options:
      - text: Alle Beispiele, die die Tests prüfen, liefern weiterhin die erwarteten Ergebnisse.
        correct: true
        why: Genau das sagt ein grüner Lauf – nicht mehr und nicht weniger.
      - text: Der Tarif enthält keinen Fehler mehr.
        correct: false
        why: Tests zeigen die Anwesenheit von Fehlern, nie ihre Abwesenheit. Eingaben, die kein Test verwendet, können falsch berechnet werden.
      - text: Jede Zeile von `tarif.py` wurde ausgeführt. Ob dabei jedes Verhalten geprüft wurde, sagt diese Zahl nicht.
        correct: true
        why: Coverage misst Ausführung. Ob eine Assertion den Unterschied zwischen richtigem und falschem Ergebnis bemerkt, misst sie nicht.
      - text: Mit 100 % Zeilenabdeckung wäre auch der Fehler bei genau 30 Minuten aufgefallen.
        correct: false
        why: Die Tests mit 3 und 45 Minuten führten jede Zeile aus und blieben trotzdem grün. Abdeckung ersetzt keinen Testfall an der Grenze.
    explanation: |
      Ein grüner Lauf ist eine Aussage über die geprüften Beispiele. Wie viel sie wert ist, hängt davon ab, ob die Beispiele die Stellen treffen, an denen Fehler entstehen – Grenzen, Sonderfälle, Kombinationen. Coverage hilft, nie ausgeführten Code zu finden. Ob die Tests einen falschen Wert bemerken würden, prüft erst ein Testfall an der richtigen Stelle oder Mutation Testing.
    resources:
      - title: EWD 249 · Notes on Structured Programming
        url: https://www.cs.utexas.edu/~EWD/transcriptions/EWD02xx/EWD249/EWD249.html
      - title: coverage.py · Branch coverage measurement
        url: https://coverage.readthedocs.io/en/latest/branch.html

  - id: testfaelle-ableiten
    type: order
    title: Von der Regel zum Testfall
    prompt: |
      Bring die Schritte in die Reihenfolge, in der du für eine neue Regel wie „150 Cent je angefangene 30 Minuten, bis 5 Minuten kostenlos“ systematisch Testfälle findest.
    lang: text
    lines: |
      Regel lesen: Welche Eingaben gibt es, welches Ergebnis?
      Gültige Eingaben in Klassen teilen, die die Regel gleich behandelt
      Ungültige Eingaben als eigene Klassen ergänzen
      Grenzen zwischen benachbarten Klassen markieren
      An jeder Grenze den letzten Wert der einen und den ersten der nächsten Klasse wählen
      Für jeden Testwert das erwartete Ergebnis aus der Regel ablesen
      Die Fälle als parametrisierten Test mit sprechenden IDs schreiben
    alternatives:
      - [1, 3, 2, 4, 5, 6, 7]
    explanation: |
      Erst die Klassen, dann ihre Grenzen, dann die Werte an den Grenzen – diese Reihenfolge stellt sicher, dass kein Rand fehlt. Ob du die ungültigen Klassen vor oder nach den gültigen notierst, ist egal; deshalb gelten beide Reihenfolgen. Die Erwartungen kommen aus der Regel, nicht aus dem Code: Sonst prüft der Test die Implementierung gegen sich selbst. Erst am Ende wird daraus Code.
    resources:
      - title: pytest · Parametrizing test functions
        url: https://docs.pytest.org/en/stable/how-to/parametrize.html#pytest-mark-parametrize-parametrizing-test-functions

  - id: welche-werte-schlagen-an
    type: output
    title: Welche Werte schlagen Alarm?
    prompt: |
      Diese Implementierung des City-Rad-Tarifs hat zwei Fehler. Richtig wäre: 0 Cent bis einschließlich 5 Minuten, sonst 150 Cent je angefangene 30 Minuten. Die Schleife prüft sieben Testfälle von Hand. Was gibt das Programm aus?
    lang: python
    code: |
      def mietpreis(minuten):
          if minuten < 5:
              return 0
          return (minuten // 30 + 1) * 150

      faelle = [(3, 0), (5, 0), (6, 150), (17, 150), (30, 150), (31, 300), (45, 300)]
      for minuten, erwartet in faelle:
          ist = mietpreis(minuten)
          if ist != erwartet:
              print(f"{minuten} min: {ist} statt {erwartet}")
      print("geprüft:", len(faelle))
    expected: |
      5 min: 150 statt 0
      30 min: 300 statt 150
      geprüft: 7
    explanation: |
      `minuten < 5` lässt die 5 aus der Fehlstart-Klasse fallen: `(5 // 30 + 1) * 150` ergibt 150. `minuten // 30 + 1` zählt bei genau 30 Minuten einen Block zu viel. Beide Fehler zeigen sich nur auf einer Grenze. 3, 17 und 45 liegen mitten in ihren Klassen und liefern für die richtige und die falsche Implementierung dasselbe. Auch 6 und 31, die ersten Werte nach einer Grenze, bemerken diese Fehler nicht – deshalb gehören zu jeder Grenze beide Seiten.
    resources:
      - title: pytest · Parametrizing test functions
        url: https://docs.pytest.org/en/stable/how-to/parametrize.html#pytest-mark-parametrize-parametrizing-test-functions

  - id: match-ist-regex
    type: output
    title: Was findet match?
    prompt: |
      `pytest.raises(…, match=muster)` prüft die Meldung mit `re.search(muster, str(exception))`. Was gibt dieses Programm aus?
    lang: python
    code: |
      import re

      meldung = "Gutschein RW-AB12CD ist abgelaufen (seit 02.10.2026)"

      print(bool(re.search("abgelaufen", meldung)))
      print(bool(re.search("abgelaufen (seit 02.10.2026)", meldung)))
      print(bool(re.search(re.escape("abgelaufen (seit 02.10.2026)"), meldung)))
      print(bool(re.search("RW-AB12CD", "Gutschein RW-AB12CDX ist ungültig")))
      print(bool(re.search("seit 02.10.2026", "seit 02/10/2026")))
    expected: |
      True
      False
      True
      True
      True
    explanation: |
      `re.search` sucht das Muster irgendwo im Text, deshalb reicht ein Teil der Meldung (Zeile 1) und `RW-AB12CD` passt auch in `RW-AB12CDX` (Zeile 4). In Zeile 2 sind die Klammern eine Gruppe: Das Muster verlangt „abgelaufen seit …“ ohne Klammern und findet den Text nicht. `re.escape` macht aus Sonderzeichen gewöhnliche Zeichen (Zeile 3). In Zeile 5 steht der Punkt für ein beliebiges Zeichen und passt deshalb auch auf `/`. Für `match` heißt das: feste Texte mit `re.escape`, und wer die ganze Meldung festlegen will, verankert das Muster mit `^…$`.
    resources:
      - title: pytest · pytest.raises
        url: https://docs.pytest.org/en/stable/reference/reference.html#pytest-raises
      - title: Python · re.escape
        url: https://docs.python.org/3/library/re.html#re.escape

  - id: pytest-werkzeuge
    type: gap
    title: Fixture, Parameter, Ausnahme, Ausgabe
    prompt: |
      Ergänze die Testdatei. `fahrtenbuch` soll ein Fahrtenbuch in einem frischen Verzeichnis anlegen, es dem Test übergeben und danach schließen. Die Fälle von `test_mietpreis` bekommen IDs. Der negative Fall soll einen `ValueError` erwarten, dessen Meldung „negativ“ enthält. `test_quittung` vergleicht die Standardausgabe.
    lang: python
    code: |
      import pytest

      from kasse import Fahrtenbuch, drucke_quittung
      from tarif import mietpreis


      @pytest.fixture
      def fahrtenbuch(⟦tmp_path⟧):
          buch = Fahrtenbuch(tmp_path / "fahrten.csv")
          ⟦yield buch⟧
          buch.close()


      @pytest.mark.parametrize(
          "minuten, cent",
          [
              ⟦pytest.param⟧(5, 0, ⟦id⟧="fehlstart-letzte-minute"),
              pytest.param(30, 150, id="ein-block-voll"),
          ],
      )
      def test_mietpreis(minuten, cent):
          assert mietpreis(minuten) == cent


      def test_negative_dauer():
          with ⟦pytest.raises(ValueError, match="negativ")⟧:
              mietpreis(-1)


      def test_quittung(capsys):
          drucke_quittung(1204, 305)
          assert ⟦capsys.readouterr().out⟧ == "Fahrt 1204: 3,05 €\n"
    gaps:
      - label: Eingebaute Fixture für ein frisches Verzeichnis
        hint: Sie liefert ein `pathlib.Path`; ihr Name endet auf `_path`.
      - label: Übergabe an den Test
        hint: Was vor diesem Schlüsselwort steht, ist Aufbau, was danach steht, ist Abbau.
      - label: Ein Fall mit eigener ID
        hint: Ein einzelner Parametersatz mit Zusatzangaben ist ein `pytest.…`.
      - label: Name des Arguments für die ID
        hint: Zwei Buchstaben.
      - label: Erwartete Exception mit Meldung
        hint: "`pytest.raises(Typ, match=…)`"
        accept:
          - pytest.raises(ValueError, match=r"negativ")
          - pytest.raises(expected_exception=ValueError, match="negativ")
      - label: Gefangene Standardausgabe
        hint: "`readouterr()` liefert ein Paar aus `out` und `err`."
        accept:
          - capsys.readouterr()[0]
    explanation: |
      `tmp_path` ist eine eingebaute Fixture, die `fahrtenbuch` selbst anfordert – Fixtures dürfen andere Fixtures nutzen. Mit `yield buch` übergibt die Fixture das Objekt; der Code danach läuft nach dem Test, auch wenn er scheitert. `pytest.param(…, id=…)` gibt einem Parametersatz einen lesbaren Namen im Report. `pytest.raises` mit `match` prüft Typ und Meldung; `match` ist ein regulärer Ausdruck, der irgendwo in der Meldung passen muss. `capsys.readouterr()` liefert alles, was seit dem letzten Aufruf auf stdout und stderr geschrieben wurde, als Paar mit den Feldern `out` und `err`.
    resources:
      - title: pytest · Yield fixtures
        url: https://docs.pytest.org/en/stable/how-to/fixtures.html#yield-fixtures-recommended
      - title: pytest · Accessing captured output from a test function
        url: https://docs.pytest.org/en/stable/how-to/capture-stdout-stderr.html#accessing-captured-output-from-a-test-function

  - id: preise-mit-grenzen
    type: code
    title: Tests, die falsche Preise bemerken
    prompt: |
      `mietpreis(minuten: int, rad: str) -> int` aus `tarif.py` berechnet den Preis einer Radwerk-Fahrt in Cent:

      - `rad` ist `"city"` oder `"ebike"`. Das City-Rad kostet 150 Cent je angefangene 30 Minuten, das E-Bike 300 Cent.
      - Fahrten bis einschließlich 5 Minuten kosten 0 Cent, mit beiden Rädern.
      - Eine negative Dauer löst `ValueError` aus.

      Schreibe pytest-Tests für diese Regeln. Sie müssen gegen die richtige Implementierung grün sein und jede fehlerhafte Variante, die die Prüfung bereithält, rot werden lassen. Die Varianten siehst du nicht – leite deine Fälle aus den Regeln ab.
    lang: python
    setup: |
      from pathlib import Path

      RICHTIG = '''
      SATZ = {"city": 150, "ebike": 300}


      def mietpreis(minuten: int, rad: str) -> int:
          if minuten < 0:
              raise ValueError(f"Dauer darf nicht negativ sein: {minuten}")
          if minuten <= 5:
              return 0
          return (minuten + 29) // 30 * SATZ[rad]
      '''
      MUTANTEN = {
          "fehlstart": RICHTIG.replace("if minuten <= 5:", "if minuten < 5:"),
          "blockgrenze": RICHTIG.replace("(minuten + 29) // 30", "(minuten // 30 + 1)"),
          "e-bike-fehlstart": RICHTIG.replace("if minuten <= 5:", 'if minuten <= 5 and rad == "city":'),
          "negativ": RICHTIG.replace('    if minuten < 0:\n        raise ValueError(f"Dauer darf nicht negativ sein: {minuten}")\n', ""),
      }
      assert all(m != RICHTIG for m in MUTANTEN.values()), "Ein Mutant ist identisch mit der richtigen Version."
      Path("tarif.py").write_text(RICHTIG, encoding="utf-8")
    starter: |
      import pytest

      from tarif import mietpreis


      def test_mietpreis():
          ...
    solution: |
      import pytest

      from tarif import mietpreis


      @pytest.mark.parametrize(
          "minuten, rad, cent",
          [
              pytest.param(0, "city", 0, id="null-minuten"),
              pytest.param(5, "city", 0, id="fehlstart-letzte-minute"),
              pytest.param(6, "city", 150, id="erste-bezahlte-minute"),
              pytest.param(30, "city", 150, id="ein-block-voll"),
              pytest.param(31, "city", 300, id="zweiter-block-beginnt"),
              pytest.param(60, "city", 300, id="zwei-bloecke-voll"),
              pytest.param(5, "ebike", 0, id="e-bike-fehlstart"),
              pytest.param(6, "ebike", 300, id="e-bike-erster-block"),
              pytest.param(31, "ebike", 600, id="e-bike-zweiter-block"),
          ],
      )
      def test_mietpreis(minuten, rad, cent):
          assert mietpreis(minuten, rad) == cent


      @pytest.mark.parametrize("rad", ["city", "ebike"])
      def test_negative_dauer_wird_abgelehnt(rad):
          with pytest.raises(ValueError):
              mietpreis(-1, rad)
    tests:
      - name: Grün gegen die richtige Implementierung
        code: |
          lauf = run_pytest({"tarif.py": RICHTIG})
          assert lauf.ok, lauf.output
      - name: Fängt einen Fehler an der Fehlstart-Grenze
        code: |
          lauf = run_pytest({"tarif.py": MUTANTEN["fehlstart"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl eine Fahrt an der Fehlstart-Grenze jetzt etwas kostet."
      - name: Fängt einen Fehler an einer Blockgrenze
        code: |
          lauf = run_pytest({"tarif.py": MUTANTEN["blockgrenze"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl eine Fahrt, die genau auf einer Blockgrenze endet, einen Block zu viel kostet."
      - name: Fängt einen Fehler beim E-Bike-Fehlstart
        code: |
          lauf = run_pytest({"tarif.py": MUTANTEN["e-bike-fehlstart"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl kurze Fahrten mit dem E-Bike jetzt bezahlt werden."
      - name: Fängt eine fehlende Prüfung ungültiger Dauer
        code: |
          lauf = run_pytest({"tarif.py": MUTANTEN["negativ"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl eine negative Dauer keinen ValueError mehr auslöst."
    hints:
      - "Zeichne die Klassen für `minuten` auf: ungültig, Fehlstart, ein Block, zwei Blöcke. Wo liegen die Grenzen?"
      - Teste jede Grenze von beiden Seiten, also 5 und 6, 30 und 31. Die Fehlstart-Regel gilt für beide Räder – prüf sie auch mit dem E-Bike.
      - "`with pytest.raises(ValueError): mietpreis(-1, \"city\")` prüft die Ablehnung."
    explanation: |
      Jede fehlerhafte Variante verschiebt eine Grenze oder vergisst einen Fall: `<` statt `<=` beim Fehlstart, einen Block zu viel bei genau 30 Minuten, die Fehlstart-Regel nur fürs City-Rad, keine Prüfung negativer Werte. Gefunden werden sie nur von Fällen genau dort: 5 und 6, 30 und 31, eine kurze E-Bike-Fahrt, eine negative Dauer. Tests mit 3, 17 und 45 Minuten für das City-Rad hätten jede dieser Varianten übersehen. Die IDs machen aus dem Report eine Liste der Tarifregeln.
    resources:
      - title: pytest · Parametrizing test functions
        url: https://docs.pytest.org/en/stable/how-to/parametrize.html#pytest-mark-parametrize-parametrizing-test-functions
      - title: pytest · Assertions about expected exceptions
        url: https://docs.pytest.org/en/stable/how-to/assert.html#assertions-about-expected-exceptions

  - id: gutscheincode-format
    type: code
    title: Auch Text hat Grenzen
    prompt: |
      `ist_gueltiger_code(code: str) -> bool` aus `gutschein.py` prüft das Format eines Radwerk-Gutscheincodes. Ein Code ist genau dann gültig, wenn er mit `RW-` beginnt und danach genau sechs Zeichen folgen, von denen jedes ein Großbuchstabe von `A` bis `Z` oder eine Ziffer von `0` bis `9` ist. Davor und danach steht nichts.

      Schreibe pytest-Tests, die gegen die richtige Implementierung grün sind und jede fehlerhafte Variante rot werden lassen. Bilde Äquivalenzklassen für Zeichen und Länge, gültige wie ungültige.
    lang: python
    setup: |
      from pathlib import Path

      RICHTIG = '''
      import re

      MUSTER = re.compile(r"RW-[A-Z0-9]{6}")


      def ist_gueltiger_code(code: str) -> bool:
          return MUSTER.fullmatch(code) is not None
      '''
      MUTANTEN = {
          "rest-erlaubt": RICHTIG.replace("MUSTER.fullmatch(code)", "MUSTER.match(code)"),
          "nur-buchstaben": RICHTIG.replace("[A-Z0-9]", "[A-Z]"),
          "kleinbuchstaben": RICHTIG.replace('r"RW-[A-Z0-9]{6}")', 'r"RW-[A-Z0-9]{6}", re.IGNORECASE)'),
          "laenge": RICHTIG.replace("{6}", "{5,6}"),
      }
      assert all(m != RICHTIG for m in MUTANTEN.values()), "Ein Mutant ist identisch mit der richtigen Version."
      Path("gutschein.py").write_text(RICHTIG, encoding="utf-8")
    starter: |
      import pytest

      from gutschein import ist_gueltiger_code


      def test_gueltiger_code():
          assert ist_gueltiger_code("RW-ABCDEF")
    solution: |
      import pytest

      from gutschein import ist_gueltiger_code


      @pytest.mark.parametrize(
          "code",
          [
              pytest.param("RW-ABCDEF", id="nur-buchstaben"),
              pytest.param("RW-123456", id="nur-ziffern"),
              pytest.param("RW-7K2Q9X", id="gemischt"),
          ],
      )
      def test_gueltige_codes(code):
          assert ist_gueltiger_code(code) is True


      @pytest.mark.parametrize(
          "code",
          [
              pytest.param("RW-AB12C", id="fuenf-zeichen"),
              pytest.param("RW-AB12CD9", id="sieben-zeichen"),
              pytest.param("rw-ab12cd", id="alles-klein"),
              pytest.param("RW-ab12CD", id="klein-im-code"),
              pytest.param("RW-AB 2CD", id="leerzeichen"),
              pytest.param("RX-AB12CD", id="falsches-praefix"),
              pytest.param("RWAB12CD", id="ohne-bindestrich"),
              pytest.param("", id="leer"),
          ],
      )
      def test_ungueltige_codes(code):
          assert ist_gueltiger_code(code) is False
    tests:
      - name: Grün gegen die richtige Implementierung
        code: |
          lauf = run_pytest({"gutschein.py": RICHTIG})
          assert lauf.ok, lauf.output
      - name: Fängt Codes mit Zeichen hinter dem Code
        code: |
          lauf = run_pytest({"gutschein.py": MUTANTEN["rest-erlaubt"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl jetzt auch Codes mit zusätzlichen Zeichen am Ende durchgehen."
      - name: Fängt einen Fehler bei den erlaubten Zeichen
        code: |
          lauf = run_pytest({"gutschein.py": MUTANTEN["nur-buchstaben"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl gültige Codes mit Ziffern jetzt abgelehnt werden."
      - name: Fängt einen Fehler bei Groß- und Kleinschreibung
        code: |
          lauf = run_pytest({"gutschein.py": MUTANTEN["kleinbuchstaben"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl Kleinbuchstaben jetzt akzeptiert werden."
      - name: Fängt einen Fehler bei der Länge
        code: |
          lauf = run_pytest({"gutschein.py": MUTANTEN["laenge"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl jetzt auch zu kurze Codes durchgehen."
    hints:
      - "Klassen für die Länge des Teils nach `RW-`: zu kurz, genau sechs, zu lang. Klassen für die Zeichen – welche Arten von Zeichen nennt die Regel, welche schließt sie aus?"
      - Ein gültiger Code, der nur aus Buchstaben besteht, beweist nicht, dass Ziffern erlaubt sind. Teste jede erlaubte Zeichenart in einem gültigen Code.
      - "Fälle an den Grenzen: fünf und sieben Zeichen nach `RW-`, Kleinbuchstaben, ein Zeichen hinter einem sonst gültigen Code."
    explanation: |
      Text hat dieselben Klassen und Grenzen wie Zahlen. Bei der Länge sind fünf und sieben Zeichen die Nachbarn der gültigen sechs. Bei den Zeichen sind Großbuchstaben und Ziffern zwei gültige Klassen, die einzeln getestet werden müssen, sonst fällt eine Variante ohne Ziffern nicht auf. Kleinbuchstaben und Leerzeichen sind ungültige Klassen. Der Unterschied zwischen `match` und `fullmatch` zeigt sich nur mit Text hinter einem gültigen Code. Mit `is True` und `is False` legst du außerdem fest, dass die Funktion einen echten `bool` liefert.
    resources:
      - title: Python · re.fullmatch
        url: https://docs.python.org/3/library/re.html#re.Pattern.fullmatch
      - title: pytest · Different options for test IDs
        url: https://docs.pytest.org/en/stable/example/parametrize.html#different-options-for-test-ids

  - id: quittung-und-export
    type: code
    title: Ausgabe und Datei prüfen
    prompt: |
      `kasse.py` enthält zwei Funktionen:

      - `drucke_quittung(fahrt_id: int, cent: int) -> None` schreibt eine Zeile auf die Standardausgabe: `Fahrt <fahrt_id>: <Euro>,<Cent> €`. Die Cent stehen immer zweistellig, die Zeile endet mit einem Zeilenumbruch. Beispiel: `drucke_quittung(1204, 1250)` gibt `Fahrt 1204: 12,50 €` aus.
      - `exportiere(fahrten: list[tuple[int, int]], ziel: Path) -> None` schreibt die Fahrten als CSV nach `ziel`: zuerst die Kopfzeile `fahrt_id;cent`, danach eine Zeile `<fahrt_id>;<cent>` je Fahrt in der gegebenen Reihenfolge. Jede Zeile endet mit `\n`. Eine vorhandene Datei wird überschrieben. Auch eine leere Liste ergibt eine Datei mit Kopfzeile.

      Schreibe pytest-Tests mit `capsys` und `tmp_path`, die gegen die richtige Implementierung grün sind und jede fehlerhafte Variante rot werden lassen.
    lang: python
    setup: |
      from pathlib import Path

      RICHTIG = '''
      def drucke_quittung(fahrt_id: int, cent: int) -> None:
          print(f"Fahrt {fahrt_id}: {cent // 100},{cent % 100:02d} €")


      def exportiere(fahrten, ziel) -> None:
          with open(ziel, "w", encoding="utf-8") as datei:
              datei.write("fahrt_id;cent\\n")
              for fahrt_id, cent in fahrten:
                  datei.write(f"{fahrt_id};{cent}\\n")
      '''
      MUTANTEN = {
          "ohne-null": RICHTIG.replace("{cent % 100:02d}", "{cent % 100}"),
          "ohne-kopfzeile": RICHTIG.replace('        datei.write("fahrt_id;cent\\n")\n', ""),
          "anhaengen": RICHTIG.replace('open(ziel, "w"', 'open(ziel, "a"'),
          "leere-liste": RICHTIG.replace("    with open(", "    if not fahrten:\n        return\n    with open("),
      }
      assert all(m != RICHTIG for m in MUTANTEN.values()), "Ein Mutant ist identisch mit der richtigen Version."
      Path("kasse.py").write_text(RICHTIG, encoding="utf-8")
    starter: |
      from kasse import drucke_quittung, exportiere


      def test_quittung(capsys):
          drucke_quittung(1204, 1250)
          assert "12,50" in capsys.readouterr().out


      def test_export(tmp_path):
          ziel = tmp_path / "fahrten.csv"
          exportiere([(1204, 300)], ziel)
          assert ziel.exists()
    solution: |
      from kasse import drucke_quittung, exportiere


      def test_quittung_mit_zweistelligen_cent(capsys):
          drucke_quittung(1204, 305)
          assert capsys.readouterr().out == "Fahrt 1204: 3,05 €\n"


      def test_quittung_fuer_kostenlose_fahrt(capsys):
          drucke_quittung(7, 0)
          assert capsys.readouterr().out == "Fahrt 7: 0,00 €\n"


      def test_export_schreibt_kopfzeile_und_fahrten(tmp_path):
          ziel = tmp_path / "fahrten.csv"
          exportiere([(1204, 300), (1205, 0)], ziel)
          assert ziel.read_text(encoding="utf-8") == "fahrt_id;cent\n1204;300\n1205;0\n"


      def test_export_ueberschreibt_alte_datei(tmp_path):
          ziel = tmp_path / "fahrten.csv"
          ziel.write_text("alt\n", encoding="utf-8")
          exportiere([(1204, 300)], ziel)
          assert ziel.read_text(encoding="utf-8") == "fahrt_id;cent\n1204;300\n"


      def test_leere_liste_ergibt_nur_kopfzeile(tmp_path):
          ziel = tmp_path / "fahrten.csv"
          exportiere([], ziel)
          assert ziel.read_text(encoding="utf-8") == "fahrt_id;cent\n"
    tests:
      - name: Grün gegen die richtige Implementierung
        code: |
          lauf = run_pytest({"kasse.py": RICHTIG})
          assert lauf.ok, lauf.output
      - name: Fängt falsch formatierte Cent auf der Quittung
        code: |
          lauf = run_pytest({"kasse.py": MUTANTEN["ohne-null"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl Cent-Beträge unter 10 jetzt einstellig gedruckt werden."
      - name: Fängt einen Export ohne Kopfzeile
        code: |
          lauf = run_pytest({"kasse.py": MUTANTEN["ohne-kopfzeile"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl die Kopfzeile fehlt."
      - name: Fängt einen Export, der an eine alte Datei anhängt
        code: |
          lauf = run_pytest({"kasse.py": MUTANTEN["anhaengen"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl eine vorhandene Datei nicht mehr überschrieben wird."
      - name: Fängt einen Fehler bei leerer Fahrtenliste
        code: |
          lauf = run_pytest({"kasse.py": MUTANTEN["leere-liste"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl für eine leere Liste keine Datei mehr entsteht."
    hints:
      - Vergleiche die ganze Ausgabe und den ganzen Dateiinhalt mit `==`, nicht nur einen Teil mit `in`.
      - "Welche Cent-Beträge sind Grenzfälle für „immer zweistellig“? Denk an 0 und an Beträge wie 305."
      - Für „wird überschrieben“ legst du vor dem Export selbst eine Datei mit altem Inhalt in `tmp_path` an. Die leere Liste ist eine eigene Klasse.
    explanation: |
      `capsys.readouterr().out` und `ziel.read_text()` liefern das ganze Ergebnis, und `==` prüft es vollständig – `"12,50" in …` und `ziel.exists()` lassen fast jeden Fehler durch. Die Varianten sitzen in Klassen, die man leicht vergisst: Cent unter 10 (305 wird zu `3,5`), eine schon vorhandene Datei, eine leere Liste. Weil `tmp_path` für jeden Test ein frisches Verzeichnis liefert, legst du den Vorzustand „Datei existiert schon“ im Test selbst an und musst nichts aufräumen.
    resources:
      - title: pytest · The tmp_path fixture
        url: https://docs.pytest.org/en/stable/how-to/tmp_path.html#the-tmp-path-fixture
      - title: pytest · Accessing captured output from a test function
        url: https://docs.pytest.org/en/stable/how-to/capture-stdout-stderr.html#accessing-captured-output-from-a-test-function

  - id: assert-mit-klammern
    type: bug
    title: Grün trotz falschem Preis
    prompt: |
      Nach dem Refactoring aus der Lektion kostet eine Fahrt von genau 30 Minuten 300 statt 150 Cent. Diese Testdatei bleibt trotzdem grün: `3 passed, 1 warning`. In der Warnung steht `assertion is always true, perhaps remove parentheses?`. Finde die Zeile, die nichts prüft, und korrigiere sie so, dass sie den falschen Preis meldet.
    lang: python
    code: |
      from tarif import mietpreis


      def test_fahrt_bis_5_minuten_ist_kostenlos():
          assert mietpreis(5) == 0


      def test_genau_30_minuten_sind_ein_block():
          assert(mietpreis(30) == 150, "30 Minuten sind ein Block")


      def test_minute_31_beginnt_den_zweiten_block():
          assert mietpreis(31) == 300
    lines: [9]
    fix:
      - line: 9
        answers:
          - assert mietpreis(30) == 150, "30 Minuten sind ein Block"
          - assert mietpreis(30) == 150
          - assert (mietpreis(30) == 150), "30 Minuten sind ein Block"
          - assert (mietpreis(30) == 150)
          - assert 150 == mietpreis(30), "30 Minuten sind ein Block"
          - assert 150 == mietpreis(30)
    explanation: |
      `assert` ist in Python eine Anweisung, keine Funktion. Mit Klammern wird aus Bedingung und Meldung ein Tupel `(False, "…")`, und ein nicht leeres Tupel ist immer wahr. Die Meldung steht hinter einem Komma außerhalb der Klammern: `assert bedingung, "Meldung"`. Wer aus Kotlin, Java oder JavaScript kommt, schreibt die Klammern aus Gewohnheit. pytest warnt nur in dem Lauf, in dem es die Testdatei neu übersetzt; danach liest es sie aus `__pycache__`, und die Warnung fehlt. Verlässlich fängt das Ruff mit der Regel `F631`, die in den Standardregeln enthalten ist.
    resources:
      - title: Python · The assert statement
        url: https://docs.python.org/3/reference/simple_stmts.html#the-assert-statement
      - title: Ruff · assert-tuple (F631)
        url: https://docs.astral.sh/ruff/rules/assert-tuple/

  - id: oeffentliche-schnittstelle
    type: code
    title: Ein Test, der jedes Refactoring bricht
    prompt: |
      In `tarif.py` steht `mietpreis(minuten: int) -> int` für das City-Rad: 0 Cent bis einschließlich 5 Minuten, sonst 150 Cent je angefangene 30 Minuten. Intern nutzt die Funktion eine Hilfsfunktion `_bloecke`. Die Tests unten prüfen diese Hilfsfunktion direkt.

      Eine Kollegin hat `tarif.py` vereinfacht: `_bloecke` gibt es nicht mehr, das Verhalten von `mietpreis` ist unverändert. Seitdem ist die ganze Testdatei rot.

      Repariere die Tests: Sie sollen gegen die alte und die neue Version grün sein und weiterhin fehlerhafte Preise an den Grenzen bemerken.
    lang: python
    setup: |
      from pathlib import Path

      ALT = '''
      def _bloecke(minuten: int) -> int:
          return (minuten + 29) // 30


      def mietpreis(minuten: int) -> int:
          if minuten <= 5:
              return 0
          return _bloecke(minuten) * 150
      '''
      NEU = '''
      import math


      def mietpreis(minuten: int) -> int:
          if minuten <= 5:
              return 0
          return math.ceil(minuten / 30) * 150
      '''
      MUTANTEN = {
          "blockgrenze": ALT.replace("(minuten + 29) // 30", "minuten // 30 + 1"),
          "fehlstart": ALT.replace("minuten <= 5", "minuten < 5"),
      }
      assert all(m != ALT for m in MUTANTEN.values()), "Ein Mutant ist identisch mit der alten Version."
      Path("tarif.py").write_text(ALT, encoding="utf-8")
    starter: |
      from tarif import _bloecke, mietpreis


      def test_bloecke():
          assert _bloecke(30) == 1
          assert _bloecke(31) == 2


      def test_fehlstart():
          assert mietpreis(5) == 0
    solution: |
      import pytest

      from tarif import mietpreis


      @pytest.mark.parametrize(
          "minuten, cent",
          [
              pytest.param(5, 0, id="fehlstart-letzte-minute"),
              pytest.param(6, 150, id="erste-bezahlte-minute"),
              pytest.param(30, 150, id="ein-block-voll"),
              pytest.param(31, 300, id="zweiter-block-beginnt"),
          ],
      )
      def test_mietpreis(minuten, cent):
          assert mietpreis(minuten) == cent
    tests:
      - name: Grün gegen die alte Version
        code: |
          lauf = run_pytest({"tarif.py": ALT})
          assert lauf.ok, lauf.output
      - name: Grün nach dem Refactoring
        code: |
          lauf = run_pytest({"tarif.py": NEU})
          assert lauf.ok, "Deine Tests scheitern an einer Version mit unverändertem Verhalten:\n" + lauf.output
      - name: Fängt einen Fehler an einer Blockgrenze
        code: |
          lauf = run_pytest({"tarif.py": MUTANTEN["blockgrenze"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl genau 30 Minuten einen Block zu viel kosten."
      - name: Fängt einen Fehler an der Fehlstart-Grenze
        code: |
          lauf = run_pytest({"tarif.py": MUTANTEN["fehlstart"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl 5 Minuten jetzt etwas kosten."
    hints:
      - Was garantiert `tarif.py` seinen Aufrufern? Nur `mietpreis` gehört zur Schnittstelle.
      - "Die Fälle aus `test_bloecke` lassen sich über `mietpreis` ausdrücken: Ein Block kostet 150 Cent, zwei Blöcke 300."
      - "Entferne den Import von `_bloecke` und prüfe `mietpreis` an 5, 6, 30 und 31 Minuten."
    explanation: |
      Der Import von `_bloecke` lässt schon das Sammeln der Testdatei scheitern, sobald es die Hilfsfunktion nicht mehr gibt – alle Tests sind rot, obwohl kein Preis falsch ist. Ein solcher Fehlalarm kostet Zeit und Vertrauen. Was `_bloecke` prüfen sollte, lässt sich vollständig über `mietpreis` ausdrücken: 30 Minuten kosten einen Block, 31 Minuten zwei. Tests über die öffentliche Schnittstelle überstehen jedes Refactoring, das das Verhalten nicht ändert, und bemerken trotzdem jede Variante, die es ändert.
    resources:
      - title: pytest · Conventions for Python test discovery
        url: https://docs.pytest.org/en/stable/explanation/goodpractices.html#conventions-for-python-test-discovery
      - title: The Practical Test Pyramid · But I Really Need to Test This Private Method
        url: https://martinfowler.com/articles/practical-test-pyramid.html#private-methods-sidebar

  - id: reservierung-tests-lesen
    type: explain
    title: Was diese Tests festlegen
    prompt: |
      Diese Tests gehören zur Reservierung bei Radwerk. Eine Reservierung ist ein halboffenes Intervall `[start, ende)`, und man darf höchstens 7 Tage im Voraus reservieren. Erkläre einer neuen Kollegin, welche Regeln die Tests festschreiben, warum genau diese Werte gewählt sind und welcher Fall noch fehlt.
    lang: python
    code: |
      from datetime import datetime, timedelta

      import pytest

      from reservierung import reservierbar, ueberschneiden

      JETZT = datetime(2026, 10, 3, 12, 0)


      @pytest.mark.parametrize(
          "a, b, erwartet",
          [
              pytest.param((9, 10), (10, 11), False, id="ende-gleich-start-kein-konflikt"),
              pytest.param((9, 11), (10, 12), True, id="teilweise-ueberlappend"),
              pytest.param((9, 12), (10, 11), True, id="eine-enthaelt-die-andere"),
          ],
      )
      def test_ueberschneiden(a, b, erwartet):
          assert ueberschneiden(a, b) is erwartet


      def test_genau_sieben_tage_im_voraus_ist_erlaubt():
          assert reservierbar(JETZT + timedelta(days=7), jetzt=JETZT) is True


      def test_eine_minute_mehr_ist_zu_weit_im_voraus():
          assert reservierbar(JETZT + timedelta(days=7, minutes=1), jetzt=JETZT) is False
    points:
      - Halboffene Intervalle – endet eine Reservierung um 10 Uhr, darf die nächste um 10 Uhr beginnen; das ist die Grenze des Intervalls.
      - Bei den sieben Tagen wird die Grenze von beiden Seiten getestet – genau 7 Tage sind erlaubt, eine Minute mehr nicht.
      - "`jetzt` wird übergeben – der Test hängt nicht von der echten Uhr ab und liefert jeden Tag dasselbe Ergebnis."
      - Die IDs machen jeden Fall im Report als Regel lesbar.
      - "Ein fehlender Fall, zum Beispiel: Reservierungen in der Vergangenheit, identische Intervalle oder `b` liegt vor `a`."
    explanation: |
      Die Tests beschreiben zwei Regeln. Erstens: Zwei Reservierungen überschneiden sich, wenn sie sich wirklich teilweise oder ganz überlagern – aber nicht, wenn die eine endet, wenn die andere beginnt. Das ist die Grenze des halboffenen Intervalls `[start, ende)`, und genau dort würde ein `<=` statt `<` in der Implementierung auffallen. Zweitens: Bis genau sieben Tage im Voraus darf man reservieren; der Test mit einer Minute mehr ist die andere Seite dieser Grenze. Weil `jetzt` ein Parameter ist, laufen die Tests an jedem Tag gleich, ohne `datetime.now()`. Die IDs lesen sich im Report wie die Regeln selbst. Was fehlt, ist zum Beispiel ein Start in der Vergangenheit, zwei gleiche Intervalle und die umgekehrte Reihenfolge – `ueberschneiden(b, a)` muss dasselbe liefern wie `ueberschneiden(a, b)`.
    resources:
      - title: pytest · Different options for test IDs
        url: https://docs.pytest.org/en/stable/example/parametrize.html#different-options-for-test-ids

  - id: was-gehoert-in-den-unit-test
    type: choice
    title: Was ein Unit-Test zeigen kann
    prompt: |
      Radwerk führt einen neuen Tarif ein. Welche dieser Risiken prüfst du am besten mit schnellen Unit-Tests einer reinen Funktion – ohne Datenbank, ohne Netzwerk, ohne App?
    options:
      - text: Eine Fahrt von genau 30 Minuten kostet mit dem City-Rad 150 Cent, eine von 31 Minuten 300 Cent.
        correct: true
        why: Eine reine Rechenregel. Ein Unit-Test zeigt sie in Millisekunden und meldet genau die gebrochene Grenze.
      - text: Eine Fahrt, die um 0:30 Uhr in `Europe/Berlin` beginnt, zählt beim Tageshöchstpreis zum neuen Kalendertag.
        correct: true
        why: Bekommt die Funktion Zeitpunkte mit Zeitzone als Parameter, ist das reine Logik. Ein Unit-Test kann jede Uhrzeit und sogar die Zeitumstellung exakt nachstellen, was in höheren Ebenen kaum gelingt.
      - text: Ein Gutscheincode mit Kleinbuchstaben wird abgelehnt.
        correct: true
        why: Eine Formatregel auf einem String – ideal für parametrisierte Unit-Tests mit Äquivalenzklassen.
      - text: Der Preis landet als Cent-Betrag in PostgreSQL und kommt unverändert zurück.
        correct: false
        why: Das Risiko liegt in Spaltentyp, Treiber und Abbildung – das zeigt nur ein Test gegen eine echte Datenbank, also ein Integrationstest.
      - text: Paystream bucht den Betrag tatsächlich vom Konto des Kunden ab.
        correct: false
        why: Das hängt von einem fremden System ab. Dafür braucht es Verträge, eine Sandbox des Anbieters und Überwachung im Betrieb, keinen Unit-Test.
      - text: Die Android-App liest den Preis aus der Antwort von `POST /fahrten/{id}/beenden` richtig aus.
        correct: false
        why: Das Risiko liegt im Zusammenspiel von App und API – Feldname, Typ, Serialisierung. Ein Unit-Test einer Backend-Funktion sieht weder die Antwort noch die App; das sichern API- und Contract-Tests.
    explanation: |
      Ein Unit-Test zeigt Risiken, die vollständig in der Logik einer Funktion stecken: Rechenregeln, Formatregeln, Zeitlogik mit übergebener Zeitzone. Dort ist er die billigste und genaueste Prüfung. Risiken, die erst an einer Grenze entstehen – Datenbank, fremder Dienst, App –, sieht er nicht; dafür gibt es andere Ebenen. Welche das jeweils ist, behandelt das nächste Modul, [Testpyramide und Testgrenzen](/testing/testpyramide).
    resources:
      - title: The Practical Test Pyramid · Unit Tests
        url: https://martinfowler.com/articles/practical-test-pyramid.html#UnitTests

  - id: entscheidungstabelle-plus
    type: code
    title: Eine Entscheidungstabelle für das Abo
    prompt: |
      `fahrpreis(minuten: int, rad: str, plus: bool) -> int` aus `tarif.py` berechnet den Preis einer Radwerk-Fahrt in Cent:

      - Fahrten bis einschließlich 5 Minuten kosten 0 Cent, immer.
      - Ohne Abo kostet jede angefangene halbe Stunde den Satz des Rads: City-Rad (`"city"`) 150 Cent, E-Bike (`"ebike"`) 300 Cent.
      - Mit dem Abo „Radwerk Plus“ (`plus=True`) sind die ersten 30 Minuten jeder Fahrt kostenlos. Danach kostet jede angefangene halbe Stunde den Satz des Rads: 31 bis 60 Minuten kosten einen Satz, 61 bis 90 Minuten zwei.

      Stell eine Entscheidungstabelle aus Dauer, Abo und Rad auf und schreibe daraus einen parametrisierten Test mit sprechenden IDs. Er muss gegen die richtige Implementierung grün sein und jede fehlerhafte Variante rot werden lassen.
    lang: python
    setup: |
      from pathlib import Path

      RICHTIG = '''
      SATZ = {"city": 150, "ebike": 300}


      def fahrpreis(minuten: int, rad: str, plus: bool) -> int:
          if minuten <= 5:
              return 0
          satz = SATZ[rad]
          if plus:
              rest = minuten - 30
              return 0 if rest <= 0 else (rest + 29) // 30 * satz
          return (minuten + 29) // 30 * satz
      '''
      MUTANTEN = {
          "plus-nur-city": RICHTIG.replace("    if plus:", '    if plus and rad == "city":'),
          "plus-danach-alles": RICHTIG.replace("else (rest + 29) // 30 * satz", "else (minuten + 29) // 30 * satz"),
          "plus-grenze": RICHTIG.replace("rest = minuten - 30", "rest = minuten - 29"),
          "plus-satz": RICHTIG.replace("else (rest + 29) // 30 * satz", "else (rest + 29) // 30 * 150"),
      }
      assert all(m != RICHTIG for m in MUTANTEN.values()), "Ein Mutant ist identisch mit der richtigen Version."
      Path("tarif.py").write_text(RICHTIG, encoding="utf-8")
    starter: |
      import pytest

      from tarif import fahrpreis


      @pytest.mark.parametrize(
          "minuten, rad, plus, cent",
          [
              pytest.param(45, "city", False, 300, id="ohne-abo-zwei-bloecke"),
          ],
      )
      def test_fahrpreis(minuten, rad, plus, cent):
          assert fahrpreis(minuten, rad, plus) == cent
    solution: |
      import pytest

      from tarif import fahrpreis


      @pytest.mark.parametrize(
          "minuten, rad, plus, cent",
          [
              pytest.param(5, "ebike", False, 0, id="R1-fehlstart"),
              pytest.param(5, "ebike", True, 0, id="R1-fehlstart-mit-abo"),
              pytest.param(6, "city", True, 0, id="R2-abo-minute-6-frei"),
              pytest.param(30, "city", True, 0, id="R2-abo-30-minuten-frei"),
              pytest.param(30, "ebike", True, 0, id="R2-abo-e-bike-30-minuten-frei"),
              pytest.param(30, "city", False, 150, id="R3-city-ein-block"),
              pytest.param(30, "ebike", False, 300, id="R4-e-bike-ein-block"),
              pytest.param(31, "city", True, 150, id="R5-abo-city-ab-minute-31"),
              pytest.param(60, "city", True, 150, id="R5-abo-city-bis-minute-60"),
              pytest.param(31, "ebike", True, 300, id="R6-abo-e-bike-ab-minute-31"),
              pytest.param(31, "city", False, 300, id="R7-city-zwei-bloecke"),
              pytest.param(31, "ebike", False, 600, id="R8-e-bike-zwei-bloecke"),
              pytest.param(61, "ebike", True, 600, id="abo-e-bike-zwei-bloecke"),
          ],
      )
      def test_fahrpreis(minuten, rad, plus, cent):
          assert fahrpreis(minuten, rad, plus) == cent
    tests:
      - name: Grün gegen die richtige Implementierung
        code: |
          lauf = run_pytest({"tarif.py": RICHTIG})
          assert lauf.ok, lauf.output
      - name: Fängt einen Fehler beim Abo mit dem E-Bike
        code: |
          lauf = run_pytest({"tarif.py": MUTANTEN["plus-nur-city"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl das Abo für E-Bikes jetzt gar nicht mehr gilt."
      - name: Fängt einen Fehler bei langen Fahrten mit Abo
        code: |
          lauf = run_pytest({"tarif.py": MUTANTEN["plus-danach-alles"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl Abo-Kunden nach 30 Minuten wieder die ganze Fahrt bezahlen."
      - name: Fängt einen Fehler an der Grenze der Freiminuten
        code: |
          lauf = run_pytest({"tarif.py": MUTANTEN["plus-grenze"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl die freien Minuten beim Abo jetzt eine Minute zu früh enden."
      - name: Fängt einen falschen Satz beim Abo
        code: |
          lauf = run_pytest({"tarif.py": MUTANTEN["plus-satz"]})
          assert not lauf.ok, "Deine Tests bleiben grün, obwohl Abo-Kunden mit dem E-Bike nach 30 Minuten nur noch den City-Satz zahlen."
    hints:
      - "Bedingungen: Dauer (bis 5, 6–30, 31–60 Minuten), Abo (ja, nein), Rad (City, E-Bike). Welche Kombinationen haben dasselbe Ergebnis und lassen sich mit „–“ zusammenfassen?"
      - Jede Spalte der Tabelle wird ein Fall. Wähle in jeder Spalte Werte an den Grenzen – mit Abo vor allem 30 und 31 Minuten.
      - Mit Abo muss es Fälle mit beiden Rädern geben, und zwar sowohl innerhalb der freien 30 Minuten als auch danach.
    explanation: |
      Die Tabelle hat acht Regeln: Fehlstart (Rad und Abo egal), mit Abo bis 30 Minuten (Rad egal), ohne Abo bis 30 Minuten je Rad, mit Abo 31–60 Minuten je Rad, ohne Abo 31–60 Minuten je Rad. Jede fehlerhafte Variante bricht nur eine oder zwei Spalten: das Abo, das nur fürs City-Rad gilt, die volle Berechnung nach 30 Minuten, die eine Minute zu früh endende Freizeit, der City-Satz beim E-Bike mit Abo. Wer nur das City-Rad testet oder nur Werte aus der Mitte, übersieht mindestens eine davon. Die IDs mit Regelnummer machen im Report sichtbar, welche Spalte bricht.
