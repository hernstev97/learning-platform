id: unit-tests
title: Unit-Tests mit pytest
level: 1
minutes: 150
summary: Tests als Werkzeug, das Fehler fängt – Testfälle systematisch aus Äquivalenzklassen, Grenzwerten und Entscheidungstabellen ableiten und mit pytest so schreiben, dass ein roter Test sofort sagt, welche Regel gebrochen ist.
goals:
  - Du erklärst, was automatisierte Tests leisten (Feedback, Regressionsschutz, Spezifikation) und was ein grüner Lauf nicht beweist.
  - Du leitest Testfälle systematisch ab – mit Äquivalenzklassen, Grenzwerten auf beiden Seiten und Entscheidungstabellen.
  - Du schreibst pytest-Tests mit sprechenden Namen, Parametrisierung mit IDs, `pytest.raises(match=…)` und `pytest.approx`.
  - Du nutzt Fixtures mit `yield` sowie `tmp_path` und `capsys`, um Dateien und Ausgaben ohne Nebenwirkungen zu prüfen.
  - Du prüfst deine Tests gegen plausible Fehler und testest über die öffentliche Schnittstelle statt über Interna.
