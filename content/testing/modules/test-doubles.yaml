id: test-doubles
title: Test Doubles und Mocks
level: 2
minutes: 150
summary: Test Doubles ersetzen Zahlungsanbieter, SMS-Versand und Datenbank im Test. Richtig gewählt machen sie Tests schnell und genau, falsch eingesetzt bleiben Tests grün, obwohl der Code doppelt abbucht.
goals:
  - Du unterscheidest Dummy, Stub, Spy, Mock und Fake nach Meszaros und wählst für jede Abhängigkeit den passenden.
  - Du entscheidest begründet zwischen Zustands- und Verhaltensprüfung und prüfst Aufrufe nur dort, wo sie das sichtbare Ergebnis sind.
  - Du setzt `unittest.mock` und `monkeypatch` gezielt ein – `return_value`, `side_effect`, `call_args_list`, `patch` am Ort des Nachschlagens – und bindest Mocks mit `create_autospec` an die echte Schnittstelle.
  - Du schreibst Fakes wie ein In-Memory-Repository von Hand und weißt, wann sie einem Mock überlegen sind.
  - Du erkennst Over-Mocking und baust Tests so um, dass sie Refactorings überstehen und echte Fehler weiter finden.
