          def storniere(self, reservierung_id):
              ...
    solution: |
      from dataclasses import dataclass
      from datetime import datetime


      @dataclass(frozen=True)
      class Reservierung:
          reservierung_id: str
          rad_id: str
          start: datetime
          ende: datetime


      class Ueberschneidung(Exception):
          pass


      class InMemoryReservierungen:
          def __init__(self):
              self._alle: dict[str, Reservierung] = {}

          def speichere(self, reservierung):
              for vorhandene in self._alle.values():
                  if (
                      vorhandene.rad_id == reservierung.rad_id
                      and reservierung.start < vorhandene.ende
                      and vorhandene.start < reservierung.ende
                  ):
                      raise Ueberschneidung(f"{reservierung.rad_id} ist ab {vorhandene.start:%H:%M} belegt")
              self._alle[reservierung.reservierung_id] = reservierung

          def fuer_rad(self, rad_id):
              return sorted((r for r in self._alle.values() if r.rad_id == rad_id), key=lambda r: r.start)

          def storniere(self, reservierung_id):
              del self._alle[reservierung_id]
    tests:
      - name: Speichert und liefert die Reservierungen eines Rads sortiert
        code: |
          repo = InMemoryReservierungen()
          repo.speichere(Reservierung("A", "R-12", um(14), um(15)))
          repo.speichere(Reservierung("B", "R-7", um(9), um(10)))
          repo.speichere(Reservierung("C", "R-12", um(9), um(10)))
          ids = [r.reservierung_id for r in repo.fuer_rad("R-12")]
          assert ids == ["C", "A"], f"erwartet ['C', 'A'] (nur R-12, nach Start sortiert), bekommen {ids}"
      - name: Lehnt Überschneidungen desselben Rads ab
        code: |
          repo = InMemoryReservierungen()
          repo.speichere(Reservierung("A", "R-12", um(10), um(12)))
          for neu in [Reservierung("B", "R-12", um(11), um(13)), Reservierung("C", "R-12", um(10, 30), um(11))]:
              try:
                  repo.speichere(neu)
              except Ueberschneidung:
                  pass
              else:
                  raise AssertionError(f"{neu.reservierung_id} überschneidet sich mit A, wurde aber gespeichert.")
          ids = [r.reservierung_id for r in repo.fuer_rad("R-12")]
          assert ids == ["A"], f"Nach den abgelehnten Versuchen darf nur A gespeichert sein, gespeichert ist {ids}"
      - name: Halboffene Intervalle und andere Räder sind kein Konflikt
        code: |
          repo = InMemoryReservierungen()
          repo.speichere(Reservierung("A", "R-12", um(10), um(11)))
          repo.speichere(Reservierung("B", "R-12", um(11), um(12)))
          repo.speichere(Reservierung("C", "R-12", um(9), um(10)))
          repo.speichere(Reservierung("D", "R-7", um(10), um(11)))
          assert len(repo.fuer_rad("R-12")) == 3, "Anschlussreservierungen um 10:00 und 11:00 sind erlaubt: [start, ende) ist halboffen."
      - name: Die zurückgegebene Liste ist eine Kopie
        code: |
          repo = InMemoryReservierungen()
          repo.speichere(Reservierung("A", "R-12", um(10), um(11)))
          repo.fuer_rad("R-12").clear()
          assert len(repo.fuer_rad("R-12")) == 1, "Wer die Rückgabe von fuer_rad leert, darf den Fake nicht verändern."
      - name: Stornieren gibt den Zeitraum frei
        code: |
          repo = InMemoryReservierungen()
          repo.speichere(Reservierung("A", "R-12", um(10), um(11)))
          repo.storniere("A")
          repo.speichere(Reservierung("B", "R-12", um(10), um(11)))
          ids = [r.reservierung_id for r in repo.fuer_rad("R-12")]
          assert ids == ["B"], f"Nach dem Stornieren von A und dem Speichern von B erwartet ['B'], bekommen {ids}"
          try:
              repo.storniere("gibt-es-nicht")
          except KeyError:
              pass
          else:
              raise AssertionError("Eine unbekannte ID muss KeyError werfen.")
    hints:
      - Zwei halboffene Intervalle `[a, b)` und `[c, d)` überschneiden sich genau dann, wenn `a < d and c < b`.
      - "Ein Dictionary `reservierung_id → Reservierung` macht `storniere` zu einem `del` und liefert `KeyError` gratis."
      - "`sorted(...)` erzeugt immer eine neue Liste. Prüfe vor dem Speichern alle vorhandenen Reservierungen desselben Rads."
    explanation: |
      Ein Fake ist nur so viel wert wie seine Treue zum Original. Hätte er die Überschneidungsprüfung nicht, würden Tests grün laufen, die in Produktion an der Datenbank scheitern. Die Bedingung `neu.start < alt.ende and alt.start < neu.ende` deckt alle Fälle ab – teilweise Überlappung, eine Reservierung innerhalb einer anderen – und lässt Anschlüsse wie 10–11 und 11–12 zu, weil `11 < 11` falsch ist. Die Kopie in `fuer_rad` verhindert einen typischen Fake-Fehler: Ein Test, der die zurückgegebene Liste verändert, würde sonst den Zustand für alle folgenden Schritte verfälschen – das kann die echte Datenbank nicht. Damit Fake und PostgreSQL gleich bleiben, laufen dieselben Tests in einer parametrisierten Fixture gegen beide.
    resources:
      - title: pytest · Parametrizing fixtures
        url: https://docs.pytest.org/en/stable/how-to/fixtures.html#parametrizing-fixtures
      - title: Python · dataclasses (frozen)
        url: https://docs.python.org/3/library/dataclasses.html#frozen-instances

  - id: patch-ziel
    type: bug
    title: Die SMS geht trotzdem raus
    prompt: |
      `radwerk/abschluss.py` beginnt so und ruft später `zahlung.belaste(…)` und `sende_sms(…)` auf:

      ```python
      from radwerk import zahlung
      from radwerk.sms import sende_sms
      ```

      Der Test unten soll weder Paystream noch das SMS-Gateway erreichen. In der CI scheitert er mit `KeyError: 'SMS_GATEWAY_URL'` aus `radwerk/sms.py`. Auf einem Entwicklerrechner, auf dem die Variable gesetzt war, hat er eine echte SMS verschickt. Paystream wurde nie erreicht. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      from unittest.mock import patch

      from radwerk.abschluss import Fahrt, schliesse_fahrt_ab


      @patch("radwerk.sms.sende_sms")
      @patch("radwerk.zahlung.belaste", return_value="tx-81")
      def test_bezahlte_fahrt_wird_bestaetigt(belaste, sende_sms):
          fahrt = Fahrt("F-1042", "K-7", "+4917012345", minuten=47)

          status = schliesse_fahrt_ab(fahrt)

          assert status == "bezahlt"
          belaste.assert_called_once_with("K-7", 300, schluessel="F-1042")
          sende_sms.assert_called_once_with("+4917012345", "Danke für deine Fahrt: 300 Cent")
    lines: [6]
    fix:
      - line: 6
        answers:
          - '@patch("radwerk.abschluss.sende_sms")'
          - '@patch("radwerk.abschluss.sende_sms", autospec=True)'
    hints:
      - Die beiden Importe in `abschluss.py` sehen verschieden aus. Welcher Name wird bei jedem Aufruf in einem fremden Modul nachgeschlagen, welcher liegt in `abschluss` selbst?
      - "`from radwerk.sms import sende_sms` bindet den Namen `sende_sms` im Modul `radwerk.abschluss`."
    explanation: |
      `from radwerk.sms import sende_sms` erzeugt beim Import einen eigenen Namen in `radwerk.abschluss`. Der Patch auf `radwerk.sms.sende_sms` ersetzt nur das Original in `radwerk.sms`, `abschluss` ruft weiter die echte Funktion. Richtig ist `@patch("radwerk.abschluss.sende_sms")`. Der zweite Patch dagegen stimmt: `abschluss` importiert das Modul `zahlung` und schlägt `zahlung.belaste` bei jedem Aufruf dort nach. Auch die Reihenfolge der Parameter passt – der unterste Dekorator liefert das erste Argument (`belaste`).
    resources:
      - title: Python · Where to patch
        url: https://docs.python.org/3/library/unittest.mock.html#where-to-patch
      - title: Python · patch als Dekorator
        url: https://docs.python.org/3/library/unittest.mock.html#unittest.mock.patch

  - id: ueberspezifiziert
    type: code
    title: Repariere den überspezifizierten Test
    prompt: |
      `tagesabrechnung(kunde_id, tag, fahrten, zahlungen)` aus `abrechnung.py` rechnet am Ende eines Tages alle Fahrten einer Kundin mit dem City-Rad ab:

      - Preis je Fahrt: 150 Cent je angefangene 30 Minuten, Fahrten bis einschließlich 5 Minuten kosten 0 Cent.
      - Die Summe des Tages ist auf den Tageshöchstpreis von 1 500 Cent gedeckelt.
      - Ist der Betrag größer als 0, belastet die Funktion ihn **genau einmal** über `zahlungen.belaste(kunde_id, betrag_cent, schluessel)` mit `schluessel = f"{kunde_id}-{tag.isoformat()}"`. Sie gibt den Betrag zurück.
      - `fahrten.fuer_kunde_am(kunde_id, tag)` liefert die Fahrtdauern des Tages in Minuten als Liste von `int`.

      `abrechnung.py` enthält außerdem die Klasse `Zahlungen`, die die Schnittstelle von `belaste` beschreibt. Alles andere – Hilfsfunktionen, Konstanten, ob Argumente positionell oder per Schlüsselwort übergeben werden – darf sich ändern.

      Eine Kollegin hat `abrechnung.py` so umgebaut, ohne das Verhalten zu ändern:

      ```python
      def _fahrpreis(minuten):
          angefangene = (minuten + 29) // 30
          return 0 if minuten <= 5 else angefangene * CENT_JE_HALBE_STUNDE


      def tagesabrechnung(kunde_id, tag, fahrten, zahlungen):
          minuten = fahrten.fuer_kunde_am(kunde_id=kunde_id, tag=tag)
          betrag = min(sum(map(_fahrpreis, minuten)), TAGESHOECHSTPREIS)
          if betrag > 0:
              zahlungen.belaste(kunde_id=kunde_id, betrag_cent=betrag, schluessel=f"{kunde_id}-{tag.isoformat()}")
          return betrag
      ```

      Seitdem ist der Test im Editor rot. Gleichzeitig übersieht er echte Rechenfehler. Schreibe ihn so um, dass er gegen die alte und die umgebaute Version grün ist und fehlerhafte Varianten, die die Prüfung bereithält, rot werden lässt. Paystream bleibt hinter einem Double.
    lang: python
    setup: |
      from pathlib import Path

      RICHTIG = '''
      from typing import Protocol

      TAGESHOECHSTPREIS = 1500


      class Zahlungen(Protocol):
          def belaste(self, kunde_id: str, betrag_cent: int, schluessel: str) -> str: ...


      def mietpreis(minuten):
          if minuten <= 5:
              return 0
          return -(-minuten // 30) * 150


      def tagesabrechnung(kunde_id, tag, fahrten, zahlungen):
          summe = 0
          for minuten in fahrten.fuer_kunde_am(kunde_id, tag):
              summe += mietpreis(minuten)
          betrag = min(summe, TAGESHOECHSTPREIS)
          if betrag > 0:
              zahlungen.belaste(kunde_id, betrag, f"{kunde_id}-{tag.isoformat()}")
          return betrag
      '''
      UMGEBAUT = '''
      from typing import Protocol

      CENT_JE_HALBE_STUNDE = 150
      TAGESHOECHSTPREIS = 1500


      class Zahlungen(Protocol):
          def belaste(self, kunde_id: str, betrag_cent: int, schluessel: str) -> str: ...


      def _fahrpreis(minuten):
          angefangene = (minuten + 29) // 30
          return 0 if minuten <= 5 else angefangene * CENT_JE_HALBE_STUNDE


      def tagesabrechnung(kunde_id, tag, fahrten, zahlungen):
          minuten = fahrten.fuer_kunde_am(kunde_id=kunde_id, tag=tag)
          betrag = min(sum(map(_fahrpreis, minuten)), TAGESHOECHSTPREIS)
          if betrag > 0:
              zahlungen.belaste(kunde_id=kunde_id, betrag_cent=betrag, schluessel=f"{kunde_id}-{tag.isoformat()}")
          return betrag
      '''
      MUTANTEN = {
          "ohne_deckel": RICHTIG.replace("min(summe, TAGESHOECHSTPREIS)", "summe"),
          "abgerundet": RICHTIG.replace("-(-minuten // 30)", "(minuten // 30)"),
      }
      assert all(m != RICHTIG for m in MUTANTEN.values()), "Ein Mutant ist identisch mit der richtigen Version."
      Path("abrechnung.py").write_text(RICHTIG, encoding="utf-8")
    starter: |
      from datetime import date
      from unittest.mock import Mock, call, patch

      import abrechnung

      TAG = date(2026, 10, 3)


      def test_tagesabrechnung():
          fahrten = Mock()
          fahrten.fuer_kunde_am.return_value = [47, 20]
          zahlungen = Mock()

          with patch("abrechnung.mietpreis", side_effect=[300, 150]) as mietpreis:
              betrag = abrechnung.tagesabrechnung("K-7", TAG, fahrten, zahlungen)

          assert betrag == 450
          assert mietpreis.call_args_list == [call(47), call(20)]
          assert fahrten.mock_calls == [call.fuer_kunde_am("K-7", TAG)]
          zahlungen.belaste.assert_called_once_with("K-7", 450, "K-7-2026-10-03")
    solution: |
      from datetime import date
      from unittest.mock import create_autospec

      from abrechnung import Zahlungen, tagesabrechnung

      TAG = date(2026, 10, 3)


      class FakeFahrten:
          def __init__(self, minuten_je_tag):
              self._daten = minuten_je_tag

          def fuer_kunde_am(self, kunde_id, tag):
              return list(self._daten.get((kunde_id, tag), []))


      def rechne_ab(minuten):
          fahrten = FakeFahrten({("K-7", TAG): minuten})
          zahlungen = create_autospec(Zahlungen, instance=True)
          betrag = tagesabrechnung("K-7", TAG, fahrten, zahlungen)
          return betrag, zahlungen.belaste


      def test_summe_der_fahrten_wird_einmal_belastet():
          betrag, belaste = rechne_ab([47, 20])

          assert betrag == 450
          belaste.assert_called_once_with("K-7", 450, "K-7-2026-10-03")


      def test_tageshoechstpreis_deckelt_die_summe():
          betrag, belaste = rechne_ab([200, 200])

          assert betrag == 1500
          belaste.assert_called_once_with("K-7", 1500, "K-7-2026-10-03")
    tests:
      - name: Grün gegen die heutige Version
        code: |
          lauf = run_pytest({"abrechnung.py": RICHTIG})
          assert lauf.ok, lauf.output
      - name: Grün nach dem harmlosen Umbau
        code: |
          lauf = run_pytest({"abrechnung.py": UMGEBAUT})
          assert lauf.ok, "Dein Test ist nach einem Umbau ohne Verhaltensänderung rot. Hängt er an internen Namen oder an der Form der Aufrufe?\n\n" + lauf.output
      - name: Fängt einen Fehler beim Tageshöchstpreis
        code: |
          lauf = run_pytest({"abrechnung.py": MUTANTEN["ohne_deckel"]})
          assert not lauf.ok, "Dein Test bleibt grün, obwohl der Tageshöchstpreis nicht mehr greift."
      - name: Fängt einen Fehler im Fahrpreis
        code: |
          lauf = run_pytest({"abrechnung.py": MUTANTEN["abgerundet"]})
          assert not lauf.ok, "Dein Test bleibt grün, obwohl angefangene halbe Stunden nicht mehr voll berechnet werden."
    hints:
      - Welche Zeilen des Tests hängen an Dingen, die sich laut Aufgabe ändern dürfen? `mietpreis` gibt es nach dem Umbau nicht mehr, und Argumente kommen dort per Schlüsselwort.
      - "Lass die Preisberechnung echt laufen. Für `fahrten` genügt ein kleiner Fake oder Stub mit der Methode `fuer_kunde_am(self, kunde_id, tag)`."
      - "`create_autospec(Zahlungen, instance=True)` vergleicht `assert_called_once_with` nach Signatur – positionell und per Schlüsselwort übergebene Argumente gelten dann als gleich. Für den Deckel brauchst du einen Tag über 1 500 Cent, etwa zwei Fahrten à 200 Minuten."
    explanation: |
      Der alte Test war an drei Implementierungsdetails gekoppelt: den Namen der internen Hilfsfunktion (`patch("abrechnung.mietpreis")`), die genaue Form des Repository-Aufrufs (`mock_calls`) und die positionelle Übergabe an `belaste`. Gleichzeitig ersetzte er die Preisberechnung durch feste Werte und prüfte den Deckel nie – Rechenfehler blieben grün. Der reparierte Test lässt die eigene Logik echt laufen, stellt die Fahrten über einen Fake bereit und prüft nur, was außerhalb sichtbar ist: Rückgabewert und genau eine Belastung. `create_autospec` bindet das Double an die Signatur von `Zahlungen.belaste`. Damit gilt `belaste(kunde_id="K-7", betrag_cent=450, …)` als derselbe Aufruf wie `belaste("K-7", 450, …)`, und der Umbau bleibt grün.
    resources:
      - title: Python · Autospeccing
        url: https://docs.python.org/3/library/unittest.mock.html#autospeccing
      - title: Martin Fowler · Mocks Aren't Stubs
        url: https://martinfowler.com/articles/mocksArentStubs.html

  - id: doubles-im-test
    type: explain
    title: Drei Doubles, drei Gründe
    prompt: |
      Du reviewst diesen Test. Erkläre, welche Art Test Double jedes der drei Objekte ist und warum es so gewählt wurde. Sag auch, was der Test bewusst *nicht* prüft, und nenne eine Lücke, die andere Tests schließen müssen.
    lang: python
    code: |
      def test_abgelehnte_karte_laesst_fahrt_offen():
          fahrten = InMemoryFahrten([Fahrt("F-1042", "K-7", "+4917012345", minuten=47)])
          zahlungen = create_autospec(PaystreamZahlungen, instance=True)
          zahlungen.belaste.side_effect = ZahlungAbgelehnt("Karte gesperrt")
          sms = SmsSpy()

          schliesse_fahrt_ab("F-1042", fahrten, zahlungen, sms)

          assert fahrten.hole("F-1042").status == "offen"
          assert sms.gesendet == [("+4917012345", "Zahlung abgelehnt, bitte Karte prüfen.")]
    points:
      - "`InMemoryFahrten` ist ein Fake für das eigene Repository: Der Test prüft den Zustand (`status == \"offen\"`) statt einzelner Repository-Aufrufe."
      - "`zahlungen` ist hier ein Stub für die indirekte Eingabe „abgelehnt“ (`side_effect`); `create_autospec` stellt sicher, dass Name und Signatur von `belaste` zur echten Klasse passen."
      - "`SmsSpy` zeichnet die indirekte Ausgabe auf; die SMS an die Kundin ist das sichtbare Ergebnis und wird deshalb genau geprüft."
      - Der Preis wird echt berechnet, und es gibt keine Prüfung, wie oft oder in welcher Reihenfolge das Repository befragt wird – der Test übersteht Refactorings.
      - "Lücke: Ob `PaystreamZahlungen` eine echte Ablehnung von Paystream in `ZahlungAbgelehnt` übersetzt und ob `InMemoryFahrten` sich wie PostgreSQL verhält, zeigen nur Adapter- und Repository-Tests gegen Sandbox und echte Datenbank."
    explanation: |
      Jedes Double hat hier eine eigene Aufgabe. Das Repository gehört uns und hat Zustand, deshalb ein Fake: Der Test liest am Ende den Status der Fahrt, egal wie `schliesse_fahrt_ab` intern lädt und speichert. Für Paystream braucht der Test nur eine Antwort – die Ablehnung –, also wird der autospezifizierte Adapter als Stub benutzt. Autospec sorgt dafür, dass ein Tippfehler oder eine geänderte Signatur von `belaste` den Test rot macht statt grün. Die SMS ist eine Wirkung nach außen, deshalb ein Spy und eine genaue Prüfung des Texts. Was fehlt, ist die Treue der Doubles: Übersetzt der echte Adapter Paystreams Fehler wirklich so, und verhält sich PostgreSQL wie der Fake? Das klären Integrationstests mit der Paystream-Sandbox und der echten Datenbank, die viel seltener laufen.
    resources:
      - title: Python · create_autospec
        url: https://docs.python.org/3/library/unittest.mock.html#unittest.mock.create_autospec

  - id: paystream-adapter
    type: practice
    title: Paystream hinter einem Adapter
    prompt: |
      Radwerk ruft das Paystream-SDK heute direkt aus `schliesse_fahrt_ab` auf, und die Unit-Tests patchen `paystream.PaystreamClient.charge`. Mit SDK 3.0 wird `idempotency_key` Pflicht, und `CardDeclined` heißt künftig `PaymentDeclined`. Die Tests sind trotzdem grün geblieben.

      Das SDK 3.0: `PaystreamClient(api_key, base_url)`, `charge(customer_id, amount_cent, *, idempotency_key) -> Charge` (mit `.id`), wirft `paystream.PaymentDeclined` (mit `.reason`).

      Baue die Grenze um:

      1. Einen Port `Zahlungen` (`typing.Protocol`) mit `belaste(kunde_id, betrag_cent, schluessel) -> str` und eine eigene Exception `ZahlungAbgelehnt`.
      2. Einen Adapter `PaystreamZahlungen`, der das SDK aufruft und `PaymentDeclined` in `ZahlungAbgelehnt` übersetzt.
      3. Einen Fake `FakeZahlungen` für Unit-Tests: Er merkt sich Belastungen, lehnt für vorgegebene Kunden ab und belastet bei einem schon bekannten `schluessel` nicht ein zweites Mal – so wie Paystream.
      4. Einen kurzen Testplan als Kommentar: Was testest du mit dem Fake, was gegen die Paystream-Sandbox, was gar nicht, und warum?
    lang: python
    starter: |
      from typing import Protocol

      import paystream


      class ZahlungAbgelehnt(Exception):
          pass


      class Zahlungen(Protocol):
          ...


      class PaystreamZahlungen:
          ...


      class FakeZahlungen:
          ...


      # Testplan:
    solution: |
      from typing import Protocol

      import paystream


      class ZahlungAbgelehnt(Exception):
          pass


      class Zahlungen(Protocol):
          def belaste(self, kunde_id: str, betrag_cent: int, schluessel: str) -> str: ...


      class PaystreamZahlungen:
          """Einziger Ort, der das SDK kennt."""

          def __init__(self, client: paystream.PaystreamClient):
              self._client = client

          def belaste(self, kunde_id: str, betrag_cent: int, schluessel: str) -> str:
              try:
                  charge = self._client.charge(kunde_id, betrag_cent, idempotency_key=schluessel)
              except paystream.PaymentDeclined as fehler:
                  raise ZahlungAbgelehnt(fehler.reason) from fehler
              return charge.id


      class FakeZahlungen:
          def __init__(self, ablehnen_fuer: frozenset[str] = frozenset()):
              self._ablehnen_fuer = set(ablehnen_fuer)
              self.belastungen: dict[str, tuple[str, int]] = {}  # schluessel -> (kunde_id, betrag)

          def belaste(self, kunde_id: str, betrag_cent: int, schluessel: str) -> str:
              if kunde_id in self._ablehnen_fuer:
                  raise ZahlungAbgelehnt("Karte gesperrt")
              self.belastungen.setdefault(schluessel, (kunde_id, betrag_cent))
              return f"tx-{schluessel}"

          def summe(self, kunde_id: str) -> int:
              return sum(betrag for kunde, betrag in self.belastungen.values() if kunde == kunde_id)


      # Testplan:
      # - Unit-Tests der Fachlogik (schliesse_fahrt_ab, tagesabrechnung) mit FakeZahlungen:
      #   Betrag, Ablehnung, Wiederholung mit demselben Schlüssel. Laufen in jedem Commit.
      # - Adapter-Tests für PaystreamZahlungen gegen die Paystream-Sandbox (eigener CI-Job):
      #   erfolgreiche Belastung, abgelehnte Testkarte -> ZahlungAbgelehnt, gleicher
      #   idempotency_key -> keine zweite Belastung. Fallen bei SDK-Updates zuerst um.
      # - Ein Test, der dieselben Erwartungen an FakeZahlungen und die Sandbox stellt,
      #   damit der Fake nicht vom Original wegdriftet.
      # - Nicht getestet: Paystreams eigene Betrugsprüfung und Kartenvalidierung –
      #   das ist Paystreams Code, nicht unserer.
    checklist:
      - Die Fachlogik importiert nichts aus `paystream`; nur `PaystreamZahlungen` kennt das SDK.
      - "`ZahlungAbgelehnt` entsteht mit `raise … from fehler` aus `PaymentDeclined`, die Ursache bleibt erhalten."
      - Der Fake belastet bei einem bekannten `schluessel` nicht erneut und gibt eine Quittung zurück.
      - Unit-Tests der Fachlogik nutzen den Fake oder `create_autospec(PaystreamZahlungen, instance=True)`, kein `patch("paystream…")`.
      - Der Adapter hat eigene Tests gegen die Sandbox oder aufgezeichnete Antworten, getrennt von den Unit-Tests.
      - Der Testplan nennt, was bewusst nicht getestet wird, und begründet es.
    explanation: |
      Die Tests blieben grün, weil sie ein Bild von Paystream mockten, das es seit SDK 3.0 nicht mehr gibt. Mit dem Adapter gehört die Schnittstelle, gegen die die Fachlogik getestet wird, Radwerk selbst: `belaste` und `ZahlungAbgelehnt` ändern sich nur, wenn Radwerk es will. Ein SDK-Update betrifft genau eine Klasse, und deren Sandbox-Tests schlagen sofort an. Der Fake bildet das Verhalten nach, auf das sich die Fachlogik verlässt – vor allem die Idempotenz. Damit er nicht vom Original abweicht, stellen ein paar Tests dieselben Erwartungen an Fake und Sandbox. Paystreams interne Prüfungen testest du nicht: Für sie bist du nicht verantwortlich, und du kannst sie nicht ändern.
    resources:
      - title: Python · typing.Protocol
        url: https://docs.python.org/3/library/typing.html#typing.Protocol
      - title: Python · Exception chaining (raise … from)
        url: https://docs.python.org/3/tutorial/errors.html#exception-chaining
