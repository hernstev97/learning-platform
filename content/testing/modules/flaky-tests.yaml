lesson: |
  Seit drei Wochen ist `test_tageshoechstpreis_deckelt_zwei_lange_fahrten` im Nightly-Lauf von Radwerk ab und zu rot, in Pull Requests nie. Wer die Meldung sieht, klickt auf „Re-run“, der Lauf wird grün, im Team-Chat steht „flaky, nochmal“. Zwei Wochen später zeigt ein anderer Test gelegentlich eine Doppelbuchung, und auch er bekommt seinen Re-run.

  Ein Flaky Test liefert bei unverändertem Code und unverändertem Test mal Grün und mal Rot. Dieses Modul zeigt die häufigsten Ursachen an je einem Beispiel. Danach geht es darum, wie du Flaky Tests findest und reproduzierst und welche Regeln für Retries und Quarantäne verhindern, dass sie echte Fehler verdecken. Das allgemeine Vorgehen bei roten Tests steht in [Fehlgeschlagene Tests debuggen](/testing/tests-debuggen).

  ## Flaky Tests: Definition, Kosten und Denkmodell

  Google nennt ein Ergebnis flaky, wenn ein Test „mit demselben Code sowohl bestanden als auch fehlgeschlagen ist“ ([Google Testing Blog, 2016](https://testing.googleblog.com/2016/05/flaky-tests-at-google-and-how-we.html)). Der Beitrag nennt Zahlen: Rund 1,5 % aller Testläufe lieferten ein Flaky-Ergebnis, fast 16 % der Tests waren zumindest gelegentlich flaky, und 84 % der Übergänge von Grün nach Rot in der CI betrafen einen Flaky Test. Eine Auswertung ein Jahr später zeigte, dass die Größe zählt: Innerhalb einer Woche waren 0,5 % der kleinen, 1,6 % der mittleren und 14 % der großen Tests flaky ([Where do our flaky tests come from?](https://testing.googleblog.com/2017/04/where-do-our-flaky-tests-come-from.html)).

  Teurer als die Rechenzeit ist der Vertrauensverlust. Wer gelernt hat, dass Rot oft nichts bedeutet, startet neu, statt zu lesen – auch wenn diesmal ein echter Fehler dahintersteht ([pytest · Flaky tests](https://docs.pytest.org/en/stable/explanation/flaky.html#why-flaky-tests-are-a-problem)). Und manchmal ist gar nicht der Test kaputt: Liegt der Nichtdeterminismus im Produktcode, ignorierst du mit dem Test einen Fehler, den auch Kunden treffen.

  > [!MERKE]
  > Ein Flaky Test ist fast immer ein deterministischer Test mit einer **versteckten Eingabe**: Er liest etwas, das nicht in seinem Code steht. Mach diese Eingabe sichtbar, dann wird der Test reproduzierbar und meist auch reparierbar.

  Die häufigsten versteckten Eingaben und ihre Reparatur:

  | Versteckte Eingabe | Beispiel bei Radwerk | Reparatur |
  | --- | --- | --- |
  | Uhrzeit, Datum, Zeitzone | Tageshöchstpreis um 22 Uhr, Zeitumstellung | Zeit übergeben, feste Zeitpunkte, Grenzen ausdrücklich testen |
  | Zustand anderer Tests | Aktionspreis in einer Modulvariable | jeder Test baut seinen Zustand selbst, `monkeypatch`, Fixtures mit Aufräumen |
  | Zufall ohne Seed | zufällige Radvergabe | Zufallsgenerator übergeben, Eigenschaften statt Einzelwerte prüfen |
  | Hash- und Iterationsreihenfolge | `set` von Stationsnamen, Abfrage ohne `ORDER BY` | sortieren oder als Menge vergleichen |
  | Gleitkomma und Reihenfolge | Euro-Beträge als `float` | Cent als `int`, `math.fsum`, `pytest.approx` |
  | Scheduler von Threads und Tasks | `sleep` statt Warten, Doppelbuchung | auf das Ereignis warten, Ablauf im Test erzwingen |
  | Netz und fremde Dienste | Paystream-Sandbox | Fake am Adapter, Contract Test, Sandbox-Tests getrennt |
  | Ports, Dateien, Datenbank | fester Port, feste Datei, gleiche Testkundin | Port 0, `tmp_path`, eindeutige Testdaten |

  ## Zeit als Ursache: Mitternacht, Zeitzonen und Sommerzeit

  Der Test aus dem Nightly-Lauf legt zwei lange E-Bike-Fahrten im Abstand von drei Stunden an, beginnend „jetzt“. Der Tageshöchstpreis von 3 000 Cent gilt je Kalendertag in Berlin. Ab 21 Uhr fällt die zweite Fahrt auf den nächsten Tag, und der Deckel greift nicht. Im Block ist „jetzt“ ein Parameter, also siehst du denselben Test zu vier Uhrzeiten:

  ```python pytest fails
  from datetime import datetime, timedelta
  from zoneinfo import ZoneInfo

  import pytest

  BERLIN = ZoneInfo("Europe/Berlin")
  DECKEL_EBIKE = 3000


  def tageskosten(fahrten):
      """Cent je Kalendertag in Europe/Berlin, höchstens der Tageshöchstpreis."""
      summen = {}
      for start, cent in fahrten:
          tag = start.astimezone(BERLIN).date()
          summen[tag] = summen.get(tag, 0) + cent
      return {tag: min(summe, DECKEL_EBIKE) for tag, summe in summen.items()}


  @pytest.mark.parametrize("uhrzeit", ["09:00", "20:59", "21:00", "23:30"])
  def test_zwei_lange_fahrten_ab_jetzt(uhrzeit):
      # Im Repository stand hier: jetzt = datetime.now(BERLIN)
      jetzt = datetime.fromisoformat(f"2026-10-03T{uhrzeit}").replace(tzinfo=BERLIN)
      fahrten = [(jetzt, 1800), (jetzt + timedelta(hours=3), 1800)]
      assert tageskosten(fahrten) == {jetzt.date(): 3000}
  ```

  Tagsüber grün, ab 21 Uhr rot. Pull Requests laufen fast nie so spät. Der Nightly-Lauf startet um 20:30 Uhr und erreicht den Test je nach Warteschlange der Runner kurz vor oder kurz nach 21 Uhr – daher „ab und zu“. Zufällig war an dem Test nichts; er hatte eine Eingabe, die niemand sah.

  Die zweite Falle ist die Sommerzeit. Am 25. Oktober 2026 springt die Uhr in Berlin um 3 Uhr auf 2 Uhr zurück, der Tag hat 25 Stunden. Python rechnet die Differenz zweier `datetime`-Werte mit **derselben** `tzinfo` als Wanduhrzeit und ignoriert dabei die Offsets ([datetime-Objekte](https://docs.python.org/3/library/datetime.html#datetime-objects)):

  ```python run
  from datetime import datetime, timezone
  from zoneinfo import ZoneInfo

  BERLIN = ZoneInfo("Europe/Berlin")
  start = datetime(2026, 10, 25, 1, 30, tzinfo=BERLIN)
  ende = datetime(2026, 10, 25, 3, 10, tzinfo=BERLIN)
  print(ende - start)
  print(ende.astimezone(timezone.utc) - start.astimezone(timezone.utc))
  print(start.utcoffset(), ende.utcoffset())
  ```

  Wanduhr 1:40 Stunden, tatsächlich 2:40. Eine Fahrt über die Zeitumstellung wäre zwei Takte zu billig. Ein Test mit `datetime.now()` trifft eine Zeitumstellung höchstens an zwei Tagen im Jahr, und dann nur zur passenden Uhrzeit.

  Die Reparatur hat zwei Teile. Im Code übergibst du die Zeit oder eine Uhr, statt `datetime.now()` aufzurufen, und rechnest Dauern in UTC (siehe [Testbarkeit durch Design](/testing/testbares-design)). Im Test nimmst du feste Zeitpunkte und machst die Grenzen, die der alte Test nur zufällig traf, zu eigenen Fällen:

  ```python pytest
  from datetime import datetime, timezone
  from zoneinfo import ZoneInfo

  import pytest

  BERLIN = ZoneInfo("Europe/Berlin")


  def fahrtdauer_minuten(start: datetime, ende: datetime) -> int:
      dauer = ende.astimezone(timezone.utc) - start.astimezone(timezone.utc)
      return int(dauer.total_seconds() // 60)


  @pytest.mark.parametrize(
      "start, ende, minuten",
      [
          ("2026-10-03T23:50+02:00", "2026-10-04T00:20+02:00", 30),
          ("2026-10-25T01:50+02:00", "2026-10-25T02:20+01:00", 90),
          ("2026-03-29T01:50+01:00", "2026-03-29T03:20+02:00", 30),
      ],
      ids=["ueber-mitternacht", "ende-sommerzeit", "beginn-sommerzeit"],
  )
  def test_fahrtdauer(start, ende, minuten):
      start = datetime.fromisoformat(start).astimezone(BERLIN)
      ende = datetime.fromisoformat(ende).astimezone(BERLIN)
      assert fahrtdauer_minuten(start, ende) == minuten
  ```

  Wo du die Uhr nicht übergeben kannst, etwa in altem Code, frieren Bibliotheken wie time-machine oder freezegun die Systemzeit für einen Test ein. Das ist ein Notbehelf: Der Test hängt weiter an einer globalen Uhr, nur an einer, die er kontrolliert.

  ## Reihenfolge und geteilter Zustand

  pytest führt Tests in der Reihenfolge der Dateien und Funktionen aus. Ein Test, der Zustand hinterlässt, und einer, der sauberen Zustand voraussetzt, vertragen sich deshalb wochenlang – bis jemand eine Datei umbenennt, einen Test einzeln startet oder die CI parallel testet. Hier verändert der Aktionstag-Test einen Tarif auf Modulebene:

  ```python pytest fails
  TAKT_CENT = {"city": 150, "ebike": 300}


  def setze_aktionspreis(rad: str, cent: int) -> None:
      TAKT_CENT[rad] = cent


  def mietpreis(rad: str, minuten: int) -> int:
      if minuten <= 5:
          return 0
      return -(-minuten // 30) * TAKT_CENT[rad]


  def test_aktionstag_senkt_den_ebike_takt():
      setze_aktionspreis("ebike", 200)
      assert mietpreis("ebike", 31) == 400


  def test_ebike_kostet_300_cent_je_takt():
      assert mietpreis("ebike", 31) == 600
  ```

  Rot wird der zweite Test, obwohl der erste den Schaden anrichtet. Geteilter Zustand steckt in Modulvariablen, Klassenattributen, Caches wie `functools.cache`, Singletons, Umgebungsvariablen, dem Arbeitsverzeichnis, Dateien an festen Pfaden und Zeilen einer gemeinsamen Testdatenbank. Die Reparatur: Jeder Test baut den Zustand, den er braucht, selbst auf und hinterlässt nichts. `monkeypatch` macht Änderungen an Attributen, Dictionaries und Umgebungsvariablen nach dem Test rückgängig ([monkeypatch](https://docs.pytest.org/en/stable/how-to/monkeypatch.html#monkeypatching-environment-variables)), `tmp_path` gibt jedem Test ein eigenes Verzeichnis, Datenbanktests laufen in einer Transaktion, die am Ende zurückgerollt wird.

  Solche Abhängigkeiten findest du, indem du die Reihenfolge absichtlich änderst. Das Plugin [pytest-randomly](https://github.com/pytest-dev/pytest-randomly) mischt bei jedem Lauf erst die Module, dann Klassen und Funktionen, schreibt den Seed in den Kopf des Berichts und setzt vor jedem Test `random.seed()` auf einen daraus abgeleiteten Wert. Im Projekt liegt der Aktionstag-Test in `tests/test_wochenendaktion.py`, der Tarif-Test in `tests/test_tarife.py`:

  ```console
  $ pytest -p no:randomly -q
  ...                                                                      [100%]
  3 passed in 0.09s
  $ pytest --tb=line
  ============================= test session starts ==============================
  platform linux -- Python 3.14.7, pytest-9.0.2, pluggy-1.6.0
  Using --randomly-seed=3953809260
  …
  tests/test_wochenendaktion.py .                                          [ 33%]
  tests/test_tarife.py .F                                                  [100%]
  …
  FAILED tests/test_tarife.py::test_ebike_kostet_300_cent_je_takt - AssertionEr...
  ========================= 1 failed, 2 passed in 0.09s ==========================
  $ pytest --randomly-seed=3953809260 -q --tb=no tests/test_tarife.py
  ..                                                                       [100%]
  2 passed in 0.10s
  $ pytest -p no:randomly -q --tb=no tests/test_wochenendaktion.py tests/test_tarife.py
  ..F                                                                      [100%]
  =========================== short test summary info ============================
  FAILED tests/test_tarife.py::test_ebike_kostet_300_cent_je_takt - AssertionEr...
  1 failed, 2 passed in 0.09s
  ```

  In der festen Reihenfolge ist alles grün, weil `test_tarife.py` alphabetisch zuerst läuft. Gemischt wird es rot. Derselbe Seed nur mit `tests/test_tarife.py` ist grün, also steckt der Verursacher in einer anderen Datei. Das Paar in fester Reihenfolge, Verursacher zuerst, zeigt den Fehler jedes Mal. `--randomly-seed=last` nimmt den Seed des vorigen Laufs.

  ## Zufall, Hash-Reihenfolge und Gleitkommazahlen

  Zufall ohne festen Seed macht aus einem Test eine Stichprobe. Steckt er im Produktcode – Radwerk vergibt bei mehreren geeigneten Rädern zufällig eins, damit sich die Abnutzung verteilt –, gehört der Zufallsgenerator als Parameter in die Funktion. Der Test übergibt dann `random.Random(7)` oder prüft nur, was immer gilt: „Das Rad hat genug Akku.“ Steckt der Zufall in den Testdaten, sind feste Daten fast immer besser. Willst du absichtlich viele zufällige Eingaben, nimm Hypothesis: Es verkleinert ein fehlschlagendes Beispiel, zeigt es an und spielt es beim nächsten Lauf zuerst ab (siehe [Property-based Testing](/testing/property-based-testing)).

  Weniger offensichtlich ist die Reihenfolge von Mengen. Python versieht die Hashes von `str` und `bytes` in jedem Prozess mit einem zufälligen Salt ([PYTHONHASHSEED](https://docs.python.org/3/using/cmdline.html#envvar-PYTHONHASHSEED)). Innerhalb eines Laufs ist die Reihenfolge eines `set` von Stationsnamen stabil, zwischen zwei Läufen nicht. Kommen Beträge als `float` dazu, ändert sich mit der Reihenfolge auch die Summe:

  ```console
  $ cat summe.py
  stationen = {"Hauptbahnhof", "Altstadt", "Uni-Campus"}
  fahrten = {("Hauptbahnhof", 0.1), ("Altstadt", 0.2), ("Uni-Campus", 0.3)}

  gesamt = 0.0
  for _, euro in fahrten:
      gesamt += euro
  print(list(stationen), gesamt)
  $ python summe.py
  ['Hauptbahnhof', 'Altstadt', 'Uni-Campus'] 0.6000000000000001
  $ python summe.py
  ['Uni-Campus', 'Altstadt', 'Hauptbahnhof'] 0.6000000000000001
  $ PYTHONHASHSEED=4 python summe.py
  ['Uni-Campus', 'Altstadt', 'Hauptbahnhof'] 0.6
  $ PYTHONHASHSEED=4 python summe.py
  ['Uni-Campus', 'Altstadt', 'Hauptbahnhof'] 0.6
  ```

  Ein Test mit `assert list(stationen) == [...]` oder `assert gesamt == 0.6` ist deshalb in manchen Prozessen grün und in anderen rot. Innerhalb eines Prozesses bleibt er stabil, Wiederholungen im selben Lauf finden ihn also nicht. Aus demselben Grund taugt so ein Programm nicht als Aufgabe „Ausgabe vorhersagen“: Es hat keine eine richtige Ausgabe. Die Reparatur: als Menge vergleichen oder sortieren; gehört die Reihenfolge zum Vertrag, sortiert der Code. Dasselbe gilt für Datenbankabfragen ohne `ORDER BY`. Geld rechnet Radwerk in Cent als `int`; für gemessene Werte wie Strecken gibt es `pytest.approx` und `math.fsum`. Seit Python 3.12 summiert `sum()` Gleitkommazahlen genauer und weniger abhängig von der Reihenfolge ([sum](https://docs.python.org/3/library/functions.html#sum)), die Schleife mit `+=` nicht.

  ## Nebenläufigkeit, Netzwerk und geteilte Ressourcen

  Bei Threads und async-Code entscheidet der Scheduler, welche Aufgabe wann weiterläuft. Zwei Reservierungen für dasselbe Rad zeigen, was dabei passieren kann. Zwischen Prüfen und Speichern liegt ein `await`, und in dieser Lücke prüft die zweite Anfrage:

  ```python run
  import asyncio

  reservierungen: list[tuple[str, str]] = []


  async def hat_ueberschneidung(rad: str) -> bool:
      await asyncio.sleep(0)  # Datenbankabfrage
      return any(r == rad for r, _ in reservierungen)


  async def reserviere(rad: str, kunde: str) -> bool:
      if await hat_ueberschneidung(rad):
          return False
      await asyncio.sleep(0)  # Preis berechnen, Zahlung vormerken
      reservierungen.append((rad, kunde))
      return True


  print(await asyncio.gather(reserviere("R-117", "lena"), reserviere("R-117", "tom")))
  print(reservierungen)
  ```

  Beide haben das Rad. Hier passiert es jedes Mal, weil `asyncio` die beiden Aufgaben fest abwechselnd ausführt. Gegen eine echte Datenbank hängt es an Millisekunden, ob die zweite Anfrage in die Lücke fällt: Der Test ist flaky, der Fehler echt. Repariert wird der Code – die Datenbank prüft und speichert in einem Schritt, etwa mit einem Constraint gegen überlappende Zeiträume. Der Test erzwingt danach den gleichzeitigen Zugriff, etwa mit einem Fake, der beide Anfragen erst nach dem Prüfen weiterlaufen lässt, und erwartet genau einen Erfolg.

  Die häufigste Quelle bei Nebenläufigkeit ist Warten nach Gefühl. Dieser Test prüft die Verarbeitung eines Paystream-Webhooks, die im Hintergrund läuft:

  ```python
  import threading
  import time


  def verarbeite_im_hintergrund(zahlung: dict) -> threading.Thread:
      def arbeit():
          time.sleep(0.0099)  # Datenbank und Paystream: meist knapp unter 10 ms
          zahlung["status"] = "bezahlt"

      thread = threading.Thread(target=arbeit)
      thread.start()
      return thread


  def test_webhook_markiert_zahlung_als_bezahlt():
      zahlung = {"status": "offen"}
      verarbeite_im_hintergrund(zahlung)
      time.sleep(0.01)
      assert zahlung["status"] == "bezahlt"
  ```

  `time.sleep(0.01)` rät, wie lange die Arbeit dauert. Meist reicht es, unter Last nicht. Mit [pytest-repeat](https://github.com/pytest-dev/pytest-repeat) läuft ein verdächtiger Test so oft, bis er scheitert:

  ```console
  $ pytest tests/test_webhook.py::test_webhook_markiert_zahlung_als_bezahlt --count=500 -x
  …
  collected 500 items

  tests/test_webhook.py .................................................. [ 10%]
  …
  .............F
  …
  FAILED tests/test_webhook.py::test_webhook_markiert_zahlung_als_bezahlt[424-500]
  !!!!!!!!!!!!!!!!!!!!!!!!!! stopping after 1 failures !!!!!!!!!!!!!!!!!!!!!!!!!!!
  ======================== 1 failed, 423 passed in 4.66s =========================
  ```

  Hier war der 424. Durchgang rot. Jeder Lauf trifft einen anderen, und auf einem ausgelasteten Rechner kommt der erste rote früher. Die Reparatur wartet auf das Ereignis statt auf die Uhr: `verarbeite_im_hintergrund(zahlung).join(timeout=5)`, bei asyncio `await auftrag` oder `await asyncio.wait_for(ereignis.wait(), timeout=5)`. Der Timeout ist nur eine Obergrenze für den Fehlerfall; im Normalfall geht es sofort weiter. Playwright wartet bei Locators und Assertions nach demselben Prinzip (siehe [End-to-End-Tests mit Playwright](/testing/e2e-tests)).

  Tests gegen die Paystream-Sandbox scheitern an Timeouts, Rate Limits und Wartungsfenstern, die mit Radwerks Code nichts zu tun haben. Ersetze den Dienst am Adapter durch einen Fake (siehe [Test Doubles](/testing/test-doubles)), sichere die Schnittstelle mit [Contract Testing](/testing/contract-testing) ab und lass die wenigen Tests gegen die Sandbox in einem eigenen Job laufen, der nicht blockiert.

  Geteilte Ressourcen werden bei parallelen Läufen zum Problem, etwa mit `pytest -n auto` aus pytest-xdist. Ein fester Port ist belegt – mit Port 0 wählt das Betriebssystem einen freien. Eine feste Datei wird überschrieben – mit `tmp_path` hat jeder Test seine eigene. Die Kundin `test@radwerk.example` gibt es schon – eindeutige Testdaten, etwa mit einer UUID im Namen, vermeiden den Konflikt.

  ## Flaky Tests finden und eindämmen: Statistik, Retries und Quarantäne

  Den sichersten Hinweis liefert die CI: Ein Test, der auf demselben Commit grün und rot war, ist flaky. Wer die JUnit-Berichte jedes Laufs aufhebt, rechnet pro Test eine Flake-Rate aus und sieht, welche Tests am meisten kosten. Lokal helfen die Werkzeuge von oben: `--count` mit `-x` für einen verdächtigen Test, pytest-randomly für die Reihenfolge, `-n` für Parallelität, `TZ` und `LC_ALL` für die Umgebung.

  Automatische Wiederholungen sind verführerisch. [pytest-rerunfailures](https://pytest-rerunfailures.readthedocs.io/latest/) führt rote Tests erneut aus, global mit `--reruns 2` oder pro Test mit `@pytest.mark.flaky(reruns=2)`. Derselbe Webhook-Test, 500-mal mit Wiederholungen:

  ```console
  $ pytest tests/test_webhook.py --count=500 --reruns 2 -q
  .......R................................................................ [ 14%]
  ........................................................................ [ 28%]
  ........................................................................ [ 43%]
  ........................................................................ [ 57%]
  ............................R........................................... [ 71%]
  ........................................................................ [ 86%]
  ......................................................................   [100%]
  500 passed, 2 rerun in 5.67s
  ```

  Grün. Zwei echte Fehlschläge stehen nur noch als „2 rerun“ in der letzten Zeile, ihre Tracebacks zeigt das Plugin ohne `--rerun-show-tracebacks` nicht. Genau so verdeckt ein Retry eine Race Condition wie die Doppelbuchung: Jeder Lauf, in dem das Timing gnädig ist, macht die Pipeline grün, und der Fehler geht in Produktion. Google schreibt Ähnliches über das eigene Quarantäne-Werkzeug: Es könne „leicht eine echte Race Condition verdecken“. Playwright macht Retries wenigstens sichtbar und führt Tests, die erst im zweiten Versuch bestehen, als „flaky“ ([Playwright · Retries](https://playwright.dev/docs/test-retries#retries)). Retries sind vertretbar, wenn sie im Bericht auftauchen, nur für teure Tests auf hoher Ebene gelten und jeder wiederholte Fehler ein Ticket bekommt. Mit `--fail-on-flaky` lässt pytest-rerunfailures den Lauf trotzdem scheitern, wenn ein Test erst bei einer Wiederholung besteht.

  Für Tests, die das Team gerade nicht reparieren kann, gibt es die Quarantäne: Der Test läuft weiter, blockiert aber keine Merges. Bei Radwerk ist das ein eigener Marker:

  ```toml
  [tool.pytest]
  addopts = ["-m", "not quarantaene"]
  markers = ["quarantaene(reason): bekannter Flaky Test, läuft nur im Quarantäne-Job"]
  strict_markers = true
  ```

  ```python
  @pytest.mark.quarantaene(reason="RAD-412 · Lena · bis 2026-10-17 · Sandbox-Timeout")
  def test_checkout_mit_paystream_sandbox(): ...
  ```

  Der blockierende Job läuft mit der Voreinstellung; ein zweiter, nicht blockierender Job startet `pytest -m quarantaene` und meldet seine Ergebnisse. Das `-m` auf der Kommandozeile ersetzt das aus `addopts`.

  > [!WARNING] `xfail` ist keine Quarantäne
  > `@pytest.mark.xfail(strict=False)` lässt einen Test scheitern, ohne den Lauf rot zu machen. Die pytest-Dokumentation nennt das für den Dauerbetrieb gefährlich ([xfail strict](https://docs.pytest.org/en/stable/explanation/flaky.html#xfail-strict)): Niemand bemerkt, ob der Test noch rot ist, wieder grün wird oder einen neuen Fehler zeigt.

  > [!PRAXIS] Radwerks Regeln für Flaky Tests
  > Ein Flaky Test ist ein Bug mit Ticket. Wer ihn zuerst sieht, legt das Ticket an und hängt den Link zum Lauf an. Innerhalb eines Arbeitstags wird entschieden: sofort reparieren oder in Quarantäne, mit Verantwortlicher und Frist von zwei Wochen. Nach der Frist wird der Test repariert, auf einer niedrigeren Ebene neu geschrieben oder gelöscht – Quarantäne ist kein Endlager. Retries gibt es nur in der Playwright-Suite, mit Flaky-Bericht. Einmal pro Woche schaut das Team auf die Flake-Rate pro Test.

  > [!INTERVIEW] „Wie geht ihr mit Flaky Tests um?“
  > Ich behandle sie als Bugs, entweder im Test oder im Produkt. Erst messe ich: Ein Test, der auf demselben Commit grün und rot war, ist flaky. Dann suche ich die versteckte Eingabe – Zeit, Reihenfolge, Zufall, Scheduler, Netz, geteilte Ressourcen – und reproduziere mit Seed, Wiederholungen oder Umgebungsvariablen. Repariert wird mit festen Zeitpunkten, übergebenen Abhängigkeiten, Isolation und Warten auf Ereignisse. Was nicht sofort geht, kommt mit Ticket und Frist in Quarantäne. Automatische Retries setze ich nur sichtbar und nur für E2E-Tests ein, weil sie sonst echte Race Conditions verstecken.

  ## Häufige Fehler

  - **„Nur flaky“ und neu starten.** Der nächste rote Lauf wird genauso behandelt, auch wenn er einen echten Fehler zeigt. Jeder Flaky Test bekommt ein Ticket.
  - **`time.sleep` als Synchronisation.** Auf dem Laptop reicht die Zeit, auf dem ausgelasteten Runner nicht. Auf das Ereignis warten, mit großzügigem Timeout als Obergrenze.
  - **`datetime.now()` im Test.** Der Test prüft je nach Uhrzeit etwas anderes. Feste Zeitpunkte, Grenzen als eigene Fälle.
  - **Den Opfer-Test reparieren statt den Verursacher.** Setzt nur der rote Test den Zustand zurück, trifft es den nächsten Test. Wer Zustand ändert, räumt ihn auf.
  - **Retries als Lösung.** Sie machen die Pipeline grün und den Fehler unsichtbar. Nur sichtbar, nur für E2E, nie ohne Ticket.
  - **Quarantäne ohne Frist.** Der Test läuft weiter, aber niemand liest das Ergebnis. Immer mit Ticket, Person und Datum.
  - **Den Flaky Test löschen, ohne das Risiko neu abzudecken.** Was er prüfen sollte, ist dann ungetestet. Besser auf einer niedrigeren, deterministischen Ebene neu schreiben.

  ## Zusammenfassung

  - Ein Flaky Test liefert mit demselben Code mal Grün, mal Rot. Er kostet Vertrauen und kann einen echten Fehler im Produkt zeigen.
  - Dahinter steckt eine versteckte Eingabe: Uhr, Zustand anderer Tests, Zufall, Hash-Salt, Scheduler, Netz oder geteilte Ressourcen.
  - Zeit übergeben und in UTC rechnen; Mitternacht und Sommerzeit als eigene Testfälle.
  - Jeder Test baut seinen Zustand selbst und räumt auf; pytest-randomly deckt Abhängigkeiten auf, der Seed macht sie reproduzierbar.
  - Mengen sortieren oder als Menge vergleichen, Geld in Cent als `int`, Zufall als Parameter.
  - Auf Ereignisse warten statt zu schlafen; fremde Dienste am Adapter ersetzen; Port 0, `tmp_path`, eindeutige Testdaten.
  - Finden mit CI-Statistik (grün und rot auf demselben Commit), `--count` und zufälliger Reihenfolge.
  - Retries nur sichtbar und nur für teure Tests; Quarantäne mit Ticket, Verantwortlicher und Frist.
exercises:
  - id: was-ist-flaky
    type: choice
    title: Flaky oder nicht?
    prompt: |
      Welche Beobachtungen zeigen einen Flaky Test?
    options:
      - text: Auf demselben Commit lief der Test um 14 Uhr grün und im Nightly-Lauf um 22 Uhr rot.
        correct: true
        why: Gleicher Code, verschiedene Ergebnisse. Die versteckte Eingabe ist hier vermutlich die Uhrzeit.
      - text: Der Test ist allein grün und in der ganzen Suite rot, ohne Codeänderung dazwischen.
        correct: true
        why: Das Ergebnis hängt von der Reihenfolge und von anderen Tests ab – ein Flaky Test durch geteilten Zustand.
      - text: Im Nightly-Lauf mit `pytest -n 8` scheitert der Test etwa jeden fünften Tag, im Pull Request nie.
        correct: true
        why: Parallele Läufe teilen Ports, Dateien oder Daten; welche Tests gleichzeitig laufen, ändert sich von Lauf zu Lauf.
      - text: Seit dem Merge von Commit `a1b2c3d` ist der Test in jedem Lauf rot.
        correct: false
        why: Das ist eine deterministische Regression. Hier hilft `git bisect`, kein Wiederholen.
      - text: Der Test ist immer grün, obwohl die Funktion einen bekannten Fehler hat.
        correct: false
        why: Ein Test, der den Fehler nicht sieht, ist zu schwach, aber nicht flaky. Sein Ergebnis ändert sich nie.
    explanation: |
      Flaky heißt: dasselbe Programm, derselbe Test, verschiedene Ergebnisse. Die Ursache liegt in einer Eingabe, die nicht im Test steht – Uhrzeit, andere Tests, parallele Prozesse. Ein Test, der seit einem bestimmten Commit immer rot ist, hat einen klaren Auslöser und gehört zu `git bisect`. Ein Test, der einen bekannten Fehler nie sieht, ist ein Fall für bessere Testfälle oder Mutationstests, nicht für Flaky-Werkzeuge.
    resources:
      - title: Google Testing Blog · Flaky Tests at Google
        url: https://testing.googleblog.com/2016/05/flaky-tests-at-google-and-how-we.html

  - id: flaky-e2e-entscheiden
    type: choice
    title: Der Checkout-Test und die Sandbox
    prompt: |
      Der Playwright-Test „Buchung mit Paystream bezahlen“ läuft im Pull Request gegen Staging und die Paystream-Sandbox. Er ist in etwa 4 % der Läufe rot, immer mit einem Timeout auf der Zahlungsseite: Die Sandbox antwortet manchmal erst nach 40 Sekunden. Das Team sammelt Vorschläge. Welche sind gut?
    options:
      - text: Statusübergänge, Webhook-Verarbeitung und Fehlerfälle der Zahlung mit einem Fake des Paystream-Adapters auf Unit- und Integrationsebene testen und die Schnittstelle mit Contract Tests absichern.
        correct: true
        why: Die Risiken der Zahlungslogik lassen sich ohne Sandbox deterministisch prüfen, schneller und mit besserer Fehlerlokalisierung.
      - text: Einen einzigen End-to-End-Test gegen die Sandbox behalten, aber in einen nächtlichen Job verschieben, der nicht blockiert und Fehlschläge ans Team meldet.
        correct: true
        why: Ob die echte Integration funktioniert, prüft nur ein Test gegen die Sandbox. Er soll aber nicht jeden Merge an deren Launen binden.
      - text: "`retries: 3` für alle E2E-Tests setzen, damit die Pipeline grün bleibt."
        correct: false
        why: Das versteckt auch echte Fehler im Checkout und verlängert jeden roten Lauf um drei weitere Versuche.
      - text: Den Timeout auf der Zahlungsseite auf fünf Minuten erhöhen.
        correct: false
        why: Jeder echte Fehler kostet dann fünf Minuten, und Ausfälle der Sandbox blockieren weiter die Pull Requests.
      - text: Den Test löschen, weil er nur stört.
        correct: false
        why: Der Checkout ist Radwerks wichtigster Ablauf. Ohne Ersatz auf anderer Ebene wäre sein Risiko ungetestet.
    explanation: |
      Ein Risiko gehört auf die niedrigste Ebene, die es zuverlässig zeigt. Die Zahlungslogik braucht keine echte Sandbox; ein Fake am Adapter und Contract Tests prüfen sie deterministisch in jedem Pull Request. Was nur die echte Integration zeigen kann – Zugangsdaten, Netzwerk, das echte Verhalten der Sandbox –, prüft ein einzelner E2E-Test außerhalb des blockierenden Pfads. Retries und längere Timeouts behandeln das Symptom und verdecken dabei echte Fehler.
    resources:
      - title: pytest · Flaky tests – Split up test suites
        url: https://docs.pytest.org/en/stable/explanation/flaky.html#split-up-test-suites

  - id: sommerzeit-dauer
    type: output
    title: Eine Stunde, die fehlt
    prompt: |
      Am 29. März 2026 beginnt in Berlin die Sommerzeit: Um 2 Uhr wird die Uhr auf 3 Uhr vorgestellt. Was gibt das Programm aus?
    lang: python
    code: |
      from datetime import datetime, timezone
      from zoneinfo import ZoneInfo

      BERLIN = ZoneInfo("Europe/Berlin")
      start = datetime(2026, 3, 29, 1, 30, tzinfo=BERLIN)
      ende = datetime(2026, 3, 29, 3, 10, tzinfo=BERLIN)
      print(ende - start)
      print(ende.astimezone(timezone.utc) - start.astimezone(timezone.utc))
      print(start.utcoffset(), ende.utcoffset())
    expected: |
      1:40:00
      0:40:00
      1:00:00 2:00:00
    explanation: |
      Haben beide Werte dieselbe `tzinfo`, rechnet Python die Differenz als Wanduhrzeit: 3:10 minus 1:30 sind 1:40. Tatsächlich vergingen 40 Minuten, denn die Stunde von 2 bis 3 Uhr gab es an diesem Tag nicht. 1:30 Uhr hat noch den Offset +1 (Winterzeit), 3:10 Uhr schon +2 (Sommerzeit). In UTC sind das 0:30 und 1:10 Uhr, und die Differenz stimmt. Die Lektion zeigt den umgekehrten Fall im Oktober, wenn eine Stunde doppelt vorkommt. Eine Fahrt von 40 Minuten kostet zwei Takte, nach Wanduhr wären es vier. Fahrtdauern rechnest du deshalb in UTC. Ein Test mit `datetime.now()` trifft diesen Fall fast nie; ein Test mit diesen beiden festen Zeitpunkten jedes Mal.
    resources:
      - title: Python · datetime-Objekte (Arithmetik)
        url: https://docs.python.org/3/library/datetime.html#datetime-objects
      - title: Python · datetime.fold
        url: https://docs.python.org/3/library/datetime.html#datetime.datetime.fold

  - id: cache-zwischen-tests
    type: output
    title: Aufgeräumt und trotzdem schmutzig
    prompt: |
      Die beiden Funktionen `test_…` stehen für zwei Tests derselben Suite, die nacheinander im selben Prozess laufen. Was gibt das Programm aus?
    lang: python
    code: |
      from functools import cache

      TAKT_CENT = {"city": 150, "ebike": 300}


      @cache
      def takt_cent(rad: str) -> int:
          return TAKT_CENT[rad]


      def test_aktionstag():
          TAKT_CENT["ebike"] = 200
          ergebnis = takt_cent("ebike") == 200
          TAKT_CENT["ebike"] = 300  # aufräumen
          return ergebnis


      def test_normaler_tarif():
          return takt_cent("ebike") == 300


      print(test_normaler_tarif(), test_aktionstag())
      takt_cent.cache_clear()
      print(test_aktionstag(), test_normaler_tarif())
      print(TAKT_CENT["ebike"], takt_cent("ebike"))
    expected: |
      True False
      True False
      300 200
    explanation: |
      `functools.cache` merkt sich das Ergebnis je Argument für die Lebensdauer des Prozesses. In der ersten Zeile füllt `test_normaler_tarif` den Cache mit 300, und `test_aktionstag` bekommt danach den alten Wert, obwohl er das Dictionary geändert hat. Nach `cache_clear()` läuft die Reihenfolge andersherum: Jetzt landet die 200 im Cache, und `test_normaler_tarif` scheitert, obwohl `test_aktionstag` sein Dictionary sauber zurückgesetzt hat. Je nach Reihenfolge wird also ein anderer Test rot. Aufräumen muss alles erfassen, was sich verändert hat – hier auch den Cache, etwa mit einer Fixture, die `takt_cent.cache_clear()` aufruft.
    resources:
      - title: Python · functools.cache
        url: https://docs.python.org/3/library/functools.html#functools.cache

  - id: float-reihenfolge
    type: output
    title: Dieselben Beträge, andere Summe
    prompt: |
      Was gibt das Programm aus?
    lang: python
    code: |
      import math

      euro = [0.1, 0.2, 0.3]


      def aufsummieren(werte):
          gesamt = 0.0
          for wert in werte:
              gesamt += wert
          return gesamt


      print(aufsummieren(euro) == 0.6)
      print(aufsummieren(reversed(euro)) == 0.6)
      print(math.fsum(euro) == 0.6)
      print(sum([10, 20, 30]) == 60)
    expected: |
      False
      True
      True
      True
    explanation: |
      Gleitkommaaddition ist nicht assoziativ. `(0.1 + 0.2) + 0.3` ergibt `0.6000000000000001`, `(0.3 + 0.2) + 0.1` genau den `float`, der als `0.6` geschrieben wird. `math.fsum` führt die Zwischensummen exakt mit und rundet nur einmal am Ende, das Ergebnis hängt nicht von der Reihenfolge ab. Mit Cent als `int` stellt sich die Frage gar nicht. Kommen die Beträge aus einem `set` von Tupeln mit Strings, hängt die Reihenfolge der Schleife vom Hash-Salt des Prozesses ab – dann ist das Ergebnis von Lauf zu Lauf verschieden. Ein solches Programm eignet sich nicht für eine Aufgabe dieser Art, weil es keine eine richtige Ausgabe hat; deshalb steht hier eine Liste mit fester Reihenfolge.
    resources:
      - title: Python · math.fsum
        url: https://docs.python.org/3/library/math.html#math.fsum
      - title: Python · Floating-Point Arithmetic
        url: https://docs.python.org/3/tutorial/floatingpoint.html

