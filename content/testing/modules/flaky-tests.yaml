      pytest-randomly leitet aus dem Seed die Reihenfolge der Module, Klassen und Funktionen ab und setzt vor jedem Test `random.seed()` auf einen daraus berechneten Wert. Mit demselben Seed bekommst du dieselbe Reihenfolge und dieselben Zufallszahlen – vorausgesetzt, die Testauswahl ist gleich. Danach grenzt du ein: denselben Seed mit einzelnen Dateien, schließlich das verdächtige Paar mit `-p no:randomly` in fester Reihenfolge. `--randomly-seed=last` nimmt den Seed des letzten lokalen Laufs; das klappt nur, solange der Cache von pytest aktiv ist.
