id: flaky-tests
title: Flaky Tests
level: 3
minutes: 150
summary: Ein Flaky Test ist ein Test mit einer versteckten Eingabe – Uhr, Reihenfolge, Zufall, Hash-Salt, Scheduler, Netz. Du machst sie sichtbar, reparierst den Test oder den Code und sorgst mit Statistik, Quarantäne und ehrlichen Retries dafür, dass Rot wieder etwas bedeutet.
goals:
  - Du erklärst, was einen Flaky Test ausmacht, was er ein Team kostet und warum er manchmal einen echten Fehler im Produkt zeigt.
  - Du erkennst die häufigsten Ursachen – Zeit und Sommerzeit, geteilter Zustand, Zufall, Hash- und Iterationsreihenfolge, Gleitkomma, Nebenläufigkeit, Netz, geteilte Ressourcen – und stellst sie gezielt nach.
  - Du reparierst Flaky Tests mit festen Zeitpunkten, übergebenen Uhren und Zufallsgeneratoren, Isolation, explizitem Warten und eindeutigen Testdaten, ohne dass der Test seine Aussagekraft verliert.
  - Du findest Flaky Tests mit Wiederholungen, zufälliger Reihenfolge und CI-Statistik und reproduzierst sie mit Seed und Umgebung.
  - Du begründest eine Quarantäne-Regel und erklärst, warum automatische Retries echte Race Conditions verdecken.
