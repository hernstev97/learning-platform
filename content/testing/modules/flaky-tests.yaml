  - id: mitternacht-reparieren
    type: code
    title: Der Test, der um 22 Uhr rot wird
    prompt: |
      `tageskosten(fahrten)` aus `abrechnung.py` bekommt eine Liste von Paaren `(start, cent)` – `start` ist ein `datetime` mit Zeitzone, `cent` der Preis der Fahrt – und liefert ein Dictionary Kalendertag → Cent. Regel: Je **Kalendertag in Europe/Berlin** kosten die E-Bike-Fahrten zusammen höchstens 3 000 Cent (Tageshöchstpreis). Die Funktion liest selbst keine Uhr.

      Der Test im Editor ist tagsüber grün und rot, sobald er nach 21 Uhr läuft, etwa im Nightly-Lauf. `uhr.jetzt()` liefert die aktuelle Zeit in Berlin.

      Repariere den Test so, dass er zu jeder Uhrzeit dasselbe Ergebnis liefert und weiterhin prüft, dass der Tageshöchstpreis greift. Die Prüfung führt deinen Test zu verschiedenen Uhrzeiten aus und gegen fehlerhafte Varianten von `tageskosten` – auch gegen eine, die Kalendertage falsch abgrenzt. Die Tagesgrenze kam im alten Test nur zufällig vor; teste sie ausdrücklich.
    lang: python
    setup: |
      from pathlib import Path

      ABRECHNUNG = '''
      from datetime import datetime, timezone
      from zoneinfo import ZoneInfo

      BERLIN = ZoneInfo("Europe/Berlin")
      DECKEL_CENT = 3000


      def tageskosten(fahrten):
          summen = {}
          for start, cent in fahrten:
              tag = start.astimezone(BERLIN).date()
              summen[tag] = summen.get(tag, 0) + cent
          return {tag: min(summe, DECKEL_CENT) for tag, summe in summen.items()}
      '''
      OHNE_DECKEL = ABRECHNUNG.replace("min(summe, DECKEL_CENT)", "summe")
      UTC_TAG = ABRECHNUNG.replace("start.astimezone(BERLIN).date()", "start.astimezone(timezone.utc).date()")
      for variante in (OHNE_DECKEL, UTC_TAG):
          assert variante != ABRECHNUNG, "Eine fehlerhafte Variante ist identisch mit der richtigen."


      def uhr_modul(stunde, minute):
          return f'''
      from datetime import datetime
      from zoneinfo import ZoneInfo


      def jetzt():
          return datetime(2026, 10, 3, {stunde}, {minute}, tzinfo=ZoneInfo("Europe/Berlin"))
      '''


      Path("abrechnung.py").write_text(ABRECHNUNG)
      Path("uhr.py").write_text('''
      from datetime import datetime
      from zoneinfo import ZoneInfo


      def jetzt():
          return datetime.now(ZoneInfo("Europe/Berlin"))
      ''')
    starter: |
      from datetime import timedelta

      from abrechnung import tageskosten
      from uhr import jetzt


      def test_tageshoechstpreis_deckelt_zwei_lange_fahrten():
          start = jetzt()
          fahrten = [(start, 1800), (start + timedelta(hours=3), 1800)]
          assert sum(tageskosten(fahrten).values()) == 3000
    solution: |
      from datetime import date, datetime
      from zoneinfo import ZoneInfo

      from abrechnung import tageskosten

      BERLIN = ZoneInfo("Europe/Berlin")


      def um(text):
          return datetime.fromisoformat(text).replace(tzinfo=BERLIN)


      def test_tageshoechstpreis_deckelt_zwei_fahrten_am_selben_tag():
          fahrten = [(um("2026-10-03T09:00"), 1800), (um("2026-10-03T12:00"), 1800)]
          assert tageskosten(fahrten) == {date(2026, 10, 3): 3000}


      def test_fahrten_vor_und_nach_mitternacht_zaehlen_zu_zwei_tagen():
          fahrten = [(um("2026-10-03T23:30"), 1800), (um("2026-10-04T00:30"), 1800)]
          assert tageskosten(fahrten) == {date(2026, 10, 3): 1800, date(2026, 10, 4): 1800}
    tests:
      - name: Grün am Vormittag
        code: |
          lauf = run_pytest({"abrechnung.py": ABRECHNUNG, "uhr.py": uhr_modul(9, 0)})
          assert lauf.ok, lauf.output
      - name: Grün am späten Abend
        code: |
          lauf = run_pytest({"abrechnung.py": ABRECHNUNG, "uhr.py": uhr_modul(22, 30)})
          assert lauf.ok, "Um 22:30 Uhr ist dein Test rot:\n" + lauf.output
      - name: Fängt einen fehlenden Tageshöchstpreis
        code: |
          lauf = run_pytest({"abrechnung.py": OHNE_DECKEL, "uhr.py": uhr_modul(9, 0)})
          assert not lauf.ok, "Eine Variante ohne Tageshöchstpreis bleibt grün. Prüft dein Test noch, dass der Deckel greift?"
      - name: Fängt eine falsch gezogene Tagesgrenze
        code: |
          lauf = run_pytest({"abrechnung.py": UTC_TAG, "uhr.py": uhr_modul(9, 0)})
          assert not lauf.ok, "Eine Variante, die Kalendertage in UTC statt in Berlin abgrenzt, bleibt grün. Lege zwei Fahrten so, dass sie in Berlin auf verschiedene Tage fallen, in UTC aber auf denselben."
    hints:
      - "`tageskosten` liest keine Uhr – nur dein Test tut es. Brauchst du `jetzt()` überhaupt?"
      - "Feste Zeitpunkte wie `datetime(2026, 10, 3, 9, 0, tzinfo=ZoneInfo(\"Europe/Berlin\"))` machen den Test unabhängig von der Uhrzeit."
      - "Für die Tagesgrenze: 23:30 Uhr am 3. Oktober und 0:30 Uhr am 4. Oktober sind in Berlin zwei Tage, in UTC (21:30 und 22:30 Uhr) derselbe."
    explanation: |
      Der alte Test hatte eine versteckte Eingabe, die Uhrzeit. Ab 21 Uhr lag die zweite Fahrt am nächsten Tag, und der Test prüfte etwas anderes, als sein Name sagt. Weil `tageskosten` selbst keine Uhr liest, fliegt die Uhr aus dem Test, und feste Zeitpunkte ersetzen sie. Eine gefälschte Uhr per `monkeypatch` wäre hier ein Umweg – und mit `from uhr import jetzt` im Test würde ein Patch auf `uhr.jetzt` nicht einmal wirken. Die Tagesgrenze, die der alte Test nur nachts traf, wird ein eigener Fall. Zwei Fahrten um 23:30 und 0:30 Uhr liegen in Berlin an zwei Tagen, in UTC an einem; so fällt auch eine Variante auf, die in UTC abgrenzt.
    resources:
      - title: Python · zoneinfo
        url: https://docs.python.org/3/library/zoneinfo.html#using-zoneinfo
      - title: Martin Fowler · Eradicating Non-Determinism in Tests
        url: https://martinfowler.com/articles/nonDeterminism.html

  - id: geteilten-zustand-reparieren
    type: code
    title: Der Aktionstag, der nicht endet
    prompt: |
      `tarife.py` hält die Takte in einer Modulvariable `TAKT_CENT = {"city": 150, "ebike": 300}`. `mietpreis(rad, minuten)` berechnet den Takt je angefangene 30 Minuten, Fahrten bis einschließlich 5 Minuten kosten 0 Cent. `setze_aktionspreis(rad, cent)` ändert den Takt eines Radtyps für einen Aktionstag.

      Die beiden Tests im Editor sind einzeln grün, zusammen ist einer rot. Repariere sie so, dass

      - beide Tests in jeder Reihenfolge grün sind,
      - nach deinen Tests `TAKT_CENT` wieder den ursprünglichen Inhalt hat – auch für Tests in anderen Dateien, die später laufen,
      - der Aktionstag-Test weiterhin `setze_aktionspreis` prüft und der zweite Test den echten E-Bike-Takt aus `tarife.py`.

      Die Prüfung führt deine Tests in verschiedenen Reihenfolgen aus, zusammen mit einer weiteren Testdatei, und gegen fehlerhafte Varianten von `tarife.py`.
    lang: python
    setup: |
      from pathlib import Path

      TARIFE = '''
      TAKT_CENT = {"city": 150, "ebike": 300}


      def setze_aktionspreis(rad, cent):
          TAKT_CENT[rad] = cent


      def mietpreis(rad, minuten):
          if minuten <= 5:
              return 0
          return -(-minuten // 30) * TAKT_CENT[rad]
      '''
      AKTION_WIRKUNGSLOS = TARIFE.replace("    TAKT_CENT[rad] = cent", "    pass")
      EBIKE_250 = TARIFE.replace('"ebike": 300', '"ebike": 250')
      for variante in (AKTION_WIRKUNGSLOS, EBIKE_250):
          assert variante != TARIFE, "Eine fehlerhafte Variante ist identisch mit der richtigen."
      # Kehrt die Reihenfolge der Tests um und setzt test_danach.py ans Ende.
      UMGEKEHRT_DANACH_ZULETZT = '''
      def pytest_collection_modifyitems(items):
          items.reverse()
          items.sort(key=lambda item: item.path.name == "test_danach.py")
      '''
      DANACH = '''
      import tarife


      def test_tarif_ist_nach_den_anderen_tests_unveraendert():
          assert tarife.TAKT_CENT == {"city": 150, "ebike": 300}
      '''
      Path("tarife.py").write_text(TARIFE)
    starter: |
      from tarife import mietpreis, setze_aktionspreis


      def test_aktionstag_senkt_den_ebike_takt():
          setze_aktionspreis("ebike", 200)
          assert mietpreis("ebike", 31) == 400


      def test_ebike_kostet_300_cent_je_angefangene_halbe_stunde():
          assert mietpreis("ebike", 31) == 600
    solution: |
      import pytest

      import tarife
      from tarife import mietpreis, setze_aktionspreis


      @pytest.fixture(autouse=True)
      def tarife_sichern(monkeypatch):
          # Jeder Test arbeitet auf einer Kopie; monkeypatch setzt danach das Original zurück.
          monkeypatch.setattr(tarife, "TAKT_CENT", dict(tarife.TAKT_CENT))


      def test_aktionstag_senkt_den_ebike_takt():
          setze_aktionspreis("ebike", 200)
          assert mietpreis("ebike", 31) == 400


      def test_ebike_kostet_300_cent_je_angefangene_halbe_stunde():
          assert mietpreis("ebike", 31) == 600
    tests:
      - name: Grün in der Reihenfolge der Datei
        code: |
          lauf = run_pytest({"tarife.py": TARIFE})
          assert lauf.ok, lauf.output
      - name: Grün in umgekehrter Reihenfolge, spätere Testdateien sehen den ursprünglichen Tarif
        code: |
          lauf = run_pytest({"tarife.py": TARIFE, "test_danach.py": DANACH, "conftest.py": UMGEKEHRT_DANACH_ZULETZT}, args=["test_danach.py"])
          assert "test_tarif_ist_nach_den_anderen_tests_unveraendert" in lauf.passed, "Nach deinen Tests ist TAKT_CENT verändert. Ein Test in einer anderen Datei, der danach läuft, sieht noch den Aktionspreis – räumt der Test auf, der den Tarif ändert?\n" + lauf.output
          assert lauf.ok, "In umgekehrter Reihenfolge ist ein Test rot:\n" + lauf.output
      - name: Prüft den Aktionspreis weiterhin
        code: |
          lauf = run_pytest({"tarife.py": AKTION_WIRKUNGSLOS})
          assert not lauf.ok, "Eine Variante, in der setze_aktionspreis nichts bewirkt, bleibt grün. Ruft dein Aktionstag-Test die Funktion noch auf?"
      - name: Prüft den normalen E-Bike-Takt weiterhin
        code: |
          lauf = run_pytest({"tarife.py": EBIKE_250})
          assert not lauf.ok, "Eine Variante mit 250 statt 300 Cent je Takt bleibt grün. Setzt dein Test die Preise selbst, statt die Werte aus tarife.py zu prüfen?"
    hints:
      - Der rote Test ist das Opfer. Den Schaden richtet der Test an, der `setze_aktionspreis` aufruft und den Tarif danach nicht zurücksetzt.
      - "`monkeypatch` macht Änderungen nach dem Test rückgängig. Gib dem Test eine Kopie des Dictionarys: `monkeypatch.setattr(tarife, \"TAKT_CENT\", dict(tarife.TAKT_CENT))` – dafür brauchst du `import tarife`."
      - Mit `@pytest.fixture(autouse=True)` gilt die Fixture für jeden Test der Datei. Alternativ sicherst du den Tarif in einer `yield`-Fixture und stellst ihn nach dem `yield` wieder her.
    explanation: |
      Der Aktionstag-Test verändert eine Modulvariable und lässt sie so zurück. Alle Tests im selben Prozess teilen sich dieses Modul, also hängt jeder spätere Test davon ab, ob der Aktionstag vor ihm lief. Wer den roten Test repariert, indem er dort die Preise wieder auf 150 und 300 setzt, verschiebt das Problem: Je nach Reihenfolge trifft es den nächsten Test, und der Test prüft dann seine eigenen Zahlen statt die aus `tarife.py`. Die Reparatur gehört zum Verursacher. `monkeypatch.setattr` ersetzt `TAKT_CENT` für die Dauer des Tests durch eine Kopie; `setze_aktionspreis` ändert die Kopie, weil es den Namen zur Laufzeit im Modul nachschlägt, und nach dem Test hängt `monkeypatch` das Original wieder ein. Langfristig hilft Design: Ein Aktionspreis gehört in ein Objekt, das der Test selbst erzeugt, nicht in globalen Zustand.
    resources:
      - title: pytest · How to monkeypatch
        url: https://docs.pytest.org/en/stable/how-to/monkeypatch.html
      - title: pytest · Flaky tests – System state
        url: https://docs.pytest.org/en/stable/explanation/flaky.html#system-state

  - id: zufall-reparieren
    type: code
    title: Jedes zweite Mal das falsche Rad
    prompt: |
      `vergib_rad(akkus, rng=random)` aus `raeder.py` bekommt ein Dictionary Rad-ID → Akkustand in Prozent. Die Funktion wählt mit `rng.choice` zufällig eines der Räder mit **mindestens 30 %** Akku, damit sich die Abnutzung verteilt. Gibt es keins, wirft sie `LookupError`. Für `rng` kannst du ein eigenes `random.Random` übergeben.

      Der Test im Editor ist in etwa der Hälfte der Läufe rot. Repariere ihn und decke die Regeln ab: Er muss mit jeder Zufallsfolge grün sein und trotzdem Fehler an der Akkugrenze und beim Fall ohne geeignetes Rad bemerken. Die Prüfung führt deine Tests mit verschiedenen Seeds für das Modul `random` und gegen fehlerhafte Varianten aus.
    lang: python
    setup: |
      from pathlib import Path

      RAEDER = '''
      import random


      def vergib_rad(akkus, rng=random):
          geeignet = sorted(rad for rad, akku in akkus.items() if akku >= 30)
          if not geeignet:
              raise LookupError("Kein Rad mit mindestens 30 % Akku")
          return rng.choice(geeignet)
      '''
      GRENZE = RAEDER.replace("akku >= 30", "akku > 30")
      OHNE_FEHLER = RAEDER.replace('        raise LookupError("Kein Rad mit mindestens 30 % Akku")', "        return None")
      for variante in (GRENZE, OHNE_FEHLER):
          assert variante != RAEDER, "Eine fehlerhafte Variante ist identisch mit der richtigen."


      def conftest_mit_seed(seed):
          return f'''
      import random

      random.seed({seed})
      '''


      Path("raeder.py").write_text(RAEDER)
    starter: |
      from raeder import vergib_rad


      def test_vergibt_ein_rad_mit_genug_akku():
          assert vergib_rad({"R-101": 80, "R-102": 25, "R-103": 64}) == "R-101"
    solution: |
      import random

      import pytest

      from raeder import vergib_rad


      def test_vergibt_nur_raeder_mit_genug_akku():
          assert vergib_rad({"R-101": 80, "R-102": 25, "R-103": 64}) in {"R-101", "R-103"}


      def test_30_prozent_reichen():
          assert vergib_rad({"R-101": 30, "R-102": 29}) == "R-101"


      def test_ohne_geeignetes_rad_gibt_es_lookuperror():
          with pytest.raises(LookupError):
              vergib_rad({"R-101": 29, "R-102": 5})


      def test_gleicher_seed_gleiche_wahl():
          akkus = {"R-101": 80, "R-103": 64, "R-104": 91}
          assert vergib_rad(akkus, rng=random.Random(7)) == vergib_rad(akkus, rng=random.Random(7))
    tests:
      - name: Grün mit einer Zufallsfolge
        code: |
          lauf = run_pytest({"raeder.py": RAEDER, "conftest.py": conftest_mit_seed(1)})
          assert lauf.ok, lauf.output
      - name: Grün mit einer anderen Zufallsfolge
        code: |
          lauf = run_pytest({"raeder.py": RAEDER, "conftest.py": conftest_mit_seed(5)})
          assert lauf.ok, "Mit einer anderen Zufallsfolge ist dein Test rot:\n" + lauf.output
      - name: Fängt einen Fehler an der Akkugrenze
        code: |
          lauf = run_pytest({"raeder.py": GRENZE, "conftest.py": conftest_mit_seed(1)})
          assert not lauf.ok, "Eine Variante, die erst ab 31 % Akku vergibt, bleibt grün."
      - name: Fängt eine fehlende Fehlermeldung
        code: |
          lauf = run_pytest({"raeder.py": OHNE_FEHLER, "conftest.py": conftest_mit_seed(1)})
          assert not lauf.ok, "Eine Variante, die ohne geeignetes Rad None zurückgibt, statt LookupError zu werfen, bleibt grün."
    hints:
      - Prüfe eine Eigenschaft, die bei jeder Wahl gilt, statt eines bestimmten Rads – oder übergib einen Zufallsgenerator mit festem Seed.
      - Ist nur ein Rad geeignet, gibt es nichts zu raten. Ein Rad mit genau 30 % neben einem mit 29 % prüft die Grenze.
      - "`with pytest.raises(LookupError):` prüft den Fall ohne geeignetes Rad."
    explanation: |
      Der alte Test behauptete, dass ein bestimmtes von zwei geeigneten Rädern gewählt wird – eine Annahme, die die Regel nicht hergibt. Ob er grün war, entschied der Zustand des globalen Zufallsgenerators. Es gibt zwei saubere Reparaturen. Entweder prüfst du, was immer gilt: Das Rad ist eines der geeigneten. Oder du machst den Zufall zur sichtbaren Eingabe und übergibst `random.Random(7)`; dann ist die Wahl reproduzierbar, aber der Test hängt an der Implementierung von `choice`. Fälle mit nur einem geeigneten Rad brauchen keinen Zufall und prüfen die Regeln am genauesten: die Grenze bei 30 % und die Ausnahme ohne geeignetes Rad.
    resources:
      - title: Python · random.Random
        url: https://docs.python.org/3/library/random.html#random.Random
      - title: pytest · Assertions about expected exceptions
        url: https://docs.pytest.org/en/stable/how-to/assert.html#assertraises

  - id: schlafen-statt-warten
    type: bug
    title: Der Webhook, der manchmal zu spät kommt
    prompt: |
      Dieser Integrationstest läuft mit pytest-asyncio gegen die Testdatenbank. Lokal ist er immer grün, in der CI unter Last ungefähr jeden fünfzigsten Lauf rot:

      ```text
      >       assert await repo.status("pay_7f3a") == "bezahlt"
      E       AssertionError: assert 'offen' == 'bezahlt'
      ```

      Finde die Zeile, die den Test flaky macht, und korrigiere sie. Falls du eine Obergrenze setzt, nimm 5 Sekunden.
    lang: python
    code: |
      import asyncio

      import pytest

      from radwerk.webhooks import verarbeite_webhook


      @pytest.mark.asyncio
      async def test_webhook_setzt_zahlung_auf_bezahlt(repo):
          await repo.lege_zahlung_an("pay_7f3a", status="offen")
          ereignis = {"type": "payment.succeeded", "data": {"id": "pay_7f3a"}}
          auftrag = asyncio.create_task(verarbeite_webhook(repo, ereignis))
          await asyncio.sleep(0.05)
          assert await repo.status("pay_7f3a") == "bezahlt"
    lines: [13]
    fix:
      - line: 13
        answers: ["await auftrag", "await asyncio.wait_for(auftrag, timeout=5)", "await asyncio.wait_for(auftrag, 5)", "await asyncio.wait_for(auftrag, timeout=5.0)", "await asyncio.wait_for(auftrag, 5.0)", "await asyncio.gather(auftrag)", "await asyncio.wait_for(auftrag, timeout=10)", "await asyncio.wait_for(auftrag, timeout=1)"]
    hints:
      - Woher weiß der Test, dass `verarbeite_webhook` fertig ist?
      - "`asyncio.create_task` liefert ein Task-Objekt, auf das du warten kannst."
    explanation: |
      `asyncio.sleep(0.05)` rät, wie lange die Verarbeitung dauert. Gegen die Testdatenbank reichen 50 Millisekunden meistens, auf einem ausgelasteten CI-Runner nicht. Dann prüft der Test, bevor der Webhook den Status geschrieben hat. `await auftrag` wartet genau so lange wie nötig und gibt außerdem eine Exception aus `verarbeite_webhook` an den Test weiter, die vorher unbemerkt im Task geblieben wäre. `asyncio.wait_for(auftrag, timeout=5)` setzt zusätzlich eine Obergrenze, damit ein hängender Webhook den Test nicht endlos blockiert. Eine längere Pause wäre keine Reparatur, nur ein seltenerer Fehler.
    resources:
      - title: Python · asyncio.wait_for
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.wait_for
      - title: Python · asyncio.create_task
        url: https://docs.python.org/3/library/asyncio-task.html#asyncio.create_task

  - id: fester-port
    type: bug
    title: Nur parallel rot
    prompt: |
      Seit die CI mit `pytest -n 4` (pytest-xdist) läuft, scheitern die Webhook-Tests in etwa jedem dritten Lauf schon in der Vorbereitung:

      ```text
      ERROR at setup of test_webhook_ohne_signatur_wird_abgelehnt
      E   OSError: [Errno 98] Address already in use
      ```

      Ohne `-n` sind sie immer grün. Finde die Zeile, die das verursacht, und korrigiere sie.
    lang: python
    code: |
      import threading
      from http.server import HTTPServer

      import pytest

      from radwerk.webhooks import WebhookHandler


      @pytest.fixture
      def webhook_server():
          httpd = HTTPServer(("127.0.0.1", 8765), WebhookHandler)
          thread = threading.Thread(target=httpd.serve_forever, daemon=True)
          thread.start()
          yield f"http://127.0.0.1:{httpd.server_port}"
          httpd.shutdown()
          httpd.server_close()
    lines: [11]
    fix:
      - line: 11
        answers: ["httpd = HTTPServer((\"127.0.0.1\", 0), WebhookHandler)", "httpd = HTTPServer((\"localhost\", 0), WebhookHandler)"]
    hints:
      - Mehrere Worker-Prozesse führen diese Fixture gleichzeitig aus.
      - Welche Portnummer lässt das Betriebssystem einen freien Port wählen?
    explanation: |
      pytest-xdist startet mehrere Worker-Prozesse, und jeder führt seine Tests mit eigenen Fixtures aus. Laufen zwei Webhook-Tests gleichzeitig, will der zweite Server Port 8765 belegen, den der erste schon hält. Mit Port 0 vergibt das Betriebssystem einen freien Port; die Fixture liest ihn danach aus `httpd.server_port` und gibt die URL weiter – der Rest des Codes war darauf schon vorbereitet. Dasselbe Muster gilt für Dateien (`tmp_path` statt fester Pfad) und für Testdaten (eindeutige Namen statt `test@radwerk.example`).
    resources:
      - title: Python · socketserver (Port 0 im Beispiel)
        url: https://docs.python.org/3/library/socketserver.html#asynchronous-mixins
      - title: pytest-xdist
        url: https://pytest-xdist.readthedocs.io/en/stable/

  - id: retry-versteckt-race
    type: explain
    title: Drei Versuche für eine Doppelbuchung
    prompt: |
      Ein Kollege hat diesen Test mit `@pytest.mark.flaky(reruns=3)` aus pytest-rerunfailures versehen, weil er „ab und zu rot“ war. Seitdem ist die Pipeline grün. Erkläre im Review, warum das gefährlich ist, was der Test wirklich zeigt und wie es richtig gelöst wird.
    lang: python
    code: |
      async def reserviere(db, rad_id: str, kunde: str, start, ende) -> bool:
          if await db.hat_ueberschneidung(rad_id, start, ende):
              return False
          await db.speichere_reservierung(rad_id, kunde, start, ende)
          return True


      @pytest.mark.flaky(reruns=3)
      @pytest.mark.asyncio
      async def test_gleichzeitig_gewinnt_nur_eine_reservierung(db):
          ergebnisse = await asyncio.gather(
              reserviere(db, "R-117", "lena", START, ENDE),
              reserviere(db, "R-117", "tom", START, ENDE),
          )
          assert sorted(ergebnisse) == [False, True]
    points:
      - "Zwischen `hat_ueberschneidung` und `speichere_reservierung` liegt ein `await`. In dieser Lücke kann die zweite Anfrage prüfen, beide sehen ein freies Rad, beide speichern: eine Doppelbuchung (Check-then-Act)."
      - Ob der Test rot wird, hängt davon ab, wie die beiden Aufgaben gegen die Datenbank verzahnt laufen. Das Rot ist das echte Verhalten des Codes, kein Messfehler.
      - "`reruns=3` macht die Pipeline grün, sobald ein Versuch zufällig nicht in die Lücke fällt. Der Fehler bleibt in Produktion, und die Tracebacks der gescheiterten Versuche sieht ohne `--rerun-show-tracebacks` niemand."
      - "Repariert wird der Code: Prüfen und Speichern müssen atomar sein, etwa mit einem Constraint der Datenbank gegen überlappende Zeiträume oder einer Sperre je Rad."
      - Der Test sollte die Verzahnung danach erzwingen, zum Beispiel mit einem Fake, der beide Anfragen erst nach dem Prüfen weiterlaufen lässt, damit er bei einem Rückfall jedes Mal rot ist.
    explanation: |
      Der Test ist nicht kaputt, er ist der einzige Hinweis auf einen echten Fehler. `reserviere` folgt dem Muster „erst prüfen, dann handeln“, und zwischen beiden Schritten gibt die Funktion die Kontrolle ab. Kommt die zweite Anfrage genau in dieser Lücke an, sehen beide ein freies Rad und speichern. Wie oft das passiert, hängt an der Latenz der Datenbank – deshalb „ab und zu“. Mit drei Wiederholungen besteht der Test fast immer, die Doppelbuchungen bleiben, und die Kunden stehen zu zweit an derselben Station. Im Review würde ich den Marker entfernen und den Code atomar machen: In PostgreSQL verhindert ein Exclusion-Constraint auf `rad_id` und den Zeitraum überlappende Zeilen, die zweite Anfrage scheitert dann mit einem Fehler, den `reserviere` in `False` übersetzt. Den Test würde ich so umbauen, dass beide Anfragen sicher in die Lücke fallen; dann ist er vor dem Fix immer rot und danach immer grün.
    resources:
      - title: pytest-rerunfailures
        url: https://pytest-rerunfailures.readthedocs.io/latest/
      - title: Google Testing Blog · Flaky Tests at Google (Quarantäne und Race Conditions)
        url: https://testing.googleblog.com/2016/05/flaky-tests-at-google-and-how-we.html

  - id: flaky-richtlinie
    type: practice
    title: Eine Flaky-Richtlinie für Radwerk
    prompt: |
      Radwerk hat 1 400 pytest-Tests (Unit und Integration, eine Suite mit PostgreSQL) und 35 Playwright-Tests. In den letzten vier Wochen waren 9 Tests auf demselben Commit mal grün und mal rot, darunter zwei Playwright-Tests gegen die Paystream-Sandbox. Das Team klickt bei Rot inzwischen reflexhaft auf „Re-run“.

      Schreibe eine Richtlinie für den Umgang mit Flaky Tests, höchstens eine Seite. Sie soll festlegen:

      1. woran das Team einen Flaky Test erkennt und wie es das misst,
      2. was in den ersten 24 Stunden nach dem ersten Auftreten passiert,
      3. wie die Quarantäne technisch funktioniert und wann ein Test sie wieder verlässt,
      4. wo automatische Retries erlaubt sind und wo nicht – mit Begründung,
      5. welche Reparaturmuster für welche Ursachen gelten,
      6. welche Kennzahl das Team regelmäßig ansieht.
    lang: text
    solution: |
      Flaky-Richtlinie Radwerk (Stand Oktober 2026)

      1. Erkennen und messen
         Flaky ist ein Test, der auf demselben Commit grün und rot war. Jeder CI-Lauf
         speichert den JUnit-Bericht; ein nächtlicher Job wertet die letzten 30 Tage aus
         und listet Tests mit Flake-Rate > 0 (rote Läufe ohne Codeänderung / alle Läufe).

      2. Die ersten 24 Stunden
         Wer einen roten Lauf sieht, startet nicht neu, sondern liest den Bericht.
         Ist der Fehler auf demselben Commit schon grün gewesen: Ticket mit Link zum Lauf,
         Label "flaky", eine verantwortliche Person aus dem Team, das den Test besitzt.
         Innerhalb eines Arbeitstags fällt die Entscheidung: sofort reparieren oder Quarantäne.

      3. Quarantäne
         Marker @pytest.mark.quarantaene(reason="Ticket · Person · Frist · Ursache"),
         registriert mit strict_markers. Blockierender Job: -m "not quarantaene".
         Nicht blockierender Job: -m quarantaene, Ergebnis geht in den Team-Kanal.
         Frist: 14 Tage. Danach repariert, auf niedrigerer Ebene neu geschrieben oder gelöscht,
         wenn das Risiko anders abgedeckt ist. Höchstens 10 Tests gleichzeitig in Quarantäne.
         Raus aus der Quarantäne erst nach 200 grünen Wiederholungen (--count=200).

      4. Retries
         Erlaubt nur in der Playwright-Suite: retries: 2 in der CI, Bericht mit "flaky"-Kategorie,
         jeder flaky markierte Test bekommt automatisch ein Ticket.
         Nicht erlaubt für pytest-Tests: Unit- und Integrationstests sind deterministisch
         zu halten; ein Retry würde Race Conditions wie Doppelbuchungen verdecken.

      5. Reparaturmuster
         Zeit: Uhr übergeben, feste Zeitpunkte, Mitternacht und Zeitumstellung als Fälle.
         Reihenfolge/Zustand: monkeypatch, Fixtures mit Aufräumen, Transaktion je Test;
           pytest-randomly läuft in jeder CI, Seed steht im Log.
         Zufall: Random-Objekt übergeben oder Eigenschaften prüfen; Hypothesis statt eigener Zufallsdaten.
         Nebenläufigkeit: auf Ereignisse warten, nie sleep; Races im Code beheben, nicht im Test.
         Netz: Fake am Adapter, Contract Tests; Sandbox-Tests nur nachts, nicht blockierend.
         Ressourcen: Port 0, tmp_path, eindeutige Testdaten (UUID).

      6. Kennzahlen
         Wöchentlich: Anzahl Tests in Quarantäne, Flake-Rate der Suite und die fünf teuersten
         Flaky Tests (Flake-Rate x Laufzeit). Ziel: weniger als 1 % der CI-Läufe mit Flaky-Ergebnis.
    checklist:
      - Die Definition ist messbar (grün und rot auf demselben Commit), und die Daten kommen aus gespeicherten Testberichten.
      - Für das erste Auftreten gibt es eine Frist und eine verantwortliche Person, „neu starten und vergessen“ ist ausgeschlossen.
      - Die Quarantäne ist technisch beschrieben (Marker, zwei Jobs), hat eine Frist und eine Bedingung zum Verlassen.
      - Retries sind auf eine Testebene begrenzt, bleiben im Bericht sichtbar, und du begründest, warum sie Race Conditions verdecken können.
      - Jeder Ursache aus der Lektion ist ein Reparaturmuster zugeordnet.
      - Die Kennzahl ist konkret und wird regelmäßig angesehen.
    explanation: |
      Eine Richtlinie wirkt nur, wenn sie das Neustarten teurer macht als das Hinsehen und die Quarantäne nicht zum Abstellgleis wird. Deshalb brauchen beide Wege – reparieren oder Quarantäne – eine Person und eine Frist. Die Messung über „grün und rot auf demselben Commit“ ist objektiv und braucht nur die JUnit-Berichte, die die CI ohnehin erzeugt. Retries gehören höchstens in die teure, langsame E2E-Ebene und auch dort nur mit Bericht: In Unit- und Integrationstests verdeckt jede automatische Wiederholung genau die Nebenläufigkeitsfehler, die dort am billigsten zu finden wären. Die Zahlen in der Musterlösung (14 Tage, 10 Tests, 200 Wiederholungen) sind Vorschläge; wichtig ist, dass es überhaupt Grenzen gibt.
    resources:
      - title: pytest · Flaky tests – Quarantine
        url: https://docs.pytest.org/en/stable/explanation/flaky.html#quarantine
      - title: Playwright · Retries
        url: https://playwright.dev/docs/test-retries#retries
