id: testing
title: Testing & Softwarequalität
short: Testing
tagline: Testen als Engineering-Werkzeug – was, wo und wie viel.
description: >
  Unit-, Integrations-, API-, Contract-, Frontend- und End-to-End-Tests, Test Doubles,
  Property-based Testing und Design, das Tests leicht macht. Dazu Flaky Tests,
  Debugging roter Tests, Regressionsstrategien, statische Analyse und CI. Am Ende
  entscheidest du für ein Feature begründet, was auf welcher Ebene getestet wird.
  pytest und Hypothesis laufen direkt im Browser.
color: "#C6F432"
order: 8
outcomes:
  - Du schreibst **aussagekräftige Tests mit pytest** und findest Testfälle systematisch über Äquivalenzklassen, Grenzwerte und Zustände.
  - Du ziehst **Testgrenzen** bewusst und wählst je Risiko die günstigste Ebene, die es zuverlässig abdeckt.
  - Du setzt **Test Doubles** gezielt ein und gestaltest Code so, dass Zeit, Zufall, Netzwerk und Datenbank austauschbar sind.
  - Du testest **Datenbanken, HTTP-APIs, Verträge zwischen Diensten, Oberflächen und ganze Abläufe** jeweils auf der passenden Ebene.
  - Du findest mit **Property-based Testing** Fehler, an die du nicht gedacht hast, und machst **Flaky Tests** wieder verlässlich.
  - Du debuggst **rote Tests** methodisch, verhinderst Regressionen und baust **CI-Pipelines** mit Linting, Typechecking und schnellen Rückmeldungen.
  - Du entwirfst für ein Feature eine **begründete Teststrategie** und vertrittst sie im Review und im Interview.
tracks:
  - title: Fundament
    description: Tests schreiben, Testgrenzen ziehen, Abhängigkeiten ersetzen und Code so entwerfen, dass er sich testen lässt.
    modules: [unit-tests, testpyramide, test-doubles, testbares-design]
  - title: Testebenen
    description: Datenbank und Dateisystem, HTTP-APIs, Verträge zwischen Diensten, Oberflächen und Abläufe im echten Browser.
    modules: [integrationstests, api-tests, contract-testing, frontend-tests, e2e-tests]
  - title: Tests, die tragen
    description: Eigenschaften statt Beispiele, rote Tests methodisch untersuchen, Flaky Tests beseitigen und Regressionen dauerhaft verhindern.
    modules: [property-based-testing, tests-debuggen, flaky-tests, regression-strategien]
  - title: Qualität im Team
    description: Statische Analyse, Tests in der CI und eine Teststrategie für ein echtes Feature.
    modules: [statische-analyse, ci-pipelines, teststrategie]
