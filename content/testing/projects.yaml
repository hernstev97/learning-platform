projects:
  - id: reservierungskalender
    title: Reservierungskalender als gut getestete Bibliothek
    level: 2
    hours: 12
    summary: Eine kleine Python-Bibliothek für Reservierungen mit halboffenen Intervallen – mit Beispieltests an allen Grenzen, Properties, einer Zustandsmaschine und einem Mutationsscore, der belegt, dass die Tests Fehler finden.
    brief: |
      **Ausgangslage:** Radwerk prüft Reservierungen an drei Stellen unterschiedlich – im Backend, in der App und in einem Skript für die Stationsplanung. Zweimal wurde ein Rad doppelt vergeben, weil eine Prüfung `<=` statt `<` nutzte. Du baust die Regeln einmal als Bibliothek, die alle nutzen können, und weist mit Tests nach, dass sie stimmen.

      **Anforderungen:**

      - `Intervall(start, ende)` mit zeitzonenbewussten `datetime`-Werten, halboffen `[start, ende)`. Naive Zeitpunkte und `ende <= start` werden mit einer verständlichen Fehlermeldung abgelehnt.
      - `ueberlappen(a, b)`, `dauer_minuten(intervall)` (angefangene Minuten zählen voll), `zusammenfassen(intervalle)` (überlappende und aneinanderstoßende Intervalle verschmelzen) und `freie_zeiten(belegt, fenster)` (Lücken in einem Zeitfenster).
      - `Kalender` mit `reserviere(rad, intervall, jetzt) -> id` und `storniere(id)`. Abgelehnt werden Überlappungen mit bestehenden Reservierungen desselben Rads und Reservierungen, die mehr als 7 Tage nach `jetzt` beginnen. `jetzt` kommt als Parameter herein, nie aus der Uhr.
      - Vergleiche funktionieren über Zeitzonen hinweg; Ausgaben für Menschen erscheinen in `Europe/Berlin`.
      - Keine Abhängigkeiten außer der Standardbibliothek; getestet wird mit pytest und Hypothesis.

      **Rahmen:** Python 3.14, Projekt mit [uv](https://docs.astral.sh/uv/guides/projects/), `src/`-Layout, vollständige Typannotationen. Grundlage sind die Module [Unit-Tests mit pytest](/testing/unit-tests), [Property-based Testing](/testing/property-based-testing) und [Regressionsstrategien](/testing/regression-strategien).
    skills: [pytest, parametrize, grenzwerte, hypothesis, rulebasedstatemachine, mutmut, zeitzonen, mypy]
    steps:
      - id: beispieltabelle
        title: Regeln als Beispieltabelle festhalten
        detail: Schreibe vor dem ersten Code eine Tabelle mit Beispielen für jede Funktion – aneinanderstoßende Intervalle, enthaltene, identische, über Mitternacht, über die Zeitumstellung Ende März. Entscheide und notiere, ob eine Reservierung, die genau 7 Tage nach `jetzt` beginnt, noch erlaubt ist. Diese Tabelle wird später zu parametrisierten Tests.
      - id: intervall-validierung
        title: Den Typ `Intervall` mit Validierung bauen
        detail: Ein `dataclass(frozen=True)` mit Prüfung in `__post_init__`. Teste jede Ablehnung mit `pytest.raises(…, match=…)`, damit ein Test nicht aus dem falschen Grund grün wird. Überlege, ob zwei Intervalle in verschiedenen Zeitzonen, die denselben Zeitraum beschreiben, gleich sein sollen, und halte die Entscheidung in einem Test fest.
      - id: beispieltests
        title: Beispieltests mit sprechenden IDs
        detail: Mache aus der Tabelle `@pytest.mark.parametrize` mit `pytest.param(…, id=…)`. Jede ID nennt die Regel, etwa `beruehrend-keine-ueberlappung`. Prüfe für `dauer_minuten` die Grenzen 59 Sekunden, 60 Sekunden und 61 Sekunden.
      - id: properties
        title: Properties mit Hypothesis
        detail: "Baue eine Strategie für Intervalle mit `@st.composite` aus Start und positiver Dauer statt mit `assume`. Mögliche Properties: Symmetrie von `ueberlappen`, Verschieben beider Intervalle ändert nichts, `zusammenfassen` ist idempotent und liefert nur überlappungsfreie Intervalle, `freie_zeiten` plus belegte Zeiten ergeben genau das Fenster. Als Orakel eignet sich eine naive Implementierung über Mengen von Minuten – halte die erzeugten Zeiträume dafür klein. Halte jeden gefundenen Fehler als `@example` fest."
      - id: zustandsmaschine
        title: Zustandsmaschine für den Kalender
        detail: Ein `RuleBasedStateMachine` mit Regeln für `reserviere` und `storniere` und einem `Bundle` für vergebene IDs. Die `@invariant` prüft nach jedem Schritt, dass kein Rad zwei überlappende Reservierungen hat. Die Regel für `reserviere` prüft zusätzlich, dass eine Ablehnung nur kommt, wenn die Reservierung wirklich überlappt hätte oder zu weit in der Zukunft liegt. Die Uhr ist in der Maschine ein fester Wert.
      - id: mutation-testing
        title: Mutationsscore messen und verbessern
        detail: "Trage `[tool.mutmut]` mit `source_paths = [\"src/\"]` in die `pyproject.toml` ein und starte `mutmut run`; `mutmut results` und `mutmut browse` zeigen überlebende Mutanten. Ergänze für jeden überlebenden Mutanten den Test, der fehlt, oder begründe, warum er äquivalent ist. Notiere Score und Laufzeit vorher und nachher."
      - id: ci-und-readme
        title: CI und README
        detail: Ein Workflow in GitHub Actions führt `ruff check`, `mypy --strict` und `pytest` aus; ein nächtlicher Job startet Hypothesis mit mehr Beispielen und `mutmut`. Das README erklärt die API in fünf Zeilen, die Teststrategie in einem Absatz und zeigt einen Fehler, den ein Property-Test gefunden hat, mit dem verkleinerten Gegenbeispiel.
    acceptance:
      - id: grenzen-getestet
        text: Tests decken aneinanderstoßende Intervalle, die Zeitumstellung, Intervalle in verschiedenen Zeitzonen und die 7-Tage-Grenze ab.
      - id: vier-properties
        text: Mindestens vier Properties laufen mit Hypothesis, darunter ein Vergleich mit einer naiven Referenzimplementierung.
      - id: zustand-invariant
        text: Die Zustandsmaschine prüft nach jedem Schritt, dass kein Rad überlappend reserviert ist.
      - id: keine-ueberlebenden
        text: "`mutmut` meldet keine überlebenden Mutanten außer solchen, die im README als äquivalent begründet sind."
      - id: statisch-sauber
        text: "`ruff check` und `mypy --strict` laufen ohne Befunde, die CI ist grün."
    stretch:
      - Portiere die Bibliothek nach Rust und teste dieselben Properties mit dem Crate proptest; vergleiche, was die beiden Werkzeuge beim Verkleinern ausgeben.
      - Ergänze wiederkehrende Reservierungen („jeden Montag 7–9 Uhr“) und prüfe sie an Wochen mit Zeitumstellung.
      - Miss mit `--hypothesis-show-statistics`, wie viele Beispiele deine Strategien verwerfen, und baue sie so um, dass es weniger werden.
    portfolio: |
      Zeige im README zuerst den Fehler, um den es geht: `<=` statt `<` und eine doppelt vergebene Reservierung. Dann die Antwort: eine Tabelle der Grenzfälle, drei Properties in je einer Zeile erklärt, ein Gegenbeispiel, das Hypothesis gefunden und auf zwei Intervalle verkleinert hat, und der Mutationsscore vorher und nachher.

      Im Gespräch zählen deine Entscheidungen: Warum halboffene Intervalle? Warum `jetzt` als Parameter? Welche Mutanten hast du als äquivalent markiert, und warum ist das ehrlich? Wann würdest du Property-based Testing nicht einsetzen?
  - id: flaky-detektor
    title: Flaky-Test-Detektor für JUnit-Berichte
    level: 2
    hours: 16
    summary: Ein Kommandozeilenwerkzeug liest JUnit-XML-Berichte vieler CI-Läufe, erkennt Tests, die auf demselben Commit grün und rot waren, und berichtet Flake-Rate, typische Fehlermeldungen und Verlauf.
    brief: |
      **Ausgangslage:** Die CI des Radwerk-Backends ist seit Wochen „manchmal rot“. Niemand weiß, welche Tests betroffen sind; neu gestartet wird nach Gefühl. Jeder Lauf lädt einen JUnit-Bericht als Artefakt hoch. Du baust ein Werkzeug, das aus diesen Berichten Fakten macht, damit das Team die richtigen Tests repariert.

      **Anforderungen:**

      - Eingabe ist ein Verzeichnis mit Berichten, je Lauf und Versuch eine XML-Datei, dazu Metadaten: Commit-SHA, Branch, Lauf-ID, Versuch und Zeitpunkt – aus einer kleinen JSON-Datei neben dem Bericht oder aus dem Dateinamen.
      - Der Parser versteht JUnit-XML, wie pytest (`--junitxml`) und der `junit`-Reporter von Playwright es schreiben: Wurzel `testsuites` oder `testsuite`, darin `testcase` mit `failure`, `error` oder `skipped`. Ein Test ist eindeutig über `classname` und `name`.
      - **Flaky** heißt: Derselbe Test hat auf demselben Commit mindestens einmal bestanden und mindestens einmal versagt. Ein Test, der auf einem Commit immer rot ist, gilt als kaputt, nicht als flaky.
      - Bericht je Test: Läufe, Fehlschläge, Flake-Rate, erster und letzter Fehlschlag, häufigste Fehlermeldung – normalisiert, also ohne Zahlen, Zeitstempel, Speicheradressen und temporäre Pfade.
      - Ausgabe als Markdown-Tabelle (für die Job-Zusammenfassung in GitHub Actions) und als JSON. Exit-Code 1, wenn ein Test eine einstellbare Flake-Rate überschreitet.
      - Kaputte oder leere Dateien werden gemeldet und übersprungen, nie stillschweigend.

      **Rahmen:** Python 3.14 mit Standardbibliothek (`xml.etree.ElementTree`, `argparse`, `json`, `dataclasses`), Tests mit pytest und Hypothesis. Die Beispielberichte erzeugst du selbst mit einer kleinen Suite voller absichtlich flaky Tests. Berichte aus Pull Requests fremder Forks sind fremde Eingaben – lies dazu den Abschnitt [XML-Sicherheit](https://docs.python.org/3/library/xml.html#xml-security) der Python-Doku. Grundlage sind die Module [Flaky Tests](/testing/flaky-tests), [Tests in der CI](/testing/ci-pipelines) und [Fehlgeschlagene Tests debuggen](/testing/tests-debuggen).
    skills: [junit-xml, flaky-tests, ci, github-actions, pytest, hypothesis, cli, xml]
    steps:
      - id: beispielberichte
        title: Echte Beispielberichte erzeugen
        detail: Schreibe eine Mini-Suite mit typischen Flake-Ursachen – ein Test hängt von der Uhrzeit ab, einer von der Reihenfolge, einer von ungeseedetem Zufall – und starte sie mehrmals mit `pytest --junitxml=berichte/lauf-01.xml`, mit installiertem pytest-randomly, das die Reihenfolge bei jedem Lauf mischt. Ergänze von Hand Grenzfälle wie leere Datei, abgebrochenes XML, verschachtelte `testsuite`-Elemente. Alles landet als Testdaten unter `tests/daten/`.
      - id: parser
        title: Parser mit Datenklassen
        detail: Lies jede Datei in eine Liste von `Ergebnis(test_id, status, meldung, dauer)`. Prüfe an deinen Beispieldateien, welche Attribute pytest tatsächlich schreibt, statt dich auf ein Schema aus dem Netz zu verlassen. Untersuche auch, wie Wiederholungen innerhalb eines Laufs (pytest-rerunfailures, Retries in Playwright) im Bericht erscheinen, und entscheide, ob sie als eigene Versuche zählen.
      - id: klassifikation
        title: Flaky, kaputt oder stabil
        detail: "Die Kernlogik ist eine reine Funktion über eine Liste von Ergebnissen mit Metadaten, ohne Dateizugriff. Teste sie mit kleinen, von Hand gebauten Tabellen. Gute Properties: Die Reihenfolge der Eingabe ändert das Ergebnis nicht; ein Test, der nie versagt, ist nie flaky; ein zusätzlicher grüner Lauf auf einem anderen Commit macht aus „kaputt“ nie „flaky“."
      - id: meldungen-normalisieren
        title: Fehlermeldungen normalisieren
        detail: Ersetze variable Teile mit regulären Ausdrücken durch Platzhalter, damit `assert 149 == 150` und `assert 299 == 300` zur selben Gruppe gehören. Teste mit echten Meldungen aus deinen Berichten. Die Normalisierung sollte idempotent sein – eine Property, die du direkt prüfen kannst.
      - id: ausgabe
        title: Markdown, JSON und Exit-Code
        detail: Die Markdown-Ausgabe prüfst du mit einem Approval-Test gegen eine abgelegte Referenzdatei; überlege, welche Teile sich bei jedem Lauf ändern und deshalb nicht hineingehören. Der Exit-Code folgt der Schwelle aus `--max-flake-rate`. Ein Test ruft die `main`-Funktion mit Argumenten auf und prüft Ausgabe (`capsys`) und Rückgabewert.
      - id: ci-anbindung
        title: In GitHub Actions einbinden
        detail: "Ein nächtlicher Workflow holt die Berichte der letzten Läufe, etwa mit `gh run list --workflow ci.yml --json databaseId,headSha,attempt` und `gh run download <id> --pattern 'junit-*' --dir berichte/<id>`, ruft das Werkzeug auf und schreibt die Markdown-Tabelle nach `$GITHUB_STEP_SUMMARY`. Hänge im Test-Workflow `github.run_attempt` an den Artefaktnamen, damit jeder Versuch eindeutig ist."
      - id: auswertung
        title: Eine echte Auswertung
        detail: Lass das Werkzeug über mindestens 30 Läufe deiner Mini-Suite oder eines eigenen Projekts laufen. Repariere den auffälligsten flaky Test und zeige im README die Flake-Rate vorher und nachher.
    acceptance:
      - id: definition-flaky
        text: Ein Test gilt nur dann als flaky, wenn er auf demselben Commit bestanden und versagt hat; Tests dafür decken stabile, kaputte und flaky Fälle ab.
      - id: robuste-eingabe
        text: Leere, abgebrochene und unbekannte Dateien führen zu einer Warnung mit Dateinamen, nicht zu einem Absturz.
      - id: normalisierung
        text: Fehlermeldungen, die sich nur in Zahlen, Zeitstempeln oder Pfaden unterscheiden, landen in derselben Gruppe.
      - id: ausgabe-ci
        text: Die Markdown-Tabelle erscheint in der Job-Zusammenfassung eines Workflows; der Exit-Code ist 1 bei Überschreiten der Schwelle.
    stretch:
      - Erkenne zusätzlich Tests, deren Laufzeit stark schwankt, als Kandidaten für Timeouts.
      - Lege einen Quarantäne-Vorschlag als Datei an, die ein pytest-Plugin (`conftest.py`) liest und mit der es die betroffenen Tests als nicht blockierend markiert.
      - Werte zusätzlich Berichte von Playwright aus und vergleiche die Flake-Raten von Unit- und E2E-Tests.
    portfolio: |
      Zeige das Problem in einer Zahl: wie viele PR-Läufe ohne Neustart grün waren, bevor du angefangen hast. Dann die Tabelle aus der Job-Zusammenfassung, ein flaky Test aus deiner Mini-Suite mit Ursache und Reparatur und die Zahl danach.

      Im Gespräch zeigt das Projekt, dass du Flakiness als Datenproblem behandelst: Was heißt flaky genau, warum zählt nur derselbe Commit, wie unterscheidest du kaputt von flaky, und warum sind Retries keine Lösung?
  - id: buchungsseite-tests
    title: Frontend- und E2E-Tests für die Buchungsseite
    level: 2
    hours: 18
    summary: Für eine kleine React-Seite „Rad reservieren“ entstehen Unit- und Komponententests mit Vitest, Testing Library und MSW, wenige Playwright-Journeys und eine CI mit Sharding, Traces und zusammengeführtem Bericht.
    brief: |
      **Ausgangslage:** Die Radwerk-Website bekommt eine neue Seite: Station wählen, freie Räder sehen, Zeitraum angeben, Preis vorab sehen, reservieren. Das Frontend-Team hat bisher nur Snapshot-Tests ganzer Seiten. Sie werden bei jeder Änderung rot und dann ungeprüft aktualisiert. Du baust die Seite klein nach – oder nimmst eine eigene React-App mit vergleichbarem Ablauf – und zeigst, wie eine Testsuite aussieht, der das Team vertraut.

      **Anforderungen an die Seite:**

      - React mit TypeScript und Vite. Daten kommen per `fetch` von `GET /api/stationen`, `GET /api/stationen/{id}/raeder?start=…&ende=…` und `POST /api/reservierungen`.
      - Die Preisvorschau ist eine reine Funktion: City-Rad 150 Cent je angefangene 30 Minuten, E-Bike 300 Cent, bis einschließlich 5 Minuten kostenlos. Angezeigt wird in Euro mit `Intl.NumberFormat`.
      - Das Formular hat Labels, Fehlermeldungen am Feld, einen Ladezustand, eine Meldung bei 409 („Das Rad wurde inzwischen vergeben“) und eine bei Serverfehlern.
      - Für E2E-Tests liefert ein kleiner Fake-Server die API mit festen Testdaten und hat einen Endpunkt zum Zurücksetzen, der nur in der Testkonfiguration existiert.

      **Anforderungen an die Tests:**

      - Unit-Tests der Preisfunktion in Vitest, mit allen Grenzwerten.
      - Komponententests mit Testing Library, `user-event` und MSW: Erfolg, Validierung, 409, Serverfehler, Ladezustand. Queries nach Rolle und Label, `getByTestId` nur mit Begründung im Kommentar.
      - Eine automatische Barrierefreiheitsprüfung mit axe.
      - Zwei bis drei Playwright-Journeys gegen den Fake-Server, Anmeldung über ein Setup-Projekt mit `storageState`, Testdaten über die API.
      - GitHub Actions: Vitest, dann Playwright in vier Shards, Blob-Berichte zu einem HTML-Bericht zusammengeführt, Traces bei Wiederholungen als Artefakt.

      **Rahmen:** Node 24, Vitest, Playwright 1.63, MSW, React Testing Library. Prüfe Befehle und Optionen gegen die offizielle Dokumentation der installierten Versionen – bei MSW hat sich mit Version 3 etwa die Option für unbehandelte Anfragen geändert. Grundlage sind die Module [Frontend-Tests](/testing/frontend-tests), [End-to-End-Tests mit Playwright](/testing/e2e-tests) und [Tests in der CI](/testing/ci-pipelines).
    skills: [vitest, testing-library, user-event, msw, playwright, axe, typescript, react, github-actions, sharding]
    steps:
      - id: seite-und-fake-api
        title: Seite und Fake-Server aufsetzen
        detail: Baue die Seite mit möglichst wenig Logik in den Komponenten. Der Fake-Server liest seine Testdaten aus einer JSON-Datei und lässt sich über einen Reset-Endpunkt in den Ausgangszustand bringen. Halte die API-Typen an einer Stelle, damit MSW-Handler, Fake-Server und Seite dieselben Formen nutzen.
      - id: preisfunktion
        title: Preislogik als reine Funktion testen
        detail: Ziehe die Preisvorschau in eine Funktion ohne React. Teste sie mit `it.each` oder `test.for` an den Grenzen 5/6, 30/31 und 60/61 Minuten für beide Radtypen. Die Formatierung in Euro testest du getrennt; beachte das geschützte Leerzeichen, das `Intl.NumberFormat` vor das Euro-Zeichen setzt.
      - id: msw-handler
        title: MSW-Handler für alle Fälle
        detail: Lege Standard-Handler für den Erfolgsfall an und überschreibe sie je Test mit `server.use(…)` für 409, 500 und eine absichtlich langsame Antwort. Konfiguriere den Server so, dass unbehandelte Anfragen den Test scheitern lassen, damit kein Test still ins Netz geht.
      - id: komponententests
        title: Komponententests wie eine Nutzerin
        detail: Jeder Test beschreibt einen Ablauf aus Sicht der Nutzerin – Station wählen, Zeitraum eingeben, Preis sehen, reservieren – mit `userEvent.setup()` und Queries nach Rolle und Label. Für Ladezustände nutzt du `findBy…` und `waitForElementToBeRemoved`. Ersetze die alten Seiten-Snapshots; behalte höchstens einen kleinen Inline-Snapshot, wo die genaue Form zählt.
      - id: barrierefreiheit
        title: Barrierefreiheit prüfen
        detail: Prüfe die Seite mit axe, etwa über `@axe-core/playwright` in einer Journey. Behebe die Befunde und ergänze einen Tastatur-Test, der das Formular nur mit Tab und Enter ausfüllt und abschickt.
      - id: playwright-journeys
        title: Playwright-Journeys
        detail: Ein Setup-Projekt meldet sich einmal an und speichert `storageState`. Die Journeys legen ihre Testdaten über `request` an, nutzen nur Locators nach Rolle und Label und warten mit web-first Assertions. Lass jede Journey vor dem Commit mit `--repeat-each=20` laufen. Begründe im README, warum es genau diese Journeys sind und welche Fälle bewusst in den Komponententests liegen.
      - id: ci-sharding
        title: CI mit Sharding und zusammengeführtem Bericht
        detail: "Ein Workflow startet Vitest und danach Playwright mit einer Matrix aus vier Shards, `fullyParallel` und dem Reporter `blob` in der CI. Ein abschließender Job lädt alle Blob-Berichte herunter, führt sie mit `npx playwright merge-reports` zusammen und lädt den HTML-Bericht hoch. Traces entstehen mit `trace: 'on-first-retry'`."
      - id: auswertung-readme
        title: Teststrategie im README
        detail: Eine Tabelle zeigt, welche Risiken der Seite auf welcher Ebene getestet sind – Preisfunktion, Komponente, Journey – und welche nicht. Dazu die Laufzeiten vorher und nachher sowie ein Screenshot des Trace Viewers bei einem absichtlich eingebauten Fehler.
    acceptance:
      - id: queries-nach-rolle
        text: Komponententests nutzen Queries nach Rolle, Label oder Text; jede Ausnahme ist im Code begründet.
      - id: fehlerfaelle-abgedeckt
        text: 409, Serverfehler, Validierung und Ladezustand sind in Komponententests mit MSW abgedeckt, nicht in E2E-Tests.
      - id: e2e-stabil
        text: Jede Playwright-Journey läuft mit `--repeat-each=20` lokal ohne Fehlschlag; kein Test enthält `waitForTimeout`.
      - id: ci-shards-bericht
        text: Die CI läuft in vier Shards und stellt einen zusammengeführten HTML-Bericht sowie Traces als Artefakte bereit.
      - id: a11y-ohne-befund
        text: Die axe-Prüfung meldet keine Verstöße; das Formular lässt sich nur mit der Tastatur ausfüllen und abschicken.
    stretch:
      - Ergänze visuelle Regressionstests mit `toHaveScreenshot` für zwei stabile Zustände und dokumentiere, wie du mit Unterschieden zwischen Betriebssystemen umgehst.
      - Führe dieselben Komponententests zusätzlich im Vitest Browser Mode aus und vergleiche Laufzeit und gefundene Unterschiede zu jsdom.
      - Erzeuge die API-Typen aus einem OpenAPI-Schema, damit MSW-Handler und echte API nicht auseinanderlaufen.
    portfolio: |
      Beginne mit dem Vorher: eine Seite, deren Snapshot-Tests bei jeder Änderung rot wurden und niemandem etwas sagten. Dann das Nachher: die Tabelle aus dem README mit Risiken und Ebenen, ein Komponententest, der sich wie eine Nutzergeschichte liest, und der zusammengeführte Playwright-Bericht mit Trace.

      Im Gespräch fragen Interviewer nach Grenzen: Warum MSW statt `fetch` zu mocken? Warum nur drei Journeys? Was zeigt jsdom nicht, was ein echter Browser zeigt? Wie gehst du mit einem Test um, der nur in der CI flaky ist?
  - id: qualitaetsoffensive
    title: "Abschlussprojekt: Qualitätsoffensive für einen Buchungsdienst"
    capstone: true
    level: 3
    hours: 45
    summary: Radwerk will den Buchungsdienst nicht mehr vor jedem Release zwei Tage lang von Hand durchklicken. Du lieferst eine begründete Teststrategie und setzt sie um – Unit-, Property-, Integrations-, API- und Contract-Tests, eine E2E-Journey, statische Analyse, eine schnelle CI und eine Flake-Policy.
    brief: |
      ## Auftrag

      Miriam Schulte leitet die Entwicklung bei Radwerk, einem Fahrradverleih mit 40 Stationen in drei Städten. Sie beauftragt dich, die Qualitätssicherung des Buchungsdienstes neu aufzustellen. Ihre Lage:

      - Vor jedem Release klicken zwei Personen zwei Tage lang Abläufe durch. Trotzdem sind in den letzten drei Monaten zwei Preisfehler und eine Doppelbuchung in Produktion gelandet.
      - Die vorhandenen Tests mocken die Datenbank vollständig. Sie sind grün, während die Produktion falsch rechnet.
      - Die CI braucht 40 Minuten und ist „manchmal rot“. Rote Läufe werden neu gestartet, bis sie grün sind.
      - Zweimal ist die Android-App nach einem Backend-Release abgestürzt, weil sich ein Feld in einer Antwort geändert hatte.

      Gesucht ist ein Vorgehen, das das Team versteht und weiterführt: eine Teststrategie auf einer Seite, Tests auf der jeweils passenden Ebene und eine Pipeline, deren Rot man ernst nimmt. Du baust dafür den Dienst nach der Spezifikation unten in klein nach, oder du erweiterst einen eigenen Dienst mit vergleichbaren Regeln.

      ## Der Dienst

      | Endpunkt | Zweck | Erfolg | Fachliche Fehler |
      | --- | --- | --- | --- |
      | `GET /stationen/{id}/raeder?start=…&ende=…` | freie Räder einer Station im Zeitraum | 200 | 404 unbekannte Station, 422 ungültiger Zeitraum |
      | `POST /reservierungen` | Rad für `[start, ende)` reservieren | 201 mit `Location` | 409 Rad belegt, 422 Regel verletzt |
      | `DELETE /reservierungen/{id}` | eigene Reservierung stornieren | 204 | 404 unbekannt oder fremd |
      | `POST /fahrten/{id}/rueckgabe` | Fahrt beenden, optional mit Gutscheincode; Preis berechnen und belasten | 200 mit `preis_cent` | 404, 409 schon beendet oder Gutschein schon eingelöst, 422 Gutschein ungültig oder abgelaufen |

      Alle Endpunkte verlangen `Authorization: Bearer <token>`; ein statisches Token je Testkundin reicht (401 ohne oder mit falschem Token). Fehler antworten als Problem Details nach [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457.html) mit `application/problem+json`.

      **Fachliche Regeln** (Beträge immer in Cent als `int`):

      - **Tarif:** City-Rad 150 Cent je angefangene 30 Minuten, E-Bike 300 Cent. Fahrten bis einschließlich 5 Minuten kosten 0 Cent.
      - **Tageshöchstpreis** je Kalendertag in `Europe/Berlin`: City-Rad 1 500 Cent, E-Bike 3 000 Cent.
      - **Abo „Radwerk Plus“:** Die ersten 30 Minuten jeder Fahrt sind kostenlos.
      - **Reservierungen:** halboffene Intervalle `[start, ende)`, höchstens 7 Tage im Voraus, keine überlappenden Reservierungen eines Rads.
      - **Gutscheine:** Code `RW-` plus 6 Großbuchstaben oder Ziffern, einmal pro Kunde, gültig bis einschließlich Ablaufdatum, Rabatt in Prozent oder als fester Betrag, der Preis fällt nie unter 0.

      Wo die Regeln offenlassen, wie sie zusammenwirken – etwa in welcher Reihenfolge Abo, Tageshöchstpreis und Gutschein angewendet werden –, triffst du eine Entscheidung, schreibst sie als Beispiel auf und lässt sie von der Auftraggeberin „abnehmen“, indem du sie im README begründest.

      Die Zahlung läuft über den Dienstleister Paystream. Für dieses Projekt gibt es nur einen Adapter mit der Methode `belaste(kunde, cent, idempotency_key)` und einen Fake; einen echten Zahlungsdienst bindest du nicht an.

      ## Was du lieferst

      1. **`TESTSTRATEGIE.md`** auf einer Seite: Risiken mit Wahrscheinlichkeit und Schaden, Ebene je Risiko mit Begründung, was bewusst nicht getestet wird, Kennzahlen.
      2. **Tests auf allen Ebenen:** Unit-Tests der Regeln, Properties mit Hypothesis, Integrationstests gegen die echte Datenbank, API-Tests mit dem `TestClient` von FastAPI, Contract Tests mit Pact, eine E2E-Journey.
      3. **Statische Analyse:** Ruff mit Sicherheits- und pytest-Regeln, mypy im Strict-Modus, eine Prüfung der Abhängigkeiten.
      4. **CI-Pipeline** in GitHub Actions mit schneller Rückmeldung für jeden PR und einem nächtlichen Lauf für die teuren Prüfungen.
      5. **`FLAKE-POLICY.md`:** wie flaky Tests erkannt, in Quarantäne genommen und repariert werden.
      6. **README** und eine Präsentation von zehn Minuten für die Auftraggeberin.

      ## Technischer Rahmen

      Python 3.14, [FastAPI](https://fastapi.tiangolo.com/), SQLite über `sqlite3` oder SQLAlchemy, Projekt mit uv. SQLite hält die Aufgabe klein: Sie läuft ohne Docker und ohne Datenbankserver. Es gilt trotzdem die Regel aus [Integrationstests](/testing/integrationstests): Getestet wird gegen die Datenbank, die der Dienst wirklich nutzt. Hier ist das SQLite; wer auf PostgreSQL umsteigt (siehe Zusatzaufgaben), testet gegen PostgreSQL. Uhr und Paystream-Adapter kommen als Abhängigkeiten herein, damit Tests sie ersetzen können. Die Android-App baust du nicht; stellvertretend schreibst du einen kleinen Python-Client mit genau den Feldern, die die App laut Auftraggeberin liest, und dessen Consumer-Tests mit [pact-python](https://docs.pact.io/implementation_guides/python). Die E2E-Journey schreibst du mit Playwright, entweder über eine schlichte HTML-Seite, die der Dienst ausliefert, oder als API-Journey gegen den laufenden Server.

      Grundlage sind alle Module dieses Bereichs, besonders [Testpyramide und Testgrenzen](/testing/testpyramide), [Testbarkeit durch Design](/testing/testbares-design), [Integrationstests](/testing/integrationstests), [Backend- und API-Tests](/testing/api-tests), [Contract Testing](/testing/contract-testing), [Tests in der CI](/testing/ci-pipelines) und [Teststrategie für ein Feature](/testing/teststrategie).
    skills: [teststrategie, pytest, hypothesis, fastapi, sqlite, pact, playwright, ruff, mypy, github-actions, mutmut, flaky-tests, risikoanalyse]
    steps:
      - id: auftrag-risiken
        title: Auftrag verstehen und Risiken bewerten
        detail: Liste die Risiken des Dienstes auf und bewerte jedes grob nach Wahrscheinlichkeit und Schaden – falscher Preis, Doppelbuchung, Gutschein mehrfach eingelöst, fremde Reservierung storniert, App bricht nach Release. Halte offene Fragen und Nichtziele fest (kein echter Zahlungsdienst, keine Last über 50 Anfragen pro Sekunde). Aus der Liste entsteht der erste Entwurf von `TESTSTRATEGIE.md`.
      - id: beispiele-spezifikation
        title: Regeln mit konkreten Beispielen festlegen
        detail: "Schreibe zu jeder Regel eine Tabelle mit Beispielen und erwarteten Ergebnissen, besonders an den Grenzen und im Zusammenspiel: Abo plus Tageshöchstpreis, Gutschein plus Fehlstart, eine Fahrt von 23:40 bis 00:50 Uhr deutscher Zeit, ein Festbetrag größer als der Preis. Diese Tabellen werden später parametrisierte Tests; Unklarheiten werden hier entschieden, nicht im Code."
      - id: dienst-geruest
        title: Dienst mit testbaren Grenzen bauen
        detail: Trenne Handler, Dienst und Repository. Die Regeln liegen als reine Funktionen in einem Domänenpaket ohne FastAPI- und Datenbank-Import. Uhr und Paystream-Adapter injizierst du über Abhängigkeiten von FastAPI, damit Tests sie mit `app.dependency_overrides` ersetzen. Validierungsfehler wandelst du mit einem eigenen Exception-Handler in Problem Details um.
      - id: domaene-unit-tests
        title: Unit-Tests der Domäne
        detail: Mache aus den Beispieltabellen parametrisierte Tests mit sprechenden IDs. Prüfe danach mit `mutmut` auf den Domänenmodulen, ob jede Regel wirklich abgesichert ist, und ergänze die Tests, die überlebende Mutanten zeigen. Kein Mock in diesen Tests – wenn du einen brauchst, liegt Logik an der falschen Stelle.
      - id: properties
        title: Properties und Zustandsmaschine
        detail: "Mögliche Properties: Der Preis ist nie negativ und pro Kalendertag nie höher als der Höchstpreis; eine längere Fahrt kostet nie weniger; mit Gutschein ist der Preis nie höher als ohne. Für Buchen und Stornieren baust du einen `RuleBasedStateMachine` gegen ein In-Memory-Repository, der nach jedem Schritt prüft, dass kein Rad überlappend reserviert ist."
      - id: persistenz-integration
        title: Integrationstests gegen die Datenbank
        detail: Jeder Test läuft in einer Transaktion, die die Fixture zurückrollt; das geht nur, wenn nicht das Repository committet, sondern die Schicht darüber. Testdaten kommen aus kleinen Buildern. Dieselben Vertragstests laufen gegen Fake- und echtes Repository. Für die Doppelbuchung schreibst du einen Test mit zwei Verbindungen, die gleichzeitig dasselbe Rad reservieren wollen. Er braucht eine eigene Datenbankdatei in `tmp_path`, denn die zweite Verbindung sieht nur Festgeschriebenes. Prüfung und Einfügen müssen in einer Schreibtransaktion stattfinden; lies nach, wann Pythons `sqlite3` eine Transaktion öffnet und was `BEGIN IMMEDIATE` daran ändert. Überlege außerdem, welche Regeln die Datenbank selbst durchsetzen kann, etwa „einmal pro Kunde“ beim Gutschein.
      - id: api-tests
        title: API-Tests je Endpunkt
        detail: Pro Endpunkt Erfolg mit Statuscode, Headern und Body-Form, dann die Matrix aus ohne Token, fremde Ressource und fachlichen Fehlern. Prüfe, dass Fehler als `application/problem+json` kommen und dass die Zahlung über den Spy des Paystream-Fakes genau einmal mit dem richtigen Betrag und einem Idempotency-Key ausgelöst wird. Regeln, die schon Unit-Tests zeigen, prüfst du hier nur einmal stellvertretend.
      - id: contract-tests
        title: Contract Tests zwischen Client und Dienst
        detail: Der Python-Client beschreibt in Consumer-Tests seine Interaktionen mit Provider States wie „Rad r-17 ist frei“ und „Fahrt f-3 läuft seit 40 Minuten“. Die Verifikation startet den Dienst, legt die Zustände über State Handler an und spielt die Pact-Dateien ab. Spiele einmal durch, was passiert, wenn der Dienst ein Feld umbenennt, und halte das Ergebnis im README fest.
      - id: e2e-journey
        title: Eine E2E-Journey
        detail: Genau ein Ablauf von Anfang bis Ende – reservieren, Fahrt beenden, mit Gutschein bezahlen – gegen den laufenden Dienst. Testdaten entstehen über die API oder einen Reset-Endpunkt, der nur in der Testkonfiguration existiert. Lass die Journey 20-mal laufen, bevor du sie in die CI aufnimmst – mit Playwright Test über `--repeat-each=20`, mit pytest-playwright über `--count=20` aus pytest-repeat.
      - id: statische-analyse
        title: Statische Analyse einführen
        detail: Konfiguriere Ruff mit den Sicherheitsregeln `S` und den pytest-Regeln `PT`, mypy mit `strict = true` und eine Abhängigkeitsprüfung mit pip-audit. Erweiterst du einen eigenen Dienst mit Altlasten, führst du eine Baseline ein und dokumentierst, wie sie schrumpfen soll. Jede Ausnahme bekommt Regelcode und Grund.
      - id: ci-pipeline
        title: Pipeline mit schneller Rückmeldung
        detail: Statische Analyse, Unit- und Property-Tests, Integrations- und API-Tests, Contract-Verifikation und E2E laufen als getrennte, möglichst parallele Jobs mit JUnit-Berichten und Artefakten. Miss die Zeit bis zum ersten Ergebnis und bis zum Ende. Ein nächtlicher Workflow startet `mutmut` und Hypothesis mit einem Profil mit mehr Beispielen. Trage die PR-Jobs als Required Status Checks ein.
      - id: flake-policy-uebergabe
        title: Flake-Policy, README und Präsentation
        detail: "`FLAKE-POLICY.md` regelt Erkennung (zufällige Reihenfolge, neue Tests mehrfach laufen lassen, Auswertung der JUnit-Berichte, gern mit dem [Flaky-Test-Detektor](/testing/projekte/flaky-detektor)), Quarantäne mit Marker, Ticket, Frist und Obergrenze sowie Retries nur für E2E und nur sichtbar. Das README führt in zwei Minuten durch Zweck, Start, Strategie und Grenzen. Bereite zehn Minuten Präsentation vor: Problem, Strategie, ein gefundener Fehler, Zahlen."
    acceptance:
      - id: strategie-eine-seite
        text: "`TESTSTRATEGIE.md` passt auf eine Seite und ordnet jedem wichtigen Risiko eine Ebene mit Begründung zu, einschließlich bewusst nicht getesteter Punkte."
      - id: regeln-an-grenzen
        text: Alle Tarif-, Abo-, Reservierungs- und Gutscheinregeln sind an ihren Grenzen getestet, darunter 5 und 6 Minuten, 30 und 31 Minuten, der Tageshöchstpreis über Mitternacht in `Europe/Berlin` und der Ablauftag eines Gutscheins.
      - id: mutanten-getoetet
        text: "`mutmut` auf den Domänenmodulen lässt keine Mutanten überleben, außer solchen, die im README als äquivalent begründet sind."
      - id: drei-properties
        text: Mindestens drei Properties laufen mit Hypothesis, darunter die Zustandsmaschine, die überlappungsfreie Reservierungen nach beliebigen Buchungsfolgen prüft.
      - id: keine-doppelbuchung
        text: Ein Integrationstest belegt, dass zwei gleichzeitige Reservierungen desselben Rads für überlappende Zeiträume höchstens eine Buchung erzeugen.
      - id: api-fehlerformat
        text: API-Tests decken je Endpunkt Erfolg, fehlendes Token, fremde Ressource und die fachlichen Fehler ab; alle Fehler kommen als Problem Details.
      - id: vertrag-verifiziert
        text: Die Pact-Verträge des Clients werden in der CI gegen den Dienst verifiziert, mit Provider States statt vorbereiteter Datenbankabzüge.
      - id: e2e-zwanzigmal-gruen
        text: Die E2E-Journey läuft lokal 20-mal hintereinander grün und enthält keine festen Wartezeiten.
      - id: statische-analyse-sauber
        text: "`ruff check`, `ruff format --check`, `mypy` im Strict-Modus und pip-audit laufen ohne Befunde; jede Ausnahme hat Regelcode und Begründung."
      - id: ci-schnell
        text: Der PR-Lauf liefert das erste Ergebnis in unter zwei Minuten und ist in unter zehn Minuten fertig; alle PR-Jobs sind Required Status Checks.
      - id: flake-policy
        text: "`FLAKE-POLICY.md` regelt Erkennung, Quarantäne (Marker, Ticket, Frist, Obergrenze) und Retries; Tests in Quarantäne erscheinen in der CI getrennt und blockieren nicht."
      - id: readme-uebergabe
        text: Das README erklärt Zweck, Start, Teststrategie und bekannte Grenzen; eine zweite Person hat die Tests allein damit gestartet.
    stretch:
      - Stelle die Datenbank auf PostgreSQL um und lass die Integrationstests mit Testcontainers lokal und als Service-Container in der CI laufen; dokumentiere, welche Tests dabei anders ausgehen.
      - Betreibe einen Pact Broker (Docker-Image `pactfoundation/pact-broker`), veröffentliche die Verträge mit Version und Branch und sichere Deployments mit `can-i-deploy` ab.
      - Ergänze einen Webhook-Endpunkt für Paystream mit Signaturprüfung und teste ihn mit aufgezeichneten Beispielpayloads, auch mit falscher Signatur und doppelter Zustellung.
      - Miss die Antwortzeit von `POST /reservierungen` unter Last und begründe, ab welcher Zahl ein eigener Lasttest in die Strategie gehört.
    portfolio: |
      Beginne mit den Zahlen der Auftraggeberin: zwei Tage manuelles Durchklicken, 40 Minuten CI, drei Fehler in Produktion. Zeige dann die Teststrategie auf einer Seite – Risiken, Ebenen, bewusste Lücken – und die Pipeline mit ihren Laufzeiten. Ein konkreter Fehler, den ein Property-Test oder ein überlebender Mutant aufgedeckt hat, überzeugt mehr als jede Coverage-Zahl.

      Im Gespräch wirst du nach Entscheidungen gefragt, und genau dafür ist dieses Projekt da. Warum ist die Doppelbuchung ein Integrations- und kein Unit-Test? Warum gibt es nur eine E2E-Journey? Was prüfen die Verträge, was nicht? Was passiert mit einem Test, der in Quarantäne kommt? Welche Kennzahl würdest du der Auftraggeberin in drei Monaten zeigen?

      Sei offen, dass Dienst und Daten ein Nachbau sind, und nenne, was bei einem echten Auftraggeber dazukäme: eine echte Zahlungs-Sandbox, Datenschutz für Kundendaten in Testumgebungen, Monitoring und Canary Releases nach dem Deployment.
