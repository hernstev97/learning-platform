terms:
  - term: AAA (Arrange, Act, Assert)
    definition: >-
      Aufbau eines Tests in drei Abschnitten: Vorbedingungen herstellen, genau eine Aktion ausführen,
      Ergebnis prüfen. Given-When-Then aus dem Behaviour-Driven Development meint dasselbe. Zwei
      Act-Abschnitte in einem Test sind meist zwei Tests.
  - term: Äquivalenzklasse
    definition: >-
      Menge von Eingaben, für die sich das System gleich verhalten soll, etwa „Fahrten von 6 bis 30
      Minuten kosten 150 Cent“. Aus jeder Klasse reicht ein Vertreter; die Ränder prüft die
      Grenzwertanalyse zusätzlich.
  - term: Branch Coverage
    definition: >-
      Misst, welche möglichen Sprünge an Verzweigungen die Tests genommen haben, etwa bei einem `if` den
      Zweig für wahr und den für falsch. Strenger als Line Coverage, die nur ausgeführte Zeilen zählt: Ein
      `if` ohne `else`, das immer wahr ist, erreicht 100 % der Zeilen, aber nur die Hälfte seiner Sprünge.
      In coverage.py mit `--branch`, in pytest-cov mit `--cov-branch`.
  - term: Canary Release
    definition: >-
      Eine neue Version geht zuerst an einen kleinen Teil der Nutzer oder Server; Fehlerrate und
      Antwortzeiten werden mit der alten Version verglichen, bevor alle sie bekommen. Ein Sicherheitsnetz
      nach dem Release, kein Ersatz für Tests davor.
  - term: can-i-deploy
    definition: >-
      Befehl der Pact-Broker-CLI. Er fragt vor einem Deployment den Pact Broker – den Server, der Verträge
      und Verifikationsergebnisse mit Versionen und Umgebungen speichert –, ob die Version einer Anwendung
      mit allen Partnerversionen in der Zielumgebung erfolgreich verifiziert ist
      (`pact-broker can-i-deploy --pacticipant … --version … --to-environment production`); Exit-Code 0
      heißt: deployen erlaubt.
  - term: Characterization Test (Charakterisierungstest)
    definition: >-
      Test, der das aktuelle Verhalten von Bestandscode festhält, ohne zu bewerten, ob es richtig ist
      (Michael Feathers). Er sichert ein Refactoring ab; Fehler, die dabei auffallen, werden notiert
      und getrennt behoben.
  - term: Consumer-Driven Contract
    definition: >-
      Vertrag, den der Konsument einer API aus seinen tatsächlichen Erwartungen erzeugt und den der
      Provider in seiner CI verifiziert. Der Provider sieht dadurch, welche Felder seine Konsumenten
      wirklich nutzen, und kann alles ändern, was in keinem Vertrag vorkommt. Bekanntestes Werkzeug ist
      Pact.
  - term: Contract Test
    definition: >-
      Test, der prüft, ob zwei getrennt deployte Systeme dieselbe Vorstellung von ihrer Schnittstelle
      haben: Anfragen, Statuscodes, Felder, Typen. Er ersetzt die meisten End-to-End-Tests über
      Dienstgrenzen, prüft aber keine Geschäftslogik.
  - term: Dependency Injection
    definition: >-
      Abhängigkeiten wie Uhr, Repository oder Zahlungs-Client kommen von außen herein – als Parameter
      oder über den Konstruktor –, statt im Code erzeugt oder global geholt zu werden. Tests übergeben
      dann Fakes; ein Framework braucht man dafür nicht.
  - term: Diff-Coverage
    definition: >-
      Abdeckung nur der Zeilen, die ein Pull Request ändert, etwa mit `diff-cover` aus einem
      Coverage-Bericht. Sie bewertet neuen Code und bestraft Altbestand nicht.
  - term: Dummy
    definition: >-
      Test Double, das nur übergeben wird, weil eine Signatur es verlangt, und im getesteten Pfad nie
      benutzt wird – etwa `logger=None`.
  - term: End-to-End-Test
    definition: >-
      Test, der ein System über seine äußerste Schnittstelle bedient, im Web meist im echten Browser mit
      Backend und Datenbank. Er gibt das meiste Vertrauen je Test, ist aber am langsamsten, teuersten
      und störanfälligsten; deshalb nur für wenige kritische Abläufe.
  - term: Entscheidungstabelle
    definition: >-
      Tabelle, die für jede Kombination von Bedingungen die erwartete Aktion festlegt – etwa Format
      gültig, abgelaufen, schon eingelöst → Gutschein annehmen oder ablehnen. Kombinationen mit gleichem
      Ergebnis fasst „–“ (spielt keine Rolle) zu einer Spalte zusammen, unmögliche streicht man
      ausdrücklich. Jede Spalte wird ein Testfall.
  - term: Exploratives Testen
    definition: >-
      Lernen, Testentwurf und Ausführung gleichzeitig, ohne vorgeschriebenes Skript, gelenkt von einer
      Charter wie „Untersuche Gutscheine im Zusammenspiel mit dem Abo“. Findet Fehler, an die niemand
      einen automatisierten Test geschrieben hat; Session-Based Test Management macht es planbar.
  - term: Fake
    definition: >-
      Test Double mit funktionierender, vereinfachter Implementierung, etwa ein Repository auf Basis
      eines `dict` statt PostgreSQL. Tests prüfen damit Zustand über die echte Schnittstelle; der Fake
      selbst sollte dieselben Tests bestehen wie die echte Implementierung.
  - term: Feature Flag
    definition: >-
      Schalter, der eine Funktion zur Laufzeit ein- oder ausschaltet, für alle, für Gruppen oder einen
      Prozentsatz der Nutzer. Trennt Deployment von Freigabe und erlaubt schnelles Abschalten, verdoppelt
      aber die Pfade, die getestet werden müssen.
  - term: Fixture
    definition: >-
      In pytest eine Funktion mit `@pytest.fixture`, die einem Test bereitstellt, was er braucht –
      Datenbank, Verzeichnis, Testdaten. Der Test fordert sie über einen Parameter mit ihrem Namen an.
      Schreibt man sie mit `yield`, räumt der Code danach auf, auch nach einem roten Test. Der Scope
      (`function` bis `session`) bestimmt, wie oft sie neu entsteht.
  - term: Flaky Test
    definition: >-
      Test, der bei unverändertem Code und unverändertem Test mal grün, mal rot ist. Meist liest er eine
      versteckte Eingabe: Uhr, Reihenfolge, Zufall, Nebenläufigkeit, Netzwerk. Der größte Schaden ist
      verlorenes Vertrauen: Rote Builds werden neu gestartet statt gelesen.
  - term: Functional Core, Imperative Shell
    definition: >-
      Entwurfsmuster (Gary Bernhardt): Entscheidungen und Berechnungen liegen in reinen Funktionen ohne
      I/O; Datenbank, Netzwerk und Uhr bedient eine dünne Hülle darum. Den Kern prüfen viele schnelle
      Unit-Tests, die Hülle wenige Integrationstests.
  - term: Golden Master
    definition: >-
      Die Ausgabe eines Systems für eine feste Menge Eingaben wird einmal aufgezeichnet; spätere Läufe
      müssen sie exakt reproduzieren. Approval Tests arbeiten so, mit menschlicher Freigabe jeder
      Abweichung. Schnelles Sicherheitsnetz für Altcode, aber jede gewollte Änderung macht ihn rot.
  - term: Grenzwertanalyse
    definition: >-
      Testfälle direkt an und neben den Rändern von Äquivalenzklassen, weil dort Fehler wie `<` statt
      `<=` sitzen. Für die Fehlstart-Regel: 5 Minuten (letzter kostenloser Wert) und 6 Minuten.
  - term: Idempotenz
    definition: >-
      Eine Operation ist idempotent, wenn mehrfaches Ausführen dieselbe Wirkung hat wie einmaliges. RFC
      9110 legt das unter anderem für `GET`, `PUT` und `DELETE` fest; für `POST` nutzen viele APIs einen
      Header `Idempotency-Key`, damit ein wiederholter Zahlungsaufruf nicht doppelt bucht.
  - term: Integrationstest
    definition: >-
      Test, der eigenen Code zusammen mit einer echten Abhängigkeit prüft, etwa ein Repository gegen eine
      echte Datenbank oder einen Export gegen das Dateisystem. Ein schmaler Integrationstest (narrow)
      prüft genau eine solche Grenze und läuft mit pytest wie ein Unit-Test, ein breiter (broad) startet
      viele Teile gemeinsam in einer eigenen Umgebung.
  - term: Linter
    definition: >-
      Werkzeug, das Quellcode ohne Ausführung auf Regelverstöße prüft: verdächtige Muster, ungenutzte
      Namen, Stil, einfache Sicherheitsprobleme. Ruff für Python, ESLint für JavaScript und TypeScript.
  - term: Locator
    definition: >-
      In Playwright die Beschreibung, wie ein Element gefunden wird, etwa
      `page.getByRole('button', { name: 'Reservieren' })`. Er wird bei jeder Aktion neu aufgelöst und
      wartet automatisch, bis das Element bedienbar ist; Rollen und Labels sind robuster als CSS.
  - term: Merge Queue
    definition: >-
      Warteschlange, die freigegebene Pull Requests zusammen mit den vor ihnen eingereihten gegen den
      aktuellen Stand von `main` testet und erst dann mergt. Verhindert, dass zwei einzeln grüne PRs
      zusammen `main` brechen.
  - term: Mock
    definition: >-
      Test Double mit Erwartungen an die Aufrufe, die es bekommt; der Test prüft Verhalten, etwa ob
      `belaste` genau einmal mit 450 Cent aufgerufen wurde. Passt zu Befehlen an Systemgrenzen; für
      Abfragen eingesetzt, macht es Tests brüchig. `unittest.mock.Mock` zeichnet auf und wird danach
      geprüft, ist streng genommen also ein Spy; im Alltag heißt trotzdem fast jedes Double „Mock“.
  - term: Mutation Testing
    definition: >-
      Ein Werkzeug baut kleine Fehler in den Code ein – aus `<=` wird `<`, aus `+` wird `-` – und führt
      für jeden dieser Mutanten die Tests aus. Bleiben alle grün, überlebt der Mutant: Kein Test bemerkt
      diese Änderung. In Python etwa mit mutmut.
  - term: Mutation Score
    definition: >-
      Anteil der getöteten Mutanten an allen Mutanten, ohne äquivalente Mutanten, die das Verhalten gar
      nicht ändern. Aussagekräftiger als Coverage, aber teuer zu berechnen; deshalb meist nachts oder nur
      für geänderte Module.
  - term: Page Object
    definition: >-
      Klasse, die eine Seite oder Komponente kapselt und Tests fachliche Methoden anbietet, etwa
      `buchungsseite.reserviere("Hauptbahnhof")`. Bündelt Locators an einer Stelle; zu viel Logik darin
      versteckt, was ein Test prüft.
  - term: Parametrisierung
    definition: >-
      Ein Test läuft mit mehreren Datensätzen, in pytest über `@pytest.mark.parametrize`; jeder Satz
      erscheint als eigener Testfall mit eigener ID. Passt zu Tabellen aus Äquivalenzklassen und
      Grenzwerten, nicht zu Fällen, die im Test unterschiedliche Logik brauchen.
  - term: Ports und Adapter
    definition: >-
      Architekturstil von Alistair Cockburn (Ports and Adapters, auch hexagonale Architektur): Die Domäne
      spricht nur über eigene Schnittstellen (Ports) mit der Außenwelt, Adapter verbinden sie mit
      Datenbank, HTTP oder Paystream. Domänentests nutzen Fakes, die echten Adapter prüfen Integrationstests.
  - term: Problem Details
    definition: >-
      Standardformat für Fehlerantworten von HTTP-APIs nach RFC 9457, als `application/problem+json`
      mit den Feldern `type`, `title`, `status`, `detail` und `instance`. Clients werten Fehler damit
      einheitlich aus; RFC 9457 löst RFC 7807 ab.
  - term: Property
    definition: >-
      Aussage, die für alle gültigen Eingaben gelten muss, etwa „der Preis ist nie negativ“ oder
      `ueberlappt(a, b) == ueberlappt(b, a)`. Typische Muster sind Round Trip, Invariante, Idempotenz,
      Orakel und metamorphe Relation.
  - term: Property-based Testing
    definition: >-
      Ein Werkzeug wie Hypothesis erzeugt Eingaben nach Strategien und prüft eine Property; findet es ein
      Gegenbeispiel, verkleinert es dieses (Shrinking). Lohnt sich bei großem Eingaberaum: Parser,
      Berechnungen, Datenstrukturen, Zustandsautomaten.
  - term: Provider State
    definition: >-
      Benannter Zustand, den eine Interaktion in einem Consumer-Vertrag voraussetzt, etwa „Rad r-17 ist
      frei“. Bei der Verifikation legt der Provider die passenden Daten über einen State Handler an,
      bevor die Interaktion abgespielt wird.
  - term: Quarantäne
    definition: >-
      Flaky Tests werden aus dem blockierenden Lauf genommen, laufen aber weiter und werden beobachtet.
      Jede Quarantäne braucht ein Ticket, eine verantwortliche Person und eine Frist, sonst sammeln sich
      dort Tests, die niemand mehr ansieht.
  - term: Regression
    definition: >-
      Fehler in einer Funktion, die vorher funktioniert hat, ausgelöst durch eine Änderung an anderer
      Stelle oder ein Update. Nach jedem Bugfix bleibt der Test, der den Fehler reproduziert, als
      Regressionstest in der Suite.
  - term: Risikobasiertes Testen
    definition: >-
      Der Testaufwand richtet sich nach dem Risiko, grob Wahrscheinlichkeit × Auswirkung.
      Preisberechnung und Zahlung bekommen mehr und tiefere Tests als die Sortierung der Stationsliste.
  - term: SAST
    definition: >-
      Static Application Security Testing: Werkzeuge wie Semgrep, CodeQL, Bandit oder Ruffs `S`-Regeln
      suchen im Quellcode nach Sicherheitsmustern wie SQL-Injection oder `shell=True`. Sie finden
      bekannte Muster, keine Lücken in der Autorisierungslogik, und melden Fehlalarme, die man begründet
      unterdrückt.
  - term: Seam
    definition: >-
      Stelle, an der sich Verhalten ändern lässt, ohne den Code an dieser Stelle zu bearbeiten – ein
      Parameter, eine überschreibbare Methode, ein Modulattribut (Michael Feathers). In Altcode der erste
      Ansatzpunkt, um Abhängigkeiten für Tests zu ersetzen.
  - term: Sharding
    definition: >-
      Aufteilen einer Testsuite auf mehrere Maschinen oder CI-Jobs, die gleichzeitig laufen, etwa
      `npx playwright test --shard=2/4`. Verkürzt die Wartezeit, setzt unabhängige Tests voraus und
      braucht einen Schritt, der die Berichte zusammenführt.
  - term: Shrinking
    definition: >-
      Hypothesis verkleinert ein gefundenes Gegenbeispiel schrittweise zum einfachsten Fall, der den Test
      noch rot macht – etwa von 40 Reservierungen mit krummen Zeiten auf zwei, die sich um eine Minute
      überschneiden. Erst dadurch wird der Fehler verständlich.
  - term: Smoke Test
    definition: >-
      Kleiner, schneller Test direkt nach einem Deployment gegen die echte Umgebung, der prüft, ob die
      wichtigsten Funktionen überhaupt antworten: Startseite lädt, Health-Endpoint meldet `200`,
      Anmeldung klappt. Ist er rot, rollt die Pipeline zurück.
  - term: Snapshot-Test
    definition: >-
      Test, der eine Ausgabe wie gerendertes HTML oder JSON beim ersten Lauf speichert und spätere Läufe
      damit vergleicht. Billig zu schreiben; große Snapshots werden aber ungeprüft aktualisiert und
      prüfen dann nichts mehr.
  - term: Solitary und Sociable Test
    definition: >-
      Begriffe von Jay Fields: Ein solitary Unit-Test ersetzt alle Mitspieler der getesteten Einheit durch
      Test Doubles, ein sociable lässt echte mitlaufen und ersetzt nur, was langsam, nicht deterministisch
      oder fremd ist, etwa Netz, Zahlung oder Uhr. Die Mockist-Schule (London) bevorzugt den ersten, die
      klassische Schule (Detroit) den zweiten.
  - term: Spy
    definition: >-
      Test Double, das Aufrufe aufzeichnet, damit der Test sie nach der Aktion prüft – etwa ein
      Mail-Adapter, der versendete Nachrichten in einer Liste sammelt. Ein Mock hat seine Erwartungen
      dagegen schon vor der Aktion.
  - term: storageState
    definition: >-
      Playwright-Datei mit Cookies und Local Storage eines angemeldeten Browserkontexts. Ein
      Setup-Projekt meldet sich einmal an und speichert sie; die übrigen Tests starten damit bereits
      angemeldet, jeder in einem eigenen Kontext.
  - term: Stub
    definition: >-
      Test Double, das auf Aufrufe feste Antworten gibt, etwa eine Uhr, die immer denselben Zeitpunkt
      liefert. Der Test prüft danach Rückgabe oder Zustand des getesteten Codes, nicht die Aufrufe des
      Stubs.
  - term: Test Data Builder
    definition: >-
      Funktion oder Objekt, das gültige Testdaten mit sinnvollen Standardwerten erzeugt; der Test setzt
      nur die Felder, auf die es ankommt, etwa `reservierung(start="2026-05-01T23:30")`. Hält Tests
      kurz und robust gegen neue Pflichtfelder.
  - term: Test Double
    definition: >-
      Oberbegriff von Gerard Meszaros für alle Objekte, die im Test eine echte Abhängigkeit ersetzen:
      Dummy, Stub, Spy, Mock und Fake. Der Begriff stammt vom Stunt-Double im Film.
  - term: Testcontainers
    definition: >-
      Bibliothek, die für Tests echte Dienste wie PostgreSQL in Docker-Containern startet und danach
      entfernt. Integrationstests laufen so gegen dieselbe Datenbank wie die Produktion statt gegen
      SQLite.
  - term: Testgröße
    definition: >-
      Googles Einteilung nach Ressourcen statt nach Umfang: small läuft in einem Prozess ohne I/O, medium
      auf einer Maschine mit lokalen Diensten wie einer Datenbank, large über mehrere Maschinen. Umgeht
      den Streit darüber, was eine „Unit“ ist.
  - term: Testing Trophy
    definition: >-
      Modell von Kent C. Dodds: statische Analyse als Sockel, darüber Unit-Tests, der größte Anteil
      Integrationstests, oben wenige End-to-End-Tests. Gedacht vor allem für Frontends, in denen Tests
      mehrere Komponenten zusammen bedienen sollen wie ein Nutzer.
  - term: Testpyramide
    definition: >-
      Modell von Mike Cohn: viele schnelle Unit-Tests unten, weniger Service-Tests in der Mitte, wenige
      UI-Tests oben – je höher, desto teurer und langsamer. Die umgedrehte Form mit vielen manuellen und
      End-to-End-Tests heißt Eistüte (Ice-Cream Cone) und gilt als Anti-Muster.
  - term: Tolerant Reader
    definition: >-
      Ein Client liest aus einer Antwort nur die Felder, die er braucht, und ignoriert unbekannte. So
      darf der Provider Felder ergänzen, ohne Clients zu brechen; Contract Tests mit Pact prüfen genau
      diese genutzten Felder.
  - term: Trace Viewer
    definition: >-
      Werkzeug von Playwright, das einen aufgezeichneten Lauf Schritt für Schritt zeigt: Aktionen,
      DOM-Schnappschüsse, Netzwerk, Konsole. Mit `trace: 'on-first-retry'` entsteht in der CI ein Trace
      genau für Tests, die wiederholt werden mussten.
  - term: Typchecker
    definition: >-
      Werkzeug, das Typannotationen ohne Ausführung prüft, etwa mypy oder pyright für Python und `tsc`
      für TypeScript. Findet falsche Typen an Grenzen und vergessene `None`-Fälle, aber keine falschen
      Werte desselben Typs, etwa Euro statt Cent als `int`.
  - term: Unit-Test
    definition: >-
      Schneller Test eines kleinen Verhaltens über eine öffentliche Schnittstelle, ohne langsame oder
      geteilte Abhängigkeiten. Wie groß die „Unit“ ist und was ersetzt wird, beantworten die klassische
      und die Mockist-Schule verschieden.
  - term: Web-first Assertion
    definition: >-
      Playwright-Assertion wie `await expect(locator).toHaveText('Reserviert')`, die so lange erneut
      prüft, bis die Bedingung erfüllt ist oder das Timeout abläuft. Sie ersetzt feste Pausen und
      einmalige Prüfungen, die vom Zeitpunkt abhängen.
