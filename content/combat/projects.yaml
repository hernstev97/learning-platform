projects:
  - id: frame-analyse-boss
    title: Frame-Analyse eines veröffentlichten Bosses
    level: 1
    hours: 6
    summary: Du nimmst einen Bosskampf aus einem Spiel, das du kennst, Bild für Bild auseinander – Telegraphs, aktive Frames, Erholung, Punish-Fenster – und schreibst auf, was ihn lesbar oder unfair macht. Geht größtenteils unterwegs.
    brief: |
      Wähle einen Boss aus einem veröffentlichten Spiel, am besten einen großen Gegner in der Draufsicht oder einen, dessen Kampf dir im Gedächtnis geblieben ist. Grundlage ist ein Video, das du selbst aufnimmst oder das veröffentlicht ist. Ziel ist eine Analyse, die ein anderer nachprüfen kann: Jede Zahl hat eine Fundstelle im Video.

      Frames zählst du am besten am PC: YouTube spielt mit 0,25-facher Geschwindigkeit ab, und mit den Tasten `,` und `.` springst du in einem pausierten Video Bild für Bild. Am Handy geht die Liste der Angriffe, die Beurteilung der Lesbarkeit und das Aufschreiben.

      Grundlage sind [Angriffsphasen](/combat/angriffsphasen), [Gegnermuster und Telegraphing](/combat/gegnermuster), [Große Kreaturen als Bosse](/combat/grosse-gegner) und [Schwer, unfair oder kaputt?](/combat/frust-diagnose).
    skills: [frame-daten, telegraphing, punish-fenster, lesbarkeit, analyse]
    steps:
      - id: boss-waehlen
        title: Boss und Video festlegen
        detail: Notiere Spiel, Plattform, Boss und die Quelle des Videos mit Link und Länge. Prüfe, mit wie vielen Bildern pro Sekunde das Video läuft; bei 30 Bildern pro Sekunde ist ein Bild zwei Frames eines 60-Hz-Spiels.
      - id: angriffe-auflisten
        title: Alle Angriffe benennen
        detail: Gib jedem Angriff einen eigenen Namen und notiere, wo im Video er zum ersten Mal vorkommt. Achte auf Varianten, die gleich beginnen und anders enden.
      - id: frames-zaehlen
        title: Telegraph, aktive Phase und Erholung zählen
        detail: Zähle für jeden Angriff Bild für Bild, wie lange die Ankündigung dauert, wie lange er trifft und wie lange der Boss danach steht. Schreib dazu, wie sicher du dir bist; „ab hier sehe ich den Treffer“ ist eine Beobachtung, keine gemessene Hitbox.
      - id: kanaele-telegraph
        title: Kanäle der Ankündigung festhalten
        detail: Notiere je Angriff, womit er sich ankündigt – Pose, Blinken, Bodenmarkierung, Ton – und ob die Ankündigung zeigt, wohin er trifft.
      - id: punish-fenster
        title: Punish-Fenster bestimmen
        detail: Schätze für jeden Angriff, wie viele Frames nach dem Ausweichen bleiben, bevor der Boss wieder handeln kann. Vergleiche die Angriffe untereinander.
      - id: lesbarkeit-urteil
        title: Lesbarkeit und Fairness beurteilen
        detail: Rechne die kürzeste Ankündigung in Millisekunden um und vergleiche sie mit der einfachen Reaktionszeit aus dem Modul [Eingabe](/combat/eingabe). Beschreibe, welcher Angriff dich im Spiel am häufigsten getroffen hat und warum.
      - id: fragen-notieren
        title: Eigene Fragen notieren
        detail: Schreib drei Fragen auf, die diese Analyse für deinen eigenen großen Gegner aufwirft. Antworten brauchst du nicht.
    stretch:
      - Denselben Boss in einer zweiten Schwierigkeitsstufe oder nach einem Patch vergleichen.
      - Eine zweite Person die Ankündigungen beurteilen lassen und die Urteile vergleichen.
    portfolio: |
      Eine Frame-Analyse zeigt, dass du Kampf in Zahlen und Gründen beschreiben kannst, nicht nur in Eindrücken. Zeig die Tabelle und zwei Standbilder pro Angriff. Im Gespräch fragen Designer, welche Zahl du für die wichtigste hältst und was du ändern würdest, wenn der Boss zu leicht wäre.

  - id: testszene-werkzeug
    title: Die Testszene als Messwerkzeug
    level: 2
    hours: 10
    summary: Du baust die Testszene der Am-PC-Module vollständig auf und sicherst sie so ab, dass jede spätere Abstimmung auf verlässlichen Messungen steht – Log, Debug-Anzeige, Kollisionsformen und drei Referenzläufe.
    brief: |
      Bevor du Werte abstimmst, brauchst du ein Werkzeug, dem du traust. Dieses Projekt fasst [Godot-Start](/combat/godot-start), [Testszene: Angriff mit Frame-Daten](/combat/testszene-angriff) und [Testszene: Ausweichen und Trainingsgegner](/combat/testszene-ausweichen) zu einer Szene zusammen und prüft sie gegen die Logs aus den Lektionen. Erst wenn deine Szene dieselben Abstände liefert, beurteilst du mit ihr Spielgefühl.

      Den Code dürfen dir die Lektionen oder eine KI liefern. Die Abnahme machst du selbst am Log.
    skills: [godot, gdscript, debug, zustandsautomat, kollisionsebenen]
    steps:
      - id: projekt-einrichten
        title: Projekt pixelgenau einrichten
        detail: Godot-Version notieren, Stretch Mode `viewport`, Scale Mode `integer`, Filter `Nearest`, Pixel-Snap. Projekt in Git mit einem ersten Commit.
      - id: figur-und-dummy
        title: Figur, Dummy und Kollisionsebenen
        detail: Spielfigur mit `player.gd`, Dummy mit `enemy.gd`, drei benannte Ebenen, Hitbox und Hurtbox nach der Tabelle aus der Lektion.
      - id: log-und-anzeige
        title: HitLog und Debug-Anzeige
        detail: Autoload `HitLog`, Debug-Label im `CanvasLayer`, „Sichtbare Collision-Shapes“ an. Jeder Tastendruck und jeder Zustandswechsel steht mit Frame-Nummer in der Ausgabe.
      - id: referenz-angriff
        title: Referenzlauf Angriff
        detail: Mit den Platzhalterwerten einmal treffen. Die Abstände im Log müssen der Lektion entsprechen (8 Frames bis `ACTIVE`, Treffer einen Frame danach, `RECOVERY` 7 Frames nach `ACTIVE`, `MOVE` 14 danach).
      - id: referenz-ausweichen
        title: Referenzläufe Ausweichen
        detail: Die drei Fälle aus der Lektion mit dem Drehbuch frame-genau nachstellen – zu spät, gerade noch, zu früh gegen einen langen Angriff – und die Logs speichern.
      - id: grosser-gegner
        title: Großen Trainingsgegner aufstellen
        detail: Zwei Hurtbox-Zonen mit eigenem `zone`-Namen, `interruptible` aus, ein langsamer Platzhalterangriff mit Telegraph so groß wie die Hitbox.
      - id: referenz-dokument
        title: Referenz festhalten
        detail: Eine Datei `REFERENZ.md` mit Godot-Version, Platzhalterwerten und den Logs der Referenzläufe. Ändert sich später etwas Unerwartetes, vergleichst du gegen diese Datei.
    stretch:
      - Einen Schalter, der alle Kollisionsformen im laufenden Spiel ein- und ausblendet.
      - Movie Maker mit PNG-Ausgabe für einen Referenzlauf und die Bilder Frame für Frame mit dem Log vergleichen.
    portfolio: |
      Ein Prototyp mit sichtbaren Frame-Daten zeigt Arbeitgebern, dass du misst, bevor du urteilst. Ein kurzes Video mit Debug-Anzeige und Log ist im Gespräch mehr wert als eine lange Beschreibung.

  - id: ausweichen-serie
    title: Eine Tuning-Serie für das Ausweichen
    level: 2
    hours: 8
    summary: Du stimmst das Ausweichen der Testszene in mindestens fünf protokollierten Runden ab – gegen einen festen Trainingsgegner, mit Hypothese vor jeder Änderung und genau einer geänderten Größe pro Runde.
    brief: |
      Das Ausweichen hängt an mehreren Werten: Anlauf, i-Frames, Strecke, Erholung. Ändert man mehrere zugleich, weiß man hinterher nicht, was gewirkt hat. In diesem Projekt hältst du den Trainingsgegner fest und änderst pro Runde genau einen Wert des Ausweichens. Was sich gut anfühlt, entscheidest du. Das Projekt verlangt nur, dass du deine Entscheidung begründest und belegst.

      Grundlage sind [Ausweichen, Risiko und Belohnung](/combat/ausweichen), [Testszene: Ausweichen und Trainingsgegner](/combat/testszene-ausweichen) und [Tuning als Experiment](/combat/tuning).
    skills: [tuning, i-frames, punish-fenster, protokoll, playtest]
    steps:
      - id: gegner-festlegen
        title: Trainingsgegner festlegen
        detail: Wähle zwei Angriffe für den Trainingsgegner, einen kurzen und einen langen, und speichere sie als `.tres`. Sie bleiben die ganze Serie über gleich.
      - id: ausgangslage
        title: Ausgangslage messen
        detail: Notiere die Startwerte des Ausweichens und miss, aus welchen Druck-Frames das Ausweichen gegen beide Angriffe gelingt.
      - id: runde-1
        title: Runde 1
        detail: Hypothese mit Ursache und erwarteter Wirkung aufschreiben, genau einen Wert ändern, messen, spielen, Eindruck in eigenen Worten, Entscheidung.
      - id: runden-2-bis-5
        title: Runden 2 bis 5
        detail: Wie Runde 1. Jede Runde ist ein eigener Commit mit dem Protokolleintrag.
      - id: stumpf-gegen-bewusst
        title: Stumpf gegen bewusst
        detail: Teste den Endstand zweimal – einmal nur ausweichen, sobald irgendetwas passiert, einmal erst auf den Telegraph reagieren – und vergleiche, welche Spielweise das Ausweichen belohnt.
      - id: fremdtest
        title: Jemand anderen spielen lassen
        detail: Lass eine andere Person fünf Minuten spielen, ohne zu erklären. Notiere, was sie tut, nicht was sie sagt.
      - id: abschluss
        title: Ergebnis und offene Fragen
        detail: Fasse zusammen, welche Runde was gezeigt hat, und schreib die Fragen auf, die offen bleiben.
    stretch:
      - Dieselbe Serie gegen den großen Trainingsgegner wiederholen und die Ergebnisse vergleichen.
    portfolio: |
      Eine Tuning-Serie mit Hypothesen und Messungen ist genau die Arbeit, die Studios von Combat Designern erwarten. Zeig das Protokoll und ein kurzes Video vom Anfang und vom Ende der Serie nebeneinander.

  - id: abschluss-kampfentwurf
    title: "Abschlussprojekt: Designtest für einen Kampfprototyp"
    capstone: true
    level: 3
    hours: 40
    summary: Ein kleines Studio schickt dir einen Designtest. Du entwirfst in der Testszene einen eigenen Spielerangriff, ein Ausweichen und einen großen Trainingsgegner mit drei Angriffen, stimmst sie in protokollierten Runden ab und lieferst Frame-Tabelle, Iterationsprotokoll, eine Vorgabe für einen Coding-Agenten und offene Fragen. Alle Designentscheidungen triffst du.
    brief: |
      ## Auftrag

      Jana Wolff leitet ein Indie-Studio mit sechs Leuten in Leipzig. Das Studio arbeitet an einem Actionspiel in der Draufsicht mit Pixelart, analoger Bewegung in alle Richtungen und großen Gegnern. Für die Stelle „Combat Designer (m/w/d)“ schickt sie dir einen Designtest. Ihre Lage:

      - Der Prototyp des Teams fühlt sich laut Testern „matschig“ an, aber niemand kann sagen, woran das liegt.
      - Das Team hat keine Frame-Daten, nur Animationen. Wer ein Timing ändern will, schiebt Keys und hofft.
      - Die Programmierer brauchen Vorgaben, nach denen sie ohne Rückfrage bauen können.

      Gesucht ist kein fertiges Kampfsystem, sondern ein Beleg, dass du einen Kampf in Zahlen entwirfst, messbar abstimmst und so beschreibst, dass andere ihn bauen und prüfen können. Den Inhalt des Entwurfs gibt dir niemand vor. Wenn du willst, ist er dein erster Prototyp für Project Delicate Flower; der Kurs schlägt dafür keine Mechanik vor.

      ## Was du lieferst

      1. **Eine spielbare Szene** in Godot 4.7 auf Grundlage der Testszene: ein Spielerangriff (oder eine kurze Folge), ein Ausweichen und ein großer Trainingsgegner mit mindestens drei Angriffen und mindestens zwei Trefferzonen.
      2. **`FRAME-DATEN.md`:** eine Tabelle aller Angriffe und des Ausweichens in Frames, mit Messung.
      3. **`PROTOKOLL.md`:** mindestens fünf Tuning-Runden mit Hypothese, geänderter Größe, Erwartung, Messung, Eindruck und Entscheidung.
      4. **`VORGABE.md`:** eine Vorgabe für einen Coding-Agenten für eine Erweiterung deiner Wahl, die er ohne Rückfrage umsetzen kann.
      5. **`OFFENE-FRAGEN.md`:** was du noch nicht entschieden hast und wie du es testen würdest.
      6. **Ein Video** von höchstens zwei Minuten mit sichtbarer Debug-Anzeige.

      ## Technischer Rahmen

      Godot 4.7, GDScript, 60 Physik-Frames pro Sekunde, Auflösung und Pixelgröße nach deiner Wahl, Stretch Mode `viewport`. Den Code darf eine KI schreiben, auch nach deiner Vorgabe. Jede Kampfmechanik, jeden Wert und das Urteil über das Spielgefühl entscheidest du selbst. Platzhalter aus dem Kurs, die du übernimmst, kennzeichnest du als solche.

      Grundlage sind alle Module dieses Bereichs, besonders [Angriffsphasen](/combat/angriffsphasen), [Ausweichen, Risiko und Belohnung](/combat/ausweichen), [Große Kreaturen als Bosse](/combat/grosse-gegner), [Trefferfeedback](/combat/trefferfeedback), [Vorgaben für einen Coding-Agenten](/combat/vorgaben) und [Tuning als Experiment](/combat/tuning).
    skills: [combat-design, frame-daten, godot, gdscript, tuning, playtest, dokumentation, vorgaben]
    steps:
      - id: ziel-formulieren
        title: Ziel in einem Satz formulieren
        detail: Was soll ein Spieler in diesem Kampf erleben und lernen? Schreib den Satz in `PROTOKOLL.md`, bevor du einen Wert festlegst.
      - id: spielerwerkzeuge
        title: Angriff und Ausweichen entwerfen
        detail: Lege Phasen, i-Frames, Strecke und Erholung als erste Hypothese fest und schreib sie in `FRAME-DATEN.md`. Begründe jede Zahl in einem Satz.
      - id: gegner-entwerfen
        title: Großen Gegner entwerfen
        detail: Drei Angriffe mit Telegraph, Fläche und Erholung, zwei Trefferzonen, eine Regel für Unterbrechbarkeit. Halte fest, welcher Angriff was vom Spieler verlangt.
      - id: bauen-lassen
        title: Bauen oder bauen lassen
        detail: Setze den Entwurf in der Testszene um, selbst oder über eine Vorgabe an einen Coding-Agenten. Prüfe das Ergebnis am Log gegen deine Tabelle.
      - id: referenzlaeufe
        title: Referenzläufe aufnehmen
        detail: Je Angriff ein Lauf, in dem du triffst, und einer, in dem du ausweichst. Logs speichern.
      - id: runden
        title: Fünf Tuning-Runden
        detail: Jede Runde ändert genau eine Größe und hat einen eigenen Commit. Spieler- und Gegnerwerte nie in derselben Runde ändern.
      - id: stumpf-bewusst
        title: Stumpf gegen bewusst testen
        detail: Ein Lauf mit Dauerdrücken, einer mit Reagieren auf die Ankündigungen. Beschreibe, welche Spielweise dein Entwurf belohnt, und ob du das so willst.
      - id: treffer-erklaeren
        title: Jeden Treffer erklären
        detail: Für einen vollständigen Lauf gegen den großen Gegner ordnest du jeden Treffer, den die Figur einsteckt, einer Ursache zu – zu spät reagiert, nicht lesbar, technischer Fehler – mit der Log-Zeile als Beleg.
      - id: fremdtest
        title: Fremdtest
        detail: Zwei Personen spielen je fünf Minuten ohne Erklärung. Du notierst, was sie tun, und vergleichst es mit deinem Ziel.
      - id: vorgabe-schreiben
        title: Vorgabe für einen Coding-Agenten
        detail: Wähle eine Erweiterung, etwa einen vierten Angriff oder eine neue Debug-Anzeige, und beschreibe sie so, dass sie ohne Rückfrage umsetzbar und am Log prüfbar ist.
      - id: abgabe
        title: Abgabe zusammenstellen
        detail: Video, Dokumente und ein README mit Godot-Version und Startanleitung. Lies alles einmal als Jana Wolff.
    acceptance:
      - id: spielbar
        text: Die Szene startet mit Godot 4.7 ohne Fehler oder Warnungen in der Ausgabe; alle Aktionen sind mit Tastatur und Gamepad belegt.
      - id: frame-tabelle
        text: "`FRAME-DATEN.md` nennt für jeden Angriff und das Ausweichen alle Phasen in Frames; für jede Zeile gibt es ein gespeichertes Log, das die Zahlen bestätigt."
      - id: runden-protokoll
        text: "`PROTOKOLL.md` enthält mindestens fünf Runden; jede hat eine Hypothese, die vor der Änderung datiert ist, genau eine geänderte Größe, eine Messung und eine Entscheidung."
      - id: stumpf-bewusst-belegt
        text: Je ein Lauf „stumpf angreifen“ und „bewusst reagieren“ gegen den großen Gegner ist mit Ergebnis protokolliert.
      - id: treffer-erklaert
        text: Für einen vollständigen Lauf ist jeder eingesteckte Treffer mit Ursache und Log-Zeile erklärt.
      - id: vorgabe-umsetzbar
        text: "`VORGABE.md` nennt Ziel, Zustände, Parameter mit Einheiten, Konfliktregeln und mindestens drei Abnahmekriterien, die man am Log prüfen kann; Werte sind als Parameter angelegt."
      - id: offene-fragen
        text: "`OFFENE-FRAGEN.md` nennt mindestens drei offene Designfragen und je einen Test, der sie klären würde."
      - id: git-verlauf
        text: Das Projekt liegt in Git; jede Tuning-Runde ist ein eigener Commit mit Verweis auf ihren Protokolleintrag.
    stretch:
      - Eine zweite Vergleichsserie, die eine andere Größe als die erste untersucht.
      - Ein Fremdtest mit drei Personen und eine Auswertung, worin sich ihr Verhalten unterscheidet.
      - Eine Frame-für-Frame-Analyse eines eigenen Laufs mit Movie Maker, gelegt neben das Log.
    portfolio: |
      Das Projekt ist eine vollständige Fallstudie: Ziel, Entwurf in Zahlen, Messung, fünf Iterationen, Fremdtest, eine Vorgabe für die Umsetzung. Zeig im Portfolio das Video, die Frame-Tabelle und zwei Runden aus dem Protokoll, in denen sich deine Erwartung als falsch herausgestellt hat. Im Gespräch fragen Designer, welche Runde dich am meisten überrascht hat, was du mit mehr Zeit testen würdest und wie du mit einem Animator über einen zu langen Wind-up sprichst.
