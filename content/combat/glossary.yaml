terms:
  - term: Frame
    definition: "Ein Physik-Tick, in Godot standardmäßig 1/60 Sekunde, also etwa 16,7 ms. In diesem Bereich die Einheit für alle Zeiten im Kampf. Umrechnung: `ms = Frames × 1000 / 60`."
  - term: Frame-Daten
    definition: Tabelle mit den Zeiten eines Angriffs in Frames – Startup bzw. Wind-up, aktive Frames, Erholung, dazu oft Vorteil bei Treffer. Offizielle Beispiele veröffentlicht Capcom für Street Fighter 6.
  - term: Wind-up
    definition: Ausholphase eines Angriffs vor dem ersten aktiven Frame. Kündigt den Angriff an und gibt ihm Wucht; in der Testszene das Feld `windup` von `AttackData`.
  - term: Startup
    definition: In offiziellen Frame-Daten (etwa Street Fighter 6) der Frame, in dem die Hitbox zum ersten Mal erscheint. Zählt den ersten aktiven Frame mit; Wind-up 8 entspricht Startup 9.
  - term: Aktive Frames
    definition: Frames, in denen die Hitbox eines Angriffs treffen kann. In der Testszene `active`.
  - term: Erholung
    definition: Frames nach der aktiven Phase, in denen die Figur noch nicht wieder handeln kann (englisch Recovery). Der Preis eines Angriffs und das Fenster für einen Punish.
  - term: Follow-through
    definition: Ausschwingen nach dem Treffer, Teil der Erholung. Sakurai beschreibt es als die Phase, in der sich die Wucht eines Angriffs zeigt.
  - term: Hitbox
    definition: Fläche, mit der ein Angriff trifft. In Godot eine `Area2D` mit Form, die nur während der aktiven Frames eingeschaltet ist.
  - term: Hurtbox
    definition: Fläche, an der eine Figur getroffen werden kann. Muss nicht mit dem Bild übereinstimmen; Sakurai hält einen Größenunterschied für unproblematisch, einen Unterschied in der Position nicht.
  - term: Disjointed Hitbox
    definition: Hitbox, die nicht an einer Hurtbox der Figur sitzt, etwa die Spitze eines Schwerts oder ein Projektil. Wer sie trifft, trifft die Figur nicht.
  - term: Kollisionsebene
    definition: In Godot eine von 32 Ebenen (`collision_layer`), in der ein Objekt liegt. Ein Objekt erkennt ein anderes nur, wenn dessen Ebene in seiner Maske (`collision_mask`) steht.
  - term: Telegraph
    definition: Ankündigung eines gegnerischen Angriffs durch Pose, Blinken, Bodenmarkierung oder Ton. In der Testszene der Wind-up eines gegnerischen Angriffs mit gelber Bodenfläche.
  - term: Tell
    definition: Englisch für ein Zeichen, an dem man einen kommenden Angriff erkennt; oft gleichbedeutend mit Telegraph verwendet.
  - term: Input Buffer
    definition: Eingabepuffer. Merkt sich einen Tastendruck, der zu früh kam, und führt die Aktion im ersten möglichen Frame aus. In der Testszene zählt ein Druck, wenn er höchstens `input_buffer` Frames alt ist.
  - term: Coyote Time
    definition: Kurze Frist, in der eine Aktion noch erlaubt ist, obwohl ihre Bedingung gerade weggefallen ist, etwa ein Sprung kurz nach dem Verlassen der Kante. Im Quellcode von Celeste 0,1 Sekunden.
  - term: Eingabelatenz
    definition: Zeit vom Tastendruck bis zur sichtbaren Reaktion auf dem Bildschirm. Setzt sich aus Controller, Spiel, Rendern und Bildschirm zusammen.
  - term: Reaktionszeit
    definition: Zeit, die ein Mensch braucht, um auf ein Signal zu reagieren. Für einfache Reaktionen auf ein bekanntes Signal maßen Woods et al. 2015 im Mittel 213 ms nach Abzug der Geräteverzögerung, also knapp 13 Frames.
  - term: Commitment
    definition: Wie fest ein Spieler nach dem Drücken an seine Aktion gebunden ist. Lange Erholung und keine Abbruchmöglichkeit bedeuten viel Commitment.
  - term: Cancel
    definition: Abbruch einer laufenden Aktion durch eine andere, nur in festgelegten Frames erlaubt. In der Testszene `cancel_from` für Anschlussangriffe aus der Erholung.
  - term: Anschlussangriff
    definition: Angriff, der aus der Erholung des vorigen startet, bevor diese vorbei ist. Eine Folge solcher Angriffe heißt Kombo oder String.
  - term: i-Frames
    definition: Frames, in denen eine Figur nicht getroffen werden kann, etwa beim Ausweichen. Die Testszene schaltet dafür die Hurtbox mit `monitorable` ab.
  - term: Dodge
    definition: Ausweichmanöver, oft eine Rolle oder ein Dash. Besteht aus Bewegung, meist i-Frames und einer Erholung.
  - term: Punish
    definition: Treffer in die Erholung eines Gegners. Das Punish-Fenster sind die Frames, in denen du frei bist und der Gegner noch nicht.
  - term: Frame Advantage
    definition: Wie viele Frames eine Seite nach einer Aktion früher handeln kann als die andere. Street Fighter 6 nennt die Werte „on Hit“ und „on Block“.
  - term: Hitstop
    definition: Kurzes Einfrieren von Angreifer und Ziel im Moment des Treffers. Macht Treffer spürbar, verlängert aber alle betroffenen Zustände um seine Dauer.
  - term: Hitstun
    definition: Frames, in denen eine getroffene Figur nicht handeln kann. In der Testszene `hitstun`.
  - term: Knockback
    definition: Zurückstoßen beim Treffer. In der Testszene in Pixeln pro Sekunde, abklingend.
  - term: Screenshake
    definition: Kamerawackeln bei starken Ereignissen. In Godot meist über `Camera2D.offset`. Vlambeer musste Nuclear Throne eine Option zum Abschalten geben, weil manchen Spielern übel wurde.
  - term: Trauma
    definition: Wert zwischen 0 und 1, aus dem Squirrel Eiserloh die Stärke eines Screenshakes berechnet (etwa Trauma²). Treffer erhöhen ihn, er klingt mit der Zeit ab.
  - term: Juice
    definition: Rückmeldungen, die eine Aktion verstärken, ohne die Regeln zu ändern – Blitz, Partikel, Ton, Shake, Squash and Stretch. Begriff aus dem Vortrag „Juice it or lose it“.
  - term: Game Feel
    definition: Nach Steve Swink „the tactile sensation of manipulating a digital agent“, das Gefühl beim Steuern. Entsteht aus Eingabe, Reaktion und Rückmeldung.
  - term: Hyper Armor
    definition: Eigenschaft eines Gegners, bei Treffern seinen Angriff nicht abzubrechen. In der Testszene `interruptible = false`.
  - term: Trefferzone
    definition: Eine von mehreren Hurtboxen einer großen Figur, etwa Kopf oder Bein, oft mit eigenem Schadensfaktor. In der Testszene `zone` und `damage_multiplier`.
  - term: Phase
    definition: Abschnitt eines Bosskampfs mit eigenem Muster. Wechselt meist bei einem Lebensstand oder nach einer Zeit.
  - term: Angriffstoken
    definition: Erlaubnis zum Angreifen aus einem begrenzten Vorrat. Begrenzt, wie viele Gegner gleichzeitig angreifen; beschrieben in Santa Monica Studios Vortrag zu God of War.
  - term: Kung-Fu-Kreis
    definition: Muster, bei dem nur wenige Gegner gleichzeitig angreifen, während die anderen im Kreis warten, wie in einer Kampfszene im Film.
  - term: Muster
    definition: Feste Abfolge von Angriffen eines Gegners. In der Testszene die Liste `attacks`, die der Reihe nach abgearbeitet wird.
  - term: Zustandsautomat
    definition: Logik, bei der eine Figur immer in genau einem Zustand ist und nach Regeln in den nächsten wechselt. In der Testszene `MOVE`, `WINDUP`, `ACTIVE`, `RECOVERY` und weitere.
  - term: Physik-Interpolation
    definition: Godot zeichnet Zwischenstände zwischen zwei Physik-Frames, damit Bewegung auf Monitoren über 60 Hz flüssig aussieht. Seit Godot 4.3 auch in 2D; erhöht die Eingabeverzögerung etwas.
  - term: Pixel-Snap
    definition: Rundet beim Zeichnen jede Position auf ganze Pixel (`snap_2d_transforms_to_pixel`). Die Position im Spiel bleibt eine Kommazahl.
  - term: Stretch Mode viewport
    definition: Godot zeichnet das Bild in der kleinen Grundauflösung und vergrößert es als Ganzes. Die Einstellung für Pixelart ohne Subpixel-Bewegung.
  - term: Deadzone
    definition: Bereich um die Mitte eines Sticks, der als 0 zählt. In Godot je Aktion einstellbar, für neue Aktionen 0,2; `Input.get_vector()` rechnet sie heraus.
  - term: Hypothese
    definition: Beim Tuning die vorher aufgeschriebene Vermutung, was eine Änderung bewirkt und warum. Ohne sie lässt sich ein Test nicht auswerten.
  - term: Iterationsprotokoll
    definition: Aufzeichnung jeder Tuning-Runde mit Hypothese, geänderter Größe, Messung, Eindruck und Entscheidung.
  - term: Playtest
    definition: Test eines Spiels mit Spielern. Valve beschreibt Designs als Hypothesen und Playtests als Experimente; beobachtet wird, was Spieler tun, nicht was sie sagen.
  - term: One-Page Design
    definition: Designdokument, das auf genau eine Seite passt. Stone Librande stellte die Methode 2010 auf der GDC vor.
  - term: Movie Maker
    definition: Godot-Modus, der ein Spiel mit fester Bildrate als Video oder PNG-Folge aufnimmt. Mit PNG lässt sich jeder Frame einzeln ansehen.
