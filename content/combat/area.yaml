id: combat
title: Combat Design & Game Feel
short: Combat
tagline: Kampfgefühl in Frames messen, begründen und selbst abstimmen.
description: >
  Eingabe und Puffer, Wind-up, aktive Phase und Erholung, Hit- und Hurtboxen,
  Ausweichen, Gegnermuster, große Gegner und Trefferfeedback – erklärt an
  veröffentlichten Spielen und kurzen Clips, die du unterwegs am Handy
  analysierst. Am PC stimmst du eine kleine Top-down-Testszene in Godot 4 ab:
  Hypothese, eine Größe ändern, vergleichen. Jede Designentscheidung triffst du
  selbst; Code und technisches Gerüst darf eine KI liefern. Module mit der Marke
  „Unterwegs“ gehen ganz am Handy, nur die verlinkten Clips brauchen Netz. „Am PC“
  braucht Godot 4 am Rechner; lesen kannst du diese Lektionen auch unterwegs.
color: "#FF4D6D"
order: 11
outcomes:
  - Du beschreibst einen Angriff in **Frames** – Wind-up, aktive Phase, Erholung, Abbruchfenster, Puffer – und rechnest sie in Millisekunden um.
  - Du erklärst, warum ein Treffer **fair oder unfair** wirkt, und trennst Schwierigkeit, mangelnde Lesbarkeit und technische Fehler wie verschobene Hitboxen oder verlorene Eingaben.
  - Du analysierst **Ausweichen, Risiko und Belohnung** sowie Gegner- und Bossmuster veröffentlichter Spiele an kurzen Clips.
  - Du setzt **Trefferfeedback** – Hitstop, Screenshake, Flash, Knockback, Sound – gezielt ein und kennst seine Kosten.
  - Du richtest eine **Godot-4-Testszene** in der Draufsicht ein, mit bewegter Figur, `AnimationPlayer` mit Hitbox-Timing, Input Map und Pixel-perfect-Einstellungen.
  - Du stimmst Kampfwerte als **Experiment** ab – Hypothese, eine Größe, Vergleichstest, Protokoll – und schreibst daraus eine Vorgabe, die ein Coding-Agent umsetzen kann.
tracks:
  - title: Kampf verstehen
    description: Spielgefühl, Eingabe und Puffer, die Phasen eines Angriffs, Reichweite und Trefferzonen.
    modules: [spielgefuehl, eingabe, angriffsphasen, hitboxen]
  - title: Ausweichen und Gegner
    description: Ausweichen mit Risiko und Belohnung, Gegnermuster und Telegraphing, große Kreaturen als Bosse.
    modules: [ausweichen, gegnermuster, grosse-gegner]
  - title: Rückmeldung und Diagnose
    description: Trefferfeedback, die Frage „schwer, unfair oder kaputt?“ und Vorgaben, nach denen ein Coding-Agent baut.
    modules: [trefferfeedback, frust-diagnose, vorgaben]
  - title: Testszene in Godot
    description: Am PC mit Godot 4. Ein kurzer Godot-Start, dann eine Top-down-Testszene mit Angriff, Ausweichen und Trainingsgegnern, die du in Runden abstimmst.
    modules: [godot-start, testszene-angriff, testszene-ausweichen, tuning]
