id: testszene-angriff
title: "Testszene: Angriff mit Frame-Daten"
level: 2
minutes: 180
summary: Ein Angriff, dessen Wind-up, aktive Phase und Erholung als Zahlen im Inspektor stehen, ein Zustandsautomat, der Physik-Frames zählt, ein Eingabepuffer, ein Trainingsdummy mit Hurtbox, Hitstop und eine Anzeige, die jeden Treffer mit Frame-Nummer protokolliert.
place: pc
goals:
  - Du legst Frame-Daten als `Resource` an und änderst sie im Inspektor, ohne Code anzufassen.
  - Du liest einen Zustandsautomaten, der Physik-Frames zählt, und sagst vorher, in welchem Frame ein Zustandswechsel im Log steht.
  - Du erklärst Eingabepuffer und Abbruchfenster am Code und an echten Log-Zeilen.
  - Du richtest Hitbox, Hurtbox und Kollisionsebenen so ein, dass nur gewollte Treffer zählen.
  - Du unterscheidest lokalen Hitstop von `Engine.time_scale` und begründest, warum die Testszene den lokalen nimmt.
