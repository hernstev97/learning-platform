    url: https://vice.com/en/article/the-developers-of-monster-hunter-explain-what-its-like-to-build-monsters
lesson: |
  Der Trainingsgegner der Testszene besteht aus wenigen Zahlen: 60 Frames warten, 20 Frames gelbe Bodenfläche, 4 Frames Hitbox, 30 Frames Erholung. Ein Frame ist ein Physik-Tick, 1/60 Sekunde. Das reicht für einen Angriff. Ein Gegner wird daraus erst, wenn klar ist, wann er angreift, woran der Spieler das erkennt und was danach kommt. Kaname Fujioka beschreibt die frühen Monster von Monster Hunter mit „relatively simple attacks, easy tells“: Wenn ein Monster das tut, weißt du, dass es gleich auf dich zustürmt ([Vice](https://vice.com/en/article/the-developers-of-monster-hunter-explain-what-its-like-to-build-monsters)).

  Ein **Telegraph** ist die Ankündigung eines Angriffs, ein **Tell** das einzelne Signal darin. Dieses Modul behandelt die Bausteine: welche Rolle ein Gegner spielt, wer wann angreifen darf, über welche Kanäle sich ein Angriff ankündigt, warum Muster lesbarer sind als Zufall und wie Studios das nach Playtests nachstellen. Alle Werte der Testszene sind Platzhalter. Wie deine Gegner aussehen, entscheidest du.

  ## Rollen: wofür ein Gegner im Kampf da ist

  Bei Monster Hunter steht die Rolle vor dem Monster. Fujioka sagt: „We need a framework for what kind of monster is going to be needed at each stage of the game“, und: „They all have a different role to play.“ Ein Monster, das am Anfang alle Werkzeuge des Spielers verlangt, passt dort nicht hin ([Vice](https://vice.com/en/article/the-developers-of-monster-hunter-explain-what-its-like-to-build-monsters)). In einem anderen Interview beschreibt er die Reihenfolge der Arbeit: „We plan for the monster's behaviour first“, mit Dingen wie dem Abstand zwischen Spieler und Monster ([Nintendo Life](https://nintendolife.com/news/2015/02/monster_hunter_4_ultimate_director_discusses_monster_design_and_animation)).

  Eine Rolle kann auch eine Ressource sein. id Software beschreibt im Vortrag zu DOOM (2016) einen Kampf ohne regenerierende Gesundheit, ohne Nachladen und ohne Deckung: Was der Spieler braucht, holt er sich von den Gegnern ([Game Developer](https://www.gamedeveloper.com/design/video-the-combat-design-of-i-doom-i-)). Und Rollen können wandern. Bei Hollow Knight: Silksong nutzt laut William Pellen schon ein gewöhnlicher Ameisenkrieger dasselbe Moveset wie der ursprüngliche Hornet-Boss aus Hollow Knight ([Nintendo Life](https://www.nintendolife.com/news/2025/09/team-cherry-explains-hollow-knight-silksongs-steep-difficulty)).

  Eine Rolle ist eine Frage an den Spieler. Damit du sie abstimmen kannst, braucht sie eine Größe. Ein paar Beispiele, wie sich solche Fragen auf die Testszene abbilden:

  | Frage an den Spieler | Größe | Feld |
  | --- | --- | --- |
  | Hältst du Druck aus? | Pause | `wait_frames` |
  | Erkennst du den Angriff? | Ankündigung | `windup` |
  | Nutzt du die Lücke? | Erholung | `recovery` |
  | Hältst du Abstand? | Reichweite | Hitbox-Form |

  Welche Fragen deine Gegner stellen, legst du fest. Die Tabelle zeigt nur, dass jede Frage an einer Zahl hängt, die du ändern und messen kannst.

  ## Wer greift an? Aggression, Tokens und der Kung-Fu-Kreis

  Vier Gegner, die jeder nach eigener Uhr angreifen, treffen irgendwann im selben Frame. Für God of War (2018) hat Santa Monica Studio dafür ein System übernommen und überarbeitet, das laut Mihir Sheth „mostly updated … from GOW: Ascension“ ist: „Think of it like a fight scene in a kung fu movie.“ Aggressive Gegner greifen von vorn an, die anderen „hang around in the back and wait to become aggressive“ ([Folien mit Notizen](https://media.gdcvault.com/gdc2019/presentations/Sheth_Mihir_EvolvingCombat.pdf)).

  Wer aggressiv ist, entscheidet ein Wert, den das Spiel in kurzen Abständen neu berechnet. Er setzt sich aus vier Kriterien zusammen, nach Wichtigkeit geordnet:

  1. Kann der Gegner überhaupt aggressiv werden? Nicht, solange er etwa gerade getroffen reagiert.
  2. Seine Priorität, die Designer je Gegnertyp festlegen, mit einer Reichweite, in der sie gilt.
  3. Ob der Spieler ihn gerade anvisiert.
  4. Sein Rang aus Position: im Bild oder nicht, Winkel zur Kamera, Abstand zu Kratos.

  Nach diesem Wert sortiert, bekommen die Gegner **Aggressions-Tokens** aus einem festen Vorrat. Ein Gegnertyp kann mehrere Tokens belegen, „to signify size or importance“. Im Beispiel der Folien hat der Vorrat 14 Tokens. Ist er aufgebraucht, sind alle übrigen nicht aggressiv. Die Werte ändern sich je Schwierigkeitsgrad.

  Die Analyse von Tommy Thompson zu DOOM (2016) beschreibt ein ähnliches System, aber je Angriffsart: Nahkampf, Fernkampf, aufgeladene Angriffe und andere haben eigene Token-Zahlen, je Schwierigkeit verschieden, und Dämonen können einander Tokens wegnehmen. Während eines Glory Kills, des Finishers des Spielers, darf keine KI einen neuen Angriff beginnen, bis er vorbei ist, weil es unfair wäre, wenn Dämonen angreifen, während der Spieler nicht reagieren kann ([Game Developer](https://www.gamedeveloper.com/design/cyber-demons-the-ai-of-doom-2016-)). Das ist eine Sekundärquelle, keine Aussage von id Software.

  Eine Anleitung zum Nachbauen ist der Artikel [Battle Circle AI](https://code.tutsplus.com/battle-circle-ai-let-your-player-feel-like-theyre-fighting-lots-of-enemies--gamedev-13535t) von Kenneth Backus. Er unterscheidet „cinematic“ Kämpfe, in denen Gegner warten, bis sie dran sind, von „dangerous“ wie in Dark Souls, in denen sie sich nur aus dem Weg gehen. Die Variable `simultaneousAttackers` legt fest, wie viele gleichzeitig angreifen dürfen: in seiner Demo 2, in cineastischeren Spielen 1. Wer abgewiesen wird, weicht „for a second or two“ seitlich aus und fragt dann wieder.

  Die Trainingsgegner der Testszene kennen keine Tokens. Jeder läuft seinen eigenen Zyklus. Ob und wie deine Gegner sich absprechen, ist eine eigene Schicht über ihrem Zustandsautomaten, und eine eigene Designentscheidung.

  ## Telegraph-Kanäle: Pose, Blinken, Bodenmarkierung, Ton

  Ein Angriff kann sich über mehrere Kanäle ankündigen. Jeder beantwortet eine andere Frage:

  - **Pose**: Wer greift an, und wann ungefähr? Die Ausholbewegung der Animation (mehr im geplanten Kurs zu 2D-Animation).
  - **Blinken**: Jetzt gleich. Ein kurzer Farbwechsel oder Flash markiert einen Zeitpunkt.
  - **Bodenmarkierung**: Wo und wie groß? Eine Fläche zeigt, was getroffen wird.
  - **Ton**: auch ohne Blickkontakt. Ein Geräusch erreicht den Spieler, wenn die Kamera den Gegner nicht zeigt (mehr im geplanten Kurs zu Sounddesign).

  Die Testszene nutzt nur die Bodenmarkierung. Die gelbe Fläche ist genau im Zustand `TELEGRAPH` sichtbar, und dieser dauert so lange wie `windup` des aktuellen Angriffs:

  ```gdscript
  telegraph.visible = new_state == State.TELEGRAPH
  ```

  Wie lang und wie deutlich ein Telegraph ist, entscheidet, ob man auf ihn reagieren kann. Für The Last of Us Part II hat Naughty Dog die Tells der Gegner verlängert und deutlicher gemacht, als das Ausweichen dazukam: „Longer enemy attack tells. More obvious enemy attack tells.“ ([GDC-Folien](https://media.gdcvault.com/GDC+2021/Melee+AI+in+The+Last+of+Us+Part+II.pdf)). Monster Hunter kündigt auch über längere Zeit an: Fujioka beschreibt Hinweise aus Zuständen „such as alarmed, enraged, exhausted“ ([Nintendo Life](https://nintendolife.com/news/2015/02/monster_hunter_4_ultimate_director_discusses_monster_design_and_animation)). Supergiant wollte die Action von Hades „very readable if a friend is next to you or if you're streaming it“ ([Game Developer](https://www.gamedeveloper.com/design/supergiant-s-fourth-outing-i-hades-i-introduces-a-more-mature-organized-dev-process)).

  ### Bedrohungen außerhalb des Bildes

  Die Kamera von God of War steht nah hinter Kratos. Gegner verschwinden aus dem Bild, und einer davon kann jederzeit aggressiv werden. Das Team ließ zuerst den Bildrand auf der Seite des Gegners blinken. Spieler hielten das für Schadensanzeigen. Am Ende kreisen Pfeile um Kratos und zeigen auf die Gegner: rot für einen kommenden Angriff, dezent weiß für wartende Gegner in der Nähe, lila für Fernkampf ([Folien mit Notizen](https://media.gdcvault.com/gdc2019/presentations/Sheth_Mihir_EvolvingCombat.pdf)). Dazu kam eine Regel für die Positionierung: Ein Gegner außerhalb des Bildes, der aggressiv wird, „should NOT be forced on screen again until you looked at it“, und er bleibt in seinem Quadranten relativ zu Kratos. So bauen Spieler eine Vorstellung davon auf, wo wer steht.

  In der Draufsicht mit 320 × 180 Pixeln sieht die Kamera mehr, aber nicht alles. Ein Fernkämpfer außerhalb des Bildes stellt dieselbe Frage: Wie erfährt der Spieler, dass gleich etwas kommt?

  > [!PRAXIS] Positionierung kam spät
  > Laut Sheth hat das Team die Positionierung der Gegner erst „during the last few months during intense playtesting“ noch einmal grundlegend untersucht. Gegnerverhalten wird in Playtests fertig, nicht auf dem Papier. Plane deshalb Zeit für Runden ein, in denen du nur beobachtest, wann Tester einen Angriff übersehen.

  ## Muster statt Zufall

  Für das rundenbasierte Monster Hunter Stories 2 hat Capcom zufälliges Gegnerverhalten durch Muster ersetzt. Das Zufallselement „was not popular among players“; jedes Monster bekommt jetzt ein Verhaltensmuster, das Spielern erlaubt, Angriffe „to more easily predict and counter“ ([Siliconera](https://www.siliconera.com/monster-hunter-stories-2-monster-behavior/)). Dort geht es um das Vorhersagen der Reihenfolge, denn in einem Rundenkampf wählt man vor dem Angriff. In einem Actionspiel kommt etwas Zweites dazu: einen Angriff an seiner Ankündigung erkennen. Ein Muster macht die Reihenfolge lernbar; eine gleichbleibende Ankündigung macht den einzelnen Angriff lesbar, auch wenn die Reihenfolge zufällig ist.

  Der Trainingsgegner der Testszene spielt seine Liste `attacks` der Reihe nach ab und fängt danach von vorn an. Ein gemessener Lauf mit zwei Angriffen, A (Wind-up 20, aktiv 4, Erholung 30) und B (Wind-up 30, aktiv 6, Erholung 20), Pause jeweils 60 Frames, alles Platzhalter:

  ```text
      60  Dummy WAIT -> TELEGRAPH
      80  Dummy TELEGRAPH -> ACTIVE
      84  Dummy ACTIVE -> RECOVERY
     114  Dummy RECOVERY -> WAIT
     174  Dummy WAIT -> TELEGRAPH
     204  Dummy TELEGRAPH -> ACTIVE
     210  Dummy ACTIVE -> RECOVERY
     230  Dummy RECOVERY -> WAIT
     290  Dummy WAIT -> TELEGRAPH
  ```

  Ein Durchlauf von A und B dauert 230 Frames, knapp vier Sekunden. Nach Frame 290 beginnt er von vorn. Wer das Muster kennt, weiß nach A, dass B kommt, und weiß, dass B zehn Frames länger angekündigt wird.

  Variation ohne Lesbarkeit zu verlieren heißt: Die Reihenfolge darf wechseln, der Tell eines Angriffs nicht. Gleicher Angriff, gleiche Ankündigung. Für Silksong hat Team Cherry geändert, wie Bosse ihre Angriffe wählen: „we reworked how the bosses pick their attacks“. Sie entscheiden zuerst, was sie tun wollen, „and then move into the correct position to do it“; in Hollow Knight richteten sie sich laut dem Bericht stärker nach der Position des Spielers ([Military.com](https://www.military.com/off-duty/games/silksong-devs-explain-how-bosses-were-designed-differently-those-hollow-knight.html)). Bei Enter the Gungeon experimentierte David Rubel mit Kugelmustern, zu denen das ganze Team Rückmeldung gab ([Game Developer](https://www.gamedeveloper.com/design/q-a-the-guns-and-dungeons-of-i-enter-the-gungeon-i-)).

  Zum Weiterdenken: der Clip [What Makes Good AI?](https://www.youtube.com/watch?v=9bbhJi0NBkk) von Game Maker's Toolkit. Achte darauf, welche Gegnerentscheidungen du als Spieler vorhersagen könntest.

  ## Tuning nach Playtests: Beispiele aus den Hades-Patchnotes

  Supergiant hat Hades im Early Access veröffentlicht und Änderungen an Gegnern in Patchnotes dokumentiert. Das Big Bad Update von 2019 enthält Zeilen, die direkt auf Telegraph und Erholung zielen ([Patchnotes](https://www.supergiantgames.com/blog/hades-big-bad-update-patch-notes/)):

  - Patch 025: „Thanatos: reduced frequency of his area attack; also increased preattack duration and recovery time“
  - Patch 026: „Foes in Temple of Styx mini-chambers take slightly longer to attack when you first enter“
  - Patch 026, Endboss: „reduced blast speed of shockwave attack; reduced tracking of homing attack“
  - Patch 026: „Snakestone: increased damage, increased tracking speed“, Patch 027: „Snakestone: reduced tracking speed (it is still greater than before the last change)“

  Übersetzt in die Testszene:

  | Patchnote | Größe | Feld |
  | --- | --- | --- |
  | preattack duration | Wind-up | `windup` |
  | recovery time | Erholung | `recovery` |
  | longer to attack when you first enter | erste Pause | `wait_frames` |
  | tracking | Zielverfolgung | fehlt |

  Längere Vorbereitung heißt mehr Zeit zum Lesen. Längere Erholung heißt ein breiteres Punish-Fenster. Zielverfolgung, also wie stark ein Angriff dem Spieler nachdreht, kennt der Trainingsgegner nicht. Dafür bräuchte er ein neues Feld. Naughty Dog führt „Target tracking“ als eigenes Ereignis in den Angriffsdaten. Die Snakestone-Zeilen zeigen außerdem, wie Tuning läuft: ein Schritt hoch, ein kleinerer zurück, weiterhin über dem Ausgangswert.

  > [!INTERVIEW] Designtest: „Drei Gegner treffen gleichzeitig, das fühlt sich unfair an“
  > Gute Antwort: erst messen, wie oft sich Angriffe überlagern und ob jeder davon einen sichtbaren Tell hatte. Dann trennen: Fehlt eine Absprache, wer angreifen darf, oder fehlt ein Signal für Angriffe außerhalb des Bildes? Für das erste nennst du Tokens oder eine Obergrenze wie `simultaneousAttackers`, für das zweite die Pfeile aus God of War. Erst danach wählst du eine Größe, änderst sie und testest wieder. Ein fester Wert ohne Test ist keine Antwort.

  ## Häufige Fehler

  - **Zufällige Reihenfolge mit uneinheitlichen Ankündigungen.** Dann lässt sich weder die Reihenfolge noch der einzelne Angriff lernen. Zufall in der Reihenfolge bleibt lesbar, solange jeder Angriff seinen eigenen, gleichbleibenden Tell hat.
  - **Ein Tell für verschiedene Angriffe.** Sieht die Ankündigung gleich aus, kann der Spieler nicht wählen, wie er reagiert.
  - **Überlagerungen nicht testen.** Greifen Gegner ohne Absprache an, treffen ihre Angriffe irgendwann im selben Frame. Ob das zum Spiel gehört, wie im „dangerous“-Stil, oder ob ein Token-System es verhindert, entscheidest du; testen solltest du es mit mehreren Gegnern gleichzeitig.
  - **Signale, die etwas anderes bedeuten.** Blinkende Bildschirmränder hielten Tester bei God of War für Schaden.
  - **Gegner, die ins Bild springen.** Ein Gegner, der außerhalb des Bildes aggressiv wird und plötzlich vor dem Spieler steht, zerstört seine Vorstellung vom Kampf.
  - **Zielverfolgung bis zum Treffer.** Dreht ein Angriff bis in die aktive Phase nach, nützt frühes Ausweichen wenig. Für den Endboss von Hades nahm Supergiant die Zielverfolgung eines Angriffs zurück („reduced tracking of homing attack“).
  - **Tell und Erholung zugleich ändern.** Dann weißt du nicht, ob der Gegner leichter wurde, weil man ihn besser liest oder weil er länger offen steht.

  ## Zusammenfassung

  - Eine Rolle ist eine Frage an den Spieler, und jede Frage hängt an einer messbaren Größe.
  - God of War vergibt Aggressions-Tokens aus einem festen Vorrat; wer keine bekommt, wartet hinten wie im Kung-Fu-Film.
  - DOOM (2016) vergibt Tokens laut Analyse je Angriffsart; Battle Circle begrenzt die gleichzeitigen Angreifer.
  - Telegraph-Kanäle beantworten verschiedene Fragen: Pose wer und wann, Blinken jetzt, Bodenmarkierung wo, Ton auch ohne Blick.
  - Längere und deutlichere Tells machen Reaktion erst möglich (The Last of Us Part II).
  - Muster sind lernbar, Zufall nicht. Variation wechselt die Reihenfolge, nicht den Tell.
  - Bedrohungen außerhalb des Bildes brauchen eindeutige Signale und Gegner, die nicht ins Bild springen.
  - Echte Patchnotes zeigen Tuning in Größen: Vorbereitung, Erholung, erste Pause, Zielverfolgung.
exercises:
  - id: aggression-tokens
    type: choice
    title: Wer darf angreifen?
    prompt: |
      Welche Aussagen zum Aggressions-System von God of War (2018) stimmen laut dem GDC-Vortrag von Mihir Sheth?
    options:
      - text: Die Gegner werden nach einem Aggressions-Wert sortiert und bekommen Tokens aus einem festen Vorrat.
        correct: true
        why: Der Vorrat wird der Reihe nach verteilt. Ist er leer, sind die übrigen Gegner nicht aggressiv.
      - text: Ein Gegnertyp kann mehrere Tokens belegen, um Größe oder Bedeutung zu zeigen.
        correct: true
        why: So steht es in den Notizen, „to signify size or importance“.
      - text: Ein aggressiver Gegner außerhalb des Bildes läuft sofort ins Bild, damit der Spieler ihn sieht.
        correct: false
        why: Das Gegenteil. Er soll nicht ins Bild gezwungen werden, bis der Spieler hinsieht, und bleibt in seinem Quadranten.
      - text: Die Token-Werte sind für alle Schwierigkeitsgrade gleich.
        correct: false
        why: Die Werte ändern sich je Schwierigkeit, um die Aggression insgesamt zu erhöhen oder zu senken.
    explanation: |
      Das System trennt zwei Fragen: Wer ist gerade gefährlich, und wo stehen die anderen? Tokens begrenzen den Druck, den der Spieler gleichzeitig aushalten muss, und die Größe eines Gegners steckt in der Zahl seiner Tokens. Der Schwierigkeitsgrad dreht an denselben Zahlen. Die Positionsregeln für Gegner außerhalb des Bildes gehören dazu, damit der Spieler weiß, wo die wartenden Gegner stehen.
    resources:
      - title: Evolving Combat in God of War for a New Perspective (Folien mit Notizen)
        url: https://media.gdcvault.com/gdc2019/presentations/Sheth_Mihir_EvolvingCombat.pdf

  - id: kanaele-fragen
    type: choice
    title: Welcher Kanal sagt was?
    prompt: |
      Welche Aussagen über Telegraph-Kanäle stimmen?
    options:
      - text: Eine Bodenmarkierung zeigt Ort und Größe der Fläche, die getroffen wird.
        correct: true
        why: Das kann keine Pose so genau. Deshalb nutzt die Testszene eine gelbe Fläche.
      - text: Ein Ton kann einen Angriff ankündigen, den die Kamera gerade nicht zeigt.
        correct: true
        why: Ein Geräusch braucht keinen Blickkontakt. Für Bedrohungen außerhalb des Bildes ist das ein eigener Kanal.
      - text: Blinkende Bildschirmränder zeigen eindeutig, dass außerhalb des Bildes ein Gegner angreift.
        correct: false
        why: Tester von God of War hielten sie für Schadensanzeigen. Das Team ersetzte sie durch Pfeile um Kratos.
      - text: Je kürzer ein Telegraph, desto besser lässt er sich lesen.
        correct: false
        why: Naughty Dog hat die Tells für The Last of Us Part II verlängert, damit Spieler ausweichen können.
    explanation: |
      Jeder Kanal beantwortet eine Frage: Pose wer und wann, Blinken jetzt, Bodenmarkierung wo und wie groß, Ton auch ohne Blick. Ein Signal muss außerdem eindeutig sein. Ein Bildschirmrand, der beim Treffer und bei einem Angriff von hinten gleich blinkt, sagt beides nicht.
    resources:
      - title: Melee AI in The Last of Us Part II (GDC 2021, Folien)
        url: https://media.gdcvault.com/GDC+2021/Melee+AI+in+The+Last+of+Us+Part+II.pdf

  - id: gegner-zyklus
    type: order
    title: Ein Zyklus des Trainingsgegners
    prompt: |
      Bring die Zustände des Trainingsgegners in die Reihenfolge, in der sie für Angriff A ablaufen, beginnend mit der Pause vor A.
    lang: prose
    lines: |
      WAIT: Pause vor Angriff A
      TELEGRAPH: gelbe Fläche sichtbar
      ACTIVE: Hitbox an, Fläche aus
      RECOVERY: Hitbox aus, Gegner offen
      pattern_index rückt weiter
      WAIT: Pause vor Angriff B
    explanation: |
      Die Fläche ist genau im Zustand `TELEGRAPH` sichtbar, die Hitbox genau in `ACTIVE`. Beim Verlassen von `RECOVERY` rückt `pattern_index` eins weiter, deshalb gilt die nächste Pause schon für den nächsten Angriff der Liste. Am Ende der Liste fängt das Muster mit dem Rest der Division wieder bei null an.
    resources:
      - title: Godot Docs · Arrays (GDScript)
        url: https://docs.godotengine.org/en/stable/classes/class_array.html

  - id: token-vorrat
    type: output
    title: Der Vorrat ist leer
    prompt: |
      Ein Token-System wie in God of War, Zahlen erfunden. Die Gegner stehen schon nach ihrem Aggressions-Wert sortiert. Wie viele sind aggressiv? Antworte mit der Zahl.
    lang: text
    code: |
      Vorrat: 14 Tokens
      Gegner A  belegt 6
      Gegner B  belegt 5
      Gegner C  belegt 3
      Gegner D  belegt 2
    expected: |
      3
    accept: ["3 Gegner", "drei"]
    explanation: |
      A, B und C belegen 6 + 5 + 3 = 14 Tokens. Der Vorrat ist leer, D bekommt keins und wartet hinten. Dass D am wenigsten Tokens bräuchte, hilft ihm nicht: Verteilt wird nach dem Aggressions-Wert, nicht nach Größe. Die 14 stammen aus dem Beispiel der GDC-Folien, die Zahlen je Gegner sind erfunden.
    resources:
      - title: Evolving Combat in God of War for a New Perspective (Folien mit Notizen)
        url: https://media.gdcvault.com/gdc2019/presentations/Sheth_Mihir_EvolvingCombat.pdf

  - id: naechster-telegraph
    type: output
    title: Wann kommt der nächste Telegraph?
    prompt: |
      Muster aus der Lektion: A (Wind-up 20, aktiv 4, Erholung 30), dann B (Wind-up 30, aktiv 6, Erholung 20), Pause jeweils 60. In Frame 290 beginnt A von vorn. In welchem Frame steht das nächste `WAIT -> TELEGRAPH`? Antworte mit der Zahl.
    lang: text
    code: |
      290  Dummy WAIT -> TELEGRAPH
      310  Dummy TELEGRAPH -> ACTIVE
      ???  Dummy ACTIVE -> RECOVERY
      ???  Dummy RECOVERY -> WAIT
      ???  Dummy WAIT -> TELEGRAPH
    expected: |
      404
    accept: ["Frame 404"]
    hints:
      - Erst die aktive Phase und die Erholung von A, dann die Pause.
    explanation: |
      A ist ab 310 aktiv, 4 Frames, also `RECOVERY` ab 314. Nach 30 Frames Erholung kommt `WAIT` in 344, nach 60 Frames Pause der Telegraph von B in 404. Das sind 290 + 20 + 4 + 30 + 60. Im gemessenen Lauf steht genau diese Zeile. Ohne Treffer gibt es keinen Hitstop, deshalb gehen die Zahlen glatt auf.

  - id: flaeche-in-ms
    type: output
    title: Wie lange ist die Fläche zu sehen?
    prompt: |
      Lies aus dem Log ab, wie lange die gelbe Fläche von Angriff B sichtbar ist, und rechne in Millisekunden um. Antworte mit der Zahl.
    lang: text
    code: |
      174  Dummy WAIT -> TELEGRAPH
      204  Dummy TELEGRAPH -> ACTIVE
    expected: |
      500
    accept: ["500 ms"]
    explanation: |
      Die Fläche ist in den Frames 174 bis 203 sichtbar, 30 Frames. ms = Frames × 1000 / 60, also 500 ms. Ob das lang genug ist, beantwortet die Rechnung nicht. Sie sagt dir nur, worüber du sprichst, wenn ein Tester „zu kurz“ sagt.

  - id: muster-code
    type: gap
    title: Muster und Fläche im Code
    prompt: |
      Ergänze `_enter()` des Trainingsgegners: Nach der Erholung kommt der nächste Angriff der Liste dran, am Ende wieder der erste. Die gelbe Fläche ist genau im Telegraph sichtbar.
    lang: gdscript
    code: |
      if state == State.RECOVERY:
      	pattern_index = (pattern_index + 1) % ⟦attacks.size()⟧
      state = new_state
      frame = 1
      telegraph.visible = ⟦new_state == State.TELEGRAPH⟧
    gaps:
      - label: Anzahl der Angriffe
        hint: Die Methode eines `Array`, die seine Länge liefert.
        accept: ["len(attacks)"]
      - label: Wann ist die Fläche sichtbar?
        hint: Vergleich des neuen Zustands.
        accept: ["State.TELEGRAPH == new_state", "(new_state == State.TELEGRAPH)"]
    explanation: |
      Der Rest der Division hält `pattern_index` zwischen 0 und der Zahl der Angriffe minus eins: Nach dem letzten Angriff kommt wieder der erste. Die Sichtbarkeit hängt direkt am Zustand, deshalb kann die Fläche nicht versehentlich stehen bleiben. Da jeder Wechsel durch `_enter()` läuft, ändern sich Muster und Fläche nur an dieser einen Stelle.
    resources:
      - title: Godot Docs · Array.size()
        url: https://docs.godotengine.org/en/stable/classes/class_array.html#class-array-method-size

  - id: patchnote-zu-feld
    type: gap
    title: Patchnotes in Feldnamen
    prompt: |
      Drei Änderungen aus den Hades-Patchnotes: „increased preattack duration“, „increased recovery time“ und „take slightly longer to attack when you first enter“. Ordne jeder das Feld der Testszene zu, das du dafür ändern würdest. Trag den Feldnamen ein, so wie er im Code steht.
    lang: text
    code: |
      Vorbereitung -> ⟦windup⟧
      Erholung -> ⟦recovery⟧
      Pause beim Betreten -> ⟦wait_frames⟧
    gaps:
      - label: Vorbereitung vor dem Angriff
        hint: Feld in `AttackData`, beim Gegner gleich der Dauer der gelben Fläche.
      - label: Zeit nach dem Angriff
        hint: Feld in `AttackData`.
      - label: Pause vor dem Angriff
        hint: Feld des Gegners, nicht des Angriffs.
    explanation: |
      `windup` ist beim Trainingsgegner zugleich die Dauer der gelben Fläche. `recovery` bestimmt, wie lange er offen steht. Die Pause vor einem Angriff ist `wait_frames`. Supergiant hat sie nur für den ersten Angriff nach dem Betreten verlängert; die Testszene kennt diese Unterscheidung nicht, du bräuchtest dafür ein eigenes Feld.
    resources:
      - title: Hades · The Big Bad Update Patch Notes
        url: https://www.supergiantgames.com/blog/hades-big-bad-update-patch-notes/

  - id: zeitleiste-gegner
    type: bug
    title: Eine Erholung zu kurz
    prompt: |
      Du schreibst die Zeitleiste von Angriff A auf (Wind-up 20, aktiv 4, Erholung 30, Pause 60). Eine Zeile passt nicht zu den Werten. Tippe sie an und korrigiere sie.
    lang: text
    code: |
      60  WAIT -> TELEGRAPH
      80  TELEGRAPH -> ACTIVE
      84  ACTIVE -> RECOVERY
      104  RECOVERY -> WAIT
      174  WAIT -> TELEGRAPH
    lines: [4]
    fix:
      - line: 4
        answers: ["114  RECOVERY -> WAIT", "114 RECOVERY -> WAIT"]
    explanation: |
      Die Erholung beginnt in Frame 84 und dauert 30 Frames, 84 bis 113. In Frame 114 steht `RECOVERY -> WAIT`. 104 wären 20 Frames, die Erholung von B. Die letzte Zeile ist richtig: 114 + 60 = 174, so steht es im gemessenen Log.

  - id: flaeche-zu-spaet
    type: bug
    title: Die Fläche kommt mit dem Treffer
    prompt: |
      Nach einer Änderung erscheint die gelbe Fläche erst, wenn der Angriff schon trifft, und verschwindet nach 4 Frames wieder. Finde die Zeile und korrigiere sie.
    lang: gdscript
    code: |
      func _enter(new_state: State) -> void:
      	state = new_state
      	frame = 1
      	telegraph.visible = new_state == State.ACTIVE
    lines: [4]
    fix:
      - line: 4
        answers: ["telegraph.visible = new_state == State.TELEGRAPH", "telegraph.visible = State.TELEGRAPH == new_state"]
    explanation: |
      Die Fläche hängt hier am falschen Zustand. Sie ist nur sichtbar, solange die Hitbox an ist, also genau dann, wenn es zu spät ist. Ein Telegraph muss vor der aktiven Phase kommen. Mit `State.TELEGRAPH` ist die Fläche so lange zu sehen wie `windup` des aktuellen Angriffs.
    resources:
      - title: Godot Docs · CanvasItem.visible
        url: https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#class-canvasitem-property-visible

  - id: pfeile-statt-raender
    type: explain
    title: Pfeile statt blinkender Ränder
    prompt: |
      Erkläre in wenigen Sätzen, warum God of War blinkende Bildschirmränder durch Pfeile um Kratos ersetzt hat und warum Gegner außerhalb des Bildes nicht ins Bild gezwungen werden.
    lang: text
    code: |
      rot   Angriff kommt
      weiß  Gegner wartet in der Nähe
      lila  Fernkampf
    points:
      - Tester hielten die blinkenden Ränder für Schadensanzeigen; das Signal war nicht eindeutig.
      - Pfeile um Kratos zeigen Richtung und Art der Bedrohung, mit Farben für Angriff, Warten und Fernkampf.
      - Die weißen Pfeile sind bewusst dezent, damit sie Spieler nicht ablenken, die sie nicht nutzen.
      - Ein aggressiver Gegner bleibt außerhalb des Bildes und in seinem Quadranten, bis der Spieler hinsieht; so behält der Spieler seine Vorstellung vom Kampf.
    explanation: |
      Ein Signal für eine Bedrohung außerhalb des Bildes muss zwei Dinge sagen: dass etwas kommt und woher. Ein blinkender Rand sagte für Tester „du wurdest getroffen“. Pfeile, die auf den Gegner zeigen, sagen Richtung und mit der Farbe auch die Art. Die Positionsregeln sorgen dafür, dass die Pfeile stabil bleiben: Wer hinten links war, bleibt hinten links, bis der Spieler hinsieht. Laut Sheth half das Spielern, eine Vorstellung vom Kampf aufzubauen und mutiger anzugreifen.
    resources:
      - title: Evolving Combat in God of War for a New Perspective (Folien mit Notizen)
        url: https://media.gdcvault.com/gdc2019/presentations/Sheth_Mihir_EvolvingCombat.pdf

  - id: clip-god-of-war
    type: practice
    title: "Clip-Analyse: der Kung-Fu-Kreis"
    prompt: |
      Sieh dir den GDC-Vortrag [Evolving Combat in God of War for a New Perspective](https://www.youtube.com/watch?v=hE5tWF-Ou2k) von Mihir Sheth an, ganz oder in Teilen. Achte auf drei Themen: wer angreifen darf (Aggression und Tokens), wo die anderen Gegner stehen (Positionierung) und wie das Spiel Gegner außerhalb des Bildes anzeigt. Notiere zu jedem Thema:

      - was das Problem war,
      - was das Team ausprobiert hat,
      - und eine Frage, die sich daraus für ein Spiel in der Draufsicht ergibt.
    lang: text
    solution: |
      Beispiel für die Form, nicht für den Inhalt:

      Thema: Gegner außerhalb des Bildes
      Problem: Spieler wissen nicht, wer von hinten kommt.
      Versuch: blinkende Ränder, als Schaden gelesen;
               dann Pfeile um die Figur.
      Frage für die Draufsicht: Welche Gegner können bei
      320 × 180 außerhalb des Bildes stehen, und woran
      merkt der Spieler, dass einer angreift?
    checklist:
      - Zu jedem der drei Themen steht ein Problem, ein Versuch und eine Frage.
      - Mindestens eine Notiz nennt etwas, das nicht funktioniert hat.
      - Jede Frage ist eine Frage, keine Lösung für dein Spiel.
      - Du hast notiert, an welcher Stelle im Vortrag du etwas gesehen hast, mit der Zeit aus deinem Player.
    explanation: |
      GDC-Vorträge zeigen selten nur das Ergebnis. Die verworfenen Versuche sind oft lehrreicher, weil sie zeigen, wie Spieler ein Signal tatsächlich lesen. Die Fragen für die Draufsicht sind dein Material für eigene Entscheidungen; die Antworten findest du am PC in [Testszene: Ausweichen und Trainingsgegner](/combat/testszene-ausweichen).
    resources:
      - title: GDC · Evolving Combat in God of War for a New Perspective (YouTube)
        url: https://www.youtube.com/watch?v=hE5tWF-Ou2k

  - id: muster-notiz
    type: practice
    title: Ein Muster für den Trainingsgegner
    prompt: |
      Entwirf ein Muster aus drei Angriffen für den neutralen Trainingsgegner der Testszene, als Notiz. Für jeden Angriff notierst du `windup`, `active` und `recovery` als Platzhalter und die Form der gelben Fläche. Schreib **vorher** auf, was ein Spieler nach zwei Durchläufen vorhersagen können soll und woran er jeden Angriff erkennt. Werte gibt dir niemand vor.
    lang: text
    solution: |
      Beispiel für die Form. Die Werte sind willkürlich,
      sie sind kein Vorschlag:

      Muster: A, A, B
      A  windup 20, active 4, recovery 30
         Fläche: Rechteck vor dem Gegner
      B  windup 30, active 6, recovery 20
         Fläche: Kreis um den Gegner
      wait_frames 60

      Vorhersage nach zwei Durchläufen:
      „Nach dem zweiten A kommt der Kreis.“
      Erkennen: Rechteck oder Kreis, Form genügt.
      Prüfen am PC: Log mit Frame-Nummern, ein Tester,
      der das Muster nicht kennt.
    checklist:
      - Jeder Angriff hat `windup`, `active`, `recovery` und eine beschriebene Fläche.
      - Die Vorhersage stand fest, bevor du die Werte eingetragen hast.
      - Jeder Angriff ist an etwas anderem erkennbar als die anderen.
      - Du hast notiert, wie du am PC prüfst, ob die Vorhersage stimmt.
    explanation: |
      Ein Muster ist eine Behauptung darüber, was ein Spieler lernen kann. Wer sie vorher aufschreibt, kann sie im Test prüfen. Die Übung ist Entwurfsarbeit am neutralen Trainingsgegner; die Werte sind deine Platzhalter. Am PC trägst du das Muster als Liste von `AttackData` ein und vergleichst Log und Eindruck in [Testszene: Ausweichen und Trainingsgegner](/combat/testszene-ausweichen).
    resources:
      - title: Siliconera · Monster Hunter Stories 2 Monster Behavior
        url: https://www.siliconera.com/monster-hunter-stories-2-monster-behavior/
