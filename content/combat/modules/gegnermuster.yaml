id: gegnermuster
title: Gegnermuster und Telegraphing
level: 2
minutes: 110
summary: Wofür ein Gegner im Kampf da ist, wer wann angreifen darf, über welche Kanäle sich ein Angriff ankündigt und warum Muster besser lesbar sind als Zufall – an God of War, Monster Hunter, Hades und dem Trainingsgegner der Testszene.
place: unterwegs
goals:
  - Du beschreibst die Rolle eines Gegners als Frage an den Spieler und ordnest ihr messbare Größen zu.
  - Du erklärst Aggressions-Tokens und den Kung-Fu-Kreis aus God of War und rechnest aus, wer aggressiv wird.
  - Du unterscheidest Telegraph-Kanäle (Pose, Blinken, Bodenmarkierung, Ton) und sagst, welche Frage jeder beantwortet.
  - Du liest das Muster eines Gegners aus einem Log und sagst vorher, wann der nächste Angriff angekündigt wird.
  - Du übersetzt echte Tuning-Änderungen aus Patchnotes in Felder der Testszene.
