id: frust-diagnose
title: Schwer, unfair oder kaputt? Treffer nachvollziehen
level: 2
minutes: 100
summary: Fühlt sich ein Treffer falsch an, hat das eine von drei Ursachen – der Kampf ist schwer, der Angriff war nicht lesbar, oder der Code tut etwas anderes als gedacht. Du trennst sie mit Reaktionszeit, Log und Einzelbild, bevor du einen Wert änderst.
place: unterwegs
goals:
  - Du ordnest einen unerwarteten Treffer einer von drei Ursachen zu – Schwierigkeit, mangelnde Lesbarkeit oder technischer Fehler – und begründest die Zuordnung am Log.
  - Du rechnest einen Telegraph in Millisekunden um und vergleichst ihn mit gemessenen Reaktionszeiten.
  - Du gehst einen Treffer mit vier Fragen und den Werkzeugen der Testszene Frame für Frame durch.
  - Du erkennst in einem Log die Zeile, die einen technischen Fehler zeigt.
  - Du beschreibst, wie veröffentlichte Spiele die Schwierigkeit anpassen, und prüfst, was das für die Lesbarkeit bedeutet.
resources:
  - title: Game Informer · Hidetaka Miyazaki über Schwierigkeit (2024)
    url: https://gameinformer.com/interview/2024/06/24/from-softwares-hidetaka-miyazaki-discusses-the-studios-approach-to-difficulty
  - title: Woods et al. · Factors influencing the latency of simple reaction time (2015)
    url: https://www.frontiersin.org/journals/human-neuroscience/articles/10.3389/fnhum.2015.00131/full
  - title: Mike Ambinder · Valve's Approach to Playtesting (GDC 2009, PDF)
    url: https://cdn.fastly.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf
  - title: Theodore Fishman · The lethality contract in Ghost of Tsushima (PlayStation Blog)
    url: https://blog.playstation.com/?p=344024
  - title: Godot Docs · Overview of debugging tools
    url: https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html
lesson: |
  Drei Treffer, derselbe Satz: „Ich bin doch ausgewichen!“ Im ersten Fall steht im Log der Testszene `Druck dodge` in Frame 22. Die Figur wich auf der Stelle aus, ihre i-Frames liefen bis Frame 33. Die Hitbox des Gegners ging in Frame 30 an und blieb 20 Frames aktiv, also kam der Treffer in Frame 35, gleich nach den i-Frames. Das Ausweichen kam zu früh. Im zweiten Fall kam der Angriff von einem Gegner außerhalb des Bildes. Im dritten traf eine Hitbox an einer Stelle, an der das Bild nichts zeigte. Der erste Fall ist ein echter Lauf, die anderen beiden sind ausgedacht.

  Alle drei fühlen sich gleich an und brauchen verschiedene Antworten: üben, die Ankündigung ändern, den Code reparieren. Dieses Modul trennt die drei Ursachen und zeigt, wie du einen Treffer Frame für Frame nachvollziehst. Ob ein Kampf danach schwerer oder leichter werden soll, entscheidest du.

  ## Drei Ursachen: schwer, unlesbar, kaputt

  | Ursache | Woran du sie erkennst | Was hilft |
  | --- | --- | --- |
  | schwer | lesbar, Druck zu spät oder falsch | üben |
  | unlesbar | Ankündigung fehlt, zu kurz, verdeckt | Telegraph, Kamera |
  | kaputt | Log oder Bild widerspricht dem Code | Fehler beheben |

  „Unfair“ meint fast immer die zweite oder dritte Zeile. Schwer und fair schließen sich nicht aus. Hidetaka Miyazaki sagt für FromSoftware: „We believe in difficult games, but not games that are unjustly or unfairly so.“ Tode sollen sich „justified“ anfühlen ([Game Informer, 2024](https://gameinformer.com/interview/2024/06/24/from-softwares-hidetaka-miyazaki-discusses-the-studios-approach-to-difficulty)). Bei Furi war „fair“ laut The Game Bakers ein tägliches Schlagwort: „if they got hit, it was because they did a mistake“ ([GOG-Interview](https://gog.com/news/gog_interview_the_game_bakers_and_furis_success)). Mark Foster schreibt über die Bosse von Titan Souls, die Kämpfe seien „primarily meant to be predictable once the player understands them“ ([Game Developer](https://www.gamedeveloper.com/design/game-design-deep-dive-one-hit-kills-in-i-titan-souls-i-)). Für das rundenbasierte Monster Hunter Stories 2 ersetzte Capcom zufälliges Verhalten der Monster, das „was not popular among players“, durch Muster, die Spieler „predict and counter“ können ([Siliconera](https://www.siliconera.com/monster-hunter-stories-2-monster-behavior/)).

  Schwer heißt in diesem Sinn: Der Spieler kann sehen, was kommt, und lernen, was er tun muss. Ein Treffer sagt ihm dann etwas über seinen Fehler. Wie schwer dein Kampf sein soll, entscheidest du. Furi hat mit dem dritten und siebten Boss bewusst Spitzen gesetzt, „made to require perseverance“ ([DualShockers](https://www.dualshockers.com/furi-third-seventh-boss-hard/)).

  > [!MERKE]
  > Erst die Ursache, dann der Wert. Wer einen kaputten Treffer mit einem längeren Telegraph „repariert“, hat danach zwei Probleme: den alten Fehler und einen Wert, den niemand gewählt hat.

  ## Lesbarkeit: Was du nicht siehst, kannst du nicht lernen

  Ein Angriff ist lesbar, wenn der Spieler rechtzeitig sieht oder hört, was kommt und wo. Greg Kasavin nennt für Hades als Ziel, die Action solle „very readable if a friend is next to you or if you're streaming it“ sein ([Game Developer](https://www.gamedeveloper.com/design/supergiant-s-fourth-outing-i-hades-i-introduces-a-more-mature-organized-dev-process)). Vier Stellen, an denen Lesbarkeit scheitert:

  - **Kein oder zu kurzer Telegraph.** Naughty Dog fasst frühere Nahkampfgegner mit „Short enemy attack tells“ und „Enemy starts swinging = certain hit“ zusammen (siehe [Ausweichen, Risiko und Belohnung](/combat/ausweichen)). Wie kurz zu kurz ist, prüfst du mit der Reaktionszeit im nächsten Abschnitt.
  - **Außerhalb des Bildes.** Ein Angriff, dessen Urheber nicht im Bild ist, lässt sich nicht lesen. God of War (2018) zeigt solche Bedrohungen mit Pfeilen um die Figur ([Folien mit Notizen](https://media.gdcvault.com/gdc2019/presentations/Sheth_Mihir_EvolvingCombat.pdf); mehr in [Gegnermuster und Telegraphing](/combat/gegnermuster)).
  - **Vom großen Gegner verdeckt.** In der Draufsicht liegt ein großer Körper über dem Boden und über allem, was hinter ihm steht. Beim großen Trainingsgegner der Testszene ist die Telegraph-Fläche 64 × 40 Pixel groß, der Körper 48 × 48. Läge die Fläche mittig unter dem Körper und würde von ihm verdeckt, schauten links und rechts nur je 8 Pixel hervor (eigene Rechnung). Mehr dazu in [Große Kreaturen als Bosse](/combat/grosse-gegner).
  - **Effekte verdecken Figuren.** Sakurai stellt für Trefferzeichen die Regel auf, dass sie die Figuren nicht verdecken dürfen ([Hit Marks](https://www.youtube.com/watch?v=B-P4ysHSjCg), 1:15 bis 3:46). Dasselbe gilt für Staub, Blitze und Partikel, die über einem Telegraph liegen (siehe [Trefferfeedback](/combat/trefferfeedback)).

  ### Reaktionszeit als Prüfstein

  Die **einfache Reaktionszeit** – ein bekanntes Signal, eine bekannte Taste – lag bei Woods et al. im Mittel bei 231 ms, nach Abzug der Geräteverzögerung bei 213 ms, also 13 bis 14 Frames ([Frontiers in Human Neuroscience](https://www.frontiersin.org/journals/human-neuroscience/articles/10.3389/fnhum.2015.00131/full)). Herleitung und Latenzkette stehen in [Eingabe: Reaktionszeit, Latenz und Puffer](/combat/eingabe). Im Spiel ist die Aufgabe schwerer: Der Spieler muss erkennen, welcher Angriff kommt, und eine Richtung wählen. Dazu kommt die Latenz des Systems, laut Mick West bei 60-fps-Spielen meist 4/60 s ([Game Developer](https://www.gamedeveloper.com/design/measuring-responsiveness-in-video-games)).

  Daraus folgt eine eigene Rechnung, keine Messung: Ist ein Telegraph kürzer als Reaktionszeit plus Latenz, kann der Spieler ihn nicht sehen und beantworten. Er kann ihn nur auswendig lernen, etwa weil er immer an derselben Stelle eines Musters kommt. Mit 14 Frames Reaktion und 4 Frames Latenz bleibt dieser Spielraum:

  | Telegraph | in ms | Spielraum |
  | --- | --- | --- |
  | 12 Frames | 200 | −6 Frames |
  | 20 Frames | 333 | 2 Frames |
  | 40 Frames | 667 | 22 Frames |

  Der Telegraph der Testszene mit 20 Frames lässt nach dieser Rechnung 2 Frames, für jemanden, der genau dieses Signal erwartet. Das Modell zählt den ersten, verwundbaren Frame des Ausweichens nicht mit: In der Testszene muss die Figur den Druck spätestens im letzten Telegraph-Frame sehen, dann bleibt 1 Frame. Ob ein Angriff Reagieren oder Erinnern verlangen soll, ist eine Designfrage. Die Rechnung sagt nur, welche der beiden Fähigkeiten er prüft.

  ## Kaputt: technische Fehler, die wie Unfairness aussehen

  Manche Treffer sind weder schwer noch unlesbar, sondern falsch: Der Code tut etwas anderes, als Bild und Vorgabe versprechen. Die häufigsten Fälle kennst du aus den Testszene-Modulen:

  | Symptom | Ursache |
  | --- | --- |
  | Treffer neben der Waffe | Hitbox sitzt anders als das Bild |
  | Aktion kommt nicht | Druck nie angekommen |
  | Laptop trifft länger | Timing hängt an der Bildrate |
  | Nach i-Frames kein Treffer | Treffer nur abgelehnt |
  | Ein Schlag zählt doppelt | zwei Zonen, kein `already_hit` |
  | Gegner länger aktiv | Hitstop beim Ausweichen |

  **Hitbox und Bild.** Laut Sakurai ist es in Ordnung, wenn eine Hitbox größer ist als die Waffe, ein Unterschied in der Position nicht ([Always Keep Attack Collision in Mind](https://www.youtube.com/watch?v=rwwF_4blK-o), 1:02 bis 1:30). Dasselbe gilt für Telegraph und Hitbox: Ist die gelbe Fläche kleiner als die Hitbox, trifft der Angriff außerhalb seiner Ankündigung.

  **Verlorene Eingabe.** Die Zeile `Druck …` schreibt die Figur in dem Frame, in dem sie den Druck sieht. Fehlt sie, kam der Druck nie an: Input Map, Deadzone, Gerät. Steht sie da und die Aktion kam trotzdem nicht, war der Puffer abgelaufen, oder ein späterer Druck hat ihn überschrieben. Ein Druck aus Frame 32 ist in Frame 41 neun Frames alt und verfällt bei `input_buffer = 6` ([Testszene: Angriff mit Frame-Daten](/combat/testszene-angriff)). Und weil die Testszene sich nur den letzten Druck merkt, verdrängt ein Angriff in Frame 38 ein Ausweichen aus Frame 36: In Frame 41 startet der Angriff, das Ausweichen fällt weg. Beides ist kein Fehler, der Code tut, was er soll. Ob der Puffer länger sein oder mehrere Drücke merken soll, entscheidest du.

  **Bildrate.** In [Godot-Start](/combat/godot-start) ist dieselbe Hitbox bei 30 Bildern pro Sekunde im Modus `Idle` 4 statt 3 Frames aktiv, mit Godot 4.7.2 gemessen. Teste deshalb auch bei gesenkter Bildrate.

  **i-Frames und Zonen.** Lehnt `take_hit()` Treffer während der i-Frames nur ab, trifft ein langer Angriff danach nie, weil `area_entered` nur das Hineinkommen meldet ([Testszene: Ausweichen und Trainingsgegner](/combat/testszene-ausweichen)). Umgekehrt zählt ein Schlag doppelt, wenn er zwei Hurtboxen desselben Gegners berührt und sich nicht merkt, wen er schon getroffen hat.

  **Hitstop beim Ausweichen.** Setzt der Angreifer den Hitstop, bevor er weiß, ob der Treffer zählt, verlängert jedes Ausweichen seine aktive Phase. Im Log steht `ACTIVE -> RECOVERY` dann 4 Frames zu spät, und alle späteren Zeiten des Gegners verschieben sich um diese 4 Frames.

  > [!WARNING] Selten heißt nicht zufällig
  > Ein Fehler, der nur jedes zehnte Mal auftritt, sieht aus wie Pech oder wie eigene Ungeschicklichkeit. Fast immer hängt er an einem bestimmten Frame: Druck im letzten möglichen Frame, Treffer im ersten Frame eines Zustands, Bildrate unter 60. Stell den Fall gezielt nach, bevor du ihn als Schwierigkeit abtust.

  ## Diagnose: vier Fragen an jeden Treffer

  Geh jeden Treffer, der sich falsch anfühlt, mit denselben vier Fragen durch, in dieser Reihenfolge:

  1. **Was habe ich gesehen?** Telegraph, Gegner im Bild, eigene Figur sichtbar? Schreib es auf, bevor du ins Log schaust, sonst liest du hinein, was du erwartest.
  2. **Kam meine Eingabe an?** Zeile `Druck …` mit Frame, und in welchem Zustand die Figur war.
  3. **Wann war die Hitbox an?** `TELEGRAPH -> ACTIVE` und der Treffer einen Frame später. Lag der Druck vor oder nach dem letzten möglichen Frame?
  4. **Stimmte die Fläche?** Im Einzelbild mit sichtbaren Kollisionsformen: Liegt die Hitbox dort, wo Bild und Telegraph sie zeigen?

  Der erste Fall aus dem Einstieg, als echtes Log (Ausweichen auf der Stelle mit `dodge_speed = 0`, Angriff 20 Frames aktiv):

  ```text
      10  Dummy WAIT -> TELEGRAPH
      22  Druck dodge
      22  Spieler MOVE -> DODGE
      23  Spieler i-Frames an (Frame 2 …)
      30  Dummy TELEGRAPH -> ACTIVE
      34  Spieler i-Frames aus (Frame 13 …)
      35  Spieler getroffen in DODGE, Frame 13
  ```

  Gesehen: gelbe Fläche ab Frame 10, 20 Frames lang. Der Druck kam an, in Frame 22. Die Hitbox ging in Frame 30 an und blieb an, als die i-Frames in Frame 34 endeten; der Treffer kam in Frame 35. Die Fläche stimmte, die Figur stand darin. Ergebnis: schwer, zu früh ausgewichen und stehen geblieben. Ob i-Frames einen langen Angriff ganz abdecken sollen, ist eine andere Frage, und die beantwortest du als Designer, nicht als Diagnostiker. Den umgekehrten Fall, einen Frame zu spät, behandelt [Ausweichen, Risiko und Belohnung](/combat/ausweichen).

  Die Werkzeuge dafür hast du am PC:

  - **HitLog** mit Frame-Nummer für jeden Druck, jeden Zustandswechsel und jeden Treffer.
  - **Pause und Einzelbild**: F9 hält das Spiel im Game-Fenster an, F10 rückt einen Frame vor ([Game embedding](https://docs.godotengine.org/en/stable/tutorials/editor/game_embedding.html#frame-advance-f10)).
  - **Sichtbare Collision-Shapes** im Menü *Debuggen* ([Overview of debugging tools](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html#visible-collision-shapes)).
  - **Movie Maker**: `--write-movie` nimmt mit fester Bildrate auf, als PNG wird jedes Bild eine Datei ([Creating movies](https://docs.godotengine.org/en/stable/tutorials/animation/creating_movies.html)). So siehst du einen Lauf später Bild für Bild an.

  Dein eigener Blick reicht nicht. Du kennst jeden Telegraph, also kannst du nicht prüfen, ob jemand ihn beim ersten Mal liest. Mike Ambinder rät für Valve, darauf zu achten, „what people do – not what they say“ ([Valve's Approach to Playtesting, PDF](https://cdn.fastly.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf)). Eduardo Gorinstein, Combat Designer von Hades, sagt: „When I watch people play the game, they approach the fight in different ways“ ([DigiPen](https://digipen.edu/showcase/news/eduardo-gorinstein-delivers-challenge-and-fun-hades)).

  > [!PRAXIS] Keine Durchschnitte
  > Ambinder warnt in denselben Folien: „Averages hide extreme examples.“ Stirbt eine Testerin zehnmal am selben Angriff und alle anderen nie, sagt der Durchschnitt „passt“. Notiere bei Playtests jeden Treffer, über den sich jemand beschwert, mit Uhrzeit oder Frame. Dann findest du ihn in Aufnahme und Log wieder und kannst ihn einer Ursache zuordnen.

  ## Schwierigkeit anpassen, ohne Lesbarkeit zu verlieren

  Ist ein Kampf schwer und lesbar, kann er trotzdem schwerer sein, als du willst. Veröffentlichte Spiele drehen an verschiedenen Stellen:

  - **Ghost of Tsushima.** Tester nannten Gegner „sword sponges“, es fühlte sich an „like I was hitting enemies with a foam bat“. Sucker Punch setzte eine harte Obergrenze für „hits to kill“. Die Schwierigkeitsgrade erhöhen nicht die Lebenspunkte der Gegner, Theodore Fishman nennt andere Hebel: Stagger, Block, Parry, Ausweichen, Angriffsgeschwindigkeit, Schaden ([PlayStation Blog](https://blog.playstation.com/?p=344024)).
  - **Hades.** In den Patchnotes zum „Big Bad Update“ bekam Thanatos „increased preattack duration and recovery time“. Gegner in Mini-Kammern „take slightly longer to attack when you first enter“ ([Supergiant](https://www.supergiantgames.com/blog/hades-big-bad-update-patch-notes/)).
  - **Celeste.** Laut Vice beginnt der Text des Assist Mode mit „Celeste was designed to be a challenging, but accessible game…“. Maddy Thorson sagt: „Assist Mode breaks the game.“ ([Vice](https://www.vice.com/en/article/celeste-difficulty-assist-mode)).
  - **Dynamische Schwierigkeit (DDA).** Das Spiel passt sich selbst an. Ernest Adams hält dagegen, dass sich „many players feel patronized“ und DDA „ruins pacing and obviates good level design“ ([Game Developer](https://www.gamedeveloper.com/design/feature-the-designer-s-notebook-difficulty-modes-and-dynamic-difficulty-adjustment-)).
  - **Dead Cells.** Versteckte Hilfen, laut 80.lv „about 30-40 such small techniques“ ([80.lv](https://80.lv/articles/dead-cells-hidden-tricks-that-make-the-game-feel-fair)). Sébastien Benard zeigt unter anderem ein automatisches Umdrehen zum Gegner hinter dir und eine leichte Zielhilfe. Diese Hilfen hätten „much much more difficult combat“ ermöglicht ([GDC 2019](https://www.youtube.com/watch?v=OfSpBoA6TWw), ab etwa 18:49).

  Jeder Hebel setzt an einer anderen Stelle an: Lebenspunkte, Vorbereitung des Gegners, Hilfen für den Spieler, eine Wahl im Menü. Für die Lesbarkeit zählt, ob der Hebel die Zeit zum Reagieren verändert. Hades' längere Vorbereitung verlängert sie. Ein schnellerer Gegnerangriff verkürzt sie; dann rechnest du den Spielraum aus dem Abschnitt Reaktionszeit neu. Welchen Hebel du nimmst, entscheidest du.

  > [!INTERVIEW]
  > „Ein Tester sagt, der Boss sei unfair. Was machst du?“ Gute Antwort: Frag nicht, ob er recht hat, sondern was passiert ist. Such den Moment in Aufnahme und Log und geh die vier Fragen durch: Was war zu sehen, kam die Eingabe an, wann war die Hitbox an, stimmte die Fläche? Ist es ein technischer Fehler, behebst du ihn zuerst. Ist es Lesbarkeit, änderst du Ankündigung, Kamera oder Effekte. Ist es Schwierigkeit, entscheidet das Team, ob sie gewollt ist, und ändert dann genau einen Wert.

  ## Häufige Fehler

  - **Werte ändern, bevor die Ursache feststeht.** Ein längerer Telegraph verdeckt einen Code-Fehler, statt ihn zu beheben.
  - **Nur dem Gefühl trauen.** „Ich war rechtzeitig“ und „ich war einen Frame zu spät“ fühlen sich gleich an. Das Log unterscheidet sie.
  - **Verlorenen, verfallenen und überschriebenen Druck verwechseln.** Fehlt die Zeile `Druck`, ist es ein Fehler. Steht sie da, ist der Druck verfallen oder von einem späteren verdrängt worden; beides folgt aus den Regeln des Puffers.
  - **Vom Treffer-Frame statt vom Hitbox-Frame rechnen.** Der Treffer steht einen Frame nach `ACTIVE` im Log. Wer von dort zählt, verschiebt jedes Fenster um eins.
  - **Eigene Tests als Lesbarkeitstest werten.** Wer den Angriff gebaut hat, erkennt ihn immer.
  - **Schwierigkeit nur über Lebenspunkte.** Dann werden Gegner zu „sword sponges“.
  - **Gegner schneller machen, ohne nachzurechnen.** Ein kürzerer Telegraph kann unter die Reaktionszeit fallen.

  ## Zusammenfassung

  - Ein Treffer, der sich falsch anfühlt, ist schwer, unlesbar oder kaputt. Jede Ursache braucht eine andere Antwort.
  - Fair heißt: sehen, was kommt, und lernen können, was zu tun ist. Miyazaki, Furi und Titan Souls beschreiben das so.
  - Lesbarkeit scheitert an fehlenden oder kurzen Telegraphs, an Gegnern außerhalb des Bildes, an Verdeckung durch große Körper und an Effekten.
  - Einfache Reaktionszeit: 213 bis 231 ms, also 13 bis 14 Frames, plus Latenz des Systems. Kürzere Telegraphs prüfen Erinnern statt Reagieren (eigene Folgerung).
  - Technische Fehler: Hitbox anders als das Bild, verlorene Eingabe, Timing an der Bildrate, i-Frames, doppelte Treffer, Hitstop beim Ausweichen.
  - Vier Fragen: Was habe ich gesehen? Kam die Eingabe an? Wann war die Hitbox an? Stimmte die Fläche?
  - Beobachte andere: was sie tun, nicht was sie sagen. Durchschnitte verstecken die Ausreißer.
  - Schwierigkeit lässt sich an vielen Stellen anpassen. Prüf bei jedem Hebel, ob er die Zeit zum Reagieren verändert.
exercises:
  - id: fall-zu-spaet
    type: choice
    title: "Fall 1: Druck nach dem Treffer"
    prompt: |
      Beispiel-Log, konstruiert nach der Logik der Testszene. Der Gegner kündigt seinen Angriff mit einer gut sichtbaren gelben Fläche an, die Figur steht darin. Schwer, unlesbar oder kaputt?
    lang: text
    code: |
      10  Gegner WAIT -> TELEGRAPH
      50  Gegner TELEGRAPH -> ACTIVE
      51  Spieler getroffen in MOVE, Frame 44
      53  Druck dodge
    options:
      - text: Schwer – der Telegraph war 40 Frames lang, der Druck kam erst nach dem Treffer.
        correct: true
        why: 40 Frames sind 667 ms, weit über der Reaktionszeit. Der Code tat, was er soll; der Spieler war zu spät.
      - text: Unlesbar – der Telegraph war zu kurz.
        correct: false
        why: 40 Frames lassen nach der Rechnung der Lektion über 20 Frames Spielraum.
      - text: Kaputt – der Druck in Frame 53 ging verloren.
        correct: false
        why: Der Druck steht im Log, also kam er an. Er kam nur nach dem Treffer, als die Figur schon im Hitstun war.
    explanation: |
      Die Hitbox geht in Frame 50 an, der Treffer kommt einen Frame später, wie es sein soll. Der Druck steht im Log, aber zwei Frames nach dem Treffer. Der Telegraph lief 40 Frames, gut sichtbar. Damit bleibt nur eine Ursache: Der Spieler hat zu spät reagiert. Ob 40 Frames für dein Spiel zu lang oder zu kurz sind, ist eine andere Frage.
    resources:
      - title: Woods et al. 2015 · einfache Reaktionszeit
        url: https://www.frontiersin.org/journals/human-neuroscience/articles/10.3389/fnhum.2015.00131/full

  - id: fall-sechs-frames
    type: choice
    title: "Fall 2: schneller als jede Reaktion"
    prompt: |
      Beispiel-Log, konstruiert nach der Logik der Testszene. Der Spieler sieht diesen Angriff zum ersten Mal. Schwer, unlesbar oder kaputt?
    lang: text
    code: |
      10  Gegner WAIT -> TELEGRAPH
      16  Gegner TELEGRAPH -> ACTIVE
      17  Spieler getroffen in MOVE, Frame 17
      22  Druck dodge
    options:
      - text: Unlesbar – 6 Frames Telegraph sind kürzer als die Reaktionszeit.
        correct: true
        why: 6 Frames sind 100 ms. Die einfache Reaktionszeit liegt bei 213 bis 231 ms, ohne Latenz und ohne Entscheidung.
      - text: Schwer – der Spieler hat 12 Frames gebraucht und war zu langsam.
        correct: false
        why: 12 Frames sind 200 ms. So schnell war bei Woods et al. im Mittel nur die jüngste Gruppe, und auch sie bräuchte doppelt so lang wie die 6 Frames.
      - text: Kaputt – der Treffer kam einen Frame nach ACTIVE.
        correct: false
        why: Genau so soll es sein. Godot meldet die Überlappung einen Frame nach dem Einschalten der Hitbox.
    explanation: |
      Der Druck kam 12 Frames nach dem Beginn des Telegraphs, also schneller als die gemessene einfache Reaktionszeit, und trotzdem zu spät. Auf diesen Angriff kann beim ersten Mal niemand reagieren. Lernen kann man ihn nur, wenn er vorhersagbar kommt, etwa immer an derselben Stelle eines Musters. Ob er das soll, entscheidest du; als Lesbarkeitsproblem beim ersten Kontakt ist er eindeutig.
    resources:
      - title: Woods et al. 2015 · einfache Reaktionszeit
        url: https://www.frontiersin.org/journals/human-neuroscience/articles/10.3389/fnhum.2015.00131/full

  - id: fall-nach-active
    type: choice
    title: "Fall 3: Treffer in der Erholung"
    prompt: |
      Beispiel-Log, konstruiert nach der Logik der Testszene. Der Gegner hat einen Angriff mit 4 aktiven Frames. Schwer, unlesbar oder kaputt?
    lang: text
    code: |
      10  Gegner WAIT -> TELEGRAPH
      30  Gegner TELEGRAPH -> ACTIVE
      34  Gegner ACTIVE -> RECOVERY
      38  Spieler getroffen in MOVE, Frame 12
    options:
      - text: Kaputt – die Hitbox war in der Erholung noch an.
        correct: true
        why: Ab Frame 34 ist der Gegner in der Erholung, seine Hitbox muss aus sein. Ein Treffer vier Frames später heißt, sie wurde nicht abgeschaltet.
      - text: Schwer – der Spieler ist zu früh in den Gegner gelaufen.
        correct: false
        why: In der Erholung soll der Gegner gar nicht treffen. Laufen kann der Spieler dort, wohin er will.
      - text: Unlesbar – die Erholung war nicht angekündigt.
        correct: false
        why: Eine Erholung braucht keine Ankündigung, weil sie nicht trifft. Hier hat der Code etwas getan, was keine Vorgabe vorsieht.
    explanation: |
      Die aktive Phase lief von Frame 30 bis 33. Ein Treffer aus diesen Frames stünde spätestens in Frame 34 im Log. Frame 38 passt zu keinem Zustand, in dem der Gegner treffen darf. Solche Treffer fühlen sich für den Spieler wie Unfairness an, sind aber ein Fehler im Code, etwa eine Hitbox, die beim Zustandswechsel nicht abgeschaltet wird. Erst beheben, dann weiter abstimmen.
    resources:
      - title: Godot Docs · CollisionShape2D.disabled
        url: https://docs.godotengine.org/en/stable/classes/class_collisionshape2d.html#class-collisionshape2d-property-disabled

  - id: fehler-nachstellen
    type: order
    title: Ein seltener Treffer, gezielt nachgestellt
    prompt: |
      Ein Tester meldet einen Treffer, der „nur manchmal“ passiert. Bring die Schritte in eine Reihenfolge, mit der du ihn am PC gezielt nachstellst.
    lang: prose
    lines: |
      Meldung mit Uhrzeit oder Frame notieren
      Den Moment in Log und Aufnahme suchen
      Druck- und Hitbox-Frames ablesen
      Drehbuch mit genau diesen Frames schreiben
      Lauf mit --fixed-fps 60 wiederholen
      Prüfen, ob der Treffer jedes Mal kommt
    explanation: |
      Selten heißt fast nie zufällig, sondern: an einen bestimmten Frame gebunden. Mit Zeitpunkt findest du den Moment in Log und Aufnahme wieder. Aus dem Log liest du ab, in welchen Frames gedrückt wurde und die Hitbox anging. Das [Drehbuch](/combat/testszene-angriff) drückt die Tasten dann genau in diesen Frames, und eine feste Bildrate macht den Lauf wiederholbar. Kommt der Treffer jetzt jedes Mal, hast du den Fall und kannst die Ursache bestimmen.
    resources:
      - title: Godot Docs · Command line tutorial
        url: https://docs.godotengine.org/en/stable/tutorials/editor/command_line_tutorial.html

  - id: telegraph-in-ms
    type: output
    title: Zwölf Frames in Millisekunden
    prompt: |
      Ein Telegraph dauert 12 Frames bei 60 Frames pro Sekunde. Wie viele Millisekunden sind das? Antworte mit der Zahl.
    lang: text
    code: |
      ms = Frames × 1000 / 60
      Telegraph: 12 Frames
    expected: |
      200
    accept:
      - 200 ms
    explanation: |
      12 × 1000 / 60 = 200 ms. Das ist weniger als die einfache Reaktionszeit von 213 ms, die Woods et al. nach Abzug der Geräteverzögerung gemessen haben. Mit Latenz des Systems und der Entscheidung, wohin man ausweicht, fehlt noch mehr. Ein solcher Telegraph lässt sich nicht sehen und beantworten, nur erwarten.
    resources:
      - title: Woods et al. 2015 · einfache Reaktionszeit
        url: https://www.frontiersin.org/journals/human-neuroscience/articles/10.3389/fnhum.2015.00131/full

  - id: spaetester-druck
    type: output
    title: Der letzte mögliche Frame
    prompt: |
      Ein Telegraph beginnt in Frame 50 und dauert 24 Frames. Die i-Frames beginnen im zweiten Frame des Ausweichens und decken alle aktiven Frames ab. Die Figur steht in der Fläche und weicht auf der Stelle aus. In welchem Frame muss die Figur den Druck spätestens sehen, damit kein Treffer kommt?
    lang: text
    code: |
      50   Gegner WAIT -> TELEGRAPH
      ???  Druck dodge
    expected: |
      73
    accept:
      - Frame 73
    hints:
      - In welchem Frame geht die Hitbox an?
      - Im echten Log der Testszene geht die Hitbox in Frame 30 an, und der Druck in Frame 29 reicht gerade noch.
    explanation: |
      Der Telegraph belegt die Frames 50 bis 73, in Frame 74 geht die Hitbox an. Ein Druck in Frame 73 startet das Ausweichen, Frame 74 ist dessen zweiter Frame, die i-Frames beginnen, und der Physik-Schritt findet keine Hurtbox. Ein Druck in Frame 74 wäre einen Frame zu spät: Der Treffer käme in Frame 75 im ersten, verwundbaren Frame des Ausweichens. Im echten Lauf der Testszene ist es dasselbe Muster mit 29 und 30.
    resources:
      - title: Godot Docs · Using Area2D
        url: https://docs.godotengine.org/en/stable/tutorials/physics/using_area_2d.html

  - id: spielraum-rechnen
    type: output
    title: Wie viel Spielraum bleibt?
    prompt: |
      Dasselbe Modell wie in der Lektion, aber mit 13 Frames Reaktion und 6 Frames Latenz (4 Frames plus 2 für einen Flachbildschirm). Was gibt das Programm aus?
    lang: python
    code: |
      REAKTION = 13  # Frames, etwa 213 ms
      LATENZ = 6     # 4 Frames + 2 Bildschirm

      def spielraum(telegraph):
          return telegraph - REAKTION - LATENZ

      print([spielraum(t) for t in (16, 24, 30)])
    expected: |
      [-3, 5, 11]
    explanation: |
      Reaktion und Latenz ergeben zusammen 19 Frames. Ein Telegraph von 16 Frames lässt dann 3 Frames zu wenig, 24 Frames lassen 5 übrig, 30 Frames 11. Das Modell ist eine eigene Rechnung: Es nimmt die einfache Reaktionszeit, also die schnellste Form, und ignoriert die Entscheidung, wohin der Spieler ausweicht. Ein negativer Spielraum heißt nur, dass der Spieler den Angriff erwarten muss, nicht dass er schlecht ist.
    resources:
      - title: Mick West · Measuring Responsiveness in Video Games
        url: https://www.gamedeveloper.com/design/measuring-responsiveness-in-video-games

  - id: diagnose-notiz
    type: gap
    title: Eine Diagnose-Notiz ausfüllen
    prompt: |
      Echtes Log der Testszene aus der Lektion: Telegraph ab Frame 10, die Figur weicht auf der Stelle aus, der Angriff ist 20 Frames aktiv. Fülle die Notiz aus.
    lang: text
    code: |
      22  Druck dodge
      23  Spieler i-Frames an
      30  Dummy TELEGRAPH -> ACTIVE
      34  Spieler i-Frames aus
      35  Spieler getroffen

      Telegraph lang:   ⟦20⟧ Frames
      Druck gesehen:    Frame ⟦22⟧
      Hitbox an:        Frame ⟦30⟧
      geschützt bis:    Frame ⟦33⟧
      Treffer:          Frame ⟦35⟧
    gaps:
      - label: Länge des Telegraphs
        hint: Von Frame 10 bis zum Wechsel nach ACTIVE.
      - label: Druck
        hint: Die Zeile „Druck dodge“.
      - label: Hitbox
        hint: Die Zeile „TELEGRAPH -> ACTIVE“.
      - label: Letzter geschützter Frame
        hint: Der Frame vor „i-Frames aus“.
      - label: Treffer
        hint: Die Zeile „Spieler getroffen“.
    explanation: |
      Der Telegraph lief von Frame 10 bis 29, also 20 Frames. Der Druck kam in Frame 22, die i-Frames liefen von 23 bis 33. In Frame 34 schaltete die Figur ihre Hurtbox wieder ein, die Hitbox war seit Frame 30 an, und die Physik meldete die Überlappung in Frame 35. Das Ausweichen kam zu früh für einen Angriff, der 20 Frames trifft. So eine Notiz schreibst du für jeden Treffer, den du untersuchst.
    resources:
      - title: Godot Docs · Area2D.monitorable
        url: https://docs.godotengine.org/en/stable/classes/class_area2d.html#class-area2d-property-monitorable

  - id: log-hitstop-ausweichen
    type: bug
    title: Ein Ausweichen, das den Gegner verlängert
    prompt: |
      Beispiel-Log einer früheren Fassung der Testszene, in der `take_hit()` Treffer während der i-Frames nur ablehnt. Der Dummy hat 4 aktive Frames und Hitstop 4. Die Figur wurde nicht getroffen, trotzdem liegen die Zeiten des Dummys 4 Frames später als vorhergesagt. Tippe die Zeile an, die den technischen Fehler zeigt, und schreib, wie sie ohne den Fehler lauten müsste.
    lang: text
    code: |
      28  Druck dodge
      28  Spieler MOVE -> DODGE
      30  Dummy TELEGRAPH -> ACTIVE
      31  Spieler weicht aus (Frame 3 des Ausweichens)
      38  Dummy ACTIVE -> RECOVERY
    lines: [5]
    fix:
      - line: 5
        answers:
          - 34  Dummy ACTIVE -> RECOVERY
    explanation: |
      Mit 4 aktiven Frames ab Frame 30 beginnt die Erholung in Frame 34. Frame 38 ist 4 Frames später, genau der Hitstop. Der Dummy hat ihn gesetzt, obwohl die Figur den Treffer abgelehnt hat. Alle Zeiten des Gegners verschieben sich, und wer auf die vorhergesagten Frames hin plant, liegt daneben. Die Ursache steckt im Code des Angreifers, siehe [Testszene: Ausweichen und Trainingsgegner](/combat/testszene-ausweichen).

  - id: reagieren-oder-erinnern
    type: explain
    title: Acht Frames und ein Muster
    prompt: |
      Ein Bossangriff hat einen Telegraph von 8 Frames und kommt immer als dritter Angriff im Muster. Erkläre mit der Reaktionszeit, was der Spieler können muss, um auszuweichen, und warum die Rechnung nicht sagt, ob der Angriff gut ist.
    lang: text
    code: |
      Muster des Bosses (Beispiel, Platzhalter)
      1. Stampfer   Telegraph 40 Frames
      2. Hieb       Telegraph 24 Frames
      3. Stoß       Telegraph 8 Frames
      danach von vorn
    points:
      - 8 Frames sind 133 ms, kürzer als die einfache Reaktionszeit von 213 bis 231 ms (13 bis 14 Frames).
      - Im Spiel kommen Erkennen, Entscheiden und die Latenz des Systems dazu; die einfache Reaktionszeit ist die Untergrenze.
      - Ausweichen gelingt nur, wenn der Spieler den Angriff vorher erwartet, hier aus seiner Stelle im Muster.
      - Ob ein Angriff Erinnern statt Reagieren verlangen soll, ist eine Designentscheidung; die Rechnung beschreibt nur, welche Fähigkeit er prüft.
    explanation: |
      8 Frames sind 133 ms. Woods et al. messen für die schnellste Form der Reaktion, ein bekanntes Signal und eine bekannte Taste, im Mittel 213 bis 231 ms. Im Spiel kommt die Latenz des Systems hinzu, und der Spieler muss eine Richtung wählen. Auf diesen Angriff kann also niemand reagieren, aber jeder kann ihn erwarten, weil er immer an dritter Stelle kommt. Titan Souls will genau das: vorhersagbar, sobald man den Kampf versteht. Ob dein Boss Erinnern prüfen soll, entscheidest du. Die Rechnung macht nur sichtbar, dass er es tut.
    resources:
      - title: Mark Foster · One-hit kills in Titan Souls (Game Developer)
        url: https://www.gamedeveloper.com/design/game-design-deep-dive-one-hit-kills-in-i-titan-souls-i-

  - id: hits-to-kill
    type: explain
    title: Schwerer, ohne Schwamm
    prompt: |
      Erkläre, warum Sucker Punch die Schwierigkeit in Ghost of Tsushima nicht über die Lebenspunkte der Gegner steigert, und was du prüfen musst, wenn du stattdessen Gegnerangriffe schneller machst.
    lang: text
    code: |
      Ghost of Tsushima laut Theodore Fishman:
      Tester:  „sword sponges“, „foam bat“
      Regel:   harte Obergrenze für „hits to kill“
      Stufen:  erhöhen nicht die Gegner-HP
      Hebel:   Stagger, Block, Parry, Ausweichen,
               Angriffsgeschwindigkeit, Schaden
    points:
      - Mehr Lebenspunkte heißen mehr Treffer pro Gegner; Tester empfanden Gegner als „sword sponges“, Schläge wie mit einem „foam bat“.
      - Eine Obergrenze für „hits to kill“ hält fest, wie tödlich ein Schlag ist, auch auf hohen Schwierigkeitsgraden.
      - Schwierigkeit kommt aus anderen Hebeln wie Block, Parry, Ausweichen, Angriffsgeschwindigkeit und Schaden.
      - Schnellere Gegnerangriffe verkürzen die Zeit zum Reagieren; der Spielraum gegen die Reaktionszeit muss neu gerechnet werden.
    explanation: |
      Theodore Fishman beschreibt, dass sich Kämpfe mit Gegnern, die viele Treffer aushalten, für Tester anfühlten „like I was hitting enemies with a foam bat“. Die harte Grenze für „hits to kill“ bewahrt die Tödlichkeit des Schwerts auf jedem Schwierigkeitsgrad. Schwerer wird es über andere Hebel, darunter die Angriffsgeschwindigkeit der Gegner. Genau dieser Hebel greift die Lesbarkeit an: Wird ein Telegraph kürzer, kann er unter Reaktionszeit plus Latenz fallen. Wer an ihm dreht, rechnet den Spielraum neu.
    resources:
      - title: PlayStation Blog · The lethality contract in Ghost of Tsushima
        url: https://blog.playstation.com/?p=344024
      - title: GDC 2021 · Honoring the Blade (YouTube)
        url: https://www.youtube.com/watch?v=dKS2kaI3aXE

  - id: clip-drei-treffer
    type: practice
    title: "Clip-Analyse: drei Treffer zuordnen"
    prompt: |
      Sieh dir einen Bosskampf-Clip an, zum Beispiel [How Cuphead's Bosses (Try to) Kill You](https://www.youtube.com/watch?v=F8T6Ul4aHTI) von Game Maker's Toolkit, oder ein Video eines Spiels, das du kennst. Such drei Momente, in denen der Spieler getroffen wird. Geh für jeden die erste und die vierte Diagnosefrage durch, so weit ein Video das zulässt, und ordne ihn einer Ursache zu.
    lang: text
    solution: |
      Beispiel für die Form, ausgedachte Einträge:

      Treffer 1 (Zeit im Clip notieren)
      Gesehen: Boss hebt den Arm, Schatten am Boden
      Telegraph gezählt: etwa 30 Frames
        (mit Sakurais „1-und-2-und-3“: ein Schlag ~30)
      Fläche: Treffer dort, wo der Schatten war
      Ursache: schwer, Spieler sprang zu spät

      Treffer 2
      Gesehen: Projektil kommt vom Bildrand
      Telegraph: keiner im Bild erkennbar
      Ursache: unlesbar? Unsicher, das Video zeigt
        nicht, ob es einen Ton gab.
    checklist:
      - Du hast für jeden der drei Treffer die Stelle im Clip notiert.
      - Zu jedem Treffer steht, was vor dem Treffer zu sehen war, und eine geschätzte Länge des Telegraphs in Frames.
      - Jeder Treffer ist einer Ursache zugeordnet, mit einem Satz Begründung.
      - Wo ein Video die Frage nicht beantworten kann (Eingabe, Hitbox, Ton), hast du das als unsicher markiert statt zu raten.
    explanation: |
      Von außen siehst du nur zwei der vier Fragen: was zu sehen war und ob die Fläche zum Bild passte. Ob eine Eingabe ankam oder wann eine Hitbox anging, verrät kein Video. Deshalb ist „kaputt“ in einer Clip-Analyse fast nie sicher, „schwer“ und „unlesbar“ oft schon. Zum Frame-Zählen hilft Sakurais Methode aus [Learn to Count Frames!](https://www.youtube.com/watch?v=JZ1Jd0u3b6U): Bei „1-und-2-und-3“ dauert jeder Schlag etwa 30 Frames. Welche Ursache du bei unsicheren Fällen annimmst, ist deine Einschätzung.
    resources:
      - title: Masahiro Sakurai · Learn to Count Frames!
        url: https://www.youtube.com/watch?v=JZ1Jd0u3b6U

  - id: eigener-treffer
    type: practice
    title: Ein Treffer, der sich unfair angefühlt hat
    prompt: |
      Denk an einen Treffer aus einem Spiel, das du spielst, oder aus der Testszene, der sich unfair angefühlt hat. Schreib eine Diagnose-Notiz mit den vier Fragen. Ordne den Treffer einer Ursache zu und notiere, was du ändern würdest, wenn es dein Spiel wäre, ohne einen Wert festzulegen.
    lang: text
    solution: |
      Beispiel für die Form, am neutralen Trainingsgegner:

      Gesehen: gelbe Fläche, Figur stand darin
      Eingabe: 22  Druck dodge
      Hitbox:  30  Dummy TELEGRAPH -> ACTIVE
               34  i-Frames aus, 35 getroffen
      Fläche:  F10 und Kollisionsformen: Figur in der
               Hitbox, Hitbox so groß wie die gelbe Fläche
      Ursache: schwer, zu früh ausgewichen
      Wenn es mein Spiel wäre: Frage offen, ob die
        i-Frames lange Angriffe abdecken sollen.
        Erst testen, dann entscheiden.
    checklist:
      - Die Notiz beantwortet alle vier Fragen, oder sie sagt, welche du nicht beantworten konntest.
      - Was du gesehen hast, stand fest, bevor du Log oder Aufnahme angesehen hast.
      - Die Ursache ist begründet, nicht nur benannt.
      - Was du ändern würdest, ist eine Frage oder Hypothese, kein fester Wert.
    explanation: |
      Die Übung macht aus einem Gefühl eine Beobachtung. Erst das Gesehene, dann die Daten, dann die Zuordnung. Bei einem Spiel, das du nicht gebaut hast, bleiben Fragen offen. Das ist in Ordnung, solange du sie als offen markierst. Was du ändern würdest, bleibt eine Hypothese. Wie du sie prüfst, steht in [Tuning als Experiment](/combat/tuning).
    resources:
      - title: Mike Ambinder · Valve's Approach to Playtesting (GDC 2009, PDF)
        url: https://cdn.fastly.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf
