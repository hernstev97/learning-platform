lesson: |
  > [!NOTE] Unterwegs
  > Diese Lektion und ihre Übungen gehen am Handy. Die verlinkten Clips brauchen Netz, alles andere ist offline lesbar.

  In der Testszene steht der Dummy 20 Pixel rechts von der Spielfigur. Die Hitbox des Platzhalterangriffs ist 14 × 10 Pixel groß, ihre Mitte sitzt 12 Pixel vor der Figur, ihr vorderer Rand also 19 Pixel vor der Figurenmitte. Die Hurtbox des Dummys ist 12 Pixel breit, ihr linker Rand liegt 14 Pixel vor der Figurenmitte. Die Flächen überlappen 5 Pixel, und das Log meldet `Dummy getroffen`. Mit Godot 4.7.2 nachgemessen: Schiebst du den Dummy auf 25 Pixel, berühren sich die Ränder nur noch, und es trifft trotzdem. Bei 26 Pixeln trifft der Angriff nicht mehr.

  Ob ein Angriff trifft, entscheidet Geometrie in den Frames, in denen die Hitbox an ist. Diese Lektion klärt, was Hitbox und Hurtbox sind, warum sie vom Bild abweichen dürfen und wie du Reichweite in der Draufsicht nachrechnest. Für Reichweite und Drehung in der Draufsicht nennt keine der Quellen dieses Kurses Regeln; Ian Cofino beschreibt nur, wie großzügig Dreamscaper die Flächen setzt. Was dazu folgt, ist Rechnung und Messung an der Testszene mit Platzhalterwerten, keine Regel aus einem Studio.

  ## Hitbox und Hurtbox: zwei Flächen, zwei Fragen

  Die **Hitbox** ist die Fläche, mit der ein Angriff trifft. Infil beschreibt sie als vorgegebene Fläche, „usually a group of rectangles or circles“, die es nur in der aktiven Phase gibt; ihre Größe bestimmt die Reichweite ([Hitbox](https://glossary.infil.net/?t=Hitbox)). Die **Hurtbox** ist die Fläche, an der eine Figur getroffen werden kann. Meist versucht sie, dem Körper der Figur recht genau zu folgen ([Hurtbox](https://glossary.infil.net/?t=Hurtbox)). Ein Treffer ist die Überlappung einer Hitbox mit einer Hurtbox der Gegenseite. Im Alltag heißt beides oft „Hitbox“. Wenn jemand sagt „die Hitbox ist kaputt“, frag nach, welche Fläche gemeint ist.

  In der Testszene sind alle Flächen Rechtecke. Die Werte sind Platzhalter:

  | Fläche | Größe | Lage |
  | --- | --- | --- |
  | Bild Figur | 12 × 12 | Mitte |
  | Hurtbox Figur | 10 × 10 | Mitte |
  | Hitbox | 14 × 10 | 12 px voraus |
  | Hurtbox Dummy | 12 × 16 | Mitte |

  Die Hurtbox der Figur ist an jeder Seite einen Pixel kleiner als ihr Bild. Die Hitbox reicht von 5 bis 19 Pixel vor der Figurenmitte. Sie beginnt also genau dort, wo die Hurtbox der Figur endet. Der Arm, der zuschlägt, ist nicht verwundbar.

  Im Bereich der Hitbox liegt keine Hurtbox des Angreifers. Der Gegner kann den ausgestreckten Arm also nicht treffen, wie bei einer **Disjointed Hitbox**, einer Hitbox, die nicht in der Nähe einer Hurtbox des Angreifers liegt ([Disjointed Hitbox](https://glossary.infil.net/?t=Disjointed+Hitbox)). Ganz so weit weg ist sie hier nicht, sie beginnt direkt am Rand der Figur. Typisch für Disjointed Hitboxes sind Schwertangriffe und Projektile. Sonst legen Designer an die Stelle eines Schlags auch Hurtboxen, damit der Gegner etwas zum Treffen hat, wenn der Angreifer verfehlt. Eine Disjointed Hitbox nimmt dem Gegner diese Antwort. Ob deine Angriffe so sind, entscheidest du später selbst.

  ## Größer als die Waffe, aber an der richtigen Stelle

  Sakurai erklärt in [Always Keep Attack Collision in Mind](https://www.youtube.com/watch?v=rwwF_4blK-o), dass die Hitboxen in Smash nicht der Form von Schwert oder Faust folgen, sondern eine größere Fläche abdecken. Weil sich die Figuren schnell bewegen, wären Treffer sonst selten und das Spiel frustrierend (ab 0:16). Dann zieht er eine Grenze (ab 1:02): Ein Größenunterschied zwischen Bild und Hitbox ist für den Spielspaß in Ordnung. Sitzt die Hitbox aber an einer anderen Stelle als die Bewegung im Bild, wird der Widerspruch viel größer. Ein Schlag, der im Bild nicht durch die Mittellinie geht, trifft schlecht, und Sakurai lässt dann die Animation korrigieren. Die Hitbox an eine andere Stelle zu setzen, ginge auch, aber dann passen Bild und Treffer noch weniger zusammen. Und weil der Hitstop die Pose beim Treffer einfriert, darf die Hitbox bei einem Schwertschlag schon kurz vor dem vollen Schwung beginnen (ab 1:55).

  > [!MERKE]
  > Nach Sakurai darf die Größe einer Trefferfläche vom Bild abweichen, ihre Lage nicht.

  Ian Cofino beschreibt für das Top-down-Spiel Dreamscaper, wie weit das gehen kann ([GDC 2022, ab 34:52](https://www.youtube.com/watch?v=3Omb5exWpd4&t=2092s)). Das Team verändert Hitboxen und Hurtboxen zugunsten des Spielers. Ein Treffer darf zählen, obwohl im Bild kein Kontakt zu sehen ist. Spielerangriffe bekommen großzügige Hitboxen, Gegnerangriffe präzise. Ein Angriff kann mehrere Hitboxen haben: Projektile prüfen Gegner, Umgebung und Zerstörbares getrennt. Gegen Gegner ist die Fläche großzügig, an Wänden bleibt das Projektil trotzdem nicht hängen.

  God of War (2018) geht noch weiter: Schon Trefferreaktionen am Boden lösten unsichtbare Kollisionen aus, die Gegner daneben treffen. Für Gegner in der Luft machte das Team diese Flächen viel größer ([Evolving Combat in God of War, ab 41:21](https://www.youtube.com/watch?v=hE5tWF-Ou2k&t=2481s)). Das sind Flächen ganz ohne Bild, die es nur für den Spielablauf gibt.

  Im Hitstop lässt Sakurai die Figuren nur im Bild zittern, die Hurtboxen bleiben stehen ([Thinking About Hitstop](https://sourcegaming.info/2015/11/11/thoughts-on-hitstop-sakurais-famitsu-column-vol-490-1/), Fan-Übersetzung); mehr dazu in [Trefferfeedback](/combat/trefferfeedback).

  ## Reichweite in der Draufsicht: Pivot, Richtung, Form

  In einer Seitenansicht schlägt ein Angriff nach links oder rechts. In der Draufsicht mit analogem Stick zeigt er in jede Richtung. Die Testszene löst das mit einem Pivot: `HitboxPivot` ist ein leerer Node in der Mitte der Figur, die Hitbox hängt 12 Pixel rechts davon. Beim Laufen setzt die Figur `hitbox_pivot.rotation = facing.angle()`, und die Hitbox wandert um die Figur herum ([Godot-Start](/combat/godot-start)).

  Für Rechtecke, deren Kanten an den Achsen ausgerichtet sind, ist die Prüfung kurz: Zwei Rechtecke überlappen, wenn sie sich auf der x-Achse und auf der y-Achse überlappen. Das Modell rechnet die drei Abstände vom Anfang nach:

  ```python run
  # Rechteck = (links, oben, rechts, unten)
  def rechteck(mx, my, breite, hoehe):
      return (mx - breite / 2, my - hoehe / 2,
              mx + breite / 2, my + hoehe / 2)

  def ueberlappt(a, b):
      x = a[0] <= b[2] and b[0] <= a[2]
      y = a[1] <= b[3] and b[1] <= a[3]
      return x and y

  hitbox = rechteck(12, 0, 14, 10)
  for d in (24, 25, 26):
      dummy = rechteck(d, 0, 12, 16)
      print(d, ueberlappt(hitbox, dummy))
  ```

  Das `<=` lässt berührende Ränder als Treffer gelten, wie es Godot in der Testszene bei 25 Pixeln getan hat. Daraus folgt eine Faustformel für die Reichweite nach rechts: vorderer Rand der Hitbox plus halbe Breite der Ziel-Hurtbox, 19 + 6 = 25 Pixel Mittenabstand.

  ### Die Richtung ändert die Reichweite

  Dreht sich die Figur, dreht sich die Hitbox mit, die Hurtbox des Dummys aber nicht. Der Dummy ist 12 breit und 16 hoch. Derselbe Angriff trifft deshalb in jeder Richtung bis zu einem anderen Abstand, gemessen mit Godot 4.7.2:

  | Richtung | trifft bis Mittenabstand |
  | --- | --- |
  | rechts | 25 px |
  | unten | 27 px |
  | schräg 45° | knapp 29 px |

  Nach unten zählt die halbe Höhe des Dummys statt der halben Breite: 19 + 8 = 27. Schräg prüft Godot die gedrehte Hitbox gegen ein nicht gedrehtes Rechteck. Das rechnest du nicht von Hand, dafür gibt es die Debug-Anzeige. Ob dich diese Unterschiede von 4 Pixeln stören, merkst du erst beim Spielen. Wichtig ist, dass du weißt, woher sie kommen.

  ### Formen: Rechteck, Kreis, Kapsel

  Ein Kreis sieht aus jeder Richtung gleich aus. Bei einer kreisförmigen Hitbox gegen eine kreisförmige Hurtbox hängt die Reichweite deshalb nicht von der Richtung ab. Zwei Kreise überlappen, wenn der Abstand ihrer Mitten höchstens die Summe der Radien ist:

  ```python run
  import math

  def treffen(a, b):
      (ax, ay, ar), (bx, by, br) = a, b
      abstand = math.hypot(bx - ax, by - ay)
      return abstand <= ar + br

  def kreis(abstand, winkel, r):
      w = math.radians(winkel)
      return (abstand * math.cos(w),
              abstand * math.sin(w), r)

  # Hitbox r 7, 12 px voraus; Ziel r 6
  for winkel in (0, 45, 90):
      h = kreis(12, winkel, 7)
      nah = treffen(h, kreis(24, winkel, 6))
      fern = treffen(h, kreis(26, winkel, 6))
      print(winkel, nah, fern)
  ```

  In allen drei Richtungen trifft der Angriff bei 24 Pixeln und verfehlt bei 26. Godot bietet für 2D unter anderem `RectangleShape2D`, `CircleShape2D` und `CapsuleShape2D`, ein Rechteck mit runden Enden. Laut Doku ist der Kreis am schnellsten zu prüfen, das Rechteck schneller als die Kapsel ([CircleShape2D](https://docs.godotengine.org/en/stable/classes/class_circleshape2d.html), [CapsuleShape2D](https://docs.godotengine.org/en/stable/classes/class_capsuleshape2d.html)). Bei einer Handvoll Figuren spielt das keine Rolle. Wichtiger ist, welche Form zu Bild und Bewegung passt.

  ### Pixelart-Silhouette und Hurtbox

  Eine Pixelart-Figur ändert ihre Silhouette mit jeder Zeichnung: Arme, Haare, Waffe, Schatten. Die Hurtbox ist dagegen meist ein einzelnes Rechteck oder ein Kreis und hält still. Beide stimmen deshalb nie ganz überein. Nach Sakurais Grenze ist das in Ordnung, solange die Lage stimmt. Wenn du Figuren schräg von vorn zeichnest, steht der Kopf im Bild über den Füßen. Eine Hurtbox, die das ganze Bild abdeckt, wäre nach oben länger als die Figur am Boden, und ein Schlag knapp über dem Kopf träfe. Ob die Hurtbox den Körper, die Füße oder einen Teil dazwischen abdeckt, ist eine Entscheidung, die du für dein Spiel triffst. Wie man klärt, ob ein Treffer „unfair“ war, behandelt [Schwer, unfair oder kaputt?](/combat/frust-diagnose).

  ## Bewegung: Pixel pro Frame und Reichweite, wenn beide laufen

  Geschwindigkeiten stehen in Godot in Pixeln pro Sekunde; `move_and_slide()` rechnet den Anteil eines Physik-Frames selbst aus ([CharacterBody2D](https://docs.godotengine.org/en/stable/classes/class_characterbody2d.html#class-characterbody2d-property-velocity)). Für Reichweiten brauchst du Pixel pro Frame: Tempo geteilt durch 60. Die Platzhalterfigur läuft mit 90 px/s, also 1,5 Pixel pro Frame. Godot zeichnet sie trotzdem nur in ganzen Pixeln.

  In der Testszene steht die Figur während des Wind-ups still. Der Gegner nicht. Weicht ein Gegner mit 60 px/s zurück (Platzhalter), also mit einem Pixel pro Frame, ist er nach den 8 Frames Wind-up rund 8 Pixel weiter weg. In diesem Modell muss er beim Druck höchstens etwa 25 − 8 = 17 Pixel entfernt sein, damit der Angriff ihn nach rechts noch trifft. Kommt er mit demselben Tempo auf die Figur zu, darf er beim Druck bis etwa 33 Pixel entfernt sein. „In Reichweite“ heißt also: In einem aktiven Frame überlappen sich die Flächen. Wo der Gegner beim Druck stand, ist nur der Ausgangspunkt. Auf den Frame genau zeigt es dir nur das Log.

  Wie lange dauert es, eine Lücke zu schließen? Holt eine Figur mit 90 px/s einen Gegner mit 60 px/s ein, schrumpft der Abstand um 0,5 Pixel pro Frame:

  ```python run
  import math

  def frames_zum_aufholen(luecke, ich, ziel):
      # Tempo in px/s, Lücke in px
      pro_frame = (ich - ziel) / 60
      return math.ceil(luecke / pro_frame)

  print(frames_zum_aufholen(10, 90, 60))
  print(frames_zum_aufholen(10, 90, 0))
  ```

  10 Pixel gegen einen fliehenden Gegner dauern 20 Frames, gegen einen stehenden 7. Zusammen mit dem Wind-up ergibt das die Zeit, die ein Spieler vom Losrennen bis zum Treffer braucht. Ob dein Angriff einen Schritt nach vorn macht, ob die Figur im Wind-up laufen darf und wie schnell Gegner zurückweichen, sind Designfragen. Die Rechnung zeigt nur, welche Größen zusammenhängen.

  ## Kollisionsebenen und Debug-Anzeige

  Damit eine Hitbox nur die richtigen Flächen findet, liegt jede Fläche auf einer Ebene und scannt bestimmte andere. Die Godot-Doku fasst die Regel so: „Object A can detect a contact with object B only if object B is in any of the layers that object A scans.“ ([Collision layers and masks](https://docs.godotengine.org/en/stable/tutorials/physics/physics_introduction.html#collision-layers-and-masks)). In der Testszene liegt die Hurtbox der Figur auf Ebene 2, die des Gegners auf Ebene 3. Die Hitbox der Figur scannt Ebene 3, die des Gegners Ebene 2. So trifft kein Angriff die eigene Figur. Die Einrichtung Schritt für Schritt steht in [Testszene: Angriff mit Frame-Daten](/combat/testszene-angriff). Dreamscapers getrennte Prüfung für Gegner, Umgebung und Zerstörbares ließe sich in Godot mit einer Fläche je Ebene nachbauen.

  Sehen kannst du die Flächen im fertigen Spiel nicht. Manche Trainingsmodi von Kampfspielen zeigen sie, Hitboxen fast immer rot und Hurtboxen grün (Infil, [Hitbox](https://glossary.infil.net/?t=Hitbox)). In Godot schaltest du im Menü *Debug* **Kollisionsformen sichtbar** an ([Visible collision shapes](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html#visible-collision-shapes)). Mit Pause (F9) und Nächster Frame (F10) gehst du dann Bild für Bild durch einen strittigen Treffer und siehst gedrehte Hitboxen im aktiven Frame. Prüf am Frame-Zähler der Debug-Anzeige, wie weit ein Schritt geht.

  > [!PRAXIS]
  > Ist ein Treffer strittig, schau dir zuerst den aktiven Frame mit sichtbaren Formen an und ändere erst danach etwas. Ein Treffer ohne Kontakt im Bild kann gewollt sein: Dreamscaper nimmt ihn bei Spielerangriffen bewusst in Kauf und hält die Gegner-Hitboxen präzise. Schreib in jede Vorgabe für einen Coding-Agenten Form, Größe und Lage jeder Fläche relativ zur Figurenmitte und die Ebenen, die sie scannt.

  > [!INTERVIEW]
  > „Spieler beschweren sich, dass ein Gegner sie trifft, obwohl seine Klaue sie nicht berührt. Wie gehst du vor?“ Gute Antwort: Stell die Szene nach, schalte die Kollisionsformen sichtbar und geh Frame für Frame durch die aktive Phase. Dann prüfst du drei Dinge: Liegt die Hitbox dort, wo die Klaue im Bild ist, oder nur ungefähr? Wo sitzt die Hurtbox des Spielers im Verhältnis zu seinem Bild? Und trifft eine gedrehte Hitbox schräg weiter als gerade? Danach entscheidest du, ob du die Hitbox anpasst oder die Animation, und testest den Fall erneut.

  ## Häufige Fehler

  - **Größe der Hitbox nicht im aktiven Frame geprüft.** Ob eine Fläche, die genau der Waffe folgt, bei schneller Bewegung noch trifft, siehst du nur mit sichtbaren Formen im Einzelbild. Sakurai macht sie bewusst größer; wie groß deine sind, entscheidest du nach der Messung.
  - **Lage der Hitbox nicht mit dem Bild verglichen.** Sitzt die Fläche versehentlich woanders als der Schlag, wirken Treffer unerklärlich, auch wenn die Größe passt. Prüf im aktiven Frame mit sichtbaren Formen erst die Animation, dann die Fläche.
  - **Reichweite bis zur Mitte des Gegners gerechnet.** Die Hurtbox hat eine Größe. Zur Reichweite gehört ihre halbe Breite oder Höhe dazu.
  - **Nur in eine Richtung geprüft.** Mit Rechtecken trifft derselbe Angriff je nach Richtung verschieden weit, in der Testszene nach unten und schräg weiter als nach rechts.
  - **px/s und Pixel pro Frame verwechselt.** 90 px/s sind 1,5 Pixel pro Frame, nicht 90.
  - **Bewegung im Wind-up vergessen.** Ein Gegner, der beim Druck in Reichweite war, kann im aktiven Frame schon draußen sein.
  - **Maske auf die eigene Hurtbox-Ebene gesetzt.** Dann trifft die Figur sich selbst oder ihre Verbündeten.

  ## Zusammenfassung

  - Die Hitbox trifft, die Hurtbox wird getroffen. Ein Treffer ist ihre Überlappung in einem aktiven Frame.
  - Sakurai macht Hitboxen größer als die Waffe, aber nicht an einer anderen Stelle. Hurtboxen bleiben bei ihm im Hitstop stehen.
  - Dreamscaper verschiebt Flächen gezielt zugunsten des Spielers: großzügige Hitboxen für Spieler-, präzise für Gegnerangriffe.
  - In der Draufsicht dreht ein Pivot die Hitbox um die Figur. Mit Rechtecken hängt die Reichweite von der Richtung ab, mit Kreis gegen Kreis nicht.
  - Zwei Rechtecke überlappen, wenn sie sich auf beiden Achsen überlappen; zwei Kreise, wenn der Mittenabstand höchstens die Summe der Radien ist.
  - Pixel pro Frame = px/s ÷ 60. Bewegt sich ein Gegner im Wind-up, zählt seine Lage im aktiven Frame, nicht beim Druck.
  - Kollisionsebenen legen fest, wer wen finden kann. Die Debug-Anzeige mit Einzelbild-Schritt klärt strittige Treffer.
exercises:
  - id: flaechen-unterscheiden
    type: choice
    title: Welche Fläche ist gemeint?
    prompt: |
      Welche Aussagen über Hitbox und Hurtbox stimmen?
    options:
      - text: Die Hitbox eines Angriffs gibt es nur in seiner aktiven Phase.
        correct: true
        why: Infil definiert die aktive Phase genau als die Zeit, in der eine Hitbox da ist. Im Wind-up und in der Erholung hat der Angriff keine.
      - text: Eine Disjointed Hitbox liegt nicht in der Nähe einer Hurtbox des Angreifers, deshalb kann der Gegner auf sie nicht zurückschlagen.
        correct: true
        why: Typisch für Schwerter und Projektile. Wer verfehlt, bietet an dieser Stelle trotzdem nichts zum Treffen.
      - text: Eine Hurtbox muss jedem Pixel der Silhouette folgen, sonst ist ein Treffer unfair.
        correct: false
        why: Die Silhouette ändert sich mit jeder Zeichnung. Sakurai lässt Größenunterschiede bewusst zu; nur die Lage muss stimmen.
      - text: Eine Hitbox, die größer ist als die Waffe im Bild, ist ein Fehler.
        correct: false
        why: In Smash sind Hitboxen absichtlich größer als Schwert oder Faust, weil Treffer bei schneller Bewegung sonst selten wären.
    explanation: |
      Hitbox und Hurtbox beantworten verschiedene Fragen: womit ein Angriff trifft und wo eine Figur verwundbar ist. Beide dürfen vom Bild abweichen, weil das Bild sich ständig ändert und schnelle Bewegung genaue Formen bestraft. Die Grenze zieht die Lage, nicht die Größe. Eine Disjointed Hitbox ist eine bewusste Entscheidung: Sie nimmt dem Gegner die Möglichkeit, auf den angreifenden Arm zu antworten.
    resources:
      - title: Infil · Disjointed Hitbox
        url: https://glossary.infil.net/?t=Disjointed+Hitbox

  - id: groesse-oder-lage
    type: choice
    title: Was Sakurai in Kauf nimmt
    prompt: |
      Welche Abweichungen zwischen Bild und Trefferfläche nimmt Sakurai bewusst in Kauf?
    options:
      - text: Die Hitbox ist größer als das Schwert im Bild.
        correct: true
        why: Ein Größenunterschied ist für ihn zugunsten des Spielspaßes in Ordnung.
      - text: Die Hitbox beginnt kurz bevor das Schwert ganz durchgeschwungen ist.
        correct: true
        why: Der Hitstop friert die Pose beim Treffer ein, und die soll nach Angriff aussehen. Deshalb wählt er den Zeitpunkt im Schwung bewusst.
      - text: Die Hitbox sitzt neben der Bahn des Schwungs, damit der Angriff öfter trifft.
        correct: false
        why: Genau das lehnt er ab. Weicht die Lage ab, wird der Widerspruch zwischen Bild und Treffer viel größer. Er lässt dann die Animation ändern.
      - text: Die Hurtbox zittert im Hitstop zusammen mit der Figur.
        correct: false
        why: Die Figuren zittern nur im Bild, die Hurtboxen bleiben stehen. Sonst könnten Angriffe, die treffen sollten, vorbeigehen.
    explanation: |
      Sakurais Regel lässt sich in einem Satz sagen: Die Größe darf abweichen, die Lage nicht. Größere Flächen machen schnelle Kämpfe spielbar, ohne dass ein Treffer unerklärlich wirkt, solange er dort passiert, wo der Schlag im Bild ist. Ein früherer Beginn im Schwung ist eine Frage des Timings, nicht der Lage. Und alles, was nur der Darstellung dient, wie das Zittern im Hitstop, bewegt die Trefferflächen nicht.
    resources:
      - title: Masahiro Sakurai · Always Keep Attack Collision in Mind
        url: https://www.youtube.com/watch?v=rwwF_4blK-o

  - id: treffer-ablauf
    type: order
    title: Vom Wind-up zum Hitstop
    prompt: |
      Bring die Schritte eines Treffers in der Testszene in die Reihenfolge, in der sie passieren.
    lang: text
    lines: |
      Der Wind-up endet, die Figur wechselt nach ACTIVE
      Die Form der Hitbox wird mit set_deferred eingeschaltet
      Der Physik-Schritt findet die Überlappung
      Im nächsten Frame kommt area_entered
      Die Hurtbox gibt den Treffer an ihre Figur weiter
      Die Figur nimmt ihn an, der Hitstop beginnt
    explanation: |
      Die Hitbox geht mit dem Zustandswechsel an, aber erst der Physik-Schritt am Ende des Frames prüft, ob sie eine Hurtbox auf einer gescannten Ebene überlappt. Das Signal kommt deshalb einen Frame nach dem Einschalten. Danach fragt die Hitbox über die Hurtbox bei der getroffenen Figur nach, und nur wenn diese annimmt, zählt der Treffer und beginnt der Hitstop. So kann eine Figur in ihren i-Frames einen Treffer ablehnen.
    resources:
      - title: Godot Docs · Using Area2D
        url: https://docs.godotengine.org/en/stable/tutorials/physics/using_area_2d.html

  - id: ueberlappung-vorhersagen
    type: output
    title: Trifft es oder nicht?
    prompt: |
      Was gibt das Programm aus? Die Antwort ist eine Zeile.
    lang: python
    code: |
      # Rechteck = (links, oben, rechts, unten)
      def ueberlappt(a, b):
          x = a[0] <= b[2] and b[0] <= a[2]
          y = a[1] <= b[3] and b[1] <= a[3]
          return x and y

      hitbox = (5, -5, 19, 5)
      nah = (18, -8, 30, 8)
      oben = (10, -30, 20, -6)
      a = ueberlappt(hitbox, nah)
      b = ueberlappt(hitbox, oben)
      print(a, b)
    expected: |
      True False
    explanation: |
      `nah` überlappt auf der x-Achse (18 bis 19) und auf der y-Achse (−5 bis 5), also `True`. `oben` überlappt auf der x-Achse, endet aber bei y = −6 und damit einen Pixel über der Oberkante der Hitbox bei −5. Eine Achse ohne Überlappung reicht für `False`. Genau so prüft man zwei achsenparallele Rechtecke: beide Achsen müssen sich überlappen.

  - id: reichweite-nach-unten
    type: output
    title: Reichweite nach unten
    prompt: |
      Die Figur der Testszene schaut nach unten, die Hitbox (14 × 10) hängt am Pivot und zeigt mit ihrer Mitte 12 Pixel nach unten. Der Dummy (Hurtbox 12 × 16, nicht gedreht) steht genau unter der Figur. Bis zu welchem Mittenabstand in Pixeln trifft der Angriff? Berührende Ränder zählen.
    lang: text
    code: |
      Hitbox: 14 × 10, Mitte 12 px voraus,
              lange Seite in Blickrichtung
      Dummy-Hurtbox: 12 breit, 16 hoch
    expected: |
      27
    accept:
      - 27 px
      - 27 Pixel
    hints:
      - Der vordere Rand der Hitbox liegt 12 + 14 / 2 Pixel vor der Figurenmitte.
      - Nach unten zählt die halbe Höhe des Dummys, nicht die halbe Breite.
    explanation: |
      Gedreht zeigt die Hitbox mit ihrer langen Seite nach unten, ihr vorderer Rand liegt 12 + 7 = 19 Pixel unter der Figurenmitte. Die Hurtbox des Dummys reicht 8 Pixel über seine Mitte hinaus. Also trifft es bis 19 + 8 = 27 Pixel Mittenabstand. Nach rechts sind es 19 + 6 = 25. In Godot 4.7.2 nachgemessen: 27 trifft, 27,5 nicht.
    resources:
      - title: Godot Docs · RectangleShape2D
        url: https://docs.godotengine.org/en/stable/classes/class_rectangleshape2d.html

  - id: wind-up-flucht
    type: output
    title: Der Gegner weicht zurück
    prompt: |
      Ein Gegner weicht mit 60 px/s zurück (Platzhalter). Die Figur steht während ihres Wind-ups von 8 Frames still. Um wie viele Pixel wächst der Abstand in dieser Zeit? Antworte mit der Zahl.
    lang: text
    code: |
      Gegner: 60 px/s, Physik: 60 Frames/s
      Wind-up der Figur: 8 Frames
    expected: |
      8
    accept:
      - 8 px
      - 8 Pixel
    explanation: |
      60 px/s geteilt durch 60 Frames pro Sekunde ergibt 1 Pixel pro Frame, in 8 Frames also 8 Pixel. Steht der Gegner beim Druck 20 Pixel entfernt und reicht der Angriff 25, ist er im ersten aktiven Frame bei etwa 28 und damit draußen. Wo der Gegner beim Druck stand, sagt deshalb wenig; es zählt, wo er im aktiven Frame steht.
    resources:
      - title: Godot Docs · CharacterBody2D.velocity
        url: https://docs.godotengine.org/en/stable/classes/class_characterbody2d.html#class-characterbody2d-property-velocity

  - id: aufholen-frames
    type: output
    title: Wie lange bis zur Reichweite?
    prompt: |
      Die Figur läuft mit 90 px/s auf einen Gegner zu, der mit 45 px/s flieht (beides Platzhalter). Bis zur Reichweite fehlen 6 Pixel. Wie viele Frames braucht die Figur mindestens? Antworte mit der Zahl.
    lang: text
    code: |
      Figur:   90 px/s
      Gegner:  45 px/s, gleiche Richtung
      Lücke:    6 px
    expected: |
      8
    accept:
      - 8 Frames
    hints:
      - Rechne beide Tempi in Pixel pro Frame um.
      - Pro Frame schrumpft die Lücke um die Differenz.
    explanation: |
      90 px/s sind 1,5 Pixel pro Frame, 45 px/s sind 0,75. Die Lücke schrumpft um 0,75 Pixel pro Frame. 6 ÷ 0,75 = 8 Frames, rund 133 ms. Stünde der Gegner still, wären es 6 ÷ 1,5 = 4 Frames. Flieht er mit halbem Tempo der Figur, dauert das Aufholen doppelt so lange.
    resources:
      - title: Godot Docs · 2D movement overview
        url: https://docs.godotengine.org/en/stable/tutorials/2d/2d_movement.html

  - id: rechtecke-ergaenzen
    type: gap
    title: Zwei Achsen, zwei Bedingungen
    prompt: |
      Ergänze die Prüfung, ob sich zwei achsenparallele Rechtecke überlappen. Ein Rechteck ist `(links, oben, rechts, unten)`, berührende Ränder zählen als Überlappung.
    lang: python
    code: |
      def ueberlappt(a, b):
          x_ok = a[0] <= b[2] and ⟦b[0] <= a[2]⟧
          y_ok = a[1] <= b[3] and ⟦b[1] <= a[3]⟧
          return ⟦x_ok and y_ok⟧
    gaps:
      - label: x-Achse, zweite Hälfte
        hint: Der linke Rand von b darf nicht rechts vom rechten Rand von a liegen.
        accept: ["a[2] >= b[0]"]
      - label: y-Achse, zweite Hälfte
        hint: Dieselbe Bedingung für oben und unten.
        accept: ["a[3] >= b[1]"]
      - label: Ergebnis
        hint: Beide Achsen müssen sich überlappen.
        accept: ["y_ok and x_ok"]
    explanation: |
      Auf einer Achse überlappen zwei Strecken, wenn jede beginnt, bevor die andere endet. Das sind zwei Vergleiche je Achse. Erst wenn beide Achsen überlappen, überlappen die Rechtecke. Mit `<` statt `<=` würden berührende Ränder nicht zählen; in der Testszene hat Godot sie als Treffer gemeldet, deshalb nutzt das Modell `<=`.
    resources:
      - title: Godot Docs · RectangleShape2D
        url: https://docs.godotengine.org/en/stable/classes/class_rectangleshape2d.html

  - id: ziel-als-punkt
    type: bug
    title: Der Gegner ist kein Punkt
    prompt: |
      Das Modell soll prüfen, ob eine kreisförmige Hitbox eine kreisförmige Hurtbox trifft. Eine Hitbox mit Radius 7 und eine Hurtbox mit Radius 6, deren Mitten 10 Pixel auseinander liegen, überlappen sich deutlich. Das Programm gibt aber `False` aus. Finde die Zeile und korrigiere sie.
    lang: python
    code: |
      import math

      def trifft(hx, hy, hr, zx, zy, zr):
          abstand = math.hypot(zx - hx, zy - hy)
          return abstand <= hr

      print(trifft(0, 0, 7, 10, 0, 6))
    lines: [5]
    fix:
      - line: 5
        answers:
          - return abstand <= hr + zr
          - return abstand <= zr + hr
          - return hr + zr >= abstand
    explanation: |
      Die Zeile prüft nur, ob die **Mitte** des Ziels in der Hitbox liegt. Die Hurtbox hat aber selbst einen Radius. Zwei Kreise überlappen, wenn der Mittenabstand höchstens die Summe beider Radien ist: 10 ≤ 7 + 6. Derselbe Fehler steckt in jeder Reichweitenrechnung, die bis zur Gegnermitte misst. Er lässt Angriffe im Modell zu kurz erscheinen, und wer danach abstimmt, macht die Hitbox größer als nötig.
    resources:
      - title: Godot Docs · CircleShape2D
        url: https://docs.godotengine.org/en/stable/classes/class_circleshape2d.html

  - id: vorderkante-falsch
    type: bug
    title: Eine Notiz mit zu viel Reichweite
    prompt: |
      Du notierst die Hitbox des Platzhalterangriffs für eine Vorgabe. Mit dieser Notiz rechnest du eine Reichweite nach rechts von 32 Pixeln aus, im Test trifft der Angriff ab 26 Pixeln nicht mehr. Finde die Zeile und korrigiere sie.
    lang: text
    code: |
      Hitbox Platzhalterangriff (Testszene)
      Form        Rechteck 14 × 10 px
      Lage        Mitte 12 px vor der Figurenmitte
      Vorderkante 26 px vor der Figurenmitte
      Hinterkante 5 px vor der Figurenmitte
    lines: [4]
    fix:
      - line: 4
        answers:
          - Vorderkante 19 px vor der Figurenmitte
    explanation: |
      Die Vorderkante liegt eine halbe Länge vor der Mitte der Hitbox: 12 + 14 / 2 = 19. Die Notiz hat die ganze Länge addiert. Die Hinterkante (12 − 7 = 5) war richtig, das hätte auffallen können: Vorder- und Hinterkante müssen 14 Pixel auseinanderliegen. Mit 19 Pixeln Vorderkante und 6 Pixeln halber Dummy-Breite ergibt sich die gemessene Reichweite von 25 Pixeln.
    resources:
      - title: Godot Docs · RectangleShape2D
        url: https://docs.godotengine.org/en/stable/classes/class_rectangleshape2d.html

  - id: schraeg-weiter
    type: explain
    title: Schräg trifft es weiter
    prompt: |
      Gemessen mit Godot 4.7.2: Derselbe Platzhalterangriff trifft den Dummy nach rechts bis 25 Pixel Abstand, nach unten bis 27 und schräg im Winkel von 45° bis knapp 29. Erkläre in wenigen Sätzen, woher die Unterschiede kommen.
    lang: text
    code: |
      Hitbox  14 × 10, Mitte 12 px vor der Figur,
              dreht sich mit dem Pivot
      Hurtbox 12 × 16, dreht sich nicht
      rechts   trifft bis 25 px
      unten    trifft bis 27 px
      45°      trifft bis knapp 29 px
    points:
      - Die Hitbox dreht sich mit, die Hurtbox des Dummys nicht; je nach Richtung treffen andere Seiten aufeinander.
      - Nach unten ragt die Hurtbox mit ihrer langen Seite (16 px) der Hitbox entgegen, deshalb reicht der Angriff weiter als nach rechts.
      - Schräg zeigt eine Ecke des gedrehten Rechtecks nach vorn; die Ecke liegt weiter von der Mitte entfernt als die Seitenmitte.
      - Mit 360°-Bewegung hat jede Richtung ihre eigene Reichweite; prüfen lässt sie sich nur mit Rechnung oder Messung.
    explanation: |
      Ein Rechteck ist nicht in alle Richtungen gleich groß. Nach rechts trifft die Vorderkante der Hitbox auf die schmale Seite der Hurtbox, nach unten auf ihre längere Seite, und schräg zeigt die Ecke der gedrehten Hitbox nach vorn. Daraus folgen drei verschiedene Reichweiten für denselben Angriff. Ob dich das stört, ob du Kreise nimmst oder die Rechtecke anders schneidest, entscheidest du; erst musst du den Unterschied kennen.
    resources:
      - title: Godot Docs · RectangleShape2D
        url: https://docs.godotengine.org/en/stable/classes/class_rectangleshape2d.html

  - id: clip-kollision
    type: practice
    title: "Clip-Analyse: Größe oder Lage?"
    prompt: |
      Sieh dir Sakurais [Always Keep Attack Collision in Mind](https://www.youtube.com/watch?v=rwwF_4blK-o) an (2:41). Notiere zu drei Stellen, was du siehst: die Hitboxen, die größer sind als die Waffe (ab 0:16), das Beispiel für einen Unterschied in der Lage (ab 1:02) und den Schwertschlag, dessen Hitbox vor dem vollen Schwung beginnt (ab 1:55). Schreib danach einen Satz dazu, was „Lage“ in einem Spiel bedeutet, in dem ein Angriff in alle 360° zeigen kann.
    lang: text
    solution: |
      Beispiel für die Form der Notiz:

      0:16  Hitbox deckt mehr als die Faust ab,
            Grund laut Video: schnelle Bewegung.
      1:02  Hitbox und Schlag an verschiedenen
            Stellen: Er lässt die Animation ändern.
      1:55  Hitbox vor dem vollen Schwung, weil
            der Hitstop diese Pose zeigt.
      360°: Die Lage ist die Richtung des Schlags
            im Bild. Zeigt die Hitbox in eine
            andere Richtung als der Arm, stimmt
            die Lage nicht, egal wie groß sie ist.
    checklist:
      - Du hast alle drei Stellen notiert, jeweils mit dem, was du im Bild gesehen hast.
      - Bei jeder Stelle steht, ob es um Größe, Lage oder Timing geht.
      - Dein Satz zur 360°-Ausrichtung nennt, woran du einen Unterschied in der Lage erkennen würdest.
      - Du hast notiert, an welcher Stelle du Sakurais Grenze selbst anders ziehen würdest oder warum nicht.
    explanation: |
      Die Übung trennt drei Arten von Abweichung, die in Gesprächen über „schlechte Hitboxen“ oft vermischt werden: Größe, Lage und Timing. Sakurai erlaubt die erste und die dritte bewusst und lehnt die zweite ab. In der Draufsicht kommt die Richtung dazu: Prüf, ob der Pivot die Hitbox dorthin dreht, wohin die Figur im Bild schlägt. Deine eigene Grenze darfst du anders ziehen; wichtig ist, dass du sie benennen kannst.
    resources:
      - title: Masahiro Sakurai · Always Keep Attack Collision in Mind
        url: https://www.youtube.com/watch?v=rwwF_4blK-o

  - id: reichweite-notieren
    type: practice
    title: Reichweite eines eigenen Angriffs aufschreiben
    prompt: |
      Skizziere für einen Angriff, den du dir vorstellst, die Hitbox: Form, Größe und Lage relativ zur Figurenmitte. Nimm als Ziel einen neutralen Trainingsgegner mit einer Hurtbox, deren Größe du selbst festlegst. Rechne aus, bis zu welchem Mittenabstand der Angriff nach rechts und nach unten trifft, und wie viele Frames die Figur braucht, um 10 Pixel auf einen fliehenden Gegner aufzuholen. Schreib **vor** dem Test in der Szene auf, was du erwartest. Alle Werte sind Platzhalter, die du wählst.
    lang: text
    solution: |
      Beispiel für die Form, nicht für die Werte.
      Platzhalter der Testszene:

      Hitbox:      Rechteck 14 × 10, Mitte 12 px voraus
      Ziel:        Hurtbox 12 × 16
      Reichweite:  rechts 19 + 6 = 25 px
                   unten  19 + 8 = 27 px
      Tempo:       Figur 90 px/s, Gegner 60 px/s
      Aufholen:    10 / 0,5 = 20 Frames
      Erwartung:   Nach unten trifft es spürbar
                   weiter, das merke ich beim Spielen.
      Nach dem Test: Form, Größe oder Lage ändern?
    checklist:
      - Form, Größe und Lage der Hitbox stehen relativ zur Figurenmitte da, in Pixeln.
      - Du hast die Reichweite für mindestens zwei Richtungen ausgerechnet und erklärt, warum sie sich unterscheidet oder nicht.
      - Die Aufholzeit steht in Frames, mit Tempo in Pixel pro Frame als Zwischenschritt.
      - Deine Erwartung stand fest, bevor du etwas getestet hast.
      - Kein Wert ist als „richtig“ markiert; alle sind als Platzhalter gekennzeichnet.
    explanation: |
      Die Notiz ist die Form, in der du Flächen später an einen Coding-Agenten weitergibst: jede Fläche mit Form, Größe, Lage und Bezugspunkt. Die Rechnung zeigt dir vorab, wie Richtung, Zielgröße und Tempo die Reichweite verändern. Ob ein Rechteck oder ein Kreis besser zu deinem Angriff passt und wie weit er reichen soll, entscheidest du beim Spielen in der Testszene. Gibt es dort eine Abweichung zur Rechnung, prüfst du zuerst das Log und die Debug-Anzeige, dann deinen Wert.
    resources:
      - title: Godot Docs · Overview of debugging tools · Visible collision shapes
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html#visible-collision-shapes
