id: hitboxen
title: Reichweite, Hitboxen und Hurtboxen in der Draufsicht
level: 2
minutes: 100
summary: Was Hitbox und Hurtbox sind, warum Sakurai eine Hitbox größer als die Waffe erlaubt, aber nicht an anderer Stelle, und wie du Reichweite in der Draufsicht nachrechnest, wenn Figuren sich in alle Richtungen drehen und bewegen.
goals:
  - Du unterscheidest Hitbox, Hurtbox und Disjointed Hitbox und erklärst, wo sie vom Bild abweichen dürfen und wo nicht.
  - Du prüfst, ob sich zwei achsenparallele Rechtecke oder zwei Kreise überlappen, und rechnest daraus die Reichweite eines Angriffs.
  - Du erklärst, warum Reichweite in der Draufsicht von der Richtung und von der Form der Flächen abhängt.
  - Du rechnest Geschwindigkeiten in Pixel pro Frame um und bestimmst, wie viele Frames eine Figur braucht, um einen Abstand aufzuholen.
  - Du beschreibst, wie Kollisionsebenen und die Debug-Anzeige helfen, einen strittigen Treffer zu klären.
