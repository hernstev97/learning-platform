id: grosse-gegner
title: Große Kreaturen als Bosse
level: 3
minutes: 120
summary: Was ein großer Gegner in der Draufsicht anders macht – Größe und Lesbarkeit, Hurtbox-Zonen und Schwachpunkte, Phasen, Kamera, Vorhersagbarkeit und Unterbrechbarkeit –, an veröffentlichten Spielen und dem neutralen großen Trainingsgegner der Testszene.
place: unterwegs
goals:
  - Du rechnest aus, ob ein Telegraph reicht, um eine Fläche zu Fuß oder mit dem Ausweichen zu verlassen.
  - Du erklärst, wie Hurtbox-Zonen und Schwachpunkte mit der Besiegmethode zusammenhängen, an Hades und Shadow of the Colossus.
  - Du beschreibst, wie veröffentlichte Spiele Bosskämpfe in Phasen teilen und was Phasenwechsel kosten.
  - Du benennst Kamera-Techniken für große Gegner (zoom-to-fit, cue-focus) und ihre Grenzen bei pixelgenauer Darstellung.
  - Du stellst für einen eigenen großen Gegner die Fragen, die du beantworten musst, ohne dass dir jemand die Antworten vorgibt.
