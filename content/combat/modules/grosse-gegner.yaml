    url: https://gdcvault.com/play/1034367/Refining-the-Rogues-Gallery-Building
lesson: |
  Für Shadow of the Colossus gab Fumito Ueda den Grafikern laut ihrem Kollegen Suzuki nur zwei Dinge vor: „the size of the Colossus and the pixel resolution of the screen“ ([GlitterBerri](https://glitterberri.com/extended-developer-interview/the-graphic-designers-tell-it-straight/)). Größe und Auflösung zusammen bestimmen, was der Spieler von einem großen Gegner überhaupt sehen kann. In einem Spiel mit 320 × 180 Pixeln in der Draufsicht ist das die erste Frage bei jeder großen Kreatur.

  Du entwirfst eigene große Kreaturen als Bosse. Dieses Modul entwirft keine davon. Es zeigt, welche Fragen veröffentlichte Spiele an große Gegner gestellt haben, und rechnet am **großen Trainingsgegner** der Testszene: dieselbe Logik wie der Trainingsgegner, aber groß, mit den Hurtbox-Zonen `kopf` und `bein` und einer großen Angriffsfläche. Alle Werte dort sind Platzhalter. Die Antworten für deine Kreaturen findest du selbst.

  ## Größe und Lesbarkeit in der Draufsicht

  Ein großer Gegner deckt einen großen Teil des Bildes ab, und seine Angriffe treffen große Flächen. Daraus folgen drei Fragen:

  - Sieht der Spieler die ganze Fläche, die gleich getroffen wird, oder nur den Teil im Bild?
  - Erkennt er am Körper, was als Nächstes kommt, wenn der Körper größer ist als die Figur?
  - Reicht die Ankündigung, um aus der Fläche herauszukommen?

  Bei Cuphead kam die Größe früh. Jared Moldenhauer von Studio MDHR sagt, man habe oft zuerst entworfen, wie ein Boss sich spielt: „There's a feeling for the size of the boss or where it is situated on screen“, und erst danach das Konzept gezeichnet ([Kotaku](https://kotaku.com/cuphead-developers-talk-cut-bosses-and-whats-in-the-cup-1820126327)).

  Die dritte Frage lässt sich rechnen. Ein Frame ist ein Physik-Tick, 1/60 Sekunde. Die Figur der Testszene läuft mit `move_speed = 90` Pixeln pro Sekunde, das Ausweichen bewegt sie mit `dodge_speed = 220`, beides Platzhalter. Für einen Weg von N Pixeln braucht sie:

  ```text
  Frames = Pixel / (px/s) × 60, aufgerundet
  ```

  Aufgerundet, weil eine Figur, die nach 26 Frames 39 Pixel weit ist, aus einer Fläche mit 40 Pixeln Radius noch nicht heraus ist. Als Modell:

  ```python run
  import math

  def frames_raus(weg_px, px_pro_s):
      return math.ceil(weg_px * 60 / px_pro_s)

  # Platzhalter der Testszene
  print(frames_raus(40, 90))   # laufen
  print(frames_raus(40, 220))  # ausweichen
  ```

  40 Pixel zu Fuß dauern 27 Frames, mit dem Ausweichen 11. Bei einem Telegraph von 20 Frames reicht Laufen also nicht, selbst wenn der Spieler im ersten Frame reagiert. Das Modell lässt bewusst einiges weg: die Reaktionszeit, die Größe der Hurtbox der Figur (ihre halbe Breite kommt zum Weg dazu) und den genauen Frame, in dem Godot die Überlappung prüft. Es sagt nur: Reicht es nicht einmal im besten Fall, kommt niemand zu Fuß heraus.

  Rechne `weg_px * 60` zuerst und teile dann. 93 Pixel bei 90 px/s ergeben so exakt 62,0 Frames. Andersherum, `93 / 90 * 60`, liefert die Gleitkommarechnung 62,00000000000001, und das Aufrunden macht daraus 63.

  > [!MERKE]
  > Eine große Fläche ist eine Rechenaufgabe, bevor sie ein Gefühl ist. Weg in Pixeln, Geschwindigkeit, Telegraph in Frames: Wenn die Rechnung nicht aufgeht, hilft kein Tuning am Gefühl.

  ## Zonen und Schwachpunkte: Design folgt der Besiegmethode

  Ein großer Gegner hat oft mehrere Stellen, an denen er getroffen werden kann. In der Testszene ist das eine Hurtbox je Zone, jede ein direktes Kind des Gegners, mit eigenem Namen und eigenem Faktor:

  ```gdscript
  @export var zone := &"body"
  @export var damage_multiplier := 1.0
  ```

  Der große Trainingsgegner hat zwei davon, `kopf` und `bein`. Ein Treffer steht im Log mit Zone und Schaden, etwa `getroffen: Zone bein, Schaden 1.0`. Berührt ein Schlag beide Zonen in derselben aktiven Phase, zählt er trotzdem nur einmal: Die Figur merkt sich getroffene Gegner in `already_hit` und erkennt sie am Elternknoten der Hurtbox (siehe [Testszene: Angriff mit Frame-Daten](/combat/testszene-angriff)). Welche der beiden Zonen dann zählt, bestimmt die Reihenfolge, in der Godot die Überlappungen meldet; in einem gemessenen Lauf mit einer Hitbox, die beide berührte, war es `bein`, nicht `kopf`. Weil die Zonen verschieden viel Schaden nehmen, ist diese Reihenfolge eine Frage, die du bewusst regelst, wenn sie für dein Spiel zählt.

  Welche Zone wann erreichbar ist und was ein Treffer dort ändert, ist keine technische Frage. Bei Hades beschreibt Combat Designer Eduardo Gorinstein die Hydra so: „The hydra has regenerating heads, but he has the main head.“ Der Mythos, nach dem man erst alle Nebenköpfe abschlägt und dann den Hauptkopf töten kann, habe die Struktur der Kämpfe beeinflusst ([DigiPen](https://digipen.edu/showcase/news/eduardo-gorinstein-delivers-challenge-and-fun-hades)). Die Reihenfolge der Ziele ist dort der Kampf.

  Shadow of the Colossus geht noch weiter. Ueda: „The design of the Colossi is closely related to how you go about defeating them“ ([GlitterBerri](https://glitterberri.com/extended-developer-interview/the-graphic-designers-tell-it-straight/)). Das Team plante zuerst 48 Kolosse, kürzte auf 24 und landete bei 16. Es prüfte, dass sich die Besiegmethoden nicht überschneiden. Eine Technik, die das Team „transforming collision“ nannte, machte Haltung und Timing glaubwürdig, wenn Wander von einem sich bewegenden Koloss stürzt ([GlitterBerri](https://glitterberri.com/extended-developer-interview/making-of-the-colossi/)).

  ### Die Arena hängt am Boss

  Bei Shadow of the Colossus änderte sich mit einem Koloss oft auch sein Ort. Lief ein Test schlecht, änderte das Team laut Niwa den Koloss, „we'd end up having to alter the arena as well“. Die Teams für Gelände und Figuren tauschten sich deshalb ständig aus. Bei Cuphead war für die dritte Phase des Riesen Glumstone von Anfang an ein anderer Untergrund geplant als für die ersten beiden ([Game Informer](https://gameinformer.com/feature/2022/12/27/how-studio-mdhr-builds-a-cuphead-boss)). Titan Souls lässt den Spieler nach einem Tod außerhalb des Bossraums wieder erscheinen, nicht darin ([Game Developer](https://www.gamedeveloper.com/design/game-design-deep-dive-one-hit-kills-in-i-titan-souls-i-)). Auch der Weg zurück gehört zur Arena.

  > [!PRAXIS] Bauen, testen, abstimmen, wieder testen
  > Suzuki beschreibt die Arbeit an den Kolossen als „repeating cycle of creating something, testing it, tuning it, and testing it out once more“ ([GlitterBerri](https://glitterberri.com/extended-developer-interview/the-graphic-designers-tell-it-straight/)). Große Gegner sind teuer: Ändert sich die Besiegmethode, ändern sich Zonen, Animation und Arena mit. Halte deshalb früh fest, welche Frage der Kampf stellt, und teste diese Frage mit grauen Kästen, bevor jemand Pixelart zeichnet.

  ## Phasen: den Kampf in Abschnitte teilen

  Viele Bosskämpfe wechseln in Phasen. Eine Phase ist ein Abschnitt mit eigenen Angriffen, eigenem Muster oder eigener Arena. Beispiele aus veröffentlichten Spielen:

  - **Cuphead**: Der Kampf gegen Glumstone the Giant aus The Delicious Last Course hat drei Phasen. Eine Idee mit einem Springseil flog raus, weil „the swinging motion created issues with projectile timing“. Studio MDHR strebt letzte Phasen an, die „neither the longest nor the most difficult“ sind, und der ganze Kampf geht in unter zwei Minuten ([Game Informer](https://gameinformer.com/feature/2022/12/27/how-studio-mdhr-builds-a-cuphead-boss)).
  - **Furi**: Wer eine Phase gewinnt, bekommt „a square of life“ zurück ([GOG](https://gog.com/news/gog_interview_the_game_bakers_and_furis_success)). Zwei Bosse sind laut Emeric Thoa gewollte Spitzen, „made to require perseverance“ ([DualShockers](https://www.dualshockers.com/furi-third-seventh-boss-hard/)).
  - **Hades**: Patch 025 sagt: „Boss foes switch between phases faster (their invulnerability periods are shorter)“ ([Patchnotes](https://www.supergiantgames.com/blog/hades-big-bad-update-patch-notes/)). Ein Phasenwechsel mit Unverwundbarkeit kostet Zeit, in der der Spieler nichts tun kann.
  - **Titan Souls**: Mark Foster beschreibt den klassischen Zelda-Kampf als Erkennen, Ausführen und zweimaliges Wiederholen. Titan Souls verdichtet das auf einen einzigen Treffer, und das „increased the tension of the encounter dramatically“ ([Game Developer](https://www.gamedeveloper.com/design/game-design-deep-dive-one-hit-kills-in-i-titan-souls-i-)).

  Der Trainingsgegner der Testszene kennt keine Phasen. Er spielt eine Liste `attacks` der Reihe nach ab. Eine Phase wäre eine andere Liste ab einer Bedingung, etwa nach einer Zahl von Treffern. Ob deine Bosse Phasen haben, wann sie wechseln und was der Wechsel kostet, entscheidest du.

  ## Kamera: was im Bild sein muss

  Itay Keren hat Kamera-Techniken aus Side-Scrollern gesammelt und benannt ([Scroll Back](https://www.gamedeveloper.com/design/scroll-back-the-theory-and-practice-of-cameras-in-side-scrollers)). Zwei Begriffe aus seinem Glossar passen zu großen Gegnern:

  - **zoom-to-fit**: „Change zoom or move forward/back to provide a close-up view of relevant elements“.
  - **cue-focus**: „Focus is influenced by game world cues (e.g. attractors)“. Objekte und Kreaturen ziehen die Kamera an, und Bosskämpfe nennt er „obvious candidates for this approach“.

  Er beschreibt auch, wie Kameras Gegner verstecken. Bei Rastan Saga bewegt sich die Figur in einem Kamerafenster, bevor die Kamera folgt, und Gegner von oben fallen dadurch weniger auf. Glättung mit lerp kann bei großen, sehr schnellen Figuren dazu führen, dass die Figur den Bildrand erreicht, bevor die Kamera nachzieht, „keeping incoming enemies hidden till the last minute“. Der Artikel behandelt Side-Scroller. Die Übertragung auf die Draufsicht ist deine Arbeit.

  Zoom-to-fit verträgt sich schlecht mit pixelgenauer Darstellung. Die Testszene rendert 320 × 180 Pixel und skaliert ganzzahlig hoch (siehe [Godot-Start](/combat/godot-start)). Pixelart bleibt dabei nur bei ganzzahligen Vergrößerungen gleichmäßig. Ein Boss, der nicht ins Bild passt, braucht also andere Antworten: Kamera verschieben, Teile außerhalb des Bildes ankündigen oder den Gegner so groß machen, wie das Bild es erlaubt.

  Auch die Perspektive ist eine Antwort. Acid Nerve hat für Death's Door früh experimentiert und sich für eine isometrische Ansicht entschieden, anders als die Draufsicht von Titan Souls: „You also get a clearer view of two angles“ ([Press Start](https://press-start.com.au/features/2021/03/27/we-spoke-to-the-team-at-acid-nerve-about-the-stylish-looking-deaths-door/)). Zum Ansehen: Kerens GDC-Vortrag [Boss Up](https://www.youtube.com/watch?v=48Ymh4Ge5j8) und der Clip [How to Make a Good 2D Camera](https://www.youtube.com/watch?v=TdWFzpgnljs) von Game Maker's Toolkit.

  ## Vorhersagbar und auf dem Kern-Kampfsystem

  Ein großer Gegner ist schwer zu überblicken. Umso mehr hängt daran, dass man ihn lesen kann. Die Entwickler von Titan Souls schreiben, die Kämpfe seien „primarily meant to be predictable once the player understands them“. Der Boss Eyecube bewegt sich auf einem Schachbrett ein Feld nach dem anderen und feuert nach jeweils vier Bewegungen einen Laser in Blickrichtung ([Game Developer](https://www.gamedeveloper.com/design/game-design-deep-dive-one-hit-kills-in-i-titan-souls-i-)). Monster Hunter gibt Hinweise über Zustände der Monster, „such as alarmed, enraged, exhausted“ ([Nintendo Life](https://nintendolife.com/news/2015/02/monster_hunter_4_ultimate_director_discusses_monster_design_and_animation)). Bei Silksong hat Team Cherry die Bosse umgebaut: Sie „decide what they want to do and then move into the correct position to do it“ ([Military.com](https://www.military.com/off-duty/games/silksong-devs-explain-how-bosses-were-designed-differently-those-hollow-knight.html)). Erst die Absicht, dann der Weg: Der Spieler sieht die Positionierung und kann daraus lesen, was kommt.

  Insomniac hat für Marvel's Spider-Man 2 die Bosskämpfe auf das Kern-Kampfsystem gestellt. Laut der Beschreibung des GDC-Vortrags von Adam Noonchester entstand das Spektakel „through core combat instead of via one-off, lock-and-key mechanics and disabling player abilities“ ([GDC Vault](https://gdcvault.com/play/1034367/Refining-the-Rogues-Gallery-Building)). Was der Spieler im ganzen Spiel lernt, zählt auch beim Boss.

  Dazu gehört die Frage, ob Treffer einen großen Gegner unterbrechen. Die Testszene hat dafür `interruptible`. Steht es auf `false`, zählt der Treffer, der Gegner blinkt, aber er geht nicht in den Hitstun und wird nicht zurückgestoßen. Er setzt seinen Angriff fort. Den Hitstop, das kurze Einfrieren beim Treffer, bekommt er trotzdem: Im gemessenen Lauf mit dem großen Trainingsgegner rückt sein nächster Telegraph nach einem Treffer um die 4 Frames Hitstop nach hinten. Ein Punish ist dann Schaden in seine Erholung, kein Abbruch seines Angriffs.

  > [!INTERVIEW] Designtest: „Der Boss soll groß wirken, aber Tester werden von Flächen getroffen, die sie nicht gesehen haben“
  > Gute Antwort: erst klären, was „nicht gesehen“ heißt. Lag die Fläche außerhalb des Bildes, war der Telegraph zu kurz für den Weg hinaus, oder hat der Körper des Gegners die Markierung verdeckt? Die zweite Frage rechnest du aus: Weg in Pixeln, Geschwindigkeit, Telegraph-Frames. Für die erste nennst du Kamera-Techniken wie cue-focus oder Ankündigungen am Bildrand, für die dritte prüfst du, ob die Markierung über oder unter dem Körper gezeichnet wird. Dann änderst du eine Größe und testest wieder. Wie groß der Boss am Ende ist, bleibt eine Designentscheidung, die du begründest, nicht eine Zahl, die man auswendig weiß.

  ## Häufige Fehler

  - **Größe zuerst, Lesbarkeit danach.** Ein Gegner, der den halben Bildschirm füllt, kann seine eigenen Markierungen verdecken. Größe und Auflösung gehören an den Anfang, wie bei Shadow of the Colossus.
  - **Flächen, aus denen man nicht herauskommt.** Weg in Pixeln durch Geschwindigkeit mal 60, aufgerundet: Ist das mehr als der Telegraph, entkommt niemand zu Fuß.
  - **Abrunden statt aufrunden.** 26,7 Frames heißt 27. Mit 26 ist die Figur noch einen Pixel in der Fläche.
  - **Zonen ohne Bedeutung.** Kopf und Bein mit gleichem Faktor und gleicher Erreichbarkeit sind zwei Namen für dieselbe Hurtbox.
  - **Die Dauer des Phasenwechsels nicht messen.** Unverwundbarkeit beim Wechsel ist Zeit, in der der Spieler nichts tun kann. Supergiant hat sie in Hades nach Playtests verkürzt; ob sie in deinem Kampf eine Pause oder eine Bühne sein soll, entscheidest du mit der Zahl im Log.
  - **Übersehen, was ein Boss prüft.** Ein Boss, der gelernte Fähigkeiten abschaltet oder eigene Regeln mitbringt, prüft etwas anderes als der Rest des Spiels. Insomniac baute die Bosse von Spider-Man 2 deshalb auf dem Kern-Kampfsystem auf, Shadow of the Colossus gibt jedem Koloss eine eigene Besiegmethode. Beides geht; wichtig ist, dass du weißt, welches du baust.
  - **Zoom für die Übersicht in Pixelart.** Krumme Zoomstufen verzerren Pixel. Plane Kamera und Größe zusammen.
  - **Unterbrechbarkeit vergessen.** Ohne bewusste Entscheidung reagiert der Boss wie ein kleiner Gegner auf jeden Treffer, oder auf keinen.

  ## Zusammenfassung

  - Größe und Auflösung bestimmen zusammen, was der Spieler sieht. Shadow of the Colossus setzte beides als erste Vorgabe.
  - Ob ein Telegraph reicht, ist eine Rechnung: Pixel / (px/s) × 60, aufgerundet, gegen die Telegraph-Frames.
  - Hurtbox-Zonen tragen Namen und Faktoren. Ein Schlag zählt je Gegner einmal, auch über zwei Zonen.
  - Design und Besiegmethode hängen zusammen: Hydra mit Nebenköpfen, Kolosse mit eigener Methode und eigener Arena.
  - Phasen gliedern den Kampf. Phasenwechsel mit Unverwundbarkeit kosten Zeit.
  - Zoom-to-fit und cue-focus helfen bei großen Gegnern, ganzzahlige Pixelart begrenzt den Zoom.
  - Vorhersagbarkeit kommt aus Mustern, Zuständen und Bossen, die erst entscheiden und dann Position beziehen.
  - `interruptible = false` verhindert Hitstun und Knockback, nicht den Hitstop.
exercises:
  - id: besiegmethode-design
    type: choice
    title: Wie man gewinnt, prägt, wie er aussieht
    prompt: |
      Welche Aussagen geben die Quellen zu Hades und Shadow of the Colossus richtig wieder?
    options:
      - text: Ueda sagt, das Design der Kolosse hänge eng damit zusammen, wie man sie besiegt.
        correct: true
        why: „The design of the Colossi is closely related to how you go about defeating them.“
      - text: Das Team von Shadow of the Colossus prüfte, dass sich die Besiegmethoden der Kolosse nicht überschneiden.
        correct: true
        why: Ueda beschreibt, dass jede Methode sich von der eines anderen Kolosses unterscheiden sollte.
      - text: Bei der Hydra in Hades ist der Hauptkopf von Anfang an das einzige Ziel.
        correct: false
        why: Gorinstein nennt nachwachsende Nebenköpfe und einen Hauptkopf. Der Mythos, erst die Nebenköpfe, dann der Hauptkopf, prägte die Struktur.
      - text: Shadow of the Colossus war von Anfang an mit 16 Kolossen geplant.
        correct: false
        why: Zuerst waren es 48, dann 24, am Ende 16.
    explanation: |
      In beiden Spielen folgt die Gestalt des Gegners aus der Frage, wie man ihn besiegt. Bei der Hydra legt die Reihenfolge der Köpfe den Ablauf fest, bei den Kolossen bestimmt die Besiegmethode Körper und Arena. Für Hurtbox-Zonen heißt das: Eine Zone ist erst dann ein Schwachpunkt, wenn der Kampf festlegt, wann und warum man sie trifft.
    resources:
      - title: DigiPen · Eduardo Gorinstein über Hades
        url: https://digipen.edu/showcase/news/eduardo-gorinstein-delivers-challenge-and-fun-hades
      - title: GlitterBerri · The Making of the Colossi
        url: https://glitterberri.com/extended-developer-interview/making-of-the-colossi/

  - id: vorhersagbar-quellen
    type: choice
    title: Lesbare Riesen
    prompt: |
      Welche Aussagen über Vorhersagbarkeit großer Gegner stimmen laut den Quellen?
    options:
      - text: Die Kämpfe in Titan Souls sollen vorhersagbar sein, sobald der Spieler sie verstanden hat.
        correct: true
        why: „fights are primarily meant to be predictable once the player understands them“.
      - text: Bosse in Silksong entscheiden zuerst, was sie tun, und gehen dann in Position.
        correct: true
        why: So beschreibt es William Pellen. In Hollow Knight richteten sie sich stärker nach der Position des Spielers.
      - text: Spider-Man 2 baut Bosskämpfe vor allem auf einmalige Sondermechaniken und schaltet Fähigkeiten des Spielers ab.
        correct: false
        why: Das Gegenteil. Laut Vortragsbeschreibung entsteht das Spektakel über das Kern-Kampfsystem statt über solche Mechaniken.
      - text: Monster Hunter verbirgt die Zustände seiner Monster, damit sie unberechenbar bleiben.
        correct: false
        why: Fujioka beschreibt Hinweise über Zustände wie „alarmed, enraged, exhausted“.
    explanation: |
      Alle vier Spiele machen große Gegner lesbar, auf verschiedenen Wegen: feste Muster (Titan Souls), sichtbare Absicht durch Positionierung (Silksong), sichtbare Zustände (Monster Hunter) und bekannte Werkzeuge (Spider-Man 2). Ein großer Gegner, dessen Verhalten man nicht lernen kann, wirkt nicht groß, sondern zufällig.
    resources:
      - title: Military.com · Silksong Devs Explain How Bosses Were Designed Differently
        url: https://www.military.com/off-duty/games/silksong-devs-explain-how-bosses-were-designed-differently-those-hollow-knight.html

  - id: rechenweg-flaeche
    type: order
    title: Kommt die Figur heraus?
    prompt: |
      Bring die Schritte der Rechnung in eine richtige Reihenfolge: Reicht ein Telegraph, um zu Fuß aus einer Fläche zu kommen?
    lang: prose
    lines: |
      Weg bis zum Rand messen (Pixel)
      mal 60 nehmen
      durch Pixel pro Sekunde teilen
      auf ganze Frames aufrunden
      mit den Telegraph-Frames vergleichen
    alternatives:
      - [1, 3, 2, 4, 5]
    explanation: |
      Ohne Weg gibt es nichts zu rechnen, und ohne ganze Frames nichts zu vergleichen. Ob du zuerst mit 60 malnimmst oder zuerst teilst, ist mathematisch gleich; im Modell rechnet Python zuerst `weg_px * 60`, damit glatte Werte exakt bleiben. Aufgerundet wird erst am Ende, sonst rundest du Zwischenergebnisse und verschiebst das Ergebnis.
    resources:
      - title: Python · math.ceil
        url: https://docs.python.org/3/library/math.html#math.ceil

  - id: radien-pruefen
    type: output
    title: Welche Flächen gehen zu Fuß?
    prompt: |
      Telegraph 30 Frames, `move_speed = 90`, alles Platzhalter. Was gibt das Modell aus?
    lang: python
    code: |
      import math

      TELEGRAPH = 30

      def frames_raus(weg_px, px_pro_s):
          return math.ceil(weg_px * 60 / px_pro_s)

      ok = [r for r in (30, 45, 50, 60)
            if frames_raus(r, 90) <= TELEGRAPH]
      print(frames_raus(50, 90), ok)
    expected: |
      34 [30, 45]
    hints:
      - 50 × 60 / 90 ist 33,3.
      - 45 Pixel brauchen genau 30 Frames.
    explanation: |
      30 Pixel brauchen 1800 / 90 = 20 Frames, 45 Pixel genau 30. Beide passen in 30 Frames Telegraph, 45 gerade so. 50 Pixel ergeben 33,3, aufgerundet 34; 60 Pixel 40. Der Grenzfall 45 zeigt, warum `<=` richtig ist: Eine Figur, die in genau 30 Frames herauskommt, ist im besten Fall rechtzeitig draußen.
    resources:
      - title: Python · math.ceil
        url: https://docs.python.org/3/library/math.html#math.ceil

  - id: ausweichen-50-pixel
    type: output
    title: Mit dem Ausweichen hinaus
    prompt: |
      Wie viele Frames braucht das Ausweichen der Testszene (`dodge_speed = 220`, Platzhalter) für einen Weg von 50 Pixeln? Aufrunden. Antworte mit der Zahl.
    lang: text
    code: |
      Frames = Pixel / (px/s) × 60, aufgerundet
      Pixel  50
      px/s   220
    expected: |
      14
    accept: ["14 Frames"]
    explanation: |
      50 × 60 / 220 = 13,6, aufgerundet 14. Das Ausweichen dauert in der Testszene 18 Frames und trägt 66 Pixel weit, 50 Pixel schafft es also. Ob es auch schützt, hängt an den i-Frames (Frame 2 bis 12), nicht am Weg. Beides trennst du in [Ausweichen, Risiko und Belohnung](/combat/ausweichen).

  - id: zwei-zonen-ein-treffer
    type: output
    title: Kopf und Bein zugleich
    prompt: |
      Ein breiter Schlag der Figur berührt in derselben aktiven Phase die Hurtboxen `kopf` und `bein` des großen Trainingsgegners. Beide sind direkte Kinder des Gegners. Wie viele Treffer zählt der Gegner? Antworte mit der Zahl.
    lang: gdscript
    code: |
      func _on_hitbox_area_entered(area: Area2D) -> void:
      	if not area is Hurtbox or area.get_parent() in already_hit:
      		return
      	if (area as Hurtbox).receive(attack, self):
      		already_hit.append(area.get_parent())
      		hitstop_left = attack.hitstop
    expected: |
      1
    accept: ["1 Treffer", "einen", "einer"]
    explanation: |
      Die erste Zone, die gemeldet wird, zählt, und die Figur merkt sich den Gegner über `get_parent()`. Bei der zweiten Zone ist der Gegner schon in `already_hit`, die Funktion kehrt sofort zurück. Geleert wird die Liste erst beim nächsten Eintritt in die aktive Phase. Ob ein Schlag mehrere Zonen treffen soll, ist eine Designentscheidung; diese Regel ist nur die Startregel der Testszene.
    resources:
      - title: Godot Docs · Area2D.area_entered
        url: https://docs.godotengine.org/en/stable/classes/class_area2d.html#class-area2d-signal-area-entered

  - id: frames-formel
    type: gap
    title: Die Formel als Code
    prompt: |
      Ergänze die Rückgabe: Frames, die die Figur für `weg_px` Pixel mit `px_pro_s` Pixeln pro Sekunde braucht, auf ganze Frames aufgerundet. Ein Frame ist 1/60 Sekunde.
    lang: python
    code: |
      import math

      def frames_raus(weg_px, px_pro_s):
          return ⟦math.ceil⟧(⟦weg_px * 60⟧ / px_pro_s)
    gaps:
      - label: Aufrunden
        hint: Die Funktion aus `math`, die auf die nächste ganze Zahl aufrundet.
      - label: Zähler
        hint: Pixel mal Frames pro Sekunde, dann geteilt durch Pixel pro Sekunde.
        accept: ["60 * weg_px", "weg_px * 60.0"]
    explanation: |
      `weg_px / px_pro_s` sind Sekunden, mal 60 Frames. `math.ceil` rundet auf die nächste ganze Zahl auf. `round` wäre falsch, weil es 26,4 auf 26 abrundet, obwohl die Figur dann noch nicht draußen ist. Zuerst teilen ist mathematisch gleich, kann aber durch Gleitkomma in seltenen Fällen einen Frame mehr ergeben, etwa bei 93 Pixeln und 90 px/s.
    resources:
      - title: Python · math.ceil
        url: https://docs.python.org/3/library/math.html#math.ceil

  - id: kamera-begriffe
    type: gap
    title: Zwei Begriffe von Itay Keren
    prompt: |
      Trag die Begriffe aus Kerens Glossar ein. Der erste ändert Zoom oder Abstand, damit relevante Elemente nah im Bild sind. Beim zweiten ziehen Hinweise in der Welt, etwa Attraktoren, den Fokus an.
    lang: text
    code: |
      ⟦zoom-to-fit⟧: Zoom passt sich an
      ⟦cue-focus⟧: Attraktoren ziehen den Fokus
    gaps:
      - label: Zoom oder Abstand anpassen
        hint: Drei Wörter mit Bindestrichen, beginnt mit „zoom“.
        accept: ["zoom to fit", "Zoom-to-fit", "Zoom to fit"]
      - label: Hinweise ziehen den Fokus
        hint: Zwei Wörter mit Bindestrich, das zweite ist „focus“.
        accept: ["cue focus", "Cue-focus", "Cue focus"]
    explanation: |
      Keren nennt Bosskämpfe „obvious candidates“ für Attraktoren: Der Boss zieht die Kamera an, damit er im Bild bleibt. Zoom-to-fit holt alles Wichtige ins Bild, verträgt sich aber in Pixelart nur mit ganzzahligen Vergrößerungen. Beide Begriffe stammen aus Side-Scrollern; wie sie in der Draufsicht wirken, prüfst du selbst.
    resources:
      - title: Itay Keren · Scroll Back
        url: https://www.gamedeveloper.com/design/scroll-back-the-theory-and-practice-of-cameras-in-side-scrollers

  - id: bossnotiz-rechnung
    type: bug
    title: Die Notiz rechnet falsch
    prompt: |
      Du prüfst eine Fläche des großen Trainingsgegners. Das Ergebnis stimmt, aber eine Zeile darüber nicht. Tippe sie an und korrigiere sie.
    lang: text
    code: |
      Radius: 60 px
      move_speed: 90 px/s
      Frames raus: 30
      Telegraph: 36 Frames
      Ergebnis: reicht nicht
    lines: [3]
    fix:
      - line: 3
        answers: ["Frames raus: 40", "Frames raus: 40 Frames"]
    explanation: |
      60 × 60 / 90 = 40 Frames, bei 1,5 Pixeln pro Frame. Mit 30 hätte die Rechnung „reicht“ ergeben, denn 30 ≤ 36. Das Ergebnis „reicht nicht“ ist richtig, weil 40 > 36. Eine falsche Zwischenzeile ist trotzdem ein Fehler: Wer die Notiz später für einen anderen Telegraph benutzt, rechnet mit der 30 weiter.

  - id: abrunden-statt-aufrunden
    type: bug
    title: Ein Pixel zu wenig
    prompt: |
      Das Modell sagt für 40 Pixel 26 Frames. Nach 26 Frames ist die Figur mit 1,5 Pixeln pro Frame aber erst 39 Pixel weit und steht noch in der Fläche. Finde die Zeile und korrigiere sie.
    lang: python
    code: |
      import math

      def frames_raus(weg_px, px_pro_s):
          return int(weg_px * 60 / px_pro_s)

      print(frames_raus(40, 90))
    lines: [4]
    fix:
      - line: 4
        answers: ["return math.ceil(weg_px * 60 / px_pro_s)", "return math.ceil(60 * weg_px / px_pro_s)", "return math.ceil(weg_px / px_pro_s * 60)"]
    explanation: |
      `int()` schneidet die Nachkommastellen ab: 26,67 wird 26. Gebraucht werden aber ganze Frames, in denen die Figur den Rand erreicht, also aufgerundet 27. Nach 27 Frames ist sie 40,5 Pixel weit. `math.ceil` ist hier schon importiert, wird aber nicht benutzt; ein ungenutzter Import ist oft ein Hinweis auf genau diesen Fehler.
    resources:
      - title: Python · math.ceil
        url: https://docs.python.org/3/library/math.html#math.ceil

  - id: nicht-unterbrechbar
    type: explain
    title: Was interruptible = false bewirkt
    prompt: |
      Erkläre in wenigen Sätzen, was sich ändert, wenn der große Trainingsgegner `interruptible = false` hat, und was gleich bleibt. Gekürzt aus `enemy.gd`:
    lang: gdscript
    code: |
      func take_hit(attack, source, hurtbox) -> bool:
      	hits_taken += 1
      	# … Log-Zeile und Blinken …
      	hitstop_left = attack.hitstop
      	if interruptible:
      		hitstun_frames = attack.hitstun
      		# … Knockback …
      		_enter(State.HITSTUN)
      	return true
    points:
      - Der Treffer zählt weiter, mit Log-Zeile und Blinken.
      - Der Hitstop wirkt weiter, der Gegner hält für `hitstop` Frames an, und sein Ablauf verschiebt sich um diese Frames.
      - Kein Hitstun und kein Knockback, der Gegner bleibt in seinem Zustand und setzt den Angriff fort.
      - Treffer unterbrechen ihn nicht mehr; ein Punish heißt Schaden in seine Erholung, nicht Abbruch seines Angriffs.
    explanation: |
      `interruptible` steuert nur den Teil im `if`: Hitstun und Knockback. Alles davor läuft immer, auch der Hitstop. Im gemessenen Lauf rückt dadurch der nächste Telegraph des großen Trainingsgegners nach einem Treffer um 4 Frames nach hinten. Für den Spieler heißt das: Er kann den Angriff nicht durch Treffer stoppen, sondern muss ausweichen und in die Erholung zurückschlagen. Ob deine großen Gegner unterbrechbar sind, immer, nie oder nur in bestimmten Phasen, entscheidest du.

  - id: clip-cuphead-bosse
    type: practice
    title: "Clip-Analyse: Phasen und Größe"
    prompt: |
      Sieh dir den Clip [How Cuphead's Bosses (Try to) Kill You](https://www.youtube.com/watch?v=F8T6Ul4aHTI) von Game Maker's Toolkit an. Wähle zwei Bosse, die du darin siehst, und notiere zu jedem:

      - wie viele Phasen du erkennst und was sich beim Wechsel ändert,
      - wie viel vom Bild der Boss einnimmt und wo er steht,
      - über welche Kanäle sich ein Angriff ankündigt (Pose, Blinken, Fläche, Ton),
      - eine Stelle, an der du als Spieler nicht wüsstest, wohin.
    lang: text
    solution: |
      Beispiel für die Form, am großen Trainingsgegner der
      Testszene (Werte sind Platzhalter):

      Gegner: großer Trainingsgegner
      Phasen: eine; ein Angriff in der Liste
      Größe im Bild: deutlich größer als die Figur
      Kanäle: nur gelbe Bodenfläche
      Unklar: Steht die Fläche teils außerhalb des
      Bildes, sehe ich nicht, wie weit sie reicht.
    checklist:
      - Zu beiden Bossen stehen Phasen, Größe im Bild und Kanäle.
      - Mindestens eine Notiz beschreibt, was sich beim Phasenwechsel ändert.
      - Du hast eine Stelle notiert, an der dir als Spieler die Information fehlen würde.
      - Was du nur vermutest, ist als Vermutung markiert.
    explanation: |
      Cuphead ist ein Spiel mit großen Bossen und klaren Phasen. Die Übung schult den Blick, mit dem du später eigene große Gegner prüfst: Was ist im Bild, was kündigt sich wie an, und wo fehlt dem Spieler etwas? Was du siehst, beschreibst du; was es für dein Spiel heißt, entscheidest du später.
    resources:
      - title: Game Maker's Toolkit · How Cuphead's Bosses (Try to) Kill You
        url: https://www.youtube.com/watch?v=F8T6Ul4aHTI
      - title: Game Informer · How Studio MDHR Builds A Cuphead Boss
        url: https://gameinformer.com/feature/2022/12/27/how-studio-mdhr-builds-a-cuphead-boss

  - id: fragen-eigener-boss
    type: practice
    title: Die Fragen zu deiner Kreatur
    prompt: |
      Notiere die Fragen, die du für deinen eigenen großen Gegner beantworten musst, bevor du Werte festlegst. Nur Fragen, noch keine Antworten. Decke dabei Größe und Lesbarkeit, Zonen, Phasen, Kamera, Arena und Unterbrechbarkeit ab. Hinter jede Frage schreibst du, woran du die Antwort später prüfst: Rechnung, Log oder Playtest.
    lang: text
    solution: |
      Beispiel für die Form, am großen Trainingsgegner
      der Testszene, nicht für deine Kreatur:

      Stampfer 64 × 40, windup 40: Kommt die Figur
        von (100, 120) zu Fuß heraus?
        Prüfen: Rechnung, dann Log
      Zone kopf: Ist sie aus der Erholung des
        Stampfers erreichbar?
        Prüfen: Log mit Drehbuch
    checklist:
      - Größe, Zonen, Phasen, Kamera, Arena und Unterbrechbarkeit kommen je mindestens einmal vor.
      - Jede Frage nennt, wie du sie prüfst (Rechnung, Log oder Playtest).
      - Die Notiz enthält noch keine Werte für deine Kreatur.
      - Mindestens eine Frage betrifft, was der Spieler sieht, nicht nur, was der Gegner tut.
    explanation: |
      Große Gegner sind teuer zu ändern, weil Zonen, Animation, Kamera und Arena aneinander hängen. Wer die Fragen früh aufschreibt, prüft sie mit grauen Kästen, bevor Pixelart entsteht. Die Liste bleibt deine; die Testszene liefert nur die Werkzeuge, um sie zu beantworten: Rechnung, Log und den großen Trainingsgegner in [Testszene: Ausweichen und Trainingsgegner](/combat/testszene-ausweichen).
    resources:
      - title: GlitterBerri · The Graphic Designers Tell It Straight
        url: https://glitterberri.com/extended-developer-interview/the-graphic-designers-tell-it-straight/
