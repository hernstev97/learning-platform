id: testszene-ausweichen
title: "Testszene: Ausweichen und Trainingsgegner"
level: 2
minutes: 180
summary: Die Figur bekommt ein Ausweichen mit i-Frames, der Dummy einen angekündigten Angriff, und ein großer Trainingsgegner mit zwei Trefferzonen kommt dazu. Unterwegs findest du einen Fehler, der nur mit i-Frames auftritt, und liest an Logs ab, wer nach einer Aktion zuerst wieder handeln kann.
goals:
  - Du baust ein Ausweichen mit einstellbaren i-Frames und sagst vorher, in welchem Frame ein Treffer ankommt oder ausbleibt.
  - Du erklärst, warum die Testszene die Hurtbox während der i-Frames abschaltet, statt Treffer nur abzulehnen.
  - Du richtest einen Trainingsgegner mit Telegraph und einem Muster aus mehreren Angriffen im Inspektor ein.
  - Du liest aus einem Log ab, wie viele Frames ein Punish-Fenster nach dem Ausweichen offen ist.
  - Du baust einen großen Trainingsgegner mit mehreren Hurtbox-Zonen und schaltest seine Unterbrechbarkeit um.
