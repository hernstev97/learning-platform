    url: https://www.youtube.com/watch?v=Fy0aCDmgnxg
lesson: |
  > [!NOTE] Unterwegs
  > Diese Lektion und ihre Übungen gehen am Handy. Die verlinkten Clips brauchen Netz, alles andere ist offline lesbar.

  Stell dir zwei Fassungen desselben Schwertschlags vor. Beide treffen 9 Frames nach dem Druck, beide machen gleich viel Schaden. In der ersten springt die Figur im ersten Frame in eine Ausholpose. In der zweiten steht sie vier Frames still und holt erst dann aus. Auf dem Papier sind beide gleich schnell. Im Spiel siehst du bei der zweiten vier Frames lang nicht, ob dein Druck angekommen ist. Masahiro Sakurai, der Director von Super Smash Bros., baut Angriffe deshalb so, dass der erste Frame sofort eine Reaktion zeigt.

  Dieses Modul legt das Denkmodell für den ganzen Bereich. Es klärt, was Game Feel ist, wie Eingabe, Simulation und Rückmeldung zusammenspielen und warum du Spielgefühl in Frames misst statt in Adjektiven. Du hast eine Draufsicht im Kopf, analoge Bewegung in alle Richtungen und Pixelart. Welche Werte dein Spiel bekommt, entscheidest du. Hier lernst du, sie zu benennen, zu messen und zu vergleichen.

  ## Game Feel nach Swink: sechs Bestandteile

  Steve Swink beschreibt Game Feel als „the tactile sensation of manipulating a digital agent“, also das Gefühl in den Händen, wenn du eine Figur steuerst ([Game Feel: The Secret Ingredient](https://www.gamedeveloper.com/design/game-feel-the-secret-ingredient)). Damit man darüber reden kann, zerlegt er es in sechs Bestandteile. Die rechte Spalte überträgt sie auf ein Actionspiel in der Draufsicht:

  | Bestandteil | Was dazugehört | Beispiel |
  | --- | --- | --- |
  | Input | Ausdruck der Absicht | Stick, Angriffstaste |
  | Response | Verarbeitung in Echtzeit | Tempo, Frames bis Treffer |
  | Context | Raum und Hindernisse | Wände, Abstand zum Gegner |
  | Polish | Animation, Ton, Effekte | Staub, Treffer-Blitz |
  | Metaphor | was die Figur darstellt | ein Riese soll schwer wirken |
  | Rules | Werte mit Bedeutung | Schaden, Lebenspunkte |

  Dieser Bereich arbeitet vor allem an Input, Response und Polish. Context und Rules kommen mit Gegnern und Bossen dazu. Die Metapher nimmt dir keine Zahl ab, sie beeinflusst aber, welche Zahlen passen. Swink schreibt ihr zu, dass sie Bewegung Bedeutung gibt und Vertrautheit schafft. Swinks Metapher fragt, ob Zahl und Bild zusammenpassen. Ob eine riesige Kreatur, die in 3 Frames zuschlägt, schwer wirkt, beurteilst du im Spiel.

  ## Der Kreislauf: Eingabe, Simulation, Rückmeldung

  Swink beschreibt, wie die Rückmeldung so schnell zurückkommt, dass er seine Eingaben laufend nachjustiert: „Feedback returns just as quickly, letting me adjust and fine-tune my instructions.“ Daraus ergibt sich ein Kreislauf, der viele Male pro Sekunde läuft:

  ```text
  Eingabe      Stick, Tasten
     │
     ▼
  Simulation   Zustand, Position, Treffer
     │
     ▼
  Rückmeldung  Bild, Ton, Vibration
     │
     ▼
  Spieler      sieht, entscheidet neu
     │
     └──► nächste Eingabe
  ```

  Die **Simulation** ist, was das Spiel rechnet: In welchem Zustand ist die Figur, wo steht sie, trifft die Hitbox? In Godot läuft sie in `_physics_process`, fest 60-mal pro Sekunde ([Idle and Physics Processing](https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html)). Die **Rückmeldung** ist alles, was der Spieler davon wahrnimmt: Pose, Bewegung, Ton, Vibration. Swinks Response gehört zur Simulation, Polish zur Rückmeldung.

  Jede Station kostet Zeit. Der Druck braucht, bis das Spiel ihn sieht. Die Simulation entscheidet, in welchem Frame der Zustand wechselt. Das Bild muss gezeichnet und angezeigt werden. Wie lang diese Kette ist und was Godot dabei tut, steht in [Eingabe: Reaktionszeit, Latenz und Puffer](/combat/eingabe). Für das Denkmodell reicht: Game Feel entsteht im ganzen Kreislauf. Ein Angriff kann starke Effekte haben und trotzdem träge wirken, weil der Kreislauf an einer anderen Station hängt.

  ## Frames zählen: 60 pro Sekunde, 16,7 ms pro Frame

  Ein **Frame** ist in diesem Kurs ein Physik-Tick in Godot. Standard sind 60 pro Sekunde (`physics/common/physics_ticks_per_second = 60`), ein Frame dauert also 1000 / 60 ≈ 16,7 ms. Mit demselben Wert rechnet Sakurai in „Down with Lag!“ (etwa bei 4:43, [Clip](https://www.youtube.com/watch?v=gjoKKyskco4)). Die Umrechnung als kleines Modell, das du hier ausführen kannst:

  ```python run
  FPS = 60  # Physik-Frames pro Sekunde

  def ms(frames):
      return frames * 1000 / FPS

  def frames(millis):
      return millis * FPS / 1000

  for f in (1, 4, 8, 15):
      print(f"{f} Frames = {ms(f):.1f} ms")
  print(f"130 ms = {frames(130):.1f} Frames")
  ```

  Zwei Dinge zeigt das Modell. Kleine Frame-Zahlen sind große Unterschiede: 4 statt 8 Frames halbieren die Wartezeit. Und Millisekunden aus Vorträgen fallen selten auf ganze Frames: 130 ms sind 7,8 Frames. Übernimmst du so einen Wert, entscheidest du, ob daraus 7 oder 8 werden.

  Ohne Messwerkzeug hilft Sakurais Zähltrick aus „Learn to Count Frames!“ ([Clip](https://www.youtube.com/watch?v=JZ1Jd0u3b6U), [Kolumne als Fan-Übersetzung](https://sourcegaming.info/2018/05/18/learn-to-count-frames-sakurais-famitsu-column-vol-552/)). Zähl im Sekundentakt „1, 2, 3“ und setz ein „und“ dazwischen: „1-und-2-und-3“. Dann zählst du halbe Sekunden, jedes Wort dauert 30 Frames. Ein halbes Wort sind 15 Frames. So lange dauert es in Smash ungefähr, bis nach der Eingabe eines Smash-Angriffs die erste Hitbox erscheint. Bei normalen Schlägen und Tritten in Tekken ist es ähnlich, Street Fighter 2 liegt bei etwa der Hälfte. Sakurai geht es um ein Gespür: Wer weiß, wie lang 20 Frames sind, merkt beim Spielen, dass etwas nicht stimmt, und korrigiert es, bevor es zum Problem wird.

  Wie du innerhalb eines Angriffs zählst (Wind-up ab Frame 1, offizielle Startup-Werte mit dem ersten aktiven Frame), klärt [Anatomie eines Angriffs: Wind-up, aktiv, Erholung](/combat/angriffsphasen).

  ## „Reagiert sofort“ in Frames

  „Die Steuerung reagiert sofort“ kann zwei Zeitpunkte meinen. Die **Eingabelatenz** (Input Lag) ist die Zeit vom Druck bis zur ersten sichtbaren Änderung. Die **Zeit bis zum Treffer** reicht vom Druck bis zur aktiven Phase des Angriffs. Beide misst du in Frames, aber sie haben verschiedene Ursachen.

  Mick West hat 2008 die Eingabelatenz echter Spiele gemessen ([Measuring Responsiveness in Video Games](https://www.gamedeveloper.com/design/measuring-responsiveness-in-video-games)). Er filmte Controller und Bildschirm zugleich mit einer Kamera, die 60 Bilder pro Sekunde aufnimmt, und zählte die Bilder zwischen Druck und erster Reaktion:

  | Messung | Frames | ms |
  | --- | --- | --- |
  | PS3-Systemmenü | 3 | 50 |
  | typisches 60-fps-Spiel | 4 | 67 |
  | manche 30-fps-Spiele | 8–10 | 133–167 |
  | GTA IV | 10 | 166 |

  3/60 nennt er das Schnellste, was man auf der PS3 realistisch erwarten kann. Flachbildschirme legten etwa 2 Frames drauf. Sein Maßstab: Ein Spiel mit 60 fps sollte nicht über 4/60 liegen, eines mit 30 fps sollte 6/60 anstreben.

  Auch 2022 war das ein Thema. Dreamscaper ist ein Action-Roguelike in der Draufsicht von einem kleinen Team. Ian Cofino nennt dafür auf der Switch eine Eingabelatenz von etwa 130 ms, „like eight frames at 60fps“. Eine Option mit niedriger Latenz halbierte sie fast (ab etwa 21:01, [Dreamscaper: Killer Combat on an Indie Budget](https://www.youtube.com/watch?v=3Omb5exWpd4)).

  Die Zeit bis zum Treffer ist dagegen eine Designfrage. Ein Angriff darf ausholen, solange der Spieler vom ersten Frame an sieht, dass er ausholt. Sakurai lässt die Figur im ersten Frame in die Ausholpose springen, damit man sieht, dass die Eingabe angekommen ist ([Making Lead-ins Instant and Impactful](https://www.youtube.com/watch?v=E8DKndKkHw8), etwa 0:42–1:15); wie das mit Wind-up und Wucht zusammengeht, steht in [Anatomie eines Angriffs](/combat/angriffsphasen).

  > [!MERKE]
  > Sofort reagieren heißt: Im ersten Frame nach dem Druck ändert sich sichtbar etwas. Wann der Angriff trifft, ist eine zweite Zahl. Miss beide getrennt.

  ## Juice verstärkt, ersetzt aber kein Timing

  **Juice** heißt die Schicht aus Effekten über der Simulation. Martin Jonasson und Petri Purho bauen in „Juice it or lose it“ ein schlichtes Breakout Schritt für Schritt aus ([Video](https://www.youtube.com/watch?v=Fy0aCDmgnxg)): Tweening und Easing (2:43), Squash and Stretch (5:34), Sound, den sie den kosteneffektivsten Schritt nennen (7:46), Partikel (9:31), Screenshake (12:03). Ihr Leitsatz heißt „maximum output for minimum input“ (1:24). Jan Willem Nijman von Vlambeer zeigt in „The art of screenshake“ 30 kleine Tricks an einem Shooter (ab 8:17, [Video](https://www.youtube.com/watch?v=AJdEqssNZ-U)). Darunter sind ein weißer Blitz beim Treffer (12:06), Gegner, die ein paar Pixel zurückweichen (12:36), und „sleep“: Beim Treffer hält das Spiel etwa 20 ms an (18:01).

  Juice wirkt auf die Rückmeldung. Er ändert nicht, wann die Simulation reagiert. Liegt die Eingabelatenz bei 8 Frames, wackelt der Bildschirm 8 Frames zu spät. Mark Brown, Kritiker hinter Game Maker's Toolkit, fasst zusammen, Juice solle verstärken, worum es im Spiel geht (4:36, [Secrets of Game Feel and Juice](https://www.youtube.com/watch?v=216_5nu4aVQ)). Für deine Arbeit heißt das: erst das Timing messen, dann die Rückmeldung bauen. Hitstop, Screenshake, Blitz und Knockback behandelt [Trefferfeedback](/combat/trefferfeedback).

  > [!WARNING] Effekte haben Kosten
  > Nijman berichtet, dass Nuclear Throne eine Option brauchte, um Screenshake abzuschalten, weil manchen Spielern davon übel wurde (32:19). Wie stark ein Effekt sein darf, entscheidest du auch für Spieler, die ihn schlechter vertragen als du.

  ## Warum Werte zusammenhängen und der Kurs Frames misst

  Sakurai zeigt in „Giving "Weight" to Buttons“, dass dieselbe Taste schwerer oder leichter wirkt, je nach Tempo, Trägheit, Lag und Bildrate (0:47). Selbst die Deadzone des Analogsticks hat sein Team für jede Konsole neu abgestimmt (1:58, [Clip](https://www.youtube.com/watch?v=9qzUwoKT9T8)). Kein Wert wirkt allein. Ob 8 Frames Wind-up lang sind, hängt davon ab, wie schnell sich die Figur sonst bewegt und wie weit ein Gegner in 8 Frames kommt. Bei analoger 360°-Bewegung gehört auch die Deadzone dazu: Sie bestimmt, ab welchem Ausschlag die Figur überhaupt losläuft.

  Deshalb beschreibt dieser Kurs Spielgefühl in Messgrößen. Ein Wort wie „träge“ hat mehrere Ursachen, und jede hat ihre eigene Zahl:

  | Eindruck | mögliche Ursache | Messgröße |
  | --- | --- | --- |
  | „träge“ | späte erste Reaktion | Frames bis zur Pose |
  | „träge“ | langer Wind-up | Frames bis aktiv |
  | „verschluckt“ | Druck verfällt | Alter des Drucks |
  | „schwammig“ | Beschleunigung | Frames bis volles Tempo |
  | „kraftlos“ | wenig Rückmeldung | Hitstop, Knockback |

  Mit der Zahl kannst du vorhersagen, was eine Änderung bewirkt, das Ergebnis nachmessen und eine Vorgabe schreiben, nach der ein Coding-Agent baut, ohne selbst Werte zu erfinden ([Kampfmechanik als Vorgabe für einen Coding-Agenten](/combat/vorgaben)). Wie es sich anfühlt, beurteilst du danach selbst, am Controller.

  > [!PRAXIS]
  > In Vorträgen von Studios stehen Zahlen, keine Adjektive. Cofino nennt für Dreamscaper die Latenz in Millisekunden und Frames, ebenso den Hitstop: „about 115 milliseconds like seven frames“ (36:42). So lässt sich ein Wert über Plattformen, Patches und Teammitglieder hinweg vergleichen.

  > [!INTERVIEW]
  > „Ein Tester sagt, der Angriff fühle sich träge an. Was machst du?“ Gute Antwort: nachfragen und messen, bevor du etwas änderst. Kommt die erste sichtbare Reaktion spät, dauert der Wind-up lang, oder verfällt der Druck in der Erholung? Jede Ursache hat eine andere Zahl und eine andere Lösung. Dann änderst du eine Größe, sagst das Ergebnis vorher und testest wieder.

  ### Der Weg durch den Bereich

  - [Eingabe: Reaktionszeit, Latenz und Puffer](/combat/eingabe): wie schnell Menschen sind, wo Latenz entsteht, wie Puffer Drücke retten.
  - [Anatomie eines Angriffs](/combat/angriffsphasen): Wind-up, aktive Phase, Erholung und Frame-Daten veröffentlichter Spiele.
  - [Reichweite, Hitboxen und Hurtboxen](/combat/hitboxen): Trefferflächen in der Draufsicht.
  - [Ausweichen, Risiko und Belohnung](/combat/ausweichen), [Gegnermuster und Telegraphing](/combat/gegnermuster) und [Große Kreaturen als Bosse](/combat/grosse-gegner): i-Frames, Telegraphs, Bosse.
  - [Trefferfeedback](/combat/trefferfeedback) und [Schwer, unfair oder kaputt?](/combat/frust-diagnose): Rückmeldung und die Diagnose eines Treffers.
  - [Kampfmechanik als Vorgabe für einen Coding-Agenten](/combat/vorgaben): Mechaniken so aufschreiben, dass ein Agent nur Code schreibt.
  - Am PC: [Godot-Start](/combat/godot-start), die Testszene für [Angriff](/combat/testszene-angriff) und [Ausweichen](/combat/testszene-ausweichen), dann [Tuning als Experiment](/combat/tuning).

  ## Häufige Fehler

  - **Gefühl statt Zahl.** „Mach ihn knackiger“ ist kein Auftrag. Nenne Frames: erste Pose, aktive Phase, Erholung.
  - **Eingabelatenz und Wind-up verwechselt.** Ein langer Wind-up mit sofortiger Pose ist etwas anderes als eine Figur, die nach dem Druck stillsteht.
  - **Effekte gegen Trägheit.** Screenshake auf eine späte Reaktion kommt genauso spät.
  - **Millisekunden ungerundet übernommen.** 20 ms sind 1,2 Frames. Die Testszene zählt ganze Frames, also entscheidest du, ob 1 oder 2.
  - **Einen Wert allein abgestimmt.** Tempo, Trägheit, Latenz und Bildrate wirken zusammen. Ändere eine Größe und miss, was sich sonst verschiebt.
  - **Videobilder als Frames gezählt.** Viele Clips laufen mit 30 Bildern pro Sekunde, ein Videobild sind dann 2 Frames. Prüf die Bildrate, bevor du zählst.

  ## Zusammenfassung

  - Game Feel ist nach Swink „the tactile sensation of manipulating a digital agent“, zerlegt in Input, Response, Context, Polish, Metaphor und Rules.
  - Game Feel entsteht im Kreislauf aus Eingabe, Simulation und Rückmeldung. Jede Station kostet Zeit.
  - Ein Frame ist ein Physik-Tick, 60 pro Sekunde, ≈ 16,7 ms. Millisekunden = Frames × 1000 / 60.
  - Sakurais „1-und-2-und-3“: Ein Wort dauert 30 Frames, ein halbes 15.
  - Eingabelatenz (Druck bis erste Änderung) und Zeit bis zum Treffer sind zwei Zahlen. Mick West: höchstens 4/60 bei 60 fps; Dreamscaper auf der Switch etwa 8 Frames.
  - Der erste Frame zeigt eine Reaktion, auch wenn der Treffer später kommt.
  - Juice verstärkt die Rückmeldung, verschiebt aber keinen Zeitpunkt der Simulation.
  - Werte hängen zusammen. Deshalb misst du Frames, änderst eine Größe und vergleichst.
exercises:
  - id: swink-bestandteil
    type: choice
    title: Blitz, Funken, Ton
    prompt: |
      Ein Schlag trifft. Der Gegner blinkt weiß, Funken sprühen, ein kurzer Ton spielt. Schaden, Zustände und Frames des Angriffs bleiben genau gleich. Zu welchem von Swinks sechs Bestandteilen gehört das?
    options:
      - text: Polish
        correct: true
        why: Swink meint damit das Zusammenspiel von Animation, Ton und Effekten mit der Bewegung. Hier kommt nur Rückmeldung dazu, die Simulation bleibt gleich.
      - text: Response
        correct: false
        why: Response ist, wie das Spiel die Eingabe in Echtzeit verarbeitet, etwa Tempo oder Frames bis zum Treffer. Davon ändert sich hier nichts.
      - text: Rules
        correct: false
        why: Rules sind Werte wie Schaden und Lebenspunkte, die Herausforderung und Bedeutung geben. Der Schaden bleibt gleich.
      - text: Context
        correct: false
        why: Context ist der Raum mit seinen Hindernissen, der Bewegung Bedeutung gibt, etwa Wände oder Abstände.
    explanation: |
      Polish ist bei Swink der Eindruck von Körperlichkeit, der entsteht, wenn Animation, Ton und Effekte zur gesteuerten Bewegung passen. Ein Treffer-Blitz ändert keinen Zustand und keinen Frame, er ändert nur, was du wahrnimmst. Genau diese Trennung brauchst du später: Fühlt sich ein Treffer schwach an, kann es an Polish liegen oder an Response, und beides stimmst du an verschiedenen Stellen ab.
    resources:
      - title: Steve Swink · Game Feel – The Secret Ingredient
        url: https://www.gamedeveloper.com/design/game-feel-the-secret-ingredient

  - id: sofort-belegt
    type: choice
    title: Was heißt „sofort“?
    prompt: |
      Du notierst über zwei Spiele: „Der Angriff reagiert sofort.“ Welche Beobachtungen belegen diese Aussage im Sinn der Lektion?
    options:
      - text: Im ersten Frame nach dem Druck springt die Figur in eine Ausholpose. Der Treffer kommt 9 Frames später.
        correct: true
        why: Die erste sichtbare Änderung kommt sofort. Dass der Treffer später kommt, ist eine zweite Zahl, die Zeit bis zum Treffer.
      - text: Der Angriff trifft schon im ersten Frame nach dem Druck, wie der Jab von Zero Suit Samus, der in einem Frame herauskommt.
        correct: true
        why: Auch hier ändert sich im ersten Frame etwas. Sakurai warnt nur, dass einem Treffer ohne Wind-up Wucht fehlt.
      - text: Beim Treffer wackelt der Bildschirm stark und der Gegner fliegt weit zurück.
        correct: false
        why: Das ist Rückmeldung beim Treffer. Über die ersten Frames nach dem Druck sagt sie nichts.
      - text: Die Figur steht nach dem Druck 4 Frames still, trifft aber insgesamt nach 7 Frames.
        correct: false
        why: Die Zeit bis zum Treffer ist kurz, aber 4 Frames lang sieht der Spieler nicht, dass sein Druck angekommen ist. Die Eingabelatenz ist hier 4 Frames.
    explanation: |
      „Reagiert sofort“ bezieht sich auf die Eingabelatenz: die Zeit vom Druck bis zur ersten sichtbaren Änderung. Sakurai lässt die Figur deshalb im ersten Lead-in-Frame in die Pose springen, auch wenn der Treffer später kommt. Ob ein Angriff in 1 oder in 9 Frames trifft, ist eine eigene Designentscheidung. Effekte beim Treffer sagen über beides nichts.
    resources:
      - title: Masahiro Sakurai · Making Lead-ins Instant and Impactful
        url: https://www.youtube.com/watch?v=E8DKndKkHw8
      - title: Masahiro Sakurai · Breaking Down Attack Animations
        url: https://www.youtube.com/watch?v=LewXWM7HDd8

  - id: kreislauf-ordnen
    type: order
    title: Einmal durch den Kreislauf
    prompt: |
      Bring die Schritte in die Reihenfolge, in der sie ablaufen, von der Absicht bis zur nächsten Entscheidung.
    lang: text
    lines: |
      Du willst dem Angriff ausweichen
      Du drückst die Ausweichtaste
      Das Spiel sieht den Druck im nächsten Physik-Frame
      Die Simulation wechselt von MOVE nach DODGE
      Das Bild zeigt die Figur in der Ausweichpose
      Du siehst die Pose und lenkst mit dem Stick nach
    explanation: |
      Eingabe, Simulation, Rückmeldung, dann wieder der Spieler. Der Druck allein ändert nichts. Erst wenn das Spiel ihn liest, wechselt die Simulation den Zustand, und erst ein gezeichnetes Bild macht den Wechsel sichtbar. Der letzte Schritt schließt den Kreis: Du reagierst auf das, was du siehst, mit der nächsten Eingabe. Jeder Pfeil in dieser Kette kostet Zeit.
    resources:
      - title: Godot Docs · Idle and Physics Processing
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html

  - id: dauern-sortieren
    type: order
    title: Von kurz nach lang
    prompt: |
      Sortiere die Zeiten von der kürzesten zur längsten. Rechne dafür alles in Millisekunden um (ein Frame ≈ 16,7 ms).
    lang: text
    lines: |
      PS3-Systemmenü bei Mick West: 3/60 s
      Typisches 60-fps-Spiel bei Mick West: 4/60 s
      Dreamscaper auf der Switch: etwa 130 ms
      GTA IV bei Mick West: 166 ms
      Smash-Angriff bis zur ersten Hitbox: etwa 15 Frames
    explanation: |
      In Millisekunden: 50, 66,7, 130, 166 und 250. Die ersten vier sind Eingabelatenz, also die Zeit bis zur ersten Reaktion auf dem Bildschirm. Der letzte Wert ist eine Zeit bis zum Treffer, aus Sakurais Kolumne „Learn to Count Frames!“. Dass ein Smash-Angriff länger braucht als die langsamste Latenz in der Liste, ist kein Widerspruch: Ausholen ist gewollt, warten auf die erste Reaktion nicht.
    resources:
      - title: Mick West · Measuring Responsiveness in Video Games
        url: https://www.gamedeveloper.com/design/measuring-responsiveness-in-video-games
      - title: Source Gaming · Learn to Count Frames! (Sakurai, Famitsu Vol. 552)
        url: https://sourcegaming.info/2018/05/18/learn-to-count-frames-sakurais-famitsu-column-vol-552/

  - id: ms-umrechnen
    type: output
    title: Sechzigstel in Millisekunden
    prompt: |
      Mick West gibt Latenzen in Sechzigstelsekunden an. Was gibt das Programm aus?
    lang: python
    code: |
      def ms(frames, fps=60):
          return round(frames * 1000 / fps, 1)

      print(ms(3), ms(4), ms(4, fps=30))
    expected: |
      50.0 66.7 133.3
    accept:
      - 50 66.7 133.3
    explanation: |
      3 × 1000 / 60 = 50 und 4 × 1000 / 60 ≈ 66,7. Der dritte Aufruf zeigt, was ein Spiel mit 30 Bildern pro Sekunde kostet: 4 seiner Bilder sind 133,3 ms, also 8/60. Genau in diesem Bereich lagen manche 30-fps-Spiele bei Mick West. `round(…, 1)` gibt eine Kommazahl zurück, deshalb steht da `50.0` und nicht `50`.
    resources:
      - title: Mick West · Measuring Responsiveness in Video Games
        url: https://www.gamedeveloper.com/design/measuring-responsiveness-in-video-games

  - id: ganze-frames
    type: output
    title: 20 Millisekunden Stillstand
    prompt: |
      Vlambeer lässt das Spiel beim Treffer etwa 20 ms anhalten („sleep“). Die Testszene zählt Hitstop in ganzen Frames. Was gibt das Programm aus?
    lang: python
    code: |
      import math

      def frames(millis, fps=60):
          return millis * fps / 1000

      f = frames(20)
      print(round(f, 2), round(f), math.ceil(f))
    expected: |
      1.2 1 2
    explanation: |
      20 ms sind 1,2 Frames. Gerundet wird daraus 1, aufgerundet 2. Ein Spiel, das in festen Physik-Frames rechnet, kann keine 1,2 Frames anhalten. Wer einen Wert in Millisekunden aus einem Vortrag übernimmt, muss also entscheiden, ob er 16,7 oder 33,3 ms meint. Nijman sagt selbst „20 milliseconds or something“: Die Zahl ist ein Richtwert aus seinem Spiel, kein exakter Messwert.
    resources:
      - title: Jan Willem Nijman · The art of screenshake
        url: https://www.youtube.com/watch?v=AJdEqssNZ-U

  - id: zaehltrick
    type: gap
    title: Sakurais Zähltrick
    prompt: |
      Ergänze die Notiz zu „1-und-2-und-3“. Gezählt wird so, dass jedes Wort eine halbe Sekunde dauert; 60 Frames pro Sekunde.
    lang: text
    code: |
      ein Wort        ⟦30⟧ Frames
      halbes Wort     ⟦15⟧ Frames = ⟦250⟧ ms
    gaps:
      - label: Frames pro Wort
        hint: Eine halbe Sekunde bei 60 Frames pro Sekunde.
      - label: Frames pro halbem Wort
        hint: Die Hälfte davon.
      - label: Millisekunden
        hint: Ein Viertel einer Sekunde.
    explanation: |
      Eine halbe Sekunde sind 30 Frames, die Hälfte davon 15 Frames oder 250 ms. Laut Sakurai dauert es in Smash ungefähr so lange, bis nach der Eingabe eines Smash-Angriffs die erste Hitbox erscheint. Der Trick ersetzt keine Messung, aber er gibt dir eine Skala im Kopf: Was deutlich kürzer als ein halbes Wort ist, liegt unter 15 Frames.
    resources:
      - title: Masahiro Sakurai · Learn to Count Frames!
        url: https://www.youtube.com/watch?v=JZ1Jd0u3b6U

  - id: messnotiz
    type: gap
    title: Eine Messung auswerten
    prompt: |
      Du hast einen Angriff in einem Spiel gefilmt und die Videobilder in Frames zu 1/60 s umgerechnet (die Zahlen sind für diese Übung ausgedacht). Ergänze die Notiz.
    lang: text
    code: |
      Druck sichtbar        Frame 100
      erste Pose            Frame 103
      Treffer               Frame 112
      Eingabelatenz         ⟦3⟧ Frames
      bis zum Treffer       ⟦12⟧ Frames
      bis zum Treffer       ⟦200⟧ ms
    gaps:
      - label: Eingabelatenz
        hint: Vom Druck bis zur ersten sichtbaren Änderung.
      - label: Zeit bis zum Treffer in Frames
        hint: Vom Druck bis zum Treffer.
      - label: Zeit bis zum Treffer in ms
        hint: Frames × 1000 / 60.
    explanation: |
      Die Eingabelatenz ist 103 − 100 = 3 Frames, die Zeit bis zum Treffer 112 − 100 = 12 Frames, also 12 × 1000 / 60 = 200 ms. Die drei Frames enthalten die ganze Kette, auch den Bildschirm; Mick West rechnet für Flachbildschirme etwa 2 Frames ein. Die neun Frames zwischen Pose und Treffer sind dagegen eine Entscheidung der Entwickler.
    resources:
      - title: Mick West · Measuring Responsiveness in Video Games
        url: https://www.gamedeveloper.com/design/measuring-responsiveness-in-video-games

  - id: tabelle-ms
    type: bug
    title: Die Summe geht nicht auf
    prompt: |
      Du hast einen Angriff aus der Testszene in Millisekunden umgerechnet. Die Frames ergeben zusammen 25, die Millisekunden darüber aber nicht 417. Finde die falsche Zeile und korrigiere sie im Format der anderen.
    lang: text
    code: |
      Angriff, 60 Frames pro Sekunde
      Wind-up      8 Frames = 133 ms
      aktiv        3 Frames = 50 ms
      Erholung    14 Frames = 140 ms
      gesamt      25 Frames = 417 ms
    lines: [4]
    fix:
      - line: 4
        answers:
          - Erholung    14 Frames = 233 ms
          - Erholung 14 Frames = 233,3 ms
          - Erholung 14 Frames = 233.3 ms
          - Erholung 14 Frames ≈ 233 ms
    explanation: |
      14 × 1000 / 60 ≈ 233 ms. In der Zeile steht 140, als wäre ein Frame 10 ms lang. Mit 233 stimmt die Summe: 133 + 50 + 233 = 416, mit Rundung 417. Die Zahlen sind die Platzhalter der Testszene. Rechne bei jeder Tabelle die Summe nach, ein Umrechnungsfehler fällt dort zuerst auf.
    resources:
      - title: Godot Docs · Idle and Physics Processing
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html

  - id: erster-frame
    type: explain
    title: Pose sofort, Treffer später
    prompt: |
      Sakurai lässt die Figur im ersten Frame des Lead-ins in die Ausholpose springen, obwohl der Treffer erst später kommt. Erkläre in wenigen Sätzen, was das bewirkt und warum er den Wind-up trotzdem nicht streicht.
    lang: text
    code: |
      Frame 1    Druck, Figur springt in die Pose
      danach     Wind-up, Figur holt weiter aus
      später     aktive Phase, Hitbox trifft
    points:
      - Der erste Frame zeigt dem Spieler, dass seine Eingabe angekommen ist; die Eingabelatenz bleibt kurz.
      - Die Zeit bis zum Treffer ist eine eigene Größe und darf länger sein, ohne dass die Steuerung träge wirkt.
      - Ohne Wind-up fehlt dem Treffer die Wucht; online kann der Wind-up außerdem Lag verdecken.
      - Beides misst man getrennt in Frames, Druck bis Pose und Druck bis aktive Phase.
    explanation: |
      Sakurai trennt zwei Zeitpunkte. Der erste Frame beantwortet die Frage des Spielers „Hat das Spiel meinen Druck gesehen?“, deshalb springt die Figur sofort in eine deutlich andere Pose. Der Treffer kommt danach, und der Wind-up hat seinen eigenen Zweck: Er gibt dem Schlag Wucht, und im Online-Spiel kann er Verzögerung im Netz verdecken. Für die Abstimmung heißt das, zwei Zahlen zu messen statt einer. Dreamscaper nutzt dasselbe Muster, der Angriff springt dort ebenfalls sofort in die Ausholpose.
    resources:
      - title: Masahiro Sakurai · Making Lead-ins Instant and Impactful
        url: https://www.youtube.com/watch?v=E8DKndKkHw8
      - title: Masahiro Sakurai · Breaking Down Attack Animations
        url: https://www.youtube.com/watch?v=LewXWM7HDd8

  - id: mehr-screenshake
    type: explain
    title: „Bau mehr Screenshake ein“
    prompt: |
      Ein Freund testet einen Prototyp und sagt: „Der Angriff fühlt sich träge an. Bau mehr Screenshake ein.“ Du misst: Die erste sichtbare Änderung kommt 8 Frames nach dem Druck. Erkläre in wenigen Sätzen, warum mehr Screenshake das nicht behebt und was du als Nächstes prüfst.
    lang: text
    code: |
      Messung, ausgedachtes Beispiel
      Druck              Frame 100
      erste Änderung     Frame 108
      Treffer            Frame 117
      Screenshake ab     Frame 117
    points:
      - Screenshake ist Rückmeldung; er ändert nicht, wann die Simulation auf den Druck reagiert.
      - Er setzt erst beim Treffer ein, also nach der Eingabelatenz und dem Wind-up.
      - 8 Frames sind 133 ms, doppelt so viel wie die 4/60, die Mick West für 60-fps-Spiele als Grenze nennt.
      - Als Nächstes suchst du, wo die 8 Frames entstehen, und änderst erst danach eine Größe.
    explanation: |
      Der Eindruck „träge“ kommt hier aus der Eingabelatenz. Acht Frames, 133 ms, vergehen, bevor überhaupt etwas zu sehen ist. Screenshake kommt erst mit dem Treffer und damit noch später. Er kann einen Treffer stärker wirken lassen, aber er kann die ersten acht Frames nicht füllen. Bevor du etwas änderst, suchst du die Ursache: Steht die Figur nach dem Druck still, kommt der Druck spät im Spiel an, liegt es am Bildschirm? Juice gehört an die richtige Station des Kreislaufs.
    resources:
      - title: Mark Brown (GMTK) · Secrets of Game Feel and Juice
        url: https://www.youtube.com/watch?v=216_5nu4aVQ

  - id: clip-lead-ins
    type: practice
    title: "Clip-Analyse: Making Lead-ins Instant"
    prompt: |
      Sieh dir Sakurais Clip „Making Lead-ins Instant and Impactful“ an (2:26). Halte an, wo es nötig ist. Notiere mit Zeitangaben: Was ändert sich im Moment des Drucks? Wie begründet Sakurai den Wind-up? Schreib zum Schluss eine Frage an dein eigenes Spiel auf, ohne sie schon zu beantworten.
    lang: text
    solution: |
      Beispiel für die Form, nicht für
      deine Antworten:

      Clip: Making Lead-ins Instant and Impactful
      Gesehen: Handy, mit Ton, zweimal

      etwa 0:42–1:15  Im Moment des Drucks eine
                      große Posenänderung,
                      Reaktion zuerst.
      1:19            Zero Suit Samus: Jab in
                      einem Frame.
      1:45            Wind-up gibt dem Treffer
                      Wucht, kann online Lag
                      verdecken.

      Gemerkt: Pose und Treffer sind zwei
      Zeitpunkte, ich messe beide.
      Frage für später: Welche Pose zeigt meine
      Figur im ersten Frame eines Angriffs?
    checklist:
      - Du hast den Clip ganz gesehen und mindestens drei Stellen mit Zeitangabe notiert.
      - Du beschreibst, was im Moment des Drucks zu sehen ist, mit einer Pose oder Bewegung, nicht mit einem Adjektiv.
      - Du nennst Sakurais Gründe für den Wind-up in eigenen Worten.
      - Deine Notiz trennt Eingabelatenz und Zeit bis zum Treffer.
      - Deine Frage an dein eigenes Spiel ist offen und noch nicht beantwortet.
    explanation: |
      Clip-Analysen trainieren das Hinsehen in Frames. Sakurai zeigt in gut zwei Minuten, dass Reaktion und Wucht kein Widerspruch sind, wenn man sie auf zwei Zeitpunkte verteilt. Die Frage am Ende ist Absicht: Du sammelst Fragen für dein Spiel, beantwortest sie aber erst, wenn du sie in der Testszene ausprobieren kannst.
    resources:
      - title: Masahiro Sakurai · Making Lead-ins Instant and Impactful
        url: https://www.youtube.com/watch?v=E8DKndKkHw8

  - id: erste-frames-beobachten
    type: practice
    title: Die ersten Frames in deinem Lieblingsspiel
    prompt: |
      Nimm ein Actionspiel, das du selbst spielst. Schreib auf, was du in den ersten Frames nach einem Angriffsdruck erwartest, bevor du hinsiehst. Dann filme Hand und Bildschirm mit der Zeitlupe deines Handys oder zähle mit „1-und-2-und-3“. Notiere: Wann siehst du die erste Änderung? Wann trifft der Angriff? Was zeigt das Spiel dazwischen?
    lang: text
    solution: |
      Beispiel für die Form, ohne Werte:

      Spiel:            ________ (Version, Gerät,
                        Bildschirm)
      Messung:          Zeitlupe ___ Bilder/s
      Erwartung vorher: ________
      Druck             Videobild ___
      erste Änderung    Videobild ___
      Treffer           Videobild ___
      Umrechnung:       Videobilder × 60 / Rate
                        = Frames
      Eingabelatenz     ___ Frames
      bis zum Treffer   ___ Frames
      Dazwischen zu sehen: ________
      Abweichung von der Erwartung: ________
      Mein Eindruck in einem Satz: ________
    checklist:
      - Deine Erwartung stand auf dem Zettel, bevor du gemessen hast.
      - Du hast mindestens drei Angriffe gemessen und nicht nur einen.
      - Die Videobilder sind mit der Aufnahmerate in Frames zu 1/60 s umgerechnet.
      - Du trennst Eingabelatenz (Druck bis erste Änderung) und Zeit bis zum Treffer.
      - Du beschreibst, was zwischen Druck und Treffer zu sehen ist, ohne Wertung wie „gut“ oder „träge“.
      - Dein Satz zum Eindruck ist deine Beobachtung; es gibt dafür keine richtige oder falsche Antwort.
    explanation: |
      Das ist Mick Wests Methode mit dem Handy: Controller und Bildschirm in einem Bild, Bilder zählen. Bei 240 Bildern pro Sekunde entsprechen 4 Videobilder einem Frame, bei 120 sind es 2. Dein Messwert enthält die ganze Kette, auch den Bildschirm, deshalb notierst du das Gerät. Die Zahlen gehören dem Spiel, das du misst, nicht deinem. Sie geben dir eine Vorstellung davon, wie sich bestimmte Frame-Zahlen anfühlen.
    resources:
      - title: Mick West · Measuring Responsiveness in Video Games
        url: https://www.gamedeveloper.com/design/measuring-responsiveness-in-video-games
      - title: Masahiro Sakurai · Learn to Count Frames!
        url: https://www.youtube.com/watch?v=JZ1Jd0u3b6U
