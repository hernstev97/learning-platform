id: spielgefuehl
title: "Spielgefühl: Steuerung, Reaktion, Rückmeldung"
level: 1
minutes: 75
summary: Was Game Feel ist, wie Eingabe, Simulation und Rückmeldung einen Kreislauf bilden und warum dieser Bereich Spielgefühl in Frames misst – mit Messwerten veröffentlichter Spiele und Sakurais Zähltrick.
goals:
  - Du erklärst Game Feel mit Swinks sechs Bestandteilen und ordnest Beispiele aus Actionspielen zu.
  - Du beschreibst den Kreislauf aus Eingabe, Simulation und Rückmeldung und sagst, an welchen Stationen Zeit vergeht.
  - Du rechnest Frames und Millisekunden bei 60 Frames pro Sekunde ineinander um und schätzt kurze Zeiten mit Sakurais Zähltrick.
  - Du trennst Eingabelatenz und Zeit bis zum Treffer und belegst „reagiert sofort“ mit Messwerten veröffentlichter Spiele.
  - Du begründest, warum Effekte eine späte Reaktion nicht beheben und warum der Kurs Frames misst statt Eindrücke zu beschreiben.
