  - id: puffer-grenzfall
    type: output
    title: Genau an der Grenze
    prompt: |
      Das Puffer-Modell aus der Lektion, Puffer 6 wie der Platzhalter der Testszene. Die Figur ist ab Frame 41 frei. Was gibt das Programm aus?
    lang: python
    code: |
      def startet(drucke, frei, puffer=6):
          alter = -1
          for f in range(drucke[0], frei + 1):
              if f in drucke:
                  alter = 0
              if f == frei:
                  if 0 <= alter <= puffer:
                      return f
                  return None
              alter += 1

      print(startet([35], 41), startet([34], 41))
    expected: |
      41 None
    explanation: |
      Der Druck aus Frame 35 ist in Frame 41 genau 6 Frames alt. Die Grenze ist inklusiv (`<=`), also startet die Aktion in Frame 41. Der Druck aus Frame 34 ist dort 7 Frames alt und verfällt. Genauso rechnet die Testszene mit `buffer_age <= input_buffer`, solange kein Hitstop dazwischenliegt.
    resources:
      - title: Infil · The Fighting Game Glossary · Buffer Window
        url: https://glossary.infil.net/?t=Buffer%20Window

  - id: puffer-null
    type: output
    title: Puffer 0 und Puffer 1
    prompt: |
      Derselbe Druck in Frame 40, die Figur ist ab Frame 41 frei. Einmal mit Puffer 0, einmal mit Puffer 1. Was gibt das Programm aus?
    lang: python
    code: |
      def startet(drucke, frei, puffer=6):
          alter = -1
          for f in range(drucke[0], frei + 1):
              if f in drucke:
                  alter = 0
              if f == frei:
                  if 0 <= alter <= puffer:
                      return f
                  return None
              alter += 1

      a = startet([40], 41, puffer=0)
      b = startet([40], 41, puffer=1)
      print(a, b)
    expected: |
      None 41
    explanation: |
      In Frame 41 ist der Druck einen Frame alt. Mit Puffer 0 zählt nur ein Druck im selben Frame, also verfällt er. Mit Puffer 1 darf er einen Frame alt sein, und die Aktion startet in 41. Ein Spieler, der einen Frame zu früh drückt, erlebt mit Puffer 0 eine verschluckte Eingabe. Wie viele Frames dein Puffer bekommt, ist eine Designentscheidung.
    resources:
      - title: Infil · The Fighting Game Glossary · Buffer Window
        url: https://glossary.infil.net/?t=Buffer%20Window

  - id: puffer-hammern
    type: output
    title: Hämmern auf die Taste
    prompt: |
      Du hämmerst in der Erholung auf die Angriffstaste. Die Figur sieht die Drücke in den angegebenen Frames und ist ab Frame 41 frei. Was gibt das Programm aus?
    lang: python
    code: |
      def startet(drucke, frei, puffer=6):
          alter = -1
          for f in range(drucke[0], frei + 1):
              if f in drucke:
                  alter = 0
              if f == frei:
                  if 0 <= alter <= puffer:
                      return f
                  return None
              alter += 1

      a = startet([30, 33, 36], 41)
      b = startet([30, 33], 41)
      print(a, b)
    expected: |
      41 None
    hints:
      - Jeder neue Druck setzt `alter` auf 0.
    explanation: |
      Jeder Druck überschreibt den vorigen, es zählt der jüngste. Im ersten Aufruf ist das der aus Frame 36, in Frame 41 fünf Frames alt: Die Aktion startet. Im zweiten ist der jüngste Druck aus Frame 33, in 41 acht Frames alt, und er verfällt, obwohl du zweimal gedrückt hast. Hämmern hilft also nur, wenn der letzte Druck spät genug kommt. Dafür löst es nie zwei Aktionen aus, wie Cofino es für Dreamscaper verlangt.
    resources:
      - title: "Ian Cofino · Dreamscaper: Killer Combat on an Indie Budget (GDC 2022)"
