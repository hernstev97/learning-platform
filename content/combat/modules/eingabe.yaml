lesson: |
  Ein echtes Log aus der Testszene, nur die Zeilen der Figur. Sie steckt nach einem Treffer in der Erholung, und du drückst erst Ausweichen, dann Angriff:

  ```text
      27  Spieler ACTIVE -> RECOVERY
      36  Druck dodge
      38  Druck attack
      41  Spieler RECOVERY -> MOVE
      41  Spieler MOVE -> WINDUP
  ```

  Beide Drücke kamen an, und beide waren in Frame 41 jung genug für den Puffer von 6 Frames. Trotzdem startet nur der Angriff, denn die Testszene merkt sich nur den letzten Druck. Ob ein Spiel so entscheiden soll, ist eine Designfrage; dass die Testszene so entscheidet, steht im Code und im Log. Ob ein Druck zählt, hängt an drei Dingen: wie schnell ein Mensch reagiert, wie lange ein Druck braucht, bis das Spiel ihn sieht, und was das Spiel mit Drücken macht, die nicht genau im richtigen Frame kommen. Darum geht es hier, dazu um Commitment, Abbruchfenster und Stick-Eingaben. Alle Werte sind Beispiele aus veröffentlichten Spielen oder Platzhalter der Testszene. Wie groß deine Fenster werden, entscheidest du.

  ## Reaktionszeit: die Untergrenze des Menschen

  Woods und Kollegen haben 2015 die einfache Reaktionszeit von 1 469 Personen zwischen 18 und 65 Jahren gemessen ([Woods et al. 2015](https://www.frontiersin.org/journals/human-neuroscience/articles/10.3389/fnhum.2015.00131/full)). Einfach heißt: ein bekanntes Signal, eine bekannte Taste, nichts zu entscheiden. Im Mittel kamen 231 ms heraus, nach Abzug der Verzögerung der Messhardware 213 ms. Die jüngste Gruppe lag bei 217,8 ms, korrigiert bei 200 ms. In Frames:

  ```text
  213 ms × 60 / 1000 = 12,8 ≈ 13 Frames
  200 ms × 60 / 1000 = 12,0 = 12 Frames
  ```

  Auf Töne reagieren Menschen schneller als auf Licht. Jain und Kollegen zitieren Literaturwerte von etwa 190 ms für Licht und 160 ms für Ton ([Jain et al. 2015](https://pmc.ncbi.nlm.nih.gov/articles/PMC4456887)). Ein Ton zum Telegraph kann also früher eine Reaktion auslösen als das Bild allein. Das ist eine Folgerung aus der Studie, keine Messung an einem Spiel.

  Im Kampf ist die einfache Reaktionszeit eine Untergrenze. Der Spieler muss erst erkennen, welcher Angriff kommt, und entscheiden, ob er ausweicht oder angreift, oft während er schon etwas anderes tut. Das Fighting Game Glossary von Infil, eine Community-Quelle, hält fest: Auch sehr gute Spieler werden oft von Angriffen mit 20 und mehr Frames Startup getroffen, weil sie zu viel gleichzeitig im Kopf haben ([Reaction](https://glossary.infil.net/?t=Reaction)). Rechne die Testszene durch. Von 20 Frames Telegraph bleiben nach 13 Frames Reaktion 7 Frames für Erkennen und Entscheiden. Davon zieht die Technik noch etwas ab.

  ## Die Latenzkette: vom Daumen bis zum Bild

  NVIDIA nennt die Zeit von der Eingabe bis zur geänderten Anzeige Systemlatenz und zerlegt sie in Stationen ([Introducing NVIDIA Reflex](https://www.nvidia.com/en-gb/geforce/news/reflex-low-latency-platform/), ein Herstellerartikel):

  ```text
  Daumen drückt
    │  Peripherie: Controller sendet
    ▼
  Spiel liest den Druck
    │  Spiel: Simulation, neues Bild
    ▼
  Grafikkarte rendert
    │  Render
    ▼
  Bildschirm zeigt das Bild
       Display
  ```

  Laut NVIDIA spielen die meisten mit 50 bis 100 ms Systemlatenz, also 3 bis 6 Frames. Mick West kam 2008 für typische 60-fps-Spiele auf 4/60 s, Flachbildschirme legten 2 Frames drauf (siehe [Spielgefühl](/combat/spielgefuehl)). Ein Forschungsteam von NVIDIA fand bei Zielaufgaben in der Ego-Perspektive, dass geringere Latenz die Zeit bis zum Ziel klar verkürzt. Eine höhere Bildwiederholrate brachte bei gleicher Latenz wenig ([Spjut et al. 2019](https://research.nvidia.com/labs/amri/publication/spjut2019latency)).

  In Godot sieht die Station „Spiel“ so aus. Das Betriebssystem liefert Eingabe-Events, Godot gibt sie mindestens einmal pro gezeichnetem Bild weiter. Mit `use_accumulated_input`, standardmäßig an, fasst Godot ähnliche Events eines Bildes zusammen ([Input.use_accumulated_input](https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-property-use-accumulated-input)). `Input.is_action_just_pressed()` in `_physics_process` ist dann im nächsten Physik-Frame wahr. Deshalb schreibt die Testszene `Druck` in den Frame, in dem die Figur den Druck sieht, nicht in den Moment, in dem dein Daumen unten war.

  Die Godot-Doku listet Maßnahmen gegen Input Lag ([Fixing jitter, stutter and input lag](https://docs.godotengine.org/en/stable/tutorials/rendering/jitter_stutter.html#input-lag)):

  - V-Sync abschalten oder als Option anbieten; ohne V-Sync reißt das Bild (Tearing).
  - *Swapchain Image Count* auf 2 (Forward+ und Mobile), wenn das Spiel die Bildwiederholrate sicher erreicht.
  - Mehr Physik-Ticks pro Sekunde; als Startpunkte nennt die Doku 120, 180 und 240.
  - `Input.set_use_accumulated_input(false)`, das kostet etwas Rechenzeit.
  - Variable Bildwiederholrate (G-Sync, FreeSync) mit V-Sync und einer FPS-Grenze knapp darunter, etwa 141 bei 144 Hz.

  Physik-Interpolation erhöht laut Doku den Input Lag für alles, was am Physik-Tick hängt.

  > [!WARNING] Mehr Ticks, andere Frames
  > Die Frame-Daten dieses Kurses gelten für 60 Physik-Ticks pro Sekunde. Stellst du auf 120, dauert ein Frame 8,3 ms, und ein Wind-up von 8 Frames ist nur noch 67 ms lang. Wer die Tickrate ändert, rechnet jede Frame-Zahl neu um.

  ## Input Buffering: ein Druck, der wartet

  Die Erholung eines Angriffs endet in einem bestimmten Frame. Einen Druck genau dorthin zu legen heißt, ein Fenster von 16,7 ms zu treffen, bei einer Reaktionszeit von über 200 ms. Ohne Hilfe verfällt jeder Druck, der einen Frame zu früh kommt, und der Spieler erlebt, dass das Spiel seine Eingabe verschluckt.

  Ein **Input Buffer** (Eingabepuffer) merkt sich den Druck. Infil beschreibt das Buffer Window als Zeitraum, in dem das Spiel die Eingabe schon annimmt und sie im ersten möglichen Frame ausführt ([Buffer Window](https://glossary.infil.net/?t=Buffer%20Window)). Kampfspiele haben solche Puffer an vielen Stellen, damit sich Spieler darauf verlassen können, dass ihre Aktion kommt.

  Die Testszene aus [Testszene: Angriff mit Frame-Daten](/combat/testszene-angriff) prüft so:

  ```gdscript
  func _consume(action: StringName) -> bool:
  	if buffered_action == action and buffer_age >= 0 and buffer_age <= input_buffer:
  		buffer_age = -1
  		return true
  	return false
  ```

  `_read_buttons()` setzt bei jedem neuen Druck `buffered_action` und `buffer_age = 0`. Am Ende jedes Frames altert der Druck um eins, im Hitstop nicht. Ist die Figur frei, fragt sie mit `_consume()`, ob ein passender Druck da ist. Zwei echte Läufe mit dem Platzhalter `input_buffer = 6`, als Ausschnitt mit den Zeilen der Figur; die Erholung endet in Frame 41:

  ```text
      27  Spieler ACTIVE -> RECOVERY
      32  Druck attack
      41  Spieler RECOVERY -> MOVE
  ```

  ```text
      27  Spieler ACTIVE -> RECOVERY
      37  Druck attack
      41  Spieler RECOVERY -> MOVE
      41  Spieler MOVE -> WINDUP
  ```

  Der Druck aus Frame 32 ist in Frame 41 neun Frames alt und verfällt. Der aus Frame 37 ist vier Frames alt, und der zweite Angriff startet im ersten freien Frame.

  Dieselbe Regel als Python-Modell. `startet()` bekommt die Frames, in denen die Figur einen Druck sieht, und den ersten freien Frame. Zurück kommt der Frame, in dem die Aktion startet, oder `None`:

  ```python run
  def startet(drucke, frei, puffer=6):
      alter = -1           # Puffer leer
      for f in range(drucke[0], frei + 1):
          if f in drucke:
              alter = 0    # _read_buttons
          if f == frei:    # _consume
              if 0 <= alter <= puffer:
                  return f
              return None  # verfallen
          alter += 1       # Ende des Frames

  print(startet([37], 41))
  print(startet([32], 41))
  print(startet([36, 38], 41))
  ```

  Das Modell kennt keinen Hitstop und keine Drücke nach dem freien Frame. Für die Frage „Zählt dieser Druck?“ reicht es. Ein neuer Druck setzt das Alter auf 0, auch wenn schon einer gemerkt war. Es zählt immer der jüngste.

  > [!MERKE]
  > Ein Druck zählt, wenn er im ersten möglichen Frame höchstens `input_buffer` Frames alt ist. Puffer 0 heißt: nur im selben Frame.

  Eine Puffergröße mit Zahl nennt keine Quelle dieses Kurses. Ian Cofino nennt das Buffering in Dreamscaper großzügig und achtet darauf, dass Hämmern auf die Taste nicht „over registered“ wird, also nicht mehr Aktionen auslöst, als der Spieler meint (ab etwa 34:18, [GDC 2022](https://www.youtube.com/watch?v=3Omb5exWpd4)). Die Testszene merkt sich nur einen Druck, und `_consume()` leert ihn. Fünfmal Hämmern in der Erholung ergibt dort höchstens einen Angriff. Ein großer Puffer hat eine Kehrseite: Er führt auch einen Druck aus, den der Spieler inzwischen bereut. Wie du „verschluckt“ gegen „zu spät noch ausgeführt“ abwägst, entscheidest du.

  ## Nachsicht: Coyote Time und andere Fenster

  Maddy Thorson beschreibt zehn Tricks, die Celeste nachsichtig machen, und fasst zusammen: „All are centered around widening timing or positioning windows“ ([Celeste & Forgiveness](https://maddymakesgames.com/articles/celeste_and_forgiveness/index.html)). Zwei davon betreffen das Timing von Eingaben:

  - **Coyote Time.** Du kannst noch kurz springen, nachdem du die Kante verlassen hast.
  - **Jump Buffering.** Drückst du kurz vor der Landung, springst du genau im Frame der Landung.

  Thorson nennt keine Zahlen. Im veröffentlichten Quellcode der Spielfigur steht `JumpGraceTime = 0.1f` ([Player.cs, Zeile 48](https://github.com/NoelFB/Celeste/blob/master/Source/Player/Player.cs)): 0,1 s Coyote Time, bei 60 Frames pro Sekunde 6 Frames. Sébastien Benard nennt für Dead Cells „two or three frames to jump anyway“ (14:42). Solche Hilfen hätten „much much more difficult combat“ möglich gemacht (22:10, [Dead Cells: What the F\*n!?](https://www.youtube.com/watch?v=OfSpBoA6TWw)).

  | Spiel | Fenster | Wert |
  | --- | --- | --- |
  | Celeste | Coyote Time | 0,1 s = 6 Frames |
  | Dead Cells | Coyote Time | 2–3 Frames |
  | Dreamscaper | Puffer | „großzügig“, ohne Zahl |
  | Testszene | Puffer | 6 Frames, Platzhalter |

  Puffer und Coyote Time sind Spiegelbilder. Der Puffer lässt einen zu frühen Druck gelten, Coyote Time einen zu späten. Coyote Time und Jump Buffering stammen aus Plattformern, Eingabepuffer kennen Kampfspiele seit Langem. In der Draufsicht gibt es keine Kante, aber dieselbe Frage: Gilt ein Druck, der ein paar Frames neben dem Moment liegt, in dem er möglich war? Ob dein Spiel solche Fenster braucht und wie groß, sind Designentscheidungen. Die Werte oben sind Beispiele, keine Vorgabe.

  ## Commitment, Eingabehierarchie und Abbruchfenster

  **Commitment** heißt, wie fest der Spieler nach dem Drücken an seine Aktion gebunden ist. In der Testszene ist er es ganz. Während Wind-up, aktiver Phase und Erholung verbraucht die Figur keinen Druck. Nur ein Angriff darf die Erholung abbrechen, und erst ab dem Erholungs-Frame `cancel_from`; der Platzhalter 0 heißt nie. Ein Ausweichen wartet, bis die Figur frei ist.

  Ein **Abbruchfenster** (Cancel) sind die Frames, in denen eine Aktion eine andere abbrechen darf. Sakurai legt die Cancel-Frames in den Follow-through, das Ausschwingen nach dem Treffer (2:06). Smash hatte bis Melee keine, und die Spiele fühlten sich schwer an (2:26, [Breaking Down Attack Animations](https://www.youtube.com/watch?v=LewXWM7HDd8)). Hades II hat das Ausweichen aus der Erholung in einem Patch ausdrücklich zuverlässiger gemacht (siehe [Ausweichen, Risiko und Belohnung](/combat/ausweichen)).

  Welche Aktion welche abbrechen darf, legt eine **Eingabehierarchie** fest. Cofino beschreibt sie für Dreamscaper: Ausweichen und Blocken unterbrechen fast alles (22:57). Das Ausweichen macht sofort unverwundbar (8:18). Spielerangriffe sind schneller als Gegnerangriffe, damit der Spieler den Startup eines Gegners unterbrechen kann (Fragerunde, etwa 54:00). Man kann das als Antwort auf die Reaktionszeit lesen: Der Spieler bekommt Aktionen, die schneller wirken, als ein Gegner zuschlägt. Die Testszene stellt Ausweichen dagegen unter den Angriff. Beides ist eine Entscheidung, keine Regel.

  ## Stick-Eingaben: Flick Input bei 360°-Bewegung

  Mit einem Stick ist eine Eingabe mehr als eine Taste. `Input.get_vector()` liefert pro Frame einen Richtungsvektor bis Länge 1, die Deadzone neuer Aktionen ist 0,2 ([Input.get_vector](https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-get-vector)). Sakurai beschreibt in „Flick Input“, wie ein Spiel auch lesen kann, wie schnell der Stick geneigt wird (etwa 0:35–1:20, [Clip](https://www.youtube.com/watch?v=ChNceKFm2kI)). Ein schnelles Schnippen ist ein Flick, langsames Neigen ist Laufen. Das ersetzt Doppeltippen, kann aber falsch auslösen. In Kid Icarus: Uprising liegen Dash und Ausweichen auf dem Flick (1:28).

  Für 360°-Bewegung heißt das: Ein Flick ist eine Änderung des Vektors zwischen zwei Frames, nicht sein Wert. Ein schneller Richtungswechsel kann eine ähnliche Änderung erzeugen. Ob dein Ausweichen auf einer Taste, einem Flick oder beidem liegt, entscheidest du. Messen kannst du beides in Frames.

  > [!PRAXIS]
  > Studios stimmen Fenster auf die Latenz der Plattform ab. Dreamscaper hat auf der Switch, mit etwa 8 Frames Eingabelatenz, ein breiteres Parry-Fenster (21:01). Ein Fenster in Frames bekommt erst zusammen mit der Latenz eine Bedeutung.

  > [!INTERVIEW]
  > „Was ist Input Buffering, und was passiert, wenn der Puffer zu groß ist?“ Gute Antwort: Ein Puffer merkt sich einen Druck, der zu früh kommt, und führt die Aktion im ersten möglichen Frame aus. So gehen Eingaben kurz vor dem Ende einer Aktion nicht verloren. Ist er zu groß, führt das Spiel Drücke aus, die der Spieler längst aufgegeben hat. Sammelt er mehrere Drücke, macht Hämmern mehrere Aktionen daraus. Dann ein Satz zur Messung: Logg das Alter jedes Drucks beim Verbrauchen, dann siehst du, wie alt die Drücke sind, die wirklich zählen.

  ## Häufige Fehler

  - **Reaktionszeit als Spielzeit.** 213 ms gelten für ein bekanntes Signal und eine Taste. Im Kampf kommen Erkennen und Entscheiden dazu.
  - **Telegraph ohne Latenz gerechnet.** Der Spieler sieht den Telegraph erst nach Render und Display, und sein Druck kommt erst im nächsten Physik-Frame im Spiel an.
  - **Tickrate geändert, Frame-Daten behalten.** Bei 120 Ticks pro Sekunde ist ein Frame 8,3 ms lang. Rechne jede Zahl neu um.
  - **`<` statt `<=` im Puffer.** Puffer 0 wirkt dann gar nicht, jeder andere ist einen Frame kürzer als eingestellt.
  - **Puffer altert im Hitstop.** Steht das Altern vor der Hitstop-Prüfung, verfällt ein Druck, während das Bild stillsteht.
  - **Hämmern nicht getestet.** Ob dein Puffer einen oder mehrere Drücke merkt, siehst du erst, wenn du mehrmals drückst und die Aktionen im Log zählst.

  ## Zusammenfassung

  - Einfache Reaktionszeit nach Woods et al.: 231 ms, korrigiert 213 ms, etwa 13 Frames. Auf Töne reagieren Menschen schneller als auf Licht.
  - Im Kampf ist das eine Untergrenze, weil Erkennen und Entscheiden dazukommen.
  - Die Latenzkette läuft über Peripherie, Spiel, Render und Display. In Godot sieht `_physics_process` einen Druck im nächsten Physik-Frame.
  - Ein Input Buffer lässt einen zu frühen Druck gelten, in der Testszene, wenn er höchstens `input_buffer` Frames alt ist. Es zählt der jüngste Druck.
  - Coyote Time lässt einen zu späten Druck gelten: Celeste 0,1 s, Dead Cells 2–3 Frames.
  - Commitment, Eingabehierarchie und Abbruchfenster legen fest, was eine laufende Aktion beenden darf. In Dreamscaper unterbrechen Ausweichen und Blocken fast alles.
  - Flick Input liest die Geschwindigkeit des Sticks, nicht nur die Richtung.
  - Puffer, Coyote Time und Abbruchfenster sind Designentscheidungen. Veröffentlichte Werte sind Beispiele.
exercises:
  - id: reaktionszeit-untergrenze
    type: choice
    title: Reichen 13 Frames?
    prompt: |
      213 ms sind knapp 13 Frames. Jemand überlegt: „Dann reicht ein Telegraph von 13 Frames, um auszuweichen.“ Welche Einwände stimmen?
    options:
      - text: Woods et al. messen mit bekanntem Signal und bekannter Taste. Im Kampf muss der Spieler erst erkennen, welcher Angriff kommt, und entscheiden.
        correct: true
        why: Einfache Reaktionszeit ist der günstigste Fall. Erkennen und Entscheiden kosten zusätzlich Zeit.
      - text: Der Spieler sieht den Telegraph erst nach Render und Display, und sein Druck kommt erst im nächsten Physik-Frame im Spiel an.
        correct: true
        why: Die Latenzkette frisst Frames an beiden Enden, bevor die Reaktion überhaupt beginnt und nachdem sie fertig ist.
      - text: 213 ms ist der langsamste gemessene Wert. Fast alle Menschen reagieren schneller.
        correct: false
        why: 213 ms ist ein Mittelwert über 1 469 Personen, kein Höchstwert. Viele reagieren langsamer.
      - text: Die Reaktionszeit spielt keine Rolle, weil der Eingabepuffer den Druck ohnehin merkt.
        correct: false
        why: Der Puffer lässt einen zu frühen Druck gelten. Um auf einen Telegraph zu reagieren, muss der Druck aber nach dem Erkennen kommen. Schneller macht der Puffer niemanden.
    explanation: |
      13 Frames sind die reine Reaktion im Labor. Im Spiel kommen Erkennen und Entscheiden dazu, und die Technik kostet Frames: Das Bild erscheint später, als das Spiel den Telegraph startet, und der Druck kommt später an, als der Daumen drückt. Infil hält fest, dass auch sehr gute Spieler oft von Angriffen mit 20 und mehr Frames Startup getroffen werden. Wie lang dein Telegraph wird, entscheidest du. Die 13 Frames sagen dir nur, wo es sicher zu knapp wird.
    resources:
      - title: Woods et al. · Factors influencing the latency of simple reaction time (2015)
        url: https://www.frontiersin.org/journals/human-neuroscience/articles/10.3389/fnhum.2015.00131/full
