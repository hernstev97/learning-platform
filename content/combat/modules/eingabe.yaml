  - id: puffer-modell
    type: gap
    title: Das Modell ergänzen
    prompt: |
      Ergänze das Puffer-Modell. Ein neuer Druck ist 0 Frames alt. Im ersten freien Frame zählt er, wenn er höchstens `puffer` Frames alt ist.
    lang: python
    code: |
      def startet(drucke, frei, puffer=6):
          alter = -1
          for f in range(drucke[0], frei + 1):
              if f in drucke:
                  alter = ⟦0⟧
              if f == frei:
                  if ⟦0 <= alter <= puffer⟧:
                      return f
                  return None
              alter += 1
    gaps:
      - label: Alter eines neuen Drucks
        hint: So alt ist ein Druck in dem Frame, in dem die Figur ihn sieht.
      - label: Bedingung im ersten freien Frame
        hint: Ein Druck ist da (nicht −1) und nicht älter als der Puffer.
        accept:
          - alter >= 0 and alter <= puffer
          - 0 <= alter and alter <= puffer
          - alter <= puffer and alter >= 0
          - alter != -1 and alter <= puffer
          - alter > -1 and alter <= puffer
          - puffer >= alter >= 0
          - alter in range(puffer + 1)
          - alter <= puffer and 0 <= alter
          - -1 < alter <= puffer
    explanation: |
      `alter = 0` im Frame, in dem die Figur den Druck sieht, ist dasselbe wie `buffer_age = 0` in `_read_buttons()`. Die Bedingung prüft zwei Dinge: Es gibt einen Druck (`alter` ist nicht −1), und er ist höchstens `puffer` Frames alt. Mit `<=` gilt Puffer 0 als „nur im selben Frame“. In diesem Modell ist `alter` ab dem ersten Durchlauf nie −1, die Testszene braucht den Test aber, weil ihr Puffer meistens leer ist.
    resources:
      - title: Godot Docs · Input.is_action_just_pressed
        url: https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-is-action-just-pressed

  - id: puffer-zu-knapp
    type: bug
    title: Puffer 0 tut gar nichts
    prompt: |
      `startet([41], 41, puffer=0)` gibt `None`, obwohl der Druck im freien Frame selbst kommt. Und mit Puffer 6 verfällt ein Druck, der genau 6 Frames alt ist. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      def startet(drucke, frei, puffer=6):
          alter = -1
          for f in range(drucke[0], frei + 1):
              if f in drucke:
                  alter = 0
              if f == frei:
                  if 0 <= alter < puffer:
                      return f
                  return None
              alter += 1
    lines: [7]
    fix:
      - line: 7
        answers:
          - "if 0 <= alter <= puffer:"
          - "if alter >= 0 and alter <= puffer:"
          - "if 0 <= alter and alter <= puffer:"
          - "if alter <= puffer and alter >= 0:"
          - "if alter != -1 and alter <= puffer:"
          - "if alter > -1 and alter <= puffer:"
          - "if puffer >= alter >= 0:"
          - "if alter in range(puffer + 1):"
    explanation: |
      Mit `<` ist die Obergrenze exklusiv. Bei Puffer 0 gilt dann `0 < 0`, und kein Druck zählt mehr, auch nicht im selben Frame. Bei jedem anderen Puffer ist das Fenster einen Frame kürzer als eingestellt. Solche Fehler fallen beim Spielen kaum auf, weil sie nur einen Frame kosten. Im Log siehst du sie sofort, wenn du das Alter eines verfallenen Drucks mitschreibst.
    resources:
      - title: Infil · The Fighting Game Glossary · Buffer Window
        url: https://glossary.infil.net/?t=Buffer%20Window

