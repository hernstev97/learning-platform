id: eingabe
title: "Eingabe: Reaktionszeit, Latenz und Puffer"
level: 1
minutes: 100
summary: Wie schnell Menschen reagieren, wie viel Zeit zwischen Daumen und Bildschirm vergeht und wie Spiele mit Puffer, Coyote Time und Abbruchfenstern Drücke retten, die nicht genau im richtigen Frame kommen – mit einem Python-Modell des Puffers der Testszene.
place: unterwegs
goals:
  - Du nennst die einfache Reaktionszeit nach Woods et al. in Millisekunden und Frames und erklärst, warum sie im Kampf eine Untergrenze ist.
  - Du beschreibst die Latenzkette vom Controller bis zum Bildschirm und wie ein Druck in Godot bei `_physics_process` ankommt.
  - Du sagst für einen Druck und einen Puffer vorher, ob und in welchem Frame die Aktion startet, im Python-Modell wie in der Testszene.
  - Du unterscheidest Input Buffer, Coyote Time und Abbruchfenster und nennst belegte Werte veröffentlichter Spiele.
  - Du erklärst Commitment und Eingabehierarchie an Dreamscaper und am Code der Testszene.
