    prompt: |
      Du sammelst belegte Werte für deine Notizen. Ein Freund liest mit und stutzt: Laut einer Zeile wäre die Eingabelatenz einer Konsole so lang wie die Reaktionszeit eines Menschen. Finde die Zeile und korrigiere sie im Format der anderen.
    lang: text
    code: |
      Belegte Werte, 60 Frames pro Sekunde
      Celeste      Coyote 0,1 s = 6 Frames
      Dead Cells   Coyote 2–3 Frames
      Dreamscaper  Switch 130 ms = 13 Frames
      Mick West    PS3-Menü 3/60 s = 50 ms
    lines: [4]
    fix:
      - line: 4
        answers:
          - Dreamscaper  Switch 130 ms = 8 Frames
          - Dreamscaper Switch 130 ms ≈ 8 Frames
          - Dreamscaper Switch 130 ms = 7,8 Frames
          - Dreamscaper Switch 130 ms = 7.8 Frames
          - Dreamscaper Switch 130 ms = etwa 8 Frames
    explanation: |
      130 × 60 / 1000 = 7,8, also etwa 8 Frames. Cofino sagt selbst „like eight frames at 60fps“. Die 13 Frames gehören zu den 213 ms Reaktionszeit, die Zeile hat die beiden Werte vermischt. Die übrigen Zeilen stimmen: 0,1 s sind 6 Frames, 3/60 s sind 50 ms.
