  - id: hierarchie-testszene
    type: explain
    title: Wer darf wen abbrechen?
    prompt: |
      Dieser Ausschnitt aus `player.gd` entscheidet, wann ein gepufferter Druck eine Aktion startet. Erkläre in wenigen Sätzen, welches Commitment und welche Eingabehierarchie er festlegt, und vergleiche mit Dreamscaper.
    lang: gdscript
    code: |
      	if state == State.MOVE:
      		if _consume(&"attack"):
      			_enter(State.WINDUP)
      		elif _consume(&"dodge"):
      			_enter(State.DODGE)
      	elif state == State.RECOVERY and attack.cancel_from > 0 and frame >= attack.cancel_from:
      		if _consume(&"attack"):
      			_enter(State.WINDUP)
    points:
      - In `MOVE` startet ein gepufferter Angriff oder ein gepuffertes Ausweichen; weil der Puffer nur den jüngsten Druck hält, kommt nie beides.
      - Während Wind-up, aktiver Phase und Ausweichen verbraucht der Code keinen Druck, der Spieler ist ganz an seine Aktion gebunden.
      - In der Erholung darf nur ein Angriff abbrechen, und erst ab dem Erholungs-Frame `cancel_from`; mit dem Platzhalter 0 nie.
      - Ein Ausweichen in der Erholung wartet auf den ersten freien Frame und zählt nur, wenn der Puffer bis dahin reicht.
      - Dreamscaper stellt Ausweichen und Blocken über fast alles; welche Hierarchie dein Spiel bekommt, entscheidest du.
    explanation: |
      Die Testszene hat ein hohes Commitment. Ist eine Aktion gestartet, läuft sie zu Ende. Die einzige Ausnahme ist ein Angriff aus der Erholung heraus, ab `cancel_from`, und der Platzhalter schaltet auch das ab. Ein Ausweichen kann einen Angriff nie unterbrechen, es wartet im Puffer. Dreamscaper entscheidet umgekehrt: Ausweichen und Blocken brechen fast alles ab, das Ausweichen macht sofort unverwundbar. Die Testszene ist damit nicht falsch. Sie zeigt einen Platzhalter, an dem du die andere Variante ausprobieren kannst.
    resources:
      - title: "Ian Cofino · Dreamscaper: Killer Combat on an Indie Budget (GDC 2022)"
        url: https://www.youtube.com/watch?v=3Omb5exWpd4
      - title: Masahiro Sakurai · Breaking Down Attack Animations
        url: https://www.youtube.com/watch?v=LewXWM7HDd8

  - id: clip-flick-input
    type: practice
    title: "Clip-Analyse: Flick Input"
    prompt: |
      Sieh dir Sakurais Clip „Flick Input“ an (2:27). Notiere mit Zeitangaben, woran ein Spiel einen Flick vom Laufen unterscheidet, wofür Kid Icarus: Uprising ihn nutzt und welches Risiko Sakurai nennt. Schreib dann eine Situation aus einem Top-down-Spiel mit 360°-Bewegung auf, in der ein Flick ungewollt auslösen könnte, als Frage, nicht als Entscheidung.
    lang: text
    solution: |
      Beispiel für die Form, nicht für
      deine Antworten:

      Clip: Flick Input (Sakurai), 2:27
      etwa 0:35–1:20  Das Spiel liest, wie
                      schnell der Stick geneigt
                      wird. Schnell = Flick,
                      langsam = Laufen. Ersetzt
                      Doppeltippen, kann falsch
                      auslösen.
      1:28            Kid Icarus: Uprising,
                      Flick = Dash, Ausweichen.

      Frage für später: Wenn ich im Kampf den
      Stick schnell von links nach rechts
      reiße, um mich umzudrehen – liest das
      Spiel das als Flick?
    checklist:
      - Du hast notiert, woran das Spiel einen Flick vom Laufen unterscheidet.
      - Du hast notiert, welche Aktionen Kid Icarus auf den Flick legt.
      - Du nennst das Risiko, das Sakurai beschreibt, in eigenen Worten.
      - Deine Situation stammt aus einem Spiel in der Draufsicht mit analoger Bewegung.
      - Du hast sie als offene Frage notiert und nicht entschieden, ob dein Spiel Flicks nutzt.
    explanation: |
      Ein Flick ist eine Eingabe aus der Geschwindigkeit des Sticks, nicht aus seiner Richtung. In einem Spiel mit 360°-Bewegung bewegt sich der Stick ständig, deshalb ist die Frage, wann eine schnelle Änderung gemeint ist und wann nicht. Diese Frage beantwortest du erst, wenn du es ausprobieren kannst. In der Clip-Analyse sammelst du nur, was Sakurai belegt, und was du daraus fragen willst.
    resources:
      - title: Masahiro Sakurai · Flick Input
        url: https://www.youtube.com/watch?v=ChNceKFm2kI
      - title: Godot Docs · Input.get_vector
        url: https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-get-vector

  - id: puffer-selbst-testen
    type: practice
    title: Puffert dein Lieblingsspiel?
    prompt: |
      Nimm ein Actionspiel, das du selbst spielst, und einen Angriff mit spürbarer Erholung. Schreib vorher auf, was du erwartest. Dann drück den nächsten Angriff zu verschiedenen Zeitpunkten während der Erholung: früh, in der Mitte, kurz vor Ende. Prüf außerdem, ob Hämmern mehr Angriffe auslöst und ob ein Ausweichen den Angriff abbricht.
    lang: text
    solution: |
      Beispiel für die Form, ausgefüllt mit
      echten Logs der Testszene statt eines
      Spiels:

      Spiel: Testszene, input_buffer = 6
        (Platzhalter)
      Erwartung: Ein früher Druck verfällt, ein
        später startet den Angriff sofort.
      Erholung endet in Frame 41.

      Druck   Ergebnis
      32      verfällt, in 41 neun Frames alt
      37      startet in 41, vier Frames alt

      Hämmern: laut Code höchstens ein Angriff,
        es zählt der jüngste Druck.
      Ausweichen in der Erholung: bricht nicht ab,
        startet frühestens in 41 (laut Code).
      Abweichung von der Erwartung: keine.
      Eindruck: ‹deine eigenen Worte›
    checklist:
      - Deine Erwartung stand auf dem Zettel, bevor du getestet hast.
      - Du hast mindestens drei Zeitpunkte für den zweiten Druck probiert, jeden mehrmals.
      - Für jeden Zeitpunkt notierst du, ob der zweite Angriff kam und ob er sofort am Ende des ersten kam.
      - Du hast geprüft, ob Hämmern mehr Angriffe auslöst, als du willst.
      - Du hast geprüft, ob und ab wann ein Ausweichen den Angriff abbricht.
      - Dein Eindruck steht als eigener Satz da; es gibt dafür keine richtige oder falsche Antwort, und du legst keinen Wert für dein Spiel fest.
    explanation: |
      Ohne Log siehst du nur das Ergebnis, nicht das Alter des Drucks. Mit drei Zeitpunkten grenzt du trotzdem ein, wie groß das Fenster ungefähr ist: Kommt ein früher Druck noch durch, ist der Puffer groß, kommt nur ein später durch, ist er klein. Das Beispiel nutzt die Testszene, weil dort die echten Frames im Log stehen; bei einem fremden Spiel bleibt es bei „früh, Mitte, spät“. Was du davon für dein Spiel übernimmst, entscheidest du später in der Testszene.
    resources:
      - title: Infil · The Fighting Game Glossary · Buffer Window
        url: https://glossary.infil.net/?t=Buffer%20Window
      - title: "Ian Cofino · Dreamscaper: Killer Combat on an Indie Budget (GDC 2022)"
        url: https://www.youtube.com/watch?v=3Omb5exWpd4
