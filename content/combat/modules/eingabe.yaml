        url: https://glossary.infil.net/?t=Reaction

  - id: latenzkette-ordnen
    type: order
    title: Vom Daumen bis zum Bild
    prompt: |
      Bring die Stationen eines Ausweich-Drucks in Godot in die richtige Reihenfolge.
    lang: prose
    lines: |
      Der Daumen drückt, der Controller sendet den Druck
      Godot gibt das Event mit dem nächsten Bild weiter
      is_action_just_pressed() wird wahr
      Die Figur wechselt von MOVE nach DODGE
      Die Grafikkarte rendert das Bild mit der Ausweichpose
      Der Bildschirm zeigt das neue Bild
    explanation: |
      Die Reihenfolge folgt NVIDIAs Stationen: Peripherie (Zeile 1), Spiel (Zeilen 2 bis 4), Render (Zeile 5), Display (Zeile 6). Godot arbeitet Eingabe-Events mindestens einmal pro gezeichnetem Bild ab, und `is_action_just_pressed()` ist im nächsten Physik-Frame wahr. Erst danach kann die Simulation den Zustand wechseln. Jede Station kostet Zeit, und der Spieler sieht erst das Ergebnis der letzten.
    resources:
      - title: Introducing NVIDIA Reflex (Latenzkette)
        url: https://www.nvidia.com/en-gb/geforce/news/reflex-low-latency-platform/
      - title: Godot Docs · Input.use_accumulated_input
        url: https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-property-use-accumulated-input

  - id: puffer-oder-coyote
    type: choice
    title: Zu früh, zu spät
    prompt: |
      Welche Aussagen über Puffer und Coyote Time stimmen?
    options:
      - text: Ein Puffer lässt einen Druck gelten, der zu früh kam, und führt die Aktion im ersten möglichen Frame aus.
        correct: true
        why: So beschreibt Infil das Buffer Window, und so arbeitet die Testszene.
      - text: Coyote Time lässt einen Sprung gelten, der kurz nach dem Verlassen der Kante kommt.
        correct: true
        why: Das ist Thorsons Beschreibung aus Celeste. Das Fenster liegt nach dem Moment, in dem der Sprung möglich war.
      - text: Thorson nennt im Artikel „Celeste & Forgiveness“ 6 Frames Coyote Time.
        correct: false
        why: Der Artikel nennt keine Zahlen. Die 0,1 s stehen im Quellcode als `JumpGraceTime`, 6 Frames ist die Umrechnung bei 60 Frames pro Sekunde.
      - text: Puffer und Coyote Time sind dasselbe Fenster, nur unter zwei Namen.
        correct: false
        why: Sie liegen auf verschiedenen Seiten des richtigen Moments. Der Puffer verzeiht Frühe, Coyote Time Verspätung.
    explanation: |
      Beide Fenster verzeihen, dass ein Mensch keinen einzelnen Frame trifft, aber in verschiedene Richtungen. Der Puffer merkt sich einen frühen Druck und wartet, Coyote Time wertet einen späten Druck so, als wäre er noch rechtzeitig gekommen. Thorson fasst ihre Tricks so zusammen: Sie verbreitern Fenster für Timing oder Position. Zahlen findest du nur im Quellcode, nicht im Artikel.
    resources:
      - title: Maddy Thorson · Celeste & Forgiveness
        url: https://maddymakesgames.com/articles/celeste_and_forgiveness/index.html
      - title: Celeste · Player.cs, JumpGraceTime
        url: https://github.com/NoelFB/Celeste/blob/master/Source/Player/Player.cs

  - id: reaktion-in-frames
    type: output
    title: Reaktionszeit in Frames
    prompt: |
      Woods et al. messen korrigiert 213 ms einfache Reaktionszeit. Wie viele Frames sind das bei 60 Frames pro Sekunde, auf ganze Frames gerundet? Antworte mit der Zahl.
    lang: text
    code: |
      Frames = ms × 60 / 1000
      213 ms = ? Frames
    expected: |
      13
    accept:
      - 13 Frames
      - ca. 13
      - etwa 13
    explanation: |
      213 × 60 / 1000 = 12,78, gerundet 13 Frames. Die jüngste Gruppe der Studie lag korrigiert bei 200 ms, also 12 Frames. Merk dir die Größenordnung: Ein Mensch braucht im besten Fall etwa ein Dutzend Frames, um auf ein erwartetes Signal zu drücken. Ein Puffer von wenigen Frames oder ein Fenster von einem Frame liegt weit darunter.
    resources:
