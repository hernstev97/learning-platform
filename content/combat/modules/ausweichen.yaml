id: ausweichen
title: Ausweichen, Risiko und Belohnung
level: 2
minutes: 110
summary: Ein Ausweichen in Frames zerlegen – Anlauf, i-Frames, Weg, Erholung –, aus einem Log ablesen, ob ein Druck rechtzeitig war, und beurteilen, was ein Ausweichen kostet und was es einbringt.
goals:
  - Du zerlegst ein Ausweichen in Anlauf, i-Frames, Weg und Erholung und rechnest die Phasen in Frames und Pixel um.
  - Du sagst aus einem Log vorher, ob ein Druck rechtzeitig war und in welchem Frame die i-Frames enden.
  - Du unterscheidest Schutz durch i-Frames von Schutz durch Abstand und erkennst, wann beide aneinander hängen.
  - Du bestimmst nach einer Aktion, wer zuerst wieder frei ist, und berechnest daraus ein Punish-Fenster.
  - Du beschreibst Risiko und Belohnung eines Ausweichens an veröffentlichten Spielen, ohne Werte für dein eigenes festzulegen.
