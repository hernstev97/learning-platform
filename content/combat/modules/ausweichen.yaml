lesson: |
  > [!NOTE] Unterwegs
  > Diese Lektion und ihre Übungen gehen am Handy. Die verlinkten Clips brauchen Netz, alles andere ist offline lesbar.

  Der Trainingsgegner der Testszene (im Log `Dummy`) kündigt seinen Angriff 20 Frames lang mit einer gelben Bodenfläche an, in Frame 30 geht seine Hitbox an. „Druck in Frame N“ heißt in diesem Modul: Die Zeile `Druck dodge` steht in Frame N im Log, die Figur hat den Druck in diesem Frame gesehen. Kommt der Druck in Frame 29, steht im Log kein Treffer. Kommt er in Frame 30, steht dort `Spieler getroffen in DODGE, Frame 1`. Ein Frame ist ein Physik-Tick, 1/60 Sekunde. Zwischen „ausgewichen“ und „getroffen“ liegen also 16,7 Millisekunden, und das Log zeigt, woran es lag.

  Ausweichen gehört zum Kern vieler Actionspiele. In Enter the Gungeon war die Ausweichrolle laut Dave Crooks „the first mechanic other than shooting that went into the game“, angelehnt an die Rolle mit i-Frames aus der Souls-Reihe ([Game Developer](https://www.gamedeveloper.com/design/q-a-the-guns-and-dungeons-of-i-enter-the-gungeon-i-)). Dieses Modul zerlegt ein Ausweichen in Frames, trennt zwei Arten von Schutz und fragt, was ein Ausweichen kosten muss, damit es eine Entscheidung bleibt. Alle Werte der Testszene sind Platzhalter. Welche Werte dein Spiel bekommt, entscheidest du.

  ## Anatomie eines Ausweichens in Frames

  Ein Ausweichen hat vier Teile:

  - **Anlauf**: Die Figur weicht schon aus, ist aber noch verwundbar.
  - **i-Frames**: Frames, in denen die Figur nicht getroffen werden kann.
  - **Weg**: Die Figur bewegt sich. Der Weg kann länger dauern als die i-Frames.
  - **Erholung**: Die Figur steht, bis sie wieder frei ist.

  Die Spielfigur der Testszene hat dafür fünf Felder mit Platzhalterwerten: `dodge_frames = 18`, `invulnerable_from = 2`, `invulnerable_to = 12`, `dodge_speed = 220` (Pixel pro Sekunde) und `dodge_recovery = 8`. Zustände zählen ihre Frames ab 1. Daraus ergibt sich diese Zeitleiste:

  ```text
  Frame  1      Anlauf, verwundbar
  Frame  2–12   i-Frames (11 Frames)
  Frame 13–18   in Bewegung, verwundbar
  Frame 19–26   Erholung, steht still
  Frame 27      wieder frei
  ```

  Der Weg dauert 18 Frames: 220 px/s × 18 / 60 = 66 Pixel. Im Bild von 320 × 180 Pixeln ist das ein Fünftel der Breite. Die Figur ist 26 Frames gebunden und in 11 davon geschützt.

  Eine Funktion entscheidet, ob die Figur gerade geschützt ist. In diesen Frames schaltet sie ihre Hurtbox ab, die Fläche, an der sie getroffen werden kann. Hier umbrochen, damit sie aufs Handy passt:

  ```gdscript
  func is_invulnerable() -> bool:
  	return (state == State.DODGE
  		and frame >= invulnerable_from
  		and frame <= invulnerable_to)
  ```

  Damit lässt sich das Log vom Anfang erklären. Die Hitbox des Dummys geht in Frame 30 an, und Godot prüft die Überlappung am Ende dieses Frames. Gedrückt in Frame 29, ist die Figur in Frame 30 im zweiten Frame ihres Ausweichens und geschützt. Gedrückt in Frame 30, ist sie im ersten, dem Anlauf. Das Treffer-Signal kommt am Anfang von Frame 31, deshalb steht der Treffer dort. Der gelungene Lauf, in Godot 4.7.2 gemessen:

  ```text
      29  Druck dodge
      29  Spieler MOVE -> DODGE
      30  Spieler i-Frames an (Frame 2 des Ausweichens)
      30  Dummy TELEGRAPH -> ACTIVE
      34  Dummy ACTIVE -> RECOVERY
      41  Spieler i-Frames aus (Frame 13 des Ausweichens)
  ```

  Ob dein Ausweichen einen Anlauf hat und wie lang er ist, entscheidest du. Beim Lesen eines Logs musst du nur wissen, wo er steht.

  ## i-Frames oder aus der Fläche laufen

  Ein Angriff verfehlt dich auf zwei Arten: Du bist im Prüf-Frame unverwundbar, oder du stehst nicht mehr in seiner Fläche. In einem Spiel in der Draufsicht mit analoger 360°-Bewegung gibt es beides ständig. Mit `move_speed = 90` läuft die Figur 1,5 Pixel pro Frame. In den 20 Frames des Telegraphs kommt sie zu Fuß 30 Pixel weit, mit dem Ausweichen in 18 Frames 66 Pixel.

  In der Testszene hängen beide Arten von Schutz nicht zusammen. `dodge_speed` ändert den Weg, `invulnerable_from` und `invulnerable_to` die geschützten Frames. In Hades II hängen sie aneinander. Die Patchnotes zum ersten Early-Access-Patch sagen über die Karte The Swift Runner, sie mache den Dash jetzt „immediate“, mit dem Zusatz: „note the faster speed means you are invulnerable for very slightly less time“ ([Shacknews](https://www.shacknews.com/article/139921/hades-2-early-access-patch-notes-1)). Ein schnellerer Dash schützt dort kürzer.

  Wenn ein Tester sagt, das Ausweichen „schütze nicht“, prüf zuerst, welche Art von Schutz gemeint ist. Wer durch einen Angriff hindurchweicht, braucht i-Frames. Wer an ihm vorbeiweicht, braucht Weg. Im gemessenen Lauf mit Druck in Frame 28 trägt das Ausweichen die Figur 66 Pixel weit am Dummy vorbei.

  Bleibt die Figur in der Fläche, müssen die i-Frames jeden aktiven Frame der Hitbox abdecken. Das kleine Modell prüft genau das. Es passt zu den Läufen der Testszene, auch zu einem Lauf mit `dodge_speed = 0`, in dem die Figur am Ort ausweicht: Druck in Frame 21, i-Frames aus in Frame 33, Treffer in Frame 34, weil die Hitbox bis Frame 33 aktiv ist.

  ```python run
  VON, BIS = 2, 12   # i-Frames, Platzhalter
  AN, AKTIV = 30, 4  # Hitbox des Dummys

  def geschuetzt(start, frame):
      n = frame - start + 1  # im Ausweichen
      return VON <= n <= BIS

  def ausgewichen(start):
      frames = range(AN, AN + AKTIV)
      return all(geschuetzt(start, f)
                 for f in frames)

  for start in (21, 28, 29, 30):
      print(start, ausgewichen(start))
  ```

  Die Ausgabe passt zu den gemessenen Logs: Frame 21 zu früh, 28 und 29 rechtzeitig, 30 zu spät. Ändere `BIS` oder `AKTIV` und sieh nach, wie sich das Fenster verschiebt.

  ## Commitment: wie lange dich das Ausweichen bindet

  Commitment heißt, wie fest der Spieler nach dem Drücken an seine Aktion gebunden ist. In der Testszene sind es 26 Frames, in denen weder ein Angriff noch ein zweites Ausweichen startet. Ausweichen startet nur aus `MOVE`, also wenn die Figur frei ist. Ein Druck kurz vor dem Ende der Erholung eines Angriffs geht trotzdem nicht verloren: Der Eingabepuffer (`input_buffer = 6`, Platzhalter) hält ihn, und das Ausweichen startet im ersten freien Frame, wenn der Druck dann höchstens 6 Frames alt ist. Mehr dazu in [Eingabe: Reaktionszeit, Latenz und Puffer](/combat/eingabe).

  Viele Spiele erlauben mehr: ein Abbruchfenster (Cancel), in dem das Ausweichen die Erholung eines Angriffs abbricht. Supergiant hat im ersten Patch von Hades II genau daran gearbeitet: „You now can Dash out of many attack recovery animations more reliably“, so die von Shacknews wiedergegebenen Patchnotes ([Shacknews](https://www.shacknews.com/article/139921/hades-2-early-access-patch-notes-1)). Jedes solche Fenster senkt das Commitment eines Angriffs. Darf man aus 14 Frames Erholung ab ihrem vierten Frame wegrollen, bindet sie nur noch 3 Frames. Wie Abbruchfenster in Frames aussehen, steht in [Angriffsphasen](/combat/angriffsphasen).

  Commitment hängt auch an der Eingabe. In Furi startet der Dash laut Emeric Thoa „when you ‚release‘ the button, not when you ‚press‘“. Halten lädt den Dash auf, damit er weiter trägt ([Game Developer](https://www.gamedeveloper.com/design/furi-some-tough-design-decisions-striving-to-make-a-memorable-game)). Die Entscheidung fällt dort beim Loslassen.

  > [!MERKE]
  > Ein Ausweichen besteht aus vier Zahlen: wann der Schutz beginnt, wann er endet, wie weit die Figur kommt und wann sie wieder frei ist. Wer sie getrennt misst, kann jede Beschwerde einer Zahl zuordnen.

  ## Risiko und Belohnung: was das Ausweichen kostet und bringt

  Kostet ein Ausweichen nichts, ist es in jeder Lage eine sichere Wahl, und andere Verteidigungen verlieren ihren Grund. The Game Bakers nennen „fair“ als tägliches Stichwort für Furi: Wer getroffen wurde, sollte einen Fehler gemacht oder „a too big risk“ genommen haben ([GOG](https://gog.com/news/gog_interview_the_game_bakers_and_furis_success)). Risiko und Belohnung hängen dort an zwei Verteidigungen. Ein erfolgreicher Parry heilt die Figur, der Dash ist leichter, heilt aber nicht. Die sichere Option bringt weniger.

  Sekiro verschiebt das Gewicht weiter. Masaru Yamamura von FromSoftware erklärt, wie man die Haltung (Posture) der Gegner abbaut: „by deflecting their momentum and their attacks“ ([Game Informer](https://gameinformer.com/2019/01/15/how-sekiro-plays-differently-than-dark-souls)). Game Informer folgert, dass Spieler, die bei der ersten Bewegung eines Gegners ausweichen, das Spiel für schwerer halten, als es ist. Ein gesehener Angriff ist dort eine Gelegenheit, kein Signal zur Flucht.

  Für dein Spiel heißt das nicht, dass du einen Parry brauchst. Es heißt, dass du Kosten und Belohnung benennen kannst. Kosten sind etwa gebundene Frames, ein Anlauf ohne Schutz, ein Weg, der dich aus der eigenen Angriffsreichweite trägt, oder eine Ressource. Belohnungen sind etwa ein Punish-Fenster, Heilung, Schaden oder eine bessere Position.

  ## Sichere und unsichere Aktionen: wer zuerst wieder frei ist

  Ein Punish ist ein Treffer in die Erholung des Gegners. Ob er geht, hängt an einer Frage: Wer kann nach einer Aktion zuerst wieder handeln? Das Angriffs-Log der Testszene (Wind-up 8, aktiv 3, Erholung 14, Hitstop 4, Hitstun 12) beantwortet sie für einen Treffer:

  ```text
      20  Spieler WINDUP -> ACTIVE
      21  Dummy getroffen: Zone body, …
      21  Dummy WAIT -> HITSTUN
      27  Spieler ACTIVE -> RECOVERY
      36  Dummy HITSTUN -> WAIT
      41  Spieler RECOVERY -> MOVE
  ```

  Der Dummy ist ab Frame 36 frei, die Figur erst ab 41. Nach diesem Treffer ist der Angreifer 5 Frames im Nachteil. Hätte der Dummy einen schnellen Angriff, könnte er die Figur in ihrer Erholung treffen. So ein Angriff heißt unsicher. Sicher ist er, wenn der Angreifer spätestens zusammen mit dem Ziel frei ist. Die Differenz hängt am Hitstun des Ziels, den Frames, in denen es nicht handeln kann, an der Erholung des Angreifers und daran, wie viele aktive Frames nach dem Treffer noch laufen. Hier sind es 2 aktive Frames plus 14 Erholung gegen 11 Frames, die der Dummy nach dem Hitstop noch im Hitstun steckt: 2 + 14 − 11 = 5. Mit Hitstun 15 ist der Dummy erst ab Frame 39 frei, und der Nachteil schrumpft auf 2 Frames (in Godot 4.7.2 gemessen).

  Dasselbe gilt fürs Ausweichen. Im gemessenen Lauf mit Druck in Frame 28 ist die Figur ab Frame 54 frei. Der Dummy hat 30 Frames Erholung (Platzhalter) und steckt bis Frame 63 darin:

  ```text
      28  Spieler MOVE -> DODGE
      34  Dummy ACTIVE -> RECOVERY
      46  Spieler DODGE -> DODGE_RECOVERY
      54  Spieler DODGE_RECOVERY -> MOVE
      64  Dummy RECOVERY -> WAIT
  ```

  Das Punish-Fenster ist 10 Frames breit, von Frame 54 bis 63. Ob ein Angriff hineinpasst, hängt an seinem Wind-up und daran, wo die Figur nach dem Ausweichen steht. 66 Pixel am Gegner vorbei können ihn aus der eigenen Reichweite bringen.

  > [!PRAXIS] Schutz-Frames als Daten
  > Naughty Dog speichert in The Last of Us Part II zu Nahkampfangriffen Ereignisse wie „Hit frames“, „Target tracking“ und „Invincibility“ ([GDC-Folien](https://media.gdcvault.com/GDC+2021/Melee+AI+in+The+Last+of+Us+Part+II.pdf)). Treffer und Schutz stehen als Daten neben der Animation. Die Testszene macht dasselbe im Kleinen: `AttackData` für Angriffe, fünf Felder für das Ausweichen. Wer Werte als Daten führt, kann sie vergleichen, protokollieren und einem Coding-Agenten als Vorgabe geben.

  ## Lesbare Telegraphs machen Ausweichen erst möglich

  Ausweichen nützt nur, wenn der Spieler den Angriff kommen sieht. Ming-Lun „Allen“ Chou fasst den Nahkampf früherer Naughty-Dog-Spiele so zusammen: „Short enemy attack tells. No player dodge. Enemy starts swinging = certain hit.“ Für The Last of Us Part II drehte das Team alle drei Punkte um: „Longer enemy attack tells. More obvious enemy attack tells. Player can now dodge.“ Ein Ziel war „Skilled players can survive unscathed.“ ([GDC-Folien](https://media.gdcvault.com/GDC+2021/Melee+AI+in+The+Last+of+Us+Part+II.pdf)).

  Ein Telegraph ist die Ankündigung eines Angriffs, in der Testszene die gelbe Bodenfläche. Mit 20 Frames Telegraph, 4 aktiven Frames und 11 i-Frames reicht ein Druck am Ort zwischen Frame 22 und 29. Das sind 8 Frames, nicht 20: Die i-Frames müssen alle 4 aktiven Frames abdecken, also 11 − 4 + 1 = 8. Der Rest des Telegraphs ist Zeit zum Erkennen und Entscheiden. Wie viel davon ein Mensch braucht, steht in [Eingabe: Reaktionszeit, Latenz und Puffer](/combat/eingabe). Wie man Telegraphs gestaltet, behandelt [Gegnermuster und Telegraphing](/combat/gegnermuster).

  Zum Vergleich: Sieh dir den Clip [What Makes a Good Combat System?](https://www.youtube.com/watch?v=8X4fx-YncqA) von Game Maker's Toolkit an. Achte bei jedem Ausweichen, das du siehst, darauf, was der Spieler vorher sehen konnte.

  > [!INTERVIEW] Designtest: „Das Ausweichen fühlt sich nutzlos an“
  > So eine Rückmeldung kommt in Playtests und in Designtests bei Studios. Gute Antwort: erst trennen, dann ändern. Im Log steht, in welchem Frame des Ausweichens der Treffer kam. Frame 1 heißt Anlauf. Ein Frame nach den i-Frames heißt, der Schutz war zu früh vorbei. Ein Treffer außerhalb des Ausweichens heißt, die Figur war noch gebunden oder der Spieler hat zu spät reagiert. Danach fragst du: Ist der Telegraph lang und deutlich genug? Darf man aus der Erholung ausweichen? Welche Zahl du dann änderst, ist eine Designentscheidung. Und du änderst nur eine.

  ## Häufige Fehler

  - **„Das Ausweichen ist kaputt“, ohne ins Log zu sehen.** Erst den Frame des Ausweichens ablesen, in dem der Treffer kam. Frame 1 ist kein Fehler, sondern der Anlauf.
  - **Den Prüf-Frame vergessen.** Die Hitbox geht in Frame 30 an, der Treffer steht in Frame 31. Wer vom Treffer-Frame aus rechnet, verschiebt jedes Fenster um eins.
  - **i-Frames und Weg verwechseln.** Ein Ausweichen, das gegen einen kleinen Angriff schützt, schützt in einer großen Fläche vielleicht nicht. Teste i-Frames in einer Fläche, die du nicht verlassen kannst.
  - **Geschwindigkeit ändern und denselben Schutz erwarten.** In Hades II verkürzt ein schnellerer Dash die Unverwundbarkeit. Prüf in deinem Code, ob beides zusammenhängt.
  - **Telegraph und Ausweichen nicht zusammen nachrechnen.** Ist ein Telegraph kürzer als Reaktion plus Latenz, kann man nur aus dem Muster ausweichen. Ob das gewollt ist, entscheidest du; nachrechnen solltest du es in jedem Fall.
  - **Die Kosten des Ausweichens nicht messen.** Erholung, Weg und Punish-Fenster stehen im Log. Wer sie nicht misst, merkt nicht, wenn das Ausweichen still zur Antwort auf alles wird.
  - **Zwei Werte auf einmal ändern.** Änderst du i-Frames und Erholung gleichzeitig, weißt du nicht, welche Änderung du spürst. Wie man sauber vergleicht, steht in [Tuning als Experiment](/combat/tuning).

  ## Zusammenfassung

  - Ein Ausweichen hat Anlauf, i-Frames, Weg und Erholung. Mit den Platzhaltern: verwundbar in Frame 1, geschützt in 2 bis 12, frei ab Frame 27, 66 Pixel Weg.
  - Der Schutz zählt im Frame, in dem die Hitbox angeht. Der Treffer steht einen Frame später im Log.
  - Bleibt die Figur in der Fläche, müssen die i-Frames alle aktiven Frames abdecken. Das Fenster ist i-Frames minus aktive Frames plus eins breit.
  - i-Frames schützen beim Durchweichen, Weg beim Vorbeiweichen. In Hades II hängt die Unverwundbarkeit an der Dash-Geschwindigkeit.
  - Abbruchfenster entscheiden, ob man aus der Erholung ausweichen kann. Hades II hat das im ersten Patch erleichtert.
  - Risiko und Belohnung gehören zusammen: In Furi heilt der Parry, der leichtere Dash nicht.
  - Wer nach einer Aktion zuerst frei ist, entscheidet über den Punish: nach dem Treffer im Log 5 Frames Nachteil, nach dem Ausweichen 10 Frames Fenster.
  - Auf einen Angriff reagieren kann nur, wer ihn rechtzeitig sieht. Naughty Dog hat die Tells verlängert, als das Ausweichen dazukam.
exercises:
  - id: schutz-oder-weg
    type: choice
    title: Eine Fläche, aus der du nicht herauskommst
    prompt: |
      Ein Gegner trifft eine Fläche, die die Figur während eines Ausweichens nicht verlassen kann. Welche Aussagen stimmen?
    options:
      - text: Nur die i-Frames entscheiden, ob die Figur getroffen wird.
        correct: true
        why: Der Weg führt nicht hinaus. Es zählt nur, ob jeder aktive Frame der Hitbox in die i-Frames fällt.
      - text: Dauert die aktive Phase länger als die i-Frames, gibt es keinen Druck, der am Ort reicht.
        correct: true
        why: Die i-Frames müssen jeden aktiven Frame abdecken. Bei 11 i-Frames und 12 aktiven Frames bleibt immer ein ungeschützter Frame.
      - text: Ein schnelleres Ausweichen schützt hier immer besser.
        correct: false
        why: Mehr Weg nützt nur, wenn er aus der Fläche führt. In Hades II verkürzt ein schnellerer Dash sogar die Unverwundbarkeit.
      - text: Am sichersten ist ein Druck im ersten Frame des Telegraphs.
        correct: false
        why: Dann enden die i-Frames, bevor die Hitbox angeht oder während sie noch aktiv ist. Zu früh ist genauso falsch wie zu spät.
    explanation: |
      Bleibt die Figur in der Fläche, ist Ausweichen eine reine Frage der i-Frames. Das Fenster ist i-Frames minus aktive Frames plus eins breit. Ist es null oder kleiner, hilft am Ort kein Druck, nur Abstand. Deshalb lohnt es sich, bei jeder Beschwerde zu klären, ob die Figur durch den Angriff hindurch oder an ihm vorbei wollte.
    resources:
      - title: Hades II · Early Access Patch 1 (Shacknews)
        url: https://www.shacknews.com/article/139921/hades-2-early-access-patch-notes-1

  - id: risiko-belohnung-quellen
    type: choice
    title: Was die Studios sagen
    prompt: |
      Welche Aussagen geben die Quellen der Lektion richtig wieder?
    options:
      - text: In Furi heilt ein erfolgreicher Parry die Figur, der Dash ist leichter, heilt aber nicht.
        correct: true
        why: So beschreiben es The Game Bakers im GOG-Interview als Teil ihres Risiko-Belohnungs-Gedankens.
      - text: Yamamura erklärt, dass man in Sekiro die Haltung der Gegner abbaut, indem man ihre Angriffe ablenkt.
        correct: true
        why: „you can wear down their posture by deflecting their momentum and their attacks“, sagt er bei Game Informer.
      - text: Laut Supergiant macht Swift Runner den Dash in Hades II schneller und verlängert die Unverwundbarkeit.
        correct: false
        why: Die Patchnotes sagen das Gegenteil, die Figur ist „very slightly less time“ unverwundbar.
      - text: In Furi startet der Dash beim Drücken der Taste, damit er ohne Verzögerung kommt.
        correct: false
        why: Laut Emeric Thoa startet er beim Loslassen. Halten lädt ihn auf, damit er weiter trägt.
    explanation: |
      Alle drei Spiele verbinden Ausweichen mit einem Preis. In Furi ist der Dash die leichte, aber weniger lohnende Wahl. In Sekiro wird der gesehene Angriff zur Gelegenheit. In Hades II tauscht Swift Runner Geschwindigkeit gegen Schutzdauer. Wenn du Quellen zitierst, prüf die Richtung einer Aussage: „less time“ und „more time“ führen zu entgegengesetzten Schlüssen.
    resources:
      - title: GOG Interview · The Game Bakers über Furi
        url: https://gog.com/news/gog_interview_the_game_bakers_and_furis_success
      - title: Game Informer · How Sekiro Plays Differently Than Dark Souls
        url: https://gameinformer.com/2019/01/15/how-sekiro-plays-differently-than-dark-souls

  - id: diagnose-reihenfolge
    type: order
    title: Von der Beschwerde zur Änderung
    prompt: |
      Ein Tester sagt: „Ich weiche aus und werde trotzdem getroffen.“ Bring die Schritte in eine sinnvolle Reihenfolge. „Phase“ heißt hier: Anlauf, nach den i-Frames oder gar nicht im Ausweichen.
    lang: text
    lines: |
      Situation mit Log nachstellen
      Treffer-Zeile suchen
      Frame des Ausweichens ablesen
      Frame einer Phase zuordnen
      Größe und Erwartung notieren
      Nur diese Größe ändern
      Mit dem alten Wert vergleichen
    explanation: |
      Erst messen, dann deuten, dann ändern. Der Frame in der Treffer-Zeile sagt, ob der Anlauf, das Ende der i-Frames oder etwas ganz anderes schuld war, etwa eine Figur, die noch in der Erholung eines Angriffs steckte. Erst danach ist klar, welche Größe überhaupt in Frage kommt. Die Erwartung schreibst du vor der Änderung auf, damit der Vergleich etwas prüft.
    resources:
      - title: Valve's Approach to Playtesting (GDC 2009)
        url: https://cdn.fastly.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf

  - id: iframes-aus-frame
    type: output
    title: Wann endet der Schutz?
    prompt: |
      Platzhalter: i-Frames von Frame 2 bis 12 des Ausweichens. Die Figur sieht den Druck in Frame 27. In welchem Physik-Frame steht `Spieler i-Frames aus`? Antworte mit der Zahl.
    lang: text
    code: |
      27  Druck dodge
      27  Spieler MOVE -> DODGE
      28  Spieler i-Frames an (Frame 2 des Ausweichens)
      ??  Spieler i-Frames aus (Frame 13 des Ausweichens)
    expected: |
      39
    accept: ["Frame 39"]
    hints:
      - Frame 27 ist Frame 1 des Ausweichens.
    explanation: |
      Frame 27 ist der erste Frame des Ausweichens, Frame 28 der zweite. Frame 13 des Ausweichens ist also 27 + 12 = 39. Dort geht die Hurtbox wieder an. In Godot 4.7.2 gemessen; die Läufe mit Druck in 28 und 29 zeigen dasselbe Muster mit 40 und 41.

  - id: fenster-am-ort
    type: output
    title: Das Fenster, wenn die Figur stehen bleibt
    prompt: |
      Das Modell aus der Lektion sucht alle Druck-Frames, bei denen eine Figur am Ort ausweicht. Was gibt es aus?
    lang: python
    code: |
      VON, BIS = 2, 12   # i-Frames
      AN, AKTIV = 30, 4  # Hitbox

      def geschuetzt(start, frame):
          n = frame - start + 1
          return VON <= n <= BIS

      def ausgewichen(start):
          frames = range(AN, AN + AKTIV)
          return all(geschuetzt(start, f)
                     for f in frames)

      ok = [s for s in range(1, AN + 1)
            if ausgewichen(s)]
      print(ok[0], ok[-1], len(ok))
    expected: |
      22 29 8
    hints:
      - Der letzte aktive Frame ist 33. Dort darf die Figur höchstens in Frame 12 des Ausweichens sein.
    explanation: |
      Im ersten aktiven Frame, 30, muss die Figur mindestens in Frame 2 sein: 30 − start + 1 ≥ 2, also start ≤ 29. Im letzten, 33, höchstens in Frame 12: 33 − start + 1 ≤ 12, also start ≥ 22. Das sind 8 Frames, i-Frames minus aktive Frames plus eins. Die Ränder passen zur Testszene: Mit `dodge_speed = 0` trifft ein Druck in Frame 21 in Frame 34, einer in 22 nicht mehr.
    resources:
      - title: Python · all()
        url: https://docs.python.org/3/library/functions.html#all

  - id: nachteil-mit-hitstun
    type: output
    title: Drei Frames mehr Hitstun
    prompt: |
      Das Log zeigt einen Treffer mit Hitstun 12. Du stellst `hitstun` auf 15, alles andere bleibt gleich. Um wie viele Frames ist der Angreifer nach dem Treffer im Nachteil? Antworte mit der Zahl.
    lang: text
    code: |
      21  Dummy WAIT -> HITSTUN
      27  Spieler ACTIVE -> RECOVERY
      36  Dummy HITSTUN -> WAIT
      41  Spieler RECOVERY -> MOVE
    expected: |
      2
    accept: ["2 Frames"]
    hints:
      - Hitstun verlängert nur die Zeit des Dummys.
    explanation: |
      Hitstun hält nur das Ziel fest. Drei Frames mehr verschieben `HITSTUN -> WAIT` von 36 auf 39. Die Erholung des Angreifers hängt nicht daran, er bleibt bei 41. 41 − 39 = 2 Frames Nachteil statt 5. In Godot 4.7.2 gemessen. Ob ein Angriff in deinem Spiel sicher sein soll, ist eine Designentscheidung; die Rechnung zeigt nur, welche Werte darüber bestimmen: Hitstun, Erholung und die aktiven Frames nach dem Treffer.

  - id: zeitleiste-luecken
    type: gap
    title: Die Zeitleiste ergänzen
    prompt: |
      Platzhalter: `dodge_frames = 18`, i-Frames 2 bis 12, `dodge_speed = 220`, `dodge_recovery = 8`. Ergänze die Zeitleiste.
    lang: text
    code: |
      Frame  1      Anlauf, verwundbar
      Frame  2–⟦12⟧   i-Frames
      Frame ⟦13⟧–18   Weg, verwundbar
      Frame 19–⟦26⟧   Erholung
      Frame ⟦27⟧      wieder frei
      Weg: 220 × 18 / 60 = ⟦66⟧ px
    gaps:
      - label: Letzter geschützter Frame
        hint: Steht in `invulnerable_to`.
      - label: Erster ungeschützter Frame danach
        hint: Ein Frame nach dem letzten geschützten.
      - label: Letzter Frame der Erholung
        hint: 18 Frames Ausweichen, dann 8 Frames Erholung.
      - label: Erster freier Frame
        hint: Einer nach dem letzten Erholungsframe.
      - label: Weg in Pixeln
        hint: Pixel pro Sekunde mal Sekunden.
    explanation: |
      Zustände zählen ab 1. Die i-Frames enden mit Frame 12, Frame 13 ist wieder verwundbar, obwohl die Figur sich noch bewegt. Nach 18 Frames Ausweichen folgen 8 Frames Erholung, 19 bis 26, und in Frame 27 ist die Figur frei. Der Weg: 220 Pixel pro Sekunde für 18/60 Sekunden sind 66 Pixel.

  - id: geschuetzt-bedingung
    type: gap
    title: Ist die Figur geschützt?
    prompt: |
      Ergänze das Modell: `start` ist der Frame, in dem das Ausweichen beginnt (Frame 1 des Ausweichens), `frame` der Frame, in dem die Hitbox prüft.
    lang: python
    code: |
      def geschuetzt(start, frame, von, bis):
          n = ⟦frame - start + 1⟧
          return ⟦von <= n <= bis⟧
    gaps:
      - label: Frame im Ausweichen
        hint: Im Start-Frame selbst soll 1 herauskommen.
        accept: ["frame + 1 - start", "1 + frame - start", "(frame - start) + 1"]
      - label: Bedingung
        hint: Beide Grenzen gehören dazu.
        accept: ["n >= von and n <= bis", "von <= n and n <= bis", "bis >= n >= von", "n <= bis and n >= von", "n in range(von, bis + 1)"]
    explanation: |
      Ohne das `+ 1` wäre der Start-Frame Frame 0, und jedes Fenster läge einen Frame daneben. Beide Grenzen sind inklusiv, genau wie in `is_invulnerable()` der Testszene. Mit `start = 29` und `frame = 30` ergibt sich n = 2, also geschützt, wie im gemessenen Log.
    resources:
      - title: Python · Vergleiche verketten
        url: https://docs.python.org/3/reference/expressions.html#comparisons

  - id: punish-notiz
    type: bug
    title: Ein Frame zu früh frei
    prompt: |
      Du notierst das Punish-Fenster nach dem Ausweichen. Die Rechnung und das Ergebnis passen nicht zusammen. Tippe die falsche Zeile an und korrigiere sie.
    lang: text
    code: |
      Druck dodge in Frame 28
      Ausweichen 18 + Erholung 8 = 26 Frames
      Figur frei ab Frame 53
      Dummy in Erholung bis Frame 63
      Punish-Fenster: 10 Frames
    lines: [3]
    fix:
      - line: 3
        answers: ["Figur frei ab Frame 54", "Figur frei ab 54"]
    explanation: |
      Frame 28 ist Frame 1 des Ausweichens. 26 Frames belegen 28 bis 53, frei ist die Figur in Frame 54. So steht es auch im gemessenen Log: `54  Spieler DODGE_RECOVERY -> MOVE`. Von 54 bis 63 sind es 10 Frames, die letzte Zeile stimmt also. Der Fehler ist der klassische: Start-Frame plus Dauer ist der erste freie Frame, nicht der letzte gebundene.

  - id: modell-strenge-grenze
    type: bug
    title: Das Modell widerspricht dem Log
    prompt: |
      Im gemessenen Log weicht die Figur mit Druck in Frame 29 aus. Dieses Modell sagt für 29 aber `False`. Finde die Zeile und korrigiere sie.
    lang: python
    code: |
      VON, BIS = 2, 12
      AN, AKTIV = 30, 4

      def geschuetzt(start, frame):
          n = frame - start + 1
          return VON < n <= BIS

      def ausgewichen(start):
          frames = range(AN, AN + AKTIV)
          return all(geschuetzt(start, f)
                     for f in frames)

      print(ausgewichen(29))
    lines: [6]
    fix:
      - line: 6
        answers: ["return VON <= n <= BIS", "return n >= VON and n <= BIS", "return VON <= n and n <= BIS", "return n in range(VON, BIS + 1)"]
    explanation: |
      Mit Druck in Frame 29 ist die Figur in Frame 30 im zweiten Frame ihres Ausweichens, n = 2. `VON < n` verlangt aber n > 2. `invulnerable_from = 2` heißt „ab Frame 2 einschließlich“, also `VON <= n`. Solche Grenzfehler fallen nur auf, wenn du ein Modell gegen echte Logs prüfst, am besten gegen den knappsten Fall.

  - id: frame-30-zu-spaet
    type: explain
    title: Warum Frame 30 zu spät war
    prompt: |
      Der Treffer steht in Frame 31, gedrückt wurde in Frame 30. Erkläre in wenigen Sätzen, warum dieser Druck zu spät war und warum Frame 29 gereicht hat.
    lang: text
    code: |
      10  Dummy WAIT -> TELEGRAPH
      30  Druck dodge
      30  Spieler MOVE -> DODGE
      30  Dummy TELEGRAPH -> ACTIVE
      31  Spieler getroffen in DODGE, Frame 1
    points:
      - Die Hitbox geht in Frame 30 an, und Godot prüft die Überlappung am Ende dieses Frames.
      - Gedrückt in Frame 30, ist die Figur dort in Frame 1 des Ausweichens, dem Anlauf ohne i-Frames.
      - Das Treffer-Signal kommt erst am Anfang von Frame 31, deshalb steht der Treffer dort.
      - Gedrückt in Frame 29, ist die Figur in Frame 30 schon in Frame 2 und geschützt.
    explanation: |
      Es zählt der Frame, in dem die Hitbox angeht, nicht der, in dem der Treffer im Log steht. In Frame 30 ist die Figur nach einem Druck in Frame 30 im Anlauf, also verwundbar. Godot meldet die Überlappung einen Frame später, in Frame 31; da steht die Figur noch in ihrem ersten Ausweich-Frame, deshalb „Frame 1“. Ein Frame früher gedrückt, wäre sie in Frame 30 schon im zweiten Frame gewesen, mit abgeschalteter Hurtbox.

  - id: clip-ausweichen
    type: practice
    title: "Clip-Analyse: was vor dem Ausweichen zu sehen ist"
    prompt: |
      Sieh dir den Clip [What Makes a Good Combat System?](https://www.youtube.com/watch?v=8X4fx-YncqA) von Game Maker's Toolkit an oder spiel zehn Minuten ein Actionspiel mit Ausweichen, das du besitzt. Wähle drei Ausweichmanöver und notiere zu jedem:

      - Was war vor dem Druck zu sehen oder zu hören?
      - Ging die Figur durch den Angriff hindurch oder an ihm vorbei?
      - Was kam danach: Punish, Abstand oder nichts?
      - Was hat das Ausweichen gekostet?

      Frame-Zahlen eines fremden Spiels kennst du nur, wenn eine Quelle sie nennt. Alles andere notierst du als Schätzung.
    lang: text
    solution: |
      Beispiel für die Form, am Trainingsgegner der Testszene:

      Ausweichen 1 (Druck in Frame 28)
      Vorher: gelbe Bodenfläche ab Frame 10
      Durch oder vorbei: vorbei, 66 px weit
      Danach: 10 Frames, bevor der Dummy frei ist
      Kosten: 26 Frames gebunden, Frame 1 ohne Schutz
      Quelle der Zahlen: gemessenes Log

      Bei einem fremden Spiel steht in der letzten Zeile
      etwa „geschätzt, nicht gemessen“.
    checklist:
      - Zu jedem der drei Ausweichmanöver steht, was vor dem Druck zu sehen oder zu hören war.
      - Du hast jedes Mal „durch“, „vorbei“ oder „unklar“ notiert.
      - Zahlen, die du weder gemessen noch in einer Quelle gelesen hast, sind als Schätzung markiert.
      - Mindestens eine Notiz beschreibt, was nach dem Ausweichen kam.
    explanation: |
      Die Übung trainiert den Blick, den du beim Abstimmen brauchst: Was hat der Spieler gesehen, welche Art von Schutz hat gewirkt, und was hat es ihm gebracht? Die Trennung von gemessen und geschätzt schützt dich davor, gefühlte Zahlen aus einem Clip später als Fakten in eine Vorgabe zu schreiben.
    resources:
      - title: Game Maker's Toolkit · What Makes a Good Combat System?
        url: https://www.youtube.com/watch?v=8X4fx-YncqA

  - id: eigene-ausweich-fragen
    type: practice
    title: Die Fragen zu deinem Ausweichen
    prompt: |
      Für dein Spiel triffst du die Entscheidungen. Schreib eine kurze Notiz mit den Fragen, die du für dein Ausweichen beantworten musst, bevor du Werte einträgst. Noch keine Antworten, nur Fragen. Hinter jede Frage schreibst du die Größe, die sie misst: Frames, Pixel oder Zustand.
    lang: text
    solution: |
      Beispiel für die Form, an der Testszene. Keine Vorlage
      für dein Spiel, die Fragen dort findest du selbst.

      1. Ab welchem Frame schützt das Ausweichen?
         Größe: invulnerable_from (Frames)
      2. Aus welchen Zuständen darf es starten?
         Größe: Zustände (MOVE, RECOVERY ab Frame …)
      3. Wie weit trägt es die Figur?
         Größe: dodge_speed × dodge_frames / 60 (Pixel)
      4. Wie lange ist die Figur danach gebunden?
         Größe: dodge_recovery (Frames)
      5. Was bekommt der Spieler für ein knappes Ausweichen?
         Größe: Punish-Fenster (Frames) oder Ressource
    checklist:
      - Jede Frage nennt eine Größe, die du messen oder ablesen kannst.
      - Die Notiz enthält noch keine Werte.
      - Mindestens eine Frage betrifft die Kosten und mindestens eine die Belohnung.
      - Mindestens eine Frage betrifft, aus welchen Zuständen das Ausweichen starten darf.
    explanation: |
      Wer vor dem Abstimmen die Fragen aufschreibt, ändert später gezielt eine Größe statt nach Gefühl an vielen. Die Notiz ist deine; die Testszene zeigt nur, wie solche Fragen auf Felder im Inspektor abbilden. Am PC prüfst du die Antworten in [Testszene: Ausweichen und Trainingsgegner](/combat/testszene-ausweichen) und [Tuning als Experiment](/combat/tuning).
    resources:
      - title: Melee AI in The Last of Us Part II (GDC 2021, Folien)
        url: https://media.gdcvault.com/GDC+2021/Melee+AI+in+The+Last+of+Us+Part+II.pdf
