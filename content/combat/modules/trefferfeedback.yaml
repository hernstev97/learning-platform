lesson: |
  > [!NOTE] Unterwegs
  > Diese Lektion und ihre Übungen gehen am Handy. Die verlinkten Clips brauchen Netz, alles andere ist offline lesbar.

  Im Log der Testszene trifft der Angriff den Dummy in Frame 21. Was du in diesem Moment siehst, steht nicht im Log: Beide Quadrate halten 4 Frames an, der Dummy leuchtet auf und wird mit 120 Pixeln pro Sekunde zurückgestoßen. Ohne diese Signale hätte die Kollision genauso gezählt. Ob der Spieler den Treffer bemerkt, hängt an ihnen.

  Dieses Modul geht die Mittel einzeln durch: Hitstop, Screenshake, Blitz und Trefferzeichen, Knockback, Ton. Zu jedem steht, was es tut, wie veröffentlichte Spiele es dosieren und was es kostet. Wie viel Rückmeldung dein Spiel bekommt, entscheidest du. Die Zahlen der Testszene sind Platzhalter.

  ## Hitstop: Angreifer und Ziel halten an

  **Hitstop** heißt: Beim Treffer frieren Angreifer und Ziel für einige Frames ein. Masahiro Sakurai, Director von Super Smash Bros., erklärt das in [Stop for Big Moments!](https://www.youtube.com/watch?v=OdVkEOzdCPw). Ab etwa 1:12 zeigt er den „Boss Stop“ mit Blitz und Einfrieren, den es seit Kirby's Adventure gibt. In [Eight Hit Stop Techniques](https://www.youtube.com/watch?v=tycbMSjDDLg) zählt er auf, wie Smash den Stillstand gestaltet:

  - Das Opfer zittert stärker als der Angreifer (ab 0:58).
  - Die Hurtboxen bewegen sich nicht mit (1:21). Das Zittern ist nur Bild.
  - Am Boden zittert die Figur seitlich, in der Luft in alle Richtungen (1:38).
  - Das Zittern klingt ab (2:09).
  - Die Länge wächst mit dem Schaden, mal einem Faktor (2:26).
  - Etwa 4 Frames dauert der Übergang in die Schadenspose (3:13).
  - Der Angreifer bewegt sich mit einem Bruchteil seiner Geschwindigkeit weiter (3:43).
  - Im Mehrspieler ist der Hitstop kürzer (4:30).

  Andere Spiele dosieren anders:

  | Quelle | Länge | Was hält an |
  | --- | --- | --- |
  | Vlambeer | etwa 20 ms | das ganze Spiel |
  | Dreamscaper | etwa 115 ms | nur die Figuren |
  | Smash | wächst mit Schaden | Angreifer, Opfer |
  | Testszene | 4 Frames | Angreifer, Ziel |

  Jan Willem Nijman von Vlambeer nennt den Stillstand in [The art of screenshake](https://www.youtube.com/watch?v=AJdEqssNZ-U) ab etwa 18:01 „sleep“: Das Spiel pausiert beim Treffer „for 20 milliseconds or something“, gut ein Frame. Ian Cofino beschreibt für das Action-Roguelike Dreamscaper in der Draufsicht ab etwa 36:42 einen Hitstop von „about 115 milliseconds like seven frames“. Er gilt nur für Angriffe des Spielers, und es frieren nur die Figuren ein ([GDC 2022](https://www.youtube.com/watch?v=3Omb5exWpd4)).

  ### Was der Hitstop kostet

  Jeder angehaltene Frame fehlt der Aktion. Das echte Log der Testszene mit Hitstop 4:

  ```text
      12  Druck attack
      12  Spieler MOVE -> WINDUP
      20  Spieler WINDUP -> ACTIVE
      21  Dummy getroffen: Zone body …
      21  Dummy WAIT -> HITSTUN
      27  Spieler ACTIVE -> RECOVERY
      36  Dummy HITSTUN -> WAIT
      41  Spieler RECOVERY -> MOVE
  ```

  Ohne Treffer wechselt der Spieler in Frame 23 in die Erholung und ist ab Frame 37 frei. Mit Treffer erst in Frame 27 und ab Frame 41. Der Dummy ist ab Frame 36 frei, der Angreifer ist also 5 Frames im Nachteil. Ein längerer Hitstop ändert diesen Abstand nicht, denn beide setzen denselben Wert. Er verlängert nur die ganze Szene.

  Teuer wird es, wenn ein Dritter mitspielt. Sakurai begrenzt den Hitstop in Smash, weil ein dritter Spieler das Einfrieren ausnutzen könnte ([Kolumne, Fan-Übersetzung](https://sourcegaming.info/2015/11/11/thoughts-on-hitstop-sakurais-famitsu-column-vol-490-1/)). In der Testszene gilt dasselbe im Kleinen: Der Hitstop hält nur Angreifer und Ziel an. Alle anderen Gegner laufen weiter, während deine Figur steht.

  ### Lokal oder global: Wer steht still?

  Vlambeer hält das ganze Spiel an, Dreamscaper und die Testszene nur die Beteiligten. In Godot liegt für den globalen Weg `Engine.time_scale = 0` nahe. Das hält aber nur an, was mit `delta` rechnet. `_physics_process` läuft weiter, mit Godot 4.7.2 gemessen sechs Aufrufe in 0,1 Sekunden ([Engine.time_scale](https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-property-time-scale)). Ein Zustandsautomat, der Frames zählt, zählt also weiter (siehe [Testszene: Angriff mit Frame-Daten](/combat/testszene-angriff)). Die Testszene gibt deshalb jeder Figur einen Zähler `hitstop_left`. Solange er läuft, kehrt ihr `_physics_process` sofort zurück.

  Der lokale Weg hat eine Folge, die Sakurai ausdrücklich will: Effekte laufen weiter. Seine Trefferzeichen bewegen sich im Hitstop weiter ([Hit Marks](https://www.youtube.com/watch?v=B-P4ysHSjCg), ab etwa 4:01). Der Blitz des Dummys ist ein Tween über 0,15 Sekunden. Tweens laufen standardmäßig im Takt der gezeichneten Bilder, und der Zähler der Figur hält sie nicht an. Ein Tween reagiert dagegen auf `Engine.time_scale`, außer du rufst `set_ignore_time_scale()` auf ([Tween](https://docs.godotengine.org/en/stable/classes/class_tween.html#class-tween-method-set-ignore-time-scale)).

  ### Die Pose im Stillstand

  Im Hitstop sieht der Spieler ein Standbild. Laut Sakurai bleibt die eingefrorene Angriffspose im Gedächtnis ([Attack Poses](https://www.youtube.com/watch?v=99gdMDF7V2E), ab 0:29). Frame 1 der Schadensanimation steht während des ganzen Hitstops im Bild, deshalb zeigt er eine extreme Schmerzpose ([Damage Animations](https://www.youtube.com/watch?v=0xHE3ypX96U), ab 0:12). Für Pixelart heißt das: Zwei Bilder tragen den Treffer, die Angriffspose des Angreifers und das erste Schadensbild des Ziels. Wie du solche Posen zeichnest, behandelt der geplante Kurs zu 2D-Animation.

  ## Screenshake: abklingend und in ganzen Pixeln

  **Screenshake** ist Kamerawackeln. Sakurai unterscheidet in [Screen Shake](https://www.youtube.com/watch?v=2JXR7IASSog) zwei Wege: die Kamera bewegen oder das fertige Bild schütteln (ab 0:26). Kleine, mittlere und große Erschütterungen haben bei ihm eigene Muster, kleine wackeln nur senkrecht (1:27). Das Wackeln beginnt stark und klingt ab, mit etwas Zufall (2:43).

  Squirrel Eiserloh macht daraus ein Modell ([Juicing Your Cameras With Math](https://www.youtube.com/watch?v=tu-Qe66AvtY), GDC 2016). Ein Wert **trauma** zwischen 0 und 1 steigt mit jedem Treffer, bei einem harten Treffer etwa um 0,5, bei kleinem Stress um 10 bis 20 % (ab 3:46). trauma sinkt linear. Die Stärke des Wackelns ist trauma² oder trauma³ (4:16). In 2D verschiebt er die Kamera, in 3D dreht er sie (8:06). Für die Richtung nimmt er Perlin-Rauschen statt Zufallszahlen: Es funktioniert auch in Zeitlupe und hängt nicht von der Bildrate ab (11:47 bis 14:04).

  Das Modell rechnet die Stärke in Pixel um. `MAX_PX` ist der Ausschlag bei trauma 1, hier ein Platzhalter:

  ```python run
  MAX_PX = 4  # Platzhalter: Ausschlag bei 1,0

  print("trauma  linear  quadrat")
  for zehntel in range(10, 0, -1):
      trauma = zehntel / 10
      linear = round(MAX_PX * trauma)
      quadrat = round(MAX_PX * trauma ** 2)
      print(f"{trauma:.1f}     {linear}       {quadrat}")
  ```

  Linear wackelt die Kamera bis trauma 0,2 noch um einen Pixel, mit trauma² steht sie schon ab 0,3 still. Das Quadrat lässt kleine Treffer fast ruhig und das Ende schneller verschwinden. Bei 320 × 180 kommt eine eigene Rechnung dazu, keine Aussage über veröffentlichte Spiele: Das Modell rundet auf ganze Spielpixel, damit nichts zwischen zwei Pixeln steht. Ein Spielpixel ist bei vierfacher Skalierung 4 Bildschirmpixel breit, der kleinste Ausschlag springt also gleich um 4 Bildschirmpixel. Itay Keren beschreibt für Hyper Light Drifter einen anderen Weg: Das Spiel zeichnet seine Pixelgrafik auf eine Fläche und bewegt diese in echten Bildschirmpixeln, für weiches Scrollen ([GDC 2015](https://www.youtube.com/watch?v=pdvCO97jOQk), ab etwa 17:39). Ob du so etwas für einen Shake willst, entscheidest du.

  In Godot verschiebst du dafür `Camera2D.offset`. Die Doku nennt die Eigenschaft „useful for looking around or camera shake animations“ ([Camera2D.offset](https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-offset)). Ein Gerüst, das trauma in jedem Frame abbaut; `_rauschen()` liefert einen Vektor mit x und y zwischen −1 und 1:

  ```gdscript
  func add_trauma(menge: float) -> void:
  	trauma = minf(trauma + menge, 1.0)


  func _physics_process(_delta: float) -> void:
  	var s := trauma * trauma
  	var dir := _rauschen()
  	camera.offset = (dir * max_px * s).round()
  	trauma = maxf(trauma - abbau, 0.0)
  ```

  Screenshake kostet Lesbarkeit und Verträglichkeit. Cofino stuft ihn in Dreamscaper nach Angriffsklasse ab. Wird der Spieler selbst getroffen, wackelt die Kamera „much less than any applied to an enemy“ (ab 38:29). Zu jedem Shake gibt es eine Vibration (39:10).

  > [!WARNING] Übelkeit
  > Nijman erzählt ab etwa 32:19, dass Nuclear Throne eine Option brauchte, um den Screenshake abzuschalten, weil manchen Spielern übel wurde. Bündle die Stärke deshalb an einer Stelle, etwa in `max_px`. Dann ist ein Regler im Menü später eine Zeile.

  ## Blitz und Trefferzeichen: sichtbar, ohne zu verdecken

  Ein kurzer Blitz zeigt, wer getroffen wurde. Nijman lässt Gegner beim Treffer weiß aufblitzen (ab 12:06). Sakurai warnt in [Flashing Effects](https://www.youtube.com/watch?v=Mmw39T_dBLI): Reines Weiß zerstört den Kontrast und verschwindet auf hellem Grund, deshalb mischt er Dunkles bei (ab 1:01). Farben tragen bei ihm Bedeutung: Weißes Blinken heißt unverwundbar, gelbes nicht greifbar (2:51 bis 3:19). Nimmst du dieselbe Farbe für zwei Zustände, kann der Spieler sie nicht unterscheiden.

  Der Dummy der Testszene setzt `modulate` beim Treffer auf `Color(3, 3, 3)` und blendet in 0,15 Sekunden zurück, das sind 9 Frames bei 60 Bildern pro Sekunde ([CanvasItem.modulate](https://docs.godotengine.org/en/stable/classes/class_canvasitem.html#class-canvasitem-property-modulate)).

  **Trefferzeichen** sind Effekte an der Trefferstelle, etwa ein Stern oder ein Funke. Sakurai nennt in [Hit Marks](https://www.youtube.com/watch?v=B-P4ysHSjCg) sieben Regeln (1:15 bis 3:46):

  1. auffällig genug
  2. starker Kontrast
  3. an der Trefferstelle
  4. aus mehreren Schichten
  5. verdeckt die Figuren nicht
  6. passende Dauer
  7. dunkle Farben für helle Hintergründe

  Regel 5 wird bei Pixelart schnell eng. Die Figur der Testszene ist 12 × 12 Pixel groß. Ein Trefferzeichen, das größer ist und mittig auf ihr sitzt, verdeckt sie ganz, genau in den Frames, in denen der Spieler ihre Schmerzpose sehen soll.

  ## Knockback: Abstand als Rückmeldung und als Preis

  **Knockback** stößt das Ziel beim Treffer zurück. Nijman schiebt getroffene Gegner „back a couple pixels“ (ab 12:36). Den Spieler stößt er beim eigenen Schuss zurück, um ihm „a reason to not press it“ zu geben (17:08). Knockback ist dort auch ein Preis für die eigene Aktion.

  In Smash ist Knockback ein ganzes System. Er wächst mit der Stärke des Angriffs und dem gesammelten Schaden. Jeder Angriff hat einen Winkel, einen Wachstumsfaktor und einen Basiswert oder einen festen Wert, und Gewicht und Fallgeschwindigkeit des Opfers zählen mit ([Knockback in Super Smash Bros.](https://www.youtube.com/watch?v=HVktK4a9Yfo), 0:20 bis 2:49).

  Knockback verschiebt Abstände, und Abstände entscheiden über den nächsten Treffer. Für God of War (2018) ließ das Team Trefferreaktionen Gegner weniger weit bewegen und lenkte getroffene Gegner mit einem „strike assist“ ins Bild ([Evolving Combat in God of War](https://www.youtube.com/watch?v=hE5tWF-Ou2k), ab 33:36 und 34:53). Der Dummy der Testszene startet mit 120 Pixeln pro Sekunde und bremst in jedem Frame um 10. Wie weit er rutscht, rechnest du in einer Übung aus.

  > [!PRAXIS] Feedback als Daten
  > Sakurai rechnet die Länge des Hitstops aus dem Schaden, Cofino stuft den Screenshake nach Angriffsklasse ab. Beides sind Tabellen, keine Einzelfälle. Leg Feedback-Werte deshalb wie die Frame-Daten in `AttackData` ab: Hitstop, Trauma, Knockback je Angriff. Dann änderst du einen Wert an einer Stelle und kannst zwei Fassungen vergleichen, wie in [Tuning als Experiment](/combat/tuning).

  ## Ton: viel Wirkung für wenig Aufwand

  Martin Jonasson und Petri Purho nennen Sound in [Juice it or lose it](https://www.youtube.com/watch?v=Fy0aCDmgnxg) „the most cost-effective thing“ (ab 7:46). Sakurai beschreibt in [Strong Attack, Light Reverb](https://www.youtube.com/watch?v=-nWjT49-cds) drei Regeln. Ein starker Angriff bekommt einen kurzen Hall mit der Spitze am Anfang (0:56). Wiederholte Jab-Treffer bleiben unterscheidbar (2:02). Der Hauptton eines starken Treffers endet im Hitstop (2:13). In [Strike a Balance with Sound Effects](https://www.youtube.com/watch?v=qKjD5qbLUeI) ordnet er die Lautstärke nach Wichtigkeit: KO zuerst, dann Treffer und Spezialangriffe, Schritte zuletzt (1:01 bis 3:14).

  Für Hyper Light Drifter bauten Akash Thakkar und Rich Vreeland einen Schuss der Diamond Shotgun aus 9 Schichten, manche Sounds aus bis zu etwa 20 ([GDC 2017](https://www.youtube.com/watch?v=k1b9xKRC74E), ab etwa 30:16). Die Schichten verteilen sie auf hohe, mittlere und tiefe Frequenzen, die Wucht kommt aus dem Bass (Fragerunde, 55:46 und 57:01). Nicolae Berbece rät, die Tonhöhe bei jedem Abspielen leicht zu ändern ([GDC Europe 2015](https://www.youtube.com/watch?v=pmSAG51BybY), ab etwa 13:04).

  Wie man solche Töne baut, behandelt der geplante Kurs zu Sounddesign. Für das Timing gilt: Der Ton gehört in den Frame, in dem der Treffer gemeldet wird, nicht in den, in dem die Hitbox angeht. Sonst klingt auch ein Schlag ins Leere wie ein Treffer.

  > [!MERKE]
  > Jedes Mittel hat einen Preis. Hitstop kostet Zeit, Screenshake Lesbarkeit und Verträglichkeit, Blitz und Trefferzeichen den Blick auf die Figuren, Knockback Abstand.

  > [!INTERVIEW]
  > „Unsere Treffer wirken schwach. Was änderst du zuerst?“ Gute Antwort: Erst klären, was fehlt. Bemerkt der Spieler den Treffer nicht, oder bemerkt er ihn und er wirkt trotzdem nicht? Dann ein Mittel nach dem anderen ändern und gegen die alte Fassung vergleichen, nie alle auf einmal. Zu jedem Mittel nennst du den Preis: Hitstop verlängert jede Aktion, Screenshake kann Übelkeit auslösen und braucht eine Option zum Abschalten, Effekte können die Figuren verdecken. Wie viel davon das Spiel bekommt, entscheidet der Vergleich.

  ## Häufige Fehler

  - **Hitstop mit `Engine.time_scale = 0`.** Frame-Zähler laufen weiter, und Tweens bleiben stehen, auch die Effekte, die im Hitstop weiterlaufen sollen.
  - **Hitstop auch beim Ausweichen.** Der Angreifer setzt `hitstop_left`, bevor er weiß, ob der Treffer zählt. Seine aktive Phase verlängert sich dann bei jedem Ausweichen (siehe [Testszene: Ausweichen und Trainingsgegner](/combat/testszene-ausweichen)).
  - **Hurtboxen zittern mit.** Dann entscheidet das Zittern über Treffer. Nur das Bild soll zittern.
  - **Shake ohne Abklingen oder ohne Rückkehr.** Wird `offset` aufaddiert statt gesetzt, bleibt die Kamera nach dem Wackeln versetzt stehen.
  - **Ton beim Einschalten der Hitbox.** Dann klingt jeder Fehlschlag wie ein Treffer.
  - **Trefferzeichen größer als die Figur.** Bei 12 × 12 Pixeln verdeckt es die Schmerzpose.
  - **Reines Weiß auf hellem Grund.** Der Blitz verschwindet.
  - **Alles gleichzeitig verstärkt.** Danach weißt du nicht, welches Mittel den Unterschied gemacht hat.

  ## Zusammenfassung

  - Hitstop friert Angreifer und Ziel ein. Sakurai lässt das Opfer stärker zittern, Hurtboxen stehen, die Länge wächst mit dem Schaden.
  - Veröffentlichte Werte: Vlambeer etwa 20 ms für das ganze Spiel, Dreamscaper etwa 115 ms (7 Frames) nur für die Figuren.
  - Hitstop verlängert jede getroffene Aktion um seine Länge; in der Testszene endet die aktive Phase in Frame 27 statt 23.
  - `Engine.time_scale = 0` hält keine Frame-Zähler an. Die Testszene hält jede Figur mit `hitstop_left` an, Effekte laufen weiter.
  - Screenshake: trauma steigt mit Treffern, sinkt linear, die Stärke ist trauma². In 320 × 180 gerundet verschwindet kleines Wackeln früh.
  - Blitz und Trefferzeichen brauchen Kontrast und dürfen die Figuren nicht verdecken.
  - Knockback verschiebt Abstände und damit den nächsten Treffer.
  - Ton ist das günstigste Mittel. Er gehört in den Frame, in dem der Treffer gemeldet wird.
exercises:
  - id: sakurai-hitstop
    type: choice
    title: Acht Techniken für einen Stillstand
    prompt: |
      Welche Aussagen gehören zu Sakurais „Eight Hit Stop Techniques“?
    options:
      - text: Das Opfer zittert stärker als der Angreifer.
        correct: true
        why: Das ist die erste Technik im Clip (ab etwa 0:58).
      - text: Die Hurtboxen zittern mit, damit Bild und Fläche übereinstimmen.
        correct: false
        why: Umgekehrt. Die Hurtboxen bleiben stehen, nur das Bild zittert (1:21).
      - text: Die Länge des Hitstops wächst mit dem Schaden.
        correct: true
        why: Sakurai rechnet sie aus dem Schaden mal einem Faktor (2:26).
      - text: Im Mehrspieler fällt der Hitstop länger aus, damit alle den Treffer sehen.
        correct: false
        why: Im Mehrspieler ist er kürzer (4:30). In seiner Kolumne begründet Sakurai die Grenze damit, dass ein dritter Spieler den Stillstand ausnutzen könnte.
      - text: Das Zittern bleibt bis zum Ende des Hitstops gleich stark.
        correct: false
        why: Es klingt ab (2:09), wie später auch ein Screenshake.
    explanation: |
      Sakurai behandelt Hitstop als gestalteten Moment: wer stärker zittert, in welche Richtung, wie lange, und was dabei feststeht. Zwei Punkte sind technisch. Die Hurtboxen bleiben an Ort und Stelle, damit das Zittern keine Treffer auslöst oder verhindert. Und die Länge folgt aus dem Schaden, ist also ein Wert in einer Tabelle, kein Einzelfall. Die Begrenzung im Mehrspieler ist ein Preis des Hitstops.
    resources:
      - title: Masahiro Sakurai · Eight Hit Stop Techniques
        url: https://www.youtube.com/watch?v=tycbMSjDDLg
      - title: Source Gaming · Sakurais Kolumne zum Hitstop (Fan-Übersetzung)
        url: https://sourcegaming.info/2015/11/11/thoughts-on-hitstop-sakurais-famitsu-column-vol-490-1/

  - id: blitz-und-zeichen
    type: choice
    title: Was widerspricht Sakurais Regeln?
    prompt: |
      Du planst für einen Treffer einen Blitz und ein Trefferzeichen. Welche Pläne widersprechen den Regeln aus Sakurais Clips „Hit Marks“ und „Flashing Effects“?
    options:
      - text: Ein reinweißer Blitz auf einem hellen Sandboden.
        correct: true
        why: Reines Weiß verschwindet auf hellem Grund. Sakurai mischt deshalb Dunkles bei.
      - text: Ein Trefferzeichen, das mittig auf der getroffenen Figur sitzt und sie ganz verdeckt.
        correct: true
        why: Trefferzeichen dürfen die Figuren nicht verdecken. Gerade im Hitstop soll man die Pose sehen.
      - text: Das Trefferzeichen sitzt an der Trefferstelle und bewegt sich im Hitstop weiter.
        correct: false
        why: Beides entspricht Sakurai. Trefferzeichen gehören an die Trefferstelle und laufen im Hitstop weiter.
      - text: Das Trefferzeichen besteht aus mehreren Schichten mit starkem Kontrast.
        correct: false
        why: Schichten und starker Kontrast stehen beide in seiner Liste.
    explanation: |
      Blitz und Trefferzeichen sollen zeigen, wo und wen es getroffen hat, und dabei nicht das verdecken, was der Spieler lesen muss. Kontrast ist das Werkzeug, Weiß allein reicht dafür nicht immer. Bei Pixelart mit kleinen Figuren wird die Regel „nicht verdecken“ schnell zur Größenfrage. Wie groß dein Trefferzeichen ist, entscheidest du.
    resources:
      - title: Masahiro Sakurai · Hit Marks
        url: https://www.youtube.com/watch?v=B-P4ysHSjCg
      - title: Masahiro Sakurai · Flashing Effects
        url: https://www.youtube.com/watch?v=Mmw39T_dBLI

  - id: treffer-im-ablauf
    type: order
    title: Ein Treffer von Anfang bis Ende
    prompt: |
      Bring die Ereignisse des echten Testszenen-Laufs aus der Lektion (Hitstop 4, Hitstun 12) in die Reihenfolge, in der sie passieren.
    lang: text
    lines: |
      Die Hitbox des Spielers geht an
      Das Signal meldet den Treffer, beide setzen hitstop_left
      Spieler und Dummy stehen 4 Frames, der Blitz-Tween läuft
      Die aktive Phase des Spielers läuft zu Ende
      Der Spieler wechselt in die Erholung
      Der Dummy ist wieder frei (WAIT)
      Der Spieler ist wieder frei (MOVE)
    explanation: |
      Die Hitbox geht in Frame 20 an, der Treffer kommt in Frame 21. Die Frames 21 bis 24 stehen beide still, nur der Tween des Blitzes läuft, weil er nicht an `_physics_process` hängt. In 25 und 26 laufen die restlichen aktiven Frames, in 27 beginnt die Erholung. Der Dummy ist ab Frame 36 frei, der Spieler erst ab 41. Die Reihenfolge der letzten beiden Zeilen ist der Nachteil des Angreifers nach diesem Treffer.

  - id: kombo-mit-hitstop
    type: output
    title: Drei Treffer hintereinander
    prompt: |
      Platzhalter wie im Log der Lektion: Wind-up 8, aktiv 3, Erholung 14, Hitstop 4. Du greifst dreimal hintereinander an, jeder Druck ist gepuffert, jeder Angriff startet im ersten freien Frame und trifft den Dummy wie im Log. In welchem Frame steht `Spieler RECOVERY -> MOVE` nach dem dritten Angriff? Antworte mit der Zahl.
    lang: text
    code: |
      12   Spieler MOVE -> WINDUP
      41   Spieler RECOVERY -> MOVE
      41   Spieler MOVE -> WINDUP
      …
      ???  Spieler RECOVERY -> MOVE
    expected: |
      99
    accept:
      - Frame 99
    hints:
      - Ein Angriff mit Treffer dauert 25 + 4 Frames.
    explanation: |
      Ein Angriff belegt 8 + 3 + 14 = 25 Frames, mit Treffer 4 mehr, also 29. Der erste läuft von 12 bis 40, der zweite von 41 bis 69, der dritte von 70 bis 98. In Frame 99 ist die Figur frei. Ohne Treffer wäre es Frame 87. Drei Treffer kosten also 12 Frames, eine Fünftelsekunde. In einer Kombo addiert sich jeder Hitstop. In der echten Testszene trifft übrigens nur der erste Angriff: Der Knockback schiebt den Dummy 11 Pixel weg, aus der Reichweite der nächsten.
    resources:
      - title: Godot Docs · Idle and Physics Processing
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html

  - id: shake-sichtbar
    type: output
    title: Wie lange wackelt es sichtbar?
    prompt: |
      Das Modell aus der Lektion, aber trauma startet bei 0,8 und sinkt um 0,1 pro Frame. Was gibt das Programm aus?
    lang: python
    code: |
      max_px = 4
      sichtbar = 0
      for t in range(80, 0, -10):
          trauma = t / 100
          px = round(max_px * trauma ** 2)
          if px >= 1:
              sichtbar += 1
      print(sichtbar)
    expected: |
      5
    hints:
      - "Rechne `4 * trauma ** 2` für 0,8, 0,7, 0,6 … und runde."
    explanation: |
      Die Ausschläge sind 2,56, 1,96, 1,44, 1,0, 0,64, 0,36, 0,16 und 0,04 Pixel. Gerundet bleiben 3, 2, 1, 1, 1 und dann nur noch Nullen. Fünf von acht Frames wackelt die Kamera also sichtbar, die letzten drei steht sie, obwohl trauma noch über 0 ist. Das ist der Effekt von trauma² zusammen mit ganzen Pixeln: Das Ende des Shakes verschwindet früher, als der Wert vermuten lässt.
    resources:
      - title: Squirrel Eiserloh · Juicing Your Cameras With Math (GDC 2016)
        url: https://www.youtube.com/watch?v=tu-Qe66AvtY

  - id: knockback-weg
    type: output
    title: Wie weit rutscht der Dummy?
    prompt: |
      So bremst der Dummy der Testszene im Hitstun: Start mit 120 px/s, in jedem Frame 10 px/s weniger, dann bewegt er sich um `v / 60`. Das Modell lässt Wände und Hitstop weg. Was gibt es aus?
    lang: python
    code: |
      v = 120.0   # px/s beim Treffer
      weg = 0.0
      while v > 0:
          v = max(v - 10, 0)  # move_toward
          weg += v / 60       # ein Frame
      print(round(weg, 1))
    expected: |
      11.0
    hints:
      - Im ersten Frame ist `v` schon 110, im letzten 0.
    explanation: |
      Der Dummy bremst zuerst und bewegt sich dann, wie `move_toward` vor `move_and_slide()` in `enemy.gd`. Die Geschwindigkeiten sind 110, 100, … 10, zusammen 660 px/s über je eine Sechzigstelsekunde, also 11 Pixel. Das ist eine Rechnung nach dem Code, nicht in Godot gemessen. Bei 320 Pixeln Bildbreite sind 11 Pixel fast die Breite der Figur. Ob das mehr ist als Nijmans „a couple pixels“, ist eine Frage für dein Spiel.
    resources:
      - title: Godot Docs · Vector2.move_toward
        url: https://docs.godotengine.org/en/stable/classes/class_vector2.html#class-vector2-method-move-toward

  - id: ms-und-frames
    type: gap
    title: Veröffentlichte Werte in Frames
    prompt: |
      Rechne um, bei 60 Frames pro Sekunde (ms = Frames × 1000 / 60). Runde auf ganze Zahlen.
    lang: text
    code: |
      Vlambeer, sleep: 20 ms     = ⟦1⟧ Frame
      Dreamscaper: 115 ms        = ⟦7⟧ Frames
      Testszene: Hitstop 4       = ⟦67⟧ ms
      Blitz des Dummys: 0,15 s   = ⟦9⟧ Frames
    gaps:
      - label: 20 ms
        hint: Ein Frame sind etwa 16,7 ms.
        accept: ["1,2", "1.2"]
      - label: 115 ms
        hint: Cofino sagt es im Vortrag selbst.
        accept: ["6,9", "6.9"]
      - label: 4 Frames
        hint: 4 × 1000 / 60
        accept: ["66,7", "66.7"]
      - label: 0,15 s
        hint: 0,15 × 60
    explanation: |
      20 ms sind 1,2 Frames, Vlambeers Pause dauert also gut einen Frame. 115 ms sind 6,9 Frames, Cofino rundet selbst auf „seven frames“. 4 Frames sind 66,7 ms. Der Blitz des Dummys läuft 9 Frames, also länger als der Hitstop. Rechne veröffentlichte Werte immer in Frames um, bevor du sie mit deinen vergleichst, und prüfe, ob sie für eine Figur oder für das ganze Spiel gelten.
    resources:
      - title: Jan Willem Nijman · The art of screenshake
        url: https://www.youtube.com/watch?v=AJdEqssNZ-U
      - title: Ian Cofino · Dreamscaper (GDC 2022)
        url: https://www.youtube.com/watch?v=3Omb5exWpd4

  - id: shake-geruest
    type: gap
    title: Trauma in die Kamera
    prompt: |
      Ergänze das Shake-Gerüst: trauma bleibt höchstens 1, die Stärke ist trauma², und der Ausschlag landet in der Eigenschaft von `Camera2D`, die die Doku für Shake vorsieht.
    lang: gdscript
    code: |
      func add_trauma(menge: float) -> void:
      	trauma = ⟦minf⟧(trauma + menge, 1.0)


      func _physics_process(_delta: float) -> void:
      	var s := ⟦trauma * trauma⟧
      	var dir := _rauschen()
      	camera.⟦offset⟧ = (dir * max_px * s).round()
      	trauma = maxf(trauma - abbau, 0.0)
    gaps:
      - label: Obergrenze
        hint: Die Funktion für das Kleinere von zwei `float`-Werten.
        accept: ["min"]
      - label: Stärke
        hint: Eiserloh quadriert.
        accept: ["trauma ** 2", "trauma ** 2.0", "pow(trauma, 2)", "pow(trauma, 2.0)"]
      - label: Eigenschaft der Kamera
        hint: Laut Doku „useful for looking around or camera shake animations“.
    explanation: |
      `minf` hält trauma bei 1, auch wenn mehrere harte Treffer hintereinander kommen. Die Stärke ist das Quadrat, damit kleiner Stress kaum wackelt. `offset` verschiebt das Bild der Kamera, ohne ihre Position zu ändern; die Kamera folgt ihrem Ziel also weiter. `.round()` rundet auf ganze Spielpixel. Ob dein Spiel das so will, ist eine Entscheidung, keine Pflicht.
    resources:
      - title: Godot Docs · Camera2D.offset
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-offset

  - id: vorhersage-hitstop
    type: bug
    title: Die Vorhersage stimmt fast
    prompt: |
      Du hast vor dem Testlauf diese Vorhersage geschrieben. Im Log stehen danach der Treffer in Frame 109 und `RECOVERY -> MOVE` in Frame 129, beides wie vorhergesagt. Eine Zeile der Vorhersage passt trotzdem nicht dazu. Finde sie und korrigiere sie.
    lang: text
    code: |
      Angriff: Wind-up 8, aktiv 3, Erholung 14
      Hitstop 4, Treffer einen Frame nach ACTIVE
      Start: MOVE -> WINDUP in Frame 100
      WINDUP -> ACTIVE      108
      Treffer gemeldet      109
      stillstehend          109 bis 112
      ACTIVE -> RECOVERY    111
      RECOVERY -> MOVE      129
    lines: [7]
    fix:
      - line: 7
        answers:
          - ACTIVE -> RECOVERY 115
    explanation: |
      111 wäre der Wechsel ohne Treffer: 108 plus 3 aktive Frames. Der Hitstop hält die Frames 109 bis 112 an, danach laufen die aktiven Frames 2 und 3 in 113 und 114, und in 115 beginnt die Erholung. 115 plus 14 ergibt die 129 aus dem Log. Im echten Lauf der Testszene ist es genauso: ACTIVE in 20, RECOVERY in 27 statt 23.
    resources:
      - title: Godot Docs · Idle and Physics Processing
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html

  - id: kamera-bleibt-versetzt
    type: bug
    title: Die Kamera kommt nicht zurück
    prompt: |
      Nach einem harten Treffer wackelt die Kamera, wie sie soll. Danach steht sie aber nicht wieder mittig, sondern bleibt um einige Pixel versetzt, nach jedem Treffer anders. Finde die Zeile und korrigiere sie.
    lang: gdscript
    code: |
      func _physics_process(_delta: float) -> void:
      	var s := trauma * trauma
      	var dir := _rauschen()
      	camera.offset += (dir * max_px * s).round()
      	trauma = maxf(trauma - abbau, 0.0)
    lines: [4]
    fix:
      - line: 4
        answers:
          - camera.offset = (dir * max_px * s).round()
          - camera.offset = (dir * s * max_px).round()
          - camera.offset = (max_px * s * dir).round()
    explanation: |
      Mit `+=` addiert sich jeder Ausschlag zum vorigen. Die Kamera macht einen Zufallsweg, und wenn trauma bei 0 ankommt, bleibt sie dort stehen, wo der Weg zufällig endet. Mit `=` ist der Ausschlag in jedem Frame neu, und bei trauma 0 ist `offset` wieder `(0, 0)`. Ein Shake ist eine Abweichung von der Ruhelage, keine Bewegung.
    resources:
      - title: Godot Docs · Camera2D.offset
        url: https://docs.godotengine.org/en/stable/classes/class_camera2d.html#class-camera2d-property-offset

  - id: hitstop-kosten
    type: explain
    title: Was der Treffer den Angreifer kostet
    prompt: |
      Erkläre an diesem echten Log, was der Hitstop von 4 Frames kostet und was er nicht verändert.
    lang: text
    code: |
      12  Spieler MOVE -> WINDUP
      20  Spieler WINDUP -> ACTIVE
      21  Dummy getroffen: Zone body …
      27  Spieler ACTIVE -> RECOVERY
      36  Dummy HITSTUN -> WAIT
      41  Spieler RECOVERY -> MOVE
    points:
      - Ohne Treffer begänne die Erholung in Frame 23 und die Figur wäre ab 37 frei; mit Treffer erst in 27 und ab 41.
      - Beide stehen gleich lang still, deshalb ändert die Länge des Hitstops den Abstand nicht; der Angreifer ist so oder so 5 Frames im Nachteil.
      - In einer Kombo addiert sich jeder Hitstop zur Gesamtdauer.
      - Bei lokalem Hitstop laufen alle anderen weiter; Sakurai begrenzt ihn in Smash, weil ein dritter Spieler den Stillstand ausnutzen könnte.
    explanation: |
      Der Hitstop hält die aktive Phase des Spielers an, also endet sie in Frame 27 statt 23, und die Figur ist 4 Frames später frei. Der Dummy steht genauso lang, deshalb bleibt der Abstand zwischen beiden gleich: Mit diesen Platzhaltern hat der Angreifer nach dem Treffer 5 Frames Nachteil, mit Hitstop 8 ebenso. Was sich ändert, ist die Dauer jeder Aktion mit Treffer und damit das Tempo des Kampfs. Und während Angreifer und Ziel stehen, handelt jeder andere weiter. In Smash ist das der Grund für Sakurais Grenze, in der Draufsicht mit mehreren Gegnern gilt dieselbe Rechnung.
    resources:
      - title: Source Gaming · Sakurais Kolumne zum Hitstop (Fan-Übersetzung)
        url: https://sourcegaming.info/2015/11/11/thoughts-on-hitstop-sakurais-famitsu-column-vol-490-1/

  - id: clip-hitstop-shake
    type: practice
    title: "Clip-Analyse: Hitstop und Shake bei Sakurai"
    prompt: |
      Sieh dir [Eight Hit Stop Techniques](https://www.youtube.com/watch?v=tycbMSjDDLg) (5:32) und [Screen Shake](https://www.youtube.com/watch?v=2JXR7IASSog) (3:39) an. Halte bei jeder Technik an. Notiere zu jeder in einem Satz, was im Bild passiert, und ob sie in einer Draufsicht ohne Boden und Luft anders funktionieren müsste. Die zweite Frage beantwortest du für dich, es gibt keine richtige Antwort.
    lang: text
    solution: |
      Beispiel für die Form, nicht für den Inhalt deiner Notizen:

      Technik: Zittern seitlich am Boden,
        in der Luft in alle Richtungen
      Im Bild: Figur am Boden wackelt nur
        links-rechts.
      Draufsicht: Es gibt kein Oben/Unten für Luft.
        Offen: Zittern in Schlagrichtung? Immer seitlich?

      Technik: Shake klein nur senkrecht
      Im Bild: kleiner Treffer, Bild hüpft auf und ab.
      Draufsicht: senkrecht heißt hier
        „nach oben im Bild“, nicht „nach oben
        in der Welt“.
        Offen: Muster je Angriffsklasse wie bei Sakurai?
    checklist:
      - Du hast zu jeder Technik aus beiden Clips eine Zeile notiert, was im Bild passiert.
      - Bei mindestens drei Techniken hast du notiert, ob sie sich auf eine Draufsicht übertragen lässt und was offen bleibt.
      - Du hast notiert, an welchen Stellen Sakurai eine Zahl nennt und an welchen nicht.
      - Deine offenen Fragen sind Fragen, keine Festlegungen für dein Spiel.
    explanation: |
      Sakurais Clips zeigen Regeln aus einem Spiel mit Seitenansicht. Manche lassen sich direkt übernehmen, etwa „Hurtboxen bleiben stehen“ oder „Zittern klingt ab“. Andere hängen an Boden und Luft, und die gibt es in der Draufsicht nicht. Diese Stellen sind die interessanten: Dort musst du für dein Spiel eine eigene Regel finden. Die Übung sammelt sie, entscheiden musst du später.
    resources:
      - title: Masahiro Sakurai · Eight Hit Stop Techniques
        url: https://www.youtube.com/watch?v=tycbMSjDDLg
      - title: Masahiro Sakurai · Screen Shake
        url: https://www.youtube.com/watch?v=2JXR7IASSog

  - id: feedback-notiz
    type: practice
    title: Ein Feedback-Plan für den Trainingsdummy
    prompt: |
      Schreib eine kurze Notiz, welches Trefferfeedback du am Trainingsdummy der Testszene ausprobieren willst. Für jedes Mittel: an oder aus, ein Platzhalterwert und was du erwartest. Leg fest, in welcher Reihenfolge du die Mittel einzeln testest. Getestet wird später am PC.
    lang: text
    solution: |
      Beispiel für die Form, ausdrücklich keine Vorgabe:

      Trainingsdummy, Angriff A (Platzhalter)
      Mittel       Wert          Erwartung
      Hitstop      4 Frames      Treffer fällt mir auf
      Shake        aus           –
      Blitz        9 Frames      sehe, wer getroffen ist
      Knockback    120 px/s      Dummy rückt aus Reichweite?
      Ton          aus           –

      Reihenfolge der Tests:
      1. Hitstop 0 gegen 4, sonst alles gleich
      2. danach Shake an/aus
      Preis, den ich beobachte: Angriff 4 Frames länger
    checklist:
      - Jedes Mittel hat einen Wert mit Einheit oder steht ausdrücklich auf „aus“.
      - Zu jedem Mittel, das an ist, steht eine Erwartung, aufgeschrieben vor dem Test.
      - Zu mindestens einem Mittel hast du den Preis notiert, den du beim Test beobachten willst.
      - Jeder geplante Test ändert genau ein Mittel.
      - Die Werte sind deine Platzhalter; du hast keinen Wert als „richtig“ markiert.
    explanation: |
      Die Notiz trennt Plan und Urteil. Vorher schreibst du auf, was du erwartest, nachher vergleichst du mit dem, was du gespielt hast. Ein Mittel pro Test, sonst weißt du nicht, welches den Unterschied gemacht hat. Die Werte sind deine; der Kurs gibt dir keine. Wie aus der Notiz ein sauberer Vergleich wird, steht in [Tuning als Experiment](/combat/tuning), und wie du sie einem Coding-Agenten gibst, in [Kampfmechanik als Vorgabe](/combat/vorgaben).
    resources:
      - title: Mike Ambinder · Valve's Approach to Playtesting (GDC 2009, PDF)
        url: https://cdn.fastly.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf
