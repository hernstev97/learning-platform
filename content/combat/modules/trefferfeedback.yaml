id: trefferfeedback
title: "Trefferfeedback: Hitstop, Screenshake, Blitz und Ton"
level: 2
minutes: 100
summary: Was im Moment eines Treffers passiert, damit der Spieler ihn bemerkt – Hitstop, Screenshake, Blitz, Trefferzeichen, Knockback und Ton –, wie veröffentlichte Spiele diese Mittel dosieren und was jedes davon kostet.
goals:
  - Du beschreibst Hitstop mit Sakurais Techniken und rechnest aus, um wie viele Frames er eine Aktion verlängert.
  - Du begründest mit dem gemessenen Verhalten von Godot 4.7.2, warum die Testszene Figuren einzeln anhält statt über `Engine.time_scale`.
  - Du modellierst Screenshake als abklingenden Trauma-Wert und rechnest ihn für 320 × 180 in ganze Pixel um.
  - Du nennst Regeln, nach denen Blitz und Trefferzeichen sichtbar sind, ohne Figuren zu verdecken.
  - Du ordnest Knockback und Trefferton veröffentlichter Spiele ein und nennst ihre Kosten.
