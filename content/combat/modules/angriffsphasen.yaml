lesson: |
  In der Testszene drückst du in Frame 12 auf Angriff. Die Hitbox geht in Frame 20 an, der Dummy meldet den Treffer in Frame 21, und frei ist die Figur erst wieder in Frame 41. Von diesen 29 Frames, knapp einer halben Sekunde, ist die Hitbox 3 Frames lang wirksam, 4 weitere friert der Hitstop ein. Den Rest der Zeit holt die Figur aus oder erholt sich. Das ist kein Sonderfall: Laut dem Fighting Game Glossary von Infil haben die meisten Angriffe nur etwa 1 bis 4 aktive Frames, obwohl der ganze Angriff 30 Frames dauern kann ([Active](https://glossary.infil.net/?t=Active)).

  Wer einen Angriff beurteilen will, muss ihn deshalb zerlegen: Wann trifft er, wie lange, und was kostet er danach? Diese Lektion trennt die Phasen, liest offizielle Frame-Daten und zeigt, welche Aufgabe jede Phase für den Spieler hat. Welche Werte deine Angriffe bekommen, entscheidest du später selbst.

  ## Vier Phasen nach Sakurai: Idle, Lead-in, Attack, Follow-through

  Masahiro Sakurai (Kirby, Super Smash Bros.) teilt Angriffsanimationen in vier Phasen ([Breaking Down Attack Animations](https://www.youtube.com/watch?v=LewXWM7HDd8)):

  | Phase | Begriff im Kurs | Was passiert |
  | --- | --- | --- |
  | Idle | frei | Grundpose |
  | Lead-in | Wind-up | Ausholen |
  | Attack | aktive Phase | Hitbox an |
  | Follow-through | Erholung | Figur gebunden |

  - **Idle** ist die Pose, aus der fast jede Bewegung entsteht. Sakurai baut sie zuerst und ändert sie danach nicht mehr.
  - **Lead-in** ist der **Wind-up** (Startup), die Ausholphase vor dem Treffer. In Sakurais Spielen springt die Figur schon im ersten Frame weit in die Ausholpose, statt weich aus Idle hineinzugleiten. Der Spieler sieht so sofort, dass seine Eingabe angekommen ist, und der Gegner bekommt das Signal auszuweichen (ab etwa 0:43).
  - **Attack** ist die Pose, in der die **Hitbox** erscheint, die Fläche, mit der ein Angriff trifft. Ein Treffer löst meist einen **Hitstop** aus, ein kurzes Einfrieren von Angreifer und Ziel. Die Pose steht dann still im Bild und muss sitzen.
  - **Follow-through** ist die **Erholung** (Recovery): Die Hitbox ist aus, der Spieler kann noch nicht handeln. Sakurai füllt diese Zeit mit Bewegung, statt die Figur halb in Idle hängen zu lassen.

  Ab etwa 2:39 nennt Sakurai die vier Angaben, die seine Animatoren für jeden Angriff bekommen: Idle-Pose, Angriffspose, den Frame, in dem die Hitbox erscheint, und die Gesamtframes, also die Zeit bis zum Abbruch. Zwei Zahlen legen damit das Timing fest. Für den Platzhalterangriff der Testszene:

  ```text
  Wind-up 8, aktiv 3, Erholung 14
  Frame  1–8   Wind-up    Lead-in
  Frame  9–11  aktiv      Attack
  Frame 12–25  Erholung   Follow-through
  Frame 26     frei       Idle
  ```

  Hitbox-Frame 9, Gesamtframes 25. Dasselbe als Modell, das zu jedem Frame die Phase nennt. Ändere die Platzhalter in der ersten Zeile und lass den Block erneut laufen:

  ```python run
  windup, aktiv, erholung = 8, 3, 14

  def phase(f):
      if f <= windup:
          return "Wind-up"
      if f <= windup + aktiv:
          return "aktiv"
      if f <= windup + aktiv + erholung:
          return "Erholung"
      return "frei"

  for f in (1, 8, 9, 11, 12, 25, 26):
      print(f, phase(f))
  ```

  ## Frame-Daten lesen und Phasen vergleichen

  Capcom veröffentlicht für Street Fighter 6 offizielle Frame-Daten. Drei Standardangriffe von Ryu, Stand Oktober 2026; die Werte ändern sich mit Patches ([Ryu Frame Data](https://www.streetfighter.com/6/character/ryu/frame)):

  | Angriff | Startup | Active | Recovery |
  | --- | --- | --- | --- |
  | St. LP | 4 | 4-6 | 7 |
  | St. MP | 6 | 6-9 | 11 |
  | St. HP | 10 | 10-14 | 18 |

  St. steht für Standing, LP, MP und HP für leichten, mittleren und schweren Schlag. Die Legende der Tabelle erklärt die Zählung: Steht dort 10-12, ist die Hitbox in den Frames 10 bis 12 aktiv. Frame 10 ist dann der erste aktive Frame. **Startup zählt den ersten aktiven Frame mit.**

  Die Testszene zählt anders: Wind-up 8 sind die 8 Frames vor der Hitbox, die Hitbox kommt in Frame 9. Wind-up 8 entspricht Startup 9. Infil warnt, dass Communitys hier unterschiedlich zählen, und rät, für jedes Spiel nachzufragen ([Startup](https://glossary.infil.net/?t=Startup)). Recovery zählt in beiden Fällen die Frames nach der aktiven Phase, bis die Figur wieder handeln kann ([Recovery](https://glossary.infil.net/?t=Recovery)).

  > [!MERKE]
  > Wind-up = Startup − 1. Aktive Frames = letzter − erster aktiver Frame + 1. Gesamtdauer = Wind-up + aktiv + Erholung. Frei ist die Figur im Frame danach.

  ```python run
  # Street Fighter 6, Ryu, Stand Oktober 2026
  # (Startup, letzter aktiver Frame, Recovery)
  angriffe = {
      "St. LP": (4, 6, 7),
      "St. MP": (6, 9, 11),
      "St. HP": (10, 14, 18),
  }
  for name, werte in angriffe.items():
      startup, bis, rec = werte
      windup = startup - 1
      aktiv = bis - startup + 1
      gesamt = windup + aktiv + rec
      print(name, windup, aktiv, rec, gesamt)
  ```

  Der schwere Schlag belegt 32 Frames, rund 533 ms (ms = Frames × 1000 / 60), und trifft in 5 davon. Diese Zahlen gehören zu Street Fighter 6, mit seiner Eingabeverzögerung, seinen Reichweiten und seinem Tempo. Sie sind Messpunkte zum Vergleichen, keine Vorlage für ein Top-down-Spiel.

  ### Kurz bis zum Treffer, lang danach

  Sakurai sagt in [Follow-Throughs Make the Impact](https://www.youtube.com/watch?v=cIB0BUe6Ihk): Standardangriffe in Smash enden in weniger als etwa einer Sekunde (ab 0:51). Die Hitbox erscheint nach etwa einem Drittel bis einem Viertel der Gesamtzeit, manchmal schon nach einem Fünftel; der Rest ist Follow-through (ab 1:03). Seine Gesamtzeit reicht bis zum ersten Abbruch-Frame. Weil die Erholung so lang ist, sieht der Spieler sie am längsten. Sakurai will, dass sie zeigt, was gerade passiert ist. Rechne den Anteil für die Testszene und zwei SF6-Angriffe nach, als ersten aktiven Frame geteilt durch die Gesamtdauer:

  ```python run
  def anteil(windup, aktiv, erholung):
      gesamt = windup + aktiv + erholung
      return round((windup + 1) / gesamt, 2)

  print(anteil(8, 3, 14))  # Testszene
  print(anteil(9, 5, 18))  # SF6 St. HP
  print(anteil(3, 3, 7))   # SF6 St. LP
  ```

  Alle drei liegen nahe einem Drittel. Das ist eine Beobachtung an drei Angriffen, keine Regel. In seiner Kolumne zum Frame-Zählen nennt Sakurai eine zweite Größenordnung: Bei einem Smash-Angriff erscheint die erste Hitbox nach etwa 15 Frames, bei Street Fighter 2 nach etwa der Hälfte ([Learn to Count Frames!](https://sourcegaming.info/2018/05/18/learn-to-count-frames-sakurais-famitsu-column-vol-552/), Fan-Übersetzung).

  ### Pixelart hat wenige Bilder

  Physik-Frames legen fest, wann etwas passiert. Animationsframes, also Zeichnungen, legen fest, was man dabei sieht. In Dead Cells sind die Figuren 50 Pixel hoch, die Animationen laufen mit 30 Bildern pro Sekunde. Bei 60 Physik-Frames steht jede Zeichnung also mindestens zwei Frames. Ist eine Waffe zu stark, verlangsamt das Team ihre Angriffsanimation ([Art Design Deep Dive](https://www.gamedeveloper.com/production/art-design-deep-dive-using-a-3d-pipeline-for-2d-animation-in-i-dead-cells-i-)). Mariel Cartwright zeigt für das Sprite-Spiel Skullgirls einen schwachen Angriff mit sechs Zeichnungen, eine davon Ausholen: „you don't really see it … but you feel it“ (ab 2:47). Gleich lange Haltezeiten verschwenden Frames; ihr Team hielt die Schlüsselposen länger und die Wischbilder (Smears) kürzer (ab 11:59). Ein Schlag mit sieben Zeichnungen wurde mit einer weniger vor dem Treffer „a lot snappier“ (ab 18:20, [GDC 2014](https://www.youtube.com/watch?v=Mw0h9WmBlsw)).

  ## Wind-up: Rückmeldung, Lesbarkeit, Wucht

  Der Wind-up hat drei Aufgaben, die gegeneinander arbeiten können.

  **Rückmeldung.** Sakurai lässt die Figur in dem Frame reagieren, in dem das Spiel den Druck sieht. Er nennt das in [Making Lead-ins Instant and Impactful](https://www.youtube.com/watch?v=E8DKndKkHw8) das Ideal: Die Pose ändert sich ab dem Druck stark, auch wenn der Übergang aus Idle dadurch springt (ab 0:42). Ian Cofino beschreibt dasselbe für das Top-down-Spiel Dreamscaper: Der Angriff springt sofort in die Ausholpose, die Startup-Frames laufen trotzdem ab ([GDC 2022, ab 22:10](https://www.youtube.com/watch?v=3Omb5exWpd4&t=1330s)). Sofort reagieren heißt nicht sofort treffen.

  **Wucht.** Es gibt Angriffe fast ohne Wind-up. Bei Sakurai kommt der Jab von Zero Suit Samus einen Frame nach dem Druck (ab 1:19). Ohne richtiges Ausholen fehlt einem Treffer aber die Wucht, und online kann der Wind-up Verzögerung durch das Netz überdecken (ab 1:45). Schneller ist deshalb nicht automatisch besser.

  **Lesbarkeit.** Beim Gegner ist der Wind-up deine Reaktionszeit. Cartwright trennt das im selben Vortrag: Die Spielfigur muss auf Tastendrücke fast sofort reagieren, Gegner brauchen lange Wind-ups, damit der Spieler ausweichen, blocken oder weglaufen kann. Laut Infil treffen Angriffe mit 20 oder mehr Frames Startup selbst sehr gute Spieler oft ([Reaction](https://glossary.infil.net/?t=Reaction)). Ein lesbarer Wind-up hat eine eigene Pose mit klarer Silhouette und, wenn das Spiel es vorsieht, einen **Telegraph**: eine Ankündigung durch Blinken, Bodenmarkierung oder Sound. Bei wenigen Zeichnungen trägt jede Pose mehr: Ist sie nicht auf den ersten Blick lesbar, fehlt die Ankündigung. Mehr in [Gegnermuster und Telegraphing](/combat/gegnermuster).

  ## Erholung und Frame Advantage: wer zuerst wieder frei ist

  Die Erholung bestimmt, was ein Angriff kostet. Sakurai begründet sie mit dem Taktieren zwischen den Spielern: Hätten starke Angriffe keine nennenswerte Erholung, würde das Spiel grob und verlöre seine Feinheiten (Follow-Throughs, ab 0:39). Dreamscaper lässt das Ausweichen fast jede Aktion abbrechen, gibt Angriffen aber Startup und Erholung, damit Spieler bewusst angreifen (ab 22:57). Auch die SF6-Tabelle zeigt die Erholung als Preis: Verfehlt Ryus St. MP, kommen laut Capcom 2 Frames Erholung dazu.

  Einen Treffer in die Erholung des Gegners nennt man **Punish** (Bestrafen) ([Punish](https://glossary.infil.net/?t=Punish)). Ein Log der Testszene mit Ausweichen zeigt das Fenster:

  ```text
      34  Dummy ACTIVE -> RECOVERY
      46  Spieler DODGE -> DODGE_RECOVERY
      54  Spieler DODGE_RECOVERY -> MOVE
      64  Dummy RECOVERY -> WAIT
  ```

  Die Figur ist ab Frame 54 frei, der Dummy erholt sich bis Frame 63: 10 Frames Punish-Fenster. Jeder Frame mehr Erholung beim Dummy macht das Fenster einen Frame länger (siehe [Ausweichen, Risiko und Belohnung](/combat/ausweichen)).

  **Frame Advantage** beschreibt, wer nach einem Treffer oder einem geblockten Angriff zuerst wieder handeln kann ([Frame Advantage](https://glossary.infil.net/?t=Frame+Advantage)). SF6 nennt den Wert in zwei Spalten:

  | Angriff | on Hit | on Block |
  | --- | --- | --- |
  | St. LP | +4 | -1 |
  | St. MP | +7 | -1 |
  | St. HP | +4 | -2 |

  +4 on Hit heißt: Ryu kann 4 Frames vor dem getroffenen Gegner wieder handeln. −2 on Block heißt: Der Gegner ist 2 Frames früher frei als Ryu. Aus einem Log liest du dasselbe ab. Der Lauf mit Treffer aus der Testszene:

  ```text
      12  Spieler MOVE -> WINDUP
      20  Spieler WINDUP -> ACTIVE
      21  Dummy getroffen: Zone body, …
      21  Dummy WAIT -> HITSTUN
      27  Spieler ACTIVE -> RECOVERY
      36  Dummy HITSTUN -> WAIT
      41  Spieler RECOVERY -> MOVE
  ```

  ```python run
  spieler_frei = 41   # RECOVERY -> MOVE
  dummy_frei = 36     # HITSTUN -> WAIT

  vorteil = dummy_frei - spieler_frei
  print(f"Spieler {vorteil:+d} on Hit")
  ```

  Mit diesen Platzhaltern ist der Angreifer nach einem Treffer 5 Frames im Nachteil. Drei Größen verschieben das Ergebnis: **Hitstun**, die Frames, in denen das Ziel nach dem Treffer nicht handeln kann, die Erholung des Angreifers und die Zahl der aktiven Frames, die nach dem Treffer noch laufen. Hier sind es 2 aktive plus 14 Erholung gegen 11 Frames Hitstun nach dem Hitstop: (12 − 1) − (2 + 14) = −5. Der Hitstop verlängert beide Seiten gleich, deshalb wechselt die Figur erst in Frame 27 statt 23 in die Erholung.

  > [!INTERVIEW]
  > „Was heißt −2 on Block in einer Frame-Tabelle, und wie prüfst du so einen Wert in deinem Spiel?“ Gute Antwort: Nach einem geblockten Angriff ist der Angreifer zwei Frames länger gebunden als der Verteidiger, der also zuerst handeln kann. Ein Spiel ohne Block stellt dieselbe Frage nach einem Treffer oder Fehlschlag: Wer ist zuerst frei? Im Log liest du es ab, als Ende der Erholung des Angreifers gegen das Ende des Hitstuns beim Ziel. Ob ein Angriff sicher sein soll, entscheidet das Design; die Zahl zeigt nur, ob er es ist.

  ## Anschlussangriffe und Abbruchfenster

  Ein **Cancel** (Abbruchfenster) erlaubt, die Erholung abzubrechen und sofort die nächste Aktion zu starten ([Cancel](https://glossary.infil.net/?t=Cancel)). Sakurai setzt dafür Cancel-Frames in den Follow-through: Ab ihnen darf die Figur laufen, springen oder angreifen, bevor sie ganz in Idle zurück ist. Bis Smash Melee gab es das nicht, und die Steuerung fühlte sich schwer und eng an (Breaking Down, ab 2:06). Die Pose im Cancel-Frame muss schon bereit aussehen (Follow-Throughs, ab 3:40).

  In der Testszene heißt das Fenster `cancel_from`. Mit `cancel_from = 6` darf ab dem sechsten Erholungsframe ein gepufferter Angriff starten. Im echten Lauf beginnt die Erholung in Frame 27, der Anschluss startet in Frame 32:

  ```text
      27  Spieler ACTIVE -> RECOVERY
      31  Druck attack
      32  Spieler RECOVERY -> WINDUP
  ```

  Ein Cancel macht noch keine Kombination. Mit Wind-up 8 geht die Hitbox des zweiten Angriffs in Frame 40 an. Nach demselben ersten Treffer ist der Dummy laut Log aber schon ab Frame 36 frei. Ein Gegner, der handeln kann, hätte 4 Frames, um auszuweichen. Ob ein Anschluss garantiert treffen soll, ob es ihn nur nach einem Treffer gibt und ab welchem Frame, entscheidest du für dein Spiel.

  > [!PRAXIS]
  > Sakurais vier Angaben sind eine Schnittstelle zwischen Design und Animation. Cofino sagt in der Fragerunde seines Vortrags, dass er die Frame-Werte von Dreamscaper allein im Kopf behielt; in einem größeren Team müsse man sie anderen mitteilen. Für dich ist der Coding-Agent dieses Team. Schreib Hitbox-Frame, Gesamtframes und Abbruch-Frame in jede Vorgabe, mit der Zählweise dazu (siehe [Kampfmechanik als Vorgabe für einen Coding-Agenten](/combat/vorgaben)).

  ## Häufige Fehler

  - **Startup als Wind-up übernommen.** Startup 10 aus einer SF6-Tabelle als `windup = 10` eingetragen: Die Hitbox kommt einen Frame zu spät. Wind-up = Startup − 1.
  - **Active 10-14 als 4 Frames gelesen.** Beide Grenzen gehören dazu, es sind 5.
  - **Gesamtdauer mit Startup gerechnet.** Startup + Active + Recovery zählt den ersten aktiven Frame doppelt.
  - **Erste Pose nicht gemessen.** Wer nur die Frames bis zur Hitbox zählt, übersieht, ob im ersten Frame nach dem Druck sichtbar etwas passiert. Sieht der Anfang aus wie Idle, hält der Spieler seine Eingabe leicht für verloren.
  - **Die falsche Phase geändert.** Der Angriff wirkt träge, und du kürzt die Erholung, obwohl der späte Treffer stört. Erst messen, welche Phase gemeint ist.
  - **Frame Advantage ohne Hitstop gerechnet.** Der Hitstop verlängert die aktive Phase im Log. Lies die Zustandswechsel ab, statt Platzhalter zu addieren.
  - **Werte eines anderen Spiels übernommen.** SF6-Werte gehören zu SF6. Für dein Spiel sind sie Vergleichspunkte, keine Vorgabe.

  ## Zusammenfassung

  - Ein Angriff hat vier Phasen: Idle, Lead-in (Wind-up), Attack (aktive Phase), Follow-through (Erholung). Hitbox-Frame und Gesamtframes legen das Timing fest.
  - Offizielle SF6-Daten zählen den ersten aktiven Frame zum Startup. Wind-up 8 entspricht Startup 9; Active 10-14 sind 5 Frames.
  - Nach Sakurai erscheint die Hitbox nach etwa einem Drittel bis einem Viertel der Gesamtzeit. Die lange Erholung sieht der Spieler am längsten.
  - Der Wind-up gibt Rückmeldung im ersten Frame, liefert Wucht und macht Gegnerangriffe lesbar. Sofort reagieren heißt nicht sofort treffen.
  - Die Erholung ist der Preis eines Angriffs und das Punish-Fenster des Gegners.
  - Frame Advantage ist die Differenz der ersten freien Frames. Im Testszene-Lauf ist der Angreifer nach einem Treffer bei −5.
  - Ein Abbruchfenster verkürzt den Preis, macht aber noch keine garantierte Kombination.
  - Physik-Frames bestimmen das Timing, Zeichnungen das Bild. Pixelart hat wenige davon.
exercises:
  - id: vier-vorgaben
    type: choice
    title: Was Animatoren bei Sakurai bekommen
    prompt: |
      Sakurai gibt seinen Animatoren für jeden Angriff feste Angaben mit. Welche gehören dazu?
    options:
      - text: Die Idle-Pose
        correct: true
        why: Aus ihr startet jeder Angriff, und in sie kehrt er zurück. Sie ist die erste der vier Angaben.
      - text: Die Angriffspose
        correct: true
        why: Das ist die Pose, in der die Hitbox erscheint. Der Hitstop friert sie ein, deshalb muss sie feststehen.
      - text: Der Frame, in dem die Hitbox erscheint, und die Gesamtframes bis zum Abbruch
        correct: true
        why: Diese zwei Zahlen trennen Lead-in und Follow-through. Mit ihnen steht das Timing fest.
      - text: Die Zahl der Zeichnungen für den Angriff
        correct: false
        why: Sakurai legt Zeitpunkte fest, nicht wie viele Bilder der Animator zeichnet. Wie er die Zeit füllt, ist Sache der Animation.
      - text: Die Größe der Hitbox in Pixeln
        correct: false
        why: Animatoren sollen die Hitbox im Kopf haben, aber sie gehört nicht zu den vier Angaben. Die setzt bei Sakurai die Planung.
    explanation: |
      Die vier Angaben sind Idle-Pose, Angriffspose, Hitbox-Frame und Gesamtframes, also die Zeit bis zum Abbruch. Zwischen den ersten beiden liegt der Lead-in, zwischen Hitbox-Frame und Ende der Follow-through. So kann der Animator frei gestalten, und das Timing bleibt trotzdem fest. Für dich als Designer heißt das: Diese Werte gehören in jede Vorgabe, egal ob sie an einen Animator oder einen Coding-Agenten geht.
    resources:
      - title: Masahiro Sakurai · Breaking Down Attack Animations (ab 2:39)
        url: https://www.youtube.com/watch?v=LewXWM7HDd8&t=159s

  - id: frame-vorteil-lesen
    type: choice
    title: Plus und minus
    prompt: |
      Aus den SF6-Daten von Ryu (Stand Oktober 2026): St. LP ist +4 on Hit und −1 on Block, St. HP ist +4 on Hit und −2 on Block. Welche Aussagen stimmen?
    options:
      - text: Nach einem geblockten St. LP ist der Gegner 1 Frame früher frei als Ryu.
        correct: true
        why: −1 on Block heißt, Ryu erholt sich einen Frame nach dem Ende des Blockstuns.
      - text: Trifft St. HP, kann Ryu 4 Frames vor dem Gegner wieder handeln.
        correct: true
        why: +4 on Hit heißt, der Gegner steckt noch 4 Frames im Hitstun, wenn Ryu frei ist.
      - text: +4 on Hit bedeutet, dass der Angriff 4 Frames lang treffen kann.
        correct: false
        why: Wie lange die Hitbox da ist, steht in der Spalte Active. Frame Advantage vergleicht die ersten freien Frames beider Figuren.
      - text: Nach einem geblockten St. HP kann der Gegner ihn mit einem eigenen Angriff mit Startup 4 bestrafen.
        correct: false
        why: Der Gegner ist 2 Frames früher frei. Ein Angriff mit Startup 4 hat seine Hitbox erst im vierten Frame, dann ist Ryu schon frei. Bestrafen könnte ihn nur ein Angriff mit Startup 2 oder weniger.
    explanation: |
      Frame Advantage beschreibt, wer nach einem Treffer oder Block zuerst wieder handeln kann. Ein Plus heißt, der Angreifer ist früher frei, ein Minus, der Verteidiger. Ob ein Minus bestraft werden kann, hängt am schnellsten Angriff des Gegners: In der SF6-Zählung bestraft ein Angriff mit Startup 8 alles, was −8 oder schlechter ist. Reichweite spielt auch mit, deshalb ist das eine Rechnung unter der Annahme, dass der Gegner nah genug steht.
    resources:
      - title: Infil · Frame Advantage
        url: https://glossary.infil.net/?t=Frame+Advantage
      - title: Street Fighter 6 · Ryu Frame Data
        url: https://www.streetfighter.com/6/character/ryu/frame

  - id: angriff-ablauf
    type: order
    title: Ein Angriff von vorn bis hinten
    prompt: |
      Bring die Ereignisse eines Angriffs mit Treffer und Abbruchfenster in die Reihenfolge, in der sie passieren.
    lang: prose
    lines: |
      Taste gedrückt, die Figur springt in die Ausholpose
      Der Wind-up läuft, die Hitbox ist noch aus
      Die Hitbox erscheint, die Angriffspose steht
      Treffer, der Hitstop friert die Pose ein
      Die Hitbox geht aus, die Erholung beginnt
      Das Abbruchfenster öffnet sich
      Die Figur steht wieder in der Idle-Pose
    explanation: |
      Der Posensprung kommt im ersten Frame, damit die Eingabe sofort sichtbar ist. Danach läuft der Rest des Wind-ups, bis die Hitbox erscheint. Der Hitstop setzt mit dem Treffer ein, also während der aktiven Phase. Das Abbruchfenster liegt in der Erholung, vor der fertigen Idle-Pose; genau das macht es nützlich, denn ab dort darf die Figur schon wieder handeln.
    resources:
      - title: Masahiro Sakurai · Breaking Down Attack Animations
        url: https://www.youtube.com/watch?v=LewXWM7HDd8

  - id: sf6-aktive-frames
    type: output
    title: Wie lange trifft der schwere Schlag?
    prompt: |
      Ryus St. HP in Street Fighter 6 (Stand Oktober 2026). Wie viele Frames ist die Hitbox aktiv? Antworte mit der Zahl.
    lang: text
    code: |
      Angriff  Startup  Active  Recovery
      St. HP   10       10-14   18
    expected: |
      5
    accept:
      - 5 Frames
    explanation: |
      Active 10-14 heißt: Die Hitbox ist in den Frames 10, 11, 12, 13 und 14 da. Beide Grenzen zählen, also 14 − 10 + 1 = 5. Wer nur 14 − 10 rechnet, verliert einen Frame. Das ist derselbe Fehler wie bei `range(10, 14)` in Python, das die 14 nicht enthält.
    resources:
      - title: Street Fighter 6 · Ryu Frame Data
        url: https://www.streetfighter.com/6/character/ryu/frame

  - id: sf6-gesamtdauer
    type: output
    title: Wann ist Ryu wieder frei?
    prompt: |
      Derselbe Angriff. Wie viele Frames dauert er insgesamt, vom ersten Frame nach dem Druck bis zum letzten Erholungsframe, wenn er nichts trifft? Antworte mit der Zahl.
    lang: text
    code: |
      Angriff  Startup  Active  Recovery
      St. HP   10       10-14   18
    expected: |
      32
    accept:
      - 32 Frames
    hints:
      - Rechne zuerst in die Zählung der Testszene um, also in Wind-up, aktiv und Erholung.
      - Wind-up ist Startup − 1.
    explanation: |
      Wind-up 9 (Startup 10 minus den ersten aktiven Frame), aktiv 5, Erholung 18: 9 + 5 + 18 = 32 Frames, rund 533 ms. Wer Startup + 5 + 18 = 33 rechnet, zählt Frame 10 doppelt. Wer 10 + 18 = 28 rechnet, vergisst die übrigen aktiven Frames. Ohne Treffer gibt es keinen Hitstop, deshalb gilt die Rechnung hier unverändert.
    resources:
      - title: Infil · Startup
        url: https://glossary.infil.net/?t=Startup

  - id: phase-vorhersagen
    type: output
    title: In welcher Phase ist die Figur?
    prompt: |
      Was gibt das Programm aus? Die Antwort ist eine Zeile.
    lang: python
    code: |
      windup, aktiv, erholung = 6, 2, 10

      def phase(f):
          if f <= windup:
              return "Wind-up"
          if f <= windup + aktiv:
              return "aktiv"
          if f <= windup + aktiv + erholung:
              return "Erholung"
          return "frei"

      print(phase(7), phase(9), phase(19))
    expected: |
      aktiv Erholung frei
    explanation: |
      Mit Wind-up 6 ist Frame 7 der erste aktive Frame. Die aktive Phase belegt die Frames 7 und 8, Frame 9 ist der erste Erholungsframe. Die Erholung reicht bis 6 + 2 + 10 = 18, Frame 19 ist frei. Die Vergleiche mit `<=` setzen genau die Zählung ab 1 um, die auch die Testszene nutzt.

  - id: vorteil-nach-hitstun
    type: output
    title: Mehr Hitstun, anderes Vorzeichen
    prompt: |
      Du stellst in der Testszene `hitstun` von 12 auf 18 (Platzhalter gegen Platzhalter), alles andere bleibt. Welchen Frame Advantage hat der Spieler nach dem Treffer? Antworte mit Vorzeichen, wie in Frame-Daten.
    lang: text
    code: |
      Vorher (gemessen):
          36  Dummy HITSTUN -> WAIT
          41  Spieler RECOVERY -> MOVE
      Nachher:
          ??  Dummy HITSTUN -> WAIT
          41  Spieler RECOVERY -> MOVE
    expected: |
      +1
    accept:
      - "1"
      - +1 Frame
      - 1 Frame
    hints:
      - Sechs Frames mehr Hitstun schieben `HITSTUN -> WAIT` um sechs Frames nach hinten.
      - Frame Advantage = erster freier Frame des Ziels − erster freier Frame des Angreifers.
    explanation: |
      Der Dummy bleibt sechs Frames länger im Hitstun und ist erst ab Frame 42 frei. Der Spieler ist unverändert ab 41 frei. 42 − 41 = +1: Aus −5 wird +1. Hitstun ist damit eine der drei Größen, die den Frame Advantage verschieben; die anderen sind die Erholung des Angreifers und die aktiven Frames nach dem Treffer. Ob dein Spieler nach einem Treffer im Vorteil sein soll, ist eine Designentscheidung; diese Rechnung zeigt nur, wo sie sitzt.
    resources:
      - title: Infil · Hit Stun
        url: https://glossary.infil.net/?t=Hit+Stun

  - id: sf6-umrechnen
    type: gap
    title: Vom SF6-Format in die Testszene
    prompt: |
      Trag Ryus St. MP (Stand Oktober 2026) in der Zählung der Testszene ein. Alle Werte in Frames.
    lang: text
    code: |
      SF6 St. MP: Startup 6, Active 6-9, Recovery 11
      Testszene:
        windup   = ⟦5⟧
        active   = ⟦4⟧
        recovery = ⟦11⟧
        gesamt   = ⟦20⟧
    gaps:
      - label: Wind-up
        hint: Startup zählt den ersten aktiven Frame mit.
      - label: Aktive Frames
        hint: Von 6 bis einschließlich 9.
      - label: Erholung
        hint: Recovery zählt in beiden Formaten gleich.
      - label: Gesamtdauer
        hint: Wind-up + aktiv + Erholung.
    explanation: |
      Wind-up 6 − 1 = 5, aktiv 9 − 6 + 1 = 4, Erholung bleibt 11, zusammen 20 Frames. In der Testszene ginge die Hitbox mit diesen Werten in Frame 6 an, genau wie bei Startup 6. Nur die Schreibweise unterscheidet sich, das Timing ist gleich. Wer Werte aus Tabellen übernimmt, rechnet sie deshalb immer zuerst um.
    resources:
      - title: Street Fighter 6 · Ryu Frame Data
        url: https://www.streetfighter.com/6/character/ryu/frame

  - id: frei-ab-falsch
    type: bug
    title: Eine Zeile widerspricht den anderen
    prompt: |
      Du schreibst die Frame-Daten des Platzhalterangriffs für eine Vorgabe auf. Der Agent baut danach, und im Log läuft die Figur einen Frame früher los, als die Erholung erlaubt. Finde die Zeile und korrigiere sie.
    lang: text
    code: |
      Angriff A (Platzhalter der Testszene)
      Wind-up     8 Frames, Frame 1–8
      aktiv       3 Frames, Frame 9–11
      Erholung   14 Frames, Frame 12–25
      Gesamt     25 Frames
      frei ab Frame 25
    lines: [6]
    fix:
      - line: 6
        answers:
          - frei ab Frame 26
    explanation: |
      Die Erholung belegt die Frames 12 bis 25. In Frame 25 ist die Figur also noch gebunden, frei ist sie in Frame 26. Der Fehler kommt daher, dass Gesamtdauer und erster freier Frame verwechselt werden: 25 Frames dauert der Angriff, im 26. ist er vorbei. Ein Agent, der „frei ab Frame 25“ wörtlich nimmt, kürzt die Erholung um einen Frame, und niemand merkt es, bis jemand das Log nachzählt.
    resources:
      - title: Godot Docs · Idle and Physics Processing
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html

  - id: vorteil-vorzeichen
    type: bug
    title: Plus statt minus
    prompt: |
      Das Modell soll den Frame Advantage des Spielers aus dem Testszene-Log ausgeben. Laut Log ist der Dummy ab Frame 36 frei und der Spieler erst ab 41, das Programm gibt aber `+5` aus. Finde die Zeile und korrigiere sie.
    lang: python
    code: |
      # Testszene, Lauf mit Treffer
      spieler_frei = 41   # RECOVERY -> MOVE
      dummy_frei = 36     # HITSTUN -> WAIT

      def vorteil(angreifer, ziel):
          return angreifer - ziel

      print(f"{vorteil(spieler_frei, dummy_frei):+d}")
    lines: [6]
    fix:
      - line: 6
        answers:
          - return ziel - angreifer
          - return -(angreifer - ziel)
          - return -angreifer + ziel
    explanation: |
      Frame Advantage ist positiv, wenn der Angreifer **früher** frei ist, also eine kleinere Frame-Nummer hat. Deshalb rechnet man erster freier Frame des Ziels minus erster freier Frame des Angreifers: 36 − 41 = −5. Vertauschte Reihenfolge dreht das Vorzeichen, und aus einem Nachteil wird auf dem Papier ein Vorteil. Prüf solche Modelle immer an einem Log, dessen Ergebnis du kennst.
    resources:
      - title: Infil · Frame Advantage
        url: https://glossary.infil.net/?t=Frame+Advantage

  - id: figur-gegen-gegner
    type: explain
    title: Schnelle Figur, langsame Gegner
    prompt: |
      Erkläre in wenigen Sätzen, warum Mariel Cartwright die Spielfigur und die Gegner beim Wind-up unterschiedlich behandelt und was Dreamscaper daraus für die eigenen Angriffe ableitet.
    lang: text
    code: |
      Spielfigur   reagiert fast sofort auf den Druck
      Gegner       langer Wind-up vor dem Treffer
      Dreamscaper  Spielerangriffe schneller als
                   Gegnerangriffe
    points:
      - Die Spielfigur muss auf den Druck sofort sichtbar reagieren, sonst wirkt die Steuerung träge.
      - Der Wind-up eines Gegners ist die Zeit, in der der Spieler erkennen und ausweichen, blocken oder weglaufen kann.
      - Dreamscaper macht Spielerangriffe schneller als Gegnerangriffe, damit der Spieler den Startup eines Gegners unterbrechen kann.
      - Die Asymmetrie ist eine Designentscheidung; die Frame-Zahlen machen sichtbar, wer wann reagieren kann.
    explanation: |
      Für die Spielfigur zählt Rückmeldung: Ein Druck, auf den nichts passiert, fühlt sich wie ein verlorener Druck an. Für Gegner zählt Lesbarkeit: Ihr Wind-up ist die Reaktionszeit des Spielers. Cartwright trennt deshalb die beiden Seiten. Ian Cofino beschreibt für Dreamscaper die Folge: Weil Spielerangriffe schneller sind, kann der Spieler einen Gegner in dessen Startup treffen. Wie groß der Unterschied in deinem Spiel ist, entscheidest du; die Frames zeigen dir, wer wann eingreifen kann.
    resources:
      - title: Mariel Cartwright · Animation Bootcamp (GDC 2014)
        url: https://www.youtube.com/watch?v=Mw0h9WmBlsw
      - title: Ian Cofino · Dreamscaper (GDC 2022)
        url: https://www.youtube.com/watch?v=3Omb5exWpd4

  - id: clip-follow-through
    type: practice
    title: "Clip-Analyse: Wie lang ist der Follow-through?"
    prompt: |
      Sieh dir Sakurais [Follow-Throughs Make the Impact](https://www.youtube.com/watch?v=cIB0BUe6Ihk) an. Ab etwa 1:24 zeigt er Zeitleisten vieler Smash-Angriffe. Halte das Video bei drei Angriffen an und notiere für jeden, wann die Hitbox erscheint und wann die Figur wieder handeln kann. Lässt sich keine Zahl ablesen, schätze den Anteil an der Länge des Balkens. Rechne danach für jeden Angriff den Anteil bis zur Hitbox aus und vergleiche ihn mit Sakurais Faustregel von einem Drittel bis einem Viertel.
    lang: text
    solution: |
      Beispiel für die Form, mit dem Platzhalterangriff
      der Testszene statt eines Smash-Angriffs:

      Angriff        Hitbox ab  frei ab  Anteil
      Testszene A    Frame 9    Frame 26  9/25 = 0,36

      Beobachtung: knapp über einem Drittel.
      Frage an mich: Wirkt die Erholung lang genug,
      damit man den Schlag noch sieht?
    checklist:
      - Du hast drei Angriffe notiert, jeweils mit Hitbox-Zeitpunkt und Ende.
      - Du hast vermerkt, ob du Zahlen abgelesen oder Anteile geschätzt hast.
      - Für jeden Angriff steht ein Anteil bis zur Hitbox da.
      - Du hast notiert, welcher Angriff am weitesten von der Faustregel abweicht, und eine Vermutung, warum.
      - Deine Notiz beschreibt Smash; sie ist keine Vorgabe für dein Spiel.
    explanation: |
      Die Faustregel beschreibt Smash, ein Kampfspiel mit schnellen Reaktionen und viel Kräftemessen. Ein Angriff mit langer Erholung ist dort ein Risiko, das man bewusst eingeht. Wenn du die Anteile selbst siehst, erkennst du später in jedem Spiel, ob ein Angriff vorn oder hinten lang ist. Abweichungen sind keine Fehler, sie zeigen, welche Rolle ein Angriff hat.
    resources:
      - title: Masahiro Sakurai · Follow-Throughs Make the Impact
        url: https://www.youtube.com/watch?v=cIB0BUe6Ihk

  - id: angriff-beschreiben
    type: practice
    title: Einen Angriff in vier Angaben beschreiben
    prompt: |
      Beschreib einen Angriff, den du dir für dein Spiel vorstellst, in Sakurais vier Angaben: Idle-Pose, Angriffspose, Hitbox-Frame, Gesamtframes. Ergänze Abbruch-Frame (oder „keiner“), was der Spieler im ersten Frame nach dem Druck sieht und was der Gegner während des Wind-ups erkennen soll. Schreib **vor** jedem Test auf, was du erwartest. Die Werte wählst du selbst; sie sind Platzhalter, bis du sie gespielt hast.
    lang: text
    solution: |
      Beispiel für die Form, nicht für die Werte.
      Angriff des neutralen Trainingsgegners,
      Platzhalter (Wind-up 20, aktiv 4, Erholung 30):

      Idle-Pose:      steht
      Angriffspose:   Quadrat leuchtet rot
      Hitbox-Frame:   21 (Wind-up 20)
      Gesamtframes:   54, frei ab 55
      Abbruch:        keiner
      Frame 1:        gelbe Fläche erscheint
      Wind-up zeigt:  gelbe Bodenfläche, 20 Frames
      Anteil:         21/54 ≈ 0,39
      Erwartung:      ‹vor dem Test aufschreiben›
    checklist:
      - Alle vier Angaben stehen da, mit Frames gezählt ab 1 und der Angabe, ob Wind-up oder Startup gemeint ist.
      - Du hast den Anteil bis zur Hitbox ausgerechnet.
      - Du hast in einem Satz beschrieben, was im ersten Frame nach dem Druck zu sehen ist.
      - Jeder Wert ist als Platzhalter markiert, und keiner ist aus einer SF6- oder Smash-Tabelle als Ziel übernommen.
      - Deine Erwartung stand fest, bevor du etwas ausprobiert hast.
    explanation: |
      Die Übung trainiert die Form, in der du Angriffe künftig aufschreibst. Sie hat keine richtige Lösung, weil sie eine Designentscheidung ist. Wichtig ist, dass jeder Wert eine Zählweise hat, dass Rückmeldung und Treffer getrennt beschrieben sind und dass deine Erwartung vor dem Test steht. Dann kannst du beim Spielen in der Testszene unterscheiden, ob der Wert nicht passt oder deine Erwartung. Die Notiz ist auch der Anfang einer Vorgabe für einen Coding-Agenten.
    resources:
      - title: Masahiro Sakurai · Breaking Down Attack Animations
        url: https://www.youtube.com/watch?v=LewXWM7HDd8
