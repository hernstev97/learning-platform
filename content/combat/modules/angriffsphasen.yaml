id: angriffsphasen
title: "Anatomie eines Angriffs: Wind-up, aktiv, Erholung"
level: 2
minutes: 100
summary: Wie ein Angriff in Phasen zerfällt, wie du offizielle Frame-Daten liest und in die Zählung der Testszene umrechnest, und was Wind-up, aktive Phase, Erholung und Abbruchfenster für Rückmeldung, Lesbarkeit, Wucht und Risiko leisten.
place: unterwegs
goals:
  - Du benennst die vier Phasen eines Angriffs nach Sakurai und ordnest ihnen Wind-up, aktive Phase und Erholung zu.
  - Du liest offizielle Frame-Daten und rechnest Startup und Active in Wind-up, aktive Frames und Gesamtdauer um.
  - Du bestimmst aus einem Log oder einer Tabelle, wer nach einem Treffer zuerst wieder frei ist (Frame Advantage).
  - Du erklärst, warum der Wind-up Rückmeldung, Lesbarkeit und Wucht liefert und die Erholung den Preis eines Angriffs festlegt.
  - Du beschreibst einen eigenen Angriff mit Hitbox-Frame und Gesamtframes, ohne Werte anderer Spiele als Vorgabe zu übernehmen.
