lesson: |
  In den Unterwegs-Modulen rechnest du mit Frames: acht Frames Wind-up, drei aktiv, vierzehn Erholung. Ob sich das gut anfühlt, merkst du erst, wenn du es spielst. Dafür baust du am PC eine kleine Testszene in der Draufsicht: eine Figur, die analog in alle Richtungen läuft, ein Angriff mit einer Hitbox und später Trainingsgegner. Dieses Modul bringt dir genau so viel Godot bei, wie diese Szene braucht. Den ganzen Editor, Import von Sprites, Export und Profiler behandelt der geplante Godot-Kurs.

  Am Ende des Moduls läuft eine Figur mit Tastatur oder Gamepad durch ein 320 × 180 Pixel großes Bild, und ein Tastendruck spielt einen Angriff ab, dessen Hitbox in den Frames 9 bis 11 aktiv ist. Den Code darf dir eine KI schreiben, die Werte bestimmst du. Die Startwerte hier sind Platzhalter, damit überhaupt etwas läuft.

  ## Godot 4.7 unter CachyOS installieren

  Aktuell ist Godot 4.7.2, erschienen am 18. August 2026 ([Release auf GitHub](https://github.com/godotengine/godot/releases/tag/4.7.2-stable)). Für GDScript reicht die normale Version, die .NET-Variante brauchst du nur für C#. Unter Linux hast du drei Wege:

  | Weg | Befehl oder Ort | Was du wissen musst |
  | --- | --- | --- |
  | Offizielles Binary | [godotengine.org/download/linux](https://godotengine.org/download/linux/) | eine Datei, kein Installieren, Version genau bekannt |
  | Paket der Distribution | `sudo pacman -S godot` | Update mit dem System; im Oktober 2026 ebenfalls 4.7.2 ([Arch-Paket](https://archlinux.org/packages/extra/x86_64/godot/)) |
  | Flatpak | `flatpak install flathub org.godotengine.Godot` | Sandbox; Community-Paket, nicht vom Godot-Projekt geprüft |

  Für die Testszene spricht viel für das offizielle Binary: Du weißt immer, welche Version du testest, und kannst zwei Versionen nebeneinander behalten. Lade die ZIP-Datei und `SHA512-SUMS.txt` von der Release-Seite, prüfe die Prüfsumme und entpacke:

  ```console
  $ sha512sum -c --ignore-missing SHA512-SUMS.txt
  Godot_v4.7.2-stable_linux.x86_64.zip: OK
  $ unzip Godot_v4.7.2-stable_linux.x86_64.zip
  $ ./Godot_v4.7.2-stable_linux.x86_64 --version
  4.7.2.stable.official.ed1daf0bf
  ```

  Ohne Argument startet die Datei den Projektmanager. Leg dort ein neues Projekt `kampf-testszene` an. Als Renderer empfiehlt die Doku für 2D-Spiele **Compatibility** ([Overview of renderers](https://docs.godotengine.org/en/stable/tutorials/rendering/renderers.html#choosing-a-renderer)); du kannst ihn später wechseln. Godot speichert das Projekt als normalen Ordner mit Textdateien, also kannst du ihn mit Git versionieren (siehe [Git-Bereich](/git)).

  ## Node und Szene: der Baum der Testszene

  Alles in Godot ist ein **Node**. Ein Node hat eine Aufgabe: `CharacterBody2D` bewegt sich und stößt an Wände, `Area2D` meldet Überlappungen, `CollisionShape2D` gibt einer der beiden eine Form, `AnimationPlayer` spielt Animationen ab. Nodes hängen in einem Baum. Ein gespeicherter Baum ist eine **Szene** (`.tscn`), und eine Szene kannst du in eine andere einsetzen (instanziieren), etwa denselben Gegner fünfmal ([Nodes and Scenes](https://docs.godotengine.org/en/stable/getting_started/step_by_step/nodes_and_scenes.html), [Creating instances](https://docs.godotengine.org/en/stable/getting_started/step_by_step/instancing.html)).

  Die Startszene sieht so aus:

  ```text
  Main (Node2D)
  └── Player (CharacterBody2D)   player_start.gd
      ├── Body (Polygon2D)       Quadrat 12 × 12
      ├── CollisionShape2D       Körper, 10 × 10
      ├── HitboxPivot (Node2D)   dreht sich in Laufrichtung
      │   └── Hitbox (Area2D)
      │       └── CollisionShape2D  14 × 10, 12 px vor der Figur
      └── AnimationPlayer        Animation „attack“
  ```

  `HitboxPivot` ist ein leerer `Node2D` in der Mitte der Figur. Die Hitbox sitzt 12 Pixel rechts davon. Drehst du den Pivot, wandert die Hitbox um die Figur herum. So zeigt der Angriff bei 360°-Bewegung immer in Laufrichtung, ohne dass du acht Hitboxen brauchst.

  Neue Nodes legst du im Szenen-Dock mit „+“ an, Skripte mit dem Schriftrollen-Symbol. Das Inspektor-Dock rechts zeigt die Eigenschaften des gewählten Nodes; dort stellst du auch `motion_mode` der Figur auf **Floating**. Der Modus Grounded kennt Boden, Wand und Decke für Plattformer, Floating behandelt jede Kollision als Wand, wie es eine Draufsicht braucht ([CharacterBody2D](https://docs.godotengine.org/en/stable/classes/class_characterbody2d.html#class-characterbody2d-property-motion-mode)).

  ## Pixel-perfect: scharfe Pixel ohne Subpixel-Bewegung

  Pixelart braucht zwei Dinge. Die Pixel bleiben scharf, wenn das Bild hochskaliert wird. Und eine Figur bewegt sich sichtbar nur in ganzen Pixeln, auch wenn sie intern 1,5 Pixel pro Frame läuft. Beides stellst du unter *Projekt → Projekteinstellungen* ein (Schalter *Erweiterte Einstellungen* oben rechts an). In `project.godot` steht danach:

  ```ini title=project.godot
  [display]
  window/size/viewport_width=320
  window/size/viewport_height=180
  window/size/window_width_override=1280
  window/size/window_height_override=720
  window/stretch/mode="viewport"
  window/stretch/scale_mode="integer"

  [rendering]
  textures/canvas_textures/default_texture_filter=0
  2d/snap/snap_2d_transforms_to_pixel=true
  ```

  Neue Projekte starten in Godot 4.7 mit Stretch Mode `canvas_items` ([Upgrading to Godot 4.7](https://docs.godotengine.org/en/stable/tutorials/migrating/upgrading_to_godot_4.7.html)). Du musst `viewport` also ausdrücklich einstellen. Was die Zeilen tun:

  - **320 × 180** ist die Auflösung, in der das Spiel rechnet und zeichnet. Das Fenster startet mit 1280 × 720, also vierfach. Die Doku schlägt für Pixelart 640 × 360 vor ([Multiple resolutions, Desktop game](https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html#desktop-game)). Die 320 × 180 der Testszene sind ein Platzhalter; welche Auflösung deine Grafik hat, entscheidest du mit deiner Pixelart.
  - **Stretch Mode `viewport`** zeichnet erst das kleine Bild und skaliert es dann als Ganzes hoch. Mit `canvas_items` würde Godot in Fenstergröße zeichnen, und eine Figur könnte sich um Viertelpixel verschieben. Genau das willst du nicht ([Multiple resolutions](https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html)).
  - **Scale Mode `integer`** skaliert nur um ganze Faktoren. Bei Faktor 3,5 wären manche Pixel drei, andere vier Bildschirmpixel breit.
  - **Default Texture Filter `Nearest`** (Wert `0`) holt beim Vergrößern das nächste Pixel statt zu mischen. Mit `Linear`, dem Standard, wird Pixelart unscharf.
  - **Snap 2D Transforms to Pixel** rundet beim Zeichnen die Position jedes Nodes auf ganze Pixel. Die Position selbst bleibt eine Kommazahl.

  > [!MERKE]
  > Die Figur rechnet in Kommazahlen und wird in ganzen Pixeln gezeichnet. So bleibt die analoge Bewegung genau, und auf dem Bildschirm springt sie trotzdem nur pixelweise.

  Eine Folge davon siehst du bei schrägen Richtungen: Läuft die Figur mit 90 Pixeln pro Sekunde im Winkel von 30°, kommt sie pro Frame 1,3 Pixel nach rechts und 0,75 Pixel nach unten. Gezeichnet springt sie mal einen, mal zwei Pixel nach rechts und in drei von vier Frames einen nach unten. Diese Treppe gehört zu Pixelart in 360°. Beurteile sie in Bewegung, nicht im Standbild.

  Läuft dein Monitor mit mehr als 60 Hz, zeichnet Godot öfter, als die Physik rechnet, und die Figur steht in manchen Bildern still. Dagegen hilft die Physik-Interpolation (`physics/common/physics_interpolation`), die Godot seit 4.3 auch in 2D kann ([Physics interpolation](https://docs.godotengine.org/en/stable/tutorials/physics/interpolation/index.html)). Sie zeichnet Zwischenstände zwischen zwei Physik-Frames und rundet erst dann auf ganze Pixel. Laut Doku erhöht sie die Eingabeverzögerung etwas ([Fixing jitter, stutter and input lag](https://docs.godotengine.org/en/stable/tutorials/rendering/jitter_stutter.html#jitter)). Für die ersten Tests lässt du sie aus: Dann zeigt jedes Bild den Stand eines Physik-Frames, und du siehst Frame-Daten unverfälscht.

  ## Eine Figur, die in alle Richtungen läuft

  Zuerst die Aktionen. Unter *Projekteinstellungen → Eingabezuordnung* (Input Map) legst du `move_left`, `move_right`, `move_up`, `move_down`, `attack` und `dodge` an und gibst jeder Taste und Gamepad-Eingabe: `move_right` bekommt etwa `D`, die Pfeiltaste rechts und *Linker Stick, X-Achse +*. Der Code fragt nur Aktionen ab, nie Tasten. Jede Aktion hat eine **Deadzone**, Standard 0,2: Stick-Ausschläge darunter zählen als 0 ([InputMap](https://docs.godotengine.org/en/stable/classes/class_inputmap.html#class-inputmap-method-add-action), [Input examples](https://docs.godotengine.org/en/stable/tutorials/inputs/input_examples.html)).

  Dann das Skript der Figur:

  ```gdscript title=player_start.gd
  extends CharacterBody2D

  ## Figur aus dem Godot-Start: läuft in alle Richtungen,
  ## der Angriff ist eine Animation.

  @export var move_speed := 90.0   ## Pixel pro Sekunde

  @onready var animation_player: AnimationPlayer = $AnimationPlayer
  @onready var hitbox_pivot: Node2D = $HitboxPivot


  func _physics_process(_delta: float) -> void:
  	if animation_player.is_playing():
  		return
  	if Input.is_action_just_pressed(&"attack"):
  		print(Engine.get_physics_frames(), "  Druck attack")
  		animation_player.play(&"attack")
  		animation_player.advance(0)   # Animation sofort auf Zeit 0 setzen, nicht erst im nächsten Frame
  		return
  	var direction := Input.get_vector(&"move_left", &"move_right", &"move_up", &"move_down")
  	if direction != Vector2.ZERO:
  		hitbox_pivot.rotation = direction.angle()
  	velocity = direction * move_speed
  	move_and_slide()
  ```

  Die wichtigen Stellen:

  - `_physics_process` läuft 60-mal pro Sekunde, fest an die Physik gekoppelt, unabhängig von der Bildrate ([Idle and Physics Processing](https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html)). Ein Aufruf ist ein Frame im Sinn dieses Kurses.
  - `Input.get_vector()` baut aus vier Aktionen einen Richtungsvektor, höchstens 1 lang. Zwei Tasten schräg ergeben `(0.707107, 0.707107)`, nicht `(1, 1)`. Sonst liefe die Figur schräg 41 % schneller. Beim Stick rechnet die Funktion die Deadzone heraus: Ein halber Ausschlag (0,5) bei Deadzone 0,2 wird zu `(0.5 - 0.2) / 0.8 = 0.375` ([Input.get_vector](https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-get-vector)).
  - `velocity` ist in Pixeln pro Sekunde. `move_and_slide()` rechnet den Frame-Anteil selbst aus, deshalb taucht `delta` nicht auf.
  - `@export` macht `move_speed` im Inspektor einstellbar. Ab jetzt änderst du Werte dort, nicht im Code.
  - Solange die Animation läuft, kehrt die Funktion sofort zurück: Die Figur steht während des Angriffs. Ob sie das in deinem Spiel soll, ist eine Designentscheidung.

  ## Ein Angriff als Animation: Hitbox-Timing im AnimationPlayer

  Der Angriff ist eine Animation, die die Hitbox ein- und ausschaltet. Leg im `AnimationPlayer` eine Animation `attack` an ([Introduction to the animation features](https://docs.godotengine.org/en/stable/tutorials/animation/introduction.html)). Unten im Animations-Editor stehen der Zeitschritt und ein Schalter **Seconds/FPS**. Der Schritt steht anfangs auf 1/30 Sekunde, also auf jedem zweiten Physik-Frame. Schalte auf **FPS** und trag 60 ein: Dann zeigt die Zeitleiste Frames, und jeder Key liegt genau auf einem Physik-Frame. Für Wind-up 8, aktiv 3 und Erholung 14 brauchst du:

  | Key | Zeit | nach Frames | `disabled` |
  | --- | --- | --- | --- |
  | 1 | 0,0000 s | 0 | `true` |
  | 2 | 0,1333 s | 8 | `false` |
  | 3 | 0,1833 s | 11 | `true` |
  | Länge | 0,4167 s | 25 | |

  Die Spalte zählt, wie viele Frames seit dem Start vergangen sind. Der Key bei 8/60 s liegt deshalb am Beginn von Frame 9 des Angriffs, wenn du wie im Rest des Kurses ab 1 zählst. Das ist die häufigste Falle beim Umrechnen.

  Stell `disabled` der Form im Inspektor zuerst auf an, sonst ist die Hitbox bis zum ersten Angriff aktiv. Die Keys setzt du, indem du `Hitbox/CollisionShape2D` wählst und im Inspektor auf das Schlüsselsymbol neben `disabled` klickst. Für Wahrheitswerte legt der Editor eine Spur mit Update-Modus *Discrete* an: Der Wert springt genau am Key um. Eine Spur für die Farbe von `Body` (gelb im Wind-up, rot aktiv, grau in der Erholung) hilft dir später beim Zusehen.

  Eine Einstellung entscheidet, ob das Timing stimmt: **`callback_mode_process`** des `AnimationPlayer`. Standard ist `Idle`. Dann rückt die Animation bei jedem gezeichneten Bild vor, und die Hitbox schaltet irgendwann zwischen zwei Physik-Frames um. Stell sie auf **`Physics`**: Dann rückt die Animation in genau den Schritten vor, in denen die Physik rechnet ([AnimationMixer.callback_mode_process](https://docs.godotengine.org/en/stable/classes/class_animationmixer.html#class-animationmixer-property-callback-mode-process)).

  Gemessen mit Godot 4.7.2: vier Angriffe hintereinander, gezählt wurden Physik-Frames mit eingeschalteter Hitbox.

  | Bildrate | `Physics` | `Idle` |
  | --- | --- | --- |
  | 60 Bilder/s | 3 je Angriff | 3 je Angriff |
  | 144 Bilder/s | 3 je Angriff | 2 je Angriff |
  | 30 Bilder/s | 3 je Angriff | 4 je Angriff |

  Im Modus `Idle` hängt die Länge der aktiven Phase an der Bildrate: auf einem 144-Hz-Monitor ein Frame kürzer, auf einem Laptop mit 30 Bildern pro Sekunde einer länger.

  Noch ein Detail im Skript: `advance(0)` direkt nach `play()`. Ohne diese Zeile setzt der `AnimationPlayer` die Animation erst im nächsten Physik-Frame auf ihren Anfang, und alle Keys kommen einen Frame später, als die Tabelle sagt ([AnimationPlayer.play](https://docs.godotengine.org/en/stable/classes/class_animationplayer.html#class-animationplayer-method-play)). Gemessen: ohne `advance(0)` ist die Hitbox in den Frames 10 bis 12 des Angriffs an, mit `advance(0)` in den Frames 9 bis 11.

  > [!WARNING] Umschalten mitten in der Physik
  > Schaltest du eine Form oder `monitoring` direkt in einem Treffer-Signal um, meldet Godot `Can't change this state while flushing queries. Use call_deferred() or set_deferred() to change monitoring state instead.` Der Node zeigt danach `disabled = true`, die Physik rechnet aber mit der alten Form weiter. Schreib in Signalen `shape.set_deferred(&"disabled", true)`. Godot führt das am Ende der laufenden Abfrage aus ([Area2D](https://docs.godotengine.org/en/stable/classes/class_area2d.html#class-area2d-property-monitoring)).

  ## Messen statt raten: Kollisionsformen, Einzelbild und Frame-Nummern

  Drei Werkzeuge reichen für den Anfang. Im Menü *Debug* schaltest du **Kollisionsformen sichtbar** an; beim nächsten Start zeichnet Godot jede aktive Form farbig ([Overview of debugging tools](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html#visible-collision-shapes)). Im laufenden Spiel hält **Pause** (F9) alles an, und **Nächster Frame** (F10) rückt genau einen Frame vor ([Game embedding](https://docs.godotengine.org/en/stable/tutorials/editor/game_embedding.html#frame-advance-f10)). So siehst du Bild für Bild, wann die Hitbox erscheint. Und du schreibst in die Ausgabe, in welchem Physik-Frame etwas passiert:

  ```gdscript
  func _on_hitbox_area_entered(area: Area2D) -> void:
  	print(Engine.get_physics_frames(), "  Treffer: ", area.name)
  ```

  Verbinde dafür das Signal `area_entered` der Hitbox im Knoten-Dock mit der Figur und stell einen zweiten Node mit `Area2D` und Form in Reichweite. Eine Überlappung, die im Frame X entsteht, meldet Godot im Frame X + 1: Der Physik-Schritt läuft nach deinem Code, das Signal kommt am Anfang des nächsten Frames ([Using Area2D](https://docs.godotengine.org/en/stable/tutorials/physics/using_area_2d.html)).

  > [!PRAXIS]
  > Bau dir einen Debug-Schalter für Hitboxen, bevor du irgendetwas abstimmst. Wer über Frames redet, muss sie sehen und zählen können. Bau die Messung ein, bevor du anfängst abzustimmen, nicht erst, wenn sich etwas falsch anfühlt.

  > [!INTERVIEW]
  > „Wie stellst du sicher, dass ein Angriff unabhängig von der Bildrate gleich lange trifft?“ Gute Antwort: Gameplay-Timing läuft im festen Physik-Takt, nicht pro gezeichnetem Bild. In Godot heißt das `_physics_process` und `callback_mode_process = Physics` für Animationen, die Hitboxen schalten. Dann misst du es nach, etwa bei künstlich gesenkter Bildrate.

  ## Häufige Fehler

  - **Unscharfe Pixel.** Der Texturfilter steht auf `Linear`. Projektweit auf `Nearest` stellen, nicht an jedem Sprite einzeln.
  - **Figur gleitet um Bruchteile von Pixeln.** Stretch Mode `canvas_items` statt `viewport`, oder Snap 2D Transforms to Pixel ist aus.
  - **Schräg schneller als gerade.** Der Vektor kommt aus zwei einzelnen Achsen (`Vector2(rechts - links, runter - hoch)`) statt aus `Input.get_vector()`.
  - **Hitbox einen Frame zu spät oder zu lang.** Keys liegen nicht auf dem 1/60-Raster (der Standardschritt ist 1/30 s), oder `callback_mode_process` steht auf `Idle`.
  - **Fehlermeldung beim Treffer.** Form oder `monitoring` direkt im Signal umgeschaltet. `set_deferred()` nehmen.
  - **Nichts wird erkannt.** `collision_mask` der Hitbox enthält die Ebene des Ziels nicht, oder beim Ziel ist `monitorable` aus.

  ## Zusammenfassung

  - Godot 4.7.2 ist die aktuelle stabile Version. Das offizielle Binary läuft ohne Installation; `--version` zeigt, welche du testest.
  - Neue Projekte starten in 4.7 mit `canvas_items`; für Pixelart stellst du `viewport` selbst ein.
  - Nodes haben je eine Aufgabe, eine Szene ist ein gespeicherter Baum aus Nodes. Ein Pivot-Node dreht die Hitbox in Laufrichtung.
  - Pixel-perfect heißt: 320 × 180, Stretch Mode `viewport`, Scale Mode `integer`, Filter `Nearest`, Snap 2D Transforms to Pixel. Positionen bleiben Kommazahlen.
  - `Input.get_vector()` liefert einen Vektor bis Länge 1 und rechnet die Deadzone heraus. Der Code fragt Aktionen ab, keine Tasten.
  - Ein Frame ist ein Aufruf von `_physics_process`, 60 pro Sekunde.
  - Animationen, die Hitboxen schalten, laufen mit `callback_mode_process = Physics` und Keys auf dem 1/60-Raster.
  - Treffer kommen einen Frame nach der Überlappung. In Signalen schaltest du mit `set_deferred()` um.
exercises:
  - id: nodes-zuordnen
    type: choice
    title: Welcher Node macht was?
    prompt: |
      Welche Zuordnungen stimmen für die Testszene?
    options:
      - text: "`CharacterBody2D` für die Figur, weil sie sich mit `move_and_slide()` bewegt und an Wänden entlanggleitet."
        correct: true
        why: Genau dafür ist der Node da. Er bringt `velocity` und `move_and_slide()` mit.
      - text: "`Area2D` für die Hitbox, weil sie Überlappungen mit anderen Flächen meldet, ohne etwas wegzuschieben."
        correct: true
        why: Eine Hitbox soll treffen, nicht blockieren. `Area2D` meldet `area_entered`, schiebt aber nichts.
      - text: "`CollisionShape2D` erkennt Treffer und sendet das Signal `area_entered`."
        correct: false
        why: Die Form gibt einem Körper oder einer Fläche nur ihre Gestalt. Das Signal sendet die `Area2D`, zu der sie gehört.
      - text: "`AnimationPlayer` braucht eine eigene `CollisionShape2D`, damit er die Hitbox steuern kann."
        correct: false
        why: Der `AnimationPlayer` setzt Eigenschaften anderer Nodes über Spuren, hier `disabled` der Form der Hitbox. Eine eigene Form hat er nicht.
    explanation: |
      Jeder Node hat eine Aufgabe. `CharacterBody2D` bewegt sich und kollidiert, `Area2D` erkennt Überlappungen, `CollisionShape2D` liefert die Form für einen dieser beiden, und `AnimationPlayer` ändert über Spuren Eigenschaften anderer Nodes. Der Angriff entsteht erst aus dem Zusammenspiel: Die Animation schaltet die Form der Hitbox ein, die `Area2D` meldet, was sie berührt.
    resources:
      - title: Godot Docs · Nodes and Scenes
        url: https://docs.godotengine.org/en/stable/getting_started/step_by_step/nodes_and_scenes.html
      - title: Godot Docs · Using Area2D
        url: https://docs.godotengine.org/en/stable/tutorials/physics/using_area_2d.html

  - id: stretch-modus
    type: choice
    title: Keine Viertelpixel
    prompt: |
      Du willst, dass sich Figuren auf dem Bildschirm nur in ganzen Pixeln der 320 × 180 großen Spielgrafik bewegen. Welcher Stretch Mode passt?
    options:
      - text: "`viewport`: Godot zeichnet das Bild in 320 × 180 und skaliert es danach als Ganzes hoch."
        correct: true
        why: Weil das kleine Bild zuerst entsteht, kann nichts zwischen zwei seiner Pixel liegen.
      - text: "`canvas_items`: Godot zeichnet in Fenstergröße und skaliert nur die Koordinaten."
        correct: false
        why: Dabei kann eine Figur um Bruchteile eines Spielpixels versetzt erscheinen. Gut für scharfe Schrift, schlecht für das Ziel hier.
      - text: "`disabled`: Godot skaliert gar nicht, das Fenster ist 320 × 180 groß."
        correct: false
        why: Dann ist das Fenster winzig. Das Problem verschwindet, das Spiel aber auch.
    explanation: |
      Im Modus `viewport` rechnet und zeichnet Godot in der eingestellten Größe und vergrößert das fertige Bild. Zusammen mit Scale Mode `integer`, Filter `Nearest` und dem Pixel-Snap bleibt jedes Spielpixel ein gleich großes Quadrat. `canvas_items` ist der richtige Modus für Spiele mit hochaufgelöster Grafik und Schrift, bei denen weiche Bewegung erwünscht ist.
    resources:
      - title: Godot Docs · Multiple resolutions
        url: https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html

  - id: projekt-einrichten
    type: order
    title: Ein Projekt für Pixelart einrichten
    prompt: |
      Bring die Schritte in eine sinnvolle Reihenfolge, vom Download bis zur ersten Probe der Bewegung.
    lang: prose
    lines: |
      Prüfsumme der ZIP-Datei mit sha512sum kontrollieren
      Godot starten und im Projektmanager ein neues Projekt anlegen
      Viewport 320 × 180, Stretch Mode viewport, Scale Mode integer einstellen
      Default Texture Filter auf Nearest und Snap 2D Transforms to Pixel einschalten
      Aktionen move_left, move_right, move_up, move_down in der Input Map anlegen
      Player mit Skript anlegen und die Szene mit F6 starten
    alternatives:
      - [1, 2, 4, 3, 5, 6]
      - [1, 2, 3, 5, 4, 6]
      - [1, 2, 4, 5, 3, 6]
      - [1, 2, 5, 3, 4, 6]
      - [1, 2, 5, 4, 3, 6]
    explanation: |
      Die Prüfsumme kommt vor dem ersten Start, sonst führst du eine Datei aus, die du nicht geprüft hast. Die Projekteinstellungen und die Input Map sind voneinander unabhängig, ihre Reihenfolge ist egal. Alle drei müssen aber vor dem ersten Test stehen: Ohne Aktionen liefert `Input.get_vector()` immer `(0, 0)`, ohne die Pixel-Einstellungen beurteilst du eine Bewegung, die später anders aussieht.
    resources:
      - title: Godot Docs · Input examples
        url: https://docs.godotengine.org/en/stable/tutorials/inputs/input_examples.html

  - id: schraeg-laufen
    type: output
    title: Zwei Tasten gleichzeitig
    prompt: |
      Die Aktionen `move_right` und `move_down` sind beide voll gedrückt (zwei Tasten). Was gibt diese Zeile in Godot 4.7 aus?
    lang: gdscript
    code: |
      print(Input.get_vector(&"move_left", &"move_right", &"move_up", &"move_down"))
    expected: |
      (0.707107, 0.707107)
    accept:
      - (0.70710677, 0.70710677)
      - (0.7071, 0.7071)
    explanation: |
      `get_vector()` begrenzt den Vektor auf Länge 1. Aus `(1, 1)` mit Länge 1,414 wird `(0.707107, 0.707107)`; `print` zeigt Vektoren mit sechs signifikanten Stellen. Ohne diese Begrenzung liefe die Figur schräg um gut 41 % schneller als gerade, ein Fehler, der in vielen ersten Prototypen steckt. Gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Input.get_vector
        url: https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-get-vector

  - id: deadzone-rechnen
    type: output
    title: Der halbe Stick
    prompt: |
      Der linke Stick ist halb nach rechts gedrückt (Stärke 0,5), sonst nichts. Die Aktionen haben die Standard-Deadzone 0,2. Was gibt die Zeile aus?
    lang: gdscript
    code: |
      print(Input.get_vector(&"move_left", &"move_right", &"move_up", &"move_down"))
    expected: |
      (0.375, 0.0)
    accept:
      - (0.375, 0)
    explanation: |
      `get_vector()` rechnet die Deadzone heraus und streckt den Rest auf 0 bis 1: `(0,5 − 0,2) / (1 − 0,2) = 0,375`. Unterhalb von 0,2 kommt `(0.0, 0.0)` heraus. So startet die Figur am Rand der Deadzone mit Tempo 0 statt mit einem Sprung auf 20 %. Gemessen mit Godot 4.7.2.
    resources:
      - title: Godot Docs · Input.get_vector
        url: https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-get-vector

  - id: keys-in-frames
    type: output
    title: Sekunden in Frames
    prompt: |
      Eine Animation `attack` hat diese Keys für `disabled` der Hitbox. Die Physik läuft mit 60 Frames pro Sekunde. Wie viele Physik-Frames ist die Hitbox an?
    lang: text
    code: |
      0,0000 s   disabled = true
      0,1000 s   disabled = false
      0,2000 s   disabled = true
    expected: |
      6
    accept:
      - 6 Frames
    explanation: |
      0,1 s sind 6 Frames, 0,2 s sind 12. Die Hitbox geht nach 6 Frames an und nach 12 Frames aus, ist also 6 Frames lang; ab 1 gezählt sind das die Frames 7 bis 12. Rechne Animationszeiten immer in Frames um, bevor du über Timing redest: Ein Key bei 0,1 s klingt rund, liegt aber nur zufällig auf dem 1/60-Raster. 0,15 s wären 9 Frames, 0,11 s wären 6,6 und damit kein ganzer Frame.

  - id: bewegung-ergaenzen
    type: gap
    title: Die Figur zum Laufen bringen
    prompt: |
      Ergänze die drei Lücken, damit die Figur analog in alle Richtungen läuft.
    lang: gdscript
    code: |
      func _physics_process(_delta: float) -> void:
      	var direction := ⟦Input.get_vector⟧(&"move_left", &"move_right", &"move_up", &"move_down")
      	⟦velocity⟧ = direction * move_speed
      	⟦move_and_slide()⟧
    gaps:
      - label: Richtung aus vier Aktionen
        hint: Eine Methode von `Input`, die einen `Vector2` aus vier Aktionen baut.
      - label: Eigenschaft für die Geschwindigkeit
        hint: Die Eigenschaft von `CharacterBody2D`, in Pixeln pro Sekunde.
      - label: Bewegung ausführen
        hint: Bewegt die Figur mit `velocity` und gleitet an Wänden entlang.
        accept: ["self.move_and_slide()"]
    explanation: |
      `Input.get_vector()` liefert die Richtung mit Länge bis 1. `velocity` von `CharacterBody2D` ist in Pixeln pro Sekunde, und `move_and_slide()` multipliziert intern mit der Dauer eines Physik-Frames. Deshalb braucht der Code kein `delta`. Würdest du `position += direction * move_speed` schreiben, liefe die Figur 60-mal zu schnell und durch Wände.
    resources:
      - title: Godot Docs · 2D movement overview
        url: https://docs.godotengine.org/en/stable/tutorials/2d/2d_movement.html
      - title: Godot Docs · CharacterBody2D.move_and_slide
        url: https://docs.godotengine.org/en/stable/classes/class_characterbody2d.html#class-characterbody2d-method-move-and-slide

  - id: animation-idle
    type: bug
    title: Auf dem Laptop trifft es länger
    prompt: |
      Auf deinem PC ist die Hitbox des Angriffs 3 Frames aktiv. Auf einem alten Laptop mit 30 Bildern pro Sekunde zählst du 4 Frames. Die Keys liegen sauber auf dem 1/60-Raster. Finde die Zeile, die das verursacht, und korrigiere sie.
    lang: gdscript
    code: |
      func _ready() -> void:
      	animation_player.callback_mode_process = AnimationMixer.ANIMATION_CALLBACK_MODE_PROCESS_IDLE
      	hitbox_shape.disabled = true
    lines: [2]
    fix:
      - line: 2
        answers:
          - animation_player.callback_mode_process = AnimationMixer.ANIMATION_CALLBACK_MODE_PROCESS_PHYSICS
          - animation_player.callback_mode_process = AnimationPlayer.ANIMATION_CALLBACK_MODE_PROCESS_PHYSICS
    explanation: |
      Im Modus `Idle` rückt die Animation pro gezeichnetem Bild vor. Bei 30 Bildern pro Sekunde springt sie in Schritten von zwei Physik-Frames, und die Hitbox schaltet zu anderen Zeitpunkten um, als die Keys sagen. Mit `PHYSICS` rückt sie mit jedem Physik-Frame vor. Gemessen mit Godot 4.7.2: im Modus `Idle` bei 30 Bildern pro Sekunde 4 statt 3 Frames, im Modus `Physics` immer 3.
    resources:
      - title: Godot Docs · AnimationMixer.callback_mode_process
        url: https://docs.godotengine.org/en/stable/classes/class_animationmixer.html#class-animationmixer-property-callback-mode-process

  - id: signal-umschalten
    type: bug
    title: Ausgeschaltet und trifft trotzdem
    prompt: |
      Nach dem ersten Treffer soll die Hitbox sofort aus sein. Der Inspektor zeigt danach auch `disabled = true`, trotzdem meldet die Hitbox weitere Treffer, und die Ausgabe zeigt `Can't change this state while flushing queries. Use call_deferred() or set_deferred() to change monitoring state instead.` Finde die Zeile und korrigiere sie.
    lang: gdscript
    code: |
      func _on_hitbox_area_entered(area: Area2D) -> void:
      	print(Engine.get_physics_frames(), "  Treffer: ", area.name)
      	hitbox_shape.disabled = true
    lines: [3]
    fix:
      - line: 3
        answers:
          - hitbox_shape.set_deferred(&"disabled", true)
          - hitbox_shape.set_deferred("disabled", true)
          - hitbox_shape.call_deferred(&"set_disabled", true)
          - hitbox_shape.call_deferred("set_disabled", true)
    explanation: |
      Das Signal kommt, während der Physik-Server seine Abfragen abarbeitet. In diesem Moment lehnt er Änderungen an Formen ab. Die Eigenschaft des Nodes ändert sich, der Server rechnet aber mit der alten Form weiter, daher der Widerspruch im Inspektor. `set_deferred()` merkt die Änderung vor und führt sie aus, wenn die Abfrage fertig ist. Die Meldung ist mit Godot 4.7.2 so nachgestellt.
    resources:
      - title: Godot Docs · Object.set_deferred
        url: https://docs.godotengine.org/en/stable/classes/class_object.html#class-object-method-set-deferred

  - id: startfigur-erklaeren
    type: explain
    title: Warum steht die Figur beim Angriff?
    prompt: |
      Erkläre, was dieser Anfang von `_physics_process` bewirkt und warum er in `_physics_process` steht und nicht in `_process`.
    lang: gdscript
    code: |
      func _physics_process(_delta: float) -> void:
      	if animation_player.is_playing():
      		return
      	if Input.is_action_just_pressed(&"attack"):
      		print(Engine.get_physics_frames(), "  Druck attack")
      		animation_player.play(&"attack")
      		animation_player.advance(0)
      		return
    points:
      - Solange die Angriffsanimation läuft, macht die Figur nichts anderes, sie kann weder laufen noch neu angreifen.
      - Ein neuer Druck auf `attack` startet die Animation; der zweite `return` verhindert, dass die Figur im selben Frame noch läuft.
      - "`_physics_process` läuft im festen Takt von 60 pro Sekunde, `_process` pro gezeichnetem Bild; nur der feste Takt gibt gleiche Frames auf jedem Rechner."
      - Drückst du `attack` während der Animation, geht der Druck verloren; einen Eingabepuffer gibt es hier noch nicht.
    explanation: |
      Die Animation sperrt die Figur: Während sie läuft, kehrt die Funktion sofort zurück. Ein Druck auf `attack` startet sie und beendet den Frame, damit die Figur nicht im selben Frame noch einen Schritt macht. Das steht in `_physics_process`, weil Gameplay-Timing im festen Physik-Takt laufen muss; `_process` hängt an der Bildrate. Eine Lücke hat der Code noch: `is_action_just_pressed()` ist nur in dem einen Frame wahr, in dem die Taste runtergeht. Wer kurz vor dem Ende des Angriffs drückt, verliert den Druck. Den Eingabepuffer dafür baust du in [Testszene: Angriff mit Frame-Daten](/combat/testszene-angriff).
    resources:
      - title: Godot Docs · Idle and Physics Processing
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html

  - id: godot-installieren
    type: practice
    title: Godot installieren und das Projekt anlegen
    prompt: |
      Installiere Godot 4.7 auf deinem Rechner, leg das Projekt `kampf-testszene` an und richte es pixelgenau ein. Notiere die Ausgabe von `--version`.
    lang: text
    solution: |
      $ sha512sum -c --ignore-missing SHA512-SUMS.txt
      Godot_v4.7.2-stable_linux.x86_64.zip: OK
      $ ./Godot_v4.7.2-stable_linux.x86_64 --version
      4.7.2.stable.official.ed1daf0bf

      project.godot enthält:
      window/size/viewport_width=320
      window/size/viewport_height=180
      window/stretch/mode="viewport"
      window/stretch/scale_mode="integer"
      textures/canvas_textures/default_texture_filter=0
      2d/snap/snap_2d_transforms_to_pixel=true
    checklist:
      - Die Prüfsumme der ZIP-Datei ist mit `sha512sum -c` geprüft, oder Godot kommt aus `pacman` oder Flathub.
      - "`--version` zeigt 4.7 oder neuer, und du hast die Ausgabe notiert."
      - Die Projekteinstellungen stehen wie in der Lektion, geprüft in `project.godot`.
      - Der Projektordner liegt in Git, mit einem ersten Commit.
    explanation: |
      Die Version gehört in jedes Testprotokoll. Ändert sich in einer neuen Godot-Version das Timing, siehst du so, woran es liegt. Die Einstellungen prüfst du in `project.godot`, weil der Editor manche Werte erst schreibt, wenn sie vom Standard abweichen: Was dort nicht steht, ist der Standard.
    resources:
      - title: Godot · Download für Linux
        url: https://godotengine.org/download/linux/
      - title: Godot Docs · Multiple resolutions
        url: https://docs.godotengine.org/en/stable/tutorials/rendering/multiple_resolutions.html

  - id: startszene-messen
    type: practice
    title: Die Startszene bauen und die Hitbox messen
    prompt: |
      Bau die Startszene aus der Lektion: Figur mit `player_start.gd`, Hitbox am Pivot, Animation `attack`. Stell eine zweite `Area2D` mit Form vor die Figur, verbinde `area_entered` und miss, in welchem Physik-Frame der Treffer kommt. Lass die Figur außerdem langsam schräg laufen und beobachte die Pixeltreppe.
    lang: gdscript
    starter: |
      func _on_hitbox_area_entered(area: Area2D) -> void:
      	pass
    solution: |
      func _on_hitbox_area_entered(area: Area2D) -> void:
      	print(Engine.get_physics_frames(), "  Treffer: ", area.name)

      # Ausgabe, wenn die Figur den Druck in Frame 300 sieht
      # und das Ziel in Reichweite steht:
      # 300  Druck attack
      # 309  Treffer: Ziel
    checklist:
      - Die Figur läuft mit Tastatur und Stick in alle Richtungen, schräg nicht schneller als gerade.
      - Mit *Debug → Kollisionsformen sichtbar* siehst du die Hitbox nur während der aktiven Phase.
      - "`callback_mode_process` des `AnimationPlayer` steht auf `Physics`, die Zeitleiste zeigt Frames bei 60 FPS."
      - Du bist mit Pause (F9) und Nächster Frame (F10) einmal Bild für Bild durch einen Angriff gegangen.
      - Du hast notiert, wie viele Frames zwischen Tastendruck und Treffer-Ausgabe liegen, und erklärst die Zahl mit Wind-up und der Meldung einen Frame später.
      - Du hast beim langsamen Schräglaufen die Pixeltreppe gesehen und notiert, ob sie dich stört. Das ist deine Beobachtung, keine richtige oder falsche Antwort.
    explanation: |
      Die Figur schreibt den Druck in dem Frame, in dem sie ihn sieht; das ist Frame 1 des Angriffs. Mit Wind-up 8 geht die Hitbox im neunten Frame an, und das Signal kommt einen Frame später: Zwischen den beiden Ausgaben liegen genau 9 Frames. Fehlt `advance(0)`, sind es 10. Die genaue Zahl ist weniger wichtig als die Gewohnheit: Du misst, bevor du etwas fühlst. Die Pixeltreppe beim Schräglaufen ist keine Fehlfunktion, sondern die Folge von ganzen Pixeln. Ob du sie mit anderer Geschwindigkeit, anderen Winkeln oder gar nicht behandelst, entscheidest du für dein Spiel.
    resources:
      - title: Godot Docs · Using Area2D
        url: https://docs.godotengine.org/en/stable/tutorials/physics/using_area_2d.html
