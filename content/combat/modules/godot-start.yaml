id: godot-start
title: "Godot-Start: genug Godot 4 für die Testszene"
level: 1
minutes: 150
summary: Godot 4.7 unter Linux installieren, ein Projekt pixelgenau einrichten, eine Figur in alle Richtungen laufen lassen und einen Angriff als Animation bauen, deren Hitbox genau drei Frames lang trifft.
place: pc
goals:
  - Du installierst Godot 4.7 unter CachyOS und prüfst, welche Version läuft.
  - Du erklärst Node, Szene und Szenenbaum an der Testszene und legst die Nodes selbst an.
  - Du richtest ein Projekt so ein, dass Pixelart scharf bleibt und Figuren ohne sichtbare Subpixel-Bewegung laufen.
  - Du lässt eine Figur mit `Input.get_vector()` und `move_and_slide()` analog in alle Richtungen laufen und legst die Aktionen in der Input Map an.
  - Du baust einen Angriff mit dem `AnimationPlayer`, dessen Hitbox in festen Physik-Frames an- und ausgeht, und misst das nach.
