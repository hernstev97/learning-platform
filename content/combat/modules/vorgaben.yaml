lesson: |
  Du schreibst dem Coding-Agenten: „Der Trainingsgegner soll vor dem Angriff kurz aufleuchten und dann hart zuschlagen.“ Zehn Minuten später läuft die Szene. Der Gegner leuchtet 10 Frames, der Treffer hat 8 Frames Hitstop und 300 px/s Knockback (ausgedachte Zahlen für dieses Beispiel). Keine davon hast du gewählt. Der Agent hat sie eingesetzt, weil der Satz keine enthielt. Ob „kurz“ jetzt umgesetzt ist, kannst du nicht prüfen: Es gibt nichts, womit du das Ergebnis vergleichen könntest.

  Diese Lektion zeigt, wie du eine Kampfmechanik so aufschreibst, dass der Agent nur noch Code schreibt. Die Entscheidungen bleiben bei dir, und das Ergebnis prüfst du am Log. Das Beispiel ist eine neutrale Änderung an der Testszene aus [Testszene: Angriff mit Frame-Daten](/combat/testszene-angriff), kein Entwurf für dein Spiel.

  ## Was ein Agent mit Lücken macht

  Ein Coding-Agent soll liefern. Fehlt eine Angabe, füllt er die Lücke mit einer Annahme, die plausibel aussieht. Aus „kurz“ wird eine Zahl, aus „danach“ eine Reihenfolge, aus „hart“ ein Hitstop und ein Knockback. Daraus folgen drei Probleme:

  1. Die Annahme ist eine Designentscheidung, die du nicht getroffen hast.
  2. Du siehst sie nicht. Im Code steht `windup := 10` genauso selbstverständlich wie `windup := 8`.
  3. Du kannst nicht prüfen, ob das Ergebnis stimmt, weil „kurz“ kein Maßstab ist.

  Die Grenze zieht die Regel dieses Kurses: Den Code darf der Agent schreiben, die Werte sind deine Sache. Er legt jede Größe, die der Spieler spürt, als einstellbaren Parameter an, mit `@export` oder `@export_range`, und markiert den Startwert ausdrücklich als Platzhalter ([GDScript exported properties](https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html#limiting-editor-input-ranges)):

  ```gdscript
  ## Telegraph-Frame, ab dem Stufe 2 gilt.
  ## 0 = keine Stufen, Fläche voll wie bisher.
  ## PLATZHALTER – der Wert wird noch festgelegt.
  @export_range(0, 60, 1, "suffix:Frames")
  var stage2_from := 13
  ```

  `@export_range` begrenzt den Regler im Inspektor, der Hinweis `"suffix:…"` schreibt die Einheit daneben ([@export_range](https://docs.godotengine.org/en/stable/classes/class_@gdscript.html#class-gdscript-annotation-export-range)). Der Bereich ist keine Empfehlung, er fängt Tippfehler ab. Der Kommentar sagt jedem, der die Datei öffnet, auch dem nächsten Agenten: Diese 13 hat niemand entschieden.

  Technische Entscheidungen darf der Agent treffen: wie eine Variable heißt, in welcher Datei ein Feld liegt, ob er eine Fläche über `modulate` blasser macht oder eine zweite Fläche anlegt. Alles, was der Spieler spürt – Dauer, Reihenfolge, Reichweite, was was abbricht –, steht in der Vorgabe oder ist ein markierter Platzhalter.

  > [!MERKE]
  > Der Agent baut den Regler. Du stellst ihn ein.

  ## Aufbau: die acht Teile einer Vorgabe

  Eine Vorgabe beantwortet die Fragen, die der Agent sonst selbst beantworten würde. Die Reihenfolge folgt den Abhängigkeiten: Parameter gelten in Zuständen, Konfliktregeln brauchen beides, und Abnahmekriterien brauchen die Log-Zeilen, an denen du sie prüfst.

  | Teil | Frage |
  | --- | --- |
  | 1. Ziel | Was willst du testen? |
  | 2. Zustände | Welche, und wann wechseln sie? |
  | 3. Parameter | Name, Einheit, Bereich, Platzhalter? |
  | 4. Konflikte | Was bricht was ab? |
  | 5. Debug | Welche Log-Zeilen? |
  | 6. Abnahme | Welches Log beweist den Bau? |
  | 7. Offen | Was entscheidest du später? |
  | 8. Nicht entscheiden | Was fasst der Agent nicht an? |

  **Ziel in eigenen Worten.** Ein, zwei Sätze, was der Spieler erleben soll oder was du ausprobieren willst. Der Agent kennt das Ziel, damit er Widersprüche meldet. Optimieren soll er es nicht.

  **Zustände und Übergänge.** Nenne jeden Zustand so, wie er im Log heißt, und die Bedingung für jeden Wechsel: `WAIT -> TELEGRAPH -> ACTIVE -> RECOVERY -> WAIT`. Ein Übergang ohne Bedingung ist eine Lücke.

  **Parameter mit Einheit.** Jede Dauer in Frames bei 60 Physik-Frames pro Sekunde, jede Geschwindigkeit in px/s, jede Strecke in px. Ein Frame ist ein Aufruf von `_physics_process` ([Idle and Physics Processing](https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html)). Sag, wie du zählst: Frames eines Zustands ab 1, wie in der Testszene. Zu jedem Parameter gehören Bereich und Platzhalter.

  **Konfliktregeln.** Hier entstehen die meisten Lücken, deshalb folgt unten ein eigener Abschnitt.

  **Debug-Anforderungen.** Jede neue Mechanik schreibt ihre Ereignisse über `HitLog.add()` ins Log. So bekommt jede Zeile die Physik-Frame-Nummer. Ohne Log-Zeile kannst du nichts prüfen.

  **Abnahmekriterien.** Sätze der Form „Zeile X steht in Frame T + n“, gerechnet mit den Platzhaltern. Der Agent kann sie selbst prüfen, du auch.

  **Offene Fragen.** Was du noch nicht weißt, schreibst du hin. Dann füllt der Agent die Stelle nicht.

  **Nicht entscheiden.** Eine kurze Liste: keine Werte außer den genannten ändern, keine Animation, kein Sound, bei Unklarheit zurückfragen statt raten.

  ### Konfliktregeln: wenn zwei Dinge zusammenkommen

  Ein Angriff allein ist leicht beschrieben. Schwierig wird es, wenn er auf etwas anderes trifft. Geh bei jeder Vorgabe diese Fragen durch:

  - **Abbruch:** Was bricht die neue Aktion ab, und was darf sie abbrechen? Ein Treffer im Wind-up, ein Ausweichen in der Erholung?
  - **Puffer:** Gilt der Eingabepuffer auch für die neue Aktion? Was passiert mit einem Druck, der während der Aktion kommt?
  - **Hitstop:** Zählen die Frames der neuen Aktion im Hitstop weiter, oder stehen sie still?
  - **Gleichzeitig:** Treffen sich beide Seiten im selben Frame, zählen beide Treffer, oder gewinnt einer?

  Fehlt eine Regel, entscheidet die Reihenfolge, in der der Agent die Fälle im Code prüft. Das ist auch eine Designentscheidung, nur eine, die keiner bemerkt. Passt eine Frage nicht zu deiner Änderung, schreib das hin: „Gleichzeitiger Treffer: entfällt, weil …“. Dann sieht der Agent, dass du daran gedacht hast.

  > [!TIP] Erst zurückfragen lassen
  > Bitte den Agenten, die Vorgabe vor dem Code in eigenen Worten zusammenzufassen und alle Fragen zu stellen. Jede Frage zeigt eine Lücke. Die Antwort schreibst du in die Vorgabe, nicht nur in den Chat, sonst fehlt sie beim nächsten Umbau. Leg die Vorgabe als Datei neben den Code, dann versioniert Git sie mit.

  ## One-Page Designs: eine Seite, eine Hypothese

  Kurze Designdokumente sind keine Erfindung für KI-Agenten. Stone Librande stellte 2010 auf der GDC **One-Page Designs** vor: Designdokumente, die auf eine Seite passen, mit Beispielen aus Diablo III, The Simpsons und Spore ([One-Page Designs, GDC Vault](https://gdcvault.com/play/1012356/One-Page)). Eine Fassung aus einer Seminarreihe der Stanford University gibt es frei als [Video](https://www.youtube.com/watch?v=GXmsxYm0Mk0); achte darauf, welche Fragen eine Seite beantwortet und welche sie offenlässt. Für SimCity entstanden laut der Beschreibung seines Vortrags von 2013 über 100 solcher Dokumente ([Simulating a City, One Page at a Time](https://gdcvault.com/play/1017708/Simulating-a-City-One-Page)). Ian Schreiber stellte auf der GDC 2025 vier One-Page-Dokumente vor: Vision, Pillars (Grundpfeiler), Loops (Spielschleifen) und Ressourcenfluss ([The Four One-Page Design Docs You Need](https://gdcvault.com/play/1035120/The-Four-One-Page-Design)).

  Schreibers vier Dokumente beschreiben ein ganzes Spiel, deine Vorgabe eine einzelne Mechanik. Die Idee ist dieselbe: eine Seite, die das Team ohne Rückfrage lesen kann. Tim Ryan schrieb schon 1999, Designdokumente seien für Programmierer „instructions for implementation“ und sollten „eliminate the vagueness“ ([The Anatomy of a Design Document](https://www.gamedeveloper.com/design/the-anatomy-of-a-design-document-part-1-documentation-guidelines-for-the-game-concept-and-proposal)). Ein Agent ist ein Programmierer, der jede Unschärfe auf seine Weise auflöst.

  Für die Abnahme hilft Valves Sicht auf Playtests. Mike Ambinder fasste den Designprozess 2009 so zusammen: „Game designs are hypotheses / Playtests are experiments / Evaluate designs off playtest results / Repeat“ ([Valve's Approach to Playtesting, PDF](https://cdn.fastly.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf)). Auf deine Vorgabe übertragen gibt es zwei Prüfungen:

  | Prüfung | Frage | Wer prüft |
  | --- | --- | --- |
  | Abnahme | Tut der Code, was dasteht? | Log, Agent, du |
  | Experiment | Stimmt die Hypothese? | nur du, beim Spielen |

  Die Abnahme muss bestehen, bevor das Experiment etwas bedeutet. Sonst beurteilst du einen Fehler statt eines Werts. Ein Experiment vergleicht laut Valve „two or more conditions“, also zwei Einstellungen derselben Mechanik. Wie du das aufbaust, steht in [Tuning als Experiment](/combat/tuning).

  > [!PRAXIS] Code fest, Daten beweglich
  > Greg Kasavin beschrieb für Hades monatliche Meilensteine bei Supergiant: Am Anfang sind größere Codeänderungen möglich, „and then we lock the code down and we can still make data changes, and fine tune things“ ([Game Developer](https://www.gamedeveloper.com/design/supergiant-s-fourth-outing-i-hades-i-introduces-a-more-mature-organized-dev-process)). In dieser Phase stimmte das Team also Daten ab, nicht Code. In den Patchnotes zum „Big Bad Update“ steht etwa für Thanatos „increased preattack duration and recovery time“ ([Supergiant](https://www.supergiantgames.com/blog/hades-big-bad-update-patch-notes/)). Für deine Vorgaben heißt das: Jeder Wert, den du später abstimmen willst, gehört in einen Parameter.

  ## Beispiel: Telegraph in zwei Stufen

  Die Änderung betrifft nur die Testszene. Der Trainingsgegner kündigt seinen Angriff mit einer gelben Bodenfläche an, die während des ganzen Telegraphs gleich aussieht. Die Vorgabe macht daraus zwei Stufen. Ob zwei Stufen besser lesbar sind, ist die Hypothese; die Vorgabe sorgt nur dafür, dass du sie testen kannst. Der Node des Gegners heißt hier `Gegner`, alle Werte sind willkürliche Platzhalter.

  ```text
  VORGABE: Telegraph in zwei Stufen
  Ort: Testszene, Trainingsgegner

  1 ZIEL
  Ich will testen, ob ich den Angriff
  früher erkenne, wenn die gelbe Fläche
  erst blass und dann voll erscheint.

  2 ZUSTÄNDE
  WAIT -> TELEGRAPH -> ACTIVE
  -> RECOVERY -> WAIT bleibt.
  Frames eines Zustands zählen ab 1.
  TELEGRAPH hat zwei Stufen:
  Stufe 1: Frame 1 bis stage2_from - 1
  Stufe 2: Frame stage2_from bis windup

  3 PARAMETER (je Angriff, @export_range,
  jeder Startwert als PLATZHALTER markiert)
  stage2_from   Telegraph-Frame, 0 bis 60
                Platzhalter 13
                0 = keine Stufen, Fläche voll
  stage1_alpha  Deckkraft Stufe 1, 0 bis 1
                Platzhalter 0.3
  windup        bleibt, Platzhalter 20
  Stufe 2 zeigt die bisherige Fläche.

  4 KONFLIKTE
  Treffer im TELEGRAPH, interruptible:
    wie bisher HITSTUN, Fläche aus.
  Treffer, nicht interruptible:
    Hitstop hält den Telegraph an,
    Stufe 2 verschiebt sich mit.
  stage2_from > windup: Stufe 2 kommt
    nie, Warnung beim Start ins Log.
  Gleichzeitiger Treffer: entfällt,
    im TELEGRAPH ist die Hitbox aus.

  5 DEBUG
  Neue Zeile über HitLog.add():
    "<Name> TELEGRAPH Stufe 2"
  im ersten Frame von Stufe 2.

  6 ABNAHME (Platzhalter, kein Treffer)
  WAIT -> TELEGRAPH      Frame T
  TELEGRAPH Stufe 2      Frame T + 12
  TELEGRAPH -> ACTIVE    Frame T + 20
  stage2_from = 0: keine Stufe-2-Zeile,
    übriges Log wie vorher.

  7 OFFEN
  Farbe von Stufe 2, Ton dazu:
    entscheide ich nach dem ersten Test.

  8 NICHT ENTSCHEIDEN
  Keine anderen Werte ändern.
  Keine Animation, kein Sound.
  Unklares zurückfragen, nicht raten.
  ```

  Was an dieser Vorgabe die Arbeit macht:

  - **Die Abnahme folgt aus den Platzhaltern.** Stufe 2 beginnt im 13. Telegraph-Frame, also 12 Frames nach dem ersten. Zählt der Agent anders, fällt es in der zweiten Zeile auf.
  - **`stage2_from = 0` hält das alte Verhalten bereit.** Für ein Experiment brauchst du beide Bedingungen in derselben Szene.
  - **Die Konfliktregeln nennen auch den Fall, der nicht vorkommen kann.** Der Agent muss nicht raten, ob du ihn vergessen hast.
  - **Abschnitt 7 markiert, wo der Agent nicht weiterdenken soll.** Sonst bekommt Stufe 2 eine Farbe, die er schön findet.
  - **Wo `stage2_from` im Code liegt, steht nicht da.** Das ist eine technische Frage, die darf der Agent beantworten. „Je Angriff“ dagegen ist Design und steht deshalb drin.

  ## Das Ergebnis prüfen: vorhersagen, starten, vergleichen

  Wie in [Testszene: Angriff mit Frame-Daten](/combat/testszene-angriff) gilt: erst vorhersagen, dann messen. Bevor du die Szene startest, schreibst du das erwartete Log auf. Beginnt der Telegraph in Frame 100:

  ```text
     100  Gegner WAIT -> TELEGRAPH
     112  Gegner TELEGRAPH Stufe 2
     120  Gegner TELEGRAPH -> ACTIVE
  ```

  Steht die Spielfigur in der Fläche, folgt in Frame 121 ihre Treffer-Zeile: Die Hitbox geht in Frame 120 an, und Godot meldet die Überlappung einen Frame später (mit Godot 4.7.2 gemessen).

  Dann startest du die Szene und vergleichst Zeile für Zeile. Willst du die Fläche Frame für Frame sehen, hilft der Einzelbild-Schritt mit F10 im Game-Fenster ([Frame advance](https://docs.godotengine.org/en/stable/tutorials/editor/game_embedding.html#frame-advance-f10)). Jede Abweichung hat eine von drei Ursachen:

  | Abweichung | Ursache | Was du tust |
  | --- | --- | --- |
  | Log weicht von der Vorgabe ab | Code | Agent korrigiert |
  | Vorgabe erlaubt zwei Lesarten | Vorgabe | präzisieren, neu bauen |
  | Log passt, Rechnung nicht | Vorhersage | Denkmodell prüfen |

  Ein Beispiel: Angenommen, das Log zeigt `TELEGRAPH Stufe 2` in Frame 113 statt 112. Dann prüft der Code vermutlich `frame > stage2_from` statt `frame >= stage2_from`. Die Vorgabe sagt „Stufe 2: Frame stage2_from bis windup“ und „Frames zählen ab 1“, also liegt der Fehler im Code. Stünde dort nur „Stufe 2 ab stage2_from“, wäre es eine Lücke in der Vorgabe gewesen, und beide Lesarten wären vertretbar.

  Erst wenn das Log passt, spielst du. Ab da ist das Gefühl deine Sache: Erkennst du den Angriff früher als mit einer Stufe? Das notierst du in deinem Testprotokoll, nicht in der Abnahme.

  > [!INTERVIEW]
  > „Beschreib einen Gegnerangriff so, dass ihn ein Programmierer ohne Rückfrage bauen kann.“ So eine Aufgabe kann in einem Designtest kommen. Gute Antwort: Zustände und Übergänge nennen, jede Dauer in Frames mit Bildrate und jede Strecke in Pixeln. Dann die Konflikte: was den Angriff unterbricht, was im Hitstop passiert, was bei gleichzeitigem Treffer gilt. Zum Schluss, woran man erkennt, dass er fertig ist, etwa an Log-Zeilen mit Frame-Nummer, und welche Werte noch Platzhalter sind. Wer nur das Gefühl beschreibt („schnell, wuchtig“), überlässt das Design dem Programmierer.

  ## Häufige Fehler

  - **Sekunden und Frames gemischt.** „Telegraph 20 Frames, Hitstop 0,05 s“: Der Agent rechnet um oder nicht, und im Code sieht beides gleich aus. Schreib alles in Frames und rechne vorher um (ms = Frames × 1000 / 60). Läuft etwas in Sekunden, etwa ein Tween für das Aufblitzen, schreib die Einheit ausdrücklich dazu.
  - **„Kurz“ und „schnell“ statt Zahlen.** Jedes Adjektiv wird zu einer Zahl, die der Agent wählt. Kennst du die Zahl noch nicht, schreib „Platzhalter“ und einen Bereich.
  - **Abnahme „fühlt sich gut an“.** Das kann kein Agent prüfen. Versucht er es, ändert er Werte nach eigenem Geschmack. Das Gefühl beurteilst du selbst im Experiment; in die Abnahme gehören Log-Zeilen und Frames.
  - **Werte festgelegt, die erst ein Experiment klären soll.** „stage2_from = 13“ ohne Zusatz, obwohl du den Wert erst finden willst. Dann landet die 13 als Konstante im Code, und jeder Versuch ist eine Codeänderung. Schreib „Platzhalter 13, Bereich 0 bis 60“.
  - **Fehlende Konfliktregeln.** Treffer, Hitstop, Puffer, gleichzeitiger Treffer: Ohne Regel entscheidet die Reihenfolge im Code.
  - **Abnahme ohne Frame.** „Stufe 2 erscheint“ prüft nur, dass es sie gibt, nicht wann. Schreib „in Frame T + 12“.

  ## Zusammenfassung

  - Ein Agent füllt jede Lücke mit einer Annahme. Was du nicht aufschreibst, entscheidet er.
  - Werte sind deine Sache. Der Agent legt sie als `@export`-Parameter mit markiertem Platzhalter an.
  - Eine Vorgabe hat acht Teile: Ziel, Zustände, Parameter, Konflikte, Debug, Abnahme, offene Fragen, nicht entscheiden.
  - Dauern stehen in Frames bei 60 pro Sekunde, gezählt ab 1; Geschwindigkeiten in px/s.
  - Konfliktregeln klären Abbruch, Puffer, Hitstop und gleichzeitige Treffer, auch die Fälle, die entfallen.
  - Die Abnahme prüft am Log, ob der Code tut, was dasteht. Das Experiment prüft deine Hypothese, und das Gefühl beurteilst nur du.
  - Vor dem Start das Log vorhersagen, danach vergleichen und jede Abweichung Code, Vorgabe oder Vorhersage zuordnen.
exercises:
  - id: luecken-erkennen
    type: choice
    title: Wo muss der Agent raten?
    prompt: |
      Welche Zeilen aus dieser Vorgabe zwingen den Agenten, eine Designentscheidung zu treffen?
    options:
      - text: Der Gegner holt kurz aus.
        correct: true
        why: „Kurz“ hat keine Zahl. Der Agent wählt eine, und du siehst im Code nicht, dass es seine war.
      - text: "`windup`: Frames, Bereich 1 bis 60, Platzhalter 20."
        correct: false
        why: Einheit, Bereich und Platzhalter stehen da. Der Agent baut den Regler, den Wert stellst du ein.
      - text: "Treffer im Telegraph: bei `interruptible` wie bisher HITSTUN, sonst hält der Hitstop den Telegraph an."
        correct: false
        why: Die Zeile nennt beide Fälle und verweist auf geprüftes Verhalten der Testszene. Da gibt es nichts zu raten.
      - text: Der Schlag soll sich wuchtig anfühlen.
        correct: true
        why: Wucht kann Hitstop, Knockback, Screenshake oder Sound sein. Der Agent wählt Mittel und Werte.
    explanation: |
      Eine Designentscheidung steckt überall dort, wo ein Wort für eine Zahl oder eine Regel steht. „Kurz“ und „wuchtig“ lassen dem Agenten die Wahl, und er trifft sie, ohne nachzufragen. Eine Zeile mit Einheit, Bereich und Platzhalter legt dagegen nur fest, was gebaut wird. Den Wert stellst du später selbst ein.
    resources:
      - title: Godot Docs · Limiting editor input ranges
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/gdscript/gdscript_exports.html#limiting-editor-input-ranges

  - id: abnahme-pruefbar
    type: choice
    title: Was kann der Agent abnehmen?
    prompt: |
      Welche Abnahmekriterien für den Telegraph in zwei Stufen kann der Agent am Log prüfen, ohne selbst eine Designentscheidung zu treffen?
    options:
      - text: "`Gegner TELEGRAPH Stufe 2` steht im Log in Frame T + 12."
        correct: true
        why: Eine Zeile, ein Frame. Das Log zeigt, ob es stimmt.
      - text: "Mit `stage2_from = 0` ist das Log Zeile für Zeile wie vor der Änderung."
        correct: true
        why: Ein Vergleich zweier Logs, keine Bewertung. So prüfst du auch, dass das alte Verhalten erhalten bleibt.
      - text: Der Angriff ist mit zwei Stufen fair lesbar.
        correct: false
        why: Das ist ein Urteil über das Spielgefühl. Es gehört in dein Experiment. Ein Agent, der es erfüllen soll, ändert Werte nach eigener Annahme.
      - text: Stufe 2 erscheint rechtzeitig vor dem Treffer.
        correct: false
        why: „Rechtzeitig“ nennt keinen Frame. Der Agent müsste festlegen, was rechtzeitig ist.
    explanation: |
      Die Abnahme beantwortet nur eine Frage: Tut der Code, was in der Vorgabe steht? Dafür braucht es Log-Zeilen mit Frame-Nummer oder einen Vergleich mit einem bekannten Log. Ob der Angriff dadurch lesbarer wird, ist die Hypothese. Die prüfst du selbst beim Spielen, nachdem die Abnahme bestanden ist.
    resources:
      - title: Valve's Approach to Playtesting (GDC 2009, PDF)
        url: https://cdn.fastly.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf

  - id: teile-einer-vorgabe
    type: order
    title: Die acht Teile
    prompt: |
      Bring die Teile einer Vorgabe in eine sinnvolle Reihenfolge. Jeder Teil baut auf den vorigen auf.
    lang: prose
    lines: |
      Ziel: was du testen willst
      Zustände und Übergänge
      Parameter mit Einheit und Platzhalter
      Konfliktregeln
      Debug: neue Log-Zeilen
      Abnahme: Log-Zeile in Frame T + n
      Offene Fragen
      Nicht entscheiden
    alternatives:
      - [1, 2, 3, 5, 4, 6, 7, 8]
      - [1, 2, 3, 4, 5, 6, 8, 7]
      - [1, 2, 3, 5, 4, 6, 8, 7]
    explanation: |
      Das Ziel steht vorn, damit der Agent Widersprüche erkennt. Parameter gelten in Zuständen, also kommen die Zustände davor. Konfliktregeln brauchen beides, etwa „Hitstop hält den Telegraph an“. Die Abnahme verweist auf die Log-Zeilen aus dem Debug-Teil und muss deshalb danach stehen. Offene Fragen und „nicht entscheiden“ schließen ab; ihre Reihenfolge ist egal, ebenso die von Konflikten und Debug.
    resources:
      - title: Stone Librande · One-Page Designs (GDC 2010)
        url: https://gdcvault.com/play/1012356/One-Page

  - id: ergebnis-pruefen
    type: order
    title: Der Agent meldet „fertig“
    prompt: |
      Der Agent hat den Telegraph in zwei Stufen gebaut. Bring die Schritte in die Reihenfolge, in der du das Ergebnis prüfst.
    lang: prose
    lines: |
      Log aus Vorgabe und Platzhaltern vorhersagen
      Szene mit den Platzhaltern starten
      Log mit der Vorhersage vergleichen
      Abweichung zuordnen: Code, Vorgabe, Rechnung
      Korrigieren, bis das Log passt
      Spielen und den Eindruck notieren
    explanation: |
      Die Vorhersage steht fest, bevor du das Log siehst. Sonst liest du ins Log hinein, was du erwartest. Erst der Vergleich zeigt eine Abweichung, und erst die Zuordnung sagt, wer sie behebt: der Agent den Code, du die Vorgabe oder dein Denkmodell. Gespielt wird zuletzt. Wer vorher spielt, beurteilt womöglich einen Fehler statt einer Mechanik.
    resources:
      - title: Godot Docs · Game embedding · Frame advance (F10)
        url: https://docs.godotengine.org/en/stable/tutorials/editor/game_embedding.html#frame-advance-f10

  - id: stufe-zwei-frame
    type: output
    title: Wann wird die Fläche voll?
    prompt: |
      Der Agent hat die Vorgabe aus der Lektion umgesetzt. Platzhalter: `windup = 20`, `stage2_from = 13`. In welchem Physik-Frame steht `Gegner TELEGRAPH Stufe 2`? Antworte mit der Zahl.
    lang: text
    code: |
      100  Gegner WAIT -> TELEGRAPH
      ???  Gegner TELEGRAPH Stufe 2
    expected: |
      112
    accept:
      - Frame 112
    explanation: |
      Frame 100 ist der erste Telegraph-Frame. Stufe 2 beginnt laut Vorgabe im Telegraph-Frame `stage2_from`, also im 13. Der liegt zwölf Frames nach dem ersten: 100 + 13 − 1 = 112. Dieselbe Rechnung wie bei „Wind-up 8, aktiv ab Frame 9“: Wer ab 1 zählt, zieht beim Umrechnen in absolute Frames eins ab.
    resources:
      - title: Godot Docs · Idle and Physics Processing
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html

  - id: treffer-nach-telegraph
    type: output
    title: Wann trifft der Gegner?
    prompt: |
      Gleiche Werte wie zuvor. Die Spielfigur steht in der Fläche und weicht nicht aus. In welchem Frame steht die Zeile `Spieler getroffen …`? Antworte mit der Zahl.
    lang: text
    code: |
      100  Gegner WAIT -> TELEGRAPH
      112  Gegner TELEGRAPH Stufe 2
      ???  Gegner TELEGRAPH -> ACTIVE
      ???  Spieler getroffen …
    expected: |
      121
    accept:
      - Frame 121
    hints:
      - Der Telegraph belegt die Frames 100 bis 119.
      - Godot meldet eine Überlappung einen Frame nach dem Einschalten der Hitbox.
    explanation: |
      Mit `windup = 20` belegt der Telegraph die Frames 100 bis 119, in Frame 120 wechselt der Gegner nach `ACTIVE` und schaltet seine Hitbox ein. Der Physik-Schritt am Ende von Frame 120 erkennt die Überlappung, `area_entered` kommt in Frame 121. Mit Godot 4.7.2 gemessen. Die zweite Stufe ändert an diesem Timing nichts, sie ändert nur, was du siehst.
    resources:
      - title: Godot Docs · Area2D.area_entered
        url: https://docs.godotengine.org/en/stable/classes/class_area2d.html#class-area2d-signal-area-entered

  - id: stufe-zwei-mit-hitstop
    type: output
    title: Ein Treffer im Telegraph
    prompt: |
      Gleiche Werte, aber der Gegner hat `interruptible = false`. Die Spielfigur trifft ihn, der Treffer kommt in Frame 104 an, Hitstop 4. Laut Konfliktregel hält der Hitstop den Telegraph an. In welchem Frame steht `Gegner TELEGRAPH Stufe 2`?
    lang: text
    code: |
      100  Gegner WAIT -> TELEGRAPH
      104  Gegner getroffen: … Frame 4
      ???  Gegner TELEGRAPH Stufe 2
    expected: |
      116
    accept:
      - Frame 116
    hints:
      - Ohne Treffer wäre es Frame 112.
      - Die Frames 104 bis 107 zählen für den Gegner nicht.
    explanation: |
      Bis Frame 103 zählt der Telegraph die Frames 1 bis 4. Der Treffer in Frame 104 setzt den Hitstop auf 4, die Frames 104 bis 107 stehen still. In Frame 108 läuft Telegraph-Frame 5, und Frame 13 erreicht der Zähler in Frame 116. Kurz: 112 + 4. Genau deshalb steht die Regel in der Vorgabe. Ohne sie könnte der Agent die Stufe auch an die Uhr statt an den Zustand koppeln, und dann käme sie trotz Hitstop in Frame 112.

  - id: sekunden-in-frames
    type: gap
    title: Notizen in Frames
    prompt: |
      Du hast dir Werte in Sekunden notiert. Trag sie für die Vorgabe in Frames ein (60 pro Sekunde). `stage2_from` ist der Telegraph-Frame, in dem Stufe 2 beginnt, gezählt ab 1; die Notiz meint „0,2 s nach Beginn des Telegraphs“.
    lang: text
    code: |
      Notiz               Vorgabe
      Telegraph 0,5 s     windup ⟦30⟧
      Hitstop 50 ms       hitstop ⟦3⟧
      Stufe 2 nach 0,2 s  stage2_from ⟦13⟧
    gaps:
      - label: Telegraph in Frames
        hint: Frames = Sekunden × 60.
      - label: Hitstop in Frames
        hint: Frames = ms × 60 / 1000.
      - label: Erster Frame von Stufe 2
        hint: 0,2 s sind 12 Frames. Welcher Frame beginnt danach?
    explanation: |
      0,5 s × 60 = 30 Frames, 50 ms × 60 / 1000 = 3 Frames. Bei `stage2_from` steckt die Falle im Zählen: 0,2 s sind 12 vergangene Frames, Stufe 2 beginnt also im 13. Telegraph-Frame. Genau wie Wind-up 8 heißt, dass die aktive Phase in Frame 9 beginnt. Wer solche Umrechnungen dem Agenten überlässt, bekommt mal 12, mal 13, und beides sieht im Code gleich richtig aus.
    resources:
      - title: Godot Docs · Idle and Physics Processing
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/idle_and_physics_processing.html

  - id: kurz-vor-active
    type: bug
    title: Der Agent fragt zurück
    prompt: |
      Der Agent fragt: „Wann genau beginnt Stufe 2?“ Eine Zeile in der Abnahme lässt das offen. Finde sie und schreib sie im Format der Nachbarzeilen neu.
    lang: text
    code: |
      3 PARAMETER (Platzhalter)
      stage2_from   Telegraph-Frame 13
      windup        20 Frames
      6 ABNAHME (Platzhalter, kein Treffer)
      WAIT -> TELEGRAPH      Frame T
      TELEGRAPH Stufe 2      kurz vor ACTIVE
      TELEGRAPH -> ACTIVE    Frame T + 20
    lines: [6]
    fix:
      - line: 6
        answers:
          - TELEGRAPH Stufe 2      Frame T + 12
          - TELEGRAPH Stufe 2 in Frame T + 12
          - TELEGRAPH Stufe 2 ab Frame T + 12
          - TELEGRAPH Stufe 2 T + 12
          - TELEGRAPH Stufe 2 Frame 12 + T
          - TELEGRAPH Stufe 2 Frame T + stage2_from - 1
          - Stufe 2 Frame T + 12
          - Stufe 2 in Frame T + 12
    explanation: |
      „Kurz vor ACTIVE“ passt zu Frame T + 19 genauso wie zu T + 10. Der Agent müsste wählen, und jede Wahl bestünde die Abnahme. Mit `stage2_from = 13` beginnt Stufe 2 im 13. Telegraph-Frame, also in Frame T + 12. So prüft die Zeile auch, ob der Agent ab 1 zählt.
    resources:
      - title: Tim Ryan · The Anatomy of a Design Document, Part 1
        url: https://www.gamedeveloper.com/design/the-anatomy-of-a-design-document-part-1-documentation-guidelines-for-the-game-concept-and-proposal

  - id: iframes-sekunden
    type: bug
    title: Eine Zeile in Sekunden
    prompt: |
      Gemeint ist: Die i-Frames beginnen im zweiten Frame des Ausweichens und enden 0,2 Sekunden nach seinem Beginn, wie die Platzhalter in `player.gd`. Eine Zeile mischt die Einheit. Finde sie und schreib sie im Format der Zeile darüber.
    lang: text
    code: |
      VORGABE: i-Frames in der Debug-Anzeige
      Werte: Platzhalter aus player.gd
      invulnerable_from  Dodge-Frame 2
      invulnerable_to    nach 0,2 s
      Anzeige: Figur blau, solange
      is_invulnerable() wahr ist.
    lines: [4]
    fix:
      - line: 4
        answers:
          - invulnerable_to    Dodge-Frame 12
          - invulnerable_to Frame 12
          - invulnerable_to 12
          - invulnerable_to Dodge-Frame 12 (Platzhalter)
          - invulnerable_to Dodge-Frame 12, Platzhalter
          - invulnerable_to Dodge-Frame 12 Platzhalter
          - invulnerable_to bis Dodge-Frame 12
          - invulnerable_to letzter Dodge-Frame 12
    explanation: |
      0,2 s sind 12 Frames. `invulnerable_to` ist der letzte unverwundbare Frame, also Dodge-Frame 12; ab Frame 13 ist die Figur wieder verwundbar. „Nach 0,2 s“ ließe offen, ob die Zeit ab Frame 1 oder ab dem ersten i-Frame läuft, und der Agent müsste selbst umrechnen. Eine Einheit für alle Dauern verhindert beides.
    resources:
      - title: "Godot Docs · @export_range"
        url: https://docs.godotengine.org/en/stable/classes/class_@gdscript.html#class-gdscript-annotation-export-range

  - id: gefuehl-nicht-abnahme
    type: explain
    title: „Fühlt sich fair an“
    prompt: |
      Eine Vorgabe endet mit der Zeile unten. Erkläre in wenigen Sätzen, warum sie nicht in die Abnahme gehört, was ein Agent damit machen würde und wo der Gedanke stattdessen hingehört.
    lang: text
    code: |
      6 ABNAHME
      Der Telegraph fühlt sich fair an.
    points:
      - Die Abnahme prüft am Log, ob der Code tut, was in der Vorgabe steht; „fair“ ist ein Urteil, keine Messung.
      - Ein Agent, der „fair“ erfüllen soll, ändert Werte nach eigener Annahme und trifft damit Designentscheidungen.
      - Das Gefühl beurteilst du selbst beim Spielen, als Experiment zu einer Hypothese wie bei Valve.
      - Der Gedanke gehört als Hypothese ins Ziel und als Eindruck ins Testprotokoll; die Abnahme nennt Log-Zeilen mit Frames.
    explanation: |
      Die Abnahme soll zeigen, dass gebaut ist, was dasteht, etwa „Stufe 2 in Frame T + 12“. „Fair“ lässt sich am Log nicht ablesen. Ein Agent würde trotzdem versuchen, es zu erfüllen, und dafür Werte wie die Dauer der Stufen ändern, also genau die Entscheidungen treffen, die du selbst treffen willst. Valve trennt Design als Hypothese vom Playtest als Experiment. Übertragen heißt das: „Mit zwei Stufen erkenne ich den Angriff früher“ steht als Hypothese im Ziel, und ob es stimmt, notierst du nach dem Spielen im Testprotokoll.
    resources:
      - title: Valve's Approach to Playtesting (GDC 2009, PDF)
        url: https://cdn.fastly.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf

  - id: eigene-vorgabe
    type: practice
    title: Deine erste Vorgabe
    prompt: |
      Schreib eine Vorgabe von 6 bis 10 Zeilen für eine neutrale Änderung an der Testszene, nicht für dein Spiel. Vorschläge: „Die Debug-Anzeige zeigt die i-Frames“ oder „Der Trainingsdummy schreibt Treffer je Zone ins Log“. Schreib darunter die Log-Zeilen, die du nach dem Bau erwartest, mit Frame-Nummern aus den Platzhaltern.
    lang: text
    solution: |
      Beispiel für die Form, nicht für Werte:

      VORGABE: i-Frames in der Debug-Anzeige
      Ziel: sehen, wann die Figur beim
        Ausweichen nicht getroffen wird.
      Zustände: keine neuen.
      Parameter: iframe_color, Platzhalter blau
      Konflikt: Hitstop hält auch die Anzeige.
      Debug: Log "i-Frames an" / "i-Frames aus"
      Abnahme (Platzhalter 2 bis 12):
        DODGE in D, "an" D + 1, "aus" D + 12
      Nicht entscheiden: Werte des Ausweichens

      Vorhersage, Druck in Frame 30:
          30  Spieler MOVE -> DODGE
          31  Spieler i-Frames an
          42  Spieler i-Frames aus
    checklist:
      - Das Ziel sagt in eigenen Worten, was du sehen oder testen willst.
      - Jede Dauer steht in Frames, jede Geschwindigkeit in px/s, und jeder Wert ist als Platzhalter markiert.
      - Mindestens eine Konfliktregel steht da, etwa zu Hitstop oder Treffer, notfalls als „entfällt, weil …“.
      - Mindestens eine neue Log-Zeile über `HitLog.add()` ist verlangt.
      - Die Abnahme nennt Log-Zeilen mit Frame T + n und kein Wort wie „gut“, „fair“ oder „kurz“.
      - Eine Zeile sagt, was der Agent nicht entscheiden darf.
      - Du hast die erwarteten Log-Zeilen aufgeschrieben, bevor jemand Code schreibt.
    explanation: |
      Die Form zählt, nicht die Änderung. Im Beispiel gibt es keine neuen Zustände, und das steht ausdrücklich da. Die Abnahme rechnet mit den Platzhaltern aus `player.gd`: i-Frames ab Dodge-Frame 2 heißt „an“ einen Frame nach dem Start, i-Frames bis Frame 12 heißt „aus“ in Dodge-Frame 13, also D + 12. Ob Blau gut sichtbar ist, gehört nicht in die Vorgabe; das entscheidest du, wenn du die Anzeige siehst.
    resources:
      - title: Ian Schreiber · The Four One-Page Design Docs You Need (GDC 2025)
        url: https://gdcvault.com/play/1035120/The-Four-One-Page-Design
