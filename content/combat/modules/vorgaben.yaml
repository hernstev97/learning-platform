id: vorgaben
title: Kampfmechanik als Vorgabe für einen Coding-Agenten
level: 2
minutes: 90
summary: Wie du eine Kampfmechanik so aufschreibst, dass ein Coding-Agent nur Code schreibt und keine Designentscheidung trifft – mit Zuständen, Parametern in Frames, Konfliktregeln, Log-Zeilen und Abnahmekriterien, die du am Log prüfst.
place: unterwegs
goals:
  - Du erkennst Stellen in einer Vorgabe, an denen ein Coding-Agent eine Designentscheidung treffen müsste.
  - Du schreibst eine Vorgabe mit Ziel, Zuständen, Parametern in Frames, Konfliktregeln, Log-Zeilen, Abnahme, offenen Fragen und dem, was der Agent nicht entscheidet.
  - Du rechnest aus Vorgabe und Platzhalterwerten vorher aus, in welchem Frame eine Log-Zeile steht.
  - Du trennst die Abnahme (tut der Code, was dasteht?) vom Experiment (stimmt deine Hypothese?).
  - Du ordnest eine Abweichung im Log dem Code, der Vorgabe oder deiner Vorhersage zu.
