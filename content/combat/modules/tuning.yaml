lesson: |
  > [!NOTE] Am PC
  > Für diese Lektion brauchst du Godot 4 am Rechner. Lesen kannst du sie auch unterwegs, die Übungen setzen die Testszene voraus.

  Der Trainingsgegner erwischt dich zu oft. Du verlängerst seinen Telegraph, gibst deinem Ausweichen zwei i-Frames mehr und kürzt seine Erholung. Danach fühlt sich der Kampf besser an. Welche der drei Änderungen hat gewirkt? Vielleicht nur eine, vielleicht hebt eine die andere auf. Du weißt es nicht, und beim nächsten Gegner fängst du wieder bei null an.

  Dieses Modul macht aus dem Abstimmen (Tuning) ein Experiment: eine Vermutung vorher, eine Änderung, ein Vergleich, ein Protokoll. Es setzt die Szene aus [Testszene: Ausweichen und Trainingsgegner](/combat/testszene-ausweichen) voraus. Neu ist ein Node, der Version und Werte ins Log schreibt und stumpfes Angreifen nachstellt. Der Code ist Gerüst. Welche Werte du ausprobierst und ob dir ein Ergebnis gefällt, entscheidest du. Alle Zahlen hier sind Platzhalter der Testszene.

  ## Hypothese, eine Größe, Vergleich

  Valve beschreibt seinen Designprozess in vier Zeilen: „Game designs are hypotheses“, „Playtests are experiments“, „Evaluate designs off playtest results“, „Repeat“. Ein Designexperiment heißt dort „Compare two or more conditions“, Daten sammeln und „Verify hypothesis“ ([Valve's Approach to Playtesting, GDC 2009](https://cdn.fastly.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf)). Für eine Runde Tuning in der Testszene wird daraus:

  1. **Hypothese.** Bevor du etwas änderst, schreibst du Ursache und erwartete Wirkung auf: „Der Dummy kommt gegen Dauerdrücken nie zum Schlag, weil ihn jeder Treffer im Telegraph unterbricht. Wird der Telegraph kürzer, erwarte ich, dass er den Bot trifft.“
  2. **Eine Größe.** Du änderst genau einen Wert.
  3. **Vergleich.** Variante A (vorher) gegen Variante B (nachher), mit denselben Tests.
  4. **Beobachtung.** Das Log liefert die Fakten, deine Notiz den Eindruck. Beides getrennt.
  5. **Entscheidung.** B behalten, verwerfen oder weiter untersuchen.
  6. **Offene Fragen.** Was die Runde nicht beantwortet hat, wird die nächste Hypothese.

  „Eine Größe“ heißt in der Testszene: ein Feld einer `AttackData` (etwa `windup` in `gegner_b.tres`), ein Ausweich-Wert der Figur (`invulnerable_to`) oder ein Wert des Gegners (`wait_frames`, `interruptible`). Nie Spieler- und Gegnerwerte zugleich. Eine Größe darf mehrere Folgen haben: Mehr `hitstop` verlängert die aktive Phase des Angreifers und hält das Ziel länger an. Diese Folgen sagst du in der Hypothese voraus. Zwei Größen dagegen kannst du im Ergebnis nicht mehr trennen.

  Ein Gefühl ist noch keine Größe. Bei Ghost of Tsushima meldeten Tester früh, die Gegner seien „sword sponges“. Theodore Fishmans Lieblingszitat aus diesen Tests: „I felt like I was hitting enemies with a foam bat.“ Sucker Punch setzte eine harte Obergrenze für „hits to kill“ über alle Gegner. Um trotzdem Herausforderung zu schaffen, nennt Fishman als Hebel die Verteidigung der Gegner, das Tempo ihrer Angriffe, das Timing für Blocken, Parieren und Ausweichen und den Schaden; mehr HP nur als „Last resort“ ([Honoring the blade, PlayStation Blog](https://blog.playstation.com/?p=344024)). Das ist die Arbeit vor jeder Hypothese: Welcher einzelne Wert steckt hinter dem Gefühl?

  > [!MERKE]
  > Hypothese vor der Änderung, eine Größe pro Runde, A gegen B mit denselben Tests. Was du erst nach dem Test aufschreibst, ist keine Vorhersage mehr.

  Patchnotes zeigen das Ergebnis, nicht das Experiment. Für Thanatos in Hades steht in einer Zeile: „reduced frequency of his area attack; also increased preattack duration and recovery time“ ([Hades: The Big Bad Update](https://www.supergiantgames.com/blog/hades-big-bad-update-patch-notes/)). Drei Änderungen an einem Gegner; wie Supergiant sie getestet hat, steht dort nicht. Ausliefern darfst du gebündelt, testen nicht.

  ## Varianten als Dateien und Werte im Log

  Die Frame-Daten liegen seit [Testszene: Angriff mit Frame-Daten](/combat/testszene-angriff) in `AttackData`-Resources. Als `.tres` gespeichert ist eine Resource eine Textdatei, die sich gut versionieren lässt ([Resources](https://docs.godotengine.org/en/stable/tutorials/scripting/resources.html)). Für ein Experiment heißt das:

  - `gegner_a.tres` ist die Ausgangslage. Du änderst sie nicht mehr.
  - `gegner_b.tres` entsteht als Kopie im Dateisystem-Dock. Darin änderst du genau ein Feld.
  - Zum Umschalten ziehst du im Inspektor die andere Datei in `attacks` des Dummys und startest neu.

  Greg Kasavin erzählt, dass Supergiant für Hades am Ende eines Meilensteins den Code sperrt und trotzdem noch „make data changes, and fine tune things“ kann ([Game Developer, 2019](https://www.gamedeveloper.com/design/supergiant-s-fourth-outing-i-hades-i-introduces-a-more-mature-organized-dev-process)). Das geht nur, weil die Werte Daten sind und nicht im Code stehen.

  Damit du später weißt, was du getestet hast, schreibt ein Versuch-Node zu Beginn jedes Laufs die Godot-Version und alle Werte ins Log. Häng einen `Node` unter `Main`, gib ihm dieses Skript und zieh Figur und Dummy in seine Felder:

  ```gdscript title=versuch.gd
  extends Node

  ## Versuchsleiter der Testszene. Technisches Gerüst, keine Designentscheidung:
  ## schreibt zu Beginn Godot-Version, Varianten und Werte ins Log und drückt auf
  ## Wunsch alle N Frames attack (Mash-Bot), damit stumpfes Angreifen reproduzierbar ist.

  @export var player: CharacterBody2D
  @export var enemy: CharacterBody2D
  @export var mash := false                  ## an: der Bot greift stumpf an, Hände weg
  @export_range(1, 60) var mash_every := 4   ## alle so viele Frames ein Druck

  var mash_frame := 0


  func _ready() -> void:
  	HitLog.add("Godot %s" % Engine.get_version_info().string)
  	HitLog.add("Spieler %s, Puffer %d" % [_describe(player.attack), player.input_buffer])
  	HitLog.add("Ausweichen %d Frames, i-Frames %d-%d, Tempo %.0f, Erholung %d" % [player.dodge_frames, player.invulnerable_from, player.invulnerable_to, player.dodge_speed, player.dodge_recovery])
  	for a: AttackData in enemy.attacks:
  		HitLog.add("%s %s" % [enemy.name, _describe(a)])
  	HitLog.add("%s wait %d, interruptible %s" % [enemy.name, enemy.wait_frames, enemy.interruptible])
  	HitLog.add("Mash-Bot %s" % ("alle %d Frames" % mash_every if mash else "aus"))


  func _physics_process(_delta: float) -> void:
  	if not mash:
  		return
  	if Input.is_action_pressed(&"attack"):
  		Input.action_release(&"attack")
  	mash_frame += 1
  	if mash_frame >= mash_every:
  		mash_frame = 0
  		Input.action_press(&"attack")


  func _describe(a: AttackData) -> String:
  	return "%s: windup %d, active %d, recovery %d, hitstop %d, hitstun %d, knockback %.0f" % [a.resource_path.get_file(), a.windup, a.active, a.recovery, a.hitstop, a.hitstun, a.knockback]
  ```

  `Engine.get_version_info().string` fasst Version, Status und Build in einem Text zusammen ([Engine.get_version_info](https://docs.godotengine.org/en/stable/classes/class_engine.html#class-engine-method-get-version-info)). `resource_path.get_file()` liefert den Dateinamen der Variante. Die Kopfzeilen eines echten Laufs mit Godot 4.7.2:

  ```text
       0  Godot 4.7.2-stable (official)
       0  Spieler angriff_kb0.tres: windup 8, active 3, recovery 14, hitstop 4, hitstun 12, knockback 0, Puffer 6
       0  Ausweichen 18 Frames, i-Frames 2-12, Tempo 220, Erholung 8
       0  Dummy gegner_a.tres: windup 20, active 4, recovery 30, hitstop 4, hitstun 12, knockback 120
       0  Dummy wait 10, interruptible true
       0  Mash-Bot alle 4 Frames
  ```

  `angriff_kb0.tres` ist eine Kopie von `angriff_a.tres` mit `knockback` 0. Mit den Platzhaltern stößt der erste Treffer den Dummy aus der Reichweite. Im Lauf mit Godot 4.7.2 traf danach keiner mehr, der Dummy schlug dreimal in die Luft. Für die Läufe in dieser Lektion bleibt deshalb der Rückstoß aus, in A wie in B.

  Reproduzierbare Läufe startest du im Terminal; `godot` steht für dein Godot-Binary. `--fixed-fps 60` schaltet die Echtzeit ab, jeder Durchlauf ist genau ein Physik-Frame, und `--quit-after 240` beendet nach 240 Durchläufen:

  ```console
  $ godot --headless --path . --fixed-fps 60 --quit-after 240 > lauf_a.log
  $ godot --headless --path . --fixed-fps 60 --quit-after 240 > lauf_b.log
  $ diff lauf_a.log lauf_b.log | head -4
  6c6
  <      0  Dummy gegner_a.tres: windup 20, active 4, recovery 30, hitstop 4, hitstun 12, knockback 120
  ---
  >      0  Dummy gegner_b.tres: windup 2, active 4, recovery 30, hitstop 4, hitstun 12, knockback 120
  ```

  Zwischen den Läufen hast du im Inspektor `gegner_b.tres` eingesetzt und die Szene gespeichert. In den Kopfzeilen weicht genau eine Zeile ab, mit genau einem Wert: Damit ist belegt, dass B sich in einer Größe von A unterscheidet. Zwei Läufe mit derselben Variante ergaben im Test zeichengleiche Logs.

  ## Zwei Testarten: stumpf drücken und bewusst reagieren

  Wer stumpf angreift, hämmert auf die Angriffstaste und achtet nicht auf den Gegner (Button-Mashing). Wer bewusst reagiert, wartet auf die gelbe Fläche, weicht aus und schlägt in die Erholung. Ein Muster, das man mit Dauerdrücken schlägt, belohnt kein Lesen. Deshalb testest du jede Variante zweimal, stumpf und bewusst, und notierst beide Ergebnisse getrennt.

  Den stumpfen Test übernimmt der Mash-Bot im Versuch-Node. Mit `mash` an drückt er alle `mash_every` Frames `attack` und lässt im nächsten Frame wieder los. `Input.action_press()` simuliert einen Druck, den `is_action_just_pressed()` sieht ([Input.action_press](https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-action-press)). Gedrückt halten reicht nicht: `is_action_just_pressed()` ist nur in dem Frame wahr, in dem die Taste runtergeht. Gemessen mit Godot 4.7.2: Die Figur sieht jeden Druck des Bots einen Frame später, egal wo der Node im Baum hängt. Bei `mash_every = 4` steht `Druck attack` in den Frames 5, 9, 13 und so weiter.

  Ein Ausschnitt aus Lauf A mit dem Bot, die 59 Zeilen `Druck attack` mit `grep -v` herausgefiltert:

  ```text
       5  Spieler MOVE -> WINDUP
      10  Dummy WAIT -> TELEGRAPH
      13  Spieler WINDUP -> ACTIVE
      14  Dummy getroffen: Zone body, Schaden 1.0, in TELEGRAPH Frame 4
      14  Dummy TELEGRAPH -> HITSTUN
      20  Spieler ACTIVE -> RECOVERY
      29  Dummy HITSTUN -> WAIT
      34  Spieler RECOVERY -> MOVE
      34  Spieler MOVE -> WINDUP
      39  Dummy WAIT -> TELEGRAPH
      42  Spieler WINDUP -> ACTIVE
      43  Dummy getroffen: Zone body, Schaden 1.0, in TELEGRAPH Frame 4
      43  Dummy TELEGRAPH -> HITSTUN
  ```

  Das geht so weiter: In 240 Frames steht achtmal `Dummy getroffen`, immer in Frame 4 des Telegraphs, und nie `Dummy TELEGRAPH -> ACTIVE`. Der Dummy steckt in einem **Stun-Lock**: Er kommt aus dem Hitstun (Frames, in denen das getroffene Ziel nicht handeln kann) nie bis zu seinem Angriff. Die Rechnung steht im Log. Sein Telegraph beginnt 25 Frames nach einem Treffer (14 → 39), der nächste Treffer kommt nach 29 (14 → 43). Mit 20 Frames Telegraph fehlen ihm 16 Frames.

  Variante B kürzt nur den Telegraph, `windup` 20 → 2:

  ```text
       5  Spieler MOVE -> WINDUP
      10  Dummy WAIT -> TELEGRAPH
      12  Dummy TELEGRAPH -> ACTIVE
      13  Spieler getroffen in WINDUP, Frame 8
      13  Spieler WINDUP -> HITSTUN
  ```

  B trifft den Bot in Frame 13, genau dort, wo in A seine aktive Phase begann. Danach stößt der Treffer die Figur aus der Reichweite, bis Frame 240 trifft keiner mehr. Den Mash-Test besteht B also. Ob B Lesen belohnt, sagt dieser Test nicht: Zwischen dem ersten gelben Bild und der aktiven Hitbox liegen 2 Frames, 33 Millisekunden. Ob du darauf reagierst oder nur den Takt rätst, zeigt erst der Reaktionstest.

  Den machst du von Hand: `mash` aus, Hände an die Tasten, und du handelst nur nach dem Telegraph. Zähle Anläufe und Treffer gegen dich. Das Log zählt mit: `grep -c "Spieler getroffen" hand_a.log` und `grep -c "TELEGRAPH -> ACTIVE" hand_a.log` geben Treffer und gegnerische Angriffe. Einen Bot für diesen Test baust du nicht. Ein Bot reagiert so schnell, wie du ihn programmierst, und sagt nichts darüber, ob ein Mensch die gelbe Fläche liest.

  > [!PRAXIS]
  > Coin Crew Games hat für Escape Academy über 200 Playtest-Sitzungen durchgeführt und den Vortrag dazu „Never Skip Playtest Day!“ genannt ([GDC 2023](https://gdcvault.com/play/1028825/Independent-Games-Summit-Never-Skip)). Plane Tests als festen Termin in jeder Runde, nicht als Abschluss, wenn alles fertig ist. Der Mash-Bot kostet dich dabei nur einen Haken im Inspektor.

  ## Warum hat es mich getroffen? Log, Einzelbild, Movie Maker

  Fang beim Log an. `13  Spieler getroffen in WINDUP, Frame 8` nennt Zustand und Frame. Lies rückwärts: Der Dummy wechselte in Frame 12 nach `ACTIVE`, seine Hitbox war ab da an, und der Treffer kam einen Frame später an. Die Figur hatte acht Wind-up-Frames hinter sich und wäre in Frame 13 selbst aktiv geworden. Bei einem Treffer im Reaktionstest liest du genauso ab, ob dein `Druck dodge` zu spät kam oder ob der Code einen Frame verschluckt hat.

  Reicht das Log nicht, schau Bild für Bild. **Pause** (F9) hält das Spiel an, „it will still render and process input“; **Nächster Frame** (F10) rückt einen Frame vor; wie weit ein Schritt geht, prüfst du am Frame-Zähler der Debug-Anzeige ([Game embedding](https://docs.godotengine.org/en/stable/tutorials/editor/game_embedding.html#frame-advance-f10)). Mit *Debug → Kollisionsformen sichtbar* zeichnet Godot dazu jede Form ([Debugging tools](https://docs.godotengine.org/en/stable/tutorials/scripting/debug/overview_of_debugging_tools.html#visible-collision-shapes)).

  Für ganze Läufe gibt es den **Movie Maker**. Godot schreibt dann jedes Bild als Datei, nicht in Echtzeit, aber ohne verlorene Bilder ([Creating movies](https://docs.godotengine.org/en/stable/tutorials/animation/creating_movies.html)). Mit `.png` als Endung entsteht eine PNG-Folge, ein Bild pro Frame, plus eine WAV-Datei. `--debug-collisions` entspricht dem Menüpunkt für die Kollisionsformen:

  ```console
  $ mkdir -p /tmp/lauf_a
  $ godot --path . --debug-collisions --write-movie /tmp/lauf_a/bild.png --fixed-fps 60 --quit-after 240
  Movie Maker mode enabled, recording movie in 320×180 @ 60 FPS...
  …
  Done recording movie at path: /tmp/lauf_a/bild.png
  240 frames at 60 FPS (movie length: 00:00:04:00), recorded in 00:00:04 (100% of real-time speed).
  $ ls /tmp/lauf_a | head -2
  bild00000000.png
  bild00000001.png
  ```

  Das Log dieses Laufs war zeichengleich mit dem Lauf ohne Bilder. Im Lauf mit Godot 4.7.2 zeigte `bild00000012.png` den Stand nach Physik-Frame 13 und `bild00000013.png` den nach Frame 14, mit aufblitzendem Dummy: Bildnummer = Log-Frame − 1. Prüf das bei dir einmal an einem Treffer. Die Debug-Anzeige steht in jedem Bild, mit Zustand und Frame der Figur.

  > [!WARNING] Movie Maker braucht Fenster und Ordner
  > Mit `--headless` stürzte Godot 4.7.2 im Test ab, ohne ein Bild zu schreiben. Fehlt der Zielordner, meldet Godot nur `Condition "d.is_null()" is true. Returning: FAILED` und schreibt ebenfalls nichts. Leg den Ordner vorher mit `mkdir -p` an.

  ## Das Iterationsprotokoll

  Jede Runde bekommt einen Eintrag. Die Vorlage:

  ```text
  Datum             ‹TT.MM.JJJJ›
  Godot             ‹aus der ersten Kopfzeile des Logs›
  Ausgangslage      ‹Kopfzeilen von Lauf A›
  Hypothese         ‹Ursache› – darum erwarte ich ‹Wirkung›
  Größe alt -> neu  ‹Datei, Feld, alter Wert -> neuer Wert›
  Erwartung         Mash-Test: ‹…›   Reaktionstest: ‹…›
  Messung (Log)     Mash-Bot A und B: ‹Zählung aus grep›
                    Reaktionstest A und B: ‹Anläufe, Treffer gegen dich›
  Eindruck          ‹eigene Worte, was du beim Spielen bemerkt hast›
  Entscheidung      ‹behalten, verwerfen oder weiter untersuchen›
  Offene Frage      ‹was diese Runde nicht beantwortet hat›
  ```

  Ein ausgefülltes Beispiel für den neutralen Trainingsgegner. Es zeigt die Form, keine Empfehlung: Die Werte sind Platzhalter, die Mash-Zeilen sind echte Messungen mit Godot 4.7.2, und was in ‹…› steht, trägst du selbst ein.

  ```text
  Datum             16.10.2026
  Godot             4.7.2-stable (official)
  Ausgangslage      Spieler angriff_kb0.tres, Dummy gegner_a.tres,
                    wait 10, interruptible true
  Hypothese         Gegen Dauerdrücken kommt der Dummy nie zum Schlag:
                    Sein Telegraph beginnt 25 Frames nach einem Treffer,
                    der nächste Treffer kommt nach 29. Ist der Telegraph
                    kurz genug, trifft er vor meinem nächsten Schlag.
  Größe alt -> neu  gegner_b.tres windup 20 -> 2, sonst nichts
  Erwartung         Mash-Test: B trifft den Bot mindestens einmal.
                    Reaktionstest: Mit B werde ich öfter getroffen als mit A.
  Messung (Log)     Mash-Bot alle 4 Frames, 240 Frames:
                    A: 8 x Dummy getroffen, 0 x Spieler getroffen,
                       0 x Dummy TELEGRAPH -> ACTIVE
                    B: 0 x Dummy getroffen, 1 x Spieler getroffen
                       (Frame 13, in WINDUP Frame 8), 5 x TELEGRAPH -> ACTIVE
                    Reaktionstest von Hand: A ‹…›, B ‹…›
  Eindruck          ‹deine Worte›
  Entscheidung      ‹deine›
  Offene Frage      Bricht ein anderer einzelner Wert den Stun-Lock, ohne
                    den Telegraph zu kürzen? Je eine Runde für
                    interruptible und für wait_frames.
  ```

  Die Version steht oben, weil sich Timing zwischen Godot-Versionen ändern kann. Die Ausgangslage kopierst du aus den Kopfzeilen, nicht aus dem Gedächtnis. Die Messung bleibt eine Zählung; was du dabei denkst, gehört in „Eindruck“.

  ## Grenzen des eigenen Tests

  Du bist ein schlechter Tester deines eigenen Musters. Du kennst den Telegraph, und nach zwanzig Anläufen drückst du im Takt statt auf das Gelb. Der Platzhalter-Gegner aus dem letzten Modul beginnt seinen Telegraph alle 64 Frames (Log: 10, 74). Diesen Takt lernst du, ohne es zu merken. Dein Reaktionstest misst dann Gewöhnung, nicht Lesbarkeit.

  Kleine Stichproben täuschen. Bei drei Anläufen macht ein einziger Fehlgriff 33 Prozentpunkte aus. Notiere jeden Anlauf einzeln, nicht nur die Summe; Valve warnt: „Averages hide extreme examples.“

  Lass deshalb andere spielen. Erkläre nur die Tasten, nicht das Muster. Valve nennt als Stärke der direkten Beobachtung, dass zählt, was Leute tun, nicht was sie sagen, und hält über Befragungen fest: „People don't know why they do what they do.“ Zugleich gilt: „Presence of observers can bias results.“ Setz dich zur Seite, kommentiere nicht, und frag erst nach dem Spiel. Adriaan de Jongh zeigt aus sechs Jahren Playtests mit acht Spielen, wie er unbrauchbare oder verwirrende Daten vermeidet ([Avoiding Evil Data, GDC 2017](https://www.youtube.com/watch?v=6EUeYu0aPn4)). Größere Studios haben dafür eigene Teams ([User Research on Destiny, GDC 2015](https://gdcvault.com/play/1022354/User-Research-on)).

  > [!INTERVIEW]
  > „Woran erkennst du, ob eine Balance-Änderung gewirkt hat?“ Gute Antwort: Schreib vorher auf, was du erwartest und warum, ändere genau einen Wert und vergleiche A und B mit denselben Tests, einem reproduzierbaren Bot-Lauf und einem Test von Hand. Fakten kommen aus dem Log, den Eindruck notierst du getrennt. Danach lässt du andere spielen und beobachtest, was sie tun.

  ## Häufige Fehler

  - **Hypothese erst nach dem Test.** Dann passt jede Erklärung zum Ergebnis. Schreib sie auf, bevor du `gegner_b.tres` anlegst.
  - **Zwei Größen in einer Runde.** Vor allem Spieler und Gegner zugleich. Das Ergebnis lässt sich keinem Wert zuordnen.
  - **A überschrieben.** Ohne unveränderte Ausgangsdatei gibt es nichts zu vergleichen. Erst kopieren, dann ändern.
  - **Eine Datei an zwei Stellen.** Ziehen Figur und Dummy dieselbe `.tres`, änderst du beide: Godot lädt eine Datei nur einmal ([Resources](https://docs.godotengine.org/en/stable/tutorials/scripting/resources.html)). Mit Godot 4.7.2 gemessen: `recovery` an der Figur auf 20 gesetzt, der Dummy hatte danach ebenfalls 20. Die Kopfzeilen zeigen dann bei beiden denselben Dateinamen.
  - **Werte eingebettet.** Steht in der Kopfzeile `main.tscn::…` statt eines Dateinamens, steckt die Resource in der Szene. Speichere sie als eigene Datei.
  - **Nur ein Test.** Nur der Bot übersieht, ob Lesen sich lohnt. Nur von Hand misst du irgendwann deine Gewöhnung.
  - **Der Bot lässt nicht los.** Ohne `action_release()` bleibt `attack` gedrückt, und im Log steht ein einziges `Druck attack`.
  - **Movie Maker schreibt nichts.** Zielordner fehlt, oder Godot läuft mit `--headless`.

  ## Zusammenfassung

  - Tuning ist ein Experiment: Hypothese mit Ursache und Erwartung, eine Größe, A gegen B, Beobachtung, Entscheidung, offene Frage.
  - Eine Größe ist ein Feld einer `AttackData`, ein Ausweich-Wert oder ein Gegnerwert. Nie Spieler und Gegner in derselben Runde.
  - Varianten liegen als eigene `.tres`-Dateien vor. Die Kopfzeilen des Logs beweisen, welche Variante lief und dass sich nur ein Wert unterscheidet.
  - Der Mash-Bot macht stumpfes Angreifen reproduzierbar, der Reaktionstest von Hand zeigt, ob Lesen sich lohnt. Erst beide zusammen sagen etwas über ein Muster.
  - Warum dich etwas getroffen hat, liest du zuerst im Log, dann Bild für Bild mit F9/F10 oder in der PNG-Folge des Movie Makers.
  - Das Protokoll trennt Messung und Eindruck. Die Entscheidung triffst du.
  - Dein eigener Test ist voreingenommen. Andere spielen lassen, beobachten, was sie tun, und erst danach fragen.
exercises:
  - id: eine-groesse
    type: choice
    title: Was ist eine Größe?
    prompt: |
      Du willst prüfen, ob der Trainingsgegner gegen Dauerdrücken zu leicht ist. Welche Änderungen sind jeweils genau eine Größe?
    options:
      - text: "`gegner_b.tres` ist eine Kopie von `gegner_a.tres`, nur `windup` steht auf 12."
        correct: true
        why: Ein Feld in einer eigenen Datei, alles andere gleich. So sieht eine saubere Variante B aus.
      - text: "`wait_frames` des Dummys von 10 auf 30, alle Dateien unverändert."
        correct: true
        why: Ein Wert des Gegners. Die Kopfzeile `Dummy wait 30` belegt den Unterschied.
      - text: "`hitstop` in `angriff_kb0.tres` von 4 auf 8, obwohl dadurch Spieler und Dummy länger stillstehen."
        correct: true
        why: Eine Größe darf mehrere Folgen haben. Du sagst sie in der Hypothese voraus und prüfst sie im Log.
      - text: "`windup` in `gegner_b.tres` kürzer und `invulnerable_to` der Figur länger, damit das Ausweichen fair bleibt."
        correct: false
        why: Zwei Größen, eine beim Gegner, eine bei der Figur. Welche das Ergebnis bewirkt hat, lässt sich danach nicht sagen.
      - text: Figur und Dummy nutzen dieselbe `angriff_a.tres`; du änderst darin nur `recovery`.
        correct: false
        why: Ein Feld, aber zwei Figuren. Godot lädt die Datei nur einmal, beide bekommen den neuen Wert. Mit Godot 4.7.2 nachgemessen.
    explanation: |
      Eine Größe ist ein einzelner Wert an einer Stelle: ein Feld einer `AttackData`, ein Ausweich-Wert oder ein Gegnerwert. Dass ein Wert mehrere Folgen hat, ist normal; der Hitstop verlängert die Zustände beider Beteiligten. Kritisch ist, wenn zwei unabhängige Werte zugleich wechseln, auch versteckt über eine geteilte Datei. Dann gibt es zwei mögliche Ursachen für ein Ergebnis.
    resources:
      - title: Godot Docs · Resources
        url: https://docs.godotengine.org/en/stable/tutorials/scripting/resources.html

  - id: mash-log-lesen
    type: choice
    title: Was sagt der Bot?
    prompt: |
      Der Mash-Bot läuft 240 Frames gegen Variante A. Das Log zeigt achtmal `Dummy getroffen`, nie `Spieler getroffen` und nie `Dummy TELEGRAPH -> ACTIVE`. Welche Schlüsse trägt dieses Log?
    options:
      - text: Gegen stumpfes Angreifen kommt der Dummy mit diesen Werten nie zum Schlag.
        correct: true
        why: Ohne `TELEGRAPH -> ACTIVE` gibt es keinen gegnerischen Angriff. Das ist eine Zählung, keine Deutung.
      - text: Gegen A lohnt sich Lesen nicht, solange Dauerdrücken schon ohne Gegentreffer gewinnt.
        correct: true
        why: Wer nur drückt, bekommt hier alles. Ein Spieler, der auf den Telegraph wartet, hat keinen Vorteil davon.
      - text: A ist zu leicht und muss geändert werden.
        correct: false
        why: Ob das Muster so bleiben soll, ist eine Designentscheidung. Das Log beschreibt, was passiert, nicht, was passieren soll.
      - text: Der Bot zeigt, wie ein Mensch A spielt.
        correct: false
        why: Der Bot steht still und drückt alle 4 Frames. Ein Mensch läuft, zögert und reagiert. Dafür gibt es den Reaktionstest.
    explanation: |
      Das Log belegt einen Stun-Lock: Jeder Treffer schickt den Dummy in den Hitstun, bevor sein Telegraph endet. Daraus folgt, dass stumpfes Drücken gegen A gewinnt und Lesen nichts bringt. Ob du das ändern willst, entscheidest du. Wie sich ein Mensch gegen A schlägt, misst du von Hand.
    resources:
      - title: Valve's Approach to Playtesting (PDF)
        url: https://cdn.fastly.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf

  - id: runde-ablauf
    type: order
    title: Eine Runde in der richtigen Reihenfolge
    prompt: |
      Bring die Schritte einer Tuning-Runde in eine sinnvolle Reihenfolge.
    lang: text
    lines: |
      Hypothese mit Ursache und erwarteter Wirkung aufschreiben
      gegner_a.tres im Dateisystem-Dock als gegner_b.tres duplizieren
      In gegner_b.tres genau ein Feld ändern
      Mash-Test mit A und mit B laufen lassen und die Logs speichern
      In den Kopfzeilen prüfen, dass nur dieser eine Wert abweicht
      Reaktionstest von Hand mit A und mit B
      Entscheidung und offene Frage ins Protokoll schreiben
    alternatives:
      - [1, 2, 3, 4, 6, 5, 7]
      - [1, 2, 3, 6, 4, 5, 7]
    explanation: |
      Die Hypothese steht am Anfang, noch vor der Kopie. Wer erst ändert und dann begründet, passt die Erklärung dem Ergebnis an. Die Kopie kommt vor der Änderung, damit A unverändert bleibt. Mash- und Reaktionstest sind voneinander unabhängig, ihre Reihenfolge ist egal. Die Kopfzeilen prüfst du, sobald die Logs da sind. Die Entscheidung kommt zuletzt, wenn alle Messungen vorliegen.
    resources:
      - title: Valve's Approach to Playtesting (PDF)
        url: https://cdn.fastly.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf

  - id: mash-takt
    type: output
    title: Der Takt des Bots
    prompt: |
      Der Versuch-Node hat `mash = true` und `mash_every = 6`. Die Physik-Frames zählen ab 1. Ein Druck mit `Input.action_press()` zählt für `is_action_just_pressed()` der Figur im nächsten Physik-Frame. In welchen Frames schreibt die Figur die ersten drei Zeilen `Druck attack`? Antworte in der Form `1, 2, 3`.
    lang: gdscript
    code: |
      func _physics_process(_delta: float) -> void:
      	if not mash:
      		return
      	if Input.is_action_pressed(&"attack"):
      		Input.action_release(&"attack")
      	mash_frame += 1
      	if mash_frame >= mash_every:
      		mash_frame = 0
      		Input.action_press(&"attack")
    expected: |
      7, 13, 19
    accept:
      - 7 13 19
      - 7,13,19
    explanation: |
      Im ersten Physik-Frame steht `mash_frame` nach dem Hochzählen auf 1, im sechsten auf 6. Dann drückt der Bot und setzt den Zähler zurück. Die Figur sieht den Druck in Frame 7, danach alle 6 Frames: 13, 19. Mit `mash_every = 4` sind es 5, 9, 13 wie in der Lektion. Beide Fälle mit Godot 4.7.2 gemessen.
    resources:
      - title: Godot Docs · Input.action_press
        url: https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-action-press

  - id: naechster-treffer
    type: output
    title: Wann trifft der Bot wieder?
    prompt: |
      Mash-Bot gegen den Dummy. Der Spielerangriff hat die Platzhalter Wind-up 8, aktiv 3, Erholung 14, Hitstop 4, der Puffer ist 6. Der Bot sorgt dafür, dass immer ein frischer Druck im Puffer liegt, und der Dummy steht in Reichweite. In welchem Frame steht die nächste Zeile `Dummy getroffen`? Antworte mit der Zahl.
    lang: text
    code: |
      13  Spieler WINDUP -> ACTIVE
      14  Dummy getroffen: Zone body, Schaden 1.0, in TELEGRAPH Frame 4
      ???  Dummy getroffen: Zone body, Schaden 1.0, in TELEGRAPH Frame 4
    expected: |
      43
    accept:
      - Frame 43
    hints:
      - Der Hitstop hält die aktive Phase der Figur 4 Frames an.
      - Der neue Wind-up beginnt im selben Frame, in dem die Erholung endet.
    explanation: |
      Die aktive Phase beginnt in Frame 13, der Treffer kommt in 14. Die Frames 14 bis 17 stehen still, 18 und 19 sind die aktiven Frames 2 und 3. Die Erholung belegt 20 bis 33, in Frame 34 wechselt die Figur nach `MOVE` und sofort nach `WINDUP`. Wind-up 8 endet mit Frame 41, die Hitbox ist ab 42 an, der Treffer kommt in 43. Das sind 29 Frames: 25 für den Angriff plus 4 Hitstop. Mit Godot 4.7.2 gemessen.

  - id: mash-bot-ergaenzen
    type: gap
    title: Drücken und loslassen
    prompt: |
      Ergänze den Mash-Bot: Er lässt eine gedrückte Angriffstaste im nächsten Frame los, zählt mit und drückt alle `mash_every` Frames neu.
    lang: gdscript
    code: |
      func _physics_process(_delta: float) -> void:
      	if not mash:
      		return
      	if Input.is_action_pressed(&"attack"):
      		⟦Input.action_release⟧(&"attack")
      	mash_frame += 1
      	if mash_frame >= mash_every:
      		mash_frame = ⟦0⟧
      		⟦Input.action_press⟧(&"attack")
    gaps:
      - label: Loslassen
        hint: Das Gegenstück zum simulierten Druck, eine Methode von `Input`.
      - label: Zähler zurücksetzen
        hint: Ab hier zählt der Bot wieder von vorn.
      - label: Drücken
        hint: Simuliert einen Druck, den `is_action_just_pressed()` sieht.
    explanation: |
      `is_action_just_pressed()` ist nur in dem Frame wahr, in dem die Taste runtergeht. Deshalb muss der Bot loslassen, bevor er wieder drückt; sonst zählt nur der erste Druck. Der Zähler läuft bis `mash_every` und beginnt dann bei 0, so liegt zwischen zwei Drücken immer derselbe Abstand.
    resources:
      - title: Godot Docs · Input.action_release
        url: https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-action-release

  - id: movie-maker-befehl
    type: gap
    title: Ein Lauf als PNG-Folge
    prompt: |
      Ergänze den Befehl: Godot soll den Lauf als PNG-Folge nach `/tmp/lauf_b/` schreiben, mit festen 60 Bildern pro Sekunde, und nach 240 Bildern beenden.
    lang: text
    code: |
      mkdir -p /tmp/lauf_b
      godot --path . --debug-collisions ⟦--write-movie⟧ /tmp/lauf_b/bild.png ⟦--fixed-fps⟧ 60 ⟦--quit-after⟧ 240
    gaps:
      - label: Movie Maker einschalten
        hint: Die Option nimmt den Pfad der Ausgabedatei.
      - label: Feste Bildrate
        hint: Diese Option schaltet die Synchronisation mit der Echtzeit ab.
      - label: Beenden
        hint: Zählt Durchläufe der Hauptschleife.
    explanation: |
      `--write-movie` schaltet den Movie Maker ein, die Endung `.png` wählt die PNG-Folge. Die Bilder heißen `bild00000000.png`, `bild00000001.png` und so weiter. `--fixed-fps` erzwingt der Movie Maker ohnehin, die Option legt die Bildrate fest. `--quit-after 240` beendet nach 240 Durchläufen, das sind hier 240 Bilder. `mkdir -p` steht davor, weil Godot 4.7.2 den Ordner nicht selbst anlegt.
    resources:
      - title: Godot Docs · Creating movies
        url: https://docs.godotengine.org/en/stable/tutorials/animation/creating_movies.html

  - id: protokoll-zwei-groessen
    type: bug
    title: Der Telegraph war schuld?
    prompt: |
      In diesem Protokoll folgt die Entscheidung nicht aus der Messung. Finde die Zeile, die das verursacht, und korrigiere sie so, dass sie zur Hypothese passt.
    lang: text
    code: |
      Datum:            16.10.2026
      Godot:            4.7.2-stable (official)
      Hypothese:        Der Dummy kommt gegen Dauerdrücken nie zum Schlag,
                        weil sein Telegraph länger dauert als die Pause
                        zwischen zwei Treffern.
      Geänderte Größe:  gegner_b.tres windup 20 -> 2, Dummy interruptible true -> false
      Erwartung:        Mash-Test: Der Dummy trifft den Bot mindestens einmal.
      Messung:          Mash-Bot, 240 Frames: 1 x Spieler getroffen (A: 0 x)
      Entscheidung:     B behalten. Der kurze Telegraph hat den Stun-Lock gebrochen.
    lines: [6]
    fix:
      - line: 6
        answers:
          - "Geänderte Größe: gegner_b.tres windup 20 -> 2"
          - "Geänderte Größe: windup 20 -> 2"
          - "Geänderte Größe: gegner_b.tres windup 20 -> 2, sonst nichts"
    explanation: |
      Die Runde ändert zwei Größen. Dann kann der Treffer gegen den Bot vom kurzen Telegraph kommen oder davon, dass der Dummy nicht mehr unterbrechbar ist. Mit Godot 4.7.2 nachgemessen: Jede der beiden Änderungen allein liefert im Mash-Test einen Treffer gegen den Bot. Die Entscheidung schreibt also einer Ursache zu, was zwei haben könnten. Weil die Hypothese vom Telegraph handelt, bleibt nur `windup` in dieser Runde; `interruptible` bekommt eine eigene.
    resources:
      - title: "Hades: The Big Bad Update (Patchnotes)"
        url: https://www.supergiantgames.com/blog/hades-big-bad-update-patch-notes/

  - id: mash-takt-falsch
    type: bug
    title: Vier eingestellt, fünf gemessen
    prompt: |
      `mash_every` steht auf 4. Im Log stehen die Zeilen `Druck attack` aber in den Frames 6, 11, 16 – alle 5 Frames. Finde die Zeile und korrigiere sie.
    lang: gdscript
    code: |
      func _physics_process(_delta: float) -> void:
      	if not mash:
      		return
      	if Input.is_action_pressed(&"attack"):
      		Input.action_release(&"attack")
      	mash_frame += 1
      	if mash_frame > mash_every:
      		mash_frame = 0
      		Input.action_press(&"attack")
    lines: [7]
    fix:
      - line: 7
        answers:
          - "if mash_frame >= mash_every:"
          - "if mash_every <= mash_frame:"
          - "if mash_frame == mash_every:"
          - "if mash_every == mash_frame:"
    explanation: |
      Mit `>` drückt der Bot erst, wenn `mash_frame` auf 5 steht, und setzt danach auf 0 zurück. Zwischen zwei Drücken liegen so `mash_every + 1` Frames. Mit `>=` drückt er bei 4. Mit Godot 4.7.2 nachgestellt: Mit `>` stehen die Drücke in 6, 11, 16, mit `>=` in 5, 9, 13. Ein Takt, der um eins daneben liegt, verfälscht jeden Mash-Test, ohne dass das Spiel kaputt aussieht.
    resources:
      - title: Godot Docs · Input.action_press
        url: https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-action-press

  - id: stillstand-beim-mashen
    type: explain
    title: Warum der Bot sich nicht bewegt
    prompt: |
      In einem Mash-Lauf hält ein Testskript zusätzlich `move_right` gedrückt. Trotzdem bleibt die Figur ab dem ersten Angriff auf x = 86,00 stehen, bis zum Ende des Laufs nach 240 Frames. Im Log steht `34  Spieler RECOVERY -> MOVE` und in derselben Frame-Nummer `34  Spieler MOVE -> WINDUP`. Erkläre am Code der Figur, warum sie keinen Schritt macht, und was das für den Mash-Test bedeutet.
    lang: gdscript
    code: |
      func _physics_process(_delta: float) -> void:
      	_read_buttons()
      	if hitstop_left > 0:
      		hitstop_left -= 1
      		return
      	# 1. Übergänge: Ist der Zustand abgelaufen, oder startet eine Aktion?
      	frame += 1
      	if state != State.MOVE and frame > _duration(state):
      		_enter(_next_state(state))
      	if state == State.MOVE:
      		if _consume(&"attack"):
      			_enter(State.WINDUP)
      		elif _consume(&"dodge"):
      			_enter(State.DODGE)
      	elif state == State.RECOVERY and attack.cancel_from > 0 and frame >= attack.cancel_from:
      		if _consume(&"attack"):
      			_enter(State.WINDUP)
      	_update_hurtbox()
      	# 2. Verhalten im (neuen) Zustand
      	match state:
      		State.MOVE:
      			_move()
    points:
      - Der Bot drückt alle 4 Frames, der Puffer hält einen Druck 6 Frames; am Ende jeder Erholung liegt also ein gültiger Druck bereit.
      - Im Frame, in dem die Erholung endet, laufen erst die Übergänge; `_consume` findet den Druck, und die Figur wechselt noch im selben Frame nach `WINDUP`.
      - "`_move()` läuft nur, wenn die Figur nach den Übergängen in `MOVE` ist; das ist nie der Fall, also macht sie keinen Schritt."
      - Der Mash-Test misst einen stehenden Angreifer; ein Mensch, der hämmert und dabei läuft, erzeugt andere Lagen, deshalb ersetzt der Bot den Test von Hand nicht.
    explanation: |
      Die Figur entscheidet in jedem Frame zuerst über Übergänge und handelt erst danach. Endet die Erholung, wechselt sie nach `MOVE`, und im selben Frame startet der gepufferte Angriff. Weil der Bot schneller drückt, als der Puffer verfällt, ist das bei jedem Ende einer Erholung so. `_move()` kommt nie dran, gedrückte Richtung hin oder her. Das ist kein Fehler im Bot, sondern eine Eigenschaft des Tests: Er stellt einen Spieler nach, der stehen bleibt und drückt. Was ein Mensch dabei anders macht, siehst du nur von Hand oder bei einer anderen Person.
    resources:
      - title: Godot Docs · Input.is_action_just_pressed
        url: https://docs.godotengine.org/en/stable/classes/class_input.html#class-input-method-is-action-just-pressed

  - id: tuning-runde
    type: practice
    title: Eine Tuning-Runde mit Protokoll
    prompt: |
      Bau den Versuch-Node in deine Testszene ein. Wähle selbst eine Größe des Trainingsgegners, die du ändern willst. Schreib die Hypothese mit Ursache und erwarteter Wirkung ins Protokoll, bevor du `gegner_b.tres` anlegst. Teste A und B jeweils mit dem Mash-Bot und von Hand und füll das Protokoll vollständig aus.
    lang: text
    solution: |
      Beispiel für die Form, nicht für den Wert (Platzhalter,
      Trainingsgegner, andere Größe als in der Lektion):

      Datum             ‹Datum›
      Godot             4.7.2-stable (official)
      Ausgangslage      Spieler angriff_kb0.tres,
                        Dummy gegner_a.tres, wait 10
      Hypothese         Mit längerer Pause vor jedem Angriff
                        trifft mich der Dummy seltener, weil
                        ich nach jedem Ausweichen länger frei bin.
      Größe alt -> neu  wait_frames 10 -> 30, sonst nichts
      Erwartung         ‹vorher aufschreiben›
      Messung (Log)     ‹Zeilen aus A und B›
      Eindruck          ‹deine Worte›
      Entscheidung      ‹deine›
      Offene Frage      ‹deine›
    checklist:
      - Die Hypothese mit Ursache und erwarteter Wirkung stand im Protokoll, bevor du `gegner_b.tres` angelegt hast.
      - "`gegner_a.tres` ist unverändert, und `diff` zeigt in den Kopfzeilen von A und B genau eine abweichende Zeile mit einem abweichenden Wert."
      - Datum und Godot-Version stehen im Protokoll, die Version aus der Kopfzeile des Logs.
      - Mash-Test und Reaktionstest sind getrennt notiert, jeweils für A und B, mit Zahlen aus dem Log.
      - Der Eindruck steht in deinen Worten und beschreibt, was du bemerkt hast, nicht, ob der Wert „richtig“ ist.
      - Entscheidung und offene Frage hast du selbst formuliert; die offene Frage nennt wieder genau eine Größe oder einen Test.
    explanation: |
      Die Checkliste prüft die Form, nicht deinen Wert. Welche Größe du wählst und ob du B behältst, ist deine Entscheidung. Wichtig ist, dass jemand anderes, oder du in drei Monaten, aus dem Protokoll nachvollziehen kann, was du erwartet, geändert und gemessen hast. Die Kopfzeilen machen das prüfbar, statt dass du dich an Werte erinnern musst.
    resources:
      - title: Valve's Approach to Playtesting (PDF)
        url: https://cdn.fastly.steamstatic.com/apps/valve/2009/GDC2009_ValvesApproachToPlaytesting.pdf

  - id: mash-gegen-reaktion
    type: practice
    title: Dauerdrücken gegen Lesen
    prompt: |
      Nimm deine aktuelle Variante des Trainingsgegners. Lass den Mash-Bot zweimal hintereinander 240 Frames laufen und vergleiche die Logs. Mach dann den Reaktionstest von Hand mit mindestens zehn gegnerischen Angriffen. Vollzieh einen Treffer gegen dich Bild für Bild nach. Notiere, ob gegen diese Variante Dauerdrücken oder Lesen besser abschneidet.
    lang: text
    solution: |
      Beispiel für die Form:

      $ godot --headless --path . --fixed-fps 60 --quit-after 240 > mash_1.log
      $ godot --headless --path . --fixed-fps 60 --quit-after 240 > mash_2.log
      $ diff mash_1.log mash_2.log          (keine Ausgabe: gleich)
      $ grep -c "Spieler getroffen" mash_1.log
      $ godot --path . > hand.log           (mash aus, von Hand)
      $ grep -c "TELEGRAPH -> ACTIVE" hand.log
      $ grep -c "Spieler getroffen" hand.log

      Notiz: Mash: ‹Treffer gegen den Bot›, Hand: ‹Treffer› bei ‹Angriffe›.
      Treffer in Frame ‹F› nachvollzogen in bild‹F − 1›.png:
      ‹was du gesehen hast›
    checklist:
      - Der Versuch-Node schreibt Version und Werte als erste Zeilen ins Log.
      - Zwei Mash-Läufe mit denselben Werten ergeben dasselbe Log, `diff` zeigt nichts.
      - Der Reaktionstest umfasst mindestens zehn gegnerische Angriffe, gezählt mit `grep -c`.
      - Du hast einen Treffer gegen dich mit F9/F10 oder in der PNG-Folge des Movie Makers gefunden und Zustand und Frame aus dem Bild mit dem Log abgeglichen.
      - Du hast notiert, ob Dauerdrücken oder Lesen besser abschneidet, mit Zahlen aus beiden Tests, und ob dich das stört. Das ist deine Bewertung.
    explanation: |
      Der doppelte Mash-Lauf prüft das Werkzeug: Sind zwei Läufe gleich, kannst du Unterschiede zwischen A und B den Werten zuschreiben. Der Reaktionstest zeigt die andere Seite. Gewinnt Dauerdrücken, lohnt sich Lesen nicht; verliert Lesen gegen einen sehr kurzen Telegraph, bestraft das Muster auch aufmerksame Spieler. Welches Verhältnis du willst, legst du fest. Der Abgleich zwischen Bild und Log übt den Weg, den du bei jedem unklaren Treffer gehst.
    resources:
      - title: Godot Docs · Creating movies
        url: https://docs.godotengine.org/en/stable/tutorials/animation/creating_movies.html
      - title: Godot Docs · Game embedding (Pause, Frame advance)
        url: https://docs.godotengine.org/en/stable/tutorials/editor/game_embedding.html#frame-advance-f10

  - id: fremdtest
    type: practice
    title: Jemand anderes spielt
    prompt: |
      Lass eine andere Person gegen deinen Trainingsgegner spielen, mindestens zehn gegnerische Angriffe lang. Erkläre nur die Tasten. Beobachte, was sie tut, und speichere das Log. Frag erst danach. Vergleiche das Ergebnis mit deinem eigenen Reaktionstest.
    lang: text
    solution: |
      Beispiel für die Form:

      Datum, Godot-Version, Variante: aus der Kopfzeile von fremd.log
      Erklärt: nur Tasten (Bewegen, attack, dodge)
      Beobachtet (was sie tut):
        Anlauf 1: ‹…›
        Anlauf 2: ‹…›
      Log: ‹Treffer gegen sie› bei ‹gegnerische Angriffe›
      Gesagt (danach, getrennt notiert): ‹…›
      Unterschied zu meinem Test: ‹…›
      Meine Entscheidung danach: ‹…›
    checklist:
      - Vor dem Spiel hast du nur die Tasten erklärt, nichts über Muster, Telegraph oder Werte.
      - Das Log des Fremdtests ist gespeichert, mit Version und Werten in den Kopfzeilen.
      - Du hast notiert, was die Person getan hat, etwa dauernd gedrückt, gewartet oder wohin ausgewichen, getrennt davon, was sie gesagt hat.
      - Fragen hast du erst nach dem Spiel gestellt, offen formuliert („Was ist da passiert?“ statt „War der Telegraph zu kurz?“).
      - Du hast mindestens eine Beobachtung festgehalten, die dir beim eigenen Test nicht aufgefallen ist, oder notiert, dass es keine gab.
      - Ob du danach etwas änderst, hast du selbst entschieden und als neue Hypothese formuliert.
    explanation: |
      Eine andere Person kennt dein Muster nicht. Was sie tut, zeigt, ob der Telegraph ohne Vorwissen lesbar ist. Valve hält fest, dass zählt, was Leute tun, nicht was sie sagen, und dass Beobachter das Ergebnis verzerren können. Deshalb sitzt du still daneben und fragst erst am Ende. Ihre Erklärung ist eine Information, keine Anweisung: Was du daraus machst, entscheidest du.
