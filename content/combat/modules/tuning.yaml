id: tuning
title: Tuning als Experiment
level: 3
minutes: 180
summary: Kampfwerte als Experiment abstimmen – Hypothese vorher, genau eine Größe ändern, Variante A gegen B mit Mash-Bot und Reaktionstest vergleichen, Treffer Bild für Bild nachvollziehen und jede Runde im Protokoll festhalten.
goals:
  - Du schreibst eine Hypothese mit Ursache und erwarteter Wirkung auf, bevor du einen Wert änderst.
  - Du legst Varianten als `.tres`-Dateien an und prüfst an den Kopfzeilen des Logs, dass sie sich in genau einer Größe unterscheiden.
  - Du testest jede Variante getrennt mit dem Mash-Bot und von Hand mit Reaktion auf den Telegraph und begründest, warum es beide Tests braucht.
  - Du findest mit Log, Einzelbild und Movie Maker den Frame, in dem dich ein Treffer erwischt hat.
  - Du führst ein Iterationsprotokoll und lässt andere spielen, ohne ihnen das Muster zu erklären.
