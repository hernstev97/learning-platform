cards:
  - id: game-feel-definition
    module: spielgefuehl
    q: Was verstehst du unter Game Feel?
    a: |
      Das Gefühl beim Steuern einer Figur. Steve Swink nennt es „the tactile sensation of manipulating a digital agent“. Es entsteht aus drei Dingen, die sich messen lassen: wie schnell die Figur auf eine Eingabe reagiert, was sie in der Simulation tut und welche Rückmeldung Bild und Ton geben. Wenn jemand sagt, ein Spiel fühle sich „matschig“ an, suche ich zuerst in diesen drei Gliedern.
    tags: [game-feel, grundlagen]
    level: 1
  - id: frames-statt-gefuehl
    module: spielgefuehl
    q: Warum redest du über Kampf in Frames statt in Eindrücken?
    a: |
      Weil Eindrücke sich nicht übergeben lassen und Frames schon. „Der Schlag ist zu langsam“ kann zehn Ursachen haben. „Der Wind-up dauert 14 Frames, ich will testen, wie 10 sich anfühlen“ kann ein Programmierer umsetzen und ich am Log prüfen. Das Gefühl beurteile ich danach trotzdem selbst, aber jetzt weiß ich, was ich beurteile.
    tags: [game-feel, frames]
    level: 1
  - id: juice-grenzen
    module: spielgefuehl
    q: Kann gutes Trefferfeedback eine schwache Mechanik retten?
    a: |
      Nein, es verstärkt nur, was da ist. Blitz, Ton und Screenshake machen einen guten Treffer deutlicher. Ist der Angriff schlecht getimt oder die Hitbox falsch, verstärken sie eben das. Deshalb stimme ich zuerst Timing und Flächen ab und lege Feedback erst darüber, wie es auch „Juice it or lose it“ zeigt: an einer Mechanik, die schon funktioniert.
    tags: [game-feel, feedback]
    level: 2
  - id: reaktionszeit-frames
    module: eingabe
    q: Wie lange braucht ein Mensch, um auf ein Signal zu reagieren, und was heißt das in Frames?
    a: |
      Für einfache Reaktionen auf ein bekanntes Signal maßen Woods et al. 2015 im Mittel 231 ms, nach Abzug der Geräteverzögerung 213 ms. Das sind knapp 13 Frames bei 60 pro Sekunde. Im Spiel kommt Erkennen und Entscheiden dazu, und die Eingabelatenz des Systems. Eine Ankündigung, die deutlich kürzer ist, kann man nicht lesen und beantworten, nur auswendig lernen.
    tags: [eingabe, reaktionszeit]
    level: 1
  - id: input-buffer-erklaeren
    module: eingabe
    q: Was ist ein Input Buffer, und welches Problem löst er?
    a: |
      Er merkt sich einen Tastendruck, der kam, während die Figur noch nicht handeln konnte, und führt die Aktion im ersten freien Frame aus. Ohne Puffer geht ein Druck verloren, der drei Frames vor dem Ende der Erholung kam, und der Spieler hält das Spiel für träge. Wie groß der Puffer ist, ist eine Designentscheidung: Zu groß, und Aktionen kommen, die der Spieler nicht mehr wollte.
    tags: [eingabe, puffer]
    level: 1
  - id: latenzkette
    module: eingabe
    q: Ein Tester sagt, das Spiel reagiere träge. Wo suchst du?
    a: |
      Ich trenne Latenz und Design. Latenz entsteht in der Kette Controller, Spiel, Rendern, Bildschirm; Mick West nennt 50 ms als schnellsten realistischen Wert, 60-fps-Spiele liegen typisch bei vier Frames. Design ist das, was nach dem Druck passiert: ein langer Wind-up, keine sofortige Posenänderung, eine Erholung, die den nächsten Druck schluckt. Ich messe zuerst, ob der Druck im Log im erwarteten Frame ankommt, und schaue dann auf die Frame-Daten.
    tags: [eingabe, latenz]
    level: 2
  - id: coyote-time
    module: eingabe
    q: Was ist Coyote Time, und warum ist sie keine Schummelei?
    a: |
      Eine kurze Frist, in der eine Aktion noch klappt, obwohl ihre Bedingung gerade weggefallen ist, etwa ein Sprung kurz nach der Kante. Im Quellcode von Celeste sind das 0,1 Sekunden. Sie gleicht aus, dass Spieler Absicht und Bild minimal versetzt wahrnehmen. Gute Nachsicht merkt man nicht, man merkt nur ihr Fehlen.
    tags: [eingabe, nachsicht]
    level: 2
  - id: phasen-eines-angriffs
    module: angriffsphasen
    q: Aus welchen Phasen besteht ein Angriff, und wofür ist jede da?
    a: |
      Wind-up, aktive Phase, Erholung. Der Wind-up kündigt an und gibt Wucht, die aktive Phase ist das Zeitfenster der Hitbox, die Erholung ist der Preis: In ihr ist der Angreifer verwundbar. Sakurai zerlegt es für Animatoren in Idle, Lead-in, Attack und Follow-through und gibt ihnen vier Zahlen vor: Idle-Pose, Angriffspose, Hitbox-Frame, Gesamtlänge.
    tags: [angriff, frame-daten]
    level: 1
  - id: startup-zaehlung
    module: angriffsphasen
    q: In einer Tabelle steht „Startup 10“. Wann trifft der Angriff?
    a: |
      In den offiziellen Frame-Daten von Street Fighter 6 heißt Startup der Frame, in dem die Hitbox erscheint, er zählt also den ersten aktiven Frame mit. Der Angriff trifft ab Frame 10, davor liegen neun Frames Ausholen. Andere Tabellen zählen nur den Wind-up. Bevor ich Werte vergleiche, kläre ich, welche Zählung sie nutzen.
    tags: [angriff, frame-daten]
    level: 2
  - id: frame-advantage
    module: angriffsphasen
    q: Was ist Frame Advantage, und warum interessiert er auch in Actionspielen ohne Block?
    a: |
      Wie viele Frames eine Seite nach einer Aktion früher handeln kann als die andere. Street Fighter 6 nennt ihn für Treffer und Block. Ohne Block bleibt die Frage dieselbe: Wer ist nach einem Treffer oder einem verfehlten Angriff zuerst wieder frei? Ist der Gegner im Hitstun kürzer gebunden als ich in meiner Erholung, kann er mich danach bestrafen.
    tags: [angriff, punish]
    level: 2
  - id: anschlussangriffe
    module: angriffsphasen
    q: Wie baust du Anschlussangriffe, ohne dass Spieler sie ungewollt auslösen?
    a: |
      Über ein Abbruchfenster in der Erholung: Ab einem bestimmten Frame darf ein gepufferter Angriff starten. Sakurai legt Cancel-Frames in den Follow-through, und die Pose dort muss bereit aussehen. Ungewollte Auslöser vermeide ich mit einem Puffer, der nicht zu groß ist, und indem ich nur Drücke zähle, die nach dem Start des vorigen Angriffs kamen.
    tags: [angriff, cancel]
    level: 3
  - id: hitbox-vs-hurtbox
    module: hitboxen
    q: Was ist der Unterschied zwischen Hitbox und Hurtbox?
    a: |
      Die Hitbox ist die Fläche, mit der ein Angriff trifft, die Hurtbox die, an der eine Figur verwundbar ist. Beide müssen nicht genau dem Bild folgen. Sakurai macht Hitboxen bewusst größer als die Waffe; ein Größenunterschied ist in Ordnung, ein Unterschied in der Position nicht, weil der Spieler dann woanders getroffen wird, als er sieht.
    tags: [hitbox, grundlagen]
    level: 1
  - id: grosszuegige-hitboxen
    module: hitboxen
    q: Sollten Spieler- und Gegner-Hitboxen gleich genau sein?
    a: |
      Nicht unbedingt. Das Team von Dreamscaper gibt Spielerangriffen großzügige Hitboxen und Gegnerangriffen präzise: Der Spieler trifft, wenn es knapp aussieht, und wird nur getroffen, wenn es eindeutig aussieht. Beides wirkt fair, obwohl die Regeln ungleich sind. Wie weit ich das treibe, prüfe ich im Playtest.
    tags: [hitbox, fairness]
    level: 2
  - id: reichweite-draufsicht
    module: hitboxen
    q: Wie bestimmst du in der Draufsicht, ob ein Angriff einen laufenden Gegner erreicht?
    a: |
      Ich rechne in Pixeln pro Frame. Bei 90 Pixeln pro Sekunde bewegt sich eine Figur 1,5 Pixel pro Frame. Läuft der Gegner während meines Wind-ups weg, muss die Hitbox seine neue Position abdecken, wenn sie angeht. Dann prüfe ich es mit sichtbaren Kollisionsformen und Einzelbild, statt mich auf das Bild zu verlassen.
    tags: [hitbox, reichweite]
    level: 2
  - id: iframes-umsetzen
    module: testszene-ausweichen
    q: Wie setzt du i-Frames technisch um, und wo liegt eine typische Falle?
    a: |
      Die Hurtbox ist während der i-Frames aus, in Godot über `monitorable`. Die Falle: Wer Treffer nur ablehnt, statt die Hurtbox abzuschalten, verliert bei langen Angriffen den Treffer nach den i-Frames, denn das Signal meldet nur das Hineinkommen. Deshalb teste ich jedes Ausweichen auch mit „zu früh ausweichen und stehen bleiben“ gegen einen langen Angriff.
    tags: [ausweichen, i-frames, godot]
    level: 3
  - id: risiko-belohnung-ausweichen
    module: ausweichen
    q: Wie machst du ein Ausweichen zu einer Entscheidung statt zu einem Reflex?
    a: |
      Über Kosten und Belohnung. Kosten sind Erholung, ein verwundbarer Anfang oder eine Abklingzeit, die Belohnung ist ein Punish-Fenster oder ein Vorteil. Furi zeigt das deutlich: Ein gelungener Parry heilt, das leichtere Ausweichen nicht. Ist Ausweichen gratis, drückt man es bei jedem Geräusch.
    tags: [ausweichen, risiko]
    level: 2
  - id: punish-fenster
    module: ausweichen
    q: Was ist ein Punish-Fenster, und wie misst du es?
    a: |
      Die Frames, in denen ich frei bin und der Gegner noch in seiner Erholung steckt. Im Log sehe ich, wann meine Figur nach dem Ausweichen wieder `MOVE` erreicht und wann der Gegner seine Erholung verlässt. Ob ein Angriff in das Fenster passt, hängt an seinem Wind-up und an der Strecke, die das Ausweichen zurückgelegt hat.
    tags: [ausweichen, punish]
    level: 2
  - id: telegraph-laenge
    module: gegnermuster
    q: Ein Gegnerangriff gilt als unfair. Was prüfst du an seinem Telegraph?
    a: |
      Länge, Kanal und Ort. Ist die Ankündigung länger als die Reaktionszeit plus die Frames, bis das Ausweichen schützt? Ist sie zu sehen oder zu hören, auch wenn viel los ist? Zeigt sie, wo der Angriff trifft? Naughty Dog hat für The Last of Us Part II die Ankündigungen länger und deutlicher gemacht, als sie das Ausweichen einführten.
    tags: [gegner, telegraph]
    level: 2
  - id: angriffstokens
    module: gegnermuster
    q: Wie verhinderst du, dass zehn Gegner gleichzeitig angreifen?
    a: |
      Mit Angriffstokens aus einem begrenzten Vorrat. Santa Monica Studio hat das für God of War beschrieben: Ein Gegner braucht ein Token, um anzugreifen, größere Gegner belegen mehrere, und ein Gegner außerhalb des Bildes, der aggressiv wird, soll nicht ins Bild gedrängt werden, bevor der Spieler ihn gesehen hat. Die Größe des Vorrats ist ein Schwierigkeitsregler.
    tags: [gegner, aggression]
    level: 3
  - id: muster-statt-zufall
    module: gegnermuster
    q: Sollten Gegner zufällig angreifen?
    a: |
      Das hängt daran, was der Spieler lernen soll. Ich trenne zwei Dinge: die Reihenfolge vorhersagen und einen Angriff an seiner Ankündigung erkennen. Für das Erste braucht es ein Muster. Capcom hat im rundenbasierten Monster Hunter Stories 2 zufälliges Verhalten durch Muster ersetzt, die Spieler vorhersehen und kontern können. Für das Zweite reicht eine gleichbleibende, klare Ankündigung je Angriff; dann bleibt auch eine zufällige Reihenfolge lesbar.
    tags: [gegner, muster]
    level: 2
  - id: grosse-gegner-lesbarkeit
    module: grosse-gegner
    q: Was ist bei großen Gegnern in der Draufsicht schwieriger als bei kleinen?
    a: |
      Ihre Angriffe decken große Flächen ab, ihr Körper verdeckt Teile des Bildes, und manchmal ragen sie aus dem Bild. Deshalb brauchen sie Ankündigungen am Boden, die die Fläche zeigen, eine Kamera, die sie im Bild hält, und klare Stellen, an denen sie verwundbar sind. Itay Keren beschreibt dafür Kameras, die herauszoomen oder sich von wichtigen Objekten anziehen lassen.
    tags: [boss, lesbarkeit, kamera]
    level: 2
  - id: trefferzonen
    module: grosse-gegner
    q: Wozu gibt man einem großen Gegner mehrere Trefferzonen?
    a: |
      Damit Position eine Entscheidung wird. Eine Zone, die mehr Schaden nimmt oder nur in bestimmten Momenten erreichbar ist, lenkt den Spieler an eine Stelle und gibt dem Kampf Struktur. In Shadow of the Colossus hängt das Design jedes Kolosses an der Art, wie man ihn besiegt. Technisch sind es mehrere Hurtboxen mit eigenem Namen und Schadensfaktor.
    tags: [boss, hurtbox]
    level: 2
  - id: boss-unterbrechbar
    module: grosse-gegner
    q: Sollte ein großer Boss durch Treffer unterbrochen werden?
    a: |
      Das ist eine Entscheidung mit Folgen. Ist er unterbrechbar, kann der Spieler ihn mit Dauerangriffen festhalten. Ist er es nie, wirken Treffer leicht wirkungslos. Dazwischen liegt, deutlich zu zeigen, wann er verwundbar ist, etwa in der Erholung nach einem großen Angriff oder in einer eigenen Phase. Welche Regel gilt, entscheidest du und prüfst es im Playtest.
    tags: [boss, hyper-armor]
    level: 3
  - id: hitstop-zweck
    module: trefferfeedback
    q: Was bewirkt Hitstop, und was kostet er?
    a: |
      Er friert Angreifer und Ziel im Moment des Treffers kurz ein, damit der Treffer spürbar wird und die Trefferpose lesbar ist. Sakurai lässt das Opfer dabei stärker zittern als den Angreifer. Der Preis: Jeder betroffene Zustand dauert um den Hitstop länger, der Kampf wird langsamer, und in Smash ist er begrenzt, weil ein Dritter das Einfrieren ausnutzen könnte.
    tags: [feedback, hitstop]
    level: 1
  - id: hitstop-time-scale
    module: trefferfeedback
    q: Warum nimmst du für den Hitstop nicht `Engine.time_scale = 0`?
    a: |
      Weil das in Godot nur `delta` auf null setzt. `_physics_process` läuft weiter, und ein Zustandsautomat, der Frames zählt, zählt weiter. Außerdem steht dann alles, auch Anzeigen. Ich halte deshalb gezielt Angreifer und Ziel mit einem eigenen Zähler an.
    tags: [feedback, hitstop, godot]
    level: 3
  - id: screenshake-regeln
    module: trefferfeedback
    q: Worauf achtest du bei Screenshake?
    a: |
      Stärke nach Bedeutung, kurz und abklingend, und eine Option zum Abschalten. Squirrel Eiserloh berechnet die Stärke aus einem abklingenden Trauma-Wert, etwa Trauma², mit Rauschen statt Zufall. Das Team von Dreamscaper lässt die Kamera beim eigenen Getroffenwerden viel weniger wackeln als beim Treffen. Vlambeer musste Nuclear Throne eine Option zum Abschalten geben, weil manchen Spielern übel wurde.
    tags: [feedback, kamera]
    level: 2
  - id: ton-beim-treffer
    module: trefferfeedback
    q: Was macht einen Trefferton gut?
    a: |
      Er sitzt im Moment des Treffers und endet bei starken Treffern während des Hitstops; Sakurai gibt starken Angriffen einen kurzen Hall mit der Spitze am Anfang. Das Team von Hyper Light Drifter baut Waffensounds aus vielen Schichten und holt die Wucht aus dem Bass. Wiederholte leichte Treffer variiere ich leicht, damit sie nicht ermüden.
    tags: [feedback, sound]
    level: 2
  - id: unfair-oder-schwer
    module: frust-diagnose
    q: Wie unterscheidest du einen schweren von einem unfairen Kampf?
    a: |
      Schwer heißt: Mit Übung kann ich jedem Angriff ausweichen, und wenn ich getroffen werde, weiß ich warum. Unfair heißt: Ich hatte keine Chance, weil die Ankündigung fehlte, zu kurz war oder außerhalb des Bildes lag. Miyazaki sagt für FromSoftware, sie glauben an schwere Spiele, aber nicht an unfaire. Ich frage nach jedem Treffer: Hätte ich es sehen und rechtzeitig reagieren können?
    tags: [diagnose, fairness]
    level: 1
  - id: kaputt-erkennen
    module: frust-diagnose
    q: Woran erkennst du, dass ein unfairer Treffer ein technischer Fehler ist?
    a: |
      Am Log und an der Reproduzierbarkeit. Steht mein Tastendruck im Log und die Aktion kam trotzdem nicht, ging die Eingabe verloren. Trifft die Hitbox an einer Stelle, an der das Bild nichts zeigt, stimmt die Fläche nicht. Ändert sich das Ergebnis bei niedriger Bildrate, hängt Timing am falschen Takt. Solche Fehler behebe ich, bevor ich an Werten drehe.
    tags: [diagnose, technik]
    level: 2
  - id: treffer-nachvollziehen
    module: frust-diagnose
    q: Wie findest du heraus, warum ein Spieler getroffen wurde?
    a: |
      Ich schaue mir genau diesen Moment Frame für Frame an: Log mit Frame-Nummern für Druck, Zustandswechsel und Treffer, Einzelbild in der Engine, sichtbare Kollisionsformen, bei Bedarf eine Aufnahme mit fester Bildrate. Dann ordne ich ihn einer Ursache zu: zu spät reagiert, nicht lesbar oder technischer Fehler. Und ich beobachte andere Spieler, denn Valve rät, darauf zu achten, was Spieler tun, nicht was sie sagen.
    tags: [diagnose, debug]
    level: 2
  - id: vorgabe-aufbau
    module: vorgaben
    q: Was gehört in eine Vorgabe, nach der ein Programmierer oder Coding-Agent eine Kampfmechanik baut?
    a: |
      Das Ziel in eigenen Worten, Zustände und Übergänge, Parameter mit Einheiten, Regeln für Konflikte wie Abbruch, Puffer und Hitstop, Debug-Anforderungen und Abnahmekriterien, die man am Log prüfen kann. Dazu ausdrücklich, was nicht entschieden werden soll: Werte bleiben einstellbare Parameter, das Spielgefühl beurteile ich selbst.
    tags: [vorgaben, dokumentation]
    level: 2
  - id: vorgabe-mehrdeutig
    module: vorgaben
    q: Was passiert, wenn in einer Vorgabe „kurzer Wind-up“ steht?
    a: |
      Wer baut, setzt irgendeine Zahl ein, und niemand merkt, dass das eine Designentscheidung war. Deshalb stehen in Vorgaben Frames bei 60 pro Sekunde und Pixel pro Sekunde, nie „kurz“ oder „schnell“. Ist eine Zahl noch offen, schreibe ich „Parameter, Platzhalter 8, wird getestet“.
    tags: [vorgaben, frames]
    level: 1
  - id: one-page-design
    module: vorgaben
    q: Warum soll ein Designdokument kurz sein?
    a: |
      Weil lange Dokumente nicht gelesen werden und veralten. Stone Librande hat auf der GDC 2010 One-Page Designs vorgestellt: genau eine Seite, oft als Diagramm. Für eine Kampfmechanik reicht meist eine Seite mit Zuständen, Frame-Tabelle, Konfliktregeln und Abnahme.
    tags: [vorgaben, dokumentation]
    level: 2
  - id: godot-physik-takt
    module: godot-start
    q: Wie stellst du in Godot sicher, dass ein Angriff unabhängig von der Bildrate gleich lange trifft?
    a: |
      Gameplay-Timing läuft in `_physics_process`, fest 60 pro Sekunde. Animationen, die Hitboxen schalten, laufen mit `callback_mode_process = Physics`; im Standardmodus Idle habe ich bei 30 Bildern pro Sekunde vier statt drei aktive Frames gemessen. Danach prüfe ich es bei künstlich gesenkter Bildrate.
    tags: [godot, timing]
    level: 2
  - id: pixel-perfect
    module: godot-start
    q: Wie richtest du in Godot Pixelart ohne sichtbare Subpixel-Bewegung ein?
    a: |
      Kleine Grundauflösung, Stretch Mode `viewport`, Scale Mode `integer`, Texturfilter `Nearest` und Pixel-Snap beim Zeichnen. Die Position der Figur bleibt eine Kommazahl, damit analoge Bewegung genau bleibt, gezeichnet wird in ganzen Pixeln. In Godot 4.7 starten neue Projekte mit `canvas_items`, das muss man also ausdrücklich umstellen.
    tags: [godot, pixelart]
    level: 2
  - id: zustandsautomat
    module: testszene-angriff
    q: Wie baust du einen Angriff mit Frame-Daten in Code?
    a: |
      Als Zustandsautomat, der Physik-Frames zählt: `WINDUP`, `ACTIVE`, `RECOVERY`, jeder mit einer Dauer aus einer Datenressource. In jedem Frame zuerst die Übergänge, dann das Verhalten. Die Hitbox ist genau im Zustand `ACTIVE` an. So stehen die Zahlen an einer Stelle, und ein Log mit Frame-Nummern zeigt, ob der Code tut, was die Tabelle sagt.
    tags: [godot, zustandsautomat]
    level: 2
  - id: area-signal-latenz
    module: testszene-angriff
    q: Du schaltest in Godot eine Hitbox ein. Wann kommt der Treffer an?
    a: |
      Einen Frame später. Der Physik-Schritt läuft nach dem Code des Frames, das Signal `area_entered` kommt am Anfang des nächsten. Das gehört in jede Frame-Rechnung. Umschalten im Signal selbst geht nur mit `set_deferred()`, sonst lehnt Godot die Änderung ab, und die Physik rechnet mit der alten Form weiter.
    tags: [godot, treffer]
    level: 3
  - id: werte-als-resource
    module: testszene-angriff
    q: Warum legst du Frame-Daten als Resource an und nicht als Konstanten im Code?
    a: |
      Weil ich sie im Inspektor ändere, ohne Code anzufassen, und Varianten als Dateien speichern kann. Für einen Vergleichstest ziehe ich `angriff_a.tres` oder `angriff_b.tres` in das Feld, und genau ein Wert unterscheidet sie. Das macht Tuning-Runden nachvollziehbar.
    tags: [godot, tuning]
    level: 2
  - id: drei-ausweichfaelle
    module: testszene-ausweichen
    q: Welche Fälle testest du an einem neuen Ausweichen?
    a: |
      Drei: einen Frame zu spät, gerade noch rechtzeitig und zu früh gegen einen Angriff, der länger aktiv ist als die i-Frames. Der erste zeigt, ob der Anfang verwundbar ist, der zweite die genaue Grenze, der dritte, ob die Figur nach den i-Frames wieder getroffen wird. Dazu prüfe ich, dass ein Ausweichen keinen Hitstop auslöst.
    tags: [ausweichen, test]
    level: 3
  - id: hypothese-zuerst
    module: tuning
    q: Wie stimmst du einen Kampfwert ab?
    a: |
      Wie ein Experiment: Vorher schreibe ich auf, was ich ändere, warum und was ich erwarte. Ich ändere genau eine Größe, vergleiche alte und neue Fassung, messe am Log und spiele. Dann entscheide ich und halte offene Fragen fest. Valve beschreibt Designs als Hypothesen und Playtests als Experimente; ohne Hypothese weiß ich hinterher nicht, was ich gelernt habe.
    tags: [tuning, methode]
    level: 2
  - id: stumpf-gegen-bewusst
    module: tuning
    q: Warum testest du Dauerdrücken und bewusstes Reagieren getrennt?
    a: |
      Weil sie unterschiedliche Fragen beantworten. Gewinnt man durch Dauerdrücken, belohnt der Kampf kein Lesen der Ankündigungen. Klappt bewusstes Reagieren nicht, sind die Fenster zu klein oder die Ankündigungen unklar. Erst der Vergleich zeigt, welche Spielweise mein Entwurf wirklich belohnt.
    tags: [tuning, playtest]
    level: 2
  - id: eigene-tests-voreingenommen
    module: tuning
    q: Reicht es, wenn du deinen Kampf selbst testest?
    a: |
      Nein. Ich kenne jedes Muster und jede Absicht, also sehe ich Ankündigungen, die andere übersehen. Ich lasse andere spielen, ohne zu erklären, und beobachte, was sie tun. Was sie sagen, notiere ich auch, aber das Verhalten zählt mehr, und eine Person ist eine Beobachtung, keine Statistik.
    tags: [tuning, playtest]
    level: 1
  - id: designtest-vorgehen
    q: Du bekommst einen Designtest für eine Combat-Stelle. Wie gehst du vor?
    a: |
      Ich kläre, was bewertet wird und wie viel Zeit vorgesehen ist. Dann schreibe ich das Ziel in einem Satz, lege Zahlen in Frames fest, zeige, wie der Entwurf scheitern kann, und belege mindestens eine Iteration mit Hypothese und Messung. Beim Präsentieren denke ich laut, denn es geht um mein Vorgehen, nicht um die eine Idee.
    tags: [karriere, designtest]
    level: 2
  - id: zusammenarbeit-animation
    q: Ein Animator will einen längeren Wind-up, weil die Pose sonst nicht wirkt. Was tust du?
    a: |
      Ich nehme beides ernst: Lesbarkeit und Reaktion. Zuerst schauen wir gemeinsam auf die Frame-Daten und das Spiel, nicht auf die Animation allein. Oft hilft eine stärkere Pose im ersten Frame statt mehr Frames, wie Sakurai für Lead-ins zeigt. Wenn wir uneinig bleiben, bauen wir beide Fassungen und testen sie.
