cards:
  - id: kernel-distribution
    module: linux-einstieg
    q: Was unterscheidet Kernel, Shell und Distribution?
    a: |
      Der Kernel verwaltet unter anderem Prozesse, Speicher und Geräte. Die Shell interpretiert Befehle und startet Programme. Eine Distribution kombiniert Kernel, Userland, Paketverwaltung und voreingestellte Betriebsabläufe. Ein Wechsel von Bash zu fish ist deshalb kein Wechsel des Kernels.
    tags: [grundlagen, shell]
    level: 1
  - id: path-suche
    module: linux-einstieg
    q: Wie findet eine Shell ein Programm ohne vollständigen Pfad?
    a: |
      Sie berücksichtigt zunächst ihre eigenen Namensregeln, etwa Funktionen und Builtins, und sucht externe Programme über PATH. Die Reihenfolge der Verzeichnisse ist relevant. Mit `type` beziehungsweise `command -v` untersuche ich den tatsächlich verwendeten Namen, statt aus einer installierten Datei auf den Aufruf zu schließen.
    tags: [shell, path]
    level: 1
  - id: fhs
    module: dateisystem
    q: Welche Daten gehören typischerweise nach /etc, /usr und /var?
    a: |
      `/etc` enthält systemweite Konfiguration, `/usr` viele installierte Programme und Bibliotheken, `/var` veränderliche Betriebsdaten wie Logs. Das hilft bei Backups und Fehlerdiagnose. Die konkreten Paket- und Dienstpfade prüfe ich trotzdem am System.
    tags: [dateisystem]
    level: 1
  - id: links
    module: dateisystem
    q: Was unterscheidet einen Hardlink von einem symbolischen Link?
    a: |
      Ein Hardlink ist ein weiterer Verzeichniseintrag für denselben Inode im selben Dateisystem. Ein Symlink enthält einen Zielpfad und kann auf ein anderes Dateisystem oder ein fehlendes Ziel zeigen. Das Entfernen eines Namens löscht noch keine Daten, solange andere Links oder offene Deskriptoren sie halten.
    tags: [dateisystem, inodes]
    level: 1
  - id: globbing
    module: dateisystem
    q: Wer erweitert das Sternchen in `ls *.log`?
    a: |
      Die Shell erweitert das Dateimuster vor dem Start von ls. Das Programm erhält die passenden Namen als Argumente. Quoting und Shelloptionen beeinflussen dieses Verhalten; `grep '*.log'` wäre wiederum eine andere Sprache, nämlich ein Suchmuster für grep.
    tags: [shell, dateien]
    level: 1
  - id: stroeme
    module: textverarbeitung
    q: Warum trennen Programme stdout und stderr?
    a: |
      stdout transportiert das Ergebnis, stderr Diagnosen. Eine Pipeline kann dadurch Daten weiterverarbeiten, ohne Fehlermeldungen als Datensätze zu zählen. Eine normale Pipe verbindet stdout des linken mit stdin des rechten Prozesses.
    tags: [pipes, shell]
    level: 1
  - id: umleitungsreihenfolge
    module: textverarbeitung
    q: Warum unterscheiden sich `cmd >out 2>&1` und `cmd 2>&1 >out`?
    a: |
      Umleitungen wirken von links nach rechts. Im ersten Fall zeigt stdout schon auf die Datei, wenn stderr an sein Ziel gebunden wird. Im zweiten wird stderr zuerst mit dem ursprünglichen stdout verbunden und bleibt dort, während stdout anschließend zur Datei wechselt.
    tags: [pipes, shell]
    level: 2
  - id: uniq-sort
    module: textverarbeitung
    q: Warum steht vor uniq oft sort?
    a: |
      `uniq` fasst nur benachbarte gleiche Zeilen zusammen. Sortieren gruppiert alle gleichen Schlüssel, sodass `uniq -c` globale Häufigkeiten innerhalb der Eingabe liefert. Ohne Sortierung können mehrere getrennte Gruppen desselben Schlüssels entstehen.
    tags: [textverarbeitung]
    level: 1
  - id: grep-status
    module: textverarbeitung
    q: Was bedeuten die Exit-Statuswerte 0, 1 und 2 bei grep?
    a: |
      0 bedeutet mindestens einen Treffer, 1 keine Treffer und 2 einen Fehler. Ein Skript muss entscheiden, ob keine Treffer fachlich Erfolg oder Fehler sind. Ein fehlendes Log darf nicht stillschweigend als fehlerfreier Betrieb ausgegeben werden.
    tags: [textverarbeitung, scripting]
    level: 2
  - id: sed-awk
    module: textverarbeitung
    q: Wann verwendest du sed, wann awk und wann einen richtigen Formatparser?
    a: |
      sed passt zu einfachen zeilenweisen Ersetzungen, awk zu Feldern, Mustern und Aggregationen. Für JSON, gequotetes CSV oder verschachtelte Daten nutze ich einen Parser für das Format. Eine kurze Pipeline ist nur gut, wenn ihr Datenvertrag wirklich stimmt.
    tags: [textverarbeitung, review]
    level: 2
  - id: dateinamen-null
    module: textverarbeitung
    q: Warum sind find -print0 und xargs -0 eine Kombination?
    a: |
      Dateinamen können Leerzeichen und Zeilenumbrüche enthalten. Das Nullbyte trennt Namen eindeutig, weil es in Linux-Dateinamen nicht vorkommt. Beide Werkzeuge müssen denselben Trenner vereinbaren; alternativ kann `find -exec … {} +` die Argumente direkt übergeben.
    tags: [dateien, scripting]
    level: 2
  - id: oktalrechte
    module: rechte-benutzer
    q: Erkläre den Dateimodus 640.
    a: |
      Der Besitzer hat Lesen und Schreiben, die Gruppe nur Lesen, andere keine Rechte. Die Werte entstehen aus r=4, w=2 und x=1. Für ein Verzeichnis wäre dieser Modus meist unpassend, weil das Suchrecht fehlt.
    tags: [rechte]
    level: 1
  - id: verzeichnisrechte
    module: rechte-benutzer
    q: Was bedeuten r, w und x an einem Verzeichnis?
    a: |
      r erlaubt das Auflisten von Namen, x das Durchsuchen und den Zugriff auf bekannte Einträge. w zusammen mit x erlaubt das Verändern von Einträgen, etwa Anlegen oder Löschen. Die Rechte einer enthaltenen Datei regeln andere Operationen als die Rechte am Elternverzeichnis.
    tags: [rechte, dateisystem]
    level: 2
  - id: umask
    module: rechte-benutzer
    q: Was bewirkt umask 027 bei üblichen neuen Dateien und Verzeichnissen?
    a: |
      Sie entfernt Rechte aus dem vom Programm angeforderten Modus. Aus 666 wird typischerweise 640, aus 777 wird 750. Bestehende Dateien ändern sich nicht; restriktivere Anwendungsmodi und Default-ACLs können den tatsächlichen Erzeugungsmodus beeinflussen.
    tags: [rechte, scripting]
    level: 2
  - id: sonderbits
    module: rechte-benutzer
    q: Wofür stehen Setuid, Setgid am Verzeichnis und Sticky-Bit?
    a: |
      Setuid kann einem ausführbaren Programm die effektive UID seines Besitzers geben. Setgid am Verzeichnis lässt neue Einträge dessen Gruppe übernehmen. Das Sticky-Bit beschränkt das Entfernen fremder Einträge in gemeinsam beschreibbaren Verzeichnissen. Diese Mechanismen lösen drei unterschiedliche Probleme.
    tags: [rechte, sicherheit]
    level: 2
  - id: acl-maske
    module: rechte-benutzer
    q: Ein ACL-Eintrag erlaubt Schreiben, der Zugriff scheitert trotzdem. Was prüfst du?
    a: |
      Ich prüfe die ACL-Maske, die effektive Rechte benannter Benutzer und der Gruppenklasse begrenzen kann. Danach untersuche ich Suchrechte auf dem Pfad, Mountoptionen und zusätzliche Richtlinien. Der einzelne ACL-Eintrag ist kein vollständiger Zugriffsbeweis.
    tags: [rechte, troubleshooting]
    level: 3
  - id: sudoers
    module: rechte-benutzer
    q: Warum bearbeitest du sudoers mit visudo?
    a: |
      visudo prüft die Syntax vor der Übernahme und unterstützt einen kontrollierten Bearbeitungsablauf. Eine fehlerhafte Regel kann den administrativen Zugang beeinträchtigen. Auch syntaktisch korrekte Freigaben müssen fachlich begrenzt sein; ein erlaubter Interpreter kann praktisch volle Root-Möglichkeiten eröffnen.
    tags: [sicherheit, administration]
    level: 2
  - id: signale
    module: prozesse
    q: Warum ist SIGTERM meist der erste Schritt und SIGKILL der letzte?
    a: |
      Ein Prozess kann SIGTERM behandeln und Daten oder Verbindungen geordnet schließen. SIGKILL kann er weder abfangen noch ignorieren; Aufräumlogik läuft dabei nicht. Vor jedem Signal prüfe ich, welcher Prozess betroffen ist und wem er gehört.
    tags: [prozesse, betrieb]
    level: 1
  - id: zombie
    module: prozesse
    q: Was ist ein Zombie-Prozess und warum hilft kill nicht wie erwartet?
    a: |
      Der Prozess hat seine Ausführung bereits beendet; der Kernel hält noch Statusinformationen für den Elternprozess bereit. Der Elternprozess muss den Exit-Status abholen. Ich untersuche deshalb die Elternbeziehung und deren Fehlerbehandlung statt den schon beendeten Prozess wiederholt zu signalisieren.
    tags: [prozesse]
    level: 2
  - id: load-cpu
    module: prozesse
    q: Ist Load Average eine CPU-Prozentzahl?
    a: |
      Nein. Linux berücksichtigt dabei lauffähige und bestimmte ununterbrechbar wartende Aufgaben. Ich interpretiere den Wert zusammen mit CPU-Anzahl, CPU-Zeiten, Warteschlangen und I/O-Druck. Hohe Last bei niedriger CPU-Arbeit kann daher zu einem I/O-Problem passen.
    tags: [prozesse, performance]
    level: 2
  - id: apt-pacman
    module: paketverwaltung
    q: Wie unterscheiden sich die Updateabläufe von apt und pacman im Alltag?
    a: |
      Mit apt werden Paketlisten aktualisiert und anschließend Pakete aktualisiert. Bei Arch-basierten Systemen gehört die Synchronisation mit einem vollständigen Upgrade zusammen, typischerweise `pacman -Syu`. Ich beachte die Distributionsregeln; ein partielles Arch-Upgrade ist kein unterstützter Wartungsablauf.
    tags: [pakete, administration]
    level: 1
  - id: aur-vertrauen
    module: paketverwaltung
    q: Welche zusätzliche Prüfung erfordert ein AUR-Paket?
    a: |
      Das AUR liefert von Benutzern gepflegte Buildrezepte, keine gleichwertige Garantie wie ein offizielles Distributionspaket. Ich prüfe PKGBUILD, Quellen und relevante Änderungen vor dem Bauen. Ein AUR-Helfer vereinfacht den Ablauf, übernimmt aber nicht die Vertrauensentscheidung.
    tags: [pakete, sicherheit]
    level: 2
  - id: start-enable
    module: systemd-logs
    q: Was unterscheidet systemctl start und enable?
    a: |
      start startet die Unit jetzt. enable richtet die in der Unit beschriebenen Installationsverknüpfungen ein, etwa für den Boot. `enable --now` verbindet beides; eine aktivierte Unit kann trotzdem derzeit fehlgeschlagen sein.
    tags: [systemd]
    level: 1
  - id: reload-daemon
    module: systemd-logs
    q: Wann brauchst du reload und wann daemon-reload?
    a: |
      reload bittet einen unterstützenden Dienst, seine eigene Konfiguration neu zu lesen. daemon-reload lässt systemd geänderte Unitdateien einlesen. Nach einer Unitänderung ist der laufende Prozess dadurch noch nicht automatisch mit den neuen Einstellungen gestartet.
    tags: [systemd]
    level: 2
  - id: drop-in
    module: systemd-logs
    q: Warum ist ein systemd-Drop-in häufig besser als eine vollständige Kopie der Paketunit?
    a: |
      Ein Drop-in beschreibt nur die gewünschte Abweichung. Verbesserungen der Paketunit können dadurch weiter übernommen werden. Ich prüfe die zusammengeführte Konfiguration mit `systemctl cat` und beachte, dass Listenoptionen zum Ersetzen manchmal zunächst geleert werden müssen.
    tags: [systemd, review]
    level: 2
  - id: timer-persistent
    module: systemd-logs
    q: Was leistet Persistent bei einem systemd-Kalendertimer?
    a: |
      Es ermöglicht, eine während der Inaktivität verpasste Kalenderauslösung beim erneuten Aktivieren nachzuholen. Das ist keine Warteschlange, die jede verpasste Ausführung einzeln wiederholt. Die gestartete Aufgabe muss trotzdem mit Fehlern und möglichen Wiederholungen umgehen können.
    tags: [systemd, automation]
    level: 2
  - id: bootphasen
    module: systemd-logs
    q: Wie grenzt du einen Bootfehler ein?
    a: |
      Ich unterscheide Firmware, Bootloader, Kernel, initramfs und das spätere Userspace-System mit systemd. Ein fehlendes Root-Dateisystem in der initramfs ist eine andere Fehlerklasse als ein nach dem Login gescheiterter Dienst. Die letzte beobachtete erfolgreiche Phase bestimmt den nächsten Prüfpunkt.
    tags: [boot, troubleshooting]
    level: 2
  - id: curl-weg
    module: netzwerk-ssh
    q: Was muss für einen erfolgreichen curl-Aufruf einer HTTPS-URL zusammenpassen?
    a: |
      Name und Adresse, lokale Route, erreichbarer Port, TCP-Verbindung, TLS-Prüfung und eine gültige HTTP-Antwort müssen zusammenpassen. Danach kann die fachliche Antwort immer noch falsch sein. Ich nutze die Phasen aus `curl -v`, um die nächste Messung einzugrenzen.
    tags: [netzwerk, http]
    level: 2
  - id: dns-getent
    module: netzwerk-ssh
    q: Warum können dig und getent unterschiedliche Antworten liefern?
    a: |
      dig fragt DNS, während getent die konfigurierten Namensdienste des Systems verwendet, etwa auch lokale Hosts-Einträge. Hinzu kommen möglicherweise verschiedene Caches oder Resolver. Ich prüfe, welchen Weg die betroffene Anwendung tatsächlich benutzt.
    tags: [netzwerk, dns]
    level: 2
  - id: listener-loopback
    module: netzwerk-ssh
    q: Warum ist ein Dienst auf 127.0.0.1 von einem anderen Rechner nicht direkt erreichbar?
    a: |
      Die Loopback-Adresse ist auf den jeweiligen Netzwerk-Namespace begrenzt. Für externe Anfragen braucht es eine passende Bind-Adresse oder einen ausdrücklich eingerichteten Proxy beziehungsweise Tunnel. Ich ändere die Bindung nicht pauschal auf alle Interfaces, ohne die Zugriffsanforderung zu prüfen.
    tags: [netzwerk, sicherheit]
    level: 1
  - id: ssh-hostkey
    module: netzwerk-ssh
    q: Wie reagierst du auf einen geänderten SSH-Host-Key?
    a: |
      Ich prüfe über einen unabhängigen vertrauenswürdigen Kanal, ob der Server neu installiert oder der Schlüssel bewusst gewechselt wurde. Erst nach dieser Verifikation passe ich den bekannten Schlüssel an. Die Warnung blind zu entfernen würde den Schutz vor einem falschen Gegenüber umgehen.
    tags: [ssh, sicherheit]
    level: 2
  - id: ssh-tunnel
    module: netzwerk-ssh
    q: Was bedeutet `ssh -L 15432:127.0.0.1:5432 server`?
    a: |
      Die lokale Weiterleitung nimmt Verbindungen auf Port 15432 an und führt sie über SSH zum Server. Von dort wird 127.0.0.1:5432 erreicht; diese Loopback-Adresse gehört in diesem Teil dem Server. Die Bind-Adresse des lokalen Listeners sollte zur gewünschten Zugänglichkeit passen.
    tags: [ssh, netzwerk]
    level: 2
  - id: quoting
    module: bash-scripting
    q: Warum quotest du "$datei" in Bash?
    a: |
      Das Quoting verhindert bei der Argumentübergabe unerwünschte Wortzerlegung und Dateinamenexpansion. Ein Dateiname mit Leerzeichen bleibt ein Argument. Zusätzlich können ein `--` gegen Optionsinterpretation und fachliche Pfadprüfungen nötig sein; Quoting allein macht ein falsches Ziel nicht richtig.
    tags: [scripting, review]
    level: 1
  - id: strict-mode
    module: bash-scripting
    q: Was leistet set -euo pipefail und wo endet es?
    a: |
      Die Optionen helfen bei nicht gesetzten Variablen, Fehlern in Pipelines und bestimmten unkontrollierten Fehlerstatus. Insbesondere errexit hat dokumentierte Ausnahmen in Bedingungen und anderen Kontexten. Kritische Schritte und erwartete Sonderstatus behandle ich ausdrücklich und teste deren Fehlerpfade.
    tags: [scripting, fehlerbehandlung]
    level: 3
  - id: arrays-argumente
    module: bash-scripting
    q: Warum baust du Befehle als Array statt als String für eval?
    a: |
      Ein Array erhält die Argumentgrenzen und lässt sich mit `"${args[@]}"` sicher übergeben. Ein String vermischt Daten und Shellsyntax und muss erneut interpretiert werden. eval vergrößert dadurch die Fehler- und Angriffsfläche, ohne bei einer bereits bekannten Argumentliste nötig zu sein.
    tags: [scripting, sicherheit]
    level: 2
  - id: trap-grenze
    module: bash-scripting
    q: Welche Garantie gibt ein EXIT-Trap für eine temporäre Datei?
    a: |
      Er kann beim normalen Ende und bei vielen Fehlerausstiegen aufräumen. SIGKILL und ein Stromausfall lassen keinen verlässlichen Aufräumcode laufen. Ich verwende mktemp, begrenze die Aufräumziele auf eigene Dateien und plane tolerierbare Reste ein.
    tags: [scripting]
    level: 2
  - id: df-du
    module: speicher-dateisysteme
    q: df meldet voll, du findet viel weniger. Welche Hypothesen prüfst du?
    a: |
      Ich prüfe den Mount, Leserechte beim Verzeichnislauf, offene gelöschte Dateien, Snapshots und Dateisystemmetadaten. df und du messen verschiedene Ebenen. Bei vielen kleinen Dateien kontrolliere ich zusätzlich Inodes, statt ausschließlich große Dateien zu suchen.
    tags: [speicher, troubleshooting]
    level: 2
  - id: fstab-uuid
    module: speicher-dateisysteme
    q: Warum benutzt fstab häufig UUIDs und was bedeutet nofail nicht?
    a: |
      UUIDs identifizieren das Dateisystem unabhängig von einer wechselnden Gerätenummerierung. nofail macht einen fehlenden Mount beim Booten weniger blockierend, garantiert aber keine korrekte Anwendung ohne dessen Daten. Ich prüfe den aktiven Mount und die Abhängigkeit des Dienstes ausdrücklich.
    tags: [speicher, boot]
    level: 2
  - id: snapshot-backup
    module: speicher-dateisysteme
    q: Warum ersetzt ein Btrfs-Snapshot kein unabhängiges Backup?
    a: |
      Snapshot und Original teilen zunächst Blöcke und hängen am selben Dateisystem beziehungsweise Datenträger. Ein Ausfall dieser Hardware kann beide betreffen. Für Wiederherstellbarkeit brauche ich eine getrennte Kopie und einen Test, der Daten sowie die benötigte Anwendung zurückbringt.
    tags: [speicher, backup]
    level: 2
  - id: ssh-haertung
    module: sicherheit-haertung
    q: Wie stellst du SSH auf Schlüsselzugang um, ohne dich auszusperren?
    a: |
      Ich teste zuerst den vorgesehenen Benutzer samt Schlüssel und sudo, sichere Konfiguration und Konsolenzugang und behalte eine bestehende Sitzung offen. Dann prüfe ich Syntax sowie effektive Einstellungen, lade den Dienst neu und teste eine neue Verbindung. Erst danach schließe ich die alte Sitzung.
    tags: [sicherheit, ssh]
    level: 3
  - id: container-modell
    module: container
    q: Was unterscheidet Image, Container und Volume?
    a: |
      Das Image ist eine Vorlage, der Container eine konkrete Instanz samt Prozess und beschreibbarer Schicht. Ein Volume hält Daten unabhängig vom Lebenszyklus dieser Instanz. Keine dieser drei Komponenten erzeugt von selbst einen getesteten Backupablauf.
    tags: [container]
    level: 1
  - id: entrypoint-cmd
    module: container
    q: Wie spielen ENTRYPOINT und CMD in Exec-Form zusammen?
    a: |
      ENTRYPOINT legt typischerweise das feste Programm fest, CMD seine Standardargumente. Argumente nach dem Imagenamen beim Start ersetzen CMD und werden an ENTRYPOINT angehängt. Eine Shell wird dabei nicht automatisch gestartet, also findet auch keine gewöhnliche Shellvariablenexpansion statt.
    tags: [container, dockerfile]
    level: 2
  - id: compose-health
    module: container
    q: Warum reicht depends_on nicht für einen zuverlässigen Datenbankzugang?
    a: |
      Die einfache Form beschreibt Startreihenfolge, keine vollständige Bereitschaft. Mit service_healthy kann Compose auf einen passenden Healthcheck warten. Spätere Ausfälle bleiben möglich; die Anwendung braucht Wiederverbindung, Zeitlimits und nachvollziehbare Fehlerantworten.
    tags: [container, betrieb]
    level: 2
  - id: docker-ufw
    module: sicherheit-haertung
    q: Ein Dockerport ist trotz UFW-Regel erreichbar. Wie ordnest du das ein?
    a: |
      Docker erzeugt eigene Regeln zur Portveröffentlichung; Verkehr kann vor den von UFW verwendeten INPUT-Regeln umgeleitet werden. Ich prüfe Veröffentlichung, Bind-Adresse und den tatsächlichen Paketpfad. Eine Containerdatenbank sollte oft gar keinen öffentlichen Hostport besitzen.
    tags: [container, sicherheit]
    level: 3
  - id: memory-cgroup
    module: troubleshooting
    q: Warum kann ein Dienst durch OOM enden, obwohl der Host noch RAM hat?
    a: |
      Die cgroup des Dienstes kann ein eigenes Speicherlimit erreicht haben. Ich gleiche Kernelmeldungen, MemoryMax und den Verbrauchsverlauf ab. Das Limit zu erhöhen ist eine mögliche Kapazitätsentscheidung, aber kein Nachweis, dass ein Leck behoben ist.
    tags: [performance, troubleshooting]
    level: 3
  - id: incident-kommunikation
    q: Während einer Störung kennst du die Ursache noch nicht. Was meldest du dem Team?
    a: |
      Ich nenne den beobachteten Ausfall, den belegten Umfang, die bisher geprüften Hypothesen und den nächsten Messschritt. Vermutungen kennzeichne ich als solche und verspreche keine unbelegte Reparaturzeit. Updates enthalten neue Erkenntnisse statt nur „ich suche noch“.
    tags: [zusammenarbeit, incident]
    level: 2
  - id: riskanter-eingriff
    module: prozesse
    q: Ein Kollege schlägt bei einem unbekannten Prozess sofort kill -9 vor. Wie reagierst du?
    a: |
      Ich kläre Eigentümer, Funktion und Auswirkungen des Prozesses und sichere nötige Diagnoseinformationen. Wenn ein Stop nötig ist, nutze ich möglichst den vorgesehenen Dienstablauf und ein geordnetes Signal. Ein gewaltsamer Abbruch braucht einen konkreten Grund und eine anschließende Daten- und Funktionsprüfung.
    tags: [zusammenarbeit, incident]
    level: 2
  - id: eigener-fehler
    q: Deine Konfigurationsänderung hat einen Ausfall ausgelöst. Wie gehst du damit um?
    a: |
      Ich benenne die Änderung transparent, begrenze Auswirkungen und nutze den vorbereiteten Rückweg, falls er zur Situation passt. Anschließend prüfe ich den ursprünglichen Nutzerpfad. Im Postmortem dokumentiere ich technische Ursache und fehlende Prüfschritte, ohne Verantwortung durch vage Formulierungen zu verdecken.
    tags: [zusammenarbeit, incident]
    level: 3
  - id: uebergabe
    q: Was gehört in eine technische Übergabe vor einem Bereitschaftswechsel?
    a: |
      Aktueller Zustand, betroffene Dienste, Zeitfenster, bereits ausgeführte Änderungen, relevante bereinigte Logs und offene Hypothesen. Ich nenne einen sicheren nächsten Schritt und vorhandene Rückwege. Alte Pläne markiere ich als Pläne, damit niemand sie für erledigte Maßnahmen hält.
    tags: [zusammenarbeit, betrieb]
    level: 2
  - id: postmortem
    module: troubleshooting
    q: Woran erkennst du ein hilfreiches Postmortem?
    a: |
      Es trennt belegte Ereignisse, Ursache und offene Unsicherheit. Folgemaßnahmen passen zum konkreten Fehler, besitzen überprüfbare Ergebnisse und vermeiden pauschale Schuldzuweisung. Eine neu hinzugefügte Prüfung sollte genau den zuvor durchgerutschten Fall erkennen.
    tags: [zusammenarbeit, incident]
    level: 3
  - id: wayland-vs-x11
    module: desktop-wayland
    q: Was unterscheidet Wayland von X11, und warum fragt der Desktop unter Wayland bei der Bildschirmfreigabe nach?
    a: |
      Unter X11 verwaltet ein zentraler X-Server Bildschirm und Eingaben; Fenstermanager und Compositor sind eigene Clients, und jeder Client kann den Bildschirm lesen und Tastendrücke anderer Fenster mitlesen. Wayland ist ein Protokoll: Der Compositor (KWin, Mutter, Hyprland) ist zugleich Display-Server und Fenstermanager, Clients rendern selbst in Puffer, Eingaben gehen nur an das fokussierte Fenster. Weil kein Programm fremde Fenster sieht, läuft Bildschirmfreigabe über das ScreenCast-Portal: Der Benutzer wählt die Quelle, das Bild kommt als PipeWire-Strom. Alte Programme laufen über XWayland.
    tags: [desktop, wayland]
    level: 2
  - id: polkit-ablauf
    module: desktop-wayland
    q: Ein normaler Benutzer ruft `systemctl restart app.service` auf. Was passiert bis zum Neustart oder bis „Interactive authentication required“?
    a: |
      systemctl schickt den Auftrag per D-Bus an systemd. systemd fragt polkitd, ob der Aufrufer die Aktion `org.freedesktop.systemd1.manage-units` mit `unit=app.service` und `verb=restart` ausführen darf. polkitd wertet die JavaScript-Regeln in `/etc/polkit-1/rules.d` und `/usr/share/polkit-1/rules.d` in Namensreihenfolge aus, die erste mit Ergebnis gewinnt, sonst gilt die Voreinstellung der Aktion (`auth_admin`). Verlangt das eine Authentisierung und läuft kein Agent, etwa in einem Skript, kommt „Interactive authentication required“. Fehler in Regeln stehen nur in `journalctl -u polkit`.
    tags: [polkit, systemd, dbus]
    level: 2
  - id: udev-regel-nach-boot
    module: desktop-wayland
    q: Deine udev-Regel wirkt nach `udevadm trigger`, aber nach dem Neustart hat das Gerät wieder die falsche Gruppe. Woran liegt das?
    a: |
      udev arbeitet alle Regeldateien gemeinsam in Namensreihenfolge ab, spätere Zuweisungen überschreiben frühere. Eine Regel `10-…` verliert gegen `50-udev-default.rules`, die für ttys `GROUP="dialout"` setzt, allerdings nur bei der Aktion `add`. `udevadm trigger` schickt ohne Option `change`, der Boot `add`. Ich benenne die Regel um (`70-…`) oder setze den Wert mit `:=` endgültig und teste mit `udevadm test --action=add` oder `udevadm trigger --action=add`.
    tags: [udev, geräte]
    level: 2
  - id: geraet-ohne-treiber
    module: desktop-wayland
    q: Ein Gerät taucht in `lspci` auf, funktioniert aber nicht. Wie gehst du vor?
    a: |
      Zuerst `lspci -k`: Fehlt „Kernel driver in use“, ist kein Treiber gebunden. Die `modalias` unter `/sys/bus/pci/devices/…/modalias` zeigt, wonach udev sucht; `modprobe --resolve-alias` sagt, ob ein installiertes Modul passt. Dann `journalctl -k -b` nach Fehlern wie fehlender Firmware. Ursachen sind meist ein zu alter Kernel, ein fehlendes Treiber- oder Firmware-Paket oder ein Treiber auf der Blacklist. Bei Grafik fehlt dann auch `/dev/dri`, und kein Wayland-Compositor startet.
    tags: [treiber, hardware]
    level: 2
  - id: pipewire-wireplumber
    module: desktop-wayland
    q: Welche Rollen haben PipeWire und WirePlumber, und wie startest du sie neu, wenn der Ton weg ist?
    a: |
      PipeWire transportiert Audio- und Videoströme und ersetzt über `pipewire-pulse` und `pipewire-jack` PulseAudio und JACK. WirePlumber ist der Session-Manager: Er verbindet Ströme mit Geräten, wählt Standardgeräte und vergibt Rechte, etwa für Kamera oder Bildschirmfreigabe. Beide sind User-Units, also `systemctl --user restart pipewire pipewire-pulse wireplumber`, ohne sudo. Zeigt `wpctl status` nur „Dummy Output“, prüfe ich den Treiber und `journalctl --user -u wireplumber`.
    tags: [pipewire, audio]
    level: 2
  - id: iostat-util
    module: troubleshooting
    q: "`iostat -x` zeigt für eine NVMe-SSD 99 % `%util`. Ist sie überlastet?"
    a: |
      Nicht unbedingt. `%util` misst nur den Anteil der Zeit, in der mindestens eine Anfrage unterwegs war. Eine NVMe-SSD bearbeitet viele Anfragen parallel und hat bei 100 % oft noch Reserven. Ich schaue auf `r_await`/`w_await` und `aqu-sz`: Steigen Wartezeit und Warteschlange bei gleichem Durchsatz, staut es sich. Bei einer einzelnen Festplatte heißt 100 % dagegen wirklich voll.
    tags: [performance, troubleshooting]
    level: 3
  - id: psi-some-full
    module: troubleshooting
    q: Was bedeuten `some` und `full` in `/proc/pressure/memory`?
    a: |
      `some` ist der Anteil der Zeit, in der mindestens eine Aufgabe auf Speicher wartete; andere konnten weiterarbeiten. `full` ist der Anteil, in dem alle nicht untätigen Aufgaben gleichzeitig warteten, die Maschine also nichts Nützliches tat. `avg10`, `avg60` und `avg300` sind gleitende Mittel, `total` die Summe in Mikrosekunden. Dieselben Dateien gibt es je cgroup, etwa `memory.pressure` eines Dienstes.
    tags: [performance, troubleshooting]
    level: 3
  - id: speicherdruck-ohne-swap
    module: troubleshooting
    q: Ein Server ohne Swap zeigt hohes `wa` und hohe `bi`, aber kaum Schreiblast. Woran denkst du?
    a: |
      An Speicherdruck. Ohne Swap verdrängt der Kernel Dateiseiten, auch Programmcode, und liest sie kurz darauf wieder ein. Das erzeugt Lese-I/O und `wa`, obwohl die Platte nicht die Ursache ist. Ich prüfe `available` in `free`, PSI für `memory` und `io` und suche den Verbraucher mit `ps --sort=-rss` oder `pidstat -r 1`.
    tags: [performance, speicher]
    level: 3
  - id: stilles-programm
    module: troubleshooting
    q: Ein Dienst endet mit Exit-Code 1, ohne Meldung im Journal. Wie gehst du vor?
    a: |
      Ich starte dasselbe Kommando als Dienstbenutzer unter strace: `sudo -u dienst strace -f -e trace=file,network …`. `-f` brauche ich, weil Skripte viel in Kindprozessen erledigen. Dann lese ich von unten: Die letzten `ENOENT`- oder `EACCES`-Zeilen vor dem Exit sind die Kandidaten, frühere `ENOENT` oft nur optionale Suchorte. Als root zu testen verdeckt Rechteprobleme.
    tags: [troubleshooting, strace]
    level: 2
  - id: strace-oder-perf
    module: troubleshooting
    q: Ein Prozess steht bei 100 % CPU. Nimmst du strace oder perf?
    a: |
      Das entscheidet `pidstat -u 1`. Viel `%system` heißt Systemaufrufe: `strace -c -p PID` zeigt, welche. Viel `%usr` heißt, er rechnet selbst: `perf top -p PID` oder `perf record -g` zeigt die Funktionen. strace hält den Prozess bei jedem Aufruf an und bremst stark; perf nimmt nur Stichproben und kostet wenig.
    tags: [performance, troubleshooting]
    level: 3
  - id: cpuquota-nice
    module: troubleshooting
    q: Ein Hintergrundjob soll höchstens 20 % einer CPU bekommen. Warum reicht `Nice=19` nicht?
    a: |
      Nice und `CPUWeight=` verteilen CPU-Zeit nur, wenn mehrere Aufgaben konkurrieren. Ist die CPU sonst frei, bekommt der Job weiter 100 %. Eine harte Obergrenze setzt `CPUQuota=20%`; systemd schreibt dann `cpu.max` der cgroup. `systemctl set-property UNIT CPUQuota=20%` wirkt sofort und dauerhaft.
    tags: [systemd, performance]
    level: 2
  - id: lvextend-df
    module: speicher-dateisysteme
    q: Ein Logical Volume wurde vergrößert, aber df zeigt die alte Größe. Warum, und was tust du?
    a: |
      `lvextend` vergrößert nur das Blockgerät, das Dateisystem darauf hat seine Größe beim Anlegen festgelegt. Ich vergrößere es online mit `resize2fs` (ext4) beziehungsweise `xfs_growfs MOUNTPUNKT` (XFS) oder nehme gleich `lvextend -r`. Hat die Volume Group keinen Platz, kommt vorher eine neue Platte mit `pvcreate` und `vgextend` dazu. Nachweis ist `df -h` auf dem Mountpunkt.
    tags: [speicher, lvm]
    level: 2
  - id: fsck-manuell
    module: speicher-dateisysteme
    q: Beim Booten meldet systemd-fsck „UNEXPECTED INCONSISTENCY; RUN fsck MANUALLY“. Wie gehst du vor?
    a: |
      Der Preen-Modus hat einen Fehler gefunden, den er nicht ohne Rückfrage beheben darf. Ich prüfe mit dmesg, ob die Hardware Lesefehler meldet; dann sichere ich zuerst. Sonst lasse ich `e2fsck -f` auf dem ausgehängten Gerät laufen, mit `-n` zum Ansehen oder `-y` zum Reparieren, und kontrolliere danach `lost+found`. Ein eingehängtes Dateisystem repariere ich nie.
    tags: [speicher, boot, troubleshooting]
    level: 2
  - id: luks-keyslots
    module: speicher-dateisysteme
    q: Wie wechselst du bei LUKS eine Passphrase, ohne die Daten neu zu verschlüsseln?
    a: |
      Die Daten sind mit dem Volume Key verschlüsselt. Der liegt im Header mehrfach, je Keyslot einmal mit einer Passphrase oder einem Keyfile verschlüsselt. Mit `cryptsetup luksAddKey` lege ich einen neuen Keyslot an, teste ihn und entferne den alten mit `luksRemoveKey` oder `luksKillSlot`. Den Header sichere ich mit `luksHeaderBackup`, denn ohne ihn sind die Daten verloren.
    tags: [speicher, sicherheit, luks]
    level: 2
  - id: smart-passed
    module: speicher-dateisysteme
    q: smartctl meldet PASSED. Ist die Platte in Ordnung?
    a: |
      Nicht unbedingt. PASSED heißt nur, dass kein normierter Wert seine Herstellerschwelle erreicht hat. Ich schaue auf die Rohwerte von 5 (ersetzte Sektoren), 187, 197 und 198; steigen sie, verliert die Platte Daten, und ich plane den Tausch. 199 deutet eher auf Kabel. Bei NVMe sind Critical Warning, Available Spare und Media and Data Integrity Errors die Werte, die zählen.
    tags: [speicher, hardware]
    level: 2
  - id: io-fehler-vorgehen
    module: speicher-dateisysteme
    q: dmesg zeigt I/O-Fehler einer Datenplatte. Was tust du zuerst, was auf keinen Fall?
    a: |
      Zuerst sichere ich die noch lesbaren Daten, notfalls als Abbild mit ddrescue, und prüfe SMART. Keine Reparaturläufe mit `e2fsck -y` auf der ausfallenden Platte, denn jeder Zugriff kann weitere Sektoren kosten und fsck verwirft womöglich Rettbares. Repariert wird die Kopie, die Platte wird getauscht.
    tags: [speicher, troubleshooting]
    level: 3
  - id: docker-limits-kernel
    module: container
    q: Was passiert im Kernel bei `docker run --memory=512m --cpus=1`?
    a: |
      Docker legt für den Container eine eigene cgroup an und schreibt die Grenzen in deren Dateien: `memory.max` wird 536870912, `cpu.max` wird `100000 100000`. Überschreitet die Gruppe die Speichergrenze, beendet der OOM-Killer einen Prozess darin, nicht auf dem ganzen Host. systemd setzt mit `MemoryMax=` und `CPUQuota=` dieselben Dateien für Dienste.
    tags: [container, cgroups]
    level: 2
  - id: pid-eins-container
    module: container
    q: Warum ignoriert der Hauptprozess eines Containers manchmal `docker stop`?
    a: |
      Er ist PID 1 in seinem PID-Namespace. Signale ohne eigenen Handler, etwa SIGTERM, stellt der Kernel dem Init-Prozess eines Namespace nicht zu, auch nicht von außen. `docker stop` wartet dann die Frist ab und schickt SIGKILL. Abhilfe: Die Anwendung behandelt SIGTERM selbst, oder ein kleines Init (`docker run --init`) leitet Signale weiter und räumt Zombies auf.
    tags: [container, prozesse]
    level: 3
  - id: exit-137
    module: container
    q: Ein Container endet mit Exit-Code 137. Was prüfst du?
    a: |
      137 ist 128 plus 9, der Prozess wurde mit SIGKILL beendet. Häufigste Ursache ist der OOM-Killer der cgroup: `docker inspect` zeigt `OOMKilled`, im Kernel-Log steht „Memory cgroup out of memory“, und `memory.events` zählt `oom_kill`. Dann vergleiche ich echten Bedarf mit `--memory`, statt die Grenze blind zu erhöhen. Ein `docker kill` oder ein abgelaufener Stop-Timeout führen ebenfalls zu 137.
    tags: [container, troubleshooting]
    level: 2
  - id: chroot-container
    module: container
    q: Ist chroot dasselbe wie ein Container?
    a: |
      Nein. chroot ändert nur das Wurzelverzeichnis eines Prozesses. Ein Container kombiniert ein eigenes Wurzeldateisystem (meist overlayfs und pivot_root) mit Namespaces für Prozesse, Netz, Mounts und Hostnamen, mit cgroups für Ressourcen, mit reduzierten Capabilities und einem seccomp-Filter. chroot allein ist keine Sicherheitsgrenze, root kann daraus ausbrechen.
    tags: [container, sicherheit]
    level: 2
  - id: pipefail
    module: textverarbeitung
    q: Ein Cronjob mit `grep ERROR app.log | wc -l` meldet „0“ und Exit-Code 0, obwohl `app.log` fehlt. Warum, und wie verhinderst du das?
    a: |
      Eine Bash-Pipeline meldet nur den Status ihres letzten Kommandos, hier `wc`. Mit `set -o pipefail` zählt der Status des letzten Kommandos, das nicht mit 0 endete, also die 2 von `grep`. Dann muss ich „keine Treffer“ (Status 1) und früh schließende Leser wie `head` (SIGPIPE, 141) bewusst behandeln, etwa mit `{ grep … || [ $? -eq 1 ]; }`. `PIPESTATUS` zeigt alle Einzelstatus.
    tags: [shell, fehlerbehandlung]
    level: 2
  - id: datei-selbst-ueberschreiben
    module: textverarbeitung
    q: Warum ist nach `sort daten.txt > daten.txt` die Datei leer, und wie ersetzt man eine Datei sicher?
    a: |
      Die Shell öffnet und leert das Ziel von `>`, bevor `sort` startet; `sort` liest dann eine leere Datei. Sicher ist: in eine temporäre Datei im selben Verzeichnis schreiben (`mktemp`), nur bei Erfolg mit `mv` ersetzen. `mv` im selben Dateisystem ist ein atomares `rename()`. Rechte übernehme ich mit `chmod --reference`, weil `mktemp` 600 anlegt.
    tags: [shell, umleitung]
    level: 2
  - id: logfeld-statt-muster
    module: textverarbeitung
    q: Ein Kollege zählt 5xx-Antworten im nginx-Log mit `grep -c ' 50'`. Was sagst du im Review?
    a: |
      Das Muster trifft irgendeine Stelle der Zeile, etwa eine Antwortgröße von 5021 Bytes, und `' 5[0-9][0-9] '` trifft 512 Bytes. Ich werte das Feld aus: im Format combined ist der Status Feld 9, also `awk '$9 >= 500 && $9 <= 599'`. Und ich prüfe die Summe gegen eine unabhängige Zahl, etwa das Dashboard.
    tags: [textverarbeitung, review]
    level: 2
  - id: sudoers-dropin
    module: rechte-benutzer
    q: Du legst `/etc/sudoers.d/deploy.conf` an, aber sudo ignoriert die Regel. Warum, und wie spielst du eine Regel sicher ein?
    a: |
      `@includedir` liest keine Dateien mit Punkt im Namen oder `~` am Ende. Ich schreibe den Entwurf in eine eigene Datei, prüfe ihn mit `sudo visudo -cf`, lege ihn mit `sudo install -m 0440 -o root -g root` als `/etc/sudoers.d/deploy` ab und kontrolliere mit `sudo -l -U deploy`. Befehle stehen mit vollem Pfad und genauen Argumenten; `*` deckt in sudoers auch weitere Argumente ab.
    tags: [sudo, sicherheit]
    level: 2
  - id: port-80-ohne-root
    module: rechte-benutzer
    q: Ein Dienst soll als Nicht-root auf Port 80 lauschen. Welche Möglichkeiten gibt es, und welche ist die engste?
    a: |
      Ports unter 1024 brauchen `CAP_NET_BIND_SERVICE`. Am engsten ist systemd: `User=web`, `AmbientCapabilities=CAP_NET_BIND_SERVICE`, dazu `CapabilityBoundingSet=` und `NoNewPrivileges=yes`. `setcap` auf das Programm wirkt für jeden Aufrufer, `net.ipv4.ip_unprivileged_port_start` für das ganze System.
    tags: [capabilities, systemd, sicherheit]
    level: 3
  - id: teamordner-default-acl
    module: rechte-benutzer
    q: Wie richtest du einen Teamordner ein, in dem neue Dateien automatisch der Teamgruppe gehören und für alle Mitglieder schreibbar sind?
    a: |
      Gruppe und Rechte des Bestands setzen (`chgrp -R team`, `chmod -R g+rwX,o-rwx`), setgid an allen Verzeichnissen für die Gruppenvererbung, eine Default-ACL (`setfacl -d -m g::rwx,o::---`) für die Rechte neuer Einträge, weil sie die umask ersetzt. setgid allein reicht nicht: Mit umask 022 entstehen Dateien mit 644.
    tags: [acl, rechte]
    level: 2
  - id: port-belegt
    module: prozesse
    q: Ein Dienst startet nicht, im Journal steht „Address already in use“. Wie gehst du vor?
    a: |
      Ich finde den Prozess auf dem Port mit `sudo ss -ltnp 'sport = :8080'` (ohne sudo fehlen fremde Prozesse) oder `sudo fuser -v 8080/tcp`. Vor dem Beenden kläre ich, wer ihn gestartet hat: `ps -o pid,ppid,user,unit,cmd -p <pid>` zeigt, ob er zu einem Dienst gehört oder in einer Sitzung von Hand lief, und ob ein Elternprozess ihn neu startet. Dann beende ich erst die Quelle, dann den Prozess, beides mit SIGTERM, und starte den Dienst. `fuser -k` vermeide ich, weil es ohne Angabe SIGKILL schickt.
    tags: [prozesse, netzwerk, diagnose]
    level: 2
  - id: signal-ignoriert-geerbt
    module: prozesse
    q: Ein Dienst reagiert nicht auf SIGTERM, obwohl das Programm einen Handler dafür hat. Woran kann das liegen?
    a: |
      Ignorierte Signale werden bei `fork` vererbt und bleiben über `execve` ignoriert; nur abgefangene Signale setzt der Kernel zurück. Ein Startskript mit `trap '' TERM` oder ein Aufruf über `nohup` (für SIGHUP) macht das Programm also taub, und eine nicht interaktive Bash kann ein beim Start ignoriertes Signal nicht mehr abfangen. Ich prüfe `SigIgn` und `SigCgt` in `/proc/<pid>/status`: Steht Bit `0x4000` in `SigIgn`, wird TERM ignoriert.
    tags: [signale, systemd, diagnose]
    level: 3
  - id: proc-status-lesen
    module: prozesse
    q: Was liest du aus /proc/<pid>/ heraus, wenn ein Prozess sich seltsam verhält?
    a: |
      `status` liefert Zustand, PPid, Threads, VmRSS und die Signalmasken, `cmdline` die echten Argumente, `fd/` alle offenen Dateien und Sockets (auch gelöschte Logs, die noch Platz belegen), `cwd` und `exe` Arbeitsverzeichnis und Programm. `ps` und `top` lesen dieselben Dateien, nur gefiltert.
    tags: [prozesse, proc]
    level: 2
  - id: status-203-exec
    module: systemd-logs
    q: Was bedeutet `status=203/EXEC`, und welche Ursachen prüfst du?
    a: |
      systemd hat den Prozess angelegt, aber `execve` auf das Programm aus `ExecStart=` ist gescheitert; die Anwendung lief nie. Die Journalzeile davor nennt den Grund: Datei fehlt, Ausführungsrecht fehlt (`Permission denied`), oder der Interpreter aus der `#!`-Zeile fehlt, typisch bei Windows-Zeilenenden (`/bin/sh\r`), dann heißt es „No such file or directory“, obwohl die Datei da ist. Ich prüfe mit `ls -l`, `file` und `head -n1 | od -c`, repariere und setze mit `systemctl reset-failed` das Startlimit zurück.
    tags: [systemd, diagnose]
    level: 2
  - id: timer-laeuft-nie
    module: systemd-logs
    q: Ein systemd-Timer ist aktiviert, löst aber nie aus. Wie gehst du vor?
    a: |
      `systemctl list-timers --all` zeigt, ob er einen nächsten Termin hat. `systemctl status x.timer` verrät `bad-setting` (etwa eine ungültige `OnCalendar=`-Angabe, die `systemd-analyze calendar` bestätigt) und unter `Triggers:` die Unit, die er startet; fehlt die, verweigert der Timer den Start. Nach der Korrektur `daemon-reload`, Timer starten, und den Service einmal mit `systemctl start` von Hand auslösen.
    tags: [systemd, timer, diagnose]
    level: 2
  - id: journal-prioritaet
    module: systemd-logs
    q: Warum findet `journalctl -p err` die ERROR-Zeilen deiner Anwendung nicht?
    a: |
      Was ein Dienst auf stdout oder stderr schreibt, speichert journald standardmäßig mit Priorität `info`, egal was im Text steht. `-p` filtert nach diesem Feld. Für Textsuche nutze ich `journalctl -u app -g ERROR`; damit die Priorität stimmt, loggt die App über syslog/journald-APIs, mit `<3>`-Präfix (`SyslogLevelPrefix=`) oder aus Skripten mit `logger -p` bzw. `systemd-cat -p`.
    tags: [journal, logging]
    level: 2
  - id: rescue-vs-emergency
    module: boot-recovery
    q: Was unterscheidet Rescue-Modus, Emergency-Modus und init=/bin/bash?
    a: |
      Rescue und Emergency sind systemd-Targets mit root-Shell und ohne Dienste. `rescue.target` hängt über `sysinit.target` alle Dateisysteme aus der fstab ein, `emergency.target` nur `/`, oft nur lesbar. Beide verlangen über `sulogin` das root-Passwort. Bei `init=/bin/bash` startet der Kernel eine Shell statt systemd als PID 1, ohne Anmeldung. Das ist der Weg bei vergessenem root-Passwort.
    tags: [boot, systemd]
    level: 2
  - id: emergency-nach-fstab
    module: boot-recovery
    q: Ein Server landet nach einem Neustart im Emergency-Modus. Wie gehst du vor?
    a: |
      Enter oder root-Passwort, dann `systemctl --failed` und `journalctl -xb -p err`. Meist scheitert ein Mount aus der fstab: falscher Typ, Tippfehler in den Optionen, ein Gerät, das nicht erscheint. Ohne `nofail` verlangt `local-fs.target` diesen Mount, und `OnFailure=` startet den Emergency-Modus. Ich repariere die Zeile, prüfe mit `findmnt --verify`, führe `systemctl daemon-reload` aus und starte mit `systemctl default` weiter.
    tags: [boot, fstab, troubleshooting]
    level: 2
  - id: kernelzeile-dauerhaft
    module: boot-recovery
    q: Wie änderst du die Kernel-Kommandozeile auf Debian dauerhaft, und was ist der Unterschied zwischen GRUB_CMDLINE_LINUX und GRUB_CMDLINE_LINUX_DEFAULT?
    a: |
      In `/etc/default/grub` oder einem Drop-in unter `/etc/default/grub.d/`, danach `sudo update-grub`. `grub.cfg` ändere ich nie von Hand, das nächste Kernel-Update überschreibt sie. `GRUB_CMDLINE_LINUX` gilt für alle Einträge, auch für Recovery. `GRUB_CMDLINE_LINUX_DEFAULT` gilt nur für die normalen Einträge. Startnotwendiges gehört in die erste Variable, Kosmetik und Experimente in die zweite. Zum einmaligen Testen ändere ich die Zeile im GRUB-Menü mit `e`.
    tags: [boot, grub]
    level: 2
  - id: treiber-ins-initramfs
    module: boot-recovery
    q: Nach einem Hardwarewechsel bleibt der Start bei „(initramfs)“ stehen. Was ist los und wie behebst du es dauerhaft?
    a: |
      Das initramfs findet das Root-Dateisystem nicht, meist weil der Treiber für den neuen Controller fehlt oder `root=` nicht mehr stimmt. Kurzfristig helfen ein älterer Kernel oder ein Fallback-Image ohne `autodetect`. Dauerhaft trage ich den Treiber in die Liste des initramfs-Werkzeugs ein (`/etc/initramfs-tools/modules`, `MODULES=()` in `mkinitcpio.conf`, `add_drivers+=` bei dracut), baue neu und kontrolliere mit `lsinitramfs`. `/etc/modules` hilft nicht, die Liste wird erst nach dem Wechsel auf das Root-Dateisystem gelesen.
    tags: [boot, initramfs]
    level: 3
  - id: chroot-reparatur
    module: boot-recovery
    q: Wie reparierst du ein System, das gar nicht mehr startet?
    a: |
      Live-System booten, mit `lsblk -f` Root, `/boot` und ESP finden, gegebenenfalls LUKS öffnen und LVM aktivieren. Root nach `/mnt` einhängen, `/boot` bzw. die ESP darunter, dann `/dev`, `/proc`, `/sys` und `/run` per `mount --rbind` durchreichen und mit `chroot /mnt` hinein (auf Arch `arch-chroot`). Dort reparieren: `dpkg --configure -a`, initramfs neu bauen, `update-grub`, bei Bedarf `grub-install`. Danach `exit`, `umount -R /mnt`, neu starten.
    tags: [boot, chroot]
    level: 3
  - id: dns-fehlerklassen
    module: netzwerk-ssh
    q: Was unterscheidet NXDOMAIN, SERVFAIL und „Temporary failure in name resolution“?
    a: |
      NXDOMAIN ist eine verbindliche Antwort: Der zuständige Server sagt, dass es den Namen nicht gibt; Programme melden „Name or service not known“. SERVFAIL heißt, der Resolver konnte keine Antwort beschaffen, etwa weil der zuständige Server tot ist oder DNSSEC scheitert. Zusammen mit REFUSED und einem nicht erreichbaren Nameserver erscheint das in Programmen als „Temporary failure in name resolution“. Welcher Fall vorliegt, zeigt mir der Status in `dig`.
    tags: [netzwerk, dns]
    level: 2
  - id: ssh-publickey-abgelehnt
    module: netzwerk-ssh
    q: Ein Deploy bricht mit „Permission denied (publickey)“ ab. Wie gehst du vor?
    a: |
      Auf dem Client zeigt `ssh -v`, welcher Schlüssel angeboten wird und ob der Server ihn akzeptiert. Den Grund der Ablehnung lese ich auf dem Server mit `journalctl -u ssh` (bzw. `-u sshd`): typisch sind StrictModes-Meldungen wegen zu offener Rechte auf `authorized_keys`, `~/.ssh` oder dem Home, oder AllowUsers. Schweigt das Journal, vergleiche ich Fingerabdrücke mit `ssh-keygen -lf`, denn dann steht der Schlüssel meist nicht in `authorized_keys`.
    tags: [ssh, fehlersuche]
    level: 2
  - id: netz-dauerhaft
    module: netzwerk-ssh
    q: Du hast mit `ip addr add` eine Adresse gesetzt, nach dem Reboot ist sie weg. Warum, und wie machst du es richtig?
    a: |
      `ip` ändert nur den laufenden Kernel. Dauerhaft konfiguriert ein Netzwerkdienst: auf Desktops NetworkManager (`nmcli connection modify …`, dann `up`), auf Servern systemd-networkd mit `.network`-Dateien oder unter Debian ifupdown mit `/etc/network/interfaces`. Pro Schnittstelle darf nur einer zuständig sein, sonst überschreiben sie sich.
    tags: [netzwerk]
    level: 2
  - id: tcpdump-einsatz
    module: netzwerk-ssh
    q: Wann greifst du zu tcpdump, und worauf achtest du dabei?
    a: |
      Wenn Logs nicht zeigen, was wirklich über die Leitung geht, etwa welchen DNS-Server ein Programm fragt oder ob ein TCP-Handshake zustande kommt. Ich filtere eng (`-i`, `host`, `port`), nutze `-n`, damit tcpdump keine eigenen DNS-Anfragen erzeugt, begrenze mit `-c` oder `timeout` und behandle `.pcap`-Dateien als vertraulich.
    tags: [netzwerk, fehlersuche]
    level: 2
  - id: sshd-dropin-reihenfolge
    module: sicherheit-haertung
    q: Du setzt `PasswordAuthentication no` in einem Drop-in, aber Passwort-Logins gehen weiter. Woran kann das liegen?
    a: |
      sshd übernimmt für jede Option den ersten gelesenen Wert. Debian und Ubuntu binden `sshd_config.d/*.conf` alphabetisch ganz oben ein; ein früheres Drop-in wie `50-cloud-init.conf` mit `yes` gewinnt gegen mein `99-…`. Außerdem wirkt eine Änderung erst nach `reload`. Ich prüfe mit `sshd -T` und mit einer echten Anmeldung mit `-o PubkeyAuthentication=no`.
    tags: [sicherheit, ssh]
    level: 3
  - id: systemd-sandbox
    module: sicherheit-haertung
    q: Wie sperrst du einen Dienst mit systemd ein, ohne ihn kaputtzumachen?
    a: |
      Per Drop-in schrittweise: eigener Benutzer (`DynamicUser=` oder `User=`), `ProtectSystem=strict` mit gezielter Ausnahme (`StateDirectory=` oder `ReadWritePaths=`), Capabilities auf das Nötige begrenzen (z. B. nur `CAP_NET_BIND_SERVICE` für Port 80), dazu `PrivateDevices`, `ProtectHome` und `ProtectKernel*`. Nach jeder Änderung `daemon-reload`, `restart`, Journal und echter Abruf. `systemd-analyze security` bewertet die Maßnahmen, nicht die Funktion.
    tags: [sicherheit, systemd]
    level: 3
  - id: dpkg-halb-konfiguriert
    module: paketverwaltung
    q: "Jedes `apt install` endet mit `E: Sub-process /usr/bin/dpkg returned an error code (1)`. Wie gehst du vor?"
    a: |
      Meist hängt ein Paket halb konfiguriert, weil sein `postinst` gescheitert ist. `sudo dpkg --audit` nennt das Paket, `sudo dpkg --configure -a` wiederholt die Konfiguration und zeigt die Fehlermeldung, das Skript liegt unter `/var/lib/dpkg/info/`. Ich behebe die Ursache, etwa einen fehlenden Benutzer, und konfiguriere dann erneut. Zeilen aus dem Skript zu löschen macht dpkg still, aber nicht das System heil.
    tags: [pakete, troubleshooting]
    level: 2
  - id: no-pubkey
    module: paketverwaltung
    q: "`apt update` meldet `NO_PUBKEY`. Was prüfst du?"
    a: |
      Ob die Schlüsseldatei existiert, ob `Signed-By` in der `.sources`-Datei genau auf sie zeigt und ob das Format zur Endung passt: Text in `.asc`, Binärformat in `.gpg`. Den Schlüssel lege ich nach `/etc/apt/keyrings` und binde ihn nur an dieses Repository, nie global mit `apt-key`. Bei einem schon eingebundenen Repository achte ich auf Warnungen, denn dort endet `apt update` trotz Fehler mit 0.
    tags: [pakete, sicherheit]
    level: 2
  - id: shared-library-fehlt
    module: paketverwaltung
    q: Ein Programm meldet `error while loading shared libraries`. Was tust du?
    a: |
      `ldd programm` zeigt, welche Bibliothek `not found` ist. Gehört sie zur Distribution, fehlt ein Paket oder es gab ein Teil-Update. Bringt die Software sie selbst mit, prüfe ich Datei und SONAME-Link, trage das Verzeichnis unter `/etc/ld.so.conf.d` ein und rufe `ldconfig` auf. `LD_LIBRARY_PATH` nutze ich nur zum Testen, weil Dienste, cron und sudo es nicht sehen.
    tags: [pakete, troubleshooting]
    level: 2
  - id: downgrade-festhalten
    module: paketverwaltung
    q: Ein Update hat einen Dienst kaputt gemacht. Wie gehst du vor?
    a: |
      `apt-cache policy` zeigt verfügbare Versionen. Ich installiere die alte mit `apt install paket=version --allow-downgrades` oder aus `/var/cache/apt/archives` und halte sie mit `apt-mark hold` oder einem Pin fest. Den Hold dokumentiere ich und hebe ihn auf, sobald der Fix da ist. Auf Arch: `pacman -U` aus dem Cache oder Archive, dann vorübergehend `IgnorePkg`.
    tags: [pakete, betrieb]
    level: 2
  - id: umgebung-cron-systemd
    module: bash-scripting
    q: Ein Skript läuft von Hand, aber nicht als Cronjob oder systemd-Dienst. Woran liegt das meist?
    a: |
      An der Umgebung. cron startet `/bin/sh` mit `PATH=/usr/bin:/bin` und ohne Startdateien, systemd gibt Diensten einen eigenen PATH und `/` als Arbeitsverzeichnis, keiner liest `~/.bashrc`. Ich vergleiche `env` mit `systemd-run --wait --pipe -p User=… env`, setze PATH, Arbeitsverzeichnis und Variablen im Skript oder in der Unit und leite Cron-Ausgaben in ein Log.
    tags: [scripting, troubleshooting]
    level: 2
  - id: ssh-befehl-bashrc
    module: bash-scripting
    q: Warum fehlt bei `ssh host befehl` eine PATH-Ergänzung aus `~/.bashrc`, obwohl sie bei der Anmeldung da ist?
    a: |
      `ssh host befehl` startet eine nicht-interaktive `bash -c`. Debians Bash liest dabei zwar `~/.bashrc`, die Datei bricht aber mit `case $- in *i*) …` gleich am Anfang ab. Die Ergänzung muss vor diese Abfrage, oder das Programm kommt nach `/usr/local/bin` bzw. wird mit absolutem Pfad aufgerufen.
    tags: [scripting, ssh]
    level: 3
