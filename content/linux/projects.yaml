projects:
  - id: dotfiles-installer
    title: Dotfiles mit kontrollierter Installation
    level: 1
    hours: 5
    summary: Ein kleines Konfigurationsrepository mit Dry-run, Sicherung vorhandener Dateien und einem wiederholbaren Installer.
    brief: |
      Du richtest regelmäßig eine neue Entwicklungs-VM ein. Statt Dateien von Hand zu verteilen, baust du ein Repository für drei bewusst ausgewählte, unkritische Konfigurationen, etwa Git-Aliase, eine Editor-Konfiguration und eigene Shell-Aliase.

      Der Installer ist ein Bash-Skript. Er arbeitet standardmäßig als Dry-run und unterstützt ein ausdrücklich angegebenes Zielverzeichnis für Tests. Er darf vorhandene Dateien nicht still überschreiben, braucht kein sudo und liest keine Secrets aus dem Home-Verzeichnis. Deine interaktive Shell muss nicht gewechselt werden. Beschränke den Umfang auf die ausgewählten Pfade; ein vollständiges Desktop-Provisioning ist nicht Teil dieses Projekts.
    skills: [bash, quoting, symlinks, dateirechte, git, fehlerbehandlung]
    steps:
      - id: umfang
        title: Drei Konfigurationen auswählen
        detail: Notiere Quelle, Ziel und Zweck jeder Datei. Entferne echte E-Mail-Adressen, Tokens und gerätespezifische Geheimnisse aus den Beispieldaten.
      - id: zielvertrag
        title: Argumente und Zielwurzel definieren
        detail: Definiere Dry-run und ausdrückliche Anwendung. Alle Zielpfade werden relativ zu einer geprüften Zielwurzel gebildet; teste zuerst mit einem leeren temporären Verzeichnis.
      - id: sicherung
        title: Vorhandene Dateien schützen
        detail: Lege fest, wann ein Konflikt gemeldet oder eine eindeutig benannte Sicherung erstellt wird. Prüfe auch bestehende Symlinks und Pfade mit Leerzeichen.
      - id: installation
        title: Dateien verlinken oder kopieren
        detail: Nutze eine feste Positivliste der drei Pfade. Erhalte Argumentgrenzen mit Arrays und Quoting und melde jede tatsächliche Änderung.
      - id: wiederholung
        title: Wiederholung und Fehlerfälle prüfen
        detail: Ein zweiter Lauf soll keine neuen Änderungen brauchen. Teste Konflikt, fehlende Quelle, nicht beschreibbares Ziel und einen Zielpfad mit Leerzeichen in der isolierten Testumgebung.
      - id: dokumentation
        title: Nutzung und Rückbau dokumentieren
        detail: Zeige Dry-run, Anwendung, Sicherung und kontrollierten Rückbau. Das README muss erklären, welche Dateien das Skript verändert und welche Voraussetzungen es hat.
    acceptance:
      - Dry-run verändert keine Datei und zeigt den vollständigen Änderungsplan.
      - Der Installer braucht keine Root-Rechte und akzeptiert eine separate Test-Zielwurzel.
      - Ein zweiter Lauf ist ohne weitere Änderungen erfolgreich.
      - Vorhandene Dateien werden nicht still überschrieben.
      - bash -n und ShellCheck laufen erfolgreich; die dokumentierten Fehlerfälle sind getestet.
    stretch:
      - Ergänze einen prüfenden Statusmodus, der Abweichungen zwischen Repository und Ziel meldet.
      - Prüfe den Installer in CI ausschließlich gegen selbst erzeugte Testverzeichnisse.
    portfolio: |
      Zeige eine kurze Terminalaufnahme mit Dry-run, erstem Lauf, zweitem Lauf und einem Konflikt. Erkläre im Gespräch, weshalb du nur eine Positivliste installierst und warum Quoting allein keinen falschen Zielpfad verhindert. Das wertvollste Artefakt ist ein nachvollziehbarer Änderungsvertrag mit Tests, nicht die Anzahl gesammelter Dotfiles.
  - id: loganalyse-toolkit
    title: Ein Loganalyse-Toolkit mit Tagesbericht
    level: 2
    hours: 8
    summary: Ein Bash- und awk-Werkzeug erstellt aus dokumentierten Beispiel-Logs reproduzierbare Fehlerberichte und läuft in einer Test-VM per Timer.
    brief: |
      Ein kleines Entwicklungsteam möchte morgens wissen, welche Endpunkte am Vortag häufig fehlgeschlagen sind. Entwickle ein lokales Werkzeug, das ein bewusst einfaches Logformat mit Zeitstempel, Pfad und HTTP-Status verarbeitet.

      Definiere Zeitzone und Zeitfenster. Das Programm muss Fehlerzahlen pro Stunde sowie die häufigsten betroffenen Pfade ausgeben. Leere Logs sind ein gültiger Fall, ungültige Datensätze werden gezählt und gemeldet, Lesefehler dürfen nicht als null Fehler erscheinen. Nutze ausschließlich synthetische Daten. Ein systemd-Timer in deiner Test-VM schreibt einen Bericht in einen eigenen Datenordner; das Werkzeug sendet keine Nachrichten und braucht keinen öffentlichen Server.
    skills: [pipes, grep, awk, bash, systemd, timer, journalctl]
    steps:
      - id: datenvertrag
        title: Das Logformat festlegen
        detail: Beschreibe Felder, Trenner, Zeitformat und Zeitzone. Halte den Parser bewusst auf dieses Format begrenzt und benenne ungeeignete Formate wie frei gequotetes CSV.
      - id: fixtures
        title: Kleine Eingaben mit Sollwerten schreiben
        detail: Erzeuge mindestens zwei Stunden mit Erfolgen und Fehlern, doppelte Pfade, leere Eingabe und ungültige Zeilen. Notiere die erwarteten Berichte vor der Implementierung.
      - id: pipeline
        title: Filtern und aggregieren
        detail: Entwickle jede Pipeline-Stufe einzeln. Sortiere vor uniq, wenn globale Häufigkeiten entstehen sollen, und nutze numerische Sortierung für Anzahlen.
      - id: cli
        title: Einen klaren Skriptvertrag bauen
        detail: Definiere Aufruf, stdout, stderr und Exit-Status. Begrenze temporäre Dateien und veröffentliche einen Bericht erst nach erfolgreicher vollständiger Erzeugung.
      - id: timer
        title: Service und Timer in einer VM einrichten
        detail: Starte zuerst die Service-Unit manuell unter dem vorgesehenen Benutzer. Prüfe dann Kalenderausdruck, Journal und die Wirkung einer nachgeholten Ausführung.
      - id: abnahme
        title: Bericht und Fehlerpfade abnehmen
        detail: Vergleiche alle Fixtures mit Sollwerten. Simuliere einen nicht lesbaren Eingang und dokumentiere, wie man den fehlgeschlagenen Lauf im Journal findet.
    acceptance:
      - Die dokumentierten Beispielberichte stimmen exakt mit den Fixtures überein.
      - Leere Eingabe, ungültige Datensätze und Lesefehler werden unterscheidbar behandelt.
      - Dateien mit Leerzeichen im Namen funktionieren.
      - Der Timer startet einen nachgewiesen erfolgreichen Lauf unter einem begrenzten Benutzer.
      - README und Runbook enthalten einen Diagnoseweg für fehlende Tagesberichte.
    stretch:
      - Ergänze einen maschinenlesbaren JSON-Bericht mit einem dafür geeigneten Parser beziehungsweise Generator.
      - Vergleiche zwei Zeitfenster und erkläre den Unterschied zwischen absoluter Fehlerzahl und Fehlerrate.
    portfolio: |
      Präsentiere zuerst ein kleines Log und seinen erwarteten Bericht. Zeige anschließend den automatischen Lauf und einen bewusst provozierten Lesefehler samt Journalnachweis. Erkläre, welche Aussagen die Daten erlauben und welche du wegen des gewählten Formats oder Zeitfensters nicht triffst.
  - id: backup-mit-restore
    title: Ein Backup, das sich wiederherstellen lässt
    level: 2
    hours: 14
    summary: Ein versionierter Backupablauf mit Timer, begrenzten Rechten, Integritätsprüfung und dokumentierter Wiederherstellungsprobe.
    brief: |
      Eine kleine interne Anwendung speichert Konfiguration und Nutzdaten. Du sollst ihren Zustand auf einen unabhängigen Zielort sichern und einen ausgewählten Stand in eine neue Umgebung zurückbringen können.

      Verwende synthetische Anwendungsdaten und ein selbst kontrolliertes Restic- oder Borg-Repository. Lege Umfang, Sicherungsintervall, Aufbewahrung sowie Wiederherstellungsziel fest. Zugangsdaten gehören nicht ins Repository. Wenn eine Datenbank beteiligt ist, verwende ihr unterstütztes Dump- oder Backupverfahren und dokumentiere die Konsistenzgrenze. Ein bloßer rsync-Spiegel ist für diese Aufgabe ohne zusätzliche Versionierung nicht ausreichend.
    skills: [backups, restic, bash, systemd, rechte, speicher, troubleshooting]
    steps:
      - id: daten-inventar
        title: Daten und Ausfallszenario beschreiben
        detail: Liste nötige Daten, Konfiguration und nicht zu sichernde temporäre Dateien. Beschreibe, ob versehentliches Löschen, Hostverlust oder ein kaputter Release wiederhergestellt werden soll.
      - id: repository
        title: Getrennten Speicher und Schlüsselablage planen
        detail: Trenne Datenquelle und Backupziel sinnvoll. Dokumentiere, wie Schlüssel und Passwörter im Ernstfall verfügbar sind, ohne sie in README oder Shell-History zu schreiben.
      - id: erster-lauf
        title: Einen manuellen Backupstand erzeugen
        detail: Beginne mit wenigen bekannten Dateien. Prüfe Snapshotkennung, Zeit und enthaltene Pfade, bevor du den vollständigen synthetischen Bestand aufnimmst.
      - id: fehlervertrag
        title: Fehler und fehlende Mounts erkennen
        detail: Ein fehlendes Ziel, eine abgelaufene Anmeldung oder eine unlesbare Quelle muss einen sichtbaren Fehler erzeugen. Schreibe nicht versehentlich in das leere Mountverzeichnis der Systemplatte.
      - id: automatisierung
        title: Service, Timer und Aufbewahrung einrichten
        detail: Verwende ein begrenztes Konto und dokumentiere überlappende Läufe. Prüfe Aufbewahrungsregeln zuerst ohne Löschung beziehungsweise an entbehrlichen Testständen.
      - id: restore
        title: Ausgewählten Stand getrennt wiederherstellen
        detail: Nutze einen neuen Zielpfad, vergleiche Inhalte und nötige Metadaten und starte die fachliche Lesefunktion gegen diese Kopie. Notiere die gemessene Dauer.
      - id: runbook
        title: Ein vollständiges Wiederherstellungs-Runbook schreiben
        detail: Eine zweite Person muss anhand deiner Anleitung den gewählten Stand finden, den Schlüsselzugang herstellen, Daten zurückspielen und den Erfolg prüfen können.
    acceptance:
      - Mindestens zwei getrennte Versionen einer veränderten Testdatei sind wiederherstellbar.
      - Quelle und Sicherung liegen nicht ausschließlich im selben ausfallgefährdeten Speicherbereich.
      - Ein fehlendes Ziel und ein Lesefehler werden sichtbar erfolglos behandelt.
      - Ein Integritätscheck und ein konkreter Restore sind dokumentiert.
      - Die Anwendung kann aus dem wiederhergestellten Stand eine fachliche Aufgabe erfüllen.
      - Schlüssel, Wiederanlaufreihenfolge und benötigte Metadaten sind im Runbook beschrieben, ohne Secrets offenzulegen.
    stretch:
      - Führe den Restore in einer frischen VM statt nur in einem neuen Verzeichnis aus.
      - Ergänze eine Prüfung auf ausbleibende erfolgreiche Backups, ohne jedes Mal identische Alarme zu erzeugen.
    portfolio: |
      Zeige eine Tabelle mit Ausgangsdaten, zwei Backupständen und dem nachgewiesenen Restore. Erkläre den Unterschied zwischen einem grünen Backup-Exit-Code, einem Repositorycheck und einer funktionierenden wiederhergestellten Anwendung. Lege Messdauer und offene Grenzen offen.
  - id: server-produktionsreif
    title: Einen Server produktionsreif aufsetzen
    capstone: true
    level: 3
    hours: 40
    summary: Eine realistische Betriebsübergabe für eine kleine Web-App mit SSH, TLS, Diensthärtung, Backups, Monitoring und getesteter Wiederherstellung.
    brief: |
      **Auftrag:** Ein kleines Team betreibt eine interne Wissens-App auf einem bisher manuell eingerichteten Rechner. Nach Neustarts fehlt der Dienst, Backups wurden noch nie zurückgespielt und niemand weiß, welche Ports wirklich benötigt werden. Du übernimmst die Einrichtung und schreibst eine nachvollziehbare Betriebsübergabe.

      Nutze eine eigene Debian- oder Ubuntu-VM oder einen ausdrücklich dafür vorgesehenen VPS. Die App darf klein sein: etwa eine vorhandene Demo-Anwendung mit HTTP-Endpunkt und persistent gespeicherten Beispieldaten. Entscheidend ist der nachgewiesene Betrieb. Dokumentiere den genauen OS- und Anwendungsstand sowie, welche Teile deiner Lösung für einen größeren realen Produktivbetrieb zusätzlich geprüft werden müssten.

      Erforderlich sind ein eigener Administrationsbenutzer mit Schlüsselzugang, begrenzte Dienstrechte, minimale Netzfreigaben, ein dokumentierter Sicherheitsupdateablauf und die Anwendung hinter Caddy oder nginx mit TLS. Die App läuft als systemd-Dienst oder über Container; wähle einen Weg und begründe ihn. Interne Datenbankports bleiben intern. In einer lokalen VM kannst du eine eigene Test-CA auf deinen Testclients vertrauen; bei einem öffentlichen Host nutzt du eine kontrollierte Domain mit passend ausgestellten Zertifikaten. Ein abgeschalteter Zertifikatscheck ist kein Abnahmekriterium.

      Ergänze Logaufbewahrung, einen versionierten Backupablauf, einen vollständigen Restore, einen HTTP-Healthcheck und einen nachgewiesenen Alarmweg an ein eigenes Testziel. Simuliere mindestens zwei Fehler kontrolliert, etwa einen falschen Konfigurationspfad und einen gestoppten Backenddienst. Verwende keine echten Kundendaten, keine fremden Systeme und keine Secrets im Repository.

      **Abgabe:** Repository mit Konfiguration und ungefährlichen Beispielwerten, automatisierten Prüfungen, README, Architekturdiagramm, Runbook, Restore-Protokoll und kurzem Postmortem. Bereite eine Demo vor, in der die App nach einem VM-Neustart funktioniert und ein gewählter Datenstand wiederhergestellt wird.
    skills: [linux, bash, systemd, ssh, firewall, tls, container, backups, monitoring, troubleshooting]
    steps:
      - id: vertrag
        title: Auftrag und Abnahme festhalten
        detail: Definiere App-Funktion, Daten, erlaubte Benutzer, Netzwege und Ausfallszenarien. Wähle VM oder VPS und dokumentiere verantwortbare Grenzen des Lernprojekts.
      - id: basis
        title: Basisstand und sicheren Zugang einrichten
        detail: Aktualisiere die Testumgebung, lege den Administrationsbenutzer an und prüfe Schlüssel sowie sudo. Sichere Konfiguration und Konsolen-Rückweg vor der SSH-Härtung.
      - id: netz
        title: Netzfreigaben und SSH härten
        detail: Dokumentiere alle benötigten Ports. Prüfe Syntax, effektive SSH-Werte und eine neue Anmeldung; teste erlaubte sowie unerlaubte Zugriffe über IPv4 und vorhandenes IPv6.
      - id: dienst
        title: Die App reproduzierbar starten
        detail: Lege einen eigenen Dienstbenutzer, Datenpfade und eine geprüfte Unit oder Containerkonfiguration fest. Belege Start, Stopp, geordnete Signale und automatischen Wiederanlauf nach Reboot.
      - id: proxy
        title: Reverse Proxy und überprüftes TLS ergänzen
        detail: Halte das Backend passend intern gebunden. Prüfe Zertifikatsvertrauen, HTTP-Verhalten und die fachliche Funktion von einem zweiten Client; dokumentiere Erneuerung und erwartete Zertifikatsgrenzen.
      - id: wartung
        title: Updates, Rechte und Logs in einen Betriebsablauf bringen
        detail: Prüfe erlaubte Updatequellen, Neustartbedarf und ein Wartungsfenster. Begrenze Dienst-Schreibpfade, Logvolumen und Aufbewahrung. Teste die App nach jeder Härtungsänderung.
      - id: backup
        title: Versionierte Backups automatisieren
        detail: Verwende einen unabhängigen Zielort und einen geplanten Timer. Prüfe fehlendes Ziel, Lesefehler und Geheimnisverwaltung. Lege Aufbewahrung mit entbehrlichen Testständen fest.
      - id: restore
        title: Die Wiederherstellung tatsächlich durchführen
        detail: Stelle einen ausdrücklich gewählten Stand an einem getrennten Ort oder auf einer frischen VM wieder her. Prüfe Daten, Metadaten und fachliche Nutzung; dokumentiere Dauer und jeden benötigten Schritt.
      - id: incident
        title: Überwachung und zwei Fehlerszenarien nachweisen
        detail: Überwache den fachlich passenden Endpunkt mit Zeitlimit und korrekter HTTP-Fehlererkennung. Ein gestoppter Dienst muss am eigenen Testziel einen Alarm auslösen; dokumentiere Reparatur, Erholung und ein zweites Konfigurationsproblem.
      - id: uebergabe
        title: CI, Runbook und Demo fertigstellen
        detail: Prüfe Skripte, Konfigurationen und Fixture-basierte Fehlerfälle in CI. Lass die Einrichtung und die wichtigsten Diagnosewege anhand der Dokumentation erneut nachvollziehen und zeichne eine kurze Betriebsdemo auf.
    acceptance:
      - README nennt Voraussetzungen, genaue Stände, Einrichtung, Start, Stopp und den vollständigen Rückweg.
      - Ein neuer SSH-Login mit dem vorgesehenen Schlüssel funktioniert; unerlaubte Loginmethoden werden abgewiesen und ein Konsolenzugang ist dokumentiert.
      - Von einem zweiten Testclient sind nur die vorgesehenen Dienste erreichbar; Datenbank und Backend sind entsprechend dem Architekturplan begrenzt.
      - HTTPS funktioniert mit erfolgreicher Zertifikatsprüfung und dokumentierter Erneuerung oder Test-CA-Verwaltung.
      - Nach einem VM-Neustart startet die App automatisch und erfüllt ihren fachlichen Smoke-Test.
      - Die App läuft mit begrenzter Identität und kann nur die dokumentierten Datenpfade beschreiben.
      - Sicherheitsupdates und erforderliche Neustarts haben einen überprüften Betriebsablauf.
      - Zwei versionierte Backupstände und ein erfolgreicher getrennter Restore mit fachlichem Test sind belegt.
      - Healthcheck, Alarm am eigenen Testziel und anschließende Erholungsmeldung sind durch ein kontrolliertes Fehlerszenario geprüft.
      - bash -n, ShellCheck sowie passende Konfigurations- und Fixture-Tests laufen in CI erfolgreich; CI verändert keine echten Server.
      - Runbook und Postmortem trennen gemessene Befunde, bestätigte Ursachen und offene Grenzen.
      - Repository, Screenshots und Logs enthalten keine privaten Schlüssel, Tokens oder echten Kundendaten.
    stretch:
      - Automatisiere die Einrichtung mit einem idempotenten Skript oder Ansible und belege den zweiten Lauf ohne unnötige Änderungen.
      - Prüfe den gesamten Restore auf einer frisch erzeugten VM mit noch nicht vorhandenem Anwendungsstand.
      - Ergänze ein kontrolliertes Release-Rollback mit Datenverträglichkeitsprüfung.
      - Ergänze Ressourcenlimits und belege an einer synthetischen Last, welche Grenze wann greift.
    portfolio: |
      Führe zuerst das Architekturdiagramm und die Abnahmekriterien vor. Zeige danach einen normalen Request, einen Neustart, einen kontrollierten Ausfall mit Alarm und die Wiederherstellung eines Datenstands. Ein bereinigtes Terminalvideo oder kurze Screenshots können Nachweise begleiten; entscheidend sind nachvollziehbare Befehle, erwartete Ergebnisse und ihre Grenzen.

      Im Gespräch begründest du Dienstmodell, Portfreigaben, Updateablauf, Backupumfang und Alarmbedingungen. Zeige ein konkretes Problem, das du mit Messungen statt zufälligen Änderungen gelöst hast. Benenne offen, welche zusätzlichen Anforderungen etwa Hochverfügbarkeit, echtes Nutzeraufkommen oder strengere Datenanforderungen auslösen würden. Das Projekt belegt einen verantwortbaren Betrieb einer kleinen Anwendung, keine pauschale Sicherheitszertifizierung.
