terms:
  - term: ACL
    definition: Access Control List ergänzt klassische Unix-Rechte um gezielte Benutzer- und Gruppenfreigaben. Eine ACL-Maske kann deren effektive Rechte begrenzen.
  - term: Argument
    definition: Ein einzelner an ein Programm übergebener Wert. Quoting und Arrays bewahren in Bash die Grenzen zwischen Argumenten.
  - term: Bind-Mount
    definition: Einbindung eines konkreten vorhandenen Pfads an einer anderen Stelle, etwa eines Hostordners im Container. Dateirechte und Lebenszyklus des Hostpfads bleiben relevant.
  - term: Blockgerät
    definition: Gerät, das Daten über adressierbare Blöcke bereitstellt, etwa eine SSD oder ein Logical Volume. Ein Dateisystem kann auf einem solchen Gerät liegen.
  - term: Bootloader
    definition: Programm, das den Kernel und gegebenenfalls eine initramfs lädt und startet. Es wird gewöhnlich von der Firmware aufgerufen.
  - term: Btrfs
    definition: Linux-Dateisystem mit Copy-on-Write, Prüfsummen und Subvolumes. Snapshots auf demselben Datenträger ersetzen keine unabhängigen Backups.
  - term: Capability
    definition: Ein einzelnes Root-Recht des Linux-Kernels, etwa `CAP_NET_BIND_SERVICE` für Ports unter 1024. Prozesse bekommen Capabilities über Datei-Capabilities (`setcap`) oder in systemd über `AmbientCapabilities=`.
  - term: cgroup
    definition: Control Group zur Gruppierung von Prozessen für Ressourcenmessung und Begrenzung. Ein Gruppenlimit kann erreicht sein, obwohl der gesamte Host noch Ressourcen besitzt.
  - term: chroot
    definition: Systemaufruf und Befehl, der das Wurzelverzeichnis eines Prozesses auf ein anderes Verzeichnis setzt. Ältester Baustein von Containern, für sich allein aber keine Sicherheitsgrenze.
  - term: CIDR
    definition: Schreibweise eines IP-Netzpräfixes wie 192.0.2.0/24. Die Zahl bezeichnet die Länge des Netzanteils in Bits.
  - term: Compositor
    definition: Unter Wayland das Programm, das Display-Server, Fenstermanager und Compositor vereint (KWin, Mutter, Hyprland). Es setzt die Puffer der Clients zum Bild zusammen und verteilt Eingaben an das fokussierte Fenster.
  - term: Container
    definition: Isolierte Prozessumgebung, die bei gewöhnlichen Linux-Containern den Hostkernel nutzt. Namespaces, cgroups und Dateisystemschichten erfüllen unterschiedliche Teile dieses Modells.
  - term: Copy-on-Write
    definition: Verfahren, bei dem Daten zunächst geteilt und erst bei Änderungen neue Versionen der betroffenen Bereiche angelegt werden. Es erklärt den zunächst geringen Platzbedarf vieler Snapshots.
  - term: D-Bus
    definition: Nachrichtenbus, über den Programme Methoden anderer Programme aufrufen. Es gibt einen Systembus für Dienste wie systemd und logind und je Benutzer einen Session-Bus; `busctl` zeigt und ruft Dienste auf.
  - term: Dateideskriptor
    definition: Prozesslokale Nummer für eine geöffnete Ressource. Konventionell stehen 0, 1 und 2 für stdin, stdout und stderr.
  - term: Default-ACL
    definition: ACL an einem Verzeichnis, die neue Einträge darin erben. Sie ersetzt beim Anlegen die umask; `setfacl -d` setzt sie, `getfacl` zeigt sie als `default:`-Zeilen.
  - term: Device Mapper
    definition: Kernel-Schicht, die aus Blockgeräten neue virtuelle Blockgeräte unter `/dev/mapper/` macht. LVM, dm-crypt (LUKS) und Testziele wie `error` bauen darauf auf.
  - term: Digest
    definition: Inhaltsbezogener kryptografischer Bezeichner, mit dem sich etwa ein konkretes Container-Image referenzieren lässt. Ein veränderbarer Tag bietet diese eindeutige Identität nicht.
  - term: Distribution
    definition: Zusammenstellung aus Linux-Kernel, Programmen, Paketverwaltung und Betriebsregeln. Unterschiede betreffen unter anderem Releaseablauf, Paketnamen und Konfiguration.
  - term: DNS
    definition: Verteiltes Namenssystem, das unter anderem Hostnamen auf IP-Adressen abbildet. Lokale Namensauflösung kann zusätzlich andere Quellen wie /etc/hosts verwenden.
  - term: Drop-in
    definition: Ergänzende systemd-Konfiguration, die einzelne Einstellungen einer Unit anpasst. Sie vermeidet oft eine vollständige Kopie der Paketunit.
  - term: Effektive UID
    definition: Benutzerkennung, die für viele Zugriffsentscheidungen eines Prozesses maßgeblich ist. Sie kann etwa bei privilegierten Programmen von der realen UID abweichen.
  - term: Emergency-Modus
    definition: Minimales systemd-Ziel `emergency.target`, nur `/` ist eingehängt. systemd startet es auch, wenn `local-fs.target` scheitert, meist wegen eines fstab-Fehlers.
  - term: Exit-Status
    definition: Kleiner ganzzahliger Rückgabestatus eines Prozesses oder Shellbefehls. 0 bedeutet üblicherweise Erfolg; die genaue Bedeutung anderer Werte hängt vom Programm ab.
  - term: Fallback-Image
    definition: initramfs, das mkinitcpio ohne den Hook `autodetect` baut. Es enthält alle Treiber und bootet deshalb auch nach einem Hardwarewechsel.
  - term: FHS
    definition: Filesystem Hierarchy Standard beschreibt die üblichen Aufgaben von Verzeichnissen wie /etc, /usr und /var. Die tatsächliche Belegung prüfst du am konkreten System.
  - term: Firewall
    definition: Regelwerk zur Kontrolle von Netzwerkverkehr. Eine Regelkonfiguration und ein Test der tatsächlichen Erreichbarkeit sind unterschiedliche Nachweise.
  - term: Flamegraph
    definition: Grafik aus Stichproben-Stapeln. Jede Ebene ist ein Funktionsaufruf, die Breite eines Balkens sein Anteil an den Stichproben; die x-Achse ist alphabetisch sortiert, keine Zeitachse.
  - term: fstab
    definition: Tabelle dauerhafter Dateisystem-Mounts mit Quelle, Ziel, Typ, Optionen und weiteren Feldern. Ihre Änderung mountet ein Dateisystem nicht automatisch sofort.
  - term: GID
    definition: Numerische Gruppenkennung. Prozesse besitzen eine primäre und gegebenenfalls zusätzliche Gruppenmitgliedschaften.
  - term: Globbing
    definition: Erweiterung von Shell-Dateimustern wie *.log zu passenden Namen. Es findet vor der Übergabe der Argumente an das Programm statt.
  - term: GPT
    definition: GUID Partition Table beschreibt die Aufteilung eines Datenträgers in Partitionen. Sie ist keine Dateisystemstruktur und enthält nicht die Dateien des Volumes.
  - term: GRUB
    definition: Verbreiteter Bootloader für BIOS und UEFI. Er liest beim Start `/boot/grub/grub.cfg`, die `update-grub` bzw. `grub-mkconfig` aus `/etc/default/grub` und `/etc/grub.d/` erzeugt.
  - term: Hardlink
    definition: Weiterer Verzeichniseintrag für denselben Inode innerhalb eines Dateisystems. Dateidaten bleiben erhalten, solange erforderliche Links oder offene Referenzen existieren.
  - term: Healthcheck
    definition: Gezielte technische Prüfung eines Dienstzustands, etwa eines HTTP-Endpunkts. Ein erfolgreicher Check belegt nur die darin tatsächlich geprüften Anforderungen.
  - term: Image
    definition: Vorlage mit Dateisystemschichten und Metadaten für Container. Laufende Container besitzen zusätzlich ihren eigenen Zustand und eine beschreibbare Schicht.
  - term: initramfs
    definition: Frühe Userspace-Umgebung im RAM, die unter anderem das echte Root-Dateisystem verfügbar machen kann. Sie wird vor dem regulären Systembetrieb verwendet.
  - term: Inode
    definition: Dateisystemobjekt mit Metadaten und Verweisen auf Dateidaten. Der Dateiname steht im Verzeichniseintrag und ist nicht mit dem Inode gleichzusetzen.
  - term: iowait
    definition: CPU-Leerlaufzeit, während mindestens eine Aufgabe auf I/O wartet (`wa` in `vmstat`). Ein hoher Wert zeigt wartende Aufgaben, ist aber kein Maß für die Auslastung des Geräts.
  - term: Journal
    definition: Im systemd-Kontext die strukturierte Sammlung von Dienst- und Systemmeldungen. journalctl filtert diese Daten nach Unit, Boot, Zeit und weiteren Feldern.
  - term: Kernel
    definition: Betriebssystemkern, der Prozesse, Speicher, Geräte und weitere grundlegende Ressourcen verwaltet. Anwendungen greifen über Systemaufrufe auf seine Funktionen zu.
  - term: Kernel-Kommandozeile
    definition: Parameter, die der Bootloader dem Kernel übergibt, etwa `root=`, `quiet` oder `systemd.unit=`. `/proc/cmdline` zeigt die des laufenden Boots.
  - term: Keyslot
    definition: Platz im LUKS-Header für eine verschlüsselte Kopie des Datenschlüssels. Jede Passphrase und jedes Keyfile nutzt einen eigenen Keyslot; LUKS2 hat bis zu 32.
  - term: ldconfig
    definition: Baut den Cache `/etc/ld.so.cache` aus den Verzeichnissen in `/etc/ld.so.conf.d` und legt fehlende SONAME-Links an. Der dynamische Loader sucht Bibliotheken in diesem Cache.
  - term: Least Privilege
    definition: Prinzip, einem Benutzer oder Dienst nur die für seine Aufgabe benötigten Rechte zu geben. Die Begrenzung soll konkret begründet und funktional geprüft werden.
  - term: Load Average
    definition: Geglättete Anzahl lauffähiger und bestimmter ununterbrechbar wartender Aufgaben unter Linux. Sie ist keine CPU-Prozentzahl.
  - term: Loopback
    definition: Lokaler Netzwerkpfad innerhalb eines Netzwerk-Namespace, typischerweise über 127.0.0.1 oder ::1. Ein darauf gebundener Dienst ist nicht automatisch extern erreichbar.
  - term: lost+found
    definition: Verzeichnis im Wurzelverzeichnis eines ext4-Dateisystems, in das e2fsck Dateien ohne Verzeichniseintrag hängt. Sie heißen dann nach ihrer Inode-Nummer, etwa `#17`.
  - term: LUKS
    definition: Linux Unified Key Setup, das Header-Format für verschlüsselte Blockgeräte mit dm-crypt. Der Header enthält den Datenschlüssel, je Keyslot mit einer Passphrase oder einem Keyfile verschlüsselt.
  - term: LVM
    definition: Logical Volume Manager bildet aus Physical Volumes eine Volume Group und daraus Logical Volumes. Er arbeitet unterhalb eines darauf liegenden Dateisystems.
  - term: Maintainer-Skript
    definition: Skript eines Debian-Pakets wie `postinst`, das dpkg beim Installieren, Konfigurieren oder Entfernen ausführt. Scheitert es, bleibt das Paket halb installiert oder halb konfiguriert.
  - term: Mount
    definition: Einbindung eines Dateisystems oder einer Ansicht in den Verzeichnisbaum. Vorhandene Einträge am Ziel werden dabei verdeckt, nicht automatisch verschoben.
  - term: Namespace
    definition: Kernelmechanismus für getrennte Sichten auf bestimmte Ressourcen, etwa Prozesse, Netzwerk oder Mounts. Mehrere Namespace-Typen wirken bei Containern zusammen.
  - term: nsswitch.conf
    definition: "Legt fest, welche Quellen die C-Bibliothek für Namen, Benutzer und Gruppen in welcher Reihenfolge fragt, etwa `hosts: files dns`. Der erste Treffer gewinnt."
  - term: NXDOMAIN
    definition: DNS-Antwortcode für „Name existiert nicht“. Anders als SERVFAIL ist es eine verbindliche Antwort des zuständigen Servers; Programme melden „Name or service not known“.
  - term: OOM
    definition: Out of Memory bezeichnet eine nicht erfüllbare Speicheranforderung beziehungsweise Speichermangelsituation. Ein OOM-Ereignis kann den Host oder eine begrenzte cgroup betreffen.
  - term: PATH
    definition: Umgebungsvariable mit Verzeichnissen zur Suche nach ausführbaren Programmen. Reihenfolge und tatsächliche Shell-Namensauflösung beeinflussen, welcher Befehl startet.
  - term: perf
    definition: Profiler aus dem Quellbaum des Linux-Kernels. Er nimmt Stichproben der laufenden Funktion samt Aufrufstapel (`perf record -g`) und zählt Ereignisse (`perf stat`). Unter Debian im Paket `linux-perf`.
  - term: Pinning
    definition: Prioritäten für Paketversionen in `/etc/apt/preferences.d/`. Über 1000 installiert apt eine Version auch als Downgrade.
  - term: Pipe
    definition: Datenkanal, der typischerweise stdout eines Prozesses mit stdin eines anderen verbindet. Fehlerstatus und stderr werden nicht automatisch zu denselben Daten.
  - term: pipefail
    definition: Bash-Option (`set -o pipefail`), mit der eine Pipeline den Status des letzten fehlgeschlagenen Kommandos meldet statt nur den des letzten Kommandos.
  - term: polkit
    definition: Dienst, der für privilegierte D-Bus-Dienste entscheidet, ob ein unprivilegierter Aufrufer eine Aktion ausführen darf. Regeln in JavaScript liegen unter `/etc/polkit-1/rules.d/`.
  - term: Port
    definition: Numerische Kennung eines Transportendpunkts innerhalb von TCP oder UDP. Bind-Adresse, Protokoll und Port gehören bei der Erreichbarkeitsprüfung zusammen.
  - term: PSI
    definition: Pressure Stall Information beschreibt Wartezeit von Aufgaben wegen Ressourcenmangels. Die Kernelwerte ergänzen reine Auslastungsmessungen.
  - term: Rescue-Modus
    definition: systemd-Ziel `rescue.target` mit root-Shell. Alle Dateisysteme aus der fstab sind eingehängt, Netz und Dienste laufen nicht. Erreichbar über `systemd.unit=rescue.target` oder `single`.
  - term: Rootless
    definition: Betriebsform einer Container-Runtime ohne deren gewöhnlichen Root-Betrieb, oft mit User-Namespace-Zuordnungen. Sie beseitigt nicht sämtliche Risiken durch freigegebene Hostdaten.
  - term: Scope-Unit
    definition: systemd-Unit für Prozesse, die nicht systemd selbst gestartet hat, etwa über `systemd-run --scope`. Sie bekommt eine eigene cgroup, also auch eigene Ressourcengrenzen.
  - term: secure_path
    definition: Option in `/etc/sudoers`, die den PATH für Befehle unter sudo festlegt. Eigene PATH-Ergänzungen des Benutzers gelten dort nicht.
  - term: Setgid-Verzeichnis
    definition: Verzeichnis mit gesetztem setgid-Bit (`chmod g+s`, Modus `2…`). Neue Einträge erben seine Gruppe statt der primären Gruppe ihres Erzeugers, neue Unterverzeichnisse auch das Bit.
  - term: Shebang
    definition: |
      Erste Skriptzeile wie `#!/usr/bin/env bash`, die beim direkten Start den Interpreter bestimmt. Ein ausdrücklicher Aufruf mit `bash` wählt ihn stattdessen selbst.
  - term: Signal
    definition: Benachrichtigung an einen Prozess, etwa SIGTERM zum geordneten Beenden. SIGKILL kann der Prozess nicht abfangen und bietet keine Aufräumphase.
  - term: Signal-Disposition
    definition: Was ein Prozess bei einem Signal tut, also Standardwirkung, ignorieren oder eigener Handler. `/proc/<pid>/status` zeigt sie als Bitmasken `SigIgn` und `SigCgt`. Ignorierte Signale bleiben über `execve` erhalten.
  - term: Signed-By
    definition: Option einer APT-Quelle, die genau die Schlüsseldatei nennt, mit der das Repository signiert sein muss. Ersetzt das globale Vertrauen über `apt-key`.
  - term: SMART
    definition: Self-Monitoring, Analysis and Reporting Technology, die Zustandsstatistik von Festplatten und SSDs. `smartctl` liest sie; aussagekräftig sind vor allem die Rohwerte einzelner Attribute.
  - term: Snapshot
    definition: Festgehaltener Stand einer Speicherstruktur. Umfang und Unabhängigkeit hängen von der Technik ab; ein lokaler Snapshot ist nicht automatisch ein Backup.
  - term: Socket
    definition: Kommunikationsendpunkt, etwa ein lauschender TCP-Endpunkt oder ein Unix-Domain-Socket. ss zeigt viele Netzwerk-Socketzustände.
  - term: SONAME
    definition: Name, unter dem ein Programm eine gemeinsame Bibliothek verlangt, etwa `libcurl.so.4`. Er enthält nur die Hauptversion; ein symbolischer Link mit diesem Namen zeigt auf die Datei mit voller Version.
  - term: Sparse-Datei
    definition: Datei mit logischer Länge, deren unbeschriebene Bereiche nicht zwingend physische Datenblöcke belegen. Scheinbare Größe und zugeordneter Platz können stark abweichen.
  - term: Startlimit
    definition: Schutz in systemd gegen Neustart-Schleifen. Startet eine Unit öfter als `StartLimitBurst=` (Standard 5) innerhalb von `StartLimitIntervalSec=` (Standard 10 s), weist systemd weitere Starts ab, bis `systemctl reset-failed` den Zähler zurücksetzt oder das Intervall abläuft.
  - term: Sticky-Bit
    definition: Sonderbit, das in gemeinsam beschreibbaren Verzeichnissen das Entfernen oder Umbenennen fremder Einträge beschränkt. Es ersetzt keine Lesezugriffskontrolle.
  - term: strace
    definition: Werkzeug, das per `ptrace` die Systemaufrufe eines Prozesses mit Argumenten, Rückgabewerten und Fehlern protokolliert. Es bremst den beobachteten Prozess deutlich.
  - term: StrictModes
    definition: sshd-Option (Standard `yes`), die Schlüssel ablehnt, wenn `authorized_keys`, `~/.ssh` oder das Home-Verzeichnis für andere als den Benutzer beschreibbar sind.
  - term: sudoedit
    definition: Bearbeitet eine Datei mit Root-Rechten, ohne den Editor als root zu starten. sudo kopiert die Datei, der Benutzer bearbeitet die Kopie, sudo schreibt sie zurück. In sudoers als `sudoedit /pfad` freigegeben.
  - term: SUID-Bit
    definition: Dateirecht, mit dem ein Programm mit den Rechten seines Besitzers läuft statt mit denen des Aufrufers. SUID-root-Programme sind mögliche Wege zu root und gehören in jede Bestandsaufnahme.
  - term: Timer
    definition: systemd-Unit, die eine andere Unit zeitgesteuert startet, ohne `Unit=` den gleichnamigen Service. Zeiten stehen in `OnCalendar=`; `Persistent=true` holt verpasste Läufe nach.
  - term: TTL (DNS)
    definition: Time to Live eines DNS-Records in Sekunden. So lange dürfen Resolver die Antwort zwischenspeichern; vor Umzügen senkt man sie.
  - term: udev
    definition: Gerätemanager von systemd (`systemd-udevd`). Er reagiert auf uevents des Kernels, lädt Treiber, setzt Namen, Symlinks und Rechte unter `/dev` nach Regeln in `/usr/lib/udev/rules.d` und `/etc/udev/rules.d`.
  - term: umask
    definition: Maske, die beim Erzeugen Rechte aus dem angeforderten Modus entfernt. Sie ändert keine schon vorhandenen Dateien.
  - term: Unit
    definition: Konfigurationseinheit von systemd, etwa `.service`, `.timer`, `.socket`, `.mount` oder `.target`. Unit-Dateien im INI-Format liegen unter `/usr/lib/systemd/system` (Pakete) und `/etc/systemd/system` (eigene).
  - term: unshare
    definition: Befehl, der ein Programm in neuen Namespaces startet, etwa mit eigenem PID-Namespace oder Hostnamen. Zeigt ohne Container-Engine, woraus Container bestehen.
  - term: USE-Methode
    definition: Prüfschema von Brendan Gregg, das für jede Ressource Auslastung (Utilization), Sättigung (Saturation) und Fehler (Errors) abfragt. Unter Linux liefern etwa `vmstat`, `iostat -x`, `pidstat` und PSI die Messwerte.
  - term: Volume
    definition: Im Containerbetrieb eine separat verwaltete persistente Datenablage. Im Speicherbereich kann der Begriff allgemeiner ein logisches Datenvolume bezeichnen; der Kontext entscheidet.
  - term: XDG-Portal
    definition: D-Bus-Schnittstelle (`org.freedesktop.portal.Desktop`), über die Programme den Desktop um Dateiauswahl, Bildschirmfreigabe oder Ähnliches bitten. `xdg-desktop-portal` leitet an das Backend des Desktops weiter, das den Benutzer fragt.
  - term: Zombie
    definition: Ein beendeter Prozess, dessen Exit-Status der Elternprozess noch nicht mit `wait()` abgeholt hat. Er belegt nur noch einen Eintrag in der Prozesstabelle; beseitigt wird er, indem der Elternprozess `wait()` aufruft oder endet.
