terms:
  - term: ACL
    definition: Access Control List ergänzt klassische Unix-Rechte um gezielte Benutzer- und Gruppenfreigaben. Eine ACL-Maske kann deren effektive Rechte begrenzen.
  - term: Argument
    definition: Ein einzelner an ein Programm übergebener Wert. Quoting und Arrays bewahren in Bash die Grenzen zwischen Argumenten.
  - term: Bind-Mount
    definition: Einbindung eines konkreten vorhandenen Pfads an einer anderen Stelle, etwa eines Hostordners im Container. Dateirechte und Lebenszyklus des Hostpfads bleiben relevant.
  - term: Blockgerät
    definition: Gerät, das Daten über adressierbare Blöcke bereitstellt, etwa eine SSD oder ein Logical Volume. Ein Dateisystem kann auf einem solchen Gerät liegen.
  - term: Bootloader
    definition: Programm, das den Kernel und gegebenenfalls eine initramfs lädt und startet. Es wird gewöhnlich von der Firmware aufgerufen.
  - term: Btrfs
    definition: Linux-Dateisystem mit Copy-on-Write, Prüfsummen und Subvolumes. Snapshots auf demselben Datenträger ersetzen keine unabhängigen Backups.
  - term: cgroup
    definition: Control Group zur Gruppierung von Prozessen für Ressourcenmessung und Begrenzung. Ein Gruppenlimit kann erreicht sein, obwohl der gesamte Host noch Ressourcen besitzt.
  - term: CIDR
    definition: Schreibweise eines IP-Netzpräfixes wie 192.0.2.0/24. Die Zahl bezeichnet die Länge des Netzanteils in Bits.
  - term: Container
    definition: Isolierte Prozessumgebung, die bei gewöhnlichen Linux-Containern den Hostkernel nutzt. Namespaces, cgroups und Dateisystemschichten erfüllen unterschiedliche Teile dieses Modells.
  - term: Copy-on-Write
    definition: Verfahren, bei dem Daten zunächst geteilt und erst bei Änderungen neue Versionen der betroffenen Bereiche angelegt werden. Es erklärt den zunächst geringen Platzbedarf vieler Snapshots.
  - term: Dateideskriptor
    definition: Prozesslokale Nummer für eine geöffnete Ressource. Konventionell stehen 0, 1 und 2 für stdin, stdout und stderr.
  - term: Digest
    definition: Inhaltsbezogener kryptografischer Bezeichner, mit dem sich etwa ein konkretes Container-Image referenzieren lässt. Ein veränderbarer Tag bietet diese eindeutige Identität nicht.
  - term: Distribution
    definition: Zusammenstellung aus Linux-Kernel, Programmen, Paketverwaltung und Betriebsregeln. Unterschiede betreffen unter anderem Releaseablauf, Paketnamen und Konfiguration.
  - term: DNS
    definition: Verteiltes Namenssystem, das unter anderem Hostnamen auf IP-Adressen abbildet. Lokale Namensauflösung kann zusätzlich andere Quellen wie /etc/hosts verwenden.
  - term: Drop-in
    definition: Ergänzende systemd-Konfiguration, die einzelne Einstellungen einer Unit anpasst. Sie vermeidet oft eine vollständige Kopie der Paketunit.
  - term: Effektive UID
    definition: Benutzerkennung, die für viele Zugriffsentscheidungen eines Prozesses maßgeblich ist. Sie kann etwa bei privilegierten Programmen von der realen UID abweichen.
  - term: Exit-Status
    definition: Kleiner ganzzahliger Rückgabestatus eines Prozesses oder Shellbefehls. 0 bedeutet üblicherweise Erfolg; die genaue Bedeutung anderer Werte hängt vom Programm ab.
  - term: FHS
    definition: Filesystem Hierarchy Standard beschreibt die üblichen Aufgaben von Verzeichnissen wie /etc, /usr und /var. Die tatsächliche Belegung prüfst du am konkreten System.
  - term: Firewall
    definition: Regelwerk zur Kontrolle von Netzwerkverkehr. Eine Regelkonfiguration und ein Test der tatsächlichen Erreichbarkeit sind unterschiedliche Nachweise.
  - term: fstab
    definition: Tabelle dauerhafter Dateisystem-Mounts mit Quelle, Ziel, Typ, Optionen und weiteren Feldern. Ihre Änderung mountet ein Dateisystem nicht automatisch sofort.
  - term: GID
    definition: Numerische Gruppenkennung. Prozesse besitzen eine primäre und gegebenenfalls zusätzliche Gruppenmitgliedschaften.
  - term: Globbing
    definition: Erweiterung von Shell-Dateimustern wie *.log zu passenden Namen. Es findet vor der Übergabe der Argumente an das Programm statt.
  - term: GPT
    definition: GUID Partition Table beschreibt die Aufteilung eines Datenträgers in Partitionen. Sie ist keine Dateisystemstruktur und enthält nicht die Dateien des Volumes.
  - term: Hardlink
    definition: Weiterer Verzeichniseintrag für denselben Inode innerhalb eines Dateisystems. Dateidaten bleiben erhalten, solange erforderliche Links oder offene Referenzen existieren.
  - term: Healthcheck
    definition: Gezielte technische Prüfung eines Dienstzustands, etwa eines HTTP-Endpunkts. Ein erfolgreicher Check belegt nur die darin tatsächlich geprüften Anforderungen.
  - term: Image
    definition: Vorlage mit Dateisystemschichten und Metadaten für Container. Laufende Container besitzen zusätzlich ihren eigenen Zustand und eine beschreibbare Schicht.
  - term: initramfs
    definition: Frühe Userspace-Umgebung im RAM, die unter anderem das echte Root-Dateisystem verfügbar machen kann. Sie wird vor dem regulären Systembetrieb verwendet.
  - term: Inode
    definition: Dateisystemobjekt mit Metadaten und Verweisen auf Dateidaten. Der Dateiname steht im Verzeichniseintrag und ist nicht mit dem Inode gleichzusetzen.
  - term: Journal
    definition: Im systemd-Kontext die strukturierte Sammlung von Dienst- und Systemmeldungen. journalctl filtert diese Daten nach Unit, Boot, Zeit und weiteren Feldern.
  - term: Kernel
    definition: Betriebssystemkern, der Prozesse, Speicher, Geräte und weitere grundlegende Ressourcen verwaltet. Anwendungen greifen über Systemaufrufe auf seine Funktionen zu.
  - term: Least Privilege
    definition: Prinzip, einem Benutzer oder Dienst nur die für seine Aufgabe benötigten Rechte zu geben. Die Begrenzung soll konkret begründet und funktional geprüft werden.
  - term: Load Average
    definition: Geglättete Anzahl lauffähiger und bestimmter ununterbrechbar wartender Aufgaben unter Linux. Sie ist keine CPU-Prozentzahl.
  - term: Loopback
    definition: Lokaler Netzwerkpfad innerhalb eines Netzwerk-Namespace, typischerweise über 127.0.0.1 oder ::1. Ein darauf gebundener Dienst ist nicht automatisch extern erreichbar.
  - term: LVM
    definition: Logical Volume Manager bildet aus Physical Volumes eine Volume Group und daraus Logical Volumes. Er arbeitet unterhalb eines darauf liegenden Dateisystems.
  - term: Mount
    definition: Einbindung eines Dateisystems oder einer Ansicht in den Verzeichnisbaum. Vorhandene Einträge am Ziel werden dabei verdeckt, nicht automatisch verschoben.
  - term: Namespace
    definition: Kernelmechanismus für getrennte Sichten auf bestimmte Ressourcen, etwa Prozesse, Netzwerk oder Mounts. Mehrere Namespace-Typen wirken bei Containern zusammen.
  - term: OOM
    definition: Out of Memory bezeichnet eine nicht erfüllbare Speicheranforderung beziehungsweise Speichermangelsituation. Ein OOM-Ereignis kann den Host oder eine begrenzte cgroup betreffen.
  - term: PATH
    definition: Umgebungsvariable mit Verzeichnissen zur Suche nach ausführbaren Programmen. Reihenfolge und tatsächliche Shell-Namensauflösung beeinflussen, welcher Befehl startet.
  - term: Pipe
    definition: Datenkanal, der typischerweise stdout eines Prozesses mit stdin eines anderen verbindet. Fehlerstatus und stderr werden nicht automatisch zu denselben Daten.
  - term: Port
    definition: Numerische Kennung eines Transportendpunkts innerhalb von TCP oder UDP. Bind-Adresse, Protokoll und Port gehören bei der Erreichbarkeitsprüfung zusammen.
  - term: PSI
    definition: Pressure Stall Information beschreibt Wartezeit von Aufgaben wegen Ressourcenmangels. Die Kernelwerte ergänzen reine Auslastungsmessungen.
  - term: Rootless
    definition: Betriebsform einer Container-Runtime ohne deren gewöhnlichen Root-Betrieb, oft mit User-Namespace-Zuordnungen. Sie beseitigt nicht sämtliche Risiken durch freigegebene Hostdaten.
  - term: Shebang
    definition: |
      Erste Skriptzeile wie `#!/usr/bin/env bash`, die beim direkten Start den Interpreter bestimmt. Ein ausdrücklicher Aufruf mit `bash` wählt ihn stattdessen selbst.
  - term: Signal
    definition: Benachrichtigung an einen Prozess, etwa SIGTERM zum geordneten Beenden. SIGKILL kann der Prozess nicht abfangen und bietet keine Aufräumphase.
  - term: Snapshot
    definition: Festgehaltener Stand einer Speicherstruktur. Umfang und Unabhängigkeit hängen von der Technik ab; ein lokaler Snapshot ist nicht automatisch ein Backup.
  - term: Socket
    definition: Kommunikationsendpunkt, etwa ein lauschender TCP-Endpunkt oder ein Unix-Domain-Socket. ss zeigt viele Netzwerk-Socketzustände.
  - term: Sparse-Datei
    definition: Datei mit logischer Länge, deren unbeschriebene Bereiche nicht zwingend physische Datenblöcke belegen. Scheinbare Größe und zugeordneter Platz können stark abweichen.
  - term: Sticky-Bit
    definition: Sonderbit, das in gemeinsam beschreibbaren Verzeichnissen das Entfernen oder Umbenennen fremder Einträge beschränkt. Es ersetzt keine Lesezugriffskontrolle.
  - term: umask
    definition: Maske, die beim Erzeugen Rechte aus dem angeforderten Modus entfernt. Sie ändert keine schon vorhandenen Dateien.
  - term: Volume
    definition: Im Containerbetrieb eine separat verwaltete persistente Datenablage. Im Speicherbereich kann der Begriff allgemeiner ein logisches Datenvolume bezeichnen; der Kontext entscheidet.
