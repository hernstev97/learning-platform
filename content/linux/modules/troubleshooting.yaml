  - id: oom-kontext
    type: explain
    title: Viel Host-RAM und trotzdem OOM
    prompt: Erkläre den folgenden vereinfachten Befund und die nächsten Prüfungen.
    lang: text
    code: |
      Host: mehrere GiB available
      app.service: MemoryMax=268435456
      Kernel: Memory cgroup out of memory: Killed process ... (app)
    points:
      - Ein cgroup-Limit kann erreicht sein, obwohl der Host noch RAM besitzt.
      - Der Dienst ist hier auf 256 MiB begrenzt.
      - Zeitlicher Verbrauch und Arbeitslast müssen mit der Meldung abgeglichen werden.
      - Ein größeres Limit beweist keine Reparatur eines möglichen Speicherlecks.
    explanation: Die Engpassressource ist zunächst der Speicherrahmen dieser Gruppe. Prüfe, ob die normale Arbeitslast mehr benötigt oder der Verbrauch unkontrolliert wächst, bevor du eine Grenze änderst.
    resources:
      - title: Kernel · cgroup v2 Memory
        url: https://docs.kernel.org/admin-guide/cgroup-v2.html#memory
  - id: upstream
    type: explain
    title: Was beweist ein HTTP 502?
    prompt: Ordne die folgenden drei Beobachtungen ein und benenne eine eng begrenzte nächste Untersuchung.
    lang: text
    code: |
      Client: HTTPS-Zertifikat gültig, Antwort 502
      Proxy-Log: connect() failed (111: Connection refused) while connecting to upstream
      ss: kein Listener auf 127.0.0.1:8000
    points:
      - Der Client hat den Proxy per HTTPS erreicht.
      - Der Proxy scheitert beim Verbindungsaufbau zum Backend.
      - Auf dem geprüften Backendport ist kein Listener sichtbar.
      - Als Nächstes werden Backend-Unit, Logs und konfigurierte Portzuordnung geprüft.
    explanation: Die Beobachtungen grenzen die Störung auf den Weg vom Proxy zum Backend ein. Sie beweisen noch nicht, warum das Backend fehlt; ein DNS- oder TLS-Neuentwurf wäre durch diese Belege nicht begründet.
  - id: psi-speicherdruck
    type: explain
    title: Schnellere Platten gegen hohes wa?
    prompt: |
      Ein API-Server (4 GiB RAM, kein Swap) reagiert seit einer Stunde zäh. Ein Kollege will die Daten auf schnellere SSDs umziehen, weil `wa` über 50 % liegt. Die Ausgaben stammen von diesem Server, nicht aus der VM. Erkläre, welche Ressource der Engpass ist, warum der Umzug wenig bringt und was du als Nächstes prüfst.
    lang: text
    code: |
      $ free -m
                     total        used        free      shared  buff/cache   available
      Mem:            3920        3822          61           2         156          98
      Swap:              0           0           0

      $ vmstat 1 3
      procs -----------memory---------- ---swap-- -----io---- -system-- ------cpu-----
       r  b   swpd   free   buff  cache   si   so    bi    bo   in   cs us sy id wa st
       2  0      0  63412    320 159880    0    0   210    88  980 1430  6  3 90  1  0
       3  6      0  62104    312 158220    0    0 48212   120 4120 6211 12 21 14 53  0
       2  7      0  60988    308 157004    0    0 51320    96 4302 6540 10 23 12 55  0

      $ grep . /proc/pressure/memory /proc/pressure/io
      /proc/pressure/memory:some avg10=61.42 avg60=48.90 avg300=22.15 total=318842211
      /proc/pressure/memory:full avg10=38.70 avg60=29.31 avg300=12.04 total=201224870
      /proc/pressure/io:some avg10=58.10 avg60=45.22 avg300=20.40 total=301127730
      /proc/pressure/io:full avg10=36.95 avg60=27.80 avg300=11.62 total=190288145
    points:
      - Ohne Swap bleiben `si` und `so` bei 0; sie taugen hier nicht als Signal für Speicherdruck.
      - Fast kein RAM ist verfügbar, der Cache ist winzig, und `bi` liegt bei rund 50 MiB/s, während kaum geschrieben wird. Der Kernel verdrängt Dateiseiten und liest sie sofort wieder ein.
      - "`memory full` von fast 39 % heißt: In rund 39 % der letzten zehn Sekunden kam keine Aufgabe voran, weil alle auf Speicher warteten."
      - Der I/O-Druck ist eine Folge des Speichermangels. Schnellere Platten verkürzen das Nachladen, beheben aber nicht, dass der Arbeitsspeicher nicht reicht.
      - Als Nächstes suchst du den Verbraucher (`ps --sort=-rss`, `pidstat -r 1`, `memory.current` und `memory.pressure` der Units) und prüfst `journalctl -k` auf OOM-Meldungen.
    explanation: |
      Der Engpass ist der Arbeitsspeicher, nicht die Platte. Anonymen Speicher kann der Kernel ohne Swap nirgends auslagern. Er holt sich Platz aus dem Seitencache und wirft dabei auch Programmcode und häufig gelesene Dateien hinaus, die kurz darauf wieder gebraucht werden. Diese Nachladevorgänge sind die Lesezugriffe in `bi`; die Prozesse warten darauf im Zustand `D` (`b`), und die CPU steht in `wa`. PSI passt dazu: Der Druck bei `memory` ist mindestens so hoch wie bei `io`, denn das Warten auf verdrängte und wieder gebrauchte Seiten zählt der Kernel als Speicherdruck. Schreiblast (`bo`) gibt es kaum.

      Hilfreich ist, den Verbraucher zu finden und zu begrenzen oder dem Server mehr RAM zu geben. Schnellere SSDs würden die Wartezeit pro Nachladen senken, das Thrashing selbst aber nicht beenden.
    resources:
      - title: Kernel · PSI
        url: https://docs.kernel.org/accounting/psi.html#pressure-interface
      - title: Kernel · cgroup v2 Memory
        url: https://docs.kernel.org/admin-guide/cgroup-v2.html#memory
  - id: strace-zusammenfassung
    type: explain
    title: Wohin verschwinden die 40 Minuten?
    prompt: |
      Ein nächtlicher Export braucht seit dem Umzug auf einen neuen Server 40 statt 4 Minuten. Der Prozess hat nur einen Thread, die CPU ist fast untätig. Du hängst dich eine Minute lang an ihn und drückst dann Strg+C. Die Tabelle stammt von diesem Server, nicht aus der VM. Erkläre, wohin die Zeit geht, welche Zeile du zuerst verfolgst und warum die vielen Fehler nicht die erste Spur sind.
    lang: text
    code: |
      $ sudo strace -c -w -f -p 23817
      strace: Process 23817 attached
      ^Cstrace: Process 23817 detached
      % time     seconds  usecs/call     calls    errors syscall
      ------ ----------- ----------- --------- --------- ----------------
       88.64   52.180341       45772      1140           fdatasync
        6.51    3.833102          31    123649           write
        3.00    1.766224          29     60904     60896 openat
        1.04    0.611042          39     15620           read
        0.81    0.479113          26     18240           lseek
        0.00    0.000212          26         8           close
      ------ ----------- ----------- --------- --------- ----------------
      100.00   58.870034         268    219561     60896 total
    points:
      - Mit `-w` misst die Tabelle Wanduhrzeit; rund 52 der 60 Sekunden stecken in `fdatasync`.
      - Jeder `fdatasync` dauert im Schnitt rund 46 ms. Der Export wartet darauf, dass Daten dauerhaft auf dem Gerät liegen, nicht auf die CPU.
      - Die rund 61 000 fehlgeschlagenen `openat` sind auffällig, kosten zusammen aber unter 2 Sekunden. Sie sind ein Nebenbefund.
      - Als Nächstes prüfst du das Zielgerät mit `iostat -x` (`w_await`, `f_await`) und, ob der Export nach jeder Handvoll Datensätze synchronisiert, statt größere Blöcke zu schreiben.
    explanation: |
      Die Tabelle zeigt, wo der Prozess in Systemaufrufen steckt, nicht, wo er rechnet. Mit `-w` zählt sie die Zeit zwischen Beginn und Ende jedes Aufrufs; ohne `-w` stünde dort nur Kernel-CPU-Zeit, und das Warten in `fdatasync` fiele kaum auf. 1140 Aufrufe in einer Minute sind rund 19 pro Sekunde, jeder dauert etwa 46 ms: Zusammen ergibt das fast die gesamte Minute. Auf dem alten Server war das Gerät schneller beim Synchronisieren, etwa durch einen Controller mit batteriegepuffertem Schreibcache; das bestätigt oder widerlegt erst `iostat -x` auf dem neuen.

      Die Fehler bei `openat` gehören trotzdem ins Protokoll. Fast jeder Versuch scheitert, das Programm sucht also wiederholt eine Datei, die es nicht gibt. Bei 29 µs pro Aufruf ist das aber nicht der Grund für 36 Minuten Verzögerung.
    resources:
      - title: strace(1)
        url: https://man7.org/linux/man-pages/man1/strace.1.html
      - title: fsync(2)
        url: https://man7.org/linux/man-pages/man2/fsync.2.html
  - id: dienst-nach-boot
    type: scenario
    title: Läuft von Hand, aber nicht nach dem Neustart
    prompt: |
      `web01` wurde heute früh neu gestartet. Seitdem meldet das Monitoring, dass `http://localhost:8000/health` nicht antwortet. Ein Kollege sagt: „Gestern lief es noch, ich hab's mit `cd /opt/healthapp && ./run.sh` gestartet.“ Für den Dienst gibt es die Unit `healthapp.service`.

      Finde heraus, warum der Endpunkt fehlt. Sorge dann dafür, dass `healthapp` als Dienst läuft und auch den nächsten Boot übersteht. Du bist als `ops` angemeldet und hast `sudo`.
    setup: |
      set -e
      mkdir -p /opt/healthapp/www
      echo ok > /opt/healthapp/www/health
      cat > /opt/healthapp/run.sh <<'EOF'
      #!/bin/sh
      # Health-Endpunkt der Shop-App auf Port 8000
      exec busybox httpd -f -p 8000 -h www
      EOF
      chmod 755 /opt/healthapp/run.sh
      chown -R ops:ops /opt/healthapp
      cat > /etc/systemd/system/healthapp.service <<'EOF'
      [Unit]
      Description=Health-Endpunkt der Shop-App

      [Service]
      User=ops
      ExecStart=/opt/healthapp/run.sh

      [Install]
      WantedBy=multi-user.target
      EOF
      systemctl daemon-reload
    checks:
      - name: healthapp startet beim Boot
        run: systemctl is-enabled healthapp
      - name: healthapp läuft, auch nach einem Neustart des Dienstes
        run: systemctl restart healthapp && sleep 2 && systemctl is-active healthapp
      - name: Der Health-Endpunkt antwortet
        run: curl -fsS --max-time 5 http://localhost:8000/health
    solution: |
      # Nicht aktiviert und nicht gestartet: Der Kollege hat ihn nur von Hand laufen lassen.
      systemctl status healthapp --no-pager
      sudo systemctl enable --now healthapp
      # Er stirbt sofort. Das Journal nennt den Grund:
      # httpd: can't change directory to 'www': No such file or directory
      journalctl -u healthapp -n 20 --no-pager
      # run.sh erwartet /opt/healthapp als Arbeitsverzeichnis, systemd startet Dienste in /.
      sudo mkdir -p /etc/systemd/system/healthapp.service.d
      printf '[Service]\nWorkingDirectory=/opt/healthapp\n' | sudo tee /etc/systemd/system/healthapp.service.d/workdir.conf
      sudo systemctl daemon-reload
      sudo systemctl restart healthapp
      curl -fsS http://localhost:8000/health
    hints:
      - "Wie steht der Dienst da? `systemctl status healthapp` zeigt, ob er läuft und ob er beim Boot startet (`enabled` oder `disabled`)."
      - "Startet der Dienst, stirbt aber gleich wieder? Die Ursache steht im Journal: `journalctl -u healthapp`."
      - "Der Kollege startet das Skript aus `/opt/healthapp` heraus. In welchem Verzeichnis startet systemd einen Dienst, und wo sucht `run.sh` nach `www`?"
    explanation: |
      Hier stecken zwei Fehler hintereinander. Erstens war die Unit nie aktiviert: `systemctl start` gilt nur bis zum nächsten Boot, erst `enable` hängt sie an `multi-user.target`. Zweitens nutzt `run.sh` den relativen Pfad `www`. Von Hand lief das, weil der Kollege in `/opt/healthapp` stand. systemd startet Systemdienste dagegen mit `/` als Arbeitsverzeichnis. `WorkingDirectory=` in einem Drop-in behebt das, ebenso ein absoluter Pfad im Skript.

      „Läuft von Hand, aber nicht als Dienst“ heißt fast immer: andere Umgebung. Prüfe Arbeitsverzeichnis, Umgebungsvariablen, `PATH`, Benutzer und Rechte.
    resources:
      - title: systemd.exec – WorkingDirectory=
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#WorkingDirectory=
      - title: systemctl enable
        url: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html#enable%20UNIT%E2%80%A6
  - id: bad-gateway
    type: scenario
    title: 502, obwohl das Backend antwortet
    prompt: |
      Seit dem Deployment um 14:20 meldet das Monitoring für `http://localhost/health` auf `web01` nur noch `502 Bad Gateway`. nginx arbeitet dort als Reverse Proxy vor `shop-backend.service`. Im Ticket schreibt die Entwicklerin: „Das Backend läuft, `curl localhost:8080/health` liefert `ok`. Muss an nginx liegen.“

      Finde heraus, warum nginx das Backend nicht erreicht, und repariere es so, dass `/health` über nginx wieder `ok` liefert, auch nach einem Neustart der Dienste. Das Backend soll weiterhin nur lokal erreichbar sein.
    setup: |
      set -e
      mkdir -p /srv/shop/www /etc/shop
      echo ok > /srv/shop/www/health
      echo '<h1>Shop</h1>' > /srv/shop/www/index.html
      cat > /etc/shop/backend.env <<'EOF'
      # Adresse des Backends. Deployment 14:20: nur noch lokal statt auf allen Adressen.
      LISTEN=[::1]:8080
      EOF
      cat > /etc/systemd/system/shop-backend.service <<'EOF'
      [Unit]
      Description=Shop-Backend

      [Service]
      User=www-data
      EnvironmentFile=/etc/shop/backend.env
      ExecStart=/usr/bin/busybox httpd -f -p ${LISTEN} -h /srv/shop/www
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
      EOF
      cat > /etc/nginx/sites-available/shop <<'EOF'
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;

          location / {
              proxy_pass http://127.0.0.1:8080;
              proxy_set_header Host $host;
          }
      }
      EOF
      rm -f /etc/nginx/sites-enabled/default
      ln -s /etc/nginx/sites-available/shop /etc/nginx/sites-enabled/shop
      ln -s /lib/systemd/system/nginx.service /etc/systemd/system/multi-user.target.wants/nginx.service
      ln -s /etc/systemd/system/shop-backend.service /etc/systemd/system/multi-user.target.wants/shop-backend.service
      systemctl daemon-reload
      systemctl start shop-backend.service nginx.service
      curl -s -o /dev/null http://localhost/health || true
    checks:
      - name: shop-backend startet beim Boot und läuft nach einem Neustart
        run: systemctl is-enabled shop-backend && systemctl restart shop-backend && sleep 1 && systemctl is-active shop-backend
      - name: Die nginx-Konfiguration ist gültig, nginx startet beim Boot
        run: nginx -t -q && systemctl is-enabled nginx && systemctl is-active nginx
      - name: Über nginx liefert /health wieder ok
        run: curl -fsS --max-time 5 http://localhost/health
      - name: Das Backend lauscht nur auf localhost
        run: |
          adressen=$(ss -Hltnp | grep '"busybox"' | awk '{ print $4 }')
          echo "Das Backend lauscht auf: ${adressen:-nichts}"
          [ -n "$adressen" ] && ! printf '%s\n' "$adressen" | grep -qvE '^(127\.[0-9.]+|\[::1\]):[0-9]+$'
    solution: |
      # Wer antwortet mit 502? Der Server-Header sagt: nginx selbst.
      curl -si http://localhost/health | head -n 3
      # nginx schreibt Upstream-Fehler ins Fehlerlog (ops liest als Mitglied von adm mit):
      tail -n 1 /var/log/nginx/error.log
      # connect() failed (111: Connection refused) while connecting to upstream, … upstream: "http://127.0.0.1:8080/health"
      # Das Backend läuft und antwortet auch, aber auf welcher Adresse?
      systemctl status shop-backend --no-pager | head -n 3
      curl -sS http://localhost:8080/health
      sudo ss -ltnp 'sport = :8080'
      # LISTEN … [::1]:8080 … busybox: nur IPv6-Loopback. nginx verbindet sich mit 127.0.0.1.
      grep LISTEN /etc/shop/backend.env
      sudo sed -i 's/^LISTEN=.*/LISTEN=127.0.0.1:8080/' /etc/shop/backend.env
      sudo systemctl restart shop-backend
      sudo ss -ltnp 'sport = :8080'
      curl -fsS http://localhost/health
    hints:
      - "Wer schickt die 502? `curl -si http://localhost/health` zeigt Status und `Server:`-Header. Fehler beim Upstream schreibt nginx nach `/var/log/nginx/error.log`."
      - "Das Fehlerlog nennt die Adresse, mit der nginx sich verbinden will. Vergleiche sie mit der Adresse, auf der das Backend wirklich lauscht: `sudo ss -ltnp`."
      - "`localhost` heißt `127.0.0.1` und `::1`. curl probiert beide, nginx verbindet sich hier fest mit `127.0.0.1`. Die Adresse des Backends steht in `/etc/shop/backend.env`."
    explanation: |
      Die 502 erzeugt nginx selbst: Es hat die Anfrage angenommen, bekommt aber keine Verbindung zum Upstream. Das Fehlerlog nennt Ziel und Grund, `127.0.0.1:8080` und `111: Connection refused`. `ss -ltnp` zeigt, dass busybox seit dem Deployment nur auf `[::1]:8080` lauscht, dem IPv6-Loopback. Ein Socket auf `::1` nimmt keine Verbindungen an `127.0.0.1` an. Die Probe der Entwicklerin klappte trotzdem, weil curl `localhost` zu `::1` und `127.0.0.1` auflöst und beide Adressen probiert. Sie hat also einen anderen Weg getestet als nginx.

      Beide Reparaturen sind richtig: das Backend auf `127.0.0.1:8080` legen oder in nginx `proxy_pass http://[::1]:8080;` eintragen und nginx neu laden. Allgemein gilt: Teste genau den Weg, den der Client nimmt, mit derselben Adresse, demselben Port und demselben Protokoll.
    resources:
      - title: nginx · proxy_pass
        url: https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_pass
      - title: ss(8)
        url: https://man7.org/linux/man-pages/man8/ss.8.html
  - id: zaeher-server
    type: scenario
    title: Der Server ist zäh
    prompt: |
      Seit gestern Mittag ist `web01` zäh: Befehle im Terminal brauchen spürbar länger, und der Shop (`shop.service`, `http://127.0.0.1:8080/health`) antwortet langsamer als sonst. Im Team erinnert sich jemand, „irgendeinen Job“ eingerichtet zu haben, weiß aber nicht mehr, welchen.

      Finde heraus, was die CPU belegt und wer es startet. Der Job wird gebraucht und soll weiter regelmäßig laufen. Er darf aber dauerhaft höchstens 20 % einer CPU bekommen, auch wenn die Maschine sonst nichts zu tun hat. Der Shop muss dabei weiterlaufen.
    setup: |
      set -e
      # Der Shop
      mkdir -p /srv/shop/www
      echo ok > /srv/shop/www/health
      cat > /etc/systemd/system/shop.service <<'EOF'
      [Unit]
      Description=Shop-Frontend

      [Service]
      User=www-data
      ExecStart=/usr/bin/busybox httpd -f -p 127.0.0.1:8080 -h /srv/shop/www

      [Install]
      WantedBy=multi-user.target
      EOF
      # Ein harmloser Job zum Vergleich
      cat > /etc/systemd/system/belegexport.service <<'EOF'
      [Unit]
      Description=Belege an die Buchhaltung exportieren

      [Service]
      Type=oneshot
      ExecStart=/bin/true
      EOF
      cat > /etc/systemd/system/belegexport.timer <<'EOF'
      [Unit]
      Description=Belege nachts exportieren

      [Timer]
      OnCalendar=*-*-* 02:30

      [Install]
      WantedBy=timers.target
      EOF
      # Der Job, der die CPU belegt
      cat > /usr/local/bin/katalog-vorschau <<'EOF'
      #!/bin/sh
      # Baut die Vorschaubilder des Produktkatalogs neu und prüft jede per Prüfsumme.
      n=0
      while [ "$n" -lt 100 ]; do
        head -c 8M /dev/urandom | sha256sum > /dev/null
        n=$((n + 1))
      done
      EOF
      chmod 755 /usr/local/bin/katalog-vorschau
      cat > /etc/systemd/system/katalog-vorschau.service <<'EOF'
      [Unit]
      Description=Vorschaubilder des Produktkatalogs neu aufbauen

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/katalog-vorschau
      EOF
      cat > /etc/systemd/system/katalog-vorschau.timer <<'EOF'
      [Unit]
      Description=Vorschaubilder regelmäßig neu aufbauen

      [Timer]
      OnActiveSec=10s
      OnUnitInactiveSec=30s

      [Install]
      WantedBy=timers.target
      EOF
      mkdir -p /etc/systemd/system/timers.target.wants
      ln -s /etc/systemd/system/shop.service /etc/systemd/system/multi-user.target.wants/shop.service
      ln -s /etc/systemd/system/belegexport.timer /etc/systemd/system/timers.target.wants/belegexport.timer
      ln -s /etc/systemd/system/katalog-vorschau.timer /etc/systemd/system/timers.target.wants/katalog-vorschau.timer
      systemctl daemon-reload
      systemctl start shop.service belegexport.timer katalog-vorschau.timer
      systemctl start --no-block katalog-vorschau.service
    checks:
      - name: Der Shop läuft und antwortet
        run: systemctl is-active shop && curl -fsS --max-time 5 http://127.0.0.1:8080/health
      - name: Der Job wird weiter regelmäßig gestartet
        run: systemctl is-enabled katalog-vorschau.timer && systemctl is-active katalog-vorschau.timer
      - name: Der Job bekommt höchstens 20 % einer CPU
        run: |
          systemctl start --no-block katalog-vorschau.service
          sleep 2
          cg=/sys/fs/cgroup/system.slice/katalog-vorschau.service
          nutzung() { awk '$1 == "usage_usec" { print $2 }' "$cg/cpu.stat" 2>/dev/null; }
          t1=$(date +%s%N); a=$(nutzung); sleep 4; b=$(nutzung); t2=$(date +%s%N)
          if [ -z "$a" ] || [ -z "$b" ] || [ "$b" -le "$a" ]; then echo "Der Job lief während der Messung nicht."; exit 1; fi
          p=$(( (b - a) * 100000 / (t2 - t1) ))
          read -r quote periode 2>/dev/null < "$cg/cpu.max" || quote=max
          if [ "$quote" = max ]; then grenze=keine; else grenze="$((quote * 100 / periode)) %"; fi
          echo "Der Job nutzte $p % einer CPU (Messung über 4 Sekunden), eingestellte Grenze: $grenze."
          # Die Grenze selbst muss bei 20 % liegen; die Messung zeigt, dass sie greift, mit etwas Spielraum für Messrauschen.
          [ "$quote" != max ] && [ $((quote * 100 / periode)) -le 20 ] && [ "$p" -le 25 ]
    solution: |
      # Eine CPU, aber zwei bis drei lauffähige Aufgaben und kein Leerlauf
      nproc
      uptime
      vmstat 1 3
      # PSI: Aufgaben warten auf die CPU
      cat /proc/pressure/cpu
      # Wer rechnet? sha256sum und head wechseln die PID, ihr Elternprozess bleibt.
      ps -eo pid,ppid,%cpu,cmd --sort=-%cpu | head -n 5
      eltern=$(ps -o ppid= -C sha256sum | head -n 1)
      ps -o pid,unit,cmd -p $eltern
      # Die Unit und der Timer, der sie immer wieder startet
      systemctl status katalog-vorschau.service --no-pager | head -n 4
      systemctl list-timers --no-pager
      # Dauerhaft auf 20 % einer CPU begrenzen; Timer und Shop bleiben unberührt
      sudo systemctl set-property katalog-vorschau.service CPUQuota=20%
      cat /sys/fs/cgroup/system.slice/katalog-vorschau.service/cpu.max
      vmstat 1 3
    hints:
      - "Wie viele CPUs hat die Maschine (`nproc`), und wie viele Aufgaben wollen rechnen? Spalte `r` in `vmstat 1 5` und `cat /proc/pressure/cpu` zeigen, ob die CPU der Engpass ist."
      - "`top` oder `ps -eo pid,ppid,%cpu,cmd --sort=-%cpu` zeigt die Rechner. Kurzlebige Prozesse wechseln die PID; folge dem Elternprozess. `ps -o unit= -p PID` oder `systemctl status PID` nennt die Unit, `systemctl list-timers` den Auslöser."
      - "`kill` oder Abschalten helfen hier nicht, der Timer startet den Job wieder, und er wird gebraucht. Gesucht ist eine harte Obergrenze für die cgroup des Dienstes: `CPUQuota=`, gesetzt mit `systemctl set-property` oder einem Drop-in."
    explanation: |
      Auf einer CPU heißt `r` = 2 bis 3 bei `id` = 0: Mehrere Aufgaben wollen rechnen, eine bekommt die CPU, die anderen warten. PSI bestätigt das mit `cpu some` um 50. Die Rechner `sha256sum` und `head` leben nur Sekunden; stabil ist ihr Elternprozess, das Skript `katalog-vorschau`. Über die cgroup (`ps -o unit`, `systemctl status PID`) findest du die Unit, `systemctl list-timers` zeigt den Timer, der sie 30 Sekunden nach jedem Ende neu startet. Ein `kill` hilft deshalb nur kurz.

      `CPUQuota=20%` setzt in der cgroup `cpu.max` auf 20 ms je 100 ms: Der Job bekommt nie mehr, auch wenn die CPU sonst frei wäre. `Nice=` und `CPUWeight=` verteilen dagegen nur, wenn mehrere Aufgaben konkurrieren; im Leerlauf bekäme der Job weiter 100 %. `systemctl set-property` wendet die Grenze sofort an und speichert sie dauerhaft unter `/etc/systemd/system.control/`; ein Drop-in mit `daemon-reload` wirkt genauso. Danach zeigt `cpu.pressure` in der cgroup des Jobs hohe Werte: Jetzt wartet der Job, nicht mehr der Rest des Systems.
    resources:
      - title: systemd.resource-control · CPUQuota=
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.resource-control.html#CPUQuota=
      - title: systemd.timer
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.timer.html
      - title: Kernel · PSI für cgroups
        url: https://docs.kernel.org/accounting/psi.html#cgroup2-interface
  - id: stummer-abgleich
    type: scenario
    title: Exit-Code 1 und sonst nichts
    prompt: |
      Seit dem Update auf lagersync 2.4 gestern Abend bleibt der Lagerexport `/srv/lager/bestand.csv` auf dem Stand von gestern. Ein Timer startet `lagersync.service` alle fünf Minuten, und der Dienst endet jedes Mal mit Exit-Code 1. Eine Fehlermeldung gibt es nicht, weder im Journal noch im Terminal. Der Hersteller schreibt: „Bei uns läuft 2.4 problemlos. Das Programm liegt unter `/opt/lager`.“

      Finde heraus, woran lagersync scheitert, und repariere es. Der Dienst soll weiter als Benutzer `lager` laufen, und die Zugangsdaten in `/opt/lager/etc/zugang.token` dürfen nur root und `lager` lesen.
    setup: |
      set -e
      useradd --system --home-dir /var/lib/lager --create-home --shell /usr/sbin/nologin lager
      mkdir -p /opt/lager/bin /opt/lager/etc /srv/lager
      cat > /opt/lager/bin/lagersync <<'EOF'
      #!/bin/sh
      # lagersync 2.4 – Lagerwerk GmbH
      # Gleicht den Lagerbestand mit dem Shop ab. Sucht Konfiguration und
      # Zugangsdaten relativ zum Installationsort.
      basis=$(dirname "$(readlink -f "$0")")/..
      for datei in "${XDG_CONFIG_HOME:-$HOME/.config}/lagersync/lagersync.conf" "$basis/etc/lagersync.conf"; do
        if [ -f "$datei" ]; then
          . "$datei"
          break
        fi
      done
      [ -n "$ZIEL" ] || exit 1
      token=$(cat "$basis/etc/zugang.token" 2>/dev/null) || exit 1
      [ -n "$token" ] || exit 1
      printf 'artikel;bestand\n4711;12\n4712;0\n4713;38\n' > "$ZIEL.neu" || exit 1
      mv "$ZIEL.neu" "$ZIEL"
      EOF
      chmod 755 /opt/lager/bin/lagersync
      printf '# Ziel des Exports\nZIEL=/srv/lager/bestand.csv\n' > /opt/lager/etc/lagersync.conf
      printf 'lw_7f3c9a1e52d04b8e\n' > /opt/lager/etc/zugang.token
      chmod 600 /opt/lager/etc/zugang.token
      printf 'artikel;bestand\n4711;14\n4712;3\n4713;40\n' > /srv/lager/bestand.csv
      chown -R lager:lager /srv/lager
      touch -d 'yesterday 21:55' /srv/lager/bestand.csv
      # Das Update hat das Programm kopiert, statt es zu verlinken.
      cp /opt/lager/bin/lagersync /usr/local/bin/lagersync
      cat > /etc/systemd/system/lagersync.service <<'EOF'
      [Unit]
      Description=Lagerbestand mit dem Shop abgleichen

      [Service]
      Type=oneshot
      User=lager
      ExecStart=/usr/local/bin/lagersync
      EOF
      cat > /etc/systemd/system/lagersync.timer <<'EOF'
      [Unit]
      Description=Lagerabgleich alle fünf Minuten

      [Timer]
      OnCalendar=*:0/5

      [Install]
      WantedBy=timers.target
      EOF
      mkdir -p /etc/systemd/system/timers.target.wants
      ln -s /etc/systemd/system/lagersync.timer /etc/systemd/system/timers.target.wants/lagersync.timer
      systemctl daemon-reload
      systemctl start lagersync.timer
      systemctl start lagersync.service || true
    checks:
      - name: lagersync.service läuft fehlerfrei durch
        run: systemctl start lagersync.service
      - name: Der Export ist frisch und stammt vom Dienstbenutzer lager
        run: |
          f=/srv/lager/bestand.csv
          ls -l "$f"
          [ "$(stat -c %U "$f")" = lager ] && [ -n "$(find "$f" -mmin -2)" ] && grep -q '^4711;12$' "$f"
      - name: Nur root und lager können zugang.token lesen
        run: |
          t=/opt/lager/etc/zugang.token
          ls -l "$t"
          read -r besitzer gruppe modus <<< "$(stat -c '%U %G %A' "$t")"
          erlaubt() { [ "$1" = root ] || [ "$1" = lager ]; }
          # Leserecht nur für root und lager: als Besitzer, als Gruppe, nie für andere.
          { [ "${modus:1:1}" != r ] || erlaubt "$besitzer"; } &&
            { [ "${modus:4:1}" != r ] || erlaubt "$gruppe"; } &&
            [ "${modus:7:1}" != r ] &&
            ! runuser -u ops -- cat "$t" >/dev/null 2>&1 &&
            [ -z "$(find /opt/lager /usr/local -name zugang.token -perm /o=r)" ]
    solution: |
      # Der Dienst scheitert ohne Meldung:
      systemctl status lagersync --no-pager
      journalctl -u lagersync -n 5 --no-pager
      # strace zeigt, welche Dateien das Programm sucht; -f folgt auch Kindprozessen.
      strace -f -e trace=file /usr/local/bin/lagersync 2>&1 | tail -n 3
      # statx(… "/usr/local/bin/../etc/lagersync.conf" …) = -1 ENOENT: gesucht neben dem Programm, nicht unter /opt/lager
      ls -l /usr/local/bin/lagersync /opt/lager/bin/lagersync
      # Eine Kopie statt eines Links. lagersync sucht seine Dateien relativ zum eigenen Pfad.
      sudo ln -sf /opt/lager/bin/lagersync /usr/local/bin/lagersync
      # Erneut testen, und zwar als Dienstbenutzer, nicht als root:
      sudo -u lager strace -f -e trace=file /usr/local/bin/lagersync 2>&1 | tail -n 4
      # [pid …] openat(AT_FDCWD, "/opt/lager/bin/../etc/zugang.token", …) = -1 EACCES (Permission denied)
      ls -l /opt/lager/etc/
      sudo chgrp lager /opt/lager/etc/zugang.token
      sudo chmod 640 /opt/lager/etc/zugang.token
      sudo systemctl start lagersync.service
      ls -l /srv/lager/bestand.csv
    hints:
      - "Das Programm schweigt, also frag den Kernel: `strace -f -e trace=file /usr/local/bin/lagersync` zeigt jeden Dateizugriff. Lies von unten: Was geschah kurz vor `+++ exited with 1 +++`?"
      - "Wo sucht lagersync seine Konfiguration, und wo liegt sie? Vergleiche `ls -l /usr/local/bin/lagersync` mit `/opt/lager/bin/`. Das Programm bestimmt seinen Installationsort aus dem eigenen Pfad."
      - "Teste als der Benutzer, als der der Dienst läuft: `sudo -u lager strace -f -e trace=file /usr/local/bin/lagersync`. Ein `EACCES` in einer Zeile mit `[pid …]` stammt aus einem Kindprozess."
    explanation: |
      Zwei Fehler lagen hintereinander, und keiner erzeugt eine Meldung. Erstens hat das Update das Programm nach `/usr/local/bin` kopiert, statt es zu verlinken. lagersync bestimmt seinen Ort mit `readlink -f "$0"` und sucht die Konfiguration im Verzeichnis `../etc` daneben, also unter `/usr/local/etc`. strace zeigt den aufgelösten Pfad mit `ENOENT`. Das `ENOENT` für `~/.config/lagersync` davor ist kein Fehler, sondern ein optionaler Ort, den das Programm zuerst probiert.

      Zweitens darf `lager` das Token nicht lesen (`0600`, root). Das sieht nur, wer als Dienstbenutzer testet: Mit `sudo strace` läuft alles durch, weil root jede Datei lesen darf. Und nur mit `-f`, denn das Token liest ein `cat` in einem Kindprozess. `chgrp lager` plus `chmod 640` gibt genau dem Dienst Lesezugriff; `chown lager` mit `0600` wäre ebenso richtig.

      Allgemein: Wenn ein Programm still scheitert, zeigt `strace -f -e trace=file`, was es zuletzt versucht hat. Teste mit dem Benutzer, der Umgebung und dem Pfad, mit denen der Dienst wirklich startet.
    resources:
      - title: strace(1)
        url: https://man7.org/linux/man-pages/man1/strace.1.html
      - title: systemd.exec · User=
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#User=
  - id: incident-runbook
    type: practice
    title: Eine Störung nachvollziehbar abschließen
    prompt: Erzeuge in einer eigenen Testumgebung eine harmlose Fehlkonfiguration eines Demo-Dienstes, etwa einen falschen Konfigurationspfad. Dokumentiere Diagnose, kleinste Reparatur und erneute Nutzung. Verändere keinen fremden produktiven Dienst.
    lang: text
    solution: |
      Symptom: Demo-Dienst startet nach Pfadänderung nicht.
      Beleg: Unit zeigt /srv/demo/missing.conf; Journal meldet ENOENT.
      Hypothese: Falscher Pfad verhindert den Start.
      Prüfung: Vorhandene Testkonfiguration und Unitpfad vergleichen.
      Änderung: Nur den vorgesehenen Konfigurationspfad korrigieren.
      Verifikation: Unit geladen, Dienst aktiv, erwarteter Listener,
      fachlicher Demo-Aufruf erfolgreich, Daten unverändert.
      Vorbeugung: Konfigurationsprüfung und dokumentierter Smoke-Test.
    checklist:
      - Symptom, Zeitpunkt und erwartetes Verhalten sind konkret beschrieben.
      - Beobachtungen und Hypothesen sind getrennt.
      - Die Messung belegt die behauptete Ursache.
      - Die Änderung ist begrenzt und ein Rückweg ist dokumentiert.
      - Der ursprüngliche Nutzerpfad funktioniert nachweislich wieder.
      - Das Postmortem benennt mindestens eine passende Vorbeugung und offene Grenzen.
    explanation: Ein nachvollziehbarer Incident-Bericht ist eine technische Arbeitsprobe. Er zeigt, dass du aus wenigen Signalen eine überprüfbare Erklärung entwickeln und den Erfolg am richtigen Verhalten messen kannst.
