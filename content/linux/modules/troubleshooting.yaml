      curl -sS --max-time 5 https://app.example/health
    lines: [1]
    fix:
      - line: 1
        answers: ["curl --fail -sS --max-time 5 https://app.example/health", "curl -fsS --max-time 5 https://app.example/health", "curl -sS --fail --max-time 5 https://app.example/health", "curl --fail-with-body -sS --max-time 5 https://app.example/health"]
    explanation: curl trennt Übertragungserfolg vom HTTP-Status. `--fail` beziehungsweise `--fail-with-body` macht passende HTTP-Fehler für den aufrufenden Ablauf sichtbar.
