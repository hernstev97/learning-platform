  - id: healthcheck-fehler
    type: bug
    title: HTTP 500 wird als Erfolg gemeldet
    prompt: Dieser Healthcheck endet bei einer vollständig übertragenen HTTP-500-Antwort mit Status 0. Ergänze curl so, dass HTTP-Fehler einen Fehlerstatus liefern; behalte die übrigen Optionen bei.
