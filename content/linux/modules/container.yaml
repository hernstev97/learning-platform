  - id: speicher-scope
    type: command
    title: Ein Import mit Speichergrenze
    prompt: Starte `./import.sh` aus dem aktuellen Verzeichnis als transiente Scope-Unit von systemd, die höchstens 256 MiB Arbeitsspeicher bekommt. Du brauchst dafür `sudo`.
    answers:
      - sudo systemd-run --scope -p MemoryMax=256M ./import.sh
      - sudo systemd-run -p MemoryMax=256M --scope ./import.sh
      - sudo systemd-run --scope --property=MemoryMax=256M ./import.sh
      - sudo systemd-run --property=MemoryMax=256M --scope ./import.sh
      - sudo systemd-run --scope --property MemoryMax=256M ./import.sh
      - sudo systemd-run --property MemoryMax=256M --scope ./import.sh
      - sudo systemd-run --scope -p MemoryMax=256M -- ./import.sh
    output: |
      Running scope as unit: run-r3f0c1e9a2b7d4c58a6e1f0b9d2c4a7e1.scope
    explanation: |
      `systemd-run --scope` legt eine neue cgroup an, verschiebt sich selbst hinein und startet dann `./import.sh` im Vordergrund, mit deinem Arbeitsverzeichnis und deiner Umgebung. `-p MemoryMax=256M` landet als 268435456 Bytes in `memory.max` dieser cgroup; systemd rechnet mit 1024er-Einheiten. Ohne `--scope` würde systemd eine Dienst-Unit anlegen, die PID 1 im Hintergrund startet. Docker setzt mit `docker run --memory=256m` dieselbe Grenze für die cgroup eines Containers.
    resources:
      - title: systemd-run(1) · --scope
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd-run.html#--scope
      - title: systemd.resource-control(5) · MemoryMax=
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.resource-control.html#MemoryMax=bytes
