    type: bug
    title: Der veröffentlichte Port erreicht nichts
    prompt: Die App lauscht im Container auf 8000. Auf dem Host soll sie ausschließlich unter 127.0.0.1:8080 erreichbar sein. Korrigiere die vertauschte Portzuordnung.
