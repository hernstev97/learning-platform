  - id: bereitschaft
    type: explain
    title: Startreihenfolge und Bereitschaft
    prompt: Erkläre diesen Ausschnitt. Der Dienst db besitzt einen passenden Healthcheck. Welche Störung muss die API trotzdem selbst behandeln?
    lang: yaml
    code: |
      services:
        api:
          depends_on:
            db:
              condition: service_healthy
    points:
      - Compose wartet beim Start auf den erfolgreichen Healthcheck von db.
      - Ohne service_healthy wäre Startreihenfolge kein Nachweis der Bereitschaft.
      - Ein späterer Datenbankausfall bleibt möglich.
      - Die API braucht Wiederverbindung, sinnvolle Fehlerantworten und begrenzte Wiederholungen.
    explanation: Der Healthcheck reduziert eine Start-Race-Condition. Er ist keine dauerhafte Verfügbarkeitsgarantie und repariert keine bereits offenen Datenbankverbindungen.
    resources:
      - title: Compose · Startup order
        url: https://docs.docker.com/compose/how-tos/startup-order/
  - id: dienst-begrenzen
    type: scenario
    title: Die Grenze, die nicht greift
    prompt: |
      Ticket OPS-1432, zweiter Anlauf: Der Berichtsdienst `report-worker` hat vorletzte Nacht den Arbeitsspeicher von `web01` gefüllt, der OOM-Killer hat dabei `sshd` erwischt. Jan hat danach eine Speichergrenze für den Dienst eingetragen. Letzte Nacht stieg der Verbrauch trotzdem wieder ungebremst.

      Sorge dafür, dass `report-worker` höchstens 64 MiB Arbeitsspeicher und höchstens 20 % einer CPU bekommt, also das, was `docker run --memory=64m --cpus=0.2` für einen Container täte. Die Grenzen sollen sofort für den laufenden Dienst gelten und dauerhaft bleiben. Die Unit-Datei unter `/lib/systemd/system/` stammt aus dem Paket und wird beim nächsten Update überschrieben. Der Dienst soll weiterlaufen.
    setup: |
      set -e
      mkdir -p /var/lib/report-worker
      cat > /usr/bin/report-worker <<'EOF'
      #!/bin/sh
      # report-worker 2.4.1: baut nachts die Monatsberichte, tagsüber nur ein Lebenszeichen
      while :; do
        date '+%F %T' > /var/lib/report-worker/heartbeat
        sleep 10
      done
      EOF
      chmod 755 /usr/bin/report-worker
      cat > /lib/systemd/system/report-worker.service <<'EOF'
      [Unit]
      Description=Berichtsgenerator (report-worker)
      After=network.target

      [Service]
      ExecStart=/usr/bin/report-worker
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
      EOF
      mkdir -p /etc/systemd/system/report-worker.service.d
      cat > /etc/systemd/system/report-worker.service.d/limits.conf <<'EOF'
      # OPS-1432: report-worker hat nachts den Speicher gefüllt, Grenze gesetzt (jk)
      [Unit]
      MemoryMax=64M
      EOF
      ln -s /lib/systemd/system/report-worker.service /etc/systemd/system/multi-user.target.wants/report-worker.service
      systemctl daemon-reload
      systemctl start report-worker.service
    checks:
      - name: report-worker läuft und startet beim Boot
        run: systemctl is-enabled report-worker && systemctl is-active report-worker
      - name: Der laufende Dienst hat höchstens 64 MiB Arbeitsspeicher (memory.max)
        run: |
          m=$(cat /sys/fs/cgroup/system.slice/report-worker.service/memory.max 2>/dev/null)
          echo "memory.max: ${m:-fehlt}"
          [ -n "$m" ] && [ "$m" != max ] && [ "$m" -le 67108864 ]
      - name: Der laufende Dienst hat höchstens 20 % einer CPU (cpu.max)
        run: |
          c=$(cat /sys/fs/cgroup/system.slice/report-worker.service/cpu.max 2>/dev/null)
          echo "cpu.max: ${c:-fehlt, keine CPU-Grenze}"
          q=${c%% *}; p=${c##* }
          [ -n "$c" ] && [ "$q" != max ] && [ $((q * 100 / p)) -le 20 ]
      - name: Beide Grenzen gelten auch nach daemon-reload und Neustart des Dienstes
        run: |
          systemctl daemon-reload && systemctl restart report-worker && sleep 1
          cg=/sys/fs/cgroup/system.slice/report-worker.service
          m=$(cat $cg/memory.max 2>/dev/null)
          c=$(cat $cg/cpu.max 2>/dev/null)
          echo "memory.max: ${m:-fehlt}, cpu.max: ${c:-fehlt}"
          q=${c%% *}; p=${c##* }
          [ -n "$m" ] && [ "$m" != max ] && [ "$m" -le 67108864 ] && [ -n "$c" ] && [ "$q" != max ] && [ $((q * 100 / p)) -le 20 ]
    solution: |
      # Was gilt gerade? MemoryMax=infinity, obwohl es ein Drop-in gibt
      systemctl status report-worker --no-pager
      systemctl show -p MemoryMax,CPUQuotaPerSecUSec report-worker
      systemctl cat report-worker --no-pager
      # PID 1 hat den Schlüssel beim Laden ignoriert, er steht im falschen Abschnitt:
      journalctl -b --no-pager | grep 'report-worker.service.d'
      # Ressourcengrenzen gehören nach [Service]; die CPU-Grenze kommt dazu
      printf '[Service]\nMemoryMax=64M\nCPUQuota=20%%\n' | sudo tee /etc/systemd/system/report-worker.service.d/limits.conf
      sudo systemctl daemon-reload
      # daemon-reload überträgt die Werte sofort in die cgroup des laufenden Dienstes
      systemctl show -p MemoryMax,CPUQuotaPerSecUSec report-worker
      cat /sys/fs/cgroup/system.slice/report-worker.service/memory.max /sys/fs/cgroup/system.slice/report-worker.service/cpu.max
    hints:
      - "Was gilt gerade? `systemctl show -p MemoryMax,CPUQuotaPerSecUSec report-worker` zeigt die Werte, die systemd tatsächlich verwendet."
      - "`systemctl cat report-worker` zeigt Unit und Drop-ins zusammen. Was PID 1 beim Laden ignoriert hat, steht im Journal: `journalctl -b | grep report-worker`."
      - "Ressourcengrenzen regeln, wie der Prozess läuft, und gehören in den Abschnitt `[Service]`. Danach `sudo systemctl daemon-reload` und ein Blick nach `/sys/fs/cgroup/system.slice/report-worker.service/`."
    explanation: |
      Jans Drop-in lag am richtigen Ort, aber `MemoryMax=` stand im Abschnitt `[Unit]`. Dort kennt systemd den Schlüssel nicht, ignoriert ihn und meldet das nur beim Laden im Journal: „Unknown key 'MemoryMax' in section [Unit], ignoring.“ `systemctl show` zeigt es sofort mit `MemoryMax=infinity`. Im Abschnitt `[Service]` schreibt systemd `MemoryMax=64M` als 67108864 in `memory.max` der cgroup und `CPUQuota=20%` als `20000 100000` in `cpu.max`, also 20 ms Rechenzeit je 100 ms. Nach `daemon-reload` gelten die Werte sofort, ein Neustart des Dienstes ist nicht nötig.

      `sudo systemctl set-property report-worker MemoryMax=64M CPUQuota=20%` wäre ebenso richtig: Es legt eigene Drop-ins unter `/etc/systemd/system.control/` an und wendet sie gleich an. Docker macht mit `--memory` und `--cpus` dasselbe für die cgroup eines Containers.
    resources:
      - title: systemd.resource-control(5) · MemoryMax=
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.resource-control.html#MemoryMax=bytes
      - title: systemd.resource-control(5) · CPUQuota=
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.resource-control.html#CPUQuota=
      - title: Kernel · cgroup v2, CPU
        url: https://docs.kernel.org/admin-guide/cgroup-v2.html#cpu-interface-files
  - id: web-container
    type: practice
    title: Eine kleine Website reproduzierbar ausliefern
    prompt: Erzeuge site/index.html, Dockerfile, .dockerignore und compose.yaml nach dem statischen Beispiel. Teste Build, Loopback-Erreichbarkeit, Healthcheck, Laufzeitbenutzer und Neustart. Python http.server dient hier nur als Lernserver.
    lang: yaml
    solution: |
      services:
        web:
          build: .
          image: learn-web:1.0
          ports: ["127.0.0.1:8080:8000"]
          restart: unless-stopped
          healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
            interval: 10s
            timeout: 3s
            retries: 3
    checklist:
      - Dockerfile kopiert nur site und startet die Anwendung per Exec-Form.
      - Der Prozess läuft als UID 10001 statt root.
      - docker compose config und der Imagebuild gelingen.
      - localhost Port 8080 liefert die eigene index.html aus.
      - Der Container erreicht healthy und bleibt nach einem kontrollierten Neustart nutzbar.
      - .dockerignore schließt Git-Daten und Secrets aus.
      - README nennt Start, Prüfung und Aufräumen ohne pauschales Löschen von Volumes.
    explanation: Die Aufgabe verbindet Buildbeschreibung mit Betriebsnachweisen. Eine vorhandene compose.yaml allein belegt weder richtige Portbindung noch einen gesunden Prozess.
