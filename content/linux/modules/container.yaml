id: container
title: Container mit Docker & Podman
level: 3
minutes: 230
summary: Du verpackst einen kleinen Dienst reproduzierbar, trennst Laufzeitdaten vom Image, prüfst Netzwerk, Startbereitschaft und Rechte und kennst die Kernel-Bausteine darunter.
goals:
  - Du erklärst Container als isolierte Prozesse mit gemeinsamem Kernel.
  - Du zeigst Namespaces und cgroups mit `unshare`, `lsns` und `systemd-run` und begrenzt Speicher und CPU eines Dienstes über seine cgroup.
  - Du unterscheidest Images, Container, Volumes und Bind-Mounts.
  - Du schreibst ein Dockerfile und eine Compose-Datei mit überprüfbaren Betriebsanforderungen.
  - Du diagnostizierst Start-, Port- und Berechtigungsfehler und kennst die Grenzen der Isolation.
