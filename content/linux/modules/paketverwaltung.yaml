id: paketverwaltung
title: Paketverwaltung
level: 1
minutes: 190
summary: Was ein Paketmanager wirklich tut, wie du mit apt und pacman sicher installierst, aktualisierst und aufräumst – und was du tust, wenn dpkg hängt, eine Bibliothek fehlt oder ein Update etwas kaputt macht.
goals:
  - Du erklärst, was Repositories, Abhängigkeiten, Signaturen und Transaktionen leisten, und behebst `NO_PUBKEY` mit einem Schlüssel unter `/etc/apt/keyrings` und `Signed-By`.
  - Du installierst, aktualisierst, suchst und entfernst Pakete mit `apt` (Debian/Ubuntu) und `pacman` (Arch/CachyOS) und kennst die Unterschiede zwischen `update`, `upgrade` und `full-upgrade`.
  - Du begründest, warum Teil-Updates auf Arch nicht unterstützt werden, und liest einen PKGBUILD, bevor du ein AUR-Paket baust.
  - Du liest Paketzustände in `dpkg -l` und `dpkg --audit` und bringst ein halb konfiguriertes Paket mit `dpkg --configure -a` in Ordnung.
  - Du findest mit `ldd` heraus, welche Bibliothek einem Programm fehlt, und machst sie dem Loader über `/etc/ld.so.conf.d` und `ldconfig` bekannt.
  - Du holst nach einem kaputten Update die vorige Version zurück und hältst sie mit `apt-mark hold`, Pinning oder `IgnorePkg` fest.
