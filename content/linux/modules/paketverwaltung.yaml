  d=$(mktemp -d)/shop-motd; mkdir -p "$d/DEBIAN"
  printf 'Package: shop-motd\nVersion: 1.0-1\nArchitecture: all\nMaintainer: Plattform-Team <plattform@shop.example>\nDescription: Begrüßungstext für web01\n' > "$d/DEBIAN/control"
