  #!/bin/sh
  set -e
  standort=$(cat /etc/shop/standort)
  echo "web01 - Shop - Standort $standort" > /etc/motd
  P
  chmod 755 "$d/DEBIAN/postinst"
  install -d -o ops -g ops /home/ops/pakete
  dpkg-deb --root-owner-group -b "$d" /home/ops/pakete/shop-motd_1.0-1_all.deb > /dev/null
  chown ops:ops /home/ops/pakete/shop-motd_1.0-1_all.deb
lesson: |
  Im Onboarding sollst du auf einem Ubuntu-Server PostgreSQL, nginx und Node.js einrichten. Die Anleitung im Wiki des Teams ist drei Jahre alt: Sie nutzt `apt-key add`, lädt ein `.deb` von einer Webseite und installiert Node aus einem `curl … | sudo bash`-Skript. Auf deinem CachyOS-Desktop wiederum schlägt ein Forum vor, `sudo pacman -Sy` und dann das gesuchte Paket zu installieren. Beides funktioniert oft – bis es an einer Stelle bricht, die schwer zu finden ist.

  Dieses Modul erklärt, was ein Paketmanager im Hintergrund erledigt. Wer das versteht, erkennt, warum manche Anleitungen gefährlich sind, und wählt für jede Software die richtige Quelle. Danach geht es um den Betrieb: ein Paket, das bei der Installation hängen bleibt, eine Bibliothek, die der Loader nicht findet, und ein Update, das du zurücknehmen musst.

  Die Beispiele mit „Im Terminal“ laufen in einem Debian 12. Dort ist ein internes Repository `apt.shop.internal` eingebunden, aus dem du Pakete installieren, zurückstufen und festhalten kannst.

  ## Was ein Paketmanager leistet

  Ein **Paket** ist ein Archiv mit Dateien (Programme, Bibliotheken, Doku, Standardkonfiguration) plus Metadaten: Name, Version, Abhängigkeiten, Konflikte, Skripte für Installation und Entfernung. Der **Paketmanager** kümmert sich um fünf Dinge:

  1. **Repositories.** Er kennt Server, die Pakete und einen Index darüber anbieten, und lädt zuerst den Index (die Paketdatenbank), dann die Pakete.
  2. **Abhängigkeiten.** Braucht nginx die Bibliothek OpenSSL, installiert er sie mit – in einer passenden Version. Umgekehrt verweigert er, eine Bibliothek zu entfernen, die noch jemand braucht.
  3. **Signaturen.** Jedes Paket oder der Index ist mit dem Schlüssel der Distribution signiert. Der Paketmanager prüft, dass das Paket unterwegs weder verändert noch ausgetauscht wurde ([ArchWiki · Package signing](https://wiki.archlinux.org/title/Pacman/Package_signing), [Debian · SecureApt](https://wiki.debian.org/SecureApt)).
  4. **Buchführung.** Er merkt sich jede installierte Datei. Deshalb kann er sauber deinstallieren und dir sagen, welchem Paket `/usr/bin/dig` gehört.
  5. **Transaktionen.** Ein Update wird vorher komplett geplant: Konflikte, Plattenplatz, Signaturen. Erst wenn alles passt, werden Dateien ersetzt.

  Das Denkmodell dahinter: Eine Distribution ist ein **aufeinander abgestimmter Satz** von Paketen. Die Pakete eines Repository-Stands wurden gegeneinander gebaut und getestet. Jedes Mal, wenn du Software an diesem System vorbei installierst, verlässt du dieses geprüfte Zusammenspiel.

  Wohin die Dateien gehen, ist ebenfalls festgelegt ([hier(7)](https://man7.org/linux/man-pages/man7/hier.7.html), [file-hierarchy(7)](https://www.freedesktop.org/software/systemd/man/latest/file-hierarchy.html)):

  | Pfad | Inhalt | Wer schreibt dorthin |
  | --- | --- | --- |
  | `/usr/bin`, `/usr/lib` | Programme, Bibliotheken | nur der Paketmanager |
  | `/usr/share` | Doku, Icons, Daten | nur der Paketmanager |
  | `/etc` | systemweite Konfiguration | Paketmanager (Standard) und Admin |
  | `/var/lib`, `/var/log`, `/var/cache` | Zustand, Logs, Caches von Diensten | Dienste zur Laufzeit |
  | `/usr/local` | selbst kompilierte Software | du, per `make install` |
  | `/opt` | große Fremdpakete in einem eigenen Verzeichnis | Hersteller-Installer |
  | `~/.local/bin` | Programme nur für deinen Benutzer | du, `pipx`, `cargo install` usw. |

  ## apt auf Debian und Ubuntu

  Auf Servern triffst du meist Debian oder Ubuntu und damit [`apt`](https://manpages.debian.org/trixie/apt/apt.8.en.html). Die wichtigste Unterscheidung ist die zwischen **Index** und **Paketen**:

  ```console
  $ sudo apt update             # nur den Index neu laden – installiert nichts
  $ apt list --upgradable       # was gäbe es Neues?
  $ sudo apt upgrade            # installierte Pakete aktualisieren, nie etwas entfernen
  $ sudo apt full-upgrade       # darf Pakete entfernen, wenn das Update es verlangt
  ```

  `apt upgrade` darf neue Abhängigkeiten nachinstallieren, entfernt aber nie ein installiertes Paket. Verlangt ein Update das (etwa weil ein Paket umbenannt wurde), bleibt es zurückgehalten, und du brauchst `full-upgrade`. Das ältere `apt-get upgrade` ist noch vorsichtiger und installiert nicht einmal neue Pakete.

  ```console
  $ apt search ripgrep          # in Namen und Beschreibungen suchen
  $ apt show nginx              # Version, Abhängigkeiten, Beschreibung
  $ sudo apt install nginx      # installieren (inklusive Abhängigkeiten)
  $ sudo apt remove nginx       # Programmdateien entfernen, /etc/nginx bleibt
  $ sudo apt purge nginx        # zusätzlich die Konfigurationsdateien entfernen
  $ sudo apt autoremove         # nicht mehr benötigte Abhängigkeiten entfernen
  ```

  `apt` ist für Menschen gedacht; seine Ausgabe kann sich ändern, und bei Umleitung in eine Pipe warnt es davor. In Skripten und Dockerfiles nimmst du deshalb [`apt-get`](https://manpages.debian.org/trixie/apt/apt-get.8.en.html), dessen Schnittstelle stabil bleibt.

  Unter apt arbeitet `dpkg`. Es kennt keine Repositories, nur `.deb`-Dateien und installierte Pakete, und führt darüber Buch in `/var/lib/dpkg`. Seine Abfragen brauchen deshalb kein Netz:

  ```console vm
  $ dpkg -l curl nginx
  Desired=Unknown/Install/Remove/Purge/Hold
  | Status=Not/Inst/Conf-files/Unpacked/halF-conf/Half-inst/trig-aWait/Trig-pend
  |/ Err?=(none)/Reinst-required (Status,Err: uppercase=bad)
  ||/ Name           Version            Architecture Description
  +++-==============-==================-============-=======================================================
  ii  curl           7.88.1-10+deb12u15 i386         command line tool for transferring data with URL syntax
  ii  nginx          1.22.1-9+deb12u10  i386         small, powerful, scalable web/proxy server
  $ dpkg -S /usr/sbin/nginx
  nginx: /usr/sbin/nginx
  $ dpkg -L curl | grep bin/
  /usr/bin/curl
  $ dpkg-query -W -f '${Package} ${Version}\n' curl nginx
  curl 7.88.1-10+deb12u15
  nginx 1.22.1-9+deb12u10
  ```

  Die zwei Buchstaben vor dem Namen sind Soll- und Ist-Zustand: `ii` heißt „soll installiert sein, ist installiert“. `dpkg -S` findet das Paket zu einer Datei, `dpkg -L` die Dateien eines Pakets. `dpkg-query -W -f` liefert dieselben Daten in einem Format, das du in Skripten weiterverarbeiten kannst ([dpkg-query(1)](https://manpages.debian.org/bookworm/dpkg/dpkg-query.1.en.html)).

  Auf Fedora und RHEL heißt der Paketmanager `dnf` (seit Fedora 41 als [dnf5](https://dnf5.readthedocs.io/en/latest/)). Die Begriffe übertragen sich: `sudo dnf upgrade` aktualisiert, `sudo dnf install nginx` installiert, `dnf provides /usr/bin/dig` findet das zuständige Paket.

  ## Signierte Quellen: Signed-By und NO_PUBKEY

  apt vertraut einem Repository über eine Kette von Prüfsummen. Die Datei `InRelease` enthält die Prüfsumme jeder Paketliste, jede Paketliste die Prüfsumme jedes `.deb`. Signiert ist nur `InRelease`. Passt die Signatur, ist damit die ganze Kette bis zum einzelnen Paket gesichert ([Debian Wiki · SecureApt](https://wiki.debian.org/SecureApt)).

  Fremde Repositories bindest du mit einem eigenen Schlüssel ein, der **nur** für dieses Repository gilt. Das deb822-Format in `/etc/apt/sources.list.d/*.sources` macht das mit `Signed-By` sichtbar ([sources.list(5)](https://manpages.debian.org/bookworm/apt/sources.list.5.en.html)). Die Schlüsseldatei gehört seit apt 2.4 nach `/etc/apt/keyrings` ([apt-key(8)](https://manpages.debian.org/bookworm/apt/apt-key.8.en.html)). So ist das interne Repository im Terminal eingebunden:

  ```console vm
  $ cat /etc/apt/sources.list.d/shop.sources
  Types: deb
  URIs: http://apt.shop.internal/debian
  Suites: bookworm
  Components: main
  Signed-By: /etc/apt/keyrings/shop.asc
  $ ls /etc/apt/keyrings
  shop.asc
  $ sudo apt update
  Get:1 http://apt.shop.internal/debian bookworm InRelease [528 B]
  Fetched 528 B in 1s (471 B/s)
  Reading package lists... Done
  Building dependency tree... Done
  Reading state information... Done
  All packages are up to date.
  ```

  Das veraltete `apt-key add` hat Schlüssel global vertrauenswürdig gemacht: Ein Schlüssel für das Docker-Repository hätte dann auch Pakete für das Debian-Repository signieren dürfen. In Debian 12 ist `apt-key` als veraltet markiert, Debian 13 enthält es nicht mehr. Findest du `apt-key` in einer Anleitung, ist sie veraltet.

  Fehlt der passende Schlüssel, nennt apt die ID des Schlüssels, mit dem `InRelease` signiert ist. Beim ersten Einbinden bricht `apt update` ab:

  ```console
  $ sudo apt update
  Get:1 http://apt.shop.internal/debian bookworm InRelease [528 B]
  Err:1 http://apt.shop.internal/debian bookworm InRelease
    The following signatures couldn't be verified because the public key is not available: NO_PUBKEY A11A0C0FC9C4B70D
  Reading package lists... Done
  W: GPG error: http://apt.shop.internal/debian bookworm InRelease: The following signatures couldn't be verified because the public key is not available: NO_PUBKEY A11A0C0FC9C4B70D
  E: The repository 'http://apt.shop.internal/debian bookworm InRelease' is not signed.
  N: Updating from such a repository can't be done securely, and is therefore disabled by default.
  N: See apt-secure(8) manpage for repository creation and user configuration details.
  ```

  Drei Ursachen führen zu genau dieser Meldung: Der Schlüssel fehlt, `Signed-By` zeigt auf eine Datei, die es nicht gibt, oder die Datei hat das falsche Format. apt 2.6 (Debian 12) erwartet in einer Datei mit der Endung `.asc` den Schlüssel als Text (`-----BEGIN PGP PUBLIC KEY BLOCK-----`) und in einer `.gpg`-Datei das Binärformat. Wer den Textschlüssel des Herstellers als `hersteller.gpg` speichert, bekommt `NO_PUBKEY`, obwohl der richtige Schlüssel daliegt. Benenne die Datei dann in `.asc` um, oder wandle sie mit `gpg --dearmor` ins Binärformat.

  Heikler ist ein Repository, das schon eingebunden war und plötzlich nicht mehr passt, etwa weil der Hersteller seinen Schlüssel gewechselt hat. Dann warnt apt nur, arbeitet mit den alten Paketlisten weiter und endet mit Exit-Code 0. Ein Cronjob oder eine CI-Pipeline merkt davon nichts, und Sicherheitsupdates aus diesem Repository kommen nicht mehr an:

  ```console vm
  $ sudo mv /etc/apt/keyrings/shop.asc /root/
  $ sudo apt update
  Get:1 http://apt.shop.internal/debian bookworm InRelease [528 B]
  Err:1 http://apt.shop.internal/debian bookworm InRelease
    The following signatures couldn't be verified because the public key is not available: NO_PUBKEY A11A0C0FC9C4B70D
  …
  All packages are up to date.
  W: An error occurred during the signature verification. The repository is not updated and the previous index files will be used. GPG error: http://apt.shop.internal/debian bookworm InRelease: The following signatures couldn't be verified because the public key is not available: NO_PUBKEY A11A0C0FC9C4B70D
  W: Failed to fetch http://apt.shop.internal/debian/dists/bookworm/InRelease  The following signatures couldn't be verified because the public key is not available: NO_PUBKEY A11A0C0FC9C4B70D
  W: Some index files failed to download. They have been ignored, or old ones used instead.
  $ echo $?
  0
  $ sudo mv /root/shop.asc /etc/apt/keyrings/
  ```

  Debian 13 prüft Signaturen mit `sqv` statt mit `gpgv`. Die Meldungen lauten dort anders, die Ursachen sind dieselben.

  ## pacman auf Arch und CachyOS

  [`pacman`](https://man.archlinux.org/man/pacman.8) arbeitet mit Großbuchstaben für die **Operation** und Kleinbuchstaben für **Optionen**: `-S` (sync, aus den Repositories), `-R` (remove), `-Q` (query, lokal installierte Pakete).

  ```console
  $ sudo pacman -Syu            # Datenbanken synchronisieren (y) und alles aktualisieren (u)
  $ sudo pacman -S ripgrep      # installieren
  $ pacman -Ss json             # in den Repositories suchen
  $ pacman -Qi openssh          # Infos zum installierten Paket
  $ pacman -Ql openssh          # Dateien des Pakets
  $ pacman -Qo /usr/bin/dig     # welches Paket besitzt die Datei?
  /usr/bin/dig is owned by bind 9.20.29-1.1
  $ sudo pacman -Rns neovim     # entfernen samt unbenötigter Abhängigkeiten, ohne .pacsave
  $ pacman -Qdt                 # Waisen: als Abhängigkeit installiert, von niemandem gebraucht
  ```

  `-Rns` ist die gründliche Variante: `-s` entfernt rekursiv Abhängigkeiten, die nichts anderes braucht und die du nicht selbst ausdrücklich installiert hast; `-n` löscht geänderte Konfigurationsdateien, statt sie als `.pacsave` zu sichern. `pacman -Qi` zeigt im Feld `Install Reason`, ob du ein Paket selbst installiert hast oder ob es als Abhängigkeit kam. Genau darauf beruht `-Qdt` (`-d` Abhängigkeiten, `-t` von keinem Paket benötigt) ([ArchWiki · Querying package databases](https://wiki.archlinux.org/title/Pacman#Querying_package_databases)).

  ### Warum Teil-Updates verboten sind

  Arch ist eine Rolling-Release-Distribution: Die Repositories enthalten immer genau **einen** aktuellen Stand, und alle Pakete darin sind gegen dieselben Bibliotheksversionen gebaut. `pacman -Sy paket` lädt die neue Datenbank, installiert das neue `paket` – aber aktualisiert nicht den Rest. Bringt das neue Paket eine neuere Version einer gemeinsam genutzten Bibliothek mit, laufen andere, alte Programme gegen eine Bibliothek, für die sie nie gebaut wurden. Das Ergebnis sind Fehler wie `error while loading shared libraries` oder `version … not found`, oft in Programmen, die du gar nicht angefasst hast.

  Deshalb gilt ([ArchWiki · Partial upgrades are unsupported](https://wiki.archlinux.org/title/System_maintenance#Partial_upgrades_are_unsupported)): Wer die Datenbank mit `-y` synchronisiert, aktualisiert im selben Zug das ganze System mit `-u`. Also `sudo pacman -Syu` oder, wenn du gleichzeitig etwas installieren willst, `sudo pacman -Syu paket`. `pacman -S paket` ohne `-y` ist dagegen unproblematisch, weil es zur lokalen, stimmigen Datenbank passt.

  > [!WARNING] Konfigurationsdateien nach Updates
  > Hast du eine Datei in `/etc` angepasst und das Update bringt eine neue Version mit, überschreibt pacman deine Fassung nicht, sondern legt die neue als `.pacnew` daneben. Diese Dateien musst du selbst zusammenführen, zum Beispiel mit `pacdiff` aus `pacman-contrib` ([ArchWiki · Pacnew and Pacsave](https://wiki.archlinux.org/title/Pacman/Pacnew_and_Pacsave)). Debian fragt stattdessen interaktiv, ob du die neue Version übernehmen willst.

  > [!TIP] Snapshots vor jedem Update
  > CachyOS mit btrfs kann vor jeder pacman-Transaktion automatisch einen Snapshot anlegen (etwa mit `snapper` und `snap-pac`). Geht ein Update schief, bootest du den vorherigen Stand. Prüfe mit `pacman -Q snap-pac`, ob das bei dir eingerichtet ist.

  ## AUR, paru und das Vertrauensproblem

  Das [Arch User Repository](https://wiki.archlinux.org/title/Arch_User_Repository) enthält keine Pakete, sondern **Bauanleitungen**: `PKGBUILD`-Dateien, die Benutzer hochladen. Ein [PKGBUILD](https://wiki.archlinux.org/title/PKGBUILD) ist ein Bash-Skript. Es beschreibt, woher der Quellcode kommt (`source`), wie er geprüft wird (`sha256sums`), wie er gebaut wird (`build()`) und welche Dateien ins Paket gehören (`package()`). `makepkg` führt es aus und erzeugt ein Paket, das pacman installiert.

  AUR-Helfer wie [paru](https://github.com/Morganamilo/paru) oder `yay` automatisieren das: `paru -S paketname` lädt den PKGBUILD, baut und installiert, `paru` allein führt ein komplettes `-Syu` inklusive AUR-Paketen aus.

  Der Preis: Niemand prüft AUR-Pakete vorab. Jeder kann ein Konto anlegen und ein Paket hochladen, und ein PKGBUILD kann beim Bauen beliebigen Code mit deinen Benutzerrechten ausführen. Es hat bereits AUR-Pakete mit Schadcode gegeben. Deshalb liest du vor dem ersten Bau und nach jedem Update den PKGBUILD – paru zeigt ihn dir dafür an. Achte auf:

  - `source` zeigt auf die offizielle Projektseite, nicht auf einen unbekannten Server oder Fork.
  - Keine zusätzlichen `curl`- oder `wget`-Aufrufe in `build()` oder `package()`, kein `install=`-Skript, das etwas nachlädt.
  - Plausible Änderungen beim Update – paru zeigt dir den Diff.
  - Popularität, Stimmen und Kommentare auf der AUR-Seite als Zusatzsignal, nicht als Beweis.

  > [!INTERVIEW] „Wie installierst du Software, die nicht im Repository ist?“
  > Zuerst prüfen, ob es ein offizielles Paket gibt, dann ein offizielles Fremd-Repository des Herstellers mit eigenem, per `Signed-By` gebundenem Schlüssel. Für Desktop-Programme ist Flatpak eine gute Wahl, weil es in einer Sandbox läuft. Auf Arch nutze ich das AUR, lese aber den PKGBUILD, weil dort nichts geprüft wird. Selbst kompilieren nur, wenn es keinen anderen Weg gibt – und dann nach `/usr/local` oder als eigenes Paket. `curl | sudo bash` vermeide ich, weil ich damit Code ungeprüft als root ausführe.

  ## Flatpak und selbst bauen

  **Flatpak** bringt Desktop-Anwendungen mit eigenen Laufzeitbibliotheken, unabhängig von der Distribution. Die Anwendung läuft in einer Sandbox und bekommt nur die Rechte, die sie deklariert ([Sandbox Permissions](https://docs.flatpak.org/en/latest/sandbox-permissions.html)). Vorteil: aktuelle Versionen auch auf einem alten Debian, Updates ohne Einfluss aufs System. Nachteil: mehr Speicherplatz, Integration ins System (Themes, Dateizugriff) manchmal holprig. Für Server und Kommandozeilenwerkzeuge ist Flatpak nicht gedacht.

  ```console
  $ flatpak install flathub org.gimp.GIMP
  $ flatpak run org.gimp.GIMP
  $ flatpak update
  $ flatpak uninstall --unused
  ```

  **Selbst bauen.** Der klassische Dreischritt für C-Projekte lautet:

  ```console
  $ ./configure --prefix=/usr/local
  $ make
  $ sudo make install
  ```

  `configure` prüft, ob Compiler und Bibliotheken vorhanden sind, und erzeugt das `Makefile`; `make` kompiliert; `make install` kopiert als root Dateien ins System. Genau hier liegt das Problem: Der Paketmanager weiß nichts von diesen Dateien. Es gibt kein sauberes Deinstallieren (außer das Projekt bietet `make uninstall`), keine automatischen Sicherheitsupdates, und installierst du später dieselbe Software als Paket, überschreiben sich die beiden womöglich gegenseitig. Deshalb gilt: Wenn schon selbst bauen, dann nach `/usr/local` (dort fasst der Paketmanager nichts an) – oder besser ein eigenes Paket bauen. Auf Arch ist das ein kurzer PKGBUILD, der genau diese drei Schritte mit `DESTDIR="$pkgdir"` ausführt; dann kennt pacman jede Datei.

  > [!PRAXIS] Pakete in Dockerfiles
  > In Container-Images siehst du fast immer dieses Muster: `RUN apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*`. `update` und `install` stehen in **einer** `RUN`-Anweisung, damit Docker keinen veralteten, gecachten Index wiederverwendet; `--no-install-recommends` hält das Image klein, und das Löschen der Listen spart weitere Megabytes ([Docker · Best practices](https://docs.docker.com/build/building/best-practices/)).

  ## Wenn dpkg hängen bleibt: Paketzustände

  dpkg installiert in zwei Phasen. Beim **Entpacken** schreibt es die Dateien des Pakets ins System. Beim **Konfigurieren** führt es das Skript `postinst` aus, das Benutzer anlegt, Dienste aktiviert oder Konfiguration erzeugt. Diese Maintainer-Skripte bleiben nach der Installation unter `/var/lib/dpkg/info/<paket>.postinst` liegen ([Debian Policy · Maintainer scripts](https://www.debian.org/doc/debian-policy/ch-maintainerscripts.html)). Scheitert ein Schritt, bleibt das Paket in einem Zwischenzustand stehen ([dpkg(1)](https://manpages.debian.org/bookworm/dpkg/dpkg.1.en.html)):

  | Zustand | `dpkg -l` | Bedeutung |
  | --- | --- | --- |
  | `installed` | `ii` | entpackt und konfiguriert |
  | `unpacked` | `iU` | Dateien liegen da, `postinst` lief noch nicht |
  | `half-configured` | `iF` | `postinst` ist gescheitert |
  | `half-installed` | `iH` | Entpacken oder Entfernen wurde unterbrochen |
  | `config-files` | `rc` | entfernt, nur die Konfiguration in `/etc` ist noch da |

  Das Paket `shop-motd` in `~/pakete` erwartet beim Konfigurieren eine Datei, die es auf diesem Server nicht gibt:

  ```console vm fails
  $ sudo dpkg -i ~/pakete/shop-motd_1.0-1_all.deb
  Selecting previously unselected package shop-motd.
  (Reading database ... 17802 files and directories currently installed.)
  Preparing to unpack .../pakete/shop-motd_1.0-1_all.deb ...
  Unpacking shop-motd (1.0-1) ...
  Setting up shop-motd (1.0-1) ...
  cat: /etc/shop/standort: No such file or directory
  dpkg: error processing package shop-motd (--install):
   installed shop-motd package post-installation script subprocess returned error exit status 1
  Errors were encountered while processing:
   shop-motd
  ```

  Das Entpacken hat geklappt, das Konfigurieren nicht. `dpkg --audit` (kurz `-C`) listet alle Pakete in einem Zwischenzustand. Es braucht root, weil es die Sperrdatei der Datenbank prüft:

  ```console vm
  $ dpkg -l shop-motd | tail -n 1
  iF  shop-motd      1.0-1        all          Begrüßungstext für web01
  $ sudo dpkg --audit
  The following packages are only half configured, probably due to problems
  configuring them the first time.  The configuration should be retried using
  dpkg --configure <package> or the configure menu option in dselect:
   shop-motd            Begrüßungstext für web01
  ```

  Solange ein Paket so hängt, versucht jeder apt-Aufruf, es mitzukonfigurieren. Auch ein `apt install` für ein ganz anderes Paket endet dann mit `E: Sub-process /usr/bin/dpkg returned an error code (1)`, obwohl das gewünschte Paket sauber installiert wurde. Die Reparatur folgt immer demselben Muster: Ursache aus der Fehlermeldung und dem Skript lesen, beheben, Konfiguration wiederholen.

  ```console vm
  $ cat /var/lib/dpkg/info/shop-motd.postinst
  #!/bin/sh
  set -e
  standort=$(cat /etc/shop/standort)
  echo "web01 - Shop - Standort $standort" > /etc/motd
  $ sudo mkdir -p /etc/shop
  $ echo Frankfurt | sudo tee /etc/shop/standort
  Frankfurt
  $ sudo dpkg --configure -a
  Setting up shop-motd (1.0-1) ...
  $ dpkg-query -W -f '${Status}\n' shop-motd
  install ok installed
  ```

  `dpkg --configure -a` konfiguriert alle Pakete, die noch nicht fertig sind. `sudo apt -f install` (`--fix-broken`) geht weiter: Es installiert fehlende Abhängigkeiten nach oder schlägt vor, Pakete mit unerfüllbaren Abhängigkeiten zu entfernen, etwa nach einem `dpkg -i` ohne die nötigen Bibliotheken. Gegen ein scheiterndes `postinst` hilft es nicht, denn es ruft dasselbe Skript noch einmal auf. Wurde dpkg mitten in der Arbeit abgebrochen (Stromausfall, geschlossene SSH-Sitzung), verweigert apt jede Aktion mit `E: dpkg was interrupted, you must manually run 'sudo dpkg --configure -a' to correct the problem.` – der erste Schritt ist derselbe.

  > [!WARNING] Nicht das Skript wegeditieren
  > In Foren steht oft, man solle die störende Zeile aus `/var/lib/dpkg/info/<paket>.postinst` löschen. dpkg meldet dann `ii`, aber was das Skript einrichten sollte (Benutzer, Verzeichnis, Dienst), fehlt weiterhin, und beim nächsten Update kommt das Skript ohnehin neu. Behebe die Ursache.

  ## Gemeinsame Bibliotheken: ld.so, SONAME und ldconfig

  Fast jedes Programm lädt beim Start Bibliotheken nach. Das erledigt der dynamische Loader `ld.so` (unter i386 `/lib/ld-linux.so.2`, unter x86_64 `/lib64/ld-linux-x86-64.so.2`). Er liest aus der Programmdatei, welche Bibliotheken sie verlangt, sucht sie und bindet sie ein ([ld.so(8)](https://man7.org/linux/man-pages/man8/ld.so.8.html)). `ldd` zeigt das Ergebnis dieser Suche:

  ```console vm
  $ ldd /usr/bin/curl | grep -E 'libcurl|libssl|ld-linux'
  	libcurl.so.4 => /lib/i386-linux-gnu/libcurl.so.4 (0xb7e50000)
  	libssl.so.3 => /lib/i386-linux-gnu/libssl.so.3 (0xb7a78000)
  	/lib/ld-linux.so.2 (0xb7f61000)
  $ ls -l /usr/lib/i386-linux-gnu/libcurl.so.4*
  lrwxrwxrwx 1 root root      0 May  8 16:16 /usr/lib/i386-linux-gnu/libcurl.so.4 -> libcurl.so.4.8.0
  -rw-r--r-- 1 root root 793964 May  8 16:16 /usr/lib/i386-linux-gnu/libcurl.so.4.8.0
  $ dpkg -S libcurl.so.4
  libcurl4:i386: /usr/lib/i386-linux-gnu/libcurl.so.4
  libcurl4:i386: /usr/lib/i386-linux-gnu/libcurl.so.4.8.0
  ```

  Links vom Pfeil steht der **SONAME**, der Name, unter dem das Programm die Bibliothek verlangt. Er enthält nur die Hauptversion: `libcurl.so.4` bleibt, solange neue Versionen zu alten Programmen passen. Die Datei selbst trägt die volle Version, ein symbolischer Link mit dem SONAME zeigt auf sie. Debian benennt Bibliothekspakete nach dem SONAME (`libcurl4`). Ändert sich die Hauptversion, entsteht ein neues Paket, und alte und neue Bibliothek können nebeneinander installiert sein ([Debian Policy · Shared libraries](https://www.debian.org/doc/debian-policy/ch-sharedlibs.html)).

  Der Loader sucht in dieser Reihenfolge: in den Verzeichnissen aus `LD_LIBRARY_PATH`, in Pfaden, die im Programm selbst stehen (`RUNPATH`), im Cache `/etc/ld.so.cache` und zuletzt in `/lib` und `/usr/lib`. Den Cache baut [`ldconfig`](https://man7.org/linux/man-pages/man8/ldconfig.8.html) aus den Verzeichnissen in `/etc/ld.so.conf` und `/etc/ld.so.conf.d/*.conf`. Dabei legt es auch fehlende SONAME-Links an. `ldconfig` liegt in `/sbin`, das im `PATH` normaler Benutzer fehlt:

  ```console vm
  $ cat /etc/ld.so.conf.d/*.conf
  # Multiarch support
  /usr/local/lib/i386-linux-gnu
  /lib/i386-linux-gnu
  /usr/lib/i386-linux-gnu
  /usr/local/lib/i686-linux-gnu
  /lib/i686-linux-gnu
  /usr/lib/i686-linux-gnu
  # libc default configuration
  /usr/local/lib
  $ /sbin/ldconfig -p | grep libcurl
  	libcurl.so.4 (libc6) => /lib/i386-linux-gnu/libcurl.so.4
  ```

  Findet der Loader eine Bibliothek nicht, startet das Programm gar nicht erst, und `ldd` zeigt `not found`:

  ```text
  /opt/acme/bin/acme-check: error while loading shared libraries: libacme.so.4: cannot open shared object file: No such file or directory
  ```

  Bringt Software unter `/opt` eigene Bibliotheken mit, trägst du das Verzeichnis in eine eigene Datei wie `/etc/ld.so.conf.d/acme.conf` ein und rufst `sudo ldconfig` auf. Dann findet jedes Programm die Bibliothek, egal wer es wie startet.

  > [!WARNING] LD_LIBRARY_PATH ist kein Fix
  > Die Variable wirkt nur in der Shell, die sie setzt, und in deren Kindprozessen. Ein Dienst unter systemd und ein Cronjob sehen sie nicht, `sudo` verwirft sie, Programme mit setuid ignorieren sie ganz. Und sie gilt für jedes Programm aus dieser Shell: Liegt im Verzeichnis eine andere `libssl.so.3`, lädt plötzlich auch `curl` die falsche. Zum Ausprobieren ist sie gut, als Dauerlösung nicht.

  > [!INTERVIEW] „Ein Programm meldet `error while loading shared libraries`. Wie gehst du vor?“
  > Mit `ldd` sehe ich, welche Bibliothek `not found` ist. Gehört sie zu einem Paket der Distribution, installiere ich es oder suche den Grund für die Versionsmischung, etwa ein Teil-Update. Bringt die Software sie selbst mit, prüfe ich, ob die Datei samt SONAME-Link da ist, trage das Verzeichnis unter `/etc/ld.so.conf.d` ein und rufe `ldconfig` auf. `LD_LIBRARY_PATH` nutze ich nur zum Testen.

  ## Downgrade und Versionen festhalten

  Ein Update macht etwas kaputt, der Fix kommt erst nächste Woche. Dann holst du die vorige Version zurück und verhinderst, dass das nächste Update sie wieder ersetzt. `apt-cache policy` zeigt, welche Versionen apt kennt und woher sie kommen:

  ```console vm fails
  $ apt-cache policy shopctl
  shopctl:
    Installed: (none)
    Candidate: 2.0.0-1
    Version table:
       2.0.0-1 500
          500 http://apt.shop.internal/debian bookworm/main i386 Packages
       1.4.2-1 500
          500 http://apt.shop.internal/debian bookworm/main i386 Packages
  $ sudo apt-get install -y shopctl
  …
  Setting up shopctl (2.0.0-1) ...
  $ shopctl report
  Lade Bestellungen ...
  Segmentation fault
  ```

  Eine bestimmte Version installierst du mit `paket=version`. Ist sie älter als die installierte, verlangt apt bei `-y` zusätzlich `--allow-downgrades`:

  ```console vm
  $ sudo apt-get install -y shopctl=1.4.2-1
  …
  The following packages will be DOWNGRADED:
    shopctl
  0 upgraded, 0 newly installed, 1 downgraded, 0 to remove and 0 not upgraded.
  E: Packages were downgraded and -y was used without --allow-downgrades.
  $ sudo apt-get install -y --allow-downgrades shopctl=1.4.2-1
  …
  dpkg: warning: downgrading shopctl from 2.0.0-1 to 1.4.2-1
  Preparing to unpack .../shopctl_1.4.2-1_all.deb ...
  Unpacking shopctl (1.4.2-1) over (2.0.0-1) ...
  Setting up shopctl (1.4.2-1) ...
  $ shopctl report
  Bestellungen heute: 42, davon offen: 3
  $ ls /var/cache/apt/archives/*.deb
  /var/cache/apt/archives/shopctl_1.4.2-1_all.deb
  /var/cache/apt/archives/shopctl_2.0.0-1_all.deb
  ```

  Bietet das Repository die alte Version nicht mehr an, hilft der Cache. `apt-get` und unattended-upgrades legen jedes heruntergeladene Paket in `/var/cache/apt/archives` ab, bis `apt clean` aufräumt. Das interaktive `apt install` löscht die Dateien nach einer erfolgreichen Installation (`Binary::apt::APT::Keep-Downloaded-Packages`). Aus dem Cache installierst du die Datei selbst: `sudo apt install --allow-downgrades /var/cache/apt/archives/shopctl_1.4.2-1_all.deb`.

  Jetzt festhalten. `apt-mark hold` setzt den Soll-Zustand auf „hold“, `dpkg -l` zeigt dann `hi`, und `apt upgrade` lässt das Paket aus ([apt-mark(8)](https://manpages.debian.org/bookworm/apt/apt-mark.8.en.html)). `apt-get -s` simuliert nur:

  ```console vm
  $ sudo apt-mark hold shopctl
  shopctl set on hold.
  $ dpkg -l shopctl | tail -n 1
  hi  shopctl        1.4.2-1      all          Verwaltung des Shops
  $ sudo apt-get -s upgrade
  Reading package lists... Done
  Building dependency tree... Done
  Reading state information... Done
  Calculating upgrade... Done
  The following packages have been kept back:
    shopctl
  0 upgraded, 0 newly installed, 0 to remove and 1 not upgraded.
  ```

  Feiner steuerst du mit **Pinning** in `/etc/apt/preferences.d/`. Jede Version hat eine Priorität, installiert wird die höchste. Repository-Versionen haben normalerweise 500, die installierte Version 100. Ab 1000 installiert apt eine Version auch dann, wenn das ein Downgrade bedeutet ([apt_preferences(5)](https://manpages.debian.org/bookworm/apt/apt_preferences.5.en.html)):

  ```console vm
  $ sudo apt-mark unhold shopctl
  Canceled hold on shopctl.
  $ printf '%s\n' 'Package: shopctl' 'Pin: version 1.4.*' 'Pin-Priority: 1001' | sudo tee /etc/apt/preferences.d/shopctl
  Package: shopctl
  Pin: version 1.4.*
  Pin-Priority: 1001
  $ apt-cache policy shopctl
  shopctl:
    Installed: 1.4.2-1
    Candidate: 1.4.2-1
    Version table:
       2.0.0-1 500
          500 http://apt.shop.internal/debian bookworm/main i386 Packages
   *** 1.4.2-1 1001
          500 http://apt.shop.internal/debian bookworm/main i386 Packages
          100 /var/lib/dpkg/status
  ```

  Ein Pin ist eine Datei, die du ins Repository deiner Konfigurationsverwaltung legen und kommentieren kannst. Ein Hold ist ein Flag in der dpkg-Datenbank, das niemand sieht, der nicht danach fragt. Beide vergisst man leicht: `apt-mark showhold` und `apt-cache policy` sind die ersten Befehle, wenn ein Server „irgendwie nicht aktualisiert“.

  ### Auf Arch: Paket-Cache, Archive und IgnorePkg

  pacman legt jedes heruntergeladene Paket in `/var/cache/pacman/pkg` ab. Von dort installiert `pacman -U` eine ältere Version ([ArchWiki · Downgrading packages](https://wiki.archlinux.org/title/Downgrading_packages#Using_the_pacman_cache)):

  ```console
  $ ls /var/cache/pacman/pkg/mesa-*.zst
  /var/cache/pacman/pkg/mesa-1:26.2.1-1-x86_64.pkg.tar.zst
  /var/cache/pacman/pkg/mesa-1:26.2.2-1-x86_64.pkg.tar.zst
  $ sudo pacman -U /var/cache/pacman/pkg/mesa-1:26.2.1-1-x86_64.pkg.tar.zst
  ```

  Hat `paccache` die Datei schon gelöscht, findest du jede frühere Version im [Arch Linux Archive](https://wiki.archlinux.org/title/Arch_Linux_Archive#Downgrade_one_package) unter `https://archive.archlinux.org/packages/`. Damit `pacman -Syu` das Paket danach auslässt, trägst du es in `/etc/pacman.conf` unter `IgnorePkg = mesa` ein ([Skip package from being upgraded](https://wiki.archlinux.org/title/Pacman#Skip_package_from_being_upgraded)). Auf Arch ist das ein Teil-Update und damit ein Provisorium: Sobald der Fix da ist, kommt der Eintrag wieder raus. Ändert der Downgrade einen SONAME, müssen Pakete, die die Bibliothek nutzen, mit zurück.

  ## Häufige Fehler

  - **`apt install` ohne vorheriges `apt update`** auf einem frischen System oder im Container. Symptom: `E: Unable to locate package …` oder 404-Fehler beim Download, weil der Index veraltet ist.
  - **`pacman -Sy paket`** statt `pacman -Syu paket`. Symptom: später unerklärliche Fehler beim Laden von Bibliotheken.
  - **Den Schlüssel als Text in eine `.gpg`-Datei schreiben** oder `Signed-By` auf einen Tippfehler zeigen lassen. Symptom: `NO_PUBKEY`, obwohl der Schlüssel daliegt.
  - **Warnungen von `apt update` überlesen.** Ein Repository mit Signaturfehler liefert keine Updates mehr, der Exit-Code bleibt 0.
  - **Ein halb konfiguriertes Paket liegen lassen.** Jedes weitere `apt` endet mit `returned an error code (1)`. `sudo dpkg --audit` zeigt, welches Paket hängt, `sudo dpkg --configure -a` nennt den Fehler.
  - **`LD_LIBRARY_PATH` in `~/.bashrc`** statt `/etc/ld.so.conf.d` und `ldconfig`. Von Hand läuft das Programm, als Dienst oder Cronjob nicht.
  - **Holds und Pins vergessen.** Monate später fehlen Sicherheitsupdates, und niemand weiß, warum.
  - **`.pacnew`-Dateien ignorieren.** Der Dienst läuft mit einer alten Konfiguration weiter, bis eine entfernte Option ihn beim nächsten Neustart stolpern lässt.
  - **`remove` statt `purge`**, wenn du einen Dienst neu aufsetzen willst. Die alte Konfiguration in `/etc` bleibt und wird bei der Neuinstallation wiederverwendet.
  - **AUR-Pakete ungelesen bauen** oder `curl … | sudo bash` aus einer Anleitung übernehmen.
  - **`sudo make install` nach `/usr`.** Dateien, die keinem Paket gehören, überschreiben oder werden überschrieben – `pacman -Qo` bzw. `dpkg -S` finden dann keinen Besitzer.
  - **`sudo pip install` systemweit.** Das kollidiert mit Python-Paketen der Distribution; aktuelle Debian- und Arch-Versionen blockieren das deshalb (`externally-managed-environment`). Nutze ein virtuelles Environment, `uv` oder `pipx`.

  ## Zusammenfassung

  - Ein Paketmanager löst Abhängigkeiten auf, prüft Signaturen, führt Buch über jede Datei und aktualisiert in Transaktionen.
  - `apt update` lädt nur den Index; `upgrade` aktualisiert ohne zu entfernen, `full-upgrade` darf entfernen. In Skripten `apt-get`.
  - `remove` behält die Konfiguration, `purge` entfernt sie; `autoremove` bzw. `pacman -Rns`/`-Qdt` räumen Abhängigkeiten auf.
  - Auf Arch immer `pacman -Syu`, nie `-Sy` allein – Teil-Updates werden nicht unterstützt.
  - Wer besitzt die Datei? `pacman -Qo` bzw. `dpkg -S`. Welche Dateien hat das Paket? `pacman -Ql` bzw. `dpkg -L`.
  - Fremd-Repositories bekommen einen eigenen Schlüssel in `/etc/apt/keyrings` und `Signed-By`, nie `apt-key`. `NO_PUBKEY` heißt: Schlüssel fehlt, Pfad falsch oder Format falsch.
  - `iF` und `iU` in `dpkg -l` sind halbe Installationen. `sudo dpkg --audit` findet sie, `sudo dpkg --configure -a` wiederholt die Konfiguration, nachdem du die Ursache behoben hast.
  - `ldd` zeigt fehlende Bibliotheken. Eigene Bibliotheksverzeichnisse gehören nach `/etc/ld.so.conf.d`, danach `ldconfig`.
  - Downgrade mit `apt install paket=version --allow-downgrades` oder aus `/var/cache/apt/archives`, festhalten mit `apt-mark hold` oder einem Pin. Auf Arch `pacman -U` aus dem Cache oder dem Archive, dann `IgnorePkg`.
  - AUR-Pakete sind ungeprüfte Bash-Skripte: PKGBUILD lesen. Flatpak für Desktop-Apps in der Sandbox; selbst gebaute Software nach `/usr/local` oder besser als eigenes Paket.
exercises:
  - id: update-upgrade
    type: choice
    title: Index oder Pakete?
    prompt: Welche Aussagen über `apt` stimmen?
    options:
      - text: "`sudo apt update` lädt nur die Paketlisten der Repositories neu und installiert keine neuen Versionen."
        correct: true
        why: "`update` aktualisiert den Index. Erst `upgrade` oder `install` verändert installierte Pakete."
      - text: "`sudo apt upgrade` kann Pakete entfernen, wenn ein Update das erfordert."
        correct: false
        why: "`apt upgrade` entfernt nie installierte Pakete. Solche Updates werden zurückgehalten; entfernen darf erst `full-upgrade`."
      - text: "`sudo apt full-upgrade` darf installierte Pakete entfernen, um das System als Ganzes zu aktualisieren."
        correct: true
        why: Genau das unterscheidet es von `upgrade`, etwa wenn ein Paket durch ein umbenanntes ersetzt wurde.
      - text: "`sudo apt remove nginx` löscht auch `/etc/nginx`."
        correct: false
        why: "`remove` lässt die Konfigurationsdateien liegen. Die entfernt erst `purge`."
    explanation: |
      Die Trennung zwischen Index (`update`) und Paketen (`upgrade`, `install`) ist der Kern von apt. `upgrade` ist die vorsichtige Variante, `full-upgrade` darf zum Auflösen von Abhängigkeiten auch entfernen – deshalb solltest du dessen Vorschau lesen, bevor du bestätigst. `remove` und `purge` unterscheiden sich nur in der Konfiguration unter `/etc`.
    resources:
      - title: apt(8)
        url: https://manpages.debian.org/trixie/apt/apt.8.en.html

  - id: pacman-transaktion
    type: order
    title: Was pacman bei -Syu tut
    prompt: Bring die Schritte, die `sudo pacman -Syu` ausgibt, in die richtige Reihenfolge.
    lang: text
    lines: |
      :: Synchronizing package databases...
      :: Starting full system upgrade...
      resolving dependencies...
      :: Proceed with installation? [Y/n]
      :: Retrieving packages...
      checking keys in keyring
      checking package integrity
      checking for file conflicts
      :: Processing package changes...
      :: Running post-transaction hooks...
    explanation: |
      Erst holt `-y` die aktuellen Datenbanken, dann berechnet `-u` die Menge der Updates und löst Abhängigkeiten auf. Nach deiner Bestätigung lädt pacman die Pakete, prüft Signaturen (`keys in keyring`) und Integrität und ob Dateien anderer Pakete überschrieben würden. Erst wenn alle Prüfungen bestanden sind, ersetzt es Dateien. Danach laufen Hooks, etwa zum Neubauen der initramfs oder, mit `snap-pac`, für Snapshots. Weil alle Prüfungen vor der ersten Änderung stattfinden, bricht ein fehlerhaftes Paket das Update ab, bevor das System halb aktualisiert ist.
    resources:
      - title: ArchWiki · pacman · Upgrading packages
        url: https://wiki.archlinux.org/title/Pacman#Upgrading_packages

  - id: teil-update
    type: choice
    title: Nur mal schnell nginx
    prompt: |
      Eine Anleitung empfiehlt auf deinem Arch-System, das seit drei Wochen nicht aktualisiert wurde: `sudo pacman -Sy nginx`. Was ist das Problem?
    options:
      - text: "`-y` lädt die neue Datenbank; nginx und neue Abhängigkeiten kommen in der neuesten Version, der Rest des Systems bleibt alt. Bereits installierte Programme können dann an neueren gemeinsamen Bibliotheken scheitern."
        correct: true
        why: Das ist ein Teil-Update. Arch-Pakete sind nur als Gesamtstand gegeneinander gebaut; die Mischung aus alt und neu wird nicht unterstützt.
      - text: Kein Problem – pacman aktualisiert automatisch alle Pakete, die nginx braucht.
        correct: false
        why: pacman installiert fehlende Abhängigkeiten, aktualisiert aber keine bereits installierten Pakete, deren Versionsanforderung formal erfüllt ist. Und Programme, die nichts mit nginx zu tun haben, bleiben auf dem alten Stand.
      - text: "Das Problem ist nur `-y`: Mit `sudo pacman -S nginx` ohne Synchronisieren wäre die Installation sicher und nginx aktuell."
        correct: false
        why: "`pacman -S nginx` ist konsistent, installiert aber die Version aus der drei Wochen alten lokalen Datenbank – die Datei gibt es auf den Mirrors womöglich nicht mehr (404). Richtig ist `sudo pacman -Syu nginx`."
      - text: "`-Sy` fragt nicht nach Bestätigung und installiert deshalb ungeprüfte Pakete."
        correct: false
        why: Auch bei `-Sy` fragt pacman nach und prüft Signaturen. Das Problem ist die Versionsmischung, nicht die Prüfung.
    explanation: |
      Auf einem Rolling-Release-System gibt es nur einen stimmigen Stand. `-Sy paket` erzeugt ein System, in dem neue und alte Pakete gemischt sind – typische Folgen sind `error while loading shared libraries` in Programmen, die du nicht angefasst hast. Die Regel lautet: Datenbank synchronisieren heißt immer auch komplett aktualisieren, also `pacman -Syu nginx`.
    resources:
      - title: ArchWiki · Partial upgrades are unsupported
        url: https://wiki.archlinux.org/title/System_maintenance#Partial_upgrades_are_unsupported

  - id: showhold-vorhersagen
    type: output
    title: Was ist festgehalten?
    prompt: Was gibt der **letzte** Befehl aus?
    lang: console
    code: |
      $ sudo apt-mark hold postgresql-16
      postgresql-16 set on hold.
      $ sudo apt-mark hold nginx
      nginx set on hold.
      $ sudo apt-mark unhold postgresql-16
      Canceled hold on postgresql-16.
      $ apt-mark showhold
    expected: nginx
    explanation: |
      `apt-mark hold` markiert ein Paket so, dass `apt upgrade` und `full-upgrade` es nicht aktualisieren. `unhold` hebt die Markierung wieder auf, deshalb bleibt nur `nginx` übrig. Im Betrieb ist `showhold` der erste Befehl, wenn ein Server „irgendwie nicht aktualisiert“: Oft hat jemand vor Monaten ein Paket festgehalten und es vergessen.
    resources:
      - title: apt-mark(8)
        url: https://manpages.debian.org/trixie/apt/apt-mark.8.en.html

  - id: waisen-vorhersagen
    type: output
    title: Wer ist verwaist?
    prompt: |
      Auf deinem System sind unter anderem diese Pakete installiert (Auszug aus `pacman -Qi`). Andere Pakete verweisen nicht auf sie. Was gibt `pacman -Qdtq` aus? (`-q` zeigt nur die Namen, alphabetisch sortiert.)
    lang: text
    code: |
      Name            : python-requests
      Required By     : None
      Optional For    : None
      Install Reason  : Explicitly installed

      Name            : python-urllib3
      Required By     : python-requests
      Optional For    : None
      Install Reason  : Installed as a dependency for another package

      Name            : python-chardet
      Required By     : None
      Optional For    : python-requests
      Install Reason  : Installed as a dependency for another package

      Name            : python-pytest
      Required By     : None
      Optional For    : None
      Install Reason  : Installed as a dependency for another package

      Name            : rust
      Required By     : None
      Optional For    : None
      Install Reason  : Installed as a dependency for another package
    expected: |
      python-pytest
      rust
    explanation: |
      `-d` filtert auf Pakete, die als Abhängigkeit installiert wurden – `python-requests` fällt heraus, weil du es selbst installiert hast. `-t` behält nur Pakete, die weder benötigt noch **optional** benötigt werden: `python-urllib3` braucht `requests`, und `python-chardet` ist eine optionale Abhängigkeit von `requests`, also bleibt es ebenfalls stehen (erst `-Qdtt` würde es zeigen). Übrig bleiben `python-pytest` und `rust` – typische Reste, etwa Build-Abhängigkeiten eines AUR-Pakets.
    resources:
      - title: pacman(8) – Query Options
        url: https://man.archlinux.org/man/pacman.8

  - id: wem-gehoert-dig
    type: command
    title: Woher kommt dieses Programm?
    prompt: Finde auf deinem CachyOS heraus, welches installierte Paket die Datei `/usr/bin/dig` besitzt.
    answers:
      - pacman -Qo /usr/bin/dig
      - pacman -Qo dig
      - pacman --query --owns /usr/bin/dig
      - pacman -Q --owns /usr/bin/dig
    output: /usr/bin/dig is owned by bind 9.20.29-1.1
    explanation: |
      `-Q` fragt die lokale Datenbank, `-o` („owns“) sucht den Besitzer einer Datei. Ohne Pfad sucht pacman das Programm im `PATH`. Dass `dig` im Paket `bind` steckt, ist nicht offensichtlich – genau dafür ist die Abfrage da. Auf Debian heißt die Entsprechung `dpkg -S /usr/bin/dig`; für Dateien, die noch **nicht** installiert sind, gibt es `pacman -F` bzw. `apt-file search`.
    resources:
      - title: ArchWiki · Querying package databases
        url: https://wiki.archlinux.org/title/Pacman#Querying_package_databases

  - id: apache-purge
    type: command
    title: Apache restlos entfernen
    prompt: Entferne auf einem Debian-Server das Paket `apache2` **inklusive** seiner Konfigurationsdateien. Du arbeitest als normaler Benutzer mit sudo-Rechten.
    context: Auf dem Server soll künftig nginx laufen. Die alte Apache-Konfiguration unter `/etc/apache2` wird nicht mehr gebraucht.
    answers:
      - sudo apt purge apache2
      - sudo apt-get purge apache2
      - sudo apt remove --purge apache2
      - sudo apt-get remove --purge apache2
      - sudo apt purge -y apache2
      - sudo apt-get purge -y apache2
      - sudo apt -y purge apache2
      - sudo apt-get -y purge apache2
    explanation: |
      `purge` entfernt das Paket und zusätzlich seine Konfigurationsdateien, `remove` ließe `/etc/apache2` liegen. Abhängigkeiten wie `apache2-bin` oder `apache2-data` bleiben dabei installiert; die räumt anschließend `sudo apt autoremove` ab (mit `--purge` ebenfalls samt Konfiguration). Nicht angerührt werden Daten, die das Paket nicht selbst mitgebracht hat, etwa deine Webseiten unter `/var/www`.
    resources:
      - title: apt(8) – remove, purge, autoremove
        url: https://manpages.debian.org/trixie/apt/apt.8.en.html

  - id: pacman-rns
    type: command
    title: Gründlich deinstallieren
    prompt: Entferne auf deinem CachyOS das Paket `neovim` samt allen Abhängigkeiten, die sonst niemand braucht, und ohne `.pacsave`-Sicherungskopien geänderter Konfigurationsdateien.
    answers:
      - sudo pacman -Rns neovim
      - sudo pacman -R -n -s neovim
      - sudo pacman --remove --nosave --recursive neovim
    explanation: |
      `-R` entfernt, `-s` („recursive“) nimmt Abhängigkeiten mit, die kein anderes Paket braucht und die du nicht selbst installiert hast, `-n` („nosave“) verzichtet auf `.pacsave`-Kopien. Die Reihenfolge der gebündelten Buchstaben ist egal. Deine eigene Konfiguration in `~/.config/nvim` bleibt immer erhalten – pacman verwaltet nur Dateien, die ein Paket installiert hat, nie dein Home-Verzeichnis.
    resources:
      - title: ArchWiki · pacman · Removing packages
        url: https://wiki.archlinux.org/title/Pacman#Removing_packages

  - id: befehle-luecken
    type: gap
    title: Zwei Welten, gleiche Fragen
    prompt: Ergänze die fehlenden Operationen und Optionen.
    lang: bash
    code: |
      # Arch: Datenbanken synchronisieren und das ganze System aktualisieren
      sudo pacman ⟦-Syu⟧
      # Arch: alle Dateien auflisten, die das installierte Paket openssh mitbringt
      pacman ⟦-Ql⟧ openssh
      # Arch: Version, Abhängigkeiten und Installationsgrund von openssh anzeigen
      pacman ⟦-Qi⟧ openssh
      # Debian: welches installierte Paket hat /usr/bin/ssh installiert?
      dpkg ⟦-S⟧ /usr/bin/ssh
      # Debian: PostgreSQL 16 bei Updates auslassen
      sudo apt-mark ⟦hold⟧ postgresql-16
      # Debian: nicht mehr benötigte Abhängigkeiten entfernen
      sudo apt ⟦autoremove⟧
    gaps:
      - label: Vollständiges Update
        hint: Sync-Operation, dazu „refresh“ und „sysupgrade“.
        accept: ["--sync --refresh --sysupgrade"]
      - label: Dateiliste
        hint: Query-Operation mit der Option für „list“.
        accept: ["--query --list"]
      - label: Paketinfo
        hint: Query-Operation mit der Option für „info“.
        accept: ["--query --info"]
      - label: Dateibesitzer suchen
        hint: dpkg hat dafür eine Option mit einem Großbuchstaben, „search“.
        accept: ["--search"]
      - label: Festhalten
        hint: Das Gegenteil heißt `unhold`.
      - label: Aufräumen
        hint: Ein Wort, das „automatisch entfernen“ bedeutet.
        accept: ["autoremove -y", "-y autoremove"]
    explanation: |
      Bei pacman bestimmt der Großbuchstabe die Operation (`-S` Repositories, `-Q` lokal installiert, `-R` entfernen), Kleinbuchstaben verfeinern sie. `-Ql` und `-Qi` beziehen sich auf installierte Pakete; für Pakete im Repository gibt es `-Si`. Auf Debian arbeitet `dpkg` auf der Ebene einzelner installierter Pakete, `apt` darüber mit Repositories und Abhängigkeiten. `apt-mark hold` wirkt auf `apt upgrade` und `full-upgrade`; `autoremove` entfernt Pakete, die nur als Abhängigkeit installiert wurden und nicht mehr gebraucht werden.
    resources:
      - title: pacman(8)
        url: https://man.archlinux.org/man/pacman.8
      - title: dpkg(1)
        url: https://manpages.debian.org/trixie/dpkg/dpkg.1.en.html

  - id: dockerfile-ohne-update
    type: bug
    title: Das Paket gibt es angeblich nicht
    prompt: |
      Der Build dieses Images bricht ab mit:

      ```text
      E: Unable to locate package curl
      E: Unable to locate package ca-certificates
      ```

      Beide Pakete existieren in Debian trixie. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: dockerfile
    code: |
      FROM debian:trixie-slim
      RUN apt-get install -y --no-install-recommends curl ca-certificates
      COPY healthcheck.sh /usr/local/bin/healthcheck.sh
      CMD ["/usr/local/bin/healthcheck.sh"]
    lines: [2]
    fix:
      - line: 2
        answers:
          - RUN apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
          - RUN apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          - RUN apt-get update && apt-get install --no-install-recommends -y curl ca-certificates
          - RUN apt-get update && apt-get install --no-install-recommends -y curl ca-certificates && rm -rf /var/lib/apt/lists/*
    explanation: |
      Offizielle Debian-Images enthalten keine Paketlisten – sie werden beim Bauen gelöscht, um Platz zu sparen. Ohne `apt-get update` kennt apt kein einziges Paket. `update` und `install` gehören in **dieselbe** `RUN`-Zeile: Stünden sie getrennt, könnte Docker die Schicht mit einem alten Index aus dem Cache wiederverwenden, während die Install-Zeile geändert wurde. Das abschließende `rm -rf /var/lib/apt/lists/*` hält das Image klein.
    resources:
      - title: Docker · Building best practices (apt-get)
        url: https://docs.docker.com/build/building/best-practices/

  - id: provision-teilupdate
    type: bug
    title: Der CI-Runner ist nach dem Setup kaputt
    prompt: |
      Dieses Skript richtet eine Arch-VM aus einem mehrere Monate alten Image als CI-Runner ein und läuft als root. Danach scheitern auf manchen VMs Programme, die das Skript gar nicht installiert hat, mit Meldungen wie `error while loading shared libraries` oder `version 'OPENSSL_3.6.0' not found`. Finde die fehlerhafte Zeile und korrigiere sie so, dass das Skript sonst unverändert bleibt.
    lang: bash
    code: |
      #!/usr/bin/env bash
      # provision.sh – frische Arch-VM als CI-Runner einrichten
      set -euo pipefail
      pacman -Sy --noconfirm
      pacman -S --noconfirm --needed docker git base-devel
      systemctl enable --now docker
    lines: [4]
    fix:
      - line: 4
        answers:
          - pacman -Syu --noconfirm
          - pacman --noconfirm -Syu
          - pacman -Syyu --noconfirm
    explanation: |
      Zeile 4 synchronisiert nur die Datenbanken, aktualisiert aber nichts. Zeile 5 installiert dann Docker, Git und deren fehlende Abhängigkeiten in der neuesten Version – gebaut gegen Bibliotheken, die auf dem alten Image noch in alter Version liegen, oder umgekehrt ziehen sie neue Bibliotheken nach, gegen die die alten Programme nie gebaut wurden. Das ist ein Teil-Update. Mit `pacman -Syu` wird zuerst das ganze System auf den aktuellen Stand gebracht; alternativ fasst man beides zu `pacman -Syu --noconfirm --needed docker git base-devel` zusammen.
    resources:
      - title: ArchWiki · Partial upgrades are unsupported
        url: https://wiki.archlinux.org/title/System_maintenance#Partial_upgrades_are_unsupported

  - id: signed-by-falsch
    type: bug
    title: Der Schlüssel liegt doch da
    prompt: |
      Du bindest auf einem Debian-12-Server das Repository eines Monitoring-Herstellers ein. Den Schlüssel hast du nach dessen Anleitung geholt:

      ```console
      $ curl -fsSL https://apt.monitoring.example/key.asc | sudo tee /etc/apt/keyrings/monitoring.asc > /dev/null
      $ ls /etc/apt/keyrings
      monitoring.asc
      ```

      Trotzdem endet `sudo apt update` so:

      ```text
      Get:1 https://apt.monitoring.example bookworm InRelease [15.3 kB]
      Err:1 https://apt.monitoring.example bookworm InRelease
        The following signatures couldn't be verified because the public key is not available: NO_PUBKEY 4E3B1F0A92C8D715
      Reading package lists... Done
      W: GPG error: https://apt.monitoring.example bookworm InRelease: The following signatures couldn't be verified because the public key is not available: NO_PUBKEY 4E3B1F0A92C8D715
      E: The repository 'https://apt.monitoring.example bookworm InRelease' is not signed.
      N: Updating from such a repository can't be done securely, and is therefore disabled by default.
      N: See apt-secure(8) manpage for repository creation and user configuration details.
      ```

      Finde die fehlerhafte Zeile in `/etc/apt/sources.list.d/monitoring.sources` und korrigiere sie.
    lang: ini
    code: |
      Types: deb
      URIs: https://apt.monitoring.example
      Suites: bookworm
      Components: main
      Signed-By: /etc/apt/keyrings/monitoring.gpg
    lines: [5]
    fix:
      - line: 5
        answers:
          - "Signed-By: /etc/apt/keyrings/monitoring.asc"
          - "signed-by: /etc/apt/keyrings/monitoring.asc"
    explanation: |
      `Signed-By` nennt die einzige Schlüsseldatei, der apt für dieses Repository vertraut. Die Datei `monitoring.gpg` gibt es nicht, also findet apt keinen passenden Schlüssel und meldet dasselbe `NO_PUBKEY` wie bei einem fehlenden Schlüssel – einen Hinweis auf den Tippfehler gibt es nicht. Mit `.asc` passt auch das Format: apt 2.6 liest aus `.asc`-Dateien den Schlüssel als Text, aus `.gpg`-Dateien das Binärformat. Hättest du stattdessen die Datei in `monitoring.gpg` umbenannt, käme dieselbe Meldung, weil Text in einer `.gpg`-Datei nicht gelesen wird; dafür bräuchtest du `gpg --dearmor`. Dass apt hier mit `E:` abbricht, liegt daran, dass das Repository neu ist. Ein schon eingebundenes Repository hätte nur gewarnt und mit den alten Listen weitergearbeitet.
    resources:
      - title: sources.list(5) – Signed-By
        url: https://manpages.debian.org/bookworm/apt/sources.list.5.en.html
      - title: Debian Wiki · Third-party repositories
        url: https://wiki.debian.org/DebianRepository/UseThirdParty

  - id: pkgbuild-erklaeren
    type: explain
    title: Einen PKGBUILD lesen
    prompt: |
      Du willst `lazydocker-bin` aus dem AUR installieren; paru zeigt dir vorher diesen PKGBUILD. Erkläre, was er tut, was die Prüfsumme leistet und was nicht, und worauf du vor dem Bauen geachtet hast.
    lang: bash
    code: |
      # Maintainer: jdoe <jdoe@example.org>
      pkgname=lazydocker-bin
      pkgver=0.24.1
      pkgrel=1
      pkgdesc="Terminal-UI für Docker und Docker Compose (vorkompiliert)"
      arch=('x86_64')
      url="https://github.com/jesseduffield/lazydocker"
      license=('MIT')
      provides=('lazydocker')
      conflicts=('lazydocker')
      source=("https://github.com/jesseduffield/lazydocker/releases/download/v${pkgver}/lazydocker_${pkgver}_Linux_x86_64.tar.gz")
      sha256sums=('4f5b9a0e3c1d2b7a8e6f0c9d1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d')

      package() {
        install -Dm755 lazydocker "$pkgdir/usr/bin/lazydocker"
        install -Dm644 LICENSE "$pkgdir/usr/share/licenses/$pkgname/LICENSE"
      }
    points:
      - Das Suffix `-bin` bedeutet, dass nichts kompiliert wird – der PKGBUILD lädt das fertige Release-Archiv des Projekts herunter.
      - "`source` und `url` zeigen auf das offizielle GitHub-Projekt; das ist der wichtigste Punkt der Prüfung."
      - Die Prüfsumme garantiert nur, dass die Datei der entspricht, die der Maintainer eingetragen hat – nicht, dass Upstream oder der Maintainer vertrauenswürdig sind.
      - "`package()` kopiert nur zwei Dateien nach `$pkgdir`; erst pacman installiert das Paket, kennt damit jede Datei und kann es sauber entfernen."
      - Es gibt kein `install=`-Skript und keine zusätzlichen Downloads oder Befehle; `provides`/`conflicts` verhindern eine Doppelinstallation mit der Source-Variante.
    explanation: |
      Der PKGBUILD baut ein Paket aus dem fertigen Linux-Release von lazydocker: `source` lädt das Archiv von der offiziellen GitHub-Seite, `makepkg` prüft es gegen `sha256sums` und entpackt es, und `package()` kopiert das Programm nach `/usr/bin` und die Lizenz nach `/usr/share/licenses` – allerdings nur in das Staging-Verzeichnis `$pkgdir`. Installiert wird erst das fertige Paket durch pacman, sodass es wie jedes andere Paket verwaltet wird. Die Prüfsumme schützt vor einer veränderten Datei auf dem Server, nicht vor einem bösartigen Maintainer, denn der trägt die Summe selbst ein. Deshalb habe ich kontrolliert, dass die URL zum echten Projekt gehört, dass es kein `install`-Skript und keine weiteren Downloads gibt und dass `package()` nur Dateien kopiert. Bei Updates schaue ich mir in paru den Diff an.
    resources:
      - title: ArchWiki · PKGBUILD
        url: https://wiki.archlinux.org/title/PKGBUILD
      - title: ArchWiki · AUR – Installing and upgrading packages
        url: https://wiki.archlinux.org/title/Arch_User_Repository#Installing_and_upgrading_packages

  - id: pflege-routine
    type: practice
    title: Deine Wartungsroutine für CachyOS
    prompt: |
      Richte dir eine wöchentliche Wartungsroutine für deinen Desktop ein und führe sie einmal durch. Sie soll:

      1. vor dem Update die Arch-News lesen (manchmal ist ein manueller Eingriff nötig),
      2. das ganze System inklusive AUR-Paketen aktualisieren,
      3. `.pacnew`-Dateien finden und zusammenführen,
      4. verwaiste Abhängigkeiten anzeigen und – nach Durchsicht – entfernen,
      5. den Paket-Cache auf die letzten zwei Versionen je Paket begrenzen,
      6. prüfen, ob vor dem Update ein Snapshot angelegt wurde.

      Schreibe die Befehle als kommentierte Liste auf. Die Befehle sollen in fish **und** Bash funktionieren.
    lang: bash
    solution: |
      # 1. Neue Arch-News anzeigen
      paru -Pw

      # 2. Repositories und AUR aktualisieren (paru ohne Argumente = paru -Syu)
      paru
      # nur offizielle Pakete wäre: sudo pacman -Syu

      # 3. .pacnew-Dateien finden und interaktiv zusammenführen (pacman-contrib)
      sudo pacdiff

      # 4. Waisen ansehen, dann entfernen
      pacman -Qdt
      pacman -Qdtq | sudo pacman -Rns -

      # 5. Paket-Cache: nur die zwei neuesten Versionen behalten (pacman-contrib)
      sudo paccache -rk2

      # 6. Snapshots von snap-pac prüfen
      sudo snapper list | tail -n 4
    checklist:
      - Du liest die News **vor** dem Update, nicht danach.
      - Das Update ist ein vollständiges `-Syu` (per `paru` oder `pacman`), nie `-Sy` allein.
      - Du gehst `.pacnew`-Dateien mit `pacdiff` durch, statt sie liegen zu lassen.
      - Du siehst dir die Waisenliste an, bevor du sie mit `pacman -Rns -` entfernst.
      - Du übergibst die Waisen per Pipe an `pacman -Rns -`, sodass der Befehl in Bash und fish gleich funktioniert.
      - Du hast in `snapper list` einen Pre- und einen Post-Snapshot deines Updates gefunden (oder weißt, dass bei dir keine Snapshots eingerichtet sind).
    explanation: |
      `paru -Pw` zeigt News, die neuer sind als deine installierten Pakete – dort kündigt Arch Updates an, die Handarbeit brauchen. `paru` ohne Argumente entspricht `paru -Syu` und aktualisiert Repository- und AUR-Pakete zusammen. `pacdiff` findet `.pacnew`-Dateien und bietet einen Vergleich an. `pacman -Qdtq | sudo pacman -Rns -` liest die Paketnamen von stdin (das `-` am Ende) und funktioniert deshalb unverändert in Bash und fish. Ist die Liste leer, meldet pacman nur „no targets specified“ – dann gibt es nichts aufzuräumen. `paccache -rk2` löscht alte Paketversionen aus `/var/cache/pacman/pkg`, behält aber zwei für einen möglichen Downgrade.
    resources:
      - title: ArchWiki · System maintenance
        url: https://wiki.archlinux.org/title/System_maintenance
      - title: paccache(8)
        url: https://man.archlinux.org/man/paccache.8
      - title: pacdiff(8)
        url: https://man.archlinux.org/man/pacdiff.8

  - id: dpkg-haengt
    type: scenario
    title: Seit gestern scheitert jedes apt
    prompt: |
      Ein Kollege hat gestern auf `web01` das hauseigene Paket `shop-exporter` eingespielt. Es soll die Kennzahlen des Shops für Prometheus unter `http://127.0.0.1:9100/metrics` bereitstellen. Seitdem endet auf dem Server jedes `sudo apt install …` und jedes `sudo apt upgrade` mit:

      ```text
      E: Sub-process /usr/bin/dpkg returned an error code (1)
      ```

      Finde heraus, was dpkg stört, und behebe die Ursache. Am Ende soll `shop-exporter` sauber installiert sein, als Dienst laufen und beim Boot starten, und dpkg darf keine unfertigen Pakete mehr melden. Das Paket selbst ist in Ordnung und soll bleiben; du bist als `ops` angemeldet und hast `sudo`.
    setup: |
      set -e
      d=$(mktemp -d)/shop-exporter
      mkdir -p "$d/DEBIAN" "$d/usr/bin" "$d/lib/systemd/system"
      cat > "$d/DEBIAN/control" <<'EOF'
      Package: shop-exporter
      Version: 1.3.0-1
      Architecture: all
      Maintainer: Plattform-Team <plattform@shop.example>
      Depends: busybox
      Description: Kennzahlen des Shops für Prometheus
       Stellt /metrics auf 127.0.0.1:9100 bereit.
      EOF
      cat > "$d/DEBIAN/postinst" <<'EOF'
      #!/bin/sh
      set -e
      if [ "$1" = configure ]; then
          install -d -o shopexp -g shopexp -m 750 /var/lib/shop-exporter
          systemctl daemon-reload
          systemctl enable --now shop-exporter.service
      fi
      EOF
      cat > "$d/usr/bin/shop-exporter" <<'EOF'
      #!/bin/sh
      # Schreibt die aktuellen Kennzahlen und liefert sie per HTTP aus.
      set -e
      cd /var/lib/shop-exporter
      printf 'shop_up 1\nshop_orders_open %s\n' "$(ls /srv/shop/orders | wc -l)" > metrics
      exec busybox httpd -f -p 127.0.0.1:9100 -h /var/lib/shop-exporter
      EOF
      chmod 755 "$d/DEBIAN/postinst" "$d/usr/bin/shop-exporter"
      cat > "$d/lib/systemd/system/shop-exporter.service" <<'EOF'
      [Unit]
      Description=Kennzahlen des Shops für Prometheus

      [Service]
      User=shopexp
      ExecStart=/usr/bin/shop-exporter

      [Install]
      WantedBy=multi-user.target
      EOF
      mkdir -p /srv/shop/orders
      touch /srv/shop/orders/10481 /srv/shop/orders/10482 /srv/shop/orders/10485
      install -d -o ops -g ops /home/ops/pakete
      dpkg-deb --root-owner-group -b "$d" /home/ops/pakete/shop-exporter_1.3.0-1_all.deb > /dev/null
      chown ops:ops /home/ops/pakete/shop-exporter_1.3.0-1_all.deb
      dpkg -i /home/ops/pakete/shop-exporter_1.3.0-1_all.deb > /dev/null 2>&1 || true
    checks:
      - name: shop-exporter ist vollständig installiert
        run: |
          s=$(dpkg-query -W -f '${Status}' shop-exporter)
          echo "Status: $s"
          [ "$s" = "install ok installed" ]
      - name: dpkg meldet keine unfertigen Pakete
        run: |
          out=$(dpkg --audit)
          [ -z "$out" ] || { echo "$out"; exit 1; }
      - name: Der Exporter läuft als Dienst und startet beim Boot
        run: systemctl is-enabled shop-exporter && systemctl restart shop-exporter && sleep 1 && systemctl is-active shop-exporter
      - name: Die Kennzahlen sind abrufbar
        run: curl -fsS --max-time 5 http://127.0.0.1:9100/metrics
    solution: |
      # Welches Paket hängt? shop-exporter ist nur halb konfiguriert (iF).
      sudo dpkg --audit
      dpkg -l shop-exporter | tail -n 1
      # Konfiguration wiederholen, um den Fehler zu sehen: install: invalid user 'shopexp'
      sudo dpkg --configure -a
      # postinst und Unit erwarten einen Systembenutzer shopexp, den es nicht gibt.
      cat /var/lib/dpkg/info/shop-exporter.postinst
      grep User= /lib/systemd/system/shop-exporter.service
      sudo adduser --system --group --no-create-home shopexp
      # Jetzt läuft postinst durch: Verzeichnis anlegen, Dienst aktivieren und starten.
      sudo dpkg --configure -a
      sudo dpkg --audit
      systemctl status shop-exporter --no-pager
      curl -fsS http://127.0.0.1:9100/metrics
    hints:
      - "Welches Paket ist nicht fertig installiert? `sudo dpkg --audit` und die ersten beiden Buchstaben in `dpkg -l` verraten es."
      - "`sudo dpkg --configure -a` wiederholt die Konfiguration und zeigt die Fehlermeldung des Skripts. Das Skript selbst liegt unter `/var/lib/dpkg/info/`."
      - "Das Skript und die Unit erwarten einen Systembenutzer. Lege ihn mit `adduser --system --group` an und wiederhole dann die Konfiguration."
    explanation: |
      `dpkg -i` hat das Paket entpackt, aber das `postinst`-Skript scheiterte an `install -o shopexp`: Den Systembenutzer legt in eurer Umgebung sonst die Konfigurationsverwaltung an, auf `web01` lief sie nie. Damit stand das Paket auf `half-configured` (`iF`), und jeder apt-Aufruf versuchte, es mitzukonfigurieren, und brach mit demselben Fehler ab. `dpkg --audit` zeigt solche Pakete, `dpkg --configure -a` wiederholt die Konfiguration und nennt die Ursache.

      Die Reparatur gehört an die Ursache: Benutzer anlegen, Konfiguration wiederholen. Die Zeile aus dem `postinst` zu löschen hätte dpkg zufriedengestellt, aber der Dienst wäre ohne Benutzer und Verzeichnis nicht gestartet. Ein sauberes Paket legt seinen Systembenutzer übrigens selbst im `postinst` an (`adduser --system`), statt sich darauf zu verlassen.
    resources:
      - title: dpkg(1) – --audit und --configure
        url: https://manpages.debian.org/bookworm/dpkg/dpkg.1.en.html
      - title: Debian Policy · Maintainer scripts
        url: https://www.debian.org/doc/debian-policy/ch-maintainerscripts.html

  - id: bibliothek-fehlt
    type: scenario
    title: Das Monitoring sieht web01 nicht mehr
    prompt: |
      Seit dem Umzug auf `web01` kommen beim Uptime-Monitoring der Firma Acme keine Werte mehr an. Laut Support des Herstellers ruft `acme-check.service` alle fünf Minuten die Startseite des Shops auf (`http://localhost/`) und legt das Ergebnis in `/var/lib/acme/last-check.html` ab. `acme-check` ist ein vom Hersteller gebautes curl und liegt samt eigener Bibliothek unter `/opt/acme`.

      Bring die Prüfung wieder zum Laufen. Sie soll als Dienst funktionieren und ebenso, wenn ein beliebiger Benutzer `/opt/acme/bin/acme-check` von Hand aufruft. Setze dafür keine Umgebungsvariablen und kopiere nichts in die Bibliotheksverzeichnisse der Distribution unter `/usr/lib`.
    setup: |
      set -e
      # Nachgestellt: Kopien von curl und libcurl, in denen der Bibliotheksname durch libacme.so.4 ersetzt ist.
      mkdir -p /opt/acme/bin /opt/acme/lib /var/lib/acme
      lib=$(readlink -f /usr/lib/i386-linux-gnu/libcurl.so.4)
      perl -pe 's/libcurl\.so\.4/libacme.so.4/g' /usr/bin/curl > /opt/acme/bin/acme-check
      perl -pe 's/libcurl\.so\.4/libacme.so.4/g' "$lib" > /opt/acme/lib/libacme.so.4.8.0
      chmod 755 /opt/acme/bin/acme-check
      chmod 644 /opt/acme/lib/libacme.so.4.8.0
      cat > /etc/systemd/system/acme-check.service <<'EOF'
      [Unit]
      Description=Acme Uptime: Startseite des Shops prüfen
      After=nginx.service

      [Service]
      Type=oneshot
      ExecStart=/opt/acme/bin/acme-check -fsS --max-time 10 -o /var/lib/acme/last-check.html http://localhost/
      EOF
      cat > /etc/systemd/system/acme-check.timer <<'EOF'
      [Unit]
      Description=Acme Uptime alle fünf Minuten

      [Timer]
      OnCalendar=*:0/5

      [Install]
      WantedBy=timers.target
      EOF
      # Wie systemctl enable, aber ohne dessen zusätzliche Reloads (unter Emulation je rund 4 s)
      ln -s /lib/systemd/system/nginx.service /etc/systemd/system/multi-user.target.wants/nginx.service
      mkdir -p /etc/systemd/system/timers.target.wants
      ln -s /etc/systemd/system/acme-check.timer /etc/systemd/system/timers.target.wants/acme-check.timer
      systemctl daemon-reload
      systemctl start nginx acme-check.timer
      systemctl start acme-check.service 2>/dev/null || true
    checks:
      - name: acme-check.service läuft fehlerfrei durch
        run: systemctl start acme-check.service
      - name: Die Prüfung hat die Startseite abgerufen
        run: grep -q 'Welcome to nginx' /var/lib/acme/last-check.html
      - name: acme-check startet für jeden Benutzer ohne Umgebungsvariablen
        run: runuser -u nobody -- env -i /opt/acme/bin/acme-check --version
      - name: Unter /usr/lib liegt keine Kopie von libacme
        run: |
          found=$(find /usr/lib -maxdepth 2 -name 'libacme*')
          [ -z "$found" ] || { echo "Gehört nicht hierher: $found"; exit 1; }
    solution: |
      # Der Dienst scheitert sofort, das Journal nennt den Grund:
      # error while loading shared libraries: libacme.so.4: cannot open shared object file
      systemctl status acme-check.service --no-pager
      journalctl -u acme-check.service -n 5 --no-pager
      ldd /opt/acme/bin/acme-check | grep 'not found'
      # Die Bibliothek liegt da, aber in einem Verzeichnis, das der Loader nicht kennt. Auch der Link libacme.so.4 fehlt.
      ls -l /opt/acme/lib
      echo /opt/acme/lib | sudo tee /etc/ld.so.conf.d/acme.conf
      # ldconfig nimmt das Verzeichnis in den Cache auf und legt den SONAME-Link an.
      sudo ldconfig
      /sbin/ldconfig -p | grep libacme
      ls -l /opt/acme/lib
      ldd /opt/acme/bin/acme-check | grep libacme
      sudo systemctl start acme-check.service
      head -n 5 /var/lib/acme/last-check.html
    hints:
      - "Was sagt der Dienst? `systemctl status acme-check` und das Journal zeigen die Meldung des Loaders."
      - "`ldd /opt/acme/bin/acme-check` zeigt, welche Bibliothek nicht gefunden wird. Vergleiche mit `ls -l /opt/acme/lib`: Unter welchem Namen sucht der Loader, und unter welchem liegt die Datei?"
      - "Der Loader sucht in `/etc/ld.so.cache`. Ein neues Verzeichnis kommt über eine Datei in `/etc/ld.so.conf.d/` und `sudo ldconfig` hinein; `ldconfig` legt dabei auch den fehlenden Link an."
    explanation: |
      `acme-check` verlangt die Bibliothek unter ihrem SONAME `libacme.so.4`. Der Loader sucht sie in `LD_LIBRARY_PATH`, im `RUNPATH` des Programms, in `/etc/ld.so.cache` und in den Standardverzeichnissen. `/opt/acme/lib` steht nirgends, und selbst dort lag nur `libacme.so.4.8.0` ohne den Link mit dem SONAME, etwa weil beim Kopieren die symbolischen Links verloren gingen. Deshalb hätte auch `LD_LIBRARY_PATH=/opt/acme/lib` allein nicht geholfen.

      Eine Datei in `/etc/ld.so.conf.d/` plus `ldconfig` löst beides: Das Verzeichnis kommt in den Cache, und `ldconfig` legt den Link `libacme.so.4 → libacme.so.4.8.0` an. Das wirkt für jeden Prozess, egal ob systemd, cron oder ein Benutzer ihn startet. Eine Umgebungsvariable in der Unit hätte nur den Dienst repariert, eine Kopie nach `/usr/lib` hätte eine Datei ohne Paket in ein Verzeichnis des Paketmanagers gelegt.
    resources:
      - title: ld.so(8) – Suchreihenfolge
        url: https://man7.org/linux/man-pages/man8/ld.so.8.html
      - title: ldconfig(8)
        url: https://man7.org/linux/man-pages/man8/ldconfig.8.html

  - id: downgrade-festhalten
    type: scenario
    title: Das Update von heute Nacht muss weg
    prompt: |
      Heute Nacht wurde `shopctl` auf `web01` von 1.4.2 auf 2.0.0 aktualisiert. Seitdem stürzt `shopctl report` ab, und der Tagesbericht für den Vertrieb fehlt. Der Hersteller bestätigt einen Fehler in 2.0.0 und liefert frühestens nächste Woche eine korrigierte Version.

      Hol die vorige Version zurück und sorge dafür, dass das nächste `apt upgrade` die 2.0.0 nicht wieder einspielt. Das interne Repository `apt.shop.internal` bietet nur noch 2.0.0-1 an. Es bleibt eingebunden, weil von dort auch andere Pakete kommen.
    setup: |
      set -e
      # Internes Repository mit nur noch shopctl 2.0.0-1, signiert wie im Lab der Lektion. 1.4.2-1 liegt im Cache von apt.
      export SOURCE_DATE_EPOCH=1790000000
      deb() { # Paket Version Beschreibung Ziel; das Programm /usr/bin/<Paket> kommt von stdin
        d=$(mktemp -d)/$1; mkdir -p "$d/DEBIAN" "$d/usr/bin"
        printf 'Package: %s\nVersion: %s\nArchitecture: all\nMaintainer: Plattform-Team <plattform@shop.example>\nDescription: %s\n' "$1" "$2" "$3" > "$d/DEBIAN/control"
        cat > "$d/usr/bin/$1"; chmod 755 "$d/usr/bin/$1"
        dpkg-deb --root-owner-group -b "$d" "$4" > /dev/null
      }
      pool=/srv/apt/debian/pool/main/s/shopctl
      mkdir -p $pool /srv/apt/debian/dists/bookworm/main/binary-i386
      deb shopctl 1.4.2-1 'Verwaltung des Shops' /var/cache/apt/archives/shopctl_1.4.2-1_all.deb <<'P'
      #!/bin/sh
      case "$1" in
        report) echo 'Bestellungen heute: 42, davon offen: 3' ;;
        --version) echo 'shopctl 1.4.2' ;;
        *) echo 'Aufruf: shopctl report | --version' >&2; exit 2 ;;
      esac
      P
      deb shopctl 2.0.0-1 'Verwaltung des Shops' $pool/shopctl_2.0.0-1_all.deb <<'P'
      #!/bin/sh
      case "$1" in
        report) echo 'Lade Bestellungen ...'; kill -SEGV $$ ;;
        --version) echo 'shopctl 2.0.0' ;;
        *) echo 'Aufruf: shopctl report | --version' >&2; exit 2 ;;
      esac
      P
      cp $pool/shopctl_2.0.0-1_all.deb /var/cache/apt/archives/
      cd /srv/apt/debian
      f=pool/main/s/shopctl/shopctl_2.0.0-1_all.deb
      { dpkg-deb -f $f; printf 'Filename: %s\nSize: %s\nSHA256: %s\n\n' $f "$(stat -c %s $f)" "$(sha256sum < $f | cut -d' ' -f1)"; } > dists/bookworm/main/binary-i386/Packages
      cat > dists/bookworm/InRelease <<'R'
      -----BEGIN PGP SIGNED MESSAGE-----
      Hash: SHA512

      Origin: Shop
      Label: Shop intern
      Suite: bookworm
      Codename: bookworm
      Date: Mon, 28 Sep 2026 02:00:00 UTC
      Architectures: i386 amd64
      Components: main
      SHA256:
       a8ec1d90ea26477402a8d628c11311b2a7ba17d4baf2213b6f783e03088ff606 276 main/binary-i386/Packages

      -----BEGIN PGP SIGNATURE-----

      iHUEARYKAB0WIQS/YAcaAj98QHIboA2hGgwPycS3DQUCarnKIAAKCRChGgwPycS3
      Df9QAQD7sqNYH4FaL8YZg4IiRoi4QO9UwX6rBe7A7I00ZRor+gD/bYtFMJmkiGOA
      wqLNT+IZBPLR/gdgLmpq9M7gLQMtrgs=
      =uVFz
      -----END PGP SIGNATURE-----
      R
      install -d /etc/apt/keyrings
      cat > /etc/apt/keyrings/shop.asc <<'K'
      -----BEGIN PGP PUBLIC KEY BLOCK-----

      mDMEaVt9kBYJKwYBBAHaRw8BAQdAoQtNQfYDDe6EB6PAwh1Gg549u9PZdIwzZwH+
      eZXEhA20JlNob3AgUGxhdHRmb3JtLVRlYW0gPGFwdEBzaG9wLmV4YW1wbGU+iJAE
      ExYKADgWIQS/YAcaAj98QHIboA2hGgwPycS3DQUCaVt9kAIbAwULCQgHAgYVCgkI
      CwIEFgIDAQIeAQIXgAAKCRChGgwPycS3Dc/MAP9dLy4V8rZd9tD0uPFYUoRl7Ufw
      BeiMSVatvncD0BmM0AEAyspMUNiEwAYHjYAKlOT8dkDwCWOgdiRnbm8k/lgjSgI=
      =3nZh
      -----END PGP PUBLIC KEY BLOCK-----
      K
      printf '%s\n' 'Types: deb' 'URIs: http://apt.shop.internal/debian' 'Suites: bookworm' 'Components: main' \
        'Signed-By: /etc/apt/keyrings/shop.asc' > /etc/apt/sources.list.d/shop.sources
      sed -i '/^Types:/i Enabled: no' /etc/apt/sources.list.d/debian.sources
      rm -f /etc/apt/apt.conf.d/docker-clean
      echo '127.0.30.10 apt.shop.internal' >> /etc/hosts
      systemd-run --quiet --unit=apt-shop busybox httpd -f -p 127.0.30.10:80 -h /srv/apt
      dpkg -i /var/cache/apt/archives/shopctl_1.4.2-1_all.deb > /dev/null
      dpkg -i /var/cache/apt/archives/shopctl_2.0.0-1_all.deb > /dev/null
      apt-get update -qq
    checks:
      - name: shopctl 1.4.2-1 ist installiert
        run: |
          v=$(dpkg-query -W -f '${Version}' shopctl)
          echo "Installiert: $v"
          [ "$v" = 1.4.2-1 ]
      - name: Der Tagesbericht läuft wieder
        run: runuser -u ops -- shopctl report
      - name: apt upgrade würde 2.0.0 nicht wieder einspielen
        run: |
          for cmd in upgrade dist-upgrade; do
            if apt-get -s "$cmd" | grep '^Inst shopctl'; then exit 1; fi
          done
      - name: Das interne Repository ist weiter eingebunden
        run: apt-cache madison shopctl | grep 2.0.0-1
    solution: |
      # Was ist heute Nacht passiert? dpkg protokolliert jede Änderung.
      grep shopctl /var/log/dpkg.log | grep upgrade
      shopctl report
      # Das Repository kennt nur noch 2.0.0-1, ein apt install shopctl=1.4.2-1 findet nichts.
      apt-cache policy shopctl
      # apt-get hat beide Versionen im Cache behalten.
      ls /var/cache/apt/archives/
      sudo apt-get install -y --allow-downgrades /var/cache/apt/archives/shopctl_1.4.2-1_all.deb
      shopctl report
      # Festhalten, bis der Fix da ist, und prüfen, was ein Upgrade täte.
      sudo apt-mark hold shopctl
      apt-mark showhold
      sudo apt-get -s upgrade
    hints:
      - "`apt-cache policy shopctl` zeigt, welche Versionen apt aus dem Repository kennt. Wo könnte die alte Version noch liegen, wenn das Repository sie nicht mehr hat?"
      - "`apt-get` behält heruntergeladene Pakete in `/var/cache/apt/archives`. Eine `.deb`-Datei installierst du mit `apt install` und ihrem Pfad; ein Downgrade braucht bei `-y` `--allow-downgrades`."
      - "Damit `apt upgrade` das Paket auslässt: `apt-mark hold` oder ein Pin in `/etc/apt/preferences.d/`. Prüfe mit `sudo apt-get -s upgrade`."
    explanation: |
      Das interne Repository hält wie viele Werkzeuge (etwa reprepro) nur eine Version pro Paket. `apt install shopctl=1.4.2-1` findet deshalb nichts. `apt-get` hatte aber beide Versionen heruntergeladen und in `/var/cache/apt/archives` liegen lassen. Aus diesem Cache installierst du die alte Datei direkt; weil das ein Downgrade ist, verlangt apt bei `-y` ausdrücklich `--allow-downgrades`. `dpkg -i` mit der Datei hätte ebenfalls funktioniert.

      Ohne Festhalten wäre 2.0.0 beim nächsten `apt upgrade` sofort zurück, denn das Repository bietet sie als neuere Version an. `apt-mark hold` sperrt das Paket für `upgrade` und `dist-upgrade`. Ein Pin mit `Pin: version 1.4.*` und einer Priorität über 1000 hätte dasselbe erreicht und steht dazu sichtbar als Datei im System. Notiere dir den Hold: `apt-mark unhold`, sobald der Fix da ist, sonst fehlen später auch Sicherheitsupdates.
    resources:
      - title: apt-mark(8)
        url: https://manpages.debian.org/bookworm/apt/apt-mark.8.en.html
      - title: apt_preferences(5)
        url: https://manpages.debian.org/bookworm/apt/apt_preferences.5.en.html
