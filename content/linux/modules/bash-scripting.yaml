id: bash-scripting
title: Robuste Bash-Skripte
level: 2
minutes: 230
summary: Du automatisierst kleine Betriebsaufgaben mit klaren Eingaben, sicheren Argumentgrenzen, prüfbaren Fehlerpfaden und aufgeräumten temporären Dateien – und mit Skripten, die unter sudo, cron, systemd und ssh genauso laufen wie im Terminal.
goals:
  - Du bewahrst Argumentgrenzen mit Quoting, Arrays und "$@".
  - Du schreibst Bedingungen, Schleifen und Funktionen mit klaren Rückgabecodes.
  - Du behandelst erwartete Fehler explizit und erklärst die Grenzen von set -euo pipefail.
  - Du prüfst Skripte mit bash -n, ShellCheck und kleinen Testfällen.
  - Du erklärst, welche Umgebung ein Skript unter sudo, cron, systemd und `ssh host befehl` bekommt, und machst es davon unabhängig.
