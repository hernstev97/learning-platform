lab: |
  set -e
  cd /home/ops
  # Beispieldateien für Schleifen, Funktionen und Fehlerbeispiele
  printf '%s\n' 'erste Zeile' '  eingerückt' 'C:\temp\neu' > eingabe.txt
  echo 'Bericht fertig' > bericht.txt
  printf '%s\n' '10:02 INFO Start' '10:05 ERROR Datenbank antwortet nicht' '10:06 INFO Neuer Versuch' > app.log
  mkdir -p skripte
  cat > skripte/kaputt.sh <<'S'
  #!/usr/bin/env bash
  ziel=${1:-/tmp}
  if [[ -d $ziel ]]; then
    printf 'Ziel: %s\n' "$ziel"
  printf 'fertig\n'
  S
  cat > skripte/strikt.sh <<'S'
  #!/usr/bin/env bash
  set -euo pipefail
  anzahl=$(grep ERROR "$HOME/app.log" | wc -l)
  printf 'ERROR-Zeilen in app.log: %s\n' "$anzahl"
  anzahl=$(grep ERROR "$HOME/alt.log" | wc -l)
  printf 'ERROR-Zeilen in alt.log: %s\n' "$anzahl"
  S
  cat > skripte/aufraeumen.sh <<'S'
  #!/usr/bin/env bash
  set -euo pipefail
  tmp=$(mktemp /tmp/bericht.XXXXXX)
  trap 'rm -f -- "$tmp"; printf "aufgeräumt: %s\n" "$tmp" >&2' EXIT
  printf 'Zwischenstand\n' > "$tmp"
  printf 'temporäre Datei: %s\n' "$tmp"
  grep ERROR "$HOME/alt.log" >> "$tmp"
  printf 'nie erreicht\n'
  S
  # Abschnitt „Welche Umgebung ein Skript erbt“: eine Variable im interaktiven Teil von ~/.bashrc, ein Werkzeug
  # außerhalb des PATH und ein Schlüssel, damit `ssh localhost` ohne Passwort funktioniert.
  echo 'export SHOP_UMGEBUNG=produktion' >> .bashrc
  mkdir -p /opt/tools/bin
  printf '#!/bin/sh\necho "Offene Bestellungen: 3"\n' > /opt/tools/bin/shopstat
  chmod 755 /opt/tools/bin/shopstat
  install -d -m 700 .ssh
  ssh-keygen -q -t ed25519 -N '' -C ops@web01 -f .ssh/id_ed25519
  cp .ssh/id_ed25519.pub .ssh/authorized_keys
  printf 'localhost %s\n' "$(cut -d' ' -f1,2 /etc/ssh/ssh_host_ed25519_key.pub)" > .ssh/known_hosts
  chown -R ops:ops /home/ops
lesson: |
  Ein wiederkehrender Export braucht immer dieselben Schritte: Eingaben prüfen, Dateien auswählen, eine Auswertung erzeugen und das Ergebnis ablegen. Ein Bash-Skript macht diese Schritte reproduzierbar. Es wird allerdings schnell gefährlich, wenn ein Pfad mit Leerzeichen plötzlich zwei Argumente ergibt oder ein fehlgeschlagener Befehl unbemerkt bleibt.

  Bash ist besonders geeignet, vorhandene Programme miteinander zu verbinden. Sie ist keine gute Ausrede, komplexe Datenmodelle in immer längere Einzeiler zu pressen. In diesem Modul baust du kleine, nachvollziehbare Skripte. Alle Beispiele laufen mit Bash; deine interaktive fish-Shell kann das Skript starten, muss aber nicht dessen Syntax verstehen.

  Die Beispiele mit „Im Terminal“ kannst du in einem Debian 12 direkt ausprobieren. Die Dateien `eingabe.txt`, `bericht.txt` und `app.log` und die Skripte in `~/skripte` liegen dort schon bereit.

  ## Ein Skript hat einen Vertrag

  Der Shebang benennt den Interpreter, wenn du die Datei direkt startest. `#!/usr/bin/env bash` sucht Bash über PATH. `bash bericht.sh` wählt den Interpreter ausdrücklich und benötigt kein x-Bit an der Skriptdatei. `./bericht.sh` benötigt es. Auf kontrollierten Servern kann ein fester Interpreterpfad sinnvoll sein; dokumentiere die erwartete Umgebung ([Bash · Shell Scripts](https://www.gnu.org/software/bash/manual/html_node/Shell-Scripts.html)).

  ```bash
  #!/usr/bin/env bash
  if [[ $# -ne 1 ]]; then
    printf 'Aufruf: %s DATEI\n' "$0" >&2
    exit 2
  fi
  if [[ ! -f $1 ]]; then
    printf 'Keine reguläre Datei: %s\n' "$1" >&2
    exit 1
  fi
  wc -l < "$1"
  ```

  Der Vertrag lautet: genau ein Argument, eine reguläre Datei, Ergebnis auf stdout, Diagnose auf stderr. `$0` enthält den Aufrufnamen, `$#` die Argumentanzahl und `$1` das erste Argument. Status 0 bedeutet Erfolg; nicht null kennzeichnet einen anderen Ausgang. Der genaue Vertrag eines Fremdprogramms steht in dessen Dokumentation, etwa bei grep mit 1 für „kein Treffer“.

  Prüfe zuerst die Argumentzahl, bevor du unter `set -u` auf `$1` zugreifst. Dateiexistenzprüfungen ersetzen außerdem keine Fehlerprüfung der eigentlichen Operation: Zwischen Prüfung und Lesen kann eine Datei verschwinden oder sich ändern. Eine verständliche Vorprüfung verbessert die Fehlermeldung; sie garantiert nicht den späteren Erfolg.

  ## Quoting hält Daten zusammen

  In Bash läuft eine unquotierte Variablenerweiterung in vielen Befehlsargumenten durch Wortzerlegung und Dateinamenexpansion. Enthält ein Pfad Leerzeichen, kann er zu mehreren Argumenten werden. Enthält er `*`, kann dieser anschließend Dateinamen treffen. `"$pfad"` bewahrt dagegen genau ein Argument ([Bash · Double Quotes](https://www.gnu.org/software/bash/manual/html_node/Double-Quotes.html), [ShellCheck SC2086](https://www.shellcheck.net/wiki/SC2086)).

  ```bash vm
  pfad='Berichte September.txt'
  printf '<%s>\n' "$pfad"
  printf '%s\n' '$pfad'
  printf '%s\n' "Datei: $pfad"
  ```

  Einfache Anführungszeichen verhindern Erweiterungen vollständig. Doppelte erlauben unter anderem Variablen und `$(...)`, halten das Ergebnis aber zusammen. Schreibe `printf '%s\n' "$wert"`, damit ein Prozentzeichen im Wert nicht als Formatsteuerung interpretiert wird. Verwende `--` vor Dateiparametern bei Werkzeugen, die es unterstützen, damit ein Name wie `-n` nicht zur Option wird.

  Der klassische Fehler `rm -r $ziel` kann mehr Ziele treffen als vorgesehen. Auch `rm -r "$ziel"` schützt aber nicht vor einem fachlich falschen, korrekt gequoteten Ziel. Deshalb brauchen löschende Skripte zusätzlich eine begrenzte Zielwurzel, Eingabeprüfung und zunächst einen sichtbaren Plan. In diesem Kurs testen wir Argumente mit `printf`, bevor wir irgendeine Löschoperation verwenden.

  ```bash vm
  dateien=('Bericht eins.txt' 'Bericht zwei.txt')
  printf 'Argument: <%s>\n' "${dateien[@]}"
  printf 'Aufrufargument: <%s>\n' "$@"
  ```

  `"$@"` gibt jedes Positionsargument einzeln weiter, `"$*"` fasst sie zu einem String zusammen, getrennt durch das erste Zeichen von IFS. Arrays besitzen dieselbe wichtige Unterscheidung zwischen `[@]` und `[*]`. Baue daher keine Befehle als String zusammen, die du später mit `eval` ausführen musst. Ein Array bewahrt die bereits bekannte Struktur ([Bash · Arrays](https://www.gnu.org/software/bash/manual/html_node/Arrays.html)).

  ## Bedingungen, Schleifen und kleine Funktionen

  `[[ ... ]]` ist ein Bash-Konstrukt mit weniger Quoting-Fallen als der portable Befehl `[ ... ]`. Es unterstützt Tests wie `-f`, `-d`, `-e`, `-z` und `-n`. Numerische Vergleiche verwenden `-eq`, `-lt` oder arithmetische Ausdrücke in `(( ... ))`; `<` ist in `[[ ... ]]` ein Stringvergleich. Quote bei `[[ $name == "$muster" ]]` die rechte Seite, wenn du eine wörtliche Gleichheit statt eines Musters willst ([Bash · Conditional Constructs](https://www.gnu.org/software/bash/manual/html_node/Conditional-Constructs.html)).

  ```bash
  if [[ -z $ziel ]]; then
    printf 'Ziel fehlt\n' >&2
  elif [[ -d $ziel ]]; then
    printf 'Verzeichnis vorhanden\n'
  else
    printf 'Ziel ist kein Verzeichnis\n' >&2
  fi

  case ${1:-} in
    --help) printf 'Aufruf: report DATEI\n' ;;
    '') printf 'Argument fehlt\n' >&2; exit 2 ;;
  esac
  ```

  Schleifen sollten echte Arrays oder Dateimuster durchlaufen. `for f in *.log` lässt das Muster ohne Treffer normalerweise wörtlich stehen. Prüfe dann etwa `[[ -f $f ]] || continue`, oder aktiviere bewusst `nullglob`. Über `$(ls)` zu iterieren ist falsch, weil du eine für Menschen formatierte Ausgabe wieder in Argumente zerlegst.

  ```bash vm
  for datei in *.log; do
    [[ -f $datei ]] || continue
    printf '%s\n' "$datei"
  done

  while IFS= read -r zeile || [[ -n $zeile ]]; do
    printf '<%s>\n' "$zeile"
  done < eingabe.txt
  ```

  `IFS=` verhindert das Abschneiden führenden beziehungsweise folgenden Trennleerraums durch `read`. `-r` behandelt Backslashes als Daten. Die zusätzliche Bedingung verarbeitet auch eine letzte nicht leere Zeile ohne Zeilenumbruch. Eine per Pipe gespeiste while-Schleife läuft in Bash üblicherweise in einer Subshell; Änderungen ihrer Variablen stehen danach nicht verlässlich im aufrufenden Kontext bereit. Eingabeumleitung vermeidet diese Falle ([Bash · Bash Builtins](https://www.gnu.org/software/bash/manual/html_node/Bash-Builtins.html)).

  ```bash vm
  pruefe_datei() {
    local datei=$1
    [[ -r $datei ]] || return 1
    printf '%s\n' "$datei"
  }
  if pruefe_datei 'bericht.txt'; then
    printf 'Weiterverarbeitung möglich\n'
  fi
  ```

  `local` begrenzt die Variable auf den Funktionsaufruf. `return` beendet die Funktion mit einem Status, `exit` den Skriptprozess. Benenne Funktionen nach ihrem Ergebnis oder ihrer Wirkung und halte externe Seiteneffekte sichtbar. Ein Rückgabecode ist kein frei großer Zahlenwert; Daten gehören auf stdout oder in klar vereinbarte Variablen.

  ## Expansionen und Optionen ohne Rätsel

  `$(befehl)` ersetzt sich durch stdout des Befehls und entfernt abschließende Zeilenumbrüche. Quote das Ergebnis bei späterer Übergabe. `$(( ... ))` berechnet ganze Zahlen. Parameterexpansion kann einen Standard einsetzen oder Pfadteile entfernen, ohne einen neuen Prozess zu starten ([Bash · Shell Parameter Expansion](https://www.gnu.org/software/bash/manual/html_node/Shell-Parameter-Expansion.html)).

  ```bash vm
  ausgabe=${REPORT_DIR:-./berichte}
  pfad='/srv/logs/app.log'
  name=${pfad##*/}
  stamm=${name%.*}
  anzahl=$(( 3 + 4 ))
  printf '%s %s %s %s\n' "$ausgabe" "$name" "$stamm" "$anzahl"
  ```

  `:-` verwendet den Standard bei unset oder leer; ohne Doppelpunkt wird nur unset geprüft. `##` entfernt den längsten passenden Präfix, `%` den kürzesten passenden Suffix. Das sind Shell-Muster, keine regulären Ausdrücke. Für aufwendige Pfadlogik mit mehreren Randfällen ist ein dafür vorgesehenes Werkzeug oder Python oft lesbarer.

  `getopts` hilft bei kurzen Optionen. Ein Doppelpunkt hinter einem Buchstaben verlangt ein Argument. Nach der Schleife entfernt `shift "$((OPTIND - 1))"` die verarbeiteten Optionen. Dokumentiere eine konkrete Aufrufform, statt eine Mischung aus unvollständigen Sonderfällen zu bauen.

  ```bash
  ziel='./berichte'
  while getopts 'o:h' opt; do
    case $opt in
      o) ziel=$OPTARG ;;
      h) printf 'report [-o VERZEICHNIS] DATEI\n'; exit 0 ;;
      *) exit 2 ;;
    esac
  done
  shift "$((OPTIND - 1))"
  ```

  ## Fehler behandeln und temporäre Dateien aufräumen

  `set -euo pipefail` ist eine verbreitete Hilfestellung: `-u` meldet viele Zugriffe auf nicht gesetzte Variablen, `pipefail` macht eine Pipeline bei einem fehlgeschlagenen Teilbefehl erfolglos und `-e` beendet die Shell bei bestimmten unkontrollierten Fehlerstatus. Es ist kein Ersatz für Kontrollfluss. `-e` hat Ausnahmen, etwa in Bedingungen, Teilen von `&&`/`||`-Listen und bestimmten Funktionskontexten ([Bash · The Set Builtin](https://www.gnu.org/software/bash/manual/html_node/The-Set-Builtin.html)).

  ```bash
  if grep -q 'ERROR' app.log; then
    printf 'Fehler gefunden\n'
  else
    status=$?
    if [[ $status -eq 1 ]]; then
      printf 'Keine Fehlerzeilen\n'
    else
      printf 'Log konnte nicht geprüft werden\n' >&2
      exit "$status"
    fi
  fi
  ```

  Erfasse `$?` sofort, weil der nächste Befehl ihn ersetzt. Bei `if ! befehl` wäre `$?` im then-Zweig der Status der Negation, nicht mehr der ursprüngliche Fehler. Eine Funktion, die innerhalb einer Bedingung aufgerufen wird, darf sich ebenfalls nicht blind auf `-e` verlassen. Prüfe kritische Schritte ausdrücklich.

  Was `pipefail` und `-e` zusammen bewirken, zeigt `strikt.sh`. Die Datei `alt.log` gibt es nicht:

  ```console vm
  $ cat ~/skripte/strikt.sh
  #!/usr/bin/env bash
  set -euo pipefail
  anzahl=$(grep ERROR "$HOME/app.log" | wc -l)
  printf 'ERROR-Zeilen in app.log: %s\n' "$anzahl"
  anzahl=$(grep ERROR "$HOME/alt.log" | wc -l)
  printf 'ERROR-Zeilen in alt.log: %s\n' "$anzahl"
  $ bash ~/skripte/strikt.sh; echo "Status: $?"
  ERROR-Zeilen in app.log: 1
  grep: /home/ops/alt.log: No such file or directory
  Status: 2
  ```

  Ohne `pipefail` hätte `wc -l` den Fehler von `grep` verdeckt: Die Pipeline wäre erfolgreich gewesen, und das Skript hätte „ERROR-Zeilen in alt.log: 0“ gemeldet. Mit `pipefail` ist die Pipeline so erfolglos wie `grep`, und `-e` beendet das Skript mit dessen Status 2.

  Für temporäre Dateien verwendet man [`mktemp`](https://www.gnu.org/software/coreutils/manual/html_node/mktemp-invocation.html), nicht vorhersehbare Namen wie `/tmp/report.txt`. Ein EXIT-Trap räumt beim normalen Ende und beim Fehlerausstieg auf. Er läuft nicht bei SIGKILL oder Stromausfall; das Skript muss solche Reste tolerieren. Ein ERR-Trap kann Diagnosen ergänzen, unterliegt aber ähnlichen Kontextgrenzen wie `-e` und ersetzt keine Fehlerbehandlung.

  ```bash
  tmp=$(mktemp) || exit 1
  trap 'rm -f -- "$tmp"' EXIT
  if ! printf 'fertiger Bericht\n' > "$tmp"; then
    printf 'Temporäre Ausgabe fehlgeschlagen\n' >&2
    exit 1
  fi
  cat -- "$tmp"
  ```

  Die einfache Quote verschiebt die Expansion von `$tmp` bis zur Trap-Ausführung. Wir löschen ausschließlich die selbst erzeugte temporäre Datei. Für eine atomare Veröffentlichung per `mv` muss die temporäre Datei auf demselben Dateisystem wie das Ziel liegen; bei parallelen Schreibern brauchst du zusätzlich ein Synchronisationskonzept.

  `aufraeumen.sh` bricht mitten in der Arbeit ab. Der EXIT-Trap läuft trotzdem und entfernt die Datei:

  ```console vm
  $ cat ~/skripte/aufraeumen.sh
  #!/usr/bin/env bash
  set -euo pipefail
  tmp=$(mktemp /tmp/bericht.XXXXXX)
  trap 'rm -f -- "$tmp"; printf "aufgeräumt: %s\n" "$tmp" >&2' EXIT
  printf 'Zwischenstand\n' > "$tmp"
  printf 'temporäre Datei: %s\n' "$tmp"
  grep ERROR "$HOME/alt.log" >> "$tmp"
  printf 'nie erreicht\n'
  $ bash ~/skripte/aufraeumen.sh
  temporäre Datei: /tmp/bericht.dpBMRe
  grep: /home/ops/alt.log: No such file or directory
  aufgeräumt: /tmp/bericht.dpBMRe
  $ ls /tmp/bericht.* 2>/dev/null || echo 'keine Reste in /tmp'
  keine Reste in /tmp
  ```

  > [!PRAXIS]
  > Teste vor dem produktiven Einsatz leere Eingaben, Namen mit Leerzeichen, einen fehlenden Pfad und einen absichtlich erfolglosen Fremdbefehl. Ein Skript ist erst robust, wenn der Fehlerpfad ebenso klar ist wie der Erfolgsfall.

  ## Welche Umgebung ein Skript erbt: sudo, cron, systemd und ssh

  Ein Skript, das im Terminal fehlerfrei läuft, scheitert als Cronjob, als Dienst oder per `ssh`, ohne dass sich eine Zeile geändert hat. Der Grund ist fast immer die Umgebung: andere Variablen, ein anderer `PATH`, ein anderes Arbeitsverzeichnis, manchmal eine andere Shell. Dein Terminal ist dabei der Sonderfall, denn nur dort liest Bash `~/.bashrc` vollständig ([Bash · Startup Files](https://www.gnu.org/software/bash/manual/html_node/Bash-Startup-Files.html)).

  | Aufruf | Shell und Startdateien | `PATH` auf Debian 12 | Arbeitsverzeichnis |
  | --- | --- | --- | --- |
  | Terminal | Bash mit `~/.profile` und ganz `~/.bashrc` | `/usr/local/bin:/usr/bin:/bin:/usr/local/games:/usr/games` plus deine Ergänzungen | wo du stehst |
  | `sudo befehl` | keine Shell, Umgebung zurückgesetzt | `/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin` | unverändert |
  | Cronjob | `/bin/sh`, keine Startdateien | `/usr/bin:/bin` | `$HOME` |
  | systemd-Dienst | keine Shell, nur die Werte aus der Unit | `/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin` | `/` |
  | `ssh host befehl` | `bash -c`, liest `~/.bashrc`, bricht dort früh ab | `/usr/local/bin:/usr/bin:/bin:/usr/games` | `$HOME` |

  **sudo** setzt die Umgebung zurück (`env_reset`) und sucht Programme nur im `secure_path` aus `/etc/sudoers` ([sudoers(5) · Command environment](https://www.sudo.ws/docs/man/sudoers.man/#Command_environment)). Exportierte Variablen und eigene `PATH`-Einträge kommen nicht an:

  ```console vm fails
  $ export BACKUP_ZIEL=/srv/backup
  $ sh -c 'echo "${BACKUP_ZIEL:-leer}"'
  /srv/backup
  $ sudo sh -c 'echo "${BACKUP_ZIEL:-leer}"'
  leer
  $ export PATH="$PATH:/opt/tools/bin"
  $ shopstat
  Offene Bestellungen: 3
  $ sudo shopstat
  sudo: shopstat: command not found
  ```

  **systemd** startet Dienste mit einer eigenen, kleinen Umgebung. Mit `User=` kommen `HOME`, `USER`, `LOGNAME` und `SHELL` dazu, das Arbeitsverzeichnis ist `/`. `systemd-run` zeigt, was ein Dienst sieht:

  ```console vm
  $ sudo systemd-run --quiet --wait --pipe -p User=ops env
  LANG=C.UTF-8
  PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  HOME=/home/ops
  LOGNAME=ops
  USER=ops
  SHELL=/bin/bash
  INVOCATION_ID=afafb6d24d1e4957a3ec0560c9dd8512
  SYSTEMD_EXEC_PID=360
  $ sudo systemd-run --quiet --wait --pipe -p User=ops pwd
  /
  ```

  Was ein Dienst darüber hinaus braucht, steht in der Unit oder einem Drop-in ([systemd.exec · Environment](https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#Environment)):

  ```ini title=/etc/systemd/system/backup.service.d/umgebung.conf
  [Service]
  Environment=PATH=/opt/tools/bin:/usr/local/bin:/usr/bin:/bin
  EnvironmentFile=-/etc/default/backup
  WorkingDirectory=~
  ```

  [`EnvironmentFile=`](https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#EnvironmentFile=) liest Zeilen der Form `NAME=wert`, das `-` davor erlaubt, dass die Datei fehlt. [`WorkingDirectory=~`](https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#WorkingDirectory=) steht für das Home-Verzeichnis des `User=`. In `ExecStart=` ersetzt systemd `~` dagegen nicht: Mit `ExecStart=~/bin/backup.sh` lädt die Unit gar nicht erst, `systemctl status` zeigt `bad-setting` und das Journal `Neither a valid executable name nor an absolute path`.

  **cron** startet Jobs mit `/bin/sh`, liest keine Startdateien und setzt nur wenige Variablen selbst ([crontab(5)](https://manpages.debian.org/bookworm/cron/crontab.5.en.html)). Ein Job `* * * * * env | sort > /tmp/cron-env.txt` von `ops` schreibt auf diesem Debian:

  ```text
  HOME=/home/ops
  LOGNAME=ops
  PATH=/usr/bin:/bin
  PWD=/home/ops
  SHELL=/bin/sh
  SHLVL=1
  _=/usr/bin/env
  ```

  Zwei Eigenheiten kosten regelmäßig Zeit. Ein `%` beendet in der crontab den Befehl, alles danach landet auf dessen Standardeingabe; im Befehl schreibst du deshalb `\%`. Und die Ausgabe eines Jobs verschickt cron als Mail. Ohne Mailserver verwirft es sie, im Journal steht dann nur `(CRON) info (No MTA installed, discarding output)`. Leite Ausgaben deshalb selbst in eine Logdatei um.

  **`ssh host befehl`** startet keine Login-Shell, sondern `bash -c befehl`. Die Bash von Debian liest dabei trotzdem `~/.bashrc`, weil sie erkennt, dass `sshd` sie gestartet hat (im Handbuch unter „Invoked by remote shell daemon“; ob das auch anderswo passiert, hängt davon ab, wie die Distribution Bash baut). Die `~/.bashrc` von Debian beginnt aber mit einer Abfrage, die jede nicht-interaktive Shell sofort zurückschickt:

  ```bash
  # If not running interactively, don't do anything
  case $- in
      *i*) ;;
        *) return;;
  esac
  ```

  Alles, was darunter steht, gilt nur im Terminal. Im Lab steht `export SHOP_UMGEBUNG=produktion` am Ende von `~/.bashrc`. `bash -i` startet eine neue interaktive Shell, die die Datei frisch liest:

  ```console vm
  $ tail -n 1 ~/.bashrc
  export SHOP_UMGEBUNG=produktion
  $ bash -i -c 'echo "interaktiv: ${SHOP_UMGEBUNG:-leer}"' 2>/dev/null
  interaktiv: produktion
  $ ssh localhost 'echo "ssh: ${SHOP_UMGEBUNG:-leer}"; echo "$PATH"; pwd'
  ssh: leer
  /usr/local/bin:/usr/bin:/bin:/usr/games
  /home/ops
  ```

  Ein Skript sollte deshalb selbst festlegen, was es braucht, statt es aus einer Startdatei zu erben: einen eigenen `PATH` oder absolute Pfade, ein `cd` an einen festen Ort und Pflichtvariablen mit einer klaren Meldung, wenn sie fehlen.

  ```bash
  #!/usr/bin/env bash
  set -euo pipefail
  PATH=/opt/tools/bin:/usr/local/bin:/usr/bin:/bin
  cd -- "$HOME"
  ziel=${BACKUP_ZIEL:?BACKUP_ZIEL ist nicht gesetzt}
  ```

  `${name:?text}` bricht mit `text` ab, wenn die Variable leer oder nicht gesetzt ist. Das ist lesbarer als die Meldung `unbound variable` von `set -u`.

  > [!PRAXIS] Erst die Umgebungen vergleichen
  > Läuft etwas von Hand, aber nicht als Dienst oder Cronjob, vergleiche zuerst die Umgebungen: `env` in deiner Shell gegen `sudo systemd-run --wait --pipe -p User=… env` oder einen Testjob `* * * * * env > /tmp/cron-env.txt`. Der Unterschied zeigt meist schon die Ursache.

  > [!INTERVIEW] „Das Skript läuft von Hand, aber nicht als Cronjob. Woran liegt das?“
  > Fast immer an der Umgebung. cron startet mit `/bin/sh`, `PATH=/usr/bin:/bin`, ohne `~/.bashrc` und ohne Terminal. Ich prüfe, ob alle Befehle gefunden werden, ob relative Pfade stimmen und ob Variablen aus der interaktiven Shell fehlen, und leite die Ausgabe in ein Log, weil cron sie sonst verwirft. Die Reparatur gehört ins Skript oder in die crontab, nicht in `~/.bashrc`.

  ## Häufige Fehler und Werkzeugwahl

  `bash -n script.sh` prüft die Syntax, führt aber nichts aus:

  ```console vm fails
  $ bash -n ~/skripte/kaputt.sh
  /home/ops/skripte/kaputt.sh: line 6: syntax error: unexpected end of file
  ```

  Die Meldung zeigt auf das Dateiende, der Fehler steckt aber in Zeile 3: Bash sucht bis zum Schluss vergeblich das `fi` zum `if`. Falsche Pfade, vertauschte Bedingungen und fehlende Befehle findet `bash -n` nicht. ShellCheck findet viele Quoting- und Portabilitätsfehler; lies die Erklärung zur Regel, statt die Warnung pauschal abzuschalten. Ein grüner Linter beweist weder richtige Anforderungen noch sichere Zielpfade. Führe ungefährliche Tests in einem isolierten Verzeichnis mit kleinen Fixtures aus.

  Wechsle zu Python, wenn strukturierte Daten, komplexe Fehlerobjekte, viele Zustände oder umfangreiche Tests dominieren. Bash bleibt sinnvoll für kurze Abläufe mit Prozessen und Dateien. Die Grenze ist Wartbarkeit, nicht eine magische Zeilenzahl. Ein Kollege sollte Ablauf, Argumente und Fehlerreaktion ohne langes Entschlüsseln erkennen.

  > [!INTERVIEW]
  > „Macht `set -e` mein Skript sicher?“ – Es erkennt einige unkontrollierte Fehler, hat aber dokumentierte Ausnahmen. Erwartete Statuswerte und kritische Schritte behandle ich ausdrücklich und teste sie.

  ## Zusammenfassung

  - Ein Skript braucht Eingabe-, Ausgabe- und Fehlerverträge.
  - Quoting und Arrays bewahren Argumentgrenzen.
  - Tests, Schleifen und Funktionen machen Entscheidungen sichtbar.
  - Parameterexpansion ist nützlich, solange sie lesbar bleibt.
  - `set -euo pipefail` ergänzt bewusste Fehlerbehandlung.
  - `mktemp` und `trap` begrenzen temporäre Nebenwirkungen.
  - sudo, cron, systemd und `ssh host befehl` liefern je eine eigene Umgebung; `~/.bashrc` gilt nur im Terminal.
  - Ein Skript legt `PATH`, Arbeitsverzeichnis und Pflichtvariablen selbst fest, eine Unit ergänzt sie mit `Environment=`, `EnvironmentFile=` und `WorkingDirectory=`.
  - Syntaxprüfung, Linter und echte Fehlerfalltests ergänzen sich.
exercises:
  - id: argumente
    type: choice
    title: Argumente unverändert weitergeben
    prompt: Welche Schreibweise reicht alle Positionsargumente mit ihren ursprünglichen Grenzen weiter?
    options:
      - text: '"$@"'
        correct: true
        why: Jedes Argument bleibt ein eigener Eintrag, auch wenn es Leerzeichen enthält.
      - text: '"$*"'
        correct: false
        why: Die Argumente werden innerhalb der Quotes zu einem String verbunden.
      - text: '$@'
        correct: false
        why: Ohne Quotes kann weitere Wortzerlegung und Dateinamenexpansion stattfinden.
    explanation: Die Argumentliste ist bereits strukturiert. `"$@"` bewahrt diese Struktur, statt sie in Text umzuwandeln und erneut zu zerlegen.
    resources:
      - title: Bash · Special Parameters
        url: https://www.gnu.org/software/bash/manual/html_node/Special-Parameters.html
  - id: umgebung-bashrc
    type: choice
    title: Wer liest das Ende von ~/.bashrc?
    prompt: |
      Auf einem Debian-12-Server steht am **Ende** von `~/.bashrc` des Benutzers `ops` die Zeile `export PATH="$PATH:/opt/tools/bin"`. Die Datei beginnt wie bei Debian üblich mit `case $- in *i*) ;; *) return;; esac`. In welchen Fällen findet der Aufruf `shopstat` das Programm `/opt/tools/bin/shopstat`?
    options:
      - text: "`ops` öffnet ein neues Terminal und tippt `shopstat`."
        correct: true
        why: Eine interaktive Bash liest `~/.bashrc` ganz, also auch die letzte Zeile.
      - text: "`ssh ops@web01` und danach `shopstat` an der Eingabeaufforderung."
        correct: true
        why: Die Anmeldung per ssh ohne Befehl startet eine interaktive Login-Shell; `~/.profile` liest `~/.bashrc`, und die Abfrage lässt sie durch.
      - text: "Die CI ruft `ssh ops@web01 shopstat` auf."
        correct: false
        why: Debians Bash liest dabei zwar `~/.bashrc`, aber die Abfrage am Anfang beendet das Lesen sofort, weil die Shell nicht interaktiv ist.
      - text: "Ein Cronjob von `ops`: `0 6 * * * shopstat > /tmp/stat.txt`."
        correct: false
        why: cron startet `/bin/sh` ohne Startdateien und mit `PATH=/usr/bin:/bin`.
      - text: "`sudo shopstat` im Terminal von `ops`."
        correct: false
        why: sudo sucht Programme nur im `secure_path` aus `/etc/sudoers`; dein `PATH` zählt dort nicht.
    explanation: |
      `~/.bashrc` ist eine Startdatei für interaktive Shells. Nur dort, wo ein Mensch an einer Eingabeaufforderung sitzt, kommt die Zeile am Ende an. Nicht-interaktive Aufrufe über ssh lesen die Datei bei Debian zwar, steigen aber an der `case`-Abfrage wieder aus; cron und sudo schauen gar nicht hinein. Was ein Skript oder Job braucht, gehört deshalb ins Skript, in die crontab, in die Unit oder in einen Pfad wie `/usr/local/bin`.
    resources:
      - title: Bash · Bash Startup Files
        url: https://www.gnu.org/software/bash/manual/html_node/Bash-Startup-Files.html
      - title: sudoers(5) · Command environment
        url: https://www.sudo.ws/docs/man/sudoers.man/#Command_environment
  - id: array-ausgabe
    type: output
    title: Ein Name mit Leerzeichen
    prompt: Welche Ausgabe entsteht?
    lang: bash
    code: |
      dateien=('ein bericht.txt' 'zwei.txt')
      printf '<%s>\n' "${dateien[@]}"
    expected: |
      <ein bericht.txt>
      <zwei.txt>
    verify: true
    explanation: Das gequotete Array expandiert zu zwei Argumenten. Das Leerzeichen innerhalb des ersten Dateinamens ist ein Teil der Daten.
    resources:
      - title: Bash · Arrays
        url: https://www.gnu.org/software/bash/manual/html_node/Arrays.html
  - id: standardwerte
    type: output
    title: Leer ist nicht immer unset
    prompt: Was wird ausgegeben?
    lang: bash
    code: |
      ziel=''
      printf '<%s>\n' "${ziel:-berichte}" "${ziel-berichte}"
    expected: |
      <berichte>
      <>
    verify: true
    explanation: Der Doppelpunkt bezieht leere Werte in den Standardfall ein. Ohne Doppelpunkt bleibt die gesetzte, aber leere Variable erhalten.
    resources:
      - title: Bash · Shell Parameter Expansion
        url: https://www.gnu.org/software/bash/manual/html_node/Shell-Parameter-Expansion.html
  - id: syntax-pruefen
    type: command
    title: Prüfen ohne Ausführen
    prompt: Prüfe `report.sh` mit Bash auf Syntaxfehler, ohne es auszuführen.
    answers: ["bash -n report.sh"]
    explanation: Die Option `-n` liest und prüft Syntax. Fachliche Fehler, fehlende Dateien und falsche Ergebnisse brauchen zusätzliche Tests.
    resources:
      - title: Bash · The Set Builtin
        url: https://www.gnu.org/software/bash/manual/html_node/The-Set-Builtin.html
  - id: leseschleife
    type: gap
    title: Zeilen erhalten
    prompt: Ergänze die Einstellung, die Rand-Leerraum erhält, und die read-Option für wörtliche Backslashes. Die Eingabe endet hier mit einem Zeilenumbruch.
    lang: bash
    code: |
      while ⟦IFS=⟧ read ⟦-r⟧ zeile; do
        printf '%s\n' "$zeile"
      done < eingabe.txt
    gaps:
      - label: Trennzeichen
        hint: Weise der Variablen für Feldtrenner einen leeren Wert zu.
      - label: Backslashes
        hint: Diese kurze Option steht für rohe Eingabe.
    explanation: Ohne die beiden Maßnahmen interpretiert read Teile des Textes als Steuerinformation. Für eine letzte Zeile ohne Abschluss-Newline braucht die Schleifenbedingung eine zusätzliche Prüfung.
    resources:
      - title: Bash · Bash Builtins
        url: https://www.gnu.org/software/bash/manual/html_node/Bash-Builtins.html
  - id: modus-setzen
    type: command
    title: Das Skript direkt starten können
    prompt: Ergänze ausschließlich für den Besitzer das Ausführungsrecht von `report.sh` mit symbolischem chmod.
    answers: ["chmod u+x report.sh"]
    explanation: Der direkte Aufruf nutzt den Shebang und benötigt das Ausführungsrecht. `bash report.sh` wählt den Interpreter dagegen ausdrücklich.
  - id: funktion-status
    type: gap
    title: Nur die Funktion beenden
    prompt: Eine fehlende Datei soll den Funktionsaufruf erfolglos beenden; der aufrufende Prozess soll entscheiden können, wie es weitergeht.
    lang: bash
    code: |
      pruefe() {
        local pfad=$1
        [[ -f $pfad ]] || ⟦return 1⟧
      }
    gaps:
      - label: Funktionsstatus
        hint: Beende die Funktion mit einem Status ungleich null, nicht die ganze Shell.
    explanation: |
      `return 1` übergibt dem Aufrufer eine Entscheidung. Ein `exit 1` würde den Skriptprozess sofort beenden und Wiederverwendung erschweren.
  - id: quoting-fehler
    type: bug
    title: Der Pfad zerfällt
    prompt: Das Skript soll genau einen Dateinamen ausgeben. Bei einem Namen mit Leerzeichen entstehen zwei Zeilen. Korrigiere nur die printf-Zeile.
    lang: bash
    code: |
      datei='Bericht September.txt'
      printf '<%s>\n' $datei
    lines: [2]
    fix:
      - line: 2
        answers: ["printf '<%s>\\n' \"$datei\"", "printf '<%s>\\n' \"${datei}\""]
    explanation: Die unquotierte Erweiterung durchläuft Wortzerlegung. Doppelte Quotes bewahren den gesamten Namen als ein Argument für printf.
    resources:
      - title: ShellCheck SC2086
        url: https://www.shellcheck.net/wiki/SC2086
  - id: cron-prozent
    type: bug
    title: Das Log von heute Nacht fehlt
    prompt: |
      Diese crontab von `ops` soll jede Nacht um 02:30 das Backup starten und dessen Ausgabe in eine Logdatei mit dem Datum im Namen schreiben. Kopierst du den Befehl ins Terminal, funktioniert er. Unter cron entsteht aber keine Logdatei, und das Journal zeigt nur:

      ```text
      CRON[339]: (ops) CMD (/home/ops/bin/backup.sh > /home/ops/logs/backup-$(date +)
      CRON[338]: (CRON) info (No MTA installed, discarding output)
      ```

      Finde die fehlerhafte Zeile und korrigiere sie.
    lang: bash
    code: |
      # m h dom mon dow command
      PATH=/opt/tools/bin:/usr/bin:/bin
      30 2 * * * /home/ops/bin/backup.sh > /home/ops/logs/backup-$(date +%F).log 2>&1
    lines: [3]
    fix:
      - line: 3
        answers:
          - 30 2 * * * /home/ops/bin/backup.sh > /home/ops/logs/backup-$(date +\%F).log 2>&1
          - 30 2 * * * /home/ops/bin/backup.sh > /home/ops/logs/backup-$(date +\%Y-\%m-\%d).log 2>&1
    explanation: |
      In einer crontab beendet ein unmaskiertes `%` den Befehl; was danach kommt, gibt cron dem Befehl als Standardeingabe. Ausgeführt wurde deshalb nur `/home/ops/bin/backup.sh > /home/ops/logs/backup-$(date +`, und `/bin/sh` brach mit einem Syntaxfehler ab, bevor das Backup überhaupt startete. Die Fehlermeldung hätte cron per Mail geschickt; ohne Mailserver hat es sie verworfen. Mit `\%` kommt das Zeichen beim Befehl an. Wer `date`-Formate oft braucht, legt den Befehl in ein Skript, dort gilt die Sonderregel nicht.
    resources:
      - title: crontab(5) – Debian
        url: https://manpages.debian.org/bookworm/cron/crontab.5.en.html
  - id: pipeline-status
    type: explain
    title: Warum reicht die letzte Ausgabe nicht?
    prompt: Erkläre die beiden Statusprüfungen und warum eine sichtbare Zahl kein Erfolgsbeweis für die gesamte Pipeline ist.
    lang: bash
    code: |
      false | wc -l
      printf 'Status: %s\n' "$?"
      set -o pipefail
      false | wc -l
      printf 'Status: %s\n' "$?"
    points:
      - wc erhält keine Daten und kann trotzdem erfolgreich 0 ausgeben.
      - Ohne pipefail bestimmt der letzte Befehl den Pipeline-Status.
      - Mit pipefail macht der erfolglose linke Befehl die Pipeline erfolglos.
      - Erwartete Statuswerte müssen trotzdem fachlich bewertet werden.
    explanation: Datenstrom und Status sind verschiedene Informationskanäle. `pipefail` hilft, Fehler nicht hinter einem erfolgreichen Verbraucher zu verstecken; es erklärt aber nicht automatisch deren Bedeutung.
    resources:
      - title: Bash · Pipelines
        url: https://www.gnu.org/software/bash/manual/html_node/Pipelines.html
  - id: temporaer-erklaeren
    type: explain
    title: Wem gehört diese temporäre Datei?
    prompt: Erkläre Erzeugung, Zeitpunkt der Expansion und Grenze des Aufräumens.
    lang: bash
    code: |
      tmp=$(mktemp) || exit 1
      trap 'rm -f -- "$tmp"' EXIT
      printf 'bericht\n' > "$tmp"
    points:
      - mktemp erzeugt einen nicht vorhersehbaren Namen und die Datei.
      - Ein Fehler bei mktemp beendet das Skript vor der Verwendung.
      - Der gequotete Trap-Text expandiert tmp erst bei seiner Ausführung.
      - EXIT deckt normale Ausstiege ab, aber nicht SIGKILL oder Stromausfall.
    explanation: Das Skript räumt nur die Datei auf, die es selbst erzeugt hat. Die Aufräumgarantie ist begrenzt; Reste nach einem abrupten Prozessende müssen tolerierbar bleiben.
  - id: bericht-skript
    type: practice
    title: Ein kleiner Log-Prüfer
    prompt: Schreibe ein Bash-Skript mit genau einem Dateiparameter. Gib die Zahl der Zeilen mit festem Text ERROR aus. Keine Treffer sind Erfolg mit 0; Lesefehler sind Fehler. Teste auch einen Dateinamen mit Leerzeichen.
    lang: bash
    solution: |
      #!/usr/bin/env bash
      if [[ $# -ne 1 ]]; then
        printf 'Aufruf: %s DATEI\n' "$0" >&2
        exit 2
      fi
      if anzahl=$(grep -cF 'ERROR' -- "$1"); then
        printf '%s\n' "$anzahl"
      else
        status=$?
        if [[ $status -eq 1 ]]; then
          printf '0\n'
        else
          printf 'Auswertung fehlgeschlagen\n' >&2
          exit "$status"
        fi
      fi
    checklist:
      - Ein Log mit zwei passenden Zeilen ergibt 2 und Status 0.
      - Ein Log ohne Treffer ergibt 0 und Status 0.
      - Ein fehlender Pfad ergibt einen Status ungleich null.
      - Ein Dateiname mit Leerzeichen wird als ein Argument behandelt.
      - bash -n und ShellCheck sind geprüft und Fehlermeldungen stehen auf stderr.
    explanation: grep unterscheidet keine Treffer von einem echten Fehler. Das Skript übernimmt diese Unterscheidung ausdrücklich und liefert einen stabilen Vertrag für nachfolgende Automatisierung.
  - id: backup-als-dienst
    type: scenario
    title: Von Hand läuft das Backup
    prompt: |
      Das Skript `/home/shopbackup/bin/backup.sh` des Dienstkontos `shopbackup` sichert die Bestellungen des Shops. Von Hand läuft es fehlerfrei:

      ```console
      $ sudo -iu shopbackup
      shopbackup@web01:~$ bin/backup.sh
      Backup fertig: /srv/backup/shop-2026-09-30-1712.tar.gz
      ```

      Damit es jede Nacht um 02:30 läuft, hat ein Kollege gestern `backup.service` und `backup.timer` angelegt und den Dienst einmal zum Test gestartet. Heute früh lag trotzdem kein neues Archiv in `/srv/backup`.

      Sorge dafür, dass `backup.service` ein Archiv der Bestellungen nach `/srv/backup` schreibt und der Timer aktiv ist, auch nach einem Neustart. Von Hand soll das Skript weiterhin funktionieren.
    setup: |
      set -e
      mkdir -p /opt/tools/bin /srv/shop/orders /srv/backup
      cat > /opt/tools/bin/shopdump <<'EOF'
      #!/bin/sh
      # Exportiert die Bestellungen des Shops als CSV.
      echo 'bestellung;kunde;betrag'
      for f in /srv/shop/orders/*; do
        printf '%s;%s\n' "${f##*/}" "$(cat "$f")"
      done
      EOF
      chmod 755 /opt/tools/bin/shopdump
      printf 'k-2201;49.90\n' > /srv/shop/orders/10481
      printf 'k-1873;12.50\n' > /srv/shop/orders/10482
      printf 'k-2201;99.00\n' > /srv/shop/orders/10485
      useradd -m -s /bin/bash shopbackup
      chown shopbackup: /srv/backup
      cat >> /home/shopbackup/.bashrc <<'EOF'

      # Backup des Shops
      export PATH="$PATH:/opt/tools/bin"
      export BACKUP_ZIEL=/srv/backup
      EOF
      install -d -o shopbackup -g shopbackup /home/shopbackup/bin
      cat > /home/shopbackup/bin/backup.sh <<'EOF'
      #!/bin/bash
      # Sichert die Bestellungen des Shops nach $BACKUP_ZIEL.
      set -euo pipefail
      tmp=$(mktemp -d)
      trap 'rm -rf -- "$tmp"' EXIT
      stamp=$(date +%F-%H%M)
      shopdump > "$tmp/bestellungen-$stamp.csv"
      tar -czf "$BACKUP_ZIEL/shop-$stamp.tar.gz" -C "$tmp" "bestellungen-$stamp.csv"
      echo "Backup fertig: $BACKUP_ZIEL/shop-$stamp.tar.gz"
      EOF
      chmod 755 /home/shopbackup/bin/backup.sh
      chown shopbackup: /home/shopbackup/bin/backup.sh
      cat > /etc/systemd/system/backup.service <<'EOF'
      [Unit]
      Description=Backup der Bestellungen

      [Service]
      Type=oneshot
      User=shopbackup
      ExecStart=/home/shopbackup/bin/backup.sh
      EOF
      cat > /etc/systemd/system/backup.timer <<'EOF'
      [Unit]
      Description=Backup der Bestellungen jede Nacht um 02:30

      [Timer]
      OnCalendar=*-*-* 02:30:00
      Persistent=true

      [Install]
      WantedBy=timers.target
      EOF
      systemctl daemon-reload
      systemctl start backup.service || true
    checks:
      - name: backup.service läuft durch und schreibt ein neues Archiv nach /srv/backup
        run: |
          rm -f /srv/backup/shop-*.tar.gz
          systemctl start backup.service || exit 1
          f=$(ls /srv/backup/shop-*.tar.gz 2>/dev/null | head -n 1)
          [ -n "$f" ] || { echo "In /srv/backup ist kein neues Archiv entstanden."; exit 1; }
          tar -xzOf "$f" | grep -q '^10481;' || { echo "$f enthält keine Bestellungen."; exit 1; }
      - name: backup.timer ist aktiv und startet beim Boot
        run: systemctl is-enabled backup.timer && systemctl is-active backup.timer
    solution: |
      # Der Timer lief nie, und der Testlauf des Dienstes ist gescheitert.
      systemctl list-timers backup.timer --all --no-pager
      systemctl status backup.service --no-pager
      # backup.sh: line 7: shopdump: command not found
      journalctl -u backup.service -n 10 --no-pager
      # Von Hand kommen PATH und BACKUP_ZIEL aus ~/.bashrc von shopbackup. Der Dienst liest diese Datei nie.
      sudo tail -n 3 /home/shopbackup/.bashrc
      sudo systemd-run --quiet --wait --pipe -p User=shopbackup env
      # Die Unit bekommt beides per Drop-in.
      sudo mkdir -p /etc/systemd/system/backup.service.d
      printf '[Service]\nEnvironment=PATH=/opt/tools/bin:/usr/local/bin:/usr/bin:/bin\nEnvironment=BACKUP_ZIEL=/srv/backup\n' | sudo tee /etc/systemd/system/backup.service.d/umgebung.conf
      sudo systemctl daemon-reload
      sudo systemctl start backup.service
      journalctl -u backup.service -n 3 --no-pager
      ls -l /srv/backup
      sudo systemctl enable --now backup.timer
      systemctl list-timers backup.timer --no-pager
    hints:
      - "Zwei Dinge prüfen: Läuft der Timer überhaupt (`systemctl list-timers --all`)? Und was meldet `journalctl -u backup.service` vom Testlauf?"
      - "Von Hand läuft das Skript in einer interaktiven Shell von `shopbackup`. Was bringt deren `~/.bashrc` mit, das der Dienst nicht hat? `sudo systemd-run --wait --pipe -p User=shopbackup env` zeigt die Umgebung eines Dienstes."
      - "Gib dem Dienst `PATH` und `BACKUP_ZIEL` mit `Environment=` in einem Drop-in (oder setze beides im Skript selbst), dann `daemon-reload` und neu starten. Den Timer aktivierst du mit `systemctl enable --now`."
    explanation: |
      Von Hand lief das Skript, weil `sudo -iu shopbackup` eine interaktive Login-Shell startet und die `~/.bashrc` des Kontos `/opt/tools/bin` an den `PATH` hängt und `BACKUP_ZIEL` setzt. systemd liest keine Startdateien: Der Dienst bekam den Standard-`PATH` ohne `/opt/tools/bin` und gar kein `BACKUP_ZIEL`. Deshalb scheiterte er zuerst an `shopdump: command not found` und nach einer PATH-Korrektur an `BACKUP_ZIEL: unbound variable`. Dazu kam, dass der Timer nie aktiviert war; ein Timer läuft erst nach `systemctl enable --now`.

      `Environment=` im Drop-in ist eine saubere Lösung, ebenso ein Skript, das seinen `PATH` und sein Ziel selbst setzt (`ziel=${BACKUP_ZIEL:-/srv/backup}`). Allgemein gilt: Was ein Skript außerhalb des Terminals braucht, darf nicht in `~/.bashrc` stehen.
    resources:
      - title: systemd.exec · Environment=
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#Environment=
      - title: systemd.timer
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.timer.html
  - id: deploy-per-ssh
    type: scenario
    title: Interaktiv klappt es, aus der CI nicht
    prompt: |
      Die CI-Pipeline spielt neue Releases des Shops mit diesem Schritt aus:

      ```console
      $ ssh -i ~/.ssh/ci_deploy deploy@web01 deploy-shop 2.4.1
      bash: line 1: deploy-shop: command not found
      ```

      Seit `web01` neu aufgesetzt wurde, bricht der Schritt so ab. Wer sich dagegen interaktiv als `deploy` anmeldet, kann `deploy-shop` aufrufen. Den Schlüssel der CI hat `ops` zum Nachstellen bekommen: `ssh -i ~/.ssh/ci_deploy deploy@localhost deploy-shop 2.4.1`.

      Repariere den Server so, dass genau dieser Befehl das Release ausspielt. Die Pipeline darfst du nicht ändern.
    setup: |
      set -e
      useradd -m -s /bin/bash deploy
      mkdir -p /opt/tools/bin /srv/shop/releases
      cat > /opt/tools/bin/deploy-shop <<'EOF'
      #!/bin/sh
      # Schaltet ein Release des Shops live: deploy-shop VERSION
      set -e
      [ -n "$1" ] || { echo 'Aufruf: deploy-shop VERSION' >&2; exit 2; }
      mkdir -p "/srv/shop/releases/$1"
      ln -sfn "/srv/shop/releases/$1" /srv/shop/current
      echo "Release $1 ist live."
      EOF
      chmod 755 /opt/tools/bin/deploy-shop
      chown -R deploy: /srv/shop
      cat >> /home/deploy/.bashrc <<'EOF'

      # Werkzeuge für Deployments
      export PATH="$PATH:/opt/tools/bin"
      EOF
      # Der Schlüssel der CI liegt zum Nachstellen bei ops.
      install -d -m 700 -o ops -g ops /home/ops/.ssh
      runuser -u ops -- ssh-keygen -q -t ed25519 -N '' -C ci@pipeline -f /home/ops/.ssh/ci_deploy
      install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
      install -m 600 -o deploy -g deploy /home/ops/.ssh/ci_deploy.pub /home/deploy/.ssh/authorized_keys
      printf 'localhost,web01 %s\n' "$(cut -d' ' -f1,2 /etc/ssh/ssh_host_ed25519_key.pub)" > /home/ops/.ssh/known_hosts
      chown ops:ops /home/ops/.ssh/known_hosts
    checks:
      - name: Der Aufruf der CI spielt das Release aus
        run: runuser -u ops -- ssh -i /home/ops/.ssh/ci_deploy -o BatchMode=yes deploy@localhost deploy-shop 2.4.1
      - name: Release 2.4.1 ist live
        run: |
          ziel=$(readlink /srv/shop/current)
          [ "$ziel" = /srv/shop/releases/2.4.1 ] || { echo "/srv/shop/current zeigt auf: ${ziel:-nichts}"; exit 1; }
    solution: |
      # Den Schritt der CI nachstellen: deploy-shop wird nicht gefunden.
      ssh -i ~/.ssh/ci_deploy deploy@localhost deploy-shop 2.4.1
      # Welchen PATH hat ein Befehl über ssh? /opt/tools/bin fehlt.
      ssh -i ~/.ssh/ci_deploy deploy@localhost 'echo "$PATH"'
      # Die Ergänzung steht in ~/.bashrc von deploy, aber hinter der Abfrage, die nicht-interaktive Shells beendet.
      sudo grep -n -e 'return' -e 'PATH' /home/deploy/.bashrc
      # Die PATH-Zeile an den Anfang der Datei ziehen, vor die Abfrage.
      sudo -u deploy sed -i '/^export PATH=.*opt\/tools\/bin/d' /home/deploy/.bashrc
      sudo -u deploy sed -i '1i export PATH="$PATH:/opt/tools/bin"' /home/deploy/.bashrc
      ssh -i ~/.ssh/ci_deploy deploy@localhost deploy-shop 2.4.1
    hints:
      - "Stell den Aufruf nach und vergleiche: Welchen `PATH` hat `ssh -i ~/.ssh/ci_deploy deploy@localhost 'echo \"$PATH\"'`, welchen eine interaktive Anmeldung?"
      - "Wo kommt `/opt/tools/bin` bei der interaktiven Anmeldung in den `PATH`? Sieh dir `/home/deploy/.bashrc` von oben bis unten an."
      - "Bash liest `~/.bashrc` auch bei `ssh host befehl`, steigt aber an der `case $- in`-Abfrage aus. Steht die PATH-Zeile davor, gilt sie auch für die CI. Ein Link nach `/usr/local/bin` wäre ebenfalls eine Lösung."
    explanation: |
      `ssh deploy@web01 deploy-shop 2.4.1` startet auf dem Server `bash -c 'deploy-shop 2.4.1'`, keine Login-Shell. `~/.profile` liest diese Shell nicht. Debians Bash liest bei einem Aufruf über sshd zwar `~/.bashrc`, aber die Datei beginnt mit `case $- in *i*) ;; *) return;; esac` und kehrt in jeder nicht-interaktiven Shell sofort zurück. Die PATH-Ergänzung am Ende kam deshalb nur bei einer interaktiven Anmeldung an.

      Steht die Zeile vor der Abfrage, gilt sie für beide Wege. Ebenso gut wäre ein Link `/usr/local/bin/deploy-shop`, denn `/usr/local/bin` steht im Standard-`PATH` von sshd. `~/.ssh/environment` funktioniert dagegen nur mit `PermitUserEnvironment yes`, das aus Sicherheitsgründen standardmäßig aus ist.
    resources:
      - title: Bash · Bash Startup Files
        url: https://www.gnu.org/software/bash/manual/html_node/Bash-Startup-Files.html
      - title: sshd_config(5) · PermitUserEnvironment
        url: https://man.openbsd.org/sshd_config#PermitUserEnvironment
