id: systemd-logs
title: systemd, Dienste & Logs
level: 2
minutes: 210
summary: Vom Bootvorgang bis zum eigenen Dienst – wie du mit systemd Programme zuverlässig betreibst, mit Timern planst und mit journalctl die Ursache eines Fehlers findest.
goals:
  - Du beschreibst den Bootvorgang von der Firmware bis zu systemd als PID 1.
  - Du steuerst Dienste mit `systemctl` und unterscheidest `start` von `enable`, `restart` von `reload` und `reload` von `daemon-reload`.
  - Du schreibst eine Service-Unit mit `Type=`, `ExecStart=`, `Restart=`, `User=`, Umgebung und Abhängigkeiten und passt fremde Units per Drop-in an.
  - Du ersetzt Cronjobs durch Timer mit `OnCalendar=` und `Persistent=` und prüfst Zeitangaben mit `systemd-analyze calendar`.
  - Du findest mit `journalctl` gezielt die Meldungen eines Dienstes, eines Boots oder einer Priorität.
  - Du führst einen gescheiterten Dienst oder einen Timer, der nie läuft, mit `systemctl status`, `systemctl show` und dem Journal auf die Ursache zurück, etwa `203/EXEC` oder ein Startlimit.
resources:
  - title: systemd.service(5)
    url: https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html
  - title: systemctl(1)
    url: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html
  - title: journalctl(1)
    url: https://www.freedesktop.org/software/systemd/man/latest/journalctl.html
  - title: systemd.exec(5) · Process Exit Codes
    url: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#Process%20Exit%20Codes
  - title: ArchWiki · systemd
    url: https://wiki.archlinux.org/title/Systemd
lab: |
  set -e
  # shop: eine Demo-API nach dem Muster der Unit in der Lektion, mit Logzeilen wie eine echte Anwendung
  useradd --system --home-dir /srv/shop --shell /usr/sbin/nologin shop
  useradd --system --home-dir /var/lib/postgresql --shell /bin/bash postgres
  install -d -o shop -g shop /srv/shop/www /srv/shop/bin
  install -d /etc/shop
  install -d -o postgres -g postgres /var/backups/shop
  echo ok > /srv/shop/www/health
  printf 'SHOP_PORT=8000\nPAYMENT_TOKEN=geheim\n' > /etc/shop/shop.env
  chmod 600 /etc/shop/shop.env
  cat > /srv/shop/bin/shop-api <<'EOF'
  #!/bin/bash
  # Demo-API: liefert /health aus und schreibt Logzeilen wie eine echte Anwendung
  echo "Shop API 2.4.0 startet auf 127.0.0.1:$SHOP_PORT"
  echo "WARN Cache ist kalt, die ersten Anfragen dauern länger"
  busybox httpd -f -p "127.0.0.1:$SHOP_PORT" -h /srv/shop/www &
  echo "ERROR Zahlungsdienst nicht erreichbar: connect timeout nach 5000 ms"
  while sleep 30; do
    echo "GET /api/products 200 $((RANDOM % 80 + 20)) ms"
  done
  EOF
  chmod 755 /srv/shop/bin/shop-api
  cat > /etc/systemd/system/shop.service <<'EOF'
  [Unit]
  Description=Shop API (Demo)
  After=network-online.target
  Wants=network-online.target

  [Service]
  Type=exec
  User=shop
  Group=shop
  WorkingDirectory=/srv/shop
  EnvironmentFile=/etc/shop/shop.env
  ExecStart=/srv/shop/bin/shop-api
  Restart=on-failure
  RestartSec=5

  [Install]
  WantedBy=multi-user.target
  EOF
  # db-backup: Timer und Oneshot-Service wie in der Lektion, mit einem Demo-Skript statt pg_dump
  cat > /usr/local/bin/db-backup.sh <<'EOF'
  #!/bin/bash
  # Demo statt pg_dump: schreibt eine kleine Sicherungsdatei
  set -eu
  ziel=/var/backups/shop/shop-$(date +%F).sql
  echo "-- Sicherung der Datenbank shop, $(date '+%F %T')" > "$ziel"
  echo "Backup geschrieben: $ziel ($(stat -c %s "$ziel") Bytes)"
  EOF
  chmod 755 /usr/local/bin/db-backup.sh
  cat > /etc/systemd/system/db-backup.service <<'EOF'
  [Unit]
  Description=PostgreSQL-Backup der Shop-Datenbank

  [Service]
  Type=oneshot
  User=postgres
  ExecStart=/usr/local/bin/db-backup.sh
  EOF
  cat > /etc/systemd/system/db-backup.timer <<'EOF'
  [Unit]
  Description=Tägliches Datenbank-Backup um 03:00

  [Timer]
  OnCalendar=*-*-* 03:00:00
  Persistent=true
  RandomizedDelaySec=10min

  [Install]
  WantedBy=timers.target
  EOF
  # invoice-sync: ein Dienst, dessen Programm bei einem Update verschwunden ist
  cat > /etc/systemd/system/invoice-sync.service <<'EOF'
  [Unit]
  Description=Rechnungsabgleich mit der Buchhaltung

  [Service]
  Type=exec
  ExecStart=/opt/invoice-sync/bin/invoice-sync --once
  EOF
  systemctl daemon-reload
  systemctl enable --quiet --now shop db-backup.timer
  systemctl start invoice-sync || true
lesson: |
  Deine kleine Shop-API läuft auf einem VPS. Gestartet hast du sie mit `nohup gunicorn … &`. Nach einem nächtlichen Kernel-Update startet der Server neu, und die API ist weg. Eine Woche später stürzt sie wegen eines Speicherlecks ab, und niemand merkt es bis zum Morgen. Die Logs liegen in einer `nohup.out`, die inzwischen 4 GB groß ist.

  Für genau diese Probleme gibt es **systemd**: Es startet Dienste beim Booten in der richtigen Reihenfolge, startet sie nach Abstürzen neu, sammelt ihre Ausgaben im Journal und stoppt sie geordnet. Auf Debian, Ubuntu, Fedora, Arch und CachyOS ist es gleichermaßen der Standard. Wer im Betrieb oder als Backend-Entwickler arbeitet, braucht die Werkzeuge aus diesem Modul jede Woche.

  Die Beispiele mit „Im Terminal“ laufen in einem Debian 12 mit systemd 252. Dort warten schon drei Demo-Units auf dich: die Shop-API `shop.service`, der Backup-Timer `db-backup.timer` und `invoice-sync.service`, das beim Start scheitert.

  ## Vom Einschalten bis PID 1

  Der Bootvorgang läuft in Etappen, und jede hat ihre eigene Fehlerklasse ([bootup(7)](https://www.freedesktop.org/software/systemd/man/latest/bootup.html), [ArchWiki · Arch boot process](https://wiki.archlinux.org/title/Arch_boot_process)):

  1. **Firmware (UEFI).** Sie initialisiert die Hardware und startet einen Bootloader von der EFI-Systempartition.
  2. **Bootloader** (systemd-boot, GRUB oder auf CachyOS oft Limine). Er lädt den Kernel und die **initramfs** in den Speicher und übergibt die Kernel-Kommandozeile, etwa `root=…`.
  3. **Kernel.** Er initialisiert Speicher, CPU und die eingebauten Treiber, entpackt die initramfs in ein temporäres Root-Dateisystem und startet darin das erste Programm ([ramfs, rootfs and initramfs](https://docs.kernel.org/filesystems/ramfs-rootfs-initramfs.html)).
  4. **initramfs.** Ein Mini-System mit genau den Treibern und Werkzeugen, die nötig sind, um das echte Root-Dateisystem zu finden: Module für NVMe, LUKS-Entschlüsselung, btrfs-Subvolumes. Danach wechselt es per `switch_root` auf das echte Root-Dateisystem.
  5. **systemd als PID 1.** Es liest seine Unit-Dateien, bestimmt das Ziel `default.target` (auf Desktops `graphical.target`, auf Servern `multi-user.target`) und startet alles, was dafür nötig ist – so parallel wie die Abhängigkeiten erlauben.

  ```console vm
  $ systemd-analyze
  Startup finished in 9.287s (kernel) + 16.614s (userspace) = 25.901s
  graphical.target reached after 16.346s in userspace.
  $ systemd-analyze blame | head -3
  3.049s e2scrub_reap.service
  3.030s systemd-udev-trigger.service
  2.690s systemd-journald.service
  $ systemd-analyze critical-chain ssh.service
  The time when unit became active or started is printed after the "@" character.
  The time the unit took to start is printed after the "+" character.

  ssh.service +2.656s
  └─basic.target @13.085s
    └─sockets.target @13.079s
      └─dbus.socket @13.077s
        └─sysinit.target @13.053s
          └─systemd-update-utmp.service @12.870s +178ms
  …
  ```

  [`systemd-analyze`](https://www.freedesktop.org/software/systemd/man/latest/systemd-analyze.html) zeigt dieselben Etappen mit Zeiten. `blame` listet die langsamsten Units, `critical-chain` die Kette, die den Boot (oder hier den Start von `ssh.service`) tatsächlich aufgehalten hat: `@` ist der Zeitpunkt nach Beginn des Userspace, `+` die Startdauer der Unit. Auf einem UEFI-Laptop mit systemd-boot beginnt die erste Zeile mit zwei weiteren Etappen, etwa `9.129s (firmware) + 6.028s (loader) + 937ms (kernel) + 2.532s (initrd) + 19.136s (userspace)`. Die VM der Lektion startet per BIOS und GRUB; ohne UEFI-Variablen erfährt systemd nichts über Firmware und Bootloader. Und weil Debians initramfs-tools die initramfs ohne systemd betreibt, zählt deren Zeit hier zum Kernel. Das Denkmodell für die Fehlersuche: Bleibt der Rechner vor dem Kernel hängen, liegt es an Firmware oder Bootloader; landet er in einer Notfall-Shell der initramfs, findet er sein Root-Dateisystem nicht; bootet er, aber ein Dienst fehlt, ist es ein Fall für `systemctl` und `journalctl`.

  ## Units und systemctl

  systemd verwaltet **Units**: Konfigurationsdateien im INI-Stil, deren Endung den Typ angibt ([systemd.unit(5)](https://www.freedesktop.org/software/systemd/man/latest/systemd.unit.html)).

  | Typ | Wofür | Beispiel |
  | --- | --- | --- |
  | `.service` | ein Prozess oder ein einmaliger Befehl | `nginx.service` |
  | `.timer` | startet eine andere Unit zeitgesteuert | `logrotate.timer` |
  | `.socket` | lauscht auf einem Socket und startet den Dienst erst bei der ersten Verbindung | `sshd.socket` |
  | `.target` | Gruppe von Units, ein Synchronisationspunkt | `multi-user.target` |
  | `.mount` | ein Einhängepunkt (auch aus `/etc/fstab` erzeugt) | `home.mount` |
  | `.path` | startet eine Unit, wenn sich eine Datei ändert | `cups.path` |

  Unit-Dateien liegen an drei Orten, und der spätere gewinnt: `/usr/lib/systemd/system/` gehört den Paketen (nie dort ändern, das nächste Update überschreibt es), `/run/systemd/system/` enthält Laufzeit-Units, `/etc/systemd/system/` gehört dir. Auf Debian liegen die Paket-Units zum Teil noch unter `/lib/systemd/system/`.

  ```console
  $ systemctl status nginx              # Zustand, PID, letzte Logzeilen
  $ sudo systemctl start nginx          # jetzt starten
  $ sudo systemctl stop nginx           # jetzt stoppen (SIGTERM, nach Timeout SIGKILL)
  $ sudo systemctl restart nginx        # stoppen und neu starten
  $ sudo systemctl reload nginx         # Konfiguration neu lesen, Prozess läuft weiter
  $ sudo systemctl enable nginx         # beim Booten starten
  $ sudo systemctl enable --now nginx   # beim Booten starten und sofort starten
  $ sudo systemctl disable --now nginx  # nicht mehr beim Booten, und sofort stoppen
  $ systemctl is-active nginx           # active / inactive / failed
  $ systemctl is-enabled nginx          # enabled / disabled / static / masked
  $ systemctl list-units --failed       # alles, was fehlgeschlagen ist
  $ systemctl cat nginx                 # Unit-Datei samt aller Drop-ins anzeigen
  ```

  Die wichtigste Unterscheidung: **`start` wirkt jetzt, `enable` wirkt beim nächsten Boot.** `enable` liest den Abschnitt `[Install]` der Unit und legt einen symbolischen Link an, etwa `/etc/systemd/system/multi-user.target.wants/nginx.service`. Damit „will“ `multi-user.target` den Dienst, und er startet bei jedem Boot mit. Laufen muss er deshalb noch lange nicht – `enable --now` erledigt beides. Units ohne `[Install]`-Abschnitt sind `static`: Sie werden nur als Abhängigkeit anderer Units gestartet.

  In der VM ist nginx installiert, aber weder aktiviert noch gestartet. So siehst du beide Achsen getrennt:

  ```console vm
  $ systemctl is-enabled nginx; systemctl is-active nginx
  disabled
  inactive
  $ sudo systemctl start nginx
  $ systemctl is-enabled nginx; systemctl is-active nginx
  disabled
  active
  $ sudo systemctl enable nginx
  Synchronizing state of nginx.service with SysV service script with /lib/systemd/systemd-sysv-install.
  Executing: /lib/systemd/systemd-sysv-install enable nginx
  Created symlink /etc/systemd/system/multi-user.target.wants/nginx.service → /lib/systemd/system/nginx.service.
  $ curl -sI http://localhost | head -1
  HTTP/1.1 200 OK
  ```

  Die Zeilen über SysV erscheinen auf Debian, weil nginx zusätzlich ein altes Init-Skript unter `/etc/init.d` mitbringt; `enable` hält beide Welten synchron. Entscheidend ist die letzte Zeile von `enable`: der Symlink in `multi-user.target.wants`.

  Die zweite Unterscheidung: `reload` bittet den **Dienst**, seine Konfiguration neu zu lesen (bei nginx per `SIGHUP`, wie im Modul zu Prozessen), und funktioniert nur, wenn die Unit `ExecReload=` definiert. `daemon-reload` dagegen lässt **systemd selbst** alle Unit-Dateien neu einlesen. Das brauchst du jedes Mal, nachdem du eine Unit-Datei von Hand geändert hast; sonst arbeitet systemd mit der alten Fassung weiter und meldet in `systemctl status` einen Hinweis, dass sich die Datei auf der Platte geändert hat.

  **Fremde Units anpassen.** Willst du an `nginx.service` etwas ändern, kopierst du nicht die ganze Datei, sondern legst einen **Drop-in** an:

  ```console
  $ sudo systemctl edit nginx
  ```

  Das öffnet einen Editor für `/etc/systemd/system/nginx.service.d/override.conf`, führt danach automatisch `daemon-reload` aus und behält alle Einstellungen des Pakets bei, die du nicht überschreibst. Kommt mit dem nächsten Update eine verbesserte Paket-Unit, profitierst du davon. `systemctl edit --full` erzeugt dagegen eine vollständige Kopie unter `/etc`, die künftige Paketänderungen verdeckt ([systemctl · edit](https://www.freedesktop.org/software/systemd/man/latest/systemctl.html#edit%20UNIT%E2%80%A6)).

  In Skripten und Automatisierung legst du den Drop-in ohne Editor an: Verzeichnis `<unit>.d`, eine Datei mit der Endung `.conf`, danach selbst `daemon-reload`. Ab systemd 256 kann `systemctl edit --stdin` das in einem Schritt; Debian 12 hat systemd 252. Für die Demo-Unit `shop.service` verkürzt der Drop-in die Wartezeit vor einem automatischen Neustart:

  ```console vm
  $ sudo mkdir -p /etc/systemd/system/shop.service.d
  $ printf '[Service]\nRestartSec=2\n' | sudo tee /etc/systemd/system/shop.service.d/restart.conf
  [Service]
  RestartSec=2
  $ sudo systemctl daemon-reload
  $ systemctl show -p RestartUSec shop
  RestartUSec=2s
  $ systemctl status shop | head -5
  ● shop.service - Shop API (Demo)
       Loaded: loaded (/etc/systemd/system/shop.service; enabled; preset: enabled)
      Drop-In: /etc/systemd/system/shop.service.d
               └─restart.conf
       Active: active (running) since Thu 2026-10-01 12:27:20 CEST; 53s ago
  ```

  [`systemctl show`](https://www.freedesktop.org/software/systemd/man/latest/systemctl.html#show%20PATTERN%E2%80%A6%7CJOB%E2%80%A6) liefert den Wert, den systemd tatsächlich verwendet, nachdem alle Dateien und Drop-ins zusammengeführt sind. Mit `--value` bekommst du nur den Wert, ohne `Name=`: genau richtig für Skripte. `systemctl cat shop` zeigt Originaldatei und Drop-in untereinander.

  ## Eine eigene Service-Unit schreiben

  So sieht eine solide Unit für eine Python-Web-App aus:

  ```ini title=/etc/systemd/system/shop.service
  [Unit]
  Description=Shop API (Gunicorn)
  After=network-online.target postgresql.service
  Wants=network-online.target

  [Service]
  Type=exec
  User=shop
  Group=shop
  WorkingDirectory=/srv/shop
  Environment=PYTHONUNBUFFERED=1
  EnvironmentFile=/etc/shop/shop.env
  ExecStart=/srv/shop/.venv/bin/gunicorn --workers 4 --bind 127.0.0.1:8000 shop.wsgi:application
  Restart=on-failure
  RestartSec=5

  [Install]
  WantedBy=multi-user.target
  ```

  **`[Unit]`** beschreibt Beziehungen ([systemd.unit(5) · Wants=](https://www.freedesktop.org/software/systemd/man/latest/systemd.unit.html#Wants=)). Hier steckt ein häufiges Missverständnis: `Wants=` (und das strengere `Requires=`) legt fest, **dass** eine andere Unit mitgestartet wird. `After=` legt nur fest, **in welcher Reihenfolge**. Die beiden sind unabhängig: `Wants=` ohne `After=` startet beide parallel, `After=` ohne `Wants=` wartet nur, falls die andere Unit ohnehin gestartet wird. `network-online.target` ist erreicht, wenn das Netz konfiguriert ist; `network.target` bedeutet nur, dass die Netzwerkverwaltung läuft ([systemd.io · Network online](https://systemd.io/NETWORK_ONLINE/)).

  **`[Service]`** beschreibt den Prozess ([systemd.service(5)](https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html#Type=), [systemd.exec(5)](https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#User=)):

  | Typ | systemd hält den Start für abgeschlossen, … | Geeignet für |
  | --- | --- | --- |
  | `simple` | sobald der Prozess geforkt ist | Standard ohne `Type=`; Fehler beim `exec` fallen erst später auf |
  | `exec` | sobald das Programm per `execve` gestartet ist | lang laufende Server, die im Vordergrund bleiben – meist die bessere Wahl |
  | `oneshot` | wenn der Prozess sich beendet hat | Skripte, Backups, Migrationen |
  | `notify` | wenn der Dienst selbst „bereit“ meldet | Dienste mit `sd_notify`-Unterstützung |
  | `forking` | wenn der Startprozess sich beendet hat | alte Daemons, die sich selbst in den Hintergrund schicken |

  Der Dienst darf sich **nicht** selbst in den Hintergrund schicken, außer bei `Type=forking`. Er läuft im Vordergrund und schreibt auf stdout/stderr – systemd leitet beides ins Journal. `PYTHONUNBUFFERED=1` sorgt dafür, dass Python die Ausgabe nicht puffert und die Zeilen sofort erscheinen.

  - `User=`/`Group=`: Der Dienst läuft nicht als root. Lege dafür einen Systembenutzer ohne Login an.
  - `WorkingDirectory=`: das Arbeitsverzeichnis; ohne Angabe ist es `/`.
  - `Environment=` setzt einzelne Variablen, `EnvironmentFile=` liest `KEY=value`-Zeilen aus einer Datei – ideal für Secrets mit Rechten `600`, die nicht in der Unit stehen sollen. Mit `-` davor (`EnvironmentFile=-/etc/shop/shop.env`) ist eine fehlende Datei kein Fehler.
  - `ExecStart=` braucht den Programmpfad und die Argumente – **ohne Shell**. Umleitungen (`>`), Pipes (`|`), `&&` oder `cd` funktionieren nicht; systemd übergibt solche Zeichen als gewöhnliche Argumente. Brauchst du wirklich Shell-Logik, schreibst du ein Skript oder rufst `/bin/sh -c '…'` auf.
  - `Restart=on-failure` startet neu, wenn der Prozess mit einem Fehlercode endet, durch ein Signal stirbt oder ein Timeout greift – aber nicht nach einem sauberen `exit 0` oder einem `systemctl stop`. `Restart=always` startet auch nach Exit-Code 0 neu. Startet ein Dienst zu oft hintereinander (Standard: fünfmal in zehn Sekunden), gibt systemd auf und meldet `start request repeated too quickly`.

  **`[Install]`** wird nur von `enable` gelesen: `WantedBy=multi-user.target` heißt „starte mich, wenn das System normal hochfährt“.

  ### Eine laufende Unit lesen

  `shop.service` in der VM folgt diesem Muster, nur startet `ExecStart=` ein kleines Bash-Skript statt Gunicorn. `systemctl status` liest du von oben nach unten: Woher kommt die Unit, und ist sie aktiviert (`Loaded`)? Gibt es Drop-ins? Läuft sie, und seit wann (`Active`)? Welche Prozesse gehören dazu (`CGroup`)? Darunter stehen die letzten Zeilen aus dem Journal.

  ```console vm
  $ systemctl status shop
  ● shop.service - Shop API (Demo)
       Loaded: loaded (/etc/systemd/system/shop.service; enabled; preset: enabled)
      Drop-In: /etc/systemd/system/shop.service.d
               └─restart.conf
       Active: active (running) since Thu 2026-10-01 12:27:20 CEST; 53s ago
     Main PID: 388 (shop-api)
        Tasks: 3 (limit: 549)
       Memory: 952.0K
          CPU: 110ms
       CGroup: /system.slice/shop.service
               ├─388 /bin/bash /srv/shop/bin/shop-api
               ├─390 busybox httpd -f -p 127.0.0.1:8000 -h /srv/shop/www
               └─402 sleep 30

  Oct 01 12:27:20 web01 systemd[1]: Starting shop.service - Shop API (Demo)...
  Oct 01 12:27:20 web01 systemd[1]: Started shop.service - Shop API (Demo).
  Oct 01 12:27:20 web01 shop-api[388]: Shop API 2.4.0 startet auf 127.0.0.1:8000
  Oct 01 12:27:20 web01 shop-api[388]: WARN Cache ist kalt, die ersten Anfragen dauern länger
  Oct 01 12:27:20 web01 shop-api[388]: ERROR Zahlungsdienst nicht erreichbar: connect timeout nach 5000 ms
  $ systemctl show -p MainPID -p NRestarts -p User -p WorkingDirectory shop
  MainPID=388
  NRestarts=0
  WorkingDirectory=/srv/shop
  User=shop
  ```

  `Restart=on-failure` kannst du gefahrlos ausprobieren. [`systemctl kill`](https://www.freedesktop.org/software/systemd/man/latest/systemctl.html#kill%20PATTERN%E2%80%A6) schickt allen Prozessen der Unit ein Signal; `SIGKILL` wirkt für systemd wie ein Absturz, etwa durch den OOM-Killer. Nach `RestartSec=` (dank Drop-in zwei Sekunden) ist der Dienst wieder da, und `NRestarts` zählt mit:

  ```console vm
  $ sudo systemctl kill --signal=KILL shop
  $ sleep 4; systemctl show -p NRestarts -p ActiveState shop
  NRestarts=1
  ActiveState=active
  $ journalctl -u shop -n 12 -o cat
  shop.service: Sent signal SIGKILL to main process 388 (shop-api) on client request.
  …
  shop.service: Main process exited, code=killed, status=9/KILL
  shop.service: Failed with result 'signal'.
  shop.service: Scheduled restart job, restart counter is at 1.
  Stopped shop.service - Shop API (Demo).
  Starting shop.service - Shop API (Demo)...
  Started shop.service - Shop API (Demo).
  Shop API 2.4.0 startet auf 127.0.0.1:8000
  …
  ```

  Ein `sudo systemctl stop shop` hätte dagegen keinen Neustart ausgelöst: Ein Stopp auf Anweisung ist kein Fehler.

  > [!TIP] Units prüfen, bevor du sie aktivierst
  > `systemd-analyze verify /etc/systemd/system/shop.service` meldet Tippfehler in Direktiven und fehlende Programme. Danach: `sudo systemctl daemon-reload`, `sudo systemctl enable --now shop`, `systemctl status shop`.

  > [!INTERVIEW] „Wie betreibst du eine App auf einem Linux-Server?“
  > Als systemd-Service: eigener Systembenutzer, `ExecStart` mit absolutem Pfad zur App im Vordergrund, `Restart=on-failure`, Konfiguration und Secrets per `EnvironmentFile` mit restriktiven Rechten, `After=`/`Wants=` für Abhängigkeiten wie die Datenbank. Logs gehen auf stdout und landen im Journal, `enable --now` sorgt für den Start beim Booten. Davor sitzt ein Reverse Proxy wie nginx, der TLS terminiert. Wer mag, ergänzt Härtung wie `NoNewPrivileges=yes` oder `ProtectSystem=strict`.

  ## Timer statt cron

  Ein **Timer** startet eine andere Unit zu bestimmten Zeiten, standardmäßig die Service-Unit mit demselben Namen ([systemd.timer(5)](https://www.freedesktop.org/software/systemd/man/latest/systemd.timer.html)). Die Arbeit selbst beschreibt eine `oneshot`-Unit:

  ```ini title=/etc/systemd/system/db-backup.service
  [Unit]
  Description=PostgreSQL-Backup der Shop-Datenbank

  [Service]
  Type=oneshot
  User=postgres
  ExecStart=/usr/local/bin/db-backup.sh
  ```

  ```ini title=/etc/systemd/system/db-backup.timer
  [Unit]
  Description=Tägliches Datenbank-Backup um 03:00

  [Timer]
  OnCalendar=*-*-* 03:00:00
  Persistent=true
  RandomizedDelaySec=10min

  [Install]
  WantedBy=timers.target
  ```

  Aktiviert wird der **Timer**, nicht der Service: `sudo systemctl enable --now db-backup.timer`. `OnCalendar=` hat ein eigenes Format `Wochentag Jahr-Monat-Tag Stunde:Minute:Sekunde`, nicht die fünf Felder von cron ([systemd.time(7) · Calendar Events](https://www.freedesktop.org/software/systemd/man/latest/systemd.time.html#Calendar%20Events)). Ob du es richtig geschrieben hast, prüfst du, bevor du dich darauf verlässt:

  ```console vm fails
  $ systemd-analyze calendar "Mon..Fri 9:00"
    Original form: Mon..Fri 9:00
  Normalized form: Mon..Fri *-*-* 09:00:00
      Next elapse: Fri 2026-10-02 09:00:00 CEST
         (in UTC): Fri 2026-10-02 07:00:00 UTC
         From now: 20h left
  $ systemd-analyze calendar "Mo..Fr 9:00"
  Failed to parse calendar specification 'Mo..Fr 9:00': Invalid argument
  ```

  systemd versteht nur englische Wochentage. `Mon-Fri` akzeptiert es ebenfalls und schreibt es als `Mon..Fri`. In der VM sind die Units aus den beiden Kästen oben schon angelegt, und der Timer ist aktiv. `systemctl list-timers` zeigt alle aktiven Timer mit nächstem (`NEXT`) und letztem (`LAST`) Lauf; die übrigen gehören zu Debian-Paketen:

  ```console vm
  $ systemctl list-timers
  NEXT                         LEFT          LAST                         PASSED       UNIT                         ACTIVATES
  Thu 2026-10-01 12:30:00 CEST 1min 39s left Thu 2026-10-01 12:27:09 CEST 1min 10s ago sysstat-collect.timer        sysstat-collect.service
  Thu 2026-10-01 12:41:37 CEST 13min left    -                            -            systemd-tmpfiles-clean.timer systemd-tmpfiles-clean.service
  Fri 2026-10-02 00:00:00 CEST 11h left      -                            -            dpkg-db-backup.timer         dpkg-db-backup.service
  Fri 2026-10-02 00:07:00 CEST 11h left      -                            -            sysstat-summary.timer        sysstat-summary.service
  Fri 2026-10-02 03:06:42 CEST 14h left      -                            -            db-backup.timer              db-backup.service

  5 timers listed.
  Pass --all to see loaded but inactive timers, too.
  $ sudo systemctl start db-backup.service
  $ journalctl -u db-backup -o cat
  Starting db-backup.service - PostgreSQL-Backup der Shop-Datenbank...
  Backup geschrieben: /var/backups/shop/shop-2026-10-01.sql (53 Bytes)
  db-backup.service: Deactivated successfully.
  Finished db-backup.service - PostgreSQL-Backup der Shop-Datenbank.
  ```

  `NEXT` für `db-backup.timer` liegt nicht genau auf 03:00, weil `RandomizedDelaySec=10min` den Start zufällig verschiebt. Der Service lässt sich jederzeit von Hand starten; `systemctl start` kehrt bei `Type=oneshot` erst zurück, wenn das Skript fertig ist, und meldet dessen Fehler.

  Warum Timer statt cron? `Persistent=true` holt einen verpassten Lauf nach, wenn der Rechner zur geplanten Zeit aus war; auf Laptops und Desktops kommt das täglich vor. Jeder Lauf landet mit Exit-Status im Journal (`journalctl -u db-backup`), statt in einer Mail an root, die niemand liest. Ein laufendes Backup startet nicht doppelt, und der Service lässt sich zum Testen jederzeit per `systemctl start db-backup.service` von Hand auslösen. `RandomizedDelaySec=` verteilt Last, wenn viele Server zur selben Minute starten würden.

  > [!TIP] Wenn ein Timer nie läuft
  > `systemctl list-timers --all` zeigt auch inaktive Timer; steht dort `-` statt eines Termins, ist der Timer nicht gestartet oder kaputt. `systemctl status name.timer` verrät, welches von beidem: `Loaded: bad-setting` heißt, systemd hat die Datei verworfen, der Grund steht direkt darunter im Journal (`Failed to parse calendar specification …`). `Trigger:` nennt den nächsten Termin, `Triggers:` die Unit, die der Timer startet; das ist ohne `Unit=` ([systemd.timer · Unit=](https://www.freedesktop.org/software/systemd/man/latest/systemd.timer.html#Unit=)) der Service mit demselben Namen. Gibt es den nicht, verweigert der Timer den Start mit `Refusing to start, unit … to trigger not loaded`. Für Skripte liefert `systemctl show -p NextElapseUSecRealtime name.timer` den nächsten Termin.

  ### User-Units und Lingering

  Dienste nur für deinen Benutzer brauchen kein root. Du legst sie unter `~/.config/systemd/user/` ab und steuerst sie mit `systemctl --user` und `journalctl --user` – für Desktop-Aufgaben wie ein Backup deiner Notizen genau richtig ([ArchWiki · systemd/User](https://wiki.archlinux.org/title/Systemd/User)). Die User-Instanz von systemd läuft, solange du angemeldet bist. Sollen deine User-Units auch ohne Login laufen, etwa auf einem Server, aktivierst du **Lingering**: `sudo loginctl enable-linger steven` ([loginctl(1)](https://www.freedesktop.org/software/systemd/man/latest/loginctl.html)).

  ## Logs mit journalctl

  `systemd-journald` sammelt die Ausgaben aller Dienste, Kernel-Meldungen und Syslog-Nachrichten in einem strukturierten, indizierten Journal. Jede Zeile trägt Metadaten: Unit, PID, Priorität, Boot-ID. Deshalb kannst du danach filtern ([journalctl(1)](https://www.freedesktop.org/software/systemd/man/latest/journalctl.html)):

  | Befehl | Zeigt |
  | --- | --- |
  | `journalctl -u shop` | alle Meldungen einer Unit |
  | `journalctl -u shop -f` | live mitlesen, wie `tail -f` |
  | `journalctl -b` | alles seit dem aktuellen Boot |
  | `journalctl -b -1` | alles aus dem vorigen Boot – nach einem Absturz Gold wert |
  | `journalctl --since "1 hour ago"` | Zeitfenster, auch `--since today`, `--until "2026-09-28 10:00"` |
  | `journalctl -p err` | Priorität `err` und schwerer (`crit`, `alert`, `emerg`) |
  | `journalctl -u shop -o cat` | nur die Nachrichten, ohne Zeitstempel und Hostname |
  | `journalctl -u shop -o json` | jede Zeile als JSON mit allen Feldern, gut für `jq` |
  | `journalctl -k` | nur Kernel-Meldungen |
  | `journalctl --disk-usage` | wie viel Platz das Journal belegt |

  Die Filter lassen sich kombinieren: `journalctl -u shop -b -p warning --since "10:00"` zeigt Warnungen und Schlimmeres der Shop-API seit zehn Uhr im aktuellen Boot. Die Prioritäten folgen syslog: `emerg` (0), `alert`, `crit`, `err`, `warning`, `notice`, `info`, `debug` (7) ([journalctl · -p](https://www.freedesktop.org/software/systemd/man/latest/journalctl.html#-p)). Achtung: Zeilen, die ein Dienst auf stdout oder stderr schreibt, bekommen standardmäßig die Priorität `info` – ein `-p err` blendet also auch Fehlermeldungen deiner App aus, wenn sie nur als Text `ERROR` enthalten. Dann hilft die Textsuche `journalctl -u shop -g ERROR`.

  Die Demo-API schreibt genau solche Zeilen. Nach dem Absturz-Test oben sieht das so aus:

  ```console vm
  $ journalctl -u shop -p warning -o cat
  shop.service: Main process exited, code=killed, status=9/KILL
  shop.service: Failed with result 'signal'.
  $ journalctl -u shop -g ERROR -o cat
  ERROR Zahlungsdienst nicht erreichbar: connect timeout nach 5000 ms
  ERROR Zahlungsdienst nicht erreichbar: connect timeout nach 5000 ms
  $ journalctl -u invoice-sync -p warning -o cat
  invoice-sync.service: Failed at step EXEC spawning /opt/invoice-sync/bin/invoice-sync: No such file or directory
  invoice-sync.service: Failed with result 'exit-code'.
  Failed to start invoice-sync.service - Rechnungsabgleich mit der Buchhaltung.
  ```

  `-p warning` findet nur die Meldungen, die systemd selbst mit Priorität geschrieben hat; die beiden `ERROR`-Zeilen der App (eine je Start) findet erst `-g`. Damit eigene Skripte mit echter Priorität loggen, gibt es [`systemd-cat`](https://www.freedesktop.org/software/systemd/man/latest/systemd-cat.html) und [`logger`](https://man7.org/linux/man-pages/man1/logger.1.html). Ein Dienst kann die Priorität auch selbst setzen, indem er eine Zeile mit `<3>` (für `err`) beginnt ([systemd.exec · SyslogLevelPrefix=](https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#SyslogLevelPrefix=)).

  ```console vm
  $ echo "Nur noch 4 % frei auf /srv" | systemd-cat -t backup -p warning
  $ logger -t backup -p user.err "Sicherung abgebrochen: Ziel nicht erreichbar"
  $ journalctl -t backup -p warning -o short-precise
  Oct 01 12:28:23.007569 web01 backup[510]: Nur noch 4 % frei auf /srv
  Oct 01 12:28:23.129611 web01 backup[511]: Sicherung abgebrochen: Ziel nicht erreichbar
  ```

  `-t` filtert nach dem Kennzeichen (`SYSLOG_IDENTIFIER`), `-o short-precise` zeigt Zeitstempel mit Mikrosekunden. Das hilft, wenn du Meldungen aus mehreren Diensten in die richtige Reihenfolge bringen musst.

  Zwei Details aus dem Betrieb: `-b -1` funktioniert nur, wenn das Journal **persistent** ist. Mit der Standardeinstellung `Storage=auto` ist das der Fall, sobald das Verzeichnis `/var/log/journal` existiert; sonst liegt das Journal nur im RAM unter `/run/log/journal` und ist nach dem Neustart weg ([journald.conf(5)](https://www.freedesktop.org/software/systemd/man/latest/journald.conf.html)). Und die Größe begrenzt journald selbst (standardmäßig auf einen Anteil des Dateisystems); einmalig aufräumen kannst du mit `sudo journalctl --vacuum-time=2weeks` oder `--vacuum-size=500M`.

  Die VM hat ein persistentes Journal. Es enthält schon zwei Boots: den ersten Start beim Bau des Images und den Start, aus dem das Terminal stammt.

  ```console vm
  $ journalctl --list-boots
  IDX BOOT ID                          FIRST ENTRY                  LAST ENTRY
   -1 2f2dcc15f9964bac9b408e05c5a9afae Thu 2026-10-01 11:49:17 CEST Thu 2026-10-01 11:49:42 CEST
    0 7e290a9120804839a118202aaed3f761 Thu 2026-10-01 11:50:05 CEST Thu 2026-10-01 12:28:23 CEST
  $ journalctl -b -1 -n 3
  Oct 01 11:49:42 web01 systemd-shutdown[1]: Sending SIGTERM to remaining processes...
  Oct 01 11:49:42 web01 systemd-journald[166]: Received SIGTERM from PID 1 (systemd-shutdow).
  Oct 01 11:49:42 web01 systemd-journald[166]: Journal stopped
  $ journalctl --disk-usage
  Archived and active journals take up 8.0M in the file system.
  ```

  Die letzten Zeilen eines Boots zeigen, wie er endete: Ein geordnetes Herunterfahren endet wie hier mit `Journal stopped`. Fehlt so ein Ende, ist der Rechner abgestürzt oder hart ausgeschaltet worden.

  > [!PRAXIS] Der Weg vom Alarm zur Ursache
  > Ein Dienst ist ausgefallen. Die Reihenfolge, die sich im Betrieb bewährt: `systemctl list-units --failed` (was ist kaputt?), `systemctl status shop` (Exit-Code, letzte Zeilen), `journalctl -u shop -b -e` (springt ans Ende der Meldungen seit dem Boot), bei Bedarf `journalctl -b -p err` für das ganze System. Der Exit-Status in `status` verrät oft schon die Richtung: `status=203/EXEC` heißt, das Programm aus `ExecStart=` ließ sich nicht starten; `status=217/USER`, dass der Benutzer aus `User=` nicht existiert ([systemd.exec · Process Exit Codes](https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#Process%20Exit%20Codes)).

  ## Wenn ein Dienst nicht startet: 203/EXEC und Startlimits

  In der VM ist `invoice-sync.service` beim Start gescheitert. Der Weg aus dem Kasten oben, angewandt:

  ```console vm
  $ systemctl status invoice-sync
  × invoice-sync.service - Rechnungsabgleich mit der Buchhaltung
       Loaded: loaded (/etc/systemd/system/invoice-sync.service; static)
       Active: failed (Result: exit-code) since Thu 2026-10-01 12:27:20 CEST; 1min 4s ago
     Main PID: 392 (code=exited, status=203/EXEC)
          CPU: 6ms

  Oct 01 12:27:20 web01 systemd[1]: Starting invoice-sync.service - Rechnungsabgleich mit der Buchhaltung...
  Oct 01 12:27:20 web01 (ice-sync)[392]: invoice-sync.service: Failed at step EXEC spawning /opt/invoice-sync/bin/invoice-sync: No such file or directory
  Oct 01 12:27:20 web01 systemd[1]: invoice-sync.service: Main process exited, code=exited, status=203/EXEC
  Oct 01 12:27:20 web01 systemd[1]: invoice-sync.service: Failed with result 'exit-code'.
  Oct 01 12:27:20 web01 systemd[1]: Failed to start invoice-sync.service - Rechnungsabgleich mit der Buchhaltung.
  $ systemctl list-units --failed
    UNIT                 LOAD   ACTIVE SUB    DESCRIPTION
  ● invoice-sync.service loaded failed failed Rechnungsabgleich mit der Buchhaltung
  …
  1 loaded units listed.
  ```

  `203/EXEC` bedeutet: systemd hat den Prozess angelegt, aber `execve` auf das Programm aus `ExecStart=` ist gescheitert. Von der Anwendung lief keine einzige Zeile. Die Zeile davor im Journal nennt den Fehlercode des Kernels, und der grenzt die Ursache ein (Meldungen von systemd 252):

  | Journal | Ursache | Prüfen mit |
  | --- | --- | --- |
  | `Failed at step EXEC spawning …: No such file or directory`, und `ls` findet die Datei nicht | falscher Pfad, Paket oder venv fehlt | `ls -l`, `systemctl cat` |
  | `Failed to locate executable …: Permission denied` | Ausführungsrecht fehlt, oder das Dateisystem ist mit `noexec` eingehängt | `ls -l`, `findmnt -T <pfad>` |
  | `Failed to execute …: No such file or directory`, obwohl die Datei existiert | Der Interpreter aus der `#!`-Zeile fehlt, oft wegen Windows-Zeilenenden: Der Kernel sucht `/bin/sh\r` | `head -n1 <datei> \| od -c`, `file` |
  | `Neither a valid executable name nor an absolute path` schon beim `daemon-reload` | relativer Pfad wie `./run.sh`; die Unit steht auf `bad-setting` | `systemctl status` |

  Der dritte Fall ist der tückischste, weil die Meldung „Datei nicht gefunden“ sagt, während `ls` sie anzeigt. In der Shell sieht er so aus:

  ```console vm fails
  $ printf '#!/bin/sh\r\necho hallo\r\n' > crlf.sh; chmod +x crlf.sh
  $ file crlf.sh
  crlf.sh: POSIX shell script, ASCII text executable, with CRLF line terminators
  $ head -n1 crlf.sh | od -c
  0000000   #   !   /   b   i   n   /   s   h  \r  \n
  0000013
  $ ./crlf.sh
  -bash: ./crlf.sh: cannot execute: required file not found
  ```

  `sed -i 's/\r$//' crlf.sh` entfernt die Wagenrückläufe am Zeilenende (oder `dos2unix`, wo es installiert ist).

  **Startlimit.** Hat eine Unit `Restart=on-failure` und scheitert jeder Start sofort, startet systemd sie im Abstand von `RestartSec=` neu, bis das Startlimit greift: standardmäßig fünf Starts in zehn Sekunden ([systemd.unit · StartLimitIntervalSec=](https://www.freedesktop.org/software/systemd/man/latest/systemd.unit.html#StartLimitIntervalSec=interval)). Danach steht im Journal `Start request repeated too quickly`, und auch ein `systemctl start` von Hand wird abgewiesen, bis das Intervall abgelaufen ist. Nach der Reparatur setzt [`systemctl reset-failed`](https://www.freedesktop.org/software/systemd/man/latest/systemctl.html#reset-failed%20%5BPATTERN%E2%80%A6%5D) den Zähler und den Zustand `failed` zurück:

  ```console vm
  $ systemctl show -p Result -p ExecMainStatus invoice-sync
  Result=exit-code
  ExecMainStatus=203
  $ sudo systemctl reset-failed invoice-sync
  $ systemctl list-units --failed
    UNIT LOAD ACTIVE SUB DESCRIPTION
  0 loaded units listed.
  ```

  `reset-failed` repariert nichts. Es räumt nur die Liste auf; scheitert der nächste Start, steht die Unit wieder dort.

  ## Häufige Fehler

  - **Unit geändert, `daemon-reload` vergessen.** Der Dienst startet mit der alten Definition. Nach Handarbeit an Unit-Dateien immer `sudo systemctl daemon-reload`; `systemctl edit` erledigt das selbst.
  - **Paket-Unit unter `/usr/lib/systemd/system` bearbeitet.** Das nächste Update überschreibt die Änderung. Nutze `systemctl edit`.
  - **Shell-Syntax in `ExecStart=`.** `cd /srv/app && npm start` oder `> app.log` funktionieren nicht. Setze `WorkingDirectory=` und lass Logs ins Journal gehen.
  - **Dienst schickt sich selbst in den Hintergrund** (etwa `--daemon`) bei `Type=simple` oder `exec`. systemd hält den Dienst für beendet und räumt die übrigen Prozesse ab. Den Vordergrund-Modus des Programms nutzen.
  - **`enable` ohne `--now`** und wundern, dass nichts läuft – oder `start` ohne `enable` und wundern, dass nach dem Reboot nichts läuft.
  - **`After=network.target`** für einen Dienst, der beim Start eine entfernte Datenbank erreichen muss. Richtig: `Wants=` und `After=network-online.target`.
  - **Cron-Syntax oder deutsche Wochentage in `OnCalendar=`.** `0 3 * * *` und `Mo..Fr 06:30` sind ungültig, systemd verwirft den Timer (`bad-setting`). `systemd-analyze calendar` deckt das vor dem Einsatz auf.
  - **Den Service statt den Timer aktivieren.** `enable db-backup.service` hat ohne `[Install]`-Abschnitt keine Wirkung; aktiviert wird `db-backup.timer`.
  - **Timer und Service heißen verschieden.** `backup.timer` startet ohne `Unit=` nur `backup.service`. Heißt die Service-Datei anders, verweigert der Timer den Start (`Refusing to start, unit … to trigger not loaded`).
  - **Startskript mit Windows-Zeilenenden oder ohne Ausführungsrecht.** Beides endet in `status=203/EXEC`. `file` und `ls -l` zeigen es sofort.

  ## Zusammenfassung

  - Boot: Firmware → Bootloader → Kernel → initramfs (findet das Root-Dateisystem) → systemd als PID 1 → `default.target`.
  - Units sind INI-Dateien; eigene gehören nach `/etc/systemd/system`, Anpassungen fremder Units als Drop-in per `systemctl edit`.
  - `start`/`stop` wirken jetzt, `enable`/`disable` beim Boot, `--now` verbindet beides. `reload` betrifft den Dienst, `daemon-reload` systemd selbst.
  - Eine gute Service-Unit hat `Type=exec` (oder `oneshot` für Jobs), einen eigenen `User=`, `WorkingDirectory=`, `EnvironmentFile=` für Secrets, `Restart=on-failure` und passende `Wants=`/`After=`. `ExecStart=` ist keine Shell: keine Umleitungen, Pipes oder `&&`.
  - Timer ersetzen cron: `OnCalendar=`, `Persistent=true`, Timer aktivieren, Zeitangaben mit `systemd-analyze calendar` prüfen, Überblick mit `list-timers --all`; `Triggers:` in `systemctl status` zeigt, welchen Service ein Timer startet.
  - `journalctl -u`, `-b`, `-b -1`, `-p err`, `-g`, `--since`, `-f`, `-o cat/json` beantworten fast jede Frage nach dem Warum. Was eine App auf stdout schreibt, hat Priorität `info`.
  - `status=203/EXEC` heißt: Das Programm aus `ExecStart=` ließ sich nicht starten. Die Journalzeile davor nennt den Grund; `systemctl reset-failed` setzt nach der Reparatur Startlimit und `failed` zurück, `systemctl show -p …` liefert einzelne Eigenschaften für Skripte.
  - User-Units liegen unter `~/.config/systemd/user`; mit Lingering laufen sie auch ohne Login.
exercises:
  - id: reload-restart-daemon-reload
    type: choice
    title: Drei Arten von „neu laden“
    prompt: Welche Aussagen stimmen?
    options:
      - text: "`systemctl reload nginx` lässt nginx seine Konfiguration neu lesen, ohne den Dienst zu stoppen – vorausgesetzt, die Unit definiert `ExecReload=`."
        correct: true
        why: "`reload` führt `ExecReload=` aus; bei nginx schickt das ein `SIGHUP` an den Masterprozess. Offene Verbindungen bleiben bestehen."
      - text: "`systemctl daemon-reload` lädt die Konfigurationsdateien aller laufenden Dienste neu, also auch `/etc/nginx/nginx.conf`."
        correct: false
        why: "`daemon-reload` lässt nur systemd seine eigenen Unit-Dateien neu einlesen. Die Dienste selbst merken davon nichts."
      - text: Nachdem du `/etc/systemd/system/shop.service` mit einem Editor geändert hast, brauchst du `daemon-reload`, bevor `restart` die Änderung übernimmt.
        correct: true
        why: systemd hält Unit-Definitionen im Speicher. Ohne `daemon-reload` startet `restart` den Dienst mit der alten Fassung.
      - text: "`restart` ist immer die schonendere Wahl als `reload`, weil der Dienst frisch startet."
        correct: false
        why: "`restart` stoppt den Dienst vollständig – laufende Anfragen brechen ab, und bei einem Konfigurationsfehler startet er nicht wieder. `reload` ist schonender, wenn der Dienst es unterstützt."
    explanation: |
      Es gibt zwei Ebenen: den **Dienst** mit seiner eigenen Konfiguration (`reload`, `restart`) und **systemd** mit den Unit-Dateien (`daemon-reload`). Wer eine Unit ändert, braucht `daemon-reload`; wer die Konfiguration des Programms ändert, braucht `reload` oder `restart`. Bei nginx gehört vorher `nginx -t` dazu, damit ein Tippfehler nicht den laufenden Dienst trifft.
    resources:
      - title: systemctl(1) – daemon-reload
        url: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html#daemon-reload

  - id: bootvorgang-ordnen
    type: order
    title: Vom Einschalten bis zum Login
    prompt: Bring die Etappen des Bootvorgangs eines UEFI-Systems in die richtige Reihenfolge.
    lang: text
    lines: |
      Die UEFI-Firmware initialisiert die Hardware und startet den Bootloader von der EFI-Systempartition.
      Der Bootloader lädt Kernel und initramfs in den Speicher und übergibt die Kernel-Kommandozeile.
      Der Kernel initialisiert CPU, Speicher und eingebaute Treiber und entpackt die initramfs.
      Die initramfs lädt Module, entschlüsselt bei Bedarf die Platte und hängt das echte Root-Dateisystem ein.
      Per switch_root wird das echte Root-Dateisystem zur Wurzel, systemd läuft dort als PID 1.
      systemd startet alle Units, die default.target braucht, so parallel wie möglich.
      Der Login-Manager oder die Konsole zeigt die Anmeldung.
    explanation: |
      Jede Etappe bereitet die nächste vor: Die Firmware kennt nur die EFI-Partition, der Bootloader nur Kernel und initramfs, und die initramfs existiert, weil der Kernel für das echte Root-Dateisystem womöglich Treiber oder eine Passphrase braucht, die er noch nicht hat. Erst dann übernimmt systemd als PID 1 und arbeitet die Abhängigkeiten von `default.target` ab. Wo ein Boot hängen bleibt, verrät dir, in welcher Etappe du suchen musst.
    resources:
      - title: bootup(7)
        url: https://www.freedesktop.org/software/systemd/man/latest/bootup.html
      - title: ArchWiki · Arch boot process
        url: https://wiki.archlinux.org/title/Arch_boot_process

  - id: wants-after
    type: choice
    title: Wer wartet auf wen?
    prompt: |
      Eine Unit enthält:

      ```ini
      [Unit]
      After=postgresql.service
      Wants=network-online.target
      ```

      Welche Aussagen stimmen?
    options:
      - text: "`After=postgresql.service` startet PostgreSQL nicht mit; es regelt nur die Reihenfolge, falls PostgreSQL ohnehin gestartet wird."
        correct: true
        why: "`After=` ist eine reine Ordnungsbeziehung. Mitgestartet wird eine Unit erst durch `Wants=` oder `Requires=`."
      - text: "`Wants=network-online.target` zieht das Ziel mit, aber ohne `After=network-online.target` kann die Unit trotzdem starten, bevor das Netz bereit ist."
        correct: true
        why: Ohne Ordnung startet systemd beide Units parallel. Deshalb stehen `Wants=` und `After=` für `network-online.target` fast immer zusammen.
      - text: "Mit `After=network.target` statt `network-online.target` wäre garantiert, dass IP-Adresse und DNS funktionieren."
        correct: false
        why: "`network.target` heißt nur, dass die Netzwerkverwaltung gestartet ist. Für ein konfiguriertes Netz ist `network-online.target` gedacht."
      - text: Stürzt eine per `Wants=` gezogene Unit ab, stoppt systemd auch die Unit, die sie haben wollte.
        correct: false
        why: "`Wants=` ist die schwache Abhängigkeit – ein Ausfall der anderen Unit bleibt folgenlos. Stärkere Kopplung bieten `Requires=` und `BindsTo=`."
    explanation: |
      Abhängigkeit (`Wants=`, `Requires=`) und Reihenfolge (`After=`, `Before=`) sind in systemd zwei getrennte Achsen. Ein Dienst, der beim Start eine Datenbank braucht, benötigt beides. Das ist eine häufige Ursache für Dienste, die beim manuellen Start funktionieren, beim Booten aber scheitern: Sie starten schneller als ihre Abhängigkeit.
    resources:
      - title: systemd.unit(5) – Wants=
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.unit.html#Wants=
      - title: systemd.io · Running Services After the Network Is Up
        url: https://systemd.io/NETWORK_ONLINE/

  - id: exec-datei-ist-da
    type: choice
    title: Die Datei ist doch da
    prompt: |
      `backup.service` scheitert mit `status=203/EXEC`. Im Journal steht:

      ```text
      backup.service: Failed to execute /usr/local/bin/backup.sh: No such file or directory
      ```

      `ls -l /usr/local/bin/backup.sh` zeigt aber `-rwxr-xr-x 1 root root 412 Sep 28 09:12 /usr/local/bin/backup.sh`. Welche Ursachen passen zu diesem Bild?
    options:
      - text: Die Datei hat Windows-Zeilenenden. Der Kernel sucht deshalb den Interpreter `/bin/bash\r`, den es nicht gibt.
        correct: true
        why: Der Kernel liest die `#!`-Zeile bis zum Zeilenumbruch. Das `\r` davor gehört dann zum Pfad des Interpreters, und den gibt es nicht. Das meldet `execve` als `ENOENT`.
      - text: Die `#!`-Zeile nennt einen Interpreter, der auf diesem Server fehlt, etwa `#!/usr/bin/python3` ohne installiertes Python.
        correct: true
        why: Fehlt der Interpreter, meldet `execve` ebenfalls „No such file or directory“, obwohl das Skript selbst existiert.
      - text: Dem Skript fehlt das Ausführungsrecht.
        correct: false
        why: Dann lautete der Fehler `Permission denied`. Außerdem zeigt `ls -l` hier `rwx`.
      - text: Ein Befehl im Skript, etwa `rsync`, ist nicht installiert.
        correct: false
        why: Dann wäre das Skript gestartet und mit eigenem Exit-Code gescheitert, meist 127 („command not found“). `203/EXEC` heißt, dass schon der Start scheiterte.
    explanation: |
      systemd meldet `203/EXEC`, wenn `execve` für das Programm aus `ExecStart=` scheitert. Bei einem Skript lädt der Kernel dabei den Interpreter aus der `#!`-Zeile. Fehlt der, kommt `ENOENT` zurück, und die Meldung nennt den Pfad des Skripts, nicht den des Interpreters. Die häufigste Ursache sind Windows-Zeilenenden: Aus `#!/bin/bash` wird `#!/bin/bash\r`. `file` meldet dann `with CRLF line terminators`, `head -n1 … | od -c` zeigt das `\r`.
    resources:
      - title: execve(2) – ERRORS
        url: https://man7.org/linux/man-pages/man2/execve.2.html#ERRORS
      - title: systemd.exec(5) – Process Exit Codes
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#Process%20Exit%20Codes

  - id: enabled-aber-inaktiv
    type: output
    title: Aktiviert heißt nicht aktiv
    prompt: |
      Auf einem frisch eingerichteten Server hat jemand `sudo systemctl enable nginx` ausgeführt, aber weder `start` noch einen Neustart. Was geben die drei Befehle aus?
    lang: console
    code: |
      $ systemctl is-enabled nginx
      $ systemctl is-active nginx
      $ systemctl is-active --quiet nginx && echo "läuft" || echo "läuft nicht"
    expected: |
      enabled
      inactive
      läuft nicht
    explanation: |
      `enable` hat nur den Symlink für den nächsten Boot angelegt, deshalb meldet `is-enabled` `enabled`. Gestartet wurde nichts, also `inactive`. `is-active --quiet` gibt nichts aus, liefert aber den Exit-Status 0 nur für `active` – deshalb landet die Kette im `||`-Zweig. Genau diese Kombination nutzt man in Skripten und Healthchecks.
    resources:
      - title: systemctl(1) – is-enabled
        url: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html#is-enabled%20UNIT%E2%80%A6

  - id: calendar-normalisiert
    type: output
    title: Wie systemd Zeitangaben liest
    prompt: Was steht bei den drei Aufrufen jeweils in der Zeile `Normalized form:`? Gib nur die drei normalisierten Ausdrücke aus, einen pro Zeile.
    lang: console
    code: |
      $ systemd-analyze calendar "03:00"
      $ systemd-analyze calendar "Mon..Fri 9:00"
      $ systemd-analyze calendar weekly
    expected: |
      *-*-* 03:00:00
      Mon..Fri *-*-* 09:00:00
      Mon *-*-* 00:00:00
    explanation: |
      Die vollständige Form ist `Wochentag Jahr-Monat-Tag Stunde:Minute:Sekunde`. Fehlende Teile ergänzt systemd: Ein fehlendes Datum wird zu `*-*-*` (jeden Tag), fehlende Sekunden zu `:00`. `weekly` ist eine Abkürzung für Montag 00:00 Uhr. Wer die normalisierte Form liest, erkennt Fehler sofort – etwa dass `weekly` nicht „alle sieben Tage ab jetzt“ bedeutet.
    resources:
      - title: systemd.time(7) – Calendar Events
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.time.html#Calendar%20Events

  - id: enable-now
    type: command
    title: Jetzt und bei jedem Boot
    prompt: Sorge mit **einem** Befehl dafür, dass `nginx` sofort startet und außerdem bei jedem Boot gestartet wird.
    context: Du bist als normaler Benutzer mit sudo-Rechten angemeldet.
    answers:
      - sudo systemctl enable --now nginx
      - sudo systemctl enable --now nginx.service
      - sudo systemctl --now enable nginx
      - sudo systemctl --now enable nginx.service
      - sudo systemctl enable nginx --now
      - sudo systemctl enable nginx.service --now
    output: |
      Created symlink '/etc/systemd/system/multi-user.target.wants/nginx.service' → '/usr/lib/systemd/system/nginx.service'.
    explanation: |
      `enable` legt anhand von `WantedBy=` im `[Install]`-Abschnitt einen Symlink an, `--now` startet die Unit zusätzlich sofort. Ohne `--now` würde nginx erst beim nächsten Boot laufen. Die Kombination aus zwei Befehlen, `sudo systemctl enable nginx && sudo systemctl start nginx`, bewirkt dasselbe; gefragt war hier ein einziger Befehl. Das Gegenstück ist `disable --now`.
    resources:
      - title: systemctl(1) – enable
        url: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html#enable%20UNIT%E2%80%A6

  - id: journal-fehler-seit-boot
    type: command
    title: Nur die Warnungen seit dem Boot
    prompt: Zeige alle Meldungen der Unit `shop` seit dem **aktuellen Boot**, aber nur mit Priorität `warning` oder schwerer. Nutze die Kurzoptionen und das Schlüsselwort `warning`.
    context: Die Shop-API hat heute Nacht mehrfach neu gestartet. Du willst nicht durch Tausende Info-Zeilen scrollen.
    answers:
      - journalctl -u shop -b -p warning
      - journalctl -u shop -p warning -b
      - journalctl -b -u shop -p warning
      - journalctl -b -p warning -u shop
      - journalctl -p warning -u shop -b
      - journalctl -p warning -b -u shop
      - journalctl -u shop.service -b -p warning
      - journalctl -u shop.service -p warning -b
      - journalctl -b -u shop.service -p warning
      - journalctl -b -p warning -u shop.service
      - journalctl -p warning -u shop.service -b
      - journalctl -p warning -b -u shop.service
      - sudo journalctl -u shop -b -p warning
      - sudo journalctl -b -u shop -p warning
      - sudo journalctl -u shop -p warning -b
    output: |
      Sep 28 02:14:09 web01 systemd[1]: shop.service: Main process exited, code=killed, status=9/KILL
      Sep 28 02:14:09 web01 systemd[1]: shop.service: Failed with result 'signal'.
    explanation: |
      `-u` filtert nach Unit, `-b` ohne Argument auf den aktuellen Boot, `-p warning` auf `warning` und alle schwereren Stufen (`err`, `crit`, `alert`, `emerg`). Die Beispielausgabe zeigt, wie viel das bringt: Der Hauptprozess wurde per `SIGKILL` beendet (Status 9), sehr wahrscheinlich vom OOM-Killer – `journalctl -k -b` würde die Kernel-Meldung dazu zeigen. Beachte: Was ein Dienst auf stdout/stderr schreibt, speichert das Journal standardmäßig mit Priorität `info`, auch wenn in der Zeile `[ERROR]` steht. Ein Prioritätsfilter zeigt deshalb vor allem die Meldungen von systemd selbst; die Fehlermeldungen der App findest du mit `journalctl -u shop -b` oder einer Textsuche wie `-g ERROR`. Normale Benutzer sehen die Meldungen von System-Units, wenn sie in der Gruppe `systemd-journal` (auf Arch auch `wheel`) sind; sonst braucht es `sudo`.
    resources:
      - title: journalctl(1) – -p
        url: https://www.freedesktop.org/software/systemd/man/latest/journalctl.html#-p

  - id: drop-in-anlegen
    type: command
    title: Anpassen, ohne zu kopieren
    prompt: Du willst für die vom Paket installierte Unit `shop.service` nur `RestartSec=` ändern. Öffne mit einem Befehl einen Editor für einen **Drop-in**, der die Originaldatei unangetastet lässt.
    context: Du bist als normaler Benutzer mit sudo-Rechten angemeldet.
    answers:
      - sudo systemctl edit shop
      - sudo systemctl edit shop.service
      - sudo systemctl edit --drop-in=override.conf shop
    output: |
      ### Editing /etc/systemd/system/shop.service.d/override.conf
      ### Anything between here and the comment below will become the contents of the drop-in file

      [Service]
      RestartSec=10

      ### Edits below this comment will be discarded
    explanation: |
      `systemctl edit` legt `/etc/systemd/system/shop.service.d/override.conf` an und führt nach dem Speichern selbst `daemon-reload` aus. Im Drop-in stehen nur der Abschnitt und die Direktiven, die du ändern willst; alles andere erbt die Unit aus der Paketdatei. `systemctl cat shop` zeigt danach Original und Drop-in untereinander. Mit `--full` würdest du stattdessen eine vollständige Kopie anlegen, die spätere Verbesserungen des Pakets verdeckt. Für den Neustart mit der neuen Einstellung folgt noch `sudo systemctl restart shop`.
    resources:
      - title: systemctl(1) – edit
        url: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html#edit%20UNIT%E2%80%A6

  - id: service-unit-luecken
    type: gap
    title: Eine Unit für die Shop-API
    prompt: |
      Ergänze die Unit. Anforderungen: Der Dienst startet erst, wenn das Netz konfiguriert ist; systemd soll den Start als gescheitert melden, wenn sich das Programm nicht ausführen lässt; er läuft als Benutzer `shop`; Secrets kommen aus `/etc/shop/shop.env`; nach einem Absturz startet er neu, nach einem sauberen Beenden nicht; er startet beim normalen Hochfahren des Servers.
    lang: ini
    code: |
      [Unit]
      Description=Shop API (Gunicorn)
      ⟦After⟧=network-online.target
      Wants=network-online.target

      [Service]
      Type=⟦exec⟧
      User=⟦shop⟧
      WorkingDirectory=/srv/shop
      ⟦EnvironmentFile⟧=/etc/shop/shop.env
      ExecStart=/srv/shop/.venv/bin/gunicorn --workers 4 --bind 127.0.0.1:8000 shop.wsgi:application
      Restart=⟦on-failure⟧
      RestartSec=5

      [Install]
      WantedBy=⟦multi-user.target⟧
    gaps:
      - label: Reihenfolge
        hint: "`Wants=` zieht das Ziel nur mit. Welche Direktive legt fest, dass gewartet wird?"
      - label: Starttyp
        hint: Der Typ, bei dem systemd auf ein erfolgreiches `execve` wartet.
      - label: Benutzer
        hint: Steht in der Aufgabe.
      - label: Secrets aus Datei
        hint: "`Environment=` setzt einzelne Variablen; diese Direktive liest eine Datei."
      - label: Neustart-Regel
        hint: Nicht `always` – nach `exit 0` soll nichts passieren.
      - label: Ziel beim normalen Hochfahren
        hint: Das Ziel für einen Server ohne grafische Oberfläche.
    explanation: |
      `Wants=` plus `After=network-online.target` ist das Paar für „erst starten, wenn das Netz da ist“. `Type=exec` meldet einen Fehler schon bei `systemctl start`, wenn das Programm fehlt oder der Benutzer nicht existiert – bei `simple` würde `start` Erfolg melden. `EnvironmentFile=` hält Secrets aus der Unit heraus, die jeder mit `systemctl cat` lesen kann. `Restart=on-failure` reagiert auf Exit-Codes ungleich 0, Signale und Timeouts, nicht auf ein sauberes Ende. `WantedBy=multi-user.target` wird von `enable` gelesen.
    resources:
      - title: systemd.service(5) – Type=
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html#Type=
      - title: systemd.exec(5) – EnvironmentFile=
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#EnvironmentFile=

  - id: execstart-umleitung
    type: bug
    title: Gunicorn versteht die Argumente nicht
    prompt: |
      Nach `sudo systemctl start shop` bleibt der Dienst im Zustand `failed`. `journalctl -u shop -o cat` zeigt:

      ```text
      usage: gunicorn [OPTIONS] [APP_MODULE]
      gunicorn: error: unrecognized arguments: >> /var/log/shop/gunicorn.log 2>&1
      ```

      Von Hand gestartet funktioniert derselbe Befehl in der Shell. Finde die fehlerhafte Zeile und korrigiere sie so, dass die Ausgaben ins Journal gehen.
    lang: ini
    code: |
      [Unit]
      Description=Shop API (Gunicorn)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=exec
      User=shop
      WorkingDirectory=/srv/shop
      EnvironmentFile=/etc/shop/shop.env
      ExecStart=/srv/shop/.venv/bin/gunicorn --workers 4 --bind 127.0.0.1:8000 shop.wsgi:application >> /var/log/shop/gunicorn.log 2>&1
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    lines: [11]
    fix:
      - line: 11
        answers:
          - ExecStart=/srv/shop/.venv/bin/gunicorn --workers 4 --bind 127.0.0.1:8000 shop.wsgi:application
    explanation: |
      `ExecStart=` wird nicht von einer Shell ausgeführt. systemd zerlegt die Zeile nur in Wörter und übergibt `>>`, den Pfad und `2>&1` als gewöhnliche Argumente an Gunicorn, das sie nicht kennt. In der Shell funktioniert derselbe Befehl, weil dort die Shell die Umleitung vorher auswertet. Die Lösung: Umleitung weglassen. stdout und stderr landen automatisch im Journal, mit Zeitstempel, Rotation und Filterbarkeit. Wer trotzdem eine Datei braucht, nutzt `StandardOutput=append:/var/log/shop/gunicorn.log` in einer eigenen Zeile.
    resources:
      - title: systemd.service(5) – Command lines
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html
      - title: systemd.exec(5) – StandardOutput=
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html

  - id: timer-cron-syntax
    type: bug
    title: Das Backup läuft nie
    prompt: |
      `sudo systemctl enable --now db-backup.timer` bricht mit `Unit db-backup.timer has a bad unit file setting` ab. `journalctl -b` enthält:

      ```text
      systemd[1]: /etc/systemd/system/db-backup.timer:5: Failed to parse calendar specification, ignoring: 0 3 * * *
      systemd[1]: db-backup.timer: Timer unit lacks value setting. Refusing.
      ```

      Das Backup soll täglich um 03:00 Uhr laufen und einen verpassten Lauf nachholen. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: ini
    code: |
      [Unit]
      Description=Tägliches Datenbank-Backup

      [Timer]
      OnCalendar=0 3 * * *
      Persistent=true

      [Install]
      WantedBy=timers.target
    lines: [5]
    fix:
      - line: 5
        answers:
          - OnCalendar=*-*-* 03:00:00
          - OnCalendar=*-*-* 03:00
          - OnCalendar=03:00
          - OnCalendar=03:00:00
          - OnCalendar=*-*-* 3:00
          - OnCalendar=3:00
    explanation: |
      `0 3 * * *` ist die Crontab-Schreibweise (Minute, Stunde, Tag, Monat, Wochentag). systemd kennt ein eigenes Format, `Wochentag Jahr-Monat-Tag Stunde:Minute:Sekunde`, in dem fehlende Teile ergänzt werden – `03:00` genügt. systemd ignoriert die ungültige Zeile und verweigert dann den Timer, weil er keine Zeitangabe mehr hat – die Unit landet im Ladezustand `bad-setting`, und jeder Start scheitert. Die Lehre: jede neue Zeitangabe vorher mit `systemd-analyze calendar "…"` prüfen und nach dem Aktivieren in `systemctl list-timers` die Spalte `NEXT` ansehen.
    resources:
      - title: systemd.time(7) – Calendar Events
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.time.html#Calendar%20Events
      - title: systemd.timer(5) – OnCalendar=
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.timer.html#OnCalendar=

  - id: status-203-erklaeren
    type: explain
    title: Was sagt dieser Status?
    prompt: Ein Kollege schickt dir diese Ausgabe mit der Frage „Warum läuft die API nicht?“. Erkläre Zeile für Zeile, was du daraus liest, und nenne die wahrscheinliche Ursache.
    lang: console
    code: |
      $ systemctl status shop
      × shop.service - Shop API (Gunicorn)
           Loaded: loaded (/etc/systemd/system/shop.service; enabled; preset: disabled)
          Drop-In: /etc/systemd/system/shop.service.d
                   └─override.conf
           Active: failed (Result: exit-code) since Mon 2026-09-28 09:14:03 CEST; 2min ago
         Duration: 3ms
          Process: 48231 ExecStart=/srv/shop/.venv/bin/gunicorn --workers 4 --bind 127.0.0.1:8000 shop.wsgi:application (code=exited, status=203/EXEC)
         Main PID: 48231 (code=exited, status=203/EXEC)

      Sep 28 09:14:03 web01 (gunicorn)[48231]: shop.service: Unable to locate executable '/srv/shop/.venv/bin/gunicorn': No such file or directory
      Sep 28 09:14:03 web01 (gunicorn)[48231]: shop.service: Failed at step EXEC spawning /srv/shop/.venv/bin/gunicorn: No such file or directory
      Sep 28 09:14:03 web01 systemd[1]: shop.service: Start request repeated too quickly.
      Sep 28 09:14:03 web01 systemd[1]: shop.service: Failed with result 'exit-code'.
      Sep 28 09:14:03 web01 systemd[1]: Failed to start shop.service - Shop API (Gunicorn).
    points:
      - Die Unit ist geladen und `enabled`, startet also beim Boot; es gibt zusätzlich einen Drop-in, der Einstellungen überschreiben könnte.
      - "`failed` mit `status=203/EXEC` heißt: Das Programm aus `ExecStart=` ließ sich gar nicht starten – der Code der App lief nie."
      - Die Journalzeilen nennen die Ursache – die Datei `/srv/shop/.venv/bin/gunicorn` existiert nicht, etwa weil das virtuelle Environment fehlt, neu angelegt oder an einen anderen Ort verschoben wurde.
      - "`Restart=` hat mehrmals neu versucht; nach zu vielen Starts in kurzer Zeit hat systemd aufgegeben (`Start request repeated too quickly`)."
      - "Nächste Schritte: venv prüfen bzw. neu anlegen, `systemctl cat shop` auf den Drop-in ansehen, dann `systemctl reset-failed shop` und `systemctl start shop`."
    explanation: |
      Die Unit ist korrekt geladen und für den Boot aktiviert, und ein Drop-in in `shop.service.d` ergänzt sie – den würde ich mir mit `systemctl cat shop` ansehen, weil er `ExecStart` überschreiben könnte. Der Dienst ist `failed`, und der Exit-Status `203/EXEC` ist kein Fehler der App, sondern von systemd: Der `execve`-Aufruf ist gescheitert. Die Journalzeilen sagen, warum – die Gunicorn-Datei im venv existiert nicht. Typisch ist ein Deployment, das das venv gelöscht und nicht neu gebaut hat, oder ein anderer Pfad. `Restart=on-failure` hat es mehrfach versucht, bis das Startlimit griff. Ich würde das venv wiederherstellen (`python -m venv` und Abhängigkeiten installieren), den Zähler mit `systemctl reset-failed shop` zurücksetzen und den Dienst neu starten.
    resources:
      - title: systemd.exec(5) – Process Exit Codes
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#Process%20Exit%20Codes

  - id: notizen-backup-timer
    type: practice
    title: Ein Backup-Timer für deine Notizen
    prompt: |
      Richte auf deinem CachyOS als **User-Units** (ohne root) ein tägliches Backup ein:

      - `notizen-backup.service` spiegelt `~/Notizen/` mit `rsync -a --delete` nach `~/Backups/Notizen/`.
      - `notizen-backup.timer` startet es täglich um 18:00 Uhr und holt verpasste Läufe nach, wenn der Rechner aus war.

      Prüfe die Zeitangabe, löse das Backup einmal von Hand aus, lies das Ergebnis im Journal, aktiviere den Timer und kontrolliere die nächste Ausführung. Tipp: In Unit-Dateien steht `%h` für dein Home-Verzeichnis.
    lang: ini
    starter: |
      # ~/.config/systemd/user/notizen-backup.service
      [Unit]
      Description=

      [Service]


      # ~/.config/systemd/user/notizen-backup.timer
      [Unit]
      Description=

      [Timer]


      [Install]
    solution: |
      # ~/.config/systemd/user/notizen-backup.service
      [Unit]
      Description=Notizen nach ~/Backups/Notizen spiegeln

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/rsync -a --delete %h/Notizen/ %h/Backups/Notizen/

      # ~/.config/systemd/user/notizen-backup.timer
      [Unit]
      Description=Notizen täglich um 18:00 sichern

      [Timer]
      OnCalendar=*-*-* 18:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target

      # Befehle (fish oder bash):
      # mkdir -p ~/.config/systemd/user ~/Backups
      # systemd-analyze calendar "*-*-* 18:00:00"
      # systemctl --user daemon-reload
      # systemctl --user start notizen-backup.service
      # journalctl --user -u notizen-backup -e
      # systemctl --user enable --now notizen-backup.timer
      # systemctl --user list-timers
    checklist:
      - Der Service hat `Type=oneshot` und kein `[Install]`-Abschnitt – aktiviert wird nur der Timer.
      - "`ExecStart=` nutzt absolute Pfade bzw. `%h` und keine Shell-Syntax wie `~` oder `>`."
      - Der Timer hat `OnCalendar=` für 18:00 Uhr, `Persistent=true` und `WantedBy=timers.target`.
      - Du hast die Zeitangabe mit `systemd-analyze calendar` geprüft und nach dem Anlegen `systemctl --user daemon-reload` ausgeführt.
      - Ein manueller Start per `systemctl --user start notizen-backup.service` war erfolgreich, und `journalctl --user -u notizen-backup` zeigt den Lauf.
      - "`systemctl --user list-timers` zeigt für `notizen-backup.timer` die nächste Ausführung um 18:00."
    explanation: |
      Die Aufteilung in Service (was) und Timer (wann) ist das Grundmuster aller systemd-Timer. `Type=oneshot` passt, weil `rsync` endet, sobald die Arbeit getan ist. `~` versteht systemd nicht, weil keine Shell beteiligt ist; der Specifier `%h` liefert das Home-Verzeichnis. Der abschließende Schrägstrich hinter `Notizen/` bewirkt, dass `rsync` den **Inhalt** spiegelt statt eines Unterordners – mehr dazu im Netzwerk-Modul. `Persistent=true` holt das Backup nach, wenn der Rechner um 18:00 Uhr aus war. Weil es User-Units sind, laufen sie, solange du angemeldet bist; auf einem Server ohne Login bräuchte es `loginctl enable-linger`.
    resources:
      - title: ArchWiki · systemd/Timers
        url: https://wiki.archlinux.org/title/Systemd/Timers
      - title: systemd.timer(5) – Persistent=
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.timer.html#Persistent=

  - id: preisdienst-faellt-aus
    type: scenario
    title: Bei mir lief das Skript
    prompt: |
      Ein Kollege hat heute Morgen den neuen Preisdienst von seinem Laptop aus über eine Dateifreigabe nach `web01` kopiert und `pricing-api.service` aktiviert. Seitdem meldet das Monitoring, dass `http://localhost:8081/health` nicht antwortet. „Bei mir lief das Skript“, schreibt er im Chat.

      Bring `pricing-api` zum Laufen: Der Health-Endpunkt soll antworten, und der Dienst soll auch einen Neustart überstehen. Die Unit selbst ist in Ordnung. Du bist als `ops` angemeldet und hast `sudo`.
    setup: |
      set -e
      useradd --system --no-create-home --shell /usr/sbin/nologin pricing
      install -d /opt/pricing-api/bin /opt/pricing-api/public
      echo ok > /opt/pricing-api/public/health
      echo '{"artikel": 1842, "stand": "06:00"}' > /opt/pricing-api/public/prices.json
      # Über die Dateifreigabe kopiert: Windows-Zeilenenden, kein Ausführungsrecht
      printf '#!/bin/sh\r\n# Startskript des Preisdienstes\r\nexec busybox httpd -f -p 8081 -h /opt/pricing-api/public\r\n' > /opt/pricing-api/bin/start.sh
      chmod 644 /opt/pricing-api/bin/start.sh
      cat > /etc/systemd/system/pricing-api.service <<'EOF'
      [Unit]
      Description=Preisdienst

      [Service]
      User=pricing
      ExecStart=/opt/pricing-api/bin/start.sh
      Restart=on-failure
      RestartSec=1

      [Install]
      WantedBy=multi-user.target
      EOF
      systemctl daemon-reload
      systemctl enable --quiet --now pricing-api
      # Warten, bis systemd nach fünf Fehlstarts aufgibt (Startlimit)
      for i in $(seq 40); do [ "$(systemctl show -p ActiveState --value pricing-api)" = failed ] && break; sleep 0.5; done
    checks:
      - name: pricing-api läuft
        run: systemctl is-active pricing-api
      - name: Der Health-Endpunkt antwortet
        run: curl -fsS --max-time 5 http://localhost:8081/health
      - name: pricing-api übersteht einen Neustart des Dienstes
        run: systemctl restart pricing-api && sleep 2 && systemctl is-active pricing-api
    solution: |
      # failed mit status=203/EXEC: Das Programm aus ExecStart= ließ sich nicht starten.
      systemctl status pricing-api --no-pager
      journalctl -u pricing-api -n 20 --no-pager
      # „Failed to locate executable …: Permission denied“
      ls -l /opt/pricing-api/bin/start.sh
      sudo chmod 755 /opt/pricing-api/bin/start.sh
      # Nach zu vielen Fehlstarts weist systemd jeden Start ab, bis der Zähler zurückgesetzt ist.
      sudo systemctl reset-failed pricing-api
      sudo systemctl start pricing-api
      sleep 3
      # Wieder 203/EXEC, jetzt „No such file or directory“ – obwohl die Datei existiert.
      journalctl -u pricing-api -n 5 --no-pager -o cat
      file /opt/pricing-api/bin/start.sh
      head -n1 /opt/pricing-api/bin/start.sh | od -c
      # Windows-Zeilenenden: Der Kernel sucht den Interpreter „/bin/sh\r“. Alle Zeilen reparieren:
      sudo sed -i 's/\r$//' /opt/pricing-api/bin/start.sh
      file /opt/pricing-api/bin/start.sh
      sudo systemctl reset-failed pricing-api
      sudo systemctl restart pricing-api
      sleep 1
      curl -fsS http://localhost:8081/health
    hints:
      - "`systemctl status pricing-api` zeigt den Exit-Status, `journalctl -u pricing-api` die Zeile davor mit dem Grund."
      - "`203/EXEC` heißt, `execve` auf die Datei aus `ExecStart=` ist gescheitert. Sieh dir die Datei mit `ls -l` an und starte sie testweise von Hand."
      - "„No such file or directory“, obwohl die Datei da ist? Sieh dir die erste Zeile genau an: `file /opt/pricing-api/bin/start.sh` oder `head -n1 … | od -c`. Bei „Start request repeated too quickly“ hilft `systemctl reset-failed pricing-api`."
    explanation: |
      Zwei Fehler liegen hintereinander, beide vom Kopieren. Zuerst fehlt das Ausführungsrecht: `Failed to locate executable …: Permission denied`, und `ls -l` zeigt `-rw-r--r--`. Nach `chmod 755` bleibt es bei `203/EXEC`, jetzt mit `No such file or directory`. Gemeint ist nicht das Skript, sondern sein Interpreter: Die Datei hat Windows-Zeilenenden, für den Kernel lautet die erste Zeile `#!/bin/sh\r`, und ein Programm `/bin/sh\r` gibt es nicht. In der Shell heißt dieselbe Ursache `cannot execute: required file not found`. `sed -i 's/\r$//'` repariert alle Zeilen. Nur die erste zu reparieren reicht nicht: Das `\r` am Ende des Pfads hinter `-h` ließe `httpd` scheitern.

      Dazu kommt `Restart=on-failure`. Jeder Fehlstart löst einen neuen Versuch aus, bis nach fünf Starts in zehn Sekunden das Startlimit greift (`Start request repeated too quickly`). Wer innerhalb dieses Fensters repariert, setzt den Zähler mit `systemctl reset-failed` zurück. Allgemein gilt: Bei `203/EXEC` hat die Anwendung nie angefangen. Die Ursache liegt bei Datei, Rechten, Interpreter oder Pfad, nicht im Code.
    resources:
      - title: systemd.exec(5) – Process Exit Codes
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#Process%20Exit%20Codes
      - title: execve(2) – ERRORS
        url: https://man7.org/linux/man-pages/man2/execve.2.html#ERRORS
      - title: systemctl(1) – reset-failed
        url: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html#reset-failed%20%5BPATTERN%E2%80%A6%5D

  - id: morgenbericht-fehlt
    type: scenario
    title: Der Morgenbericht kam nie an
    prompt: |
      Seit Montag soll `web01` jeden Werktag um 06:30 einen Morgenbericht für das Team erzeugen: Plattenplatz, fehlgeschlagene Units, Last. Ein Kollege hat dafür `morning-report.timer` eingerichtet und mit `systemctl enable` aktiviert. Bisher kam kein einziger Bericht, und in `/var/lib/morning-report/` liegt nichts.

      Sorge dafür, dass der Timer werktags um 06:30 den Bericht erzeugt, auch nach einem Neustart des Servers. Du bist als `ops` angemeldet und hast `sudo`.
    setup: |
      set -e
      cat > /usr/local/bin/morning-report <<'EOF'
      #!/bin/bash
      # Morgenbericht: Plattenplatz, fehlgeschlagene Units und Last für das Team
      set -eu
      ziel=/var/lib/morning-report/report-$(date +%F).txt
      {
        echo "Morgenbericht für $(hostname), $(date '+%F %R')"
        df -h / /boot
        systemctl list-units --failed --no-legend
        cat /proc/loadavg
      } > "$ziel"
      echo "Bericht geschrieben: $ziel"
      EOF
      chmod 755 /usr/local/bin/morning-report
      cat > /etc/systemd/system/morning_report.service <<'EOF'
      [Unit]
      Description=Morgenbericht erzeugen

      [Service]
      Type=oneshot
      StateDirectory=morning-report
      ExecStart=/usr/local/bin/morning-report
      EOF
      cat > /etc/systemd/system/morning-report.timer <<'EOF'
      [Unit]
      Description=Morgenbericht werktags um 06:30

      [Timer]
      OnCalendar=Mo..Fr 06:30
      Persistent=true

      [Install]
      WantedBy=timers.target
      EOF
      systemctl daemon-reload
      systemctl enable --quiet morning-report.timer
    checks:
      - name: morning-report.timer ist aktiviert und läuft
        run: systemctl is-enabled morning-report.timer && systemctl is-active morning-report.timer
      - name: Der nächste Termin liegt werktags um 06:30
        run: |
          cal=$(systemctl show -p TimersCalendar --value morning-report.timer)
          case "$cal" in
            *'OnCalendar=Mon..Fri *-*-* 06:30:00 '*) ;;
            *) echo "Zeitangabe des Timers: ${cal:-keine}"; exit 1 ;;
          esac
          test -n "$(systemctl show -p NextElapseUSecRealtime --value morning-report.timer)"
      - name: Der Timer startet einen Service, der den Bericht erzeugt
        run: |
          svc=$(systemctl show -p Triggers --value morning-report.timer)
          systemctl start "$svc" || exit 1
          test -s "/var/lib/morning-report/report-$(date +%F).txt" || { echo "Kein Bericht von heute in /var/lib/morning-report."; exit 1; }
    solution: |
      # list-timers zeigt nur aktive Timer, --all auch die übrigen: kein Termin für morning-report.timer.
      systemctl list-timers --all --no-pager
      # Loaded: bad-setting – „Failed to parse calendar specification … Mo..Fr 06:30“
      systemctl status morning-report.timer --no-pager
      # systemd kennt nur englische Wochentage.
      systemd-analyze calendar "Mo..Fr 06:30" || true
      systemd-analyze calendar "Mon..Fri 06:30"
      sudo sed -i 's/^OnCalendar=Mo\.\.Fr 06:30$/OnCalendar=Mon..Fri 06:30/' /etc/systemd/system/morning-report.timer
      sudo systemctl daemon-reload
      # Der Start scheitert trotzdem: „Refusing to start, unit morning-report.service to trigger not loaded“
      sudo systemctl start morning-report.timer || journalctl -u morning-report.timer -n 3 --no-pager
      # Der Timer startet ohne Unit= den gleichnamigen Service. Die Datei heißt aber anders:
      ls /etc/systemd/system/ | grep -i morning
      sudo mv /etc/systemd/system/morning_report.service /etc/systemd/system/morning-report.service
      sudo systemctl daemon-reload
      sudo systemctl start morning-report.timer
      systemctl list-timers morning-report.timer --no-pager
      # Einmal von Hand auslösen, statt bis morgen 06:30 zu warten
      sudo systemctl start morning-report.service
      journalctl -u morning-report.service -n 3 --no-pager -o cat
    hints:
      - "`systemctl list-timers --all` zeigt auch Timer ohne Termin. Was steht in `systemctl status morning-report.timer` hinter `Loaded:` und im Journal darunter?"
      - "Prüfe die Zeitangabe mit `systemd-analyze calendar \"…\"`. In welcher Sprache erwartet systemd Wochentage?"
      - "Startet der Timer auch nach der Korrektur nicht? Lies `Triggers:` in `systemctl status morning-report.timer` und vergleiche mit den Dateien in `/etc/systemd/system/`."
    explanation: |
      Der Timer war aktiviert, aber nie aktiv. `Mo..Fr` ist Deutsch; systemd kennt nur englische Wochentage, verwirft die Zeile beim Laden (`Failed to parse calendar specification`) und lehnt dann einen Timer ohne Zeitangabe ab (`Timer unit lacks value setting`, `Loaded: bad-setting`). `enable` legt trotzdem den Symlink an, deshalb sah die Einrichtung richtig aus. Nach der Korrektur auf `Mon..Fri 06:30` scheitert der Start am zweiten Fehler: Ohne `Unit=` startet `morning-report.timer` die Unit `morning-report.service`, die Datei heißt aber `morning_report.service`. Umbenennen oder `Unit=morning_report.service` im Timer lösen das. Danach braucht es `daemon-reload` und einen Start des Timers, denn `enable` allein hätte ihn erst beim nächsten Boot gestartet.

      Prüfe neue Timer deshalb dreifach: `systemd-analyze calendar` für die Zeitangabe, `systemctl list-timers` für den nächsten Termin und `systemctl start <service>` für die Arbeit selbst.
    resources:
      - title: systemd.time(7) – Calendar Events
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.time.html#Calendar%20Events
      - title: systemd.timer(5) – Unit=
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd.timer.html#Unit=
      - title: systemctl(1) – list-timers
        url: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html#list-timers%20PATTERN%E2%80%A6
