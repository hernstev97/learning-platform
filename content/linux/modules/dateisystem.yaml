id: dateisystem
title: Dateisystem & Navigation
level: 1
minutes: 200
summary: Wie Linux alle Dateien in einem einzigen Baum organisiert, wie du dich darin bewegst, Dateien sicher anlegst, kopierst und löschst – und wie du mit `find` genau die Dateien erwischst, die du meinst.
goals:
  - Du erklärst, was „alles ist eine Datei“ bedeutet, und ordnest die wichtigsten Verzeichnisse des FHS ihrem Zweck zu.
  - Du navigierst mit absoluten und relativen Pfaden, `.`, `..`, `~` und `cd -`.
  - Du legst Dateien und Verzeichnisse an, kopierst, verschiebst und löschst sie und schützt dich vor `rm -rf` mit leeren Variablen.
  - Du nutzt Globbing und Brace Expansion und weißt, dass die Shell sie auflöst, bevor der Befehl startet.
  - Du unterscheidest Hardlinks und symbolische Links über das Inode-Modell.
  - Du findest Dateien mit `find` nach Name, Typ, Alter und Größe und bearbeitest die Treffer mit `-exec … {} +`.
resources:
  - title: Filesystem Hierarchy Standard 3.0
    url: https://refspecs.linuxfoundation.org/FHS_3.0/fhs/index.html
  - title: hier(7) – Aufbau des Dateisystems
    url: https://man7.org/linux/man-pages/man7/hier.7.html
  - title: GNU Findutils · Finding Files
    url: https://www.gnu.org/software/findutils/manual/html_mono/find.html
  - title: Bash Reference Manual · Filename Expansion
    url: https://www.gnu.org/software/bash/manual/html_node/Filename-Expansion.html
lab: |
  set -e
  # ~/projekt ist ein tmpfs: Symlinks, Verzeichnisgrößen und df zeigen dort dasselbe wie auf einer echten Platte.
  p=/home/ops/projekt
  install -d -o ops -g ops "$p"
  mount -t tmpfs -o size=32m,mode=755,uid=1000,gid=1000 projekt "$p"
  cd "$p"
  mkdir -p shop/src shop/tests shop/docs logs
  printf 'port: 8080\n' > shop/config.yaml
  printf 'DB_PASSWORT=geheim\n' > shop/.env
  printf '<h1>Shop</h1>\n' > shop/src/index.html
  printf '#!/bin/sh\ncurl -fsS http://localhost:8080/health\n' > shop/tests/smoke.sh
  printf '# Shop\n\nStart: ./tests/smoke.sh\n' > shop/docs/README.md
  head -c 3M /dev/zero > shop/backup.tar
  # Logs mit echtem Alter: Name, Alter in Tagen, Zeilen (Vielfache von 20). gzip behält die Zeitstempel.
  cd logs
  log() {
    local i; for ((i = 0; i < $3; i += 20)); do printf 'GET /api/produkte 200 12ms\n%.0s' {1..20}; done > "$1"
    touch -d "@$((EPOCHSECONDS - $2 * 86400))" "$1"
  }
  log api.log.5 43 900; log api.log.4 36 900; log api.log.3 15 800; log api.log.2 8 700
  log db.log.3 40 400; log db.log.2 8 300
  gzip -n api.log.[2-5] db.log.[23]
  log api.log.1 1 600; log db.log.1 1 200; log api.log 0 120; log db.log 0 40
  echo 'worker gestartet' > worker.log; touch -d '2 hours ago' worker.log
  printf '# Notizen\n- Logrotation prüfen\n' > notizen.md; touch -d '3 days ago' notizen.md
  chown -R ops:ops "$p"
lesson: |
  Montagmorgen, der Monitoring-Alarm meldet: „Dateisystem `/` zu 97 % voll“. Du loggst dich ein und musst drei Fragen schnell beantworten: Wo liegen auf diesem Server die großen Dateien? Welche davon darf ich löschen? Und wie lösche ich *genau diese* – und nicht versehentlich mehr? Die Werkzeuge dafür sind einfach: `cd`, `ls`, `du`, `find`, `rm`. Gefährlich wird es, wenn du nicht weißt, was die Shell aus deinem Befehl macht, bevor er ausgeführt wird.

  Dieses Modul baut dafür ein klares Bild auf: ein Verzeichnisbaum, in dem jedes Verzeichnis einen Zweck hat, Pfade als Wegbeschreibungen, Namen als Verweise auf Inodes, und eine Shell, die Muster wie `*.log` selbst in Dateinamen übersetzt.

  Die Beispiele mit „Im Terminal“ laufen in einem echten Debian 12 im Browser, angemeldet als `ops`. Dort liegt ein Beispielprojekt unter `~/projekt`: ein kleiner Shop und ein Log-Verzeichnis mit Dateien, die Tage bis Wochen alt sind.

  ## Alles ist eine Datei – in einem einzigen Baum

  Unter Linux gibt es keine Laufwerksbuchstaben. Es gibt genau **einen** Verzeichnisbaum, der bei `/` (Root) beginnt. Weitere Dateisysteme – eine zweite SSD, ein USB-Stick, ein Netzlaufwerk – werden an einem Verzeichnis in diesen Baum **eingehängt** (gemountet). Auf CachyOS mit btrfs sind zum Beispiel `/` und `/home` verschiedene Subvolumes, die du trotzdem als einen Baum siehst. Im Terminal dieser Lektion hängen drei Dateisysteme in einem Baum:

  ```console vm
  $ df -h / /boot ~/projekt
  Filesystem      Size  Used Avail Use% Mounted on
  host9p          256G  303M  256G   1% /
  /dev/sda1        54M   16M   34M  33% /boot
  projekt          32M  3.1M   29M  10% /home/ops/projekt
  ```

  `/` kommt über das Protokoll 9p aus dem Emulator, `/boot` ist die erste Partition der virtuellen Platte `/dev/sda`, und `~/projekt` ist ein [tmpfs](https://man7.org/linux/man-pages/man5/tmpfs.5.html) im Arbeitsspeicher, den das Terminal für diese Lektion eingehängt hat. Für `cd` und `ls` ist das alles ein Baum; welches Dateisystem hinter einem Pfad steckt, zeigen `df` und [`findmnt`](https://man7.org/linux/man-pages/man8/findmnt.8.html).

  Der Grundsatz „alles ist eine Datei“ heißt: Fast alles, womit ein Programm arbeitet, erreicht es über einen Pfad und dieselben System Calls (`open`, `read`, `write`). Das erste Zeichen in `ls -l` verrät den Typ:

  | Zeichen | Typ | Beispiel |
  | --- | --- | --- |
  | `-` | reguläre Datei | `/etc/hostname` |
  | `d` | Verzeichnis | `/var/log` |
  | `l` | symbolischer Link | `/bin -> usr/bin` |
  | `c` / `b` | Zeichen- / Blockgerät | `/dev/null`, `/dev/sda`, `/dev/nvme0n1` |
  | `s` / `p` | Socket / Named Pipe | `/run/systemd/journal/socket` |

  ```console vm
  $ ls -l /dev/null /dev/sda
  crw-rw-rw- 1 root root 1, 3 Oct  1 11:50 /dev/null
  brw-rw---- 1 root disk 8, 0 Oct  1 11:50 /dev/sda
  $ cat /proc/loadavg
  0.42 0.31 0.12 1/76 367
  $ file /usr/bin/ls
  /usr/bin/ls: ELF 32-bit LSB pie executable, Intel 80386, version 1 (SYSV), dynamically linked, …
  ```

  Bei Gerätedateien steht statt der Größe ein Zahlenpaar: Über diese Major- und Minor-Nummer findet der Kernel den Treiber. `/proc/loadavg` liegt auf keiner Platte: Der Kernel erzeugt den Inhalt beim Lesen. Genauso funktionieren [`/proc`](https://man7.org/linux/man-pages/man5/proc.5.html) (Prozesse und Kernel-Zustand) und [`/sys`](https://docs.kernel.org/filesystems/sysfs.html) (Geräte und Treiber). [`file`](https://man7.org/linux/man-pages/man1/file.1.html) schaut in den Inhalt statt auf die Endung – unter Linux ist `.txt` nur ein Teil des Namens.

  ## Der Verzeichnisbaum: jedes Verzeichnis hat einen Zweck

  Wo was liegt, regelt der [Filesystem Hierarchy Standard (FHS)](https://refspecs.linuxfoundation.org/FHS_3.0/fhs/index.html); die man-Pages [hier(7)](https://man7.org/linux/man-pages/man7/hier.7.html) und [file-hierarchy(7)](https://man7.org/linux/man-pages/man7/file-hierarchy.7.html) beschreiben die heutige Praxis. Du musst nicht jedes Verzeichnis kennen, aber diese:

  | Pfad | Inhalt | Denk an … |
  | --- | --- | --- |
  | `/etc` | systemweite Konfiguration, Textdateien | `/etc/nginx/nginx.conf`, `/etc/ssh/sshd_config` |
  | `/home` | Heimatverzeichnisse der Benutzer | `/home/ops`; root wohnt in `/root` |
  | `/usr` | installierte Programme und Bibliotheken, im Betrieb nur lesend | `/usr/bin`, `/usr/lib`, `/usr/share/doc` |
  | `/usr/local` | von Hand installierte Software, am Paketmanager vorbei | `/usr/local/bin` |
  | `/opt` | in sich geschlossene Zusatzpakete | `/opt/google/chrome` |
  | `/var` | Daten, die im Betrieb wachsen | `/var/log`, `/var/lib/postgresql`, `/var/cache` |
  | `/tmp` | temporäre Dateien für alle | wird beim Neustart geleert |
  | `/run` | Laufzeitdaten seit dem letzten Boot | PID-Dateien, Sockets |
  | `/dev` | Gerätedateien | `/dev/null`, `/dev/sda` |
  | `/proc`, `/sys` | virtuelle Schnittstellen zum Kernel | `/proc/cpuinfo` |
  | `/boot` | Kernel und Bootloader-Dateien | `vmlinuz-6.1.0-53-686`, `grub/` |
  | `/srv` | Daten, die der Server ausliefert | `/srv/www` |

  Das Denkmodell dahinter: **`/usr` ist statisch, `/var` wächst, `/etc` konfiguriert.** Wenn eine Platte vollläuft, ist fast immer `/var` schuld (Logs, Datenbanken, Container-Images), selten `/usr`. Auf aktuellen Distributionen sind `/bin`, `/sbin` und `/lib` übrigens nur noch Symlinks nach `/usr` („merged /usr“):

  ```console vm
  $ ls /
  bin   dev  home        initrd.img.old  media  opt   root  sbin  sys  usr  vmlinuz
  boot  etc  initrd.img  lib             mnt    proc  run   srv   tmp  var  vmlinuz.old
  $ ls -ld /bin /sbin /lib
  lrwxrwxrwx 1 root root 0 Sep 18 02:00 /bin -> usr/bin
  lrwxrwxrwx 1 root root 0 Sep 18 02:00 /lib -> usr/lib
  lrwxrwxrwx 1 root root 0 Sep 18 02:00 /sbin -> usr/sbin
  ```

  `vmlinuz` und `initrd.img` sind Debians Links auf den aktuellen Kernel in `/boot`. Auf Arch und damit CachyOS ist `/tmp` ein `tmpfs` im Arbeitsspeicher. Debian 12 legt `/tmp` noch auf die Platte und leert es beim Booten (`D /tmp` in `/usr/lib/tmpfiles.d/tmp.conf`); [seit Debian 13](https://www.debian.org/releases/trixie/release-notes/issues.en.html#the-temporary-files-directory-tmp-is-now-stored-in-a-tmpfs) ist es auch dort ein tmpfs.

  > [!INTERVIEW] „Wo schaust du auf einem Server zuerst nach?“
  > Konfiguration in `/etc/<dienst>`, Logs in `/var/log` oder im Journal, Anwendungsdaten in `/var/lib/<dienst>`, selbst deployte Anwendungen meist unter `/opt` oder `/srv`. Wer das ohne Nachdenken sagen kann, zeigt, dass er sich auf fremden Systemen orientieren kann.

  ## Pfade und Navigation

  Ein **absoluter Pfad** beginnt mit `/` und gilt von überall: `/var/log/nginx/access.log`. Ein **relativer Pfad** beginnt nicht mit `/` und wird vom aktuellen Arbeitsverzeichnis aus gelesen. Drei Kürzel helfen:

  - `.` ist das aktuelle Verzeichnis, `..` das übergeordnete. Beide existieren als echte Einträge in jedem Verzeichnis.
  - `~` ersetzt die Shell durch dein Heimatverzeichnis, `~anna` durch das von `anna`. Das macht die Shell ([Tilde Expansion](https://www.gnu.org/software/bash/manual/html_node/Tilde-Expansion.html)), nicht `cd`.
  - `cd -` springt ins vorige Verzeichnis zurück und gibt es aus. `cd` ohne Argument bringt dich nach Hause.

  ```console vm
  $ cd ~/projekt/shop/src
  $ pwd
  /home/ops/projekt/shop/src
  $ cd ../../logs
  $ pwd
  /home/ops/projekt/logs
  $ cd -
  /home/ops/projekt/shop/src
  ```

  Für den Überblick brauchst du [`ls`](https://www.gnu.org/software/coreutils/manual/html_node/ls-invocation.html) mit wenigen Optionen: `-l` ausführlich, `-a` auch versteckte Dateien, `-h` Größen lesbar (K, M, G), `-t` nach Änderungszeit sortiert (neueste zuerst), `-r` umgekehrt, `-d` ein Verzeichnis selbst statt seines Inhalts. `ls -lht` zeigt dir also sofort, welche Logdatei zuletzt geschrieben wurde:

  ```console vm
  $ ls -lht ~/projekt/logs
  total 64K
  -rw-r--r-- 1 ops ops 3.2K Oct  1 12:19 api.log
  -rw-r--r-- 1 ops ops 1.1K Oct  1 12:19 db.log
  -rw-r--r-- 1 ops ops   17 Oct  1 10:19 worker.log
  -rw-r--r-- 1 ops ops  16K Sep 30 12:19 api.log.1
  -rw-r--r-- 1 ops ops 5.3K Sep 30 12:19 db.log.1
  -rw-r--r-- 1 ops ops   32 Sep 28 12:19 notizen.md
  -rw-r--r-- 1 ops ops   90 Sep 23 12:19 db.log.2.gz
  …
  -rw-r--r-- 1 ops ops  130 Aug 19 12:19 api.log.5.gz
  ```

  **Versteckte Dateien** sind unter Linux nur eine Konvention: Namen, die mit `.` beginnen, blendet `ls` ohne `-a` aus. So liegen Konfigurationen wie `.bashrc`, `.gitignore` oder `.env` unauffällig im Verzeichnis. `ls -A` zeigt sie ohne die Einträge `.` und `..`:

  ```console vm
  $ ls ~/projekt/shop
  backup.tar  config.yaml  docs  src  tests
  $ ls -A ~/projekt/shop
  .env  backup.tar  config.yaml  docs  src  tests
  ```

  > [!NOTE] ls sieht bei dir anders aus
  > In fish auf CachyOS ist `ls` ein Alias für `eza` mit Icons und Farben (siehe Modul „Linux & die Shell“). Die Ausgaben in diesem Kurs stammen vom GNU-`ls`, das du mit `command ls -l` bekommst und das auf jedem Server läuft.

  ## Anlegen, kopieren, verschieben, löschen

  | Befehl | Wirkung | Wichtige Optionen |
  | --- | --- | --- |
  | `touch datei` | legt eine leere Datei an oder setzt die Änderungszeit auf jetzt | `-d '2 days ago'` |
  | `mkdir verz` | legt ein Verzeichnis an | `-p` legt fehlende Eltern an, kein Fehler, wenn es existiert |
  | `cp quelle ziel` | kopiert | `-r` rekursiv, `-a` Archivmodus, `-i` nachfragen |
  | `mv quelle ziel` | verschiebt oder benennt um | `-i`, `-n` nie überschreiben |
  | `rm datei` | löscht einen Verzeichniseintrag | `-r` rekursiv, `-i` nachfragen, `-f` ohne Rückfrage |

  Drei Details, die im Alltag zählen:

  - **`cp -a` statt `cp -r` für Backups.** `-a` ([Archivmodus](https://www.gnu.org/software/coreutils/manual/html_node/cp-invocation.html)) kopiert rekursiv und erhält Rechte, Zeitstempel und Symlinks. Mit `-r` allein haben die Kopien die aktuelle Zeit und deine Standardrechte.
  - **Existiert das Ziel, landet die Quelle darin.** `cp -r src backup` erzeugt `backup` als Kopie von `src` – aber nur, wenn `backup` noch nicht existiert. Beim zweiten Aufruf entsteht `backup/src`. Dasselbe gilt für `mv`.
  - **`mv` innerhalb eines Dateisystems ist sofort fertig**, auch bei 50 GB: Es ändert nur Verzeichniseinträge. Über Dateisystemgrenzen hinweg kopiert es und löscht danach.

  Die ersten beiden kannst du im Beispielprojekt nachstellen:

  ```console vm
  $ cd ~/projekt
  $ cp -r logs logs-kopie-r
  $ cp -a logs logs-kopie-a
  $ ls -l logs/api.log.5.gz logs-kopie-r/api.log.5.gz logs-kopie-a/api.log.5.gz
  -rw-r--r-- 1 ops ops 130 Aug 19 12:19 logs-kopie-a/api.log.5.gz
  -rw-r--r-- 1 ops ops 130 Oct  1 12:19 logs-kopie-r/api.log.5.gz
  -rw-r--r-- 1 ops ops 130 Aug 19 12:19 logs/api.log.5.gz
  $ cp -r shop/docs docs-backup
  $ cp -r shop/docs docs-backup
  $ ls docs-backup
  README.md  docs
  ```

  Die Kopie mit `-r` trägt die Uhrzeit des Kopierens; ein späteres `find -mtime +30` hält sie für neu. Und der zweite `cp -r` hat keine Fehlermeldung ausgegeben, sondern `docs` *in* das vorhandene `docs-backup` kopiert.

  `rm` kennt keinen Papierkorb. Und weil die Shell Variablen *vor* dem Aufruf einsetzt, ist diese Zeile in einem Skript eine Zeitbombe:

  ```bash
  rm -rf $BUILD_DIR/*
  ```

  Ist `BUILD_DIR` leer, weil jemand das Skript ohne Argument aufruft, führt die Shell `rm -rf /*` aus. Genau das ist 2015 im Linux-Startskript von Steam passiert und hat bei Nutzern das komplette Heimatverzeichnis gelöscht ([Issue #3671](https://github.com/ValveSoftware/steam-for-linux/issues/3671)). Enthält der Pfad ein Leerzeichen, trifft `rm` außerdem die falschen Verzeichnisse. Was die Shell aus der Zeile macht, siehst du gefahrlos, wenn du `echo` davorsetzt:

  ```console vm
  $ BUILD_DIR=
  $ echo rm -rf $BUILD_DIR/*
  rm -rf /bin /boot /dev /etc /home /initrd.img /initrd.img.old /lib /media /mnt /opt /proc /root /run /sbin /srv /sys /tmp /usr /var /vmlinuz /vmlinuz.old
  ```

  Die sichere Form:

  ```bash
  rm -rf -- "${BUILD_DIR:?BUILD_DIR ist leer}"/*
  ```

  ```console vm fails
  $ BUILD_DIR=
  $ echo rm -rf -- "${BUILD_DIR:?BUILD_DIR ist leer}"/*
  -bash: BUILD_DIR: BUILD_DIR ist leer
  ```

  `"…"` verhindert das Zerlegen an Leerzeichen, [`${VAR:?}`](https://www.gnu.org/software/bash/manual/html_node/Shell-Parameter-Expansion.html) bricht mit Fehlermeldung ab, wenn die Variable leer oder nicht gesetzt ist, und `--` beendet die Optionen. GNU `rm` verweigert zwar `rm -rf /` (`--preserve-root` ist Standard), aber `/*` sind aus seiner Sicht lauter einzelne Verzeichnisse – der Schutz greift dort nicht.

  ## Globbing und Brace Expansion: die Shell übersetzt

  ```console vm
  $ cd ~/projekt/logs
  $ ls
  api.log    api.log.2.gz  api.log.4.gz  db.log    db.log.2.gz  notizen.md
  api.log.1  api.log.3.gz  api.log.5.gz  db.log.1  db.log.3.gz  worker.log
  $ echo *.log
  api.log db.log worker.log
  $ echo *.log.?
  api.log.1 db.log.1
  $ echo api.log.[2-4].gz
  api.log.2.gz api.log.3.gz api.log.4.gz
  $ echo *.csv
  *.csv
  ```

  **Globbing** ([Filename Expansion](https://www.gnu.org/software/bash/manual/html_node/Filename-Expansion.html)) ersetzt Muster durch passende Dateinamen: `*` steht für beliebig viele Zeichen, `?` für genau eines, `[abc]` oder `[0-9]` für eines aus einer Menge. Die Frage ist, *wer* das tut: **die Shell, bevor der Befehl startet.** `rm *.log` bekommt nie das Muster zu sehen, sondern die fertige Liste `api.log db.log worker.log`. Daraus folgen drei Regeln:

  - `*` trifft keine versteckten Dateien. `rm -r *` lässt `.env` und `.git` stehen.
  - Passt nichts, reicht bash das Muster **unverändert** weiter (siehe `*.csv` oben). fish bricht in diesem Fall den Befehl mit einer Fehlermeldung ab ([fish-Doku zu Wildcards](https://fishshell.com/docs/current/fish_for_bash_users.html#wildcards-globs)); `[abc]` kennt fish nicht.
  - Soll ein **Programm** das Muster auswerten – etwa `find` –, musst du es quoten: `find . -name '*.log'`. Ohne Quotes würde die Shell `*.log` schon im aktuellen Verzeichnis auflösen, und `find` bekäme `-name api.log db.log worker.log`.

  **Brace Expansion** ([Brace Expansion](https://www.gnu.org/software/bash/manual/html_node/Brace-Expansion.html)) sieht ähnlich aus, ist aber etwas anderes: Sie erzeugt Wörter, *ohne* nach existierenden Dateien zu schauen.

  ```console vm
  $ cd ~/projekt
  $ mkdir -p neu/{src,tests,docs}
  $ cp shop/config.yaml{,.bak}
  $ ls neu shop
  neu:
  docs  src  tests

  shop:
  backup.tar  config.yaml  config.yaml.bak  docs  src  tests
  $ echo bericht-{01..03}.pdf
  bericht-01.pdf bericht-02.pdf bericht-03.pdf
  ```

  `shop/config.yaml{,.bak}` wird zu `shop/config.yaml shop/config.yaml.bak` – die schnellste Art, vor einer Änderung ein Backup zu machen. fish kennt `{a,b}`, aber keine Bereiche wie `{01..03}`; dort nimmst du `seq`.

  ## Inodes, Hardlinks und symbolische Links

  Ein Dateiname ist nicht die Datei. Die eigentliche Datei ist ein **Inode**: ein Eintrag mit Typ, Rechten, Besitzer, Größe, Zeitstempeln und den Verweisen auf die Datenblöcke ([inode(7)](https://man7.org/linux/man-pages/man7/inode.7.html)). Ein **Verzeichnis** ist nur eine Tabelle „Name → Inode-Nummer“. `ls -i` zeigt die Nummer, `stat` alle Metadaten:

  ```console vm
  $ cd ~/projekt/shop
  $ ln config.yaml config-hart.yaml
  $ ln -s config.yaml config-link.yaml
  $ ls -li config.yaml config-hart.yaml config-link.yaml
   7 -rw-r--r-- 2 ops ops 11 Oct  1 12:19 config-hart.yaml
  66 lrwxrwxrwx 1 ops ops 11 Oct  1 12:19 config-link.yaml -> config.yaml
   7 -rw-r--r-- 2 ops ops 11 Oct  1 12:19 config.yaml
  $ stat -c '%i %h %n' config.yaml
  7 2 config.yaml
  ```

  - Ein **Hardlink** (`ln ziel name`) ist ein zweiter Name für **denselben** Inode. Beide Namen sind gleichberechtigt; die Zahl `2` in der zweiten Spalte ist der Link-Zähler. Hardlinks gehen nur innerhalb eines Dateisystems und nicht auf Verzeichnisse.
  - Ein **symbolischer Link** (`ln -s ziel name`) ist eine eigene kleine Datei mit eigenem Inode, deren Inhalt ein Pfad ist; seine Größe `11` ist die Länge von `config.yaml`. Er darf auf Verzeichnisse und über Dateisystemgrenzen zeigen – und er kann ins Leere zeigen, wenn das Ziel verschwindet. Ein relativer Zielpfad wird vom Ort des **Links** aus aufgelöst, nicht von deinem aktuellen Verzeichnis.

  Die Reihenfolge bei [`ln`](https://www.gnu.org/software/coreutils/manual/html_node/ln-invocation.html) merkst du dir wie bei `cp`: erst das Bestehende, dann das Neue.

  `rm` entfernt nur einen **Namen**. Der Inode und seine Daten werden erst freigegeben, wenn kein Name mehr darauf zeigt **und** kein Prozess die Datei noch geöffnet hat ([unlink(2)](https://man7.org/linux/man-pages/man2/unlink.2.html)).

  > [!PRAXIS] Gelöscht, aber die Platte bleibt voll
  > Klassiker im Betrieb: Du löschst eine 20 GB große Logdatei, doch `df` zeigt keinen freien Platz mehr. Der Dienst hat die Datei noch geöffnet und schreibt weiter hinein – nur hat sie keinen Namen mehr. Erst ein Neustart oder Reload des Dienstes gibt den Platz frei. Besser ist es, die Datei zu leeren statt zu löschen (`truncate -s 0 app.log`) oder gleich `logrotate` zu nutzen. Das Modul zur Fehlersuche zeigt, wie du solche Dateien mit `lsof` findest.

  Symlinks siehst du überall: `/bin -> usr/bin`, Konfigurationen in `/etc/nginx/sites-enabled/`, die auf `sites-available/` zeigen, oder ein Deploy-Verzeichnis `current`, das auf die aktuelle Version in `releases/` zeigt. Umschalten heißt dann nur: Link neu setzen, mit `ln -sfn releases/v43 current`. Das `-n` ist Pflicht: Ohne es folgt `ln` dem vorhandenen Link `current` in sein Zielverzeichnis und legt den neuen Link *dort* an. GNU `ln` (coreutils 9.1 auf Debian 12) legt den neuen Link unter einem Zufallsnamen an und benennt ihn mit [rename(2)](https://man7.org/linux/man-pages/man2/rename.2.html) über den alten; `strace` zeigt das. Ein Prozess, der `current` gerade öffnet, sieht deshalb immer entweder das alte oder das neue Ziel, nie eine Lücke.

  ## Dateien finden mit find

  [`find`](https://man7.org/linux/man-pages/man1/find.1.html) durchläuft einen Verzeichnisbaum und prüft jede Datei gegen eine Reihe von **Tests**. Alle Tests müssen zutreffen (logisches UND), dann folgt eine **Aktion** – ohne Angabe ist es `-print`.

  ```console vm
  $ find ~/projekt/logs -type f -name '*.gz' -mtime +30
  /home/ops/projekt/logs/db.log.3.gz
  /home/ops/projekt/logs/api.log.5.gz
  /home/ops/projekt/logs/api.log.4.gz
  $ find ~/projekt -type f -size +1M -exec ls -lh {} +
  -rw-r--r-- 1 ops ops 3.0M Oct  1 12:19 /home/ops/projekt/shop/backup.tar
  ```

  Auf einem Server sieht dasselbe mit `/var/log` und Gigabytes genauso aus. Die Reihenfolge der Treffer ist die, in der `find` sie im Verzeichnis antrifft, nicht alphabetisch.

  | Test | Bedeutung |
  | --- | --- |
  | `-name '*.log'` / `-iname` | Name passt auf das Muster (`-iname`: ohne Groß-/Kleinschreibung) |
  | `-type f` / `d` / `l` | reguläre Datei / Verzeichnis / Symlink |
  | `-mtime +7` / `-7` | Inhalt vor mehr als 7 vollen Tagen / innerhalb der letzten 7 Tage geändert |
  | `-mmin -60` | in den letzten 60 Minuten geändert |
  | `-size +100M` | größer als 100 MiB (`k`, `M`, `G`) |
  | `-maxdepth 2` | höchstens zwei Ebenen tief suchen |

  Bei `-mtime` rechnet `find` in ganzen 24-Stunden-Blöcken und schneidet angebrochene Tage ab: `-mtime +7` trifft Dateien, die mindestens 8 Tage alt sind. Die genaue Regel steht in der man-Page.

  Für Aktionen gibt es zwei Formen von `-exec`. Mit `\;` startet `find` den Befehl **für jede Datei einzeln** – bei 10 000 Dateien 10 000 Prozesse. Mit `+` sammelt es viele Dateinamen und startet den Befehl so selten wie möglich ([Multiple Files](https://www.gnu.org/software/findutils/manual/html_node/find_html/Multiple-Files.html)). `{}` ist der Platzhalter für die Dateinamen.

  `-delete` löscht jeden Treffer. Weil `find` den Ausdruck von links nach rechts auswertet, zählt die **Position**: `find . -delete -name '*.log'` löscht erst alles und prüft danach den Namen. Die sichere Gewohnheit: Befehl erst ohne `-delete` laufen lassen, Liste prüfen, dann `-delete` **ans Ende** hängen. Die Liste oben war geprüft, also:

  ```console vm
  $ find ~/projekt/logs -type f -name '*.gz' -mtime +30 -delete
  $ ls ~/projekt/logs
  api.log    api.log.2.gz  db.log    db.log.2.gz  worker.log
  api.log.1  api.log.3.gz  db.log.1  notizen.md
  ```

  Für den Überblick über Größen helfen [`du`](https://www.gnu.org/software/coreutils/manual/html_node/du-invocation.html) und [`tree`](https://manpages.debian.org/bookworm/tree/tree.1.en.html):

  ```console vm
  $ sudo du -h --max-depth=1 /var | sort -h | tail -4
  2.6M    /var/cache
  6.0M    /var/lib
  8.6M    /var/log
  18M     /var
  $ du -sh ~/projekt
  3.3M    /home/ops/projekt
  $ tree ~/projekt/shop
  /home/ops/projekt/shop
  ├── backup.tar
  ├── config-hart.yaml
  ├── config-link.yaml -> config.yaml
  ├── config.yaml
  ├── config.yaml.bak
  ├── docs
  │   └── README.md
  ├── src
  │   └── index.html
  └── tests
      └── smoke.sh

  4 directories, 8 files
  ```

  Auf einem Server, der seit Monaten läuft, stehen bei `/var/log` schnell Gigabytes; diese VM ist frisch gestartet. `du` braucht hier `sudo`, weil `ops` nicht in jedes Verzeichnis unter `/var` hineinschauen darf; ohne zählt es diese einfach nicht mit.

  ## Häufige Fehler

  - **`No such file or directory` bei relativen Pfaden:** Du bist in einem anderen Verzeichnis, als du denkst. `pwd` prüfen oder absolute Pfade benutzen – in Skripten und Cronjobs ohnehin.
  - **Leerzeichen im Namen:** `cd Mein Projekt` übergibt zwei Argumente. Quoten (`cd "Mein Projekt"`) oder mit `Tab` vervollständigen lassen.
  - **`find -name *.log` ohne Quotes:** Findet nur Dateien, die so heißen wie die Logdatei im aktuellen Verzeichnis, oder bricht mit `paths must precede expression` ab.
  - **`cp -r` für Backups:** Zeitstempel und Rechte gehen verloren. Nimm `cp -a`.
  - **Symlink mit falschem relativen Ziel:** `ln -s config.yaml /etc/app/config.yaml` zeigt auf `/etc/app/config.yaml` selbst. Nimm einen absoluten Pfad als Ziel oder denke vom Ort des Links aus.
  - **`ln -sf` auf einen Link zu einem Verzeichnis:** `ln -sf releases/v43 current` meldet keinen Fehler, legt den neuen Link aber *in* das Verzeichnis, auf das `current` zeigt. `current` bleibt, wie er war. Mit `-n` (oder `-T`) ersetzt `ln` den Link selbst.
  - **`find … -delete` ohne Probelauf oder ohne `-maxdepth`:** `find` steigt in jedes Unterverzeichnis ab. Was dort liegt und zufällig auf das Muster passt, ist ebenfalls weg.
  - **`rm -rf` mit Variablen:** immer `"${VAR:?}"` und erst mit `ls` oder `echo` testen, was getroffen würde.

  > [!WARNING] Erst anschauen, dann löschen
  > Ersetze vor jedem `rm` mit Mustern das `rm` durch `ls` oder `echo` und sieh dir an, was die Shell daraus macht. Bei `find` lässt du `-delete` beim ersten Lauf weg. Diese zehn Sekunden sind billiger als jedes Backup-Restore.

  ## Zusammenfassung

  - Ein Baum ab `/`, weitere Dateisysteme werden eingehängt. Geräte, Prozesse und Kernel-Werte erreichst du über Pfade in `/dev`, `/proc` und `/sys`.
  - `/etc` konfiguriert, `/usr` ist statisch, `/var` wächst, `/tmp` ist flüchtig.
  - Absolute Pfade beginnen mit `/`; `.`, `..`, `~` und `cd -` sparen Tipparbeit.
  - `cp -a` für Backups, `mkdir -p` für Verzeichnisbäume, `rm` hat keinen Papierkorb. Variablen in `rm` immer als `"${VAR:?}"`.
  - Glob-Muster (`*`, `?`, `[…]`) und Brace Expansion (`{a,b}`) löst die Shell vor dem Befehl auf. Muster für `find` quotest du.
  - Ein Name zeigt auf einen Inode. Hardlinks sind weitere Namen, Symlinks eigene Dateien mit einem Pfad als Inhalt. Speicher wird erst frei, wenn kein Name und kein offener Prozess mehr darauf zeigt. Einen Link auf ein Verzeichnis ersetzt du mit `ln -sfn`.
  - `find` kombiniert Tests mit UND; `-exec … {} +` bündelt Aufrufe, `-delete` gehört ans Ende und erst nach einem Probelauf.
exercises:
  - id: fhs-zuordnen
    type: choice
    title: Wo gehört das hin?
    prompt: Welche Aussagen über den Verzeichnisbaum stimmen?
    options:
      - text: Wenn ein Server vollläuft, ist der Übeltäter meistens unter `/var` zu finden, etwa in `/var/log` oder `/var/lib`.
        correct: true
        why: "`/var` enthält Daten, die im Betrieb wachsen: Logs, Datenbanken, Caches, Container-Images."
      - text: Eine selbst geschriebene Konfiguration für nginx legst du nach `/usr/share/nginx`, weil dort die Programmdateien liegen.
        correct: false
        why: "`/usr` gehört dem Paketmanager und wird bei Updates überschrieben. Systemweite Konfiguration gehört nach `/etc/nginx`."
      - text: "`/proc/cpuinfo` belegt keinen Platz auf der Festplatte; der Kernel erzeugt den Inhalt beim Lesen."
        correct: true
        why: "`/proc` ist ein virtuelles Dateisystem, eine Schnittstelle zum Kernel."
      - text: "Dateien in `/tmp` eignen sich für Daten, die einen Neustart überstehen müssen."
        correct: false
        why: "`/tmp` wird beim Booten geleert, auf Arch und CachyOS liegt es sogar im RAM. Dauerhafte Daten gehören nach `/var` oder ins Heimatverzeichnis."
    explanation: |
      Das FHS gibt jedem Verzeichnis einen Zweck: `/etc` für Konfiguration, `/usr` für statische Programmdateien, `/var` für wachsende Daten, `/tmp` für Flüchtiges. Wer das Modell kennt, findet sich auf jedem fremden Server zurecht und weiß, wo er bei einer vollen Platte zuerst sucht.
    resources:
      - title: hier(7)
        url: https://man7.org/linux/man-pages/man7/hier.7.html
      - title: FHS 3.0 · /var
        url: https://refspecs.linuxfoundation.org/FHS_3.0/fhs/ch05.html

  - id: cd-wanderung
    type: output
    title: Wo landest du?
    prompt: Was geben die `pwd`- und `cd -`-Aufrufe aus? (`cd -` gibt das Verzeichnis aus, in das es wechselt.)
    lang: bash
    code: |
      cd /usr/share
      cd ../bin
      pwd
      cd ../../etc
      pwd
      cd -
      cd ../../..
      pwd
    expected: |
      /usr/bin
      /etc
      /usr/bin
      /
    verify: true
    explanation: |
      `..` ist immer das übergeordnete Verzeichnis: von `/usr/share` nach `/usr`, dann in `bin`. Von `/usr/bin` zwei Ebenen hoch ist `/`, von dort nach `etc`. `cd -` springt zum vorigen Verzeichnis `/usr/bin` zurück. Von dort führen drei `..` über `/usr` nach `/` – und `..` von `/` bleibt `/`, höher geht es nicht.
    resources:
      - title: Bash Manual · cd
        url: https://www.gnu.org/software/bash/manual/html_node/Bourne-Shell-Builtins.html#index-cd

  - id: globbing-vorhersagen
    type: output
    title: Was macht die Shell aus dem Muster?
    prompt: Das Verzeichnis ist anfangs leer. Was gibt dieses bash-Snippet aus?
    lang: bash
    code: |
      touch api.log db.log db.log.1 k.txt m.txt notizen.md .env
      echo *.log
      echo ?.txt
      echo [dk]*
      echo *
      echo *.csv
      echo backup-{mo,di}.{tar,zip}
    expected: |
      api.log db.log
      k.txt m.txt
      db.log db.log.1 k.txt
      api.log db.log db.log.1 k.txt m.txt notizen.md
      *.csv
      backup-mo.tar backup-mo.zip backup-di.tar backup-di.zip
    verify: true
    explanation: |
      `*.log` braucht die Endung `.log` am Schluss, deshalb fehlt `db.log.1`. `?` steht für genau ein Zeichen, `[dk]*` für alles, was mit `d` oder `k` beginnt. `*` lässt die versteckte Datei `.env` aus. Findet ein Muster nichts, gibt bash es unverändert weiter. Brace Expansion schaut dagegen gar nicht ins Verzeichnis: Sie bildet alle Kombinationen, von links nach rechts.
    resources:
      - title: Bash Manual · Filename Expansion
        url: https://www.gnu.org/software/bash/manual/html_node/Filename-Expansion.html
      - title: Bash Manual · Brace Expansion
        url: https://www.gnu.org/software/bash/manual/html_node/Brace-Expansion.html

  - id: hardlink-symlink
    type: output
    title: Zwei Arten von Verweisen
    prompt: |
      Was gibt dieses Snippet aus? `2>/dev/null || echo …` bedeutet: Fehlermeldung verwerfen und stattdessen den Text ausgeben, falls `cat` scheitert. `stat -c '%h'` gibt den Link-Zähler aus.
    lang: bash
    code: |
      echo "v1" > config.yaml
      ln config.yaml hart.yaml
      ln -s config.yaml weich.yaml
      echo "v2" > config.yaml
      cat hart.yaml weich.yaml
      rm config.yaml
      cat hart.yaml
      cat weich.yaml 2>/dev/null || echo "weich.yaml: ins Leere"
      stat -c '%h' hart.yaml
    expected: |
      v2
      v2
      v2
      weich.yaml: ins Leere
      1
    verify: true
    explanation: |
      `hart.yaml` ist ein zweiter Name für denselben Inode; `>` überschreibt den Inhalt dieses Inodes, also sehen beide Namen `v2`. Der Symlink enthält nur den Pfad `config.yaml` und folgt ihm. Nach `rm config.yaml` existiert der Inode unter dem Namen `hart.yaml` weiter (Link-Zähler jetzt 1), der Symlink zeigt dagegen ins Leere. Achtung: Viele Editoren speichern, indem sie eine neue Datei schreiben und umbenennen – dann trennt sich ein Hardlink vom Original.
    resources:
      - title: inode(7)
        url: https://man7.org/linux/man-pages/man7/inode.7.html
      - title: symlink(7)
        url: https://man7.org/linux/man-pages/man7/symlink.7.html

  - id: projektgeruest
    type: command
    title: Ein Projektgerüst mit einem Befehl
    context: Du bist in `~/projekte`. Das Verzeichnis `shop` gibt es noch nicht.
    prompt: Lege mit **einem** Befehl die Verzeichnisse `shop/src`, `shop/tests` und `shop/docs` an. Nutze Brace Expansion.
    answers:
      - mkdir -p shop/{src,tests,docs}
      - mkdir -p shop/{src,docs,tests}
      - mkdir -p shop/{tests,src,docs}
      - mkdir -p shop/{tests,docs,src}
      - mkdir -p shop/{docs,src,tests}
      - mkdir -p shop/{docs,tests,src}
      - mkdir --parents shop/{src,tests,docs}
    explanation: |
      Die Shell macht aus `shop/{src,tests,docs}` drei Argumente: `shop/src shop/tests shop/docs`. `-p` ist nötig, weil `shop` noch fehlt; ohne `-p` bricht `mkdir` mit `No such file or directory` ab. Zusätzlich meldet `-p` keinen Fehler, wenn ein Verzeichnis schon existiert – praktisch in Skripten, die mehrfach laufen.
    resources:
      - title: GNU Coreutils · mkdir
        url: https://www.gnu.org/software/coreutils/manual/html_node/mkdir-invocation.html

  - id: backup-cp-a
    type: command
    title: Backup vor der Änderung
    prompt: |
      Bevor du die nginx-Konfiguration umbaust, willst du das komplette Verzeichnis `/etc/nginx` nach `~/nginx-backup` kopieren – mit Rechten, Zeitstempeln und Symlinks, so wie sie sind. `~/nginx-backup` existiert noch nicht.
    answers:
      - cp -a /etc/nginx ~/nginx-backup
      - cp -a /etc/nginx/ ~/nginx-backup
      - cp -a /etc/nginx $HOME/nginx-backup
      - cp -a /etc/nginx "$HOME/nginx-backup"
      - cp --archive /etc/nginx ~/nginx-backup
    explanation: |
      `cp -a` (Archivmodus) entspricht `-dR --preserve=all`: rekursiv, Symlinks bleiben Symlinks, Rechte, Zeitstempel und – als root – auch Besitzer bleiben erhalten. Mit `cp -r` hätten alle Kopien die aktuelle Uhrzeit, und du könntest später nicht mehr sehen, welche Datei wann geändert wurde. Weil `~/nginx-backup` noch nicht existiert, wird es zur Kopie von `/etc/nginx`; bei einem zweiten Aufruf entstünde `~/nginx-backup/nginx`.
    resources:
      - title: GNU Coreutils · cp
        url: https://www.gnu.org/software/coreutils/manual/html_node/cp-invocation.html

  - id: find-alte-archive
    type: command
    title: Alte Log-Archive finden
    prompt: |
      Die Platte ist voll. Liste unter `/var/log` alle **regulären Dateien** mit der Endung `.gz` auf, die vor mehr als **30** Tagen geändert wurden. Nur anzeigen, noch nichts löschen.
    answers:
      - find /var/log -type f -name '*.gz' -mtime +30
      - find /var/log -type f -mtime +30 -name '*.gz'
      - find /var/log -name '*.gz' -type f -mtime +30
      - find /var/log -name '*.gz' -mtime +30 -type f
      - find /var/log -mtime +30 -type f -name '*.gz'
      - find /var/log -mtime +30 -name '*.gz' -type f
      - find /var/log -type f -name '*.gz' -mtime +30 -print
    output: |
      /var/log/nginx/access.log.12.gz
      /var/log/nginx/error.log.9.gz
    explanation: |
      Die Tests werden mit UND verknüpft, ihre Reihenfolge ist hier egal. Das Muster `'*.gz'` muss gequotet sein, sonst löst die Shell es vorher im aktuellen Verzeichnis auf. `-mtime +30` heißt „vor mehr als 30 vollen Tagen geändert“. `-type f` schließt Verzeichnisse und Symlinks aus. Im nächsten Schritt würdest du `-delete` ans Ende hängen – erst nachdem du die Liste geprüft hast.
    resources:
      - title: find(1)
        url: https://man7.org/linux/man-pages/man1/find.1.html

  - id: find-exec-plus
    type: command
    title: Die dicken Brocken
    prompt: |
      Zeige alle regulären Dateien unter `~/Downloads`, die größer als 500 MiB sind, im Format von `ls -lh` an. `ls` soll dabei so selten wie möglich gestartet werden.
    answers:
      - find ~/Downloads -type f -size +500M -exec ls -lh {} +
      - find ~/Downloads -size +500M -type f -exec ls -lh {} +
      - find $HOME/Downloads -type f -size +500M -exec ls -lh {} +
      - find "$HOME/Downloads" -type f -size +500M -exec ls -lh {} +
      - find ~/Downloads -type f -size +500M -exec ls -lh '{}' +
    output: |
      -rw-r--r-- 1 steven steven 5.8G Sep 12 21:04 /home/steven/Downloads/ubuntu-24.04.iso
      -rw-r--r-- 1 steven steven 812M Aug 30 17:45 /home/steven/Downloads/kurs-aufzeichnung.mp4
    explanation: |
      `-size +500M` trifft Dateien über 500 MiB. `-exec ls -lh {} +` sammelt die Treffer und ruft `ls` einmal mit allen Namen auf; mit `\;` statt `+` liefe `ls` für jede Datei einzeln. Beides zeigt dasselbe, aber bei tausenden Treffern ist `+` um Größenordnungen schneller. Alternative ohne `-exec`: `find … -size +500M -print0 | xargs -0 ls -lh` – mehr dazu im Modul zur Textverarbeitung.
    resources:
      - title: GNU Findutils · Multiple Files
        url: https://www.gnu.org/software/findutils/manual/html_node/find_html/Multiple-Files.html

  - id: release-symlink
    type: gap
    title: Deploy per Symlink umschalten
    prompt: |
      Ein verbreitetes Deploy-Muster: Jede Version liegt in `releases/`, und der Symlink `current` zeigt auf die aktive. Ergänze die Optionen so, dass das Skript eine neue Version aus der alten erzeugt (mit Rechten und Zeitstempeln), fehlende Verzeichnisse ohne Fehler anlegt und `current` **ersetzt**, statt einen neuen Link *in* das alte Zielverzeichnis zu legen.
    lang: bash
    code: |
      cd /srv/shop
      mkdir ⟦-p⟧ releases/v43
      cp ⟦-a⟧ releases/v42/. releases/v43/
      ln ⟦-sfn⟧ releases/v43 current
      ls -l current
    gaps:
      - label: mkdir
        hint: Die Option legt fehlende Elternverzeichnisse an und schweigt, wenn es das Verzeichnis schon gibt.
        accept: ["--parents"]
      - label: cp
        hint: Der Archivmodus erhält Rechte, Zeitstempel und Symlinks.
        accept: ["--archive"]
      - label: ln
        hint: "Du brauchst drei Buchstaben: symbolisch, vorhandenen Link ersetzen, und einen Link auf ein Verzeichnis wie eine normale Datei behandeln."
        accept: ["-s -f -n", "--symbolic --force --no-dereference"]
    explanation: |
      `mkdir -p` scheitert nicht, wenn `releases/v43` schon existiert. `cp -a quelle/. ziel/` kopiert den *Inhalt* von `v42` samt versteckter Dateien. Bei `ln` ist `-n` die Falle: Zeigt `current` schon auf ein Verzeichnis, behandelt `ln -sf` es als Zielverzeichnis und legt `releases/v42/v43` an – `current` bleibt unverändert. `-n` sorgt dafür, dass der vorhandene Link selbst ersetzt wird. So kannst du mit einem Befehl zurückrollen: `ln -sfn releases/v42 current`.
    resources:
      - title: GNU Coreutils · ln
        url: https://www.gnu.org/software/coreutils/manual/html_node/ln-invocation.html

  - id: cleanup-rm-rf
    type: bug
    title: Das Aufräumskript löscht zu viel
    prompt: |
      Ein Kollege hat `./cleanup.sh` versehentlich **ohne Argument** gestartet. Die Ausgabe war voller Meldungen wie `rm: cannot remove '/boot/…': Permission denied` – das Skript hat versucht, `/` zu leeren. Außerdem löscht es bei `./cleanup.sh "Mein Projekt/build"` die falschen Verzeichnisse. Finde die Zeile und korrigiere sie so, dass das Skript bei leerer Variable abbricht und Leerzeichen im Pfad korrekt behandelt.
    lang: bash
    code: |
      #!/usr/bin/env bash
      # cleanup.sh – leert das übergebene Build-Verzeichnis
      BUILD_DIR=$1
      rm -rf $BUILD_DIR/*
      echo "Aufgeräumt: $BUILD_DIR"
    lines: [4]
    fix:
      - line: 4
        answers:
          - rm -rf -- "${BUILD_DIR:?}"/*
          - rm -rf "${BUILD_DIR:?}"/*
          - rm -rf -- "${BUILD_DIR:?Kein Verzeichnis angegeben}"/*
          - rm -rf "${BUILD_DIR:?Kein Verzeichnis angegeben}"/*
    hints:
      - Was macht die Shell aus `$BUILD_DIR/*`, wenn die Variable leer ist?
      - Es gibt eine Parameter-Expansion, die mit Fehler abbricht, wenn eine Variable leer ist.
    explanation: |
      Ist `BUILD_DIR` leer, wird aus `$BUILD_DIR/*` das Muster `/*` – `rm -rf` bekommt alle Verzeichnisse unter `/`. Unquotiert zerlegt die Shell außerdem `Mein Projekt/build/*` in `Mein` und `Projekt/build/*`. `"${BUILD_DIR:?}"` löst beides: Die Anführungszeichen halten den Pfad zusammen, und `:?` beendet das Skript mit Fehlermeldung, wenn die Variable leer oder nicht gesetzt ist. Das `*` steht außerhalb der Anführungszeichen, damit die Shell es weiterhin auflöst. Genauso gut wäre ein Abbruch schon in Zeile 3 mit `BUILD_DIR=${1:?Verzeichnis fehlt}`.
    resources:
      - title: Bash Manual · Shell Parameter Expansion
        url: https://www.gnu.org/software/bash/manual/html_node/Shell-Parameter-Expansion.html
      - title: Steam for Linux · Issue 3671
        url: https://github.com/ValveSoftware/steam-for-linux/issues/3671

  - id: offene-datei-geloescht
    type: choice
    title: Gelöscht, aber nicht frei
    prompt: |
      `/var` ist voll. Du löschst `/var/log/app/debug.log` (18 GB) mit `rm`. Der Befehl meldet keinen Fehler, aber `df -h /var` zeigt weiterhin 100 % belegt. Was ist die wahrscheinlichste Erklärung?
    options:
      - text: Die Anwendung hat die Datei noch geöffnet; der Inode wird erst freigegeben, wenn sie ihn schließt.
        correct: true
        why: "`rm` entfernt nur den Namen. Solange ein Prozess die Datei geöffnet hat, bleiben Inode und Daten bestehen."
      - text: "`rm` hat die Datei in einen Papierkorb unter `/var/tmp` verschoben."
        correct: false
        why: "`rm` kennt keinen Papierkorb. Das tun nur grafische Dateimanager."
      - text: Es existiert noch ein Symlink auf die Datei, der den Speicher festhält.
        correct: false
        why: Ein Symlink enthält nur einen Pfad und hält keinen Inode am Leben. Ein zweiter *Hardlink* würde das tun.
      - text: "`df` aktualisiert seine Werte nur einmal pro Stunde."
        correct: false
        why: "`df` fragt den aktuellen Zustand direkt beim Kernel ab."
    explanation: |
      Speicher wird frei, wenn der Link-Zähler eines Inodes 0 ist **und** kein Prozess die Datei mehr geöffnet hat. Ein Dienst, der weiter in sein Log schreibt, hält die Daten fest. Lösung: Dienst neu starten oder die Datei vorher mit `truncate -s 0` leeren. `lsof +L1` zeigt gelöschte, aber noch geöffnete Dateien.
    resources:
      - title: unlink(2)
        url: https://man7.org/linux/man-pages/man2/unlink.2.html

  - id: find-erklaeren
    type: explain
    title: Ein Cronjob räumt auf
    prompt: Dieser Befehl läuft nachts als Cronjob. Erkläre Teil für Teil, was er tut, und warum die Muster gequotet und die Aktion so gewählt sind.
    lang: bash
    code: |
      find /srv/shop/logs -type f -name '*.log' -size +100M -mtime +7 -exec gzip {} +
    points:
      - Er durchsucht `/srv/shop/logs` rekursiv und berücksichtigt nur reguläre Dateien.
      - Alle Tests müssen zutreffen – Endung `.log`, größer als 100 MiB, vor mehr als 7 vollen Tagen zuletzt geändert.
      - "`'*.log'` ist gequotet, damit `find` das Muster auswertet und nicht vorher die Shell."
      - "`-exec gzip {} +` komprimiert alle Treffer mit möglichst wenigen `gzip`-Aufrufen; `gzip` ersetzt jede Datei durch `datei.log.gz`."
      - Durch die neue Endung `.gz` trifft das Muster beim nächsten Lauf dieselben Dateien nicht noch einmal.
    explanation: |
      `find` startet in `/srv/shop/logs` und prüft jede Datei. `-type f` beschränkt auf reguläre Dateien, `-name '*.log'` auf die Endung – gequotet, damit `find` das Muster bekommt und nicht die Shell es im aktuellen Verzeichnis des Cronjobs auflöst. `-size +100M` und `-mtime +7` filtern große Dateien, deren Inhalt seit mehr als 7 vollen Tagen unverändert ist; alle Tests sind mit UND verknüpft. `-exec gzip {} +` übergibt die Treffer gesammelt an `gzip`, das jede Datei durch eine komprimierte `.gz`-Version ersetzt. Weil die Endung dann nicht mehr passt, ist der Job idempotent: Ein zweiter Lauf fasst dieselben Dateien nicht an. In der Praxis würde man dafür `logrotate` einsetzen.
    resources:
      - title: find(1)
        url: https://man7.org/linux/man-pages/man1/find.1.html

  - id: backup-platte-voll
    type: scenario
    title: Das Backup heute Nacht passt nicht mehr
    prompt: |
      Das Monitoring meldet: „`/srv/backup` auf `web01` fast voll“. Heute Nacht um 02:15 schreibt der Backup-Job das nächste Archiv der Shop-Datenbank, rund 8 MB. Passt es nicht, bricht der Job ab, und es gibt für diesen Tag kein Backup.

      Räume `/srv/backup` nach der Aufbewahrungsregel des Teams auf; sie steht in `/srv/backup/LIESMICH.txt`. Tagesarchive, die älter als 14 Tage sind, dürfen weg. Alles andere bleibt: die jüngeren Tagesarchive, die Monatsarchive und die übrigen Dateien. Du bist als `ops` angemeldet und hast `sudo`.
    setup: |
      set -e
      truncate -s 32M /var/lib/backup-platte.img
      mkfs.ext4 -q -m 0 -L backup /var/lib/backup-platte.img
      mkdir -p /srv/backup
      mount -o loop /var/lib/backup-platte.img /srv/backup
      cd /srv/backup
      # Tagesarchive der letzten 30 Tage, jeweils um 02:15 geschrieben
      base=$(date -d 'today 02:15' +%s)
      [ "$base" -le "$(date +%s)" ] || base=$((base - 86400))
      : > /root/.backup-neu; : > /root/.backup-alt
      for i in $(seq 0 29); do
        t=$((base - i * 86400))
        printf -v f 'shop-db-%(%F)T.sql.gz' "$t"
        fallocate -l 720K "$f"
        touch -d "@$t" "$f"
        if [ "$i" -le 12 ]; then echo "$f" >> /root/.backup-neu; elif [ "$i" -ge 16 ]; then echo "$f" >> /root/.backup-alt; fi
      done
      mkdir monatlich
      for n in 1 2; do
        m=$(date -d "$(date +%Y-%m-15) -$n month" +%Y-%m)
        fallocate -l 600K "monatlich/shop-db-$m.sql.gz"
        touch -d "$m-01 02:15" "monatlich/shop-db-$m.sql.gz"
        echo "monatlich/shop-db-$m.sql.gz" >> /root/.backup-rest
      done
      cat > LIESMICH.txt <<'EOF'
      Backups der Shop-Datenbank auf web01
      Tagesarchive:  /srv/backup/shop-db-JJJJ-MM-TT.sql.gz, schreibt der Backup-Job täglich um 02:15
                     Aufbewahrung 14 Tage
      Monatsarchive: /srv/backup/monatlich/, Aufbewahrung 12 Monate, nicht von Hand löschen
      Wiederherstellen: siehe restore.sh
      EOF
      printf '#!/bin/sh\n# Spielt ein Archiv in die Shop-Datenbank zurück: restore.sh DATEI\nset -eu\necho "Wiederherstellen aus $1"\n' > restore.sh
      chmod 755 restore.sh
      touch -d '200 days ago' LIESMICH.txt
      touch -d '150 days ago' restore.sh
      printf '%s\n' LIESMICH.txt restore.sh >> /root/.backup-rest
    checks:
      - name: Auf /srv/backup sind mindestens 8 MB frei
        run: |
          mountpoint -q /srv/backup || { echo "/srv/backup ist nicht mehr eingehängt"; exit 1; }
          frei=$(df -BM --output=avail /srv/backup | tail -1 | tr -dc 0-9)
          echo "frei: $frei MB"
          [ "$frei" -ge 8 ]
      - name: Die Tagesarchive der letzten 13 Tage sind alle noch da
        run: |
          fehlt=0
          while read -r f; do [ -f "/srv/backup/$f" ] || { echo "fehlt: $f"; fehlt=1; }; done < /root/.backup-neu
          exit $fehlt
      - name: Monatsarchive, LIESMICH.txt und restore.sh sind unangetastet
        run: |
          fehlt=0
          while read -r f; do [ -f "/srv/backup/$f" ] || { echo "fehlt: $f"; fehlt=1; }; done < /root/.backup-rest
          exit $fehlt
      - name: Kein Tagesarchiv, das älter als 15 Tage ist, liegt noch auf der Platte
        run: |
          n=0
          while read -r f; do [ -e "/srv/backup/$f" ] && n=$((n + 1)); done < /root/.backup-alt
          echo "noch da: $n alte Tagesarchive"
          [ "$n" -eq 0 ]
    solution: |
      df -h /srv/backup
      cat /srv/backup/LIESMICH.txt
      # Die ältesten Dateien zuletzt; dazu das Unterverzeichnis mit den Monatsarchiven
      ls -lt /srv/backup | tail -n 5
      ls -l /srv/backup/monatlich
      # Probelauf: nur Tagesarchive direkt in /srv/backup (-maxdepth 1 lässt monatlich/ aus),
      # nur reguläre Dateien mit dem Namensmuster, älter als 14 volle Tage
      find /srv/backup -maxdepth 1 -type f -name 'shop-db-*.sql.gz' -mtime +14 | sort
      find /srv/backup -maxdepth 1 -type f -name 'shop-db-*.sql.gz' -mtime +14 | wc -l
      # Liste stimmt: dieselbe Zeile mit -delete am Ende, als root, denn die Archive gehören root
      sudo find /srv/backup -maxdepth 1 -type f -name 'shop-db-*.sql.gz' -mtime +14 -delete
      df -h /srv/backup
    hints:
      - "Verschaff dir erst einen Überblick: `df -h /srv/backup`, `cat /srv/backup/LIESMICH.txt` und `ls -lt /srv/backup`. Gibt es Unterverzeichnisse?"
      - "`find` mit `-name 'shop-db-*.sql.gz'` und `-mtime +14` findet die alten Tagesarchive – aber auch in Unterverzeichnissen. Lass den Befehl zuerst ohne Aktion laufen und lies die Liste."
      - "`-maxdepth 1` hält `find` aus `monatlich/` heraus. Erst wenn die Liste stimmt, hängst du `-delete` ans Ende; die Dateien gehören root, also mit `sudo`."
    explanation: |
      Die Regel steckt in drei Tests: `-name 'shop-db-*.sql.gz'` lässt `LIESMICH.txt` und `restore.sh` stehen, obwohl sie Monate alt sind. `-mtime +14` trifft nur Dateien, die mehr als 14 volle Tage alt sind. Und `-maxdepth 1` schützt die Monatsarchive, deren Namen ebenfalls auf das Muster passen, weil `find` sonst in `monatlich/` absteigt. Der Probelauf ohne `-delete` zeigt genau die Liste, die danach gelöscht wird; `-delete` gehört ans Ende, weil `find` den Ausdruck von links nach rechts auswertet.

      `df` misst das Dateisystem, nicht das Verzeichnis: Nach dem Löschen ist der Platz sofort frei, weil kein Prozess die Archive offen hält. Im Betrieb übernimmt so eine Regel ein Timer oder die Backup-Software selbst; von Hand gilt immer: erst anschauen, dann löschen.
    resources:
      - title: find(1)
        url: https://man7.org/linux/man-pages/man1/find.1.html
      - title: df(1)
        url: https://man7.org/linux/man-pages/man1/df.1.html

  - id: release-umschalten
    type: scenario
    title: Umgeschaltet, aber die Seite bleibt alt
    prompt: |
      Gestern sollte Release `2026-10-01` des Shops auf `web01` live gehen. nginx liefert `/srv/shop/current/public` aus, und `current` ist ein Symlink auf das aktive Release in `/srv/shop/releases/`. Ben hat wie immer umgeschaltet:

      ```text
      $ cd /srv/shop && ln -sf releases/2026-10-01 current
      ```

      Keine Fehlermeldung – aber `curl http://localhost/version.txt` liefert weiterhin `2026-09-24`.

      Schalte auf `2026-10-01` um. `current` bleibt ein Symlink, und die älteren Releases bleiben für ein Rollback genau so liegen, wie sie ausgeliefert wurden. `/srv/shop` gehört dir (`ops`).
    setup: |
      set -e
      mkdir -p /srv/shop
      mount -t tmpfs -o size=8m,mode=755,uid=1000,gid=1000 shop /srv/shop
      cd /srv/shop
      for r in 2026-09-17 2026-09-24 2026-10-01; do
        mkdir -p "releases/$r/public"
        echo "$r" > "releases/$r/public/version.txt"
        printf '<!doctype html>\n<title>Shop</title>\n<h1>Shop</h1>\n<p>Release %s</p>\n' "$r" > "releases/$r/public/index.html"
        touch -d "$r 10:00" "releases/$r/public/version.txt" "releases/$r/public/index.html" "releases/$r/public" "releases/$r"
      done
      ln -s releases/2026-09-24 current
      # Bens Versuch von gestern
      ln -sf releases/2026-10-01 current
      chown -R ops:ops /srv/shop
      cat > /etc/nginx/sites-available/shop <<'EOF'
      server {
          listen 80 default_server;
          root /srv/shop/current/public;
          index index.html;
      }
      EOF
      rm -f /etc/nginx/sites-enabled/default
      ln -s /etc/nginx/sites-available/shop /etc/nginx/sites-enabled/shop
      systemctl start nginx
    checks:
      - name: http://localhost/version.txt liefert 2026-10-01
        run: |
          v=$(curl -fsS --max-time 5 http://localhost/version.txt 2>&1)
          echo "ausgeliefert: $v"
          [ "$v" = 2026-10-01 ]
      - name: /srv/shop/current ist ein Symlink auf releases/2026-10-01
        run: |
          [ -L /srv/shop/current ] || { echo "current ist kein Symlink"; exit 1; }
          z=$(readlink -f /srv/shop/current)
          echo "current zeigt auf $z"
          [ "$z" = /srv/shop/releases/2026-10-01 ]
      - name: Die älteren Releases sind vollständig und unverändert, ein Rollback ist möglich
        run: |
          for r in 2026-09-17 2026-09-24; do
            d=/srv/shop/releases/$r
            inhalt=$(ls -A "$d" 2>/dev/null | tr '\n' ' ')
            [ "$inhalt" = "public " ] || { echo "releases/$r enthält: $inhalt"; exit 1; }
            [ "$(cat "$d/public/version.txt")" = "$r" ] || { echo "releases/$r/public/version.txt ist verändert"; exit 1; }
          done
          [ -f /srv/shop/releases/2026-10-01/public/version.txt ]
    solution: |
      curl -s http://localhost/version.txt
      # Wohin zeigt current?
      ls -l /srv/shop
      readlink /srv/shop/current
      # current zeigt auf ein Verzeichnis. ln -sf ist dem Link gefolgt und hat den neuen Link
      # im alten Release angelegt – relativ und deshalb ins Leere:
      ls -l /srv/shop/releases/2026-09-24
      rm /srv/shop/releases/2026-09-24/2026-10-01
      # -n behandelt den vorhandenen Link current als Datei und ersetzt ihn
      cd /srv/shop
      ln -sfn releases/2026-10-01 current
      ls -l current
      curl -s http://localhost/version.txt
    hints:
      - "Wohin zeigt `current` gerade? `ls -l /srv/shop` und `readlink /srv/shop/current` verraten es."
      - "Ist das letzte Argument von `ln` ein Verzeichnis – oder ein Link auf eins –, legt `ln` den neuen Link *darin* an. Schau in `/srv/shop/releases/2026-09-24` nach, was Bens Befehl dort hinterlassen hat."
      - "Räume Bens Link im alten Release weg und setze `current` neu: `ln -sfn` (oder `ln -sfT`) behandelt den vorhandenen Link selbst als das, was ersetzt wird."
    explanation: |
      `ln -sf ZIEL current` prüft zuerst, ob `current` ein Verzeichnis ist – und folgt dabei dem Symlink. Weil `current` auf `releases/2026-09-24` zeigte, hat `ln` dort einen neuen Link `2026-10-01` angelegt und `current` nicht angefasst. Dieser Link zeigt zudem ins Leere, weil sein relatives Ziel vom Ort des Links aus gelesen wird. `-n` (`--no-dereference`) behandelt einen Link auf ein Verzeichnis wie eine normale Datei, `-f` ersetzt ihn. GNU `ln` legt den neuen Link dabei unter einem Zufallsnamen an und benennt ihn per `rename(2)` um, deshalb gibt es keinen Moment ohne `current`.

      nginx löst den Pfad bei jeder Anfrage neu auf; nach dem Umschalten kommt sofort das neue Release, ohne Neustart. Ein Rollback ist derselbe Befehl mit dem alten Release – vorausgesetzt, es liegt unverändert da.
    resources:
      - title: GNU Coreutils · ln invocation
        url: https://www.gnu.org/software/coreutils/manual/html_node/ln-invocation.html
      - title: symlink(7)
        url: https://man7.org/linux/man-pages/man7/symlink.7.html

  - id: platz-schaffen
    type: practice
    title: Aufräumen auf deinem Rechner
    prompt: |
      Arbeite auf deinem CachyOS in einer bash-Sitzung und nur in deinem Heimatverzeichnis.

      1. Finde heraus, welche Unterverzeichnisse deines Heimatverzeichnisses am meisten Platz belegen.
      2. Liste alle Dateien über 200 MiB in deinem Heimatverzeichnis mit Größe auf.
      3. Finde alle Dateien in `~/Downloads`, die älter als 90 Tage sind, und verschiebe sie nach `~/Downloads/archiv` – ohne etwas zu löschen.
      4. Lege dir unter `~/projekte/uebung` ein Gerüst mit `src`, `tests` und `docs` an und erzeuge darin einen Symlink `aktuell`, der auf `src` zeigt. Prüfe mit `ls -l` und `readlink -f`.
      5. Erzeuge einen Hardlink auf eine Datei und beweise mit `ls -li`, dass beide Namen auf denselben Inode zeigen.
    lang: bash
    solution: |
      du -h --max-depth=1 ~ | sort -h | tail -10
      find ~ -type f -size +200M -exec ls -lh {} +

      mkdir -p ~/Downloads/archiv
      find ~/Downloads -maxdepth 1 -type f -mtime +90            # erst anschauen
      find ~/Downloads -maxdepth 1 -type f -mtime +90 -exec mv -n -t ~/Downloads/archiv {} +

      mkdir -p ~/projekte/uebung/{src,tests,docs}
      cd ~/projekte/uebung
      ln -s src aktuell
      ls -l aktuell
      readlink -f aktuell

      echo "hallo" > src/notiz.txt
      ln src/notiz.txt docs/notiz-hart.txt
      ls -li src/notiz.txt docs/notiz-hart.txt
    checklist:
      - Du hast die größten Verzeichnisse mit `du` gefunden und nach Größe sortiert.
      - "`find` mit `-size` und `-exec … {} +` hat dir die großen Dateien angezeigt."
      - Du hast den `find`-Befehl zuerst ohne Aktion laufen lassen und erst danach verschoben.
      - "`-maxdepth 1` verhindert, dass `find` in `~/Downloads/archiv` selbst sucht."
      - Der Symlink `aktuell` zeigt relativ auf `src`, und `readlink -f` liefert den absoluten Pfad.
      - "`ls -li` zeigt für beide Hardlink-Namen dieselbe Inode-Nummer und den Link-Zähler 2."
    explanation: |
      Die Aufgabe übt den Ablauf aus dem Betrieb: erst messen (`du`), dann gezielt suchen (`find` mit Tests), dann handeln – und zwar erst nach einem Probelauf. `mv -t ziel` erlaubt es, das Ziel vor die Dateien zu stellen, damit `{} +` am Ende stehen kann; `-n` verhindert, dass gleichnamige Dateien überschrieben werden. Der relative Symlink `aktuell -> src` funktioniert, weil sein Ziel vom Ort des Links aus aufgelöst wird.
    resources:
      - title: GNU Coreutils · du
        url: https://www.gnu.org/software/coreutils/manual/html_node/du-invocation.html
      - title: GNU Coreutils · mv
        url: https://www.gnu.org/software/coreutils/manual/html_node/mv-invocation.html
