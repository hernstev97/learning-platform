      Datei /srv/archive/bericht.txt
    explanation: Die Datei wird über den Mountpunkt erreicht; ihre Daten liegen im Dateisystem auf der Partition. Jede Schicht muss vor einem Eingriff korrekt identifiziert werden.
  - id: backup-grenze
    type: choice
    title: Was schützt vor einem verlorenen Datenträger?
    prompt: Welche Maßnahme erfüllt diese Anforderung für sich genommen?
    options:
      - text: Eine überprüfte wiederherstellbare Kopie auf einem unabhängigen Datenträger
        correct: true
        why: Sie bleibt beim Verlust des ursprünglichen Datenträgers verfügbar.
      - text: Ein zusätzlicher Btrfs-Snapshot auf derselben SSD
        correct: false
        why: Snapshot und Original hängen von derselben Hardware ab.
      - text: Ein zweiter Hardlink im selben Dateisystem
        correct: false
        why: Er ist nur ein weiterer Name für dieselben Dateidaten.
    explanation: Die Aufbewahrung muss außerhalb des betrachteten Ausfalls liegen. Versionen und Restore-Tests sind weitere Anforderungen, die danach geprüft werden müssen.
    resources:
      - title: Btrfs · Subvolumes
        url: https://btrfs.readthedocs.io/en/latest/btrfs-subvolume.html
  - id: lesefehler-zuerst
    type: choice
    title: Lesefehler im Kernel-Log
    prompt: |
      Auf einem Fileserver bricht seit gestern das nächtliche Backup ab. `sudo dmesg -T --level=err,warn` zeigt Dutzende solcher Blöcke. Was ist der richtige erste Schritt?
    lang: text
    code: |
      [Wed Sep 30 03:12:44 2026] ata3.00: failed command: READ FPDMA QUEUED
      [Wed Sep 30 03:12:44 2026] ata3.00: status: { DRDY ERR }
      [Wed Sep 30 03:12:44 2026] ata3.00: error: { UNC }
      [Wed Sep 30 03:12:44 2026] sd 2:0:0:0: [sdb] tag#7 Sense Key : Medium Error [current]
      [Wed Sep 30 03:12:44 2026] sd 2:0:0:0: [sdb] tag#7 Add. Sense: Unrecovered read error - auto reallocate failed
      [Wed Sep 30 03:12:44 2026] critical medium error, dev sdb, sector 81920 op 0x0:(READ) flags 0x0 phys_seg 1 prio class 2
      [Wed Sep 30 03:12:45 2026] EXT4-fs error (device sdb1): __ext4_find_entry:1683: inode #393217: comm rsync: reading directory lblock 0
    options:
      - text: Die noch lesbaren Daten auf ein anderes Medium sichern, dann mit `smartctl` den Zustand von `sdb` prüfen und den Tausch planen.
        correct: true
        why: Die Platte kann Sektoren nicht mehr lesen. Jede weitere Last kann mehr Sektoren kosten, deshalb kommt die Sicherung zuerst.
      - text: Sofort `sudo e2fsck -f -y /dev/sdb1` laufen lassen, damit das Dateisystem wieder konsistent ist.
        correct: false
        why: e2fsck repariert Strukturen des Dateisystems, keine defekten Sektoren. Auf einer ausfallenden Platte kann ein Reparaturlauf Einträge verwerfen, die sich noch retten ließen.
      - text: Den Server neu starten, danach sind die Meldungen verschwunden.
        correct: false
        why: Ein Neustart leert nur den Ringpuffer. Die defekten Sektoren bleiben, und beim Booten liest die fsck-Prüfung womöglich gleich wieder darauf.
      - text: Das SATA-Kabel tauschen, denn `ata3.00` meldet einen Fehler der Verbindung.
        correct: false
        why: "`UNC` und „Unrecovered read error“ heißen: Die Platte selbst kann den Sektor nicht lesen. Kabelprobleme zeigen sich als `ICRC`-Fehler, `SATA link down` und im SMART-Attribut 199."
    explanation: Die Kette reicht von der Platte (`UNC`, uncorrectable) über den Medienfehler im Block-Layer bis zum ext4-Fehler. Die Ursache ist Hardware, und sie wird mit jedem Zugriff schlimmer. Deshalb zuerst sichern, was noch lesbar ist, notfalls als Abbild mit `ddrescue`, und erst danach auf einer Kopie oder neuen Platte reparieren.
    resources:
      - title: dmesg(1)
        url: https://man7.org/linux/man-pages/man1/dmesg.1.html
  - id: dateilaenge
    type: output
    title: Logische Bytes zählen
    prompt: Welche Bytezahl gibt stat aus? Alle Zeichen sind ASCII.
    lang: bash
    code: |
      printf 'abc\n' > messung.txt
      stat -c '%s' messung.txt
    expected: '4'
    verify: true
    explanation: Drei Buchstaben und ein Zeilenumbruch ergeben vier Bytes. Zugeordnete Dateisystemblöcke können mehr Platz beanspruchen als diese logische Länge.
  - id: sparse-laenge
    type: output
    title: Eine große logische Datei
    prompt: Welche logische Größe wird ausgegeben? truncate erzeugt hier nur eine lokale Testdatei; wir fragen keine physische Belegung ab.
    lang: bash
    code: |
      truncate -s 1048576 image.test
      stat -c '%s' image.test
    expected: '1048576'
    verify: true
    explanation: Die angeforderte Länge ist genau 1 MiB. Daraus allein kann man nicht ableiten, wie viele physische Blöcke das Dateisystem zugeordnet hat.
    resources:
      - title: Coreutils · truncate
        url: https://www.gnu.org/software/coreutils/manual/html_node/truncate-invocation.html
  - id: mount-finden
    type: command
    title: Welcher Mount trägt das Log?
    prompt: Ermittle mit findmnt das Dateisystem für `/var/log/app.log`, auch wenn die Datei innerhalb eines Mounts liegt.
    answers: ["findmnt -T /var/log/app.log", "findmnt --target /var/log/app.log"]
    explanation: Die Zielabfrage löst den Pfad auf den zuständigen Mount auf. Erst dann ist klar, auf welchem Dateisystem du den Platzbedarf untersuchen musst.
    resources:
      - title: findmnt(8)
        url: https://man7.org/linux/man-pages/man8/findmnt.8.html
  - id: inode-pruefung
    type: command
    title: Platz frei, Anlegen trotzdem unmöglich
    prompt: Zeige mit df die Inode-Belegung des Dateisystems an, auf dem `/var` liegt.
    answers: ["df -i /var", "df --inodes /var"]
    explanation: Viele kleine Dateien können einen begrenzten Inode-Vorrat erschöpfen. Die normale Blockbelegung aus `df -h` beantwortet diese Frage nicht.
    resources:
      - title: Coreutils · df
        url: https://www.gnu.org/software/coreutils/manual/html_node/df-invocation.html
  - id: fstab-pruefen
    type: command
    title: Die Tabelle zuerst prüfen
    prompt: Prüfe mit findmnt ausführlich die Plausibilität der fstab, ohne mount -a auszuführen.
    answers: ["findmnt --verify --verbose"]
    explanation: Die Prüfung entdeckt viele Tabellen- und Pfadprobleme vor einem echten Mountversuch. Ein erfolgreicher Neustart und der tatsächliche Mount bleiben eigenständige Nachweise.
    resources:
      - title: findmnt(8)
        url: https://man7.org/linux/man-pages/man8/findmnt.8.html
  - id: falsche-ebene
    type: bug
    title: Ein Bericht zählt das externe Backup mit
    prompt: Du willst unter `/var` nur Verbrauch im selben Dateisystem summieren. Ein darunter gemountetes Backupvolume verfälscht die Ausgabe. Ergänze die passende GNU-du-Option.
    lang: bash
    code: |
      du -hd1 /var
    lines: [1]
    fix:
      - line: 1
        answers: ["du -xhd1 /var", "du -h -x -d 1 /var", "du -h --one-file-system --max-depth=1 /var"]
    explanation: |
      `-x` begrenzt den Verzeichnislauf auf ein Dateisystem. Das macht die Summe besser mit der Belegung dieses Mounts vergleichbar.
  - id: crypttab-name
    type: bug
    title: Das Volume ist offen, der Ordner leer
    prompt: |
      Nach dem Neustart bleibt `/srv/kunden` leer, obwohl `systemd-cryptsetup@kunden.service` aktiv ist. Etwa 90 Sekunden nach dem Start meldet das Journal `Timed out waiting for device dev-mapper-kundendaten.device - /dev/mapper/kundendaten.` Dienste und Monitoring erwarten den Mapping-Namen `kunden`. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: text
    code: |
      # /etc/crypttab
      kunden  UUID=3c1f6a2e-8d47-4b1e-9f0a-2b7c5d9e4a11  /etc/cryptsetup-keys.d/kunden.key  luks

      # /etc/fstab
      /dev/mapper/kundendaten  /srv/kunden  ext4  defaults,nofail  0  2
    lines: [5]
    fix:
      - line: 5
        answers: ["/dev/mapper/kunden  /srv/kunden  ext4  defaults,nofail  0  2"]
    explanation: |
      Das erste Feld der crypttab ist der Name des Mappings: systemd-cryptsetup öffnet das Volume als `/dev/mapper/kunden`. Die fstab wartet aber auf `/dev/mapper/kundendaten`, ein Gerät, das nie erscheint. Nach dem Standard-Timeout von 90 Sekunden gibt systemd auf; `nofail` verhindert nur, dass der Boot daran hängen bleibt. Quelle in der fstab und Name in der crypttab müssen übereinstimmen.
    resources:
      - title: crypttab(5)
        url: https://www.freedesktop.org/software/systemd/man/latest/crypttab.html
  - id: geloescht-offen
    type: explain
    title: Warum bleibt df voll?
    prompt: Erkläre diese Beobachtung und einen kontrollierten nächsten Schritt. Die Ausgabe ist ein vereinfachter Diagnoseausschnitt.
    lang: text
    code: |
      df: /var ist fast voll
      du: die größte Logdatei ist nicht mehr sichtbar
      lsof +L1: app 1234 ... /var/log/app.log (deleted)
    points:
      - Der Verzeichniseintrag wurde entfernt, der Prozess hält die Datei aber offen.
      - Die Blöcke bleiben bis zum letzten Schließen der Datei belegt.
      - du kann den entfernten Namen nicht mehr beim Verzeichnislauf finden.
      - Ein unterstütztes Log-Reopen oder geordneter Dienstneustart wird nach Prüfung geplant.
    explanation: Das Löschen des Namens beendet den offenen Dateideskriptor nicht. Erst ein kontrolliertes Schließen kann den Platz freigeben; weitere zufällige Löschungen lösen diese Ursache nicht.
    resources:
      - title: unlink(2)
        url: https://man7.org/linux/man-pages/man2/unlink.2.html
  - id: smart-lesen
    type: explain
    title: PASSED, aber …
    prompt: Ein Kollege meint, die Platte sei in Ordnung, schließlich stehe da `PASSED`. Erkläre ihm, was diese Ausgabe wirklich sagt und was als Nächstes passieren sollte.
    lang: text
    code: |
      $ sudo smartctl -H -A /dev/sdb
      SMART overall-health self-assessment test result: PASSED

      ID# ATTRIBUTE_NAME          FLAG     VALUE WORST THRESH TYPE      UPDATED  WHEN_FAILED RAW_VALUE
        5 Reallocated_Sector_Ct   0x0033   097   097   010    Pre-fail  Always       -       152
        9 Power_On_Hours          0x0032   061   061   000    Old_age   Always       -       34512
      187 Reported_Uncorrect      0x0032   093   093   000    Old_age   Always       -       7
      194 Temperature_Celsius     0x0022   035   049   000    Old_age   Always       -       35
      197 Current_Pending_Sector  0x0012   100   100   000    Old_age   Always       -       24
      198 Offline_Uncorrectable   0x0010   100   100   000    Old_age   Offline      -       24
      199 UDMA_CRC_Error_Count    0x003e   200   200   000    Old_age   Always       -       0
    points:
      - "`PASSED` heißt nur, dass kein normierter Wert (`VALUE`) auf seine Schwelle (`THRESH`) gefallen ist."
      - Die Rohwerte von 5, 187, 197 und 198 sind größer als 0, die Platte ersetzt Sektoren und kann weitere nicht lesen.
      - Attribut 199 ist 0, ein Kabel- oder Anschlussproblem ist deshalb unwahrscheinlich.
      - Nächster Schritt ist sichern und die Platte geplant tauschen, ohne auf `FAILED` zu warten.
    explanation: |
      Die Gesamtbewertung vergleicht nur die normierten Werte mit den Schwellen des Herstellers, und die liegen weit unten. Die Rohwerte erzählen etwas anderes: 152 Sektoren hat die Platte schon durch Reserve ersetzt (5), 24 kann sie gerade nicht lesen (197, 198), und 7 Mal hat sie unkorrigierbare Daten gemeldet (187). Diese vier Attribute sagen Ausfälle besser voraus als die Gesamtbewertung. Da 199 bei 0 steht, liegt es nicht am Kabel. Also: aktuelle Sicherung prüfen, Platte tauschen oder im RAID ersetzen, und `smartd` so einrichten, dass steigende Rohwerte gemeldet werden.
    resources:
      - title: smartctl(8)
        url: https://manpages.debian.org/bookworm/smartmontools/smartctl.8.en.html
      - title: smartmontools · FAQ
        url: https://www.smartmontools.org/wiki/FAQ
  - id: volume-voll
    type: scenario
    title: 95 Prozent und eine neue Platte
    prompt: |
      Das Monitoring von `web01` meldet: `/srv/data` ist zu 95 % belegt, die Uploads der Baustellen-App laufen in wenigen Stunden voll. Das Rechenzentrum hat dafür eine zweite 48-MiB-Platte angeschlossen (in dieser VM ein Loop-Device).

      Gib `/srv/data` den ganzen Platz der neuen Platte, ohne die vorhandenen Daten anzufassen. Das Dateisystem soll dabei eingehängt bleiben. Du bist als `ops` angemeldet und hast `sudo`.
    setup: |
      set -e
      export LVM_SUPPRESS_FD_WARNINGS=1
      mkdir -p /var/lib/vdisks /srv/data /root/.lab
      truncate -s 48M /var/lib/vdisks/disk1.img /var/lib/vdisks/disk2.img
      losetup /dev/loop0 /var/lib/vdisks/disk1.img
      pvcreate -q /dev/loop0
      vgcreate -q vgdata /dev/loop0
      lvcreate -q -l 100%FREE -n data vgdata
      mkfs.ext4 -q -L data /dev/vgdata/data
      mount /dev/vgdata/data /srv/data
      mkdir -p /srv/data/uploads/2026-08 /srv/data/uploads/2026-09 /srv/data/export
      for m in 08 09; do
        for n in 1 2 3; do fallocate -l 5M /srv/data/uploads/2026-$m/aufmass-$n.pdf; done
      done
      fallocate -l 1500K /srv/data/uploads/2026-09/baustelle-nord.jpg
      for i in $(seq 1 200); do printf 'A-%05d;2026-09-%02d;%d\n' $i $((i % 30 + 1)) $((i * 37 % 1000)); done > /srv/data/export/auftraege.csv
      printf 'Freigaben Q3: Nord ok, Süd offen\n' > /srv/data/export/freigaben.txt
      chown -R 1000:1000 /srv/data/uploads /srv/data/export
      cd /srv/data
      find . -path ./lost+found -prune -o -type f -printf '%s %p\n' | sort > /root/.lab/data.list
      sha256sum export/* > /root/.lab/data.sha256
      # Die neue, leere Platte
      losetup /dev/loop1 /var/lib/vdisks/disk2.img
    checks:
      - name: /srv/data ist weiter das Logical Volume vgdata/data
        run: |
          src=$(findmnt -no SOURCE /srv/data)
          echo "Eingehängt ist: ${src:-nichts}"
          [ "$src" = /dev/mapper/vgdata-data ]
      - name: vgdata/data nutzt beide Platten (mindestens 88 MiB)
        run: |
          mb=$(LVM_SUPPRESS_FD_WARNINGS=1 lvs --noheadings --nosuffix --units m -o lv_size vgdata/data | tr -d ' ')
          echo "vgdata/data ist ${mb:-?} MiB groß"
          [ "${mb%.*}" -ge 88 ]
      - name: Das Dateisystem füllt das ganze Logical Volume
        run: |
          bs=$(dumpe2fs -h /dev/vgdata/data 2>/dev/null | awk -F: '/^Block size/ {print $2 + 0}')
          bc=$(dumpe2fs -h /dev/vgdata/data 2>/dev/null | awk -F: '/^Block count/ {print $2 + 0}')
          fs=$((bs * bc / 1048576))
          lv=$(($(blockdev --getsize64 /dev/vgdata/data) / 1048576))
          echo "Dateisystem: $fs MiB, Logical Volume: $lv MiB"
          [ "$fs" -ge "$lv" ]
      - name: Alle Dateien unter /srv/data sind unverändert
        run: |
          cd /srv/data
          sha256sum --quiet -c /root/.lab/data.sha256 &&
            find . -path ./lost+found -prune -o -type f -printf '%s %p\n' | sort | diff /root/.lab/data.list -
    solution: |
      # Was ist voll, und worauf liegt es?
      df -hT /srv/data
      lsblk
      # Die Volume Group hat keinen Platz mehr (VFree 0), loop1 ist die neue Platte ohne Inhalt
      sudo pvs
      sudo vgs
      sudo lvs
      sudo blkid /dev/loop1 || echo "keine Signatur auf /dev/loop1"
      # Neue Platte als PV vorbereiten, in die VG aufnehmen, LV und ext4 in einem Schritt vergrößern
      sudo pvcreate /dev/loop1
      sudo vgextend vgdata /dev/loop1
      sudo lvextend -r -l +100%FREE vgdata/data
      df -h /srv/data
    hints:
      - "Worauf liegt `/srv/data`? `df -hT /srv/data` und `lsblk` zeigen das Gerät. Welche Platte hat noch keine Kinder und kein Dateisystem?"
      - "`sudo pvs`, `sudo vgs` und `sudo lvs`: Wie viel kann die Volume Group noch verteilen (`VFree`)? Eine neue Platte wird erst ein Physical Volume und dann Teil der VG."
      - "`pvcreate`, `vgextend`, dann `lvextend -l +100%FREE`. Und das Dateisystem? Entweder `-r` oder danach `resize2fs`."
    explanation: |
      Die Volume Group `vgdata` hatte kein freies Extent mehr (`VFree 0`), also führt der Weg über die neue Platte. `pvcreate` schreibt die LVM-Signatur, `vgextend` nimmt das PV in die VG auf, `lvextend -l +100%FREE` gibt dem LV alle freien Extents, und `-r` vergrößert ext4 anschließend online mit `resize2fs`. Ohne `-r` wäre das LV 88 MiB groß, `df` zeigte aber weiter 37M, weil das Dateisystem seine Größe beim Anlegen festgelegt hat.

      Keiner dieser Befehle verschiebt oder überschreibt belegte Extents, deshalb bleiben die Daten unberührt. Das LV liegt jetzt auf zwei Platten: Fällt eine aus, ist das ganze Dateisystem betroffen. Redundanz kommt von RAID, nicht von LVM.
    resources:
      - title: lvextend(8)
        url: https://man7.org/linux/man-pages/man8/lvextend.8.html
      - title: resize2fs(8)
        url: https://man7.org/linux/man-pages/man8/resize2fs.8.html
  - id: kundendaten-verschlossen
    type: scenario
    title: Die Kundendaten bleiben verschlossen
    prompt: |
      Nach dem Neustart von `web01` ist `/srv/kunden` leer. Die Kundendaten liegen auf einem LUKS-verschlüsselten Volume, das systemd beim Booten über `/etc/crypttab` mit dem Keyfile `/etc/cryptsetup-keys.d/kunden.key` öffnen soll. Ein Kollege hat das Keyfile gestern neu angelegt. Die Passphrase aus dem Passwortsafe lautet `Herbst-Kunden-2026`.

      Finde heraus, warum das Volume verschlossen bleibt. Sorge dafür, dass das Keyfile an seinem Platz das Volume öffnet und nur für root lesbar ist. Hänge `/srv/kunden` danach über `/dev/mapper/kunden` wieder ein, so wie es crypttab und fstab vorsehen. Das Volume liegt in dieser VM auf einem Loop-Device.
    setup: |
      set -e
      mkdir -p /var/lib/vdisks /srv/kunden /root/.lab/seed/vertraege
      cd /root/.lab/seed
      printf 'kunde_nr;name;ort\nK-001;Bäckerei Lindner;Kassel\nK-002;Autohaus Brandt;Fulda\nK-003;Praxis Dr. Öztürk;Marburg\n' > kundenliste.csv
      printf 'Rahmenvertrag K-002, Laufzeit bis 2027-06-30\n' > vertraege/K-002.txt
      sha256sum kundenliste.csv vertraege/K-002.txt > /root/.lab/kunden.sha256
      cd /
      truncate -s 32M /var/lib/vdisks/kunden.img
      printf '%s' 'Herbst-Kunden-2026' > /root/.lab/pw
      cryptsetup luksFormat -q --pbkdf pbkdf2 --pbkdf-force-iterations 1000 --key-file /root/.lab/pw /var/lib/vdisks/kunden.img
      cryptsetup open --key-file /root/.lab/pw /var/lib/vdisks/kunden.img aufbau
      mkfs.ext4 -q -L kunden -d /root/.lab/seed /dev/mapper/aufbau
      cryptsetup close aufbau
      rm -rf /root/.lab/pw /root/.lab/seed
      losetup /dev/loop0 /var/lib/vdisks/kunden.img
      # Das Keyfile, so wie der Kollege es angelegt hat
      mkdir -p /etc/cryptsetup-keys.d
      echo 'Herbst-Kunden-2026' > /etc/cryptsetup-keys.d/kunden.key
      chmod 644 /etc/cryptsetup-keys.d/kunden.key
      echo "kunden  UUID=$(cryptsetup luksUUID /dev/loop0)  /etc/cryptsetup-keys.d/kunden.key  luks,headless=true" >> /etc/crypttab
      echo '/dev/mapper/kunden  /srv/kunden  ext4  defaults,nofail  0  2' >> /etc/fstab
      systemctl daemon-reload
      # Wie beim Booten: systemd versucht, das Volume zu öffnen
      systemctl start systemd-cryptsetup@kunden.service 2>/dev/null || true
    checks:
      - name: Das Keyfile öffnet das Volume
        run: cryptsetup open --test-passphrase --key-file /etc/cryptsetup-keys.d/kunden.key /var/lib/vdisks/kunden.img
      - name: Nur root kann das Keyfile lesen
        run: |
          set -- $(stat -c '%U %a' /etc/cryptsetup-keys.d/kunden.key)
          echo "Besitzer $1, Rechte $2"
          [ "$1" = root ] && [ $((0$2 & 077)) -eq 0 ]
      - name: /srv/kunden ist über /dev/mapper/kunden eingehängt
        run: |
          src=$(findmnt -no SOURCE /srv/kunden)
          echo "Eingehängt ist: ${src:-nichts}"
          [ "$src" = /dev/mapper/kunden ]
      - name: Die Kundendaten sind lesbar und unverändert
        run: cd /srv/kunden && sha256sum -c /root/.lab/kunden.sha256
    solution: |
      # Das Volume ist zu: crypto_LUKS ohne Mapping darüber
      lsblk -f
      systemctl --failed --no-pager
      journalctl -b -u systemd-cryptsetup@kunden --no-pager
      # „Key data incorrect?“ Die Passphrase aus dem Safe passt (printf schreibt sie ohne Zeilenumbruch) ...
      printf '%s' 'Herbst-Kunden-2026' | sudo cryptsetup open --test-passphrase --key-file - /dev/loop0 && echo "Passphrase passt"
      # ... das Keyfile nicht. Am Ende steht ein \n, das echo angehängt hat.
      sudo od -c /etc/cryptsetup-keys.d/kunden.key
      printf '%s' 'Herbst-Kunden-2026' | sudo tee /etc/cryptsetup-keys.d/kunden.key > /dev/null
      sudo chmod 600 /etc/cryptsetup-keys.d/kunden.key
      # Denselben Weg nehmen wie der Boot: erst die crypttab-Unit, dann die fstab
      sudo systemctl start systemd-cryptsetup@kunden.service
      sudo mount /srv/kunden
      ls /srv/kunden
    hints:
      - "`systemctl --failed` zeigt, welche Unit beim Start gescheitert ist, `journalctl -b -u <unit>` die Begründung."
      - "Passt die Passphrase selbst? `sudo cryptsetup open --test-passphrase /dev/loop0` fragt sie ab, ohne etwas zu öffnen. Versuch dasselbe mit `--key-file`."
      - "Wie viele Zeichen hat die Passphrase, wie viele Bytes das Keyfile? `sudo od -c /etc/cryptsetup-keys.d/kunden.key` zeigt jedes Byte, auch unsichtbare."
    explanation: |
      Der Kollege hat das Keyfile mit `echo` geschrieben, und `echo` hängt einen Zeilenumbruch an. cryptsetup liest ein Keyfile vollständig, also lautete der Schlüssel `Herbst-Kunden-2026\n` und passte zu keinem Keyslot. Eine Passphrase am Prompt endet dagegen am Zeilenumbruch, deshalb funktionierte sie von Hand. `printf '%s'` schreibt sie ohne Umbruch. Das Journal von `systemd-cryptsetup@kunden.service` nannte beide Probleme: „Key data incorrect?“ und die Rechte 0644.

      Sauberer als eine Passphrase im Keyfile ist ein Keyfile aus Zufallsbytes (`head -c 64 /dev/urandom`) in einem eigenen Keyslot, angemeldet mit `cryptsetup luksAddKey`. Dann bleibt die Passphrase im Safe und lässt sich unabhängig vom Keyfile wechseln.
    resources:
      - title: crypttab(5)
        url: https://www.freedesktop.org/software/systemd/man/latest/crypttab.html
      - title: cryptsetup(8) (Debian 12, Passphrase processing)
        url: https://manpages.debian.org/bookworm/cryptsetup-bin/cryptsetup.8.en.html
  - id: archiv-nach-stromausfall
    type: scenario
    title: Nach dem Stromausfall fehlt das Archiv
    prompt: |
      Heute Nacht ist im Rechenzentrum der Strom ausgefallen, `web01` ist danach neu gestartet. Seitdem ist `/srv/archiv` leer, und die Buchhaltung kommt nicht an ihre Belege. Laut Inventarliste lagen in `/srv/archiv/2026/q3/` zwei Dateien: `rechnungen-q3.csv` und `gutschriften-q3.csv`.

      Finde heraus, was beim Start schiefging, repariere das Dateisystem und hänge `/srv/archiv` wieder beschreibbar ein. Am Ende liegen beide Q3-Dateien wieder unter ihrem Namen an ihrem Platz. Das Archiv liegt in dieser VM auf einem Loop-Device, auf einem echten Server wäre es eine Partition.
    setup: |
      set -e
      mkdir -p /var/lib/vdisks /srv/archiv /root/.lab/seed/2026/q2 /root/.lab/seed/2026/q3
      cd /root/.lab/seed/2026
      echo 'rechnung_nr;kunde;datum;betrag_eur' | tee q2/rechnungen-q2.csv > q3/rechnungen-q3.csv
      echo 'gutschrift_nr;rechnung_nr;datum;betrag_eur' > q3/gutschriften-q3.csv
      for i in $(seq 1 40); do
        printf 'R-2026-%04d;K-%03d;2026-%02d-%02d;%d.%02d\n' $((1000 + i)) $((i * 7 % 97)) $((4 + i % 3)) $((i % 28 + 1)) $((i * 37 % 900 + 50)) $((i * 13 % 100)) >> q2/rechnungen-q2.csv
        printf 'R-2026-%04d;K-%03d;2026-%02d-%02d;%d.%02d\n' $((2000 + i)) $((i * 11 % 97)) $((7 + i % 3)) $((i % 28 + 1)) $((i * 41 % 900 + 50)) $((i * 17 % 100)) >> q3/rechnungen-q3.csv
      done
      for i in 1 2 3 4 5; do
        printf 'G-2026-%03d;R-2026-%04d;2026-09-%02d;-%d.00\n' $i $((2000 + i * 6)) $((i * 5)) $((i * 20)) >> q3/gutschriften-q3.csv
      done
      cd /root/.lab/seed
      sha256sum 2026/q3/* > /root/.lab/q3.sha256
      truncate -s 16M /var/lib/vdisks/archiv.img
      mkfs.ext4 -q -L archiv -d /root/.lab/seed /var/lib/vdisks/archiv.img
      cd /
      rm -rf /root/.lab/seed
      # Der Stromausfall: Der Inode des Verzeichnisses 2026/q3 und ein Gruppendeskriptor sind beschädigt
      debugfs -w -R 'clri /2026/q3' /var/lib/vdisks/archiv.img 2>/dev/null
      debugfs -w -R 'set_bg 1 checksum 0' /var/lib/vdisks/archiv.img 2>/dev/null
      losetup /dev/loop0 /var/lib/vdisks/archiv.img
      echo 'LABEL=archiv  /srv/archiv  ext4  defaults,nofail  0  2' >> /etc/fstab
      systemctl daemon-reload
      # Wie beim Booten: systemd-fsck prüft vor dem Einhängen
      systemctl start srv-archiv.mount 2>/dev/null || true
    checks:
      - name: /srv/archiv ist beschreibbar eingehängt
        run: findmnt -n -O rw /srv/archiv || { echo "/srv/archiv ist nicht beschreibbar eingehängt"; exit 1; }
      - name: Der Superblock meldet ein sauberes Dateisystem
        run: |
          state=$(dumpe2fs -h /dev/disk/by-label/archiv 2>/dev/null | sed -n 's/^Filesystem state: *//p')
          echo "Filesystem state: ${state:-unbekannt}"
          [ "$state" = clean ]
      - name: Rechnungen und Gutschriften für Q3 liegen wieder unter /srv/archiv/2026/q3
        run: cd /srv/archiv && sha256sum -c /root/.lab/q3.sha256
    solution: |
      # /srv/archiv ist leer, weil nichts eingehängt ist. Die Prüfung vor dem Einhängen ist gescheitert:
      findmnt /srv/archiv || echo "nicht eingehängt"
      systemctl --failed --no-pager
      journalctl -b -u 'systemd-fsck@*' --no-pager | tail -n 8
      # „UNEXPECTED INCONSISTENCY; RUN fsck MANUALLY“: von Hand prüfen, ausgehängt, vollständig (-f), alle Reparaturen (-y)
      lsblk -f
      sudo e2fsck -f -y /dev/disk/by-label/archiv
      # Exit-Code 1: Fehler behoben. Ein zweiter Lauf zur Kontrolle, nur lesend:
      sudo e2fsck -f -n /dev/disk/by-label/archiv
      sudo mount /srv/archiv
      # 2026/q3 gibt es nicht mehr; e2fsck hat die Dateien ohne Namen nach lost+found gehängt (nur root darf hinein)
      ls /srv/archiv/2026
      sudo ls -l /srv/archiv/lost+found
      sudo sh -c 'head -n 2 /srv/archiv/lost+found/*'
      sudo mkdir /srv/archiv/2026/q3
      sudo mv "$(sudo grep -rl '^rechnung_nr;' /srv/archiv/lost+found)" /srv/archiv/2026/q3/rechnungen-q3.csv
      sudo mv "$(sudo grep -rl '^gutschrift_nr;' /srv/archiv/lost+found)" /srv/archiv/2026/q3/gutschriften-q3.csv
      ls -l /srv/archiv/2026/q3
    hints:
      - "`systemctl --failed` und `journalctl -b -u 'systemd-fsck@*'`: Was hat die Prüfung vor dem Einhängen gemeldet?"
      - "„RUN fsck MANUALLY“ heißt: `e2fsck` von Hand, auf dem **ausgehängten** Gerät, mit `-f`. Das Gerät zeigt `lsblk -f`, oder du nimmst `/dev/disk/by-label/archiv`."
      - "Dateien ohne Verzeichniseintrag hängt `e2fsck` unter `lost+found` ein, benannt nach ihrer Inode-Nummer. Welche ist welche? Die erste Zeile verrät es."
    explanation: |
      Der Stromausfall hat zwei Dinge beschädigt: die Prüfsumme eines Gruppendeskriptors und den Inode des Verzeichnisses `2026/q3`. Beim Start lief `systemd-fsck@` im Preen-Modus. Er reparierte die Prüfsumme und entfernte den kaputten Verzeichniseintrag, stieß dann aber auf Dateien ohne Verzeichnis. Die darf er nicht ohne Rückfrage verschieben, also brach er mit „UNEXPECTED INCONSISTENCY; RUN fsck MANUALLY“ ab, und der Mount fiel aus. `nofail` hielt den Boot am Laufen. `e2fsck -f -y` auf dem ausgehängten Gerät hängte die verwaisten Inodes unter `lost+found` ein: Name und Verzeichnis waren verloren, der Inhalt nicht.

      Wer vor der Reparatur einhängt, sieht einen Teil der Daten und übersieht leicht, dass Dateien fehlen. Statt `mount` startet `sudo systemctl start srv-archiv.mount` denselben Weg wie der Boot, mit erneuter Prüfung davor.
    resources:
      - title: e2fsck(8) · Exit Code
        url: https://man7.org/linux/man-pages/man8/e2fsck.8.html#EXIT_CODE
      - title: systemd-fsck@.service
        url: https://www.freedesktop.org/software/systemd/man/latest/systemd-fsck@.service.html
  - id: restore-probe
    type: practice
    title: Wiederherstellung nachweisen
    prompt: Plane einen Restore-Test für ein bereits eingerichtetes Restic-Repository. Nutze einen expliziten Snapshot und ein neues Zielverzeichnis. Prüfe Dateien, Metadaten und eine fachliche Lesefunktion, ohne die Originaldaten zu überschreiben.
    lang: bash
    solution: |
      restic snapshots
      restic check
      # SNAPSHOT_ID durch den gewählten tatsächlichen Snapshot ersetzen:
      restic restore SNAPSHOT_ID --target ./restore-probe
      # Danach ausgewählte Prüfsummen, Rechte und die Anwendung prüfen.
    checklist:
      - Der ausgewählte Snapshot und sein Zeitpunkt sind dokumentiert.
      - Das Restore-Ziel liegt getrennt vom produktiven Datenpfad.
      - Erwartete Dateien und ausgewählte Inhalte oder Prüfsummen stimmen.
      - Benötigte Besitzer und Rechte sind geprüft.
      - Eine fachliche Lesefunktion arbeitet mit den wiederhergestellten Daten.
      - Dauer und benötigte Zugangsdaten sind im Runbook beschrieben.
    explanation: Ein Restore-Test prüft mehr als die Existenz eines Archivs. Er macht sichtbar, ob Schlüssel, Metadaten und Anwendungswissen im Ernstfall verfügbar sind.
    resources:
      - title: Restic · Restore
        url: https://restic.readthedocs.io/en/stable/050_restore.html
