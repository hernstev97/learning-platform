    type: choice
    title: Wer ist hier Linux?
    prompt: Welche Aussagen über Kernel, Userland und Distributionen stimmen?
    options:
      - text: "`ls`, `cp` und `bash` gehören nicht zum Linux-Kernel, sondern zum Userland."
        correct: true
        why: Das sind normale Programme, die meisten aus dem GNU-Projekt. Der Kernel stellt ihnen über System Calls Dateien, Prozesse und Speicher bereit.
      - text: Ubuntu und CachyOS nutzen unterschiedliche Kernel-Familien und sind deshalb für bash-Skripte inkompatibel.
        correct: false
        why: Beide laufen auf dem Linux-Kernel mit bash und den GNU-Werkzeugen. Unterschiede liegen bei Paketmanager, Paketnamen und Voreinstellungen, nicht bei der Skriptsprache.
      - text: Auf Debian und Ubuntu steht, wer `sudo` nutzen darf, typischerweise in der Gruppe `sudo`, auf Arch und Fedora in der Gruppe `wheel`.
        correct: true
        why: Genau solche Details unterscheiden die Familien. Anleitungen für die eine Familie musst du dann leicht anpassen.
      - text: "Mit `cat /etc/os-release` findest du die Kernel-Version heraus."
        correct: false
        why: "`/etc/os-release` beschreibt die Distribution. Die Kernel-Version liefert `uname -r`."
    explanation: |
      „Linux“ im engeren Sinn ist nur der Kernel. Distributionen kombinieren ihn mit Userland, Paketmanager und Voreinstellungen. Weil Kernel, Kernwerkzeuge und bash überall gleich sind, laufen Skripte und Wissen distributionsübergreifend – solange du auf Paketnamen, Pfade und Gruppen achtest.
