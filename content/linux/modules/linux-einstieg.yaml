lesson: |
  Ein typisches Ticket in deiner ersten Woche: „Deploy auf dem Staging-Server schlägt fehl: `node: command not found`. Node ist aber installiert.“ Du loggst dich per SSH ein, tippst `node --version` – und es funktioniert. Nur das Deploy-Skript findet `node` nicht. Wer hier rät, verliert Stunden. Wer weiß, *wie* die Shell ein Programm sucht und *was* ein Prozess von seiner Shell erbt, findet die Ursache in zwei Minuten: Das Skript läuft mit einem anderen `PATH` als deine interaktive Shell.

  Dieses Modul legt das Fundament für alle weiteren Linux-Module. Du lernst keine Befehlslisten, sondern das Denkmodell: Was passiert zwischen dem Moment, in dem du Enter drückst, und dem Moment, in dem die Ausgabe erscheint? Und du lernst, dir selbst zu helfen – mit den Handbüchern, die auf jedem System schon installiert sind.

  ## Kernel, GNU, Distribution – was „Linux“ heißt

  Streng genommen ist **Linux** nur der [Kernel](https://docs.kernel.org/admin-guide/README.html): das Programm, das als Erstes startet und dann dauerhaft zwischen Hardware und allen anderen Programmen vermittelt. Er verwaltet Prozesse, Speicher, Dateisysteme, Netzwerk und Geräte. Programme sprechen ihn nie direkt über die Hardware an, sondern über **System Calls** wie `open`, `read` oder `execve`.

  Alles, was du im Terminal tippst – `ls`, `cp`, `grep`, die Shell `bash` selbst, die C-Bibliothek `glibc` –, gehört zum **Userland**. Ein großer Teil davon stammt aus dem GNU-Projekt; deshalb spricht die Free Software Foundation von [GNU/Linux](https://www.gnu.org/gnu/linux-and-gnu.html). Eine **Distribution** bündelt Kernel, Userland, einen Paketmanager, Voreinstellungen und ein Release-Modell zu einem installierbaren System.

  | Familie | Beispiele | Pakete | Release-Modell | Typischer Einsatz |
  | --- | --- | --- | --- | --- |
  | Debian | Debian, Ubuntu, Linux Mint | `.deb`, `apt` | stabile Versionen, lange gepflegt | Server, Cloud, Container-Images |
  | Red Hat | Fedora, RHEL, Rocky, AlmaLinux | `.rpm`, `dnf` | Fedora schnell, RHEL sehr langlebig | Unternehmen, Rechenzentren |
  | Arch | Arch Linux, CachyOS, EndeavourOS | `pacman` (+ AUR mit `paru`) | Rolling Release | Desktop, Entwicklerrechner |

  Was überall gleich ist: der Kernel, die Kernwerkzeuge (`ls`, `cp`, `grep`, `sed`), bash, systemd und die Grundstruktur des Dateisystems. Was sich unterscheidet: Paketmanager und Paketnamen, Release-Rhythmus, manche Pfade und Gruppennamen. Ein Beispiel, das dir im Modul zu Rechten wieder begegnet: Wer `sudo` benutzen darf, steht auf Debian und Ubuntu in der Gruppe `sudo`, auf Fedora, RHEL und Arch in der Gruppe `wheel`. Einen guten Vergleich liefert das Arch Wiki unter [Arch compared to other distributions](https://wiki.archlinux.org/title/Arch_compared_to_other_distributions).

  Welche Distribution und welcher Kernel laufen, verraten dir zwei Befehle. [`/etc/os-release`](https://man7.org/linux/man-pages/man5/os-release.5.html) gibt es auf jeder aktuellen Distribution:

  ```console
  $ cat /etc/os-release
  NAME="CachyOS Linux"
  PRETTY_NAME="CachyOS"
  ID=cachyos
  ID_LIKE=arch
  BUILD_ID=rolling
  $ uname -r
  7.2.8-1-cachyos
  ```

  `ID_LIKE=arch` sagt dir, zu welcher Familie das System gehört – nützlich, wenn eine Anleitung nur „für Arch“ oder „für Debian“ geschrieben ist.

  > [!PRAXIS] Desktop und Server sind verschiedene Welten
  > Auf deinem Rechner läuft CachyOS mit fish, auf den Servern deines künftigen Arbeitgebers sehr wahrscheinlich Debian oder Ubuntu mit bash, in Containern oft ein schlankes Debian- oder Alpine-Image. Das Wissen aus diesem Kurs überträgt sich, weil Kernel, Kernwerkzeuge und bash überall gleich sind. Lerne, die Unterschiede zu *erkennen* (Paketmanager, Gruppennamen, Standard-Shell), statt sie auswendig zu lernen.

  ## Terminal, Shell, Programm

  Drei Dinge werden im Alltag oft verwechselt:

  - Das **Terminal** (genauer: der Terminal-Emulator, etwa Konsole, kitty oder Alacritty) ist das Fenster. Es zeichnet Text und schickt deine Tastendrücke weiter. Es versteht keine Befehle.
  - Die **Shell** ist das Programm, das im Terminal läuft, deine Zeile liest, sie zerlegt und Programme startet. Verbreitet sind **bash** (Standard auf Debian, Ubuntu, Fedora und in fast allen Skripten), **zsh** (Standard auf macOS) und **fish** (Standard auf CachyOS).
  - Das **Programm** – `ls`, `git`, `python3` – startet die Shell als eigenen Prozess.

  bash und zsh folgen weitgehend dem POSIX-Standard für Shells, fish bewusst nicht: fish hat eine eigene, aufgeräumtere Syntax. Deshalb gilt in diesem Kurs: **Skripte schreibst du in bash**, interaktiv darfst du fish benutzen. Wo fish anders ist, steht es dabei. Die offizielle Seite [fish for bash users](https://fishshell.com/docs/current/fish_for_bash_users.html) fasst die Unterschiede zusammen:

  | Zweck | bash | fish |
  | --- | --- | --- |
  | Variable setzen | `NAME=wert` | `set NAME wert` |
  | Variable exportieren | `export NAME=wert` | `set -gx NAME wert` |
  | Exit-Status des letzten Befehls | `$?` | `$status` |
  | Befehlsersetzung | `$(befehl)` | `(befehl)`, seit fish 3.4 auch `$(befehl)` |
  | Letzten Befehl wiederholen | `!!` | keine History-Expansion |

  ## Anatomie einer Befehlszeile

  ```console
  $ ls -l -h --sort=time /var/log
  ```

  Die Shell zerlegt diese Zeile an Leerzeichen in **Wörter**. Das erste Wort ist der **Befehl** (`ls`), die übrigen sind **Argumente**. Nach Konvention unterscheidet das Programm dabei:

  - **Kurzoptionen** mit einem Bindestrich: `-l`, `-h`. Sie lassen sich bündeln: `-lh` ist dasselbe wie `-l -h`.
  - **Langoptionen** mit zwei Bindestrichen: `--sort=time` oder `--sort time`. Sie sind länger, aber in Skripten besser lesbar.
  - **Operanden**, also das, worauf der Befehl arbeitet: `/var/log`.

  Wichtig für das Denkmodell: Das Zerlegen macht die **Shell**, nicht das Programm. `ls` bekommt vom Kernel eine fertige Liste von Zeichenketten übergeben (bei `execve` heißt sie `argv`). Anführungszeichen bestimmen, wo die Shell trennt – und sie werden vorher entfernt. Mit `printf` kannst du sichtbar machen, welche Argumente ankommen:

  ```console
  $ printf '<%s>\n' Bericht "Umsatz März.pdf" alt
  <Bericht>
  <Umsatz März.pdf>
  <alt>
  ```

  `printf` wiederholt sein Format für jedes Argument. Drei spitze Klammerpaare heißen: drei Argumente. Ohne Anführungszeichen wären es vier, und ein Befehl wie `rm` würde nach den Dateien `Umsatz` und `März.pdf` suchen. Die Regeln dazu stehen im Bash-Handbuch unter [Quoting](https://www.gnu.org/software/bash/manual/html_node/Quoting.html) und [Word Splitting](https://www.gnu.org/software/bash/manual/html_node/Word-Splitting.html).

  Ein Sonderfall ist `--` allein: Es bedeutet „ab hier keine Optionen mehr“. So löschst du eine Datei, deren Name mit einem Bindestrich beginnt, oder suchst nach dem Text `-v`:

  ```console
  $ rm -- -alt.txt
  $ grep -- -v notizen.txt
  ```

  Diese Konvention ist Teil der [POSIX Utility Syntax Guidelines](https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/V1_chap12.html) (Guideline 10), deshalb verstehen sie fast alle Programme.

  Jeder Befehl endet mit einem **Exit-Status**: `0` heißt Erfolg, alles andere Fehler. Die Shell legt ihn in `$?` ab (in fish: `$status`). Kann die Shell den Befehl gar nicht finden, setzt sie `127`. Das Modul zu Prozessen vertieft das.

  ## Hilfe finden, statt auswendig zu lernen

  Niemand kennt alle Optionen von `find` oder `tar`. Profis unterscheiden sich darin, dass sie die Antwort in einer Minute finden – ohne Browser.

  | Werkzeug | Wofür | Beispiel |
  | --- | --- | --- |
  | `befehl --help` | kurze Übersicht der Optionen | `ls --help` |
  | `man befehl` | das vollständige Handbuch | `man ls` |
  | `man -k wort` / `apropos wort` | Handbücher nach Stichwort durchsuchen | `apropos compress` |
  | `help befehl` | Builtins der bash (`cd`, `export`, `type`) | `help cd` |
  | `info befehl` | ausführliche GNU-Handbücher | `info coreutils` |
  | `tldr befehl` | praxisnahe Beispiele (Community, nicht offiziell) | `tldr tar` |

  **man-Pages** sind in [Sektionen](https://man7.org/linux/man-pages/man7/man-pages.7.html) aufgeteilt. Die wichtigsten: `1` Benutzerbefehle, `5` Dateiformate und Konfigurationsdateien, `8` Befehle für die Administration, `2` System Calls, `7` Überblicke. Derselbe Name kann in mehreren Sektionen vorkommen: `man passwd` zeigt den Befehl `passwd(1)`, `man 5 passwd` beschreibt die Datei `/etc/passwd`. Die Schreibweise `passwd(5)` in Texten meint genau das.

  In einer man-Page bewegst du dich wie in [`less`](https://man7.org/linux/man-pages/man1/less.1.html): `/wort` sucht, `n` springt zum nächsten Treffer, `q` beendet. Die **SYNOPSIS** oben liest du so: Eckige Klammern `[ ]` sind optional, `...` heißt „beliebig oft wiederholbar“.

  ```console
  $ man -k compress
  …
  bzip2 (1)            - a block-sorting file compressor, v1.0.8
  gzip (1)             - compress or expand files
  xz (1)               - Compress or decompress .xz and .lzma files
  zstd (1)             - zstd, zstdmt, unzstd, zstdcat - Compress or decompress...
  …
  ```

  Die Liste ist hier gekürzt; auf einem echten System findest du dutzende Treffer, auch aus Sektion 3 (Bibliotheksfunktionen).

  > [!TIP] Builtins haben keine eigene man-Page
  > `cd`, `export`, `alias`, `type` und `history` sind keine Programme auf der Platte, sondern in die Shell eingebaut. `man cd` hilft deshalb oft nicht. In bash nimmst du `help cd`, in fish `cd --help`. Wie du erkennst, ob etwas ein Builtin ist, steht im nächsten Abschnitt.

  ## Wie die Shell ein Programm findet

  Enthält das erste Wort einen Schrägstrich (`./deploy.sh`, `/usr/bin/python3`), führt die Shell genau diese Datei aus. Sonst sucht bash laut Handbuch ([Command Search and Execution](https://www.gnu.org/software/bash/manual/html_node/Command-Search-and-Execution.html)) in dieser Reihenfolge:

  1. **Alias** – wird schon beim Einlesen der Zeile ersetzt.
  2. **Funktion** – in der Shell definiert.
  3. **Builtin** – in die Shell eingebaut, etwa `cd`.
  4. **PATH** – die Verzeichnisse in der Variable `PATH`, **von links nach rechts**. Die erste ausführbare Datei mit passendem Namen gewinnt.

  ```console
  $ echo $PATH
  /home/steven/.local/bin:/usr/local/bin:/usr/bin
  $ type -a python3
  python3 is /usr/local/bin/python3
  python3 is /usr/bin/python3
  $ command -v python3
  /usr/local/bin/python3
  ```

  Hier liegen zwei Python-Versionen herum; ausgeführt wird die aus `/usr/local/bin`, weil dieses Verzeichnis weiter vorne in `PATH` steht. [`type`](https://www.gnu.org/software/bash/manual/html_node/Bash-Builtins.html#index-type) zeigt dir alles, was die Shell kennt – auch Aliase, Funktionen und Builtins. `command -v` ist die POSIX-Variante, die du in Skripten verwendest. Das externe Programm `which` durchsucht nur `PATH` und kennt die Aliase deiner Shell nicht; es kann dir also eine falsche Antwort geben.

  Probiere auf deinem CachyOS in fish einmal `type ls`. Du wirst sehen, dass `ls` dort eine Funktion ist, die `eza -al --color=always …` aufruft – die mitgelieferte fish-Konfiguration von CachyOS definiert diesen Alias. Deshalb sieht deine Ausgabe von `ls` anders aus als in diesem Kurs. Mit `command ls` umgehst du Aliase und Funktionen und bekommst das echte GNU-`ls`.

  Warum steht das aktuelle Verzeichnis `.` nicht in `PATH`? Sonst könnte jemand eine Datei namens `ls` in `/tmp` legen, und du würdest sie ausführen, sobald du dort `ls` tippst. Deshalb startest du eigene Skripte mit `./skript.sh`.

  > [!DEEP] Was beim Start wirklich passiert
  > Hat die Shell die Datei gefunden, klont sie sich mit `fork()`, und der Kindprozess ersetzt sich mit [`execve()`](https://man7.org/linux/man-pages/man2/execve.2.html) durch das Programm. Dabei übergibt er die Argumentliste und eine **Kopie** der Umgebungsvariablen. bash merkt sich außerdem gefundene Pfade in einer Hash-Tabelle; verschiebst du ein Programm, hilft `hash -r`.

  > [!INTERVIEW] „Was passiert, wenn du `ls -l` tippst und Enter drückst?“
  > Eine beliebte Einstiegsfrage. Gute Antwort in Stufen: Das Terminal schickt die Zeile an die Shell. Die Shell zerlegt sie in Wörter, prüft Alias, Funktion und Builtin und sucht dann in den Verzeichnissen von `PATH` nach `ls`. Sie forkt, das Kind führt `/usr/bin/ls` per `execve` mit den Argumenten `ls` und `-l` aus. `ls` liest das Verzeichnis über System Calls, schreibt auf stdout ins Terminal und endet mit einem Exit-Status, den die Shell per `wait` abholt. Danach erscheint der Prompt.

  ## Umgebungsvariablen und Aliase

  Eine **Shell-Variable** existiert nur in deiner Shell. Eine **Umgebungsvariable** wird zusätzlich an jeden Prozess vererbt, den die Shell startet. Den Unterschied macht [`export`](https://www.gnu.org/software/bash/manual/html_node/Bourne-Shell-Builtins.html#index-export):

  ```console
  $ PROJEKT=shop
  $ bash -c 'echo "Projekt: $PROJEKT"'
  Projekt:
  $ export PROJEKT
  $ bash -c 'echo "Projekt: $PROJEKT"'
  Projekt: shop
  ```

  Das innere `bash -c` ist ein Kindprozess. Es sieht `PROJEKT` erst, nachdem die Variable exportiert ist. Wichtige Umgebungsvariablen sind `PATH`, `HOME` (dein Heimatverzeichnis), `USER`, `SHELL` (deine Login-Shell), `EDITOR` und `LANG` (Sprache und Zeichensatz). `env` oder `printenv` zeigt alle, `printenv HOME` eine einzelne. [environ(7)](https://man7.org/linux/man-pages/man7/environ.7.html) beschreibt die üblichen Namen.

  Drei Regeln, die viele Rätsel lösen:

  - **Keine Leerzeichen um `=`.** `NAME = wert` ruft den Befehl `NAME` mit den Argumenten `=` und `wert` auf.
  - **Nur für einen Befehl:** `LANG=C sort liste.txt` setzt die Variable nur für diesen einen Aufruf.
  - **Vererbung geht nur nach unten.** Ein Kindprozess bekommt eine Kopie, kann aber die Umgebung seiner Shell nie ändern. Ein Skript, das `export PATH=…` ausführt, ändert deine Shell deshalb nicht – außer du lädst es mit `source skript.sh` in die laufende Shell.

  Damit ist das Ticket vom Anfang gelöst: Node lag unter `~/.local/bin`, und nur deine interaktive Shell hatte das Verzeichnis über `~/.profile` in `PATH` aufgenommen. Das Deploy-Skript lief aus einem Dienst heraus mit einer anderen Umgebung.

  Dauerhaft setzt du Variablen in einer Startdatei. Für interaktive bash-Shells ist das `~/.bashrc`; Login-Shells lesen `~/.profile` oder `~/.bash_profile` ([Bash Startup Files](https://www.gnu.org/software/bash/manual/html_node/Bash-Startup-Files.html)). fish liest `~/.config/fish/config.fish`:

  ```bash
  # ~/.bashrc
  export EDITOR=nvim
  export PATH="$HOME/.local/bin:$PATH"
  alias ll='ls -lh'
  ```

  In fish sieht dasselbe so aus – belegt in der Doku zu [`set`](https://fishshell.com/docs/current/cmds/set.html), [`fish_add_path`](https://fishshell.com/docs/current/cmds/fish_add_path.html) und [`abbr`](https://fishshell.com/docs/current/cmds/abbr.html):

  ```fish
  # ~/.config/fish/config.fish
  set -gx EDITOR nvim
  fish_add_path ~/.local/bin
  abbr --add ll 'ls -lh'
  ```

  Ein **Alias** ist eine Textersetzung für das erste Wort. fish kennt `alias` auch, legt dafür aber intern eine Funktion an; die fish-Doku empfiehlt für Abkürzungen `abbr`, weil du dann den vollen Befehl in der History siehst. Neue Einstellungen wirken erst in einer neuen Shell oder nach `source ~/.bashrc`.

  ## Schneller arbeiten: Tab, History und Tastenkürzel

  Die Zeilenbearbeitung von bash stammt aus der Bibliothek Readline ([Readline Interaction](https://www.gnu.org/software/bash/manual/html_node/Readline-Interaction.html)). Diese Kürzel sparen dir jeden Tag Zeit:

  | Kürzel | Wirkung |
  | --- | --- |
  | `Tab`, zweimal `Tab` | vervollständigen, alle Möglichkeiten zeigen |
  | `Strg+R` | History rückwärts durchsuchen (erneut drücken: nächster Treffer) |
  | `Strg+A` / `Strg+E` | an den Anfang / das Ende der Zeile |
  | `Strg+W` / `Strg+U` | Wort / alles vor dem Cursor löschen |
  | `Strg+L` | Bildschirm leeren |
  | `Strg+C` | laufenden Befehl abbrechen (sendet `SIGINT`) |
  | `Strg+D` | Eingabeende; in einer leeren Zeile beendet es die Shell |
  | `Alt+.` | letztes Argument des vorigen Befehls einfügen |

  Dazu kommt die **History-Expansion** von bash ([Event Designators](https://www.gnu.org/software/bash/manual/html_node/Event-Designators.html)): `!!` steht für den ganzen vorigen Befehl, `!$` für dessen letztes Argument.

  ```console
  $ mkdir -p ~/projekte/shop/logs
  $ cd !$
  cd ~/projekte/shop/logs
  $ cat /etc/sudoers
  cat: /etc/sudoers: Permission denied
  $ sudo !!
  sudo cat /etc/sudoers
  ```

  fish hat keine History-Expansion. Stattdessen schlägt es beim Tippen Befehle aus der History vor (mit `→` übernehmen), und `Strg+R` öffnet eine durchsuchbare History. CachyOS rüstet in `/usr/share/cachyos-fish-config/cachyos-config.fish` Tastenbindungen nach, die `!!` und `!$` beim Tippen ersetzen – das ist eine Ergänzung von CachyOS, kein Standard-fish.

  ## Häufige Fehler

  - **`command not found` (Exit-Status 127):** Tippfehler, Programm nicht installiert, Verzeichnis nicht in `PATH` – oder ein eigenes Skript ohne `./` aufgerufen. Prüfe mit `type -a name` und `echo $PATH`.
  - **`PATH` überschrieben statt erweitert:** `export PATH=/opt/tools/bin` wirft alle Systemverzeichnisse raus; danach findet die Shell nicht einmal mehr `ls`. Richtig: `export PATH="/opt/tools/bin:$PATH"`.
  - **Leerzeichen um das `=`:** `EDITOR = nvim` ergibt `EDITOR: command not found`.
  - **Einstellung wirkt nicht:** Datei geändert, aber keine neue Shell geöffnet oder die falsche Startdatei erwischt (`.bashrc` vs. `.profile`, bash vs. fish).
  - **bash-Syntax in fish:** `NAME=wert` allein oder `for i in …; do` funktionieren in fish nicht. Schreibe bash-Code in eine Datei mit `#!/usr/bin/env bash` und führe sie aus, statt ihn in fish einzufügen.
  - **Prompt mitkopiert:** Aus Anleitungen kopierte Zeilen wie `$ sudo apt update` enthalten das `$` nicht als Teil des Befehls.

  > [!WARNING] Nie `.` in PATH
  > Füge weder `.` noch ein leeres Element (`::` oder ein `:` am Anfang oder Ende) in `PATH` ein. Beides bedeutet „aktuelles Verzeichnis“ und öffnet genau die Falle mit der untergeschobenen `ls`-Datei.

  ## Zusammenfassung

  - Linux ist der Kernel. Eine Distribution bündelt ihn mit GNU-Werkzeugen, Paketmanager und Voreinstellungen; Debian/Ubuntu, Fedora/RHEL und Arch/CachyOS unterscheiden sich vor allem bei Paketen, Release-Modell und Details wie Gruppennamen.
  - Das Terminal zeichnet, die Shell interpretiert, Programme laufen als eigene Prozesse. Skripte schreibst du in bash, auch wenn du interaktiv fish nutzt.
  - Die Shell zerlegt die Zeile in Wörter; Anführungszeichen bestimmen die Grenzen. `--` beendet die Optionen.
  - Hilfe: `--help`, `man` mit Sektionen (`man 5 passwd`), `apropos`, `help` für Builtins, `tldr` für Beispiele.
  - Suchreihenfolge: Alias, Funktion, Builtin, dann `PATH` von links nach rechts. `type -a` zeigt, was wirklich läuft.
  - `export` vererbt eine Variable an Kindprozesse. Kinder können die Umgebung ihrer Shell nie ändern.
  - `Tab`, `Strg+R`, `!!` und `!$` sparen täglich Zeit; fish arbeitet stattdessen mit Vorschlägen und `abbr`.
