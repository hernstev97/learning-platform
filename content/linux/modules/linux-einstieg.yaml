id: linux-einstieg
title: Linux & die Shell
level: 1
minutes: 150
summary: Was „Linux“ eigentlich ist, wie die Shell eine Befehlszeile zerlegt und das passende Programm findet – und wie du dir selbst hilfst, statt Befehle auswendig zu lernen.
goals:
  - Du unterscheidest Kernel, GNU-Userland und Distribution und nennst, was sich zwischen Debian/Ubuntu, Fedora/RHEL und Arch/CachyOS unterscheidet.
  - Du zerlegst eine Befehlszeile in Befehl, Optionen und Argumente und erklärst, wozu `--` dient.
  - Du findest Hilfe mit `man` (inklusive Sektionen), `--help`, `help`, `apropos` und `tldr`.
  - Du erklärst, wie die Shell über `PATH` ein Programm findet, und prüfst mit `type` und `command -v`, was wirklich ausgeführt wird.
  - Du setzt und exportierst Umgebungsvariablen in bash und in fish und weißt, warum ein Kindprozess die Umgebung seiner Shell nicht ändern kann.
  - Du arbeitest schneller mit Tab-Vervollständigung, History-Suche und Tastenkürzeln.
