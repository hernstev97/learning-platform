    prompt: Du tippst in bash `ls -l` und drückst Enter. Bring die Schritte in die richtige Reihenfolge.
    lang: text
    lines: |
      Das Terminal schickt die Zeile an die Shell.
      Die Shell zerlegt die Zeile in die Wörter ls und -l.
      Die Shell prüft, ob ls ein Alias, eine Funktion oder ein Builtin ist.
      Die Shell durchsucht die Verzeichnisse aus PATH von links nach rechts und findet /usr/bin/ls.
      Ein Kindprozess führt /usr/bin/ls mit den Argumenten ls und -l aus.
      ls schreibt die Liste ins Terminal und endet mit Exit-Status 0.
      Die Shell holt den Exit-Status ab und zeigt den nächsten Prompt.
    explanation: |
      Die Shell muss die Zeile erst zerlegen, bevor sie weiß, welcher Befehl gemeint ist. Aliase, Funktionen und Builtins haben Vorrang vor Programmen in `PATH`; erst wenn nichts davon passt, durchsucht sie `PATH`. Das Programm läuft als eigener Prozess, und die Shell wartet auf dessen Ende, bevor sie den Prompt zeigt.
    resources:
      - title: Bash Manual · Command Search and Execution
        url: https://www.gnu.org/software/bash/manual/html_node/Command-Search-and-Execution.html

  - id: argumente-zaehlen
    type: output
    title: Wie viele Argumente kommen an?
    prompt: |
      `printf '<%s>\n'` gibt jedes Argument in spitzen Klammern auf einer eigenen Zeile aus. Was erscheint?
    lang: bash
    code: |
      printf '<%s>\n' Rechnung "Mai 2026" 'Kunde  Meier' final\ v2
    expected: |
      <Rechnung>
      <Mai 2026>
      <Kunde  Meier>
      <final v2>
    verify: true
    explanation: |
      Die Shell trennt an Leerzeichen, außer sie sind geschützt: durch doppelte Anführungszeichen, einfache Anführungszeichen oder einen Backslash direkt davor. Die Anführungszeichen selbst entfernt sie, bevor `printf` die Argumente bekommt. Innerhalb der Anführungszeichen bleiben auch zwei Leerzeichen erhalten. So kommen genau vier Argumente an.
    resources:
      - title: Bash Manual · Quoting
        url: https://www.gnu.org/software/bash/manual/html_node/Quoting.html

  - id: export-vererbung
    type: output
    title: Wer sieht welche Variable?
    prompt: Was gibt dieses bash-Snippet aus? `bash -c` startet eine neue bash als Kindprozess.
    lang: bash
    code: |
      STADT=Berlin
      export LAND=Deutschland
      bash -c 'echo "Stadt: $STADT, Land: $LAND"'
      bash -c 'export STADT=Hamburg'
      echo "Stadt: $STADT"
    expected: |
      Stadt: , Land: Deutschland
      Stadt: Berlin
    verify: true
    explanation: |
      `STADT` ist nur eine Shell-Variable und wird nicht vererbt; im Kindprozess ist sie leer. `LAND` ist exportiert und kommt an. Das zweite `bash -c` setzt `STADT` nur in seiner eigenen Kopie der Umgebung – ein Kindprozess kann die Umgebung seiner Shell nie ändern. Deshalb bleibt `STADT` in der äußeren Shell `Berlin`.
    resources:
      - title: Bash Manual · Environment
        url: https://www.gnu.org/software/bash/manual/html_node/Environment.html
      - title: environ(7)
        url: https://man7.org/linux/man-pages/man7/environ.7.html

  - id: path-reihenfolge
    type: output
    title: Zwei Programme, ein Name
    prompt: |
      Die ersten vier Zeilen legen in den Verzeichnissen `a` und `b` je ein kleines Programm namens `hallo` an. Was geben die beiden Aufrufe von `hallo` aus?
    lang: bash
    code: |
      mkdir -p a b
      printf '#!/bin/sh\necho "Ich bin a"\n' > a/hallo
      printf '#!/bin/sh\necho "Ich bin b"\n' > b/hallo
      chmod +x a/hallo b/hallo
      PATH="$PWD/b:$PWD/a:$PATH"
      hallo
      PATH="$PWD/a:$PATH"
      hallo
    expected: |
      Ich bin b
      Ich bin a
    verify: true
    explanation: |
      Die Shell durchsucht `PATH` von links nach rechts, und der erste Treffer gewinnt. Beim ersten Aufruf steht `b` vorne. Danach wird `a` noch einmal *vor* alles andere gesetzt, also gewinnt `a`. bash merkt sich gefundene Pfade zwar in einer Hash-Tabelle, leert diese aber bei jeder Zuweisung an `PATH`.
    resources:
      - title: Bash Manual · Command Search and Execution
        url: https://www.gnu.org/software/bash/manual/html_node/Command-Search-and-Execution.html

  - id: man-sektion
    type: command
    title: Die richtige passwd-Seite
    prompt: |
      `man passwd` zeigt dir den Befehl zum Passwortändern. Du willst aber wissen, welche Felder die **Datei** `/etc/passwd` hat. Öffne die passende man-Page (Sektion 5).
    answers: ["man 5 passwd", "man -s 5 passwd", "man passwd.5", "man 'passwd(5)'"]
    explanation: |
      Sektion 5 enthält Dateiformate und Konfigurationsdateien. `man 5 passwd` wählt sie ausdrücklich; ohne Sektion nimmt `man` den ersten Treffer in der Standardreihenfolge, und das ist `passwd(1)`. man-db versteht auch `man passwd.5` und `man 'passwd(5)'` – die Klammern brauchen Anführungszeichen, weil sie für die Shell eine Bedeutung haben.
    resources:
      - title: man(1)
        url: https://man7.org/linux/man-pages/man1/man.1.html
      - title: man-pages(7) · Sektionen
        url: https://man7.org/linux/man-pages/man7/man-pages.7.html

  - id: apropos-suchen
    type: command
    title: Welches Werkzeug war das noch?
    prompt: Du suchst ein Programm zum Komprimieren von Dateien, kennst aber den Namen nicht. Durchsuche die Kurzbeschreibungen aller installierten man-Pages nach dem Wort `compress`.
    answers: ["apropos compress", "man -k compress"]
    output: |
      …
      bzip2 (1)            - a block-sorting file compressor, v1.0.8
      gzip (1)             - compress or expand files
      xz (1)               - Compress or decompress .xz and .lzma files
      zstd (1)             - zstd, zstdmt, unzstd, zstdcat - Compress or decompress...
    explanation: |
      `apropos` (identisch mit `man -k`) durchsucht Namen und Kurzbeschreibungen aller man-Pages. Die Zahl in Klammern ist die Sektion. Findet es nichts, obwohl das Programm installiert ist, ist oft der Index veraltet; `mandb` baut ihn neu auf (auf den meisten Distributionen passiert das automatisch).
    resources:
      - title: apropos(1)
        url: https://man7.org/linux/man-pages/man1/apropos.1.html

  - id: type-alle-treffer
    type: command
    title: Was läuft hier eigentlich?
    prompt: |
      `python3 --version` zeigt eine andere Version, als du erwartest. Lass dir von bash **alle** Stellen anzeigen, an denen sie `python3` findet – Aliase und Funktionen eingeschlossen, nicht nur `PATH`.
    answers: ["type -a python3"]
    output: |
      python3 is /usr/local/bin/python3
      python3 is /usr/bin/python3
    explanation: |
      `type -a` listet alles, was die Shell unter dem Namen kennt, in der Reihenfolge, in der sie es probiert. Der erste Eintrag wird ausgeführt. `which` oder `command -v` zeigen nur den Gewinner, und `which` kennt als externes Programm die Aliase und Funktionen deiner Shell nicht. Hier steht `/usr/local/bin` vor `/usr/bin` in `PATH`.
    resources:
      - title: Bash Manual · type
        url: https://www.gnu.org/software/bash/manual/html_node/Bash-Builtins.html#index-type

  - id: path-erweitern
    type: command
    title: Eigene Tools zuerst
    prompt: |
      Du hast ein Tool nach `~/.local/bin` installiert, bash meldet aber `command not found`. Setze `PATH` für die laufende bash-Sitzung so, dass `$HOME/.local/bin` **vorne** steht und alle bisherigen Verzeichnisse erhalten bleiben.
    answers:
      - export PATH="$HOME/.local/bin:$PATH"
      - export PATH=$HOME/.local/bin:$PATH
      - export PATH="${HOME}/.local/bin:${PATH}"
      - export PATH=~/.local/bin:$PATH
      - PATH="$HOME/.local/bin:$PATH"
      - PATH=$HOME/.local/bin:$PATH
      - PATH=~/.local/bin:$PATH
    explanation: |
      Der neue Wert besteht aus dem neuen Verzeichnis, einem Doppelpunkt und dem alten Inhalt `$PATH`. Vorne heißt: Es wird zuerst durchsucht, deine Version gewinnt. `export` schadet nicht, ist hier aber nicht nötig – `PATH` ist bereits eine Umgebungsvariable und bleibt es. Vorsicht: In doppelten Anführungszeichen wird `~` **nicht** ersetzt, deshalb ist `$HOME` die sichere Schreibweise. In fish erledigt das `fish_add_path ~/.local/bin`.
    hints:
      - Der neue Wert setzt sich aus dem neuen Verzeichnis und dem alten Wert zusammen.
      - Die Verzeichnisse in `PATH` sind durch `:` getrennt.
    resources:
      - title: Bash Manual · Tilde Expansion
        url: https://www.gnu.org/software/bash/manual/html_node/Tilde-Expansion.html
      - title: fish_add_path
        url: https://fishshell.com/docs/current/cmds/fish_add_path.html

  - id: history-letztes-argument
    type: command
    title: Nicht noch mal tippen
    context: |
      ```console
      $ mkdir -p ~/projekte/shop/backend/logs
      ```
    prompt: Wechsle in bash in das eben angelegte Verzeichnis, ohne den Pfad noch einmal zu tippen. Nutze die History-Expansion.
    answers: ["cd !$", "cd !:$"]
    explanation: |
      `!$` steht für das letzte Wort des vorigen Befehls, hier den Pfad. bash zeigt die ersetzte Zeile an, bevor sie sie ausführt. Ohne History-Expansion geht es mit `Alt+.` (fügt das letzte Argument ein) oder mit der Variablen `$_`. In Standard-fish gibt es `!$` nicht; dort holst du das Argument mit `Alt+.` oder über die Vorschläge.
    resources:
      - title: Bash Manual · Event Designators
        url: https://www.gnu.org/software/bash/manual/html_node/Event-Designators.html
      - title: Bash Manual · Word Designators
        url: https://www.gnu.org/software/bash/manual/html_node/Word-Designators.html

  - id: bash-nach-fish
    type: gap
    title: Von bash nach fish
    prompt: |
      Übertrage die bash-Zeilen aus den Kommentaren in fish-Syntax für deine `~/.config/fish/config.fish`. `ll` soll als Abkürzung (abbreviation) angelegt werden.
    lang: fish
    code: |
      # bash: export EDITOR=nvim
      set ⟦-gx⟧ EDITOR nvim
      # bash: alias ll='ls -lh'
      ⟦abbr⟧ --add ll 'ls -lh'
      # bash: echo "Kernel: $(uname -r)"
      echo "Kernel: ⟦$(uname -r)⟧"
    gaps:
      - label: Exportieren
        hint: "`set` braucht eine Option für „exportieren“, dazu den globalen Gültigkeitsbereich."
        accept: ["-x", "--global --export", "--export --global", "--export"]
      - label: Abkürzung
        hint: Der Befehl heißt wie das englische Wort für Abkürzung, gekürzt auf vier Buchstaben.
      - label: Befehlsersetzung in Anführungszeichen
        hint: Innerhalb doppelter Anführungszeichen funktioniert in fish nur eine der beiden Schreibweisen.
    explanation: |
      `set -gx` setzt eine globale, exportierte Variable – das Gegenstück zu `export`. `abbr --add` legt eine Abkürzung an, die fish beim Tippen zum vollen Befehl aufklappt, sodass in der History der echte Befehl steht. Befehlsersetzung schreibt fish als `(befehl)`, aber **in doppelten Anführungszeichen** nur als `$(befehl)` (seit fish 3.4); `"(uname -r)"` würde wörtlich ausgegeben.
    resources:
      - title: fish · set
        url: https://fishshell.com/docs/current/cmds/set.html
      - title: fish · abbr
        url: https://fishshell.com/docs/current/cmds/abbr.html
      - title: fish · Command substitution
        url: https://fishshell.com/docs/current/language.html#command-substitution

  - id: bashrc-kaputt
    type: bug
    title: Nach dem Login geht nichts mehr
    prompt: |
      Nach einer Änderung an `~/.bashrc` erscheint beim Öffnen jedes neuen Terminals `bash: EDITOR: command not found`. Danach findet bash weder `ls` noch `git`; nur die Programme aus `/opt/tools/bin` laufen. Finde die zwei fehlerhaften Zeilen und korrigiere sie. `/opt/tools/bin` soll **vorne** in `PATH` stehen.
    lang: bash
    code: |
      # ~/.bashrc
      EDITOR = nvim
      export PATH=/opt/tools/bin
      alias ll='ls -lh'
    lines: [2, 3]
    fix:
      - line: 2
        answers: ["EDITOR=nvim", "export EDITOR=nvim", "EDITOR='nvim'", "export EDITOR='nvim'"]
      - line: 3
        answers:
          - export PATH="/opt/tools/bin:$PATH"
          - export PATH=/opt/tools/bin:$PATH
          - PATH="/opt/tools/bin:$PATH"
          - PATH=/opt/tools/bin:$PATH
    explanation: |
      Zeile 2: Mit Leerzeichen um `=` ist das keine Zuweisung, sondern der Aufruf eines Befehls namens `EDITOR` mit den Argumenten `=` und `nvim`. Zeile 3 **ersetzt** `PATH`, statt es zu erweitern; `/usr/bin` fehlt danach, also findet bash weder `ls` noch `git`. Der alte Wert muss mit `:$PATH` angehängt werden. Damit Programme wie `git` den Editor finden, gehört `EDITOR` außerdem exportiert.
    resources:
      - title: Bash Manual · Shell Parameters
        url: https://www.gnu.org/software/bash/manual/html_node/Shell-Parameters.html

  - id: profile-erklaeren
    type: explain
    title: Ein Klassiker aus ~/.profile
    prompt: |
      Diese Zeilen stehen auf Debian und Ubuntu in jeder neuen `~/.profile`. Erkläre, was sie tun, warum sie so geschrieben sind und wann sie wirken.
    lang: bash
    code: |
      # set PATH so it includes user's private bin if it exists
      if [ -d "$HOME/.local/bin" ] ; then
          PATH="$HOME/.local/bin:$PATH"
      fi
    points:
      - Der Block prüft zuerst, ob das Verzeichnis `~/.local/bin` existiert, und nimmt es nur dann in `PATH` auf.
      - Das Verzeichnis wird **vorne** eingefügt, deshalb gewinnen eigene Programme gegen gleichnamige Systemprogramme.
      - Der alte Inhalt bleibt über `:$PATH` erhalten; die Anführungszeichen schützen Pfade mit Leerzeichen.
      - "`export` ist unnötig, weil `PATH` schon eine Umgebungsvariable ist."
      - "`~/.profile` lesen Login-Shells; die Änderung wirkt deshalb erst nach einem neuen Login (oder `source ~/.profile`)."
    explanation: |
      Der Block macht Programme, die du per `pip install --user` oder von Hand nach `~/.local/bin` installierst, ohne vollen Pfad aufrufbar. Er prüft mit `[ -d … ]`, ob das Verzeichnis existiert, damit keine toten Einträge in `PATH` landen. Das neue Verzeichnis steht vorne, der alte Inhalt folgt nach dem Doppelpunkt – so gewinnen deine eigenen Versionen. `export` fehlt bewusst: `PATH` ist bereits exportiert, und eine neue Zuweisung ändert daran nichts. Weil `~/.profile` nur von Login-Shells gelesen wird, siehst du das neue Verzeichnis erst nach dem nächsten Login. Legst du `~/.local/bin` neu an, musst du dich also neu anmelden.
    resources:
      - title: Bash Manual · Bash Startup Files
        url: https://www.gnu.org/software/bash/manual/html_node/Bash-Startup-Files.html

  - id: eigene-shell-einrichten
    type: practice
    title: Dein System kennenlernen und einrichten
    prompt: |
      Arbeite auf deinem eigenen Rechner. Öffne für die Schritte mit bash-Syntax eine bash-Sitzung (`bash` eintippen, `exit` beendet sie wieder).

      1. Finde Distribution, Familie und Kernel-Version heraus.
      2. Finde heraus, welche Login-Shell du hast und was `ls` in fish und in bash jeweils ausführt.
      3. Zeige die Verzeichnisse in `PATH` einzeln untereinander an.
      4. Lege `~/.local/bin/hallo` als ausführbares Skript an, das „Hallo von $USER“ ausgibt, und rufe es ohne Pfad auf – in bash und in fish.
      5. Öffne die man-Page zu `/etc/os-release` und finde heraus, was `VERSION_ID` bedeutet.
    lang: bash
    solution: |
      cat /etc/os-release          # NAME, ID, ID_LIKE
      uname -r                     # Kernel-Version
      echo "$SHELL"                # Login-Shell
      type ls                      # in fish: Funktion mit eza, in bash: /usr/bin/ls oder Alias
      command ls                   # das echte ls ohne Alias
      echo "$PATH" | tr ':' '\n'   # bash: ein Verzeichnis pro Zeile
      # fish: printf '%s\n' $PATH   (PATH ist in fish eine Liste)

      mkdir -p ~/.local/bin
      printf '#!/usr/bin/env bash\necho "Hallo von $USER"\n' > ~/.local/bin/hallo
      chmod +x ~/.local/bin/hallo
      type -a hallo                # steht ~/.local/bin in PATH?
      hallo
      # bash: falls nicht gefunden → export PATH="$HOME/.local/bin:$PATH"
      # fish: fish_add_path ~/.local/bin

      man 5 os-release             # /VERSION_ID eintippen, n für nächsten Treffer
    checklist:
      - Du kennst ID, ID_LIKE und Kernel-Version deines Systems.
      - Du hast mit `type` gesehen, dass `ls` in fish auf CachyOS eine Funktion ist, und mit `command ls` das echte `ls` aufgerufen.
      - Du hast `PATH` Zeile für Zeile gelesen und weißt, welches Verzeichnis zuerst durchsucht wird.
      - "`hallo` läuft ohne Pfadangabe in bash und in fish."
      - Du hast in `man 5 os-release` mit `/` gesucht und die Bedeutung von `VERSION_ID` gefunden (auf einem Rolling Release fehlt sie oft).
    explanation: |
      Diese Übung verbindet alle Bausteine: Distribution erkennen, Suchreihenfolge und Aliase prüfen, `PATH` lesen und erweitern, Hilfe in der man-Page finden. Das Skript in `~/.local/bin` ist der übliche Ort für eigene Werkzeuge, die nur dein Benutzer braucht. In fish ist `PATH` eine Liste, deshalb gibt `printf '%s\n' $PATH` jedes Element einzeln aus.
    resources:
      - title: os-release(5)
        url: https://man7.org/linux/man-pages/man5/os-release.5.html
      - title: fish für Bash-Nutzer
        url: https://fishshell.com/docs/current/fish_for_bash_users.html
