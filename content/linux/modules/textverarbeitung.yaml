id: textverarbeitung
title: Textverarbeitung & Pipes
level: 2
minutes: 210
summary: Du baust aus kleinen Textwerkzeugen überprüfbare Pipelines und unterscheidest Daten, Diagnose und Fehlerstatus.
goals:
  - Du leitest stdin, stdout und stderr gezielt um und erklärst die Reihenfolge.
  - Du filterst, sortierst und zählst Text mit grep, cut, sort, uniq und wc.
  - Du nutzt sed und awk für nachvollziehbare Transformationen und Auswertungen.
  - Du erkennst, wann eine Pipeline einen Fehler verschluckt, und machst ihn mit `pipefail` sichtbar.
  - Du verarbeitest Dateinamen sicher und prüfst jeden Schritt einer Pipeline.
resources:
  - title: Bash · Redirections
    url: https://www.gnu.org/software/bash/manual/html_node/Redirections.html
  - title: Bash · Pipelines
    url: https://www.gnu.org/software/bash/manual/html_node/Pipelines.html
  - title: GNU grep
    url: https://www.gnu.org/software/grep/manual/grep.html
  - title: GNU Coreutils
    url: https://www.gnu.org/software/coreutils/manual/coreutils.html
  - title: GNU sed
    url: https://www.gnu.org/software/sed/manual/sed.html
  - title: GNU awk
    url: https://www.gnu.org/software/gawk/manual/gawk.html
lab: |
  set -e
  cd /home/ops
  # access.log (nginx, Format „combined“) und app.log der Shop-API vom 28.09.2026, 10 bis 12 Uhr.
  # Von 11:05 bis 11:20 fällt der Zahlungsdienst aus. Ein fester Startwert macht die Daten reproduzierbar.
  awk 'function r(n) { s = s * 16807 % 2147483647; return s % n }
  function hms() { return sprintf("%02d:%02d:%02d", t / 3600, t % 3600 / 60, t % 60) }
  function acc(ip, req, st, by, ua) { printf "%s - - [28/Sep/2026:%s +0200] \"%s HTTP/1.1\" %d %d \"-\" \"%s\"\n", ip, hms(), req, st, by, ua > "access.log" }
  function app(lv, msg) { printf "2026-09-28 %s %s %s\n", hms(), lv, msg > "app.log" }
  BEGIN {
    s = 4711; nr = 4811; nh = t = 36000
    split("192.0.2.10 192.0.2.10 192.0.2.10 192.0.2.44 192.0.2.44 198.51.100.7 203.0.113.50 203.0.113.50 203.0.113.77 10.20.0.15", ip, " ")
    ua["192.0.2.10"] = ua["203.0.113.77"] = "Mozilla/5.0 (X11; Linux x86_64; rv:130.0) Gecko/20100101 Firefox/130.0"
    ua["192.0.2.44"] = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36"
    ua["198.51.100.7"] = "ShopApp/3.2 (Android 14)"; ua["10.20.0.15"] = "Go-http-client/1.1"
    ua["203.0.113.50"] = "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
    app("INFO", "[main] shop-api 2.14.1 listening on 127.0.0.1:8080")
    for (t = 36000 + r(20); t < 43200; t += 1 + r(30)) {
      down = t >= 39900 && t < 40800
      if (nh <= t) { k = t; t = nh; acc("203.0.113.5", "GET /health", down ? 503 : 200, down ? 19 : 2, "Blackbox-Exporter/0.25.0"); t = k; nh += 60 }
      a = ip[1 + r(10)]; x = r(100)
      if (x < 34) acc(a, "GET /api/products?page=" (1 + r(5)), 200, 1800 + r(4200), ua[a])
      else if (x < 52) { id = 4600 + r(200)
        if (down && r(2)) { acc(a, "GET /api/orders/" id, 502, 157, ua[a]); app("ERROR", "[payment] upstream connect failed (payment.internal:8443): connection refused") }
        else acc(a, "GET /api/orders/" id, id < 4610 ? 404 : 200, id < 4610 ? 153 : 380 + r(600), ua[a]) }
      else if (x < 62) {
        if (!down) { acc(a, "POST /api/orders", 201, 310 + r(250), ua[a]); app("INFO", "[orders] order " nr++ " created") }
        else if (r(3)) { acc(a, "POST /api/orders", 502, 157, ua[a]); app("ERROR", "[payment] upstream connect failed (payment.internal:8443): connection refused") }
        else { acc(a, "POST /api/orders", 504, 167, ua[a]); app("ERROR", "[payment] upstream timeout after 5000 ms") } }
      else if (x < 72) { f = r(2) ? "/static/app.js" : "/static/style.css"; c = r(3); acc(a, "GET " f, c ? 304 : 200, c ? 0 : f ~ /js/ ? 48211 : 9311, ua[a]) }
      else if (x < 82) { ok = r(4); acc(a, "POST /login", ok ? 200 : 401, ok ? 512 : 48, ua[a]); if (!ok) app("WARN", "[auth] failed login from " a) }
      else if (x < 90) acc(a, "GET /api/cart", down ? 502 : 200, down ? 157 : 220 + r(300), ua[a])
      else if (x < 95) acc(a, "GET /", 200, 5120, ua[a])
      else acc("198.51.100.23", "GET " (r(2) ? "/wp-login.php" : "/.env"), 404, 153, "Mozilla/5.0 zgrab/0.x")
      if (r(40) == 0) app("WARN", "[db] pool usage " (down ? 95 : 70 + r(15)) "% of 20 connections")
    }
  }'
  cat > bestellungen.csv <<'EOF'
  bestellung,datum,kunde,region,betrag,status
  4811,2026-09-28,Bäckerei Kurz,Nord,129.90,bezahlt
  4812,2026-09-28,Café Lindner,Süd,48.50,bezahlt
  4813,2026-09-28,Hofladen Brandt,Ost,310.00,offen
  4814,2026-09-28,Bäckerei Kurz,Nord,64.20,bezahlt
  4815,2026-09-28,"Meyer, Schulz & Partner",West,1840.00,offen
  4816,2026-09-28,Café Lindner,Süd,22.00,storniert
  4817,2026-09-28,Weinhandel Roth,West,512.40,bezahlt
  4818,2026-09-28,Hofladen Brandt,Ost,97.10,bezahlt
  4819,2026-09-28,Kiosk am Markt,Nord,15.80,bezahlt
  4820,2026-09-28,Weinhandel Roth,West,288.00,offen
  EOF
  cat > app.conf <<'EOF'
  # Shop-API, Umgebung dev
  listen = 127.0.0.1:8080
  db_url = postgres://shop@localhost:5432/shop_dev
  cache_url = redis://localhost:6379/0
  # log_level = debug
  log_level = info
  EOF
  mkdir -p archiv
  head -n 30 app.log > archiv/app-2026-09-26.log
  tail -n 25 app.log > archiv/app-2026-09-27.log
  grep ERROR app.log > 'archiv/fehler export.log'
  chown -R ops:ops /home/ops
  touch -d '2026-09-28 12:00' access.log app.log bestellungen.csv app.conf archiv archiv/*
lesson: |
  In einer Logdatei stehen zehntausend Anfragen. Du möchtest wissen, welche IP-Adressen die meisten Fehler verursachen. Du könntest die Datei im Editor durchsuchen oder ein großes Programm schreiben. Eine Pipeline zerlegt die Frage in kleine Schritte: relevante Zeilen auswählen, die IP extrahieren, gleiche Werte zusammenführen und nach Häufigkeit sortieren. Jeder Schritt lässt sich einzeln ansehen und prüfen.

  Dabei geht es um mehr als kurze Befehle. Gute Textverarbeitung braucht ein Datenformat, einen klaren Vertrag zwischen Werkzeugen und einen Umgang mit Fehlern. Eine erfolgreiche Pipeline kann sonst die falsche Zahl liefern. Alle Beispiele verwenden Bash; starte für die Übungen eine Bash oder speichere die Befehle in einem Bash-Skript. Die interaktive fish-Syntax ist nicht für jedes Konstrukt identisch.

  Die Beispiele mit „Im Terminal“ kannst du direkt ausprobieren. Im Home-Verzeichnis des Terminals liegen Beispieldaten vom 28. September 2026 zwischen 10 und 12 Uhr: `access.log` mit 576 Anfragen an einen nginx-Webserver, `app.log` mit den Meldungen der Shop-API dahinter, `bestellungen.csv`, die Konfiguration `app.conf` und ein Ordner `archiv` mit älteren Logs. Gegen 11:05 Uhr fiel der Zahlungsdienst aus. Die Beispiele finden diesen Vorfall in den Daten wieder.

  ## Drei Datenströme und ihre Umleitungen

  Jeder Prozess erhält normalerweise drei offene Dateideskriptoren: **0** ist stdin, **1** stdout, **2** stderr. stdin liefert Eingabe. stdout enthält das Ergebnis. stderr enthält Diagnosen. Die Shell verbindet diese Deskriptoren vor dem Start des Programms mit Dateien, Terminal oder Pipes. Das Programm muss dafür nicht wissen, ob seine Ausgabe auf einem Bildschirm oder in einer Datei landet ([Bash · Redirections](https://www.gnu.org/software/bash/manual/html_node/Redirections.html)).

  ```console vm
  $ grep ERROR app.log > fehler.log
  $ wc -l fehler.log
  10 fehler.log
  $ grep WARN app.log >> fehler.log
  $ wc -l < fehler.log
  32
  ```

  `>` öffnet die Zieldatei zum Überschreiben, `>>` zum Anhängen. Ein fehlendes Eingabeargument lässt viele Werkzeuge von stdin lesen. Deshalb gibt `wc -l < fehler.log` nur die Zahl aus: Die Shell öffnet die Datei, `wc` liest sie über stdin und kennt keinen Dateinamen.

  Die Shell richtet Umleitungen ein, bevor sie das Programm startet, und `>` leert das Ziel dabei sofort. Ist das Ziel zugleich die Eingabe, ist sie leer, bevor das Programm die erste Zeile liest:

  ```console vm
  $ cp bestellungen.csv kopie.csv
  $ sort kopie.csv > kopie.csv
  $ wc -l kopie.csv
  0 kopie.csv
  ```

  Dasselbe passiert mit `sed 's/a/b/' datei > datei` oder `grep -v x datei > datei`. Schreibe in eine andere Datei, prüfe sie und ersetze das Original erst danach, etwa mit `mv`. `sort -o kopie.csv kopie.csv` ist eine Ausnahme: `sort` liest die ganze Eingabe und öffnet die Ausgabedatei erst danach selbst ([Coreutils · sort](https://www.gnu.org/software/coreutils/manual/html_node/sort-invocation.html)).

  Umleitungen werden von links nach rechts verarbeitet. `2>&1` bedeutet „verbinde stderr mit dem aktuellen Ziel von stdout“, nicht „halte beide für immer gekoppelt“. `ls` schreibt im folgenden Beispiel den gefundenen Namen nach stdout und die Meldung zur fehlenden Datei nach stderr:

  ```console vm
  $ ls app.log fehlt.log > alles.txt 2>&1
  $ cat alles.txt
  ls: cannot access 'fehlt.log': No such file or directory
  app.log
  $ ls app.log fehlt.log 2>&1 > nur-daten.txt
  ls: cannot access 'fehlt.log': No such file or directory
  $ cat nur-daten.txt
  app.log
  ```

  Im ersten Fall zeigt stdout schon auf `alles.txt`, wenn `2>&1` stderr dorthin lenkt. Im zweiten kopiert `2>&1` das Ziel, das stdout in diesem Moment hat, also das Terminal. Erst danach wird stdout zur Datei umgebogen. Bash bietet mit `&> alles.txt` eine Kurzform für beide Ströme; diese ist keine portable POSIX-sh-Schreibweise. Die Trennung hilft in Skripten: Maschinen lesen stdout, Menschen lesen stderr.

  Ein **Here-Document** liefert mehrere Zeilen als Eingabe. Mit einem gequoteten Begrenzer bleiben Variablen und Substitutionen im Text unverändert. Ein **Here-String** liefert einen einzelnen String mit abschließendem Zeilenumbruch:

  ```bash vm
  cat <<'EOF'
  Der Text $HOME bleibt wörtlich.
  EOF
  grep 'api' <<< 'api bereit'
  ```

  > [!MERKE]
  > Eine Umleitung gehört zur Shell. Prüfe ihre Wirkung, bevor du über das Verhalten des gestarteten Programms nachdenkst.

  ## Pipes lesen und Treffer finden

  Eine Pipe `|` verbindet stdout des linken Prozesses mit stdin des rechten. stderr bleibt normalerweise am Terminal. Die Programme können gleichzeitig arbeiten; sie müssen nicht erst die vollständige Zwischenmenge als Datei speichern. Das ist der praktische Kern der Unix-Idee, Werkzeuge mit schmaler Aufgabe zu kombinieren ([Bash · Pipelines](https://www.gnu.org/software/bash/manual/html_node/Pipelines.html)).

  Für einen ersten Blick genügen `head -n 5 app.log`, `tail -n 20 app.log` und `less app.log`. `tail -f` verfolgt neu angehängte Zeilen; `tail -F` kann bei üblichen Logrotationen dem Namen folgen. `cat` gibt eine Datei komplett aus, eignet sich aber bei sehr großen Logs selten als erster Untersuchungsschritt. Mit `tee` speicherst du einen Strom und reichst ihn zugleich weiter. `tee -a` hängt an ([Coreutils · tee](https://www.gnu.org/software/coreutils/manual/html_node/tee-invocation.html)).

  ```console vm
  $ head -n 3 app.log
  2026-09-28 10:00:00 INFO [main] shop-api 2.14.1 listening on 127.0.0.1:8080
  2026-09-28 10:00:25 INFO [orders] order 4811 created
  2026-09-28 10:03:45 INFO [orders] order 4812 created
  $ grep -n -i 'timeout' app.log
  43:2026-09-28 11:05:17 ERROR [payment] upstream timeout after 5000 ms
  54:2026-09-28 11:17:51 ERROR [payment] upstream timeout after 5000 ms
  $ grep -c -E 'WARN|ERROR' app.log
  32
  $ grep -v '^#' app.conf | tee ohne-kommentare.conf
  listen = 127.0.0.1:8080
  db_url = postgres://shop@localhost:5432/shop_dev
  cache_url = redis://localhost:6379/0
  log_level = info
  ```

  [`grep`](https://www.gnu.org/software/grep/manual/grep.html) wählt Zeilen aus. `-n` ergänzt Zeilennummern, `-i` ignoriert Großschreibung, `-v` kehrt die Auswahl um, `-r` sucht rekursiv und `-c` zählt ausgewählte Zeilen. `-o` gibt nur die passenden Teile aus; mehrere Treffer einer Zeile können dann mehrere Ausgabezeilen erzeugen. `-w` verlangt Wortgrenzen. Das Wortmodell orientiert sich dabei an Buchstaben, Ziffern und Unterstrich, nicht an deinem fachlichen Begriff einer Kennung.

  Reguläre Ausdrücke beschreiben Muster: `^` markiert den Zeilenanfang, `$` das Ende, `.` ein beliebiges Zeichen und `[0-9]` eine Ziffer. `grep -E` aktiviert erweiterte Ausdrücke mit `|`, `+` und Klammern ohne die zusätzlichen Backslashes der grundlegenden Syntax. Quote Muster, damit die Shell sie nicht vorher als Dateimuster interpretiert. Wenn du einen festen Text suchst, ist `-F` klarer als mühsames Maskieren:

  ```console vm
  $ grep -cwF '192.0.2.1' access.log
  0
  $ grep -cF '192.0.2.1' access.log
  134
  ```

  Mit `-F` ist der Punkt in `192.0.2.1` wirklich ein Punkt. Trotzdem findet `grep` die Zeichenkette in 134 Zeilen, denn sie steckt in `192.0.2.10`. Erst `-w` verlangt, dass vor und nach dem Treffer kein Wortzeichen steht. Die Adresse `192.0.2.1` selbst kommt im Log nicht vor.

  ## Auswählen, sortieren und zählen

  Für klar getrennte Spalten ist `cut` passend. `cut -d, -f4` nimmt das vierte durch Kommas getrennte Feld, in `bestellungen.csv` also die Region:

  ```console vm
  $ head -n 3 bestellungen.csv
  bestellung,datum,kunde,region,betrag,status
  4811,2026-09-28,Bäckerei Kurz,Nord,129.90,bezahlt
  4812,2026-09-28,Café Lindner,Süd,48.50,bezahlt
  $ cut -d, -f4 bestellungen.csv | sort | uniq -c
        1  Schulz & Partner"
        3 Nord
        2 Ost
        2 Süd
        2 West
        1 region
  ```

  Die Ausgabe zeigt die Grenze von `cut`. Der Kunde „Meyer, Schulz & Partner“ steht korrekt in Anführungszeichen, aber `cut` kennt kein CSV-Quoting und trennt auch am Komma im Namen. In der Regionsspalte landet deshalb ` Schulz & Partner"`. Gequotete Kommas und mehrzeilige Felder brauchen ein Werkzeug, das CSV versteht. Genau diese Grenze entscheidet, wann eine kurze Pipeline in ein kleines Python-Programm wechseln sollte. Die Kopfzeile `region` zählt `uniq -c` ebenfalls mit; `tail -n +2` hätte sie übersprungen.

  Im Log von nginx trennen einfache Leerzeichen die Felder bis zum Status, `cut -d' ' -f9` liefert also den HTTP-Status. Mit `sort | uniq -c | sort -nr` wird daraus eine Häufigkeitstabelle:

  ```console vm
  $ cut -d' ' -f9 access.log | sort | uniq -c | sort -nr
      430 200
       48 201
       32 304
       22 404
       15 503
       15 502
       12 401
        2 504
  $ cut -d' ' -f1 access.log | sort -u | wc -l
  8
  ```

  `sort` sortiert standardmäßig als Text und abhängig von der Locale. `sort -n` vergleicht Zahlen; `-k2,2n` beschränkt den numerischen Schlüssel auf Feld zwei. Mit `-t:` wählst du einen Feldtrenner. `-h` versteht Größen wie `2K` und `1M`, `-u` entfernt gleiche Sortierschlüssel. Für reproduzierbare byteweise Reihenfolge setzt du gezielt `LC_ALL=C sort` ([Coreutils · sort](https://www.gnu.org/software/coreutils/manual/html_node/sort-invocation.html)).

  ```console vm
  $ printf '12\n3\n100\n' | sort
  100
  12
  3
  $ printf '12\n3\n100\n' | sort -n
  3
  12
  100
  $ printf 'api 12\nweb 3\n' | sort -k2,2n
  web 3
  api 12
  ```

  `uniq` führt **benachbarte** gleiche Zeilen zusammen. Deshalb ist `sort | uniq -c` ein Häufigkeitszähler, `uniq -c` auf unsortierten Ereignissen aber oft falsch. `wc -l` zählt Zeilenumbrüche, `wc -w` Wörter und `wc -c` Bytes; eine letzte Zeile ohne Zeilenumbruch ist für `wc -l` kein weiterer Zeilenumbruch. `tr` übersetzt oder löscht einzelne Zeichen. Es ersetzt keine beliebig langen Wörter ([Coreutils · uniq](https://www.gnu.org/software/coreutils/manual/html_node/uniq-invocation.html)).

  ## Transformationen mit sed und awk

  `sed` arbeitet standardmäßig zeilenweise. `s/alt/neu/` ersetzt den ersten passenden Teil pro Zeile; `g` ersetzt alle. Eine Adresse beschränkt die Operation. `-n` unterdrückt die automatische Ausgabe, sodass `p` ausgewählte Zeilen gezielt ausgeben kann ([GNU sed](https://www.gnu.org/software/sed/manual/sed.html)).

  ```console vm
  $ sed -n '2,3p' app.conf
  listen = 127.0.0.1:8080
  db_url = postgres://shop@localhost:5432/shop_dev
  $ sed '/^#/d' app.conf
  listen = 127.0.0.1:8080
  db_url = postgres://shop@localhost:5432/shop_dev
  cache_url = redis://localhost:6379/0
  log_level = info
  $ sed 's/localhost/10.0.4.12/g; s/_dev$/_prod/' app.conf > app.prod.conf
  $ grep -n '10.0.4.12' app.prod.conf
  3:db_url = postgres://shop@10.0.4.12:5432/shop_prod
  4:cache_url = redis://10.0.4.12:6379/0
  ```

  Arbeite zunächst ohne `-i`. So siehst du den Effekt, ohne die Quelle zu verändern. GNU sed kann mit `-i.bak` ein Backup anlegen, aber ein Backup ersetzt weder eine Prüfung noch ein Versionskontrollsystem. Unterschiede zu BSD sed sind ein weiterer Grund, im Team die erwartete Umgebung zu dokumentieren.

  `awk` kombiniert Muster mit Aktionen. `$1` ist das erste Feld, `$0` die ganze Zeile; standardmäßig trennt Leerraum Felder. `-F:` setzt einen anderen Trenner. Eine Aktion läuft nur für Zeilen, auf die das davorstehende Muster passt. `END` läuft nach der letzten Zeile ([GNU awk · Patterns and Actions](https://www.gnu.org/software/gawk/manual/html_node/Patterns-and-Actions.html)). Debian installiert als `awk` standardmäßig mawk statt GNU awk. Für die Beispiele hier ist das egal, sie nutzen nur den Sprachumfang, den POSIX vorschreibt ([mawk(1)](https://manpages.debian.org/bookworm/mawk/mawk.1.en.html)).

  ```console vm
  $ awk '$9 == 404 { print $7 }' access.log | sort | uniq -c
       14 /.env
        2 /api/orders/4609
        6 /wp-login.php
  $ awk '{ sum += $10 } END { printf "%.1f MB\n", sum / 1000000 }' access.log
  1.0 MB
  $ awk -F: '$3 >= 1000 { print $1 }' /etc/passwd
  nobody
  ops
  ```

  Der erste Befehl zeigt, wer ins Leere fragt: Ein Scanner sucht nach `.env`-Dateien und einer WordPress-Anmeldung. Der letzte ist eine technische Auswahl nach UID, keine Liste „aller Menschen“: Neben `ops` erscheint `nobody` mit der UID 65534. Diese Unterscheidung zwischen Datenfilter und fachlicher Aussage gehört zu einer verlässlichen Auswertung.

  ## Eine Logauswertung und ihre Grenzen

  Im Format „combined“ von nginx steht die Client-IP in Feld 1, Datum und Uhrzeit in Feld 4 (mit `[` davor), der Pfad in Feld 7, der Status in Feld 9 und die Größe der Antwort in Bytes in Feld 10. Ein anderes `log_format` verschiebt alle Nummern ([nginx · log_format](https://nginx.org/en/docs/http/ngx_http_log_module.html#log_format)). Prüfe die Feldnummern deshalb an einer echten Zeile, bevor du zählst. Dann zählen wir Antworten ab Status 500 pro IP:

  ```console vm
  $ head -n 1 access.log
  203.0.113.5 - - [28/Sep/2026:10:00:00 +0200] "GET /health HTTP/1.1" 200 2 "-" "Blackbox-Exporter/0.25.0"
  $ awk '$9 >= 500 { print $1 }' access.log | \
      LC_ALL=C sort | uniq -c | sort -nr | head -n 5
       15 203.0.113.5
        5 192.0.2.44
        4 203.0.113.77
        4 203.0.113.50
        2 198.51.100.7
  ```

  Ganz oben steht `203.0.113.5`, das Monitoring. Es fragt jede Minute `/health` ab und hat in jeder Minute der Störung eine Fehlerantwort bekommen. Die Zahl heißt also nicht „dieser Client macht Ärger“, sondern „dieser Client hat die meisten Fehlerantworten gesehen“.

  Fehler pro Zeitfenster erhältst du über Feld 4. `substr($4, 14, 4)` schneidet aus `[28/Sep/2026:11:07:42` die Zeichen 14 bis 17 heraus, also `11:0`. Mit der angehängten `0` steht in jeder Zeile der Beginn ihres Zehn-Minuten-Fensters:

  ```console vm
  $ awk '$9 >= 500 { print substr($4, 14, 4) "0" }' access.log | uniq -c
       12 11:00
       20 11:10
  ```

  Hier genügt `uniq -c` ohne `sort`, weil das Log zeitlich sortiert ist. Bei zusammengeführten Logs mehrerer Server gilt das nicht mehr. Benenne außerdem die Zeitzone des Logs, hier `+0200`. Eine Zeile ist hier eine Anfrage, ein Fehler ist ein Status ab 500, und das Zeitfenster ist der Inhalt der Eingabedatei. Ohne diese Annahmen klingt ein Zahlenbericht genauer, als er ist.

  Dateinamen sind kein beliebiger zeilenweiser Text. Sie können Leerzeichen und Zeilenumbrüche enthalten. `find -print0` und `xargs -0` vereinbaren deshalb das Nullbyte als Trenner. Mit `-r` startet GNU xargs bei leerer Eingabe kein Kommando. Häufig ist `find … -exec … {} +` noch übersichtlicher ([GNU findutils · Safe File Name Handling](https://www.gnu.org/software/findutils/manual/html_node/find_html/Safe-File-Name-Handling.html)).

  ```console vm
  $ find archiv -type f -name '*.log' -print0 | xargs -0 -r wc -l
    30 archiv/app-2026-09-26.log
    25 archiv/app-2026-09-27.log
    10 archiv/fehler export.log
    65 total
  $ find archiv -type f -name '*.log' -exec wc -l {} +
    30 archiv/app-2026-09-26.log
    25 archiv/app-2026-09-27.log
    10 archiv/fehler export.log
    65 total
  ```

  Ohne Nullbyte zerlegt die Shell den Namen `fehler export.log` am Leerzeichen in zwei Argumente:

  ```console vm fails
  $ wc -l $(find archiv -name '*.log')
    30 archiv/app-2026-09-26.log
    25 archiv/app-2026-09-27.log
  wc: archiv/fehler: No such file or directory
  wc: export.log: No such file or directory
    55 total
  ```

  > [!PRAXIS]
  > Zeige im Review eine kleine Eingabedatei samt erwarteter Ausgabe. Prüfe leere Daten, mehrere gleiche Einträge und ein ungewöhnliches Feld. Erst dann lässt du die Pipeline auf einen großen Bestand los.

  ## Exit-Status in Pipelines und pipefail

  Jedes Programm endet mit einem Exit-Status: 0 heißt Erfolg, alles andere Fehler. `grep` liefert 0 bei Treffern, 1 ohne Treffer und 2 bei einem Fehler wie einer fehlenden Datei ([GNU grep · Exit Status](https://www.gnu.org/software/grep/manual/grep.html#Exit-Status)). Eine Pipeline meldet in Bash standardmäßig nur den Status ihres **letzten** Kommandos. Was davor schiefgeht, verschwindet:

  ```console vm
  $ grep ERROR app.log.1 | wc -l
  grep: app.log.1: No such file or directory
  0
  $ echo $?
  0
  $ grep ERROR app.log.1 | wc -l; echo "${PIPESTATUS[@]}"
  grep: app.log.1: No such file or directory
  0
  2 0
  ```

  Ein Cronjob mit dieser Zeile meldet Erfolg und berichtet „0 Fehler“, obwohl er die Datei nie gelesen hat. Das Array `PIPESTATUS` enthält die Status aller Kommandos der letzten Pipeline. Mit `set -o pipefail` liefert die Pipeline den Status des letzten Kommandos, das nicht mit 0 endete ([Bash · Pipelines](https://www.gnu.org/software/bash/manual/html_node/Pipelines.html)):

  ```console vm
  $ set -o pipefail
  $ grep ERROR app.log.1 | wc -l; echo $?
  grep: app.log.1: No such file or directory
  0
  2
  $ grep CRITICAL app.log | wc -l; echo $?
  0
  1
  $ seq 100000 | head -n 1; echo $?
  1
  141
  $ set +o pipefail
  ```

  `pipefail` macht den Lesefehler sichtbar, bringt aber zwei Fälle mit, die du bewusst behandeln musst. `grep` ohne Treffer ist jetzt ein Fehler, obwohl „keine Meldung CRITICAL“ ein gutes Ergebnis ist. Und `head` hört nach einer Zeile auf zu lesen; `seq` bekommt beim nächsten Schreiben das Signal SIGPIPE und endet mit 141, also 128 plus Signal 13. In einem systemd-Dienst sieht dieselbe Zeile anders aus: systemd lässt Dienste SIGPIPE standardmäßig ignorieren (`IgnoreSIGPIPE=yes`), dann meldet `seq` „write error: Broken pipe“ und endet mit 1. In Skripten mit `set -euo pipefail` lässt du deshalb nur den erwarteten Status durch, etwa mit `{ grep CRITICAL app.log || [ $? -eq 1 ]; } | wc -l`. Das Scripting-Modul vertieft diese Regeln.

  > [!WARNING]
  > Ein Bericht, der bei fehlender Eingabe „0“ ausgibt und mit Status 0 endet, ist schlimmer als ein Abbruch: Niemand bemerkt den Fehler. Lass Skripte, die Zahlen für andere erzeugen, bei einem Lesefehler mit einem Status ungleich 0 enden.

  ## Häufige Fehler

  Die meisten falschen Zahlen entstehen durch ein Muster, das mehr oder weniger trifft als gedacht. `grep ' 50'` sucht scheinbar nach Statuscodes, trifft aber auch eine Antwortgröße wie `5021`. `grep ' 5[0-9][0-9] '` trifft auch eine Antwort mit 512 Bytes. Wähle das Feld statt einer Zeichenkette irgendwo in der Zeile: `awk '$9 >= 500'`.

  `uniq -c` ohne vorheriges `sort` zählt nur benachbarte Zeilen; dieselbe IP taucht dann mehrfach im Ergebnis auf. `sort datei > datei` und `sed … datei > datei` leeren die Eingabe. Vermeide `for datei in $(find …)`: Die Shell zerlegt die Ausgabe erneut. Prüfe beim Zählen, ob du Zeilen, Treffer, Bytes oder eindeutige Werte meinst. Und verarbeite JSON, CSV und strukturierte Journaldaten mit passenden Parsern, sobald Verschachtelung oder Quoting relevant werden.

  > [!INTERVIEW]
  > „Warum muss vor `uniq` oft `sort` stehen?“ – `uniq` vergleicht Nachbarzeilen. Sortieren stellt sicher, dass alle gleichen Schlüssel zusammenliegen; nur dann erhältst du globale Häufigkeiten.

  ## Zusammenfassung

  - stdin, stdout und stderr haben verschiedene Aufgaben.
  - Umleitungen wirken von links nach rechts und vor dem Programmstart; `>` leert das Ziel sofort.
  - Pipes verbinden Werkzeuge über einen vereinbarten Datenstrom.
  - Fester Text, Regex und Dateimuster sind verschiedene Sprachen.
  - `sort | uniq -c` zählt gleiche Zeilen; `awk` verarbeitet Felder.
  - Nullbytes schützen Dateinamen vor versehentlicher Zerlegung.
  - Ohne `pipefail` meldet eine Pipeline nur den Status ihres letzten Kommandos.
  - Ein Bericht braucht ein Datenformat, ein Zeitfenster und Fehlerprüfung.
exercises:
  - id: stroeme
    type: choice
    title: Daten von Diagnosen trennen
    prompt: Was verbindet eine normale Bash-Pipe `a | b`?
    options:
      - text: stdout von a mit stdin von b
        correct: true
        why: Die Pipe verbindet genau diese beiden Deskriptoren.
      - text: stderr von a mit stdout von b
        correct: false
        why: stderr bleibt ohne zusätzliche Umleitung am bisherigen Ziel.
      - text: Den Exit-Code von a mit stdin von b
        correct: false
        why: Statuswerte sind keine automatisch übertragenen Textdaten.
    explanation: Die Pipe transportiert Bytes, keine Exit-Codes. Diagnosen müssen ausdrücklich einbezogen werden, wenn sie Teil des Stroms sein sollen.
    resources:
      - title: Bash · Pipelines
        url: https://www.gnu.org/software/bash/manual/html_node/Pipelines.html
  - id: analyse-reihenfolge
    type: order
    title: Häufigkeiten ermitteln
    prompt: Sortiere die Schritte zu einer Auswertung der häufigsten Werte. Jeder Schritt nutzt das Ergebnis des vorigen.
    lang: text
    lines: |
      Relevante Ereigniszeilen auswählen
      Aus jeder Zeile den gesuchten Schlüssel extrahieren
      Die Schlüssel sortieren
      Benachbarte gleiche Schlüssel zählen
      Die gezählten Häufigkeiten numerisch absteigend sortieren
    explanation: Erst die Auswahl und Extraktion definieren, was gezählt wird. Sortierung gruppiert identische Schlüssel vor `uniq -c`; die zweite Sortierung ordnet das Ergebnis nach Anzahl.
  - id: nachbarn
    type: output
    title: Drei Gruppen oder zwei?
    prompt: Welche Ausgabe entsteht? Führende Leerzeichen sind hier durch awk entfernt.
    lang: bash
    code: |
      printf 'api\nweb\napi\n' | uniq -c | awk '{ print $1, $2 }'
    expected: |
      1 api
      1 web
      1 api
    verify: true
    explanation: Die beiden api-Zeilen sind keine Nachbarn und bilden daher zwei Gruppen. Ein vorgeschaltetes `sort` würde sie zusammenführen.
    resources:
      - title: Coreutils · uniq
        url: https://www.gnu.org/software/coreutils/manual/html_node/uniq-invocation.html
  - id: zahlen
    type: output
    title: Text oder Zahl?
    prompt: Welche Zeilen gibt diese numerische Sortierung aus?
    lang: bash
    code: |
      printf '20\n3\n100\n' | LC_ALL=C sort -n
    expected: |
      3
      20
      100
    verify: true
    explanation: |
      `-n` vergleicht den Zahlenwert und nicht das erste Zeichen. Ohne die Option würde die Textsortierung 100 vor 20 und 3 setzen.
    resources:
      - title: Coreutils · sort
        url: https://www.gnu.org/software/coreutils/manual/html_node/sort-invocation.html
  - id: pipefail-status
    type: output
    title: Welcher Status kommt an?
    prompt: |
      Was steht auf stdout? `fehlt.log` existiert nicht. Die Fehlermeldung von `grep` geht nach stderr und gehört nicht zur Antwort.
    lang: bash
    code: |
      grep ERROR fehlt.log | wc -l
      echo "ohne pipefail: $?"
      set -o pipefail
      grep ERROR fehlt.log | wc -l
      echo "mit pipefail: $?"
    expected: |
      0
      ohne pipefail: 0
      0
      mit pipefail: 2
    verify: true
    explanation: |
      `wc -l` zählt in beiden Fällen null Zeilen und endet erfolgreich. Ohne `pipefail` ist das der Status der ganzen Pipeline, der Lesefehler verschwindet. Mit `pipefail` zählt der Status des letzten Kommandos, das nicht mit 0 endete: `grep` meldet 2 für die fehlende Datei. Ohne Treffer in einer vorhandenen Datei hätte `grep` 1 geliefert.
    resources:
      - title: Bash · Pipelines
        url: https://www.gnu.org/software/bash/manual/html_node/Pipelines.html
      - title: GNU grep · Exit Status
        url: https://www.gnu.org/software/grep/manual/grep.html#Exit-Status
  - id: grep-schreiben
    type: command
    title: Fehler mit Zeilennummern
    prompt: Suche mit grep ohne Beachtung der Großschreibung nach dem festen Text `error` in `app.log` und zeige Zeilennummern.
    answers: ["grep -Fin error app.log", "grep --fixed-strings --ignore-case --line-number error app.log"]
    explanation: |
      `-F` macht den Suchtext wörtlich, `-i` ignoriert Großschreibung und `-n` zeigt die Fundstelle. Das ist für eine überprüfbare Diagnose hilfreicher als kopierte Treffer ohne Kontext.
    resources:
      - title: GNU grep
        url: https://www.gnu.org/software/grep/manual/grep.html
  - id: felder-summe
    type: gap
    title: Laufzeiten summieren
    prompt: Ergänze das zweite Feld und den Abschlussblock.
    lang: bash
    code: |
      awk '{ sum += ⟦$2⟧ } ⟦END⟧ { print sum }' laufzeiten.txt
    gaps:
      - label: Zweites Feld
        hint: awk nummeriert Felder ab eins und stellt ein Dollarzeichen davor.
      - label: Abschlussaktion
        hint: Dieses großgeschriebene Muster läuft nach der letzten Eingabezeile.
    explanation: Jede Zeile erhöht `sum` um ihre zweite Spalte. `END` gibt den Gesamtwert einmal aus, nachdem alle Zeilen verarbeitet wurden.
    resources:
      - title: GNU awk · Patterns and Actions
        url: https://www.gnu.org/software/gawk/manual/html_node/Patterns-and-Actions.html
  - id: beide-stroeme
    type: command
    title: Einen Bericht samt Fehlern speichern
    prompt: Starte `./report.sh` und überschreibe `bericht.log` mit stdout und stderr. Verwende Bash.
    answers: ["./report.sh > bericht.log 2>&1", "./report.sh &> bericht.log"]
    explanation: Zuerst wird stdout zur Datei umgebogen, dann stderr an dasselbe Ziel gebunden. Die umgekehrte Reihenfolge lässt stderr auf dem ursprünglichen stdout.
    resources:
      - title: Bash · Redirections
        url: https://www.gnu.org/software/bash/manual/html_node/Redirections.html
  - id: sed-schreiben
    type: command
    title: Eine Änderung zuerst ansehen
    prompt: Ersetze mit sed jedes `dev` pro Zeile durch `prod` in `config.txt`. Gib nur das Ergebnis aus und ändere die Datei nicht.
    answers: ["sed 's/dev/prod/g' config.txt", "sed -e 's/dev/prod/g' config.txt"]
    explanation: Das globale Flag `g` ersetzt alle Treffer einer Zeile. Ohne `-i` bleibt die Quelldatei unverändert und das Ergebnis kann vor einer Übernahme geprüft werden.
    resources:
      - title: GNU sed
        url: https://www.gnu.org/software/sed/manual/sed.html
  - id: leere-datei
    type: bug
    title: Nach dem Sortieren fehlen die Daten
    prompt: Die Eingabe enthält Daten, nach dem Befehl ist sie leer. Korrigiere die Zeile so, dass das Ergebnis in `daten.sortiert.txt` landet.
    lang: bash
    code: |
      sort daten.txt > daten.txt
    lines: [1]
    fix:
      - line: 1
        answers: ["sort daten.txt > daten.sortiert.txt"]
    explanation: Die Shell öffnet und leert das Ausgabeziel, bevor `sort` die Eingabe öffnet. Zwei verschiedene Pfade verhindern diese Selbstüberschreibung.
  - id: pipeline-erklaeren
    type: explain
    title: Was zählt dieser Bericht?
    prompt: Erkläre Auswahl, Gruppierung und Sortierung. Die Eingabe enthält IP-Adresse in Feld zwei und HTTP-Status in Feld drei.
    lang: bash
    code: |
      awk '$3 >= 500 { print $2 }' access.log | sort | uniq -c | sort -nr
    points:
      - Es werden nur Zeilen mit numerischem Status ab 500 ausgewählt.
      - awk gibt je passender Zeile die IP aus Feld zwei aus.
      - sort gruppiert gleiche IPs für uniq -c.
      - Die letzte Sortierung ordnet nach Häufigkeit absteigend.
    explanation: Die Pipeline zählt Fehlerereignisse pro IP im Inhalt der Datei. Sie zählt weder einzelne Personen noch alle HTTP-Fehler, denn etwa 404 liegt unter 500.
  - id: logfile-bericht
    type: practice
    title: Ein überprüfbarer Fehlerbericht
    prompt: Schreibe eine Bash-Pipeline für dieses Logformat und erzeuge Fehlerzahlen pro Stunde. Nutze ein Beispiel mit zwei Fehlern in Stunde 10, einem in 11 und einem Erfolg. Speichere das Ergebnis zusätzlich mit tee in `stunden.txt`.
    lang: bash
    solution: |
      printf '%s\n' \
        '2026-09-28T10 192.0.2.1 500' \
        '2026-09-28T10 192.0.2.2 503' \
        '2026-09-28T11 192.0.2.1 502' \
        '2026-09-28T11 192.0.2.2 200' > access.log
      awk '$3 >= 500 { print $1 }' access.log |
        LC_ALL=C sort | uniq -c |
        awk '{ print $2, $1 }' | tee stunden.txt
    checklist:
      - Das Zeitformat und die Feldnummern sind dokumentiert.
      - Stunde 10 enthält zwei Fehler und Stunde 11 einen.
      - Der Erfolg mit Status 200 wird nicht gezählt.
      - Die Quelldatei bleibt erhalten und die Ausgabe wird gespeichert.
    explanation: Das kleine Testlog macht die fachliche Definition prüfbar. Die Umordnung nach `uniq -c` liefert zuerst den Zeitstempel und danach die Anzahl, sodass der Bericht gut weiterverarbeitet werden kann.
  - id: fehlerbericht-reparieren
    type: scenario
    title: Der Bericht zählt mehr Fehler, als es gab
    prompt: |
      Für das Incident-Review zum Ausfall des Zahlungsdienstes am 30. September braucht das Team eine Liste: Welche Clients haben zwischen 14 und 16 Uhr wie viele Antworten mit Status 500 bis 599 bekommen? Das Log dieses Zeitraums liegt in `/var/log/nginx/access.log.1`. Ein Kollege hat dafür das Skript `~/bin/fehler-pro-ip` geschrieben und damit den Bericht `~/review/fehler-pro-ip.txt` erzeugt. Das Dashboard zählt für den Zeitraum 46 Antworten mit Status 5xx. Im Bericht kommen über 100 zusammen, und manche IP-Adressen stehen mehrfach darin.

      Repariere das Skript und erzeuge den Bericht damit neu. So soll es sich verhalten:

      - `fehler-pro-ip LOGDATEI` gibt eine Zeile pro Client-IP mit mindestens einer Antwort 5xx aus: zuerst die Anzahl, dann die IP, getrennt durch Leerraum, die höchste Anzahl zuerst.
      - Das Skript soll später jede Nacht für den Vortag laufen. Fehlt die Logdatei oder ist sie nicht lesbar, endet es mit einem Exit-Code ungleich 0. Ein Log ohne Antworten 5xx ergibt eine leere Ausgabe und Exit-Code 0.
    setup: |
      set -e
      # access.log.1 vom 30.09.2026, 14 bis 16 Uhr. Von 14:32 bis 14:51 antwortet der Zahlungsdienst nicht.
      awk 'function r(n) { s = s * 16807 % 2147483647; return s % n }
      function acc(ip, req, st, by, ua) { printf "%s - - [30/Sep/2026:%02d:%02d:%02d +0200] \"%s HTTP/1.1\" %d %d \"-\" \"%s\"\n", ip, t / 3600, t % 3600 / 60, t % 60, req, st, by, ua }
      BEGIN {
        s = 1309; nh = 50400
        n = split("192.0.2.17 192.0.2.17 192.0.2.17 198.51.100.40 198.51.100.40 203.0.113.9 203.0.113.9 203.0.113.61 10.20.0.15 198.51.100.200", ip, " ")
        for (i = 1; i <= n; i++) ua[ip[i]] = i <= 3 ? "Mozilla/5.0 (X11; Linux x86_64; rv:130.0) Gecko/20100101 Firefox/130.0" : i <= 5 ? "ShopApp/3.2 (Android 14)" : i <= 7 ? "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1" : i == 9 ? "Go-http-client/1.1" : "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36"
        for (t = 50400 + r(15); t < 57600; t += 1 + r(24)) {
          down = t >= 52320 && t < 53460
          if (nh <= t) { k = t; t = nh; acc("203.0.113.5", "GET /health", down ? 503 : 200, down ? 19 : 2, "Blackbox-Exporter/0.25.0"); t = k; nh += 60 }
          a = ip[1 + r(10)]; x = r(100)
          if (x < 30) acc(a, "GET /api/products?page=" (1 + r(5)), 200, 1800 + r(4200), ua[a])
          else if (x < 48) acc(a, "GET /api/orders/" (4700 + r(300)), down && r(2) ? 502 : 200, down ? 157 : 380 + r(600), ua[a])
          else if (x < 58) { st = !down ? 201 : r(3) ? 502 : 504; acc(a, "POST /api/orders", st, st == 201 ? 310 + r(250) : st == 502 ? 157 : 167, ua[a]) }
          else if (x < 68) { c = r(3); acc(a, "GET /static/app.js", c ? 304 : 200, c ? 0 : 48211, ua[a]) }
          else if (x < 80) { ok = r(4); acc(a, "POST /login", ok ? 200 : 401, ok ? 512 : 48, ua[a]) }
          else if (x < 88) acc(a, "GET /api/cart", down ? 502 : r(40) ? 200 : 500, down ? 157 : 220 + r(300), ua[a])
          else if (x < 96) acc(a, "GET /", 200, 5021, ua[a])
          else acc("198.51.100.23", r(3) ? "GET /.env" : "GET /wp-login.php", 404, 153, "Mozilla/5.0 zgrab/0.x")
        }
      }' > /var/log/nginx/access.log.1
      chown www-data:adm /var/log/nginx/access.log.1
      chmod 640 /var/log/nginx/access.log.1
      touch -d '2026-09-30 23:59:59' /var/log/nginx/access.log.1
      install -d -o ops -g ops /home/ops/bin /home/ops/review
      cat > /home/ops/bin/fehler-pro-ip <<'EOF'
      #!/bin/bash
      # Incident-Review: Anzahl der Antworten mit Status 5xx je Client-IP, häufigste zuerst.
      # Aufruf: fehler-pro-ip LOGDATEI > bericht.txt
      grep ' 50' "$1" | cut -d' ' -f1 | uniq -c | sort -nr
      EOF
      chmod 755 /home/ops/bin/fehler-pro-ip
      /home/ops/bin/fehler-pro-ip /var/log/nginx/access.log.1 > /home/ops/review/fehler-pro-ip.txt
      chown -R ops:ops /home/ops/bin /home/ops/review
    checks:
      - name: Der Bericht ~/review/fehler-pro-ip.txt stimmt mit dem Log überein
        run: |
          f=/home/ops/review/fehler-pro-ip.txt
          test -s "$f" || { echo "$f fehlt oder ist leer."; exit 1; }
          awk '$9 >= 500 && $9 <= 599 { n[$1]++ } END { for (ip in n) print n[ip], ip }' /var/log/nginx/access.log.1 | sort > /tmp/soll
          awk '{ print $1, $2 }' "$f" | sort > /tmp/ist
          if ! cmp -s /tmp/soll /tmp/ist; then
            echo "Erwartet: $(wc -l < /tmp/soll) IP-Adressen mit zusammen $(awk '{ s += $1 } END { print s }' /tmp/soll) Antworten 5xx."
            echo "Im Bericht: $(wc -l < /tmp/ist) Zeilen mit zusammen $(awk '{ s += $1 } END { print s + 0 }' /tmp/ist)."
            exit 1
          fi
          awk '{ print $1 }' "$f" | sort -c -nr 2>/dev/null || { echo "Die Zeilen stehen nicht nach Anzahl absteigend."; exit 1; }
      - name: fehler-pro-ip zählt auch ein anderes Log richtig
        run: |
          cat > /tmp/test.log <<'EOF'
          198.51.100.9 - - [01/Oct/2026:09:00:01 +0200] "POST /api/orders HTTP/1.1" 502 157 "-" "ShopApp/3.2 (Android 14)"
          192.0.2.33 - - [01/Oct/2026:09:00:02 +0200] "GET / HTTP/1.1" 200 5021 "-" "curl/7.88.1"
          198.51.100.9 - - [01/Oct/2026:09:00:03 +0200] "GET /api/cart HTTP/1.1" 503 19 "-" "ShopApp/3.2 (Android 14)"
          192.0.2.33 - - [01/Oct/2026:09:00:04 +0200] "POST /login HTTP/1.1" 200 512 "-" "curl/7.88.1"
          203.0.113.8 - - [01/Oct/2026:09:00:05 +0200] "GET /api/orders/12 HTTP/1.1" 500 87 "-" "Go-http-client/1.1"
          192.0.2.33 - - [01/Oct/2026:09:00:06 +0200] "-" 400 0 "-" "-"
          198.51.100.9 - - [01/Oct/2026:09:00:07 +0200] "POST /api/orders HTTP/1.1" 504 167 "-" "ShopApp/3.2 (Android 14)"
          EOF
          chmod 644 /tmp/test.log
          out=$(runuser -u ops -- /home/ops/bin/fehler-pro-ip /tmp/test.log) || { echo "Exit-Code $? für ein lesbares Log."; exit 1; }
          [ "$(printf '%s\n' "$out" | awk 'NF { print $1, $2 }')" = "$(printf '3 198.51.100.9\n1 203.0.113.8')" ] && exit 0
          echo "Ein Testlog mit drei Antworten 5xx für 198.51.100.9 und einer für 203.0.113.8 ergibt:"
          printf '%s\n' "$out"
          exit 1
      - name: Ohne Logdatei endet fehler-pro-ip mit einem Fehler, ohne Antworten 5xx mit 0
        run: |
          if runuser -u ops -- /home/ops/bin/fehler-pro-ip /tmp/gibt-es-nicht.log > /tmp/out 2>&1; then
            echo "Exit-Code 0, obwohl die Logdatei fehlt. Ausgabe:"; cat /tmp/out; exit 1
          fi
          printf '%s\n' '192.0.2.33 - - [01/Oct/2026:09:00:02 +0200] "GET / HTTP/1.1" 200 5021 "-" "curl/7.88.1"' > /tmp/ohne-5xx.log
          chmod 644 /tmp/ohne-5xx.log
          out=$(runuser -u ops -- /home/ops/bin/fehler-pro-ip /tmp/ohne-5xx.log); code=$?
          [ "$code" -eq 0 ] || { echo "Ein Log ohne Antworten 5xx endet mit Exit-Code $code."; exit 1; }
          [ -z "$out" ] || { echo "Ein Log ohne Antworten 5xx ergibt trotzdem eine Ausgabe:"; printf '%s\n' "$out"; exit 1; }
    solution: |
      # Was zählt das Skript? Die Summe im Bericht liegt weit über den 46 des Dashboards.
      cat ~/bin/fehler-pro-ip
      awk '{ s += $1 } END { print s }' ~/review/fehler-pro-ip.txt
      # ' 50' trifft nicht nur den Status, sondern auch Antwortgrößen wie 5021:
      grep ' 50' /var/log/nginx/access.log.1 | awk '$9 < 500' | head -n 3
      # Im Format combined steht der Status in Feld 9. Das sind die 46 Antworten:
      awk '$9 >= 500 && $9 <= 599' /var/log/nginx/access.log.1 | wc -l
      # Feld statt Zeichenkette, sort vor uniq -c, und pipefail, damit ein Lesefehler nicht verschwindet.
      cat > ~/bin/fehler-pro-ip <<'EOF'
      #!/bin/bash
      # Incident-Review: Anzahl der Antworten mit Status 5xx je Client-IP, häufigste zuerst.
      # Aufruf: fehler-pro-ip LOGDATEI > bericht.txt
      set -o pipefail
      awk '$9 >= 500 && $9 <= 599 { print $1 }' "$1" | sort | uniq -c | sort -nr
      EOF
      ~/bin/fehler-pro-ip /var/log/nginx/access.log.1 > ~/review/fehler-pro-ip.txt
      cat ~/review/fehler-pro-ip.txt
      ~/bin/fehler-pro-ip /gibt/es/nicht.log; echo "Exit-Code: $?"
    hints:
      - "Vergleiche zwei Zählungen: Wie viele Zeilen trifft `grep ' 50'`, und wie viele Zeilen haben in Feld 9 einen Status ab 500? Sieh dir die Zeilen an, die nur die erste trifft."
      - "`uniq -c` fasst nur **benachbarte** gleiche Zeilen zusammen. Was muss davor passieren, damit jede IP genau einmal erscheint?"
      - "Probiere `~/bin/fehler-pro-ip /gibt/es/nicht.log; echo $?`. Eine Pipeline meldet nur den Status ihres letzten Kommandos. Welche Shell-Option ändert das?"
    explanation: |
      Das Skript hatte drei Fehler. `grep ' 50'` sucht eine Zeichenkette irgendwo in der Zeile und trifft damit jede Startseite mit 5021 Bytes; ein Muster wie `' 5[0-9][0-9] '` hätte stattdessen die 512 Bytes langen Antworten auf `/login` gezählt. Verlässlich ist nur das Feld: `awk '$9 >= 500 && $9 <= 599'`. `uniq -c` ohne `sort` zählt Läufe benachbarter Zeilen, deshalb stand dieselbe IP mehrfach im Bericht. Und ohne `pipefail` endet die Pipeline mit dem Status von `sort`, auch wenn `grep` oder `awk` die Datei gar nicht lesen konnten. Ein nächtlicher Lauf hätte bei einem fehlenden Log still einen leeren Bericht abgelegt.

      Prüfe eine Auswertung gegen eine unabhängige Zahl wie hier das Dashboard. Weichen die Summen ab, suche die Zeilen, die nur eine der beiden Zählungen trifft.
    resources:
      - title: nginx · log_format
        url: https://nginx.org/en/docs/http/ngx_http_log_module.html#log_format
      - title: Bash · Pipelines
        url: https://www.gnu.org/software/bash/manual/html_node/Pipelines.html
  - id: kundenliste-leer
    type: scenario
    title: Jede Nacht ist die Kundenliste leer
    prompt: |
      Seit dem 30. September meldet der CRM-Import jeden Morgen „0 Kunden importiert“. Er liest `/srv/crm/kunden.csv`. Jede Nacht um 02:30 bereinigt `/usr/local/bin/kunden-bereinigen` diese Datei (Cronjob in `/etc/cron.d/kunden-bereinigen`), um 02:00 sichert ein anderer Job sie nach `/var/backups/crm/`. Am 29. September hat ein Kollege das Bereinigungsskript „aufgeräumt“.

      1. Stelle `/srv/crm/kunden.csv` aus der letzten vollständigen Sicherung wieder her.
      2. Repariere `kunden-bereinigen`, sodass es tut, was im Kommentar steht, ohne seine Eingabe zu zerstören. Fehlt die Eingabedatei, soll es mit einem Exit-Code ungleich 0 enden und keine leere Liste anlegen.
    setup: |
      set -e
      install -d -m 755 /srv/crm /var/backups/crm
      cat > /usr/local/bin/kunden-bereinigen <<'EOF'
      #!/bin/bash
      # Bereinigt die Kundenliste vor dem CRM-Import (cron, täglich 02:30):
      # Kopfzeile behalten, E-Mail-Adressen klein schreiben, doppelte Kunden entfernen.
      # Aufruf: kunden-bereinigen [DATEI]   (Standard: /srv/crm/kunden.csv)
      datei=${1:-/srv/crm/kunden.csv}
      {
        head -n 1 "$datei"
        tail -n +2 "$datei" | awk -F, -v OFS=, '{ $3 = tolower($3); print }' | sort -u
      } > "$datei"
      EOF
      chmod 755 /usr/local/bin/kunden-bereinigen
      echo '30 2 * * * root /usr/local/bin/kunden-bereinigen' > /etc/cron.d/kunden-bereinigen
      cat > /tmp/kunden.csv <<'EOF'
      kundennr,name,email,ort
      10001,Bäckerei Kurz,info@baeckerei-kurz.de,Hamburg
      10002,Café Lindner,kontakt@cafe-lindner.de,Bremen
      10003,Hofladen Brandt,hof@brandt-hofladen.de,Lüneburg
      10004,Weinhandel Roth,bestellung@weinhandel-roth.de,Mainz
      10005,Kiosk am Markt,kiosk.markt@example.de,Kiel
      10006,Meyer Schulz Partner,buero@msp-partner.de,Hannover
      10007,Fahrradladen Wendt,service@rad-wendt.de,Münster
      10008,Buchhandlung Seitenweise,info@seitenweise.de,Leipzig
      10009,Gärtnerei Vogel,gaertnerei@vogel-pflanzen.de,Erfurt
      10010,Metzgerei Huber,metzgerei.huber@example.de,Augsburg
      10011,Feinkost Albers,albers@feinkost-albers.de,Lübeck
      10012,Tischlerei Krämer,info@tischlerei-kraemer.de,Kassel
      10013,Eiscafé Venezia,ciao@venezia-eis.de,Würzburg
      10014,Blumen Lehmann,blumen@lehmann-floristik.de,Rostock
      10015,Optik Brenner,termin@optik-brenner.de,Regensburg
      10016,Reisebüro Sonnenschein,buchung@sonnenschein-reisen.de,Bonn
      10017,Weltladen Mitte,weltladen@example.org,Göttingen
      10018,Brauhaus Ostend,ausschank@brauhaus-ostend.de,Frankfurt
      10019,Nähstube Petersen,naehstube@petersen-stoffe.de,Flensburg
      10020,Getränke Hoffmann,lieferung@getraenke-hoffmann.de,Bielefeld
      10021,Hofkäserei Jansen,kaese@jansen-hof.de,Oldenburg
      10022,Schreibwaren Koch,koch@schreibwaren-koch.de,Ulm
      10023,Kaffeerösterei Bohne,roesterei@bohne-kaffee.de,Freiburg
      10004,Weinhandel Roth,Bestellung@Weinhandel-Roth.de,Mainz
      10024,Teeladen Kranich,Tee@Kranich-Tee.de,Dresden
      10025,Imkerei Sommer,honig@imkerei-sommer.de,Celle
      10026,Physiotherapie Lang,praxis@physio-lang.de,Potsdam
      10013,Eiscafé Venezia,ciao@venezia-eis.de,Würzburg
      10027,Zweirad Becker,werkstatt@zweirad-becker.de,Trier
      EOF
      head -n 23 /tmp/kunden.csv | gzip -n > /var/backups/crm/kunden-2026-09-29.csv.gz
      gzip -n < /tmp/kunden.csv > /var/backups/crm/kunden-2026-09-30.csv.gz
      gzip -n < /dev/null > /var/backups/crm/kunden-2026-10-01.csv.gz
      : > /srv/crm/kunden.csv
      rm /tmp/kunden.csv
      touch -d '2026-09-29 02:00' /var/backups/crm/kunden-2026-09-29.csv.gz
      touch -d '2026-09-30 02:00' /var/backups/crm/kunden-2026-09-30.csv.gz
      touch -d '2026-10-01 02:00' /var/backups/crm/kunden-2026-10-01.csv.gz
      touch -d '2026-10-01 02:30' /srv/crm/kunden.csv
    checks:
      - name: kunden.csv enthält alle Kunden der letzten vollständigen Sicherung
        run: |
          f=/srv/crm/kunden.csv
          test -s "$f" || { echo "$f ist leer."; exit 1; }
          [ "$(head -n 1 "$f")" = "kundennr,name,email,ort" ] || { echo "Die erste Zeile von $f ist nicht die Kopfzeile."; exit 1; }
          zcat /var/backups/crm/kunden-2026-09-30.csv.gz | tail -n +2 | cut -d, -f1 | sort -u > /tmp/soll
          tail -n +2 "$f" | cut -d, -f1 | sort -u > /tmp/ist
          fehlen=$(comm -23 /tmp/soll /tmp/ist | wc -l)
          [ "$fehlen" -eq 0 ] || { echo "In $f fehlen $fehlen von $(wc -l < /tmp/soll) Kundennummern."; exit 1; }
      - name: kunden-bereinigen bereinigt eine Testliste, statt sie zu leeren
        run: |
          d=$(mktemp -d)
          printf '%s\n' 'kundennr,name,email,ort' '20002,Café Lindner,Kontakt@Cafe-Lindner.de,Bremen' '20001,Bäckerei Kurz,info@baeckerei-kurz.de,Hamburg' '20002,Café Lindner,kontakt@cafe-lindner.de,Bremen' '20003,Hofladen Brandt,HOF@Brandt-Hofladen.de,Lüneburg' > "$d/kunden.csv"
          /usr/local/bin/kunden-bereinigen "$d/kunden.csv" || { echo "kunden-bereinigen endet mit Exit-Code $?."; exit 1; }
          test -s "$d/kunden.csv" || { echo "kunden-bereinigen hat die Testliste geleert."; exit 1; }
          [ "$(head -n 1 "$d/kunden.csv")" = "kundennr,name,email,ort" ] || { echo "Nach der Bereinigung ist die Kopfzeile nicht die erste Zeile. Inhalt:"; cat "$d/kunden.csv"; exit 1; }
          soll=$(printf '%s\n' '20001,Bäckerei Kurz,info@baeckerei-kurz.de,Hamburg' '20002,Café Lindner,kontakt@cafe-lindner.de,Bremen' '20003,Hofladen Brandt,hof@brandt-hofladen.de,Lüneburg')
          [ "$(tail -n +2 "$d/kunden.csv" | sort)" = "$soll" ] && exit 0
          echo "Erwartet nach der Bereinigung (Reihenfolge egal):"; echo "$soll"
          echo "Tatsächlich:"; tail -n +2 "$d/kunden.csv"
          exit 1
      - name: Ohne Eingabedatei endet kunden-bereinigen mit einem Fehler und legt keine Datei an
        run: |
          d=$(mktemp -d)
          if /usr/local/bin/kunden-bereinigen "$d/kunden.csv" 2>/dev/null; then echo "Exit-Code 0, obwohl $d/kunden.csv fehlt."; exit 1; fi
          [ ! -e "$d/kunden.csv" ] || { echo "kunden-bereinigen hat eine neue, leere kunden.csv angelegt."; exit 1; }
    solution: |
      # Die Liste ist leer, die Sicherung von heute Nacht auch:
      ls -l /srv/crm/ /var/backups/crm/
      zcat /var/backups/crm/kunden-2026-10-01.csv.gz | wc -l
      zcat /var/backups/crm/kunden-2026-09-30.csv.gz | wc -l
      # Das Skript leitet in die Datei um, die es liest. Die Shell leert sie, bevor head und tail sie öffnen.
      cat /usr/local/bin/kunden-bereinigen
      # 1. Aus der letzten vollständigen Sicherung zurückholen
      zcat /var/backups/crm/kunden-2026-09-30.csv.gz | sudo tee /srv/crm/kunden.csv > /dev/null
      # 2. In eine temporäre Datei schreiben und das Original erst ersetzen, wenn alles geklappt hat
      sudo tee /usr/local/bin/kunden-bereinigen > /dev/null <<'EOF'
      #!/bin/bash
      # Bereinigt die Kundenliste vor dem CRM-Import (cron, täglich 02:30):
      # Kopfzeile behalten, E-Mail-Adressen klein schreiben, doppelte Kunden entfernen.
      # Aufruf: kunden-bereinigen [DATEI]   (Standard: /srv/crm/kunden.csv)
      set -euo pipefail
      datei=${1:-/srv/crm/kunden.csv}
      tmp=$(mktemp "$datei.XXXXXX")
      trap 'rm -f "$tmp"' EXIT
      {
        head -n 1 "$datei"
        tail -n +2 "$datei" | awk -F, -v OFS=, '{ $3 = tolower($3); print }' | sort -u
      } > "$tmp"
      chmod --reference="$datei" "$tmp"
      mv "$tmp" "$datei"
      EOF
      # Probelauf wie in der Nacht: Die Liste bleibt, die Dubletten verschwinden.
      sudo /usr/local/bin/kunden-bereinigen
      wc -l /srv/crm/kunden.csv
      sudo /usr/local/bin/kunden-bereinigen /srv/crm/gibt-es-nicht.csv; echo "Exit-Code: $?"
    hints:
      - "Welche Sicherung enthält noch Daten? `ls -l /var/backups/crm/` zeigt die Größen, `zcat DATEI | wc -l` die Zeilen."
      - "Lies das Skript: Woraus liest es, und wohin schreibt es? Was macht die Shell mit dem Ziel von `>`, bevor `head` startet?"
      - "Schreibe das Ergebnis in eine temporäre Datei (`mktemp`) und ersetze das Original erst danach mit `mv`. Mit `set -euo pipefail` bricht das Skript ab, wenn `head` die Datei nicht findet."
    explanation: |
      Die Umleitung `> "$datei"` gilt für die ganze Gruppe `{ … }`. Die Shell öffnet und leert die Datei, bevor `head` und `tail` laufen; beide lesen eine leere Datei, und das Skript schreibt nichts zurück. Die Sicherung läuft um 02:00, vor der Bereinigung. Deshalb enthält die Sicherung vom 30.09. noch die vollständige Liste, die vom 01.10. ist schon leer, und die vom 29.09. ist älter und kleiner.

      Für „Datei verarbeiten und ersetzen“ gilt ein festes Muster: in eine temporäre Datei im selben Verzeichnis schreiben, nur bei Erfolg mit `mv` ersetzen. `mv` innerhalb eines Dateisystems ist ein `rename()`, das das Ziel atomar austauscht. Wer die Datei liest, sieht die alte oder die neue Fassung, nie eine halbe. `mktemp` legt die Datei mit Modus 600 an, deshalb übernimmt `chmod --reference` die Rechte des Originals. Und prüfe bei einer Wiederherstellung den Inhalt einer Sicherung, nicht nur ihren Namen.
    resources:
      - title: Bash · Redirections
        url: https://www.gnu.org/software/bash/manual/html_node/Redirections.html
      - title: Coreutils · mktemp
        url: https://www.gnu.org/software/coreutils/manual/html_node/mktemp-invocation.html
      - title: rename(2)
        url: https://man7.org/linux/man-pages/man2/rename.2.html
