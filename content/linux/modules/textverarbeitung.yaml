id: textverarbeitung
title: Textverarbeitung & Pipes
level: 2
minutes: 150
summary: Du baust aus kleinen Textwerkzeugen überprüfbare Pipelines und unterscheidest Daten, Diagnose und Fehlerstatus.
goals:
  - Du leitest stdin, stdout und stderr gezielt um und erklärst die Reihenfolge.
  - Du filterst, sortierst und zählst Text mit grep, cut, sort, uniq und wc.
  - Du nutzt sed und awk für nachvollziehbare Transformationen und Auswertungen.
  - Du verarbeitest Dateinamen sicher und prüfst jeden Schritt einer Pipeline.
resources:
  - title: Bash · Redirections
    url: https://www.gnu.org/software/bash/manual/html_node/Redirections.html
  - title: GNU grep
    url: https://www.gnu.org/software/grep/manual/grep.html
  - title: GNU Coreutils
    url: https://www.gnu.org/software/coreutils/manual/coreutils.html
  - title: GNU sed
    url: https://www.gnu.org/software/sed/manual/sed.html
  - title: GNU awk
    url: https://www.gnu.org/software/gawk/manual/gawk.html
lesson: |
  In einer Logdatei stehen zehntausend Anfragen. Du möchtest wissen, welche IP-Adressen die meisten Fehler verursachen. Du könntest die Datei im Editor durchsuchen oder ein großes Programm schreiben. Eine Pipeline zerlegt die Frage in kleine Schritte: relevante Zeilen auswählen, die IP extrahieren, gleiche Werte zusammenführen und nach Häufigkeit sortieren. Jeder Schritt lässt sich einzeln ansehen und prüfen.

  Dabei geht es um mehr als kurze Befehle. Gute Textverarbeitung braucht ein Datenformat, einen klaren Vertrag zwischen Werkzeugen und einen Umgang mit Fehlern. Eine erfolgreiche Pipeline kann sonst die falsche Zahl liefern. Alle Beispiele verwenden Bash; starte für die Übungen eine Bash oder speichere die Befehle in einem Bash-Skript. Die interaktive fish-Syntax ist nicht für jedes Konstrukt identisch.

  ## Drei Datenströme und ihre Umleitungen

  Jeder Prozess erhält normalerweise drei offene Dateideskriptoren: **0** ist stdin, **1** stdout, **2** stderr. stdin liefert Eingabe. stdout enthält das eigentliche Ergebnis. stderr enthält Diagnosen. Die Shell verbindet diese Deskriptoren vor dem Start des Programms mit Dateien, Terminal oder Pipes. Das Programm muss dafür nicht wissen, ob seine Ausgabe auf einem Bildschirm oder in einer Datei landet ([Bash · Redirections](https://www.gnu.org/software/bash/manual/html_node/Redirections.html)).

  ```bash
  grep 'ERROR' app.log > fehler.log
  grep 'ERROR' app.log >> sammlung.log
  grep 'ERROR' app.log 2> diagnose.log
  wc -l < app.log
  ```

  `>` öffnet die Zieldatei zum Überschreiben, `>>` zum Anhängen. Ein fehlendes Eingabeargument lässt viele Werkzeuge von stdin lesen. Deshalb zählt `wc -l < app.log` die Zeilen, ohne einen Dateinamen auszugeben. Überschreibe niemals versehentlich deine Eingabe: Bei `sort daten.txt > daten.txt` leert die Shell die Datei, bevor `sort` sie liest. Schreibe in eine andere Datei und prüfe das Ergebnis vor dem Ersetzen.

  Umleitungen werden von links nach rechts verarbeitet. `2>&1` bedeutet „verbinde stderr mit dem aktuellen Ziel von stdout“, nicht „halte beide für immer gekoppelt“. Die folgenden Befehle unterscheiden sich daher:

  ```bash
  { printf 'Daten\n'; printf 'Warnung\n' >&2; } > alles.log 2>&1
  { printf 'Daten\n'; printf 'Warnung\n' >&2; } 2>&1 > nur-daten.log
  ```

  Im ersten Fall landen beide Zeilen in `alles.log`. Im zweiten zeigt stderr noch auf das ursprüngliche stdout, während stdout anschließend zur Datei umgebogen wird. Bash bietet mit `&> alles.log` eine Kurzform für beide Ströme; diese ist keine portable POSIX-sh-Schreibweise. Die Trennung hilft in Skripten: Maschinen lesen stdout, Menschen lesen stderr.

  Ein **Here-Document** liefert mehrere Zeilen als Eingabe. Mit einem gequoteten Begrenzer bleiben Variablen und Substitutionen im Text unverändert. Ein **Here-String** liefert einen einzelnen String mit abschließendem Zeilenumbruch:

  ```bash
  cat <<'EOF'
  Der Text $HOME bleibt wörtlich.
  EOF
  grep 'api' <<< 'api bereit'
  ```

  > [!MERKE]
  > Eine Umleitung gehört zur Shell. Prüfe ihre Wirkung, bevor du über das Verhalten des gestarteten Programms nachdenkst.

  ## Pipes lesen und Treffer finden

  Eine Pipe `|` verbindet stdout des linken Prozesses mit stdin des rechten. stderr bleibt normalerweise am Terminal. Die Programme können gleichzeitig arbeiten; sie müssen nicht erst die vollständige Zwischenmenge als Datei speichern. Das ist der praktische Kern der Unix-Idee, Werkzeuge mit schmaler Aufgabe zu kombinieren ([Bash · Pipelines](https://www.gnu.org/software/bash/manual/html_node/Pipelines.html)).

  Für einen ersten Blick genügen `head -n 5 app.log`, `tail -n 20 app.log` und `less app.log`. `tail -f` verfolgt neu angehängte Zeilen; `tail -F` kann bei üblichen Logrotationen dem Namen folgen. `cat` gibt eine Datei komplett aus, eignet sich aber bei sehr großen Logs selten als erster Untersuchungsschritt. Mit `tee bericht.txt` speicherst du einen Strom und reichst ihn zugleich weiter. `tee -a` hängt an ([Coreutils · tee](https://www.gnu.org/software/coreutils/manual/html_node/tee-invocation.html)).

  ```bash
  grep -n -i 'timeout' app.log | head -n 10
  grep -v '^#' config.txt | tee ohne-kommentare.txt
  grep -E 'ERROR|WARN' app.log
  grep -F 'user.name' app.log
  ```

  [`grep`](https://www.gnu.org/software/grep/manual/grep.html) wählt Zeilen aus. `-n` ergänzt Zeilennummern, `-i` ignoriert Großschreibung, `-v` kehrt die Auswahl um, `-r` sucht rekursiv und `-c` zählt ausgewählte Zeilen. `-o` gibt nur die passenden Teile aus; mehrere Treffer einer Zeile können dann mehrere Ausgabezeilen erzeugen. `-w` verlangt Wortgrenzen. Das Wortmodell orientiert sich dabei an Buchstaben, Ziffern und Unterstrich, nicht an deinem fachlichen Begriff einer Kennung.

  Reguläre Ausdrücke beschreiben Muster: `^` markiert den Zeilenanfang, `$` das Ende, `.` ein beliebiges Zeichen und `[0-9]` eine Ziffer. `grep -E` aktiviert erweiterte Ausdrücke mit `|`, `+` und Klammern ohne die zusätzlichen Backslashes der grundlegenden Syntax. Quote Muster, damit die Shell sie nicht vorher als Dateimuster interpretiert. Wenn du einen festen Text suchst, ist `-F` klarer als mühsames Maskieren. Der Punkt in `user.name` ist mit `-F` wirklich ein Punkt.

  ## Auswählen, sortieren und zählen

  Für klar getrennte Spalten ist `cut` passend. `cut -d: -f1 /etc/passwd` nimmt das erste durch Doppelpunkte getrennte Feld. `cut` ist kein CSV-Parser: gequotete Kommas und mehrzeilige Felder benötigen ein Werkzeug, das dieses Format versteht. Genau diese Grenze entscheidet, wann eine kurze Pipeline in ein kleines Python-Programm wechseln sollte.

  ```bash
  printf 'api\nweb\napi\n' | sort | uniq -c
  printf '12\n3\n100\n' | sort -n
  printf 'api 12\nweb 3\n' | sort -k2,2n
  printf 'Anna,Mara\n' | tr ',' '\n'
  ```

  `sort` sortiert standardmäßig als Text und abhängig von der Locale. `sort -n` vergleicht Zahlen; `-k2,2n` beschränkt den numerischen Schlüssel auf Feld zwei. Mit `-t:` wählst du einen Feldtrenner. `-h` versteht Größen wie `2K` und `1M`, `-u` entfernt gleiche Sortierschlüssel. Für reproduzierbare byteweise Reihenfolge setzt du gezielt `LC_ALL=C sort` ([Coreutils · sort](https://www.gnu.org/software/coreutils/manual/html_node/sort-invocation.html)).

  `uniq` führt **benachbarte** gleiche Zeilen zusammen. Deshalb ist `sort | uniq -c` ein Häufigkeitszähler, `uniq -c` auf unsortierten Ereignissen aber oft falsch. `wc -l` zählt Zeilenumbrüche, `wc -w` Wörter und `wc -c` Bytes; eine letzte Zeile ohne Zeilenumbruch ist für `wc -l` kein weiterer Zeilenumbruch. `tr` übersetzt oder löscht einzelne Zeichen. Es ersetzt keine beliebig langen Wörter ([Coreutils · uniq](https://www.gnu.org/software/coreutils/manual/html_node/uniq-invocation.html)).

  ## Transformationen mit sed und awk

  `sed` arbeitet standardmäßig zeilenweise. `s/alt/neu/` ersetzt den ersten passenden Teil pro Zeile; `g` ersetzt alle. Eine Adresse beschränkt die Operation. `-n` unterdrückt die automatische Ausgabe, sodass `p` ausgewählte Zeilen gezielt ausgeben kann ([GNU sed](https://www.gnu.org/software/sed/manual/sed.html)).

  ```bash
  printf 'dev dev\n' | sed 's/dev/prod/g'
  sed -n '2,4p' app.log
  sed '/^#/d' config.txt
  sed 's/localhost/api.example/g' config.txt > config.neu.txt
  ```

  Arbeite zunächst ohne `-i`. So siehst du den Effekt, ohne die Quelle zu verändern. GNU sed kann mit `-i.bak` ein Backup anlegen, aber ein Backup ersetzt weder eine Prüfung noch ein Versionskontrollsystem. Unterschiede zu BSD sed sind ein weiterer Grund, im Team die erwartete Umgebung zu dokumentieren.

  `awk` kombiniert Muster mit Aktionen. `$1` ist das erste Feld, `$0` die ganze Zeile; standardmäßig trennt Leerraum Felder. `-F:` setzt einen anderen Trenner. Eine Aktion läuft nur für Zeilen, auf die das davorstehende Muster passt. `END` läuft nach der letzten Zeile ([GNU awk · Patterns and Actions](https://www.gnu.org/software/gawk/manual/html_node/Patterns-and-Actions.html)).

  ```bash
  printf 'api 12\nweb 3\n' | awk '$2 > 5 { print $1 }'
  printf 'api 12\nweb 3\n' | awk '{ sum += $2 } END { print sum }'
  awk -F: '$3 >= 1000 { print $1 }' /etc/passwd
  ```

  Der letzte Befehl ist eine technische Auswahl nach UID, keine sichere Liste „aller Menschen“. Systemkonventionen unterscheiden sich. Diese Unterscheidung zwischen Datenfilter und fachlicher Aussage gehört zu einer verlässlichen Auswertung.

  ## Eine Logauswertung und ihre Grenzen

  Wir vereinbaren ein reduziertes Format: Datum und Stunde in Feld eins, IP in Feld zwei, HTTP-Status in Feld drei. Zuerst prüfen wir mit `head`, dass die Datei wirklich so aufgebaut ist. Dann zählen wir Anfragen ab Status 500 pro IP:

  ```bash
  awk '$3 >= 500 { print $2 }' access.log |
    LC_ALL=C sort |
    uniq -c |
    sort -nr |
    head -n 5
  ```

  Fehler pro Stunde erhältst du analog durch Ausgabe von `$1`; Zeitstempel mit Minuten musst du vorher passend kürzen. Benenne die Zeitzone des Logs. Eine Zeile ist hier eine Anfrage, ein Fehler ist ein Status ab 500, und das Zeitfenster ist der Inhalt der Eingabedatei. Ohne diese Annahmen klingt ein Zahlenbericht genauer, als er ist.

  Dateinamen sind kein beliebiger zeilenweiser Text. Sie können Leerzeichen und Zeilenumbrüche enthalten. `find -print0` und `xargs -0` vereinbaren deshalb das Nullbyte als Trenner. Mit `-r` startet GNU xargs bei leerer Eingabe kein Kommando. Häufig ist `find … -exec … {} +` noch übersichtlicher ([GNU findutils · Safe File Name Handling](https://www.gnu.org/software/findutils/manual/html_node/find_html/Safe-File-Name-Handling.html)).

  ```bash
  find ./logs -type f -name '*.log' -print0 | xargs -0 -r wc -l
  find ./logs -type f -name '*.log' -exec wc -l {} +
  ```

  > [!PRAXIS]
  > Zeige im Review eine kleine Eingabedatei samt erwarteter Ausgabe. Prüfe leere Daten, mehrere gleiche Einträge und ein ungewöhnliches Feld. Erst dann lässt du die Pipeline auf einen großen Bestand los.

  ## Häufige Fehler

  `grep` liefert Status 1, wenn es keine Treffer gibt, und 2 bei Fehlern. Das sind unterschiedliche Situationen. Eine Pipe meldet in Bash standardmäßig den Status ihres letzten Kommandos; ein erfolgreiches `wc` kann also einen Fehler des vorherigen Lesers verdecken. `set -o pipefail` verbessert die Erkennung, verlangt aber bewussten Umgang mit „keine Treffer“ und früh schließenden Verbrauchern wie `head`. Das Scripting-Modul vertieft diese Grenzen.

  Vermeide außerdem `for datei in $(find …)`: Die Shell zerlegt die Ausgabe erneut. Verlasse dich nicht auf die sichtbare Reihenfolge unsortierter Eingaben. Prüfe beim Zählen, ob du Zeilen, Treffer, Bytes oder eindeutige Werte meinst. Und verarbeite JSON, CSV und strukturierte Journaldaten mit passenden Parsern, sobald Verschachtelung oder Quoting relevant werden.

  > [!INTERVIEW]
  > „Warum muss vor `uniq` oft `sort` stehen?“ – `uniq` vergleicht Nachbarzeilen. Sortieren stellt sicher, dass alle gleichen Schlüssel zusammenliegen; nur dann erhältst du globale Häufigkeiten.

  ## Zusammenfassung

  - stdin, stdout und stderr haben verschiedene Aufgaben.
  - Umleitungen wirken von links nach rechts und vor dem Programmstart.
  - Pipes verbinden Werkzeuge über einen vereinbarten Datenstrom.
  - Fester Text, Regex und Dateimuster sind verschiedene Sprachen.
  - `sort | uniq -c` zählt gleiche Zeilen; `awk` verarbeitet Felder.
  - Nullbytes schützen Dateinamen vor versehentlicher Zerlegung.
  - Ein Bericht braucht ein Datenformat, ein Zeitfenster und Fehlerprüfung.
exercises:
  - id: stroeme
    type: choice
    title: Daten von Diagnosen trennen
    prompt: Was verbindet eine normale Bash-Pipe `a | b`?
    options:
      - text: stdout von a mit stdin von b
        correct: true
        why: Die Pipe verbindet genau diese beiden Deskriptoren.
      - text: stderr von a mit stdout von b
        correct: false
        why: stderr bleibt ohne zusätzliche Umleitung am bisherigen Ziel.
      - text: Den Exit-Code von a mit stdin von b
        correct: false
        why: Statuswerte sind keine automatisch übertragenen Textdaten.
    explanation: Die Pipe transportiert Bytes, keine Exit-Codes. Diagnosen müssen ausdrücklich einbezogen werden, wenn sie Teil des Stroms sein sollen.
    resources:
      - title: Bash · Pipelines
        url: https://www.gnu.org/software/bash/manual/html_node/Pipelines.html
  - id: analyse-reihenfolge
    type: order
    title: Häufigkeiten ermitteln
    prompt: Sortiere die Schritte zu einer Auswertung der häufigsten Werte. Jeder Schritt nutzt das Ergebnis des vorigen.
    lang: text
    lines: |
      Relevante Ereigniszeilen auswählen
      Aus jeder Zeile den gesuchten Schlüssel extrahieren
      Die Schlüssel sortieren
      Benachbarte gleiche Schlüssel zählen
      Die gezählten Häufigkeiten numerisch absteigend sortieren
    explanation: Erst die Auswahl und Extraktion definieren, was gezählt wird. Sortierung gruppiert identische Schlüssel vor `uniq -c`; die zweite Sortierung ordnet das Ergebnis nach Anzahl.
  - id: nachbarn
    type: output
    title: Drei Gruppen oder zwei?
    prompt: Welche Ausgabe entsteht? Führende Leerzeichen sind hier durch awk entfernt.
    lang: bash
    code: |
      printf 'api\nweb\napi\n' | uniq -c | awk '{ print $1, $2 }'
    expected: |
      1 api
      1 web
      1 api
    verify: true
    explanation: Die beiden api-Zeilen sind keine Nachbarn und bilden daher zwei Gruppen. Ein vorgeschaltetes `sort` würde sie zusammenführen.
    resources:
      - title: Coreutils · uniq
        url: https://www.gnu.org/software/coreutils/manual/html_node/uniq-invocation.html
  - id: zahlen
    type: output
    title: Text oder Zahl?
    prompt: Welche Zeilen gibt diese numerische Sortierung aus?
    lang: bash
    code: |
      printf '20\n3\n100\n' | LC_ALL=C sort -n
    expected: |
      3
      20
      100
    verify: true
    explanation: |
      `-n` vergleicht den Zahlenwert und nicht das erste Zeichen. Ohne die Option würde die Textsortierung 100 vor 20 und 3 setzen.
    resources:
      - title: Coreutils · sort
        url: https://www.gnu.org/software/coreutils/manual/html_node/sort-invocation.html
  - id: grep-schreiben
    type: command
    title: Fehler mit Zeilennummern
    prompt: Suche mit grep ohne Beachtung der Großschreibung nach dem festen Text `error` in `app.log` und zeige Zeilennummern.
    answers: ["grep -Fin error app.log", "grep --fixed-strings --ignore-case --line-number error app.log"]
    explanation: |
      `-F` macht den Suchtext wörtlich, `-i` ignoriert Großschreibung und `-n` zeigt die Fundstelle. Das ist für eine überprüfbare Diagnose hilfreicher als kopierte Treffer ohne Kontext.
    resources:
      - title: GNU grep
        url: https://www.gnu.org/software/grep/manual/grep.html
  - id: felder-summe
    type: gap
    title: Laufzeiten summieren
    prompt: Ergänze das zweite Feld und den Abschlussblock.
    lang: bash
    code: |
      awk '{ sum += ⟦$2⟧ } ⟦END⟧ { print sum }' laufzeiten.txt
    gaps:
      - label: Zweites Feld
        hint: awk nummeriert Felder ab eins und stellt ein Dollarzeichen davor.
      - label: Abschlussaktion
        hint: Dieses großgeschriebene Muster läuft nach der letzten Eingabezeile.
    explanation: Jede Zeile erhöht `sum` um ihre zweite Spalte. `END` gibt den Gesamtwert einmal aus, nachdem alle Zeilen verarbeitet wurden.
    resources:
      - title: GNU awk · Patterns and Actions
        url: https://www.gnu.org/software/gawk/manual/html_node/Patterns-and-Actions.html
  - id: beide-stroeme
    type: command
    title: Einen Bericht samt Fehlern speichern
    prompt: Starte `./report.sh` und überschreibe `bericht.log` mit stdout und stderr. Verwende Bash.
    answers: ["./report.sh > bericht.log 2>&1", "./report.sh &> bericht.log"]
    explanation: Zuerst wird stdout zur Datei umgebogen, dann stderr an dasselbe Ziel gebunden. Die umgekehrte Reihenfolge lässt stderr auf dem ursprünglichen stdout.
    resources:
      - title: Bash · Redirections
        url: https://www.gnu.org/software/bash/manual/html_node/Redirections.html
  - id: sed-schreiben
    type: command
    title: Eine Änderung zuerst ansehen
    prompt: Ersetze mit sed jedes `dev` pro Zeile durch `prod` in `config.txt`. Gib nur das Ergebnis aus und ändere die Datei nicht.
    answers: ["sed 's/dev/prod/g' config.txt", "sed -e 's/dev/prod/g' config.txt"]
    explanation: Das globale Flag `g` ersetzt alle Treffer einer Zeile. Ohne `-i` bleibt die Quelldatei unverändert und das Ergebnis kann vor einer Übernahme geprüft werden.
    resources:
      - title: GNU sed
        url: https://www.gnu.org/software/sed/manual/sed.html
  - id: leere-datei
    type: bug
    title: Nach dem Sortieren fehlen die Daten
    prompt: Die Eingabe enthält Daten, nach dem Befehl ist sie leer. Korrigiere die Zeile so, dass das Ergebnis in `daten.sortiert.txt` landet.
    lang: bash
    code: |
      sort daten.txt > daten.txt
    lines: [1]
    fix:
      - line: 1
        answers: ["sort daten.txt > daten.sortiert.txt"]
    explanation: Die Shell öffnet und leert das Ausgabeziel, bevor `sort` die Eingabe öffnet. Zwei verschiedene Pfade verhindern diese Selbstüberschreibung.
  - id: pipeline-erklaeren
    type: explain
    title: Was zählt dieser Bericht?
    prompt: Erkläre Auswahl, Gruppierung und Sortierung. Die Eingabe enthält IP-Adresse in Feld zwei und HTTP-Status in Feld drei.
    lang: bash
    code: |
      awk '$3 >= 500 { print $2 }' access.log | sort | uniq -c | sort -nr
    points:
      - Es werden nur Zeilen mit numerischem Status ab 500 ausgewählt.
      - awk gibt je passender Zeile die IP aus Feld zwei aus.
      - sort gruppiert gleiche IPs für uniq -c.
      - Die letzte Sortierung ordnet nach Häufigkeit absteigend.
    explanation: Die Pipeline zählt Fehlerereignisse pro IP im Inhalt der Datei. Sie zählt weder einzelne Personen noch alle HTTP-Fehler, denn etwa 404 liegt unter 500.
  - id: logfile-bericht
    type: practice
    title: Ein überprüfbarer Fehlerbericht
    prompt: Schreibe eine Bash-Pipeline für dieses Logformat und erzeuge Fehlerzahlen pro Stunde. Nutze ein Beispiel mit zwei Fehlern in Stunde 10, einem in 11 und einem Erfolg. Speichere das Ergebnis zusätzlich mit tee in `stunden.txt`.
    lang: bash
    solution: |
      printf '%s\n' \
        '2026-09-28T10 192.0.2.1 500' \
        '2026-09-28T10 192.0.2.2 503' \
        '2026-09-28T11 192.0.2.1 502' \
        '2026-09-28T11 192.0.2.2 200' > access.log
      awk '$3 >= 500 { print $1 }' access.log |
        LC_ALL=C sort | uniq -c |
        awk '{ print $2, $1 }' | tee stunden.txt
    checklist:
      - Das Zeitformat und die Feldnummern sind dokumentiert.
      - Stunde 10 enthält zwei Fehler und Stunde 11 einen.
      - Der Erfolg mit Status 200 wird nicht gezählt.
      - Die Quelldatei bleibt erhalten und die Ausgabe wird gespeichert.
    explanation: Das kleine Testlog macht die fachliche Definition prüfbar. Die Umordnung nach `uniq -c` liefert zuerst den Zeitstempel und danach die Anzahl, sodass der Bericht gut weiterverarbeitet werden kann.
