id: netzwerk-ssh
title: Netzwerk & SSH
level: 2
minutes: 270
summary: Wie Pakete ihren Weg finden, wie Namen zu Adressen werden, wie du Verbindungsprobleme Schicht für Schicht eingrenzt und wie du mit SSH, curl und rsync sicher und bequem mit Servern arbeitest.
goals:
  - Du erklärst IP-Adresse, Subnetz (CIDR), Gateway, Ports, TCP und UDP sowie das Prinzip einer Host-Firewall und liest `ip addr`, `ip route` und `ss -tulpn`.
  - Du richtest eine Schnittstelle dauerhaft mit `nmcli` oder systemd-networkd ein und erkennst, welches Werkzeug ein System verwaltet.
  - Du verfolgst einen Namen über `/etc/nsswitch.conf`, `/etc/hosts` und `/etc/resolv.conf`, kennst die wichtigen Record-Typen und unterscheidest NXDOMAIN, SERVFAIL und „Temporary failure in name resolution“ mit `getent`, `dig` und `resolvectl`.
  - Du schneidest mit `tcpdump` gezielt Verkehr mit und liest DNS-Anfragen und TCP-Handshakes.
  - Du richtest SSH mit ed25519-Schlüsseln, `~/.ssh/config` und ssh-agent ein und findest heraus, warum ein Server einen Schlüssel ablehnt.
  - Du nutzt Port-Forwarding (`-L`, `-R`) und Jump Hosts (`-J`) und überträgst Dateien mit `rsync`, ohne dich von Schrägstrichen und `--delete` überraschen zu lassen.
