id: desktop-wayland
title: Desktop & Wayland
level: 2
minutes: 150
summary: Was zwischen Kernel und Fenster passiert – Wayland und Compositor, Sitzungen, D-Bus und polkit, udev und Grafiktreiber, PipeWire, XDG-Verzeichnisse, Starter und Portale – und wie du Fehler darin eingrenzt.
goals:
  - Du erklärst, wie sich Wayland und X11 beim Zeichnen, bei Eingaben und bei Bildschirmaufnahmen unterscheiden, und welche Rolle Compositor, XWayland und Display Manager spielen.
  - Du fragst Dienste mit `busctl` über D-Bus ab und schreibst polkit-Regeln, die genau eine Aktion freigeben.
  - Du prüfst mit `lspci -k` und `udevadm`, ob ein Gerät seinen Treiber hat, und schreibst udev-Regeln für feste Namen und Rechte.
  - Du ordnest den Grafikstapel ein (DRM, Mesa, NVIDIA mit Open Kernel Modules oder nouveau/NVK) und den Audiostapel (PipeWire, WirePlumber).
  - Du legst `.desktop`-Dateien und Autostart-Einträge nach den XDG-Regeln an und findest heraus, warum einer nicht startet.
