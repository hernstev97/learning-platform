id: rechte-benutzer
title: Rechte & Benutzer
level: 2
minutes: 150
summary: Du verstehst Zugriffsentscheidungen als Zusammenspiel aus Identität, Dateirechten und Verzeichnisrechten und vergibst gezielt die nötigen Rechte.
goals:
  - Du unterscheidest Benutzer, Gruppen sowie reale und effektive Zugriffsrechte.
  - Du liest und änderst Dateimodi symbolisch und oktal.
  - Du erklärst Verzeichnisrechte, umask, Sonderbits und einfache ACLs.
  - Du analysierst Permission denied ohne pauschale Freigaben.
resources:
  - title: Linux · path_resolution(7)
    url: https://man7.org/linux/man-pages/man7/path_resolution.7.html
  - title: GNU Coreutils · File permissions
    url: https://www.gnu.org/software/coreutils/manual/html_node/File-permissions.html
  - title: umask(2)
    url: https://man7.org/linux/man-pages/man2/umask.2.html
  - title: acl(5)
    url: https://man7.org/linux/man-pages/man5/acl.5.html
  - title: sudoers(5)
    url: https://www.sudo.ws/docs/man/sudoers.man/
lesson: |
  Deine App läuft im Terminal, aber als Dienst meldet sie `Permission denied`. Der schnelle Versuch `chmod -R 777` macht die Meldung vielleicht unsichtbar, erlaubt aber jedem lokalen Benutzer Änderungen an Code und Konfiguration. Die bessere Frage lautet: Welcher Prozess braucht welche Operation auf welchem Pfad? Aus dieser Frage ergibt sich eine kleine, nachvollziehbare Freigabe.

  Das klassische Linux-Rechtemodell ordnet Dateien einem Besitzer und einer Gruppe zu. Prozesse besitzen eine Benutzeridentität und Gruppenmitgliedschaften. Der Kernel vergleicht diese Informationen bei jedem Zugriff. Wir üben zuerst mit Dateien in einem eigenen Übungsordner. Benutzerverwaltung und Änderungen an Systemdiensten gehören in eine separate VM, weil sie den laufenden Rechner beeinflussen.

  ## Identität, Konten und Gruppen

  Namen wie `steven` oder `www-data` sind für Menschen. Der Kernel verwendet numerische **UIDs** und **GIDs**. `id` zeigt Benutzerkennung, primäre Gruppe und zusätzliche Gruppen. `whoami` zeigt den Namen zur effektiven Benutzerkennung. Ein Dienst kann daher unter einer anderen Identität laufen als die Shell, die ihn installiert hat ([credentials(7)](https://man7.org/linux/man-pages/man7/credentials.7.html)).

  ```bash
  id
  id steven
  whoami
  groups
  getent passwd steven
  getent group developers
  ```

  `/etc/passwd` enthält lokale Konten mit UID, GID, Home und Login-Shell, aber auf heutigen üblichen Systemen keine Passwort-Hashes. Diese liegen geschützt in `/etc/shadow`. `/etc/group` beschreibt lokale Gruppen. `getent` fragt die konfigurierten Namensdienste ab und kann deshalb auch Konten finden, die nicht direkt in diesen Dateien stehen ([passwd(5)](https://man7.org/linux/man-pages/man5/passwd.5.html), [shadow(5)](https://man7.org/linux/man-pages/man5/shadow.5.html)). Lies Passwort-Hashes für diese Übungen nicht aus und kopiere sie nicht in Fehlerberichte.

  Ein Dienstkonto soll meist keine interaktive Anmeldung erlauben. In einer Debian- oder Arch-VM lässt sich dafür mit passenden Distributionswerkzeugen ein Systemkonto mit eigener Gruppe, festem Datenverzeichnis und einer `nologin`-Shell anlegen. Die konkreten Optionen und Standardpfade prüfst du über `useradd --help`; `adduser` ist auf Debian eine zusätzliche Oberfläche und nicht auf jeder Distribution gleich vorhanden.

  ```bash
  # Nur als Administrationsbeispiel für eine eigene Test-VM:
  sudo groupadd developers
  sudo usermod -aG developers steven
  ```

  Bei `usermod -aG` bedeutet `-a` hinzufügen. Ohne `-a` ersetzt `-G` die Liste zusätzlicher Gruppen. Neue Mitgliedschaften erscheinen in laufenden Prozessen nicht automatisch: Eine neue Anmeldung übernimmt sie. Prüfe mit `id` in der neuen Sitzung, statt durch immer weitere Rechteänderungen ein altes Sitzungsproblem zu verdecken ([usermod(8)](https://man7.org/linux/man-pages/man8/usermod.8.html)).

  ## rwx lesen: Dateien und Verzeichnisse

  `ls -l` zeigt Typ, drei Rechtegruppen, Linkzahl, Besitzer und Gruppe. Bei `-rw-r-----` bezeichnet `-` eine reguläre Datei. Der Besitzer darf lesen und schreiben, die Gruppe lesen, andere nichts. `u`, `g`, `o` stehen für user, group und others. Der Kernel nimmt die passende Klasse; er addiert nicht automatisch sämtliche Klassen, in die ein Benutzer irgendwie fällt ([Coreutils · Mode Structure](https://www.gnu.org/software/coreutils/manual/html_node/Mode-Structure.html)).

  ```text
  -rw-r----- 1 steven developers 120 Sep 28 10:00 app.conf
  drwxr-x--- 2 steven developers  80 Sep 28 10:00 releases
  ```

  Bei Dateien bedeutet `r` Inhalt lesen, `w` Inhalt verändern und `x` ausführen. Das Ausführen eines Skripts kann weitere Bedingungen haben: Der Interpreter braucht Zugang zum Skript, ein Mount kann `noexec` tragen, und der Shebang muss einen erreichbaren Interpreter benennen. Ein einzelnes x-Bit erklärt daher nicht jede Ausführungsstörung.

  Bei Verzeichnissen sind die Operationen anders: `r` erlaubt, die Namen aufzulisten. `x` erlaubt Durchsuchen beziehungsweise Traversieren und den Zugriff auf bekannte Einträge. `w` zusammen mit `x` erlaubt, Einträge anzulegen, umzubenennen oder zu entfernen. Die Schreibrechte einer Datei schützen also nicht automatisch davor, dass ihr Name aus einem beschreibbaren Elternverzeichnis gelöscht wird. Für einen Pfad brauchst du Suchrechte auf allen durchlaufenen Verzeichnissen ([path_resolution(7)](https://man7.org/linux/man-pages/man7/path_resolution.7.html)).

  ```bash
  ls -ld . ./releases
  namei -l ./releases/app.conf
  stat -c '%a %U %G %n' ./releases/app.conf
  ```

  `namei -l` zerlegt den Pfad in Komponenten. Ein Dienst kann `app.conf` lesen dürfen und trotzdem an einem übergeordneten Home-Verzeichnis mit Modus 700 scheitern. Kopiere sensible Konfiguration dann nicht reflexhaft in eine öffentliche Ablage; wähle einen vorgesehenen Dienstpfad und die passende Gruppe.

  > [!MERKE]
  > Zum Lesen einer Datei brauchst du Zugriff auf den gesamten Weg dorthin. Zum Löschen ihres Namens sind vor allem die Rechte am Elternverzeichnis entscheidend.

  ## Rechte gezielt setzen und Erzeugung verstehen

  Symbolische Modi beschreiben eine Änderung. `chmod u+x script.sh` ergänzt das Ausführungsrecht des Besitzers. `chmod go-rwx secret.txt` entfernt alle Rechte von Gruppe und anderen. Ein Gleichheitszeichen setzt die angegebene Klasse auf genau den genannten Satz. Numerische Modi beschreiben die drei Klassen mit `r=4`, `w=2`, `x=1` ([Coreutils · chmod](https://www.gnu.org/software/coreutils/manual/html_node/chmod-invocation.html)).

  ```bash
  chmod u=rw,g=r,o= app.conf
  chmod 640 app.conf
  chmod 750 releases
  chmod 600 token.txt
  chgrp developers app.conf
  ```

  640 bedeutet `rw- r-- ---`, 750 bedeutet `rwx r-x ---`. Ein häufiger Review-Fehler ist dieselbe rekursive Zahl für Dateien und Verzeichnisse: 644 macht Verzeichnisse unzugänglich, 755 macht normale Datendateien ausführbar. Für gemischte Bäume kann `X` helfen: `chmod -R u+rwX,g+rX,o-rwx projekt` ergänzt x nur für Verzeichnisse beziehungsweise bereits irgendwo ausführbare Dateien. Prüfe trotzdem Eigentümer und Zielmenge vor rekursiven Änderungen.

  `chown` ändert den Besitzer; `chown app:app datei` setzt auch die Gruppe. Das Übertragen von Eigentum benötigt gewöhnlich Privilegien. Als Besitzer kannst du mit `chgrp` normalerweise auf eine Gruppe wechseln, der du angehörst. Rechteänderungen und Besitzerwechsel sind verschiedene Werkzeuge für verschiedene Ursachen.

  Die **umask** entfernt beim Erzeugen Rechte aus dem angeforderten Modus. Übliche Programme erzeugen reguläre Dateien mit höchstens 666, Verzeichnisse mit höchstens 777. Bei `umask 027` ergibt das oft 640 und 750. Das ist ein bitweises Entfernen, kein allgemeines arithmetisches Subtrahieren. Bestehende Dateien bleiben unverändert ([umask(2)](https://man7.org/linux/man-pages/man2/umask.2.html)).

  ```bash
  (
    umask 027
    touch bericht.txt
    mkdir berichte
    stat -c '%a %n' bericht.txt berichte
  )
  ```

  Die runden Klammern begrenzen die Änderung auf eine Subshell. Ein Programm kann ausdrücklich restriktivere Modi anfordern. Außerdem können Default-ACLs im Elternverzeichnis die Erzeugung beeinflussen. Merke dir deshalb den üblichen Rechenweg und prüfe anschließend den tatsächlichen Modus.

  ## Sonderbits und ACLs mit begrenztem Zweck

  **Setuid** auf einer ausführbaren Datei lässt deren Prozess mit der effektiven UID des Besitzers laufen. Das erklärt Programme wie `passwd`, die kontrolliert geschützte Kontodaten ändern müssen. Das ist keine Einladung, eigene Shell-Skripte so zu privilegieren; Linux behandelt setuid-Skripte nicht wie setuid-Binärprogramme. Ein Fehler in privilegiertem Code kann zur Rechteausweitung werden ([execve(2)](https://man7.org/linux/man-pages/man2/execve.2.html)).

  **Setgid** auf einem Verzeichnis lässt neue Einträge normalerweise dessen Gruppe übernehmen. Für einen Teamordner ist 2770 deshalb ein übliches Muster; die Schreibrechte neuer Dateien hängen weiterhin von Modus, umask und gegebenenfalls Default-ACL ab. Das **Sticky-Bit** auf einem gemeinsam beschreibbaren Verzeichnis beschränkt das Löschen und Umbenennen fremder Einträge. `/tmp` hat typischerweise Modus 1777. Es verhindert nicht, dass eine ohnehin lesbare Datei gelesen wird ([inode(7)](https://man7.org/linux/man-pages/man7/inode.7.html)).

  ```bash
  chmod 2770 team
  ls -ld team
  getfacl team
  setfacl -m u:reviewer:r-- bericht.txt
  ```

  Eine **ACL** ergänzt gezielte Benutzer- und Gruppenrechte. `getfacl` zeigt sie, `setfacl` verändert sie. Die ACL-Maske begrenzt effektive Rechte benannter Benutzer und der Gruppenklasse; ein großzügiger Eintrag kann durch diese Maske eingeschränkt bleiben. Prüfe bei einem `+` hinter dem Modus in `ls -l` daher die ACL. Verwende ACLs, wenn eine einzelne zusätzliche Freigabe sinnvoller als eine neue gemeinsame Gruppe ist, und dokumentiere diese Ausnahme ([acl(5)](https://man7.org/linux/man-pages/man5/acl.5.html)).

  ## sudo und nachvollziehbare Administration

  `sudo` führt einen erlaubten Befehl unter einer anderen Identität aus, standardmäßig root. `su` wechselt die Benutzeridentität beziehungsweise startet eine andere Shell; `su -` erzeugt dabei eine Login-Umgebung. Für Administration bevorzugst du kurze, konkrete privilegierte Aktionen statt einer dauerhaft offenen Root-Shell. So erkennst du leichter, welcher Schritt die erhöhten Rechte benötigt.

  ```bash
  sudo -l
  sudo -u app id
  sudo visudo
  sudo visudo -c
  ```

  Die Regeln stehen in sudoers und oft in eingebundenen Dateien unter `/etc/sudoers.d`. Bearbeite sie mit `visudo`, das vor dem Speichern Syntax prüft. Ein vermeintlich enger Eintrag für einen Editor, Interpreter oder einen Befehl mit frei wählbarer Konfigurationsdatei kann trotzdem vollständige Root-Möglichkeiten geben. Lies die [sudoers-Dokumentation](https://www.sudo.ws/docs/man/sudoers.man/), bevor du Befehlsfreigaben konstruierst.

  > [!PRAXIS]
  > Dokumentiere bei einer Freigabe den Dienstbenutzer, den Pfad und die benötigte Operation. Ein Reviewer sollte erkennen, weshalb „Gruppe darf lesen“ genügt und weshalb andere Benutzer nichts benötigen.

  ## Häufige Fehler und eine Diagnosefolge

  Beginne bei `Permission denied` mit dem tatsächlichen Dienstkonto und `namei -l`. Prüfe dann Modus, Besitzer, Gruppe und ACL. Wenn diese passen, untersuche Mount-Optionen sowie AppArmor, SELinux oder systemd-Sandboxing. Mehr Unix-Rechte heben eine zusätzliche Sicherheitsrichtlinie nicht automatisch auf. Eine Fehlermeldung benennt das Symptom; sie entscheidet noch nicht, welche Ebene die Operation blockiert.

  Verwende keinen Root-Test als alleinigen Funktionsnachweis. Ein Programm kann unter root funktionieren und unter seinem Dienstkonto weiterhin scheitern. Teste die konkrete Lese- oder Schreiboperation mit der vorgesehenen Identität in einer kontrollierten Umgebung. Vermeide rekursive Besitzerwechsel über unbekannte Bäume: Darin können Paketdateien, Symlinks und gemeinsam genutzte Daten liegen.

  > [!INTERVIEW]
  > „Warum kann ich eine schreibgeschützte Datei löschen?“ – Löschen verändert den Verzeichniseintrag. Die entscheidenden Rechte liegen am Elternverzeichnis; Sticky-Bit, weitere Richtlinien und besondere Attribute können zusätzlich begrenzen.

  ## Zusammenfassung

  - Der Kernel entscheidet anhand von Identität und konkreter Operation.
  - rwx bedeutet auf Verzeichnissen etwas anderes als auf Dateien.
  - Symbolische Modi ändern gezielt; oktale Modi beschreiben einen Satz.
  - Die umask entfernt Rechte bei der Erzeugung.
  - Setgid, Sticky-Bit und ACLs lösen unterschiedliche Spezialfälle.
  - sudoers gehört in visudo und braucht eine überprüfbare Begrenzung.
  - Prüfe mit der Identität des betroffenen Dienstes.
exercises:
  - id: verzeichnis-x
    type: choice
    title: Den Pfad betreten
    prompt: Was erlaubt das x-Recht an einem Verzeichnis?
    options:
      - text: Das Durchsuchen des Verzeichnisses und den Zugriff auf bekannte Einträge
        correct: true
        why: x ist bei Verzeichnissen das Suchrecht.
      - text: Automatisch den gesamten Inhalt jeder enthaltenen Datei zu lesen
        correct: false
        why: Dafür müssen auch die jeweiligen Dateirechte passen.
      - text: Jede enthaltene Datei als Programm auszuführen
        correct: false
        why: Dafür braucht die Datei selbst passende Ausführungsrechte und einen gültigen Programmtyp.
    explanation: Pfadauflösung und Inhaltzugriff sind getrennte Prüfungen. Eine Liste von Namen braucht zusätzlich das Leserecht am Verzeichnis.
    resources:
      - title: path_resolution(7)
        url: https://man7.org/linux/man-pages/man7/path_resolution.7.html
  - id: modus-ausgabe
    type: output
    title: Ein Modus in Zahlen
    prompt: Welche Zahl gibt GNU stat aus? Die Datei entsteht frisch im Übungsverzeichnis.
    lang: bash
    code: |
      touch config.txt
      chmod u=rw,g=r,o= config.txt
      stat -c '%a' config.txt
    expected: '640'
    verify: true
    explanation: Lesen plus Schreiben ergibt 6, Lesen allein 4 und keine Rechte 0. Die drei Ziffern stehen für Besitzer, Gruppe und andere.
    resources:
      - title: Coreutils · File permissions
        url: https://www.gnu.org/software/coreutils/manual/html_node/File-permissions.html
  - id: umask-bits
    type: output
    title: Rechte entfernen
    prompt: Diese Bash-Rechnung modelliert die umask 027 für einen angeforderten Dateimodus 0666. Welcher Modus wird ausgegeben?
    lang: bash
    code: |
      printf '%o\n' "$(( 0666 & ~0027 ))"
    expected: '640'
    verify: true
    explanation: Die Maske entfernt Gruppen-Schreibrecht sowie alle Rechte anderer Benutzer. Da 0666 bereits kein x enthält, entstehen keine Ausführungsrechte.
    resources:
      - title: umask(2)
        url: https://man7.org/linux/man-pages/man2/umask.2.html
  - id: secret-modus
    type: command
    title: Privates Token
    prompt: Setze mit chmod den Modus von `token.txt` exakt auf Lesen und Schreiben nur für den Besitzer. Nutze die dreistellige oktale Schreibweise.
    answers: ["chmod 600 token.txt"]
    explanation: 600 begrenzt die klassischen Dateirechte auf den Besitzer. Zusätzliche Kopien, Backups und bereits geöffnete Deskriptoren verschwinden dadurch nicht.
    resources:
      - title: Coreutils · chmod
        url: https://www.gnu.org/software/coreutils/manual/html_node/chmod-invocation.html
  - id: symbolisch
    type: command
    title: Nur ein Recht ergänzen
    prompt: Ergänze mit symbolischem chmod das Ausführungsrecht des Besitzers an `deploy.sh`, ohne andere Rechte zu ändern.
    answers: ["chmod u+x deploy.sh"]
    explanation: Das Plus ergänzt ein Bit in der angegebenen Klasse. Eine oktale Vollbelegung würde auch andere Klassen neu festlegen.
  - id: gruppe-ergaenzen
    type: command
    title: Eine Mitgliedschaft hinzufügen
    prompt: Ergänze in einer Test-VM mit sudo und usermod den Benutzer `deploy` um die zusätzliche Gruppe `logs`. Erhalte alle bisherigen Gruppen.
    answers: ["sudo usermod -aG logs deploy", "sudo usermod --append --groups logs deploy"]
    explanation: Die Option `-a` verhindert das Ersetzen der bisherigen Zusatzgruppen. Neue Prozesse nach einer erneuten Anmeldung übernehmen die Mitgliedschaft.
    resources:
      - title: usermod(8)
        url: https://man7.org/linux/man-pages/man8/usermod.8.html
  - id: pfad-pruefen
    type: command
    title: Alle Eltern prüfen
    prompt: Zeige mit namei die Rechte jeder Pfadkomponente von `/srv/app/config.txt` an.
    answers: ["namei -l /srv/app/config.txt"]
    explanation: Ein fehlendes Suchrecht in einem Elternverzeichnis blockiert den gesamten Zugriff. Der Modus der letzten Datei allein zeigt diesen Fehler nicht.
    resources:
      - title: namei(1)
        url: https://man7.org/linux/man-pages/man1/namei.1.html
  - id: falscher-verzeichnismodus
    type: bug
    title: Die Gruppe sieht den Namen, kommt aber nicht hinein
    prompt: Der Besitzer soll rwx erhalten, die Gruppe r-x und andere nichts. Nach dieser Zeile fehlt der Gruppe das Suchrecht. Korrigiere den oktalen Modus.
    lang: bash
    code: |
      chmod 740 releases
    lines: [1]
    fix:
      - line: 1
        answers: ["chmod 750 releases"]
    explanation: Gruppenrecht 4 erlaubt das Lesen der Namensliste, aber nicht das Durchsuchen. 5 kombiniert r und x, ohne Schreibrechte zu vergeben.
  - id: umask-erklaeren
    type: explain
    title: Die Grenze einer Voreinstellung
    prompt: Erkläre, warum diese umask bestehende Dateien nicht privat macht und welche üblichen neuen Modi entstehen.
    lang: bash
    code: |
      umask 077
      touch neu.txt
      mkdir privat
    points:
      - Die umask beeinflusst die Erzeugung, keine vorhandenen Dateimodi.
      - Eine frische normale Datei mit angefordertem Modus 666 erhält typischerweise 600.
      - Ein neues Verzeichnis mit angefordertem Modus 777 erhält typischerweise 700.
      - Programme und Default-ACLs können die Annahmen der Rechnung verändern.
    explanation: Die Maske wird beim Anlegen auf den angeforderten Modus angewendet. Existiert `neu.txt` schon, ändert `touch` seinen Modus nicht; deshalb muss die Prüfung frische Namen verwenden.
    resources:
      - title: umask(2)
        url: https://man7.org/linux/man-pages/man2/umask.2.html
  - id: dienst-freigabe
    type: practice
    title: Eine Konfiguration für einen Dienst freigeben
    prompt: Plane für eine Test-VM die Freigabe von `/srv/report/config.ini`. Besitzer ist root, Dienstgruppe report. Der Dienst soll lesen, niemand außer root soll schreiben. Beschreibe auch die Prüfung der Elternverzeichnisse.
    lang: bash
    solution: |
      sudo chown root:report /srv/report/config.ini
      sudo chmod 640 /srv/report/config.ini
      namei -l /srv/report/config.ini
      sudo -u report test -r /srv/report/config.ini
      sudo -u report test ! -w /srv/report/config.ini
    checklist:
      - Die Datei gehört root und der Gruppe report und hat Modus 640.
      - Der Dienstbenutzer ist Mitglied der Gruppe report.
      - Alle Elternverzeichnisse erlauben dem Dienst das nötige Suchrecht.
      - Lesen wird unter der Dienstidentität erfolgreich und Schreiben erfolglos geprüft.
      - Die Prüfung gibt keinen geheimen Dateiinhalt aus.
    explanation: Die Freigabe richtet sich nach der benötigten Operation und bleibt lesend. `test` prüft den Zugriff ohne sensible Konfiguration in Terminal oder Logs zu kopieren.
