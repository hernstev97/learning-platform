id: boot-recovery
title: Boot & Recovery
level: 3
minutes: 170
summary: Wenn ein Server nach dem Neustart nicht zurückkommt – du erkennst an der Konsole, welche Etappe scheitert, und holst das System über GRUB, Rescue- und Emergency-Modus, ein neues initramfs oder chroot zurück.
goals:
  - Du ordnest eine Fehlermeldung beim Start der richtigen Etappe zu (Bootloader, Kernel, initramfs, systemd).
  - Du änderst die Kernelzeile einmalig im GRUB-Menü und dauerhaft über `/etc/default/grub` und `update-grub` und kennst die Gegenstücke bei systemd-boot und Limine.
  - Du unterscheidest `rescue.target`, `emergency.target` und `init=/bin/bash` und bringst ein System aus der Notfall-Shell zurück in den Normalbetrieb.
  - Du findest fstab-Fehler vor dem Neustart und machst optionale Mounts mit `nofail` startsicher.
  - Du baust das initramfs mit `update-initramfs`, `mkinitcpio` oder `dracut` neu und prüfst seinen Inhalt.
  - Du reparierst ein System per chroot aus einem Live-System.
