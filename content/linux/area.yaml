id: linux
title: Linux
short: Linux
tagline: Die Shell beherrschen, das System verstehen, Server betreiben.
description: >
  Terminal und Dateisystem, Textverarbeitung mit Pipes, Rechte und Prozesse,
  Paketverwaltung, systemd, Netzwerk und SSH, Bash-Scripting, Speicher,
  Sicherheit, Container und Fehlersuche – für Desktop und Server.
color: "#FFD400"
order: 3
outcomes:
  - Du bewegst dich sicher im Terminal und kombinierst Werkzeuge mit Pipes und Umleitungen.
  - Du verstehst Rechte, Benutzer, Prozesse, Signale und den Bootvorgang.
  - Du verwaltest Dienste mit **systemd**, liest Logs mit journalctl und planst Aufgaben mit Timern.
  - Du konfigurierst Netzwerk und SSH und sicherst einen Server ab.
  - Du schreibst robuste Bash-Skripte und arbeitest mit Containern.
  - Du findest systematisch die Ursache, wenn etwas nicht läuft – die wichtigste Fähigkeit im Betrieb.
tracks:
