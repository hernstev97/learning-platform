id: linux
title: Linux
short: Linux
tagline: Die Shell beherrschen, das System verstehen, Server betreiben.
description: >
  Terminal und Dateisystem, Textverarbeitung mit Pipes, Rechte und Prozesse,
  Paketverwaltung, systemd, Netzwerk und SSH, Desktop und Wayland, Bash-Scripting,
  Speicher, Boot und Recovery, Sicherheit, Container und Fehlersuche – geübt an
  einem echten Debian, das im Browser läuft.
color: "#FFD400"
order: 3
outcomes:
  - Du bewegst dich sicher im Terminal und kombinierst Werkzeuge mit Pipes und Umleitungen.
  - Du verstehst Rechte, Benutzer, Prozesse, Signale und den Bootvorgang vom Bootloader bis zum Login.
  - Du verwaltest Dienste mit **systemd**, liest Logs mit journalctl und planst Aufgaben mit Timern.
  - Du konfigurierst Netzwerk, Namensauflösung und SSH und sicherst einen Server ab.
  - Du schreibst robuste Bash-Skripte, verwaltest Speicher mit LVM und arbeitest mit Containern.
  - Du holst ein System zurück, das nicht mehr bootet, und weißt, was auf einem Linux-Desktop zwischen Kernel und Fenster passiert.
  - Du findest systematisch die Ursache, wenn etwas nicht läuft – geübt an echten Fehlerbildern in einer VM.
tracks:
  - title: Die Shell
    description: Terminal, Dateisystem, Textwerkzeuge und das Rechtemodell.
    modules: [linux-einstieg, dateisystem, textverarbeitung, rechte-benutzer]
  - title: Das System
    description: Prozesse, Pakete, systemd, Logs, Netzwerk und der Desktop.
    modules: [prozesse, paketverwaltung, systemd-logs, netzwerk-ssh, desktop-wayland]
  - title: Administration & DevOps
    description: Skripte, Speicher, Boot und Recovery, Sicherheit, Container und Fehlersuche im Betrieb.
    modules: [bash-scripting, speicher-dateisysteme, boot-recovery, sicherheit-haertung, container, troubleshooting]
