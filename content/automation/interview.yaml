cards:
- id: lohnt-sich
  q: Wie entscheidest du, ob sich eine Aufgabe automatisieren lohnt?
  a: Beschreibe zuerst den wiederholten Ablauf, seine Häufigkeit und heutige Fehlerkosten. Stelle Bau-,
    Wartungs- und Kontrollaufwand gegenüber. Starte mit einer klar abgegrenzten, rückgängig machbaren
    Teilaufgabe. Eine unklare fachliche Entscheidung wird durch Automatisierung nicht klarer; ihre Regeln
    müssen zuerst nachvollziehbar sein.
  tags:
  - entwurf
  level: 1
- id: idempotenz
  q: Was bedeutet Idempotenz an einem Importbeispiel?
  a: Derselbe Import kann mehrfach laufen, ohne zusätzliche fachliche Datensätze zu erzeugen. Ein stabiler
    externer Schlüssel und ein definierter Aktualisierungsvertrag ermöglichen das. Ein gespeicherter Zeitstempel
    allein verhindert keine Duplikate. Teste den zweiten Lauf ausdrücklich sowie einen Wiederanlauf nach
    teilweise abgeschlossener Arbeit.
  tags:
  - entwurf
  level: 1
- id: dry-run
  q: Was sollte ein brauchbarer Trockenlauf zeigen?
  a: Die konkreten geplanten Änderungen samt Ausgangs- und Zielwerten, ohne sie auszuführen. Planung und
    Ausführung sollen dieselbe Entscheidungslogik verwenden. Validierung und Konflikte gehören schon in
    die Vorschau. Ein Trockenlauf garantiert nicht, dass sich die Welt zwischen Vorschau und Ausführung
    nicht ändert; kritische Vorbedingungen müssen erneut geprüft werden.
  tags:
  - entwurf
  level: 1
- id: plan-ausfuehren
  q: Warum trennst du reine Planung von Seiteneffekten?
  a: Eine reine Funktion kann aus Eingabedaten eine Liste geplanter Aktionen bilden. Diese lässt sich
    ohne Netzwerk oder echte Dateien testen. Ein kleiner Ausführer übernimmt I/O und Fehlerbehandlung.
    Dadurch verwenden Vorschau, Test und echter Lauf denselben fachlichen Plan; die Wirkung der Aktionen
    bleibt trotzdem gesondert zu prüfen.
  tags:
  - entwurf
  level: 1
- id: atomar
  q: Was schützt ein temporäres Schreiben mit anschließendem Ersetzen?
  a: Lesende Prozesse sollen keine halbe Zieldatei sehen. Schreibe die temporäre Datei auf demselben Dateisystem,
    prüfe den Schreibabschluss und ersetze danach das Ziel. Das schützt nicht automatisch vor Stromausfall,
    konkurrierenden Schreibern oder fachlich falschen Inhalten. Für diese Anforderungen sind zusätzliche
    Garantien und Tests nötig.
  tags:
  - dateien
  level: 1
- id: pfade
  q: Warum ist ein fremder Dateiname mehr als nur ein String?
  a: Er kann Pfadtrenner, relative Komponenten oder unerwartete Zeichen enthalten. Leite erlaubte Namen
    nach einem klaren Vertrag ab und prüfe Zielpfade innerhalb eines bekannten Arbeitsbereichs. Auch Symlinks
    und gleichzeitige Änderungen können eine Grenze beeinflussen. Nutze für Übungen ein temporäres Verzeichnis
    statt persönlicher Ordner.
  tags:
  - dateien
  level: 1
- id: verschieben
  q: Welche Konflikte muss ein Datei-Organisierer vor dem Verschieben erkennen?
  a: Gleiche Zielnamen, bereits vorhandene Dateien, fehlende Rechte, Symlinks und Änderungen seit der
    Planung. Entscheide explizit zwischen Überspringen, eindeutigem Umbenennen und Abbruch. Ungefragtes
    Überschreiben ist kein sinnvoller Default. Ein Journal mit Quell- und Zielpfad macht abgeschlossene
    Aktionen nachvollziehbar und unterstützt kontrolliertes Rückgängigmachen.
  tags:
  - dateien
  level: 1
- id: subprocess
  q: Warum ist eine Argumentliste meist besser als `shell=True`?
  a: Ohne Shell werden übergebene Argumente nicht als Shell-Syntax interpretiert. Ein Dateiname mit Semikolon
    bleibt ein Argument. Du brauchst trotzdem passende Argumentvalidierung, etwa gegen Optionen an Stellen
    für Dateinamen. Nutze `shell=True` nur für einen bewusst benötigten Shell-Vertrag und niemals mit
    ungeprüft zusammengesetzter Eingabe.
  tags:
  - prozesse
  level: 2
- id: prozessfehler
  q: Was prüfst du nach dem Start eines externen Programms?
  a: Rückgabecode, Zeitlimit und die laut Vertrag relevante Ausgabe. `check=True` kann einen Fehlercode
    in eine Exception übersetzen. `capture_output=True` puffert Ausgabe im Speicher und passt nicht zu
    unbegrenzten Datenmengen. Ein Timeout kann Aufräumen und Diagnose erfordern; zeige keine geheimen
    Argumente in Fehlermeldungen.
  tags:
  - prozesse
  level: 2
- id: cli-vertrag
  q: Welche drei Ausgabekanäle hat ein CLI fachlich?
  a: stdout trägt das weiterverarbeitbare Ergebnis, stderr Diagnose und der Exit-Code den Erfolg oder
    eine Fehlerklasse. Eine Pipeline soll Daten verarbeiten können, ohne Logzeilen herauszufiltern. Definiere
    die Codes und halte sie stabil. Eine leere Ergebnismenge kann erfolgreicher Betrieb sein und muss
    nicht automatisch einen Fehler bedeuten.
  tags:
  - cli
  level: 1
- id: config
  q: Wie gestaltest du Konfigurationspriorität nachvollziehbar?
  a: Lege eine Reihenfolge fest, etwa Defaults, Datei, Umgebungsvariablen, explizite CLI-Optionen. Wende
    sie zentral an und validiere das Ergebnis einmal vor dem Start. Eine Diagnose darf die Herkunft eines
    Werts zeigen, sollte Geheimnisse aber maskieren. Ein leerer Wert und eine nicht gesetzte Option brauchen
    einen ausdrücklichen Vertrag.
  tags:
  - cli
  level: 1
- id: logging
  q: Was gehört in ein nützliches Job-Log?
  a: Zeitpunkt, Lauf-ID, Phase, betroffene nicht vertrauliche Kennung, Ergebnis und bei Fehlern die Ursache.
    INFO beschreibt wesentliche Abläufe, WARNING Auffälligkeiten und ERROR fehlgeschlagene Arbeit. Vermeide
    ganze vertrauliche Payloads und Token. Ein Log muss helfen, einen konkreten Lauf nachzuvollziehen,
    ohne selbst ein Datenleck zu werden.
  tags:
  - betrieb
  level: 2
- id: csv
  q: Welche CSV-Annahmen sollten explizit sein?
  a: Encoding, Trennzeichen, Kopfzeilen, Zeilenumbrüche und Typumwandlungen. CSV enthält zunächst Text;
    führende Nullen können bei falscher Zahlenumwandlung verloren gehen. Verwende einen Parser statt `split(',')`,
    weil Werte selbst Kommas und Zeilenumbrüche enthalten können. Definiere, wie ungültige Datensätze
    gemeldet werden.
  tags:
  - daten
  level: 1
- id: json
  q: Warum reicht erfolgreiches JSON-Parsen nicht als Validierung?
  a: Der Parser prüft die Syntax. Er sagt nicht, ob Pflichtfelder vorhanden sind, Werte im erlaubten Bereich
    liegen oder die Wurzel eine Liste sein sollte. Validiere die fachliche Struktur danach. Lege fest,
    ob unbekannte Felder erlaubt sind und wie du Formatversionen behandelst.
  tags:
  - daten
  level: 1
- id: yaml
  q: Weshalb benutzt du bei fremdem YAML `safe_load`?
  a: Es begrenzt die Konstruktion auf gewöhnliche Datenstrukturen statt beliebige Python-Objekte aus Tags
    zu erzeugen. Danach musst du weiterhin Struktur, Größen und fachliche Werte prüfen. „Safe“ bedeutet
    nicht, dass jede große oder ungültige Eingabe kostenlos verarbeitet werden kann oder inhaltlich vertrauenswürdig
    ist.
  tags:
  - daten
  level: 1
- id: regex
  q: Wann ist ein Parser besser als ein regulärer Ausdruck?
  a: Wenn das Format verschachtelte oder kontextabhängige Regeln hat, etwa allgemeines HTML oder JSON.
    Regex passt gut zu klar begrenzten lokalen Textmustern. Definiere positive und negative Beispiele,
    nutze rohe Python-Strings für Backslashes und begrenze Eingabegrößen. Lesbarkeit und Fehlerdiagnose
    sind wichtiger als ein spektakuläres Einzeilenmuster.
  tags:
  - text
  level: 2
- id: greedy
  q: Was ist der Unterschied zwischen greedy und lazy?
  a: Ein greedy Quantifizierer versucht zunächst möglichst viel zu erfassen, ein lazy möglichst wenig,
    solange das gesamte Muster passt. Beide können zurückgehen und Alternativen prüfen. Ein lazy `.*?`
    ist deshalb keine allgemeine Sicherheitsgarantie gegen langsames Matching. Oft ist eine konkrete erlaubte
    Zeichenklasse der klarere Vertrag.
  tags:
  - text
  level: 2
- id: http-methoden
  q: Warum ist „GET kann wiederholt werden“ keine vollständige Retry-Strategie?
  a: Die Methodensemantik ist nur eine Grundlage. Du musst Fehlerklasse, Zeitbudget, Ratenbegrenzung und
    Dienstvertrag berücksichtigen. Wiederholungen eines zustandsändernden Aufrufs erfordern besondere
    Vorsicht. Ein Timeout kann nach erfolgreicher Serververarbeitung auftreten; für sichere Wiederholung
    brauchst du gegebenenfalls einen stabilen Idempotenzschlüssel.
  tags:
  - http
  level: 2
- id: statuscodes
  q: Wie unterscheiden sich 401, 403, 429 und 503 für deinen Job?
  a: 401 weist auf fehlende oder nicht akzeptierte Authentifizierung hin, 403 auf verweigerten Zugriff.
    429 signalisiert zu viele Anfragen, 503 vorübergehende Nichtverfügbarkeit. Zugangsdatenfehler löst
    blindes Retry nicht. Bei temporären Fehlern beachte Diensthinweise und ein begrenztes Zeitbudget,
    statt unbegrenzt zu wiederholen.
  tags:
  - http
  level: 2
- id: backoff
  q: Wozu dienen exponentieller Backoff und Jitter?
  a: Backoff vergrößert die Wartezeit zwischen weiteren Versuchen; Jitter verteilt gleichzeitig startende
    Clients zeitlich. Beide verringern zusätzliche Last auf einen gestörten Dienst. Begrenze Versuche
    und Gesamtzeit. Prüfe, ob ein `Retry-After`-Hinweis existiert, und wiederhole nur Operationen, deren
    Vertrag das zulässt.
  tags:
  - http
  level: 2
- id: pagination
  q: Wann aktualisierst du einen Synchronisations-Cursor?
  a: Erst nachdem die zugehörigen Daten zuverlässig verarbeitet oder gespeichert sind. Sonst kann ein
    Absturz den Cursor über unverarbeitete Daten hinausbewegen. Ein Wiederanlauf kann bereits gelesene
    Daten erneut liefern; dafür ist Idempotenz erforderlich. Erkenne außerdem wiederholte Cursor, damit
    ein fehlerhafter Dienst keine Endlosschleife erzeugt.
  tags:
  - http
  level: 2
- id: secrets
  q: Wie hältst du API-Schlüssel aus Repository und Logs heraus?
  a: Lies sie aus einer für den Betrieb vorgesehenen geheimen Konfiguration und übergib sie nur an den
    benötigten Adapter. Logge weder vollständige Header noch Konfigurationsobjekte. Ein `.gitignore` entfernt
    keine bereits veröffentlichte Version. Bei einer tatsächlichen Offenlegung muss der betroffene Schlüssel
    ersetzt werden; bloßes Löschen der Datei reicht nicht.
  tags:
  - betrieb
  level: 2
- id: scraping
  q: Welche Prüfungen kommen vor einem regelmäßigen Scraper?
  a: Kläre erlaubten Zugriff, Nutzungsbedingungen, benötigte Daten und ob eine offizielle API vorhanden
    ist. Begrenze Rate und Umfang, identifiziere den Client angemessen und behandle Fehler. `robots.txt`
    beschreibt Crawling-Regeln und ist keine pauschale Nutzungserlaubnis. Die technische Abrufbarkeit
    ersetzt diese Klärung nicht.
  tags:
  - web
  level: 2
- id: playwright
  q: Wann brauchst du Browserautomation statt HTML-Parsing?
  a: Wenn der benötigte Ablauf tatsächlich Browserzustand oder JavaScript-Interaktion voraussetzt. Für
    vorhandenes statisches HTML ist ein Parser meist einfacher und günstiger. Im Browser nutze stabile
    semantische Locator und zustandsbezogene Wartebedingungen. Feste lange Sleeps verdecken Rennen und
    machen Tests langsam oder instabil.
  tags:
  - web
  level: 2
- id: scraper-test
  q: Wie testest du einen Scraper ohne bei jedem Test die echte Website abzurufen?
  a: Speichere kleine erlaubte HTML-Beispiele ohne persönliche Daten und prüfe den Parser daran. Ergänze
    Varianten mit fehlenden Feldern und verändertem Layout. Der HTTP-Adapter bekommt separate Tests mit
    Fakes. Ein kontrollierter Integrationstest kann später die echte Grenze prüfen, ersetzt aber keine
    deterministischen Tests.
  tags:
  - web
  level: 2
- id: zeitplanung
  q: Was trennt Zeitplan, Ausführung und fachlichen Erfolg?
  a: Ein Scheduler kann einen Start anfordern; das beweist weder tatsächlichen Beginn noch erfolgreichen
    Abschluss. Ein Job muss Start, Ergebnis und letzten Erfolg nachvollziehbar machen. Plane einen Mechanismus
    ein, der auch fehlende Läufe erkennt. Nur Fehlermeldungen im nie gestarteten Prozess würden diesen
    Ausfall nicht melden.
  tags:
  - zeit
  level: 2
- id: cron-systemd
  q: Wann würdest du einen systemd-Timer statt cron wählen?
  a: Wenn du unter systemd Laufzeitumgebung, Service-Lebensdauer und Journal eng zusammen verwalten möchtest.
    Kalender-Timer können mit `Persistent=true` einen verpassten Termin nach Aktivierung nachholen. Das
    bedeutet nicht, dass jede verpasste Periode einzeln abgespielt wird. cron bleibt für einfache Zeitpläne
    brauchbar, braucht aber ebenfalls explizite Umgebung und Diagnose.
  tags:
  - zeit
  level: 2
- id: zeitzonen
  q: Warum ist „jeden Tag um 02:30“ ohne weitere Regel unvollständig?
  a: Es fehlt die Zeitzone und die Behandlung von Zeitumstellungen. Lokale Uhrzeiten können fehlen oder
    doppelt vorkommen. Speichere Zeitpunkte eindeutig und formuliere die fachliche Tagesregel separat.
    Für wiederholte Stunden kann `fold` unterscheiden; es löst nicht alle Fragen zur Geschäftsregel eines
    Schedulers.
  tags:
  - zeit
  level: 2
- id: ueberlappung
  q: Wie verhinderst du zwei gleichzeitig arbeitende Jobinstanzen?
  a: Definiere zuerst, ob der zweite Lauf überspringen, warten oder Arbeit übernehmen soll. Eine passende
    Sperre beziehungsweise Scheduler-Concurrency-Regel setzt diesen Vertrag um. Eine lock-Datei ohne atomaren
    Erwerb und Freigaberegel ist fehleranfällig. Auch bei Sperren bleibt Idempotenz wichtig, weil Abstürze
    und Wiederanläufe auftreten können.
  tags:
  - betrieb
  level: 2
- id: notification
  q: Warum speicherst du einen Benachrichtigungsstatus?
  a: 'Damit der Job bei Neustart weiß, welche fachlichen Ereignisse bereits gemeldet wurden oder noch
    ausstehen. Zwischen Zustellung und lokalem Speichern bleibt eine Fehlergrenze: Ein Timeout kann unklar
    lassen, ob die Nachricht ankam. Definiere daher mögliche Duplikate oder nutze einen Dienst mit passendem
    Idempotenzvertrag.'
  tags:
  - betrieb
  level: 2
- id: alert-fatigue
  q: Wie verhinderst du Benachrichtigungen, die niemand mehr liest?
  a: Melde Zustandsänderungen und handlungsrelevante Fehler mit Kontext, statt jeden Poll zu kommentieren.
    Fasse wiederholte gleiche Fehler zusammen und sende eine Entwarnung bei Erholung. Trenne normale Berichte
    von Alarmen. Prüfe, ob eine Nachricht eine konkrete Handlung ermöglicht und ob fehlende Läufe sichtbar
    werden.
  tags:
  - betrieb
  level: 2
- id: retry-permanent
  q: Wie unterscheiden sich vorübergehende und dauerhafte Fehler?
  a: Ein kurzer Netzwerkausfall kann nach einer Pause verschwinden. Ein fehlendes Pflichtfeld oder ein
    falscher Schlüssel bleibt ohne Eingriff bestehen. Klassifiziere Fehler nah an der I/O-Grenze und definiere
    pro Klasse Abbruch, Wiederholung oder Quarantäne. Ein Catch-all mit Retry verschiebt Diagnose und
    verstärkt manchmal die Störung.
  tags:
  - robustheit
  level: 2
- id: checkpoint
  q: Was muss ein Checkpoint nach einem Absturz aussagen?
  a: Welche Arbeit nachweislich abgeschlossen ist und ab wo weitergearbeitet werden darf. Speichere ihn
    konsistent mit den zugehörigen Ergebnissen. Ein „gestartet“-Marker ist kein Erfolgsbeleg. Teste Abstürze
    vor und nach der Persistenzgrenze, um übersprungene oder doppelte Arbeit zu erkennen.
  tags:
  - robustheit
  level: 2
- id: tests-fakes
  q: Wie prüfst du Retry ohne echte Wartezeiten?
  a: Übergebe Uhr, Schlaf-Funktion und Abrufer als Abhängigkeiten. Der Fake liefert etwa erst einen temporären
    Fehler und danach Erfolg; eine Liste zeichnet Wartezeiten auf. Prüfe maximale Versuche und permanente
    Fehler gesondert. Ein Fake muss den relevanten Dienstvertrag abbilden, nicht jede interne Implementierungsentscheidung.
  tags:
  - tests
  level: 2
- id: clock-test
  q: Warum sollte Zeit eine kontrollierbare Abhängigkeit sein?
  a: Tests für Fälligkeit, Ablauf und Zeitfenster werden sonst von der aktuellen Uhrzeit abhängig. Übergib
    einen Zeitpunkt oder eine Uhrfunktion. Prüfe Grenzen unmittelbar vor und nach dem Termin sowie unterschiedliche
    Zonen. Die echte Scheduler-Integration braucht zusätzlich eine Betriebsprüfung; ein reiner Funktionstest
    beweist keinen tatsächlichen Start.
  tags:
  - tests
  level: 2
- id: github-schedule
  q: Warum darf ein GitHub-Actions-Zeitplan keine harte Echtzeitgarantie voraussetzen?
  a: Geplante Workflows können verzögert werden. Plane Jobs daher so, dass sie den fachlich offenen Zeitraum
    verarbeiten und nachholbar sind, statt nur „jetzt“ anzunehmen. Lege Zeitzone und Intervall nach der
    aktuellen Dokumentation fest und nutze manuellen Start zum Prüfen. Der letzte erfolgreiche Datenzeitpunkt
    ist wichtiger als eine erwartete Startminute.
  tags:
  - ci
  level: 2
- id: ci-permissions
  q: Wie begrenzt du die Rechte eines automatisierten Workflows?
  a: Gib dem Workflow nur die benötigten Token-Berechtigungen und trenne Lesen von Änderungen. Binde fremden
    Code nicht unüberlegt an produktive Geheimnisse. Prüfe die verwendeten Actions und ihre Referenzen.
    Ein funktionierender Lauf zeigt, dass Rechte ausreichen; er beweist nicht, dass alle gewährten Rechte
    nötig sind.
  tags:
  - ci
  level: 2
- id: llm-grenze
  q: Welche Rolle sollte ein LLM in einer zuverlässigen Automatisierung haben?
  a: Es kann einen begrenzten Vorschlag liefern, etwa eine Zusammenfassung oder Klassifikation. Die Anwendung
    prüft Struktur und fachliche Grenzen deterministisch. Bei Ausfall oder ungültiger Antwort braucht
    es einen definierten Fallback. Eine freie Modellantwort erhält nicht automatisch die Berechtigung,
    Befehle auszuführen oder externe Änderungen vorzunehmen.
  tags:
  - ki
  level: 3
- id: prompt-injection
  q: Warum sind Inhalte einer abgerufenen Seite keine Anweisungen für deinen Agenten?
  a: Sie sind untrusted Eingabedaten. Darin enthaltene Aufforderungen dürfen den festgelegten Auftrag,
    erlaubte Werkzeuge oder Geheimnisgrenzen nicht ändern. Trenne Daten von Steuerung, begrenze Fähigkeiten
    und validiere Ergebnisse außerhalb des Modells. Eine zusätzliche Warnung im Prompt allein ist kein
    vollständiger Schutz.
  tags:
  - ki
  level: 3
- id: ki-kosten
  q: Wie begrenzt du Kosten einer Modellintegration?
  a: Setze Limits für Eingabegröße, Ausgabelänge, Aufrufzahl, Wiederholungen und Tagesbudget. Cache geeignete
    Ergebnisse anhand stabiler Eingaben und Modell-/Promptversion. Bei Überschreitung muss der Job kontrolliert
    ohne KI weiterarbeiten oder klar abbrechen. Miss tatsächliche Nutzung statt einen großzügigen Durchschnitt
    als feste Garantie zu behandeln.
  tags:
  - ki
  level: 3
- id: job-fehlt
  q: Der Nachtjob ist seit drei Tagen nicht gelaufen. Was änderst du?
  a: Ich rekonstruiere zuerst Zeitplan, tatsächliche Starts, letzte Erfolge und Betriebsumgebung. Danach
    ergänze ich einen unabhängigen Check auf ausbleibenden Erfolg und einen dokumentierten Wiederanlauf.
    Ich prüfe Rechte, Pfade, Umgebung und Datenpersistenz. Die Ursache bleibt von den Verbesserungen getrennt;
    mehr Logging allein beweist nicht, dass der Zeitplan repariert ist.
  tags:
  - praxis
  level: 3
- id: incident
  q: Wie berichtest du über eine fehlgeschlagene Automatisierung?
  a: Trenne beobachtete Wirkung, Zeitfenster, belegte Ursache und offene Vermutungen. Beschreibe Eindämmung,
    Wiederherstellung und den Nachweis des Ergebnisses. Danach folgt eine konkrete verhältnismäßige Vorbeugung.
    Schreibe nicht „alles sicher“, wenn du nur den letzten Lauf geprüft hast.
  tags:
  - praxis
  level: 3
- id: zeit-gespart
  q: Wie belegst du eingesparte Zeit im Portfolio?
  a: Nenne den manuellen Vergleichsablauf, Anzahl der Vorgänge und gemessene Bearbeitungszeit. Ziehe Kontrolle,
    Wartung und Fehlerbehebung in Betracht. Kennzeichne hochgerechnete Werte als Schätzung. Wenn noch
    keine reale Nutzung stattgefunden hat, zeige eine reproduzierbare Testserie und behaupte keine erfundene
    Teameinsparung.
  tags:
  - praxis
  level: 3
- id: uebergabe
  q: Was braucht eine andere Person, um deinen Job zu übernehmen?
  a: Eine README mit Startweg, Konfiguration, Beispieldaten und Tests sowie ein Runbook für typische Fehler,
    Wiederanlauf und Rücknahme. Erkläre gespeicherten Zustand, Rechte und externe Abhängigkeiten. Lass
    den Ablauf einmal ohne dein Vorwissen durchführen. Unausgesprochene lokale Voraussetzungen sind dabei
    häufig die entscheidenden Fehler.
  tags:
  - praxis
  level: 3
- id: automation-ablehnen
  q: Wann lehnst du eine vollautomatische Aktion ab?
  a: Wenn Regeln, Wirkung oder Rücknahmemöglichkeit noch unklar sind und der Schaden einer falschen Entscheidung
    erheblich wäre. Schlage dann eine Vorschau, begrenzte Teilautomatisierung oder explizite Abnahme vor.
    Beschreibe, welche konkrete Evidenz später mehr Autonomie rechtfertigen würde. Das ist eine technische
    Abwägung, keine pauschale Ablehnung von Automatisierung.
  tags:
  - praxis
  level: 3
