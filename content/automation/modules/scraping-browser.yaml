  type: bug
  title: Der Mock greift nicht
  prompt: |
    Der Test soll die Kursliste aus einer Fixture bekommen, lädt aber die echten Daten von `http://katalog.test/api/kurse`. Finde die Zeile, die das verursacht, und korrigiere sie.
  lang: python
  code: |-
    def test_kurse(page):
        page.route("/api/kurse", liefere_kurse)
        page.goto("http://katalog.test/")
        page.get_by_role("button", name="Laden").click()
        expect(page.get_by_role("row")).to_have_count(2)
  lines:
  - 2
  fix:
  - line: 2
    answers:
    - page.route("**/api/kurse", liefere_kurse)
    - page.route("http://katalog.test/api/kurse", liefere_kurse)
    - page.route("**/api/kurse*", liefere_kurse)
  explanation: |
    Ein Glob in `page.route` muss die ganze URL treffen. `"/api/kurse"` passt nicht auf `http://katalog.test/api/kurse`, also geht die Anfrage ans Netz. `"**/api/kurse"` lässt beliebige Zeichen davor zu. Ein lokaler Lauf mit Playwright 1.63 zeigt genau dieses Verhalten. Nur wenn der Kontext eine `base_url` hat, löst Playwright ein Muster ohne `*` relativ dazu auf.
