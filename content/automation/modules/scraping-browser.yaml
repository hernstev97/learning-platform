- id: zugriff
  type: choice
  title: Welche Ebene wählen?
  prompt: Eine dokumentierte API liefert genau die benötigten Katalogdaten. Was ist der passende erste Ansatz?
  options:
  - text: Die API mit ihrem dokumentierten Vertrag verwenden.
    correct: true
    why: Das vermeidet unnötige Abhängigkeit vom Layout.
  - text: Immer einen Browser mit festen Klickkoordinaten starten.
    correct: false
    why: Das ist unnötig fragil und ressourcenaufwendig.
  - text: HTML grundsätzlich mit einem einzigen Regex zerlegen.
    correct: false
    why: HTML-Struktur gehört in einen Parser.
  explanation: Die einfachste ausreichende Quelle reduziert Zustände und Wartungsaufwand. Browsersteuerung bleibt
    sinnvoll, wenn die Oberfläche selbst der benötigte Zugang ist.
