  - *id001
- id: route-handler
  type: code
  title: Ein Handler für route
  prompt: |
    Schreibe `handler(route)` für `page.route("**/*", handler)`. `route.request` hat `.url` und `.method`. Entscheide für jede Anfrage genau einmal:

    - Host ist nicht `katalog.test`: `route.abort()`.
    - `POST` auf einen Pfad, der mit `/api/` beginnt: `route.fulfill(status=403, json={"fehler": "nur lesen"})`. Der Scraper darf nichts verändern.
    - `GET` auf den Pfad `/api/kurse`: `route.fulfill(json=KURSE)`.
    - Alles andere: `route.continue_()`.

    Prüfe den Host mit `urllib.parse.urlsplit`, nicht mit `in`.
  lang: python
  starter: |-
    from urllib.parse import urlsplit

    KURSE = [{"titel": "Python", "plaetze": 3}]

    def handler(route):
        url = route.request.url
        if "/api/kurse" in url:
            route.fulfill(json=KURSE)
        route.continue_()
  solution: |-
    from urllib.parse import urlsplit

    KURSE = [{"titel": "Python", "plaetze": 3}]

    def handler(route):
        anfrage = route.request
        teile = urlsplit(anfrage.url)
        if teile.hostname != "katalog.test":
            route.abort()
        elif (anfrage.method == "POST"
              and teile.path.startswith("/api/")):
            route.fulfill(status=403,
                          json={"fehler": "nur lesen"})
        elif (anfrage.method == "GET"
              and teile.path == "/api/kurse"):
            route.fulfill(json=KURSE)
        else:
            route.continue_()
  setup: |-
    class _Anfrage:
        def __init__(self, url, method):
            self.url = url
            self.method = method

    class FakeRoute:
        """Merkt sich die Entscheidungen wie Playwrights Route (fulfill, abort, continue_)."""
        def __init__(self, url, method="GET"):
            self.request = _Anfrage(url, method)
            self.aufrufe = []
        def fulfill(self, **kw):
            self.aufrufe.append(("fulfill", kw))
        def abort(self, error_code="failed"):
            self.aufrufe.append(("abort", {}))
        def continue_(self, **kw):
            self.aufrufe.append(("continue_", kw))

    def entscheide(url, method="GET"):
        r = FakeRoute(url, method)
        handler(r)
        assert len(r.aufrufe) == 1, f"{url}: {len(r.aufrufe)} Entscheidungen statt genau einer"
        return r.aufrufe[0]
  tests:
  - name: Kurse aus der Fixture
    code: |-
      art, kw = entscheide("http://katalog.test/api/kurse")
      assert art == "fulfill", art
      assert kw.get("json") == KURSE, kw
  - name: Fremde Hosts werden blockiert
    code: |-
      for url in ["https://tracker.example.com/p.js",
                  "http://katalog.test.evil.example/api/kurse"]:
          art, _ = entscheide(url)
          assert art == "abort", f"{url}: {art}"
  - name: Schreibende API-Aufrufe werden abgelehnt
    code: |-
      art, kw = entscheide("http://katalog.test/api/buchen", "POST")
      assert art == "fulfill" and kw.get("status") == 403, (art, kw)
  - name: Seiten und Bilder laufen weiter
    code: |-
      for url in ["http://katalog.test/kurse",
                  "http://katalog.test/logo.png"]:
          art, _ = entscheide(url)
          assert art == "continue_", f"{url}: {art}"
  hints:
  - '`urlsplit(url).hostname` liefert den Host ohne Port, `.path` den Pfad.'
  - Jeder Zweig ruft genau eine der drei Methoden auf. Eine `if … elif … else`-Kette sorgt dafür.
  explanation: |
    Playwright erwartet, dass ein Handler jede Anfrage genau einmal erledigt. Der Starter ruft nach `fulfill` zusätzlich `continue_` auf, und er erkennt `katalog.test.evil.example` als eigenen Host, weil `in` nur Teilstrings sucht. `urlsplit` vergleicht den echten Hostnamen. Die 403 für `POST` macht aus dem Test eine Sicherung: Versucht der Scraper doch zu buchen, scheitert die Anfrage, statt etwas zu verändern.
  resources:
  - *pwnet
  - title: Playwright · Route
    url: https://playwright.dev/python/docs/api/class-route
- id: belege-bei-fehler
  type: code
  title: Trace und Screenshot nur bei Fehlern
  prompt: |
    Schreibe `mit_belegen(context, page, aktion, name)`.

    - Starte `context.tracing.start(screenshots=True, snapshots=True)` und rufe dann `aktion(page)` auf.
    - Gelingt sie, stoppe mit `context.tracing.stop()` ohne Pfad und gib das Ergebnis von `aktion` zurück.
    - Wirft sie, speichere `page.screenshot(path=f"{name}.png", full_page=True)` und `context.tracing.stop(path=f"{name}.zip")` und wirf danach die ursprüngliche Exception weiter.
    - Scheitert der Screenshot selbst, wird der Trace trotzdem gespeichert, und es kommt die ursprüngliche Exception durch.
  lang: python
  starter: |-
    def mit_belegen(context, page, aktion, name):
        context.tracing.start(screenshots=True,
                              snapshots=True)
        try:
            return aktion(page)
        except Exception:
            page.screenshot(path=f"{name}.png")
            return None
        finally:
            context.tracing.stop()
  solution: |-
    import contextlib

    def mit_belegen(context, page, aktion, name):
        context.tracing.start(screenshots=True,
                              snapshots=True)
        try:
            ergebnis = aktion(page)
        except Exception:
            with contextlib.suppress(Exception):
                page.screenshot(path=f"{name}.png",
                                full_page=True)
            context.tracing.stop(path=f"{name}.zip")
            raise
        context.tracing.stop()
        return ergebnis
  setup: |-
    class FakeTracing:
        def __init__(self):
            self.log = []
        def start(self, **kw):
            self.log.append(("start", kw))
        def stop(self, path=None):
            self.log.append(("stop", path))

    class FakeContext:
        def __init__(self):
            self.tracing = FakeTracing()

    class FakePage:
        def __init__(self, kaputt=False):
            self.kaputt = kaputt
            self.bilder = []
        def screenshot(self, **kw):
            if self.kaputt:
                raise RuntimeError("Seite abgestürzt")
            self.bilder.append(kw)

    def scheitert(page):
        raise TimeoutError("Timeout 15000ms exceeded")
  tests:
  - name: Erfolg – Trace verwerfen, Ergebnis zurück
    code: |-
      ctx, page = FakeContext(), FakePage()
      r = mit_belegen(ctx, page, lambda p: 42, "lauf")
      assert r == 42, r
      assert ctx.tracing.log == [
          ("start", {"screenshots": True, "snapshots": True}),
          ("stop", None)], ctx.tracing.log
      assert page.bilder == []
  - name: Fehler – Screenshot, Trace, Exception
    code: |-
      ctx, page = FakeContext(), FakePage()
      try:
          mit_belegen(ctx, page, scheitert, "lauf-7")
      except TimeoutError:
          pass
      else:
          assert False, "Die Exception wurde verschluckt."
      assert page.bilder == [{"path": "lauf-7.png",
                              "full_page": True}], page.bilder
      assert ctx.tracing.log[-1] == ("stop", "lauf-7.zip"), (
          ctx.tracing.log)
  - name: Kaputter Screenshot verdeckt nichts
    code: |-
      ctx, page = FakeContext(), FakePage(kaputt=True)
      try:
          mit_belegen(ctx, page, scheitert, "lauf-8")
      except TimeoutError:
          pass
      except RuntimeError:
          assert False, "Der Screenshot-Fehler verdeckt die Ursache."
      assert ctx.tracing.log[-1] == ("stop", "lauf-8.zip"), (
          ctx.tracing.log)
  hints:
  - Im `except`-Zweig sammelst du die Belege und beendest mit einem nackten `raise`.
  - '`contextlib.suppress(Exception)` lässt einen Fehler beim Screenshot ins Leere laufen.'
  explanation: |
    Der Starter verschluckt die Exception mit `return None`, und der Job meldet Erfolg. Außerdem stoppt er den Trace immer ohne Pfad, sodass gerade im Fehlerfall nichts gespeichert wird. Die Lösung sammelt Belege nur dann, wenn sie gebraucht werden, und wirft danach dieselbe Exception weiter. Ein Screenshot einer abgestürzten Seite kann selbst scheitern; dieser Folgefehler darf weder den Trace verhindern noch die eigentliche Ursache verdecken.
  resources:
  - *pwtrace
  - title: Python · contextlib.suppress
    url: https://docs.python.org/3/library/contextlib.html#contextlib.suppress
