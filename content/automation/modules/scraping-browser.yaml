- id: hrefs
  type: code
  title: Links aus HTML sammeln
  prompt: Schreibe `links(html)`, die mit HTMLParser alle href-Werte von a-Tags in Reihenfolge liefert. Tags ohne
    href werden ignoriert; leere href-Werte bleiben enthalten.
  lang: python
  starter: |-
    def links(html):
        ...
  solution: |-
    from html.parser import HTMLParser
    def links(html):
        class Parser(HTMLParser):
            def __init__(self):
                super().__init__()
                self.links = []
            def handle_starttag(self, tag, attrs):
                if tag == "a":
                    href = dict(attrs).get("href")
                    if href is not None:
                        self.links.append(href)
        p = Parser()
        p.feed(html)
        return p.links
  tests:
  - name: Zwei
    code: assert links('<a href="/a">A</a><a href="/b">B</a>') == ["/a", "/b"]
  - name: Ohne href
    code: assert links("<a>A</a><p>x</p>") == []
  - name: Leer
    code: assert links('<a href="">A</a>') == [""]
  explanation: Die Callback-Schnittstelle liefert bereits zerlegte Attribute. None und leerer String besitzen hier
    ausdrücklich verschiedene Bedeutung.
  resources:
  - *id001
- id: interne-links
  type: code
  title: Auf eine feste Origin begrenzen
  prompt: 'Schreibe `intern(href)`: Löse gegen https://example.org/katalog/ auf. Akzeptiere nur https, Host example.org,
    keinen Benutzernamen und Port None oder 443; gib die URL zurück, sonst None. Ungültige Ports sollen None ergeben.'
  lang: python
  starter: |-
    def intern(href):
        ...
  solution: |-
    from urllib.parse import urljoin, urlsplit
    def intern(href):
        url = urljoin("https://example.org/katalog/", href)
        try:
            p = urlsplit(url)
            erlaubt = p.scheme == "https" and p.hostname == "example.org" and p.username is None and p.port in (None, 443)
        except ValueError:
            return None
        return url if erlaubt else None
  tests:
  - name: Relativ
    code: assert intern("../python") == "https://example.org/python"
  - name: Fremd
    code: assert intern("https://anders.example/a") is None
  - name: Schema und Port
    code: assert intern("http://example.org/a") is None and intern("https://example.org:444/a") is None
  - name: Benutzerinfo
    code: assert intern("https://name@example.org/a") is None
  explanation: Die Funktion setzt einen engen, konkret prüfbaren Vertrag um. Sie ist kein allgemeiner Netzwerksicherheitsfilter
    für beliebige Benutzer-URLs.
  resources:
  - *id001
