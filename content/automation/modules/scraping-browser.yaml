id: scraping-browser
title: Scraping & Browser-Automatisierung
level: 2
minutes: 180
summary: HTML strukturiert auswerten und dynamische Oberflächen mit Playwright bedienen – mit stabilen Selektoren,
  klaren Grenzen und reproduzierbaren Fixtures.
goals:
- Du wählst API, statisches HTML oder Browser nach der tatsächlichen Datenquelle.
- Du extrahierst HTML mit Parsern und behandelst fehlende Elemente.
- Du nutzt Playwright-Locators und zustandsbezogenes Warten.
- Du prüfst Ziel-URLs und trennst Extraktion von schreibenden Aktionen.
resources:
- &id001
  title: Beautiful Soup · Documentation
  url: https://www.crummy.com/software/BeautifulSoup/bs4/doc/
- title: Playwright · Locators
  url: https://playwright.dev/python/docs/locators
- title: Playwright · Auto-waiting
  url: https://playwright.dev/python/docs/actionability
- title: Python · HTMLParser
  url: https://docs.python.org/3/library/html.parser.html
lesson: |
  Ein interner Katalog hat keine Exportfunktion. Du möchtest regelmäßig Titel und Detail-Links für einen Bericht übernehmen. Die Seite kann die Daten schon im HTML enthalten, sie später per JavaScript laden oder eine dokumentierte API anbieten. Die richtige Lösung beginnt damit, diese Quelle zu erkennen, statt sofort einen Browser zu starten.

  Automatisiere nur zugängliche, für deinen Auftrag erlaubte Inhalte. Die Beispiele verwenden lokale HTML-Fixtures oder reservierte Beispieldomains. Sie umgehen keine Anmeldung oder Zugriffskontrolle. Das technische Ziel ist eine überprüfbare Extraktion, deren Ergebnis sich bei einer Layoutänderung sichtbar als fehlerhaft meldet.

  ## Die passende Zugriffsebene wählen

  Eine dokumentierte API hat normalerweise stabilere Feldnamen als eine gerenderte Oberfläche. Statisches HTML lässt sich ohne Browser parsen. Erst wenn Inhalte oder Interaktionen JavaScript benötigen, ist Browsersteuerung sinnvoll. Ein Browser ist teurer in Startzeit und Ressourcen und bringt zusätzliche Zustände wie Cookies, Dialoge und Navigation mit.

  ```python run
  from html.parser import HTMLParser
  class Links(HTMLParser):
      def __init__(self):
          super().__init__()
          self.hrefs = []
      def handle_starttag(self, tag, attrs):
          if tag == "a":
              href = dict(attrs).get("href")
              if href is not None:
                  self.hrefs.append(href)
  parser = Links()
  parser.feed('<a href="/kurse/python">Python</a><p>Text</p>')
  print(parser.hrefs)
  ```

  [`HTMLParser`](https://docs.python.org/3/library/html.parser.html) zerlegt Tags und Attribute. Das Beispiel braucht keinen regulären Ausdruck und funktioniert unabhängig davon, ob Attribute einfach oder doppelt gequotet sind. Es ist aber kein vollständiger Browser-DOM mit JavaScript-Ausführung. Wähle das Werkzeug passend zu dieser Grenze.

  Vor wiederholten Abrufen prüfst du Anbieterhinweise, Nutzungsbedingungen und robots-Regeln für den konkreten Auftrag. robots.txt beschreibt Crawlerregeln, erteilt aber keine umfassende Erlaubnis und ersetzt keine Zugriffskontrolle. Halte Abrufrate und Datenmenge klein und nutze vorhandene Exporte, wenn sie denselben Zweck erfüllen.

  ## HTML anhand seiner Struktur lesen

  [Beautiful Soup](https://www.crummy.com/software/BeautifulSoup/bs4/doc/) bietet bequeme Suche und CSS-Selektoren. Gib den Parser ausdrücklich an, damit sich das Verhalten nicht nur wegen installierter Zusatzpakete ändert. Die Extraktion sollte fehlende Pflichtfelder erkennen und nicht still einen leeren Bericht liefern.

  ```python
  from bs4 import BeautifulSoup
  html = '<article class="kurs"><h2>Python</h2><a href="/python">Öffnen</a></article>'
  soup = BeautifulSoup(html, "html.parser")
  for karte in soup.select("article.kurs"):
      titel = karte.select_one("h2")
      link = karte.select_one("a[href]")
      if titel is None or link is None:
          raise ValueError("Kurskarte unvollständig")
      print(titel.get_text(" ", strip=True), link["href"])
  ```

  Ein kurzer Selektor mit einem fachlichen Container ist meist stabiler als `div:nth-child(3) > div:nth-child(2)`. Wiederverwendete Klassen können trotzdem mehr Treffer liefern als erwartet. Prüfe Kardinalität: Muss es exakt ein Ergebnis sein, mindestens eines oder dürfen null Treffer normal sein? Das ist eine fachliche Eigenschaft, keine Detailfrage des Parsers.

  Text ist ebenfalls strukturiert. `get_text(" ", strip=True)` setzt zwischen Textteilen einen Trenner; ohne ihn können angrenzende Tags zu einem Wort verschmelzen. HTML-Entities müssen nicht per Hand mit `replace` repariert werden, weil Parser sie passend dekodieren.

  ```python run
  from html import unescape
  print(unescape("Python &amp; Daten"))
  ```

  ## Links auflösen und Ziele begrenzen

  Ein `href` kann relativ, absolut, leer, ein Fragment oder ein anderes Schema wie `mailto:` sein. [`urljoin`](https://docs.python.org/3/library/urllib.parse.html#urllib.parse.urljoin) löst relative Angaben gegen eine Basis auf. Eine absolute fremde URL kann die Basis dabei ersetzen. Prüfe deshalb das Ergebnis, wenn du nur eine bestimmte Origin besuchen willst.

  ```python run
  from urllib.parse import urljoin, urlsplit
  basis = "https://example.org/katalog/"
  ziel = urljoin(basis, "../python?seite=2")
  teile = urlsplit(ziel)
  print(ziel)
  print(teile.scheme, teile.hostname)
  ```

  Vergleiche bei einer Origin-Strategie Schema, Host und effektiven Port. Ein gleicher Host mit fremdem Port kann ein anderer Dienst sein. Ablehnen solltest du außerdem eingebettete Benutzerinformationen und nicht erlaubte Schemata. `urlsplit` ist ein Zerleger, kein vollständiger Sicherheitsvalidator. Wenn URL-Ziele tatsächlich Serverzugriffe auslösen, muss die Netzwerkschicht weitere Anforderungen des konkreten Systems erfüllen.

  ```python run
  from urllib.parse import urlsplit
  for url in ["https://example.org/a", "javascript:alert(1)"]:
      p = urlsplit(url)
      print(p.scheme in {"http", "https"})
  ```

  Die kleine Prüfung zeigt nur die Schemaauswahl. Sie ist kein vollständiger Schutz für beliebige externe URLs. Ein enger Vertrag mit einer festen erlaubten Domain ist leichter überprüfbar als ein generischer „sicherer URL“-Filter.

  ## Playwright bedient sichtbare Zustände

  Ein dynamischer Ablauf wird mit [Playwright-Locators](https://playwright.dev/python/docs/locators) beschrieben. Locators suchen das aktuelle Element beim jeweiligen Zugriff und unterstützen automatisches Warten. Nutze bevorzugt Rollen, zugängliche Namen, Labels oder bewusst vereinbarte Test-IDs.

  ```python
  from playwright.sync_api import sync_playwright, expect
  with sync_playwright() as p:
      browser = p.chromium.launch()
      page = browser.new_page()
      page.goto("http://localhost:8000/katalog.html")
      page.get_by_label("Suche").fill("Python")
      page.get_by_role("button", name="Suchen", exact=True).click()
      expect(page.get_by_role("heading", name="Python", exact=True)).to_be_visible()
      browser.close()
  ```

  Das Beispiel läuft lokal nach Installation von Playwright und Browserdateien. Die Kursumgebung startet keine Browserprozesse aus Python. Die [Actionability-Prüfungen](https://playwright.dev/python/docs/actionability) warten beispielsweise auf geeignete Sichtbarkeit und Interaktionsfähigkeit. Sie ersetzen nicht die Prüfung des fachlichen Ergebnisses nach dem Klick.

  Ein festes `sleep(3)` wartet bei schnellen Antworten unnötig und kann bei langsamen trotzdem zu kurz sein. Warte stattdessen auf eine konkrete Überschrift, einen Antwortzustand oder eine passende Assertion. Gib Grenzen an und behandle einen Timeout als sichtbaren Fehler, statt ihn mit noch längeren Pausen zu verstecken.

  ## Downloads und Seiteneffekte kontrollieren

  Ein Exportbutton kann einen Download auslösen. Playwright kann das Ereignis gezielt erwarten, bevor der Klick erfolgt. So verpasst der Test einen schnellen Download nicht. Der [Download-Leitfaden](https://playwright.dev/python/docs/downloads) beschreibt Lebensdauer und Speichern.

  ```python
  with page.expect_download() as info:
      page.get_by_role("button", name="CSV exportieren", exact=True).click()
  download = info.value
  download.save_as("test-export.csv")
  ```

  Eine erfolgreich gespeicherte Datei ist nur der erste Nachweis. Prüfe anschließend Inhalt, Spalten und erwartete Datensätze. Ein HTML-Fehlerdokument mit CSV-Dateinamen wäre sonst ein scheinbar erfolgreicher Export.

  Schreibende Aktionen wie Löschen, Bestellen oder Senden brauchen einen ausdrücklich autorisierten Auftrag und eine überprüfbare Auswahl. Ein Scraping-Job sollte solche Funktionen gar nicht anbieten, wenn seine Aufgabe nur Lesen ist. Ein Loginzustand kann Zugangsdaten und Sitzungsrechte enthalten; behandle gespeicherte Browserzustände wie Geheimnisse und lege sie nicht ins Repository.

  ## Häufige Fehler und Wartung

  Ein Parser, der plötzlich null Datensätze liefert, kann eine leere Quelle oder einen kaputten Selektor sehen. Diese Fälle sind ohne zusätzliche Prüfung nicht unterscheidbar. Nutze bekannte Strukturmerkmale und zähle erwartete Container. Speichere für Tests kleine anonymisierte HTML-Fixtures, damit Änderungen am Extraktor reproduzierbar sind.

  ```python run
  def pruefe_anzahl(anzahl, leere_erlaubt=False):
      if anzahl == 0 and not leere_erlaubt:
          raise ValueError("Keine Karten gefunden: Struktur prüfen")
      return anzahl
  print(pruefe_anzahl(3))
  ```

  > [!PRAXIS]
  > Prüfe Parser mit einer fehlenden Überschrift, einem zusätzlichen dekorativen Link und einem relativen Pfad. Prüfe den Browser mit einem absichtlich verzögerten Ergebnis. So werden Strukturannahmen und Wartebedingungen sichtbar.

  > [!INTERVIEW]
  > „Warum nicht immer Browser-Automation?“ Weil eine stabile API oder statisches HTML weniger Zustände und Ressourcen benötigen. Ein Browser ist sinnvoll, wenn gerade seine Ausführung oder Interaktion Teil des notwendigen Weges ist.

  > [!MERKE]
  > Ein Klick ohne Exception ist kein vollständiger Erfolg. Der relevante Nachweis ist der erwartete Zustand oder der geprüfte Inhalt danach.

  ## Zusammenfassung

  - Wähle API, HTML-Parser oder Browser anhand der Quelle.
  - Nutze Struktur und prüfe fehlende oder mehrdeutige Treffer.
  - Löse Links auf und begrenze tatsächliche Ziele.
  - Locators und Assertions ersetzen pauschale Schlafzeiten.
  - Extraktion und schreibende Aktionen bleiben getrennte Aufträge.
  - Fixtures machen Layoutänderungen überprüfbar.
