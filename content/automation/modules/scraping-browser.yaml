- id: fixture-browser
  type: practice
  title: Ein lokaler Katalogtest
  prompt: |
    Am PC mit installiertem Playwright: Baue einen Test gegen einen Katalog, den du selbst kontrollierst. Liefere Login-Seite, Katalogseite und `/api/kurse` über `context.route` aus, ganz ohne Server. Melde dich einmal an und speichere den Zustand mit `storage_state`; ein zweiter Kontext lädt ihn und kommt ohne Login auf die Katalogseite. Klicke „Laden“, warte auf die Antwort von `/api/kurse` und prüfe die Zeilen. Bei einem Fehler entstehen Screenshot und Trace, bei Erfolg keine Dateien.
  lang: python
  solution: |-
    from pathlib import Path
    from playwright.sync_api import expect, sync_playwright

    LOGIN = """<label>Name<input></label><button>Anmelden</button>
    <script>document.querySelector("button").onclick = () => {
      document.cookie = "sitzung=platzhalter; path=/";
      location.href = "/kurse"; };</script>"""
    KATALOG = """<h1>Kurse</h1><button>Laden</button><table></table>
    <script>document.querySelector("button").onclick = async () => {
      const r = await fetch("/api/kurse"); const d = await r.json();
      document.querySelector("table").innerHTML =
        d.map(k => `<tr><td>${k.titel}</td></tr>`).join(""); };</script>"""
    KURSE = [{"titel": "Python"}, {"titel": "Rust"}]
    STATE = Path("playwright/.auth/katalog.json")

    def server(route):
        req = route.request
        if req.url.endswith("/api/kurse"):
            route.fulfill(json=KURSE)
        elif req.url.endswith("/login"):
            route.fulfill(body=LOGIN, content_type="text/html")
        elif "sitzung=" in (req.headers.get("cookie") or ""):
            route.fulfill(body=KATALOG, content_type="text/html")
        else:
            route.fulfill(body='<script>location.href="/login"</script>',
                          content_type="text/html")

    def anmelden(browser):
        context = browser.new_context()
        context.route("http://katalog.test/**", server)
        page = context.new_page()
        page.goto("http://katalog.test/login")
        page.get_by_label("Name").fill("test")
        page.get_by_role("button", name="Anmelden").click()
        page.wait_for_url("**/kurse", timeout=10_000)
        STATE.parent.mkdir(parents=True, exist_ok=True)
        context.storage_state(path=STATE)
        context.close()

    def katalog_pruefen(page):
        page.goto("http://katalog.test/kurse")
        if "/login" in page.url:
            raise RuntimeError("Sitzung abgelaufen")
        with page.expect_response("**/api/kurse") as info:
            page.get_by_role("button", name="Laden").click()
        assert info.value.status == 200
        expect(page.get_by_role("row")).to_have_count(2)

    with sync_playwright() as p:
        browser = p.chromium.launch()
        anmelden(browser)
        context = browser.new_context(storage_state=STATE)
        context.route("http://katalog.test/**", server)
        context.tracing.start(screenshots=True, snapshots=True)
        page = context.new_page()
        try:
            katalog_pruefen(page)
        except Exception:
            page.screenshot(path="fehler.png", full_page=True)
            context.tracing.stop(path="trace.zip")
            raise
        else:
            context.tracing.stop()
        finally:
            browser.close()
  checklist:
  - Alle Seiten und die API kommen aus `route`; der Test braucht kein Netz und keinen Server.
  - Der zweite Kontext lädt `storage_state` und landet ohne Login auf der Katalogseite.
  - '`playwright/.auth/` steht in `.gitignore`.'
  - Gewartet wird auf die Antwort von `/api/kurse` und auf die Zeilen, nie mit festen Pausen.
  - Ein absichtlich falscher Button-Name erzeugt `fehler.png` und `trace.zip`, und der Test scheitert.
  - Ein erfolgreicher Lauf hinterlässt keinen Trace.
  explanation: |
    Die Musterlösung lief so mit Playwright 1.63 und Chromium. Der Katalog liegt vollständig in `route`; dadurch prüfst du Login-Zustand, Warten und Extraktion reproduzierbar, ohne einen fremden Dienst zu berühren. Das Cookie ist ein Platzhalter, der Ablauf aber derselbe wie bei einer echten Anmeldung. Probiere den Fehlerfall bewusst aus und öffne den Trace mit `playwright show-trace trace.zip`: Dort siehst du jeden Schritt mit Schnappschuss.
  resources:
  - *pwauth
  - *pwtrace
