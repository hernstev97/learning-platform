- id: treffer-pruefen
  type: code
  title: Genau ein Pflichtfeld
  prompt: 'Schreibe `einziger(werte)`: Wenn genau ein Wert vorhanden ist, liefere ihn. Bei null oder mehreren Werten
    wirf ValueError. werte ist eine Liste.'
  lang: python
  starter: |-
    def einziger(werte):
        ...
  solution: |-
    def einziger(werte):
        if len(werte) != 1:
            raise ValueError("Genau ein Treffer erwartet")
        return werte[0]
  tests:
  - name: Einer
    code: assert einziger(["Python"]) == "Python"
  - name: Keiner
    code: |-
      try:
          einziger([])
      except ValueError:
          pass
      else:
          assert False, "Fehlender Treffer muss sichtbar sein"
  - name: Mehrere
    code: |-
      try:
          einziger(["a", "b"])
      except ValueError:
          pass
      else:
          assert False, "Mehrdeutigkeit muss sichtbar sein"
  explanation: Ein Selektor kann nach einer Layoutänderung mehr Treffer liefern. Die Kardinalitätsprüfung verhindert,
    dass dann zufällig der erste falsche Wert verwendet wird.
  resources:
  - *id001
- id: selektor
  type: bug
  title: Die fehlende Karte wird verschwiegen
  prompt: Keine Kurskarte sollte einen sichtbaren Strukturfehler auslösen. Der aktuelle Code liefert still eine
    leere Liste. Ersetze die markierte Zeile.
  lang: python
  code: |-
    def pruefe(karten):
        if not karten:
            return []
        return karten
  lines:
  - 3
  fix:
  - line: 3
    answers:
    - raise ValueError("Keine Kurskarten gefunden")
  explanation: Der leere Zustand ist in diesem Vertrag unerwartet. Eine Exception unterscheidet einen kaputten Extraktor
    von einem erfolgreichen leeren Ergebnis.
  resources:
  - *id001
- id: warten
  type: explain
  title: Warum eine Assertion nach dem Klick?
  prompt: Erkläre den Unterschied zwischen Aktion und Ergebnisnachweis.
  lang: python
  code: |-
    page.get_by_role("button", name="Suchen").click()
    expect(page.get_by_role("heading", name="Ergebnisse")).to_be_visible()
  points:
  - click wartet auf passende Interaktionsfähigkeit.
  - Der Klick allein beweist noch kein fachliches Suchergebnis.
  - Die Assertion wartet auf den erwarteten Zustand.
  - Ein Timeout liefert einen sichtbaren Fehler statt eines zufälligen Zeitpunkts.
  explanation: 'Die beiden Schritte prüfen verschiedene Dinge: Bedienbarkeit und Ergebnis. Ein zeitbasierter Schlaf
    würde weder die richtige Überschrift noch die abgeschlossene Suche verifizieren.'
  resources:
  - *id001
- id: fixture-browser
  type: practice
  title: Ein lokaler Katalogtest
  prompt: Lege eine lokale HTML-Seite mit Suchfeld, Suchen-Button und Kursüberschrift an. Bediene sie mit Playwright
    und prüfe die Extraktion.
  lang: python
  solution: |-
    from playwright.sync_api import sync_playwright, expect
    with sync_playwright() as p:
        browser = p.chromium.launch()
        page = browser.new_page()
        page.set_content('<label>Suche<input></label><button>Suchen</button><h2>Python</h2>')
        page.get_by_label("Suche").fill("Python")
        page.get_by_role("button", name="Suchen", exact=True).click()
        expect(page.get_by_role("heading", name="Python", exact=True)).to_be_visible()
        browser.close()
  checklist:
  - Der Test benutzt eine selbst kontrollierte lokale Fixture.
  - Selektoren verwenden Label, Rolle oder stabile Test-ID.
  - Fehlende Überschrift lässt die Prüfung scheitern.
  - Es gibt keine pauschalen sleep-Aufrufe.
  - Browser und temporäre Daten werden aufgeräumt.
  explanation: Die Fixture prüft die Bedien- und Selektorlogik ohne fremden Dienst. Eine echte dynamische Suchfunktion
    benötigt zusätzlich ihren eigenen Ergebnis- und Ladezustandstest.
  resources:
  - *id001
