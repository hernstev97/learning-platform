id: datenformate
title: Datenformate zuverlässig verarbeiten
level: 2
minutes: 210
summary: CSV, JSON, YAML, TOML und Excel lesen, prüfen und exportieren – mit klaren Typen, Encoding, echten
  Arbeitsmappen und nachvollziehbaren Fehlern.
goals:
- Du trennst Parsen, fachliche Validierung und Transformation.
- Du verarbeitest CSV mit dem csv-Modul statt durch split.
- Du behandelst JSON-Typen, Dezimalzahlen und fehlende Werte ausdrücklich.
- Du wählst sichere YAML-Loader für Konfiguration.
- Du schreibst Excel-Arbeitsmappen mit mehreren Blättern, Formaten und Formeln und liest sie über Spaltennamen
  wieder ein.
resources:
- &id001
  title: Python · csv
  url: https://docs.python.org/3/library/csv.html
- title: Python · json
  url: https://docs.python.org/3/library/json.html
- title: PyYAML · Documentation
  url: https://pyyaml.org/wiki/PyYAMLDocumentation
- &xl
  title: openpyxl · Tutorial
  url: https://openpyxl.readthedocs.io/en/stable/tutorial.html
- &xlstyle
  title: openpyxl · Working with styles
  url: https://openpyxl.readthedocs.io/en/stable/styles.html
place: unterwegs
lesson: |
  Eine monatliche Auswertung bekommt Verkäufe aus CSV, Einstellungen aus YAML und eine Excel-Vorlage von einem Kollegen. Die Dateien sehen wie Text oder Tabellen aus, haben aber unterschiedliche Typregeln. Die Zeichenfolge `0012` kann eine Artikelnummer sein, ein leeres Feld ein fehlender Wert und `1,50` ein Geldbetrag. Ohne fachlichen Vertrag gehen solche Unterschiede beim Import verloren.

  Eine robuste Pipeline hat drei Schritte: Syntax lesen, Daten validieren, anschließend transformieren. Das Format erklärt, wie Bytes zu Werten werden. Es entscheidet nicht automatisch, ob diese Werte für deinen Auftrag sinnvoll sind. Bewahre diese Trennung auch im Fehlerbericht: „Ungültiges JSON“ und „negative Menge in Zeile 8“ helfen bei unterschiedlichen Problemen.

  ## Encoding und Datenmodell zuerst klären

  Eine Textdatei besteht aus Bytes. Ein Encoding wie UTF-8 übersetzt sie in Zeichen. Gib es beim Lesen und Schreiben ausdrücklich an. Eine falsch gewählte Kodierung kann Exceptions oder verstümmelte Umlaute erzeugen. `errors="ignore"` ist für einen fachlichen Import meist keine Reparatur, weil es Informationen still entfernt.

  ```python run
  from pathlib import Path
  pfad = Path("notiz.txt")
  pfad.write_text("Größe: 12\n",
                  encoding="utf-8")
  text = pfad.read_text(
      encoding="utf-8")
  print(text.strip())
  ```

  Definiere danach ein internes Modell. Eine Artikelnummer bleibt ein String, Mengen werden Integer und Geldbeträge können ganzzahlige Cent oder `Decimal` sein. Mit [`decimal`](https://docs.python.org/3/library/decimal.html) verarbeitest du Dezimalzahlen ohne binäre Rundungsüberraschungen. Erzeuge Decimal aus einem String, nicht aus einem bereits gerundeten Float.

  ```python run
  from decimal import Decimal
  preis = Decimal("1.50")
  print(preis * 3)
  print("0012")
  ```

  Für Rundung brauchst du eine fachliche Regel. „Immer auf zwei Stellen“ sagt noch nicht, ob Halbwerte aufgerundet, abgerundet oder zur geraden Zahl gerundet werden. Entscheide das anhand der Aufgabe und dokumentiere es. Eine Automatismusentscheidung beim Parser sollte keine versteckte Geschäftsregel werden.

  ## CSV ist mehr als Kommas trennen

  CSV erlaubt quotierte Felder, Trennzeichen innerhalb eines Wertes und Zeilenumbrüche in einer Zelle. `zeile.split(",")` kann diese Fälle nicht korrekt behandeln. Nutze [`csv.reader` oder `DictReader`](https://docs.python.org/3/library/csv.html). Bei Dateiobjekten schreibt die Python-Dokumentation `newline=""` vor, damit das csv-Modul Zeilenenden selbst verarbeitet.

  ```python run
  import csv
  from io import StringIO
  text = ('id;titel;menge\n'
          '0012;"Bericht; Mai";3\n')
  datei = StringIO(text, newline="")
  leser = csv.DictReader(
      datei, delimiter=";")
  zeile = next(leser)
  print(zeile["id"])
  print(zeile["titel"])
  print(int(zeile["menge"]))
  ```

  CSV besitzt normalerweise keine verbindlichen Spaltentypen. `DictReader` liefert Strings; auch `"3"` bleibt zunächst Text. Prüfe die erforderlichen Überschriften, melde eine nachvollziehbare Zeilenposition und konvertiere nur Felder, deren Bedeutung feststeht. Ein Sniffer kann bei unbekannten Dateien helfen, aber eine bekannte Exportquelle sollte einen vereinbarten Dialekt haben.

  ```python run
  import csv
  from io import StringIO
  puffer = StringIO(newline="")
  w = csv.DictWriter(
      puffer, ["id", "titel"],
      delimiter=";")
  w.writeheader()
  zeile = {"id": "0012",
           "titel": "Bericht; Mai"}
  w.writerow(zeile)
  print(puffer.getvalue().strip())
  ```

  `DictWriter` übernimmt das Quoting. Die feste Feldreihenfolge macht Exporte stabil. Wenn die Datei in einer Tabellenkalkulation geöffnet wird, können Texte mit bestimmten Anfangszeichen als Formel interpretiert werden. Behandle solche Exporte als eigene Zielumgebung und lege eine geeignete Textstrategie fest; ändere Rohdaten nicht stillschweigend ohne dokumentierten Vertrag. Für Excel-Dateien zeigt der Abschnitt über Formeln weiter unten, wie du Text ausdrücklich als Text speicherst.

  ## JSON: gültige Syntax ist noch kein Schema

  [`json.loads`](https://docs.python.org/3/library/json.html) wandelt einen JSON-String in Python-Werte um. Objekte werden Dictionaries, Arrays Listen, `null` wird `None`, Boolesche Werte werden `bool`. Die Schlüssel eines JSON-Objekts sind Strings. JSON enthält keinen eingebauten Datums- oder Decimal-Typ; du brauchst dafür eine vereinbarte Darstellung.

  ```python run
  import json
  text = """{"id": "0012",
    "menge": 3, "aktiv": true,
    "datum": null}"""
  daten = json.loads(text)
  menge = daten["menge"]
  print(type(menge).__name__)
  print(daten["aktiv"])
  print(daten["datum"])
  print(json.dumps(daten,
                   sort_keys=True))
  ```

  Für öffentliche JSON-Schnittstellen solltest du nichtstandardisierte Zahlenwerte wie NaN vermeiden. Python erlaubt beim Schreiben standardmäßig einige solche Werte; `allow_nan=False` lehnt sie ab. Beim Lesen kannst du zusätzliche Regeln setzen. Das ist ein Beispiel dafür, dass das Verhalten einer konkreten Bibliothek breiter sein kann als dein Datenvertrag.

  ```python run
  import json
  try:
      json.dumps(float("nan"),
                 allow_nan=False)
  except ValueError:
      print("Kein endlicher Wert")
  ```

  `isinstance(wert, int)` akzeptiert in Python auch `True`, weil bool eine Unterklasse von int ist. Wenn eine Menge eine echte Integerzahl sein muss, ist `type(wert) is int` eine mögliche präzise Prüfung. Trenne ferner ein fehlendes Feld von einem ausdrücklich gesetzten `null`, wenn diese Zustände fachlich verschieden sind.

  ## YAML und TOML für Konfiguration

  YAML kann komplexer sein, als eine kleine Konfigurationsdatei vermuten lässt. Verwende für fremde Daten [`yaml.safe_load`](https://pyyaml.org/wiki/PyYAMLDocumentation), nicht einen Loader, der beliebige Python-Objekte rekonstruieren darf. Danach prüfst du, ob überhaupt ein Dictionary entstanden ist; eine leere YAML-Datei kann `None` ergeben.

  ```python
  import yaml
  konf = yaml.safe_load(
      "name: bericht\nlimit: 20\n")
  if not isinstance(konf, dict):
      raise ValueError(
          "Konfiguration ist keine "
          "Zuordnung")
  ```

  YAML-Implementierungen können implizite Typen unterschiedlich auslegen. Quote IDs, Datumsähnliches und absichtlich textuelle Werte, wenn du eine eindeutige Darstellung willst. Für Anwendungskonfiguration mit klarer Tabellenstruktur ist TOML oft übersichtlich. [`tomllib`](https://docs.python.org/3/library/tomllib.html) liest es in der Standardbibliothek.

  ```python run
  import tomllib
  text = ('[export]\n'
          'format = "csv"\n')
  daten = tomllib.loads(text)
  print(daten["export"]["format"])
  ```

  Unabhängig vom Format brauchst du erlaubte Schlüssel, Wertebereiche und Defaults. Ein Tippfehler wie `limti` sollte nicht unbemerkt einen Standardwert auslösen, wenn dadurch plötzlich alle Datensätze exportiert werden. Gib bei ungültiger Konfiguration einen hilfreichen Fehler aus und starte keine halb konfigurierte Verarbeitung.

  ## Excel: Arbeitsmappe, Blätter und Zellen

  Eine XLSX-Datei ist ein ZIP-Archiv mit XML-Teilen. Darin liegt eine Arbeitsmappe mit Tabellenblättern, und jede Zelle hat einen Wert, einen Typ und eine Formatierung. [`openpyxl`](https://openpyxl.readthedocs.io/en/stable/tutorial.html) liest und schreibt dieses Format; das alte Binärformat `.xls` kann es nicht. In diesem Kurs läuft openpyxl auch im Browser: Beim ersten `import openpyxl` lädt die Seite das Paket nach.

  ```python run
  from openpyxl import Workbook

  buch = Workbook()
  blatt = buch.active
  blatt.title = "Umsatz"
  blatt.append(["Region", "Betrag"])
  blatt.append(["Nord", 120.5])
  blatt.append(["Süd", 80])
  fehler = buch.create_sheet(
      "Fehler")
  fehler.append(["Zeile", "Grund"])
  buch.save("bericht.xlsx")
  print(buch.sheetnames)
  print(blatt.dimensions)
  ```

  Eine neue Mappe hat genau ein Blatt namens `Sheet`; `buch.active` liefert es. `append` schreibt eine Zeile unter die letzte belegte. `create_sheet(name, index)` fügt ein Blatt an einer Position ein, ohne Index am Ende. Achtung: `active` ist eine **Position**, kein fest gemerktes Blatt. Fügst du an Position 0 ein, zeigt `active` danach auf das neue Blatt. Greife deshalb beim Lesen und Schreiben über den Namen zu, `buch["Umsatz"]`, statt dich auf das aktive Blatt zu verlassen.

  Beim Lesen öffnet [`load_workbook`](https://openpyxl.readthedocs.io/en/stable/tutorial.html#loading-from-a-file) die Datei. `iter_rows(values_only=True)` liefert Tupel mit Werten statt Zellobjekten. Die Eigenschaft `values` liefert alle Zeilen auf einmal, die erste ist meist die Kopfzeile.

  ```python run
  from openpyxl import Workbook
  from openpyxl import load_workbook

  buch = Workbook()
  ws = buch.active
  ws.title = "Eingang"
  ws.append(["menge", "id"])
  ws.append([3, "0012"])
  buch.save("ein.xlsx")

  ws = load_workbook("ein.xlsx")[
      "Eingang"]
  kopf, *zeilen = ws.values
  pos = {name: i for i, name
         in enumerate(kopf)}
  for zeile in zeilen:
      print(zeile[pos["id"]],
            zeile[pos["menge"]])
  ```

  Die Kopfzeile wird zu einer Zuordnung von Spaltenname auf Position. So überlebt der Import, wenn jemand Spalten umsortiert oder eine Notizspalte einfügt. Prüfe, dass alle Pflichtspalten vorhanden sind, und melde fehlende mit Namen. Zellen haben Typen: `"0012"` bleibt Text, `3` wird eine Zahl. Leere Zellen ergeben `None`, und eine vollständig leere Zeile in der Mitte ist häufig, weil Menschen Tabellen gliedern.

  Für sehr große Mappen gibt es [Read-only- und Write-only-Modi](https://openpyxl.readthedocs.io/en/stable/optimized.html). Eine im Read-only-Modus geöffnete Mappe musst du mit `close()` schließen. Öffne und speichere die Originaldatei eines Kollegen nicht unter demselben Namen: Das Tutorial warnt, dass openpyxl nicht alle Inhalte einer Excel-Datei liest und Formen beim Speichern verloren gehen. `save` überschreibt außerdem ohne Rückfrage.

  ## Excel: Formeln, Formate und gespeicherte Ergebnisse

  Eine Zelle, deren Text mit `=` beginnt, speichert openpyxl als **Formel**. Es rechnet sie nicht aus. Das tut erst die Tabellenkalkulation beim Öffnen, und sie legt das Ergebnis beim Speichern als zwischengespeicherten Wert in der Datei ab. Formeln stehen in der Datei mit englischen Funktionsnamen und Kommas: Microsoft beschreibt in [Range.FormulaLocal](https://learn.microsoft.com/en-us/office/vba/api/excel.range.formulalocal), dass ein deutsches Excel dieselbe gespeicherte Formel `=SUM(A1:A10)` als `=SUMME(A1:A10)` anzeigt.

  ```python run
  from openpyxl import Workbook
  from openpyxl import load_workbook
  from openpyxl.styles import Font

  buch = Workbook()
  ws = buch.active
  ws.append(["Region", "Betrag"])
  ws.append(["Nord", 120.5])
  ws.append(["Süd", 80])
  ws["A4"] = "Summe"
  ws["B4"] = "=SUM(B2:B3)"
  ws["A1"].font = Font(bold=True)
  for zeile in range(2, 5):
      z = ws.cell(zeile, 2)
      z.number_format = "#,##0.00"
  ws.freeze_panes = "A2"
  buch.save("umsatz.xlsx")

  roh = load_workbook("umsatz.xlsx")
  print(roh.active["B4"].value)
  werte = load_workbook(
      "umsatz.xlsx", data_only=True)
  print(werte.active["B4"].value)
  ```

  Ohne Option liest `load_workbook` den Formeltext. Mit `data_only=True` liest es den zwischengespeicherten Wert, und den gibt es hier nicht, weil nie eine Tabellenkalkulation die Datei geöffnet hat: Ergebnis `None`. Bei einer Datei, die Excel gespeichert hat, steht dort der Wert vom letzten Speichern. Er kann veraltet sein, wenn danach jemand die Eingaben per Skript geändert hat. Braucht dein Skript eine Summe, rechne sie in Python aus. Eine Formel in der Ausgabedatei ist für die Menschen, die später Zahlen ändern.

  Formatierung ist getrennt vom Wert. `number_format = "#,##0.00"` zeigt `120.5` als `120,50` in einem deutschen Excel, der gespeicherte Wert bleibt die Zahl. Schreibe deshalb Zahlen als `int` oder `float`, nie als vorformatierten Text wie `"120,50 €"`: Den kann niemand mehr summieren. [Schriften, Füllungen und Zahlenformate](https://openpyxl.readthedocs.io/en/stable/styles.html) setzt du pro Zelle. `freeze_panes = "A2"` hält die Kopfzeile beim Scrollen sichtbar.

  Die Formelregel hat eine Kehrseite. Ein Kundenname, der mit `=` beginnt, würde ebenfalls zur Formel. Bei fremden Texten setzt du nach der Zuweisung den Zelltyp ausdrücklich auf Text. [`Cell.data_type`](https://openpyxl.readthedocs.io/en/stable/api/openpyxl.cell.cell.html) ist `"f"` für Formeln, `"s"` für Text und `"n"` für Zahlen.

  ```python run
  from openpyxl import Workbook

  ws = Workbook().active
  ws["A1"] = "=2+3"
  print(ws["A1"].data_type)
  ws["A2"] = "=2+3"
  ws["A2"].data_type = "s"
  print(ws["A2"].data_type)
  ```

  > [!WARNING] Formeln aus fremden Daten
  > Text aus einer API oder einem Formular landet sonst als ausführbare Formel in einer Datei, die jemand mit Excel öffnet. Formeln wie `HYPERLINK` oder Verweise auf andere Dateien sind dort mehr als harmlose Zeichen.

  ## Häufige Fehler und Praxis

  Die häufigsten Defekte entstehen durch implizite Annahmen: Alle CSV-Dateien seien kommagetrennt, jede JSON-Zahl sei eine gültige Menge, jede Excel-Formel sei frisch berechnet oder die Mengenspalte stehe immer an dritter Stelle. Erzeuge kleine Referenzdateien mit genau diesen Gegenbeispielen und halte erwartete Normalformen daneben fest.

  Bei Excel kommen drei Fehler dazu. Erstens wird `buch.active` als „das richtige Blatt“ benutzt, obwohl jemand ein Deckblatt eingefügt hat. Zweitens werden Beträge als formatierter Text geschrieben. Drittens überschreibt ein Skript die einzige Originalmappe, und Diagramme oder Formen sind weg.

  > [!PRAXIS]
  > Gib Fehler als Zeilennummer, Feldname und kurze Ursache zurück. So kann jemand die Eingabedatei reparieren, ohne deinen Code zu lesen. Bei personenbezogenen Daten gehört nicht automatisch die ganze Zeile ins Log. Ein Excel-Bericht bekommt ein eigenes Blatt „Fehler“ mit genau diesen Angaben.

  > [!INTERVIEW]
  > „Was prüfst du nach json.loads?“ Die Wurzelform, Pflichtfelder, Typen und fachlichen Wertebereiche. Ein syntaktisch gültiges Dokument kann weiterhin vollständig unbrauchbar sein. Bei Excel kommt die Frage dazu, ob du Formeltext oder Ergebnis liest und woher das Ergebnis stammt.

  > [!TIP]
  > Ein Roundtrip-Test liest einen erzeugten Export wieder ein und vergleicht fachliche Werte. Er ergänzt einen bekannten Referenzfall, ersetzt ihn aber nicht: Schreiber und Leser könnten denselben Fehler teilen.

  ## Zusammenfassung

  - Encoding und Datentypen sind Teil des Importvertrags.
  - CSV braucht einen echten Parser und festgelegten Dialekt.
  - JSON-Syntax ersetzt keine fachliche Validierung.
  - YAML wird sicher geladen und danach geprüft.
  - Excel-Blätter sprichst du über ihren Namen an, Spalten über die Kopfzeile.
  - openpyxl speichert Formeln und rechnet sie nicht; `data_only` liest nur gespeicherte Ergebnisse.
  - Zahlen bleiben Zahlen mit Zahlenformat, fremder Text wird ausdrücklich Text.
  - Originale bleiben erhalten; Exporte und Fehler sind nachvollziehbar.
