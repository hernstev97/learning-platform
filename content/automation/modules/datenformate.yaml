id: datenformate
title: Datenformate zuverlässig verarbeiten
level: 2
minutes: 170
summary: CSV, JSON, YAML, TOML und Excel lesen, prüfen und exportieren – mit klaren Typen, Encoding und nachvollziehbaren
  Fehlern.
goals:
- Du trennst Parsen, fachliche Validierung und Transformation.
- Du verarbeitest CSV mit dem csv-Modul statt durch split.
- Du behandelst JSON-Typen, Dezimalzahlen und fehlende Werte ausdrücklich.
- Du wählst sichere YAML-Loader und prüfst Excel-Arbeitsmappen mit ihren Grenzen.
resources:
- &id001
  title: Python · csv
  url: https://docs.python.org/3/library/csv.html
- title: Python · json
  url: https://docs.python.org/3/library/json.html
- title: PyYAML · Documentation
  url: https://pyyaml.org/wiki/PyYAMLDocumentation
- title: openpyxl · Tutorial
  url: https://openpyxl.readthedocs.io/en/stable/tutorial.html
lesson: |
  Eine monatliche Auswertung bekommt Verkäufe aus CSV, Einstellungen aus YAML und eine Excel-Vorlage von einem Kollegen. Die Dateien sehen wie Text oder Tabellen aus, haben aber unterschiedliche Typregeln. Die Zeichenfolge `0012` kann eine Artikelnummer sein, ein leeres Feld ein fehlender Wert und `1,50` ein Geldbetrag. Ohne fachlichen Vertrag gehen solche Unterschiede beim Import verloren.

  Eine robuste Pipeline hat drei Schritte: Syntax lesen, Daten validieren, anschließend transformieren. Das Format erklärt, wie Bytes zu Werten werden. Es entscheidet nicht automatisch, ob diese Werte für deinen Auftrag sinnvoll sind. Bewahre diese Trennung auch im Fehlerbericht: „Ungültiges JSON“ und „negative Menge in Zeile 8“ helfen bei unterschiedlichen Problemen.

  ## Encoding und Datenmodell zuerst klären

  Eine Textdatei besteht aus Bytes. Ein Encoding wie UTF-8 übersetzt sie in Zeichen. Gib es beim Lesen und Schreiben ausdrücklich an. Eine falsch gewählte Kodierung kann Exceptions oder verstümmelte Umlaute erzeugen. `errors="ignore"` ist für einen fachlichen Import meist keine Reparatur, weil es Informationen still entfernt.

  ```python run
  from pathlib import Path
  pfad = Path("notiz.txt")
  pfad.write_text("Größe: 12\n", encoding="utf-8")
  print(pfad.read_text(encoding="utf-8").strip())
  ```

  Definiere danach ein internes Modell. Eine Artikelnummer bleibt ein String, Mengen werden Integer und Geldbeträge können ganzzahlige Cent oder `Decimal` sein. Mit [`decimal`](https://docs.python.org/3/library/decimal.html) verarbeitest du Dezimalzahlen ohne binäre Rundungsüberraschungen. Erzeuge Decimal aus einem String, nicht aus einem bereits gerundeten Float.

  ```python run
  from decimal import Decimal
  preis = Decimal("1.50")
  print(preis * 3)
  print("0012")
  ```

  Für Rundung brauchst du eine fachliche Regel. „Immer auf zwei Stellen“ sagt noch nicht, ob Halbwerte aufgerundet, abgerundet oder zur geraden Zahl gerundet werden. Entscheide das anhand der Aufgabe und dokumentiere es. Eine Automatismusentscheidung beim Parser sollte keine versteckte Geschäftsregel werden.

  ## CSV ist mehr als Kommas trennen

  CSV erlaubt quotierte Felder, Trennzeichen innerhalb eines Wertes und Zeilenumbrüche in einer Zelle. `zeile.split(",")` kann diese Fälle nicht korrekt behandeln. Nutze [`csv.reader` oder `DictReader`](https://docs.python.org/3/library/csv.html). Bei Dateiobjekten schreibt die Python-Dokumentation `newline=""` vor, damit das csv-Modul Zeilenenden selbst verarbeitet.

  ```python run
  import csv
  from io import StringIO
  text = 'id;titel;menge\n0012;"Bericht; September";3\n'
  zeilen = list(csv.DictReader(StringIO(text, newline=""), delimiter=";"))
  print(zeilen[0]["id"])
  print(zeilen[0]["titel"])
  print(int(zeilen[0]["menge"]))
  ```

  CSV besitzt normalerweise keine verbindlichen Spaltentypen. `DictReader` liefert Strings; auch `"3"` bleibt zunächst Text. Prüfe die erforderlichen Überschriften, melde eine nachvollziehbare Zeilenposition und konvertiere nur Felder, deren Bedeutung feststeht. Ein Sniffer kann bei unbekannten Dateien helfen, aber eine bekannte Exportquelle sollte einen vereinbarten Dialekt haben.

  ```python run
  import csv
  from io import StringIO
  puffer = StringIO(newline="")
  writer = csv.DictWriter(puffer, fieldnames=["id", "titel"], delimiter=";")
  writer.writeheader()
  writer.writerow({"id": "0012", "titel": "Bericht; September"})
  print(puffer.getvalue().strip())
  ```

  `DictWriter` übernimmt das Quoting. Die feste Feldreihenfolge macht Exporte stabil. Wenn die Datei in einer Tabellenkalkulation geöffnet wird, können Texte mit bestimmten Anfangszeichen als Formel interpretiert werden. Behandle solche Exporte als eigene Zielumgebung und lege eine geeignete Textstrategie fest; ändere Rohdaten nicht stillschweigend ohne dokumentierten Vertrag.

  ## JSON: gültige Syntax ist noch kein Schema

  [`json.loads`](https://docs.python.org/3/library/json.html) wandelt einen JSON-String in Python-Werte um. Objekte werden Dictionaries, Arrays Listen, `null` wird `None`, Boolesche Werte werden `bool`. Die Schlüssel eines JSON-Objekts sind Strings. JSON enthält keinen eingebauten Datums- oder Decimal-Typ; du brauchst dafür eine vereinbarte Darstellung.

  ```python run
  import json
  text = '{"id":"0012","menge":3,"aktiv":true,"datum":null}'
  daten = json.loads(text)
  print(type(daten["menge"]).__name__)
  print(daten["aktiv"], daten["datum"])
  print(json.dumps(daten, ensure_ascii=False, sort_keys=True))
  ```

  Für öffentliche JSON-Schnittstellen solltest du nichtstandardisierte Zahlenwerte wie NaN vermeiden. Python erlaubt beim Schreiben standardmäßig einige solche Werte; `allow_nan=False` lehnt sie ab. Beim Lesen kannst du zusätzliche Regeln setzen. Das ist ein Beispiel dafür, dass das Verhalten einer konkreten Bibliothek breiter sein kann als dein Datenvertrag.

  ```python run
  import json
  try:
      json.dumps({"wert": float("nan")}, allow_nan=False)
  except ValueError:
      print("Kein gültiger endlicher Wert")
  ```

  `isinstance(wert, int)` akzeptiert in Python auch `True`, weil bool eine Unterklasse von int ist. Wenn eine Menge eine echte Integerzahl sein muss, ist `type(wert) is int` eine mögliche präzise Prüfung. Trenne ferner ein fehlendes Feld von einem ausdrücklich gesetzten `null`, wenn diese Zustände fachlich verschieden sind.

  ## YAML und TOML für Konfiguration

  YAML kann komplexer sein, als eine kleine Konfigurationsdatei vermuten lässt. Verwende für fremde Daten [`yaml.safe_load`](https://pyyaml.org/wiki/PyYAMLDocumentation), nicht einen Loader, der beliebige Python-Objekte rekonstruieren darf. Danach prüfst du, ob überhaupt ein Dictionary entstanden ist; eine leere YAML-Datei kann `None` ergeben.

  ```python
  import yaml
  konfiguration = yaml.safe_load("name: bericht\nlimit: 20\n")
  if not isinstance(konfiguration, dict):
      raise ValueError("Konfiguration muss eine Zuordnung sein")
  ```

  YAML-Implementierungen können implizite Typen unterschiedlich auslegen. Quote IDs, Datumsähnliches und absichtlich textuelle Werte, wenn du eine eindeutige Darstellung willst. Für Anwendungskonfiguration mit klarer Tabellenstruktur ist TOML oft übersichtlich. [`tomllib`](https://docs.python.org/3/library/tomllib.html) liest es in der Standardbibliothek.

  ```python run
  import tomllib
  daten = tomllib.loads('[export]\nformat = "csv"\nlimit = 20\n')
  print(daten["export"]["format"])
  ```

  Unabhängig vom Format brauchst du erlaubte Schlüssel, Wertebereiche und Defaults. Ein Tippfehler wie `limti` sollte nicht unbemerkt einen Standardwert auslösen, wenn dadurch plötzlich alle Datensätze exportiert werden. Gib bei ungültiger Konfiguration einen hilfreichen Fehler aus und starte keine halb konfigurierte Verarbeitung.

  ## Excel bewusst als Arbeitsmappe behandeln

  Eine XLSX-Datei ist eine Arbeitsmappe mit Tabellenblättern, Zellen, Formeln und Formatierung. [`openpyxl`](https://openpyxl.readthedocs.io/en/stable/tutorial.html) kann solche Dateien lokal lesen und schreiben. Die Browserumgebung dieses Kurses enthält openpyxl nicht; die Excel-Aufgabe wird daher lokal durchgeführt.

  ```python
  from openpyxl import load_workbook
  buch = load_workbook("eingang.xlsx", read_only=True, data_only=True)
  try:
      blatt = buch["Verkäufe"]
      for zeile in blatt.iter_rows(min_row=2, values_only=True):
          print(zeile)
  finally:
      buch.close()
  ```

  `data_only=True` liest bei Formelzellen den zuletzt gespeicherten Ergebniswert, soweit vorhanden. openpyxl berechnet Formeln nicht neu. Eine fehlende oder alte Berechnung in der Datei kann deshalb zu `None` oder veralteten Ergebnissen führen. Verwechsle erfolgreiches Öffnen nicht mit korrekter Neuberechnung.

  Achte bei großen Mappen auf Read-only- beziehungsweise Write-only-Modi. Prüfe Blattnamen und Überschriften, bevor du feste Spaltenpositionen auswertest. Schreibe einen Bericht zunächst in eine neue Ausgabedatei, damit eine fehlerhafte Transformation nicht die einzige Originalmappe überschreibt. Datumswerte, Formatierung und führende Nullen brauchen gezielte Testdaten.

  ## Häufige Fehler und Praxis

  Die häufigsten Defekte entstehen durch implizite Annahmen: Alle CSV-Dateien seien kommagetrennt, jede JSON-Zahl sei eine gültige Menge oder jede Excel-Formel sei frisch berechnet. Erzeuge kleine Referenzdateien mit genau diesen Gegenbeispielen und halte erwartete Normalformen daneben fest.

  > [!PRAXIS]
  > Gib Fehler als Zeilennummer, Feldname und kurze Ursache zurück. So kann jemand die Eingabedatei reparieren, ohne deinen Code zu lesen. Bei personenbezogenen Daten gehört nicht automatisch die ganze Zeile ins Log.

  > [!INTERVIEW]
  > „Was prüfst du nach json.loads?“ Die Wurzelform, Pflichtfelder, Typen und fachlichen Wertebereiche. Ein syntaktisch gültiges Dokument kann weiterhin vollständig unbrauchbar sein.

  > [!TIP]
  > Ein Roundtrip-Test liest einen erzeugten Export wieder ein und vergleicht fachliche Werte. Er ergänzt einen bekannten Referenzfall, ersetzt ihn aber nicht: Schreiber und Leser könnten denselben Fehler teilen.

  ## Zusammenfassung

  - Encoding und Datentypen sind Teil des Importvertrags.
  - CSV braucht einen echten Parser und festgelegten Dialekt.
  - JSON-Syntax ersetzt keine fachliche Validierung.
  - YAML wird sicher geladen und danach geprüft.
  - Excel-Formeln werden von openpyxl nicht neu berechnet.
  - Originale bleiben erhalten; Exporte und Fehler sind nachvollziehbar.
