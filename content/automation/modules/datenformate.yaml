  title: Nur Daten laden
  prompt: Ergänze den sicheren PyYAML-Loader für gewöhnliche Daten.
  lang: python
  code: |-
    import yaml
    daten = yaml.⟦safe_load⟧(text)
  explanation: safe_load erlaubt keine beliebige Rekonstruktion von Python-Objekten. Eine anschließende Form- und
