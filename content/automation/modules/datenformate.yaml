- id: csv-export
  type: code
  title: CSV korrekt schreiben
  prompt: 'Schreibe `export_csv(zeilen)`: zeilen ist eine Liste mit Dictionaries id und titel. Gib einen CSV-String
    mit diesem Header, Semikolon und Zeilenende \n zurück.'
  lang: python
  starter: |-
    def export_csv(zeilen):
        ...
  solution: |-
    import csv
    from io import StringIO
    def export_csv(zeilen):
        out = StringIO(newline="")
        writer = csv.DictWriter(out, fieldnames=["id", "titel"], delimiter=";", lineterminator="\n")
        writer.writeheader()
        writer.writerows(zeilen)
        return out.getvalue()
  tests:
  - name: Normal
    code: assert export_csv([{"id":"0012","titel":"A"}]) == "id;titel\n0012;A\n"
  - name: Quoting
    code: assert export_csv([{"id":"1","titel":"A;B"}]) == 'id;titel\n1;"A;B"\n'
  - name: Leer
    code: assert export_csv([]) == "id;titel\n"
  explanation: Der Writer erzeugt die nötige Quotierung passend zum Inhalt. Der feste Header und das feste Zeilenende
    machen die Ausgabe reproduzierbar.
  resources:
  - *id001
- id: id-verlust
  type: bug
  title: Die führenden Nullen fehlen
  prompt: Artikelnummer 0012 wird zu 12. Artikelnummern sollen als Text erhalten bleiben. Korrigiere die Umwandlung.
  lang: python
  code: |-
    def artikel(zeile):
        return {"id": int(zeile["id"]), "menge": int(zeile["menge"])}
  lines:
  - 2
  fix:
  - line: 2
    answers:
    - 'return {"id": zeile["id"], "menge": int(zeile["menge"])}'
  explanation: Eine Kennung ist kein Rechenwert. Die Konvertierung in int zerstört ihre Darstellung; nur die fachliche
    Menge wird numerisch konvertiert.
  resources:
  - *id001
- id: excel-cache
  type: explain
  title: Sind die Formeln aktuell?
  prompt: Erkläre die Aussagekraft dieses lokalen Excel-Lesevorgangs.
  lang: python
  code: |-
    buch = load_workbook("bericht.xlsx", data_only=True, read_only=True)
    wert = buch["Übersicht"]["B2"].value
  points:
  - data_only liest gespeicherte Formelresultate statt Formeltext.
  - openpyxl berechnet die Formel nicht neu.
  - Ein gespeichertes Ergebnis kann fehlen oder veraltet sein.
  - Die Aktualität muss über den Erzeugungsprozess oder eine echte Rechenengine abgesichert werden.
  explanation: Das Lesen ist eine Extraktion aus dem gespeicherten Zustand. Ein numerischer Zellwert beweist nicht,
    dass die zugrunde liegende Formel gerade mit den aktuellen Eingaben berechnet wurde.
  resources:
  - *id001
- id: import-bericht
  type: practice
  title: Ein nachvollziehbarer Dateiimport
  prompt: Baue einen CSV-zu-JSON-Import mit id als String und menge als nichtnegativem int. Sammle Fehler mit Datenzeilennummer;
    schreibe bei einem Fehler keinen neuen Ergebnisbericht.
  lang: python
  solution: |-
    import csv, json
    from io import StringIO

    def importiere(text):
        daten, fehler = [], []
        for nummer, zeile in enumerate(csv.DictReader(StringIO(text), delimiter=";"), 2):
            try:
                anzahl = int(zeile["menge"])
                if anzahl < 0:
                    raise ValueError("negative Menge")
                daten.append({"id": zeile["id"], "menge": anzahl})
            except (ValueError, KeyError, TypeError):
                fehler.append({"zeile": nummer, "feld": "menge"})
        if fehler:
            return None, fehler
        return json.dumps(daten, ensure_ascii=False, allow_nan=False), []
  checklist:
  - Führende Nullen bleiben erhalten.
  - Quotierte Felder werden korrekt verarbeitet.
  - Ungültige Mengen nennen eine Position und das Feld.
  - Originaldatei wird nicht verändert.
  - Eine ungültige Datei erzeugt keinen scheinbar vollständigen Bericht.
  explanation: Der Import trennt Datenfehler von einer erfolgreichen Ausgabe. Bei mehrzeiligen CSV-Feldern sind
    Datensatznummer und physische Zeilennummer unterschiedlich; dokumentiere diese Grenze oder verwende reader.line_num
    für die physische Position.
  resources:
  - *id001
