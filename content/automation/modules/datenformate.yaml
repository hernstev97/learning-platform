- id: csv-quote
  type: output
  title: Ein Trennzeichen im Titel
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    import csv
    from io import StringIO
    zeile = next(csv.reader(StringIO('1;"a;b";3\n'), delimiter=";"))
    print(len(zeile))
    print(zeile[1])
  expected: |-
    3
    a;b
  explanation: Das Semikolon innerhalb der Anführungszeichen gehört zum Feld. Der Parser entfernt die Begrenzungszeichen
    und erhält den eigentlichen Inhalt.
  resources:
  - *id001
- id: json-typen
  type: output
  title: JSON-Werte in Python
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    import json
    d = json.loads('{"aktiv":true,"wert":null,"menge":3}')
    print(type(d["aktiv"]).__name__)
    print(d["wert"] is None)
    print(type(d["menge"]).__name__)
  expected: |-
    bool
    True
    int
  explanation: JSON-Bools und null haben eigene Python-Entsprechungen. Die Zahl 3 wird hier als Integer eingelesen.
  resources:
