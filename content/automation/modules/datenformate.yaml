  prompt: 'Schreibe `export_csv(zeilen)`: zeilen ist eine Liste mit Dictionaries id und titel. Gib einen CSV-String
    mit diesem Header, Semikolon und Zeilenende \n zurück.'
  lang: python
  starter: |-
    def export_csv(zeilen):
        ...
  solution: |-
    import csv
    from io import StringIO

    def export_csv(zeilen):
        out = StringIO(newline="")
        writer = csv.DictWriter(
            out, ["id", "titel"],
            delimiter=";",
            lineterminator="\n")
        writer.writeheader()
        writer.writerows(zeilen)
        return out.getvalue()
  tests:
  - name: Normal
    code: assert export_csv([{"id":"0012","titel":"A"}]) == "id;titel\n0012;A\n"
  - name: Quoting
    code: assert export_csv([{"id":"1","titel":"A;B"}]) == 'id;titel\n1;"A;B"\n'
  - name: Leer
    code: assert export_csv([]) == "id;titel\n"
  explanation: Der Writer erzeugt die nötige Quotierung passend zum Inhalt. Der feste Header und das feste Zeilenende
    machen die Ausgabe reproduzierbar.
  resources:
  - *id001
- id: excel-bericht
  type: code
  title: Ein Excel-Bericht mit zwei Blättern
  prompt: |
    Schreibe `schreibe_bericht(pfad, posten)`. `posten` ist eine Liste aus Paaren `(name, betrag)`. Speichere unter `pfad` eine Arbeitsmappe mit genau zwei Blättern in dieser Reihenfolge:

    1. **„Bericht“**: Zeile 1 enthält `Posten` und `Betrag`, beide fett. Ab Zeile 2 folgt ein Posten pro Zeile. Darunter steht `Summe` mit der Formel `=SUM(B2:Bn)`, wobei `n` die letzte Postenzeile ist. Ohne Posten steht dort statt der Formel die Zahl `0`.
    2. **„Prüfung“**: In `A1` steht `Anzahl`, in `B1` die Zahl der Posten.

    Alle Beträge und die Summe bekommen das Zahlenformat `#,##0.00`. Namen sind immer Text, auch wenn sie mit `=` beginnen.
  lang: python
  starter: |-
    from openpyxl import Workbook
    from openpyxl.styles import Font

    FORMAT = "#,##0.00"

    def schreibe_bericht(pfad, posten):
        buch = Workbook()
        ...
        buch.save(pfad)
  solution: |-
    from openpyxl import Workbook
    from openpyxl.styles import Font

    FORMAT = "#,##0.00"

    def schreibe_bericht(pfad, posten):
        buch = Workbook()
        ws = buch.active
        ws.title = "Bericht"
        ws.append(["Posten", "Betrag"])
        for z in ws[1]:
            z.font = Font(bold=True)
        n = 2
        for name, betrag in posten:
            a = ws.cell(n, 1, name)
            a.data_type = "s"
            b = ws.cell(n, 2, betrag)
            b.number_format = FORMAT
            n += 1
        ws.cell(n, 1, "Summe")
        summe = f"=SUM(B2:B{n - 1})"
        if not posten:
            summe = 0
        s = ws.cell(n, 2, summe)
        s.number_format = FORMAT
        pruef = buch.create_sheet(
            "Prüfung")
        pruef.append(
            ["Anzahl", len(posten)])
        buch.save(pfad)
  tests:
  - name: Zwei Blätter in fester Reihenfolge
    code: |-
      from openpyxl import load_workbook
      schreibe_bericht("a.xlsx",
          [("Miete", 950), ("Strom", 61.5)])
      buch = load_workbook("a.xlsx")
      namen = buch.sheetnames
      assert namen == ["Bericht", "Prüfung"], (
          f"Blätter: {namen}")
      zahl = buch["Prüfung"]["B1"].value
      assert zahl == 2, f"Anzahl: {zahl!r}"
  - name: Fette Kopfzeile, Beträge als Zahl mit Format
    code: |-
      from openpyxl import load_workbook
      schreibe_bericht("b.xlsx",
          [("Miete", 950), ("Strom", 61.5)])
      ws = load_workbook("b.xlsx")["Bericht"]
      kopf = [ws["A1"].value, ws["B1"].value]
      assert kopf == ["Posten", "Betrag"], kopf
      assert ws["A1"].font.b and ws["B1"].font.b, (
          "Die Kopfzeile ist nicht fett.")
      assert ws["B3"].value == 61.5, (
          f"B3 ist {ws['B3'].value!r}")
      fmt = ws["B3"].number_format
      assert fmt == "#,##0.00", f"Format: {fmt}"
  - name: Summenzeile mit Formel und Format
    code: |-
      from openpyxl import load_workbook
      schreibe_bericht("c.xlsx",
          [("Miete", 950), ("Strom", 61.5)])
      ws = load_workbook("c.xlsx")["Bericht"]
      assert ws["A4"].value == "Summe", (
          f"A4 ist {ws['A4'].value!r}")
      assert ws["B4"].value == "=SUM(B2:B3)", (
          f"B4 ist {ws['B4'].value!r}")
      fmt = ws["B4"].number_format
      assert fmt == "#,##0.00", f"Format: {fmt}"
  - name: Ein Name mit = bleibt Text
    code: |-
      from openpyxl import load_workbook
      schreibe_bericht("d.xlsx", [("=2+3", 1)])
      ws = load_workbook("d.xlsx")["Bericht"]
      assert ws["A2"].value == "=2+3"
      assert ws["A2"].data_type == "s", (
          "Der Name wurde als Formel gespeichert.")
  - name: Ohne Posten steht 0 in der Summe
    code: |-
      from openpyxl import load_workbook
      schreibe_bericht("e.xlsx", [])
      buch = load_workbook("e.xlsx")
      ws = buch["Bericht"]
      assert ws["A2"].value == "Summe", (
          f"A2 ist {ws['A2'].value!r}")
      assert ws["B2"].value == 0, (
          f"B2 ist {ws['B2'].value!r}")
      assert buch["Prüfung"]["B1"].value == 0
  hints:
  - Setze `ws.title`, bevor du das zweite Blatt mit `create_sheet` anhängst.
  - '`ws[1]` liefert die Zellen der ersten Zeile; `Font(bold=True)` macht sie fett.'
  - Schreibe Postenzeilen mit `ws.cell(zeile, spalte, wert)` und setze danach `data_type` und `number_format` auf
    der zurückgegebenen Zelle.
  explanation: |
    Werte, Typen und Formatierung sind getrennte Eigenschaften einer Zelle. Der Betrag bleibt eine Zahl, das Zahlenformat bestimmt nur die Anzeige. Die Summenformel rechnet erst Excel aus, deshalb prüfen die Tests den Formeltext und nicht ein Ergebnis. Der Sonderfall ohne Posten verhindert die Formel `=SUM(B2:B1)`: Ein Bereich ist durch zwei Ecken bestimmt, `B2:B1` umfasst also die Kopfzeile statt keiner Zeile. `data_type = "s"` nach der Zuweisung macht aus einem Namen wie `=2+3` wieder Text.
  resources:
  - *xl
  - *xlstyle
- id: excel-nach-kopf
  type: code
  title: Spalten über die Kopfzeile finden
  prompt: |
    Schreibe `lies_posten(pfad)`. Lies das Blatt **„Eingang“**; es muss nicht das erste Blatt sein. Zeile 1 ist die Kopfzeile und enthält die Spalten `id` und `menge` in beliebiger Reihenfolge, eventuell neben weiteren Spalten. Gib für jede weitere Zeile ein Dictionary `{"id": …, "menge": …}` mit den Zellwerten zurück. Überspringe Zeilen, in denen alle Zellen leer sind. Fehlt `id` oder `menge` in der Kopfzeile, wirf `ValueError` mit dem Namen der fehlenden Spalte in der Meldung.
  lang: python
  setup: |-
    from openpyxl import Workbook

    def _mappe(pfad, blaetter):
        buch = Workbook()
        buch.remove(buch.active)
        for name, zeilen in blaetter:
            ws = buch.create_sheet(name)
            for zeile in zeilen:
                ws.append(zeile)
        buch.save(pfad)

    _mappe("a.xlsx", [("Eingang", [["menge", "notiz", "id"], [3, "Ecke", "0012"], [None, None, None], [5, None, "0099"]])])
    _mappe("b.xlsx", [("Eingang", [["id", "anzahl"], ["1", 2]])])
    _mappe("c.xlsx", [("Deckblatt", [["Bitte nicht ändern"]]), ("Eingang", [["id", "menge"], ["A7", 1]])])
  starter: |-
    from openpyxl import load_workbook

    def lies_posten(pfad):
        ...
  solution: |-
    from openpyxl import load_workbook

    def lies_posten(pfad):
        buch = load_workbook(pfad)
        ws = buch["Eingang"]
        kopf, *zeilen = ws.values
        for name in ("id", "menge"):
            if name not in kopf:
                raise ValueError(name)
        posten = []
        for zeile in zeilen:
            if set(zeile) == {None}:
                continue
            w = dict(zip(kopf, zeile))
            posten.append({
                "id": w["id"],
                "menge": w["menge"],
            })
        return posten
  tests:
  - name: Spalten nach Namen statt Position
    code: |-
      p = lies_posten("a.xlsx")
      assert p[0] == {"id": "0012",
                      "menge": 3}, p
  - name: Leere Zeilen überspringen
    code: |-
      p = lies_posten("a.xlsx")
      assert p == [
          {"id": "0012", "menge": 3},
          {"id": "0099", "menge": 5},
      ], p
  - name: Fehlende Spalte wird benannt
    code: |-
      try:
          lies_posten("b.xlsx")
      except ValueError as fehler:
          assert "menge" in str(fehler), (
              f"Meldung: {fehler}")
      else:
          assert False, "ValueError erwartet"
  - name: Das Blatt Eingang, nicht das erste
    code: |-
      p = lies_posten("c.xlsx")
      assert p == [{"id": "A7",
                    "menge": 1}], p
  hints:
  - '`load_workbook(pfad)["Eingang"]` wählt das Blatt über den Namen.'
  - '`kopf, *zeilen = ws.values` trennt die Kopfzeile von den Datenzeilen.'
  - '`dict(zip(kopf, zeile))` ordnet jedem Spaltennamen den Wert der Zeile zu. Prüfe vorher mit `in`, ob jede Pflichtspalte im Kopf steht.'
  explanation: |
    Der Name des Blatts und die Namen der Spalten sind der Vertrag, nicht ihre Positionen. Ein eingefügtes Deckblatt oder eine Notizspalte bricht diesen Import deshalb nicht. Die ID `0012` bleibt Text, weil die Zelle Text enthält; der Import wandelt nichts um, was er nicht verstehen muss. Eine fehlende Pflichtspalte ist ein Fehler der Eingabe und wird mit Namen gemeldet, statt später als `IndexError` oder als leere Liste aufzufallen.
  resources:
  - *xl
