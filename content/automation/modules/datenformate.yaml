- id: blattreihenfolge
  type: output
  title: Welches Blatt ist aktiv?
  prompt: |
    Welche Ausgabe erzeugt dieses Programm? Eine neue Mappe beginnt mit einem einzigen Blatt.
  lang: python
  code: |-
    from openpyxl import Workbook
    buch = Workbook()
    buch.active.title = "Bericht"
    buch.create_sheet("Fehler", 0)
    buch.create_sheet("Roh")
    print(buch.sheetnames)
    print(buch.active.title)
  expected: |-
    ['Fehler', 'Bericht', 'Roh']
    Fehler
  explanation: |
    `create_sheet("Fehler", 0)` fügt das Blatt vor `Bericht` ein, `create_sheet("Roh")` hängt es ans Ende. `active` merkt sich nur die Position 0, nicht das Blatt `Bericht`. Nach dem Einfügen steht an Position 0 das Blatt `Fehler`. Deshalb greift robuster Code über den Namen zu: `buch["Bericht"]`.
  resources:
