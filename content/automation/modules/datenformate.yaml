- id: csv-summe
  type: code
  title: Mengen aus CSV addieren
  prompt: Schreibe `summe_csv(text)`. Die CSV besitzt den Header id;menge und Semikolon als Trennzeichen. Addiere
    int(menge) aller Datenzeilen; ein reiner Header ergibt 0.
  lang: python
  starter: |-
    def summe_csv(text):
        ...
  solution: |-
    import csv
    from io import StringIO
    def summe_csv(text):
        return sum(int(z["menge"]) for z in csv.DictReader(StringIO(text, newline=""), delimiter=";"))
  tests:
  - name: Mehrere
    code: assert summe_csv("id;menge\na;2\nb;3\n") == 5
  - name: Leer
    code: assert summe_csv("id;menge\n") == 0
  - name: Quotierte ID
    code: assert summe_csv('id;menge\n"a;b";4\n') == 4
  explanation: DictReader behandelt die CSV-Struktur und die Funktion konvertiert das Mengenfeld ausdrücklich. Eine
    ID mit Trennzeichen beeinträchtigt die Summe nicht.
  resources:
  - *id001
- id: json-menge
  type: code
  title: Integer von bool unterscheiden
  prompt: 'Schreibe `menge(daten)`: Der Schlüssel menge muss einen echten int >= 0 enthalten; sonst ValueError.
    True und False sind ungültig.'
  lang: python
  starter: |-
    def menge(daten):
        ...
  solution: |-
    def menge(daten):
        wert = daten.get("menge")
        if type(wert) is not int or wert < 0:
            raise ValueError("menge muss eine nichtnegative Integerzahl sein")
        return wert
  tests:
  - name: Normal
    code: 'assert menge({"menge": 7}) == 7'
  - name: 'Null'
    code: 'assert menge({"menge": 0}) == 0'
  - name: Ungültig
    code: |-
      for wert in [True, False, -1, 2.0, "2", None]:
          try:
              menge({"menge": wert})
          except ValueError:
              pass
          else:
              assert False, f"ungültig: {wert!r}"
  explanation: bool ist in Python eine int-Unterklasse. Der exakte Typvergleich setzt den engeren Datenvertrag dieser
    Aufgabe um.
  resources:
  - *id001
