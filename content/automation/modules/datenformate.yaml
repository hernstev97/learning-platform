- id: parser
  type: choice
  title: Warum kein split?
  prompt: Warum reicht split(",") für allgemeines CSV nicht?
  options:
  - text: Quotierte Felder dürfen Kommas und Zeilenumbrüche enthalten.
    correct: true
    why: Ein CSV-Parser kennt diese Grammatik.
  - text: CSV darf ausschließlich Zahlen enthalten.
    correct: false
    why: CSV transportiert auch Textfelder.
  - text: split verändert grundsätzlich das Encoding.
    correct: false
    why: split arbeitet auf bereits dekodierten Strings.
  explanation: Das Problem liegt in der Formatgrammatik. Ein echtes Trennzeichen und ein Komma innerhalb eines quotierten
    Feldes sehen auf Zeichenebene gleich aus.
