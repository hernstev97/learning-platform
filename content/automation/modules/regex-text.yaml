id: regex-text
title: Text & reguläre Ausdrücke
level: 2
minutes: 150
summary: Text gezielt normalisieren, Muster lesen, strukturierte Gruppen extrahieren und Ersetzungen mit klaren
  Grenzen durchführen.
goals:
- Du wählst zwischen Stringmethoden, regulären Ausdrücken und Formatparsern.
- Du unterscheidest search, match und fullmatch.
- Du nutzt Gruppen, Quantifizierer und Escaping ohne unbeabsichtigte Treffer.
- Du testest Texttransformationen mit Gegenbeispielen und Unicode.
resources:
- &id001
  title: Python · re
  url: https://docs.python.org/3/library/re.html
- title: Python · Regular Expression HOWTO
  url: https://docs.python.org/3/howto/regex.html
- title: Python · String methods
  url: https://docs.python.org/3/library/stdtypes.html#string-methods
- title: Python · unicodedata
  url: https://docs.python.org/3/library/unicodedata.html
lesson: |
  Ein Skript soll Fehlercodes aus Logzeilen sammeln und Dateinamen vereinheitlichen. Manche Regeln sind direkte Textoperationen, andere beschreiben eine kleine Grammatik. Ein regulärer Ausdruck ist dann hilfreich, wenn du ein wiederkehrendes Muster präzise formulieren kannst. Er wird unübersichtlich, wenn er das Formatwissen eines HTML-, CSV- oder JSON-Parsers ersetzen soll.

  Beginne mit Beispielen: Was soll passen, was ausdrücklich nicht? „Eine Nummer finden“ ist zu vage. „Nach `job=` genau vier ASCII-Ziffern, gefolgt von Leerraum oder Zeilenende“ ist überprüfbar. Die Qualität des Musters hängt stärker von dieser Beschreibung ab als von seiner Kürze.

  ## Zuerst die einfachste passende Textoperation

  [`str.strip`, `split`, `replace` und `partition`](https://docs.python.org/3/library/stdtypes.html#string-methods) lösen viele Aufgaben ohne Regex. `split()` ohne Argument teilt an beliebigem Leerraum und entfernt leere Randstücke. `split(",")` hat einen anderen Vertrag und erhält leere Felder zwischen aufeinanderfolgenden Kommata.

  ```python run
  print("  api   db\ncache ".split())
  print("a,,b".split(","))
  print("name=Ada=Admin".partition("="))
  ```

  `partition` zerlegt nur am ersten Vorkommen und liefert immer drei Teile: davor, Trennzeichen, danach. Das ist für einfache Schlüssel-Wert-Zeilen oft lesbarer als ein Regex. Ein echtes Konfigurationsformat liest du weiterhin mit seinem Parser.

  `strip(".txt")` entfernt keine Dateiendung. Es entfernt beliebige der genannten Zeichen von beiden Rändern. Für eine genaue Endung gibt es `removesuffix`, für Dateipfade `Path.suffix` und `with_suffix`.

  ```python run
  print("text.txt".removesuffix(".txt"))
  print("text.txt".strip(".txt"))
  ```

  Schon diese Unterscheidung verhindert viele kaputte Massenumbenennungen. Textoperationen sollten zunächst einen Plan erzeugen, den du an Beispieldaten prüfst, bevor sie Dateien verändern.

  ## Ein Regex beschreibt Zeichen und Wiederholungen

  Das Modul [`re`](https://docs.python.org/3/library/re.html) interpretiert Muster. Ein Punkt steht für ein beliebiges Zeichen außer dem Zeilenumbruch im Standardmodus. `*` bedeutet null oder mehr Wiederholungen, `+` eine oder mehr, `?` null oder eine. Eckige Klammern definieren eine Zeichenklasse, etwa `[0-9]` für ASCII-Ziffern.

  ```python run
  import re
  muster = re.compile(r"job-[0-9]{4}")
  print(bool(muster.fullmatch("job-0042")))
  print(bool(muster.fullmatch("job-42")))
  print(bool(muster.fullmatch("vor-job-0042")))
  ```

  Raw-Strings mit `r"..."` verhindern, dass Python Backslashes schon als eigene Escape-Sequenzen interpretiert. Das Muster hat nämlich zwei Syntaxebenen: Python-String und Regex. Ein Raw-String entfernt nicht die Bedeutung des Backslashes für die Regex-Engine.

  `\d` steht bei Unicode-Strings nicht ausschließlich für die ASCII-Ziffern 0 bis 9. Wenn ein Protokoll genau ASCII verlangt, verwende `[0-9]` oder passende Flags. Auch `\w` umfasst mehr als lateinische Buchstaben. Die [HOWTO-Erklärung](https://docs.python.org/3/howto/regex.html) hilft, solche Kurzformen bewusst auszuwählen.

  ## search, match und fullmatch beantworten andere Fragen

  `search` sucht irgendwo im Text nach einem Treffer. `match` beginnt am Textanfang. `fullmatch` verlangt, dass der ganze String zum Muster passt. Für eine ID-Validierung ist `fullmatch` meist klarer als komplizierte Anker.

  ```python run
  import re
  text = "Start job-0042 Ende"
  print(re.search(r"job-[0-9]{4}", text).group())
  print(re.match(r"job-[0-9]{4}", text))
  print(re.fullmatch(r"job-[0-9]{4}", "job-0042"))
  ```

  Ein Treffer ist ein Match-Objekt, kein bool und kein String. `group()` liefert den passenden Text. `span()` liefert Positionen. Kein Treffer ist `None`; prüfe das, bevor du Methoden aufrufst. Anker und Flags verändern den Kontext: Mit `MULTILINE` beziehen sich `^` und `$` auf Zeilen, mit `DOTALL` passt der Punkt auch auf Zeilenumbrüche. Wähle Flags einzeln nach dem Vertrag.

  ```python run
  import re
  for treffer in re.finditer(r"ERR-[0-9]+", "ERR-12 dann ERR-7"):
      print(treffer.group(), treffer.span())
  ```

  `finditer` liefert Match-Objekte nacheinander. `findall` liefert eine Liste, deren Form von Capture-Gruppen abhängt. Das ist eine häufige Überraschung: Ein zusätzliches Klammerpaar kann aus ganzen Treffern plötzlich nur Teilgruppen machen. Nutze `(?:...)` für eine Gruppierung, die nichts erfassen soll.

  ## Benannte Gruppen machen Extraktion lesbar

  Eine Logzeile wie `level=ERROR code=504` besitzt zwei fachliche Werte. Benannte Gruppen geben diesen Werten Namen, statt im Folgeteil des Codes `group(1)` und `group(2)` zu verteilen.

  ```python run
  import re
  muster = re.compile(r"level=(?P<level>INFO|WARN|ERROR) code=(?P<code>[0-9]{3})")
  m = muster.fullmatch("level=ERROR code=504")
  if m:
      print(m.groupdict())
      print(int(m["code"]))
  ```

  Das Muster prüft die Form, nicht die Bedeutung jedes möglichen Statuscodes. Eine Zahl mit drei Ziffern kann syntaktisch passen und fachlich unzulässig sein. Solche Prüfungen gehören in die nächste Schicht. Diese Trennung hält Regex klein und Fehlermeldungen verständlich.

  Quantifizierer sind normalerweise gierig: Sie nehmen so viel wie möglich, sofern der Rest noch passt. Ein folgendes `?` macht sie nichtgierig. Dennoch ist eine begrenzte Zeichenklasse oft verständlicher als `.*?`.

  ```python run
  import re
  text = "[eins] [zwei]"
  print(re.findall(r"\[.*\]", text))
  print(re.findall(r"\[[^\]]*\]", text))
  ```

  Die zweite Variante verbietet schließende Klammern im Inhalt. Bei verschachtelten Klammern ist auch sie kein vollständiger Parser. Erweitere ein Muster nicht ohne Ende, wenn die Daten inzwischen eine echte verschachtelte Sprache bilden.

  ## Ersetzen, Escaping und Unicode

  [`re.sub`](https://docs.python.org/3/library/re.html#re.sub) kann Treffer durch Text oder durch das Ergebnis einer Funktion ersetzen. Eine Funktion ist hilfreich, wenn der Ersatz berechnet wird oder Backslashes wörtlich bleiben sollen. Mit `subn` erhältst du zusätzlich die Anzahl der Ersetzungen für einen Prüfbericht.

  ```python run
  import re
  text, anzahl = re.subn(r"ticket=([0-9]+)", lambda m: f"Ticket #{int(m[1]):04d}", "ticket=7 ticket=21")
  print(text)
  print(anzahl)
  ```

  Wenn ein Suchbegriff vom Nutzer stammt und **wörtlich** gefunden werden soll, verwende [`re.escape`](https://docs.python.org/3/library/re.html#re.escape). Ein Punkt im Begriff soll dann nicht plötzlich für jedes Zeichen stehen. `re.escape` ist für das Muster gedacht, nicht als pauschale Behandlung eines Ersetzungsstrings.

  Unicode-Zeichen können optisch gleich aussehen, aber unterschiedlich kodiert sein. [`unicodedata.normalize`](https://docs.python.org/3/library/unicodedata.html#unicodedata.normalize) vereinheitlicht definierte Darstellungen. `casefold` ist für fallunabhängigen Vergleich stärker als `lower`, etwa beim deutschen ß. Bewahre Originaltext, wenn du ihn später anzeigen oder rechtssicher vergleichen musst; normalisierte Suchschlüssel ersetzen nicht jede fachliche Identität.

  ```python run
  import unicodedata
  links = "Café"
  rechts = "Cafe\u0301"
  print(links == rechts)
  print(unicodedata.normalize("NFC", links) == unicodedata.normalize("NFC", rechts))
  print("Straße".casefold())
  ```

  ## Häufige Fehler und sichere Verarbeitung

  Ein Regex, der auf allen Beispielen passt, kann trotzdem zu viel akzeptieren. Ergänze Gegenbeispiele mit Präfix, Suffix, falscher Länge und Sonderzeichen. Bei Ersetzungen prüfst du zusätzlich die Anzahl der Änderungen und einen Trockenlauf. Ein unbeabsichtigter Treffer kann in tausend Dateien denselben Schaden auslösen.

  Verschachtelte, überlappende Wiederholungen können bei bestimmten Eingaben sehr viel Backtracking auslösen. Vermeide Muster wie `(a+)+` auf unbeschränkten fremden Texten. Begrenze Eingaben, vereinfache die Grammatik und nutze für strukturierte Formate spezialisierte Parser. Das Standardmodul re hat keinen allgemeinen Timeout-Parameter für jeden Suchaufruf.

  > [!PRAXIS]
  > Speichere kleine anonymisierte Textfixtures mit erwarteten Treffern und bewussten Nichttreffern. Bei einer Änderung am Logformat zeigen sie genau, ob dein Parser zu streng, zu locker oder fachlich veraltet ist.

  > [!INTERVIEW]
  > „Warum fullmatch?“ Weil eine Validierung die ganze Eingabe beurteilt. search beantwortet nur, ob irgendwo ein passender Teilstring vorkommt.

  > [!MERKE]
  > Ein Regex erkennt eine Form. Die fachliche Bedeutung und die Berechtigung einer daraus folgenden Aktion prüft dein Programm separat.

  ## Zusammenfassung

  - Nimm Stringmethoden für wörtliche, einfache Operationen.
  - Formuliere Treffer und Nichttreffer vor dem Muster.
  - Wähle search, match oder fullmatch nach der Aufgabe.
  - Benannte Gruppen verbinden Syntax mit fachlichen Feldern.
  - Escape fremde Suchtexte, wenn sie wörtlich gemeint sind.
  - Prüfe Unicode, Ersatzanzahl und Laufzeitgrenzen ausdrücklich.
exercises:
- id: validierung
  type: choice
  title: Eine ID vollständig prüfen
  prompt: Du erlaubst ausschließlich JOB- plus vier ASCII-Ziffern. Welche Methode passt?
  options:
  - text: re.fullmatch(r'JOB-[0-9]{4}', text)
    correct: true
    why: Sie prüft die gesamte Eingabe mit fester Länge.
  - text: re.search(r'JOB-[0-9]+', text)
    correct: false
    why: Sie akzeptiert Teiltreffer und beliebige Ziffernanzahl.
  - text: '''JOB-'' in text'
    correct: false
    why: Das prüft weder Position noch Zahlenteil.
  explanation: Eine Validierung braucht den vollständigen Vertrag. fullmatch macht die geforderte Vollständigkeit
    ausdrücklich.
  resources:
  - *id001
- id: parser-ablauf
  type: order
  title: Ein Match sicher auswerten
  prompt: Ordne diese voneinander abhängigen Schritte.
  lang: python
  lines: |-
    import re
    muster = re.compile(r"code=([0-9]{3})")
    treffer = muster.fullmatch("code=503")
    if treffer is not None:
        code = int(treffer.group(1))
        print(code)
  explanation: Erst die None-Prüfung erlaubt den Zugriff auf Gruppen. Danach wird der textuelle Zahlenteil bewusst
    in int umgewandelt.
  resources:
  - *id001
- id: split-unterschied
  type: output
  title: Leere Felder
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    print(" a  b ".split())
    print("a,,b".split(","))
  expected: |-
    ['a', 'b']
    ['a', '', 'b']
  explanation: split ohne Argument behandelt zusammenhängenden Leerraum als Trenner. Ein ausdrücklich gewähltes
    Trennzeichen bewahrt leere Teilfelder.
  resources:
  - *id001
- id: gier
  type: output
  title: Wie weit reicht der Treffer?
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    import re
    text = "[a] [b]"
    print(re.findall(r"\[.*\]", text))
    print(re.findall(r"\[[^\]]*\]", text))
  expected: |-
    ['[a] [b]']
    ['[a]', '[b]']
  explanation: Der gierige Punkt-Stern kann bis zur letzten Klammer reichen. Die zweite Zeichenklasse stoppt schon
    vor jeder schließenden Klammer.
  resources:
  - *id001
- id: id-pruefen
  type: code
  title: Eine Job-ID validieren
  prompt: 'Schreibe `gueltig(text)` als bool: Genau JOB- und vier ASCII-Ziffern sind erlaubt, ohne äußeren Leerraum.'
  lang: python
  starter: |-
    def gueltig(text):
        ...
  solution: |-
    import re
    def gueltig(text):
        return re.fullmatch(r"JOB-[0-9]{4}", text) is not None
  tests:
  - name: Gültig
    code: assert gueltig("JOB-0012") is True
  - name: Präfix Suffix
    code: assert gueltig("xJOB-0012") is False and gueltig("JOB-0012 ") is False
  - name: Länge
    code: assert gueltig("JOB-12") is False
  - name: ASCII
    code: assert gueltig("JOB-１２３４") is False
  explanation: Die Zeichenklasse beschreibt ASCII ausdrücklich. Vollständige Übereinstimmung verhindert versteckte
    Präfixe und Suffixe.
  resources:
  - *id001
- id: codes
  type: code
  title: Fehlercodes extrahieren
  prompt: 'Schreibe `codes(text)`: Finde alle Vorkommen von ERR- gefolgt von einer oder mehr ASCII-Ziffern und liefere
    die Zahlen als ints in Trefferreihenfolge. Teiltreffer innerhalb längerer Wörter sind hier ausdrücklich erlaubt.'
  lang: python
  starter: |-
    def codes(text):
        ...
  solution: |-
    import re
    def codes(text):
        return [int(m.group(1)) for m in re.finditer(r"ERR-([0-9]+)", text)]
  tests:
  - name: Mehrere
    code: assert codes("ERR-7 dann ERR-042") == [7, 42]
  - name: Keine
    code: assert codes("INFO bereit") == []
  - name: Keine Zahl
    code: assert codes("ERR-x ERR-3") == [3]
  explanation: finditer erlaubt den schrittweisen Zugriff auf Gruppen. Die Umwandlung in int normalisiert führende
    Nullen, weil hier numerische Fehlercodes vereinbart sind.
  resources:
  - *id001
- id: literal
  type: gap
  title: Ein Suchwort wörtlich verwenden
  prompt: Ergänze die Funktion, die Sonderzeichen im Suchwort für das Regex-Muster maskiert.
  lang: python
  code: muster = re.compile(re.⟦escape⟧(suchwort))
  explanation: re.escape entfernt keine Zeichen aus dem gesuchten Text. Es macht ihre Regex-Sonderbedeutung im Muster
    unwirksam.
  resources:
  - *id001
  gaps:
  - label: Ein Suchwort wörtlich verwenden
    hint: Der Funktionsname bedeutet auf Englisch maskieren beziehungsweise escapen.
- id: normalisieren
  type: code
  title: Vergleichsschlüssel für Namen
  prompt: 'Schreibe `schluessel(text)`: NFC-normalisieren, äußeren Leerraum entfernen und casefold anwenden.'
  lang: python
  starter: |-
    def schluessel(text):
        ...
  solution: |-
    import unicodedata
    def schluessel(text):
        return unicodedata.normalize("NFC", text).strip().casefold()
  tests:
  - name: Casefold
    code: assert schluessel(" Straße ") == "strasse"
  - name: Unicode
    code: assert schluessel("Café") == schluessel("Café")
  - name: Leer
    code: assert schluessel("  ") == ""
  explanation: Die Funktion erzeugt einen Vergleichsschlüssel, nicht eine neue Anzeigeform. Originalschreibweisen
    sollten separat erhalten bleiben.
  resources:
  - *id001
- id: search-statt-fullmatch
  type: bug
  title: Ungültige Eingabe wird akzeptiert
  prompt: Die Funktion akzeptiert xJOB-1234z. Ersetze search durch die Methode für vollständige Validierung.
  lang: python
  code: |-
    import re
    def pruefe(text):
        return re.search(r"JOB-[0-9]{4}", text) is not None
  lines:
  - 3
  fix:
  - line: 3
    answers:
    - return re.fullmatch(r"JOB-[0-9]{4}", text) is not None
  explanation: search braucht nur einen Teiltreffer. Die fachliche Anforderung gilt aber für die gesamte Eingabe,
    deshalb passt fullmatch.
  resources:
  - *id001
- id: benannte-gruppen
  type: explain
  title: Syntax und Fachregel trennen
  prompt: Erkläre, was dieses Muster prüft und was noch nicht.
  lang: python
  code: m = re.fullmatch(r"level=(?P<level>INFO|ERROR) code=(?P<code>[0-9]{3})", text)
  points:
  - Das ganze Format und die Reihenfolge müssen passen.
  - level ist auf zwei erlaubte Wörter beschränkt.
  - code besitzt genau drei ASCII-Ziffern.
  - Ob die Zahl ein erlaubter fachlicher Status ist, wird noch nicht geprüft.
  explanation: Das Muster beschreibt eine kleine Grammatik und liefert benannte Felder. Ein syntaktischer Treffer
    ist die Vorbereitung für weitere fachliche Regeln, nicht deren Ersatz.
  resources:
  - *id001
- id: logbericht
  type: practice
  title: Ein prüfbarer Logparser
  prompt: Schreibe einen Parser für Zeilen level=INFO|ERROR code=NNN. Sammle gültige Felder und melde ungültige
    Zeilen mit Nummer.
  lang: python
  solution: |-
    import re
    MUSTER = re.compile(r"level=(?P<level>INFO|ERROR) code=(?P<code>[0-9]{3})")

    def parse(zeilen):
        daten, fehler = [], []
        for nummer, text in enumerate(zeilen, 1):
            m = MUSTER.fullmatch(text.rstrip("\n"))
            if m is None:
                fehler.append(nummer)
            else:
                daten.append({"level": m["level"], "code": int(m["code"])})
        return daten, fehler
  checklist:
  - Gültige und ungültige Zeilen werden getrennt berichtet.
  - Präfixe, Suffixe und falsche Codelängen sind Testfälle.
  - Zeilennummern bleiben nachvollziehbar.
  - Eine leere Eingabe funktioniert.
  - Der Parser führt keine aus dem Text abgeleiteten Befehle aus.
  explanation: Der Parser erzeugt strukturierte Daten und einen nachvollziehbaren Fehlerbericht. Weitere Aktionen
    können anschließend separat validiert und getestet werden.
  resources:
  - *id001
