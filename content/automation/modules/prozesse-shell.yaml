id: prozesse-shell
title: Prozesse & Shell
level: 1
minutes: 160
summary: 'Externe Programme kontrolliert aufrufen: Argumentlisten, Exit-Codes, stdout/stderr, Timeouts, Arbeitsverzeichnis
  und testbare Prozessgrenzen.'
goals:
- Du trennst Programmnamen, Argumente und Shell-Syntax.
- Du setzt subprocess.run mit Exit-Code-Prüfung und Timeout ein.
- Du behandelst Ausgabe, Umgebung und Arbeitsverzeichnis ausdrücklich.
- Du testest Befehlsaufbau und Fehlerklassifikation ohne echte Prozesse.
resources:
- &id001
  title: Python · subprocess
  url: https://docs.python.org/3/library/subprocess.html
- title: Python · shlex
  url: https://docs.python.org/3/library/shlex.html
- title: Python · os.environ
  url: https://docs.python.org/3/library/os.html#os.environ
- title: GNU Bash · Quoting
  url: https://www.gnu.org/software/bash/manual/html_node/Quoting.html
lesson: |
  Dein Automationsskript soll eine PDF-Datei komprimieren, ein Git-Repository prüfen oder ein Archiv mit einem vorhandenen Werkzeug erstellen. Die Fachaufgabe ist bereits gelöst; Python muss das richtige Programm zuverlässig ansteuern. Genau an dieser Grenze entstehen häufig Fehler: Leerzeichen zerlegen Dateinamen, Programme hängen oder eine Fehlermeldung wird für ein gültiges Ergebnis gehalten.

  Ein Prozessaufruf ist eine Schnittstelle mit Eingaben, Ausgaben und einem Status. Behandle ihn wie eine API. Definiere Argumente, Laufzeitgrenze, Umgebung und Fehlerverhalten. Die Browserübungen prüfen diese Vorbereitung mit reinen Funktionen und Fakes. Echte Prozesse und Shells laufen hier nicht im Browser; die entsprechenden Beispiele sind für ein lokales Testverzeichnis gedacht.

  ## Ein Programm bekommt eine Argumentliste

  [`subprocess.run`](https://docs.python.org/3/library/subprocess.html#subprocess.run) ist der übliche Einstieg. Übergib eine Liste aus Programmnamen und einzelnen Argumenten. Python startet bei `shell=False`, dem Standard, das Programm direkt. Ein Leerzeichen innerhalb eines Listenelements bleibt Teil dieses Arguments.

  ```python
  import subprocess
  resultat = subprocess.run(
      ["git", "status", "--short"],
      check=True,
      capture_output=True,
      text=True,
      timeout=10,
  )
  print(resultat.stdout)
  ```

  Eine Liste wie `["werkzeug", "Mein Bericht.pdf"]` enthält zwei Argumente, nicht drei. Du brauchst in der zweiten Zeichenkette keine zusätzlichen Shell-Anführungszeichen. Diese würden beim direkten Start als echte Zeichen an das Programm gehen. Umgekehrt interpretiert Python in einer Argumentliste weder `*` noch `|`, `$HOME` oder `>` als Shell-Syntax.

  ```python run
  from pathlib import Path
  quelle = Path("Meine Berichte") / "September.pdf"
  argumente = ["pdfinfo", str(quelle)]
  print(argumente)
  print(len(argumente))
  ```

  Die sichere Trennung von Argumenten verhindert Shell-Injection, ersetzt aber keine fachliche Validierung. Ein Dateiname, der mit `-` beginnt, kann beim Zielprogramm als Option wirken. Viele Programme unterstützen `--` als Ende der Optionen; prüfe dessen Dokumentation. Alternativ kann ein geeigneter absoluter oder mit `./` beginnender Pfad eine Verwechslung verhindern.

  ## Exit-Code, stdout und stderr getrennt lesen

  Ein Prozess liefert einen Exit-Code und kann auf zwei Ausgabekanäle schreiben. Üblicherweise bedeutet `0` Erfolg. Andere Werte hängen vom konkreten Werkzeug ab: Bei manchen Suchprogrammen ist „kein Treffer“ ein eigener erwarteter Status. `stdout` enthält normalerweise Nutzdaten, `stderr` Diagnosen; eine leere `stderr` beweist dennoch keinen Erfolg.

  Mit `check=True` löst ein nichtnull Exit-Code `CalledProcessError` aus. Die [Exception-Dokumentation](https://docs.python.org/3/library/subprocess.html#exceptions) beschreibt auch fehlende Programme und Timeouts.

  ```python
  import subprocess
  try:
      fertig = subprocess.run(
          ["git", "rev-parse", "--show-toplevel"],
          check=True, capture_output=True, text=True, timeout=5,
      )
  except FileNotFoundError:
      print("Git ist nicht installiert oder nicht im Suchpfad")
  except subprocess.CalledProcessError as fehler:
      print("Kein nutzbares Repository", fehler.returncode)
  except subprocess.TimeoutExpired:
      print("Git hat nicht rechtzeitig geantwortet")
  ```

  Diese Fälle haben unterschiedliche Konsequenzen. Ein fehlendes Programm wird durch blindes Wiederholen nicht installiert. Ein Konfigurationsfehler wird durch längeres Warten nicht korrekt. Protokolliere die Fehlerklasse, den Programmnamen und einen geeigneten Ausschnitt der Diagnose. Gib keine Tokens, vollständigen Umgebungsvariablen oder geheimen Kommandoargumente aus.

  ```python run
  def status_text(returncode):
      return "erfolgreich" if returncode == 0 else f"fehlgeschlagen ({returncode})"
  print(status_text(0))
  print(status_text(2))
  ```

  ## Ausgabe und Laufzeit begrenzen

  `capture_output=True` sammelt stdout und stderr im Speicher. Das passt für kurze Metadaten, aber nicht für einen stundenlangen Videokonverter mit unbegrenzter Ausgabe. Leite große Ausgaben in eine Datei oder verarbeite sie gezielt. `text=True` dekodiert Bytes als Text; für binäre Nutzdaten lässt du es weg. Gib bei bekannten Dateiformaten eine passende Kodierung an.

  ```python
  import subprocess
  with open("pruefung.log", "w", encoding="utf-8") as protokoll:
      subprocess.run(
          ["python", "pruefen.py"],
          stdout=protokoll,
          stderr=subprocess.STDOUT,
          text=True,
          check=True,
          timeout=60,
      )
  ```

  Ein Timeout begrenzt den wartenden Aufruf, ist aber keine universelle Prozessbaumverwaltung. Werkzeuge können eigene Kindprozesse starten. Wenn deren Lebenszyklus relevant ist, brauchst du eine Betriebssystemstrategie und überprüfst sie lokal. Für normale, klar begrenzte CLI-Aufrufe genügt meist `run`; `Popen` ist für fortlaufende Kommunikation und feinere Kontrolle gedacht.

  > [!WARNING]
  > Bei Popen können manuell falsch gelesene Pipes blockieren, wenn ein anderer Ausgabekanal vollläuft. Verwende die dokumentierten Kommunikationsmethoden, statt stdout und stderr unkontrolliert nacheinander zu lesen.

  ## Arbeitsverzeichnis und Umgebung sind Eingaben

  Ein relativer Pfad wird im Arbeitsverzeichnis des Kindprozesses aufgelöst. Setze `cwd`, wenn das Werkzeug einen Projektordner erwartet. Verändere nicht unnötig mit `os.chdir` das gesamte Python-Programm. So bleibt der Kontext pro Aufruf sichtbar.

  ```python
  from pathlib import Path
  import subprocess
  repo = Path("projekt").resolve()
  subprocess.run(["git", "status", "--short"], cwd=repo, check=True, timeout=10)
  ```

  Mit `env` übergibst du die Umgebung des Kindes. Ein neues Dictionary ersetzt dabei die gesamte vererbte Umgebung. Wenn du nur einzelne Variablen ergänzen möchtest, kopierst du [`os.environ`](https://docs.python.org/3/library/os.html#os.environ) und überschreibst gezielt. In stärker isolierten Jobs kann eine kleine ausdrücklich erlaubte Umgebung sinnvoller sein.

  ```python run
  basis = {"PATH": "/usr/bin", "LANG": "de_DE.UTF-8"}
  kind = {**basis, "LANG": "C.UTF-8"}
  print(kind["LANG"])
  print(basis["LANG"])
  ```

  Für Python-Unterprogramme ist `sys.executable` meist besser als der bloße Name `python`: Es verwendet denselben Interpreter wie das laufende Programm. So gerät ein uv-Projekt nicht versehentlich in das System-Python. Falls ein externes Programm bewusst aus einem festen Installationspfad kommen soll, dokumentiere diese Voraussetzung.

  ## Shell bewusst und sparsam einsetzen

  Eine Shell interpretiert eine eigene Sprache: Pipes, Umleitungen, Variablen und Expansion. Das kann praktisch sein, ist aber eine zusätzliche Parsing-Stufe. Baue Shell-Befehle nicht durch Einsetzen fremder Texte zusammen. [`shlex`](https://docs.python.org/3/library/shlex.html) kann POSIX-Shellwörter darstellen; es ist kein universeller Quoter für Windows-Shells.

  ```python run
  import shlex
  argumente = ["cat", "Bericht September.txt"]
  print(shlex.join(argumente))
  print(shlex.split(shlex.join(argumente)) == argumente)
  ```

  Diese Darstellung eignet sich für lesbare Logs. Führe weiterhin die ursprüngliche Liste aus. Für ein festes lokales Bash-Skript gelten die [Quoting-Regeln](https://www.gnu.org/software/bash/manual/html_node/Quoting.html): Variablenexpansionen für Pfade gehören normalerweise in doppelte Anführungszeichen.

  ```bash
  bericht="Bericht September.txt"
  wc -l -- "$bericht"
  ```

  Nicht jede Pipe braucht eine Shell. Manche Verarbeitung kann Python selbst übernehmen, etwa Text filtern und anschließend JSON lesen. Wenn ein festes Shellskript die klarere Lösung ist, halte dessen Parameter und Verantwortlichkeiten klein. Eine ausführbare Skriptdatei ist zudem leichter lokal zu prüfen als ein verschachtelter String mit mehreren Quotierungsebenen.

  ## Häufige Fehler und testbare Grenzen

  Ein Test muss keinen echten Konverter starten, um den Befehlsaufbau zu prüfen. Trenne eine Funktion, die Argumente baut, von dem Aufrufer, der `subprocess.run` verwendet. Für die Integration brauchst du trotzdem mindestens einen lokalen Lauf mit einem kleinen Testdokument und dem tatsächlich installierten Programm.

  > [!PRAXIS]
  > Prüfe Dateinamen mit Leerzeichen, Umlauten und führendem Bindestrich. Prüfe außerdem fehlendes Programm, Exit-Code ungleich null und Timeout. Das sind reale Betriebsfälle und keine exotischen Randfälle.

  > [!INTERVIEW]
  > „Ist shell=False automatisch sicher?“ Es verhindert Shellinterpretation. Das Zielprogramm interpretiert jedoch weiterhin seine eigenen Optionen und Dateipfade. Deshalb bleiben erlaubte Programme, passende Argumente und begrenzte Rechte wichtig.

  ## Zusammenfassung

  - Übergib Programm und Argumente als Liste.
  - Shell-Syntax wird nur durch eine Shell interpretiert.
  - Exit-Code und Ausgabekanäle haben getrennte Bedeutung.
  - Wähle Timeout und Ausgabestrategie passend zur Datenmenge.
  - `cwd` und `env` gehören zum reproduzierbaren Aufruf.
  - Teste reine Vorbereitung und echte Integration getrennt.
exercises:
- id: shell-grenze
  type: choice
  title: Was bleibt ein Argument?
  prompt: Was passiert bei subprocess.run(["echo", "a; b"], shell=False)?
  options:
  - text: echo erhält a; b als ein Argument.
    correct: true
    why: Keine Shell interpretiert das Semikolon.
  - text: Die Shell startet zuerst a und dann b.
    correct: false
    why: Es wird keine Shell verwendet.
  - text: Python entfernt automatisch das Semikolon.
    correct: false
    why: Die Zeichen bleiben unverändert.
  explanation: Die Argumentliste bewahrt Grenzen zwischen den Werten. Sie entfernt keine Daten und führt keine Shell-Syntax
    aus.
  resources:
  - *id001
- id: ablauf
  type: order
  title: Ein Prozess als Schnittstelle
  prompt: Ordne die Schritte eines kontrollierten Aufrufs.
  lang: python
  lines: |-
    # Eingaben und erlaubtes Programm prüfen
    # Argumentliste und Arbeitsverzeichnis bauen
    # Prozess mit Timeout starten
    # Exit-Code und Ausgaben prüfen
    # Fachliches Ergebnis zurückgeben
  explanation: Der Aufruf ist nur eine Phase. Ein erfolgreicher Start ist noch kein erfolgreiches fachliches Ergebnis.
  resources:
  - *id001
- id: argumentanzahl
  type: output
  title: Leerzeichen im Dateinamen
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    args = ["tool", "Mein Bericht.txt", "--json"]
    print(len(args))
    print(args[1])
  expected: |-
    3
    Mein Bericht.txt
  explanation: Die Liste besitzt drei Elemente. Das Leerzeichen innerhalb des Pfadstrings erzeugt kein zusätzliches
    Argument.
  resources:
  - *id001
- id: umgebung
  type: output
  title: Kindumgebung ohne Mutation
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    basis = {"LANG": "de_DE.UTF-8", "PATH": "/bin"}
    kind = {**basis, "LANG": "C"}
    print(basis["LANG"])
    print(kind["LANG"])
  expected: |-
    de_DE.UTF-8
    C
  explanation: Die neue Dictionary-Instanz verändert die Basis nicht. So bleibt die Elternumgebung für andere Aufrufe
    stabil.
  resources:
  - *id001
- id: argv
  type: code
  title: Ein wc-Aufruf
  prompt: Schreibe `wc_argumente(pfad)`, die exakt ["wc", "-l", "--", str(pfad)] liefert. Füge keine Shell-Anführungszeichen
    hinzu.
  lang: python
  starter: |-
    def wc_argumente(pfad):
        ...
  solution: |-
    def wc_argumente(pfad):
        return ["wc", "-l", "--", str(pfad)]
  tests:
  - name: Leerzeichen
    code: assert wc_argumente("Mein Bericht.txt") == ["wc", "-l", "--", "Mein Bericht.txt"]
  - name: Bindestrich
    code: assert wc_argumente("-datei")[-2:] == ["--", "-datei"]
  - name: Path
    code: |-
      from pathlib import Path
      assert wc_argumente(Path("a.txt"))[-1] == "a.txt"
  explanation: wc versteht -- als Ende seiner Optionen. Der Dateiname bleibt ein unquotiertes Listenelement, weil
    hier keine Shell beteiligt ist.
  resources:
  - *id001
- id: env
  type: code
  title: Umgebung ergänzen
  prompt: Schreibe `kind_umgebung(basis, extra)`. Liefere ein neues Dictionary, in dem extra Werte überschreibt;
    beide Eingaben bleiben unverändert.
  lang: python
  starter: |-
    def kind_umgebung(basis, extra):
        ...
  solution: |-
    def kind_umgebung(basis, extra):
        return {**basis, **extra}
  tests:
  - name: Überschreiben
    code: 'assert kind_umgebung({"A": "1"}, {"A": "2"}) == {"A": "2"}'
  - name: Erhalten
    code: 'assert kind_umgebung({"PATH": "/bin"}, {"LANG": "C"}) == {"PATH": "/bin", "LANG": "C"}'
  - name: Keine Mutation
    code: a={"A":"1"}; b={"B":"2"}; c=kind_umgebung(a,b); c["A"]="3"; assert a=={"A":"1"} and b=={"B":"2"}
  explanation: env ersetzt beim Prozessstart die Umgebung. Eine bewusste Kopie verhindert versehentliche Änderungen
    am aufrufenden Programm.
  resources:
  - *id001
- id: exit-pruefen
  type: gap
  title: Fehler sichtbar machen
  prompt: Ergänze den Wert von check, damit ein nichtnull Exit-Code eine Exception auslöst.
  lang: python
  code: subprocess.run(["git", "status"], check=⟦True⟧, timeout=10)
  explanation: check=True prüft den Status nach dem Prozessende. Ein fehlendes Programm oder Timeout bleibt eine
    andere Fehlerklasse.
  resources:
  - *id001
  gaps:
  - label: Fehler sichtbar machen
    hint: Die Statusprüfung wird durch einen booleschen Wert aktiviert.
- id: ergebnis
  type: code
  title: Ein Prozessergebnis bewerten
  prompt: 'Implementiere `ausgabe(resultat)`: resultat hat returncode, stdout und stderr. Bei returncode != 0 wirf
    RuntimeError mit stderr; sonst liefere stdout ohne äußeren Leerraum.'
  lang: python
  starter: |-
    def ausgabe(resultat):
        ...
  solution: |-
    def ausgabe(resultat):
        if resultat.returncode != 0:
            raise RuntimeError(resultat.stderr)
        return resultat.stdout.strip()
  tests:
  - name: Erfolg
    code: |-
      from types import SimpleNamespace
      assert ausgabe(SimpleNamespace(returncode=0, stdout=" ok\n", stderr="")) == "ok"
  - name: Leer
    code: |-
      from types import SimpleNamespace
      assert ausgabe(SimpleNamespace(returncode=0, stdout="", stderr="Hinweis")) == ""
  - name: Fehler
    code: |-
      from types import SimpleNamespace
      try:
          ausgabe(SimpleNamespace(returncode=2, stdout="teilweise", stderr="kaputt"))
      except RuntimeError as e:
          assert str(e) == "kaputt"
      else:
          assert False, "Exit-Code 2 darf kein Erfolg sein"
  explanation: Der Exit-Code entscheidet hier über den vertraglichen Erfolg. Selbst eine vorhandene stdout-Ausgabe
    darf einen Fehlerstatus nicht verdecken.
  resources:
  - *id001
- id: split
  type: bug
  title: Der Dateiname wird zerlegt
  prompt: Die Liste soll zwei Elemente haben, aber Bericht September.txt wird in zwei Argumente zerlegt. Korrigiere
    den Aufbau.
  lang: python
  code: |-
    def argumente(datei):
        return f"pdfinfo {datei}".split()
  lines:
  - 2
  fix:
  - line: 2
    answers:
    - return ["pdfinfo", datei]
  explanation: split kann die beabsichtigten Argumentgrenzen nicht aus einem zusammengesetzten String rekonstruieren.
    Die direkte Liste hält Programm und Dateiname korrekt getrennt.
  resources:
  - *id001
- id: aufrufvertrag
  type: explain
  title: Weshalb diese Optionen?
  prompt: Erkläre diesen lokalen Prozessaufruf.
  lang: python
  code: subprocess.run([sys.executable, "pruefen.py"], cwd=projekt, check=True, capture_output=True, text=True,
    timeout=30)
  points:
  - sys.executable wählt denselben Python-Interpreter.
  - cwd setzt den Kontext des Kindprozesses.
  - check=True und timeout begrenzen unterschiedliche Fehlerarten.
  - capture_output sammelt Ausgabe im Speicher; text dekodiert sie.
  explanation: Der Aufruf beschreibt Interpreter, Arbeitskontext und erwarteten Abschluss. Für sehr große Ausgaben
    wäre das Sammeln im Speicher ungeeignet; für kurze Prüfberichte ist es praktisch.
  resources:
  - *id001
- id: lokale-integration
  type: practice
  title: Eine lokale Git-Prüfung
  prompt: Baue eine Funktion, die git status --short in einem übergebenen Testrepository ausführt. Prüfe auch ein
    Verzeichnis, das kein Repository ist.
  lang: python
  solution: |-
    import subprocess

    def status(repo):
        return subprocess.run(["git", "status", "--short"], cwd=repo, capture_output=True, text=True, check=True, timeout=10).stdout
  checklist:
  - Argumente werden als Liste übergeben.
  - Ein Verzeichnis mit Leerzeichen funktioniert.
  - Ein Nicht-Repository erzeugt einen sichtbaren Fehler.
  - Fehlendes Git und Timeout werden unterscheidbar behandelt.
  - Es werden nur selbst angelegte Testverzeichnisse benutzt.
  explanation: Der lokale Smoke-Test ergänzt die browsergeprüfte Vorbereitung um den echten Programmvertrag. Die
    Funktion verändert das Repository nicht.
  resources:
  - *id001
