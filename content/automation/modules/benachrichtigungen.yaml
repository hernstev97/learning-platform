lesson: |
  Ein täglicher Import soll sich melden, wenn er fehlschlägt. Nach der ersten Umsetzung sendet jeder Retry eine weitere Nachricht, und die eigentlich wichtige Meldung verschwindet zwischen Wiederholungen. Benachrichtigung ist deshalb nicht bloß ein API-Aufruf. Sie ist eine Entscheidung darüber, wann jemand welche Information braucht und welche Aktion daraus folgen kann.

  Die Beispiele trennen Nachricht und Versand. Alle Browserübungen erzeugen nur Daten oder benutzen Fakes. Es wird keine echte E-Mail, kein Webhook und keine Desktopmeldung versendet. Die lokale Integration ist ein eigener, ausdrücklich kontrollierter Schritt mit einem selbst gewählten Testempfänger.

  ## Ein Ereignis ist noch keine Nachricht

  Ein Job kann starten, eine Seite erneut abrufen, einzelne Zeilen ablehnen und schließlich trotzdem erfolgreich enden. Nicht jedes interne Ereignis verdient eine Benachrichtigung. Definiere einen fachlichen Abschlussstatus und entscheide dann, ob eine Meldung nötig ist. Häufig reichen Fehler, wesentliche Änderungen oder ein zusammengefasster Bericht.

  ```python run
  def meldepflichtig(status, neue_fehler):
      return status == "fehlgeschlagen" or neue_fehler > 0
  print(meldepflichtig("erfolgreich", 0))
  print(meldepflichtig("erfolgreich", 2))
  ```

  Eine nützliche Meldung nennt Aufgabe, Ergebnis, Zeitpunkt und einen nächsten nachvollziehbaren Schritt. „Fehler!“ ohne Kontext hilft wenig. Ein vollständiger Stacktrace mit persönlichen Datensätzen oder Zugangsdaten ist ebenfalls ungeeignet. Verweise bei Bedarf auf ein zugriffsgeschütztes Protokoll und verwende eine Job-ID zur Zuordnung.

  ```python run
  def text(job, anzahl, fehler):
      return f"{job}: {anzahl} Datensätze verarbeitet, {fehler} Fehler."
  print(text("Tagesimport", 120, 2))
  ```

  Die Nachrichtengrenze eignet sich zur Datenminimierung. Übernimm nur Felder, die der Empfänger zum Verstehen braucht. Ein allgemeiner Fehlerbericht muss keine gesamte Kundenliste enthalten. Auch ein Webhook-Ziel kann außerhalb deiner kontrollierten Umgebung liegen; entscheide dessen Empfängerkreis bewusst.

  ## E-Mails als strukturierte Objekte erstellen

  [`EmailMessage`](https://docs.python.org/3/library/email.message.html) übernimmt Header, Textkodierung und MIME-Struktur. Erzeuge keine rohe Mail durch Verkettung von Zeilen mit `From:` und `Subject:`. So vermeidest du viele Format- und Sonderzeichenfehler.

  ```python run
  from email.message import EmailMessage
  mail = EmailMessage()
  mail["From"] = "job@example.org"
  mail["To"] = "test@example.org"
  mail["Subject"] = "Tagesimport: 2 Fehler"
  mail.set_content("120 Datensätze verarbeitet. Bitte Job-Lauf 42 prüfen.\n")
  print(mail["Subject"])
  print(mail.get_content_type())
  print(mail.get_content().strip())
  ```

  Die Adressen sind Platzhalter. Ein gültig aufgebautes Mailobjekt beweist weder, dass eine Adresse existiert, noch dass der Anbieter den Versand erlaubt. Freie Texte in Headern dürfen keine Zeilenumbrüche enthalten. Die Bibliothek prüft wichtige Formatregeln, aber die Anwendung sollte schon an ihrer Eingabegrenze eindeutige Werte verlangen.

  Für HTML-Mail fügt man neben einer Textversion eine Alternative hinzu. Die [Python-Mailbeispiele](https://docs.python.org/3/library/email.examples.html) zeigen solche MIME-Strukturen. Texte aus fremden Quellen müssen beim Einfügen in HTML passend maskiert werden; ein plain-text Bericht ist häufig die einfachere, robustere Wahl.

  ```python run
  from email.message import EmailMessage
  mail = EmailMessage()
  mail.set_content("Bericht: 3 neue Einträge")
  mail.add_alternative("<p>Bericht: <strong>3</strong> neue Einträge</p>", subtype="html")
  print(mail.is_multipart())
  print([teil.get_content_type() for teil in mail.iter_parts()])
  ```

  ## Versand ist eine externe Wirkung

  [`smtplib`](https://docs.python.org/3/library/smtplib.html) transportiert E-Mails per SMTP. Der Server bestimmt Authentifizierung, Ports und zulässige Absender. Das folgende lokale Beispiel zeigt TLS von Beginn an mit `SMTP_SSL`; es wird nicht im Browser ausgeführt.

  ```python
  import os
  import ssl
  import smtplib
  with smtplib.SMTP_SSL(
      os.environ["SMTP_HOST"],
      port=465,
      context=ssl.create_default_context(),
      timeout=15,
  ) as smtp:
      smtp.login(os.environ["SMTP_USER"], os.environ["SMTP_PASSWORD"])
      smtp.send_message(mail)
  ```

  [`ssl.create_default_context`](https://docs.python.org/3/library/ssl.html#ssl.create_default_context) liefert eine geeignete Ausgangskonfiguration für Zertifikatsprüfungen. Deaktiviere diese Prüfungen nicht als Reparatur für einen falsch konfigurierten Server. Andere Anbieter verlangen STARTTLS auf einem dafür vorgesehenen Port; nutze den dokumentierten Ablauf des Anbieters, bevor Zugangsdaten übertragen werden.

  Ein erfolgreicher SMTP-Aufruf bedeutet, dass ein Server die Nachricht angenommen hat. Er beweist nicht die Anzeige im Posteingang und erst recht nicht, dass ein Mensch sie gelesen hat. Beachte bei mehreren Empfängern auch mögliche Teilablehnungen. Transportquittung, spätere Zustellung und menschliche Kenntnis sind unterschiedliche Zustände.

  ## Webhooks und lokale Meldungen

  Ein Webhook ist typischerweise ein HTTP-Endpunkt, der einen vereinbarten JSON-Körper annimmt. Der konkrete Anbieter definiert Felder, Authentifizierung, Statuscodes und Rate Limits. Eine geheime Webhook-URL kann selbst ein Zugangsschlüssel sein und gehört nicht ins Log oder öffentliche Repository.

  ```python run
  import json
  payload = {
      "job_id": "lauf-42",
      "status": "failed",
      "summary": "Import konnte nicht abgeschlossen werden",
  }
  print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
  ```

  Übertrage den Körper lokal mit einer HTTP-Bibliothek, Zeitgrenze und Statusprüfung. Ein Retry kann bei einem empfangenden Dienst eine zweite Nachricht erzeugen. Nutze dessen dokumentierte Deduplizierungsfunktion, wenn vorhanden; erfinde nicht, dass jeder Webhook einen beliebigen Idempotency-Header unterstützt.

  Eine Desktopmeldung passt für persönliche lokale Skripte, wenn eine laufende Benutzersitzung vorhanden ist. Ein systemweiter Hintergrunddienst besitzt diese Sitzung nicht automatisch. Plane daher nicht mit einer Desktopmeldung als einzigem Nachweis für einen unbeaufsichtigten Serverjob.

  ```python
  import subprocess
  subprocess.run(
      ["notify-send", "Tagesimport", "Bericht wurde erzeugt"],
      check=True,
      timeout=5,
  )
  ```

  Auch dieser Aufruf ist lokal und erzeugt eine echte Wirkung. In Tests ersetzt du den Versand durch eine Funktion, die lediglich den vorgesehenen Text aufzeichnet.

  ## Deduplizierung und Outbox

  Eine stabile Ereignis-ID bezeichnet den Anlass, nicht den einzelnen Sendeversuch. Für einen Tagesbericht kann sie aus Jobname, Datum und Statusübergang entstehen. Ein neuer zufälliger Schlüssel bei jedem Retry verhindert Deduplizierung statt sie zu ermöglichen.

  ```python run
  def schluessel(job, periode, ereignis):
      return f"{job}:{periode}:{ereignis}"
  print(schluessel("import", "2026-09-28", "failed"))
  ```

  Eine Outbox speichert vorbereitete Nachrichten mit Zuständen wie `pending`, `sent` und `failed`. Ein Sender verarbeitet offene Einträge und bestätigt erst nach der Transportquittung. So geht die Nachricht bei einem Prozessneustart nicht allein deshalb verloren, weil sie nur im Speicher lag. [`sqlite3`](https://docs.python.org/3/library/sqlite3.html) kann für eine kleine lokale Outbox ausreichen.

  Zwischen externem Versand und lokaler Bestätigung bleibt eine schwierige Lücke: Der Dienst kann die Nachricht angenommen haben, bevor dein Prozess abstürzt. Nach dem Neustart könnte derselbe offene Eintrag erneut gesendet werden. Ohne Unterstützung des Empfängers ist „genau einmal“ daher keine automatische Garantie. Benenne stattdessen die tatsächliche Strategie und den Umgang mit möglichen Duplikaten.

  Ein Trockenlauf baut denselben Nachrichteninhalt und zeigt den geplanten Empfänger an, führt aber keinen Versand aus. Er sollte auch keinen dauerhaften `sent`-Status setzen. Sonst unterdrückt der nächste echte Lauf eine Nachricht, die nie verschickt wurde.

  ## Häufige Fehler und Prüfung

  Typische Fehler sind Nachrichten pro Retry, vollständige Rohdaten im Text, geheime URLs im Log und vorzeitiges Markieren als gesendet. Prüfe außerdem Größenbegrenzungen des Zielsystems. Kürzen ist eine Darstellungsvorschrift und darf nicht den wichtigsten Fehlerkontext entfernen.

  > [!PRAXIS]
  > Teste Inhalt und Versandadapter getrennt. Im Inhaltstest prüfst du Empfänger, Betreff und redigierten Text. Im Adaptertest simuliert ein Fake Erfolg, Ablehnung und Timeout. Ein einzelner kontrollierter Versand bestätigt danach die reale Integration.

  > [!INTERVIEW]
  > „Warum kann trotz erfolgreichem SMTP keine Mail sichtbar sein?“ Weil Annahme nur eine Transportstufe ist. Zustellregeln, spätere Ablehnung oder Filterung können danach folgen; die Anwendung sollte keine weitergehende Bestätigung behaupten.

  > [!MERKE]
  > Benachrichtigungen sind eine Hilfe zur Entscheidung. Die wichtigste Meldung ist die, aus der der Empfänger den Zustand und nächsten Schritt versteht.

  ## Zusammenfassung

  - Melde fachlich relevante Ereignisse statt jeden internen Schritt.
  - Baue Nachrichten als strukturierte, prüfbare Daten.
  - Trenne Vorbereitung, Transportquittung und tatsächliche Zustellung.
  - Begrenze Inhalte und schütze Zugangsdaten.
  - Dedupliziere anhand stabiler Ereignis-IDs.
  - Teste Ausfälle, Trockenlauf und die Bestätigungslücke ausdrücklich.
