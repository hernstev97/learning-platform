  title: Was beweist SMTP-Erfolg?
  prompt: Was lässt sich nach Annahme durch den SMTP-Server sicher sagen?
  options:
  - text: Der angesprochene Server hat die Nachricht angenommen.
    correct: true
    why: Das ist die bestätigte Transportstufe.
  - text: Der Empfänger hat die Nachricht gelesen.
    correct: false
    why: Menschliche Kenntnis wurde nicht bestätigt.
