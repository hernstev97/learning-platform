- id: nachricht
  type: code
  title: Eine Textmail erstellen
  prompt: Schreibe `baue_mail(empfaenger, betreff, text)`, die ein EmailMessage mit From job@example.org, To, Subject
    und plain-text Inhalt zurückgibt. Sende nichts.
  lang: python
  starter: |-
    def baue_mail(empfaenger, betreff, text):
        ...
  solution: |-
    from email.message import EmailMessage
    def baue_mail(empfaenger, betreff, text):
        mail = EmailMessage()
        mail["From"] = "job@example.org"
        mail["To"] = empfaenger
        mail["Subject"] = betreff
        mail.set_content(text)
        return mail
  tests:
  - name: Header
    code: m=baue_mail("test@example.org","Bericht","bereit"); assert m["From"]=="job@example.org" and m["To"]=="test@example.org"
      and m["Subject"]=="Bericht"
  - name: Inhalt
    code: 'm=baue_mail("test@example.org","Änderung","Größe: 2"); assert m.get_content().strip()=="Größe: 2"'
  - name: MIME
    code: assert baue_mail("test@example.org","x","").get_content_type()=="text/plain"
  explanation: Die Funktion baut nur ein Datenobjekt und bleibt ohne Netzwerk testbar. Der tatsächliche Versand
    kann später hinter einer eigenen Schnittstelle ergänzt werden.
  resources:
  - *id001
- id: zusammenfassung
  type: code
  title: Ein kurzer Abschlussbericht
  prompt: 'Implementiere `bericht(job, verarbeitet, fehler)`. Gib exakt "JOB: N verarbeitet, F Fehler." zurück,
    mit den jeweiligen Werten; bei fehler>0 hänge " Bitte Protokoll prüfen." an.'
  lang: python
  starter: |-
    def bericht(job, verarbeitet, fehler):
        ...
  solution: |-
    def bericht(job, verarbeitet, fehler):
        text = f"{job}: {verarbeitet} verarbeitet, {fehler} Fehler."
        return text + (" Bitte Protokoll prüfen." if fehler > 0 else "")
  tests:
  - name: Erfolg
    code: 'assert bericht("Import",12,0)=="Import: 12 verarbeitet, 0 Fehler."'
  - name: Fehler
    code: 'assert bericht("Import",10,2)=="Import: 10 verarbeitet, 2 Fehler. Bitte Protokoll prüfen."'
  - name: Leer
    code: 'assert bericht("Import",0,0)=="Import: 0 verarbeitet, 0 Fehler."'
  explanation: Der Text unterscheidet Erfolg und Handlungsbedarf ohne Rohdaten aufzunehmen. Die Fachstatistik entsteht
    vorher und wird hier nur verständlich dargestellt.
  resources:
  - *id001
- id: inhalt
  type: gap
  title: Textinhalt setzen
  prompt: Ergänze die EmailMessage-Methode für den plain-text Körper.
  lang: python
  code: mail.⟦set_content⟧("Der Bericht ist bereit.")
  explanation: set_content erzeugt den MIME-Inhalt mit geeigneten Headern. Es transportiert die Nachricht noch nicht.
  resources:
  - *id001
  gaps:
  - label: Textinhalt setzen
    hint: Der Methodenname setzt den Inhalt der Nachricht, ohne etwas zu senden.
- id: nach-quittung
  type: code
  title: Erst nach Erfolg merken
  prompt: 'Schreibe `sende_einmal(id, text, gesendet, sende)`: Wenn id im Set ist, gib False zurück. Sonst rufe
    sende(text) auf; nur bei fehlerfreier Rückkehr füge id ein und liefere True. Exceptions dürfen weiterlaufen.'
  lang: python
  starter: |-
    def sende_einmal(id, text, gesendet, sende):
        ...
  solution: |-
    def sende_einmal(id, text, gesendet, sende):
        if id in gesendet:
            return False
        sende(text)
        gesendet.add(id)
        return True
  tests:
  - name: Erfolg
    code: aufrufe=[]; s=set(); assert sende_einmal("a","Text",s,aufrufe.append) is True; assert s=={"a"} and aufrufe==["Text"]
  - name: Duplikat
    code: aufrufe=[]; assert sende_einmal("a","Text",{"a"},aufrufe.append) is False and aufrufe==[]
  - name: Fehler
    code: |-
      s=set()
      def kaputt(text): raise RuntimeError("offline")
      try:
          sende_einmal("a","Text",s,kaputt)
      except RuntimeError:
          pass
      else:
          assert False, "Fehler muss weiterlaufen"
      assert s==set()
  explanation: Der Status folgt der Quittung des injizierten Senders. Das Set demonstriert nur einen einzelnen Prozesslauf
    und ist noch keine dauerhafte oder nebenläufig sichere Outbox.
  resources:
  - *id001
- id: vorzeitig
  type: bug
  title: Nach einem Fehler fehlt die Nachricht
  prompt: Bei einem Versandfehler steht die ID trotzdem schon in gesendet. Korrigiere die beiden Wirkungen in der
    markierten Zeile.
  lang: python
  code: |-
    def versand(id, text, gesendet, sende):
        gesendet.add(id); sende(text)
  lines:
  - 2
  fix:
  - line: 2
    answers:
    - sende(text); gesendet.add(id)
  explanation: Wird die ID vorab gespeichert, sieht ein späterer Versuch die Nachricht fälschlich als erledigt.
    Die umgekehrte Reihenfolge vermeidet diesen Fehler, beseitigt aber noch nicht das Absturzfenster nach externer
    Annahme.
  resources:
  - *id001
- id: dry-run
  type: explain
  title: Was darf der Trockenlauf ändern?
  prompt: Erkläre, warum der Trockenlauf hier vor dem Sender zurückkehrt.
  lang: python
  code: |-
    def ausfuehren(mail, sende, dry_run):
        if dry_run:
            return {"empfaenger": str(mail["To"]), "betreff": str(mail["Subject"])}
        return sende(mail)
  points:
  - Der Inhalt wurde bereits aufgebaut und ist reviewbar.
  - Der externe Sender wird im Trockenlauf nicht aufgerufen.
  - Die Vorschau bestätigt keinen Versand.
  - Ein sent-Status darf durch die Vorschau nicht entstehen.
  explanation: Der Trockenlauf prüft Planung und Darstellung ohne externe Wirkung. Sein Ergebnis muss daher als
    Vorschau bezeichnet werden und darf den späteren echten Versand nicht unterdrücken.
  resources:
  - *id001
- id: outbox-test
  type: practice
  title: Eine kleine lokale Outbox
  prompt: Entwirf eine SQLite-Outbox mit eindeutiger Ereignis-ID, Inhalt und Status. Baue einen Sender mit Fake-Transport
    und dokumentiere das Absturzfenster.
  lang: sql
  solution: |-
    CREATE TABLE outbox (
      event_id TEXT PRIMARY KEY,
      recipient TEXT NOT NULL,
      subject TEXT NOT NULL,
      body TEXT NOT NULL,
      status TEXT NOT NULL CHECK(status IN ('pending', 'sent', 'failed'))
    );
  checklist:
  - Doppelte Ereignis-IDs erzeugen keinen zweiten Datensatz.
  - Ein Transportfehler wird sichtbar und bleibt erneut bearbeitbar.
  - Erfolg wird erst nach Transportquittung gespeichert.
  - Ein Trockenlauf sendet nichts und setzt keinen sent-Status.
  - Die mögliche Doppelzustellung nach Absturz ist dokumentiert.
  explanation: Die Tabelle macht Zustand dauerhaft und überprüfbar. Für konkurrierende Sender kommen atomare Reservierung
    und ein Wiederaufnahmevertrag hinzu; ein Primary Key allein liefert noch keine Exactly-once-Zustellung.
  resources:
  - *id001
