id: benachrichtigungen
title: Benachrichtigungen ohne Nachrichtenflut
level: 3
minutes: 150
summary: Aussagekräftige Meldungen vorbereiten, E-Mail und Webhooks kontrolliert anbinden und Wiederholung, Zustellung
  und Deduplizierung unterscheiden.
goals:
- Du definierst Anlass, Empfänger und Informationsumfang einer Meldung.
- Du baust E-Mails mit EmailMessage statt Headern aus Strings.
- Du trennst Nachrichtenerstellung von tatsächlichem Versand.
- Du behandelst Deduplizierung, Ausfälle und sensible Inhalte nachvollziehbar.
