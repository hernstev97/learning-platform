id: dateien-ordner
title: Dateien und Ordner automatisieren
level: 1
minutes: 200
summary: Mit pathlib, shutil, hashlib, zipfile und tempfile Ordner durchsuchen, Dateien sortieren, umbenennen, Duplikate finden, Archive bauen und Dateien atomar schreiben – ohne Daten zu verlieren.
goals:
  - Du arbeitest mit `Path`-Objekten statt mit Strings und kennst `name`, `stem`, `suffix`, `parent`, `with_suffix` und `with_name`.
  - Du durchläufst Ordner mit `iterdir`, `glob`, `rglob` und `os.walk` und weißt, wann du welches brauchst.
  - Du wählst bewusst zwischen `rename`, `replace`, `shutil.move`, `copy2` und `copytree` und behandelst Namenskollisionen.
  - Du findest Duplikate über Größe und Hash, ohne große Dateien komplett in den Speicher zu laden.
  - Du schreibst Dateien atomar über eine temporäre Datei und `os.replace` und baust ZIP-Archive.
