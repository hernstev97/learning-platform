  - id: glob-vorhersagen
    type: output
    title: Was findet glob?
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      from pathlib import Path

      for pfad in ["p/main.py", "p/README.md", "p/src/app.py", "p/src/util/helfer.py",
                   "p/.venv/lib/site.py", "p/tests/test_app.py"]:
          Path(pfad).parent.mkdir(parents=True, exist_ok=True)
          Path(pfad).write_text("", encoding="utf-8")

      basis = Path("p")
      print(len(list(basis.iterdir())))
      print(sorted(x.name for x in basis.glob("*.py")))
      print(len(list(basis.rglob("*.py"))))
      print(sorted(x.name for x in basis.glob("*/*.py")))
      print(sorted(x.relative_to(basis).as_posix() for x in basis.rglob("*.py") if ".venv" not in x.parts))
    expected: |
      5
      ['main.py']
      5
      ['app.py', 'test_app.py']
      ['main.py', 'src/app.py', 'src/util/helfer.py', 'tests/test_app.py']
    explanation: |
      `iterdir` liefert Dateien **und** Ordner der obersten Ebene: `main.py`, `README.md`, `src`, `.venv`, `tests`. `glob("*.py")` sucht nur in einer Ebene, `rglob` in allen – und findet auch `.venv/lib/site.py`, weil `pathlib` versteckte Einträge nicht ausnimmt. `*/*.py` heißt „genau eine Ordnerebene tiefer“, deshalb fehlen `helfer.py` (zwei Ebenen) und `site.py`. `x.parts` zerlegt den Pfad in Teile; so lassen sich ganze Ordnernamen ausschließen, ohne versehentlich `.venv` in einem Dateinamen zu treffen.
