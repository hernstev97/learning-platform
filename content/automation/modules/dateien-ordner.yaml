lesson: |
  Dein Downloads-Ordner enthält 800 Dateien: Rechnungen als PDF, Handyfotos namens `IMG_20260928_143012.jpg`, drei Kopien desselben Installers, halb fertige `.part`-Downloads. Aufräumen von Hand dauert einen Abend und ist in drei Monaten wieder nötig. Dateien und Ordner sind das häufigste Einsatzgebiet für Automatisierung – und das gefährlichste, weil ein Fehler hier nicht nur falsche Ausgaben erzeugt, sondern Daten überschreibt oder löscht.

  Diese Lektion zeigt die Werkzeuge der Standardbibliothek und vor allem, wie du sie sicher einsetzt: Pfade als Objekte, Ordner durchlaufen, Metadaten lesen, verschieben ohne Überschreiben, Duplikate finden, Archive bauen und Dateien so schreiben, dass ein Absturz sie nicht halb kaputt zurücklässt.

  ## Pfade sind Objekte, keine Strings

  [`pathlib`](https://docs.python.org/3/library/pathlib.html) stellt Pfade als `Path`-Objekte dar. Der Operator `/` verbindet Teile, Attribute zerlegen den Pfad, und die Methoden lesen und schreiben das Dateisystem. Das ist nicht nur bequemer als String-Verkettung, sondern auch korrekter: `Path` kennt das Trennzeichen des Betriebssystems und normalisiert doppelte Schrägstriche.

  ```python run
  from pathlib import Path

  datei = Path("backup") / "2026-09" / "projekt.tar.gz"
  print(datei)                       # backup/2026-09/projekt.tar.gz
  print(datei.name, datei.parent)    # projekt.tar.gz backup/2026-09
  print(datei.stem, datei.suffix)    # projekt.tar .gz  – nur die letzte Endung!
  print(datei.suffixes)              # ['.tar', '.gz']
  print(datei.with_suffix(".zip"))   # backup/2026-09/projekt.tar.zip
  print(datei.with_name("alt.tar.gz"))
  print(datei.with_stem("projekt-v2.tar"))   # seit Python 3.9
  print(datei.parts)
  print(Path.home().is_absolute())
  ```

  Achte auf `stem` und `suffix`: Sie betrachten nur die **letzte** Endung. Bei `projekt.tar.gz` ist der Stamm `projekt.tar`. Für Umbenennungen reicht das meist; wenn nicht, hilft `suffixes`.

  Die [Methoden für das Dateisystem](https://docs.python.org/3/library/pathlib.html#querying-file-type-and-status) wie `exists()`, `is_file()` und `is_dir()` stellen Fragen, `mkdir()`, `write_text()` und `unlink()` verändern etwas. `Path.home()` liefert das Home-Verzeichnis auf jedem System – nie `/home/steven` fest in den Code schreiben.

  ## Ordner durchlaufen

  Es gibt vier Wege, und jeder hat seinen Platz:

  | Werkzeug | Liefert | Einsatz |
  | --- | --- | --- |
  | `ordner.iterdir()` | direkte Einträge (Dateien und Ordner) | eine Ebene, eigene Filter |
  | `ordner.glob("*.pdf")` | Treffer eines Musters, eine Ebene | Dateien nach Endung |
  | `ordner.rglob("*.pdf")` | Treffer in allen Unterordnern | rekursiv suchen |
  | `os.walk(ordner)` / `ordner.walk()` | pro Ordner: Pfad, Unterordner, Dateien | rekursiv mit Ausschlüssen |

  ```python run
  from pathlib import Path

  for pfad in ["projekt/main.py", "projekt/src/app.py", "projekt/.venv/lib/site.py", "projekt/notizen.md"]:
      Path(pfad).parent.mkdir(parents=True, exist_ok=True)
      Path(pfad).write_text("", encoding="utf-8")

  basis = Path("projekt")
  print(sorted(p.name for p in basis.iterdir()))
  print(sorted(str(p) for p in basis.glob("*.py")))
  print(sorted(str(p.relative_to(basis)) for p in basis.rglob("*.py")))
  ```

  Zwei Dinge fallen auf. Erstens liefern alle Varianten **keine garantierte Reihenfolge** – sie hängt vom Dateisystem ab. Für Pläne, Logs und Tests sortierst du deshalb mit `sorted()`. Zweitens findet `rglob` auch `.venv/lib/site.py`: Anders als die Shell behandelt [`Path.glob`](https://docs.python.org/3/library/pathlib.html#pathlib.Path.glob) versteckte Dateien und Ordner wie alle anderen.

  Genau hier ist [`os.walk`](https://docs.python.org/3/library/os.html#os.walk) überlegen. Es liefert für jeden Ordner ein Tupel `(pfad, unterordner, dateien)`. Veränderst du die Liste `unterordner` an Ort und Stelle, steigt `os.walk` in die entfernten Ordner gar nicht erst hinab. Bei einem Projekt mit `node_modules` ist das der Unterschied zwischen Millisekunden und Minuten. Seit Python 3.12 gibt es mit [`Path.walk()`](https://docs.python.org/3/library/pathlib.html#pathlib.Path.walk) dasselbe mit `Path`-Objekten.

  ```python run
  import os
  from pathlib import Path

  for pfad in ["repo/app.py", "repo/node_modules/x/index.js", "repo/.git/HEAD", "repo/src/util.py"]:
      Path(pfad).parent.mkdir(parents=True, exist_ok=True)
      Path(pfad).write_text("", encoding="utf-8")

  IGNORIEREN = {"node_modules", ".git", ".venv", "__pycache__"}
  for ordner, unterordner, dateien in os.walk("repo"):
      unterordner[:] = sorted(d for d in unterordner if d not in IGNORIEREN)
      for name in sorted(dateien):
          print(Path(ordner) / name)
  ```

  ## Metadaten: Größe und Änderungszeit

  [`Path.stat()`](https://docs.python.org/3/library/pathlib.html#pathlib.Path.stat) liefert ein `os.stat_result`. Für Automatisierung brauchst du meist zwei Felder: `st_size` in Bytes und `st_mtime`, die letzte Änderung als Unix-Zeitstempel (Sekunden seit 1970, als `float`).

  ```python run
  import os
  from datetime import datetime, timezone
  from pathlib import Path

  for name, tage in [("alt.log", 40), ("neu.log", 1), ("mittel.log", 10)]:
      datei = Path(name)
      datei.write_text("x" * tage, encoding="utf-8")
      zeit = 1_800_000_000 - tage * 86_400
      os.utime(datei, (zeit, zeit))           # Zugriffs- und Änderungszeit setzen

  for datei in sorted(Path(".").glob("*.log"), key=lambda p: p.stat().st_mtime):
      info = datei.stat()
      geaendert = datetime.fromtimestamp(info.st_mtime, tz=timezone.utc)
      print(f"{datei.name:<11} {info.st_size:>3} B  {geaendert:%Y-%m-%d}")
  ```

  `st_mtime` ist ideal für Regeln wie „älter als 30 Tage“. Vorsicht bei `st_ctime`: Unter Linux ist das die Zeit der letzten **Metadatenänderung**, nicht der Erstellung. Und manche Dateisysteme speichern Zeiten grob – FAT auf USB-Sticks nur auf zwei Sekunden genau.

  ## Verschieben, kopieren, löschen

  Hier entstehen die teuren Fehler. Die wichtigsten Operationen und ihr Verhalten:

  | Operation | Verhalten |
  | --- | --- |
  | `quelle.rename(ziel)` | Umbenennen im selben Dateisystem. Überschreibt unter Linux und macOS eine vorhandene Datei **ohne Rückfrage**, unter Windows gibt es `FileExistsError`. |
  | `quelle.replace(ziel)` / `os.replace` | Wie `rename`, überschreibt aber auf **allen** Systemen. Atomar, wenn beide auf demselben Dateisystem liegen. |
  | `shutil.move(quelle, ziel)` | Wie `rename`; über Dateisystemgrenzen hinweg kopiert es und löscht dann die Quelle. |
  | `shutil.copy2(quelle, ziel)` | Kopiert Inhalt **und** Metadaten wie die Änderungszeit. `shutil.copy` übernimmt die Zeiten nicht. |
  | `shutil.copytree(a, b)` | Kopiert einen ganzen Baum; mit `dirs_exist_ok=True` auch in einen vorhandenen Ordner. |
  | `datei.unlink(missing_ok=True)` | Löscht eine Datei, ohne Fehler, wenn sie fehlt. |
  | `shutil.rmtree(ordner)` | Löscht einen Ordner mit allem Inhalt. Endgültig, kein Papierkorb. |

  Die Details stehen in der Doku zu [`Path.rename`](https://docs.python.org/3/library/pathlib.html#pathlib.Path.rename) und [`shutil`](https://docs.python.org/3/library/shutil.html#directory-and-files-operations). Seit Python 3.14 kann `Path` mit `copy()` und `move()` auch selbst kopieren und verschieben; `shutil` bleibt aber der Standard, den du in bestehendem Code findest.

  ```python run
  from pathlib import Path

  Path("bericht.txt").write_text("neu", encoding="utf-8")
  Path("archiv").mkdir()
  Path("archiv/bericht.txt").write_text("WICHTIGE ALTE VERSION", encoding="utf-8")

  Path("bericht.txt").rename("archiv/bericht.txt")      # unter Linux: kein Fehler!
  print(Path("archiv/bericht.txt").read_text(encoding="utf-8"))
  ```

  Das stille Überschreiben ist der Grund, warum jedes Verschiebe-Skript vorher prüft, ob das Ziel frei ist. Die zweite Falle: Ein **relativer** Zielpfad bei `rename` bezieht sich auf das aktuelle Arbeitsverzeichnis, nicht auf den Ordner der Datei. `Path("fotos/a.jpg").rename("b.jpg")` verschiebt die Datei aus `fotos` heraus. Richtig ist `datei.rename(datei.with_name("b.jpg"))`.

  > [!WARNING] `shutil.rmtree` ist endgültig
  > `rmtree` löscht ohne Papierkorb und ohne Rückfrage – und ein falsch zusammengesetzter Pfad kann auf dein Home-Verzeichnis zeigen. Lösche in Automatisierungen nur, was du selbst angelegt hast (etwa ein temporäres Verzeichnis), prüfe den Pfad vorher (`ordner.resolve()` liegt unterhalb des erwarteten Basisordners?) und bevorzuge Verschieben in ein Archiv.

  ### Kollisionen behandeln

  Beim Sortieren gibt es zwei ehrliche Strategien für ein belegtes Ziel: **überspringen und melden** oder einen **freien Namen** wählen, etwa `rechnung (1).pdf`. Überspringen ist die sichere Standardwahl. Nummerieren passt, wenn die Quelle danach verschwindet – dann hat ein zweiter Lauf nichts mehr zu tun und das Skript bleibt idempotent.

  Bei Massen-Umbenennungen kommt eine dritte Quelle für Kollisionen dazu: der Plan selbst. Zwei Fotos, die in derselben Sekunde entstanden sind, bekommen denselben Zielnamen. Ein guter Plan merkt sich deshalb alle bereits vergebenen Ziele, nicht nur die vorhandenen Dateien.

  ## Duplikate finden

  Zwei Dateien sind gleich, wenn ihr Inhalt gleich ist – der Name sagt nichts. Der Inhalt wird über einen **Hash** verglichen: [SHA-256](https://docs.python.org/3/library/hashlib.html) macht aus beliebig vielen Bytes 32 Bytes, und zwei verschiedene Inhalte mit gleichem Hash kommen praktisch nicht vor.

  Zwei Techniken machen das schnell. Erstens: **erst nach Größe gruppieren.** Dateien unterschiedlicher Größe können nicht gleich sein; gehasht werden nur Gruppen mit mindestens zwei gleich großen Dateien. Zweitens: **in Blöcken lesen.** `read_bytes()` lädt eine 8-GB-Videodatei komplett in den Speicher. Blockweises Lesen hält den Speicherbedarf konstant. Seit Python 3.11 erledigt [`hashlib.file_digest`](https://docs.python.org/3/library/hashlib.html#hashlib.file_digest) genau das.

  ```python run
  import hashlib
  from collections import defaultdict
  from pathlib import Path

  def sha256(pfad: Path) -> str:
      h = hashlib.sha256()
      with pfad.open("rb") as datei:
          while block := datei.read(1024 * 1024):   # 1 MiB pro Durchgang
              h.update(block)
      return h.hexdigest()

  Path("a.bin").write_bytes(b"x" * 3_000_000)
  Path("b.bin").write_bytes(b"x" * 3_000_000)
  Path("c.bin").write_bytes(b"y" * 3_000_000)

  nach_hash = defaultdict(list)
  for datei in sorted(Path(".").glob("*.bin")):
      nach_hash[sha256(datei)].append(datei.name)
  print([namen for namen in nach_hash.values() if len(namen) > 1])

  with open("a.bin", "rb") as datei:
      print(hashlib.file_digest(datei, "sha256").hexdigest() == sha256(Path("a.bin")))
  ```

  Dateien werden für Hashes immer im Binärmodus `"rb"` geöffnet – Hashes arbeiten auf Bytes, und der Textmodus würde Zeilenenden und Encoding verändern.

  ## Archive, temporäre Dateien und atomares Schreiben

  ### ZIP und tar

  [`zipfile`](https://docs.python.org/3/library/zipfile.html) liest und schreibt ZIP-Archive. Der zweite Parameter von `write` ist der Name im Archiv (`arcname`) – ohne ihn landet der vollständige Pfad darin. Standardmäßig wird nur gespeichert, nicht komprimiert; `ZIP_DEFLATED` komprimiert.

  ```python run
  import zipfile
  from pathlib import Path

  quelle = Path("projekt")
  (quelle / "src").mkdir(parents=True)
  (quelle / "README.md").write_text("# Projekt\n", encoding="utf-8")
  (quelle / "src" / "app.py").write_text("print('hi')\n" * 100, encoding="utf-8")

  with zipfile.ZipFile("projekt.zip", "w", compression=zipfile.ZIP_DEFLATED) as archiv:
      for datei in sorted(quelle.rglob("*")):
          if datei.is_file():
              archiv.write(datei, arcname=datei.relative_to(quelle).as_posix())

  with zipfile.ZipFile("projekt.zip") as archiv:
      for info in archiv.infolist():
          print(info.filename, info.file_size, info.compress_size < info.file_size)
  ```

  Für den schnellen Fall gibt es `shutil.make_archive("backup", "zip", root_dir="projekt")`. Das Gegenstück für tar-Archive ist [`tarfile`](https://docs.python.org/3/library/tarfile.html). Beim **Entpacken** fremder Archive ist Vorsicht nötig: Ein Eintrag wie `../../.bashrc` könnte außerhalb des Zielordners schreiben. `zipfile.extractall` entfernt solche Pfadteile; bei `tarfile` verhindert der [Extraktionsfilter](https://docs.python.org/3/library/tarfile.html#tarfile-extraction-filter) `filter="data"` das. Seit Python 3.14 ist `"data"` der Standard – gib ihn trotzdem ausdrücklich an, dann ist der Code auch auf älteren Versionen sicher.

  ### Temporäre Dateien

  [`tempfile`](https://docs.python.org/3/library/tempfile.html) erzeugt Dateien und Ordner mit eindeutigen Namen. `TemporaryDirectory()` als Kontextmanager räumt den Ordner samt Inhalt am Ende auf – auch bei einer Exception. Das ist der richtige Ort für Zwischenergebnisse, etwa entpackte Archive.

  ### Atomar schreiben

  `open(pfad, "w")` leert die Datei **sofort**. Stürzt das Programm danach ab – oder wirft `json.dump` mitten im Schreiben eine Exception –, bleibt eine leere oder halbe Datei zurück. Bei einer Konfiguration oder einem Zustandsspeicher ist das ein Totalschaden. Das Muster dagegen: in eine temporäre Datei **im selben Ordner** schreiben und sie dann mit [`os.replace`](https://docs.python.org/3/library/os.html#os.replace) an die Stelle der alten setzen. Innerhalb eines Dateisystems ist das Umbenennen atomar: Andere Programme sehen entweder die alte oder die neue Datei, nie eine halbe.

  ```python
  import json
  import os
  import tempfile
  from pathlib import Path

  def schreibe_atomar(pfad: Path, text: str) -> None:
      fd, tmp = tempfile.mkstemp(dir=pfad.parent, prefix=f".{pfad.name}.", suffix=".tmp")
      try:
          with os.fdopen(fd, "w", encoding="utf-8") as datei:
              datei.write(text)
              datei.flush()
              os.fsync(datei.fileno())      # Daten wirklich auf die Platte
          os.replace(tmp, pfad)              # atomarer Austausch
      except BaseException:
          os.unlink(tmp)                     # keine Temp-Leichen hinterlassen
          raise

  schreibe_atomar(Path("state.json"), json.dumps({"letzter_lauf": "2026-09-28"}))
  ```

  „Im selben Ordner“ ist entscheidend: `/tmp` liegt oft auf einem anderen Dateisystem (unter CachyOS ein `tmpfs` im RAM), und über Dateisystemgrenzen scheitert `os.replace` mit `OSError`.

  > [!INTERVIEW] „Wie schreibst du eine Datei so, dass sie nie halb geschrieben ist?“
  > In eine temporäre Datei im selben Verzeichnis schreiben, `flush` und `fsync`, dann mit `os.replace` über die Zieldatei setzen. Das Umbenennen ist auf POSIX-Systemen atomar, deshalb sieht jeder Leser entweder die alte oder die komplette neue Version. Wichtig: gleiches Dateisystem, sonst ist es kein Umbenennen mehr, sondern ein Kopieren.

  ## Plattformunterschiede

  Skripte, die auf deinem Linux-Rechner laufen, begegnen irgendwann Windows oder macOS – über Kollegen, CI-Runner oder einen USB-Stick:

  - **Groß- und Kleinschreibung.** Windows und macOS unterscheiden standardmäßig nicht zwischen `Foto.JPG` und `foto.jpg`. Zwei Dateien, die unter Linux nebeneinander liegen, kollidieren dort.
  - **Verbotene Namen.** Windows verbietet die Zeichen `<>:"/\|?*` in Dateinamen und reservierte Namen wie `CON` oder `NUL` ([Microsoft: Naming Files](https://learn.microsoft.com/en-us/windows/win32/fileio/naming-a-file)). Ein Doppelpunkt aus einer Uhrzeit (`14:30`) macht einen Namen dort ungültig – nimm `14-30`.
  - **Trennzeichen.** Mit `Path` und `/` musst du nicht darüber nachdenken; mit `"ordner" + "/" + name` schon.
  - **Überschreiben.** `rename` verhält sich unterschiedlich (siehe oben); `replace` ist überall gleich.

  > [!PRAXIS] So sieht ein Aufräum-Job in echt aus
  > Ein Skript, das nachts Dateien sortiert, plant zuerst alle Aktionen, prüft Kollisionen, loggt jede Aktion mit Quelle und Ziel und verschiebt nur. Gelöscht wird erst Wochen später aus einem Archivordner, und dann nur nach Alter. In Code-Reviews fallen vor allem drei Dinge auf: `rename` ohne Prüfung des Ziels, `read_bytes()` auf beliebig große Dateien und fehlendes `sorted()` bei Ausgaben, die jemand vergleichen will.

  ## Häufige Fehler

  - **Pfade als Strings zusammenkleben.** Symptom: doppelte oder fehlende Schrägstriche, Fehler unter Windows. Lösung: `Path` und `/`.
  - **Stilles Überschreiben.** Symptom: Eine Datei ist „verschwunden“, eine andere hat ihren Inhalt. Ursache: `rename` oder `shutil.move` auf ein belegtes Ziel. Lösung: vorher `ziel.exists()` prüfen und überspringen oder einen freien Namen wählen.
  - **Relativer Zielpfad bei `rename`.** Symptom: Dateien tauchen im Arbeitsverzeichnis auf. Lösung: `datei.with_name(...)`.
  - **Unsortierte Ausgaben.** Symptom: Tests schlagen zufällig fehl, Logs sind nicht vergleichbar. Lösung: `sorted()` um `iterdir`, `glob` und `rglob`.
  - **Ganze Dateien in den Speicher laden.** Symptom: `MemoryError` oder ein hängender Rechner bei großen Videos. Lösung: blockweise lesen oder `hashlib.file_digest`.
  - **`shutil.copy` statt `copy2`.** Symptom: Kopien haben alle das heutige Datum, Regeln nach Alter greifen nicht mehr. Lösung: `copy2`.
  - **Direkt in die Zieldatei schreiben.** Symptom: leere Konfiguration nach einem Absturz. Lösung: temporäre Datei plus `os.replace`.

  ## Zusammenfassung

  - `Path` statt Strings: `/` zum Verbinden, `name`, `stem`, `suffix`, `parent`, `with_name`, `with_suffix` zum Zerlegen.
  - `iterdir` für eine Ebene, `glob`/`rglob` für Muster, `os.walk` oder `Path.walk`, wenn du Ordner ausschließen willst. Immer sortieren.
  - `st_size` und `st_mtime` aus `stat()` sind die Grundlage für Regeln nach Größe und Alter.
  - `rename` überschreibt unter Linux still; `replace` überschreibt überall; `shutil.move` klappt auch über Dateisysteme; `copy2` erhält Zeitstempel.
  - Kollisionen entstehen durch vorhandene Dateien **und** durch den eigenen Plan.
  - Duplikate: erst nach Größe gruppieren, dann blockweise hashen.
  - Atomar schreiben: temporäre Datei im selben Ordner, dann `os.replace`.
  - Beim Entpacken fremder Archive auf Pfade achten; bei `tarfile` `filter="data"`.
exercises:
  - id: verschieben-kopieren-verstehen
    type: choice
    title: Wer überschreibt was?
    prompt: Welche Aussagen über Datei-Operationen unter Linux stimmen?
    options:
      - text: "`Path(\"a.txt\").rename(\"b.txt\")` überschreibt eine vorhandene `b.txt` ohne Fehlermeldung."
        correct: true
        why: Unter POSIX ersetzt `rename` ein vorhandenes Ziel still, wenn die Rechte es erlauben. Nur unter Windows gibt es `FileExistsError`.
      - text: "`shutil.copy` übernimmt die Änderungszeit der Quelle."
        correct: false
        why: "`copy` kopiert Inhalt und Rechte, aber keine Zeitstempel. Dafür gibt es `copy2`."
      - text: "`shutil.move` funktioniert auch, wenn Quelle und Ziel auf verschiedenen Dateisystemen liegen."
        correct: true
        why: Scheitert das Umbenennen, kopiert `move` die Datei (standardmäßig mit `copy2`) und löscht danach die Quelle.
      - text: "`os.replace` ist auch dann atomar, wenn das Ziel auf einem anderen Dateisystem liegt."
        correct: false
        why: Über Dateisystemgrenzen kann man nicht umbenennen; `os.replace` wirft dann `OSError`. Deshalb liegt die temporäre Datei beim atomaren Schreiben im selben Ordner.
      - text: "`Path(\"fotos/a.jpg\").rename(\"b.jpg\")` benennt die Datei innerhalb von `fotos` um."
        correct: false
        why: Relative Ziele beziehen sich auf das aktuelle Arbeitsverzeichnis. Die Datei landet als `b.jpg` außerhalb von `fotos`. Richtig ist `rename(datei.with_name("b.jpg"))`.
    explanation: |
      Die gefährlichste Eigenschaft ist das stille Überschreiben von `rename` unter Linux und macOS – ein Verschiebe-Skript ohne Zielprüfung kann so Daten vernichten, ohne dass ein Fehler erscheint. `copy2` statt `copy` hält Zeitstempel und damit Regeln nach Alter intakt. `os.replace` ist nur als echtes Umbenennen atomar, also innerhalb eines Dateisystems.
