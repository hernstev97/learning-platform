  - id: pfad-zerlegen
    type: output
    title: Einen Pfad zerlegen
    prompt: Was gibt dieses Programm aus? Das Programm läuft unter Linux.
    lang: python
    code: |
      from pathlib import Path

      p = Path("backups") / "db" / "dump-2026-09-28.sql.gz"
      print(p.name)
      print(p.stem, p.suffix)
      print(p.suffixes)
      print(p.with_suffix(".bz2").name)
      print(p.parent.name, p.parent.parent)
      print(p.with_name("latest.sql.gz"))
      print(Path("a") / "/etc" / "hosts")
    expected: |
      dump-2026-09-28.sql.gz
      dump-2026-09-28.sql .gz
      ['.sql', '.gz']
      dump-2026-09-28.sql.bz2
      db backups
      backups/db/latest.sql.gz
      /etc/hosts
    explanation: |
      `stem` und `suffix` betrachten nur die letzte Endung, deshalb bleibt `.sql` im Stamm und `with_suffix` ersetzt nur `.gz`. `parent` lässt sich verketten. `with_name` tauscht den letzten Teil, das Verzeichnis bleibt. Die letzte Zeile ist eine Falle: Ist ein Teil absolut, verwirft `/` alles davor – wie `os.path.join`. Pfade aus Benutzereingaben können so aus dem gewünschten Ordner „ausbrechen“.
