      - title: pathlib.Path.glob
        url: https://docs.python.org/3/library/pathlib.html#pathlib.Path.glob
      - title: pathlib · Pattern language
        url: https://docs.python.org/3/library/pathlib.html#pattern-language

  - id: hash-blockweise-ordnen
    type: order
    title: Große Dateien hashen
    prompt: Bring die Zeilen in die richtige Reihenfolge. Die Funktion berechnet den SHA-256-Hash einer Datei, ohne sie komplett in den Speicher zu laden.
    lang: python
    lines: |
      import hashlib
      def sha256(pfad):
          h = hashlib.sha256()
          with open(pfad, "rb") as datei:
              while block := datei.read(1024 * 1024):
                  h.update(block)
          return h.hexdigest()
    explanation: |
      Das Hash-Objekt entsteht vor der Schleife und sammelt alle Blöcke: `update` mit mehreren Blöcken ergibt denselben Hash wie ein einziger Aufruf mit allen Bytes. Der Walross-Operator `:=` liest einen Block und bricht ab, sobald `read` `b""` liefert (Dateiende). `hexdigest` steht nach dem `with`-Block – dann ist die Datei schon geschlossen. Geöffnet wird binär, weil Hashes auf Bytes arbeiten.
    resources:
      - title: hashlib · Hash-Objekte
        url: https://docs.python.org/3/library/hashlib.html#hash-objects
      - title: hashlib.file_digest
        url: https://docs.python.org/3/library/hashlib.html#hashlib.file_digest

  - id: shutil-luecken
    type: gap
    title: Die richtige Werkzeugwahl
    prompt: |
      Ergänze die Aufrufe. Die Kopie soll die Änderungszeit behalten, `copytree` soll in einen schon vorhandenen Ordner kopieren dürfen, das Backup ist ein ZIP-Archiv des Ordners `projekt`, das Löschen soll nicht scheitern, wenn die Datei schon weg ist, und am Ende wird eine Datei atomar ersetzt.
    lang: python
    code: |
      import os
      import shutil
      from pathlib import Path

      shutil.⟦copy2⟧("rechnung.pdf", "archiv/rechnung.pdf")
      shutil.copytree("config", "config-backup", ⟦dirs_exist_ok=True⟧)
      shutil.⟦make_archive⟧("backup-2026-09-28", "zip", root_dir="projekt")
      Path("lock.pid").unlink(⟦missing_ok=True⟧)
      os.⟦replace⟧(".state.json.tmp", "state.json")
    gaps:
      - label: Kopieren mit Metadaten
        hint: Die Variante von `copy`, die auch Zeitstempel übernimmt.
      - label: Vorhandenes Ziel erlauben
        hint: Ein Schlüsselwort-Argument, seit Python 3.8.
      - label: Archiv bauen
        hint: Eine `shutil`-Funktion, die aus einem Ordner ein ZIP oder tar macht.
      - label: Fehlende Datei ignorieren
        hint: Ein Schlüsselwort-Argument von `Path.unlink`.
      - label: Atomar ersetzen
        hint: Die Funktion, die auf allen Systemen überschreibt.
    explanation: |
      `copy2` kopiert Inhalt und Metadaten, `copy` nur Inhalt und Rechte. `copytree` wirft ohne `dirs_exist_ok=True` einen `FileExistsError`, wenn das Ziel existiert. `make_archive` hängt die Endung selbst an und liefert den Pfad des Archivs. `unlink(missing_ok=True)` macht das Aufräumen idempotent. `os.replace` überschreibt – anders als `os.rename` – auch unter Windows und ist innerhalb eines Dateisystems atomar.
    resources:
      - title: shutil.copy2
        url: https://docs.python.org/3/library/shutil.html#shutil.copy2
      - title: shutil.make_archive
        url: https://docs.python.org/3/library/shutil.html#shutil.make_archive

  - id: downloads-kategorisieren
    type: code
    title: Downloads nach Kategorien
    prompt: |
      Schreibe `kategorisiere(ordner)`. Sie liefert ein Dictionary `{kategorie: [dateinamen]}` für die Dateien **direkt** in `ordner`:

      - Die Kategorie ergibt sich aus der Endung (`suffix`) nach `KATEGORIEN`, ohne Rücksicht auf Groß- und Kleinschreibung (`.JPG` ist ein Bild).
      - Unbekannte Endungen und Dateien ohne Endung kommen in `"Sonstiges"`.
      - Ignoriert werden: Ordner, versteckte Dateien (Name beginnt mit `.`) und unfertige Downloads mit der Endung `.part` oder `.crdownload`.
      - Jede Liste ist mit `sorted()` sortiert; Kategorien ohne Dateien fehlen.

      Im Arbeitsverzeichnis liegt `Downloads/` mit Beispieldateien.
    lang: python
    setup: |
      from pathlib import Path
      d = Path("Downloads")
      (d / "alt").mkdir(parents=True)
      (d / "alt" / "foto.jpg").write_text("x", encoding="utf-8")
      for name in ["Urlaub.JPG", "rechnung-0815.pdf", "kontoauszug.CSV", "setup.tar.gz", "notizen.txt",
                   "film.mkv", "README", ".directory", "video.mp4.part", "installer.exe.crdownload"]:
          (d / name).write_text("x", encoding="utf-8")
      Path("Leer").mkdir()
    starter: |
      from pathlib import Path

      KATEGORIEN = {
          "Bilder": {".jpg", ".jpeg", ".png", ".gif", ".webp"},
          "Dokumente": {".pdf", ".docx", ".odt", ".txt"},
          "Tabellen": {".csv", ".xlsx", ".ods"},
          "Archive": {".zip", ".tar", ".gz", ".7z"},
      }

      def kategorisiere(ordner: Path) -> dict[str, list[str]]:
          ergebnis = {}
          for datei in ordner.iterdir():
              ...
          return ergebnis
    solution: |
      from pathlib import Path

      KATEGORIEN = {
          "Bilder": {".jpg", ".jpeg", ".png", ".gif", ".webp"},
          "Dokumente": {".pdf", ".docx", ".odt", ".txt"},
          "Tabellen": {".csv", ".xlsx", ".ods"},
          "Archive": {".zip", ".tar", ".gz", ".7z"},
      }
      UNFERTIG = {".part", ".crdownload"}

      def kategorie_fuer(suffix: str) -> str:
          for kategorie, endungen in KATEGORIEN.items():
              if suffix.lower() in endungen:
                  return kategorie
          return "Sonstiges"

      def kategorisiere(ordner: Path) -> dict[str, list[str]]:
          ergebnis: dict[str, list[str]] = {}
          for datei in ordner.iterdir():
              if not datei.is_file() or datei.name.startswith("."):
                  continue
              if datei.suffix.lower() in UNFERTIG:
                  continue
              ergebnis.setdefault(kategorie_fuer(datei.suffix), []).append(datei.name)
          return {kategorie: sorted(namen) for kategorie, namen in ergebnis.items()}
    tests:
      - name: Bilder ohne Rücksicht auf Großschreibung
        code: |
          ergebnis = kategorisiere(Path("Downloads"))
          assert ergebnis.get("Bilder") == ["Urlaub.JPG"], f"Bilder: {ergebnis.get('Bilder')!r}"
          assert ergebnis.get("Tabellen") == ["kontoauszug.CSV"], f"Tabellen: {ergebnis.get('Tabellen')!r}"
      - name: Dokumente sortiert
        code: |
          ergebnis = kategorisiere(Path("Downloads"))
          assert ergebnis.get("Dokumente") == ["notizen.txt", "rechnung-0815.pdf"], f"Dokumente: {ergebnis.get('Dokumente')!r}"
      - name: Nur die letzte Endung zählt
        code: |
          ergebnis = kategorisiere(Path("Downloads"))
          assert ergebnis.get("Archive") == ["setup.tar.gz"], f"Archive: {ergebnis.get('Archive')!r}"
      - name: Sonstiges und Ausnahmen
        code: |
          ergebnis = kategorisiere(Path("Downloads"))
          assert ergebnis.get("Sonstiges") == ["README", "film.mkv"], f"Sonstiges: {ergebnis.get('Sonstiges')!r}"
          alle = [name for namen in ergebnis.values() for name in namen]
          for falsch in ["alt", ".directory", "video.mp4.part", "installer.exe.crdownload", "foto.jpg"]:
              assert falsch not in alle, f"{falsch} gehört nicht in das Ergebnis"
      - name: Genau diese Kategorien
        code: |
          ergebnis = kategorisiere(Path("Downloads"))
          assert sorted(ergebnis) == ["Archive", "Bilder", "Dokumente", "Sonstiges", "Tabellen"], f"Kategorien: {sorted(ergebnis)}"
          assert kategorisiere(Path("Leer")) == {}, "Ein leerer Ordner ergibt ein leeres Dictionary"
    hints:
      - "Filtere zuerst: `datei.is_file()`, `datei.name.startswith(\".\")`, `datei.suffix.lower() in {\".part\", \".crdownload\"}`."
      - "Eine kleine Hilfsfunktion `kategorie_fuer(suffix)` hält die Schleife übersichtlich."
      - "`ergebnis.setdefault(kategorie, []).append(datei.name)` – und am Ende jede Liste sortieren."
    explanation: |
      Das ist der Planungsteil eines Downloads-Sortierers: Er liest nur und entscheidet, wohin jede Datei gehört. `suffix.lower()` macht die Zuordnung unabhängig von Kameras, die `.JPG` schreiben. `setup.tar.gz` landet über `.gz` bei den Archiven, weil `suffix` nur die letzte Endung liefert. `.part`-Dateien zu überspringen ist wichtig: Ein Browser schreibt gerade hinein, und wer sie verschiebt, zerstört den Download. `sorted()` macht das Ergebnis unabhängig von der Reihenfolge des Dateisystems.
    resources:
      - title: pathlib.PurePath.suffix
        url: https://docs.python.org/3/library/pathlib.html#pathlib.PurePath.suffix
      - title: dict.setdefault
        url: https://docs.python.org/3/library/stdtypes.html#dict.setdefault

  - id: freier-name
    type: code
    title: Einen freien Namen finden
    prompt: |
      Schreibe `freier_name(ziel)`. Ist `ziel` frei, gibt sie `ziel` zurück. Sonst hängt sie ` (1)`, ` (2)` … an den Stamm (`stem`) an, bis ein Name frei ist, und behält Ordner und Endung (`suffix`): `bericht.pdf` → `bericht (1).pdf`.

      Die Funktion prüft nur und legt nichts an. Im Arbeitsverzeichnis liegt `ziel/` mit einigen Dateien.
    lang: python
    setup: |
      from pathlib import Path
      Path("ziel").mkdir()
      for name in ["bericht.pdf", "bericht (1).pdf", "foto.jpg", "LIESMICH", "daten.tar.gz"]:
          (Path("ziel") / name).write_text("x", encoding="utf-8")
    starter: |
      from pathlib import Path

      def freier_name(ziel: Path) -> Path:
          return ziel
    solution: |
      from pathlib import Path

      def freier_name(ziel: Path) -> Path:
          if not ziel.exists():
              return ziel
          nummer = 1
          while True:
              kandidat = ziel.with_name(f"{ziel.stem} ({nummer}){ziel.suffix}")
              if not kandidat.exists():
                  return kandidat
              nummer += 1
    tests:
      - name: Freier Name bleibt
        code: |
          ergebnis = freier_name(Path("ziel/neu.pdf"))
          assert ergebnis == Path("ziel/neu.pdf"), f"bekommen {ergebnis}"
      - name: Erste Kollision
        code: |
          ergebnis = freier_name(Path("ziel/foto.jpg"))
          assert ergebnis == Path("ziel/foto (1).jpg"), f"bekommen {ergebnis}"
      - name: Nummer 1 ist auch belegt
        code: |
          ergebnis = freier_name(Path("ziel/bericht.pdf"))
          assert ergebnis == Path("ziel/bericht (2).pdf"), f"bekommen {ergebnis}"
      - name: Ohne Endung und mit Doppelendung
        code: |
          assert freier_name(Path("ziel/LIESMICH")) == Path("ziel/LIESMICH (1)"), f"bekommen {freier_name(Path('ziel/LIESMICH'))}"
          assert freier_name(Path("ziel/daten.tar.gz")) == Path("ziel/daten.tar (1).gz"), f"bekommen {freier_name(Path('ziel/daten.tar.gz'))}"
      - name: Legt nichts an
        code: |
          freier_name(Path("ziel/foto.jpg"))
          assert sorted(p.name for p in Path("ziel").iterdir()) == ["LIESMICH", "bericht (1).pdf", "bericht.pdf", "daten.tar.gz", "foto.jpg"]
    hints:
      - "`ziel.with_name(...)` behält den Ordner und tauscht nur den Namen."
      - "Baue den Kandidaten als `f\"{ziel.stem} ({nummer}){ziel.suffix}\"` und zähle hoch, solange er existiert."
    explanation: |
      `with_name` sorgt dafür, dass der Kandidat im selben Ordner bleibt; `stem` und `suffix` teilen den Namen an der letzten Endung – bei `daten.tar.gz` entsteht deshalb `daten.tar (1).gz`, was für die meisten Zwecke genügt. Eine Schwäche hat jede Prüfen-dann-Handeln-Lösung: Zwischen `exists()` und dem Verschieben könnte ein anderes Programm denselben Namen belegen (eine Race Condition). Für neue Dateien gibt es dafür den exklusiven Modus `open(pfad, "x")`, der scheitert, wenn die Datei schon existiert. Für ein Skript, das allein in deinem Downloads-Ordner arbeitet, ist die einfache Prüfung ausreichend.
    resources:
      - title: pathlib.PurePath.with_name
        url: https://docs.python.org/3/library/pathlib.html#pathlib.PurePath.with_name
      - title: open() · Modus "x"
        url: https://docs.python.org/3/library/functions.html#open

  - id: fotos-umbenennen-planen
    type: code
    title: Fotos nach Aufnahmezeit benennen
    prompt: |
      Handyfotos heißen `IMG_20260928_143012.jpg`. Schreibe `plane_fotos(ordner)`, die einen Umbenennungsplan als Liste von Tupeln `(alter_name, neuer_name)` liefert – nur Namen, keine Pfade, sortiert nach altem Namen:

      - Berücksichtigt werden Dateien, deren Stamm dem Format `IMG_%Y%m%d_%H%M%S` entspricht (prüfe mit `datetime.strptime`; bei `ValueError` wird die Datei ignoriert).
      - Der neue Name ist `JJJJ-MM-TT_HH-MM-SS` plus Endung in Kleinbuchstaben: `2026-09-28_14-30-12.jpg`.
      - Kollisionen: Ist der neue Name schon als Datei vorhanden **oder im Plan bereits vergeben**, wird ` (1)`, ` (2)` … angehängt.
      - Die Funktion plant nur und benennt nichts um.
    lang: python
    setup: |
      from pathlib import Path
      f = Path("fotos")
      f.mkdir()
      for name in ["IMG_20260928_143012.jpg", "IMG_20260928_143012.JPG", "IMG_20260927_080000.jpg",
                   "2026-09-27_08-00-00.jpg", "IMG_kaputt.jpg", "IMG_20261340_000000.jpg", "notizen.txt"]:
          (f / name).write_text("x", encoding="utf-8")
    starter: |
      from datetime import datetime
      from pathlib import Path

      def plane_fotos(ordner: Path) -> list[tuple[str, str]]:
          plan = []
          for datei in sorted(ordner.iterdir()):
              zeit = datetime.strptime(datei.stem, "IMG_%Y%m%d_%H%M%S")
              plan.append((datei.name, f"{zeit:%Y-%m-%d_%H-%M-%S}{datei.suffix}"))
          return plan
    solution: |
      from datetime import datetime
      from pathlib import Path

      def plane_fotos(ordner: Path) -> list[tuple[str, str]]:
          vorhanden = {p.name for p in ordner.iterdir()}
          vergeben: set[str] = set()
          plan = []
          for datei in sorted(ordner.iterdir()):
              if not datei.is_file():
                  continue
              try:
                  zeit = datetime.strptime(datei.stem, "IMG_%Y%m%d_%H%M%S")
              except ValueError:
                  continue
              basis = f"{zeit:%Y-%m-%d_%H-%M-%S}"
              endung = datei.suffix.lower()
              neu = basis + endung
              nummer = 1
              while neu in vorhanden or neu in vergeben:
                  neu = f"{basis} ({nummer}){endung}"
                  nummer += 1
              vergeben.add(neu)
              plan.append((datei.name, neu))
          return plan
    tests:
      - name: Ungültige Namen werden ignoriert
        code: |
          alte = [alt for alt, _ in plane_fotos(Path("fotos"))]
          for falsch in ["IMG_kaputt.jpg", "IMG_20261340_000000.jpg", "notizen.txt", "2026-09-27_08-00-00.jpg"]:
              assert falsch not in alte, f"{falsch} gehört nicht in den Plan"
      - name: Einfache Umbenennung mit kleiner Endung
        code: |
          plan = dict(plane_fotos(Path("fotos")))
          assert plan.get("IMG_20260928_143012.JPG") == "2026-09-28_14-30-12.jpg", f"bekommen {plan.get('IMG_20260928_143012.JPG')!r}"
      - name: Kollision mit vorhandener Datei
        code: |
          plan = dict(plane_fotos(Path("fotos")))
          assert plan.get("IMG_20260927_080000.jpg") == "2026-09-27_08-00-00 (1).jpg", f"bekommen {plan.get('IMG_20260927_080000.jpg')!r}"
      - name: Kollision innerhalb des Plans
        code: |
          plan = dict(plane_fotos(Path("fotos")))
          assert plan.get("IMG_20260928_143012.jpg") == "2026-09-28_14-30-12 (1).jpg", f"bekommen {plan.get('IMG_20260928_143012.jpg')!r}"
      - name: Vollständiger Plan, nichts umbenannt
        code: |
          plan = plane_fotos(Path("fotos"))
          assert plan == [
              ("IMG_20260927_080000.jpg", "2026-09-27_08-00-00 (1).jpg"),
              ("IMG_20260928_143012.JPG", "2026-09-28_14-30-12.jpg"),
              ("IMG_20260928_143012.jpg", "2026-09-28_14-30-12 (1).jpg"),
          ], f"bekommen {plan!r}"
          assert Path("fotos/IMG_20260928_143012.JPG").exists(), "plane_fotos darf nichts umbenennen"
    hints:
      - "Umschließe `strptime` mit `try`/`except ValueError: continue` – so fallen auch unmögliche Daten wie Monat 13 heraus."
      - "Merke dir zwei Mengen: die vorhandenen Dateinamen und die im Plan schon vergebenen neuen Namen."
      - "`while neu in vorhanden or neu in vergeben:` zählt die Nummer hoch; danach `vergeben.add(neu)`."
    explanation: |
      `strptime` ist hier Parser und Validator zugleich: `IMG_kaputt` passt nicht zum Format, und `20261340` scheitert, weil es keinen 13. Monat gibt. Die zweite Menge `vergeben` ist der Kern der Aufgabe: `IMG_…143012.JPG` und `IMG_…143012.jpg` sind unter Linux zwei Dateien, erzeugen aber denselben Zielnamen – eine Prüfung nur gegen das Dateisystem würde das übersehen, und die zweite Umbenennung würde die erste überschreiben. Durch die Sortierung ist der Plan reproduzierbar, und weil bereits umbenannte Dateien nicht mehr zum Muster passen, hat ein zweiter Lauf nichts zu tun.
    resources:
      - title: datetime.strptime
        url: https://docs.python.org/3/library/datetime.html#datetime.datetime.strptime
      - title: strftime() and strptime() Behavior
        url: https://docs.python.org/3/library/datetime.html#strftime-and-strptime-behavior

  - id: duplikate-finden
    type: code
    title: Duplikate finden
    prompt: |
      Schreibe `finde_duplikate(ordner)`. Sie durchsucht `ordner` **rekursiv** und liefert Gruppen von Dateien mit identischem Inhalt:

      - Jede Gruppe ist eine sortierte Liste relativer Pfade in POSIX-Schreibweise (`fotos/a.jpg`), nur Gruppen mit mindestens zwei Dateien.
      - Die Gruppen sind nach ihrem ersten Eintrag sortiert.
      - Leere Dateien werden ignoriert.
      - Gruppiere zuerst nach Größe und hashe nur Dateien, deren Größe mehrfach vorkommt. Lies zum Hashen blockweise oder mit `hashlib.file_digest`.
    lang: python
    setup: |
      from pathlib import Path
      bild = b"\xff\xd8" + bytes(range(256)) * 400
      anders = bytearray(bild)
      anders[-1] ^= 1
      dateien = {
          "sammlung/fotos/a.jpg": bild,
          "sammlung/fotos/kopie/a (1).jpg": bild,
          "sammlung/backup/a.jpg": bild,
          "sammlung/fotos/b.jpg": bytes(anders),
          "sammlung/notizen/x.txt": b"hallo",
          "sammlung/notizen/y.txt": b"hallo",
          "sammlung/notizen/z.txt": b"hallo!",
          "sammlung/leer1.txt": b"",
          "sammlung/leer2.txt": b"",
      }
      for pfad, inhalt in dateien.items():
          Path(pfad).parent.mkdir(parents=True, exist_ok=True)
          Path(pfad).write_bytes(inhalt)
    starter: |
      import hashlib
      from collections import defaultdict
      from pathlib import Path

      def finde_duplikate(ordner: Path) -> list[list[str]]:
          nach_groesse = defaultdict(list)
          ...
          return []
    solution: |
      import hashlib
      from collections import defaultdict
      from pathlib import Path

      def sha256(pfad: Path) -> str:
          with pfad.open("rb") as datei:
              return hashlib.file_digest(datei, "sha256").hexdigest()

      def finde_duplikate(ordner: Path) -> list[list[str]]:
          nach_groesse: dict[int, list[Path]] = defaultdict(list)
          for datei in ordner.rglob("*"):
              if datei.is_file():
                  groesse = datei.stat().st_size
                  if groesse > 0:
                      nach_groesse[groesse].append(datei)

          gruppen = []
          for kandidaten in nach_groesse.values():
              if len(kandidaten) < 2:
                  continue
              nach_hash: dict[str, list[str]] = defaultdict(list)
              for datei in kandidaten:
                  nach_hash[sha256(datei)].append(datei.relative_to(ordner).as_posix())
              gruppen.extend(sorted(namen) for namen in nach_hash.values() if len(namen) > 1)
          return sorted(gruppen)
    tests:
      - name: Drei gleiche Bilder
        code: |
          gruppen = finde_duplikate(Path("sammlung"))
          assert ["backup/a.jpg", "fotos/a.jpg", "fotos/kopie/a (1).jpg"] in gruppen, f"bekommen {gruppen!r}"
      - name: Gleiche Größe, anderer Inhalt
        code: |
          gruppen = finde_duplikate(Path("sammlung"))
          alle = [p for g in gruppen for p in g]
          assert "fotos/b.jpg" not in alle, "b.jpg ist gleich groß wie a.jpg, aber nicht gleich"
      - name: Kleine Textdateien und leere Dateien
        code: |
          gruppen = finde_duplikate(Path("sammlung"))
          assert ["notizen/x.txt", "notizen/y.txt"] in gruppen, f"bekommen {gruppen!r}"
          alle = [p for g in gruppen for p in g]
          assert "leer1.txt" not in alle, "Leere Dateien werden ignoriert"
      - name: Genau zwei Gruppen, sortiert
        code: |
          gruppen = finde_duplikate(Path("sammlung"))
          assert gruppen == [
              ["backup/a.jpg", "fotos/a.jpg", "fotos/kopie/a (1).jpg"],
              ["notizen/x.txt", "notizen/y.txt"],
          ], f"bekommen {gruppen!r}"
    hints:
      - "Schritt 1: `ordner.rglob(\"*\")`, nur `is_file()`, nach `stat().st_size` in ein `defaultdict(list)` sortieren."
      - "Schritt 2: nur Größengruppen mit `len(...) >= 2` hashen, wieder in ein `defaultdict(list)` nach Hash."
      - "Relative Pfade: `datei.relative_to(ordner).as_posix()`. Am Ende `sorted(gruppen)` – Listen werden elementweise verglichen."
    explanation: |
      Die Vorgruppierung nach Größe ist der entscheidende Trick: `stat` kostet fast nichts, Hashen dagegen liest jede Datei vollständig. In einer typischen Fotosammlung haben die meisten Dateien eine einzigartige Größe und werden nie gelesen. Das Beispiel `b.jpg` zeigt, warum die Größe allein nicht reicht. `file_digest` liest blockweise, sodass auch große Videos den Speicher nicht füllen. `as_posix()` macht die Ausgabe auf allen Systemen gleich. Löschen würde ein echtes Werkzeug die Duplikate übrigens nicht selbst, sondern eine Liste ausgeben oder in einen Archivordner verschieben.
    resources:
      - title: hashlib.file_digest
        url: https://docs.python.org/3/library/hashlib.html#hashlib.file_digest
      - title: collections.defaultdict
        url: https://docs.python.org/3/library/collections.html#collections.defaultdict

  - id: projekt-zippen
    type: code
    title: Ein Projekt sichern
    prompt: |
      Schreibe `sichere(quelle, ziel_zip)`. Sie packt alle Dateien unter `quelle` rekursiv in ein komprimiertes ZIP-Archiv (`ZIP_DEFLATED`) und gibt die Anzahl der gepackten Dateien zurück.

      - Die Namen im Archiv sind relativ zu `quelle` und in POSIX-Schreibweise: `src/app.py`, nicht `projekt/src/app.py`.
      - Dateien in Ordnern namens `.git`, `__pycache__` oder `node_modules` (egal auf welcher Ebene) werden ausgelassen.
      - Die Dateien werden in sortierter Reihenfolge hinzugefügt.
    lang: python
    setup: |
      from pathlib import Path
      dateien = {
          "projekt/README.md": "# Projekt\n",
          "projekt/src/app.py": "print('hallo')\n" * 50,
          "projekt/src/__pycache__/app.cpython-314.pyc": "binär",
          "projekt/.git/HEAD": "ref: refs/heads/main\n",
          "projekt/web/node_modules/lib/index.js": "module.exports = 1\n",
          "projekt/web/index.html": "<h1>Hi</h1>\n",
          "projekt/.env.example": "API_KEY=\n",
      }
      for pfad, inhalt in dateien.items():
          Path(pfad).parent.mkdir(parents=True, exist_ok=True)
          Path(pfad).write_text(inhalt, encoding="utf-8")
    starter: |
      import zipfile
      from pathlib import Path

      AUSLASSEN = {".git", "__pycache__", "node_modules"}

      def sichere(quelle: Path, ziel_zip: Path) -> int:
          with zipfile.ZipFile(ziel_zip, "w") as archiv:
              for datei in quelle.rglob("*"):
                  archiv.write(datei)
          return 0
    solution: |
      import zipfile
      from pathlib import Path

      AUSLASSEN = {".git", "__pycache__", "node_modules"}

      def sichere(quelle: Path, ziel_zip: Path) -> int:
          anzahl = 0
          with zipfile.ZipFile(ziel_zip, "w", compression=zipfile.ZIP_DEFLATED) as archiv:
              for datei in sorted(quelle.rglob("*")):
                  relativ = datei.relative_to(quelle)
                  if not datei.is_file() or AUSLASSEN & set(relativ.parts):
                      continue
                  archiv.write(datei, arcname=relativ.as_posix())
                  anzahl += 1
          return anzahl
    tests:
      - name: Richtige Namen im Archiv
        code: |
          import zipfile
          anzahl = sichere(Path("projekt"), Path("backup.zip"))
          with zipfile.ZipFile("backup.zip") as archiv:
              namen = archiv.namelist()
          assert namen == [".env.example", "README.md", "src/app.py", "web/index.html"], f"Archiv enthält {namen}"
      - name: Anzahl stimmt
        code: |
          anzahl = sichere(Path("projekt"), Path("backup2.zip"))
          assert anzahl == 4, f"erwartet 4, bekommen {anzahl!r}"
      - name: Inhalt und Kompression
        code: |
          import zipfile
          sichere(Path("projekt"), Path("backup3.zip"))
          with zipfile.ZipFile("backup3.zip") as archiv:
              assert archiv.read("src/app.py").decode("utf-8") == "print('hallo')\n" * 50
              info = archiv.getinfo("src/app.py")
              assert info.compress_type == zipfile.ZIP_DEFLATED, "Das Archiv soll komprimiert sein (ZIP_DEFLATED)"
    hints:
      - "`datei.relative_to(quelle)` liefert den Pfad innerhalb des Projekts, `.parts` seine Teile."
      - "Auslassen, wenn `AUSLASSEN & set(relativ.parts)` nicht leer ist – das prüft alle Ebenen auf einmal."
      - "`archiv.write(datei, arcname=relativ.as_posix())` und `compression=zipfile.ZIP_DEFLATED` beim Öffnen."
    explanation: |
      Ohne `arcname` speichert `write` den Pfad so, wie du ihn übergibst – beim Entpacken entsteht dann ein zusätzlicher Ordner `projekt/`, bei absoluten Pfaden sogar der ganze Verzeichnisbaum. Die Mengen-Schnittmenge über `parts` trifft ganze Ordnernamen auf jeder Ebene, ohne falsche Treffer wie `.github` oder eine Datei namens `git.md`. Ohne `ZIP_DEFLATED` speichert `zipfile` unkomprimiert. Sortiert hinzugefügt ist das Archiv reproduzierbar: Zwei Läufe über denselben Stand ergeben dieselbe Reihenfolge.
    resources:
      - title: zipfile.ZipFile.write
        url: https://docs.python.org/3/library/zipfile.html#zipfile.ZipFile.write
      - title: pathlib.PurePath.parts
        url: https://docs.python.org/3/library/pathlib.html#pathlib.PurePath.parts

  - id: repariere-json-speichern
    type: code
    title: Repariere das Speichern des Zustands
    prompt: |
      Ein Automatisierungsjob speichert seinen Zustand in `state.json`. Einmal ist beim Speichern eine Exception aufgetreten – danach war die Datei halb geschrieben und der nächste Lauf ist abgestürzt.

      Mache `speichere_json(pfad, daten)` robust:

      - Schreibe zuerst in eine temporäre Datei **im selben Ordner** und ersetze die Zieldatei dann mit `os.replace` (oder `Path.replace`).
      - Scheitert das Schreiben, bleibt die alte Datei unverändert, die Exception wird weitergereicht, und es bleibt keine temporäre Datei zurück.
    lang: python
    starter: |
      import json
      import os
      import tempfile
      from pathlib import Path

      def speichere_json(pfad: Path, daten: dict) -> None:
          with pfad.open("w", encoding="utf-8") as datei:
              json.dump(daten, datei, indent=2, ensure_ascii=False)
    solution: |
      import json
      import os
      import tempfile
      from pathlib import Path

      def speichere_json(pfad: Path, daten: dict) -> None:
          fd, tmp = tempfile.mkstemp(dir=pfad.parent, prefix=f".{pfad.name}.", suffix=".tmp")
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as datei:
                  json.dump(daten, datei, indent=2, ensure_ascii=False)
              os.replace(tmp, pfad)
          except BaseException:
              os.unlink(tmp)
              raise
    tests:
      - name: Normales Speichern
        code: |
          import json
          Path("job").mkdir()
          speichere_json(Path("job/state.json"), {"stadt": "Köln", "zaehler": 1})
          assert json.loads(Path("job/state.json").read_text(encoding="utf-8")) == {"stadt": "Köln", "zaehler": 1}
      - name: Überschreiben klappt
        code: |
          import json
          speichere_json(Path("job/state.json"), {"zaehler": 2})
          assert json.loads(Path("job/state.json").read_text(encoding="utf-8")) == {"zaehler": 2}
      - name: Fehler lässt die alte Datei intakt
        code: |
          vorher = Path("job/state.json").read_text(encoding="utf-8")
          try:
              speichere_json(Path("job/state.json"), {"zaehler": 3, "kaputt": object()})
          except TypeError:
              pass
          else:
              raise AssertionError("Die TypeError von json.dump muss weitergereicht werden")
          nachher = Path("job/state.json").read_text(encoding="utf-8")
          assert nachher == vorher, f"state.json wurde beschädigt: {nachher!r}"
      - name: Keine temporären Dateien übrig
        code: |
          reste = sorted(p.name for p in Path("job").iterdir())
          assert reste == ["state.json"], f"Im Ordner liegt noch: {reste}"
      - name: Ersetzt per Umbenennen im selben Ordner
        code: |
          import os
          aufrufe = []
          echt_replace, echt_rename = os.replace, os.rename
          def spion_replace(quelle, ziel, *args, **kwargs):
              aufrufe.append((Path(quelle), Path(ziel)))
              return echt_replace(quelle, ziel, *args, **kwargs)
          def spion_rename(quelle, ziel, *args, **kwargs):
              aufrufe.append((Path(quelle), Path(ziel)))
              return echt_rename(quelle, ziel, *args, **kwargs)
          os.replace, os.rename = spion_replace, spion_rename
          try:
              speichere_json(Path("job/state.json"), {"zaehler": 4})
          finally:
              os.replace, os.rename = echt_replace, echt_rename
          assert aufrufe, "Die Zieldatei soll per os.replace (oder Path.replace) ersetzt werden"
          quelle, ziel = aufrufe[-1]
          assert ziel.resolve() == Path("job/state.json").resolve() and quelle.resolve().parent == ziel.resolve().parent, f"Umbenannt wurde {quelle} -> {ziel}; die temporäre Datei muss im selben Ordner liegen"
    hints:
      - "`tempfile.mkstemp(dir=pfad.parent)` liefert `(fd, pfadname)`; `os.fdopen(fd, \"w\", encoding=\"utf-8\")` macht daraus ein Dateiobjekt."
      - "Nach erfolgreichem Schreiben: `os.replace(tmp, pfad)`."
      - "Umschließe alles mit `try`/`except BaseException:` – darin `os.unlink(tmp)` und `raise`."
    explanation: |
      `open(pfad, "w")` leert die Zieldatei sofort; wirft `json.dump` danach, bleibt ein Bruchstück. Mit dem Muster „temporär schreiben, dann ersetzen“ wird die alte Datei erst angefasst, wenn die neue vollständig ist, und `os.replace` tauscht sie in einem Schritt aus. Der temporäre Name liegt im selben Ordner, damit das Ersetzen ein Umbenennen bleibt und nicht zum Kopieren über Dateisystemgrenzen wird. `except BaseException` mit `raise` räumt auch bei `KeyboardInterrupt` auf und verschluckt nichts. Für Absturzsicherheit bei Stromausfall gehört vor das Ersetzen noch `datei.flush()` und `os.fsync(datei.fileno())`.
    resources:
      - title: tempfile.mkstemp
        url: https://docs.python.org/3/library/tempfile.html#tempfile.mkstemp
      - title: os.replace
        url: https://docs.python.org/3/library/os.html#os.replace

  - id: backup-rotation-bug
    type: bug
    title: Die falschen Backups sind weg
    prompt: |
      `rotiere` soll die drei **neuesten** Backups behalten und alle älteren löschen. Nach dem ersten Lauf fehlen aber ausgerechnet die neuesten Backups – nur die drei ältesten sind übrig. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      def rotiere(ordner: Path, behalten: int = 3) -> list[Path]:
          backups = sorted(
              ordner.glob("backup-*.tar.gz"),
              key=lambda p: p.stat().st_mtime,
              reverse=True,
          )
          zu_loeschen = backups[:-behalten]
          for alt in zu_loeschen:
              log.info("lösche %s", alt.name)
              alt.unlink()
          return zu_loeschen
    lines: [7]
    fix:
      - line: 7
        answers:
          - zu_loeschen = backups[behalten:]
    explanation: |
      Mit `reverse=True` stehen die **neuesten** Backups vorn. `backups[:-behalten]` nimmt alles außer den letzten drei – also gerade die neuesten – und löscht sie. Richtig ist `backups[behalten:]`: alles ab dem vierten Eintrag. Der Fehler entsteht, wenn man die Sortierrichtung und das Slicing getrennt voneinander denkt. Bei `behalten=0` hätte `[:-0]` übrigens eine leere Liste ergeben. Ein Trockenlauf, der vor dem Löschen die Namen ausgibt, hätte das sofort gezeigt.
    resources:
      - title: Sorting Techniques
        url: https://docs.python.org/3/howto/sorting.html
      - title: Sequenzen · Slicing
        url: https://docs.python.org/3/library/stdtypes.html#common-sequence-operations

  - id: os-walk-erklaeren
    type: explain
    title: Warum os.walk hier schneller ist
    prompt: |
      Diese Funktion sucht alle Python-Dateien in einem Repository. Erkläre, wie sie Ordner ausschließt, warum dafür `unterordner[:] = …` statt `unterordner = …` nötig ist und warum sie in großen Projekten deutlich schneller ist als `[p for p in wurzel.rglob("*.py") if ".venv" not in p.parts]`.
    lang: python
    code: |
      import os
      from collections.abc import Iterator
      from pathlib import Path

      IGNORIEREN = {".git", ".venv", "node_modules", "__pycache__"}

      def python_dateien(wurzel: Path) -> Iterator[Path]:
          for ordner, unterordner, dateien in os.walk(wurzel):
              unterordner[:] = sorted(d for d in unterordner if d not in IGNORIEREN)
              for name in sorted(dateien):
                  if name.endswith(".py"):
                      yield Path(ordner) / name
    points:
      - "`os.walk` liefert von oben nach unten pro Ordner den Pfad, die Liste der Unterordner und die Liste der Dateien."
      - Die Liste der Unterordner wird an Ort und Stelle verändert; `os.walk` steigt nur in die Ordner hinab, die danach noch in der Liste stehen.
      - Eine neue Zuweisung (`unterordner = …`) würde nur den lokalen Namen umbiegen; `os.walk` sähe weiter die ursprüngliche Liste.
      - "`rglob` durchläuft zuerst alle Ordner inklusive `.venv` und `node_modules` und filtert erst danach – das kostet bei Zehntausenden Dateien viel Zeit."
      - Das Sortieren macht die Reihenfolge deterministisch; als Generator liefert die Funktion Treffer, bevor die Suche fertig ist.
    explanation: |
      `os.walk` arbeitet standardmäßig von oben nach unten (`topdown=True`) und liefert für jeden Ordner ein Tupel aus Pfad, Unterordnern und Dateien. Bevor es weitergeht, schaut es in genau diese Liste der Unterordner. Die Slice-Zuweisung `unterordner[:] = …` ersetzt den **Inhalt** dieser Liste; `.git`, `.venv` und `node_modules` werden deshalb nie betreten. Eine normale Zuweisung würde nur eine neue Liste an den lokalen Namen binden, `os.walk` hätte davon nichts. `rglob` mit anschließendem Filter liefert dasselbe Ergebnis, besucht aber jeden Ordner – in einem Web-Projekt mit `node_modules` sind das schnell 100 000 Einträge. Das Sortieren der Unterordner (auch an Ort und Stelle) und der Dateien macht die Ausgabe reproduzierbar, `yield` macht die Funktion zum Generator. Seit Python 3.12 funktioniert `Path.walk()` genauso.
    resources:
      - title: os.walk
        url: https://docs.python.org/3/library/os.html#os.walk
      - title: pathlib.Path.walk
        url: https://docs.python.org/3/library/pathlib.html#pathlib.Path.walk

  - id: downloads-sortierer
    type: practice
    title: Dein Downloads-Sortierer
    prompt: |
      Baue aus den Übungen dieses Moduls ein Werkzeug für deinen echten Downloads-Ordner:

      - `python3 sortiere.py ~/Downloads` zeigt nur den Plan (Trockenlauf), `--apply` führt ihn aus.
      - Dateien werden nach Kategorie in Unterordner verschoben; unfertige Downloads und versteckte Dateien bleiben liegen.
      - Kollisionen werden mit ` (1)`, ` (2)` … gelöst, nie wird überschrieben.
      - Jede Aktion wird geloggt, am Ende steht eine Zusammenfassung; bei Fehlern endet das Skript mit Exit-Code `1`.

      Teste zuerst auf einer Kopie: `cp -a ~/Downloads /tmp/dl-test`.
    lang: python
    solution: |
      #!/usr/bin/env python3
      """Sortiert einen Downloads-Ordner nach Dateityp in Unterordner."""
      import argparse
      import logging
      import shutil
      import sys
      from pathlib import Path

      log = logging.getLogger("sortiere")

      KATEGORIEN = {
          "Bilder": {".jpg", ".jpeg", ".png", ".gif", ".webp", ".heic"},
          "Dokumente": {".pdf", ".docx", ".odt", ".txt", ".md"},
          "Tabellen": {".csv", ".xlsx", ".ods"},
          "Archive": {".zip", ".tar", ".gz", ".7z", ".xz"},
          "Videos": {".mp4", ".mkv", ".webm"},
      }
      UNFERTIG = {".part", ".crdownload", ".download"}


      def kategorie_fuer(datei: Path) -> str:
          for kategorie, endungen in KATEGORIEN.items():
              if datei.suffix.lower() in endungen:
                  return kategorie
          return "Sonstiges"


      def freier_name(ziel: Path, vergeben: set[Path]) -> Path:
          kandidat, nummer = ziel, 1
          while kandidat.exists() or kandidat in vergeben:
              kandidat = ziel.with_name(f"{ziel.stem} ({nummer}){ziel.suffix}")
              nummer += 1
          return kandidat


      def plane(ordner: Path) -> list[tuple[Path, Path]]:
          plan: list[tuple[Path, Path]] = []
          vergeben: set[Path] = set()
          for datei in sorted(ordner.iterdir()):
              if not datei.is_file() or datei.name.startswith(".") or datei.suffix.lower() in UNFERTIG:
                  continue
              ziel = freier_name(ordner / kategorie_fuer(datei) / datei.name, vergeben)
              vergeben.add(ziel)
              plan.append((datei, ziel))
          return plan


      def main(argv: list[str] | None = None) -> int:
          parser = argparse.ArgumentParser(description=__doc__)
          parser.add_argument("ordner", type=Path)
          parser.add_argument("--apply", action="store_true", help="wirklich verschieben")
          args = parser.parse_args(argv)
          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(message)s")

          if not args.ordner.is_dir():
              log.error("%s ist kein Ordner", args.ordner)
              return 2

          fehler = 0
          plan = plane(args.ordner)
          for quelle, ziel in plan:
              log.info("%s%s -> %s", "" if args.apply else "[dry-run] ", quelle.name, ziel.relative_to(args.ordner))
              if not args.apply:
                  continue
              try:
                  ziel.parent.mkdir(exist_ok=True)
                  shutil.move(quelle, ziel)
              except OSError as exc:
                  log.error("%s: %s", quelle.name, exc)
                  fehler += 1
          log.info("%d Datei(en) %s, %d Fehler", len(plan), "verschoben" if args.apply else "geplant", fehler)
          return 1 if fehler else 0


      if __name__ == "__main__":
          sys.exit(main())
    checklist:
      - Ohne `--apply` verändert das Skript nachweislich nichts (vorher und nachher `ls -R` verglichen).
      - Planen und Ausführen sind getrennte Funktionen; der Plan ist sortiert.
      - Kollisionen mit vorhandenen Dateien **und** innerhalb des Plans werden aufgelöst.
      - "`.part`- und `.crdownload`-Dateien sowie versteckte Dateien werden nicht angefasst."
      - Ein zweiter Lauf mit `--apply` findet nichts mehr zu tun.
      - Fehler beim Verschieben werden geloggt, gezählt und führen zu Exit-Code `1`.
    explanation: |
      Das Werkzeug verbindet die Bausteine des Moduls mit den Prinzipien aus dem ersten Modul: planen, dann ausführen; Trockenlauf als Standard; nie überschreiben; laut scheitern. `shutil.move` statt `rename` funktioniert auch, wenn der Zielordner auf einer anderen Platte liegt. Weil sortierte Dateien in Unterordnern landen und `iterdir` nur die oberste Ebene betrachtet, ist der zweite Lauf leer – das Skript ist idempotent. Als Nächstes lässt es sich mit einem systemd-Timer regelmäßig starten.
    resources:
      - title: shutil.move
        url: https://docs.python.org/3/library/shutil.html#shutil.move
