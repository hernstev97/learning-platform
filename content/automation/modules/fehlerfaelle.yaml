lesson: |
  Im Modul [Robuste Automatisierung](/automation/robustheit) steht, was ein Job bei Teilfehlern tun soll: begrenzt wiederholen, Zustand bestätigen, Duplikate vermeiden. Dieses Modul macht daraus Code, den du im Test scheitern lässt. Ein Fehlerfall, den du nicht herbeiführen kannst, ist ein Fehlerfall, den du nicht testest. Und ein ungetesteter Fehlerpfad ist der Teil des Programms, der im Ernstfall zum ersten Mal läuft.

  Drei Werkzeuge tragen das ganze Modul. Erstens übergibst du Uhr, Wartefunktion und Zufall als Parameter, statt sie im Code fest zu verdrahten. Zweitens baust du Fakes, die auf Kommando 503 liefern oder abstürzen. Drittens legst du Absturzpunkte fest: Zwischen welchen zwei Zeilen darf der Prozess sterben, und was passiert beim nächsten Start? Alle Beispiele laufen im Browser, ohne echte Wartezeiten.

  ## Zeit und Zufall als Parameter

  `time.sleep(30)` in einer Wiederholungsschleife macht jeden Test 30 Sekunden langsam, und `time.monotonic()` lässt sich nicht vorspulen. Die Lösung ist eine kleine Fake-Uhr. Ihr Trick: Die Wartefunktion schläft nicht, sondern stellt die Uhr vor. So bleiben Uhr und Wartezeit im Test konsistent, genau wie im Betrieb.

  ```python run
  class Uhr:
      def __init__(self, t=0.0):
          self.t = t

      def __call__(self):
          return self.t

      def schlafe(self, sekunden):
          self.t += sekunden

  uhr = Uhr()
  uhr.schlafe(2.5)
  uhr.schlafe(1)
  print(uhr())
  ```

  Im Betrieb übergibst du [`time.monotonic`](https://docs.python.org/3/library/time.html#time.monotonic) und `time.sleep`, im Test `uhr` und `uhr.schlafe`. Eine monotone Uhr springt nicht, wenn jemand die Systemzeit verstellt oder die Zeitsynchronisation sie korrigiert; für Dauer und Budgets ist sie die richtige Wahl. Für Zufall gilt dasselbe: Übergib eine Funktion wie `random.random` und im Test `lambda: 0.5`. Dann ist jeder Testlauf gleich.

  ## Deadline und Jitter

  Exponentieller Backoff verdoppelt die Pause nach jedem Fehlschlag. Scheitern viele Clients gleichzeitig, etwa weil ein Dienst kurz weg war, wiederholen sie aber auch gleichzeitig und überrollen ihn beim Neustart. **Jitter** verteilt sie. Die Variante „Full Jitter“ aus dem [AWS Architecture Blog](https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/) wählt eine zufällige Pause zwischen null und der exponentiellen Grenze.

  ```python run
  def pause(versuch, zufall,
            basis=1, deckel=8):
      grenze = basis * 2 ** versuch
      return zufall() * min(deckel,
                            grenze)

  def halb():
      return 0.5

  for v in range(5):
      print(v, pause(v, halb))
  ```

  Eine Anzahl von Versuchen allein begrenzt die Laufzeit nicht: Fünf Versuche mit je 30 Sekunden Timeout und wachsenden Pausen können Minuten dauern. Deshalb bekommt ein Job eine **Deadline**, ein Zeitbudget für alles zusammen. Vor jeder Pause prüft er, ob sie noch hineinpasst. Passt sie nicht, gibt er sofort auf, statt zu schlafen und danach ohnehin abzubrechen.

  ```python run
  def passt(uhr, ende, pause):
      return uhr() + pause <= ende

  class Uhr:
      def __init__(self):
          self.t = 0.0
      def __call__(self):
          return self.t

  uhr = Uhr()
  ende = uhr() + 10
  uhr.t = 7
  print(passt(uhr, ende, 2))
  print(passt(uhr, ende, 4))
  ```

  ## Wiederholen nach Statuscode

  Nicht jede Fehlerantwort lohnt einen zweiten Versuch. Die Frage ist immer: Kann dieselbe Anfrage später gelingen, ohne dass sich etwas an ihr ändert?

  | Status | Bedeutung | Wiederholen? |
  | --- | --- | --- |
  | 429 | zu viele Anfragen | ja, nach Retry-After |
  | 502, 503, 504 | Gateway oder Dienst gestört | ja, mit Backoff |
  | 400, 422 | Anfrage ungültig | nein |
  | 401 | Token ungültig | einmal erneuern (Modul Authentifizierung) |
  | 403, 404 | verboten, nicht da | nein |

  Ein 500 ist ein Grenzfall: Manchmal vorübergehend, oft ein Fehler, den deine Anfrage auslöst. Wiederhole automatisch nur, was dokumentiert vorübergehend ist, und nur Operationen, die zweimal ausgeführt nicht schaden. Bei schreibenden Anfragen brauchst du dafür einen Idempotency-Key, siehe [Web-APIs](/automation/web-apis).

  [`Retry-After`](https://www.rfc-editor.org/rfc/rfc9110.html#section-10.2.3) kommt in zwei Formen: als Sekundenzahl `120` oder als HTTP-Datum `Sat, 24 Oct 2026 08:00:30 GMT`. Das Datum liest [`email.utils.parsedate_to_datetime`](https://docs.python.org/3/library/email.utils.html#email.utils.parsedate_to_datetime); ungültige Werte lösen `ValueError` aus. Die Wartezeit ist die Differenz zur aktuellen Zeit, nie negativ. Auch hier ist „jetzt“ ein Parameter.

  ```python run
  from datetime import datetime, UTC
  from email.utils import (
      parsedate_to_datetime)

  jetzt = datetime(2026, 10, 24, 8,
                   tzinfo=UTC)
  kopf = ("Sat, 24 Oct 2026 "
          "08:00:30 GMT")
  ziel = parsedate_to_datetime(kopf)
  rest = ziel - jetzt
  print(rest.total_seconds())
  ```

  Verlangt ein Dienst eine Pause, die länger ist als dein restliches Budget, brichst du ab und lässt den nächsten geplanten Lauf übernehmen. Die Pause still zu verkürzen hieße, den Dienst früher zu belasten, als er erlaubt.

  ## Lockfile gegen überlappende Läufe

  Ein stündlicher Job braucht ausnahmsweise 70 Minuten. Der nächste Start beginnt, während der erste noch schreibt, und beide verarbeiten dieselben Aufträge. Ein **Lock** verhindert das: Nur wer ihn hat, arbeitet. Die naheliegende Lösung „wenn die Datei nicht existiert, lege sie an“ hat eine Lücke. Zwischen Prüfen und Anlegen kann ein zweiter Prozess dasselbe prüfen. Beide sehen „frei“, beide legen an.

  [`os.open`](https://docs.python.org/3/library/os.html#os.open) mit `O_CREAT | O_EXCL` prüft und legt in einem Schritt an. Existiert die Datei schon, scheitert der Aufruf mit `FileExistsError`. Diese Atomarität garantiert das Betriebssystem.

  ```python run
  import contextlib
  import os

  class LaeuftSchon(Exception):
      pass

  @contextlib.contextmanager
  def sperre(pfad):
      art = (os.O_CREAT | os.O_EXCL
             | os.O_WRONLY)
      try:
          fd = os.open(pfad, art)
      except FileExistsError:
          raise LaeuftSchon(
              pfad) from None
      try:
          pid = str(os.getpid())
          os.write(fd, pid.encode())
          os.close(fd)
          yield
      finally:
          os.remove(pfad)

  with sperre("job.lock"):
      try:
          with sperre("job.lock"):
              pass
      except LaeuftSchon:
          print("abgelehnt")
  print(os.path.exists("job.lock"))
  ```

  Achte darauf, wo `finally` steht. Gelöscht wird nur eine Sperre, die dieser Aufruf selbst angelegt hat. Löschte auch der abgelehnte Start die Datei, gäbe er die Sperre des laufenden Jobs frei, und der dritte Start liefe parallel.

  Das Lockfile hat eine Schwäche: Stirbt der Prozess durch `kill -9` oder einen Stromausfall, läuft `finally` nie, und die Datei bleibt liegen. Jeder weitere Start wird abgelehnt, bis jemand sie löscht. Auf Linux ist [`fcntl.flock`](https://docs.python.org/3/library/fcntl.html#fcntl.flock) deshalb oft besser: Den Lock hält der Kernel an der geöffneten Datei, und er verschwindet mit dem Prozess, egal wie dieser endet. Mit `LOCK_NB` wartet `flock` nicht, sondern wirft sofort `BlockingIOError`. Geöffnet wird mit `"a"`: Der Modus `"w"` würde die Datei leeren, auch wenn ein anderer Prozess den Lock hält und dort etwa seine PID notiert hat.

  ```python
  import fcntl
  import sys

  datei = open(LOCK_PFAD, "a")
  try:
      fcntl.flock(datei,
                  fcntl.LOCK_EX
                  | fcntl.LOCK_NB)
  except BlockingIOError:
      sys.exit("Läuft schon.")
  ```

  Dieses Beispiel läuft nur lokal; im Browser ist `flock` wirkungslos, deshalb üben die Aufgaben das Lockfile. `flock` ist ein beratender Lock: Er schützt nur gegen Prozesse, die ebenfalls `flock` benutzen. Für Shell-Aufrufe gibt es dasselbe als Befehl `flock -n` aus util-linux. Ein systemd-Timer startet einen Dienst, der noch läuft, nicht ein zweites Mal, und `systemctl start` auf einen laufenden Dienst bewirkt ebenfalls nichts. Startet aber jemand das Skript direkt oder über cron, schützt systemd nicht (siehe [Zeitsteuerung](/automation/zeitsteuerung)).

  ## Checkpoint und Wiederaufnahme

  Ein Job verarbeitet 500 Aufträge und stirbt bei Nummer 312. Ohne gespeicherten Fortschritt beginnt er wieder bei 1. Ein **Checkpoint** hält fest, wie weit er gekommen ist. Zwei Fragen entscheiden über seine Qualität: Wann wird er geschrieben, und wie?

  **Wann:** nach der bestätigten Wirkung. Stirbt der Prozess zwischen Wirkung und Checkpoint, macht der nächste Lauf diesen einen Auftrag noch einmal. Das nennt man *at least once*; die Wirkung muss dann idempotent sein. Schreibst du den Checkpoint vorher, geht bei einem Absturz genau dieser Auftrag verloren (*at most once*). Für Arbeit, die nicht verloren gehen darf, ist die erste Reihenfolge richtig.

  **Wie:** atomar. Eine halb geschriebene Checkpoint-Datei ist schlimmer als keine. Schreibe in eine temporäre Datei im selben Verzeichnis und ersetze das Ziel mit [`os.replace`](https://docs.python.org/3/library/os.html#os.replace). Das schützt gegen einen Absturz des Prozesses. Gegen einen Stromausfall braucht es zusätzlich `os.fsync` vor dem Austausch, wie im Modul [Robuste Automatisierung](/automation/robustheit).

  ```python run
  import json
  import os
  from pathlib import Path

  def lies_stand(pfad):
      p = Path(pfad)
      if not p.exists():
          return 0
      return json.loads(
          p.read_text())["erledigt"]

  def schreibe_stand(pfad, n):
      tmp = f"{pfad}.tmp"
      daten = {"erledigt": n}
      text = json.dumps(daten)
      Path(tmp).write_text(text)
      os.replace(tmp, pfad)

  schreibe_stand("stand.json", 3)
  print(lies_stand("stand.json"))
  print(lies_stand("fehlt.json"))
  ```

  Eine kaputte Checkpoint-Datei behandelst du als Fehler. `json.loads` wirft dann `ValueError`, und das soll den Job anhalten. „Konnte nicht lesen, also fange ich von vorn an“ hieße, 312 Aufträge ein zweites Mal auszuführen.

  Den Absturz simulierst du mit einer Wirkung, die beim ersten Aufruf für einen bestimmten Auftrag eine Exception wirft. Danach startest du denselben Lauf noch einmal und prüfst zweierlei: Wo setzt er fort, und wie oft wurde jede Wirkung ausgeführt?

  ## Deduplizierung mit sqlite3

  Ein Poller liest alle zehn Minuten die letzten 50 Ereignisse einer API. Die meisten kennt er schon. Er soll nur neue melden, auch nach einem Neustart. Eine Python-Menge vergisst alles beim Prozessende; eine Datenbank mit Eindeutigkeitsregel nicht. [`sqlite3`](https://docs.python.org/3/library/sqlite3.html) gehört zur Standardbibliothek und läuft auch im Browser.

  ```python run
  import sqlite3

  con = sqlite3.connect(":memory:")
  con.execute(
      "CREATE TABLE gesehen ("
      " quelle TEXT NOT NULL,"
      " quell_id TEXT NOT NULL,"
      " UNIQUE (quelle, quell_id))")
  NEU = ("INSERT OR IGNORE INTO "
         "gesehen VALUES (?, ?)")
  for qid in ["e1", "e2", "e1"]:
      cur = con.execute(
          NEU, ("api", qid))
      print(qid, cur.rowcount)
  ```

  `UNIQUE (quelle, quell_id)` macht die Kombination eindeutig; dieselbe ID aus einer anderen Quelle ist ein anderes Ereignis. [`INSERT OR IGNORE`](https://www.sqlite.org/lang_conflict.html) überspringt Zeilen, die die Regel verletzen würden, statt `IntegrityError` zu werfen. [`cursor.rowcount`](https://docs.python.org/3/library/sqlite3.html#sqlite3.Cursor.rowcount) sagt danach, ob eingefügt wurde: 1 für neu, 0 für bekannt. So entscheidet eine einzige Anweisung „neu oder nicht“, und zwar atomar, auch wenn zwei Prozesse gleichzeitig schreiben.

  `sqlite3` öffnet bei Änderungen implizit eine Transaktion. Erst `con.commit()` macht sie dauerhaft; `with con:` committet am Ende des Blocks oder rollt bei einer Exception zurück. Wer das Commit vergisst, sieht seine Zeilen in derselben Verbindung, aber nach einem Neustart sind sie weg. Und wieder gilt die Reihenfolge: Ist die Wirkung eine E-Mail, speichere zuerst „geplant“ und markiere nach dem Versand „gesendet“, wie bei der Outbox im Modul [Benachrichtigungen](/automation/benachrichtigungen).

  > [!PRAXIS]
  > Teste jeden Fehlerpfad, den dein Runbook erwähnt. Steht dort „bei Absturz neu starten“, gehört ein Test dazu, der zwischen Wirkung und Checkpoint abstürzt und danach die Zahl der Wirkungen zählt.

  ## Häufige Fehler

  - **Echte Zeit im Test.** `time.sleep` macht Tests langsam, und eine echte Uhr lässt sich nicht vorspulen. Uhr und Wartefunktion übergeben.
  - **Retry auf alles.** 400 und 404 werden durch Warten nicht besser, nur langsamer.
  - **Retry-After nur als Zahl.** `int("Sat, 24 Oct …")` wirft mitten im Fehlerpfad.
  - **Prüfen, dann anlegen.** Zwei Prozesse sehen gleichzeitig „frei“. `O_EXCL` oder `flock` benutzen.
  - **Fremde Sperre gelöscht.** `finally` räumt auch auf, wenn das Anlegen gescheitert ist.
  - **Checkpoint vor der Wirkung.** Nach einem Absturz fehlt ein Auftrag, still.
  - **Kaputter Checkpoint heißt Neustart.** Lieber anhalten als alles doppelt ausführen.
  - **Commit vergessen.** Die Deduplizierung vergisst nach dem Neustart alles.

  > [!INTERVIEW]
  > „Wie testest du ein Retry mit Backoff, ohne dass der Test eine Minute dauert?“ Ich übergebe Uhr, Wartefunktion und Zufall als Parameter. Im Test stellt die Wartefunktion eine Fake-Uhr vor, statt zu schlafen. Dann prüfe ich die Liste der Pausen und dass die Funktion vor Ablauf der Deadline aufgibt.

  > [!MERKE]
  > Wirkung zuerst, dann Checkpoint: Ein Absturz wiederholt dann höchstens einen Auftrag, statt einen zu verlieren.

  ## Zusammenfassung

  - Uhr, Wartefunktion und Zufall sind Parameter; die Fake-Wartefunktion stellt die Fake-Uhr vor.
  - Full Jitter wählt die Pause zufällig zwischen null und der exponentiellen Grenze; eine Deadline begrenzt die Gesamtzeit.
  - Wiederholt werden 429 und 502 bis 504, nicht 400, 401, 403 oder 404. Retry-After gibt es als Zahl und als Datum.
  - `O_CREAT | O_EXCL` legt ein Lockfile atomar an; `flock` verschwindet mit dem Prozess.
  - Checkpoints entstehen nach der Wirkung und werden atomar mit `os.replace` geschrieben.
  - `INSERT OR IGNORE` mit `UNIQUE` und `rowcount` entscheidet „neu oder bekannt“ in einer Anweisung; ohne Commit ist nichts gespeichert.
exercises:
- id: welcher-status
  type: choice
  title: Welche Antworten lohnen einen zweiten Versuch?
  prompt: Ein Import liest Daten per GET. Bei welchen Antworten wiederholt er die Anfrage automatisch nach einer Pause?
  options:
  - text: "`429 Too Many Requests`"
    correct: true
    why: Der Dienst bittet um weniger Tempo. Nach der Pause aus Retry-After kann dieselbe Anfrage gelingen.
  - text: "`503 Service Unavailable`"
    correct: true
    why: Der Dienst ist vorübergehend nicht verfügbar. Mit Backoff ist ein späterer Versuch sinnvoll.
  - text: "`400 Bad Request`"
    correct: false
    why: Die Anfrage selbst ist fehlerhaft. Dieselbe Anfrage scheitert beim nächsten Mal genauso.
  - text: "`404 Not Found`"
    correct: false
    why: Die Ressource gibt es nicht. Warten ändert daran nichts.
  - text: "`401 Unauthorized`"
    correct: false
    why: Hier hilft kein Warten, sondern genau eine Token-Erneuerung, und die ist eine eigene Regel.
  explanation: Wiederholt wird, was vorübergehend ist und bei unveränderter Anfrage später gelingen kann. Fehler in
    der Anfrage, fehlende Ressourcen und Rechte werden durch Zeit nicht besser.
  resources:
  - *retryafter
- id: lauf-reihenfolge
  type: order
  title: Ein Lauf, der Abstürze übersteht
  prompt: Bring die Schritte eines Laufs in die richtige Reihenfolge, der überlappende Starts verhindert und nach einem
    Absturz fortsetzt.
  lang: prose
  lines: |-
    Lock atomar anlegen oder abbrechen
    Checkpoint lesen und bei Fehler anhalten
    Nächsten offenen Auftrag ausführen
    Bestätigung der Wirkung prüfen
    Checkpoint atomar schreiben
    Lock freigeben
  explanation: Der Lock kommt zuerst, damit kein zweiter Lauf denselben Checkpoint liest. Der Checkpoint folgt der
    bestätigten Wirkung. So wiederholt ein Absturz höchstens einen Auftrag, statt einen zu verlieren.
  resources:
  - *osopen
- id: jitter-vorhersagen
  type: output
  title: Pausen mit festem Zufall
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    def pause(versuch, zufall):
        grenze = min(8, 2 ** versuch)
        return zufall() * grenze

    halb = lambda: 0.5
    print([pause(v, halb)
           for v in range(5)])
  expected: '[0.5, 1.0, 2.0, 4.0, 4.0]'
  explanation: |
    Die Grenzen sind 1, 2, 4, 8 und wieder 8, weil der Deckel bei 8 liegt. Mit dem festen Zufallswert 0.5 ist jede Pause die halbe Grenze. Im Betrieb liefert `random.random` Werte zwischen 0 und 1, und die Pausen verteilen sich. Der feste Wert macht das Verhalten im Test vorhersagbar.
  resources:
  - *aws
- id: rowcount-vorhersagen
  type: output
  title: Neu oder schon bekannt?
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    import sqlite3
    con = sqlite3.connect(":memory:")
    con.execute("CREATE TABLE g"
                " (id TEXT UNIQUE)")
    NEU = ("INSERT OR IGNORE "
           "INTO g VALUES (?)")
    for i in ["a", "b", "a"]:
        cur = con.execute(NEU, (i,))
        print(i, cur.rowcount)
    alle = "SELECT COUNT(*) FROM g"
    cur = con.execute(alle)
    print(cur.fetchone()[0])
  expected: |-
    a 1
    b 1
    a 0
    2
  explanation: |
    Das zweite `a` verletzt die Eindeutigkeit. `INSERT OR IGNORE` überspringt es ohne Fehler, und `rowcount` ist 0. Die Tabelle enthält deshalb zwei Zeilen. Genau diese 1 oder 0 entscheidet in einem Poller, ob ein Ereignis gemeldet wird.
  resources:
  - *sqlite
- id: absturz-vorhersagen
  type: output
  title: Was passiert nach dem Absturz?
  prompt: |
    Welche Ausgabe erzeugt dieses Programm? `lauf(absturz=3)` simuliert einen Absturz direkt nach der Wirkung für Auftrag 3.
  lang: python
  code: |-
    wirkung = []
    stand = {"bis": 0}

    def lauf(absturz=None):
        start = stand["bis"] + 1
        for nr in range(start, 5):
            wirkung.append(nr)
            if nr == absturz:
                raise RuntimeError(nr)
            stand["bis"] = nr

    try:
        lauf(absturz=3)
    except RuntimeError:
        pass
    lauf()
    print(wirkung)
  expected: '[1, 2, 3, 3, 4]'
  explanation: |
    Der erste Lauf führt 1, 2 und 3 aus und stirbt, bevor `stand` auf 3 steht. Der zweite Lauf beginnt deshalb bei 3, nicht bei 4. Auftrag 3 wirkt zweimal: *at least once*. Darum muss die Wirkung idempotent sein oder einen Schlüssel haben, an dem der Empfänger Duplikate erkennt.
  resources:
  - *osopen
- id: retry-after-lesen
  type: code
  title: Retry-After in beiden Formen
  prompt: |
    Schreibe `wartezeit(status, retry_after, jetzt, standard=5)`.

    - Bei Status 429, 502, 503 oder 504 gibt sie die Wartezeit in Sekunden als `float` zurück, bei allen anderen Status `None` („nicht wiederholen“).
    - `retry_after` ist der Header als String oder `None`. Besteht er nur aus Ziffern, sind das Sekunden. Sonst versuche ihn mit `email.utils.parsedate_to_datetime` als HTTP-Datum zu lesen; die Wartezeit ist dann die Differenz zu `jetzt` (eine `datetime` mit Zeitzone), mindestens 0.
    - Fehlt der Header oder ist er unlesbar, gilt `standard`.
  lang: python
  starter: |-
    from email.utils import (
        parsedate_to_datetime)

    def wartezeit(status, retry_after,
                  jetzt, standard=5):
        if status >= 400:
            return float(retry_after)
        return None
  solution: |-
    from email.utils import (
        parsedate_to_datetime)

    NOCHMAL = {429, 502, 503, 504}

    def bis_datum(text, jetzt):
        d = parsedate_to_datetime(text)
        s = (d - jetzt).total_seconds()
        return max(0.0, s)

    def wartezeit(status, retry_after,
                  jetzt, standard=5):
        if status not in NOCHMAL:
            return None
        if retry_after is None:
            return float(standard)
        text = retry_after.strip()
        ok = text.isascii()
        if ok and text.isdigit():
            return float(text)
        try:
            s = bis_datum(text, jetzt)
        except ValueError:
            s = float(standard)
        return s
  setup: |-
    from datetime import datetime, UTC
    JETZT = datetime(2026, 10, 24, 8, 0, 0, tzinfo=UTC)
  tests:
  - name: Sekunden
    code: |-
      w = wartezeit(429, "120", JETZT)
      assert w == 120.0, w
  - name: HTTP-Datum
    code: |-
      d = "Sat, 24 Oct 2026 08:00:30 GMT"
      w = wartezeit(503, d, JETZT)
      assert w == 30.0, w
  - name: Datum in der Vergangenheit
    code: |-
      d = "Sat, 24 Oct 2026 07:59:00 GMT"
      w = wartezeit(503, d, JETZT)
      assert w == 0.0, w
  - name: Fehlender oder unlesbarer Header
    code: |-
      assert wartezeit(502, None, JETZT) == 5.0
      w = wartezeit(504, "bald", JETZT, 7)
      assert w == 7.0, w
  - name: Nicht wiederholbare Status
    code: |-
      for s in (400, 401, 403, 404, 422):
          w = wartezeit(s, "10", JETZT)
          assert w is None, f"{s}: {w}"
  hints:
  - Prüfe zuerst den Status. Für alles außerhalb von 429, 502, 503 und 504 ist die Antwort `None`.
  - '`"120".isdigit()` ist wahr, `"Sat, 24 Oct …".isdigit()` falsch.'
  - '`parsedate_to_datetime` wirft bei Unsinn `ValueError`. Die Differenz zweier `datetime` hat `.total_seconds()`.'
  explanation: |
    Der Starter wiederholt bei jedem Fehler und stürzt an der Datumsform ab, genau dann, wenn der Dienst ohnehin überlastet ist. Die Lösung trennt zwei Fragen: ob wiederholt wird (Status) und wie lange gewartet wird (Header). Ein Datum in der Vergangenheit ergibt 0, nicht eine negative Pause. Weil `jetzt` ein Parameter ist, prüft der Test das Datum ohne Abhängigkeit von der echten Uhrzeit. `isascii()` schließt Ziffern wie `２` aus, die `isdigit()` sonst akzeptiert.
