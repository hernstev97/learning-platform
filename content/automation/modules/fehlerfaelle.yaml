id: fehlerfaelle
title: Fehlerfälle ausführbar machen
level: 3
minutes: 230
summary: Uhr, Zufall, Absturz und Duplikate im Test gezielt herbeiführen – Deadline mit Jitter, Retry nach Statuscode,
  Lockfile, Checkpoint und Deduplizierung mit sqlite3.
goals:
- Du übergibst Uhr, Wartefunktion und Zufall als Parameter und testest Zeitverhalten ohne echtes Warten.
- Du entscheidest Wiederholungen nach Statuscode und liest Retry-After in Sekunden und als HTTP-Datum.
- Du verhinderst überlappende Läufe mit einem atomar angelegten Lockfile oder flock.
- Du schreibst Checkpoints atomar und setzt nach einem simulierten Absturz an der richtigen Stelle fort.
- Du deduplizierst mit sqlite3 über UNIQUE, INSERT OR IGNORE und rowcount.
