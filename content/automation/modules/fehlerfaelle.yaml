- id: deadline-jitter
  type: code
  title: Wiederholen mit Deadline und Jitter
  prompt: |
    Schreibe `versuche(aktion, uhr, schlafe, zufall, budget)`.

    - `aktion()` liefert einen HTTP-Status. Bei 429, 502, 503 oder 504 wird wiederholt, jeder andere Status wird sofort zurückgegeben.
    - Die Pause vor Wiederholung Nummer `k` (ab 0) ist `zufall() * min(8, 2 ** k)`.
    - Die Deadline ist `uhr() + budget`, gemessen beim Start. Würde die nächste Pause über die Deadline hinausreichen, wirf `TimeoutError`, ohne zu schlafen.
    - `schlafe(sekunden)` wartet. Benutze für Zeit nur `uhr` und `schlafe`.
  lang: python
  starter: |-
    import time

    NOCHMAL = {429, 502, 503, 504}

    def versuche(aktion, uhr, schlafe,
                 zufall, budget):
        ...
  solution: |-
    NOCHMAL = {429, 502, 503, 504}

    def versuche(aktion, uhr, schlafe,
                 zufall, budget):
        ende = uhr() + budget
        k = 0
        while True:
            status = aktion()
            if status not in NOCHMAL:
                return status
            grenze = min(8, 2 ** k)
            pause = zufall() * grenze
            if uhr() + pause > ende:
                raise TimeoutError()
            schlafe(pause)
            k += 1
  setup: |-
    class Uhr:
        def __init__(self, t=1000.0):
            self.t = t
            self.pausen = []
        def __call__(self):
            return self.t
        def schlafe(self, s):
            self.pausen.append(s)
            self.t += s

    def folge(*werte):
        """Liefert die Status nacheinander; danach immer den letzten."""
        rest = list(werte)
        def aktion():
            return rest.pop(0) if len(rest) > 1 else rest[0]
        return aktion
  tests:
  - name: Erfolg ohne Pause
    code: |-
      u = Uhr()
      s = versuche(folge(200), u,
          u.schlafe, lambda: 0.5, 10)
      assert s == 200 and u.pausen == []
  - name: Zweimal 503, dann Erfolg
    code: |-
      u = Uhr()
      s = versuche(folge(503, 503, 200),
          u, u.schlafe, lambda: 0.5, 10)
      assert s == 200, s
      assert u.pausen == [0.5, 1.0], (
          u.pausen)
  - name: Jitter kommt aus zufall
    code: |-
      u = Uhr()
      versuche(folge(429, 429, 200), u,
          u.schlafe, lambda: 0.25, 10)
      assert u.pausen == [0.25, 0.5], (
          u.pausen)
  - name: Deadline – aufgeben statt schlafen
    code: |-
      u = Uhr()
      try:
          versuche(folge(503), u,
              u.schlafe, lambda: 1.0, 5)
      except TimeoutError:
          pass
      else:
          assert False, "TimeoutError erwartet"
      assert u.pausen == [1.0, 2.0], (
          f"Pausen: {u.pausen}")
      assert u.t <= 1005, "über die Deadline"
  - name: 400 wird nicht wiederholt
    code: |-
      u = Uhr()
      s = versuche(folge(400, 200), u,
          u.schlafe, lambda: 0.5, 10)
      assert s == 400 and u.pausen == []
  hints:
  - Merke dir die Deadline einmal am Anfang. Danach fragst du vor jeder Pause `uhr()`.
  - Prüfe die Deadline vor `schlafe`, nicht danach.
  - 'Mit `lambda: 1.0` sind die Pausen 1, 2 und 4. Bei Budget 5 passt die dritte nicht mehr.'
  explanation: |
    Die Funktion kennt keine echte Zeit. Deshalb kann der Test einen Ausfall von Minuten in Millisekunden nachspielen und genau nachzählen, welche Pausen entstanden. Die Deadline wird vor der Pause geprüft: Ein Job, der weiß, dass er es nicht mehr schafft, gibt sofort auf und lässt dem nächsten Lauf die Arbeit. Jitter steckt nur im Faktor `zufall()`; mit `random.random` streuen die Pausen im Betrieb, im Test sind sie fest.
  resources:
  - *aws
  - *zeit
- id: lockfile
  type: code
  title: Repariere das Lockfile
  prompt: |
    `sperre(pfad)` soll verhindern, dass zwei Läufe gleichzeitig arbeiten. Die jetzige Fassung hat zwei Fehler: Zwischen Prüfen und Anlegen kann ein zweiter Prozess dazwischenkommen, und ein abgelehnter Start löscht die Sperre des laufenden Jobs. Repariere sie:

    - Lege die Datei mit `os.open` und `os.O_CREAT | os.O_EXCL | os.O_WRONLY` an und schreibe die eigene PID hinein.
    - Existiert sie schon, wirf `LaeuftSchon` und lass die vorhandene Datei unverändert.
    - Nach dem `with`-Block, auch nach einer Exception darin, löschst du die Datei, aber nur, wenn dieser Aufruf sie angelegt hat.
  lang: python
  starter: |-
    import contextlib
    import os
    from pathlib import Path

    class LaeuftSchon(Exception):
        pass

    @contextlib.contextmanager
    def sperre(pfad):
        try:
            if os.path.exists(pfad):
                raise LaeuftSchon(pfad)
            Path(pfad).write_text(
                str(os.getpid()))
            yield
        finally:
            os.remove(pfad)
  solution: |-
    import contextlib
    import os

    class LaeuftSchon(Exception):
        pass

    @contextlib.contextmanager
    def sperre(pfad):
        art = (os.O_CREAT | os.O_EXCL
               | os.O_WRONLY)
        try:
            fd = os.open(pfad, art)
        except FileExistsError:
            raise LaeuftSchon(
                pfad) from None
        try:
            pid = str(os.getpid())
            os.write(fd, pid.encode())
            os.close(fd)
            yield
        finally:
            os.remove(pfad)
  setup: |-
    import contextlib
    import os
    import pathlib

    @contextlib.contextmanager
    def wettlauf():
        """Simuliert einen zweiten Prozess: Prüfungen auf Existenz sehen „frei“."""
        alt_os, alt_path = os.path.exists, pathlib.Path.exists
        os.path.exists = lambda *a, **k: False
        pathlib.Path.exists = lambda *a, **k: False
        try:
            yield
        finally:
            os.path.exists, pathlib.Path.exists = alt_os, alt_path
  tests:
  - name: Sperre enthält die PID und verschwindet
    code: |-
      from pathlib import Path
      with sperre("a.lock"):
          inhalt = Path("a.lock").read_text()
          assert inhalt == str(os.getpid())
      assert not Path("a.lock").exists()
  - name: Zweiter Start wird abgelehnt
    code: |-
      from pathlib import Path
      with sperre("b.lock"):
          try:
              with sperre("b.lock"):
                  pass
          except LaeuftSchon:
              pass
          else:
              assert False, "LaeuftSchon"
          assert Path("b.lock").exists(), (
              "Die laufende Sperre ist weg.")
  - name: Fremde Sperre bleibt unangetastet
    code: |-
      from pathlib import Path
      Path("c.lock").write_text("12345")
      try:
          with sperre("c.lock"):
              pass
      except LaeuftSchon:
          pass
      text = Path("c.lock").read_text()
      assert text == "12345", (
          f"Sperre verändert: {text!r}")
  - name: Atomar, auch im Wettlauf
    code: |-
      from pathlib import Path
      Path("d.lock").write_text("12345")
      with wettlauf():
          try:
              with sperre("d.lock"):
                  pass
          except LaeuftSchon:
              pass
      text = Path("d.lock").read_text()
      assert text == "12345", (
          "Ohne O_EXCL überschrieben")
  - name: Exception im Block gibt frei
    code: |-
      from pathlib import Path
      try:
          with sperre("e.lock"):
              raise KeyError("Absturz")
      except KeyError:
          pass
      assert not Path("e.lock").exists()
  hints:
  - '`os.open(pfad, os.O_CREAT | os.O_EXCL | os.O_WRONLY)` wirft `FileExistsError`, wenn es die Datei schon gibt.'
  - Das `try … finally`, das löscht, beginnt erst, nachdem das Anlegen geklappt hat.
  - '`os.write` erwartet Bytes: `str(os.getpid()).encode()`.'
  explanation: |
    `O_EXCL` lässt das Betriebssystem Prüfen und Anlegen in einem Schritt erledigen; zwischen beiden kann kein anderer Prozess mehr dazwischenkommen. Der Test „Wettlauf“ spielt genau diese Lücke nach, indem jede Existenzprüfung „frei“ meldet. Das zweite Problem steckt in der Position von `finally`: Es darf nur aufräumen, was dieser Aufruf besitzt. Bleibt nach `kill -9` eine Datei liegen, entfernt sie ein Mensch nach Prüfung der PID, oder du nimmst gleich `flock`.
  resources:
  - *osopen
  - title: Python · contextlib.contextmanager
    url: https://docs.python.org/3/library/contextlib.html#contextlib.contextmanager
- id: checkpoint
  type: code
  title: Nach dem Absturz fortsetzen
  prompt: |
    Schreibe `verarbeite(auftraege, anwenden, pfad)`.

    - `auftraege` ist eine Liste von IDs in fester Reihenfolge. Unter `pfad` liegt der Checkpoint als JSON `{"erledigt": n}`: die Zahl der Aufträge vom Anfang der Liste, die schon erledigt sind. Fehlt die Datei, ist `n` gleich 0.
    - Rufe `anwenden(id)` für jeden noch offenen Auftrag auf und schreibe **danach** den neuen Checkpoint, atomar über eine temporäre Datei und `os.replace`.
    - Wirft `anwenden`, lass die Exception durch; der Checkpoint steht dann beim letzten erledigten Auftrag.
    - Ist die Datei kein gültiges JSON, wirf `ValueError`, bevor irgendein Auftrag läuft.
    - Gib die Zahl der in diesem Lauf erledigten Aufträge zurück.
  lang: python
  starter: |-
    import json
    import os
    from pathlib import Path

    def verarbeite(auftraege, anwenden,
                   pfad):
        ...
  solution: |-
    import json
    import os
    from pathlib import Path

    def lies(pfad):
        p = Path(pfad)
        if not p.exists():
            return 0
        text = p.read_text()
        daten = json.loads(text)
        return daten["erledigt"]

    def schreibe(pfad, n):
        tmp = f"{pfad}.tmp"
        daten = {"erledigt": n}
        text = json.dumps(daten)
        Path(tmp).write_text(text)
        os.replace(tmp, pfad)

    def verarbeite(auftraege, anwenden,
                   pfad):
        start = lies(pfad)
        offen = auftraege[start:]
        for i, auftrag in enumerate(
                offen, start + 1):
            anwenden(auftrag)
            schreibe(pfad, i)
        return len(offen)
  setup: |-
    import json
    import os

    class Absturz(Exception):
        pass

    class Wirkung:
        """Merkt sich jede Wirkung; stürzt beim ersten Aufruf für `bei` ab."""
        def __init__(self, bei=None):
            self.bei = bei
            self.liste = []
        def __call__(self, auftrag):
            self.liste.append(auftrag)
            if auftrag == self.bei:
                self.bei = None
                raise Absturz(auftrag)

    def stand(pfad):
        with open(pfad, encoding="utf-8") as f:
            return json.load(f)["erledigt"]
  tests:
  - name: Erster Lauf erledigt alles
    code: |-
      w = Wirkung()
      n = verarbeite(list("abcd"), w, "s1")
      assert n == 4 and w.liste == list("abcd")
      assert stand("s1") == 4, stand("s1")
  - name: Absturz bei c – Checkpoint steht auf 2
    code: |-
      w = Wirkung(bei="c")
      try:
          verarbeite(list("abcd"), w, "s2")
      except Absturz:
          pass
      else:
          assert False, "Absturz verschluckt"
      assert stand("s2") == 2, stand("s2")
  - name: Zweiter Lauf setzt bei c fort
    code: |-
      w = Wirkung(bei="c")
      try:
          verarbeite(list("abcd"), w, "s3")
      except Absturz:
          pass
      n = verarbeite(list("abcd"), w, "s3")
      assert n == 2, n
      assert w.liste == list("abccd"), (
          w.liste)
  - name: Checkpoint über os.replace
    code: |-
      ersetzt, alt = [], os.replace
      def zaehle(a, b):
          ersetzt.append(b)
          alt(a, b)
      os.replace = zaehle
      try:
          verarbeite(list("ab"), Wirkung(),
                     "s4")
      finally:
          os.replace = alt
      assert len(ersetzt) >= 2, ersetzt
  - name: Kaputter Checkpoint hält an
    code: |-
      with open("s5", "w") as f:
          f.write("{kaputt")
      w = Wirkung()
      try:
          verarbeite(list("ab"), w, "s5")
      except ValueError:
          pass
      else:
          assert False, "ValueError erwartet"
      assert w.liste == [], w.liste
  hints:
  - Lies den Stand vor der Schleife. `json.loads` wirft bei kaputtem Inhalt schon `ValueError` (`JSONDecodeError` ist eine Unterklasse).
  - '`auftraege[start:]` sind die offenen Aufträge.'
  - Schreibe in `pfad + ".tmp"` und ersetze danach mit `os.replace`.
  explanation: |
    Der Checkpoint folgt der Wirkung. Stirbt der Lauf bei `c`, steht er auf 2, und der nächste Lauf beginnt bei `c`: Diese eine Wirkung läuft doppelt, keine fehlt. Der Test zählt das ausdrücklich nach. `os.replace` sorgt dafür, dass ein Absturz des Prozesses während des Schreibens den alten Checkpoint stehen lässt, statt eine halbe Datei zu hinterlassen; gegen Stromausfall käme `os.fsync` dazu. Eine kaputte Datei hält den Job an; ein stiller Neustart bei 0 würde alles doppelt ausführen.
  resources:
  - title: Python · os.replace
    url: https://docs.python.org/3/library/os.html#os.replace
  - title: Python · json.JSONDecodeError
    url: https://docs.python.org/3/library/json.html#json.JSONDecodeError
- id: dedup-sqlite
  type: code
  title: Nur neue Ereignisse melden
  prompt: |
    Schreibe `neue(con, quelle, ids)`. In der Datenbank `con` gibt es die Tabelle `gesehen (quelle TEXT, quell_id TEXT, UNIQUE (quelle, quell_id))`. Füge jede ID aus `ids` mit `INSERT OR IGNORE` ein und gib die Liste der IDs zurück, die wirklich neu eingefügt wurden, in der Reihenfolge von `ids`. Mache die Änderungen dauerhaft, bevor die Funktion zurückkehrt.
  lang: python
  starter: |-
    import sqlite3

    def neue(con, quelle, ids):
        bekannt = set()
        ergebnis = []
        for i in ids:
            if i not in bekannt:
                bekannt.add(i)
                ergebnis.append(i)
        return ergebnis
  solution: |-
    import sqlite3

    NEU = ("INSERT OR IGNORE INTO "
           "gesehen VALUES (?, ?)")

    def neue(con, quelle, ids):
        ergebnis = []
        with con:
            for i in ids:
                cur = con.execute(
                    NEU, (quelle, i))
                if cur.rowcount == 1:
                    ergebnis.append(i)
        return ergebnis
  setup: |-
    import sqlite3

    def datenbank(name):
        con = sqlite3.connect(name)
        con.execute(
            "CREATE TABLE gesehen (quelle TEXT NOT NULL, quell_id TEXT NOT NULL, UNIQUE (quelle, quell_id))")
        con.commit()
        return con
  tests:
  - name: Erster Abruf – alles neu
    code: |-
      con = datenbank("a.db")
      r = neue(con, "api", ["e1", "e2"])
      assert r == ["e1", "e2"], r
  - name: Zweiter Abruf – nur Neues
    code: |-
      con = datenbank("b.db")
      neue(con, "api", ["e1", "e2"])
      r = neue(con, "api", ["e2", "e3"])
      assert r == ["e3"], r
  - name: Duplikat im selben Abruf zählt einmal
    code: |-
      con = datenbank("c.db")
      r = neue(con, "api", ["e1", "e1"])
      assert r == ["e1"], r
  - name: Gleiche ID, andere Quelle ist neu
    code: |-
      con = datenbank("d.db")
      neue(con, "api", ["e1"])
      r = neue(con, "rss", ["e1"])
      assert r == ["e1"], r
  - name: Übersteht einen Neustart
    code: |-
      con = datenbank("e.db")
      neue(con, "api", ["e1"])
      neu = sqlite3.connect("e.db")
      r = neue(neu, "api", ["e1", "e2"])
      assert r == ["e2"], (
          f"{r} – Commit vergessen?")
  hints:
  - '`con.execute(...)` liefert einen Cursor; `cursor.rowcount` ist 1, wenn eingefügt wurde, und 0, wenn die Zeile ignoriert wurde.'
  - '`with con:` committet am Ende des Blocks.'
  explanation: |
    Der Starter dedupliziert nur im Speicher und nur innerhalb eines Aufrufs; nach einem Neustart ist alles wieder „neu“. Die Datenbank entscheidet dagegen mit der Eindeutigkeitsregel, und `rowcount` meldet das Ergebnis jeder einzelnen Anweisung. Weil die Prüfung in der Datenbank passiert, ist sie auch dann richtig, wenn zwei Prozesse gleichzeitig einfügen. Ohne Commit sieht eine zweite Verbindung die Zeilen nicht, genau wie ein Neustart.
  resources:
  - *sqlite
  - title: SQLite · ON CONFLICT
    url: https://www.sqlite.org/lang_conflict.html
- id: checkpoint-zu-frueh
  type: bug
  title: Nach dem Absturz fehlt ein Auftrag
  prompt: |
    Nach einem Absturz in `anwenden` setzt der Job beim nächsten Start fort, aber genau der Auftrag, bei dem er abgestürzt ist, wird nie ausgeführt. Finde die fehlerhaften Zeilen und korrigiere sie.
  lang: python
  code: |-
    def lauf(jobs, stand, anwenden):
        start = stand.lesen()
        for nr in range(start,
                        len(jobs)):
            stand.schreiben(nr + 1)
            anwenden(jobs[nr])
  lines:
  - 5
  - 6
  fix:
  - line: 5
    answers:
    - anwenden(jobs[nr])
  - line: 6
    answers:
    - stand.schreiben(nr + 1)
  explanation: |
    Der Checkpoint steht vor der Wirkung. Stirbt der Prozess in `anwenden`, gilt der Auftrag schon als erledigt, und der nächste Lauf überspringt ihn: *at most once*. Mit der Wirkung zuerst wiederholt ein Absturz höchstens diesen einen Auftrag. Das ist für Arbeit, die nicht verloren gehen darf, die richtige Reihenfolge; die Wirkung muss dafür idempotent sein.
  resources:
  - *osopen
- id: flock-erklaeren
  type: explain
  title: Warum verschwindet dieser Lock von selbst?
  prompt: Erkläre, was diese Zeilen tun und warum nach einem `kill -9` kein verwaister Lock zurückbleibt. Nenne auch
    eine Grenze.
  lang: python
  code: |-
    datei = open(LOCK_PFAD, "a")
    try:
        fcntl.flock(datei,
                    fcntl.LOCK_EX
                    | fcntl.LOCK_NB)
    except BlockingIOError:
        sys.exit("Läuft schon.")
  points:
  - LOCK_EX fordert einen exklusiven Lock auf der geöffneten Datei an.
  - Mit LOCK_NB wartet der Aufruf nicht, sondern wirft sofort BlockingIOError, wenn ein anderer Prozess den Lock hält.
  - Der Kernel hält den Lock an der offenen Datei und gibt ihn frei, wenn der Prozess endet, auch durch kill -9.
  - Ob die Datei existiert, spielt keine Rolle; sie muss nicht gelöscht werden.
  - flock ist beratend und schützt nur gegen Prozesse, die ebenfalls flock auf dieselbe Datei benutzen.
  explanation: |
    Anders als beim Lockfile mit `O_EXCL` ist hier nicht die Existenz der Datei der Lock, sondern ein Zustand im Kernel, der an der geöffneten Datei hängt. Endet der Prozess, schließt der Kernel alle seine Dateien und gibt damit auch den Lock frei. Deshalb gibt es keinen verwaisten Lock nach einem Absturz. Die Grenze: `flock` ist beratend. Ein Programm, das die Datei ohne `flock` öffnet und schreibt, wird nicht aufgehalten, und über Netzwerkdateisysteme hinweg verhält sich `flock` je nach System anders.
  resources:
  - title: Python · fcntl.flock
    url: https://docs.python.org/3/library/fcntl.html#fcntl.flock
  - title: man 2 flock
    url: https://man7.org/linux/man-pages/man2/flock.2.html
- id: fehlerplan
  type: practice
  title: Ein Fehlerplan für deinen Job
  prompt: |
    Nimm einen Automationsjob, den du gebaut hast oder bauen willst, zum Beispiel den Wochenbericht aus den Projekten. Schreibe für vier Fehlerfälle je zwei Sätze: Was passiert im Betrieb, welcher Fake oder Parameter löst den Fall im Test aus, und was erwartet der Test? Ein Fall betrifft die Zeit, einer einen Absturz zwischen Wirkung und Checkpoint.
  lang: prose
  checklist:
  - Jeder Fall nennt den Parameter oder Fake, der ihn auslöst (Uhr, Wartefunktion, Zufall, Fake-API, Absturzpunkt).
  - Ein Fall prüft eine Deadline oder ein Retry-After, ohne echt zu warten.
  - Ein Fall stürzt zwischen Wirkung und Checkpoint ab und zählt danach die Wirkungen.
  - Jede Erwartung ist beobachtbar, zum Beispiel eine Liste von Pausen, ein Exception-Typ oder eine Zahl.
  - Mindestens ein Fall endet bewusst mit einem Abbruch statt mit einem weiteren Versuch.
  explanation: Ein Fehlerplan macht aus „sollte robust sein“ eine Liste von Tests. Die Checkliste prüft nur, ob jeder
    Fall auslösbar und beobachtbar ist; welche Fälle für deinen Job zählen, entscheidest du.
  resources:
  - *zeit
