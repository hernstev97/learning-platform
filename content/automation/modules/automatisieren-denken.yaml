  - id: amortisation-berechnen
    type: code
    title: Ab wann zahlt sich das Skript aus?
    prompt: |
      Schreibe `amortisation_monate(minuten_pro_lauf, laeufe_pro_monat, bau_stunden, wartung_stunden_pro_jahr)`. Sie gibt zurück, nach wie vielen **ganzen Monaten** die gesparte Zeit die Bauzeit plus die bis dahin angefallene Wartung mindestens ausgleicht.

      - Ersparnis pro Monat: `minuten_pro_lauf * laeufe_pro_monat` Minuten.
      - Wartung pro Monat: ein Zwölftel der Wartung pro Jahr.
      - Ist die Ersparnis pro Monat nicht größer als die Wartung pro Monat, zahlt sich das Skript nie aus: Gib `None` zurück.
      - Kostet der Bau nichts, ist das Ergebnis `0`.

      Tipp: Rechne alles in Minuten, dann bleiben die Beispielwerte ganzzahlig.
    lang: python
    starter: |
      def amortisation_monate(minuten_pro_lauf: int, laeufe_pro_monat: int,
                              bau_stunden: float, wartung_stunden_pro_jahr: float) -> int | None:
          ...
    solution: |
      import math

      def amortisation_monate(minuten_pro_lauf: int, laeufe_pro_monat: int,
                              bau_stunden: float, wartung_stunden_pro_jahr: float) -> int | None:
          ersparnis = minuten_pro_lauf * laeufe_pro_monat          # Minuten pro Monat
          wartung = wartung_stunden_pro_jahr * 60 / 12              # Minuten pro Monat
          netto = ersparnis - wartung
          if netto <= 0:
              return None
          return math.ceil(bau_stunden * 60 / netto)
    tests:
      - name: Ohne Wartung
        code: |
          ergebnis = amortisation_monate(8, 4, 4, 0)
          assert ergebnis == 8, f"32 Minuten pro Monat, 240 Minuten Bauzeit: erwartet 8, bekommen {ergebnis!r}"
      - name: Genau aufgehend
        code: |
          ergebnis = amortisation_monate(15, 4, 2, 0)
          assert ergebnis == 2, f"60 Minuten pro Monat, 120 Minuten Bauzeit: erwartet 2, bekommen {ergebnis!r}"
      - name: Wartung frisst fast alles
        code: |
          ergebnis = amortisation_monate(8, 4, 4, 6)
          assert ergebnis == 120, f"netto 2 Minuten pro Monat: erwartet 120, bekommen {ergebnis!r}"
      - name: Wartung frisst alles
        code: |
          assert amortisation_monate(5, 12, 1, 12) is None, "60 Minuten Ersparnis und 60 Minuten Wartung pro Monat: nie"
          assert amortisation_monate(2, 4, 4, 12) is None, "Wartung größer als Ersparnis: nie"
      - name: Kein Bauaufwand
        code: |
          ergebnis = amortisation_monate(10, 1, 0, 0)
          assert ergebnis == 0, f"erwartet 0, bekommen {ergebnis!r}"
    hints:
      - "Netto-Ersparnis pro Monat = Ersparnis − Wartung. Ist sie `<= 0`, gib `None` zurück."
      - "Gesucht ist die kleinste ganze Zahl `n` mit `n * netto >= bau_minuten` – das ist Aufrunden."
      - "`math.ceil(bau_stunden * 60 / netto)`"
    explanation: |
      Die Bedingung `n × Ersparnis ≥ Bau + n × Wartung` lässt sich zu `n ≥ Bau / (Ersparnis − Wartung)` umstellen – vorausgesetzt, die Differenz ist positiv. Ist sie es nicht, holt die Ersparnis die Wartung nie ein, egal wie lange das Skript läuft. `math.ceil` rundet auf, weil ein angebrochener Monat noch nicht reicht. Die Rechnung zeigt, warum Wartung zählt: Sechs Stunden Wartung pro Jahr machen aus acht Monaten zehn Jahre.
    resources:
      - title: math.ceil
        url: https://docs.python.org/3/library/math.html#math.ceil

  - id: zeile-sicherstellen
    type: code
    title: Eine Zeile genau einmal
    prompt: |
      Schreibe die idempotente Funktion `stelle_zeile_sicher(pfad, zeile)`:

      - Steht `zeile` bereits als **ganze Zeile** in der Datei, ändert sie nichts und gibt `False` zurück.
      - Sonst hängt sie `zeile` mit Zeilenumbruch an und gibt `True` zurück.
      - Endet die Datei nicht mit einem Zeilenumbruch, wird vorher einer ergänzt – sonst klebt die neue Zeile an der letzten.
      - Existiert die Datei nicht, wird sie angelegt.

      Im Arbeitsverzeichnis liegen `gitignore-a` (endet mit Zeilenumbruch) und `gitignore-b` (ohne abschließenden Zeilenumbruch).
    lang: python
    setup: |
      from pathlib import Path
      Path("gitignore-a").write_text("node_modules/\n.env\n", encoding="utf-8")
      Path("gitignore-b").write_text("dist/\n.venv", encoding="utf-8")
    starter: |
      from pathlib import Path

      def stelle_zeile_sicher(pfad: Path, zeile: str) -> bool:
          with pfad.open("a", encoding="utf-8") as datei:
              datei.write(zeile + "\n")
          return True
    solution: |
      from pathlib import Path

      def stelle_zeile_sicher(pfad: Path, zeile: str) -> bool:
          text = pfad.read_text(encoding="utf-8") if pfad.exists() else ""
          if zeile in text.splitlines():
              return False
          if text and not text.endswith("\n"):
              text += "\n"
          pfad.write_text(text + zeile + "\n", encoding="utf-8")
          return True
    tests:
      - name: Neue Zeile wird angehängt
        code: |
          p = Path("gitignore-a")
          assert stelle_zeile_sicher(p, "*.log") is True, "Die Zeile fehlte – erwartet True"
          inhalt = p.read_text(encoding="utf-8")
          assert inhalt == "node_modules/\n.env\n*.log\n", f"Inhalt: {inhalt!r}"
      - name: Zweiter Aufruf ändert nichts
        code: |
          p = Path("gitignore-a")
          assert stelle_zeile_sicher(p, "*.log") is False, "Die Zeile ist schon da – erwartet False"
          inhalt = p.read_text(encoding="utf-8")
          assert inhalt == "node_modules/\n.env\n*.log\n", f"Datei wurde verändert: {inhalt!r}"
      - name: Teiltreffer zählt nicht
        code: |
          p = Path("gitignore-a")
          assert stelle_zeile_sicher(p, "node") is True, "„node“ ist keine ganze Zeile der Datei – erwartet True"
          assert p.read_text(encoding="utf-8").splitlines()[-1] == "node"
      - name: Fehlender Zeilenumbruch am Ende
        code: |
          p = Path("gitignore-b")
          assert stelle_zeile_sicher(p, "*.pyc") is True
          inhalt = p.read_text(encoding="utf-8")
          assert inhalt == "dist/\n.venv\n*.pyc\n", f"Inhalt: {inhalt!r}"
          assert stelle_zeile_sicher(p, ".venv") is False, "„.venv“ steht schon in der Datei"
      - name: Datei fehlt noch
        code: |
          p = Path("neu.txt")
          assert stelle_zeile_sicher(p, "a=1") is True
          assert stelle_zeile_sicher(p, "a=1") is False
          inhalt = p.read_text(encoding="utf-8")
          assert inhalt == "a=1\n", f"Inhalt: {inhalt!r}"
    hints:
      - "Lies den Text (oder `\"\"`, wenn die Datei fehlt) und vergleiche mit `text.splitlines()` – nicht mit `in text`."
      - "Fehlt am Ende ein `\\n`, ergänze ihn, bevor du die neue Zeile anhängst."
      - "Am einfachsten schreibst du am Ende den ganzen Text neu: `pfad.write_text(text + zeile + \"\\n\", encoding=\"utf-8\")`."
    explanation: |
      Idempotenz entsteht durch die Prüfung des Zielzustands vor der Aktion. Der Vergleich mit `splitlines()` prüft ganze Zeilen; `zeile in text` wäre ein Teilstring-Vergleich und hielte `node` für vorhanden, weil `node_modules/` in der Datei steht. Der fehlende Zeilenumbruch am Dateiende ist ein echter Klassiker – viele Editoren speichern so, und naives Anhängen erzeugt dann `.venv*.pyc`. Der Rückgabewert macht das Ergebnis für Logs sichtbar („geändert“ oder „unverändert“).
    resources:
      - title: str.splitlines
        url: https://docs.python.org/3/library/stdtypes.html#str.splitlines
      - title: pathlib.Path.read_text
        url: https://docs.python.org/3/library/pathlib.html#pathlib.Path.read_text

  - id: archiv-plan
    type: code
    title: Ein Plan für alte Logdateien
    prompt: |
      Schreibe `plane_archivierung(ordner, jetzt, max_tage)`, die **nur plant** und nichts verändert. Sie gibt eine nach Quelle sortierte Liste von Tupeln `(quelle, ziel)` zurück:

      - Berücksichtigt werden nur **Dateien** direkt in `ordner` (keine Unterordner), deren Änderungszeit (`st_mtime`) **mehr als** `max_tage` Tage vor `jetzt` liegt. `jetzt` ist ein Unix-Zeitstempel in Sekunden, ein Tag hat 86 400 Sekunden.
      - Das Ziel ist `ordner / "archiv" / dateiname`.
      - Existiert das Ziel schon, wird die Datei übersprungen – nichts überschreiben.

      Im Arbeitsverzeichnis liegt `logs/` mit mehreren Dateien, einem Unterordner und `logs/archiv/`. In den Tests stehen `JETZT` und `TAG` zur Verfügung.
    lang: python
    setup: |
      import os
      from pathlib import Path

      JETZT = 1_800_000_000
      TAG = 86_400
      logs = Path("logs")
      (logs / "archiv").mkdir(parents=True)
      (logs / "archiv" / "app-00.log").write_text("alt\n", encoding="utf-8")
      for name, alter in [("app-00.log", 50), ("app-01.log", 40), ("app-02.log", 31), ("app-03.log", 30), ("app-04.log", 2)]:
          datei = logs / name
          datei.write_text(f"{name}\n", encoding="utf-8")
          os.utime(datei, (JETZT - alter * TAG, JETZT - alter * TAG))
      (logs / "2025").mkdir()
      os.utime(logs / "2025", (JETZT - 400 * TAG, JETZT - 400 * TAG))
    starter: |
      from pathlib import Path

      def plane_archivierung(ordner: Path, jetzt: float, max_tage: int) -> list[tuple[Path, Path]]:
          plan = []
          for datei in ordner.iterdir():
              ...
          return plan
    solution: |
      from pathlib import Path

      def plane_archivierung(ordner: Path, jetzt: float, max_tage: int) -> list[tuple[Path, Path]]:
          grenze = jetzt - max_tage * 86_400
          plan = []
          for datei in sorted(ordner.iterdir()):
              if not datei.is_file():
                  continue
              if datei.stat().st_mtime >= grenze:
                  continue
              ziel = ordner / "archiv" / datei.name
              if ziel.exists():
                  continue
              plan.append((datei, ziel))
          return plan
    tests:
      - name: Älter als 30 Tage
        code: |
          logs = Path("logs")
          plan = plane_archivierung(logs, JETZT, 30)
          erwartet = [
              (logs / "app-01.log", logs / "archiv" / "app-01.log"),
              (logs / "app-02.log", logs / "archiv" / "app-02.log"),
          ]
          assert plan == erwartet, f"bekommen {plan!r}"
      - name: Genau 30 Tage alt ist nicht „älter als“
        code: |
          plan = plane_archivierung(Path("logs"), JETZT, 30)
          assert all(q.name != "app-03.log" for q, _ in plan), "app-03.log ist genau 30 Tage alt, nicht älter"
      - name: Ordner und belegte Ziele werden übersprungen
        code: |
          plan = plane_archivierung(Path("logs"), JETZT, 1)
          namen = [q.name for q, _ in plan]
          assert "2025" not in namen and "archiv" not in namen, f"Ordner im Plan: {namen}"
          assert "app-00.log" not in namen, "archiv/app-00.log existiert schon – nicht überschreiben"
          assert namen == ["app-01.log", "app-02.log", "app-03.log", "app-04.log"], f"bekommen {namen}"
      - name: Planen verändert nichts
        code: |
          plane_archivierung(Path("logs"), JETZT, 1)
          vorhanden = sorted(p.name for p in Path("logs").iterdir())
          assert vorhanden == ["2025", "app-00.log", "app-01.log", "app-02.log", "app-03.log", "app-04.log", "archiv"], f"logs/ enthält jetzt {vorhanden}"
          assert [p.name for p in Path("logs/archiv").iterdir()] == ["app-00.log"]
    hints:
      - "Die Grenze ist `jetzt - max_tage * 86_400`. „Älter als“ heißt: `st_mtime` liegt **vor** der Grenze."
      - "`iterdir()` liefert keine feste Reihenfolge – iteriere über `sorted(ordner.iterdir())`."
      - "Überspringe mit `continue`, wenn `not datei.is_file()` oder `ziel.exists()`."
    explanation: |
      Die Funktion ist der Planungsteil des Musters „planen, dann ausführen“: Sie liest nur (`iterdir`, `stat`, `exists`) und schreibt nichts. Deshalb kann ein Trockenlauf den Plan ausgeben, und ein Test kann ihn prüfen, ohne dass Dateien wandern. `jetzt` als Parameter statt `time.time()` macht die Funktion deterministisch testbar. `sorted` ist nötig, weil `iterdir` keine Reihenfolge garantiert. Belegte Ziele zu überspringen macht den späteren Lauf idempotent: Ein zweiter Durchgang findet nichts mehr.
    resources:
      - title: pathlib.Path.iterdir
        url: https://docs.python.org/3/library/pathlib.html#pathlib.Path.iterdir
      - title: os.stat_result.st_mtime
        url: https://docs.python.org/3/library/os.html#os.stat_result.st_mtime

  - id: apply-immer-an
    type: bug
    title: Der Trockenlauf, der keiner ist
    prompt: |
      Ohne `--apply` soll das Skript nur anzeigen, was es verschieben würde. Tatsächlich verschiebt es bei **jedem** Aufruf die Dateien, auch bei `./aufraeumen.py ~/Downloads`. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      def main(argv: list[str] | None = None) -> int:
          parser = argparse.ArgumentParser(prog="aufraeumen")
          parser.add_argument("ordner", type=Path)
          parser.add_argument("--apply", action="store_true", default=True, help="wirklich verschieben")
          args = parser.parse_args(argv)
          for quelle, ziel in plane(args.ordner):
              log.info("%s%s -> %s", "" if args.apply else "[dry-run] ", quelle, ziel)
              if args.apply:
                  quelle.rename(ziel)
          return 0
    lines: [4]
    fix:
      - line: 4
        answers:
          - parser.add_argument("--apply", action="store_true", help="wirklich verschieben")
          - parser.add_argument("--apply", action="store_true", default=False, help="wirklich verschieben")
          - parser.add_argument("--apply", action="store_true")
    explanation: |
      `store_true` setzt den Wert auf `True`, wenn die Option angegeben ist – und sonst auf den Standardwert. Der ist normalerweise `False`, hier aber ausdrücklich `True`. Damit ist `args.apply` immer `True`, und der sichere Standard ist weg. Solche Fehler fallen nur auf, wenn man den Trockenlauf auch testet: `main(["Downloads"])` darf nichts verändern.
    resources:
      - title: argparse · store_true
        url: https://docs.python.org/3/library/argparse.html#action

  - id: fehler-verschluckt
    type: bug
    title: Grün, obwohl es brennt
    prompt: |
      Der nächtliche Import scheitert seit einer Woche bei der Hälfte der Dateien. Das Log zeigt die Fehler, aber cron und das Monitoring melden jeden Lauf als erfolgreich. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      def main(argv: list[str] | None = None) -> int:
          args = parse_args(argv)
          fehler = 0
          for datei in sorted(args.ordner.glob("*.csv")):
              try:
                  importiere(datei)
              except (ValueError, OSError) as exc:
                  log.error("%s: %s", datei.name, exc)
                  fehler += 1
          log.info("fertig, %d Fehler", fehler)
          return 0

      if __name__ == "__main__":
          sys.exit(main())
    lines: [11]
    fix:
      - line: 11
        answers:
          - return 1 if fehler else 0
          - return 1 if fehler > 0 else 0
          - return 0 if fehler == 0 else 1
          - return 0 if not fehler else 1
          - return int(fehler > 0)
          - return 1 if fehler != 0 else 0
    explanation: |
      Das Skript fängt die Fehler richtig ab und zählt sie, damit eine kaputte Datei nicht den ganzen Import stoppt. Aber am Ende gibt es immer `0` zurück – für cron, systemd oder CI heißt das „Erfolg“. Wer Fehler sammelt, muss sie am Ende in den Exit-Code übersetzen. `return fehler` wäre riskant: Exit-Codes werden modulo 256 genommen, 256 Fehler ergäben wieder `0`.
    resources:
      - title: sys.exit
        url: https://docs.python.org/3/library/sys.html#sys.exit

  - id: repariere-einrichtung
    type: code
    title: Repariere das Einrichtungsskript
    prompt: |
      `richte_ein(basis)` soll ein Projektgerüst anlegen: die Ordner `src` und `tests` und eine `.gitignore` mit den Einträgen `.venv/` und `__pycache__/`. Beim ersten Lauf klappt das. Beim zweiten Lauf bricht es mit `FileExistsError` ab – und hätte sonst die `.gitignore` doppelt befüllt.

      Mache die Funktion idempotent:

      - Mehrfaches Aufrufen wirft keinen Fehler und ändert nach dem ersten Lauf nichts mehr.
      - Jeder Eintrag steht genau einmal in der `.gitignore`, vorhandene Zeilen bleiben erhalten und in ihrer Reihenfolge; fehlende Einträge werden am Ende ergänzt.
    lang: python
    starter: |
      from pathlib import Path

      EINTRAEGE = [".venv/", "__pycache__/"]

      def richte_ein(basis: Path) -> None:
          (basis / "src").mkdir(parents=True)
          (basis / "tests").mkdir()
          with (basis / ".gitignore").open("a", encoding="utf-8") as datei:
              for eintrag in EINTRAEGE:
                  datei.write(eintrag + "\n")
    solution: |
      from pathlib import Path

      EINTRAEGE = [".venv/", "__pycache__/"]

      def richte_ein(basis: Path) -> None:
          (basis / "src").mkdir(parents=True, exist_ok=True)
          (basis / "tests").mkdir(exist_ok=True)
          gitignore = basis / ".gitignore"
          text = gitignore.read_text(encoding="utf-8") if gitignore.exists() else ""
          vorhanden = text.splitlines()
          fehlend = [e for e in EINTRAEGE if e not in vorhanden]
          if not fehlend:
              return
          if text and not text.endswith("\n"):
              text += "\n"
          gitignore.write_text(text + "".join(e + "\n" for e in fehlend), encoding="utf-8")
    tests:
      - name: Erster Lauf legt alles an
        code: |
          richte_ein(Path("p1"))
          assert Path("p1/src").is_dir() and Path("p1/tests").is_dir()
          inhalt = Path("p1/.gitignore").read_text(encoding="utf-8")
          assert inhalt == ".venv/\n__pycache__/\n", f"Inhalt: {inhalt!r}"
      - name: Zweiter Lauf wirft nicht und ändert nichts
        code: |
          richte_ein(Path("p2"))
          richte_ein(Path("p2"))
          inhalt = Path("p2/.gitignore").read_text(encoding="utf-8")
          assert inhalt == ".venv/\n__pycache__/\n", f"Inhalt nach zwei Läufen: {inhalt!r}"
      - name: Vorhandene .gitignore wird ergänzt
        code: |
          Path("p3").mkdir()
          Path("p3/.gitignore").write_text("*.log\n.venv/\n", encoding="utf-8")
          richte_ein(Path("p3"))
          inhalt = Path("p3/.gitignore").read_text(encoding="utf-8")
          assert inhalt == "*.log\n.venv/\n__pycache__/\n", f"Inhalt: {inhalt!r}"
      - name: Vorhandene Ordner stören nicht
        code: |
          Path("p4/src").mkdir(parents=True)
          (Path("p4/src") / "main.py").write_text("print(1)\n", encoding="utf-8")
          richte_ein(Path("p4"))
          assert Path("p4/src/main.py").read_text(encoding="utf-8") == "print(1)\n", "Inhalt von src/ muss erhalten bleiben"
    hints:
      - "`mkdir` hat einen Parameter, der das Existieren des Ordners erlaubt."
      - "Für die `.gitignore`: vorhandene Zeilen lesen, nur die fehlenden Einträge anhängen."
      - "`fehlend = [e for e in EINTRAEGE if e not in text.splitlines()]` – und auf den Zeilenumbruch am Ende achten."
    explanation: |
      Zwei unterschiedliche Idempotenz-Probleme: `mkdir()` scheitert laut am zweiten Lauf, `open(..., "a")` verdoppelt still. Das laute Problem löst `exist_ok=True`. Das stille löst ein Abgleich mit dem Zielzustand: nur ergänzen, was fehlt. Das Ergebnis ist ein Skript, das du nach jedem Abbruch oder Zweifel einfach erneut starten kannst – die wichtigste Eigenschaft von Einrichtungs- und Deployment-Skripten.
    resources:
      - title: pathlib.Path.mkdir
        url: https://docs.python.org/3/library/pathlib.html#pathlib.Path.mkdir

  - id: dotfiles-verlinken-erklaeren
    type: explain
    title: Ein vorsichtiger Dotfiles-Linker
    prompt: |
      Diese Funktion aus einem Dotfiles-Repository legt symbolische Links an, zum Beispiel `~/.config/fish/config.fish` → `~/dotfiles/fish/config.fish`. Erkläre, welche Prinzipien aus der Lektion sie umsetzt und warum die zweite `if`-Bedingung sowohl `exists()` als auch `is_symlink()` prüft.
    lang: python
    code: |
      def verlinke(quelle: Path, ziel: Path, apply: bool) -> str:
          if ziel.is_symlink() and ziel.resolve() == quelle.resolve():
              return f"ok        {ziel}"
          if ziel.exists() or ziel.is_symlink():
              return f"KONFLIKT  {ziel} existiert – bitte selbst prüfen"
          if not apply:
              return f"würde     {ziel} -> {quelle} anlegen"
          ziel.parent.mkdir(parents=True, exist_ok=True)
          ziel.symlink_to(quelle)
          return f"angelegt  {ziel} -> {quelle}"
    points:
      - Zuerst wird der Zielzustand geprüft – zeigt der Link schon auf die Quelle, passiert nichts. Die Funktion ist idempotent.
      - Eine vorhandene fremde Datei oder ein fremder Link wird nie überschrieben, sondern als Konflikt gemeldet (sicherer Standard).
      - "`exists()` folgt Links und liefert für einen kaputten Link `False`; erst `is_symlink()` erkennt ihn, sonst würde `symlink_to` mit `FileExistsError` scheitern."
      - Ohne `apply` wird nur gemeldet, was passieren würde (Trockenlauf).
      - Die Funktion gibt eine Meldung zurück statt zu drucken; der Aufrufer entscheidet über Ausgabe und Exit-Code, und sie ist leicht testbar.
    explanation: |
      Die Funktion beschreibt einen Zielzustand: „`ziel` ist ein Link auf `quelle`“. Ist er erreicht, meldet sie `ok` und tut nichts – deshalb kann man das ganze Dotfiles-Skript beliebig oft laufen lassen. Existiert am Ziel etwas anderes, überschreibt sie es nicht, sondern meldet einen Konflikt; eine echte `config.fish` könnte Arbeit von Stunden enthalten. Die doppelte Prüfung ist nötig, weil `Path.exists()` symbolischen Links folgt: Ein Link, dessen Ziel gelöscht wurde, „existiert“ für `exists()` nicht, belegt aber trotzdem den Namen. Ohne `apply` bleibt es beim Trockenlauf. Und weil sie Text zurückgibt statt zu drucken, kann der Aufrufer loggen, zählen und bei Konflikten mit Exit-Code `1` enden.
    resources:
      - title: pathlib.Path.exists
        url: https://docs.python.org/3/library/pathlib.html#pathlib.Path.exists
      - title: pathlib.Path.symlink_to
        url: https://docs.python.org/3/library/pathlib.html#pathlib.Path.symlink_to

  - id: do-nothing-skript
    type: practice
    title: Dein erstes Do-nothing-Skript
    prompt: |
      Such dir eine Routine aus deinem Alltag, die du regelmäßig von Hand erledigst – zum Beispiel das System-Update auf CachyOS: Updates einspielen, `.pacnew`-Dateien prüfen, bei neuem Kernel neu starten.

      1. Schreibe die Schritte als Do-nothing-Skript auf: Es zeigt jeden Schritt an und wartet auf Enter.
      2. Automatisiere **einen** Schritt, der nur liest und nichts verändert (etwa: `.pacnew`-Dateien unter `/etc` finden und auflisten).
      3. Gib dem Skript ein `main()` mit Exit-Code und einen `__main__`-Guard.

      Führe es lokal aus: `python3 update_routine.py`.
    lang: python
    starter: |
      #!/usr/bin/env python3
      """Begleitet mich durch das wöchentliche System-Update."""
      import sys


      def main() -> int:
          ...
          return 0


      if __name__ == "__main__":
          sys.exit(main())
    solution: |
      #!/usr/bin/env python3
      """Begleitet mich durch das wöchentliche System-Update."""
      import sys
      from pathlib import Path


      def warte(schritt: str) -> None:
          input(f"  {schritt}\n  Enter, wenn erledigt … ")


      def pacnew_dateien(wurzel: Path = Path("/etc")) -> list[Path]:
          # Nur lesen: rglob wirft bei fehlenden Rechten nicht, sondern überspringt still.
          return sorted(wurzel.rglob("*.pacnew"))


      def main() -> int:
          print("1/4 Updates einspielen")
          warte("sudo pacman -Syu  (oder: paru)")

          print("2/4 .pacnew-Dateien prüfen")
          funde = pacnew_dateien()
          if funde:
              for datei in funde:
                  print(f"  {datei}")
              warte("Mit sudo pacdiff zusammenführen")
          else:
              print("  keine gefunden")

          print("3/4 Paket-Cache aufräumen")
          warte("paccache -rk2")

          print("4/4 Bei neuem Kernel neu starten")
          warte("uname -r mit pacman -Q linux-cachyos vergleichen")
          return 0


      if __name__ == "__main__":
          sys.exit(main())
    checklist:
      - Jeder manuelle Schritt ist als eigener Aufruf im Code sichtbar und nummeriert.
      - Genau ein Schritt ist automatisiert, und er verändert nichts am System.
      - "`main()` gibt einen Exit-Code zurück, der Aufruf steht in `if __name__ == \"__main__\":`."
      - Das Skript lässt sich nach `chmod +x` als `./update_routine.py` starten.
      - Du hast notiert, welcher Schritt als Nächstes automatisiert werden könnte und welches Risiko er hat.
    explanation: |
      Das Do-nothing-Skript macht den Ablauf zu Code, ohne ein Risiko einzugehen: Es verändert nichts, du führst weiter jeden Schritt selbst aus. Der erste automatisierte Schritt ist bewusst ein lesender – ein Fehler dort kostet nichts. Mit jedem weiteren Schritt wächst das Skript Richtung Werkzeug; die schreibenden Schritte bekommen dann Trockenlauf und Nachfrage.
    resources:
      - title: pathlib.Path.rglob
        url: https://docs.python.org/3/library/pathlib.html#pathlib.Path.rglob
