        why: Drei Minuten pro Woche sind etwa 2,6 Stunden im Jahr. Ein Scraper, der jeden Monat angepasst werden muss, kostet mehr Wartung, als er spart.
      - text: Ein Release besteht aus zwölf Schritten, einmal im Monat; zweimal hast du schon einen Schritt vergessen.
        correct: true
        why: Selten, aber fehleranfällig und teuer im Fehlerfall. Mindestens eine Checkliste oder ein Do-nothing-Skript lohnt sich, später schrittweise echter Code.
    explanation: |
      Die Rechnung hat zwei Seiten: Häufigkeit × gesparte Zeit plus vermiedene Fehler auf der einen, Bauzeit plus Wartung auf der anderen. Fehleranfälligkeit kann seltene Aufgaben lohnend machen, hohe Wartung kann häufige Aufgaben unrentabel machen. Und „Automatisierung“ beginnt nicht erst beim Skript – eine Checkliste ist Stufe eins.
    resources:
      - title: xkcd 1205 – Is It Worth the Time?
        url: https://xkcd.com/1205/
      - title: xkcd 1319 – Automation
        url: https://xkcd.com/1319/

  - id: skript-aufbau-ordnen
    type: order
    title: Ein Skript von oben nach unten
    prompt: Bring die Zeilen eines kleinen, ausführbaren Skripts in die richtige Reihenfolge. Es gibt die Anzahl der Dateien in einem Ordner aus. Halte dich an die übliche Konvention, dass Imports direkt nach dem Modul-Docstring stehen (PEP 8).
    lang: python
    lines: |
      #!/usr/bin/env python3
      """Zählt die Dateien in einem Ordner."""
      import sys
      from pathlib import Path
      def main(argv: list[str]) -> int:
          anzahl = sum(1 for p in Path(argv[0]).iterdir() if p.is_file())
          print(anzahl)
          return 0
      if __name__ == "__main__":
          sys.exit(main(sys.argv[1:]))
    alternatives:
      - [1, 2, 4, 3, 5, 6, 7, 8, 9, 10]
    explanation: |
      Die Shebang-Zeile muss die allererste Zeile sein, sonst ignoriert der Kernel sie. Der Docstring ist nur dann Modul-Docstring (und damit `__doc__`), wenn er die erste Anweisung ist – also vor den Imports. Die Reihenfolge der beiden Imports ist egal. `main` muss definiert sein, bevor der `__main__`-Block sie aufruft; `sys.argv[1:]` lässt den Programmnamen weg.
    resources:
      - title: __main__ · Idiomatic usage
        url: https://docs.python.org/3/library/__main__.html#idiomatic-usage
      - title: sys.argv
        url: https://docs.python.org/3/library/sys.html#sys.argv

  - id: zweimal-einrichten
    type: output
    title: Der zweite Lauf
    prompt: Die Funktion wird zweimal aufgerufen, dazwischen wird ein Ordner gelöscht. Was gibt das Programm aus?
    lang: python
    code: |
      from pathlib import Path

      def einrichten(basis: Path) -> list[str]:
          meldungen = []
          for name in ["logs", "daten"]:
              ordner = basis / name
              if ordner.exists():
                  meldungen.append(f"{name}: vorhanden")
              else:
                  ordner.mkdir(parents=True)
                  meldungen.append(f"{name}: angelegt")
          with (basis / "LIESMICH.txt").open("a", encoding="utf-8") as datei:
              datei.write("Automatisch angelegt.\n")
          return meldungen

      projekt = Path("projekt")
      print(einrichten(projekt))
      (projekt / "daten").rmdir()
      print(einrichten(projekt))
      print(len((projekt / "LIESMICH.txt").read_text(encoding="utf-8").splitlines()))
    expected: |
      ['logs: angelegt', 'daten: angelegt']
      ['logs: vorhanden', 'daten: angelegt']
      2
    explanation: |
      Die Ordner-Schleife ist idempotent: Sie prüft den Zielzustand und legt nur an, was fehlt – deshalb repariert der zweite Lauf den gelöschten Ordner. `parents=True` legt beim ersten Mal auch `projekt` an. Das Schreiben in `LIESMICH.txt` ist es nicht: Modus `"a"` hängt bei jedem Lauf eine weitere Zeile an. Genau solche halb idempotenten Skripte sind tückisch, weil der Fehler erst nach vielen Läufen auffällt.
    resources:
      - title: pathlib.Path.mkdir
        url: https://docs.python.org/3/library/pathlib.html#pathlib.Path.mkdir
      - title: open() · Modi
        url: https://docs.python.org/3/library/functions.html#open

  - id: trockenlauf-vorhersagen
    type: output
    title: Plan und Ausführung
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      def plane(dateien: dict[str, int], max_mb: int) -> list[tuple[str, str]]:
          return [(name, "archiv/" + name) for name, mb in dateien.items() if mb > max_mb]

      def fuehre_aus(plan: list[tuple[str, str]], dry_run: bool = True) -> int:
          erledigt = 0
          for quelle, ziel in plan:
              if dry_run:
                  print(f"würde {quelle} -> {ziel}")
                  continue
              print(f"verschiebe {quelle} -> {ziel}")
              erledigt += 1
          return erledigt

      dateien = {"video.mp4": 700, "notiz.txt": 1, "backup.tar": 250}
      plan = plane(dateien, max_mb=100)
      print(fuehre_aus(plan))
      print(fuehre_aus(plan[:1], dry_run=False))
      print(len(plan), dateien["notiz.txt"])
    expected: |
      würde video.mp4 -> archiv/video.mp4
      würde backup.tar -> archiv/backup.tar
      0
      verschiebe video.mp4 -> archiv/video.mp4
      1
      2 1
    explanation: |
      `dry_run` ist standardmäßig `True` – der erste Aufruf gibt nur aus und zählt nichts, deshalb `0`. Dictionaries behalten die Einfügereihenfolge, also kommt `video.mp4` vor `backup.tar`. Der zweite Aufruf bekommt nur den ersten Eintrag des Plans. `plane` verändert nichts: `dateien` und `plan` sind danach unverändert. Weil beide Läufe denselben Plan benutzen, kann der Trockenlauf nie etwas anderes zeigen als der echte Lauf.
    resources:
      - title: dict · Einfügereihenfolge
        url: https://docs.python.org/3/library/stdtypes.html#dict

  - id: skript-geruest-luecken
    type: gap
    title: Das Grundgerüst ergänzen
    prompt: |
      Ergänze das Gerüst eines Skripts. Der Logger soll nach dem Modul benannt sein, `--apply` ist ein Schalter ohne Wert, `main` muss mit einer eigenen Argumentliste testbar sein, und der Exit-Code von `main` soll an die Shell gehen – aber nur, wenn die Datei als Programm läuft.
    lang: python
    code: |
      """Archiviert alte Logdateien."""
      import argparse
      import logging
      import sys

      log = logging.⟦getLogger⟧(__name__)

      def main(argv: list[str] | None = None) -> int:
          parser = argparse.ArgumentParser(description=__doc__)
          parser.add_argument("--apply", action=⟦"store_true"⟧, help="wirklich ausführen")
          args = parser.parse_args(⟦argv⟧)
          logging.basicConfig(level=logging.INFO)
          log.info("Start, apply=%s", args.apply)
          return 0

      if ⟦__name__ == "__main__"⟧:
          ⟦sys.exit(main())⟧
    gaps:
      - label: Logger holen
        hint: Eine Funktion im Modul `logging`, die einen benannten Logger liefert.
      - label: Schalter
        hint: Die Aktion speichert `True`, wenn die Option angegeben ist.
      - label: Argumente
        hint: Reiche den Parameter von `main` weiter.
      - label: Guard
        hint: Welchen Wert hat `__name__`, wenn die Datei direkt gestartet wird?
        accept:
          - '"__main__" == __name__'
      - label: Exit-Code weitergeben
        hint: Rufe `main()` auf und übergib das Ergebnis an eine Funktion aus `sys`.
        accept:
          - raise SystemExit(main())
    explanation: |
      `logging.getLogger(__name__)` liefert einen Logger pro Modul; konfiguriert wird er zentral in `main`. `store_true` macht aus `--apply` einen Schalter mit Standard `False`. `parse_args(argv)` liest bei `None` `sys.argv[1:]`, in Tests aber die übergebene Liste. `sys.exit(main())` (gleichwertig: `raise SystemExit(main())`) macht den Rückgabewert zum Exit-Code des Prozesses.
    resources:
      - title: logging.getLogger
        url: https://docs.python.org/3/library/logging.html#logging.getLogger
      - title: argparse · action
        url: https://docs.python.org/3/library/argparse.html#action

