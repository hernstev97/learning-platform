lesson: |
  Jeden Montag lädst du drei Kontoauszüge als CSV herunter, benennst sie nach dem Schema `2026-09_girokonto.csv` um, schiebst sie in den Ordner `Finanzen` und trägst die Summen in eine Tabelle ein. Acht Minuten, jede Woche. Im Dezember stimmt die Jahresauswertung nicht, weil du im März `2026-03_girokonot.csv` getippt hast. Genau solche Aufgaben sind der Kern von Automatisierung: Sie wiederholen sich, sie kosten Zeit, und Menschen machen dabei Fehler.

  Bevor du die erste Zeile Code schreibst, lohnt sich ein Schritt zurück. Schlechte Automatisierung ist schlimmer als keine: Ein Skript, das beim zweiten Lauf Einträge verdoppelt, still scheitert oder ohne Nachfrage löscht, kostet mehr Zeit, als es spart – manchmal auch Daten. Dieses Modul legt das Fundament für den ganzen Bereich: wann sich Automatisierung lohnt, auf welcher Stufe du anfängst und welche Prinzipien ein Skript vertrauenswürdig machen. Dateien, Kommandozeile, APIs und Zeitsteuerung in den folgenden Modulen bauen darauf auf.

  ## Lohnt sich das?

  Die Grundrechnung ist schlicht: **Nutzen = Häufigkeit × gesparte Zeit pro Lauf**, über einen realistischen Zeitraum. Dem stehen die **Kosten** gegenüber: die Zeit zum Bauen und – oft vergessen – die Zeit für Wartung. Der Comic [xkcd 1205 „Is It Worth the Time?“](https://xkcd.com/1205/) rechnet das als Tabelle über fünf Jahre vor. Du kannst es selbst nachrechnen:

  ```python run
  def ersparnis_stunden(minuten_pro_lauf: float, laeufe_pro_jahr: int, jahre: int = 5) -> float:
      return minuten_pro_lauf * laeufe_pro_jahr * jahre / 60

  print(f"{ersparnis_stunden(8, 52):.0f} h")     # Kontoauszüge, wöchentlich
  print(f"{ersparnis_stunden(5, 365):.0f} h")    # jeden Tag 5 Minuten
  print(f"{ersparnis_stunden(30, 1):.1f} h")     # einmal im Jahr eine halbe Stunde
  ```

  Acht Minuten pro Woche sind über fünf Jahre rund 35 Stunden – dafür darfst du einen Nachmittag investieren. Die halbe Stunde einmal im Jahr lohnt sich dagegen kaum als Skript; da reicht eine gute Notiz.

  Zeit ist aber nur ein Faktor. Drei weitere entscheiden oft mehr:

  - **Fehleranfälligkeit.** Ein vergessener Schritt beim Release, ein Tippfehler im Dateinamen, eine falsch kopierte IBAN: Wenn Fehler teuer sind, lohnt sich Automatisierung auch bei seltenen Aufgaben. Ein Skript macht jedes Mal genau dasselbe.
  - **Wartung.** Ein Skript, das eine Webseite ausliest, bricht, sobald sich das HTML ändert. Ein Skript, das lokale Dateien umbenennt, läuft jahrelang. Rechne die Wartung pro Jahr in die Kosten ein. [xkcd 1319 „Automation“](https://xkcd.com/1319/) zeigt, was passiert, wenn man das nicht tut: Die Arbeit am Automatisieren ersetzt die eigentliche Arbeit.
  - **Nebeneffekte.** Ein Skript dokumentiert den Ablauf, andere können ihn ausführen, und du musst dich nicht mehr erinnern. Das zählt besonders im Team.

  > [!MERKE]
  > Automatisiere, was **häufig**, **fehleranfällig** oder **langweilig und klar definiert** ist. Rechne die Wartung mit. Was selten ist und sich ständig ändert, bekommt eine Checkliste statt eines Skripts.

  ## Vier Stufen: von der Checkliste zum Dienst

  Automatisierung ist kein Entweder-oder. Jede Stufe baut auf der vorigen auf, und du steigst nur so weit, wie es sich lohnt:

  | Stufe | Was | Wann |
  | --- | --- | --- |
  | 1. Checkliste | Markdown-Datei mit nummerierten Schritten | Ablauf noch unklar oder selten |
  | 2. Skript | Eine Datei, die du selbst startest | Ablauf klar, nur du nutzt es |
  | 3. Werkzeug | CLI mit Optionen, Hilfe, Tests, installierbar | Andere nutzen es oder es wächst |
  | 4. Dienst | Läuft ohne dich: cron, systemd-Timer, CI | Muss regelmäßig laufen, auch nachts |

  Mit jeder Stufe steigen die Anforderungen. Ein Skript für dich darf mit einem Traceback abbrechen. Ein Werkzeug für Kollegen braucht verständliche Fehlermeldungen und `--help`. Ein Dienst läuft, während du schläfst: Er braucht Logging, Exit-Codes, Benachrichtigungen bei Fehlern und muss einen abgebrochenen Lauf sauber wiederholen können. Die Module zu Kommandozeilen-Werkzeugen, Zeitsteuerung und Benachrichtigungen behandeln diese Stufen im Detail.

  > [!PRAXIS] Do-nothing-Skripte
  > Ein bewährter Einstieg ist das „Do-nothing-Skript“: Es automatisiert zunächst nichts, sondern gibt die Schritte der Checkliste nacheinander aus und wartet jeweils auf Enter. Dadurch ist der Ablauf als Code festgehalten. Danach ersetzt du Schritt für Schritt die Ausgabe durch echten Code – zuerst die einfachen, sicheren Schritte. So wird aus einer Checkliste ohne großen Wurf ein Werkzeug.

  ```python
  SCHRITTE = [
      "Kontoauszüge im Onlinebanking als CSV exportieren",
      "Dateien nach JJJJ-MM_konto.csv umbenennen",
      "In ~/Finanzen verschieben",
      "Summen in die Jahrestabelle eintragen",
  ]

  for nummer, schritt in enumerate(SCHRITTE, start=1):
      input(f"[{nummer}/{len(SCHRITTE)}] {schritt} – Enter, wenn erledigt ")
  ```

  ## Idempotenz: zweimal ausführen, gleiches Ergebnis

  Eine Operation ist **idempotent**, wenn mehrfaches Ausführen denselben Zustand ergibt wie einmaliges. `mkdir -p logs` ist idempotent: Existiert der Ordner schon, passiert nichts. `echo "*.log" >> .gitignore` ist es nicht: Jeder Lauf hängt eine weitere Zeile an.

  Warum das so wichtig ist: Skripte laufen öfter, als man denkt. Ein Lauf bricht nach der Hälfte ab und du startest ihn neu. cron startet einen Job zweimal, weil der erste zu lange dauerte. Du weißt nicht mehr, ob du das Skript gestern schon ausgeführt hast. Ist das Skript idempotent, ist die Antwort auf all das: einfach noch einmal laufen lassen.

  Der Trick ist ein Perspektivwechsel. Beschreibe nicht die **Aktion** („hänge eine Zeile an“), sondern den **Zielzustand** („die Zeile steht in der Datei“). Das Skript prüft zuerst, ob der Zustand schon erreicht ist, und handelt nur, wenn nicht:

  ```python run
  from pathlib import Path

  def haenge_an(pfad: Path, zeile: str) -> None:          # Aktion – nicht idempotent
      with pfad.open("a", encoding="utf-8") as datei:
          datei.write(zeile + "\n")

  def stelle_sicher(pfad: Path, zeile: str) -> bool:      # Zielzustand – idempotent
      vorhanden = pfad.read_text(encoding="utf-8").splitlines() if pfad.exists() else []
      if zeile in vorhanden:
          return False                                     # nichts zu tun
      with pfad.open("a", encoding="utf-8") as datei:
          datei.write(zeile + "\n")
      return True

  gitignore = Path(".gitignore")
  for _ in range(3):
      haenge_an(gitignore, "*.log")
  print(gitignore.read_text(encoding="utf-8").count("*.log"))    # 3

  gitignore.unlink()
  print([stelle_sicher(gitignore, "*.log") for _ in range(3)])   # [True, False, False]
  print(gitignore.read_text(encoding="utf-8").count("*.log"))    # 1
  ```

  Der Rückgabewert `True`/`False` sagt, ob sich etwas geändert hat. Das ist mehr als Kosmetik: Ein Log wie „`.gitignore`: unverändert“ zeigt beim zweiten Lauf, dass alles in Ordnung ist. Werkzeuge wie Ansible, Terraform oder Kubernetes sind komplett um diese Idee gebaut – du beschreibst den gewünschten Zustand, das Werkzeug gleicht ab.

  Typische Idempotenz-Killer im eigenen Code:

  - Anhängen mit Modus `"a"` ohne vorherige Prüfung.
  - [`Path.mkdir()`](https://docs.python.org/3/library/pathlib.html#pathlib.Path.mkdir) ohne `exist_ok=True` – der zweite Lauf wirft `FileExistsError`.
  - Zeitstempel oder Zähler im Dateinamen (`bericht (2).pdf`, `backup-1759050000.tar`), wenn eigentlich „das Backup von heute“ gemeint ist.
  - Verschieben, ohne zu prüfen, ob die Quelle noch existiert oder das Ziel schon belegt ist.

  > [!INTERVIEW] „Was bedeutet idempotent, und warum ist es wichtig?“
  > Kernsatz: Eine idempotente Operation kann man beliebig oft ausführen, das Ergebnis ist dasselbe wie nach dem ersten Mal. Beispiel: `mkdir -p` oder HTTP `PUT` im Gegensatz zu `POST`. Wichtig ist das, weil Automatisierung wiederholt wird – nach Abbrüchen, durch Retries, durch doppelte Starts. Idempotente Schritte machen „einfach nochmal ausführen“ zur sicheren Fehlerbehebung.

  ## Erst planen, dann handeln: der Trockenlauf

  Ein **Trockenlauf** (dry run) zeigt, was ein Skript tun würde, ohne es zu tun. `rsync --dry-run`, `terraform plan` und [`git clean -n`](https://git-scm.com/docs/git-clean) funktionieren so. Für eigene Skripte gibt es ein einfaches Muster: Trenne **Planen** von **Ausführen**. Eine Funktion berechnet die Liste der Aktionen und verändert nichts; eine zweite führt sie aus – oder gibt sie nur aus.

  ```python run
  from dataclasses import dataclass
  from pathlib import Path

  @dataclass(frozen=True)
  class Verschieben:
      quelle: Path
      ziel: Path

  ZIELORDNER = {".pdf": "Dokumente", ".jpg": "Bilder", ".png": "Bilder", ".csv": "Tabellen"}

  def plane(dateien: list[Path]) -> list[Verschieben]:
      plan = []
      for datei in sorted(dateien):
          ordner = ZIELORDNER.get(datei.suffix.lower())
          if ordner is not None:
              plan.append(Verschieben(datei, datei.parent / ordner / datei.name))
      return plan

  def fuehre_aus(plan: list[Verschieben], dry_run: bool) -> None:
      for aktion in plan:
          print(f"{'[dry-run] ' if dry_run else ''}{aktion.quelle} -> {aktion.ziel}")
          if not dry_run:
              aktion.ziel.parent.mkdir(parents=True, exist_ok=True)
              aktion.quelle.rename(aktion.ziel)

  downloads = Path("Downloads")
  downloads.mkdir()
  for name in ["rechnung.PDF", "urlaub.jpg", "notizen.txt", "konto.csv"]:
      (downloads / name).write_text("x", encoding="utf-8")

  fuehre_aus(plane(list(downloads.iterdir())), dry_run=True)
  print(sorted(p.name for p in downloads.iterdir()))   # nichts hat sich bewegt
  ```

  Das Muster hat drei Vorteile. Der Trockenlauf ist trivial, weil er denselben Plan benutzt wie der echte Lauf – er kann nicht vom echten Verhalten abweichen. Die Planungsfunktion ist eine reine Funktion und damit leicht zu testen, ganz ohne echte Dateien zu verschieben. Und du kannst den Plan prüfen, bevor etwas passiert: zählen, sortieren, nachfragen („12 Dateien verschieben? [j/N]“). Die [`dataclass`](https://docs.python.org/3/library/dataclasses.html) macht die Aktionen zu klar benannten, vergleichbaren Werten.

  ## Sichere Standardwerte und lautes Scheitern

  ### Destruktives nur auf ausdrücklichen Wunsch

  Die Standardeinstellung eines Skripts ist das, was passiert, wenn jemand es ohne nachzudenken startet. Bei allem, was Daten verändert oder löscht, sollte das die harmlose Variante sein. `git clean` weigert sich ohne `-f` zu löschen. Für eigene Werkzeuge heißt das:

  - **Trockenlauf als Standard**, echte Ausführung mit `--apply` – oder umgekehrt `--dry-run` als Option, wenn das Werkzeug harmlos ist. Je gefährlicher, desto eher gilt die erste Variante.
  - **Verschieben statt löschen.** Ein Ordner `_archiv` oder der Papierkorb (etwa über `trash-put` aus dem Paket `trash-cli`) machen Fehler rückgängig. Endgültig löschen kann man später immer noch.
  - **Nachfragen bei großen Mengen.** „Ich lösche 3 Dateien“ ist erwartbar, „ich lösche 48 000 Dateien“ ist fast immer ein Bug.
  - **Nichts überschreiben.** Existiert das Ziel schon, überspringen und melden.

  > [!WARNING] Leere Variablen und `rm -rf`
  > In Bash wird `rm -rf "$ZIEL/"*` zu `rm -rf /*`, wenn `ZIEL` leer ist. Genau so hat 2015 ein Update-Skript des Steam-Clients für Linux bei Nutzern das Home-Verzeichnis gelöscht. In Bash schützt `${ZIEL:?}`: Die [Parameter-Expansion](https://www.gnu.org/software/bash/manual/bash.html#Shell-Parameter-Expansion) bricht mit Fehler ab, wenn die Variable leer oder nicht gesetzt ist. In Python gilt dasselbe Prinzip: Prüfe Pfade, bevor du `shutil.rmtree` aufrufst.

  ### Laut scheitern

  Ein Skript, das Fehler verschluckt, ist gefährlicher als eines, das abstürzt. Der Absturz fällt auf; das stille Scheitern erst Wochen später. Deshalb:

  ```python
  try:
      importiere(datei)
  except Exception:
      pass                                   # schlecht: der Fehler verschwindet spurlos

  try:
      importiere(datei)
  except (ValueError, OSError) as exc:       # gut: gezielt fangen, melden, zählen
      log.error("%s: %s", datei.name, exc)
      fehler += 1
  ```

  Am Ende entscheidet der **Exit-Code**, ob die Außenwelt einen Fehler bemerkt. `0` heißt Erfolg, alles andere Fehler. cron, systemd, GitHub Actions und die Shell mit `&&` verlassen sich darauf. Üblich sind `1` für allgemeine Fehler und `2` für falsche Aufrufe – `argparse` beendet sich bei ungültigen Argumenten mit `2`. [`sys.exit(n)`](https://docs.python.org/3/library/sys.html#sys.exit) setzt den Code; `sys.exit("Meldung")` schreibt die Meldung nach stderr und endet mit `1`.

  ### Protokollieren, konfigurieren, klein anfangen

  - **Aktionen loggen.** Jede Änderung gehört ins Log: was, wo, mit welchem Ergebnis. Das [Logging HOWTO](https://docs.python.org/3/howto/logging.html) erklärt, warum `logging` besser ist als `print`: Stufen, Zeitstempel, Ausgabe nach stderr, abschaltbar. Die Details folgen im Modul zu Kommandozeilen-Werkzeugen.
  - **Konfiguration statt fest verdrahteter Werte.** `/home/steven/Downloads` im Code funktioniert auf genau einem Rechner. Pfade, Schwellwerte und Zugangsdaten kommen aus Argumenten, Umgebungsvariablen oder einer Konfigurationsdatei – mit sinnvollem Standard wie `Path.home() / "Downloads"`.
  - **Kleine Schritte.** Erst der Trockenlauf, dann ein Lauf auf einer Kopie der Daten, dann der echte Lauf. Erst ein Ordner, dann alle.

  ## Anatomie eines guten Skripts

  So sieht ein kleines, aber solides Automatisierungsskript aus. Jedes Teil hat einen Grund:

  ```python title=aufraeumen.py
  #!/usr/bin/env python3
  """Sortiert Dateien aus einem Ordner nach Endung in Unterordner."""
  import argparse
  import logging
  import sys
  from pathlib import Path

  log = logging.getLogger("aufraeumen")

  ZIELORDNER = {".pdf": "Dokumente", ".jpg": "Bilder", ".png": "Bilder"}


  def plane(ordner: Path) -> list[tuple[Path, Path]]:
      plan = []
      for datei in sorted(ordner.iterdir()):
          unterordner = ZIELORDNER.get(datei.suffix.lower())
          if not datei.is_file() or unterordner is None:
              continue
          ziel = ordner / unterordner / datei.name
          if ziel.exists():
              log.warning("%s existiert schon – übersprungen", ziel)
              continue
          plan.append((datei, ziel))
      return plan


  def main(argv: list[str] | None = None) -> int:
      parser = argparse.ArgumentParser(description=__doc__)
      parser.add_argument("ordner", type=Path, help="Ordner, der aufgeräumt wird")
      parser.add_argument("--apply", action="store_true", help="wirklich verschieben (Standard: nur anzeigen)")
      parser.add_argument("-v", "--verbose", action="store_true", help="mehr Ausgaben")
      args = parser.parse_args(argv)

      logging.basicConfig(level=logging.DEBUG if args.verbose else logging.INFO,
                          format="%(levelname)s %(message)s")
      if not args.ordner.is_dir():
          log.error("%s ist kein Ordner", args.ordner)
          return 2

      plan = plane(args.ordner)
      for quelle, ziel in plan:
          log.info("%s%s -> %s", "" if args.apply else "[dry-run] ", quelle.name, ziel)
          if args.apply:
              ziel.parent.mkdir(exist_ok=True)
              quelle.rename(ziel)
      log.info("%d Datei(en) %s", len(plan), "verschoben" if args.apply else "würden verschoben")
      return 0


  if __name__ == "__main__":
      sys.exit(main())
  ```

  - **Shebang und Docstring.** `#!/usr/bin/env python3` lässt das Skript nach `chmod +x` direkt als `./aufraeumen.py` laufen. Der Docstring ist gleichzeitig der Hilfetext (`description=__doc__`).
  - **`main(argv)` gibt einen Exit-Code zurück.** Weil `main` eine Argumentliste annimmt, kannst du sie im Test mit `main(["Downloads", "--apply"])` aufrufen, ohne einen Prozess zu starten. `parse_args(None)` liest dagegen `sys.argv` – das ist der normale Aufruf.
  - **`if __name__ == "__main__":`** Der Block läuft nur, wenn die Datei als Programm gestartet wird, nicht beim Import durch Tests. Die [Doku zu `__main__`](https://docs.python.org/3/library/__main__.html#idiomatic-usage) empfiehlt genau dieses Muster mit `sys.exit(main())`.
  - **`argparse`** liefert `--help`, Fehlermeldungen und Exit-Code `2` bei falschen Argumenten. Das [Argparse Tutorial](https://docs.python.org/3/howto/argparse.html) zeigt die Grundlagen.
  - **Logging wird nur in `main` konfiguriert.** Funktionen wie `plane` loggen über einen benannten Logger, aber entscheiden nicht, wohin die Ausgabe geht.
  - **Trockenlauf als Standard, Planen getrennt vom Ausführen, belegte Ziele werden übersprungen.** Der zweite Lauf findet nichts mehr zu tun – das Skript ist idempotent.

  Dass `main` mit einer Liste testbar ist, siehst du hier im Kleinen:

  ```python run
  import argparse

  def main(argv: list[str] | None = None) -> int:
      parser = argparse.ArgumentParser(prog="aufraeumen")
      parser.add_argument("ordner")
      parser.add_argument("--apply", action="store_true")
      args = parser.parse_args(argv)
      print(f"ordner={args.ordner} apply={args.apply}")
      return 0

  print(main(["Downloads"]))
  print(main(["Downloads", "--apply"]))
  ```

  ## Python oder Bash?

  Du wirst beides benutzen. Die Frage ist, wofür:

  | Bash ist besser, wenn … | Python ist besser, wenn … |
  | --- | --- |
  | du vorhandene Programme verkettest (`find`, `grep`, `rsync`, `git`) | du Daten verarbeitest: JSON, CSV, Datumswerte, Dictionaries |
  | das Skript kurz ist und auf eine Bildschirmseite passt | Fehlerbehandlung über „abbrechen“ hinausgeht |
  | es nur auf Linux/macOS laufen muss | es auch unter Windows laufen soll |
  | es vor allem Umgebung vorbereitet (Variablen, Pfade, Start eines Programms) | du Tests schreiben willst oder es wachsen wird |

  Der [Google Shell Style Guide](https://google.github.io/styleguide/shellguide.html) formuliert es als Faustregel: Wird ein Shell-Skript länger als etwa 100 Zeilen oder braucht es komplizierte Kontrollstrukturen, schreib es in einer richtigen Programmiersprache neu. Bash-Skripte beginnen außerdem mit [`set -euo pipefail`](https://www.gnu.org/software/bash/manual/bash.html#The-Set-Builtin), damit sie bei Fehlern abbrechen, statt weiterzulaufen.

  > [!TIP] fish für dich, Bash für Skripte
  > fish ist eine hervorragende interaktive Shell, aber nicht POSIX-kompatibel. Schreibe Skripte, die andere oder Server ausführen, mit `#!/usr/bin/env bash` oder gleich in Python – dann laufen sie unabhängig davon, welche Shell jemand interaktiv benutzt.

  ## Häufige Fehler

  - **Automatisieren, bevor der Ablauf klar ist.** Symptom: Das Skript wird ständig umgebaut. Lösung: erst eine Checkliste, dann ein Do-nothing-Skript, dann Code.
  - **Nicht idempotente Schritte.** Symptom: doppelte Zeilen, `FileExistsError` beim zweiten Lauf, `bericht (3).pdf`. Lösung: Zielzustand prüfen, `exist_ok=True`, feste Namen.
  - **Destruktiv als Standard.** Symptom: Ein Tippfehler im Pfad löscht den falschen Ordner. Lösung: Trockenlauf als Standard, verschieben statt löschen, Ziele nicht überschreiben.
  - **Fehler verschlucken.** Symptom: Das Log zeigt Fehler, aber der Job gilt als erfolgreich. Lösung: gezielt fangen, zählen und am Ende einen Exit-Code ungleich `0` liefern.
  - **Fest verdrahtete Pfade.** Symptom: Läuft nur auf deinem Rechner. Lösung: Argumente, Umgebungsvariablen, `Path.home()`.
  - **`print` für alles.** Symptom: Meldungen landen in einer Pipe zwischen den Daten. Lösung: Daten nach stdout, Meldungen per `logging` nach stderr.

  ## Zusammenfassung

  - Automatisiere, was häufig, fehleranfällig oder stumpf ist – und rechne die Wartung mit.
  - Steige stufenweise auf: Checkliste → Skript → Werkzeug → Dienst. Do-nothing-Skripte sind ein guter Anfang.
  - Idempotent heißt: beliebig oft ausführen, gleiches Ergebnis. Beschreibe Zielzustände statt Aktionen.
  - Trenne Planen von Ausführen; dann ist der Trockenlauf gratis und die Logik testbar.
  - Sichere Standardwerte: Trockenlauf, verschieben statt löschen, nichts überschreiben.
  - Scheitere laut: Fehler melden und mit Exit-Code ungleich `0` enden.
  - Ein gutes Skript hat `main(argv) -> int`, `argparse`, `logging` und `if __name__ == "__main__": sys.exit(main())`.
  - Bash für kurze Verkettungen von Programmen, Python für Daten, Fehlerbehandlung und alles, was wächst.
