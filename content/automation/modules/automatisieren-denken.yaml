id: automatisieren-denken
title: Automatisieren mit Verstand
level: 1
minutes: 150
summary: Erkennen, was sich zu automatisieren lohnt, und Skripte so bauen, dass man ihnen vertrauen kann – idempotent, mit Trockenlauf, sicheren Standardwerten und ehrlichen Exit-Codes.
goals:
  - Du schätzt mit Häufigkeit, gesparter Zeit, Fehlerrisiko und Wartungsaufwand ab, ob sich eine Automatisierung lohnt.
  - Du wählst die passende Stufe – Checkliste, Skript, Werkzeug oder Dienst – und fängst klein an.
  - Du schreibst idempotente Funktionen und trennst Planen von Ausführen, damit jeder Lauf einen Trockenlauf erlaubt.
  - Du baust ein Skript mit `main()`, `argparse`, `logging`, Exit-Codes und `__main__`-Guard und erklärst, wozu jedes Teil da ist.
  - Du begründest, wann Bash und wann Python das bessere Werkzeug ist.
