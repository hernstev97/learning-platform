id: postfach-kalender
title: Postfach und Kalender automatisieren
level: 2
minutes: 230
summary: Mails per IMAP lesen und mit Flags als Verarbeitungszustand markieren, Anhänge sicher speichern und versenden,
  Termine als ICS nach RFC 5545 erzeugen und lesen – Kalender-APIs als Konzept.
goals:
- Du erklärst das IMAP-Modell aus Postfach, UID, UIDVALIDITY und Flags.
- Du liest Nachrichten mit imaplib über UIDs, ohne sie als gelesen zu markieren, und setzt ein Flag erst nach
  erfolgreicher Verarbeitung.
- Du liest Anhänge mit dem email-Paket, speicherst sie unter sicheren Namen und versendest eigene Anhänge.
- Du erzeugst und liest ICS-Dateien mit CRLF, Zeilenfaltung, Escaping, UID und DTSTAMP.
- Du ordnest die Kalender-APIs von Google und Microsoft ein – OAuth-Scopes und inkrementelle Synchronisation.
