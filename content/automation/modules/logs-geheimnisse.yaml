id: logs-geheimnisse
title: Logs und Geheimnisse im Betrieb
level: 3
minutes: 210
summary: JSON-Logs mit Lauf-ID, Rotation und einem Filter, der Geheimnisse schwärzt – und Secrets aus keyring, .env,
  systemd-Credentials und GitHub Actions, samt Plan für ein geleaktes Token.
goals:
- Du schreibst einen JSON-Formatter und gibst jedem Eintrag eine Lauf-ID, per contextvars-Filter am Handler oder per
  LoggerAdapter.
- Du entscheidest zwischen Journal und Dateirotation und konfigurierst RotatingFileHandler so, dass er wirklich rotiert.
- Du schreibst einen Filter, der Tokens in Logmeldungen schwärzt, und kennst seine Grenzen.
- Du wählst die passende Quelle für Secrets – keyring, .env, systemd LoadCredential oder GitHub-Actions-Secrets.
- Du reagierst auf ein geleaktes Token in der richtigen Reihenfolge.
