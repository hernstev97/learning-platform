place: unterwegs
lesson: |
  Um drei Uhr ist der Bericht fehlgeschlagen. Das Logfile hat 4000 Zeilen aus drei Läufen, die sich überlappt haben, und keine Zeile sagt, zu welchem Lauf sie gehört. In Zeile 812 steht außerdem `Authorization: Bearer eyJ…`, ein vollständiges Token. Ab jetzt ist das Logfile selbst ein Geheimnis: Wer es in ein Ticket kopiert, gibt den Zugang weiter.

  Beides gehört zusammen. Ein Job soll über sich so viel verraten, dass du einen Fehler findest, und nichts, womit jemand anders etwas anfangen kann. Die Grundlagen von `logging` (Logger, Handler, Formatter, Stufen) stehen im Modul [Kommandozeilen-Werkzeuge](/automation/cli-werkzeuge). Dieses Modul baut darauf auf.

  ## JSON-Logs: eine Zeile, ein Ereignis

  Eine Zeile wie `WARNING bericht: 3 Zeilen verworfen` liest ein Mensch gut. Eine Maschine muss sie mit regulären Ausdrücken zerlegen. Schreibt jeder Eintrag ein JSON-Objekt in eine Zeile, kannst du mit `jq`, `journalctl -o json` oder einem Logsystem nach Feldern filtern: alle Fehler eines Laufs, alle Einträge eines Moduls. Ein eigener [Formatter](https://docs.python.org/3/library/logging.html#formatter-objects) überschreibt dafür `format`.

  ```python run
  import json
  import logging
  from sys import stdout

  class JsonLog(logging.Formatter):
      def format(self, r):
          d = {"stufe": r.levelname,
               "logger": r.name}
          d["text"] = r.getMessage()
          if r.exc_info:
              d["fehler"] = repr(
                  r.exc_info[1])
          return json.dumps(
              d, ensure_ascii=False)

  h = logging.StreamHandler(stdout)
  h.setFormatter(JsonLog())
  log = logging.getLogger("bericht")
  log.handlers = [h]
  log.propagate = False
  log.warning("%d verworfen", 3)
  try:
      1 / 0
  except ZeroDivisionError:
      log.exception("Summe kaputt")
  ```

  `r.getMessage()` setzt die Argumente ein, genau wie bei der normalen Ausgabe. `json.dumps` maskiert Zeilenumbrüche in Meldungen als `\n`; ein Eintrag bleibt dadurch immer eine Zeile, auch wenn eine Exception-Meldung mehrzeilig ist. Das Beispiel schreibt nur Typ und Meldung der Exception. Den vollständigen Traceback liefert `self.formatException(r.exc_info)`, er kann aber Werte aus deinem Code enthalten. `handlers = [h]` ersetzt hier die Handler früherer Läufe im Browser; in einem Programm konfigurierst du einmal in `main()`.

  Ein Zeitstempel fehlt im Beispiel absichtlich. Läuft der Job unter systemd, versieht das Journal jede Zeile mit Zeit, Unit und Prozess. Schreibst du in eine eigene Datei, ergänze `r.created`, die Unix-Zeit des Eintrags.

  ## Lauf-ID: welcher Eintrag zu welchem Lauf gehört

  Überlappen sich zwei Läufe, mischen sich ihre Zeilen. Eine **Lauf-ID** in jedem Eintrag trennt sie wieder. Dafür gibt es zwei Wege.

  Der [`LoggerAdapter`](https://docs.python.org/3/library/logging.html#loggeradapter-objects) hängt jedem Eintrag feste Zusatzfelder an. Du musst ihn aber an jede Funktion weitergeben, die loggt. Und ohne den Parameter `merge_extra=True` (seit Python 3.13) ignoriert er das `extra` einzelner Aufrufe.

  ```python run
  import logging
  from sys import stdout

  h = logging.StreamHandler(stdout)
  h.setFormatter(logging.Formatter(
      "%(lauf)s %(message)s"))
  log = logging.getLogger("job")
  log.handlers = [h]
  log.propagate = False
  a = logging.LoggerAdapter(
      log, {"lauf": "a1b2"})
  a.warning("Import gestartet")
  ```

  Der zweite Weg braucht keine Weitergabe. Eine [`ContextVar`](https://docs.python.org/3/library/contextvars.html) hält die ID des aktuellen Laufs, und ein Filter schreibt sie in jeden Eintrag. `asyncio` gibt jeder Task eine Kopie des Kontexts; zwei gleichzeitige Läufe im selben Prozess behalten so ihre eigene ID.

  ```python run
  import contextvars
  import logging
  from sys import stdout

  lauf_id = contextvars.ContextVar(
      "lauf_id", default="-")

  class LaufFilter(logging.Filter):
      def filter(self, r):
          r.lauf = lauf_id.get()
          return True

  FMT = ("%(lauf)s %(name)s "
         "%(message)s")
  h = logging.StreamHandler(stdout)
  h.addFilter(LaufFilter())
  h.setFormatter(
      logging.Formatter(FMT))
  log = logging.getLogger("job")
  log.handlers = [h]
  log.propagate = False
  lauf_id.set("c3d4")
  log.info("unsichtbar")
  log.warning("Seite 2 fehlt")
  logging.getLogger("job.http"
      ).warning("Timeout")
  ```

  Der Filter hängt am **Handler**, nicht am Logger. Die Dokumentation sagt ausdrücklich, dass [Filter an einem Logger](https://docs.python.org/3/library/logging.html#filter-objects) nur Einträge sehen, die direkt an diesem Logger entstehen, nicht die von Kind-Loggern wie `job.http`. Ein Handler sieht alles, was bei ihm ankommt.

  Woher kommt die ID? Unter systemd steht in der Umgebungsvariablen [`INVOCATION_ID`](https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#%24INVOCATION_ID) eine eindeutige ID für jeden Start der Unit. Das Journal speichert sie als Feld `_SYSTEMD_INVOCATION_ID`; nimmst du sie als Lauf-ID, findest du mit `journalctl _SYSTEMD_INVOCATION_ID=…` alle Zeilen dieses Laufs, auch die von systemd selbst. Ohne systemd genügt `uuid.uuid4().hex[:12]`.

  ## Journal oder Dateirotation

  Läuft dein Job als systemd-Dienst, schreibe nach stderr. Das Journal sammelt die Zeilen, versieht sie mit Metadaten und löscht alte Einträge nach den Grenzen in `journald.conf`. Eine eigene Logdatei brauchst du dann nicht.

  Ohne systemd, etwa bei einem Werkzeug, das du von Hand startest, wächst eine Logdatei sonst unbegrenzt. [`RotatingFileHandler`](https://docs.python.org/3/library/logging.handlers.html#rotatingfilehandler) beginnt eine neue Datei, sobald die aktuelle `maxBytes` erreichen würde, und behält `backupCount` alte. Die Dokumentation warnt: Ist einer der beiden Werte 0, rotiert er nie.

  ```python run
  import logging
  from logging.handlers import (
      RotatingFileHandler)
  from pathlib import Path

  h = RotatingFileHandler(
      "job.log", maxBytes=50,
      backupCount=2)
  log = logging.getLogger("rot")
  log.handlers = [h]
  log.propagate = False
  for i in range(20):
      log.warning("Zeile %02d", i)
  h.close()
  liste = Path(".").glob("job.log*")
  print(sorted(map(str, liste)))
  ```

  Aus 20 Zeilen bleiben drei Dateien; die ältesten Einträge sind gelöscht. [`TimedRotatingFileHandler`](https://docs.python.org/3/library/logging.handlers.html#timedrotatingfilehandler) mit `when="midnight"` rotiert stattdessen täglich. Beide Handler sind für einen Prozess gebaut. Schreiben mehrere Prozesse in dieselbe Datei, empfiehlt das [Logging Cookbook](https://docs.python.org/3/howto/logging-cookbook.html#logging-to-a-single-file-from-multiple-processes) einen eigenen Sammelprozess oder einen `QueueHandler`.

  ## Ein Filter, der Geheimnisse schwärzt

  Die beste Regel ist, Geheimnisse gar nicht erst zu loggen. Ein Filter ist das Sicherheitsnetz für den Fall, dass es doch passiert: eine Debug-Ausgabe der Header, eine Exception mit URL. Er ersetzt bekannte Werte und typische Muster, bevor der Eintrag geschrieben wird.

  ```python run
  import logging
  import re
  from sys import stdout

  MUSTER = re.compile(
      r"(Bearer\s+|token=)[^\s&]+")

  class Schwaerzen(logging.Filter):
      def filter(self, r):
          text = r.getMessage()
          r.msg = MUSTER.sub(
              r"\1***", text)
          r.args = None
          return True

  h = logging.StreamHandler(stdout)
  h.addFilter(Schwaerzen())
  log = logging.getLogger("http")
  log.handlers = [h]
  log.propagate = False
  log.warning("GET /x?token=abc123")
  log.warning("Header: Bearer %s",
              "eyJhbGciOi")
  ```

  `r.getMessage()` liefert den fertigen Text, auch wenn das Geheimnis als Argument kam. Danach steht der geschwärzte Text in `r.msg`, und `r.args = None` verhindert, dass die Argumente ein zweites Mal eingesetzt werden. Seit Python 3.12 darf ein Filter auch einen neuen `LogRecord` zurückgeben, statt den alten zu verändern; dann sehen andere Handler das Original.

  Die Grenzen solltest du kennen. Der Filter sieht die Meldung, aber nicht den Traceback, den erst der Formatter erzeugt. Er findet, was zu seinen Mustern passt, aber kein Token in Base64 oder in einem `extra`-Feld. Am zuverlässigsten schwärzt er die Werte, die dein Programm tatsächlich kennt: Lies die Geheimnisse beim Start und gib sie dem Filter mit.

  ## Woher Geheimnisse kommen

  Ein Token im Quellcode landet im Repository und von dort in jedem Klon. Je nach Umgebung gibt es bessere Orte.

  | Quelle | Passt für | Achtung |
  | --- | --- | --- |
  | keyring | Skripte am eigenen Desktop | braucht einen entsperrten Schlüsselbund |
  | `.env` | lokale Entwicklung | in `.gitignore`, nur für dich lesbar |
  | `LoadCredential` | systemd-Dienste | Datei nur für den Dienst lesbar |
  | `EnvironmentFile` | Einstellungen | nicht für Geheimnisse |
  | Actions-Secrets | CI-Läufe | nicht in Forks, nicht in Befehlszeilen |

  [keyring](https://pypi.org/project/keyring/) spricht den Schlüsselbund des Desktops an, unter Linux meist über den Secret Service. `keyring.get_password(dienst, name)` liefert `None`, wenn nichts gespeichert ist. Auf einem Server ohne Desktop-Sitzung gibt es oft keinen nutzbaren Schlüsselbund.

  ```python
  import keyring

  token = keyring.get_password(
      "bericht", "api")
  if token is None:
      raise SystemExit(
          "Kein Token: keyring "
          "set bericht api")
  ```

  [python-dotenv](https://pypi.org/project/python-dotenv/) liest eine Datei `.env` in die Umgebung. `load_dotenv()` überschreibt dabei keine Variablen, die schon gesetzt sind. Die Datei gehört in `.gitignore`; ins Repository kommt eine `.env.example` mit leeren Werten.

  Für Dienste ist systemd der richtige Ort. Die Dokumentation zu [`Environment=`](https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#Environment=) sagt ausdrücklich, dass Umgebungsvariablen für Geheimnisse ungeeignet sind: Sie sind über D-Bus für unprivilegierte Clients sichtbar und werden an Kindprozesse vererbt. Stattdessen gibt es [`LoadCredential=`](https://www.freedesktop.org/software/systemd/man/latest/systemd.exec.html#LoadCredential=ID:PATH).

  ```ini
  [Service]
  ExecStart=/opt/bericht/run.py
  EnvironmentFile=/etc/bericht.env
  LoadCredential=api_token
  ```

  Ohne Pfad sucht systemd die Datei `api_token` in `/etc/credstore/`, bei User-Diensten in `~/.config/credstore/`. Der Dienst findet eine schreibgeschützte Kopie unter `$CREDENTIALS_DIRECTORY/api_token`, die nur sein Benutzer lesen kann, nach Möglichkeit in nicht auslagerbarem Speicher. Mit `systemd-creds encrypt` verschlüsselst du die Datei, und `LoadCredentialEncrypted=` entschlüsselt sie erst beim Start. `EnvironmentFile=` bleibt für Einstellungen ohne Geheimnis, etwa die URL.

  In GitHub Actions legst du das Token als Repository- oder Environment-Secret an und reichst es als Umgebungsvariable an genau den Schritt weiter, der es braucht. GitHub schwärzt den Wert in der Ausgabe, aber [nicht davon abgeleitete Werte](https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions); mit `::add-mask::` maskierst du sie selbst. An Läufe aus Forks werden Secrets nicht weitergegeben.

  ```yaml
  - run: python bericht.py
    env:
      TOKEN: ${{ secrets.TOKEN }}
  ```

  ## Wenn ein Token geleakt ist

  Ein Token ist in einen öffentlichen Commit geraten, in ein Ticket, in ein geteiltes Logfile. Die Reihenfolge der nächsten Schritte entscheidet, wie viel Schaden entsteht.

  1. **Widerrufen.** Sofort beim Anbieter, vor allem anderen. Ab dem Moment des Leaks musst du davon ausgehen, dass jemand anders es hat.
  2. **Ersetzen.** Neues Token erzeugen und an allen Stellen eintragen, die das alte nutzten: credstore, Actions-Secret, Schlüsselbund.
  3. **Prüfen.** Im Audit-Log des Anbieters nachsehen, ob das alte Token zwischen Leak und Widerruf benutzt wurde.
  4. **Aufräumen.** Das Token aus Code, Konfiguration und Logs entfernen. Die Git-Historie umzuschreiben ist ein optionaler letzter Schritt, nie ein Ersatz für Schritt 1: Klone, Forks und Caches behalten den alten Stand.
  5. **Ursache abstellen.** `.gitignore`, [Secret Scanning und Push Protection](https://docs.github.com/en/code-security/secret-scanning/introduction/about-secret-scanning), ein Filter im Logging.

  Der häufigste Fehler ist die umgekehrte Reihenfolge: zuerst den Commit löschen, in der Hoffnung, dass es niemand gesehen hat. Das kostet Zeit, in der das Token gültig bleibt.

  > [!PRAXIS]
  > Schreibe ins Runbook eines Jobs, wo sein Token liegt, wie man es widerruft und wo das neue eingetragen wird. Wer um drei Uhr ein Leak bemerkt, soll nicht erst suchen müssen.

  ## Häufige Fehler

  - **Filter am falschen Logger.** Er sieht die Einträge von Kind-Loggern nicht. An den Handler hängen.
  - **`RotatingFileHandler` ohne `backupCount`.** Mit 0 rotiert er nie, die Datei wächst weiter.
  - **Mehrere Prozesse, eine rotierende Datei.** Einträge gehen verloren oder landen in der falschen Datei.
  - **Token in `Environment=`.** Für andere Benutzer über `systemctl show` lesbar.
  - **`.env` im Repository.** Einmal gepusht, ist es ein Leak.
  - **Erst aufräumen, dann widerrufen.** Das Token bleibt gültig, während du die Historie umschreibst.

  > [!INTERVIEW]
  > „Wie gibst du einem systemd-Dienst ein API-Token?“ Nicht über `Environment=`, weil Umgebungsvariablen über D-Bus sichtbar sind und vererbt werden. Ich lege die Datei in `/etc/credstore/`, am besten mit `systemd-creds` verschlüsselt, und gebe sie mit `LoadCredential=` an den Dienst. Das Programm liest sie aus `$CREDENTIALS_DIRECTORY`.

  > [!MERKE]
  > Bei einem Leak zuerst widerrufen. Alles andere kommt danach.

  ## Zusammenfassung

  - JSON-Logs schreiben ein Ereignis pro Zeile; `getMessage()` setzt die Argumente ein, `json.dumps` hält die Zeile zusammen.
  - Eine Lauf-ID kommt per `ContextVar` und Filter am Handler in jeden Eintrag, auch von Kind-Loggern. Unter systemd passt `INVOCATION_ID`.
  - Unter systemd schreibst du nach stderr; sonst rotiert `RotatingFileHandler`, wenn `maxBytes` und `backupCount` größer als 0 sind.
  - Ein Schwärzungsfilter ist ein Netz, keine Erlaubnis zum Loggen von Geheimnissen.
  - keyring für den Desktop, `.env` für die Entwicklung, `LoadCredential` für Dienste, Secrets für Actions.
  - Leak: widerrufen, ersetzen, prüfen, aufräumen, Ursache abstellen.
exercises:
- id: quelle-waehlen
  type: choice
  title: Wohin mit dem Token?
  prompt: Ein Bericht läuft als systemd-Dienst auf einem Server ohne Desktop und braucht ein API-Token. Was ist die
    passende Lösung?
  options:
  - text: Die Datei in `/etc/credstore/api_token` ablegen und mit `LoadCredential=api_token` an den Dienst geben.
    correct: true
    why: Der Dienst liest das Token aus `$CREDENTIALS_DIRECTORY`; nur sein Benutzer kommt an die Kopie.
  - text: "`Environment=API_TOKEN=…` in die Unit schreiben."
    correct: false
    why: Laut systemd-Dokumentation sind Umgebungsvariablen einer Unit über D-Bus für unprivilegierte Clients sichtbar
      und werden an Kindprozesse vererbt.
  - text: Das Token mit keyring im Schlüsselbund speichern.
    correct: false
    why: Ohne Desktop-Sitzung gibt es meist keinen entsperrten Schlüsselbund, den ein Dienst nutzen könnte.
  - text: Das Token in die `config.toml` im Repository schreiben, das Repository ist privat.
    correct: false
    why: Private Repositorys werden geklont, gesichert und manchmal öffentlich. Das Token wäre in jeder Kopie.
  explanation: Für Dienste sind systemd-Credentials gebaut. Sie trennen das Geheimnis von der Unit-Datei und von der
    Umgebung und lassen sich mit `systemd-creds` verschlüsselt ablegen.
  resources:
  - *systemd
- id: leak-reihenfolge
  type: order
  title: Ein Token ist öffentlich geworden
  prompt: Ein Token steht in einem öffentlichen Commit. Bring die Schritte in eine sinnvolle Reihenfolge.
  lang: prose
  lines: |-
    Token beim Anbieter widerrufen
    Neues Token erzeugen und überall eintragen
    Im Audit-Log prüfen, ob das alte Token benutzt wurde
    Token aus Code, Konfiguration und Logs entfernen
    Ursache abstellen, etwa mit Push Protection
  alternatives:
  - [1, 3, 2, 4, 5]
  - [1, 2, 3, 5, 4]
  - [1, 3, 2, 5, 4]
  explanation: Entscheidend ist der erste Schritt. Solange das Token gültig ist, kann jeder es benutzen, der den Commit
    gesehen hat. Ersetzen und Prüfen dürfen ihre Plätze tauschen, ebenso Aufräumen und Ursache abstellen; Widerrufen
    kommt immer zuerst.
  resources:
  - title: GitHub Docs · About secret scanning
    url: https://docs.github.com/en/code-security/secret-scanning/introduction/about-secret-scanning
- id: adapter-vorhersagen
  type: output
  title: Welche Lauf-ID gewinnt?
  prompt: Welche Ausgabe erzeugt dieses Programm (Python 3.14)?
  lang: python
  code: |-
    import logging
    from sys import stdout

    h = logging.StreamHandler(stdout)
    h.setFormatter(logging.Formatter(
        "%(lauf)s %(message)s"))
    log = logging.getLogger("ad")
    log.handlers = [h]
    log.propagate = False
    a = logging.LoggerAdapter(
        log, {"lauf": "A"})
    a.warning("start")
    a.warning("x", extra={"lauf": "B"})
    b = logging.LoggerAdapter(
        log, {"lauf": "A"},
        merge_extra=True)
    b.warning("y", extra={"lauf": "B"})
  expected: |-
    A start
    A x
    B y
  explanation: |
    Ohne `merge_extra` ersetzt der Adapter das `extra` jedes Aufrufs durch sein eigenes; das `B` beim zweiten Aufruf geht verloren. Mit `merge_extra=True`, verfügbar seit Python 3.13, werden beide zusammengeführt, und der Wert des einzelnen Aufrufs gewinnt.
  resources:
  - *logging
- id: filter-am-logger
  type: output
  title: Wer sieht den Filter?
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    import logging
    from sys import stdout

    class Markiere(logging.Filter):
        def filter(self, r):
            r.msg = "[M] " + r.msg
            return True

    job = logging.getLogger("job")
    h = logging.StreamHandler(stdout)
    job.handlers = [h]
    job.propagate = False
    job.addFilter(Markiere())
    job.warning("a")
    logging.getLogger(
        "job.http").warning("b")
  expected: |-
    [M] a
    b
  explanation: |
    Ein Filter am Logger `job` sieht nur Einträge, die direkt an `job` entstehen. Der Eintrag von `job.http` wandert zwar zum Handler von `job`, aber am Filter vorbei. Hängt der Filter am Handler (`h.addFilter`), erwischt er beide. Für Lauf-IDs und Schwärzen ist das der entscheidende Unterschied.
  resources:
  - title: Python · Filter Objects
    url: https://docs.python.org/3/library/logging.html#filter-objects
