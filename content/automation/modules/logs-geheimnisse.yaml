    hint: Ist er 0, rotiert der Handler nie.
  - label: Formatter setzen
    hint: Handler bekommen ihren Formatter mit einer set-Methode.
  - label: Filter anhängen
    hint: Dieselbe Methode gibt es an Loggern und Handlern.
  - label: ContextVar setzen
    hint: Eine ContextVar hat get und …
  explanation: '`maxBytes` und `backupCount` müssen beide größer als 0 sein, sonst rotiert nichts. Formatter und Filter
    hängen am Handler; so tragen auch Einträge von Kind-Loggern die Lauf-ID. Unter systemd liefert `INVOCATION_ID`
    eine ID, die auch im Journal steht.'
  resources:
  - *handlers
  - *contextvars
- id: json-formatter
  type: code
  title: Ein JSON-Formatter
  prompt: |
    Schreibe die Klasse `JsonLog(logging.Formatter)`. `format(r)` gibt pro Eintrag eine Zeile JSON zurück mit den Schlüsseln `stufe` (Name der Stufe), `logger` (Name des Loggers), `text` (die fertige Meldung mit eingesetzten Argumenten) und `lauf` (das Attribut `lauf` des Eintrags oder `None`, falls es fehlt). Hat der Eintrag eine Exception, kommt `fehler` mit dem Namen ihrer Klasse dazu. Umlaute bleiben lesbar, nicht als `ö`.
  lang: python
  starter: |-
    import json
    import logging

    class JsonLog(logging.Formatter):
        def format(self, r):
            return r.msg
  solution: |-
    import json
    import logging

    class JsonLog(logging.Formatter):
        def format(self, r):
            d = {"stufe": r.levelname,
                 "logger": r.name}
            d["text"] = r.getMessage()
            d["lauf"] = getattr(
                r, "lauf", None)
            e = r.exc_info
            if e:
                k = e[0].__name__
                d["fehler"] = k
            return json.dumps(
                d, ensure_ascii=False)
  setup: |-
    import io
    import itertools
    import json
    import logging

    _nr = itertools.count()

    def logger_mit(formatter):
        """Neuer Logger, der in einen StringIO-Puffer schreibt."""
        puffer = io.StringIO()
        h = logging.StreamHandler(puffer)
        h.setFormatter(formatter)
        log = logging.getLogger(f"test{next(_nr)}")
        log.handlers = [h]
        log.propagate = False
        log.setLevel(logging.DEBUG)
        return log, puffer
  tests:
  - name: Felder und eingesetzte Argumente
    code: |-
      log, out = logger_mit(JsonLog())
      log.warning("%d Zeilen", 3)
      d = json.loads(out.getvalue())
      assert d["stufe"] == "WARNING", d
      assert d["text"] == "3 Zeilen", d
      assert d["logger"] == log.name, d
      assert d["lauf"] is None, d
  - name: Lauf-ID aus extra
    code: |-
      log, out = logger_mit(JsonLog())
      log.info("ok", extra={"lauf": "a1"})
      d = json.loads(out.getvalue())
      assert d["lauf"] == "a1", d
  - name: Exception als Klassenname
    code: |-
      log, out = logger_mit(JsonLog())
      try:
          1 / 0
      except ZeroDivisionError:
          log.exception("kaputt")
      d = json.loads(out.getvalue())
      assert d.get("fehler") == (
          "ZeroDivisionError"), d
  - name: Eine Zeile, Umlaute lesbar
    code: |-
      log, out = logger_mit(JsonLog())
      log.error("Größe\nfalsch")
      text = out.getvalue()
      assert text.count("\n") == 1, (
          f"mehrere Zeilen: {text!r}")
      assert "Größe" in text, text
  hints:
  - '`r.getMessage()` liefert die Meldung mit eingesetzten Argumenten.'
  - '`getattr(r, "lauf", None)` liest ein Attribut, das vielleicht fehlt.'
  - '`r.exc_info` ist bei einer Exception ein Tupel `(Klasse, Exception, Traceback)`.'
  explanation: |
    Der Formatter macht aus einem `LogRecord` genau eine Zeile. `getMessage()` statt `msg` setzt die Argumente ein; sonst stünde dort `%d Zeilen`. `json.dumps` maskiert den Zeilenumbruch, also bleibt auch eine mehrzeilige Meldung eine Zeile, und Werkzeuge wie `jq` lesen Zeile für Zeile. `ensure_ascii=False` hält Umlaute lesbar. Der Klassenname der Exception reicht zum Filtern; den vollen Traceback gibst du nur aus, wenn du weißt, dass keine Geheimnisse darin stehen.
  resources:
  - title: Python · Formatter Objects
    url: https://docs.python.org/3/library/logging.html#formatter-objects
  - title: Python · LogRecord attributes
    url: https://docs.python.org/3/library/logging.html#logrecord-attributes
- id: lauf-id-filter
  type: code
  title: Lauf-ID für alle Logger
  prompt: |
    Schreibe drei Teile:

    - `lauf_id`: eine `ContextVar` mit dem Standardwert `"-"`.
    - `LaufFilter(logging.Filter)`: setzt in jedem Eintrag das Attribut `lauf` auf den aktuellen Wert von `lauf_id` und lässt den Eintrag durch.
    - `einrichten(logger, stream)`: hängt an `logger` genau einen `StreamHandler(stream)` mit dem Format `"%(lauf)s %(name)s: %(message)s"` und dem Filter. Auch Einträge von Kind-Loggern wie `<name>.http` sollen die Lauf-ID bekommen.
  lang: python
  starter: |-
    import contextvars
    import logging

    lauf_id = contextvars.ContextVar(
        "lauf_id", default="-")

    class LaufFilter(logging.Filter):
        def filter(self, r):
            return True

    def einrichten(logger, stream):
        ...
  solution: |-
    import contextvars
    import logging

    lauf_id = contextvars.ContextVar(
        "lauf_id", default="-")

    class LaufFilter(logging.Filter):
        def filter(self, r):
            r.lauf = lauf_id.get()
            return True

    FORMAT = ("%(lauf)s %(name)s: "
              "%(message)s")

    def einrichten(logger, stream):
        h = logging.StreamHandler(
            stream)
        h.setFormatter(
            logging.Formatter(FORMAT))
        h.addFilter(LaufFilter())
        logger.handlers = [h]
  setup: |-
    import contextvars
    import io
    import itertools
    import logging

    _nr = itertools.count()

    def neuer_logger():
        log = logging.getLogger(f"job{next(_nr)}")
        log.propagate = False
        log.setLevel(logging.INFO)
        return log
  tests:
  - name: Lauf-ID im Eintrag
    code: |-
      log, out = neuer_logger(), io.StringIO()
      einrichten(log, out)
      def lauf():
          lauf_id.set("L7")
          log.warning("start")
      contextvars.Context().run(lauf)
      zeile = out.getvalue().strip()
      assert zeile == f"L7 {log.name}: start", (
          zeile)
  - name: Auch der Kind-Logger
    code: |-
      log, out = neuer_logger(), io.StringIO()
      einrichten(log, out)
      kind = logging.getLogger(log.name + ".http")
      def lauf():
          lauf_id.set("L8")
          kind.warning("Timeout")
      contextvars.Context().run(lauf)
      zeile = out.getvalue().strip()
      assert zeile.startswith("L8 "), (
          f"Zeile: {zeile!r}")
  - name: Ohne gesetzte ID steht -
    code: |-
      log, out = neuer_logger(), io.StringIO()
      einrichten(log, out)
      contextvars.Context().run(
          log.warning, "ohne")
      zeile = out.getvalue().strip()
      assert zeile.startswith("- "), zeile
  - name: Zwei Läufe, zwei IDs
    code: |-
      log, out = neuer_logger(), io.StringIO()
      einrichten(log, out)
      def lauf(i):
          lauf_id.set(i)
          log.warning("x")
      contextvars.Context().run(lauf, "A")
      contextvars.Context().run(lauf, "B")
      ids = [z.split()[0] for z in
             out.getvalue().splitlines()]
      assert ids == ["A", "B"], ids
  hints:
  - '`lauf_id.get()` liefert den Wert im aktuellen Kontext oder den Standardwert.'
  - Ein Filter am Logger sieht keine Einträge von Kind-Loggern. Hänge ihn an den Handler.
  explanation: |
    Die `ContextVar` trägt die ID durch den Code, ohne dass jede Funktion einen Parameter dafür braucht. Der Filter liest sie in dem Moment, in dem ein Eintrag entsteht. Er hängt am Handler, weil nur der Handler auch die Einträge von `job.http` sieht. Die Tests laufen jeweils in einem frischen `Context`; so sieht jeder Lauf nur seine eigene ID, wie zwei asyncio-Tasks, die jede eine Kopie des Kontexts bekommen.
  resources:
  - *contextvars
  - title: Python · Filter Objects
    url: https://docs.python.org/3/library/logging.html#filter-objects
- id: schwaerzen
  type: code
  title: Geheimnisse im Log schwärzen
  prompt: |
    Schreibe `Schwaerzen(logging.Filter)`. Der Konstruktor bekommt eine Liste bekannter Geheimnisse. `filter(r)` holt die fertige Meldung, ersetzt darin jedes bekannte Geheimnis durch `***` und jedes Wort nach `Bearer ` ebenfalls durch `***` (aus `Bearer abc` wird `Bearer ***`). Danach steht der Text in `r.msg`, `r.args` ist `None`, und der Eintrag wird durchgelassen. Leere Strings in der Liste werden ignoriert.
  lang: python
  starter: |-
    import logging
    import re

    class Schwaerzen(logging.Filter):
        def __init__(self, werte):
            super().__init__()
            self.werte = werte

        def filter(self, r):
            for w in self.werte:
                r.msg = r.msg.replace(
                    w, "***")
            return True
  solution: |-
    import logging
    import re

    BEARER = re.compile(
        r"Bearer\s+\S+")

    class Schwaerzen(logging.Filter):
        def __init__(self, werte):
            super().__init__()
            self.werte = [
                w for w in werte if w]

        def filter(self, r):
            text = r.getMessage()
            for w in self.werte:
                text = text.replace(
                    w, "***")
            text = BEARER.sub(
                "Bearer ***", text)
            r.msg = text
            r.args = None
            return True
  setup: |-
    import io
    import itertools
    import logging

    _nr = itertools.count()

    def logger_mit(filt):
        puffer = io.StringIO()
        h = logging.StreamHandler(puffer)
        h.addFilter(filt)
        log = logging.getLogger(f"s{next(_nr)}")
        log.handlers = [h]
        log.propagate = False
        return log, puffer
  tests:
  - name: Geheimnis als Argument
    code: |-
      log, out = logger_mit(
          Schwaerzen(["geheim-123"]))
      log.warning("Token %s", "geheim-123")
      text = out.getvalue().strip()
      assert text == "Token ***", text
  - name: Bearer-Header
    code: |-
      log, out = logger_mit(Schwaerzen([]))
      log.warning("Authorization: Bearer eyJ9.x")
      text = out.getvalue().strip()
      assert text == "Authorization: Bearer ***", (
          text)
  - name: Normale Meldungen bleiben gleich
    code: |-
      log, out = logger_mit(
          Schwaerzen(["geheim-123"]))
      log.warning("%d Dateien", 3)
      assert out.getvalue().strip() == (
          "3 Dateien"), out.getvalue()
  - name: Leerer Wert in der Liste
    code: |-
      log, out = logger_mit(
          Schwaerzen(["", "geheim-123"]))
      log.warning("Import fertig")
      text = out.getvalue().strip()
      assert text == "Import fertig", (
          f"zerstört: {text!r}")
  hints:
  - '`r.getMessage()` setzt die Argumente ein; danach steht das Geheimnis im Text, egal wie es übergeben wurde.'
  - '`"abc".replace("", "***")` fügt `***` zwischen jedem Zeichen ein. Filtere leere Werte vorher heraus.'
  - '`re.compile(r"Bearer\s+\S+")` findet das Wort nach `Bearer`.'
  explanation: |
    Der Starter schaut nur in `r.msg`, also in die Vorlage `"Token %s"`. Das Geheimnis kommt aber als Argument und steht erst nach `getMessage()` im Text. Nach dem Ersetzen muss `r.args` auf `None`, sonst versucht der Formatter, Argumente in einen Text ohne Platzhalter einzusetzen. Der leere String ist ein echter Betriebsfall: Ist eine Umgebungsvariable nicht gesetzt, landet `""` in der Liste, und ohne Prüfung würde jede Meldung unlesbar.
  resources:
  - title: Python · Filter Objects
    url: https://docs.python.org/3/library/logging.html#filter-objects
  - title: Python · re.sub
    url: https://docs.python.org/3/library/re.html#re.sub
- id: credential-lesen
  type: code
  title: Ein Geheimnis aus systemd oder der Umgebung
  prompt: |
    Schreibe `lade_geheimnis(name, umgebung)`. `umgebung` ist ein Dictionary wie `os.environ`.

    - Steht in `umgebung` der Schlüssel `CREDENTIALS_DIRECTORY` und gibt es dort eine Datei `name`, gib ihren Inhalt ohne Zeilenumbruch am Ende zurück.
    - Sonst gib `umgebung[name.upper()]` zurück, wenn der Wert nicht leer ist (für die Entwicklung).
    - Sonst wirf `LookupError` mit `name` in der Meldung.
  lang: python
  starter: |-
    import os
    from pathlib import Path

    def lade_geheimnis(name, umgebung):
        return umgebung[name.upper()]
  solution: |-
    from pathlib import Path

    def aus_datei(ordner, name):
        if not ordner:
            return None
        datei = Path(ordner) / name
        if not datei.is_file():
            return None
        text = datei.read_text()
        return text.rstrip("\n")

    def lade_geheimnis(name, umgebung):
        ordner = umgebung.get(
            "CREDENTIALS_DIRECTORY")
        wert = aus_datei(ordner, name)
        if wert is None:
            wert = umgebung.get(
                name.upper())
        if not wert:
            raise LookupError(name)
        return wert
  setup: |-
    from pathlib import Path
    Path("creds").mkdir()
    Path("creds/api_token").write_text("aus-datei\n")
  tests:
  - name: Credential-Datei hat Vorrang
    code: |-
      u = {"CREDENTIALS_DIRECTORY": "creds",
           "API_TOKEN": "aus-umgebung"}
      w = lade_geheimnis("api_token", u)
      assert w == "aus-datei", repr(w)
  - name: Umgebung als Rückfall
    code: |-
      u = {"API_TOKEN": "aus-umgebung"}
      w = lade_geheimnis("api_token", u)
      assert w == "aus-umgebung", repr(w)
  - name: Datei fehlt im Credentials-Ordner
    code: |-
      u = {"CREDENTIALS_DIRECTORY": "creds",
           "SMTP_PASS": "pw"}
      w = lade_geheimnis("smtp_pass", u)
      assert w == "pw", repr(w)
  - name: Nichts da oder leer – LookupError
    code: |-
      for u in ({}, {"API_TOKEN": ""}):
          try:
              lade_geheimnis("api_token", u)
          except LookupError as e:
              assert "api_token" in str(e)
          else:
              assert False, f"{u}: LookupError"
  hints:
  - '`umgebung.get("CREDENTIALS_DIRECTORY")` ist `None`, wenn der Dienst keine Credentials hat.'
  - '`Path(ordner) / name` baut den Pfad; `is_file()` prüft, ob es die Datei gibt.'
  explanation: |
    Unter systemd mit `LoadCredential=api_token` liegt das Token als Datei in `$CREDENTIALS_DIRECTORY` und nicht in der Umgebung. Dateien enden oft mit einem Zeilenumbruch, der im HTTP-Header einen Fehler auslöst; `rstrip("\n")` entfernt ihn. Die Umgebung bleibt als bewusster Rückfall für die Entwicklung. Weil `umgebung` ein Parameter ist, testest du alle Wege ohne echte Umgebungsvariablen, und die Fehlermeldung nennt nur den Namen, nie einen Wert.
  resources:
  - *systemd
- id: logs-auswerten
  type: code
  title: Fehler je Lauf zählen
  prompt: |
    Schreibe `fehler_je_lauf(zeilen)`. `zeilen` sind Zeilen eines Logs; die meisten sind JSON-Objekte mit den Schlüsseln `stufe` und `lauf`, einige stammen von anderen Programmen und sind kein JSON. Zähle je Lauf die Einträge mit `stufe` `"ERROR"` oder `"CRITICAL"` und gib ein Dictionary `{lauf: anzahl}` zurück. Läufe ohne Fehler erscheinen nicht. Zeilen, die kein JSON-Objekt sind, überspringst du.
  lang: python
  starter: |-
    import json

    def fehler_je_lauf(zeilen):
        zaehler = {}
        for z in zeilen:
            d = json.loads(z)
            zaehler[d["lauf"]] = 1
        return zaehler
  solution: |-
    import json
    from collections import Counter

    SCHWER = {"ERROR", "CRITICAL"}

    def lies(zeile):
        try:
            d = json.loads(zeile)
        except ValueError:
            return {}
        if isinstance(d, dict):
            return d
        return {}

    def fehler_je_lauf(zeilen):
        zaehler = Counter()
        for z in zeilen:
            d = lies(z)
            stufe = d.get("stufe")
            if stufe in SCHWER:
                lauf = d.get("lauf")
                zaehler[lauf] += 1
        return dict(zaehler)
  tests:
  - name: Zählt je Lauf
    code: |-
      z = ['{"stufe": "ERROR", "lauf": "a"}',
           '{"stufe": "INFO", "lauf": "a"}',
           '{"stufe": "ERROR", "lauf": "a"}',
           '{"stufe": "CRITICAL", "lauf": "b"}']
      r = fehler_je_lauf(z)
      assert r == {"a": 2, "b": 1}, r
  - name: Läufe ohne Fehler fehlen
    code: |-
      z = ['{"stufe": "WARNING", "lauf": "c"}']
      assert fehler_je_lauf(z) == {}
  - name: Fremde Zeilen überspringen
    code: |-
      z = ["Traceback (most recent call last):",
           "",
           "42",
           '{"stufe": "ERROR", "lauf": "d"}']
      r = fehler_je_lauf(z)
      assert r == {"d": 1}, r
  hints:
  - '`json.loads` wirft bei Nicht-JSON `ValueError`.'
  - '`"42"` ist gültiges JSON, aber kein Objekt. Prüfe mit `isinstance(d, dict)`.'
  explanation: |
    JSON-Logs sind Daten, die du mit ein paar Zeilen Python auswertest, statt sie mit regulären Ausdrücken zu zerlegen. Echte Logs sind aber nie ganz sauber: Ein Traceback, eine Leerzeile oder die Ausgabe eines anderen Programms landet dazwischen. Die Funktion bleibt robust, indem sie fremde Zeilen überspringt, statt beim ersten Fehler abzubrechen; eine Zahl wie `42` ist gültiges JSON, aber kein Eintrag.
  resources:
  - title: Python · json.loads
    url: https://docs.python.org/3/library/json.html#json.loads
- id: environment-in-unit
  type: bug
  title: Ein Kollege sieht das Token
  prompt: |
    Ein Kollege ohne Root-Rechte hat mit `systemctl show bericht.service` das API-Token gesehen. Das Programm liest das Token bereits mit `lade_geheimnis("api_token", os.environ)` aus der vorigen Aufgabe, die Datei liegt in `/etc/credstore/api_token`. Finde die Zeile, die das Token offenlegt, und ersetze sie.
  lang: ini
  code: |-
    [Unit]
    Description=Täglicher Bericht

    [Service]
    Type=oneshot
    ExecStart=/opt/bericht/run.py
    Environment=API_TOKEN=geheim-123
  lines:
  - 7
  fix:
  - line: 7
    answers:
    - LoadCredential=api_token
    - LoadCredential=api_token:/etc/credstore/api_token
    - LoadCredentialEncrypted=api_token
  explanation: |
    Werte aus `Environment=` sind Eigenschaften der Unit und für unprivilegierte Clients über D-Bus lesbar, also auch über `systemctl show`. Außerdem erbt jeder Kindprozess sie. `LoadCredential=api_token` liest die Datei aus `/etc/credstore/` und legt eine Kopie in `$CREDENTIALS_DIRECTORY` ab, die nur der Benutzer des Dienstes lesen kann. Das alte Token gilt nach diesem Vorfall als geleakt und wird widerrufen.
  resources:
  - *systemd
- id: actions-secret
  type: explain
  title: Ein Secret im Workflow
  prompt: Erkläre, was dieser Ausschnitt eines GitHub-Actions-Workflows mit dem Secret macht, was GitHub dabei schützt
    und was nicht.
  lang: yaml
  code: |-
    steps:
      - run: python -m pytest
        env:
          TOKEN: ${{ secrets.TOKEN }}
      - run: python bericht.py
        env:
          TOKEN: ${{ secrets.TOKEN }}
  points:
  - Das Secret kommt als Umgebungsvariable nur in die Schritte, die es nennen, nicht in die Befehlszeile.
  - GitHub ersetzt den genauen Wert in der Ausgabe durch Sternchen, abgeleitete oder umgeformte Werte aber nicht.
  - Läufe aus Forks bekommen das Secret nicht; Tests, die es brauchen, scheitern dort.
  - Die Tests sollten mit Fakes laufen und das echte Token gar nicht brauchen.
  explanation: |
    `secrets.TOKEN` wird zur Laufzeit eingesetzt und nur an die genannten Schritte weitergegeben. GitHub empfiehlt, Secrets nicht über die Befehlszeile zu übergeben, weil andere Prozesse diese sehen können; die Umgebungsvariable ist der bessere Weg. Die Schwärzung in der Ausgabe erkennt nur den exakten Wert. Gibt ein Programm das Token in Base64 oder als Teil einer URL aus, steht es lesbar im Log. Dass die Testschritte das Secret bekommen, ist hier unnötig: Tests mit Fakes brauchen kein echtes Token, und weniger Schritte mit Zugang heißt weniger Stellen, an denen es herauskommen kann.
  resources:
  - *actions
