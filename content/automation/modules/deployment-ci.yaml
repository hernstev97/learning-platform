id: deployment-ci
title: Deployment & Continuous Integration
level: 3
minutes: 170
summary: 'Automationen reproduzierbar prüfen und betreiben: GitHub Actions, feste Artefakte, Umgebungsvariablen,
  Container und überprüfbare Releases.'
goals:
- Du trennst Prüfung, Artefaktbau, Veröffentlichung und Laufzeitabnahme.
- Du schreibst einen GitHub-Actions-Workflow mit begrenzten Rechten und Laufzeit.
- Du behandelst Secrets und Konfiguration als Laufzeiteingaben.
- Du prüfst ein auslieferbares Artefakt in einer frischen Umgebung und planst einen Rückweg.
resources:
- &id001
  title: GitHub · Workflow syntax
  url: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
- title: uv · GitHub Actions integration
  url: https://docs.astral.sh/uv/guides/integration/github/
- title: Docker · Build best practices
  url: https://docs.docker.com/build/building/best-practices/
- title: Python · hashlib
  url: https://docs.python.org/3/library/hashlib.html
lesson: |
  Dein Skript läuft lokal und soll nun regelmäßig ohne dein geöffnetes Terminal arbeiten. Ein Repository allein ist noch keine Installation, ein grüner Testlauf noch kein beobachteter Betrieb. Deployment verbindet eine konkrete Quellversion mit einem prüfbaren Artefakt, einer konfigurierten Umgebung und einem tatsächlichen Lauf.

  Beginne klein: standardisierte Prüfkommandos, ein nachvollziehbarer Build und eine dokumentierte Startanweisung. Ergänze nur die Infrastruktur, die der Auftrag braucht. Eine tägliche Dateiauswertung kann als Systemdienst laufen; ein zeitlich begrenzter Bericht kann in einem CI-Runner passen. Dauerhafter Zustand und Geheimnisse dürfen dabei nicht zufällig von deinem Entwicklungsrechner abhängen.

  ## Vier getrennte Erfolgsaussagen

  Tests prüfen bestimmte Verhaltensverträge. Ein Build erzeugt ein installierbares Paket oder Image. Veröffentlichung macht dieses Artefakt für eine Zielumgebung verfügbar. Ein Smoke-Test bestätigt anschließend einen wichtigen echten Ablauf. Jeder Schritt kann erfolgreich sein, während der nächste noch scheitert.

  ```python run
  zustand = {"tests": True, "build": True, "installiert": False, "smoke": False}
  print(all(zustand.values()))
  ```

  Ein fehlendes Secret wird etwa erst beim Start sichtbar. Ein falsches Arbeitsverzeichnis kann einen in CI grünen Import im Betrieb scheitern lassen. Beschreibe daher im Releasebericht genau, was geprüft wurde. „CI grün“ ist eine konkrete Aussage; „alles funktioniert“ ohne Laufzeitnachweis wäre zu weitgehend.

  Nutze für jede Auslieferung eine eindeutige Version oder Commit-ID. Wenn ein Fehler auftritt, musst du wissen, welcher Code und welche Konfiguration liefen. Ein Dateiname wie `neu-final.zip` ist kein verlässliches Versionsmodell.

  ## Ein reproduzierbarer CI-Workflow

  GitHub Actions liest Workflows unter `.github/workflows/`. Ereignisse lösen Jobs aus, Jobs bestehen aus Schritten auf einem Runner. Die [Workflow-Syntax](https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax) beschreibt unter anderem Rechte, Abhängigkeiten und Zeitlimits. Für ein uv-Projekt kann eine Prüfpipeline so aussehen:

  ```yaml
  name: Python prüfen
  on: [push, pull_request]
  permissions:
    contents: read
  jobs:
    check:
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
        - uses: actions/checkout@v7
          with:
            persist-credentials: false
        - uses: astral-sh/setup-uv@v9.0.0
          with:
            python-version: "3.14"
        - run: uv sync --locked
        - run: uv run --locked ruff check .
        - run: uv run --locked ruff format --check .
        - run: uv run --locked pytest
        - run: uv build
  ```

  Die Major-Versionen entsprechen den bei Erstellung geprüften Anbieterbeispielen. Für eine streng fixierte Lieferkette pinnt dein Projekt Actions auf überprüfte Commit-SHAs und aktualisiert sie bewusst. Die [uv-Integration](https://docs.astral.sh/uv/guides/integration/github/) zeigt auch die Fixierung der uv-Version und Cache-Konfiguration. Ein beweglicher Major-Tag ist bequemer, aber kein unveränderlicher Inhalt.

  Die Entwicklungsabhängigkeiten Ruff und pytest gehören in die Projektdefinition. `--locked` verhindert, dass CI eine veraltete Lockdatei still repariert. Die Formatprüfung verändert nichts; sie meldet Abweichungen. Ein Cache spart Downloads, darf aber nicht Voraussetzung für einen erfolgreichen sauberen Aufbau sein.

  ## Unvertrauenswürdige Eingaben und Geheimnisse

  Pull-Request-Code ist ausführbarer Code. Gib einem Prüflauf deshalb nur Rechte, die er benötigt, und keine produktiven Zugangsdaten. GitHub dokumentiert [sichere Verwendung von Workflows](https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions). Ein Wechsel des Ereignistyps kann den Vertrauenskontext ändern und ist keine harmlose Reparatur für fehlende Secrets.

  Geheimnisse werden über dafür vorgesehene Konfiguration bereitgestellt und nicht im Repository gespeichert. Die Anwendung validiert nur das Vorhandensein benötigter Werte; sie druckt deren Inhalt nicht aus. Auch ein Debug-Dump der gesamten Umgebung wäre ein Datenleck.

  ```python run
  def fehlende_variablen(umgebung, namen):
      return [name for name in namen if not umgebung.get(name, "").strip()]
  print(fehlende_variablen({"API_URL": "https://example.org", "API_TOKEN": ""}, ["API_URL", "API_TOKEN"]))
  ```

  Der Fehlerbericht nennt den Variablennamen, nicht den geheimen Wert. Konfiguration hat außerdem fachliche Grenzen: Eine nichtleere URL ist nicht automatisch ein erlaubtes Ziel, und ein Port muss numerisch im gültigen Bereich liegen. Prüfe diese Regeln vor einer externen Wirkung.

  ## Geplante CI-Läufe sind begrenzte Jobs

  Ein Workflow kann durch `workflow_dispatch` manuell oder durch `schedule` geplant starten. Die aktuelle [Schedule-Syntax](https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#onschedule) erlaubt auch eine ausdrücklich benannte Zeitzone. Prüfe die Plattformdokumentation, wenn du bestehende Workflows übernimmst.

  ```yaml
  on:
    workflow_dispatch:
    schedule:
      - cron: "17 8 * * *"
        timezone: "Europe/Berlin"
  concurrency:
    group: tagesbericht
    cancel-in-progress: false
  ```

  Ein geplanter CI-Lauf ist kein harter Echtzeitdienst. Warteschlangen und Plattformbedingungen können den tatsächlichen Start beeinflussen. Die [Ereignisdokumentation](https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule) beschreibt Einschränkungen, unter anderem den Bezug zum Default-Branch. Wenn ein Auftrag minutenexakt garantiert werden muss, ist eine andere Betriebsstrategie zu prüfen.

  Concurrency begrenzt parallele Läufe einer Gruppe, ersetzt aber keine fachliche Idempotenz. Pending-Läufe und wiederholte Ereignisse müssen nach dem Plattformvertrag beurteilt werden. Ein Runner ist normalerweise kurzlebig; dauerhaft benötigte Fortschrittsdaten gehören in einen bewusst gewählten Speicher, nicht nur in sein Arbeitsverzeichnis.

  ## Artefakte identifizieren und außerhalb testen

  Ein Wheel oder Archiv sollte einen nachvollziehbaren Namen, eine Quellrevision und möglichst einen Inhaltshash besitzen. [`hashlib`](https://docs.python.org/3/library/hashlib.html) kann den Hash berechnen. Ein Hash erkennt eine Änderung relativ zu einer vertrauenswürdigen Referenz; er beweist allein weder Urheberschaft noch Vertrauenswürdigkeit.

  ```python run
  import hashlib
  artefakt = b"beispielinhalt"
  print(len(hashlib.sha256(artefakt).hexdigest()))
  print(hashlib.sha256(artefakt).digest() == hashlib.sha256(artefakt).digest())
  ```

  Installiere das gebaute Wheel in eine frische Umgebung außerhalb des Quellverzeichnisses. Starte die echte CLI mit einer kleinen kontrollierten Eingabe und prüfe das Ergebnis. Damit findest du fehlende Paketdateien und versehentlich nur lokal verfügbare Abhängigkeiten.

  ```console
  $ uv build
  $ uv venv /tmp/bericht-abnahme
  $ uv pip install --python /tmp/bericht-abnahme/bin/python dist/bericht_cli-0.1.0-py3-none-any.whl
  $ /tmp/bericht-abnahme/bin/bericht --help
  ```

  `--help` prüft nur den Einstieg. Ein zusätzlicher Testlauf mit Beispielkonfiguration muss die eigentliche Kernfunktion erreichen. Dokumentiere seinen erwarteten Output und wo temporäre Daten landen. Der Test darf keine echten Benachrichtigungen oder produktiven Änderungen auslösen.

  ## Container als definierte Laufzeit

  Ein Container kann Interpreter und Systemabhängigkeiten bündeln. Er ersetzt keine Tests, keine Geheimnisverwaltung und keinen dauerhaften Speicher. Die [Docker-Buildempfehlungen](https://docs.docker.com/build/building/best-practices/) behandeln kleine Images, Cache und reproduzierbare Eingaben.

  ```dockerfile
  FROM python:3.14-slim
  WORKDIR /app
  COPY dist/bericht_cli-0.1.0-py3-none-any.whl /tmp/bericht_cli-0.1.0-py3-none-any.whl
  RUN pip install --no-cache-dir /tmp/bericht_cli-0.1.0-py3-none-any.whl
  RUN useradd --create-home app
  USER app
  ENTRYPOINT ["bericht"]
  ```

  Bewahre beim Kopieren den vollständigen Wheel-Dateinamen: Seine Struktur enthält Paketversion und Kompatibilitätstags und wird bei der Installation ausgewertet. Das Beispiel setzt ein bereits gebautes Wheel mit genau diesem Namen voraus. Hat dein Projekt eine andere Version, müssen Quelle und Installationspfad zusammen angepasst werden. Prüfe das fertige Image mit einer kontrollierten Beispieleingabe, statt allein aus einem erfolgreichen Docker-Build auf einen funktionierenden Auftrag zu schließen.

  Ein nichtprivilegierter Nutzer braucht passende Rechte auf explizit eingebundene Datenverzeichnisse. `.dockerignore` hält `.env`, `.venv` und unnötige Arbeitsdateien aus dem Buildkontext. Für feste Releases kannst du ein geprüftes Basisimage per Digest pinnen; der Digest muss zum tatsächlich geprüften Image gehören.

  ## Häufige Fehler und Rückweg

  Ein Deployment ohne Rückweg macht kleine Fehler unnötig teuer. Bewahre das vorige bekannte Artefakt und dokumentiere, wie es wieder gestartet wird. Datenänderungen können einen einfachen Code-Rollback verhindern; Versionen von Konfiguration und Schema müssen deshalb zusammenpassen. Ein Rollback ist erst hilfreich, wenn auch danach ein Smoke-Test den wichtigen Ablauf bestätigt.

  > [!PRAXIS]
  > Halte pro Release Revision, Artefakt, Prüfresultat und Startkommando fest. So kann jemand den Zustand ohne deine Shellhistorie reproduzieren.

  > [!INTERVIEW]
  > „Was prüfst du nach einem grünen Build?“ Installation, Konfiguration und einen echten Kernpfad in der Zielumgebung. Ein Compiler kennt weder fehlende Runtime-Secrets noch die Erreichbarkeit eines externen Dienstes.

  > [!MERKE]
  > Ein veröffentlichtes Artefakt und ein funktionierender Betrieb sind getrennte Nachweise.

  ## Zusammenfassung

  - Trenne CI, Build, Veröffentlichung und Smoke-Test.
  - Fixiere nachvollziehbare Versionen und Abhängigkeiten.
  - Begrenze Rechte, Laufzeit und Geheimniszugriff.
  - Plane CI-Jobs ohne Echtzeit- oder Persistenzillusionen.
  - Prüfe das installierte Artefakt außerhalb des Arbeitsbaums.
  - Dokumentiere Zustand und Rückweg eines Releases.
exercises:
- id: nachweise
  type: choice
  title: Was sagt ein grüner Build?
  prompt: Welche Aussage ist korrekt?
  options:
  - text: Das Artefakt wurde gebaut; Runtime und Kernfunktion brauchen weitere Prüfung.
    correct: true
    why: Build und Betrieb haben verschiedene Eingaben.
  - text: Alle produktiven Secrets sind gültig.
    correct: false
    why: Ein Build muss sie nicht einmal verwenden.
  - text: Der geplante Job wird garantiert sekundengenau starten.
    correct: false
    why: Ein CI-Scheduler gibt keine allgemeine Echtzeitgarantie.
  explanation: Ein Nachweis gilt für den tatsächlich ausgeführten Schritt. Eine präzise Freigabe verbindet mehrere
    Nachweise statt sie gleichzusetzen.
  resources:
  - *id001
- id: release
  type: order
  title: Ein überprüfbarer Release
  prompt: Ordne den Ablauf einer einfachen Veröffentlichung.
  lang: python
  lines: |-
    # Quellrevision festlegen
    # Lint und Tests ausführen
    # Artefakt bauen
    # Artefakt in frischer Umgebung installieren
    # Kernpfad mit kontrollierten Daten prüfen
    # Geprüftes Artefakt veröffentlichen
  explanation: Die Reihenfolge hält das geprüfte Objekt nachvollziehbar. Für den tatsächlichen Betrieb folgt nach
    Veröffentlichung zusätzlich ein Zielumgebungs-Smoke-Test.
  resources:
  - *id001
- id: hash
  type: output
  title: Ändert sich der Inhalt?
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    import hashlib
    a = hashlib.sha256(b"version 1").hexdigest()
    b = hashlib.sha256(b"version 2").hexdigest()
    print(len(a))
    print(a == b)
  expected: |-
    64
    False
  explanation: SHA-256 wird hexadezimal als 64 Zeichen dargestellt. Der andere Inhalt erzeugt in diesem Beispiel
    einen anderen Hash.
  resources:
  - *id001
- id: freigabe
  type: output
  title: Alle Bedingungen brauchen Erfolg
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    tests = True
    smoke = False
    print(tests and smoke)
    print(tests or smoke)
  expected: |-
    False
    True
  explanation: and verlangt beide Erfolge. or würde hier schon trotz fehlgeschlagenem Smoke-Test freigeben.
  resources:
  - *id001
- id: env-check
  type: code
  title: Fehlende Konfiguration melden
  prompt: 'Schreibe `fehlend(env, pflicht)`: Liefere die Pflichtnamen mit fehlendem oder nur aus Leerraum bestehendem
    Stringwert in Eingabereihenfolge. Gib niemals Werte zurück.'
  lang: python
  starter: |-
    def fehlend(env, pflicht):
        ...
  solution: |-
    def fehlend(env, pflicht):
        return [name for name in pflicht if not env.get(name, "").strip()]
  tests:
  - name: Fehlender Name
    code: assert fehlend({"A":"ok"},["A","B"])==["B"]
  - name: Leerraum
    code: assert fehlend({"A":" ","B":""},["B","A"])==["B","A"]
  - name: Keine Werte
    code: assert fehlend({"TOKEN":"geheim"},["TOKEN"])==[]
  explanation: Die Funktion prüft Verfügbarkeit und zeigt nur Feldnamen. Fachliche URL-, Port- oder Rechteprüfung
    ist eine weitere Schicht.
  resources:
  - *id001
- id: manifest
  type: code
  title: Ein kleines Artefaktmanifest
  prompt: 'Schreibe `manifest(name, inhalt, revision)`: inhalt ist bytes. Liefere ein Dictionary mit name, revision,
    bytes als Länge und sha256 als Hexdigest.'
  lang: python
  starter: |-
    def manifest(name, inhalt, revision):
        ...
  solution: |-
    import hashlib
    def manifest(name, inhalt, revision):
        return {"name": name, "revision": revision, "bytes": len(inhalt), "sha256": hashlib.sha256(inhalt).hexdigest()}
  tests:
  - name: Metadaten
    code: m=manifest("app.whl",b"abc","abc123"); assert m["name"]=="app.whl" and m["revision"]=="abc123" and m["bytes"]==3
  - name: Hash
    code: assert manifest("a",b"abc","r")["sha256"]=="ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
  - name: Leer
    code: assert manifest("a",b"","r")["bytes"]==0
  explanation: Das Manifest verbindet Inhalt und Herkunftshinweis. Die Revision ist eine Behauptung des Buildprozesses;
    ihre Vertrauenswürdigkeit hängt zusätzlich von dessen Herkunft und Schutz ab.
  resources:
  - *id001
- id: locked
  type: command
  title: Reproduzierbar installieren
  prompt: Synchronisiere die uv-Projektumgebung und lehne eine nicht passende Lockdatei mit --locked ab.
  answers:
  - uv sync --locked
  explanation: Die Lockdatei darf in der Prüfung nicht still aktualisiert werden. Sonst testet CI unter Umständen
    eine andere Auflösung als die reviewte.
  resources:
  - *id001
- id: gate
  type: code
  title: Nur geprüfte Releases freigeben
  prompt: 'Schreibe `freigabe(branch, tests, smoke)`: Liefere True genau für branch main und beide booleschen Prüfergebnisse
    True.'
  lang: python
  starter: |-
    def freigabe(branch, tests, smoke):
        ...
  solution: |-
    def freigabe(branch, tests, smoke):
        return branch == "main" and tests and smoke
  tests:
  - name: Freigabe
    code: assert freigabe("main",True,True) is True
  - name: Falscher Branch
    code: assert freigabe("feature",True,True) is False
  - name: Fehler
    code: assert freigabe("main",True,False) is False and freigabe("main",False,True) is False
  explanation: Die drei Bedingungen sind gemeinsam erforderlich. Eine reale Plattformberechtigung wird separat durch
    Repository- und Umgebungsregeln abgesichert.
  resources:
  - *id001
- id: or-gate
  type: bug
  title: Ein fehlgeschlagener Smoke-Test wird übergangen
  prompt: Freigabe soll nur bei beiden Erfolgen gelten. Korrigiere die Bedingung.
  lang: python
  code: |-
    def bereit(tests, smoke):
        return tests or smoke
  lines:
  - 2
  fix:
  - line: 2
    answers:
    - return tests and smoke
  explanation: or reicht bereits ein einzelner Erfolg. and bildet den gemeinsamen Freigabevertrag ab.
  resources:
  - *id001
- id: cache
  type: explain
  title: Cache ist kein Zustandsspeicher
  prompt: Erkläre, warum ein wiederverwendeter Paketcache keine geeignete dauerhafte Jobdatenbank ist.
  lang: python
  code: |-
    cache_key = "python-pakete-lockdatei"
    letzter_erfolg = "2026-09-28"
  points:
  - Paketcache dient der Beschleunigung reproduzierbarer Installation.
  - Cacheeinträge können fehlen oder verworfen werden.
  - Fachlicher Fortschritt braucht einen bewusst dauerhaften Speicher.
  - Ein sauberer Build muss auch ohne Cache möglich sein.
  explanation: Ein Cache darf jederzeit neu aufgebaut werden können. Ein Erfolgstagebuch enthält dagegen fachliche
    Information, deren Verlust zu doppelter oder fehlender Arbeit führen kann.
  resources:
  - *id001
- id: ci-artefakt
  type: practice
  title: Ein Paket durch CI prüfen
  prompt: Richte in einem eigenen Übungsrepository einen Workflow ein, der Ruff, pytest und uv build ausführt. Prüfe
    das Wheel anschließend außerhalb des Repos und halte den Nachweis im README fest.
  lang: yaml
  solution: |-
    name: Prüfen
    on: [push, pull_request]
    permissions:
      contents: read
    jobs:
      check:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
          - uses: actions/checkout@v7
          - uses: astral-sh/setup-uv@v9.0.0
            with:
              python-version: "3.14"
          - run: uv sync --locked
          - run: uv run --locked ruff check .
          - run: uv run --locked pytest
          - run: uv build
  checklist:
  - Workflow läuft auf der beabsichtigten Revision.
  - Ein absichtlich fehlschlagender Test macht den Job rot.
  - Keine produktiven Secrets werden für Tests benötigt.
  - Wheelname bleibt bei Kopie und Installation vollständig erhalten.
  - Eine frische Installation und ein echter Beispielauftrag sind dokumentiert.
  explanation: Die Übung erzeugt einen reproduzierbaren Prüfpfad. Sie veröffentlicht absichtlich kein Paket automatisch;
    eine spätere Auslieferung muss das tatsächlich geprüfte Artefakt verwenden.
  resources:
  - *id001
