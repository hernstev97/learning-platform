- id: budget
  type: output
  title: Die Grenze einschließen
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    def passt(bisher, neu, limit):
        return bisher + neu <= limit
    print(passt(80,20,100))
    print(passt(80,21,100))
  expected: |-
    True
    False
  explanation: Der Vertrag erlaubt Kosten bis einschließlich der Grenze. Eine geschätzte neue Anfrage oberhalb des
    Budgets wird vor dem Aufruf abgewiesen.
  resources:
  - *id001
- id: schema
  type: code
  title: Nur erlaubte Kategorien
  prompt: 'Schreibe `kategorie(text)`: Parse JSON. Erlaubt ist ausschließlich ein Objekt mit genau kategorie als
    Schlüssel und einem String aus rechnung, termin, sonstiges. Sonst ValueError.'
  lang: python
  starter: |-
    def kategorie(text):
        ...
  solution: |-
    import json
    def kategorie(text):
        daten = json.loads(text)
        if not isinstance(daten, dict) or set(daten) != {"kategorie"}:
            raise ValueError("Falsche Struktur")
        wert = daten["kategorie"]
        if not isinstance(wert, str) or wert not in {"rechnung", "termin", "sonstiges"}:
            raise ValueError("Unbekannte Kategorie")
        return wert
  tests:
  - name: Gültig
    code: assert kategorie('{"kategorie":"termin"}')=="termin"
  - name: Zusatzaktion
    code: |-
      try:
          kategorie('{"kategorie":"termin","action":"delete"}')
      except ValueError:
          pass
      else:
          assert False, "Zusatzfeld muss abgelehnt werden"
  - name: Falsche Formen
    code: |-
      for text in ["[]",'{"kategorie":3}','{"kategorie":"geheim"}']:
          try:
              kategorie(text)
          except ValueError:
              pass
          else:
              assert False, text
  explanation: Die feste Struktur verhindert, dass überraschende Zusatzfelder unbemerkt in spätere Verarbeitung
    gelangen. Sie beweist weiterhin nicht die sachliche Richtigkeit des gewählten Labels.
  resources:
  - *id001
- id: kosten
  type: code
  title: Ein Anfragenbudget prüfen
  prompt: Schreibe `budget_ok(verbraucht, anfrage, maximum)` für nichtnegative ganze Kosteneinheiten. Liefere bool,
    ob die Summe innerhalb der Grenze liegt; bei irgendeinem negativen Wert ValueError.
  lang: python
  starter: |-
    def budget_ok(verbraucht, anfrage, maximum):
        ...
  solution: |-
    def budget_ok(verbraucht, anfrage, maximum):
        if min(verbraucht, anfrage, maximum) < 0:
            raise ValueError("Kosten müssen nichtnegativ sein")
        return verbraucht + anfrage <= maximum
  tests:
  - name: Grenze
    code: assert budget_ok(80,20,100) is True
  - name: Darüber
    code: assert budget_ok(80,21,100) is False
  - name: 'Null'
    code: assert budget_ok(0,0,0) is True
  - name: Negativ
    code: |-
      try:
          budget_ok(0,-1,100)
      except ValueError:
          pass
      else:
          assert False
  explanation: Ganze konfigurierte Einheiten vermeiden unnötige Float-Rundung in dieser Aufgabe. Eine echte Kostenkontrolle
    muss die tatsächliche Abrechnung mit der vorherigen Schätzung abgleichen.
  resources:
  - *id001
- id: daten-parsen
  type: gap
  title: Daten statt Code lesen
  prompt: Ergänze die JSON-Lesefunktion.
  lang: python
  code: |-
    import json
    daten = json.⟦loads⟧(modelltext)
  explanation: loads interpretiert eine Datensyntax. eval oder exec würden dagegen Python-Code aus einer nicht vertrauenswürdigen
    Quelle ausführen.
  resources:
  - *id001
  gaps:
  - label: Daten statt Code lesen
    hint: Die Variante mit abschließendem s liest einen String statt eines Dateiobjekts.
- id: evaluation
  type: code
  title: Fehlerfälle sichtbar machen
  prompt: 'Schreibe `fehlerfaelle(faelle)`: Jeder Eintrag hat id, soll, ist. Liefere IDs mit ungleichen soll/ist
    in Eingabereihenfolge. Ein ist=None zählt ebenfalls als Fehler.'
  lang: python
  starter: |-
    def fehlerfaelle(faelle):
        ...
  solution: |-
    def fehlerfaelle(faelle):
        return [f["id"] for f in faelle if f["soll"] != f["ist"]]
  tests:
  - name: Gemischt
    code: assert fehlerfaelle([{"id":"a","soll":"termin","ist":"termin"},{"id":"b","soll":"rechnung","ist":"sonstiges"}])==["b"]
  - name: Ausfall
    code: assert fehlerfaelle([{"id":"a","soll":"termin","ist":None}])==["a"]
  - name: Leer
    code: assert fehlerfaelle([])==[]
  explanation: Technische Ausfälle verschwinden nicht aus der Evaluation. Sie beeinflussen die praktische Nutzbarkeit
    ebenso wie eine falsche Klassifikation.
  resources:
  - *id001
- id: eval
  type: bug
  title: Die Modellantwort wird ausgeführt
  prompt: Der Code soll einen JSON-String als Daten lesen. Die aktuelle Zeile kann fremden Python-Code ausführen.
    Korrigiere sie.
  lang: python
  code: |-
    import json
    def lese(text):
        return eval(text)
  lines:
  - 3
  fix:
  - line: 3
    answers:
    - return json.loads(text)
  explanation: Die Eingabe ist ein unzuverlässiger Text. Ein Datenparser begrenzt die akzeptierte Syntax und führt
    keine darin enthaltenen Python-Anweisungen aus.
  resources:
  - *id001
- id: fallback
  type: explain
  title: Warum nicht einfach sonstiges?
  prompt: Erkläre den Unterschied zwischen Kategorie und technischem Prüfstatus.
  lang: python
  code: |-
    try:
        kategorie = klassifizieren(text)
    except (TimeoutError, ValueError):
        return {"status": "zur_pruefung", "kategorie": None}
    return {"status": "vorschlag", "kategorie": kategorie}
  points:
  - Timeout und ungültige Antwort sind keine erfolgreiche Klassifikation.
  - None bewahrt die fehlende Kategorie.
  - zur_pruefung macht den offenen Fall sichtbar.
  - sonstiges wäre eine fachliche Aussage und deshalb ein irreführender Fehlerersatz.
  explanation: Der Fallback erhält Unsicherheit als eigenen Zustand. Dadurch kann eine Person oder spätere Verarbeitung
    den Fall gezielt behandeln, statt einen Ausfall als gültiges Label zu übernehmen.
  resources:
  - *id001
- id: klassifikation
  type: practice
  title: Eine begrenzte Sortierhilfe
  prompt: Baue eine Pipeline mit Fake-Modell, JSON-Validierung und mindestens zwölf festen Testfällen. Sie darf
    nur Vorschläge speichern und keine externen Aktionen ausführen.
  lang: python
  solution: |-
    def pipeline(text, modell, validiere):
        if not text.strip():
            return {"status": "zur_pruefung", "kategorie": None}
        try:
            antwort = modell({"aufgabe": "klassifizieren", "text": text})
            label = validiere(antwort)
        except (TimeoutError, ValueError):
            return {"status": "zur_pruefung", "kategorie": None}
        return {"status": "vorschlag", "kategorie": label}
  checklist:
  - Testfälle enthalten klare, mehrdeutige und leere Texte.
  - Ein Anweisungsversuch im Text erzeugt keine zusätzliche Aktion.
  - Timeout und ungültiges JSON führen zu sichtbarem Prüfbedarf.
  - Prompt-, Schema- und Adapterversion sind dokumentiert.
  - Ein späterer echter API-Test braucht bewusst ausgewählte Daten und ein Kostenlimit.
  explanation: Die Übung verbindet einen kleinen Auftrag mit messbarer Qualität und einer engen Wirkungsgrenze.
    Der Fake prüft die Pipeline; die Eignung eines echten Modells muss anschließend auf dem festgelegten Prüfsatz
    beobachtet werden.
  resources:
  - *id001
