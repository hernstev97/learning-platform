- id: quote
  type: output
  title: Eine kleine Evaluation
  prompt: Welche Ausgabe erzeugt dieses Programm?
  lang: python
  code: |-
    paare = [("a","a"),("b","a"),("a","a"),("b","b")]
    print(sum(soll == ist for soll, ist in paare))
