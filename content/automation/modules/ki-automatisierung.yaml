  title: Wer darf eine Aktion erlauben?
  prompt: Eine Modellantwort enthält action="delete_all". Welche Reaktion passt?
  options:
  - text: Die Anwendung prüft feste erlaubte Aktionen und lehnt den unbekannten Vorschlag ab.
    correct: true
    why: Das Modell kann sich keine neuen Fähigkeiten erteilen.
  - text: Die Aktion wird ausgeführt, weil JSON gültig ist.
    correct: false
    why: Gültige Daten sind keine Berechtigung.
  - text: Ein selbst angegebener confidence-Wert von 1 reicht als Autorisierung.
    correct: false
    why: Selbstbewertung verleiht keine Rechte und beweist keine Wahrheit.
  explanation: Struktur, fachliche Richtigkeit und Autorisierung sind verschiedene Prüfungen. Die Wirkung wird durch
