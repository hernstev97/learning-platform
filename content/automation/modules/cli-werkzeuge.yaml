lesson: |
  Dein Aufräumskript aus den letzten Modulen funktioniert. Dann fragt ein Kollege, ob er es auch benutzen kann – mit einem anderen Ordner, ohne Trockenlauf, und bitte so, dass es in seine Pipeline mit `jq` passt. Plötzlich reicht „Pfad oben im Code ändern“ nicht mehr. Ein **Werkzeug** braucht eine Hilfe, verständliche Fehlermeldungen, Konfiguration, Logging und ein Verhalten, auf das sich Shell-Skripte, cron und CI verlassen können.

  Diese Lektion zeigt, wie ein Python-Programm zu einem guten Bürger der Kommandozeile wird: Argumente mit `argparse`, die drei Standardströme, Exit-Codes, Konfiguration mit klarem Vorrang, Logging und am Ende die Installation als eigener Befehl.

  ## argparse: vom Aufruf zum Namespace

  [`argparse`](https://docs.python.org/3/library/argparse.html) übersetzt die Liste der Argumente in ein `Namespace`-Objekt, erzeugt `--help` und meldet Fehler. Das [Argparse Tutorial](https://docs.python.org/3/howto/argparse.html) führt Schritt für Schritt hinein; hier das Denkmodell an einem vollständigen Beispiel:

  ```python run
  import argparse
  from pathlib import Path

  parser = argparse.ArgumentParser(prog="konvert", description="Konvertiert Exporte.")
  parser.add_argument("dateien", nargs="+", type=Path, help="Eingabedateien")
  parser.add_argument("-f", "--format", choices=["csv", "json"], default="csv")
  parser.add_argument("-o", "--ausgabe", type=Path, help="Zieldatei (Standard: stdout)")
  parser.add_argument("-n", "--dry-run", action="store_true", help="nichts schreiben")
  parser.add_argument("-v", "--verbose", action="count", default=0, help="mehr Ausgaben, mehrfach möglich")
  parser.add_argument("--limit", type=int, help="höchstens so viele Zeilen")

  args = parser.parse_args(["export.json", "-vv", "--format", "json", "--dry-run"])
  print(args.dateien, args.format, args.dry_run, args.verbose, args.limit)
  parser.print_help()
  ```

  Die Regeln dahinter:

  - **Positionsargumente** (ohne `-`) sind Pflicht und werden über ihre Position zugeordnet. **Optionen** (mit `-` oder `--`) sind optional und haben einen Standardwert – ohne `default` ist er `None`.
  - Aus `--dry-run` wird das Attribut `dry_run`: Bindestriche werden zu Unterstrichen, der lange Name gewinnt.
  - [`type`](https://docs.python.org/3/library/argparse.html#type) ist eine Funktion, die den String umwandelt: `int`, `float`, `Path` oder eine eigene. Wirft sie `ValueError` oder `argparse.ArgumentTypeError`, meldet argparse einen Fehler.
  - [`nargs`](https://docs.python.org/3/library/argparse.html#nargs): `"+"` heißt mindestens eins, `"*"` beliebig viele, `"?"` höchstens eins. Das Ergebnis ist eine Liste (außer bei `"?"`).
  - [`action`](https://docs.python.org/3/library/argparse.html#action): `store_true` für Schalter, `count` für `-vvv`, `append` für wiederholbare Optionen wie `--tag a --tag b`.
  - `choices` begrenzt die erlaubten Werte und erscheint automatisch in der Hilfe.

  Bei einem Fehler schreibt argparse die Kurzhilfe und die Meldung nach stderr und beendet das Programm mit **Exit-Code 2** – über `SystemExit`. Im Test fängst du das mit `pytest.raises(SystemExit)` oder `try`/`except SystemExit`. Dateinamen, die mit `-` beginnen, trennst du mit `--` ab: `konvert -- -seltsam.csv`.

  > [!NOTE] `argparse.FileType` ist veraltet
  > Ältere Tutorials öffnen Dateien direkt mit `type=argparse.FileType("r")`. Seit Python 3.14 gilt das als veraltet: Die Datei wird geöffnet, bevor feststeht, ob die übrigen Argumente gültig sind, und nie sauber geschlossen. Nimm `type=Path` und öffne die Datei selbst mit `with`.

  ### Unterbefehle

  Werkzeuge wie `git` oder `uv` haben Unterbefehle mit eigenen Optionen. [`add_subparsers`](https://docs.python.org/3/library/argparse.html#argparse.ArgumentParser.add_subparsers) liefert dafür ein Objekt, an dem du pro Befehl einen eigenen Parser anlegst. Mit `set_defaults(func=…)` hängst du an jeden Befehl die Funktion, die ihn ausführt:

  ```python run
  import argparse

  def cmd_neu(args: argparse.Namespace) -> int:
      print("neu:", " ".join(args.text), args.tags)
      return 0

  def cmd_liste(args: argparse.Namespace) -> int:
      print("liste, limit", args.limit)
      return 0

  parser = argparse.ArgumentParser(prog="notiz")
  parser.add_argument("-v", "--verbose", action="count", default=0)
  befehle = parser.add_subparsers(dest="befehl", required=True)

  neu = befehle.add_parser("neu", help="Notiz anlegen")
  neu.add_argument("text", nargs="+")
  neu.add_argument("--tag", action="append", dest="tags", default=[])
  neu.set_defaults(func=cmd_neu)

  liste = befehle.add_parser("liste", help="Notizen zeigen")
  liste.add_argument("--limit", type=int, default=10)
  liste.set_defaults(func=cmd_liste)

  for argv in (["neu", "Milch", "kaufen", "--tag", "einkauf"], ["-v", "liste"]):
      args = parser.parse_args(argv)
      print(args.befehl, args.verbose, "->", args.func(args))
  ```

  `required=True` sorgt dafür, dass `notiz` ohne Befehl einen Fehler meldet, statt still nichts zu tun. Globale Optionen wie `-v` stehen **vor** dem Unterbefehl.

  ## stdout, stderr, stdin und Exit-Codes

  Jeder Prozess hat drei Standardströme. Wer sie richtig benutzt, bekommt Pipes, Umleitungen und Automatisierung geschenkt:

  | Strom | Wofür | Beispiel |
  | --- | --- | --- |
  | stdin | Eingabedaten | `cat export.json \| konvert -` |
  | stdout | **nur** die eigentlichen Ergebnisse | `konvert a.json > a.csv` |
  | stderr | Meldungen, Fortschritt, Warnungen, Fehler | `konvert a.json 2> fehler.log` |

  Das Prinzip: **stdout gehört den Daten.** Schreibst du „Lese Datei a.json …“ mit `print` nach stdout, landet der Satz mitten in der CSV-Datei oder bringt `jq` zum Absturz. Meldungen gehen nach stderr – mit `print(..., file=sys.stderr)` oder über `logging`, das standardmäßig nach stderr schreibt.

  Damit Code mit Strömen testbar bleibt, übergib sie als Parameter, statt direkt `sys.stdin` zu lesen. Im Test ersetzt [`io.StringIO`](https://docs.python.org/3/library/io.html#io.StringIO) die echten Ströme:

  ```python run
  import io
  import sys
  from typing import TextIO

  def zaehle(eingabe: TextIO, ausgabe: TextIO, fehler: TextIO) -> int:
      zeilen = 0
      leer = 0
      for zeile in eingabe:
          if zeile.strip():
              zeilen += 1
          else:
              leer += 1
      print(zeilen, file=ausgabe)                     # Ergebnis -> stdout
      if leer:
          print(f"{leer} leere Zeile(n) übersprungen", file=fehler)   # Meldung -> stderr
      return 0

  code = zaehle(io.StringIO("a\n\nb\nc\n"), sys.stdout, sys.stderr)
  print("Exit-Code:", code)
  ```

  Die übliche Konvention für Dateiargumente: `-` bedeutet stdin. So funktioniert das Werkzeug sowohl mit `konvert daten.json` als auch in einer Pipe. Ob stdin ein Terminal ist (also niemand etwas hineinleitet), verrät `sys.stdin.isatty()`.

  **Exit-Codes** sind die Antwort an den Aufrufer. [`sys.exit`](https://docs.python.org/3/library/sys.html#sys.exit) setzt ihn:

  | Code | Bedeutung |
  | --- | --- |
  | `0` | Erfolg |
  | `1` | allgemeiner Fehler (auch bei einer unbehandelten Exception) |
  | `2` | falscher Aufruf – so beendet sich `argparse` |
  | `130` | abgebrochen mit Strg+C (128 + Signal 2) |

  Manche Werkzeuge nutzen weitere Codes mit eigener Bedeutung – `grep` liefert `1`, wenn nichts gefunden wurde. Wenn du das tust, dokumentiere es in der Hilfe.

  > [!INTERVIEW] „Warum gehören Logmeldungen nach stderr?“
  > Weil stdout der Datenkanal ist. Wer `tool | jq` oder `tool > ergebnis.csv` benutzt, will nur die Daten. Meldungen auf stderr erscheinen trotzdem im Terminal, stören aber keine Pipe und lassen sich getrennt umleiten (`2> fehler.log`). Dazu ein Exit-Code ungleich `0` bei Fehlern, damit Skripte mit `set -e` oder `&&` reagieren können.

  ## Konfiguration: CLI > Umgebung > Datei > Standard

  Ein Werkzeug hat Einstellungen, die man nicht bei jedem Aufruf tippen will: Zielordner, API-Adressen, Schwellwerte. Bewährt hat sich eine feste **Rangfolge**, von stark nach schwach:

  1. **Kommandozeile** – gilt nur für diesen Aufruf.
  2. **Umgebungsvariablen** – pro Shell, pro cron-Job, pro CI-Lauf; der richtige Ort für Geheimnisse wie Tokens.
  3. **Konfigurationsdatei** – dauerhafte persönliche Einstellungen, unter Linux üblicherweise `~/.config/<werkzeug>/config.toml`.
  4. **Standardwerte im Code.**

  [`tomllib`](https://docs.python.org/3/library/tomllib.html) liest TOML seit Python 3.11 (nur lesen, nicht schreiben). Die Datei muss **binär** geöffnet werden. Umgebungsvariablen liest du über [`os.environ`](https://docs.python.org/3/library/os.html#os.environ) – ihre Werte sind **immer Strings**. [`collections.ChainMap`](https://docs.python.org/3/library/collections.html#collections.ChainMap) setzt die Rangfolge in einer Zeile um: Es sucht einen Schlüssel der Reihe nach in mehreren Dictionaries.

  ```python run
  import tomllib
  from collections import ChainMap

  STANDARD = {"ziel": "~/Sortiert", "max_tage": 30, "apply": False}

  aus_datei = tomllib.loads('ziel = "/mnt/nas/sortiert"\nmax_tage = 14\n')
  # mit einer echten Datei: with open(pfad, "rb") as f: aus_datei = tomllib.load(f)

  umgebung = {"SORTIERE_MAX_TAGE": "7", "HOME": "/home/steven"}
  aus_env = {k.removeprefix("SORTIERE_").lower(): v for k, v in umgebung.items() if k.startswith("SORTIERE_")}
  aus_env["max_tage"] = int(aus_env["max_tage"])      # Strings umwandeln!

  cli = {"ziel": None, "max_tage": None, "apply": True}  # None = nicht angegeben
  aus_cli = {k: v for k, v in cli.items() if v is not None}

  einstellungen = ChainMap(aus_cli, aus_env, aus_datei, STANDARD)
  print(dict(einstellungen))
  ```

  Der Trick für die Kommandozeile: Optionen bekommen in argparse **keinen** eigenen Standardwert, sondern `None`. Nur so erkennst du, ob jemand `--max-tage` wirklich angegeben hat oder ob der Wert aus der Datei gelten soll. Der Standard wandert in das unterste Dictionary.

  > [!WARNING] Geheimnisse nicht als Argument
  > Ein Passwort in `--token geheim` steht in der Shell-History und ist für andere Benutzer desselben Rechners über `ps` sichtbar. Tokens gehören in Umgebungsvariablen (etwa aus einer `.env`-Datei, die nicht im Repository liegt) oder in eine Datei mit Rechten `600`.

  ## Logging richtig

  [`logging`](https://docs.python.org/3/library/logging.html) wirkt anfangs umständlicher als `print`, löst aber genau die Probleme von Werkzeugen: Stufen (`DEBUG`, `INFO`, `WARNING`, `ERROR`, `CRITICAL`), einheitliches Format mit Zeitstempel, Ausgabe nach stderr oder in Dateien und An- und Abschalten ohne Codeänderung. Das [Logging HOWTO](https://docs.python.org/3/howto/logging.html) beschreibt die Architektur: **Logger** nehmen Meldungen an, **Handler** schreiben sie irgendwohin, **Formatter** bestimmen das Aussehen.

  Drei Regeln reichen für fast alles:

  1. Jedes Modul holt sich mit `log = logging.getLogger(__name__)` einen eigenen Logger und ruft nur `log.info(...)` usw. auf.
  2. **Konfiguriert wird genau einmal**, in `main()` – nie beim Import eines Moduls. Bibliotheken konfigurieren gar nichts; das HOWTO erklärt das im Abschnitt [Configuring Logging for a Library](https://docs.python.org/3/howto/logging.html#configuring-logging-for-a-library).
  3. Argumente werden **nicht** vorformatiert: `log.info("verschiebe %s", datei)` statt `log.info(f"verschiebe {datei}")`. Das `%s` wird nur ausgewertet, wenn die Meldung tatsächlich ausgegeben wird.

  ```python run
  import logging

  log = logging.getLogger("sortiere")

  def konfiguriere(verbose: int, quiet: bool) -> None:
      if quiet:
          stufe = logging.ERROR
      else:
          stufe = {0: logging.WARNING, 1: logging.INFO}.get(verbose, logging.DEBUG)
      logging.basicConfig(level=stufe, format="%(levelname)-7s %(name)s: %(message)s", force=True)

  konfiguriere(verbose=1, quiet=False)       # entspricht -v
  log.debug("unsichtbar bei -v")
  log.info("verschiebe %s", "rechnung.pdf")
  log.warning("Ziel %s existiert, übersprungen", "foto.jpg")
  try:
      1 / 0
  except ZeroDivisionError:
      log.exception("Berechnung fehlgeschlagen")   # ERROR mit Traceback
  ```

  Die Standardstufe `WARNING` passt gut zu Werkzeugen: Ohne Optionen sieht man nur Probleme, mit `-v` den Ablauf, mit `-vv` alle Details, mit `-q` nur Fehler. [`basicConfig`](https://docs.python.org/3/library/logging.html#logging.basicConfig) wirkt nur beim ersten Aufruf; `force=True` ersetzt eine vorhandene Konfiguration. Sollen Meldungen zusätzlich in eine Datei, übergibst du mehrere Handler: `handlers=[logging.StreamHandler(), logging.FileHandler("sortiere.log", encoding="utf-8")]`.

  ## Typer, Click und Rich

  `argparse` ist in der Standardbibliothek und reicht für die meisten Werkzeuge. Zwei Bibliotheken sind trotzdem weit verbreitet:

  - [Click](https://click.palletsprojects.com/) definiert Befehle über Dekoratoren (`@click.command()`, `@click.option(...)`) und bringt Unterbefehle, Eingabeaufforderungen, Farben und Test-Hilfen mit.
  - [Typer](https://typer.tiangolo.com/) baut auf Click auf und leitet die Kommandozeile aus **Typannotationen** ab. Parameter ohne Standardwert werden Argumente, Parameter mit Standardwert Optionen, `bool` wird zu `--flag/--no-flag`.

  ```python
  from pathlib import Path
  from typing import Annotated

  import typer

  def main(
      ordner: Path,
      apply: Annotated[bool, typer.Option(help="wirklich verschieben")] = False,
      max_tage: int = 30,
  ) -> None:
      """Sortiert Dateien aus ORDNER in Unterordner."""
      typer.echo(f"{ordner} apply={apply} max_tage={max_tage}")

  if __name__ == "__main__":
      typer.run(main)     # sortiere.py ~/Downloads --apply --max-tage 7
  ```

  [Rich](https://rich.readthedocs.io/en/stable/) sorgt für farbige Ausgaben, Tabellen und Fortschrittsbalken; Typer nutzt es automatisch für schönere Hilfe und Tracebacks, wenn es installiert ist. Die Abwägung: argparse kommt ohne Abhängigkeit aus – ideal für Skripte, die auf jedem Server mit Python laufen sollen. Typer spart bei größeren Werkzeugen Code und liefert eine bessere Oberfläche, kostet aber eine Abhängigkeit. Die Prinzipien dieser Lektion – stdout für Daten, Exit-Codes, Konfiguration, Logging – gelten mit jeder Bibliothek.

  ## Als Werkzeug installieren

  Damit aus `python3 ~/projekte/sortiere/sortiere.py` einfach `sortiere` wird, beschreibst du in `pyproject.toml` einen [Einstiegspunkt](https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#creating-executable-scripts):

  ```toml title=pyproject.toml
  [project]
  name = "sortiere"
  version = "0.1.0"
  requires-python = ">=3.12"
  dependencies = []

  [project.scripts]
  sortiere = "sortiere.cli:main"

  [build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"
  ```

  `sortiere = "sortiere.cli:main"` heißt: Beim Installieren entsteht ein Befehl `sortiere`, der `main()` aus dem Modul `sortiere/cli.py` aufruft und ihren Rückgabewert als Exit-Code benutzt. Installiert wird mit [`uv tool install .`](https://docs.astral.sh/uv/guides/tools/) oder [`pipx install .`](https://pipx.pypa.io/stable/): Beide legen eine eigene, isolierte Umgebung an und verlinken den Befehl nach `~/.local/bin`. So kollidieren die Abhängigkeiten verschiedener Werkzeuge nie miteinander oder mit dem System-Python von CachyOS.

  Für einzelne Skripte mit Abhängigkeiten gibt es eine leichtere Variante: [Inline-Metadaten](https://docs.astral.sh/uv/guides/scripts/) nach PEP 723. Ein Kommentarblock am Anfang des Skripts nennt die Abhängigkeiten, und `uv run skript.py` besorgt sie in einer temporären Umgebung.

  ```python
  # /// script
  # requires-python = ">=3.12"
  # dependencies = ["typer", "rich"]
  # ///
  import typer
  ```

  > [!PRAXIS] Was Kollegen von einem internen Werkzeug erwarten
  > `--help` erklärt jede Option in einem Satz. Fehler sind eine Zeile auf stderr, kein Traceback – den gibt es mit `-v`. Destruktive Befehle haben einen Trockenlauf. Ergebnisse sind maschinenlesbar (`--format json`). Konfiguration folgt der Rangfolge oben, Geheimnisse kommen aus der Umgebung. Und ein `README` zeigt drei typische Aufrufe. Genau das wird in Code-Reviews interner Tools angemerkt.

  ## Häufige Fehler

  - **`type=bool`.** `bool("False")` ist `True` – jeder nicht leere String ist wahr. Für Schalter `action="store_true"` oder `argparse.BooleanOptionalAction` (`--farbe/--no-farbe`).
  - **Zahlen ohne `type=int`.** Symptom: `TypeError: '>' not supported between instances of 'str' and 'int'` weit weg vom Parser.
  - **`parse_args()` in Tests ohne Liste.** Dann liest argparse die Argumente von pytest. Immer `main(argv)` mit Liste testen.
  - **Meldungen mit `print` nach stdout.** Symptom: kaputte CSV-Dateien, `jq`-Fehler. Lösung: `logging` oder `file=sys.stderr`.
  - **`logging.basicConfig` auf Modulebene.** Symptom: Wer das Modul importiert, bekommt deine Konfiguration aufgezwungen; spätere `basicConfig`-Aufrufe wirken nicht. Lösung: nur in `main()`.
  - **Handler bei jedem Aufruf hinzufügen.** Symptom: Jede Meldung erscheint doppelt, dreifach … Lösung: einmal konfigurieren oder vorher `logger.handlers.clear()`.
  - **Umgebungsvariablen nicht umwandeln.** `"0"` ist als String wahr, `"7" > 30` ist ein `TypeError`.
  - **`BrokenPipeError` bei `tool | head`.** Wenn `head` die Pipe schließt, scheitert der nächste Schreibversuch. Die Doku zu [SIGPIPE](https://docs.python.org/3/library/signal.html#note-on-sigpipe) zeigt, wie man das sauber abfängt.

  ## Zusammenfassung

  - `argparse`: Positionsargumente sind Pflicht, Optionen haben Standardwerte; `type`, `choices`, `nargs`, `store_true`, `count`, `append` decken fast alles ab.
  - Unterbefehle mit `add_subparsers(dest=..., required=True)` und `set_defaults(func=...)`.
  - `main(argv) -> int` mit `parse_args(argv)` macht jedes Werkzeug ohne Prozess testbar; Ströme als Parameter ebenso.
  - stdout nur für Daten, stderr für Meldungen, `-` für stdin.
  - Exit-Codes: `0` Erfolg, `1` Fehler, `2` falscher Aufruf, `130` Strg+C.
  - Konfiguration: CLI > Umgebung > Datei > Standard; argparse-Optionen mit `None` als Standard; Umgebungswerte sind Strings.
  - Logging einmal in `main` konfigurieren, `getLogger(__name__)` überall, `%s` statt f-Strings, `-v`/`-q` steuern die Stufe.
  - Installation als Befehl über `[project.scripts]` und `uv tool install .` oder `pipx install .`.
exercises:
  - id: stroeme-und-codes
    type: choice
    title: Ströme und Exit-Codes
    prompt: Welche Aussagen über ein gut gebautes Kommandozeilen-Werkzeug stimmen?
    options:
      - text: Fortschrittsmeldungen wie „Lese Datei 3 von 10“ gehören nach stderr.
        correct: true
        why: stdout ist der Datenkanal. Meldungen auf stderr bleiben im Terminal sichtbar, landen aber nicht in `> ergebnis.csv` oder in einer Pipe.
      - text: Wenn argparse ein ungültiges Argument findet, wirft `parse_args` eine `ValueError`.
        correct: false
        why: argparse gibt Kurzhilfe und Fehlermeldung auf stderr aus und beendet das Programm über `SystemExit` mit Code `2`.
      - text: Ein Skript, das Fehler loggt und dann normal endet, liefert Exit-Code `0` – cron und CI halten den Lauf für erfolgreich.
        correct: true
        why: Loggen allein ändert den Exit-Code nicht. Wer Fehler zählt, muss am Ende `1` (oder einen anderen Code ungleich `0`) zurückgeben.
      - text: "`parser.add_argument(\"--farbe\", type=bool)` macht aus `--farbe False` den Wert `False`."
        correct: false
        why: "`bool(\"False\")` ist `True`, weil jeder nicht leere String wahr ist. Für Schalter gibt es `store_true` oder `BooleanOptionalAction`."
    explanation: |
      Die Kommandozeile hat klare Verträge: stdout für Daten, stderr für Menschen, Exit-Code für Programme. argparse hält sich daran – Fehler gehen nach stderr, der Exit-Code ist `2`. Die häufigsten Verstöße sind Meldungen auf stdout, verschluckte Fehler mit Exit-Code `0` und `type=bool`, das nie `False` liefert.
    resources:
      - title: argparse · Exiting methods
        url: https://docs.python.org/3/library/argparse.html#exiting-methods
      - title: sys.stderr
        url: https://docs.python.org/3/library/sys.html#sys.stderr

  - id: parse-args-vorhersagen
    type: output
    title: Was macht argparse daraus?
    prompt: Was gibt dieses Programm unter Linux aus?
    lang: python
    code: |
      import argparse
      from pathlib import Path

      parser = argparse.ArgumentParser(prog="konvert")
      parser.add_argument("dateien", nargs="+", type=Path)
      parser.add_argument("-f", "--format", choices=["csv", "json"], default="csv")
      parser.add_argument("-v", "--verbose", action="count", default=0)
      parser.add_argument("--dry-run", action="store_true")
      parser.add_argument("--limit", type=int)

      a = parser.parse_args(["a.json", "b.json", "-vv", "--format", "json"])
      print(a.dateien, a.format, a.verbose, a.dry_run, a.limit)
      b = parser.parse_args(["--limit", "5", "x.csv", "--dry-run"])
      print(b.dateien[0].suffix, b.limit + 1, b.dry_run, b.verbose, b.format)
      c = parser.parse_args(["--", "-v"])
      print(c.dateien, c.verbose)
    expected: |
      [PosixPath('a.json'), PosixPath('b.json')] json 2 False None
      .csv 6 True 0 csv
      [PosixPath('-v')] 0
    explanation: |
      `type=Path` wird auf jedes Element von `nargs="+"` angewendet, deshalb entsteht eine Liste von `PosixPath`. `-vv` zählt zwei, `--dry-run` wird zu `dry_run` und ist ohne Angabe `False`. `--limit` hat keinen Standard und ist `None`; mit `type=int` ist `"5"` eine Zahl, mit der man rechnen kann. Optionen und Positionsargumente dürfen gemischt werden. Nach `--` gilt nichts mehr als Option – so lassen sich Dateinamen übergeben, die mit `-` beginnen.
    resources:
      - title: argparse · nargs
        url: https://docs.python.org/3/library/argparse.html#nargs
      - title: argparse · dest
        url: https://docs.python.org/3/library/argparse.html#dest

  - id: vorrang-vorhersagen
    type: output
    title: Wer gewinnt?
    prompt: Was gibt dieses Programm aus?
    lang: python
    code: |
      import tomllib
      from collections import ChainMap

      STANDARD = {"ziel": "~/Sortiert", "max_tage": 30, "farbe": True, "apply": False}
      datei = tomllib.loads('ziel = "/mnt/nas"\nmax_tage = 14\nfarbe = false\n')
      umgebung = {"SORTIERE_MAX_TAGE": "7", "SORTIERE_ZIEL": "", "USER": "steven"}
      aus_env = {k.removeprefix("SORTIERE_").lower(): v
                 for k, v in umgebung.items() if k.startswith("SORTIERE_") and v}
      cli = {"ziel": None, "max_tage": None, "farbe": None, "apply": True}
      aus_cli = {k: v for k, v in cli.items() if v is not None}

      e = ChainMap(aus_cli, aus_env, datei, STANDARD)
      print(e["ziel"])
      print(repr(e["max_tage"]))
      print(e["farbe"], e["apply"])
      print(sorted(e))
    expected: |
      /mnt/nas
      '7'
      False True
      ['apply', 'farbe', 'max_tage', 'ziel']
    explanation: |
      `ChainMap` sucht jeden Schlüssel von links nach rechts. `SORTIERE_ZIEL` ist leer und wird durch `and v` herausgefiltert, deshalb gilt die Datei: `/mnt/nas`. `max_tage` kommt aus der Umgebung – und ist dort ein **String** `'7'`, nicht die Zahl 7. Genau diesen Fehler musst du beim Einlesen von Umgebungsvariablen abfangen. `farbe` ist in der CLI `None` (nicht angegeben), die Datei sagt `false`. `apply` kommt aus der CLI. `sorted` über einen `ChainMap` liefert die Vereinigung aller Schlüssel.
    resources:
      - title: collections.ChainMap
        url: https://docs.python.org/3/library/collections.html#collections.ChainMap
      - title: tomllib.loads
        url: https://docs.python.org/3/library/tomllib.html#tomllib.loads

  - id: unterbefehle-luecken
    type: gap
    title: Ein Werkzeug mit Unterbefehlen
    prompt: |
      Ergänze den Parser für `backup`. Ohne Unterbefehl soll ein Fehler kommen. `run` nimmt mindestens einen Ordner, `--stufe` ist eine ganze Zahl von 1 bis 9 mit Standard 6. `prune` hat `--behalten` (ganze Zahl) und einen Schalter `--apply`. Jeder Unterbefehl hängt seine Funktion an.
    lang: python
    code: |
      parser = argparse.ArgumentParser(prog="backup")
      befehle = parser.⟦add_subparsers⟧(dest="befehl", required=True)

      run = befehle.⟦add_parser⟧("run", help="Backup erstellen")
      run.add_argument("ordner", nargs=⟦"+"⟧, type=Path)
      run.add_argument("--stufe", type=int, choices=⟦range(1, 10)⟧, default=6)
      run.set_defaults(func=cmd_run)

      prune = befehle.add_parser("prune", help="alte Backups löschen")
      prune.add_argument("--behalten", ⟦type=int⟧, default=7)
      prune.add_argument("--apply", ⟦action="store_true"⟧)
      prune.⟦set_defaults⟧(func=cmd_prune)
    gaps:
      - label: Unterbefehle anlegen
        hint: Eine Methode des Parsers, die ein Objekt für Unterbefehle liefert.
      - label: Einen Unterbefehl anlegen
        hint: Eine Methode dieses Objekts, die einen neuen Parser liefert.
      - label: Mindestens einer
        hint: Das `nargs`-Zeichen für „ein oder mehr“.
      - label: 1 bis 9
        hint: Ein `range`, dessen Ende nicht enthalten ist.
        accept:
          - list(range(1, 10))
          - "[1, 2, 3, 4, 5, 6, 7, 8, 9]"
      - label: Ganze Zahl
        hint: Ein Schlüsselwort-Argument, das den String umwandelt.
      - label: Schalter
        hint: Eine Aktion, die ohne Wert `True` speichert.
      - label: Funktion anhängen
        hint: Dieselbe Methode wie bei `run`.
    explanation: |
      `add_subparsers(dest="befehl", required=True)` legt den Unterbefehl in `args.befehl` ab und verlangt einen. Jeder Unterbefehl ist ein eigener Parser mit eigenen Optionen. `choices=range(1, 10)` funktioniert, weil argparse nur `in` prüft – nach der Umwandlung durch `type=int`. `set_defaults(func=...)` erspart eine `if`-Kette: In `main` genügt `return args.func(args)`.
    resources:
      - title: argparse · add_subparsers
        url: https://docs.python.org/3/library/argparse.html#argparse.ArgumentParser.add_subparsers
      - title: argparse · choices
        url: https://docs.python.org/3/library/argparse.html#choices

