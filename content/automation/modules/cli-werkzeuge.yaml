  - id: notiz-parser
    type: code
    title: Ein Parser mit Unterbefehlen
    prompt: |
      Schreibe `baue_parser()` für das Werkzeug `notiz`. Sie gibt einen `argparse.ArgumentParser` zurück:

      - Globale Option `-v`/`--verbose`, zählbar (`-vv`), Standard `0`.
      - Unterbefehle in `args.befehl`, einer ist Pflicht:
        - `neu`: Positionsargument `text` (mindestens ein Wort, Liste), wiederholbare Option `--tag` mit Ziel `tags` (Standard: leere Liste).
        - `liste`: `--tag` (einzelner Wert, Standard `None`), `--limit` (ganze Zahl, Standard `10`).
        - `loesche`: Positionsargument `id` (ganze Zahl), Schalter `--force`.
    lang: python
    starter: |
      import argparse

      def baue_parser() -> argparse.ArgumentParser:
          parser = argparse.ArgumentParser(prog="notiz")
          ...
          return parser
    solution: |
      import argparse

      def baue_parser() -> argparse.ArgumentParser:
          parser = argparse.ArgumentParser(prog="notiz")
          parser.add_argument("-v", "--verbose", action="count", default=0)
          befehle = parser.add_subparsers(dest="befehl", required=True)

          neu = befehle.add_parser("neu")
          neu.add_argument("text", nargs="+")
          neu.add_argument("--tag", action="append", dest="tags", default=[])

          liste = befehle.add_parser("liste")
          liste.add_argument("--tag")
          liste.add_argument("--limit", type=int, default=10)

          loesche = befehle.add_parser("loesche")
          loesche.add_argument("id", type=int)
          loesche.add_argument("--force", action="store_true")
          return parser
    tests:
      - name: neu mit Text und Tags
        code: |
          a = baue_parser().parse_args(["neu", "Milch", "kaufen", "--tag", "einkauf", "--tag", "heute"])
          assert a.befehl == "neu", f"befehl: {a.befehl!r}"
          assert a.text == ["Milch", "kaufen"], f"text: {a.text!r}"
          assert a.tags == ["einkauf", "heute"], f"tags: {a.tags!r}"
      - name: neu ohne Tags
        code: |
          a = baue_parser().parse_args(["neu", "Idee"])
          assert a.tags == [], f"tags ohne --tag: {a.tags!r}"
      - name: liste mit Standardwerten
        code: |
          a = baue_parser().parse_args(["liste"])
          assert (a.befehl, a.tag, a.limit, a.verbose) == ("liste", None, 10, 0), f"bekommen {vars(a)}"
          b = baue_parser().parse_args(["-vv", "liste", "--limit", "3"])
          assert (b.limit, b.verbose) == (3, 2), f"bekommen {vars(b)}"
      - name: loesche wandelt die ID um
        code: |
          a = baue_parser().parse_args(["loesche", "42", "--force"])
          assert a.id == 42 and a.force is True, f"bekommen {vars(a)}"
          assert baue_parser().parse_args(["loesche", "7"]).force is False
      - name: Ungültige Aufrufe enden mit Code 2
        code: |
          for argv in ([], ["loesche", "abc"], ["neu"], ["liste", "--limit", "viele"]):
              try:
                  baue_parser().parse_args(argv)
              except SystemExit as exc:
                  assert exc.code == 2, f"{argv}: Exit-Code {exc.code}"
              else:
                  raise AssertionError(f"{argv} hätte einen Fehler auslösen sollen")
    hints:
      - "`befehle = parser.add_subparsers(dest=\"befehl\", required=True)`, dann pro Befehl `befehle.add_parser(\"neu\")`."
      - "Wiederholbar: `action=\"append\", dest=\"tags\", default=[]`. Zählbar: `action=\"count\", default=0`."
      - "Umwandeln mit `type=int` – argparse meldet dann bei `abc` selbst einen Fehler."
    explanation: |
      Unterbefehle sind eigene Parser; ihre Optionen landen im selben `Namespace` wie die globalen. `append` sammelt wiederholte Optionen in einer Liste. Das `default=[]` ist hier unbedenklich, weil argparse die Liste vor dem Anhängen kopiert. `type=int` sorgt dafür, dass `loesche abc` mit einer klaren Meldung und Exit-Code `2` endet, statt später mit einem `ValueError` tief im Programm. Der Test ruft `parse_args` mit Listen auf – genau so testest du jedes Werkzeug, ohne einen Prozess zu starten.
    resources:
      - title: argparse · action
        url: https://docs.python.org/3/library/argparse.html#action
      - title: argparse · add_subparsers
        url: https://docs.python.org/3/library/argparse.html#argparse.ArgumentParser.add_subparsers

  - id: logging-konfigurieren
    type: code
    title: Logging mit -v und -q
    prompt: |
      Schreibe `konfiguriere_logging(verbose, quiet, stream)`. Sie richtet den Logger `"werkzeug"` ein und gibt ihn zurück:

      - Stufe: `quiet` → `ERROR`; sonst `verbose == 0` → `WARNING`, `1` → `INFO`, ab `2` → `DEBUG`.
      - Genau **ein** `StreamHandler`, der in `stream` schreibt, Format `"%(levelname)s: %(message)s"`.
      - Mehrfaches Aufrufen darf keine zusätzlichen Handler anhängen (sonst erscheinen Meldungen doppelt).
      - `propagate = False`, damit Meldungen nicht zusätzlich über den Root-Logger ausgegeben werden.
    lang: python
    starter: |
      import logging
      from typing import TextIO

      def konfiguriere_logging(verbose: int, quiet: bool, stream: TextIO) -> logging.Logger:
          logger = logging.getLogger("werkzeug")
          handler = logging.StreamHandler(stream)
          logger.addHandler(handler)
          return logger
    solution: |
      import logging
      from typing import TextIO

      def konfiguriere_logging(verbose: int, quiet: bool, stream: TextIO) -> logging.Logger:
          if quiet:
              stufe = logging.ERROR
          elif verbose >= 2:
              stufe = logging.DEBUG
          elif verbose == 1:
              stufe = logging.INFO
          else:
              stufe = logging.WARNING
          logger = logging.getLogger("werkzeug")
          logger.handlers.clear()
          handler = logging.StreamHandler(stream)
          handler.setFormatter(logging.Formatter("%(levelname)s: %(message)s"))
          logger.addHandler(handler)
          logger.setLevel(stufe)
          logger.propagate = False
          return logger
    tests:
      - name: Standard zeigt nur Warnungen
        code: |
          import io
          puffer = io.StringIO()
          log = konfiguriere_logging(0, False, puffer)
          log.info("unsichtbar")
          log.warning("Platte fast voll")
          assert puffer.getvalue() == "WARNING: Platte fast voll\n", f"Ausgabe: {puffer.getvalue()!r}"
      - name: -v zeigt INFO, -vv DEBUG
        code: |
          import io
          puffer = io.StringIO()
          log = konfiguriere_logging(1, False, puffer)
          log.debug("details")
          log.info("verschiebe a.pdf")
          assert puffer.getvalue() == "INFO: verschiebe a.pdf\n", f"-v: {puffer.getvalue()!r}"
          puffer2 = io.StringIO()
          konfiguriere_logging(3, False, puffer2).debug("x=%d", 42)
          assert puffer2.getvalue() == "DEBUG: x=42\n", f"-vvv: {puffer2.getvalue()!r}"
      - name: -q zeigt nur Fehler
        code: |
          import io
          puffer = io.StringIO()
          log = konfiguriere_logging(2, True, puffer)
          log.warning("still")
          log.error("kaputt")
          assert puffer.getvalue() == "ERROR: kaputt\n", f"Ausgabe: {puffer.getvalue()!r}"
      - name: Zweimal konfigurieren, einmal ausgeben
        code: |
          import io
          puffer = io.StringIO()
          konfiguriere_logging(0, False, puffer)
          log = konfiguriere_logging(0, False, puffer)
          log.error("nur einmal")
          assert puffer.getvalue() == "ERROR: nur einmal\n", f"Ausgabe: {puffer.getvalue()!r}"
          assert len(log.handlers) == 1, f"{len(log.handlers)} Handler statt einem"
          assert log.propagate is False, "propagate soll False sein"
    hints:
      - "Die Stufe zuerst als `if`/`elif`-Kette bestimmen und mit `logger.setLevel(stufe)` setzen."
      - "Vor dem Hinzufügen alte Handler entfernen: `logger.handlers.clear()`."
      - "`handler.setFormatter(logging.Formatter(\"%(levelname)s: %(message)s\"))`"
    explanation: |
      Logger sind global: `getLogger("werkzeug")` liefert bei jedem Aufruf **dasselbe** Objekt. Wer bei jedem Aufruf einen Handler anhängt, bekommt doppelte Ausgaben – ein Klassiker in Tests und Notebooks. `handlers.clear()` macht die Konfiguration idempotent. Die Stufe wird am Logger gesetzt; Meldungen darunter werden verworfen, bevor sie formatiert werden. `propagate = False` verhindert, dass dieselbe Meldung zusätzlich an die Handler des Root-Loggers geht. Den Strom als Parameter zu übergeben macht das Ganze testbar – im echten Programm übergibst du `sys.stderr`.
    resources:
      - title: Logging HOWTO · Loggers, Handlers, Formatters
        url: https://docs.python.org/3/howto/logging.html#advanced-logging-tutorial
      - title: logging.Logger.propagate
        url: https://docs.python.org/3/library/logging.html#logging.Logger.propagate

  - id: einstellungen-laden
    type: code
    title: Einstellungen mit Vorrang
    prompt: |
      Schreibe `lade_einstellungen(cli, env, toml_text)`. Ergebnis ist ein `dict` mit den Schlüsseln aus `STANDARD`. Vorrang: `cli` > `env` > `toml_text` > `STANDARD`.

      - `cli`: Werte aus argparse; `None` heißt „nicht angegeben“.
      - `env`: Umgebungsvariablen. Relevant sind `SORTIERE_ZIEL`, `SORTIERE_MAX_TAGE` und `SORTIERE_APPLY`; leere Werte werden ignoriert. `MAX_TAGE` wird zu `int`. `APPLY` wird zu `True` bei `1`, `true`, `yes`, `on` und zu `False` bei `0`, `false`, `no`, `off` (Groß- und Kleinschreibung egal); andere Werte lösen `ValueError` aus.
      - `toml_text`: Inhalt einer TOML-Datei mit denselben Schlüsseln wie `STANDARD` (kann leer sein). Ein unbekannter Schlüssel löst `ValueError` aus – das fängt Tippfehler in der Konfiguration ab.
    lang: python
    starter: |
      import tomllib

      STANDARD = {"ziel": "Sortiert", "max_tage": 30, "apply": False}

      def lade_einstellungen(cli: dict, env: dict, toml_text: str) -> dict:
          ergebnis = dict(STANDARD)
          ergebnis.update(cli)
          return ergebnis
    solution: |
      import tomllib

      STANDARD = {"ziel": "Sortiert", "max_tage": 30, "apply": False}
      WAHR = {"1", "true", "yes", "on"}
      FALSCH = {"0", "false", "no", "off"}

      def als_bool(text: str) -> bool:
          wert = text.strip().lower()
          if wert in WAHR:
              return True
          if wert in FALSCH:
              return False
          raise ValueError(f"kein Wahrheitswert: {text!r}")

      def lade_einstellungen(cli: dict, env: dict, toml_text: str) -> dict:
          aus_datei = tomllib.loads(toml_text)
          unbekannt = set(aus_datei) - set(STANDARD)
          if unbekannt:
              raise ValueError(f"unbekannte Einstellung: {', '.join(sorted(unbekannt))}")

          aus_env = {}
          if env.get("SORTIERE_ZIEL"):
              aus_env["ziel"] = env["SORTIERE_ZIEL"]
          if env.get("SORTIERE_MAX_TAGE"):
              aus_env["max_tage"] = int(env["SORTIERE_MAX_TAGE"])
          if env.get("SORTIERE_APPLY"):
              aus_env["apply"] = als_bool(env["SORTIERE_APPLY"])

          aus_cli = {k: v for k, v in cli.items() if v is not None}

          ergebnis = dict(STANDARD)
          for quelle in (aus_datei, aus_env, aus_cli):   # schwach -> stark
              ergebnis.update(quelle)
          return ergebnis
    tests:
      - name: Nur Standardwerte
        code: |
          ergebnis = lade_einstellungen({"ziel": None, "max_tage": None, "apply": None}, {}, "")
          assert ergebnis == {"ziel": "Sortiert", "max_tage": 30, "apply": False}, f"bekommen {ergebnis!r}"
      - name: Datei schlägt Standard
        code: |
          ergebnis = lade_einstellungen({}, {}, 'ziel = "/mnt/nas"\nmax_tage = 14\n')
          assert ergebnis == {"ziel": "/mnt/nas", "max_tage": 14, "apply": False}, f"bekommen {ergebnis!r}"
      - name: Umgebung schlägt Datei, Werte werden umgewandelt
        code: |
          env = {"SORTIERE_MAX_TAGE": "7", "SORTIERE_APPLY": "Yes", "SORTIERE_ZIEL": "", "HOME": "/home/steven"}
          ergebnis = lade_einstellungen({"max_tage": None}, env, 'ziel = "/mnt/nas"\nmax_tage = 14\n')
          assert ergebnis == {"ziel": "/mnt/nas", "max_tage": 7, "apply": True}, f"bekommen {ergebnis!r}"
      - name: CLI schlägt alles, None zählt nicht
        code: |
          env = {"SORTIERE_MAX_TAGE": "7", "SORTIERE_APPLY": "1"}
          ergebnis = lade_einstellungen({"ziel": "/tmp/x", "max_tage": None, "apply": False}, env, "max_tage = 14\n")
          assert ergebnis == {"ziel": "/tmp/x", "max_tage": 7, "apply": False}, f"bekommen {ergebnis!r}"
      - name: Fehler werden erkannt
        code: |
          for cli, env, text in [({}, {}, "max_tag = 3\n"), ({}, {"SORTIERE_APPLY": "vielleicht"}, "")]:
              try:
                  lade_einstellungen(cli, env, text)
              except ValueError:
                  pass
              else:
                  raise AssertionError(f"Erwartet ValueError für env={env!r}, toml={text!r}")
    hints:
      - "Baue drei Dictionaries (Datei, Umgebung, CLI ohne `None`) und wende sie mit `update` von schwach nach stark auf eine Kopie von `STANDARD` an."
      - "Unbekannte Schlüssel: `set(aus_datei) - set(STANDARD)`."
      - "Für `APPLY` eine kleine Hilfsfunktion mit zwei Mengen erlaubter Werte schreiben; `\"Yes\".lower()` nicht vergessen."
    explanation: |
      Die Rangfolge lässt sich als Folge von `update`-Aufrufen von schwach nach stark ausdrücken – oder mit `ChainMap` von stark nach schwach. Der entscheidende Teil ist die Grenze zur Außenwelt: Umgebungsvariablen sind Strings, `"0"` wäre als String wahr, und ein Tippfehler wie `max_tag` in der Datei würde ohne Prüfung still ignoriert. `None` in der CLI bedeutet „nicht angegeben“ – deshalb setzt man in argparse für diese Optionen keinen eigenen Standardwert. Ein ausdrückliches `--no-apply` (also `False`) schlägt dagegen die Umgebung.
    resources:
      - title: tomllib
        url: https://docs.python.org/3/library/tomllib.html
      - title: os.environ
        url: https://docs.python.org/3/library/os.html#os.environ

  - id: log-filter-main
    type: code
    title: Ein Filter für Pipes
    prompt: |
      Schreibe `main(argv, stdin, stdout, stderr) -> int` für das Werkzeug `nurfehler`, das Logzeilen filtert: `journalctl -o cat | nurfehler --level WARNING`.

      - Jede Eingabezeile hat die Form `STUFE Nachricht`, z. B. `ERROR db: Verbindung verloren`. Stufen in aufsteigender Reihenfolge: `DEBUG`, `INFO`, `WARNING`, `ERROR`.
      - Option `--level` (eine der vier Stufen, Standard `ERROR`): Zeilen mit dieser oder einer höheren Stufe werden **unverändert** nach `stdout` geschrieben.
      - Leere Zeilen werden übersprungen. Zeilen mit unbekannter Stufe werden nicht ausgegeben; stattdessen schreibt das Werkzeug `zeile N: unbekannte Stufe` nach `stderr` (N zählt ab 1 über alle Eingabezeilen).
      - Rückgabe: `0`, wenn alle nicht leeren Zeilen lesbar waren, sonst `1`. Ungültige Argumente beendet argparse wie üblich mit Code `2`.
    lang: python
    starter: |
      import argparse
      from typing import TextIO

      STUFEN = ["DEBUG", "INFO", "WARNING", "ERROR"]

      def main(argv: list[str], stdin: TextIO, stdout: TextIO, stderr: TextIO) -> int:
          for zeile in stdin:
              print(zeile, end="", file=stdout)
          return 0
    solution: |
      import argparse
      from typing import TextIO

      STUFEN = ["DEBUG", "INFO", "WARNING", "ERROR"]

      def main(argv: list[str], stdin: TextIO, stdout: TextIO, stderr: TextIO) -> int:
          parser = argparse.ArgumentParser(prog="nurfehler")
          parser.add_argument("--level", choices=STUFEN, default="ERROR")
          args = parser.parse_args(argv)
          minimum = STUFEN.index(args.level)

          code = 0
          for nummer, zeile in enumerate(stdin, start=1):
              if not zeile.strip():
                  continue
              stufe = zeile.split(maxsplit=1)[0]
              if stufe not in STUFEN:
                  print(f"zeile {nummer}: unbekannte Stufe", file=stderr)
                  code = 1
                  continue
              if STUFEN.index(stufe) >= minimum:
                  stdout.write(zeile if zeile.endswith("\n") else zeile + "\n")
          return code
    setup: |
      import io
      LOG = (
          "INFO start\n"
          "DEBUG cache warm\n"
          "WARNING Platte zu 91 % voll\n"
          "\n"
          "ERROR db: Verbindung verloren\n"
          "kaputte Zeile\n"
          "ERROR retry fehlgeschlagen"
      )
      def lauf(argv):
          aus, err = io.StringIO(), io.StringIO()
          code = main(argv, io.StringIO(LOG), aus, err)
          return code, aus.getvalue(), err.getvalue()
    tests:
      - name: Standard filtert ERROR
        code: |
          code, aus, err = lauf([])
          assert aus == "ERROR db: Verbindung verloren\nERROR retry fehlgeschlagen\n", f"stdout: {aus!r}"
      - name: --level WARNING
        code: |
          code, aus, err = lauf(["--level", "WARNING"])
          assert aus.splitlines() == ["WARNING Platte zu 91 % voll", "ERROR db: Verbindung verloren", "ERROR retry fehlgeschlagen"], f"stdout: {aus!r}"
      - name: Meldungen nach stderr, Exit-Code 1
        code: |
          code, aus, err = lauf(["--level", "DEBUG"])
          assert "kaputte" not in aus, "Unlesbare Zeilen gehören nicht nach stdout"
          assert err == "zeile 6: unbekannte Stufe\n", f"stderr: {err!r}"
          assert code == 1, f"Exit-Code {code}, erwartet 1"
      - name: Saubere Eingabe ergibt 0
        code: |
          import io
          aus = io.StringIO()
          code = main(["--level", "INFO"], io.StringIO("INFO a\nDEBUG b\n"), aus, io.StringIO())
          assert (code, aus.getvalue()) == (0, "INFO a\n"), f"bekommen {(code, aus.getvalue())!r}"
      - name: Ungültige Stufe ist ein Aufruffehler
        code: |
          try:
              lauf(["--level", "LAUT"])
          except SystemExit as exc:
              assert exc.code == 2, f"Exit-Code {exc.code}"
          else:
              raise AssertionError("--level LAUT hätte argparse mit Code 2 beenden sollen")
    hints:
      - "`choices=STUFEN` erledigt die Prüfung von `--level`; die Rangfolge liefert `STUFEN.index(stufe)`."
      - "`enumerate(stdin, start=1)` zählt die Zeilen; die Stufe ist `zeile.split(maxsplit=1)[0]`."
      - "Die letzte Zeile hat kein `\\n` – ergänze es beim Schreiben, damit jede Ausgabezeile endet."
    explanation: |
      Das ist das Grundmuster jedes Unix-Filters: Eingabe zeilenweise lesen, Treffer nach stdout, Probleme nach stderr, Exit-Code als Zusammenfassung. Weil `main` die Ströme als Parameter bekommt, kann der Test mit `StringIO` arbeiten; im echten Programm steht unten `sys.exit(main(sys.argv[1:], sys.stdin, sys.stdout, sys.stderr))`. Die Zeilen werden unverändert weitergereicht, damit das Werkzeug mit anderen kombinierbar bleibt. Zeilenweises Lesen hält den Speicherbedarf klein – auch bei Gigabytes aus `journalctl`.
    resources:
      - title: sys.stdin
        url: https://docs.python.org/3/library/sys.html#sys.stdin
      - title: io.StringIO
        url: https://docs.python.org/3/library/io.html#io.StringIO

  - id: repariere-backup-parser
    type: code
    title: Repariere den Backup-Parser
    prompt: |
      Der Parser des Werkzeugs `backup` hat drei Fehler:

      - `backup` ohne Ordner läuft ohne Fehlermeldung durch und sichert nichts. Mindestens ein Ordner soll Pflicht sein.
      - `backup ~/docs --komprimieren` meldet „expected one argument“, und `--komprimieren False` schaltet die Kompression ein. `--komprimieren` soll ein Schalter ohne Wert sein.
      - `--stufe 12` wird angenommen, und `args.stufe` ist ein String. Erlaubt sind ganze Zahlen von 1 bis 9, Standard 6.

      Repariere `baue_parser`.
    lang: python
    starter: |
      import argparse
      from pathlib import Path

      def baue_parser() -> argparse.ArgumentParser:
          parser = argparse.ArgumentParser(prog="backup")
          parser.add_argument("quellen", nargs="*", type=Path)
          parser.add_argument("--komprimieren", type=bool, default=False)
          parser.add_argument("--stufe", default=6)
          return parser
    solution: |
      import argparse
      from pathlib import Path

      def baue_parser() -> argparse.ArgumentParser:
          parser = argparse.ArgumentParser(prog="backup")
          parser.add_argument("quellen", nargs="+", type=Path)
          parser.add_argument("--komprimieren", action="store_true")
          parser.add_argument("--stufe", type=int, choices=range(1, 10), default=6)
          return parser
    tests:
      - name: Normaler Aufruf
        code: |
          a = baue_parser().parse_args(["docs", "bilder"])
          assert a.quellen == [Path("docs"), Path("bilder")], f"quellen: {a.quellen!r}"
          assert a.komprimieren is False and a.stufe == 6, f"bekommen {vars(a)}"
      - name: Ohne Ordner ist ein Fehler
        code: |
          try:
              baue_parser().parse_args([])
          except SystemExit as exc:
              assert exc.code == 2
          else:
              raise AssertionError("backup ohne Ordner muss mit Code 2 enden")
      - name: --komprimieren ist ein Schalter
        code: |
          a = baue_parser().parse_args(["docs", "--komprimieren"])
          assert a.komprimieren is True, f"komprimieren: {a.komprimieren!r}"
      - name: --stufe ist eine Zahl von 1 bis 9
        code: |
          a = baue_parser().parse_args(["docs", "--stufe", "9"])
          assert a.stufe == 9, f"stufe: {a.stufe!r} ({type(a.stufe).__name__})"
          for falsch in ["12", "0", "hoch"]:
              try:
                  baue_parser().parse_args(["docs", "--stufe", falsch])
              except SystemExit:
                  pass
              else:
                  raise AssertionError(f"--stufe {falsch} hätte abgelehnt werden müssen")
    hints:
      - "`nargs=\"*\"` erlaubt null Werte – für „mindestens einer“ gibt es ein anderes Zeichen."
      - "`type=bool` ruft `bool(\"False\")` auf. Schalter brauchen eine `action`."
      - "`type=int, choices=range(1, 10)`"
    explanation: |
      Alle drei Fehler sind typische argparse-Missverständnisse. `nargs="*"` erlaubt eine leere Liste; ein Backup ohne Quelle sollte aber laut scheitern. `type=bool` macht aus der Option eine Option **mit** Wert, und `bool()` liefert für jeden nicht leeren String `True`. Ohne `type=int` bleibt jede Zahl ein String – Vergleiche wie `args.stufe > 5` scheitern dann erst später mit `TypeError`. `choices` prüft nach der Umwandlung, deshalb funktioniert `range(1, 10)`.
    resources:
      - title: argparse · nargs
        url: https://docs.python.org/3/library/argparse.html#nargs
      - title: argparse · type
        url: https://docs.python.org/3/library/argparse.html#type

  - id: print-in-pipe
    type: bug
    title: jq mag die Ausgabe nicht
    prompt: |
      `./auswertung.py *.csv > ergebnis.json` erzeugt eine Datei, die kein gültiges JSON ist, und `./auswertung.py *.csv | jq .` bricht mit einem Parse-Fehler ab. Das JSON aus `json.dump` selbst ist korrekt. Finde die fehlerhafte Zeile und korrigiere sie.
    lang: python
    code: |
      def main(argv: list[str] | None = None) -> int:
          args = parse_args(argv)
          ergebnisse = []
          for datei in args.dateien:
              print(f"lese {datei}")
              ergebnisse.append(auswerten(datei))
          json.dump(ergebnisse, sys.stdout, indent=2, ensure_ascii=False)
          sys.stdout.write("\n")
          return 0
    lines: [5]
    fix:
      - line: 5
        answers:
          - print(f"lese {datei}", file=sys.stderr)
          - log.info("lese %s", datei)
          - logging.info("lese %s", datei)
          - log.info(f"lese {datei}")
          - sys.stderr.write(f"lese {datei}\n")
    explanation: |
      Die Fortschrittsmeldung landet mit `print` auf stdout – vor dem JSON. Für die Datei und für `jq` ist `lese a.csv` der Anfang des Dokuments, und das ist kein JSON. Meldungen gehören nach stderr: `print(..., file=sys.stderr)` oder besser `log.info(...)`, denn `logging` schreibt standardmäßig nach stderr und lässt sich mit `-q` abschalten. Im Terminal sieht man beides; umgeleitet wird nur stdout.
    resources:
      - title: print() · file
        url: https://docs.python.org/3/library/functions.html#print
      - title: Logging HOWTO · When to use logging
        url: https://docs.python.org/3/howto/logging.html#when-to-use-logging

  - id: typer-erklaeren
    type: explain
    title: Eine Typer-App lesen
    prompt: |
      Erkläre, welche Kommandozeile Typer aus diesem Code erzeugt: welche Befehle, Argumente und Optionen es gibt, wie `sortiere --help` aussehen wird und woher Typer die Informationen nimmt. Was passiert bei `sortiere statistik ~/Downloads`, und was bei `sortiere sortiere ~/Downloads --max-tage -1`?
    lang: python
    code: |
      from pathlib import Path
      from typing import Annotated

      import typer

      app = typer.Typer(help="Hält den Downloads-Ordner sauber.")

      @app.command()
      def sortiere(
          ordner: Annotated[Path, typer.Argument(help="Ordner, der sortiert wird")],
          apply: Annotated[bool, typer.Option(help="wirklich verschieben")] = False,
          max_tage: Annotated[int, typer.Option(min=0, help="nur ältere Dateien")] = 30,
      ) -> None:
          """Sortiert Dateien nach Endung in Unterordner."""
          fehler = verschiebe_alles(ordner, apply=apply, max_tage=max_tage)
          if fehler:
              raise typer.Exit(code=1)

      @app.command()
      def statistik(ordner: Path) -> None:
          """Zeigt, wie viele Dateien welcher Art im Ordner liegen."""
          for kategorie, anzahl in zaehle(ordner).items():
              typer.echo(f"{kategorie}: {anzahl}")

      if __name__ == "__main__":
          app()
    points:
      - Jede mit `@app.command()` markierte Funktion wird ein Unterbefehl mit ihrem Namen; der Docstring wird zum Hilfetext.
      - Parameter ohne Standardwert werden Positionsargumente, Parameter mit Standardwert Optionen; aus `max_tage` wird `--max-tage`.
      - "Die Typannotationen steuern Umwandlung und Prüfung: `Path`, `int` mit `min=0` (deshalb wird `-1` mit einer Fehlermeldung abgelehnt), `bool` wird zum Schalterpaar `--apply/--no-apply`."
      - "`typer.Exit(code=1)` beendet das Programm mit Exit-Code 1; `typer.echo` schreibt die Ergebnisse nach stdout."
      - Typer baut auf Click auf und erzeugt Hilfe und Fehlermeldungen automatisch – dasselbe, was man mit argparse von Hand konfigurieren würde.
    explanation: |
      Typer liest die Signaturen der Funktionen. Die App hat zwei Unterbefehle, `sortiere` und `statistik`, weil zwei Funktionen mit `@app.command()` markiert sind; ihre Docstrings erscheinen in `sortiere --help` als Beschreibungen. In `sortiere` ist `ordner` ohne Standardwert ein Pflicht-Argument, `apply` und `max_tage` haben Standardwerte und werden zu Optionen – Unterstriche werden zu Bindestrichen, also `--max-tage`. Ein `bool` wird zum Paar `--apply/--no-apply`. `typer.Option(min=0)` prüft den Wertebereich, deshalb endet `--max-tage -1` mit einer Fehlermeldung und Exit-Code `2`, bevor die Funktion überhaupt läuft. `sortiere statistik ~/Downloads` wandelt das Argument in einen `Path` um und gibt pro Kategorie eine Zeile nach stdout aus. `raise typer.Exit(code=1)` ist das Gegenstück zu `return 1` in einem argparse-`main`. Unter der Haube erzeugt Typer Click-Befehle.
    resources:
      - title: Typer · Tutorial
        url: https://typer.tiangolo.com/tutorial/
      - title: Click · Documentation
        url: https://click.palletsprojects.com/

  - id: werkzeug-paketieren
    type: practice
    title: Dein Werkzeug installierbar machen
    prompt: |
      Mache aus dem Downloads-Sortierer des letzten Moduls ein installierbares Werkzeug:

      1. Lege die Struktur `sortiere/pyproject.toml`, `sortiere/src/sortiere/__init__.py` und `sortiere/src/sortiere/cli.py` an. `cli.py` enthält `main(argv: list[str] | None = None) -> int`.
      2. Beschreibe in `pyproject.toml` den Befehl `sortiere` als Einstiegspunkt.
      3. Ergänze `-v`/`-q` für Logging und eine optionale Konfigurationsdatei `~/.config/sortiere/config.toml` mit dem Vorrang CLI > Umgebung > Datei > Standard.
      4. Installiere mit `uv tool install .` und prüfe `sortiere --help` und `sortiere ~/Downloads` (Trockenlauf) in einer neuen Shell.

      Die Musterlösung zeigt die `pyproject.toml`.
    lang: toml
    solution: |
      [project]
      name = "sortiere"
      version = "0.1.0"
      description = "Sortiert den Downloads-Ordner nach Dateityp."
      readme = "README.md"
      requires-python = ">=3.12"
      dependencies = []

      [project.scripts]
      sortiere = "sortiere.cli:main"

      [build-system]
      requires = ["hatchling"]
      build-backend = "hatchling.build"
    checklist:
      - "`sortiere --help` zeigt Beschreibung, alle Optionen und je einen Hilfesatz."
      - "`main` gibt einen Exit-Code zurück; der installierte Befehl liefert `0` im Erfolgsfall und `1` bei Fehlern (`echo $status` in fish)."
      - "`sortiere ~/Downloads -v > /dev/null` zeigt die Logmeldungen trotzdem – sie gehen nach stderr."
      - Ein Wert aus der Konfigurationsdatei wird durch eine Umgebungsvariable und diese durch eine Option überschrieben.
      - Das Werkzeug läuft in einer eigenen Umgebung (`uv tool list` zeigt es) und nicht im System-Python.
    explanation: |
      `[project.scripts]` ist der Standardweg, Python-Code als Befehl auszuliefern: Beim Installieren entsteht in `~/.local/bin` ein kleines Startprogramm, das `sortiere.cli:main` importiert und `sys.exit(main())` aufruft. Der `src`-Aufbau stellt sicher, dass du immer die installierte Version testest und nicht zufällig Dateien aus dem Arbeitsverzeichnis importierst. Mit `uv tool install` bekommt das Werkzeug eine eigene Umgebung – Updates anderer Pakete oder von CachyOS brechen es nicht.
    resources:
      - title: Writing your pyproject.toml
        url: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
      - title: uv · Using tools
        url: https://docs.astral.sh/uv/guides/tools/
