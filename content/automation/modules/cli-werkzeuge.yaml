id: cli-werkzeuge
title: Kommandozeilen-Werkzeuge bauen
level: 2
minutes: 210
summary: Aus einem Skript ein Werkzeug machen, das sich wie ein echtes Unix-Programm verhält – mit argparse, Exit-Codes, stdin/stdout/stderr, Konfiguration mit klarem Vorrang, sauberem Logging und Installation als Befehl.
goals:
  - Du definierst mit `argparse` Positionsargumente, Optionen, Typen, `choices`, `nargs`, Schalter und Unterbefehle und testest den Parser mit `parse_args([...])`.
  - Du trennst Daten (stdout) von Meldungen (stderr), liest aus stdin und lieferst aussagekräftige Exit-Codes.
  - Du lädst Einstellungen aus TOML, Umgebungsvariablen und Argumenten mit dem Vorrang CLI > Umgebung > Datei > Standard.
  - Du konfigurierst `logging` einmal zentral, mit Stufen über `-v`/`-q`, und erklärst, warum Bibliotheken nichts konfigurieren.
  - Du ordnest Typer, Click und Rich ein und installierst ein eigenes Werkzeug mit `[project.scripts]` und `uv tool install`.
