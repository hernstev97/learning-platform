projects:
- id: dateien-ordnen
  title: Dateien mit Vorschau ordnen
  level: 1
  hours: 8
  summary: Ein Organisierer plant Verschiebungen, erkennt Konflikte und protokolliert ausgeführte Aktionen.
  brief: '## Auftrag

    Baue ein CLI, das Dateien aus einem eigens angelegten Testordner nach Dateityp in Unterordner sortiert.
    Der Standardaufruf zeigt nur eine Vorschau. Erst `--apply` führt den Plan aus. Arbeite mit erfundenen
    Dateien, nicht mit deinem echten Downloads-Ordner.


    ## Vertrag

    Überschreibe keine vorhandenen Dateien. Symlinks werden übersprungen und im Bericht genannt. Jeder
    geplante Schritt enthält Quelle, Ziel und Konfliktstatus. Nach einer ausgeführten Verschiebung steht
    ein Journal-Eintrag bereit. Ein Undo-Aufruf darf nur dann zurückverschieben, wenn die protokollierten
    Voraussetzungen noch stimmen; inzwischen geänderte Dateien benötigen eine Konfliktmeldung.


    ## Grenze

    Plan und Wirkung sind getrennte Funktionen. Zwischen beiden prüfst du die wesentlichen Voraussetzungen
    erneut. Ein Journal ist keine vollständige Dateisystemsicherung. Dokumentiere diese Grenze und die
    Einprozess-Annahme.'
  skills:
  - pathlib
  - shutil
  - argparse
  - Dry Run
  - Journal
  steps:
  - id: schritt-1
    title: Testbestand aufbauen
    detail: Erzeuge Dateien mit Leerzeichen, unbekannter Endung, gleichem Namen in Zielordnern und einen
      Symlink in einem temporären Arbeitsbereich.
  - id: schritt-2
    title: Regeln und Plan schreiben
    detail: Eine reine Funktion ordnet erlaubte Endungen Zielkategorien zu. Der Plan enthält noch keine
      Seiteneffekte.
  - id: schritt-3
    title: Vorschau darstellen
    detail: Zeige Konflikte und die Zahl geplanter Aktionen. Ein zweiter Vorschauaufruf darf nichts verändert
      haben.
  - id: schritt-4
    title: Ausführen begrenzen
    detail: Führe nur konfliktfreie Aktionen bei --apply aus. Prüfe vor jedem Schritt, ob Quelle und Ziel
      noch dem Plan entsprechen.
  - id: schritt-5
    title: Journal und Undo
    detail: Protokolliere tatsächliche Erfolge. Ein Undo arbeitet rückwärts und meldet Konflikte, ohne
      neuere Inhalte zu überschreiben.
  - id: schritt-6
    title: Fehlerfälle abnehmen
    detail: Teste fehlende Quelle, belegtes Ziel, Abbruch nach einem Schritt und den erneuten Aufruf.
      Ergänze ein Terminalbeispiel in der README.
  acceptance:
  - id: abnahme-1
    text: Ohne --apply bleiben Dateien und Verzeichnisse unverändert.
  - id: abnahme-2
    text: Keine existierende Zieldatei wird überschrieben.
  - id: abnahme-3
    text: Symlinks werden erkennbar übersprungen.
  - id: abnahme-4
    text: Undo verweigert widersprüchliche Zustände statt neue Daten zu überschreiben.
  - id: abnahme-5
    text: Tests arbeiten ausschließlich in temporären Verzeichnissen.
  stretch:
  - Eine feste Regeldatei mit validierten Zielkategorien ergänzen.
  - Prüfsummen für nachvollziehbare Konflikterkennung hinzufügen.
  portfolio: Zeige Vorschau, Ausführung und einen bewusst erzeugten Undo-Konflikt. Erkläre, weshalb ein
    Dateiorganisierer vor allem ein Vertrag über Seiteneffekte ist.
  capstone: false
- id: berichte
  title: Ein prüfbarer Wochenbericht
  level: 1
  hours: 10
  summary: CSV und optional Excel werden zu einem validierten Bericht mit Fehlerliste und stabilen Summen.
  brief: '## Auftrag

    Ein Team erhält wöchentlich CSV-Dateien mit Vorgangs-ID, Team, Datum und Bearbeitungsminuten. Erstelle
    daraus einen Markdown-Bericht mit Anzahl und Minuten pro Team sowie einer Liste verworfener Zeilen.
    Ein optionaler Adapter kann dieselben Daten aus einer Excel-Arbeitsmappe lesen.


    ## Vertrag

    Die Eingabe enthält Kopfzeilen und UTF-8-Text. Minuten sind nichtnegative Ganzzahlen; IDs sind pro
    Quelle eindeutig. Leere, ungültige und doppelte Zeilen werden nach einer dokumentierten Regel behandelt.
    Der Bericht enthält Datenzeitraum, Quelldatei und Zähler, damit Summen nachprüfbar bleiben. Eine bestehende
    Ausgabedatei wird erst nach vollständiger erfolgreicher Berichtserstellung ersetzt.


    ## Übungsrahmen

    Verwende erfundene Vorgänge. Excel-Unterstützung ist ein lokaler Projektteil mit einer passenden Bibliothek;
    sie wird nicht als im Browser ausführbare Übung vorausgesetzt.'
  skills:
  - csv
  - Validierung
  - Aggregation
  - Markdown
  - Tests
  steps:
  - id: schritt-1
    title: Eingabevertrag festlegen
    detail: Notiere erlaubte Spalten, Datumformat und Behandlung doppelter IDs. Erzeuge kleine erwartete
      Berichte von Hand.
  - id: schritt-2
    title: Parser und Normalform
    detail: Lies CSV mit dem csv-Modul. Trenne Zeilenposition, Rohdaten und validierten Datensatz.
  - id: schritt-3
    title: Validierung und Fehlerliste
    detail: Melde fehlende Spalten, ungültige Zahlen und doppelte IDs mit Quelle und Zeilennummer.
  - id: schritt-4
    title: Aggregation entwickeln
    detail: Berechne Summen mit reinen Funktionen. Prüfe leere Eingabe und mehrere Teams.
  - id: schritt-5
    title: Bericht rendern
    detail: Sorge für stabile Sortierung und sichere Behandlung von Markdown-Sonderzeichen in Namen.
  - id: schritt-6
    title: CLI und Abnahme
    detail: Teste Ausgabepfad und Fehlercode. Zeige Normalfall und Fehlerbericht in der README; führe
      denselben Lauf zweimal aus.
  acceptance:
  - id: abnahme-1
    text: Ein kleiner Beispieldatensatz ergibt die von Hand berechneten Summen.
  - id: abnahme-2
    text: Verworfene Zeilen bleiben mit Gründen nachvollziehbar.
  - id: abnahme-3
    text: Gleiche Eingabe ergibt fachlich denselben Bericht.
  - id: abnahme-4
    text: Bestehende Ausgabe bleibt bei einem Parserfehler unbeschädigt.
  - id: abnahme-5
    text: Installation und Beispielaufruf sind aus frischem Checkout dokumentiert.
  stretch:
  - Excel-Adapter mit getrennten Tests hinzufügen.
  - Einen Vorwochenvergleich mit klarer Definition fehlender Teams ergänzen.
  portfolio: Präsentiere Eingabe, Fehlerliste und Bericht gemeinsam. Zeige eine Randfallentscheidung und
    den Test dafür; bunte Diagramme sind kein Ersatz für überprüfbare Daten.
  capstone: false
- id: api-melder
  title: Änderungen erkennen und gezielt melden
  level: 2
  hours: 20
  summary: Ein API-Poller erkennt neue Ereignisse, speichert Zustand und erzeugt kontrollierte Benachrichtigungen.
  brief: '## Auftrag

    Baue ein CLI, das aus einer genehmigten API eine paginierte Liste von Ereignissen abruft und neue
    Ereignisse in einem Bericht zusammenfasst. Entwickle zunächst mit JSON-Fixtures und einem Fake-Sender.
    Danach kann ein bewusst konfigurierter ntfy- oder anderer Nachrichtenadapter verwendet werden.


    ## Vertrag

    Die fachliche Identität eines Ereignisses kommt aus der Quelle, nicht aus seiner Position auf einer
    Seite. Speichere bekannte IDs und ausstehende Zustellungen in SQLite. Kein Ereignis darf bei einem
    Wiederanlauf still verloren gehen. Definiere, ob und wann doppelte Nachrichten möglich sind; ohne
    passenden Empfängervertrag solltest du keine Exactly-once-Zustellung versprechen.


    ## Betrieb

    Ein systemd-Timer startet das Werkzeug mit explizitem Arbeitsverzeichnis und Konfiguration. Echte
    Zugangsdaten bleiben außerhalb des Repositorys. Die normale Testausführung sendet keine externen Nachrichten.
    Timeouts, maximale Seitenzahl, begrenzte Wiederholungen und ein sichtbarer letzter Erfolg gehören
    zum Ablauf.'
  skills:
  - HTTP
  - Pagination
  - SQLite
  - Fakes
  - Benachrichtigungen
  - systemd
  steps:
  - id: schritt-1
    title: Ereignisvertrag und Fixtures
    detail: Erzeuge mehrere Seiten, doppelte IDs, leere Ergebnisse und einen Fehlerfall. Lege den Normaldatensatz
      fest.
  - id: schritt-2
    title: Abrufadapter
    detail: Setze Timeouts, Statusprüfung, Seitenlimit und erkenne wiederholte Cursor. Der Fake bildet
      dieselbe Schnittstelle ab.
  - id: schritt-3
    title: Änderungen bestimmen
    detail: Vergleiche stabile IDs. Eine reine Funktion erstellt Nachrichtenkandidaten ohne Versand.
  - id: schritt-4
    title: Zustand und Outbox
    detail: Speichere Ereignisse und geplante Zustellungen konsistent. Definiere Statusübergänge für ausstehend
      und zugestellt.
  - id: schritt-5
    title: Sender ergänzen
    detail: Verwende zuerst einen Fake. Der reale Adapter wird nur bei expliziter Konfiguration verwendet
      und loggt keine Geheimnisse.
  - id: schritt-6
    title: Fehlerbudget testen
    detail: Prüfe temporäre und dauerhafte Fehler sowie Absturz nach Annahme einer Nachricht. Dokumentiere
      verbleibende Duplikatmöglichkeiten.
  - id: schritt-7
    title: Timer und Diagnose
    detail: Erstelle Service/Timer mit absoluten Pfaden. Prüfe manuell Start, Journal, Fehlercode und
      konkurrierenden Start.
  - id: schritt-8
    title: Übergabe schreiben
    detail: Ein Runbook beschreibt letzte Erfolge, Neustart, gezielte Wiederholung und das Abschalten
      des Senders.
  acceptance:
  - id: abnahme-1
    text: Unit-Tests benötigen kein Netzwerk und versenden nichts.
  - id: abnahme-2
    text: Gleiche Ereignisse werden beim zweiten Abruf nicht erneut eingeplant.
  - id: abnahme-3
    text: Pagination hat eine kontrollierte Obergrenze und erkennt Schleifen.
  - id: abnahme-4
    text: Fehlerstatus und letzter Erfolg sind eindeutig unterscheidbar.
  - id: abnahme-5
    text: Ein Abbruch lässt offene Zustellungen nachvollziehbar zurück.
  - id: abnahme-6
    text: Timer und manueller Aufruf verwenden denselben fachlichen Ablauf.
  stretch:
  - Eine zweite Quelle mit eigenem Adapter ergänzen.
  - Zusammenfassung pro Zeitfenster statt Einzelmeldungen anbieten.
  portfolio: Führe den zweiten identischen Abruf und einen simulierten Zustellfehler vor. Erkläre die
    Lücke zwischen „Dienst hat angenommen“ und „lokal als zugestellt gespeichert“.
  capstone: false
- id: abschluss-team-digest
  title: Team-Digest als betreibbarer Dienst
  level: 3
  hours: 40
  summary: Ein täglicher Teambericht verbindet zwei Quellen, persistierten Fortschritt und einen kontrollierten
    Versand.
  brief: '## Auftrag

    Ein kleines Entwicklungsteam möchte Änderungen aus einem ausgewählten GitHub-Repository und einem
    freigegebenen RSS-Feed zusammen sehen. Liefere einen täglich erzeugten Digest als Markdown und HTML.
    Der Dienst soll neue Informationen zuverlässig sammeln, Dubletten vermeiden und nach einem Fehler
    fortgesetzt werden können. Eine Weboberfläche ist nicht Teil der Aufgabe.


    ## Fachliche Anforderungen

    Normalisiere beide Quellen in Ereignisse mit Quell-ID, Titel, Link und eindeutigem Zeitpunkt. Ein
    Bericht deckt einen expliziten Zeitraum ab und behält dieselbe Kennung bei Wiederholung. Speichere
    Ereignisse, Cursor, Berichte und offene Zustellungen in SQLite. Zeige, welche Quelle aktuell erfolgreich
    ist und welche fehlgeschlagen ist. Leere erfolgreiche Ergebnisse dürfen nicht mit Ausfällen verwechselt
    werden.


    ## Technischer Rahmen

    Ein Python-CLI bietet `fetch`, `report`, `send` und `run` sowie Vorschau beziehungsweise Dry Run.
    TOML enthält nicht geheime Einstellungen, Umgebungsvariablen die Zugangsdaten. HTTP-Adapter haben
    Timeouts, begrenzte Retry-Regeln mit Backoff und ein dokumentiertes Gesamtbudget. Logs enthalten Lauf-ID,
    Phase und Ergebnis, aber keine Token oder vollständigen persönlichen Payloads.


    Die Tests arbeiten mit kontrollierten Fixtures und Fakes. Das Projekt umfasst zwei dokumentierte Betriebswege:
    einen systemd-Timer mit persistenter lokaler Datenbank und einen GitHub-Actions-Zeitplan. Wähle im
    Actions-Betrieb bewusst, wo veränderlicher Zustand zwischen frischen Runnern dauerhaft liegt. Ein
    lokaler Dateipfad oder Abhängigkeitscache allein ist dafür kein belastbarer Vertrag. Für die Abgabe
    reicht ein nachvollziehbar getesteter, ausdrücklich begrenzter Demo-Modus, sofern der produktive Zustandspfad
    separat erklärt wird.


    ## Optionale KI

    Eine Modell-Zusammenfassung ist eine Zusatzaufgabe. Die normale Berichtserstellung funktioniert deterministisch
    ohne Modell. Eine KI-Erweiterung muss Ausgabeformat, Quellbezug, Budget und Fehlerpfad prüfen. Abgerufene
    Texte dürfen keine neuen Ausführungsrechte vergeben.


    ## Übergabe

    Abzugeben sind Repository, Beispieldaten, Tests, CI, Konfiguration ohne Geheimnisse, Architekturentscheidungen
    und ein Runbook. Die Demo zeigt Erstlauf, identischen Wiederholungslauf, Quellenausfall, Wiederanlauf
    und Bericht. Reale Benachrichtigungen brauchen einen bewusst gewählten Testempfänger; die Abnahme
    kann vollständig mit Fake-Sender erfolgen.


    Quellen: [GitHub REST](https://docs.github.com/en/rest), [Actions-Zeitpläne](https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows),
    [Python sqlite3](https://docs.python.org/3/library/sqlite3.html), [systemd-Timer](https://www.freedesktop.org/software/systemd/man/latest/systemd.timer.html).'
  skills:
  - HTTP
  - RSS
  - SQLite
  - Idempotenz
  - CLI
  - Logging
  - pytest
  - systemd
  - GitHub Actions
  steps:
  - id: schritt-1
    title: Vertrag und Abnahmedaten
    detail: Definiere Berichtzeitraum, Identitäten und Verhalten bei Teilfehlern. Bereite Fixtures für
      Erfolg, Leere, Duplikate, Limit und ungültige Daten vor.
  - id: schritt-2
    title: Projekt und Konfiguration
    detail: Lege reproduzierbare Abhängigkeiten, TOML-Schema und Vorrangregeln fest. Konfigurationsfehler
      werden vor I/O sichtbar.
  - id: schritt-3
    title: Quellenadapter
    detail: Implementiere GitHub- und RSS-Adapter unabhängig voneinander. Begrenze Antwortgröße und Seiten,
      validiere normalisierte Daten.
  - id: schritt-4
    title: Persistenz und Wiederanlauf
    detail: Definiere eindeutige Schlüssel, Cursor und Transaktionen. Teste einen Abbruch vor und nach
      der Persistenzgrenze.
  - id: schritt-5
    title: Bericht als reine Transformation
    detail: Baue Markdown/HTML aus gespeicherten Ereignissen mit stabiler Sortierung. Behandle Sonderzeichen
      als Daten und zeige den Zeitraum.
  - id: schritt-6
    title: Zustellungen modellieren
    detail: Plane Versand in einer Outbox und baue einen Fake-Sender. Dokumentiere Annahmebestätigung,
      möglichen Timeout und Duplikatgrenzen.
  - id: schritt-7
    title: Robustheit und Diagnose
    detail: Füge begrenzte Wiederholungen, Lauf-IDs, Fehlerklassifikation und letzten fachlichen Erfolg
      hinzu. Ein unabhängiger Check erkennt fehlende Erfolge.
  - id: schritt-8
    title: CLI und Dry Run
    detail: Alle Unterbefehle nutzen dieselbe Logik. Ein Trockenlauf zeigt Aktionen und darf weder Berichtzustand
      fortschreiben noch Nachrichten senden.
  - id: schritt-9
    title: Beide Betriebswege
    detail: Teste systemd-Service/Timer und einen manuell ausgelösten Actions-Lauf. Dokumentiere Zeitzone,
      konkurrierende Läufe und dauerhaften Zustand pro Betriebsweg.
  - id: schritt-10
    title: Qualität und Übergabe
    detail: CI prüft Tests, Typen und Stil mit Fixtures. Führe README und Runbook aus einem frischen Checkout
      aus und dokumentiere gemessene Grenzen.
  acceptance:
  - id: abnahme-1
    text: Die zwei Quellen liefern über getrennte Adapter dasselbe validierte Ereignismodell.
  - id: abnahme-2
    text: Ein identischer Wiederholungslauf erzeugt keine zusätzlichen Ereignisse oder geplanten Berichte.
  - id: abnahme-3
    text: Quellenausfall und leere erfolgreiche Antwort sind in Bericht und Status unterscheidbar.
  - id: abnahme-4
    text: Nach simuliertem Abbruch kann ein Lauf ohne Datenverlust fortgesetzt werden; mögliche doppelte Zustellung
      ist dokumentiert.
  - id: abnahme-5
    text: Timeouts, Retry- und Seitenbudgets sind begrenzt und mit Fakes getestet.
  - id: abnahme-6
    text: Dry Run verursacht keine externen Änderungen und verändert den fachlichen Fortschrittsstand nicht.
  - id: abnahme-7
    text: Tests und CI sind deterministisch, enthalten keine echten Geheimnisse und senden keine Nachrichten.
  - id: abnahme-8
    text: Beide Scheduler-Wege haben einen dokumentierten und geprüften Vertrag für Zustand, Zeitzone und konkurrierende
      Läufe.
  - id: abnahme-9
    text: Runbook beschreibt fehlgeschlagenen Lauf, ausgebliebenen Lauf, Wiederanlauf und Abschalten des Versands.
  - id: abnahme-10
    text: README zeigt Installation, Demo, Entscheidungen und ausdrücklich benannte Grenzen.
  stretch:
  - Optionale Modellzusammenfassung mit strukturiertem Ergebnis, deterministischer Validierung und hartem
    Kostenbudget.
  - Ein Empfänger mit Idempotenzschlüssel-Unterstützung zur Verringerung von Zustellduplikaten.
  - Lasttest mit vielen Ereignissen und Messung von Laufzeit und Speicher.
  portfolio: Erzähle die Geschichte eines Ereignisses von der Quelle bis zum Bericht. Zeige danach den
    Ausfall derselben Quelle und den Wiederanlauf. Erkläre zwei Abwägungen, etwa Persistenz bei frischen
    CI-Runnern und Zustellgarantien. Berichte nur gemessene Zeitersparnis und kennzeichne Testdaten und
    Schätzungen.
  capstone: true
