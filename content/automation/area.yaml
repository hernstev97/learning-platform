id: automation
title: Automation mit Python
short: Automation
tagline: Wiederkehrende Arbeit einmal lösen – und dann nie wieder.
description: >
  Dateien und Ordner, Kommandozeilen-Werkzeuge, Prozesse, Datenformate mit Excel,
  reguläre Ausdrücke, Web-APIs mit Authentifizierung, Scraping und
  Browser-Automatisierung, Postfach und Kalender, zeitgesteuerte Jobs,
  Benachrichtigungen, robuste Fehlerbehandlung mit ausführbaren Fehlerfällen,
  Logs und Geheimnisse, Deployment mit CI und KI-gestützte Automatisierung.
  Module „Am PC“ brauchen einen Rechner, etwa für Playwright; ihre Lektionen
  lassen sich auch unterwegs lesen.
color: "#2BD97C"
order: 5
outcomes:
  - Du erkennst, was sich zu automatisieren lohnt, und baust Skripte sicher, idempotent und mit Trockenlauf.
  - Du automatisierst Dateien, Ordner, Tabellen, JSON, YAML und Excel.
  - Du baust saubere Kommandozeilen-Werkzeuge mit argparse oder Typer, Logging und Konfiguration.
  - Du sprichst Web-APIs robust an – mit API-Keys, OAuth 2.0 und Webhook-Signaturen, Paginierung, Wiederholungen und Rate Limits.
  - Du liest Postfächer per IMAP, verarbeitest Anhänge sicher und erzeugst Termine als ICS.
  - Du planst Jobs mit cron oder systemd-Timern und lässt sie mit GitHub Actions laufen.
  - Du setzt LLM-APIs verantwortungsvoll in Automatisierungen ein.
tracks:
  - title: Grundlagen
    description: Denken wie ein Automatisierer, Dateien, Kommandozeile und externe Programme.
    modules: [automatisieren-denken, dateien-ordner, cli-werkzeuge, prozesse-shell]
  - title: Daten & Web
    description: Formate mit Excel, Text, APIs mit Authentifizierung, Scraping und Browser-Steuerung.
    modules: [datenformate, regex-text, web-apis, api-authentifizierung, scraping-browser]
  - title: Betrieb
    description: Zeitsteuerung, Benachrichtigungen, Postfach und Kalender, Robustheit mit ausführbaren Fehlerfällen, Logs und Geheimnisse, Deployment und KI.
    modules: [zeitsteuerung, benachrichtigungen, postfach-kalender, robustheit, fehlerfaelle, logs-geheimnisse, deployment-ci, ki-automatisierung]
