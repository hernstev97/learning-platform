id: automation
title: Automation mit Python
short: Automation
tagline: Wiederkehrende Arbeit einmal lösen – und dann nie wieder.
description: >
  Dateien und Ordner, Kommandozeilen-Werkzeuge, Prozesse, Datenformate,
  reguläre Ausdrücke, Web-APIs, Scraping und Browser-Automatisierung,
  zeitgesteuerte Jobs, Benachrichtigungen, robuste Fehlerbehandlung,
  Deployment mit CI und KI-gestützte Automatisierung.
color: "#2BD97C"
order: 5
outcomes:
  - Du erkennst, was sich zu automatisieren lohnt, und baust Skripte sicher, idempotent und mit Trockenlauf.
  - Du automatisierst Dateien, Ordner, Tabellen, JSON, YAML und Excel.
  - Du baust saubere Kommandozeilen-Werkzeuge mit argparse oder Typer, Logging und Konfiguration.
  - Du sprichst Web-APIs robust an – mit Authentifizierung, Paginierung, Wiederholungen und Rate Limits.
  - Du planst Jobs mit cron oder systemd-Timern und lässt sie mit GitHub Actions laufen.
  - Du setzt LLM-APIs verantwortungsvoll in Automatisierungen ein.
tracks:
  - title: Grundlagen
    description: Denken wie ein Automatisierer, Dateien, Kommandozeile und externe Programme.
    modules: [automatisieren-denken, dateien-ordner, cli-werkzeuge, prozesse-shell]
  - title: Daten & Web
    description: Formate, Text, APIs, Scraping und Browser-Steuerung.
    modules: [datenformate, regex-text, web-apis, scraping-browser]
  - title: Betrieb
    description: Zeitsteuerung, Benachrichtigungen, Robustheit, Deployment und KI.
    modules: [zeitsteuerung, benachrichtigungen, robustheit, deployment-ci, ki-automatisierung]
