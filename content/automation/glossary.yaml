terms:
- term: Idempotenz
  definition: Mehrfache Ausführung derselben Operation hat hinsichtlich des vereinbarten Zustands dieselbe
    Wirkung wie eine Ausführung.
- term: Dry Run
  definition: Vorschau der geplanten Änderungen ohne ihre Ausführung.
- term: Seiteneffekt
  definition: Beobachtbare Wirkung außerhalb eines Rückgabewerts, etwa Dateischreiben oder Nachrichtenversand.
- term: Pure Function
  definition: Funktion, deren Ergebnis nur von Eingaben abhängt und die keine externen Zustände verändert.
- term: Atomic Replace
  definition: Ersetzen eines Dateinamens in einem atomaren Dateisystemschritt; weitergehende Dauerhaftigkeit
    ist eine eigene Frage.
- term: Journal
  definition: Nachvollziehbare Aufzeichnung geplanter oder abgeschlossener Aktionen.
- term: Path Traversal
  definition: Eingaben verlassen über Pfadbestandteile den vorgesehenen Arbeitsbereich.
- term: Symlink
  definition: Dateisystemverweis auf einen anderen Pfad; relevant für Prüfung von Arbeitsbereichsgrenzen.
- term: Exit-Code
  definition: Numerisches Prozessergebnis, mit dem Erfolg oder definierte Fehlerklassen signalisiert werden.
- term: stdout
  definition: Standardausgabe eines Prozesses, üblicherweise für das weiterverarbeitbare Ergebnis.
- term: stderr
  definition: Standardfehlerausgabe, üblicherweise für Diagnose und Fehlermeldungen.
- term: Shell Injection
  definition: Eingabedaten werden unbeabsichtigt als Shell-Syntax interpretiert.
- term: Timeout
  definition: Zeitgrenze für eine Operation; ein Timeout beschreibt nicht immer ihren tatsächlichen externen
    Ausgang.
- term: Configuration Precedence
  definition: Festgelegte Vorrangreihenfolge mehrerer Konfigurationsquellen.
- term: Structured Logging
  definition: Logs mit definierten Feldern statt nur freiem Text.
- term: Correlation ID
  definition: Kennung, die zusammengehörige Ereignisse eines Ablaufs verbindet.
- term: CSV
  definition: Textformat für tabellarische Daten mit Regeln für Trennzeichen, Quotes und Zeilenumbrüche.
- term: JSON
  definition: Textformat für strukturierte Werte wie Objekte, Arrays, Zahlen und Strings.
- term: Schema
  definition: Explizite Beschreibung erlaubter Struktur, Typen und gegebenenfalls Wertebereiche.
- term: YAML Safe Loader
  definition: Parsermodus, der gewöhnliche Datenstrukturen statt beliebiger Python-Objekte konstruiert.
- term: Regex
  definition: Formale Mustersprache zur Suche oder Prüfung von Text.
- term: Greedy Quantifier
  definition: Quantifizierer, der zuerst möglichst viel Text erfassen möchte, sofern der Rest des Musters
    passt.
- term: Catastrophic Backtracking
  definition: Explosives Wachstum der Sucharbeit bei problematischen regulären Ausdrücken und Eingaben.
- term: HTTP Status
  definition: Antwortcode zur groben Einordnung eines HTTP-Ergebnisses.
- term: Rate Limit
  definition: Vom Dienst gesetzte Grenze der erlaubten Anfragen in einem Zeitraum oder Budget.
- term: Backoff
  definition: Wachsende Pause zwischen erneuten Versuchen.
- term: Jitter
  definition: Zufällige Variation von Wartezeiten, um gleichzeitig arbeitende Clients zu verteilen.
- term: Retry-After
  definition: HTTP-Hinweis, wann ein weiterer Versuch nach Dienstvorgabe erfolgen darf.
- term: Cursor
  definition: Position beziehungsweise Fortsetzungsmarke in einer paginierten Ergebnismenge.
- term: Idempotency Key
  definition: Stabile Kennung eines fachlichen Vorgangs, anhand derer ein Dienst Wiederholungen erkennen
    kann.
- term: Webhook
  definition: Vom Anbieter ausgelöster HTTP-Aufruf bei einem Ereignis; Empfang ist noch kein Beleg vollständiger
    Verarbeitung.
- term: Polling
  definition: Wiederholtes aktives Abfragen eines Zustands oder einer Quelle.
- term: Scraping
  definition: Extraktion strukturierter Daten aus einer für Menschen gedachten Darstellung.
- term: Locator
  definition: Beschreibung eines UI-Elements, mit der Browserautomation es erneut finden kann.
- term: Cron
  definition: Zeitplanbasierter Start von Befehlen nach Kalenderfeldern.
- term: systemd Timer
  definition: Timer-Unit, die etwa nach Kalender- oder monotoner Zeit eine andere Unit aktiviert.
- term: IANA-Zeitzone
  definition: Benannte Zeitzone mit historischen und zukünftigen Übergangsregeln, etwa `Europe/Berlin`.
- term: DST
  definition: Saisonale Änderung der lokalen Uhrzeit; kann fehlende oder doppelte lokale Zeiten erzeugen.
- term: Lock
  definition: Mechanismus, der konkurrierende Nutzung einer Ressource nach einem definierten Vertrag begrenzt.
- term: Checkpoint
  definition: Gespeicherter Stand nachweislich abgeschlossener Arbeit für einen Wiederanlauf.
- term: Outbox
  definition: Persistente Liste noch zu versendender Ereignisse, die zusammen mit fachlichen Daten gespeichert
    werden kann.
- term: Deduplication
  definition: Erkennen mehrfach empfangener oder verarbeiteter fachlich gleicher Ereignisse.
- term: Heartbeat
  definition: Regelmäßiges Lebenszeichen; sein Ausbleiben kann unabhängig vom Job selbst erkannt werden.
- term: Runbook
  definition: Konkrete Betriebsanleitung für Diagnose, Wiederanlauf, Rücknahme und Eskalation.
- term: Fake
  definition: Vereinfachte kontrollierte Implementierung einer Abhängigkeit für Tests.
- term: Prompt Injection
  definition: Fremde Eingabedaten versuchen, die vorgesehenen Regeln oder Aktionen eines Modells zu verändern.
- term: Output Validation
  definition: Deterministische Prüfung einer Ausgabe gegen Format und fachliche Grenzen.
- term: Fallback
  definition: Definierter Ersatzpfad bei Ausfall oder ungültigem Ergebnis einer Abhängigkeit.
